    # 概率分布


    ## 高斯分布


    如果 $X \sim \mathcal{N}(0,1)$，我们称 $X$ 服从标准正态分布。高斯分布是在统计学中应用最广泛的分布。主要原因有以下几点：


    1.  它有两个易于解释的参数，能够捕捉分布最基本的性质，即均值和方差。

    2.  根据中心极限定理（见第 TODO 节），独立随机变量的和近似服从高斯分布，这使其成为建模残差误差或噪声的良好选择。

    3.  在给定均值和方差的约束下，高斯分布做出的假设最少（具有最大熵），正如第 TODO 节所示；这使其成为许多情况下的良好默认选择。

    4.  它具有简单的数学形式，由此产生易于实现且通常非常有效的方法，我们将在后续看到。关于高斯分布为何被广泛使用的更广泛讨论，请参见 (Jaynes 2003,
    ch 7)。


    ## Student''s t 分布


    其中 $\Gamma(x)$ 是伽马函数：

    $$

    \Gamma(x) = \int_0^\infty t^{x-1}e^{-t}dt \tag{2.24}

    $$


    $\mu$ 是均值，$\sigma^2 > 0$ 是尺度参数，$\nu > 0$ 称为自由度。请参见图 2.1 查看部分图示。方差仅在 $\nu > 2$
    时定义。均值仅在 $\nu > 1$ 时定义。


    作为 Student 分布鲁棒性的一个例证，请考虑图 2.2。我们看到高斯分布受影响很大，而 Student 分布几乎不变。这是因为 Student 分布具有更重的尾部，特别是对于较小的
    $\nu$（见图 2.1）。


    如果 $\nu = 1$，该分布称为柯西分布或洛伦兹分布。它以尾部如此之重以至于定义均值的积分不收敛而著称。


    为保证方差有限，我们要求 $\nu > 2$。通常使用 $\nu = 4$，这在一系列问题中表现良好 (Lange et al. 1989)。当 $\nu
    \ge 5$ 时，Student 分布迅速接近高斯分布并失去其鲁棒性。


    ![图 2.1(a)](image_rsrc1PH.jpg)

    ![图 2.1(b)](image_rsrc1PJ.jpg)


    **图 2.1:** (a) $\mathcal{N}(0,1)$、$T(0,1,1)$ 和 $\text{Lap}(0,1/\sqrt{2})$ 的概率密度函数。高斯和拉普拉斯分布的均值为
    0，方差为 1。当 $\nu=1$ 时，Student 分布的均值和方差未定义。(b) 这些 pdf 的对数。注意 Student 分布对任何参数值都不是对数凹的，而拉普拉斯分布总是向内对数凹（且对数凸……）尽管如此，两者都是单峰的。


    **表 2.5: 拉普拉斯分布总结**


    | 写作 | $f(x)$ | $\mathbb{E}[X]$ | mode | $\text{var}[X]$ |

    | :--- | :--- | :--- | :--- | :--- |

    | $X \sim \text{Lap}(\mu, b)$ | $\frac{1}{2b}\exp\left(-\frac{|x-\mu|}{b}\right)$
    | $\mu$ | $\mu$ | $2b^2$ |


    ![图 2.2(a)](image_rsrc1PK.jpg)

    ![图 2.2(b)](image_rsrc1PM.jpg)


    **图 2.2:** 异常值对拟合高斯、Student 和拉普拉斯分布影响的图示。(a) 无异常值（高斯和 Student 曲线重叠）。(b) 有异常值。我们看到高斯分布比
    Student 和拉普拉斯分布更受异常值影响。


    ### 2.4.3 拉普拉斯分布


    这里 $\mu$ 是位置参数，$b > 0$ 是尺度参数。请参见图 2.1 查看图示。其对异常值的鲁棒性在图 2.2 中展示。它也比高斯分布在 0 处赋予更多的概率密度。这一特性是鼓励模型稀疏性的有用方法，正如我们将在第
    TODO 节中发现的。


    ## 2.4.4 伽马分布


    **表 2.6: 伽马分布总结**


    | 写作 | $f(x)$ | $\mathbb{E}[X]$ | mode | $\text{var}[X]$ |

    | :--- | :--- | :--- | :--- | :--- |

    | $X \sim \text{Ga}(a,b)$ | $\frac{b^a}{\Gamma(a)} x^{a-1} e^{-bx}$ | $\frac{a}{b}$
    | $\frac{a-1}{b}$ (若 $a \ge 1$ 否则为 0) | $\frac{a}{b^2}$ |


    这里 $a > 0$ 称为形状参数，$b > 0$ 称为速率参数。请参见图 2.3 查看部分图示。


    ![图 2.3(a)](image_rsrc1PN.jpg)

    ![图 2.3(b)](image_rsrc1PP.jpg)


    **图 2.3:** (a) 一些 $\text{Ga}(a, b=1)$ 分布。如果 $a \le 1$，众数在 0，否则大于 0。随着速率 $b$ 的增加，我们压缩水平尺度，从而将所有内容向左和向上挤压。(b)
    一些降雨数据的经验 pdf，叠加了拟合的伽马分布。


    ## 2.4.5 Beta 分布


    **表 2.7: Beta 分布总结**


    | 写作 | $f(x)$ | $\mathbb{E}[X]$ | mode | $\text{var}[X]$ |

    | :--- | :--- | :--- | :--- | :--- |

    | $X \sim \text{Beta}(a, b)$ | $\frac{1}{B(a,b)} x^{a-1}(1-x)^{b-1}$ | $\frac{a}{a+b}$
    | $\frac{a-1}{a+b-2}$ | $\frac{ab}{(a+b)^2(a+b+1)}$ |


    这里 $B(a,b)$ 是 Beta 函数：

    $$

    B(a,b) \triangleq \frac{\Gamma(a)\Gamma(b)}{\Gamma(a+b)} \tag{2.25}

    $$


    请参见图 2.4 查看部分 Beta 分布的图示。我们要求 $a,b > 0$ 以保证分布可积（即保证 $B(a,b)$ 存在）。如果 $a = b = 1$，我们得到均匀分布。如果
    $a$ 和 $b$ 都小于 1，我们得到一个在 0 和 1 处有尖峰的双峰分布；如果 $a$ 和 $b$ 都大于 1，分布是单峰的。


    ![图 2.4](image_rsrc1PR.jpg)


    **图 2.4:** 一些 Beta 分布。


    ## 2.4.6 Pareto 分布


    Pareto 分布用于建模表现出长尾（也称为重尾）的量的分布。当 $k \to \infty$ 时，分布趋近于 $\delta(x-m)$。请参见图 2.5(a)
    查看部分图示。如果我们在对数-对数尺度上绘制分布，它形成一条直线，形式为 $\log p(x) = a \log x + c$，其中 $a$ 和 $c$ 为某些常数。请参见图
    2.5(b) 进行说明（这称为幂律）。


    **表 2.8: Pareto 分布总结**


    | 写作 | $f(x)$ | $\mathbb{E}[X]$ | mode | $\text{var}[X]$ |

    | :--- | :--- | :--- | :--- | :--- |

    | $X \sim \text{Pareto}(k, m)$ | $\frac{k m^k}{x^{k+1}} \mathbb{I}(x \ge m)$ |
    $\frac{km}{k-1}$ (若 $k > 1$) | $m$ | $\frac{m^2 k}{(k-1)^2(k-2)}$ (若 $k > 2$)
    |


    ![图 2.5(a)](image_rsrc1PS.jpg)

    ![图 2.5(b)](image_rsrc1PT.jpg)


    **图 2.5:** (a) Pareto 分布 $\text{Pareto}(x|m,k)$，其中 $m=1$。(b) 对数-对数尺度上的 pdf。


    # 2.5 联合概率分布


    给定一个多元随机变量或随机向量 $X \in \mathbb{R}^D$，联合概率分布是一个概率分布，它给出了 $X_1, X_2, \dots, X_D$
    每一个落在为该变量指定的特定范围或离散值集合中的概率。对于只有两个随机变量的情况，这称为二元分布，但该概念推广到任意数量的随机变量，给出多元分布。联合概率分布可以用联合累积分布函数表示，或者用联合概率密度函数（针对连续变量）或联合概率质量函数（针对离散变量）表示。


    ## 2.5.1 协方差与相关性


    **定义 2.6.** 两个随机变量 $X$ 和 $Y$ 之间的协方差衡量 $X$ 和 $Y$ 的（线性）相关程度。协方差定义为：

    $$

    \text{cov}[X,Y] \triangleq \mathbb{E}[(X - \mathbb{E}[X])(Y - \mathbb{E}[Y])]
    \tag{2.26}

    = \mathbb{E}[XY] - \mathbb{E}[X]\mathbb{E}[Y]

    $$


    **定义 2.7.** 如果 $X$ 是一个 $D$ 维随机向量，其协方差矩阵定义为以下对称、半正定矩阵：

    $$

    \text{cov}[X] \triangleq \mathbb{E}[(X - \mathbb{E}[X])(X - \mathbb{E}[X])^T]
    \tag{2.27}

    $$


    $$

    \Sigma = \begin{pmatrix}

    \text{var}[X_1] & \text{Cov}[X_1,X_2] & \cdots & \text{Cov}[X_1,X_D] \\

    \text{Cov}[X_2,X_1] & \text{var}[X_2] & \cdots & \text{Cov}[X_2,X_D] \\

    \vdots & \vdots & \ddots & \vdots \\

    \text{Cov}[X_D,X_1] & \text{Cov}[X_D,X_2] & \cdots & \text{var}[X_D]

    \end{pmatrix} \tag{2.28}

    $$


    （$\Sigma$ 是对称的）。对角协方差矩阵有 $D$ 个参数，非对角项为 0。球形或各向同性协方差 $\Sigma = \sigma^2 I_D$ 有一个自由参数。


    ### 2.5.3 多元 Student''s t 分布


    **定义 2.8.** $X$ 和 $Y$ 之间的（Pearson）相关系数定义为：

    $$

    \text{corr}[X,Y] \triangleq \frac{\text{Cov}[X,Y]}{\sqrt{\text{var}[X], \text{var}[Y]}}
    \tag{2.29}

    $$


    相关矩阵的形式为：

    $$

    R \triangleq \begin{pmatrix}

    \text{corr}[X_1,X_1] & \text{corr}[X_1,X_2] & \cdots & \text{corr}[X_1,X_D] \\

    \text{corr}[X_2,X_1] & \text{corr}[X_2,X_2] & \cdots & \text{corr}[X_2,X_D] \\

    \vdots & \vdots & \ddots & \vdots \\

    \text{corr}[X_D,X_1] & \text{corr}[X_D,X_2] & \cdots & \text{corr}[X_D,X_D]

    \end{pmatrix}

    $$


