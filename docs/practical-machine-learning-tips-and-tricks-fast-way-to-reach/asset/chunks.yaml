    \n### 8.4.5 残差检验 (异常检测)\n\n## 8.5 在线学习和随机优化\n\n传统上 AI 是离线执行的，然而，假设我们有流式数据，我们确实需要执行在线学习，这样我们就可以在每个新数据点出现时更新我们的估计，而不是延迟到最后\
