    \ :--- | :--- |\n| `⌊x⌋` | Floor of `x`, i.e., round down to closest integer |\n\
    | `⌈x⌉` | Ceiling of `x`, i.e., round up to closest integer |\n| `x * y` | Convolution\
    \ of `x` and `y` |\n| `x ⊙ y` | Hadamard (elementwise) product of `x` and `y`\
    \ |\n| `a ∧ b` | Logical AND |\n| `a ∨ b` | Logical OR |\n| `¬a` | Logical NOT\
    \ |\n| `I(x)` | Indicator function, `I(x) = 1` if `x` is true, else `I(x) = 0`\
    \ |\n| `∞` | Infinity |\n| `→` | Tends towards, e.g., `n → ∞` |\n| `∝` | Proportional\
    \ to, so `y = ax` can be written as `y ∝ x` |\n| `\\|x\\|` | Absolute value |\n\
    | `\\|S\\|` | Size (cardinality) of a set |\n| `n!` | Factorial function |\n|\
    \ `∇` | Vector of first derivatives |\n| `∇²` | Hessian matrix of second derivatives\
    \ |\n| `≜` | Defined as |\n| `O(·)` | Big-O: generally implies upper bound |\n\
    | `R` | The real numbers |\n| `1 : n` | Range (Matlab notation): `1 : n = 1, 2,\
    \ ..., n` |\n| `≈` | Approximately equivalent to |\n| `arg max f(x)` | Argmax:\
    \ the value `x` that maximizes `f` |\n| `B(a,b) = Γ(a)Γ(b)/Γ(a+b)` | Beta function\
    \ |\n| `B(α) = ∏ₖ Γ(αₖ) / Γ(∑ₖ αₖ)` | Multivariate beta function |\n| `(n k)`\
    \ | `n` choose `k`, equivalent to `n!/(k!(n-k)!)` |\n| `δ(x)` | Dirac delta function,\
    \ `δ(x) = ∞` if `x = 0`, else `δ(x) = 0` |\n| `exp(x)` | Exponential function\
    \ `eˣ` |\n| `Γ(x) = ∫₀^∞ uˣ⁻¹e⁻ᵘ du` | Gamma function |\n| `ψ(x) = d log Γ(x)\
    \ / dx` | Digamma function |\n\n## Linear algebra notation\n\nWe use boldface\
    \ lower-case to indicate vectors, such as `x`, and boldface capitalized to mean\
    \ matrices, such as `X`. We indicate entries in a matrix by non-bold capitalized\
    \ letters, for example, `Xᵢⱼ`. Vectors are thought to be column vectors, except\
    \ if noted in any case. We use `(x₁, · · · , x_D)` to indicate a column vector\
