    次，其中 F 是 CV 折数。第二个问题是需要在潜在的大量模型中搜索。通常的方法是对所有候选 K 值进行穷尽搜索。然而，有时我们可以将模型设置为最大规模，然后依靠贝叶斯奥卡姆剃刀的力量来消除不需要的组件。第
