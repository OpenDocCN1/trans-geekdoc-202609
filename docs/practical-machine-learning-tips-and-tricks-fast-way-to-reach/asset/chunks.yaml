    \ `[a,b]` 上是凸的。\n\n### A.2.2 批量梯度下降\n\n**命题 A.1.** `log(x)` 在 `(0,∞)` 上是严格凹的。\n\
    \n### A.2.3 线搜索\n\n直观上，（严格）凸函数具有碗状形状，因此具有唯一的全局最小值 `x*`，对应于碗底。因此其二阶导数必须处处为正，`d²f(x)/dx²\
    \ > 0`。一个二阶连续可微的多元函数 `f` 是凸的，当且仅当其海森矩阵对所有 `x` 都是正定的。在机器学习设置中，函数 `f` 通常对应于 NLL（负对数似然）。NLL\
    \ 为凸的模型是理想的，因为这意味着我们总能找到全局最优 MLE（最大似然估计）。我们稍后将在本书中看到许多这方面的例子。然而，许多感兴趣的模型不会具有凸似然。在这种情况下，我们将讨论推导局部最优参数估计的方法。\n\
    \n线搜索方法首先找到一个下降方向，沿该方向真实函数 `f` 会减小，然后计算步长，决定 `x` 沿该方向应移动多远。下降方向可以通过多种技术计算，如梯度下降（第\
    \ A.2 节）、牛顿法（第 A.4 节）和拟牛顿法（第 A.5 节）。步长可以精确或不精确地确定。\n\n1. http://en.wikipedia.org/wiki/Line_search\n\
    \n### A.2.4 动量项\n\n## A.3 拉格朗日对偶性\n\n### A.3.1 原始形式\n\n一种优化策略\n\n其思想是用一个近似 `Bk,k`\
