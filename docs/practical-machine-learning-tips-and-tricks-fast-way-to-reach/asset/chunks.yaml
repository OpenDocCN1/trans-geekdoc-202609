    ### 11.4.11.2 The Generalized EM Algorithm (GEM)


    In the formulation of the EM algorithm described above, `θt` was chosen as the
    value of `θ` for which `Q(θ, θt−1)` was maximized. While this ensures the greatest
    increase in `ℓ(θ)`, it is however possible to relax the requirement of maximization
    to one of simply increasing `Q(θ, θt−1)` so that `Q(θt, θt−1) ≥ Q(θt−1, θt−1)`.
    This approach, to simply increase and not necessarily maximize `Q(θt, θt−1)` is
    known as the **Generalized Expectation Maximization (GEM)** algorithm and is often
    useful in cases where the maximization is difficult. The convergence of the GEM
    algorithm is similar to the EM algorithm.


