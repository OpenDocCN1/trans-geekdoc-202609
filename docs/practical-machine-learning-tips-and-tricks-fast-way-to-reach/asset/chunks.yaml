    ### 10.1.3 图模型


    图模型（GM）是一种通过做条件独立性假设来表示联合分布的方式。特别地，图中的节点代表随机变量，边的（不）存在代表条件独立性假设。根据图是有向、无向，还是有向和无向的组合，有几种图模型。在本章中，我们只研究有向图。我们将在第
    19 章讨论无向图。


    ![Fig. 10.1: (a) 一个拓扑排序编号的 5 个节点的简单 DAG。节点 1 是根节点，节点 4 和 5 是叶节点。(b) 一个简单的无向图，具有以下最大团：1,2,3,
