    \ 2.4**. Assume we throw a `K`-sided dice `n` times. Let `x = (x_1, x_2, ...,\
    \ x_K) ∈ {0,1,...,n}^K` be an arbitrary vector, where `x_j` is the occasions side\
    \ `j` of the dice happens, then, at that point, we say `X` has a multinomial circulation,\
