  trans: "\n\n# 2.2 概率论简述\n\n## 2.2.1 基本概念\n\n我们通过表征随机变量 `X` 来表示任意场合。\n\n**离散随机变量**：`X`\
    \ 可以取自有限或可数无限集合中的任意值。\n\n**连续随机变量**：`X` 的值为实数值。\n\n## 2.2.2 多元随机变量\n\n### 2.2.2.1\
    \ 联合累积分布函数\n\n我们用 `F(x,y) ≜ P(X≤ x ∩ Y≤ y) = P(X≤ x, Y≤ y)` 表示联合累积分布函数。\n\n```\n\
    p(u,v)\nF(x,y) ≜ P(X≤ x, Y≤ y) = ∑_{u≤x,v≤y} p(u,v)  (离散)\nF(x,y) ≜ P(X≤ x, Y≤\
    \ y) = ∫_{-∞}^{x} ∫_{-∞}^{y} f(u,v) du dv  (连续)\n```\n\n### 2.2.2.2 边缘分布\n\n**边缘累积分布函数**：\n\
    ```\nF_X(x) ≜ F(x, +∞) = P(X = x_i) = ∑_j P(X = x_i, Y = y_j)  (离散)\nF_X(x) ≜\
    \ ∫_{-∞}^{x} f_X(u) du = ∫_{-∞}^{x} ∫_{-∞}^{+∞} f(u,v) dv du  (连续)\n```\n\n```\n\
    F_Y(y) ≜ F(+∞, y) = P(Y = y_j) = ∑_i P(X = x_i, Y = y_j)  (离散)\nF_Y(y) ≜ ∫_{-∞}^{y}\
    \ f_Y(v) dv = ∫_{-∞}^{y} ∫_{-∞}^{+∞} f(u,v) du dv  (连续)\n```\n\n**边缘概率质量函数和概率密度函数**：\n\
    ```\nP(X = x_i) = ∑_{j=1}^{+∞} P(X = x_i, Y = y_j)  (离散)\nf_X(x) = ∫_{-∞}^{+∞}\
    \ f(x,y) dy  (连续)\n```\n\n```\nP(Y = y_j) = ∑_{i=1}^{+∞} P(X = x_i, Y = y_j) \
    \ (离散)\nf_Y(y) = ∫_{-∞}^{+∞} f(x,y) dx  (连续)\n```\n\n### 2.2.2.3 条件分布\n\n**条件概率质量函数**：\n\
    ```\np(X = x_i | Y = y_j) = p(X = x_i, Y = y_j) / p(Y = y_j)  if p(Y) > 0  (2.9)\n\
    ```\n概率质量函数 `p(X|Y)` 称为条件似然。\n\n**条件概率密度函数**：\n```\nf_{X|Y}(x|y) = f(x,y) / f_Y(y)\
    \  (2.10)\n```\n\n### 2.2.3 贝叶斯法则\n\n```\np(Y = y | X = x) = p(X = x, Y = y) /\
    \ p(X = x)\np(X = x | Y = y) p(Y = y) / ∑_{y'} p(X = x | Y = y') p(Y = y')  (2.11)\n\
    ```\n\n### 2.2.4 独立性与条件独立性\n\n如果我们可以将联合分布表示为两个边缘分布的乘积，即\n```\nP(X,Y) = P(X)P(Y)\
    \  (2.12)\n```\n则称 `X` 和 `Y` 为**显式独立**或**边缘独立**，记作 `X ⊥ Y`。\n\n如果条件联合分布可以写成条件边缘分布的乘积，则称给定\
    \ `Z` 时 `X` 和 `Y` **条件独立**（CI）：\n```\nX ⊥ Y | Z = P(X,Y|Z) = P(X|Z)P(Y|Z)  (2.13)\n\
    ```\n\n### 2.2.5 分位数\n\n由于累积分布函数 `F` 是单调递增函数，它有一个反函数；我们将其记为 `F^{-1}`。如果 `F` 是\
    \ `X` 的累积分布函数，则 `F^{-1}(α)` 是使得 `P(X ≤ x_α) = α` 成立的 `x_α` 值；这称为 `F` 的 `α`-分位数。值\
    \ `F^{-1}(0.5)` 是分布的**中位数**，概率质量有一半在左侧，一半在右侧。值 `F^{-1}(0.25)` 和 `F^{-1}(0.75)`\
    \ 分别是下四分位数和上四分位数。\n\n### 2.2.6 均值与方差\n\n分布最自然的性质是其均值，或期望值，记为 `µ`。\n\n对于离散随机变量，定义为\
    \ `E[X] ≜ ∑_x x p(x)`；对于连续随机变量，定义为 `E[X] ≜ ∫ x p(x) dx`。如果该积分不是有限的，则均值未定义。\n\n\
    方差是分布离散程度的度量，记为 `σ²`。定义如下：\n```\nvar[X] ≜ E[(X - µ)²]\n     = ∫ (x - µ)² p(x)\
    \ dx\n     = ∫ x² p(x) dx - 2µ ∫ x p(x) dx + µ² ∫ p(x) dx\n     = E[X²] - µ² \
    \ (2.15)\n```\n由此我们得到有用的结果 `E[X²] = σ² + µ²` (2.16)。\n\n标准差定义为 `std[X] ≜ √var[X]`\
    \ (2.17)。这很有用，因为它与 `X` 本身具有相同的单位。\n\n## 2.3 一些常见的离散分布\n\n在本节中，我们回顾一些常用的定义在离散状态空间（包括有限和可数无限）上的参数分布。\n\
    \n### 2.3.1 伯努利分布与二项分布\n\n**定义 2.1**。现在假设我们只抛一次硬币。令 `X ∈ {0,1}` 为一个二元随机变量，成功或正面的概率为\
    \ `θ`。我们称 `X` 服从**伯努利分布**。这记作 `X ∼ Ber(θ)`，其概率质量函数定义为\n```\nBer(x|θ) ≜ θ^{I(x=1)}\
    \ (1-θ)^{I(x=0)}  (2.18)\n```\n\n**定义 2.2**。假设我们抛硬币 `n` 次。令 `X ∈ {0,1,...,n}`\
    \ 为正面出现的次数。如果正面的概率是 `θ`，则称 `X` 服从**二项分布**，记作 `X ∼ Bin(n,θ)`。其概率质量函数为\n```\nBin(k|n,θ)\
    \ ≜ (n choose k) θ^k (1-θ)^{n-k}  (2.19)\n```\n\n### 2.3.2 多努利分布与多项分布\n\n**定义\
    \ 2.3**。伯努利分布可用于模拟一次抛硬币的结果。为了模拟投掷一个 `K` 面骰子的结果，令 `x = (I(x=1), ..., I(x=K)) ∈\
    \ {0,1}^K` 为一个随机向量（这称为虚拟编码或独热编码），则称 `X` 服从**多努利分布**（或**分类分布**），记作 `X ∼ Cat(θ)`。其概率质量函数为：\n\
    ```\np(x) ≜ ∏_{k=1}^K θ_k^{I(x_k=1)}  (2.20)\n```\n\n**定义 2.4**。假设我们投掷一个 `K` 面骰子\
    \ `n` 次。令 `x = (x_1, x_2, ..., x_K) ∈ {0,1,...,n}^K` 为一个随机向量，其中 `x_j` 是骰子第 `j`\
    \ 面出现的次数，则称 `X` 服从**多项分布**，记作 `X ∼ Mu(n,θ)`。其概率质量函数为\n```\np(x) ≜ (n! / (x_1!\
    \ x_2! ... x_K!)) ∏_{k=1}^K θ_k^{x_k}  (2.21)\n```\n其中 `x_1 ... x_K ≜ x_1! x_2!\
    \ ... x_K!`。\n\n伯努利分布只是 `n = 1` 时二项分布的一个特例，正如多努利分布之于多项分布。见表 2.1 总结。\n\n**表 2.1：多项分布及相关分布总结。**\n\
    \n| 名称 | K | n | X |\n| :--- | :--- | :--- | :--- |\n| 伯努利 | 1 | 1 | `x ∈ {0,1}`\
    \ |\n| 二项 | 1 | n | `x ∈ {0,1,...,n}` |\n| 多努利 | K | 1 | `x ∈ {0,1}^K, ∑_{k=1}^K\
    \ x_k = 1` |\n| 多项 | K | n | `x ∈ {0,1,...,n}^K, ∑_{k=1}^K x_k = n` |\n\n**表 2.2：伯努利、二项、多努利和多项分布总结。**\n\
    \n| 名称 | 记作 | `p(x)` | `E[X]` | `var[X]` |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| 伯努利 | `X ∼ Ber(θ)` | `x ∈ {0,1} θ^{I(x=1)}(1-θ)^{I(x=0)}` | `θ` | `θ(1-θ)`\
    \ |\n| 二项 | `X ∼ Bin(n,θ)` | `x ∈ {0,1,...,n} (n choose k) θ^k(1-θ)^{n-k}` | `nθ`\
    \ | `nθ(1-θ)` |\n| 多努利 | `X ∼ Cat(θ)` | `x ∈ {0,1}^K, ∑ x_k=1 ∏_{k=1}^K θ_k^{I(x_k=1)}`\
    \ | - | - |\n| 多项 | `X ∼ Mu(n,θ)` | `x ∈ {0,1,...,n}^K, ∑ x_k=n (n!/(∏ x_k!))\
    \ ∏ θ_k^{x_k}` | - | - |\n\n### 2.3.3 泊松分布\n\n**定义 2.5**。如果 `X ∈ {0,1,2,...}`\
    \ 的概率质量函数为\n```\np(x|λ) ≜ e^{-λ} λ^x / x!  (2.22)\n```\n则称其服从参数为 `λ > 0` 的**泊松分布**，记作\
    \ `X ∼ Poi(λ)`。\n第一项只是归一化常数，用于确保分布总和为 1。\n\n泊松分布常用作稀有事件计数的模型，如放射性衰变和交通事故。\n\n\
    ### 2.3.4 经验分布\n\n经验分布函数，或经验累积分布函数，是与样本经验测度相关联的累积分布函数。令 `D = {x_1, x_2, ..., x_N}`\
    \ 为样本集，其定义为\n```\nF_n(x) ≜ (1/N) ∑_{i=1}^N I(x_i ≤ x)  (2.23)\n```\n\n## 2.4 一些常见的连续分布\n\
