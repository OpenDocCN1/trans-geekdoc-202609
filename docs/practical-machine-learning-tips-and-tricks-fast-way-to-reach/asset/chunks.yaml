    # Chapter 11 Mixture models and the EM algorithm


    ## 11.1 Latent variable models


    ## 11.2 Mixture models


    In Chapter 10 we showed how graphical models can be used to define high-dimensional
    joint probability distributions. The basic idea is to model dependence between
    two variables by adding an edge between them in the graph. (Technically the graph
    represents conditional independence, but you get the point.) An alternative approach
    is to assume that the observed variables are correlated because they arise from
    a hidden common cause. Model with hidden variables are also known as latent variable
    models or LVMs. As we will see in this chapter, such models are harder to fit
    than models with no latent variables. However, they can have significant advantages,
    for two main reasons.


    * First, LVMs often have fewer parameters than models that directly represent
    correlation in the visible space.

    * Second, the hidden variables in an LVM can serve as a bottleneck, which computes
    a compressed representation of the data. This forms the basis of unsupervised
    learning, as we will see.


    Figure 11.1 illustrates some generic LVM structures that can be used for this
    purpose.


