    \ independent of `Y` given `Z` |\n| `X ⊥̸ Y \\| Z` | `X` is not conditionally\
    \ independent of `Y` given `Z` |\n| `X ∼ p` | `X` is distributed by distribution\
    \ `p` |\n| `α` | Parameters of a Beta or Dirichlet distribution |\n| `cov[X]`\
    \ | Covariance of `X` |\n| `E[X]` | Expected value of `X` |\n| `E_q[X]` | Expected\
    \ value of `X` wrt distribution `q` |\n| `H(X)` or `H(p)` | Entropy of distribution\
    \ `p(X)` |\n| `I(X;Y)` | Mutual information between `X` and `Y` |\n| `KL(p\\|q)`\
