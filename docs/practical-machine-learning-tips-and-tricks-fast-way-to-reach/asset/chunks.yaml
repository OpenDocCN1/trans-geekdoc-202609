    ### 4.2.6 正则化 LDA *\n\n### 4.2.7 对角 LDA\n\n### 4.2.8 最近收缩质心分类器 *\n\n对角 LDA 的一个缺点是它依赖于所有特征。在高维问题中，我们可能更倾向于一种仅依赖特征子集的方法，以提高精度和可解释性。一种方法是使用筛选策略，可能基于互信息，如第\
