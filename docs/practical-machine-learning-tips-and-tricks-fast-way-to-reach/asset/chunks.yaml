    \ column of matrix |\n| `X_{i,:}` | `i`'th row of matrix (a column vector) |\n\
    | `X_{i,j}` | Element `(i, j)` of matrix `X` |\n| `x ⊗ y` | Tensor product of\
    \ `x` and `y` |\n\n## Probability notation\n\nWe signify random and fixed scalars\
    \ by lower case, random and fixed vectors by bold lower case, and random and fixed\
    \ matrices by bold upper case. Occasionally we utilize non-bold capitalized to\
    \ indicate scalar random variables. Likewise, we use `p()` for both discrete and\
    \ continuous random variables.\n\n| Symbol | Meaning |\n| :--- | :--- |\n| `X,\
    \ Y` | Random variable |\n| `P()` | Probability of a random event |\n| `F()` |\
    \ Cumulative distribution function (CDF), also called distribution function |\n\
    | `p(x)` | Probability mass function (PMF) |\n| `f(x)` | Probability density function\
    \ (PDF) |\n| `F(x,y)` | Joint CDF |\n| `p(x,y)` | Joint PMF |\n| `f(x,y)` | Joint\
