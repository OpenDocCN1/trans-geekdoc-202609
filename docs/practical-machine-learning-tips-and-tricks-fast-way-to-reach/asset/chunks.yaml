    \ matrix `Λ = Σ⁻¹` |\n| `mode[X]` | Most probable value of `X` |\n| `μ` | Mean\
    \ of a scalar distribution |\n| `μ` | Mean of a multivariate distribution |\n\
    | `Φ` | CDF of standard normal |\n| `ϕ` | PDF of standard normal |\n| `π` | Multinomial\
    \ parameter vector, Stationary distribution of Markov chain |\n| `ρ` | Correlation\
    \ coefficient |\n| `sigm(x) = 1 / (1 + e⁻ˣ)` | Sigmoid (logistic) function |\n\
    | `σ²` | Variance |\n| `Σ` | Covariance matrix |\n| `var[x]` | Variance of `x`\
    \ |\n| `ν` | Degrees of freedom parameter |\n| `Z` | Normalization constant of\
    \ a probability distribution |\n\n## Machine learning/statistics notation\n\n\
    In general, we use upper case letters to denote constants, such as `C, K, M, N,\
    \ T`, etc. We use lower case letters as dummy indexes of the appropriate range,\
    \ such as `c = 1 : C` to index classes, `i = 1 : M` to index data cases, `j =\
    \ 1 : N` to index input features, `k = 1 : K` to index states or clusters, `t\
    \ = 1 : T` to index time, etc. We utilize `x` to address a noticed information\
    \ vector. In a managed issue, we use `y` or `y` to address the ideal result name.\
    \ We use `z` to address a secret variable. Once in a while we likewise use `q`\
    \ to address a covered up discrete variable.\n\n| Symbol | Meaning |\n| :--- |\
    \ :--- |\n| `C` | Number of classes |\n| `D` | Dimensionality of data vector (number\
    \ of features) |\n| `N` | Number of data cases |\n| `N_c` | Number of cases of\
    \ class `c`, `N_c = ∑ᵢᴺ I(y_i = c)` |\n| `R` | Number of outputs (response variables)\
    \ |\n| `D` | Training data `D = {(x_i, y_i) \\| i = 1 : N}` |\n| `D_test` | Test\
    \ data |\n| `X` | Input space |\n| `Y` | Output space |\n| `K` | Number of states\
    \ or dimensions of a variable (typically latent) |\n| `k(x,y)` | Kernel function\
    \ |\n| `K` | Kernel matrix |\n| `H` | Hypothesis space |\n| `L` | Loss function\
    \ |\n| `J(θ)` | Cost function |\n| `f(x)` | Decision function |\n| `P(y\\|x)`\
    \ | Conditional probability |\n| `λ` | Strength of `ℓ₂` or `ℓ₁` regularizer |\n\
    | `ϕ(x)` | Basis function expansion of feature vector `x` |\n| `Φ` | Basis function\
    \ expansion of design matrix `X` |\n| `q()` | Approximate or proposal distribution\
    \ |\n| `Q(θ, θ_old)` | Auxiliary function in EM |\n| `T` | Length of a sequence\
