    \ − xk)`。\n3. 在满足上述条件的前提下，`Bk` 应尽可能接近 `Bk−1`。\n\n令 `yk = gk+1 − gk`，`δk = xk+1\
    \ − xk`，则 `xyz` (A.4)\n\n注意我们不要求 `Bk` 为正定。这是因为我们可以证明，如果 `Bk−1` 为正定，则 `Bk` 也必须是正定的。因此，只要初始海森矩阵近似\
    \ `B0` 是正定的，通过归纳法，所有 `Bk` 都是正定的。\n\n```\nf(x) ≈ f(xk) + gᵀ(x − xk) + ½(x − xk)ᵀHk(x\
