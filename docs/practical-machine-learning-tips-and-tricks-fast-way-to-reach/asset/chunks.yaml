  fmt: "\n# 2.2 A brief review of probability theory\n\n## 2.2.1 Basic concepts\n\n\
    We mean an arbitrary occasion by characterizing a random variable `X`.\n\n**Discrete\
    \ random variable**: `X` can take on any worth from a limited or countably boundless\
