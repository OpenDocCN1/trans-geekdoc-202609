    \n## 4.4 线性高斯系统\n\n假设我们有两个变量 `x` 和 `y`。令 `x ∈ R^Dx` 为隐变量，`y ∈ R^Dy` 为 `x` 的噪声观测。假设我们有以下先验和似然：\n\
