    \ 离散数据的分布式状态 LVMs\n\n在本章中，我们关注离散数据的潜变量模型，例如位向量、分类变量序列、计数向量、图结构、关系数据等。这些模型可用于分析投票记录、文本和文档集合、低强度图像、电影评分等。然而，我们将主要关注文本分析，这将反映在我们的术语中。由于我们将处理如此多种类型的数据，我们需要一些精确的符号来保持清晰。在建模分类因子（即图像或标记）的变长序列时，如文档中的单词，我们将让\
