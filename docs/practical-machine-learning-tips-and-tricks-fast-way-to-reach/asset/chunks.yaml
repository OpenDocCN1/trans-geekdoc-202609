  trans: "\n# 2.8 信息论\n\n## 2.8.1 熵\n\n具有分布 `p` 的任意变量 `X` 的熵，记作 `H(X)` 或有时记作 `H(p)`，是其**不确定性**的度量。具体而言，对于具有\
