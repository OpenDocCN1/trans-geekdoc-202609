    ```\n\n到目前为止，我们一直专注于未知参数的推断。现在让我们将注意力转向未来可观测数据的预测。考虑在 `Beta(a,b)` 后验下预测单次未来试验中正面朝上的概率。我们有\n\
    \n```\np(x̃|D) = ∫_0¹ p(x̃|θ)p(θ|D)dθ\n       = ∫_0¹ θ Beta(θ|a,b)dθ\n       =\
