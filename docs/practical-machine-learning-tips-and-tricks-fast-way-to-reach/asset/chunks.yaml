    # 9.2 广义线性模型 (GLMs)


    线性回归和逻辑回归是广义线性模型（GLMs）的例子（McCullagh and Nelder 1989）。这些模型的输出密度属于指数族（第 9.1 节），且均值参数是输入的线性组合，通过一个可能的非线性函数（如逻辑函数）传递。我们将更详细地描述
    GLMs


    # 第 10 章 有向图模型（贝叶斯网络）


    ## 10.1 简介


    ### 10.1.4 有向图模型


    ### 10.1.1 链式法则


    ```

    p(x1:V) = p(x1)p(x2|x1)p(x3|x1:2)···p(xN|x1:V−1) (10.1)

    ```


    ### 10.1.2 条件独立性


    给定 `Z` 时，`X` 和 `Y` 条件独立，记作 `X ⊥ Y|Z`，当且仅当条件联合分布可以写成条件边缘分布的乘积，即：


    ```

    X ⊥ Y|Z ⇐⇒ p(X,Y|Z) = p(X|Z)p(Y|Z) (10.2)

    ```


    有向图模型（DGM）是其图为有向无环图（DAG）的图模型。这些更常被称为贝叶斯网络。然而，贝叶斯网络并没有什么内在的“贝叶斯”属性：它们只是定义概率分布的一种方式。这些模型也被称为信念网络。此处“信念”指的是主观概率。再次强调，DGMs
    所表示的概率分布类型并没有什么内在的主观性。


    #### 有序马尔可夫性质


    ```

    xs ⊥ xpred(s) | xpa(s) (10.5)

    ```


