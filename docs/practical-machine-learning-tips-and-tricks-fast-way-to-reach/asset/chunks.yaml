    \n# 符号约定\n\n## 简介\n\n不可否认，要想出一份单一、可靠的文档来涵盖我们所讨论的各种信息、模型和计算，无疑是极具挑战性的。此外，符号约定在\
    \ AI 与统计学之间、以及不同书籍和论文之间均有差异。尽管如此，我们已尽力做到尽可能一致。下文我们总结了本书使用的大部分符号，尽管个别章节可能会引入新的符号。另请注意，同一符号在不同语境下可能具有不同含义，尽管我们在可能的情况下尽量避免这种情况。\n\
    \n## 通用数学符号\n\n| 符号 | 含义 |\n| :--- | :--- |\n| `⌊x⌋` | `x` 的下取整，即向下取最接近的整数 |\n\
    | `⌈x⌉` | `x` 的上取整，即向上取最接近的整数 |\n| `x * y` | `x` 和 `y` 的卷积 |\n| `x ⊙ y` | `x`\
    \ 和 `y` 的 Hadamard（逐元素）积 |\n| `a ∧ b` | 逻辑与 |\n| `a ∨ b` | 逻辑或 |\n| `¬a` | 逻辑非\
    \ |\n| `I(x)` | 指示函数，若 `x` 为真则 `I(x) = 1`，否则 `I(x) = 0` |\n| `∞` | 无穷大 |\n| `→`\
