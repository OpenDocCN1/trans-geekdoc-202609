    N×D  N×D  D×D  D×D

    ```


    如图 12.2(a) 所示。如果 `N < D`，我们有


    ```

    X = Û Σ̂ V̂^T (12.33)

    N×D  N×N  N×N  N×D

    ```


    计算经济型 SVD 需要 `O(ND min(N, D))` 时间 (Golub and van Loan 1996, p254)。


    特征向量与奇异向量的联系如下：


    ```

    U = evec(X X^T) (12.34)

    V = evec(X^T X) (12.35)

    Σ² = eval(X X^T) = eval(X^T X) (12.36)

    ```


    证明请阅读 MLAPP 第 12.2.3 节。由于特征向量不受矩阵线性缩放的影响，我们看到 `X` 的右奇异向量等于经验协方差 `Σ̂` 的特征向量。此外，`Σ̂`
    的特征值是平方奇异值的缩放版本。


    然而，PCA 和 SVD 的联系更深。从公式 12.31，我们可以得到一个


    ![](img/image_rsrc1RW.jpg) (a)

    ![](img/image_rsrc1RX.jpg) (b)


    **图 12.2：** (a) 非方阵 `X = U Σ V^T` 的 SVD 分解。`Σ` 的阴影部分及所有非对角项均为零。`U` 和 `Σ` 中的阴影条目在经济型版本中不计算，因为它们不是必需的。(b)
    秩为 `L` 的截断 SVD 近似。


    ```

    ||X − XL||_F ≈ σL (12.38)

    ```


    此外，可以证明 SVD 提供了矩阵的最佳秩 `L` 近似（最佳指在最小化上述 Frobenius 范数的意义上）。让我们将其联系回 PCA。设 `X = U
    Σ V^T` 为 `X` 的精简 SVD。我们知道 `Ŵ = V`，并且


    ```

    Ẑ = X W, 所以

    Ẑ = U Σ V^T V = U Σ (12.39)

    ```


    此外，最优重构由 `X̂ = Z W` 给出，所以我们发现


    ```

    X̂ = U Σ V^T (12.40)

    ```


    这正是截断 SVD 近似！这是 PCA 是数据最佳低秩近似这一事实的另一种表述。


    ### 12.2.3 概率 PCA


    **定理 12.3. ((Tipping and Bishop 1999))。** 考虑一个因子分析模型，其中 `Ψ = σ²I` 且 `W` 是对称的。观测数据对数似然由下式给出

    '
