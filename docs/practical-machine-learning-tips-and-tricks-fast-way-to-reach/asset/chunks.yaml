  fmt: "\n# 相关系数与多元分布\n\n## 2.5 相关系数\n\n相关系数可以被视为 X 和 Y 之间线性关系程度的度量，参见 Figure 2.6。\n\
    \n不相关并不意味着独立。例如，设 `X ~ U(-1,1)` 且 `Y = X^2`。显然 Y 依赖于 X（事实上，Y 完全由 X 决定），但可以证明 `corr[X,Y]\
    \ = 0`。Figure 2.6 展示了一些这方面的显著实例。这显示了一些数据集，其中 X 和 Y 之间存在明显的依赖关系，但相关系数为 0。随机变量之间更广泛的依赖度量是互信息，参见\
    \ Section TODO。\n\n## 2.5.2 多元高斯分布\n\n多元高斯分布或多元正态分布（MVN）是连续变量最常用的联合概率密度函数。我们将在第\
    \ 4 章详细探讨 MVN；此处仅给出一些定义和图示。\n\nD 维 MVN 的 pdf 定义为：\n\n```\nN(x|μ,Σ) ≜ 1/(2π)^(D/2)\
    \ |Σ|^(-1/2) exp[-1/2 (x-μ)^T Σ^(-1) (x-μ)]\n```\n\n其中 `μ = E[X] ∈ R^D` 是均值向量，`Σ\
    \ = Cov[X]` 是 `D×D` 协方差矩阵。归一化常数 `(2π)^(D/2) |Σ|^(1/2)` 仅确保 pdf 积分为 1。\n\nFigure\
    \ 2.7 绘制了三种不同类型协方差矩阵在 2D 下的 MVN 密度图。一个满协方差矩阵有 `D(D+1)/2` 个参数（除以 2 是因为对称性）。\n\n\
    ## 2.5.3 学生 t 分布\n\n学生 t 分布的 pdf 定义为：\n\n```\nT(x|μ,Σ,ν) ≜ Γ((ν+D)/2) / (Γ(ν/2)\
    \ (νπ)^(D/2) |Σ|^(1/2)) [1 + 1/ν (x-μ)^T Σ^(-1) (x-μ)]^(-(ν+D)/2)\n```\n\n其中 `Σ`\
