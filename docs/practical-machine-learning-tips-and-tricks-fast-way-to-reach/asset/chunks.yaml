    ## 11.5 Model Selection for Latent Variable Models


    When using LVMs, we must specify the number of latent variables, which controls
    the model complexity. In particular, in the case of mixture models, we must specify
    K, the number of clusters. Choosing these parameters is an example of model selection.
    We discuss some approaches below.


    ### 11.5.1 Model Selection for Probabilistic Models


    The optimal Bayesian approach, discussed in Section 5.3, is to pick the model
    with the largest marginal likelihood, `K = arg maxk p(D|k)`. There are two problems
    with this. First, evaluating the marginal likelihood for LVMs is quite difficult.
    In practice, simple approximations, such as BIC, can be used (see e.g., (Fraley
    and Raftery 2002)). Alternatively, we can use the cross-validated likelihood as
    a performance measure, although this can be slow, since it requires fitting each
    model F times, where F is the number of CV folds. The second issue is the need
    to search over a potentially large number of models. The usual approach is to
    perform exhaustive search over all candidate values of K. However, sometimes we
    can set the model to its maximal size, and then rely on the power of the Bayesian
    Occam''s razor to kill off unwanted components. An example of this will be shown
    in Section TODO 21.6.1.6, when we discuss variational Bayes. An alternative approach
    is to perform stochastic sampling in the space of models. Traditional approaches,
    such as (Green 1998, 2003; Lunn et al. 2009), are based on reversible jump MCMC,
    and use birth moves to propose new centers, and death moves to kill off old centers.
    However, this can be slow and difficult to implement. A simpler approach is to
    use a Dirichlet process mixture model, which can be fit using Gibbs sampling,
    but still allows for an unbounded number of mixture components; see Section TODO
    25.2 for details. Perhaps surprisingly, these sampling-based methods can be faster
    than the simple approach of evaluating the quality of each K separately. The reason
    is that fitting the model for each K is often slow. By contrast, the sampling
    methods can often quickly determine that a certain value of K is poor, and thus
    they need not waste time in that part of the posterior.


    ### 11.5.2 Model Selection for Non-probabilistic Methods


    What if we are not using a probabilistic model? For example, how do we choose
    K for the K-means algorithm? Since this does not correspond to a probability model,
    there is no likelihood, so none of the methods described above can be used. An
    obvious proxy for the likelihood is the reconstruction error. Define the squared
    reconstruction error of a data set D, using model complexity K, as follows:


    ```

    E(D, K) ≜ 1/N ∑|xi − x̂i|² (11.38)

    |D| i=1

    ```


    In the case of K-means, the reconstruction is given by `xi = µzi`, where `zi =
    arg mink ||xi − µk||²`, as explained in Section 11.4.2.6 TODO. In supervised learning,
    we can always use cross validation to select between non-probabilistic models
    of different complexity, but this is not the case with unsupervised learning.
    The most common approach is to plot the reconstruction error on the training set
    versus K, and to try to identify a knee or kink in the curve.


