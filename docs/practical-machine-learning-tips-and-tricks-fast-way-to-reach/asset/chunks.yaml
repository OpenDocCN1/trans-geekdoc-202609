    总结上述讨论，我们认为 SVM 分类器包含三个关键要素：**核技巧**、**稀疏性** 和 **大间隔准则**。\n\n**核技巧** 对于防止欠拟合至关重要，即确保特征向量足够丰富，以便线性分类器能够分离数据。（回顾第\
    \ 14.2.3 节，任何 Mercer 核都可以被视为隐式地定义了一个可能的高维特征向量。）如果原始特征已经是高维的（如在许多基因表达和文本分类问题中），使用线性核\
    \ `κ(x,x′) = xTx′` 就足够了，这等同于使用原始特征进行工作。\n\n**稀疏性** 和 **大间隔准则** 对于防止过拟合至关重要，即确保我们不使用所有基函数。这两个概念紧密相关，且在此情况下都源于\
    \ **合页损失函数** 的使用。然而，还有其他实现稀疏性的方法（如 `ℓ1` 正则化），以及其他最大化间隔的方法（如 Boosting）。对这一点的更深入探讨超出了本书的范围。详见\
    \ (Hastie et al. 2009) 了解更多信息。\n\n## 14.6 判别式核方法的比较\n\n| 方法 | 优化 w | 优化核 | 概率输出\
