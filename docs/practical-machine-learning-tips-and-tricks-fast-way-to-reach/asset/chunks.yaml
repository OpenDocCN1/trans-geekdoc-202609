    \ ∑ x_k=n (n!/(∏ x_k!)) ∏ θ_k^{x_k}` | - | - |\n\n### 2.3.3 The Poisson distribution\n\
    \n**Definition 2.5**. We say that `X ∈ {0,1,2,...}` has a Poisson circulation\
    \ with boundary `λ > 0`, composed as `X ∼ Poi(λ)`, if its pmf is\n```\np(x|λ)\
    \ ≜ e^{-λ} λ^x / x!  (2.22)\n```\nThe initial term is only the standardization\
    \ consistent, needed to guarantee the circulation aggregates to 1.\n\nThe Poisson\
    \ appropriation is frequently utilized as a model for counts of uncommon occasions\
    \ like radioactive rot and traffic accidents.\n\n### 2.3.4 The empirical distribution\n\
    \nThe exact dissemination function, or observational cdf, is the total dispersion\
