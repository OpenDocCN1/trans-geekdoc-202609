  \n为使上述条件成立，只需令\n\n初始化 `x0`\n\n\n\n\n# 算法与优化方法\n\n## 牛顿法求解严格凸函数\n\n**算法 6：用于最小化严格凸函数的牛顿技术**\n\
  \n```text\nwhile (!convergency) do\n    Evaluate gk = ∇f(xk)\n    Evaluate Hk =\
  \ ∇²f(xk)\n    dk = -Hk⁻¹gk\n    Use line search to observe step size ηk along dk\n\
  \    xk+1 = xk + ηkdk\nend\n```\n\n## DFP 算法\n\n在 DFP 算法中，$P_k$ 和 $Q_k$ 定义为：\n\n\
  $$P_k = \\frac{\\delta_k \\delta_k^T}{\\delta_k^T y_k} \\tag{A.10}$$\n\n$$Q_k =\
  \ -\\frac{B_k y_k y_k^T B_k}{y_k^T B_k y_k} \\tag{A.11}$$\n\n## 拟牛顿法\n\n### BFGS\
  \ 算法\n\n由公式 A.5 可导出半牛顿条件如下：\n使用 $B_k$ 作为 $H_k$ 的估计，此时半牛顿条件变为：\n\n$$f'(x) - g_k =\
  \ H_k(x - x_k)$$\n$$g_{k-1} - g_k = H_k(x_{k-1} - x_k)$$\n$$g_k - g_{k-1} = H_k(x_k\
  \ - x_{k-1})$$\n\n$$B_{k+1}\\delta_k = y_k \\tag{A.12}$$\n\n更新准则类似 DFP，但 $P_k$ 和\
  \ $Q_k$ 不同。令：\n\n$$g_{k+1} - g_k = H_{k+1}(x_{k+1} - x_k) \\quad \\text{(半牛顿条件)}\
  \ \\tag{A.7}$$\n\n$$P_k\\delta_k = y_k, \\quad Q_k\\delta_k = -B_k\\delta_k$$\n\n\
  则：\n\n$$P_k = \\frac{y_k y_k^T}{y_k^T \\delta_k} \\tag{A.13}$$\n\n$$Q_k = -\\frac{B_k\
  \ \\delta_k \\delta_k^T B_k}{\\delta_k^T B_k \\delta_k} \\tag{A.14}$$\n\n### Broyden\
