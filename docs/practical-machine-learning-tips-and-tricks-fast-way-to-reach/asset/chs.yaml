  \ 所表示的概率分布类型并没有什么内在的主观性。\n\n#### 有序马尔可夫性质\n\n```\nxs ⊥ xpred(s) | xpa(s) (10.5)\n\
  ```\n\n其中 `pa(s)` 是节点的父节点，`pred(s)` 是 DAG 中节点的前驱节点。\n\n一阶马尔可夫假设：给定当前，未来独立于过去，\n\n\
  ```\nxt+1 ⊥ x1:t−1 | xt (10.3)\n```\n\n#### DGM 上的马尔可夫链\n\n```\nV\np(x1:V|G) = ∏\
