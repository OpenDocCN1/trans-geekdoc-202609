  \ Raiko 2010) 等。\n\n### 12.2 主成分分析 (PCA)\n\n考虑一个 FA 模型，其中我们约束 `Ψ = σ²I`，且 `W` 为正交矩阵。可以证明\
  \ (Tipping and Bishop 1999)，当 `σ² → 0` 时，该模型退化为传统的（非概率）主成分分析 (PCA)，也称为 Karhunen-Loève\
