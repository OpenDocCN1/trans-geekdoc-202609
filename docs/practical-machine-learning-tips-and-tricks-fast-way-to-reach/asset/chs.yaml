  \ MCMC。MCMC 背后的基本思想是在状态空间 `X` 上构建一个马尔可夫链（第 17.2 节），其平稳分布是感兴趣的目标密度 `p(x)`（这可能是先验或后验）。也就是说，我们在状态空间上执行随机游走，使得我们在每个状态\
  \ `x` 上花费的时间比例与 `p(x)` 成正比。通过从链中抽取（相关的！）样本 `x0,x1,x2,· · ·`，我们可以执行关于 `p` 的蒙特卡洛积分。∗\n\
