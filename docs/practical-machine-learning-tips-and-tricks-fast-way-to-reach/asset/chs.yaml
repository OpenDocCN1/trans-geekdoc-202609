  \ |\n\n### 概率符号\n\n我们用小写字母表示随机和固定标量，粗体小写字母表示随机和固定向量，粗体大写字母表示随机和固定矩阵。偶尔我们也用非粗体大写字母表示标量随机变量。同样，我们对离散和连续随机变量均使用\
