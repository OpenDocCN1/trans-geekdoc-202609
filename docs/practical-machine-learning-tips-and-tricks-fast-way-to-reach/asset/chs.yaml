  \ 是否为凸函数。L2VM、L1VM 和 SVM 具有凸目标。RVM 没有。GP 是贝叶斯方法，不执行参数估计。\n*   **优化核：** 所有方法都要求调整核参数，如\
  \ RBF 核的带宽以及正则化程度。对于基于高斯的方法，包括 L2VM、RVM 和 GP，我们可以使用高效的基于梯度的优化器来最大化边际似然。对于 SVM 和\
  \ L1VM，我们必须使用交叉验证，这更慢（见第 14.5.3 节）。\n*   **稀疏性：** L1VM、RVM 和 SVM 是稀疏核方法，因为它们仅使用训练样本的一个子集。GP\
  \ 和 L2VM 不是稀疏的：它们使用所有训练样本。稀疏性的主要优势是测试时的预测通常更快。此外，有时可以获得更高的精度。\n*   **概率输出：** 除 SVM\
