  W̃k = (∑ rik xi bik^T) (∑ rik xi Cik)^−1 (12.26)\nΨ̂ = 1/N diag ∑ rik (xi − W̃k\
  \ bik) xi^T (12.27)\n```\n\n#### 12.2.1 经典 PCA\n\n##### 12.2.1.1 定理陈述\n\n经典 PCA\
  \ 的组合视角总结在以下定理中。\n\n**定理 12.1。** 假设我们需要寻找一组 `L` 个正交基向量 `wj ∈ RD`，以及相应的得分 `zi ∈ RL`，使得我们最小化平均重构误差\n\
  \n```\nJ(W, Z) = 1/N ∑ ||xi − x̂i||²₂ (12.28)\ni=1\n```\n\n其中 `x̂i = W zi`，受约束于\
  \ `W` 是正交的。等价地，我们可以将此目标写为如下形式\n\n```\nJ(W, Z) = 1/N ||X − W Z^T||²_F (12.29)\n```\n\
  \n其中 `Z` 是一个 `N × L` 矩阵，其列为 `zi`，`||A||_F` 是矩阵 `A` 的 Frobenius 范数，定义为\n\n```\n||A||_F\
  \ ≜ √(∑∑ a²_ij) = tr(A^T A) (12.30)\ni=1 j=1\n```\n\n标准做法是先标准化数据，或者等价地，使用相关矩阵而不是协方差矩阵。\n\
  \n最优解通过设置 `Ŵ = VL` 获得，其中 `VL` 包含经验协方差矩阵中具有最大特征值的 `L` 个特征向量，\n\n```\nΣ̂ = 1/N ∑\
  \ xi xi^T. （为符号简便，我们假设 xi 均值为零。）\ni=1\n```\n\n此外，数据的最优低维编码由 `zi = W^T xi` 给出，这是数据在特征向量张成的列空间上的正交投影。图\
  \ 12.1(a) 展示了 `D = 2` 和 `L = 1` 时的一个示例。倾斜的线是向量 `w1`；这被称为第一主成分或主方向。数据点 `xi ∈ R²`\
  \ 被正交投影到这条线上以获得 `zi ∈ R`。这是对数据的最佳 1 维近似。（我们稍后将讨论图 12.1(b)。）\n\n##### 12.2.1.2 证明\n\
  \n*见 MLAPP 第 12.2.2 节。*\n\n#### 12.2.2 奇异值分解 (SVD)\n\n我们已经用协方差矩阵的特征向量刻画了 PCA 的解。然而，还有一种基于奇异值分解\
  \ (SVD) 的求解方法。这本质上将特征向量的概念从方阵推广到了任意矩阵。\n\n![](img/image_rsrc1RU.jpg) (a)\n![](img/image_rsrc1RV.jpg)\
  \ (b)\n\n**图 12.1：** `D = 2` 和 `L = 1` 时 PCA 和 PPCA 的示意图。圆圈是原始项目，叉号是重构。红星是数据均值。(a)\
  \ PCA。点被正交投影到线上。(b) PPCA。投影不再是正交的：重构向数据均值（红星）收缩。\n\n主方向是数据显示最大方差的方向。这意味着 PCA 可能会被那些仅因测量尺度而导致方差高的方向误导。因此\n\
  \n**定理 12.2. (SVD)。** 任何矩阵都可以分解如下\n\n```\nX = U Σ V^T (12.31)\nN×D  N×N  N×D  D×D\n\
  ```\n\n其中 `U` 是一个 `N × N` 矩阵，其列正交归一化（即 `U^T U = I`），`V` 是 `D × D` 矩阵，其行和列正交归一化（即\
  \ `V^T V = V V^T = ID`），`Σ` 是一个 `N × D` 矩阵，包含主对角线上的 `r = min(N, D)` 个奇异值 `σ ≥ 0`，其余位置填充\
  \ `0`。\n\n这展示了如何将矩阵 `X` 分解为三个矩阵的乘积：`V` 描述数据空间中的一组正交基，`U` 描述余域中的一组正交基，`σ` 描述 `V`\
  \ 中的向量被拉伸多少以得到 `U` 中的向量。由于最多有 `D` 个奇异值（假设 `N > D`），`U` 的最后 `N − D` 列无关紧要，因为它们将乘以\
  \ `0`。经济型 SVD 或精简 SVD 避免计算这些无用元素。\n\n让我们用 `Û Σ̂ V̂^T` 表示这种分解。如果 `N > D`，我们有\n\n\
  ```\nX = Û Σ̂ V̂^T (12.32)\nN×D  N×D  D×D  D×D\n```\n\n如图 12.2(a) 所示。如果 `N < D`，我们有\n\
