  ```\n\n## 第 11 章 混合模型与 EM 算法\n\n### 11.1 潜变量模型\n\n### 11.2 混合模型\n\n在第 10 章中，我们展示了如何使用图模型来定义高维联合概率分布。基本思想是通过在图中它们之间添加一条边来建模两个变量之间的依赖关系。（严格来说，图代表条件独立性，但你明白意思。）另一种方法是假设观测变量之所以相关，是因为它们源于一个隐藏的共同原因。带有隐变量的模型也被称为潜变量模型（LVMs）。正如我们将在本章看到的，这类模型比没有潜变量的模型更难拟合。然而，它们可能具有显著优势，主要有两个原因。\n\
  \n* 首先，LVMs 通常比直接在可见空间表示相关性的模型拥有更少的参数。\n* 其次，LVM 中的隐变量可以作为一个瓶颈，计算数据的压缩表示。这构成了无监督学习的基础，正如我们将看到的那样。\n\
  \n图 11.1 展示了可用于此目的的一些通用 LVM 结构。\n\n![Fig. 11.1: 作为 DGM 表示的潜变量模型。(a) 多对多。(b) 一对多。(c)\
  \ 多对一。(d) 一对一。](img/image_rsrc1RN.jpg)\n\n\n\n\n# LVM 的最简单形式\n\nLVM 的最简单形式是当 `zi\
  \ ∈ {1, · · · , K}` 时，表示离散潜在状态。我们将对此使用离散先验，`p(zi) = Cat(π)`。对于似然，我们使用 `p(xi|zi =\
  \ k) = pk(xi)`，其中 `pk` 是观测值的第 k 个基础分布；这可以是任何类型。整体模型被称为**混合模型**，因为我们将 K 个基础分布混合在一起，如下所示：\n\
  \n```\np(xi|θ) = ∑_{k=1}^K π_k pk(xi|θ)   (11.1)\n```\n\n根据似然 `p(xi|zi)` 和先验 `p(zi)`\
  \ 的形式，我们可以生成各种不同的模型，如表 11.1 所总结的。\n\n| p(xi|zi) | p(zi) | 名称 | 章节 |\n| :--- | :---\
  \ | :--- | :--- |\n| 乘积高斯 | 离散 | 高斯混合模型 | 11.2.1 |\n| 乘积离散 | 离散 | 多项式混合模型 | 11.2.2\
  \ |\n| 乘积高斯 | 乘积高斯 | 因子分析 / 概率 PCA | 12.1.5 |\n| 乘积拉普拉斯 | 乘积高斯 | 概率 ICA / 稀疏编码 |\
  \ 12.6 |\n| 乘积高斯 | 多项式 | PCA | 27.2.3 |\n| 狄利克雷 | 离散 | 潜在狄利克雷分配 | 27.3 |\n| 乘积噪声\
  \ OR | 乘积伯努利 | BN20 / QMR | 10.2.3 |\n| 乘积伯努利 | 乘积伯努利 | Sigmoid 信念网络 | 27.7 |\n\n\
  **表 11.1：** 一些流行的有向潜在变量模型总结。此处 **Prod** 表示乘积，因此似然中的 **Prod. Discrete** 表示形式为 `∏_j\
  \ Cat(xij|zi)` 的分解分布，而 **Prod. Gaussian** 表示形式为 `∏_j N(xij|zi)` 的分解分布。\n\n#### 11.2.1\
  \ 高斯混合模型\n\n```\npk(xi|θ) = N(xi|µk, Σ)   (11.2)\n```\n\n#### 11.2.2 多努利混合模型\n\n\
  ```\npk(xi|θ) = ∏_{j=1}^D Ber(xij|µjk) = ∏_{j=1}^D µjk^{xij} (1 − µjk)^{1−xij} \
  \  (11.3)\n```\n\n其中 `µjk` 是第 `j` 位在簇 `k` 中开启的概率。潜在变量不必具有任何含义；我们可能只是引入潜在变量以使模型更强大。例如，可以证明混合分布的均值和协方差由以下公式给出：\n\
  \n```\nE[x] = ∑_{k=1}^K π_k µk   (11.4)\nCov[x] = ∑_{k=1}^K π_k (Σ + µk µk^T) −\
  \ E[x]E[x]^T   (11.5)\n```\n\n其中 `Σ = diag(µjk(1 − µjk))`。因此，尽管分量分布是分解的，但联合分布不是。因此，混合分布可以捕捉变量之间的相关性，这与单一的伯努利乘积模型不同。\n\
  \n#### 11.2.3 使用混合模型进行聚类\n\n混合模型有两个主要应用：**黑盒密度模型**（见第 14.7.3 节 TODO）和**聚类**（见第 25\
  \ 章 TODO）。\n\n### 软聚类\n\n```\nrik ≜ p(zi = k|xi, θ) = p(zi = k, xi|θ) / p(xi|θ)\n\
  \    = p(zi = k|θ) p(xi|zi = k, θ) / ∑_{k'=1}^K p(zi = k'|θ) p(xi|zi = k', θ)  \
  \ (11.6)\n```\n\n其中 `rik` 称为簇 `k` 对点 `i` 的**责任度**。\n\n### 硬聚类\n\n```\nzi* ≜ arg\
  \ max_k rik = arg max_k p(zi = k|xi, θ)   (11.7)\n```\n\n生成式分类器和混合模型的区别仅出现在训练阶段：在混合模型情况下，我们从不观测\
  \ `zi`，而使用生成式分类器时，我们会观测 `yi`（其扮演 `zi` 的角色）。\n\n#### 11.2.4 专家混合模型\n\n```\np(yi|xi,\
  \ zi = k, θ) = N(yi|w_k^T xi, σ_k²)   (11.8)\np(zi|xi, θ) = Cat(zi|S(V^T xi))  \
  \ (11.9)\n```\n\n有向图模型见 Figure 11.3(a)。\n\n该模型称为**专家混合模型**或 **MoE**（Jordan and Jacobs\
  \ 1994）。其思想是每个子模型被视为输入空间某个区域的专家。函数 `p(zi|xi, θ)` 称为**门控函数**，根据输入值决定使用哪个专家。例如，Figure\
  \ 11.2(b) 展示了三个专家如何划分一维输入空间，Figure 11.2(a) 展示了每个专家单独的预测（在本例中，专家只是线性回归模型），而 Figure\
  \ 11.2(c) 展示了使用以下公式获得的模型总体预测：\n\n```\np(yi|xi, θ) = ∑_{k=1}^K p(zi = k|xi, θ) p(yi|xi,\
  \ zi = k, θ)   (11.10)\n```\n\n我们将在第 11.4.3 节 TODO 中讨论如何拟合该模型。\n\n### 11.3 混合模型的参数估计\n\
  \n#### 11.3.1 不可识别性\n\n#### 11.3.2 计算 MAP 估计是非凸的\n\n### 11.4 EM 算法\n\n#### 11.4.1\
  \ 简介\n\n对于机器学习和统计学中的许多模型，如果我们观测到所有相关随机变量的值，即拥有**完全数据**，则计算 ML 或 MAP 参数估计很容易。然而，如果我们有缺失数据和/或潜在变量，则计算\
  \ ML/MAP 估计变得困难。一种方法是使用通用的基于梯度的优化器来寻找 `NLL(θ)` 的局部最小值。然而，我们通常必须强制执行约束，例如协方差矩阵必须是正定的、混合权重必须求和为\
  \ 1 等，这可能比较棘手。在这种情况下，使用一种称为**期望最大化**的算法通常简单得多（但并不总是更快），简称 **EM**（Dempster et al.\
  \ 1977; Meng and van Dyk 1997; McLachlan and Krishnan 1997）。这是一种在存在缺失或隐藏数据时计算 ML\
  \ 或 MAP 估计的高效迭代算法，通常在每一步都有闭式更新。此外，该算法会自动强制执行所需的约束。有关本书中 EM 应用的总结，请参见表 11.2。\n\n\
  | 模型 | 章节 |\n| :--- | :--- |\n| 高斯混合模型 | 11.4.2 |\n| 专家混合模型 | 11.4.3 |\n| 因子分析 |\
  \ 12.1.5 |\n| Student T 分布 | 11.4.5 |\n| Probit 回归 | 11.4.6 |\n| 含隐变量的 DGM | 11.4.4\
  \ |\n| 含缺失数据的 MVN | 11.6.1 |\n| HMMs | 17.5.2 |\n| 高斯均值的收缩估计 | 练习 11.13 |\n\n**表\
  \ 11.2：** 本书中讨论的一些模型，EM 算法可轻松应用于这些模型以寻找 ML/MAP 参数估计。\n\n#### 11.4.2 基本思想\n\n总之，EM\
  \ 算法的伪代码如下：\n\nEM 算法利用了这样一个事实：如果数据被完全观测，则 ML/MAP 估计很容易计算。特别是，EM 算法的每次迭代包含两个过程：**E\
  \ 步**和**M 步**。\n\n*   在 **E 步** 中，给定观测数据和当前的模型参数估计，推断缺失数据。这是通过条件期望实现的，这解释了术语的由来。\n\
  *   在 **M 步** 中，假设缺失数据已知，最大化似然函数。从 E 步推断出的缺失数据被用来代替实际的缺失数据。\n\n令 `xi` 为情况 `i` 中的可见或观测变量，令\
  \ `zi` 为隐藏或缺失变量。目标是最大化观测数据的对数似然：\n\n```\nℓ(θ) = log p(D|θ) = ∑_{i=1}^N log p(xi|θ)\
  \ = ∑_{i=1}^N log ∑_{zi} p(xi, zi|θ)   (11.11)\n```\n\n不幸的是，这很难优化，因为对数不能推入求和内部。\n\
  \nEM 通过以下方式解决此问题。定义**完全数据对数似然**为：\n\n```\nℓc(θ) = ∑_{i=1}^N log p(xi, zi|θ)   (11.12)\n\
  ```\n\n这无法计算，因为 `zi` 未知。因此让我们定义**期望完全数据对数似然**如下：\n\n```\nQ(θ, θ^{t-1}) ≜ E_{z|D,θ^{t-1}}\
  \ [ℓc(θ)] = E[ℓc(θ)|D, θ^{t-1}]   (11.13)\n```\n\n其中 `t` 是当前迭代次数。`Q` 称为**辅助函数**（推导见第\
  \ 11.4.9 节）。期望是针对旧参数 `θ^{t-1}` 和观测数据 `D` 计算的。**E 步**的目标是计算 `Q(θ, θ^{t-1})`，或者更确切地说，计算\
  \ MLE（或 MAP）所依赖的其中的参数；这些被称为**期望充分统计量**或 **ESS**。在 **M 步** 中，我们针对 `θ` 优化 `Q` 函数：\n\
  \n```\nθ^t = arg max_θ Q(θ, θ^{t-1})   (11.14)\n```\n\n\n\n# EM 算法\n\n为了执行 MAP 估计，我们按如下方式修改\
  \ M 步：\n\n**输入**：观测数据 `D = {x1, x2, ..., xN}`，联合分布 `P(x, z | θ)`\n\n**输出**：模型参数\
  \ `θ`\n\n```text\n// 1. 确定隐变量 z，写出对数似然函数 ℓ(x, z | θ)\nθ(0) = ... // 初始化\n\nwhile\
  \ (!convergency) do\n    // 2. E 步：代入 P(x, z | θ)，推导 Q(θ, θ^(t-1)) 的公式\n    Q(θ,\
  \ θ^(t-1)) = E[ℓc(θ) | D, θ^(t-1)]\n\n    // 3. M 步：寻找使 Q(θ, θ^(t-1)) 取得最大值的 θ\n\
  \    θ^t = arg max Q(θ, θ^(t-1))\n          θ\nend\n```\n\n**算法 3**：EM 算法\n\n下面我们将解释如何针对几个简单模型执行\
  \ E 步和 M 步，这应该能让事情更清晰。\n\n#### 11.4.3 高斯混合模型的 EM 算法\n\n##### 11.4.3.1 辅助函数\n\n```math\n\
  Q(θ, θ^(t-1)) = E_{z|D, θ^(t-1)}[ℓc(θ)]\n             = E_{z|D, θ^(t-1)}[∑_{i=1}^N\
  \ log p(x_i, z_i | θ)]\n             = E_{z|D, θ^(t-1)}[∑_{i=1}^N log ∏_{k=1}^K\
  \ (π_k p(x_i | θ_k))^{I(z_i=k)}]\n             = ∑_{i=1}^N ∑_{k=1}^K E[I(z_i = k)]\
  \ log[π_k p(x_i | θ_k)]\n             = ∑_{i=1}^N ∑_{k=1}^K p(z_i = k | x_i, θ^(t-1))\
  \ log[π_k p(x_i | θ_k)]\n             = ∑_{i=1}^N ∑_{k=1}^K r_{ik} log π_k + ∑_{i=1}^N\
  \ ∑_{k=1}^K r_{ik} log p(x_i | θ_k)  (11.16)\n```\n\n其中 `r_{ik} ≜ E[I(z_i = k)]\
  \ = p(z_i = k | x_i, θ^(t-1))` 是簇 `k` 对数据点 `i` 承担的**责任度**。这在下面描述的 E 步中计算。\n\n```math\n\
  θ^t = arg max Q(θ, θ^(t-1)) + log p(θ)  (11.15)\n      θ\n```\n\n##### 11.4.3.2\
  \ E 步\n\nE 步保持不变。E 步具有以下简单形式，对于任何混合模型都相同：\n\n```math\nr_{ik} = p(z_i = k | x_i,\
  \ θ^(t-1)) = \\frac{p(z_i = k, x_i | θ^(t-1))}{p(x_i | θ^(t-1))}  (11.17)\n    \
  \   = \\frac{π_k p(x_i | θ_k^(t-1))}{∑_{k'=1}^K π_{k'} p(x_i | θ_{k'}^(t-1))}\n\
  ```\n\n##### 11.4.3.3 M 步\n\n在 M 步中，我们针对 `π` 和 `θ_k` 优化 `Q`。对于 `π`，将仅依赖于 `π` 的项归类在一起，我们发现需要最大化\
  \ `∑_{i=1}^N ∑_{k=1}^K r_{ik} log π_k`。然而，存在一个额外约束 `∑_{k=1}^K π_k = 1`，因为它们代表概率\
  \ `π_k = P(z_i = k)`。为了处理该约束，我们构建拉格朗日函数：\n\n```math\nL(π) = ∑_{i=1}^N ∑_{k=1}^K\
  \ r_{ik} log π_k + β(∑_{k=1}^K π_k - 1)\n```\n\n其中 `β` 是拉格朗日乘子。求导后，我们得到：\n\n```math\n\
  π_k = \\frac{∑_{i=1}^N r_{ik}}{N}  (11.18)\n```\n\n这对任何混合模型都适用，而 `θ_k` 则取决于 `p(x\
  \ | θ_k)` 的形式。\n\n对于 `θ_k`，将概率密度函数代入公式 11.16：\n\n```math\nQ(θ, θ^(t-1)) = ∑_{i=1}^N\
  \ ∑_{k=1}^K r_{ik} log π_k - \\frac{1}{2} ∑_{i=1}^N ∑_{k=1}^K r_{ik} [log |Σ_k|\
  \ + (x_i - μ_k)^T Σ_k^{-1} (x_i - μ_k)]\n```\n\n对 `Q` 分别求 `μ_k`、`Σ_k` 的偏导数并令其等于\
  \ 0，可得：\n\n```math\n\\frac{∂Q}{∂μ_k} = -\\frac{1}{2} ∑_{i=1}^N r_{ik} [(Σ_k^{-1}\
  \ + Σ_k^{-T})(x_i - μ_k)]\n               = -[Σ_k^{-1}(x_i - μ_k)] ∑_{i=1}^N r_{ik}\
  \ = 0\n⇒ μ_k = \\frac{∑_{i=1}^N r_{ik} x_i}{∑_{i=1}^N r_{ik}}  (11.19)\n```\n\n\
  ```math\n\\frac{∂Q}{∂Σ_k} = -\\frac{1}{2} ∑_{i=1}^N r_{ik} [\\frac{1}{Σ_k} - \\\
  frac{1}{Σ_k²} (x_i - μ_k)(x_i - μ_k)^T] = 0\n⇒ Σ_k = \\frac{∑_{i=1}^N r_{ik} (x_i\
  \ - μ_k)(x_i - μ_k)^T}{∑_{i=1}^N r_{ik}}  (11.20)\n```\n\n```math\n= \\frac{∑_{i=1}^N\
  \ r_{ik} x_i x_i^T}{∑_{i=1}^N r_{ik}} - μ_k μ_k^T  (11.21)\n```\n\n##### 11.4.3.4\
  \ 算法伪代码\n\n**输入**：观测数据 `D = {x1, x2, ..., xN}`，GMM\n\n**输出**：GMM 的参数 `π, μ, Σ`\n\
  \n```text\n// 1. 初始化\nπ⁰ = ...\nμ⁰ = ...\nΣ⁰ = ...\nt = 0\n\nwhile (!convergency)\
  \ do\n    // 2. E 步\n    r̂_{ik} = \\frac{π_k p(x_i | θ_k^(t-1))}{∑_{k'=1}^K π_{k'}\
  \ p(x_i | μ_{k'}^(t-1), Σ_{k'}^(t-1))}\n\n    // 3. M 步\n    π̂_k = \\frac{∑_{i=1}^N\
  \ r̂_{ik}}{N}\n    μ̂_k = \\frac{∑_{i=1}^N r̂_{ik} x_i}{∑_{i=1}^N r̂_{ik}}\n   \
  \ Σ̂_k = \\frac{∑_{i=1}^N r̂_{ik} (x_i - μ̂_k)(x_i - μ̂_k)^T}{∑_{i=1}^N r̂_{ik}}\n\
  \    t++\nend\n```\n\n**算法 4**：GMM 的 EM 算法\n\n##### 11.4.3.5 MAP 估计\n\n和往常一样，MLE\
  \ 可能会过拟合。在 GMM 的情况下，过拟合问题尤为严重。一个简单的解决方案是执行 MAP 估计。新的辅助函数是期望完全数据对数似然加上对数先验：\n\n```math\n\
  Q(θ, θ^(t-1)) = ∑_{i=1}^N ∑_{k=1}^K r_{ik} log π_k + ∑_{i=1}^N ∑_{k=1}^K r_{ik}\
  \ log p(x_i | θ_k)\n              + log p(π) + ∑_{k=1}^K log p(θ_k)\n```\n\n使用共轭先验是很自然的。\n\
  \n```math\np(π) = Dir(π | α)\np(μ_k, Σ_k) = NIW(μ_k, Σ_k | m_0, κ_0, ν_0, S_0)\n\
  ```\n\n根据公式 3.28 和第 4.6.3 节，MAP 估计由下式给出：\n\n```math\nπ_k = \\frac{∑_{i=1}^N r_{ik}\
  \ + α_k - 1}{N + ∑_{k=1}^K α_k - K}  (11.23)\nμ_k = \\frac{∑_{i=1}^N r_{ik} x_i\
  \ + κ_0 m_0}{∑_{i=1}^N r_{ik} + κ_0}  (11.24)\nΣ_k = \\frac{\\bar{S}_0 + S_k + \\\
  frac{κ_0 r_k}{κ_0 + r_k} (\\bar{x}_k - m_0)(\\bar{x}_k - m_0)^T}{ν_0 + r_k + D +\
  \ 2}  (11.25)\n```\n\n其中 `r_k ≜ ∑_{i=1}^N r_{ik}`，`\\bar{x}_k ≜ \\frac{∑_{i=1}^N\
  \ r_{ik} x_i}{r_k}`，`\\bar{S}_k ≜ \\frac{∑_{i=1}^N r_{ik} (x_i - \\bar{x}_k)(x_i\
  \ - \\bar{x}_k)^T}{r_k}`。\n\n#### 11.4.4 K-means 的 EM 算法\n\n##### 11.4.4.1 表示\n\n\
  ```math\ny_j = k \\text{ if } \\| x_j - μ_k \\|_2² \\text{ is minimal}  (11.26)\n\
  ```\n\n其中 `μ_k` 是簇 `k` 的质心。\n\n##### 11.4.4.2 评估\n\n```math\n\\arg \\min_{μ} ∑_{j=1}^N\
  \ ∑_{k=1}^K γ_{jk} \\| x_j - μ_k \\|_2²  (11.27)\n```\n\n隐变量是 `γ_{jk}`，其含义为：\n\n\
  ```math\nγ_{jk} = \\begin{cases}\n1, & \\text{if } \\| x_j - μ_k \\|_2² \\text{\
  \ is minimal for } μ_k \\\\\n0, & \\text{otherwise}\n\\end{cases}\n```\n\n#####\
  \ 11.4.4.3 优化\n\n**E 步**：\n\n```math\nγ_{jk}^{(i+1)} = \\begin{cases}\n1, & \\text{if\
  \ } \\| x_j - μ_k^{(i)} \\|_2² \\text{ is minimal for } μ_k^{(i)} \\\\\n0, & \\\
  text{otherwise}\n\\end{cases}\n```\n\n**M 步**：\n\n```math\nμ_k^{(i+1)} = \\frac{∑_{j=1}^N\
  \ γ_{jk}^{(i+1)} x_j}{∑_{j=1}^N γ_{jk}^{(i+1)}}  (11.28)\n```\n\n##### 11.4.4.4\
  \ 技巧\n\n**选择初始质心（种子）**\n\n1. **K-means++**。这种方法背后的直觉是：将 `k` 个初始簇中心分散开是件好事：第一个簇中心从正在聚类的数据点中均匀随机选择，之后每个后续簇中心从剩余数据点中选择，选择概率与该点到其最近的现有簇中心的平方距离成正比。具体算法如下：\n\
  \   a. 从数据点中均匀随机选择一个中心。\n   b. 对每个数据点 `x`，计算 `D(x)`，即 `x` 与已选最近中心之间的距离。\n   c. 以加权概率分布随机选择一个新数据点作为新中心，其中点\
  \ `x` 被选中的概率与 `D(x)²` 成正比。\n   d. 重复步骤 2 和 3，直到选出 `k` 个中心。\n   e. 既然初始中心已选定，便使用标准\
  \ K-means 聚类继续进行。\n\n2. TODO\n\n#### 11.4.5 专家混合模型的 EM 算法\n\nTODO\n\n#### 11.4.6\
  \ 含隐变量的有向图模型的 EM 算法\n\n#### 11.4.7 Student 分布的 EM 算法\n\n#### 11.4.8 Probit 回归的 EM\
  \ 算法\n\n#### 11.4.9 Q 函数的推导（Jensen 不等式）\n\n设 `f` 为定义在凸集 `S` 上的**凸函数**（见附录 A.1）。若\
  \ `x_1, x_2, ..., x_n ∈ S` 且 `λ_1, λ_2, ..., λ_n ≥ 0` 且 `∑_{i=1}^n λ_i = 1`，则：\n\
  \n```math\nf(∑_{i=1}^n λ_i x_i) ≤ ∑_{i=1}^n λ_i f(x_i)  (11.29)\n```\n\n**命题 11.1**。\n\
  \n```math\nlog(∑_{i=1}^n λ_i x_i) ≥ ∑_{i=1}^n λ_i log(x_i)  (11.30)\n```\n\n现在让我们证明为什么\
  \ Q 函数应如公式 11.13 所示：\n\n```math\nℓ(θ) = log P(D | θ)\n     = log ∑_z P(D, z | θ)\n\
  \     = log ∑_z P(D | z, θ) P(z | θ)\n     = log ∑_z \\frac{P(z | D, θ^(t-1)) P(D\
  \ | z, θ) P(z | θ)}{P(z | D, θ^(t-1))}\n     = log ∑_z P(z | D, θ^(t-1)) \\frac{P(D\
  \ | z, θ) P(z | θ)}{P(z | D, θ^(t-1)) P(D | θ^(t-1))} P(D | θ^(t-1))\n     ≥ ∑_z\
  \ P(z | D, θ^(t-1)) log \\frac{P(D | z, θ) P(z | θ)}{P(z | D, θ^(t-1)) P(D | θ^(t-1))}\n\
  \     = ∑_z P(z | D, θ^(t-1)) log \\frac{P(D | z, θ) P(z | θ)}{P(z | D, θ^(t-1))}\
  \ - log P(D | θ^(t-1))\n```\n\n![图 11.4：EM 算法单次迭代的图形解释：函数 B(θ, θ^(t-1)) 由对数似然函数\
  \ ℓ(θ) 上界。两函数在 θ = θ^(t-1) 处相等。EM 算法选择使 B(θ, θ^(t-1)) 取得最大值的 θ 值作为 θ^t。由于 ℓ(θ) ≥\
  \ B(θ, θ^(t-1))，增加 B(θ, θ^(t-1)) 可确保对数似然函数 ℓ(θ) 的值在每一步都增加。](img/image_rsrc1RT.jpg)\n\
  \n```math\nB(θ, θ^(t-1)) ≜ ∑_z P(z | D, θ^(t-1)) log \\frac{P(D | z, θ) P(z | θ)}{P(z\
  \ | D, θ^(t-1)) P(D | θ^(t-1))}\n```\n\n由于期望完全数据对数似然 `Q` 是通过丢弃 `B(θ, θ^(t-1))` 中关于\
  \ `θ` 为常数的项而得到的，因此它也是 `ℓ(θ)` 的一个下界的下界。\n\n```math\nθ^t = \\arg \\max_θ B(θ, θ^(t-1))\n\
  \    = \\arg \\max_θ [ℓ(θ^(t-1)) + ∑_z P(z | D, θ^(t-1)) log \\frac{P(D | z, θ)\
  \ P(z | θ)}{P(z | D, θ^(t-1)) P(D | θ^(t-1))}]\n    = \\arg \\max_θ ∑_z P(z | D,\
  \ θ^(t-1)) log [P(D | z, θ) P(z | θ)]\n```\n\n#### 11.4.10 EM 算法的收敛性\n\n##### 11.4.10.1\
  \ 期望完全数据对数似然是一个下界\n\n注意 `ℓ(θ) ≥ B(θ, θ^(t-1))`，且 `ℓ(θ^(t-1)) = B(θ^(t-1), θ^(t-1))`，这意味着\
  \ `B(θ, θ^(t-1))` 是 `ℓ(θ)` 的下界。如果我们最大化 `B(θ, θ^(t-1))`，则 `ℓ(θ)` 也会被最大化。\n\n#####\
  \ 11.4.10.2 EM 单调增加观测数据对数似然\n\n现在丢弃关于 `θ` 为常数的项：\n\n```math\nθ^t = \\arg \\max_θ\
  \ ∑_z P(z | D, θ^(t-1)) log [P(D | z, θ) P(z | θ)]\n```\n\n#### 11.4.11 EM 算法的推广\n\
  \n\n\n\n# EM 算法与潜变量模型\n\n### 11.4 EM 算法\n\nEM 算法可以解释为 F 函数的极大化-极大化算法：\n\n```\n{\
  \ z } EM 算法可以解释为 F 函数的 = arg max ∑P(z|D,θ−1)log[P(D,z|θ)] 极大化-极大化算法，基于此解释有许多变体和推广，(11.32)\
  \ 例如广义 EM 算法(GEM)。θ≜\narg max Ez|D,θt−1 log[P(D,z|θ)]} θ\narg maxQ(θ,θt−1) (11.33)\n\
  θ\n```\n\n##### 11.4.11.1 F 函数的极大化-极大化算法\n\n**定义 11.1。** 给定隐变量 Z 的概率分布为 `˜(Z)`，定义\
  \ F 函数如下：\n\n```\n˜ ˜ F(P,θ) = E ˜[logP(X,Z|θ)] + H(P) (11.34)\n```\n\n其中 `H(P)\
  \ = −E ˜[log ˜P(Z)]`，即 `˜P(Z)` 的熵。\n\n假设 `θt−1` 是第 (t−1) 次迭代中 `θ` 的估计，`˜t−1` 是第\
  \ (t−1) 次迭代中 `˜P` 的估计。则第 t 次迭代的两个步骤为：\n1. 固定 `θt−1`，寻找使 `F(˜P, θt−1)` 极大化的 `˜t`；\n\
  2. 固定 `˜t`，寻找使 `F(˜Pt, θ)` 极大化的 `θt`。\n\n**引理 11.1。** 对于固定的 `θ`，仅存在一个分布 `˜Pθ` 使\
  \ `F(˜P, θ)` 极大化：\n\n```\n˜Pθ(Z) = P(Z|X,θ) (11.35)\n```\n\n**证明。** 给定固定的 `θ`，我们可以得到使\
  \ `F(˜P, θ)` 极大化的 `˜θ`。我们构造拉格朗日函数：\n\n```\n˜ log ˜Pθ(Z)\nL(˜P, θ) = E ˜[logP(X,Z|θ)]\
  \ − E ˜[P] + λ(1 − ∑P(Z))\nZ\n```\n\n对 `˜Pθ(Z)` 求偏导数，得到：\n\n```\n∂L/∂˜Pθ(Z) = logP(X,Z|θ)\
  \ − log ˜Pθ(Z) − 1 − λ\n```\n\n令其等于 0，可得 `λ = logP(X,Z|θ) − log ˜θ(Z) − 1`。\n\n\
  然后我们可以推导出 `˜Pθ(Z)` 与 `P(X,Z|θ)` 成正比：\n\n```\nP(X,Z|θ) = e1+λ ˜Pθ(Z)\n˜Pθ(Z) = P(X,Z|θ)\
  \ / e1+λ\n∑P(X,Z|θ) = 1\nZ\n⇒ e1+λ = ∑P(X,Z|θ) = P(X|θ)\nZ\n⇒ ˜Pθ(Z) = P(X,Z|θ)\
  \ / P(X|θ) = P(Z|X,θ)\n```\n\n**引理 11.2。** 若 `˜Pθ(Z) = P(Z|X,θ)`，则：\n\n```\n˜F(P,\
  \ θ) = logP(X|θ) (11.37)\n```\n\n**定理 11.2.** EM 算法的一次迭代可以实现为 F 函数的极大化-极大化。\n\n\
  **证明。**\n(1) 根据引理 11.1，可得 `˜Pt(Z) = P(Z|X,θt−1)`。\n(2) 根据上述，可得：\n\n```\n˜F(Pt, θ)\
  \ = E ˜t[logP(X,Z|θ)] + H(Pt)\n= ∑P(Z|X,θt−1)logP(X,Z|θ) + H(Pt)\nZ\n= Q(θ, θt−1)\
  \ + H(Pt)\n```\n\n且 `˜Pθ` 关于 `θ` 连续。则使 `F(˜Pt, θ)` 极大化的 `θt` 为：\n\n```\nθt = arg\
  \ max F(Pt, θ) = arg max Q(θ, θt−1)\nθ θ\n```\n\n##### 11.4.11.2 广义 EM 算法 (GEM)\n\
  \n在上述 EM 算法的公式化中，`θt` 被选为使 `Q(θ, θt−1)` 极大化的 `θ` 值。虽然这确保了 `ℓ(θ)` 最大程度地增加，但可以将极大化的要求放宽为仅增加\
  \ `Q(θ, θt−1)`，即 `Q(θt, θt−1) ≥ Q(θt−1, θt−1)`。这种仅增加而不一定极大化 `Q(θt, θt−1)` 的方法称为**广义期望极大化\
  \ (GEM)** 算法，在极大化困难的情况下通常很有用。GEM 算法的收敛性与 EM 算法类似。\n\n#### 11.4.12 在线 EM\n\n####\
  \ 11.4.13 其他 EM 变体\n\n### 11.5 潜变量模型的模型选择\n\n使用 LVM 时，我们必须指定潜变量的数量，这控制着模型复杂度。特别是对于混合模型，我们必须指定\
  \ K，即聚类的数量。选择这些参数是模型选择的一个例子。下面我们讨论一些方法。\n\n#### 11.5.1 概率模型的模型选择\n\n第 5.3 节讨论的最优贝叶斯方法是选择边际似然\
  \ `K = arg maxk p(D|k)` 最大的模型。这存在两个问题。首先，对 LVM 计算边际似然相当困难。实践中，可以使用简单的近似，如 BIC（参见例如\
  \ Fraley and Raftery 2002）。或者，我们可以使用交叉验证似然作为性能度量，尽管这可能很慢，因为它需要拟合每个模型 F 次，其中 F 是\
  \ CV 折数。第二个问题是需要在潜在的大量模型中搜索。通常的方法是对所有候选 K 值进行穷尽搜索。然而，有时我们可以将模型设置为最大规模，然后依靠贝叶斯奥卡姆剃刀的力量来消除不需要的组件。第\
  \ TODO 21.6.1.6 节将展示一个例子，届时我们将讨论变分贝叶斯。另一种方法是在模型空间中进行随机采样。传统方法（如 Green 1998, 2003;\
  \ Lunn et al. 2009）基于可逆跳 MCMC，使用出生移动来提议新中心，使用死亡移动来消除旧中心。然而，这可能很慢且难以实现。一种更简单的方法是使用狄利克雷过程混合模型，它可以使用吉布斯采样进行拟合，但仍允许无限数量的混合成分；详见第\
  \ TODO 25.2 节。也许令人惊讶的是，这些基于采样的方法可能比单独评估每个 K 质量的简单方法更快。原因在于为每个 K 拟合模型通常很慢。相比之下，采样方法通常能快速确定某个\
  \ K 值较差，因此无需在后验的该部分浪费时间。\n\n#### 11.5.2 非概率方法的模型选择\n\n如果我们不使用概率模型怎么办？例如，如何为 K-means\
  \ 算法选择 K？由于这不对应概率模型，因此没有似然，所以上述方法都无法使用。似然的一个明显代理指标是重构误差。定义使用模型复杂度 K 对数据集 D 的平方重构误差如下：\n\
  \n```\nE(D, K) ≜ 1/N ∑|xi − x̂i|² (11.38)\n|D| i=1\n```\n\n对于 K-means，重构由 `xi =\
  \ µzi` 给出，其中 `zi = arg mink ||xi − µk||²`，如第 11.4.2.6 节 TODO 所述。在监督学习中，我们总是可以使用交叉验证在不同复杂度的非概率模型之间进行选择，但无监督学习则不然。最常用的方法是绘制训练集上的重构误差随\
  \ K 变化的曲线，并尝试识别曲线中的肘部或拐点。\n\n### 11.6 缺失数据下的模型拟合\n\n假设我们想通过极大似然拟合联合密度模型，但数据矩阵中有空洞，这是由于缺失数据造成的（通常用\
