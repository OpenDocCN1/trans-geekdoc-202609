  ### 8.6 生成式与判别式分类器\n\n#### 8.6.1 放大判别式目标的各种方法的优缺点 (Salojarvi et al. 2005)\n\n* \
  \  **能否轻松处理缺失元素？**\n    有时部分输入源（`x` 的部分）未被观测到。在生成式分类器中，存在一种直接的技术来处理此问题，我们将在第 8.6.2\
  \ 节中探讨。然而，在判别式分类器中，对此问题没有原则性的解决方案，因为该模型假设 `x` 始终可用以供条件建模（尽管参见 Marlin 2008 了解一些启发式方法）。\n\
  \n*   **能否处理无标签训练数据？**\n    人们对半监督学习非常感兴趣，它利用无标签数据来辅助解决监督任务。使用生成式模型这相当容易（参见例如 Lasserre\
  \ et al. 2006; Liang et al. 2007），但用判别式模型则难得多。\n\n*   **输入和输出是否对称？**\n    我们可以反向运行生成式模型，并通过计算\
  \ `p(x|y)` 根据输出推断合理的输入。这在判别式模型中是不可想象的。原因在于生成式模型在 `x` 和 `y` 上定义了联合分布，因此对输入和输出进行对称处理。\n\
  \n*   **能否处理特征预处理？**\n    判别式方法的一大优势是允许我们以任意方式预处理输入，例如，我们可以用 `ϕ(x)` 替换 `x`，这可能是某种基函数展开等。在如此预处理的数据上定义生成式模型通常很难，因为新特征以复杂的方式相关联。\n\
  \n*   **概率是否校准良好？**\n    某些生成式模型（如朴素贝叶斯）做出强烈的独立性假设，这些假设通常不成立。这可能导致极端的后验类概率（非常接近\
  \ 0 或 1）。判别式模型（如逻辑回归）在其概率估计方面通常校准得更好。\n\n*   **是否易于拟合？**\n    正如我们所见，拟合生成式分类器通常非常简单。例如，在第\
  \ 3.5.1 节和第 4.2.4 节中，我们展示了可以通过简单的计数和平均来拟合朴素贝叶斯模型和 LDA 模型。相反，逻辑回归需要解决一个凸优化问题（详见第\
  \ 8.2 节），这要慢得多。\n\n*   **能否独立拟合类别？**\n    在生成式分类器中，我们独立估计每个类条件密度的参数，因此当我们增加更多类别时，不需要重新训练模型。相比之下，在判别式模型中，所有参数相互作用，因此如果增加新类别，必须在整个数据集上重新训练整个模型。（如果训练生成式模型……情况也是如此）\n\
