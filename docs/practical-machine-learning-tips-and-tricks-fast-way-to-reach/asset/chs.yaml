  \ = 1 : N` |\n| `X` | 大小为 `N×D` 的设计矩阵 |\n| `x̄` | 经验均值 `x̄ = 1/N ∑ᵢᴺ x_i` |\n| `x̃`\
  \ | 未来测试样本 |\n| `x̃` | 特征测试样本 |\n\n\n\n\n\n## 简介\n\n### 1.1 机器学习的类型\n\n- 分类\n- 监督学习\n\
  - 回归\n- 发现簇\n- 发现潜在因子\n- 无监督学习\n- 发现图结构\n- 矩阵分解\n\n对于准备模型 `(xi, yi)`，预测值 `y` 的损失为\
  \ `L(yi, y)`。以下是一些常见的损失函数：\n\n1. **0-1 损失函数**\n   `{1, Y = f(X) L(Y, f(X)) = I(Y,\
  \ f(X)) = 0, Y ≠ f(X)}`\n2. **平方损失函数**\n   `L(Y, f(X)) = (Y − f(X))²`\n3. **绝对损失函数**\n\
  \   `L(Y, f(X)) = |Y − f(X)|`\n4. **对数损失函数**\n   `L(Y, P(Y|X)) = −log P(Y|X)`\n\n\
  ### 1.2 机器学习模型的三要素\n\n**模型 = 表示 + 评价 + 优化**\n\n#### 定义 1.2\n容量 `f` 的风险被定义为 `f` 的期望损失：\n\
  \n```\nR_exp(f) = E[L(Y, f(X))] = ∫ L(y, f(x)) P(x,y) dx dy\n```\n这也被称为期望损失或风险函数。\n\
  \n#### 1.2.1 表示\n\n#### 定义 1.3\n风险函数 `R_exp(f)` 可以从训练数据中估计为：\n\n在监督学习中，模型必须表示为条件概率分布\
  \ `P(y|x)`（通常我们称之为分类器）或决策函数 `f(x)`。分类器（或决策函数）的集合被称为模型的假设空间。为模型选择一种表示等同于选择它可能学习的假设空间。\n\
  \n#### 1.2.2 评价\n\n在假设空间中，需要一个评价函数（也称为目标函数或风险函数）来将好的分类器（或决策函数）与坏的区分开来。\n\n#####\
  \ 1.2.2.1 损失函数和风险函数\n\n#### 定义 1.1\n为了量化函数拟合训练数据的程度，定义了一个损失函数 `L: Y × Y → R≥0`。\n\
  \n```\nR_emp(f) = (1/N) ∑_{i=1}^N L(yi, f(xi))\n```\n这也被称为经验损失或经验风险。\n\n你可以定义自己的损失函数，但如果你是初学者，最好使用文献中的现成函数。损失函数应满足以下条件：\n\
  \n1. 它们应近似你试图最小化的真实损失。正如另一个回答所说，分类的标准损失函数是零一损失（误分类率），而用于训练分类器的损失函数是该损失的近似。\n2. 损失函数应配合你计划的优化算法。这就是为什么零一损失不直接使用的原因：它不适用于基于梯度的优化方法，因为它没有明确的梯度（甚至没有次梯度，就像\
  \ SVM 的铰链损失那样）。\n\n直接优化零一损失的基本算法是旧的感知机算法（第 §?? 章）。\n\n##### 1.2.2.2 ERM 和 SRM\n\n\
  #### 定义 1.4. ERM（经验风险最小化）\n无需训练。\n\n```\nmin_{f ∈ F} R_emp(f) = min_{f ∈ F} (1/N)\
  \ ∑_{i=1}^N L(yi, f(xi))\n```\n\n#### 定义 1.5. 结构风险\n```\nR_smp(f) = (1/N) ∑_{i=1}^N\
  \ L(yi, f(xi)) + λ J(f)\n```\n\n#### 定义 1.6. SRM（结构风险最小化）\n```\nmin_{f ∈ F} R_srm(f)\
  \ = min_{f ∈ F} (1/N) ∑_{i=1}^N L(yi, f(xi)) + λ J(f)\n```\n\n#### 1.2.3 优化\n\n\
  最后，我们需要一个训练算法（也称为学习算法）在假设空间的分类器中寻找得分最高的那个。优化过程的选择对模型的效率至关重要。\n\n### 1.3.4 交叉验证\n\
  \n#### 定义 1.7. 交叉验证\n交叉验证，有时称为轮转估计，是一种模型验证技术，用于评估统计分析的结果将如何推广到独立数据集。常见的交叉验证类型：\n\
  \n1. **K-折交叉验证**。在 K-折交叉验证中，原始样本被随机划分为 k 个大小相等的子样本。在 k 个子样本中，保留单个子样本作为验证数据来测试模型，其余\
  \ k-1 个子样本用作训练数据。\n2. **2-折交叉验证**。也称为简单交叉验证或留出法。这是 K-折交叉验证最简单的变体，k=2。\n3. **留一法交叉验证\
  \ (LOOCV)**。k=M，即不同样本的数量。\n\n### 1.3 一些基本概念\n\n#### 1.3.1 参数模型与非参数模型\n\n### 1.3.5\
  \ 模型选择\n\n当我们有一系列不同复杂度的模型（例如，具有不同次数多项式的线性或逻辑回归模型，或具有不同 `K` 值的 KNN 分类器）时，我们如何选择正确的模型？一种自然的方法是计算每种方法在训练集上的误分类率。\n\
  \n#### 1.3.2 一个简单的非参数分类器：K-近邻\n\n##### 1.3.2.1 表示\n\n```\ny = f(x) = arg min_c ∑_{i\
  \ ∈ N_k(x)} I(yi = c)\n```\n其中 `N_k(x)` 是距离点 `x` 最近的 `k` 个点的集合。通常使用 `k-d tree` 来加速寻找\
  \ `k` 个最近点的过程。\n\n##### 1.3.2.2 评价\n\n无需训练。\n\n## 概率\n\n### 2.1 频率学派 vs. 贝叶斯学派\n\
  \n什么是概率？一种解释称为频率学派解释。在这种观点下，概率代表事件的长期频率。例如，上述陈述意味着，如果我们多次抛掷硬币，我们预期它大约有一半的时间正面朝上。另一种解释称为概率的贝叶斯解释。在这种观点下，概率用于量化我们对某事的不确定性；因此它从根本上与信息有关，而不是重复试验\
  \ (Jaynes 2003)。在贝叶斯观点中，上述陈述意味着我们认为硬币在下一次抛掷时正面朝上和反面朝上的可能性相同。\n\n贝叶斯解释的一个主要优点是它可以用来建模那些没有长期频率的事件的不确定性。例如，我们可能想计算极地冰盖将在\
  \ 2020 年 CE 之前融化的概率。这个事件将发生零次或一次，但不会发生多次。尽管如此，我们仍应能够量化我们对该事件的不确定性。再举一个面向 AI 的例子，我们可能在雷达屏幕上观察到一个光点，并想计算相应目标位置的概率分布（无论它是鸟、飞机还是火箭）。在所有这些情况下，重复试验的概念都讲不通，但贝叶斯解释是有效的，而且确实非常自然。因此，我们将在本书中采用贝叶斯解释。幸运的是，概率论的基本规则是相同的，无论采用哪种解释。\n\
  \n##### 2.2.1.1 累积分布函数 (CDF)\n\n```\nP(X ≤ x) = F(x) ≜ { ∑_{u ≤ x} p(u), 离散; ∫_{-∞}^x\
  \ f(u) du, 连续 }\n```\n\n##### 2.2.1.2 概率质量函数 (PMF) 和概率密度函数 (PDF)\n\n对于离散随机变量，我们用\
  \ `P(X = x)` 或简写为 `p(x)` 来表示事件 `X = x` 的概率。这里 `p(x)` 称为概率质量函数或 PMF。概率质量函数是给出离散随机变量恰好等于某个值的概率的函数。\n\
  \n这满足性质 `0 ≤ p(x) ≤ 1` 和 `∑_{x ∈ X} p(x) = 1`。\n\n对于连续变量，在 `F(x) = ∫_{-∞}^x f(u)\
  \ du` 的情况下，函数 `f(x)` 称为...\n\n\n\n\n\n### 2.2 概率论简述\n\n#### 2.2.1 基本概念\n\n我们通过表征随机变量\
  \ `X` 来表示任意场合。\n\n**离散随机变量**：`X` 可以取自有限或可数无限集合中的任意值。\n\n**连续随机变量**：`X` 的值为实数值。\n\
  \n#### 2.2.2 多元随机变量\n\n##### 2.2.2.1 联合累积分布函数\n\n我们用 `F(x,y) ≜ P(X≤ x ∩ Y≤ y) =\
  \ P(X≤ x, Y≤ y)` 表示联合累积分布函数。\n\n```\np(u,v)\nF(x,y) ≜ P(X≤ x, Y≤ y) = ∑_{u≤x,v≤y}\
  \ p(u,v)  (离散)\nF(x,y) ≜ P(X≤ x, Y≤ y) = ∫_{-∞}^{x} ∫_{-∞}^{y} f(u,v) du dv  (连续)\n\
  ```\n\n##### 2.2.2.2 边缘分布\n\n**边缘累积分布函数**：\n```\nF_X(x) ≜ F(x, +∞) = P(X = x_i)\
  \ = ∑_j P(X = x_i, Y = y_j)  (离散)\nF_X(x) ≜ ∫_{-∞}^{x} f_X(u) du = ∫_{-∞}^{x} ∫_{-∞}^{+∞}\
  \ f(u,v) dv du  (连续)\n```\n\n```\nF_Y(y) ≜ F(+∞, y) = P(Y = y_j) = ∑_i P(X = x_i,\
  \ Y = y_j)  (离散)\nF_Y(y) ≜ ∫_{-∞}^{y} f_Y(v) dv = ∫_{-∞}^{y} ∫_{-∞}^{+∞} f(u,v)\
  \ du dv  (连续)\n```\n\n**边缘概率质量函数和概率密度函数**：\n```\nP(X = x_i) = ∑_{j=1}^{+∞} P(X =\
  \ x_i, Y = y_j)  (离散)\nf_X(x) = ∫_{-∞}^{+∞} f(x,y) dy  (连续)\n```\n\n```\nP(Y = y_j)\
  \ = ∑_{i=1}^{+∞} P(X = x_i, Y = y_j)  (离散)\nf_Y(y) = ∫_{-∞}^{+∞} f(x,y) dx  (连续)\n\
  ```\n\n##### 2.2.2.3 条件分布\n\n**条件概率质量函数**：\n```\np(X = x_i | Y = y_j) = p(X = x_i,\
  \ Y = y_j) / p(Y = y_j)  if p(Y) > 0  (2.9)\n```\n概率质量函数 `p(X|Y)` 称为条件似然。\n\n**条件概率密度函数**：\n\
  ```\nf_{X|Y}(x|y) = f(x,y) / f_Y(y)  (2.10)\n```\n\n#### 2.2.3 贝叶斯法则\n\n```\np(Y\
  \ = y | X = x) = p(X = x, Y = y) / p(X = x)\np(X = x | Y = y) p(Y = y) / ∑_{y'}\
  \ p(X = x | Y = y') p(Y = y')  (2.11)\n```\n\n#### 2.2.4 独立性与条件独立性\n\n如果我们可以将联合分布表示为两个边缘分布的乘积，即\n\
  ```\nP(X,Y) = P(X)P(Y)  (2.12)\n```\n则称 `X` 和 `Y` 为**显式独立**或**边缘独立**，记作 `X ⊥ Y`。\n\
  \n如果条件联合分布可以写成条件边缘分布的乘积，则称给定 `Z` 时 `X` 和 `Y` **条件独立**（CI）：\n```\nX ⊥ Y | Z = P(X,Y|Z)\
  \ = P(X|Z)P(Y|Z)  (2.13)\n```\n\n#### 2.2.5 分位数\n\n由于累积分布函数 `F` 是单调递增函数，它有一个反函数；我们将其记为\
  \ `F^{-1}`。如果 `F` 是 `X` 的累积分布函数，则 `F^{-1}(α)` 是使得 `P(X ≤ x_α) = α` 成立的 `x_α` 值；这称为\
  \ `F` 的 `α`-分位数。值 `F^{-1}(0.5)` 是分布的**中位数**，概率质量有一半在左侧，一半在右侧。值 `F^{-1}(0.25)` 和\
  \ `F^{-1}(0.75)` 分别是下四分位数和上四分位数。\n\n#### 2.2.6 均值与方差\n\n分布最自然的性质是其均值，或期望值，记为 `µ`。\n\
  \n对于离散随机变量，定义为 `E[X] ≜ ∑_x x p(x)`；对于连续随机变量，定义为 `E[X] ≜ ∫ x p(x) dx`。如果该积分不是有限的，则均值未定义。\n\
  \n方差是分布离散程度的度量，记为 `σ²`。定义如下：\n```\nvar[X] ≜ E[(X - µ)²]\n     = ∫ (x - µ)² p(x)\
  \ dx\n     = ∫ x² p(x) dx - 2µ ∫ x p(x) dx + µ² ∫ p(x) dx\n     = E[X²] - µ²  (2.15)\n\
  ```\n由此我们得到有用的结果 `E[X²] = σ² + µ²` (2.16)。\n\n标准差定义为 `std[X] ≜ √var[X]` (2.17)。这很有用，因为它与\
  \ `X` 本身具有相同的单位。\n\n### 2.3 一些常见的离散分布\n\n在本节中，我们回顾一些常用的定义在离散状态空间（包括有限和可数无限）上的参数分布。\n\
  \n#### 2.3.1 伯努利分布与二项分布\n\n**定义 2.1**。现在假设我们只抛一次硬币。令 `X ∈ {0,1}` 为一个二元随机变量，成功或正面的概率为\
  \ `θ`。我们称 `X` 服从**伯努利分布**。这记作 `X ∼ Ber(θ)`，其概率质量函数定义为\n```\nBer(x|θ) ≜ θ^{I(x=1)}\
  \ (1-θ)^{I(x=0)}  (2.18)\n```\n\n**定义 2.2**。假设我们抛硬币 `n` 次。令 `X ∈ {0,1,...,n}` 为正面出现的次数。如果正面的概率是\
  \ `θ`，则称 `X` 服从**二项分布**，记作 `X ∼ Bin(n,θ)`。其概率质量函数为\n```\nBin(k|n,θ) ≜ (n choose\
  \ k) θ^k (1-θ)^{n-k}  (2.19)\n```\n\n#### 2.3.2 多努利分布与多项分布\n\n**定义 2.3**。伯努利分布可用于模拟一次抛硬币的结果。为了模拟投掷一个\
  \ `K` 面骰子的结果，令 `x = (I(x=1), ..., I(x=K)) ∈ {0,1}^K` 为一个随机向量（这称为虚拟编码或独热编码），则称 `X`\
  \ 服从**多努利分布**（或**分类分布**），记作 `X ∼ Cat(θ)`。其概率质量函数为：\n```\np(x) ≜ ∏_{k=1}^K θ_k^{I(x_k=1)}\
  \  (2.20)\n```\n\n**定义 2.4**。假设我们投掷一个 `K` 面骰子 `n` 次。令 `x = (x_1, x_2, ..., x_K)\
  \ ∈ {0,1,...,n}^K` 为一个随机向量，其中 `x_j` 是骰子第 `j` 面出现的次数，则称 `X` 服从**多项分布**，记作 `X ∼ Mu(n,θ)`。其概率质量函数为\n\
  ```\np(x) ≜ (n! / (x_1! x_2! ... x_K!)) ∏_{k=1}^K θ_k^{x_k}  (2.21)\n```\n其中 `x_1\
  \ ... x_K ≜ x_1! x_2! ... x_K!`。\n\n伯努利分布只是 `n = 1` 时二项分布的一个特例，正如多努利分布之于多项分布。见表\
  \ 2.1 总结。\n\n**表 2.1：多项分布及相关分布总结。**\n\n| 名称 | K | n | X |\n| :--- | :--- | :---\
  \ | :--- |\n| 伯努利 | 1 | 1 | `x ∈ {0,1}` |\n| 二项 | 1 | n | `x ∈ {0,1,...,n}` |\n\
  | 多努利 | K | 1 | `x ∈ {0,1}^K, ∑_{k=1}^K x_k = 1` |\n| 多项 | K | n | `x ∈ {0,1,...,n}^K,\
  \ ∑_{k=1}^K x_k = n` |\n\n**表 2.2：伯努利、二项、多努利和多项分布总结。**\n\n| 名称 | 记作 | `p(x)` | `E[X]`\
  \ | `var[X]` |\n| :--- | :--- | :--- | :--- | :--- |\n| 伯努利 | `X ∼ Ber(θ)` | `x\
  \ ∈ {0,1} θ^{I(x=1)}(1-θ)^{I(x=0)}` | `θ` | `θ(1-θ)` |\n| 二项 | `X ∼ Bin(n,θ)` |\
  \ `x ∈ {0,1,...,n} (n choose k) θ^k(1-θ)^{n-k}` | `nθ` | `nθ(1-θ)` |\n| 多努利 | `X\
  \ ∼ Cat(θ)` | `x ∈ {0,1}^K, ∑ x_k=1 ∏_{k=1}^K θ_k^{I(x_k=1)}` | - | - |\n| 多项 |\
  \ `X ∼ Mu(n,θ)` | `x ∈ {0,1,...,n}^K, ∑ x_k=n (n!/(∏ x_k!)) ∏ θ_k^{x_k}` | - | -\
  \ |\n\n#### 2.3.3 泊松分布\n\n**定义 2.5**。如果 `X ∈ {0,1,2,...}` 的概率质量函数为\n```\np(x|λ)\
  \ ≜ e^{-λ} λ^x / x!  (2.22)\n```\n则称其服从参数为 `λ > 0` 的**泊松分布**，记作 `X ∼ Poi(λ)`。\n\
  第一项只是归一化常数，用于确保分布总和为 1。\n\n泊松分布常用作稀有事件计数的模型，如放射性衰变和交通事故。\n\n#### 2.3.4 经验分布\n\n\
  经验分布函数，或经验累积分布函数，是与样本经验测度相关联的累积分布函数。令 `D = {x_1, x_2, ..., x_N}` 为样本集，其定义为\n```\n\
  F_n(x) ≜ (1/N) ∑_{i=1}^N I(x_i ≤ x)  (2.23)\n```\n\n### 2.4 一些常见的连续分布\n\n在本节中，我们介绍一些常用的单变量（一维）连续概率分布。\n\
  \n#### 2.4.1 高斯（正态）分布\n\n**表 2.3：高斯分布总结。**\n\n| 记作 | `f(x)` | `E[X]` | 众数 | `var[X]`\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| `X ∼ N(µ, σ²)` | `1/√(2πσ²) e^{-(x-µ)²\
  \ / (2σ²)}` | `µ` | `µ` | `σ²` |\n\n#### 2.4.2 学生 t 分布\n\n**表 2.4：学生 t 分布总结。**\n\
  \n| 记作 | `f(x)` | `E[X]` | 众数 | `var[X]` |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | `X ∼ T(µ, σ², ν)` | `γ((ν+1)/2) / (√(νπ) γ(ν/2)) (1 + (x-µ)²/(νσ²))^{-(ν+1)/2}`\
  \ | `µ` | `µ` | `νσ²/(ν-2)` |\n\n\n\n\n\n# 概率分布\n\n## 高斯分布\n\n如果 $X \\sim \\mathcal{N}(0,1)$，我们称\
  \ $X$ 服从标准正态分布。高斯分布是在统计学中应用最广泛的分布。主要原因有以下几点：\n\n1.  它有两个易于解释的参数，能够捕捉分布最基本的性质，即均值和方差。\n\
  2.  根据中心极限定理（见第 TODO 节），独立随机变量的和近似服从高斯分布，这使其成为建模残差误差或噪声的良好选择。\n3.  在给定均值和方差的约束下，高斯分布做出的假设最少（具有最大熵），正如第\
  \ TODO 节所示；这使其成为许多情况下的良好默认选择。\n4.  它具有简单的数学形式，由此产生易于实现且通常非常有效的方法，我们将在后续看到。关于高斯分布为何被广泛使用的更广泛讨论，请参见\
  \ (Jaynes 2003, ch 7)。\n\n## Student's t 分布\n\n其中 $\\Gamma(x)$ 是伽马函数：\n$$\n\\Gamma(x)\
  \ = \\int_0^\\infty t^{x-1}e^{-t}dt \\tag{2.24}\n$$\n\n$\\mu$ 是均值，$\\sigma² > 0$\
  \ 是尺度参数，$\\nu > 0$ 称为自由度。请参见图 2.1 查看部分图示。方差仅在 $\\nu > 2$ 时定义。均值仅在 $\\nu > 1$ 时定义。\n\
  \n作为 Student 分布鲁棒性的一个例证，请考虑图 2.2。我们看到高斯分布受影响很大，而 Student 分布几乎不变。这是因为 Student 分布具有更重的尾部，特别是对于较小的\
  \ $\\nu$（见图 2.1）。\n\n如果 $\\nu = 1$，该分布称为柯西分布或洛伦兹分布。它以尾部如此之重以至于定义均值的积分不收敛而著称。\n\n\
  为保证方差有限，我们要求 $\\nu > 2$。通常使用 $\\nu = 4$，这在一系列问题中表现良好 (Lange et al. 1989)。当 $\\nu\
  \ \\ge 5$ 时，Student 分布迅速接近高斯分布并失去其鲁棒性。\n\n![图 2.1(a)](img/image_rsrc1PH.jpg)\n![图\
  \ 2.1(b)](img/image_rsrc1PJ.jpg)\n\n**图 2.1:** (a) $\\mathcal{N}(0,1)$、$T(0,1,1)$\
