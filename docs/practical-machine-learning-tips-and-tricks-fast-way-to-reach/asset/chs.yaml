  \n**图 2.4:** 一些 Beta 分布。\n\n#### 2.4.6 Pareto 分布\n\nPareto 分布用于建模表现出长尾（也称为重尾）的量的分布。当\
  \ $k \\to \\infty$ 时，分布趋近于 $\\delta(x-m)$。请参见图 2.5(a) 查看部分图示。如果我们在对数-对数尺度上绘制分布，它形成一条直线，形式为\
  \ $\\log p(x) = a \\log x + c$，其中 $a$ 和 $c$ 为某些常数。请参见图 2.5(b) 进行说明（这称为幂律）。\n\n**表\
  \ 2.8: Pareto 分布总结**\n\n| 写作 | $f(x)$ | $\\mathbb{E}[X]$ | mode | $\\text{var}[X]$\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| $X \\sim \\text{Pareto}(k, m)$ | $\\\
  frac{k m^k}{x^{k+1}} \\mathbb{I}(x \\ge m)$ | $\\frac{km}{k-1}$ (若 $k > 1$) | $m$\
  \ | $\\frac{m² k}{(k-1)²(k-2)}$ (若 $k > 2$) |\n\n![图 2.5(a)](img/image_rsrc1PS.jpg)\n\
  ![图 2.5(b)](img/image_rsrc1PT.jpg)\n\n**图 2.5:** (a) Pareto 分布 $\\text{Pareto}(x|m,k)$，其中\
  \ $m=1$。(b) 对数-对数尺度上的 pdf。\n\n### 2.5 联合概率分布\n\n给定一个多元随机变量或随机向量 $X \\in \\mathbb{R}^D$，联合概率分布是一个概率分布，它给出了\
  \ $X_1, X_2, \\dots, X_D$ 每一个落在为该变量指定的特定范围或离散值集合中的概率。对于只有两个随机变量的情况，这称为二元分布，但该概念推广到任意数量的随机变量，给出多元分布。联合概率分布可以用联合累积分布函数表示，或者用联合概率密度函数（针对连续变量）或联合概率质量函数（针对离散变量）表示。\n\
  \n#### 2.5.1 协方差与相关性\n\n**定义 2.6.** 两个随机变量 $X$ 和 $Y$ 之间的协方差衡量 $X$ 和 $Y$ 的（线性）相关程度。协方差定义为：\n\
  $$\n\\text{cov}[X,Y] \\triangleq \\mathbb{E}[(X - \\mathbb{E}[X])(Y - \\mathbb{E}[Y])]\
  \ \\tag{2.26}\n= \\mathbb{E}[XY] - \\mathbb{E}[X]\\mathbb{E}[Y]\n$$\n\n**定义 2.7.**\
  \ 如果 $X$ 是一个 $D$ 维随机向量，其协方差矩阵定义为以下对称、半正定矩阵：\n$$\n\\text{cov}[X] \\triangleq \\mathbb{E}[(X\
  \ - \\mathbb{E}[X])(X - \\mathbb{E}[X])^T] \\tag{2.27}\n$$\n\n$$\n\\Sigma = \\begin{pmatrix}\n\
  \\text{var}[X_1] & \\text{Cov}[X_1,X_2] & \\cdots & \\text{Cov}[X_1,X_D] \\\\\n\\\
  text{Cov}[X_2,X_1] & \\text{var}[X_2] & \\cdots & \\text{Cov}[X_2,X_D] \\\\\n\\\
  vdots & \\vdots & \\ddots & \\vdots \\\\\n\\text{Cov}[X_D,X_1] & \\text{Cov}[X_D,X_2]\
  \ & \\cdots & \\text{var}[X_D]\n\\end{pmatrix} \\tag{2.28}\n$$\n\n（$\\Sigma$ 是对称的）。对角协方差矩阵有\
  \ $D$ 个参数，非对角项为 0。球形或各向同性协方差 $\\Sigma = \\sigma² I_D$ 有一个自由参数。\n\n#### 2.5.3 多元\
  \ Student's t 分布\n\n**定义 2.8.** $X$ 和 $Y$ 之间的（Pearson）相关系数定义为：\n$$\n\\text{corr}[X,Y]\
  \ \\triangleq \\frac{\\text{Cov}[X,Y]}{\\sqrt{\\text{var}[X], \\text{var}[Y]}} \\\
  tag{2.29}\n$$\n\n相关矩阵的形式为：\n$$\nR \\triangleq \\begin{pmatrix}\n\\text{corr}[X_1,X_1]\
  \ & \\text{corr}[X_1,X_2] & \\cdots & \\text{corr}[X_1,X_D] \\\\\n\\text{corr}[X_2,X_1]\
  \ & \\text{corr}[X_2,X_2] & \\cdots & \\text{corr}[X_2,X_D] \\\\\n\\vdots & \\vdots\
  \ & \\ddots & \\vdots \\\\\n\\text{corr}[X_D,X_1] & \\text{corr}[X_D,X_2] & \\cdots\
  \ & \\text{corr}[X_D,X_D]\n\\end{pmatrix}\n$$\n\n作为多元正态分布 (MVN) 的一个更鲁棒的替代方案，多元 Student's\
  \ t 分布的 pdf 由下式给出……\n\n\n\n\n\n# 相关系数与多元分布\n\n## 2.5 相关系数\n\n相关系数可以被视为 X 和 Y 之间**线性关系**程度的度量，参见\
  \ Figure 2.6。\n\n**不相关并不意味着独立**。例如，设 `X ~ U(-1,1)` 且 `Y = X²`。显然 Y 依赖于 X（事实上，Y 完全由\
  \ X 决定），但可以证明 `corr[X,Y] = 0`。Figure 2.6 展示了一些这方面的显著实例。这显示了一些数据集，其中 X 和 Y 之间存在明显的依赖关系，但相关系数为\
  \ 0。随机变量之间更广泛的依赖度量是**互信息**，参见 Section TODO。\n\n#### 2.5.2 多元高斯分布\n\n**多元高斯分布**或**多元正态分布**（MVN）是连续变量最常用的联合概率密度函数。我们将在第\
  \ 4 章详细探讨 MVN；此处仅给出一些定义和图示。\n\nD 维 MVN 的 pdf 定义为：\n\n```\nN(x|μ,Σ) ≜ 1/(2π)^(D/2)\
  \ |Σ|^(-1/2) exp[-1/2 (x-μ)^T Σ^(-1) (x-μ)]\n```\n\n其中 `μ = E[X] ∈ R^D` 是**均值向量**，`Σ\
  \ = Cov[X]` 是 `D×D` **协方差矩阵**。归一化常数 `(2π)^(D/2) |Σ|^(1/2)` 仅确保 pdf 积分为 1。\n\nFigure\
  \ 2.7 绘制了三种不同类型协方差矩阵在 2D 下的 MVN 密度图。一个**满协方差矩阵**有 `D(D+1)/2` 个参数（除以 2 是因为对称性）。\n\
  \n## 2.5.3 学生 t 分布\n\n**学生 t 分布**的 pdf 定义为：\n\n```\nT(x|μ,Σ,ν) ≜ Γ((ν+D)/2) / (Γ(ν/2)\
  \ (νπ)^(D/2) |Σ|^(1/2)) [1 + 1/ν (x-μ)^T Σ^(-1) (x-μ)]^(-(ν+D)/2)\n```\n\n其中 `Σ`\
  \ 称为**尺度矩阵**（因为它通常不是协方差矩阵），且 `V = νΣ`。该分布比高斯分布有**更厚的尾部**。`ν` 越小，尾部越厚。当 `ν → ∞` 时，分布趋向于高斯分布。该分布具有以下性质：\n\
  \n```\nmean = μ, mode = μ, Cov = ν/(ν-2) Σ\n```\n\n#### 2.5.4 狄利克雷分布\n\n**Beta 分布**的多元推广是**狄利克雷分布**，其**支撑集**是**概率单纯形**，定义为：\n\
  \n```\nS_K = {x : 0 ≤ x_k ≤ 1, ∑_{k=1}^K x_k = 1}\n```\n\npdf 定义如下：\n\n```\nDir(x|α)\
  \ ≜ 1/B(α) ∏_{k=1}^K x_k^(α_k-1) I(x ∈ S_K)\n```\n\n其中 `B(α_1, α_2, ..., α_K)` 是\
  \ **Beta 函数**向 K 个变量的推广：\n\n```\nB(α) ≜ ∏_{k=1}^K Γ(α_k) / Γ(α_0), where α_0 ≜ ∑_{k=1}^K\
  \ α_k\n```\n\nFigure 2.8 展示了 `K=3` 时狄利克雷分布的一些图示，Figure 2.9 展示了一些采样的概率向量。我们看到 `α_0`\
  \ 控制分布的**强度**（峰值有多尖），而 `α_k` 控制峰值发生的位置。例如，`Dir(1,1,1)` 是**均匀分布**，`Dir(2,2,2)` 是以\
  \ `(1/3,1/3,1/3)` 为中心的**宽分布**，`Dir(20,20,20)` 是以 `(1/3,1/3,1/3)` 为中心的**窄分布**。如果所有\
  \ `k` 的 `α < 1`，我们会在单纯形的边缘得到**尖峰**。为将来参考，该分布具有以下性质：\n\n```\nE[x_k] = α_k/α_0, mode[x_k]\
  \ = (α_k-1)/(α_0-K), var[x_k] = α_k(α_0-α_k) / (α_0²(α_0+1))\n```\n\n### 2.6 随机变量变换\n\
  \n如果 `X ~ P()` 是某个随机变量，且 `Y = f(X)`，那么 Y 的分布是什么？这是本节要解决的问题。\n\n#### 2.6.1 线性变换\n\
  \n假设 `g()` 是一个**线性函数**：`g(x) = Ax + b`。\n\n首先，对于均值，我们有：\n\n```\nE[y] = E[Ax + b]\
  \ = A E[x] + b\n```\n\n这被称为**期望的线性性**。对于协方差，我们有：\n\n```\nCov[y] = Cov[Ax + b] =\
  \ A Σ A^T\n```\n\n#### 2.6.2 一般变换\n\n如果 X 是**离散随机变量**，我们可以通过简单地对所有满足 `f(x) = y`\
  \ 的 x 求**概率质量**和来确定 y 的 pmf：\n\n```\np_Y(y) = ∑_{x:g(x)=y} p_X(x)\n```\n\n如果 X 是**连续的**，我们不能使用公式\
  \ 2.42，因为 `p_X(x)` 是**密度**而不是 pmf，我们不能对密度求和。相反，我们使用 cdf：\n\n```\nF_Y(y) = P(Y ≤\
  \ y) = P(g(X) ≤ y) = ∫_{g(X)≤y} f_X(x) dx\n```\n\n我们可以通过对 cdf 求导来确定 Y 的 pdf：\n\n\
  ```\nf_Y(y) = f_X(x) |dx/dy|\n```\n\n这称为**变量代换公式**。我们将其证明留作练习。\n\n例如，假设 `X ~ U(-1,1)`，且\
  \ `Y = X²`。则 `p_Y(y) = 1/(2√y)`。\n\n##### 2.6.2.1 多元变量代换 *\n\n设 `f` 为函数 `f: R^n\
  \ → R^n`，且 `y = f(x)`。则其**雅可比矩阵** `J` 由下式给出：\n\n```\nJ_{x→y} ≜ [∂y_i/∂x_j] = \n\
  [ ∂y_1/∂x_1 ... ∂y_1/∂x_n ]\n[ ...           ...           ]\n[ ∂y_n/∂x_1 ... ∂y_n/∂x_n\
  \ ]\n```\n\n`|det(J)|` 衡量**单位立方体**在应用 `f` 时体积变化了多少。如果 `f` 是**可逆映射**，我们可以利用逆映射 `y→x`\
  \ 的雅可比来定义变换变量的 pdf：\n\n```\np_y(y) = p_x(x) |det(∂x/∂y)| = p_x(x) |det(J_{y→x})|\n\
  ```\n\n#### 2.6.3 中心极限定理\n\n给定 N 个随机变量 `X_1, X_2, ..., X_N`，每个变量**独立同分布**（简称 **iid**），且每个具有相同的均值\
  \ `μ` 和方差 `σ²`，则：\n\n```\n(∑_{i=1}^N X_i - Nμ) / (√N σ) ~ N(0,1)\n```\n\n这也可以写为：\n\
  \n```\n(X̄ - μ) / (σ/√N) ~ N(0,1), where X̄ ≜ 1/N ∑_{i=1}^N X_i\n```\n\n### 2.7\
  \ 蒙特卡洛近似\n\n通常，使用变量代换公式计算随机变量函数的分布可能很困难。一个简单但强大的替代方法如下。首先，我们从分布中生成 S 个样本，称它们为 `x_1,\
  \ ..., x_S`。（有许多生成此类样本的方法；一种用于高维分布的流行方法称为**马尔可夫链蒙特卡洛**或 **MCMC**；这将在第 TODO 章解释。）给定这些样本，我们可以使用\
  \ `{f(x_s)}_{s=1}^S` 的**经验分布**来近似 `f(X)` 的分布。这称为**蒙特卡洛近似**，以欧洲以其豪华赌场闻名的城市命名。\n\n\
  我们可以使用蒙特卡洛方法来近似随机变量任何函数的**期望值**。我们只需抽取样本，然后计算函数应用于样本的**算术平均值**。这可以写为：\n\n```\nE[g(X)]\
  \ = ∫ g(x) p(x) dx ≈ 1/S ∑_{s=1}^S f(x_s)\n```\n\n\n\n\n### 2.8 信息论\n\n#### 2.8.1\
  \ 熵\n\n具有分布 `p` 的任意变量 `X` 的熵，记作 `H(X)` 或有时记作 `H(p)`，是其**不确定性**的度量。具体而言，对于具有 `K`\
  \ 个状态的离散变量，其定义为\n\n```\nH(X) = −∑_{k=1}^K p(X = k) log2 p(X = k)  (2.50)\n```\n\n\
  通常我们使用以 2 为底的对数，此时单位称为 **比特**（bit，binary digit 的缩写）。假设我们使用以 `e` 为底的对数，单位称为 **奈特**（nat）。具有最大熵的离散分布是均匀分布（证明见第\
  \ XXX 节）。因此，对于一个 `K` 元离散变量，当 `p(x = k) = 1/K` 时熵最大；在这种情况下，`H(X) = log2 K`。相反，熵最小（为零）的分布是将所有质量集中在一个状态上的任意\
  \ Delta 函数。这种分布没有不确定性。\n\n可以证明（Cover and Thomas 2006），交叉熵是指当我们使用模型 `q` 来构建码本时，对来自分布\
  \ `p` 的源进行编码所需的平均比特数。因此，普通熵 `H(p) = H(p,p)`（定义见 §2.8.1 节）是在我们使用真实模型时的平均比特数，所以 KL\
  \ 散度就是这两者之间的差异。换句话说，KL 散度是由于我们使用分布 `q` 而非真实分布 `p` 来编码数据而导致的额外平均比特数。额外比特数这一理解应能说明\
  \ `KL(p||q) ≥ 0`，且仅当 `q = p` 时 KL 散度等于零。\n\n我们现在给出这一重要结果的证明。\n\n**定理 2.1.（数据差异/不等式）**\
  \ `KL(p||q) ≥ 0`，当且仅当 `p = q` 时取等号。\n\n这一结果的一个重要推论是，具有最大熵的离散分布是均匀分布。\n\n#### 2.8.2\
  \ KL 散度\n\n衡量两个概率分布 `p` 和 `q` 差异的一种方法称为 **Kullback-Leibler 散度**（KL 散度）或相对熵。其定义如下：\n\
  \n```\nKL(P||Q) = ∑_x p(x) log2 q(x)  (2.51)\n```\n\n仅当 `P` 和 `Q` 均归一化为 1 且 `q(x)\
  \ = 0` 蕴含 `p(x) = 0` 对所有 `x` 成立（绝对连续）时，KL 散度才有定义。如果公式中出现 `0 ln 0`，它被解释为零，因为 `lim_{x→0}\
  \ x ln x = 0`。\n\n我们可以将其重写为\n\n```\nKL(p||q) = ∑_{k=1}^K p(x) log2 p(x) − ∑ p(x)\
  \ log2 q(x)\n         = H(p,q) − H(p)  (2.52)\n```\n\n其中 `H(p,q)` 称为**交叉熵**。\n\n\
  #### 2.8.3 互信息\n\n**定义 2.9.** **互信息**（MI）定义如下：\n\n```\nI(X;Y) = KL(P(X,Y) || P(X)P(Y))\n\
  \       = ∑_x ∑_y p(x,y) log (p(x,y) / (p(x)p(y)))  (2.54)\n```\n\n对于概率密度函数（pdf），求和号替换为积分。我们有\
  \ `I(X;Y) ≥ 0`，当且仅当 `P(X,Y) = P(X)P(Y)` 时取等号。即，若变量相互独立，则 MI 为零。\n\n为了深入理解 MI 的含义，将其用联合熵和条件熵重新表达会有所帮助。可以证明上述表达式等价于以下形式：\n\
  \n```\nI(X;Y) = H(X) − H(X|Y)  (2.55)\n       = H(Y) − H(Y|X)  (2.56)\n       =\
  \ H(X) + H(Y) − H(X,Y)  (2.57)\n       = H(X,Y) − H(X|Y) − H(Y|X)  (2.58)\n```\n\
  \n其中 `H(X)` 和 `H(Y)` 是边缘熵，`H(X|Y)` 和 `H(Y|X)` 是条件熵，`H(X,Y)` 是 `X` 和 `Y` 的联合熵，见图\
  \ 2.10。\n\n![图 2.10：一对具有互信息 I(X;Y) 的相关子系统 X,Y 的边缘熵 H(X)、H(Y)、联合熵 H(X,Y) 和条件熵。](img/image_rsrc1R4.jpg)\n\
  \n直观上，我们可以将 `X` 和 `Y` 之间的 MI 解释为观察 `Y` 后关于 `X` 的不确定性的减少，或者对称地，观察 `X` 后关于 `Y` 的不确定性的减少。\n\
  \n一个与 MI 密切相关的量是**点互信息**（PMI）。对于两个事件（而非随机变量）`x` 和 `y`，其定义为\n\n```\nPMI(x,y) = log\
  \ (p(x,y) / (p(x)p(y))) = log (p(x|y) / p(x)) = log (p(y|x) / p(y))  (2.59)\n```\n\
  \n这衡量了这些事件共同发生与偶然预期之间的差异。显然，`X` 和 `Y` 的 MI 仅仅是 PMI 的期望值。\n\n有趣的是，我们可以将 PMI 重写如下：\n\
  \n```\nPMI(x,y) = log (p(x|y) / p(x)) = log (p(y|x) / p(y))  (2.60)\n```\n\n这是将先验\
  \ `p(x)` 更新为后验 `p(x|y)` 所获得的信息量，或者等价地，将先验 `p(y)` 更新为后验 `p(y|x)` 所获得的信息量。\n\n## 第\
  \ 3 章 离散数据的生成模型\n\n### 3.1 生成式分类器\n\n```\np(y = c|θ) p(x|y = c, θ)\np(y = c|x, θ)\
  \ = ------------------------------------  (3.1)\n     ∑_{c'} p(y = c'|θ) p(x|y =\
  \ c', θ)\n```\n\n这被称为**生成式分类器**，因为它利用类条件密度 `p(x|y=c)` 和类先验 `p(y=c)` 指定了如何生成数据。另一种方法是直接拟合类后验\
  \ `p(y = c|x)`；这被称为**判别式分类器**。\n\n### 3.2 贝叶斯概念学习\n\n心理学研究表明，人类可以仅从正例中学习概念（Xu and\
  \ Tenenbaum 2007）。我们可以将学习单词含义视为概念学习，而概念学习又等同于二元分类。为了说明这一点，定义 `f(x) = 1` 如果 `x` 是概念\
  \ `C` 的一个例子，否则 `f(x) = 0`。那么目标就是学习指示函数 `f`，它仅定义了哪些元素在集合 `C` 中。\n\n#### 3.2.1 似然\n\
  \n```\np(D|h) = (1 / |h|)^N  (3.2)\n```\n\n这个关键公式体现了 Tenenbaum 所谓的**大小原则**，即模型倾向于与数据一致的最简单（最小）假设。这更常被称为**奥卡姆剃刀**。\n\
  \n#### 3.2.3 后验\n\n后验仅仅是似然乘以先验，再归一化。\n\n```\np(D|h) p(h)\np(h|D) = ----------------------------\
  \  (3.3)\n         ∑_{h' ∈ H} I(D ∈ h') p(h')\n```\n\n其中 `I(D ∈ h) p(h)` 当且仅当所有数据都在假设\
  \ `h` 的外延中时为 1。\n\n通常情况下，当我们有足够的数据时，后验 `p(h|D)` 会集中在单一概念上，即 MAP 估计：\n\n```\np(h|D)\
  \ → ĥ_MAP  (3.4)\n```\n\n其中 `ĥ_MAP` 是后验众数，\n\n```\nĥ_MAP = arg max_h p(h|D) = arg\
  \ max_h p(D|h) p(h)\n       = arg max_h [log p(D|h) + log p(h)]  (3.5)\n```\n\n\n\
  \n\n#### 3.2.2 先验\n\n先验是由人类而非机器选择的，因此它是抽象的。先验的主观性是有争议的。例如，一个年轻人和一位数学相关的教师将会得出不同的结论。由于概率项严重依赖于\
  \ `N`，而先验保持稳定，随着我们获得越来越多的数据，MAP 估计将趋向于最大似然估计或 MLE：\n\n```\nhMLE ≜ arg max_h p(D|h)\
  \ = arg max_h log p(D|h)  (3.6)\n```\n\n换句话说，假设我们有足够的数据，我们会看到数据压倒了先验。\n\n14 http://en.wikipedia.org/wiki/Occam%27s_razor\n\
  \n#### 3.2.4 后验预测分布\n\n后验预测分布的概念通常用于贝叶斯设定中，它利用给定观测数据的参数的整个后验分布，产生一个区间上的概率分布，而不仅仅是一个点估计。\n\
  \n```\np(x̃|D) = E_{h|D}[p(x̃|h)] = ∑_h p(x̃|h)p(h|D)  (3.7)\n       = ∫ p(x̃|h)p(h|D)dh\n\
  ```\n\n这仅仅是每个单独假设预测的加权平均，被称为贝叶斯模型平均。\n\n```\np(θ|Da,Db) = p(θ,Db|Da) / p(Da) ∝ p(θ,Db|Da)\n\
  \           = p(Db,θ|Da)\n           = p(Db|θ)p(θ|Da)\n           = Bin(Nb1|θ, Nb1+Nb0)\
  \ Beta(θ|Na1+a, Na0+b)\n           = Beta(θ|Na1+Nb1+a, Na0+Nb0+b)  (3.10 and 2.19\
  \ combined)\n```\n\n这使得贝叶斯推断特别适合在线学习，稍后我们将看到。\n\n### 3.3 Beta-二项模型\n\n#### 3.3.1\
  \ 似然\n\n给定 `X ~ Bin(θ)`，`D` 的概率由下式给出\n\n```\np(D|θ) = Bin(N1|N,θ)  (3.8)\n```\n\n\
  如果我们使用均匀先验，那么 MAP 估计将简化为 MLE：\n\n```\nθ_MAP ∝ θ_MLE = N1/N  (3.13)\n```\n\n####\
  \ 3.3.2 先验\n\n```\nBeta(θ|a,b) ∝ θ^{a-1}(1-θ)^{b-1}  (3.9)\n```\n\n先验的参数被称为超参数。\n\
  \n我们现在将展示后验均值是先验均值和 MLE 的凸组合，这体现了后验是在我们先前所信和数据告诉我们的之间进行折衷。\n\n#### 3.3.3 后验\n\n\
  ```\np(θ|D) ∝ Bin(N1|N1+N0,θ) Beta(θ|a,b)\n       = Beta(θ|N1+a, N0+b)  (3.10)\n\
  ```\n\n请注意，依次更新后验等同于一次性批量更新。为了说明这一点，假设我们有两个数据集 `Da` 和 `Db`，其充分统计量分别为 `Na1, Na0`\
  \ 和 `Nb1, Nb0`。令 `N1 = Na1+Nb1` 和 `N0 = Na0+Nb0` 为合并数据集的充分统计量。在批量模式下我们有\n\n#####\
  \ 3.3.3.1 后验均值和众数\n\n根据表 2.7，后验均值由下式给出\n\n```\nθ̄ = (a+N1) / (a+b+N)  (3.11)\n```\n\
  \n众数由下式给出\n\n```\nθ̂_MODE = (a+N1-1) / (a+b+N-2)  (3.12)\n```\n\n##### 3.3.3.2 后验波动\n\
  \n均值和众数是点估计，但了解我们能在多大程度上信任它们是有帮助的。后验的方差是衡量这一点的一种方法。\n\nBeta 后验的方差由下式给出\n\n```\n\
  var(θ|D) = (a+N1)(b+N0) / [(a+N1+b+N0)² (a+N1+b+N0+1)]  (3.14)\n```\n\n在 `N ≫ a,b`\
  \ 的情况下，我们可以简化这个繁琐的表达式，得到\n\n```\nvar(θ|D) ≈ N1 N0 / N³ = θ̂_MLE (1 - θ̂_MLE) / N\
  \  (3.15)\n```\n\n15 http://en.wikipedia.org/wiki/Posterior_predictive_distribution\n\
  \n#### 3.3.4 后验预测分布\n\n```\nBb(x̃ | M, a, b) = B(x̃+a, M-x̃+b) / B(a,b)  (3.21)\n\
  ```\n\n到目前为止，我们一直专注于未知参数的推断。现在让我们将注意力转向未来可观测数据的预测。考虑在 `Beta(a,b)` 后验下预测单次未来试验中正面朝上的概率。我们有\n\
  \n```\np(x̃|D) = ∫_0¹ p(x̃|θ)p(θ|D)dθ\n       = ∫_0¹ θ Beta(θ|a,b)dθ\n       = E[θ|D]\
  \ = a / (a+b)  (3.16)\n```\n\n该分布具有以下均值和方差\n\n```\nmean = M a / (a+b)\nvar  = M\
  \ a b (a+b+M) / [(a+b)² (a+b+1)]  (3.22)\n```\n\n这一过程如图 3.1 所示。我们从 `Beta(2,2)` 先验开始，并在观测到\
  \ `N1 = 3` 次正面和 `N0 = 17` 次反面后绘制后验预测密度。图 3.1(b) 绘制了使用 MAP 估计的插值近似。我们看到贝叶斯预测具有更长的尾部，将其概率质量分布得更广，因此不太容易过拟合和黑天鹅类型的悖论。\n\
  \n![Figure 3.1(a)](img/image_rsrc1R5.jpg)\n![Figure 3.1(b)](img/image_rsrc1R6.jpg)\n\
  \n**图 3.1：** (a) 观测到 `N1 = 3, N0 = 17` 后的后验预测分布。(b) MAP 估计。\n\n我们认识到所需项是 `Beta(x̃+a,\
  \ M-x̃+b)` 分布的归一化常数。因此\n\n```\n∫_0¹ θ^{x̃}(1-θ)^{M-x̃} θ^{a-1}(1-θ)^{b-1} dθ = B(x̃+a,\
  \ M-x̃+b)  (3.20)\n```\n\n因此我们发现后验预测由以下公式给出，称为（复合）Beta-二项分布：\n\n##### 3.3.4.1 过拟合与黑天鹅悖论\n\
  \n现在让我们推导一个简单的贝叶斯解决方案来解决这个问题。我们将使用均匀先验，所以 `a = b = 1`。在这种情况下，插入后验均值给出了拉普拉斯继承规则\n\
  \n```\np(x̃|D) = (N1 + 1) / (N0 + N1 + 1)  (3.17)\n```\n\n这证明了向经验计数加 1、归一化然后插入它们的常见做法是合理的，这种技术称为加一平滑。（注意插入\
  \ MAP 参数不会产生这种平滑效果，因为如果 `a = b = 1`，众数会变成 MLE，见第 3.3.3.1 节。）\n\n##### 3.3.4.2 预测多次未来试验的结果\n\
  \n现在假设我们对预测 `M` 次未来试验中正面的数量 `x̃` 感兴趣。这由下式给出\n\n```\np(x̃|D) = ∫_0¹ Bin(x̃ | M,θ)\
  \ Beta(θ|a,b) dθ  (3.18)\n       = (M choose x̃) / B(a,b) ∫_0¹ θ^{x̃+a-1} (1-θ)^{M-x̃+b-1}\
  \ dθ  (3.19)\n```\n\n### 3.4 Dirichlet-多项模型\n\n在上一节中，我们讨论了如何推断硬币正面朝上的概率。在本节中，我们将这些结果推广到推断具有\
  \ `K` 个面的骰子朝上面 `k` 的概率。\n\n#### 3.4.1 似然\n\n假设我们观测到 `N` 次掷骰子，`D = {x1, x2, ...,\
  \ xN}`，其中 `xi ∈ {1, 2, ..., K}`。似然的形式为\n\n```\np(D|θ) = (N! / (N1! ... NK!)) ∏_{k=1}^K\
  \ θ_k^{Nk}  (3.23)\n```\n\n其中 `Nk = ∑_{i=1}^N I(yi = k)` 与公式 2.21 实质相同。\n\n####\
  \ 3.4.2 先验\n\n```\nDir(θ|α) = (1/B(α)) ∏_{k=1}^K θ_k^{αk-1} I(θ ∈ S_K)  (3.24)\n\
  ```\n\n#### 3.4.3 后验\n\n```\np(θ|D) ∝ p(D|θ)p(θ)\n       ∝ ∏_{k=1}^K θ_k^{Nk} ∏_{k=1}^K\
  \ θ_k^{αk-1}\n       = Dir(θ|α1+N1, ..., αK+NK)  (3.27)\n```\n\n根据公式 2.38，MAP 估计由下式给出\n\
  \n```\nθ̂_k = (Nk + αk - 1) / (N + α0 - K)  (3.28)\n```\n\n如果我们使用均匀先验，`αk = 1`，我们恢复\
  \ MLE：\n\n```\nθ̂_k = Nk / N  (3.29)\n```\n\n#### 3.4.4 后验预测分布\n\n单次多努利试验的后验预测分布由以下表达式给出：\n\
  \n```\np(X = j|D) = ∫ p(X = j|θ)p(θ|D)dθ  (3.30)\n           = ∫ [∫ p(X = j|θj)\
  \ p(θ_{-j}, θj|D) dθ_{-j}] dθj  (3.31)\n           = ∫ θj p(θ|D) dθj = E[θj|D] =\
  \ (αj + Nj) / (α0 + N)  (3.32)\n```\n\n其中 `θ_{-j}` 是除 `θj` 以外的 `θ` 的所有分量。上述表达式避免了零计数问题。\n\
  \n事实上，这种贝叶斯平滑形式在多项情况下比二项情况下重要得多，因为一旦我们开始将数据分配到许多类别中，数据稀疏的可能性就会增加。\n\n### 3.5 朴素贝叶斯分类器\n\
  \n假设特征在给定类别标签的条件下是独立的，那么类条件密度具有以下形式\n\n```\np(x|y=c, θ) = ∏_{j=1}^D p(xj|y=c, θ_{jc})\
  \  (3.33)\n```\n\n由此产生的模型被称为朴素贝叶斯分类器 (NBC)。类条件密度的形式取决于每个特征的类型。我们在下面给出几种可能性：\n\n\
  *   对于真值特征，我们可以使用高斯分布：\n    `p(x|y,θ) = ∏_{j=1}^D N(xj | µ_{jc}, σ²_{jc})`，其中 `µ_{jc}`\
  \ 是类别 `c` 中特征 `j` 的均值，`σ²_{jc}` 是其方差。\n*   对于二元特征，`xj ∈ {0,1}`，我们可以使用伯努利分布：\n  \
  \  `p(x|y,θ) = ∏_{j=1}^D Ber(xj | µ_{jc})`，其中 `µ_{jc}` 是特征 `j` 在类别 `c` 中出现的概率。这有时被称为多元伯努利朴素贝叶斯模型。我们将在下面看到它的一个应用。\n\
  \n\n\n\n#### 3.5.1 优化\n\n##### 3.5.1.2 贝叶斯朴素贝叶斯\n\n我们目前考察如何训练朴素贝叶斯分类器。这通常意味着求解参数的\
  \ MLE（极大似然估计）或 MAP（最大后验估计）。然而，我们也将探讨如何计算完整后验分布 `p(θ|D)`。\n\n对 `π` 使用 `Dir(α)` 先验。对于二元特征，对每个\
  \ `θjc` 使用 `Beta(β0,β1)` 先验；对于离散特征，对每个 `θjc` 使用 `Dir(α)` 先验。通常我们只取 `α = 1` 和 `β\
  \ = 1`，这对应加一平滑或拉普拉斯平滑。\n\n##### 3.5.1.1 NBC 的 MLE\n\n单个数据实例的似然由下式给出：\n\n```\np(xi,yi|θ)\
  \ = p(yi|π)∏p(xij|θj)\nj\n= ∏πI(yi=c) ∏ ∏p(xij|θjc)I(yi=c)\nc c jc\n```\n\n因此对数似然由下式给出：\n\
  \n目标是计算 `y = f(x) = arg max P(y = c|x,θ)`\nc\n\n```\nD\nP(y = c|θ)∏P(xj|y = c,θ)\n\
  j=1\n```\n\n```\nC D C\np(D|θ) = log p(xij|θjc)\nc=1 j=1 i:yi=c\n= ∑Nc log πc +\
  \ ∑c ∑j ∑i:yi=c\n```\n\n其中 `Nc ≜ ∑ I(yi = c)` 是类别 c 中特征向量的数量。\n\n我们看到该表达式分解为一系列项，一项涉及\
  \ `π`，`DC` 项包含 `θjcs`。因此我们可以分别优化所有这些参数。\n\n由公式 3.29，类先验的 MLE 由下式给出：\n\n```\nπ̂c\
  \ = Nc / N\n```\n\n`θjcs` 的 MLE 取决于我们为每个特征选择的分布类型。\n\n对于二元特征，`xj ∈ {0,1}`，`xj|y\
  \ = c ∼ Ber(θjc)`，因此：\n\n```\nθ̂jc = Njc / Nc\n```\n\n其中 `Njc ≜ ∑i:yi=c I(xij =\
  \ 1)` 是特征 j 在类别 c 中出现的次数。\n\n对于离散特征，`xj ∈ {aj1,aj2,··· ,ajSj}`，`xj|y = c ∼ Cat(θjc)`，因此：\n\
  \n```\nθ̂jc = (Nj1c/Nc, Nj2c/Nc, ··· , NjSjc/Nc)^T\n```\n\n其中 `Njkc ≜ ∑i I(xij =\
  \ ajk, yi = c)` 是特征 `xj = ajk` 在类别 c 中出现的次数。\n\n#### 3.5.2 使用模型进行预测\n\n我们可以使用 MLE\
  \ 或 MAP 估计参数，然后通过简单地代入参数 `θ̂(MLE)` 或 `θ̂(MAP)` 获得后验预测密度。或者我们可以使用 BMA（贝叶斯模型平均），直接对未知参数进行积分边缘化。\n\
  \n#### 3.5.3 log-sum-exp 技巧\n\n当使用任何类型的生成式分类器时，由于数值下溢，使用公式 3.1 计算类标签的后验可能会失败。问题在于\
  \ `p(x|y = c)` 通常是一个非常小的数字，特别是当 x 是高维向量时。这是因为我们要求 `∑x p(x|y) = 1`，所以观察到特定高维向量的概率很小。显而易见的解决方案是在应用贝叶斯规则时取对数，如下所示：\n\
  \n```\nlog p(y = c|x,θ) = bc − log ∑ e^bc'\nc'\n```\n\n其中 `bc ≜ log p(x|y = c,θ)\
  \ + log p(y = c|θ)`。我们可以提取最大的项，并仅计算相对于该项的剩余数值。例如：\n\n```\nlog(e^−120 + e^−121) =\
  \ log(e^−120(1+e^−1))\n= log(1+e^−1) − 120\n```\n\n一般来说，我们有：\n\n```\nlog ∑ e^bc\
  \ = log ∑ e^(bc−B) + B\nc c\n```\n\n其中 `B ≜ max{bc}`。这被称为 log-sum-exp 技巧，被广泛使用。\n\
  \n```\nD\np(xi|yi = c,θ) = ∏ Ber(xij|θjc)\nj=1\n= ∏ θjc^xij (1− θjc)^(1−xij)\nj=1\n\
  ```\n\n#### 3.5.4 使用互信息进行特征选择\n\n这被称为伯努利乘积模型，或二元独立模型。由于 NBC 要对潜在的许多特征拟合联合分布，它可能会遭受过拟合。此外，运行时成本是\
  \ `O(D)`，对于某些应用可能过高。解决这两个问题的一种常见方法是执行特征选择，以消除对分类问题帮助不大的无关特征。最简单的特征选择方法是单独评估每个特征的重要性，然后取前\
  \ K 个，其中 K 是基于精度和复杂度之间的某种权衡来选择的。这种方法称为特征排序、过滤或筛选。衡量重要性的一种方法是使用特征 `Xj` 和类标签 `Y` 之间的互信息（第\
  \ 2.8.3 节）：\n\n```\nI(Xj,Y) = ∑ ∑ p(xj,y) log p(xj,y) / (p(xj)p(y))\nxj y\n```\n\
  \n如果特征是二元的，很容易证明 MI 可以按如下方式计算：\n\n```\nIj = ∑ [ θjc πc log (θjc/θj) + (1− θjc) πc\
  \ log ((1− θjc)/(1− θj)) ]\nc\n```\n\n其中 `πc = p(y = c)`，`θjc = p(xj = 1|y = c)`，且\
  \ `θj = p(xj = 1) = ∑c πc θjc`。\n\n#### 3.5.5 使用词袋模型对文档进行分类\n\n文档分类是将文本文档归类到不同类别的问题。\n\
  \n##### 3.5.5.1 伯努利乘积模型\n\n一种简单的方法是将每个文档表示为一个二元向量，记录每个词是否出现，因此 `xij = 1` 当且仅当词 j\
  \ 出现在文档 i 中，否则 `xij = 0`。然后我们可以使用以下类条件密度：\n\n##### 3.5.5.2 多项式文档分类器\n\n然而，忽略每个词在文档中出现的次数会丢失一些信息（McCallum\
  \ and Nigam 1998）。一种更准确的表示是统计每个词的出现次数。具体来说，令 `xi` 为文档 i 的计数向量，因此 `xij ∈ {0,1,···\
  \ ,Ni}`，其中 `Ni` 是文档 i 中的术语数量（所以 `∑j xij = Ni`）。对于类条件密度，我们可以使用多项分布：\n\n```\np(xi|yi\
  \ = c, θ) = Mu(xi|Ni, θc) = Ni! / ∏ xij! ∏ θjc^xij\nj=1 j=1\n```\n\n我们在此隐含地假设文档长度\
  \ `Ni` 与类别无关。这里 `θjc` 是在类别 c 的文档中生成词 j 的概率；这些参数满足约束条件 `∑j=1^D θjc = 1`，对每个类别 c 均成立。\n\
  \n虽然多项式分类器易于训练且在测试时简单易用，但它在文档分类方面效果不佳。原因之一是它没有考虑词语使用的爆发性。这指的是大多数词从不出现在任何给定文档中，但如果它们出现一次，则很可能再次出现，即词语成簇出现。多项式模型无法捕捉爆发性现象。要了解原因，请注意公式\
  \ 3.46 具有 `θjc^xij` 的形式，由于罕见词的 `θjc ≪ 1`，生成大量此类词的概率变得越来越小。对于更常见的词，衰减率没有那么快。为了直观地理解原因，请注意最常见的词是功能词，它们不特定于类别，例如\
  \ and、the 和 but；无论词 and 之前出现过多少次（模 ulo 文档长度），它出现的机会大致相同，因此独立性假设对常见词更合理。\n\n然而，由于罕见词对于分类目的最为重要，这些是我们最希望仔细建模的词。\n\
  \n##### 3.5.5.3 DCM 模型\n\n已经提出了各种专门的启发式方法来提高多项式文档分类器的性能（Rennie et al. 2003）。我们现在介绍一种替代的类条件密度，它的表现与这些专门的启发式方法一样好，但具有概率学上的合理性（Madsen\
  \ et al. 2005）。假设我们简单地用狄利克雷复合多项分布或 DCM 密度替换多项式类条件密度，定义如下：\n\n```\np(xi|yi = c, α)\
  \ = ∫ Mu(xi|Ni, θc) Dir(θc|αc)\n```\n\n\n\n\n# 4.1.2 高斯分布的最大熵推导\n\n在本节中，我们将展示多元高斯分布是在预定义均值和协方差的约束下，具有**最大熵**的分布（另见第\
  \ TODO 节）。这是高斯分布被**广泛使用**的原因之一：前两个矩通常是我们能从数据中可靠估计的全部，因此我们需要一种能捕捉这些性质，但除此之外做尽可能**少的额外假设**的分布。为简化符号，我们将假设均值为零。概率密度函数（pdf）具有以下结构：\n\
  \n```\nf(x) = 1/Z exp(-1/2 x^T Σ^{-1} x)  (4.10)\n```\n\n### 4.2 高斯判别分析\n\n多元正态分布（MVN）的一个重要用途是为生成式分类器中的类条件密度建模，即：\n\
  \n```\np(x|y = c, θ) = N(x|μ_c, Σ_c)  (4.11)\n```\n\n由此产生的方法称为（高斯）判别分析或 GDA（尽管它是生成式而非判别式分类器，有关此区别的更多信息请参见第\
  \ TODO 节）。如果 `Σ_c` 是对角的，这等同于朴素贝叶斯。我们可以使用以下决策规则对特征向量进行分类，该规则源自公式 3.1：\n\n```\ny =\
  \ argmax_c [log p(y = c|π) + log p(x|θ)]  (4.12)\n```\n\n当我们计算 x 在每个类条件密度下的似然时，我们实际上是在使用马氏距离测量\
  \ x 到每个类中心 `μ_c` 的距离。这可以被视为最近质心分类器。例如，图 4.2 展示了二维空间中两个高斯类条件密度，分别代表人类的身高和体重。我们可以看到特征之间存在相关性，这符合预期（个子高的人通常体重也更重）。每个类别的椭圆包含\
  \ 95% 的概率质量。假设我们对类别有均匀先验，我们可以按如下方式对新的测试向量进行分类：\n\n```\ny = arg max_c (x - μ_c)^T\
  \ Σ^{-1} (x - μ_c)  (4.13)\n```\n\n#### 4.2.1 二次判别分析 (QDA)\n\n通过将高斯密度的定义代入公式 3.1，我们可以得到：\n\
  \n```\np(y|x, θ) = π_c |2π Σ_c|^{-1/2} exp[-1/2 (x - μ)^T Σ^{-1} (x - μ)]\n    \
  \        -------------------------------------------------------------  (4.14)\n\
  \            ∑_c' π_c' |2π Σ_c'|^{-1/2} exp[-1/2 (x - μ)^T Σ^{-1} (x - μ)]\n```\n\
  \n对该结果进行阈值处理会得到 x 的二次函数。该结果称为**二次判别分析 (QDA)**。图 4.3 给出了一些二维空间中决策边界外观的示例。\n\n####\
  \ 4.2.2 线性判别分析 (LDA)\n\n我们现在考虑一种特殊情况，即协方差矩阵在各类别间被绑定或共享，`Σ_c = Σ`。在这种情况下，我们可以将公式\
  \ 4.14 简化如下：\n\n```\np(y|x, θ) ∝ exp(μ_c^T Σ^{-1} x - 1/2 μ_c^T Σ^{-1} μ_c + log\
  \ π_c)  (4.15)\n```\n\n由于二次项 `x^T Σ^{-1} x` 与 c 无关，它将在分子和分母中抵消。假设我们定义：\n\n```\n\
  γ_c ≜ -1/2 μ_c^T Σ^{-1} μ_c + log π_c  (4.16)\nβ_c ≜ Σ^{-1} μ_c  (4.17)\n```\n\n\
  我们可以写成：\n\n```\np(y|x, θ) = e^{β_c^T x + γ_c} / ∑_c' e^{β_c'^T x + γ_c'} = σ(η)_c\
  \  (4.18)\n```\n\n其中 `η ≜ (e^{β_1^T x + γ_1}, ..., e^{β_C^T x + γ_C})`，`σ()` 是 softmax\
  \ 激活函数，定义如下：\n\n```\nexp(q_i)\nσ(q, i) = ------------  (4.19)\n∑_j exp(q_j)\n```\n\
  \n当由某个常数 `α > 0` 定义时，以下公式成为最大值函数的一个平滑、可微近似：\n\n```\n∑_D x_j e^{α x_j}\nS_α(x) =\
  \ ---------------  (4.20)\n∑_D e^{α x_j}\n```\n\n`S_α` 具有以下性质：\n1. `S_α → max` 当\
  \ `α → ∞` 时\n2. `S_0` 是其输入的平均值\n3. `S_α → min` 当 `α → -∞` 时\n\n请注意，softmax 激活函数源自统计物理学领域，在那里通常使用玻尔兹曼分布，其形式与\
  \ softmax 激活函数相同。公式 4.18 的一个有趣性质是，如果我们取对数，最终会得到 x 的**线性函数**。（之所以是线性的，是因为 `x^T Σ^{-1}\
  \ x` 从分子和分母中抵消了。）因此，任意两个类别（设为 c 和 c′）之间的决策边界将是一条直线。因此该方法称为**线性判别分析 (LDA)**。\n\n\
  > 16 http://en.wikipedia.org/wiki/Softmax_activation_function\n\n另一种方法是不先拟合 LDA\
  \ 模型再推导类后验，而是直接拟合 `p(y|x, W) = Cat(y|W x)`，其中 W 为某个 `C × D` 权重矩阵。这称为多类逻辑回归，或多项逻辑回归。我们将在第\
  \ TODO 节详细讨论该模型。这两种方法的区别在第 TODO 节中解释。\n\n#### 4.2.3 二分类 LDA\n\n为了更深入地了解这些方程的含义，让我们考虑二分类情况。在这种情况下，后验概率由下式给出：\n\
  \n```\np(y = 1|x, θ) = e^{β_0^T x + γ_0} / (e^{β_0^T x + γ_0} + e^{β_1^T x + γ_1})\
  \  (4.21)\n              = 1 / (1 + e^{(β_0 - β_1)^T x + (γ_0 - γ_1)})  (4.22)\n\
  \              = sigm((β_1 - β_0)^T x + (γ_0 - γ_1))  (4.23)\n```\n\n其中 `sigm(x)`\
  \ 指代 sigmoid 函数。\n\n现在：\n\n```\nγ_1 - γ_0 = -1/2 μ_1^T Σ^{-1} μ_1 + 1/2 μ_0^T Σ^{-1}\
  \ μ_0 + log(π_1/π_0)  (4.24)\n          = 1/2 (μ_1 - μ_0)^T Σ^{-1} (μ_1 + μ_0) +\
  \ log(π_1/π_0)  (4.25)\n```\n\n因此如果我们定义：\n\n```\nw = β_1 - β_0 = Σ^{-1} (μ_1 - μ_0)\
  \  (4.26)\nx_0 = log(π_1/π_0) - 1/2 (μ_1 + μ_0)^T Σ^{-1} (μ_1 - μ_0)  (4.27)\n```\n\
  \n图 4.4：`Σ_1 = Σ_2 = I` 时二分类 LDA 的几何解释。更靠近 `μ_0`，因此更多的线段属于类别 1 推断。另一方面，如果 `π_1 <\
  \ π_0`，边界向右移动。因此我们看到类先验 c 仅改变决策阈值，而不改变整体几何结构，正如我们之前所承诺的。（类似的论证适用于多分类情况。）\n\n\n\n\
  \n\n# w 的大小决定了策略容量的陡峭程度\n\n`w` 的大小决定了策略容量的陡峭程度，这取决于均值之间的隔离程度与方差的相对比较。在脑科学和信号检测理论中，通常使用一个称为\
  \ d-prime 的量来表征信号相对于背景噪声的可辨别度：\n\n```\nd′ ≜ (µ1 − µ0) / σ\n```\n\n其中 `µ1` 是信号的均值，`µ0`\
  \ 是噪声的均值，`σ` 是噪声的标准差。如果 `d′` 很大，信号将更容易从噪声中分离出来。\n\n#### 4.2.4 判别分析的 MLE\n\n然后我们有\
  \ `w^T x0 = −(γ1 − γ0)`，因此 `p(y = 1 | x, θ) = sigm(w^T (x − x0))`（这与逻辑回归密切相关，我们将在第\
  \ TODO 节讨论）。所以最终的决策规则如下：将 `x` 平移 `x0`，投影到直线 `w` 上，并检查结果是正还是负。如果 `Σ = σ² I`，则 `w`\
  \ 指向 `µ1 − µ0` 的方向。因此我们根据投影点更接近 `µ0` 还是 `µ1` 来对该点进行分类。这在图 4.4 中有说明。\n\n此外，如果 `π1\
  \ = π0`，则 `x0 = 1/2 (µ1 + µ0)`，即位于两个均值的中点。如果我们令 `π1 > π0`，则 `x0` 会……\n\n对数似然函数如下：\n\
  \n```\nlog p(D|θ) = ∑_{c=1}^C ∑_{i: y_i=c} [log π_c + log N(x_i | µ_c, Σ_c)]\n```\n\
  \n每个参数的 MLE 如下：\n\n```\nµ_c = (1 / N_c) ∑_{i: y_i=c} x_i\nΣ_c = (1 / N_c) ∑_{i:\
  \ y_i=c} (x_i − µ_c)(x_i − µ_c)^T\n```\n\n参考：[`en.wikipedia.org/wiki/Sigmoid_function`](http://en.wikipedia.org/wiki/Sigmoid_function)\n\
  \n#### 4.2.5 防止过拟合的策略\n\nMLE 方法的速度和简洁性或许是其最大的吸引力。然而，MLE 在高维情况下可能会严重过拟合。具体来说，当 `N_c\
  \ < D` 时，全协方差矩阵的 MLE 是奇异的。即使 `N_c > D`，MLE 也可能是病态的，意味着它接近奇异。针对这个问题有几种潜在的解决方案：\n\n\
  *   对每个类使用对角协方差矩阵，这假设特征在条件上是独立的；这等同于使用朴素贝叶斯分类器（第 3.5 节）。\n*   使用全协方差矩阵，但将其约束为所有类共享，即\
  \ `Σ_c = Σ`。这是参数绑定或参数共享的一个例子，等同于 LDA（第 4.2.2 节）。\n*   使用对角协方差矩阵并约束其共享。这称为对角协方差 LDA，将在第\
  \ TODO 节讨论。\n*   使用全协方差矩阵，但施加先验然后将其积分掉。如果我们使用共轭先验，这可以利用第 TODO 节的结果以闭式形式完成；这类似于第\
  \ 3.5.1.2 节的贝叶斯朴素贝叶斯方法。详见 (Minka 2000f)。\n*   通过 MAP 估计拟合全或对角协方差矩阵。我们在下面讨论两种不同类型的先验。\n\
  *   将数据投影到低维子空间，在那里拟合高斯分布。参见第 TODO 节以寻找最佳（最具判别性）线性投影的方法。\n\n我们在下面讨论其中一些选择。\n\n#####\
  \ 4.2.6 正则化 LDA *\n\n##### 4.2.7 对角 LDA\n\n##### 4.2.8 最近收缩质心分类器 *\n\n对角 LDA 的一个缺点是它依赖于所有特征。在高维问题中，我们可能更倾向于一种仅依赖特征子集的方法，以提高精度和可解释性。一种方法是使用筛选策略，可能基于互信息，如第\
  \ 3.5.4 节所述。我们现在讨论解决此问题的另一种方法，称为最近收缩质心分类器 (Hastie et al. 2009, p652)。\n\n公式 4.36\
  \ 在本书中具有基础性的重要意义，因此我们用方框将其标出，以便您轻松找到它。关于证明，请参见第 TODO 节。我们看到边缘分布和条件分布本身都是高斯分布。对于边缘分布，我们只需移除与\
  \ `x1` 或 `x2` 相关的行和列。对于条件分布，我们需要做更多工作。然而，这并不复杂：条件均值只是 `x2` 的线性函数，条件协方差只是一个与 `x2`\
  \ 无关的常数矩阵。我们给出了后验均值的三种不同（但等价）表达式，以及后验协方差的两种不同（但等价）表达式；每种在不同情况下都很有用。\n\n### 4.3 联合高斯分布中的推断\n\
  \n给定一个联合分布 `p(x1, x2)`，能够计算边缘分布 `p(x1)` 和条件分布 `p(x1 | x2)` 很有帮助。我们在下面讨论如何执行这些操作，然后给出一些应用。在最坏情况下，这些操作需要\
  \ `O(D³)` 时间。有关更快的方法，请参见第 TODO 节。\n\n#### 4.3.1 结果陈述\n\n**定理 4.2.** (多元正态分布的边缘分布和条件分布)。假设\
  \ `X = (x1, x2)` 服从联合高斯分布，参数为：\n\n```\nµ = (µ1, µ2),  Σ = (Σ11 Σ12; Σ21 Σ22),  Λ\
  \ = Σ^−1 = (λ11 λ12; λ21 λ22)\n```\n\n则边缘分布由下式给出：\n\n```\np(x1) = N(x1 | µ1, Σ11)\n\
  p(x2) = N(x2 | µ2, Σ22)\n```\n\n后验条件分布由下式给出：\n\n```\np(x1 | x2) = N(x1 | µ1|2, Σ1|2)\n\
  µ1|2 = µ1 + Σ12 Σ22^−1 (x2 − µ2)\n     = µ1 − λ11^−1 λ12 (x2 − µ2)\n     = Σ1|2\
  \ (λ11 µ1 − λ12 (x2 − µ2))\nΣ1|2 = Σ11 − Σ12 Σ22^−1 Σ21 = λ11^−1\n```\n\n#### 4.3.2\
  \ 示例\n\n##### 4.3.2.1 二维高斯分布的边缘分布和条件分布\n\n下面我们给出这些情况在实际应用中的一些实例，这将使它们看起来更直观。\n\n\
  ### 4.4 线性高斯系统\n\n假设我们有两个变量 `x` 和 `y`。令 `x ∈ R^Dx` 为隐变量，`y ∈ R^Dy` 为 `x` 的噪声观测。假设我们有以下先验和似然：\n\
  \n```\np(x) = N(x | µx, Σx)\np(y | x) = N(y | W x + µy, Σy)\n```\n\n其中 `W` 是大小为\
  \ `Dy × Dx` 的矩阵。这是一个线性高斯系统的例子。我们可以用 `x → y` 示意性地表示，意味着 `x` 生成 `y`。在本节中，我们展示如何反转箭头，即如何从\
  \ `y` 推断 `x`。我们在下面陈述结果，然后给出一些例子，最后推导结果。我们将在后续章节看到这些结果的更多应用。\n\n#### 4.4.1 结果陈述\n\
  \n**定理 4.3.** (线性高斯系统的贝叶斯规则)。给定如公式 4.37 所示的线性高斯系统，后验 `p(x | y)` 由下式给出：\n\n```\n\
  p(x | y) = N(x | µx|y, Σx|y)\nΣx|y = (Σx^−1 + W^T Σy^−1 W)^−1\nµx|y = Σx|y [W^T\
  \ Σy^−1 (y − µy) + Σx^−1 µx]\n```\n\n此外，归一化常数 `p(y)` 由下式给出：\n\n```\np(y) = N(y |\
  \ W µx + µy, Σy + W Σx W^T)\n```\n\n关于证明，请参见第 4.4.3 节 TODO。\n\n### 4.5 离题：Wishart\
  \ 分布 *\n\n### 4.6 推断 MVN 的参数\n\n#### 4.6.1 µ 的后验分布\n\n#### 4.6.2 Σ 的后验分布 *\n\n####\
  \ 4.6.3 µ 和 Σ 的联合后验分布 *\n\n#### 4.6.4 未知精度下的传感器融合 *\n\n## 第 5 章 贝叶斯统计\n\n### 5.1\
  \ 介绍\n\n### 5.2 后验分布的总结\n\n##### 5.2.1.1 无不确定性度量\n\n使用后验分布来总结我们对一组未知变量的所有了解，是贝叶斯统计的核心。在本章中，我们将更详细地讨论这种统计方法。\n\
  \nMAP 估计最明显的缺点，实际上任何点估计（如后验均值或中位数）的缺点，都是它不提供任何不确定性度量。在许多应用中，知道可以在多大程度上信任给定的估计至关重要。我们可以从后验中获得此类确定性度量，正如我们在第\
  \ 5.2.2 节讨论的那样。后验 `p(θ | D)` 总结了我们对未知量 `θ` 的所有了解。在本节中，我们讨论可以从概率分布（如后验）中得出的一些基本量。这些汇总统计量通常比完整的联合分布更易于理解和可视化。\n\
  \n\n\n\n\n#### 5.2.1 MAP 估计\n\n##### 5.2.1.2 代入 MAP 估计可能导致过拟合\n\n如果我们不建模边界中的脆弱性，那么此时我们的预测分布将会是傲慢的。预测中的傲慢在我们可能厌恶风险的情况下尤为危险；详见第\
  \ 5.7 节。\n\n##### 5.2.1.3 众数是一个非典型点\n\n我们可以通过计算后验均值、中位数或众数，无疑地得出一个未知量的点估计。在第 5.7\
  \ 节中，我们将探讨如何利用决策理论在这些方法之间进行选择。通常，后验均值或中位数是实值量最合适的选择，而后验边缘向量是离散量的最佳选择。然而，后验众数，即 MAP\
  \ 估计，是最流行的选择，因为它归结为一个优化问题，对于此类问题通常存在高效的算法。此外，MAP 估计可以用非贝叶斯术语来解释，即通过使用决策理论，我们将在第\
  \ 5.7 节中讨论。基本思想是指定一个损失函数，其中 `L(θ, ˆθ)` 是假设真值为 `θ` 而你的估计为 `ˆθ` 时所造成的损失。如果我们使用 0-1\
  \ 损失 `L(θ, ˆθ) = I(θ ≠ ˆθ)`（见 1.2.2.1 节），那么最优估计就是后验众数。0-1 损失意味着只有在你不犯任何错误时才能得分，否则一分不得：在这种损失函数下没有部分得分！对于连续值量，我们通常更倾向于使用平方误差损失，`L(θ,\
  \ ˆθ) = (θ − ˆθ)²`；正如我们在第 5.7 节所示，相应的最优估计量是后验均值。或者我们可以使用更稳健的损失函数，`L(θ, ˆθ) = |θ\
  \ − ˆθ|`，这将得到后验中位数。\n\n![](img/image_rsrc1RB.jpg) (a) ![](img/image_rsrc1RC.jpg)\
  \ (b)\n\n**图 5.1：** (a) 一个双峰分布，其中众数极不代表该分布。浅蓝色垂直线是均值，它可以说是对该分布更好的总结，因为它接近大部分概率质量。(b)\
  \ 一个偏态分布，其中众数与均值截然不同。\n\n##### 5.2.1.4 MAP 估计对重参数化不具有不变性\n\nMAP 估计一个更微妙的问题是，我们得到的结果取决于我们如何定义概率分布。从一种表示变换到另一种等价表示会改变结果，这并不理想，因为度量单位是任意的（例如，测量距离时，我们可以使用厘米或英寸）。为了理解这个问题，假设我们计算\
  \ `x` 的后验。如果我们定义 `y = f(x)`，则 `y` 的分布由公式 2.44 给出。`dx/dy` 项称为雅可比矩阵，它衡量单位体积通过 `f`\
  \ 后大小的变化。令 `ˆx = arg max_x p_x(x)` 为 `x` 的 MAP 估计。通常 `x = arg max_x p_x(x)` 并不由\
  \ `f(x)` 给出。例如，设 `X ~ N(6,1)` 且 `y = f(x)`，其中 `f(x) = 1/(1+exp(−x+5))`。\n\n我们可以利用蒙特卡洛模拟（见\
  \ 2.7 节）确定 `y` 的分布。结果如图 ?? 所示。\n\n![](img/image_rsrc1RD.jpg)\n\n**图 5.2：** 密度在非线性变换下变化的示例。注意变换后分布的众数如何不等于原始众数的变换。基于\
  \ (Bishop 2006b) 的练习 1.4。\n\n我们看到原始高斯分布被 Sigmoid 非线性压扁了。具体来说，我们看到变换后分布的众数不等于原始众数的变换。MLE\
  \ 不存在这个问题，因为似然是一个函数，而不是概率密度。贝叶斯推断也不存在这个问题，因为在对参数空间积分时考虑了测度的变化。\n\n#### 5.2.2 可信区间\n\
  \n除了点估计，我们通常还需要一个确定性的度量。对某个（标量）量 `θ` 的确信程度的一个标准度量是其后验分布的宽度。这可以使用 `100(1−α)%` 可信区间来估计，它是一个（连续的）区域\
  \ `C = (ℓ, u)`（代表下限和上限），包含 `1−α` 的后验概率质量，即 `C_α(D)` 其中 `P(ℓ ≤ θ ≤ u) = 1 − α` (5.1)。\n\
  \n可能存在许多这样的区间，所以我们选择一个使得每个尾部有 `(1−α)/2` 的质量；这称为中心区间。如果后验具有已知的函数形式，我们可以使用 `ℓ = F⁻¹(α/2)`\
  \ 和 `u = F⁻¹(1−α/2)` 计算后验中心区间，其中 `F` 是后验的累积分布函数 (cdf)。如果我们不知道函数形式，但可以从后验中抽取样本，则可以使用后验分位数的蒙特卡洛近似：我们只需对\
  \ `S` 个样本进行排序，并找到位于排序列表 `α/S` 位置处的那个样本。当 `S → ∞` 时，这收敛到真实分位数。人们经常混淆贝叶斯可信区间与频率学派置信区间。然而，它们并不相同，正如我们在\
  \ TODO 节中讨论的那样。通常，可信区间通常是人们想要计算的，但置信区间通常是他们实际计算的，因为大多数人学的是频率学派统计而不是贝叶斯统计。幸运的是，计算可信区间的机制与计算置信区间几乎一样简单。\n\
  \n### 5.3 贝叶斯模型选择\n\n通常，当面对一组不同复杂度的模型（即参数分布族）时，我们该如何选择最好的一个？这被称为模型选择问题。一种方法是使用交叉验证来估计所有候选模型的泛化误差，然后选择看起来最好的模型。\n\
  \n\n\n\n然而，这需要对每个模型进行 `K` 次拟合，其中 `K` 是 CV 折数。一种更有效的方法是跨模型处理后验。\n\n#### 5.2.3 比例差异的推断\n\
  \n```\np(D|m)p(m)\np(m|D) = ∑m′ p(D|m′)p(m′)  (5.3)\n```\n\n有时我们有多个参数，并且我们有兴趣计算这些参数的某个函数的后验分布。例如，假设你要从\
  \ Amazon.com 购买某样东西，并且有两个供应商以相同的价格提供该商品。供应商 1 有 90 条好评和 10 条差评。供应商 2 有 2 条好评和 0\
  \ 条差评。你应该从谁那里购买？ 18. 表面上看，你应该选择供应商 2，但我们不能非常确定供应商 2 更好，因为它的评价很少。在本节中，我们将概述对该问题的贝叶斯分析。类似的技术可用于在各种不同情境下比较各组间的比率或比例。\n\
  \n设 `θ1` 和 `θ2` 为两个供应商未知的可靠性。由于我们对它们知之甚少，我们将赋予它们均匀先验，`θ ~ Beta(1,1)`。后验分别为 `p(θ1|D1)\
  \ = Beta(91,11)` 和 `p(θ2|D2) = ~Beta(3,1)`。我们需要计算 `p(θ1 > θ2|D)`。为了方便，让我们定义 `δ =\
  \ θ1 − θ2` 为比率之差。（或者我们可以用对数几率比来处理。）我们可以使用数值积分计算所需的量：\n\n```\n∫ 1 ∫ 1\np(δ > 0|D)\
  \ = I(θ1 > θ2) Beta(θ1|91,11) Beta(θ2|3,1) dθ1 dθ2\n0 0  (5.2)\n```\n\n我们发现 `p(δ\
  \ > 0|D) = 0.710`，这意味着你最好从供应商 1 处购买！\n\n由此，我们可以轻松计算 MAP 模型，`m = arg max_m p(m|D)`。这被称为贝叶斯模型选择。如果我们对模型使用均匀先验，这相当于选择使以下公式最大化的模型：\n\
  \n```\n∫\np(D|m) = p(D|θ)p(θ|m) dθ  (5.4)\n```\n\n该量被称为边际似然、积分似然或模型 `m` 的证据。关于如何执行此积分的细节将在第\
  \ 5.3.2 节讨论。但首先，我们给出该量含义的直观解释。\n\n#### 5.3.1 贝叶斯奥卡姆剃刀\n\n人们可能会认为，使用 `p(D|m)` 来选择模型将总是倾向于参数最多的模型。\n\
  \n```\nˆ\n```\n\n如果我们使用 `p(D|θ_m)` 来选择模型，其中 `ˆ θ_m` 是模型 `m` 参数的 MLE 或 MAP 估计，那么这是正确的，因为参数更多的模型将更好地拟合数据，从而获得更高的似然。然而，如果我们对参数进行积分（边缘化），而不是最大化它们，我们将自动免受过拟合之害：参数更多的模型不一定具有更高的边际似然。这被称为贝叶斯奥卡姆剃刀效应（MacKay\
  \ 1995b; Murray and Ghahramani 2005），得名于奥卡姆剃刀原则，即应选择能充分解释数据的最简单模型。\n\n理解贝叶斯奥卡姆剃刀的一种方法是注意到，根据概率链式法则（公式\
  \ 2.3），边际似然可以重写如下：\n\n```\np(D) = p((x1,y1)) p((x2,y2)|(x1,y1))\n       p((x3,y3)|(x1,y1)\
  \ : (x2,y2)) ···  (5.5)\n       p((xN,yN)|(x1,y1) : (xN−1,yN−1))\n```\n\n这类似于似然的留一交叉验证估计（第\
  \ 1.3.4 节），因为我们根据所有过去的点预测每个未来的点。（当然，上述表达式中数据的顺序无关紧要。）如果模型过于复杂，它将过拟合早期的样本，进而对剩余样本预测不佳。\n\
  \n理解贝叶斯奥卡姆剃刀效应的另一种方法是注意到概率必须归一。因此 `∑ p(D′) p(m|D′) = 1`，其中求和是在所有可能的数据集上进行的。能预测许多事物的复杂模型必须将其概率质量分散得很薄，因此对于任何给定的数据集，其获得的似然不会比简单模型大。这有时被称为概率质量守恒原则，如图\
  \ 5.3 所示。\n\n```\n![](img/image_rsrc1RE.jpg)\n图 5.3：贝叶斯奥卡姆剃刀的示意图。宽阔（绿色）曲线对应复杂模型，窄（蓝色）曲线对应简单模型，中间（红色）曲线恰到好处。基于\
  \ (Bishop 2006a) 的图 3.13。\n```\n\n当使用贝叶斯方法时，我们不局限于在有限的网格值上评估证据。相反，我们可以使用数值优化来寻找\
  \ `λ = arg max_λ p(D|λ)`。这种方法称为经验贝叶斯或 II 类最大似然估计（详见第 5.6 节）。图 TODO(b) 显示了一个示例：我们看到该曲线的形状与\
  \ CV 估计相似，但可以更高效地计算。\n\n在讨论固定模型的参数推断时，我们经常写作：\n\n```\np(θ|D,m) ∝ p(θ|m) p(D|θ,m)\
  \  (5.6)\n```\n\n因此忽略了归一化常数 `p(D|m)`。这对于 `θ` 是有效的，因为 `p(D|m)` 相对于 `θ` 是常数。然而，在比较模型时，我们需要知道如何计算边际似然\
  \ `p(D|m)`。通常这可能非常困难，因为我们需要对所有可能的参数值进行积分，但当我们有共轭先验时，计算起来很容易，我们现在将展示这一点。\n\n设 `p(θ)\
  \ = q(θ)/Z0` 为我们的先验，其中 `q(θ)` 是未归一化分布，`Z0` 是先验的归一化常数。设 `p(D|θ) = q(D|θ)/Zℓ` 为似然，其中\
  \ `Zℓ` 包含似然中的任何常数因子。\n\n最后设 `p(θ|D) = q(θ|D)/ZN` 为我们的后验，其中 `q(θ|D) = q(D|θ)q(θ)`\
  \ 是未归一化后验，`ZN` 是后验的归一化常数。\n\n我们有：\n\n```\np(θ|D) = p(D|θ)p(θ) / p(D)  (5.7)\n\n\
  q(θ|D) = q(D|θ)q(θ)  (5.8)\n\nZN = Zℓ Z0 p(D)  (5.9)\n```\n\n因此，假设相关的归一化常数易于处理，我们就有一种简单的方法来计算边际似然。下面我们给出几个例子。\n\
  \n##### 5.3.2.1 Beta-二项模型\n\n让我们将上述结果应用于 Beta-二项模型。既然我们知道 `p(θ|D) = Beta(θ|a′,b′)`，其中\
  \ `a′ = a + N1`，`b′ = b + N0`，我们就知道后验的归一化常数是 `B(a′,b′)`。因此：\n\n```\n.10) p(D)\n\
  p(θ|D) = p(D|θ)p(θ)  (5\n\n= 1 / [ 1 / p(D) ] B(a,b) θ^{a−1}(1−θ)^{b−1}\n\n[ (N\
  \ N1) θ^{N1}(1−θ)^{N0}  (5.11)\n\n[ a+N1−1 (1−θ)^{b+N0−1} ] = N1 p(D) B(a,b) θ \
  \ (5.12)\n\n所以\n\n1 ) = ( N N1 ) 1 1\n( N1) p(D) B(a,b)  (5.13) B(a+N1, b+N0)\n\n\
  p(D) = N B(a+N1, b+N0) / ( N1 B(a,b) )  (5.14)\n```\n\n惩罚项取决于模型的复杂度。有关 BIC 得分的推导，请参见第\
  \ TODO 节。\n\n作为一个示例，考虑线性回归。如第 TODO 节所述，MLE 由 `w = (X^T X)^{-1} X^T y` 和 `σ² = 1/N\
  \ ∑_{i=1}^N (y_i − ˆw^T x_i)` 给出。然后，相应的对数似然由下式给出：\n\nBeta-Bernoulli 模型的边际似然与此相同，只是缺少\
  \ `( N N1 )` 项。\n\n##### 5.3.2.2 Dirichlet-多项模型\n\n通过与 Beta-Bernoulli 情况类似的推理，可以证明\
  \ Dirichlet-多项模型的边际似然由下式给出：\n\n```\np(D) = B(N + α) / B(α)\n     = Γ(∑_k α_k) ∏_k\
  \ Γ(N_k + α_k) / Γ(N + ∑_k α_k) Γ(α_k)  (5.15) (5.16)\n```\n\n```\nˆ N log p(D|θ)\
  \ = − N/2 log(2π ˆσ²)  (5.21)\n```\n\n因此 BIC 得分如下（忽略常数项）：\n\n```\nD BIC = N log(ˆσ²)\
  \ − D log N  (5.22)\n```\n\n其中 `D` 是模型中的变量数量。在统计文献中，通常使用 BIC 的另一种定义，我们称之为 BIC 代价（因为我们要最小化它）：\n\
  \n```\nˆ ˆ BIC-cost = −2 log p(D|θ) − dof(θ) log N ≈ −2 log p(D)  (5.23)\n```\n\n\
  在线性回归的背景下，这变为……\n\n\n\n# BIC\n\n$$ \\text{BIC} \\triangleq \\text{cost} = N \\log(\\\
  hat{\\sigma}²) + D \\log N \\tag{5.24} $$\n\n##### 5.3.2.3 高斯-高斯-威沙特模型\n\n考虑早先形式为\
  \ NIW 的 MVN 实例。将 `Z0` 单独留作早先的归一化常数，`ZN` 作为后者的归一化常数，并令 `Zℓ(2π)^{ND/2}` 为概率的归一化常数。那时，不难看出：\n\
  \n$$ p(D) = \\frac{Z_N}{Z_0 Z_\\ell} \\tag{5.17} $$\n\n$$\n\\frac{(2\\pi)^{D/2}\
  \ S_N|^{-\\nu_N/2} 2^{(\\nu_0+N)D/2} \\Gamma_D(\\nu_N/2)}{1/\\kappa_N |} \\tag{5.18}\n\
  $$\n\n$$\n\\frac{(2\\pi)^{ND/2} (2\\pi)^{D/2} S_0|^{-\\nu_0/2} 2^{\\nu_0 D/2} \\\
  Gamma_D(\\nu_0/2) \\kappa_0 |}{}\n$$\n\n$$\n= \\frac{1}{\\kappa_0^{D/2} |S_0|^{\\\
  nu_0/2} \\Gamma_D(\\nu_N/2)} \\tag{5.19}\n$$\n\n$$\n\\frac{\\pi^{ND/2} \\kappa_N\
  \ |S_N|^{\\nu_N/2} \\Gamma_D(\\nu_0/2)}{}\n$$\n\n##### 5.3.2.4 对数边际似然的 BIC 估计\n\n\
  BIC 技术与最小描述长度或 MDL 原则密切相关，该原则根据模型拟合数据的程度以及描述模型的复杂程度来描述模型的得分。详情请参见 (Hansen and Yu\
  \ 2001)。\n\n有一个与 BIC/MDL 非常相似的表达式，称为赤池信息准则或 AIC，定义为：\n\n$$ \\text{AIC}(m,D) = \\\
  log p(D|\\hat{\\theta}_{\\text{MLE}}) - \\text{dof}(m) \\tag{5.25} $$\n\n这源自频率学派框架，不能被解释为对边际似然的估计。尽管如此，该表达式的形式与\
  \ BIC 基本相似。我们看到 AIC 的惩罚小于 BIC。这使得 AIC 倾向于选择更复杂的模型。然而，这可能会带来更好的预测精度。有关此类信息准则的进一步讨论，请参见例如\
  \ (Clarke et al. 2009, sec 10.2)。\n\n通常，计算公式 5.4 中的积分可能非常困难。一种简单但著名的估计称为贝叶斯信息准则或\
  \ BIC，其形式如下 (Schwarz 1978)：\n\n$$ \\text{BIC} \\triangleq \\log p(D|\\hat{\\theta})\
  \ - \\frac{\\text{dof}(\\hat{\\theta}) \\log N}{2} \\tag{5.20} $$\n\n其中 `dof(θ)`\
  \ 是模型中的自由度数量，`θ̂` 是模型的 MLE。我们看到这具有惩罚对数似然的形式，其中\n\n##### 5.3.2.5 先验的影响\n\n有时不清楚如何设置先验。当我们进行后验推断时，先验的细节可能并不太重要，因为似然通常无论如何都会压倒先验。但在计算边际似然时，先验扮演着更重要的角色，因为我们正在对所有可能的参数设置进行加权平均，权重由先验决定。如果先验模糊不清，正确的贝叶斯方法是给先验设定一个先验。如果先验模糊不清，正确的贝叶斯方法是给先验设定一个先验。\n\
  \n#### 5.3.3 贝叶斯因子\n\n假设我们对模型的先验是均匀的，`p(m) ∝ 1`。那么模型选择等同于选择边际似然最高的模型。现在假设我们只考虑两个模型，称它们为零假设\
  \ `M0` 和备择假设 `M1`。将贝叶斯因子定义为边际似然的比率：\n\n$$ \\text{BF}_{1,0} \\triangleq \\frac{p(D|M_1)}{p(D|M_0)}\
  \ = \\frac{p(M_1|D)/p(M_1)}{p(M_2|D)/p(M_0)} \\tag{5.26} $$\n\n### 5.4 先验\n\n贝叶斯统计最具争议的方面在于其对先验的依赖。贝叶斯派认为这是不可避免的，因为没有人是一块**干净的石板**或**空白的画布**：所有推断都必须基于关于世界的特定假设进行。然而，人们可能有兴趣最小化先验假设的影响。我们在下面简要讨论一些实现此目的的方法。\n\
  \n#### 5.4.3 共轭先验的混合\n\n鲁棒先验很有用，但使用起来计算成本可能很高。共轭先验简化了计算，但通常不够鲁棒，且不够灵活，无法编码我们的先验知识。然而，事实证明，共轭先验的混合也是共轭的，并且可以近似任何类型的先验\
  \ (Dallal and Hall 1983; Diaconis and Ylvisaker 1985)。因此，此类先验在计算便利性和灵活性之间提供了良好的折衷。\n\
  \n### 5.5 分层贝叶斯\n\n计算后验 `p(θ|D)` 的一个关键要求是指定先验 `p(θ|η)`，其中 `η` 是超参数。如果我们不知道如何设置 `η`\
  \ 怎么办？在某些情况下，我们可以使用非信息先验，这是我们上面讨论过的。一种更贝叶斯的方法是给我们的先验设定一个先验！用图模型术语（第 TODO 章）表示，我们可以将这种情况表示如下：\n\
  \n$$ \\eta \\to \\theta \\to D \\tag{5.27} $$\n\n这是一个分层贝叶斯模型的示例，也称为多层模型，因为存在多层未知量。\n\
  \n#### 5.4.1 非信息先验\n\n### 5.6 经验贝叶斯\n\n如果我们对 `θ` 应该是什么没有强烈的信念，通常会使用非信息或无信息先验，让数据说明一切。\n\
  \n#### 5.4.2 鲁棒先验\n\n在许多情况下，我们对先验不是非常确定，因此我们需要确保它不影响结果。这可以通过使用鲁棒先验 (Insua and Ruggeri\
  \ 2000) 来实现，它们通常具有厚尾，这避免了强制事物过于接近先验均值。\n\n### 方法定义\n\n| 方法 | 定义 |\n| :--- | :---\
  \ |\n| 最大似然 | `θ̂ = arg max_θ p(D|θ)` |\n| MAP 估计 | `θ̂ = arg max_θ p(D|θ)p(θ|η)`\
  \ |\n| ML-II (经验贝叶斯) | `η̂ = arg max_η ∫ p(D|θ)p(θ|η)dθ = arg max_η p(D|η)` |\n\
  | MAP-II | `η̂ = arg max_η ∫ p(D|θ)p(θ|η)p(η)dθ = arg max_η p(D|η)p(η)` |\n| 全贝叶斯\
  \ | `p(θ,η|D) ∝ p(D|θ)p(θ|η)` |\n\n### 5.7 贝叶斯决策理论\n\n我们已经了解了概率论如何用于表示和更新我们对世界状态的信念。然而，最终我们的目标是将我们的信念转化为\
  \ ∫ 37 行动。在本节中，我们讨论实现这一目标的最佳方式。\n\n我们的目标是设计一个决策系统或策略，`f(x) : X → Y`，以最小化期望损失 `R_exp(f)`（见公式\
  \ 1.1）。在贝叶斯决策理论方法中，观察到 `x` 后的最优动作被定义为使后验期望损失最小化的动作 `a`：\n\n$$ \\rho(f) = E_{p(y|x)}[L(y,\
  \ f(x))] = \\sum_y L[y, f(x)] p(y|x) = \\int L[y, f(x)] p(y|x) dy \\tag{5.28} $$\n\
  \n因此，贝叶斯估计量，也称为贝叶斯决策规则，由下式给出：\n\n$$ \\delta(x) = \\arg \\min_f \\rho(f) \\tag{5.29}\
  \ $$\n\n$$ \\rho(f) = \\int L[y, f(x)] p(y|x) dy = \\int [y - f(x)]² p(y|x) dy \\\
  tag{5.30} $$\n\n$$ = \\int [y² - 2y f(x) + f(x)²] p(y|x) dy $$\n\n因此，最优估计是后验均值：\n\
  \n$$ \\frac{\\partial \\rho}{\\partial f} = \\int [-2y + 2f(x)] p(y|x) dy = 0 $$\n\
  \n$$ \\int y p(y|x) dy = \\int f(x) p(y|x) dy $$\n\n$$ f(x) \\int p(y|x) dy = E_{p(y|x)}[y]\
  \ $$\n\n$$ f(x) = E_{p(y|x)}[y] \\tag{5.31} $$\n\n#### 5.7.1 常见损失函数的贝叶斯估计量\n\n这通常称为最小均方误差估计或\
  \ MMSE 估计。\n\n##### 5.7.1.1 MAP 估计最小化 0-1 损失\n\n##### 5.7.1.3 后验中位数最小化 ℓ1 (绝对) 损失\n\
  \n当 `L(y, f(x))` 为 0-1 损失（第 1.2.2.1 节）时，我们可以证明 MAP 估计最小化 0-1 损失：\n\n$$ \\arg \\\
  min_f \\rho(f) = \\arg \\min_f \\sum_{k=1}^K L[C_k, f(x)] p(C_k|x) $$\n\n$$ = \\\
  arg \\min_f \\sum_{k=1}^K I(f(x) \\neq C_k) p(C_k|x) $$\n\n$$ = \\arg \\min_f \\\
  sum_{k=1}^K p(f(x) \\neq C_k|x) $$\n\n$$ = \\arg \\min_f [1 - p(f(x) = C_k|x)] $$\n\
  \n$$ = \\arg \\max_f p(f(x) = C_k|x) $$\n\n##### 5.7.1.2 后验均值最小化 ℓ2 (二次) 损失\n\n\
  对于连续参数，更合适的损失函数是平方误差、`ℓ2` 损失或二次损失，定义为 `L(y, f(x)) = [y - f(x)]²`。后验期望损失由下式给出：\n\n\
  `ℓ2` 损失对偏离真值进行二次惩罚，因此对异常值敏感。一个更鲁棒的替代方案是绝对或 `ℓ1` 损失。最优估计是后验中位数，即满足 `P(y < a|x) =\
  \ P(y ≥ a|x) = 0.5` 的值 `a`。\n\n**证明。**\n\n$$ \\rho(f) = \\int L[y, f(x)] p(y|x)\
  \ dy = \\int |y - f(x)| p(y|x) dy $$\n\n$$ = \\int_{y < f(x)} [f(x) - y] p(y|x)\
  \ dy + \\int_{y \\ge f(x)} [y - f(x)] p(y|x) dy $$\n\n$$ \\frac{\\partial \\rho}{\\\
  partial f} = \\int [p(y < f(x)|x) - p(y \\ge f(x)|x)] dy = 0 $$\n\n$$ \\implies\
  \ p(y < f(x)|x) = p(y \\ge f(x)|x) = 0.5 $$\n\n$$ \\therefore f(x) = \\text{中位数}\
  \ $$\n\n##### 5.7.1.4 拒绝选项\n\n\n\n\n# 使用不确定预测对问题进行分组\n\n在 `p(y|x)` 极不确定的分组问题中，我们可能倾向于选择一项“异常”活动，即我们不将模型归类为任何预定类别，而是输出“不知道”。此类模糊情况可由人类专家等处理。这在医疗和金融等规避风险的领域非常有价值。\n\
  \n我们可以按如下方式形式化“异常”选择。令选择 `f(x) = cK+1` 对应选择“异常”活动，选择 `f(x) ∈ {C1, ..., Ck}` 对应选择其中一个类别。假设我们将损失函数定义为：\n\
  \n```\nL(f(x), y) =\n  0          if f(x) = y and f(x), y ∈ {C1, ..., Ck}\n  λ_r\
  \        if f(x) ≠ y and f(x), y ∈ {C1, ..., Ck}\n  λ_r        if f(x) = cK+1\n\
  ```\n\n(5.32)\n\n其中 `λ_r` 是替换错误的代价，`λ_r` 是“异常”动作的代价。\n\n## 5.7.1.5 监督学习\n\n当自然的未知状态为\
  \ `θ`（数据生成过程的参数）时，我们可以将 `f(x)` 造成的损失（即使用该预测器）描述如下：\n\n```\nL(θ, f) = E_{p(x,y|θ)}[ℓ(y\
  \ − f(x))]\n```\n\n(5.33)\n\n这被称为泛化误差。我们的目标是最小化后验期望损失，其由下式给出：\n\n```\nρ(f|D) = ∫\
  \ p(θ|D) L(θ, f) dθ\n```\n\n(5.34)\n\n这应与频率学派风险形成对比，后者定义于公式 TODO 中。\n\n#### 5.7.2\
  \ 假阳性与假阴性的权衡\n\n在本节中，我们关注二元决策问题，如假设检验、二分类、物体/事件检测等。我们可能犯两类错误：假阳性（又称误报）或假阴性（又称漏报）。0-1\
  \ 损失将这两类错误同等对待。然而，我们可以考虑下述更广义的损失矩阵：TODO\n\n## 频率学派统计\n\n人们曾尝试设计统计推断方法，避免将参数视为随机变量，从而避免使用先验和贝叶斯规则。此类方法被称为频率学派统计、传统统计或标准统计。它们不基于后验分布，而是依赖于抽样分布的概念。\n\
  \n```\nR_exp(θ, f) = E_{p(D̃|θ)}[L(θ, f(D̃))]\n           = ∫ L(θ, f(D̃)) p(D̃|θ)\
  \ dD̃\n```\n\n(6.1)\n\n其中 `D̃` 是从由参数 `θ` 表示的分布中抽取的数据。换句话说，期望是针对估计量的抽样分布而言的。将其与贝叶斯后验期望损失进行对比：\n\
  \n```\nρ(f|D)  (6.2)\n```\n\n### 6.1 估计量的抽样分布\n\n在频率学派统计中，参数估计 `θ̂` 通过将估计量 `δ` 应用于某些数据\
  \ `D` 来计算，因此：\n\n```\nθ̂ = δ(D)\n```\n\n参数被视为固定，数据被视为随机，这正是贝叶斯方法的完全相反。参数估计的不确定性可以通过计算估计量的抽样分布来衡量。要理解这一点……\n\
  \n#### 6.1.1 Bootstrap\n\n我们可以将 bootstrap 分布视为贝叶斯后验的一种粗略近似，详见 (Hastie et al. 2001,\
  \ p235)。\n\n#### 6.1.2 MLE 的大样本理论\n\n...\n\n### 6.2 频率学派决策理论\n\n在频率学派或传统决策理论中，存在损失函数和似然，但没有先验，因此也没有后验或后验期望损失。因此，不像贝叶斯情况那样，没有确定最优估计量的自动方法。相反，在频率学派方法中，我们可以自由选择任何我们想要的估计量或决策规则\
  \ `f : X → Y`。选定估计量后，我们按如下方式定义其平均损失或风险：\n\n```\nL_nll(y, η) = −log p(y|x, w) = log(1\
  \ + e^{−yη})\n```\n\n(6.3)\n\n### 6.3 估计量的优良性质\n\n### 6.4 经验风险最小化\n\n#### 6.4.1\
  \ 正则化风险最小化\n\n#### 6.4.2 结构风险最小化\n\n#### 6.4.3 使用交叉验证估计风险\n\n#### 6.4.4 利用统计学习理论给出风险的上界\n\
  \n#### 6.4.5 代理损失函数\n\n### 6.5 频率学派统计的病理现象\n\n...\n\n# 线性回归\n\n### 7.1 简介\n\n线性回归是统计学和（监督）机器学习的主力模型。当结合基函数或其他形式的基函数扩展时，它还可以建模非线性关系。此外，当高斯输出被伯努利或多努利分布替代时，它可用于分类，正如我们将在下文看到的。因此，详细研究这一模型大有裨益。\n\
  \n### 7.2 表示\n\n```\np(y|x, θ) = N(y | w^T x, σ²)\n```\n\n(7.1)\n\n其中 `w` 和 `x`\
  \ 是增广向量，`x = (1, x)`，`w = (b, w)`。通过用输入的某个非线性函数 `ϕ(x)` 替换 `x`，线性回归可以用于建模非线性关系：\n\
  \n```\np(y|x, θ) = N(y | w^T ϕ(x), σ²)\n```\n\n(7.2)\n\n这被称为基函数扩展。（注意模型在参数 `w` 上仍然是线性的，因此仍称为线性回归；其意义将在下文变得清晰。）一个简单的例子是多项式基函数，此时模型形式为：\n\
  \n```\nϕ(x) = (1, x, ···, x^d)\n```\n\n(7.3)\n\n我们不最大化对数似然，而是等价地最小化负对数似然或 NLL：\n\
  \n```\nNLL(θ) = −ℓ(θ) = −log p(D|θ)\n```\n\n(7.4)\n\nNLL 形式有时更方便，因为许多优化软件包旨在寻找函数的最小值而非最大值。现在让我们将\
  \ MLE 方法应用于线性回归设定。将高斯定义代入上式，可得对数似然为：\n\n```\nℓ(θ) = ∑_{i=1}^N log (1/√(2πσ²)) exp(−(y_i\
  \ − w^T x_i)² / 2σ²)\n```\n\n(7.5)\n\n```\n= −N/2 log(2πσ²) − 1/(2σ²) RSS(w)\n```\n\
  \n(7.6)\n\n`RSS` 代表残差平方和，定义为：\n\n```\nRSS(w) = ∑_{i=1}^N (y_i − w^T x_i)²\n```\n\
  \n(7.7)\n\n我们看到 `w` 的 MLE 是使 RSS 最小化的那个，因此该方法称为最小二乘法。\n\n去除关于 `w` 的常数项，NLL 可写为：\n\
  \n```\nNLL(w) = 1/N ∑_{i=1}^N (y_i − w^T x_i)²\n```\n\n(7.8)\n\n最小化 `NLL(w)` 有两种方法。\n\
  \n### 7.3 MLE\n\n定义：\n\n```\ny = (y_1, y_2, ···, y_N)^T\nX = (x_1^T, x_2^T, ···,\
  \ x_N^T)^T\n```\n\n则 `NLL(w)` 可写为：\n\n```\nNLL(w) = 1/2 (y − Xw)^T (y − Xw)\n```\n\
  \n(7.9)\n\n当 `D` 较小（例如 `N < 1000`）时，我们可以使用以下公式直接计算 `w`：\n\n```\nw_OLS = (X^T X)^{−1}\
  \ X^T y\n```\n\n(7.10)\n\n该线性方程组对应的解 `ŵ_OLS` 称为普通最小二乘解或 OLS 解。\n\n**证明。** 我们现在不加证明地陈述几个矩阵求导事实（本节不需要用到这些）。\n\
  \n```\n∂/∂w NLL(w) = 1/2 (Xw − y)^T (Xw − y)\n```\n\n```\n∂/∂w NLL = 1/2 ∂/∂w (w^T\
  \ X^T X w − w^T X^T y − y^T X w + y^T y)\n         = 1/2 ∂/∂w (w^T X^T X w − w^T\
  \ X^T y − y^T X w)\n         = 1/2 ∂/∂w tr(w^T X^T X w − w^T X^T y − y^T X w)\n\
  \         = 1/2 ∂/∂w (tr w^T X^T X w − 2 tr y^T X w)\n```\n\n结合公式 7.12 和 7.13，我们发现：\n\
  \n```\ntr A = ∑_{i=1}^n A_ii\n```\n\n```\n∂/∂A tr(AB) = B^T\n```\n\n(7.11)\n\n```\n\
  ∂/∂A^T f(A) = ∂/∂A f(A)\n```\n\n(7.12)\n\n```\n∂/∂A tr(ABA^T C) = CAB + C^T A B^T\n\
  ```\n\n(7.13)\n\n```\n∂/∂A |A| = |A| (A^{−1})^T\n```\n\n(7.14)\n\n则：\n\n```\n∂/∂w\
  \ NLL = 1/2 (X^T X w + X^T X w − 2 X^T y)\n         = X^T X w − X^T y\n```\n\n```\n\
  ∂/∂w NLL = 0  ⇒  X^T X w − X^T y = 0\n```\n\n```\nX^T X w = X^T y\n```\n\n(7.15)\n\
  \n```\nw_OLS = (X^T X)^{−1} X^T y\n```\n\n公式 7.15 称为正规方程。\n\n![Graphical understanding\
  \ of least squares for N = 3 models and D = 2 elements. x̃1 and x̃2 are vectors\
  \ in R³; together they characterize a 2D plane. y is likewise a vector in R³ yet\
  \ doesn't lie on this 2D plane. The symmetrical projection of y onto this plane\
  \ is meant ŷ. The red line from y to ŷ is the lingering, whose standard we need\
  \ to limit. For visual lucidity, all vectors have been changed over to unit norm.](img/image_rsrc1RF.jpg)\n\
  \n**图 7.1：** N=3 个模型和 D=2 个特征时最小二乘法的几何理解。\n\n## 7.3.2 SGD\n\n当 `D` 很大时，使用随机梯度下降\
  \ (SGD)。\n\n令 `A^T = w`，`B = B^T = X^T X`，且 `C = I`。因此：\n\n```\n∂/∂w NLL = 1/2 (X^T\
  \ X w + X^T X w − 2 X^T y)\n         = X^T X w − X^T y\n```\n\n```\n∂/∂w_j NLL(w)\
  \ = ∑_{i=1}^N (w^T x_i − y_i) x_{ij}\n```\n\n(7.17)\n\n```\nw_j = w_j − α ∂/∂w_j\
  \ NLL(w)\n    = w_j − ∑_{i=1}^N α (w^T x_i − y_i) x_{ij}\n```\n\n(7.18)\n\n```\n\
  w = w − α (w^T x_i − y_i) x\n```\n\n(7.19)\n\n\n\n\n\n### 7.4 岭回归 (MAP)\n\n## 7.3.1.1\
  \ 几何理解\n\n见 Figure 7.1。\n\n为了限制残差 `y - ŷ` 的标准，我们需要残差向量与 `X` 的每个片段正交，因此 `x̃ⱼ(y -\
  \ ŷ) = 0`，其中 `j = 1 : D`。因此\n\n```\nxⱼ(y - ŷ) = 0\nXᵀ(y - Xw) = 0\nw = (XᵀX)⁻¹Xᵀy\n\
  ```\n\nML 估计的一个问题是它可能导致过拟合。在本节中，我们讨论一种通过使用带有高斯先验的 MAP 估计来改善此问题的方法。\n\n#### 7.4.1\
  \ 基本思想\n\n我们可以通过使用零均值高斯先验来敦促参数变小，从而产生更平滑的曲线：\n\n```\np(w) = ∏ N(wⱼ | 0, τ²)\n  \
  \    j\n```\n\n其中 `1/τ²` 控制先验的强度。相应的 MAP 估计问题变为\n\n```\narg max ∑ log N(yᵢ | w₀\
  \ + wᵀxᵢ, σ²) + ∑ log N(wⱼ | 0, τ²)\n      w i=1       j=1\n```\n\n在拥有大量数据的领域，简单的方法也能效果很好\
  \ (Halevy et al. 2009)。然而，仍然有理由研究更复杂的学习策略，因为总会存在我们只有少量数据的问题。例如，即使在网络搜索这样数据丰富的领域，当我们需要开始个性化结果时，对于任意给定用户可用的数据量相对于问题的复杂性再次变得很小。\n\
  \n这是一个基本练习，可以证明这等价于最小化以下目标\n\n```\nJ(w) = (1/Nσ²) ∑ (yᵢ - (w₀ + wᵀxᵢ))² + λ ||w||²,\
  \ λ ≜ 1/τ²\n        i=1\n```\n\n这里第一项当然是 MSE/NLL，第二项 `λ ≥ 0` 是一个复杂度惩罚。相应的解由下式给出\n\
  \n```\nŵ_ridge = (λI_D + XᵀX)⁻¹Xᵀy\n```\n\n此方法称为岭回归，或惩罚最小二乘法。通常，给模型参数添加高斯先验以敦促它们变小被称为\
  \ `ℓ₂` 正则化或权重衰减。请注意，偏移项 `w₀` 未被正则化，因为这只影响函数的高度，而不影响其复杂度。我们将在本书中考虑各种先验。每一种都对应一种不同形式的正则化。此策略广泛用于防止过拟合。\n\
  \n#### 7.4.2 数值稳定计算\n\n```\nŵ_ridge = V (ZᵀZ + λI_N)⁻¹Zᵀy\n```\n\n#### 7.4.3 与 PCA\
  \ 的联系\n\n#### 7.4.4 大数据的正则化影响\n\n正则化是避免过拟合最常用的方法。然而，另一种有效的方法（并非总是可用）是使用大量数据。很自然地可以看出，我们拥有的训练数据越多，就越能更好地学习。\n\
  \n## 第 8 章 逻辑回归\n\n### 8.1 表示\n\n逻辑回归可以是二项的或多项的。二项逻辑回归模型具有以下结构\n\n```\np(y | x,\
  \ w) = Ber(y | sigm(wᵀx))\n```\n\n其中 `w` 和 `x` 是扩展向量，即 `w = (b, w₁, w₂, · · · ,\
  \ w_D)`，`x = (1, x₁, x₂, · · · , x_D)`。\n\n```\ng(w) = dJ/dw = ∑ [π(xᵢ) - yᵢ]xᵢ\
  \ = Xᵀ(π - y)\n       i=1\n\nH(w) = d²g/dwᵀ = d(π - y)ᵀXᵀ/dw\n     = XᵀSX, S ≜ diag(π(xᵢ)(1\
  \ - π(xᵢ))xᵢ)\n```\n\n### 8.2 优化\n\n#### 8.2.1 MLE\n\n```\n{ N\nℓ(w) = log ∏ [π(xᵢ)]ʸⁱ\
  \ [1 - π(xᵢ)]¹⁻ʸⁱ\n     i=1\n```\n\n其中 `π(x) ≜ P(y = 1 | x, w)`。\n\n```\nN\n= ∑\
  \ [yᵢ log π(xᵢ) + (1 - yᵢ) log(1 - π(xᵢ))]\ni=1\n\nN\n= ∑ [yᵢ log (π(xᵢ)/(1 - π(xᵢ)))]\
  \ + ∑ log(1 - π(xᵢ))\ni=1   i=1\n\nN\n= ∑ [yᵢ(w·xᵢ) - log(1 + exp(w·xᵢ))]\ni=1\n\
  ```\n\n```\nJ(w) ≜ NLL(w) = -ℓ(w)\nN\n= -∑ [yᵢ(w·xᵢ) - log(1 + exp(w·xᵢ))]\ni=1\n\
  ```\n\nEquation 8.2 也称为交叉熵误差函数 (见 Equation 2.53)。\n\n与线性回归不同，我们现在无法再以闭式写出 MLE。相反，我们需要使用优化算法来计算它，见\
  \ Appendix A。为此，我们需要求导梯度和 Hessian 矩阵。\n\n对于逻辑回归的情况，可以证明其梯度和 Hessian 由以下公式给出\n\n\
  ##### 8.2.1.1 迭代重加权最小二乘法 (IRLS)\n\n#### 8.2.2 MAP\n\n正如我们倾向于岭回归而非线性回归一样，我们也应该倾向于逻辑回归的\
  \ MAP 估计而非计算 MLE。我们可以使用 `ℓ₂` 正则化，就像岭回归一样。我们注意到新的目标函数、梯度和 Hessian 具有以下形式：\n\n```\n\
  J'(w) ≜ NLL(w) + λwᵀw\ng'(w) = g(w) + λw\nH'(w) = H(w) + λI\n```\n\n将这些调整后的条件传递给任何基于梯度的优化器是一件简单的事情。\n\
  \n### 8.3 多项逻辑回归\n\n#### 8.3.1 表示\n\n多项逻辑回归模型也称为最大熵分类器，具有以下形式\n\n```\np(y = c |\
  \ x, W) = exp(w_cᵀx) / ∑ exp(w_cᵀx)\n                   C\n                  c=1\n\
  ```\n\n令 `yᵢ = (I(yᵢ = 1), I(yᵢ = 1), · · · , I(yᵢ = C))`，`µᵢ = (p(y = 1 | xᵢ, W),\
  \ p(y = 2 | xᵢ, W), · · · , p(y = C | xᵢ, W))`，则对数似然函数可以写为\n\n```\nℓ(W) = log ∏\
  \ ∏ µᵢcʸⁱᶜ\n       N C\n      i=1 c=1\n\n= ∑ ∑ yᵢc w_cᵀxᵢ - log ∑ exp(w_cᵀxᵢ)\n\
  \  i=1 c=1   C\n           c=1\n```\n\n定义真正的目标函数为 NLL\n\n```\nJ(W) ≜ NLL(W) = -ℓ(W)\n\
  ```\n\n定义 `A ⊗ B` 为矩阵 `A` 和 `B` 的 Kronecker 积。如果 `A` 是 `m×n` 矩阵，`B` 是 `p×q` 矩阵，则\
  \ `A ⊗ B` 是 `mp×nq` 分块矩阵\n\n```\n⎡ a₁₁B  ···  a₁ₙB ⎤\n⎢ ...    ...  ... ⎥\n⎣ aₘ₁B\
  \  ···  aₘₙB ⎦\n```\n\n梯度和 Hessian 由下式给出\n\n```\ng(W) = ∑ (µᵢ - yᵢ) ⊗ xᵢ\n     \
  \  i=1\n\nH(W) = ∑ (diag(µᵢ) - µᵢµᵢᵀ) ⊗ (xᵢxᵢᵀ)\n       i=1\n```\n\n其中 `yᵢ = (I(yᵢ\
  \ = 1), I(yᵢ = 1), · · · , I(yᵢ = C-1))` 和 `µᵢ = (p(y = 1 | xᵢ, W), p(y = 2 | xᵢ,\
  \ W), · · · , p(y = C-1 | xᵢ, W))` 是长度为 `C-1` 的列向量。将它们传递给任何基于梯度的优化器。\n\n#### 8.3.2\
  \ MLE\n\n#### 8.3.3 MAP\n\n新的目标函数\n\n```\nJ'(W) = NLL(w) - log p(W)\n```\n\n其中 `p(W)\
  \ ≜ ∏ N(w_c | 0, V₀)`\n                  C\n                 c=1\n\n```\n= J(W)\
  \ + 1/2 ∑ w_cᵀ V₀⁻¹ w_c\n         C\n        c=1\n```\n\n其梯度和 Hessian 由下式给出\n\n\
  ```\ng'(w) = g(W) + V₀⁻¹ ∑ w_c\n                   C\n                  c=1\n\n\
  H'(w) = H(w) + I_C ⊗ V₀⁻¹\n```\n\n这可以传递给任何基于梯度的优化代理以找到 MAP 估计。然而请注意，Hessian 的大小为\
  \ `((CD)(CD))`，其行和列比二元情况多 `C` 倍，因此有限内存 BFGS 比牛顿法更合适。\n\n### 8.4 贝叶斯逻辑回归\n\n通常希望计算参数的完整后验\
  \ `p(w | D)`，用于逻辑回归模型。这对于任何我们需要将置信区间与预测相关联的情况都很有用 (例如，这在解决相关刑事问题时是必不可少的，见 Section\
  \ TODO)。不幸的是，与线性回归情况不同，这无法精确完成，因为逻辑回归没有方便的共轭先验。我们在下面讨论一种简单的近似；其他一些方法包括 MCMC (Section\
  \ TODO)、变分推断 (Section TODO)、期望传播 (Kuss and Rasmussen 2005) 等。为了符号简洁，我们坚持使用二元逻辑回归。\n\
  \n#### 8.4.1 拉普拉斯近似\n\n#### 8.4.2 BIC 的推导\n\n#### 8.4.3 逻辑回归的高斯近似\n\n#### 8.4.4\
  \ 后验预测的近似\n\n#### 8.4.5 残差检验 (异常检测)\n\n### 8.5 在线学习和随机优化\n\n传统上 AI 是离线执行的，然而，假设我们有流式数据，我们确实需要执行在线学习，这样我们就可以在每个新数据点出现时更新我们的估计，而不是延迟到最后\
  \ (这可能永远不会发生)。此外，无论我们是否有一批数据，如果它太大而无法放入主内存，我们都应该像处理流一样处理它。下面我们讨论此类场景的学习策略。\n\nTODO\n\
