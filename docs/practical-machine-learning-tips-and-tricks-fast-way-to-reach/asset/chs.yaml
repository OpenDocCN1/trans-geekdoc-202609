  \ [PMTK Tutorial](http://pmtk3.googlecode.com/svn/trunk/docs/tutorial/html/tutSupervised.html)\
  \ 了解这些模型的 PMTK 对应实现。*\n\n#### 8.6.2 处理缺失数据\n\n有时部分输入源（`x` 的部分）未被观测到；这可能是由于传感器故障，或调查中未能完成某一部分等原因造成。这被称为缺失数据问题。以原则性方式处理缺失数据的能力可能是生成式模型最大的优势。\n\
  \n为了形式化我们的假设，我们可以关联一个二元响应变量 `ri ∈ {0,1}`，指示每个值 `xi` 是否被观测到。联合模型具有以下结构：\n\n`p(xi,\
  \ ri | θ, ϕ) = p(ri | xi, ϕ) p(xi | θ)`\n\n其中 `ϕ` 是控制事物是否被观测到的参数。\n\n*   **MCAR\
  \ (完全随机缺失)：** 如果我们假设 `p(ri | xi, ϕ) = p(ri | ϕ)`，我们称数据为完全随机缺失。\n*   **MAR (随机缺失)：**\
  \ 如果我们接受 `p(ri | xi, ϕ) = p(ri | xo, ϕ)`，其中 `xo` 是 `xi` 的观测部分，我们称数据为随机缺失。\n\n任何生成式概率模型（例如\
  \ HMM、玻尔兹曼机、贝叶斯网络等）都可以通过将其用作类条件密度来转化为分类器。\n\n\n\n\n• 如果这两种怀疑都不成立，我们就说信息不是无差别缺失的，即\
  \ NMAR（非随机缺失）。对于这种情况，我们需要对缺失信息机制建模，因为缺失模式对于缺失信息的值及相应参数具有信息量。例如，这在大多数协作过滤问题中就是这种情况。更多讨论请参见\
  \ (Marlin 2008)。我们在此之后将假设数据为 MAR（随机缺失）。\n\n在处理缺失信息时，区分仅在测试时存在缺失的情况（此时训练数据是完整数据），以及更难处理的在训练时也存在缺失的情况，是很有帮助的。我们将在下文讨论这两种情况。注意，根据定义，类别标签在测试时始终是缺失的；如果类别标签在训练时有时也缺失，该问题称为半监督学习。\n\
  \n##### 8.6.2.1 测试时的缺失信息\n\n在生成式分类器中，我们可以通过将 MAR（随机缺失）的特征边缘化来处理。例如，如果我们缺失 `x1` 的值，我们可以计算\
  \ `p(y = c|θ)p(x2:D|y = c,θ)` (8.31) `= p(y = p(y = c|x2:D,θ)`\n\n```\nc|θ)∑p(x1,x2:D|y\
  \ = c,θ)\nx1 ∝ ∝\n```\n\n(8.32) 类似地，在判别分析中，无论使用何种正则化方法来估计参数，我们都可以解析地将缺失变量边缘化（见第\
  \ 4.3 节）：`p(x2:D|y = c,θ) = N(x2:D|µc,2:D,Σc,2:D)` (8.33)\n\n##### 8.6.2.2 训练时的缺失信息\n\
  \n训练时的缺失信息更难处理。具体而言，计算 MLE 或 MAP 估计不再是一个简单的优化问题，原因将在第 TODO 节讨论。然而，稍后我们将学习一系列更复杂的算法（如第\
  \ 11.4 节的 EM 算法），用于在这些情况下寻找近似 ML 或 MAP 估计。\n\n#### 8.6.3 费舍尔线性判别分析 (FLDA)\n\n* TODO\n\
  \n## 第 9 章 广义线性模型与指数族\n\n### 9.1 指数族\n\n公式 9.2 可以通过以下写法推广：\n\n在定义指数族之前，我们先注意到它重要的几个原因：\n\
  • 可以证明，在特定正则性条件下，指数族是具有有限充分统计量的唯一分布族，这意味着我们可以将数据压缩成固定大小的摘要而不丢失信息。这对在线学习特别有用，稍后我们将看到。\n\
  • 指数族是存在共轭先验的唯一分布族，这简化了后验的计算（见第 9.1.5 节）。\n• 可以证明指数族是在用户选定约束下使先验假设最少的分布族（见第 9.1.6\
  \ 节）。\n• 指数族是广义线性模型的核心，如第 9.2 节所述。\n• 指数族是变分推断的核心，如第 TODO 节所述。\n\n```\np(x|θ) =\
  \ h(x)exp[η(θ)T ϕ(x)−A(η(θ))] (9.5)\n```\n\n其中 `η` 是一个将参数 `θ` 映射到标准参数 `η = η(θ)`\
  \ 的函数。如果 `dim(θ) < dim(η(θ))`，则称为弯曲指数族，这意味着我们拥有的充分统计量比参数多。如果 `η(θ) = θ`，则称模型为标准形式。除非另有说明，我们将假设模型为标准形式。\n\
  \n#### 9.1.1 定义\n\n对于 `x ∈ Rm` 和 `θ ∈ RD`，如果 pdf 或 pmf `p(x|θ)` 具有以下形式，则称其属于指数族：\n\
  \n```\np(x|θ) = h(x)exp[θT ϕ(x)] (9.1)\nZ(θ)\n```\n\n```\n= h(x)exp[θT ϕ(x)−A(θ)]\
  \ (9.2)\n```\n\n其中\n\n```\n∫\nZ(θ) = h(x)exp[θT ϕ(x)]dx (9.3)\n```\n\n```\nA(θ)\
  \ = log Z(θ) (9.4)\n```\n\n这里 `θ` 称为自然参数或标准参数，`ϕ(x) ∈ RD` 称为充分统计量向量，`Z(θ)` 称为配分函数，`A(θ)`\
  \ 称为对数配分函数或累积生成函数，`h(x)` 是一个缩放常数，通常为 1。如果 `ϕ(x) = x`，我们称其为自然指数族。\n\n#### 9.1.2 示例\n\
  \n##### 9.1.2.1 伯努利分布\n\n`x ∈ {0,1}` 的伯努利分布可以写成指数族形式如下：\n\n```\nBer(x|µ) = µx(1−µ)1−x\
  \ = exp[x log µ + (1−x) log(1−µ)] (9.6)\n```\n\n其中 `ϕ(x) = (I(x = 0), I(x = 1))`\
  \ 且 `θ = (log µ, log(1−µ))`。然而，这种表示是过完备的，因为 `1T ϕ(x) = I(x = 0) + I(x = 1) = 1`。因此\
  \ `θ` 不具有唯一可识别性。通常要求表示是极小的，这意味着存在与该分布相关联的唯一 `θ`。在这种情况下，我们可以简单地定义\n\n```\nBer(x|µ)\
  \ = (1−µ) exp[x log µ/(1−µ)] (9.7)\n```\n\n其中 `ϕ(x) = x`，`θ = log µ/(1−µ)`，`Z =\
  \ 1−µ`。\n\n我们可以使用以下公式从标准参数恢复均值参数 `µ`：\n\n```\nµ = sigm(θ) = 1/(1+e−θ) (9.8)\n```\n\
  \n##### 9.1.2.2 多努利分布\n\n我们可以将多努利分布表示为极小指数族，如下所示：\n\n```\nCat(x|µ) = ∏(K) k=1 exp[∑(K)\
  \ k=1 xk log µk] (9.9)\n```\n\n```\n= exp[∑(K−1) k=1 xk log µk + (1−∑(K−1) k=1 xk)\
  \ log(1−∑(K−1) k=1 µk)]\n```\n\n```\n= exp[∑(K−1) k=1 xk log µk/(1−∑(K−1) k=1 µk)\
  \ + log(1−∑(K−1) k=1 µk)]\n```\n\n```\n= exp[θT ϕ(x)−A(θ)] (9.9)\n```\n\n其中\n\n\
  ```\nθ = (log µ1/µK, ..., log µK−1/µK) (9.10)\n```\n\n```\nϕ(x) = (x1, ..., xK−1)\
  \ (9.11)\n```\n\n我们可以使用以下公式从标准参数恢复均值参数：\n\n```\nµk = eθk / (1+∑(K−1) j=1 eθj) (9.12)\n\
  ```\n\n```\nµK = 1 / (1+∑(K−1) j=1 eθj) (9.13)\n```\n\n因此\n\n```\nA(θ) = −log µK\
  \ = log(1+∑(K−1) j=1 eθj) (9.14)\n```\n\n##### 9.1.2.3 一元高斯分布\n\n一元高斯分布可以写成指数族形式如下：\n\
  \n```\nN(x|µ,σ2) = 1/√(2πσ) exp[−1/(2σ2)(x−µ)2]\n```\n\n```\n= 1/√(2πσ) exp[−1/(2σ2)\
  \ x2 + µ/σ2 x − µ2/(2σ2)]\n```\n\n```\n= 1/Z(θ) exp[θT ϕ(x)] (9.15)\n```\n\n其中\n\
  \n```\nθ = (µ/σ2, −1/(2σ2)) (9.16)\n```\n\n```\nϕ(x) = (x, x2) (9.17)\n```\n\n```\n\
  Z(θ) = √(2πσ) exp[µ2/(2σ2)] (9.18)\n```\n\n##### 9.1.2.4 非示例\n\n并非所有感兴趣的分布都属于指数族。例如，均匀分布\
  \ `X ∼ U(a,b)` 不属于，因为分布的支撑集取决于参数。此外，Student T 分布（见第 TODO 节）也不属于，因为它不具备所需的形式。\n\n\
  #### 9.1.3 对数配分函数\n\n指数族的一个重要性质是，对数配分函数的导数可用于生成充分统计量的累积量。因此，`A(θ)` 有时被称为累积生成函数。我们将针对单参数分布证明这一点；这可以直接推广到\
  \ K 参数分布。\n\n对于一阶导数，我们有\n\n```\ndA/dθ = d/dθ {log ∫ exp[θϕ(x)]h(x)dx}\n= (d/dθ ∫\
  \ exp[θϕ(x)]h(x)dx) / ∫ exp[θϕ(x)]h(x)dx\n= ∫ ϕ(x)exp[θϕ(x)]h(x)dx / exp(A(θ))\n\
  = ∫ ϕ(x)exp[θϕ(x)−A(θ)]h(x)dx\n= ∫ ϕ(x)p(x)dx = E[ϕ(x)] (9.19)\n```\n\n对于二阶导数，我们有\n\
  \n```\nd2A/dθ2 = ∫ [ϕ(x)−A′(θ)] ϕ(x)exp[θϕ(x)−A(θ)]h(x)dx\n= ∫ ϕ2(x)p(x)dx − A′(θ)\
  \ ∫ ϕ(x)p(x)dx\n= E[ϕ2(x)] − E[ϕ(x)]2 = var[ϕ(x)] (9.20)\n```\n\n在多元情况下，我们有\n\n\
  ```\n∂2A/∂θi∂θj = E[ϕ(x)ϕ(x)T] − E[ϕ(x)]E[ϕ(x)]T (9.21)\n```\n\n因此\n\n```\n∇2A(θ)\
  \ = cov[ϕ(x)] (9.22)\n```\n\n由于协方差矩阵是正定的，我们可以看出 `A(θ)` 是一个凸函数（见第 A.1 节）。\n\n####\
  \ 9.1.4 指数族的 MLE\n\n指数族模型的似然函数具有以下形式：\n\n```\np(D|θ) = [∏(N) i=1 h(xi)] g(θ)N exp[θT\
