  \ 27.2 离散数据的分布式状态 LVMs\n\n在本章中，我们关注离散数据的潜变量模型，例如位向量、分类变量序列、计数向量、图结构、关系数据等。这些模型可用于分析投票记录、文本和文档集合、低强度图像、电影评分等。然而，我们将主要关注文本分析，这将反映在我们的术语中。由于我们将处理如此多种类型的数据，我们需要一些精确的符号来保持清晰。在建模分类因子（即图像或标记）的变长序列时，如文档中的单词，我们将让\
  \ `yil {1,· · · ,V}` 表示文档 `i` 中第 l 个词的身份，其中 `V` 是词汇表中潜在单词的数量。我们假设 `l = 1 : Li`，其中\
  \ `Li` 是文档 `I` 的（已知）长度，且 `I = 1 : N`，其中 `N` 是文档的数量。我们将经常忽略词序，从而得到词袋。这可以简化为固定长度的计数向量（直方图）。我们将使用\
  \ `niv {0,1,·· · ,Li}` 来表示单词 `v` 在文档 `I` 中出现的次数，其中 `v = 1 :V`。请注意，`N×V` 计数矩阵 `N`\
  \ 通常很大但稀疏，因为我们通常有许多文档，但大多数单词不会出现在任何给定文档中。有时，我们可能有多个不同的词袋，例如文本词袋和视觉词袋。这些对应于不同的通道或特征类型。我们将用\
  \ `yirl` 表示这些，其中 `r = 1 : R`（响应的数量）和 `l = 1 : Lir`。如果 `Lir = 1`，意味着我们有一个单独的标记（长度为\
  \ 1 的包）；在这种情况下，为简洁起见，我们只写 `yir {1,· · · ,Vr}`。如果每个通道只是一个单独的标记，我们将固定大小的响应向量写为 `yi,1:R`；在这种情况下，`N×R`\
  \ 设计矩阵 `Y` 不会是稀疏的。例如，在社会学研究中，`yir` 可能是个体 `i` 对第 r 个多项选择题的回答。我们的目标是利用潜在变量构建 `p(yi)`\
  \ 或 `p(ni)` 的联合概率模型来捕捉相关性。然后我们将尝试解释潜在变量，它们提供了数据的压缩表示。我们在 27.2 节 TODO 中提供了某些方法的概述，随后在后续章节中详细描述。\n\
  \n## 深度学习\n\n## 附录 A 优化方法\n\n### A.1 凸性\n\n### A.2 梯度下降\n\n**定义 A.1.（凸集）** 我们称集合\
  \ `S` 为凸的，如果对于任意 `x1,x2 ∈ S`，都有 `λx1 + (1− λ)x2 ∈ S, λ ∈ [0,1]` (A.1)\n\n#### A.2.1\
  \ 随机梯度下降\n\n**定义 A.2.（凸函数）** 如果函数 `f(x)` 的超图（函数上方的点集）定义了一个凸集，则称该函数为凸函数。等价地，如果函数\
  \ `f(x)` 定义在一个凸集上，并且对于任意 `x1,x2 ∈ S` 和任意 `λ ∈ [0,1]`，都有 `f(λx1 + (1− λ)x2) ≤ λf(x1)\
  \ + (1− λ)f(x2)` (A.2)，则称该函数为凸函数。\n\n**定义 A.3.** 如果不等式是严格的 `f(λx1 + (1− λ)x2) <\
  \ λf(x1) + (1− λ)f(x2)` (A.3)，则称函数 `f(x)` 为严格凸。\n\n```\ninput : 训练数据 D ={(xi,yi)|i\
  \ = 1 : N}\nyield: 一个线性模型: yi = θTx\nw ← 0; b ← 0; k ← 0;\nwhile no errors made\
  \ inside the for circle do\n  for i ← 1 to N do\n    assuming yi(w·xi + b) ≤ 0,\n\
  \      w ← w + ηyixi;\n      b ← b + ηyi;\n      k ← k + 1;\n    end\n  end\nend\n\
  ```\n\n**算法 5: 随机梯度下降**\n\n**定义 A.4.** 如果 `−f(x)` 是（严格）凸的，则称函数 `f(x)` 为（严格）凹函数。\n\
  \n**定理 A.1.** 如果 `f(x)` 在 `[a,b]` 上二阶可导且 `f''(x) ≥ 0` 在 `[a,b]` 上成立，则 `f(x)` 在 `[a,b]`\
  \ 上是凸的。\n\n#### A.2.2 批量梯度下降\n\n**命题 A.1.** `log(x)` 在 `(0,∞)` 上是严格凹的。\n\n#### A.2.3\
  \ 线搜索\n\n直观上，（严格）凸函数具有碗状形状，因此具有唯一的全局最小值 `x*`，对应于碗底。因此其二阶导数必须处处为正，`d²f(x)/dx² > 0`。一个二阶连续可微的多元函数\
  \ `f` 是凸的，当且仅当其海森矩阵对所有 `x` 都是正定的。在机器学习设置中，函数 `f` 通常对应于 NLL（负对数似然）。NLL 为凸的模型是理想的，因为这意味着我们总能找到全局最优\
  \ MLE（最大似然估计）。我们稍后将在本书中看到许多这方面的例子。然而，许多感兴趣的模型不会具有凸似然。在这种情况下，我们将讨论推导局部最优参数估计的方法。\n\
  \n线搜索方法首先找到一个下降方向，沿该方向真实函数 `f` 会减小，然后计算步长，决定 `x` 沿该方向应移动多远。下降方向可以通过多种技术计算，如梯度下降（第\
  \ A.2 节）、牛顿法（第 A.4 节）和拟牛顿法（第 A.5 节）。步长可以精确或不精确地确定。\n\n1. http://en.wikipedia.org/wiki/Line_search\n\
  \n#### A.2.4 动量项\n\n### A.3 拉格朗日对偶性\n\n#### A.3.1 原始形式\n\n一种优化策略\n\n其思想是用一个近似 `Bk,k`\
