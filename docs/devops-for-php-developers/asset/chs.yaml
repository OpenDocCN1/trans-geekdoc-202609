  \ focal-updates/main amd64 libperl5.30 amd64 5.30.0-9ubuntu0.2 [3,952 kB]\nGet:2\
  \ http://mirrors.digitalocean.com/ubuntu focal-updates/main amd64 perl amd64 5.30.0-9ubuntu0.2\
  \ [224 kB]\nGet:3 http://mirrors.digitalocean.com/ubuntu focal-updates/main amd64\
  \ perl-base amd64 5.30.0-9ubuntu0.2 [1,513 kB]\n...\n...\ndone\n```\n\n## 无人值守升级\n\
  \nDebian/Ubuntu 提供的 [Unattended Upgrades 包](https://help.ubuntu.com/community/AutomaticSecurityUpdates)\
  \ 可用于自动更新系统，可将其视为 Debian 或 Ubuntu 版的 Windows Update。让我们设置它来处理安全更新。该包通常默认已安装，如果缺失，请使用以下命令安装：`apt\
  \ install unattended-upgrades`。\n\n我们现在需要找到并修改 `/etc/apt/apt.conf.d/50unattended-upgrades`\
  \ 以满足我们的要求。目前，我们将仅启用安全更新，但您可以随意调整该文件以满足您的需求。确认 `Unattended-Upgrade::Allowed-Origins`\
  \ 部分具有以下活动配置：\n\n```\nUnattended-Upgrade::Allowed-Origins {\n\"${distro_id}:${distro_codename}\"\
  ;\n\"${distro_id}:${distro_codename}-security\";\n\"${distro_id}ESMApps:${distro_codename}-apps-security\"\
  ;\n\"${distro_id}ESM:${distro_codename}-infra-security\";\n// \"${distro_id}:${distro_codename}-updates\"\
  ;\n// \"${distro_id}:${distro_codename}-proposed\";\n// \"${distro_id}:${distro_codename}-backports\"\
  ;\n};\n```\n\nExtended Security Maintenance (ESM) 源并非在所有版本中都存在，但如果可用将会被使用，因此保留它无妨。\n\
  \n您希望手动更新的所有包都应添加到 `Unattended-Upgrade::Package-Blacklist` 部分。每当运行自动更新时，这些包将被排除在更新之外。这对于有问题的包特别有用。\n\
  \n某些包需要系统重启才能完成安装。您可以允许自动重启，也可以手动重启服务器。\n\n在本例中，我们将允许在 UTC 02:00 左右自动重启。\n\n```\n\
  Unattended-Upgrade::Automatic-Reboot \"true\";\nUnattended-Upgrade::Automatic-Reboot-Time\
  \ \"02:00\";\n```\n\n剩下的就是通过编辑（或创建）apt 配置文件 `/etc/apt/apt.conf.d/20auto-upgrades`\
  \ 来启用无人值守更新，并设置我们希望多久下载一次可升级的包以及多久运行一次自动清理。\n\n```\nAPT::Periodic::Update-Package-Lists\
  \ \"1\";\nAPT::Periodic::Download-Upgradeable-Packages \"1\";\nAPT::Periodic::AutocleanInterval\
  \ \"7\";\nAPT::Periodic::Unattended-Upgrade \"1\";\n```\n\n搞定！我们已完成自动更新的设置。\n\n\
  ### 安装构建工具\n\n我们现在将安装一些稍后从源代码编译其他包所需的包。\n\n```\n### apt install -y build-essential\
  \ g++ gcc unzip\n```\n\n```\nReading package lists... Done\nBuilding dependency\
  \ tree\nReading state information... Done\nThe following additional packages will\
