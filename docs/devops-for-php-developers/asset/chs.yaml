- "# PHP 开发者的 DevOps 指南\n\n\n# 前言\n\n## 本书的设计理念\n\n虽然本书专注于 PHP，但此处描述的技术可应用于任何其他语言或部署，包括但不限于容器发布、Node.js\
  \ 应用程序、Ruby 等。\n\n我们将主要关注完整的 LEMP（Linux Nginx MySQL PHP）服务器，即所有二进制文件均运行在同一台服务器上。根据您的需求，您可以使用专用的\
  \ MySQL 实例，以及一个作为网关的独立 Nginx 实例，您只需修改脚本以匹配您的设置即可。\n\n您可以按任何您喜欢的顺序阅读本书。参考资源均可随时获取，其中部分为开源资源。\n\
  \n所有待执行的 Shell 命令均以前缀 `$` 或 `#` 加一串字符的形式书写，输出将紧随其后，例如：\n\n```\n$ echo 'hello world'\n\
  hello world\n```\n\n## 谁应该阅读本书？\n\n任何软件开发人员或管理员均可阅读本书。本书非常适合自由职业者、初创企业、企业家以及所有从事服务器工作并编写少量代码的人员。\n\
  \n由于本书主要涉及 PHP，您应了解该语言并理解您正在使用的技术栈；无论是 LAMP 还是 LEMP；并对服务器设置、SSH 和终端的使用有少许了解。\n\n\
  ## 责任声明\n\n我已竭尽全力确保书中信息的准确性。\n\n然而，本书所含信息不提供任何担保，无论明示或暗示。作者、经销商或分销商均不对因本书中的说明，或因书中所述软件或服务提供商而直接或间接造成的任何损害承担责任。\n\
  \n## 手动服务器设置\n\n### 寻找合适的服务器\n\n有几家提供商（[DigitalOcean](https://www.digitalocean.com/?refcode=9724e049fc4d)、[Linode\
  \ Cloud](https://www.linode.com/products/standard-linodes/)、[AWS](https://aws.amazon.com/ec2/)、[Vultr](https://www.vultr.com/?ref=7275395)\
  \ 等）提供极具竞争力的价格，从 [Vultr](https://www.vultr.com/?ref=7275395) 的 10GB SSD、1 vCPU 和\
  \ 512 MB RAM 每月 2.5 美元，到 [DigitalOcean](https://www.digitalocean.com/?refcode=9724e049fc4d)\
  \ 的 3,840GB SSD、32 vCPU 和 192GB RAM 每月 960 美元不等。\n\n在我们的案例中，我们将使用 [每月 40 美元的 DigitalOcean\
  \ Droplet（160GB SSD，4](https://cloud.digitalocean.com/droplets/new?size=s-4vcpu-8gb)\n\
  \n\n\n### 创建 Droplet\n\n[vCPUs and 8GB of RAM) running the latest version of Ubuntu,\
  \ 20.04 LTS.](https://cloud.digitalocean.com/droplets/new?size=s-4vcpu-8gb)\n\n\
  123.45.6.78 如果您想要分离服务并拥有 Redis、MySQL、Nginx 和 PHP 服务器，请在“Select additional options”下启用私有网络。这将为\
  \ Droplet 分配私有 IP 地址，用于同一数据中心区域内的服务器间通信。\n\n根据您的需求，增加要创建的 Droplet 数量。在本例中我们仅使用一个。最后，添加您的\
  \ SSH 密钥（[或创建一个](https://docs.github.com/en/free-pro-team@latest/github/authenticating-to-github/generating-a-new-ssh-key-and-adding-it-to-the-ssh-agent)），选择所需的主机名并创建\
  \ Droplet。\n\nDroplet 创建完成后，复制公共 IP 地址，打开终端并通过 SSH 登录服务器：\n\n```\n$ ssh root@123.45.6.78\n\
  ```\n\n```\nThe authenticity of host '123.45.6.78 (123.45.6.78)' can't be established.\n\
