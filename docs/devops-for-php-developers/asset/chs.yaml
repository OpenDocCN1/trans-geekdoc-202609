  ```\n\n我们现在可以选择运行应用程序所需的 PHP 模块集合。提供的这些模块对于大多数应用程序来说是一个很好的起点。\n\n```bash\n### apt\
  \ install -y php-pear php7.4 php7.4-cli php7.4-common php7.4-curl php7.4-dev php7.4-gd\
  \ php7.4-json php7.4-mysql php7.4-opcache php7.4-readline php7.4-sqlite3 php7.4-tidy\
