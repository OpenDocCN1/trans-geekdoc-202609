  \n### 设置 MySQL 服务器\n\n[我个人更倾向于使用 Percona Server](https://www.percona.com/software/mysql-database/percona-server)\
  \ [而非 MySQL Community](https://www.mysql.com/products/community)，因为它是任何 MySQL 数据库的免费、完全兼容、增强且开源的直接替代品。它提供了卓越的性能、可扩展性和检测能力。\n\
  \n由于 Percona Server 不在标准 Ubuntu 仓库中，我们需要添加其源并启用 `ps80` 仓库以使用 MySQL 8。\n\n```\n###\
  \ wget https://repo.percona.com/apt/percona-release_latest.$(lsb_release -sc)_all.deb\n\
  ```\n\n```\n--2020-10-28 06:51:13-- https://repo.percona.com/apt/percona-release_latest.focal_all.deb\n\
  Resolving repo.percona.com (repo.percona.com)... 167.99.233.229, 157.245.119.64,\
  \ 167.71.118.3\nConnecting to repo.percona.com (repo.percona.com)|167.99.233.229|:443...\n\
  connected.\n...\n...\n```\n\n```\n### dpkg -i percona-release_latest.$(lsb_release\
  \ -sc)_all.deb\n```\n\n```\n(Reading database ... 100078 files and directories currently\
  \ installed.)\nPreparing to unpack percona-release_latest.focal_all.deb ...\n...\n\
  ...\n```\n\n```\n### percona-release setup ps80\n```\n\n```\n* Disabling all Percona\
  \ Repositories\n* Enabling the Percona Server 8.0 repository\n* Enabling the Percona\
  \ Tools repository\nGet:1 http://mirrors.digitalocean.com/ubuntu focal InRelease\
  \ [265 kB]\n...\nReading package lists... Done\n```\n\n\n\n### 安装 Percona Server\n\
  \n现在我们可以安装 Percona Server。由于大多数应用程序尚未使用新的 MySQL 认证插件，我们将指示 Percona 使用传统的 MySQL 5.x\
  \ 认证。按照提示操作，为 `root` 用户输入一个安全密码，然后选择原生认证插件。\n\n```bash\n### apt install -y percona-server-server\n\
  ```\n\n...\n\n...\n\n```\nProcessing triggers for man-db (2.9.1-1) ...\nProcessing\
  \ triggers for libc-bin (2.31-0ubuntu9.1) ...\n```\n\n**注意：** 如果你未启用原生认证插件，但现在需要启用，请创建一个新的\
  \ MySQL 配置文件以便在 MySQL 启动时设置它，然后重启 MySQL。我们还将确保 MySQL 在系统启动时自动运行。\n\n```bash\n###\
  \ echo -e \"[mysqld]\ndefault-authentication-plugin = mysql_native_password\" >\
  \ /etc/mysql/mysql.conf.d/default-auth-override.cnf\n### service mysql restart\n\
  ### systemctl enable mysql\n```\n\n接下来，让我们运行 MySQL 提供的脚本以提高安装的安全性。\n\n```bash\n\
  ### mysql_secure_installation\n```\n\n最后，我们可以清理并删除下载的文件：\n\n```bash\n### rm percona-release_latest.$(lsb_release\
  \ -sc)_all.deb\n```\n\n大功告成！\n\n### 设置 PHP 7.4\n\n编写本文时，PHP 的最新版本是 7.4。请根据你感兴趣的版本进行调整。让我们使用\
  \ [Ondrej's PPA](https://launchpad.net/~ondrej/+archive/ubuntu/php) 来设置我们的 PHP 7.4\
