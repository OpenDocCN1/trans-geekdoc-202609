- raw: "/var/log/nginx directory to match the created user account Good! It’s a great\
    \ practise to have your sites served over HTTPS, and to make your encryption even\
    \ stronger, we shall add a couple of things. First, let’s generate our secure\
    \ [Diffie-Hellman (DH)](https://en.wikipedia.org/wiki/Diffie%E2%80%93Hellman_key_exchange)\
    \ parameters of 4096 bit field primes. This process takes a while depending on\
    \ your server resources. Let’s specify the location to save the file under our\
    \ nginx/defaults/mail.yml file:\n\n76\n\n\\# defaults/main.yml\n\nnginx\\_dhparam\\\
    _location: \"/etc/ssl/certs/dhparam.pem\"\n\nand add the task that will generate\
    \ it to nginx/tasks/configure.yml:\n\n\\- name: Generate 4096 bit DH Params\n\n\
    community.crypto.openssl\\_dhparam:\n\npath: \"{{ nginx\\_dhparam\\_location }}\"\
    \n\nsize: 4096\n\nmode: 0666\n\nIn the task above, we use the community.crypto.openssl\\\
    _dhparam module which is a community module that is not available in the default\
    \ ansible modules. We will need to install the [Community Crypto Collection](https://github.com/ansible-collections/community.crypto)\n\
    \nwhich includes a lot of other goodies. To install run:\n\n$ ansible-galaxy collection\
    \ install community.crypto\n\nLet’s add the nginx/templates/ssl-params.conf.j2\
    \ template that will be used to configure our SSL params. This file should be\
    \ included within each server block that will be using HTTPS.\n\n77\n\n\\## Use\
    \ per block. ssl-params\n\nssl\\_protocols TLSv1.2 TLSv1.3;\n\nssl\\_prefer\\\
    _server\\_ciphers on;\n\nssl\\_ciphers \"EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH\"\
    ; ssl\\_ecdh\\_curve secp384r1;\n\nssl\\_session\\_timeout 60m;\n\nssl\\_session\\\
    _cache shared:SSL:10m;\n\nssl\\_session\\_tickets off;\n\nssl\\_stapling on;\n\
    \nssl\\_stapling\\_verify on;\n\nresolver {{ nginx\\_dns\\_ip\\_1 }} {{ nginx\\\
    _dns\\_ip\\_2 }} valid=300s; resolver\\_timeout 5s;\n\n{% if nginx\\_enable\\\
    _strict\\_transport\\_security\\_header %}\n\nadd\\_header Strict-Transport-Security\
    \ \"max-age={{ nginx\\_hsts\\_max\\_age }};{% if nginx\\_hsts\\_include\\_subdomains\
    \ %}includeSubdomains;{% endif %}{% if nginx\\_hsts\\_preload %} preload;{% endif\
    \ %} \";\n\n{% endif %}\n\n{% for option in nginx\\_xframe\\_options %}\n\nadd\\\
    _header X-Frame-Options {{ option }};\n\n{% endfor %}\n\nadd\\_header X-Content-Type-Options\
    \ nosniff;\n\nadd\\_header X-Robots-Tag {{ nginx\\_x\\_robots\\_tag }};\n\nssl\\\
    _dhparam {{ nginx\\_dhparam\\_location }};\n\nAnd the default variables that go\
    \ with it:\n\n78\n\nnginx\\_dns\\_ip\\_1: \"8.8.8.8\"\n\nnginx\\_dns\\_ip\\_2:\
    \ \"8.8.4.4\"\n\nnginx\\_enable\\_strict\\_transport\\_security\\_header: true\n\
    \nnginx\\_hsts\\_max\\_age: \"63072000\"\n\nnginx\\_hsts\\_preload: false\n\n\
    nginx\\_hsts\\_include\\_subdomains: true\n\nnginx\\_xframe\\_options:\n\n\\-\
    \ \"SAMEORIGIN\"\n\nnginx\\_x\\_robots\\_tag: \"none\" #\n\nhttps://developers.google.com/search/reference/robots\\\
    _meta\\_tag So far so good! If you have a look at the ssl-params.conf.j2 file,\
    \ we are setting some nginx parameters. We’ve dropped all other protocols except\
    \ TLS 1.2 and TLS 1.3 since they are considered unsafe. The enabled ssl\\_ciphers\
    \ are also regarded as the best. You can read more on that at\n\n[Mozilla Foundation.](https://wiki.mozilla.org/Security/Server_Side_TLS)\n\
    \nThe ssl\\_dhparam and ssl\\_ecdh\\_curve are used for forward security whereby\
    \ the client and server negotiate a pre-master key that is: specific to the connection\
    \ between them,\n\nused only for a limited amount of time, and\n\ndestroyed at\
    \ the end of the session thus, it's called Ephemeral.\n\nWe use these configuration\
    \ options to instruct nginx to use the generated DH\n\nParameters it for DHE key-exchange.\n\
    \n[Instructions can be sent to all modern browsers via headers. We use the HTTP](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security)\n\
    \n[Strict Transport Security Header](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security)\
    \ to instruct the browsers that are connecting to the server to only communicate\
    \ via HTTPS. When HTTPS is not available, the browsers cannot connect, keeping\
    \ your clients secure.\n\nJust like the HSTS Header, we have the [Frame-Options](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options)\
    \ header which directs browsers how to handle your site when it comes to viewing\
    \ it via the\n\n<frame>, <iframe>, <embed> and <object> tags. This is an easy\
    \ way of dealing with [Clickjacking](https://en.wikipedia.org/wiki/Clickjacking).\n\
    \n[We have the Content-Type-Options Header](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options)\
    \ that instructs the clients that the mime type that has been set by the server\
    \ is the correct one and should not 79\n\nbe changed.\n\nWe can now add the task\
    \ that will handle the creation of the snippets directory if it doesn't exist,\
    \ and deploy of the template. Edit nginx/tasks/configure.yml and append:\n\n\\\
    - name: Validate the snippets directory exist\n\nfile:\n\npath: /etc/nginx/snippets\n\
    \nstate: directory\n\nowner: root\n\ngroup: root\n\n\\- name: Deploy the ssl-snippet\n\
    \ntemplate:\n\ndest: /etc/nginx/snippets/ssl-params.conf\n\nsrc: ssl-params.conf.j2\n\
    \nowner: root\n\ngroup: root\n\nmode: 0644\n\nNow comes the default server block\
    \ template. When HTTPS is enabled, it will use the SSL snippet we created, and\
    \ an extra snippet that will direct nginx where our certificates are. In our case,\
    \ we have not set up a domain, or the SSL Certificates. Create the nginx/templates/ssl-default.conf.j2\
    \ file that houses the certificate paths. Update it as needed.\n\nssl\\_certificate\
    \ /etc/letsencrypt/live/domain.example.com/fullchain.pem; ssl\\_certificate\\\
    _key /etc/letsencrypt/live/domain.example.com/privkey.pem; The default server\
    \ block will include two extra location blocks that can be used to monitor PHP\
    \ and Nginx. The first block is the PHP status and ping location block which will\
    \ forward the request to PHP-FPM which will then output the status of the FPM\
    \ pool and give ping responses for health checks.\n\nThe second block is for the\
    \ Nginx status. These two block are useful when you need to attach some metrics\
    \ to the server.\n\nLet’s add the default variables that will be used by our server\
    \ blocks to nginx/defaults/main.yml:\n\n80\n\nnginx\\_default\\_server\\_root:\
    \ \"/var/www/app/current/public\"\n\nnginx\\_default\\_server\\_name: \"\\_\"\n\
    \nnginx\\_default\\_enable\\_https: false\n\nAnd the default server block template\
    \ file, nginx/templates/default.j2: server {\n\nlisten 80 default\\_server;\n\n\
    listen \\[::\\]:80 default\\_server;\n\n{% if nginx\\_default\\_enable\\_https\
    \ %}\n\nlisten 443 ssl http2 default\\_server;\n\nlisten \\[::\\]:443 ssl http2\
    \ default\\_server;\n\ninclude snippets/ssl-params.conf;\n\ninclude snippets/ssl-default.conf;\n\
    \n{% endif %}\n\nroot {{ nginx\\_default\\_server\\_root }};\n\nindex index.php\
    \ index.html index.htm index.nginx-debian.html; server\\_name {{ nginx\\_default\\\
    _server\\_name }};\n\nlocation / {\n\ntry\\_files $uri $uri/ /index.php?$query\\\
    _string;\n\n}\n\nlocation ~ \\\\.php$ {\n\ninclude snippets/fastcgi-php.conf;\n\
    \nfastcgi\\_pass unix:/run/php/php{{ php\\_version }}-fpm.sock;\n\n}\n\nlocation\
    \ ~ /\\\\.ht {\n\ndeny all;\n\n}\n\nlocation ~ ^/(php\\_status|php\\_ping)$ {\n\
    \naccess\\_log off;\n\nfastcgi\\_param SCRIPT\\_FILENAME $fastcgi\\_script\\_name;\n\
    \ninclude fastcgi\\_params;\n\nfastcgi\\_pass unix:/run/php/php{{ php\\_version\
    \ }}-fpm.sock;\n\nallow 127.0.0.1;\n\ndeny all;\n\n}\n\n81\n\n location /nginx\\\
    _status {\n\nstub\\_status on;\n\naccess\\_log off;\n\nallow 127.0.0.1;\n\ndeny\
    \ all;\n\n}\n\n}\n\nNotice: The access to /php\\_status, php\\_ping and nginx\\\
    _status is limited to localhost as described by the allow 127.0.0.1 directive.\n\
    \nWe can now add the task that will deploy the server block to nginx/tasks/configure.yml\n\
    \n\\- name: Validate the default server root directory exist\n\nfile:\n\npath:\
    \ \"{{ nginx\\_default\\_server\\_root }}\"\n\nstate: directory\n\nowner: www-data\n\
    \ngroup: www-data\n\n\\- name: Deploy the default server block\n\ntemplate:\n\n\
    dest: /etc/nginx/sites-available/default\n\nsrc: default.j2\n\nowner: root\n\n\
    group: root\n\nmode: 0644\n\nnotify: restart nginx"
  fmt: "\n# Nginx 配置与 SSL 安全加固\n\n## 生成 Diffie-Hellman 参数\n\n进入 `/var/log/nginx` 目录以匹配创建的用户账户。\n\
    \n为了通过 HTTPS 提供站点服务并增强加密强度，我们需要添加一些配置。首先，让我们生成 4096 位素数字段的安全 **Diffie-Hellman\
    \ (DH)** 参数。此过程耗时取决于服务器资源。\n\n在 `nginx/defaults/mail.yml` 文件中指定保存文件的位置：\n\n```yaml\n\
    # defaults/main.yml\nnginx_dhparam_location: \"/etc/ssl/certs/dhparam.pem\"\n\
    ```\n\n在 `nginx/tasks/configure.yml` 中添加生成任务：\n\n```yaml\n- name: Generate 4096\
    \ bit DH Params\n  community.crypto.openssl_dhparam:\n    path: \"{{ nginx_dhparam_location\
    \ }}\"\n    size: 4096\n    mode: 0666\n```\n\n上述任务使用了 `community.crypto.openssl_dhparam`\
    \ 模块，这是一个社区模块，不在默认 Ansible 模块中。我们需要安装 **Community Crypto Collection**（包含许多其他实用工具）：\n\
    \n```bash\n$ ansible-galaxy collection install community.crypto\n```\n\n## 配置\
    \ SSL 参数模板\n\n添加 `nginx/templates/ssl-params.conf.j2` 模板，用于配置 SSL 参数。此文件应包含在每个使用\
    \ HTTPS 的 `server` 块中。\n\n```nginx\n## Use per block. ssl-params\n\nssl_protocols\
    \ TLSv1.2 TLSv1.3;\nssl_prefer_server_ciphers on;\nssl_ciphers \"EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH\"\
    ;\nssl_ecdh_curve secp384r1;\nssl_session_timeout 60m;\nssl_session_cache shared:SSL:10m;\n\
    ssl_session_tickets off;\nssl_stapling on;\nssl_stapling_verify on;\nresolver\
    \ {{ nginx_dns_ip_1 }} {{ nginx_dns_ip_2 }} valid=300s;\nresolver_timeout 5s;\n\
    \n{% if nginx_enable_strict_transport_security_header %}\nadd_header Strict-Transport-Security\
    \ \"max-age={{ nginx_hsts_max_age }}{% if nginx_hsts_include_subdomains %};includeSubdomains{%\
    \ endif %}{% if nginx_hsts_preload %};preload{% endif %}\";\n{% endif %}\n\n{%\
    \ for option in nginx_xframe_options %}\nadd_header X-Frame-Options {{ option\
    \ }};\n{% endfor %}\n\nadd_header X-Content-Type-Options nosniff;\nadd_header\
    \ X-Robots-Tag {{ nginx_x_robots_tag }};\nssl_dhparam {{ nginx_dhparam_location\
    \ }};\n```\n\n配套的默认变量如下：\n\n```yaml\nnginx_dns_ip_1: \"8.8.8.8\"\nnginx_dns_ip_2:\
    \ \"8.8.4.4\"\nnginx_enable_strict_transport_security_header: true\nnginx_hsts_max_age:\
    \ \"63072000\"\nnginx_hsts_preload: false\nnginx_hsts_include_subdomains: true\n\
    nginx_xframe_options:\n  - \"SAMEORIGIN\"\nnginx_x_robots_tag: \"none\" # https://developers.google.com/search/reference/robots_meta_tag\n\
    ```\n\n### SSL 配置说明\n\n查看 `ssl-params.conf.j2` 文件，我们设置了一些 Nginx 参数：\n\n- 仅保留 TLS\
    \ 1.2 和 TLS 1.3 协议，其它协议被认为不安全。\n- 启用的 `ssl_ciphers` 被公认为最佳配置，详情请参考 [Mozilla Foundation](https://wiki.mozilla.org/Security/Server_Side_TLS)。\n\
    - `ssl_dhparam` 和 `ssl_ecdh_curve` 用于前向保密：客户端和服务器协商一个特定于连接的预主密钥，仅在有限时间内使用，会话结束即销毁（因此称为\
    \ Ephemeral）。我们使用这些选项指示 Nginx 使用生成的 DH 参数进行 DHE 密钥交换。\n- 通过 **HTTP Strict Transport\
    \ Security (HSTS)** 头指示现代浏览器仅通过 HTTPS 通信；若 HTTPS 不可用则拒绝连接，保障客户端安全。详见 [MDN 文档](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security)。\n\
    - **X-Frame-Options** 头指导浏览器如何在 `<frame>`、`<iframe>`、`<embed>` 和 `<object>` 标签中展示站点，可有效防范\
    \ [Clickjacking](https://en.wikipedia.org/wiki/Clickjacking)。详见 [MDN 文档](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options)。\n\
    - **X-Content-Type-Options** 头指示客户端服务器设置的 MIME 类型为准，不得更改。详见 [MDN 文档](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options)。\n\
    \n## 部署 SSL 片段\n\n编辑 `nginx/tasks/configure.yml`，追加以下任务以创建 snippets 目录并部署模板：\n\
    \n```yaml\n- name: Validate the snippets directory exist\n  file:\n    path: /etc/nginx/snippets\n\
    \    state: directory\n    owner: root\n    group: root\n\n- name: Deploy the\
    \ ssl-snippet\n  template:\n    dest: /etc/nginx/snippets/ssl-params.conf\n  \
    \  src: ssl-params.conf.j2\n    owner: root\n    group: root\n    mode: 0644\n\
    ```\n\n## 默认 Server 块模板\n\n启用 HTTPS 时，默认 server 块将引用上述 SSL 片段及证书路径片段。由于暂未配置域名和\
    \ SSL 证书，请创建 `nginx/templates/ssl-default.conf.j2` 并根据实际情况更新：\n\n```nginx\nssl_certificate\
    \ /etc/letsencrypt/live/domain.example.com/fullchain.pem;\nssl_certificate_key\
    \ /etc/letsencrypt/live/domain.example.com/privkey.pem;\n```\n\n默认 server 块还包含两个额外的\
    \ `location` 块，用于监控 PHP 和 Nginx 状态：\n\n1. **PHP status/ping**：将请求转发给 PHP-FPM，输出\
    \ FPM 池状态并提供健康检查 ping 响应。\n2. **Nginx status**：提供 Nginx 状态指标。\n\n这两个块在需要采集服务器指标时非常有用。\n\
    \n### 默认变量\n\n在 `nginx/defaults/main.yml` 中添加：\n\n```yaml\nnginx_default_server_root:\
    \ \"/var/www/app/current/public\"\nnginx_default_server_name: \"_\"\nnginx_default_enable_https:\
    \ false\n```\n\n### 默认 Server 块模板文件 `nginx/templates/default.j2`\n\n```nginx\n\
    server {\n    listen 80 default_server;\n    listen [::]:80 default_server;\n\n\
    \    {% if nginx_default_enable_https %}\n    listen 443 ssl http2 default_server;\n\
    \    listen [::]:443 ssl http2 default_server;\n    include snippets/ssl-params.conf;\n\
    \    include snippets/ssl-default.conf;\n    {% endif %}\n\n    root {{ nginx_default_server_root\
    \ }};\n    index index.php index.html index.htm index.nginx-debian.html;\n   \
    \ server_name {{ nginx_default_server_name }};\n\n    location / {\n        try_files\
    \ $uri $uri/ /index.php?$query_string;\n    }\n\n    location ~ \\.php$ {\n  \
    \      include snippets/fastcgi-php.conf;\n        fastcgi_pass unix:/run/php/php{{\
    \ php_version }}-fpm.sock;\n    }\n\n    location ~ /\\.(ht) {\n        deny all;\n\
    \    }\n\n    location ~ ^/(php_status|php_ping)$ {\n        access_log off;\n\
    \        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;\n        include\
    \ fastcgi_params;\n        fastcgi_pass unix:/run/php/php{{ php_version }}-fpm.sock;\n\
    \        allow 127.0.0.1;\n        deny all;\n    }\n\n    location /nginx_status\
    \ {\n        stub_status on;\n        access_log off;\n        allow 127.0.0.1;\n\
    \        deny all;\n    }\n}\n```\n\n> **注意**：`/php_status`、`/php_ping` 和 `/nginx_status`\
    \ 的访问仅限本地回环地址（由 `allow 127.0.0.1` 指令限制）。\n\n## 部署默认 Server 块\n\n在 `nginx/tasks/configure.yml`\
    \ 中追加部署任务：\n\n```yaml\n- name: Validate the default server root directory exist\n\
    \  file:\n    path: \"{{ nginx_default_server_root }}\"\n    state: directory\n\
    \    owner: www-data\n    group: www-data\n\n- name: Deploy the default server\
    \ block\n  template:\n    dest: /etc/nginx/sites-available/default\n    src: default.j2\n\
    \    owner: root\n    group: root\n    mode: 0644\n  notify: restart nginx\n```\n"
