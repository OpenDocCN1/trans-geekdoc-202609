    \  * @return Response\n     */\n    public function destroy(Post $post)\n    {\n\
    \        $post->delete();\n\n        return redirect()->route('posts.index');\n\
    \    }\n}\n```\n\n### Post Test\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\
    \nuse App\\Models\\Post;\nuse Illuminate\\Foundation\\Testing\\RefreshDatabase;\n\
    use Tests\\TestCase;\n\nclass PostTest extends TestCase\n{\n    use RefreshDatabase;\n\
    \n    /**\n     * @return void\n     */\n    public function testCanCreatePost():\
    \ void\n    {\n        $post = Post::factory()->raw();\n\n        $this->assertEquals(0,\
    \ Post::count());\n\n        $this->withExceptionHandling()\n            ->post(route('posts.store'),\
    \ [])\n            ->assertSessionHasErrors(['content']);\n\n        $this->assertEquals(0,\
    \ Post::count());\n\n        $this->withoutExceptionHandling()\n            ->followingRedirects()\n\
    \            ->post(route('posts.store'), $post)\n            ->assertSuccessful();\n\
    \n        $this->assertDatabaseHas('posts', ['content' => $post['content']]);\n\
    \    }\n\n    /**\n     * @return void\n     */\n    public function testCanEditPosts():\
    \ void\n    {\n        $post = Post::factory()->create();\n\n        $this->withExceptionHandling()\n\
    \            ->put(route('posts.update', ['post' => $post]), [])\n           \
    \ ->assertSessionHasErrors(['content']);\n\n        $this->assertDatabaseHas('posts',\
    \ [\n            'id' => $post->id,\n            'content' => $post->content,\n\
    \        ]);\n\n        $postUpdate = Post::factory()->raw();\n\n        $this->withoutExceptionHandling()\n\
    \            ->followingRedirects()\n            ->put(route('posts.update', ['post'\
    \ => $post]), $postUpdate)\n            ->assertSuccessful();\n\n        $this->assertDatabaseHas('posts',\
    \ [\n            'id' => $post->id,\n            'content' => $postUpdate['content'],\n\
    \        ]);\n    }\n\n    /**\n     * @return void\n     */\n    public function\
    \ testCanDeletePosts(): void\n    {\n        $post = Post::factory()->create();\n\
    \n        $this->withoutExceptionHandling()\n            ->followingRedirects()\n\
    \            ->delete(route('posts.destroy', ['post' => $post]))\n           \
    \ ->assertSuccessful();\n\n        $this->assertDatabaseMissing('posts', [\n \
    \           'id' => $post->id,\n            'content' => $post->content,\n   \
    \     ]);\n    }\n}\n```\n\n# 使用 GitLab CI/CD 进行自动化测试\n\n我们已成功创建测试并在本地运行。现在我们要创建一个流水线，为每次推送到\
    \ [GitLab](https://gitlab.com/) 的提交处理代码测试。如果失败，我们将收到邮件通知；如果是合并请求，它会警告你流水线失败。通过这种设置，我们可以确保部署到生产环境的代码是稳定的。\n\
    \n我们需要构建一个包含运行 Laravel 代码所需所有依赖的 Docker 镜像，并尽最大努力保持环境一致性。\n\n## 开始使用 Docker\n\n\
    请遵循你所用平台的 Docker 安装及安装后说明：[Linux](https://docs.docker.com/install/linux/docker-ce/ubuntu/)、[Mac](https://docs.docker.com/docker-for-mac/install/)、[Windows](https://docs.docker.com/docker-for-windows/install/)。完成后，我们可以开始构建\
    \ Docker 镜像。\n\n## 构建与发布 Docker 镜像\n\n我们将尝试使 Docker 镜像尽可能接近服务器环境。我们将使用 Docker\
    \ 提供的官方 [Ubuntu 20.04 镜像](https://hub.docker.com/_/ubuntu)，并在其中添加我们的二进制文件和服务。由于服务器使用\
    \ PHP 7.4，我们在 Docker 镜像中也将使用相同版本。这些镜像仅包含运行所需的最基本组件，因此文件体积较小。\n\n首先，在项目根目录下的 `docker`\
    \ 目录中创建 `Dockerfile`。\n\n```bash\nmkdir docker\ncd docker\ntouch Dockerfile\n\
    ```\n\n打开 `Dockerfile` 并使用 [`FROM` 指令](https://docs.docker.com/engine/reference/builder/#from)\
    \ 指示 Docker 我们将使用基础镜像。然后我们将安装一些系统包、PHP 包，启用 PHP 包，最后[安装 Composer 和 Laravel Envoy](https://laravel.com/docs/envoy)。\n"
