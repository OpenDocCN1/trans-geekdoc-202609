    \ 方便地包含了一个 [RefreshDatabase trait](https://laravel.com/docs/8.x/database-testing#resetting-the-database-after-each-test)\
    \ 来为我们完成此操作。\n\n```php\n<?php\n\nnamespace Tests\\Feature;\n\nuse Illuminate\\\
