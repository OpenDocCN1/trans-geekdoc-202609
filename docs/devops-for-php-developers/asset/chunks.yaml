    However, the information contained in this book is sold without warranty, either
    express or implied. Neither the author, nor the dealers or distributors will be
    held liable for any damages caused either directly or indirectly by the instructions
    contained in this book, or by the software or service providers described herein.


    7


    Manual Server Setup


    8


    Finding the Right Server


    There are a couple of providers ([DigitalOcean](https://www.digitalocean.com/?refcode=9724e049fc4d),
    [Linode Cloud](https://www.linode.com/products/standard-linodes/)[, AWS](https://aws.amazon.com/ec2/)[,
    Vultr](https://www.vultr.com/?ref=7275395) etc.) with competitive pricing ranging
    from $2.5/month for a 10GB SSD, 1 vCPU


    and 512 MB RAM on [Vultr](https://www.vultr.com/?ref=7275395) to a $960/month
    for a 3,840GB SSD, 32 vCPUs and 192GB RAM on [DigitalOcean.](https://www.digitalocean.com/?refcode=9724e049fc4d)


    In our case, we shall use the [$40/month DigitalOcean Droplet (160GB SSD, 4](https://cloud.digitalocean.com/droplets/new?size=s-4vcpu-8gb)'
