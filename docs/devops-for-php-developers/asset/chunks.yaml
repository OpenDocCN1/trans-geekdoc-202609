    \ acl\n  - unattended-upgrades\n  - ufw\n```\n\n切回到 `pre_setup` 子任务，并添加安装所需软件包的任务。\n\
    \n---\n\n## pre_setup 任务\n\n```yaml\n- name: Update the system\n  apt:\n    update_cache:\
    \ yes\n    cache_valid_time: 86400\n    upgrade: 'dist'\n\n- name: Install packages\n\
