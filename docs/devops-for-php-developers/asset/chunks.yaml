    \ 分支上运行，且需手动触发。这将防止代码自动部署到服务器。\n\n> **注意**：为了获得最佳的 Pipeline 体验，我建议保护 `master`\
    \ 分支免受直接提交，并通过移除配置中的 `when: manual` 部分来自动运行部署。合并请求创建后，测试将运行。一旦合并到 `master`，将自动部署到服务器。\n\
