    \ test is successful\n\n# service nginx restart\n```\n\nWe can now add a php info\
    \ script that allows us to check our installation.\n\n```\n# echo -e \"<?php\\\
    nphpinfo();\" > /var/www/html/info.php\n```\n\nThat was tedious! Imagine performing\
    \ all these steps to setup ten servers!\n\nThe best thing is that we have Ansible\
    \ to help us with automation! Open your favourite browser and navigate to `http://your.ip.over.here/info.php`\
    \ and confirm that the php info page loaded.\n\n## What is Ansible?\n\n[Ansible](https://www.ansible.com/)\
    \ is a platform by Red Hat that has endless automation uses which allows performing\
    \ actions in multiple servers at the same time. Ansible uses YAML Language for\
    \ its files and depends on the SSH protocol to manage the machines.\n\nOnce Ansible\
    \ is installed, it will not add a database, and there will be no daemons to start\
    \ or keep running. You only need to install it on one machine (which could easily\
    \ be a laptop), and it can manage an entire fleet of remote machines from that\
    \ central point. When Ansible manages remote machines, it does not leave software\
    \ installed or running on them, so there’s no real question about how to upgrade\
    \ Ansible when moving to a new version. If you would like to contribute to the\
    \ project, you can have a look at [GitHub](https://github.com/ansible/ansible).\n\
    \n## Setting up Ansible\n\nFor you to run Ansible, you need a machine running\
    \ any version of unix, be it Red Hat, Debian, CentOS, macOS, Ubuntu and its flavours\
    \ and many more.\n\nMicrosoft Windows is currently not supported. Depending on\
    \ your local distro, install ansible using your package manager. Ansible is also\
    \ available via Python pip.\n\n### Fedora\n\n```\n$ sudo dnf install ansible\n\
    ```\n\n### CentOS\n\n```\n$ sudo yum install ansible\n```\n\n### Ubuntu\n\n```\n\
    $ sudo apt update && sudo apt install -y software-properties-common\n$ sudo apt-add-repository\
    \ --yes --update ppa:ansible/ansible\n$ sudo apt install ansible\n```\n\n### Local\
    \ single user installation on macOS or any other system\n\n```\n$ pip install\
    \ --user ansible\n```\n\n### System wide installation on macOS or any other system\n\
    \n```\n$ sudo pip install ansible\n```\n\nWe’re set! When Ansible is making remote\
    \ connections, it will use the native SSH service and assumes that you are using\
    \ SSH keys. It is always advised to use SSH keys over plain password authentication.\
    \ If you already have a running server but you have not setup passwordless authentication,\
    \ you can easily copy your public SSH key using `ssh-copy-id` on your local machine.\n\
    \nSubstitute the server IP address (and the user if you want passwordless authentication\
    \ for a different user) in the command below.\n\n```\n$ ssh-copy-id root@123.45.6.78\n\
    ```\n\nNow we’ve installed Ansible. We need a fresh server with nothing installed\
    \ so that we can automate the manual process we completed in the previous section.\
    \ Once we spin up a new droplet from Digital Ocean (or any other provider, or\
    \ a local server), we can start playing around with Ansible. Make an ansible directory\
    \ somewhere awesome on your local machine. In our case, we will use `~/devops`.\n\
    \n## Ansible Inventory\n\nAnsible allows us to list our server IP addresses in\
    \ [different formats](https://docs.ansible.com/ansible/latest/plugins/inventory.html#inventory-plugins).\
    \ Let’s use both INI and YAML formats to explain the difference. Inside the new\
    \ directory, create two new files; `hosts` and `hosts.yml`; to keep an [inventory](https://docs.ansible.com/ansible/latest/user_guide/intro_inventory.html)\
    \ of all our server IP addresses. Since we have not setup another user for our\
    \ servers, we shall use the root user. We can also give each of our servers names\
    \ and group them as per our needs.\n\n```\n$ cat hosts\n# your server ip addresses\n\
    1.x.x.x\n2.x.x.x\n\n[databases]\n3.y.y.y\n4.y.y.y\n\n[php]\nserver ansible_host=5.z.z.z\n\
    worker ansible_host=6.z.z.z ansible_port=8888\n```\n\nIn the INI file above the:\n\
    \n*   `x.x.x` addresses are only in the `all` and `ungrouped` groups,\n*   `y.y.y`\
    \ in the `databases` group and,\n*   `z.z.z` in the `php` group.\n\nThe two PHP\
    \ server groups have aliases (`server` and `worker`) which can be used when you\
    \ explicitly want to target either of the two servers. The `worker` server also\
    \ has a custom SSH port `8888` which must be defined using the `ansible_port`\
    \ variable.\n\nThe YAML equivalent of the INI above is:\n\n```\n$ cat hosts.yml\n\
    # your server ip addresses\nall:\n  hosts:\n    1.x.x.x:\n    2.x.x.x:\n  children:\n\
    \    databases:\n      hosts:\n        3.y.y.y:\n        4.y.y.y:\n    php:\n\
    \      hosts:\n        server:\n          ansible_host: 5.z.z.z\n        worker:\n\
    \          ansible_host: 6.z.z.z\n          ansible_port: 8888\n```\n\nFor the\
    \ Ansible hosts, the colon at the end of each list item is required when the hosts\
    \ are more than one thus, it’s always advised to keep the colon with or without\
    \ multiple hosts. To test our inventory, ping any of the listed servers using\
    \ the ansible [ping module](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/ping_module.html):\n\
    \n```\n$ ansible all -i hosts -m ping\n$ ansible all -i hosts.yml -m ping\n$ ansible\
    \ databases -i hosts -m ping\n$ ansible databases -i hosts.yml -m ping\n$ ansible\
    \ worker -i hosts -m ping\n$ ansible worker -i hosts.yml -m ping\n```\n\n```\n\
    ...\n6.z.z.z | SUCCESS => {\n    \"ansible_facts\": {\n        \"discovered_interpreter_python\"\
    : \"/usr/bin/python3\"\n    },\n    \"changed\": false,\n    \"ping\": \"pong\"\
    \n}\n```\n\n## YAML Basics\n\nThe YAML syntax is pretty straight forward. We’ll\
    \ go through a few basics before having a look at playbooks.\n\nAs a common convention,\
    \ Ansible files can begin with `---` and end with `...` denoting the start and\
    \ end of the document. Most files will only include the beginning marker. Comments\
    \ are defined by the `#` character.\n\nLists are very common in Ansible and are\
    \ defined by using `-` (hyphen) followed by a space.\n\n```\n---\n- php\n- vue\n\
    - react\n```\n\nDictionaries are key: value pairs in which the colon must always\
    \ be followed by a space.\n\n```\nphp:\n  latest: 7.3\n  Installed: 7.3\n```\n\
    \nIn the case that you have a line that is too long, it can be wrapped using the\
    \ Literal Block Scalar character `|` (pipe character), or the Folded Block Scalar\
    \ character `>` (greater than character). The Literal Block Scalar character will\
    \ render the input as typed, literally including the new lines and any additional\
    \ spaces while the Folded Block Scalar character will convert the new lines into\
    \ spaces. New lines can be enforced by either indenting the line or adding an\
    \ extra empty line.\n\n```\n# Literal\nexact_hello_world_template: |\n  this is\n\
    \  the\n  hello world template\n\n# same as:\n# this is\\nthe\\nwrapped\\nhello\
    \ world template\n\n# Folded\nwrapped_hello_world_template: >\n  this is\n  the\n\
    \  wrapped\n  hello world template\n\n# same as:\n# this is the wrapped\\nhello\
    \ world template\n```\n\nNotice: In case your strings contain a colon or a `#`,\
    \ you will need to quote them as YAML will expect a mapping when a colon is followed\
    \ by a space i.e. `John Doe: Look for him`. Anything after the `#` will be regarded\
    \ as a comment.\n\n## Ansible Playbooks\n\nPlaybooks are Ansible’s configuration,\
    \ deployment, and orchestration language. They can describe a policy you want\
    \ your remote systems to enforce, or a set of steps in a general IT process and\
    \ in our case, how we want our servers to be setup.\n"
  trans: "\n\n# 使用 Ansible 实现服务器自动化设置\n\n## Nginx 的 PHP-FPM 配置\n\n我们还将添加一个新的 location\
    \ 块，并使用正则表达式匹配所有以 `.php` 结尾的文件，将它们发送给正在运行的 PHP-FPM 进程。\n\n```\n# vi /etc/nginx/sites-available/default\n\
    \nroot /var/www/html;\n\nindex index.php index.html index.htm index.nginx-debian.html;\n\
    server_name _;\n\nlocation / {\n    try_files $uri $uri/ =404;\n}\n\nlocation\
    \ ~ \\.php$ {\n    include snippets/fastcgi-php.conf;\n    fastcgi_pass unix:/run/php/php7.4-fpm.sock;\n\
    }\n```\n\n完成后，保存文件，测试确认其正确且无错误，然后重启 nginx 以使新配置生效。\n\n```\n# nginx -t\nnginx:\
    \ the configuration file /etc/nginx/nginx.conf syntax is ok\nnginx: configuration\
    \ file /etc/nginx/nginx.conf test is successful\n\n# service nginx restart\n```\n\
    \n我们现在可以添加一个 php info 脚本，用于检查我们的安装。\n\n```\n# echo -e \"<?php\\nphpinfo();\" >\
    \ /var/www/html/info.php\n```\n\n这太繁琐了！想象一下要对十台服务器执行所有这些步骤！\n\n好消息是我们有 Ansible\
    \ 来帮助我们实现自动化！打开你喜欢的浏览器，访问 `http://your.ip.over.here/info.php` 并确认 php info 页面已加载。\n\
    \n## 什么是 Ansible？\n\n[Ansible](https://www.ansible.com/) 是红帽公司的一个平台，具有无限的自动化用例，允许同时在多台服务器上执行操作。Ansible\
    \ 使用 YAML 语言编写文件，并依赖 SSH 协议来管理机器。\n\nAnsible 安装后，不会添加数据库，也无需启动或保持任何守护进程运行。你只需在一台机器上安装它（可以轻松是一台笔记本电脑），即可从该中心点管理整个远程机器群。当\
    \ Ansible 管理远程机器时，不会在这些机器上留下已安装或正在运行的软件，因此升级到新版本时，完全不存在如何升级 Ansible 的问题。如果你想为项目做贡献，可以查看\
    \ [GitHub](https://github.com/ansible/ansible)。\n\n## 设置 Ansible\n\n要运行 Ansible，你需要一台运行任意版本\
    \ Unix 的机器，无论是 Red Hat、Debian、CentOS、macOS、Ubuntu 及其衍生版等。\n\n目前不支持 Microsoft Windows。根据你的本地发行版，使用包管理器安装\
    \ ansible。Ansible 也可通过 Python pip 获取。\n\n### Fedora\n\n```\n$ sudo dnf install\
    \ ansible\n```\n\n### CentOS\n\n```\n$ sudo yum install ansible\n```\n\n### Ubuntu\n\
    \n```\n$ sudo apt update && sudo apt install -y software-properties-common\n$\
    \ sudo apt-add-repository --yes --update ppa:ansible/ansible\n$ sudo apt install\
    \ ansible\n```\n\n### macOS 或其他系统上的本地单用户安装\n\n```\n$ pip install --user ansible\n\
    ```\n\n### macOS 或其他系统上的系统级安装\n\n```\n$ sudo pip install ansible\n```\n\n我们准备好了！当\
    \ Ansible 进行远程连接时，它将使用原生 SSH 服务，并假设你正在使用 SSH 密钥。始终建议使用 SSH 密钥而非纯密码认证。如果你已经有一台正在运行的服务器，但尚未设置免密认证，可以在本地机器上使用\
    \ `ssh-copy-id` 轻松复制你的公钥。\n\n在下面的命令中替换服务器 IP 地址（如果你想为不同用户设置免密认证，也替换用户名）。\n\n```\n\
    $ ssh-copy-id root@123.45.6.78\n```\n\n现在我们已经安装了 Ansible。我们需要一台全新的、未安装任何软件的服务器，以便自动化完成上一节中的手动流程。一旦我们从\
    \ Digital Ocean（或任何其他提供商，或本地服务器）启动一个新的 Droplet，就可以开始使用 Ansible 了。在本地机器上某个很酷的地方创建一个\
    \ ansible 目录。在我们的例子中，我们将使用 `~/devops`。\n\n## Ansible 清单\n\nAnsible 允许我们以[不同格式](https://docs.ansible.com/ansible/latest/plugins/inventory.html#inventory-plugins)列出服务器\
    \ IP 地址。让我们同时使用 INI 和 YAML 格式来解释它们的区别。在新目录中，创建两个新文件：`hosts` 和 `hosts.yml`；以保存所有服务器\
    \ IP 地址的[清单](https://docs.ansible.com/ansible/latest/user_guide/intro_inventory.html)。由于我们尚未为服务器设置其他用户，我们将使用\
    \ root 用户。我们还可以为每台服务器命名，并根据需要对它们进行分组。\n\n```\n$ cat hosts\n# your server ip addresses\n\
    1.x.x.x\n2.x.x.x\n\n[databases]\n3.y.y.y\n4.y.y.y\n\n[php]\nserver ansible_host=5.z.z.z\n\
    worker ansible_host=6.z.z.z ansible_port=8888\n```\n\n在上述 INI 文件中：\n\n*   `x.x.x`\
    \ 地址仅在 `all` 和 `ungrouped` 组中，\n*   `y.y.y` 在 `databases` 组中，\n*   `z.z.z` 在 `php`\
    \ 组中。\n\n这两个 PHP 服务器组有别名（`server` 和 `worker`），当你想明确针对这两台服务器中的任意一台时可以使用。`worker`\
    \ 服务器还有一个自定义 SSH 端口 `8888`，必须使用 `ansible_port` 变量定义。\n\n上述 INI 文件的 YAML 等效形式为：\n\
    \n```\n$ cat hosts.yml\n# your server ip addresses\nall:\n  hosts:\n    1.x.x.x:\n\
    \    2.x.x.x:\n  children:\n    databases:\n      hosts:\n        3.y.y.y:\n \
    \       4.y.y.y:\n    php:\n      hosts:\n        server:\n          ansible_host:\
    \ 5.z.z.z\n        worker:\n          ansible_host: 6.z.z.z\n          ansible_port:\
    \ 8888\n```\n\n对于 Ansible 主机，当主机不止一个时，每个列表项末尾的冒号是必需的，因此建议始终保留冒号，无论是否有多个主机。要测试我们的清单，请使用\
    \ ansible [ping 模块](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/ping_module.html)\
    \ ping 任一列出的服务器：\n\n```\n$ ansible all -i hosts -m ping\n$ ansible all -i hosts.yml\
    \ -m ping\n$ ansible databases -i hosts -m ping\n$ ansible databases -i hosts.yml\
    \ -m ping\n$ ansible worker -i hosts -m ping\n$ ansible worker -i hosts.yml -m\
    \ ping\n```\n\n```\n...\n6.z.z.z | SUCCESS => {\n    \"ansible_facts\": {\n  \
    \      \"discovered_interpreter_python\": \"/usr/bin/python3\"\n    },\n    \"\
    changed\": false,\n    \"ping\": \"pong\"\n}\n```\n\n## YAML 基础\n\nYAML 语法非常直观。在查看\
    \ playbook 之前，我们将先了解一些基础知识。\n\n按照通用约定，Ansible 文件可以以 `---` 开头，以 `...` 结尾，表示文档的开始和结束。大多数文件只包含开始标记。注释由\
    \ `#` 字符定义。\n\n列表在 Ansible 中非常常见，定义方式是使用 `-`（连字符）后跟一个空格。\n\n```\n---\n- php\n\
    - vue\n- react\n```\n\n字典是键值对，冒号后必须始终跟一个空格。\n\n```\nphp:\n  latest: 7.3\n  Installed:\
    \ 7.3\n```\n\n如果某行太长，可以使用字面块标量字符 `|`（管道符）或折叠块标量字符 `>`（大于号）进行换行。字面块标量字符将按输入原样渲染，包括换行符和任何额外空格；而折叠块标量字符会将换行符转换为空格。可以通过缩进行或添加额外空行来强制换行。\n\
    \n```\n# Literal\nexact_hello_world_template: |\n  this is\n  the\n  hello world\
    \ template\n\n# same as:\n# this is\\nthe\\nwrapped\\nhello world template\n\n\
    # Folded\nwrapped_hello_world_template: >\n  this is\n  the\n  wrapped\n  hello\
    \ world template\n\n# same as:\n# this is the wrapped\\nhello world template\n\
    ```\n\n注意：如果你的字符串包含冒号或 `#`，你需要给它们加引号，因为当冒号后跟一个空格时（即 `John Doe: Look for him`），YAML\
    \ 会期望一个映射。`#` 之后的任何内容都将被视为注释。\n\n## Ansible Playbooks\n\nPlaybook 是 Ansible 的配置、部署和编排语言。它们可以描述你希望远程系统强制执行的策略，或通用\
    \ IT 流程中的一组步骤，在我们的例子中，就是我们希望如何设置服务器。\n\n"
