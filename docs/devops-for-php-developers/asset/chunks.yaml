- raw: "That should do it! Our nginx settings should be able to give us the best of\
    \ our servers. All that’s left now is to add some permissions to deploy user so\
    \ that he can write to /var/www directory, and restart php-fpm without a sudo\
    \ password. But before all that, let’s restart nginx and make sure everything\
    \ is running as expected.\n\nOpen up the nginx handlers (nginx/handlers/main.yml)\
    \ and add the restart handler which can be called from any role:\n\n82\n\n\\---\n\
    \n\\# handlers file for nginx\n\n\\- name: restart nginx\n\nservice:\n\nname:\
    \ nginx\n\nstate: restarted\n\nOnce done, run the playbook and see how it plays.\
    \ The complete configure subtask:\n\n\\---\n\n\\- name: Check the available processor\
    \ cores\n\nshell: grep processor /proc/cpuinfo | wc -l\n\nregister: nginx\\_core\\\
    _number\n\nwhen: nginx\\_worker\\_processes is not defined\n\n\\- name: Set the\
    \ nginx\\_worker\\_processes variable\n\nset\\_fact:\n\nnginx\\_worker\\_processes:\
    \ \"{{ nginx\\_core\\_number.stdout\\_lines\\[0\\] }}\"\n\nwhen: nginx\\_worker\\\
    _processes is not defined\n\n\\- name: Validate the config directories exist\n\
    \nfile:\n\npath: \"{{ item }}\"\n\nstate: directory\n\nowner: root\n\ngroup: root\n\
    \nloop:\n\n\\- /etc/nginx/conf.d\n\n\\- /etc/nginx/sites-enabled\n\n\\- name:\
    \ Validate the log directory exist\n\nfile:\n\npath: /var/log/nginx\n\nstate:\
    \ directory\n\nowner: root\n\ngroup: adm\n\n\\- name: Deploy custom nginx.conf\n\
    \ntemplate:\n\ndest: /etc/nginx/nginx.conf\n\nsrc: nginx.conf.j2\n\nowner: root\n\
    \n83\n\n group: root\n\nmode: 0644\n\n\\- name: Generate 4096 bit DH Params\n\n\
    shell: \"openssl dhparam -out {{ nginx\\_dhparam\\_location }} 4096\"\n\nargs:\n\
    \ncreates: \"{{ nginx\\_dhparam\\_location }}\"\n\n\\- name: Validate the snippets\
    \ directory exist\n\nfile:\n\npath: /etc/nginx/snippets\n\nstate: directory\n\n\
    owner: root\n\ngroup: root\n\n\\- name: Deploy the ssl-snippet\n\ntemplate:\n\n\
    dest: /etc/nginx/snippets/ssl-params.conf\n\nsrc: ssl-params.conf.j2\n\nowner:\
    \ root\n\ngroup: root\n\nmode: 0644\n\n\\- name: Deploy the default certificate\
    \ configuration file\n\ntemplate:\n\ndest: /etc/nginx/snippets/ssl-default.conf\n\
    \nsrc: ssl-default.conf.j2\n\nowner: root\n\ngroup: root\n\nmode: 0644\n\n\\-\
    \ name: Validate the server root directory exist\n\nfile:\n\npath: \"{{ nginx\\\
    _default\\_server\\_root }}\"\n\nstate: directory\n\nowner: www-data\n\ngroup:\
    \ www-data\n\n\\- name: Deploy the default server block\n\ntemplate:\n\ndest:\
    \ /etc/nginx/sites-available/default\n\nsrc: default.j2\n\nowner: root\n\ngroup:\
    \ root\n\nmode: 0644\n\n84\n\n notify: restart nginx\n\nFinally, test out your\
    \ installation by logging in to your server and creating a phpinfo index file:\
    \ /var/www/app/current/public/index.php.\n\n$ echo -e \"<?php\\\\nphpinfo();\"\
    \ > /var/www/app/current/public/index.php Open your browser and confirm that you\
    \ have liftoff! The PHP Info page should render.\n\n85\n\nThe ACL Role\n\nNow\
    \ that we are done with setting up the server, we need to allow the deploy user\
    \ to perform some actions without requiring a sudo password.\n\nEdit the acl/tasks/main.yml\
    \ file and add the following tasks.\n\n\\---\n\n\\# tasks file for acl\n\n\\-\
    \ name: Set up facl for /var/www\n\nacl:\n\npath: /var/www\n\nentity: www-data\n\
    \netype: group\n\npermissions: rwx\n\ndefault: no\n\nstate: present\n\nrecursive:\
    \ yes\n\n\\- name: Set up default facl for /var/www\n\nacl:\n\npath: /var/www\n\
    \nentity: www-data\n\netype: group\n\npermissions: rwx\n\ndefault: yes\n\nstate:\
    \ present\n\nrecursive: yes\n\n\\- name: Allow www-data to restart php\n\nlineinfile:\n\
    \npath: /etc/sudoers.d/wwwdata\n\nline: \"%www-data ALL=(ALL:ALL) NOPASSWD:/usr/sbin/service\
    \ php{{\n\nphp\\_version }}-fpm restart,/usr/sbin/service php{{ php\\_version\
    \ }}-fpm reload\"\n\ncreate: yes\n\n\\- name: Change /var/www ownership\n\nfile:\n\
    \npath: /var/www\n\nrecurse: yes\n\ngroup: www-data\n\nowner: www-data\n\n86\n\
    \nGreat! You should be able to login as the deploy user and create, edit or delete\
    \ files under /var/www, and be able to run sudo service php7.4-fpm restart without\
    \ any password, call that awesome!\n\n87\n\nTesting & Deployment\n\n88\n\nTest\
    \ Cases\n\nA lot of people are scared of the term testing. We actually strive\
    \ to run away from tests, yet they improve the uptime of our software by allowing\
    \ them to fail before they are deployed. When we integrate CI/CD to our development\
    \ pipeline, we will be at ease knowing that whatever we have deployed to production\
    \ is actually working.\n\n[For PHP, we will use PHP Unit which comes bundled up\
    \ with most of the](https://phpunit.de/)\n\nframeworks. If working on vanilla\
    \ PHP, you can still require it using composer and test out your work.\n\n89\n\
    \nLocal Testing\n\nTesting Laravel\n\n[Let’s use Laravel](https://laravel.com)\
    \ and set up a few tests. You can either use the Laravel Installer or composer\
    \ create-project. For simplicity, let’s use the composer create-project.\n\n$\
    \ composer create-project --prefer-dist laravel/laravel devops-app Now that we’ve\
    \ got a working Laravel installation, we can create an endpoint that will receive\
    \ some data, and store it in the database. This will allow us to test the database\
    \ connectivity and interaction with our app.\n\nNavigate to the project directory\
    \ and edit the .env file. Include the correct database connection, then create\
    \ a new model with its factory, migration and a resource controller:\n\n$ php\
    \ artisan make:model -mcrf Post\n\nModel created successfully.\n\nFactory created\
    \ successfully.\n\nCreated Migration: 2020\\_10\\_29\\_070516\\_create\\_posts\\\
    _table\n\nController created successfully.\n\nIn the migration, add just one field,\
    \ body, of type text. We will not focus on the creation of a full fledged application\
    \ but only on the testing bit.\n\n90\n\n<?php\n\nuse Illuminate\\\\Database\\\\\
    Migrations\\\\Migration;\n\nuse Illuminate\\\\Database\\\\Schema\\\\Blueprint;\n\
    \nuse Illuminate\\\\Support\\\\Facades\\\\Schema;\n\nclass CreatePostsTable extends\
    \ Migration\n\n{\n\n/\\*\\*\n\n\\* Run the migrations.\n\n\\*\n\n\\* @return void\n\
    \n\\*/\n\npublic function up()\n\n{\n\nSchema::create('posts', function (Blueprint\
    \ $table) {\n\n$table->id();\n\n$table->text('content');\n\n$table->timestamps();\n\
    \n});\n\n}\n\n/\\*\\*\n\n\\* Reverse the migrations.\n\n\\*\n\n\\* @return void\n\
    \n\\*/\n\npublic function down()\n\n{\n\nSchema::dropIfExists('posts');\n\n}\n\
    \n}\n\nOnce done, we can migrate and create the table in our database. Using migrations\
    \ as the blueprints for our database structure is very effective as there is no\
    \ need of moving SQL files with data into GIT and then, to the server.\n\n91\n\
    \n$ php artisan migrate\n\nMigrating: 2014\\_10\\_12\\_000000\\_create\\_users\\\
    _table\n\nMigrated: 2014\\_10\\_12\\_000000\\_create\\_users\\_table (40.59ms)\n\
    \nMigrating: 2014\\_10\\_12\\_100000\\_create\\_password\\_resets\\_table\n\n\
    Migrated: 2014\\_10\\_12\\_100000\\_create\\_password\\_resets\\_table (32.51ms)\
    \ Migrating: 2019\\_08\\_19\\_000000\\_create\\_failed\\_jobs\\_table\n\nMigrated:\
    \ 2019\\_08\\_19\\_000000\\_create\\_failed\\_jobs\\_table (16.03ms) Migrating:\
    \ 2020\\_10\\_29\\_070516\\_create\\_posts\\_table\n\nMigrated: 2020\\_10\\_29\\\
    _070516\\_create\\_posts\\_table (0.06 seconds) We can now edit the PostFactory\
    \ under database/factories and instruct the factory how it can create a Post.\n\
    \n92\n\n<?php\n\nnamespace Database\\\\Factories;\n\nuse App\\\\Models\\\\Post;\n\
    \nuse Illuminate\\\\Database\\\\Eloquent\\\\Factories\\\\Factory;\n\nclass PostFactory\
    \ extends Factory\n\n{\n\n/\\*\\*\n\n\\* The name of the factory's corresponding\
    \ model.\n\n\\*\n\n\\* @var string\n\n\\*/\n\nprotected $model = Post::class;\n\
    \n/\\*\\*\n\n\\* Define the model's default state.\n\n\\*\n\n\\* @return array\n\
    \n\\*/\n\npublic function definition()\n\n{\n\nreturn \\[\n\n'content' => $this->faker->paragraphs(4,\
    \ true),\n\n\\];\n\n}\n\n}\n\nDone! Now create a new posts feature test. We'll\
    \ write the test to perform whatever action we are envisioning the end user performing.\
    \ In our case, we expect the end user to be able to create a new post, edit it\
    \ and delete it.\n\nLet’s add a composer script that will handle the running of\
    \ the test.\n\nOpen up composer.json and add the following under scripts.\n\n\"\
    test\": \\[\n\n\"./vendor/bin/phpunit\"\n\n\\]\n\nThis script will migrate the\
    \ database using the testing environment, then 93\n\nrun phpunit. To execute the\
    \ script, simply run composer test."
  fmt: "\nThat should do it! Our nginx settings should be able to give us the best\
    \ of our servers. All that’s left now is to add some permissions to deploy user\
    \ so that he can write to `/var/www` directory, and restart `php-fpm` without\
    \ a sudo password. But before all that, let’s restart nginx and make sure everything\
    \ is running as expected.\n\nOpen up the nginx handlers (`nginx/handlers/main.yml`)\
    \ and add the restart handler which can be called from any role:\n\n---\n\n# handlers\
    \ file for nginx\n\n- name: restart nginx\n  service:\n    name: nginx\n    state:\
    \ restarted\n\nOnce done, run the playbook and see how it plays. The complete\
    \ configure subtask:\n\n---\n\n- name: Check the available processor cores\n \
    \ shell: grep processor /proc/cpuinfo | wc -l\n  register: nginx_core_number\n\
    \  when: nginx_worker_processes is not defined\n\n- name: Set the nginx_worker_processes\
    \ variable\n  set_fact:\n    nginx_worker_processes: \"{{ nginx_core_number.stdout_lines[0]\
    \ }}\"\n  when: nginx_worker_processes is not defined\n\n- name: Validate the\
    \ config directories exist\n  file:\n    path: \"{{ item }}\"\n    state: directory\n\
    \    owner: root\n    group: root\n  loop:\n    - /etc/nginx/conf.d\n    - /etc/nginx/sites-enabled\n\
    \n- name: Validate the log directory exist\n  file:\n    path: /var/log/nginx\n\
    \    state: directory\n    owner: root\n    group: adm\n\n- name: Deploy custom\
    \ nginx.conf\n  template:\n    dest: /etc/nginx/nginx.conf\n    src: nginx.conf.j2\n\
    \    owner: root\n    group: root\n    mode: 0644\n\n- name: Generate 4096 bit\
    \ DH Params\n  shell: \"openssl dhparam -out {{ nginx_dhparam_location }} 4096\"\
    \n  args:\n    creates: \"{{ nginx_dhparam_location }}\"\n\n- name: Validate the\
    \ snippets directory exist\n  file:\n    path: /etc/nginx/snippets\n    state:\
    \ directory\n    owner: root\n    group: root\n\n- name: Deploy the ssl-snippet\n\
    \  template:\n    dest: /etc/nginx/snippets/ssl-params.conf\n    src: ssl-params.conf.j2\n\
    \    owner: root\n    group: root\n    mode: 0644\n\n- name: Deploy the default\
    \ certificate configuration file\n  template:\n    dest: /etc/nginx/snippets/ssl-default.conf\n\
    \    src: ssl-default.conf.j2\n    owner: root\n    group: root\n    mode: 0644\n\
    \n- name: Validate the server root directory exist\n  file:\n    path: \"{{ nginx_default_server_root\
    \ }}\"\n    state: directory\n    owner: www-data\n    group: www-data\n\n- name:\
    \ Deploy the default server block\n  template:\n    dest: /etc/nginx/sites-available/default\n\
    \    src: default.j2\n    owner: root\n    group: root\n    mode: 0644\n  notify:\
    \ restart nginx\n\nFinally, test out your installation by logging in to your server\
    \ and creating a phpinfo index file: `/var/www/app/current/public/index.php`.\n\
    \n```\n$ echo -e \"<?php\\nphpinfo();\" > /var/www/app/current/public/index.php\n\
    ```\n\nOpen your browser and confirm that you have liftoff! The PHP Info page\
    \ should render.\n\n## The ACL Role\n\nNow that we are done with setting up the\
    \ server, we need to allow the deploy user to perform some actions without requiring\
    \ a sudo password.\n\nEdit the `acl/tasks/main.yml` file and add the following\
    \ tasks.\n\n---\n\n# tasks file for acl\n\n- name: Set up facl for /var/www\n\
    \  acl:\n    path: /var/www\n    entity: www-data\n    etype: group\n    permissions:\
    \ rwx\n    default: no\n    state: present\n    recursive: yes\n\n- name: Set\
    \ up default facl for /var/www\n  acl:\n    path: /var/www\n    entity: www-data\n\
    \    etype: group\n    permissions: rwx\n    default: yes\n    state: present\n\
    \    recursive: yes\n\n- name: Allow www-data to restart php\n  lineinfile:\n\
    \    path: /etc/sudoers.d/wwwdata\n    line: \"%www-data ALL=(ALL:ALL) NOPASSWD:/usr/sbin/service\
    \ php{{ php_version }}-fpm restart,/usr/sbin/service php{{ php_version }}-fpm\
    \ reload\"\n    create: yes\n\n- name: Change /var/www ownership\n  file:\n  \
    \  path: /var/www\n    recurse: yes\n    group: www-data\n    owner: www-data\n\
    \nGreat! You should be able to login as the deploy user and create, edit or delete\
    \ files under `/var/www`, and be able to run `sudo service php7.4-fpm restart`\
    \ without any password, call that awesome!\n\n## Testing & Deployment\n\n### Test\
    \ Cases\n\nA lot of people are scared of the term testing. We actually strive\
    \ to run away from tests, yet they improve the uptime of our software by allowing\
    \ them to fail before they are deployed. When we integrate CI/CD to our development\
    \ pipeline, we will be at ease knowing that whatever we have deployed to production\
    \ is actually working.\n\n[For PHP, we will use PHP Unit which comes bundled up\
    \ with most of the](https://phpunit.de/) frameworks. If working on vanilla PHP,\
    \ you can still require it using composer and test out your work.\n\n### Local\
    \ Testing\n\n#### Testing Laravel\n\n[Let’s use Laravel](https://laravel.com)\
    \ and set up a few tests. You can either use the Laravel Installer or composer\
    \ create-project. For simplicity, let’s use the composer create-project.\n\n```\n\
    $ composer create-project --prefer-dist laravel/laravel devops-app\n```\n\nNow\
    \ that we’ve got a working Laravel installation, we can create an endpoint that\
    \ will receive some data, and store it in the database. This will allow us to\
    \ test the database connectivity and interaction with our app.\n\nNavigate to\
    \ the project directory and edit the `.env` file. Include the correct database\
    \ connection, then create a new model with its factory, migration and a resource\
    \ controller:\n\n```\n$ php artisan make:model -mcrf Post\n```\n\n```\nModel created\
    \ successfully.\nFactory created successfully.\nCreated Migration: 2020_10_29_070516_create_posts_table\n\
    Controller created successfully.\n```\n\nIn the migration, add just one field,\
    \ body, of type text. We will not focus on the creation of a full fledged application\
