    \ true) | list }}\"\n    classic: true\n    state: present\n```\n\n## 无人值守升级\n\
    \n无人值守升级仅使用已启用的来源运行。我们可以创建一个文件并将其存放在 files 目录下，或者使用变量来启用我们需要的来源。我们将采用后者。让我们在 `common/default/main.yml`\
    \ 文件中添加一些默认变量。\n\n```yaml\nunattended_upgrades_security: true\nunattended_upgrades_esm:\
