    \nAutomated Testing with GitLab CI/CD\n\nWe've successfully created the tests\
    \ and run them locally. Now we want to create a pipeline that will handle the\
    \ testing of our code for each commit\n\n[that is pushed into GitLab](https://gitlab.com/).\
