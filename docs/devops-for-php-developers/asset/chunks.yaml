    \ 设置要使用的 root 密码，`MYSQL_DATABASE` 设置服务启动后要创建的数据库。这两个变量也映射到 Laravel 使用的 `DB_PASSWORD`\
    \ 和 `DB_DATABASE` 环境变量。`DB_USERNAME` 将为 `root`，如果你注意到了，我们将 `DB_HOST` 改为 `mysql`\
    \ 以匹配 MySQL 服务使用的别名。我们还将 `REDIS_HOST` 设为 `redis`（Redis 服务的别名），将 `REDIS_PORT` 设为\
    \ `6379`（Redis 默认端口）。\n\n接下来，我们将定义构成 Pipeline 的作业。每个作业独立处理，某些作业可以：\n- 被允许失败\n\
    - 仅在单个分支上运行\n- 仅手动触发等\n\n在前置作业不允许失败的情况下，如果它失败了，后续作业将不会执行。在我们的案例中，我们将有两个作业：`test`\
    \ 和 `deploy`。\n\n```yaml\nstages:\n  - test\n  - deploy\n```\n\n在运行任何脚本之前打印一些调试信息总是不错的。目前，让我们在运行脚本前打印\
    \ PHP 版本：\n\n```yaml\nbefore_script:\n  - php -v\n```\n\n现在我们将运行功能测试以确认应用完全正常。\n\
    \n```yaml\nfeature_tests:\n  stage: test\n  script:\n    - cp .env.example .env\n\
    \    - composer install\n    - php artisan key:generate\n    - composer test\n\
    ```\n\n在功能测试作业中，我们首先将其分配给 `test` 阶段，然后定义要运行的控制台命令。由于这是仓库的全新克隆，我们首先创建新的 `.env`\
    \ 文件，运行 `composer install`，生成应用密钥，然后运行预定义的 `composer` 脚本，该脚本反过来运行测试。\n\n既然我们有\
    \ Redis 服务，可以将缓存和会话驱动设置为 `redis`。这可以在 `variables` 层面完成，也可以通过更新 `.env.example`\
    \ 文件完成。我倾向于更新 `.env.example`，因为它将被克隆仓库的任何人使用。\n\n```dotenv\nBROADCAST_DRIVER=log\n\
    CACHE_DRIVER=redis\nQUEUE_CONNECTION=sync\nSESSION_DRIVER=redis\n```\n\n现在我们可以添加处理生产环境部署的脚本。你也可以为预发布环境添加另一个。\n\
    \n```yaml\ndeploy_production:\n  stage: deploy\n  script:\n    - time\n  when:\
