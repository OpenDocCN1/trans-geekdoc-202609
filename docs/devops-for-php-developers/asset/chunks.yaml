  fmt: "\n# Pre-setup and Optimisations\n\nWe'll definitely require some basic packages\
    \ to be present, and some packages might use snap. Therefore, we can create three\
    \ variables; one to hold the apt packages (`pre_setup_packages`), and the last\
    \ two to hold the snap packages (`pre_setup_snap` and `pre_setup_snap_classic`).\n\
    \n[Assuming we’ll use Let’s Encrypt](https://letsencrypt.org/) and Ubuntu 18.04.\
    \ we will need the `ppa:certbot/certbot` repository to be added. In our case,\
    \ Ubuntu 20.04, we shall use snap to install certbot.\n\n---\n\n## defaults file\
    \ for common\n\n```yaml\npre_setup_snap:\npre_setup_snap_classic:\n  - certbot\n\
    pre_setup_packages:\n  - wget\n  - curl\n  - zsh\n  - software-properties-common\n\
    \  - build-essential\n  - g++\n  - gcc\n  - git\n  - vim\n  - nscd\n  - supervisor\n\
    \  - unzip\n  - acl\n  - unattended-upgrades\n  - ufw\n```\n\nSwitch back to the\
    \ `pre_setup` subtask and add the tasks for installing the desired packages.\n\
    \n---\n\n## pre_setup tasks\n\n```yaml\n- name: Update the system\n  apt:\n  \
    \  update_cache: yes\n    cache_valid_time: 86400\n    upgrade: 'dist'\n\n- name:\
    \ Install packages\n  apt:\n    name: \"{{ pre_setup_packages | default([], true)\
    \ | list }}\"\n    state: latest\n\n- name: Install Snap Packages\n  snap:\n \
    \   name: \"{{ pre_setup_snap | default([], true) | list }}\"\n    state: present\n\
    \n- name: Install Classic Snap Packages\n  snap:\n    name: \"{{ pre_setup_snap_classic\
    \ | default([], true) | list }}\"\n    classic: true\n    state: present\n```\n\
    \n## Unattended Upgrades\n\nUnattended upgrades only runs using origins that have\
    \ been enabled. We can either create a file and store it under the files directory\
    \ or use variables to enable the origins we need. We’ll go for the latter. Let’s\
    \ add some default variables into the `common/default/main.yml` file.\n\n```yaml\n\
    unattended_upgrades_security: true\nunattended_upgrades_esm: true\nunattended_upgrades_updates:\
    \ true\nunattended_upgrades_proposed: false\nunattended_upgrades_backports: false\n\
    unattended_upgrades_blacklisted: []\nunattended_upgrades_remove_dependencies:\
    \ false\nunattended_upgrades_auto_reboot: true,\nunattended_upgrades_auto_reboot_time:\
    \ \"00:00\"\nunattended_upgrades_update_period: 1\nunattended_upgrades_upgrade_period:\
    \ 1\nunattended_upgrades_auto_clean_period: 7\nunattended_upgrades_unattended_upgrade_period:\
    \ 1\n```\n\nFeel free to add any more variables as required. Take a copy of `/etc/apt/apt.conf.d/50unattended-upgrades`\
    \ and use it as a template, saving it as `common/templates/50unattended-upgrades.j2`\
    \ and then replace the values with variables.\n\n[Ansible uses Jinja as the templating\
    \ engine. You can read more about it on](https://jinja.palletsprojects.com) the\
    \ [documentation site](https://jinja.palletsprojects.com).\n\n```jinja\nUnattended-Upgrade::Allowed-Origins\
    \ {\n  \"${distro_id}:${distro_codename}\";\n\n  {% if unattended_upgrades_security\
    \ %}\n  \"${distro_id}:${distro_codename}-security\";\n  {% endif %}\n\n  {% if\
    \ unattended_upgrades_esm %}\n  \"${distro_id}ESMApps:${distro_codename}-apps-security\"\
    ;\n  \"${distro_id}ESM:${distro_codename}-infra-security\";\n  {% endif %}\n\n\
    \  {% if unattended_upgrades_updates %}\n  \"${distro_id}:${distro_codename}-updates\"\
    ;\n  {% endif %}\n\n  {% if unattended_upgrades_proposed %}\n  \"${distro_id}:${distro_codename}-proposed\"\
    ;\n  {% endif %}\n\n  {% if unattended_upgrades_backports %}\n  \"${distro_id}:${distro_codename}-backports\"\
    ;\n  {% endif %}\n};\n\nUnattended-Upgrade::Package-Blacklist {\n  {% for item\
    \ in unattended_upgrades_blacklisted %}\n  \"{{ item }}\";\n  {% endfor %}\n};\n\
    \nUnattended-Upgrade::MinimalSteps \"true\";\nUnattended-Upgrade::InstallOnShutdown\
    \ \"false\";\nUnattended-Upgrade::Remove-Unused-Dependencies \"{% if unattended_upgrades_remove_dependencies\
    \ %}true{% else %}false{% endif %}\";\nUnattended-Upgrade::Automatic-Reboot \"\
    {% if unattended_upgrades_auto_reboot %}true{% else %}false{% endif %}\";\nUnattended-Upgrade::Automatic-Reboot-Time\
    \ \"{{ unattended_upgrades_auto_reboot_time }}\";\n```\n\nCreate a task under\
    \ `pre_setup.yml` that will be used to replace the variables and deploy the template\
    \ to the server. If the Ansible tasks are written well, re-running them on a system\
    \ that is already setup will not break anything and should simply update what\
    \ needs to be changed.\n\n```yaml\n- name: Configure Unattended Upgrades\n  template:\n\
    \    dest: /etc/apt/apt.conf.d/50unattended-upgrades\n    src: 50unattended-upgrades.j2\n\
    ```\n\nAdd the second template; `common/templates/20auto-upgrades.j2`; with the\
    \ following content. This file determines how frequent the auto upgrade will be\
    \ performed.\n\n```jinja\nAPT::Periodic::Update-Package-Lists \"{{ unattended_upgrades_update_period\
    \ }}\";\nAPT::Periodic::Download-Upgradeable-Packages \"{{ unattended_upgrades_upgrade_period\
    \ }}\";\nAPT::Periodic::AutocleanInterval \"{{ unattended_upgrades_auto_clean_period\
    \ }}\";\nAPT::Periodic::Unattended-Upgrade \"{{ unattended_upgrades_unattended_upgrade_period\
    \ }}\";\n```\n\nAll that’s left now is to set up the task that will copy over\
    \ the template:\n\n```yaml\n- name: Configure Unattended Upgrades Frequency\n\
    \  template:\n    dest: /etc/apt/apt.conf.d/20auto-upgrades\n    src: 20auto-upgrades.j2\n\
    \    owner: root\n    group: root\n    mode: 0644\n```\n\nThat’s it! We’ve successfully\
    \ created two template files, added some variables and created tasks that will\
    \ render the templates and deploy them to the server. To run the playbook, we’ll\
    \ use the same command as before: `$ ansible-playbook -i ./hosts site.yml`\n\n\
    Below is our complete pre-setup file:\n\n---\n\n## Complete pre_setup tasks\n\n\
    ```yaml\n- name: Update the system\n  apt:\n    update_cache: yes\n    cache_valid_time:\
    \ 86400\n    upgrade: 'dist'\n\n- name: Install packages\n  apt:\n    name: \"\
    {{ pre_setup_packages | default([], true) | list }}\"\n    state: latest\n\n-\
    \ name: Install Snap Packages\n  snap:\n    name: \"{{ pre_setup_snap | default([],\
    \ true) | list }}\"\n    state: present\n\n- name: Install Classic Snap Packages\n\
    \  snap:\n    name: \"{{ pre_setup_snap_classic | default([], true) | list }}\"\
    \n    classic: true\n    state: present\n\n- name: Configure Unattended Upgrades\n\
    \  template:\n    dest: /etc/apt/apt.conf.d/50unattended-upgrades\n    src: 50unattended-upgrades.j2\n\
    \    owner: root\n    group: root\n    mode: 0644\n\n- name: Configure Unattended\
    \ Upgrades Frequency\n  template:\n    dest: /etc/apt/apt.conf.d/20auto-upgrades\n\
    \    src: 20auto-upgrades.j2\n    owner: root\n    group: root\n    mode: 0644\n\
    ```\n\n## Optimisations Subtask\n\nAs per our `main.yml` task file, the next item\
    \ in the queue is optimisations (`optimisations.yml`). In order to get the most\
    \ out of our server, we will need to increase some default values. `Somaxconn`\
    \ defines the size of the kernel queue for accepting new connections. The lower\
    \ the value the lower the maximum concurrent users.\n\nBy default, the value is\
    \ set to 128, giving a max of 128 concurrent users. We’ll set this value to 100000.\
    \ Open up `optimisations.yml` and add the first task:\n\n```yaml\n---\n- name:\
    \ Update the maximum concurrent connections\n  sysctl:\n    name: net.core.somaxconn\n\
    \    value: \"100000\"\n    state: present\n```\n\nThe `ip_local_port_range` defines\
    \ the available and usable ports which is usually set to 32768 - 61000 by default.\
    \ We shall increase this range and offer port 10000 to port 65535.\n\n```yaml\n\
    - name: Update available port range\n  sysctl:\n    name: net.ipv4.ip_local_port_range\n\
    \    value: \"1024 65535\"\n    state: present\n```\n\nThe TCP protocol offers\
    \ a wait state which keeps a socket open for up to 4 minutes after the connection\
