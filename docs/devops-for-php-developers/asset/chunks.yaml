- raw: "\\- name: Setup the default pool\n\ntemplate:\n\ndest: \"/etc/php/{{ php\\\
    _version }}/fpm/pool.d/www.conf\"\n\nsrc: www.conf.j2\n\nowner: root\n\ngroup:\
    \ root\n\nmode: 0644\n\n\\- name: Enable PHP-FPM on boot\n\nservice:\n\nname:\
    \ \"php{{ php\\_version }}-fpm\"\n\nstate: started\n\nenabled: true\n\nAnd that\
    \ should do it for PHP. Only two things left: a handler for restarting 69\n\n\
    PHP once all the tasks have been completed and adding the subtasks into the main\
    \ task. The handler will listen to the restart php-fpm event then handle the restart\
    \ for us. Edit php/handlers/main.yml:\n\n\\---\n\n\\# handlers file for php\n\n\
    \\- name: restart php-fpm\n\nservice:\n\nname: \"php{{ php\\_version }}-fpm\"\n\
    \nstate: restarted\n\nFinally, update our php/tasks/main.yml task file and add\
    \ our subtasks.\n\nRemember to restart PHP-FPM when the configuration subtask\
    \ is done:\n\n\\---\n\n\\# tasks file for php\n\n\\- name: Install PHP\n\nimport\\\
    _tasks: installs.yml\n\n\\- name: Configure PHP\n\nimport\\_tasks: configure.yml\n\
    \nnotify: restart php-fpm\n\n70\n\nThe Nginx Role\n\n[Nginx is available as a\
    \ distribution package and can also be installed via the](https://www.nginx.com/)\n\
    \nofficial PPA. The distribution package is not always up to date, so let’s use\
    \ the PPA. We shall have two subtasks, one for the installation, and the other\
    \ to configure Nginx. I’ve provided an optimised nginx.conf file, and a sample\
    \ default server block that has some extra optimisations.\n\nTo set up the worker\\\
    _processes configuration value, we shall use the number of cores available in\
    \ the current server. This value shall be extracted and saved in the nginx\\_worker\\\
    _processes variable if it is undefined. If you would prefer to use your own value\
    \ and disable the auto calculation, add the nginx\\_worker\\_processes variable\
    \ to the playbook variables and assign it a value.\n\nSo let’s get going! Create\
    \ the two subtasks; installs.yml and configure.yml; and add them to the nginx\
    \ main.yml task file.\n\n\\---\n\n\\# tasks file for nginx\n\n\\- name: Install\
    \ nginx\n\nimport\\_tasks: installs.yml\n\n\\- name: Configure Nginx\n\nimport\\\
    _tasks: configure.yml\n\nInstalls Subtask\n\nWe can now open up nginx/tasks/installs.yml\
    \ and add the official Nginx PPA, install it and set it to run on system boot.\n\
    \n71\n\n\\---\n\n\\- name: Add Nginx PPA.\n\napt\\_repository:\n\nrepo: 'ppa:nginx/stable'\n\
    \nstate: present\n\nupdate\\_cache: true\n\nmode: 0666\n\n\\- name: Remove Apache\
    \ if present\n\napt:\n\nname: apache2\n\nstate: absent\n\n\\- name: Install Nginx\n\
    \napt:\n\nname: nginx\n\nstate: latest\n\n\\- name: Enable Nginx on boot\n\nservice:\n\
    \nname: nginx\n\nstate: started\n\nenabled: true\n\nThat’s it for our installs\
    \ subtask! Pretty fast hey?\n\nConfigure Subtask\n\nNext, we open up the nginx/tasks/configure.yml\
    \ file and setup the worker process auto calculation tasks to run only when the\
    \ nginx\\_worker\\_processes variable is undefined.\n\n72\n\n\\---\n\n\\- name:\
    \ Check the available processor cores\n\nshell: grep processor /proc/cpuinfo |\
    \ wc -l\n\nregister: nginx\\_core\\_number\n\nwhen: nginx\\_worker\\_processes\
    \ is not defined\n\n\\- name: Set the nginx\\_worker\\_processes variable\n\n\
    set\\_fact:\n\nnginx\\_worker\\_processes: \"{{ nginx\\_core\\_number.stdout\\\
    _lines\\[0\\] }}\"\n\nwhen: nginx\\_worker\\_processes is not defined\n\nWe can\
    \ now add our nginx.conf template file under\n\ntemplates/nginx.conf.j2.\n\nuser\
    \ {{ nginx\\_user }};\n\nworker\\_processes {{ nginx\\_worker\\_processes }};\n\
    \npid /var/run/nginx.pid;\n\nerror\\_log /var/log/nginx/error.log {{ nginx\\_error\\\
    _level }}; events {\n\nworker\\_connections {{ nginx\\_worker\\_connections }};\n\
    \n}\n\nhttp {\n\ninclude /etc/nginx/mime.types;\n\ndefault\\_type application/octet-stream;\n\
    \nlog\\_format main\\_ext '$remote\\_addr - $remote\\_user \\[$time\\_local\\\
    ]\n\n\"$request\" '\n\n'$status $body\\_bytes\\_sent \"$http\\_referer\" '\n\n\
    '\"$http\\_user\\_agent\" \"$http\\_x\\_forwarded\\_for\" '\n\n'\"$host\" sn=\"\
    $server\\_name\" '\n\n'rt=$request\\_time '\n\n'ua=\"$upstream\\_addr\" us=\"\
    $upstream\\_status\" '\n\n'ut=\"$upstream\\_response\\_time\"\n\nul=\"$upstream\\\
    _response\\_length\"'\n\n'cs=$upstream\\_cache\\_status';\n\naccess\\_log /var/log/nginx/access.log\
    \ main\\_ext;\n\nsendfile on;\n\ntcp\\_nopush on;\n\ntcp\\_nodelay on;\n\nkeepalive\\\
    _timeout {{ nginx\\_keepalive\\_timeout }};\n\n73\n\n types\\_hash\\_max\\_size\
    \ {{ nginx\\_types\\_hash\\_max\\_size }};\n\n\\# allow the server to close connection\
    \ on non responding client,\n\n\\# this will free up memory\n\nreset\\_timedout\\\
    _connection on;\n\n##\n\n\\# Client Settings\n\n##\n\nclient\\_body\\_timeout\
    \ {{ nginx\\_client\\_body\\_timeout }};\n\nclient\\_header\\_timeout {{ nginx\\\
    _client\\_header\\_timeout }};\n\nclient\\_body\\_buffer\\_size {{ nginx\\_client\\\
    _body\\_buffer\\_size }}; client\\_header\\_buffer\\_size {{ nginx\\_client\\\
    _header\\_buffer\\_size }}; client\\_max\\_body\\_size {{ nginx\\_client\\_max\\\
    _body\\_size }};\n\nlarge\\_client\\_header\\_buffers {{ nginx\\_large\\_client\\\
    _header\\_buffers }};\n\n{% if nginx\\_enable\\_gzip %}\n\n##\n\n\\# Gzip Settings\n\
    \n##\n\ngzip on;\n\ngzip\\_disable \"msie6\";\n\ngzip\\_vary on;\n\ngzip\\_proxied\
    \ any;\n\ngzip\\_comp\\_level 6;\n\ngzip\\_min\\_length 1000;\n\ngzip\\_buffers\
    \ 16 8k;\n\ngzip\\_http\\_version 1.1;\n\ngzip\\_types application/atom+xml application/javascript\
    \ application/json application/ld+json application/manifest+json application/rdf+xml\
    \ application/rss+xml application/schema+json application/vnd.geo+json application/vnd.ms-fontobject\
    \ application/x-font-ttf application/x-javascript application/x-web-app-manifest+json\
    \ application/xhtml+xml application/xml font/collection font/eot font/opentype\
    \ font/otf font/ttf image/bmp image/svg+xml image/vnd.microsoft.icon image/x-icon\
    \ text/cache-manifest text/calendar text/css text/javascript text/plain text/markdown\
    \ text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy\
    \ text/xml;\n\n{% endif %}\n\n##\n\n\\# Server Settings\n\n##\n\nserver\\_tokens\
    \ off; # don't send the version number in error pages and headers\n\n74\n\n include\
    \ /etc/nginx/conf.d/\\*.conf;\n\ninclude /etc/nginx/sites-enabled/\\*;\n\n}\n\n\
    Great! The above config disables server tokens so that we keep our Nginx details\
    \ private, and enables the resetting of timed out connections so that we can have\
    \ as much memory reuse as possible. Let’s add the variables that are to be used\
    \ by the config to the nginx/defaults/main.yml file.\n\n\\---\n\n\\# defaults\
    \ file for nginx\n\nnginx\\_user: \"www-data\"\n\nnginx\\_error\\_level: \"warn\"\
    \n\nnginx\\_worker\\_connections: \"2048\"\n\nnginx\\_keepalive\\_timeout: \"\
    65\"\n\nnginx\\_types\\_hash\\_max\\_size: \"2048\"\n\nnginx\\_client\\_body\\\
    _timeout: \"12\"\n\nnginx\\_client\\_header\\_timeout: \"12\"\n\nnginx\\_client\\\
    _body\\_buffer\\_size: \"10k\"\n\nnginx\\_client\\_header\\_buffer\\_size: \"\
    1k\"\n\nnginx\\_client\\_max\\_body\\_size: \"8m\"\n\nnginx\\_large\\_client\\\
    _header\\_buffers: \"4 32k\"\n\nnginx\\_enable\\_gzip: true\n\nAs stated before,\
    \ in case you want to set the worker\\_processes, you will need to edit the sites.yml\
    \ file and add the nginx\\_worker\\_processes variable as below:\n\n\\---\n\n\\\
    - name: Spinning up our LEMP server.\n\nhosts: all\n\nvars:\n\nnginx\\_worker\\\
    _processes: \"auto\"\n\nroles:\n\n\\- common\n\n\\- mysql\n\n\\- php\n\n\\- nginx\n\
    \nWe can now add tasks to the nginx/tasks/configure.yml file, that will 75\n\n\
    validate that the two config and log directories are present and handle the creation\
    \ if missing (/etc/nginx/conf.d, /etc/nginx/sites-enabled and\n\n/var/log/nginx).\
    \ The other task will handle the deploying of our custom nginx.conf template.\n\
    \n\\- name: Validate the config directories exist\n\nfile:\n\npath: \"{{ item\
    \ }}\"\n\nstate: directory\n\nowner: root\n\ngroup: root\n\nloop:\n\n\\- /etc/nginx/conf.d\n\
    \n\\- /etc/nginx/sites-enabled\n\n\\- name: Validate the log directory exist\n\
    \nfile:\n\npath: /var/log/nginx\n\nstate: directory\n\nowner: root\n\ngroup: adm\n\
    \n\\- name: Deploy custom nginx.conf\n\ntemplate:\n\ndest: /etc/nginx/nginx.conf\n\
    \nsrc: nginx.conf.j2\n\nowner: root\n\ngroup: root\n\nmode: 0644\n\nNotice: If\
    \ using User Isolation, set the nginx\\_user and owner of"
  fmt: "\n- name: Setup the default pool\n  template:\n    dest: \"/etc/php/{{ php_version\
    \ }}/fpm/pool.d/www.conf\"\n    src: www.conf.j2\n    owner: root\n    group:\
    \ root\n    mode: 0644\n\n- name: Enable PHP-FPM on boot\n  service:\n    name:\
    \ \"php{{ php_version }}-fpm\"\n    state: started\n    enabled: true\n\nAnd that\
    \ should do it for PHP. Only two things left: a handler for restarting PHP once\
    \ all the tasks have been completed and adding the subtasks into the main task.\
    \ The handler will listen to the `restart php-fpm` event then handle the restart\
    \ for us. Edit `php/handlers/main.yml`:\n\n```\n---\n# handlers file for php\n\
    - name: restart php-fpm\n  service:\n    name: \"php{{ php_version }}-fpm\"\n\
    \    state: restarted\n```\n\nFinally, update our `php/tasks/main.yml` task file\
    \ and add our subtasks. Remember to restart PHP-FPM when the configuration subtask\
    \ is done:\n\n```\n---\n# tasks file for php\n- name: Install PHP\n  import_tasks:\
    \ installs.yml\n- name: Configure PHP\n  import_tasks: configure.yml\n  notify:\
    \ restart php-fpm\n```\n\n# The Nginx Role\n\n[Nginx is available as a distribution\
    \ package and can also be installed via the official PPA](https://www.nginx.com/).\
    \ The distribution package is not always up to date, so let’s use the PPA. We\
    \ shall have two subtasks, one for the installation, and the other to configure\
    \ Nginx. I’ve provided an optimised `nginx.conf` file, and a sample default server\
    \ block that has some extra optimisations.\n\nTo set up the `worker_processes`\
    \ configuration value, we shall use the number of cores available in the current\
    \ server. This value shall be extracted and saved in the `nginx_worker_processes`\
    \ variable if it is undefined. If you would prefer to use your own value and disable\
    \ the auto calculation, add the `nginx_worker_processes` variable to the playbook\
    \ variables and assign it a value.\n\nSo let’s get going! Create the two subtasks;\
    \ `installs.yml` and `configure.yml`; and add them to the nginx main.yml task\
    \ file.\n\n```\n---\n# tasks file for nginx\n- name: Install nginx\n  import_tasks:\
    \ installs.yml\n- name: Configure Nginx\n  import_tasks: configure.yml\n```\n\n\
    ## Installs Subtask\n\nWe can now open up `nginx/tasks/installs.yml` and add the\
    \ official Nginx PPA, install it and set it to run on system boot.\n\n```\n---\n\
    - name: Add Nginx PPA.\n  apt_repository:\n    repo: 'ppa:nginx/stable'\n    state:\
    \ present\n    update_cache: true\n    mode: 0666\n\n- name: Remove Apache if\
    \ present\n  apt:\n    name: apache2\n    state: absent\n\n- name: Install Nginx\n\
    \  apt:\n    name: nginx\n    state: latest\n\n- name: Enable Nginx on boot\n\
    \  service:\n    name: nginx\n    state: started\n    enabled: true\n```\n\nThat’s\
    \ it for our installs subtask! Pretty fast hey?\n\n## Configure Subtask\n\nNext,\
    \ we open up the `nginx/tasks/configure.yml` file and setup the worker process\
    \ auto calculation tasks to run only when the `nginx_worker_processes` variable\
    \ is undefined.\n\n```\n---\n- name: Check the available processor cores\n  shell:\
    \ grep processor /proc/cpuinfo | wc -l\n  register: nginx_core_number\n  when:\
    \ nginx_worker_processes is not defined\n\n- name: Set the nginx_worker_processes\
    \ variable\n  set_fact:\n    nginx_worker_processes: \"{{ nginx_core_number.stdout_lines[0]\
    \ }}\"\n  when: nginx_worker_processes is not defined\n```\n\nWe can now add our\
    \ `nginx.conf` template file under `templates/nginx.conf.j2`.\n\n```\nuser {{\
    \ nginx_user }};\nworker_processes {{ nginx_worker_processes }};\npid /var/run/nginx.pid;\n\
    error_log /var/log/nginx/error.log {{ nginx_error_level }};\nevents {\n  worker_connections\
    \ {{ nginx_worker_connections }};\n}\nhttp {\n  include /etc/nginx/mime.types;\n\
    \  default_type application/octet-stream;\n  log_format main_ext '$remote_addr\
    \ - $remote_user [$time_local] \"$request\" '\n    '$status $body_bytes_sent \"\
    $http_referer\" '\n    '\"$http_user_agent\" \"$http_x_forwarded_for\" '\n   \
    \ '\"$host\" sn=\"$server_name\" '\n    'rt=$request_time '\n    'ua=\"$upstream_addr\"\
    \ us=\"$upstream_status\" '\n    'ut=\"$upstream_response_time\" ul=\"$upstream_response_length\"\
    \ '\n    'cs=$upstream_cache_status';\n  access_log /var/log/nginx/access.log\
    \ main_ext;\n  sendfile on;\n  tcp_nopush on;\n  tcp_nodelay on;\n  keepalive_timeout\
    \ {{ nginx_keepalive_timeout }};\n  types_hash_max_size {{ nginx_types_hash_max_size\
    \ }};\n  # allow the server to close connection on non responding client,\n  #\
    \ this will free up memory\n  reset_timedout_connection on;\n  ##\n  # Client\
    \ Settings\n  ##\n  client_body_timeout {{ nginx_client_body_timeout }};\n  client_header_timeout\
    \ {{ nginx_client_header_timeout }};\n  client_body_buffer_size {{ nginx_client_body_buffer_size\
    \ }};\n  client_header_buffer_size {{ nginx_client_header_buffer_size }};\n  client_max_body_size\
    \ {{ nginx_client_max_body_size }};\n  large_client_header_buffers {{ nginx_large_client_header_buffers\
    \ }};\n  {% if nginx_enable_gzip %}\n  ##\n  # Gzip Settings\n  ##\n  gzip on;\n\
    \  gzip_disable \"msie6\";\n  gzip_vary on;\n  gzip_proxied any;\n  gzip_comp_level\
    \ 6;\n  gzip_min_length 1000;\n  gzip_buffers 16 8k;\n  gzip_http_version 1.1;\n\
    \  gzip_types application/atom+xml application/javascript application/json application/ld+json\
    \ application/manifest+json application/rdf+xml application/rss+xml application/schema+json\
    \ application/vnd.geo+json application/vnd.ms-fontobject application/x-font-ttf\
    \ application/x-javascript application/x-web-app-manifest+json application/xhtml+xml\
    \ application/xml font/collection font/eot font/opentype font/otf font/ttf image/bmp\
    \ image/svg+xml image/vnd.microsoft.icon image/x-icon text/cache-manifest text/calendar\
    \ text/css text/javascript text/plain text/markdown text/vcard text/vnd.rim.location.xloc\
    \ text/vtt text/x-component text/x-cross-domain-policy text/xml;\n  {% endif %}\n\
    \  ##\n  # Server Settings\n  ##\n  server_tokens off; # don't send the version\
    \ number in error pages and headers\n  include /etc/nginx/conf.d/*.conf;\n  include\
    \ /etc/nginx/sites-enabled/*;\n}\n```\n\nGreat! The above config disables server\
    \ tokens so that we keep our Nginx details private, and enables the resetting\
    \ of timed out connections so that we can have as much memory reuse as possible.\
    \ Let’s add the variables that are to be used by the config to the `nginx/defaults/main.yml`\
    \ file.\n\n```\n---\n# defaults file for nginx\nnginx_user: \"www-data\"\nnginx_error_level:\
    \ \"warn\"\nnginx_worker_connections: \"2048\"\nnginx_keepalive_timeout: \"65\"\
    \nnginx_types_hash_max_size: \"2048\"\nnginx_client_body_timeout: \"12\"\nnginx_client_header_timeout:\
    \ \"12\"\nnginx_client_body_buffer_size: \"10k\"\nnginx_client_header_buffer_size:\
    \ \"1k\"\nnginx_client_max_body_size: \"8m\"\nnginx_large_client_header_buffers:\
    \ \"4 32k\"\nnginx_enable_gzip: true\n```\n\nAs stated before, in case you want\
    \ to set the `worker_processes`, you will need to edit the `sites.yml` file and\
    \ add the `nginx_worker_processes` variable as below:\n\n```\n---\n- name: Spinning\
    \ up our LEMP server.\n  hosts: all\n  vars:\n    nginx_worker_processes: \"auto\"\
    \n  roles:\n    - common\n    - mysql\n    - php\n    - nginx\n```\n\nWe can now\
    \ add tasks to the `nginx/tasks/configure.yml` file, that will validate that the\
    \ two config and log directories are present and handle the creation if missing\
    \ (`/etc/nginx/conf.d`, `/etc/nginx/sites-enabled` and `/var/log/nginx`). The\
    \ other task will handle the deploying of our custom `nginx.conf` template.\n\n\
    ```\n- name: Validate the config directories exist\n  file:\n    path: \"{{ item\
    \ }}\"\n    state: directory\n    owner: root\n    group: root\n  loop:\n    -\
    \ /etc/nginx/conf.d\n    - /etc/nginx/sites-enabled\n\n- name: Validate the log\
    \ directory exist\n  file:\n    path: /var/log/nginx\n    state: directory\n \
    \   owner: root\n    group: adm\n\n- name: Deploy custom nginx.conf\n  template:\n\
    \    dest: /etc/nginx/nginx.conf\n    src: nginx.conf.j2\n    owner: root\n  \
    \  group: root\n    mode: 0644\n```\n\nNotice: If using User Isolation, set the\
    \ `nginx_user` and owner of\n"
  trans: "\n\n- name: Setup the default pool\n  template:\n    dest: \"/etc/php/{{\
