- raw: 'We shall also add a new location block with a regular expression to match
    all files ending with .php and send them to the running PHP-FPM process.


    \# vi /etc/nginx/sites-available/default


    root /var/www/html;


    index index.php index.html index.htm index.nginx-debian.html; server\_name \_;


    location / {


    try\_files $uri $uri/ =404;


    }


    location ~ \\.php$ {


    include snippets/fastcgi-php.conf;


    fastcgi\_pass unix:/run/php/php7.4-fpm.sock;


    }


    Once done, save the file, test that it is correct and with no errors, then restart
    nginx so that the new configuration takes over.


    \# nginx -t


    nginx: the configuration file /etc/nginx/nginx.conf syntax is ok nginx: configuration
