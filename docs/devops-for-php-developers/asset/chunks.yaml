    name: net.ipv4.ip\_local\_port\_range


    value: "1024 65535"


    state: present


    \- name: Allow socket reuse


    sysctl:


    name: net.ipv4.tcp\_tw\_reuse


    value: 1


    reload: yes


    state: present


    \- name: Set the soft and hard open file limits


    pam\_limits:


    domain: "{{ item.domain }}"


    value: "999999"


    limit\_item: nofile


    limit\_type: "{{ item.type }}"


    with\_items:


    \- type: soft


    domain: "\*"


    \- type: hard


    domain: "\*"


    \- type: soft


    domain: root


    \- type: hard


    domain: root


    notify:


    \- reboot server


    Users Subtask


    In order for us to be able to clone our Git repository, we''ll require a user
    (of course not root). I prefer calling the user "deploy" but feel free to create
    any 48


    username you like. Let’s add a couple of default variables under common/defaults/main.yml,
    then write the user creation task in common/tasks/users.yml.


    deploy\_user: "deploy"


    deploy\_user\_generate\_ssh\_key: true


    deploy\_user\_shell: "/bin/bash"


    deploy\_user\_local\_ssh\_keys:


    \- ~/.ssh/id\_rsa.pub


    deploy\_user\_groups:


    \- www-data


    Notice: Since this user will be required to handle the web server files, we’ve
    added him to the www-data group. We are not implementing User Isolation. If you
    intend to, modify the user groups that are attached to the deploy user.


    Using the ansible user module, let''s create a new user and generate the SSH


    key pair that will be used by our CI/CD pipelines. We''ll also use the authorized\_key
    module which allows us copy our local public SSH key so that we have password-less
    login. We also want to allow the deploy user to login as himself when using our
    CI/CD pipeline from GitLab.


    49


    \---


    \# tasks for users.yml


    \- name: Create the deploy user groups


    group:


    name: "{{ item }}"


    state: present


    loop: "{{ deploy\_user\_groups | default(\[\], true) }}"


    \- name: Create the deploy user


    user:


    name: "{{ deploy\_user }}"


    groups: "{{ (deploy\_user\_groups | default(\[\], true) | join('','')) }}"


    generate\_ssh\_key: "{{ deploy\_user\_generate\_ssh\_key }}"


    shell: "{{ deploy\_user\_shell }}"


    register: created\_user


    \- name: Add GitLab to known hosts


    lineinfile:


    dest: "/home/{{ deploy\_user }}/.ssh/known\_hosts"


    create: yes


    state: present


    line: "{{ lookup(''pipe'', ''ssh-keyscan -t rsa gitlab.com'') }}"


    regexp: "^gitlab\\\\.com"


    mode: 0600


    \- name: Allow SSH key based logins


    authorized\_key:


    user: "{{ deploy\_user }}"


    key: "{{ lookup(''file'', item) }}"


    state: present


    loop: "{{ deploy\_user\_local\_ssh\_keys | default(\[\], true) }}"


    \- name: Allow Deploy User to Login


    authorized\_key:


    user: "{{ deploy\_user }}"


    key: "{{ created\_user\[''ssh\_public\_key''\] }}"


    state: present


    Let’s run the playbook and see if the changes will be made as desired. Once the
    playbook is run, try logging in as the created user, in our case, the deploy user:
    ssh deploy@123.45.6.78. You should be able to login successfully without a password.


    50


    Security Subtask


    Let’s beef up the security of our server! The first thing I like changing is the
    default SSH Port. We also installed UFW (uncomplicated firewall) for filtering
    which connections should be accepted and which should be dropped.


    Let''s add some new default variables. The ufw\_allow variable will house the
    port and protocol (tcp/udp) to be used and can contain as many ports as needed.


    ssh\_port: "4033"


    ufw\_allow:


    \- port: 80


    proto: tcp


    \- port: 443


    proto: tcp


    Then we add the tasks in common/tasks/security.yml:


    51


    \---


    \# tasks for security


    \- name: Update the SSH port


    lineinfile:


    path: /etc/ssh/sshd\_config


    regexp: "^#?Port "


    line: "Port {{ ssh\_port }}"


    \- name: Allow SSH traffic through firewall


    ufw:


    rule: allow


    port: "{{ ssh\_port }}"


    proto: tcp


    \- name: Allow traffic through firewall


    ufw:


    rule: allow


    port: "{{ item.port }}"


    proto: "{{ item.proto }}"


    loop: "{{ ufw\_allow | default(\[\], true) | list }}"


    \- name: Restart SSH


    service:


    name: ssh


    state: restarted


    \- name: Ensure we use the configured SSH port for the remainder of the role set\_fact:


    ansible\_port: "{{ ssh\_port }}"


    \- name: Start UFW


    ufw:


    direction: incoming


    state: enabled


    policy: deny


    You’ll notice that we have updated the ansible\_port fact under the Ensure we
    use the configured SSH port for the remainder of the role task. This allows ansible
    to carry on working for the rest of the role since we have changed the default
    SSH port to 4033. If using other firewalls, make sure the port is open before
    changing it, otherwise the task will fail.


    If you try to use the default SSH command, it will fail unless the port is 52


    specified. To connect as the previously created deploy user, add -p 4033 to the
    SSH command. You can also create an alias for this connection or add a host to
    your local SSH config ~/.ssh/config:


    $ ssh -p 4033 deploy@123.45.6.78


    \# using an alias


    $ echo ''alias devops="ssh -p 4033 deploy@123.45.6.78"'' >> ~/.bashrc $ source
    ~/.bashrc


    $ devops # this calls the alias above


    \# using ssh config


    $ vi ~/.ssh/config


    Host devops


    Hostname 123.45.6.78


    Port 4033


    User deploy


    $ ssh devops # this will use the devops config


    Notice: If you are running the playbook after each change, you’ll need to add
    the ansible\_port variable on your Ansible inventory hosts file and then remove
    it once the whole playbook is done so that new servers will get the correct configuration.


    Using INI format: 123.45.6.78 ansible\_user=root


    ansible\_port=4033


    The common role is done!


    53


    The MySQL Role


    Percona Subtask


    Under the mysql role directory, create a new percona.yml file under tasks to house
    our percona preparation and installation tasks. We will also add some python libraries
    so that ansible can connect to our database.


    \---


    \- name: Setup Percona Repository


    apt:


    deb: "https://repo.percona.com/apt/percona-release\_latest.{{


    ansible\_distribution\_release }}\_all.deb"


    \- name: Enable Percona 8 Repository


    command: percona-release setup ps80


    \- name: Install Percona Server


    apt:


    name: percona-server-server


    state: latest


    update\_cache: yes


    \- name: Determine required MySQL Python libraries


    set\_fact:


    mysql\_python\_package: "{% if ansible\_python.version.major == 3 %}python3-pymysql{%
    else %}python-pymysql{% endif %}"


    \- name: Ensure MySQL Python libraries are installed


    apt:


    name: "{{ mysql\_python\_package }}"


    state: latest


    Let''s also add a handler (mysql/handlers/main.yml) that will allow us to restart
    mysql server.


    54


    \---


    \# mysql/handlers/main.yml


    \- name: restart mysql


    service:


    name: mysql


    state: restarted


