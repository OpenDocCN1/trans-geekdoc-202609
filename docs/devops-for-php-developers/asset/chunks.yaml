    \nPHP 的配置到此结束。只剩两件事：一个用于在所有任务完成后重启 PHP 的处理器，以及将子任务添加到主任务中。处理器将监听 `restart php-fpm`\
    \ 事件，然后为我们处理重启。编辑 `php/handlers/main.yml`：\n\n```\n---\n# handlers file for php\n\
    - name: restart php-fpm\n  service:\n    name: \"php{{ php_version }}-fpm\"\n\
    \    state: restarted\n```\n\n最后，更新我们的 `php/tasks/main.yml` 任务文件并添加子任务。请记住，在配置子任务完成后重启\
    \ PHP-FPM：\n\n```\n---\n# tasks file for php\n- name: Install PHP\n  import_tasks:\
    \ installs.yml\n- name: Configure PHP\n  import_tasks: configure.yml\n  notify:\
    \ restart php-fpm\n```\n\n# Nginx 角色\n\n[Nginx 可作为发行版软件包获得，也可以通过官方 PPA 安装](https://www.nginx.com/)。发行版软件包并不总是最新的，所以让我们使用\
    \ PPA。我们将有两个子任务，一个用于安装，另一个用于配置 Nginx。我提供了一个经过优化的 `nginx.conf` 文件，以及一个带有一些额外优化的示例默认服务器块。\n\
    \n为了设置 `worker_processes` 配置值，我们将使用当前服务器可用的核心数。如果该变量未定义，该值将被提取并保存在 `nginx_worker_processes`\
    \ 变量中。如果您想使用自己的值并禁用自动计算，请将 `nginx_worker_processes` 变量添加到 playbook 变量中并为其赋值。\n\
    \n那么让我们开始吧！创建两个子任务：`installs.yml` 和 `configure.yml`；并将它们添加到 nginx 的 main.yml 任务文件中。\n\
    \n```\n---\n# tasks file for nginx\n- name: Install nginx\n  import_tasks: installs.yml\n\
    - name: Configure Nginx\n  import_tasks: configure.yml\n```\n\n## 安装子任务\n\n我们现在可以打开\
    \ `nginx/tasks/installs.yml` 并添加官方 Nginx PPA，安装它并设置为在系统启动时运行。\n\n```\n---\n- name:\
    \ Add Nginx PPA.\n  apt_repository:\n    repo: 'ppa:nginx/stable'\n    state:\
    \ present\n    update_cache: true\n    mode: 0666\n\n- name: Remove Apache if\
    \ present\n  apt:\n    name: apache2\n    state: absent\n\n- name: Install Nginx\n\
    \  apt:\n    name: nginx\n    state: latest\n\n- name: Enable Nginx on boot\n\
    \  service:\n    name: nginx\n    state: started\n    enabled: true\n```\n\n我们的安装子任务到此完成！很快吧？\n\
    \n## 配置子任务\n\n接下来，我们打开 `nginx/tasks/configure.yml` 文件，设置 worker 进程自动计算任务，仅在 `nginx_worker_processes`\
    \ 变量未定义时运行。\n\n```\n---\n- name: Check the available processor cores\n  shell:\
    \ grep processor /proc/cpuinfo | wc -l\n  register: nginx_core_number\n  when:\
    \ nginx_worker_processes is not defined\n\n- name: Set the nginx_worker_processes\
    \ variable\n  set_fact:\n    nginx_worker_processes: \"{{ nginx_core_number.stdout_lines[0]\
    \ }}\"\n  when: nginx_worker_processes is not defined\n```\n\n我们现在可以将 `nginx.conf`\
    \ 模板文件添加到 `templates/nginx.conf.j2` 下。\n\n```\nuser {{ nginx_user }};\nworker_processes\
    \ {{ nginx_worker_processes }};\npid /var/run/nginx.pid;\nerror_log /var/log/nginx/error.log\
    \ {{ nginx_error_level }};\nevents {\n  worker_connections {{ nginx_worker_connections\
    \ }};\n}\nhttp {\n  include /etc/nginx/mime.types;\n  default_type application/octet-stream;\n\
    \  log_format main_ext '$remote_addr - $remote_user [$time_local] \"$request\"\
    \ '\n    '$status $body_bytes_sent \"$http_referer\" '\n    '\"$http_user_agent\"\
    \ \"$http_x_forwarded_for\" '\n    '\"$host\" sn=\"$server_name\" '\n    'rt=$request_time\
    \ '\n    'ua=\"$upstream_addr\" us=\"$upstream_status\" '\n    'ut=\"$upstream_response_time\"\
    \ ul=\"$upstream_response_length\" '\n    'cs=$upstream_cache_status';\n  access_log\
    \ /var/log/nginx/access.log main_ext;\n  sendfile on;\n  tcp_nopush on;\n  tcp_nodelay\
    \ on;\n  keepalive_timeout {{ nginx_keepalive_timeout }};\n  types_hash_max_size\
    \ {{ nginx_types_hash_max_size }};\n  # allow the server to close connection on\
    \ non responding client,\n  # this will free up memory\n  reset_timedout_connection\
    \ on;\n  ##\n  # Client Settings\n  ##\n  client_body_timeout {{ nginx_client_body_timeout\
    \ }};\n  client_header_timeout {{ nginx_client_header_timeout }};\n  client_body_buffer_size\
    \ {{ nginx_client_body_buffer_size }};\n  client_header_buffer_size {{ nginx_client_header_buffer_size\
    \ }};\n  client_max_body_size {{ nginx_client_max_body_size }};\n  large_client_header_buffers\
    \ {{ nginx_large_client_header_buffers }};\n  {% if nginx_enable_gzip %}\n  ##\n\
    \  # Gzip Settings\n  ##\n  gzip on;\n  gzip_disable \"msie6\";\n  gzip_vary on;\n\
    \  gzip_proxied any;\n  gzip_comp_level 6;\n  gzip_min_length 1000;\n  gzip_buffers\
    \ 16 8k;\n  gzip_http_version 1.1;\n  gzip_types application/atom+xml application/javascript\
    \ application/json application/ld+json application/manifest+json application/rdf+xml\
    \ application/rss+xml application/schema+json application/vnd.geo+json application/vnd.ms-fontobject\
    \ application/x-font-ttf application/x-javascript application/x-web-app-manifest+json\
    \ application/xhtml+xml application/xml font/collection font/eot font/opentype\
    \ font/otf font/ttf image/bmp image/svg+xml image/vnd.microsoft.icon image/x-icon\
    \ text/cache-manifest text/calendar text/css text/javascript text/plain text/markdown\
    \ text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy\
    \ text/xml;\n  {% endif %}\n  ##\n  # Server Settings\n  ##\n  server_tokens off;\
    \ # don't send the version number in error pages and headers\n  include /etc/nginx/conf.d/*.conf;\n\
    \  include /etc/nginx/sites-enabled/*;\n}\n```\n\n太棒了！上述配置禁用了 server tokens，以便我们保持\
    \ Nginx 详情的私密性，并启用了超时连接的重置，以便我们能尽可能多地重用内存。让我们将配置要用到的变量添加到 `nginx/defaults/main.yml`\
    \ 文件中。\n\n```\n---\n# defaults file for nginx\nnginx_user: \"www-data\"\nnginx_error_level:\
    \ \"warn\"\nnginx_worker_connections: \"2048\"\nnginx_keepalive_timeout: \"65\"\
    \nnginx_types_hash_max_size: \"2048\"\nnginx_client_body_timeout: \"12\"\nnginx_client_header_timeout:\
    \ \"12\"\nnginx_client_body_buffer_size: \"10k\"\nnginx_client_header_buffer_size:\
    \ \"1k\"\nnginx_client_max_body_size: \"8m\"\nnginx_large_client_header_buffers:\
    \ \"4 32k\"\nnginx_enable_gzip: true\n```\n\n如前所述，如果您想设置 `worker_processes`，您需要编辑\
    \ `sites.yml` 文件并按如下方式添加 `nginx_worker_processes` 变量：\n\n```\n---\n- name: Spinning\
    \ up our LEMP server.\n  hosts: all\n  vars:\n    nginx_worker_processes: \"auto\"\
    \n  roles:\n    - common\n    - mysql\n    - php\n    - nginx\n```\n\n我们现在可以向\
    \ `nginx/tasks/configure.yml` 文件添加任务，这些任务将验证两个配置和日志目录是否存在，并在缺失时处理创建（`/etc/nginx/conf.d`、`/etc/nginx/sites-enabled`\
