    \ Allow socket reuse\n  sysctl:\n    name: net.ipv4.tcp_tw_reuse\n    value: 1\n\
    \    reload: yes\n    state: present\n```\n\nMost developers have faced an issue\
    \ with the maximum number of open files allowed per process. The default value\
    \ is usually very low; set to 1024 and this causes an issue since sockets are\
    \ essentially files on any unix system (e.g.\n"
  trans: "\n\n# 预设置与优化\n\n我们肯定需要一些基础软件包已安装，且某些软件包可能使用 snap。因此，我们可以创建三个变量：一个用于存放 apt\
