- raw: 'We''ll definitely require some basic packages to be present, and some packages
    might use snap. Therefore, we can create three variables; one to hold the apt
    packages (pre\_setup\_packages), and the last two to hold the snap packages (pre\_setup\_snap
    and pre\_setup\_snap\_classic).


    [Assuming we’ll use Let’s Encrypt](https://letsencrypt.org/) and Ubuntu 18.04.
    we will need the ppa:certbot/certbot repository to be added. In our case, Ubuntu
    20.04, we shall use snap to install certbot.


    38


    \---


    \# defaults file for common


    pre\_setup\_snap:


    pre\_setup\_snap\_classic:


    \- certbot


    pre\_setup\_packages:


    \- wget


    \- curl


    \- zsh


    \- software-properties-common


    \- build-essential


    \- g++


    \- gcc


    \- git


    \- vim


    \- nscd


    \- supervisor


    \- unzip


    \- acl


    \- unattended-upgrades


    \- ufw


    Switch back to the pre\_setup subtask and add the tasks for installing the desired
    packages.


    39


    \---


    \# pre\_setup tasks


    \- name: Update the system


    apt:


    update\_cache: yes


    cache\_valid\_time: 86400


    upgrade: ''dist''


    \- name: Install packages


    apt:


    name: "{{ pre\_setup\_packages | default(\[\], true) | list }}"


    state: latest


    \- name: Install Snap Packages


    snap:


    name: "{{ pre\_setup\_snap | default(\[\], true) | list }}"


    state: present


    \- name: Install Classic Snap Packages


    snap:


    name: "{{ pre\_setup\_snap\_classic | default(\[\], true) | list }}"


    classic: true


    state: present


    Unattended Upgrades


    Unattended upgrades only runs using origins that have been enabled. We can either
    create a file and store it under the files directory or use variables to enable
    the origins we need. We’ll go for the latter. Let’s add some default variables
    into the common/default/main.yml file.


    40


    unattended\_upgrades\_security: true


    unattended\_upgrades\_esm: true


    unattended\_upgrades\_updates: true


    unattended\_upgrades\_proposed: false


    unattended\_upgrades\_backports: false


    unattended\_upgrades\_blacklisted: \[\]


    unattended\_upgrades\_remove\_dependencies: false


    unattended\_upgrades\_auto\_reboot: true,


    unattended\_upgrades\_auto\_reboot\_time: "00:00"


    unattended\_upgrades\_update\_period: 1


    unattended\_upgrades\_upgrade\_period: 1


    unattended\_upgrades\_auto\_clean\_period: 7


    unattended\_upgrades\_unattended\_upgrade\_period: 1


    Feel free to add any more variables as required. Take a copy of


    [/etc/apt/apt.conf.d/50unattended-upgrades](https://help.ubuntu.com/community/AutomaticSecurityUpdates)
    and use it as a template, saving it as common/templates/50unattended-upgrades.j2
    and then replace the values with variables.


    [Ansible uses Jinja as the templating engine. You can read more about it on](https://jinja.palletsprojects.com)


    the [documentation site](https://jinja.palletsprojects.com).


    41


    Unattended-Upgrade::Allowed-Origins {


    "${distro\_id}:${distro\_codename}";


    {% if unattended\_upgrades\_security %}


    "${distro\_id}:${distro\_codename}-security";


    {% endif %}


    {% if unattended\_upgrades\_esm %}


    "${distro\_id}ESMApps:${distro\_codename}-apps-security";


    "${distro\_id}ESM:${distro\_codename}-infra-security";


    {% endif %}


    {% if unattended\_upgrades\_updates %}


    "${distro\_id}:${distro\_codename}-updates";


    {% endif %}


    {% if unattended\_upgrades\_proposed %}


    "${distro\_id}:${distro\_codename}-proposed";


    {% endif %}


    {% if unattended\_upgrades\_backports %}


    "${distro\_id}:${distro\_codename}-backports";


    {% endif %}


    };


    Unattended-Upgrade::Package-Blacklist {


    {% for item in unattended\_upgrades\_blacklisted %}


    "{{ item }}";


    {% endfor %}


    };


    Unattended-Upgrade::MinimalSteps "true";


    Unattended-Upgrade::InstallOnShutdown "false";


    Unattended-Upgrade::Remove-Unused-Dependencies "{% if unattended\_upgrades\_remove\_dependencies
    %}true{% else %}false{% endif %}"; Unattended-Upgrade::Automatic-Reboot "{% if
    unattended\_upgrades\_auto\_reboot


    %}true{% else %}false{% endif %}";


    Unattended-Upgrade::Automatic-Reboot-Time "{{


    unattended\_upgrades\_auto\_reboot\_time }}";


    Create a task under pre\_setup.yml that will be used to replace the variables
    and deploy the template to the server. If the Ansible tasks are written well,
    re-running them on a system that is already setup will not break anything and
    should simply update what needs to be changed.


    42


    \- name: Configure Unattended Upgrades


    template:


    dest: /etc/apt/apt.conf.d/50unattended-upgrades


    src: 50unattended-upgrades.j2


