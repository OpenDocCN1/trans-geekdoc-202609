    host: "{{ item }}"


    state: absent


    with\_items: "{{ mysql\_anonymous\_hosts.stdout\_lines | default(\[\]) }}"


    \- name: Remove MySQL test database


    mysql\_db:


    name: test


    state: absent


    notify: restart mysql


    The task above references a root-my.cnf.j2 template file which stores the credentials
