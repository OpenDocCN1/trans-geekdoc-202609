    \# echo -e "<?php\\nphpinfo();" > /var/www/html/info.php That was tedious! Imagine
    performing all these steps to setup ten servers!


    The best thing is that we have Ansible to help us with automation! Open your favourite
    browser and navigate to http://your.ip.over.here/info.php and confirm that the
    php info page loaded.


    22


    ![](index-23_1.png)


    23


    Automated Server Setup using


    Ansible


    24


    What is Ansible?


    [Ansible](https://www.ansible.com/) is a platform by Red Hat that has endless
    automation uses which allows performing actions in multiple servers at the same
    time. Ansible uses YAML Language for its files and depends on the SSH protocol
    to manage the machines.


    Once Ansible is installed, it will not add a database, and there will be no daemons
    to start or keep running. You only need to install it on one machine (which could
    easily be a laptop), and it can manage an entire fleet of remote machines from
    that central point. When Ansible manages remote machines, it does not leave software
    installed or running on them, so there’s no real question about how to upgrade
    Ansible when moving to a new version. If you would like to contribute to the project,
    you can have a look at [GitHub](https://github.com/ansible/ansible)


    25


    Setting up Ansible


    For you to run Ansible, you need a machine running any version of unix, be it
    Red Hat, Debian, CentOS, macOS, Ubuntu and its flavours and many more.


    Microsoft Windows is currently not supported. Depending on your local distro,
    install ansible using your package manager. Ansible is also available via Python
    pip.


    \## Fedora


    $ sudo dnf install ansible


    \## CentOS


    $ sudo yum install ansible


    \## Ubuntu


    $ sudo apt update && sudo apt install -y software-properties-common $ sudo apt-add-repository
    --yes --update ppa:ansible/ansible


    $ sudo apt install ansible


    \## local single user installation on macOS or any other system $ pip install
    --user ansible


    \## system wide installation on macOS or any other system


    $ sudo pip install ansible


    We’re set! When Ansible is making remote connections, it will use the native SSH
    service and assumes that you are using SSH keys. It is always advised to use SSH
    keys over plain password authentication. If you already have a running server
    but you have not setup passwordless authentication, you can easily copy your public
    SSH key using ssh-copy-id on your local machine.


    Substitute the server IP address (and the user if you want passwordless authenticaion
    for a different user) in the command below.


    $ ssh-copy-id root@123.45.6.78


    Now we’ve installed Ansible. We need a fresh server with nothing installed so
    that we can automate the manual process we completed in the previous section.
    Once we spin up a new droplet from Digital Ocean (or any other provider, or a
    local server), we can start playing around with Ansible. Make an 26


    ansible directory somewhere awesome on your local machine. In our case, we will
    use ~/devops.


    27


    Ansible Inventory


    Ansible allows us to list our server IP addresses in [different formats](https://docs.ansible.com/ansible/latest/plugins/inventory.html#inventory-plugins).
    Let’s use both INI and YAML formats to explain the difference. Inside the new
    directory, create two new files; hosts and hosts.yml; to keep an [inventory](https://docs.ansible.com/ansible/latest/user_guide/intro_inventory.html)


    of all our server IP addresses. Since we have not setup another user for our servers,
    we shall use the root user. We can also give each of our servers names and group
    them as per our needs.


    $ cat hosts


    \# your server ip addresses


    1.x.x.x


    2.x.x.x


    \[databases\]


    3.y.y.y


    4.y.y.y


    \[php\]


    server ansible\_host=5.z.z.z


    worker ansible\_host=6.z.z.z ansible\_port=8888


    In the INI file above the:


    x.x.x addresses are only in the all and ungrouped groups,


    y.y.y in the databases group and,


    z.z.z in the php group.


    The two PHP server groups have aliases (server and worker) which can be used when
    you explicitly want to target either of the two servers. The worker server also
    has a custom SSH port 8888 which must be defined using the ansible\_port variable.


    The YAML equivalent of the INI above is:


    28


    $ cat hosts.yml


    \# your server ip addresses


    all:


    hosts:


    1.x.x.x:


    2.x.x.x:


    children:


    databases:


    hosts:


    3.y.y.y:


    4.y.y.y:


    php:


    hosts:


    server:


    ansible\_host: 5.z.z.z


    worker:


    ansible\_host: 6.z.z.z


    ansible\_port: 8888


    For the Ansible hosts, the colon at the end of each list item is required when
    the hosts are more than one thus, it’s always advised to keep the colon with or
    without multiple hosts. To test our inventory, ping any of the listed servers
    using the ansible [ping module:](https://docs.ansible.com/ansible/latest/collections/ansible/builtin/ping_module.html)


    $ ansible all -i hosts -m ping


    $ ansible all -i hosts.yml -m ping


    $ ansible databases -i hosts -m ping


    $ ansible databases -i hosts.yml -m ping


    $ ansible worker -i hosts -m ping


    $ ansible worker -i hosts.yml -m ping


    ...


    6.z.z.z | SUCCESS => {


    "ansible\_facts": {


    "discovered\_interpreter\_python": "/usr/bin/python3"


    },


    "changed": false,


    "ping": "pong"


    }


    29


    YAML Basics


    The YAML syntax is pretty straight forward. We’ll go through a few basics before
    having a look at playbooks.


    As a common convention, Ansible files can begin with --- and end with ...


    denoting the start and end of the document. Most files will only include the beginning
    marker. Comments are defined by the # character.


    Lists are very common in Ansible and are defined by using - (hyphen) followed
    by a space.


    \---


    \- php


    \- vue


    \- react


    Dictionaries are key: value pairs in which the colon must always be followed by
    a space.


    php:


    latest: 7.3


    Installed: 7.3


    In the case that you have a line that is too long, it can be wrapped using the
    Literal Block Scalar character | (pipe character), or the Folded Block Scalar
    character > (greater than character). The Literal Block Scalar character will
    render the input as typed, literally including the new lines and any additional
    spaces while the Folded Block Scalar character will convert the new lines into
    spaces. New lines can be enforced by either indenting the line or adding an extra
    empty line.


    30


    \# Literal


    exact\_hello\_world\_template: |


    this is


    the


    hello world template


    \# same as:


    \# this is\\nthe\\nwrapped\\nhello world template


    \# Folded


    wrapped\_hello\_world\_template: >


    this is


    the


    wrapped


    hello world template


    \# same as:


    \# this is the wrapped\\nhello world template


    Notice: In case your strings contain a colon or a #, you will need to quote them
    as YAML will expect a mapping when a colon is followed by a space i.e. John Doe:
    Look for him. Anything after the # will be regarded as a comment.


    31


    Ansible Playbooks


    Playbooks are Ansible’s configuration, deployment, and orchestration language.
    They can describe a policy you want your remote systems to enforce, or a set of
    steps in a general IT process and in our case, how we want our servers to be setup.'
