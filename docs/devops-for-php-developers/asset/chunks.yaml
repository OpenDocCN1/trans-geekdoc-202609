    \ 脚本进行更改的部署用户私钥。我们需要添加一个新变量来保存服务器列表，称之为 `ENVOY_HOSTS`。其值应为要部署的服务器的 JSON 字符串，例如：\n\
    \n```json\n[{\"web\": \"deploy@123.45.6.78 -p 4033\"}]\n```\n\n数组中可根据需要使用任意数量的主机。接下来，让我们更新\
    \ `.gitlab-ci.yml` 文件，设置 SSH agent 和用于登录服务器的私钥。最后，我们将执行 `envoy` 并将仓库地址和服务器列表作为参数传递。\n\
    \n```yaml\nimage: smodav/php74:latest\nservices:\n  - name: redis:latest\n   \
    \ alias: redis\n  - name: mysql:8\n    alias: mysql\n    command: [\"--default-authentication-plugin=mysql_native_password\"\
    ]\nvariables:\n  MYSQL_DATABASE: homestead\n  MYSQL_ROOT_PASSWORD: secret\n  DB_DATABASE:\
    \ homestead\n  DB_HOST: mysql\n  DB_USERNAME: root\n  DB_PASSWORD: secret\n  REDIS_HOST:\
    \ redis\n  REDIS_PORT: 6379\nstages:\n  - test\n  - deploy\nbefore_script:\n \
    \ - php -v\nfeature_tests:\n  stage: test\n  script:\n    - cp .env.example .env\n\
    \    - composer install\n    - php artisan key:generate\n    - composer test\n\
    deploy_production:\n  stage: deploy\n  script:\n    - 'which ssh-agent || (apt-get\
    \ update -y && apt-get install openssh-client -y)'\n    - eval $(ssh-agent -s)\n\
    \    - ssh-add <(echo \"$SSH_KEY\")\n    - mkdir -p ~/.ssh\n    - '[[ -f /.dockerenv\
    \ ]] && echo -e \"Host *\\n\\tStrictHostKeyChecking no\\n\\n\" > ~/.ssh/config'\n\
    \    - ~/.config/composer/vendor/bin/envoy run deploy --repo=$CI_REPOSITORY_URL\
    \ --servers=\"$ENVOY_HOSTS\"\n  when: manual #only for those who want “semi-CI/CD”\n\
    \  only:\n    - master\n```\n\n搞定！剩下的就是创建一个新提交，让 Runner 施展魔法。手动部署部分仅在设置了 `when:\
    \ manual` 时生效。\n\n![Manual Deployment](img/index-129_1.png)\n\n### 手动部署\n\n首个流水线阶段完成后，即可运行手动部署阶段。该阶段可根据需要重复运行多次。\n\
    \n现在我们可以访问服务器验证是否成功。打开浏览器访问 IP 地址 `123.45.6.78`，应该会看到 Laravel 欢迎页。\n\n为了测试 CI/CD\
    \ 流水线是否真正工作，让我们将 Laravel 欢迎页的文字从 \"Laravel has wonderful...\" 修改为 \"DevOps is\
    \ Awesome!\"，然后部署。\n\n```html\n<div class=\"p-6\">\n  <div class=\"flex items-center\"\
    >\n    <svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"\
    round\" stroke-width=\"2\" viewBox=\"0 0 24 24\" class=\"w-8 h-8 text-gray-500\"\
    >\n      <path d=\"M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3\
    \ 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477\
    \ 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5\
    \ 18c-1.746 0-3.332.477-4.5 1.253\"></path>\n    </svg>\n    <div class=\"ml-4\
    \ text-lg leading-7 font-semibold\"><a href=\"https://laravel.com/docs\" class=\"\
    underline text-gray-900 dark:text-white\">Documentation</a></div>\n  </div>\n\
    \  <div class=\"ml-12\">\n    <div class=\"mt-2 text-gray-600 dark:text-gray-400\
    \ text-sm\"> DevOps is Awesome! </div>\n  </div>\n</div>\n```\n\n提交变更：\n\n```bash\n\
    $ git add .\n$ git commit -m \"changes greeting message\"\n$ git push origin master\n\
    ```\n\n现在前往 GitLab CI/CD 流水线，如果使用半自动 CI/CD 则部署手动任务，观察其运行。任务成功完成后，访问你的 IP 地址确认变更已上线。\n"
