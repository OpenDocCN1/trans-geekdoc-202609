- raw: "Since we are using PHP Unit, we can configure our test environment using phpunit.xml\
    \ which is present in the root of our project. Uncomment the two database variables:\
    \ DB\\_CONNECTION and DB\\_DATABASE so that we run the tests using sqlite driver\
    \ and memory as the location where the database will be stored for the duration\
    \ of the test. This will also speed up the tests and prevent overriding any data\
    \ that you might have in your actual database.\n\nEnsure that the php section\
    \ of your phpunit.xml looks similar to:\n\n<php>\n\n<server name=\"APP\\_ENV\"\
    \ value=\"testing\"/>\n\n<server name=\"BCRYPT\\_ROUNDS\" value=\"4\"/>\n\n<server\
    \ name=\"CACHE\\_DRIVER\" value=\"array\"/>\n\n<server name=\"DB\\_CONNECTION\"\
    \ value=\"sqlite\"/>\n\n<server name=\"DB\\_DATABASE\" value=\":memory:\"/>\n\n\
    <server name=\"MAIL\\_MAILER\" value=\"array\"/>\n\n<server name=\"QUEUE\\_CONNECTION\"\
    \ value=\"sync\"/>\n\n<server name=\"SESSION\\_DRIVER\" value=\"array\"/>\n\n\
    <server name=\"TELESCOPE\\_ENABLED\" value=\"false\"/>\n\n</php>\n\nNotice: You\
    \ can add as many env variables as needed under the php section.\n\nWe will not\
    \ implement authentication, but we’ll have a look at validation and form requests\
    \ so that we can test when the input provided is not as expected.\n\n[Create a\
    \ Form Request](https://laravel.com/docs/validation#form-request-validation) [to\
    \ handle the validation, and a Feature Test to contain](https://laravel.com/docs/testing)\n\
    \nthe tests.\n\n$ php artisan make:request PostRequest\n\nRequest created successfully.\n\
    \n$ php artisan make:test PostTest\n\nTest created successfully.\n\nConfirm that\
    \ a new feature test has been created at\n\n94\n\ntests/Feature/PostTest.php with\
    \ the default content:\n\n<?php\n\nnamespace Tests\\\\Feature;\n\nuse Illuminate\\\
    \\Foundation\\\\Testing\\\\RefreshDatabase;\n\nuse Illuminate\\\\Foundation\\\\\
    Testing\\\\WithFaker;\n\nuse Tests\\\\TestCase;\n\nclass PostTest extends TestCase\n\
    \n{\n\n/\\*\\*\n\n\\* A basic feature test example.\n\n\\*\n\n\\* @return void\n\
    \n\\*/\n\npublic function testExample()\n\n{\n\n$response = $this->get('/');\n\
    \n$response->assertStatus(200);\n\n}\n\n}\n\nWe'll need to refresh the test database\
    \ with every test we run so that the previously run test does not interfere with\
    \ the next test. Laravel conveniently includes a [RefreshDatabase trait](https://laravel.com/docs/8.x/database-testing#resetting-the-database-after-each-test)\
    \ that does this for us.\n\n<?php\n\nnamespace Tests\\\\Feature;\n\nuse Illuminate\\\
    \\Foundation\\\\Testing\\\\RefreshDatabase;\n\nuse Tests\\\\TestCase;\n\nclass\
    \ PostTest extends TestCase\n\n{\n\nuse RefreshDatabase;\n\n}\n\n95\n\nThe first\
    \ test we shall write will be to check if a post can be created. Since we have\
    \ a ready factory, we shall get the raw contents, make a POST request, and assert\
    \ that the data has been successfully persisted in the database.\n\n/\\*\\*\n\n\
    \\* @return void\n\n\\*/\n\npublic function testCanCreatePost(): void\n\n{\n\n\
    $post = Post::factory()->raw();\n\n$this->assertEquals(0, Post::count());\n\n\
    $this->withExceptionHandling()\n\n\\->post(route('posts.store'), \\[\\])\n\n\\\
    ->assertSessionHasErrors(\\['content'\\]);\n\n$this->assertEquals(0, Post::count());\n\
    \n$this->withoutExceptionHandling()\n\n\\->followingRedirects()\n\n\\->post(route('posts.store'),\
    \ $post)\n\n\\->assertSuccessful();\n\n$this->assertDatabaseHas('posts', \\['content'\
    \ => $post\\['content'\\]\\]);\n\n}\n\nIn the test above, we are first using the\
    \ defined factory to generate for us a post. Since we want to test that the post\
    \ has been created, we need to first confirm that it was not there before we made\
    \ the request to create it.\n\nNext, we test whether our validation works by passing\
    \ an empty request body. Since we know that it should fail, we enable exception\
    \ handling so that the Unprocessable HTTP Exception is rendered correctly. We\
    \ also assert that the session has the expected errors. In the event that you’re\
    \ using an API, you would assert that the JSON response has validation errors\
    \ using assertJsonValidationErrors.\n\nAfter making the request, we want to confirm\
    \ that it did not erroneously persist the data and return errors, so we assert\
    \ that there are still no posts in the database. We then send the correct data\
    \ to the endpoint. We disable exception handling so that any error that is thrown\
    \ is visible in the output.\n\n96\n\nThis is also very useful when performing\
    \ the CI/CD integrations as it will give you the correct output making it easier\
    \ to debug. Once the request has been made, we assert that it was successful,\
    \ and finally assert that the database has the generated post.\n\nThis test will\
    \ definitely fail since we have no routes, no validation rules and no response\
    \ from the controller, run it to confirm:\n\n$ composer test\n\n\\> ./vendor/bin/phpunit\n\
    \nPHPUnit 9.4.3 by Sebastian Bergmann and contributors.\n\n..E 3 / 3\n\n(100%)\n\
    \nTime: 00:00.568, Memory: 26.00 MB\n\nThere was 1 error:\n\n1) Tests\\\\Feature\\\
    \\PostTest::testCanCreatePost\n\nSymfony\\\\Component\\\\Routing\\\\Exception\\\
    \\RouteNotFoundException: Route\n\n\\[posts.store\\] not defined.\n\n...\n\nSo\
    \ let’s add the routes to web.php or api.php depending on your implementation.\
    \ In our case, we'll use web.php.\n\n<?php\n\nuse App\\\\Http\\\\Controllers\\\
    \\PostController;\n\nuse Illuminate\\\\Support\\\\Facades\\\\Route;\n\nRoute::view('/',\
    \ 'welcome');\n\nRoute::resource('posts', PostController::class);\n\nNext, edit\
    \ the PostRequest to add the validation rules; setting the content field as a\
    \ string that is required. We'll also authorise the creation of the post by returning\
    \ true in the authorize function.\n\n97\n\n<?php\n\nnamespace App\\\\Http\\\\\
    Requests;\n\nuse Illuminate\\\\Foundation\\\\Http\\\\FormRequest;\n\nclass PostRequest\
    \ extends FormRequest\n\n{\n\n/\\*\\*\n\n\\* Determine if the user is authorized\
    \ to make this request.\n\n\\*\n\n\\* @return bool\n\n\\*/\n\npublic function\
    \ authorize()\n\n{\n\nreturn true;\n\n}\n\n/\\*\\*\n\n\\* Get the validation rules\
    \ that apply to the request.\n\n\\*\n\n\\* @return array\n\n\\*/\n\npublic function\
    \ rules()\n\n{\n\nreturn \\[\n\n'content' => \\['required', 'string'\\],\n\n\\\
    ];\n\n}\n\n}\n\nThe PostRequest can now be used on the store method of the PostController.\
    \ The Form Request validates when it is resolved so no need of adding extra validation\
    \ logic. This form request will also be used on the update method since the validation\
    \ logic is the same when creating and updating.\n\nThe request can contain extra\
    \ data that we do not need, so instead of using $request->all() we shall use $request->validated()\
    \ to only get the sanitised data.\n\n98\n\n<?php\n\nnamespace App\\\\Http\\\\\
    Controllers;\n\nuse App\\\\Http\\\\Requests\\\\PostRequest;\n\nuse App\\\\Models\\\
    \\Post;\n\nuse Illuminate\\\\Http\\\\Response;\n\nclass PostController extends\
    \ Controller\n\n{\n\n...\n\n/\\*\\*\n\n\\* Store a newly created resource in storage.\n\
    \n\\*\n\n\\* @param PostRequest $request\n\n\\*\n\n\\* @return Response\n\n\\\
    */\n\npublic function store(PostRequest $request)\n\n{\n\nPost::create($request->validated());\n\
    \nreturn redirect()->route('posts.index');\n\n}\n\n...\n\n}\n\nNext, set the post\
    \ content field to be mass assignable. Open up the Post model, add the fillable\
    \ property. This prevents mass assignment of properties. I personally prefer fillable\
    \ over guarded so that I am always sure of what is being assigned.\n\n99\n\n<?php\n\
    \nnamespace App\\\\Models;\n\nuse Illuminate\\\\Database\\\\Eloquent\\\\Factories\\\
    \\HasFactory;\n\nuse Illuminate\\\\Database\\\\Eloquent\\\\Model;\n\nclass Post\
    \ extends Model\n\n{\n\nuse HasFactory;\n\nprotected $fillable = \\['content'\\\
    ];\n\n}\n\nThe test should now run and pass, but don’t take my word for it, open\
    \ up your terminal and run:\n\n$ composer test\n\n\\> ./vendor/bin/phpunit\n\n\
    PHPUnit 9.4.3 by Sebastian Bergmann and contributors.\n\n... 3 / 3\n\n(100%)\n\
    \nTime: 00:00.292, Memory: 28.00 MB\n\nOK (3 tests, 8 assertions)\n\nGreat! We’ve\
    \ got our first test running! So we’re sure a post can be created.\n\nLet’s confirm\
    \ that it can also be edited and deleted. Since we are using the RefreshDatabase\
    \ trait, the database will be empty after running every test, so we will need\
    \ to create a new post for every subsequent test.\n\n100\n\n /\\*\\*\n\n\\* @return\
    \ void\n\n\\*/\n\npublic function testCanEditPosts(): void\n\n{\n\n$post = Post::factory()->create();\n\
    \n$this->withExceptionHandling()\n\n\\->put(route('posts.update', \\['post' =>\
    \ $post\\]), \\[\\])\n\n\\->assertSessionHasErrors(\\['content'\\]);"
