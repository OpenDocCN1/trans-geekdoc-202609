    11


    Unattended Upgrades


    Debian/Ubuntu provides [Unattended Upgrades package that can be used to](https://help.ubuntu.com/community/AutomaticSecurityUpdates)


    automatically update the system, think of it like the Windows Update for Debian
    or Ubuntu. Let’s set it up to take care of security updates. The package is usually
    installed by default but if it is missing install it using: apt install unattended-upgrades.


    We now need to locate and modify /etc/apt/apt.conf.d/50unattended-upgrades to
    match our requirements. For now, we''ll only enable security updates, but feel
    free to tweak the file to meet your needs. Confirm that the Unattended-Upgrade::Allowed-Origins
    section has the following as active:


    Unattended-Upgrade::Allowed-Origins {


    "${distro\_id}:${distro\_codename}";


    "${distro\_id}:${distro\_codename}-security";


    "${distro\_id}ESMApps:${distro\_codename}-apps-security";


    "${distro\_id}ESM:${distro\_codename}-infra-security";


    // "${distro\_id}:${distro\_codename}-updates";


    // "${distro\_id}:${distro\_codename}-proposed";


    // "${distro\_id}:${distro\_codename}-backports";


    };


    The Extended Security Maintenance (ESM) origin is not always present for all releases
    but when available it will be used, so no harm done when we keep it there.


    All the packages that you would like to manually update should be added to the
    Unattended-Upgrade::Package-Blacklist section. Whenever the automatic update is
    run, those packages will be excluded from updates. This is particularly useful
    for problematic packages.


    Some packages require a system reboot to finish the installation. You can either
    allow the reboot to occur, or you can manually be rebooting the server.


    In our case, we shall allow the reboot to occur at around 02:00 UTC.


    12


    Unattended-Upgrade::Automatic-Reboot "true"; Unattended-Upgrade::Automatic-Reboot-Time
    "02:00"; All that’s left now is to enable unattended updates by editing (or creating)
    the apt config file: /etc/apt/apt.conf.d/20auto-upgrades and setting how often
    we would like the upgradable packages to be downloaded and how often auto-clean
    should be run.


    APT::Periodic::Update-Package-Lists "1";


    APT::Periodic::Download-Upgradeable-Packages "1"; APT::Periodic::AutocleanInterval
    "7";


    APT::Periodic::Unattended-Upgrade "1";


    That’s it! We are all set with automatic updates.


