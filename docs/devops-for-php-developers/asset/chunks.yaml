    \ `web.php`。\n\n```php\n<?php\n\nuse App\\Http\\Controllers\\PostController;\n\
    use Illuminate\\Support\\Facades\\Route;\n\nRoute::view('/', 'welcome');\nRoute::resource('posts',\
    \ PostController::class);\n```\n\n接下来，编辑 `PostRequest` 以添加验证规则；将 content 字段设置为必填字符串。我们还将在\
