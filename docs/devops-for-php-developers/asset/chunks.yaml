    \    state: present\n```\n\n`ip_local_port_range` 定义了可用和可用的端口，默认通常设置为 32768 -\
    \ 61000。我们将扩大此范围，提供从端口 10000 到端口 65535。\n\n```yaml\n- name: Update available port\
