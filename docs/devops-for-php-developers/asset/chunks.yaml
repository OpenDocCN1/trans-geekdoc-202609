    Automated Deployment with GitLab CI/CD


    SSH Configuration


    For the server to be able to read our repository, we need to get the deploy user’s
    public key and add it as a deployment key on GitLab. Next we shall take the deploy
    user’s private key and add it as a secret CI/CD variable so that our runners can
    be able to login to the server and make the necessary changes. Let’s log in to
    the server!


    $ ssh -p 4033 deploy@123.45.6.78


    $ cat ~/.ssh/id\_rsa.pub


    ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQc... ansible-generated on devops-for-php-developers


    Copy the key and navigate to your GitLab repository -> Settings -> Repository.
    You will find a Deploy Keys section. Expand it and in the form provided, paste
    the key you copied and give it a good title. Once done, click on Add key. This
    will allow the deploy user to be able to fetch the repository from GitLab but
    he cannot push back any changes.


    Next, we can set up the repository secrets that will allow the GitLab runners
    to be able to log in to the server and pull the new changes. Open up the terminal
    and get the private SSH key for the deploy user:


    $ cat ~/.ssh/id\_rsa


    \-----BEGIN RSA PRIVATE KEY-----


    MICDpZGu+H...


    ...gc8bN


    \-----END RSA PRIVATE KEY-----


    Navigate to your repository’s CI/CD settings (Settings -> CI/CD) and expand the
    Variables section. Set the Key as SSH\_KEY, paste the private key in the Value
    section, set the state as protected and save the variable.


    Great! Now the GitLab runners will be able to log in to our server and pull the
    new changes! Let’s set up the directory structure that we will be using in 119


    order to have zero downtime.


    Directory Structure


    In order to have zero downtime, we shall create a symbolic link pointing to the
    latest release of our application and point nginx to the symbolic link.


    Since we will be deploying releases, we will need some of the data to persist
    across releases. In Laravel, the storage directory should persist across releases.
    To achieve that, we will keep a persistent folder that will hold our


    .env file and storage directory. The desired structure will be as below:


    /var/www/app/


    persistent/


    .env


    storage/


    releases/


    20200101000000/


    20200102000000/


    current/ - symbolic link to latest release 20200102000000


    We shall keep a maximum of 5 releases and delete the rest. In case we need something
    old, we can always re-deploy from GitLab.


    120


    Laravel Envoy


    Laravel Envoy will be used to configure our server and generate any new directories
    and releases. It provides a clean, minimal syntax for defining common tasks you
    run on your remote servers. Using Blade style syntax, you can easily setup tasks
    for deployment, Artisan commands, and more.


    We shall instruct it to create the app directories if they are missing and if
    the persistent directory is missing, it should first clone the repository to the
    releases directory, then copy over the needed files and directories to the persistent
    directory. Once the deployment is done, the script should remove the current directory
    and symlink it to the latest release.


    To get started, create a new Envoy.blade.php file at the root of the devops Laravel
    app directory. In this file, we shall define the set of servers we are going to
    deploy to with their corresponding SSH ports. To make the envoy file configurable
    and reusable, we shall execute it with two options; the first will be the GitLab
    repository, and the second will be a JSON encoded list of servers. These two options
    will allow the envoy file to be used across repositories without the need of changing
    the file.


    Before executing anything we shall do some setup. In the setup section, we’ll
    need to validate that the two options have been set. Secondly, we will setup the
    base paths as per our directory structure and check if the persistent storage
    exits so that we can create it if missing. After the setup, we shall define our
    servers list using the json decoded list of servers.


