    Migration;\nuse Illuminate\\Database\\Schema\\Blueprint;\nuse Illuminate\\Support\\\
    Facades\\Schema;\n\nclass CreatePostsTable extends Migration\n{\n    /**\n   \
    \  * Run the migrations.\n     *\n     * @return void\n     */\n    public function\
    \ up()\n    {\n        Schema::create('posts', function (Blueprint $table) {\n\
    \            $table->id();\n            $table->text('content');\n           \
    \ $table->timestamps();\n        });\n    }\n\n    /**\n     * Reverse the migrations.\n\
    \     *\n     * @return void\n     */\n    public function down()\n    {\n   \
    \     Schema::dropIfExists('posts');\n    }\n}\n```\n\nOnce done, we can migrate\
    \ and create the table in our database. Using migrations as the blueprints for\
    \ our database structure is very effective as there is no need of moving SQL files\
    \ with data into GIT and then, to the server.\n\n```\n$ php artisan migrate\n\
    ```\n\n```\nMigrating: 2014_10_12_000000_create_users_table\nMigrated: 2014_10_12_000000_create_users_table\
    \ (40.59ms)\nMigrating: 2014_10_12_100000_create_password_resets_table\nMigrated:\
    \ 2014_10_12_100000_create_password_resets_table (32.51ms)\nMigrating: 2019_08_19_000000_create_failed_jobs_table\n\
    Migrated: 2019_08_19_000000_create_failed_jobs_table (16.03ms)\nMigrating: 2020_10_29_070516_create_posts_table\n\
    Migrated: 2020_10_29_070516_create_posts_table (0.06 seconds)\n```\n\nWe can now\
    \ edit the `PostFactory` under `database/factories` and instruct the factory how\
    \ it can create a Post.\n\n```\n<?php\n\nnamespace Database\\Factories;\n\nuse\
    \ App\\Models\\Post;\nuse Illuminate\\Database\\Eloquent\\Factories\\Factory;\n\
    \nclass PostFactory extends Factory\n{\n    /**\n     * The name of the factory's\
    \ corresponding model.\n     *\n     * @var string\n     */\n    protected $model\
    \ = Post::class;\n\n    /**\n     * Define the model's default state.\n     *\n\
    \     * @return array\n     */\n    public function definition()\n    {\n    \
    \    return [\n            'content' => $this->faker->paragraphs(4, true),\n \
    \       ];\n    }\n}\n```\n\nDone! Now create a new posts feature test. We'll\
