  fmt: "\n# Create MySQL Configuration Files\n\nCreate a new task file `configure.yml`\
    \ under `mysql/tasks` and a new template file `my.cnf.j2` under `mysql/templates`.\
    \ The template will be used to modify the default `my.cnf` file that comes with\
    \ Percona.\n\n## `templates/my.cnf.j2`\n\n```\n[mysqld]\ndefault-authentication-plugin={{\
    \ default_authentication_plugin }}\n\n# Disabling symbolic-links is recommended\
    \ to prevent assorted security risks\nsymbolic-links = 0\n\n# Memory settings.\n\
    max_allowed_packet = {{ mysql_max_allowed_packet }}\nsort_buffer_size = {{ mysql_sort_buffer_size\
    \ }}\nread_buffer_size = {{ mysql_read_buffer_size }}\nkey_buffer_size = {{ mysql_key_buffer_size\
    \ }}\nmyisam_sort_buffer_size = {{ mysql_myisam_sort_buffer_size }}\nread_rnd_buffer_size\
    \ = {{ mysql_read_rnd_buffer_size }}\ntable_open_cache = {{ mysql_table_open_cache\
    \ }}\nmax_connections = {{ mysql_max_connections }}\ngroup_concat_max_len = {{\
    \ mysql_group_concat_max_len }}\nthread_cache_size = {{ mysql_thread_cache_size\
    \ }}\njoin_buffer_size = {{ mysql_join_buffer_size }}\ntmp_table_size = {{ mysql_tmp_table_size\
    \ }}\nmax_heap_table_size = {{ mysql_max_heap_table_size }}\n\n# InnoDB settings.\n\
    innodb_file_per_table = {{ mysql_innodb_file_per_table }}\ninnodb_buffer_pool_size\
    \ = {{ mysql_innodb_buffer_pool_size }}\ninnodb_log_file_size = {{ mysql_innodb_log_file_size\
    \ }}\ninnodb_log_buffer_size = {{ mysql_innodb_log_buffer_size }}\ninnodb_flush_log_at_trx_commit\
    \ = {{ mysql_innodb_flush_log_at_trx_commit }}\ninnodb_lock_wait_timeout = {{\
    \ mysql_innodb_lock_wait_timeout }}\n\n!includedir /etc/mysql/conf.d/\n!includedir\
    \ /etc/mysql/mysql.conf.d/\n```\n\nLet's also add some default values for use\
    \ with a server of about 512MB RAM.\n\nEdit `mysql/defaults/main.yml` and add\
    \ the following variables.\n\n## `defaults/main.yml`\n\n```yaml\n---\n# defaults\
    \ file for mysql\n# caching_sha2_password is the default but most clients are\
    \ not supporting it\ndefault_authentication_plugin: \"mysql_native_password\"\n\
    \nmysql_max_allowed_packet: \"64M\"\nmysql_sort_buffer_size: \"1M\"\nmysql_read_buffer_size:\
    \ \"1M\"\nmysql_key_buffer_size: \"256M\"\nmysql_myisam_sort_buffer_size: \"64M\"\
    \nmysql_read_rnd_buffer_size: \"4M\"\nmysql_table_open_cache: \"256\"\nmysql_max_connections:\
    \ \"151\"\nmysql_group_concat_max_len: \"1024\"\nmysql_thread_cache_size: \"8\"\
    \nmysql_join_buffer_size: \"262144\"\nmysql_tmp_table_size: \"16M\"\nmysql_max_heap_table_size:\
    \ \"16M\"\nmysql_innodb_file_per_table: \"1\"\nmysql_innodb_buffer_pool_size:\
    \ \"256M\"\nmysql_innodb_log_file_size: \"64M\"\nmysql_innodb_log_buffer_size:\
    \ \"8M\"\nmysql_innodb_flush_log_at_trx_commit: \"1\"\nmysql_innodb_lock_wait_timeout:\
    \ \"50\"\nmysql_root_password: \"t00r\"\nmysql_grant_users:\n  - name: \"devops\"\
    \n    password: \"devops\"\n    host: \"localhost\"\n    privileges: \"*.*:All\"\
    \ # '*.*:ALL,GRANT' generates a \"root\" user\n```\n\nWe can now copy the template\
    \ file over to our server and replace the existing one. Once we are done with\
    \ the configurations, we shall restart the MySQL server using the handler we created.\
    \ We shall also ensure that MySQL is started on system boot.\n\nWe'll also create\
    \ extra MySQL users who will have the permissions we need. Add as many as required\
    \ under the `mysql_grant_users` variable. Also set a sensible password for root\
    \ via the role variables. Lastly, we shall perform the secure installation and\
    \ remove the test database and the anonymous user.\n\n## `mysql/tasks/configure.yml`\n\
    \n```yaml\n---\n# mysql/tasks/configure.yml\n- name: Update MySQL Configuration\n\
    \  template:\n    src: my.cnf.j2\n    dest: /etc/mysql/my.cnf\n    owner: root\n\
    \    group: root\n    mode: \"0644\"\n    force: true\n  notify: restart mysql\n\
    \n- name: Enable MySQL on boot\n  service:\n    name: mysql\n    state: started\n\
    \    enabled: true\n\n- name: Disallow remote root login\n  command: 'mysql -NBe\
    \ \"{{ item }}\"'\n  with_items:\n    - DELETE FROM mysql.user WHERE User='root'\
    \ AND Host NOT IN ('localhost', '127.0.0.1', '::1')\n  changed_when: false\n\n\
    - name: Get defined hosts for root\n  command: mysql -NBe \"SELECT Host FROM mysql.user\
    \ WHERE User = 'root' ORDER BY (Host='localhost') ASC\"\n  register: mysql_hosts\n\
    \  changed_when: false\n  check_mode: false\n\n- name: Update MySQL root password\n\
    \  shell: mysql -u root -NBe 'ALTER USER \"root\"@\"{{ item }}\" IDENTIFIED WITH\
    \ mysql_native_password BY \"{{ mysql_root_password }}\";'\n  with_items: \"{{\
    \ mysql_hosts.stdout_lines | default([]) }}\"\n\n- name: Set MySQL root configuration\n\
    \  template:\n    src: \"root-my.cnf.j2\"\n    dest: \"/root/.my.cnf\"\n    owner:\
    \ root\n    group: root\n    mode: \"0600\"\n    force: true\n\n- name: Create\
    \ additional users\n  mysql_user:\n    name: \"{{ item.name }}\"\n    host: \"\
    {{ item.host }}\"\n    password: \"{{ item.password }}\"\n    priv: \"{{ item.privileges\
    \ }}\"\n    state: present\n  loop: \"{{ mysql_grant_users | default([]) }}\"\n\
    \  no_log: true\n\n- name: Get defined hosts for the anonymous user\n  command:\
    \ mysql -NBe 'SELECT Host FROM mysql.user WHERE User = \"\"'\n  register: mysql_anonymous_hosts\n\
    \  changed_when: false\n  check_mode: false\n\n- name: Remove anonymous MySQL\
    \ users\n  mysql_user:\n    name: \"\"\n    host: \"{{ item }}\"\n    state: absent\n\
    \  with_items: \"{{ mysql_anonymous_hosts.stdout_lines | default([]) }}\"\n\n\
    - name: Remove MySQL test database\n  mysql_db:\n    name: test\n    state: absent\n\
    \  notify: restart mysql\n```\n\nThe task above references a `root-my.cnf.j2`\
    \ template file which stores the credentials for the root MySQL user. Create the\
    \ file under `templates` and use the content below.\n\n## `templates/root-my.cnf.j2`\n\
    \n```\n[client]\nuser=\"root\"\npassword=\"{{ mysql_root_password }}\"\n```\n\n\
    All that’s left is to include the two sub-tasks into `mysql/tasks/main.yml`.\n\
    \n## `mysql/tasks/main.yml`\n\n```yaml\n---\n# tasks file for mysql\n- name: Handle\
    \ Percona Installation\n  import_tasks: percona.yml\n\n- name: Configure the database\
    \ engine\n  import_tasks: configure.yml\n```\n\nThat should take care of our MySQL\
    \ server. You should be able to log in to MySQL with the set password, and the\
    \ other created users should also be able to log in.\n\n# The PHP Role\n\nSetting\
    \ up PHP is usually easy. Since we are using PHP 7.4, we have an option of using\
    \ the Debian maintained version or Ondrej’s PPA, but since a lot of people like\
    \ having the flexibility, let’s use the latter. We shall set up PHP, [Composer](https://getcomposer.org/),\
    \ and configure modules like `opcache`.\n\n## Installs Subtask\n\nAdd a new subtask\
    \ `installs.yml` which will hold our installation of PHP and other required binaries.\
    \ We shall compile some modules like `redis` from source. The list of packages\
    \ to be installed will be defined in `php/defaults/main.yml`.\n\n## `php/defaults/main.yml`\n\
    \n```yaml\n---\n# defaults file for php\nphp_version: \"7.4\"\nphp_packages:\n\
    \  - php-pear\n  - \"php{{ php_version }}\"\n  - \"php{{ php_version }}-cli\"\n\
    \  - \"php{{ php_version }}-common\"\n  - \"php{{ php_version }}-curl\"\n  - \"\
    php{{ php_version }}-dev\"\n  - \"php{{ php_version }}-gd\"\n  - \"php{{ php_version\
    \ }}-json\"\n  - \"php{{ php_version }}-mysql\"\n  - \"php{{ php_version }}-opcache\"\
    \n  - \"php{{ php_version }}-readline\"\n  - \"php{{ php_version }}-sqlite3\"\n\
    \  - \"php{{ php_version }}-xml\"\n  - \"php{{ php_version }}-bcmath\"\n  - \"\
    php{{ php_version }}-bz2\"\n  - \"php{{ php_version }}-fpm\"\n  - \"php{{ php_version\
    \ }}-intl\"\n  - \"php{{ php_version }}-mbstring\"\n  - \"php{{ php_version }}-soap\"\
    \n  - \"php{{ php_version }}-xsl\"\n  - \"php{{ php_version }}-zip\"\n  - \"php{{\
    \ php_version }}-imagick\"\n  - imagemagick\n  - libmcrypt-dev\nphp_pecl_install:\n\
    \  - mcrypt\n  - redis\n```\n\nChanging the playbook's `php_version` (defined\
    \ in `site.yml`) will also change the modules that will be installed since we\
    \ are using the variable as a reference in all our modules. You can add as many\
    \ packages above as needed. Each project will have its own specification of extensions\
    \ that will be needed. If image processing will not be required, the image processing\
    \ extensions like `imagick` can be removed.\n\nThere are two extra packages sourced\
    \ from PECL. In our case, `mcrypt` and `redis`. Update `php/tasks/installs.yml`\
    \ subtask and add:\n\n## `php/tasks/installs.yml`\n\n```yaml\n---\n- name: Add\
    \ Ondrej PPA\n  apt_repository:\n    repo: ppa:ondrej/php\n    state: present\n\
    \    update_cache: yes\n    mode: \"0666\"\n```\n"
  trans: "\n# 创建 MySQL 配置文件\n\n在 `mysql/tasks` 下创建一个新的任务文件 `configure.yml`，在 `mysql/templates`\
    \ 下创建一个新的模板文件 `my.cnf.j2`。该模板将用于修改 Percona 自带的默认 `my.cnf` 文件。\n\n## `templates/my.cnf.j2`\n\
