    Preface


    4


    How this book is designed


    Although this book is focusing on PHP, the techniques described here can be applied
    to any other language or deployment, including and not limited to publishing of
    containers, Node.js applications, Ruby etc.


    We''ll mainly focus on a full LEMP (Linux Nginx MySQL PHP) server, that has all
    binaries running in the same server. Depending on your desires, you can have a
    dedicated MySQL instance, and a separate Nginx instance that works as a gateway,
    you will just need to modify the scripts to match your setup.


    You can read this book in any order you prefer. The referenced resources are readily
    available, and some of them are opensource.


    All the shell commands to be executed will be written with a prefix of either
    $


    or # followed by a string of characters, and the output will follow thereafter,
    for example:


    $ echo ''hello world''


    hello world


    5


    Who should read this book?


    Any software developer or administrator can read the book. It is ideal for freelancers,
    startups, entrepreneurs and anyone who works with servers, and a bit of code.


    Since it primarily deals with PHP, you should know the language and understand
    the stack that you are using; whether LAMP or LEMP; and understand a little about
    server setup, ssh and using the terminal.


    6


    Notice of Liability


