- raw: '\- name: Install PHP packages


    apt:


    name: "{{ php\_packages | default(\[\]) }}"


    state: latest


    \- name: Update PECL protocols


    shell: pecl channel-update pecl.php.net


    \- name: Install PECL Packages


    shell: yes '''' | pecl install -s --force {{ item }}


    loop: "{{ php\_pecl\_install }}"


    [Following the programatic installation of composer, create a new script and](https://getcomposer.org/doc/faqs/how-to-install-composer-programmatically.md)


    save it at files/install\_composer.sh, which we shall execute and register the
    output which we shall use to determine if the installation was successful. If
    successful, we shall move the created composer.phar file to


    /usr/local/bin/composer.


    63


    #!/bin/sh


    EXPECTED\_CHECKSUM="$(wget -q -O - https://composer.github.io/installer.sig)"


    php -r "copy(''https://getcomposer.org/installer'', ''composer-setup.php'');"


    ACTUAL\_CHECKSUM="$(php -r "echo hash\_file(''sha384'', ''composer-setup.php'');")"


    if \[ "$EXPECTED\_CHECKSUM" != "$ACTUAL\_CHECKSUM" \]


    then


    \>&2 echo ''ERROR: Invalid installer checksum''


    rm composer-setup.php


    exit 1


    fi


    php composer-setup.php --quiet


    RESULT=$?


    rm composer-setup.php


    exit $RESULT


    Now update the installs subtask and add the composer install task.


    \- name: Install Composer


    script: files/install\_composer.sh


    register: composer\_install\_status


    \- name: Install Composer globally


    command: mv composer.phar /usr/local/bin/composer


    when: composer\_install\_status.changed


    Configure Subtask


    Next, configure the installation by adding a new subtask;


    php/tasks/configure.yml and adding some extra default variables. In Debian/Ubuntu,
    the PHP configuration files are usually symlinked to the mods-available folder
    thus, we shall create our configs in the mods-available folder and symlink them
    to the cli and fpm directories. Add the default variables (php/defaults/main.yml)
    that will be used to generate the custom configs, and the directory to store the
    configs.


    64


    php\_common\_conf\_directory: /etc/php/{{ php\_version }}/mods-available php\_conf\_directories:


    \- /etc/php/{{ php\_version }}/cli/conf.d


    \- /etc/php/{{ php\_version }}/fpm/conf.d


    php\_register\_modules:


    \- name: mcrypt


    priority: 20


    \- name: redis


    priority: 20


    In the default variables above, we’ve added the common mods-available directory
    and the two config directories. These are also dependent on the PHP version. The
    modules we want to register are listed under php\_register\_modules. The priority
    is used in the generation of the filename (priority-name.ini: 20-mcrypt.ini).
    The priority determines the order in which the modules are loaded.


    Next we create the template for the file that will be stored in the mods-available
    folder. Save it as templates/module.ini.j2.


    ; configuration for php {{ item.name }} module


    ; priority={{ item.priority }}


    extension={{ item.name }}.so


    Better be safe than sorry! Let''s add tasks to confirm that the directory for
    PHP custom configs is actually present.


    65


    \---


    \# php/tasks/configure.yml


    \- name: Ensure common configuration directory exist


    file:


    path: "{{ php\_common\_conf\_directory }}"


    state: directory


    follow: true


    \- name: Ensure configuration directories exist


    file:


    path: "{{ item }}"


    state: directory


    follow: true


    loop: "{{ php\_conf\_directories }}"


    Next, we can copy over our configurations. The first configs will be the two modules
    we’ve installed and listed on the defaults file as php\_register\_modules. Append
    the two tasks into configure.yml subtask.


    \- name: Add modules configs


    template:


    dest: "{{ php\_common\_conf\_directory }}/{{ item.name }}.ini"


    src: module.ini.j2


    owner: root


    group: root


    mode: 0644


    loop: "{{ php\_register\_modules }}"


    \- name: Enable modules


    file:


    src: "{{ php\_common\_conf\_directory }}/{{ item.1.name }}.ini"


    dest: "{{ item.0 }}/{{ item.1.priority }}-{{ item.1.name }}.ini"


    state: link


    force: yes


    loop: "{{ php\_conf\_directories | product(php\_register\_modules) | list }}"


    New we give our PHP installation a boost by configuring Opcache. Add some opcache
    default variables that will be used with the opcache template file, opcache.ini.j2.


    66


    opcache\_enable: "1"


    opcache\_enable\_cli: "1"


    opcache\_memory\_consumption: "512"


    opcache\_string\_buffer: "64"


    opcache\_accelerated\_files: "30000"


    opcache\_validate\_timestamps: "0"


    opcache\_fast\_shutdown: "1"


    opcache\_save\_comments: "1"


    I’d advice you to use opcache as it improves PHP performance by storing precompiled
    script bytecode in shared memory, thereby removing the need for PHP to load and
    parse scripts on each request. So once a file has been read and compiled, it’s
    stored in memory and all subsequent request will not need to read the file again.


    Notice: When you disable the validate timestamps option, you will need to restart
    PHP-FPM with every new deployment so that the precompiled scripts are flushed


    And now the opcache.ini.j2 template:


    zend\_extension=opcache.so


    \[opcache\]


    opcache.enable={{ opcache\_enable }}


    opcache.enable\_cli={{ opcache\_enable\_cli }}


    opcache.memory\_consumption={{ opcache\_memory\_consumption }}


    opcache.interned\_strings\_buffer={{ opcache\_string\_buffer }}


    opcache.max\_accelerated\_files={{ opcache\_accelerated\_files }}


    opcache.validate\_timestamps={{ opcache\_validate\_timestamps }}


    opcache.fast\_shutdown={{ opcache\_fast\_shutdown }}


    opcache.save\_comments = {{ opcache\_save\_comments }}


    This template will be used to replace the opcache.ini file located under mods-available
    directory. It is automatically symlinked to the cli and fpm directories so the
    rest of the work is done for us.


    67


    \- name: Setup Opcache


    template:


    dest: "{{ php\_common\_conf\_directory }}/opcache.ini"


    src: opcache.ini.j2


    owner: root


    group: root


    mode: 0644


    Next, we set up our PHP-FPM pools. The default is usually the www pool.


    Create a new template file; www.conf.j2; and add the following pool definitions:


    \[www\]


    user = {{ php\_fpm\_user }}


    group = {{ php\_fpm\_group }}


    listen = /run/php/php{{ php\_version }}-fpm.sock


    listen.owner = {{ php\_fpm\_user }}


    listen.group = {{ php\_fpm\_group }}


    pm = dynamic


    pm.max\_children = {{ php\_pm\_max\_children }}


    pm.start\_servers = {{ php\_pm\_start\_servers }}


    pm.min\_spare\_servers = {{ php\_pm\_min\_spare\_servers }}


    pm.max\_spare\_servers = {{ php\_pm\_max\_spare\_servers }}


    pm.max\_requests = {{ php\_pm\_max\_requests }}


    {% if php\_pm\_enable\_stats %}


    pm.status\_path = {{ php\_pm\_status\_path }}


    {% endif %}


    {% if php\_pm\_enable\_monitoring %}


    ping.path = {{ php\_pm\_ping\_path }}


    ping.response = {{ php\_pm\_ping\_response }}


    {% endif %}


    This pool file will be populated depending on the server requirements. If your
    server does not have enough resources to handle 100 children, setting pm.max\_children
    to 100 will be a joke! Each child usually consumes between 20 - 60 megabytes of
    RAM. Taking a 4GB server with MySQL


    running (~ 1GB RAM) and system resources and other services (~0.5BG), we would
    have approximately 2.5GB of RAM remaining. So we can calculate our max processes
    as 2560/60 = 42.6, give it a round figure of 40.


    68


    Even though we will be using an 8GB RAM server, our system is not that busy, so
    we’ll set the max processes variable to 50. Update the


    php/defaults/main.yml file and add the following variables.


    php\_fpm\_user: "www-data"


    php\_fpm\_group: "www-data"


    php\_pm\_max\_children: "50"


    php\_pm\_start\_servers: "3"


    php\_pm\_min\_spare\_servers: "1"


    php\_pm\_max\_spare\_servers: "5"


    php\_pm\_max\_requests: "500"


    php\_pm\_enable\_stats: true


    php\_pm\_status\_path: "/php\_status"


    php\_pm\_enable\_monitoring: true


    php\_pm\_ping\_path: "/php\_ping"


    php\_pm\_ping\_response: "pong"


    Notice: If you intend to implement User Isolation, set the fpm user to the user
    you created, in our case it was deploy.


    We can now add the task that will handle the deployment of the template and set
    fpm to run on system boot. Append the two tasks into the configure.yml subtask.'
  fmt: "\n# 安装 PHP 包\n\n```yaml\n- name: Install PHP packages\n  apt:\n    name: \"\
    {{ php_packages | default([]) }}\"\n    state: latest\n```\n\n# 更新 PECL 协议\n\n\
    ```yaml\n- name: Update PECL protocols\n  shell: pecl channel-update pecl.php.net\n\
    ```\n\n# 安装 PECL 包\n\n```yaml\n- name: Install PECL Packages\n  shell: yes ''\
    \ | pecl install -s --force {{ item }}\n  loop: \"{{ php_pecl_install }}\"\n```\n\
    \n按照 [Composer 官方文档](https://getcomposer.org/doc/faqs/how-to-install-composer-programmatically.md)\
    \ 中的程序化安装方法，创建一个新脚本并保存为 `files/install_composer.sh`。我们将执行该脚本并注册输出，以此判断安装是否成功。若成功，则将生成的\
    \ `composer.phar` 文件移动至 `/usr/local/bin/composer`。\n\n```bash\n#!/bin/sh\n\nEXPECTED_CHECKSUM=\"\
    $(wget -q -O - https://composer.github.io/installer.sig)\"\n\nphp -r \"copy('https://getcomposer.org/installer',\
    \ 'composer-setup.php');\"\n\nACTUAL_CHECKSUM=\"$(php -r \"echo hash_file('sha384',\
    \ 'composer-setup.php');\")\"\n\nif [ \"$EXPECTED_CHECKSUM\" != \"$ACTUAL_CHECKSUM\"\
    \ ]\nthen\n    >&2 echo 'ERROR: Invalid installer checksum'\n    rm composer-setup.php\n\
    \    exit 1\nfi\n\nphp composer-setup.php --quiet\n\nRESULT=$?\n\nrm composer-setup.php\n\
    \nexit $RESULT\n```\n\n现在更新安装子任务，并添加 Composer 安装任务。\n\n```yaml\n- name: Install\
    \ Composer\n  script: files/install_composer.sh\n  register: composer_install_status\n\
    \n- name: Install Composer globally\n  command: mv composer.phar /usr/local/bin/composer\n\
    \  when: composer_install_status.changed\n```\n\n# 配置子任务\n\n接下来，通过创建 `php/tasks/configure.yml`\
    \ 并添加额外的默认变量来配置安装。在 Debian/Ubuntu 系统中，PHP 配置文件通常符号链接到 `mods-available` 文件夹，因此我们将在该文件夹中创建配置，并将其符号链接到\
    \ `cli` 和 `fpm` 目录。在 `php/defaults/main.yml` 中添加用于生成自定义配置的默认变量及配置存储目录。\n\n```yaml\n\
    php_common_conf_directory: /etc/php/{{ php_version }}/mods-available\nphp_conf_directories:\n\
    \  - /etc/php/{{ php_version }}/cli/conf.d\n  - /etc/php/{{ php_version }}/fpm/conf.d\n\
    \nphp_register_modules:\n  - name: mcrypt\n    priority: 20\n  - name: redis\n\
    \    priority: 20\n```\n\n在上述默认变量中，我们添加了通用的 `mods-available` 目录和两个配置目录，它们均依赖于\
    \ PHP 版本。我们想要注册的模块列在 `php_register_modules` 下。`priority` 用于生成文件名（格式为 `priority-name.ini`，例如\
    \ `20-mcrypt.ini`），并决定模块的加载顺序。\n\n接着，创建存储于 `mods-available` 文件夹中的文件模板，保存为 `templates/module.ini.j2`。\n\
    \n```ini\n; configuration for php {{ item.name }} module\n; priority={{ item.priority\
    \ }}\nextension={{ item.name }}.so\n```\n\n为稳妥起见，添加任务以确认 PHP 自定义配置目录确实存在。\n\n\
    ```yaml\n---\n# php/tasks/configure.yml\n- name: Ensure common configuration directory\
    \ exist\n  file:\n    path: \"{{ php_common_conf_directory }}\"\n    state: directory\n\
    \    follow: true\n\n- name: Ensure configuration directories exist\n  file:\n\
    \    path: \"{{ item }}\"\n    state: directory\n    follow: true\n  loop: \"\
    {{ php_conf_directories }}\"\n```\n\n随后，复制配置文件。首先配置默认文件中 `php_register_modules`\
    \ 列出的两个已安装模块。将以下两个任务追加到 `configure.yml` 子任务中。\n\n```yaml\n- name: Add modules\
    \ configs\n  template:\n    dest: \"{{ php_common_conf_directory }}/{{ item.name\
    \ }}.ini\"\n    src: module.ini.j2\n    owner: root\n    group: root\n    mode:\
    \ 0644\n  loop: \"{{ php_register_modules }}\"\n\n- name: Enable modules\n  file:\n\
    \    src: \"{{ php_common_conf_directory }}/{{ item.1.name }}.ini\"\n    dest:\
    \ \"{{ item.0 }}/{{ item.1.priority }}-{{ item.1.name }}.ini\"\n    state: link\n\
    \    force: yes\n  loop: \"{{ php_conf_directories | product(php_register_modules)\
    \ | list }}\"\n```\n\n现在通过配置 Opcache 来提升 PHP 性能。添加一些 Opcache 默认变量，供 `opcache.ini.j2`\
    \ 模板文件使用。\n\n```yaml\nopcache_enable: \"1\"\nopcache_enable_cli: \"1\"\nopcache_memory_consumption:\
    \ \"512\"\nopcache_string_buffer: \"64\"\nopcache_accelerated_files: \"30000\"\
    \nopcache_validate_timestamps: \"0\"\nopcache_fast_shutdown: \"1\"\nopcache_save_comments:\
    \ \"1\"\n```\n\n建议启用 Opcache，因为它通过将预编译的脚本字节码存储在共享内存中来提高 PHP 性能，从而消除了 PHP 在每次请求时加载和解析脚本的需要。一旦文件被读取并编译，它就会被存储在内存中，后续所有请求都无需再次读取该文件。\n\
    \n> **注意**：禁用 `validate_timestamps` 选项时，每次新部署都需要重启 PHP-FPM，以便刷新预编译脚本。\n\n现在创建\
    \ `opcache.ini.j2` 模板：\n\n```ini\nzend_extension=opcache.so\n\n[opcache]\nopcache.enable={{\
    \ opcache_enable }}\nopcache.enable_cli={{ opcache_enable_cli }}\nopcache.memory_consumption={{\
    \ opcache_memory_consumption }}\nopcache.interned_strings_buffer={{ opcache_string_buffer\
    \ }}\nopcache.max_accelerated_files={{ opcache_accelerated_files }}\nopcache.validate_timestamps={{\
    \ opcache_validate_timestamps }}\nopcache.fast_shutdown={{ opcache_fast_shutdown\
    \ }}\nopcache.save_comments = {{ opcache_save_comments }}\n```\n\n此模板将替换 `mods-available`\
    \ 目录下的 `opcache.ini` 文件。该文件会自动符号链接到 `cli` 和 `fpm` 目录，其余工作自动完成。\n\n```yaml\n- name:\
    \ Setup Opcache\n  template:\n    dest: \"{{ php_common_conf_directory }}/opcache.ini\"\
    \n    src: opcache.ini.j2\n    owner: root\n    group: root\n    mode: 0644\n\
    ```\n\n接下来，设置 PHP-FPM 池。默认通常是 `www` 池。\n\n创建新模板文件 `www.conf.j2`，并添加以下池定义：\n\n\
    ```ini\n[www]\nuser = {{ php_fpm_user }}\ngroup = {{ php_fpm_group }}\nlisten\
    \ = /run/php/php{{ php_version }}-fpm.sock\nlisten.owner = {{ php_fpm_user }}\n\
    listen.group = {{ php_fpm_group }}\npm = dynamic\npm.max_children = {{ php_pm_max_children\
    \ }}\npm.start_servers = {{ php_pm_start_servers }}\npm.min_spare_servers = {{\
    \ php_pm_min_spare_servers }}\npm.max_spare_servers = {{ php_pm_max_spare_servers\
    \ }}\npm.max_requests = {{ php_pm_max_requests }}\n{% if php_pm_enable_stats %}\n\
    pm.status_path = {{ php_pm_status_path }}\n{% endif %}\n{% if php_pm_enable_monitoring\
    \ %}\nping.path = {{ php_pm_ping_path }}\nping.response = {{ php_pm_ping_response\
    \ }}\n{% endif %}\n```\n\n此池配置文件将根据服务器需求填充。如果服务器资源不足以处理 100 个子进程，将 `pm.max_children`\
    \ 设为 100 将毫无意义！每个子进程通常消耗 20-60 MB 内存。以运行 MySQL（约 1 GB 内存）及系统资源和其他服务（约 0.5 GB）的\
    \ 4 GB 服务器为例，剩余约 2.5 GB 内存。最大进程数可估算为 2560/60 ≈ 42.6，取整为 40。\n\n即使我们使用 8 GB 内存的服务器，但系统负载不高，因此将最大进程数变量设为\
    \ 50。更新 `php/defaults/main.yml` 文件，添加以下变量。\n\n```yaml\nphp_fpm_user: \"www-data\"\
    \nphp_fpm_group: \"www-data\"\nphp_pm_max_children: \"50\"\nphp_pm_start_servers:\
