  fmt: "\n## 优化连接限制\n\n由于 `/run/php/php7.4-fpm.sock` 的限制，最大并发连接数受到限制。经过计算，网关仅允许最大\
    \ 512 个连接。这是因为每个客户端连接算作一个入站连接，随后会被转发到上游服务器，这又需要一个出站连接，因此每个客户端占用 2 个打开连接。我们必须调大该值，将软限制和硬限制均设置为\
    \ `999999`。\n\n```yaml\n- name: Set the soft and hard open file limits\n  pam_limits:\n\
    \    domain: \"{{ item.domain }}\"\n    value: \"999999\"\n    limit_item: nofile\n\
    \    limit_type: \"{{ item.type }}\"\n  with_items:\n    - type: soft\n      domain:\
    \ \"*\"\n    - type: hard\n      domain: \"*\"\n    - type: soft\n      domain:\
    \ root\n    - type: hard\n      domain: root\n```\n\n## 添加重启处理程序\n\n添加第一个处理程序，用于监听需要系统重启的事件。在修改软硬文件限制后触发该事件。打开\
    \ `common/handlers/main.yml`：\n\n```yaml\n---\n# handlers file for common\n- name:\
    \ reboot server\n  reboot:\n```\n\n## 完整的优化任务文件\n\n以下是完整的 `common/tasks/optimisations.yml`\
    \ 文件：\n\n```yaml\n---\n- name: Update the maximum concurrent connections\n  sysctl:\n\
    \    name: net.core.somaxconn\n    value: \"100000\"\n    state: present\n\n-\
    \ name: Update available port range\n  sysctl:\n    name: net.ipv4.ip_local_port_range\n\
    \    value: \"1024 65535\"\n    state: present\n\n- name: Allow socket reuse\n\
    \  sysctl:\n    name: net.ipv4.tcp_tw_reuse\n    value: 1\n    reload: yes\n \
    \   state: present\n\n- name: Set the soft and hard open file limits\n  pam_limits:\n\
    \    domain: \"{{ item.domain }}\"\n    value: \"999999\"\n    limit_item: nofile\n\
    \    limit_type: \"{{ item.type }}\"\n  with_items:\n    - type: soft\n      domain:\
    \ \"*\"\n    - type: hard\n      domain: \"*\"\n    - type: soft\n      domain:\
    \ root\n    - type: hard\n      domain: root\n  notify:\n    - reboot server\n\
    ```\n\n## 用户子任务\n\n为了克隆 Git 仓库，我们需要一个用户（当然不是 root）。我倾向于将用户命名为 `deploy`，但你可以创建任何喜欢的用户名。让我们在\
    \ `common/defaults/main.yml` 下添加一些默认变量，然后在 `common/tasks/users.yml` 中编写用户创建任务。\n\
    \n```yaml\ndeploy_user: \"deploy\"\ndeploy_user_generate_ssh_key: true\ndeploy_user_shell:\
    \ \"/bin/bash\"\ndeploy_user_local_ssh_keys:\n  - ~/.ssh/id_rsa.pub\ndeploy_user_groups:\n\
    \  - www-data\n```\n\n> **注意**：由于该用户需要处理 Web 服务器文件，我们将其添加到 `www-data` 组。我们未实施用户隔离。如果你打算实施，请修改附加到\
    \ `deploy` 用户的组。\n\n使用 Ansible `user` 模块创建新用户，并生成将被 CI/CD 流水线使用的 SSH 密钥对。我们还将使用\
    \ `authorized_key` 模块复制本地公钥以实现无密码登录。同时，我们希望允许 `deploy` 用户在从 GitLab 使用 CI/CD 流水线时以自己的身份登录。\n\
    \n```yaml\n---\n# tasks for users.yml\n- name: Create the deploy user groups\n\
    \  group:\n    name: \"{{ item }}\"\n    state: present\n  loop: \"{{ deploy_user_groups\
    \ | default([], true) }}\"\n\n- name: Create the deploy user\n  user:\n    name:\
    \ \"{{ deploy_user }}\"\n    groups: \"{{ (deploy_user_groups | default([], true)\
    \ | join(',')) }}\"\n    generate_ssh_key: \"{{ deploy_user_generate_ssh_key }}\"\
    \n    shell: \"{{ deploy_user_shell }}\"\n  register: created_user\n\n- name:\
    \ Add GitLab to known hosts\n  lineinfile:\n    dest: \"/home/{{ deploy_user }}/.ssh/known_hosts\"\
    \n    create: yes\n    state: present\n    line: \"{{ lookup('pipe', 'ssh-keyscan\
    \ -t rsa gitlab.com') }}\"\n    regexp: \"^gitlab\\\\.com\"\n    mode: 0600\n\n\
    - name: Allow SSH key based logins\n  authorized_key:\n    user: \"{{ deploy_user\
    \ }}\"\n    key: \"{{ lookup('file', item) }}\"\n    state: present\n  loop: \"\
    {{ deploy_user_local_ssh_keys | default([], true) }}\"\n\n- name: Allow Deploy\
    \ User to Login\n  authorized_key:\n    user: \"{{ deploy_user }}\"\n    key:\
    \ \"{{ created_user['ssh_public_key'] }}\"\n    state: present\n```\n\n运行 Playbook\
    \ 查看更改是否按预期应用。Playbook 运行后，尝试以创建的用户身份登录（在本例中为 `deploy` 用户）：`ssh deploy@123.45.6.78`。你应该能够成功无密码登录。\n\
    \n## 安全子任务\n\n让我们加强服务器安全！首先我喜欢修改默认 SSH 端口。我们还安装了 UFW（简单防火墙）来过滤允许接受和丢弃的连接。\n\n\
    添加一些新的默认变量。`ufw_allow` 变量将包含要使用的端口和协议（tcp/udp），可包含任意数量的端口。\n\n```yaml\nssh_port:\
    \ \"4033\"\nufw_allow:\n  - port: 80\n    proto: tcp\n  - port: 443\n    proto:\
    \ tcp\n```\n\n然后在 `common/tasks/security.yml` 中添加任务：\n\n```yaml\n---\n# tasks\
    \ for security\n- name: Update the SSH port\n  lineinfile:\n    path: /etc/ssh/sshd_config\n\
    \    regexp: \"^#?Port \"\n    line: \"Port {{ ssh_port }}\"\n\n- name: Allow\
    \ SSH traffic through firewall\n  ufw:\n    rule: allow\n    port: \"{{ ssh_port\
    \ }}\"\n    proto: tcp\n\n- name: Allow traffic through firewall\n  ufw:\n   \
    \ rule: allow\n    port: \"{{ item.port }}\"\n    proto: \"{{ item.proto }}\"\n\
    \  loop: \"{{ ufw_allow | default([], true) | list }}\"\n\n- name: Restart SSH\n\
    \  service:\n    name: ssh\n    state: restarted\n\n- name: Ensure we use the\
    \ configured SSH port for the remainder of the role\n  set_fact:\n    ansible_port:\
    \ \"{{ ssh_port }}\"\n\n- name: Start UFW\n  ufw:\n    direction: incoming\n \
    \   state: enabled\n    policy: deny\n```\n\n你会注意到，我们在 `Ensure we use the configured\
    \ SSH port for the remainder of the role` 任务下更新了 `ansible_port` 事实。这使得 Ansible\
    \ 在我们将默认 SSH 端口更改为 `4033` 后，能继续执行该角色的其余部分。如果使用其他防火墙，请确保在更改端口前该端口已开放，否则任务将失败。\n\
    \n如果尝试使用默认 SSH 命令连接，除非指定端口，否则将失败。要以之前创建的 `deploy` 用户身份连接，请在 SSH 命令中添加 `-p 4033`。你也可以为此连接创建别名，或在本地\
    \ SSH 配置 `~/.ssh/config` 中添加主机：\n\n```bash\n$ ssh -p 4033 deploy@123.45.6.78\n\
    \n# 使用别名\n$ echo 'alias devops=\"ssh -p 4033 deploy@123.45.6.78\"' >> ~/.bashrc\n\
    $ source ~/.bashrc\n$ devops # 这将调用上述别名\n\n# 使用 ssh config\n$ vi ~/.ssh/config\n\
    Host devops\n  Hostname 123.45.6.78\n  Port 4033\n  User deploy\n$ ssh devops\
    \ # 这将使用 devops 配置\n```\n\n> **注意**：如果你在每次更改后运行 Playbook，需要将 `ansible_port` 变量添加到\
    \ Ansible 清单主机文件中，待整个 Playbook 完成后再将其移除，以便新服务器获得正确配置。\n\n使用 INI 格式：\n```ini\n\
    123.45.6.78 ansible_user=root ansible_port=4033\n```\n\n`common` 角色完成！\n\n## MySQL\
    \ 角色\n\n### Percona 子任务\n\n在 `mysql` 角色目录下，创建一个新的 `percona.yml` 文件并放入 `tasks`\
