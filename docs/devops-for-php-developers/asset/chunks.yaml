    \ = $releasesDir .'/'. $release;\n\n$persistentStorageExists = is\\_dir($persistentDir\
    \ . '/storage');\n\n@endsetup\n\n@servers($servers)\n\n@story('deploy')\n\ncloneRelease\n\
    \nlinkPersistentStorage\n\ninstallDependencies\n\noptimiseRelease\n\nactivateRelease\n\
    \n@endstory\n\n123\n\n@task('cloneRelease')\n\necho 'Cloning repository into release\
    \ {{ $release }}'\n\n\\[ -d {{ $releasesDir }} \\] || mkdir -p {{ $releasesDir\
    \ }}\n\ncd {{ $releasesDir }}\n\ngit clone -b master --depth 1 {{ $repo }} {{\
    \ $release }}\n\n@if(!$persistentStorageExists)\n\nmkdir -p {{ $persistentDir\
    \ }}/storage\n\ncp -rf {{ $newReleaseDir }}/storage {{ $persistentDir }}\n\n@endif\n\
    \nrm -rf {{ $newReleaseDir }}/storage\n\n@endtask\n\n@task('linkPersistentStorage')\n\
    \necho 'Link Persistent Storage'\n\nln -nfs {{ $persistentDir }}/.env {{ $newReleaseDir\
    \ }}/.env ln -nfs {{ $persistentDir }}/storage {{ $newReleaseDir }}/storage\n\n\
    @endtask\n\n@task('installDependencies')\n\necho \"Installing Dependencies\"\n\
    \ncd {{ $newReleaseDir }}\n\ncomposer install --no-dev --prefer-dist -q -o\n\n\
    @endtask\n\n@task('optimiseRelease')\n\necho 'Linking public storage directory'\n\
    \ncd {{ $newReleaseDir }}\n\nphp artisan storage:link\n\necho 'Migrating Database'\n\
    \nphp artisan migrate --force\n\necho 'Caching routes and configs'\n\nphp artisan\
    \ route:cache\n\nphp artisan config:cache\n\n@endtask\n\n@task('activateRelease')\n\
    \necho 'Linking current release'\n\nrm -rf {{ $appDir }}\n\nln -nfs {{ $newReleaseDir\
    \ }} {{ $appDir }}\n\n124\n\nsudo service php7.4-fpm restart\n\n{{-- echo 'Restarting\
    \ Horizon' --}}\n\n{{-- php artisan horizon:terminate --}}\n\necho 'Removing old\
    \ releases'\n\ncd {{ $releasesDir }}\n\necho 'Current Releases:'\n\nls\n\necho\
    \ 'Releases to remove:'\n\nls | head -n -6\n\nif (($(ls | head -n -6 | wc -l)\
    \ > 0)); then rm -rf $(ls | head -n -6); fi\n\n@endtask\n\nGreat! We now have\
    \ a working script that will handle our deployment.\n\nHowever, we are missing\
    \ the production env file and a database.\n\nWhile in the Laravel app directory,\
    \ generate a new application key then open up the .env file, SSH to the server\
    \ and create a new .env file in the persistent folder. In the new file, paste\
    \ the local .env content, then update the values as desired. Update the database\
    \ configuration to match the database user and database name (either present or\
    \ to be created). Our ansible script already created the /var/app/current directory\
    \ and updated Nginx to point to it, so nothing needs to be done there.\n\n125\n\
    \n$ php artisan key:generate\n\n$ cat .env\n\nAPP\\_NAME=Laravel\n\nAPP\\_ENV=local\n\
    \n. . .\n\n$ ssh -p 4033 deploy@123.45.6.78\n\nWelcome to Ubuntu 18.04.3 LTS (GNU/Linux\
    \ 4.15.0-70-generic x86\\_64)\n\n. . .\n\n$ mkdir -p /var/www/app/persistent\n\
    \n$ vi /var/www/app/persistent/.env\n\n\\# paste the content\n\n\\# update the\
    \ variables\n\n. . .\n\nDB\\_DATABASE=posts\n\nDB\\_USERNAME=devops # username\
    \ and password from the mysql ansible role DB\\_PASSWORD=devops\n\nBROADCAST\\\
    _DRIVER=log\n\nCACHE\\_DRIVER=redis\n\nQUEUE\\_CONNECTION=sync\n\nSESSION\\_DRIVER=redis\n\
    \n. . .\n\n$ mysql -u root -p\n\nEnter password: #enter the root password set\
    \ by ansible\n\nWelcome to the MySQL monitor. Commands end with ; or \\\\g.\n\n\
    mysql> create database posts;\n\nQuery OK, 1 row affected (0.00 sec)\n\nmysql>\
    \ exit;\n\nBye\n\nThat’s it for the pre-deployment setup. Now we need to configure\
    \ our GitLab CI/CD to call envoy and update our codebase.\n\n126\n\nDeployment\n\
    \nBefore we can deploy our new batch of changes, we need to add one more change\
    \ to our routes file. Closures are not serializable thus, we need to remove all\
    \ closures from our route files in order to cache them using php artisan route:cache.\
    \ Open up routes/api.php and comment out the\n\n/user endpoint.\n\n// Route::middleware('auth:api')->get('/user',\
    \ function (Request $request) {\n\n// return $request->user();\n\n// });\n\nNext,\
    \ we need to update our GitLab YAML file to include the call to Laravel Envoy.\
    \ We had added one secret in the CI/CD variables which defined the private key\
    \ of the deploy user that will allow the GitLab runners to log in to the servers\
    \ and make changes using the envoy script. We will need to add a new variable\
    \ that will hold our list of servers, call it ENVOY\\_HOSTS. The value should\
    \ be a JSON string of the servers you want to deploy to, for example:\n\n\\[{\"\
    web\": \"deploy@123.45.6.78 -p 4033\"}\\]\n\nUse as many hosts as needed in the\
    \ array. Next, let’s update the .gitlab-ci.yml file and setup the SSH agent and\
    \ the private key that will be used to login to the server. Finally, we'll execute\
    \ envoy and pass the repository and the servers list as parameters.\n\nimage:\
    \ smodav/php74:latest\n\nservices:\n\n\\- name: redis:latest\n\nalias: redis\n\
    \n\\- name: mysql:8\n\nalias: mysql\n\ncommand: \\[\"--default-authentication-plugin=mysql\\\
    _native\\_password\"\\]\n\nvariables:\n\nMYSQL\\_DATABASE: homestead\n\nMYSQL\\\
    _ROOT\\_PASSWORD: secret\n\nDB\\_DATABASE: homestead\n\n127\n\n DB\\_HOST: mysql\n\
    \nDB\\_USERNAME: root\n\nDB\\_PASSWORD: secret\n\nREDIS\\_HOST: redis\n\nREDIS\\\
    _PORT: 6379\n\nstages:\n\n\\- test\n\n\\- deploy\n\nbefore\\_script:\n\n\\- php\
    \ -v\n\nfeature\\_tests:\n\nstage: test\n\nscript:\n\n\\- cp .env.example .env\n\
    \n\\- composer install\n\n\\- php artisan key:generate\n\n\\- composer test\n\n\
    deploy\\_production:\n\nstage: deploy\n\nscript:\n\n\\- 'which ssh-agent || (apt-get\
    \ update -y && apt-get install openssh-client\n\n\\-y)'\n\n\\- eval $(ssh-agent\
    \ -s)\n\n\\- ssh-add <(echo \"$SSH\\_KEY\")\n\n\\- mkdir -p ~/.ssh\n\n\\- '\\\
    [\\[ -f /.dockerenv \\]\\] && echo -e \"Host \\*\\\\n\\\\tStrictHostKeyChecking\
    \ no\\\\n\\\\n\" > ~/.ssh/config'\n\n\\- ~/.config/composer/vendor/bin/envoy run\
    \ deploy --repo=$CI\\_REPOSITORY\\_URL\n\n\\--servers=\"$ENVOY\\_HOSTS\"\n\nwhen:\
    \ manual #only for those who want “semi-CI/CD”\n\nonly:\n\n\\- master\n\nThat\
    \ should do it! All that’s left is to create a new commit and let the runners\
    \ do their magic. The manual deployment section is only if you have set when:\
    \ manual.\n\n128\n\n![](index-129_1.png)\n\nManual Deployment\n\nOnce the first\
    \ stage of the pipeline completes, you should be able to run the manual deployment\
    \ stage. This stage can be re-run as many times as needed.\n\nWe can now go to\
    \ our server and see if we have been successful in our endeavour. Open up your\
    \ browser and navigate to you IP address: 123.45.6.78. You should be greeted by\
    \ the Laravel Welcome page.\n\nTo test if our CI/CD pipeline really works, let’s\
    \ change the Laravel welcome page to read DevOps is Awesome! instead of Laravel\
    \ has wonderful...\n\nthen deploy it.\n\n<div class=\"p-6\">\n\n<div class=\"\
    flex items-center\">\n\n<svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"\
    round\" stroke-linejoin=\"round\" stroke-width=\"2\" viewBox=\"0 0 24 24\" class=\"\
    w-8 h-8 text-gray-500\"><path d=\"M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168\
    \ 5.477 3\n\n6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168\
    \ 5.477\n\n14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247\
    \ 18 16.5\n\n18c-1.746 0-3.332.477-4.5 1.253\"></path></svg>\n\n<div class=\"\
    ml-4 text-lg leading-7 font-semibold\"><a href=\"https://laravel.com/docs\" class=\"\
    underline text-gray-900 dark:text-white\">Documentation</a></div>\n\n</div>\n\n\
    <div class=\"ml-12\">\n\n<div class=\"mt-2 text-gray-600 dark:text-gray-400 text-sm\"\
    > DevOps is Awesome!\n\n</div>\n\n</div>\n\n</div>\n\nLet’s add a new commit:\n\
    \n129\n\n$ git add .\n\n$ git commit -m \"changes greeting message\"\n\n$ git\
    \ push origin master\n\nWe can now head to the GitLab CI/CD pipelines and deploy\
    \ the manual job if using semi-CI/CD, and watch it work. Once the job has completed\
    \ successfully, head over to your IP Address and confirm the changes are live."
  fmt: "\n# Laravel Envoy 部署脚本与 CI/CD 配置\n\n参考 [Laravel Horizon 文档](https://laravel.com/docs/horizon#deploying-horizon)。完整的\
    \ `Envoy.blade.php` 文件如下：\n\n```blade\n@setup\nif (!$repo || !$servers) {\n  \
    \  exit('The repo and servers parameter is required');\n}\n\n$servers = json_decode($servers,\
    \ true, JSON_THROW_ON_ERROR);\nif (!$servers || count($servers) < 1) {\n    exit('servers\
    \ parameter should be a valid json array of servers.');\n}\n\n$persistentDir =\
    \ '/var/www/app/persistent';\n$releasesDir = '/var/www/app/releases';\n$appDir\
    \ = '/var/www/app/current';\n$release = date('YmdHis');\n$newReleaseDir = $releasesDir\
    \ . '/' . $release;\n$persistentStorageExists = is_dir($persistentDir . '/storage');\n\
    @endsetup\n\n@servers($servers)\n\n@story('deploy')\n    cloneRelease\n    linkPersistentStorage\n\
    \    installDependencies\n    optimiseRelease\n    activateRelease\n@endstory\n\
    \n@task('cloneRelease')\necho 'Cloning repository into release {{ $release }}'\n\
    [ -d {{ $releasesDir }} ] || mkdir -p {{ $releasesDir }}\ncd {{ $releasesDir }}\n\
    git clone -b master --depth 1 {{ $repo }} {{ $release }}\n\n@if(!$persistentStorageExists)\n\
    mkdir -p {{ $persistentDir }}/storage\ncp -rf {{ $newReleaseDir }}/storage {{\
    \ $persistentDir }}\n@endif\n\nrm -rf {{ $newReleaseDir }}/storage\n@endtask\n\
    \n@task('linkPersistentStorage')\necho 'Link Persistent Storage'\nln -nfs {{ $persistentDir\
    \ }}/.env {{ $newReleaseDir }}/.env\nln -nfs {{ $persistentDir }}/storage {{ $newReleaseDir\
    \ }}/storage\n@endtask\n\n@task('installDependencies')\necho \"Installing Dependencies\"\
    \ncd {{ $newReleaseDir }}\ncomposer install --no-dev --prefer-dist -q -o\n@endtask\n\
    \n@task('optimiseRelease')\necho 'Linking public storage directory'\ncd {{ $newReleaseDir\
    \ }}\nphp artisan storage:link\n\necho 'Migrating Database'\nphp artisan migrate\
    \ --force\n\necho 'Caching routes and configs'\nphp artisan route:cache\nphp artisan\
    \ config:cache\n@endtask\n\n@task('activateRelease')\necho 'Linking current release'\n\
    rm -rf {{ $appDir }}\nln -nfs {{ $newReleaseDir }} {{ $appDir }}\n\nsudo service\
    \ php7.4-fpm restart\n\n{{-- echo 'Restarting Horizon' --}}\n{{-- php artisan\
    \ horizon:terminate --}}\n\necho 'Removing old releases'\ncd {{ $releasesDir }}\n\
    echo 'Current Releases:'\nls\necho 'Releases to remove:'\nls | head -n -6\nif\
    \ (($(ls | head -n -6 | wc -l) > 0)); then rm -rf $(ls | head -n -6); fi\n@endtask\n\
    ```\n\n现在我们有了一个可工作的部署脚本。\n\n## 生产环境配置\n\n然而，我们还缺少生产环境的 `.env` 文件和数据库。\n\n在 Laravel\
    \ 应用目录下生成新的应用密钥，然后打开 `.env` 文件，通过 SSH 连接到服务器，在 `persistent` 文件夹中创建新的 `.env` 文件。在新文件中粘贴本地\
    \ `.env` 内容，然后按需更新值。更新数据库配置以匹配数据库用户和数据库名称（无论是已存在的还是待创建的）。我们的 Ansible 脚本已经创建了 `/var/app/current`\
    \ 目录并更新了 Nginx 指向它，因此那里无需额外操作。\n\n```bash\n$ php artisan key:generate\n$ cat .env\n\
    APP_NAME=Laravel\nAPP_ENV=local\n...\n$ ssh -p 4033 deploy@123.45.6.78\nWelcome\
    \ to Ubuntu 18.04.3 LTS (GNU/Linux 4.15.0-70-generic x86_64)\n...\n$ mkdir -p\
    \ /var/www/app/persistent\n$ vi /var/www/app/persistent/.env\n# paste the content\n\
    # update the variables\n...\nDB_DATABASE=posts\nDB_USERNAME=devops # username\
    \ and password from the mysql ansible role\nDB_PASSWORD=devops\nBROADCAST_DRIVER=log\n\
    CACHE_DRIVER=redis\nQUEUE_CONNECTION=sync\nSESSION_DRIVER=redis\n...\n$ mysql\
    \ -u root -p\nEnter password: #enter the root password set by ansible\nWelcome\
    \ to the MySQL monitor. Commands end with ; or \\g.\nmysql> create database posts;\n\
    Query OK, 1 row affected (0.00 sec)\nmysql> exit;\nBye\n```\n\n预部署设置到此完成。现在我们需要配置\
    \ GitLab CI/CD 来调用 Envoy 并更新代码库。\n\n## 部署流程配置\n\n在部署新变更之前，我们需要对路由文件进行一项更改。闭包不可序列化，因此我们需要从路由文件中移除所有闭包，以便使用\
    \ `php artisan route:cache` 进行缓存。打开 `routes/api.php` 并注释掉 `/user` 端点。\n\n```php\n\
    // Route::middleware('auth:api')->get('/user', function (Request $request) {\n\
    //     return $request->user();\n// });\n```\n\n接下来，我们需要更新 GitLab YAML 文件以包含对\
    \ Laravel Envoy 的调用。我们已经在 CI/CD 变量中添加了一个密钥，定义了允许 GitLab Runner 登录服务器并使用 Envoy\
    \ 脚本进行更改的部署用户私钥。我们需要添加一个新变量来保存服务器列表，称之为 `ENVOY_HOSTS`。其值应为要部署的服务器的 JSON 字符串，例如：\n\
    \n```json\n[{\"web\": \"deploy@123.45.6.78 -p 4033\"}]\n```\n\n数组中可根据需要使用任意数量的主机。接下来，让我们更新\
    \ `.gitlab-ci.yml` 文件，设置 SSH agent 和用于登录服务器的私钥。最后，我们将执行 `envoy` 并将仓库地址和服务器列表作为参数传递。\n\
    \n```yaml\nimage: smodav/php74:latest\nservices:\n  - name: redis:latest\n   \
    \ alias: redis\n  - name: mysql:8\n    alias: mysql\n    command: [\"--default-authentication-plugin=mysql_native_password\"\
    ]\nvariables:\n  MYSQL_DATABASE: homestead\n  MYSQL_ROOT_PASSWORD: secret\n  DB_DATABASE:\
    \ homestead\n  DB_HOST: mysql\n  DB_USERNAME: root\n  DB_PASSWORD: secret\n  REDIS_HOST:\
    \ redis\n  REDIS_PORT: 6379\nstages:\n  - test\n  - deploy\nbefore_script:\n \
    \ - php -v\nfeature_tests:\n  stage: test\n  script:\n    - cp .env.example .env\n\
    \    - composer install\n    - php artisan key:generate\n    - composer test\n\
    deploy_production:\n  stage: deploy\n  script:\n    - 'which ssh-agent || (apt-get\
    \ update -y && apt-get install openssh-client -y)'\n    - eval $(ssh-agent -s)\n\
    \    - ssh-add <(echo \"$SSH_KEY\")\n    - mkdir -p ~/.ssh\n    - '[[ -f /.dockerenv\
    \ ]] && echo -e \"Host *\\n\\tStrictHostKeyChecking no\\n\\n\" > ~/.ssh/config'\n\
    \    - ~/.config/composer/vendor/bin/envoy run deploy --repo=$CI_REPOSITORY_URL\
    \ --servers=\"$ENVOY_HOSTS\"\n  when: manual #only for those who want “semi-CI/CD”\n\
    \  only:\n    - master\n```\n\n搞定！剩下的就是创建一个新提交，让 Runner 施展魔法。手动部署部分仅在设置了 `when:\
    \ manual` 时生效。\n\n![Manual Deployment](index-129_1.png)\n\n### 手动部署\n\n首个流水线阶段完成后，即可运行手动部署阶段。该阶段可根据需要重复运行多次。\n\
    \n现在我们可以访问服务器验证是否成功。打开浏览器访问 IP 地址 `123.45.6.78`，应该会看到 Laravel 欢迎页。\n\n为了测试 CI/CD\
    \ 流水线是否真正工作，让我们将 Laravel 欢迎页的文字从 \"Laravel has wonderful...\" 修改为 \"DevOps is\
    \ Awesome!\"，然后部署。\n\n```html\n<div class=\"p-6\">\n  <div class=\"flex items-center\"\
    >\n    <svg fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"\
    round\" stroke-width=\"2\" viewBox=\"0 0 24 24\" class=\"w-8 h-8 text-gray-500\"\
    >\n      <path d=\"M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3\
    \ 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477\
    \ 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5\
    \ 18c-1.746 0-3.332.477-4.5 1.253\"></path>\n    </svg>\n    <div class=\"ml-4\
    \ text-lg leading-7 font-semibold\"><a href=\"https://laravel.com/docs\" class=\"\
    underline text-gray-900 dark:text-white\">Documentation</a></div>\n  </div>\n\
    \  <div class=\"ml-12\">\n    <div class=\"mt-2 text-gray-600 dark:text-gray-400\
    \ text-sm\"> DevOps is Awesome! </div>\n  </div>\n</div>\n```\n\n提交变更：\n\n```bash\n\
    $ git add .\n$ git commit -m \"changes greeting message\"\n$ git push origin master\n\
    ```\n\n现在前往 GitLab CI/CD 流水线，如果使用半自动 CI/CD 则部署手动任务，观察其运行。任务成功完成后，访问你的 IP 地址确认变更已上线。\n"
