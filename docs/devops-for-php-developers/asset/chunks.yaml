- raw: 'We shall chain our commands using the && operator and terminate our long lines
    using a backslash. When making Docker images, always make sure you clean out after
    performing apt requests as this will keep the image small.


    [We will use the RUN directive to do the installs.](https://docs.docker.com/engine/reference/builder/#run)


    109


    Let’s get going. We shall follow similar steps to what we had when building up
    our server.


    FROM ubuntu:20.04


    LABEL maintainer="David Mjomba <smodavprivate@gmail.com>"


    ENV DEBIAN\_FRONTEND noninteractive


    ENV PHP\_VERSION 7.4


    RUN apt update && \\


    apt install -y software-properties-common curl \\


    inetutils-syslogd build-essential pkg-config && \\


    LC\_ALL=C.UTF-8 apt-add-repository ppa:ondrej/php -y && \\ apt-get update && apt
    install -y \\


    php-pear \\


    php-gettext \\


    php-ast \\


    php${PHP\_VERSION} \\


    php${PHP\_VERSION}-bcmath \\


    php${PHP\_VERSION}-bz2 \\


    php${PHP\_VERSION}-curl \\


    php${PHP\_VERSION}-cli \\


    php${PHP\_VERSION}-dev \\


    php${PHP\_VERSION}-fpm \\


    php${PHP\_VERSION}-gd \\


    php${PHP\_VERSION}-intl \\


    php${PHP\_VERSION}-json \\


    php${PHP\_VERSION}-mbstring \\


    php${PHP\_VERSION}-mysql \\


    php${PHP\_VERSION}-readline \\


    php${PHP\_VERSION}-soap \\


    php${PHP\_VERSION}-sqlite3 \\


    php${PHP\_VERSION}-xml \\


    php${PHP\_VERSION}-xsl \\


    php${PHP\_VERSION}-zip \\


    zip unzip g++ gcc git libmcrypt-dev libbz2-dev libmagickwand-dev \\ mcrypt imagemagick
    && \\


    apt autoremove -y && \\


    apt-get clean && \\


    rm -rf /var/lib/apt/lists/\* && \\


    pecl install imagick mcrypt redis && \\


    curl --silent --show-error https://getcomposer.org/installer | php -- --


    install-dir=/usr/local/bin --filename=composer && \\ composer global require laravel/envoy


    110


    The image we’re building will only have PHP since we are only going to run the
    PHP cli and use it to run Composer, PHPUnit and Laravel Envoy. If you do not have
    a [Docker Hub account, go ahead and create one. Once done, we](https://hub.docker.com/)


    shall login to Docker Hub to be able to publish our container image. I prefer
    using Docker Hub over gitlab registry since it is available to all repositories
    and can also be shared by other people. Let’s get going! Run docker login and
    enter your hub credentials.


    $ docker login


    Username: awesome\_dude


    Password:


    Login Succeeded


    We can now build our docker image and tag it as the latest. Make sure you are
    in the directory that contains the Dockerfile then build, tag and publish the
    docker image. Replace docker\_username with your actual Docker username and php74
    with the PHP version you have used.


    $ docker build -t docker\_username/php74:latest .


    ...


    $ docker push docker\_username/php74


    The push refers to repository ...


    5bd5ae06fb33: Pushed


    ...


    latest: digest: sha256:a80f55a4c34419490034e6...


    In the first command, we set the context to the current directory by using the
    full stop at the end of the command. In case you wanted to build the container,
    and you were in a different directory than the Dockerfile, then you would replace
    the full stop with the path to the Dockerfile.


    Once you’ve successfully built and deployed, you should be able to see a new php74
    [repository under https://hub.docker.com/repositories tagged as](https://hub.docker.com/repositories)


    latest. We can now use this image to run our gitlab tests.


    Generating the .gitlab-ci.yml


    Now that we have some tests and a docker image, we can enable Gitlab 111


    CI/CD on our repository. Navigate to the devops Laravel project and create a new
    file, .gitlab-ci.yml. The YAML basics that were used with ansible will still be
    used on the .gitlab-ci.yml file.


    $ touch .gitlab-ci.yml


    The first directive we shall use is image, which instructs GitLab to pull a certain
    image and perform the tasks that follow on it. Let’s use the docker image we created:


    image: docker\_username/php74:latest


    Next, we have to figure out what other service our system will require. If we
    required redis and/or MySQL, we would need to pull them in as below, using MySQL
    8 with the native password as the default authentication plugin. To set up these
    services, as you might have guessed, we shall use the services directive. The
    GitLab pipeline will first boot up the services, before it boots up the docker
    image we specified above. Let’s get cracking!


    services:


    \- name: redis:latest


    alias: redis


    \- name: mysql:8


    alias: mysql


    command: \[“--default-authentication-plugin=mysql\_native\_password"\]


    We have aliased our services so that we can use them as environment variablea.
    Speaking of environment variables, let’s update them to match our current environment.
    We’ll use the variables directive and update the .env variables:


    112


    variables:


    MYSQL\_DATABASE: homestead


    MYSQL\_ROOT\_PASSWORD: secret


    DB\_DATABASE: homestead


    DB\_HOST: mysql


    DB\_USERNAME: root


    DB\_PASSWORD: secret


    REDIS\_HOST: redis


    REDIS\_PORT: 6379


    Looking at the [official MySQL Docker Image docs](https://hub.docker.com/_/mysql),
    we get some variables that can be used to set up the container when it runs: MYSQL\_ROOT\_PASSWORD


    sets the root password to be used and MYSQL\_DATABASE sets the database to be
    created once the service has booted. These two are also mapped to the DB\_PASSWORD
    and DB\_DATABASE env variables that are used by Laravel. The DB\_USERNAME will
    be root and if you have noticed, we changed the DB\_HOST to mysql to match the
    alias we used on the MySQL


    service. We have also set the REDIS\_HOST to redis; the alias of the redis service;
    and the REDIS\_PORT to 6379; the default redis port.


    Next, we shall define the jobs that make up the pipeline. Each job is treated
    independently and some jobs can:


    be allowed to fail,


    run only on a single branch,


    only be manually triggered etc.


    In situations where the preceding job is not allowed to fail; then it fails; the
    next job will not be executed. In our case, we shall have two Jobs: test and deploy.


    stages:


    \- test


    \- deploy


    It’s always nice to print out some debug information before running any scrips.
    For now, let’s print the PHP version before running the script: 113


    before\_script:


    \- php -v


    We shall now run our feature tests to confirm that our app is fully functional.


    feature\_tests:


    stage: test


    script:


    \- cp .env.example .env


    \- composer install


    \- php artisan key:generate


    \- composer test


    In our feature test job, we have first assigned it to the test stage, then we
    have defined the console commands to be run. Since it’s a fresh clone of the repository,
    we first make a new .env file, run composer install, generate the application
    key then run or predefined composer script which in turn runs the test.


    Since we have a redis service, we can set our cache and session drivers to redis.
    This can either be done at the variables level or by updating the


    .env.example file. I prefer updating the .env.example since it will be used by
    anyone who clones the repository.


    BROADCAST\_DRIVER=log


    CACHE\_DRIVER=redis


    QUEUE\_CONNECTION=sync


    SESSION\_DRIVER=redis


    We can now add our script that will handle the deployment to production. You can
    add another for the deployment to staging.


    114


    deploy\_production:


    stage: deploy


    script:


    \- time


    when: manual


    only:


    \- master


    This is a dummy stage which we will run after the tests complete to make sure
    all is well. We have specified that it should only be run on master, and it’s
    triggered manually. This will prevent the automatic deployment of code to the
    server.


    Notice: For the best pipeline experience, I would advise protecting the master
    branch from direct commits and running the deployment automatically by removing
    the when: manual part of the


    configuration. After a merge request has been made, the tests will run.


    Once merged to master, it will automatically deploy to the server.


    For the remainder of this book, we shall assume that the deployment is manual,
    in order to document the actions that would otherwise be automated. Here''s the
    current .gitlab-ci.yml file:


    115'
