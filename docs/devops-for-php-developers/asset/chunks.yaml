    \ ansible-playbook -i ./hosts site.yml`\n\n以下是我们完整的预设置文件：\n\n---\n\n## 完整的 pre_setup\
    \ 任务\n\n```yaml\n- name: Update the system\n  apt:\n    update_cache: yes\n  \
