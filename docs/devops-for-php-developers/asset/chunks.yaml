    \  service:\n    name: ssh\n    state: restarted\n\n- name: Ensure we use the\
    \ configured SSH port for the remainder of the role\n  set_fact:\n    ansible_port:\
    \ \"{{ ssh_port }}\"\n\n- name: Start UFW\n  ufw:\n    direction: incoming\n \
    \   state: enabled\n    policy: deny\n```\n\n你会注意到，我们在 `Ensure we use the configured\
    \ SSH port for the remainder of the role` 任务下更新了 `ansible_port` 事实。这使得 Ansible\
    \ 在我们将默认 SSH 端口更改为 `4033` 后，能继续执行该角色的其余部分。如果使用其他防火墙，请确保在更改端口前该端口已开放，否则任务将失败。\n\
    \n如果尝试使用默认 SSH 命令连接，除非指定端口，否则将失败。要以之前创建的 `deploy` 用户身份连接，请在 SSH 命令中添加 `-p 4033`。你也可以为此连接创建别名，或在本地\
    \ SSH 配置 `~/.ssh/config` 中添加主机：\n\n```bash\n$ ssh -p 4033 deploy@123.45.6.78\n\
    \n# 使用别名\n$ echo 'alias devops=\"ssh -p 4033 deploy@123.45.6.78\"' >> ~/.bashrc\n\
    $ source ~/.bashrc\n$ devops # 这将调用上述别名\n\n# 使用 ssh config\n$ vi ~/.ssh/config\n\
    Host devops\n  Hostname 123.45.6.78\n  Port 4033\n  User deploy\n$ ssh devops\
    \ # 这将使用 devops 配置\n```\n\n> **注意**：如果你在每次更改后运行 Playbook，需要将 `ansible_port` 变量添加到\
    \ Ansible 清单主机文件中，待整个 Playbook 完成后再将其移除，以便新服务器获得正确配置。\n\n使用 INI 格式：\n```ini\n\
    123.45.6.78 ansible_user=root ansible_port=4033\n```\n\n`common` 角色完成！\n\n## MySQL\
    \ 角色\n\n### Percona 子任务\n\n在 `mysql` 角色目录下，创建一个新的 `percona.yml` 文件并放入 `tasks`\
    \ 目录，用于存放 Percona 的准备和安装任务。我们还将添加一些 Python 库，以便 Ansible 能连接到数据库。\n\n```yaml\n\
    ---\n- name: Setup Percona Repository\n  apt:\n    deb: \"https://repo.percona.com/apt/percona-release_latest.{{\
    \ ansible_distribution_release }}_all.deb\"\n\n- name: Enable Percona 8 Repository\n\
    \  command: percona-release setup ps80\n\n- name: Install Percona Server\n  apt:\n\
    \    name: percona-server-server\n    state: latest\n    update_cache: yes\n\n\
    - name: Determine required MySQL Python libraries\n  set_fact:\n    mysql_python_package:\
    \ \"{% if ansible_python.version.major == 3 %}python3-pymysql{% else %}python-pymysql{%\
    \ endif %}\"\n\n- name: Ensure MySQL Python libraries are installed\n  apt:\n\
    \    name: \"{{ mysql_python_package }}\"\n    state: latest\n```\n\n我们还将添加一个处理程序（`mysql/handlers/main.yml`），用于重启\
    \ MySQL 服务器。\n\n```yaml\n---\n# mysql/handlers/main.yml\n- name: restart mysql\n\
    \  service:\n    name: mysql\n    state: restarted\n```\n\n### 配置子任务\n"
