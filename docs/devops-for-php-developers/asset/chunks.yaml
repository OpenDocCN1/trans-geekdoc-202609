  fmt: "\n# GitLab CI/CD 配置与自动化部署\n\n## GitLab CI/CD 配置文件\n\n```yaml\nimage: docker_username/php74:latest\n\
    \nservices:\n  - name: redis:latest\n    alias: redis\n  - name: mysql:8\n   \
    \ alias: mysql\n    command: [\"--default-authentication-plugin=mysql_native_password\"\
    ]\n\nvariables:\n  MYSQL_DATABASE: homestead\n  MYSQL_ROOT_PASSWORD: secret\n\
    \  DB_DATABASE: homestead\n  DB_HOST: mysql\n  DB_USERNAME: root\n  DB_PASSWORD:\
    \ secret\n  REDIS_HOST: redis\n  REDIS_PORT: 6379\n\nstages:\n  - test\n  - deploy\n\
    \nbefore_script:\n  - php -v\n\nfeature_tests:\n  stage: test\n  script:\n   \
    \ - cp .env.example .env\n    - composer install\n    - php artisan key:generate\n\
    \    - composer test\n\ndeploy_production:\n  stage: deploy\n  script:\n    -\
    \ time\n  when: manual\n  only:\n    - master\n```\n\n## 仓库初始化与推送\n\n我们现在可以登录\
    \ GitLab 并创建一个新的仓库。创建完成后，你将获得仓库地址，将其添加为新的远程仓库。进入 DevOps Laravel 目录并初始化 Git 仓库，添加远程仓库，提交并推送到服务器。\n\
    \n```bash\n$ git init\nInitialized empty Git repository in .../devops/.git/\n\n\
    $ git remote add origin git@gitlab.com:your_awesome_username/posts-test.git\n\
    $ git add .\n$ git commit -m 'adds gitlab ci/cd'\n[master (root-commit) e41dd42]\
    \ adds gitlab ci/cd\n 94 files changed, 8578 insertions(+)\n create mode 100644\
    \ .editorconfig\n create mode 100644 .env.example\n create mode 100644 webpack.mix.js\n\
    \ ...\n\n$ git push origin master\nEnumerating objects: 118, done.\nCounting objects:\
    \ 100% (118/118), done.\n...\nTo gitlab.com:your_awesome_username/posts-test.git\n\
    \ * [new branch] master -> master\n```\n\n提交完成后，GitLab Runner 会扫描仓库中的 `.gitlab-ci.yml`\
    \ 文件，如果存在则自动执行流水线。让我们查看一下！打开你的仓库并导航到 **CI/CD -> Pipelines**。你应该能看到一个正在运行的流水线：\n\
    \n![Pipeline Overview](index-117_1.png)\n\n点击流水线将显示两个作业。点击 `feature_test` 作业将显示该作业的控制台输出。作业完成后，你将获得成功的绿色提示：**Job\
    \ succeeded**。\n\n![Job Success](index-117_2.png)\n\n太棒了！我们的第一个作业已成功完成！你可以前往作业页面（**CI/CD\
    \ -> Jobs**）并运行 `deploy_production` 作业。它应该能顺利运行！现在我们可以设置服务器以访问 GitLab，并让 GitLab\
    \ 访问我们的服务器，以便按预期运行部署作业。\n\n## 使用 GitLab CI/CD 实现自动化部署\n\n### SSH 配置\n\n为了让服务器能够读取我们的仓库，我们需要获取\
    \ `deploy` 用户的公钥，并将其作为部署密钥添加到 GitLab。接下来，我们将获取 `deploy` 用户的私钥，并将其作为秘密 CI/CD 变量添加，以便\
    \ Runner 能够登录服务器并进行必要的更改。让我们登录到服务器！\n\n```bash\n$ ssh -p 4033 deploy@123.45.6.78\n\
    $ cat ~/.ssh/id_rsa.pub\nssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQc... ansible-generated\
    \ on devops-for-php-developers\n```\n\n复制该密钥，导航到你的 GitLab 仓库 -> **Settings ->\
    \ Repository**。你会找到 **Deploy Keys** 部分。展开它并在提供的表单中粘贴复制的密钥，给它一个好的标题。完成后，点击 **Add\
    \ key**。这将允许 `deploy` 用户从 GitLab 获取仓库，但无法推送任何更改。\n\n接下来，我们可以设置仓库密钥，以允许 GitLab\
    \ Runner 登录服务器并拉取新更改。打开终端并获取 `deploy` 用户的私有 SSH 密钥：\n\n```bash\n$ cat ~/.ssh/id_rsa\n\
    -----BEGIN RSA PRIVATE KEY-----\nMICDpZGu+H...\n...gc8bN\n-----END RSA PRIVATE\
    \ KEY-----\n```\n\n导航到仓库的 **CI/CD 设置 (Settings -> CI/CD)** 并展开 **Variables** 部分。将\
    \ **Key** 设为 `SSH_KEY`，将私钥粘贴到 **Value** 部分，将状态设为 **protected**，并保存变量。\n\n太棒了！现在\
    \ GitLab Runner 将能够登录到我们的服务器并拉取新更改！让我们设置目录结构，以实现零停机时间部署。\n\n### 目录结构\n\n为了实现零停机时间，我们将创建一个指向应用最新版本的符号链接，并将\
    \ Nginx 指向该符号链接。\n\n由于我们将部署多个版本，我们需要某些数据在版本间持久化。在 Laravel 中，`storage` 目录应在版本间持久化。为了实现这一点，我们将保留一个\
    \ `persistent` 文件夹来存放 `.env` 文件和 `storage` 目录。期望的结构如下：\n\n```text\n/var/www/app/\n\
    ├── persistent/\n│   ├── .env\n│   └── storage/\n├── releases/\n│   ├── 20200101000000/\n\
    │   └── 20200102000000/\n└── current/ -> symbolic link to latest release 20200102000000\n\
    ```\n\n我们将最多保留 5 个版本并删除其余版本。如果需要旧版本，我们可以随时从 GitLab 重新部署。\n\n### Laravel Envoy\n\
    \nLaravel Envoy 将用于配置我们的服务器并生成所需的目录和版本。它提供了一种简洁、极简的语法，用于定义在远程服务器上运行的常见任务。使用 Blade\
    \ 风格的语法，你可以轻松设置部署任务、Artisan 命令等。\n\n我们将指示它在应用目录缺失时创建它们，如果 `persistent` 目录缺失，则首先将仓库克隆到\
    \ `releases` 目录，然后将所需的文件和目录复制到 `persistent` 目录。部署完成后，脚本应移除 `current` 目录并将其符号链接到最新版本。\n\
    \n开始之前，在 DevOps Laravel 应用目录的根目录下创建一个新的 `Envoy.blade.php` 文件。在该文件中，我们将定义要部署的服务器集合及其对应的\
    \ SSH 端口。为了使 Envoy 文件可配置且可复用，我们将通过两个选项执行它：第一个是 GitLab 仓库地址，第二个是 JSON 编码的服务器列表。这两个选项将允许\
    \ Envoy 文件跨仓库使用，而无需修改文件。\n\n在执行任何操作之前，我们将进行一些设置。在 `@setup` 部分，我们需要验证这两个选项是否已设置。其次，我们将根据目录结构设置基础路径，并检查持久化存储是否存在，以便在缺失时创建它。设置完成后，我们将使用\
    \ JSON 解码后的服务器列表定义服务器列表。\n\n```php\n@setup\n    if (!$repo || !$servers) {\n \
    \       echo 'The repo and servers parameter is required';\n        die();\n \
    \   }\n\n    $servers = json_decode($servers, true, JSON_THROW_ON_ERROR);\n  \
    \  if (!$servers || count($servers) < 1) {\n        echo 'servers parameter should\
    \ be a valid json array of servers.';\n        die();\n    }\n\n    $persistentDir\
    \ = '/var/www/app/persistent';\n    $releasesDir = '/var/www/app/releases';\n\
    \    $appDir = '/var/www/app/current';\n    $release = date('YmdHis');\n    $newReleaseDir\
    \ = $releasesDir . '/' . $release;\n    $persistentStorageExists = is_dir($persistentDir\
    \ . '/storage');\n@endsetup\n\n@servers($servers)\n```\n\n我们现在可以设置将由 GitLab Runner\
    \ 调用的 `deploy` 任务故事。你可以根据需要定义任意数量的故事。在我们的例子中，我们只需要 `deploy` 故事，它将处理：\n\n- 克隆新版本\n\
    - 关联持久化存储和 `.env` 文件\n- 安装 Composer（以及 yarn/npm）依赖\n- 关联公共存储目录\n- 迁移数据库\n- 缓存路由和配置\n\
    - 激活版本为当前版本\n- 最后清理旧版本\n\n```php\n@story('deploy')\n    cloneRelease\n    linkPersistentStorage\n\
    \    installDependencies\n    optimiseRelease\n    activateRelease\n    cleanup\n\
    @endstory\n```\n\n故事中的每一项都是一个任务，将在 `servers` 数组中定义的每台服务器上运行。Envoy 的优点在于你可以轻松地在运行的任何命令中引入变量。让我们设置所有任务，按照我们手动操作的步骤执行。我已经注释了\
    \ Horizon 终止步骤，因为我们尚未设置 Supervisor。\n"
