- raw: 'Each playbook consists of tasks, which are a set of steps that should be performed
    on the hosts that you select. The tasks are executed in the order that they are
    written against the selected hosts, one task at a time. In order to make our playbooks
    configurable, we must use variables within our tasks.


    These variables can be defined in the Ansible Inventory file or the play or even
    in the task.


    When the tasks are executed, the name of the task is displayed as part of the
    output. Each task within the play should therefore have a name, a simple human
    readable description of the task.


    We can group our tasks by following any structure we prefer. Since we are setting
    up a LEMP server, we can have php, mysql, nginx, common and acl groups. In ansible
    these groups are referred to as roles. The good thing with roles is that they
    are self-contained thus, easily sharable between playbooks.


    We’re good to go! In the ~/devops directory, add a new site.yml file. This will
    be our play definition file. Next we need a directory to store all our roles;
    create the roles directory. We will then use ansible-galaxy to create our 5


    roles.


    $ touch site.yml


    $ mkdir roles


    $ cd roles


    $ ansible-galaxy init php


    $ ansible-galaxy init mysql


    $ ansible-galaxy init nginx


    $ ansible-galaxy init common


    $ ansible-galaxy init acl


    First, let''s give Ansible the list of hosts to use. Define your Ansible Inventory
    in the format you prefer. I prefer using the INI format:


    32


    123.45.6.78 ansible\_user=root


    Notice: Since we are using the root account in our server, we will have to explicitly
    instruct ansible by adding the ansible\_user=root parameter; failure to which,
    it will try to connect using the local user account and fail.


    Next, open site.yml using your favourite editor. I prefer Visual Studio Code with
    the YAML and Ansible extensions.


    Notice: Each playbook consists of a list of plays and each play executed against
    a list or servers (hosts).


    The first directive we shall give is a list of hosts that the play should be executed
    on; all should do for now.


    \---


    \- hosts: all


    Next we’ll define a section to hold variables that will be used by the play. This
    section is defined by the key vars and should have its properties indented from
    the margin since it''s a dictionary.


    \---


    \- hosts: all


    vars:


    KEY: sample value


    We can now test whether the playbook is set up correctly by adding a ping task
    that will do the same thing as running ansible all -i hosts -m ping.


    33


    \---


    \- hosts: all


    vars:


    KEY: sample value


    tasks:


    \- name: Ping our awesome server


    ping:


    data: pong


    Open up the terminal and navigate to the ~/devops directory and execute the playbook


    $ cd ~/devops


    $ ansible-playbook -i ./hosts site.yml


    PLAY \[all\] \*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*


    TASK \[Gathering Facts\] \*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*


    ok: \[123.45.6.78\]


    TASK \[Ping our awesome server\] \*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*


    ok: \[123.45.6.78\]


    PLAY RECAP \*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*


    123.45.6.78 : ok=2 changed=0 unreachable=0 failed=0 skipped=0 rescued=0


    ignored=0


    Congratulations! You’ve run your first playbook. Looking back, the playbook has
    a similar syntax to the YAML hosts file. We will be using YAML for all our playbook
    information including the roles.


    Remove the tasks that we just added and replace them with our roles.


    Depending on your setup, you will need to have more than one play in the playbook,
    each with its own set of hosts. In our case, we are using one common server for
    all our services.


    When running the play, we will execute the common role first so that we do the
    basic server setup and perform system upgrades. We plan on using PHP-FPM via a
    unix socket. The path of the unix socket is dependent on the PHP


    version we are running. If we choose PHP 7.3, the socket will be unix:/run/php/php7.3-fpm.sock
    while PHP 7.4 will give us


    34


    unix:/run/php/php7.4-fpm.sock. The socket location is used by both Nginx and PHP.
    The PHP version also determines the PHP modules to be installed. If we are using
    PHP 7.3, we will have to install the php7.3-\*


    modules. In light of all this, it makes perfect sense to keep the PHP version
    as a variable. So let''s add it as our first var.


    \---


    \- name: Spinning up our LEMP server.


    hosts: all


    vars:


    php\_version: "7.3"


    roles:


    \- common


    \- mysql


    \- php


    \- nginx


    \- acl


    When using different hosts you can use:


    \---


    \- name: Common Setup


    hosts: all


    roles:


    \- common


    \- security


    \- ...


    \- ...


    \- name: Spin up php


    hosts:


    \- php


    vars:


    php\_version: "7.3"


    roles:


    \- php


    Great! Let''s get started on our roles and check out their structure.


    35


    Role Structure


    Each role that is created using ansible-galaxy init role comes with a set of folders.
    Not all the folders are required but at the least, the tasks folder should be
    present. Below are the default folders that you get: Defaults => stores the default
    variables that will be used in the role in case a variable is undefined.


    Files => keeps the deployable files that are to be used in the role.


    Handlers => keeps the handlers (event listeners) that can be used within or without
    the role.


    Meta => defines some metadata that will be used by the role.


    Tasks => keeps the list of tasks to be executed by the role.


    Templates => contains templates that can be edited and deployed by the role.


    Vars => contains variables that are used by the role.


    You can raise events in Ansible which will be handled by the listeners that are
    defined in the handlers directory. All our tasks will be defined and stored in
    the tasks directory.


    36


    The Common Role


    Open up main.yml located under common/tasks. We shall use this file to define
    all the common tasks to be executed on each of the hosts we defined in site.yml.
    We will add a couple of things that are not in the Manual Server Setup Chapter.
    The steps we shall take are:


    Update server


    Setup unattended upgrades


    Install extra packages


    Perform some system optimisations


    Create a new user; deploy to handle our CI/CD deployments


    Setup our firewall.


    We will create subtasks that will be imported into the main.yml file. Having subtasks
    makes the process very atomic thus, easier to manage. We''ll create the subtask
    files then add them to the common task.


    $ cd ~/devops/roles/common/tasks


    $ touch pre\_setup.yml optimisations.yml users.yml security.yml Then import the
    created subtasks into the main task file:


    \---


    \# tasks file for common role


    \- name: Pre-setup tasks


    import\_tasks: pre\_setup.yml


    \- name: Optimise system


    import\_tasks: optimisations.yml


    \- name: Create additional users


    import\_tasks: users.yml


    \- name: Boot firewall and configure SSH


    import\_tasks: security.yml


    37


    Pre-Setup Subtask


    Open up pre\_setup.yml and use the apt module to update our server, install packages
    and setup unattended upgrades. For the unattended upgrades, we will either use
    templates or complete files or the lineinfile module. The line in file module
    is useful for adding, editing and removing lines in a file and if the file does
    not exist, it can also be created.


    To get started, let’s update the apt cache and any outdated packages. We shall
    set the apt cache expiry to 24Hrs. Since the apt module takes the TTL in seconds,
    we’ll use 86400.


    \---


    \- name: Update the system


    apt:


    update\_cache: yes


    cache\_valid\_time: 86400


    upgrade: ''dist''


    One man''s meat is another man''s poison hence, the need for variables! Each server
    will be different, have different package requirements, the unattended upgrades
    package will need to act differently, etc. We shall set default variables for
    our role and store them in the defaults directory. These variables can be overridden
    by having variables of the same name in the play definition or the vars directory.'
  fmt: "\n# Ansible Playbooks and Roles\n\nEach playbook consists of tasks, which\
    \ are a set of steps that should be performed on the hosts that you select. The\
    \ tasks are executed in the order that they are written against the selected hosts,\
    \ one task at a time. In order to make our playbooks configurable, we must use\
    \ variables within our tasks.\n\nThese variables can be defined in the Ansible\
    \ Inventory file or the play or even in the task.\n\nWhen the tasks are executed,\
    \ the name of the task is displayed as part of the output. Each task within the\
    \ play should therefore have a name, a simple human readable description of the\
    \ task.\n\nWe can group our tasks by following any structure we prefer. Since\
    \ we are setting up a LEMP server, we can have php, mysql, nginx, common and acl\
    \ groups. In Ansible these groups are referred to as **roles**. The good thing\
    \ with **roles** is that they are self-contained thus, easily sharable between\
    \ playbooks.\n\n## Initial Setup\n\nWe’re good to go! In the `~/devops` directory,\
    \ add a new `site.yml` file. This will be our play definition file. Next we need\
    \ a directory to store all our roles; create the `roles` directory. We will then\
    \ use `ansible-galaxy` to create our 5 roles.\n\n```\n$ touch site.yml\n$ mkdir\
    \ roles\n$ cd roles\n$ ansible-galaxy init php\n$ ansible-galaxy init mysql\n\
    $ ansible-galaxy init nginx\n$ ansible-galaxy init common\n$ ansible-galaxy init\
    \ acl\n```\n\nFirst, let's give Ansible the list of hosts to use. Define your\
    \ Ansible Inventory in the format you prefer. I prefer using the INI format:\n\
    \n```\n123.45.6.78 ansible_user=root\n```\n\n> **Notice:** Since we are using\
    \ the `root` account in our server, we will have to explicitly instruct Ansible\
    \ by adding the `ansible_user=root` parameter; failure to which, it will try to\
    \ connect using the local user account and fail.\n\nNext, open `site.yml` using\
    \ your favourite editor. I prefer Visual Studio Code with the YAML and Ansible\
    \ extensions.\n\n> **Notice:** Each playbook consists of a list of plays and each\
    \ play executed against a list or servers (hosts).\n\nThe first directive we shall\
    \ give is a list of hosts that the play should be executed on; `all` should do\
    \ for now.\n\n```\n---\n- hosts: all\n```\n\nNext we’ll define a section to hold\
    \ variables that will be used by the play. This section is defined by the key\
    \ `vars` and should have its properties indented from the margin since it's a\
    \ dictionary.\n\n```\n---\n- hosts: all\n  vars:\n    KEY: sample value\n```\n\
    \nWe can now test whether the playbook is set up correctly by adding a `ping`\
    \ task that will do the same thing as running `ansible all -i hosts -m ping`.\n\
    \n```\n---\n- hosts: all\n  vars:\n    KEY: sample value\n  tasks:\n    - name:\
    \ Ping our awesome server\n      ping:\n        data: pong\n```\n\nOpen up the\
    \ terminal and navigate to the `~/devops` directory and execute the playbook:\n\
    \n```\n$ cd ~/devops\n$ ansible-playbook -i ./hosts site.yml\n```\n\n```\nPLAY\
    \ [all] *************************************************************\nTASK [Gathering\
    \ Facts] *************************************************\nok: [123.45.6.78]\n\
    TASK [Ping our awesome server] *****************************************\nok:\
    \ [123.45.6.78]\nPLAY RECAP *************************************************************\n\
    123.45.6.78 : ok=2 changed=0 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n\
    ```\n\nCongratulations! You’ve run your first playbook. Looking back, the playbook\
    \ has a similar syntax to the YAML hosts file. We will be using YAML for all our\
    \ playbook information including the roles.\n\nRemove the tasks that we just added\
    \ and replace them with our roles.\n\nDepending on your setup, you will need to\
    \ have more than one play in the playbook, each with its own set of hosts. In\
    \ our case, we are using one common server for all our services.\n\nWhen running\
    \ the play, we will execute the `common` role first so that we do the basic server\
    \ setup and perform system upgrades. We plan on using PHP-FPM via a unix socket.\
    \ The path of the unix socket is dependent on the PHP version we are running.\
    \ If we choose PHP 7.3, the socket will be `unix:/run/php/php7.3-fpm.sock` while\
    \ PHP 7.4 will give us `unix:/run/php/php7.4-fpm.sock`. The socket location is\
    \ used by both Nginx and PHP. The PHP version also determines the PHP modules\
    \ to be installed. If we are using PHP 7.3, we will have to install the `php7.3-*`\
    \ modules. In light of all this, it makes perfect sense to keep the PHP version\
    \ as a variable. So let's add it as our first var.\n\n```\n---\n- name: Spinning\
    \ up our LEMP server.\n  hosts: all\n  vars:\n    php_version: \"7.3\"\n  roles:\n\
    \    - common\n    - mysql\n    - php\n    - nginx\n    - acl\n```\n\nWhen using\
    \ different hosts you can use:\n\n```\n---\n- name: Common Setup\n  hosts: all\n\
    \  roles:\n    - common\n    - security\n    - ...\n    - ...\n- name: Spin up\
    \ php\n  hosts:\n    - php\n  vars:\n    php_version: \"7.3\"\n  roles:\n    -\
    \ php\n```\n\n## Role Structure\n\nEach role that is created using `ansible-galaxy\
    \ init role` comes with a set of folders. Not all the folders are required but\
    \ at the least, the `tasks` folder should be present. Below are the default folders\
    \ that you get:\n\n*   **Defaults** => stores the default variables that will\
    \ be used in the role in case a variable is undefined.\n*   **Files** => keeps\
    \ the deployable files that are to be used in the role.\n*   **Handlers** => keeps\
    \ the handlers (event listeners) that can be used within or without the role.\n\
    *   **Meta** => defines some metadata that will be used by the role.\n*   **Tasks**\
    \ => keeps the list of tasks to be executed by the role.\n*   **Templates** =>\
    \ contains templates that can be edited and deployed by the role.\n*   **Vars**\
    \ => contains variables that are used by the role.\n\nYou can raise events in\
    \ Ansible which will be handled by the listeners that are defined in the `handlers`\
    \ directory. All our tasks will be defined and stored in the `tasks` directory.\n\
    \n## The Common Role\n\nOpen up `main.yml` located under `common/tasks`. We shall\
    \ use this file to define all the common tasks to be executed on each of the hosts\
    \ we defined in `site.yml`. We will add a couple of things that are not in the\
    \ Manual Server Setup Chapter. The steps we shall take are:\n\n1.  Update server\n\
    2.  Setup unattended upgrades\n3.  Install extra packages\n4.  Perform some system\
    \ optimisations\n5.  Create a new user; `deploy` to handle our CI/CD deployments\n\
    6.  Setup our firewall.\n\nWe will create subtasks that will be imported into\
    \ the `main.yml` file. Having subtasks makes the process very atomic thus, easier\
    \ to manage. We'll create the subtask files then add them to the common task.\n\
    \n```\n$ cd ~/devops/roles/common/tasks\n$ touch pre_setup.yml optimisations.yml\
    \ users.yml security.yml\n```\n\nThen import the created subtasks into the main\
    \ task file:\n\n```\n---\n# tasks file for common role\n- name: Pre-setup tasks\n\
    \  import_tasks: pre_setup.yml\n- name: Optimise system\n  import_tasks: optimisations.yml\n\
    - name: Create additional users\n  import_tasks: users.yml\n- name: Boot firewall\
    \ and configure SSH\n  import_tasks: security.yml\n```\n\n## Pre-Setup Subtask\n\
    \nOpen up `pre_setup.yml` and use the `apt` module to update our server, install\
    \ packages and setup unattended upgrades. For the unattended upgrades, we will\
    \ either use templates or complete files or the `lineinfile` module. The `lineinfile`\
    \ module is useful for adding, editing and removing lines in a file and if the\
    \ file does not exist, it can also be created.\n\nTo get started, let’s update\
    \ the apt cache and any outdated packages. We shall set the apt cache expiry to\
    \ 24Hrs. Since the `apt` module takes the TTL in seconds, we’ll use `86400`.\n\
    \n```\n---\n- name: Update the system\n  apt:\n    update_cache: yes\n    cache_valid_time:\
    \ 86400\n    upgrade: 'dist'\n```\n\nOne man's meat is another man's poison hence,\
    \ the need for variables! Each server will be different, have different package\
    \ requirements, the unattended upgrades package will need to act differently,\
    \ etc. We shall set default variables for our role and store them in the `defaults`\
    \ directory. These variables can be overridden by having variables of the same\
    \ name in the play definition or the `vars` directory.\n"
  trans: "\n\n# Ansible Playbooks 和 Roles\n\n每个 playbook 由 tasks（任务）组成，任务是在你选择的主机上执行的一组步骤。任务按照编写顺序针对选定的主机执行，一次执行一个任务。为了使我们的\
    \ playbook 可配置，我们必须在任务中使用变量。\n\n这些变量可以在 Ansible Inventory 文件、play 中，甚至在 task 中定义。\n\
    \n当任务执行时，任务的名称会作为输出的一部分显示。因此，play 中的每个任务都应该有一个名称，即任务的简单易读描述。\n\n我们可以按照任何喜欢的结构对任务进行分组。既然我们要设置\
    \ LEMP 服务器，我们可以有 php、mysql、nginx、common 和 acl 组。在 Ansible 中，这些组被称为 **roles（角色）**。**角色**\
    \ 的优点在于它们是自包含的，因此可以在 playbook 之间轻松共享。\n\n## 初始设置\n\n万事俱备！在 `~/devops` 目录下，添加一个新的\
    \ `site.yml` 文件。这将是我们的 play 定义文件。接下来我们需要一个目录来存放所有的角色；创建 `roles` 目录。然后我们将使用 `ansible-galaxy`\
    \ 来创建 5 个角色。\n\n```\n$ touch site.yml\n$ mkdir roles\n$ cd roles\n$ ansible-galaxy\
    \ init php\n$ ansible-galaxy init mysql\n$ ansible-galaxy init nginx\n$ ansible-galaxy\
    \ init common\n$ ansible-galaxy init acl\n```\n\n首先，让我们给 Ansible 提供要使用的主机列表。按你喜欢的格式定义\
    \ Ansible Inventory。我倾向于使用 INI 格式：\n\n```\n123.45.6.78 ansible_user=root\n```\n\
    \n> **注意：** 既然我们在服务器上使用 `root` 账户，就必须通过添加 `ansible_user=root` 参数显式指示 Ansible；否则，它将尝试使用本地用户账户连接并失败。\n\
    \n接下来，使用你喜欢的编辑器打开 `site.yml`。我倾向于使用安装了 YAML 和 Ansible 扩展的 Visual Studio Code。\n\
    \n> **注意：** 每个 playbook 由一个 plays 列表组成，每个 play 针对一个服务器列表（主机）执行。\n\n我们要给出的第一个指令是\
    \ play 应该在其上执行的主机列表；目前用 `all` 即可。\n\n```\n---\n- hosts: all\n```\n\n接下来我们将定义一个部分来保存\
    \ play 将要使用的变量。该部分由键 `vars` 定义，并且由于它是一个字典，其属性应从边距处缩进。\n\n```\n---\n- hosts: all\n\
    \  vars:\n    KEY: sample value\n```\n\n我们现在可以通过添加一个 `ping` 任务来测试 playbook 是否设置正确，该任务的作用与运行\
    \ `ansible all -i hosts -m ping` 相同。\n\n```\n---\n- hosts: all\n  vars:\n    KEY:\
    \ sample value\n  tasks:\n    - name: Ping our awesome server\n      ping:\n \
    \       data: pong\n```\n\n打开终端并导航到 `~/devops` 目录，然后执行 playbook：\n\n```\n$ cd\
    \ ~/devops\n$ ansible-playbook -i ./hosts site.yml\n```\n\n```\nPLAY [all] *************************************************************\n\
    TASK [Gathering Facts] *************************************************\nok:\
    \ [123.45.6.78]\nTASK [Ping our awesome server] *****************************************\n\
    ok: [123.45.6.78]\nPLAY RECAP *************************************************************\n\
    123.45.6.78 : ok=2 changed=0 unreachable=0 failed=0 skipped=0 rescued=0 ignored=0\n\
    ```\n\n恭喜！你已经运行了第一个 playbook。回顾一下，playbook 的语法与 YAML hosts 文件相似。我们将对所有 playbook\
    \ 信息（包括角色）使用 YAML。\n\n移除刚才添加的 tasks，并用我们的 roles 替换它们。\n\n根据你的设置，你可能需要在 playbook\
    \ 中包含多个 play，每个 play 都有自己的主机集合。在我们的例子中，我们对所有服务使用一台通用服务器。\n\n运行 play 时，我们将首先执行\
    \ `common` 角色，以便进行基本的服务器设置并执行系统升级。我们计划通过 unix socket 使用 PHP-FPM。unix socket 的路径取决于我们运行的\
    \ PHP 版本。如果我们选择 PHP 7.3，socket 将是 `unix:/run/php/php7.3-fpm.sock`，而 PHP 7.4 将给我们\
    \ `unix:/run/php/php7.4-fpm.sock`。socket 位置同时被 Nginx 和 PHP 使用。PHP 版本也决定了要安装的 PHP\
    \ 模块。如果我们使用 PHP 7.3，就必须安装 `php7.3-*` 模块。鉴于所有这些原因，将 PHP 版本保存为变量非常合理。所以让我们把它作为第一个变量添加进去。\n\
    \n```\n---\n- name: Spinning up our LEMP server.\n  hosts: all\n  vars:\n    php_version:\
    \ \"7.3\"\n  roles:\n    - common\n    - mysql\n    - php\n    - nginx\n    -\
    \ acl\n```\n\n当使用不同的主机时，你可以使用：\n\n```\n---\n- name: Common Setup\n  hosts: all\n\
    \  roles:\n    - common\n    - security\n    - ...\n    - ...\n- name: Spin up\
    \ php\n  hosts:\n    - php\n  vars:\n    php_version: \"7.3\"\n  roles:\n    -\
    \ php\n```\n\n## 角色结构\n\n使用 `ansible-galaxy init role` 创建的每个角色都附带一组文件夹。并非所有文件夹都是必需的，但至少应存在\
    \ `tasks` 文件夹。以下是默认获得的文件夹：\n\n*   **Defaults（默认值）** => 存储角色中使用的默认变量，以防变量未定义。\n\
    *   **Files（文件）** => 存放角色中使用的可部署文件。\n*   **Handlers（处理器）** => 存放可在角色内部或外部使用的 handlers（事件监听器）。\n\
    *   **Meta（元数据）** => 定义角色将使用的一些元数据。\n*   **Tasks（任务）** => 存放角色将执行的任务列表。\n*   **Templates（模板）**\
    \ => 包含可由角色编辑和部署的模板。\n*   **Vars（变量）** => 包含角色使用的变量。\n\n你可以在 Ansible 中触发事件，这些事件将由\
    \ `handlers` 目录中定义的监听器处理。我们所有的任务都将在 `tasks` 目录中定义和存储。\n\n## Common 角色\n\n打开位于\
    \ `common/tasks` 下的 `main.yml`。我们将使用此文件定义在 `site.yml` 中定义的每个主机上执行的所有通用任务。我们将添加一些“手动服务器设置”章节中没有的内容。我们将采取的步骤是：\n\
    \n1.  更新服务器\n2.  设置无人值守升级\n3.  安装额外软件包\n4.  执行一些系统优化\n5.  创建新用户；`deploy` 以处理我们的\
    \ CI/CD 部署\n6.  设置防火墙。\n\n我们将创建将被导入到 `main.yml` 文件中的子任务。拥有子任务使过程非常原子化，因此更易于管理。我们将创建子任务文件，然后将它们添加到\
    \ common 任务中。\n\n```\n$ cd ~/devops/roles/common/tasks\n$ touch pre_setup.yml\
    \ optimisations.yml users.yml security.yml\n```\n\n然后将创建的子任务导入主任务文件：\n\n```\n\
    ---\n# tasks file for common role\n- name: Pre-setup tasks\n  import_tasks: pre_setup.yml\n\
    - name: Optimise system\n  import_tasks: optimisations.yml\n- name: Create additional\
    \ users\n  import_tasks: users.yml\n- name: Boot firewall and configure SSH\n\
    \  import_tasks: security.yml\n```\n\n## Pre-Setup 子任务\n\n打开 `pre_setup.yml` 并使用\
    \ `apt` 模块来更新服务器、安装软件包和设置无人值守升级。对于无人值守升级，我们将使用模板、完整文件或 `lineinfile` 模块。`lineinfile`\
    \ 模块可用于在文件中添加、编辑和删除行，如果文件不存在，它也可以创建文件。\n\n首先，让我们更新 apt 缓存和任何过时的软件包。我们将 apt 缓存过期时间设置为\
    \ 24 小时。由于 `apt` 模块以秒为单位接受 TTL，我们将使用 `86400`。\n\n```\n---\n- name: Update the\
    \ system\n  apt:\n    update_cache: yes\n    cache_valid_time: 86400\n    upgrade:\
    \ 'dist'\n```\n\n萝卜青菜，各有所爱，因此需要变量！每台服务器都不同，有不同的软件包需求，无人值守升级软件包需要有不同的表现等。我们将为角色设置默认变量并将它们存储在\
    \ `defaults` 目录中。这些变量可以通过在 play 定义或 `vars` 目录中拥有同名变量来覆盖。\n\n"
