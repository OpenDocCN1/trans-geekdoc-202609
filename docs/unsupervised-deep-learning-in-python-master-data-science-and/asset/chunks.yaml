- raw: 'Note that this isn’t really the full picture because we are not considering
    biases, and we also don’t have any requirement that each column of the weight
    has length 1, or that each column is orthogonal, or that they are ordered in any
    particular way.


    So while the functional form looks “like” PCA, it’s not doing everything PCA is
    doing.


    Denoising Autoencoders


    In this section we are going to talk about yet another method of regularization.


    Remember that when we’re given a dataset, we don’t have to only train on that
    dataset. We first saw this when we talked about images. An upside-down cat is
    still a cat, so we should add that to our dataset. Similarly, a sideways cat is
    still a cat. A cat on the top right of a photo is still the same cat as that cat
    shifted to the bottom left.


    Therefore, there are ways we can modify our data to improve our neural network’s
    generalization capabilities.


    Another way to modify data other than moving things around explicitly is to add
    noise.


    One way is to add Gaussian noise to the input, another way is to simply set some
    of the values to 0.


    This is almost trivial to do since it’s just adding a bitmask to your input, or
    in other words, you generate a random vector of 0s and 1s, and do an element by
    element multiplication on X, to get your new X.


    Ex.


    from theano.tensor.shared\_randomstreams import RandomStreams


    rng = RandomStreams()


    bitmask = rng.binomial(n=1, p=p, size=X.shape)


    X = bitmask \* X


    Typically, we set the probability of generating a 0 to something less than 50%,
    so perhaps maybe something like 30%, but researchers have found that up to 50%
    still provides good results.


    Stacked Autoencoders


    In this section we are going to explore what happens when we take a bunch of autoencoders
    and put them together in layers.


    The basic algorithm is this.


    You train one autoencoder, and then fix its weights. Then you throw out the last
    layer, keeping only the input to hidden part.


    Next, you take the output of the hidden layer of the first autoencoder, and you
    make that the input to another autoencoder.


    And you just repeat this process for multiple autoencoders.


    Ex:


    Train:


    o--o--o


    x z x’


    Keep:


    o--o


    x z


    Train another:


    o--o--o


    z z2 z’


    Keep another:


    o--o


    z z2


    Train another:


    o--o--o


    z2 z3 z2’


    Keep another:


    o--o


    z2 z3


    Finally, you end up with a stack of autoencoders, each designed simply to learn
    a more compact version of the previous layer.


    What you end up with is a deep unsupervised network:


    o--o--o--o


    x z z2 z3


    Since each time we use an autoencoder, we are trying to get a more compact representation
    than what we had in the previous layer, we are going to want each layer to be
    smaller in size than the previous layer.


    Note that this doesn’t necessarily have to be the case. We could in fact have
    a huge number of hidden units in the middle layer. Theoretically, if we had N
    training samples, and N hidden units, then we could get a perfect reconstruction
    because each of the N columns of W could be responsible for reproducing a different
    sample.


    You would think that this would lead to severe overfitting, however researchers
    have found it does not overfit, and even a number of hidden units greater than
    N can work.


    In our code, we will use classes and objects to represent the ANN and Autoencoder.


    This will help us compartmentalize our code much better, given the fact that we
    can have an arbitrary number of autoencoders.


    We can then simply make the hidden output of each autoencoder the input into the
    next autoencoder.


    Greedy layer-wise pretraining


    The process that we’ve just talked about is called “greedy layer-wise pretraining”.


    The reason it is called greedy you should understand if you have ever studied
    algorithms. Greedy intuitively means you make the best short-sighted decision,
    which in our case is simply training one layer of the autoencoder.


    While it is theoretically not optimal, it actually helps a lot with supervised
    training, which is the next step, and that is why we call it pretraining.


    The last step in the process is to add a logistic regression layer to the end
    of the stacked autoencoders.


    Once you’ve done that, you’ve made what is called a deep neural network.


    Since the last layer with logistic regression will have randomized weights, we
    will still need to do some backpropagation.


    But what we find is that doing backpropagation at this point doesn’t take as long,
    because the autoencoder weights already put us in the neighborhood of the correct
    answer.


    So we just need to do a few epochs of backpropagation to “fine-tune” the network.


    Notice that there are zero new things here in terms of architecture and functional
    forms, just a new concept using old ideas.


    You already know how to do all this stuff - build a neural network, build a neural
    network with multiple layers, do gradient descent in Theano, etc.


    In the code, note that we assume as usual that we have a function getData() that
    returns some NxD matrix for the input data and an Nx1 vector for the output targets.


