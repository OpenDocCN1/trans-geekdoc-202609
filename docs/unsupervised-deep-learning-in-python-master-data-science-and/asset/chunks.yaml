    # Chapter 2: t-SNE


    In this lecture we are going to talk about another dimensionality reduction and
    visualization method called t-SNE. The t means we are going to incorporate the
    t-distribution and SNE stands for “stochastic neighbor embedding”.


    One big advantage of t-SNE is that it’s a nonlinear method, so it is more expressive
    than PCA.


    Why study t-SNE?


    2 reasons:


    1) t-SNE was jointly developed by Geoffrey Hinton, who as you know, is one of
    the main figures of deep learning.


    2) by doing t-SNE, we are seeing how the limitations of PCA can be overcome by
    using a more complex mathematical model.


    One key difference between PCA and t-SNE, other than the fact that t-SNE is non-linear,
    is that there is no transformation model with t-SNE.


    Instead, t-SNE just modifies the outputs directly in order to minimize the cost
    function.


    What this means is that, you won’t have any train and test sets, and you can’t
    transform data after fitting on some other data.


    The way that t-SNE works is essentially it tries to preserve the distances between
    each input vector.


    We will start with symmetric SNE since it intuitively makes more sense.


    On the original data X, we define a joint probability distribution p(i,j) which
    is equal to:


    p(i,j) = exp(-||xi - xj||² /(2s²)) / sum\[k!=m\]{ exp(-||xm - xk||² /(2s²)) }


    Note that i and j here are not the index for the dimensions like we did with PCA,
    but rather the ith and jth data point in the dataset, i.e. i and j are the ith
    and jth sample.


    Notice it kind of looks like a Gaussian distribution. You can think of “s” as
    a hyperparameter. It’s controlling the “spread” of the distribution.


    Next, we have our low-dimensional mapping Y, which we define in the same way,
    but there is no s term.


    q(i,j) = exp(-||yi - yj||²) / sum\[k!=m\]{ exp(-||ym - yk||²) }


    Note that we just set p(i,i) = q(i,i) = 0.


    So we’ve defined 2 probability distributions, one between every pair of points
    in X, and one between every pair of points in Y.


    We usually just initialize every data point in Y randomly.


    i.e. If we’re looking for a 2-D representation, we’ll create Y as:


    Y = np.random.randn(N, 2)


    Once we’ve done that, we can try to find a better Y by optimizing some objective
    function that relates p(i,j) and q(i,j).


    If you are not familiar with how we compare 2 probability distributions, we usually
    use the Kullback-Leibler divergence or KL divergence for short.


    C = D[KL](P || Q) = sum\[i,j\]{ p(i,j)log( p(i,j) / q(i,j) ) }


    If P and Q are exactly the same, this would be 0.


    How we solve this problem is the same as how we solve all other problems of this
    type - we take the derivative of the objective and do gradient descent.


    Notice how with this type of model we don’t have weights - we just have Y. So
    are taking the gradient with respect to Y, which is the output mapping itself.


    i.e.


    Y <- Y - learning\_rate\*dC/dY


    One problem with symmetric SNE and the SNE that came before it is known as the
    “crowding problem”, which prevents gaps from forming around the natural clusters.


    What t-SNE does is it uses slightly different distributions for Q and P, which
    helps space out the clusters better.


    The new P and Q are defined as follows:


    p(i,j) = \[ p(i | j) + p(j | i) \] / 2N


    Where:


    p(j | i) = exp(-||xi - xj||² /(2s[i]²)) / sum\[k!=i\]{ exp(-||xi - xk||² /(2s[i]²))
    }


    Notice how here each sample has its own “s”.


    q(i,j) = (1 + ||yi - yj||²)^(\-1) / sum\[k!=m\]{ (1 + ||yk - ym||²)^(\-1) }


    The Q distribution uses the t-distribution, hence the name.


    The cost function remains the same as before.


    Note that we won’t actually implement t-SNE - even though it should be relatively
    simple given the definitions above.


    It’s easy to define the cost and find its derivative, which is more than we can
    say for many of the deep learning models we’ve worked with.


    The problem is that it’s slow and has huge RAM requirements - in fact t-SNE will
    probably crash on your computer with the full MNIST dataset.


    Why? Because we need to calculate q(i,j) and p(i,j) for i=1..N and j=1..N, this
    is naturally an O(N²) algorithm.


    There is a variant of it, which is called Barnes-Hut, that is O(NlogN) run time,
    but still has huge RAM requirements. This is the default method used in Sci-Kit
    Learn.


    One solution is to take a sample of just a few hundred data points and do t-SNE
    on that, but of course you can increase this amount if you’re willing to wait
    longer and you have enough RAM.


    Exercises


    Try t-SNE (from the sci-kit learn library) on the MNIST dataset.


    Try writing your own naive implementation given the definitions above, and take
    advantage of Theano’s automatic differentiation.


