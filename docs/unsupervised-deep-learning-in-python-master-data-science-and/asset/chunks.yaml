    \ + self.b)\n        v_sample = self.rng.binomial(size=p_v_given_h.shape, n=1,\
    \ p=p_v_given_h)\n        return v_sample\n\n    def forward_hidden(self, X):\n\
    \        return T.nnet.sigmoid(X.dot(self.W) + self.c)\n\n    def forward_output(self,\
    \ X):\n        Z = self.forward_hidden(X)\n        Y = T.nnet.sigmoid(Z.dot(self.W.T)\
    \ + self.b)\n        return Y\n\n    @staticmethod\n    def createFromArrays(W,\
    \ c, b, an_id):\n        rbm = AutoEncoder(W.shape[1], an_id)\n        rbm.W =\
    \ theano.shared(W, 'W_%s' % rbm.id)\n        rbm.c = theano.shared(c, 'c_%s' %\
    \ rbm.id)\n        ...\n```\n\n排版后：\n\nfrom `theano.tensor.shared_randomstreams`\
    \ import `RandomStreams`\n\nfrom `autoencoder` import `DNN`\n\nclass `RBM(object)`:\n\
    \    def `__init__(self, M)`:\n        `self.M = M`\n        `self.rng = RandomStreams()`\n\
    \n    def `fit(self, X, learning_rate=0.1, epochs=1, batch_sz=100, show_fig=False)`:\n\
    \        `N, D = X.shape`\n        `n_batches = N / batch_sz`\n        `W0 = init_weights((D,\
    \ self.M))`\n        `self.W = theano.shared(W0)`\n        `self.c = theano.shared(np.zeros(self.M))`\n\
    \        `self.b = theano.shared(np.zeros(D))`\n        `self.params = [self.W,\
    \ self.c, self.b]`\n        `self.forward_params = [self.W, self.c]`\n       \
    \ # we won't use this to fit the RBM but we will use these for backpropagation\n\
    \        `self.dW = theano.shared(np.zeros(W0.shape))`\n        `self.dc = theano.shared(np.zeros(self.M))`\n\
    \        `self.db = theano.shared(np.zeros(D))`\n        `self.dparams = [self.dW,\
    \ self.dc, self.db]`\n        `self.forward_dparams = [self.dW, self.dc]`\n  \
    \      `X_in = T.matrix('X')`\n        # attach it to the object so it can be\
    \ used later\n        # must be sigmoidal because the output is also a sigmoid\n\
    \        `H = T.nnet.sigmoid(X_in.dot(self.W) + self.c)`\n        `self.hidden_op\
    \ = theano.function(`\n            inputs=[X_in],\n            outputs=H,\n  \
    \      )`\n        # we won't use this cost to do any updates\n        # but we\
    \ would like to see how this cost function changes\n        # as we do contrastive\
    \ divergence\n        `X_hat = self.forward_output(X_in)`\n        `cost = -(X_in\
    \ * T.log(X_hat) + (1 - X_in) * T.log(1 - X_hat)).sum() / N`\n        `cost_op\
    \ = theano.function(`\n            inputs=[X_in],\n            outputs=cost,\n\
    \        )`\n        # do one round of Gibbs sampling to obtain X_sample\n   \
    \     `H = self.sample_h_given_v(X_in)`\n        `X_sample = self.sample_v_given_h(H)`\n\
    \        # define the objective, updates, and train function\n        `objective\
    \ = T.mean(self.free_energy(X_in)) - T.mean(self.free_energy(X_sample))`\n   \
    \     # need to consider X_sample constant because you can't take the gradient\
    \ of random numbers in Theano\n        `updates = [(p, p - learning_rate*T.grad(objective,\
    \ p, consider_constant=[X_sample]) for p in self.params]`\n        `train_op =\
    \ theano.function(`\n            inputs=[X_in],\n            updates=updates,\n\
    \        )`\n        `costs = []`\n        for i in xrange(epochs):\n        \
    \    print \"epoch:\", i\n            `X = shuffle(X)`\n            for j in xrange(n_batches):\n\
    \                `batch = X[j*batch_sz:(j*batch_sz + batch_sz)]`\n           \
    \     `train_op(batch)`\n                `the_cost = cost_op(X)` # technically\
    \ we could also get the cost for Xtest here\n                print \"j / n_batches:\"\
    , j, \"/\", n_batches, \"cost:\", the_cost\n                `costs.append(the_cost)`\n\
    \            if show_fig:\n                plt.plot(costs)\n                plt.show()`\n\
    \n    def `free_energy(self, V)`:\n        return -V.dot(self.b) - T.sum(T.log(1\
    \ + T.exp(V.dot(self.W) + self.c)), axis=1)\n\n    def `sample_h_given_v(self,\
    \ V)`:\n        `p_h_given_v = T.nnet.sigmoid(V.dot(self.W) + self.c)`\n     \
    \   `h_sample = self.rng.binomial(size=p_h_given_v.shape, n=1, p=p_h_given_v)`\n\
    \        return h_sample\n\n    def `sample_v_given_h(self, H)`:\n        `p_v_given_h\
    \ = T.nnet.sigmoid(H.dot(self.W.T) + self.b)`\n        `v_sample = self.rng.binomial(size=p_v_given_h.shape,\
    \ n=1, p=p_v_given_h)`\n        return v_sample\n\n    def `forward_hidden(self,\
    \ X)`:\n        return T.nnet.sigmoid(X.dot(self.W) + self.c)\n\n    def `forward_output(self,\
    \ X)`:\n        `Z = self.forward_hidden(X)`\n        `Y = T.nnet.sigmoid(Z.dot(self.W.T)\
    \ + self.b)`\n        return Y\n\n    @staticmethod\n    def `createFromArrays(W,\
    \ c, b, an_id)`:\n        `rbm = AutoEncoder(W.shape[1], an_id)`\n        `rbm.W\
    \ = theano.shared(W, 'W_%s' % rbm.id)`\n        `rbm.c = theano.shared(c, 'c_%s'\
    \ % rbm.id)`\n        ...\n"
