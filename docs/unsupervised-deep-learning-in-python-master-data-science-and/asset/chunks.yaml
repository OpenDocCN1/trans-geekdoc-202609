    Unsupervised Deep Learning in Python


    Master Data Science and Machine Learning with Modern Neural Networks written in
    Python and Theano


    By: The LazyProgrammer ([http://lazyprogrammer.me](http://lazyprogrammer.me))


    [Introduction](#part0001_split_000.html#UGI1-5ea8dc02e0d144c79db94384a6c4919f)


    [Chapter 1: Principal Components Analysis](#part0002.html#chapter-2)


    [Chapter 2: t-SNE](#part0003.html#chapter-3)


    [Chapter 3: Autoencoders and Stacked Denoising Autoencoders](#part0004.html#chapter-4)


    [Chapter 4: Restricted Boltzmann Machines and Deep Belief Networks](#part0005.html#chapter-5)


    [Chapter 5: Feature Visualization](#part0006.html#5N3C1-5ea8dc02e0d144c79db94384a6c4919f)


    [Chapter 6: Tricking a Neural Network](#part0007.html#6LJU1-5ea8dc02e0d144c79db94384a6c4919f)


    [Conclusion](#part0008.html#chapter-8)


    # Introduction


    When we talk about modern deep learning, we are often not talking about vanilla
    neural networks - but newer developments, like using Autoencoders and Restricted
    Boltzmann Machines to do unsupervised pre-training.


    Deep neural networks suffer from the vanishing gradient problem, and for many
    years researchers couldn’t get around it - that is, until new unsupervised deep
    learning methods were invented.


    That is what this book aims to teach you.


    Aside from that, we are also going to look at Principal Components Analysis (PCA)
    and t-Distributed Stochastic Neighbor Embedding (t-SNE), which are not only related
    to deep learning mathematically, but often are part of a deep learning or machine
    learning pipeline.


    Mostly I am just ultra frustrated with the way PCA is usually taught! So I’m using
    this platform to teach you Principal Components Analysis in a clear, logical,
    and intuitive way without you having to imagine rotating globes and spinning vectors
    and all that nonsense.


    One major component of unsupervised learning is visualization. We are going to
    do a lot of that in this book. PCA and t-SNE both help you visualize data from
    high dimensional spaces on a flat plane.


    Autoencoders and Restricted Boltzmann Machines help you visualize what each hidden
    node in a neural network has learned. One interesting feature researchers have
    discovered is that neural networks learn hierarchically. Take images of faces
    for example. The first layer of a neural network will learn some basic strokes.
    The next layer will combine the strokes into combinations of strokes. The next
    layer might form the pieces of a face, like the eyes, nose, ears, and mouth. It
    truly is amazing!


    Perhaps this might provide insight into how our own brains take simple electrical
    signals and combine them to perform complex reactions.


    We will also see in this book how you can “trick” a neural network after training
    it! You may think it has learned to recognize all the images in your dataset,
    but add some intelligently designed noise, and the neural network will think it’s
    seeing something else, even when the picture looks exactly the same to you!


    So if the machines ever end up taking over the world, you’ll at least have some
    tools to combat them.


    Finally, in this book I will show you exactly how to train a deep neural network
    so that you avoid the vanishing gradient problem - a method called “greedy layer-wise
    pretraining”.


    “Hold up... what’s deep learning and all this other crazy stuff you’re talking
    about?”


    If you are completely new to deep learning, you might want to check out my earlier
    books and courses on the subject:


    [Deep Learning in Python](https://www.udemy.com/data-science-deep-learning-in-python)


    [Deep Learning in Python Prerequisities](https://www.udemy.com/data-science-logistic-regression-in-python)


    Much like how IBM’s Deep Blue beat world champion chess player Garry Kasparov
    in 1996, Google’s AlphaGo recently made headlines when it beat world champion
    Lee Sedol in March 2016.


    What was amazing about this win was that experts in the field didn’t think it
    would happen for another 10 years. The search space of Go is much larger than
    that of chess, meaning that existing techniques for playing games with artificial
    intelligence were infeasible. Deep learning was the technique that enabled AlphaGo
    to correctly predict the outcome of its moves and defeat the world champion.


    Deep learning progress has accelerated in recent years due to more processing
    power (see: Tensor Processing Unit or TPU), larger datasets, and new algorithms
    like the ones discussed in this book.


    ## Formatting


    I know that the e-book format can be quite limited on many platforms. If you find
    the formatting in this book lacking, particularly for the code or diagrams, please
    shoot me an email at [info@lazyprogrammer.me](mailto:info@lazyprogrammer.me) along
    with a proof-of-purchase, and I will send you the original ePub from which this
    book was created.


    # Chapter 1: Principal Components Analysis


    In this chapter we are going to talk about PCA or principal components analysis.
    There are 2 components to their description:


    1)describing what PCA does and how it is used


    2)the math behind PCA.


    So what does PCA do? Firstly, it is a linear transformation.


    If you think about what happens when you multiply a vector by a scalar, you’ll
    see that it never changes direction. It only becomes a vector of different length.
    Of course, you could multiply it by -1 and it would face the opposite direction,
    but it can’t be rotated arbitrarily.


    Ex. 2(1, 2) = (2, 4)


    If you multiply a vector by a matrix - it CAN change direction and be rotated
    arbitrarily.


    Ex. \[\[1, 1\], \[1, 0\]\] \[1, 2\]^T = \[3, 1\]^T


    So what does PCA do? Simply put, a linear transformation on your data matrix:


    Z = XQ


    It takes an input data matrix X, which is NxD, multiplies it by a transformation
    matrix Q, which is DxD, and outputs the transformed data Z which is also NxD.


    If you want to transform an individual vector x to a corresponding individual
    vector z, that would be z = Qx. It’s in a different order because when x is in
    a data matrix it’s a 1xD row vector, but when we talk about individual vectors
    they are Dx1 column vectors. It’s just convention.


    What makes PCA an interesting algorithm is how it chooses the Q matrix.


    Notice that because this is unsupervised learning, we have an X but no Y, or no
    targets.


    On Rotation


    Another view of what happens when you multiply by a matrix is not that you are
    are rotating the vectors, but you instead are rotating the coordinate system in
    which the vectors live.


    Which view we take will depend on which problem we are trying to solve.


    Dimensionality Reduction


    One use of PCA is dimensionality reduction. When you’re looking at the MNIST dataset,
    which is 28x28 images, or vectors of size 784, that’s a lot of dimensions, and
    it’s definitely not something you can visualize.


    28x28 is a very tiny image, and most images these days are much larger than that
    - so we either need to have the resources to handle data that can have millions
    of dimensions, or we could reduce the data dimensionality using techniques like
    PCA.


    We of course can’t just take arbitrary dimensions from X - we want to reduce the
    data size but at the same time capture as much information as possible.


    So if we want to go from 784 to 2 dimensions - so that we can visualize it - we
    want those 2 dimensions to have as much information from X as possible.


    Ex. info(1st col of Z) > info(2nd col of Z) > ...


    How do we measure this information? In traditional PCA and many other traditional
    statistical methods we use variance. If something varies more, it carries more
    information.


    You can imagine the opposite situation, where a variable is completely deterministic,
    i.e. it has no variance. Then measuring this variable would not give us any new
    information, because we already knew what it was going to be.


    So when we get our transformed data Z, what we want is for the first column to
    have the most information, the second column to have the second most information,
    and so on.'
