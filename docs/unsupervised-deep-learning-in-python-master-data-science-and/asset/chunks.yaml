    ```


    Note that `i` and `j` here are not the index for the dimensions like we did with
    PCA, but rather the `ith` and `jth` data point in the dataset, i.e. `i` and `j`
    are the `ith` and `jth` sample.


    Notice it kind of looks like a Gaussian distribution. You can think of “`s`” as
    a hyperparameter. It’s controlling the “spread” of the distribution. Next, we
    have our low-dimensional mapping `Y`, which we define in the same way, but there
    is no `s` term.


    ```

    q(i,j) = exp(-||yi - yj||²) / sum[k!=m]{ exp(-||ym - yk||²) }

    ```


    Note that we just set `p(i,i) = q(i,i) = 0`.


    So we’ve defined 2 probability distributions, one between every pair of points
    in `X`, and one between every pair of points in `Y`. We usually just initialize
    every data point in `Y` randomly. i.e. If we’re looking for 2-D representation,
    we’ll create `Y` as:


    ```

    Y = np.randn(N, 2)

    ```


    Once we’ve done that, we can try to find a better `Y` by optimizing some objective
    function that relates `p(i,j)` and `q(i,j)`. If you are not familiar with how
    we compare 2 probability distributions, usually use Kullback-Leibler divergence
    or `KL` divergence for short.


    ```

    C = D[KL](P || Q) = sum[i,j]{ p(i,j)log(p(i,j) / q(i,j)) }

    ```


    If `P` and `Q` are exactly the same, this would be `0`. How we solve this problem
    is the same as how we solve other problems of this - we take the derivative of
    the objective and do gradient descent. Notice how with this type of model we’t
    have weights - we just have `Y`. So are taking the gradient with respect to `Y`,
    which is the output itself. i.e.


    ```

    Y <- Y - learning_rate*dC/dY

    ```


    One problem with symmetric SNE and the SNE that came before is known as the “crowding
    problem”, which prevents gaps from forming around natural clusters. What t-SNE
    does is it uses different distributions for `Q` and `P`, which helps space out
    clusters. The new `P` and `Q` are defined as follows:


    ```

    p(i,j) = [p(i | j) + p(j | i)] / 2N

    ```


    Where:


    ```

    p(j | i) = exp(-||xi - xj||² /(2s²)) / sum[k!=i]{ exp(-||xi - xk||² /(2s²)) }

    ```


    Notice how here each sample has its own “`s`”.


    ```

    q(i,j) = (1 + ||yi - yj||²)^(-1) / sum[k!=m]{ (1 + ||yk - ym||²)^(-1) }

    ```


    The `Q` distribution uses the `t`-distribution, hence the name. The cost function
    remains the same as before. Note that we won’t actually implement t-SNE - even
    though it should be relatively simple given the definitions above. It’s easy to
    define the cost and find its derivative, which is more than we can say for many
    the deep learning models we’ve worked with. The problem is that it’s slow and
    has huge RAM requirements - in fact t-SNE will probably crash on your computer
    with the full MNIST dataset. Why? Because we need to calculate `q(i,j)` and `p(i,j)`
    for `i=1..N` and `j=1..N`, this is naturally an `O(N²)` algorithm.


    There is a variant of it, which is called `Barnes-Hut`, that is `O(NlogN)` run
    time, but still has huge RAM requirements. This is the default method used in
    SciKit Learn. One solution is to take a sample of just few hundred data points
    and do t-SNE on that, but of course you can increase this amount if you’re willing
    to wait longer and you have enough RAM.


    ### Exercises


    Try t-SNE (from the scikit learn library) on the MNIST dataset.


    Try writing your naive implementation given the definitions above, and take advantage
    of Theano’s automatic differentiation.


    # Chapter 3: Autoencoders and Stacked Denoising Autoencoders


    In this chapter we are going to talk about autoencoders. Autoencoders are actually
    nothing really new, just a small twist on something you already know. I always
    say that a supervised machine learning model has 2 main functions as its API,
    `train`/`fit`, and `predict`. Usually when we call a neural network, we call `model.fit(X,
    Y)`, and then to make predictions we call `model.predict(X)`. But what if we just
    make a neural network try to predict itself? So we call `model.fit(X, X)` instead.


    x -> z -> x’


    That’s exactly what an autoencoder is. In most of my previous courses, we did
    classification, but remember that our `X` can be any real value. So if you are
    trying to predict real values in general, you can use the squared error, and it
    becomes more like a regression. You can alternatively still use the cross-entropy
    error, and consider your inputs and outputs to be binary variables, even for variables
    that are not exactly binary. You’ll see that we do this with both autoencoders
    and RBMs, and you’ll see that both error functions can work. You can think of
    images like MNIST as having pixel intensities. 0 would be no intensity at all,
    and 1 would be maximum intensity, since we always scale by 255. To make the outputs
    go between 0 and 1, we are going to use the `sigmoid` function at both the hidden
    layer and output layer. One slight modification we sometimes use for both autoencoders
    and RBMs is the idea of shared weights. So instead of using another weight at
    the output layer, we just use the transpose of the first weight. Ex.


    ```

    Z = sigmoid(XW + b)

    X[hat] = sigmoid(ZW^T + c)

    ```


    We first encountered the idea of shared weights when we looked at convolutional
    neural networks, since it was the same filter getting passed along each part of
    the image. Remember that having shared weights is a kind of regularization because
    we are reducing the number of parameters, thereby reducing the chance of overfitting.


    Next, let’s return to the squared error objective. If we write it out in terms
    of the weights and the inputs (ignoring the biases), we get:


    ```

    J = || X - s(s(XW)W^T) ||²

    ```


    Remember back when we were doing PCA, I asked you to remember the objective function?
    Well consider what would happen if we did NOT use the sigmoid here.


    ```

    J = || X - XWW^T ||²

    ```


    We would in fact, just get back PCA! You can in fact think of autoencoders as
    a sort of nonlinear PCA. This is doing a nonlinear mapping, just like t-SNE.

