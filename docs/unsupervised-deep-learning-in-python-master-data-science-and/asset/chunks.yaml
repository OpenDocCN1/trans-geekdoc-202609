- raw: 'There is some material out there that goes over at a high level how you could
    have Gaussian units, but these other formulations have been reported to have stability
    issues, so we won’t cover them here.


    We are ready to talk about the math behind RBMs.


    Note that this is very similar to the regular Boltzmann machine, there is one
    term that depends on the interaction of 2 different nodes, and then a bias-like
    term that depends only on one node.


    The total energy is E(v,h) = -b^Tv - c^Th - v^TWh


    So if v is Dx1 and h is Mx1, then W must be DxM, which is what we usually have
    in a neural network.


    b is Dx1 and c is Mx1 to give us a valid dot product.


    Note that in terms of these variables, the conditional probabilities we talked
    about earlier are:


    p(h | v) = sigmoid(W^Tv + c) (forward direction)


    p(v | h) = sigmoid(Wh + b) (backward direction)


    Like autoencoders, we again use shared weights.


    Now that we have an expression for our energy function, we can now define the
    joint probability of v and h.


    P(v,h) = exp(-E(v,h)) / Z


    Where:


    Z = sum{ sum{ exp(-E(v,h) }}


    We call Z the partition function, which just ensures that all the probabilities
    add up to 1.


    Note that this itself is intractable to calculate, because the summations mean
    summing over all possible values of v and h. Since they are both binary variables,
    that is O(2^N) for each of them.


    Ex. if M=3, then the possible values for h are:


    000


    001


    010


    011


    100


    101


    110


    111


    And we must sum over all of them.


    What we want then, given this model, is to maximize P(v), which is P(v,h) marginalized
    over h. This is because we don’t actually care about the values of h, we just
    want to maximize the probability of what we have seen, which is v.


    i.e.


    P(v) = sum\[h\]{ P(v, h) }


    As usual, we don’t maximize P(v) directly, but rather the log of P(v). So let’s
    begin by trying to take its derivative with respect to some arbitrary parameter
    w.


    d(-log(P(v))/dw


    \= d(-log(sum\[h\] {P(v,h) } )/dw


    \= d(-log(sum\[h\] { exp(-E(v,h)) / Z })/dw


    \= sum\[h\]{ P(h | v)E(v,h) } -sum\[v,h\]{ P(v,h)E(v,h) }


    \=E[h | v]{ E(v,h) } - E[v,h]{ E(v,h) }


    This is read as “the expected value of E(v,h) over the conditional distribution
    P(h | v)” - “the expected value of E(v,h) over the joint distributoon P(v, h)”.


    So what we end up with is the difference between 2 expectations. The first expectation
    is easy but the second expectation is hard because it requires an infinite number
    of Gibbs samples. We usually call the first term the clamped term and the second
    term the unclamped term.


    Let’s take the previous expression and expand it further. Let’s do the input to
    hidden weights explicitly.


    J = sum\[h\]{ P(h | v)E(v,h) } - sum\[v,h\]{ P(v,h)E(v,h) }


    dJ/dW(i, j) = - sum\[h\] { P(h | v) h(j)v(i) } + sum\[v\]{ P(v)hP(h | v)h(j)v(i)
    }


    dJ/dW(i, j) = - p(h(j)=1 | v)v(i) + sum\[v\]{ P(v)p(h(j)=1 | v)v(i) }


    dJ/dW(i, j) = - sigmoid(c(j) + v^TW(:,j))v(i) + sum\[v\]{ P(v)sigmoid(c(j) + v^TW(:,j))v(i)
    }


    We can do similar derivatives for the biases and that gives us these 3 update
    equations:


    dJ/dW(i, j) = - sigmoid(c(j) + v^TW(:,j))v(i) + sum\[v\]{ P(v)sigmoid(c(j) + v^TW(:,j))v(i)
    }


    dJ/b(i) = v(i) - sum\[v\]{ P(v)v(i) }


    dJ/dc(j) = sigmoid(c(j) + v^TW(:,j)) - sum\[v\]{ P(v)sigmoid(c(j) + v^TW(:,j))
    }


    So now you see what we mean by the clamped term and unclamped term. We are going
    to get the first term simply by direct calculation, but we are going to get the
    second term - which requires a sum over all v - which is infeasible - by sampling.


    Note that if we were to code the RBM using numpy, we would use the actual gradient
    expressions directly as I previously defined them, but since Theano automatically
    finds gradients we don’t have to.


    Another method, which is the method we are going to use, makes use of a function
    called the free energy.


    We define the free energy as the negative log of the sum over all h of the top
    part of the joint probability.


    F(v) = -log( sum\[h\]{ exp(-E(v,h)) } )


    It’s hard to prove because you can’t just use direct algebraic notation, but if
    you are interested in learning more this is a result of all the units being conditionally
    independent, and it is related to something called the sum-product algorithm.
    In any case, the free energy reduces to:


    F(v) = -b^Tv - sum\[j=1..M\]{ log(1+exp(c(j) + v^TW(:,j))) }


    So that it now no longer depends on h at all.


    When you use this in the cost function and take the derivative, what you get is
    a simpler expression with only one expected value.


    dJ(v)/dw = dF(v)/dw - sum\[v’\]{ P(v’)dF(v’)/dw }


    Notice how this actually gives us the same update rules as before.


    We call the first term the positive phase and the second term the negative phase.


    Since the first term goes in the direction of the free energy at the sample v,
    it’s basically trying to reduce the energy for that particular v, which corresponds
    to a higher probability for that sample v.


    The other term, the negative phase, tries to lower the probability for ALL possible
    values of v.


    One last note about RBMs is that we can stack them just like how we stack autoencoders
    and do “greedy layer-wise pretraining”.


    Except when we stack RBMs they get a special name - they are called deep belief
    networks.


    One small note about the proper terminology here - “deep belief network” refers
    to the unsupervised model, whereas if you train it in a supervised way it is called
    a “deep neural network”.


    Sometimes “deep belief network” can also refer to the stacked autoencoder configuration
    from the last chapter.


    Contrastive Divergence


    In this section we are going to talk about the sampling algorithm, called contrastive
    divergence, that we use to estimate the gradient we derived in the last section.


    If you found the material in the last lecture hard, don’t worry too much about
    it, because following the steps of the CD algorithm is actually much easier.


    Contrastive divergence is usually called CD-k, meaning you do k steps of Gibbs
    sampling.


    What that means is, given a training sample v0, we are going to calculate p(h0|v0)
    which is just the usual forward pass on the network. Next, we are going to use
    those probabilities to draw a sample of h - call that h0.


    So if p(h\_j | v) is 0.3, then h\_j will be 1 with probability 0.3.


    Next, we do a backwards pass, so we calculate p(v1|h0). Now we use these probabilities
    to draw a sample of visibles v1.


    Next, we calculate p(h1|v1), and take a sample of h again. We keep repeating this
    process to infinity.


    o---o---o---o-...


    v0 h0 v1 h1...


    By going to infinity, we get an exact answer, but we obviously cannot train the
    neural network for that long.


    What researchers have found is that k=1 works just fine. We will use k=1 also,
    which will allow us to avoid having to do any loops.


    In pseudocode, the process might look something like this:


    def derivative(v0):


    p\_h0 = self.forward(v0)


    h0 = sample(p\_h0)


    p\_v1 = self.backward(h0)


    v1 = sample(p\_v1)


    p\_h1 = self.forward(v1)


    return v0.dot(p\_h0.T) - v1.dot(p\_h1.T)


    Of course, that would work fine if we were using numpy, but we are going to use
    Theano, which will find the gradients automatically.


    What we will do instead, is after we calculate v1 from v0, we will set the objective
    to the free\_energy(v0) - free\_energy(v1), and let Theano calculate the gradient
    for us.


    One interesting thing is, because we don’t actually want to calculate P(v), we
    still want to plot some cost function as training progresses.


