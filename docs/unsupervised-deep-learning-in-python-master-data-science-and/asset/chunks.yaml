- raw: 'Are you comfortable with this material, and you want to take your deep learning
    skillset to the next level? Then my follow-up Udemy course on deep learning is
    for you. Similar to this book, I take you through the basics of Theano and TensorFlow
    - creating functions, variables, and expressions, and build up neural networks
    from scratch. I teach you about ways to accelerate the learning process, including
    batch gradient descent, momentum, and adaptive learning rates. I also show you
    live how to create a GPU instance on Amazon AWS EC2, and prove to you that training
    a neural network with GPU optimization can be orders of magnitude faster than
    on your CPU.


    [Data Science: Practical Deep Learning in Theano and TensorFlow](https://www.udemy.com/data-science-deep-learning-in-theano-tensorflow/)


    [https://www.udemy.com/data-science-deep-learning-in-theano-tensorflow](https://www.udemy.com/data-science-deep-learning-in-theano-tensorflow)


    When you’ve got the basics of deep learning down, you’re ready to explore alternative
    architectures. One very popular alternative is the convolutional neural network,
    created specifically for image classification. These have promising applications
    in medical imaging, self-driving vehicles, and more. In this course, I show you
    how to build convolutional nets in Theano and TensorFlow.


    [Deep Learning: Convolutional Neural Networks in Python](https://www.udemy.com/deep-learning-convolutional-neural-networks-theano-tensorflow)


    [https://www.udemy.com/deep-learning-convolutional-neural-networks-theano-tensorflow](https://www.udemy.com/deep-learning-convolutional-neural-networks-theano-tensorflow)


    In part 4 of my deep learning series, I take you through unsupervised deep learning
    methods (that’s this book!). We study principal components analysis (PCA), t-SNE
    (jointly developed by the godfather of deep learning, Geoffrey Hinton), deep autoencoders,
    and restricted Boltzmann machines (RBMs). I demonstrate how unsupervised pretraining
    on a deep network with autoencoders and RBMs can improve supervised learning performance.


    [Unsupervised Deep Learning in Python](https://www.udemy.com/unsupervised-deep-learning-in-python)


    [https://www.udemy.com/unsupervised-deep-learning-in-python](https://www.udemy.com/unsupervised-deep-learning-in-python)


    Would you like an introduction to the basic building block of neural networks
    - logistic regression? In this course I teach the theory of logistic regression
    (our computational model of the neuron), and give you an in-depth look at binary
    classification, manually creating features, and gradient descent. You might want
    to check this course out if you found the material in this book too challenging.


    [Data Science: Logistic Regression in Python](https://udemy.com/data-science-logistic-regression-in-python)


    [https://udemy.com/data-science-logistic-regression-in-python](https://udemy.com/data-science-logistic-regression-in-python)


    To get an even simpler picture of machine learning in general, where we don’t
    even need gradient descent and can just solve for the optimal model parameters
    directly in “closed-form”, you’ll want to check out my first Udemy course on the
    classical statistical method - linear regression:


    [Data Science: Linear Regression in Python](https://www.udemy.com/data-science-linear-regression-in-python)


    [https://www.udemy.com/data-science-linear-regression-in-python](https://www.udemy.com/data-science-linear-regression-in-python)


    If you are interested in learning about how machine learning can be applied to
    language, text, and speech, you’ll want to check out my course on Natural Language
    Processing, or NLP:


    [Data Science: Natural Language Processing in Python](https://www.udemy.com/data-science-natural-language-processing-in-python)


    [https://www.udemy.com/data-science-natural-language-processing-in-python](https://www.udemy.com/data-science-natural-language-processing-in-python)


    If you are interested in learning SQL - structured query language - a language
    that can be applied to databases as small as the ones sitting on your iPhone,
    to databases as large as the ones that span multiple continents - and not only
    learn the mechanics of the language but know how to apply it to real-world data
    analytics and marketing problems? Check out my course here:


    [SQL for Marketers: Dominate data analytics, data science, and big data](https://www.udemy.com/sql-for-marketers-data-analytics-data-science-big-data)


    [https://www.udemy.com/sql-for-marketers-data-analytics-data-science-big-data](https://www.udemy.com/sql-for-marketers-data-analytics-data-science-big-data)


    Are you interested in stock prediction, time series, and sequences in general?
    My Hidden Markov Models course is where you want to be. I teach you not only all
    the classical theory of HMMs, but I also show you how to write them in Theano
    using gradient descent! This is great practice for writing deep learning models
    and it will prepare you well for its sequel, Deep Learning Part 5: Recurrent Neural
    Networks in Python. You can get the HMM course here:


    [Unsupervised Machine Learning: Hidden Markov Models in Python](https://udemy.com/unsupervised-machine-learning-hidden-markov-models-in-python)


    [https://udemy.com/unsupervised-machine-learning-hidden-markov-models-in-python](https://udemy.com/unsupervised-machine-learning-hidden-markov-models-in-python)


    Finally, I am always giving out coupons and letting you know when you can get
    my stuff for free. But you can only do this if you are a current student of mine!
    Here are some ways I notify my students about coupons and free giveaways:


    My newsletter, which you can sign up for at [http://lazyprogrammer.me](http://lazyprogrammer.me)
    (it comes with a free 6-week intro to machine learning course)


    My Twitter, [https://twitter.com/lazy\_scientist](https://twitter.com/lazy_scientist)


    My Facebook page, [https://facebook.com/lazyprogrammer.me](https://facebook.com/lazyprogrammer.me)
    (don’t forget to hit “like”!)'
