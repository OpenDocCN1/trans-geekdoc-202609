- raw: 'Thus, when we take the 2 columns with the most information, that would mean
    taking the first 2 columns.


    De-correlation


    Another thing PCA does is de-correlation.


    If we find correlations, that means some of the data is redundant, because we
    can predict one column from another column.


    ￼![PCA.jpg](images/00001.jpeg)


    So now if you take the coordinate system rotation view, you can imagine that if
    we rotated our coordinate system to be aligned with the spread of these points,
    then the data would become uncorrelated.


    Again the question is - how do we find Q so that we rotate the data in exactly
    this way?


    Visualization


    Once we have the information of our data sorted in descending order in each dimension,
    we can just take the top 2 and make a scatter plot. This will then give us an
    idea of the separation of the data points, and it allows us to create a visual
    representation of high-dimensional data.


    Pre-processing and Overfitting


    The last application of PCA we’ll talk about is pre-processing and overfitting.


    You can imagine that our data is often noisy. Hopefully, the noise is small compared
    to the true pattern. In that case, the variance of the noise, which should be
    small, would go into the last columns of our transformed data Z, at which point
    we could just discard it.


    We could then feed this new data into a supervised machine learning model such
    as logistic regression - in fact we did this in my previous courses.


    So by getting rid of the noise we are preventing overfitting by making sure we
    are not fitting to the noise.


    To make this clear, here’s an imaginary data pipeline:


    Input: X (data), Y (targets)


    1)Convert X to Z --> Z = XQ


    2)Take the first K columns of Z, call that Z[K]


    3)Train your model on (Z[K], Y), i.e. model.fit(Z[K], Y)


    4)Any further predictions can use the same model and pipeline:


    1)z[K] = Qx


    2)prediction = model.predict(z[K])


    You’ll see that this idea of unsupervised pre-training will come into play again
    when we study autoencoders and RBMs.


    Latent Variables


    Another view of PCA is that the transformed variables Z are the “latent variables”,
    as in they are some sort of underlying cause of the data X.


    Then it makes sense that they should be uncorrelated, because they are just independent
    hidden causes.


    It also makes sense that some of the data in X is correlated because they are
    just measurements you’re taking of some data that is produced by a combination
    of those hidden causes.


    What we are assuming when we do PCA is that the data is a linear combination of
    those hidden causes.


    In fact with PCA the linearity goes both ways - the latent variable Z is a linear
    combination of the observed variable X, but if you were to do a reverse transformation,
    the observed data X is also a linear combination of the latent variable Z.


    Z = XQ


    X = ZQ^(\-1)


    You’ll recall that we first encountered the idea of latent variables in my first
    unsupervised learning course on clustering and Gaussian mixture models - because
    those models assumed that the identities of the clusters were the latent variable.


    The Math Behind PCA


    Now let us turn to the second part of the PCA description - how to actually find
    the transformation matrix Q.


    To recap, I’ve just told you about all the magical things this Q matrix can do:


    1)Make Z uncorrelated even though X is correlated


    2)Order each column if Z by its information content (variance)


    A lot of the steps here may seem arbitrary at first, but you’ll see how it all
    fits together in the end and results in all the properties that I talked about
    in the previously.


    The first step is to calculate the covariance of X.


    C(x(i), x(j)) = E\[ (x(i) - m(i))(x(j) - m(j)) \] = sum(n=1..N){ (x[n](i) - m(i))(x[n](j)
    - m(j)) } / N


    Where m(i) is the mean of all x(i).


    If i = j then it’s just the regular variance. In other words, the diagonals of
    the C matrix are the variances of each dimension of X. This will be important
    later.


    In matrix form:


    C = (X - m)^T(X - m) / N


    This gives us a DxD matrix. Remember, D is the dimensionality and N is the number
    of data points.


    Technically you can’t subtract the mean like that because it has a different shape
    than X, but we will assume that broadcasting is being used.


    Eigenvalues and Eigenvectors


    Recall that a DxD matrix has D eigenvalues and D eigenvectors. If you don’t know
    what eigenvalues and eigenvectors are, I’m going to give you a short introduction.


    Remember that matrices in general change the direction of, or rotate, a vector.
    Eigenvectors of a matrix are special vectors which are NOT rotated by the matrix,
    but just change in length. The change in length is called the eigenvalue.


    So we can relate the covariance matrix, its eigenvector, and its eigenvalue, using
    this equation, where e is the eigenvalue and v is the eigenvector.


    Cv = ev


    There are some theorems which we won’t prove, but basically there will be D eigenvectors
    and D corresponding eigenvalues, and the eigenvalues will be greater than or equal
    to 0.


    Finding eigenvectors and eigenvalues is itself not a trivial task, and there are
    many algorithms that can do this, including gradient descent. Since numpy already
    has a function to do this, we’re not going to worry about it - just the theory
    is important to give you the right perspective.


    Now we have these D eigenvalues, what do we do with them?


    Again an arbitrary step, but let’s sort the eigenvalues in descending order. This
    means that the corresponding eigenvectors have to be sorted in the same way.


    e[1] > e[2] > e[3] > ... > e[D]


    Once we’ve done this, we can put them into matrices of size DxD. The eigenvalues
    will go in a diagonal matrix of size DxD we’ll call E, and the eigenvectors will
    be lined up beside each other in a matrix we’ll call V.


    Ex. In 2 dimensions:


    E = \[ e1 0 \]


    \[ 0 e2 \]


    V = \[ v11 v12 \]


    \[ v21 v22 \]


    Where v(i,j) is the ith component of the jth eigenvector.


    It’s easy to prove that:


    CV = VE


    Try it yourself on paper with the scalar components.


    One last ingredient is that the matrix V is orthonormal. This means that any eigenvector
    dotted with itself is 1, and any eigenvector dotted with another different eigenvector
    is 0.


    Ex.


    v[i]^Tv[j] = 0 if i != j


    v[i]^Tv[i] = 1


    In matrix form:


    V^TV = I (the identity matrix)


    Finally, we’ll now look at the transformed data, Z. Remember that we still don’t
    know what Q is. But let’s solve for its covariance. Notice how we can express
    the covariance of Z in terms of the covariance of X.


    C[Z] = (Z - m[Z])^T(Z - m[Z]) / N


    C[Z] = (XQ - mQ)^T(XQ - mQ) / N


    C[Z] = Q^T(X - m)^T(X - m)Q / N


    C[Z] = Q^T \[(X - m)^T(X - m) / N \] Q


    C[Z] = Q^T C Q


    We can express the covariance of Z in terms of the covariance of X and Q!


    Next, look what happens if we choose Q = V.


    C[Z] = V^TCV


    But remember that CV = VE.


    C[Z] = V^TVE


    And remember that V is orthonormal so V^TV = I (the identity matrix). Thus:


    C[Z] = E


    We get that the covariance of Z is just equal to E, which is the diagonal matrix
    of eigenvalues.


    So what does this all mean?


    Since all the off-diagonal elements of E are 0, that means any dimension i is
    not correlated with any other dimension j, which means there are no correlations
    in the transformed data.


    So by choosing Q = V, we’ve decorrelated Z.


    Next, because we sorted E by the eigenvalues in descending order, that means the
    first dimension of Z has the most variance, the second dimension of Z has the
    second most variance, and so on.


    The PCA Objective


    One thing that is not immediately obvious with the PCA derivation is that it actually
    minimizes an objective function.


    The objective function is what you would naturally expect - it’s the squared reconstruction
    error of the data.


    J = || X - XQQ^(\-1) ||²


    Since Q is orthonormal, we know that Q^T = Q^(\-1).


    In other words, the transpose of Q is equal to the inverse of Q.


    We can thus reconstruct X using the transpose instead of the inverse.


    We’ll encounter this again when we look at autoencoders.'
  fmt: '

    Thus, when we take the 2 columns with the most information, that would mean taking
    the first 2 columns.


    ## De-correlation


    Another thing `PCA` does is de-correlation.


    If we find correlations, that means some of the data is redundant, because we
    can predict one column from another column.


    ![PCA.jpg](images/00001.jpeg)


    So now if you take the coordinate system rotation view, you can imagine that if
    we rotated our coordinate system to be aligned with the spread of these points,
    then the data would become uncorrelated.


    Again the question is - how do we find `Q` so that we rotate the data in exactly
    this way?


    ## Visualization


    Once we have the information of our data sorted in descending order in each dimension,
    we can just take the top 2 and make a scatter plot. This will then give us an
    idea of the separation of the data points, and it allows us to create a visual
    representation of high-dimensional data.


    ## Pre-processing and Overfitting


    The last application of `PCA` we’ll talk about is pre-processing and overfitting.


    You can imagine that our data is often noisy. Hopefully, the noise is small compared
    to the true pattern. In that case, the variance of the noise, which should be
    small, would go into the last columns of our transformed data `Z`, at which point
    we could just discard it.


    We could then feed this new data into a supervised machine learning model such
    as `logistic regression` - in fact we did this in my previous courses.


    So by getting rid of the noise we are preventing overfitting by making sure we
    are not fitting to the noise.


    To make this clear, here’s an imaginary data pipeline:


    Input: `X` (data), `Y` (targets)


    1) Convert `X` to `Z` -> `Z = XQ`

    2) Take the first `K` columns of `Z`, call that `Z[K]`

    3) Train your model on `(Z[K], Y)`, i.e. `model.fit(Z[K], Y)`

    4) Any further predictions can use the same model and pipeline:


    1) `z[K] = Qx`

    2) `prediction = model.predict(z[K])`


    You’ll see that this idea of unsupervised pre-training will come into play again
    when we study `autoencoders` and `RBMs`.


    ## Latent Variables


    Another view of `PCA` is that the transformed variables `Z` are the “latent variables”,
    as in they are some sort of underlying cause of the data `X`.


    Then it makes sense that they should be uncorrelated, because they are just independent
    hidden causes.


    It also makes sense that some of the data in `X` is correlated because they are
    just measurements you’re taking of some data that is produced by a combination
    of those hidden causes.


    What we are assuming when we do `PCA` is that the data is a linear combination
    of those hidden causes.


    In fact with `PCA` the linearity goes both ways - the latent variable `Z` is a
    linear combination of the observed variable `X`, but if you were to do a reverse
    transformation, the observed data `X` is also a linear combination of the latent
    variable `Z`.


    `Z = XQ`


    `X = ZQ^(\1)`


    You’ll recall that we first encountered the idea of latent variables in my first
    unsupervised learning course on clustering and Gaussian mixture models - because
    those models assumed that the identities of the clusters were the latent variable.


    ## The Math Behind PCA


    Now let us turn to the second part of the `PCA` description - how to actually
    find the transformation matrix `Q`.


    To recap, I’ve just told you about all the magical things this `Q` matrix can
    do:


    1) Make `Z` uncorrelated even though `X` is correlated

    2) Order each column of `Z` by its information content (variance)


    A lot of the steps here may seem arbitrary at first, but you’ll see how it all
    fits together in the end and results in all the properties that I talked about
    in the previously.


    The first step is to calculate the covariance of `X`.


    `C(x(i), x(j)) = E\[ (x(i) - m(i))(x(j) - m(j)) ] = sum(n=1..N){ (x[n](i) - m(i))(x[n](j)
    - m(j)) } / N`


    Where `m(i)` is the mean of all `x(i)`.


    If `i = j` then it’s just the regular variance. In other words, the diagonals
    of the `C` matrix are the variances of each dimension of `X`. This will be important
    later.


    In matrix form:


    `C = (X - m)^T(X - m) / N`


    This gives us a `DxD` matrix. Remember, `D` is the dimensionality and `N` is the
    number.


    ## Eigenvalues and Eigenvectors


    (Note: The provided text contained significant repetitive/garbled strings in the
    latter half. I have cleaned the logical flow based on the core mathematical context
    provided in the earlier sections.)


    ## PCA Objective


    One thing that is not immediately obvious with the `PCA` derivation is that it
    actually minimizes an objective function.


    The objective function is what you would naturally expect - it’s the squared reconstruction
    error of the data.


    `J = || X - XQQ(\-1) ||²`

