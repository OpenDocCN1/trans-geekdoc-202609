    # Chapter 3: Autoencoders and Stacked Denoising Autoencoders


    In this chapter we are going to talk about autoencoders. Autoencoders are actually
    nothing really new, just a small twist on something you already know.


    I always say that a supervised machine learning model has 2 main functions as
    its API, train or fit, and predict.


    Usually when we call a neural network, we call model.fit(X, Y), and then to make
    predictions we call model.predict(X).


    But what if we just make a neural network try to predict itself? So we call model.fit(X,
    X) instead.


    o---o---o


    x z x’


    That’s exactly what an autoencoder is.


    In most of my previous courses, we did classification, but remember that our X
    can be any real value.


    So if you are trying to predict real values in general, you can use the squared
    error, and it becomes more like a regression.


    You can alternatively still use the cross-entropy error, and consider your inputs
    and outputs to be binary variables, even for variables that are not exactly binary.


    You’ll see that we do this with both autoencoders and RBMs, and you’ll see that
    both error functions can work.


    You can think of images like MNIST as having pixel intensities. 0 would be no
    intensity at all, and 1 would be maximum intensity, since we always scale by 255.


    To make the outputs go between 0 and 1, we are going to use the sigmoid function
    at both the hidden layer and output layer.


    One slight modification we sometimes use for both autoencoders and RBMs is the
    idea of shared weights.


    So instead of using another weight at the output layer, we just use the transpose
    of the first weight.


    Ex.


    Z = sigmoid(XW + b)


    X[hat] = sigmoid(ZW^T + c)


    We first encountered the idea of shared weights when we looked at convolutional
    neural networks, since it was the same filter getting passed along each part of
    the image.


    Remember that having shared weights is a kind of regularization because we are
    reducing the number of parameters, thereby reducing the chance of overfitting.


    Next, let’s return to the squared error objective.


    If we write it out in terms of the weights and the inputs (ignoring the biases),
    we get:


    J = || X - s(s(XW)W^T) ||²


    Remember back when we were doing PCA, I asked you to remember the objective function?


    J = || X - XQQ^T ||²


    Well consider what would happen if we did NOT use the sigmoid here.


    J = || X - XWW^T ||²


    We would in fact, just get back PCA!


    You can in fact think of autoencoders as a sort of nonlinear PCA.


    This is doing a nonlinear mapping, just like t-SNE.'
