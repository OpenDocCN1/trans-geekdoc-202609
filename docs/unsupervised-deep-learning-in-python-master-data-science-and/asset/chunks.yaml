    Exercises


    Add denoising to the autoencoder.


    Cross-Entropy vs. KL Divergence


    You have already seen that KL Divergence can be used to compare the similarity
    of 2 probability distributions, as we did with t-SNE.


    One identity to remember is that cross-entropy is equivalent to KL divergence
    up to an additive constant.


    i.e.


    H(P, Q) = cross-entropy between P and Q


    H(P) = entropy of P


    D[KL](P || Q) = KL divergence between P and Q


    H(P,Q) = -sum\[i\]{ P(i) logQ(i) }


    H(P) = -sum\[i\]{ P(i) logP(i) }


    D[KL](P || Q) = sum\[i\]{ P(i)log( P(i) / Q(i) }


    We can show that:


    H(P,Q) = H(P) + D[KL](P || Q)


    Why is this significant?


    The derivative of a constant is 0. Therefore, the gradient, and thus gradient
    descent, is the same for both cross-entropy and KL divergence.


    So when we use cross-entropy on the autoencoder, what we’re really saying is the
    distribution of the input X is the target distribution, and the distribution of
    the reconstruction of X is the output distribution, and we would like them to
    be the same.


    Summary


    The MOST important concept to get out of this is that for the single autoencoder,
    the “Z” is a “low-dimensional representation” of the input data X. We saw this
    same concept with PCA. We will see it again with RBMs.


    # Chapter 4: Restricted Boltzmann Machines and Deep Belief Networks


    In this chapter we are going to talk about Restricted Boltzmann Machines and deep
    belief networks, which is just stacked Restricted Boltzmann Machines - used in
    exactly the same way we stacked autoencoders.


    It’s interesting to look back at what we’ve learned at this point.


    When we did linear regression - we were able to calculate the derivative of the
    cost, set it to 0, and solve for the weights to get the best weights.


    With logistic regression and neural networks, you know that we can’t directly
    solve for the weights, so we take the derivative of the cost with respect to the
    weights, and take small steps in that direction.


    With RBMs, we enter an even more difficult situation. We can’t even calculate
    the derivative, so instead we try to estimate it approximately using Gibbs sampling,
    which is a special case of Markov Chain Monte Carlo.


    To understand RBMs, we first have to talk a little bit about Markov random fields.


    A Markov random field is just a graph of states, where each node is a state, which
    is a random variable.


    A B


    o--o


    |\\/|


    |/\\|


    o--o


    C D


    P(A, B, C, D)


    A Markov random field represents a joint probability distribution, i.e. the probability
    of all those random variables.


    2 things to note about the MRF:


    First: that the Markov property holds, i.e.:


    P(s(t) | s(t-1), s(t-2), ...) = P(s(t) | s(t-1))


    The next state only depends on the current state, and not on any states before
    that.


    Second: the graph is undirected, so you can move along any edge in any direction.


    This brings us to the concept of Boltzmann machines.


    Boltzmann machines are Markov random fields where everything is connected to everything.


    The idea is you define an energy on the network, and your goal is to find the
    minimum energy state, much like how physical systems do.


    In fact, the Boltzmann distribution, which is the distribution we use when we
    talk about Boltzmann machines and restricted Boltzmann machines, is from statistical
    mechanics.


    The energy is defined as:


    E(s) = -( sum\[i,j\]{ w(i,j)s(i)s(j) } + sum\[i\]{ b(i)s(i) }


    It’s not super important since we won’t be using this exact form, but recognize
    the “structure” here. There’s a 2-D weight that gets multiplied by “interaction
    terms” and a 1-D linear weight.


    Now we can go from Boltzmann machines to restricted Boltzmann machines.


    Here instead of everything being connected to everything, we instead have a “bipartite
    graph”.


    ￼![bipartite.jpg](images/00002.jpeg)


    This means that everything on the left is connected to everything on the right,
    and vice versa.


    We usually label the nodes on the left the visible units (v), and the nodes on
    the right the hidden units (h). This gives us a latent variable model, just like
    with PCA and autoencoders.


    Note that the Markov property still holds. What this means in this graph is that
    we have conditional independence. So the probability p(h(i) | v) is independent
    of the probability p(h(j) | v).


    Similarly, if you go in the other direction (remember, this graph is undirected),
    the probability p(v(i) | h) is independent of the probability p(v(j) | h).


    With RBMs we technically assume both the visible units and hidden units are binary
    units.


    This is why we used the sigmoid for autoencoders also, and why we only use the
    sigmoid uniformly throughout this book.


    We know that this works just fine for MNIST, and in fact a lot of data is binary.
    All categorical variables, since we use one-hot encoding, are binary, as are bag
    of words models, so basically anything to do with NLP will work here too.'
