- "# Python 无监督深度学习：使用 Python 和 Theano 编写的现代神经网络精通数据科学与机器学习\n\n\n\n\n\n\n\n## 引言\n\
  \n当我们谈论现代深度学习时，我们通常指的不是普通的神经网络——而是新的进展，例如使用 `Autoencoders` 和 `Restricted Boltzmann\
  \ Machines` 来进行无监督预训练。\n\n深度神经网络深受梯度消失问题的困扰，多年来研究人员一直无法解决这个问题——直到新的无监督深度学习方法被发明出来。\n\
  \n这这本书想要教给你的内容。\n\n此外，我们还会介绍 `Principal Components Analysis`（`PCA`）和 `t-Distributed\
  \ Stochastic Neighbor Embedding`（`t-SNE`），它们不仅在数学上与深度学习相关，而且通常是深度学习或机器学习流水线的一部分。\n\
  \n我对 `PCA` 通常的教学方式感到非常沮丧！因此，我正在这个平台上用一种清晰、逻辑化且直观的方式教你 `Principal Components Analysis`，而你不需要想象旋转的地球仪和旋转向量之类的这类八道。\n\
  \n无监督学习的一个主要组成部分是可视化。我们将在书中进行大量的尝试。`PCA` 和 `t-SNE` 都能帮助你将高维空间的数据可视化到二维平面上。\n\n`Autoencoders`\
  \ 和 `Restricted Boltzmann Machines` 帮助你可视化神经网络中每个隐藏节点学习了什么。研究人员发现的一个有趣特性是神经网络是分层学习的。以人脸图像为例，神经网络的第一层将学习一些基础笔画。下一层将这些笔画组合成组合。再一层可能会形成脸部的部位，如眼睛、鼻子和嘴巴。这真的太神奇了！\n\
  \n这可能为我们大脑如何获取简单信号并将其组合以执行复杂反应提供见解。在书中，我们还将看到如何在训练神经网络后“欺骗”它！你可能认为它已经学会了识别数据集中的所有图像，但加入一些智能噪声，神经网络就会认为它看到了其他东西，即使这张照片对你来说完全看起来一样！\n\
  \n所以，如果机器最终接管了世界，你至少有一些工具来对抗它们。最后，在书中，我将向你展示如何如何训练深度神经网络以避免梯度消失问题——这种方法被称为“贪婪逐层预训练”。等一下……深度学习以及这些疯狂的东西到底是什么？如果你是深度学习的初学者，你可能想查看我之前关于该主题的书和课程：[Deep\
  \ Learning in Python](https://www.udemy.com/data-science-deep-learning-in-python),\
  \ [Deep Learning in Python Prerequisites](https://www.udemy.com/data-science-logistic-regression-in-python)。\n\
  \n就像 IBM 的 `Deep Blue` 在 1996 年击败世界冠军 `Garry Kasparov` 一样，谷歌的 `AlphaGo` 在 2016 年\
  \ 3 月击败世界冠军 `Lee Sedol` 时登上头条。这次胜利令人惊讶的地方在于，该领域的专家认为这将在 10 年后才会发生。围棋的搜索空间远大于象棋，深度学习是使\
  \ `AlphaGo` 能够正确预测移动结果并击败世界冠军的技术。由于更强的处理能力（参见张量处理单元或 `TPU`）、更大的数据集以及像书中讨论的新型算法，深度学习的进展在近年来加速了。\n\
  \n## 格式\n\n我知道电子书的格式在许多平台上可能非常有限。如果你发现这本书的格式存在缺陷，特别是在代码或图表方面，请向 `info@lazyprogrammer.me`\
  \ 向我发送电子邮件，我将向你发送创建这本书的原始 `epub` 文件。\n\n## 第 1 章：主成分分析\n\n在本章中，我们将讨论 `PCA` 或主成分分析。其描述包含两个部分：\n\
  \n1. 描述 `PCA` 的作用以及如何使用它\n2. `PCA` 背后的数学原理\n\n那么 `PCA` 是做什么的？首先，它是一个线性变换。\n\n如果你考虑将向量乘以一个标量时会发生什么，你会发现它永远不会改变方向。它只是变成了一个长度不同的向量。当然，你可以把它乘以\
  \ `-1`，它将指向相反的方向，但它不能被任意旋转。\n\n例。`2(1, 2) = (2, 4)`\n\n如果你将向量乘以矩阵——它可以改变方向并被任意旋转。\n\
  \n例。`[[1, 1], [1, 0]][1, 2]^T = [3, 1]^T`\n\n那么 `PCA` 是做什么的？简单来说，是对你的数据矩阵进行线性变换：\n\
  \n```\nZ = XQ\n```\n\n它接收一个输入数据矩阵 `X`（大小为 `Nx`），乘以变换矩阵 `Q`（大小为 `DxD`），并输出转换后的数据\
  \ `Z`（也是 `Nx`）。\n\n如果你想将单个向量 `x` 转换为对应的单个向量 `z`，那就是：\n```\nz = Qx\n```\n顺序不同是因为当\
  \ `x` 在数据矩阵中时，它是一个 `1xD` 行向量，但当我们谈论单个向量时，它们是 `Dx1` 列向量。这只是习惯用法。\n\n让 `PCA` 变得有趣的算法是它选择\
  \ `Q` 矩阵的方式。注意，因为这是无监督学习，我们有 `X` 但没有 `Y`，或者没有目标。\n\n### 旋转\n\n乘以矩阵时发生变化的另一种视角不是你正在旋转向量，而是你正在旋转向量所在的坐标系。我们采取哪种视角取决于我们正在试图解决什么问题。\n\
  \n### 降维\n\n`PCA` 的一个用途是降维。当你查看 de `MNIST` 数据集时（它是 28x28 的图像，或者大小为 784 的向量），维度非常多，这绝对不是你可以可视化的。\n\
  \n`28x28` 是一个非常小的图像，而现在的大多数图像都比这大得多——所以我们要么需要处理具有数百万维度数据的资源，要么可以使用像 `PCA` 这样的技术来降低数据维度。\n\
  \n我们不能仅仅从 `X` 中提取任意维度——我们想减小数据规模，同时尽可能地捕捉信息。因此，如果我们想从 784 降到 2 个维度——以便我们可视化——我们希望这\
  \ 2 个维度尽可能包含来自 `X` 的信息。\n\n例。`info(1st col of Z) > info(2nd col of Z) > ...`\n\n\
  我们如何衡量这种信息？在传统的 `PCA` 和许多其他传统的统计方法中，我们使用方差。如果某物变化越大，携带的信息就越多。你可以想象相反的情况，即一个变量是完全确定的，也就是说它没有方差。那么测量这个变量就不会带给我们任何新信息，因为我们已经知道它会是什么了。\n\
  \n所以当我们得到转换后的数据 `Z` 时，我们希望第一列拥有最多的信息，第二列拥有第二多的信息，依此类推。\n\n\n\n\n因此，当我们选取信息量最大的 2\
  \ 列时，意味着选取了前 2 列。\n\n### 去相关性\n\n`PCA` 的另一个作用是去相关性。\n\n如果我们发现相关性，意味着某些数据是冗余的，因为我们可以从其中一列预测出另一列。\n\
  \n![PCA.jpg](img/00001.jpeg)\n\n现在，如果你从坐标系旋转的角度来看，可以想象，如果我们旋转坐标系使其与这些点的分布对齐，那么数据就会变得互不相关。\n\
  \n问题再次是——我们如何找到 `Q` 以便完全按照这种方式旋转数据呢？\n\n### 可视化\n\n一旦我们将数据在每个维度上的信息按降序排列，就可以取前 2\
  \ 个维度并绘制散点图。这将让我们对数据点的分离情况有一个直观的认识，并允许我们创建高维数据的视觉表示。\n\n### 预处理与过拟合\n\n我们将讨论的 `PCA`\
  \ 的最后一个应用是预处理和过拟合。\n\n你可以想象我们的数据通常包含噪声。希望噪声与真实模式相比是很小的。在这种情况下，噪声的方差（本应很小）会进入我们变换后的数据\
  \ `Z` 的最后几列，此时我们将其丢弃即可。\n\n我们可以将这些新数据输入到监督机器学习模型中，例如 `logistic regression` —— 实际上，在我之前的课程中我们就这样做过。\n\
  \n因此，通过消除噪声，我们通过确保不拟合噪声来防止过拟合。\n\n为了更清楚起见，这里有一个想象的数据流水线：\n\n输入：`X`（数据），`Y`（目标）\n\
  \n1) 将 `X` 转换为 `Z` -> `Z = XQ`\n2) 取 `Z` 的前 `K` 列，称为 `Z[K]`\n3) 在 `(Z[K], Y)` 上训练你的模型，即\
  \ `model.fit(Z[K], Y)`\n4) 任何进一步预测可以使用相同的模型和流水线：\n\n1) `z[K] = Qx`\n2) `prediction\
  \ = model.predict(z[K])`\n\n你会发现，这种无监督预训练的思想在我们学习 `autoencoders` 和 `RBMs` 时会再次发挥作用。\n\
  \n### 隐变量\n\n`PCA` 的另一个视角是，变换后的变量 `Z` 是“隐变量”，即它们是数据 `X` 的某种底层原因。\n\n那么，它们应该是互不相关的就很合理了，因为它们只是独立的隐藏原因。\n\
  \n`X` 中的某些数据具有相关性也是合理的，因为它们只是你对某些数据所进行的测量，而这些数据是由这些隐藏原因组合产生的。\n\n当我们进行 `PCA` 时，我们假设数据是这些隐藏原因的线性组合。\n\
  \n事实上，在 `PCA` 中，线性关系是双向的——隐变量 `Z` 是观测变量 `X` 的线性组合，但如果你进行反向变换，观测数据 `X` 也是隐变量 `Z`\
  \ 的线性组合。\n\n`Z = XQ`\n\n`X = ZQ^(\\1)`\n\n你会记得，我们在我的第一门关于聚类和高斯混合模型的无监督学习课程中首次遇到隐变量的概念——因为那些模型假设簇的身份就是隐变量。\n\
  \n### PCA 背后的数学原理\n\n现在让我们转向 `PCA` 描述的第二部分——如何实际找到变换矩阵 `Q`。\n\n回顾一下，我刚刚告诉了你这个 `Q`\
  \ 矩阵可以做的所有神奇事情：\n\n1) 即使 `X` 是相关的，也能使 `Z` 不相关\n2) 按其信息内容（方差）对 `Z` 的每一列进行排序\n\n这里的许多步骤初看起来可能是随意的，但你将看到它们最终如何紧密结合，并产生我之前提到过的所有属性。\n\
  \n第一步是计算 `X` 的协方差。\n\n`C(x(i), x(j)) = E\\[ (x(i) - m(i))(x(j) - m(j)) ] = sum(n=1..N){\
  \ (xn - m(i))(xn - m(j)) } / N`\n\n其中 `m(i)` 是所有 `x(i)` 的平均值。\n\n如果 `i = j`，它就是普通的方差。换句话说，`C`\
  \ 矩阵的对角线是 `X` 每个维度的方差。这以后将很重要。\n\n矩阵形式为：\n\n`C = (X - m)^T(X - m) / N`\n\n这给了我们一个\
  \ `DxD` 矩阵。记住，`D` 是维度，`N` 是数量。\n\n### 特征值与特征向量\n\n（注：提供的文本在后半部分包含大量的重复/乱码字符串。我根据前面部分提供的核心数学背景清理了逻辑流。）\n\
  \n### PCA 目标\n\n`PCA` 推导中一个并不显而易见的一点是，它实际上在最小化一个目标函数。\n\n目标函数就是你自然预期的——它是数据的平方重构误差。\n\
  \n`J = || X - XQQ(\\-1) ||²`\n\n\n\n\n`Q[k]` 只是 `X` 的协方差的前 `k` 个特征向量——这意味着它是一个 `Dxk`\
  \ 矩阵。\n\n通过将 `X` 乘以 `Q[k]`，我们得到 `Z[k]`，即 `Z` 的前 `k` 列。记住，这给了我们一个“没有噪声的” `Z`。\n\n\
  由于我们现在没有使用完整的 `Q`，将会存在非零的重构误差。\n\n我们可以通过乘以 `Q[k]^T` 来 get 重构。\n\n```\nX[hat] = Z[k]Q[k]^T\n\
  ```\n\n```\nJ = || X - XQ[k]Q[k]^T ||²\n```\n\n你需要将这个 PCA 目标函数的想法记在脑里，因为我们以后还会再次遇到它。\n\
  \n### 练习\n\n在 MNIST 数据集上尝试 PCA。（使用 scikit-learn 库或尝试自己编写 PCA）\n\n\n在这一节课中，我们将讨论另一种名为\
  \ t-SNE 的降维和可视化方法。`t` 意味着我们将引入 `t` 分布，而 `SNE` 代表“随机邻域嵌入”（stochastic neighbor embedding）。\n\
  \nt-SNE 的一个大优势是非是非线性方法，因此它比 PCA 更具表达力。\n\n### 为什么要学习 t-SNE？\n\n两个原因：\n\n1) t-SNE\
  \ 由 Geoffrey Hinton 共同开发，如你所知，他是深度学习的主要人物之一。\n2) 通过使用 t-SNE，我们看到了如何通过更复杂的数学模型来克服\
  \ PCA 的局限性。\n\n除了 t-SNE 是非线性之外，PCA 和 t-SNE 之间的一个关键区别是它没有变换模型。\n\n相反，t-SNE 只是直接修改输出以最小化代价函数。\n\
  \n这意味着你将没有任何任何训练集和测试集，而且在对某些其他数据拟合后，无法转换数据。t-SNE 的工作方式本质上是尝试保持每个输入向量之间的距离。\n\n我们将从对称\
  \ SNE 开始，因为它在直觉上更合逻辑。\n\n在原始数据 `X` 上，我们定义了一个联合概率分布 `p(i,j)`，它等于：\n\n```\np(i,j)\
  \ = exp(-||xi - xj||² /(2s²)) / sum[k!=m]{ exp(-||xm - xk||² /(2s²)) }\n```\n\n\
  注意，这里的 `i` 和 `j` 不是像我们在做 PCA 时那样的维度索引，而是数据集中的第 `i` 个和第 `j` 个数据点，即 `i` 和 `j` 是第 `i`\
  \ 和第 `j` 个样本。\n\n注意它看起来有点像高斯分布。你可以把“`s`”看作超参数。它控制着分布的“扩散”。接下来是我们的低维映射 `Y`，我们以相同的方式定义它，但没有\
  \ `s` 项。\n\n```\nq(i,j) = exp(-||yi - yj||²) / sum[k!=m]{ exp(-||ym - yk||²) }\n\
  ```\n\n注意我们只是设置了 `p(i,i) = q(i,i) = 0`。\n\n所以我们了两个概率分布，一个在 `X` 中每对点之间，另一个在 `Y` 中每对点之间。我们通常只是随机初始化\
  \ `Y` 中的每个数据点。即：如果我们在寻找 2 维表示，我们将这样创建 `Y`：\n\n```\nY = np.randn(N, 2)\n```\n\n一旦完成这些，我们就可以尝试通过优化一个联系\
  \ `p(i,j)` 和 `q(i,j)` 的目标函数来寻找更好的 `Y`。如果你不熟悉如何比较两个概率分布，通常使用 Kullback-Leibler 散度或简称\
  \ `KL` 散度。\n\n```\nC = DKL = sum[i,j]{ p(i,j)log(p(i,j) / q(i,j)) }\n```\n\n如果 `P`\
  \ 和 `Q` 完全相同，结果将是 `0`。我们解决这个问题的方法与解决其他问题的方法相同——对目标求导并进行梯度下降。注意在这种类型的模型中我们没有权重——我们只有\
  \ `Y`。所以是关于 `Y` 取梯度，即输出本身。即：\n\n```\nY <- Y - learning_rate*dC/dY\n```\n\n对称 SNE\
  \ 和之前的 SNE 有一个已知问题，被称为“拥挤问题”（crowding problem），它阻止了自然簇周围形成间隙。t-SNE 的做法是对 `Q` 和 `P`\
  \ 使用不同的分布，这有助于拉开聚类。新的 `P` 和 `Q` 定义如下：\n\n```\np(i,j) = [p(i | j) + p(j | i)] / 2N\n\
  ```\n\n其中：\n\n```\np(j | i) = exp(-||xi - xj||² /(2s²)) / sum[k!=i]{ exp(-||xi -\
  \ xk||² /(2s²)) }\n```\n\n注意这里每个样本都有自己的“`s`”。\n\n```\nq(i,j) = (1 + ||yi - yj||²)^(-1)\
  \ / sum[k!=m]{ (1 + ||ym - yk||²)^(-1) }\n```\n\n注意我们只是设置了 `p(i,i) = q(i,i) = 0`。\n\
  \n`Q` 使用 `t` 分布，因此如此。为了让输出在 0 和 1 之间，我们将使用 `sigmoid` 函数。实际上是新的新的，由于我们使用 `sigmoid`\
  \ 函数在隐藏层和输出层。我们`\n\n```\nX[hat] = Z[k]Q[k]^T\n```\n\n```\nJ = || X - XQ[k]Q[k]^T\
  \ ||²\n```\n\n你需要将这个 PCA 目标函数的想法记在脑里，因为我们以后还会再次遇到它。\n\n### 练习\n\n在 MNIST 数据集上尝试\
  \ PCA。（使用 scikit-learn 库或尝试自己编写 PCA）\n\n在这一节课中，我们将讨论另一种名为 t-SNE 的降维和可视化方法。`t` 意味着我们将引入\
  \ `t` 分布，而 `SNE` 代表“随机邻域嵌入”（stochastic neighbor embedding）。\n\nt-SNE 的一个大优势是非线性方法，因此它比\
  \ PCA 更具表达力。\n\n### 为什么要学习 t-SNE？\n\n两个原因：\n\n1) t-SNE 由 Geoffrey Hinton 共同开发，如你所知，他是深度学习的主要人物之一。\n\
  2) 通过使用 t-SNE，我们看到了如何通过更复杂的数学模型来克服 PCA 的局限性。\n\n除了 t-SNE 是非线性之外，PCA 和 t-SNE 之间的一个关键区别是它没有变换模型。\n\
  \n相反，t-SNE 只是直接修改输出以最小化代价函数。\n\n这意味着你将没有任何任何训练集和测试集，而且在对某些其他数据拟合后，无法转换数据。t-SNE 的工作方式本质上是尝试保持每个输入向量之间的距离。\n\
  \n我们将从对称 SNE 开始，因为它在直觉上更合逻辑。\n\n在原始数据 `X` 上，我们定义了一个联合概率分布 `p(i,j)`，它等于：\n\n```\n\
  p(i,j) = exp(-||xi - xj||² /(2s²)) / sum[k!=m]{ exp(-||xm - xk||² /(2s²)) }\n```\n\
  \n注意，这里的 `i` 和 `j` 不是像我们在做 PCA 时那样的维度索引，而是数据集中的第 `i` 个和第 `j` 个数据点，即 `i` 和 `j` 是第\
  \ `i` 和第 `j` 个样本。\n\n注意它看起来有点像高斯分布。你可以把“`s`”看作超参数。它控制着分布的“扩散”。接下来是我们的低维映射 `Y`，我们以相同的方式定义它，但没有\
  \ `s` 项。\n\n```\nq(i,j) = exp(-||yi - yj||²) / sum[k!=m]{ exp(-||ym - yk||²) }\n\
  ```\n\n注意我们只是设置了 `p(i,i) = q(i,i) = 0`。\n\n所以我们了两个概率分布，一个在 `X` 中每对点之间，另一个在 `Y` 中每对点之间。我们通常只是随机初始化\
  \ `Y` 中的每个数据点。即：如果我们在寻找 2 维表示，我们将这样创建 `Y`：\n\n```\nY = np.randn(N, 2)\n```\n\n一旦完成这些，我们就可以尝试通过优化一个联系\
  \ `p(i,j)` 和 `q(i,j)` 的目标函数来寻找更好的 `Y`。如果你不熟悉如何比较两个概率分布，通常使用 Kullback-Leibler 散度或简称\
  \ `KL` 散度。\n\n```\nC = DKL = sum[i,j]{ p(i,j)log(p(i,j) / q(i,j)) }\n```\n\n如果 `P`\
  \ 和 `Q` 完全相同，结果将是 `0`。我们解决这个问题的方法与解决其他问题的方法相同——对目标求导并进行梯度下降。注意在这种类型的模型中我们没有权重——我们只有\
  \ `Y`。所以是关于 `Y` 取梯度，即输出本身。即：\n\n```\nY <- Y - learning_rate*dC/dY\n```\n\n对称 SNE\
  \ 和之前的 SNE 有一个已知问题，被称为“拥挤问题”（crowding problem），它阻止了自然簇周围形成间隙。t-SNE 的做法是对 `Q` 和 `P`\
  \ 使用不同的分布，这有助于拉开聚类。新的 `P` 和 `Q` 定义如下：\n\n```\np(i,j) = [p(i | j) + p(j | i)] / 2N\n\
  ```\n\n其中：\n\n```\np(j | i) = exp(-||xi - xj||² /(2s²)) / sum[k!=i]{ exp(-||xi -\
  \ xk||² /(2s²)) }\n```\n\n注意这里每个样本都有自己的“`s`”。\n\n```\nq(i,j) = (1 + ||yi - yj||²)^(-1)\
  \ / sum[k!=m]{ (1 + ||ym - yk||²)^(-1) }\n```\n\n`Q` 使用 `t` 分布，因此如此。为了让输出在 0 和 1\
  \ 之间，我们将使用 `sigmoid` 函数在隐藏层和输出层。实际上是新的新的，由于我们使用 `sigmoid` 函数在隐藏层和输出层。我们\n\n```\n\
  X[hat] = Z[k]Q[k]^T\n```\n\n```\nJ = || X - XQ[k]Q[k]^T ||²\n```\n\n你需要将这个 PCA 目标函数的想法记在脑里，因为我们以后还会再次遇到它。\n\
  \n### 练习\n\n在 MNIST 数据集上尝试 PCA。（使用 scikit-learn 库或尝试自己编写 PCA）\n\n\n在这一节课中，我们将讨论另一种名为\
  \ t-SNE 的降维和可视化方法。`t` 意味着我们将引入 `t` 分布，而 `SNE` 代表“随机邻域嵌入”（stochastic neighbor embedding）。\n\
  \nt-SNE 的一个大优势是非线性方法，因此它比 PCA 更具表达力。\n\n### 为什么要学习 t-SNE？\n\n两个原因：\n\n1) t-SNE 由\
  \ Geoffrey Hinton 共同开发，如你所知，他是深度学习的主要人物之一。\n2) 通过使用 t-SNE，我们看到了如何通过更复杂的数学模型来克服 PCA\
  \ 的局限性。\n\n除了 t-SNE 是非线性之外，PCA 和 t-SNE 之间的一个关键区别是它没有变换模型。\n\n相反，t-SNE 只是直接修改输出以最小化代价函数。\n\
  \n这意味着你将没有任何任何训练集和测试集，而且在对某些其他数据拟合后，无法转换数据。t-SNE 的工作方式本质上是尝试保持每个输入向量之间的距离。\n\n我们将从对称\
  \ SNE 开始，因为它在直觉上更合逻辑。\n\n在原始数据 `X` 上，我们定义了一个联合概率分布 `p(i,j)`，它等于：\n\n```\np(i,j)\
  \ = exp(-||xi - xj||² /(2s²)) / sum[k!=m]{ exp(-||xm - xk||² /(2s²)) }\n```\n\n\
  注意，这里的 `i` 和 `j` 不是像我们在做 PCA 时那样的维度索引，而是数据集中的第 `i` 个和第 `j` 个数据点，即 `i` 和 `j` 是第 `i`\
  \ 和第 `j` 个样本。\n\n注意它看起来有点像高斯分布。你可以把“`s`”看作超参数。它控制着分布的“扩散”。接下来是我们的低维映射 `Y`，我们以相同的方式定义它，但没有\
  \ `s` 项。\n\n```\nq(i,j) = exp(-||yi - yj||²) / sum[k!=m]{ exp(-||ym - yk||²) }\n\
  ```\n\n注意我们只是设置了 `p(i,i) = q(i,i) = 0`。\n\n所以我们了两个概率分布，一个在 `X` 中每对点之间，另一个在 `Y` 中每对点之间。我们通常只是随机初始化\
  \ `Y` 中的每个数据点。即：如果我们在寻找 2 维表示，我们将这样创建 `Y`：\n\n```\nY = np.randn(N, 2)\n```\n\n一旦完成这些，我们就可以尝试通过优化一个联系\
  \ `p(i,j)` 和 `q(i,j)` 的目标函数来寻找更好的 `Y`。如果你不熟悉如何比较两个概率分布，通常使用 Kullback-Leibler 散度或简称\
  \ `KL` 散度。\n\n```\nC = DKL = sum[i,j]{ p(i,j)log(p(i,j) / q(i,j)) }\n```\n\n如果 `P`\
  \ 和 `Q` 完全相同，结果将是 `0`。我们解决这个问题的方法与解决其他问题的方法相同——对目标求导并进行梯度下降。注意在这种类型的模型中我们没有权重——我们只有\
  \ `Y`。所以是关于 `Y` 取梯度，即输出本身。即：\n\n```\nY <- Y - learning_rate*dC/dY\n```\n\n对称 SNE\
  \ 和之前的 SNE 有一个已知问题，被称为“拥挤问题”（crowding problem），它阻止了自然簇周围形成间隙。t-SNE 的做法是对 `Q` 和 `P`\
  \ 使用不同的分布，这有助于拉开聚类。新的 `P` 和 `Q` 定义如下：\n\n```\np(i,j) = [p(i | j) + p(j | i)] / 2N\n\
  ```\n\n其中：\n\n```\np(j | i) = exp(-||xi - xj||² /(2s²)) / sum[k!=i]{ exp(-||xi -\
  \ xk||² /(2s²)) }\n```\n\n注意这里每个样本都有自己的“`s`”。\n\n```\nq(i,j) = (1 + ||yi - yj||²)^(-1)\
  \ / sum[k!=m]{ (1 + ||ym - yk||²)^(-1) }\n```\n\n`Q` 使用 `t` 分布，因此如此。为了让输出在 0 和 1\
  \ 之间，我们将使用 `sigmoid` 函数在隐藏层和输出层。实际上是新的新的，由于我们使用 `sigmoid` 函数在隐藏层和输出层。我们\n\n```\n\
  X[hat] = Z[k]Q[k]^T\n```\n\n```\nJ = || X - XQ[k]Q[k]^T ||²\n```\n\n\n\n\n请注意，这并不是真正的全貌，因为我们没有考虑偏置，而且没有要求权重每一列的长度为\
  \ 1，也没有要求每列之间相互正交，或者要求它们以任何特定的方式排序。\n\n所以，虽然函数形式看起来“像”PCA，但它并没有完成 PCA 所执行的所有工作。\n\
  \n## 降噪自动编码器 (Denoising Autoencoders)\n\n在本节中，我们将讨论另一种正则化方法。\n\n记住，当我们获得一个数据集时，并不非只能在该数据集上进行训练。我们在讨论图像时已经见过这一点。一只倒过来的猫的还是一只猫，所以我们应该把它加入数据集中。同样，一只侧卧的猫还是一只猫。照片右上角的猫和移动到左下角的猫仍然是同一只猫。\n\
  \n因此，我们有方法可以修改数据来提高神经网络的泛化能力。\n\n除了显式移动物体外，修改数据的另一种方法是添加噪声。\n\n一种方法是对输入添加高斯噪声，另一种方法简单是将某些值置为\
  \ 0。\n\n这几乎是轻而易举的，只需对输入添加一个位掩码（bitmask），换句话说，你生成一个由 0 和 1 组成的随机向量，并对 `X` 进行逐元素相乘，得到新的\
  \ `X`。\n\n例如。\n\n```python\nfrom theano.tensor.shared_randomstreams import RandomStreams\n\
  \nrng = RandomStreams()\n\nbitmask = rng.binomial(n=1, p=p, size=X.shape)\n\nX =\
  \ bitmask * X\n```\n\n通常，我们将生成 0 的概率设置为小于 50% 的值，也许可能是 30% 左右，但研究人员发现高达 50% 仍然能产生良好的的结果。\n\
  \n## 堆叠自动编码器 (Stacked Autoencoders)\n\n在本节中，我们将探索当我们将一组自动编码器按层堆叠在一起时会发生什么。\n\n基本算法如下。\n\
  \n你训练一个自动编码器，然后固定它的权重。接着丢弃最后一层，只保留到隐藏部分的输入。\n\n接下来，取第一个自动编码器隐藏层的输出，并将其作为另一个自动编码器的输入。\n\
  \n只需对多个自动编码器重复这个过程。\n\n例：\n\n训练：\no--o--o\nx z x’\n保留：\no--o\nx z\n\n训练另一个：\no--o--o\n\
  z z2 z’\n保留另一个：\no--o\nz z2\n\n再训练另一个：\no--o--o\nz2 z3 z2’\n保留另一个：\no--o\nz2 z3\n\
  \n最后，你得到了一堆自动编码器，每个的设计都仅仅是为了学习前一层更更紧凑的版本。\n\n你最终得到的是一个深度无监督网络：\no--o--o--o\nx z\
  \ z2 z3\n\n由于我们每次使用自动编码器时都在尝试获得比前一层更紧凑的表示，因此我们希望每一层的大小都比前一层小。\n\n请注意，这并不一定如此。事实上，我们可以在中间层拥有大量的隐藏单元。理论上，如果我们有\
  \ `N` 个训练样本和 `N` 个隐藏单元，那么我们可以获得完美的重构，因为 `W` 的 `N` 列中的每一列都可以负责一个不同的样本。你可能认为这会导致严重的过拟合，但研究人员发现它不会过拟合，甚至数量大于\
  \ `N` 的隐藏单元也可以正常工作。在我们的代码中，我们将使用类和对象来表示 `ANN` 和 `Autoencoder`。鉴于我们可以有任意数量的自动编码器，这将有助于更好地模块化代码。然后我们可以简单地将每个自动编码器的隐藏输出作为下一个自动编码器的输入。\n\
  \n### 贪心逐预训练 (Greedy-wise pretraining)\n\n我们刚刚讨论的过程被称为“贪心逐预训练”。之所以被称为“贪心”，直观上意味着你做了局部最优决策，在我们的情况下仅仅是训练一层自动编码器。虽然这在理论上不是最优的，但它对监督训练非常有帮助，这就是为什么我们预预训练。最后一步是在自动编码器的最后添加一个逻辑回归层。一旦你完成了这一点，你就创建了一个深度神经网络。\n\
  \n由于带有逻辑回归的最后层具有随机权重，我们需要进行反向传播。但我们发现在这里进行反向传播并不缓慢，因为自动编码器的权重已经让我们处于正确答案的附近。所以我们只需要进行几次反向传播来微调（fine-tune）网络。在架构方面，这里没有新东西，只有旧的想法。在代码中，注意我们通常有一个函数返回一个\
  \ `xD` 矩阵作为输入和一个 `Nx1` 向量作为输出。我们将加载训练数据和测试数据，因此会有大小为 `NxD` 的 `Xtrain`、大小为 `Nx1`\
  \ 的 `Ytrain`、大小为 `NxD` 的 `Xtest` 以及大小为 `Nx1` 的 `Ytest`。注意，这里有误差目标和交叉熵目标。我们通常使用交叉熵来处理\
  \ 0/1 目标，但你会发现它比误差目标效果更好。我们稍会在书中解释。\n\n来看代码：\n\n```python\ndef relu(x):\n    return\
  \ x * (x > 0)\n\ndef error_rate(p, t):\n    return np.mean(p != t)\n\ndef init_weights(shape):\n\
  \    return np.random.randn(*shape) / np.sqrt(sum(shape))\n\nimport numpy as np\n\
  import theano\nimport theano.tensor as T\nimport matplotlib.pyplot as plt\nfrom\
  \ sklearn.utils import shuffle\n\nclass AutoEncoder(object):\n    def __init__(self,\
  \ M):\n        self.M = M\n\n    def fit(self, X, learning_rate=0.5, mu=0.99, epochs=1,\
  \ batch_sz=100, show_fig=False):\n        N, D = X.shape\n        n_batches = N\
  \ / batch_sz\n        W0 = init_weights((D, M))\n        self.W = theano.shared(W0)\n\
  \        self.bh = theano.shared(np.zeros(M))\n        self.bo = theano.shared(np.zeros(D))\n\
  \        self.params = [self.W, self.bh, self.bo]\n        self.forward_params =\
  \ [self.W, self.bh]\n        self.dW = theano.shared(np.zeros(W0.shape))\n     \
  \   self.dbh = theano.shared(np.zeros(M))\n        self.dbo = theano.shared(np.zeros(D))\n\
  \        self.dparams = [self.dW, self.dbh, self.bo]\n        self.forward_dparams\
  \ = [self.dW, self.dbh]\n        X_in = T.matrix('X_%s' % self.id)\n        X_hat\
  \ = self.forward_output(X_in)\n        # 将其附加到对象以便以便使用\n        # 必须是 sigmoid，因为输出也是\
  \ sigmoid\n        H = T.nnet.sigmoid(X_in.dot(self.W) + self.bh)\n        self.hidden_op\
  \ = theano.function(\n            inputs=[X_in],\n            outputs=H,\n     \
  \   )\n        # cost = ((X_in - X_hat) * (X_in - X_hat)).sum() / N\n        cost\
  \ = -(X_in * T.log(X_hat) + (1 - X_in) * T.log(1 - X_hat)).sum() / N\n        cost_op\
  \ = theano.function(\n            inputs=[X_in],\n            outputs=cost,\n  \
  \      )\n        updates = [\n            (p, p + mu*dp - learning_rate*T.grad(cost,\
  \ p)) for p, dp in zip(self.params, self.dparams)\n        ] + [\n            (dp,\
  \ mu*dp - learning_rate*T.grad(cost, p)) for p, dp in zip(self.params, self.dparams)\n\
  \        ]\n        train_op = theano.function(\n            inputs=[X_in],\n  \
  \          updates=updates,\n        )\n        costs = []\n        for i in xrange(epochs):\n\
  \            print \"epoch:\", i\n            X = shuffle(X)\n            for j\
  \ in xrange(n_batches):\n                batch = X[j*batch_sz:(j*batch_sz + batch_sz)]\n\
  \                train_op(batch)\n                the_cost = cost_op(X) # 技术上我们在这里也可以获取\
  \ Xtest 的 cost\n                print \"j / n_batches:\", j, \"/\", n_batches, \"\
  cost:\", the_cost\n            costs.append(the_cost)\n        if show_fig:\n  \
  \          plt.plot(costs)\n            plt.show()\n\n    def forward_hidden(self,\
  \ X):\n        Z = T.nnet.sigmoid(X.dot(self.W) + self.bh)\n        return Z\n\n\
  \    def forward_output(self, X):\n        Z = self.forward_hidden(X)\n        Y\
  \ = T.nnet.sigmoid(Z.dot(self.W.T) + self.bo)\n        return Y\n\n    @staticmethod\n\
  \    def createFromArrays(W, bh, bo):\n        ae = AutoEncoder(W.shape[1])\n  \
  \      ae.W = theano.shared(W)\n        ae.bh = theano.shared(bh)\n        ae.bo\
  \ = theano.shared(bo)\n        return ae\n```\n\n\n\n\n```python\nae.params = [ae.W,\
  \ ae.bh, ae.bo]\n\nae.forward_params = [ae.W, ae.bh]\n\nreturn ae\n\nclass DNN(object):\n\
  \    def __init__(self, hidden_layer_sizes, UnsupervisedModel=AutoEncoder):\n  \
  \      self.hidden_layers = []\n        for M in hidden_layer_sizes:\n         \
  \   ae = UnsupervisedModel(M)\n            self.hidden_layers.append(ae)\n\n   \
  \ def fit(self, X, Y, Xtest, Ytest, pretrain=True, learning_rate=0.01, mu=0.99,\
  \ reg=0.1, epochs=1, batch_sz=100):\n        # 自动编码器的逐层贪训练\n        pretrain_epochs\
  \ = 1\n        if not pretrain:\n            pretrain_epochs = 0\n        current_input\
  \ = X\n        for ae in self.hidden_layers:\n            ae.fit(current_input,\
  \ epochs=pretrain_epochs)\n            # 为下一层创建当前输入\n            current_input =\
  \ ae.hidden_op(current_input)\n        # 初始化逻辑回归层\n        N = len(Y)\n        K\
  \ = len(set(Y))\n        W0 = init_weights((self.hidden_layers[-1].M, K))\n    \
  \    self.W = theano.shared(W0)\n        self.b = theano.shared(np.zeros(K))\n \
  \       self.params = [self.W, self.b]\n        for ae in self.hidden_layers:\n\
  \            self.params += ae.forward_params\n        # 用于动量\n        self.dW =\
  \ theano.shared(np.zeros(W0.shape))\n        self.db = theano.shared(np.zeros(K))\n\
  \        self.dparams = [self.dW, self.db]\n        for ae in self.hidden_layers:\n\
  \            self.dparams += ae.forward_dparams\n        X_in = T.matrix('X_in')\n\
  \        targets = T.ivector('Targets')\n        pY = self.forward(X_in)\n     \
  \   # squared_magnitude = [(p*p).sum() for p in self.params]\n        # reg_cost\
  \ = T.sum(squared_magnitude)\n        cost = -T.mean( T.log(pY[T.arange(pY.shape[0]),\
  \ targets]) ) #+ reg*reg_cost\n        prediction = self.predict(X_in)\n       \
  \ cost_predict_op = theano.function(\n            inputs=[X_in, targets],\n    \
  \        outputs=[cost, prediction],\n        )\n        updates = [\n         \
  \   (p, p + mu*dp - learning_rate*T.grad(cost, p)) for p, dp in zip(self.params,\
  \ self.dparams)\n        ] + [\n            (dp, mu*dp - learning_rate*T.grad(cost,\
  \ p)) for p, dp in zip(self.params, self.dparams)\n        ]\n        train_op =\
  \ theano.function(\n            inputs=[X_in, targets],\n            updates=updates,\n\
  \        )\n        n_batches = N / batch_sz\n        costs = []\n        print\
  \ \"supervised training...\"\n        for i in xrange(epochs):\n            print\
  \ \"epoch:\", i\n            X, Y = shuffle(X, Y)\n            for j in xrange(n_batches):\n\
  \                Xbatch = X[j*batch_sz:(j*batch_sz + batch_sz)]\n              \
  \  Ybatch = Y[j*batch_sz:(j*batch_sz + batch_sz)]\n                train_op(Xbatch,\
  \ Ybatch)\n            the_cost, the_prediction = cost_predict_op(Xtest, Ytest)\n\
  \            error = error_rate(the_prediction, Ytest)\n            print \"j /\
  \ n_batches:\", j, \"/\", n_batches, \"cost:\", the_cost, \"error:\", error\n  \
  \          costs.append(the_cost)\n        plt.plot(costs)\n        plt.show()\n\
  \n    def predict(self, X):\n        return T.argmax(self.forward(X), axis=1)\n\n\
  \    def forward(self, X):\n        current_input = X\n        for ae in self.hidden_layers:\n\
  \            Z = ae.forward_hidden(current_input)\n            current_input = Z\n\
  \        # 逻辑层\n        Y = T.nnet.softmax(T.dot(current_input, self.W) + self.b)\n\
  \        return Y\n\ndef main():\n    Xtrain, Ytrain, Xtest, Ytest = getKaggleMNIST()\n\
  \    # 两种都尝试！\n    # dnn = DNN([1000, 750, 500])\n    # dnn.fit(Xtrain, Ytrain,\
  \ Xtest, Ytest, epochs=3)\n    # vs\n    dnn = DNN([1000, 750, 500])\n    dnn.fit(Xtrain,\
  \ Ytrain, Xtest, Ytest, pretrain=False, epochs=10)\n\nif __name__ == '__main__':\n\
  \    main()\n```\n\n### 练习\n\n-   为自动编码器添加去噪功能。\n-   交叉熵对比 KL 散度（KL Divergence）\n\
  \n你已经看到 `KL Divergence` 可以用于比较两个概率分布之间的相似性，就像我们在 `t-SNE` 中所做的那样。\n\n需要记住的一个等式是：交叉熵在差一个常数的情况下等同于\
  \ `KL divergence`。\n\n即：\n\n`H(P, Q)` = $P$ 与 $Q$ 之间的交叉熵\n\n`H(P)` = $P$ 的熵\n\n\
  `DKL` = $P$ 与 $Q$ 之间的 `KL divergence`\n\n\n\n\n目前有一些材料从高层面上介绍了如何构建一个高斯单位，但这些其他表述被报道认为存在稳定性问题，因此我们在这里不会介绍它们。\n\
  \n我们准备好讨论 `RBMs` 背后的数学原理了。\n\n请注意，这与标准的波尔兹曼机非常相似，有一个项取决于 2 个不同节点之间的交互，以及一个仅取决于一个节点的类似偏置项。\n\
  \n总能量为 `E(v,h) = -b^Tv - c^Th - v^TWh`。\n\n如果 `v` 是 `Dx1` 且 `h` 是 `Mx1`，那么 `W` 必须是\
  \ `DxM`，这正是我们在神经网络中通常拥有的。\n\n`b` 是 `Dx1`，`c` 是 `Mx1`，以便得到有效的点积。\n\n请注意，根据这些变量，我们之前讨论的条件概率是：\n\
  \n`p(h | v) = sigmoid(W^Tv + c)`（正向）\n\n`p(v | h) = sigmoid(Wh + b)`（反向）\n\n像自动编码器一样，我们再次使用了共享权重。\n\
  \n现在我们已经有了能量函数的表达式，现在可以定义 `v` 和 `h` 的联合概率了。\n\n`P(v,h) = exp(-E(v,h)) / Z`\n\n其中：\n\
  \n`Z = sum{ sum{ exp(-E(v,h)) }}`\n\n我们将 `Z` 称为配分函数，它只是确保所有概率之和为 1。\n\n请注意，这本身是不可计算的，因为求和意味着对\
  \ `v` 和 `h` 的所有可能值进行求和。由于它们都是二值变量，对于每一个来说复杂度都是 `O(2^N)`。\n\n例如，如果 `M=3`，那么 `h` 的可能值为：\n\
  \n000\n001\n010\n011\n100\n101\n110\n111\n\n我们必须对所有这些值进行求和。\n\n那么，在给定模型的情况下，我们想要的是最大化\
  \ `P(v)`，它是对 `h` 进行边缘化后的 `P(v,h)`。这是因为我们实际上并不在乎 `h` 的值，我们只是想最大化我们所看到的内容概率，即 `v`。\n\
  \n即\n\n`P(v) = sum[h]{ P(v, h) }`\n\n与一样，我们并不直接最大化 `P(v)`，而是最大化 `P(v)` 的对数。所以让我们从尝试对某个任意参数\
  \ `w` 求导开始。\n\n```\nd(-log(P(v))/dw\n= d(-log(sum[h] {P(v,h) } )/dw\n= d(-log(sum[h]\
  \ { exp(-E(v,h)) / Z })/dw\n= sum[h]{ P(h | v)E(v,h) } -sum[v,h]{ P(v,h)E(v,h) }\n\
  =E[h | v]{ E(v,h) } - E[v,h]{ E(v,h) }\n```\n\n这被读作“在条件分布 `P(h | v)` 上 `E(v,h)`\
  \ 的期望值” —— “在联合分布 `P(v, h)` 上 `E(v,h)` 的期望值”。\n\n所以我们最终得到的是两个期望值之间的差。第一个期望很容易得到，但第二个期望很难得到，因为需要无限数量的样本。我们通常将第一项称为夹紧项（clamped\
  \ term），第二项称为未夹紧项（unclamped term）。\n\n让我们取前面的表达式并进一步扩展。让我们处理输入到隐藏层的权重。\n\n`J = sum[h]{\
  \ P(h | v)E(v,h) } - sum[v,h]{ P(v,h)E(v,h) }`\n\n`dJ/dW(i, j) = - sum[h] { P(h\
  \ | v) h(j) } + sum[v]{ P(v,h)h(j) }`\n\n`dJ/dW(i, j) = - p(h=1 | v)v(i) + sum[v]{\
  \ P(v)p(h=1 | v) }`\n\n`dJ/dW(i, j) = - sigmoid(c(j) + v^TW(:,j))v(i) + sum[v]{\
  \ P(v)sigmoid(c(j) + v^TW(:,j)) }`\n\n我们可以对偏置进行类似的求导，并得到这些更新方程：\n\n`dJ/dW(i, j)\
  \ = - sigmoid(c(j) + v^TW(:,j))v(i) + sum[v]{ P(v)sigmoid(c(j) + v^TW(:,j)) }`\n\
  \n`dJ/b(i) = v(i) - sum[v]{ P(v)v(i) }`\n\n`dJ/dc(j) = sigmoid(c(j) + v^TW(:,j))\
  \ - sum[v]{ P(v)sigmoid(c(j) + v^TW(:,j)) }`\n\n现在你明白我们说的夹紧项和未夹紧项的意思了。我们将通过直接计算得到第一项，但对于第二项（这需要对所有\
  \ `v` 进行求和——这是不可行的），将通过采样来获得。\n\n请注意，如果我们使用 `numpy` 编写 `RBM`，我们将使用实际的...\n\n\n\n\
  \n```python\nfrom theano.tensor.shared_randomstreams import RandomStreams\n\nfrom\
  \ autoencoder import DNN\n\nclass RBM(object):\n    def __init__(self, M):\n   \
  \     self.M = M\n        self.rng = RandomStreams()\n\n    def fit(self, X, learning_rate=0.1,\
  \ epochs=1, batch_sz=100, show_fig=False):\n        N, D = X.shape\n        n_batches\
  \ = N / batch_sz\n        W0 = init_weights((D, self.M))\n        self.W = theano.shared(W0)\n\
  \        self.c = theano.shared(np.zeros(self.M))\n        self.b = theano.shared(np.zeros(D))\n\
  \        self.params = [self.W, self.c, self.b]\n        self.forward_params = [self.W,\
  \ self.c]\n        # we won't use this to fit the RBM but we will use these for\
  \ backpropagation later\n        self.dW = theano.shared(np.zeros(W0.shape))\n \
  \       self.dc = theano.shared(np.zeros(self.M))\n        self.db = theano.shared(np.zeros(D))\n\
  \        self.dparams = [self.dW, self.dc, self.db]\n        self.forward_dparams\
  \ = [self.dW, self.dc]\n        X_in = T.matrix('X')\n        # attach it to the\
  \ object so it can be used later\n        # must be sigmoidal because the output\
  \ is also a sigmoid\n        H = T.nnet.sigmoid(X_in.dot(self.W) + self.c)\n   \
  \     self.hidden_op = theano.function(\n            inputs=[X_in],\n          \
  \  outputs=H,\n        )\n        # we won't use this cost to do any updates\n \
  \       # but we would like to see how this cost function changes\n        # as\
  \ we do contrastive divergence\n        X_hat = self.forward_output(X_in)\n    \
  \    cost = -(X_in * T.log(X_hat) + (1 - X_in) * T.log(1 - X_hat)).sum() / N\n \
  \       cost_op = theano.function(\n            inputs=[X_in],\n            outputs=cost,\n\
  \        )\n        # do one round of Gibbs sampling to obtain X_sample\n      \
  \  H = self.sample_h_given_v(X_in)\n        X_sample = self.sample_v_given_h(H)\n\
  \        # define the objective, updates, and train function\n        objective\
  \ = T.mean(self.free_energy(X_in)) - T.mean(self.free_energy(X_sample))\n      \
  \  # need to consider X_sample constant because you can't take the gradient of random\
  \ numbers in Theano\n        updates = [(p, p - learning_rate*T.grad(objective,\
  \ p, consider_constant=[X_sample]) for p in self.params]\n        train_op = theano.function(\n\
  \            inputs=[X_in],\n            updates=updates,\n        )\n        costs\
  \ = []\n        for i in xrange(epochs):\n            print \"epoch:\", i\n    \
  \        X = shuffle(X)\n            for j in xrange(n_batches):\n             \
  \   batch = X[j*batch_sz:(j*batch_sz + batch_sz)]\n                train_op(batch)\n\
  \                the_cost = cost_op(X) # technically we could also get the cost\
  \ for Xtest here\n                print \"j / n_batches:\", j, \"/\", n_batches,\
  \ \"cost:\", the_cost\n                costs.append(the_cost)\n            if show_fig:\n\
  \                plt.plot(costs)\n                plt.show()\n\n    def free_energy(self,\
  \ V):\n        return -V.dot(self.b) - T.sum(T.log(1 + T.exp(V.dot(self.W) + self.c)),\
  \ axis=1)\n\n    def sample_h_given_v(self, V):\n        p_h_given_v = T.nnet.sigmoid(V.dot(self.W)\
  \ + self.c)\n        h_sample = self.rng.binomial(size=p_h_given_v.shape, n=1, p=p_h_given_v)\n\
  \        return h_sample\n\n    def sample_v_given_h(self, H):\n        p_v_given_h\
  \ = T.nnet.sigmoid(H.dot(self.W.T) + self.b)\n        v_sample = self.rng.binomial(size=p_v_given_h.shape,\
  \ n=1, p=p_v_given_h)\n        return v_sample\n\n    def forward_hidden(self, X):\n\
  \        return T.nnet.sigmoid(X.dot(self.W) + self.c)\n\n    def forward_output(self,\
  \ X):\n        Z = self.forward_hidden(X)\n        Y = T.nnet.sigmoid(Z.dot(self.W.T)\
  \ + self.b)\n        return Y\n\n    @staticmethod\n    def createFromArrays(W,\
  \ c, b, an_id):\n        rbm = AutoEncoder(W.shape[1], an_id)\n        rbm.W = theano.shared(W,\
  \ 'W_%s' % rbm.id)\n        rbm.c = theano.shared(c, 'c_%s' % rbm.id)\n        ...\n\
  ```\n\n排版后：\n\nfrom `theano.tensor.shared_randomstreams` import `RandomStreams`\n\
  \nfrom `autoencoder` import `DNN`\n\nclass `RBM(object)`:\n    def `__init__(self,\
  \ M)`:\n        `self.M = M`\n        `self.rng = RandomStreams()`\n\n    def `fit(self,\
  \ X, learning_rate=0.1, epochs=1, batch_sz=100, show_fig=False)`:\n        `N, D\
  \ = X.shape`\n        `n_batches = N / batch_sz`\n        `W0 = init_weights((D,\
  \ self.M))`\n        `self.W = theano.shared(W0)`\n        `self.c = theano.shared(np.zeros(self.M))`\n\
