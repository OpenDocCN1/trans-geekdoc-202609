  Hyslop` 告诉路透社，公司计划开发一个私有的数字环境，其人类、计算机和机器人员工可以在全球任何地方不受中断地进行互动和合作。

  - **Microsoft (NASDAQ: MSFT)**：`Microsoft` 正在为其元宇宙在专业领域寻找位置。根据公司的计划，`Microsoft Teams
  Mesh` 将于 2022 年可用。借助这个用于流行的视频会议平台的插件，人们将能够创建自己的 3D 全息 `avatars`，无论他们在世界的任何地方都可以一起工作。用户将通过虚拟现实头显通过
  `Microsoft Mesh` 访问上述数字世界。团队成员看到并与用户互动，就像他们真的在房间里一样。


  ## 元宇宙房地产


  `NFTs`（非同质化代币）是区块链上的数字资产，可能代表各种独特物品，已经在 `The Sandbox` 和 `Decentraland` 等平台上出售，尽管元宇宙仍处于婴儿阶段。支持元宇宙平台的区块链网络验证购买元宇宙房地产时的销售和转移。元宇宙
  `NFT` 所有者在获得财产后可以对其进行租赁、出售或建造。


  在 `Decentraland` 购买了 20 块虚拟土地后，日本游戏公司 `Atari` 开设了一个加密赌场。玩家可以使用基于 `ERC20` 标准的 `Atari`
  代币赌博并领取奖金。截至 2022 年，`Atari` 计划创建一个自己的虚拟酒店群。





  元宇宙的状态条件要求需要快速的互联网连接和零延迟。元宇宙体验可能会因为迟钝和低分辨率而遭到破坏。除了宽带和 5G 网络供应商外，内容分发网络（`CDNs`）也将成为这一方程式中的重要组成部分。如
  `Akamai Technologies` (`AKAM`) 和 `Fastly` (`FSLY`) 等公司在全球范围内运营数据中心，存储用户频繁请求的材料。如果本地消费者直接连接到
  `Netflix` (`NFLX`) 或 `Amazon` 等提供商，他们获取这些材料的速度将比地球另一端的用户快得多。在疫情期间，随着所有人上线，`CDNs`
  的收入爆发式增长，尽管与元宇宙的需求相比，这可能只是暂时的现象。


  ### 未来可能性

  随着元宇宙的发展，可能会出现更多可能性。对该领域的投资需要兼顾灵活性与谨慎。许多企业将试图通过将其品牌与这一尖端技术绑定，从“元宇宙”这一术语的突然走红中获利。其中一些想法的实现只是时间问题。


  ### 如何在元宇宙中获取土地和其他数字商品

  几个元宇宙系统已经建立了 `NFT` 市场，用户可以在其中购买和交易数字土地和其他贵物品。以下是操作方法：


  *   **选择平台**：要在元宇宙中获取数字房地产，用户必须首先选择他打算使用的平台。`Decentraland` 和 `The Sandbox` 是两个热门选择，但还有许多其他选择。在购买元宇宙中的任何领土之前，请做好研究。

  *   **设置钱包**：你必须建立一个连接到区块链网络、保存加密货币并与驱动元宇宙平台的区块链兼容的数字加密货币钱包。用户在使用元宇宙平台之前必须完成此。

  *   **绑定数字钱包**：一旦买家选定了元宇宙平台，他必须登录市场并将数字钱包绑定。元宇宙平台网站通常包含市场。

  *   **评估物业**：现实世界中的房地产购买目前与互联网房地产购买非常相似。潜在买家应该考虑他们感兴趣想要获取的数字物业的成本、位置和长期潜力。

  *   **获取代币**：买家必须先获得代币或货币并存在数字钱包中以购买土地。完成交易需要特定的代币或货币。例如，在 `Decentraland` 中，用户必须获得
  `MANA` 代币才能购买数字土地。要在 `The Sandbox` 中获取土地，他需要 `SAND` 代币。

  *   **完成交易**：只要买家之前已加入元宇宙市场并充值了他的数字钱包，只需出价或直接购买土地即可。代表土地的 `NFT`（非同质化代币）将从数字钱包中取出并转移到用户的钱包。

  *   **额外购买**：同样的方法适用于购买额外的元宇宙 `NFT` 物品，如化身服装和配件。





  # 投资策略


  什么是投资策略？长期、短期、退休年龄、感兴趣的行业、预期收益、风险水平以及其他因素，都是制定投资策略决策过程中的考虑因素。投资者可以根据自己的目标量定制投资策略。


  ## 投资策略的类型


  ![](img/image_rsrc1K0.jpg)


  ### 被动策略与主动策略

  被动策略要求长期持有股票，而不是频繁买卖，以保持低交易成本。被动策略风险较低，因为他们认为由于市场的波动性，自己无法战胜市场。另一方面，动态策略需要大量的买卖。在他们眼中，市场被高估了，他们可以获得比普通投资者更高的回报。


  ### 增长型投资（短期和长期投资）

  投资者需要决定他们想在股市中持有资金多久。只要投资者认为某公司将繁荣，且其股票的内在价值将会提高，他们就会投入资金以增加整体财富。增长型投资是这类投资的另一种说法。另一方面，如果投资者认为某公司在一两年内将物有所值，他们会倾向于短期持有。持有资金多久也取决于投资者的决定。例如，他们何时需要钱来买房、送孩子上学或为退休做准备？


  ### 价值投资

  具有高内在价值的公司是投资的理想选择，因为市场低估了它们。通过这种策略，投资者赌注当市场进行随后的调整时，被低估的公司价值将得到修正，导致股价飙升，并在他们决定出售时获得巨额利润。知名投资者沃伦·巴菲就采用了这种策略。


  ### 收益型投资

  这种方法并不是投资于增加投资组合价值的公司，而是专注于从投资中创造稳定的现金流。投资可以提供两种形式的现金收入：股息和债券的固定利。寻求资产持续收益的投资者偏于这种技术。


  ### 股息增长型投资

  采用这种方法的投资者寻找每年都有派息记录的公司。投资者会将这些股息进行再投资，从长期复利中受益。逐年增加股息派发的公司由于其派息历史，比其他公司更稳定、波动更小。


  ### 反向投资

  投资者可以在市场低迷时通过购买他们青睐公司的股票来利用这种技术。这种方法专注于寻找廉价机会然后转售获利。股市的大多数下跌发生在经济不确定的时期（如衰退、战争和自然灾害）。有时投资者可以通过购买股票来利用公司的低迷期。投资者应该寻找那些能够提供价值并拥有强大品牌的组织，这使得他们的竞争对手很难对其占据优势。


  ### 指数投资

  投资者可以使用这种方法在市场指数中投资适量的投资组合。共同基金、`ETFs` 和 `S&P 500` 都是这些例子。


  ## 投资建议

  对于刚起步的人，在进行首次投资之前需要记住的一些要点。


  ### 设定目标

  决定你在未来几个月或几年内需要多少钱。在做出任何决定之前，确保你了解哪种投资最适合你，以及你可以预期获得多少回报。


  ### 研究与趋势分析

  通过对股市及其许多工具（股票、债券、期权、衍生品、共同基金等）进行研究来做好准备。同时，密切关注你决定资金的股票的价格和收益模式。


  ### 最佳顾问/咨询公司

  确保你与信誉良好的咨询公司或经纪人合作。他们将帮助你决定在哪里以及如何投资以实现你的财务目标。


  ### 风险承受能力

  注意你实现目标所接受的危险水平。你的短期和长期目标在这里也会发挥作用。如果你想在更短的时间获得更高的回报，风险就会更大，反之亦然。


  ### 风险多元化

  通过结合债务、股权和衍生品创建一个多元化的投资组合。这两种证券不应该是完全关联的。


  ### 被动与主动投资策略概述

  被动和主动投资是让资金在市场发挥作用的两种不同方式。在基准方面，主动和被动投资都试图优于 `S&P 500`，但主动投资试图击败模型，而被动投资旨在复制模型。由于投资者和财富经理通常更倾向于其中一种，任何关于主动与被动投资的讨论都可能迅速演变成激烈的分歧。即使被动投资更受欢迎，主动投资的优势也是不容忽视的。


  *   投资组合经理或其他“主动参与者”必须在投资过程中发挥主动作用，才能被视为“主动的”。

  *   被动投资意味着购买指数基金或其他共同基金，而不是单只股票或债券。

  *   尽管两者都有优点，但被动投资吸引了比主动投资更大量的资金流。

  *   从历史来看，主动投资策略产生的收益比被动投资高。

  *   近年来，主动投资的普及程度比记忆中的任何时候都要高。






  ### 什么是主动投资？


  主动投资（Active Investing）是一种通过频繁交易以获得优于市场平均回报的投资策略。许多人在考虑在华尔街交易时，脑海中浮出的这种这种。然而，Robinhood
  以及类似的应用程序让你可以在智能手机的舒适环境中进行交易。通过共同基金和交易所交易基金（`ETFs`），你可以自己进行主动投资，也可以让专家（`ETFs`）代为完成。这些工具为你提供了一个预先组装的投资组合，其中已经为你选选了数百种潜在资产。


  俄亥州财务规划公司 `Dugan Brown` 的投资顾问兼高级合伙人凯文·杜根（Kevin Dugan）认为，这种形式的投资通常需要高度的市场知识和技能，以决定收购或出售
  `investments`的理想时机。主动基金经理会对其投资组合中的每项投资分析海量数据，从证券的定量和定性数据到更广泛的市场和经济趋势。


  ### 主动基金经理

  经理们利用这些信息来利用短期价格波动，并保持基金的资产配置处于轨道上。如果投资者精心构建的、积极管理的投资组合没有持续监控市场不稳定的迹象和短期损失，投资者的长期目标可能会受到损害。这就是为什么大多数投资者，特别是在涉及长期退休基金时，并不建议主动投资。


  ### 主动投资的优势


  ### 波动市场中的灵活性

  根据位于田纳西州诺克斯维尔的 `Stivers Financial Services` 创始人兼首席投资官布莱恩·斯蒂弗斯（Brian Stivers）的说法，“主动投资者可以转向防御性头寸或持有物，如现金或政府债券，以规避灾难性的损失。”投资者还可以通过重新分配配置，将投资组合转向增长快速的经济体中的更多股票。为了短期收益，他们可能优于
  `S&P 500` 以及其他追踪长期趋势的市场指数。


  ### 扩展的交易选择

  像使用 `options` 进行期权对冲或做空股票等交易策略可能帮助主动投资者通过产生意外之财来增加战胜市场指数的机会。使用这些策略时，与动态投资相关的费用和风险可能会大幅增加。因此，这些最好留给专家和经验丰富的投资者。


  ### 税务管理

  这被称为“税收亏损收割”（Harvesting of tax losses）。在博学的财务顾问或投资组合经理手中，主动投资可以被用于执行减少纳税利润的交易。虽然被动投资也可以进行税收亏损收割，但主动投资技术产生的交易量可能会提供更多机会，并使规避“清洗销售规则”（wash-sale
  rule）变得简单。


  ### 主动投资的劣势


  ### 较高的费用

  由于大多数股票和 `ETF` 的购买是常有的，券商不再收取交易费。在使用更复杂的基于衍生品的交易技术时可能会产生费用。投资主动管理基金还涉及额外成本。由于需要大量的研究和交易，截至
  2020 年，主动管理基金的成本率平均为 0.71%。


  ### 风险增加

  主动投资者在判断正确时有很大机会大赚。使用借钱——即 `margin`（保证金）——进行投资，如果你的某项投资表现与你的预期背道而驰，可能会造成灾难性的损失。


  ### 趋势风险敞口

  对于基于趋势的投资，判断自己是否处于趋势的顶峰可能非常困难。迷因股（Meme stocks）和与疫情相关的健身热是快速卷入主动交易的趋势跟随运动的两个例子。`Peloton`
  (`PTON`) 在 2021 年 1 月 4 日交易价格为每股 145 美元，当时投资者决定加入居家训练热并购买了该股票。


  ### 什么是被动投资？


  如名所示，被动投资完全取决于长期资产获取。不干预的投资（Hands-off investing）是指选择一种资产并持有其越起伏的过程，并以最终目标（如退休）为目的。投资指数基金或
  `ETFs`（如 `S&P 500` 或纳斯达克综合指数 `Nasdaq Composite`）通常是被动方法，而主动策略则专注于单只股票。投资这些基金可以通过传统的经纪账户或通过
  `Robo-advisor`（机器人投顾）进行。不需要每天监控被动投资，因为它们的设计是为了镜像市场表现。特别是在涉及资金时，这导致了更低的成本和更少的交易。因此，它是财务顾问在进行退休投资时的首选。如果你是一个长期投资者，你会坚持下去。因此，被动投资者可以通过限制交易次数来节省大量金钱。该计划需要长期视角。换句话说，避免反应或预测股市后续走动的冲动。投资追踪
  `S&P 500` 或道琼斯工业平均指数（`DJIA`）的指数基金是被动策略的极佳例子。为了跟上这些指数不断变化的组成，追踪它们的指数基金会卖出离开的股票并购买进入的股票。由于由于原因，当一家公司的规模大到被纳入主要指数时，它保证会在大量的共同基金中拥有头寸。


  ### 被动投资的优势


  ### 更低的成本

  个人投资者可能会从与被动投资相关的交易量减少中获益。如果这还不足以说服你，被动管理基金的成本率也低于大多数主动基金。2020 年，被动共同基金的平均费率率为 0.06%；被动
  `ETFs` 的费用比为 0.18%。


  ### 降低风险

  被动技术通常投资于数百甚至数千家公司和债券。这使得你的投资组合的多样化变得简单，并降低了某项糟糕投资就会清空你全部持仓的风险。如果你对主动投资没有足够的领域性，一只糟糕的股票可能会抹掉大量的利润。


  ### 增加透明度

  通过被动投资，所见即所得。投资基金的名称通常包含它寻求监测的指数，它永远不会拥有该指数之外的资产。与大众认知相反，主动管理基金并不总是像它们声称的那样对策略透明。经理甚至可能选择隐藏某些细节以保持竞争优势。


  ### 更高的平均回报

  所有类型的被动基金在长期表现上几乎优于主动基金。追踪各种规模的指数基金在多年里击败了功能等效物。此外，根据 2011 年以来的数据，`S&P Indices`
  的一半的表现如此。


  ### 被动投资的劣势






  -   可变证券和过渡性投资是短期金融资产的其他术语，这些资产通常可以在五年内转换为现金。

  -   如果一家公司预计在一年内售出其短期资产，那么这些资产也被视为短期投资。

  -   国库券和存单（`CDs`）等短期资产是短期投资的典型例子。

  -   短期投资的预期收益率较低，因为它们具有很高的流动性，这使得在紧急情况下可以快速提现。

  -   季度损益表反映了公司短期资产价值的所有变化。


  ### 短期投资如何运作


  对于企业、个人或机构投资者而言，短期投资的主要目的是资本保值，同时产生与国库短期债券指数基金或其他比较基准相当的收益。短期投资账户将列在公司的资产负债表上。因此，公司可以负担得起将盈余资金投资于股票、债券和类似工具中，以获得比标准储蓄账户更多的收入。


  公司要将某项投资归类为短期投资有两个基本前提条件。首先，它应该易于交易，例如知名市场上的股票或国债。其次，公司管理层必须打算在短期内（例如一年内）出售该证券。期限一年或更短的投资（如国库券和商业票据）也被视为“短期票据”或可变债权工具。可以在公开市场上出售的权益证券包括普通股和优先股。要被视为流动性，可变债权资产（如公司债券）必须具有较短的期限期并定期交易。


  ### 短期投资示例


  -   [货币市场账户](https://www.investopedia.com/terms/m/moneymarket.asp)：这些受 FDIC 保险的账户提供了储蓄账户更高的收益，但前提是你向其中存入一定金额的资金。确保你理解
  FDIC 保险货币市场账户与共同基金之间的区别。

  -   **国债**：票据、债券和通胀保护债券证券是政府发行债券（`TIPS`）的例子。

  -   **债券基金**：这些基金由专业资产经理或投资公司提供，在较短时期更为优，因为它们提供的风险回报率高于平均水平。请为它们留出预算。

  -   [市政债券](https://www.investopedia.com/terms/m/municipalbond.asp)：发行此类债券的非联邦政府实体可能提供更高的收益率和税收优惠，因为它们经常被免征所得税。


  ### 长期投资


  公司的资产，如股票、债券、房地产和现金，作为长期投资列在资产负债表的资产一侧。区分短期投资和长期投资至关重要。短期投资通常会被出售。然而，长期投资可能永远不会出售。要成为一名长期投资者，你必须准备好承担某些风险，以换取重大收益的可能性，并具备长时间保持耐心的能力。这也意味着你有财务资源将一笔固定资金保留长时间。


  -   如果一家公司打算持有股票、债券或房地产等长期投资一年或更久，那么它就是长期投资。

  -   该账户作为资产包含在公司的资产负债表上。

  -   通常来说，长期投资者更愿意承担更多风险以换取更丰收益。

  -   另一方面，短期投资应该在一年内出售。


  ### 长期投资如何运作


  这是一种系统性的长期投资策略，一家公司向另一家公司投入大量资金，但不持有其多数股权。从长远来看，收购成本被视为一种投资。由控股公司或其他企业进行的投资被归类为短期或长期投资。这种分类对资产负债表上的价值有重大影响。如果短期投资的价值下降，则记录亏损。只有在标的出售后，价值的上升才会变得明显。因此，损益表上记录的净收入直接受负债表上投资分类（无论是长期还是短期）的影响。


  ### 长期投资示例


  ### 股票

  -   股票期权是公司价值部分的实体体现。投资者受邀请参加公司的首次公募（`IPO`）。在首次公募（`IPO`）之后，公司股票将在股市交易。

  -   这是从股市获得最多资金的最精炼的技术。在长期回报方面，股票投资是所有投资选择中最好的。在数字时代，股票交易已变得简单。

  -   投资股票需要广泛的市场知识。如果你想在股市中获得成功，你需要密切关注最新趋势。

  -   如果你想投资股票和证券，请选择信誉良好的财务伙伴，并在线创建 `Demat Account` 和交易账户。如果你能找到他们，请搜索无与伦比的优势，例如佣金返现、`Demat
  Account` 的免费 `AMC` 期以及零成本创建 `Demat Account`。除了为所有投资维护单一 `Demat account` 外，你还需要确保收收到最关键的市场信息，以最大化你的利润潜力。


  ### 股票共同基金

  长期投资是产生更多钱的极佳方式。投资中小型股票共同基金可能帮助你从长期来看实现财务目标。


  ### 短期投资还是长期投资？


  -   没有明确的获胜者。两种投资都有优缺点。为了在短期内实现财务目标，短期投资是理想的。另一方面，长期投资是愿意承担更多风险以换取更好回报的投资者的选择。

  -   如果你寻求保护你的资金并可以接受最低的收益，那么短期投资是一个不错的选择。然而，如果你想看到金钱增长，你应该考虑长期投资方案。






  # 元宇宙投资中的风险承受能力


  在元宇宙中开展业务无疑会面临挑战。在元宇宙的早期（截至 2035 年），这对于进军新业务领域或投资新渠道来说将尤为如此。


  ## 不可预测的用户参与度

  虽然元宇宙中可能存在 2D 应用和桌面端参与，但虚拟现实（VR）将是主要的交互模式。尽管如此，与全球人口和社交媒体用户相比，VR 头显设备的出货量仍然很有限。个人的品味和健康状况可能会影响对虚拟现实（VR）的反应。企业可能会发现吸引全球观众是一项挑战。


  ## 加密货币价值的波动

  区块链将用于许多元宇宙商业交易，无论是加密货币还是非同质化代币（NFTs）。尽管已知加密货币价值每天波动很大，但整个元宇宙可能会受到此影响。在进行大规模投资时，NFT
  可能不像现实世界中的交易那样可靠。例如，如果客户购买了一个 `NFT`，他们可能无法合法地更改作品。这可能会让客户望而却步。


  ## 向物理世界的迁移性

  在元宇宙运营的企业面临着这种风险。因此，他们可能会发现自己处于一个只有极小比例人口可以访问的领域。如果元宇宙原生企业在长期内无法实现可持续性，我们可能会面临类似于
  20 世纪 90 年互联网泡沫的情况。


  ## 去中心化因此意味着缺乏监管

  大多数观察者、分析师和开发者都认为，真正的去中心化元宇宙是不可能的。没有人会控制它，它将是完全开放和民主的。然而，这也意味着管理元宇宙将面临挑战。即使监管机构拥有严格的法律，由于其去中心化的设计，法律也无法执行。特别是如果没有监管，中小企业（SMEs）将处于危险之中。






  # 第 7 章：元宇宙及其对我们数字未来的影响


  21 世纪可能会因构建和发展虚拟世界或元宇宙而被记住，因为上一个世纪以大规模工业和互联网的兴起闻名。这项新技术比以往任何互联网都具有沉浸感、动态性和团队化，将彻底改变我们的工作和交流方式。尽管参与这一领域的许多公司拥有巨大的前景，但显而易见，区块链技术将成为元宇宙的底层，并为所有利益利益者构建一个可持续的环境。传统职业和爱好不会不受元宇宙的影响，但社会以及人与互动的方式将发生深刻变化。


  互联网和远程办公（WFH）技术支持在 COVID-19 全球疫情期间维持企业生存并允许其快速增长至关重要。疫情之后，教育等多个行业发生了重大转型，变得更加依赖新技术。元宇宙引入的可穿戴虚拟现实技术可以显著重塑这些行业。个人可以在家里通过使用这些可穿戴设备进入一个新的虚拟世界。在未来的日子里，人们将不必忍受长途通勤和呼吸污染。这意味着孩子们可以按照自己的节奏掌握知识，并拓宽超出现有学校课程范围的视野。在虚拟世界中，像下班后看电影或与朋友社交这样的习惯将成为可能，而没有现实世界的不便。换句话之，元宇宙开启了无限的选择。


  作为科技初创公司 Together Labs 最近公告的一部分，`VCORE` 代币（一种奖励游戏玩家、生产者和收益者的 `ERC-20` 代币）将向美国和加拿大以外的任何人开放。从
  2022 年开始，`VCORE` 用户将接入一种新的经济模式，允许每个人参与元宇宙的发展。然而，像任何生态系统一样，元宇宙的运行能力取决于个人在环境中进行交易的简单程度。在这里，加密货币介入了，并通过许多倡议促进现实和数字交易，已经拉开了序幕。轻松将法币转换为加密货币将使用户在现实世界和元宇宙之间移动变得容易得多。客户将使用支持这些虚拟连接的组织发布的加密代币来购买数字形象和虚拟土地，并为爱的人安排活动。艺术家将在元宇宙中表演，获得加密货币报酬，并使用这些资金在现实世界购买物品。


  随着更多价值被发现，元宇宙的出现可能会导致全球经济快速增长。根据 CEO `Dominic Ryder` 的说法，元宇宙是人类与技术互动演变的下一个逻辑步骤。沙盒和其他选项是可用的（对于有创意的人和想要构建体验的玩家）。还有
  `Decentraland`，它正在成为许多类活动的中心。在数字领域同样成功的其他模型和平台包括 `Axie Infinity` 和 `Starl`。由于疫情导致许多人被迫迫进行远程和数字化工作，我觉得这种趋势现在正处于过载状态。根据
  `Ryder` 的预测，人们将开始在工作之外的元宇宙中花费更多时间。随着像非同质化代币（`NFTs`）等类似于流行艺术品和数字文物的数字商品已经存在，元宇宙已经开始成形。像
  `Meta Platforms Inc.` 等其他主要企业加入这一领域并坚定地宣布这可能是一个新现实，只是时间问题。元宇宙边界的指数级扩张可能会为消费者和投资者开辟巨大的新市场。为了更好地代表
  `Meta` “将元宇宙带入生活并帮助个人连接、建立社区和发展企业”的目标，该公司在 10 月宣布将更名为 `Meta`。对于这一全球范围内最有价值的公司做出如此重大转型的事件，推测和讨论并不缺少。


  ## 迈向更广泛的采用


  虚拟现实已经开发了长期，就像人工智能发展了长期一样。1800 年代中期，立体镜镜实现了带有图画和图像的 3D 体验。1960 年代，好莱坞尝试了沉浸式电影体验，如
  `Sensorama`。空军预算支持了 3D 飞行模拟器的开发。1970 年代，1980 年代后期生产并营销的早期 VR 眼镜被称为“Eyephone”，在命名上可能很幽默。最近的研究表明，自
  2000 年以来，对这些沉浸式体验的兴趣和能力有所增加。我相信事实正是如此。


  一年内，`Fortnite` 获得了 1 亿新玩家，将注册总人数推向 3.5 亿。成立于 2002 年的虚拟环境 `Second Life` 在四年后仅有 100
  万注册用户。当 `Second Life` 在 2006 年推出时，其用户量仅占互联网总人口的 8%。到 2020 年，`Fortnite` 的用户预计至少占全球访问人数的
  8%。作为一个景点，`Fortnite` 将是地球上访问次数最多的地方。为了对比，2019 年有 1.45 亿人访问中国，而 8000 万人访问美国。尽管如此，`Fortnite`
  的玩家不必离开家即可旅行。


  ## 人们适应这种技术吗？


  听起来像是一个愿景家，我认为疫情加速了可能已经在进行的趋势：从单地点园区向更区域分布的团队和组织转变，每个人都将远程工作。然而，随着技术在分散工作和社交体验方面变得更加容易，大量个人可能会在元宇宙中实现他们的理想环境。利用元宇宙技术，个人将以新的方式在线交流和工作。


  ## 更好地理解


  对于领导者来说，理解元宇宙将如何影响工作的未来至关重要。“围墙花园”意味着 Facebook 意图拥有并从其用户数据中盈利。开放、去中心化且尊重使用者的自由的元宇宙正在建立。“开放”与“封闭”之间的对比对于理解互联网的增长至关重要。由于元宇宙、数字平台、数据分析和去中心化开放应用的出现，工作将经历变革。许多元宇宙将开放且去中心化，这意味着每家公司的现有业务模式将面临挑战。现实世界的商品如音乐、艺术和服装可能在元宇宙中代币化。


  在此之前，执行官必须与其团队合作，为未来创造共同愿景。新的工作架构需要区块链、人工智能、计算机视觉、量子计算和高速网络方面拥有丰富知识的专家。为了支持战略级决策，组织需要应用人工智能和深度分析工具的元宇宙分析师。元宇宙营销、品牌建设和业务发展需要与这些专家合作，以改进公司的产品和服务供应并寻找新市场。结果，组织将必须证明他们的数据免受下一代量子计算机的威胁。他们还需要将元宇宙专业知识纳入治理结构，以防止员工遭受过度监控和非人性控制等压迫管理方法。如果领导者不采取措施防止这种工作前景变成现实，在虚拟世界中花费过多的员工将经历职业倦怠。与其关注家与工作场所的界限，混合办公将专注于在虚拟和现实世界之间建立平衡。健康的元宇宙实践需要资源部门的新政策。客户员工员工从元宇宙的潜力中受益，元宇宙可以被用作巨大的画布。通过关注人类因素来吸引新一代才华横溢的跨学科元宇宙专家，并开发基于更加人性化和有意识的工作文化，将在未来蓬勃发展。


  ## 反暴力努力


  暴力会对个人的情感和身体健康产生不利影响，并可能将人们推离在线平台。由于元宇宙的沉浸性和持久性，可以假设这些地方在线暴力将成为更关注的问题。由于虚拟现实可以模糊真实与虚假的界限，研究显示虚拟现实暴力“比其他数字环境更具破坏性”。研究人员的形象头部遭受了三拳后，她在办公室里退缩成跪姿，她的大脑和身体将这些击打识别为真实的。随后的几周内，她由于创伤后应激障碍而饱受“侵入性想法”。鉴于目前表现糟糕，将仇恨和暴力排除在虚拟世界之外将是未来公司面临的主要问题之一。然而，这必须是一个关键关注点。这些虚拟世界必须建立以保持人们的安全并停止社交媒体上盛行的暴力。然而，在公司能够大规模地监管暴力之前，元宇宙将是另一个仇恨可能盛行的数字领域，除非它能为人们互动和寻找社区产生令人兴奋的新途径。为了确保兼容性，蒂姆·伯纳斯-李爵开发网站是为了一个任何人都可以来分享想法和意见的地方。“这是给每个人的，”他在
  2012 年奥运会开幕式期间在 Twitter 上说道。没有一家公司应该对元宇宙拥有专属控制权，元宇宙应该被开发为一个开放领域而非围墙花园。会有多个元宇宙，而不是一个。






