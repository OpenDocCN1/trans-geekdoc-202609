  # 了解增强现实


  虚拟和音频/视觉组件与现实环境相结合，提供一种被称为增强现实（AR）的改进体验。特别是在移动计算和企业级应用中，这种做法正变得越来越流行。使用增强现实的一个核心目的是是在数据收集和分析增长的期间，强调并理解物理环境的某些方面，以用于现实世界的应用。企业可以利用大数据来做出明智的选择，并更深入地了解客户在哪些方面花费了钱，以及其他等方面。


  增强现实在各种应用中的普及正在兴起。自诞生之初以来，增强现实一直在努力与“它仅仅是一个营销工具”的观念作斗争。然而，消费者已开始看到这一功能的价值，并期待它能成为购物过程的一部分。例如，零售业的早期采用者已经创造了改进客户购物体验的技术。使用增强现实的目录类应用程序允许客户看到各种商品在多种场景下的显示效果。以家具为例，如果消费者在正确的房间内拍照，产品就会显示在前景中。


  在医疗保健行业，增强现实的优势可能大得多。将移动设备悬停在目标图片上方可以显示各种人体系统的 3D 图像，这可以为消费者提供丰富的信息。例如，医学生和住院医生可能从使用增强现实教学工具中显著受益。根据一些人的观点，可穿戴技术可能是增强现实领域的游戏规则改变者。与智能手机和平电脑不同，如果智能眼镜被广泛使用，它可以为用户在现实与虚拟世界之间创建完全连接。


  ## 增强现实的工作原理


  加载了 `AR` 软件的带摄像设备（如手机、平板电脑或智能眼镜）是增强现实的起点。当用户引导设备指向物体时，计算机视觉技术分析视频流以检测物体。随后，云端信息以类似的方式下载到设备，就像网页浏览器加载网页一样。`AR`
  信息不是以屏幕上 2D 页的形式显示，而是作为叠加在物体上的 3D “体验”来显示。因此，用户的体验是真实与虚拟的混合。


  通过增强现实（`AR`），用户可以通过触摸屏、语音或手势实时查看并与来自设备的流数据进行交互。例如，为了向产品传递命令，用户可以在 `AR` 交互中点击数字图形叠加上的停止按钮，或者简单地说“停止”。通过
  `AR` 头机，可以查看投影在机器人本身上关于机器人状态和能力的信息。随着用户在房间内移动，`AR` 显示的大小和位置会根据不断变化的上下文动态调整。随着新视觉或文本数据的到来，其他信息会被遮挡。


  机器操作员和维护技术人员可能同时观察同一个物体，并在工业背景下根据他们的特定职责定制各种 `AR` 体验。物体的“数字孪生”（一个存在于云端的 3D 数字表示）充当亮物体与
  `AR` 之间的链接。可以使用计算机辅助设计（`CAD`）或将实体数字化的技术来生成此模型。孪生体从开发、业务系统和外部来源收集数据，以代表产品的当前现状。通过这种方式，`AR`
  软件可以精确地在物体上定位和缩放最新的数据。


