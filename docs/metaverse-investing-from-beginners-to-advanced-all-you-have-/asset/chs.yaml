  # 入门


  第一步是注册一个 `Spatial` 账户。如果你已经有了 Google、Microsoft 或 Slack 账户，可以使用它们进行注册。你也可以使用电子邮箱注册账户。


  完成注册流程后，系统会要求你选择头像。你可以使用网络摄像头或从设备拍摄的自己的快照作为头像。在创建虚拟现实头像时，拍摄一张良好的脸部照片至关重要。请保持中性表情，直视摄像头镜头。所以，拍头像照时不要露出那种尴尬的微笑。在操作此过程时，不要把即将发布的照片看作是自拍。相反，要把它看作是拍摄执照时那样的肖像照。


  我们可以在账户个人资料的下拉菜单中选择 `Edit Profile`（编辑个人资料），随时编辑我们的头像。在这里也可以对订阅信息、`Team`（团队）、提交材料以及集成功能进行更改。


  ## 光线与色彩


  另一个关键考虑因素是光线的质量。不要忘记在光线良好的环境下拍摄头像照。自然光下拍摄的头像比人工光下的照片更理想。此外，远离强光也是个好主意。


  在 `Spatial` 获取到你一张良好的正面照片后，就会创建一个看起来像你的 3D 定制 VR 头像。从那时起，还可以使用肤色滑块和衬衫颜色选择器，允许你进一步修改头像的外观。生成
  `Avatar` 后，只需点击 `Looks Good`（看起来不错）即可关闭头像创建器。如果你不喜欢当前的头像，点击 `Regenerate Avatar`（重新生成头像）就可以用新照片重新开始。制作虚拟现实头像就是如此简单。在几分钟内创建一个
  3D 模型不需要特定的技能或昂贵的设备。


  ## 定制你的头像


  创建一个与自己相似的头像是游戏玩家们喜爱的爱好之一！如果我们希望头像能反映用户的真实自我，我们需要不断增强用于创建头像的机制。


  目前，你可以在男性或女性头像身体以及各种类人脸部之间选择。如果你是一个“手势比舞者”，可以使用 VR 头显器中的手部追踪充分展现你头像的活力。


  ## 更改你的头像


  任何时候，我们都可以通过个人资料中的下拉菜单编辑我们的头像。对订阅、提交材料和集成功能的更改在这里也可以进行。


