  在 2021 年 10 月底之前，很少有人听说过 `MANA`。直到过去的几周，这种货币和项目才开始积累动力。历史证明，`FOMO`（恐恐心理）、非理性投资者以及广泛的媒体报道曾推动了此前投机性加密货币项目的价格暴涨。另一方面，与数字商品和产品相关的加密货币近期价值有所上升。涉及到像
  `NFTs` 和加密游戏这样新颖且有趣的产品时，必须强调的是它们仅仅是：新事物。在加密货币整体被大众接受之前还有很长的路要走，但火已经点燃了。由于全球许多人已经对这一领域的未来充满信心，我们只在你也是其中一员的情况下鼓励你进行投资。


