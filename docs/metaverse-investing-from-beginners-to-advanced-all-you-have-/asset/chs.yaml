  ## AR 设备


  最广泛使用的矛盾词（oxymoron）可能是虚拟现实（`VR`）。它允许用户完全沉浸在计算机生成的 3D 表示中。头戴显示器（`HMDs`）或全沉浸式投影系统是实现虚拟现实（`VR`）的常见手段。谷歌利用纸板、塑料透镜和其他其他廉价组件创建基于智能手机的
  `VR` 体验，改变了游戏规则。专供商业和学术技术官僚使用的虚拟现实体验仅需 15 美元，任何人都可以享受。一种明智且高影响力的方法让该技术被广泛采用。然而，尽管存在动荡，但增强现实极有可能成为更受接受的技术。


  ### 主要类别


  增强现实可以追溯到 20 世纪初，尽管该术语出现的时间相对较晚。早期望远镜制造者霍华德·格鲁布（Howard Grub）发明了反射镜。它的首要目标是通过将准星聚焦在用户的预定目标上来提高射击精度。它一次只关注一个任务。存在四类主要的增强现实设备。


  ![](img/image_rsrc1JX)


  ### 平视显示器 (HUDs)


  随着技术日益复杂，飞机上的传感器、航空电子设备和飞行控制数量增加，增加了对信息处理的需求。飞行员需要将注意力集中在外部世界，而不是驾驶舱内大量的信息上。飞行员不需要低头盯着仪表盘，而是可以向窗外观察周围发生的事情。HUD
  使用类似于格鲁布反射镜的投影仪，试图解决焦点切换的问题。这意味着飞行员的眼睛不需要改变焦点即可看到驾驶舱之外，因为呈现的信息是聚焦在无限远的。平视显示器（`HUDs`）在汽车设计中变得越来越流行。一个典型的
  `HUD` 由投影仪、显示器（组合器）和计算机（发生器）组成。


  ### 头盔式显示器


  从挡风玻璃到头盔是显示器的下一个自然步骤。航空和其他行业越来越多地使用原理相同的头盔屏幕。


  ### 全息显示器


  由于《星际大战》、《少数报告》和《钢铁侠》系列电影的影响，这些显示器变得更加受欢迎。全息显示器最吸引人的方面之一是它们不需要佩戴者使用特殊设备即可观察。像 Looking
  Glass 和 Holove 等产品最近将这些显示器从科幻带入了主流。


  ### 智能眼镜


  随着技术从军事和航空的关键用途变为广泛获取的物品，智能眼镜一直是最受欢迎的增强现实设备之一。正如名称所示，这些是放大眼镜。两种智能眼镜中的一种被称为智能眼镜。


  ### 光学透视


  如果你有一对光学透视眼镜，你就可以通过全息波导和其他允许让你在现实环境之上叠加图形的设备看到真实世界。最近的光学透视智能眼镜示例包括微软的 HolLens、Magic
  Leap One 和 Google Glass。


  ### 视频透视


  HTC Vive 头机内置摄像头通常用于在设备上创建增强现实体验。得益于显示器的一个或两个摄像头，这种智能眼镜让佩戴者看到世界原本的样子。对于用户来说，这些图像与计算机生成的图形混合在一起。


  ![](img/image_rsrc1JY.jpg)


  ### 手持 AR


  手持 AR 的普及已达到拐点，为广泛采用铺平了道路。随着 `ARKit`、`ARCore` 和 `Markit` 等增强现实库的出现，任何人都可以使用先进的计算机视觉技术。你只需要智能手机就可以访问广泛的
  AR 体验，无论你是将其用于手持还是移动 AR。作为一种视频透视，便携 AR 需要特定的关注。


  ## 当前领先者


  很快，手机 AR 眼镜和头机将共处同一个环境中。虚拟现实（`VR`）可以在智能手机、平板电脑和桌面设备上使用，因为它不需要任何特殊硬件。我们将看到更多这样的 AR
  设备：


  ### 微软 HolLens 2


  微软的 HolLens 2 是最完美的增强现实设备。作为唯一的双 2K 120Hz 显示 AR 设备，它可以比任何其他可用 AR 设备更清晰地显示 3D 对象。除了跟踪眼睛和手部，HolLens
  2 让你自然地与虚拟环境交互。HolLens 2 是增强现实的领导者，具有更多校准和缩放功能。


  ### Magic Leap One


  在最著名的初创公司中，Magic Leap 在去年脱颖而出。他们发布了突破性的增强现实设备 Magic Leap One。它的价格约为 2299 美元，但它让你在现实世界中体验
  AR 图形。一个不完全隔离你与现实世界的设备似乎是一个明智的选择。


  ### 普讯 Moverio


  与 HolLens 和 Magic Leap One 相比，普讯 Moverio AR 设备允许你看到现实世界中漂浮的虚拟显示。显示是基于你的眼睛而不是面前的环境。因此，屏幕将始终面向用户的眼睛。


  ### Google Glass 企业版


  当 Google Glass 最初推出时，它是一个失败品。该设备的优势，如捕捉视频或拍摄照片而不通知他人，使得它对消费者具有吸引力。尽管如此，Google 发现了一种恢复方法。得益于其功能和其他利益，医生、机械师和任何人现在都可以使用
  Google Glass。它允许人们在双手空的同时与世界连接。


  ### Vuzix Blade


  在 Google Glass 停用后，Vuzix Blade 填补了空白。与 Google Glass 不同，Vuzix Blade 摄像头具有红色指示，让知道摄像头已激活。然而，它具有位于中心的显示，而不是角落显示。在很大程度上，它由
  Alexa 控制，但也通过蓝牙与手机兼容。


  ## AR 当前示例


  在增强现实的世界中，可能性是无限的。这种技术将在未来几年在我们的日常生活中变得普通。一些公司和企业已经在这种技术上取得了巨大进展，但目前最强大的用途：


  ### 移动应用


  IKEA 是最早使用增强现实的公司之一，以其有趣的名称闻名。2012 年，作为 Place 应用的一部分，IKEA 现在让你从商店选择任何物品，并查看它如何缩放到你的房间。无论你是否确定某件家具是否适合特定区域或主题。


  ### Nintendo Go 应用


  消费者可以使用应用查看桌和架子在不同位置显示。为了在 2016 年发布，Pokémon Go 允许玩家通过扫描虚拟环境来捕捉他们的喜好。在其巅峰时期，有 650
  万人玩了这个游戏，使其大获成功。


  ### Google Pixel 贴纸


  不提到增强现实是不可能的，Google 手机包含摄像头功能，允许用户在照片和视频中添加贴纸。可能发现大量的青少年在你的区域行走。


  ### 彩色书


  《星球大战》是一部电影；如果你在电影院看到或看电视，无疑至少见过一个随机风暴兵的图像。对于孩子们，迪士尼在几年前制作了一种增强现实体验来观看电影中他们喜欢的角色。使用增强现实（`AR`），一组研究人员使用手机或平板电脑创建了彩色图像的
  3D 重建。


  ### Loreal 化妆


  Loreal 提供类似的移动应用，允许用户尝试不同的化妆品。在某种意义上它就像 Snapchat 滤镜，软件扫描你的脸，然后向你展示特定产品的色调出现在虚拟环境中。


  ### 天气频道特效


  多年来，电视新闻一直使用特效来提高节目质量。例如，天气预报员使用了绿幕（将地图投影到屏幕上）向公众传达他们的预测。天气频道现在正在使用更先进的技术来更好地描述极端天气。最近，一辆虚拟汽车在工作室里行驶，以展示汽车在雪地或冰面上行驶时失去控制。这只是广播行业增强现实系列应用中的最新。新闻、天气和体育广播中的增强现实预计在未来几年增长。


  ## 技术


  得益于这项创新技术，手机、平板电脑、电脑、电视甚至眼镜或眼镜镜很快就可以直播画面上方显示实时信息。在电视上看足球比赛是消时间的好方法。为了方便，球场上的黄色首码线是虚假的。你只能在电视上看到它，因为它增强现实显示。例如，飞机头盔上的平视显示是另一种类型。地理定位和视觉成像是
  AR 的关键组件，可以是用户的重要工具。它是一种娱乐、商业、营销、艺术、社交网络和活动的快速发展的技术。此外，这种技术在治疗心理健康问题方面很有潜力。尽管对 AR
  的研究很少，它对用户的影响也是显而易见的：虚拟现实是迷人的、有趣的、有说服力的且全面的。尽管增强现实（AR）现在主要用于娱乐目的，但它是一项快速扩张的技术。预计
  AR 开发和编程到 2016 年投资将增加超过 6 亿美元。几家主要的科技公司正在加大创建 AR 能力产品的力度，包括苹果、HP、谷歌和高通。美国国防部对 AR
  做出了巨大的资金承诺，DARPA 正在研究支持该技术的未来。VR 和 AR 技术进步应该引起心理学兴趣，因为它们有潜在的治疗和研究用途。例如，想象一个患有蜘蛛恐惧症的患者暴露在增强现实蜘蛛下，同时可以改变生物的外观（尺寸和形状）、颜色和动作。想象让患者与这些虚拟蜘蛛交互，操纵它们的活动甚至将它们捡起来，这一切都在虚拟世界中！尽管虚拟现实（`VR`）可以在智能手机、平板电脑和桌面设备上使用，因为它不需要任何特殊硬件。我们将看到更多这样的
  AR 设备：


  ### 增强现实


  增强现实是是普及的道路。随着 `ARKit`、`ARCore` 和 `Markit` 等增强现实库的出现，任何人都可以使用先进的计算机视觉技术。你只需要智能手机就可以访问广泛的
  AR 体验，无论你是将其用于手持还是移动 AR。






  # 增强现实的历史与演变


  * “伊万·苏尔德”（Ivan Sutherland）和他的学生鲍勃·斯普罗（Bob Sprowle）于 1968 年创造了第一个头戴式显示器，即“达摩利斯之剑”，这是增强现实技术的开始。

  * 迈隆·克鲁格（Myron Krueger）在 1974 年取得了 AR 领域的重大进展。这一概念被称为“视频场所”（Video Place），将摄像机与投影技术相结合，在屏幕上创建阴影。该设置似乎处于一个用户交互空间内。

  * 波音研究员汤姆·卡德（Tom Cadell）于 1990 年提出了“增强现实”（Augmented Reality）这一术语。

  * 路易斯·罗森伯（Louis Rosenberg）于 1992 年在美国空军阿姆斯特朗研究实验室开发的“虚拟装置”（Virtual Fixtures）是第一个实用的
  AR 系统。机器人系统将数据保持在员工接触不到的地方。当前 AR 系统的早期原型可以在该系统中找到。

  * 1994 年，第一部采用 AR 技术的戏剧问世。朱莉·马丁（Julie Martin）的《网络空间中的舞蹈》（Dancing in Cyberspace）包含了杂技演员在计算机生成的场景和道具周围进行的表演。

  * 1999 年，NASA 的 X-38 太空器使用了混合合成视觉系统，这是其混合合成视觉系统的 AR 功能版本。在飞行测试期间，AR 被用于辅助导航开发。

  * 当日本国立科学技术大学（NIST）的加藤宏（Hirokazu Kato）于 2000 年成立并发布了名为“ARToolKit”的软件时，AR 领域取得了重大进展。为了捕捉现实活动并将其与虚拟对象合并，需要这个程序。

  * 2003 年，使用 Skycom 在 NFL（橄榄球）比赛中插入了虚拟距离标记，这是行业俯视视图的卓越工具。

  * 《时尚杂志》（Esquire Magazine）和罗伯特·道尼尼（Robert Downey Jr.）从 2009 年开始在印刷媒体中使用 AR。读者可以通过电脑软件扫描杂志条形码查看
  AR 材料。幸运的是，`ARToolKit`在同年让所有网络浏览器都能使用 AR。

  * 大众汽车从 2013 年开始在其汽车手册中使用 AR。通过`MARTA` iPad 应用程序，消费者可以查看车辆内部运行情况，并协助维修技术人员找出故障。

  * 全球最大的公司谷歌于 2014 年向公众发布了带有增强现实（AR）功能的 Google 眼镜。然而，它在全球市场上的表现不如预期。结果，Google 眼镜已于去年
  12 月停产。

  * 当增强现实（AR）在 2016 年首次通过视频游戏进入人们的日常生活时，它引发了全球狂热。著名的增强现实游戏《精灵宝梦 Go》（Pokemon Go）通过应用商店下载量超过了
  1 亿用户。这款移动游戏应用的主要目标是捕捉并使用怪物，在增强现实健身房中进行竞争。在游戏中，玩家可以看到他们喜欢的宝可梦在城市中跳跃。

  * 使用增强现实技术，宜家（IKEA）发布了`IKEA Place`，这是一款革命性的新软件，很快将对我们的购物方式产生深远影响。在购买之前，用户可以使用此应用来了解他们希望使用宜家家具布置家居的效果。

  * 《哈利·波特：霍格沃茨之谜》（Harry Potter: The Hogwarts Mystery）手机游戏在 2018 年再次在全球范围内流行起来。用户周围营造了类似霍格沃茨的氛围，他们可以使用此应用向霍格沃茨教授施咒并从中学习。已有超过
  1000 万从 Google Play 商店下载了该应用。

  * 为了庆祝曼城成立 125 周年，该俱乐部球场在 2019 年展示了一项增强现实装置。观众在新闻发布期间将有机会坐在曼城主帅“佩普·瓜迪奥拉”（Pep Guardiola）附近。3D
  全息屏幕和 360 度电影屏也是行程的一部分，旨在为粉丝提供沉浸式体验。






  作为一项尖端技术，增强现实（AR）目前被认为最有前景的技术之一。在当今，当提到“AR”一词时，大多数人会自动转向他们的智能手机。例如，让我们来看看一直在发生的一些。只需将你的移动设备对准你喜欢的音乐表演中的展商，你就能获得有关公告、未来演唱以及门票折扣和优惠的实时信息。阅读处方药容器标签上的微小字体可能让你们中的大多数人在某些时候感到有些不适。别担心！这种转变的实现得益于增强现实。患者现在可以使用利用
  AR 构建的 3D 眼镜快速获取剂量、有效期、副作用、药物成分等信息，以快速获取信息。和朋友一起看比赛你感兴趣吗？只需将智能手机对准教练或球员，你就能获得像浏览互联网一样得到的所有体育统计数据和信息。这一切都是
  AR 的结果。使用增强现实（AR），你现在可以数字试穿服装，并检查颜色和尺寸是否适合你。有了 AR，在舒适的家中购物物品的同时保持时尚潮流变得比以往任何时候都更容易了。假设一切正常，你就可以继续下单了。增强现实技术的社会益处有很多，但我在这里不会详细介绍所有的。一个例子就是《宝可梦
  Go Mania》。成千上万的人因此能够下床跑步。此外，AR 帮助执法部门抓捕罪犯，并帮助个人应对绝望和疾病等问题。未来用于品牌意识和消费者交互的 AR 和 VR
  被广泛认为是一种新颖、独特且具有创新的方法。科技客的生活是非常美好的。毫无疑问，增强现实的力量和可能性是无尽的。根据专家的说法，平板电脑和智能手机将不再是增强现实的主要平台。具有增强现实（AR）功能的接触镜和其他可戴设备的开发正在快速进行。人们普遍认为智能手机将被支持
  AR 的设备取代，尽管目前还不清楚这种替换具体是什么样子。随着为盲人“智能眼镜”的创造，甚至眼镜也在获得新的设计。


  ## AR 在各个领域


  ### 电子商务中的 AR

  几乎所有的电子商务公司很快都会将增强现实整合到它们的移动应用程序和网站中。使用智能手机摄像头，用户可以快速在应用上“穿”衣服（如外套、太阳镜、珠宝和鞋子）


  ### 数字营销中的 AR

  消费者与企业品牌互动的方式通过增强现实得到了进一步增强。营销 AR 可能出现在很多地方，包括视频游戏、公共标志、应用程序，甚至是某些其他商品和服务的包装中。


  ### 教育资源

  教育工作者正在寻找将增强现实整合到训练场景中的方法，帮助学生保留信息。医疗和军事领域都在开发 AR 训练模拟器。


  ### 地理定位中的 AR

  随着时间的推移，告诉我们周围环境的手机/平板电脑变得更加高效。从餐厅推荐到即时旅行建议，一切都通过 AR 变得更容易获取。


  ## 扩展现实世界中的 AR

  增强现实的科幻起源可以追溯到 1901 年。然而，1990 年，托马斯·考德尔尔（Thomas Caudell）首次使用“技术”一词来描述它，当时他正在创建一个工具帮助波音人员更好地感知复杂的航空系统。1992
  年，路易斯·罗森堡（Louis Rosenberg）在美国空军的虚拟固装置 AR 系统取得了重大进展。随后，几个面向消费者的 AR 产品相继而出，包括 `ARQuake`
  (2000) 和设计工具 `ARToolkit` (2001-2009)。2010 年出现了技术浪潮，包括 2015 年微软的 `HoloLens`，它超越了我们传统认为的增强现实
  (AR)。混合现实 (MR) 是 XR 的子集，包含了 VR 和 AR (MR)。AR 和 MR 之间的差异导致了一些误解。每个术语的定义都存在争议，特别是在
  2020 年代的技术热潮中。


  为用户体验 (UX) 设计涉及以下考虑因素：

  - 在 AR 中，你为数字部分进行设计，使其显示在真实世界的视图之上，有时它们之间的互动有限，且大多数情况下通过智能手机进行。Apple 的 `ARKit` 和
  Android 的 `ARCore` 开发套件，以及游戏 `Pokémon Go` 只是几个例子。

  - 设计将人们与现实世界隔离开沉浸式体验，通常通过虚拟现实头设备。游戏示例包括 `PlayStation VR` (PSVR)、`Oculus Rift` (Oculus
  Rift) 和 `Google Cardboard` (Google Cardboard)。

  - MR 必须设计与真实环境相关的的功能，因为数字物品可以通过 AR 和 VR 元素与真实世界交互。例如，使用 `Magic Leap` 和 `HoloLens`
  可以更直接地学习如何修理东西。


  AR 和 MR 因为其交互方式相似，经常被公司交替使用。“增强现实”仍然流行，尽管 AR 设计的基本含义是将数字功能叠加在真实世界的视图上，例如智能手机显示屏上的
  GPS 过滤器/叠加层，使用户可以从街视图定位方向。数字元素和真实世界元素之间没有直接联系：与 MR 不同，计算机生成的材料无法与观察者看到的真实世界组件交互。MR
  技术的很好的例子是 `HoloLens`，它将数字物品与用户的物理世界整合在一起。


  ## 业务中的 AR

  与游戏不同，AR 技术在其他行业有广泛的应用，包括运输、制造、零售等。AR 可以改进几乎每一个可能受益于视觉叠加的业务流程或活动。企业正在拥抱 AR。例如，波音在飞机制造中测试了
  AR 指令。根据结果，时间缩短了 30%，准确性提高了 90%。此外，DHL 正在其一个仓库尝试支持 AR 的智能眼镜，并正在考虑更广泛的部署。


  零售是另一个利用 AR 技术增强消费者体验的行业。得益于 IKEA 的虚拟家具，客户现在可以在购买前在厨房和客厅空间查看物品。作为乐高“数字盒”计划的一部分，该公司正在创建一种设备，让孩子们操作他们喜爱的玩具的虚拟模型。未来几年进展可见，尽管技术仍有发展空间。客户最终能够在虚拟试衣间检查商品，在喜欢的零售店接收个性化营销和折扣，在历史遗迹处阅读额外的信息，或通过
  3D 学习以提高准确性和效率。预计到 2018 年将有 2 亿人使用增强现实，使其成为我们生活中更常见的部分。


  ## 品牌

  AR 提高销售的承诺非常有吸引力。然而，它也提出了一个关键问题：品牌需要什么技术才能在其网站上实施增强现实元素？简单的答案是，市场上的新软件现在比几年前更容易、更快、更方便地整合网站。

  - 对于增强现实功能，客户不想下载应用程序。

  - 为了获得 AR 功能的收益，必须消除使用的障碍。

  - 你的 AR 能力应该在网站上而不是在独立的 AR 应用中。

  - 使用 AR 生成软件有许多好处。直到最近，对增强现实 (AR) 感兴趣的公司必须从零构建技术。由于 `Threetkit` 等工具，基于 SaaS 的 AR
  内容创建已变得可行。

  - 结果是 AR 的访问更加方便。为移动设备创建 AR 。

  - 重申一下，如果你想获得 AR 的回报，就必须增加客户使用它的可能性。AR 体验必须与大多数消费者的技术兼容，例如智能手机（如 `iPhone` 和 `Android`）。





  * 61% 的购物者偏于选择支持 AR 的商店。

  * 高达 71% 的消费者表示，如果可以使用 AR，他们将进行更多购买。

  * 在电子商务中使用增强现实技术可能会使转化率提高 40%。


  # 第 2 章：虚拟现实


  ## 什么是虚拟现实

  利用计算机模拟器创建一个模拟 3D 视觉或其他感官环境，让虚拟现实（VR）头戴设备、目镜、手套或紧身服的用户浸在一个模拟现实外观的计算机生成世界中。通过佩戴立体头显，用户可以在屏幕上看到虚拟世界的动态视觉。通过使用运动传感器跟踪用户的动作并对屏幕显示进行即时调整，实现“身临其境”（远程存在感）是可行的。用户可以在虚拟房间中移动，并根据其头部和足部的动作来改变景观和视角。在虚拟环境中，用户甚至可以通过佩戴配有模拟触感传感器的力反馈手套来拾取并控制物品。


  1987 年，杰伦·拉尼（Jaron Lanier）创造了“虚拟现实”这一术语，他的研究和工程工作为带有各种设备的早期 VR 业务做出了贡献。美国政府，特别是国防部、国家科学基金会和美国国家航空航天局（NASA），是美国早期
  VR 研究和技术发展的共同线索。在计算机图形、仿真和网络化环境等领域，由这些机构资助并在大学研究机构开展的项目，培养了一大批优秀员工，并加强了学术、军事和商业活动之间的联系。本文将探讨发生这一演变所处的社会和技术背景。


  ## 虚拟现实的 5 个关键元素

  对于许多全球组织而言，虚拟现实（VR）的内创内容是一项巨大的投资，因为它是最新的技术营销趋势。随着 VR 头显价格的下降并变得更易获得，我们正处于巨大的 VR
  浪潮边缘。一个虚拟现实系统必须包含若干个关键组件。


  ### 1：显示网络

  * 如果你真的想要获得最佳的虚拟现实体验，你需要一个高质量的显示器。

  * 无论用户有多少，显示系统都是链条中的最后一个环节。


  ### 2：追踪系统

  * 为了获得理想的 3D 世界体验，虚拟世界需要一个传感器摄像头。

  * 此功能目前在大多数高端头显上已是常配。


  ### 3：交互元素

  * 使用虚拟现实有很多益处，但最显著的是你可以与周围环境进行交互。

  * 过去由于缺乏可用技术，无法获得真实的体验，但时代已经改变了。

  * 交互的元素取决于其范围、速度和映射。

  * 虚拟现实具有在虚拟世界中行走并改变环境的能力，提供了最理想的交互性。


  ### 4：艺术倾向

  * 虚拟环境应该让消费者沉浸在一个他们无法随意离开的世界中。

  * 作为一名虚拟现实艺术家，你应该专注于通过关注氛围、交互和娱乐来创造沉浸式体验。


  ### 5：感官管理系统

  * 用户应该感知到虚拟世界中的细微变化，例如振动、移动或方向。

  * 如今几乎所有的高端虚拟现实头显都配备了这一功能。





  ## 早期工作


  艺术和娱乐技巧一直是艺术家、表演者和娱乐节目人士喜爱的源泉。在虚拟现实出现之前，已经有若干次观众愿意悬疑自己的不信来体验一个虚构的世界。从古代起，人们就在家庭和公共区域建造了幻影空间，并在
  18 世纪末和 19 世纪初的型巨型全景图中达到了顶峰。全景图通过模糊显示主要场景的二维图像与观察这些场景的三维区域之间的视觉边界，创造出一种对所描绘事件的沉浸感。


  为了达到类似的效果，这种视觉传统启发了 20 世纪期间各种媒体的发展——从未来主义剧院设计到立体幻镜投影仪（stereopticons）、3-D 电影，再到 IMAX
  电影院。例如，弗雷德·沃勒（Fred Waller）对视觉和深度感知的研究使他建立了 `Cinerama`，这是一种为 1939 年纽约世博览会开发的宽幕电影格式。在创建沉浸式虚拟世界方面，沃勒的注意力转向了外周视觉的重要性。他的最终目标是创建一个能够复制人类整个外周视觉范围的投影系统。`Vitarama`
  方法利用了多个摄像头、投影仪和一个弧形屏幕，让观众产生一种完全沉浸在他们看到的地方的感觉。为了在世界大战期间进行训练，陆军航空队使用了 `Vitarama`（当时被称为
  `Cinerama`），名为“沃勒灵活射击训练器”（`Waller Flexible Gunnery Trainer`），尽管它直到 1950 年代中期才获得成功。它是娱乐技术与军事模拟之间联系的先驱，这种联系将推动虚拟现实的发展。


  在计算机出现之前，通过感觉刺激创建虚拟世界是一个可能的选择。莫顿·海利格（Morton Heilig）在观看名为《这是 Cinerama》（1952）的宣传短片首映后，被
  3-D 电影和 `Cinerama` 迷住了。像沃勒一样，在研究人类感觉信号和幻觉后，他希望实现“未来的电影”。海利格设计的 `Sensorama 模拟器` 旨在“刺激个人的感官以真实地模拟现实体验”，他在
  20 世纪 60 年代后期制造了它，并于 1962 年获得专利授权。它具有多种输入，包括立体图像、运动椅、音频、温度变化、气味和吹出的空气。`Sensorama`
  还制造了 `Telesphere Mask`，这是一种用于头部的“立体 3-D  显示器”，他在 1960 年对其获得了专利。在 20 世纪 60 年代中期，尽管商业化
  `Sensorama` 的尝试失败了，海利格还是制作了一个名为 `Experience Theater`（体验剧院）的专利技术 `Multiview` 剧院概念，并为华特迪士尼公司制作了一个名为
  `Thrillerama` 的类似系统。


  三维交互计算机图形和车辆/飞行模拟在 20 世纪 50 年代和 60 年代种下了虚拟现实的种子。当由美国空军资助的“旋风项目”（`Project Whirlwind`）及其继者
  `SAGE`（半自动地面环境）预警雷达系统在 20 世纪 40 年代后期开始，阴射线管（`CRT`）屏幕和光笔（最初被称为“光枪”）等输入设备首次被使用。直到
  1957 年 `SAGE` 系统投入使用，空军操作员一直在利用这些设备来显示和修改飞机的位置以及相关信息。


  计算机在 20 世纪 50 年代的流行文化中被描绘为计算机器人、能够以以前无法想象的速度处理数据的电子大脑。随着第二代和第三代晶体管和集成电路计算机变得更加负担得起，视角发生了变化，机器从对计算任务的狭窄关注中解放出来，转而关注计算如何增强人类潜力而非取代人类。


  为了更好地理解人如何与计算机交互，麻省理工学院（MIT）的心理声学教授约瑟夫·利克莱德（Joseph Licklider）在 1960 年提出了“人机共生”的概念。像沃勒一样，在研究人类感觉信号和幻觉后，他希望实现“未来的电影”。为了“刺激个人的感官以真实地模拟现实体验”，海利格的
  `Sensorama 模拟器` 在他在 20 世纪 60 年代后期制造后于 1962 年获得专利。它具有多种输入，包括立体图像、运动椅、音频、温度变化、气味和吹出的空气。`Sensorama`
  还制造了 `Telesphere Mask`，这是一种用于头部的“立体 3-D 显示器”，他在 1960 年对其获得了专利。在 20 世纪 60 年代中期，尽管商业化
  `Sensorama` 的尝试失败了，海利格还是制作了一个名为 `Experience Theater`（体验剧院）的专利技术 `Multiview` 剧院概念，并为华特迪士尼公司制作了一个名为
  `Thrillerama` 的类似系统。


  三维交互计算机图形和车辆/飞行模拟在 20 世纪 50 年代和 60 年代种下了虚拟现实的种子。当由美国空军资助的“旋风项目”（`Project Whirlwind`）及其继者
