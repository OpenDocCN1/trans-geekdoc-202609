  的怪物。`Illuvium` 拥有自己的游戏内代币以及代表生物、审美增强和实用物品的 `NFTs`。







  币安（Binance）加密货币交易所是购买 Illuvium 的方便之处。初始需要进行币安账户注册和 KYC/AML 。注册并登录后，你需要执行以下操作：


  1. 将鼠标悬停在 `[Trade]` 标签页上，选择 `[Classic]` 或 `[Advanced]` 交易视图。

  2. 将鼠标悬停在交易对上，搜索 `ILV` 并选择一个合适的交易对。

  3. 为了说明起见，我们将使用 `[ILV/BUSD]`。


  通过市价单，你可以快速方便地购买 `ILV`。选择一种订单类型并输入所需的购买金额。在点击 `[Buy ILV]` 之前，请检查您的购买内容。


  ## 如何质押 Illuvium？


  ILV 投资者可以通过两种方式从其质押中获利：


  - 通过收益农矿（yield farming）增加 `ILV` 或 `sILV`。用户可以获得 `sILV` 而非 `ILV`，可在 12 个月后在游戏内兑换。

  - Illuvium 的玩家将花费 `Ethereum` 回购 `ILV`，随后将其返回质押池。游戏发布时将包含此机制。

  - `Metamask` 或 `Binance Chain Wallet` 是质押 `ILV` 的最佳选择，因为它们可以连接到 `DApps`。


  1. `Illuvium Staking DApp` 要求你将钱包链接到它。

  2. `[CORE POOLS]` 是我们的下一站。

  3. 在这里可以质押 `ILV` 或来自 `SushiSwap` 的 `ILV/ETH 流动性池 (LP)` 令牌。要加入池，只需点击 `[STAKE]`。

  4. 池有两种：`[FLEXIBLE]` 和 `[LOCKED]`。根据你在锁定池中锁定质押的长短，你的奖励可能会翻倍（最长一年）。输入所需的质押金额并点击 `[STAKE]`
  进行投注。

  5. 你还可以使用合作伙伴代币在 `Flash Pools` 中质押，以获得 `ILV` 和 `sILV` 奖励。

  6. 兑换时，你可以接受 `ILV` 或 `sILV` 奖励。如前所述，`sILV` 激励可立即获得，而 `ILV` 奖励必须等待一年后才能领取。






  ## 结论


  Illuvium 的 `ILV` 代币和去中心化金融（`DeFi`）质押平台自发布以来，已吸引了大量的关注、势头和交易量。自首次亮相以来，Illuvium 的价格稳步增长。然而，与
  `Axie Infinity` 等其他区块链游戏相比，Illuvium 在视觉设计和用户体验方面似乎具有更高的质量。它会成为 NFT 游戏行业首批大预算 AAA
  级体验之一吗？我们需要等到 2023 年该程序的 Beta 测试阶段才能揭晓。


  # 第 5 章：元宇宙与 NFT


  虚拟现实曾是科幻领域，而现在已成为科学事实。全球范围内数亿人花费大量时间在持久的联网虚拟世界中，例如 `Fortnite`、`Roblox` 和《动物森森友》。然而，这项技术的使用不仅限于视频游戏。当我写这些文字时，全球的人们正在创建和维护虚拟社区，交换虚拟商品和服务，并为有限的虚拟资源而争斗。随着增强现实变得越来越普遍，我们看到虚拟叠加正在影响我们对现实世界的感知，而我们仍然称之为“真实”世界。因此，今天的虚拟世界倾向于绑定
  PC 或平板电脑界面，而不是科幻小说中描述的无法区分的其他宇宙。随着虚拟现实设备变得更加强大和廉价，这些虚拟体验将变得更加“真实”，我们现实环境与虚拟环境之间的边界将继续模糊。


  ## 什么是元宇宙？


  元宇宙看起来像是从漫画书里出来的东西，但它是我们许多人已经熟悉的现实。简而言之，元宇宙是你的数字自我可能存在的领域。你的虚拟自我被称为 `avatar`（化身），它可以在你创建的虚拟环境中移动并与其他
  `avatar` 对话。`Fortnite` 和 `Roblox` 等视频游戏多年来一直在这样做，现在得益于虚拟现实，这变得有趣得多。虚拟现实并不是成为元宇宙的必要条件。虚拟现实（`VR`）会提升你的元宇宙体验，但你也可以使用电脑屏幕控制你的
  `avatar`。因此，可以说虚拟现实和增强现实将在元宇宙中发挥至关重要的作用。结合使用 `VR` 和 `AR` 可能会让各种活动变得有趣得多。你带着 `avatar`
  参加虚拟活动，并在 `VR` 境下与他人互动。一个参与式的且市场营销广泛的平行现实可能正在酝备中。


  由区块链驱动的元宇宙是一个虚拟世界。在这种情况下，虚拟现实和增强现实（`VR` 和 `AR`）是视觉组件供应商，而去中心化媒体允许持续的社交互动和商业可能性。这些环境是可扩展的、可操作的、可适应的，并包含了个人和组织层面用户之间的新技术和交互形式。元宇宙有多个过程和方面，包括通信、金融交易等。`NFTs`
  也是其中的一部分。元宇宙中的任何人都可以制作、购买和查看 `NFTs` 以积聚虚拟土地、加入社交网络、建立虚拟身份、游戏等，这就是为什么元宇宙的潜力如此巨大。元宇宙框架为组织和个人的现实世界及数字资产带来了广泛的变现选择。


  ## 转向元宇宙


  缺乏统一的跨世界生态系统是虚拟现实演进最大的障碍。大多数虚拟世界是针对特定的游戏、目标或群体设计的，而不是对所有人开放。一个标准界面将被开发出来以整合虚拟世界和现实世界。它被称为“元宇宙”，因为它是一层链接的、永不消灭的虚拟世界。我们将如何到达那里无人能预知。但不可否认，虚拟现实和增强现实——协作元宇宙——现在正成为许多生活的一部分。正因为如此，聪明资金正对该领域进行豪赌。目前，Facebook
  投入了其全体员工的 20% 来开发 `VR` 和 `AR` 技术。因此，绝大多数企业甚至还没有达到这种投资水平。`Windows Mixed Reality`
  的广告/短片旨在让你将创造力扩展到元宇宙中。


  ## 什么是 NFT？


  在数字世界中，`NFTs` 是数字证书，可用于证明你拥有某物。其中许多已以数百万美元的价格出售，但绝大多数并没有明显的经济价值，也不会获得过昂的价格。最近一个
  `NFT` 以卖价超过了 5 亿美元。然而，事后发现它并没有以那个价格售出。大多数美国人仍然感到困惑。


  ## 转向 NFT


  一旦玩家在 `Axie` 的元宇宙中购买了 `NFT`（被称为 `Axis` 的肉球生物），他们就可以开始游戏。必须使用在 `bitcoin` 之后第二流行的加密货币
  `Ethereum` 来购买至少三个 `Axis`，每只成本约为 300 美元。换句话说，如果你想开始，你需要支付一笔高达 1,200 美元的巨款。






  # 在线视频游戏与元宇宙


  像`魔兽世界`这样的大型在线游戏和像`EVE Online`这样的持久性世界为元宇宙的诞生奠定了基础。像包含在线版本的《模拟人生》（The Sims）这类社交关系游戏，也可以被认为是同类。


  此外，此前还进行过数次接近元宇宙的测试。1997 年，`Canal +`推出了《第二个世界》（The Second World），这是一个由计算机生成的巴黎平行社会描绘。自
  2003 年《第二人生》（Second Life）首次问世以来，一些玩家已经在构建良好的虚拟环境中进行社交互动。然而，由于技术和带宽的缺乏限制了这类体验的普及。


  ## 元宇宙与在线视频游戏


  尽管互联网和元宇宙非常不同，但它们有许多相似之处：


  *   我们扮演自己认为自己的虚拟角色，或称为“化身（avatars）”。在在线视频游戏中，我们可能扮演法师、骑士或商人的本质。这在元宇宙中也是可能的，无论是以我们的真实形象还是角色形象出现。

  *   我们愿意支付溢价的物品。这可能是在线游戏中的某件特定盔甲或一匹马。例如，元宇宙可能拥有像飞行这样的天赋，或者它可以是一个我们购买并展示在房子里的艺术品。

  *   无论是真实的城市还是虚构的城市并不重要；那里有用于娱乐、比赛等场所。

  *   你可以个性化定制并用于招待客人的房屋；

  *   持久性。没有人能阻止我们离开这个星球。自你上次观察它们以来，情况已经发生了变化。





  因此，人们应该如何区分这两者呢？首先，由于元宇宙的参与人数没有预设限制，它带来了一个重大的技术问题——并帮助我们直看到 Meta-Facebook 在这一主题上投入了多少资金。


  # 元宇宙中的游戏


  虚拟现实一直是游戏（`VR`）的显而易见的选择。例如，`Minecraft` 和 `Second Life` 在它们的 2D 版本中将 3D 形象、世界创造和观察作为游戏玩法。得益于
  `Meta` 和 `Epic Games` 等公司，游戏现在有了新家，它们正试图创建一个互联的虚拟现实世界宇宙。在最近的一项调查中，59% 的行业专家预测，在可预见的未来，游戏将继续是
  `VR` 支出的重点。根据 64% 受访者的说法，`VR` 游戏从这项技术中获益最多。我们将看看元宇宙中的游戏是什么样子，你可能多快开始，以及需要注意什么。


  ## 元宇宙游戏环境是什么样子的？


  “元宇宙”一词指的是一种虚拟现实（`VR`）环境，在其中，用户可以使用尖端的人机交互（`HCI`）技术和软件彼此以及周围的虚拟世界互动。这是虚拟现实游戏的一大飞跃。沉浸式视频游戏现在作为独立的软件可用，可以安装在你的
  `PC`、`VR` 设备或移动设备上。你现在可以把游戏环境作为一个三维 `VR` 世界来体验，你可以对其进行 360 度探索，并用真实的感知感官实际上“触碰”它。元宇宙进一步了这一理念，该词最初出现在
  1992 年的科幻小说《雪崩》中。通过连接许多虚拟现实游戏——或者说，连接任何 `VR` 应用或区域——可以为用户创建一个统一的、可操作的体验。他们将能够在不同的游戏应用之间切换，与其他地点的相同玩家交流，甚至可以在不摘掉
  `VR` 头盔的情况下转移他们的胜利成果。这种意义上的游戏将由以下内容定义：


  ### 游戏即平台

  结果是，玩家可能会期待更具个性化的游戏体验。游戏环境可以被用各种活动的平台，用户能够为虚拟世界做出贡献，生成自己的素材，并在游戏中建立子游戏。


  ### 社交游戏

  与标准的虚拟现实不同，元宇宙从根本上说是社交性的，这一特征使其与众不同。玩家可以在多人游戏中邀请现实世界中的朋友，彼此交流，建立联系等。


  ### 边玩边赚（Play to earn）

  元宇宙中的游戏将很大程度上依赖于。此外，玩家可以参与游戏叙事和规定之外的获利活动。他们可能通过出售他们获得的物品来收回在游戏虚拟货币上的投资。


  ### 可携带游戏资产的可能性

  元宇宙架构的互操作性可能允许资产移动。例如，玩家的武器或形象升级可以在不同游戏之间传输，并由 `NFT` 规定其所有权进行监管。


  ### 混合现实体验

  `AR` 和 `MR` 被用于增强元宇宙的自然感。元宇宙中的混合现实游戏可能允许玩家无缝地从 `AR` 到 `MR` 棋盘游戏过渡到完整的 `VR` 世界。


  ## 塑造元宇宙游戏的几家公司


  然而，它仍处于起阶段；元宇宙已经吸引了来自游戏企业、互联网巨头和风险投资者的大量投资。元宇宙无疑是游戏行业的未来。`Decentraland`、`Sandbox`、`Epic
  Games` 和 `Meta` 等公司是早期采用者。


  ### Decentraland

  第一个刻意开发元宇宙的公司之一是 `Decentraland`。它包含了 3D 虚拟现实平台、基于 `Ethereum` 的加密货币和多人游戏场馆。此外，`Decentraland`
  还投资了游戏开发公司 `Decentral Games` 以扩展其游戏能力。


  ### Sandbox

  你可以在 `Sandbox`（另一个元宇宙原生游戏）中玩、构建、拥有并控制一个虚拟场所。用户生成的加密和 `NFT` 资产驱动了 `Sandbox` 的经济，并与全球公司合作提供难忘的体验。超过
  20,000 个 `NFT` 可以在该市场上购买。


  ### Epic Games

  `Epic Games` 将建立一个以游戏为中心的元宇宙，并宣布了 10 亿美元的投资。`Fortnite` 一个 `VR` 游戏和活动场所是其最著名的产品。许多音乐家利用
  `Fortnite` 的元宇宙特性举办演唱会以响应其日益的人气。


  ### Meta（原 Facebook）

  `Meta` 是元宇宙的新手，但它在 `VR` 方面有着悠久的历史。Facebook 的 `oculus` 设备建立了一个强大的世界，这些突破将继续影响该公司的愿景。开发者可以使用
  `Meta 的 Horizon Worlds` 在元宇宙中构建和发布游戏。


  ## 需要考虑的问题


  在现实世界和虚拟世界一样，虚拟现实游戏一直面临法律和伦理问题。需要考虑以下三点：


  ### 适合儿童的服务和控制

  当孩子的形象被高度定制时，监控他们的活动并将他们与成人区分来可能是挑战性的。游戏中必须包含控制措施以确保它们适合该年龄群体。


  ### NFT 所有权

  关于游戏资产的所有权规则尚不确定。所有权必须明确说明，以便用户可以互动、交易并从 `NFT` 中获益。


  ### 基础设施缺陷

  元宇宙完全实现还有很长的路要走。这需要科技公司、持有者、国家之间的大量合作来创建一个单一的元宇宙。


  考虑到这些因素，我们可以说元宇宙中的游戏还有 5 到 10 年的时间，但前景非常乐观。


