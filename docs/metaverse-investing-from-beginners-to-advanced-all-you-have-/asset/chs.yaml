  # 虚拟现实的应用


  许多人熟悉“虚拟现实”这个短语，但他们并不确定它的含义以及在日常生活中如何被使用。虚拟世界和游戏是虚拟现实显而易见的用途，但还有许多其他应用，其中一些更为困难或奇特。


  ## 虚拟现实应用在哪里？


  以下是虚拟现实的应用：


  ### 军事领域的虚拟现实

  军已将虚拟现实用于训练目的，涉及所有三个兵种（陆军、海军和空军）。在战争或其他危险情况下，部队需要学习如何做出适当反应。这对于教育士兵至关重要。然而，得益于虚拟现实模拟，他们可以在这样做时不会面临死亡或重伤的风险。在安全受控的氛围中重演特定情况，例如与对手的战斗。这比更传统的训练方式更具效益且更安全。


  军事对 VR 的用途包括：

  * 模拟飞行

  * 战场模拟

  * 医护教育（战场）

  * 车辆模拟

  * 虚拟培训课程


  创伤后应激障碍（PTSD）也可以使用虚拟现实进行治疗。患有 PTSD 和其他心理健康问题的退伍军人可以在安全的环境中获得他们应对所需的帮助。当他们暴露于疾病的触发因素时，他们将逐渐适应新环境。这减少了他们的症状并使他们能够适应新或意外的状况，提高生活质量。


  ### 医疗保健领域的虚拟现实

  手术模拟、恐惧症治疗、机器人手术和技能培训是医疗保健领域虚拟现实的一些用途。医疗执业人员可以在安全环境中获取新技能并温习旧技能，这是该技术的许多优势之一。此外，这可以在不对患者产生任何风险的情况下进行。


  #### 用于模拟行人的软件

  例如，`HumanSim` 允许医生和护士在互动环境中相互交流。只有在 3D 环境中，他们才能通过与真实患者互动来练习技能。这是一种完全沉式的体验，使用各种传感器来跟踪用户的情绪。


  #### 虚拟现实环境下的测试

  当与 `MRI` 扫描等技术结合使用时，虚拟现实可以帮助医生得出诊断。最终，将不再需要侵入性或手术。


  #### 虚拟世界中的机器人手术

  机器人手术是这项技术的日常应用。医生对机器人进行操作，由人类医生进行管理，减少了问题的出现概率并加快了愈合过程。在执行精细手术时，医生依赖于设备的力反馈，这是该技术的关键要素。远程手术（即医生在与患者不同的地点执行手术）也出于教学原因使用了虚拟现实。


  在虚拟现实和医疗保健领域，你可能会找到有关机器人手术以及虚拟现实和医学主题的信息。尽管如此，存在延迟问题，或事件之间的延迟时间，这是一个巨大的担忧，因为即使是微小的延迟对医生来说似乎都很奇怪，并导致他们停止治疗。为了避免这种情况，需要准确的力反馈。


  #### 医疗保健中 VR 的更多示例

  本节将作为一系列文章，探讨虚拟现实（VR）在医疗保健中的众多应用。

  * 虚拟现实在医学领域具有若干优势。

  * 医学领域中的牙科手术虚拟现实

  * 虚拟现实时代的护理

  * 虚拟现实中的手术

  * 模拟手术

  * 使用虚拟现实的疗法

  * 使用虚拟现实治疗恐惧症

  * 针对 PTSD 的虚拟现实疗法

  * 使用虚拟现实治疗自闭症

  * 对虚拟现实对健康影响的担忧

  * 针对残障人士的虚拟现实


  ### 商业领域的虚拟现实

  各种企业正在采用虚拟现实，包括：

  * 工作场所的虚拟之旅

  * 新员工教育与培训

  * 从所有角度观察产品





  许多公司已将虚拟现实作为一种低成本的产品或服务开发方法。例如，他们可以测试原型，而无需生产许多副本，而这可能是既耗时又昂贵的。此外，它是在早期发现设计缺陷的宝贵工具，因为此时缺陷更容易修复。


  ## 建筑领域中的虚拟现实

  在建筑领域，由于该行业以效率低下和利润率低而闻名，虚拟现实可能是一项巨大的资产。组织可以通过虚拟环境以 3D 形式查看最终结构，并像在现实世界中一样与之交互。


  ### 优势有哪些？

  使用虚拟建筑环境具有多个优势。人们可以在不建造结构的情况下测试许多变量，这既节省了时间和金钱，又最大限度地减少了最终产品的故障数量。


  ### 可行性

  建筑设计可行性必须作为关键方面进行广泛检查。多年来，结构的可行性完全取决于人类判断和比例模型。另一方面，比例模型无法充分地还原建筑必须承受的条件。正如我们所知，人类的判断可能会出现严重的、有时甚至是故意的错误。


  ### 虚拟研究概念

  在结构建造之前，建筑工人和工作人员就可能对其可行性进行评估和探索。即使是细微的数据，例如工人是否能够进入特定位置，也可以通过这种方式获取，其结果是令人惊讶的。


  ### 构建模型

  建筑可以在虚拟现实中建造，就像在现实世界中建造一样。为了实现最大效率和最少改动，组织可以使用这种方法微调其建筑流程。


  ## 编程语言中的虚拟现实

  虚拟现实需要强烈的现实感才能产生真正的帮助。这本身就是一个重大的技术问题，因此，虚拟现实是非常消耗资源的。由于对高水平现实感的要求，虚拟现实消耗了大量的硬件资源。实施团队控制从硬件性能到智力水平等一切的能力是巨大的。随着摩尔定律的衰减，满足处理速度这一主要标准将变得更具挑战性。


  创建一个令人信信的虚拟世界需要使用强大的图形处理单元（`GPU`）。音频输出质量也必须非常高，这需要使用高端声卡。这里只涵盖了技术需求的一小部分。除了硬件，使用这些资源的个人还必须具备高水平的专业知识。为了彻底理解计算机科学，通常需要研究生学习。随着时间的推移和行业的发展，这些标准必须得到妥善处理，准入门槛必须降低，就像现在的软件开发一样。一种方法是使用虚拟现实特定的编程语言来实现这一目标。


  ### 虚拟现实特定编程语言

  DSL（领域特定语言）可以以各种重要方式进行定制，以解决特定的问题领域。这对于虚拟现实体验也是如此。开发者通过仔细开发虚拟现实的正式语言，可以创建专门针对虚拟环境优化的少量代码。


  ### 可视化编程语言

  这就是 `VSL` 登场的地方。VPL 研究的杰伦·兰尼尔（Jaron Lanier）创建它是为了让虚拟现实更易普及。作为一种“后符号”编程语言，`VPL` 被定义为一种通过字母或数字字符以外的方式“编写”代码。既然说到这里，大多数计算机程序都是使用字母、数字和标点符号编写的。


  ## 教育与培训中的虚拟现实

  现实世界任务的训练长期一直是虚拟现实系统的重要用例。使用模拟器而非现有系统进行训练有许多优势，包括更低的成本和更高的安全性。商业模拟器最初用于第二次世界大战期间训练飞行员，从那时起已成为军事训练不可或缺的一部分。


  ### 飞行模拟器

  视觉和运动反馈被用于增强坐在地面封闭机械系统中的飞行体验。当以前的钢琴制造者埃德温·林克（Edwin Link）在 20 世纪 20 年代后期创建 `Link
  Company` 时，他开始建造 `Link Trainers`。在 1934 年，陆军航空购买了“蓝盒”设计。运动反馈被用于早期系统帮助飞行员更熟悉控制。坐在虚拟驾驶舱内，飞行员通过对运动做出反应来学习飞行。在模拟器外的墙壁上画了全景图（Cycloramas）。第二次世界大战期间英国政府开发的
  `Celestial Navigation Trainer` 是首批使用胶片的 `Link Trainers` 之一。然而，早期系统在产生视觉效果方面受限于训练者的运动。使用胶片和闭路电视改善飞行的视觉体验在
  20 世纪 60 年代的练习很常见。可以更改图像以产生偏离捕获内容的飞行轨迹；在其他情况下，雇用了多个摄像头提供各种视角，或在比例模型顶部安装摄像头以模拟着陆。`Sutherland
  & Sutherland Computer Corporation` 由萨瑟兰（Sutherland）和他的同事大卫·埃文斯（David Evans）于 1968
  年创建。这家公司首次专注于创建图形程序，例如飞行模拟器场景生成器。用户完全沉浸在信息丰富的虚拟环境中。萨瑟兰建议显示器包括多种传感器输出、力反馈操杆、肌肉传感器和眼球跟踪器。20
  世纪 70 年代，这些系统可以每秒约 20 帧渲染场景，这是成功飞行的最低帧率。这些模拟器由通用电气公司（`General Electric Company`）为
  `Apollo` 计划开发。几年后，在 20 世纪 90 年代初，`DARPA` 资助了手术远程工作站的研究。20 世纪 70 年代末，军事飞行模拟器开始使用头戴式显示器，这是由于其占地较小。`HMD`
  的头部跟踪器跟踪飞行员的眼球运动，使用栅格图形创建数百多边形模型以增加现实感（见 `CGI`）。新一代沉浸式实时控制已用于研究和培训，托马斯·富内斯（Thomas
  Furness），一位美国军方的电气工程师，自 20 世纪 60 年代以来一直致力于驾驶舱显示。十年后，在 1982 年，他展示了视觉耦合飞行系统（`Visually
  Coupled Airborne Systems`——今天，被称为 `Darth Vader`）。从 1986 年到 1989 年，富内斯负责空军的 `Super
  Cockpit`。该项目的核心前提是，飞行员处理空间信息的能力取决于数据以利用人类的方式呈现。为此，富内斯建立了一个沉浸式 3D 虚拟世界，将计算机生成的 3D
  地图、前视红外和雷达图像投影其中。飞行员可以使用手势、语音、眼球运动和内置头盔的跟踪系统驾驶飞机。结果是，由于更自然的界面，驾驶舱的复杂性和规则数量减少了。通过建立一个飞行员可以通过利克莱德（Licklider）的人机共存理念飞行的虚拟环境。英国航空（现
  `BAE Systems` 的一部分）在 1987 年首次开始使用 `HMD`，他们利用它创建了包含头部跟踪系统和监控手眼功能的虚拟驾驶舱培训。萨瑟兰和富内斯将模拟器技术概念从现实世界视觉扩展到表示抽象和数据的虚拟环境。在这些系统中，沉浸感和对用户有用的输入比真实性更关键。


  ### 远程存在

  为了在 20 世纪 90 年代初为手术建立远程存在工作站，`DARPA` 资助了研究。在精细动作控制和手眼协调方面，萨瑟兰的“虚拟世界窗口”与外科医生水平相当。`SRI
  International` 在 1993 年建造了第一个远程手术系统，巴黎的 `Broussais Hospital` 在 1998 年进行了首次机器人手术。远程存在，即使用通过中介感觉输入远程控制机器人设备来完成工作，被用于将虚拟现实扩展到手术。随着
  20 世纪 70 年代和 80 年代微创手术技术（如微创和腹镜手术）越来越流行，它们为虚拟手术的发展奠定了基础。20 世纪 80 年代末，开始使用内窥微摄像头向一组位于一个或多个位置查看多个显示器的外科医生传输图像。


  ### 生物学

  弗雷德里克·布鲁克斯（Frederick Brooks）1967 年在北卡罗来纳大学的 `Project GROPE` 因对分子生物学的贡献具有重要意义。通过建立分子对接的虚拟世界，布鲁克斯希望增加对药物与其受体位点相互作用的感知和理解。他使用通过手持设备中介的“触觉”反馈，使用线框图像表示分子和物理力，将虚拟分子组织成最小结合能。实验这种技术的科学研究人员就像学习使用
  `Link cockpit` 仪器的学生一样，“抓住”虚拟环境中显示的物理条件。布鲁克斯的实验室从 20 世纪 80 年代末和 20 世纪 90 年代初开始在放射和超声成像中使用虚拟现实。


  ## 虚拟现实的未来

  无论如何，虚拟现实产生的数据可以用于构建模型、培训和协作方式。据我所知，选择几乎是无限。唯一的障碍是时间、价格和技术限制。虚拟现实系统（如 `CAVE`）昂贵且耗时。人体工程学也考虑在内，专注于不会导致晕症的系统。如果这些问题能够得到解决，虚拟现实前景光明。





  - 个人交易记录没有额外的存储空间，这些记录在统计层级保留并包含记录信息。

  - UTXO 详情存储在统计层级。因此，这些信息不需要额外的存储空间。

  - 用户应为自定义描述字段提供高度区间，因为该字段具有生命周期。为了适应不同的区块高度，该字段可能会发生更改。

  - 当用户在此区域输入单词字符串时，交易成本将随单词数量呈指数级增长。

  - 需要更多的存储空间。





  # 数字身份的本质


  并不存在两个“元宇宙数字身份”。计划在协议中包含一个身份模块，并在此基础上创建更多应用程序。自主身份意味着用户控制自己的身份识别数据，不需要依赖第三方或中央权威来验证其身份。用户的声明（User
  claims）可以使用完全自主的身份进行签名和验证，而与用户交互的其他人员将验证其身份。用户还将选择公开哪些关于自己的信息。一个人的数字身份在虚拟世界中可能以多种形式存在，包括价值中间人（机构和实体）。一个人可能根据情况拥有多个数字身份（例如工作身份和个人身份）。尽管如此，它们最终都源于用户的真实世界身份
  ![](img/image_rsrc1JZ.jpg)


  在 Facebook 最近宣布品牌重塑后，引发了许多人的好奇：“什么是元宇宙？” 就像《星际迷航：下一代》中的全息甲板一样，人们可以将元宇宙想象为对现实或虚拟设置的沉浸式数字描述。传统的控制台和
  PC 游戏可以很容易过渡到增强现实和虚拟现实。在许多游戏中，任务和目标必须按照特定顺序完成，即兴的空间极小。像第一人称射击和角色扮演游戏等沉浸式游戏在游戏世界提供了更大的自由，但你的视野是受的。在元宇宙中，你获得的可能性是无限的。目前的计算能力不足以让所有人同时感兴趣并运行，因此它从一开始就不会是完全的虚拟现实。然而，简而言之，元宇宙将是一个个人可以互动、连接并成为一部分的沉浸式平台。就像没有单一的网站或国家一样，也不会有单一元宇宙。主题性的元宇宙是可能的。元宇宙可以相互关联，你可以在它们之间移动。学校、学院或大学可能是一个元宇宙。我们甚至可能拥有一个超级宇宙（Megaverse），它是互操作元宇宙的集合，你可以像使用网页浏览器一样在它们之间跳转。每个人都可以舒适地在家参与元宇宙。这将是我们我们在互联网上见过的最集成、最沉浸的体验。


  数字身份处于元宇宙的前沿，在那里你将能够构建并居住一个可以移动和做事的数字版本的自我。与其依赖人性的信任根（Root of Trust），数字身份依赖于加密的信任根。只要我们处理的是现实世界，我就放心地信任你。这些关键元素在互联网上是缺失的。在任何时候，你都不知道与你交谈的人是否真实。当我看到你在线时，我采取一种跳跃式的信任，相信你就是你所声称的那样。这引发了欺诈的阴影。通过基于领先技术和协议的数字加密凭证来增强人类信任，是解决这个问题的答案。为我们的聊天、社交媒体、消息应用程序以及我们在网上进行的所有其他活动增加一层保护层，这就像扩展由数字加密凭证增强的人类信任一样简单。


  自诞生以来，元宇宙理应得到它应有的尊重。我在元宇宙中是 David Lucatch 的事实并不意味着当你遇到我的化身（persona）时需要知道这一点。你只需要知道我的化身基于真实的个人身份就足够了。一个人的身份并非重点，而是访问系统的能力。再次，这归根于保护你的安全、Security
  和隐私。明确的是，为一家专门从事此类数字身份管理的公司工作。在今天，你无法走进一家商店就说“我忘了钱包了”。抱歉。请在这里记下我的信用卡信息、过期日期和安全码。现在，请交出电视。”然而，在互联网上情况似乎如此。假设有人经营一家在线商店。当他与经过身份验证数字身份的人合作时，他知道自己正在与真实的人打交道——验证该人的真实性可以减少每次在线遇到时发生的欺诈和识别风险。


  我们还没有习惯元宇宙所提供的参与度。如果我们知道数字身份技术已经存在并从零开始会怎样？我们居住的两个世界之一是数字世界，在那里我们可以成为任何人，甚至可以放大或加速我们的优势和天赋。我们已经看到了带有抬头显示（HUD）的眼镜，以及带有此类功能的眼镜。尽管虚拟世界仍处于婴儿阶段，但它已经开始生根。没有人知道未来十年或二十年它会什么样。这些新体验和技术的承诺可能会比过去
  50 年或 100 年的任何技术都加速得更快。因此，对于企业和个人来说，像在现实世界中一样，理解他们在元宇宙中交往的对象是谁至关重要。


  ## 数字身份创建的操作流程


  只要你拥有主私钥，你就可以构建数字身份并将其链接到你的账户。即使用户建立了身份情况也是如此。未链接到任何主私钥的数字身份被视为未经验过的，不能用于任何数字身份功能或应用程序。如果你已经使用主私钥在元宇宙区块链上注册了资产，你就不需要为它附带数字身份。元宇宙不会为每个用户自动生成数字身份；用户必须努力将他们的密钥附加到其数字身份中。主私钥持有者有权绑定
  `DID`。验证配置文件（Verification Profiles）可用于创建有效的证据链，这些链包含了关于个人在线化身的客观信息。为了证明数字身份属于某个用户，用户必须首先链接
  `DID`。


  ### 授权


  在提供任何服务之前，获得事先同意是必要的。假设 `A` 寻求 `B` 的身份信息（资产信息）。有两种情况：1000 个 `ETP` 或更多的链上资产由 `B`
  持有。与 `A` 相，`B` 拥有大量的离链资产。通常在 `B` 继续之前，他必须将其资产传输到 `ETP`。根据元宇宙目前的建议，拥有数字资产的最佳方法是在区块链上注册它们，并由预言机（Oracle）进行验证。`DID`
  标识符可作为交易市场的主要实体，它们可以在市场中生成交易。数字身份建立的这种概念。在交易市场输入 `DID` 允许我们看到当前的请求和之前的交易。


