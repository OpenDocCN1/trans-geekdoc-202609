  `AR`（增强现实）的虚拟世界中聚集。NFT 的新手将惊讶于虚拟资产市场增长得有多快。根据非官方数据，元宇宙目前占了所有 `NFT` 销量的 20%。必须理解，“元宇宙”指的是一个与我们不同的数字领域。`NFT`
