  ## 今日热门元宇宙币


  加密货币和新技术正走向接管 2022 年的银行业。它已经席卷了加密市场，“元宇宙”一词意为“彼之外的世界”。描述它的最好方法是一个数字领域，人们可以在那里连接、玩游戏、社交，并与另一端的现实伙伴进行业务交易。


  根据提供的列表，2022 年最具投资价值的一些元宇宙货币列列所示：


  1.  `Ethereum` (`ETH`)

  2.  `Axie Infinity`

  3.  `The Sandbox`

  4.  `Decentraland`

  5.  `GALA`

  6.  `Enjin`

  7.  `High Street` (`HIGH`)

  8.  `Somnium Space`

  9.  `Meta Hero`

  10. `Red Fox Labs`

  11. `Star Atlas`






  ### Sandbox


  以下是其中几个部分的介绍：


  ### Sandbox

  该游戏由 Pixowl 于 2012 年 5 月 15 日发布，是一款适用于 iOS、Android 设备和 Windows PC 的沙盒游戏。2015 年 6
  月 29 日，它在 Steam 上面向 PC 用户开放。该声明的参考来源可用。基于区块链的 3D 开放世界游戏以 Animoca Brands 在 2018 年收购的品牌命名。


  ### 区块链版本

  `The Sandbox` 由 Pixowl 创立，是一种虚拟化技术，用户可以在游戏的形式创建、构建、获取和数字交换资产。为了构建健康游戏社区的去中心化平台，`The
  Sandbox` 结合了去中心化自治组织（DAO）的力量与非同质化代币（NFT）。正如官方`白皮书`所示，`The Sandbox` 旨在将区块链技术有效融入主流游戏。该平台鼓励边玩赚（Play-to-earn）模式，允许玩家和开发者共同努力。`The
  Sandbox` 引入的 `SAND` 工具代币利用区块链技术简化网络上的交易。


  ### Sandbox 创始人

  `The Sandbox` 背后的主要动力因素是 Pixowl 的 Arthur Madrid，他也是公司的联合创始人兼 CEO。2000 年，他在`巴黎丹费林大学`获得了经济学学位。他在
  `Eurogroup Consulting France` 开始担任顾问，但很快发现了自己的创业动力。他在 2001 年创立了 `1-Click Media`，后被
  Ipercast 收购。Pixowl 的 COO Sebastien Borget 也是公司的联合创始人之一。他于 2007 年毕业于`国家电信学院`，获得计算机系统网络与电信学位。Arthur
  Madrid 在 `1-Click Media` 作为项目经理开始职业生涯，他与 Sebastien Borget 随后建立了创业伙伴关系。他们于 2011 年共同创立了
  `Pixowl`，从那时起致力于各种项目。


  ### 特特性

  `The Sandbox` 将区块链技术整合到游戏中，使其成为一个独特的平台。Pixowl 在 2011 年就意识到，游戏领域在区块链应用方面存在着巨大的、未开发的潜力。`The
  Sandbox` 意图通过为玩家提供一个构建和收集区块链物品的平台来改变行业。基于这一原因，它在全球游戏领域占据了独特的地位。`The Sandbox` 建立了一个元宇宙，玩家通过专注于用户生成的内容积极为平台的增长做出贡献。此外，`The
  Sandbox` 通过引入 `SAND` 代币鼓励去中心化治理，这使得人们能够提交关于项目进展的想法和意见。随着技术的进步，去中心化治理正成为区块链计划的需求。在初创公司刚起步时，许多知名游戏公司就提供了支持和投资，例如
  Atari、Helix 和 Crypto Kitties 等品牌。


  ### Sand 代币的监管

  `SAND` 代币的总量可能创建 3,000,000,000 个。截至 2021 年 3 月，有 680,266,194 个 `SAND` 代币流通，占总供应量的
  23%。整个代币供应量的分之一被预留给公司储备。另有 17.18% 用于代币的种子轮。在总代币供应量中，创始人和团队获得了约三分之一。整个供应量的略高于 12%
  留给了 `Binance Launchpad`。


  Sandbox 网络是如何确保安全的？

  `The Sandbox` 虚拟世界基于 `Ethereum`（以太坊）区块链，受权益证明（PoS）共识机制的保护。`SAND` 代币是 `ERC-20` 代币，这意味着它们可以被质押并以此获得奖励。与比特币网络使用的工作量证明（PoW）共识技术不同，`PoS`
  不需要大量的计算或电力来验证交易。在不损害质押资产安全的情况下，`PoS` 方法可以有许多不同的用途。


  在哪里可以购买 Sand 代币？

  由于投资者和用户兴趣的增加，`SAND` 代币交易已在越来越多的平台上进行。截至 2021 年 3 月，`Binance` 上 `SAND/BUSD` 的交易量已达到
  $7,015,941。`Uniswap (V2)`、`Gate.io` 和 `LATOKEN` 是购买 `SAND` 的更多方法。


  ### 代币经济

  `The Sandbox` 的代币包含五类类型，即：

  - `LAND` (`ERC-721`)

  - `SAND` (`ERC-20`)

  - `ASSET` (`ERC-1155`)

  - `GEM` (`ERC-20`)

  - `CATALYST` (`ERC-20`)


  ### Sandbox 中的土地

  `The Sandbox` 元宇宙的 `ERC-721` NFT 代币——`The Sandbox` 中的 `LAND`，为其持有者提供了对 9696 平方米虚拟土地的所有权。`LAND`
  拥有者可以使用 `ASSETs` 来创建游客可以享受的独特体验。目前 `The Sandbox` 中仅可用 166,464 块 `LAND`。因此，`LAND`
  是 `The Sandbox` 最稀有的 NFT 之一。


  世界中的土地分布：

  1. 总共有 123,840 块 `LAND`（或总量的 74%）可供获取。

  2. 储备金（Reserve）将包含 25,920 块 `LAND`（或约 16%），并作为激励发放合作伙伴、开发者和玩家。

  3. `The Sandbox` 将保留 16,704 块 `LAND`（约 10%）的所有权。在特殊场合，这些土地将包含独特的游戏和 `ASSETS`。





  `LAND` 的所有者有两种获利方式。首先，他们可以通过在自己的 `LAND` 上开发游戏体验，并收取 `$SAND` 作为参与此类游戏的费用来实现。如果游戏体验具有最高质量，和/或如果玩家在此过程中有机会获得一些
  `$SAND`，那么这种策略将非常非常有益。其次，`LAND` 可以租给其他`游戏创作者`、艺术家或玩家，让他们在 `LAND` 上创建自己可以展示并从中获利的体验。`LAND`
  所有者可以通过这种策略租出土地来获得被动收入收益。


  ## 庄园 (Estates)

  庄园由若干块共同出售的相邻土地组成。提供 `3x3`、`6x6`、`12-inch` 和 `24-inch` 尺寸。一个庄园可以由个人或一群人持有。这意味着所有者可以获得更多的曝光，因为点击
  `The Sandbox` 地图的玩家可以看到它们。`Estates` 通常是 `Sandbox` 元宇宙中希望开发数字存在的大型品牌和公司寻求的。


  许多不同的人在某个 `District` 中拥有 `LAND`，因此它被称为“地区庄园（District Estate）”。它们仅仅是一组为了共同治理共同目标而共同工作的
  `LANDs`。尽管 `districts` 尚未在当前版本的游戏中发布，但在游戏向公众发布时应该是可以访问的。根据 `Sandbox` 开发者的说法，`Sandbox`
  元宇宙的“地区”将产生 `DAOs`。要建立并成为地区成员，财产所有者必须投资 `$SAND`。


  ## 交易 (Transaction)

  `Sandbox Platform` 允许艺术家和玩家使用 `$SAND` 购买和交易资产。在初始销售和所有 `Sandbox Marketplace` 交易中，用户只能使用
  `$ SAND` 获取土地。向 `Marketplace` 上传资产需要艺术家支付 `$SAND`。


  ## 治理 (Governance)

  `DAO` 结构将使用治理代币 `$SAND` 管理 `Sandbox`。令牌持有者对平台的长期发展有发言权。这包括关注内容和游戏开发者如何获得 `Foundation`
  资助资金，以及如何在平台 `Roadmap` 上优先考虑功能等问题。此外，`SAND` 账户持有者可以选择将投票权委托给他们想要的任何任何人。


  ## 质押 (Staking)

  长时间持有代币可能会为用户带来形式为 `$SAND` 的被动收入。艺术家和其他玩家可能只能通过质押收获 `Gems` 和 `Catalysts`，这对于 `ASSET`
  生产至关重要。


  ## 免费模型 (Free capture Model)

  `Marketplace` 收取 5% 的费用，这将增强 `Sandbox` 的国库和 `Foundation`。


  ## 基金会 (Foundation)

  `Foundation` 可以定义为用于帮助经济及其成员增长的资金。预计 `Foundation` 将向符合条件的艺术家和游戏提供奖励。`Foundation`
  将仅以 `$SAND` 货币授予拨款。


  ## 价格历史 (Price History)

  如果认为 `$SAND` 代币的早期投资者获得了巨额回报，那就太简单了。2020 年 8 月，举行了 `$SAND` 代币的 IEO，每个代币的售价仅为 `$0.0083`。该代币的价格在
  2020 年 11 月跌至 `$0.028` 的历史低点。由于代币在发布时已获得 10 倍回报，IEO 投资者是价格下跌的主要原因。`SAND` 的当前价格为
  `$5.91`，自该币首次亮相以来投资回报率为 72,050%。





