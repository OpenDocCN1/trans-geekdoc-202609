- fmt: "\n# Early Work\n\nArtistic and entertaining skills have always been a source\
    \ of fascination for artists, performers, and entertainers alike. Before the advent\
    \ of virtual reality, there were several cases of audiences being willing to suspend\
    \ their disbelief to experience a fictional world. Illusionary spaces have been\
    \ built for homes and public areas throughout antiquity, culminating with the\
    \ massive panoramas of the late 18th and early 19th centuries. Panoramas created\
    \ the feeling of immersion in the events they depicted by blurring the visual\
    \ boundaries between the two-dimensional pictures showing the primary scenes and\
    \ the three-dimensional areas from which they were seen. \n\nFor similar effects,\
    \ this visual tradition inspired the development of various media throughout the\
    \ twentieth century—from futuristic theatre designs to stereopticons and 3-D movies\
    \ to IMAX movie theatres. As an example, Fred Waller's research of vision and\
    \ depth perception led him to establish `Cinerama`, a widescreen cinema format\
    \ developed for the New York World's Fair in 1939. When it came to creating an\
    \ immersive virtual world, Waller's attention shifted to the importance of peripheral\
    \ vision. His ultimate objective was to create a projection system that could\
    \ replicate the whole range of peripheral vision that humans had. Multiple cameras\
    \ and projectors and an arc-shaped screen were utilized in the `Vitarama` method\
    \ to give the viewers the sense of being completely immersed in the place they\
    \ were seeing. For training during World War II, the Army Air Corps used `Vitarama`\
    \ (then known as `Cinerama`) under the name `Waller Flexible Gunnery Trainer`,\
    \ even though it wasn't a commercial success until the mid-1950s. It was a pioneering\
    \ example of the connection between entertainment technology and military simulation\
    \ that would advance virtual reality.\n\nBefore computers, creating virtual worlds\
    \ via sensory stimulation was a potential option. Morton Heilig got enamored with\
    \ 3-D movies and `Cinerama` after the premiere of a promotional short called `This\
    \ Is Cinerama` (1952). After studying human sensory signals and illusions like\
    \ Waller, he hoped that \"cinema of the future\" might be achieved. Designed to\
    \ \"stimulate the senses of an individual to simulate a real experience realistically,\"\
    \ Heilig's `Sensorama Simulator` was patented in 1962 after he built it in the\
    \ late 1960s. It had a variety of inputs, including stereoscopic images, a motion\
    \ chair, audio, temperature changes, scents, and blown air. `Sensorama` also built\
    \ the `Telesphere Mask`, a \"stereoscopic 3-D TV display\" for the head that he\
    \ patented in 1960. In the mid-1960s, Heilig produced a `Multiview` theatre concept\
    \ patented as the `Experience Theater` and a similar system dubbed `Thrillerama`\
    \ for the Walt Disney Company, despite his attempts to commercialize `Sensorama`\
    \ failing.\n\nThree-dimensional interactive computer graphics and vehicle/flight\
    \ simulation sowed the virtual reality seeds in the 1950s and 1960s. When `Project\
    \ Whirlwind` and its successor, the `SAGE` (Semi-Automated Ground Environment)\
    \ early-warning radar system, both financed by the U.S. Air Force, began in the\
    \ late 1940s, cathode-ray tube (`CRT`) screens and input devices like light pens\
    \ (initially dubbed \"light guns\") were the first to be used. Until the `SAGE`\
    \ system was used in 1957, air force operators had been utilizing these devices\
    \ to show and modify aircraft whereabouts and associated information. \n\nComputers\
    \ were presented in popular culture throughout the 1950s as calculating robots,\
    \ electronic brains able to process data at previously inconceivable rates. A\
    \ shift in perspective occurred when second-and third-generation transistor and\
    \ integrated circuit computers became more affordable, releasing the machines\
    \ from a narrow focus on number-crunching tasks and instead focusing on ways in\
    \ which computing could enhance human potential rather than replace it.\n\nTo\
    \ better understand how people interact with computers, Joseph Licklider, an MIT\
    \ professor of psychoacoustics even proposed the concept of a \"man-computer symbiosis\"\
    \ in 1960. According to him, a collaboration between computers and the human brain\
    \ would be more powerful than each of them functioning on their own. His work\
    \ at `DARPA`'s Information Processing Techniques Office (`IPTO`) allowed him to\
    \ finance and support projects that fit his vision of human-computer interaction\
    \ while also fulfilling military objectives, including visualization techniques\
    \ and command-and-control systems. \n\nIvan Sutherland, an electrical engineer\
    \ and computer scientist at MIT's Lincoln Laboratory, was another pioneer in computer\
    \ graphics (where `Whirlwind` and `SAGE` had been developed). Sutherland produced\
    \ `Sketchpad` in 1963, a device that used a light pen and a control board to allow\
    \ consumers to sketch directly on a CRT monitor. Sutherland's technique was effective\
    \ for interactive editing of pictures since he paid attention to the structure\
    \ of data representation.\n\nComputer images might be used to create realistic\
    \ and fully detailed virtual worlds, according to Sutherland in 1965, who defined\
    \ the qualities of what he dubbed the \"ultimate display.\" Although he started\
    \ with visual representation and sensory input, he went on to advocate for various\
    \ sensory input methods. From 1968 until 1976, he supervised the computer graphics\
    \ courses at the University of Utah, one of `DARPA`'s most prestigious research\
    \ centers, where he was in charge of `IPTO`. At that time, `DARPA` funded projects\
    \ including Timothy Johnson's `Sketchpad III`, which provided muti views of things,\
    \ Larry Roberts's `Lincoln Wand`, which allowed users to draw in three dimensions,\
    \ and Douglas Engelbart's creation of the computer mouse, which was an input device.\
    \ In a short period, Sutherland developed the head-mounted 3-D computer display,\
    \ which has come to be associated with virtual reality.\n\nA servo-controlled\
    \ infrared camera installed underneath the helicopter was tested in 1967 by Bell\
    \ Helicopter (now part of Textron Inc.). The pilot wore a head-mounted display\
    \ (`HMD`) to see the footage. Night vision and immersion were enhanced by the\
    \ camera's ability to move with the pilot's head, which matched his field of vision\
    \ with the pictures it captured. \n\n## Timeline\n\n- **1935**: Stanley Weinbaum\
    \ published the science fiction novel `Pygmalion's Spectacles`, which accurately\
    \ predicted the goals and achievements of the future.\n- **1838**: Sir Charles\
    \ Wheatstone described `stereopsis`. His research on binocular vision, which contributed\
    \ to the development of the `stereoscope`, was given the Royal Society.\n- **1838**:\
    \ Wheatstone was able to create the first `stereoscope` because of this technique.\
    \ Using two mirrors of the same item taken from different angles to create a sensation\
    \ of depth and immersion in the images (3-dimensional).\n- **1965**: Computer\
    \ scientist Ivan Sutherland developed the `Ultimate Display`. The idea was to\
    \ create a virtual world that was so similar to the real world that the user would\
    \ not tell the difference. Using two mirrors set at an acute 45-degree angle to\
    \ the user's eyes, an image situated off the side was mirrored in each mirror.\n\
    - **1966**: He left `DARPA` for Harvard University. He started working on a tethered\
    \ display for computer pictures. This was a head-mounted device (`HMD`) with computer-generated\
    \ graphics. A suspension mechanism was used to keep the display in place since\
    \ it was too heavy to be carried.\n- **1975**: The Milwaukee Art Center presented\
    \ Krueger's `VIDEO PLACE`, the first interactive VR platform. An immersive \"\
    virtual reality\" experience was produced using big television displays in dark\
    \ rooms. You didn't need goggles or gloves to utilize it because of its usage\
    \ of computer graphics. The users' motions were recorded on camera and translated\
    \ to the shadow, allowing them to witness their computer-generated silhouettes.\
    \ People in other rooms could engage with the virtual shadows of others. Because\
    \ of this, even if individuals weren't physically nearby, they could converse\
    \ with each other in a virtual world.\n- **1991**: NASA developed virtual reality\
    \ (`VR`) technology to control the Mars rovers from Earth despite signal delays.\
    \ `Computer Simulated Teleoperation` is the name of this system. `Virtuality`\
    \ was developed by the Virtuality Group and released. A consumer-level VR entertainment\
    \ system was accessible in mass production for the first time. These virtual reality\
    \ arcade devices allowed players to immerse themselves in a 3D virtual environment.\
    \ In a Virtuality pod, visitors may don VR headsets and see 3D pictures in real-time.\
    \ Multi-player games might be making use of the devices that are connected over\
    \ a network. Some of the most popular arcade games, like `Pac-Man`, were eventually\
    \ ported to VR.\n- **2010**: For Street View, Google has added a 3D stereoscopic\
    \ option. 18-year-old entrepreneur Palmer Luckey initially prototyped the `Oculus\
    \ Rift` headgear. To deliver visuals, it used a computer's processing capacity\
    \ to produce a 90-degree field of view that had never seen before. This discovery\
    \ rekindled my interest in virtual reality and reawakened my enthusiasm for it.\n\
    - **2014**: Facebook purchased `Oculus VR` for two billion dollars. VR took off\
    \ after this. Thus, it was a seminal point in the history of technology. `Project\
    \ Morpheus`, a virtual reality headgear for the PlayStation 4, was recently announced\
    \ by Sony (`PS4`). `Cardboard` is a low-cost, do-it-yourself stereoscopic smartphone\
    \ viewer introduced by Google. Samsung revealed its `Gear VR` virtual reality\
    \ headgear using a `Galaxy` smartphone as a viewer. More individuals began experimenting\
    \ with the potential of virtual reality, such as Cratesmith, an independent developer,\
    \ who used the `Oculus Rift` and a Wii balance board to recreate a hoverboard\
    \ scene from `Back to the Future`.\n- **2016**: The technology for haptic user\
    \ interfaces is still in its infancy. Many firms were working on virtual reality\
    \ (`VR`) products in 2016. There was dynamic binaural audio on the majority of\
    \ the headsets. Humans can interact with a computer using their touch and movement\
    \ with haptic interfaces, such as the `Gloveone` gloves. As a result, most mobile\
    \ phones were button-operated. The `HTC VIVE SteamVR` headset was launched by\
    \ HTC early this year. The first commercial introduction of headgear with sensor-based\
    \ tracking lets users roam freely about an area.\n- **2019**: According to Forbes,\
    \ 2018 is the year virtual reality becomes a part of our daily lives. `Oculus\
    \ Quest`, Facebook's standalone headgear, generated $5 million in content purchases\
    \ and sparked a lot of attention and excitement. In the immersive environment,\
    \ the change from tethered to freestanding VR headsets signaled a paradigm shift\
    \ since independent headsets are far more accessible to the public. On April 12th,\
    \ Nintendo's `Labo: VR` kit for the Nintendo Switch was launched.\n"
