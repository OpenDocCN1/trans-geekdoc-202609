    # 第 6 章：投资元宇宙


    《崩溃边缘》（"Snow Crash”）由 `Neal Stephenson` 于 1992 年编写，是他的第三部作品。“元宇宙”（The Metaverse）是史芬森给他的虚拟世界的命名。换句话说：史芬森笔下居住的数字世界与现实世界一样，在角色发展方面充满活力且充满可能。像
    `Meta`（原为 `Facebook`）这样的公共企业以及像 `Decentraland Foundation` 这样的去中心化自治组织（`DAOs`），在首次提出二十八年后，仍在试图将元宇宙变成一个盈利的现实。结果是游戏人员、数字收藏家和开发者已经发现了新的业务流。


    但需要明确的是，元宇宙仍处于发展的早期，其价值主张尚未得到证实。由于涉及巨大的不确定性，投资元宇宙应该一直被视为投机行为且非常危险。


    ## 元宇宙市场机会


    到 2025 年，虚拟游戏预计产生的收入将达到 4000 亿美元，远高于 2020 年预计的 1800 亿美元。游戏创作者变现能力的持续增长是这一趋势的关键组成部分。免费玩的游戏在玩家中变得越来越流行，因为它们允许创作者通过向用户出售物品、土地等对他们的虚拟世界进行变现。


    在 `web 2.0` 和 `web 3.0`（即由用户民主化拥有和管理）之间，从封闭式元宇宙（即由 `Web` 巨头控制的）到开放加密元宇宙发生了重大变化。玩家在
    `Web 2.0` 环境中无法赚钱。为了防止玩家将他们的虚拟财富转移到现实世界，游戏创作者阻止他们与其他玩家交换物品。


    通过消除 `Web 2.0` 平台施加的资本限制，`Web 3.0` 开放加密元宇宙网络缓解了这个问题。这些 `NFTs` 可以在游戏中与其他玩家交易并传输到不同的数字体验中，从而创造一种可以在虚拟环境之外进行变现的新互联网经济。因此，对于像
    `Facebook` 这样成熟的 `Web 2.0` 公司来说，开放生态系统并放弃部分竞争优势是必经之路。元宇宙可能会在广告、社交商务、数字活动、硬件以及开发者/创作者变现产生数万亿美元的价值。


    ## 数字资产投资


    虚拟世界创造了虚拟投资的可能性。数字房地产实力的证明出现了一个迅猛的指标。`Republic Real Estate` 获取用于收购现实世界中困难房地产的资金，也可供寻求购买虚拟物业的投资者使用。虚拟酒店、商店和其他企业将在跨越多个“元宇宙”的购买的地块上建造，以增加它们在
    `bitcoin` 爱好者中的价值。


    `NFT` 艺术现在是今年最受欢迎的数字资产之一。`Bain and Co.` 的合作伙伴 `Thomas Olsen` 最近预测，所有资产将在未来 20
    或 30 年内实现代币化。他声称，加密货币实验者正在建立一个将容纳“所有股票和债券”的数字资产平台。


    仅在线购物与体验：只要企业按照自己的意愿经营，在线购买只会变得越来越复杂。他们已经通过销售元宇宙专属的服装和配件赚了数百万美元。如果你在社交媒体上花费大量时间，你的在线形象可能比今天更关键。因此，密切关注不同种族和性别身份的
    `avatars` 在网上如何定价以及为何定价至关重要。不平等正在出现，并且可能会导致灾难性的后果。


    ## 元宇宙股票


    对于想要进入元宇宙的普通投资者来说，投资业务策略或盈利能力与元宇宙相关的上市公司是波动性最低的替代方案。其中包括以下公司：


    - **Meta Platforms Inc (NASDAQ: FB)**：此前别名为 `Facebook Inc.`，`Mark Zuckerberg`
    在 10 月宣布公司更名为 `Meta Platforms Inc.`。自其推出以来，`Meta` 的虚拟现实元宇宙平台 `Horizon Worlds`
    已经发布。`Meta` 的 `Oculus Quest 2` VR 头显是最受欢迎的圣诞礼物之一。即使有更多人购买头显设备，目前还不清楚是否有更多人会利用
    `Horizon Worlds`。

    - **Roblox (NYSE: RBLX)**：通过 `Roblox`，玩家可以与其他 `Roblox` 成员一起构建并共享虚拟环境。拥有 950 万名创作者、2400
    万次数字体验和 4940 万日活跃用户——同比增长 35%——`Roblox` 自 2006 年上市以来取得了巨大的成功。尽管有这些数据，该公司尚未实现盈利。

    - **Boeing (NYSE: BA)**：扩大和提高制造能力是 `Boeing` 在元宇宙中的两个目标。在一次采访中，`Boeing` 的首席工程师
    `Greg Hyslop` 告诉路透社，公司计划开发一个私有的数字环境，其人类、计算机和机器人员工可以在全球任何地方不受中断地进行互动和合作。

    - **Microsoft (NASDAQ: MSFT)**：`Microsoft` 正在为其元宇宙在专业领域寻找位置。根据公司的计划，`Microsoft
    Teams Mesh` 将于 2022 年可用。借助这个用于流行的视频会议平台的插件，人们将能够创建自己的 3D 全息 `avatars`，无论他们在世界的任何地方都可以一起工作。用户将通过虚拟现实头显通过
    `Microsoft Mesh` 访问上述数字世界。团队成员看到并与用户互动，就像他们真的在房间里一样。


    ## 元宇宙房地产


    `NFTs`（非同质化代币）是区块链上的数字资产，可能代表各种独特物品，已经在 `The Sandbox` 和 `Decentraland` 等平台上出售，尽管元宇宙仍处于婴儿阶段。支持元宇宙平台的区块链网络验证购买元宇宙房地产时的销售和转移。元宇宙
    `NFT` 所有者在获得财产后可以对其进行租赁、出售或建造。


    在 `Decentraland` 购买了 20 块虚拟土地后，日本游戏公司 `Atari` 开设了一个加密赌场。玩家可以使用基于 `ERC20` 标准的 `Atari`
    代币赌博并领取奖金。截至 2022 年，`Atari` 计划创建一个自己的虚拟酒店群。


    '
