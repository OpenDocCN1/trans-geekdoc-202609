  trans: '


    # 入门


    第一步是注册一个 `Spatial` 账户。如果你已经有了 Google、Microsoft 或 Slack 账户，可以使用它们进行注册。你也可以使用电子邮箱注册账户。


    完成注册流程后，系统会要求你选择头像。你可以使用网络摄像头或从设备拍摄的自己的快照作为头像。在创建虚拟现实头像时，拍摄一张良好的脸部照片至关重要。请保持中性表情，直视摄像头镜头。所以，拍头像照时不要露出那种尴尬的微笑。在操作此过程时，不要把即将发布的照片看作是自拍。相反，要把它看作是拍摄执照时那样的肖像照。


    我们可以在账户个人资料的下拉菜单中选择 `Edit Profile`（编辑个人资料），随时编辑我们的头像。在这里也可以对订阅信息、`Team`（团队）、提交材料以及集成功能进行更改。


    ## 光线与色彩


    另一个关键考虑因素是光线的质量。不要忘记在光线良好的环境下拍摄头像照。自然光下拍摄的头像比人工光下的照片更理想。此外，远离强光也是个好主意。


    在 `Spatial` 获取到你一张良好的正面照片后，就会创建一个看起来像你的 3D 定制 VR 头像。从那时起，还可以使用肤色滑块和衬衫颜色选择器，允许你进一步修改头像的外观。生成
    `Avatar` 后，只需点击 `Looks Good`（看起来不错）即可关闭头像创建器。如果你不喜欢当前的头像，点击 `Regenerate Avatar`（重新生成头像）就可以用新照片重新开始。制作虚拟现实头像就是如此简单。在几分钟内创建一个
    3D 模型不需要特定的技能或昂贵的设备。


    ## 定制你的头像


    创建一个与自己相似的头像是游戏玩家们喜爱的爱好之一！如果我们希望头像能反映用户的真实自我，我们需要不断增强用于创建头像的机制。


    目前，你可以在男性或女性头像身体以及各种类人脸部之间选择。如果你是一个“手势比舞者”，可以使用 VR 头显器中的手部追踪充分展现你头像的活力。


    ## 更改你的头像


    任何时候，我们都可以通过个人资料中的下拉菜单编辑我们的头像。对订阅、提交材料和集成功能的更改在这里也可以进行。


    （注：由于原文在提供时出现了部分重复段落，已根据“不要重复输出原文”的原则进行去重处理，确保译文通顺且符合逻辑）


    在任何时候，我们都可以通过个人资料中的下拉菜单编辑我们的头像。对订阅、提交材料和集成功能的更改在这里也可以进行。


    '
- fmt: '

    - When you see those "flat" Twitter avatars, you''re getting a lot more than just
    a pretty picture. We may have entered a new era when symbols on our social media
    accounts carry more social information than the skins we wear in `Fortnite`. These
    blurry photographs are sending more social cues than my old Pally in `WOW`, despite
    their lack of realism.


    - `Fortnite`s success may be attributed to its creation of a fun gameplay mechanic
    in disposable skins for players'' avatars. Nevertheless, their financial success
    was highlighted because they made the game available for free and then made money
    through skins and other add-ons totaling $9 Billion. As a result, it was done
    on purpose for your avatar to have a shorter lifespan. You''re participating (and
    spending money) to get greater levels of ego boosts. It''s not a lousy avatar,
    but it looks like something from Season 2. A ten-billion-dollar investment is
    no little sum, but what `Epic` has done with it opened the door to new ways of
    combining IP to tell stories in the Metaverse. Aside from the fact that the appearance
    of your avatar may be changed, it also enables `Fortnite` to switch up IP. Superman
    will be battling with an `Ariana Grande` avatar.


    - Avatars may be used in various virtual places with the hopes that you''ll get
    attracted to a particular expression. You may use them to express yourself in
    a digital form. There is a sense that `Ready Player Me`''s approach to avatars
    is almost like a throwback to a previous age of avatars. It''s only one avatar,
    yet there are many worlds to explore.


    - Artificial Intelligence and blockchain models such as `DAOs` point to a future
    in which our personas will frequently act without us, and I''ve written about
    this previously. We may log out, but our virtual selves will continue their work
    even if we do not (or vote in a `DAO` or bid on some land while we sleep).


    - Rather than relying on humans to interoperate, the Metaverse''s interoperability
    will be driven by artificial intelligence. Some of those worlds may have a high
    degree of detail and seem practically genuine, while others may look more like
    `Minecraft` and be voxelized. How many versions, then, will we need to maintain?
    I believe that AI will eventually solve this problem, similar to how style transfer
    works in machine learning.


    - Alternatively, `Jin` has been experimenting with the concept that avatars may,
    instead of having a ''core'' body, carry a written description that will be ''interpreted''
    by the worlds we explore.


    - There''ll be a change in the way economies are organized, both offline and online,
    due to blockchain and `web3`. Economic value is now mostly intangible on the internet.
    For example, if you publish anything on `Facebook`, you make revenue (for `Facebook`
    and its advertisers). It is hoped that blockchain-based economies would open up
    the transaction layer, making it more accessible to new ideas. Meanwhile, the
    creator-based economy will continue to flourish in places like `Roblox`, where
    players can already earn money from their inventions. An even more profound aspect
    of avatars is that, instead of just "attaching" a wallet or maintaining an inventory,
    your avatar will function as an economic node in and of itself. In the future,
    this might lead to totally new kinds of economies that are avatar-based and avatar-centric.


    - How will we know if our avatars aren''t real people? We''re going to see a lot
    of advancements in the area of both realistic AI avatars and ways for validating
    their identification. If you need a sense of where this is going, check out `World
    coin`, a cryptocurrency that stores a picture of your eyeball on the blockchain
    to verify your identity.


    - Before, I opined that `Epic Games`'' `Metahumans` would upend whole sectors
    of the entertainment industry by becoming movie stars. But this was just one of
    many projects in which avatars have become media stars of their own. Even when
    we''re not streaming on `Twitch` or walking down the street, and people with augmented
    reality glasses can see us, we''ll be utilizing our avatars in virtual worlds
    like these.

    '
