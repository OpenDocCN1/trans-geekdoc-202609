    # 元宇宙投资中的风险承受能力


    在元宇宙中开展业务无疑会面临挑战。在元宇宙的早期（截至 2035 年），这对于进军新业务领域或投资新渠道来说将尤为如此。


    ## 不可预测的用户参与度

    虽然元宇宙中可能存在 2D 应用和桌面端参与，但虚拟现实（VR）将是主要的交互模式。尽管如此，与全球人口和社交媒体用户相比，VR 头显设备的出货量仍然很有限。个人的品味和健康状况可能会影响对虚拟现实（VR）的反应。企业可能会发现吸引全球观众是一项挑战。


    ## 加密货币价值的波动

    区块链将用于许多元宇宙商业交易，无论是加密货币还是非同质化代币（NFTs）。尽管已知加密货币价值每天波动很大，但整个元宇宙可能会受到此影响。在进行大规模投资时，NFT
    可能不像现实世界中的交易那样可靠。例如，如果客户购买了一个 `NFT`，他们可能无法合法地更改作品。这可能会让客户望而却步。


    ## 向物理世界的迁移性

    在元宇宙运营的企业面临着这种风险。因此，他们可能会发现自己处于一个只有极小比例人口可以访问的领域。如果元宇宙原生企业在长期内无法实现可持续性，我们可能会面临类似于
    20 世纪 90 年互联网泡沫的情况。


    ## 去中心化因此意味着缺乏监管

    大多数观察者、分析师和开发者都认为，真正的去中心化元宇宙是不可能的。没有人会控制它，它将是完全开放和民主的。然而，这也意味着管理元宇宙将面临挑战。即使监管机构拥有严格的法律，由于其去中心化的设计，法律也无法执行。特别是如果没有监管，中小企业（SMEs）将处于危险之中。


    '
- fmt: '

    # Chapter 7: The Metaverse and its Implications on our Digital Future


    It might be possible that the 21st century will be remembered for building and
    growing the virtual world or Metaverse since the past century was known for mass
    industry and internet rise. More immersive, dynamic, and team-based than the internet
    has ever been, this new technology is set to revolutionize how we work and communicate.
    Although many businesses participating in this arena has excellent promises, it
    has become evident that blockchain technology will underlie the Metaverse and
    help build a sustainable environment for all stakeholders. Traditional professions
    and hobbies will not be unaffected by the Metaverse, but society and the way people
    interact with one another will be profoundly altered.


    Internet and Work from Home (WFH) technological assistance were essential in keeping
    businesses viable during COVID-19''s global epidemic and allowing them to grow
    at a fast pace. After the epidemic, several industries, such as education, saw
    major transformations, becoming more reliant on new technologies. Wearable virtual
    reality technology introduced by the Metaverse can significantly reshape these
    industries. From the relief of their own homes, individuals may enter a new virtual
    world via the usage of these wearables. In the coming times, people will not have
    to carry long distances, breathe in pollution. This means that children could
    grasp the knowledge at their own tempo and broaden their horizons beyond what
    is now available with regular school curricula. In the virtual world, habits such
    as watching movies or socializing with friends after work will be possible without
    the inconveniences of the real world. In other words, the Metaverse opens up an
    infinite number of options.


    As part of a recent announcement by technology startup Together Labs, the `VCORE`
    token, an `ERC-20` token that rewards gamers, producers, and earners throughout
    the Metaverse, will be accessible to anyone outside of the United States and Canada.
    As soon as 2022, `VCORE`''s users will have access to a new sort of economy that
    will allow everyone to participate in the Metaverse development. However, like
    with any ecosystem, the Metaverse''s ability to operate will rely on how simple
    individuals can trade in the environment. Here, cryptocurrencies come in and have
    already started the ball rolling by facilitating real-world and digital transactions
    via numerous initiatives. The ability to effortlessly convert fiat monies to cryptocurrencies
    will make it much easier for users to move between the real world and the Metaverse.
    Customers will use crypto tokens issued by organizations supporting these virtual
    connections to buy digital avatars and virtual land and arrange parties for loved
    ones. Artists will perform in the Metaverse, get paid in cryptocurrencies, and
    use those funds to buy items in the real world.


    The emergence of the Metaverse might lead to a fast increase in the global economy
    as more value is discovered. According to vampire CEO `Dominic Ryder`, Metaverse
    is the next logical step in the evolution of how humans engage with technology.
    Sandboxes and other choices are available (for creative minds and gamers that
    want to build experiences). There is also a `Decentraland`, which is becoming
    a center for many kinds of activities. Other models and platforms that are similarly
    successful in the digital arena include `Axie Infinity` and `Starl`. Because so
    many people have been forced to work remotely and digitally due to the epidemic,
    I feel this trend is now in overdrive. According to `Ryder''s` prediction, people
    will start spending more time outside of work in the Metaverse. With digital commodities
    like Non-Fungible Tokens (`NFTs`) resembling popular art and digital artefacts
    already in existence, the Metaverse has already begun taking shape. It''s only
    a matter of time until other major businesses like `Meta Platforms Inc.` join
    this domain and firmly announce that it may be a new reality. An exponential extension
    of the Metaverse''s borders might open up enormous new markets for consumers and
    investors alike. To better represent `Meta''s` goal of "putting the metaverse
    into life and helping individuals connect, build communities, and develop enterprises,"
    the firm announced in October that it would change its name to `Meta`. There was
    no shortage of conjecture and discussion in the event of the global most valuable
    firms making such a significant turn.


    ## Moving towards greater adoption


    Virtual reality has been in the works for a long time, much as artificial intelligence
    has been developing for a long time. In the mid-1800s, stereoscopes enabled 3D
    encounters with drawings and images. In the 1960s, Hollywood experimented with
    immersive cinema experiences, such as the `Sensorama`, to see what might happen.
    The Air Force''s budget supported the development of 3D flight simulators in the
    1970s. The "Eyephone," an early pair of VR goggles produced and marketed in the
    late 1980s, may be humorous in its naming. Recent research suggests that since
    2000, interest in and technological capability for these immersive experiences
    has increased. I believe this to be the case.


    In a year, `Fortnite` gained 100 million new players, pushing the total number
    of registered players to 350 million. `Second Life`, a virtual environment founded
    in 2002, only had 1 million registered users after four years. When `Second Life`
    launched in 2006, it had a user base of only 0.08 percent of the internet''s total
    population. By 2020, `Fortnite''s` user base is expected to be at least 8 percent.
    As a tourist attraction, `Fortnite` would be one of the most visited places on
    Earth. To put things in perspective, 145 million people visited China in 2019,
    while roughly 80 million people visited the United States. Even so, players of
    `Fortnite` don''t have to leave their homes to go on a trip.


    ## Do people Adapt to this technology?


    Without sounding like a visionary, I believe the epidemic only expedited what
    may have already been underway in our organizational reality: a change from single-location
    corporate campuses to more regionally spread teams and organizations. There is
    no way everyone will work remotely. Still, as technology becomes better at enabling
    dispersed work and social experiences and becomes more accessible, a significant
    number of individuals are likely to work from where they are most productive.
    This group of employees is more like to devote more time to any technology that
    allows them to achieve their ideal environment.


    ## Better Understanding


    It is important for leaders to grasp the digital platforms on which metaverses
    are created to comprehend how they will impact the future of work. A "walled garden"
    architecture means that Facebook intends to own and profit from all user data
    created by its. Metaverses that are open, decentralized, and designed to respect
    the liberties of people who use and inhabit are already being built. The contrast
    between "open" and "closed" is crucial to comprehend how the internet is growing.
    Because of the emergence of new employment necessitated by the coming together
    of metaverses, digital platforms, cryptocurrency, data analytics, and decentralized
    and open apps, the internet will undergo transformation. The fact that many metaverses
    will be open and decentralized implies that every firm will have to comprehend
    how their present business models, even if they are digital, will be challenged.
    Real-world commodities like music, art, and apparel may all be tokenized on Reality
    Group.


    Prior to that, executives must work with their teams to create a shared vision
    for the organization''s future. A new Architecture of Work requires architects
    with extensive expertise in blockchain, artificial intelligence, computer vision,
    quantum computing, and high-speed networks to drive digital transformation initiatives.
    To support strategic-level decision-making, organizations will need metaverse
    analysts who can apply artificial intelligence and deep analytical tools. Metaverse
    marketing, branding, and business development will need to engage with these architects
    to revamp their company''s product and service offerings as well as virtual reality
    consumer experiences and find new markets. As a result, organizations will have
    to show that their data is safe from the next generation of quantum computers.
    They''ll also need to incorporate metaverse expertise into their governance structure
    to prevent employees from being subjected to oppressive management methods such
    as excessive surveillance and dehumanizing control. Using Metaverse technology,
    individuals will communicate and work online in new ways. Workers who spend too
    much time in virtual worlds will experience burnout if leaders don''t take steps
    to prevent this picture of the future of work from becoming a reality. Rather
    than focusing on the home-workplace divide, hybrid working will focus on creating
    a balance between the virtual and real worlds. Healthy metaverse practices will
    need new policies from human resources. Customers and workers alike will benefit
    from the potential of metaverses, which may be used as tremendous creative canvases
    for organizations. Companies that can attract a new generation of brilliant transdisciplinary
    metaverse experts by concentrating on the human element as much as the technological
    and developing purposeful cultures based on a more humanized and aware approach
    to work will thrive in the future.


    ## Anti-abuse efforts


    Individuals'' emotional and physical health are adversely affected by abuse, and
    it has the potential to push people away from online platforms. Because of the
    Metaverse''s immersive and lasting character, it is reasonable to assume that
    online abuse will be more of a concern in these locations. Because virtual reality
    can blur the distinction between what''s real and what isn''t, research shows
    that virtual reality abuse is "much more devastating than other digital environments."
    It took three punches to the face of a researcher''s avatar for her to recoil
    into a kneeling posture in her office, her mind and body recognizing the blows
    as genuine. She was plagued by "intrusive thoughts" for weeks following due to
    post-traumatic stress disorder. Keeping hatred and abuse out of virtual worlds
    will be one of the major problems for corporations in the years to come, given
    how poorly they''ve done so far. This, however, must be a key concern. These virtual
    worlds must be built to keep people secure and stop the violence that is prevalent
    on social media. However, until firms can properly regulate abuse on a large scale,
    the Metaverse will be another digital area where hatred may flourish unless it
    can generate exciting new avenues for people to interact and find a community.
    In order to ensure compatibility Sir Tim Berners-Lee developed the website to
    be a place where anybody could come and share their thoughts and ideas. "This
    is for everyone," he said on Twitter during the 2012 Olympic Opening Ceremony.
    No one firm should have exclusive control over the Metaverse, which should be
    developed as an open field rather than a walled garden. There will be several
    metaverses, not just one. So that we don''t end up with distinct digital bounds
    but instead may wander smoothly between virtual places with the same avatars and
    other digital assets. We need common standards and interoperability. We have the
    Metaverse Interoperability Community at W3C (web standards organization) and other
    interoperability initiatives creating the foundations for this. These and other
    organizations'' activities will significantly affect the Metaverse''s eventual
    form. There is still a considerable distance to go before this becomes a reality,
    but the digital future might be much more interesting if it does.


    ## Enabling access


    Beyond the thrill of a potential future, there is the fact that over one-third
    of the globe is still without a basic internet connection, and even fewer have
    the significant connection necessary to make most of the internet access. So,
    we must not ignore the critical imperative to link individuals still unable to
    access online. A select few will only utilize the Metaverse in the future; it
    will not be the main mode of communication for most people.

    '
