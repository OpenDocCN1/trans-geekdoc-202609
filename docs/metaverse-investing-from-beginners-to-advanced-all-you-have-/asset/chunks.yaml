    # 增强现实的历史与演变


    * “伊万·苏尔德”（Ivan Sutherland）和他的学生鲍勃·斯普罗（Bob Sprowle）于 1968 年创造了第一个头戴式显示器，即“达摩利斯之剑”，这是增强现实技术的开始。

    * 迈隆·克鲁格（Myron Krueger）在 1974 年取得了 AR 领域的重大进展。这一概念被称为“视频场所”（Video Place），将摄像机与投影技术相结合，在屏幕上创建阴影。该设置似乎处于一个用户交互空间内。

    * 波音研究员汤姆·卡德（Tom Cadell）于 1990 年提出了“增强现实”（Augmented Reality）这一术语。

    * 路易斯·罗森伯（Louis Rosenberg）于 1992 年在美国空军阿姆斯特朗研究实验室开发的“虚拟装置”（Virtual Fixtures）是第一个实用的
    AR 系统。机器人系统将数据保持在员工接触不到的地方。当前 AR 系统的早期原型可以在该系统中找到。

    * 1994 年，第一部采用 AR 技术的戏剧问世。朱莉·马丁（Julie Martin）的《网络空间中的舞蹈》（Dancing in Cyberspace）包含了杂技演员在计算机生成的场景和道具周围进行的表演。

    * 1999 年，NASA 的 X-38 太空器使用了混合合成视觉系统，这是其混合合成视觉系统的 AR 功能版本。在飞行测试期间，AR 被用于辅助导航开发。

    * 当日本国立科学技术大学（NIST）的加藤宏（Hirokazu Kato）于 2000 年成立并发布了名为“ARToolKit”的软件时，AR 领域取得了重大进展。为了捕捉现实活动并将其与虚拟对象合并，需要这个程序。

    * 2003 年，使用 Skycom 在 NFL（橄榄球）比赛中插入了虚拟距离标记，这是行业俯视视图的卓越工具。

    * 《时尚杂志》（Esquire Magazine）和罗伯特·道尼尼（Robert Downey Jr.）从 2009 年开始在印刷媒体中使用 AR。读者可以通过电脑软件扫描杂志条形码查看
    AR 材料。幸运的是，`ARToolKit`在同年让所有网络浏览器都能使用 AR。

    * 大众汽车从 2013 年开始在其汽车手册中使用 AR。通过`MARTA` iPad 应用程序，消费者可以查看车辆内部运行情况，并协助维修技术人员找出故障。

    * 全球最大的公司谷歌于 2014 年向公众发布了带有增强现实（AR）功能的 Google 眼镜。然而，它在全球市场上的表现不如预期。结果，Google 眼镜已于去年
    12 月停产。

    * 当增强现实（AR）在 2016 年首次通过视频游戏进入人们的日常生活时，它引发了全球狂热。著名的增强现实游戏《精灵宝梦 Go》（Pokemon Go）通过应用商店下载量超过了
    1 亿用户。这款移动游戏应用的主要目标是捕捉并使用怪物，在增强现实健身房中进行竞争。在游戏中，玩家可以看到他们喜欢的宝可梦在城市中跳跃。

    * 使用增强现实技术，宜家（IKEA）发布了`IKEA Place`，这是一款革命性的新软件，很快将对我们的购物方式产生深远影响。在购买之前，用户可以使用此应用来了解他们希望使用宜家家具布置家居的效果。

    * 《哈利·波特：霍格沃茨之谜》（Harry Potter: The Hogwarts Mystery）手机游戏在 2018 年再次在全球范围内流行起来。用户周围营造了类似霍格沃茨的氛围，他们可以使用此应用向霍格沃茨教授施咒并从中学习。已有超过
    1000 万从 Google Play 商店下载了该应用。

    * 为了庆祝曼城成立 125 周年，该俱乐部球场在 2019 年展示了一项增强现实装置。观众在新闻发布期间将有机会坐在曼城主帅“佩普·瓜迪奥拉”（Pep Guardiola）附近。3D
    全息屏幕和 360 度电影屏也是行程的一部分，旨在为粉丝提供沉浸式体验。


