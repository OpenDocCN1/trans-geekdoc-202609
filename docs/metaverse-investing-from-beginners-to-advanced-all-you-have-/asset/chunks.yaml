    -   可变证券和过渡性投资是短期金融资产的其他术语，这些资产通常可以在五年内转换为现金。

    -   如果一家公司预计在一年内售出其短期资产，那么这些资产也被视为短期投资。

    -   国库券和存单（`CDs`）等短期资产是短期投资的典型例子。

    -   短期投资的预期收益率较低，因为它们具有很高的流动性，这使得在紧急情况下可以快速提现。

    -   季度损益表反映了公司短期资产价值的所有变化。


    ## 短期投资如何运作


    对于企业、个人或机构投资者而言，短期投资的主要目的是资本保值，同时产生与国库短期债券指数基金或其他比较基准相当的收益。短期投资账户将列在公司的资产负债表上。因此，公司可以负担得起将盈余资金投资于股票、债券和类似工具中，以获得比标准储蓄账户更多的收入。


    公司要将某项投资归类为短期投资有两个基本前提条件。首先，它应该易于交易，例如知名市场上的股票或国债。其次，公司管理层必须打算在短期内（例如一年内）出售该证券。期限一年或更短的投资（如国库券和商业票据）也被视为“短期票据”或可变债权工具。可以在公开市场上出售的权益证券包括普通股和优先股。要被视为流动性，可变债权资产（如公司债券）必须具有较短的期限期并定期交易。


    ### 短期投资示例


    -   [货币市场账户](https://www.investopedia.com/terms/m/moneymarket.asp)：这些受 FDIC 保险的账户提供了储蓄账户更高的收益，但前提是你向其中存入一定金额的资金。确保你理解
    FDIC 保险货币市场账户与共同基金之间的区别。

    -   **国债**：票据、债券和通胀保护债券证券是政府发行债券（`TIPS`）的例子。

    -   **债券基金**：这些基金由专业资产经理或投资公司提供，在较短时期更为优，因为它们提供的风险回报率高于平均水平。请为它们留出预算。

    -   [市政债券](https://www.investopedia.com/terms/m/municipalbond.asp)：发行此类债券的非联邦政府实体可能提供更高的收益率和税收优惠，因为它们经常被免征所得税。


    ## 长期投资


    公司的资产，如股票、债券、房地产和现金，作为长期投资列在资产负债表的资产一侧。区分短期投资和长期投资至关重要。短期投资通常会被出售。然而，长期投资可能永远不会出售。要成为一名长期投资者，你必须准备好承担某些风险，以换取重大收益的可能性，并具备长时间保持耐心的能力。这也意味着你有财务资源将一笔固定资金保留长时间。


    -   如果一家公司打算持有股票、债券或房地产等长期投资一年或更久，那么它就是长期投资。

    -   该账户作为资产包含在公司的资产负债表上。

    -   通常来说，长期投资者更愿意承担更多风险以换取更丰收益。

    -   另一方面，短期投资应该在一年内出售。


    ## 长期投资如何运作


    这是一种系统性的长期投资策略，一家公司向另一家公司投入大量资金，但不持有其多数股权。从长远来看，收购成本被视为一种投资。由控股公司或其他企业进行的投资被归类为短期或长期投资。这种分类对资产负债表上的价值有重大影响。如果短期投资的价值下降，则记录亏损。只有在标的出售后，价值的上升才会变得明显。因此，损益表上记录的净收入直接受负债表上投资分类（无论是长期还是短期）的影响。


    ### 长期投资示例


    ### 股票

    -   股票期权是公司价值部分的实体体现。投资者受邀请参加公司的首次公募（`IPO`）。在首次公募（`IPO`）之后，公司股票将在股市交易。

    -   这是从股市获得最多资金的最精炼的技术。在长期回报方面，股票投资是所有投资选择中最好的。在数字时代，股票交易已变得简单。

    -   投资股票需要广泛的市场知识。如果你想在股市中获得成功，你需要密切关注最新趋势。

    -   如果你想投资股票和证券，请选择信誉良好的财务伙伴，并在线创建 `Demat Account` 和交易账户。如果你能找到他们，请搜索无与伦比的优势，例如佣金返现、`Demat
    Account` 的免费 `AMC` 期以及零成本创建 `Demat Account`。除了为所有投资维护单一 `Demat account` 外，你还需要确保收收到最关键的市场信息，以最大化你的利润潜力。


    ### 股票共同基金

    长期投资是产生更多钱的极佳方式。投资中小型股票共同基金可能帮助你从长期来看实现财务目标。


    ### 短期投资还是长期投资？


    -   没有明确的获胜者。两种投资都有优缺点。为了在短期内实现财务目标，短期投资是理想的。另一方面，长期投资是愿意承担更多风险以换取更好回报的投资者的选择。

    -   如果你寻求保护你的资金并可以接受最低的收益，那么短期投资是一个不错的选择。然而，如果你想看到金钱增长，你应该考虑长期投资方案。


    '
- fmt: '

    # Risk Tolerance in the Metaverse Investing


    Doing business in the Metaverse will have its challenges, to be sure. In the Metaverse''s
    early years, up to 2035, this will be especially true for forays into new business
    categories or investments in new channels.


    ## Unpredictable user engagement

    While 2D applications and desktop participation may be possible in the Metaverse,
    virtual reality (VR) will be the primary mode of interaction. Despite this, the
    number of VR headset shipments continues to be modest compared to the entire global
    population and social media users. A person''s tastes and health circumstances
    may impact responding to virtual reality (VR). Businesses may find it challenging
    to attract a global audience.


    ## Shifting value of crypto

    Blockchain will be used in many metaverse commercial transactions, whether in
    cryptocurrencies or non-fungible tokens (NFTs). Even while crypto values are known
    to fluctuate considerably from day to day, the Metaverse as a whole may suffer
    from this. NFTs may not be as dependable as real-world transactions when making
    large-scale investments. If, for example, a customer pays for an `NFT`, they may
    be unable to change the work lawfully. This may put customers off.


    ## Portability to the physical world

    Businesses operating in the Metaverse face this danger. Consequently, they might
    find themselves in an area where they are only accessible to a tiny percentage
    of the world''s population. If metaverse native enterprises fail to be sustainable
    in the long run, we might be looking at a situation similar to the dot-com boom
    of the 1990s.


    ## Decentralized therefore deregulated

    Most observers, analysts, and developers agree that a genuinely decentralized
    metaverse is impossible. No one will control it, and it will be completely open
    and democratic. However, this also implies that it will be challenging to manage
    the Metaverse. Even if the regulatory agencies had adequately stringent laws,
    it would be impossible to enforce because of its decentralized design. SMEs, in
    particular, would be put in danger if there was no regulation.

    '
