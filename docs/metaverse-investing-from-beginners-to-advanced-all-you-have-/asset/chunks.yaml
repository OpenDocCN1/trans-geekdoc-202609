    # 第 2 章：虚拟现实


    ## 什么是虚拟现实

    利用计算机模拟器创建一个模拟 3D 视觉或其他感官环境，让虚拟现实（VR）头戴设备、目镜、手套或紧身服的用户浸在一个模拟现实外观的计算机生成世界中。通过佩戴立体头显，用户可以在屏幕上看到虚拟世界的动态视觉。通过使用运动传感器跟踪用户的动作并对屏幕显示进行即时调整，实现“身临其境”（远程存在感）是可行的。用户可以在虚拟房间中移动，并根据其头部和足部的动作来改变景观和视角。在虚拟环境中，用户甚至可以通过佩戴配有模拟触感传感器的力反馈手套来拾取并控制物品。


    1987 年，杰伦·拉尼（Jaron Lanier）创造了“虚拟现实”这一术语，他的研究和工程工作为带有各种设备的早期 VR 业务做出了贡献。美国政府，特别是国防部、国家科学基金会和美国国家航空航天局（NASA），是美国早期
    VR 研究和技术发展的共同线索。在计算机图形、仿真和网络化环境等领域，由这些机构资助并在大学研究机构开展的项目，培养了一大批优秀员工，并加强了学术、军事和商业活动之间的联系。本文将探讨发生这一演变所处的社会和技术背景。


    ## 虚拟现实的 5 个关键元素

    对于许多全球组织而言，虚拟现实（VR）的内创内容是一项巨大的投资，因为它是最新的技术营销趋势。随着 VR 头显价格的下降并变得更易获得，我们正处于巨大的 VR
    浪潮边缘。一个虚拟现实系统必须包含若干个关键组件。


    ### 1：显示网络

    * 如果你真的想要获得最佳的虚拟现实体验，你需要一个高质量的显示器。

    * 无论用户有多少，显示系统都是链条中的最后一个环节。


    ### 2：追踪系统

    * 为了获得理想的 3D 世界体验，虚拟世界需要一个传感器摄像头。

    * 此功能目前在大多数高端头显上已是常配。


    ### 3：交互元素

    * 使用虚拟现实有很多益处，但最显著的是你可以与周围环境进行交互。

    * 过去由于缺乏可用技术，无法获得真实的体验，但时代已经改变了。

    * 交互的元素取决于其范围、速度和映射。

    * 虚拟现实具有在虚拟世界中行走并改变环境的能力，提供了最理想的交互性。


    ### 4：艺术倾向

    * 虚拟环境应该让消费者沉浸在一个他们无法随意离开的世界中。

    * 作为一名虚拟现实艺术家，你应该专注于通过关注氛围、交互和娱乐来创造沉浸式体验。


    ### 5：感官管理系统

    * 用户应该感知到虚拟世界中的细微变化，例如振动、移动或方向。

    * 如今几乎所有的高端虚拟现实头显都配备了这一功能。

