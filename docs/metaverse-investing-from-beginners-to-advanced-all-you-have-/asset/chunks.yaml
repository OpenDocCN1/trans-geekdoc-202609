  trans: '


    - 当你看到那些“扁平化”的 Twitter 头像时，你获得的不仅仅是一张漂亮的图片。我们可能已经进入了一个新时代，社交媒体账户上的符号所承载的社交信息比我们在
    `Fortnite` 中穿的皮肤还要多。尽管这些模糊的照片缺乏真实感，但它们发送的社交信号比我在 `WOW` 里的老伙伴（Pally）要多。


    - `Fortnite` 的成功可能归功于它在玩家头像的一次性皮肤中创造出了一种有趣的游戏机制。尽管如此，它们的财务成功之所以引人注目，是因为它们提供了免费游戏，然后通过皮肤和其他插件赚了总额达
    90 亿美元的费用。因此，让你的头像拥有更短的寿命是刻意为之。你参与其中（并花钱）是为了获得更高层次的自我感提升。这不是一个糟糕的头像，但它看起来像是第 2
    赛季的东西。百亿美元的投资可一笔小数目，但 `Epic` 所做的一切为元宇宙中结合 IP 讲述故事的新方式开启了大门。除了你的头像的外观可以改变之外，它还让
    `Fortnite` 能够切换 IP。超级人将与 `Ariana Grande` 头像进行战斗。


    - 头像可能被用于各种虚拟场所，希望你会被某种特定的表情所吸引。你可以用它们以数字形式表达自己。人们觉得，`Ready Player Me` 的头像方法几乎像是对以前头像时代的追溯。虽然只有一个头像，却有许多世界可以探索。


    - 人工智能和区块链模型（如 `DAOs`）指向一个未来：我们的虚拟人格将经常在我们不在场的情况下行动，我以前就写过这一点。我们可能会登出，但即使我们不，我们的虚拟自我也会继续工作（或者在我们睡觉时在
    `DAO` 中投票或对某些土地竞价）。


    - 元宇宙的互操作性将不再依赖人类的协作，而是由人工智能来驱动。其中一些世界可能具有高度的细节并看起来几乎是真实的，而另一些世界可能看起来更像 `Minecraft`
    并经过体素化。那么，我们需要维护多少个版本呢？我相信 AI 最终会解决这个问题，类似于机器学习中风格迁移的工作原理。


    - 此外，`Jin` 一直在尝试一种概念：头像可能不再拥有“核心”身体，而是携带一段文字描述，这段描述将由我们探索的世界进行“解释”。


    - 由于区块链和 `web3` 的影响，线下和线上的经济组织方式将发生变化。现在互联网上的经济价值大部分是无形的。例如，如果你在 `Facebook` 上发布任何内容，你就会产生收益（为了
    `Facebook` 及其广告商）。人们希望基于区块链的经济能开放交易层，让新想法更易触及。同时，基于创作者的经济将在 `Roblox` 等地方继续繁荣，玩家在那里已经可以从自己的发明中赚钱了。头像的一个更深层次的方面是，你的头像不仅仅是“挂载”钱包或维护库存，它本身将作为一个经济节点运行。未来，这可能会导致完全全新的以头像为基础并以头像为中心的经济体。


    - 我们如何知道我们的头像不是真实的人呢？我们将看到写实 AI 头像以及验证其身份的方法领域取得大量进展。如果你想了解这一发展趋势，可以查看 `World
    coin`，这是一种在区块链上存储你眼球照片以验证你身份的加密货币。


    - 之前，我曾认为 `Epic Games` 的 `Metahumans` 将通过成为电影明星而颠覆整个娱乐行业。但这只是许多头像已成为自身媒体明星的项目之一。即使我们没有在
    `Twitch` 上直播或在街上走走，并且当佩戴增强现实眼镜的人能看到我们时，我们仍会在这些虚拟世界中利用我们的头像。


