    # 了解增强现实


    虚拟和音频/视觉组件与现实环境相结合，提供一种被称为增强现实（AR）的改进体验。特别是在移动计算和企业级应用中，这种做法正变得越来越流行。使用增强现实的一个核心目的是是在数据收集和分析增长的期间，强调并理解物理环境的某些方面，以用于现实世界的应用。企业可以利用大数据来做出明智的选择，并更深入地了解客户在哪些方面花费了钱，以及其他等方面。


    增强现实在各种应用中的普及正在兴起。自诞生之初以来，增强现实一直在努力与“它仅仅是一个营销工具”的观念作斗争。然而，消费者已开始看到这一功能的价值，并期待它能成为购物过程的一部分。例如，零售业的早期采用者已经创造了改进客户购物体验的技术。使用增强现实的目录类应用程序允许客户看到各种商品在多种场景下的显示效果。以家具为例，如果消费者在正确的房间内拍照，产品就会显示在前景中。


    在医疗保健行业，增强现实的优势可能大得多。将移动设备悬停在目标图片上方可以显示各种人体系统的 3D 图像，这可以为消费者提供丰富的信息。例如，医学生和住院医生可能从使用增强现实教学工具中显著受益。根据一些人的观点，可穿戴技术可能是增强现实领域的游戏规则改变者。与智能手机和平电脑不同，如果智能眼镜被广泛使用，它可以为用户在现实与虚拟世界之间创建完全连接。


    ## 增强现实的工作原理


    加载了 `AR` 软件的带摄像设备（如手机、平板电脑或智能眼镜）是增强现实的起点。当用户引导设备指向物体时，计算机视觉技术分析视频流以检测物体。随后，云端信息以类似的方式下载到设备，就像网页浏览器加载网页一样。`AR`
    信息不是以屏幕上 2D 页的形式显示，而是作为叠加在物体上的 3D “体验”来显示。因此，用户的体验是真实与虚拟的混合。


    通过增强现实（`AR`），用户可以通过触摸屏、语音或手势实时查看并与来自设备的流数据进行交互。例如，为了向产品传递命令，用户可以在 `AR` 交互中点击数字图形叠加上的停止按钮，或者简单地说“停止”。通过
    `AR` 头机，可以查看投影在机器人本身上关于机器人状态和能力的信息。随着用户在房间内移动，`AR` 显示的大小和位置会根据不断变化的上下文动态调整。随着新视觉或文本数据的到来，其他信息会被遮挡。


    机器操作员和维护技术人员可能同时观察同一个物体，并在工业背景下根据他们的特定职责定制各种 `AR` 体验。物体的“数字孪生”（一个存在于云端的 3D 数字表示）充当亮物体与
    `AR` 之间的链接。可以使用计算机辅助设计（`CAD`）或将实体数字化的技术来生成此模型。孪生体从开发、业务系统和外部来源收集数据，以代表产品的当前现状。通过这种方式，`AR`
    软件可以精确地在物体上定位和缩放最新的数据。


    ![](img/image_rsrc1JW.jpg)


    ## AR 设备


    最广泛使用的矛盾词（oxymoron）可能是虚拟现实（`VR`）。它允许用户完全沉浸在计算机生成的 3D 表示中。头戴显示器（`HMDs`）或全沉浸式投影系统是实现虚拟现实（`VR`）的常见手段。谷歌利用纸板、塑料透镜和其他其他廉价组件创建基于智能手机的
    `VR` 体验，改变了游戏规则。专供商业和学术技术官僚使用的虚拟现实体验仅需 15 美元，任何人都可以享受。一种明智且高影响力的方法让该技术被广泛采用。然而，尽管存在动荡，但增强现实极有可能成为更受接受的技术。


    ### 主要类别


    增强现实可以追溯到 20 世纪初，尽管该术语出现的时间相对较晚。早期望远镜制造者霍华德·格鲁布（Howard Grub）发明了反射镜。它的首要目标是通过将准星聚焦在用户的预定目标上来提高射击精度。它一次只关注一个任务。存在四类主要的增强现实设备。


    ![](img/image_rsrc1JX)


    ### 平视显示器 (HUDs)


    随着技术日益复杂，飞机上的传感器、航空电子设备和飞行控制数量增加，增加了对信息处理的需求。飞行员需要将注意力集中在外部世界，而不是驾驶舱内大量的信息上。飞行员不需要低头盯着仪表盘，而是可以向窗外观察周围发生的事情。HUD
    使用类似于格鲁布反射镜的投影仪，试图解决焦点切换的问题。这意味着飞行员的眼睛不需要改变焦点即可看到驾驶舱之外，因为呈现的信息是聚焦在无限远的。平视显示器（`HUDs`）在汽车设计中变得越来越流行。一个典型的
    `HUD` 由投影仪、显示器（组合器）和计算机（发生器）组成。


    ### 头盔式显示器


    从挡风玻璃到头盔是显示器的下一个自然步骤。航空和其他行业越来越多地使用原理相同的头盔屏幕。


    ### 全息显示器


    由于《星际大战》、《少数报告》和《钢铁侠》系列电影的影响，这些显示器变得更加受欢迎。全息显示器最吸引人的方面之一是它们不需要佩戴者使用特殊设备即可观察。像
    Looking Glass 和 Holove 等产品最近将这些显示器从科幻带入了主流。


    ### 智能眼镜


    随着技术从军事和航空的关键用途变为广泛获取的物品，智能眼镜一直是最受欢迎的增强现实设备之一。正如名称所示，这些是放大眼镜。两种智能眼镜中的一种被称为智能眼镜。


    ### 光学透视


    如果你有一对光学透视眼镜，你就可以通过全息波导和其他允许让你在现实环境之上叠加图形的设备看到真实世界。最近的光学透视智能眼镜示例包括微软的 HolLens、Magic
    Leap One 和 Google Glass。


    ### 视频透视


    HTC Vive 头机内置摄像头通常用于在设备上创建增强现实体验。得益于显示器的一个或两个摄像头，这种智能眼镜让佩戴者看到世界原本的样子。对于用户来说，这些图像与计算机生成的图形混合在一起。


    ![](img/image_rsrc1JY.jpg)


    ### 手持 AR


    手持 AR 的普及已达到拐点，为广泛采用铺平了道路。随着 `ARKit`、`ARCore` 和 `Markit` 等增强现实库的出现，任何人都可以使用先进的计算机视觉技术。你只需要智能手机就可以访问广泛的
    AR 体验，无论你是将其用于手持还是移动 AR。作为一种视频透视，便携 AR 需要特定的关注。


    ## 当前领先者


    很快，手机 AR 眼镜和头机将共处同一个环境中。虚拟现实（`VR`）可以在智能手机、平板电脑和桌面设备上使用，因为它不需要任何特殊硬件。我们将看到更多这样的
    AR 设备：


    ### 微软 HolLens 2


    微软的 HolLens 2 是最完美的增强现实设备。作为唯一的双 2K 120Hz 显示 AR 设备，它可以比任何其他可用 AR 设备更清晰地显示 3D 对象。除了跟踪眼睛和手部，HolLens
    2 让你自然地与虚拟环境交互。HolLens 2 是增强现实的领导者，具有更多校准和缩放功能。


    ### Magic Leap One


    在最著名的初创公司中，Magic Leap 在去年脱颖而出。他们发布了突破性的增强现实设备 Magic Leap One。它的价格约为 2299 美元，但它让你在现实世界中体验
    AR 图形。一个不完全隔离你与现实世界的设备似乎是一个明智的选择。


    ### 普讯 Moverio


    与 HolLens 和 Magic Leap One 相比，普讯 Moverio AR 设备允许你看到现实世界中漂浮的虚拟显示。显示是基于你的眼睛而不是面前的环境。因此，屏幕将始终面向用户的眼睛。


    ### Google Glass 企业版


    当 Google Glass 最初推出时，它是一个失败品。该设备的优势，如捕捉视频或拍摄照片而不通知他人，使得它对消费者具有吸引力。尽管如此，Google
    发现了一种恢复方法。得益于其功能和其他利益，医生、机械师和任何人现在都可以使用 Google Glass。它允许人们在双手空的同时与世界连接。


    ### Vuzix Blade


    在 Google Glass 停用后，Vuzix Blade 填补了空白。与 Google Glass 不同，Vuzix Blade 摄像头具有红色指示，让知道摄像头已激活。然而，它具有位于中心的显示，而不是角落显示。在很大程度上，它由
    Alexa 控制，但也通过蓝牙与手机兼容。


    ## AR 当前示例


    在增强现实的世界中，可能性是无限的。这种技术将在未来几年在我们的日常生活中变得普通。一些公司和企业已经在这种技术上取得了巨大进展，但目前最强大的用途：


    ### 移动应用


    IKEA 是最早使用增强现实的公司之一，以其有趣的名称闻名。2012 年，作为 Place 应用的一部分，IKEA 现在让你从商店选择任何物品，并查看它如何缩放到你的房间。无论你是否确定某件家具是否适合特定区域或主题。


    ### Nintendo Go 应用


    消费者可以使用应用查看桌和架子在不同位置显示。为了在 2016 年发布，Pokémon Go 允许玩家通过扫描虚拟环境来捕捉他们的喜好。在其巅峰时期，有 650
    万人玩了这个游戏，使其大获成功。


    ### Google Pixel 贴纸


    不提到增强现实是不可能的，Google 手机包含摄像头功能，允许用户在照片和视频中添加贴纸。可能发现大量的青少年在你的区域行走。


    ### 彩色书


    《星球大战》是一部电影；如果你在电影院看到或看电视，无疑至少见过一个随机风暴兵的图像。对于孩子们，迪士尼在几年前制作了一种增强现实体验来观看电影中他们喜欢的角色。使用增强现实（`AR`），一组研究人员使用手机或平板电脑创建了彩色图像的
    3D 重建。


    ### Loreal 化妆


    Loreal 提供类似的移动应用，允许用户尝试不同的化妆品。在某种意义上它就像 Snapchat 滤镜，软件扫描你的脸，然后向你展示特定产品的色调出现在虚拟环境中。


    ### 天气频道特效


    多年来，电视新闻一直使用特效来提高节目质量。例如，天气预报员使用了绿幕（将地图投影到屏幕上）向公众传达他们的预测。天气频道现在正在使用更先进的技术来更好地描述极端天气。最近，一辆虚拟汽车在工作室里行驶，以展示汽车在雪地或冰面上行驶时失去控制。这只是广播行业增强现实系列应用中的最新。新闻、天气和体育广播中的增强现实预计在未来几年增长。


    ## 技术


    得益于这项创新技术，手机、平板电脑、电脑、电视甚至眼镜或眼镜镜很快就可以直播画面上方显示实时信息。在电视上看足球比赛是消时间的好方法。为了方便，球场上的黄色首码线是虚假的。你只能在电视上看到它，因为它增强现实显示。例如，飞机头盔上的平视显示是另一种类型。地理定位和视觉成像是
    AR 的关键组件，可以是用户的重要工具。它是一种娱乐、商业、营销、艺术、社交网络和活动的快速发展的技术。此外，这种技术在治疗心理健康问题方面很有潜力。尽管对
    AR 的研究很少，它对用户的影响也是显而易见的：虚拟现实是迷人的、有趣的、有说服力的且全面的。尽管增强现实（AR）现在主要用于娱乐目的，但它是一项快速扩张的技术。预计
    AR 开发和编程到 2016 年投资将增加超过 6 亿美元。几家主要的科技公司正在加大创建 AR 能力产品的力度，包括苹果、HP、谷歌和高通。美国国防部对
    AR 做出了巨大的资金承诺，DARPA 正在研究支持该技术的未来。VR 和 AR 技术进步应该引起心理学兴趣，因为它们有潜在的治疗和研究用途。例如，想象一个患有蜘蛛恐惧症的患者暴露在增强现实蜘蛛下，同时可以改变生物的外观（尺寸和形状）、颜色和动作。想象让患者与这些虚拟蜘蛛交互，操纵它们的活动甚至将它们捡起来，这一切都在虚拟世界中！尽管虚拟现实（`VR`）可以在智能手机、平板电脑和桌面设备上使用，因为它不需要任何特殊硬件。我们将看到更多这样的
    AR 设备：


    ### 增强现实


    增强现实是是普及的道路。随着 `ARKit`、`ARCore` 和 `Markit` 等增强现实库的出现，任何人都可以使用先进的计算机视觉技术。你只需要智能手机就可以访问广泛的
    AR 体验，无论你是将其用于手持还是移动 AR。


