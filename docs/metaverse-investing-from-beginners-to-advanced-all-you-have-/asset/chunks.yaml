    Several firms have adopted virtual reality as a low-cost product or service development
    method. For example, they can test a prototype without producing many copies of
    this, which may be time-consuming and costly. In addition, it is a valuable tool
    for spotting design flaws early on when they are easier to fix.


    ## Virtual Reality in Construction

    When it comes to the building sector, virtual reality may be a tremendous asset
    because of the industry''s reputation for inefficiency and poor profit margins.
    An organization may see the final structure in 3D and interact with it as if it
    were in the real world using a virtual environment.


    ### What Are the Advantages?

    Using a virtual construction environment has several advantages. It is possible
    to test many variables without having to construct the structure, which saves
    time and money while also minimizing the number of faults in the final product.


    ### Viability

    Architectural design viability must be extensively examined as a key aspect. For
    many years, a structure''s viability was determined solely by human judgment and
    scale models. On the other hand, scale models cannot adequately recreate the conditions
    in which a building must endure. As we know, human judgment may be grossly and
    sometimes purposely erroneous.


    ### Virtually Investigating the Concept

    Before a structure is even constructed, it may be evaluated for feasibility and
    explored by construction workers and staff. Even minute data, such as whether
    a worker will be able to fit in a particular place, may be picked up in this way,
    and the results are astounding.


    ### Constructing a Model

    Buildings can be built in virtual reality just as they would be in the real world.
    To achieve maximum efficiency and minimal change, an organization may fine-tune
    its building processes using this method.


    ## Virtual Reality in Programming Languages

    Virtual reality needs a strong feeling of realism to be genuinely helpful. In
    and of itself, this is a significant technological problem, and, as a result,
    virtual reality is very resource-intensive. Virtual reality takes a vast number
    of hardware resources because of the high level of realism required. The implementation
    team''s capacity to control everything from hardware performance to intellectual
    aptitude is significant. As Moore''s law deteriorates, it will become more challenging
    to meet the primary criterion of processing speed.


    Creating a believable virtual world necessitates using a powerful graphics processing
    unit (`GPU`). The audio output quality must also be exceptionally high, which
    requires the usage of a high-end sound card. Only a tiny portion of the technical
    needs are covered here. Aside from the hardware, the individual employing these
    resources must also have a high level of expertise. Post-graduate study is frequently
    required to have a thorough understanding of computer science. As time goes on
    and the industry grows, these criteria must be dealt with properly, and the barrier
    to entry must be decreased, much like in software development today. One approach
    is to use a virtual reality-specific programming language to achieve this.


    ### Virtual Reality-Specific Programming Languages

    DSLs (domain-specific languages) may be customized in various important ways to
    address a particular issue area. This also holds for virtual reality experiences.
    Developers may create less code that is specifically optimized for virtual environments
    by carefully developing the formal language(s) for virtual reality.


    ### Language for Visual Programming

    This is where `VSL` comes in. `VPL` Research''s Jaron Lanier created it to make
    virtual reality more accessible. As a "post-symbolic" programming language, `VPL`
    is defined as one in which code is "written" in ways other than via the use of
    alphabetic or numeric characters. Since we''re on the subject, most computer programs
    are written using alphabetic characters, numbers, and punctuation.


    ## Virtual Reality in Education and Training

    Training for real-world tasks has long been an important use case for virtual
    reality systems. There are several advantages to using simulations instead of
    existing systems for training, including lower costs and higher safety. Commercial
    simulators were initially used to train pilots during World War II, and they have
    since become an essential aspect of military training.


    ### In-flight Simulators

    Visual and motion feedback are used to enhance the experience of flying while
    sitting in a closed mechanical system on the ground. When Edwin Link, a former
    piano builder, created the `Link Company` in the late 1920s started building the
    prototype `Link Trainers`, the Army Air Corps purchased the "blue box" design
    in 1934. Motion feedback was employed in the early systems to help pilots get
    more comfortable with the controls. Sitting in the virtual cockpit, pilots learned
    how to fly by moving it in reaction to their movements. Cycloramas were painted
    on the wall outside of simulators for visual input in later editions.


    `Celestial Navigation Trainer`, developed by the British government during World
    War II, was one of the first `Link Trainers` to employ projected film strips.
    However, early systems were limited in producing fresh visuals depending on the
    trainee''s movements. Using film and closed-circuit television to improve the
    visual experience of flying was common to practice for flight instructors by the
    1960s. It was possible to alter the pictures to produce flight trajectories that
    diverged somewhat from what had been captured; in other cases, numerous cameras
    were employed to offer various views, or moveable cameras were installed atop
    scale models to portray the airport for simulated landings.


    `Sutherland Evans & Sutherland Computer Corporation` was created in 1968 by him
    and his colleague David Evans at the University of Utah. The new firm first concentrated
    on creating graphical programs, such as flight simulator scene generators. Taking
    inspiration from the `Link` flight simulator, Sutherland proposed that such displays
    include multiple sensory outputs, force-feedback joysticks, muscle sensors, and
    eye trackers; a user would be fully immersed in the displayed environment and
    fly through "concepts which never before had any visual representation."


    In the early 1970s, these systems could render scenes at around 20 frames per
    second, which is the minimum frame rate required for successful flying instruction.
    These simulators were developed by `General Electric Company` for the `Apollo
    program` in the 1960s and the US Navy a few years later, respectively.


    When these systems were first introduced in the 1970s, they could create a few
    hundred polygon models using raster graphics (collections of dots) and could represent
    solid objects with textures to increase the impression of realism (see computer
    graphics). Flight simulators for the military began to use head-mounted displays,
    such as `McDonnell Corporation`, in the late 1970s due to its smaller footprint.
    The `HMD`''s head tracker tracked a pilot''s eye movements to synchronize computer-generated
    visuals (`CGI`) with his vision and control of the plane. A new generation of
    immersive, real-time control has been shown for research and training, Thomas
    Furness, an electrical engineer with the US Force, has worked on cockpit displays
    since the 1960s. A decade later, in 1982, he exhibited `Visually Coupled Airborne
    Systems`—better known today as `Darth Vader`—which he had been on since the late
    1970s. From 1986 until 1989, Furness was in charge of the Air Force''s `Super
    Cockpit`. This project''s core premise was that pilots'' ability to deal with
    spatial information was dependent on the data being "portrayed in a fashion that
    makes use of the human." For this purpose, Furness built a system that projected
    computer-generated 3D maps, forward-looking infrared and radar pictures into an
    immersive, 3D virtual world that the pilot could watch and hear in real-time.
    It was possible for the pilot to fly the aircraft using gestures, speech, eye
    movements, and tracking systems built into his helmet. This gave him complete
    control over the aircraft while immersed in an information-rich virtual environment.
    As result, cockpit complexity and the number of rules were decreased due to a
    more natural interface. By establishing a virtual environment where pilots could
    fly via Licklider''s ideal of human-machine coexistence. When British Aerospace
    (now part of `BAE Systems`) first started using `HMD` in 1987, they utilized it
    to create `Virtual Cockpit` training which included a head-tracking system and
    features for monitoring hand and eye movements. Sutherland and Furness extended
    the concept of simulator technology from real-world visuals to virtual environments
    that represented abstractions and data. Verisimilitude was not as crucial in these
    systems as immersion and input that was useful to the user.


    ### Telepresence

    To build telepresence workstations for surgery in the early 1990s, `DARPA` financed
    research. When it came to fine motor control and hand-eye coordination, Sutherland''s
    "window into a virtual world" was on par with that of a surgeon. `SRI International`
    built the first telesurgery system in 1993, and the `Broussais Hospital` in Paris
    conducted the first robotic surgery in 1998. Telepresence, the use of robotic
    equipment controlled remotely via mediated sensory input to complete a job, was
    used to extend the virtual reality to surgery. As less invasive surgical techniques
    such as microsurgery and laparoscopic surgery became more popular in the 1970s
    and 1980s, they laid the groundwork for the development of virtual surgery. Endoscopic
    micro cameras to transmit pictures to a group of surgeons viewing one or more
    displays, typically in different locations, began in the late 1980s.


    ### Biology

    Frederick Brooks'' 1967 University of North Carolina `Project GROPE` is significant
    for its contributions to molecular biology. By building a virtual world of molecular
    docking, Brooks hoped to increase the perception and understanding of the interaction
    of a drug with its receptor site. He used "haptic" (tactile) feedback mediated
    via hand-grip devices to organize the virtual molecules into a minimal binding
    energy using wire-frame images to represent molecules and physical forces. Scientific
    researchers experimenting with this technology were like students learning to
    use the instruments in `Link cockpit`, "grasping" the physical conditions shown
    in the virtual environment. Brooks'' laboratory began using virtual reality in
    radiology and ultrasound imaging in the late 1980s and early 1990s.


    ## The Future of Virtual Reality

    In any case, virtual reality generates data that may be utilized to build new
    models, training techniques, and ways of communicating and collaborating. As far
    as I can tell, the options are almost limitless. The only stumbling barriers are
    time, price, and technical limits. Virtual reality systems, such as the `CAVE`,
    are costly and time-consuming to construct. Ergonomics also come into play, focusing
    on creating systems that are "user-pleasant" and don''t lead to difficulties like
    motion sickness. Virtual reality has a bright future if these issues can be addressed.


    ## Role of Virtual Reality in Metaverse

    The Metaverse is one of the most forward-thinking technological concepts to emerge
    last year. As soon as the proposal was introduced, it was met with both favor
    and opposition. If you haven''t yet taken a position on either side, it''s time
    to discover what the Metaverse is. Is it possible without the use of `VR/AR`?
    What are the advantages to you? Let''s take it one step at a time. Virtual reality
    closes the apparent gaps between digital and physical reality by allowing users
    to access the Metaverse. It enables people to walk inside exhibitions, shops,
    and educational possibilities. We''ll be able to discover new places and things
    by interacting with virtual representations of people, items, and landscapes.
    Alternatively, we will enrich our actual environment in unprecedented ways using
    augmented and mixed reality. It will be possible for us to bridge the gaps in
    our connections using haptic feedback technologies and feel the handshakes and
    embraces of our contacts wherever they are.


    Where is the line between today''s Internet and the Metaverse? Virtual reality,
    augmented reality, and mixed reality are all included in the Metaverse. Statista
    estimates that the combined AR/VR market will be $300 billion by 2024, while Morgan
    Stanley predicts it will be $100 billion by 2030. Does the Metaverse need headsets?
    Virtual platforms like this may open up new avenues for businesses. For example,
    the decentralized service `Decentraland` recently sold a digital piece of land
    to a Canadian investment business for 2.5 million dollars using blockchain. The
    game industry isn''t the only one striving to keep up and gain the newfound popularity.
    For example, Game producer `Activision Blizzard` has made almost $8 billion in
    actual money from the virtual world of `Warcraft`.


    ## Chapter 3: Making Digital Identity in Metaverse

    ### Definition of Digital Identity

    The term "digital identity" refers to an account''s profile information, including
    the user''s master private key. In Metaverse, each Profile has a `DID` (Digital
    Identity, comparable to an alias in `Bit Shares`) that identifies it. Any digital
    identity may apply to be an `Oracle` or an ordinary user and participate in applications
    utilizing their digital identities. Digital identities can play both these roles.
