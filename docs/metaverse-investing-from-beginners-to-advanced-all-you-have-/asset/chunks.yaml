    # 早期工作


    艺术和娱乐技巧一直是艺术家、表演者和娱乐节目人士喜爱的源泉。在虚拟现实出现之前，已经有若干次观众愿意悬疑自己的不信来体验一个虚构的世界。从古代起，人们就在家庭和公共区域建造了幻影空间，并在
    18 世纪末和 19 世纪初的型巨型全景图中达到了顶峰。全景图通过模糊显示主要场景的二维图像与观察这些场景的三维区域之间的视觉边界，创造出一种对所描绘事件的沉浸感。


    为了达到类似的效果，这种视觉传统启发了 20 世纪期间各种媒体的发展——从未来主义剧院设计到立体幻镜投影仪（stereopticons）、3-D 电影，再到
    IMAX 电影院。例如，弗雷德·沃勒（Fred Waller）对视觉和深度感知的研究使他建立了 `Cinerama`，这是一种为 1939 年纽约世博览会开发的宽幕电影格式。在创建沉浸式虚拟世界方面，沃勒的注意力转向了外周视觉的重要性。他的最终目标是创建一个能够复制人类整个外周视觉范围的投影系统。`Vitarama`
    方法利用了多个摄像头、投影仪和一个弧形屏幕，让观众产生一种完全沉浸在他们看到的地方的感觉。为了在世界大战期间进行训练，陆军航空队使用了 `Vitarama`（当时被称为
    `Cinerama`），名为“沃勒灵活射击训练器”（`Waller Flexible Gunnery Trainer`），尽管它直到 1950 年代中期才获得成功。它是娱乐技术与军事模拟之间联系的先驱，这种联系将推动虚拟现实的发展。


    在计算机出现之前，通过感觉刺激创建虚拟世界是一个可能的选择。莫顿·海利格（Morton Heilig）在观看名为《这是 Cinerama》（1952）的宣传短片首映后，被
    3-D 电影和 `Cinerama` 迷住了。像沃勒一样，在研究人类感觉信号和幻觉后，他希望实现“未来的电影”。海利格设计的 `Sensorama 模拟器`
    旨在“刺激个人的感官以真实地模拟现实体验”，他在 20 世纪 60 年代后期制造了它，并于 1962 年获得专利授权。它具有多种输入，包括立体图像、运动椅、音频、温度变化、气味和吹出的空气。`Sensorama`
    还制造了 `Telesphere Mask`，这是一种用于头部的“立体 3-D  显示器”，他在 1960 年对其获得了专利。在 20 世纪 60 年代中期，尽管商业化
    `Sensorama` 的尝试失败了，海利格还是制作了一个名为 `Experience Theater`（体验剧院）的专利技术 `Multiview` 剧院概念，并为华特迪士尼公司制作了一个名为
    `Thrillerama` 的类似系统。


    三维交互计算机图形和车辆/飞行模拟在 20 世纪 50 年代和 60 年代种下了虚拟现实的种子。当由美国空军资助的“旋风项目”（`Project Whirlwind`）及其继者
    `SAGE`（半自动地面环境）预警雷达系统在 20 世纪 40 年代后期开始，阴射线管（`CRT`）屏幕和光笔（最初被称为“光枪”）等输入设备首次被使用。直到
    1957 年 `SAGE` 系统投入使用，空军操作员一直在利用这些设备来显示和修改飞机的位置以及相关信息。


    计算机在 20 世纪 50 年代的流行文化中被描绘为计算机器人、能够以以前无法想象的速度处理数据的电子大脑。随着第二代和第三代晶体管和集成电路计算机变得更加负担得起，视角发生了变化，机器从对计算任务的狭窄关注中解放出来，转而关注计算如何增强人类潜力而非取代人类。


    为了更好地理解人如何与计算机交互，麻省理工学院（MIT）的心理声学教授约瑟夫·利克莱德（Joseph Licklider）在 1960 年提出了“人机共生”的概念。像沃勒一样，在研究人类感觉信号和幻觉后，他希望实现“未来的电影”。为了“刺激个人的感官以真实地模拟现实体验”，海利格的
    `Sensorama 模拟器` 在他在 20 世纪 60 年代后期制造后于 1962 年获得专利。它具有多种输入，包括立体图像、运动椅、音频、温度变化、气味和吹出的空气。`Sensorama`
    还制造了 `Telesphere Mask`，这是一种用于头部的“立体 3-D 显示器”，他在 1960 年对其获得了专利。在 20 世纪 60 年代中期，尽管商业化
    `Sensorama` 的尝试失败了，海利格还是制作了一个名为 `Experience Theater`（体验剧院）的专利技术 `Multiview` 剧院概念，并为华特迪士尼公司制作了一个名为
