    - There is no extra storage for personal transaction records, which are kept on
    the statistical level and contain record information.

    - UTXO details are stored on a statistical level. Therefore, no extra storage
    is needed for this information.

    - Users should provide the height interval for a customized description field
    since it has a lifespan. In order to accommodate varying block heights, this field
    may be altered.

    - When a user enters a string of words into this area, the transaction cost grows
    exponentially with the number of words.

    - More storage is needed.

