    - 博主：占总数的 3%

    - 人口的 1% 是游戏玩家。

    - 这 1% 是留给航天员的。

    - 开发者的占比 4%。


    ## Novatar 项目特性


    如前所述，这些 Novatars 可以在整个元宇宙以及所有社交网络中代表你。Novatars 可以作为访问卡，用于参加几乎任何有组织的活动。因此，欢迎你以你的
    Novatar 身份参加这些活动。Novatar 项目的主要特性如下：


    - 产出的 Novatars 总数不会超过 25,000 个。

    - 一旦铸造，Novatars 将具有新生婴儿的外观，并会立即开始老化（老化过程由用户控制）。

    - 随着它们的成长，会有更多的基因被创建并整合到 Novatar 的外貌或特征中。

    - 由于存在许多基因池，可能会出现非常奇特的 Novatars。

    - Novatar 的性取向无法预先确定。


    Novatar 团队打算在这个方向上走得更远。你的 Novatars 不仅会在网络空间中代表你，在现实世界中也是如此。


    ## 为数字明天奠定基础


    归根结底，NFT 最令人兴奋的方面并不是它们在拍卖行打破了纪录，或者它们让埃隆·马斯克赚取了更多钱。NFT 迷人之处在于，它们能够实现稀缺性、匮乏性和独特性等理念，而这些在以前的虚拟数字未来中是不可能的。几年后，这项技术将成为你虚拟存在的重要部分，所以不必担心当大家发现自己一直在为美化的
    GIF 支付巨额资资时，兴奋的泡沫会破灭。

