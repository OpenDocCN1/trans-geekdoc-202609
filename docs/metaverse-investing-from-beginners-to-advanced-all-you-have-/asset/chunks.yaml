    # Augmented Reality History and Evolution


    * ''Ivan Sutherland'' and his pupil, Bob Sprowle, created the first head-mounted
    display, or ''The Sword of Damocles,'' in 1968, and this was the beginning of
    Augmented Reality technology.

    * Myron Krueger made the next significant advancement in AR in 1974. This concept
    is called ''Video Place'' and combines video cameras with projection technology
    to create shadows on the screen. This setup seems to be in a user-interactive
    space.

    * Boeing researcher Tom Cadell coined the phrase "Augmented Reality" in 1990.

    * ''Virtual Fixtures,'' a system developed by Louis Rosenberg in 1992 at the USAF
    Armstrong Research Lab, was the first operational AR system. The data is kept
    out of the reach of the employees by a robotic system. An early prototype of current
    AR systems may be found in this system.

    * In 1994, the first theatrical play was made to employ AR. Julie Martin''s "Dancing
    in Cyberspace" included acrobats performing in and around computer-generated sets
    and props.

    * In 1999, NASA''s X-38 spacecraft employed the Hybrid Synthetic Vision System,
    an AR-enabled version of their Hybrid Synthetic Vision System. During flight testing,
    AR was used to aid in the development of navigation.

    * When Hirokazu Kato of the NIST, Japan (Nara Institute of Science and Technology)
    was founded and published software with the name ''ARToolKit'' in 2000, a significant
    advance in AR was achieved in the field. To capture real-world activities and
    merge them with virtual objects, this program is needed.

    * Virtual down markers were inserted into NFL games using the Skycom in 2003,
    an excellent tool for overhead views of industries.

    * Esquire Magazine and Robert Downey Jr. began using AR in print media in 2009.
    Readers may see AR material by scanning the magazine''s barcode with their computer
    software. Fortunately, `ARToolKit` made AR available to all web browsers in the
    same year.

    * Volkswagen began using AR in its automobile manuals in 2013. With the `MARTA`
    iPad app, consumers can see the vehicle''s internal functioning and assist service
    technicians in figuring out what''s wrong.

    * A Google Glass with augmented reality (AR) was released to the public in 2014
    by the world''s biggest firm, Google. However, it didn''t do as well as planned
    in the worldwide market. As a result, Google Glasses were discontinued in December
    of last year.

    * When Augmented Reality (AR) first made its way into people''s daily lives via
    video games in 2016, it was a worldwide craze. Pokemon Go, a famous augmented
    reality game, was downloaded by more than 100 million users through app stores.
    The primary goal of this mobile game application is to catch and employ monsters
    to compete against each other in Augmented Reality gyms. In the game, players
    may see their favorite Pokemon bouncing about their city.

    * Using augmented reality, IKEA released `IKEA Place`, revolutionary new software
    that will have a profound impact on how we shop soon. Before making a purchase,
    users may use this app to get an idea of how they want their home to look with
    IKEA furniture.

    * The "Harry Potter: The Hogwarts Mystery" mobile game has once again grown more
    popular throughout the globe in 2018. A Hogwarts-like atmosphere is created around
    the user, and they can cast and learn from Hogwarts professors with the use of
    this app. More than 10 million individuals have already downloaded this app from
    the Google Play Store.

    * In celebration of Manchester City''s 125th anniversary, the club''s stadium
    featured an Augmented Reality installation in 2019. There will be an opportunity
    for audience members to sit close to the Manchester City manager, ''Pep Guardiola,''
    during the news conference. A 3D holographic screen and a 360-degree movie screen
    are also part of the tour, intended to deliver an immersive experience for the
    band''s fans.

