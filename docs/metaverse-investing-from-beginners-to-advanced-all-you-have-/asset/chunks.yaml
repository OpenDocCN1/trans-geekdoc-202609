- fmt: "\n# Getting Started\n\nThe first step is to sign up for a `Spatial` account.\
    \ If you already have a Google, Microsoft, or Slack account, you may use it to\
    \ sign up. You can use an email address to sign up for an account. \n\nOnce you've\
    \ completed the registration process, you'll be asked to choose an avatar. Your\
    \ webcam or a snapshot of yourself from a gadget may be used for this. It'ss essential\
    \ to take a decent image of your face while creating a virtual reality avatar.\
    \ With a neutral expression on your face, look squarely into the camera's lens.\
    \ So, no cheesy grins for the avatar photo. Don't think of the picture you're\
    \ about to post as a selfie while you do it. Instead, think of it as a headshot\
    \ as you would take for a driver's license photograph.\n\nWe can edit our avatar\
    \ any time by selecting `Edit Profile` from the drop-down menu in your account\
    \ profile. Changes to your subscription, `Team`, submitted material, and integrations\
    \ may also be made here.\n\n## Lighting and color\n\nAnother crucial consideration\
    \ is the quality of the lighting. Don't forget to take your avatar picture in\
    \ a well-lit environment. Avatar photos taken in natural light are preferable\
    \ to those born in artificial light. It's also a good idea to stay away from powerful\
    \ lights.\n\nA 3D bespoke VR avatar that looks like you will be created after\
    \ `Spatial` gets a decent photo of the front of your face. The skin tone slider\
    \ and the shirt color picker are also available from this point on, allowing you\
    \ to further modify your Avatar's appearance. Simply click `Looks Good` after\
    \ generating your `Avatar` to close the avatar creator. `Regenerate Avatar` lets\
    \ you start over with a fresh picture if you don't like the one you currently\
    \ have. It's that simple to make a virtual reality avatar. There are no specific\
    \ skills or expensive equipment needed to create a 3D model in a couple of minutes.\n\
    \n## Customizing your Avatar\n\nCreating an avatar that resembles them is a favorite\
    \ pastime for gamers! If we want our avatars to reflect our users' true selves,\
    \ we need to keep enhancing the mechanisms we employ to create them. \n\nFor the\
    \ time being, you may choose between a male or female avatar body and various\
    \ humanoid faces. If you're a hand talker, you can use hand tracking in your VR\
    \ headset to fully live your avatar's vibrance. The digits on your keyboard may\
    \ be used to express various actions or dancing motions, even if you are logged\
    \ in from the web!\n\n## Making Changes to Your Spatial VR Avatar\n\nAt any moment,\
    \ you may modify or update your avatar as well. You may change your appearance\
    \ at any time. It's as simple as opening your `Spatial` account in a web browser\
    \ or using the `Spatial` app to change your avatar. \n\nThe profile is located\
    \ in the upper left corner of the screen while your account is open. Choose the\
    \ appropriate option from the drop-down menu to adjust your avatar's picture,\
    \ skin tone, shirt color, or name from this page. Virtual reality (VR) meetings\
    \ may be improved by using realistic 3D avatars for team members. It seems more\
    \ like a face-to-face encounter and allows for a more intimate exchange.\n\n##\
    \ Avatar Everywhere\n\nEveryone appears to have an online persona. Everyone appears\
    \ to be drifting in and out of digital identities, whether it's their Twitter\
    \ profile picture or playing `Fortnite` with that great skin you acquired last\
    \ season. They're all avatars by definition: from 2D profile pictures on Twitter\
    \ or `Discord` to 3D representations in `VRChat`.\n\n## Different Avatars\n\n\
    An avatar used to be a more particular phrase that meant your 3D depiction of\
    \ yourself in an online environment, but that's no longer the case today.\n\n\
    ### Alteration in the meaning of Avatar\n\nThe cultures of virtual and video game\
    \ worlds differed only in the most minute details, yet there was a distinct difference\
    \ nonetheless: Your 3D depiction was often referred to as your \"toon\" in the\
    \ gaming community. This indicated a separation from yourself and your virtual\
    \ self. A game was essentially a vehicle through which your character drove. Your\
    \ avatar in open worlds was a representation of yourself.\n\nSo \"self\" in this\
    \ context didn't refer to your physical existence or even your real personality\
    \ in the same way that \"self\" refers to your actual self. Even if you were born\
    \ a man, you might portray yourself as a woman to the world. While your physical\
    \ self could be extroverted and friendly, your mental self can be chilly and quiet.\
    \ Identity, personality, and social signaling were all conveyed via the avatar\
    \ you created for yourself. \n\nYour avatar or profile picture (`pdf`) was supposed\
    \ to represent you in 'flat' Internet forums, even if you used various images.\
    \ When you used it in a conversation or on your Facebook page, you didn't give\
    \ it much of an identity of its own; it was just your 'badge,' after all. These\
    \ phrases typically served as an indicator of cultural disparity between people\
    \ from different backgrounds. \n\nIf someone mentioned that they were \"playing\"\
    \ in a virtual world, I recall how outraged people would be about it. As in, \"\
    I like the alias you're adopting.\" To say you didn't realize that you weren't\
    \ playing a game suggested a lack of understanding of the concept of avatar identity.\
    \ Similarly, in gaming environments, you'll see tiny schisms in the population.\
    \ Others saw their avatars as just a way to show off their latest haul of incredible\
    \ weapons and armor rather than an actual representation of who they were as a\
    \ person. People who considered their avatars as a way to explore issues like\
    \ cooperation, identity, lore, and expression took a more \"meta\" approach.\n\
    \n## The Pledge of the 3D Avatar\n\nWe are returning to the 3D avatar as a self-portrait,\
    \ though, for a moment. Considered profound and freeing, this concept was widely\
    \ accepted. You have the right to identify with whatever gender you choose (or\
    \ even any species). Theoretically, this would promote cultural variety. Whether\
    \ avatars are 'post-racial' or not, it depends on how individuals express or expose\
    \ their race. It is possible to separate your online persona from your real-world\
    \ identity.\n\nIn today's internet surroundings, pseudo-anonymity is routinely\
    \ assumed. In a digital environment, you don't have to worry about being \"too\
    \ young\" or \"too old\" or \"less wealthy and handsome\" than your avatar to\
    \ succeed. Virtually everything you do is transmitted via your avatar, even if\
    \ you don't interact with it directly.\n\nThe next step is a little difficult\
    \ to figure out, and perhaps counterintuitive in some ways. A considerable effort\
    \ has been spent on this issue by Philip Rosedale, and I recall extensive discussions\
    \ with him about it back in the day. It's the theory that other people get extremely\
    \ delicate and seemingly undetectable signals in addition to voice or text interaction\
    \ that is 'broadcast' via your avatar. It doesn't make a difference what it takes\
    \ for you to respond to a message or what direction your avatar is looking in\
    \ a virtual world; other people can pick up on a wide variety of emotional indications\
    \ because of this. \n\nPhilip's primary goal was to increase the bandwidth and\
    \ reduce the latency of these transmissions. Facial and body tracking may now\
    \ transfer social and emotional cues straight from your avatar to your actual\
    \ body. Even if there is no direct link between your real body and your avatar,\
    \ other people may tell whether you are upset or preoccupied just by looking at\
    \ your avatar. This intrigues me more than the direct connection between your\
    \ physical body and your avatar. In return, your actual person receives communication\
    \ from your avatar because the other way around is also the case. Furthermore,\
    \ the fact that avatars may have a direct effect on our actual selves is mind-boggling.\
    \ In one idea, mirror neurons were used to suggest that our minds may connect\
    \ to avatars in the same way we interact with our bodies. As a result of my avatar's\
    \ weight, my self-esteem will be affected.\n\n## Today’s Avatar\n\nSeveral pre-Metaverse\
    \ developments may be traced back to avatar-based initiatives. Our understanding\
    \ of the meaning of the term \"self\" and the degree to which we attribute \"\
    selfness\" to our digital identities, as well as their place in broader systems\
    \ and cultures, have all been subject to many reinterpretations throughout history.\
    \ There are a few examples:\n"
