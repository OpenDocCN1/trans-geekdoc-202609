    # 第 4 章：元宇宙与加密货币


    加密货币（也称为 crypto-currency）是一种数字化的数据集合，可以作为双方之间交易的手段。每种硬币的所有权历史都记录在数字账本中，这是一个由强大的加密技术保护的计算机数据库。加密货币没有支持或可转换为加密货币的商品；因此，它们本质上是法币货币。在某些加密系统中，货币由一组“验证者”维护。`Tokens`
    在权益证明方案中用作抵押品。成员根据其投入资金的比例获得代币的控制权。通常，代币质押通过网络费用、新创建代币或其他补偿机制随时间推移获得更多的代币所有权。


    与传统的现金形式不同，加密货币是纯数字化的（与纸币不同），且不受任何中央机构的支持。加密货币并不依赖中央银行的数字货币，而是采用去中心化治理（`CBDC`）。当加密货币在发行前被铸造或由单一发行者发行时，被认为是中心化的。每种加密货币使用分布式账本技术（通常是
    `blockchain`）在与去中心化治理部署时作为公共金融交易数据库运行。


    “加密货币”这一术语与只能在线上交易的数字资产或货币有关。“加密货币”这一术语与使用加密来保护和验证交易有关。根据目前流通的一千多种加密货币的支持者的说法，一个更公平的未来经济可以通过使用这些数字货币来实现。首个去中心化加密货币
    `Bitcoin` 于 2009 年作为开源软件发布。在 `bitcoin` 引入之后，又开发了多种不同的加密货币。


    ## 加密领域的基础技术


    ### 区块链 (Blockchain)

    一种透明的分布式账本，可以以高效、可验证且永久的方法跟踪双方之间的交易。`blockchain` 确保了每种加密货币的铸造是真实的。正如其名，`blockchain`
    是一个由被称为安全链接区块（blocks）的单个文档组成的分布式账本。每个区块中通常包含一个哈希引用、时间戳和交易数据。由于其架构，修改 `blockchain`
    上的数据是不可能的。


    一个遵循验证新区块协议的对点网络管理着 `blockchain` 并作为分布式账本使用。在不修改后续每个区块的情况下，追溯性编辑区块内容是不可能的，而这需要网络大多数的同意。作为具有高拜占庭容性的分布式计算系统，`blockchains`
    的设计之初就是为了安全。通过 `blockchain`，建立了一种去中心化的共识。


    ## 元宇宙与区块链/加密货币的对接


    也许你想象的是虚拟现实中的全球网，但这完全不是元宇宙的样子。这很大程度上是真的；然而，`blockchain` 是元宇宙的关键组件，将使其与今天的互联网区分来。`AOL`、`Yahoo`、`Microsoft`
    和 `Google` 是最早提供 `Web 1.0` 平台的公司之一，允许用户搜索、探索并居住在连接的计算机和服务器网络中。要定义 `Web 2.0`，我们只需关注“免费”社交媒体网站的中心化守门人，他们为了广告目的将用户数据变现。元宇宙将构建在
    `Web 3.0` 平台上。经济将基于用户拥有的加密资产和数据，并由构建在 `blockchain` 上的去中心化应用支持。


    ### 区块链还是去中心化？

    加密资产有什么大不了？元宇宙技术可以通过研究社交媒体和媒体技术的学者来解释。


    ### 比特所有权 (Possession of Bits)

    交易持久地存储在公共账本上，这是一种 `blockchain` 技术。基于 `blockchain` 的加密货币 `Bitcoin` 是最著名的。例如，购买
    `bitcoin` 会记录你在 `Bitcoin blockchain` 上的活动，然后该记录会被传输到全球成千万台计算机作为你交易的证明。试图操纵或破坏这个分布式记录系统几乎是不可能的。


    与传统的银行账不同，公共 `blockchains`（如 `Bitcoin` 和 `Ethereum`）对任何连接互联网的人开放且可访问。与 `Bitcoin`
    不同，`Ethereum` 的 `Blockchain` 可以使用 `smart contracts` 进行编程，这些合约本质上是满足特定条件时自动运行的基于
    `blockchain` 的软件程序。`Blockchain` 上的 `smart contract` 可用于创建数字所有权，例如艺术品或娱乐节目，其他人无法在
    `Blockchain` 上占有它——即使他们将物品的副本保存到自己的计算机上。


    货币、证券和艺术品都是加密资产的例子。现金等价值相等且可以相互交换的同质化物品的对立面是非同质化商品。`blockchain` 上的非同质化币包括艺术品和音乐（`NFTs`）。你必须使用
    `smart contract` 声明你准备好以 100 万 `ether`（`Ethereum blockchain` 的货币）卖出你的数字绘画。当我在
    `Blockchain` 上点击“是”时，艺术品和 `ether` 会立即互相。如果发生分歧，我们任何人都可以简单地链接到分布式账本中的公共记录，证明对方支付了全额。不需要银行或第三方托管。


    ### 区块链加密资产 (Blockchain Crypto-Asset)

    这套 `blockchain crypto-asset` 的鬼话与我们所说的元宇宙毫无关系。完全不是！你可以从拥有 `Blockchain` 上的虚拟产品开始。如果你购买了这个
    `NFT`，你将能够在现实世界和在线上使用它。另一个值得注意的是，并没有一个组织或公司在背后创建元宇宙。由不同组织构建的虚拟世界未来将相互协作并创造元宇宙。在虚拟世界中，个人希望在从一个虚拟世界旅行到另一个时携带他们的物品。只要两个虚拟世界是兼容的，`Blockchain`
    就可以验证两个虚拟世界中的数字商品。`virtual wallet` 是访问虚拟世界中所有加密资产的方式。


    ### 加密钱包 (Crypto Wallet)

    在数字货币钱包中有什么你想要存储的吗？在元宇宙中，可以肯定你会想要拥有加密货币。你的化身、虚拟服装、虚拟装饰和虚拟武器都将存储在 `crypto wallet`
    中。对于 `crypto wallets`，人们将做什么？除了购物，传统的数字物品包括音乐、游戏和软件将可供购买。除了虚拟商品，元宇宙将允许你购买现实世界的商品，以及查看和“持有”你正在考虑的
    3D 副本。`Crypto wallets` 能够连接现实世界的身份，如你的钱包，这可能让购买汽车或房屋等法律交易变得更容易。这意味着不需要记住访问的每个网站和虚拟世界的登录详情——只需点击一下连接你的钱包！如果你的
    `crypto wallet` 已连接，你可能可以将社交网络数据从一个虚拟世界传输到另一个。未来，与钱包的链接可能会决定你是否可以在公领域广播并社交。如果你表现得像一个传播虚假信息的喷子，你就有声誉受损的风险。这些技术可能会在元宇宙中鼓励良良好的行为，但平台开发者将优先考虑这些机制。`Blockchain`
    的去中心化可能会消除交易对中间人的需求；然而，公司仍然有许多创造收入的机会，可能比现有系统更多。`Meta` 旨在为人们提供互动、协作和乐趣的大平台。由于涉及到资金，公司将渴望加入其中。`Dolce
    & Gabbana`、`Coca-Cola`、`Adidas` 和 `Nike` 是加入 `NFT` 热潮的少数知名公司。元宇宙中的连接 `NFT` 可能会获得在现实世界穿着的品牌服装，例如在
    Ariana Grande 的演唱会上。化身的相同服装，同样可以。然而，尽管元宇宙仍在开发中，像 `blockchain` 和加密资产这样的基础正在建立，为即将到来的虚拟未来铺平道路。各种元宇宙模型可能会以各种方式与自然世界交叉。随着增强现实技术变得更加流行，它会将虚拟现实和现实相结合。


    ## 元宇宙与加密货币的关系


    如果 2008 年 Satoshi Nakamoto 预见到 `blockchain` 技术的未来，由 `Blockchain` 实现的去中心化将成为元宇宙中最大的发明呢？如果他看到了
    `Blockchain` 几乎无限可能的未来呢？加密技术将在元宇宙中发挥重要作用。如果使用 `bitcoin` 来去中心化元宇宙，个人将对其数字资产拥有主权，而不是像在寡头市场结构中那样由两个或多个公司控制市场。`Blockchain`
    提供了一个每个人对基于持有的数字世界的决策和地位投票的途径。被称为“元宇宙”的虚拟环境在许多方面与现实世界相似。


    与你的生活紧密结合的虚拟环境以及作为数字资产所有权的 `Bitcoin` 感觉如何？结果是投资得到了巨大的推动。`MANA`、`Gala` 和 `Sandbox`
    这三个著名的加密货币已经看到了超过 200% 的收益，使它们处于历史新高的边缘。在数字世界中，想象从可靠的交易所购买 `USDT`（或其他加密货币）来交易或持有具有类似百分比增长的加密游戏币，以便投资、盈利和娱乐，数字世界反映了你的幻想并允许你在数字仙境中探索梦想和愿望。这有多棒？通过使用加密货币，我们可以为数字世界提供银行通过现实世界的
    `blockchain` 干预提供的机会。“在我看来，主要加密货币可能的角色被低估了，”Aleo 策略副总裁 Sina Kian 说。在类似于“元宇宙”的数字宇宙中，数字货币可以作为双方支付的手段。如前所述，`Blockchain`
    的优势是其去中心化、开放性和速度。`Blockchain` 强大的密码法和加密技术让你在数字领域交易时感到安心。由于每个决定都是单独做出的，你不受中央机构的限制。元宇宙是今天
    2D 互联网的功能性替代品，它有虚拟位置而不是网页，那里一切都是安全的、有利的（且完全去中心化的）。凭借实时执行和确认大量交易的能力，以及加密货币由于其去中心化性质提供的可扩展性，`Blockchain`
    和加密货币已成为元宇宙的关键组件。根据 Aleo 策略与产品开发副总裁 Sina Kian 的说法，对于元宇宙加密货币是一个本质要素，因为它允许人们拥有自己的数字资产，这种所有权为人们投资创造了激励。另一方面，Kian
    说，元宇宙最大的危险是由于寡头垄断的风险，重新创造了数字垄断威胁。“加密货币提供是对那种社会的可行方案，其中所有权更加去中心化，”Kian 补充道。全球加密金融公司创始人兼
    CEO Phillippe Bekhazi 同意这一评估，并告诉 `GOBankingRates` 相信加密货币已准备好在元宇宙中发挥巨大作用。`NFTs`
    和社交代币（如 `NFTs` 和社交货币）等新技术可用于多种目的，包括影响者及其粉丝参加虚拟演唱会。


