    # Sandbox


    A few of them are described below:


    ### Sandbox

    It was published on May 15th, 2012, by Pixowl as a sandbox game for iOS and Android
    devices and Windows PCs. On June 29th, 2015, it was made available on Steam for
    PC users. The reference for this statement is not available. A blockchain-based
    3D open-world game is named after the brand that Animoca Brands purchased in 2018.


    ### Blockchain Version

    Founded by Pixowl, `The Sandbox` is a virtualization technology where users can
    create, build, acquire, and digital exchange assets in the form of a game. For
    a decentralized platform for a healthy gaming community, `The Sandbox` combines
    the power of decentralized autonomous organizations (`DAO`) with non-fungible
    tokens (`NFTs`). As stated in the official `Whitepaper`, `The Sandbox` aims to
    effectively incorporate blockchain technology into mainstream gaming. Play-to-earn
    models are encouraged on the platform, allowing gamers and developers to work
    together. The `SAND` utility token, introduced by `The Sandbox`, uses blockchain
    technology to simplify transactions on the network.


    ### Founders Of Sandbox

    The major motivating factor behind `The Sandbox` is Pixowl''s Arthur Madrid, who
    is also the company''s co-founder and CEO. In 2000, he earned his economics degree
    from the `Université Paris Dauphine`. He started his work as a consultant at `Eurogroup
    Consulting France` but quickly discovered his entrepreneurial drive. He started
    `1-Click Media` in 2001, which Ipercast eventually acquired. Pixowl''s COO, Sebastien
    Borget, is also one of the company''s co-founders. He graduated from the `Institut
    national des Télécommunications` in 2007 with a degree in computer systems networking
    and telecommunications. Arthur Madrid started his career as a project manager
    at `1-Click Media`, and he and Sebastien Borget have subsequently formed an entrepreneurial
    partnership. They started `Pixowl` together in 2011 and have been working on a
    variety of projects since.


    ### Uniqueness

    `The Sandbox` integrates blockchain technology into gaming, making it a unique
    platform. There is a tremendous untapped potential for blockchain adoption in
    the game sector, Pixowl realized this in 2011. `The Sandbox` intends to change
    the industry by providing a platform for players to build and gather blockchain-based
    goods. As a reason, it has earned itself a distinctive position in the global
    gaming sector. `The Sandbox` establishes a metaverse of players who actively contribute
    to the platform''s growth by concentrating on user-generated content. In addition,
    `The Sandbox` encourages decentralized governance by introducing the `SAND` token,
    which enables people to submit their thoughts and opinions concerning the progress
    of the project. Decentralized governance is becoming a need in blockchain-based
    initiatives because of the advancements in technology. Numerous big-name gaming
    companies supported and invested in the startup while just getting off the ground.
    Brands like Atari, Helix, and Crypto Kitties come to mind.


    ### Sand coins in Regulation

    The total number of `SAND` tokens that may be created is 3,000,000,000. As of
    March 2021, there are 680,266,194 `SAND` tokens in circulation, which is 23 percent
    of the total supply. A quarter of the entire token supply was earmarked for a
    corporation reserve. A further 17.18 percent was set aside for the token''s seed
    sale. Of the overall token supply, founders and team members received around a
    third of it. A little over 12% of the entire supply was reserved for the `Binance
    Launchpad`.


    How is the Sandbox Network Secured?

    `The Sandbox` virtual world is protected by the proof-of-stake (`PoS`) consensus
    process since it is based on the `Ethereum` blockchain. `SAND` tokens are `ERC-20`
    tokens, which implies that they may be staked and rewarded for doing so. `PoS`
    does not need a large amount of computational or electrical power to validate
    transactions, unlike the Proof of Work (`PoW`) consensus technique used by the
    Bitcoin network. Many different uses may be made of `PoS` method without compromising
    the safety of staked assets.


    Where can you buy the Sand coins?

    `SAND` token trading is now available on a growing number of platforms, thanks
    to increased interest from investors and users. The trading volume of `SAND/BUSD`
    on `Binance` has thus far $7,015,941 as of March 2021. `Uniswap (V2)`, `Gate.io`,
    and `LATOKEN` are more methods for purchasing `SAND`.


    ### Tokens Economy

    The token of `The Sandbox` features five types of Tokens; namely:

    - `LAND` (`ERC-721`)

    - `SAND` (`ERC-20`)

    - `ASSET` (`ERC-1155`)

    - `GEM` (`ERC-20`)

    - `CATALYST` (`ERC-20`)


    ### Land in the Sandbox

    `The Sandbox` metaverse''s `ERC-721` NFT token, `LAND` in `The Sandbox`, provides
    its holder''s ownership rights to a 9696-meter plot of virtual land. `LAND` owners
    may employ `ASSETs` to create unique experiences that visitors can enjoy. Only
    166,464 pieces of `LAND` are currently available in `The Sandbox`. As a result,
    `LAND` is one of `The Sandbox`s most elusive NFTs.


    The distribution of land in the world:

    1. A total of 123,840 `LANDS` (or 74% of the total) are up for grabs.

    2. The `Reserve` will consist of 25,920 `LANDS` (or around 16 percent) and be
    dispersed as incentives to partners, developers, and players.

    3. `The Sandbox` will retain ownership of 16,704 `LANDS` (about 10%). For special
    occasions, they will include unique games and `ASSETS`.

