    # Chapter 6: Investing in the Metaverse


    "Snow Crash" was authored by `Neal Stephenson` in 1992 and was his third book.
    The Metaverse is the name Stephenson gave to his virtual world. To put it another
    way: The digital world in which Stephenson''s characters live is just as dynamic
    and full of possibilities for character development as the actual one. Public
    enterprises like `Meta` (previously `Facebook`) and decentralized autonomous organizations
    (`DAOs`) like the `Decentraland Foundation` are still attempting to make the Metaverse
    a lucrative reality twenty-eight years after it was first proposed. Gaming, digital
    collectors, and developers have found new business streams as a result.


    To be clear, though, the Metaverse is still at an early stage of development,
    and its value proposition has not yet been demonstrated. Investing in the Metaverse
    should always be seen as speculative and very dangerous because of the tremendous
    degree of uncertainty involved.


    ## The Metaverse Market Opportunity


    By 2025, virtual games are expected to produce revenues of up to $400 billion,
    up from an anticipated $180 billion in 2020. The continuing growth of monetization
    by game creators is a crucial component in this trend. Free-to-play games are
    becoming more popular among gamers since they allow creators to monetize their
    virtual worlds by selling users stuff, land, etc.


    There was a significant change from closed metaverses (i.e., those controlled
    by the `Web`''s big players) to open cryptographic ones between `web 2.0` and
    `web 3.0` (i.e., democratically owned and managed by users). There is no way for
    gamers to make money in a `Web 2.0` environment. To prevent players from transferring
    their virtual riches to the real world, game creators prevent them from exchanging
    stuff with other players.


    By removing the capital constraints imposed by `Web 2.0` platforms, `Web 3.0`
    open crypto metaverse networks alleviate this issue. These `NFTs` may be traded
    in-game with other players and transported to different digital experiences, allowing
    for the creation of a new Internet economy that can be monetized outside of the
    virtual environment. Open ecosystems and the surrender of some of their competitive
    advantages are consequently a must for established `Web 2.0` firms like `Facebook`.
    A trillion dollars in advertising, social commerce, digital events, hardware,
    and developer/creator monetization might be generated in the Metaverse.


    ## Investments in Digital Assets


    A virtual world creates virtual investing possibilities. There has been a meteoric
    indicator of the strength of digital real estate. Funds obtained by `Republic
    Real Estate` to acquire troubled real estate in the actual world are also available
    to investors looking to buy virtual property. Virtual hotels, shops, and other
    businesses will be built on plots purchased across numerous "metaverses" to increase
    their value among `bitcoin` enthusiasts.


    `NFT` art is now one of the year''s most popular digital assets. `Bain and Co.`
    partner `Thomas Olsen` recently predicted that all assets would be tokenized in
    the next 20 or 30 years. Cryptocurrency experimenters are building a digital asset
    platform that will house "all stocks and all bonds," he claimed.


    Online-Only Shopping and Experiences: As long as businesses have their way, online
    purchasing will only get complicated. Already, they are raking in millions of
    dollars from the sale of metaverse-exclusive clothes and accessories. If you spend
    a lot of time on social media, your online image may become more critical than
    it is today. So, it''s crucial to maintain tabs on how and why `avatars` of various
    racial and gender identities are priced online. Unevenness is emerging, and it
    might have catastrophic consequences.


    ## Metaverse Stocks


    Investing in publicly listed firms whose business strategies or profitability
    are related to the Metaverse is the least volatile alternative for ordinary investors
    who want to get into the Metaverse. The following are included:


    - **Meta Platforms Inc (NASDAQ: FB)**: Previously known as `Facebook Inc.`, `Mark
    Zuckerberg` announced the company''s renaming to `Meta Platforms Inc.` in October.
    Since its introduction, `Horizon Worlds`, `Meta`''s virtual reality metaverse
    platform, has been launched. The `Oculus Quest 2` VR headset from `Meta` was one
    of the most popular Christmas presents. Even if more people buy headsets, it isn''t
    clear whether more people will utilize `Horizon Worlds`.

    - **Roblox (NYSE: RBLX)**: Using `Roblox`, players can build and share virtual
    environments with other `Roblox` members. With 9.5 million creators, 24 million
    digital experiences, and 49.4 million daily active users – an increase of 35 percent
    year-over-year – `Roblox` has been a massive success since its debut in 2006.
    Despite these figures, the firm has yet to make a profit.

    - **Boeing (NYSE: BA)**: Expanding and improving manufacturing capacities are
    two of `Boeing`''s goals in the Metaverse. In an interview, `Boeing`''s top engineer,
    `Greg Hyslop`, told `Reuters` that the company plans to develop a private digital
    environment where its human, computer, and robot workers can interact and cooperate
    without interruption anywhere on the globe.

    - **Microsoft (NASDAQ: MSFT)**: `Microsoft` is looking for a place in the professional
    sector for its Metaverse. According to the company''s schedule, `Microsoft Teams
    Mesh` will be available in 2022. People will be able to create their 3D holographic
    `avatars` and work together regardless of where they are in the world with the
    help of this add-on for the popular video conferencing platform. Users will access
    the previously stated digital world via `Microsoft Mesh` using a virtual reality
    headset. Team members see and engage with the user as if they were really in the
    room with them.


    ## Metaverse real estate


    `NFTs` (non-fungible tokens), digital assets on blockchain networks that may represent
    a wide variety of unique things, are already being sold on platforms like `The
    Sandbox` and `Decentraland`, even if the Metaverse is still in its infancy. The
    blockchain network that powers the metaverse platform validates the sale and transfer
    of ownership when buying a piece of metaverse real estate. The metaverse real
    estate `NFT` owner may rent, sell, or construct on his digital property after
    he has acquired it.


    After purchasing 20 virtual plots of land in `Decentraland`, the Japanese video
    game company `Atari` has opened a crypto casino. Gamers may wager and collect
    their winnings tax-free using the `Atari` token based on the `ERC20` standard.
    As of 2022, `Atari` intends to create a virtual hotel complex of its own.


    ## How Can You Invest in the Metaverse?


    You might like to keep a closer eye on these options if you''re looking for some
    of the best early stock choices in the Metaverse.


    - Metaverse retail, it''s possible, you could think. "Will `Amazon` be the next
    `Amazon`?" I don''t know. However, there may be money to be made for a firm that
    provides a tremendous virtual shopping experience for real-world items. It''s
    also worth noting that the `Walmart` VR shopping video that went popular in 2017
    was initially made in 2016!

    - Already, fashion and style firms are laying claim to their territories. `Nike
    (NKE)` has made several patent applications to make it the dominant player in
    virtual footwear and clothes in the Metaverse.

    - Next-generation VR headsets and other equipment are on the horizon. `Oculus
    Quest`, `Sony`''s `PSVR`, and `HP`''s `Reverb` are current players with inexpensive,
    consumer-focused headsets. IT corporations will develop the next generation of
    metaverse accessories.

    - If the Metaverse ever comes to fruition, no matter who is in charge of its creation
    or what shape it takes, we can all agree that it would need massive amounts of
    processing power. As a result, companies including `Amazon Web Services (AWS)`
    and `Microsoft Azure (Azure)` may have possibilities.

    - `Nvidia`, for example, is a company that makes the high-performance silicon
    required to run these servers.

    '
