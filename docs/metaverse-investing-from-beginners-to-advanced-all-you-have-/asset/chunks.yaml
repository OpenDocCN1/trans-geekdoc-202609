    # 引言


    人类一直对技术感到惊叹。人工智能、量子计算、核能、虚拟现实和增强现实的目前进展，对于一个生活在石器时代的人来说将是无法想象的。尽管如此，技术进步通常会提前几十年被预测，这仅仅是因为很难预测一切将如何结合在一起。这在虚拟现实（`VR`）、增强现实（`AR`）和元宇宙中也是如此。


    虚拟现实（`VR`）最早于 1838 年，但直到世界的视觉和处理能力（截至今天）赶上之后，它才具有可行性。20 世纪 70 年代，“元宇宙”的概念就已经存在，尽管在当时它仅仅被视为互联网的想象继者或发展形式。一旦
    Facebook 改名为 `Meta`，人们才开始谈论“元宇宙”，但没有人理解它的含义。长期以来，人们对互联网和其他技术将如何变化存在着许多假设。在讨论互联网的发展时，我们经常提到
    `Web1`、`Web2`、`Web3` 等。现在我们正在谈论元宇宙。


    尽管如此，让我们考虑一种不同的场景。想象你可以在虚拟环境中设计你理想的化身，你对你角色外观的每个元素都有完全的控制权。你的选择几乎是无限的，所以不要害怕追求你想要的。在各种科幻电影和电视节目中曾描述过这种的情况。由于商业界的很大热度，“元宇宙”可能很快就会变成现实。


    然而，关于 `Web3` 的定义以及元宇宙与其他概念的区别存在许多争论。其他人建议，在 `Web2` 之后，我们将见证向“元宇宙”风格的沉浸式互联网的飞跃，被称为
    `Web 3.0`，一些人认为这是互联网的下一个阶段。然而，关于 `Web3` 究竟是加密和区块链，还是带有虚拟世界的沉浸式互联网的争论将在未来一段时间内持续。


    尽管“元宇宙”一词最近才成为一个热词，但 `Tim Berners-Lee` 因在 1989 年发明万维网而闻名于世。“元宇宙”一词是由科幻作家 `Neal
    Stephenson` 在 1992 年创造的，用于描述 3D 虚拟领域。增强现实（`AR`）、混合现实、加密货币和互联网将在 2022 年构建元宇宙。自从
    `Philip Rosedale` 的“第二人生”在线虚拟世界发布已有 30 年，而 `Mark Zuckerberg` 的“Meta”（此前为 `Facebook`）元宇宙概念已于
    2020 年发布。


    那是 1962 年，电视观众领略了未来可能的景象。在一个拥有飞行飞行器、智能家居、自动化劳动力、虚拟现实和一系列创新生活解决方案的未来特大都市中，美国广播公司（`ABC`）播放了一部关于一个家庭的情景剧。《无敌一家》在
    60 年后似乎在过着普通的生活。


    除了我们的日常生活，技术已成为我们所做的每一个选择中不可缺的元素。一个更美好的未来，或者可能是互联网的潜在继者——元宇宙——早在 20 世纪 80 年代初就被几位工程师预见到。人们认为元宇宙将改变数字和物理世界，包括所有连接的服务。游戏和通信领域的发明者希望元宇宙能够彻底改变数字和物理服务的功能。这意味着它可能在所有这些维度上对社会产生巨大影响。由于
    `Epic Games` 和 `Facebook` 等公司表现出兴趣，当我们等待元宇宙存在的更具体的证据时，我们可以保持某种乐观。随着在 `Roblox`、`Fortnite`
    和《动物森友林》等游戏中实施元宇宙元素，向一个似乎在几十年后的现实迈出了巨大一步。


    ## 含义


    两个单词“meta-”和“verse”组成了“metaverse”一词，是这两个者的结合。前缀“meta”在希腊语中意思是“超越”，而“verse”源于拉丁语“universe”。`Neal
    Stephenson` 的作品《雪崩》是文学中首次使用该词。书中，元宇宙被描述为一种虚拟现实的形式，其中每个在线联系都可能直接影响现实世界，它被视为互联网的后续发展。书中对元宇宙进行了很好的总结。这项活动将让你了解“元宇宙”这个词可能有多么模糊和令人困惑。在句子中将“元宇宙”替换为“网络空间”。在大多数情况下，其意图基本保持不变。我们现在以许多方式使用技术；因此，“交互设计”一词与任何特定形式的解决方案解决方案都没有关系。即使它以前定义的定义变得更加普及，“智能手机”这个名称也可能过时。


    元宇宙是一个高度扩展的、永久的虚拟世界网络，个人可以在其中工作、社交、交易、游戏甚至创造。`AR`、`VR`、触觉传感器和其他尖端虚拟化技术被用来使用户完全沉浸在虚拟环境中。结果，用户可以与一个随时可用的世界进行实时通信。“元宇宙”的支持者认为，在理想的未来，将有一个单一的平台，你可以通过这个平台访问各种世界，每个世界都有自己的个性、身份和平台服务。有许多子世界供选择，允许你加入、退出甚至构建你自己的世界，以在虚拟环境中实现功能完备的经济，但对数字身份、数字货币以及数字资产（如虚拟货币）的通用传输仍然需要定义。


    从这个意义上说，元宇宙可能会取代旅游运作的许多部分。元宇宙在虚拟环境中仍然需要一个一个对数字身份、数字货币以及数字资产（如虚拟货币）的通用传输定义。


    ## 定义


    两个词“meta-”和“verse”组成了“metaverse”一词，是这两个词的结合。前缀“meta”在希腊语中意思是“超越”，而“verse”源于拉丁语“universe”。简单来说，“元宇宙”是指一个存在于现实之上的数字领域。作为一个合成词，“metaverse”源于两个词“verse”和“meta”，意思是“超越”。更简单地说，“元宇宙”指的是一个扩展到我们自身之上的数字领域。在最简单的定义下，元宇宙是一个用户可以通过互联网访问的共享虚拟世界。


    在元宇宙中，化身可能被用于彼此以及与软件互动。元宇宙融合了社交网络、`AR`、`VR`、在线游戏和加密货币来创造一个人们可以参与的虚拟世界。在最简单的定义下，元宇宙是一个用户可以通过互联网访问的共享虚拟世界。虚拟现实（`VR`）技术、增强现实（`AR`）和
    3D 虚拟环境将全部用于产生这种存在感。这将是使用虚拟世界在全球范围内连接人们的一个重大飞跃。用户将使用单一浏览器查看各种网站。他的科幻小说《雪崩》中的想法。元宇宙最初被认为是科幻小说，但现在似乎很快就会变成现实。用户将使用增强现实（`AR`）进入一个化身或角色。例如，你可能会使用
    `Oculus` 头显在工作中进行混合现实会议，然后在下班后休息和游戏。元宇宙的一些特征可能已经在视频游戏中发现了。像《第二人生》和《Fortnite》这样的在线世界以及像
    `Gather` 这样的程序让我们在生活的许多方面社交。它并不完全像这些程序，但它是某种近似。元宇宙目前不存在。此外，元宇宙将包括数字身份、去中心化政府和其他各种功能。用户创建和拥有的资产有助于建立一个单一的、统一的今天。由于这些属性和能力，区块链可以推动这种未来技术。元宇宙中将有很多化身。在虚拟或计算机介的世界中，化身是一个人的形象、化身或表现。各种样式都是可能的，包括增强用户在物理和数字领域自我感的“类表示”。由于各种原因构建和使用各种化身，例如游戏玩家化身、专业化身、社交/家庭化身等。用户将在元宇宙中使用建立和管理社交账户。通过连接的区域和网站的网络，化身可能会计划和执行有计划的有目的活动。个人和化身通过沉浸在新的环境中随着时间的推移产生预期和体验，他们有助于创建独特的环境和程序。


    ## 元宇宙如何运作


    执行官 `Mark Zuckerberg` 和其他人将元宇宙描述为将我们的虚拟和现实生活拉近的“机会”。正如 Zuckerberg 在 10 月的一次关于元宇宙的演讲中所说，“无论我们有多远，我们都能以完全愉快、真正沉浸的方式表达自己。”`AR`
    和 `VR` 将用于构建一个更具沉浸感的互联网，我们在虚拟场所和体验上的花费比现实世界更多。它最初用于 `Neal Stephenson` 1992 年的科幻小说《雪崩》，但现在
    Zuckerberg 和其他行业领导者想要让它现实。


    `Matthew Ball` 这样引入元宇宙：“目前，互联网本质是一种‘推送’媒介。”在被‘推送’信息（例如通过电子邮件或通知）后，你打开你的设备并查看它。Ball
    说，元宇宙是你已经“身处其中”而不是去“寻找”的“具身引擎”。这意味着在现实世界的意义上，我们将脱离实际环境，例如办公室或客厅。相反，我们将戴上 `VR`
    头显或其他类型的虚拟现实头显。在虚拟上改变你的环境甚至你的物理外貌可能会积极影响你对自我的感受。它也可能被视为一种乌托邦的想法，仿佛元宇宙是留给那些想要逃避现实世界残酷现实的人的（这是在小说《雪崩》中构想的）。然而，目前对元宇宙的任何讨论纯属推测性的。如果你问
    `Facebook`，他们会告诉你它还是一个婴儿。即使它还没有“完全存在”，`Facebook` 售价 299 美元的 `Oculus Quest 2` 头显也大幅降低了
    `VR` 设备的门槛，正如其创始人兼执行官所述。`HP Reverb G2` 售价 450 美元，而 `HTC Vive` 超过 600 美元。


    在这个始终开启的环境网络中，许多人可以使用被称为化身的自己的虚拟版本，与彼此以及数字物品进行互动。将虚拟现实、大型多人角色扮演游戏和互联网整合为一种无缝的体验。在计算机领域，元宇宙是一个许多人构想为替代当前互联网的科幻概念。`Facebook`
    和其他公司将其视为从工作到教育和零售的各种活动的中心。由于这个原因，`Facebook` 正在更名为 `Meta`。


