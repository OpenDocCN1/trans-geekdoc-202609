    # 数字身份的本质


    并不存在两个“元宇宙数字身份”。计划在协议中包含一个身份模块，并在此基础上创建更多应用程序。自主身份意味着用户控制自己的身份识别数据，不需要依赖第三方或中央权威来验证其身份。用户的声明（User
    claims）可以使用完全自主的身份进行签名和验证，而与用户交互的其他人员将验证其身份。用户还将选择公开哪些关于自己的信息。一个人的数字身份在虚拟世界中可能以多种形式存在，包括价值中间人（机构和实体）。一个人可能根据情况拥有多个数字身份（例如工作身份和个人身份）。尽管如此，它们最终都源于用户的真实世界身份
    ![](img/image_rsrc1JZ.jpg)


    在 Facebook 最近宣布品牌重塑后，引发了许多人的好奇：“什么是元宇宙？” 就像《星际迷航：下一代》中的全息甲板一样，人们可以将元宇宙想象为对现实或虚拟设置的沉浸式数字描述。传统的控制台和
    PC 游戏可以很容易过渡到增强现实和虚拟现实。在许多游戏中，任务和目标必须按照特定顺序完成，即兴的空间极小。像第一人称射击和角色扮演游戏等沉浸式游戏在游戏世界提供了更大的自由，但你的视野是受的。在元宇宙中，你获得的可能性是无限的。目前的计算能力不足以让所有人同时感兴趣并运行，因此它从一开始就不会是完全的虚拟现实。然而，简而言之，元宇宙将是一个个人可以互动、连接并成为一部分的沉浸式平台。就像没有单一的网站或国家一样，也不会有单一元宇宙。主题性的元宇宙是可能的。元宇宙可以相互关联，你可以在它们之间移动。学校、学院或大学可能是一个元宇宙。我们甚至可能拥有一个超级宇宙（Megaverse），它是互操作元宇宙的集合，你可以像使用网页浏览器一样在它们之间跳转。每个人都可以舒适地在家参与元宇宙。这将是我们我们在互联网上见过的最集成、最沉浸的体验。


    数字身份处于元宇宙的前沿，在那里你将能够构建并居住一个可以移动和做事的数字版本的自我。与其依赖人性的信任根（Root of Trust），数字身份依赖于加密的信任根。只要我们处理的是现实世界，我就放心地信任你。这些关键元素在互联网上是缺失的。在任何时候，你都不知道与你交谈的人是否真实。当我看到你在线时，我采取一种跳跃式的信任，相信你就是你所声称的那样。这引发了欺诈的阴影。通过基于领先技术和协议的数字加密凭证来增强人类信任，是解决这个问题的答案。为我们的聊天、社交媒体、消息应用程序以及我们在网上进行的所有其他活动增加一层保护层，这就像扩展由数字加密凭证增强的人类信任一样简单。


    自诞生以来，元宇宙理应得到它应有的尊重。我在元宇宙中是 David Lucatch 的事实并不意味着当你遇到我的化身（persona）时需要知道这一点。你只需要知道我的化身基于真实的个人身份就足够了。一个人的身份并非重点，而是访问系统的能力。再次，这归根于保护你的安全、Security
    和隐私。明确的是，为一家专门从事此类数字身份管理的公司工作。在今天，你无法走进一家商店就说“我忘了钱包了”。抱歉。请在这里记下我的信用卡信息、过期日期和安全码。现在，请交出电视。”然而，在互联网上情况似乎如此。假设有人经营一家在线商店。当他与经过身份验证数字身份的人合作时，他知道自己正在与真实的人打交道——验证该人的真实性可以减少每次在线遇到时发生的欺诈和识别风险。


    我们还没有习惯元宇宙所提供的参与度。如果我们知道数字身份技术已经存在并从零开始会怎样？我们居住的两个世界之一是数字世界，在那里我们可以成为任何人，甚至可以放大或加速我们的优势和天赋。我们已经看到了带有抬头显示（HUD）的眼镜，以及带有此类功能的眼镜。尽管虚拟世界仍处于婴儿阶段，但它已经开始生根。没有人知道未来十年或二十年它会什么样。这些新体验和技术的承诺可能会比过去
    50 年或 100 年的任何技术都加速得更快。因此，对于企业和个人来说，像在现实世界中一样，理解他们在元宇宙中交往的对象是谁至关重要。


    ## 数字身份创建的操作流程


    只要你拥有主私钥，你就可以构建数字身份并将其链接到你的账户。即使用户建立了身份情况也是如此。未链接到任何主私钥的数字身份被视为未经验过的，不能用于任何数字身份功能或应用程序。如果你已经使用主私钥在元宇宙区块链上注册了资产，你就不需要为它附带数字身份。元宇宙不会为每个用户自动生成数字身份；用户必须努力将他们的密钥附加到其数字身份中。主私钥持有者有权绑定
    `DID`。验证配置文件（Verification Profiles）可用于创建有效的证据链，这些链包含了关于个人在线化身的客观信息。为了证明数字身份属于某个用户，用户必须首先链接
    `DID`。


    ### 授权


    在提供任何服务之前，获得事先同意是必要的。假设 `A` 寻求 `B` 的身份信息（资产信息）。有两种情况：1000 个 `ETP` 或更多的链上资产由 `B`
    持有。与 `A` 相，`B` 拥有大量的离链资产。通常在 `B` 继续之前，他必须将其资产传输到 `ETP`。根据元宇宙目前的建议，拥有数字资产的最佳方法是在区块链上注册它们，并由预言机（Oracle）进行验证。`DID`
    标识符可作为交易市场的主要实体，它们可以在市场中生成交易。数字身份建立的这种概念。在交易市场输入 `DID` 允许我们看到当前的请求和之前的交易。


    ### 化身 (Avatars)


    化身代表在线身份。个人是在网上所做的一切的核心。一旦数据链接到特定个人，在 YouTube 上观看或在 Google 上搜索时就是合理的。直到最近，电子邮件地址或
    Facebook 账户用于连接所有点。Google、Amazon 和 Apple 是世界上最领先的技术公司，出于某种原因。加密钱包在决定我们在 Web 3.0
