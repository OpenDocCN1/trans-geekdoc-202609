    # 投资策略


    什么是投资策略？长期、短期、退休年龄、感兴趣的行业、预期收益、风险水平以及其他因素，都是制定投资策略决策过程中的考虑因素。投资者可以根据自己的目标量定制投资策略。


    ## 投资策略的类型


    ![](img/image_rsrc1K0.jpg)


    ### 被动策略与主动策略

    被动策略要求长期持有股票，而不是频繁买卖，以保持低交易成本。被动策略风险较低，因为他们认为由于市场的波动性，自己无法战胜市场。另一方面，动态策略需要大量的买卖。在他们眼中，市场被高估了，他们可以获得比普通投资者更高的回报。


    ### 增长型投资（短期和长期投资）

    投资者需要决定他们想在股市中持有资金多久。只要投资者认为某公司将繁荣，且其股票的内在价值将会提高，他们就会投入资金以增加整体财富。增长型投资是这类投资的另一种说法。另一方面，如果投资者认为某公司在一两年内将物有所值，他们会倾向于短期持有。持有资金多久也取决于投资者的决定。例如，他们何时需要钱来买房、送孩子上学或为退休做准备？


    ### 价值投资

    具有高内在价值的公司是投资的理想选择，因为市场低估了它们。通过这种策略，投资者赌注当市场进行随后的调整时，被低估的公司价值将得到修正，导致股价飙升，并在他们决定出售时获得巨额利润。知名投资者沃伦·巴菲就采用了这种策略。


    ### 收益型投资

    这种方法并不是投资于增加投资组合价值的公司，而是专注于从投资中创造稳定的现金流。投资可以提供两种形式的现金收入：股息和债券的固定利。寻求资产持续收益的投资者偏于这种技术。


    ### 股息增长型投资

    采用这种方法的投资者寻找每年都有派息记录的公司。投资者会将这些股息进行再投资，从长期复利中受益。逐年增加股息派发的公司由于其派息历史，比其他公司更稳定、波动更小。


    ### 反向投资

    投资者可以在市场低迷时通过购买他们青睐公司的股票来利用这种技术。这种方法专注于寻找廉价机会然后转售获利。股市的大多数下跌发生在经济不确定的时期（如衰退、战争和自然灾害）。有时投资者可以通过购买股票来利用公司的低迷期。投资者应该寻找那些能够提供价值并拥有强大品牌的组织，这使得他们的竞争对手很难对其占据优势。


    ### 指数投资

    投资者可以使用这种方法在市场指数中投资适量的投资组合。共同基金、`ETFs` 和 `S&P 500` 都是这些例子。


    ## 投资建议

    对于刚起步的人，在进行首次投资之前需要记住的一些要点。


    ### 设定目标

    决定你在未来几个月或几年内需要多少钱。在做出任何决定之前，确保你了解哪种投资最适合你，以及你可以预期获得多少回报。


    ### 研究与趋势分析

    通过对股市及其许多工具（股票、债券、期权、衍生品、共同基金等）进行研究来做好准备。同时，密切关注你决定资金的股票的价格和收益模式。


    ### 最佳顾问/咨询公司

    确保你与信誉良好的咨询公司或经纪人合作。他们将帮助你决定在哪里以及如何投资以实现你的财务目标。


    ### 风险承受能力

    注意你实现目标所接受的危险水平。你的短期和长期目标在这里也会发挥作用。如果你想在更短的时间获得更高的回报，风险就会更大，反之亦然。


    ### 风险多元化

    通过结合债务、股权和衍生品创建一个多元化的投资组合。这两种证券不应该是完全关联的。


    ### 被动与主动投资策略概述

    被动和主动投资是让资金在市场发挥作用的两种不同方式。在基准方面，主动和被动投资都试图优于 `S&P 500`，但主动投资试图击败模型，而被动投资旨在复制模型。由于投资者和财富经理通常更倾向于其中一种，任何关于主动与被动投资的讨论都可能迅速演变成激烈的分歧。即使被动投资更受欢迎，主动投资的优势也是不容忽视的。


    *   投资组合经理或其他“主动参与者”必须在投资过程中发挥主动作用，才能被视为“主动的”。

    *   被动投资意味着购买指数基金或其他共同基金，而不是单只股票或债券。

    *   尽管两者都有优点，但被动投资吸引了比主动投资更大量的资金流。

    *   从历史来看，主动投资策略产生的收益比被动投资高。

    *   近年来，主动投资的普及程度比记忆中的任何时候都要高。


