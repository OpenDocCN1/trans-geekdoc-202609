    # 元宇宙中的工作与社会未来


    在科技领域，热点词汇层出不穷。然而，其中一些词汇会留存下来。“元宇宙”（Metaverse）是一个新术语，它将长久存在。元宇宙究竟是什么？它描述了一种未来，在未来中，我们的日常活动超越了单一现实的限制，进入增强现实和虚拟现实领域。虚拟现实、增强现实以及其他尖端数字仿真一直以来都被纳入这一概念之中。


    当 `Mark Zuckerberg` 在今年早些时候勾勒他对 `Facebook` 长期战略的愿景时，这是一个大胆的愿景。他设想社交网络将成为下一级数字和虚拟体验的供应商，而不仅仅是一个关联的社交应用家族。`Ball`
    一位风险投资者在 2020 年 1 月写了一篇文章试图定义元宇宙。互操作性——即允许用户从一个平台或元宇宙到另一个平台使用他们的角色和物品——也被列在这些特性列表中，该列表包含了现实世界和虚拟世界。考虑到如果有一件事是真的，那么许多消费者可能已经体验了它的许多组件，那么元宇宙是最接近实现的科幻构想。那么，如果元宇宙成为常态，我们对未来可以期待什么？


    ## 元宇宙经济


    加密货币和数字货币预计将成为元宇宙的主要交易手段，因为它有自己的经济体系。随着新货币的定期产生，数字货币的数量预计将增长。无论如何，这些数字货币对于跨境贸易将至关重要，并将受到
    `blockchain` 等尖端技术的支持和传播。


    像 `Epic`（热门视频游戏 `Fortnite` 的制作商）这样的公司是这种新经济早期采用者。该游戏通过建立一个引入胜且真实的环境，从根本上重新想象了虚拟游戏。该游戏举办的演唱会，如与
    `Travis Scott` 以及最近与 `Ariana Grande` 的合作，是该游戏点燃元宇宙采取的最大措施之一。随着数字与现实之间的界限变得越来越模糊，其他企业将迅速效仿。


    ## 未来工作


    可以肯定，元宇宙将影响个人的工作方式，即使不是完全重写这些工作。在 `Covid-19` 之前，众而周知，这场疫情将成为商业界的一个重大挑战，将工作和工人推向远程协作，并促使个人整合他们的现实和虚拟身份。像
    `Zoom` 和 `Slack` 这样允许远程和跨时协作的平台在最近几年中愈发突然，它们证明了在挑战性时期对高水平参与度和生产力的斗争中是至关重要的。


    有些事情将永远改变，其中一个事实就是：个人已经意识到，远程工作为合作、发展和成功开启了新前景的大门，尽管这一切在全球疫情爆发之初听起来是令人生畏的。对于员工和雇主来说，未来的元宇宙工作环境是高度自动化、精简化且易于使用的。商业世界将永远不再一不复返。


    疫情之后，网上购物和配送成为新常态只是时间问题。在购买之前，客户不必亲自访问实体店亲身测试新物品。在虚拟现实和增强现实体验的帮助下，用户将能够在舒适的家中了解更多公司和产品的信息。得益于元宇宙，它还将提供更具吸引力的店内体验。无论产品是否有货，客户都可以使用
    `VR` 和 `AR` 头戴设备在商店里测试。


    ## 数字转型


    这些可能性不再仅仅是推测——它们已经存在一段时间了。在大多数情况下，在我们在使用像 `Snapchat` 这样的应用之前，我们并没有意识到元宇宙。未来已经在这里，即使人们还没有意识到，正如定制过滤器所示，这些过滤器让营销人员能够与客户进行更深层次互动。元宇宙只是行业中许多流行词之一，但与许多其他词汇不同，它植根于社会。得益于
    `Covid-19`，元宇宙不再是一个科幻未来，它加速了大规模数字化，让全球人们沉浸在数字世界中。这种可能性实现的概率比任何时候都要高。


    ## 未来主导元宇宙项目


    ### 技术公司构建元宇宙的竞赛


    `Microsoft` 表示，公司正专注于创建“企业元宇宙”。根据 `Nadella` 的说法，“我们正在领先一个新的基础设施层——数字世界和物理世界正在融合。”4
    月，披露了一项针对 `Epic Games''` 元宇宙计划的 10 亿美元融资。由于科技巨头对这一新边疆的开发，工作和场所将发生根本性的转变。元宇宙让你无需使用
    `Zoom` ，即可在虚拟世界中与同事交流，那个世界几乎和现实一样沉浸。你可以买房子、玩游戏、看演唱会和购物。根据 `Zoom` 首席执行官 `Eric Yuan`
    的说法，虚拟将在未来的工作和极远程就业中发挥巨大作用。去年的虚拟 `Travis Scott` 演唱会有超过 1200 万人参加，仍然是元宇宙可能性的最直观演示，让许多玩家首次一瞥了原始元宇宙。`Mark
    Zuckerberg` 在帖中指出：“未来，一起工作将是人们利用元宇宙的关键方式之一。”关于未来的工作，`Yuan` 评论道：“我们还没有那里，”因为头盔太重且太复杂了。正如全球峰会所示，数字转型可以通过沉浸式技术得到促进。在为期三天的会议上，演讲者戴着
    `Oculus Quest` 头戴设备，虚拟参与者可以自带自己的头戴设备，也可以使用笔记本电脑。人们注意到，运送头戴设备比飞过去要便宜得多。共享的虚拟经济需要企业采取新方法。`Cathy
    Hackl` 一位拥有 AR/VR 经验的未来主义者说，尽管元宇宙会有广告，企业可能真正成为元宇宙的一部分。


    ### 实验的沙盒 (Sandbox)


    Sandbox 最初构想为 2021 年的移动游戏，现在是一个更复杂的基于以的游戏。在 Sandbox 中，用户可以探索充斥着非同质化代币 (`NFT`)、用户创建的环境等更多内容的元宇宙。以太坊
    (`ETH`) 和 `SAND` 代币用于 Sandbox 的交易。`ETH` 和 `SAND` 的使用将支持游戏经济。此外，Sandbox 的用户可以设计自己的化身和数字形象。元宇宙的核心概念包含了这一观点。玩家甚至可以使用
    `VoxEdit` 和 `Game Maker` 工具设计自己的虚拟游戏和物品并将其转换为 `NFT`。结果，Sandbox 的用户可以交易这些产品以获得额外资金。


    ### 去中心化地区 (Decentraland)


    正如名称所示，`Decentraland` 是一个三维空间。虚拟土地可以生长，音乐演唱会等社交活动也可以在那里举行。Decentraland 的代币是 `MANA`，它基于以太坊的
    `ERC20` 协议。Decentraland 有许多物品，它们都是通过区块链分配的数字身份。元宇宙热潮之前最著名的项目之一是 Decentraland。`Esteban
    Ordano` 和 `Ari Meil` 在 2016 年推出了 Decentraland，并从那时起致力于此。共享高价 `NFT` 物品允许他们创造一个更广泛的虚拟环境。我们正在使用
    Decentraland 开发元宇宙，因为 Decentraland 已经倾向于比其他项目（包括 `Facebook`）拥有 3D UI、数字经济和各种游戏活动。


    ### 引擎 (Enjin)


    这个 `Engine` 与 `MANA` 和 `SAND` 不同，它更关注生产用于游戏的 `NFT` 物品。鉴于 `NFT` 资产是元宇宙最重要的部分，该项目成功开发了一个
    SDK 让公众更容易创建基于以太坊的 NFT。Enjin (`ENJ`) 提供了流动性。由于这些优势，Engine 可以成为元宇宙的重要部分。


    ### Blocktopia (BLOCK)


    `Blocktopia` 提供了一个类似于 `The Sandbox` 和 `Decentraland` 的 VR 游戏。换句话说，共有 2100 万 `BLOCK`
    在流通。在 Blocktopia 中，你会找到活动中心，一个聚会、工作和社交的地方。这就是 Blocktopia 的不同之处。Blocktopia 基于 `Polygon`
    网络 (`MATIC`) 以支持其最关键的点：上述四点之一是学习。将有一个人们学习加密货币的地方。第二种模型被称为“赚钱”。Blocktopia 的玩家将获得
    `BLOCK` 代币和奖励。最后但同样重要的是，Blocktopia 为玩家提供了开发自己的数字环境和广告空间作为推广工具。


    ## 结论


    元宇宙是一项迷人的技术，它远不仅仅是不同游戏世界的集合。它是虚拟、增强和现实元素的混合体。换句话说，希腊语 *meta*（意为超越）是“元宇宙”一词的根源。然而，与任何现代技术一样，它也有优缺点。首先让我们看看优点。


    ### 元宇宙的潜在优点


    ### 体验


    在元宇宙中，你可以自由地成为任何任何人或任何事物。你所有的愿望和梦想都可以实现。你在这个环境中被带到了新的沉浸境界。在其他选择中，你可以在早上扮演世界上顶级厨师的角色，下午然后去哈马岛冲浪。就像你就在那里一样，你可以在舒适的家里做所有这些事情。


    ### 表达


    我们所有的社交媒体账户都使用 `DPs` 或封面照片。当有人访问我们的个人资料时，这是他们看到的第一个东西。另一方面，元宇宙给你的是一个完整的化身 (`Avatar`)，而不仅仅是一个
    `DP`。它是自我的三维表现。然而，你能够根据需要设计并更改它。你可以变得更高、更胖，穿上任何你喜欢的衣服。据说，化身看起来不仅像卡通；它们更像你的真实生活照片。


    ### 传送


    你可以在元宇宙中建造你的房子、办公室等，并邀请他人访问。如果你喜欢，元宇宙中的传送将要令人兴奋得多。可以创建一个你可以邀请朋友加入的出生地。因此，元宇宙中的传送只需点击一下。


    ### 知识


    将有一个人们学习加密货币的地方。上述四点之一是学习。Blocktopia 的玩家将获得 `BLOCK` 代币和奖励。最后但同样重要的是，Blocktopia
    提供了工具让玩家开发自己的数字环境和广告空间作为推广工具。


    ### 生产力


    在元宇宙中，工作效率会提高。


    ### 安全环境


    一个严重的环境问题是温室气体排放。幸运的是，元宇宙意味着减少了汽车。


