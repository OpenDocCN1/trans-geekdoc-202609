    In the immersive environment, the change from tethered to freestanding VR headsets
    signaled a paradigm shift since independent headsets are far more accessible to
    the public. For the first time, over one million VR headsets connected to Steam
    each month, as per Road to VR. On April 12th, Nintendo''s Labo: VR kit for the
    Nintendo Switch was launched. '
