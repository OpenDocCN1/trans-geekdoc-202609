    # Sandbox


    以下是其中几个部分的介绍：


    ### Sandbox

    该游戏由 Pixowl 于 2012 年 5 月 15 日发布，是一款适用于 iOS、Android 设备和 Windows PC 的沙盒游戏。2015 年
    6 月 29 日，它在 Steam 上面向 PC 用户开放。该声明的参考来源可用。基于区块链的 3D 开放世界游戏以 Animoca Brands 在 2018
    年收购的品牌命名。


    ### 区块链版本

    `The Sandbox` 由 Pixowl 创立，是一种虚拟化技术，用户可以在游戏的形式创建、构建、获取和数字交换资产。为了构建健康游戏社区的去中心化平台，`The
    Sandbox` 结合了去中心化自治组织（DAO）的力量与非同质化代币（NFT）。正如官方`白皮书`所示，`The Sandbox` 旨在将区块链技术有效融入主流游戏。该平台鼓励边玩赚（Play-to-earn）模式，允许玩家和开发者共同努力。`The
    Sandbox` 引入的 `SAND` 工具代币利用区块链技术简化网络上的交易。


    ### Sandbox 创始人

    `The Sandbox` 背后的主要动力因素是 Pixowl 的 Arthur Madrid，他也是公司的联合创始人兼 CEO。2000 年，他在`巴黎丹费林大学`获得了经济学学位。他在
    `Eurogroup Consulting France` 开始担任顾问，但很快发现了自己的创业动力。他在 2001 年创立了 `1-Click Media`，后被
    Ipercast 收购。Pixowl 的 COO Sebastien Borget 也是公司的联合创始人之一。他于 2007 年毕业于`国家电信学院`，获得计算机系统网络与电信学位。Arthur
    Madrid 在 `1-Click Media` 作为项目经理开始职业生涯，他与 Sebastien Borget 随后建立了创业伙伴关系。他们于 2011
    年共同创立了 `Pixowl`，从那时起致力于各种项目。


    ### 特特性

    `The Sandbox` 将区块链技术整合到游戏中，使其成为一个独特的平台。Pixowl 在 2011 年就意识到，游戏领域在区块链应用方面存在着巨大的、未开发的潜力。`The
    Sandbox` 意图通过为玩家提供一个构建和收集区块链物品的平台来改变行业。基于这一原因，它在全球游戏领域占据了独特的地位。`The Sandbox` 建立了一个元宇宙，玩家通过专注于用户生成的内容积极为平台的增长做出贡献。此外，`The
    Sandbox` 通过引入 `SAND` 代币鼓励去中心化治理，这使得人们能够提交关于项目进展的想法和意见。随着技术的进步，去中心化治理正成为区块链计划的需求。在初创公司刚起步时，许多知名游戏公司就提供了支持和投资，例如
    Atari、Helix 和 Crypto Kitties 等品牌。


    ### Sand 代币的监管

    `SAND` 代币的总量可能创建 3,000,000,000 个。截至 2021 年 3 月，有 680,266,194 个 `SAND` 代币流通，占总供应量的
    23%。整个代币供应量的分之一被预留给公司储备。另有 17.18% 用于代币的种子轮。在总代币供应量中，创始人和团队获得了约三分之一。整个供应量的略高于 12%
    留给了 `Binance Launchpad`。


    Sandbox 网络是如何确保安全的？

    `The Sandbox` 虚拟世界基于 `Ethereum`（以太坊）区块链，受权益证明（PoS）共识机制的保护。`SAND` 代币是 `ERC-20`
    代币，这意味着它们可以被质押并以此获得奖励。与比特币网络使用的工作量证明（PoW）共识技术不同，`PoS` 不需要大量的计算或电力来验证交易。在不损害质押资产安全的情况下，`PoS`
    方法可以有许多不同的用途。


    在哪里可以购买 Sand 代币？

    由于投资者和用户兴趣的增加，`SAND` 代币交易已在越来越多的平台上进行。截至 2021 年 3 月，`Binance` 上 `SAND/BUSD` 的交易量已达到
    $7,015,941。`Uniswap (V2)`、`Gate.io` 和 `LATOKEN` 是购买 `SAND` 的更多方法。


    ### 代币经济

    `The Sandbox` 的代币包含五类类型，即：

    - `LAND` (`ERC-721`)

    - `SAND` (`ERC-20`)

    - `ASSET` (`ERC-1155`)

    - `GEM` (`ERC-20`)

    - `CATALYST` (`ERC-20`)


    ### Sandbox 中的土地

    `The Sandbox` 元宇宙的 `ERC-721` NFT 代币——`The Sandbox` 中的 `LAND`，为其持有者提供了对 9696 平方米虚拟土地的所有权。`LAND`
    拥有者可以使用 `ASSETs` 来创建游客可以享受的独特体验。目前 `The Sandbox` 中仅可用 166,464 块 `LAND`。因此，`LAND`
    是 `The Sandbox` 最稀有的 NFT 之一。


    世界中的土地分布：

    1. 总共有 123,840 块 `LAND`（或总量的 74%）可供获取。

    2. 储备金（Reserve）将包含 25,920 块 `LAND`（或约 16%），并作为激励发放合作伙伴、开发者和玩家。

    3. `The Sandbox` 将保留 16,704 块 `LAND`（约 10%）的所有权。在特殊场合，这些土地将包含独特的游戏和 `ASSETS`。


    '
- fmt: "\nOwners of `LANDs` have two options for making money from them. To begin\
    \ with, they do this by developing gaming experiences on their `LAND` and charging\
    \ people in `$SAND` for the privilege of partaking in such games. If the gaming\
    \ experience is of the highest quality and/or if players have the opportunity\
    \ to make some `$SAND` in the process, this strategy is very beneficial. For the\
    \ second time, the `LAND` may be rented to other `Game Creators`, artists, or\
    \ gamers to create their own experience on the `LAND` that they can exhibit and\
    \ profit from. `LAND` owners may reap the benefits of passive income by renting\
    \ out their land via this strategy.\n\n## Estates\nEstates are made up of a number\
    \ of adjoining land lots that are sold together. `3x3`, `6x6`, `12-inch`, and\
    \ `24-inch` sizes are available. An estate can be held by a single individual\
    \ or a group of people. This means a lot more exposure for owners since gamers\
    \ who click on `The Sandbox` map can see them. `Estates` are generally sought\
    \ for by large brands and corporations in the `Sandbox` metaverse that wish to\
    \ develop a digital presence.\n\nMany different persons own `LAND` in a `District`,\
    \ which is why it is referred to as a \"District Estate.\" They are simply a group\
    \ of `LANDs` that work together toward a shared goal of self-governance. Even\
    \ though `districts` have not yet been published in the current version of the\
    \ game, they should be accessible when the game is launched to the general public.\
    \ The `Sandbox` metaverse's 'districts,' according to the `Sandbox` developers,\
    \ will give birth to `DAOs`. To establish and be a district member, property owners\
    \ must invest `$SAND`.\n\n## Transaction\nThe `Sandbox Platform` allows artists\
    \ and gamers to purchase and trade assets using `$SAND`. Users may only acquire\
    \ land using `$ SAND` throughout primary sales and all `Sandbox Marketplace` transactions,\
    \ users may only acquire land using `$SAND`. Uploading assets to the `Marketplace`\
    \ costs artists `$SAND`. \n\n## Governance\nA `DAO` structure will manage the\
    \ `Sandbox`, using the governance token `$SAND`. Holders of tokens have a say\
    \ in the platform's long-term development. This includes concerns such as how\
    \ content and game developers are credited for `Foundation` grant money and how\
