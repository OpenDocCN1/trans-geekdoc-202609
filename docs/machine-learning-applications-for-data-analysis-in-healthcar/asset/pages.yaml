  md: '# # 13.4.4 PREPROCESSING AND SEGMENTATION


    # ## 13.4.4.1 BILINEAR INTERPOLATION


    Bilinear interpolation estimates pixel values between neighboring pixels on a
    regular grid in image processing and computer graphics. The weighted average of
    the four closest known pixels is used to estimate the value of an unknown pixel.


    The method estimates the pixel value by weighting the distance between the unknown
    pixel and its nearby known pixels. The equation uses weights from each known pixel
    to the unknown pixel. The interpolated value takes into account the unknown pixel’s
    proximity to a known pixel.


    Bilinear interpolation helps resize photos. The technique estimates new pixel
    values between known pixels when a picture is enlarged, delivering a smoother
    result than duplicating pixels. Bilinear interpolation can estimate pixel values
    to preserve image quality when reducing image size (Figure 13.3).


    ![](img/e7e1b4040cce350b0d1520d1f0df754d_235_0.png)


    Overall, bilinear interpolation is a simple and effective method for estimating
    pixel values in image processing and computer graphics, particularly in situations
    where smooth transitions between adjacent pixels are desired.


    # ## 13.4.4.2 BILATERAL FILTER


    Image processing often uses the bilateral filter. It weights pixels based on their
    spatial and intensity distances and averages them. The filter smoothens photos
    while preserving borders, texture, and small details.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'The bilateral filter calculates the space and intensity distance between the
    center pixel and the surrounding pixels. Bigger disparities in pixel values are
    given less weight when calculating intensity distance. Pixels closer together
    are weighted more in the Euclidean distance calculation. Multiplying the intensity
    and distance weights yields a weighted average of nearby pixel weighs smooth.
    Pixel outputs are weighted averages of surrounding pixels. Similar-intensity pixels
    nearby weighted more (Figure 13.4).


    ![](img/e7e1b4040cce350b0d1520d1f0df754d_236_0.png)


    FIGURE 13.4 Bilateral filter.


    Overall, the bilateral filter is used in image processing applications such as
    denoising, texture removal, and picture enhancement. It smoothens pictures while
    keeping edges and other high-frequency details.


    # 13.4.4.3 FUZZY C-MEAN SEGMENTATION


    Image segmentation often uses the unsupervised fuzzy c-mean segmentation (FCM)
    clustering algorithm. Data points can belong to several clusters with varying
    degrees of affiliation using the FCM method. FCM can partition images using pixel
    values. Each pixel’s membership value reflects its cluster affiliation.


    The algorithm updates the cluster centroids and membership values iteratively
    until convergence, having the aim of lowering the distance between the data points
    and the cluster centroids. FCM is capable of dealing with visual ambiguity and
    overlap, making it appropriate for picture segmentation.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'It is extremely flexible as it allows the user to define the number of desired
    clusters and can be integrated with other techniques, such as geographical information,
    to improve segmentation (Figure 13.5).


    ![](img/e7e1b4040cce350b0d1520d1f0df754d_237_0.png)


    FIGURE 13.5 Fuzzy c-mean segmentation.


    Overall, FCM is a powerful and widely used algorithm for image segmentation that
    offers flexibility and robustness in handling complex image data.


    # ## 13.4.5 TRAINING MODEL


    This project was completed utilizing ResNet-50 as a training model. ResNet-50
    is a deep neural network architecture that has garnered popularity in computer
    vision tasks since Microsoft Research Asia''s introduction of it in 2015.


    This 50-layer architecture is a variant of the ResNet family of neural networks,
    which is well-known for tackling the problem of vanishing gradients by introducing
    the skip connection model. By enabling information to flow from earlier to later
    network layers, these skip connections help preserve essential features and reduce
    the impact of vanishing gradients.


    ResNet-50 has achieved cutting-edge performance on a variety of benchmark datasets,
    including ImageNet, COCO, and PASCAL VOC, making it a popular choice for image
    classification, object recognition, and segmentation applications. Furthermore,
    the ResNet-50 architecture is extensively used for transfer learning, which involves
    applying pretrained models to new datasets with less training data to train them.'
  merge: -1
  img_proc: true
