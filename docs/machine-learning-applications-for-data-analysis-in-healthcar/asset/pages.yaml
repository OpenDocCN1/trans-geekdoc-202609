    # 1.6 CONCLUSION


    In this chapter, we have proposed a stacking model which will be able to classify
    the ICU mortality of heart-failure patients with high accuracy as our model achieved
    outstanding performance with results such as K-fold mean accuracy of 98.22% on
    10-fold CV and ROC–AUC score of 0.98. Our modelwas built on a dataset taken from
    Kaggle which was taken from MIMIC-III database. It had a total of 1177 patient
    instances and 51 features. Our study consisted of a total of 12 ML algorithms
    from which we chose nine algorithms for building our stacking ensemble classifier.
    Those nine algorithms were chosen after conducting multiple comprehensive sets
    of studies on the results of all algorithms. Our stacking classifier had LGBM
    as level 1 or metalearner and SVM, AB, GB, DT, KNN, HGM, RF, and XGB as level
    0 or base learners. Our proposed stacking classifier outperforms the majority
    of benchmarking scores and ML models that were previously proposed in this study.'
