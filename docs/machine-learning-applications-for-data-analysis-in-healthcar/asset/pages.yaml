  md: '# 10.1.1 ECG WAVEFORM


    The display of each heartbeat is made up of electrical pulses that have peaks
    as well as valleys at regular intervals. The length of the electrical wave that
    passes through the heart affects electrical activity (Figure 10.2). The second
    element is the level of electrical activity the heart muscle is enduring, which
    can be used to identify any heart muscle portions that are excessively large or
    overworked. ECG signals range from 0.05 to 100 Hz. P, Q, R, S, and T represent
    the ECG’s five peaks and valleys for the formation of the signal. There is also
    sometimes a U wave. The T and P waves, along with the QRS complex, are what make
    ECG analysis most effective that can be found accurately and reliably [7–9]. The
    two atria, the heart’s upper chambers, are activated by the P wave, while the
    ventricles. The QRS complex and T wave stimulate the lower chamber of the heart.
    One of the basic problems with automatic ECG signal analysis is QRS recognition.
    After detecting QRS complex, ECG signal examined thoroughly. The P, QRS, and T
    waves show atrial and ventricular depolarization and repolarization [8,10,11].
    The baseline is a potential line that refers to horizontal portion of waveform
    that appears before P wave. Depolarization of the atrial musculature causes the
    P wave. QRS complex results from simultaneous AV repolarization and ventricular
    depolarization. T-waves occur during ventricular repolarization, while U waves
    are assumed to be after potentials in the ventricular muscle. The T occurs during
    ventricular repolarization [12–15]. It is possible to detect cardiac arrhythmias,
    myocardial infections, ventricular hypertrophy, conduction abnormalities, conduction
    abnormalities, and other disease states based on the length, amplitude, and form
    of the QRS complex [16]. The heart beats 60–100 times per minute on average. Slower-than-normal
    heart rate is bradycardia; faster-than-normal is tachycardia (fast heart) (Table
    10.1).


