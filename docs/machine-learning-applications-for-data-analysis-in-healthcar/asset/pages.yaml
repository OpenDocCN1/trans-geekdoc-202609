    it, which is stored on a blockchain.” Therefore, this token must be given with
    the product. Let us imagine a business manufactures 100 units of a product, each
    of which has a digital token kept in a blockchain. For instance, they are given
    to the wholesaler, and this transaction is recorded in the blockchain. The wholesaler
    then transfers it to a different distributor, and once more, this transaction
