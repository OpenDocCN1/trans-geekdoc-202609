  md: 'Healthcare data are secured with a symmetric key that is additionally encrypted
    with the authorized user’s public key from a 2048-bit Rivest–Shamir–Adleman key
    pair. The healthcare data cannot be obtained by adversaries without the symmetric
    key. As a result, this plan offers a high level of data privacy.


    # 8.5.4 INFORMATION EXCHANGE


    The paradigm in Figure 8.4 promises a decentralized framework that facilitates
