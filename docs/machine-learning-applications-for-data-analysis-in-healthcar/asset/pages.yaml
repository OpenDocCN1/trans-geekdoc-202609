  md: '# ## 4.1 INTRODUCTION


    Artificial intelligence (AI) computing has altered the dynamics of development
    and is playing an important role in improving people’s quality of life. Healthcare
    solutions are one such domain where the scope of application for AI has become
    an urgent need. There are distinct sets of solutions where AI''s role is prominent,
    ranging from formulation planning to research to clinical care.


    Predictive modeling solutions are becoming more constructive for some of the current
    AI applications in the healthcare domain, from diagnosis to treatment care, and
    they help improve the accuracy of diagnosis and treatment. Rheumatic or musculoskeletal
    conditions cause more than 150 diseases, and the syndrome is usually progressive
    and painful for those who suffer from it. Rheumatic conditions can be divided
    into three categories: joint diseases, spinal disorders, and conditions that lead
    to traumatic conditions. In general, such rheumatic conditions cause morbidity
    and disability in certain conditions, as well as significant healthcare expenditures
    [1].


    In terms of the dynamics of applying machine learning (ML) models, one of the
    key areas of healthcare where the use of ML models can be seen as essential is
    the accurate prediction of rheumatoid arthritis (RA).


    RA is a chronic system disease that affects joints, fibrous tissues, connective
    tissues, and other tissues, according to a brief overview of the RA and osteoarthritis
    (OA) outline. It primarily affects people between the ages of 20 and 40, during
    their most productive years of adulthood. More often than not, if undiagnosed
    for an extended period of time, it can impair the healthy movement of people with
    RA [2].


    OA is a degenerative joint disease that primarily affects the articular cartilage.
    More often than not, the problem manifests itself in the cases of aged people
    and physically stressed people as a result of excessive physical work. According
    to statistics, OA is one of the 10 most disabling diseases in developed countries
    [3, 4].


    The fact remains that there are various types of arthritis, with OA and RA being
    two of the most common. Because the symptoms of both types of arthritis discussed
    are similar, there is a need for more accurate and appropriate treatment to decide
    on the best treatment to address the issues [5].


    Knee osteoarthritis (KOA) is a condition of the human knee joint that primarily
    affects the cartilage. Cartilage plays an important role in leg'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'movement. The top layer of cartilage disintegrates and deteriorates in OA,
    resulting in excruciating pain. OA is a chronic joint disease that causes pain,
    swelling, stiffness, and loss of function. OA is a chronic disease whose origin
    is unknown.


    It is the most common type of arthritis and is distinguished by cartilage degradation
    and bone changes [30]. It is difficult to diagnose OA in its early stages because
    it has been suggested that the first changes occur in the subchondral bone [31]
    before the occurrence of joint space narrowing and osteophytes. As a result, early
    detection, diagnosis, and intervention are highly desired in order to overcome
    this severely disabling disease, as early-stage treatment could prevent cartilage
    and bone breakdown.


    Thus, focusing on the implications of similarities and the potential scope of
    human errors being significant to the problem, there is a need for a strong model
    that can assist healthcare professionals in having more accurate diagnostics and
    an effective system in place for quick turnaround analysis with the appropriate
    type of detection for the type of arthritis. As a result, the focus of this chapter
    is on providing a detailed review of the current solutions or models used in ML
    and non-ML practices that could be useful in developing a more appropriate type
    of system [6].


    The focus of the other sections of this chapter is on understanding the literature''s
    possible set of solutions for using ML models for arthritis form detection.


    # ## 4.2 LITERATURE REVIEW


    This chapter''s review of the literature is intensely focused on how computer-aided
    solutions are in place and the implications, if any, with the existing models,
    as well as the potential scope for the application of combinations to be used
    for improving the existing models or developing sustainable solutions that can
    improve the accuracy and adequacy in diagnosis.


    The structure chosen for the literature review is to concentrate on the last seven
    years of research data in the form of peer-reviewed journal articles that can
    aid in the completion of the proposed research. The following are the objectives
    of the literature review, which served as a guide for the review.'
