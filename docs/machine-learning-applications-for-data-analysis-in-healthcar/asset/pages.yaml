    # ABSTRACT


    The human being has several biometric traits that can be used to identify a person
    such as fingerprint, finger vein, hand vein, hand geometry, face, iris, finger
    knuckle print, palm print, ear, gait, retina, and so on but the hand-based biometric
    system is highly acceptable due to easy acquisition, ease-to-use, and leading
    recognition performance. The fingerprint-based biometric system is an older one
    and is often used type for person recognition/identification. Apart from various
    advantages, the fingerprint trait has three major drawbacks. First, the fingerprint
    ridges are rugged in the hard-working people like cultivator, industrial labor,
    machine mechanics, rickshaw pooler, and so on. Second, the skin elasticity is
    not constant throughout the seasons; and third, applied thumb pressure is not
    always the same, cause dispersion of thumb skin is varied, resulting the extracted
    feature sets are also varied. Hence, intraclass variation occurs in the matching
    score and system performance degrades. The biometric domain'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'researchers consider the above issues about the fingerprint biometric and nowadays
    person identification using finger knuckle print biometric is very popular among
    the biometric research community. This chapter presents an overview of this emerging
    biometric and available recognition methodology to identify people.


    # 12.1 INTRODUCTION


    The finger knuckle print (FKP) image is an inherent skin pattern available at
    the backside ofthe finger joint, recently this pattern has been quite popular
    and attracts the biometric research community due to its high acceptability and
    reliability [1]. The popularity gained by FKP is not only the cause of acceptability
    and ease of use, apart from that, it is not rugged like a fingerprint and easily
    can be captured using a normal resolution imaging device [2].


    Woodard and Flynn [3] are the first scholars to make use of the finger knuckle
    surface to recognize a person. They used the Minolta 900/910 sensor to create
    a 3D finger back database. This sensor simultaneously captures and register image
    into size 640 × 480 and 640 × 480 of 24-bit color intensity, respectively. The
    sensor measures 213 mm × 413 mm × 270 mm and weighs around 11 kg. Due to its large
    size and weight, it is not suitable for commercial use of the biometric system.
    At the time of data collection, the sensor is placed on a flat wall at positioned
    approximately 1.3 m and is covered with a black cloth. Before the data collection
    was conducted, the subject was asked to remove all jewelry to ensure that the
    sensor does notscatter when in contact with the reflective surface of the jewelry.
    During the experiment, thesubjects were asked to place their right hand against
    the wall and keep it there as the image is captured. After that, they remove their
    hand from the wall and return it to the same position. The researchers collected
    a total of 1191 hand range images which are available publicly. In this image
    one is taken a sample of hand color images of size 640 × 480 pixels. Second image
    taken as a pseudo intensity of the same hand image of size 640 × 480 using a polygonal
    meshand third image is a surface detail detected near a knuckle.


    The only requirement for finger placement is such that there is space between
    two adjacent fingers. No constraints were used for capturing the images. They
    used a 3D range image of the finger to get the curvature'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'surface representation. The normalized correlation coefficient was then used
    to compare the similarity of the images.


    In 2009, Kumar and Ravikanth [4] developed a system using a digital camera to
    acquire finger-back surface images. The imaging system is focused against a white
    background under uniform illumination and the camera was fixed at a 20-cm distance
    from the imaging surface. The nonuniform illumination of objects at the hand boundaries
    reduces the performance of the acquired image. This is achieved by using a fixed
    light source above the hand. The resolution was 1600 × 200 pixels of the acquired
    FKP image. The subject is asked to place their hand on the support with the backhand
    facing the sensor.


    There is a six-finger geometry and each has four fingers, resulting in 24 fingers
    being used to extract features. The features include finger length, widths, perimeter,
    and area along with the knuckle feature. The knuckle feature is extracted by applying
    the subspace analysis method onthe finger back surface and using these features
    for person classification. Although these methods were able to identify the unique
    features of the outer finger surface, they were not able to provide a practical
    solution for implementing an efficient system.


    The proposed method [3] focuses on the 3D shape information of FKP and not fully
    on the texture information while subspace analysis methods used in Ref. [4] may
    not be able to extract efficient features of FKP.


    # 12.2 FKP RECOGNITION ALGORITHMS


    The state-of-the-art method of FKP recognition algorithms may be classified into
    four categories, namely, (1) subspace-based methods, (2) coding methods, (3) other
    methods, and (4) recent trend method. Some of the algorithms are discussed as
    follows.


    # 12.2.1 SUBSPACE-BASED FKP RECOGNITION ALGORITHM


    The subspace-based technique used to transform a raw image is into a low-dimensional
    subspace. The resultant subspace is used as a feature vector for classification
    by learning and training the data. These algorithms extract global information
    from an entire image using each subspace. These techniques are expected to enable
    the development of region-based'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'identification methods. This technique uses principal component analysis (PCA),
    linear discriminant analysis (LDA), and independent component analysis (ICA) to
    extract subspace coefficient features. It is used to represent feature vectors,
    feature matching distancemeasures or classifiers, and also for dimension reduction
    of the extracted feature set.


    A novel method called weighted linear embedding (WLE) was proposed [5] to recognize
    FKP. This method combines the Fisher criterion with the manifold learning criterion
    to extract features from a linear model. The concept of the manifold learning
    theory states that the importance of local information is more significant than
    nonlocal information. This concept is implemented and both local and nonlocal
    features are extracted from the data sets. The author uses Gaussian weighing to
    mapping procedure that combines nonlocal and local information. It is commonly
    used to find a mapping vector that is suitable for estimating the weighted class
    scatters maximized. The classification is done on the base of the nearest neighbor
    classifier. The authors have also tested the proposed algorithm on palmprint and
    have made a comparative study of PCA, LDA, LDE, and WLE. The WLE is tested on
    the right index finger of 1000 persons and achieved a recognition rate of 78.2%.


    In Ref. [6], the author proposed a new FKP recognition work in which the author
    uses wavelets for image analysis and pattern recognition and also uses PCA to
    reduce the Gabor feature into low-dimensional space. Further, the author applies
    orthogonal linear discriminant analysis (OLDA) transformation in PCA subspace
    to classify the image using nearest neighbor and achieve 98% accuracy. This chapter
    also compares the individual finger performance and shows that the left index
    finger has better performance than the right index finger.


    An author presented a method that simultaneously measures distances and angles
    between theimage data vectors to study the similarities between them [7]. An image
    angle measurement method that is focused on a shifted image space is proposed
    to highlight the distinction between the angles of different data. Both the distance
    and angle are obtained through a parallel fusion procedure that uses the complex
    locality-preserving projections to extract low-dimensional features. Orthogonal
    complex locality preservation projections or OCLPP is a subspace method that can
    minimize the redundant information in each image and four images were randomly
    selected for the recognition process and achieved a recognition rate up to 88%.
    The author also compares the proposed work with the subspace'
  merge: -1
  img_proc: true
