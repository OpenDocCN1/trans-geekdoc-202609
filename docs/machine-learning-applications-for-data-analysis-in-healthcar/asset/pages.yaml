  md: '# 6.1.3.2 RULE-BASED EXPERT SYSTEMS


    Advanced systems rely on different sets of if-then rules as the main technology
    for AI in healthcare during the 1980s and beyond. AI is widely used in healthcare
    for helping doctors make clinical decisions even today. Many electronic health
    record systems (EHRs) currently provide a set of guidelines with their software
    offerings. Master frameworks usually require people who are experts and designers
    to create a set of rules in a specific area of knowledge. They work well to some
    extent and are easy to follow and measure. As the number of rules increases—especially
    beyond a few thousand—they can begin to conflict with one another, leading to
    system breakdowns or reduced reliability. Also, if the rules in a certain area
    change in a major way, it can be difficult and unfair. AI is beginning to replace
    rule-based systems in medical care using advanced algorithms to interpret data.


    # 6.2 AI AND HEALTHCARE


    Describing the work of AI in healthcare as interesting would be an understatement.
    AI and machine learning can make big changes in how medical care is done. There
    are still challenges, but the potential for this technology is so great that governments,
    hospitals, and providers should invest in AI-powered solutions. Starting today,
    AI and machine learning are ready to help healthcare providers make their work
