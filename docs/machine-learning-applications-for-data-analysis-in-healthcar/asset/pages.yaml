    # ## 7.1 INTRODUCTION


    Earlier novel drugs for known diseases were identified using random screening
    and observations with effectiveness of natural products. Until the 1980s, this
    random screening approach resulted in the discovery of numerous significant chemicals.
    High-throughput screening (HTS), which is ideal for independent screening of multiple
    drugs against a specific molecular target or cellular test, is currently improving
    this technique. The essence of HTS in drug discovery was emphasized with the discovery
    of cyclosporine A as an immunosuppressant [1]. Progressively, another successful
    paradigm of application of computer-aided drug design (CADD) was the finding of
    gefitinib using ALLADIN [2] software after screening a library of 1500 chemicals.


    To unravel the mechanism of drug resistance, search for novel antibiotics, and
    design them for both known and unknown targets, CADD can be integrated with wet
    lab techniques in the design of new antibiotics. CADD approaches are computationally
    faster, accurate, and economical [3].


    Deciphering novel targets that exhibit distinct pathways needed for bacterial
    life is a key option to solving antibiotic resistance. Researchers are still looking
    for novel antibiotics to combat established targets, and computational tools have
    been utilized effectively in a number of studies to do so. The fundamental CADD
    procedure begins with the biological identification of a hypothetical target for
    which ligand binding resulted in antibacterial action. In SBDD, the target’s 3D
    structure can be determined via X-ray crystallography, nuclear magnetic resonance,
    or homology modeling. CADD-SBDD screening is built on this base [4]. The major
    focus is the development of structure–activity relationship which yields further
    improvements in the compounds, and LBDD is utilized in the absence of the availability
    of the desired 3D structure.


    CADD provides for greater experiment focus, which saves time and money while discovering
    novel medications. The most popular and extensively used method in this area is
    the *in silico* methodology. These strategies are typically utilized in conjunction
