    # 5.1 INTRODUCTION


    Cardiovascular disease (CVD), commonly known as heart disease (HD), is the main
    cause of global mortality. One-third of the total death in HD occurs below 70
    years of age. The main causes of CVD are due to smoking, consumption of alcohol,
    obesity, overweight, high blood pressure, and abnormal glucose level. CVD mainly
    refers to disorders of heart and blood vessels. As per the World Health Organization,
    the number of deaths will substantially increase in the next 10 years.


    This chapter presents a complete overview of types of HDs and the associated causes,
    the types of test features, the types of signals source from the body, the various
    common features extracted for detection purpose. In addition, the common methodology
    used for early detection of CVD as well as the various machine learning (ML) and
    deep learning (DL) methods employed are also presented. The standard databases
    which are mostly being used by HD research community have also been listed for
    convenience of carrying out further research in this field. The generalized training
    and validation schemes commonly used for the development of HD detection have
    been outlined. Some of the key results and findings reported in recent literature
    are also presented to have a complete understanding on CVD detection. It is expected
    that the materials that are presented subsequently in this chapter would be immensely
    useful for carrying out further research as well as for development of Internet
    of Things (IoT) and cloud computing-based HD diagnosis system.


    # 5.2 OBJECTIVE AND ORGANIZATION


    The main objectives as well as the organization details of this chapter are presented.'
