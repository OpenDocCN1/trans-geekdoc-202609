    # 12.2.2 CODING-BASED FKP RECOGNITION ALGORITHM


    In the coding-based technique, the FKP image is segmented into several subimages,
    and information like orientation or edges is extracted from each subdivided image.
    Several codingalgorithms are proposed in the literature to improve the recognition
    performance of FKPs. These coding techniques are widely used for palmprint recognition
    and found good recognition results. The finger knuckle surface is very rich in
    lines and creases and highlyunique in individuals. These techniques of coding
    are mainly based on the concept of iris code.


    A research work exploited the local feature in comparison to the global feature
    for reliable performance [8]. The preprocessing step helps to minimize the effects
    of light variation on the texture features and improves the overall performance.
    To avoid wrapping around an inherent modulo operation, finite radon transform
    and modified finite radon transform (MFRT) are commonly used to determine the
    orientation of the grease lines or knuckle lines ina local neighborhood region.
    The dominant direction at each pixel is computed and coded intobinary bits called
    knuckle code. The normalized Hamming distance is used to compute the similarity
    measurement between two FKP and these techniques achieved 98.6% accuracy.


    A method [9] is proposed to capture an FKP image and automatically align the FKP
    image with a local coordinate system. The bottom of the FKP image is stable because
    of the acquisition method. Hence, this is considered the x-axis of the ROI coordinate
    system by fitting this boundary'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'as a straight line. A model for the convexity of FKP was established. The resulting
    magnitude will reach the minimum at the center of the phalangeal joint and it
    can be used toset the coordinate system''s y-axis. After the coordinate system
    is fixed, an ROI subimage of size 110 x 220 is cropped. Then orientation information
    is extracted using Gabor filtering andrepresented the information in the form
    of competitive code. The angular distance is used for matching between two FKP
    and finally an energy efficiency ratio (EER) of 1.09% was achieved.


    An improved competitive and magnitude code is developed in 2010 [2]. This uses
    Gabor filters to extract the magnitude and orientation information. This information
    is further used toset up a code map that is based on the competitive code. This
    computed angular and magnitude distance is fused and the minimum distance is considered
    the final distance. This proposed algorithm is compared with one standard coding
    algorithm and found better performance.


    The concept of the monogenic code was proposed [8] to fast features extract from
    a two-dimensional signal f(x,y). The monogenic signal is defined as the combination
    of f(x,y) and its Riesz transform which is a vector-valued extension of the Hilbert
    transform in the 2D Euclidean space. The code represents the 3 bits of the monogenic
    signal that were extracted from the pixel. It shows the phase information and
    orientation of the pixel. This algorithm alsoshows similar accuracy in comparison
    to the state-of-the-art method of FKP recognition.


    In Ref. [10], the author proposed a new coding method that has the advantages
    of high accuracy, robustness, and compactness. To find the above code, Riesz transform
    identifies andcharacterizes the visual patterns of the FKP image and also encodes
    the local patches using second-order Riesz transform. A 6-bit coding scheme namely
    the Riesz Compcode was developed. This Riesz Compcode is a 6-bit coding scheme
    that combines the advantages of Riesz transformation and Compcode in characterizing
    the local FKP feature together. A normalized Hamming distance is computed at the
    matching stage of the proposed work and this scheme of the coding algorithm shows
    better performance in terms of recognition accuracy when compared with another
    coding algorithm.


    Nigam et al. [11] used pixel-based feature information around a specified area
    of the local blob, edge, or corners for FKP recognition. This technique of FKP
    recognition is sensitive to illumination but unguarded to rotation. It proposed
    a new feature extraction technique using vertical'
