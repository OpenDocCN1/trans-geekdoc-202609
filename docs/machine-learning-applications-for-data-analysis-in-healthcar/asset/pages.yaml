    # 4.4 PROBLEM STATEMENT


    OA is one of the most common chronic joint diseases, with a large number of risk
    factors that are directly linked to it. When compared to other types of OA, KOA
    is the most common and occurs most frequently in people over the age of 55, with
    the disease’s prevalence increasing as people reach the age of 65. KOA is difficult
    to diagnose in the early stages of the disease. To address this issue, we are
    developing an ensemble approach early detection deep learning-based system that
    will use an X-ray/MRI dataset of KOA patients to provide more accurate results
    than previous work.


    # 4.5 PROPOSED METHOD


    The prevalence of OA is increasing, which is partly due to our aging population.
    OA is currently diagnosed using patient-reported symptoms and X-rays. The alternative
    is an MRI, but this comes at a high cost and is rarely used until symptoms worsen
    and patients are referred for a surgical opinion from a specialist. As a result,
    effective management and early detection of KOA is a critical public health issue
    that concerns the general public as well as a variety of clinicians and healthcare
    executives.


    Many researchers have attempted to diagnose OA using X-rays and patient medical
    data, but the results have been inconsistent. Through this proposed idea/work,
    we will design and implement an ensemble methodology for early detection of KOA
    using a hybrid dataset of X-ray and medical data of patients through which doctors
    can predict the OA and its level more accurately and in less time through this
    proposed idea/work. Image processing and AI will be used to create a low-cost
    methodology. Figure 4.1 depicts the proposed system architecture.'
