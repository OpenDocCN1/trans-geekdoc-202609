  md: '# # Smart Healthcare Systems: An Exigency of Current Era


    ANUPAMA SHARMA¹, PRASHANT SRIVASTAVA¹,

    PRATEEK CHAURASIA¹, SHWETA ROY²*, and SANDHYA AVASTHI²


    ¹Department of Information Technology, Ajay Kumar Garg Engineering College, Ghaziabad,
