    # ## 6.1 INTRODUCTION


    The term “artificial intelligence” was first introduced during a gathering at
    Dartmouth College in 1956. Between 1956 and 1974, AI research primarily focused
    on solving mathematical and algebraic problems and developing systems capable
    of understanding natural language. From 1980 to 1987, expert systems gained popularity—these
    were programs designed to answer questions or solve problems based on specialized
    knowledge.


    Interest in AI declined for a time but was revived in 1997 when IBM’s Deep Blue,
    a chess-playing computer, defeated Russian grandmaster Garry Kasparov. Since then,
    nearly every major tech company and scientific institution involved in medical
    research or clinical trials has pursued AI-based predictive and prescriptive tools
    for diagnosis and treatment. According to the technology research firm Gartner,
    75% of healthcare organizations were expected to invest in AI capabilities by
    2021 to improve overall performance.


    AI-powered medical tools offer significant benefits for both doctors and patients,
    and they are applicable across a wide range of healthcare domains. Beyond medicine,
    AI has numerous applications across industries such as finance, transportation,
    and manufacturing, and it is transforming how businesses make decisions and treat
    complex problems. AI technologies are used in areas like object, face, speech,
    and handwriting recognition; virtual reality and image processing; natural language
    processing, chatbots, and translation; e-mail spam filtering, robotics, and data
    mining. According to market intelligence firm Tractica, global annual AI revenue
    is projected to grow to $36.8 billion by 2025.


    # ## 6.1.1 ARTIFICIAL INTELLIGENCE


    Artificial intelligence (AI) means teaching machines to think and act like humans.
    It can also be used to describe any machine that shows human-like features such
    as learning and problem-solving. AI’s best quality is its ability to make decisions
    and take actions to achieve a goal, and a part of AI called machine learning means
    computers can learn and change on'
  merge: -1
  img_proc: true
