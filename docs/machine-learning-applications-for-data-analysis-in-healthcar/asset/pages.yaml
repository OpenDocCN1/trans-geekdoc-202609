    # 7.2 CADD APPROACHES


    +   1. LBDD (ligand-based drug designing)

    +   2. SBDD (structure-based drug designing)


    # 7.2.1 LBDD APPROACH


    When target structures are unknown, LBDD approaches are frequently applied in
    drug designing. It begins with building a ligand using software like Chemsktech,
    Schrodinger, and so on and generating many random combinations by adding or removing
    new functional groups or by Finding databases like Zinc Database to screen out
    a variety of ligands known to be having some biological efficacy against the target
    protein or gene. After building or finding the effective ligand molecule, QSAR
    (quantitative structure–activity relationship) approach is applied to estimate
    the efficacy and biological activity of those molecules. QSAR approaches involve
    2D QSAR as well as 3D QSAR [6]. 2D QSAR aids in the identification and quantification
    of a drug’s physical–chemical properties, as'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'well as the impact of these properties on the drug’s biological activity. 3D
    QSAR looks at a molecule’s whole 3D characteristics rather than just one substituent.
    It revolves around a molecule’s most important qualities, such as its overall
    size, shape, and electrical properties. Supplementation of molecules is critical
    in 3D QSAR. QSAR analysis is based on the fact that electronic, geometric, topological
    properties of the molecules govern their chemical activity, physical, and biological
    efficacy (i.e., its geometric, steric, and electronically properties). In QSAR,
    we correlate the properties of the experimentally known compounds to detect the
    parameters of new compounds whose efficacy we are trying to estimate. In the results
    of QSAR, we often used terms like biophore and biophore. Biophore is a structure
    that shows some biological activity, and in contrast to it, biophore is a chemical
    structure that lacks any biological activity [7]. QSAR is an amalgamation of multifarious
    spheres which includes statistics, chemistry, and biology. Three components must
    be available in order to develop a model of QSAR: (1) an experimental dataset
    giving insights on the properties and biological activity for a diverse group
    of already tested chemicals (the training set), (2) data pertaining to the molecular
    structure which includes many descriptors for this group of chemicals, and (3)
    statistical approaches which are referred to as chemometric methods for investigation
    and validation of the essential correlations [8] (Figure 7.1).


