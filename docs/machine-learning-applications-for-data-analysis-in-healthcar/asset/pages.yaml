    # Mobile App for Analyzing and Predicting Depression in Human Beings


    VIRENDRA KUSHWAH, PRACHI BHATT, TOSHINI AGRAWAL, JIGYASA BISHT, and SHIVANGI SINGH


    School of Computing Science Engineering and Artificial Intelligence, VIT Bhopal
    University, Bhopal, Madhya Pradesh, India


