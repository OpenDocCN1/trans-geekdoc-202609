  md: '# CHAPTER 1


    # Classification of In-Hospital Mortality

    for Heart-Failure Patient Using

    Resource Constraint Dataset


    DIGANTA SENGUPTA^{1*}, SUBHASH MONDAL^{2}, SUVAM GUPTA^{3}, and

    SHIVAM AGARWAL^{3}


    ^1Department of Computer Science & Engineering, Heritage Institute of

    Technology, Kolkata, India

    ^2Department of Computer Science & Engineering (AI & ML),

    Dayananda Sagar University, Bangalore, India

    ^3Department of Computer Science & Engineering, Meghnad Saha

    Institute of Technology, Kolkata, India


    *Corresponding author


    # ABSTRACT


    The real challenge posed to in-hospital mortality study is from heterogeneous
    data from nonhomogeneous class of patients. This motivates the study, which uses
    traditional machine learning (ML) algorithms to analyze the heterogeneous data
    containing 48 features and classify in-hospital mortality. The retrospective cohort
    was focused on heart failure patients. Twelve ML algorithms have been deployed
    on a publicly available dataset for binary classification. The dataset used for
    the study was highly resource constrained and unbalanced; hence a novel data preprocessing
    unit has been designed. In addition to standard implementations, hyperparameter
    tuning and stacked implementations have also been done. Post cross-validation,
    the accuracy value observed was 95.45% for histogram-based Gradient'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Boost algorithm. Hyper-parameter-tuned model accuracy was observed at 96.55%
    for the Gradient Boost classifier. Accuracy for the stacked model was 96.43%,
    with an RoC-AuC score of 0.977, a recall value of 0.964, and an F1-Score of 0.977.
    The false negative share for the stacked model was at 0.56%. Since mortality analysis
    is the subject of study, we claim that the false negative value validates the
    robustness of the classification. The performance of all the ML algorithms has
    been compared with the existing literature.


    # 1.1 INTRODUCTION


    Heart failure is a complicated clinical ailment resulting in hindrance of ventricular
    filling or emission of blood to the systemic circulation due to structural or
    functional heart disorder. By definition, it is failure to meet the systematized
    demands of circulation. It implies that there is some anomaly present in the systolic
    or diastolic phases of the heart which is hampering the heart''s performance and
    in turn it can lead to huge consequences later on. It has affected many people
    globally and the death rate associated with it is increasing day by day. It has
    an estimated ubiquity of around 26 million people globally and it contributes
    to an escalated healthcare cost worldwide. Heart failure is a common, expensive,
    and potentially lethal condition having a mortality rate of around 4–7% [1], and
    it is one of the major causes of both hospitalization and readmission. The heart-failure
    rate in adults and senior citizens is around 2–3% and 6–10%, respectively, and
    is bound to increase in the coming years. Also, the death rate is about 35% after
    the diagnosis of heart disease after one year.


    Nowadays, many machine learning (ML) models and severity scores are being utilized
    in the medical domain but the majority of them give unsatisfactory results which
    will not be helpful in predicting mortality effectively [2]. Recently, many ML
    models and severity scores are being utilized in the medical domain but the majority
    of them give unsatisfactory results which will not be helpful in predicting mortality
    effectively. Above 80% results have been noted for the classification of disease
    by using ML methodologies [3].


    Our one and only motive is to provide a model that would be able to correctly
    predict the chances of a person surviving this lethal condition'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'which would be helpful in providing extra care to people having a high risk
    of mortality, with correct medical supervision and equipment''s which we can only
    find in the intensive care units (ICU). Hence, a stacking ensemble model is proposed
    here, consisting of six base learners (random forest [RF], extreme gradient boosting
    [XGB], support vector machine [SVM], K-nearest neighbors [KNN], decision tree
    classifier [DT], adaptive gradient boost [AB], gradient boosting [GB], and histogram-based
    gradient boosting [HGB]) and light gradient boosting machine (LGBM) as metalearner
    which we have chosen from a pool of 12 ML classification algorithms such as AB,
    GB, LGBM, SVM, RF, logistic regression (LR), DT, XGB, HGB, Gaussian naïve Bayes
    (GNB), Bernoulli naïve Bayes (BNB), and KNN.


    The various ML proposed model has less significant performances in majority of
    the cases related to in-hospital mortality prediction in ICU patients [4]. In
    this regard, we have observed many difficulties that all the medical datasets
    have two things in common and that is highly unbalanced and data with lots of
    missing values [5, 6]. Data extracting is a more challenging task to control the
    high volume of missing values within the dataset due to irregular sampling [7].
    Data imbalance makes the training procedure more hectic and in turn deteriorates
    the performance of the model in prognosticating the outcome [8]. Also, it is stated
    by Anand et al. [9] that each and every algorithm has its own advantages and drawbacks.
    So before applying any algorithms, the data were processed thoroughly and all
    the missing values were imputed and the data were balanced and scaled so that
    the results do not get biased or degraded by any means [10, 11].


    After preprocessing the data, we divided the data into train and test splits and
    trained all of our 12 ML algorithms mentioned above using our training data having
    K-fold cross-validation (CV) of value 10 and then tested all our models. After
    this, we finely tuned the models that were yielding better results. Thereafter,
    testing and evaluating many different combinations of tuned models for metalearner
    and base learners of our stacking ensemble model, we got the best results while
    using LGBM as metalearner and RF, XGB, SVM, KNN, DT, AB, GB, and HGB as base learners.
    Hence, declaring this as our proposed model which achieves an accuracy of 0.982,
    F1 score 0.977, area under the receiver operating characteristic curve (AUROC)
    0.977, recall 0.969, precision 0.984, Cohen kappa 0.955, standard deviation 0.64.'
