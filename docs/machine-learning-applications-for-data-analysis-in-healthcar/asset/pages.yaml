  md: '# ## 11.4 CASE STUDY


    # ### 11.4.1 DATA SET


    We collected over 500 accident text data from the workplace at distinct working
    sites. Initially, text was in raw format, so first, we did some preprocessing:
    stop words removal, convert to lowercase and punctuation removal, tokenization,
    stemming, lemmatization, and brought the text data into a desired usable format.
    About 450 text data having rows of multiple sentences were manually annotated
    and stored in json format as an input to the custom-trained NER model.


    We pre-labeled the text data and then used TF–IDF and linear SVC to classify them
    into four categories: (1) human factor, (2) component factor, (3) management factor,
    and (4) environmental factor.


    Before this, we used the elbow method to find out the optimal number of clusters
    that fit for this text data and we got k in the range 4–6.


