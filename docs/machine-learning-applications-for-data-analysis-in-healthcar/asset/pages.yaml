    # 7.3 MOLECULAR DOCKING


    Molecular docking refers to fitting in the potential ligands in the active site
    of the target protein and generates the least energy, best-fit molecular conformation.
    Various molecular parameters are analyzed during docking followed by multiple
    iterative rounds to minimize the energy using algorithm like Newton–Raphson, steepest
    descent, and conjugate variate methodologies [36]. Molecular docking generates
    plethora of docked structures and conformations which are then categorized using
    scoring function feature. Scoring function is based on multiple parameters such
    as free energy, topological properties, electronic structure, stability of complexes,
    binding energy, root mean square deviation, and so on [37].


    The accurate ligand-binding conformation depends on two rules which are as follows:


    +   - Conformation space which helps in finding suitable binding regions.

    +   - Binding energy of each prediction is correlated with each conformation.


    Molecular docking is a multiphase process and is done when a state with minimum
    energy is achieved, in which ligand binding is checked by various scoring functions.
    The goal of molecular docking is to examine feasible binding of genome having
    specific ligand with a target whose'
  merge: -1
  img_proc: true
- pgno: 141
  md: '3D structure is known [38]. There are three basic features that need to be
    accomplished in docking:


    +   - depiction of the binding site,

    +   - ligand fixing with the specific binding region, and

    +   - assessing the energy of interaction between a specific ligand–receptor complex
    [39].


    Pharmacophore modeling is required as a preliminary step in many cases before
    going for molecular docking. Pharmacophore is a 3D arrangement of functional groups
    having a molecular structure. Pharmacophore modeling refers to generating a model
    of the specific conformation of active functional groups which is derived from
    a set of known ligands that are selected for a target [40]. This model depends
    upon steric and electronic features. It uses algorithms that encompass the following
    steps: input, conformational search, feature extraction, representation of structure,
    pattern identification, and scoring [41]. It is generally used to select hits
    for docking studies. Scoring functions are mathematical tools by which binding
    affinity of two molecules is predicted after they are docked.


    # 7.3.1 DOCKING PARAMETERS


    Docking has a large number of input parameters based on its functionality. We
