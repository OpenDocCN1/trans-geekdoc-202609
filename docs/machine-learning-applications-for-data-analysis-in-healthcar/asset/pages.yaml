  md: '# 8.1.3 PIVOTAL INFRASTRUCTURE


    It is possible to monitor the physiological conditions of the body with wearable
    sensors. Vital indications including body temperature, heart rate, and breathing
    rate can all be measured by the sensors. It is possible to add more blood pressure
    and blood oxygen sensors. The information from the sensor nodes is processed by
    a central node before being sent outside to another site. A specialized central
    node that only performs one function is preferred to reduce power consumption.


    Healthcare is only now beginning to use artificial intelligence (AI) and related
    technologies. AI has already been proven to function at least as well as humans
    at critical healthcare tasks. AI is made up of a variety of distinct technologies.
    Digital data can be shared and recorded via blockchain technology without being
    altered.


    # 8.2 CURRENT STATUS OF RESEARCH AND DEVELOPMENT IN SMART HEALTHCARE SYTEMS


    Lots of research work is going on in the field of smart healthcare systems and
    their development. Chen et al. [1] worked on handling the emergency situation
    of patients and proposed the edge-cognitive-computing-based (ECC-based) smart
    healthcare system. Using cognitive computing, this system can track and examine
    the physical health of its users. Additionally, it adjusts each user’s health-risk
    grade when allocating computer resources throughout the entire edge computing
    network. The results of the trials demonstrate that the ECC-based healthcare system
    offers a better user experience, efficiently utilizes computing resources, and
    dramatically increases patient survival rates in an unexpected emergency. Uddin
    [2] suggested a smart system to monitor the patient’s activities without hospitalization
    and it is possible with the use of new technologies such as the Internet of Things
    (IoT), Edge of Things, and Cloud of Things. Recurrent neural network (RNN) technology
    on an edge device is used in this work to present a wearable sensor-based system
    for activity prediction (i.e., personal computer or laptop). The system’s input
    data come from a variety of wearable healthcare sensors, including magnetometer,
    accelerometer, gyroscope, and electrocardiography sensors. An RNN is then trained
    using the features. The RNN that has been trained is utilized to forecast the
    activities. In order to provide older persons, patients, and individuals with
    disabilities with a simple control system, Ismail et al. [3] presented an effective
    method based on voice recognition. To quickly access'
  merge: -1
  img_proc: true
