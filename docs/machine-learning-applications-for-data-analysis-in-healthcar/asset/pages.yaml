- pgno: 199
  md: '# Bow-Tie Construction from Accident Narratives: A Text-Mining Approach


    ASHISH GARG, SOUVIK DAS*, AMARDEEP KUMAR, and J. MAITI


    Indian Institute of Technology, Kharagpur, West Bengal, India


    # ABSTRACT


    In this chapter, we propose an integrated natural language processing (NLP) and
    the Bow-tie-based risk assessment method to analyze the accident or incident reports
    for providing preventive and protective actions to the organization. Over 500
    accident/incident text narratives of distinct scenarios of workers at different
    working sites in an organization were collected. We first applied the custom-trained
    named entity recognition model and found out the objects involved and the potential
    root cause of the accident or incident from each of the text narratives. Second,
    using the elbow method, it is found that 4–6 clusters of root causes can be created.
    Then, the root causes are classified into four categories namely, human factors,
    component factors, management factors, and environmental factors, using term frequency–inverse
    document frequency vectorizer and linear support vector classifier. In order to
    visualize these accidents/incidents, root causes, and their categories, bow-tie
    methodology is applied. The preventive and protective barriers have been suggested
    for each potential top event. Thus, this work provides a qualitative risk assessment
    method to manage future risk events.'
  merge: -1
  img_proc: true
