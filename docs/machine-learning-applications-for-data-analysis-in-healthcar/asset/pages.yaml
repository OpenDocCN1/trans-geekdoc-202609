    chapter with a grid on them. The grid work on ECG recordings is made up of numerous
    small 1 mm square blocks. Each of these little boxes lasts around 40 ms. The transthoracic
    interpretation of electrical heart activity over time is known as ECG. Assessment
    of the ECG signal signifies the heart health. For the diagnosis of heart disorders,
