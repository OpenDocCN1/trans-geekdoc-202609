    # 11.2 LITERATURE REVIEW


    Nowadays every industry wants to improve its safety performance by reducing the
    number of accidents or incidents. For this purpose, it is necessary to record
    and analyze the accidents/incidents/near-misses. In this direction, several researches
    are conducted in the past decade using the NLP methods. For example [2], presented
    naïve Bayesian modeling division compensation that includes claims for work-related
    injuries. The proposed model achieved almost 90% of accuracy, but the accuracy
    of the applications is limited to the categories of injuries. Taylor et al. [12]
    used the naïve Bayesian model and fuzzy model to differentiate the effects of
    the damage. Tixier et al. [13] used stochastic gradient tree boosting algorithms
    and random forest (RF) to predict the type of root cause, type of injury, affected
    body part, and severity of injury at the construction site to analyze construction-related
    risks. Probability Rank Skill Score for risk analysis is rated in the range of
    0.236–0.436. Tixier et al. [14] suggested an NLP approach to extract the information
    from the preliminary reports of random injuries and receive 0.95 accuracies, but
    the proposed method did not work in'
