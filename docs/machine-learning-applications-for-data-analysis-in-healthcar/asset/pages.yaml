    # ABSTRACT


    The emerging technologies such as artificial intelligence (AI), the Internet of
    Things (IoT), blockchain, 3D printing, and 5G networking (referred as AIB35) in
    the context of “smart healthcare” are being greatly explored by “smart healthcare”
    providers to move forward in an all-encompassing manner. The field of healthcare
    requires scientists to implement intelligent solutions into the daily routines
    of “smart aging” patients to improve the efficiency and precision of diagnostic
    and therapeutic procedures. The concept of “smart aging” refers to a program that
    makes it possible for elders to have a superior quality of life by embracing high-end
    technology solutions to diagnosis and disease. Healthcare technologies are a wide
    range of innovations, including connected devices, appliances, and procedures,
    as well as drugs, medicine, and vaccine that improve the level and quality of
    care provided at economic cost structures. The purpose of this study is to first
    present a listing of the principal technologies that underpin “smart healthcare,”
    and then to present it in several significant domains. After that, we elaborate
    on the issues that now exist with smart healthcare and attempt to provide potential
    solutions to these issues. In the final part of this chapter, we take a glance
    into the road ahead and assess the prospects of smart healthcare toward building
    a smart society 5.0.'
