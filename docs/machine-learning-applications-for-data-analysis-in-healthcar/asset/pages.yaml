    matching distances d₁ and d₂ from local and global features combine according
    to the matching weight rule and this algorithm achieved EER as low as 0.402%.


    In Ref. [13], the author tried to extract the orientation feature from the FKP
    image using a Gabor filter bank having five different scales and eight different
    orientations and keeping all other parameters constant. Further, the author applied
    the PCA for feature dimension reduction. Since a combination of PCA and LDA provides
