  md: '# 12.3 BIOMETRIC SYSTEM BASIC BLOCK DIAGRAM


    Originally, the biometric system is a pattern recognition system that obtains
    the biometric data from an individual, draws out a primary characteristic set
    from the data, differentiates this characteristic set against the characteristic
    set(s) reserved in the database, and results in a decision based on the differentiation.


    A biometric system thus has the following basic modules: a raw data acquisition
    module, a quality improvement module (preprocessing module), a matching module,
    feature extraction module, and a database module. Figure 12.1 describes the basic
    block diagram of the biometric system.


    ![](img/e7e1b4040cce350b0d1520d1f0df754d_224_0.png)


    FIGURE 12.1 Basic block diagram of biometric system.


    # 12.3.1 DATA ACQUISITION


    Raw data from the individual may be obtained by using an appropriate sensor, a
    camera,or a scanner. This module must be capable of acquiring good-quality images
    for the biometric system to provide good performance.


    # 12.3.2 PREPROCESSING


    The function of this module is to assess the quality of the raw data obtained
    from the previous stage. Any preprocessing algorithm may be applied to the raw
    data to enhance itsquality so that it is suitable for feature extraction.


    # 12.3.3 FEATURE EXTRACTION


    Next, a suitable algorithm is applied to the preprocessed image to extract the
    features (a compact representation of the preprocessed image) that can'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'be used to uniquely identify a person. The extracted features are stored as
    templates in the database.


    # 12.3.4 MATCHING


    For a given test or a query image, the features are extracted and are compared
    with the reserved templates of the database to measure the level of closeness
    between the template and the extracted features of the clamming person. A decision
    is then made as to whether the individual or the user is a genuine (authorized
    or enrolled user) or an impostor(unauthorized user) depending on the observed
    closeness measure.


    # 12.3.5 DATABASE


    The feature set extracted from the raw biometric data (i.e., the template) is
    stored in the database along with some additional information (such as name, Personal
    Identification Number, address, etc.) representing the user.


    # 12.4 HARDWARE IMPLEMENTATION AS IOT DEVICE


