  md: '# 11.1 INTRODUCTION


    Accidents or incidents are common in manufacturing and other industries. As stated
    by the International Labor Organization, more than 27.8 million occupational workers
    die every year due to accidents [10]. One of the major reasons which lead to fatal
    accidents is the availability of hazardous materials like oil, flammable gas,
    and so on [6, 9, 11]. These occupational accidents affect the entire organization
    in different ways; hence stakeholders’ safety should be of utmost priority in
    any industry.


    Nowadays in the era of Industry 4.0, industries are collecting ample amounts of
    data through various means. However, it is difficult to get structured data easily.
    Also, the value of the data comes from the analysis and insights generated. In
    manufacturing industries, it is common to find accident or incident reports. These
    reports are prepared after the accidents by the inspecting agency in conjunction
    with the witnesses of the accident or incident. Analysis of these accidents or
    incident reports may provide some great insights or hidden causes of accidents
    or incidents that may be helpful in reducing the risk in the future. For example,
    suppose after analyzing accidents reports, it is found that irregular inspection
    of machines before their day-to-day operation is one of the measure causes of
    the accidents. These findings may lead to making regular inspection as a compulsory
    element of standard operating procedures of operations on machines.


    The research on the analysis of the accident/incident reports in the manufacturing
    industries is at its infancy. These researches are mainly focused on natural language
    processing (NLP)-based tools and techniques. However, integration of quantitative
    risk assessment techniques such as bow-tie analysis with the NLP is rarely been
    observed in the literature. Bow-tie is a graphical tool combining fault tree and
    event tree. A fault tree is drawn from top to bottom and quantitatively analyzed
    from bottom to top, whereas an event tree is useful in analyzing the risk control
    measures, that is, safety barriers and the accident consequences. Bow-tie is a
    highly useful to identify the root causes of any accident and finding the connections
    between risk control systems. Hence, the motive for this work is to analyze the
    accident reports with the help of the NLP and the bow-tie analysis. The combination
    of the results of the text narratives analysis and the bow-tie model provides
    an improved analysis and better insights. Here, first the preprocessing of the
    text'
  merge: -1
  img_proc: true
