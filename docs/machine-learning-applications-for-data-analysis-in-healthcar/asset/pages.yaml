    # 10.1 INTRODUCTION


    Electrocardiogram (ECG) measures heart activity in the electrical form. It is
    a visual representation of the biopotential''s variation throughout time. Leads
    are attached to certain parts in body to record (ECG) on the graph of the chapter
    or a computer monitor, depending on the application. Human heart has four chambers:
    right, left atrium, left, and right ventricular [1, 2]. The upper two chambers
    are atria, and the bottom two are ventricles. The sino atria node in the right
    atrium, where the heartbeat normally starts, is responsible for transmitting electrical
    signals across the heart. The atrio-ventricular (AV) node receives this signal
    as it travels from the atria [3–5]. The lower chamber’s ventricles, which contain
    a network of fibers that channel electricity and convey impulses to all of its
    parts, are connected to the AV node. This path of propagation must be accurately
    traced to make sure the heart is working right. Figure 10.1 depicts an overview
    of the ECG classification process.


