    # ABSTRACT


    Depression is a widespread mental health issue affecting over 264 million people
    worldwide. It is characterized by fluctuating mood changes and emotional responses
    that can be short-term or long-lasting. When untreated, depression can significantly
    disrupt daily functioning and reduce a person’s potential, sometimes becoming
    as debilitating as a physical illness. Timely diagnosis and treatment are crucial
    for managing depression. While there are several mental health apps available,
    many of them have premium features, making them inaccessible to users who cannot
    afford the costs. One such app, Mood Path, tracks mood patterns and offers health
    assessments to help users manage negative thoughts, focusing on mindfulness skills
    rather than physical exercises. In contrast, our app takes a more comprehensive
    approach by analyzing user inputs and recommending tailored treatments. It is
    free to use, serving as an accessible eHealth tool for individuals dealing with
    depression. The app emphasizes treatment and recovery, offering a user-friendly
    interface that allows easy interaction in everyday language. To ensure the app
    remains beneficial, it includes scheduled treatments to help users manage their
    anxiety and negative thoughts. This approach minimizes the risk of overuse while
    promoting long-term mental health improvement.'
  merge: -1
  img_proc: true
