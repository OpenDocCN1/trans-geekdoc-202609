    # 10.3.1.2 SHORT-TIME FOURIER TRANSFORM (STFT)


    The windowed-Fourier transform, commonly known as the short-time Fourier transform
    (STFT), was first introduced by Dennis Gabor in 1946 and thereafter referred to
    as the Gabor transform [28]. This was developed so that FFT could overcome this
    limitation. Time and frequency information is contained in STFT. It determines
    the signal''s sinusoidal frequency and time-varying phase content. In comparison
    to other methods of time-frequency analysis, the STFT-based spectrogram is an
    easy and efficient process. It is a simple method for slicing the desired waveform
    into different short segments. Then, it uses the conventional Fourier transform
    to analyze each segment. A window function is used on a block of information to
    separate it from the rest of the waveform, and then the Fourier transform is used
    on that piece of data.


    This can be represented with a spectrogram or the STFT. The definition of STFT
    for a signal x(t) can be found in Equation 10.2 as follows:


    ```

    X(r, f_2) = \int \frac{T}{2} x(t)w(t-re-2\pi ift)dt \quad (10.2)

    ```


    where characteristics of high frequency are represented by T. Contrary to STFT,
    continuous wavelet transform (CWT) is not restricted to sinusoidal analytical
    functions. It is possible to select localized waveforms that adhere to mathematical
    standards [29].


    Signal x(t) CWT is provided by Equation 10.3. The STFT, where w(t) is a window
    with duration T and is centered at time point t, is the Fourier transform of the
    windowed signal x(t)w(t - \tau) [16].


    ```

    W(a, b) = \frac{1}{\sqrt{a}} \int f(t) h \times (\frac{t-b}{a}) dt \quad (10.2)

    ```


    STFT''s time-frequency accuracy is not ideal. To overcome this, a better technique
    is used.'
