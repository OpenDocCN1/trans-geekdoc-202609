    # 1.4.2.1 HANDLING MISSING VALUES


    We saw in Table 1.1 that a lot of features had null values. The number of missing
    values in any of the columns did not exceed 25%. So, they were to be filled in
    order to avoid any decay in accuracy or any biased behavior. So, keeping this
    in mind, the data were divided into two parts based on its outcome “alive” or
    “dead” which were denoted by “0” and “1,” respectively, in the outcome or the
    target column. Then all the missing feature values of each separated outcome data
    were handled using Simple Imputer having its strategy attributefixed to “mean”
    which means “mean” of their respective feature columns. After handling all the
    missing values, the datasets were concatenated and finally the outcome or target
    column was separated from the dataset.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 1.4.2.2 BALANCING DATA


    As we can perceive from the data presented in Figure 1.3, we can see that our
    data are highly unbalanced with a ratio of approximately 1:6 for death to alive
    respectively. So, this means that our data are highly imbalanced and there is
    a need for balancing the data to avoid any chances of model biasing toward the
    majority class and hence deteriorating the overall performance of the model. This
    study of the dataset implies that we need to balance our data to achieve prime
    performance from our model. As we know, there are two ways to perform data balancing
    procedures one of that is undersampling, which randomly chooses the data of majority
    class and deletes it until both our data are equal and second technique is oversampling,
    which increases the data of minority class by making copies of the data present
    in it and hence increasing it until both data becomes equal. We rejected the undersampling
    technique because while deleting the data values, it might delete some data which
    carry meaningful insights toward the result formation of the model so we chose
    an oversampling technique and balanced our data using SMOTE. After applying SMOTE,
    the data distribution is presented in Table 1.2.


    ![](img/e7e1b4040cce350b0d1520d1f0df754d_40_0.png)'
  merge: -1
  img_proc: true
