    # Praveen Kumar Shukla, PhD

    Associate Professor, Department of IoT & Intelligent Systems, Manipal University
    Jaipur, Jaipur, Rajasthan, India


    Dr. Praveen Kumar Shukla graduated in 2012 from Lakshmi Narain College of Technology
    & Science, Bhopal. He earned his Master of Technology in Control and Automation
    Engineering from VIT, Vellore, in 2015 and completed his PhD in Brain-Computer
    Interfacing in 2021 from the National Institute of Technology (NIT), Raipur, India.
    In 2024, he completed his Postdoctoral Fellowship at the Indian Institute of Technology
    (IIT), Gandhinagar. With over 8 years of academic and research experience, Dr.
    Shukla currently serves as an Associate Professor (Selection Grade) in the Department
    of IoT & IS Engineering at Manipal University Jaipur. He has been awarded a research
    grant of ₹41 lakh from the Department of Science and Technology (DST) under the
    ASEAN-India Collaborative R&D Scheme. Dr. Shukla has an impressive research portfolio
    with over 45 publications in reputed journals, conferences, and book chapters
    spanning areas such as Brain-Computer Interfacing, Medical Image Processing, Data
    Mining, Machine Learning, and Deep Learning. Additionally, he has published six
    patents, three of which are granted, and has edited a book. He is actively involved
    in mentoring students, currently supervising two PhD scholars, three M.Tech students,
    and 15 B.Tech students. To date, he has successfully supervised 20 B.Tech and
    M.Tech candidates. Dr. Shukla also contributes as a reviewer for esteemed journals,
    including the IEEE Journal of Biomedical and Health Informatics and Disability
    and Rehabilitation: Assistive Technology.


    ![](img/e7e1b4040cce350b0d1520d1f0df754d_7_1.png)


