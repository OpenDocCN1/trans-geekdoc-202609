    # Finger Knuckle Print of an Emerging Person Recognition Trait for Online Applications


    BRAJESH KUMAR SINGH¹*, ANIL KUMAR², and SUDESHNA CHAKRABORTY²


    ¹Department of Electronics and Communication Engineering, Galgotias college of
    Engineering and Technology, Greater Noida, Uttar Pradesh ²Department of Computer
