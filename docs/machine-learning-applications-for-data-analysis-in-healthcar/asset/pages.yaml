    Hospital Association in October 2016, total annual spending on prescription medications
    had reached $309.5 billion, making it the fastest-growing component of the US
    healthcare economy. Alarmingly, a significant portion of this spending is wasted.
    It is estimated that up to 50% of the 3.2 billion prescriptions written each year
    in the United States are not taken as directed—if they are taken at all. Medication
    nonadherence results in over $250 billion in unnecessary healthcare costs annually,
    accounting for approximately 13% of the United States’ total yearly healthcare
    expenditure. Just as pharmaceutical companies use algorithmic tools to enhance
    patient targeting, healthcare providers (HCPs) can leverage similar AI-based systems
    to address this issue by identifying patients most at risk of nonadherence. Factors
    such as socioeconomic status, insurance coverage, out-of-pocket costs, and the
