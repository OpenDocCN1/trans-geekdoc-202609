    # ## ABSTRACT


    Smart healthcare systems are the exigency of the present healthcare situation.
    Health services can be administered in a systematic and successful manner with
    smart healthcare records. Healthcare systems integrating smart blockchain, artificial
    intelligence enhancement, and Internet of Things (IoT) support help doctors to
    devote more time to patient care and reduce their need to search for clinical
    information. In today’s world, patients need to travel abroad to see their doctors
    for better treatment but during treatment they face many issues; smart healthcare
    records may help to reduce such issues. Within the healthcare framework, blockchain
    network serves as the platform for storing and exchanging patient data across
    hospitals, diagnostic labs, pharmaceutical firms, and medical practitioners. Blockchain
    applications enable the accurate identification of critical fraudulent activities.
    It presents an exclusive data storage framework that ensures maximum security,
    alleviating concerns regarding data tampering. This chapter presents a review
    on the exigency'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'of smart healthcare systems in the current era, the technologies involved to
    build such smart healthcare systems, current research work to produce smart healthcare
    systems, and further research directions to enhance such systems for further benefits.
    Researchers may benefit from analyzing further research directions in this field.


    # 8.1 INTRODUCTION


    Human health conditions are crucial to maintain and necessary to improve human
    pleasure and social progress. It is also essential to the advancement of the economy
    of the country. Every day, accidents, illnesses, and crises take place and the
    treatment and diagnosis of the disorders are anticipated. A health record is a
    compilation of clinical information regarding the patient’s physical and mental
    health, as determined by various sources. Nowadays, a patient’s medical history,
    current medications, examination, diagnosis, treatment, and lab test reports,
    warnings about allergies, and so on need to be maintained both manually and digitally.
    Smart healthcare systems will be able to transform it totally in digit prints.


    # 8.1.1 EXIGENCY OF SMART HEALTHCARE SYSTEMS


    The provision of healthcare is vital to life. There must be a method to ease the
    burden on the healthcare system. This industry has been slow to adopt new technologies
    because of the complexity of the system. Due to the enormous influence that even
    the tiniest acts may have in this industry, as well as the sheer number of stakeholders
    and invested parties, every move must be carefully considered. However, as the
    world continues to improve with smart technology, healthcare has also turned into
    a proactive adopter of technology. Due to the significant contribution of advanced
    technology, increasing patient safety and lowering healthcare costs such systems
    are now becoming the current need. The healthcare sector may benefit from quickly
    expanding research and technology since it is primarily data driven. In some cases,
    doctors all around the world use pens to make handwritten notes and store the
    information offline in massive stacks, which make it difficult to access important
    information when needed. Such situations created requirements for smart/advanced
    healthcare systems.'
  merge: -1
  img_proc: true
