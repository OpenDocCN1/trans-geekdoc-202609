    and have formed the basis for drug designing according to its structure. SBDD
    is a speedy process for the lead optimization and discovery as it governs the
    three-dimensional structure of the receptor protein and houses the information
    about the illness at a molecular basis [13]. Most of the computational techniques
    like molecular simulations, molecular docking, and SBDD are most commonly used
