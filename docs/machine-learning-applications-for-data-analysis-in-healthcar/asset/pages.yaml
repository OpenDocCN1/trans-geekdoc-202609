    is presented. It is used to denoise the ECG signal in the wavelet domain while
    preserving peak signal amplitudes that are close to their full values. The wavelet-based
    denoised ECG readings maintain the original diagnostic information [19]. Graph-based
    attention model uses an attention technique to describe a medical idea as a composite
