    # **Sudeshna Chakraborty, PhD**

    Professor, Department of Computer Science and Engineering, Galgotias University,
    Greater Noida,

    Uttar Pradesh, India


    Dr. Sudeshna Chakraborty is currently Professor and Research Group Head of data
    analytics and deep learning at the Department of Computer Science Engineering
    at Galgotias University, Greater Noida, Uttar Pradesh, India. She has over 20
    years of rich academic and industry experience. She has acquired several awards
    as a distinguished professor, including a research excellence award, Engineers
    Award by the Institute of Engineers of India, amongst others. She has also been
    a keynote speaker, an organizing member of international conferences, a member
    of review committees, session chair with the Institute of Engineers, speaker at
    InSc- and AICTE Training and Learning (ATAL) Academy-sponsored and other faculty
    development programs, etc. She has filed eight patents in the field of robotic,
    solar energy, and sensors. She has chaired an IEEE conference in Paris, including
    International Conference on Advances in Computing and Communication Engineering
    (ICACCE) , International Conference on Innovative Computing and Communication
    (ICICC), International Conference on Cyber Security and Artificial Intelligence
    (ICCSAI), and International Conference on Structures and Architecture (ICS42025)
    (ICS24). Dr. Chakraborty has been instrumental in various industrial interfacing
    for both academics and researchers at her previous assignments at various organizations
    (Sharda University, ManavRachna University, Mumbai University, Lingaya’s, Institute
    of Chartered Financial Analysts of India [ICFAI], and others). She has over 150
    publications in Scopus and SCI-indexed high-impact journals and international
    conferences. She has published 20 patents, five of which have been granted. She
    is guiding five PhD scholars at various universities, two of whom have successfully
    completed their PhDs, along with several post- and undergraduate students. At
    the same time, she has earned prestigious accreditations from'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'NAAC, NBA, QAA, WASC, UGC, IAU, IET, and others. She holds MTech and PhD degrees
    in Computer Science and Engineering, and her area of expertise is neural network
    and semantic web engineering.


    ![](img/e7e1b4040cce350b0d1520d1f0df754d_6_0.png)


    # Jyotsna Singh, PhD


    Director (I/c) SVKM''s NMIMS Chandigarh and Associate Dean, STME, NMIMS Chandigarh,
    India


    Dr. Jyotsna Singh is a BE, MTech, and PhD holder with over 22 years of experience
    in the education industry. She has held several senior academic and administrative
    positions such as Director, Deputy


    Dean Students, Kurukshetra, NorthCap University, Amity University, Lloyd Group,
    IIILM, among others.


    She is currently serving as the Director (I/C), NMIMS Chandigarh, and Associate
    Dean, School of Engineering and Technology, NMIMS Chandigarh Campus.


    Dr. Singh specializes in Computer Science and Engineering and holds professional
    certifications in Data Science, Python, Machine Learning, Artificial Intelligence,
    Computational Thinking, and Strategic Mindset from reputed institutions such as
    Wipro, IBM, Deeplearning.AI, University of Pennsylvania, and University of Michigan.
    She also completed a certification in High Impact Teaching Skills organized by
    Wipro and attested by Dale Carnegie & Associates.


    In her illustrious career, she has led various workshops, undertaken government-funded
    projects, and launched several university-level initiatives. She has presented
    and published high-quality research in reputed journals and conferences and is
    proficient in programming languages such as C, C++, Python, among others.


    She has also filed over five patents in the areas of AI, IoT, and smart systems.


    An accomplished author, she has several departmental books to her credit, including
    Lab Manual on Software Project Management, FOCP, and Data Structures. Her contributions
    to the academic world were recognized when she received the “Torchbearer of Education”
    award in 2020 from Coding Ninjas.'
