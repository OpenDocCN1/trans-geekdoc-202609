    # ## 4.3 CHALLENGES


    +   - Other body sounds, such as muscle activity, were difficult to distinguish
    from articular cartilage sounds. Knee radiographic images are extremely sensitive
    to unintended defects, which can complicate the study of bone structures. It is
    possible that the experts will take more time to analyze the knee X-ray and determine
    the presence of OA.


    +   - Hand-drawn contours and joint area cropping are used for the region of interest
    segmentation, which is tedious and time-consuming.


    +   - The primary cause of geometric distortions of the cartilage region in knee
    X-ray images is the progression of OA, which may be misrepresented due to image
    acquisition filming, handling, and digitization.


    +   - Extraction of significant regions from such distorted images may become
    difficult.


    +   - It is also difficult to recover the relevant region when images are distorted
    due to geometric deformation.'
