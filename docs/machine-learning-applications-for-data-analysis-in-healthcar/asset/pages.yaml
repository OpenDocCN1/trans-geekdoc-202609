  md: 'and transfer it to another location outside. To minimize power usage, a specialized
    central node that only performs one task is preferable.


    All sensors are possibly compact, transportable, and wearable through advanced
    technology. Patients now have a nonintrusive, comfortable solution that can track
    their health continuously. Patients may be more open to employ health monitoring
    technology through smart healthcare systems. Such systems can be made more useful
    if cameras or implantable sensors are attached to take updated information about
    patients. Short-range connections, like Bluetooth, are recommended by current
    models for sending sensor data to smartphones for processing. The patient’s processed
    information can subsequently be transferred to the healthcare practitioner, usually
    a doctor, using SMS or the Internet using long-range connections like long-term
    evolution. The main drawback of using cell-phones for healthcare updates is the
    battery life. Cellphones frequently need to be recharged because of their short
    battery life; a patient with a dead battery would not be connected to health practitioners.


    Patient physiological data are monitored and collected using sensors and the patient
    is identified using a radio frequency identification (RFID) tag. This IoT-based
    RFID healthcare monitoring device allows for the collection of physiological data
    from hospital patients and elderly people. Ambient sensors can detect the physical
    parameters of the surroundings, like the presence of toxic agents, humidity, and
    temperature could be used to assess the environmental parameters and analyze their
    relation with the person’s health (Figure 8.1).


