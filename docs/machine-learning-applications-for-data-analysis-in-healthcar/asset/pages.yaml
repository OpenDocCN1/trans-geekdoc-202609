    SVM, HGB, GNB, BNB, KNN, RF, and DT algorithms using the training data and then
    tested our models on the testing split of both the balanced and unbalanced dataset
    and then evaluated the performance of each model using seven different performance
    evaluation matrices such as receiver operating characteristic–area under the curve
    (ROC–AUC)'
