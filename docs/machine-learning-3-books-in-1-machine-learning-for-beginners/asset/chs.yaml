- "# 机器学习：3本合一 机器学习初学者指南、商业用人工智能与机器学习、网络初学者指南\n\n\n\n![](img/image8.jpg)\n![](img/image8.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 路由\n\n\n\n\n\n\n机器学习在过去几年中因其改变世界的应用而蓬勃发展，但它的历史可以追溯到半个世纪以前。A.\
  \ L. Samuel 因创造这一术语而闻名。他传达出，如果一台机器可以在不涉及任何编程的情况下自我学习，就可以被称为机器学习。这呈指数级地提高了它的效率，并成为人类对世界的最伟大发明之一。如今，你没有敏锐察觉的每一个微小事情都与人工智能及其相关领域有关，这些领域已经深度渗透到社会。\n\
  \n在详细讨论机器学习之前，有一个小故事需要说明。很久以前，IBM 开发了一项自学的国际跳棋程序，它能够通过分析大量对局来逐渐识别当前游戏中的优坏棋子，从而提高游戏水平并迅速击败了著名的萨缪尔国际跳棋选手。1956\
  \ 年，他受人工智能之父、1971 年图灵奖得者约翰·约翰·麦卡锡的邀请，在达特茅斯会议上展示这项工作，这标志着人工智能领域的诞生。\n\nSamuel 确保了人们理解机器学习的重要性及其能够改变人类的巨大应用范围。在他关于机器学习经验的研究论文于\
  \ 1959 年在《IRM 杂志》上正式发表后，知识工程之父、1994 年图灵奖得者 Edward Feigenbaum 编写了他的巨著 `Compilers`；而在\
  \ 1961 年，Samuel 受邀请提供了程序游戏中最佳对局的示例。于是，Samuel 机会挑战了康涅狄格州的国际跳棋冠军（当时当时的美国第四名选手）。该程序获胜了，在当时的科技行业引起了轰动，并让人们开始认真对待人工智能。\n\
  \nSamuel 的跳棋程序不仅对人工智能产生了巨大影响，对整个计算机科学的发展也有此。计算机科学早期的研究表明，计算机无法执行预先明确编程的任务，这一假设被\
  \ Samuel 的跳棋程序所反驳。此外，该程序是最早在计算机上执行非数值计算任务的程序之一。它的逻辑指令设计极大影响了 `IBM Computer` 的指令集，并很快被其他计算机设计者采用。\n\
  \n## 机器学习的详细发展\n\n全球范围内教授和科学家的大量合作使机器学习在非常短的时间内就繁荣起来。在 20 世纪 50 年代到 70 年代初，当人工智能研究处于推理阶段时，人们认为如果给机器以逻辑推理的能力，它们就是智能的。这一阶段的代表性工作主要是\
  \ A. Newell 和 H. Simon 的 `Logic Theorist` 程序，随后，设计的 `General Problem Solver` 程序以及许多其他程序在当时取得了令人鼓舞的结果。例如，逻辑理论家程序在\
  \ 1952 年证明了著名数学家 Russell 和 Alfred North Whitehead 合著的《数学原理》中的 38 个定理，并在 1963 年证明了全部\
  \ 52 个定理。\n\n然而，随着研究的发展，人们逐渐意识到人工智能不能仅通过逻辑推理来实现。E. A. Feigenbaum 等人认为，要让机器变得智能，它必须以某种方式知道大量信息并像人类一样思考。在他们的倡导下，从\
  \ 20 世纪 70 年代中期开始，人工智能研究进入了知识时期。在此期间，开发了大量的专家系统并在应用领域取得了成果。E. A. Feigenbaum 于 1994\
  \ 年作为知识工程之父获得图灵奖。然而，人们逐渐意识到专家系统面临知识工程瓶颈。简而言之，人类很难总结知识并将其教给计算机。因此，一些学者认为，如果机器能够自主学习，就会产生理想的结果，并让计算机学会像人类一样思考。\n\
  \n## 机器学习的定义\n\n用通俗的英语来说，计算机从经验中学习并在某些方面变得更优秀。通过机器学习先驱和伟大天才的定义，我们可以总结自己的理解，得出一个机器学习的有效表达：它在不需要任何有效指令的情况下自我学习，但通过大量数据帮助机器像人类一样思考。通过对定义的这种理解，我们可以得出结论，以下是机器学习最重要的方面：\n\
  \n- **数据**：经验最终被转化为计算机可以理解的数据，以便它可以从已理解的内容中学习。谁拥有最多最高质量的数据，谁在机器学习和人工智能中就拥有最大的影响力。用人类来类比，数据就像我们的教育环境，而变聪明最重要的方面之一就是接受良好的教育。因此，从这个意义上说，像\
  \ Google 这样的互联网公司能够开发出良好的机器学习程序，是因为他们可以从用户那里收集海量数据。\n- **模型**：即 `Algorithm` 是机器学习应用主要的来源或路径。数据可以帮助我们建立理想的完美模型。当我们使用这些无限的数据对其进行训练时，会有丰硕的结果，即机器的改进。在使用大量数据训练后，该模型成为了机器学习的核心，使模型成为决策的枢纽。一个训练良好的模型在输入新事件时，会做出相应的响应，产生高质量的输出。\n\
  \n\n\n\n# 用日常生活实例解释机器学习\n\n在诞生半世纪后，得益于`摩尔定律`，随着计算机性能的提升和计算资源的廉价，机器学习的应用已变得越来越广泛。你可能没有察觉，但你的日常生活已经充满了人工智能、机器学习和基于深度学习的应用。现在，我们将通过一个详细的示例，来看看机器学习是如何与我们的生活紧密联系的。这将让你对该领域及其范围有一个简短但更详细的理解。\n\
  \n## 早间流程的整合\n\n当你早上醒来时，在 `iPhone` 上开启 `Siri`，在 `Android` 手机上打开 `Google Assistant`，或在\
  \ `Windows` 笔记本电脑上打开 `Cortana`，询问今天天气如何。`Siri` 会自动定位你所在的城市并显示天气信息。这个功能用起来简单，但背后的系统极其复杂。\n\
  \n其是`语音识别`，这是机器学习最早的应用之一，`Siri` 首先将你说的话转换为文字。如你所知，语音本质上是一系列振幅不同的波。为了将语音转换为文本，我们需要设计一个模型。首先，我们需要通过大量的语音输入来训练模型。当模型训练完成后，我们以语音作为输入，输入可以进一步处理来自各种来源的信息，并返回你要求的信息。语音识别自\
  \ 20 世纪 50 年代以来一直处于研究之中，其模型在不断演进。这种进化现在正使用`神经网络`和其他深度学习策略来获得更好的结果。\n\n另一个是`自然语言处理`，这是机器学习和人工智能的另一个重要方面。在`Siri`将语音转换为文本后，软件需要理解这些词以给出准确的答案。计算机理解词汇并非易事。首先，应该有一个大规模的`语料库`（Corpus）。其次，应该有一个相应的语言模型，然后通过`语料库`，你可以训练语言模型，使其能够理解部分的文本语义。对于自然语言处理和搜索引擎技术，你可以参考那些让高级数学变得易于理解且读起来有趣的书籍。\n\
  \n## 日常通勤与消费\n\n让我们回到起床的故事。当你洗漱完毕时，花点时间看看手机上的新闻，你可能会注意到下方有一个相机广告。就在前一天，你还和朋友聊过要买一台相机。你的手机自动理解了这一点，并向你推荐了你可能感兴趣的广告。点击它，会打开一个著名的电子商务网站。你看了价格和评价，然后买了一个实惠的产品。\n\
  \n接着，浏览新闻；你可以观察到新闻变得越来越具有“人性化”，会自动将你喜欢的新闻推到首页，诱导你阅读。当你终于准备好上班时，你坐在地铁上，打开音乐播放器，在\
  \ `Spotify` 中浏览你的音乐库，发现没有想听的歌曲，于是让系统向你推荐一些歌曲。这个推荐歌曲的系统对你来说非常可靠，因为它推荐了你从未听过的，且你一听就很喜欢。\n\
  \n## 推荐系统\n\n在对这一经历的描述中，背后的角色是`推荐系统`，它是机器学习的一个重要应用。`推荐系统`的核心是学习用户的使用习惯，然后刻画用户画像，并根据用户的画像推荐歌曲、文章以及用户可能感兴趣的任何其他信息源。\n\
  \n## 应用与演进\n\n然后，你来到工作场所，迎接你的是一个新的`人脸识别系统`，它能检测你的脸部并允许你进入办公室。最棒的一点是它能自动识别你并根据时间向你问候。目前，大多数最先进的人脸识别系统都是基于`深度学习模型`，利用复杂的模式来准确识别脸部。\n\
  \n数据挖掘如今被显式地用作贬义意义上的统计世界，因为传统研究倾向于关注理论的美感而非其实用性。但这种情况最近发生了变化，因为更多统计学家开始关注与人们使用机器学习的共同经验相关的问题。事实上，随着科学研究的基本手段从`理论\
  \ + 实验`转向`理论 + 计算`，甚至出现了`数据科学`一词，机器学习的重要性日益增加，因为计算的目的是数据分析；列列计算机科学与技术领域中最活跃、最著名的分支，机器学习必须是其中之一。\n\
  \n## 为什么机器学习对数据挖掘至关重要\n\n2006 年，`卡内基梅隆大学`宣布了世界上第一个`机器学习系`的成立，它是该领域的创立者。几年后，美国人对机器学习的发展产生了兴趣，`米切尔教授`成为首任主任。美国国家科学基金会在`加州大学伯伯克利分校`启动了一项强化计划，强调了大数据时代研究和整合的三项关键技术：`机器学习`、`云计算`和`众包`。\n\
  \n机器学习是大数据时代的本质核心技术，原因很简单：收集、存储和管理大数据的目的是利用它们，如果没有机器学习对其进行分析，这些数据就毫无用处。数据挖掘领域产生于\
  \ 20 世纪 90 年代，受许多领域的影响，其中机器学习和统计无疑是影响最大的。数据挖掘是从海量数据中挖掘知识，涉及对海量数据的管理和分析。通常，数据库的研究为数据挖掘提供了数据管理技术，而机器学习和统计的研究为数据挖掘提供了数据分析技术。从这个意义上说，统计主要通过机器学习影响数据挖掘；机器学习领域和数据库领域是数据挖掘的两大支撑。\n\
  \n今天，机器学习与普通人的生活息相关。例如，在天气预报、能源勘探和环境监测等领域，有效利用机器学习技术分析卫星和传感器的数据是实现更好预测和检测的有效方法。销售数据可以使用机器学习进行深度研究，客户信息不仅可以帮助企业优化库存和降低成本，还可以帮助他们为用户群体设计特定的营销策略。\n\
  \n## 更多示例\n\n众所周知，Google、Bing 等互联网引擎已开始改变人类的生活方式。例如，许多人已习惯在搜索前通过互联网了解目的地的信息，找到合适的地方。如果你想要另一个例子，交通事故是人类最致命的**杀手之一，全球范围内每年导致\
  \ 100 万人死亡，仅在我们国家就有 10 万死亡。理想的解决方案是让计算机驾驶自动汽车，因为机器可以确保在道路上不会出现疲劳驾驶、醉驾，而且具有重要的军事用途。\n\
  \n美国自 20 世纪 80 年代以来一直在该领域进行研究。最大的困难在于设计并程序考虑到在道路上可能遇到的所有情况。相反，车载传感器接收的信息可以作为输入，转向、刹车和油门的控制可以作为输出。那么，这里的关键问题就可以抽象为一个机器学习任务。\n\
  \n机器学习自那时一直是搜索的骨干。今天，搜索的对象和内容变得越来越复杂，机器学习技术的影响更加明显。例如，Google 和 Bing 在进行`图像搜索`时都在使用最新的机器学习技术。Google、Bing、Facebook\
  \ 等公司都建立了专门机器学习技术的团队。\n\n机器学习技术甚至影响了人类的社会和政治生活。\n\n\n\n\n# 机器学习概念\n\n- **监督学习（Supervised\
  \ Learning）**：计算机从大量已知的输入输出数据对中学习规律的过程，使其能够对新输入做出合理的输出预测。在我们现有的数据中，房屋价格数据具有不同的特征（面积、位置、朝向、开发商等）。通过学习这些数据，我们可以预测房屋某个已知特征的价格，这种方法被称为`Regression（回归）`学习，其输出是一个特定值，且预测模型是一个连续函数。另一个例子是，我们有大量的邮件，每封邮件都被标记为垃圾邮件。通过研究这些标记的邮件数据，可以开发出一个模型，能够准确判断新封邮件是否为垃圾邮件。这被称为`Classification（分类）`学习，其输出是离散的。输出\
  \ 1 表示是垃圾邮件，输出 0 表示不是垃圾邮件。\n\n- **无监督学习（Unsupervised Learning）**：可以隐含地理解为从无区别的数据中学习，以分析其内在特征和结构。像亚马逊这样的公司拥有海量的客户数据，我们利用这些数据来分析在其商店购物的不同客户类别。针对这个问题，我们最终能得到多少个类别？每个类别的特征是什么？我们对此并不知晓。这被称为`Clustering（聚类）`。监督学习中的类别与聚类之间有区别：我们已经知道存在哪些类别，而聚类是在分析数据之前不知道存在哪些类别的过程。也就是说，分类问题是从已知的答案中选择一个，而聚类问题的答案是未知的，需要`Algorithm（算法）`来挖掘数据的特征和结构。\n\
  \n这两类机器学习最大的区别在于，监督学习的训练数据有已知结果可以监控，而无监督学习的训练数据没有已知结果可以监控。\n\n## 用房屋价格评估系统解释机器学习概念\n\
  \n本节通过一个每个人在生活中都能联系示例，对机器学习的简单概念进行清晰的解释。假设我们要开发一个房屋价格评估系统，该系统的目标是房屋价格评估预测的已知特征。建立这样一个系统需要以下步骤：\n\
  \n### 1. 训练样本（Training Samples）\n我们需要大量不同的房屋特征以及相应的价格信息。你可以直接从房产评估中心获取这些信息，例如房屋的大小、地理位置、朝向、价格等。房地产评估中心可能提供也可能不其他类型的信息，例如房屋附近的学校（这是一个通常会影响房屋价格的特征），此时需要通过其他手段收集这些数据。这些数据被称为训练样本或数据集。房屋的大小、位置等被称为特征（features）。在数据获取阶段，需要收集许多可能需要的特征。特征集越完整，数据越多，训练出的模型就越准确，我们获得的结果也就越高。数据获取的成本也可以在这个过程中感受到。机器学习可以用于分析你来自各种来源的交易记录，并根据你的付款和债务给出信用评分。这个信用评分对于银行了解潜在风险欺诈非常重要，从而使金融交易更加透明。\n\
  \n### 2. 数据标记（Data Tagging）\n在房屋评估系统中，我们的房屋价格信息是从房屋评估中心获取的，这可能并不准确。有时，为了避税，房屋的评估价远低于房屋的实际交易价格。此时，需要通过一个称为数据标记的过程收集房屋的实际交易价格。标记可以是人工的，例如逐一询问房地产经纪人房屋的实际价格；也可以是自动化的，例如通过分析数据，找出房产评估中心对房屋的评估价与真实价格，然后通过各种复杂的算法直接计算。数据标记对于监督学习方法是必要的。例如，对于垃圾过滤系统，我们的训练样本必须包含信息是否为垃圾邮件的标记数据。数据对机器学习至关重要。如果没有充分或可靠的数据，结果将是荒谬且脱离现实的。\n\
  \n### 3. 数据清洗（Data Cleansing）\n假设我们收集房屋面积的数据，通常以平方米为单位。你需要收集这些数据并应用到你的房屋上。这个过程被称为数据清洗。数据清洗还涉及删除重复和噪声数据，并赋予其结构化的特征，以便于作为机器学习算法的输入。假设我们收集了数百个房屋特征，通过逐一分析这些特征，我们最终选择了三十个特征作为输入。这个过程被称为特征选择（feature\
  \ selection）。特征选择的方法之一是人工选择，即人们分析每个特征，然后根据另一个需求选择合适的特征集。另一种方法是通过模型自动完成，例如`PCA Algorithm（主成分算法）`。这个例子与机器学习的第一类相关，即处理最简单的线性方程模拟。我们需要选择哪种模型取决于问题领域、数据量、训练时间、模型准确性等。\n\
  \n### 4. 训练数据集（Training Data Sets）\n\n\n\n\n\n# 数据集与训练\n\n数据集主要有两种类型：一种用于训练，而另一种用于测试。它们通常按照\
  \ 8:2 或 7:3 的比例划分，然后训练数据集可以被灵活处理和使用，以帮助提高模型的有效性。训练完成后，就可以进行测试，以检查模型的有效准确率。\n\n为什么需要用单独的测试集进行测试？答案是为了确保测试的准确性，也就是说，使用模型未见过的数据对其进行测试，而不是使用用于训练模型的数据。在理论上，划分数据集更符合逻辑的方法是将其分为三部分，再加上一个交叉验证数据集。当模型生成时，我们需要一个过程来检查不同的条件，并对性能进行详尽的清单检查。\n\
  \n## 性能评估\n\n性能评估包括许多方面，如下：\n\n- **训练耗时**：训练模型所需的时间。对于某些大数据机器学习应用，训练一个模型可能需要一个月或更长时间，此时，算法的性能就变得至关重要。\n\
  - **数据量**：需要判断是否有足够的数据集。通常情况下，训练数据集越大，对于具有复杂特征的系统越有利。\n- **准确率**：确定模型的准确率，即新数据是否可以被准确预测。\n\
  - **应用需求**：我们需要确定模型是否能满足应用场景的性能要求。如果无法满足，我们需要优化模型，然后继续训练和评估模型，或者切换到其他模型。\n\n训练好的模型可以保存参数并在下次使用时直接加载。通常情况下，模型训练需要大量的计算和很长的时间，因为良好的模型参数需要在大型数据集上进行训练。然而，当模型在使用时，计算负载相对较小。通常，使用新样本作为输入，然后调用模型获取预测结果。\n\
  \n# 机器学习的范围\n\n2013 年 4 月是机器学习历史上的非凡的一天，因为工业 4.0 战略的概念首次被提出。工业 4.0 指的是由信息革命主导的智能制造或革命性的生产方法。该战略旨在通过使用不同的机器学习、深度学习和人工智能技术，以更快的技术进步来实现千年发展目标。虚拟系统与信息物理系统的结合将将把制造业推向智能化。\n\
  \n基于机器学习等智能技术的未来趋势，4.0 是一个未来的趋势，它由各种先进技术组成，如智能系统、分布式计算、五角形资源、具有准确预测的人脸识别、带有机器翻译的\
  \ OCR 识别以及精确的图像处理，并被认为将在未来几年内实现。\n\n2015 年 9 月，美国陆军医疗中心司令史蒂夫·琼斯将将在一次美军会议上表示，智能机器可以在战场上取代人类运输伤员。美军甚至发布了一项高调公告，未来士兵可能不再是战场上救援的对象，而是机器人，因为智能机器人军将取代人类。\n\
  \n直到 21 世纪，人工智能的“大爆炸”想法对于科幻小说作家来说似乎像是一个白日梦。今天，越来越多的人开始认真思考，当技术奇点到来时，人类将会发生什么？在科学技术的指数级增长中，战争期间人类防御似乎迫在眉睫。\n\
  \n这所在 Google、Autodesk 和 Genentech 支持下成立的大学拥有三个涵盖机器人、医学、生物技术、数据科学和治理的项目。云计算带来了强大的计算能力，大数据算法被广泛使用，尽管它们还不足以让计算机更智能。它们创建了大数据所需的强\
  \ AI，使机器能够从海量信息中学习，而云计算提供了廉价且接近人类大脑的强大计算能力。\n\n不久，机器学习将进入强 AI 时代，届时将出现能够推理和解决问题的真实智能机器。这些机器将具有意识和自我认知，拥有与人类同等的智能水平。\n\
  \n# 机器学习的应用\n\n机器学习被广泛使用；机器学习算法在军事和民用背景下都有部署。\n\n## 数据分析与挖掘\n\n数据挖掘和数据分析经常被并提提到，在许多情况下被视为同义词。数据分析指的是使用适当的统计方法对大量的原始信息和二手信息进行收集和分析；其目的是从数据中提取有用信息并形成结论，以便进行详尽的研究和总结过程。无论是数据分析还是数据挖掘，其目的都是帮助人们收集和分析数据，将其转化为信息并做出判断。\n\
  \n数据分析和挖掘技术是机器学习算法和数据访问技术的结果，利用机器学习提供的统计分析、知识发现等工具来分析海量数据。同时，数据访问机制用于实现高效的数据读写。机器学习在数据分析和挖掘中是不可替代的，2012\
  \ 年 `Hadoop` 进入机器学习领域使其变得更好。2012 年，`Cloudera` 购买了 `Myrrix` 以共同创建 `Big Learning`，从那时起，机器学习领域有了一个名为\
  \ `Hadoop` 的合作伙伴。\n\n廉价的硬件使得大数据分析变得简单，随着硬盘和 `CPUs` 变得廉价，以及开源数据库和计算框架趋成熟，初创公司甚至个人都可以进行\
  \ TB 级的复杂计算。`Myrrix` 是从 `Apache Mahout` 项目演变而来的基于机器学习的实时、可扩展聚类和推荐系统。\n\n其他大公司也在使用机器学习来分析数据，以提高其产品服务的质量。\n\
  - 微软：正式发布了 `Azure Machine learning` 平台，该平台已用于 `Xbox` 和 `Bing`，并支持 `R`、`Python`、`Hadoop`、`Spark`\
  \ 等。\n 福特：使用 AI 来调度工作并解决员工增加带来的调度问题。\n- 某些公司：使用神经网络深度学习进行虚拟药物筛选，试图取代或改进高通量筛选中使用的计算方法。\n\
  - 雅虎：使用机器学习算法挖掘 160 亿封邮件的数据，实验室的研究人员研究了 200 万人的 160 亿封邮件。\n\n## 分析用户行为\n\n`PayPal`\
  \ 使用机器学习打击欺诈，还利用机器学习和统计模型识别欺诈，并使用更复杂的算法来过滤交易。\n\n`AWS` 已向欧洲开发者开放了机器学习服务，可以通过 `Dublin\
  \ AWS` 区域使用，公司预计 `Amazon` 的机器学习将帮助解决局限问题，并且所有的分析和预测将在欧洲完成，绝不离开该地区。\n\n## 模式识别\n\n\
  \n\n\n源于工程的模式识别与源于计算机科学的机器学习相结合，推动了模式识别的调整与发展。模式识别的研究主要集中在两个方面：其一是研究生物（包括人类）如何感知物体，这属于认知科学领域；另一个是在给定任务下如何使用计算机。\n\
  \n模式识别是机器学习的先驱应用之一，用于检测图像、文本、字体、书法以及许多人类无法通过其他方式处理的内容。此外，这些系统正在日益改进，并被认为到 2050 年将能够理解任何模式。模式识别应用于许多领域，包括计算机视觉、医学图像分析、光学字符识别、自然语言处理、语音识别、手写体识别和生物识别。其他领域如文件分类、搜索引擎等，也是机器学习非常成熟的领域。\n\
  \n## 更广泛的领域\n\n2015 年是机器学习之年，机器学习革命变革人类社会的时刻已经到来。不仅像 `Google`、`Amazon`、`Accenture`、`Toyota`、`Tesla`\
  \ 和 `Johnson & Johnson` 等大公司正在大规模采用机器学习，初创公司也正在加入人工智能领域以寻求快速增长。机器学习革命正与大公司并肩。初创公司已经宣布了机器学习的创新应用，投资者对初创公司表现出浓厚兴趣。已有\
  \ 170 多家初创公司进入 AI 领域，`Google` 和 `IBM` 等科技巨头已对 AI 投入了巨资。机器学习在世界各行各业的应用已进入高峰，新闻随处可见。\n\
  \n`Google DeepMind` 的研究人员成功利用机器学习将计算机变成了雅达游戏（Atari Video Games）的大师。`Google` 与 `Johnson\
  \ & Johnson` 合作开发 AI 手术机器人，可以帮助医生减少对患者的伤害。当前的机器学习平台 `GraphLab` 是一个开源项目——已更命名为 `Dato`——它在新的融资中筹集了\
  \ 1850 万美元。该项目旨在帮助机器分析图像。`Microsoft` 为 `Microsoft Cortana` 构建了聊天功能，机器学习让 `Microsoft\
  \ Cortana` 不仅能够识别笑话和预测体育赛事，还能提醒你早点去会议（例如因为交通原因）。`Intel` 的 18 核 `Xeon` 芯片专为机器学习定制，并为瞬息万变的服务市场设计，据该公司声称，其速度比新芯片快六倍。`Airbnb`\
  \ 发布了 `Aerosolve`，这是一个机器学习程序包，`Airbnb` 认为它与人类和机器共生工作的效果将比单独与人类或机器工作得更好。机器学习也出现在\
  \ `Gartner` 2015 年技术跃周期报告中，该报告仅显示了数字技术（主要是 `Gartner` 认为具有重大影响的技术），而人文主义是报告中出现的第一项技术。\n\
  \n\n\n\n# 第 2 章：机器学习基础\n\n机器学习是这样一门关注如何通过计算、经验以及更多的经验来提高系统性能的学科。在计算机系统中，经验通常以数据的形式存在。因此，机器学习算法的主要内容是一种用于在计算机上从数据生成模型的算法。通过学习算法，我们向其提供实证数据，它就能根据这些数据生成模型；面对新情况时，模型将给我们给出相应的判断。如果说计算机科学是关于程序的研究，那么机器学习就是关于算法的研究。\n\
  \n### 数据集\n\n要进行机器学习，你需要数据。假设我们收集了一组关于西瓜的数据，例如：（绿色；基部卷曲；敲击声沉闷），深色；基部略微卷曲；敲击声沉闷），浅色；基部坚硬；敲击声清脆）。每个括号包含一条记录。这组记录被称为`dataset`（数据集），其中每条记录都是对事件或对象的描述，称为`instance`（实例）或`sample`样本）。以某种方式反映事件或对象的行为或性质的（如颜色、根部和敲击声）被称为`attribute`（属性）或`feature`特征）。绿色和黑色等属性上的值被称为`attribute\
  \ values`属性值。属性伸展的空间被称为`attribute space`属性空间、`sample space`样本空间或`input space`输入空间。由于空间中的每一点都对应于一个坐标向量，因此我们也将其称为`feature\
  \ vector`特征向量。\n\n## 假设\n\n从数据学习模型的过程被称为`learning`（学习）或`training`（训练），通过执行学习算法完成。训练过程中使用的数据称为`training\
  \ data`训练数据，每个样本称为`training sample`训练样本，训练样本集称为`training set`训练集。学习模型对应于数据的底层规律，因此被称为`hypothesis`（假设）；而底层规律本身被称为`truth`（真理）或`ground-truth`（地面真值），学习过程旨在寻找或近似真理。模型有时被称为`learner`（学习器），是学习算法在给定数据和参数空间上的实例化。\n\
  \n如果你想学习一个可以帮助你判断结果是否良好的模型，仅有样本数据是不够的。为了建立这样一个`prediction`（预测）模型，我们需要获取训练样本的`result`（结果）信息，例如（绿色；卷曲；响亮）。\n\
  \n## 分类\n\n如果我们想预测离散值，例如“好瓜””“坏西瓜”，这种学习任务被称为`classification`（分类）。如果我们想预测连续值，例如西瓜的成熟度\
  \ 0.95 或 0.37，这种学习任务被称为`regression`（回归）。对于仅涉及两个类的`binary classification`（二分类）任务，通常其中一个被称为`positive\
  \ class`（正类），另一个被称为`negative class`（负类）；当涉及多个类时，它被称为`multi-class classification`（多分类）任务。\n\
  \n## 测试\n\n学习模型后，使用它来进行预测的过程被称为`testing`（测试），被预测的样本被称为`sample testing`样本测试。例如，在学习之后，测试用例可以获得其预测标记。我们还可以对西瓜进行`cluster`（聚类），将其将被分成若干组，每组称为一个`cluster`簇；这些自动形成的簇可能对应某些底层概念，例如“浅色”、“深色”甚至“本地”。这种学习过程可以帮助我们理解数据的内在规律，并为进一步的数据分析建立基础。需要注意的是，在聚类学习中，“浅色”和“本地西瓜”的概念对我们来说是未知的，且学习过程中使用的训练样本通常不具备标记信息。\n\
  \n如前，在详细理解所有可用资源后，你可以判断模型是否使用了`supervised learning`（监督学习）还是`unsupervised learning`（无监督学习）。`Classification`和`regression`是前者的代表，而`clustering`是后者的代表。注意，机器学习的目标是让学习的模型在`new\
  \ samples`新样本上运行良好，而不仅仅是训练集；即使对于聚类等无监督任务，我们也希望聚类划分可以应用于样本。\n\n泛化能力（Generalizability）被定义为将掌握的模型应用于新样本的能力。机器学习的魅力之处在于，尽管训练集只是小样本，但它可以在样本空间很好地反映其特征。因此，泛化能力是一个重要概念，它以其简单性引导机器学习走向新的趋势。通常假设样本空间中的所有样本都遵循一个未知分布`D`，我们获得的每个样本都是从该分布独立采样的，即独立同分布（`IID`）。通常情况下，训练样本越多，我们获得的信息就越多。\n\
  \n## 归纳与演绎\n\n归纳和演绎是科学推理的两种基本手段。从特殊到一般的`generalization`（泛化）过程，即从具体事实到一般规律，而后者是从一般到特殊的`specialization`（特殊化）过程。例如，在数学系统中，通过演绎基于一组公令和推理规则推导出定理，而`learning\
  \ from examples`（从示例学习）是一个归纳过程；因此也称为`inductive learning`归纳学习。\n\n归纳学习可以分为`narrow\
  \ sense`狭义和`broad sense`广义。狭义大致等同于从样本学习，而广义要求从训练数据中学习，这也称为`concept learning`（概念学习）或`concept\
  \ formation`（概念形成）。学习具有良好泛化性能和清晰语义的概念是非常困难的。然而，理解概念学习有助于理解机器学习的一些基本思想。最基础的概念学习就是学习“是”和“否”等目标概念，这些可以表示为`Boolean`值。\n\
  \n在所有背景中进行的发现和模型分析中，学习因`hypothesis`（假设）而闻名。搜索的目标是找到……。归纳学习可以分为狭义和广义。狭义大致等同于从样本学习，而广义要求从训练数据中学习，这也称为概念学习或概念形成。学习具有良好泛化性能和清晰语义的概念是非常困难的。然而，理解概念学习有助于理解机器学习的一些基本思想。最基础的概念学习就是学习“是”和“否”等目标概念，这些可以表示为\
  \ Boolean 值。\n\n在所有背景中进行的发现和模型分析中，学习因假设而闻名。搜索的目标是找到……。归纳学习可以分为狭义和广义。狭义大致等同于从样本学习，而广义要求从训练数据中学习，这也称为概念学习或概念形成。\n\
  \n*(注：原文中部分段落存在重复，译文已按要求对内容未进行重复翻译)*\n\n\n\n\n\n## 1. 从数据开始并获取更多训练数据。\n\n使用更多的训练数据是解决过拟合问题最有效的方法，因为更多的样本可以使模型学习到更有效的特征并减少噪声的影响。当然，直接添加实验数据通常很困难，但可以采用某些规则来扩展训练数据。例如，在图像分类问题中，可以通过平移、旋转、缩放等方法来扩展数据。\n\
  \n## 2. 降低模型复杂度。\n\n过拟合的主要因素是当数据较少时模型过于复杂。适当降低模型复杂度可以避免过多的采样噪声。例如，在神经网络模型中减少网络层和神经元的数量，在决策树模型中减少树的深度并对树进行剪枝。\n\
  \n## 3. 集成学习方法。\n\n集成学习是通过整合多个模型来降低单个模型的过拟合风险，例如 bagging 方法。\n\n## 降低欠拟合风险的方法\n\n\
  ### 1. 添加新特征。\n\n当特征不足或现有特征与样本标签之间的相关性不强时，模型容易出现欠拟合。通过挖掘如“上下文特征”、“ID 类特征”和“组合特征”等新特征，可以获得更好的结果。在深度学习趋势中，许多模型可以帮助完成特征工程，例如因子分解机、梯度提升决策树、深度交叉等。\n\
  \n### 2. 增加模型复杂度。\n\n简单模型的学习能力较差，通过增加模型复杂度使模型具有更强的拟合能力。例如，线性模型中添加高阶项，在神经网络模型中增加网络层数或神经元数量。\n\
  \n### 3. 降低正则化系数。\n\n正则化用于防止过拟合；但当模型出现欠拟合时，则需要降低正则化系数。\n\n## 数据集与示例\n\n人们普遍认为，机器学习是实现人工智能的主要途径，人类基于机器学习和海量数据逐渐实现人工智能，而深度学习是机器学习的一个分支。如果这三个范围用同心圆表示，那么\
  \ AI 是最外的一圈，深度学习是最内层的一圈。人工智能是机器在不到秒的时间做出人类可以做出的决策的能力，这些机器可以同时做出十万人在一秒内能做出的决策。机器学习有很多概念，从监督到无监督，从聚类到回归，从浅层到深度学习，从准确率到召回率。它们都意味着什么？本章介绍了一些最重要的概念。许多机器学习初学者，甚至是行业内的资深人士，一直在为寻找合适的训练数据和测试数据而苦恼，处理数据消耗了大量的人力和资源。究竟如何将我们周围各种物理对象转换为机器可以理解的数字特征？本章将介绍数据集获取和特征提取方案。本章介绍的数据集包括\
  \ `KDD 99`、`SEA`、`ADFA-LD` 等。重点放在从数字和文本数据中提取特征以及如何读取常见数据。最后，介绍了如何验证机器学习的结果。\n\n\
  从带有概念标记（分类）的训练样本中学习，尽可能对训练样本集之外的数据进行标记（分类）。在这里，所有标签（分类）都是已知的，因此训练样本的歧义性较低。学习没有概念标记（分类）的训练样本，以发现训练样本集中的结构化知识。在这里，所有标签（分类）都是未知的，因此训练样本的歧义性很高。聚类是典型的无监督学习。\n\
  \n### 准确率与召回率\n\n这两个基本指标在信息检索和识别等过程中是重要的。这些索引对于更好地理解主题至关重要。在涉及准确率和召回率的问题中，可以使用四种场景。其中第一种是真阳性，意味着实例是正确的。第二种是假阳性，意味着不是正确的但被机器预测为正确。第三种是真阴性，意味着绝对是错误的且系统判断正确。最后一种是假阴性，由于各种原因，不是错误的但被机器预测为错误的。\n\
  \n### 数据集\n\n众所周知，数据集和算法就像面包黄油一样必不可少，在许多情况下，数据比算法更重要。书中的示例主要基于多年收集的开源数据集和部分脱敏测试数据。\n\
  \n- **HTTP 数据集**：`CSIC 2010` 数据集包含大量的标记 36,000 个正常服务请求和 25,000 个 SQL 注入、缓冲区溢出、信息泄露、文件包含、XSS\
  \ 等攻击请求。它广泛用于 WAF 功能评估。\n- **Alexa 数据集**：Alexa 是一个发布排名的网站。Alexa 由搜索引擎成立于 1996 年（美国），旨在让互联网用户共享虚拟世界资源并更深入地参与互联网资源的组织。Alexa\
  \ 每天收集超过 1000 GB 的网络信息，不仅为数十亿个网站提供链接，还对每一个进行排名。可以说 Alexa 目前拥有 URL 数量最多、信息最的网站。Alexa\
  \ 排名是衡量网站访问量最常用的指标之一。Alexa 排名基于在 `IE` 和 `Firefox` 等浏览器中下载并安装 Alexa 工具栏以监控其访问网站的用户，因此其排名数据并不具有权威性。但\
  \ Alexa 提供 `CSV` 格式的全球前百万域名下载。\n- **电影评论数据集**：电影评论数据集包含不同的电影相关数据，可用于各种分析和测试。\n\n\
  \n\n\n\n# 数据提取\n\n在机器学习中，特征提取被视为一种人工工作。有些人将其称为“特征工程”，这反映了该过程所需要的大的工作量。在特征提取中，数值特征提取和文本特征提取是最常见的。\n\
  \n### 数值特征\n数值特征可以直接作为特征使用，但对于多维特征，某个特征的取值范围非常大，这可能导致其他特征对结果的影响被忽略。此时，我们需要对数值特征进行预处理。\n\
  \n### 文本数据提取\n文本数据提取特征比数值特征要复杂得多。它们本质上是分词。将不同的单词用作一种新特征。\n\n- **词集模型（Word set model）**：一个单词集合，其中每个元素仅包含一个单词，也就是说词集中的每个单词只出现一次。\n\
  - **词袋模型（Word bag model）**：如果一个单词在文档中出现多次，则统计它出现的次数（频率）。\n\n两者的本质区别在于，词袋在词集的基础上增加了频率维度：词集只关注“有或无”，而词袋还关注“出现了几次”。\n\
  \n### 数据处理\n在处理数据时，`CSV` 是最常见的格式，文件的每一行记录一个向量，并在最后一列进行标记。`TensorFlow` 提供了一种非常方便的方法从\
  \ `CSV` 文件中读取数据集。\n\n\n\n\n\n# 第 3 章：机器学习算法\n\n本章描述了机器学习中使用的著名算法模型。请将此作为资源来提高你对机器学习基础知识的理解。为了让你更好地理解该主题，文中给出了一些现实实例。\n\
  \n## K 近邻算法 (K-Nearest Neighbors)\n\n当你在 Google 上搜索一个问题或产品时，你会在左侧看到推荐的产品。为了让人们了解相似物品，搜索引擎或像\
  \ YouTube 这样的网站使用了`k-nearest neighbors`算法。它也是机器学习中最著名的分类算法之一。尽管它的原理非常简单，但被广泛应用于许多领域。\n\
  \n假设我们有一个标记数据集，其中我们已经知道数据集中每个样本所属的类别。此时，有一个未标记的数据样本，我们的任务是预测该数据样本属于哪个类别。`k-nearest\
  \ neighbors`算法的原理是计算待标记数据样本与数据集中每个样本之间的距离，并取最近的 `k` 个样本。这最近的 `k` 个样本对标记数据样本所属的类别进行投票。\n\
  \n假设 `X` 是待标记的数据样本，`x` 是标记数据集，该算法的工作原理如下：\n1. 排序距离数组，取最近的 `k` 个点，并将它们标记为 `X`。\n\
  2. 统计 `x` 中每个类别的数量，即 `class0` 在 `x` 中有多少样本，`class1` 在 `x` 中有多少样本，以此此类推。\n\n`K-nearest\
  \ neighbor`算法非常有名，并且是一种惰性学习算法。由于其非线性特性，它在现实生活中有着丰富的应用。有时，Netflix 和 Hotstar 等流媒体网站可能会向你推荐这些人之前看过的电影。不能保证你一定会喜欢，但因为它是数据集中的最近样本，你确实会在信息流中看到它。\n\
  \n由于其非参数特性存在一些缺点。一些银行网站和信用卡公司使用`k-nearest neighbor`算法来预测或决定寻求贷款的潜在客户是否符合其金融机构。\n\
  \n**优点：** 高准确率，对离群值和噪声具有高容忍度。\n**缺点：** 计算量大。内存需求也较大。从算法原理上可以看出，每当我们分类一个未标记样本时，都需要重新计算所有距离。\n\
  \n## 决策树 (Decision Tree)\n\n决策树和随机森林是常见的分类算法，尤其是决策树。在很多情况下，其判断逻辑非常接近人类的思维。你可以将决策树画作你的决策逻辑。\n\
  \n决策树是最经典的机器学习模型之一。它的预测结果易于理解，易于向业务部门解释，预测速度快，并且可以处理类型数据和连续数据。决策树是机器学习数据挖掘工作面试中面试官喜欢的题目之一。作为最基础、常见的监督学习模型，决策树通常用于分类问题和回归问题，特别是在营销和生物医学领域，主要是因为树形结构与决策过程中的销售、诊断等场景非常相似。\n\
  \n将集成学习的思想应用于决策树，我们可以得到`stochastic forest`（随机森林）和`gradient lifting decision tree`的模型。我们知道决策树的目标是根据不同的特征和属性，从一组样本数据中建立树形的分类结构。我们希望它能拟合训练数据并获得良好的分类结果，同时我们也希望控制它的复杂性，使模型具有一定的泛化能力。\n\
  \n对于一个特定问题，决策树可能有许多选择。例如，在场景描述中，如果从根节点将女孩写代码的能力考虑在内，可能只需要一个简单的树结构来完成分类。与其他机器学习算法相比，决策树虽然缓慢且预测性较低，但由于其巨大的应用价值，显得非常奇特。这是因为其能够在短时间内有效过滤大量的非线性数据。\n\
  \n例如，哈勃望远镜作为著名的仪器和天文学科学家的救星，每天交付数千张图像，它使用决策树来清除图片中的噪声。决策树可以从其访问的大量累积数据中通过分治法的鉴别诊断预测医疗诊断。像`VisualDx`这样著名的医生鉴别诊断工具，使用决策树根据给定的患者数据自动决定诊断。决策树易于阅读和建立假设，不像其他机器学习算法在表示出来时往往令人困惑。例如，有了大量的销售或信用评分历史数据，可以使用决策树来决定采取向人们推销新产品的下一步策略。如果有大量数据可以用来解释客户对产品的特征和期望，决策树可以作为一种极好的营销工具。\n\
  \n## 随机森林 (Random Forest)\n\n随机森林算法与决策树策略非常相似，但处理更多的问题、决策和预测分析。一个例子可以帮助你轻松理解这个复杂的算法。假设你正尝试和新婚妻子去度假。由于你的表现不知所措，你对去哪里感到困惑。所以你向一位已婚的朋友请教去哪里度假。你的朋友问了你很多问题，如你妻子的习惯、品味以及你自己的，以便他为你选择一个你们可能都喜欢的度假地。他给了你一个认为对你和妻子第一次度假来说很棒的地方。但你不确定他是否正确，所以你问了其他朋友，他们问了不同的问题并向你推荐了一个地方。现在，有很多选择，你决定去一个票数最高的地方。这就是机器学习中随机森林算法的工作原理。\n\
  \n随机森林算法广泛应用于 PayPal 等银行应用中，用于识别可能向系统发送垃圾信息的欺诈客户。它也可以用于医学应用，可能判断过度用药。\n\n## 朴素贝叶斯算法\
  \ (Naive Bayes Algorithm)\n\n朴素贝叶斯算法可能是机器学习中最著名的算法，任何了解 IT 的人都会早期的垃圾邮件算法使用了朴素贝叶斯。200\
  \ 多年前，科学家提出了它并给出了数学证明，而 Naive Bayes 的英文缩写非常显眼：`NB`算法，并不是一种特殊的`NB`感觉。本节将介绍朴素贝叶斯算法的基本概念，并给出基本用法，包括如何使用朴素贝叶斯算法检测网络环境中的异常操作。\n\
  \n垃圾邮件可以认为是人类互联网最有争议的副产品；它的泛滥让整个互联网负担过重，严重影响了人们的日常生活。通常，企业和大型邮件服务提供商会提供拦截垃圾邮件的能力。最常见的算法之一是基于朴素贝叶斯的文本分类算法。基本想法是训练一个文本分类模型，通过朴素贝叶斯学习大量的垃圾邮件和正常邮件。\n\
  \n朴素贝叶斯分类是一系列分类算法的总称，它们都基于贝叶斯定理，因此被称为贝叶斯分类。`NB`算法是 250 多年前由英国数学家贝叶斯发明的。\n\n## 逻辑回归\
  \ (Logistic Regression)\n\n逻辑回归可能是机器学习中最基础、最常用的模型。逻辑回归的推导和扩展对于工程师来说几乎是必备的技能。逻辑回归也被称为回归分析，用于预测未来结果的概率。因变量是结果，自变量是影响结果的因素。\n\
  \n假设我们有一场足球比赛，有两支球队，根据历史结果和其他信息，使用逻辑回归来预测胜负。假设比赛结果为`y`，获胜标记为 1，失败标记为 0。这是一个典型的二分类问题，由逻辑回归解决。\n\
  \n## 支持向量机 (Support Vector Machine)\n\n支持向量机被认为是最容易实现的机器学习算法之一，被用于生活的许多领域，特别是二分类问题。关于`SVM`，有一个关于天使的传说：恶魔在桌子上放了两种颜色的球，让天使使用一把木棍来分开它们。这似乎太简单了，随着球数量的增加，有些球无法被正确分开。`SVM`\
  \ 实际上是在尝试找到球之间的最佳位置。根据球的位置，`SVM`可以将球分成两类。这种过程被称为`kernel` mapping（核映射）。在机器学习领域，`SVM`\
  \ 涵盖了方方面面，用于分类和手写识别。著名的超级计算机如 Watson 使用 `SVM` 来检测世界中的物种。Google Lens 也使用支持向量机来检测不同类型的文本识别。\n\
  \n## K-Means\n\nK-means 和 `DBSCAN` 是最早引入的无监督算法，它们比监督学习需要少的数据处理工作。曾经，有一群猴子在没有标记的情况下被分成小组。在第一组中，领导规则；在第二组中，另一个猴突然出现。最终，分组并完成了聚类。通过这个小故事来解释\
  \ `k-means` 算法。在上面的例子中，大组被分成更小的组，无论原因是什么。这种重要过程被称为聚类。`k-means` 算法可以帮助你理解大量的用户动态和重要性。例如，电信公司可以分析通话记录来改进他们的服务。`K-means`\
  \ 算法可以帮助研究人员在数据中确定区域，而不是处理不可用的数据。\n\n## DBSCAN 算法\n\n`DBSCAN` 代表基于密度的空间聚类。与 `k-means`\
  \ 方法相比，`DBSCAN` 在不知道簇数量的情况下发现任何形状的簇并识别噪声点。让我们通过例子解释 `DBSCAN`，这次分组的数量没有限制。`DBSCAN`\
  \ 广泛应用于天文学、医学和电子商务应用。\n\n## Apriori 算法\n\nApriori 规则挖掘通常是无监督学习。通过分析数据集，`Apriori`算法发现关联。介绍了三个基本概念：`support`（支持度）、`confidence`（置信度）和`frequency`（频率）。\n\
  \n## 神经网络算法 (Neural Network Algorithms)\n\n通常来说，`KNN` 和之前介绍的算法被理解为浅层学习，需要花费至少一半的时间在数据清洗和特征提取上。有些人生动地将这些步骤称为“特征工程”。人类大脑是由数百万神经元组成的复杂网络。神经元具有细胞体、轴突和树突。每个神经元可以有一个或多个树突，接收刺激并将兴奋传递给细胞体。每个神经元只有一个轴突，将兴奋从细胞体传到另一个神经元，如肌肉。神经网络算法模拟人类神经元的工作原理，对带有相应权重的多个输入参数进行兴奋处理。输出然后连接到下一阶段的输入，形成更复杂的神经网络。创建人工神经网络需要人工神经细胞以此的方式连接。有很多连接类型，常用的是分层连接神经细胞。这种网络被称为前馈网络。如果你惩罚了错误的神经元，可以通过从输出层查看错误的神经元并微调这些神经元的权重来解决问题。这种算法被称为反向传播。\n\
  \n## 循环神经网络算法 (Recurrent Neural Network Algorithm)\n\n它甚至被用于循环神经网络学习自动生成代码和绘画。正如古代人从过去学习，我们倾向于结合以前的经验分析事物，并试图记住过去是如何解决类似情况的，即使是在从未见过的情况下。这实际上符合循环神经网络的思想。循环神经网络广泛应用于机器翻译。例如，著名的机器翻译器\
  \ Google Translate 将法语诗歌翻译成英语。它在翻译大量数据中的每个单词后，使用循环神经网络算法检查其句法结构。它分析句法结构和语法规则以获得清晰的翻译。它也被用于语音识别和照片识别应用，为用户确定颜色和物品。Pandora\
  \ 使用循环神经网络算法在从其巨大的歌曲数据库中听后确定歌曲，它在其中对歌曲进行句法分析。\n\n\n\n\n\n- 线性回归：给定一个数据集，它尝试学习一个线性模型，以尽可能准确地预测实值输出标记。\n\
  \n\n\n\n# 多分类学习\n\n在现实中，我们经常会遇到多分类学习任务。一些二分类学习方法可以直接扩展到多分类，但在更多情况下，我们通过使用一些基本策略，基于二分类学习器来解决多分类问题。多分类学习的基本思想是在不失通用性的前提下，将多分类任务划分为若干个二分类任务。具体来说，为每个二分类任务训练一个分类器，并整合这些分类器的预测结果以获得最终的多分类结果。这里的关键在于如何拆分多分类任务以及如何整合多个分类器。\n\
  \n# 机学习与深度学习算法的实际应用\n\n## 验证码检测\n验证码是一种公开的、全自动程序，能够区分计算机与人类。其原始设计是为了防止恶意密码破解、滑动攻击和论坛灌水。事实上，现在验证码已成为许多网站的常用手段。验证码的基本假设是：由于计算机无法回答问题，回答问题的用户被认为是人类。大量验证码的出现是攻与防相相成的结果；读者可以参考验证码安全等内容。`MNIST`\
  \ 数据集可以作为示例，介绍验证码的识别以及验证码中使用的特征提取方法，包括一维向量、二维向量、所使用的模型，以及 `k-nearest neighbor`、`support\
  \ vector machine` 和深度学习。\n\n## 垃圾邮件检测\n作为互联网最具争议的副产品之一，垃圾邮件对企业用户的影响是增加了日常工作的额外负担。根据不完全统计，在反垃圾环境中，仍有\
  \ 80% 的用户每周需要花费约 10 分钟处理垃圾邮件，对于大多数企业应用来说效率仍然低下——中国的垃圾邮件总量已达到世界第三。对于企业服务提供商而言，垃圾邮件的恶意投放以及大量资源导致邮件服务器瘫痪是非常严重的问题，影响了效率甚至整个通信。因为垃圾邮件容易被白名单接受，反垃圾平台成为了垃圾邮件发送者甚至网络黑客的目标。通过劫持这些企业邮箱，垃圾邮件发送者可以极大提高垃圾邮件的投递率。这不仅会对企业用户产生不可预测的影响，还会让反垃圾组织和接收者“崩溃”。由于垃圾邮件危害性极大，导致企业受影响影响的国家海外业务扩张受阻。\n\
  \n许多国内中小型企业从低成本服务商处建立邮件系统（以 `163` 和 `QQ 企业邮箱` 为唯一主要的专业服务商），受益于与许多反垃圾组织的合作。为了防止垃圾邮件，大型企业通常使用商业安全解决方案。常见的国外供应商包括\
  \ `CISCO`、`Blue Coat`、`Websense`、`Zscaler` 和 `McAfee`。我们使用 `Enron` 数据集对海量数据进行垃圾邮件检测。数据集可用于训练模型，对垃圾邮件特征和恶意内容进行分类。如我们所知，训练量与机器学习性能的提升直接成正比。通常，可以使用大量的深度学习和机器学习算法来识别垃圾邮件。但经过某些实验证明，贝斯算法最适合垃圾邮件检测，`Gmail`\
  \ 就利用了其优异的性能。卷积神经网络也可以，但需要更大的实现规模和更大的数据集。值得注意的是，在 `Naive Bayes` 实验中，我们发现不仅是词袋识别概率，还存在一个达到最佳效果的中位点。`TF-IDF`\
  \ 结合词袋模型将提高检测能力。上述方法有许多可以调整的参数，例如神经网络的层数、样本文本的长度等。此外，对于英语环境，特征提取方面还有改进空间，例如动词的不同时态、单复数名词的归一化以及常用停词的处理。\n\
  \n## 负评识别\n谈到负评，我们先来谈谈“水军”。顾如其名，水军是指论坛中的大量人员；他们受网络公关公司雇佣，以发布回复为主要手段。这是为了雇主推广全职和兼职的网络人员。通常情况下，往往需要十万人才能策划一个发帖活动，而那些在网上临时招募帖的人在行业内被称为“网络水军”。2009\
  \ 年 12 月，`CCTV` 报道网络水军是一种新兴现象。在全社区的关注下，许多长期在线网友加入了网络水军群。水军的盛行严重影响了舆论，尤其是有组织地对公众人物和企业进行诽谤和攻击，造成了严重的社会影响。大型社交媒体和知名论坛聘佣了大量的运营支持人员进行人工识别和处理。机器学习是否能在一定程度上实现识别负面评论的自动化？我们曾尝试通过积累垃圾邮件检测技术来实现。`IMDB`\
  \ 数据集可以作为示例来介绍负评识别技术。文中介绍了识别负面评论的数据集和所使用的特征提取方法，包括词袋和 `TF-IDF` 模型、词汇模型，以及 `Word2Vec`\
  \ 和 `Doc2Vec` 模型。还介绍了所使用的模型及相应的验证结果，包括 `naive Bayes`、`support vector machine` 和深度学习。\n\
  \n## 骚扰电话检测\n如今，骚扰电话和短信变得越来越激烈。调查发现，目前市民的个人信息涉及许多方面，如申请许可证、办卡、网购、看病等。许多企业以各种名义获取市民个人信息，而许多市民对个人信息保护意识薄弱，随意授权。短信也是如此。无疑大多数人的短信中充满了卖房、卖车、优惠、甚至发票和贷款等垃圾信息。这些信息其中一些来自手机。\n\
  \n\n\n\n\n- **静态检测**：通过匹配特征代码、特征值以及危险操作函数来寻找 WebShell 的方法。\n- **动态检测**：对时间特征的行为进行检测，例如数据库操作、敏感文件读取等。\n\
  - **语法检测**：根据 PHP 语言的扫描编译方式，通过分析变量、函数、字符串、语言结构的方式进行代码剥离和注释分析，从而实现对关键危险函数的捕获。这能够完美地解决漏报问题，但仍然存在误报问题。\n\
  \n\n\n\n# 第 4 章：机器学习\n\n## 机器学习入门\n机器学习的应用基于计算，而计算是科学计算的主要部分。这些问题过去用普通的计算工具非常难解决，但现在通过计算机可以很容易地解决。目前，计算机执行频繁的数学计算主要分为两类。\n\
  \n### 数值计算\n第一类是数值计算，它将数值数组作为操作对象并给出数值解。计算过程中可能会产生误差累积，从而影响计算结果的准确性。第二类是符号求值，它将符号对象和符号表达式视为整体。该操作不受计算误差累积问题的影响。\n\
  \n数值计算方法已成为科学计算的重要手段。它研究如何使用计算工具求解数学问题的数值解。数值计算的研究对象包括微积分、线性代数、插值与近似、最小二法拟合以及数值积分。数学问题如矩阵的特征值和特征向量、线性方程组和非线性方程的根以及微分方程的数值解，是应用于模式识别、数据分析和自动化制造等机器学习领域的数学基础。\n\
  \n### 符号计算\n符号计算是应用于专家系统等机器学习领域的数学方法。在符号计算中，计算机处理的数据和获得的结果都是符号。作为字母和公式使用的符号也可以是数值值。它的操作通过推理和分析的方式进行；不受计算误差累积问题的困扰。计算结果是完全正确的闭式解或任意精度的数值解，这意味着符号计算的结果可以避免由舍入误差引起的问题。\n\
  \n更多的数学分支正在进入机器学习，其中复杂的数学计算需要强大的科学平台。科学计算平台为机器学习算法的应用提供了底层支持。\n\n## 科学计算软件平台概述\n\
  现代科学研究有三种主要方法：理论论证、科学实验和科学计算。近年来，科学计算逐渐成为科学研究的主流方法，并被广泛应用于金融工程、信息检索、基因研究、环境模拟、数值计算、数据分析、决策支持等其他领域。\n\
  \n由于计算机技术的发展以及其在各个技术和科学领域中应用的普及和深层化，这些应用领域（此处如此）无论其背景和意义如何，都需要使用计算机进行科学计算，并必须建立相应的数学模型。适用于计算机编程的计算方法也得到了研究。科学计算平台已成为科学研究必不可的基础平台，促进了科学研究的发展和工程技术的进步。\n\
  \n机器学习应用需要科学计算。该领域的大多数科学计算应用都需要机器学习算法，科学计算平台与机器学习之间的关系就像鱼和水的关系。现代机器学习的研究和应用与科学计算平台密不可分；由于机器学习的快速发展，科学计算平台进入了新的竞争时代。\n\
  \n## 流行的科学计算软件\n有几种类型的流行的科学计算软件：\n\n### MATLAB\n如果你处于计算机科学行业，你可能已经知道 `MATLAB` 在机器学习行业是多么有名了。几乎所有涉及数值计算的复杂编程问题都可以通过\
  \ `MATLAB` 解决，它是一个性能卓越的许可程序。与 `GNU Octave` 等其他开源许可软件相比，`MATLAB` 使用各种算法以获得更好的性能。此外，`MATLAB`\
  \ 拥有独立的软件包以更好地实现机器学习算法，尽管为了更好地利用 `MATLAB` 应该具备良好的实践。因此，在尝试使用 `MATLAB` 之前，先对所有可用选项有一个良好的了解。如果你知道如何正确使用它，它将成为你永远爱的工具。\n\
  \n### GNU Octave\n与 `MATLAB` 类似`GNU Octave` 是由自由软件基金开发的免费分发软件，在 John W. Eaton 的帮助下，由一组志愿者开发，他们开发了一种高级语言即\
  \ `GNU Octave`，它与 `MATLAB` 兼容，主要用于数值计算。\n\n### Mathematica\n`Mathematica` 是由 Wolfram\
  \ Research 开发的强大系统，是一种数学系统。它提供了广泛应用于各个领域的数学计算功能。科学研究领域的人员使用它进行各种计算。它是一个集成计算机系统，主要功能包括符号微积分、数值计算和图形。它可以帮助人们解决各个领域复杂的理论和实际问题。\n\
  \n### Maple\n1980 年 9 月，加拿大滑卢大学的符号计算研究小组开发了一种名为 `Maple` 的计算机代数系统，它已成为卓越的数学软件。它具有良好的环境、强大的符号能力和高精度。它的特点还有数字计算、灵活的图形显示和高效的可编程函数。`Maple`\
  \ 在符号计算方面拥有强大的函数。符号公式可以直接以数学形式输入输出，直观且方便。\n\n### SPSS\n`SPSS` 预测分析是 IBM 的产品，提供统计分析、数据挖掘、预测模式和决策优化。IBM\
  \ 声具有五个大优势：业务智能；强大且简单的分析以控制数据爆炸；满足组织对灵活部署业务智能的需求；提高用户预期；指导管理策略的绩效管理。使其极具效益并提供及时准确的数据、场景建模、易于理解的报告等。\n\
  \n### R\n`R` 语言主要用于统计分析、映射语言和运行环境。目前由“R 核心团队”开发，它是基于 `S` 语言的 GNU 项目；语言方法源自 `Scheme`，因此也可以作为\
  \ `S` 语言的实现。\n\n### Python\nPython 是一种面向对象的动态编程语言，语法简洁，可用于快速开发。可以使用 Python 科学平台如\
  \ `NumPy`、`SciPy` 和 `Matplotlib`。`NumPy` 是基础科学包，包含了封装了 C++ 和 Fortran 工具的 N 数组对象。`SciPy`\
  \ 是开源数学、科学和工程包，执行优化、线性代数、积分、插值和特殊函数生成。`Matplotlib` 是 Python 最著名的绘图库，提供了一套类似于 `MATLAB`\
  \ 的完整命令 API，适用于交互式图表并可以嵌入 GUI 应用程序中。\n\n\n\n\n\n- 可扩展的接收器和分析器，能够监控常见数据源\n- 支持数据流的异常检测和基于规则的实时告警\n\
  - 支持使用 `Elasticsearch` 实现实时索引数据流的自动化\n- 支持使用 `HIVE` 通过 SQL 查询将数据存储在 Hadoop 中\n-\
  \ 兼容 `ODBC/JDBC` 并继承现有的分析工具\n- 拥有丰富的分析应用并可以集成现有的分析工具\n- 支持自动生成报告和异常告警\n- 支持原始网络数据包的捕获、存储和重组\n\
  \n## 数据源系统\n数据源系统指的是数据分析中使用的数据，也可以理解为系统支持的数据格式。常见的数据源包括网络流量、文件、syslog、SNMP 和数据库。\n\
  \n### 网络流量\n网络流量是最常见的数据源之一，主要分为全量流量和 `NetFlow`。全流量包含完整的网络数据，包括 `TCP/IP` 协议栈数据，例如\
  \ `Mac header`、`IP header`、`TCP header`、`HTTP header` 和 `HTTP payload` 数据，这对于分析网络攻击非常有帮助。获取总网络流量有三种常用方式：交换机镜像、分光器和网络分光。\n\
  \n交换机镜像是一种低成本且易于操作的方法，广泛用于网络故障排除、简单的流量分析和监控。光分光器是一种广泛使用的流量复制手段。光分光器的基本原理是通过精确的光纤生产工艺从物理层将一束光分成两束光，从而实现流量复制。由于其成本低且性能稳定，光分光器是大型网络流量复制的首选。但它也有局限性，例如当光衰减过大时无法使用。此外，如果网络存在某些接口链路，也无法使用分光器进行流量复制。这时就需要使用专用的流量复制设备——网络\
  \ TAP。\n\n`NetFlow` 提供网络流量的会话级视图，记录每个 `TCP/IP` 事务的信息。它可能不像流量镜像那样提供完整的网络流量记录，但聚合后更容易管理和读取。不同版本的\
  \ `NetFlow` 流量统计之间存在差异。常见版本包括数据流时间戳、源目的 IP 地址、源目的端口号、输入和输出接口号、下一跳 IP 地址、流中的总字节数和数据包数量。\n\
  \n### 文档\n文件是保存数据最基本的形式。常见的有 `CSV`、`XML`、`JSON`、电子表格以及各种日志文件，如 Linux 系统日志、Apache\
  \ 访问日志等。\n\n### Syslog\n`syslog` 是一种通过网络转发系统日志信息的标准。由伯克利软件发行研究中心开发，`syslog` 现在已成为日志设备的行业标准协议。`syslog`\
  \ 记录系统中的任何事件，管理员可以通过查看系统记录来跟踪系统状态。它通过 `syslog` 进程记录系统事件，也可以记录应用程序运行事件。通过适当的配置，你还可以实现运行\
  \ `syslog` 协议的机器之间的通信。通过分析这些网络行为日志，你可以跟踪和维护设备及网络相关的情况。`syslog` 是一种主从协议，向 `syslog`\
  \ 接收端发送一条短短的文本消息（小于 1024 字节）。常见的网络设备、安全设备和 Linux 发行版默认支持以 `syslog` 形式发送日志。\n\n###\
  \ SNMP\n`SNMP` 是一种基于 `TCP/IP` 族的网络管理标准。它是一种用于管理网络中节点（如服务器、工作站、路由器、交换机等）的标准协议。`SNMP`\
  \ 使网络管理员能够提高网络管理效率，及时识别并解决网络问题，并为网络增长做计划。网络管理员还可以接收网络节点的通知消息和告警报告，以跟踪网络问题。\n\n由\
  \ `SNMP` 管理的网络由三部分组成：`SNMP agent`、受管设备和网络管理系统 (`NMS`)。网络上的每个受管设备都有一个管理信息库（MIB），用于收集和存储管理信息。`NMS`\
  \ 可以通过 `SNMP` 这些信息。受管设备也称为网络单元或节点，可以是支持 `SNMP` 的路由器、交换机、服务器或主机。`SNMP agent` 是受管设备上的网络管理软件模块，持有本地设备的相关管理信息，并将其转换为兼容\
  \ `SNMP` 的格式传递给 `NMS`。`NMS` 运行应用程序监控受管设备。同时，`NMS` 为网络管理提供了大量的处理器和必要的存储资源。\n\n###\
  \ 数据库\n当数据存储在 `database` 中且可能随时变化时，就需要定期甚至实时的从 `database` 同步数据，通常基于 `JDBC`（Java\
  \ 数据库连接）来完成这些任务。`JDBC` 是用于执行 `SQL` 语句的 Java API，提供了对多个关系型数据库的统一访问。它由一组用 Java 语言编写的类和接口组成。`JDBC`\
  \ 提供了一个基准，以此构建更高级的工具和接口，使开发者能够编写数据库应用程序。通过 `JDBC`，很容易向各种关系型数据发送 `SQL` 语句。换句话之，通过\
  \ `JDBC` API，你不需要为访问 `Sybase` 数据库专门写一个程序，为访问 `Oracle` 数据库写另一个，为访问 `Informix` 数据库再写一个，以此类推。程序员需要做的只是使用\
  \ `JDBC` API 编写程序并向相应的数据库发送 `SQL` 调用即可。\n\n### 爬虫\n当数据存储在第三方业务系统中，数据可能随时变化且无法直接访问数据库；可以使用爬虫通过访问\
  \ `API` 或直接抓取网页来获取数据。例如，为了消除员工出差或外勤引起的虚报，需要从 `ERP` 同步员工的出差状态和访问控制系统的打卡状态。这需要使用爬虫爬取\
  \ `ERP` 和访问控制系统的数据。\n\n\n\n\n\n### Syslog\n`Syslog` 支持以 `Syslog` 的形式接收数据。过滤器是数据传输层，负责处理格式化、数据类型转换、数据过滤、字段添加、修改等操作。最常用的过滤器是\
  \ `Grok`，它通过正则解析和结构化来解析并结构化任何文本，以满足大多数需求。\n\n### Outputs\n输出是 Logstash 工作的最后一个阶段，负责将数据输出到特定位置。常见的输出如下：\n\
  \n* `Elasticsearch`: 将事件数据发送到 `Elasticsearch`\n* `File`: 将事件数据写入磁盘文件。\n* `Kafka`:\
  \ 将事件数据写入 `Kafka`\n\n### Bro\n`Bro` 是一种被动开源流量分析器，主要用于网络流量安全监控中所有深层可疑行为的关联。网络流量分析提供了一个全面的平台，特别强调语义安全监控。尽管它经常与传统的入侵检测/防御系统进行比较，但\
  \ `Bro` 采取了完全不同的方法，为用户提供了灵活的框架、可定制的工具以及远超传统能力的深度监控。`Bro` 的目标是搜索攻击活动并提供背景信息和使用模式。它可以将网络中的设备组织成可视化图谱，深入网络流量并检查网络数据包。在\
  \ ML 框架中，`Bro` 负责分析网络全流量镜像，恢复网络协议，并通过 `Kafka` 插件将数据发送到 `Kafka` 集群。\n\n### Messaging\
  \ Layer\n消息系统是整个 ML 框架的信息高速公路，数据通过其进出。最常用的消息系统是 `Kafka`。`Kafka` 是一个高吞吐的分布式发布/订阅消息系统，具有以下特征：\n\
  \n* 消息持久化由 `O (1)` 磁盘数据结构提供，即使对于数 TB 的消息存储也能长期保持稳定。\n* 高吞吐量，即使是普通硬件也能每秒支持数百万条消息。\n\
  * 支持通过 `Kafka` 服务器和消费者集群对消息进行分区。\n\n### Kafka System\n`Kafka` 系统由以下组件组成：\n\n* `Kafka\
  \ cluster` 包含一个或多个服务器，被称为 `broker`。\n* `Topic`：对于发布到 `Kafka Cluster` 的每条消息都有一个分类。物理上，不同\
  \ topic 的消息分开存储。在逻辑上，一个 topic 的消息存储在一个或多个 `broker` 上，但用户只需指定要生产或消费数据的 topic，无论数据存储在何处。\n\
  * `Partition` 是一个物理概念，每个 `topic` 包含一个或多个 `partitions`。\n* `Producer`：消息生产者，负责将消息发布到\
  \ `Kafka Broker`。\n* `Consumer`：消息消费者，从 `Kafka Broker` 读取消息的客户端。\n* `consumer group`：每个消费者属于一个特定的消费者组（可以为每个消费者指定组名称，或者在未指定组名称时使用默认组）。\n\
  \n\n\n\n\n# 实时处理层\n\n实时处理层使用了 `Storm`，这是一个免费、开源、分布式且容错的实时计算系统。`Storm` 让连续流计算变得简单，弥补了\
  \ `Hadoop` 批量无法满足的实时需求。`Storm` 常用于实时分析、在线机器学习、持续计算、分布式远程调用和 ETL 领域。与其他类似的流计算工具相比，`Storm`\
  \ 的部署管理非常简单，且性能卓越。\n\n# 存储层\n\n### HDFS\n该分布式数据存储设计适用于运行在通用型硬件上的分布式数据存储。它与现有的分布式数据存储有许多共同点，但也与其他分布式数据存储有很大不同。`HDFS`\
  \ 是一个高度容错的系统，适用于部署在廉价机器上。`HDFS` 提供高吞吐量的数据访问，是大型数据集应用的理想选择。`HDFS` 的设计便于在不同平台之间迁移，这将推动需要大型数据集的应用更广泛地使用\
  \ `HDFS` 作为平台。\n\n`HDFS` 采用主从结构，一个 `HDFS` 集群有一个 `name node`（主节点），它是一个管理文件命名空间并协调客户端访问文件的主服务器。当然，还有\
  \ `data nodes`（数据节点），通常一个节点一台机器，负责管理对应节点的存储。`HDFS` 向公众开放文件命名空间，允许用户数据以文件的形式进行存储和访问。其内部机制是将文件分成一个或多个块（blocks），并将它们存储在一组\
  \ `data nodes` 中。通过文件或目录操作来处理文件命名空间（如打开、关闭、重命名等），这决定了块到数据节点的映射。`data node` 负责处理文件系统客户端的读写请求。`data\
  \ node` 还执行来自 `name node` 的块创建、删除和块复制指令。\n\n`name node` 和 `data node` 都是运行在普通机器（通常为\
  \ `GNU/Linux`）上的软件。`HDFS` 用 `Java` 编写，任何支持 `Java` 的机器都可以运行 `name node` 或 `data nodes`。`Java`\
  \ 极强的可移植性使得 `HDFS` 部署到各种机器变得非常容易。典型的部署是让专用机器运行 `name node` 软件，集群中的其他每台机器运行一个 `data\
  \ node` 实例。该架构并不排除在单台机器上运行多个 `data nodes` 实例，但实际部署并不建议这种用法。集群中仅保留一个 `name node`\
  \ 极大地简化了系统架构。`name node` 是仲裁者和所有 `HDFS` 元数据的存储库，用户的实际数据读写不需要经过 `name node`。\n\n\
  ### HBASE\n`HBASE` 是一个高可靠、高性能、列定向式且可扩展的分布式存储系统。可以使用 `HBase` 技术在低成本 PC 服务器上构建大规模的结构化存储集群。`Hbase`\
  \ 是 `Google Bigtable` 的开源实现，类似于 `Google Bigtable` 使用 `GFS` 作为其文件存储系统，而 `HBase` 使用\
  \ `Hadoop HDFS` 作为其文件存储系统。`Google` 运行 `MapReduce` 来处理 `Bigtable` 中的海量数据，而 `HBase`\
  \ 使用 `Hadoop MapReduce` 来处理 `HBase` 中的海量数据。此外，`Pig` 和 `Hive` 为 `HBase` 提供了高级语言支持，使得对\
  \ `HBase` 进行统计变得非常容易。`Sqoop` 为 `HBase` 提供了方便的 `RDBMS` 数据导入功能，使得将传统数据库数据迁移到 `Hbase`\
  \ 非常方便。\n\n### Elasticsearch\n`Elasticsearch` 是一个基于 `Lucene` 的搜索服务，提供了一个基于 `RESTful`\
  \ Web 接口的分布式多用户全文搜索引擎。`Elasticsearch` 用 `Java` 开发并以 `Apache` 许可证开源，是一种流行的企业级搜索引擎。`Elasticsearch`\
  \ 为云计算中的实时搜索而设计。它稳定、可靠、快速、易于安装和使用。安装 `Elasticsearch` 的唯一要求是安装官方新版本的 `Java`。\n\n\
  ### 安装 Marvel\n`Marvel` 是一个针对 `Elasticsearch` 的管理和监控工具，可在开发环境中免费使用。它包含一个名为 `Sense`\
  \ 的交互式控制台，允许用户通过浏览器与 `Elasticsearch` 直接交互。`Elasticsearch` 在线文档中的许多示例代码都带有一个在 `Sense`\
  \ 中查看的链接。点击该链接将在 `Sense` 控制台中打开相应的实例。不需要安装 `Marvel`，但通过在你的本地 `Elasticsearch` 集群中运行示例代码，它可以增加书本的互动性。`Marvel`\
  \ 是一个插件，可以在 `Elasticsearch` 目录下运行以下命令进行下载和安装。\n\n# 分析处理层\n\n### Apache Spark\n`Spark`\
  \ 是一种为大规模数据处理设计的快速且多功能的计算引擎。`Spark` 是由伯克利 AMP 实验室开源的类似于 `Hadoop` 的 `MapReduce` 的通用并行框架。`Spark`\
  \ 具有 `Hadoop` 的优势，但与 `MapReduce` 不同，中间作业输出可以存储在内存中，因此 Spark 允许内存分布式数据集来优化迭代工作负载。`Spark`\
  \ 用 `Scala` 语言实现，使用 `Scala` 作为其应用框架。与 `Hadoop` 不同，`Spark` 和 `Scala` 深度集成，`Scala`\
  \ 可以像操作本地集合对象一样轻松操作分布式数据集。`Spark` 在机器学习方面具有独特优势，主要因为机器学习算法通常具有许多步骤的迭代计算过程。机器学习计算需要在多次迭代后达到足够小的误差或收敛，例如使用\
  \ `Hadoop` 的 `MapReduce` 计算框架时，每次计算都需要读写磁盘。这导致了极高的 I/O 和 CPU 消耗。`Spark` 基于内存的计算模型天生适合迭代计算，多个步骤直接在内存中执行，仅在需要时才操作磁盘和网络。`MLB`（机器学习库）是\
  \ `Spark` 对常用机器学习算法的实现库，包括相关的测试和数据生成器。`MLB` 目前支持四个常见的机器学习问题：分类、回归、聚类和协同过滤。`MLlib`\
  \ 基于 `RDD`，设计用于与 `Spark SQL`、`GraphX` 和 `Spark Streaming` 无缝集成。\n\n### TensorFlow\n\
  `TensorFlow` 是一个使用数据流进行数值计算的开源软件库。节点表示图中的数学运算，图中的线表示节点关联的多维数据数组，称为张量（tensor）。它灵活的架构允许将计算扩展到多个平台，例如台式计算机中的一个或多个\
  \ `CPUs`（或 `GPUs`）、服务器、移动设备等。`TensorFlow` 最初由 `Google Brain` 组（`Google` 机器智能研究所的一部分）的研究人员和工程师开发，用于机器学习和深度神经网络。但该系统的灵活性使其能够被广泛应用于其他计算领域。\n\
  \n\n\n\n图形处理单元（GPU）最初设计用于计算机图形渲染，拥有成千上万个用于并行计算的计算单元。特别是浮点运算和并行计算，其性能可以是 CPU 的几十甚至上百倍。工业界和学术界的数据科学家已将\
  \ GPU 用于机器学习，在应用中实现了突破性的改进，例如图像分类、视频分析、语音识别和自然语言处理，以及无人驾驶车辆上的 GPU 处理。特别是深度学习，一直是密集投资和研究的领域。深度学习是使用复杂的多层深度神经网络来构建系统；这些系统可以从海量的训练数据到特征检测。GPU\
  \ 用于训练这些深度神经网络，它使用规模更大的训练集，耗时更短，且消耗的数据中心基础设施更少。GPU 还用于在云端运行用于分类和预测的机器学习训练模型，以更低的功耗和基础设施实现了更大的数据量和吞吐量。早期使用\
  \ GPU 加速器进行机器学习的用户包括许多大型网络和社交媒体公司，以及数据科学和机器学习领域的领先研究机构。在一次机器学习应用测试中，使用 GPU 转录录制语音或多媒体内容的速度快了三倍。与仅用\
  \ CPU 相比，GPU 拥有数千个计算核心，可以实现 10~100 倍的应用吞吐量，因此 GPU 已成为数据科学家处理大数据的必备工具。\n\n### TPU\n\
  \n它是由 Google 专门开发的一种芯片，用于加速深度神经网络的计算能力。它通过优化片外内存访问、使用低计算精度以及使用比 GPU/CPU 组合快 15-30\
  \ 倍的脉冲数据流，极大地提升了计算能力。TPU 芯片使用高达 `24 MB` 的本地内存、`6 MB` 的累加器内存以及与主处理器对接的内存，总共占芯片面积的\
  \ 37%。这意味着 Google 充分意识到片外内存访问是导致 GPU 能效比低的主要原因，因此付出了巨大成本在芯片上放置了大量内存。TPU 的高性能也源于它对低计算精度的容忍度。研究结果显示，低精度操作导致的算法精度损失非常小，但它可以在硬件实现上带来巨大的便利，包括更低的功耗、更高的速度、更小的芯片足迹、更小的内存带宽需求等。TPU\
  \ 使用 8 位低精度计算，这意味着每一步所需的晶体管更少。在晶体管总容量不变的情况下，这些晶体管在单位时间内可以执行更多操作，允许使用更复杂、更强大的机器学习算法以获得更快、更智能的结果。GPU\
  \ 从内存中获取指令和数据需要大量时间。TPU 甚至不获取命令，而是由主处理器为其提供当前指令。这使得 TPU 实现了更高的计算效率。在矩阵乘法和卷积中，许多数据可以重复使用，相同的数据必须与许多不同的权重相乘得到最终结果。因此，在不同的时间，只需要从外部获取一两个新数据，其他数据只是上一次的位移。在这种情况下，刷新芯片上的所有数据然后获取新数据是非常低效的。基于这种计算特性，TPU\
  \ 增加了对脉冲数据流的支持，每个时钟周期移动数据并检索新数据。这最大化了数据重用并减少了内存访问时间，在减少内存带宽压力的同时也降低了内存访问的能耗。\n\n\
  \n\n\n# 人工智能及其重要性\n\n人工智能是机器完成人们认为它们无法做到的能力——这是一个非常主观的定义，但也是非常有意思的定义。一个计算机程序是否属于人工智能，完全取决于该程序是否在执行某些令人大惊惊的事情。这种经验主义的定义显然缺乏一致性，会根据不同的时间、不同的背景以及不同判断者的经验而采用不同的标准。\n\
  \n但这种定义往往反映了那个时代绝大多数普通人对 AI 的思考方式：每当出现新的 AI 热点时，新闻媒体和公众总是会用自己的经验来判断人工智能技术的价值，以及它在本质上是否具有“智能”。\n\
  \n人工智能通常指让机器具有人类智能的技术。这项技术的目标是让机器能够像人类一样感知、思考、执行和解决问题。人工智能是一个广泛的技术领域，涵盖了自然语言理解、计算机视觉、机器人学、逻辑和规划。它可以被看作计算机科学的一个分支（计算机除外），它还与心理学、认知科学和社会学相交叉。\n\
  \n## 机器学习\n\n机器学习是指计算机通过观察和与其环境交互来学习、自我更新和进步。我们都知道什么是计算机程序，程序是计算机可以执行的一系列指令，例如打印一张图片。\n\
  \n那么，机器学习与我们所知的程序之间的本质区别是什么？你可以想象程序是由机器编写的，而不是由程序员编写。那么，机器是如何知道如何写这个程序的呢？机器是从海量数据中学习的。\n\
  \n简单来说，大多数机器学习算法可以分为两个步骤：训练和测试，这两者可以重叠。通常情况下，训练需要训练数据，这些数据告诉机器以前人类学到了什么，例如什么是猫、什么是狗，以及在看到它们时应该停下。训练的结果可以被视为由机器编写的程序或被称为\
  \ `model` 的存储数据。\n\n通常情况下，训练有两种类型：监督学习和无监督学习。有监督就像有一个老师告诉你正确答案；没有监督就像是通过观察来学习。机器在数据本身中寻找模式和特征。\n\
  \n# 深度学习\n\n深度学习是机器学习的一种方法。它基于神经网络，适用于音频、视频、语言理解等。\n\n深度学习起源于神经网络，但现在已经超越了这一框架。到目前，几种深度学习框架，如深层神经网络、卷积神经网络、深度置信网络以及循环神经网络，已应用于计算机视觉、语音识别、自然语言处理、音频识别和生物信息学领域。\n\
  \n深度学习的动机是构建一个模拟人脑的神经网络来进行分析性学习。它模仿人脑的机制来解释图像、文本和声音等数据。通过学习深层非线性网络结构，可以使用简单的网络结构来实现复杂函数的近似，并展示出从大量无标记样本中学习数据集本质特征的强大能力。\n\
  \n深度学习可以获得更好地代表数据的特征，而且因为模型的级别很深（通常有 5 层、6 层，甚至 10 层隐藏层节点），所以“深”的优势在于你可以控制隐藏层节点的数量。它是输入节点数量的阶项式倍数，而不是指数级那么多，并且具有很强的表达能力，因此它具有表示大规模数据的能力。\n\
  \n## 人工智能的历史\n\n让我们简要回顾一下人工智能的三波浪潮。\n\n### 第一波浪（20 世纪 50 代）\n人工智能的第一波浪潮出现在 20 世纪\
  \ 50 年代。1956 年，在达特茅斯的人工智能会议上，`John McCarthy` 正式引入了“人工智能”的概念。\n\n（注：原文后续部分存在大量语义重复和逻辑破碎的问题，此处已根据原文语意进行对应对应翻译）\n\
  \n\n\n\n\n# 用户画像\n\n用户画像是计算广告的核心组件之一，广泛应用于契约广告、搜索广告、程序化交易广告等产品形式中。在契约广告中，广告主可以根据其品牌受众指定合适的定向条件以节省成本；搜索广告和程序化交易广告则可以基于用户画像，对每个广告点击的点击率和转化率进行更准确的估计，从而优化整体投放效果。\n\
  \n监督学习和无监督学习在用户画像中被广泛使用。例如，性别预测是一个典型的监督学习问题。我们可以根据用户填写的性别信息获取某些用户的性别，而对于其他用户，我们无法获得其准确性别，但某些广告是针对特定性别的品牌推广的。例如，专门经营男装的广告主可能需要针对男性投放广告。为了满足广告主的类似需求，我们需要根据用户的历史行为和其他既定特征（例如经常看足球、拳击等历史行为）对用户的性别进行建模和预测。预测其为男性的概率较高，与其他标签的原理类似。只要我们有足够的标注样本，就可以使用监督学习来建模和预测用户标签。监督学习模型可以使用\
  \ `logistic regression`、`support vector machine`、`decision tree`、`random forest`、`gradient\
  \ lifting decision tree`、`feed-forward neural network` 等。\n\n在搜索引擎中，例如可以根据用户的搜索和浏览历史来预测其性别，从而实现更准确的搜索广告。研究人员利用某大型网站的历史访问数据进行了实验。输入的特征是用户搜索和浏览过的历史网页文本，将每个词视为一个独立的一维特征。最终分类器学习更具意义的文本特征。发现，儿童、食物、家庭等是预测女性更重要的特征；而对于男性，运动、汽车、互联网等则更为显著。因此，特征学习的结果更加直观。\n\
  \n用户画像方法的另一大类类是使用无监督学习。无监督学习的目的是发现数据本身的规律，不需要使用标记数据。我们可以根据用户的历史行为和既有特征将用户分为特定的类别。对于每一类用户，虽然很难描述其准确标签，但已知他们具有高度的相似性，并预计在广告方面有某些共同兴趣。通过这种方式，通过应用聚类技术并将聚类结果用于点击率估计，广告的排序和选择通常会带来显著提升。常用的聚类方法有\
  \ `k-means`、`Gaussian mixture model`、`subject model` 等，它们都属于无监督学习的类别。\n\n# 点击率估计\n\
  \n点击率估计是效果广告中最重要的算法之一。为了优化广告效果，首先我们必须对广告展示后的效果进行准确判断（即点击率、转化率等）。在搜索广告中，结果通常通过广告的点击次数来衡量评估和结算，因此点击率估计的准确性在效果优化中起着关键作用。如果最终结果是转化，那么你还需要估计点击后的转化率。在许多场景下，真实的转化数据非常稀缺，很难直接使用转化数据来训练模型，因此通常将其降级为下一步，即“二跳”、加入购物车等行为建模。转化、二跳和加入购物车的建模原理与点击率预测非常相似，因此我们仅以点击率预测为例，介绍算法流程和常用模型。点击率估计可以抽象为一个二分类问题。它所解决的问题是：给定一个请求和与请求匹配的广告，预测广告展示后获得点击的概率。标签可以从真实的落地数据中获得，在历史落地结果中，命中记录标记为\
  \ 1，其余的标记为 0。点击率估计主要分为采样、特征提取与组合、模型训练、模型评估等步骤。\n\n# 广告搜索\n\n广告检索阶段的任务是检索所有符合根据查询词（query）、受众和其他定向条件的投放广告。例如，根据查询词的歧义性，应该尽可能地召回与查询文本语义相似的广告，供下一阶段的广告排序和选择算法使用。这一阶段主要以召回率作为评估指标，因为未来漏掉的广告将失去展示的机会。解决模式匹配问题的经典方案是查询扩展。用通俗的话，就是为当前查询找到一组语义相关的查询，并将由其中至少一个查询检索到的广告加入到备选集中。查询扩展的本质是计算两个查询之间的文本相似度，或者寻找为给定查询生成另一个查询的概率。前者可以基于\
  \ `topic model` 和 `Word2Vec` 算法实现，而后者可以通过 `deep neural network` 等方法进行建模。\n\n# 广告排序/选择\n\
  \n\n\n\n\n# 广告场景\n不同的广告业务场景在这一阶段有不同的决策风格。对于合约广告，我们的目标是满足合同中规定的每日曝光量（曝光不足的惩罚），且不涉及点击率（CTR）估计。因此，广告排序和选择问题可以建模为受约束优化问题。所以广告的选择可以为一个二分图匹配问题；优化的目标是总收益最大化。\n\
  \n# 机器翻译\n机器翻译是计算语言学的一个分支，也是人工智能的重要应用，可以追溯到 20 世纪 50 年代。随着互联网的快速发展，人们对语言翻译的需求日益增长。根据维基百科，互联网上有数百种不同的语言，英语占据了所有互联网内容的一半左右。英语互联网用户仅占所有互联网用户的四分之一。跨领域的语言障碍使得获取更多互联网内容成为一个日益增长的需求。机器翻译，即通过计算机将文本从一种语言翻译成另一种语言，已成为解决语言障碍的重要方法之一。早在\
  \ 2013 年，`Google Translate`每天提供的翻译次数就达到了十亿次，相当于全球一年的人工翻译量，也相当于一百本书的内容。\n\n机器翻译的研究经历了三个阶段：基于规则的方法、基于统计的方法和基于神经网络的方法。\n\
  \n## 1. 基于规则的方法\n机器翻译早期，主要使用基于规则的方法。机器翻译系统是一个机械过程，基于语言专家编写的翻译规则。基于规则的方法受限于人工编写规则的质量和数量，编写规则耗时耗力，且翻译规则无法在不同的语言对之间通用。同时，规则数量的增加和冲突规则的使其难以涵盖人类语言的所有情况，这也是机器翻译系统的瓶颈。\n\
  \n## 2. 基于统计的机器翻译 (SMT)\n20 世纪 90 年代，提出了基于统计的机器翻译（`ST`）方法，并迅速成为翻译研究的主流方法。统计机器翻译（`SMT`）使用双语平行语料库（包含源语言和目标语言文本的语料库）作为训练数据。著名的罗塞塔石可以看作是一个古代，用神圣文字、世俗文字和古希腊文字书写的相同文本。罗塞塔石的发现为语言学家提供了破解文字的关键。\n\
  \n统计机器翻译模型从平行语料库中挖掘不同语言单词之间的对齐关系，并根据对齐关系自动提取翻译规则。经典的统计机器翻译模型通常由三部分组成：翻译模型、重排模型和语言模型。翻译模型用于估计单词和短语相互翻译的概率，重排模型用于模拟翻译后语言片段的顺序。统计翻译模型减少了人工参与，且模型本身独立于训练过程，极大地提高了机器翻译的性能和应用范围。\n\
  \n## 3. 基于神经网络的方法\n近年来，随着基于神经网络的方法引入机器翻译领域，机器翻译的性能得到了极大提升。根据谷歌机器翻译团队发布的信息，`Google\
  \ Translate`于 2016 年 9 月推出了其中英神经网络模型，截至 2017 年 5 月，它已支持 41 对双语翻译模块。超过 50%的翻译流量已由神经网络模型提供。目前，机器翻译的效果仍然难以达到人工翻译的水平，但随着机器翻译性能的提高，其应用场景日益多样化。`Google\
  \ Translate`发布于 2006 年，已有十多年历史，现在支持数百种不同的语言，涵盖网页、移动客户端、App API 等。2017 年 5 月，`Google\
  \ Translate`每天为 5 亿人提供翻译。微软、百度、网易等国内外公司也在不断优化其机器翻译服务以供公众使用。\n\n尽管各种类型的机器翻译服务不能直接用于书面翻译，但理解其他语言的障碍已大大减少，机器翻译在许多场景中发挥了很好的辅助作用。出国旅行时，语言障碍是许多人的大痛点。各种手机\
  \ App 拍照翻译让人们能够轻松快速地理解外国地标或菜单。机器翻译领域吸引了越来越多的关注，但也面临着巨大的挑战。如何克服现有缺点（如神经网络模型解释性差等）以实现翻译性能的进一步提高仍然是一个待解决的问题。目前，机器翻译的应用仍处于对其他语言的简单理解、辅助翻译等方面。但随着所有关注和人才的涌入，机器翻译将继续繁荣，人类世界的巴别塔将得到重建。\n\
  \n# 人机交互\n人机交互也是人工智能整合的方向。在人机交互过程中，语音和图像识别使机器能够理解人类输入信号，预测模型和强化学习模型帮助机器做出有效理性的判断并获得学习能力。智能控制方法允许机器执行人类指定的动作或提供有效的反馈。可以说，人机交互包含了人工智能的所有方面；人机交互的快速发展意味着人工智能整体水平的进展。\n\
  \n在过去的几十年里，人机交互领域取得了巨大进展，经历了三次重要的飞跃：\n\n1. **第一**，20 世纪 70 年代初，人机界面的概念被正式提出，首次人机系统国际会议召开，第一本相关专业期刊（`IJMS`）出版，许多研究机构和公司相继建立了人工交互中心。\n\
  2. **第二**，20 世纪 80 年代初，人机交互学科逐渐形成了自己的理论框架和实践框架，更加强调认知心理学的理论指导以及行为和社会学人文科学；在实践框架中，更强调人机之间的反馈交互，“人机界面”术语被“人机交互”所取代。\n\
  3. **第三**，随着高速处理芯片、多媒体技术和互联网网页技术的快速发展和普及，人机交互的研究重点转向人机交互、多模态（多通道）多媒体交互、虚拟交互以及智能交互。\n\
  \n# 在人工智能时代如何超越\n在人工智能时代，仅通过记忆和练习就能学会的风格化、重复性技能将成为机器几乎可以完成的最低价值技能；相反，体现一个人综合素质的技能将最有价值。例如，人类对复杂系统的综合分析能力、决策能力、艺术审美和创造性思维、通过生活经验和文化修养产生的直觉和常识、基于自身情感（爱、恨、热情、冷淡等）与他人互动的能力——这些是\
  \ AI 时代最有价值、最值得培养和学习的技能。如果我必须总结一下，我认为人工智能时代最核心且有效的学习方法是：\n\n\n\n\n\n# 教育与机器学习的未来\n\
  \n- 主动挑战极限。主动接受一切挑战，在挑战中不断自我。如果人类不通过挑战自我来进步，确实有可能完全被智能机器所淘汰。\n\n- 在做中学习。面对实际中的问题以及综合复杂的问题，将基础学习与应用实践相结合，而不是先学习后后。。虽然对某些人来说（像现代职业运动员为了匹配训练量，对个人素质有更高要求），但边学边练的方法效果更好。\n\
  \n- 关注启发式教育，以培养创造力和独立解决问题的能力。被动的指令导向型工作大部分可以被机器取代。人的价值将体现在更有创造性的工作中。启发式教育在这里非常重要。死记硬背和规则只会“阻塞”学生灵感和创造力的源泉。\n\
  \n- 尽管面对面课程仍然存在，但互动式在线学习将变得越来越重要。只有充分利用在线学习，教育资源才能完全共享，确保教育的质量和公平。像 `VIPKid` 和 `Boxfish`\
  \ 等创新创业企业就是利用在线和机器辅助教育进行教育创新以帮助孩子学习的公司案例。\n\n- 积极机器学习。在人机协作的未来，人类擅长的和机器擅长的将大不同。人类可以向机器学习，并从\
  \ AI 计算模型、想法甚至基础逻辑中汲取结果，这些可以帮助改进人类思维的方式。事实上，`Go` 职业选手已经在从 `AlphaGo` 中学习更好的模式和招法了。\n\
  \n- 学习人机合作与人机协作。未来的通信能力将不仅限于人与人的交流。人机通信将成为一种重要的学习方法和目标。从学习的第一天起，学生就会与面对或远程同学（无论是人还是机器）讨论，设计解决方案并共同进步。\n\
  \n- 学习在于遵循你的兴趣。通常情况下，你的兴趣是深层次的，所以如果你遵循兴趣，你更有可能找到一份不易被机器取代的工作。为了美、为了好奇心以及出于其他原因的兴趣，这些兴趣可能会达到更高的水平，使人类能够创造机器无法取代的价值。\n\
  \n## 结论\n\n感谢你读完《机器学习入门：面向零基础者的机器学习基础》。希望这本书能为你提供有益的信息，并为你提供实现目标（无论目标为何）所需的所有工具。下一步是借助学术期刊和教材的帮助，更详细地学习机器学习算法。我们已经结合现实生活的丰富案例详细讨论了机器学习，并对即将引领世界的人工智能时代有了深入理解。这本书提供了关于机器学习和深度学习算法的大量信息，以及与我们日常生活紧密相连的真实案例。如果你对了解更多机器学习感兴趣，请访问\
  \ `IBM Watson` 网站，可以在那里免费进行各种人脸识别练习。`Watson` 以其复杂的实验而闻名。为了对机器学习有更好的整体了解，开始在处处寻找它吧。奇怪的是，这并不困难，因为你可以在许多现实生活应用中发现它。\n\
  \n***\n\n# 商业领域工智能与机器学习\n\n## Scott Chesterton 著：现代公司如何在业务中处理 AI 和 ML，以及 AI 和 ML\
  \ 如何改变其业务战略\n\n# 引言\n\n许多人仍然将人工智能（`AI`）与科幻、反乌托邦联系在一起，但随着 AI 的扩张并在我们的日常生活中变得平庸，这种趋势正在逐渐减少。今天，人工智能是一个随处可见的常用语。虽然主流社会对\
  \ `AI` 的接受是一个新现象，但它并不是一个新想法。`AI` 这一领域诞生于 1956 年，但花费了多年的工作，才在构建 AI 系统并将其变为现实方面取得了实质性进展。\n\
  \n当涉及到业务时，人工智能有广泛的应用。事实上，我们中的许多人每天都以某种方式与人工智能进行交道。从平凡到惊叹，`AI` 已经在改变所有行业中的每一个业务流程。随着人工智能技术的不断发展，对于想要保持竞争优势的企业来说，这些技术正变得必不可少。这本书将阐明人工智能和机器学习如何转型商业领域。我们将从探索\
  \ `AI` 和机器学习的基础知识开始，在深入探讨 `AI` 和机器学习的应用之前。你还将学习如何在你的企业中实施 `AI`。请继续阅读以了解更多。\n\n\n\
  \n\n\n# 第一章：入门指南\n\n十年前，如果你在会议室里说“人工智能”这个词，你极可能会遭到人的嘲笑。对许多人来说，它会让他们联想起科幻电影和情感。而今天，它已成为商业和工业领域最流行的词汇之一。随着公司致力于利用不断增长的产生和收集的大数据来获取优势，AI\
  \ 技术已成为当今许多数字化变革的关键枢纽。\n\n那么，这种变化是如何发生的呢？部分归功于大数据革命本身。数据的本质促使了人们对如何处理、分析和实施数据的方法进行了广泛研究。由于机器比人类更适合从事这项工作，因此重点在于训练机器智能地执行这些任务。这引发了学术界、工业界以及处于两者之间的其他开源社区的研究兴趣。它导致了各种成功和发展，这些发展展示了它们产生巨大变革的能力。\n\
  \n## 什么是人工智能？\n\n描述人工智能的理念随着时间而变化，但其核心概念始终是设计出能够像人类一样思考的机器。人类已经证明了他们可以解读周围的世界，并利用收集的信息来实施改变。如果我们想创建机器来高效地协助我们完成这项工作，那么将自己作为蓝图是合理的。那么，AI\
  \ 可以被视为激发抽象思维、创造性思维以及学习能力的潜力。\n\n人工智能的研发工作被分为两个分支。一种被称为“应用人工智能”（applied AI），它应用激活人类思维的原理来执行某个特定任务。另一种被标记为“通用人工智能”（generalized\
  \ AI），它试图实现能够像人类一样胜任任何责任的机器智能。\n\n在应用、专业的人工智能领域的研究已经在许多学习领域取得了成功，例如在量子物理学中，它被用于建模和预测系统的行为。在工业领域，它被应用于金融世界，用途范围从欺诈检测到通过预测客户可能需要的服务来增强客户服务。在制造业中，它被用于控制劳动力、生产操作，并在故障发生前进行预测，从而实现预测性维护。\n\
  \n在消费领域，我们日常生活中应用的大多数技术都是由 AI 驱动的，从谷歌的 `Google Assistant` 和苹果的 `Siri Assistant`\
  \ 等手机助手，到自动驾驶汽车（许多人认为后者将在我们一生中超越手动驾驶汽车）。通用人工智能要实现完全的人脑激活还遥遥无期，因为它需要比我们目前对器官更全面的理解，以及比目前研究人员拥有的更多的计算能力。然而，考虑到技术变化的速度，这种状况可能持续不了多久。一种被称为“神经形态处理器”（neuromorphic\
  \ processors）的新型计算机芯片正在开发中，以帮助高效运行大脑模拟代码。\n\n## AI 的关键进展\n\n所有这些发展之所以能够实现，是因为对模仿人类思维过程的关注。近期研究领域最成功的领域是“机器学习”。你将简要地学习它。这一领域对现代\
  \ AI 至关重要，以至于“人工智能”和“机器学习”这两个词有时会被互换使用。但这种对语言的应用是不精确的，正确的思考方式是：机器学习展示了更广泛的人工智能领域的当前领先水平。机器学习的中点在于，机器不需要被教逐步执行每一步，如果它可以被指示像我们一样思考，就可以通过分类、观察和从错误中学习来工作。\n\
  \n## 机器学习定义\n\n谷歌自动驾驶汽车和 Netflix 推荐系统的共同点是，它们在某种程度上使用机器学习来执行重复决策，并在极少人工交互的情况下独立适应。机器学习可以定义为让机器像人类一样学习和行为，同时自主地从真实世界的交互和数据集进行学习的科学。机器学习并不是新技术。模式识别和机器学习应用背后的算法已经存在一段时间了。但直到现在，机器学习模型开始与复杂数据集连接，并从之前的计算和预测中学习，以产生重要的决策和结果。开发一个正确的模型，你就获得了一个绝佳的机会，可以在业务中避免未知风险并选择盈利机会。\n\
  \n## 商业领域的机器学习工具\n\n谷歌、微软和苹果是机器学习应用领先的一些科技公司。苹果已经生产了其 `Core ML API`，旨在提高 iPhone\
  \ 上人工智能的速度。微软拥有 Azure 云服务，其中包括一个 `Emotion API`，它可以检测愤怒、惊讶、悲伤和厌恶等人类情感。这些工具的一个共同点是它们是动态的，并且适应新规则、新获得的信息和新环境。\n\
  \n从推荐引擎到脸部识别，机器学习是处理大数据和做出大决策的主要工具。在业务必须领先于当前威胁、人为错误和竞争的情况下，这项技术允许组织比以前更加敏捷和反应迅速。此外，通过结合机器学习改进流程并做出数据驱动的决策，公司应该更有效地控制其数据安全，且不会减慢员工的速度。解决方案是充分的数据保护。\n\
  \n\n\n\n\n# 第 2 章：为什么使用机器学习\n\n人工智能对未来的变革将比任何其他类型的创新都更加强大。人工智能的加速速度已经令人惊讶。如今，可用数据量和多样性正在迅速增长，计算处理变得更加廉价，存储也更加便宜。机器学习和人工智能自\
  \ 20 世纪中叶就出现了，但直到几年前才开始流行。为什么如此？机器学习又有什么意义？\n\n正如前文定义的，机器学习是计算机科学的一个领域，它赋予了计算机学习的潜力。机器学习的核心是生成可以经过训练以执行任务的算法。它与计算统计和数学优化领域密切相连。它拥有许多方法，如`半监督学习`、`监督学习`、`无监督学习`以及`强化学习`，每种方法都有其自身的算法和用例。\n\
  \n## 为什么机器学习很重要\n\n人工智能在未来至关重要。任何不理解它的人很快就会被淘汰。他们将被技术包围，以至于可能开始认为它是魔法。这种加速速度已经令人震惊。\n\
  \n2015 年，Google 成功训练了一个对话代理，它不仅能作为技术支持帮助台与人类互动，还能讨论道德问题、回答一般的基于事实的问题并表达观点。同年，DeepMind\
  \ 构建了一个代理，在 49 玩雅达达游戏中击败了人类，并以游戏分数和像素作为输入。第二年，DeepMind 通过生成一种名为 `A3C` 的最新先进游戏方法超越了他们之前的成功。与此同时，`AlphaGo`\
  \ 击败了顶级的人类棋手，这是机器击败象棋后，人类主导的二十年来的一项卓越成就。许多大师无法理解，一个工具是如何掌握这种古代中国战争策略的细微差别和复杂性的。\n\
  \n为了更好地理解机器学习的用途，请考虑机器学习的一些场景。这些领域包括网络欺诈检测、Google 自动驾驶汽车以及在线推荐引擎，例如 `Facebook`、`Netflix`\
  \ 显示你可能喜欢的电影和节目，以及 `Amazon` 上的“更多待考虑项目”和“为你识别物品”。所有这些例子都描述了机器学习在当前数据丰富的世界中开始发挥的重要作用。机器可以支持过滤关键信息，协助重大发展。我们目前正在看到以下技术在不同行业中的应用。随着该领域的不断变化，机器学习的应用、作用和需求不断上升。大数据在过去几年中变得非常流行，这是因为机器学习复杂性的增加，它有助于分析海量数据。机器学习进一步改变了数据提取的方式，并通过应用替代传统技术的自动化通用方法集改变了理解数据的方式。\n\
  \n# 第 3 章：监督学习\n\n通过在数字广告上投入更多资金，我们将产生多少收益？明天股市可能会发生什么？当涉及监督学习问题时，我们从一个带有标记标签的训练示例的数据集开始。例如，当你学习分类手写数字时，监督学习算法将接受数千张手写数字图片，以及代表每张图像所代表的正确数字名称。算法将学习图像与相关数字之间的联系，并使用学习到的关系对机器以前没见过的新照片进行分类。这就是你如何通过手机拍照来存入支票。\n\
  \n为了演示监督学习是如何工作的，让我们回顾根据个人完成的教育年限预测年收入的挑战。从形式上说，我们想创建一个模型来估算高等教育年限 `X` 与相关年收入 `Y`\
  \ 之间的联系 `f`。\n\n![](img/image1039.jpg)\n\n尽管如此，你可以通过添加解释学位类型、学校层次和工作经验的规则来定义一个复杂的模型。然而，有时这种基于规则的编程可能无法在复杂数据上正常工作。监督机器学习通过让计算机完成工作来克服这一挑战。通过选择数据中的模式，机器可以创建启发式。这与人类学习的关键区别在于，机器学习可以在计算机硬件上运行，最好通过统计学和计算机科学学习。对于监督学习，机器试图通过学习算法执行标记训练数据，从零开始学习收入与教育之间的联系。这个学习到的函数可以用于估算收入\
  \ `Y` 未知的人的收入，只要你有教育年限 `X` 作为输入。这意味着你可以将模型应用于未标记的测试数据以估算 `Y`。监督学习的重点是在提供新示例 `X`\
  \ 时对 `Y` 做出准确预测。\n\n## 监督学习的两个功能：分类和回归\n\n回归将预测连续目标变量 `Y`。它将允许人们估算一个值，例如取决于输入数据\
  \ `X` 的人类寿命。在这种情况下，目标变量描述了我们关注预测的未知变量，连续意味着 `Y` 可以取的值之间没有间隙。人的体重和身高是常数值。另一方面，离散变量只能假设有限数量的收益。例如，一个人的孩子数量是一个独立变量。收入预测是回归的经典示例。输入数据\
  \ `X` 由数据集中所有关于人的相关信息组成，用于预测收入，如教育年限、年龄、职位名称、工作经验年限等。这些属性被描述为特征，可以是数值型或类别的。你可能需要尽可能多的与这些特征相关的目标输出\
  \ `Y` 的训练观测值，以便你的模型学习 `X` 和 `Y` 之间的连接 `f`。\n\n数据由测试数据和训练数据组成。训练数据包含标签，但测试数据没有标记。这意味着你不知道尝试预测的值。模型能够泛化到以前没过的实例是非常关重要的，这样它在测试数据上就能表现良好。那么，如何在现实世界中创建准确且必要的预测模型呢？很好，这是通过监督学习算法实现的。现在让我们进入兴奋的部分：学习更多算法。我们将学习一些实现回归和分类的方法，并贯穿始终重要的机器学习概念。\n\
  \n## 机器学习中的线性回归\n\n这是用于回归问题的简单模型，其中目标变量是一个实值。例如：让我们从一个例子开始。假设我们有一个关于房屋位置和价格的数据集。我们的任务是创建一个可以预测价格的机器学习模型。以下是我们的数据集：\n\
  \n| 面积 (sq.ft) | 价格 (1k$s) |\n| --- | --- |\n| 3456 | 600 |\n| 2089 | 395 |\n| 1416\
  \ | 232 |\n\n\n\n\n\n当我们绘制数据时，可能会创建出此类的内容：![](img/image1092.jpg) 让我们深入研究线性回归以理解这一点：线性回归属于线性模型。该模型确定了输入变量与单个输出变量（`y`）之间的关系。它们可以通过合适的输入变量（`X`）组合计算出来。如果存在单个输入变量，则称为简单线性回归。然而，当存在多个变量时，就发生了多元线性回归。\n\
  \n### 简单线性回归\n这使用回归线定义了目标变量与输入变量之间的关系。总体而言，使用方程 `y = m * X + b` 表示范围。在这种情况下，`y`\
  \ 是因变量，`X` 是自变量，`m` 是梯度，而 `b` 是截距![](img/image1102.jpg)\n\n### 多元线性回归\n当有一个输入变量时，可以使用多元线性回归方程。但你通常会处理具有多个输入变量的数据集。存在多个特征的情况被称为多元线性回归，或线性回归。之前的简单线性回归可以总结为多元线性回归：![](img/image1108.jpg)\
  \ 在多元线性回归的情况下，预测是 n 维空间中的超平面。例如，在 3D 情况下，图表将如下所示：![](img/image1113.jpg)\n\n### 代价函数\n\
  不同的权重值提供不同的线，任务是识别出达到最佳拟合的权重。你想要找到答案的问题之一是如何为你的数据确定最佳直线。或者在给定两条线的情况下，如何学习出最优。为此，你需要创建一个代价函数，该函数在给定\
  \ `w` 的值的情况下，衡量 `y` 的值与相应的真实值有多接近。在这种情况下，特定的权重集如何预测目标值？线性回归中应用均方误差代价函数。这是不同数据点 `(xi,\
  \ yi)` 之间预测值 `y(x)` 与目标值 `actual` 之间平方误差的平均值![](img/image1121.jpg)\n\n### 差差\n代价函数描述了基于精确目标与预测目标之间距离的代价，这被称为残差。残差定义如下：![](img/image1127.jpg)\
  \ 如果某条直线距离所有点越远，残差就会越高，代价函数也越高。如果范围太接近端点，残差将减少，从而代价函数也会降低。\n\n## 监督式学习\n\n### 商业数据科学中的案例\n\
  近年来，机器学习（`ML`）改变了我们运营业务的方式。一项将机器学习与其他自动化技术区分开来的突破性成就，仅比基于规则的编程一步之遥。`ML` 算法支持工程师利用数据，而无需编写程序让遵循一套解决问题的路径。但机器根据它们接收到的数据生成正确答案。这种能力使业务高管重新考虑他们使用数据做出决策的方法。用通俗的话说，机器学习用于通过应用历史数据作为训练示例来对传入数据进行预测。例如，你可能想通过确定未来与客户关系的净利润来预测电子商务商店客户的终身价值。如果你有关于客户与你网站各种互动的历史数据，以及与这些客户相关的净收益，你就想应用机器学习。它将支持尽早发现可能产生净利润的客户，允许你在他们身上投入更多精力。\n\
  \n尽管有许多学习技术，但最常用的技术是监督式学习。在本节中，你将学习数据科学的这一领域，以及为什么对于计划专注于 `ML` 程序的业务来说它是“易摘取的果实”，外加上最流行的用例。\n\
  \n### 监督式机器学习是如何运作的？\n机器学习要求对于传入数据的预期解决方案是未知的，但已经在历史数据集中被选中。这意味着历史数据具有正确答案，算法的作用是在新数据中识别出它们。例如，在一个特定的葡萄牙银行机构在\
  \ 2012 年的一项营销计划收集的公共数据集中，该银行侧重于通过拨打电话和推销服务来支持客户订阅存款条款。通常，数据集存储在表格中，数据项以行形式排列，变量在列中排列。带标记的数据集还包括目标变量，即在未来数据中需要预测的值。在接下来的数据集中，目标变量描述了客户在电话后是否订阅了存款条款。\n\
  \n无监督学习被用于识别人类无法自行假设的数据缺陷。与强化学习相比，它更具实用性。\n\n### 监督式学习的用例\n2016 年，Tech Emergence\
  \ 发布了一项针对人工智能专业人士的小型调查结果，描述了适用于中小型公司的人机机器学习“易摘取的果实”应用。尽管 26 名受访者可以投多次，但他们承认这已经是显而易见的。有趣的是，Tech\
  \ Emergence 使用的群体对各种机器学习任务中用例的分布仅提供了模糊的理解。例如，可以将大数据应用于所描述的任何组，因为算法可以处理海量且结构化差的数据集，无论数据来自哪个行业和领域。此外，在涉及分析时，销售任务总是与营销任务交织![](img/image1144.jpg)使用\
  \ `ML` 处理此数据集有助于确定其他银行客户订阅存款的概率。训练 `ML` 算法意味着使用数学方法之一将上述数据输入机器。该过程支持创建一个可以定义未来数据中目标变量的模型。在这种情况下，算法的作用是将数据项分类。通常情况下，监督学习涉及三类主要任务：\n\
  1. **二分类**：上述的二分类将数据分为两个部分。\n2. **多分类**：在这种方法中，算法在多种类型的响应之间进行选择。\n3. **回归**：回归模型预测常量值，而分类模型关注类别。例如，将净利润作为客户价值的决定因素是一个标准的回归问题。\n\
  \n## 监督式学习应强调的挑战\n\n### 数据收集\n数据是 `ML` 的核心方面。拥的数据记录越多，创建准确模型的概率越大。你之后将学习更多关于数据收集的内容。\n\
  \n### 数据标记\n在之前的例子中，数据标记看起来像是一项艰巨的任务。如果数据收集执行良好，标记是在电话之后或活动结束后定义的。但通常，情况比这复杂得多。假设你想自动区分坏苹果和好苹果。如果你使用图像识别方法，你需要创建一个包含坏苹果和好苹果的广泛集合。然后你需要手动对它们进行标记。由于图像识别只有在具有数千个示例的情况下才能工作，标记可能会消耗时间。\n\
  \n2006 年，Google 决定通过向用户推荐来完成图像标记\n\n### 营销与销售\n数字化了内部基础设施。随着企业资产通过物联网不断智能化，不同的智能传感器可以直接收集并传输数据到公有云，并在那里进行集中并进一步应用于……\n\
  \n### 物流\n寻找物流问题的解决方案是一个动态任务，因为经理需要考虑交付时间、关注点、预算、司机特征和其他变化的数据。对于许多拥有真实数据集的企业来说，供应链管理是一个巨大的挑战，那么创建基于\
  \ AI 的推荐系统是一个极佳的机会。\n\n### 故障预测\n另一个大机会是利用机器故障的历史来预测早期故障。复杂的 `ML` 算法可以根据人类可能不知道的明显因素进行预测。这使得低成本维护成为可能。\n\
  \n### 娱乐\n机器学习的另一个用例领域是娱乐。在这个领域，用户直接与算法交互。这些算法驱动从人脸识别到各种视觉变化的整个范围。该行业属于计划收购和交付嵌入到不同市场产品中的软件的\
  \ AI 初创公司。\n\n### 启动机器学习涉及数据\n对于监督式学习最容易的行业是产生最多数据的行业，这些数据可以在公司内部进行组织和集中。\n\n\n\n\
  \n\n# 第 4 章：无监督学习\n\n与监督学习不同，无监督学习涉及的数据集没有标签。在没有标签的情况下，你可能学的是如何使用表示（representation）来重建输入数据。鉴于全球标记数据的比例很低，监督学习无法应用于大多数数据，以及模型在更多数据上进行训练时效果最好等事实，在无标签的数据集上进行无监督学习的机会是巨大的。\n\
  \nAI 的未来在很大程度上取决于无监督学习变得越来越好。深度神经网络获取的属性可以应用于聚类、回归和分类。神经网络通常是应用非线性函数的通用拟合器。它们通过通过预训练学习编译数据来生成“良好”的属性。在后一种情况下，神经网络会进入任意损失函数，将输入整合到输出中。\n\
  \n神经网络学习到的属性可以引导到其他类型的算法中，包括结合输入的传统机器学习算法、对其进行分类的逻辑回归，或预测数值的简单回归。因此，你可以将神经网络视为一个经常整合到其他函数中的方面。例如，你可以创建一个卷积神经网络，通过监督训练来学习\
  \ `ImageNet` 上的图像属性，然后你可以选取通过神经网络学习到的特征，并将它们迁移到第二个算法中，该算法将学习对图像分组。\n\n## 使用神经网络构建的用例属性\n\
  \n### K-means 聚类\n该算法根据刺激在向量空间中与其他输入的原始距离来自动对其进行标记。它没有损失函数或目标函数；`k-means` 具有质心。它通过对所有数据点进行重复平均来构建质心。`k-means`\
  \ 通过与特定质心的接近程度来定义新数据。每个质心连接到一个标签。这是无监督学习的一个极佳示例。聚类的主要功能是生成数据点组。\n\n#### K-Means\
  \ 聚类步骤\n1. **定义 `k` 个质心。** 这些将随机初始化。也有更好的算法来初始化质心以增加便利。\n2. **寻找最近的质心并更新聚类分配。**\
  \ 将每个数据点分配给所有 `k` 个簇。每个数据点被分配给最近的质心组。在这种情况下，“接近性”的衡量是一个超参数。\n3. **将质心转移到其所在簇的中心。**\
  \ 每个质心的新位置计算为该组内所有数据点的平均位置。\n\n继续重复步骤 2 和 3，直到质心在每次迭代中停止移动。这是 `k-means` 聚类运行方式的简要描述。`k-means`\
  \ 聚类的现实应用是定义手写数字。\n\n### 层次聚类\n层次聚类类似于普通的聚类，不同之处在于侧重于创建一个簇的层次结构。当你需要所需的组数量具有灵活性时，这可能很重要。例如，在像\
  \ `Amazon` 这样的在线市场中安排物品。在首页上，你可能需要特定的宽类别物品以便导航，但随着要求的变得具体，你会希望增加粒度级别。在算法输出的情况下，聚类分配还会创建一个非常大的树，通知簇与簇之间的层次关系。接下来，你可以从这棵树中选择你需要的组数。\n\
  \n#### 层次聚类步骤\n1. **从 `N` 个簇开始**，每个簇属于一个数据点。\n2. **合并两个靠近的簇**。现在你将有 `N-1` 个组。\n\
  3. **重新计算簇之间的距离**。有不同的方法实现这一点。其中一种是平均链接法聚类（average linkage clustering）。在这种方法中，你需要将两个簇之间的距离考虑为所有对应点之间的平均距离。\n\
  4. **重复步骤 2 和 3**，直到找到一个包含 `N` 个数据点的单个簇。你看到的树被称为树状图（dendrogram）。\n5. **选择不同的簇**并在树状图内部画一条水平线。在这个示例中，如果你需要\
  \ `k=2` 个组，你需要在某个距离处引出一条水平线。\n\n\n\n\n\n# 无监督学习中的好奇学生\n\n几十年来，机器学习在不同领域已经取得了巨大的进展。这些成功很大程度上是通过深度神经网络实现的。这两种方法都需要人类开发训练信号并将其传输给计算机。因此，学习的局限性是由人类训练者决定的。虽然一些科学家认为，全面的训练足以产生通用智能，但另一些人则认为，真正的知识需要更独立的学习方法。\n\
  \n例如，幼儿是如何学习的：她的祖母可能会和她坐在一起，给她看小汽车，或者在她完成拼图后给她礼物作为奖励。然而，幼儿的大部分时间都花在探索世界、试图理解周围环境、玩耍和观察上。无监督学习是一种为了构建自主智能而开发的方法，它通过给予智能体奖励，使其在没有特定任务的情况下，从观察到的数据中学习某些知识。这意味着智能体是为了“为了学习而学习”。\n\
  \n无监督学习的一个极佳的动力是是，尽管传输到学习算法的数据具有丰富的内部结构，但在训练中应用的目标和奖励通常是稀疏的。这意味着算法所学的大部分内容必须包含对数据本身的理解，而不是将知识应用于特定任务。\n\
  \n## 通过创造来学习\n\n无监督学习最直接的目标可能是训练算法来生成其自己的数据实例。这些被称为生成模型，它们不仅能重现准备好的数据，还能创建一个从数据中提取的类别模型。生成模型的引导规则可以创建一个有说服的数据示例。\n\
  \n对于图像，最好的生成模型是`Generative Adversarial Network (GAN)`，其中两个网络——生成器和判别器——参与了一场辨别的竞赛。生成器释放图像以挑战判别器使其相信它们是真实的。同时，判别器在检测到伪品时会获得奖励。被复制的、随机且杂乱的图像在多次迭代中得到了增强，网络之间持续的动态导致了越发真实的图像，在大多数情况下，这些图像与真实照片无二致。生成对抗网络还可以根据用户粗略的草图生成景观细节。\n\
  \n## 通过预测来开发\n\n这是无监督学习中一个著名的家族。在这里，数据被分为一系列细小的部分，每个部分都轮流被预测。这些模型可以通过猜测下一个将出现什么来连续产生数据，将猜测作为输入并再次猜测。\n\
  \n语言模型中每个词都根据之前的词进行预测，这是广为人知的例子。这些模型运行在某些消息应用和电子邮件上的文本预测。语言建模的最新进展允许生成合理的段落。文本中一个令人兴奋的不一致之处是，独角兽被认为是“四角”的，这对于探测网络理解的问题至关重要。通过调节用于控制预测的输入序列，自回归模型可以被用来将一种轨迹转变为另一种。自回归模型通过尝试按特定顺序预测数据的每一部分来学习数据。通过预测数据的任何部分，可以创建出一类通用的无监督学习算法。这可能涉及从序列中剔除一个词，并尝试从剩余部分中预测它。通过学习如何创建局部预测，系统被迫学习整个数据。\n\
  \n对生成模型的一个重大担忧是其被滥用的能力。修改视频和照片证据长期以来一直是可以实现的；生成模型可能会让出于恶意目的编辑媒体变得更加容易。\n\n## 重新想象智能\n\
  \n生成模型在它们的方式是至关重要的。等待一个具有产生数据能力的智能体是一种想象手段，因此有了对未来进行规划和推理的可能性。即使没有显式的生成，研究表明，学习预测环境的各种特征会增强智能体的世界模型，从而提高解决问题的能力。这些结果与我们对人类思维的直觉相一致。在没有显式引导的情况下学习关于世界的潜力，就是我们所谓的智能的原因。\n\
  \n## 在您的业务中实施监督和无监督学习\n\n机器学习可以是从大数据中创建可操作的业务洞察的极佳工具。然而，机器学习算法在应用数据进行学习的方式有所不同，这对业务应用具有关键影响。了解监督和无监督技术的工作原理以及它们之间的差异对于您的业务自动化非常重要。\n\
  \n### 监督学习\n\n监督机器学习要求数据科学家训练算法，为特定的输入数据集生成正确的结果。通常，这需要向算法提供海量数据，以及机器需要从数据中提取的结论。有了足够的训练数据，机器学习算法在转换为新数据上进行损失计算时应该得出正确的结论。在具有训练算法带宽的业务中，这是一种独特的算法，因为它可以完成从纠错性财务审计到自动化非结构化数据输入的各种任务。\n\
  \n监督机器学习算法可以作为认知自动化，支持图像识别并从非结构化数据中提取信息。监督学习的缺点是它提取数据。最重要的是，这些数据在训练算法之前应该由人类进行人工策展。数据必须根据定义的输入变量集进行标记，并分类到有限的输出可能性中。虽然更多的训练数据会产生更准确的算法，但这个过程需要额外的人力，并严重取决于历史数据的储备。\n\
  \n### 无监督学习\n\n无监督学习比监督学习复杂得多，但它为特定的应用开启了大门。无监督学习没有训练阶段。然而，算法被提供数据集并使用数据内部的变量来选择和分离自然簇。这种算法的优点是它不需要监督学习所要求的人力密集型数据策展。其次，无监督学习可以检测出由于分析过程中人类偏见而人类无法看到的模式。\n\
  \n无监督学习的一个重要应用是客户细分。在这个例子中，算法对公司可能关注的客户人口统计数据中的潜在偏见是盲目的。结果是无监督学习可以生成一组特定的客户细分，为营销实践提供推理。\n\
  \n## 结论\n\n数据科学家使用不同类型的机器学习算法来识别大数据中的模式，从而产生可操作的洞察。监督机器学习在两者之间被广泛使用。它包含了`线性回归`、`逻辑回归`和`支持向量机`等算法。监督学习之所以命名，是因为数据科学家扮演了引导者的角色，训练算法应该得出什么样的结论。\n\
  \n\n\n\n# 第 5 章：构建机器\n\n\n\n\n# 更像我们那样的机器\n\n人工智能（AI）在业务中的功能已经从最初的科幻构想——电影机器人和会说话的门发生了变化。在一个人机交互技术以惊人速度变化、且“会说话的门”日益成为现实的世界里，`AI`\
  \ 的后续发展越是不完美、越像人类，它就变得越发“完美”。现在，我们可以应用 AI 工具来判断社交媒体的输出（Flickr 图片、推文、Instagram 帖子）是由是由恶意黑客编程的软件机器人生成的，还是由真实人类创建的。这里的关键点在于，当计算机在完成任何模拟人类行为的任务时，它们仍然略微过于完美了。即使被程序设定为包含常见的拼写错误和当地语言的短语，`AI`\
  \ 仍然是完美无缺的。人类更具互动性、更具上下文感知能力、更放松，而且总的来说具有不完美的娱乐性。编程讽刺和人类性格特质始终是一个重大风险。\n\n医疗领域的发展，如机器人接管高风险任务和困难任务的自动化，似乎是\
  \ `AI` 为各种类型的人带来的重大收益之一。`InsideSales` 的总监 Martin Moran（一家专注于销售加速自学习引擎的公司）强调，工程、客户服务和管理是\
  \ `AI` 增长的领域。他说：“本质上，如今行政工作繁重的部门从 `AI` 中受益最多。我们已经把 `AI` 从电影中带出来，达到了触性的认知智能 2.0 时代。”Moran\
  \ 认为，`AI` 的下一步将更密切地模拟人类，并在海量处理能力、海量数据访问和高度复杂的算法逻辑的基础上（类似于我们大脑）。同样，只有当这种 `AI` 智能深根于工作流程本身时，才会对业务产生正确且持久的影响。我们能够将自然语言理解的细微差别与人类行为趋势在正确上下文环境中相互作用的状态，推着我们进入更高水平的\
  \ `AI` 机器控制。利用真实人类的习惯特性开发 `AI` 的能力，可以让 `AI` 在真实的业务工作坊、办公室和工厂应用。\n\n## 如何构建更像我们那样的机器？\n\
  \n运营智能公司 `Splunk` 表示，完全改变 `AI` 的正确方法存在于机器内部，而不是首先对人类进行任何研究。机器学习的基础在于，通过机器上留下的数据对人类进行分析，可以产生洞察。人类与机器的每一次互动都会留下机器数据痕迹。提取这些数据为我们提供了对精确人类行为的准确记录，从我们在在线商店的活动到我们与谁交流，或通过设备上的地理位置设置去往哪里旅行。这类数据的大部分大多数组织只保留部分，有些根本没有被追踪。当我们开始将周围的世界数字化并将其定位到更细粒度的层级时，我们就可以开始开发更像人类的\
  \ `AI`，它对我们的行为有更近的反映。\n\n`AI` 需要关注的核心方面是它如何更自然地融入我们所称的人类互动叙事中。`AI` 智能必须本质上嵌入到公司运营方式的肌理中。只有这样，`AI`\
  \ 大脑才能开始学习我们周围这个完美的世界。由学习服务公司 `Pearson` 监督和召集的 `Project Literacy` 活动发布的一份新报告预测，目前由\
  \ `AI` 技术驱动的技术进步速度，将在未来 8 年内击败超过二分二十之一的英国成年人的文盲水平。机器阅读尚未完全掌握人类语言的所有细微差别。但技术的进步意味着，机器很可能在未来十年内获得超过\
  \ 16% 英国人的文盲潜力。这是根据马萨诸塞大学阿姆赫斯特分校的 Brendan O’Connor 教授说的。\n\n## 情感前沿\n\n`AI` 的下一步将发生什么？是情感。这意味着\
  \ `AI` 将能够理解、分类并对人类情感采取行动。通常，这项工作是直观的。一个人微笑露出牙齿的照片可能是开心的。眉头紧锁的人可能愤怒或沮丧，以此此类推。最近，我们开始加入关于用户可能在做什么或可能位于何处的额外上下文细节，从而发展出心情和情绪的正确画像。自然语言交互公司\
  \ `Artificial Solutions` 认为他们正在研究下一代 `AI` 认知。通过构建一个充满计算机“对话”的世界，这些对话与我们认为的教科书式英语大不相同。`Artificial\
  \ Solutions` 正在努力开发能够识别人类坏习惯并承认我们不可预测的口语差异的 `AI`。如今的 `AI` 正处于变得情感敏感、令人信服的自然且具有人类完美完美的点。所以，请对你的电脑好一点。它将离你越来越近。\n\
  \n## 聊天机器人可以学习你想要的\n\n客户服务的下一次变化由人工智能驱动，因此公司可以开始根据消费者的品味提供产品并关注他们。曾几何何时候，认为人工智能可以用于根据品味提供产品看起来很荒谬（注：此处原文似乎存在语义重复或逻辑混乱，译文已根据语境调整）。[后文重复省略]\n\
  \n\n\n\n\n# 第 6 章：预测模型分析结果的可视化\n\n通常情况下，你需要将预测分析的结果展示给关键相关人员。以下是一些应用可视化技术向利益相关者展示模型结果的方法。\n\
  \n## 可视化数据中隐藏的分组\n\n数据聚类是指从数据内部挖掘隐藏的连接项目群组的过程。在大多数情况下，一个簇由相同类型的数据对象组成，例如社交网络用户、电子邮件和文本文档。图中展示了如何查看数据聚类模型结果的一种方法。该图表示了从社交网络用户收集的数据中发现簇。与客户相关的数据以表格形式收集，然后对数据应用了聚类算法，发现了三类客户：流失客户、忠实客户和折扣客户。\n\
  \n想象 `X` 和 `Y` 轴代表从原始数据产生的两个主成分。主成分分析是一种数据降维技术。\n\n![](img/image1350.jpg)\n\n在这种情况下，三组之间的连接已经描述了改进和针对性营销活动可能发挥最大作用的地方。\n\
  \n## 可视化数据分类结果\n\n分类模型通常会对其检查的新数据点分配特定的类别。单个课程可能包括从聚类工作中开发的组。一旦你应用了聚类算法并在客户数据中识别出分组，你就进入了现实时刻：你获得了一个新客户，你希望模型能够描述他或她将成为什么样的客户。图片显示了新客户详情如何馈入预测分析模型，然后模型预测新客户所属的客户群。客户\
  \ `A`、`B` 和 `C` 将根据分类模型被分配簇。分类模型的应用产生了预测结果，即 `Customer A` 将属于忠实客户，`Customer B` 将是一个流失客户，而\
  \ `Customer C` 将会追求折扣。\n\n## 判断你的机器学习模型是否具有正确的性能\n\n一旦你为预测建模问题创建了机器学习模型，如何判断模型的性能是否良好？这是初学者经常面对的问题。初学者总是在寻找这个问题的解决方案。你希望有人告诉你\
  \ `x%` 的准确率或 `x` 的误差分数是否良好。在本节中，你将学到这个问题的答案，并知道你的模型好好坏。\n\n### 模型技能是相对的\n\n你的预测建模任务是特殊的。它由单个数据、你所应用的工具以及你将获得的技能组成。你的预测建模挑战以前没有被解决过。换句话说，你无法判断一个好的模型看起来是什么样的，或者它可能具有什么样的技能。根据领域知识，你可能获得关于高技能模型是什么样子的线索，但你不确定技能分在哪里可以获得。你能做的最好的事情是将机器学习模型在你的数据上的操作与在相同数据上训练的其他模型进行比较。\n\
  \n### 基准模型技能\n\n由于机器学习的性能是相对的，因此建立一个强大的基准（Baseline）是非常重要的。基准是直观的，易于遵循在预测建模任务上生成预测的程序。这种特定模型的技能为在你的数据集上最低可接受性能提供了基础。基准模型生成的的结果显示了其他在数据上训练的所有模型可以达到的技能起点。\n\
  \n基准模型的示例包括：\n\n- 预测回归挑战的平均结果结果。\n- 预测分类任务的众数结果值。\n- 将输入预测为输出。\n\n你任务上的基准性能可以作为评估其他模型的衡量标准。如果一个模型获得低于基准的结果，说明出了某些问题，或者该模型不适用于你的问题。\n\
  \n### 什么是最高分？\n\n如果你处理的是分类问题，最高分始终是 `100%` 的准确率。但如果你处理的是回归问题，正确的分数是 `0.0 error`。这些分数很难达到。所有预测建模任务都有预测误差。误差源于各种来源，如：\n\
  \n- 数据中的噪声\n- 数据样本的不完整\n- 建模算法的随机属性\n\n你无法获得最高分，但理解最佳可能的性能取决于你选择的指标是非常重要的。你理解实际模型结果将包含基准和最佳可能结果之间的范围。然而，你需要查看数据集上的潜在模型空间，并识别出现哪些好分和坏分。\n\
  \n### 识别模型技能的极限\n\n一旦你选择了基准，就可以决定查看模型在预测模型挑战上的性能范围。识别一个可以展示运行良好的模型对于确定你特定数据集上的预测很有帮助。应对这一挑战有很多方法。你可能想要尝试的两种包括：\n\
  \n- **高起点（Start High）**：选择一种复杂且已知在不同预测模型问题上运行良好的机器学习方法，如 `gradient boosting`。针对你的问题审查该模型并将其结果作为基准，寻找实现相同性能的最简单模型。\n\
  - **穷尽搜索（Exhaustive Search）**：回顾你想象中该问题的所有机器学习方法，并选择达到接近基准正确性能的方法。\n\n\n\n\n\n“高位启动”（Start\
  \ High）法速度快，能够允许你根据挑战预期的模型技能边界，并识别出可以获得相同结果的简单模型。它仍然允许你判断问题是否可以快速预测，这是非常重要的，因为并非所有任务都是可预测的。“穷尽搜索”（Exhaustive\
  \ Search）速度慢，适用于模型技能比任何其他考虑都重要的长期项目。两种方法都会生成群体模型性能得分，你可以将其与基准进行比较。\n\n在应用预测模型对新数据集进行评分时，为什么你应该保持敏感性？预测模型的创建是一个复杂的过程，涉及不同的假设、挑战以及对所建模对象真实性的承认。模型的创建不仅仅是因为某人有动力构建一个。模型的创建是基于对所建模对象真理的良好定义的理论概念化。记住这一点，建模者会寻找所需的数据集，他知道这些数据集可以用于创建模型，以预测可能达到任何预期结果的结果。因此，使用所建模现实的“良好”历史数据创建模型来预测相同的结果，在实践上总是重复且毫无意义的。\n\
  \n一旦模型创建，它就可以应用于新的数据表，并使用与创建模型时相同的历史数据和背景，同时了解正在预测的内容以及新数据的历史特征。例如，一家汽车保险公司创建一个预测模型来处理可能想要加入其汽车保险保单的新客户，但需要对新客户进行评分，以了解一系列变量的风险。保险公司需要为每个客户识别一个评分，该评分可以应用于保险成本和保费的计算，加上可以预测的风险和相关的责任。已经创建的预测模型可以用于这些新客户以计算它们的预测得分，得分代表了风险水平。在确定新数据集时，模型开发中应用的每个变量都必须在评分的新数据表中体现，这是至关重要的。一旦模型用于新数据表，就会计算出风险的预测得分，该得分可供其系统确定每年的保险成本。得分越高，你在特定年份内理赔数量对保险公司产生重大影响的可能性就越小。得分越低，你提交理赔的可能性越大。得分可以按分位数进行排列。\n\
  \n尽管如此，这种技术可能存在很多问题。在理论上和应用本身中应用的假设可能会导致负面结果。学习你想要建模的数据（或你想要应用模型的数据）的历史背景至关重要。一家零售公司可能选择建立一个预测模型来检查哪种类型的目录活动特征具有更高的性能。每个活动的历史性质必须被清晰理解。因此，使用特定目录活动的历史流通数据建立模型并将该模型应用于其他活动的评分，可能会产生正面和负面的结果。\n\
  \n## 预测建模技术\n\n### 预测分析的定义\n它是利用统计算法和机器学习技术，根据历史数据计算未来结果的概率。其重点是超越描述性统计并展示发生了什么。预测模型具有已知结果，并可以用于为新数据构建预测结果。建模的结果反映了目标变量的概率。许多公司正在使用预测分析来提升其运营，并利用预测分析产生竞争优势。原因是：\n\
  \n- 它更快，且需要的计算机更廉价。\n- 数据量和数据类型的增加加上对生成重要信息的极大兴趣。\n- 困难的经济状况以及对竞争差异化的需求。\n\n由于软件变得更加互动和易于使用，预测分析不再仅仅是统计学家和数学家的领域。业务专业人士也在使用这些技术。预测建模技术已成为营销专家增强活动效果和说明投资回报率的最佳工具。通过创造性方法改进数据，出现了一种专注的、驱动的方法，在正确的时间向观众投放正确的内容。只要团队能够访问清洁、高质量的数据，创建活动连接目标受众的能力就比任何时候都要好。本节将回顾一些常见的预测建模方法，重点关注三种不同类型：\n\
  \n- 倾向模型\n- 智能推荐\n- 分群模型\n\n在每个类别中，一旦你准备好相应的工具，你将识别出业务可以立即实施的种预测建模方法。\n\n### 分群模型\n\
  客户分群在营销领域有着悠久的历史。曾经被认为是有根据的推测，现在已成为由硬数据驱动和辅助的战略方法。以下是预测建模方法，帮助你改进客户数据，以为你的活动开发精细的受众。\n\
  \n#### 1. 行为聚类\n当潜在客户转化为客户时，引导他们完成转化的路径对于关注利用预测分析的营销人员来说变得非常有价值。这些信息被称为 `behavioral\
  \ data`（行为数据），单单来看意义不大。当它与人口统计数据相结合时，它激励营销团队选择共同点和趋势，以构建新的目标细分。通过推送与该新目标细分人口统计背景具有相同系列行为动作的未来潜在客户，营销人员可以增强转化并准确预测其活动的效果。\n\
  \n#### 2. 钱包份额估计\n该技术描述了客户预算中分配给你的解决方案的百分比。百分比越高，通过上推或交叉销售产生增长的可能性越小。当这种技术与基于产品的聚类相结合时，正确的\
  \ `share of wallet estimation`（钱包份额估计）表示客户预算中有多少在竞争对手手中，以及你可以向客户销售的服务或产品以提高你的钱包份额份额。\n\
  \n#### 3. 流失概率\n大多数营销人员纯粹将预测分析用于潜在生成；这是错误的，因为强大的预测建模的防御能力是非常令人兴奋的应用场景。由于获取新客户可能比维护现有客户更昂贵，因此确保现有客户群应该是所有行业中最重要的方面。你正在确定客户利用用于通过行为分类潜在客户的相同方法产生杠杆的能力。如果你能准确预测潜在客户转化为新客户的概率，你就能准确确定客户离开的概率。\n\
  \n\n\n\n\n# 深度学习\n\n## 什么是深度学习？\n深度学习和机器学习都属于人工智能的范畴，但深度学习代表了机器学习的下一次转型。在机器学习中，由人类程序员编写的算法负责从数据中学习。它们根据从数据中所学习到的内容做出决策。深度学习则通过使用类似于人类大脑的人工神经网络来实现这一点，使机器能够以与人类相同的格式分析数据。深度学习机器不需要人类程序员告诉它们该如何处理可用数据。\n\
  \n## 深度学习模型与人工智能在现实世界中的应用实例\n对我们许多人来说，深度学习和 `AI` 等概念仍然很新颖。大多数第一次接触这些术语的人都会表现出复杂的感情。机器如何可能学习并执行本该由人类的工作？是什么定义了一个整个以“让设备行为像人”为基础而建立的行业？尽管这些问题至关重要且需要讨论，但消除许多怀疑很容易。这意味着，如果我们已经准备好考虑深度学习和\
  \ `AI`的一些现实世界应用，本章将探索 `AI` 和深度学习如何改变各个行业。\n\n## 深度学习源于何处\n机器学习和深度学习都是 `AI` 的分支。深度学习是\
  \ `ML` 的高级阶段。在 `ML` 中，人类程序员构建从数据中学习并进行分析的算法。深度学习与机器学习的区别在于它运行在人工神经网络上，这种网络紧密代表了人类的大脑。相同的网络使机器能够以人类相同的方式分析数据。这些具有深度学习能力的机器不需要执行人类程序员的命令。深度学习通过我们每天生成和使用的海量数据实现。每个深度学习模型利用数据来支持数据处理。\n\
  \n## 深度学习浅析\n人工智能是人类发展中最重大的进展。如果你正在阅读这些，可能已经了解了 `ML` 和深度学习等概念。如果你想了解更多关于深度学习是如何运作的，以及它在\
  \ `AI` 和 `ML` 中的地位，请继续阅读。深度学习与使用软件模拟人类有关。现在你已经对对`ML` 和 `AI` 有了许多了解。你可能会问这些问题：\n\n\
  1. 深度学习在 `AI` 和机器学习中的作用是什么？\n2. 深度学习是如何运作的？\n\n### 深度学习在 `AI` 和 `ML` 中的作用是什么？\n\
  `ML` 和深度学习属于 `AI` 的同一类别。现在，`AI` 是一个广义术语。它不是绝对的。通常，我们通过机器和软件能够模拟人类智能所做的一切都是 `AI`\
  \ 的一部分。它存在今天使用的某些技术中。因此，在接下来的范围内，深度学习和机器学习可能是两种方法，即实现 `AI` 条件的两种方法。但深度学习和机器学习并不是相互独立的。换句话说，深度学习可以包含机器学习的特定属性，但机器学习的术语和应用并不要求任何属性。\n\
  \n机器学习可以定义为 `AI` 的一个分支，在其中软件程序可以在不需要人类干预的情况下改变其算法。虽然传统算法依赖工程师的输入来改变其功能，但机器学习算法可以根据用于训练它们的数据成功做到。\n\
  \n那么，与机器学习相比，深度学习处于什么位置？如前所述，`ML` 算法可以改变其算法以生成正确的结果。但如果预测不准确，`ML` 程序就必须由专家进行手动修改。然而，用于训练\
  \ `ML` 算法的数据集必须以某种特定的方式进行标签标记和组织，以便程序进行学习。例如，如果你想让一个 `ML` 程序学习区分狗和猫的图像，你需要向算法投送不同的猫和狗图像。然而，只有当你专门标记并组织数据，以一种支持\
  \ `ML` 算法掌握这些动物图像差异的方式时，它才会开始学习。\n\n现在你理解了 `ML` 的挑战，以及算法根据输入的数据改变其算法的方法不足以激活人类智能。而这就是深度学习介入之处。尽管\
  \ `ML` 试图通过掌握数据集和更改算法来激活人类智能，但深度学习努力模拟人类大脑本身的角色。\n\n## 描述深度学习\n深度学习是 `ML` 的一个分支。深度学习与\
  \ `ML` 之间的联系是因为两者在 `AI` 中都起着作用。此外，这两个概念都根据相同的原理工作，那就是在没有人类干预的情况下改变算法以生成正确的结果。但与机器学习编程不同，深度学习网络不需要掌握预测结果，而是它们可以利用未标记和非结构的原始数据来生成最佳结果。或者，深度学习网络并不依赖单层算法来生成结果；它们应用多层\
  \ `AI` 来处理数据并生成输出。\n\n## 什么是人工神经网络？\n人工神经网络试图模拟人类大脑中自然神经网络的功能。因此，为了理解 `ANN` 的运作方式，让我们快速学习我们大脑内部的神经网络是如何工作的。假设，如果我指示你从\
  \ 10 张不同的狗照片中选择一张特定品种狗的照片，那么你需要查看这 10 张照片中的每一张，并问自己几个问题来确定狗的品种，以及该品种是否是你正在寻找的。在这个过程中，会根据你大脑神经网络内部处理的查询产生单独的问题。例如，狗是什么颜色的？它长多大了？毛厚吗？神经网络会在几秒钟内在大脑中分析这些问题。\n\
  \n同样，人工神经网络(`ANN`) 必须分析这种情况，并通过神经网络的各个层接受数据。上述每一层都将尝试使用其自身的一组概念和查询来解决挑战。最终结果将该神经网络在投送的数据中可以识别的所有模式的汇编。，这就是人工神经网络以通俗易懂的方式运作的。\n\
  \n### ANN 和深度学习是一回事吗？\n下一个要解决的问题是 `ANN` 如何符合深度学习的定义。当然不，`ANN` 并不是深度学习。然而，当我们指向大量的\
  \ `ANNs` 时，我们会使用深度学习这一术语。由于由于原因，在某些情况下深度学习仍然被认为是深度神经网络。但无论你如何命名它，都无法否认它在自动驾驶等许多\
  \ `AI` 实现中发挥着关键作用的事实。以下神经网络能力的最佳示例最近由 `NVIDIA` 通过其对生成对抗网络（一种 `ANN` 形式）的研究向世界揭示。这些神经网络通过识别模式和对发送到网络中的图像进行学习，成功定义了新的且合理的面部。\n\
  \n那么，现在你理解了什么是深度学习，但你如何在业务中使用它呢？无疑，这些通俗易懂的描述仅有助于理解这些概念的基础。深入研究将使应用技术术语变得相关，而这通常对于那些寻找商业机会的人来说是无关的。所以，这是关于使用深度学习和神经网络你需要了解的内容。\n\
  \n1. 更多力量\n\n\n\n\n深度学习网络需要大量的计算资源，且大部分操作都是 GPU 密集型的。\n\n## 2. 海量数据\n\n深度学习网络之所以成为今天这样，不仅是因为其层结构和算法的发展，更多是因为其学习方式。数据是上述网络的基石，数据的质量越高，你从中提取出的信息质量就越高。\n\
  \n## 3. 高效的机器学习开发公司和软件开发团队\n\n并非所有公司都需要投入资金自己构建深度学习算法。事实上，引入全球顶尖的 IT 公司并将其作为合作伙伴，是通过技术应用获得竞争优势最受青的方法。\n\
  \n### 深度学习 vs. 机器学习\n\n在过去的两年里，机器学习和深度学习吸引了大量的关注。如果你想以最基础的方式理解这两个术语，本节将对你有帮助。所以，如果你能关注这一部分，你就能理解深度学习与机器学习之间的真实区别，以及如何利用这两者转化为令人兴奋的商业机会。到目前为止，你已经熟悉上述术语的基本描述。![](img/image1541.jpg)这是一组猫狗的图像。你认为当机器学习和深度学习网络需要对这些图像进行某种理解时，会发生什么？看看上面的图片。你看到的是一组猫和狗的图片。现在，假设你想使用机器学习算法和深度学习网络分别选择狗和猫的图片。\n\
  \n#### 深度学习和机器学习的基础：\n\n当使用机器学习解决此任务时：\n为了帮助机器学习将集合中的图像分为狗和猫两类，你需要向它一次性展示上述图像。但算法如何区分呢？这个问题的答案在于机器学习的定义——依赖于结构化数据。你需要做的是对猫狗的图片进行标记，以定义动物的某些属性。这些数据将足够机器学习算法进行学习，然后它将根据学到的标签继续工作，并通过所学的标签对数以百万计的其他动物图片进行分类。\n\
  \n#### 当使用深度学习解决问题时\n\n深度学习网络将使用不同的方法来解决同一个问题。深度学习网络的主要优势在于它们并不真的需要图片的结构化数据来分类这两类动物。使用深度学习的\
  \ `ANN` 网络通过网络的不同层传递输入，每个网络分层地定义图像的某些属性。在某种程度上，这类似于人类脑的工作方式，通过不同层级的思想和相关问题发送查询来识别答案。一旦数据通过深度神经网络中的层处理，系统就会识别出用于从图像分类的正确标识符。\n\
  \n**注意：** 这只是一个帮助你学习机器学习基础与深度学习网络运行差异的示例。然而，深度学习和机器学习并不同时适用于大多数情况（包括这个例子）。原因将在稍后解释。因此，在这个例子中，你看到机器学习算法需要结构化数据来学习狗猫图像的区别、理解分类并生成输出。相反，深度学习网络能够使用网络层内部处理的数据对两种动物的图像进行分组。它不需要标记数据，因为它取决于每层处理的不同输出，这些输出汇聚在一起创建一个统一的图像分类方法。\n\
  \n### 要点\n\n1. 深度学习与机器学习之间的主要区别在于数据呈现系统。机器学习算法几乎总是需要结构化数据，而深度学习网络依赖于 `ANN` 的层。\n\
  2. 机器学习算法的设计旨在依靠标记数据来学会做事，然后使用额外数据集生成其他输出。然而，当实际输出不是预期结果时，需要防止受到人为干预。\n3. 深度学习网络不需要人工干预，因为神经网络中的嵌套层通过分离概念的分级对数据进行处理，最终通过错误进行学习。\n\
  4. 数据是资源。数据的质量决定了结果的质量。\n\n### 示例中未看到但仍需强调的\n\n1. 因为机器学习算法需要结构化数据，所以它们不是解决涉及大量数据的复杂任务的最佳选择。\n\
  2. 虽然这个例子揭示了深度学习网络解决微小任务的应用，但深度神经网络的实际应用是在更大规模上的。事实上，根据这些网络处理的层级和概念数量，它们只适用于更大规模。\n\
  3. 人工智能这两个分支都需要数据来生成任何形式的“智能”。但需要理解的是，深度学习所需的数据比机器学习多得多。原因在于，只有在接触数百万个数据点时，它才能突出神经网络层内部的差异。另一方面，机器学习算法可以通过预定义的标准进行学习。\n\
  \n因此，通过上述示例以及对深度学习和机器学习的各种解释，你现在能够区分深度学习和机器学习了。以下是深度学习在不同行业中的九种应用。\n\n#### 1. 计算机视觉\n\
  高端玩家经常使用深度学习模块。深度神经网络驱动前沿的目标检测、图像分割和图像修复。程度如此，它们甚至驱动了计算机系统上手写数字的检测。深度学习运行在强大的神经网络上，以支持机器重复人类视觉机构的机制。\n\
  \n#### 2. 基于情感的新闻聚合\n新闻聚合器使用深度学习模块消除负面新闻，只显示正在发生的积极事物。\n\n#### 3. 自动翻译\n在深度学习引入之前，自动翻译就已经存在。但深度学习允许机器执行更好的翻译，并保证了过去所缺失的准确性。此外，深度学习对于从图像中提取的翻译至关重要——这是使用传统的文本解释无法实现的。\n\
  \n#### 4. 客户体验\n大多数企业已经应用机器学习来工作提升客户体验。很好的例子包括在线自助服务网络。此外，许多公司现在依赖深度学习来构建可靠的工作流。我们许多人已经熟悉组织对聊天机器人的应用。\n\
  \n#### 5. 插画上色\n在过去，为黑白视频上色在媒体制作中需要大量时间。但深度学习模型和人工智能为黑白照片视频引入了色彩，使过程变得简单。当你阅读时，数百张黑白插画正在以彩色风格重新创作。\n\
  \n#### 6. 自动驾驶汽车\n\n\n\n\n\n当你下次幸运地看到自动驾驶汽车在路上行驶时，请知道有不同的 AI 模型在同时工作。虽然某些模型侧长识别行人，但另一些模型对交通标志非常熟悉。一辆汽车在道路上行驶时可以由数百万个\
  \ AI 模型进行训练。许多人认为 AI 驱动的汽车比人类驾驶更安全。\n\n## 7. 语言选择\n\n这旨在确定深度学习是否能够区分方言。例如，机器学习将判断一个人是否在说英语。然后它将根据方言确定差异。一旦选定方言，后续处理将由一个专注于特定语言的独立\
  \ AI 来完成。不要忘记，在这些步骤的任何环节中都没有人类的干预。\n\n## 8. 文本生成\n\n计算机现在可以从零开始生成新文本。它们可以学习文本的风格并突出有用的新闻片段。专注于文本生成的\
  \ AI 已经完全能够处理与你我相关的事务评论性文章的复杂性。目前，文本生成已经使得生成从学术主题到儿童谣的各种条目成为可能。\n\n## 9. 图像分析与说明生成\n\
  \n深度学习的优点之一是能够检测图像并生成智能说明。此外，AI 生成的图像说明非常准确，大多数在线出版物已准备好利用这些技术来节省成本和时间。\n\n\n\n\n\
  \n# 第 8 章：企业如何实现 AI 和 ML 项目运营\n\n凭借 `ML` 这种能够产生巨大变革的强大技术，很难忽视那些夸张的说法。确实，有数十亿美元的投资正投入到\
  \ `ML` 项目中。机器学习是数字化转型方法的基础。而且可以确定，当人们提到人工智能（AI）这一通用术语时，指的正是机器学习。因此，花时间回顾全球不同公司正在开发和使用的真实\
  \ `ML` 能力是至关重要的。\n\n通常，`AI` 的能力允许计算机检查海量数据集，以就所处理的主题得出“推理性”结论，从而激活人类的决策程序，并始终生成更好的决策。尽管定义\
  \ `AI` 和 `ML` 很简单，但问题在于 `AI` 的日常应用。一个已取得成功的领域是流媒体的内容匹配和建议，它从根本上改变了按点播的观众体验。机器学习不再是试图限制对内容进行分类、策划和细分以可消费形式所需的“专家级”人类工作，而是变成了个性化内容传递的关键工具。通过审查用户行为和偏好，大多数流媒体服务都能准确地进行个性化推荐，并推送具有更高变现和互动能力的目标内容。\n\
  \n总而言，每个行业都应该考虑将 `AI` 应用到他们的业务模型中。你不需要成为一家大公司才能使用 `AI` 为客户提供更好的服务。`AI` 可以帮助中小型企业更快地完成客户产品需求，通过应用“准时制”（`Just\
  \ in Time`）转型库存系统，限制运输和备货错误，并促进支付和催收流程。\n\n## AI 正在改变格局的业务领域\n\n### 生命科学与制药\n无论你在何处关于死亡对抗的争论中，我们都可以承认衰老是一项具有挑战性的经历。即使你不向往永生，你可能也意识到关节疼痛的增加以及对疾病和受伤的敏感会破坏人的生活质量。然而，深度学习可以减缓衰老过程。科学家现在使用技术来检测与衰老相关的生物标志物。很快，简单的血液测试就足以显示你身体出现磨损的部分，你的医生可以帮助你通过生活方式的改变和药物来消除并可能逆转这些影响。\n\
  \n### 食品\n杂货店约 40%的收入来自新鲜农产品的销售。因此，假设维持产品质量至关重要简直是轻描淡写。但说起来容易做起来难。杂货店受限于其供应链和消费者不确定性的影响。保持货架充足和产品新鲜可以是一项危险的平衡行动。然而，种植者已经发现，机器学习是更智能的新鲜食品的解决方案。他们可以向\
  \ `ML` 程序提供历史数据集，并录入有关促销和商店营业时间的数据，然后应用分析来衡量每种产品应该订购和陈列多少。`ML` 系统还可以收集有关公共节假日、天气预报和其他上下文信息的信息。然后，它们会在\
  \ 24 小时后发布一份建议订单，让杂货店在正确的数量上备有正确的产品。在工作流中应用机器学习的企业，其缺货率降低了高达 80%，毛利率增长了 9%。\n\n\
  ### 媒体与娱乐\n得益于机器学习，媒体公司现在可以使其内容触手可及。`ML` 让美国聋人人士和听力受损的人士能够通过自动字幕程序观看并享受 `YouTube`\
  \ 视频成为可能。\n\n### 信息技术\n尽管机器学习产生了多项业务洞察，但许多组织未能利用 `AI` 技术。但据预测，到 2020 年，将会有约 27 万个数据科学工作岗位。\n\
  \n### 法律\n深度学习程序在法律行业至关重要。法律用语可能很难理解，但深度学习程序可以分析超过万份文档。曾几何时，负责审查影响客户业务的合同条款的法律专业人员必须手动审阅成堆的文档。现在可以将它们输入到运行速度更快的程序中。\n\
  \n### 保险\n最小化风险和承保是每个人的目标，这就是为什么 `ML` 是保险业的卓越工具。机器学习算法可以使用客户数据和实时数据来确定风险水平。此外，算法可以根据信息定制费率，可能为保险公司和消费者创造节省。这一过程可以通过\
  \ `ML` 收集社交网络数据进行转型。保险行业可以引入人工智能定义对生活这些部分负责的人，且他们通常健康。\n\n### 教育\n智能辅导系统（`ITS`）在帮助学生学习方面具有巨大能力。这些\
  \ `AI` 程序作为虚拟导师，根据每个孩子的情况调整数字课程。每当学生完成测验时，`ML` 程序就会分析这些信息以个性化材料。通过“学习”用户的独特需求并选择对他们最有效的课程类型，`ITS`\
  \ 确保学生克服学习问题并掌握大量知识。研究表明，使用智能辅导系统的学生在考试中的表现优于通过小组教学学习的同伴。\n\n\n\n\n\n# 第 9 章：企业开发\
  \ AI 和 ML 项目的逐步方法\n\n技术领域正深陷于 `AI`。许多不同的应用已经开发出来，从自动化客户服务到高阶数据科学；这项技术在各企业中声名在外。人工智能是技术领域的一个重要驱动力。`AI`\
  \ 是会议上讨论的热题，并揭示了包括制造业和零售在内的不同行业的可能性。新产品正在与虚拟助手连接，而 `Chatbots` 正在回答客户关于各方面的问题。与此同时，像\
  \ `Microsoft`、`Google` 和 `Salesforce` 等大型公司正在将 `AI` 作为智能层嵌入到它们的技术系统中。诚然，`AI` 正处于它的光时刻。但这并不是流行文化让我们所预期的那种\
  \ `AI`；它不是“天网”、”、有意识的机器人，甚至不是 `Tony Stark’s Jarvis` 助手。`AI` 的平台期正在表面下发生，让我们目前的技术变得智能，并开启了企业收集的所有数据的力量。这意味着\
  \ `machine learning`、`deep learning` 和 `natural learning` 的广泛发展。这些技术简化将算法整合到云平台的过程。对于企业而言，`AI`\
  \ 的实际用途可以根据你的组织需求以及从收集的数据中提取的业务智能洞察以不同的方式呈现。企业可以整合 `AI`，从获取数据到在客户关系管理中生成互动，再到监控和维护资产时实现物流效率的最大化。`ML`\
  \ 在 `AI` 的发展中发挥着巨大的作用。目前，`AI` 正由 `ML` 的近期变化驱动。目前没有单一的成功可以供你，但我们现在从 `ML` 中挖掘出的业务价值是超出图表的。从企业的角度来看，现在发生的事情可能会影响一些围绕控制、协调以及资源调度和报告的重要业务流程。本节将描述专家关于采取哪些行动的建议，以便将\
  \ `AI` 纳入组织并确保实施的成功。\n\n## 1. 熟悉 AI\n\n花时间了解现代 `AI` 能提供什么。你可以通过与 `University of\
  \ Stanford` 等组织的合作，使用 `TechCode Accelerator` 丰富的资源。尽管如此，你也可以转向在线资源学习更多关于 `AI` 的知识。`audacity`\
  \ 和 `code academy` 等平台提供了远程课程。这些可以开启你的旅程。你可以用来开始的更多在线资源包括：\n\n*   `Microsoft` 的开源\
  \ `Cognitive Toolkit`\n*   `Stanford University` 的在线讲座。\n*   `Google` 开源软件库。\n*\
  \   人工智能开发的链接。\n\n## 2. 选择你需要的 AI 解决的问题\n\n一旦你熟悉了基础知识，下一步就是开始探索独特的想法。思考你如何将 `AI`\
  \ 能力加入到你目前的产品和服务中。最重要的一点是，你的公司心中应该有具体的 `AI` 应用案例，以解决业务挑战。在与公司合作时，首先对其主要技术计划和挑战进行简要描述是重要的。你想要展示\
  \ `natural language processing`、`ML` 和 `image recognition` 如何适用于这些产品。具体细节取决于行业类型。例如，如果该公司进行视频监控，那么它可以通过在该这一过程中加入\
  \ `ML` 来留住大量价值。\n\n## 3. 优先考虑重要价值\n\n在这一步中，你分析了所选的不同 `AI` 应用的业务财务成本。为了很好地排序，你必须审查可行性的维度。它应该为你提供一个机会，为业务确定优先级并建立价值。这一步还需要高层执行官的所有权和认可。\n\
  \n## 4. 接受内部能力差距\n\n你想要实现的目标与公司在特定时间范围内可以实现的目标之间存在差异。这就是为什么企业在投入 `AI` 之前，从技术角度意识到局限性至关重要。有时，这可能需要更多时间；然而，通过关注你的潜力，意味着你知道想要实现什么。根据可用的业务，许多项目或团队可以帮助你做到。\n\
  \n## 5. 寻找专业人士并准备试点项目\n\n一旦你的业务准备就绪，接下来你需要考虑整合 `AI`。这一步的诀窍在于从小开始，设定项目目标，并记住你了解和不了解的什么。这是邀请外部专家的完美时机。对于第一个项目，不要设定太长时间，即使\
  \ 2-3 个月也足够了。试点项目结束后，你应该确定长期项目是什么，以及对于你的业务和专业人才来说这是否有必要。\n\n## 6. 建立一个整合数据的团队\n\n\
  在将 `ML` 应用到你的业务之前，你需要做的工作是清理可用数据。企业数据位于不同的数据孤中，并可能处于不同目标的业务小组手中。因此，确保获得有用数据的正确步骤是建立一个团队来清理数据并消除可能存在的不一致之处。\n\
  \n## 7. 小规模实施\n\n在涉及到实施阶段，你将分小块进行，而不是大而全。进行小规模实施，并尝试读取反馈。从反馈中，你可以改进。\n\n## 8. 在你的\
  \ AI 程序中拥有存储\n\n一旦你从小规模扩大，你将需要考虑 `AI` 解决方案的存储需求。增强算法是获得巨大成果的关键步骤。然而，如果没有大量数据来协助开发准确的模型，`AI`\
  \ 技术将无法确保满足你的计算需求。此外，你需要为数据工作流和建模改进存储。\n\n## 9. 将 AI 作为日常计划的一部分\n\n`AI` 提供了额外的自动化和洞察，对于员工来说，这是一个极好的工具，可以让\
  \ `AI` 成为他们日常生活的一部分而不是取代他们。企业组织应对技术如何运作以解决问题保持开放。这将为员工提供独特的体验，让他们能够直观看到 `AI` 如何优化他们的角色。\n\
  \n## 10. 结合一些平衡\n\n\n\n\n在创建一个 AI 系统时，它要求你满足技术和研究项目的需求。在开始设计 AI 系统之前，你需要考虑的首要因素是在系统内部建立平衡。这看起来可能是显而易见的，但在大多数情况下，AI\
  \ 技术是围绕团队考虑实现其研究目标的特定功能而构建的，而没有掌握增强研究的硬件和软件的需求及局限性。为了让公司实现这种平衡，应该确保拥有足够的存储、网络和图形处理带宽。或者，你需要在使用总预算来完成研究的方式与通过冗余防止断电及其他手段的愿望之间取得平衡。\n\
  \n# 如何开发一家 AI 初创公司？\n\n现在，AI 是一个大话题。每个人都有自己的见解，这可能很难避免炒作，并深入探讨实际且接地气的问题。在本节中，你将从基础层面了解什么是\
  \ AI，而不会被海量的知识所困扰。接下来，你将学习在启动 AI 业务时需要遵循的四个通用步骤。同样重要的是，围绕 AI 的热潮可能会让你觉得如果不使用 AI，就会被时代淘汰。但在许多形式上，AI\
  \ 仍然处于婴儿阶段，何时对你来说是时机，何时又是过度复杂化问题，这并不总是明确的。这并不意味着在你准备成立新公司时应该避免使用 AI。许多严重问题需要解决，而现在的\
  \ AI 技术可以提供帮助。\n\n## 概念层面的 AI\n\n如果你不知道如何感知 AI，这是可以被原谅的。它可以是一个在你家里走走的机器人，还是你智能手机里的一个\
  \ App？也许是整部手机。关于 AI 的大部分记录让你很难不知道什么是 AI。此外，还有关于 AI 与 ML（机器学习）的争论。在本节中，我们将简述这些差异，关注更广泛的话题，以及它们如何应用于创业者面临的问题。\n\
  \n简单来说，AI 是一种软件程序，像许多其他软件一样，它可以接受输入并将其输出。与许多其他软件类型唯一的显著区别在于，程序没有给它如何执行转换的逐步指令，它甚至可能不知道这些步骤是什么。就像任何其他软件一样，AI\
  \ 可以以不同的方式封装；它可以被整合到 App、语音管理设备或网站中。为了保持简单，当我们谈论 AI 时，我们指的是接受输入并生成输出的软件部分。关键的一点是，在难以写出从输入到输出的显式指令的瞬间，它可以迅速从输入切换到输出。这些是人类传统上擅长而计算机在历史上不擅长的任务（至少从单项而言）。但在大多数情况下，人类在各方面都是糟糕的。常见的例子包括识别照片、从句子中提取情感，以及通过搜索字幕但偏离预期数据较大的值来扫描医疗检测结果。\n\
  \n## 分类 AI\n\n你可以将 AI 分为两类：一种以许多不同形式执行常见任务（如将口语转换为文字），另一种是处理各种变化的任务（如选择一组心跳数据是否反映了心脏问题）。这种区别至关重要，因为常见的挑战已经得到解决，你可以使用现有的\
  \ AI 而不是自己构建。\n\n### 现有的 AI\n\n有几个 AI 擅长评估的问题。例如，照片中的人脸检测，甚至是语音识别。由于这些是常见问题，大部分工作已经投入到开发解决这些问题的\
  \ AI 中了。这意味着你不需要完成这些 AI 中最困难的部分；你可以从别人已经完成的工作中获益。大型云提供了针对不同任务的各种开发 AI 产品，你可以按照“按需付费”模式进行应用。或者，由于这些服务是基于\
  \ AI 的，你是否使用它们并不重要。你只需要关心它是否能为你提供正确的答案。在你进一步开发自己的 AI 之前，确定是否已经有一个开发好并以你可以使用的方式封装好的\
  \ AI。\n\n### 定制或定制 AI\n\n下一类 AI 是定制构建的。这是最有趣的部分。如果你尝试完成一项不够常见、以至于现有解决方案无法提供的任务，你就需要构建自己的。在抽象层面，这是简单的，但像其他事情一样，深入细节会变得困难。\n\
  \n## AI 细节简要介绍\n\n有几种技术方法，但关注度最高的是神经网络。神经网络指的是连接在一起的模拟神经元的完整集合。信号传输给第一组神经元，这些神经元可能向其他神经元发送信号，此类此类。在网络的另一端，产生输出信号。例如，输出信号可能包含一个列表，列出照片中脸的位置。\n\
  \n创建神经网络有两种方法：构建网络和训练它。要构建网络，你必须选择神经元的数量以及它们之间连接的类型。一旦开发了神经网络，你就对其进行训练。训练一个系统意味着使用数学函数配置每个节点，以通知它何时传输收到的信号，何时不传输。幸运的是，你不能通过手动完成这一点；这极其不实际。要训练神经网络，你使用训练框架为你的系统提供大量的训练数据。训练框架为每个神经元构建数学函数。神经元的大小、连接以及这些函数的整合被称为模型。一旦你有了一个模型，就有几种容器可以加载它，并且存在标准允许将你的模型加载到基于\
  \ Web 的平台中。\n\n\n\n\n# 第 10 章：大数据与机器学习之间的关系\n\n自 2010 年以来，“`Big Data`”已成为一个通用术语，指代人们通过手机、社交媒体、网络浏览记录和购买倾向产生的所有数据，以及组织拥有的关于他们的任何其他信息。为什么大数据与其他任何形式的数据有不同之处？从某方面来说，它们没有区别；归根结底它们只是\
  \ 0 和 1。但“大数据”一词指的是一种海量的不同数据集合，这些数据是波动的，个人很难使用传统的计算机硬件和软件对其进行分类。\n\n事实上，大数据通常包含了特定类型的数据，这些数据直到最近才被广泛应用于客户分析。特别是，大数据涉及：\n\
  \n*   **文本**：人们说的话和写的内容可以被处理，以确定他们在讨论的话题。如果一个产品被正面或负面讨论，这可能指示某人是否会购买该产品。\n*   **图像**：这涉及视频、照片和医学影像。机器学习的一种用途是应用扫描图和\
  \ X 光片中的特征，计算某人患特定疾病的概率。\n*   **社交网络数据**：这包含关于人际关系以及他们认识谁的数据。网络数据包括人们拥有的连接数量和类型，以及有关连接个体的数据。如果你小组中的所有成员都是科幻迷，这很可能是你也是其中之一的极佳指标。\n\
  *   **生物识别**：从智能手表等设备收集的与血压、心率等相关的数据。\n*   **产生的产品**：从咖啡机到电视机的日常设备正在被开发，以便在它们之间以及通过互联网共享信息。如今，你的洗衣机、热水壶等可以通过智能手机进行控制。`IoT`\
  \ 概念正在不断发展，但它最终将呈现大量数据，可以用于机器学习来参考人们的行为。\n\n回到 20 世纪 90 代，还没有智能设备。很少有人拥有手机，互联网仍然处于发展阶段。关于人们的电子数据很少。超市并不知道每个客户每周购买了什么，保险公司不知道人们是如何驾驶的，而医疗服务机构将患者记录存储在纸质文件中。在这些年里，数据科学的生活非常简单，因为所有的电子数据都存储在行和列的整洁格式中。数据也相对静态。\n\
  \n在当今的大数据世界中，数据不断以更频繁的实时性更新。此外，大部分数据是“自由形式”的非结构化数据，如语音、推文、博客、电子邮件等。另一个因素是，这些数据大部分是由想要使用它的组织独立产生的，然后他们就可以控制信息的格式化，并实施检查和控制以确保数据的准确性和完整性。\n\
  \n然而，如果数据来自外部来源，就无法保证信息是正确的。外部来源的数据总是“杂乱无章”的。这需要大量的工作来对其进行增强并转换为可用的格式。此外，对数据的稳定性和持续可用性存在许多担忧，这对于一个具有重大决策潜力的组织来说，会产生业务风险。这意味着组织用于处理销售交易、管理客户账户记录、账单和债务催收等事的传统计算机架构，并不是存储和分析所有新数据的最佳选择。\n\
  \n值得注意的是，现代大数据系统非常擅长：\n*   **维护大型数据集**：传统数据库在合理成本内能持有的数据大小有限的。\n*   **数据清洗和格式化**：不同的数据在应用之前需要转换为一种标准手段。\n\
  *   **快速处理**：大数据不仅仅关乎更多数据的存在。它必须被快速处理和分析。传统系统的问题在于，实际上它们太慢、太笨重且太昂贵。\n\n新的数据处理技术如\
  \ `MapReduce/Hadoop` 让原本需要几周甚至几个月处理的任务在几小时内完成。`Hadoop` 实现这一目标的方法是让数据和处理分散到计算机网络中。理论上，成千上万台计算机连接可以产生与超级计算机比拟的计算能力。\n\
  \n无论数据是大小，它本身并没有任何内在价值。企业所犯的最大错误之一是假设只要他们投入大数据存储并收集他们获得的任何数据，就会增加价值。只有在对数据进行处理并从中产生有用结果时，价值才能实现。`ML`\
  \ 是数据分析和生成人类行为预测模型的主要工具。\n\n因此，机器学习和大数据经常被放在一起讨论，但它们之间并没有平衡的关系。你需要机器学习来充分利用大数据，但你不需要大数据也能有效使用机器学习。如果你只有几项信息，就足够开始构建预测模型并进行必要的预测了。\n\
  \n## 如何通过大数据赋予人工智能和机器学习\n\n在互联网时代，数据在全球范围内不断增长。这种海量信息通过“大数据分析”进行处理。除了大数据之外，带来改变的另外两种技术包括\
  \ `AI` 和 `ML`。如今，`AI` 和 `ML` 是通过以下方式支持计算机系统和其他连接设备的技术形式：\n\n*   通过递归实验\n*   通过持续更新数据库库\n\
  *   通过人工干预\n\n\n\n\n机器学习与人工智能是交织在一起的，受上述技术驱动的外围设备可以通过编程，使其能够利用算法和程序自主地学习新事物。机器可以通过大数据分析提取相关且重要的信息。例如，如果一个人拥有一家皮装公司，并想确定某个国家在特定季节的市场需求，那么他可以使用大数据分析来实现这一目标。通过大数据工具生成的报告，可以快速地检查和访问这些信息。\n\
  \n## 如何利用大数据扩展 AI 和 ML 劳动力\n\n由于 `AI` 的存在，人们认为在未来几年内，整个劳动力将在很大程度上受到限制，大多数任务将由基于\
  \ `AI` 的计算机完成。然而，大数据可以改变这一预测。对于大数据分析，通常需要并应用人类的智慧和情感，而机器并不具备这些人类的情感和情绪。\n\n为此，让我们考虑一家制药公司，它聘用了著名的数据专家来分析东南亚市场的数据。在这种情况下，专家可以快速分析该地区的药物处方以及当地的需求。在这里，以计算机为中心的大数据分析永远无法产生敏感且符合语背景的结果。换句话说，大数据、`ML`\
  \ 和 `AI` 的融合将只会为专家和优秀的数据科学家产生结果。这将允许他们在市场中成倍增长。此外，通过整合这三种技术，这种融合在未来将会增加。\n\n## 大数据如何从\
  \ AI 和 ML 服务提供中受益？\n\n目前，`AI` 和 `ML` 解决方案的国际市场尚不完善。当大数据结合 `AI` 和 `ML` 机器时，设备变得更加智能，执行复杂分析的潜力也随之增加。因此，复杂的\
  \ `AI` 解决方案将导致这些机器的市场和需求增加。在拉丁美洲，专注于大数据的学校长期实施 `AI` 解决方案。他们正在应用基于 `AI` 的学术解决方案，并支持许多教育机构将其引入其教育系统中。因此，由于这项技术进步，教育市场可能会经历巨大的增长。\n\
  \n## 大数据助力 AI 和 ML 的全球多元化\n\n随着大多数创新和优势技术的兴起，基于 `AI` 的解决方案和 `ML` 的价格大幅下降。结果是这些基于\
  \ `AI` 的技术可以被不同的宗教、文化、政治团体精神倾向使用。此外，基于 `AI` 和 `ML` 的系统需要根据当地的伦理进行训练。不同地区的大数据分析有助于根据特定地区的人口需求设计专注于\
  \ `AI` 和 `ML` 的解决方案，而不集中于他们的情感。这些解决方案将对客户获得成功并广为人知。\n\n## 大数据、AI 和 ML 可以贡献的业务领域\n\
  \n最初，我们提到大数据、`AI` 和 `ML` 可以改变业务流程。以下是可以使用这些技术进行增强的一些熟悉领域：\n\n*   改进社交媒体数据在业务推送中的应用\n\
  *   利用 `ML` 和 `AI` 支持增强业务预测模型的安全性\n*   通过聊天机器人分析增加在线销售额\n\n总的来说，`AI 大数据分析`和 `ML`\
  \ 可以转换业务数据，使其准确且直观。通过提取实时的业务洞察，决策者可以实施更具战略性的更好的决策。数量和速度是使大数据强大的主要因素。在这种情况下，我们可以说\
  \ `AI` 和大数据是互为补充的。企业可以通过大数据和 `AI` 的整合获取真实世界的洞察。但已经有许多活动和公司正从 `ML`、`AI` 和大数据的整合中获益。总结来说，`ML`、大数据和\
  \ `AI` 是全球业务的未来。如果你想帮助你的业务增长，请考虑使用这些技术。在 `AI` 和 `ML` 提供更智能、智慧设备的地方，大数据可能有助于做出更具洞察力的决策。\n\
  \n\n\n\n# 第 11 章：机器学习如何增强任何企业的竞争力\n\n尚未计划投资和创新的公司很快就会被由机器学习驱动的新型经济所掩盖。机器学习正在改变整个世界。作为人工智能（AI）的一个主要分支，它允许计算机在没有预先编程的情况下，利用数据和经验自主运行和学习，而不是显式编程。Netflix\
  \ 的推荐、YouTube 的推荐以及像 Alexa 和 Siri 等虚拟个人助手是一些最受欢迎的人工智能应用。这些功能不仅适用于电子商务和娱乐网站。机器学习现在适用于任何组织和任何规模，其流程涵盖了从常规到革命性的各种领域。在当今市场中保持竞争力，需要人工智能的实用知识和机器学习技能。\n\
  \n## 将数据过载转化为关键的矿藏\n\n如今，信息越多越好已成为常态。这对于业务而言尤其如此。你对自己的利基市场、产品、客户和市场掌握的信息越丰富，你的竞争优势就越高。到\
  \ 2017 年，全球 90% 的数据仅在过去两年内就生成了，生成速度每天达到 25 万亿字节。从手机、网络浏览器到设备上的传感器，一切都提供了无尽且呈指数级增长的信息流。这就是大数据。\n\
  \n然而，并非所有数据都有用。企业面临最大的障碍在于预测哪些数据是重要、准确且具有可操作性的。在帕特里克·霍尔的《分析演变》（The Evolution of\
  \ Analytics）中，他提到组织现在被迫对其数据进行高级搜索，以识别提高效率和竞争力的创新方法。问题是，分析、收集和利用所有这些数据已经超过了人类的极限，即使采用传统的数据分析也是如此。这意味着公司在处理、分析和实施数据量方面已接近临界点。福莱斯特研究估算，收集的约约\
  \ 60-73% 的数据由于战略原因从未被成功使用。\n\n将这些海量数据转化为适用于构建的答案，在于应用机器学习来自动化数据分析模型的开发。通常情况下，人类每周可以构建\
  \ 1-2 个模型，但机器学习每周可以生成数万个模型。机器学习不仅处理海量的原始数据集，而且渴望这些数据。你提供的数据越多，它就变得越智能。机器学习算法可以定义数据中的模式、聚类和关联，然后预测结果并建议行动。凭借机器学习的潜力以及人工智能的其他应用，你的业务以后可以让你的数据对业务和客户产生价值。\n\
  \n如果数据没有驱动你的组织，那么它必须被驱动。公司关于客户的大部分信息是自报数据。换句话说，这些数据是从新闻邮件订阅、下载、产品注册、客户服务反馈和调查的潜在表单中捕的。其余数据通过网站访问、搜索引擎数据和\
  \ Cookie 进行自动监控。尽管如此，匿名访问者数据可能非常重要。社交媒体是另一个数据源，特别是评论、互动和点击。如果你知道如何挖掘，与竞争对手相关的数据可能很有资源价值。\n\
  \n人类生成的大部分数据是以文本形式存在的的。因此，网络爬虫是挖掘客户想法信息的绝佳方式。这又为你提供了了领先于竞争对手的额外优势。由于大量人类生成的数据是文本，网络爬虫是获取客户想法信息、以获得竞争优势、维护品牌声誉以及评估社区对组织倡议的意识的重要过程。\n\
  \n交易数据是最最新、准确且使用最频繁的数据。有人预测，到 2020 年，通过互联网进行的业务交易每天将达到 4500 亿次。加上通过物联网（IoT）如健康监测器和电器自动生成的持续数据流。我们每年生成和复制的数据量将每年翻倍，并预计到\
  \ 2020 年将达到 44 艾字节。收集和维护这些数据的增长已超过了传统存储的潜力。但 `Hadoop` —— 一个开源 Java 应用程序拥有任何人都可以使用的免费模块。该应用程序主要为大规模数据集设计。它使得大规模数据的处理成为可能，是竞争优势的重要工具。那些能够成功挖掘历史数据的人可以在未来获得显著优势。\n\
  \n此外，云提供了以最低价格获得虚拟无限制存储的机会，Microsoft Azure、Google Cloud 和 Amazon Web Services 等云端领导者正在提供独特且更好的计算服务。那些将其\
  \ IT 架构推向云端的企业有更大的机会保持领先，并建立一个为市场领导地位奠定基础的系统。\n\n为了优化机器学习，多样化的数据存储在一个名为“数据湖”（data\
  \ lake）的仓库中。数据湖不同于传统的数据仓库，因为它以数据的原始、自然形式存储数据，无论是结构化的、非结构化的还是半结构化的。虽然这使得数据更容易识别，但其缺乏灵活性使其难以进行创新分析。结构化数据使你能够回答特定问题，但这种结构可能无法适应未来某个时刻出现的问题。数据湖的概念允许非结构化数据，并允许更灵活地响应新问题。执行这些分析并完全应对后续问题正是机器学习执行的准确工作，因此为实现竞争优势提供了原材料。\n\
  \n现在，你已经有了数据，下一步是什么？在准备好大量数据后，机器学习算法可以根据经验进行“训练”，然后暴露给新数据并释放以寻找模式，从它们发现的内容中学习，并自主创建预测模型。我们需要创建程序，不仅要分析海量数据以识别历史模式，还要足够智能，以适应新数据和即将到来的模式，并检查一组预测框架的影响。\n\
  \n今天大多数企业广泛采用的两种机器学习技术是监督学习和无监督学习。\n\n1.  涉及监督学习时，它依赖于带有标签的数据，如日期、名称和财务字符串。这些数据存储在关系型数据库中，在企业中很常见，但仅占所有数据的\
  \ 20%。结构化数据源于人类输入、网站或销售点设备。当特定输出已知，或者你有一个想要问的问题时（例如确定某些特定目标值的新数据点），监督学习算法非常重要。这对于推荐引擎、预测性维护和库存控制等功能至关重要。\n\
  \n\n\n\n\n## 2. 无监督学习\n\n无监督学习依赖于非结构化、没有历史标签且不便于存入数据库的数据。这类数据包括客户交易、文档文本、图形、社交媒体和其他内容。在许多组织中，约\
  \ 80-90% 的数据是非结构化的。通过无监督学习，算法必须生成自己的推理以识别其搜索的内容。它是通过寻找聚类和隐藏模式来实现的。这种学习对于市场细分、硬件故障诊断和欺诈检测非常重要。无监督学习的优势在于，它允许你识别出数据中未知的模式。\n\
  \n无论你应用监督学习、无监督机器学习还是两者的结合，企业都有五种方法可以利用算法来建立竞争优势。\n\n### 1. 自动化业务流程\n\n企业可以立即引入机器学习来自动化后台流程。这些流程大部分是高频的、基于规则的函数，可以按照“无人值守”计划运行，从而为员工释放时间，使其实现公司的战略目标。一些简单的功能消耗了人类员工执行的交易总量的\
  \ 80%。这增加了支持成本，但对客户和公司本身没有产生价值。大多数公司已经将多项琐碎的任务外包给计算机。通过跟踪现有流程并学习识别不同的实例，AI 增加了可以自动匹配的发票数量。这允许组织限制委派给服务中心的工作量，并让财务人员专注于战略任务。\n\
  \n**无人值守 IT**：在塔塔咨询服务公司于 2017 年进行的一项调查中，在受调查的 835 家公司中，IT 是 AI 最大的采用者。AI 不仅用于监控数据中心黑客的活动，IT\
  \ 还利用 AI 为员工的技术支持挑战提供解决方案，自动化部署新系统的任务，并确保员工使用来自认证供应商的技术。调查的公司中约有 34%-44% 正在其 IT\
  \ 部门实施 AI。\n\n**松手化的人力资源**：人力资源和技能获取是 AI 可以产生巨大影响的领域，能够限制工作量、提高效率并防止偏见。机器人加上机器学习的其他应用可以处理重复性的\
  \ HR 任务，例如：\n\n*   安排面试、评审和其他小组。\n*   从数百份简历中筛选出职位申请人。\n*   衡量和维护员工互动。\n*   回答有关公司政策、办公室程序和基础冲突解决的问题。\n\
  *   优化办公室工作流。\n*   吸引并联系顶尖人才。\n\n良好应用的机器学习技术可以通过应用预测性分析来节省大量时间，限制招聘中的时间浪费，并使过程变得准确可靠。机器学习仍可用于增强人类生产力。例如，自动生成周报并跟踪数百条新闻项目、社交媒体提及和其他信息源。这些工具可以监控数据并预测结果，并帮助企业团队优先考虑产品开发和营销工作。\n\
  \n**亲历式分析**：机器学习可以从人类手段永远无法访问的全新且海量的数据源中提取数据。机器学习的其他高级用途可以通过构建新产品和改变现有产品的可靠性，使公司更具竞争力。家具开发家具家具公司宜家（IKEA）依赖机器学习算法审查社交媒体，并寻找数据以创建解决网络上提出的问题的新产品。机器学习也非常擅长分析来自历史传感器、设备故障数据、物流和机械的海量数据。模型的预测随后可能建议预防性维护、消除运输，甚至实时检测出显示故障即将发生的问题。许多企业尚未发现机器学习的全部潜力。其优势远比更快的供应链和提高的生产力水平。\n\
  \n### 2. 营销\n\n甚至在数字时代到来之前，营销专业人士也是新兴技术的渴望者和早期采用者。机器学习和 AI 是数字营销人员的一些流行工具。随着数据增长、新模型的开发以及营销人员建立新策略以获得竞争优势，这种演变将在未来几年内发生并增长。AI\
  \ 为这种古老的广告技术——即在正确的时间向正确的人寻找最完美的信息——提供了正确的答案。机器学习可以限制大多数不精确的营销本质。通过应用行为数据，营销人员可以用有效的方法关注其受众，极大地提高将购物者转化为客户的概率。以下是公司在机器学习中应用以改进其线下营销广告的一些方法。\n\
  \n*   客户流失风险模型\n*   需求预测和销售预测。\n*   针对性的交叉销售和捆绑。\n*   动态和个性化的产品排名\n*   增强现实\n* \
  \  优化线索获取\n*   微细分\n*   优化信息信息投放\n*   应用网络数据的客户资格认定\n*   文本生成视频创作。\n\n\n\n\n机器学习和其他其他重要技术为以更智能的方式投入市场预算创造了新方法。这些技术使得实时检查海量数据成为可能。对于如今的任何在线业务而言，控制大数据并获取可操作的洞察力是最关键的基础要素之一。\n\
  \n### 更智能的细分\n从直邮时代开始，更智能的细分、列表细分和个性化一直是关键的驱动力。大多数“谷歌原住民”进入职场时，面对的是按点击付费的模式，而 AI\
  \ 营销工具已无处不在，甚至变得像司常惯一样。这使得与竞争对手区分开来变得困难。它要求对这些技能具备专家知识，并对新的机器学习产品和创意方法保持敏锐的洞察。\n\
  \n机器学习重要的方面之一是客户旅程。算法可以告诉高价值客户与低价值客户之间的区别，从而让你知道应该在哪里集中销售精力。机器学习仍然能够识别出具有惊人共同特征的优质客户群体。你的公司可能希望审查一组在每年同一时间购买的客户，并确定影响其购买行为的因素。通过掌握某类特定的客户，你可以决定通过个性化的优惠和促销活动，向客户群体推荐哪些产品。\n\
  \n### 线索获取与评分\n对于新线索，传统的获取方法需要购买列表，或花费数小时在公司网站上寻找并爬取合同信息。机器不仅可以协助线索生成的原始数据收集，AI\
  \ 还可以分析电话、电子邮件和社交帖子等非结构化数据，以识别模式并确定谁是合适的潜在客户。\n\n正确的营销需要对客户和潜在客户有深入理解。你对他们的了解越透彻，就能越精确地关注他们身上。机器学习不仅自动化了从熟悉的数据库和来源中收集此类智能信息，算法还会进入外部世界进行分析、收集、预测和学习。此类\
  \ AI 应用已经作为第三方供应商的产品出现；数字营销专家并不需要成为数据科学家。但对于营销人员和高管来说，在对高价值资源进行大规模投资之前，理解机器学习的关键方面对于掌握其潜力并制定策略是有益的。此外，对于营销人员来说，学习人类擅长的领域以及哪些事情最好交给计算机处理，也是重要的。\n\
  \n### 按点击付费的成本节省\n如果说有一个领域机器表现得出色，那就是竞价。竞价需要选择一种人类定义的策略，并根据预计广告支出回报率或获取成本来更改出价。手动进行此操作或支付给第三方供应商执行可能是昂贵的。由于竞价依赖于模式识别和统计学，这是机器学习最好的应用之一。机器可以根据之前的行为和关键词统计数据轻松预测用户可能如何使用广告。\n\
  \n### 动态定价\nAI 营销的另一个绝佳应用在于支持在线定价的弹性。与人工定价模型不同，AI 驱动的动态定价可以根据购物时的一系列实时因素进行变化，包括竞争对手的定价、购物者的兴趣水平以及通过之前的营销进行的过互动。这需要大量数据，以了解不同客户在不同情况下对优质服务变化愿意支付的费用。但如网约车和航空公司等公司已成功开发了动态价格优化方法来提高收入。\n\
  \n无论如何部署在你的营销技术栈中，机器学习都消除了浪费——包括浪费的预算、浪费的人力等。机器学习可以让你用更少的资金进行更多的营销。寻找 AI 可能帮助你的机会，以便在保持现有人数不变的情况下生成更多产品。这仅仅是机器学习在营销中发挥作用的正态分布曲线的开始。\n\
  \n## 3. 转型客户体验\n\n\n\n\n\n机器学习帮助任何企业获得竞争优势的一种方式，是通过能够分析和增强整体客户体验的应用来实现。在连接型经济中，客户期望高度个性化和实时的互动。如今，几乎每家公司都试图通过增强客户的数字体验，并挖掘数据和洞察来使这些体验变得重要且有价值，从而保持竞争力。\n\
  \n## 流失建模\n机器学习有多种方法可以为您的客户带来差异化。首先是帮助您理解他们。流失建模不仅对营销有益，对客户支持和产品增强同样有效。机器学习允许以人类无法想象的速度进行大数据分析。算法可以应用于确定诸如客户购买行为、营销历史和网站等因素。接下来，它们可以确定风险模型，通过基于预防性措施的模拟进行比较，以找出这些干预如何影响流失概率。来自流失建模的风险分析可以为实时客户支持团队提供最佳的问题解决路径。\n\
  \n## 客户支持\n`Chatbots Magazine` 上的一项 2017 年的研究强调，约 55% 的英国消费者表示，在涉及客户体验时，最关键的因素是对于问题得到及时且有效的回复。公司需要生成更快的客户服务回复，以及所有与客户旅程、之前的互动和其他问题相关的数据。机器学习使这一切成为现实。得益于低成本语音分析工具和录音，跟踪客户服务之间的互动也可以为呼叫中心提供洞察。语音分析将不仅是通过提示引导呼叫者，还将根据你所说的内容和说话的方式协助对他们进行分类并审查回复。\n\
  \n## 聊天机器人\n通过 AI 驱动的 `Chatbots` 实现自动化客户支持已经获得了认可和普及。由于 75% 的消费者年龄在 18 至 25 岁之间，智能数字代理是为客户提供快速网络聊天服务的解决方案。此外，由于数以千计基于\
  \ AI 的客户支持，消费者现在可以轻松地与 `Chatbots` 互动。消费者已经习惯通过语音命令、智能助手、智能设备和自动呼叫中心与技术进行交互。机器学习支持语音的\
  \ `Chatbots`，在相关的情况下改进客户服务查询。根据 2018 年麦肯锡全球研究所的一份报告，对音频的深度学习分析使得系统能够审查客户的情绪语气，万一客户对系统反应不好，通话可以自动重定向到人工经理和操作员。\n\
  \n## 社交媒体监控\n优化机器学习跟踪社交媒体的力量是公司保持竞争力的英明大举措。将社交媒体八卦与其他交易数据和客户人口统计学数据混合，可以增强产品营销，并能提升个性化产品推荐。根据麦肯锡的报告，专注于单个客户的“下一个购买产品”推荐可以使销售转化率提高一倍。社交媒体监控在确保高质量客户支持的存在方面仍然迈出了重要的一步。随着\
  \ `Facebook` 和 `Twitter` 等网站上全球讨论的发展，即使是大型企业也很难获得所有这些宝贵的反馈。机器学习结合语言算法改进了在几乎任何地方建立客户对你评价的过程。社交媒体监控是利用\
  \ AI 收集竞争优势的极佳方法。你可以监控对你公司的提及，同样的概念也可以应用于从竞争对手手中赢得市场份额。由于其他选择，客户忠诚度正在降低，尤其是当替代方案挖走某人时。\n\
  \n## 与机器合而为一\n使用机器学习采取“观望”的方法并不是一种选择，特别是对于竞争激烈行业的公司而言。但对于 B2C 来说，忽视拥有机器人的竞争对手并不是问题。所有公司都面临着技术曲线的挑战。早期证据表明，可以实现商业案例，并且对于准备好将其应用于运营和核心职能的公司，AI\
  \ 可以为其创造价值。此外，将强大的数字能力与积极的计划相结合的早期 AI 采用者获得了更高的利润率，并预计在未来几年内与其他公司之间的性能差距将扩大。\n\n\
  此外，AI 的冷启动挑战对许多公司（无论大小）来说都是一个巨大的挑战。技术的快速变化让许多公司对他们需要关注什么感到不知所措。大多数业务已经确信了机器学习的商业案例。根据\
  \ Louis Columbus 在 `Forbes` 上强调的一份 2017 年报告，84% 的高管报告称 AI 让他们能够走在竞争对手面前。\n\n如果您正处于将机器学习整合到您的竞争工具箱的策略阶段，您有几种选择。一些专家认为机器学习代表了分析演化的下一个阶段。与专业数据科学家咨询是重要的第一步，但对于某些公司来说这可能不是一个选项。大多数公司正在与大学建立联系，以识别数据和分析专业高级学位课程的应届毕业生。但在某种程度上，大多数组织必须利用他们已的人才。提升员工在\
  \ AI 和机器学习技术方面的水平是一个明智之举。对于 AI 领域的新公司，从内部开始是一个更安全的投资。一个常见的错误是在组织尚未整理数据基础设施和数据可访问性之前，聘用几位费用昂贵的机器学习专业人士。这通常是一个大问题，最终的结果是投资回报率低，导致糟糕的工程实现。`Gartner`\
  \ 发表的一份报告显示，到 2022 年，执行非例行任务的工作者中五分之一将依赖 AI 来完成工作。然而，这对工作者来说并不是坏消息。通常，我们意识到自动化相当简单的交易和工作流可能会让员工和客户在其他地方花费大量时间，从而最终产生大量价值。只关注自动化的组织将改变他们的优势。最成功的将集中在使他们脱颖而出、且无法被\
  \ AI 或 ML 复制的技能上。这些技能可以总结为一个词：人性。应用 ML 是否值得这些痛苦？专家说是的，因为 ML 提供了对您的组织、流程、产品、客户甚至竞争对手进行可视化的工具。即时获取按需洞察为企业提供了在竞争性环境中生存所需的边缘。\n\
  \n\n\n# 第 12 章：AI 的未来\n\n当机构和个人挣扎于控制大量信息和不断增加的设备时，仍有一些新技术可以应用，基于 AI 和物联网（IoT）做出高质量的决策。现在是周二上午\
  \ 10 点左右，营销专家 Jane 正在与同事一起为一个新的业务推介准备一份演示文稿。客户是一家大型公司，获得这个账户的压力很大。通过与其他地区的团队建立联系，Jane\
  \ 接收到的通过短信、电子邮件、WhatsApp 和即时消息以及电话传的数据。与此同时，她正在网上为她的项目寻找重要的事实和数据。\n\n预计全球人口在 2020\
  \ 年将达到 76 亿，而物联网连接设备的数量预计在同一年将增加到 200 亿到 300 亿之间。Jane 和其他数以亿计的其他人该如何控制这些信息源，确定哪些是重要的，并做出正确的决策？计算一下这些不断增长的人和设备数量，你将看到数据的指数级增长和无处不在的信息，这已经导致了“信息过载（infoxication）”。\n\
  \n人工智能似乎通过建立一套技术来协助控制信息、寻找可靠的数据源、接受明智决策并利用改进的认知来解决这个问题。\n\n## 工作场所枢纽（Workplace hub）\n\
  \n工作场所枢纽专注于办公室，特别是未来的工作场所。它通过单一的中心化平台整合组织的所有技术，并通过减少 IT 管理和提供提供的总体成本来提高效率。它提供了实时的、数据驱动的洞察，改变了业务流程。通过实施\
  \ AI 和物联网系统，工作场所枢纽将在未来五年发生变化，变成公司所谓的“认知枢纽（cognitive hub）”。\n\n这项新技术将使用智能边缘计算进行 AI，并增强人类智能，以扩展人类接口网络并改进团队与个人之间的协作。认知枢纽将成为公司数字领域信息流的绝佳平台，并根据每个人都可以应用的服务类型提供增强智能。它还将连接未来的设备，如增强现实眼镜、柔性屏幕和智能墙。工作场所枢纽利用\
  \ AI 整合整个公司的智慧，通过收集和处理数据来让团队、个人和公司的生活变得简单，使他们能够高效工作。\n\n尽管一些人认为云计算将会衰减，但事实是它不会消失。相反，它将分化并转变为由复杂的三维树组成的类似皮质的结构。在这个现代时代，云计算是智能自动化、认知计算与其他\
  \ AI 相关的领域之间的胶水。认知枢纽仍有许多工作要完成，但工作场所枢纽已经通过允许我们控制设备、连接和信息的快速兴起，改变了我们的工作方式。\n\n## 2020\
  \ 年 AI 的未来\n\n谈到千禧一代和即将到来的一代，我们与前辈的区别在于发现，人类到为止发明并开发了几乎在虚拟世界中可以触及的一切。我们、前辈和未来一代之间的唯一共同点是改变我们沟通方式和看待事物的大脑。\n\
  \n人工智能已经被预测了多年，但它最初只与机器人有关。但现在，AI 已集成到我们使用的几乎所有被认为是智能的设备中。AI 是一种模拟人类或具有类人类行为的软件。它一直被预测、看到并见证为具有卓越的能力，能让我们坐在舒适的地方享受，同时完成某些任务，从而节省我们的时间，并以最少的精力和努力完成工作。\n\
  \n### 编程\n\n这带我们进入了一个新世界，在那里你可以完成以前从未想过能完成的不同事情。AI 连接了我们，并作为离散动作之间的过渡。换句话说，它允许你同时与多件事交互，例如瞬间从一种语言翻译成另一种语言。自从计算机引入以来，我们一直依赖一套规则来处理我们的动作，并允许我们从设置页面进行自定义。将相同的技术转化为\
  \ AI 需要这些这些规则，并训练计算机算法与动作连接起来。\n\n### 预测 2019\n\n人工智能为我们提供了可以处理的变量，并允许我们以程序化的方式处理所有变量，这更简单并提供了透明的置信度。它作为一种争议正在出现，但预测未来几年将发生的情况在科学统计领域是准确的。认知枢纽仍有许多工作要完成，但工作场所枢纽已经通过允许我们控制设备、连接和信息的快速兴起，改变了我们的工作方式。\n\
  \n\n\n\n\n- 企业应该通过识别有效的实施方案，为 AI 周围的偏见问题找到解决方案。\n- 政府必须确保 AI 带来的收益在受发展影响的人群和不受影响的人群之间实现共享。\n\
  \n## 教育与业务转型\n\n为了有效利用 AI，必须在教育层面解决相关问题。教育体系可以专注于赋能学生处理与 AI 相关的任务。这要求对 STEM 学科给予很大关注。此外，还应该鼓励那些提高创造力和情感能力的学科。虽然人工智能的生产力将超过人类，但在需要想象力和建立关系的工作中，人类将比计算机表现得更好。人工智能将改变职场内外的世界。企业与其集中于对自动化的恐惧，不如拥抱技术，以确保他们实施最有效的\
  \ AI 系统，来改进并补充人类的智能。\n\n## 确保机器不会接管\n\n当斯蒂芬·霍金警告某项技术的可能性时，思考它是有意义的。斯蒂芬·霍金在 2014\
  \ 年表示，AI 可能会导致人类物种的终结。这有很多可能的益处，因为文明提供的一切都是人类智慧的产物。很难预测当这种智慧通过 AI 可能提供的工具反映出来时，我们可能获得什么，但消除疾病和贫困是不容怀疑的。人类在机器手中的潜在死亡是一段漫长的旅程。\n\
  \n在 `PWC` 2017 年 3 月的一份经济报告中，预测到 2030 年，英国近 30% 的工作可能被机器接管。存储、制造、运输和零售行业的工人面临风险。尽管有\
  \ `PWC` 这份令人胆寒的报告，但一些人持有不同观点。例如，埃森哲预测 AI 技术将为英国经济额外 8140 亿美元。关于 AI 有很多恐惧的故事，几项研究重点关注工作流流效应。然而，一些人认为这种观点过于简单。传统的经济增长和劳动力推动者已不再能增加\
  \ GDP，但 AI 提供了希望。\n\n这种观点是，AI 达到可以成为一种新型虚拟劳动的程度，可以有效地成为新的生产浪潮，改变增长的整体格局。AI 将同时支持智能自动化和增强。智能自动化与我们早时候看到的自动化不同。它涉及应用数据来提供服务并智能地执行任务。增强效应的影响仍然很大，即通过利用我们已经在做的事情，让我们能够高效地完成它们。\n\
  \n唤醒商业界 AI 的计算机计算成本的增加以及云可用性的提高。基于云的平台依赖 AI 实时实时分析数据网络形状，已被全球各地的公司和政府采用。你可以存储发现的每一比特数据，并将数据与这些算法相结合，创造出以前不存在的机遇。\n\
  \n如果你需要一位专攻数学的教授来帮助解释 AI 和 `ML` 算法，那么你就无法说服你的高级高管继续进行。`Ayasdi` 通过开发依赖底层技术的应用程序实现了这一点，但专注于特定的业务挑战，例如帮助医院从数据中确定医疗保健的最佳实践，以便他们以更低的价格提供最高质量的护理。AI\
  \ 供应商已经在帮助公司和组织变得更聪明、更高效。AI 技术具有巨大的经济潜力，但你如何开发人才和基础设施以便我们获得经济利益呢？未来几年工作可能会有所不同——你可能会与机器人一起工作，或者教它们。你现在如何教育人们，使他们能够应对这些？\n\
  \n## 关于 AI 未来的注意事项\n\n1. AI 的增长比你想象的要快，并且正在呈指数级扩张。\n2. 你每天都在使用人工智能\n`Google Now`、`Cortana`\
  \ 和 `Siri` 是 AI 的一些常见例子，但 AI 确实就在我们身边。它可以在汽车、视频游戏、吸尘器和割草机中找到。电子商务软件、国际金融市场和医学研究是许多例子之一。\n\
  3. 机器人将接管你的部分工作\n你可能在工作中表现良好，但你执行的任务可能已经可以自动化，或者很快就会实现自动化。多久？根据 `Rice University`\
  \ 的 `Moshe Vardi` 教授的话，在未来 30 年内，大多数工作将由机器人完成。这看起来很糟糕，但该领域的许多研究人员认为，技术性失业将为未来开启大门，在那里工作是人们出于快乐的事，而不是出于需要。\n\
  4. 许多聪明人士认为构建人类水平的 AI 是一件危险的事。\n一旦机器变得像人类一样，就会发生很多令人担心的事情。AI 开发在此停止的概率极小。\n5. 如果\
  \ AI 比我们更聪明，那么我们几乎没有机会学习它。\n我们永远无法理解超级智能设备能做的事情，即使它尝试向我们描述。它可能会尝试多年来训练我们它知道的最简单的事情，但那些行动是徒劳的。\n\
  6. 超智能 AI 运作的三种方法\n7. AI 可能是我们从未见过外星人的原因\n\n## 智能的未来\n\n现代计算技术的高功率加上类人机器人的兴起，将让你理解智能机器接管我们的工作并不遥。然而，现实是，AI\
  \ 程序在某些任务上比人类更合适，例如玩视频游戏和模式识别。它们仍然远未实现人类所拥有的通用智能。人类大脑花费了多年时间长出其复杂且高效的功能，尽管计算机能力强大，它们在几十年内可能无法适应这些能力。即使是简单的动物大脑仍然有很多向我们展示信息是如何处理的。例如，蜜蜂和章鱼等动物展示了某种程度的智能，尽管它们缺乏大脑。\n\
  \n\n\n\n\n# 第 13 章：全球科技巨头在 AI 领域的竞争\n\n当人们提到 AI 时，有些人会立刻转向他们可以应用以拯救人类免受失控机器侵害的方法；这是过去几十年好莱坞屏幕上上演过的熟悉故事。尽管机器智能远未接近人类意识，但一场\
  \ AI 冲突正在现实生活中发生，这并非发生在机器人与人类之间，而是企业之间争夺一个利润巨大的市场的竞争。\n\nAI 的历史可以追溯到 1950 年，当时计算机科学先驱艾伦·图灵（Alan\
  \ Turing）写并发表了一篇论文，提到有一天机器将像人类一样思考。在图灵几年前发表的里程碑式论文与今天疯狂的市场估值之间，AI 的进展要么在研究上陷入停滞，要么涉及机器在人类游戏中击败人类。\n\
  \n`IBM` 在其 `Deep Blue` 计算机击败国际象棋大师加里·卡斯帕罗夫时赢得了赞誉。15 年后，`Watson` 在电视游戏节目《危险边缘》中击败了人类。不久，`Google`\
  \ 凭借 `AlphaGo` 程序在 2015 年的胜利占据了头条新闻。\n\n## 今天的 AI\n\n在过去的几年里，AI 已经取得了超越研究和人机电视对决的巨大跨越，成为一种每天有数百万人喜爱和使用的技术。这得益于三项关键的发展。\n\
  \n首先，在线服务、智能设备和社交媒体的无处不在使得数据在大范围内可用。数据是构建深度学习算法的动力，深度学习是 AI 的一种，使机器能够学习并创建软件成为可能。系统接收的数据越多，完成任务的能力就越强。托管大量数据以前曾是一项昂贵的举措，如果没有\
  \ `Google`、`Microsoft` 和 `Amazon` 廉价云存储的出现，这种成本将继续阻止 AI 的发展。\n\n完成这一的是强大芯片组的兴起，它们加速了训练计算机变得像人类一样行为和行动的过程。这一切反映了\
  \ AI 的巨大承诺最终可以在从医疗保健、能源到自动驾驶汽车的各个行业中实现。结果是各大科技科技公司之间的竞争，旨在巩固它们在 AI 应用领域的领导者地位。\n\
  \n## AI 市场\n\nAI 行业的重要性现在不仅体现在实施这项技术的企业领域，还体现在已经享受这种需求的公司的市场表现中。\n\n例如，美国芯片制造商 `Nvidia`\
  \ 的股价在过去一年中上涨，因为图形处理组件成为公司训练 AI 系统的首选。这促使竞争对手 `Intel` 花费约 153 亿美元收购了用于卡车和汽车的芯片制造商\
  \ `Mobileye`。几年前，`Nvidia` 曾致力于成为一家投资深度学习的公司。现在这种承诺正在产生丰硕果实，由于这种新的计算模型席卷全球，我们发现自己处于领先地位。\n\
  \n## 数据主权\n\n数据所有至关重要，因为科技巨头无法拥有世界上所有的 AI 人才，但他们可以拥有训练 AI 所需的数据。这导致六科技公司占据了先机。`Facebook`\
  \ 依靠机器学习构建了聊天机器人，而 `IBM` 通过 `Watson` 成为认知计算领域的早期推动者。所有这些都让自己的 AI 技术开放，允许任何开发者在自己的云基础设施上进行创作，因为它们知道数据是主要的区别。\n\
  \n如果 AI 真的模仿了人类意识，那么我们这生中的电影情节将源于这些公司之一，因为只有它们拥有训练此类复杂程度模型的数据。AI 将引发一场新的数据黄金热，并以数据驱动的收购为特征。围绕特定用例寻找数据资产的公司将获胜。最终的准入障碍将是想象的。\n\
  \n这种在特定用例中领先的能力意味着非科技公司有机会在其细分领域分得一杯羹。工程巨头正在大力投资工厂自动化。同样，有一种观点认为 AI 初创公司和其他行业的公司可以通过六巨头的开源工具（如\
  \ `Microsoft` 的 `CNTL`）实现的 AI 民主化中受益。\n\n一些人认为，这种民主化对于确保 AI 能够解决广泛的业务和社会挑战是必要的，而且将创新限制在少数公司手中将为他们提供大量的控制权并破坏\
  \ AI 的能力。这令人感到寒意，因为 `Google` 最大的数据储备存在一些弱点。如果 `Google` 和 `Amazon` 主宰 AI 世界，那么产生的系统将产生偏见，即使它们拥有最好的目标和意图。参与\
  \ AI 辩论的人越多，受益的行业越多，我们越早能在商业、政府和社会中看到这些影响。\n\n然而，一些人认为 AI 民主化的选择已经消失。由于缺乏编程人才以及获取人才的高成本，将创新传播到六巨头之外是不现实实际的。即使有免费平台，你仍然需要一位经验且专业的数据科学家来开发为用户提供真实价值的高效解决方案。\n\
  \n当广泛的 AI 编程技能最终进入市场时，六巨头公司不必担心。通过让他们的 AI 技术开源，他们已经向世界其他部分传递了一个信息：软件不再是他们的优势，而是数据是。尽管\
  \ AI 已经出现在人们家中许多其他大型企业中，但最强大的应用尚未实现。但当它们到来时，六巨头公司已经设定了受益最多的路径，尽管如此，它们仍在相互竞争。与此同时，市场将足够让初创公司和企业利用特殊用例建立领先地位。\n\
  \n\n\n\n\n# 第 14 章：构建企业级 AI 战略\n\n在经历了十十年计算能力提升和存储成本大幅下降的推动下，企业已经具备了相关需求，以确保智能化成为现实。企业今天需要解决的问题不是是否变得智能化，而是如何做以及多快地去做。正如每家企业都是数字化企业一样，每一家业务都将变得知识化。如果它们不进化并拥抱\
  \ `AI`，它们将走向灭亡。\n\n为了实现智能化，企业需要适应并开发一种智能应用方法，同时准备组织以内化这种智能。围绕智能应用创建的战略能够让企业积累经验、体现业务价值并建立一个可重复的框架。然而，重点在于创建智能应用。\n\
  \n## 智能应用的核心\n\n在没有预设观念的情况下识别数据中模式的能力：这在很大程度上依赖于无监督机器学习技术。无监督技术会自动选择算法，并通过消除偏见极大地降低了风险。准确预测的能力依赖于在历史数据上训练的新数据模型。这是许多\
  \ `ML` 算法的标准衡量标准，但往往与整个领域混淆。\n\n智能应用必须学会如何为其断言提供辩护。如果黑盒模型无法向业务所有者解释，它们就无法完成关键任务。透明度和可辩护性会产生信任。尚未开发的智能还必须伴随着行动。这意味着智能必须自主训练其他应用程序，或者进入领域专家的工作流。最后，智能应用构建时具备了随数据变化而进行检测和反应的能力。智能系统是能够不断学习的系统。通过开发涉及所有这些属性的智能应用，企业有了一个起点。\n\
  \n## 技术战略与组织变革\n\n为了内化这些努力，需要涉及技术战略和组织变革的额外考量。例如，组织总是会使用上述组件的子集进行小规模实验。这为大多数企业营造了虚假的安全感。在无菌数据或运营真空中取得的胜利，当要求扩展到真实世界的场景时（例如在数十亿金融交易中检测网络犯罪分子，或监控和消除全球健康流行病），可能无法良好地转化。\n\
  \n建立现实世界的应用将为企业的长期成功做好准备。这种对可部署智能的承诺不应以速度为代价。设定快速时间表的企业往往学得快得多。智能系统将改变你执行特定业务流程的方式。提前理解这一事实将允许企业优化知识并巩固成果，从而为未来智能的应用建立动力。\n\
  \n## 卓越中心 (Center of Excellence)\n\n成功的变革的核心在于一个卓越中心。在这里，会开发出最佳实践、改进流程变革，并根据运营就绪情况、业务需求和其他因素建立优先级。下一代领导者将从这个卓越中心产生。因此，你需要配备充足的人员。\n\
  \n每个组织都应该根据特定的业务需求定制其智能方法。未来，每家分析公司都将转变为 `AI` 公司。这些变化将使得事实与事实难以区分，但为识别、辩护、预测和学习而定义的特征应该提供一个检查有效性的框架。该框架与应用优先的方法相结合，应该允许组织克服这些转型性变化。\n\
  \n## 开发你的 AI 战略\n\n人工智能有改变每家业务的能力，就像互联网完全改变了我们开展业务的方式一样。从为业务流程定制的更智能的服务和服务开始，`AI`\
  \ 有潜力改变一切。那些没有利用 `AI` 变革力量的业务面临被遗下的风险。这就是为什么无论企业规模大小，你都需要为你的企业制定 AI 战略的原因。\n\n为了充分发挥\
  \ `AI` 的作用，它必须与你的业务战略以及整个战略目标体系相关。因此，任何 AI 战略的第一步都是对你的业务战略进行分析。毕竟，你不想错过这一战略并将 `AI`\
  \ 应用于无关的业务目标上。在这个阶段，你需要问自己你的业务战略是否正确？在更智能的服务和产品世界，你的战略仍然适用吗？\n\n## 结论\n\n`AI` 是新企业的驱动力。主要的假设是人类智能可以使用符号结构和操作来表示。关于\
  \ `AI` 是否可以成为大脑或模仿人类大脑存在巨大的争论，但不需要等待这场争论的结果，也不需要等待能够模拟整个人类智能的假设计算机。`AI` 准备好为业务带来巨大的变革。信息技术不再是关于流程自动化和业务逻辑编程，洞察是新的货币，而它扩展这种洞察以及其产生的知识的速率是价值创造的基础和竞争优势的目标。\n\
  \n`AI` 的影响将在未来十年内增加，因为每个行业将改变其主要流程和业务模式，以利用 `AI` 和 `ML`。现在的问题在于业务管理、实施和想象。对于业务领导者来说，制定一个将\
  \ AI 工作纳入组织的计划至关重要。`AI` 要求你有可以实现的愿景。但你的愿景不应该是一个千一不变的模板，因此你的 AI 应用也不应该是。通过书中的建议和讨论，你可以向前，将高级分析引入你的公司战略，并根据你的目标理解不同方法的优缺点。\n\
  \n制造业、体育、银行和零售等领域已经发现了机器学习和 `AI` 的应用。不要忘记目前的机器可以以很高的精度完成狭定义的任务，而这种准确性取决于驱动模型的数据量。`ML`\
  \ 的现状在定制数据的输入下，将对现有产品产生无数次改进，并最终导致独立 AI 的发展。然而，随着机器学习变得复杂，我们将走向复杂的 AI。`AI` 的复杂性是通过神经网络实现的。尽管如此，我们希望你喜欢阅读这本书，并发现它资源丰富。\n\
  \n初学者网络：熟悉计算机网络基础。学习什么是计算机网络、它为什么重要以及网络化可能给机器学习带来挑战。Scott Chesterton\n\n\n\n\n#\
  \ 引言\n\n恭喜你下载《网络网络入门》，感谢你的支持。接下来的章节将以清晰、详尽的方式讨论计算机网络基础及其协议，使你能够在极短的时间内理解这些内容。\n\n\
  计算机网络是人类见过的最伟大的发明，因为它提供了极其广的机遇和卓越的技术，不仅让人类生活变得更加奢华，还为我们所想象到的最伟大的知识传递铺平了道路。本书将用通俗易懂的语言介绍计算机网络，让新手也能理解与计算机网络相关的复杂过程。\n\
  \n书中还详细描述了著名的网络协议 `TCP/IP`，以便你能更好地理解那些对于良好的网络通信至关重要的各种协议。\n\n机器学习是科技行业中一种高效且准确的现象。《网络网络入门》解释了机器学习如何与计算机网络相结合，以实现更好的网络安全，从而创造出一个远离恶意黑客的更优质的互联网环境。市面上有许多关于这一主题的书籍，再次感谢你选择本本书！我们尽了努力确保书中包含尽可能多的有用信息，请尽情阅读！\n\
  \n![](img/image2256.jpg)\n\n\n\n\n# 第一章：计算机网络简介\n\n我们知道，21 世纪的一些重要特征是数字化、网络化和信息化，这些特征让世界变得更加更加宜居。为了实现信息化，我们必须依赖完美的网络，因为网络可以在几毫秒内快速传输信息。因此，网络现在已成为信息社会的生命线，是知识经济发展的重要基础，甚至是许多秘密进行的政府活动的基础。网络对社会生活的许多方面以及社会经济发展已经产生了不可估量的影响。\n\
  \n网络有三种常见类型，即：电信网络、有线电视网络和计算机网络。按照最初的业务划分，电信网络为用户提供电话、电报和传真服务。有线电视为其用户传输各种电视节目。计算机网络允许用户在计算机之间传输数据文件。这三种网络在信息演化处理过程中都起着至关重要的作用，但其中发展最快且起着核心作用的是计算机网络。\n\
  \n随着技术的发展，电信网络和有线电视网络逐渐整合到现代计算机网络技术中，例如 Skype 和 Netflix 扩展了它们原本意图的服务范围。但计算机网络也可以为用户提供电话通信、视频通信以及视频节目传输服务。理论上，上述三种网络可以集成成一个网络以提供所有服务，但实际上往往是不可能的。\n\
  \n自 20 世纪 90 年代以来，以互联网为代表的计算机网络发展迅速，从面向美国人的免费教育和科学研究网络发展为全球使用的、最大的计算机网络。计算机网络出现只有\
  \ 50 多年了（真正的计算机网络始于 1969 年国防高级研究计划署（`ARPA`）创建的 `ARPAnet`，本书将在后文部分对其进行描述）。在 50 年的这段时间里，计算机网络技术在各个领域的发展和普及确实可以被描述为一场现象级的历程。真难以想象，在如此短的时间内，第一个兆比特连接速率已增长到数十千比特，增长了数千倍。\n\
  \n随着计算机网络技术及其范围的发展，计算机网络的优势和应用是不可想象的。在讨论计算机网络的应用之前，让我们简要讨论一下计算机网络的定义。信息通信社会这一术语已成为现代世界的同义词。人们可以随地使用手机和其他信息终端随时随地进行通信，这种环境依赖于网络的实现。然而，随着互联网的发展和普及，许多新挑战随之而生。为了瞬间高效地传输大量数据，有必要研究如何构建复杂的网络。更重要的是，必须考虑如何在这样的复杂网络中实施严格的路由控制。为了克服这些挑战，人们正努力提高网络建设的成本效益，根据市场更新更新设备，并开发更好的维护工具以确保复杂网络的稳定运行。同时，人们正努力尽快培养一批有能力的网络技术人员。\n\
  \n计算机对我们的社会生活产生了不可估量的影响。今天，计算机已应用于各个领域，以至于有人说：“20 世纪伟大的发明是计算机”。计算机不仅被引入办公室、工厂、学校、教育机构和实验室，还进入了家庭个人电脑。同时，拥有笔记本电脑、平板电脑和手机终端（智能手机）等便携设备的人越来越多。即使是看起来完全不像计算机的设备，如家电、音乐播放器、办公设备和汽车，通常也内置了一个芯片来提供它们所需的计算机控制。在不经间，我们的工作生活已与计算机紧密联系。我们使用的大多数计算机和内置计算机的设备都是联网的。\n\
  \n最初，计算机广泛用于独立模式。然而，随着计算机的不断发展，人们不再限于单机模式，而是将连接到计算机网络。通过连接多台计算机，可以共享信息，并可以在相距很远的两台机器之间传输信息。最初，计算机网络是由管理员将特定的计算机连接在一起形成的。例如，同一公司或实验室拥有的计算机连接，或者进行业务往来的企业之间的计算机连接。总而言之，这是一个私有网络。随着这种私有网络的发展，人们开始尝试连接几个私有网络以形成更大的私有网络。这种网络逐渐演变为供公众使用的互联网。连接到互联网后，计算机与计算机通信不再限于公司或部门，而是可以与互联网上的任何计算机通信。互联网作为一种新技术，极大地丰富了电话、邮政和传真的通信手段，并逐渐被人们接受。从那时起，人们开发了各种互联网接入技术，使各种通信终端连接到互联网，使互联网成为世界级的计算机网络，为我们创造了如今的集成通信环境。\n\
  \n计算机网络就像人的神经系统。人体内所有的感官都通过神经传递给大脑。同样，来自世界的信息通过网络传递给每个人的计算机。随着互联网的爆炸式发展和普及，信息网络已无处不在。社区成员、学生可以通过邮件组（使用电子邮件公告板功能，所有订阅该邮件组的成员都可以接收发送给组的邮件）、首页、BBS\
  \ 论坛相互联系，甚至可以通过博客访问。连接到互联网后，计算机之间的通信不再限于公司或部门，而是可以与互联网上的任何计算机通信。互联网作为一种新技术，极大地丰富了电话、邮政和传真的通信手段，并逐渐被人们接受。……（注：此处原文内容重复，已翻译逻辑）\n\
  \n## 计算机网络的定义\n\n计算机网络主要由互连的通用编程硬件组成。这些硬件被设计用于特定目的（例如传输数据或视频信号）。根据这个定义：\n(1) 连接到计算机网络的硬件不仅限于普通计算机，还包括智能手机等不同类型的设备，每天遍布市场。\n\
  (2) 计算机网络专门设计用于传输数据，并能够支持广泛的应用（包括未来可能出现的应用）。\n\n我们知道，最初计算机网络真的用于传输数据。但随着网络技术的发展，计算机的应用范围正在扩大，网络不仅可以传输音频和视频文件，还可以支持各种应用程序。\n\
  \n计算机网络的历史\n\n理解计算机网络的发展史将有助于我们清晰地理解计算机网络技术和应用的发展，并帮助我们区分哪些是目前的主流应用技术，哪些是过时不需要学习的。当然，在有计算机网络之前必须有计算机，正如在人类社会之前必须有人类一样。通常来说，计算机网络的发展可以总结为以下阶段：\n\
  \n### 按网络范围分类\n\n- **广域网 (Wan)**：这是互联网的核心部分，其任务是传输远距离发送的数据（例如跨国）。连接 `Wan` 节点的链路通常是具有大容量的高速链路。\n\
  - **城域网 (Man)**：城域网的范围通常是一个城市，可以跨越几个街甚至整个城市，其功能距离约为 50 公里。城域网可以由一个或多个单位所有，也可以作为连接多个局域网（LANs）的工具。目前，许多城域网（`Man`）基于以太网技术。\n\
  - **局域网 (LAN)**：在开发早期，学校或工厂只有一个 `Lan`，但现在 `LAN` 被广泛用于不同的目的。学校或企业有很多互连的 `LAN`（此类网络通常被称为校园网或企业网）。\n\
  - **个人域网 (Pan)**：个人域网（`Pan`）是一种连接个人电子设备（如便携式电脑）并在工作场所或家里无线使用的网络。这通常被称为无线个人域网（`WPAN`），范围约为\
  \ 10 米。\n\n### 按网络用户分类\n\n- **公共网络**：这是由电信公司出资建设的大网络（“公共”意味着愿意按照电信公司规则付费的人都可以使用该网络）。因此，公共网络也可以称为公共网络。\n\
  - **私有网络**：私有网络是由部门为了满足特定业务单元的需求而建立的网络。该网络不为单位之外的人提供服务。例如，军事、铁路、电力等系统都有自己的私有网络。\n\
  \n## 计算机网络在现实世界中的应用\n\n在介绍计算机网络的简单历史之前，我们将介绍几个改变世界的计算机网络应用。涉及到计算机网络时，你必须问的第一问题是它们做什么用的，我们可以用它们做什么。如果你回到十多年前询问计算机的使用，你们可能都会同意“资源共享”是答案。对于当时的计算机网络应用也是如此，那时既没有互联网，也没有\
  \ `LAN` 内部应用程序。现在，随着计算机网络系统的改进和普及，特别是互联网技术，计算机网络的应用看到了前所未有的繁荣。计算机网络渗透到了普通人的日常工作、生活和娱乐等方面。虽然有很多计算机网络应用，但它们分为两大类：一类是业务应用，另一类是家庭/个人应用。以下部分将介绍计算机网络日常使用的详细描述和应用。\n\
  \n### 商业应用\n\n业务应用是计算机网络最重要的方面，而家庭/个人应用则是在业务应用的基础上发展的。在计算机网络的商业应用中，主网络是让所有员工在服务器上共享某些工具，例如在企业内部网安装。业务应用包括资源共享、协作工作、远程访问和管理、电子商务等。\n\
  \n1. **资源共享**：计算机网络中最基础的应用之一。资源共享允许 `LAN` 内的多个用户共享物理设备（如打印机、扫描仪、传真机、录音机等），目标是让每个用户访问程序、文件和数据，从而极大地节省了投资。由于网络，这些资源对用户来说变得易于使用，大量的价值文档（包括音频和视频文件）被互联网用户轻松读取或下载。\n\
  \n2. **网络通信**：通常认为计算机网络是指通过链路连接不同位置的计算机和网络设备。在网络通信领域，人们通过特殊方式（目前主要使用 `VPN`）使通信更安全、方便且更高效。另一方面，这项功能可以节省时间并解决一些困难。\n\
  \n3. **数据传输**：数据传输在计算机网络中最为常见，例如，我们通过 `E-MAIL`、`FTP`（文件传输协议）、`TFTP`（简单文件传输协议）、`RCP`（远程控制协议）等发送文件给朋友。通过\
  \ `MSN` 等，许多网站每天为用户提供下载文件的功能。\n\n4. **协作工作**：协作工作是计算机网络的一个典型应用，意味着在相同或不同地点通过网络工作。最典型的例子是服务器的负载均衡、`cluster`（集群）、许多\
  \ `ISP` 服务器、`DC`（域控制器）服务器，还可以为网络提供相应的服务。目前的应用之一是 `Wikipedia`（维基百科），内容由总部和分支机构的者编辑和完善。\n\
  \n### 家庭应用\n\n最初，计算机网络主要是商业应用，但随着互联网宽带接入和丰富的互联网应用，计算机网络开始进入普通人的家庭。今天，我们可以从家中的宽带连接接入互联网，访问全球网站，通过\
  \ `Facebook` 和 `Twitter` 等即时通讯软件与陌生人建立联系；我们还可以拥有局域网或个人网站，全球的人可以访问这些网站来了解我们提供的产品和服务，以及我们的工作、学校和生活状态。你在日常生活中看到的一切都属于家庭应用。从\
  \ `Netflix` 到 `Spotify` 再到 `YouTube` 直到 `WhatsApp`。你在日常生活中用于通信、自我教育、与人协作、计划旅行或点餐的一切都属于家庭应用。在继续之前，拿一张纸记下你最喜欢的网站，并在\
  \ Google 上搜索它们是如何运作的，以便更好地理解你喜欢的网站或互联网应用。\n\n## 计算机网络历史\n\n本部分的目的是介绍计算机和网络的发展历史。计算机在\
  \ 20 世纪 50 年代流行起来，从那时起使用模式发生了很大变化。计算机网络的发展经历了几代变革。不仅计算机网络的内涵发生了巨大变化，计算机网络技术和网络应用也与几十年前不同，第一二代计算机网络是可以比较的。理解计算机网络的发展史将有助于我们清晰地理解计算机网络技术和应用的发展，并帮助我们区分哪些是目前的主流应用技术，哪些是过时不需要学习的。当然，在有计算机网络之前必须有计算机，正如在人类社会之前必须有人一样。总来说，计算机网络的发展可以总结为以下阶段：\n\
  \n### (1) 第一代计算机网络（终端型计算机网络）\n\n1946 年，世界上第一台数字计算机出现，但那时计算机非常少且价格昂贵。大多数计算机当时使用复杂的方法将数据输入纸带或卡片，送到计算机中心处理。1954\
  \ 年，引入了名为 `Transceiver`（收发器）的终端，首次通过线路向计算机传输数据。从那时起，打字机也连接到计算机作为远程终端，用户可以在打字机上输入程序。这种简单传输系统是计算机网络的原型。第一代的典型应用是\
  \ 20 世纪 50 年代早期由 `IBM` 开发的预留系统。20 世纪 60 年代，计算机网络还出现了 `TSS`（分时系统），它指的是将输入和输出设备（如键盘、显示器）连接到同一台计算机，允许多个用户同时使用计算机。那时计算机费用非常昂贵，但分时系统的出现提高了计算机的可用性，特别是交互操作（即根据用户的指令让计算机完成处理并返回结果）。\n\
  \n### (2) 第二代计算机网络（分组交换网络）\n\n为了克服第一代计算机网络的缺点并提高其可用性和可靠性，专家们开始研究连接多台计算机的方法。1964\
  \ 年 8 月，Rand 公司引入了“分组交换”。1962 年至 1965 年之间，美国 `ARPA` 和英国 `NPL`（国家物理实验室）研究了新技术。随后，在\
  \ 1966 年，英国 `NPL` 引入了“分组”的概念。1969 年 12 月，基于分组技术的世界上第一个分组交换系统 `ARPANET` 诞生了。这被广泛认为是计算机网络的起源。ARPANET\
  \ 由 `DARPA` 利用线路作为骨干网构建，最初连接了四个节点——UCLA、`UC Santa Barbara`、斯坦福大学和犹他大学——后来增长到 15\
  \ 个节点。20 世纪 70 年代后期，网络拥有了 60 多个节点和 100 多台主机，横跨美国连接了许多大学和研究机构，还通过卫星连接到欧洲。第二代计算机网络的用户不仅可以共享“通信子网”中的线路和设备资源，还可以共享“资源子网”中丰富的硬件软件资源。这种以通信子网为中心的网络变成了我们现在说的第二代计算机网络。\n\
  \n### (3) 第三代计算机网络（标准化计算机网络）\n\n70 年代，计算机性能飞跃，尺寸缩小，价格大幅下降。因此，计算机不再限于研究机构的使用，普通业务开始使用计算机。这是因为用于日常业务的计算机增加。为了提高工作效率，人们开始研究计算机间的通信技术。在计算机通信出现之前，将数据从一台计算机传输到另一台计算机很麻烦。那时数据必须保存到磁带和磁盘等外部存储介质上。最初只是磁盘，现在更多地使用`CD`和`USB`存储发送到目的地。然而，有了计算机通信技术（通过线路连接），可以实时从另一台计算机读取数据，大大缩短了传输数据的时间。从那时起，计算机的发展进入了一个新的历史阶段。在这个阶段，计算机更关注用户需求，系统更灵活，操作比以前更友好。70\
  \ 年代初，人们开始实验基于分组交换的计算机网络，并研究不同厂家之间的通信技术。传输模式采用了第二代的“存储转发”模式，极大提高了昂贵资源的利用。然而，第二代仍有许多缺点，如缺乏统一的架构和协议标准。此外，尽管第二代计算机网络已分为通信子网和资源子网，但例如，1974\
  \ 年`IBM`引入了系统架构 `SNA`，1975 年`UNIVAC`宣布了其数字网络架构 `DNA`；1976 年`DEC`宣布了分布式通信架构 `DCA`。\n\
  \n### (4) 第四代计算机网络（国际计算机网络）\n\n20 世纪 80 年代末，局域网（`LAN`）已经成熟，光纤和高速以太网出现。随着`OSI/RM`架构的诞生，第三代计算机网络极大促进了以互联网为代表的网络的发展，现在的第四代。第四代计算机网络定义为“通过网络设备和线路实现资源共享数据通信的系统”。事实上，互联网的原始是\
  \ DARPA 的 `ARPANET`，采用的协议是 `TCP/IP`规范。互联网的基本历史如下：1985 年，美国科学基金会建立了`NSFNET`，这是一个用于科学研究的骨干网，使用`ARPANET`协议；`NSFnet`取代`ARPANET`成为国家网骨干，从大学进入社会；1992\
  \ 年，伊利诺伊大学超级计算中心成功开发了`Mosaic`，这种在线浏览器后来成为了`Netscape`。同年，克林顿宣布了信息基础设施计划。从那时起，`NSF`停止了互联网并使其完全商业化。\n\
  \n\n\n\n\n![](img/image2371.jpg)\n\n\n\n\n# 第二章：计算机网络基础\n\n在详细讨论计算机网络之前，我们首先将讨论互联网——这个最大的网络，以及它与终端用户通信的细节和使用的少数协议，以便更好地理解网络架构。\n\
  \n## 为什么互联网会风靡全球？\n\n互联网之所以能为用户提供许多服务，是因为具有两个重要的基本特征，即**连接性**和**共享**。连接性是指互联网允许用户相互连接，无论他们相隔有多远（例如，数千公里）。各种信息（数据，以及音频和视频）都可以非常容易、廉价地交换（在很多情况下是免费的），就好像这些用户终端都直接连接在一起了一样。这与使用传统的电信网络有很大不同。互联网已成为全球最大、增长最快的计算机网络，没有人能准确说它有多大。让我们从互联网的概述开始，包括互联网的主要组件，以便对计算机网络有一个初步的了解。网络将许多计算机连接在一起，而互联网通过路由器连接许多网络。连接到网络上的计算机通常被称为主机。互联网已成为世界上最大且增长最快的计算机网络，没有人能确切知道它的规模。互联网的快速发展始于\
  \ 20 世纪 90 年代。由欧洲核子研究组织（CERN）开发的万维网（WWW）在互联网上被广泛使用，极大方便了非网络专业人士使用互联网。它是互联网指数级增长的主要动力。世界维网上的网站数量也剧增。互联网上的准确流量很难估计，但文献表明，互联网上的数据流量每月增长约\
  \ 10%。\n\n互联网边缘的部分是所有连接到互联网的主机。这些主机也被称为端系统，“端”就意味着“末端”（互联网的末端）。\n\n### 端系统\n\n端系统的功能差异很大。一个较小的端系统可以是一台普通的个人电脑（包括笔记本电脑或平板电脑）和一个接入互联网的智能手机。甚至是一个小型摄像头（可以实时监控当地天气或交通并发布到互联网上）。而一个大端系统可以是一台昂贵的主机计算机。端系统的所有者可以是个人、单位（如学校、企业、政府机构等）或互联网服务提供商（ISP，即\
  \ ISP 可以拥有一些端系统）。ISP 可以拥有一些端系统，边缘使用核心部分提供的服务使多个主机相互通信或交换信息。\n\n## 互联网中的通信\n\n我们需要定义以下概念。当我们说“主机\
  \ A 与主机 B 通信”时，实际上是指“运行在主机 A 上的程序与运行在主机 B 上的程序通信”。由于“进程”是指“运行的程序”，这意味着“主机 A 上的进程与主机\
  \ B 上的进程通信”。网络边缘端系统之间的通信通常分为两类：客户端/服务器模型（C/S）和对等模型（P2P）。下面将介绍这两种方法。\n\n### 客户端/服务器模型\n\
  \n这是互联网中最常用的方法。我们使用客户端/服务器模型（有时写作 C/S 模式）在在线发送电子邮件或在网站上查找信息。当我们拨打电话时，电话铃提醒用户现在有一个通话。显然，客户端/服务器方法的通信发生在应用层。客户端/服务器方法允许两个应用进程进行通信。客户端/服务器方法描述了服务与进程之间的关系：主机\
  \ A 运行客户端，主机 B 运行服务器。在这种情况下，A 是客户端，B 是服务器。客户端向 B 请求服务，特征是：客户端是服务的请求者，服务器是服务的提供者。在实践中，网络边缘的客户端和服务器程序通常具有以下特征：\n\
  \n客户端程序：\n1. 在用户调用后发起通信（请求服务）到远程服务器。因此，客户端必须知道服务器的地址。\n2. 不需要特殊的硬件或复杂的操作系统。\n\n\
  服务器：\n1. 设计用于提供服务，可以同时处理来自远程或本地客户的请求。\n2. 启动后持续等待并接收来自全球客户的请求。因此，服务器不需要知道客户端的地址。\n\
  3. 通常需要强大的硬件和操作系统的支持。\n\n通过这种方式，客户端和服务器指的是进程（软件）。使用计算机的“用户”是客户端，而运行服务器程序的是服务器。在许多文献中，运行客户端的机器被称为客户端（这种情况下也可以翻译为“客户端”），而运行服务器的机器被称为服务器。所以我们应该判断客户端或服务器指的是软件还是硬件。\n\
  \n### 对等连接\n\n对等网络（Peer-to-Peer，简称 P2P）。在这里使用的对等网络通常缩写为 P2P，指的是在不区分服务请求者和服务提供者的情况下主机之间的通信。只要两个主机运行对等（P2P）软件，就可以在对等的基础上通信，此时双方都可以下载对方存储在硬盘上的共享文档。这种工作方式也称为\
  \ P2P。主机 C、E 和 F 运行对等软件，这样主机可以对等地通信。事实上，对等连接本质上仍然是客户端/服务器方法，只是每个主机在对等连接中都是客户端和服务器。例如，当主机\
  \ C 请求 D 的服务时，C 是客户端，D 是服务器。但如果 C 同时为 F 服务，C 作为服务器。对等连接允许大量用户等同时工作。BitTorrent 是对等连接的最好的例子。从在浏览器中输入`URL`到在屏幕上显示网页内容，在几秒钟内，许多硬件和软件各司其职。每个链接并不复杂，只要仔细阅读就能理解。然而，旅程涉及大量的硬件和软件，如果你从微观角度关注每个点，可能会忽略整体并迷失方向。在我们开始探索之前，让我们简要看看这段旅程。下面的介绍还包含了一个发现之旅的路线，以防途中迷路。\n\
  \n## Web 的全景\n\n让我们首先看看浏览器访问 Web 服务器的全景。访问 Web 服务器并显示网页涉及浏览器与服务器之间的一交互，主要如下：\n1.\
  \ 浏览器：“请给我网页数据。”\n2. Web 服务器：“好的，知道了。”\n\n在这一系列交互完成后，浏览器将从 Web 服务器接收的数据显示在屏幕上。虽然显示网页的过程是复杂的，但网络上浏览器与服务器之间的交互却惊奇地简单。当我们在线商场购物时，我们输入产品名称和想要接收的商品地址，并发送到\
  \ Web 服务器。\n1. 浏览器：“请处理这些订单数据。”\n2. Web 服务器：“好的，订单收到。”\n\n虽然与销售系统实际处理订单是复杂的，但浏览器与\
  \ Web 服务器之间的交互是简单的，总结如下：\n1. 浏览器向 Web 服务器发送请求。\n2. Web 服务器向浏览器发送响应。\n\n在浏览器和 Web\
  \ 服务器等应用交互的这一层，理解其工作原理应该是相对容易的。这非常类似于人类之间的对话，从这一点开始更容易理解。为了实现应用之间的交互，我们需要一种机制在浏览器和服务器之间传递请求和响应。基本思想是将数字信息分成小块，然后通过许多交换机和路由器，最后传输到目的地。这种机制由操作系统中的网络控制软件实现。最早出现的之一是协议栈（网络控制软件）。该软件对来自浏览的消息进行封装，并添加如目的地之类的控制信息。用邮局类比，就是将信放入信封并在信封上写上收件人地址。软件还有其他功能，如在通信错误时重发数据，我们可以将其想象成帮助我们发送信件的小秘书。接下来，数据栈将数据交给网卡（负责网络通信的硬件）。网卡将数据转换为电信号并发送出去。通过这种方式，数据进入网络。\n\
  \n接下来的情况取决于接入的形式。数据包通过通过交换机或其他设备传输到接入互联网的路由器。路由器后面是互联网，网络运营商负责将包递送到目的地，就像邮递员在我们把信投入信箱后负责递送一样。数据从接入互联网的路由器传输到互联网内部。互联网的网关被称为接入网络。通常，我们可以使用电话线、`ISDN`、`ADSL`、电缆、光纤、专线等线路接入互联网；这些通信线路统称为接入网络。接入网络连接到约定的网络运营商和一个接入接入点（PoP）。接入点的实体是为运营商设计的路由器，我们可以将其想象成离家最近的邮局。\n\
  \n\n\n\n\n## 1. 计算机设备\n\n构建计算机网络的目的是为各种计算机设备用户之间的网络通信提供一个平台，例如用户访问、数据传输、文件共享、远程控制等。计算机设备是指由网络用户控制和使用的各种计算机（如\
  \ `pcs`、`computer servers`、`computer terminals`、`laptop computers`、`IPad` 等）。网络的主要应用都在计算机设备上运行。\n\
  \n事实上，现在计算机网络和电信网络在某种程度上是重叠的。许多电信终端也可以连接到计算机网络，例如我们现在智能手机，它们可以在 `USB` 接口和计算机之间进行数据传输，甚至可以进行远程通信。需要注意的是，在计算机网络的传统定义中，计算机网络至少需要一台功能完整的物理计算机（其他设备可以是终端）。随着网络虚拟化技术的兴起，现在的计算机网络可以是物理计算机中模拟的多个独立计算机系统的虚拟机器（如\
  \ `VPC`、`VMWare` 等），从而形成一个虚拟计算机网络。这种网络也可以执行某些时候只有在许多物理计算机网络中才能实现的功能。\n\n## 2. 网络设备\n\
  \n在计算机网络系统中，网络设备通常指计算机设备以外的设备，如 `network card`（网卡）、`bridge`（网桥器）、`gateway`（网关）、`Modem`（调制解调器）、`switch`（交换机）、`router`（路由器）、`hardware\
  \ firewall`（硬件防火墙）、`hardware IDS`（入侵检测系统）、`hardware IPS`（入侵预防系统）、宽带接入服务器 (`Bras`）、`UPS`（不间断电源）等。以及\
  \ `Wlan Network Card`（无线网卡）、`WLAN AP`、`WLAN Router`、`WLAN switch` 等。\n\n网络设备用于构建“通信子网”中的网络拓扑结构，与通信线路（即“传输介质”）共同构成整个计算机网络的框架。当然，最简单的网络实际上不需要任何网络设备，即通过\
  \ `serial/parallel port cable` 直接连接的两个终端计算机计算机形成点对点网络。但这种网络并不是真正的计算机网络，因为目前这种计算机网络并没有很大的实际意义。\n\
  \n## 3. 传输介质\n\n传输介质简单来说就是网络线路，是网络通信的“道路”。没有这些传输介质，网络通信信号就不知道传输到哪里，也无法传输，就像前面没有路，我们无法前进一样。当然，传输介质可以是物理实体的，如\
  \ `coaxial cable`（也用于电缆）、`twisted pair`（双绞线）、`optical cable`（也称为 `optical fiber`），也可以是不可见的。\n\
  \n例如，各种无线网络使用的传输介质实际上是电磁波。无线计算机网络 (`WCN`) 是通过电磁波实现 `WCN` 中每个节点的连接。当然，还有 `coaxial\
  \ cable`、`twisted pair`、`optical cable` 等传输介质。\n\n## 4. 计算机网络软件系统\n\n计算机网络通信除了上述各种计算机硬件系统，还需要计算机网络通信和应用软件。这些计算机网络通信和应用软件是指安装在终端计算机上用于网络通信或应用的计算机程序。\n\
  \n首先是网络应用平台，例如带有操作系统的计算机和服务器。网络通信的操作系统也安装在交换机、路由器和防火墙等设备上。例如，用于 `Switch/router`\
  \ 的 `Windows`、`Linux`、`UNIX`、`CatOS`，用于 Cisco 的 `IOS`，用于 H3C 的 `Comware`。除了操作系统，还有网络协议，如\
  \ `TCP / IP`、`ieee802`、`PPP`、`PPPoE`、`IPX / SPX`、`VLAN`、`STP`、`RIP`、`OSPF`、`BGP`。最后，还需要各种网络应用工具，如\
  \ `Qq`、`MSN instant messaging`、`Outlook`、`Firefox`、`Sendmail` 等邮件软件，用于 `VPN`、`IPSEC`、`PPTP`、`L2TP`。\n\
  \n## 网络是如何提供给人的？\n\n让我们仔细观察网络是如何构建的。人们在家里或工作连接互联网时，通常使用互联网接入服务。通过互联网，汇聚到 `Wireless\
  \ Lan router` 和最近交换机的流量再次连接到前面提到的“接入层”（如果公司大、网络大或有大量的外部访问，有时直接连接到 ` Network`）。甚至可能通过“边缘网络”或“骨干网”与目标地址进行通信。\n\
  \n## 移动通信\n\n手机一开机，就会自动与最近的基站进行无线通信。基站配备了特殊的手机基站天线，基站本身就是网络的“接入层”。当手机终端向另一个终端发送信号时，请求会一直传到另一端注册手机号码的基站。如果对方接听电话，两部手机之间就会建立通信连接。基站收集的通信请求汇集在控制中心（`边缘网络`），然后连接到信互控制中心的骨干网。\n\
  \n\n\n\n\n# 第 3 章：网络详析\n\n计算机网络的最初目的是将单台计算机连接起来，以形成一个更强大的计算环境。简而言之，是为了提高生产力。从批处理时代到计算机网络时代，毫无疑问，这正是计算机网络初衷所在。然而，现在技术似乎发生了一种微妙的变化。现代计算机网络的主要目的之一可以被认为是连接人。世界各地的人们可以通过互联网进行连接、通信和思想交流。然而，这在计算机网络的早期是无法想象的。这种人与人之间的计算机网络逐渐给人们的日常生活、学校教育、科学研究以及公司发展带来了巨大的变化。本章将详细描述计算机网络架构，通过这种方式来丰富你的知识，并帮助你理解计算机网络中运行的复杂过程。文中将使用一些示例和场景，以帮助你更好地理解这一主题。\n\
  \n## 协议 (Protocol)\n\n在计算机网络和信息通信领域，人们经常提到“协议”一词。互联网上常用的性协议有 `IP`、`TCP`、`HTTP` 等。局域网（Lan）中常用的协议有\
  \ `IPX / SPX`（Novell 开发的 NetWare 系统协议）等。\n\n### 为什么需要协议？\n\n通常，我们发送电子邮件 (`E-mail`)、访问主页获取信息，并不会意识到后台运行的协议，只有当我们需要重新配置计算机的网络连接并修改网络设置时，这些才可能被注意到。因此，只要网络设置并连接成功，人们往往会忘记协议之类的事情。只要应用程序知道如何利用协议，就足够让人们使用他们建立的网络连接了。一个人因为不了解某些协议而无法访问互联网，这并不罕见。然而，在通过网络进行通信的过程中，协议起着至关重要的作用，既然你对了解协议感兴趣，那么了解它将让你对该主题有一个良好的概览。\n\
  \n简而言之，协议是客户端计算机和服务器计算机通过网络实现通信的一种“契约”。这种“惯例”使得由不同厂商的设备设备、不同 CPU 和不同操作系统组成的计算机，只要它们遵循相同的协议，就可以相互通信。另一方面，如果使用不同的协议，就无法实现通信。这就像两个说不同语言的人无法互相理解。协议有许多类型，每种协议都明确定义了其行为准则。两台计算机必须能够支持相同的协议，并遵循相同的协议进行处理，以实现相互通信。\n\
  \n在进一步探讨协议主题之前，让我们先讨论两个为了更好地理解而需要了解非常基础的概念。它们是中央处理器和操作系统。\n\n### CPU\n\n`CPU`（中央处理器）。它就像计算机的“心脏”，每个程序实际上都是由它进行调度和执行。`CPU`\
  \ 的性能在很大程度上决定了计算机的处理性能。因此，人们经常说，计算机的历史实际上就是 `CPU` 的历史。目前，人们经常使用 `CPU Intel Core`、`Intel\
  \ Atom`、`ARM CORTEX` 等产品。\n\n### 操作系统\n\n`Os`（操作系统）操作系统是种基础软件。它集成了 `CPU` 管理、内存管理、计算机外设管理以及程序管理等重要功能。这里描述的对\
  \ `TCP` 或 `IP` 协议的处理，在许多情况下已经嵌入到特定的操作系统中了。今天个人电脑常用的操作系统有 `UNIX`、`Windows`、`Mac OS\
  \ x`、`Linux` 等。\n\n在计算机中运行的指令在不同的 `CPU` 以及不同的操作系统之间是不同的。因此，为某些 `CPU` 或操作系统设计的程序，如果被直接复制到具有其他类型\
  \ `CPU` 或操作系统的计算机上，可能无法直接运行。存储在计算机中的数据也随 `CPU` 和操作系统而异。因此，如果不同计算机之间的 CPU 和操作系统要实现通信，就需要一个双方支持的协议，并遵循该协议进行数据读取。这就是为什么你不能在\
  \ `iPhone` 上运行安卓应用的原因。此外，一个 `CPU` 通常一次只能运行一个程序。为了让多个程序同时运行，操作系统采用了 `CPU` 时间片轮询机制在多个程序之间进行切换和合理调度。这种方法被称为多任务处理。\n\
  \n## 协议中的契约是什么？\n\n契约就像人与之间的对话。这里有一个简单的例子。有三个人：Sam、Tom 和 Jerry。Sam 只能说中文，Tom 只能说英文，而\
  \ Jerry 中英文和英文都会说。现在 Sam 和 Tom 需要聊天。他们应该如何相互通信？如果 Tom 和 Jerry 需要聊天呢？如果我们：\n- 将中文和英文视为“契约”。\n\
  - 使用聊天通信。\n- 将你所说的话视为“数据”。\n\n我担心 Sam 和 Tom 无法长时间相互通信，因为他们在对话中使用的契约（语言）存在差异，双方都无法向对方传输数据（他们想要说的话）。\n\
  \n接下来，我们分析 Sam 和 Jerry 之间的对话。通过使用这种“契约”（语言），两个人可以理解对方想要表达什么。也就是说，Sam 和 Jerry 使用相同的协议为了顺畅通信，以便他们传输所需的数据（他们想要说的话）。从这个意义上说，契约就像普通的语言。尽管语言是人类的属性，当计算机在互联网上相互通信时，也可以基于类似于人类的“语言”（同样，我们在日常生活中习以为常的契约）。\n\
  \n## 计算机中的协议\n\n人类拥有知识的能力，也具有应用知识的能力。因此，以某种方式，人类的通信不受过多规则限制。即使有任何规则，人们也可以通过他们的能力自然地适应。然而，在计算机通信中，所有这些显然是不可能实现的。事实上，从计算机的物理连接层到应用层的一切都必须严格遵循协议。真正的通信只能通过先前的契约来实现。此外，每台计算机必须配备执行通信最基本功能的程序。通过之前的\
  \ Sam、Tom 和 Jerry 的例子更容易理解为什么需要明确定义协议，以及为什么要遵循协议来设计软件和硬件。\n\n## 分包交换 (Packet Switching)\n\
  \n分包交换是将数据分成称为 `packets`（数据包）的小单元单元的方法。这个问题就像我们在邮局通常看到的一样。当人们寄包裹时，他们通常填写一份表格，将其交给邮局。数据包通常有发送者地址和目的地地址，数据包的部分被称为\
  \ `header`（头部）。当较大的数据被分成组时，必须写入序列号并将这些组组装成原始数据。在通信协议中，通常在消息的开头指定应该写入什么信息。\n\n##\
  \ 通信的标准化\n\n在计算机通信初期，系统化和标准化并没有引起关注。每个计算机制造商产生了自己的网络架构来实现分层。1974 年，IBM 发布了 `SNA`\
  \ 作为计算机通信技术。从那时起，计算机制造商也发布了自己的网络架构，引发了系统化。然而，各种网络架构和协议并不兼容。这意味着如果一个厂商破产了，整个网络必须更换。随着计算机重要性的增加，许多公司开始致力于让异构模型相互通信。这促进了开放性和通用性。\n\
  \n为了解决这些问题，ISO（国际标准组织）建立了一个国际标准——`OSI`（开放系统互连模型），并标准化了通信系统。目前 `OSI` 协议并不常用，但 `OSI\
  \ reference 模型` 作为协议的设计指南经常用于网络开发。协议的标准化也使得遵循标准的所有设备不再因为硬件或操作系统的差异而无法通信。\n\n## OSI\
  \ 模型\n\n在 ISO 标准化 `OSI` 之前充分讨论了网络架构的相关问题，`OSI reference 模型` 作为协议的设计被提出。该模型将通信功能分为\
  \ 7 层。通过这些层，每层接收下层提供的特定服务，并负责为上层提供特定服务。管理上下层之间交互的约定被称为 `interfaces`（接口）。管理层级之间交互的约定被称为协议。\n\
  \n协议分层就像计算机软件的模块化开发。`OSI reference 模型` 的建议是理想的。它将从第一层到第七层的所有模块结合起来实现通信。分层允许每层独立使用，因此系统中的某些层的变化不会影响整个系统。因此，可以构建一个既扩展又灵活的系统。此外，通过分层可以将通信功能细分，从而为每层实现单独的协议并定义每层的特定职责和义务。这些都是分层的优点。缺点可能是模块化导致处理负担增加，并且必须为每个模块实现类似的处理逻辑。\n\
  \n### 通过简单例子理解分层\n\n首先以电话聊天为例。两个人，Adam 和 Eve，正在用电话（通信设备）用英文（语言协议）说话。表面上，Adam 和 Eve\
  \ 正在用英文直接对话，但实际上，Adam 和 Eve 都在通过电话接收器听声音，并对着麦克风说话。想象一下一个从未见过电话的人看到这一切会怎么想？我担心他一定会认为\
  \ Adam 和 Eve 正在电话通话。从网络角度来看，他们使用的语言协议是将麦克风的音频输入在通信设备层面翻译成无线电信号，发送到对方的手机，然后由通信设备层转换为音频输出，传递给对方。因此，Adam\
  \ 和 Eve 实际上是使用电话与声音之间的接口进行对话的。\n\n## OSI 模型\n\n`OSI reference 模型` 将通信功能分为七层。下面我们简要解释所有这些层：\n\
  \n### 应用层 (Application Layer)\n\n`application layer` 为应用程序提供服务，并指定通信相关的细节。包括文件传输、电子邮件、远程登录（虚拟终端）和其他协议。\n\
  \n### 表示层 (Presentation Layer)\n\n`presentation layer` 将应用程序处理的信息转换为适合网络传输的格式，或将下一层的数据转换为上层可以处理的格式。因此，使它们保持一致是该层的主要功能。\n\
  \n### 会话层 (Session Layer)\n\n`session layer` 负责建立和断开通信链路（数据流的逻辑路径）以及数据分区等数据传输。\n\
  \n### 传输层 (Transport Layer)\n\n`transport layer` 充当可靠的传输器。处理是在通信双方进行的，而是在路由器上。\n\
  \n## 网络层 (Network Layer)\n\n`network layer` 将数据传输到目的地地址。目的地地址可以由路由器处理。\n\n### 数据链路层\
  \ (Data Link Layer)\n\n`data link layer` 负责物理地址寻址，并将数据封装成帧。管理层层与层之间交互的约定被称为协议。\n\
  \n### 物理层 (Physical Layer)\n\n`physical layer` 负责比特流传输。\n\n\n\n\n\n![](img/image2700.jpg)\n\
  \n\n\n\n# 第 4 章：高级网络\n\n在本章中，我们将进一步扩展关于参考模型的知识，并详细学习 TCP 协议。\n\n## 物理层\n\n提到网络架构的`物理层`时，首先需要了解它的功能。与其他层相比，由于传输介质类型、物理接口及其通信协议（即\
  \ `communication protocols`）的不同，`物理层`包含了更多的技术和过程，但它的主要功能相对简单，包括：\n\n### (1) 建立数据路径\n\
  `Data Path`（数据路径）是一个完整的数据传输通道，可以是物理介质的一段，也可以由多个物理介质连接。一个完整的数据传输包括物理连接激活、数据传输、物理连接终止三个主要阶段。所谓的`物理连接激活`是指，无论涉及多少段物理介质，在两个数据终端设备之间的通信中必须连接起来，形成上述的连续数据传输通道。\n\
  \n### (2) 透明传输\n物理层提供了多种传输介质（如不同类型的同轴电缆、双绞线和光纤等），每种介质都有相应的通信协议和标准支持。这决定了不同的计算机网络可能有不同的`paths`（路径）。除了修复这些不同的`paths`外，`物理层`还确保这些不同的路径可以被`connected`（连接），形成最终将比特流传输到对端物理层的路径，其目的是将其提交给数据链路层。\n\
  \n为了实现这些功能，`物理层`需要具备屏蔽不同传输介质类型和通信协议的功能，使得网络上通信的双方只能看到有一条“路”可用。无论用于构建这些路的具体`material`（材料）和相关标准是什么，这都是`物理层`的`透明传输`功能。\n\
  \n### (3) 数据传输\n无论网络架构的哪一层发起通信，最终数据都必须通过最低的`物理层`传输，这是网络通信中唯一的物理通道。但`物理层`的传输单位是比特（`bit`，数据中的\
  \ `Binary 0` 或 `1` 代表一个比特）。`物理层`的基本功能是按照比特流的顺序，通过物理层接口和传输介质将数据传输到接收方的物理层。\n\n###\
  \ (4) 数据编码\n为了在`物理层`上高效、可靠地传输数据，最重要的是确保数据比特流可以通过相应的`channel`（通道）。这涉及`物理层`的数据编码功能，因为不同的传输介质支持不同类型的数据编码（如零返回编码、非零返回编码、曼彻编码、差分曼彻编码等）。\n\
  \n### (5) 数据传输管理\n`物理层`还具有一些数据传输管理功能，如数据传输流控、错误控制、物理线路激活和释放等。\n\n## 数据链路层\n\n数据链路层直接或间接地包含在计算机网络架构中（在`TCP\
  \ / IP Protocol Architecture`中，数据链路层的功能包含在网络访问层中）。\n\n数据链路层与其下方的物理层在本质上是相同的，即它们都用于构建网络接入的通道，只是`物理层`构建的是物理通道，而`data\
  \ link layer`构建的是真正用于数据传输的逻辑`channels`（通道）。正如此，在互联网上广泛使用的 `TCP / IP Protocol Architecture`中，`物理层`和`数据链路层`被分为网络访问层。\n\
  \n`data link layer`位于`network layer`的下层（在`TCP / IP Architecture`中称为`interconnect\
  \ layer`）。因此，其基本功能之一是为网络层提供透明、可靠的数据传输服务（在计算机网络架构中，下一层为上层提供服务）。`透明`意味着数据链路层对传输数据的内容、格式或编码没有限制；这意味着某些为了特殊目的设计的控制（后文将描述）可以作为普通数据传输；可靠传输确保数据能够无误地从发送端传输到目的地。总的来说，数据链路层（在此指\
  \ LLC 子层）的主要功能有四个：数据链路管理、封装成`frames`（帧）、透明传输和错误控制。\n\n## 网络层\n\n如果将`物理层`和数据链路层比作城内交通，那么本章描述的`network\
  \ layer`可以比作中转站、机场或码头，连接着不同的城市交通。正如中转站、机场或码头可以将乘客从另一个城市运送到下一站一样，`network 层`可以将数据从其他网络传输到目的地。\n\
  \n当源和目的位于不同的网络时，直接通信是不可行的，这时需要由`网络层`（在`TCP / IP Architecture`中称为`interconnect layer`）解决，这是网络架构中非常重要的一层。它还通过路由选择策略解决网络拥塞问题，从而提高网络通信的可靠性。`网络层`负责将数据包沿网络路径从源路由到目的地。为了实现这一目标，网络层必须知道子网的拓扑结构并选择合适的路径。同时，`网络层`必须仔细选择路由路径，以避免某些通信线路过载而其他线路空闲的情况。\n\
  \n之前介绍的物理层数据链路层构建了局域网内的通信线路，相当于城市内的交通线。本章描述的`网络层`是用于连接局域网线的节点，位于不同网络的边缘，相当于城市的边缘，用于连接不同的城市中转点。`网络层`是`OSI\
  \ reference model`中的第三层（对应`TCP / IP Protocol Architecture`中的第二层，`interconnect layer`），位于传输层和数据链路层之间。通常情况下，`网络层`的主要作用是实现两个网络系统之间的数据透明传输，包括路由、拥塞控制和互联网互联。`网络层`是端到端（即网络与网络之间）通信的最低层。它负责连接上方的资源子网（`OSI\
  \ reference model`中的传输层及以上四层），是面向网络通信的`OSI reference model`下三层中最复杂且关键的一层。\n\n`网络层`是计算机网络发展的产物，但它本身并不是计算机网络的产品。在计算机网络早期，基本上是独立的局域网，我们知道在\
  \ LAN 中，通过`物理层`构建的通信链路即可实现通信。但随着计算机网络的发展，人们发现需要连接这些孤立的局域网，从而产生了网络层……（注：由于原文后半部分存在大量重复和乱码，此处已根据网络技术逻辑完成核心含义翻译）。\n\
  \n\n\n\n\n![](img/image2833.jpg)\n\n\n\n\n# 第 5 章：机器学习与计算机网络\n\n在讨论机器学习在计算机网络中的应用之前，有必要详细了解机器学习、深度学习和人工智能。首先，人们经常会对这些定义感到困惑。`Artificial\
  \ intelligence`（人工智能）是计算机科学的一个分支，使计算机能够像人类一样思考。`Machine learning`（机器学习）是`Artificial\
  \ intelligence`的一个分支，通过提供大量数据，可以使计算机像人类一样思考。`Deep learning`（深度学习）是`Machine learning`的一个分支，使用复杂的算法进行文本、图像和人脸识别。这三项技术相互关联，可以帮助计算机网络运行得更好，并作为入侵检测系统发挥。为了更好地理解本书的内容，我们现在简要介绍机器学习、人工智能和深度学习。\n\
  \n## 人工智能的演变\n\n20 世纪 50 年代和 60 年代随着计算机的诞生，人工智能在大学实验室中悄悄出现。以`艾兰·图灵`（Alan Turing）提出的`图灵测试`（Turing\
  \ test）为标志，数学证明系统、`知识系统`（Knowledge-based systems）、`专家系统`（expert systems）以及人工智能的其他里程碑技术和应用突然引发了第一批研究者的关注。但当时，无论是计算机的计算速度还是相关的编程和算法理论，远不足以支持人工智能的发展需求。例如，1951\
  \ 年，计算机科学和人工智能的先驱`艾兰·图灵`发表了一篇国际象棋程序的论文，但当时的计算机无法进行此类复杂的计算。就像《探险大野中国》（Explorer Wild\
  \ China）一样，第一次踏上新大陆与真正使其繁荣之间存在巨大的差异。结果，从 20 世纪 60 年代后期开始，专业研究人员和普通大众对 AI 的热情迅速消退。\n\
  \n从 20 世纪 80 年代到 90 年代，我在卡内基·梅隆大学发明了不依赖于说话者的连续语音识别技术，并将其应用于`苹果计算机系统`（Apple Computer\
  \ Systems）——这是 AI 研究人员和产品开发者的黄金时代。我和其他同时代的研究人员放弃了传统的基于符号的技术，而基于统计模型的技术应运而出，在语音识别和机器翻译等领域取得了巨大进展。`人工神经网络`（Artificial\
  \ neural networks）也开始在模式识别等应用中取得突破，1997 年`深蓝`（deep blue）计算机击败`人类加里·卡斯罗夫`（Human Garry\
  \ Kasparov），让普通人大开眼界。但那个时代的技术进步还无法超过人们对智能机器的心理预期。在语音识别方面，统计模型虽然是语音识别技术的一大步，但还不足以让普通人接受。当时，我在`苹果`（apple）开发的语音识别\
  \ APP 更多是用于演示和促销，实际价值有限。总的来说，那波人工智能仍然带有浓厚的学术研究和科学实验色彩，虽然激发了公众的热情，但更像是一个在触底前的泡沫。它远没有符合商业模式和大众的需求。\n\
  \n## 深度学习的复兴\n\n准确地说，大约 2010 年左右，或者说从 2006 年开始，随着深度学习技术的成熟，计算机计算速度大幅提高，当然还有互联网时代积累的海量丰富数据，人工智能正走向另一条不同的复兴之路。在心理学上，人们接受新事物有一个心理阈值，就像人们感受外部刺激一样。外部刺激（如声音、光和电）的强度太小，人们无法感觉到任何东西；只有当外部刺激的强度超过人感知的最小量时，才会产生诸如“听到声音”和“看到东西”等确定感觉。这种最小刺激量在心理学上被称为`绝对阈值`（absolute\
  \ threshold），会导致人的感知和反应。这正是人工智能正在发生的事情。以图像识别为例，在人工智能早期，如果一个计算机程序声称它可以识别照片中的人脸，那是不可能的。随着技术的进步，当外部刺激的强度超过人感知的最小量时，就会产生确定的感觉，如“听到声音”和“看到东西”。这种最小刺激量在心理学上被称为`绝对阈值`（absolute\
