    2021 年 4 月，瑞士保险公司安联（AXA）宣布其已开始接受比特币作为人寿险外（受监管问题影响）所有保险业务的支付方式。在美国销售房屋和汽车保险的 Premier
    Shield Insurance 也接受比特币支付保费。如果你想在不直接接受加密货币的零售商处消费加密货币，可以使用加密货币借记卡，例如美国的 BitPay。


    ## 加密货币诈骗与加密骗局


    遗憾的是，加密货币犯罪正在上升。加密货币诈骗包括：


    **虚假网站**：虚假的网站，展示虚假的证言和加密货币术语，承诺只要你持续投资，就能获得巨额且有保障的回报。


    **虚拟庞氏骗局**：加密货币犯罪分子推广不存在的数字货币投资机会，并通过用新投资者的钱支付给老投资者来创造出巨额回报的幻象。一个诈骗项目 Bit Club
    Network 在 2019 年 12 月其大部分成员被起诉之前，已筹集了超过 7 亿美元。


    **“名人”背书**：诈骗者在网上伪装成亿万富翁或知名人物，承诺让你的虚拟货币投资翻倍，实际上却盗取你发送的资金。他们还可能使用即时通讯应用或聊天室散布某知名人士支持特定加密货币的传言。一旦他们鼓励投资者购买并推高价格，诈骗者就会卖出持股，货币价格随下跌。


    **情感诈骗**：联邦调查局（FBI）警告约会诈骗存在一种趋势，骗子说服在约会应用或社交媒体上认识的人投资或交易虚拟货币。FBI 网络投诉中心在 2021
    年前七个月内收到了超过 1800 份情感诈骗报告，损失达到 1300 万美元。此外，诈骗者伪装成合法的货币交易者或建立交易所来骗取金钱。另一种诈骗涉及针对加密货币账户的欺诈钓鱼。还有直接的攻击，犯罪分子进入数字钱包盗取。


    ## 加密货币安全性


    区块链描述了交易记录在“区块”中并时间戳的方法。这是一个相当复杂的过程，但结果是黑客难以篡改的交易数字账本。此外，交易需要双重认证。例如，你可能被要求输入用户名和密码来启动交易。然后，你可能需要输入通过短信发送到手机的验证码。虽然措施到位，但并不意味着加密货币是不可破解的。几起高额攻击已让加密货币初创公司损失惨重。黑客导致
    Coin Check 损失了 5.34 亿美元，Bit Grail 损失了 1.95 亿美元，使其成为 2018 年最大的两个加密货币攻击案。


    与政府支持的货币不同，虚拟货币的价值完全由供需驱动。这可能会导致剧烈波动，从而为投资者带来巨额收益或巨大损失。而且，加密货币投资受到的监管保护比股票、债券和共同基金等传统金融产品少得多。


    ## 安全投资加密货币的四个建议


    根据《消费者报告》，所有投资都带有风险，但一些专家认为加密货币是目前市场上风险较高的投资选择之一。如果你计划投资加密货币，这些建议可以帮助你做出明智的选择。


    研究交易所：在投资之前，先了解加密货币交易所。估计有 500 多个交易所可供选择。在进行之前，请做好研究、阅读评论并与他人交流。


    了解如何存储你的数字资产：如果你购买了加密货币，就必须存储它。你可以将其保存在交易所或数字钱包中。虽然有不同类型的钱包，但每种都有其优点、技术要求和安全性。作为交易所，你应该在投资前将其存储好。


    多元化投资：在投资时，多元化是良好策略的关键。不要仅仅因为知道它就把所有的钱都投入比特币。有很多选择，在几个品种之间进行多元化更好。


    准备应对波动：加密货币市场具有高度波动性，因此你会看到剧烈的波动。如果你的投资组合无法承受这些，那么加密货币可能不是你的选择。加密货币目前还可以，但请记住，它仍处于婴儿阶段，被认为具有高度投机性。投资新事物伴随着挑战，请做好准备。如果你计划参与，请做好研究并从保守投资开始。保持在线安全的最佳方法之一是使用全面的杀病毒软件。卡巴斯基网络安全防护你免受恶意软件感染、间谍软件、数据泄取的影响，并使用银行级加密保护你的在线支付。


    # 理解 NFT


    数字物品。例如数字艺术或音乐。NFT 被加密并存储在公共区块链上。一个代币不能与另一个交换，代币不能进一步分割。有许多不同类型的非同质化代币，它们可以在比特币和以太坊等著名的区块链上创建。


    非同质化（意味着独特的、不可替代的）代币（NFT）是代表某种数字物品的独特数字代码。例如，数字艺术或音乐。NFT 被加密并存储在公共区块链上。有许多不同类型的非同质化代币，它们可以在比特币和以太坊等著名的区块链上创建。


    ## 开启 NFT 所需要的


    无论你只是想在 NFT 市场逛逛，还是计划编写、编译和部署你自定义的智能合约，你都需要两个关键物品：


    一个 MetaMask 钱包，你可以在 `https://metamask.io/` 下载


    ## 10 个市场


    为了了解 NFT 的市场概况，请查看以下内容：


    1. OpenSea (`https://opensea.io/`)第一个且最大的。

    2. Axie (`https://axie.com/`)可以买卖游戏资产。

    3. NBA Shot (`https://nbashhot.com/`)官方瞬间。

    4. Rarible (`https://rarible.com/`)允许你创建并列出自己的物品的市场。

    5. Super Rare (`https://superrare.com/`)艺术家必须受邀请才能进入的选择性市场。

    6. Alcor (`https://alcor.exchange/nft-market`)可以买卖 NFT 的去中心化交易所。

    7. 币安 NFT 市场 (`www.binance.com/en/nft/`)在币安智能链上的通用市场（但也支持以太坊）。

    8. Foundation (`https://foundation.app/`)创作者可以在那里铸造和拍卖其艺术作品的平台。

    9. Crypto.com NFT (`https://crypto.com/nft/marketplace`)一个 NFT 拍卖网站。


