    Cryptocurrency received its name because it uses encryption to verify transactions.
    This means advanced coding is involved in storing and transmitting cryptocurrency
    data between wallets and public ledgers. The aim of encryption is to provide security
    and safety. The first cryptocurrency was Bitcoin, which was founded in 2009 and
    remains the best known today.


    Much of the interest in cryptocurrencies is to trade for profit, with speculators
    at times driving prices upward.


    ## How does cryptocurrency work?


    Cryptocurrencies run on a distributed public ledger called blockchain, a record
    of all transactions updated and held by currency holders. Units of cryptocurrency
    are created through a process called mining, which involves using computer power
    to solve complicated mathematical problems that generate coins. Users can also
    buy the currencies from brokers, then store and spend them using cryptographic
    wallets.


    If you own cryptocurrency, you don’t own anything tangible. What you own is a
    key that allows you to move a record or a unit of measure from one person to another
    without a trusted third party. Although Bitcoin has been around since 2009, cryptocurrencies
    and applications of blockchain technology are still emerging in financial terms,
    and more uses are expected in the future. Transactions including bonds, stocks,
    and other financial assets could eventually be traded using the technology.


    ## Cryptocurrency examples


    There are thousands of cryptocurrencies. Some of the best known include:


    ### Bitcoin

    Founded in 2009, Bitcoin was the first cryptocurrency and is still the most commonly
    traded. The currency was developed by Satoshi Nakamoto – widely believed to be
    a pseudonym for an individual or group of people whose precise identity remains
    unknown.


    ### Ethereum

    Developed in 2015, Ethereum is a blockchain platform with its own cryptocurrency,
    called `ETH` or Ethereum. It is the most popular cryptocurrency after Bitcoin.


    ### Litecoin

    This currency is most similar to Bitcoin but has moved towards innovations, including
    faster payments to allow more transactions.


    ### Ripple

    Ripple is a distributed ledger system that was founded in 2012. Ripple can be
    used to track different kinds of transactions, not just cryptocurrency. The company
    behind it worked with various banks and financial institutions. Stablecoins are
    stable.


    ## How to Buy Cryptocurrency


    You may be wondering how to buy cryptocurrency safely. There are steps involved:


    ### Step 1: Choosing a platform

    The first step is deciding which platform to use. Generally, you can choose between
    traditional brokers or dedicated cryptocurrency exchange. Traditional brokers
    are online brokers that offer ways to buy and sell cryptocurrency, as well as
    financial assets like bonds, and ETFs. These platforms tend to offer lower costs
    but fewer features.


    Cryptocurrency exchanges. There are many exchanges to choose from, offering different
    cryptocurrencies, wallet storage, interest options, and more. Many exchanges charge
    asset-based fees. When comparing different platforms, consider which cryptocurrencies
    are offered, what fees they charge, their features, storage and withdrawals, and
    any educational resources.


    ### Step 2: Funding your account

    Once you have chosen your platform, the next step is to fund your account so you
    can begin trading. Most exchanges allow users to purchase crypto using fiat currencies
    such as US Dollar, the British Pound, or the Euro – although this varies by platform.
    Crypto purchases with credit cards are considered risky, and some exchanges don’t
    support them. Some credit card companies don’t allow crypto transactions either.
    This is because cryptocurrencies are highly volatile, and it is not advisable
    to risk going into debt — or paying high credit card transaction fees — for certain
    assets. Some platforms will also accept ACH transfers and wire transfers. The
    accepted payment methods and time taken for deposits or withdrawals differ per
    platform. Equally, the time taken for deposits to clear varies by payment method.


    An important fact to consider is fees. These include potential deposit and withdrawal
    transaction fees plus trading fees. Fees will vary by payment method and platform,
    which is something to research at the outset.


    ### Step 3: Placing an order

    You can place an order via your broker’s or exchange’s web or mobile platform.
    If you are planning to buy cryptocurrencies, you can do so by selecting “buy,”
    choosing the order type, entering the amount of cryptocurrency you want to purchase,
    and confirming the order. The process applies to “sell” orders. There are also
    other ways to invest in crypto include payment services like PayPal, Cash App,
    and Venmo, which allow users to buy, sell, or hold. In addition there are:


    - **Bitcoin trusts**: You can buy shares of Bitcoin trusts with a regular broker.
    These vehicles give investment to crypto through the stock market.

    - **Bitcoin mutual funds**: There are Bitcoin mutual funds to choose from.

    - **Blockchain stocks or ETFs**: You can also invest in crypto through companies
    that are listed. The best option for you will depend on your goals and risk.


    ## How Cryptocurrency is Stored


    Once you have purchased cryptocurrency, you need to store it to protect it from
    hack or theft. Usually, cryptocurrency is stored in wallets, which are physical
    devices or software used to store the private keys to your assets. Exchanges provide
    wallets making it easy for you to store through the platform. However, not all
    exchanges or brokers automatically provide wallets. There are different providers
    to choose from. The terms “hot wallet” and “cold” are used:


    - **Hot wallet storage**: Hot wallets refer to crypto storage that uses online
    software to protect private keys.

    - **Cold wallet storage**: Unlike hot wallets, cold wallets (also known as hardware
    wallets) rely on offline devices to securely store your keys. Cold wallets tend
    to charge fees, while hot wallets don’t.


    ## What You Can Buy with Cryptocurrency


    When it was first launched, Bitcoin was intended to be a medium for daily transactions,
    making it possible to buy everything from a cup of coffee to a computer or bigticket
    items. That hasn’t quite materialized and, while the number of institutions accepting
    cryptocurrencies is growing, large transactions involving it are rare. Even so,
    it is possible to buy a wide variety of products from e-commerce websites using
    crypto. Here are some examples:


    ### Technology and e-commerce sites

    Several companies that sell products accept crypto on their websites, such as
    new egg.com, AT & T, and Microsoft. Overstock, an e-commerce platform, was among
    the first sites to accept Bitcoin. Shopify, Rakuten, and Home Depot also accept
    it.


    ### Luxury goods

    Some luxury retailers accept crypto as a form of payment. For example, online
    luxury retailer Btdials offers Rolex, Patek Philippe, and other high-end watches
    in return for Bitcoin.


    ### Cars

    Some car dealers – from mass-market brands to high-end luxury dealers – already
    accept cryptocurrency as payment.


