  trans: '

    加密货币之所以命名，是因为它使用加密技术来验证交易。这意味着在钱包和公共账本之间存储和传输加密货币数据涉及高级编码。加密的目的是提供安全和保障。第一种加密货币是比特币（Bitcoin），它成立于
    2009 年，至今仍然是最广为人知的货币。


    人们对加密货币的很大兴趣是为了交易获利，投机者有时会推高价格。


    ## 加密货币是如何工作的？


    加密货币运行在名为区块链的分布式公共账本上，这是一份由货币持有者更新并持有的交易记录。加密货币单位通过一种被称为“挖矿”的过程创建，这涉及到使用计算机算力解决复杂的数学问题以生成代币。用户也可以从经纪人处购买货币，然后使用加密钱包进行存储和消费。


    如果你拥有加密货币，你并不拥有任何实体。你拥有的是一个密钥，允许你在没有信誉第三方的情况下，将记录或计量单位从一个人转移到另一个人。虽然比特币自 2009
    年以来，但加密货币和区块链技术的应用在金融领域仍处于新兴阶段，预计未来会有更多用途。包括债券、股票和其他金融资产在内的交易最终可以使用该技术进行交易。


    ## 加密货币示例


    有数千种加密货币。其中一些广为人知的包括：


    ### 比特币

    比特币成立于 2009 年，是第一个加密货币，并且仍然是最常交易的货币。该货币由中本聪（Satoshi Nakamoto）开发——人们广泛认为这是一个身份尚不清楚的个人或群体的笔名。


    ### 以太坊

    以太坊开发于 2015 年，是一个区块链平台，拥有它自己的加密货币，被称为 `ETH` 或以太坊。它是比特币之后最流行的加密货币。


    ### 莱币

    这种货币与比特币最相似，但已转向创新发展，包括更快的支付速度以允许更多交易。


    ### Ripple

    Ripple 是一个成立于 2012 年的分布式账本系统。Ripple 可以用于跟踪不同类型的交易，而不只是加密货币。其背后的公司与各种银行和金融机构合作。稳定币（Stablecoins）是稳定的。


    ## 如何购买加密货币


    你可能好奇如何安全地购买加密货币。这涉及以下步骤：


    ### 第一步：选择平台

    第一步是决定使用哪个平台。通常，你可以在传统经纪人或专业的加密货币交易所之间进行选择。传统经纪人是提供买卖加密货币以及债券、ETF（交易所交易基金）等金融资产的在线经纪人。这些平台倾向于提供较低成本，但功能较少。


    加密货币交易所。有很多交易所可以选择，提供不同的加密货币、钱包存储、利息选项等。许多交易所按资产收取费用。在比较不同平台时，请考虑它们提供哪些加密货币、收取的费用、其功能、存储和提现情况以及任何教育资源。


    ### 第二步：为账户注资金

    一旦选择了平台，下一步是为账户注资金以便开始交易。大多数交易所允许用户使用法币（如美元、英镑或欧元）购买加密货币——尽管这因平台而异。使用信用卡购买加密货币被认为是有风险的，某些交易所不支持。某些信用卡公司也不允许加密货币交易。这是因为加密货币具有高度波动性，不建议为了某些资产冒冒债务风险——或支付高额的信用卡交易费。某些平台还接受
    ACH 转账和电汇转账。接受的支付方式以及存款或提现所需的时间因平台而异。同样，存款到账所需的时间随支付方式而异。


    一个需要考虑的重要事实是费用。这些包括潜在的存款和提现交易费用以及交易费。费用将随支付方式和平台而异，这是在开始阶段研究的。


    ### 第三步：下单

    你可以通过经纪人或交易所的网页或移动平台下单。如果你计划购买加密货币，可以通过选择“购买”、选择订单类型、输入你想购买的加密货币数量并确认订单来完成。该过程也适用于“卖出”订单。其他其他方式包括：


    ## 加密货币如何存储


    一旦你购买了加密货币，你需要存储它以防止黑客攻击或盗窃。通常，加密货币存储在钱包中，钱包是存储密钥的物理设备或软件。交易所提供钱包，方便你存储。然而，并非所有交易所或经纪人都自动提供钱包。有不同的供应商供选择。“热钱包”和“冷钱包”术语指的是：


    - 热钱包存储：热钱包指的是使用在线软件保护密钥的存储方式。

    - 冷钱包存储：与热钱包不同，冷钱包（称为硬件钱包）依赖离线设备来安全地存储你的密钥。

