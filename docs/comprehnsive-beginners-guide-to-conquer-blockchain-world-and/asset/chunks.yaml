  fmt: '

    # Digital art

    This category has enjoyed some of the highest selling prices and also represents
    the first NFT use case, which can be traced back to Kevin McCoy’s “Quantum” (minted
    2014). Many platforms now exist to allow anyone to mint an NFT of their digital
    art.


    # Sports collectibles

    Collectibles as NFTs represent the digital analogue of, say, traditional baseball
    cards and other sports memorabilia. NBA Top Shot, a platform for officially licensed
    and NFTized NBA collectibles, has enabled millions of dollars of sales and engendered
    a new generation of enthusiasts.


    # Game assets

    In-game assets (such as digital land, skins, and characters) are a perfect match
    for NFTs, having the highest sales volume of any other segment under the umbrella
    of digital collectibles.


    # Music

    Artists can now tokenize their music for direct distribution to fans. In many
    cases, fans can receive exclusive content and artwork that can’t be found anywhere
    else. In February of 2021, DJ and producer 3LA famously sold $12 million of NFTs.
    The offerings included a custom song, access to never-before-heard music, custom
    artwork, and new versions of existing songs.


    # Memes

    Old popular memes, such as Disaster Girl, Nylon Cat, and Overly Attached Girlfriend,
    have now been NFTized and sold for hundreds of thousands of dollars.


    ## Common NFT Minting Standards


    Most NFTs are created on the Ethereum blockchain based on widely accepted token
    standards to enhance composability and interoperability. The `ERC-721` standard
    is the original and most commonly used non-fungible token standard. Each NFT created
    with this token standard can be priced independently. `ERC-998` tokens allow developers
    to specify complex positions and trade rules using a single transfer of ownership.


    They can bundle several NFTs and fungible tokens like `ERC-20` in a single contract.
    You might think of an `ERC-998` token contract as a portfolio of assets or as
    a holding company for digital assets. `ERC-1155` tokens allow users to register
    fungible (`ERC-20`) and non-fungible (`ERC-721`) tokens using the same address
    and smart contract. This token standard was developed with games in mind, where
    fungible tokens could represent a transactional currency in a game, and the non-fungible
    items could represent in-game collectibles and in-game exchangeable assets.


    NFTs are also being minted on other popular blockchains, such as Solana and Flow.
    NFTs have even been created on the Bitcoin blockchain in the form of colored coins
    which have been used for many applications—such as transferring portraits, songs,
    and digital collectibles.


    ### Deploying an NFT smart contract in a nutshell


    Follow these steps to deploy your own token on Ethereum:


    - Log in to your wallet by clicking the Fox icon in your browser toolbar. Make
    sure you selected the correct account and network (use Ethereum when you’re ready
    to spend actual ETH to deploy your contract).

    - Point your browser to `remix.ethereum`. Set to “http” and not “https.”

    - Create and name a new file for your code.

    - Open this new file, and copy/paste the sample code provided at `openzeppelin.com/nft`.

    - Navigate to the Solidity Compiler pane and compile your code.

    - Navigate to the Deploy & Run browser pane and select Web3 from the environment
    dropdown.

    - Make sure you’re now connected to the appropriate network and deploy your compiled
    contract.


    ## What is blockchain technology? What makes it so important?


    Imagine a world where you can send money directly to someone without a bank –
    in seconds instead of days, and you don’t pay exorbitant bank fees. Or one where
    you store money in an online wallet not tied to a bank, meaning you are your own
    bank and have complete control over your money. You don’t need a bank’s permission
    to access or move it, and never have to worry about a third party taking it away,
    or a government’s economic policy manipulating it.


    This is not a world of the future; it is a world that growing number of early
    adopters live right now. And these are just a few of the important blockchain
    technology cases that are transforming the way we trust and exchange value. We’ll
    get into the rest later.


    ## Top 5 Best DeFi Projects & Coins to Buy


    With time comes growth, opportunity, and, most importantly, change. We saw this
    when DVDs were traded for streaming apps, when books were cast aside for tablets,
    and now, as cryptocurrencies are taking the place of traditional forms. Crypto
    is currently taking the financial world by storm and blockchain is growing fast.
    As a result, opportunities are met with wealth.


    But now, they are all focused on one thing—decentralized finance, or DeFi. DeFi
    has appeared as people are looking for ways to explore their finance. As such,
    decentralization into new trusts and services. Crypto built on blockchain could
    turn the financial world down.


    So, whether you are a crypto newbie in blockchain, you may want to know about
    DeFi and its future. This lists five major DeFi projects that will shape global
    and traditional views.


    # Top 5 DeFi Projects/Tokens by Market Cap


    ## #1. Colony: Best DeFi Project on Avalanche


    At the top of our list of DeFi projects is the Colony project. Colony is the first
    community-driven fund. This project has already received support and investment
    from the Avalanche Foundation, so it is essentially an Avalanche project. Simply
    put, Colony is an entourage of smart contracts that provide the framework for
    organization’s essential functions. Apart from funding, this project covers organizations’
    ownership, structure, and authority.


    So, how do you start? The first thing you need is tokens. DeFi applications, such
    as Colony, run on networks with their native tokens. You can identify these tokens
    through the ticker symbol used on exchanges. After you purchase the tokens, you
    will need to move them into a wallet you control that supports Colony. You will
    use the tokens to move the funds around. Still, you will want to choose a network
    with the lowest fees since moving funds incurs transaction fees.


    Also, be careful about the network by being sure you pick the right one. It is
    good to research so as not fall for a scam. On the network, you will encounter
    different types of services, the most popular of which is a decentralized exchange
    (DEX). You can also provide liquidity in exchange for earning interest or lend
    funds and charge interest. The possibilities are endless.


    All you need to do is connect your wallet that is compatible with DeFi protocols
    to the supported network and log in to your account.

    '
  trans: '


    # 数字艺术

    该类别一直拥有极高的销售价格，并代表了第一个 NFT 用例，这可以追溯到 Kevin McCoy 的《Quantum》（2014 年铸造）。现在已经有了许多平台允许任何人为自己的数字艺术铸造
    NFT。


    # 体育收藏品

    作为 NFT 形式的收藏品代表了类似于传统棒球卡和其他体育纪念品的数字类比物。NBA Top Shot 是一个官方授权并进行 NFT 化的 NBA 收藏品平台，它已实现数百万美元的销售额，并培养了新一代的爱好者。


    # 游戏资产

    游戏内资产（如数字土地、皮肤和角色）是 NFT 的完美结合，在数字收藏品类别下的任何其他板块中，其销量最高。


    # 音乐

    艺术家现在可以将他们的音乐代币化并直接分发给粉丝。在许多情况下，粉丝可以获得在其他地方都找不到的独家内容和艺术作品。2021 年 2 月，DJ 和制作人 3LA
    著名地卖出了价值 1200 万美元的 NFT。这些产品包括一首定制歌曲、从未听过的音乐访问权限、定制艺术品以及现有歌曲的新版本。


    # 迷因（Memes）

    旧的热门迷因如灾难女孩（Disaster Girl）、尼龙猫（Nylon Cat）和过度恋女友（Overly Attached Girlfriend）现在已经
    NFT 化并以数十万美元出售。


    ## 常见的 NFT 铸造标准


    大多数 NFT 在以太坊区块链上基于广泛接受的代币标准创建，以增强组合性和互操作性。`ERC-721` 标准是最原始且常用的非同质化代币标准。使用此代币标准创建每个
    NFT 都可以独立定价。`ERC-998` 代币允许开发者通过单次所有权转移指定复杂的权限和交易规则。


    它们可以将多个 NFT 和像 `ERC-20` 这样的同质代币封装在单个合约中。你可以将 `ERC-998` 代币合约视为资产组合或数字资产的控股公司。`ERC-1155`
    代币允许用户使用相同的地址和智能合约注册同质化（`ERC-20`）和非同质化（`ERC-721`）代币。该代币标准开发时考虑了游戏，在游戏中，同质化代币可以代表交易货币，而非同质化物品可以代表游戏内收藏品和游戏内可交换资产。


    NFT 也在其他流行的区块链上铸造，如 Solana 和 Flow。NFT 甚至在比特币区块链上以彩色币（colored coins）的形式被创建，它们已用于许多应用——例如传输肖像、歌曲和数字收藏品。


    ### 简述部署 NFT 智能合约


    按照以下步骤在以太坊上部署你自己的代币：


    - 点击浏览器工具栏中的狐狸图标，登录你的钱包。确保你选择了正确的账户和网络（当你准备好花费实际 ETH 来部署你的合约时，请使用以太坊）。

    - 将你的浏览器指向 `remix.ethereum`。设置为“http”而不是“https”。

    - 为你的代码创建并命名一个新文件。

    - 打开此新文件，并复制/粘贴位于 `openzeppelin.com/nft` 提供的示例代码。

    - 导航到 Solidity 编译器面板并编译你的代码。

    - 导航到 Deploy & Run 浏览器面板，并从环境下拉菜单中选择 Web3。

    - 确保你现在已连接到相应的网络并部署你编译的合约。


    ## 什么是区块链技术？它为什么如此重要？


    想象一个世界，你可以直接向某人发送资金而无需银行——只需几秒钟而不是几天，而且你不需要支付昂贵的银行手续费。或者你将钱存储在不与银行关联的在线钱包中，这意味着你就是自己的银行并对资金有完全控制权。你不需要银行的许可即可访问或移动资金，也永远不必担心第三方夺走它或政府的经济政策对其进行操纵。


    这不是未来的世界；这是一个越来越多的早期采用者现在就生活的世界。这些只是改变我们信任和交换价值方式的一些重要区块链技术案例。我们稍后会介绍其余。


    ## 前 5 大最佳 DeFi 项目和值得购买的币


    随着时间的推移带来了增长、机会，最重要的是变化。我们在 DVD 被流媒体应用取代时看到过，当书籍被平板电脑抛弃时看到过，而现在，随着加密货币取代传统形式。加密货币目前正在席卷金融世界，区块链正在快速增长。结果是，机会与财富并存。


    但现在，他们都集中在一个点上——去中心化金融，或 DeFi。当人们寻找探索自己财务的方式时，DeFi 出现了。因此，去中心化产生了新的信任和服务。建立在区块链上的加密货币可能会彻底改变金融世界。


    所以，无论你是否是区块链新手，你可能都想了解 DeFi 及其未来。这里列出了五个将塑造全球和传统观点的大型 DeFi 项目。


    # 市划分的前 5 大 DeFi 项目/代币


    ## #1. Colony: Avalanche 上最佳 DeFi 项目


    我们 DeFi 项目列表顶端是 Colony 项目。Colony 是第一个社区驱动的基金。该项目已经获得了 Avalanche 基金的支持和投资，因此它本质上是一个
    Avalanche 项目。简单来说，Colony 是一组智能合约，为组织的本质功能提供框架。除了资金，该项目还涵盖了组织的所有权、结构和权限。


    那么，如何开始？你首先需要代币。DeFi 应用（如 Colony）运行在带有原生代币的网络上。你可以通过交易所使用的代币代码识别这些代币。购买代币后，你需要将它们移动到你控制的支持
    Colony 的钱包中。你将使用这些代币转移资金。尽管如此，你仍希望选择手续费最低的网络，因为移动资金会产生交易费用。


    此外，要小心网络，确保你选择了正确的网络。做好研究以避免陷入诈骗。在网络上，你会遇到不同类型的服务，其中最流行的是去中心化交易所（DEX）。你也可以提供流动性以换取利息，或者贷款资金收取利息。可能性是无限的。


    你只需要将与 DeFi 协议兼容的钱包连接到支持的网络并登录你的账户即可。


