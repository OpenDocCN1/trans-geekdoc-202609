    5,000 credit card transactions per second with the ability to process much more
    if needed. Visa, for example, can process up to 24,000 transactions per second.
    But achieving scalability often comes at the expense of decentralization. EOS,
    for example, promises a maximum of 4000 TPS but has come under criticism for being
    too centralized.


    ## Security


    Security is the ability of a blockchain to be protected from attacks. Unfortunately,
    exchanges and source code has been hacked on many occasions, suggesting that many
    developers focus on scalability and decentralization at the expense of security.


    ## What Is the Difference Between Bitcoin and Ethereum Blockchain?


    Bitcoin and Ethereum are the two biggest cryptocurrencies and blockchains, so
    discussing and comparing them makes sense.


    ### Bitcoin Basics


    The Bitcoin network is a public, decentralized peer-to-peer payment network that
    allows users to send and receive bitcoins without a bank getting involved. The
    digital currency or bitcoin token uses the ticker symbol BTC, and is the only
    cryptocurrency traded on the Bitcoin network. Transactions are recorded using
    a digital ledger, and nodes ensure the `PoW` consensus mechanism is followed (or
    that mining happens).


    For many, Bitcoin seems complicated, but it isn’t when you view it as a combination
    of three things:

    - A peer-to-peer payment system: You can send money (`BTC`) from one person or
    company to another without the need for a bank. Sending this way is faster, more
    secure, and cheaper than traditional methods.

    - A decentralized system like the internet so it’s not controlled by entity and
    cannot be stopped by third party. A store of value like gold (often called digital
    gold), but much easier to transfer than gold.


    ### Ethereum Basics


    In 2013, after meeting with Bitcoin and discovering Bitcoin’s limits Vitalik decided
    to build upon Bitcoin and built Ethereum. The Ethereum network is a public decentralized
    peer-to-peer network. Like Bitcoin, it uses nodes and allows users to send and
    receive cryptocurrency—in this case, Ether. The network is much more than a payment
    system—it was created for decentralized applications (dapps) and smart contracts.
    Dapps are decentralized apps or computer programs that interact with the blockchain.
    Smart contracts, however, operate on the Ethereum blockchain and are contracts
    that automatically execute without an intermediary once conditions (written into
    computer code) are met. For example, a smart contract could be programmed to send
    a designated person a portion of your Bitcoin when you die.


    ## Ethereum vs. Bitcoin Blockchains


    In summary, Bitcoin and Ethereum networks are public decentralized peer-to-peer
    networks with their own tokens: bitcoin and ether. Both on cryptography, and both
    use digital ledger technology. For a complete Ethereum vs. Bitcoin match check
    our deep dive: Ethereum Vs Bitcoin: What’s the Difference? But they differ significantly
    in purpose and capability.


    Bitcoin is a decentralized payment system and a store of value. Its blockchain
    a database of all bitcoin transactions and tracks their ownership. Ethereum is
    more than a payment system and allows smart contracts and apps to be built on
    it, making it a more sophisticated blockchain.


    ## What Are the Benefits of Blockchains Over Traditional Finance?


    ### Trustless


    The blockchain is immutable and automates trusted transactions between counterparts
    who do not need to know each other. Transactions are only executed when programmed
    conditions are met by both parties.


    ### Unst


    Once the conditions programmed into a blockchain protocol are met, an initiated
    transaction cannot be undone, changed, or stopped. It’s going to execute without
    bank, government, or third party.


    ### Immutable


    Records on blockchain cannot be changed or deleted—Bitcoin has never been hacked.
    A new block of transactions is only added after a complex mathematical process
    is verified. Each block has a cryptographic information resulting from blocks
    being added to it.


    ### Decentralized


    No single entity maintains the network. Unlike banks, decisions on blockchain
    are made via consensus. Decentralization is easier people can easily access and
    build on platform and there are multiple points of failure.


    ### Lower Cost


    In traditional finance, you pay banks to process transactions. The blockchain
    eliminates intermediaries and reduces fees returning fees to stakeholders.


    ### Peer-to-Peer


    Cryptocurrencies like Bitcoin let you send money directly anywhere in the world
    without a bank charging transaction or handling fees.


    ### Transparent


    Public blockchains are open-source software, so anyone can access them to view
    transactions and their source code. They can even use the code to build new applications
    and suggestions. Suggestions are accepted or rejected via consensus.


    ### Universal Banking


    2 billion people globally not have a bank account. Because anyone can access the
    blockchain to store money, it’s a great way to bank the unbanked and protect against
    theft that can happen due to holding cash in physical locations.


    ## What Are the Disadvantages of Blockchains?


    Public open source blockchains are not without hazards and challenges. Here is
    a list of the top concerns:


    ### Environmental Impact


    Blockchain networks like Bitcoin use a lot of electricity to validate transactions,
    leading to environmental concerns. For example, Bitcoin consumes more electricity
    than a small, medium-sized European country, and Bitcoin mining is threatening
    China’s climate change goals. However, many would argue that Bitcoin is held to
    higher environmental standards than anyone and anything. This may be true, especially
    if you consider that the blockchain and Bitcoin are an alternative to the traditional
    finance system that uses much more electricity and has a much larger impact. Some
    suggest Bitcoin consumption is less than half of traditional banking for (this
    is already happening). Galaxy Digital suggests mining shifting to renewable energy
    like solar and geothermal (using volcanoes).


    ### Personal Responsibility


    One of blockchains and cryptocurrencies’ most significant advantages is also its
    biggest weakness. When you invest in public open source blockchains by mining
    or buying cryptocurrencies and store it in your cryptocurrency wallet, only you
    control your money. If you lose your seed phrases – the list of words that give
    you access to recover your wallets – there is no resource (compared to banks where
    you can reset your password).'
