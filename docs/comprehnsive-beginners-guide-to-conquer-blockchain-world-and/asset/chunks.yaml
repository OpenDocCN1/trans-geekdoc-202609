    Even though public blockchains remain more efficient than traditional banking
    systems, decentralization comes at the cost of scalability. Trying to grow blockchain
    networks to global capacity, in turn, is the root cause of speed inefficiencies.
    It’s why, as we saw, Bitcoin and Ethereum can only process a maximum of seven
    and 30 transactions, respectively, compared to Visa’s 24,000.


    Luckily solutions are being built to improve scalability and the speed of transactions.
    For example, the `lightning network` allows transactions to happen off the Bitcoin
    blockchain to speed up transactions. On Ethereum, many innovative Layer 2 (L2)
    solutions are being developed to improve scalability and speed including rollups,
    zero-knowledge proofs and sidechains.


    ## False Narratives


    Some cryptocurrencies are undoubtedly used in unlawful activity. The most famous
    example is Silk Road: people laundered money and bought drugs on the platform
    using Bitcoin. However, this is no different from the illegal activity that constantly
    happens when people use other currencies like the Dollar.


    This false narrative that cryptocurrencies are only or mainly used for illicit
    activities only delays their inevitable adoption, which can greatly benefit everyone,
    including the financial system. Promising Blockchain Use Cases and Killer Applications


    For an more in-depth discussion of the most interesting and disruptive blockchain
    use cases as of 2021 check our guide: `Disruptive Blockchain Technology Use Cases
    2021`


    Blockchain technology is currently used across various industries like supply
    chain, healthcare, retail, media and advertising, financial services, insurance,
    travel and transportation, oil and gas, and gaming. Here are some promising use
    cases:


    ### Cryptocurrencies

    The ‘killer app’ of blockchains today is internet money. Cryptocurrencies let
    you transfer value faster and cheaper across borders without a bank. Besides Bitcoin
    and Ethereum, other digital currency examples include Polkadot (`DOT`), `NEO`,
    Cardano (`ADA`), Tether (`USDT`), Binance Coin (`BNB`), and Litecoin (`LTC`).


    ### Smart Contracts

    These blockchain applications are contracts that automatically execute without
    an intermediary once conditions written into the computer code are met.


    ### Decentralized Banking

    The use of blockchain technology is also proliferating in banking. For example,
    many banks like Barclays, Canadian Imperial Bank, and UBS are interested in how
    blockchain can make their back-office settlement more efficient.


    ### Games/Art

    You may heard Crypto Kitties—a game launched on Ethereum. One of virtual pets
    was sold for over $100,000.


    ### Peer-to-peer Trading

    People buy or sell directly without an intermediary.


    ### Supply chain and logistics

    Blockchain is being used to track precious metals origins. For example, Walmart
    and IBM worked together to create traceability systems based on ledger making
    it easier to trace.


    ### Healthcare processes

    Blockchain can be used to improve health records patients store and share medical
    data.


    ### Real estate processing

    Property records can be stored and verified on blockchain. These records cannot
    be tampered with so you can trust they accurate and easily verify property.


    ### NFT markets

    These are marketplaces that allow you to buy non-fungible tokens (`NFTs`): digital
    tokens of things like paintings.


    ### Music payments

    Blockchain can trace music streams and immediately pay those who contributed to
    a song.


    ### Anti-money tracking system

    Authorities can easily track the original source of money because every transaction
    on the blockchain is recorded and leaves behind a tamper-proof trail.


    ### Identity security

    Traditional systems for storing identities are insecure and fragmented. Blockchain
    provides a unified, immutable, and interoperable infrastructure so you can store
    and manage records securely and efficiently.


    ### New insurance distribution methods

    For example, peer-to-peer insurance, parametric insurance, and micro insurance.


    ### Automated advertising campaigns

    Advertisers can use smart contracts to automate advertising campaigns, e.g., an
    audience is only shown when specific criteria are met.


    ## How to Invest in Blockchain Technology


    With blockchain offering some promising use cases, helping many companies become
    more efficient, and attracting big companies like Amazon and Tesla, it can be
    an attractive investment. But there are risks: It’s a new technology, and many
    projects will not run out. So, invest only what you can afford to lose, do your
    own research to determine if the project (or coin offering) is worth investing
    and what you want.


    For example, you can get more exposure investing cryptocurrencies directly in
    an exchange-traded fund (`ETF`). That being are ways you can invest in the blockchain
    depending on your goals:


    Buy shares in companies (e.g., Visa, Walmart) on traditional exchanges like `NYSE`.
    Buy shares using an online broker such as Vanguard and Betterment. Invest in companies
    with balance sheet, e.g., Square, Workday, Strategy, and Tesla. Buy cryptocurrencies
    like Bitcoin or Ethereum on decentralized (`DeFi`) exchanges.


    With centralized exchanges, you don’t have your own private keys, and the exchange
    is for storing your funds. Decentralized exchanges are peer-to-peer, and there’s
    no intermediary. Examples of `CeFi` exchanges include Binance, Kraken, Bitrex,
    Luno, and Coinbase. Examples of `DeFi` exchanges include Uniswap, KyberSwap, Airswap,
    Sushwap, Binance, and Total.


    Invest in exchange-traded funds (`ETF`). ETFs are a basket of securities that
    track asset or index you can buy or sell on an exchange throughout the day. For
    example, many traditional ETFs include bonds, commodities, and stocks and track
    the S&P 500 Index. In the crypto space, you get a variety of ETFs you can invest
    in, such as a Bitcoin ETF that tracks the price of Bitcoin. Each will differ depending
    who issues it. Companies that offer ETFs include GrayScale, Galaxy Digital, and
    Gemini. Invest in crypto mining companies such as Riot, Hive, and Marathon. Many
    mining companies let investors participate directly by offering equity in their
    companies. To invest in Riot, use an American-based online broker like Robinhood.


    To invest in Hive and Marathon, use a Canadian-based broker like Questrade, TD
    Direct Investing, or BMO Investor Line. Buy crypto hardware and mine cryptocurrency
    yourself. While Bitcoin mining requires a large capital outlay, there are other
    tokens you can mine for a reasonably low barrier to entry. For example, Helium
    miners cost roughly $500 and mint HNT using the `proof of coverage` consensus
    protocol to verify new blocks.


    Get started with cryptocurrency mining by reading our short guide on Bitcoin mining.
    Invest in mining pools. An alternative to mining cryptocurrency yourself is to
    join a mining pool. Mining pools pool together the computational power of others
    on the network to improve the chances of mining a block. The rewards for all blocks
    mined are shared among miners in the pool. Slush Pool is a popular mining pool.


    ## Companies to Invest In

