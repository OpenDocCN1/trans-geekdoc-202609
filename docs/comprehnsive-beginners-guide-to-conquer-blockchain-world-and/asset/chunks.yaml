  trans: '


    这是一份值得投资的公共区块链公司综合清单。我们根据以下类别对其进行了分类：银行、供应链、医疗保健、能源、保险、旅游、房地产、交易所和挖矿。这些上市公司要么在使用区块链技术，要么在资产负债表中持有加密货币，允许你交易加密货币，或者正在挖掘加密货币。


    从技术上来说，币安（Binance）并不是一家上市公司，但你可以通过购买其数字货币（BNB）来对其投资。你可以使用他们的货币支付交易所的交易费用和手续费。对于
    Uniswap、Inch 和 Pancake Swap 等 DeFi 交易所也是如此。


    ## 传统金融与区块链投资策略


    在某些方面，投资股票和加密货币的过程是相同的。首先，你可以像通过在线经纪购买股票一样在交易所购买加密货币。其次，你还可以将传统的投资原则应用于加密货币和区块链。例如，无论价格如何，你每个月都可以向比特币投入相同金额（定投平均法），以消除投资过程中的任何情绪。


    但也存在区块链和加密货币特有的投资策略，例如收益耕作（yield farming）。继续阅读以了解在投资公共区块链公司和加密货币时可以使用的十种常见的传统金融和区块链投资策略。


    ## 10 大主要投资策略概述


    ### 增长投资

    投资者寻找增长率高于平均水平的公司。使用这种策略的投资者即使在股票看起来很贵时通常也会投资。为了缩小搜索范围，请关注目前表现良好或历史表现良好的行业。随着区块链技术市场规模的预期增长，会有几具有增长潜力的公司。


    ### 价值投资

    投资者寻找被低估的公司，例如，其价格未能完全反映其价值。成功的价值投资通常要求你长期持有股票。


    ### 股息增长投资

    投资者投资于有分红历史的公司。你可以查看公司的财务报表查看他们是否支付分红。寻找收益率在 2-6% 之间的公司。


    ### 指数投资

    这更像是一种谨慎且被动的投资策略，但指数投资者的表现通常优于活跃交易者。这些投资者通常投资指数基金。指数基金由投资者的资金组成，由基金经理管理，并自动投资于特定指数（如标普
    500 指数）中的公司，以有效跟踪指数的表现。


    它与 ETF 的不同在于，你只能在收盘时买卖指数基金，而不能全天候交易。加密货币指数基金的一个例子是 Bitcoinwise 10。


    ### 日内交易

    日内交易是一种更活跃、更短期的交易。投资者在全天频繁交易，以捕捉小幅波动获利。日内交易者将使用技术来开发关于市场如何移动的思路。由于波动性大，日内交易具有风险。


    ### 算法交易

    被称为自动交易，这种策略涉及使用计算机根据价格、时间等参数执行交易。美国市场很大一部分是比特币的自动交易。


    ### 反向投资

    反向投资者违背市场趋势而行。在人们卖出时买入，在人们买入时卖出。遵循比特币恐恐指数，你可以通过相反的操作获得丰厚利润：在人们恐惧时买入并卖出。


    ### 套利

    这种策略利用市场之间的价格差异。你在一个市场购买，然后以更高的价格卖出。由于加密货币在不同国家经常不同，这种策略提供了巨大的机会。简而言之，交易者在一个交易所购买加密货币（价格较低），然后将其转移到本地交易所并高价出售。


    根据业务报告，使用正确的投资平台，每笔交易可以获得 2-4% 的利润。只需确保你遵守外汇管制法，因为跨境移动货币的通常有限制。


    ### 收益耕作

    这种特定的区块链投资策略涉及通过智能合约将你的加密货币借给他人。承租人支付服务费作为回报。收益农民经常在不同的借贷平台之间移动他们的加密货币以实现收益最大化。收益耕作平台包括
    Compound Finance、Aave 和 Market DAO。了解更多 DeFi 收益耕作。


    ### 多元化

    分散你的风险并投资不同的资产和公司，在限制整体风险的同时增加赚钱的机会。多元化不仅仅是一种投资策略；它还是大多数金融专家和经纪人鼓励的智能投资方式。这种策略对于传统金融和加密货币都有效。在国际市场上，你可以在债券、货币市场和股票之间分散风险——甚至通过跨行业投资来实现投资组合多元化。


    对于加密货币和区块链，你可以投资不同的公共区块链公司以及不同用途的加密货币，如比特币（支付）、以太坊（智能合约）和 XRP（跨境）。如果你真正理解这项技术


    # 加密货币——意义与定义


    加密货币（有时被称为 crypto）是以数字或虚拟形式存在的任何货币，使用密码学来确保交易安全。加密货币没有中央发行或监管机构，而是使用去中心化系统来记录交易。


    加密货币存储在数字钱包中。


