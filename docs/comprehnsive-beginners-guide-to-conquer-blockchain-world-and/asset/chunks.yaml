    尽管公共区块仍然比传统的银行系统更高效，但去中心化是以扩展性为代价的。试图将区块链网络扩展到全球容量，反过来是速度低效的根源。正如我们所看到的，比特币和以太坊最多只能分别处理
    7 笔和 30 笔交易，而 Visa 的数字则是 24,000 笔。


    幸运的是，目前正在建立解决方案来提高扩展性和交易速度。例如，`lightning network` 允许在比特币区块链之外进行交易以加快处理速度。在以太坊上，许多创新的
    Layer 2（L2）解决方案正在开发中，以提高扩展性和速度，包括汇总（rollups）、零知识证明和侧链。


    ## 错误叙述


    某些加密货币无疑被用于非法活动。最著名的例子是丝绸之路（Silk Road）：人们在该平台上使用比特币洗钱和购买药物。然而，这与人们使用美元等货币时不断发生的非法活动并没有区别。


    这种认为加密货币仅或主要用于非法活动的虚假叙述只会推迟它们不可避免的采用，而采用可以极大造福包括金融系统在内的每个人。极具前景的区块链用例和杀手级应用


    要深入讨论 2021 年最有趣且具破坏性的区块链用例，请查看我们的指南：`Disruptive Blockchain Technology Use Cases
    2021`


    区块链技术目前已应用于各个行业，如供应链、医疗保健、零售、媒体广告、金融服务、保险、旅游运输、油气以及游戏。以下是一些极具前景的用例：


    ### 加密货币

    今天区块链的“杀手级应用”是互联网货币。加密货币让你无需银行即可更快、更便宜地跨境转移价值。除了比特币和以太坊，其他数字货币示例包括 Polkadot (`DOT`)、`NEO`、Cardano
    (`ADA`)、Tether (`USDT`)、币币 (`BNB`) 和比特币币 (`LTC`)。


    ### 智能合约

    这些区块链应用是合约，一旦满足计算机代码中的条件，就会自动执行，无需中间介。


    ### 去中心化银行

    区块链技术在银领域也在普及。例如，巴克莱银行（Barclays）、加拿大帝国银行（CIBC）和瑞讯银行等许多银行对区块链如何让其后台结算更高效感兴趣。


    ### 游戏/艺术

    你可能听说过 Crypto Kitties——一个在以太坊上推出的游戏。其中一个虚拟宠物的售价超过了 100,000 美元。


    ### 点对交易

    人们直接买卖，无需中间介。


    ### 供应链与物流

    区块链正用于追踪贵金属的来源。例如，沃尔和 IBM 合作创建了基于账本的可追溯系统，使其更容易追踪。


    ### 医疗流程

    区块链可用于改进患者存储和共享医疗数据的健康记录。


    ### 房地产处理

    房产记录可以存储并验证在区块链上。这些记录无法被篡改，因此你可以信任它们的准确性并轻松地验证物业。


    ### NFT 市场

    这些是允许你购买非同质化代币 (`NFTs`) 的市场：例如绘画等物品的数字标记。


    ### 音乐支付

    区块链可以追踪音乐流并立即支付给对歌曲做出贡献的人。


    ### 反洗钱追踪系统

    当局可以轻松追踪资金的原始来源，因为区块链上的每笔交易都被记录并留下了不可篡改的轨迹。


    ### 身份安全

    存储身份的传统系统是不安全且碎片化的。区块链提供了一个统一、不可变且可操作的基础设施，以便你可以安全高效地存储和管理记录。


    ### 新型保险分销方法

    例如，点对点保险、参数保险和微型保险。


    ### 自动化广告活动

    广告商可以使用智能合约自动化广告活动，例如，只有在满足特定标准时才向观众展示


    ## 如何投资区块链技术


    由于区块链提供了一些充满前景的用例，帮助许多公司变得更高效，并吸引了亚马逊和特斯拉等大公司，它可以成为一种极具吸引力的投资。但存在风险：这是一项新技术，许多项目将无法生存。因此，只投入你亏得起的资金，进行自己的研究以确定该项目（或代币发行）是否值得投资以及你的需求。


    例如，你可以通过直接在交易基金 (`ETF`) 中投资加密货币来获得更多机会。这些是你根据自己的目标投资区块链的方法：


    在 `NYSE` 等传统交易场所买入公司（如 Visa、沃尔和）的股票。使用 Vanguard 和 Betterment 等在线经纪商购买股票。投资拥有资产负债表的公司，例如
    Square、Workday、Strategy 和特斯拉。在去中心化 (`DeFi`) 交易所购买比特币或以太坊等加密货币。


    对于中心化交易所，你没有自己的私钥，交易所是存储你资金的地方。去中心化交易所是点对点的，没有中间介。`CeFi` 交易所示例包括币安、Kraken、Bitrex、Luno
    和 Coinbase。`DeFi` 交易所示例包括 Uniswap、KyberSwap、Airswap、Sushwap、币安和 Total。


    投资交易基金 (`ETF`)。ETF 是追踪资产或指数的证券篮，你可以在交易所全天进行买卖。例如，许多传统 ETF 包含债券、大宗商品和股票，并追踪标普 500
    指数。在加密领域，你可以投资各种 ETF，例如追踪比特币价格的比特币 ETF。每种 ETF 将根据发行者而异。提供 ETF 的公司包括 GrayScale、Galaxy
    Digital 和 Gemini。投资 Riot、Hive 和 Marathon 等加密挖矿公司。许多矿矿公司通过提供公司股权让投资者直接参与。要投资 Riot，请使用
    Robinhood 这样的美国在线经纪商。


    要投资 Hive 和 Marathon，请使用 Questrade、TD Direct Investing 或 BMO Investor Line 等加拿大经纪商。购买加密硬件并自己挖掘加密货币。虽然比特币挖矿需要大量的资金投入，但还有其他你可以以相对较低门槛挖掘的令牌。例如，Helium
    矿机约为 500 美元，使用 `proof of coverage` 共识协议通过 HNT 来验证新区块。


    通过阅读我们关于比特币挖矿的简短指南开始加密挖矿。投资矿池。自己挖掘加密货币的替代方案是加入矿池。矿池汇总网络上其他人的计算力以增加挖掘区块的概率。所有挖掘区块的奖励将在矿池中的矿工之间共享。Slush
    Pool 是一个流行的矿池。


    待投资的公司


