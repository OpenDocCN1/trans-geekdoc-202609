  trans: '

    Colony 已与 Avalanche 建立了联系，并预计将共享交易机会，为在在该平台上构建项目奠定基础。该项目的主要特点是基于社区的。此外，它还包含一个监管框架，允许投资者熟悉
    Avalanche 生态系统，从而通过新的市值刺激其增长。从项目开始，该项目就获得了一个初始社区。


    此外，它将与 Avalanche 以及生态系统中的其他关键参与者合作。需要记住，Avalanche 的生态系统是为了 DeFi 开发的。Colony 项目将通过完全去中心化的交易所和民主化的金融世界帮助实现
    Avalanche 的愿景。其中一个原因是， Colony 为 Avalanche 网络上的新型去中心化应用提供了一个激励基础。


    虽然资金至关重要，但 Colony 的成功取决于营销、势头、技术专家和人脉网络。此外，Colony 会产生适当的维持和价值，因为其投资将通过空投、质押奖励和回购机制回馈社区。现在，Colony
    有两个互补的支柱。第一个是评估此前机构及其投资者无法接触的早期交易。


    Colony 的核心团队将执行该项目严格的投资流程，该团队由加密行业的专家组成。因此，这些股权专家将使用严格的分析报告审查并评估有潜力的项目。接下来，Colony
    的投资公司网络将通过让 Avalanche 协议上的构建者做好市场准备来提高资金效率。


    因此，一旦项目完成第一阶段，它将不必再担心筹集资金，而是专注于开发。第二个支柱是 DAO（去中心化自治组织）。其主要目标是深化 Avalanche 生态系统内的流动性，并使用质押来增强网络的健康安全。这一支柱还旨在通过专门的索引捕捉
    Avalanche 增长的 DeFi 资产。


    总体而言，Colony Bridge 接了 DeFi 和传统金融，通过其社区利用 Avalanche 网络上的价值创造。其初始索引发售（IDO）计划于 2021
    年第四季度进行。因此，CryptoMint Capital 与 Colony Lab 建立了投资者合作伙伴关系。他们最近推文中提到：“Avalanche 生态系统正在增长，Colony
    Lab 为生态系统提供资金。”


    ## 2. Aave: 去中心化金融平台


    Aave 是另一个去中心化金融平台，用户可以在那里借贷各种加密货币。该平台通过池实现的智能合约促进点对借贷。人们寻求出借加密货币以赚利息，或为了此进行借贷。Aave
    构建在以太坊上。智能合约管理所有资产，用户依靠一系列算法和网络来运行。


    你不再需要仅仅信任银行或金融机构来照顾你的资金


    ### 特性


    Aave 旨在让金融服务更易获得，这意味着你可以在没有银行、经纪监管的情况下进行借贷。总之，你正在投资拥有话语权的技术。目前，该平台有 26 种不同的加密货币可以存款以赚利息，25
    种可以借贷。存款和借贷的一些选项包括 ETH、LINK 和 LEND 等。


    值得知道，大多数加密都是像 USDC 这样的稳定币。在 Aave 网站上，你可以看到每种加密货币的借贷利率。本质上，Aave 使用算法根据利用率建立当前费率。例如，如果池中剩下的加密货币不多，利率就会高，这样更多人就可以存款加密货币。


    另一方面，如果任何加密货币被利用，利率就会低，这样更多人就可以借贷。Aave 有两种不同的 DeFi 代币。第一个是 `AAVE`，它是 Aave 协议的原生治理代币。当你购买
    `AAVE` 代币时，等同于购买公司的股票。因此，你可以对可能改变协议方向的改进提案投票。


    第二个 Aave 代币是 `aTokens`，它们是贷款者用于收集存款利息的计息代币。利息直接在你的钱包中积累，这些代币与你存款资产的价值按 1:1 的比例挂。在
    Aave 上可以获得的最流行的贷款之一是闪电（flash loan），你可以用它利用加密货币中的套利机会。闪电不需要抵押。然而，你需要在几秒内的同一笔交易中偿还贷款。如果交易内未付款，交易将回滚。Aave
    协议有 16 个代币的上限。代币的管理在一个供使用的合约中。此外，质押是 Aave 的另一个特性。这是一个安全模块，你可以在其中质押代币作为保险。例如，如果
    Aave 上的某种稳定币失去了与美元的挂钩，可以使用 30% 的安全资金来支付损失。自 Aave 在 2020 年推出以来，你可以使用该平台借贷真实资金


    ## 3. Fantom: 数字资产、dApps 与智能合约


    以太坊是第一个提供智能合约的加密货币。然而，它一直面临拥堵问题和高交易费用。结果是开发了几个替代方案，提供更快速、成本低的交易。其中一个替代方案是 Fantom，一个用于
    dApps 和数字资产的开源智能合约平台。该平台简化了合成资产的借入、贷款和交易。你只需要访问你的数字钱包，存入代币，就可以开始赚钱。


    ### 特性


    Fantom 正在崛起，因为它有一种网络架构为区块链三难题提供了一个可行的解决方案。它旨在提供安全性、稳定性和去中心化的稳定平衡。该平台非常快，其速度源于一种被称为
    Lachesis 的独特共识机制。得益于此，交易几乎是瞬时完成。因此，作为一个启用智能合约的区块链，它是 dApp 开发的健壮环境。


    Fantom 高效的交易处理确保交易在一到两秒内结算。它每秒可以处理数千次交易，而且费用通常只有几分钱。Fantom 平台的交易量在五月份超过三百万次也不奇怪。Fantom
    对去中心化金融（De-Fi）至关重要，而且不需要治理机构。


    它的基础设施通过其 `aBFT（异步拜斯庭容错）` POS 共识机制连接在一起。结果是，它可以维持整个网络的运行效率。通过每年只需 35 美元订阅 Blank
    Slate Media 社区报来支持当地新闻。Fantom 的共识机制 `aBFT` 验证网络上的数据和交易。结果是，它可以信任且透明的方式达成一致。再次，`aBFT`
    网络结构可以在保护网络安全性的同时最大化速度。


