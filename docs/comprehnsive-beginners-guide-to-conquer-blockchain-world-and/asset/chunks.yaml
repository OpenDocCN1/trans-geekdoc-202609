    Fantom is used for payments thanks to its high throughput and speed. It is also
    ideal for on-chain governance and governance activities. By this, it means that
    if you own tokens on the `FTM` network, you will be able to vote on improvement
    proposals, propose changes, and carry out decisions using on-chain governance.


    Your influence will depend on the amount of `FTM` you hold. Phantom is suitable
    for staking rewards. Here, you will be able to earn a minimum Annual Percentage
    Rate (`APR`) of 3.79% up to a maximum of 11.59%. The `APR` depends on the amount
    of `FTM` you have staked and the total lock-in period. Furthermore, Phantom is
    also used for network fees and compensating validators.


    Although the rate is significantly low, Phantom pays transaction fees and the
    charges needed to create new networks and smart contracts. `FTM` is also used
    to pay validators who keep the platform running without hacks and scams and validate
    transactions. Phantom has its integrated DeFi stack, which allows users to mint
    `fUSB` using `FTM` tokens. `fUSB` is Phantom’s native stablecoin pegged 1:1 to
    the U.S. dollar.


    You can use it to trade, borrow, and lend against 176 tokens and synthetic assets,
    including `fETH` and `fBTC`. Phantom is currently trading at USD 2.03 as of Nov.
    17, 2021. Its 24-hour trading volume on exchanges is approximately $748,138,557.20.


    ## #4. Pancake Swap: Most Popular Decentralized Platform


    Pancake Swap is another emerging decentralized finance protocol. This DeFi project
    was introduced just a year ago, based on the Binance Smart Chain as an automated
    market maker. Like `Aave`, Pancake Swap is a trading liquidity provider. By the
    end of October, users on Pancake Swap had staked more than five billion on this
    decentralized exchange (DEX).


    Compared to peers such as `Uniswap` and with a market value of only four billion,
    Pancake Swap is a bargain.


    ### Features


    There are many reasons why Pancake Swap is a convenient choice for coin holders.
    One, Pancake Swap is built on the Binance `BEP-2`. Binance is the world’s largest
    cryptocurrency exchange averaging $27 billion in daily trade values. Secondly,
    this platform is audited by `CertiK`, a leading smart-contract security firm.
    As such, it is more trustworthy than un audited DeFi projects. On Pancake Swap,
    you can trade tokens and cryptocurrencies without intermediaries and keep custody
    of your tokens


    Although Pancake Swap runs on Binance, it is not controlled by Binance. The service
    is much like `Uniswap` or Ethereum DEX. Pancake Swap is used for `BEP-20` tokens
    that run on Binance Smart Chain. However, you can bring tokens from other platforms
    through Binance Bridge. From there, you can swap them as `BEP-20` tokens for use
    on Pancake Swap. Pancake Swap uses automated market maker (`AMM`) model, which
    relies on user-funded pools


    Users deposit their funds in the pool for `LP` tokens. You can use these tokens
    to reclaim your share of trading fees and lock tokens in the liquidity pool to
    earn. Further you can use tokens swap for the coin you want. On Pancake Swap,
    you can also farm tokens like `CAKE` and `SYRUP`. `CAKE` is the first reward you
    get after locking your `LP` tokens. Now, you can then stake `CAKE` tokens to receive
    `SYRUP`. With `SYRUP` tokens, you get more functional like governance tokens or
    tokens that may be used as tickets. Another feature of Pancake Swap is that it
    offers game-like experiences. For example, you can wager whether the price of
    Binance Coin (`BNB`) will rise or fall within a specific window of time. In the
    feature, users can buy tickets with the hope of winning a major `CAKE` fall. Also,
    Pancake Swap offers a wide variety of bunny-themed NFTs. Plus, there are `IFO`
    (Initial Farm Offering) sales to buy new coins from budding projects. To use Pancake
    Swap, you need a crypto wallet. The decentralized platform works with `Math Wallet`,
    `Trust Wallet`, `Binance Wallet`, and even `MetaMask`. Although `MetaMask` is
    an Ethereum wallet, it can be configured to work with the Binance Smart Chain.


    Pancake Swap is very popular alongside `Uniswap` and Sushiswap, Ethereum’s biggest
    DEXs. If Ethereum continues to experience high transaction fees and congestion,
    Pancake Swap is positioned to gain an even better hold of the market against its
    rivals.


    ## #5. The Graph: Decentralized AP Is for Future


    The Graph (`GRT`) is a decentralized protocol for querying and indexing data from
    blockchains. It operates like Google indexes information on the web to improve
    accessibility. So, similarly, The Graph indexes data from blockchains like Ethereum
    and Fiona. Previously, The Graph was only able to index


    However, since the NEAR blockchain, it began running on blockchains not Ethereum


    ### Features


    The Graph groups data into open APIs as `subgraphs`. This process makes it easy
    for developers to query through The Graph. Since it makes data accessible, it
    provides data to applications like DEXs to operate efficiently. Developers use
    The Graph for data such as prices and user information. As of Nov. 2021, the protocol
    lives on 25 networks. The Graph Foundation distributes grants to projects building
    on The Graph. Still, it will continue to issue grants.


    Moreover, it supports indexing data from Ethereum and `POA`, and IPFS. dApps like
    `Aragon`, `Synthetix`, `Uniswap`, `Balancer`, `Gnosis`, and many others have deployed
    over 1,700 subgraphs. `GRT`’s popularity is growing, and its current price is
    $0.65 with a 24-hour trading volume of $136,511,855. The Graph is expected to
    reach a +212.52% revenue increase by 2026.


    # UNDERSTANDING THE METAVERSE?


    Good question. "Metaverse" is currently a major buzz word in the worlds of tech,
    business, and finance, and like all buzz words its definition is fuzzy, contested,
    and shaped by the ambitions of the people using it. Here’s one thing we can say
    for sure: The term was coined by Neal Stephenson in his 1992 novel Snow Crash
    to describe a virtual world in his imagined future, a 21st-century dystopia.

