    \ AI\n- 理解元宇宙？\n- 关于元宇宙的进一步解释\n- [突然意识到元宇宙...]\n\n# 理解区块链技术\n\n想象这样一个世界：你可以直接向某人发送资金而无需银行——只需几秒钟而不是几天，而且不需要支付费用。或者将资金存储在不关联的在线钱包中，这意味着你就是自己的银行，并对资金拥有完全控制权。你不需要银行许可即可访问或移动资金，而且永远不必担心被第三方夺走或被政府的经济政策操纵。\n\
    \n这并非未来的世界；它是一个日益增长的早期采用者目前正生活的世界。这些只是改变我们信任和交换价值方式的一些重要区块链技术案例。我们稍后会介绍其余部分。然而对许多人来说，区块链技术仍然是一个神秘或令人生畏的话题。\n\
    \n有些人甚至怀疑我们未来是否会使用这种技术。今天这种怀疑态度是可以理解的，因为我们仍处于区块链技术开发和广泛应用的非常早期阶段。2021 年之于区块链，正如\
    \ 20 世纪 90 年代后期之于互联网。就像互联网，区块链技术并非昙花一现，它将持久存在，如果你正在阅读这篇文章，你也属于早期。\n\n本文将消除区块链技术的神秘面纱。这是你的“区块链技术入门\
    \ 101”。一份完整、易于理解且循序渐进的初学者区块链指南。你将学习区块链是什么、它为什么重要、它是如何工作的以及未来将如何发展。读完本指南后，你将能够充满信心且充分地进行区块链投资。如果你想在朋友面前表现得专业，你绝不会是个落后者。\n\
    \n## 区块链入门\n\n区块链技术是区块链运行背后的概念。区块链技术让像比特币（Bitcoin）这样的加密货币（数字货币）像互联网一样无处不在。区块链是一种不可篡改的（意味着记录的交易无法更改）分布式账本（存储在计算机网络多个位置的交易或数据的数字记录），具有许多用途。\n\
    \n不可篡改和分布式是其基本属性。账本的不可篡改性意味着你可以随时信任它的准确性。分布式保护区块链免受攻击。账本上的每笔交易或记录都存储在“区块”中。例如，比特币区块链上的区块平均包含超过\
    \ 500 笔交易。\n\n区块中包含的信息取决于并链接到上一个区块的信息，并随着时间的推移形成一条交易链。因此得有了“区块链”一词。\n\n## 区块链的类型\n\
    \n有四种区块链：\n\n### 公链\n\n公链区块链是开放的、去中心化的计算机网络，任何想要请求或验证交易（检查准确性）的人都可以访问。验证交易的人（矿工）将获得奖励。公链区块链使用工作量证明（PoW）或权益证明（PoS）共识机制（后文讨论）。两种常见的示例包括比特币和以太坊（ETH）。\n\
    \n### 私有链\n\n私有区块链不是开放的，它们有访问限制。想要加入的人需要系统管理员的许可。\n\n### 混合链或联盟链\n\n混合区块链是公有和私有特性的结合。例如\
    \ Hyperledger。对于这些是否完全不同，并没有 100% 的共识。有些人认为存在区别。\n\n### 侧链\n\n侧链是运行在主链附近的区块链。它允许用户在两个区块链之间移动数字资产。侧链的一个示例是闪电网络（Lightning\
    \ Network）。\n\n## 区块链的历史\n\n"
