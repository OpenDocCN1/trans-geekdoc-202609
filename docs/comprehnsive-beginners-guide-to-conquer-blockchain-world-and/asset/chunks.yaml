  trans: '

    Fantom 因其高吞吐量和速度被用于支付。它也是链上治理和治理活动的理想选择。这意味着，如果你拥有 `FTM` 网络上的代币，你将能够通过链上治理对改进提案进行投票、提议更改并执行决策。


    你的影响力将取决于你所持有的 `FTM` 数量。Phantom 适用于质押奖励。在这里，你可以获得最低 3.79% 的年化收益率（`APR`），最高可达 11.59%。`APR`
    取决于你质押的 `FTM` 数量以及总锁定期限。此外，Phantom 还用于支付网络费用和补偿验证者。


    尽管费率非常低，但 Phantom 支付交易费用以及创建新网络和智能合约所需的费用。`FTM` 也用于支付那些保持平台运行免黑客和诈骗并验证交易的验证者。Phantom
    拥有集成的 DeFi 栈，允许用户使用 `FTM` 代币铸造 `fUSB`。`fUSB` 是 Phantom 的原生稳定币，与美元 1:1 挂钩。


    你可以使用它对 176 种代币和合成资产进行交易、借贷，包括 `fETH` 和 `fBTC`。截至 2021 年 11 月 17 日，Phantom 的交易价格为
    2.03 美元。其在交易所的 24 小时交易量约为 $748,138,557.20。


    ## #4. Pancake Swap：最流行的去中心化平台


    Pancake Swap 是另一个新兴的去中心化金融协议。这个 DeFi 项目在一年前推出，基于币安智能链作为自动做市商。像 `Aave` 一样，Pancake
    Swap 是一个交易流动性提供者。截至 10 月底，Pancake Swap 用户在该去中心化交易所（DEX）上质押了超过五十 亿美元。


    与 `Uniswap` 等竞争对手相比，且市值仅为四十 亿美元，Pancake Swap 极具划算。


    ### 特性


    有许多原因说明 Pancake Swap 是代币持有者的便利选择。首先，Pancake Swap 构建在币安 `BEP-2` 之上。币安是全球最大的加密货币交易所，日均交易额平均达
    270 亿美元。其次，该平台由领先的智能合约安全公司 `CertiK` 审计。因此，它比未经审计的 DeFi 项目更值得信赖。在 Pancake Swap
    上，你可以无需中介交易代币和加密货币，并保持代币的托管。


    尽管 Pancake Swap 运行在币安上，但它并不由币安控制。该服务非常类似于 `Uniswap` 或以太坊 DEX。Pancake Swap 用于运行币安智能链上的
    `BEP-20` 代币。然而，你可以通过币安桥从其他平台引入代币。从那里，你可以将其转换为 `BEP-20` 代币并在 Pancake Swap 上使用。Pancake
    Swap 使用自动做市商（`AMM`）模型，该模型依赖于用户资金池


    用户将资金存入池中获得 `LP` 代币。你可以使用这些代币取回你的交易费用份额，并将代币锁定在流动性池中盈利。此外，你可以使用代币兑换你需要的币。在 Pancake
    Swap 上，你还可以挖掘 `CAKE` 和 `SYRUP` 等代币。`CAKE` 是你在锁定 `LP` 代币后获得的第一个奖励。现在，你可以质押 `CAKE`
    代币以获得 `SYRUP`。有了 `SYRUP` 代币，你将获得更多功能，如治理代币或可用作票目的代币。Pancake Swap 的另一个特性是它提供了游戏化的体验。例如，你可以押注币币（`BNB`）的价格在特定时间范围内是会上还是下跌。在该功能中，用户可以购买门票，希望能赢得一次
    `CAKE` 大跌。此外，Pancake Swap 还提供了多种兔子主题的 NFT。另外，还有 `IFO`（初始农场发行）销售，可以从新兴项目购买新币。使用
    Pancake Swap 需要加密钱包。该去中心化平台支持 `Math Wallet`、`Trust Wallet`、`Binance Wallet` 甚至
    `MetaMask`。尽管 `MetaMask` 是以太坊钱包，但它可以配置为与币安智能链配合。


    Pancake Swap 与 `Uniswap` 和 Sushiswap（以太坊最大的 DEX）一样非常流行。如果以太坊继续经历高交易费用和拥堵，Pancake
    Swap 有望在竞争对手手中获得更大的市场份额。


    ## #5. The Graph：去中心化索引是未来


    The Graph (`GRT`) 是一种用于从区块链查询和索引数据的去中心化协议。它的运行方式类似于 Google 索引网络信息以提高可访问性。类似地，The
    Graph 索引来自以太坊和 Fiona 等区块链的数据。此前，The Graph 只能索引


    然而，自 NEAR 区块链以来，它开始在非以太坊的区块链上运行


    ### 特性


    The Graph 将数据分组为开放 API 即 `subgraphs`。这一过程使得开发者很容易通过 The Graph 进行查询。因为它使数据变得可用，它为
    DEX 等应用程序提供了高效运行的数据支持。开发者使用 The Graph 获取价格和用户信息等数据。截至 2021 年 11 月，该协议运行在 25 个网络上。The
    Graph Foundation 为在 The Graph 上构建的项目发放资助。尽管如此，它将继续发布资助。


    此外，它支持索引来自以太坊、`POA` 和 IPFS 的数据。`Aragon`、`Synthetix`、`Uniswap`、`Balancer`、`Gnosis`
    等许多 dApp 已经部署了 1,700 多个子图。`GRT` 的流行度正在增长，其当前价格为 0.65 美元，24 小时交易量为 $136,511,855。The
    Graph 预计到 2026 年收入将增长 +212.52%。

