    \ of the Metaverse](#\n- [etc...]\n\n# UNDERSTANDING BLOCKCHAIN TECHNOLOGY\n\n\
    Imagine a world where you can send money directly to someone without a bank –\
    \ in seconds instead of days, and you don’t pay fees. Or one where you store money\
    \ in an online wallet not tied to a bank, meaning you are your bank and have complete\
    \ control over your money. You don’t need a bank’s permission to access or move\
    \ it, and never have to worry about a third party taking it away, or a government’s\
    \ economic policy manipulating it.\n\nThis is not a world of the future; it is\
    \ a world that avid but growing number of early adopters live in right now. And\
    \ these are just a few of the important blockchain technology cases that are transforming\
    \ the way we trust and exchange value. We’ll get into the rest later. Yet, for\
    \ many, blockchain technology is still a mysterious or intimidating topic.\n\n\
    Some even remain skeptical that we’ll use this technology in the future. This\
    \ skepticism that exists today is understandable because we’re still very early\
    \ in the development and widespread adoption of blockchain technology. 2021 is\
    \ to blockchain what the late 1990s were to the internet. And like the internet,\
    \ blockchain technology is anything but a fad, it’s here to stay, and if you’re\
    \ reading this, you’re early too.\n\nThis demystifies blockchain technology. This\
    \ is your ‘intro to blockchain technology 101’. A complete, easy-to-understand,\
    \ step by step beginners blockchain. You’ll learn everything what blockchain is\
    \ and why it matters, how blockchain works and what comes next. You’ll also walk\
    \ away from this guide confident and informed blockchain investment. And you’ll\
    \ be no slouch if you want to hold your own with friends.\n\n## Blockchain for\
    \ Beginners\n\nBlockchain technology is the concept behind the running of blockchain.\
    \ Blockchain technology makes cryptocurrency (digital currency) like Bitcoin like\
    \ the internet. The blockchain is an immutable (meaning a transaction recorded\
    \ cannot be changed) distributed ledger (digital record of transactions or data\
    \ stored in multiple places on a computer network) with many uses.\n\nImmutable\
    \ and distributed are fundamental properties. The immutability of the ledger means\
    \ you can always trust it accurate. Being distributed protects the blockchain\
    \ from attacks. Each transaction or record on the ledger is stored in a “block.”\
    \ For example, blocks on the Bitcoin blockchain consist of an average of more\
    \ than 500 transactions.\n\nThe information contained in a block depends on and\
    \ linked to the information in a previous block and, over time, forms a chain\
    \ of transactions. Hence the word blockchain.\n\n## Types of Blockchain\n\nThere\
    \ are four types of blockchains:\n\n### Public\n\nPublic blockchains are open,\
    \ decentralized networks of computers accessible to anyone wanting to request\
    \ or validate a transaction (check for accuracy). Those (miners) who validate\
    \ transactions receive rewards. Public blockchains use proof-of-work or proof-of-stake\
    \ consensus mechanisms (discussed later). Two common examples of public blockchains\
    \ include Bitcoin and Ethereum (ETH).\n\n### Private Blockchains\n\nPrivate blockchains\
    \ are not open, they have access restrictions. People who want to join require\
    \ permission from the system admin.\n\n### Hybrid Blockchains or Consortium\n\n\
    Hybrid blockchains are a combination of public and private features. For example,\
    \ Hyperledger. There isn’t 100 percent consensus on these are different. Some\
    \ make a difference.\n\n### Sidechains\n\nA sidechain is a blockchain running\
    \ alongside the main chain. It allows users to move digital assets between two\
    \ blockchains. An example of a sidechain is Lightning Network.\n\n## History of\
    \ Blockchain\n"
