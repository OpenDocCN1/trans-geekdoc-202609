    \ rather than “01”), two-digit years (does “12” refer to 2012 or 1912?), and ambiguous\
    \ ordering of months and days (does “12” refer to the twelfth day of the month\
    \ or December?)\n\nIf we know the way the data is stored, we can use {lubridate}\
    \ functions to process the data into YYYY-MM-DD. These three very different date\
    \ formats can be transformed into a consistent format:\n\n```r\nymd(\"1973-10-22\"\
    )\n```\n\n```\n## [1] \"1973-10-22\"\n```\n\n```r\nmdy(\"October 22nd, 1973\"\
    )\n```\n\n```\n## [1] \"1973-10-22\"\n```\n\n```r\ndmy(\"22-Oct-1973\")\n```\n\
    \n```\n## [1] \"1973-10-22\"\n```\n\nA third manner in which dates can be stored\
    \ is with a truncated representation. For example, total sales for the entire\
    \ month might be recorded as a single value associated with “Jan 2017” or “2017-01”,\
    \ or a quarterly measurement might be “2017-Q1”.\n\n```r\n# month\nym(\"1973-10\"\
    )\n```\n\n```\n## [1] \"1973-10-01\"\n```\n\n```r\nmy(\"Oct 1973\")\n```\n\n```\n\
    ## [1] \"1973-10-01\"\n```\n\n```r\n# quarter\nyq(\"1973-Q1\")\n```\n\n```\n##\
    \ [1] \"1973-01-01\"\n```\n\nIf we have a variable with annual data, we have to\
    \ use the parameter `truncated = 2` to convert our year into a date format:\n\n\
    ```r\nymd(\"1973\", truncated = 2)\n```\n\n```\n## [1] \"1973-01-01\"\n```\n\n\
    By mutating these various representations into a consistent YYYY-MM-DD format,\
