    \ The vector identifier (sometimes called “the vector number” even though it’s\
    \ a character string!) for European travellers entering Canada via British Columbia\
    \ is v1277198032.\n\nThe {cansim} package also gives us a function to select a\
    \ single vector number, so we can be more efficient still. We can speed up the\
    \ download time and skip the filtering steps to get to the one we want. (Note\
    \ that this function requires us to enter a start date, and converts the reference\
    \ date variable to the YYYY-MM-DD format.)\n\n```\nget_cansim_vector(\"v1277198032\"\
