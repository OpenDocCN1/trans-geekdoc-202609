    \ 表通过共同的变量相互*关联*。这些变量被称为“键”变量。\n\n下图展示了这些关系：\n\n![](img/b86622d1e9ca82b3cbec45faaffaaf26_145_0.png)\n\
    \n图 10.1 nycflights13。\n\n（摘自 (Wickham and Grolemund, 2016)，第 174 页）\n\n## 10.1.1\
    \ 连接到数据库\n\nSQL 是一种广泛用于在关系数据库中操作和提取数据的语言。因此，有很多关系数据库采用这种格式构建。大多数情况下，这些数据库会存放在网络服务器上，但对于较小的数据库，你可以将文件安装在本地计算机上。\n\
    \n在 R 中，我们可以使用 {dbplyr} 包（Wickham et al., 2023a）来访问 SQL 数据库和 SQL 函数。此外，我们需要 {DBI}（Müller,\
