  mdcn: "\n| 函数 | 用途 |\n|---|---|\n| str_match() | 提取匹配文本以及括号内的匹配部分 |\n| str_replace()\
    \ and str_replace_all() | 用新文本替换匹配项 |\n| str_remove() and str_remove_all() | 删除匹配项\
    \ |\n| str_split() | 在模式处拆分字符串 |\n\n第一步将使用 stringr::str_remove() 函数移除模式为 \" \"\
    \ 的空格。此步骤随后将使用 pattern = \"-\" 重复。\n\n```\nstr_remove(string = pc_kimberley_all,\n\
    \    pattern = \" \")\n```\n\n## [1] \"V1A2B3\"  \"V1A2B3\"  \"v1a2B3\"  \"v1a-2b3\"\
    \n\n更高效地，我们可以在方括号内同时使用空格和连字符的正则表达式，其结果是替换空格或连字符中的任意一个。\n\n```\npc_kimberley_clean\
    \ <- str_remove(string = pc_kimberley_all,\n    pattern = \"[ -]\")\n```\n\n第二步将大写字母。用于此目的的\
    \ {stringr} 函数是 str_to_upper。（还有并行的 str_to_lower、str_to_title 和 str_to_sentence\
    \ 函数。）\n\n```\npc_kimberley_clean <- str_to_upper(pc_kimberley_clean)\npc_kimberley_clean\n\
    ```\n\n## [1] \"V1A2B3\" \"V1A2B3\" \"V1A2B3\" \"V1A2B3\"\n\n如果这是在数据框中，这些函数可以添加到\
    \ mutate() 函数中，并在管道序列中应用，如下所示。\n\n```\n# convert string to tibble\npc_kimberley_tbl\
    \ <- as_tibble(pc_kimberley)\n```\n\n```\n# mutate new values\n# --note that creating\
    \ three separate variables allows for comparisons\n#   as the values change from\
    \ one step to the next\npc_kimberley_tbl |>\n  # extract the postal codes\n  mutate(pc_extract\
    \ = str_extract(value, postalcode)) |>\n  # remove space or hyphen\n  mutate(pc_remove\
    \ = str_remove(pc_extract, \"[ -]\")) |>\n  # change to upper case\n  mutate(pc_upper\
    \ = str_to_upper(pc_remove))\n```\n\n```\n## # A tibble: 4 x 4\n##   value   \
    \   pc_extract pc_remove pc_upper\n##   <chr>      <chr>      <chr>     <chr>\n\
    ## 1 V1A2B3     V1A2B3     V1A2B3    V1A2B3\n## 2 V1A 2B3    V1A 2B3    V1A2B3\
    \    V1A2B3\n## 3 v1a 2B3xyz v1a 2B3    v1a2B3    V1A2B3\n## 4 v1a-2b3    v1a-2b3\
    \    v1a2b3    V1A2B3\n```\n\n## 12.3.2.3  拆分和合并字符串\n\n下面，我们使用 str_split() 函数根据逗号和空格位置拆分地址。\n\
    \n```\nUVic_address <- \n  \"Continuing Studies,\n  3800 Finnerty Rd,\n  Victoria,\
    \ BC,\n  V8P 5C2\"\n\nstr_split(UVic_address, \", \")\n```\n\n```\n## [[1]]\n\
    ## [1] \"Continuing Studies,\\n  3800 Finnerty Rd\"\n## [2] \"\\n  Victoria\"\n\
    ## [3] \"BC\"\n## [4] \"\\n  V8P 5C2\"\n```\n\n{stringr} 包含三个用于合并字符串的有用函数。str_c()\
    \ 将多个字符串折叠成单个字符串，用我们指定的内容分隔（默认为无，即 \"\"）。\n\n下面我们将把地址的各个部分合并成一个字符串，各部分之间用逗号和空格分隔。\n\
    \n```\nUVic_address_components <- c(\n  \"Continuing Studies\",\n  \"3800 Finnerty\
    \ Rd\",\n  \"Victoria\", \"BC\",\n  \"V8P 5C2\"\n)\n\nstr_c(UVic_address_components,\
    \ collapse = \", \")\n```\n\n## [1] \"Continuing Studies, 3800 Finnerty Rd, Victoria,\
    \ BC, V8P 5C2\"\n\nstr_flatten_comma() 是得到相同结果的快捷方式：\n\n```\nstr_flatten_comma(UVic_address_components)\n\
    ```\n\n## [1] \"Continuing Studies, 3800 Finnerty Rd, Victoria, BC, V8P 5C2\"\n\
    \n请注意 str_flatten 也可以使用，但我们需要显式指定分隔符：\n\n```\nstr_flatten(UVic_address_components,\
    \ collapse = \", \")\n```\n\n## [1] \"Continuing Studies, 3800 Finnerty Rd, Victoria,\
    \ BC, V8P 5C2\"\n\n这些函数还具有参数 last =，允许我们指定最终分隔符：\n\n```\nstr_flatten(UVic_address_components,\
    \ collapse = \", \", last = \" \")\n```\n\n## [1] \"Continuing Studies, 3800 Finnerty\
    \ Rd, Victoria, BC V8P 5C2\"\n\n## 12.3.3 示例：按 NAICS 代码划分的劳工统计局\n\n在本示例中，我们将使用正则表达式过滤美国劳工统计局发布的就业数据表。该表显示\n\
    \nNAICS 系统中有三个“超部门”：初级产业、商品生产产业和服务生产产业。“Series ID” 变量字符串以“CEU”开头，其后是第 4 和第 5 位的数字，表示超部门。第一行，超部门“00”，是整个劳动力的汇总。\n\
    \n矿业、采石业和石油天然气开采是商品生产产业中的一个部门，其 NAICS 代码号为 21。这在字符串的第 6 和第 7 位表示。\n\n矿业（NAICS\
    \ 212）是一个子部门，由三个行业（在四位数级别）组成。\n\n数据框的层次结构意味着如果我们简单地对列求和就会导致重复计数：煤炭、金属矿石和非金属矿物行业行的总和被报告为采矿（除石油和天然气外）的就业人数。\n\
    \n让我们设想我们的任务是制作一个图表，显示三个子部门的就业情况，以三位数表示。\n\n首先，让我们创建一个包含与部门 NAICS 21 相关的所有行的表。\n\
    \n```\n# create NAICS 21 table\nbls_employment_naics21 <- bls_employment |>\n\
    \  filter(str_detect(`Series ID`, \"CEU1021\"))\n```\n\ngt(\n  bls_employment_naics21\n\
    )\n```\n\n| 系列 ID | 年度 2019 | 年度 2020 |\n|---|---|---|\n| CEU1021000001 | 678.1\
    \ | 553.0 |\n| CEU1021100001 | 143.6 | 129.8 |\n| CEU1021200001 | 190.4 | 176.3\
    \ |\n| CEU1021210001 | 50.5 | 39.8 |\n| CEU1021220001 | 42.2 | 41.4 |\n| CEU1021230001\
    \ | 97.8 | 95.1 |\n| CEU1021300001 | 344.0 | 246.8 |\n\n在上表中，我们看到第一行的“Series ID”为\
    \ CEU1021000001。这个长串零表明这是部门 NAICS 21。每年就业总计是子部门 211、212 和\n213 的汇总。此外，该表还显示了 212\
    \ 内的行业，从 CEU1021210001（NAICS 2121）开始。\n\n如果我们只选择第九位为零的值会怎样？\n\n```\ngt(\nbls_employment_naics21\
    \ |>\n  # remove the ones that have a zero in the 5th spot from the end\n  filter(str_detect(`Series\
    \ ID`, \"00001$\"))\n)\n```\n\n| 系列 ID | 年度 2019 | 年度 2020 |\n|---|---|---|\n\
    | CEU1021000001 | 678.1 | 553.0 |\n| CEU1021100001 | 143.6 | 129.8 |\n| CEU1021200001\
    \ | 190.4 | 176.3 |\n| CEU1021300001 | 344.0 | 246.8 |\n\n这不太正确——它包含了“21”部门汇总。\n\
    \n让我们使用 str_detect() 函数开头的感叹号过滤掉“21”之后为零的行。\n\n```\n# NAICS 212\nbls_employment_naics21\
    \ |>\n  # use the exclamation mark to filter those that don't match\n  filter(!str_detect(`Series\
    \ ID`, \"CEU0210\"))\n```\n\n```\n## # A tibble: 6 x 3\n##   `Series ID`   `Annual\
    \ 2019` `Annual 2020`\n##   <chr>                 <dbl>         <dbl>\n## 1 CEU1021100001\
    \          144.          130.\n## 2 CEU1021200001          190.          176.\n\
    ## 3 CEU1021210001           50.5          39.8\n## 4 CEU1021220001          \
    \ 42.2          41.4\n## 5 CEU1021230001           97.8          95.1\n## 6 CEU1021300001\
    \          344           247.\n```\n\n这不起作用，因为它保留了从 2121 开始的四位数行业。\n\n解决方案可以通过关注层次结构中区分层级的字符找到。\n\
    \n让我们在第二个过滤器前面加上 1 到 9 的数字（字符串的第 8 个字符），并将下一个字符（第 9 个字符）保留为零。这应该能找到“CEU1021200001”但省略“CEU1021210001”。\n\
    \n```\n# NAICS 212\nbls_employment_naics21 |>\n  # remove the ones that have a\
    \ zero in the 5th spot from the end\n  # - add any digit from 1-9, leave the following\
    \ digit as 0\n  filter(str_detect(`Series ID`, \"[1-9]00001$\"))\n```\n\n```\n\
    ## # A tibble: 3 x 3\n## `Series ID` `Annual 2019` `Annual 2020`\n## <chr>   \
    \    <dbl>         <dbl>\n## 1 CEU1021100001 144. 130.\n## 2 CEU1021200001 190.\
    \ 176.\n## 3 CEU1021300001 344 247.\n```\n\n另一个选项是使用否定零 “[ˆ0]”。你会注意到它使用了插入符号“ˆ”。因为它在方括号内，所以它具有否定命名值的作用。这与它在方括号外时的行为不同，在方括号外它表示“字符串的开始”。\n\
    \n```\n# NAICS 212\nbls_employment_naics21 |>\n  # remove the ones that have a\
