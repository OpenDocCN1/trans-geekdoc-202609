    \ of hard-coding value\n  # - make sure that it is the most recent data\n  # note:\
    \ this is a shorthand for `filter(year == max(year))`\n  slice_max(year)\n```\n\
    \nThe “Calculation” step:\n\n```\n# CALCULATION\n\ngapminder_gdp <- gapminder_gdp\
    \ |>\n  # calculate total GDP\n  mutate(gdpCountry = gdpPercap * pop) |>\n  #\
