    # 6.2.1 Excel formatting as data


    One thing to notice about this data is the Area name variable is hierarchical,
    with a series of sub-totals. The lower (smaller) levels, containing the component
    areas of the next higher level in the hierarchy, are represented by indentations
    in the area name value. The lower the level in the hierarchy, the more indented
    the name of the area.


    The specifics of the hierarchy are as follows:


    +   - The value “England and Wales” contains the total population, which is the
    sum of England (Excel’s row 8) and Wales (row 360).

    +   - England (but not Wales) is then further subdivided into nine sub-national
    Regions (coded as “E12” in the first three characters of the Area code variable).

    +   - These Regions are then are divided into smaller units, but the description
    of those units varies. These are Unitary Authorities (E06), London Boroughs (E09),
    Counties (E10), and Metropolitan Counties (E11); for our purpose, let’s shorthand
    this level as “counties”.

    +   - The county level is further divided into Non-Metropolitan Districts (E07),
    and Metropolitan Counties are subdivided into Metropolitan Districts (E08). The
    image above shows Tyne and Wear (an E11 Met County, at row 18) is subdivided,
    starting with Gateshead, while Cumbria (an E10 County, at row 31) is also subdivided,
    starting with Allerdale.

    +   - Wales is divided into Unitary Authorities, coded as “W06” in the first three
    characters of the Area code variable. In Wales, there is no intervening Region,
    so these are at the same level as the Unitary Authorities in England. “Local


    2 The hierarchy of the administrative geographies of the UK can be found at the
    “England” and “Wales” links on [the ONS “Administrative geographies” page] (https://www.ons.gov.uk/methodology/geography/ukgeographies/administrativegeography).'
