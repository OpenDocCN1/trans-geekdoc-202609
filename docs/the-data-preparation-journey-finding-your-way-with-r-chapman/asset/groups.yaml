    comment at the start of each script, so we have recommended that as a first step.”
    (Wilson et al., 2017)


    # 3.3.1 Literate programming


    Computer scientist Donald Knuth introduced the idea of “literate programming”
    in 1984. In this approach, a natural language explanation takes a central role,
    and the code chunks for each step follow that explanation. The idea is to “code
    your documentation,” instead of “document your code.”


    Knuth wrote “Let us change our traditional attitude to the construction of programs:
    Instead of imagining that our main task is to instruct a computer what to do,
    let us concentrate rather on explaining to human beings what we want a computer
    to do.” (Knuth, 1992, p.99)


