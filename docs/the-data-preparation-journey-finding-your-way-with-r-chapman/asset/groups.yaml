  mdcn: "\n\n“脏数据”是指在*可信度*维度上有所欠缺的数据，具体而言，就是评估数据是否完整、一致和准确。需要特别指出的是，这些类别并非互斥；一个变量可能同时存在不一致和不准确的问题。\n\
    \n## 完整\n\n就我们的目的而言，“完整”是指每条记录中的各个值是否有缺失（内部完整性）。\n\n“完整”并不意味着总体中的每一个成员都出现在数据中。通过精心设计的样本，总体中的一个子集有可能提供关于该总体的准确度量。此外，我们也有可能判断这些记录是否准确地代表了整体。\n\
    \n## 一致\n\n如果相同的值以相同的方式被记录，我们就认为该度量是“一致”的。\n\n一致性的一些示例：\n\n- 单位一致。一个例子是温度，确保数值统一以摄氏度报告，而不是混用华氏度和开尔文。另一个例子可能是在面向国际受众的调查或表单中，受访者可能以本国货币填写薪水。\n\
    - 拼写一致。我在加拿大的家乡省份是“British Columbia”，但经常被缩写为“B.C.”或“BC”。再想想美国薪资保障计划（PPP）申请中“Philadelphia”被拼写出的57种不同方式。（Au,\
    \ 2020a）\n- 在某些情况下，数据收集的方式可能会引入记录值的差异。这可以适用于从科学仪器（如空气质量传感器）的变异性（Khreis et al.,\
    \ 2008），到人们对不同媒介进行的调查作出回应方式的差异（Abeysundera, 2015）（Holbrook et al., 2003）（St-Pierre\
    \ and Béland, 2004）。\n\n## 准确\n\n当我们说“准确”时，我们指的是数据中记录的值就是所测量的值。\n\n不准确数据的一些示例：\n\
    \n- 使用默认（或哨兵）值，将其作为占位符插入以代替缺失或“未知”的值。这有时是数据收集或数据库软件的一部分，导致本应为“unknown”的值被输入为默认值。这可能是数据录入验证过程要求必须有输入（也就是说，字段必须有条目才能继续数据录入），或者要求特定格式（如日期格式）的输入所导致的后果。在这些情况下，哨兵值可能被输入进去，而不是显式的“NA”。\n\
    \n  > 安全文献数据库 SafeLit Foundation 的主管 Lawrence Davis 博士……告诉我，“在美国大多数州，警方事故报告的质量充其量只能算勉强可用作研究工具。……数据质量检查很少进行，而当质量被评估时，也发现存在不足。例如，在路易斯安那州，20世纪80年代的大多数事故中，大部分乘员是出生于1950年1月1日的男性。几乎所有涉及事故的车辆都是1960年款。”但实际上并非如此。这些只是默认设置。（Perez,\
    \ 2019, p.190）\n\n- 数据录入错误。最常见的可能是笔误，即输入了错误的值。另一种类型是我们所说的“变量错位错误”（即数值被移到了相邻的一列，这种情况在地址记录中屡见不鲜，比如城市名可能会出现在州/省那一列）。\n\
    - 数值被软件自动转换。微软的 Excel 电子表格程序是其中最著名的，它会把许多非日期值转换为日期格式，并赋予新值来存储数据。例如，输入字符串“SEPT1”会被转换为当年的9月1日。有记载的证据表明，这种软件行为曾导致基因研究出现错误。（Zeeberg\
    \ et al., 2004），（Abeysooriya et al., 2021）\n- 日期可能存储为数值（或“序列号”），表示从某个固定起点开始经过的天数——而该起点因操作系统而异。例如，Windows\
    \ 版 Excel 使用1900年1月1日作为第一天，而早期的 Macintosh 电脑以及由此而来的 Macintosh 版 Excel 则使用1904年1月1日作为起始日期。因此，同一个日期会被存储为不同的值¹。（https://docs.microsoft.com/en-us/office/troubleshoot/excel/1900-and-1904-date-system）\n\
    \n  1. “Excel 中1900和1904日期系统的区别”\n\n- 矛盾。例如，假设同一个人被录入到两个数据库中，但当我们比较时发现出生日期不同，这可能是因为非\
    \ ISO8601 格式的录入：07-08-79 和 08-07-79 具有相同的数字，但一个可能是 mm-dd-yy，另一个可能是 dd-mm-yy……我们只是不知道哪个是正确的。或者是否有一个是笔误？\n\
    - 文化无知（暂时找不到更好的术语）。\n\n  > “Prawo Jazdy”被认为是一个波兰人名字，被爱尔兰警察（Garda Síochána）列在警方刑事数据库中，称其在爱尔兰犯下超过50起交通违规。一份2007年的备忘录指出，调查显示\
    \ prawo jazdy [pra.v jaz.d] 在波兰语中是“驾照”的意思，错误是由于警察在开具交通罚单时，将波兰驾照上印制的这个短语误认为是人名而造成的。（Wikipedia\
    \ contributors, 2021）\n\n## 2.2.1 整洁数据\n\n在清洗数据时，我们还应该考虑数据结构。目标应该是整洁的结构，即满足以下三条原则或规则：\n\
    \n- 每个变量必须有一列。\n- 每个观测值必须有一行。\n- 每个值必须有一个单元格。（Wickham, 2014）\n\n在许多情况下，要实现整洁结构可能需要使用\
    \ {tidyr} 包的 pivot_() 函数对数据进行重塑（Wickham, 2021b）。在其他情况下，数据中的每个单元格可能有多个变量，需要将其拆分（例如地址）为每个变量单独的列。\n\
    \n其他常见的不属于上述四大数据质量类别的结构性问题包括：\n\n1. 列标题是值而不是变量名。一个经常遇到的例子是时间单位，如下例所示。在下表中，“值”是年份。以这种方式组织的表只能显示一个变量的值；在本例中，它是国家的人口。\n\
    \n| country | 1952 | 2007 |\n|---|---|---|\n| Canada | 14,785,584 | 33,390,141\
    \ |\n| United States | 157,553,000 | 301,139,947 |\n\n更好的结构是设置一个“year”变量和另一个“population”变量。这种整洁结构还可以容纳这些年份内测量的其他变量，而不是在单独的表中显示。\n\
    \n| country | year | population | life expectancy |\n|---|---|---|---|\n| Canada\
    \ | 1952 | 14,785,584 | 68.75 |\n| Canada | 2007 | 33,390,141 | 80.65 |\n| United\
    \ States | 1952 | 157,553,000 | 68.44 |\n| United States | 2007 | 301,139,947\
    \ | 78.24 |\n\n2. 变量名重复（在某些数据存储格式中是可能的，包括纯文本和 Excel 文件）。\n3. 不合适的数据类型，例如数字或逻辑值被存储为字符串。\n\
    4. 列中包含多种数据类型。例如，有些记录是数字，有些是字符串。这些值本身可能完全正确，但如果某些数字条目包含逗号作为千位分隔符，该变量将被读取并存储为字符类型。\n\
    \n## 2.3 清洗数据\n\n如果数据不符合我们的标准或质量要求，我们就需要清洗数据。这听起来似乎不太有趣。我们不是想成为数据科学家、商业智能专家或学术科学家，去发掘隐藏在数据中的洞见吗？我们不是想进行分析吗？\n\
    \n有一种强有力的观点认为，数据清洗过程是分析过程的基本组成部分，或者相应的说法是：任何分析过程都需要数据清洗。\n\n"
