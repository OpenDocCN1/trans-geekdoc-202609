    ```\nbcf_table_3 |>\n  group_by(route_type) |>\n  summarize(total_fy2021 = sum(passengers_fy2021),\n\
    \            total_fy2020 = sum(passengers_fy2020)) |>\n```\n\n```\nmutate(pct_change\
    \ =\n  (total_fy2021 - total_fy2020) / total_fy2020 * 100)\n```\n\n```\n## # A\
    \ tibble: 3 x 4\n##   route_type total_fy2021 total_fy2020 pct_change\n##   <chr>\
    \           <dbl>        <dbl>      <dbl>\n## 1 major          7203979      13706288\
    \     -47.4\n## 2 minor          5845280       7870649     -25.7\n## 3 northern\
    \        34090        100403      -66.0\n```\n\n我们的分析：COVID-19 大流行对旅行产生了 *巨大的*\
    \ 影响。2021 财年涵盖 2020 年 4 月 1 日至 2021 年 3 月 31 日的期间，几乎正好从严格的旅行限制开始实施。尽管在 12 个月期间后期限制开始放宽，但主要路线的旅行量下降了近一半。\n\
    \n## 9\n\n## 数据来源网络\n\n本章内容：\n- 从网络存储库导入数据\n\n### 9.1 引言\n\n互联网上有大量有价值的数据，等待着好奇的数据分析师去发掘其中的洞见。有多种方式可以访问这些数据；在某些情况下，你可以下载\
    \ CSV 或 Excel 文件，然后将其读入 R。\n\n但组成 R 社区的才华横溢的人们通过创建包使我们的生活变得轻松得多，这些包允许我们编写 R 脚本直接链接到我们想要的数据。如果访问的数据集会定期更新（例如每周财务报告或每月调查结果），这就特别有价值。\n\
    \n这种与互联网数据源连接的基础是 API（应用程序编程接口）。API 允许两个软件组件进行通信。在数据访问的上下文中，网站会设置 API 来定义数据如何被访问以及如何提供。\n\
    \n通常，API 包需要互联网连接。在某些情况下，API 可能需要请求用户密钥（网站可能用来验证用户或限制请求数量或大小的策略）。\n\n利用 API 的\
    \ R 包有两种类型。第一种是专门针对特定数据源的，例如统计机构。除了获取数据外，这些包通常还具有额外的函数，可以为我们完成大量初始数据操作，使其成为 R\
    \ 中有用的格式。\n\n第二种类型超出了本书的范围，它们允许我们连接到原始数据源。对于这些来源，我们通常需要在使用数据之前进行一些整理。如果你有兴趣了解更多关于在\
    \ R 中创建与提供 API 的网站连接的内容，R 包 {httr2}(Wickham, 2023) 可能是一个不错的起点。\n\n### 9.2 用于直接连接的\
    \ R 包\n\n在本节中，我们将探讨示例，这些示例允许访问英国国家统计局和加拿大统计局托管的数据存储库。还有许多其他工具可用；其中一些列在本书章节末尾。截至撰写时，这些网站都不需要（至少）API\
    \ 密钥。\n\n### 9.2.1 国家统计局（英国）\n\n我们的第一个示例将是 {onsr}，它直接从英国国家统计局下载数据（Vasilopoulos,\
    \ 2022）。\n\n```\nlibrary(onsr)\n```\n\n对于此，我们希望获得零售销售的时间序列数据。\n\n我们可能想做的第一件事是探索我们感兴趣领域中有哪些可用内容。ons_datasets()\
    \ 函数提供了当前可用的数据的完整列表。\n\n```\ndatasets <- ons_datasets()\n\ndatasets |>\n  select(id,\
    \ description) |>\n  filter(str_detect(id, \"retail\"))\n```\n\n从中我们将选择“按价值和数量计的英国零售销售数据，经季节性调整和未经季节性调整”，其\
    \ id 值为“retail-sales-index”。\n\nons_ids() 函数提供了从 ons_datasets 函数获得的 id 列的列表。\n"
