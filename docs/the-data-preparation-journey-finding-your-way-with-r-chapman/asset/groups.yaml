    \ \"data/nycflights13_sql.sqlite\")\n\n# list the tables in the connected database\n\
    dbListTables(con_nycf)\n```\n\n## [1] \"airlines\"   \"airports\"   \"flights\"\
    \    \"planes\"\n## [5] \"sqlite_stat1\" \"sqlite_stat4\" \"weather\"\n\n现在我们已经有了数据库连接，可以使用\
    \ {dplyr} 函数 tbl() 建立到特定表的连接。请注意，flights 对象不是表本身，而是到表的连接。\n\n```\nflights <- tbl(con_nycf,\
    \ \"flights\")\n```\n\n## 10.1.2 提交查询\n\n现在环境中的“flights”对象已经建立，我们可以编写 R 代码来创建航班的一个子集——即飞往西雅图的航班。同样，flights_SEA\
