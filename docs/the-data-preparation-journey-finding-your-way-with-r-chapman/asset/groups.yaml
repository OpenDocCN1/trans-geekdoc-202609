    Fixed-width files are a hold-over from the days when storage was expensive and/or
    on punch cards. This meant that specific columns in the table (or card) were assigned
    to a particular variable, and precious space was not consumed with a delimiter.
    Compression methods have since meant that a CSV file with unfixed variable lengths
    is more common, but in some big data applications, fixed-width files can be much
    more efficient.


    If you ever have to deal with a fixed-width file, you will (or should!) receive
    a companion file letting you know the locations of each variable in every row.


    In this example, we will use the one provided in the {dpjr} package, “authors_fwf.txt”.
    This code chunk assigns the path to the file location, which we can use in our
    code later.


    ```

    authors_path <- dpjr::dpjr_data("authors_fwf.txt")

    ```


    This simple file has four (or as we will see, sometimes three, if we combine first
    and last name as one) variables, and three records (or rows).


    +   - first name

    +   - last name

    +   - U.S. state of birth (two-letter abbreviation)

    +   - randomly generated unique ID


    If we open the file in a text editor, we see this:


    ```

    Toni Morrison    IL    DJ-1944-QF96

    Kurt Vonnegut    IN    XN-5632-TP58

    Walt Whitman     NY    LW-1752-TD08

    ```


    # FIGURE 5.2 authors_fwf.txt.


    We could also use the {base R} function readLines() to see the lines:


    ```

    readLines(authors_path)

    ```


    ```

    ## [1] "Toni Morrison    IL    DJ-1944-QF96"

    ## [2] "Kurt Vonnegut    IN    XN-5632-TP58"

    ## [3] "Walt Whitman     NY    LW-1752-TD08"

    ```


    The arguments within the readr::read_fwf() function include those listed'
