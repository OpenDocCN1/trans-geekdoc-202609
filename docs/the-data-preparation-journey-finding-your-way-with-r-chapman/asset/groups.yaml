    \    18458.\n## 11              11        18421.\n## 12              12      \
    \  18369.\n```\n\n## 12.3 Cleaning strings\n\n> “Strings are not glamorous, high-profile\
    \ components of R, but they do play a big role in many data cleaning and preparation\
    \ tasks.” —{stringr} reference page\n\nR provides some robust tools for working\
    \ with character strings. In particular, the {stringr}(Wickham, 2019b) package\
    \ is very flexible. But before we get there, we need to take a look at regular\
    \ expressions.\n\n### 12.3.1 Regular expressions\n\n> “Some people, when confronted\
    \ with a problem, think: ‘I know, I’ll use regular expressions.’ Now they have\
    \ two problems.” — Jamie Zawinski\n\nRegular expressions are a way to specify\
    \ a pattern of characters. This pattern can be specific letters or numbers (“abc”\
    \ or “123”) or character types (letters, digits, white space, etc.), or a combination\
    \ of the two.\n\nAn excellent resource for learning the basics is the vignette\
    \ “Regular Expressions,” hosted at the {stringr} package website “Regular Expressions”,\
    \ stringr.tidyverse.org¹.\n\nHere are some useful regex matching functions. Note\
    \ that the square brackets enclose the regex to identify a single character. In\
    \ the examples below, with three sets of square brackets, “[a][b][c]” contains\
    \ three separate character positions, whereas “[abc]” is identifying a single\
    \ character.\n\n| character | what it does |\n|---|---|\n| “abc” | matches “abc”\
    \ |\n| “[a][b][c]” | matches “abc” |\n| “[abc]” | matches “a”, “b”, or “c” |\n\
    | “[a-c]” | matches any of “a” to “c” (that is, matches “a”, “b”, or “c”) |\n\
    | “[ ^abc]” | matches anything except “a”, “b”, or “c” |\n| “^” | match start\
    \ of string |\n| “$” | match end of string |\n| “.” | matches any string |\n\n\
    | character | frequency of match |\n|---|---|\n| “?” | 0 or 1 |\n| “+” | 1 or\
    \ more |\n| “*” | 0 or more |\n| “{n}” | exactly n times |\n| “{n,}” | n or more\
    \ |\n| “{n,m}” | between n and m times |\n\nThese also need to be escaped:\n\n\
    | character | what it is |\n|---|---|\n| “”” | double quotation mark |\n| “‘”\
    \ | single quotation mark |\n| “\\” | backslash |\n| “\\d” | any digit |\n| “\\\
    n” | newline (line break) |\n| “\\s” | any whitespace (space, tab, newline) |\n\
    | “\\t” | tab |\n| “\\u…” | unicode characters* |\n\n¹ https://stringr.tidyverse.org/articles/regular-expressions.html\n\
    \nAn example of a unicode character² is the “interobang”, a combination of question\
    \ mark and exclamation mark.\n\n```\ninterrobang <- \"\\u2048\"\ninterrobang\n\
    ```\n\n## [1] \"?!\"\n\nCanadian postal codes follow a consistent pattern:\n\n\
    - letter digit letter, followed by a space or a hyphen, then digit letter digit\n\
    \nThe regex for this is shown below, with the component parts as follows:\n\n\
    - ^ : start of string\n- [A-Za-z] : all the letters, both upper and lower case\n\
    - \\d : any numerical digit\n- [ -]? : space or hyphen; “?” to make either optional\
    \ (i.e. it may be there or not)\n- $ : end of string\n\n```\n# regex for Canadian\
    \ postal codes\n# ^ : start of string\n# [A-Za-z] : all the letters upper and\
    \ lower case\n# \\d : any numerical digit\n# [ -]? : space or hyphen,\n#     \
    \    ? to make either optional (i.e. it may be there or not)\n# $ : end of string\n\
    \npostalcode <- \"^[A-Za-z]\\\\d[A-Za-z][ -]?\\\\d[A-Za-z]\\\\d$\"\n```\n\n> “If\
    \ your regular expression gets overly complicated, try breaking it up into smaller\
    \ pieces, giving each piece a name, and then combining the pieces with logical\
    \ operations.” —Wickham\n\n²The full list of unicode characters can be found at\
    \ the Wikipedia webpage (Wikipedia contributors, 2022a).\n\nand Grolemund, R for\
    \ Data Science (Wickham and Grolemund, 2016, p.209)\n\nThe regular expression\
    \ for Canadian postal codes can be shortened, using the case sensitivity operator,\
    \ “(?i)”. Putting this at the beginning of the expression applies it to all of\
    \ the letter identifiers in the regex; it can be turned off with “(?-i)”.\n\n\
    ```\n# option: (?i) : make it case insensitive\n#       (?-i) : turn off insensitivity\n\
    postalcode <- \"(?i)^[A-Z]\\\\d[A-Z][ -]?\\\\d[A-Z]\\\\d$(?-i)\"\n```\n\nThe postal\
    \ code for the town of Kimberley, British Columbia, is “V1A 2B3”. Here’s a list\
    \ with some variations of that code, which we will use to test our regular expression.\n\
    \n```\n# list of postal codes\npc_kimberley <- c(\"V1A2B3\", \"V1A 2B3\", \"v1a\
    \ 2B3xyz\", \"v1a-2b3\")\n```\n\n### 12.3.2 Data cleaning with {stringr}\n\nArmed\
    \ with the power of regular expressions, we can use the functions within the {stringr}\
    \ package to filter, select, and clean our data.\n\n```\nlibrary(stringr)\n```\n\
    \nAs with many R packages, the reference page provides good explanations of the\
    \ functions in the package, as well as vignettes that give working examples of\
    \ those functions. The reference page for {stringr} is stringr.tidyverse.org³.\n\
    \nLet’s look at some of the functions within {stringr} that are particularly suited\
    \ to cleaning tasks.\n\n³https://stringr.tidyverse.org/\n\n### 12.3.2.1 String\
    \ characteristics\n\n| function | purpose |\n|---|---|\n| str_subset() | character;\
    \ returns the cases which contain a match |\n| str_which() | numeric; returns\
    \ the vector location of matches |\n| str_detect() | logical; returns TRUE if\
    \ pattern is found |\n\nThe {stringr} functions str_subset() and str_which() return\
    \ the strings that have the pattern, either in whole or by location.\n\n```\n\
    # which strings have the postal code pattern?\nstr_subset(pc_kimberley, postalcode)\n\
    ```\n\n## [1] \"V1A2B3\"  \"V1A 2B3\" \"v1a-2b3\"\n\n```\n# which strings have\
    \ the postal code pattern, by location?\nstr_which(pc_kimberley, postalcode)\n\
    ```\n\n## [1] 1 2 4\n\nAnother of the {stringr} function, str_detect(), tests\
    \ for the presence of a pattern and returns a logical value (true or false). Here,\
    \ we test the list of four postal codes using the postalcode object that contains\
    \ the regular expression for Canadian postal codes.\n\n```\nstr_detect(string\
    \ = pc_kimberley, pattern = postalcode)\n```\n\n## [1] TRUE TRUE FALSE TRUE\n\n\
    As we see, the third example postal code—which contains an extra digit at the\
    \ end—returns a “FALSE” value. It might contain something that looks like a postal\
    \ code in the first 7 spaces, but because it has the extra letter, it is not a\
    \ postal code. To find a string that matches the postal code in any part of a\
    \ string, we have to change our regex to remove the start “^” and end “$” specifications:\n\
    \n```\n# remove start and end specifications\npostalcode <- \"(?i)[A-Z]\\\\d[A-Z][\
    \ -]?\\\\d[A-Z]\\\\d(?-i)\"\n```\n\n```\nstr_detect(string = pc_kimberley, pattern\
    \ = postalcode)\n```\n\n## [1] TRUE TRUE TRUE TRUE\n\nAll of the strings have\
    \ something that matches the structure of a Canadian postal code. How can we extract\
    \ the parts that match?\n\nIf we rerun the str_subset() and str_which() functions,\
    \ we see that all four of the strings are now returned.\n\n```\n# which strings\
    \ have the pattern?\nstr_subset(pc_kimberley, postalcode)\n```\n\n## [1] \"V1A2B3\"\
    \  \"V1A 2B3\"  \"v1a 2B3xyz\" \"v1a-2b3\"\n\n```\n# which strings have the pattern\
    \ (\"e\"), by location?\nstr_which(pc_kimberley, postalcode)\n```\n\n## [1] 1\
    \ 2 3 4\n\nWith those two functions, we can identify which strings have the characters\
    \ that we're looking for. To retrieve a particular string, we can use str_extract():\n\
    \n```\npc_kimberley_all <- str_extract(pc_kimberley, postalcode)\npc_kimberley_all\n\
    ```\n\n## [1] \"V1A2B3\"  \"V1A 2B3\" \"v1a 2B3\"  \"v1a-2b3\"\n\n### 12.3.2.2\
    \ Replacing and splitting functions\n\nHow can we clean up this list so that our\
    \ postal codes are in a consistent format?\n\nOur goal will be a string of six\
    \ characters, with upper-case letters and neither a space nor a hyphen.\n\nThis\
    \ table shows the functions we will use.\n"
  mdcn: "\n在第二次分析中，我们可能感兴趣的是判断加拿大劳动力是否存在季节性变化：\n\n```\nlfs_canada_employment |>\n\
