    # 6


    # Importing data: Excel


    In this chapter:


    +   - Importing data from Excel spreadsheets

    +   - Extracting data that is encoded as Excel formatting


    # 6.1 Introduction


    Spreadsheets and similar data tables are perhaps the most common way that data
    is made available. Because they originated as an electronic version of accounting
    worksheets, they have a tabular structure that works for other situations when
    data collection, storage, analysis, and sharing (i.e. publishing) are required.
    Spreadsheet software of one form or another is often standard when you buy a new
    computer, and Microsoft Excel is the most common of all. Google also makes available
    a web-based spreadsheet tool, Google Sheets that works in much the same way.


    While the data in a spreadsheet often gets stored in a manner similar to a plain-text
    file such as the CSV files we worked with in the previous chapter, Excel is designed
    to deliver far more functionality.


    Broman and Woo (Broman and Woo, 2017) provide a how-to for good data storage practice
    in a spreadsheet, but you are much more likely to find yourself working with a
    spreadsheet that doesn’t achieve that standard. Paul Murrell titled his article
    “Data Intended for Human Consumption, Not Machine Consumption” (Murrell, 2013)
    for a reason: all too often, a spreadsheet is used to make data easy for you and
    me to read, but this makes it harder for us to get it into a structure where our
    software program can do further analysis.


    Spreadsheets like Excel also have a dark side (at least when it comes to data
    storage)—the values you see are not necessarily what’s in the cell. For example,
    a cell might be the result of an arithmetic function that brings one or more values
    from elsewhere in the sheet (or in some cases, from another sheet, or anther sheet
    in another file). Some users will colour-code cells, but with no'
  - '[PAGE 65]


    index to tell you what each colour means. (Bryan, 2016b) (For an alternative vision,
    see “Sanesheets” (Bryan, 2016a).)


    The “format as data” and “formatting as information” approaches of storing information
    can make it hard for us to undertake our analysis. Excel files can also contain
    a wide variety of data format types. For example, when using Excel you will find
    that leading or trailing whitespace makes a number turn into a character, even
    if the cell is given an Excel number format.


    The {readxl} package (Wickham and Bryan, 2019) is designed to solve many of the
    challenges of reading Excel files. To access the functions in {readxl}, we use
    the library() function to load the package into our active project:


    ```

    library(readxl)

    ```


    {readxl} tries to figure out what’s going on with each variable, but like {readr}
    it allows you to override some of those automated decisions if it returns something
    different than what the analysis calls for. The {readxl} arguments we will use
    include the following:


    | argument | purpose |

    |---|---|

    | sheet = "" | a character string with the name of the sheet in the Excel workbook
    to be read |

    | range = "" | define the rectangle to be read; see the examples below for syntax
    options |

    | skip = 0 | specify how many rows to skip; the default is 0 |

    | n_max = Inf | the maximum number of records to read; the default is Inf for
    infinity, interpreted as the last row of the file |


