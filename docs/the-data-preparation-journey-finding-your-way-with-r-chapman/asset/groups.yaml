    \n\nstr_split(UVic_address, \", \")\n```\n\n```\n## [[1]]\n## [1] \"Continuing\
    \ Studies,\\n  3800 Finnerty Rd\"\n## [2] \"\\n  Victoria\"\n## [3] \"BC\"\n##\
    \ [4] \"\\n  V8P 5C2\"\n```\n\n{stringr} contains three useful functions for combining\
    \ strings. str_c() collapses multiple strings into a single string, separated\
