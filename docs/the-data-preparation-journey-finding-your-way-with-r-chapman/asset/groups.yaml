    \nThe na.interp() function also has the capacity to create non-linear models.\n\
    \nOther examples of time series missing value imputation functions can be found\
    \ in the {imputeTS} package (Moritz and Bartz-Beielstein, 2017), which offers\
    \ multiple imputation algorithms and plotting functions. A fantastic resource\
    \ for using R for time series analysis, including a section on imputation of missing\
    \ values, is (Hyndman and Athanasopoulos, 2021).\n\n## 12.7 Creating labelled\
    \ factors from numeric variables\n\nIn Chapter 7 we imported statistical software\
    \ packages such as SPSS, SAS, or Stata and saw the benefits, in certain circumstances,\
    \ of having labelled variables. These are categorical variables, where there are\
    \ a limited number of categories.\n\nIn some cases, there might be one or more\
    \ values assigned to categories we might want to designate as “missing”—a common\
    \ example can be found in surveys, where respondents are given the option of answering\
    \ “don’t know” and “not applicable.” While these responses might be interesting\
    \ in and of themselves, in some contexts we will want to assign them as missing.\n\
    \nIn other cases, numeric values are used to store the categorical responses.\n\
    \nThe Joint Canada/United States Survey of Health (JCUSH) file we saw in [Chapter\
    \ 5](#) importing fixed width files gives us a good example of where categories\
    \ are stored as numerical variables. For example, the variable `SPJ1_TYP` is either\
    \ a “1” for responses from the Canadian sample and a “2” for the sample from the\
    \ United States.\n\nWe will use this file to create labelled factors from the\
    \ numeric values in the variables we imported. Here’s the code we used previously\
    \ to read the file:\n\n```r\njcush <- readr::read_fwf(dslabs::dslabs_data(\"JCUSH.txt\"\
    ),\n        fwf_cols(\n          SAMPLEID = c(1, 12),\n          SPJ1_TYP = c(13,\
    \ 13),\n          GHJ1DHDI = c(32, 32),\n          SDJ1GHED = c(502, 502)\n  \
    \      ),\n        col_types = list(\n          SAMPLEID = col_character()\n \
    \       ))\n\nhead(jcush)\n```\n\n```\n## # A tibble: 6 x 4\n##   SAMPLEID   \
    \ SPJ1_TYP GHJ1DHDI SDJ1GHED\n##   <chr>          <dbl>    <dbl>    <dbl>\n##\
    \ 1 100003330835       1        3        4\n## 2 100004903392       1        3\
    \        2\n## 3 100010137168       1        2        1\n## 4 100010225523   \
    \    1        3        3\n## 5 100011162367       1        2        2\n## 6 100013652729\
    \       1        4        3\n```\n\nThe values for these variables are as follows:\n\
    \n| Name | Variable | Code | Value |\n|---|---|---|---|\n| SAMPLEID | Household\
    \ identifier | unique number |  |\n| SPJ1_TYP | Sample type [country] | 1 | Canada\
    \ |\n|  |  | 2 | United States |\n| GHJ1DHDI | Health Description Index | 0 |\
    \ Poor |\n|  |  | 1 | Fair |\n|  |  | 2 | Good |\n|  |  | 3 | Very Good |\n| \
    \ |  | 4 | Excellent |\n|  |  | 9 | Not Stated |\n| SDJ1GHED | Highest level of\
    \ post-secondary education attained | 1 | Less than high school |\n|  |  | 2 |\
    \ High school degree or equivalent (GED) |\n|  |  | 3 | Trades Cert, Voc. Sch./Comm.Col./CEGEP\
    \ |\n|  |  | 4 | Univ or Coll. Cert. incl. below Bach. |\n|  |  | 9 | Not Stated\
    \ |\n\nThe variable GHJ1DHDI has the respondent's self-assessment of their overall\
    \ health. Here's a summary table of the responses:\n\n```r\njcush |>\n  group_by(GHJ1DHDI)\
    \ |>\n  tally()\n```\n\n```\n## # A tibble: 6 x 2\n##   GHJ1DHDI     n\n##   \
    \   <dbl> <int>\n## 1       0   391\n## 2       1   891\n## 3       2  2398\n\
    ## 4       3  2914\n## 5       4  2082\n## 6       9    12\n```\n\nBut it would\
    \ be much more helpful and efficient if we attach the value labels to the dataframe.\n\
    \nOne strategy is to create a new factor variable, that uses the value description\
    \ instead of the numeric representation. For this, we will use the fct_recode()\
    \ function from the {forcats} package (Wickham, 2021a).\n\n```r\nlibrary(forcats)\n\
    \njcush_forcats <- jcush |>\n  # 1st mutate a new factor variable with the original\
    \ values\n  mutate(health_desc_fct = as.factor(GHJ1DHDI)) |>\n# 2nd recode the\
    \ values\nmutate(\n  health_desc_fct = fct_recode(\n    health_desc_fct,\n   \
    \ \"Poor\" = \"0\",\n    \"Fair\" = \"1\",\n    \"Good\" = \"2\",\n    \"Very\
    \ Good\" = \"3\",\n    \"Excellent\" = \"4\",\n    NULL = \"9\"\n  )\n)\n```\n\
