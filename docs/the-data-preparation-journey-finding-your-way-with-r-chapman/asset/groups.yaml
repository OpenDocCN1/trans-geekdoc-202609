    we look in more depth at some examples of recurring data cleaning challenges.


    # 12.2 Cleaning dates


    A recurring challenge in many data analysis projects is to deal with date and
    time fields. One of the first steps of any data cleaning project should be to
    ensure that these are in a consistent format that can be easily manipulated.


    As we saw in (Broman and Woo, 2017), there is an international standard (ISO 8601)
    for an unambiguous and principled way to write dates and times (and in combination,
    date-times). For dates, we write YYYY-MM-DD. Similarly,'
