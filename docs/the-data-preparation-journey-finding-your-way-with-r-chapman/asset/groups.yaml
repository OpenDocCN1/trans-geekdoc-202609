    ### 6.1 引言\n\n电子表格和类似的数据表或许是数据最常见的提供方式。由于它们起源于会计工作表的电子版本，因此具有表格结构，适用于数据收集、存储、分析以及共享（即发布）等其他情况。某种形式的电子表格软件在购买新电脑时通常是标准配置，而\
    \ Microsoft Excel 是其中最常见的。Google 还提供了一个基于网络的电子表格工具 Google Sheets，其工作原理大致相同。\n\n\
    虽然电子表格中的数据通常以与纯文本文件（如我们在上一章中使用的 CSV 文件）类似的方式存储，但 Excel 的设计是为了提供更多功能。\n\nBroman\
    \ 和 Woo（Broman and Woo, 2017）提供了在电子表格中进行良好数据存储实践的指南，但你更有可能遇到不符合该标准的电子表格。Paul Murrell\
    \ 将他的文章命名为“Data Intended for Human Consumption, Not Machine Consumption”（Murrell,\
    \ 2013）是有原因的：太多的电子表格被用来使数据对你和我来说易于阅读，但这使得我们更难将其放入软件程序可以进行进一步分析的结构中。\n\n电子表格如 Excel\
    \ 也有一面阴暗的（至少在数据存储方面）——你看到的值不一定就是单元格中的内容。例如，一个单元格可能是算术函数的计算结果，该函数从工作表的其他位置（或在某些情况下，从另一张工作表，或另一文件中的另一张工作表）获取一个或多个值。一些用户会对单元格进行颜色编码，但没有索引告诉你每种颜色的含义。（Bryan,\
    \ 2016b）（有关另一种设想，请参阅“Sanesheets”（Bryan, 2016a）。）\n\n“将格式作为数据”和“将格式作为信息”这两种存储信息的方法会使我们难以进行分析。Excel\
    \ 文件还可以包含各种各样的数据格式类型。例如，使用 Excel 时你会发现，前导或尾随的空白会使数字变成字符，即使单元格被赋予了 Excel 数字格式。\n\
    \n{readxl} 包（Wickham and Bryan, 2019）旨在解决读取 Excel 文件的许多挑战。要访问 {readxl} 中的函数，我们使用\
    \ library() 函数将包加载到活动项目中：\n\n```\nlibrary(readxl)\n```\n\n{readxl} 会尝试弄清每个变量的情况，但与\
    \ {readr} 类似，如果返回的结果与分析所需不同，你可以覆盖其中一些自动决策。我们将使用的 {readxl} 参数包括以下内容：\n\n| 参数 |\
    \ 用途 |\n|---|---|\n| sheet = \"\" | 用字符字符串指定要读取的 Excel 工作簿中的工作表名称 |\n| range =\
    \ \"\" | 定义要读取的矩形；请参阅下面的示例了解语法选项 |\n| skip = 0 | 指定要跳过的行数；默认值为 0 |\n| n_max =\
    \ Inf | 要读取的记录的最大数量；默认值为 Inf（无穷大），解释为文件的最后一行 |\n\n对于本示例，我们将使用一些模拟数据，这类数据是数据分析师在进行人力资源数据分析以支持业务决策时可能遇到的类型。文件“cr25_human_resources.xlsx”位于“cr25”文件夹中。\n\
    \n由于 Excel 文件可以包含多个工作表，因此我们需要指定要读取的工作表。{readxl} 函数 excel_sheets() 会为我们列出它们：\n\n\
    ```\nexcel_sheets(dpjr::dpjr_data(\"cr25/cr25_human_resources.xlsx\"))\n```\n\n\
