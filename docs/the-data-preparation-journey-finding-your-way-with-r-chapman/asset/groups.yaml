    # which strings have the pattern ("e"), by location?

    str_which(pc_kimberley, postalcode)

    ```


    ## [1] 1 2 3 4


    With those two functions, we can identify which strings have the characters that
    we''re looking for. To retrieve a particular string, we can use str_extract():


