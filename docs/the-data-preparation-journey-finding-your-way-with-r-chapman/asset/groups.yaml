    \ 11.6113, -5.8595, 10.4124, 4.774~\n## $ gender_male     <int> 1, 0, 0, 1, 1,\
    \ 0, 0, 1, 0, 0\n```\n\nNote that the results of this argument can be controlled\
    \ through the conversion of character variables to factors. To match the original\
    \ dataframe, we would retain the variable gender_female.\n\n```\n# create new\
    \ tb table with \"gender\" as factor\ntb3 <- tb2 |>\n```"
