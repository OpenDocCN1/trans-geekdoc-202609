    ```\n\n图 5.1 read_csv 消息。\n\n该函数返回一条消息，让我们知道每个变量被分配的类型。\n\n`{readr}` 包的参数允许对文件读取方式进行大量控制。特别有用的是以下这些：\n\
    \n| 参数 | 用途 |\n| --- | --- |\n| `col_types = cols()` | 定义变量类型 |\n| `na = \"\"\
    ` | 指定哪些值要转换为 NA |\n| `skip = 0` | 指定要跳过的行数；默认值为 0 |\n| `n_max = Inf` | 要读取的最大记录数；默认值为\
    \ Inf，表示无穷大，解释为文件的最后一行 |\n\n添加 `col_types = cols()` 参数有两个好处。首先，定义变量类型可以避免错误（例如数字字段将按数字读取，而不是字符），并加快读取过程，因为\
