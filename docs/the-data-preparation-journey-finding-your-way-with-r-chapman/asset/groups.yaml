    \ |>\n  select(\"month\", \"carrier\", \"air_time\") |>\n  group_by(carrier) |>\n\
    \  summarize(\n    n = n(),\n    min_air_time = min(air_time),\n    mean_air_time\
    \ = mean(air_time),\n    max_air_time = max(air_time)) |>\n  # enter the resulting\
    \ table into the R environment\n  collect()\n```\n\n```\n## Warning: Missing values\
    \ are always removed in SQL aggregation functions.\n## Use `na.rm = TRUE` to silence\
    \ this warning\n## This warning is displayed once every 8 hours.\n```\n\n```\n\
    SEA\n```\n\n```\n## # A tibble: 5 x 5\n##   carrier     n min_air_time mean_air_time\
    \ max_air_time\n##   <chr>   <int>        <dbl>         <dbl>        <dbl>\n##\
    \ 1 AA       365          289          336.         385\n## 2 AS       714   \
    \       277          326.         392\n## 3 B6       514          283        \
    \  330.         378\n## 4 DL      1213          275          327.         389\n\
    ## 5 UA      1117          280          326.         394\n```\n\n## 10.1.3 Using\
    \ SQL in your R code\n\nIn addition to writing native R code, we can embed SQL\
    \ inside R code. In the example below, an R chunk in the R Markdown document has\
    \ R code that uses the dbSendQuery() function. Inside this function, we first\
    \ name the connection we are using and then inside the quotation marks write SQL\
    \ code: \"SELECT * FROM flights WHERE dest = 'SEA'\".\n\nThis query instruction\
    \ gets saved as the object SEA_sql.\n\nThe R chunk then has a second line that\
    \ uses the dbFetch() function to run the SQL query.\n\nBoth the dbSendQuery()\
    \ and dbFetch() are functions from the {DBI} package.\n\n```\nSEA_sql <- dbSendQuery(con_nycf,\n\
    \    \"SELECT * FROM flights WHERE dest = 'SEA'\")\n\ndbFetch(SEA_sql)\n```\n\n\
    ## 10.2 Running SQL language chunks in R Markdown\n\nThe book *R Markdown: The\
    \ Definitive Guide* (Xie et al., 2019, Chapter 2.7.3) provides instructions on\
    \ how to set up your R Markdown in RStudio so that you can run SQL language chunks,\
    \ including using SQLite.\n\nOnce this has been done, our R Markdown document\
    \ can incorporate native SQL queries into the workflow. Note that in our SQL chunk,\
    \ we specify the connection. As we continue to work through this example, this\
    \ is the `con_nycf` object created earlier. The start of our SQL code chunk would\
    \ contain this text:\n\n```\n{sql, connection=con_nycf}\n```\n\n```\nSELECT *\n\
    FROM flights\nWHERE dest = 'SEA'\n```\n\n## 10.2.1 Mutating joins and summary\
    \ tables\n\nA mutating join is one that combines variables from two tables, based\
    \ on matching observations on *keys*.\n\nIn this R code, we create a summary table\
    \ of the flights that went from New York to Seattle, by the name of the airline.\
    \ The full airline name is not in the `flights` table; to get that, we need to\
    \ join the airline name from the `airlines` table to the Seattle summary of the\
    \ `flights` table.\n\nThe first step is to establish a connection to the `airlines`\
    \ table.\n\n```\n# establish connection to airlines table\n airlines <- tbl(con_nycf,\
    \ \"airlines\")\n```\n\nOnce the connection is made the tables can be joined using\
    \ the `left_join()` function from `{dplyr}`, the grouped summary calculation made,\
    \ and the table sorted from most to least frequent number of flights.\n\nThe table\
    \ is also formatted for publication using the `{gt}` package (Iannone et al.,\
    \ 2023); the core `gt()` function is the first step, and many other formatting\
    \ options are possible with this package.\n\n```\n# join and summary table\nflights_SEA_summary\
    \ <- flights_SEA |>\n# select(-origin, -dest) |>\n  left_join(airlines, by = \"\
    carrier\") |>\n  group_by(name) |>\n  tally() |>\n  arrange(desc(n))\n\nflights_SEA_summary\
    \ |>\n  gt()\n```\n\n| name | n |\n|---|---|\n| Delta Air Lines Inc. | 1213 |\n\
    | United Air Lines Inc. | 1117 |\n| Alaska Airlines Inc. | 714 |\n| JetBlue Airways\
    \ | 514 |\n| American Airlines Inc. | 365 |\n\nThe SQL code below returns the\
    \ same table. We can see one difference in how the code is written—it runs “inside\
    \ out” with the third step coming before the first and second, rather than in\
    \ the linear manner we are accustomed to in our R pipes.\n\n```\n-- 3. select\
    \ `name` variable from joined table and apply count\nSELECT `name`, COUNT(*) AS\
    \ `n`\nFROM (\n  SELECT `flights_sea`.*, `name`\n  -- 1. query to filter Seattle\
    \ flights\n  FROM (\n    SELECT *\n    FROM `flights`\n    WHERE (`dest` = 'SEA')\n\
    \  ) AS `flights_sea`\n  -- 2. join to airlines table\n  LEFT JOIN `airlines`\n\
    \    ON (`flights_sea`.`carrier` = `airlines`.`carrier`)\n)\n-- 4. define grouping\
    \ for COUNT (from step 3) and sort\nGROUP BY `name`\nORDER BY `n` DESC\n```\n"
