    \ (Little, 2020)、(Gelman et al., 2014, 第18章) 和 (Gelman and Hill, 2007, 第25章)）；这里介绍的是针对常见且相对简单问题的一些解决方案。\n\
    \n### 12.6.1 缺失作为格式问题\n\n一种常见的电子表格格式做法是设置一个子节标题（通常位于单独的列中），这使表格便于人阅读，但不太利于分析。在本例中我们将使用的\
    \ Excel 文件中，“Report”工作表包含不列颠哥伦比亚省国际学生支付的学费数据，以宽格式排列。具体院校名称位于第二列（在 Excel 命名法中为“B”），地区（“经济发展区域”）位于第一列。然而，地区名称只出现在该地区各院校上方的一行中。这使得表格格式美观，但如果我们想要按地区计算平均学费，就不太有用了[^5]。\n\
    \n[^5]: 该文件的创建者为我们提供了一个名为“Data”的整洁工作表，并以多种布局共享数据，值得称赞。但请注意，这种做法是例外，而不是常规。\n\n\
    我们的第一步是读取数据。请注意，代码使用 Excel 命名约定来定义要读取的矩形区域，并省略了工作表顶部的标题行和底部的注释。\n\n```\ntuition_data\
    \ <- \n  readxl::read_excel(dpjr::dpjr_data(\"intl_tuition_fees_bc.xlsx\"),\n\
    \                     sheet = \"Report\",\n```\n\n```\n## 6 Mainland/Southwest\
    \  Justice In…  13592.  13864.  14141.\n## # i abbreviated name: 1: `Economic\
    \ Development Region`\n## # i 7 more variables: `AY 2015/16` <dbl>, `AY 2016/17`\
    \ <dbl>,\n## #   `AY 2017/18` <dbl>, `AY 2018/19` <dbl>, `AY 2019/20` <dbl>,\n\
    ## #   `AY 2020/21` <dbl>, `AY 2021/22` <dbl>\n```\n\n下一步是使用 {tidyr} 包中的 drop_na()\
    \ 函数来删除任何包含 NA 值的行。在本例中，我们希望删除那些仅在第一列包含地区名称而其他列没有值的标题行。\n\n这两种解决方案产生相同的结果：\n\n\
    ```\ndrop_na(tuition_data_filled)\n```\n\n```\ntuition_data_filled |>\n  drop_na()\n\
    ```\n\n```\n## # A tibble: 25 x 12\n##   `Economic Development Region` Institution\
    \   `AY 2012/13` `AY 2013/14`\n##   <chr>                        <chr>       \
    \          <dbl>        <dbl>\n## 1 Mainland/Southwest           British Columbi…\
    \      17611.       17963.\n## 2 Mainland/Southwest           Capilano Univer…\
    \      15000        15750\n## 3 Mainland/Southwest           Douglas College \
    \      14400        15000\n## 4 Mainland/Southwest           Emily Carr Univ…\
    \      15000.       15600\n## 5 Mainland/Southwest           Justice Institu…\
    \      13592.       13864.\n## 6 Mainland/Southwest           Kwantlen Polyte…\
    \      15000        15750\n## 7 Mainland/Southwest           Langara College \
    \      16500        16950\n## 8 Mainland/Southwest           Simon Fraser Un…\
    \      16236        17862\n## 9 Mainland/Southwest           University of B…\
    \      22622.       23300.\n## 10 Mainland/Southwest           University of t…\
    \      12720        13350\n## # i 15 more rows\n## # i 8 more variables: `AY 2014/15`\
    \ <dbl>, `AY 2015/16` <dbl>,\n## #   `AY 2016/17` <dbl>, `AY 2017/18` <dbl>, `AY\
    \ 2018/19` <dbl>,\n## #   `AY 2019/20` <dbl>, `AY 2020/21` <dbl>, `AY 2021/22`\
    \ <dbl>\n```\n\n值得注意的是，drop_na() 函数提供了一个参数，我们可以指定列。这使我们可以灵活地删除某些特定变量中有“NA”的行，同时保留那些在该变量中有值但在其他变量中没有值的行。\n\
    \n### 12.6.2 缺失数值\n\n> “缺失数据是未被观测到的值，如果被观测到，对分析将是有意义的；换句话说，缺失值隐藏了一个有意义的值。”（Little,\
    \ 2020）\n\n上面用于填充缺失文本值的函数也可用于缺失数值。但在处理数值替换时，我们需要注意所使用的值将被纳入模型和分析；我们需要明确填充值是估计值，并在方法部分包含充分的文档说明。\n\
    \n此外，关于缺失值插补的主题有大量文献。作为研究者，我们需要意识到值缺失的原因：我们处理的是“完全随机缺失”、“随机缺失”还是“非随机缺失”？深入文献后你会发现，这些术语都有精确定义，我们处理缺失性所采用的解决方案将取决于数据缺失的一个或多个原因。（Little,\
    \ 2020）\n\n对于这里给出的示例，我们假设你已经对这些方法论问题进行了充分思考。正如本章前面所讨论的，我们如何清洗数据受研究问题的影响。此外，我们还需要根据原始数据为何如此来考虑清洗策略。\n\
    \n有了这些开场白，让我们转向处理一些真实数据。在本例中，数据系列是 2001 年至 2020 年加拿大不列颠哥伦比亚省住宿服务行业受薪雇员的数量。这些数据由加拿大统计局收集并发布，其中有些年份的数据被认为“太不可靠，无法发布”。这给我们的数据留下了一些空缺。\n\
    \n```\n## # A tibble: 6 x 4\n##   label ref_year REF_DATE VALUE\n##   <chr>  \
    \ <dbl> <chr>     <dbl>\n## 1 Salaried   2001 2001-01-01  4458\n## 2 Salaried\
    \   2002 2002-01-01  4392\n## 3 Salaried   2003 2003-01-01  4124\n## 4 Salaried\
    \   2004 2004-01-01  4828\n## 5 Salaried   2005 2005-01-01  4069\n## 6 Salaried\
    \   2006 2006-01-01  5048\n```\n\n我们将进行探索性数据分析，并绘制数据：\n\n```\nggplot(naics721_sal,\
    \ aes(x = ref_year, y = VALUE)) +\n  geom_line()\n```\n\n![](img/b86622d1e9ca82b3cbec45faaffaaf26_210_0.png)\n\
    \n我们的第一种方法是直接删除那些缺少值的年份。这可能有助于某些计算（例如，在 mean() 函数中加上 na.rm = TRUE 参数就是如此），但这会产生误导性的图形——2009\
    \ 年和 2015 年点之间的距离将与 2015 年和 2016 年之间的距离相同。\n\n```\nnaics721_sal |>\n  tidyr::drop_na()\
    \ |>\n  # show only first five rows\n  slice_head(n = 5)\n```\n\n```\n## # A tibble:\
    \ 5 x 4\n##   label    ref_year REF_DATE   VALUE\n##   <chr>       <dbl> <chr>\
    \      <dbl>\n## 1 Salaried     2001 2001-01-01  4458\n## 2 Salaried     2002\
    \ 2002-01-01  4392\n## 3 Salaried     2003 2003-01-01  4124\n## 4 Salaried   \
    \  2004 2004-01-01  4828\n## 5 Salaried     2005 2005-01-01  4069\n```\n\n或者，我们可以用上一个有效条目来填充该序列。\n\
    \n与我们上面看到的文本情况类似，同样的 fill() 函数也可以应用于数值变量。我们首先创建一个变量 new_value，它保存与现有变量相同的值；fill()\
    \ 函数将应用于 new_value。\n\n```\n# fill down\nnaics721_sal_new <- naics721_sal |>\n\
    \  mutate(value_fill = VALUE) |>\n  tidyr::fill(value_fill)  # default direction\
    \ is down\n\nnaics721_sal_new\n```\n\n```\n## # A tibble: 20 x 5\n##   label \
    \  ref_year REF_DATE  VALUE value_fill\n##   <chr>      <dbl> <chr>     <dbl>\
    \      <dbl>\n## 1 Salaried    2001 2001-01-01  4458       4458\n## 2 Salaried\
    \    2002 2002-01-01  4392       4392\n## 3 Salaried    2003 2003-01-01  4124\
    \       4124\n## 4 Salaried    2004 2004-01-01  4828       4828\n## 5 Salaried\
    \    2005 2005-01-01  4069       4069\n## 6 Salaried    2006 2006-01-01  5048\
    \       5048\n## 7 Salaried    2007 2007-01-01  6029       6029\n## 8 Salaried\
    \    2008 2008-01-01    NA       6029\n## 9 Salaried    2009 2009-01-01  5510\
    \       5510\n## 10 Salaried   2010 2010-01-01    NA       5510\n## 11 Salaried\
    \   2011 2011-01-01    NA       5510\n## 12 Salaried   2012 2012-01-01    NA \
    \      5510\n## 13 Salaried   2013 2013-01-01    NA       5510\n## 14 Salaried\
    \   2014 2014-01-01    NA       5510\n## 15 Salaried   2015 2015-01-01  4772 \
    \      4772\n## 16 Salaried   2016 2016-01-01  5492       5492\n## 17 Salaried\
    \   2017 2017-01-01  6557       6557\n## 18 Salaried   2018 2018-01-01  6420 \
    \      6420\n## 19 Salaried   2019 2019-01-01  7334       7334\n## 20 Salaried\
    \   2020 2020-01-01  6036       6036\n```\n\n现在，当我们绘制数据时，缺失的点会被显示出来：\n\n```\n\
    ggplot(naics721_sal_new, aes(x = ref_year, y = value_fill)) +\n  geom_line()\n\
    ```\n\n"
