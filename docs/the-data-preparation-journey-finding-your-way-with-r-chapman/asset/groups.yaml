    \n### 12.1 引言\n\n我们已经应用了一些清理方法。在导入数据的章节中，我们处理了多种可归入“数据清理”的技术，包括分配变量类型和将数据重构为整洁格式。在本章中，我们更深入地探讨一些反复出现的数据清理挑战的示例。\n\
    \n### 12.2 清理日期\n\n在许多数据分析项目中，反复出现的挑战是如何处理日期和时间字段。任何数据清理项目的第一步之一都应确保这些字段采用一致的格式，以便轻松操作。\n\
    \n正如我们在 (Broman and Woo, 2017) 中看到的，有一个国际标准（ISO 8601）用于以无歧义且有原则的方式书写日期和时间（以及组合的日期时间）。对于日期，我们写\
    \ YYYY-MM-DD。同样，时间写为 T[hh][mm][ss] 或 T[hh]:[mm]:[ss]，小时（24 小时制）后跟分钟和秒。\n\n当我们处理日期时，清理的目标是将日期转换为\
    \ ISO 8601 标准，然后在适当的情况下将该结构转换为日期类型变量。日期类型格式的好处很多，其中最不重要的是为使用日期类型变量的分析和可视化而构建的\
    \ R 工具，(Wickham et al., 2023b, Chapter 18)，同样的工具也允许我们处理捕获日期元素的变量清理。\n\n其中一个这样的包是\
    \ {lubridate}，它是 tidyverse 的一部分。\n\n#### 12.2.1 创建日期-时间字段\n\n日期在您的数据中可能表示为三种独立字段的方式之一，一个用于年份，一个用于月份，一个用于日期。这些可以组合成单个日期变量，使用\
    \ `make_date()`，或单个日期时间变量，使用 `make_datetime()`。\n\n在 {Lahman}（Friendly et al.,\
    \ 2020）表“People”中，每个球员的出生日期存储为三个独立变量。它们可以使用 `make_date()` 合并为一个变量：\n\n```r\nLahman::People\
    \ |>\n  slice_head(n = 10) |>\n  select(playerID, birthYear, birthMonth, birthDay)\
    \ |>\n  # create date variable\n  mutate(birthDate = make_date(birthYear, birthMonth,\
    \ birthDay))\n```\n\n| 球员ID | 出生年份 | 出生月份 | 出生日 | 出生日期 |\n| --- | --- | --- |\
    \ --- | --- |\n| aardsda01 | 1981 | 12 | 27 | 1981-12-27 |\n| aaronha01 | 1934\
    \ | 2 | 5 | 1934-02-05 |\n| aronto01 | 1939 | 8 | 5 | 1939-08-05 |\n| aasedo01\
    \ | 1954 | 9 | 8 | 1954-09-08 |\n| abadan01 | 1972 | 8 | 25 | 1972-08-25 |\n|\
    \ abadfe01 | 1985 | 12 | 17 | 1985-12-17 |\n| abadijo01 | 1850 | 11 | 4 | 1850-11-04\
    \ |\n| abbated01 | 1877 | 4 | 15 | 1877-04-15 |\n| abbeybe01 | 1869 | 11 | 11\
    \ | 1869-11-11 |\n| abbeych01 | 1866 | 10 | 14 | 1866-10-14 |\n\n日期存储的第二种有问题的方式是以多种经常含糊不清的序列存储。这可能包括月份的文本字符串（例如“Jan”、“January”或“Janvier”而不是“01”）、两位数的年份（“12”指的是\
    \ 2012 还是 1912？），以及月份和日期的含糊不清的顺序（“12”指的是月份的第十二天还是十二月？）\n\n如果我们知道数据存储的方式，可以使用 {lubridate}\
    \ 函数将数据处理为 YYYY-MM-DD。这三种非常不同的日期格式可以转换为一致的格式：\n\n```r\nymd(\"1973-10-22\")\n```\n\
    \n```\n## [1] \"1973-10-22\"\n```\n\n```r\nmdy(\"October 22nd, 1973\")\n```\n\n\
    ```\n## [1] \"1973-10-22\"\n```\n\n```r\ndmy(\"22-Oct-1973\")\n```\n\n```\n##\
    \ [1] \"1973-10-22\"\n```\n\n日期存储的第三种方式是使用截断表示。例如，整个月的总销售额可能记录为与“Jan 2017”或“2017-01”相关联的单个值，或季度测量可能为“2017-Q1”。\n\
    \n```r\n# month\nym(\"1973-10\")\n```\n\n```\n## [1] \"1973-10-01\"\n```\n\n```r\n\
    my(\"Oct 1973\")\n```\n\n```\n## [1] \"1973-10-01\"\n```\n\n```r\n# quarter\n\
    yq(\"1973-Q1\")\n```\n\n```\n## [1] \"1973-01-01\"\n```\n\n如果我们有一个包含年度数据的变量，就必须使用参数\
    \ `truncated = 2` 将年份转换为日期格式：\n\n```r\nymd(\"1973\", truncated = 2)\n```\n\n```\n\
    ## [1] \"1973-01-01\"\n```\n\n通过将这些各种表示形式突变为一致的 YYYY-MM-DD 格式，我们现在可以运行计算。下面示例中，我们计算加拿大劳动力在给定年份的平均规模：\n\
    \n```r\nlfs_canada_employment <- \n  read_rds(dpjr::dpjr_data(\"lfs_canada_employment.rds\"\
    ))\n```\n\n首先，我们将字符变量 `REF_DATE` 转换为日期类型变量。\n\n```r\nlfs_canada_employment <-\
    \ lfs_canada_employment |> \n  mutate(REF_DATE = ym(REF_DATE))\n```\n\n变量为日期类型后，我们可以使用\
    \ {lubridate} 中的函数进行分析。\n\n计算每年的平均就业人数：\n\n```r\nlfs_canada_employment |> \n \
    \ group_by(year(REF_DATE)) |> \n  summarize(mean(VALUE)) |> \n  slice_head(n =\
    \ 4)\n```\n\n一个 tibble：4 × 2；列 `year(REF_DATE)` 和 `mean(VALUE)` 均为 `<dbl>`。\n\n\
    | 年(REF_DATE) | 平均(VALUE) |\n| ---: | ---: |\n| 2011 | 17244. |\n| 2012 | 17476.\
    \ |\n| 2013 | 17712. |\n| 2014 | 17783. |\n\n"
