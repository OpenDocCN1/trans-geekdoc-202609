    In the following examples, we will use versions of the data in the {palmer-penguins}
    data (Horst et al., 2022; Horst, 2020). We will work with SPSS formatted files;
    the approach is similar for SAS and Stata formats, and only differs in the details.
    For example, the haven::read_() functions vary only with the extension; a Stata
    data file has the extension “.dta”, so the read function is read_dta():


    ```

    haven::read_dta(dpjr::dpjr_data("penguins.dta"))

    ```


    The equivalent for a SAS file is as follows:


    ```

    haven::read_sas(dpjr::dpjr_data("penguins.sas"))

    ```


