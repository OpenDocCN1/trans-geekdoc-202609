    在这段 R 代码中，我们按航空公司名称创建了从纽约飞往西雅图的航班的汇总表。完整的航空公司名称不在 `flights` 表中；要获取该名称，我们需要将 `airlines`\
    \ 表中的航空公司名称连接到 `flights` 表的西雅图汇总数据上。\n\n第一步是建立到 `airlines` 表的连接。\n\n```\n# establish\
