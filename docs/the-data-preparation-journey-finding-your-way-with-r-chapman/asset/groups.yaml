  - '[PAGE 198]


    changes in their boundaries, and some countries have been created only to disappear
    a few years later.


    If you’re working in the area of social and economic research, the national and
    international statistics agencies provide robust and in-depth classification systems,
    much of which is explicitly designed to allow for international comparisons. These
    systems cover a wide range of economic and social statistics. Earlier in this
    chapter there was an example using the North American Industry Classification
    System (NAICS), used in Canada, the United States, and Mexico. (Executive Office
    of the President, Office of Management and Budget, 2022, Statistics Canada (2022);
    see also Statistics Canada, 2020). A similar classification system exists for
    Australia and New Zealand (Australian Bureau of Statistics, 2006), and the European
    Union’s Eurostat office publishes a standard classification system for the products
    that are created through mining, manufacturing, and material recovery (EUROSTAT
    PRODCOM team, 2022). For international statistics, you can start with the classification
    system maintained by the United Nations Statistics Division (United Nations Statistics
    Division, 2020). In Chapter 6, we saw population statistics reported by the administrative
    geography of England and Wales.


    Following these standardized categories in our own work is advantageous. It provides
    us with a validated structure, and should it be appropriate, gives us access to
    other data that can be incorporated into our own research.


    Your subject area has established classifications; seek them out and use them.
    Ensuring that your data can be combined with and compared to other datasets will
    add value to your analysis, and make it easier for future researchers (including
    future you!) to work with your data. (White et al., 2013)


    # 12.5 Indicator variables


    > To include a categorical variable in a regression, a natural approach is to
    construct an ‘indicator variable’ for each category. This allows a separate effect
    for each level of the category, without assuming any ordering or other structure
    on the categories. (Gelman et al., 2014, p.366)'
