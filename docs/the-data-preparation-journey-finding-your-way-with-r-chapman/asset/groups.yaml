  - '[PAGE 177]


    can be specific letters or numbers (“abc” or “123”) or character types (letters,
    digits, white space, etc.), or a combination of the two.


    An excellent resource for learning the basics is the vignette “Regular Expressions,”
    hosted at the {stringr} package website “Regular Expressions”, stringr.tidyverse.org¹.


    Here are some useful regex matching functions. Note that the square brackets enclose
    the regex to identify a single character. In the examples below, with three sets
    of square brackets, “[a][b][c]” contains three separate character positions, whereas
    “[abc]” is identifying a single character.


    | character | what it does |

    |---|---|

    | “abc” | matches “abc” |

    | “[a][b][c]” | matches “abc” |

    | “[abc]” | matches “a”, “b”, or “c” |

    | “[a-c]” | matches any of “a” to “c” (that is, matches “a”, “b”, or “c”) |

    | “[ˆabc]” | matches anything except “a”, “b”, or “c” |

    | “^” | match start of string |

    | “$” | match end of string |

    | “.” | matches any string |


    | character | frequency of match |

    |---|---|

    | “?” | 0 or 1 |

    | “+” | 1 or more |

    | “*” | 0 or more |

    | “{n}” | exactly n times |

    | “{n,}” | n or more |

    | “{n,m}” | between n and m times |


    These also need to be escaped:


    | character | what it is |

    |---|---|

    | “”” | double quotation mark |

    | “‘” | single quotation mark |

    | “\” | backslash |

    | “\d” | any digit |

    | “\n” | newline (line break) |

    | “\s” | any whitespace (space, tab, newline) |

    | “\t” | tab |

    | “\u…” | unicode characters* |


    ¹ https://stringr.tidyverse.org/articles/regular-expressions.html'
  - '[PAGE 178]


    An example of a unicode character² is the “interobang”, a combination of question
    mark and exclamation mark.


    ```

    interrobang <- "\u2048"

    interrobang

    ```


    ## [1] "?!"


    Canadian postal codes follow a consistent pattern:


    +   - letter digit letter, followed by a space or a hyphen, then digit letter
    digit


    The regex for this is shown below, with the component parts as follows:


    +   - ^ : start of string

    +   - [A-Za-z] : all the letters, both upper and lower case

    +   - \d : any numerical digit

    +   - [ -]? : space or hyphen; “?” to make either optional (i.e. it may be there
    or not)

    +   - $ : end of string


    ```

    # regex for Canadian postal codes

    # ^ : start of string

    # [A-Za-z] : all the letters upper and lower case

    # \d : any numerical digit

    # [ -]? : space or hyphen,

    #         ? to make either optional (i.e. it may be there or not)

    # $ : end of string


    postalcode <- "^[A-Za-z]\\d[A-Za-z][ -]?\\d[A-Za-z]\\d$"

    ```


    > “If your regular expression gets overly complicated, try breaking it up into
    smaller pieces, giving each piece a name, and then combining the pieces with logical
    operations.” —Wickham


    ²The full list of unicode characters can be found at the Wikipedia webpage (Wikipedia
    contributors, 2022a).'
  - '[PAGE 179]


    and Grolemund, R for Data Science (Wickham and Grolemund, 2016, p.209)


    The regular expression for Canadian postal codes can be shortened, using the case
    sensitivity operator, “(?i)”. Putting this at the beginning of the expression
    applies it to all of the letter identifiers in the regex; it can be turned off
    with “(?-i)”.


    ```

    # option: (?i) : make it case insensitive

    #       (?-i) : turn off insensitivity

    postalcode <- "(?i)^[A-Z]\\d[A-Z][ -]?\\d[A-Z]\\d$(?-i)"

    ```


    The postal code for the town of Kimberley, British Columbia, is “V1A 2B3”. Here’s
    a list with some variations of that code, which we will use to test our regular
    expression.


    ```

    # list of postal codes

    pc_kimberley <- c("V1A2B3", "V1A 2B3", "v1a 2B3xyz", "v1a-2b3")

    ```


    # 12.3.2 Data cleaning with {stringr}


    Armed with the power of regular expressions, we can use the functions within the
    {stringr} package to filter, select, and clean our data.


    ```

    library(stringr)

    ```


    As with many R packages, the reference page provides good explanations of the
    functions in the package, as well as vignettes that give working examples of those
    functions. The reference page for {stringr} is stringr.tidyverse.org³.


    Let’s look at some of the functions within {stringr} that are particularly suited
    to cleaning tasks.


    ³https://stringr.tidyverse.org/'
  - '[PAGE 180]


    # 12.3.2.1 String characteristics


    | function | purpose |

    |---|---|

    | str_subset() | character; returns the cases which contain a match |

    | str_which() | numeric; returns the vector location of matches |

    | str_detect() | logical; returns TRUE if pattern is found |


    The {stringr} functions str_subset() and str_which() return the strings that have
    the pattern, either in whole or by location.


    ```

    # which strings have the postal code pattern?

    str_subset(pc_kimberley, postalcode)

    ```


    ## [1] "V1A2B3"  "V1A 2B3" "v1a-2b3"


    ```

    # which strings have the postal code pattern, by location?

    str_which(pc_kimberley, postalcode)

    ```


    ## [1] 1 2 4


    Another of the {stringr} function, str_detect(), tests for the presence of a pattern
    and returns a logical value (true or false). Here, we test the list of four postal
    codes using the postalcode object that contains the regular expression for Canadian
    postal codes.


    ```

    str_detect(string = pc_kimberley, pattern = postalcode)

    ```


    ## [1] TRUE TRUE FALSE TRUE


    As we see, the third example postal code—which contains an extra digit at the
    end—returns a “FALSE” value. It might contain something that looks like a postal
    code in the first 7 spaces, but because it has the extra letter, it is not a postal
    code. To find a string that matches the postal code in any part of a string, we
    have to change our regex to remove the start “^” and end “$” specifications:


    ```

    # remove start and end specifications

    postalcode <- "(?i)[A-Z]\\d[A-Z][ -]?\\d[A-Z]\\d(?-i)"

    ```'
