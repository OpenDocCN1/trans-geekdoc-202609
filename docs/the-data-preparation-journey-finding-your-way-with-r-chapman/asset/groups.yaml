    \n```r\nx <- c(1, NA, 3)\nx\n```\n\n```\n## [1]  1 NA  3\n```\n\n从1到3的序列中间有一个NA值。na.interp()函数会填充这个缺失值。\n\
    \n```r\nforecast::na.interp(x)\n```\n\n```\n## Registered S3 method overwritten\
    \ by 'quantmod':\n##  method       from\n##  as.zoo.data.frame zoo\n\n## Time\
    \ Series:\n## Start = 1\n## End = 3\n## Frequency = 1\n## [1] 1 2 3\n```\n\n对于更长的序列，也会发生类似的过程：\n\
    \n```r\ny <- c(1, NA, NA, 3)\ny\n```\n\n```\n## [1]  1 NA NA  3\n```\n\n```r\n\
