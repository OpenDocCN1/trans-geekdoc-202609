    We can specify a range of rows; let''s set up the first two rows as our tester
    sample.


    ```

    tester <- bcf_11_lines[[1]][13:14]

    ```


    So how will we split this into separate pieces? Here''s where the {stringr} package
    and our knowledge of regular expressions comes into use. We want to split the
    string where there are multiple spaces. If we split at every space, we''d get
    lots of columns. So we are separating (or splitting) where the spaces occur.


    The regular expression to find any white space is “\s”, and to find any number
    of them we need to add the plus sign “+”. Remember that in R, we need to escape
    the backslash, so our regex gets expresses as “\\s+”.


    ```

    test_result <- str_split(tester, "\\s+")

    test_result

    ```


