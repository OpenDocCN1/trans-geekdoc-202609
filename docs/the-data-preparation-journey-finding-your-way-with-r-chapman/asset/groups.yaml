    \ col_names = c())` | a list of the character length of each variable, and their\
    \ names |\n| `fwf_positions(start = , end = , col_names = c())` | character position\
    \ of the start and end of each variable, and their names |\n| `fwf_cols(variable1_name\
    \ = c(), variable2_name = c())` | name followed by start and end position of each\
    \ variable) |\n| `fwf_cols(variable1_name = width, variable2_name = width)` |\
    \ name followed by width of each variable) |\n\nThe examples below will elaborate\
    \ on these arguments.\n\nThe first approach would be to allow {readr} to guess\
    \ where the column breaks are. The fwf_empty() function looks through the specified\
    \ file and returns the beginning and ending locations it has guessed, as well\
    \ as the skip value that the read_fwf() function uses.\n\nNote that the column\
    \ names are specified in a list.\n\n```\n```r\nfwf_empty(\n  authors_path,\n \
    \ col_names = c(\"first\", \"last\", \"state\", \"unique_id\")\n)\n```\n```\n\n\
    ```\n```\n## $begin\n## [1] 0 5 20 30\n##\n## $end\n## [1] 4 13 22 NA\n##\n##\
    \ $col_names\n## [1] \"first\"   \"last\"    \"state\"   \"unique_id\"\n```\n\
    ```\n\nThat information can then be used by the read_fwf() function:\n\n```\n\
    ```r\nread_fwf(authors_path,\n    fwf_empty(\n      authors_path,\n```\n```"
