    It is assumed that the reader of this book will have a working knowledge of the
    fundamental data manipulation functions in R (whether base or tidyverse or packages
    beyond those) or another programming language that supports that work. If you
    can filter for specific values in the variables and select the columns you want,
    know the difference between a character string and a numeric value ("1" or 1),
    and can create a new variable as the result of a manipulation of others, then
    we’re on our way.


    This book leans heavily on R Markdown, particularly when it comes to describing
    documentation and the packages of the tidyverse. Familiarity with both will be
    very helpful.


    If you don’t possess that knowledge yet, I would recommend that you work through
    *R for Data Science (2nd edition)* by Hadley Wickham, Mine Çetinkaya-Rundel, and
    Garrett Grolemund (Wickham et al., 2023b). This book, freely available at [4ds.hadley.nz](https://r4ds.hadley.nz/),
    will give you a running start.


    While some of the topics covered here may be similar to what you’ll find in *R
    for Data Science* and other introductory books and similar resources, it is hoped
    that the examples in this book add more context and expose you to greater technical
    challenges.


    # Outline


    The first three chapters of this book provide some foundations, elements of the
    data preparation process that will help guide our thinking and our work, including
    data documentation (or recordkeeping).


    [Chapters 4](#) through [10](#) cover importing data from a variety of sources
    that are commonly encountered, including plain-text, Excel, statistical software
    formats, PDF files, internet sources, and databases.


    [Chapters 11](#) and [12](#) tackle finding problems in our data, and then dealing
    with those problems.


    Finally [Chapter 13](#) presents a short summary and poses the question, “Where
    to from here?”


    ²[https://r4ds.hadley.nz/](https://r4ds.hadley.nz/)'
