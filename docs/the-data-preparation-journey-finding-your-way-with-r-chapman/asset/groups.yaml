    The R package {haven} allows us to capture all of this information.


    # 7.1.2.1 Read SPSS data into R


    For the first step, we will read in the data from the SPSS file with the default
    parameters.


    ```

    df_video <- read_spss(dpjr::dpjr_data("Video_SPSS.sav"))


    # display the data in the console

    df_video

    ```


