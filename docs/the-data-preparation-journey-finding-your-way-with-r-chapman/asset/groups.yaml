    # 3.4.1 README files


    > > Benjamin D. Lee’s fourth rule in “Ten simple rules for documenting scientific
    software” (Lee, 2018) is “Include a README file with basic information.”


    Having a README file in the root folder of your project is a good place to capture
    a great deal of the important general information about the project. And having
    another README in the data folder wouldn’t hurt either.


    Another source that describes a README for data files is the “Guide to writing”readme”
    style metadata” written by the Research Data Management Service Group at Cornell
    University. (Research Data Management Service Group, 2021)


    The SFBrigade, a San Francisco volunteer civic tech group, has created a data
    science specific README outline for their projects, hosted at github¹.


    The basic minimum README structure recommended is:


    ¹Project-README-template.md(https://github.com/sfbrigade/data-science-wg/blob/master/dswg_project_resources/Project-README-template.md)'
