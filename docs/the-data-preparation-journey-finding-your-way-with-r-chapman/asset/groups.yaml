    \n本章内容：\n\n- 从PDF文件中读取数据和文本\n- 将生成的对象处理成整洁的结构\n\n### 8.1 PDF文件\n\n> 便携式文档格式（PDF）是Adobe于1992年开发的一种文件格式，用于展示文档（包括文本格式和图像），其呈现方式独立于应用软件、硬件和操作系统<sup>1</sup>。\n\
