    \ 2019b）。\n\n```\n# 读取PDF文件内容\nlibrary(pdftools)\n\n# 数据整理包\nlibrary(dplyr)\n\
    library(tidyr)\n\n# 字符串处理\nlibrary(stringr)\n```\n\n### 8.1.1 开始入门\n\n要从PDF文件中读取数据，我们从一个{palmerpenguins}（Horst\
    \ et al., 2022; Horst, 2020）数据摘要中读取数据。\n\n虽然这是针对单页上的单个表格，但如果每页上每个表格的结构相同，同样的方法也适用于跨多页的多个表格。过程始终相同：从最小的单元开始，然后向外扩展。\n\
    \n- PDF文件的读取方式中，最小的单元是单行。\n- 将其扩展到整个表格。在此阶段结束时应用列拆分和分配标题。\n- 如果有多个结构相同的表格，则下一步通过循环处理每个表格。\n\
    - 一旦你成功处理了单页，就可以循环处理多页。\n\n我们使用来自{pdftools}包的pdf_text()函数读取文件的全部内容，并将内容分配给环境中的一个R对象。\n\
    \n接下来，我们使用str()函数显示新对象结构的摘要。\n\n```\npenguin_summary <- pdf_text(dpjr::dpjr_data(\"\
    penguin_summary.pdf\"))\n```\n\n```\nstr(penguin_summary)\n```\n\n```\nchr \"\
    \ species island mean_flipper_length_mm mean_body_mass_g\\n\\n1 Adelie Biscoe\
    \ 188.795\"| __truncated__\n```\n\n## 图 8.1 来自PDF文件的企鹅数据。\n\n这样我们得到的结果是单个字符串，包含文件内容。在此示例中，只有一页，因此只有一个字符串。如果你处理的是多页文档，每一页都会有自己的字符串。\n\
    \n在视觉浏览此输出时，我们看到变量名以species开头。在最后一个变量mean_body_mass_g之后有两个换行符，表示为“\\n”（读作“反斜杠n”）。我们将使用这些换行符作为解析过程的一部分。\n\
    \n查看页面内容的另一种方法是使用cat()函数（来自{base R}），它按打印方式显示内容：\n\n```\ncat(penguin_summary)\n\
    ```\n\n```\n## species island mean_flipper_length_mm mean_body_mass_g\n##\n##\
    \ 1 Adelie Biscoe 188.7955 3709.659\n##\n## 2 Adelie Dream 189.7321 3688.393\n\
    ##\n## 3 Adelie Torgersen 191.1961 3706.373\n##\n## 4 Chinstrap Dream 195.8235\
    \ 3733.088\n##\n## 5 Gentoo Biscoe 217.1870 5076.016\n```\n\n接下来，我们使用strsplit()函数（来自{base\
    \ R}）将长字符串拆分为单独的行。正如我们注意到的，每一行末尾都有两个“\\n”字符对；如果在strsplit()函数中只使用一个，则数据行之间会出现额外的行。\n\
    \n```\npenguin_summary_2 <- penguin_summary |>\n  strsplit(split = \"\\n\\n\"\
    )\n\npenguin_summary_2\n```\n\n```\n## [[1]]\n## [1] \" species  island  mean_flipper_length_mm\
    \ mean_body_mass_g\"\n## [2] \"1 Adelie  Biscoe          188.7955          3709.659\"\
    \n## [3] \"2 Adelie  Dream           189.7321          3688.393\"\n## [4] \"3\
    \ Adelie  Torgersen       191.1961          3706.373\"\n## [5] \"4 Chinstrap Dream\
    \          195.8235          3733.088\"\n## [6] \"5 Gentoo   Biscoe          217.1870\
    \          5076.016\\n\"\n```\n\n在此阶段，我们需要进行一些清理。如果现在不处理，稍后会造成一些麻烦。最后一个数据单元格的末尾有多余的回车符，所以让我们使用正则表达式将其删除。第一行开头也有空格，数据行开头有“数字-空格”组合。\n\
    \n通过在第一行中使用双方括号访问器，返回的对象不再嵌套，而是每一行都有一个单独的字符串。\n\n```\npenguin_summary_3 <- penguin_summary_2[[1]]\
    \ |>\n  str_remove(\"\\\\n$\") |>\n  str_remove(\"^\\\\s+\") |>\n  str_remove(\"\
    ^\\\\d \")\n```\n\n接下来，我们创建一个包含变量名的列表对象，以便将名称与最终表格中的数据分开。这通过将包含名称的行（第1行，使用方括号[1]标识）分配给一个单元素向量来完成。\n\
    \n```\npenguin_variable_vector <- as.vector(penguin_summary_3[1])\n\npenguin_variable_vector\n\
    ```\n\n```\n## [1] \"species    island    mean_flipper_length_mm mean_body_mass_g\"\
    \n```\n\n下一步是在有一个或多个空白的位置将此向量拆分为4个单独的元素，这些空白通过正则表达式“\\s+”标识。“\\s”匹配单个空格，添加“+”将其扩展为“一个或多个”前面的字符。\n\
    \n这将返回另一个嵌套列表。\n\n```\npenguin_variable_list <- str_split(penguin_variable_vector,\
    \ \"\\\\s+\")\npenguin_variable_list\n```\n\n```\n## [[1]]\n## [1] \"species\"\
    \            \"island\"\n## [3] \"mean_flipper_length_mm\" \"mean_body_mass_g\"\
    \n```\n\n为了获得我们所需的结构，我们对结果应用unlist()函数。\n\n```\npenguin_variable_names <- unlist(penguin_variable_list)\n\
    penguin_variable_names\n```\n\n```\n## [1] \"species\"            \"island\"\n\
    ## [3] \"mean_flipper_length_mm\" \"mean_body_mass_g\"\n```\n\n可以通过将字符串拆分包装在unlist()中将这两个步骤合并为一个：\n\
    \n```\npenguin_variable_names <-\n  unlist(str_split(penguin_variable_vector,\
    \ \"\\\\s+\"))\npenguin_variable_names\n```\n\n```\n## [1] \"species\"       \
    \     \"island\"\n## [3] \"mean_flipper_length_mm\" \"mean_body_mass_g\"\n```\n\
    \n下一步是使用for循环构建表格。（参见（Wickham et al., 2023b，第27章 迭代）以了解此过程的回顾。）\n\n```\n# 1. 定义输出\n\
    penguin_table <- tibble(value = NULL)\n\n# 2. 循环遍历每一行\n# 因为第一个元素是标题，\n# 我们需要长度短一个\n\
    loop_length <- length(penguin_summary_3) - 1\n\nfor (i in 1:5) {\n  j <- i + 1\n\
    \  dat <- as_tibble(penguin_summary_3[j])\n  penguin_table <- bind_rows(penguin_table,\
    \ dat)\n}\n\npenguin_table\n```\n\n```\n## # A tibble: 5 x 1\n##   value\n## \
    \  <chr>\n## 1 Adelie   Biscoe          188.7955    3709.659\n## 2 Adelie   Dream\
    \           189.7321    3688.393\n## 3 Adelie   Torgersen       191.1961    3706.373\n\
    ## 4 Chinstrap Dream           195.8235    3733.088\n## 5 Gentoo   Biscoe    \
    \      217.1870    5076.016\n```\n\n循环创建了一个只有一列value的tibble。我们将应用separate()函数将value拆分为之前分配给对象penguin_variable_names的每个变量名。拆分基于原始字符串中一个或多个空格的位置，使用“\\\
    s+”正则表达式。\n\n```\npenguin_table <- tidyr::separate(\n  penguin_table,\n  value,\n\
    \  into = penguin_variable_names,\n  \"\\\\s+\"\n)\n\npenguin_table\n```\n\n```\n\
    ## # A tibble: 5 x 4\n##   species   island   mean_flipper_length_mm mean_body_mass_g\n\
    ```\n\n"
