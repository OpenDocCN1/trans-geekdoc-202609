  mdcn: "\n```\n## +-- readme.md\n## \\-- scripts\n##     \\-- readme.md\n```\n\n\
    Marwick、Boettinger 和 Mullen 提供了一些文件结构可能是什么样子的具体示例；请注意，该结构明确遵循 R 包的结构。他们展示的“中等规模汇编”图如下（Marwick\
    \ et al., 2018, p.84）：\n\n![](img/b86622d1e9ca82b3cbec45faaffaaf26_41_0.png)\n\
    \n图 3.1 中等研究汇编。\n\n在此示例中，有些元素可能与每个项目都无关（例如，代码和数据的许可证）。但请注意，数据与生成分析的代码之间有明确的分离。此外，这种结构得到了“项目”方法的良好支持，其中此处显示为“COMPENDIUM”的文件夹将是项目的根文件夹。我们需要的一切都包含在该单个文件夹中。\n\
    \n### 3.4.3 数据字典或代码本\n\n正如我们将看到的，准备数据需要在过程中进行许多步骤，既有客观的也有主观的。创建这些决策的文档至关重要。该文档将作为数据来源的记录（如果还能包含收集细节的具体信息会更好，例如日期、收集方式和原始调查问卷），以及在重新编码和创建新变量时所做的假设和决策等等。\n\
    \n以下是数据字典的三个最低组成部分：\n\n```\n##  2  island      -  dbl+lbl  0\n##\n##\n##  3  bill_length_mm\
    \  -  dbl  2\n##  4  bill_depth_mm  -  dbl  2\n##  5  flipper_length_mm -  dbl\
    \  2\n##  6  body_mass_g  -  dbl  2\n##  7  sex  -  dbl+lbl  11\n##\n##  8  year\
    \  -  dbl  0\n## values\n## [1] Adelie\n## [2] Chinstrap\n## [3] Gentoo\n## [1]\
    \ Biscoe\n## [2] Dream\n## [3] Torgersen\n##\n##\n##\n##\n## [1] female\n## [2]\
    \ male\n##\n```\n\n## 4 导入数据\n\n本章内容：\n\n- 导入数据的指南\n- 为后续章节奠定基础\n\n### 4.1 引言\n\
    \n数据已经收集。它可能是以下结果：\n\n- 在受控实验室环境中进行试验或实验。\n- 进行观察并记录观察结果（如天文学家或生物学家可能会做的）。\n-\
    \ 对某一地区的人进行抽样并向他们提出一系列问题。\n- 作为业务运营的一部分收集信息。一个熟悉的例子是超市收银扫描仪，它们收集关于杂货购买的数据。这些数据随后通过跟踪销售和库存并生成订单来促进商店的运营管理。\n\
    \n一旦数据被收集，分析过程中的第一步之一就是导入数据——读取文件（或文件）的内容并开始为分析准备该数据。你可能自己收集了数据并设计了数据存储。或者在原始来源和它呈现给你的方式之间可能有一层处理。经过此处理后，你可能会：\n\
    \n- 可以访问存储原始数据的数据库，包括可能进行收集后额外操作的地方，\n- 被发送一个包含原始数据样本的文件，\n- 能够从网站下载数据，其中下载的表格包含已从更大的数据集中编译和汇总的数据。一个例子是某个国家的人口普查数据表。\n\
    \n需要注意的是，你的分析项目可能需要以上一种以上的数据收集方法。\n\n你需要的数据如何组装将取决于许多因素，包括已有的内容、你的预算（例如，一些商业相关数据由公司收集，然后以成本提供），以及法律和监管环境（请注意，“个人信息”的定义因司法管辖区而异）。\n\
    \n“导入”步骤的具体细节将因文件格式和变量等因素而异，我们将在下一章中探讨所有这些内容。\n\n### 4.2 数据格式\n\n数据以多种电子格式存储。格式的选择可能受以下任何因素的影响：\n\
    \n- 数据收集者的基本需求（某些文件格式针对特定用途而定制）；\n- 收集者可用的技术；\n- 所收集数据的性质。\n\n对于特定用例的最佳格式，有时（经常？）没有正确答案——每种格式都有利有弊。（话虽如此，数据存储和共享时通常有明显不太好的选择——我们看你，PDF。）这意味着在你的工作流程中，你必须处理需要从众多系统提取的数据，并且这些数据将以多种格式提供给你。\n\
    \n统计学家能够与数据库专家交流至关重要，并且作为团队成员，统计学家与其他大多数人一样，预计能够自行使用数据库设施用于大多数目的，当然也可以就设计方面提供建议。在分析开始之前，几乎无论数据库专家的工作多么出色，总是有大量的初步“数据清理”工作要做。（Venables,\
    \ 2010）\n\n有大量资源详细说明了不同数据存储格式的复杂性，以及确定特定用例适当格式的决策过程。我总是假设构建数据存储系统的专业人员做出了明智的决定，包括在不同格式之间平衡各种权衡，以及他们可能面临的预算和技术限制。\n\
    \n### 4.3 导入数据\n\n这里有一些值得注意的建议：\n\n1. 导入函数中的参数是你的朋友。在项目工作流程中将它们用作你的第一道防线。\n\n\
    \   > “我的主要导入建议：使用**导入函数的参数尽可能快地尽可能深入**。*[特别强调。]* 初学者代码通常有很多不必要的导入后调整。阅读导入函数的文档并充分利用参数来控制导入。”\
    \ (Bryan and The STAT 545 TAs, 2019, Chapter 9: Writing and reading files)\n\n\
    \   实际上，这意味着导入函数的第一次迭代几乎肯定不会产生你想要的结果。我们很快就会看到一些例子，但这可能体现在变量名称或值的存储方式、缺失值的表示方式或电子表格的几何结构上。read\
    \ 函数中的参数将允许你解决所有这些问题，甚至更多。返回并向函数添加参数，然后再次运行代码，反复运行，直到达到所需的位置。\n\n2. 纯文本很无聊，但在长远来看是一种更灵活、更适应性强的格式；“今天的输出是明天的输入”\
    \ (Bryan and The STAT 545 TAs, 2019, Chapter 9: Writing and reading files)\n\n\
    \   > “在你有**实际证明**这行不通之前，以人类在文本编辑器中可读的纯文本文件作为你的默认选择。读写奇特或专有格式将是未来或在不同计算机上首先出现问题的地方。它也为使用不同工具包的人制造了障碍。保持软件无关。力求面向未来和傻瓜式。”\
    \ (Bryan and The STAT 545 TAs, 2019, Chapter 9: Writing and reading files)\n\n\
    #### 4.3.1 检查你的结果\n\n在任何主要处理步骤后快速检查数据总是一个好主意。这可以从导入数据开始，但不限于此。\n\n有些关于数据的问题需要问：\n\
    \n- 导入步骤是否给了你预期数量的记录（行）？\n- 变量（列）的数量是否如你预期？\n- 这些变量的变量类型（或类）是否符合你的预期？\n  - 应该为数字的变量是否加载为数值类型，还是字符类型？\n\
    \  - 如果使用标记变量，它们是否加载为因子类型？\n- 缺失值是如何表示的？\n  - 正如我们将在下一章看到的，许多导入函数提供了根据特定字符编码 NA\
    \ 值的灵活性。\n\n我们将在《验证策略》章节中查看调查数据内容的结构化方法。在接下来的几章中，我们将重点关注读取不同类型文件内容的过程。\n\n####\
    \ 4.3.2 结论\n\n为了从不同文件类型导入数据，我们需要不同的 R 函数，我们将在下一章中深入探讨。虽然具体细节因文件类型而异，但有两个一般原则值得注意：\n\
    \n1. 使用导入函数的参数尽可能快地尽可能深入。\n2. 在导入步骤结束时检查你的结果——不要等到后来才发现出了问题。\n\n"
