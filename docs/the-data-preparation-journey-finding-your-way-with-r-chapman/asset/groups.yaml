    \n使用 `slice_tail()` 查看底部 10 行。\n\n```r\nuk_census_behead |>\n  select(field0:field4,\
    \ gender, numeric) |>\n  slice_tail(n = 10)\n```\n\n```text\n## # A tibble: 10\
    \ x 7\n##   field0 field1 field2 field3 field4 gender numeric\n##   <chr>  <chr>\
    \  <chr>  <chr>  <chr>  <chr>  <dbl>\n## 1 England … Wales South… Somer… Blaen…\
    \ Males  32800\n## 2 England … Wales South… Somer… Torfa… All p… 92300\n## 3 England\
    \ … Wales South… Somer… Torfa… Femal… 47400\n## 4 England … Wales South… Somer…\
    \ Torfa… Males  44900\n## 5 England … Wales South… Somer… Monmo… All p… 93000\n\
    ## 6 England … Wales South… Somer… Monmo… Femal… 47400\n## 7 England … Wales South…\
    \ Somer… Monmo… Males  45600\n## 8 England … Wales South… Somer… Newpo… All p…\
    \ 159600\n## 9 England … Wales South… Somer… Newpo… Femal… 81200\n## 10 England\
    \ … Wales South… Somer… Newpo… Males  78400\n```\n\n等等！我们不是学过威尔士没有按地区划分，而且没有单一管理区级别的划分吗？此外，你可能也已经知道\
    \ Somerset 在英格兰，而不是威尔士。出了什么问题？\n\n## 6.2 扩展示例\n\n对数据尾部（上文）的检查揭示了 Excel 文件结构存在问题，这（在很大程度上）反映了层级关系的本质。这不是\
    \ {tidyr} 和 {unpivotr} 函数的问题！这些函数完全正确地执行了操作。值是从“left-up”找到的值中提取的。\n\n首先引起我注意的是，`field2`——地区——对于威尔士应该是\
    \ NA，但它被分配给了 South West，即数据中最后一个英格兰地区。\n\n更成问题的是，威尔士单一管理区（W06）应位于 `field3`，与英格兰单一管理区（E06）处于同一层级，但实际上却被分配到了\
    \ `field4`。这导致英格兰的 Somerset 被分配到了我们期望看到威尔士单一管理区名称的列中。\n\n让我们查看威尔士单一管理区的第一行的详细信息。首先，在\
    \ `uk_census` 对象中，我们看到名称（“Isle of Anglesey”）的 `local_format_id` 值为 60。\n\n```r\n\
    uk_census |>\n  dplyr::filter((row == 361)) |>\n  select(address, local_format_id,\
    \ data_type, character, numeric)\n```\n\n一个 tibble：5 × 5\n\n|    | 地址 | 本地格式ID\
    \ | 数据类型 | 字符 | 数值 |\n|----|---------|-----------------|-----------|------------------|---------|\n\
    | 1  | A361    | 11              | character | W06000001        | NA      |\n\
    | 2  | B361    | 60              | character | Isle of Anglesey | NA      |\n\
    | 3  | C361    | 33              | numeric   | <NA>             | 68900   |\n\
    | 4  | D361    | 33              | numeric   | <NA>             | 35200   |\n\
    | 5  | E361    | 33              | numeric   | <NA>             | 33700   |\n\n\
    然后我们可以用它来检查缩进格式的详细信息，我们已将其捕获在 formats 对象中。\n\n```r\nuk_census_formats$local$alignment$indent[60]\n\
    ```\n\n```text\n## [1] 4\n```\n\n有 4 个缩进。你会记得 `behead_if()` 函数是在向左和向上查找。在威尔士条目的情况下，该函数一直向左和向上查找，直到找到一个缩进更少的实体，而该实体恰好在英格兰，而不是威尔士。\n\
    \n```r\nuk_census_behead |>\n  select(row, col, starts_with(\"field\")) |>\n \
    \ arrange(row, col) |>\n  mutate(field1 = if_else(field0 == lag(field0, n = 3),\
    \ field1, NA)) |>\n  mutate(field2 = if_else(field1 == lag(field1, n = 3), field2,\
    \ NA)) |>\n  mutate(field3 = if_else(field2 == lag(field2, n = 3), field3, NA))\
    \ |>\n  mutate(field4 = if_else(field3 == lag(field3, n = 3), field4, NA))\n```\n\
    \n```text\n## # A tibble: 1,125 x 7\n##     row   col field0      field1 field2\
    \ field3 field4\n##     <int> <int> <chr>       <chr>  <chr>  <chr>  <chr>\n##\
    \  1     8     3 England and… <NA>   <NA>   <NA>   <NA>\n##  2     8     4 England\
    \ and… <NA>   <NA>   <NA>   <NA>\n##  3     8     5 England and… <NA>   <NA> \
    \  <NA>   <NA>\n##  4     9     3 England and… Engla… <NA>   <NA>   <NA>\n## \
    \ 5     9     4 England and… Engla… <NA>   <NA>   <NA>\n##  6     9     5 England\
    \ and… Engla… <NA>   <NA>   <NA>\n##  7    10     3 England and… Engla… North…\
    \ <NA>   <NA>\n##  8    10     4 England and… Engla… North… <NA>   <NA>\n##  9\
    \    10     5 England and… Engla… North… <NA>   <NA>\n## 10    11     3 England\
    \ and… Engla… North… Count… <NA>\n## # i 1,115 more rows\n```\n\n不幸的是，这个解决方案并不能修复威尔士\
    \ UAs 的错误分配。\n\n在下面的代码中，`field1` 中的值将被评估。对于来自威尔士的人口数据，`field2` 和 `field3` 值将被替换为\
    \ `NA`。\n\n```r\nuk_census_behead_revised <- uk_census_behead |>\n  mutate(field2\
    \ = case_when(\n    field1 == \"Wales\" ~ NA_character_,\n    TRUE ~ field2\n\
    \  )) |>\n  mutate(field3 = case_when(\n    field1 == \"Wales\" ~ NA_character_,\n\
    \    TRUE ~ field3\n  )) |>\n  select(field0:field4, gender, numeric)\n\nuk_census_behead_revised\
    \ |>\n  tail()\n```\n\n```text\n## # A tibble: 6 x 7\n##  field0  field1 field2\
    \ field3 field4 gender numeric\n##  <chr>   <chr>  <chr>  <chr>  <chr>  <chr>\
    \  <dbl>\n## 1 England and… Wales <NA>   <NA>   Monmo… All p… 93000\n## 2 England\
    \ and… Wales <NA>   <NA>   Monmo… Femal… 47400\n## 3 England and… Wales <NA> \
    \  <NA>   Monmo… Males  45600\n## 4 England and… Wales <NA>   <NA>   Newpo… All\
    \ p… 159600\n## 5 England and… Wales <NA>   <NA>   Newpo… Femal… 81200\n## 6 England\
    \ and… Wales <NA>   <NA>   Newpo… Males  78400\n```\n\n在对该数据的许多使用中，我们希望移除小计行。在下面的代码中，`case_when()`\
    \ 函数被用来创建一个新变量，为在下一层级被拆分的行（例如大都市郡内的城市，或地区内的郡）赋予值“subtotal”。\n\n第一步是创建一个新的数据框 `field3_split`，用于识别在郡级有拆分的区域。这是通过先按\
    \ `field4` 过滤（其中存在有效值，标识为不是“NA”），并创建 `field3` 中不同值的列表来实现的。然后该列表作为 `case_when()`\
    \ 内部评估的一部分，用于将值“subtotal”分配给新变量 `subtotal_row`。\n\n```r\nfield3_split <- uk_census_behead_revised\
    \ |>\n  filter(!is.na(field4)) |>\n  distinct(field3)\n\nfield3_split\n```\n\n\
    ```text\n## # A tibble: 33 x 1\n##  field3\n##  <chr>\n## 1 Tyne and Wear (Met\
    \ County)\n## 2 Cumbria\n## 3 Greater Manchester (Met County)\n## 4 Lancashire\n\
    ## 5 Merseyside (Met County)\n## 6 North Yorkshire\n## 7 South Yorkshire (Met\
    \ County)\n## 8 West Yorkshire (Met County)\n## 9 Derbyshire\n## 10 Leicestershire\n\
    ## # i 23 more rows\n```\n\n```r\nuk_census_behead_revised |>\n  mutate(subtotal_row\
    \ = case_when(\n    field3 %in% field3_split$field3 & is.na(field4) ~ \"subtotal\"\
    ,\n    TRUE ~ NA_character_\n  )) |>\n  relocate(subtotal_row)\n```\n\n```text\n\
    ## # A tibble: 1,125 x 8\n##   subtotal_row field0      field1 field2 field3 field4\n\
    ##   <chr>        <chr>       <chr>  <chr>  <chr>  <chr>\n## 1 subtotal     England\
    \ and… <NA>   <NA>   <NA>   <NA>\n## 2 subtotal     England and… <NA>   <NA> \
    \  <NA>   <NA>\n## 3 subtotal     England and… <NA>   <NA>   <NA>   <NA>\n## 4\
    \ subtotal     England and… Engla… <NA>   <NA>   <NA>\n## 5 subtotal     England\
    \ and… Engla… <NA>   <NA>   <NA>\n## 6 subtotal     England and… Engla… <NA> \
    \  <NA>   <NA>\n## 7 subtotal     England and… Engla… North… <NA>   <NA>\n## 8\
    \ subtotal     England and… Engla… North… <NA>   <NA>\n## 9 subtotal     England\
    \ and… Engla… North… <NA>   <NA>\n## 10 <NA>        England and… Engla… North…\
    \ Count… <NA>\n## # ℹ 1,115 more rows\n## # ℹ 2 more variables: gender <chr>,\
    \ numeric <dbl>\n```\n\n### 方法 3 - 构建对照表\n\n如果我们需要更灵活且可重用的方法，可以考虑创建单独的对照表（也称为交叉表）的选项。这类表包含关键变量的不同值及其在另一种分类或模式中的对应值。一旦建立了这样的表，它就可以与我们的数据以及未来可能需要使用的任何其他表进行连接。\n\
    \n对于英国人口普查数据，我们将创建两个单独的对照表。我们将把这些表保存为 CSV 文件，以便在其他需要时随时使用，从而使数据的过滤和汇总更加高效。\n\n\
    对于第一个表，我们将构建一个包含每种行政区域类型及其相关三位数字代码的表。这是在 R 中使用 {tibble} 包（Müller and Wickham,\
    \ 2021）以编程方式完成的。我们将使用 `tribble()` 函数，它将布局转置，使其类似于最终的表格结构。\n\n除了区域代码前缀和行政区域类型的名称外，该表还编码了层级中的级别。\n"
