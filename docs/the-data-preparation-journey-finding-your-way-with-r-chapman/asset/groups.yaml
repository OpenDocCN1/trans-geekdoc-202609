    \n该 R 代码块随后还有一行使用 dbFetch() 函数来执行 SQL 查询。\n\ndbSendQuery() 和 dbFetch() 都是 {DBI}\
    \ 包中的函数。\n\n```\nSEA_sql <- dbSendQuery(con_nycf,\n    \"SELECT * FROM flights\
    \ WHERE dest = 'SEA'\")\n\ndbFetch(SEA_sql)\n```\n\n## 10.2 在 R Markdown 中运行 SQL\
