    \ <fct>,\n## # #   total_a_gen <dbl>, total_bdoc <dbl>, ...\n```\n\n## 7.2 Creating\
    \ a labelled dataframe from an Excel file\n\nYou might encounter a circumstance\
    \ where the data collectors have originally used SPSS, SAS, or Stata, but share\
    \ the data as an Excel file. This might be because the receiving organization\
    \ does not have the proprietary software, and the ubiquity of Excel as an analytic\
    \ tool makes it a functional choice.\n\nTypically in these circumstances, the\
    \ data collectors make the data available in two parts:\n\n- The individual records,\
    \ with the variables coded numerically.\n- A separate “code book”, with the labels\
    \ associated with each numeric value.\n\nIn the following example, the Palmer\
    \ penguins data (Horst, 2020) has been stored in an Excel file. The first sheet\
    \ in this Excel file contains the data, where the values in the three character\
    \ variables (species, island, and sex) have been converted to numeric codes. For\
    \ example, for the species variable, the Adelie penguins are represented by the\
    \ value “1”, Chinstrap are represented by “2”, and Gentoo are represented by “3”.\n\
    \n```r\npenguins_path <- dpjr::dpjr_data(\"penguins_labelled.xlsx\")\n\npenguins_data\
    \ <- read_excel(penguins_path, sheet = \"penguins_values\")\n\nhead(penguins_data)\n\
    ```\n\nA glance at the dataframe shows that the variables species, island, and\
    \ sex are all coded as numeric variables. Unlike the “.sav” file we read earlier\
    \ in this chapter, this dataframe does not carry the labels as part of the variable.\n\
    \nWe could write some code to apply labels and change the variable type, using\
    \ the val_labels() function from the {labelled} package:\n\n```r\n# assign the\
    \ species names as labels\nlabelled::val_labels(penguins_data$species) <-\n  c(\"\
    Adelie\" = 1, \"Chinstrap\" = 2, \"Gentoo\" = 3)\n\n# view the labels\nval_labels(penguins_data$species)\n\
    \n# another way to view the labels\nattr(penguins_data$species, \"labels\")\n\
    ```\n\nWe can also use R to read in the values and apply them programmatically.\
    \ This will save time and effort and reduce the risk of typographical errors,\
    \ particularly if there are many variables and those variables have many values\
    \ to label.\n\nIf we return to the Excel file “penguins_labelled.xlsx” we find\
    \ that the second sheet in the Excel file is called “penguins_codebook_source”.\
    \ This sheet contains the output SPSS creates when the “DISPLAY DICTIONARY” syntax\
    \ (or the “File > Display Data File Information > Working File” GUI menu sequence)\
    \ in SPSS is used to produce the “dictionary” (or codebook). There is information\
    \ about each of the variables, including whether that variable is nominal or scale.\n\
    \nOf particular interest to us are the values associated with each variable. This\
    \ information is saved under the heading “Variable Values”; for the penguins data\
    \ file, this appears in row 36 of the Excel sheet.\n\n**Variable Values**\n\n\
    | Variable | Value | Label |\n|---|---|---|\n| species | 1 | Adelie |\n| species\
    \ | 2 | Chinstrap |\n| species | 3 | Gentoo |\n| island | 1 | Biscoe |\n| island\
    \ | 2 | Dream |\n| island | 3 | Torgersen |\n| sex | 1 | female |\n| sex | 2 |\
    \ male |\n\n*FIGURE 7.5 “Variable Values” from penguins SPSS output.*\n\nFirst,\
    \ we read the contents of a specific rectangle of data in the second sheet in\
    \ the Excel file, containing the code book. Note that we start reading at row\
    \ 37, so that “Value” and “Label” are assigned as our variable names. In this\
    \ code, the “anchored” approach is used, where the upper left corner Excel cell\
    \ is specified, and then the number of rows and columns to be read in the dim\
    \ = argument.\n\n```r\npenguins_path <- dpjr::dpjr_data(\"penguins_labelled.xlsx\"\
    )\n\npenguins_code <- read_excel(penguins_path,\n    sheet = \"penguins_codebook\"\
    ,\n    range = anchored(\"A37\", dim = c(9, 3)))\n\npenguins_code\n```\n\nWe have\
    \ read the table as output by SPSS and saved in the Excel file, but there is additional\
    \ wrangling required.\n\nThe first step in the pipe is to rename the variables.\
    \ Not only has the name value been given to the “Variable” column, but the name\
    \ of the value column has been interpreted as blank and has been assigned the\
    \ variable name ...2.\n\nThe second step is to use the {dplyr} fill() function\
    \ to populate the missing values in the variable variable. The default direction\
    \ of the fill is downwards,\n"
