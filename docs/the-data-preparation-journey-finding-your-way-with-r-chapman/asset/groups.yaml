    # 7

    Importing data: statistical software


    In this chapter:


    +   - Importing survey data from statistical software packages that include labelled
    data formats, with an emphasis on SPSS

    +   - Importing survey data from an Excel file, including the data dictionary
    created by survey software, and creating labels from the data dictionary.

    +   - Importing plain-text data and applying syntax from statistical software
    packages to apply labels and output as statistical software data formats, with
    an emphasis on SPSS.


    # 7.1 Statistical software


    If you are one or work with statisticians, economists, sociologists, survey practitioners,
    and many others, you will find yourself encountering data files created using
    the software packages SAS, SPSS, and Stata. These tools have been around a long
    time (SAS and SPSS trace their history back to the late 1960s, and Stata was created
    in 1985), and over the years they have evolved, demonstrated their robustness,
    and have become common in many academic, corporate, and government settings.


    A feature of these programs is that the variables and the associated values can
    be labelled. If you’re familiar with R, value labelling is conceptually similar
    to the use of factor labels. These labels can carry a great deal of detail to
    which you might otherwise not have easy access.


    The R package {haven} (Wickham and Miller, 2021) provides the functionality to
    read these three types of files¹. There are other packages related to {haven}
    that we will also use.


    ```

    library(haven)

    ```


    ¹The reference page for {haven} is here: https://haven.tidyverse.org/index.html'
