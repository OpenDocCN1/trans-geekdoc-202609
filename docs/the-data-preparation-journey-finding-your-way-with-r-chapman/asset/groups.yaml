    # CHAPMAN & HALL/CRC DATA SCIENCE SERIES


    Reflecting the interdisciplinary nature of the field, this book series brings
    together researchers, practitioners, and instructors from statistics, computer
    science, machine learning, and analytics. The series will publish cutting-edge
    research, industry applications, and textbooks in data science.


    The inclusion of concrete examples, applications, and methods is highly encouraged.
    The scope of the series includes titles in the areas of machine learning, pattern
    recognition, predictive analytics, business analytics, Big Data, visualization,
    programming, software, learning analytics, data wrangling, interactive graphics,
    and reproducible research.


