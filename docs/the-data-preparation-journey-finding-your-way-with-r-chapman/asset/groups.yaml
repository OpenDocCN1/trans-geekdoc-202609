    above, to support decision making is often called data science. Data science combines
    the academic disciplines of statistics, computer programming, and the subject
    matter (be it astronomy, psychology, economics, or business). (Conway, 2010)


    The typical data science process has been described in this model (Wickham et
    al., 2023b):


    ![](img/b86622d1e9ca82b3cbec45faaffaaf26_19_0.png)


    **FIGURE 1.1** *The data science process.*


    The generalist data scientist has a hand in all the steps through this workflow
    (Monkman, 2019); in this book we will focus on the Import to Tidy to Transform
    steps. We will also see how “Visualise” is an important part of Exploratory Data
    Analysis, a strategy for identifying potential problems with the data prior to
    cleaning.


    ## 1.3 Data in the wild


    Most data science and statistics textbooks use example data sets that are nicely
    formatted and easy to import. Anscombe’s Quartet (Anscombe, 1973) is a famous
    example of a small data set that was designed to produce specific statistical
    results; it is included in the base version of R (R Core Team, 2021). Other data
    sets might be excerpted to use as teaching examples (Bryan, 2017), chosen for
    their statistical properties (Horst et al., 2022), compiled as examples to demonstrate
    a methodology or technique (Kuhn, 2020), or used to clean, validate, and aggregate
    still-larger data collections (Friendly et al., 2020).


    But in real life the data we find ourselves working with is, more often than not,
    entirely different from those text book examples.


    > *Classroom data are like teddy bears; real data are like a grizzly with salmon
    blood dripping out of its mouth¹.*


    - Data can be stored in different formats–spreadsheets, databases, software-specific
    file formats, websites, and PDF files. We need to have tools to access the data,
    no matter the file format.

    - The data might be stored in an untidy layout (Wickham, 2014), or inconsistently
    structured.

    - We might receive data from multiple sources, so we end up with two files that
    have the same value but are coded in different ways. For example, my home province
    in Canada can be represented as “British Columbia”, “B.C.”, or “BC”. All three
    are accurate, but these variations can cause problems if they are inconsistent
    across the data sources (or even more problematically, in the same variable).
    And don’t get me started on date formats—we’ll save that for later.

    - Data might have as-of-yet undetected errors. It might be incomplete, inconsistent,
    or it might have data entry mistakes and typos.

    - It might have bias...and there are many different types of bias.


    - The data may come from an administrative source, and collected for a purpose
    other than research. In these cases, you may need to transform that data to fit
    the requirements of the research question.


    This book will introduce steps necessary to ensure that you can assemble your
    data in a way that allows you to undertake the rest of the data science process,
    including sharing the data with other data analysts who might seek to use the
    data in further analysis.


    ## 1.4 Data collection


    Before we can start our data science workflow—before we get to the “Import” step—someone
    has to collect the data. This book won’t cover the process of collecting data,
    a topic both broad and deep. Included in that would be determining the research
    question (or hypothesis) or business need that the data will support, designing
    the experiment or the business process to be captured (both could include a survey
    questionnaire), and undertaking the experiment (including fieldwork) or implementing
    the business data collection. The details of the data collection process are often
    domain-specific, so I encourage you to seek out reference materials that are tailored
    for your chosen subject area.


    ## 2 Foundations


    In this chapter:


    - The data preparation process

    - The principles of data quality, and how dirty data is part of data quality

    - Understanding what makes data “clean” or “dirty”, and why context matters

    - Understanding tidy data principles


    ## 2.1 The data preparation process


    As we get started on the path of preparing our data, we should think first about
    where we want to go.


    Ellis and Leek’s article “How to Share Data for Collaboration” (Ellis and Leek,
    2017) is aimed at scientists (“data generators”) who have collected the data and
    are preparing it for further analysis in an academic environment—the authors speak
    about “preparing data for a statistician.”


    While Ellis and Leek have a specific context in mind, the principles in their
    paper have broad applicability, and the practices are essential in any environment,
    including a business, government, or non-profit organization. And in those contexts,
    the roles and responsibilities and the division of labour in the workflow, are
    often different than in an academic environment. The data collection and storage
    might be to support a business need, and the use of the data for business intelligence
    is a secondary benefit. As a result, there is often a middle person who isn’t
    involved in the collection of the data but who does the preparation of the data
    for the modelling, visualization, and reporting. That same person might also be
    responsible for the modelling, visualization, and reporting.


    At the end of the data preparation phase, before visualization and modelling can
    start, there should be:


    ## 2.2 Data quality


    Part of the data preparation process is to ask, “What is the data’s *quality*?”


    One resource that is useful to frame your thinking on this is Statistics Canada’s
    *Quality Guidelines* (Statistics Canada, 2019). Like other official statistical
    agencies around the world, Statistics Canada’s reputation is staked on making
    high quality data available to the widest possible audience. They have identified
    six elements of data quality.


    - Relevance: The degree to which the data meets the user’s needs and relates to
    the issues that the user cares about.

    - Timeliness and punctuality: The delay between the information reference period
    and the date when the data becomes available.

    - Accuracy and reliability: Accuracy “is the degree to which the information correctly
    describes the phenomena it was designed to measure.”

    - Accessibility and clarity: “The ease with which users can learn that the information
    (including metadata) exists, find it, view it and import it into their own work
    environment.”

    - Interpretability: “The availability of supplementary information and metadata
    needed to interpret and use statistical information appropriately.”

    - Coherence and comparability: “The degree to which it can be reliably combined
    and compared with other statistical information within a broad analytical framework
    over time.”


    In our data preparation process, we want to ensure our own work is accessible
    and interpretable; this is the motivation behind documentation.


    Another typology of “data quality” is found in (Wang et al., 1995). High quality
    data is:


    - Accessible

    - Interpretable

    - Useful

    - Believable

