    \ 2021 年英格兰和威尔士人口普查。文件 “census2021firstresultsenglandwales1.xlsx” 包含按地方当局（地区）划分的人口数据，并包含有关数据的说明工作表，以及按性别和五岁年龄组划分的人口数据表，同时还有人口密度和家庭户数。\n\
    \n我们的重点是 “P01” 工作表，其中包含按性别划分的人口。数据的前几行如下所示：\n\n![](img/b86622d1e9ca82b3cbec45faaffaaf26_69_0.png)\n\
    \n**图 6.1** *英国人口普查数据。*\n\n我们要使用的正是 {readxl} 包中的 `read_excel()` 函数。第一项是文件路径。该函数的默认行为是读取\
    \ Excel 文件中的第一个工作表，这不是我们想要的，因此我们使用 `sheet =` 参数来指定 “P01”。我们还将使用 `n_max = 10` 参数仅读取工作表中的前\
    \ 10 行。\n\n```\nuk_census_pop <- readxl::read_excel(\n  dpjr::dpjr_data(\"census2021firstresultsenglandwales1.xlsx\"\
    ),\n  sheet = \"P01\",\n  n_max = 10\n)\n```\n\nuk_census_pop\n\n![](img/b86622d1e9ca82b3cbec45faaffaaf26_70_0.png)\n\
    \n**图 6.2** 英国人口普查数据。\n\n我们通过目视检查已经发现，电子表格顶部的头几行包含标题（现在位于变量名行），以及数据来源和发布日期等信息。虽然这些文档信息很重要，但它并不是我们分析所需的数据的一部分。\n\
    \n`read_excel()` 的另一个用于指定包含我们数据的矩形区域的参数是 `skip =`。由于我们的目视检查显示，我们感兴趣的数据的标题行从第七行开始，我们将使用它来跳过前\
    \ 6 行。\n\n```\nuk_census_pop <- readxl::read_excel(\n  dpjr::dpjr_data(\"census2021firstresultsenglandwales1.xlsx\"\
    ),\n  sheet = \"P01\",\n  n_max = 10,\n  skip = 6\n)\n\nhead(uk_census_pop)\n\
    ```\n\n```\n##  7 E0600002 Middlesbrough      143900  7.3 e4 7.09e4\n##  8 E0600057\
    \ Northumberland     320600  1.64e5 1.57e5\n##  9 E0600003 Redcar and Cle~   136500\
    \  7.05e4 6.61e4\n## 10 E0600004 Stockton-on-Te~  196600  1.00e5 9.65e4\n## #\
    \ i 365 more rows\n```\n\n数据已被正确读取，包括数据变量以正确的格式读取。但这丢失了一项重要信息：地理层级。在 Excel 文件中，层级的级别通过缩进表示。我们的下一个挑战是捕获该信息，并将其转化为可用的数据。\n\
    \n### 6.2.1 将 Excel 格式作为数据\n\n关于这些数据，有一点值得注意：Area name 变量是分层的，包含一系列小计。较低（较小）的层级包含层次结构中下一较高层级的组成区域，这些层级通过区域名称值中的缩进来表示。层级越低，区域名称的缩进越多。\n\
    \n层级的具体情况如下：\n\n- “England and Wales” 的值包含总人口，即英格兰（Excel 的第 8 行）和威尔士（第 360 行）的总和。\n\
    - 英格兰（但不包括威尔士）再进一步细分为九个国家以下地区（在 Area code 变量的前三个字符中编码为 “E12”）。\n- 这些地区再划分为更小的单位，但这些单位的描述各不相同。这些单位包括单一管理区（E06）、伦敦自治市（E09）、郡（E10）和大都会郡（E11）；为便于说明，我们将这一级别简称为“郡”。\n\
    - 郡级以下进一步划分为非都市区（E07），而大都会郡则细分为大都会区（E08）。上图显示泰恩-威尔（E11 大都会郡，第 18 行）被细分，从盖茨黑德开始，而坎布里亚郡（E10\
    \ 郡，第 31 行）也被细分，从阿勒代尔开始。\n- 威尔士划分为单一管理区，在 Area code 变量的前三个字符中编码为 “W06”。在威尔士，没有中间的地区层级，因此这些单一管理区与英格兰的单一管理区处于同一级别。“地方当局区、郡和单一管理区（2021\
    \ 年 4 月）英国地图³。\n\n2 英国行政地理的层级可在 [ONS “行政地理”页面](https://www.ons.gov.uk/methodology/geography/ukgeographies/administrativegeography)\
    \ 上的 “英格兰” 和 “威尔士” 链接中查找。\n\n这种复杂的结构意味着数据包含多个小计——对 `All persons` 变量执行 `sum()`\
    \ 函数将得到总人口 277,092,700，大约是 2021 年英格兰和威尔士实际人口 59,597,300 的 4.7 倍。\n\n更有用的结构应具备以下特征：\n\
    \n- 无重复（人口不被重复计算）。\n- 一个用于层级级别的代码，以便进行筛选。\n- 额外的变量（列），使每一行都包含其所归属的较高级别区域。例如，达勒姆郡应该有一个列包含地区值\
    \ “North East” 和国家值 “England”。\n\n有了这样的结构，我们就可以在 `group_by()` 函数中使用不同的区域分组。\n\n\
    正如我们之前看到的，{readxl} 的 `read_excel()` 函数会忽略格式，因此无法从字符中辨别层级。\n\n让我们探索一些方法来提取嵌入在数据和格式中的信息，并利用这些信息来修剪重复的行。\n\
    \n### 方法 1 - 使用地区代码\n\n我们可以采用的第一个方法是提取 `area_code` 变量中的地区元素，并使用它来筛选数据。\n\n例如，如果我们想按郡级绘制英格兰的人口，一种方法是识别所有地区代码以下列字符开头的行：\n\
    \n- 单一管理区（E06）、伦敦自治市（E09）、郡（E10）和大都会郡（E11）\n\n为此，我们可以设计一个正则表达式，使用 “^” 字符来识别开头的字母\
    \ “E”。（请记住，“E” 代表英格兰，“W” 代表威尔士。）然后，在第 2 个字符位置（第一组方括号内）是 0 或 1，在第 3 个字符位置（第二组方括号内）是\
    \ 6、9、0 或 1 之一。\n\n```\ncounty_pop <- uk_census_pop |>\n  filter(str_detect(area_code,\
    \ \"^E[01][6901]\"))\n\ndplyr::glimpse(county_pop, width = 65)\n```\n\n## Rows:\
    \ 122\n## Columns: 5\n## $ area_code  <chr> \"E06000047\", \"E06000005\", \"E06000001\"\
    , \"E06~\n## $ area_name  <chr> \"County Durham\", \"Darlington\", \"Hartlepool\"\
    ~\n## $ all_persons <dbl> 522100, 107800, 92300, 143900, 320600, 1365~\n## $ females\
    \    <dbl> 266800, 55100, 47700, 73000, 164000, 70500,~ \n## $ males      <dbl>\
    \ 255300, 52700, 44700, 70900, 156600, 66100,~\n\n我们可以通过 `distinct()` 函数检查正则表达式是否按预期工作，仅检查\
    \ area_code 字符串的前三个字符：\n\n```\ncounty_pop  |>\n  distinct(str_sub(area_code, 1,\
    \ 3))\n```\n\n## # A tibble: 4 x 1\n## `str_sub(area_code, 1, 3)`\n##   <chr>\n\
    ## 1 E06\n## 2 E11\n## 3 E10\n## 4 E09\n\n另一种方法是创建所需三字符代码的列表，然后在主数据中创建一个新变量，并根据这个\
    \ UA 代码列表进行筛选：\n\n"
