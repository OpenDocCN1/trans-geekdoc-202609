    # # *Preface*


    It is routinely noted that the Pareto principle¹ applies to data science—80% of
    one’s time is spent on data collection and preparation, and the remaining 20%
    on the “fun stuff” like modelling, data visualization, and communication.


    There is no shortage of material—textbooks, journal articles, blog posts, online
    courses, podcasts, etc.—about the 20%. That’s not to say that there is no material
    for the other 80%. But it is scattered, found across technique-specific articles
    and domain-specific books, along with Stack Overflow questions and miscellaneous
    blog posts. This book serves as a travel guide: an introduction and wayfinder
    through some of the scattered resources for readers seeking to understand the
    core elements of data preparation. It is hoped that, like a lighthouse, it will
    both guide you in the right direction and keep you from running aground.


    The book will introduce the principles of data preparation, framed in a systematic
    approach that follows a typical data science or statistical workflow. With that
    context, readers will then work through practical solutions to resolving problems
    in data using the statistical and data science programming language R. These solutions
    will include examples of complex real-world data.


    > In *Exploratory Data Analysis*, Tukey writes “the analyst of data needs both
    tools and understanding. The purpose of this book is to provide some of each.”
    (Tukey, 1977, p.1) It is my modest hope that this book also provides you both
    tools and understanding.


    # ## You, the reader


    You might be an academic, working in the physical sciences, social sciences, or
    humanities, who is (or will be) analyzing data as part of your research. You might
    be working in a business setting, where important decisions are being made based
    on the insights you draw from the data collected as part of interactions with
    customers. As a public servant, you might be creating the


    ¹ https://en.wikipedia.org/wiki/Pareto_principle'
