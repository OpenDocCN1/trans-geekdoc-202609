  md: "\nso we don’t need to specify the direction as an argument. We will examine\
    \ other options for cleaning data later.\n\n```\npenguins_code <- penguins_code\
    \ |>\n  # rename variables\n  rename(Value = \"variable\",\n    ...2 = \"variable_value\"\
    ,\n    Label = \"variable_label\") |>\n  # fill in blank names\n  fill(variable)\
    \ |>\n  # change to numeric\n  mutate(variable_value = as.numeric(variable_value))\n\
    \npenguins_code\n```\n\nAt this point, there are two possible solutions:\n\n-\
    \ 1. Join the values from the “penguins_code” dataframe, so that in addition to\
    \ the variable with numeric values, there is also a variable with the character\
    \ strings.\n- 2. Using the functions in the {labelled} package, convert the variables\
    \ into “labelled” type, so that the numeric values remain and the labels are applied.\
    \ In this scenario, the end-state is the same as reading the SPSS file directly.\n\
    \n## Final step: join variables\n\n```\npenguins_code_wide <- penguins_code |>\n\
    \  # mutate(row_num = row_number()) |>\n  pivot_wider(names_from = c(variable),\
    \ values_from = variable_label)\n\npenguins_code_wide\n```\n\n## 7.3 Creating\
    \ a labelled dataframe from SPSS syntax\n\nIn the previous chapter, we imported\
    \ data files that had been created using the software packages SAS, SPSS, and\
    \ Stata. We also saw how to work with labelled variables.\n\nIn our quest for\
    \ data to analyze, we might come across a circumstance where an organization has\
    \ collected survey data, and the data collectors have published the individual\
    \ records, allowing researchers like you and me to further explore the data.\n\
    \nThese data files contain individual records, rather than a data file that has\
    \ been summarized with counts and percentages. A file with the individual records\
    \ is sometimes referred to as a “micro-file”, and one that has been anonymized\
    \ for publication might be described as a Public-Use Micro File (abbreviated as\
    \ “PUMF”) or Public Use Microdata Sample (PUMS)\\index{PUMS|see {Public-Use Micro\
    \ File}}.\n\nIn this chapter, we will look at two circumstances where the data\
    \ collectors have done just that. But rather than releasing the micro-data in\
    \ a variety of formats, they have published a bundle that contains the raw text\
    \ flat file along with syntax (code) files that apply variable names, variable\
    \ labels, and value labels. This is great if we have a license for one of those\
    \ proprietary software tools⁴, but what if we are an R user?\n\nFortunately for\
    \ us, there is a package that has functions to read a raw text file, and apply\
    \ SPSS syntax to create an R object with labelled variables: {memisc} (Elff et\
    \ al., 2021).\n\n```\nlibrary(memisc)\n```\n\n### 7.3.1 National Travel Survey\
    \ (NTS)\n\nOur first example uses information from the National Travel Survey\
    \ (NTS), collected and published by Statistics Canada (Statistics Canada, 2021).\n\
    \nStep 1 - Download the “SPSS” zip file for the 2020 reference period, and unzip\
    \ it in the project sub-folder “data”. This should create a sub-folder, so that\
    \ the file path is now “data\\2020-spss”\n\nThe zip file does not include an SPSS-format\
    \ data file (.sav). Instead, the folder has a fixed-width text file for each of\
    \ the three survey components (person, trips, and visits), and corresponding SPSS\
    \ syntax files that can be used to read the files into the correct variables and\
    \ to apply the variable and value labels.\n\nFor this example, we will use the\
    \ 2020 NTS “Person” file. The raw data file provided by Statistics Canada is “PERSON_NTS2020_PUMF.txt”.\n\
    \nStep 2 - Use the SPSS syntax files (in R)\n\nThe bundle also includes separate\
    \ SPSS syntax files with the “.sps” extension. Because Canada is a bilingual country,\
    \ Statistics Canada releases two versions\n⁴Or a friend we can bribe with the\
    \ promise of a chocolate bar.\nof the label syntax files, one in English and the\
    \ other in French. They can be differentiated through the last letter of the file\
    \ name, before the extension. These are:\n\n- variable labels: “Person_NTS2020_Pumf_vare.sps”\
    \ (The equivalent file with French variable labels is “Person_NTS2020_Pumf_varf.sps”.)\n\
    - variable values: “Person_NTS2020_Pumf_vale.sps”\n- missing values: “Person_NTS2020_Pumf_miss.sps”\n\
    \nThis structure works very well with the {memisc} functions, and these files\
    \ do not require any further manipulation. (As we will see in our second example,\
    \ this is not always the case.)\n\nBecause Statistics Canada has made the data\
    \ available from other years, we will consciously create flexible code that will\
    \ permit us to rerun our code later with a minimum number of changes. Accordingly,\
    \ we will assign the year of the data as an object.\n\n```\nnts_year <- \"2020\"\
    \n```\n\nWe can now use the object with the year number in a variety of ways,\
    \ as we define the locations of the various input files. Note that this code uses\
    \ the glue() function from the {glue} package to create the file name strings,\
    \ and the here() function from the {here} package to determine the file path relative\
    \ to our RStudio project location.\n\n```\n# define locations of input files\n\
    \nnts_year_format <- glue(nts_year, \"-SPSS\")\n\ninput_folder <- here(\"data\"\
    , nts_year_format)\ninput_folder\n```\n## [1] \"E:/github_book/data_preparation_journey/data/2020-SPSS\"\
    \n\n```\nlayout_folder <- here(\"data\", nts_year_format, \"Layout_cards\")\n\
    layout_folder\n```\n##      [1]      \"E:/github_book/data_preparation_journey/data/2020-SPSS/Layout_cards\"\
    \n\n```\n# use the above to create objects with file names and paths\n\ndata_file_1\
    \ <- glue(\"PERSON_NTS\", nts_year, \"_PUMF.txt\")\ndata_file <- glue(input_folder,\
    \ \"/Data_Données/\", data_file_1)\ndata_file\n```\n##\nE:/github_book/data_preparation_journey/data/2020-SPSS/Data_Données/PERSON_NTS2020_PUMF.txt\n\
    \n```\ncolumns_file_1 <- glue(\"Person_NTS\", nts_year, \"_Pumf_i.sps\")\ncolumns_file\
    \ <- glue(layout_folder, columns_file_1, .sep = \"/\")\ncolumns_file\n```\n##\n\
    E:/github_book/data_preparation_journey/data/2020-SPSS/Layout_cards/Person_NTS2020_Pumf_i.sps\n\
    \n```\nvariable_labels_1 <- glue(\"Person_NTS\", nts_year, \"_Pumf_vare.sps\"\
    )\nvariable_labels <- glue(layout_folder, variable_labels_1, .sep = \"/\")\n\n\
    variable_values_1 <- glue(\"Person_NTS\", nts_year, \"_Pumf_vale.sps\")\nvariable_values\
    \ <- glue(layout_folder, variable_values_1, .sep = \"/\")\n\nmissing_values_1\
    \ <- glue(\"Person_NTS\", nts_year, \"_Pumf_miss.sps\")\nmissing_values <- glue(layout_folder,\
    \ missing_values_1, .sep = \"/\")\n```\n\nThe next stage is to create a definition\
    \ of the dataset using the memisc::spss.fixed.file() import procedure.\n\n```\n\
    # read file, create datafile with nested lists\nnts_person_2020 <- memisc::spss.fixed.file(\n\
    \  data_file,\n  columns_file,\n  varlab.file = variable_labels,\n  codes.file\
    \ = variable_values,\n  missval.file = missing_values,\n  count.cases = TRUE,\n\
    \  to.lower = TRUE\n)\n```\n\n```\n# convert the resulting object into a \"data.set\"\
    \ format\nnts_person_2020_ds <- memisc::as.data.set(nts_person_2020)\n```\n\n\
    That dataset object is now converted into a tibble, using the as_haven() function.\
    \ This tibble has all of the variable and value labels assigned, accessible via\
    \ the functions in the {labelled} package.\n\n```\nnts_person_2020_hav <- memisc::as_haven(nts_person_2020_ds)\n\
    nts_person_2020_hav\n```\n```\n## # A tibble: 79,771 x 13\n##   pumfid verd ate\
    \  refyear  quarter inf_q01 inf_q02\n##   *   <dbl> <chr>  <int+lbl> <int+l> <int+l>\
    \ <int+lb>\n## 1 1006690 10/12/2~ 2020 [Yea~ 1 [Ref~ 1 [Yes] 35 [Ont~\n## 2 1006691\
    \ 10/12/2~ 2020 [Yea~ 1 [Ref~ 1 [Yes] 35 [Ont~\n## 3 1006692 10/12/2~ 2020 [Yea~\
    \ 1 [Ref~ 1 [Yes] 24 [Que~\n## 4 1006693 10/12/2~ 2020 [Yea~ 1 [Ref~ 1 [Yes] 35\
    \ [Ont~\n## 5 1006694 10/12/2~ 2020 [Yea~ 1 [Ref~ 1 [Yes] 24 [Que~\n## 6 1006695\
    \ 10/12/2~ 2020 [Yea~ 1 [Ref~ 1 [Yes] 35 [Ont~\n## 7 1006696 10/12/2~ 2020 [Yea~\
    \ 1 [Ref~ 1 [Yes] 13 [New~\n## 8 1006697 10/12/2~ 2020 [Yea~ 1 [Ref~ 1 [Yes] 11\
    \ [Pri~\n## 9 1006698 10/12/2~ 2020 [Yea~ 1 [Ref~ 1 [Yes] 35 [Ont~\n## 10 1006699\
    \ 10/12/2~ 2020 [Yea~ 1 [Ref~ 1 [Yes] 35 [Ont~\n## # i 79,761 more rows\n## #\
    \ i 7 more variables: page_grp <int+lbl>,\n## #   gend_bin <int+lbl>, incomgr2\
    \ <int+lbl>,\n## #   memc18up <int+lbl>, memclt18 <int+lbl>,\n## #   resprov <int+lbl>,\
    \ pumfwp <dbl>\n```\n\nIn our final step, we save the dataframe as SPSS, Stata,\
    \ and RDS files for future use.\n\nOne important note for Stata users is that\
    \ there is a “version” argument, which allows us to create a file that can be\
    \ read by older versions of Stata (the default is Stata 15).\n\n```\n# export\
    \ haven format table as SPSS .sav file\nhaven::write_sav(nts_person_2020_hav,\n\
    \  here(\"data_output\", \"nts_person_2020.sav\"))\n\n# export haven format table\
    \ as Stata .dta file\n```\n"
  mdcn: "\n因此，我们不需要将方向作为参数来指定。稍后我们将探讨清理数据的其他方案。\n\n```\npenguins_code <- penguins_code\
    \ |>\n  # rename variables\n  rename(Value = \"variable\",\n    ...2 = \"variable_value\"\
    ,\n    Label = \"variable_label\") |>\n  # fill in blank names\n  fill(variable)\
    \ |>\n  # change to numeric\n  mutate(variable_value = as.numeric(variable_value))\n\
    \npenguins_code\n```\n\n此时，有两种可能的解决方案：\n\n- 1. 将“penguins_code”数据框中的值连接起来，使得除了包含数值的变量外，还有一个包含字符串的变量。\n\
    - 2. 使用 {labelled} 包中的函数，将变量转换为“labelled”类型，这样数值保持不变，并应用标签。在这种情况下，最终状态与直接读取 SPSS\
    \ 文件相同。\n\n## 最后一步：连接变量\n\n```\npenguins_code_wide <- penguins_code |>\n  # mutate(row_num\
    \ = row_number()) |>\n  pivot_wider(names_from = c(variable), values_from = variable_label)\n\
    \npenguins_code_wide\n```\n\n## 7.3 从 SPSS 语法创建带标签的数据框\n\n在上一章中，我们导入了使用 SAS、SPSS\
    \ 和 Stata 软件包创建的数据文件。我们还了解了如何处理带标签的变量。\n\n在我们寻找可分析数据的过程中，我们可能会遇到这样的情况：某个组织收集了调查数据，数据收集者公布了个人记录，使得像你我这样的研究人员能够进一步探索这些数据。\n\
    \n这些数据文件包含个人记录，而不是已用计数和百分比汇总的数据文件。包含个人记录的文件有时被称为“微观文件”（micro-file），而为发布而匿名化的文件可称为公共使用微观文件（Public-Use\
    \ Micro File，缩写为“PUMF”）或公共使用微观数据样本（Public Use Microdata Sample，PUMS）\\index{PUMS|see\
    \ {Public-Use Micro File}}。\n\n在本章中，我们将探讨数据收集者这样做的两种情况。但他们并非以多种格式发布微观数据，而是发布了一个压缩包，其中包含原始文本扁平文件，以及应用变量名、变量标签和值标签的语法（代码）文件。如果我们拥有其中一种专有软件工具的许可证⁴，那自然很好，但如果我们使用的是\
    \ R 呢？\n\n幸运的是，有一个包提供了读取原始文本文件并应用 SPSS 语法来创建带有标签变量的 R 对象的函数：{memisc} (Elff 等,\
    \ 2021)。\n\n```\nlibrary(memisc)\n```\n\n### 7.3.1 国家出行调查（NTS）\n\n我们的第一个示例使用加拿大统计局（Statistics\
    \ Canada）收集并发布的国家出行调查（NTS）数据（Statistics Canada, 2021）。\n\n步骤 1 - 下载 2020 参考期的“SPSS”zip\
    \ 文件，并将其解压到项目子文件夹“data”中。这将创建一个子文件夹，因此文件路径现在是“data\\2020-spss”。\n\n该 zip 文件不包含\
    \ SPSS 格式的数据文件（.sav）。相反，该文件夹为三个调查组成部分（人员、出行和访问）各提供了一个固定宽度的文本文件，以及相应的 SPSS 语法文件，这些语法文件可用于将文件读入正确的变量，并应用变量和值标签。\n\
    \n在本例中，我们将使用 2020 年 NTS 的“Person”文件。加拿大统计局提供的原始数据文件是“PERSON_NTS2020_PUMF.txt”。\n\
    \n步骤 2 - 使用 SPSS 语法文件（在 R 中）\n\n该压缩包还包括带有“.sps”扩展名的独立 SPSS 语法文件。由于加拿大是一个双语国家，加拿大统计局发布两个版本\n\
    ⁴或者我们可以承诺给一块巧克力棒来贿赂的朋友。\n的标签语法文件，一个为英文，另一个为法文。它们可以通过文件扩展名之前的最后一个字母来区分。这些文件是：\n\
    \n- 变量标签：“Person_NTS2020_Pumf_vare.sps”（等效的带有法语变量标签的文件是“Person_NTS2020_Pumf_varf.sps”。）\n\
    - 变量值：“Person_NTS2020_Pumf_vale.sps”\n- 缺失值：“Person_NTS2020_Pumf_miss.sps”\n\n\
    这种结构与 {memisc} 函数配合得很好，这些文件不需要任何进一步的处理。（正如我们将在第二个示例中看到的，情况并非总是如此。）\n\n由于加拿大统计局提供了其他年份的数据，我们将有意识地编写灵活的代码，以便日后以最少的更改重新运行我们的代码。因此，我们将把数据的年份赋为一个对象。\n\
    \n```\nnts_year <- \"2020\"\n```\n\n现在，在定义各个输入文件的位置时，我们可以多种方式使用这个包含年份编号的对象。请注意，此代码使用\
    \ {glue} 包中的 glue() 函数来创建文件名字符串，并使用 {here} 包中的 here() 函数来确定相对于我们的 RStudio 项目位置的文件路径。\n\
    \n```\n# define locations of input files\n\nnts_year_format <- glue(nts_year,\
    \ \"-SPSS\")\n\ninput_folder <- here(\"data\", nts_year_format)\ninput_folder\n\
    ```\n## [1] \"E:/github_book/data_preparation_journey/data/2020-SPSS\"\n\n```\n\
