  md: "\n| function | purpose |\n|---|---|\n| str_match() | extracts the text of the\
    \ match and parts of the match within parenthesis |\n| str_replace() and str_replace_all()\
    \ | replaces the matches with new text |\n| str_remove() and str_remove_all()\
    \ | removes the matches |\n| str_split() | splits up a string at the pattern |\n\
    \nThe first step will be to remove the space where the pattern is \" \" using\
    \ the stringr::str_remove() function. This step would then be repeated with pattern\
    \ = \"-\"\n\n```\nstr_remove(string = pc_kimberley_all,\n    pattern = \" \")\n\
    ```\n\n## [1] \"V1A2B3\"  \"V1A2B3\"  \"v1a2B3\"  \"v1a-2b3\"\n\nMore efficiently,\
    \ we can use a regular expression with both a space and a hyphen inside the square\
    \ brackets, which has the result of replacing either a space or a hyphen.\n\n\
    ```\npc_kimberley_clean <- str_remove(string = pc_kimberley_all,\n    pattern\
    \ = \"[ -]\")\n```\n\nThe second step will be to capitalize the letters. The {stringr}\
    \ function for this is str_to_upper. (There are also parallel str_to_lower, str_to_title,\
    \ and str_to_sentence functions.)\n\n```\npc_kimberley_clean <- str_to_upper(pc_kimberley_clean)\n\
    pc_kimberley_clean\n```\n\n## [1] \"V1A2B3\" \"V1A2B3\" \"V1A2B3\" \"V1A2B3\"\n\
    \nIf this was in a dataframe, these functions can be added to a mutate() function,\
    \ and applied in a pipe sequence, as shown below.\n\n```\n# convert string to\
    \ tibble\npc_kimberley_tbl <- as_tibble(pc_kimberley)\n```\n\n```\n# mutate new\
    \ values\n# --note that creating three separate variables allows for comparisons\n\
    #   as the values change from one step to the next\npc_kimberley_tbl |>\n  # extract\
    \ the postal codes\n  mutate(pc_extract = str_extract(value, postalcode)) |>\n\
