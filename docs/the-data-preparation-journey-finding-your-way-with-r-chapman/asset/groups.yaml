  mdcn: "\n## 7.1.1.1 使用标签\n\n{haven} 创建的数据框中的标签可以使用 unlabelled() 函数转换为因子类型。\n\n如果我们使用来自\
    \ SPSS 文件的 penguins 数据框统计每个物种的企鹅数量，我们会看到以下内容：\n\n```\npenguins_sav |>\n  group_by(species)\
    \ |>\n  tally()\n```\n\n```\n## # A tibble: 3 x 2\n##   species       n\n##  \
    \ <dbl+lbl> <int>\n## 1 1 [Adelie]   152\n## 2 2 [Chinstrap] 68\n## 3 3 [Gentoo]\
    \   124\n```\n\n在这个版本中，“species” 变量保留了数值。\n\n通过应用 unlabelled() 函数，“haven_labelled”\
    \ 类型的变量被转换为因子类型，并且标签（即物种名称）现在显示在我们的汇总表中：\n\n```\npenguins_sav |>\n  unlabelled()\
    \ |>\n  group_by(species) |>\n  tally()\n```\n\n```\n## # A tibble: 3 x 2\n##\
    \   species       n\n##   <fct>    <int>\n## 1 Adelie   152\n## 2 Chinstrap 68\n\
    ## 3 Gentoo   124\n```\n\n另一种方法是显式更改变量类型，在 mutate() 和 mutate_if() 中的一个 mutate\
    \ 函数内部使用 to_factor 转换。在此第一个示例中，变量 species 从 labelled 转换为因子类型。\n\n```\npenguins_sav\
    \ |>\n  mutate(species = as_factor(species)) |>\n  group_by(species) |>\n  tally()\n\
    ```\n\n## # A tibble: 3 x 2\n##   species       n\n##   <fct>     <int>\n## 1\
    \ Adelie      152\n## 2 Chinstrap    68\n## 3 Gentoo      124\n\n在这个第二个变体中，mutate_if(is.labelled)\
    \ 函数转换了所有标记的变量。\n\n```\npenguins_sav |>\n  mutate_if(is.labelled, to_factor) |>\n\
    \  group_by(species, island) |>\n  tally()\n```\n\n## # A tibble: 5 x 3\n## #\
    \ Groups:   species [3]\n##   species island       n\n##   <fct>   <fct>    <int>\n\
