  mdcn: "\n## 5 导入数据：纯文本文件\n\n本章内容包括：\n\n- 从分隔文本文件导入数据\n- 从固定宽度文本文件导入数据\n\n### 5.1\
    \ 分隔的纯文本文件\n\n纯文本文件（有时因其使用的字符编码标准而被称为“ASCII 文件”）常被用来共享数据。它们能包含的内容有限，这既有缺点也有优点。缺点在于它们无法携带任何附加信息，例如变量类型和标签。但优点在于它们不携带任何需要软件额外解释的附加信息。这意味着它们可以被多种多样的软件工具一致地读取。\n\
    \n纯文本文件有两种类型：分隔型和固定宽度型。“分隔”指的是文件中有一个字符作为两个变量之间的边界标记。一种非常常见的分隔格式是 CSV 文件；文件名中的字母代表“逗号分隔值”，并使用逗号作为变量分隔符。另一种不太常见的分隔类型使用制表符分隔变量，其扩展名为“TSV”，你猜对了，即“制表符分隔值”。偶尔你也会发现使用分号、冒号或空格作为分隔符的文件。\n\
    \n有一些基础 R 函数可以读取这种类型的文件。在处理纯文本文件时，`{readr}` 包（Wickham 和 Hester, 2020）中的函数相比基础\
    \ R 函数有一些优势。（`{readr}` 包是 tidyverse 的一部分。）与等效的基础 R 函数相比，`{readr}` 函数速度快得多，而且该包中的函数在将变量类型定义为读取操作的一部分时提供了一些有用的灵活性（而不是在读取数据后再修改变量类型）。此外，它返回的是\
    \ tibble 而不是数据框。（有关差异的信息，请参见（Wickham, 2019a, 3.6 数据框和 tibble）。）对于处理非常大的文件，你可能需要研究\
    \ `{data.table}` 包中的 `fread()` 函数（Doyle 等，2023）。\n\n我们通过使用 `library()` 函数来激活 `{readr}`：\n\
    \n```r\nlibrary(readr)\n```\n\n在本章中，我们将使用 `{readr}` 包中的两个函数。每个函数都有多种参数，允许我们控制函数的行为；这些参数将在示例中介绍。\n\
    \n| 函数 | 用途 |\n| --- | --- |\n| `read_csv()` | 读取 CSV 文件的内容 |\n| `read_fwf()`\
    \ | 读取固定宽度文本文件的内容 |\n\n### 5.2 使用 `{readr}` 读取 CSV 文件\n\n在以下示例中，我们将使用 `{palmerpenguins}`\
    \ 数据（Horst 等，2022；Horst，2020）中的版本。\n\n在下面的代码块中，创建了一个 R 字符串对象 `penguins_path`，其中包含文件“penguins.csv”的位置文本字符串。\n\
    \n在第一个示例中，文件已使用 `{dpir}` 包加载到我们的计算机上，并使用该包中的 `dpir_data()` 函数访问该文件（无论它在我们计算机上的位置如何）。\n\
    \n在第二个示例中，文件位于 RStudio 项目文件夹中名为“data”的目录内。`{here}` 包将生成完整路径，使用斜杠或反斜杠分隔符（取决于计算机的操作系统），从\
    \ RStudio 项目的位置开始。\n\n然后，`penguins_path` 对象被用于 `read_csv()` 函数中，以创建一个名为 `penguins_data`\
    \ 的数据框对象。\n\n```r\n# Example 2\n# create object path using the {here} package\n\
    penguins_path <- here::here(\"data\", \"penguins.csv\")\n\n# read the contents\
