  mdcn: "\n\n## 数据准备之旅\n\n《数据准备之旅：使用 R 找到你的方向》以系统化的方式介绍了数据准备的原则，该方式遵循典型的数据科学或统计工作流程。在此背景下，读者将使用统计与数据科学编程语言\
    \ R 来实践解决数据问题的方案。这些方案包括复杂真实数据的示例，增加了更多背景，并让读者面临更大的技术挑战。本书重点介绍从导入到整理再到转换的步骤。它展示了“可视化”如何成为探索性数据分析的重要组成部分——这是一种在清洗数据之前识别潜在数据问题的策略。\n\
    \n本书面向掌握 R 或其他编程语言中数据操作函数并具备一定工作经验的读者。它适合那些分析数据至关重要的学者、基于从客户互动中收集的数据洞察来做决策的企业，以及利用数据为政策和项目决策提供信息的公务员。《数据准备之旅》中描述的原则和实践适用于所有场景，不限于特定背景。\n\
    \n## 主要特点：\n\n- 附有包含本书代码和数据集的 R 包\n- 涵盖多个学科的数据准备综合示例\n- 定义了数据准备从获取到发布的关键原则\n\n\
    **Martin Monkman** 是 MNP 的高级经理，同时也是维多利亚大学继续研究学院商业智能与数据分析课程的讲师。在加入 MNP 之前，Martin\
    \ 在加拿大不列颠哥伦比亚省省级统计机构 BC Stats 有长期工作经历，其中包括十年担任“省统计学家”一职。Martin 拥有维多利亚大学地理学理学学士和文学硕士学位，并自\
    \ 2022 年起成为加拿大统计学会会员。\n\n## CHAPMAN & HALL/CRC 数据科学系列丛书\n\n该系列丛书反映了该领域的跨学科特性，汇集了来自统计学、计算机科学、机器学习和分析学的研究人员、从业者和教师。该系列将出版数据科学领域的前沿研究、行业应用和教材。\n\
