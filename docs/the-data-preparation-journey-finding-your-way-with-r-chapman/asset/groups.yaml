    \ 数据可视化 — 141\n  - 11.3 验证方法 — 145\n\n## *前言*\n\n人们经常指出，帕累托原则¹适用于数据科学——80%的时间花在数据收集和准备上，其余20%花在建模、数据可视化和沟通等“有趣的事情”上。\n\
    \n关于这20%的材料并不缺乏——教科书、期刊文章、博客文章、在线课程、播客等。这并不是说另外80%没有材料。但这些材料分散在各处，分布在特定技术的文章和特定领域的书籍中，还有\
    \ Stack Overflow 问题和各种博客文章。本书作为一本旅行指南：为那些寻求理解数据准备核心要素的读者，介绍并指引一些分散的资源。希望它像灯塔一样，既引导你朝正确的方向前进，又防止你搁浅。\n\
