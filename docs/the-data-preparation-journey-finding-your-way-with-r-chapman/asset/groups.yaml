    ##     3  Very Good\n##     4  Excellent\n##     9 Not Stated\n```\n\n该包还允许使用\
    \ var_lab() 函数为变量附加描述性名称。\n\n## 13 回顾\n\n### 13.1 一些要点\n\n在本书中，我们通过了大量准备数据以进行分析的示例，无论是汇总制表还是建模方法，例如带指示变量的线性回归或时间序列分析和预测。\n\
    \n值得重申的一些要点：\n\n- 你得到的数据不会是你需要的数据。准备好进行分析需要付出努力——深思熟虑的努力。\n- 准备数据的过程不是线性的、分步的过程。它涉及迭代并返回到之前的步骤以解决数据问题。迭代始于\
    \ *import* 步骤，并贯穿 *validation* 和 *cleaning*。\n- 准备过程中的每一个要素都需要你作为研究者，基于你对如何最好地实现研究目标的判断做出决策。从定义要导入哪些变量到如何解决数据中的缺失值，你必须根据数据的使用方式做出明智而深思熟虑的决策。\n\
    - 尽可能快地使用导入函数走得尽可能远。导入后需要做的更改越少越好。\n- 将数据整理成整洁的结构至关重要。\n- 文档至关重要，无论是在代码中还是在项目文件夹中。\n\
    \  - 说明代码的 *why*，而不是 *what*。\n  - 创建包含项目目标和其他关键信息的 README 文件。\n  - 创建数据字典。\n-\
    \ 该文档的受众可能是你已知的合作者，也可能是你尚未见面的未来数据使用者。受众几乎肯定包括未来的你——明年、下个月或明天。\n- 你接收到的数据将以多种格式出现，每种格式都有其自身的特点。熟悉各种格式为分析带来（或不带来）的东西可以帮助你更高效。例如，像\
    \ SPSS 和 SAS 文件这样的带标签格式会携带有关变量和值的宝贵元数据；利用这些额外信息可以为分析带来更深入的见解。\n- 清洁的数据是完整、一致且准确的。具备这三项品质，它就\
    \ *可信*。验证和清理将努力在所有这三个维度上改进数据。\n- 探索和验证数据需要专业知识。\n- 使用包括可视化和结构化测试在内的方法组合，首先识别数据“脏”的方式，然后在采取必要步骤后，确保数据是干净的。\n\
    - 清理数据所需的步骤将取决于研究问题。同一源数据可能需要以完全不同的方式进行清理，以适用于两个不同的研究问题。\n- 在某些情况下，替换缺失值有助于解决数据的结构性问题。在其他情况下，替换缺失值可能会改变我们分析的结果。在数据清理中引入替换时要小心。\n\
    \n### 13.2 接下来怎么办？\n\n我们以灯塔的隐喻开始了本书，它指引船只朝正确方向航行并防止它们触礁。我希望本书中的原则和示例在准备数据以进行分析的背景下能达到同样的效果。\n\
    \n本书中的示例为你在准备数据以进行分析时可能遇到的一些挑战类型提供了指南。但当你踏上自己的数据准备之旅时，你会遇到与这里不同的问题。这里的示例不足以解决问题的可能性很高。你可能需要以不同的方式思考问题，才能找到解决方案。你可能需要其他工具，无论是其他\
    \ R 包还是不同的编程语言。你可能会遇到与此处介绍不同的数据存储方法；如果你开始处理非常大的数据库，这尤其可能。\n\n我们的知识总是有限的。这就是为什么我们需要不断学习和练习我们的技艺。如果你工作或所修课程中没有遇到数据准备挑战，你可能希望将本书中的示例应用于其他数据。这可能是找到一个使用颜色作为变量的\
    \ Excel 文件。或者也许有一个 SQL 数据库需要你建立两个表之间的关系，但这两个表没有共同的变量，因此你必须将两者都连接到第三个表，然后该表可以链接到两者。\n\
    \n包括 tidyverse 在内的 R 生态系统的增长令人惊叹。你遇到的许多问题很可能已经被其他人遇到过。而那个人可能已经写了一篇关于其解决方案的博客文章，或编写了一个具有通用解决方案的包。\n\
    \n我希望本书中的示例能给你信心，让你勇往直前，并在挑战出现时面对它们。\n\n## 参考文献\n\nAbeysooriya, M., Soria, M.,\
