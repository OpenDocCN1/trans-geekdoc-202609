    # 12.4 Creating conditional and calculated variables


    We sometimes find ourselves in a situation where we want to recode our existing
    variables into other categories. An instance of this is when there are a handful
    of categories that make up the bulk of the total, and summarizing the smaller
    categories into an “all other” makes the table or plot easier to read. One example
    of this is the populations of the 13 Canadian provinces and territories: the four
    most populous provinces (Ontario, Quebec, British Columbia, and Alberta) account
    for roughly 85% of the country’s population...the other 15% of Canadians are spread
    across nine provinces and territories. We might want to show a table with only
    five rows, with the smallest nine provinces and territories grouped into a single
    row.


    We can do this with a function in {dplyr}, case_when().


    ```

    canpop <- read_csv(dpj r::dpjr_data("canpop.csv"))

    canpop

    ```


