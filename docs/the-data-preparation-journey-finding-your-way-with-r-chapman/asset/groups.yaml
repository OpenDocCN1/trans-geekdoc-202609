    \ It is important to note that these categories are not mutually exclusive; a\
    \ variable might be simultaneously inconsistent and inaccurate.\n\n# Complete\n\
    \nFor our purposes, “complete” means whether any values in each record are missing\
    \ (internally complete).\n\n“Complete” does not mean that every possible member\
    \ of the population is represented in the data. With a well-designed sample, it\
    \ is possible that a subset of the population can provide an accurate set of measures\
    \ about the population. Furthermore, it is possible to determine whether the records\
    \ are an accurate representation of the whole.\n\n# Consistent\n\nWe will consider\
    \ a measure to be “consistent” if the same value is reported in the same way.\n\
    \nSome examples of consistency:\n\n+   - Units are consistent. One example is\
    \ temperature, and ensuring that the values are consistently reporting in degrees\
    \ Celsius, not mixing Fahrenheit and Kelvin. Another might be in a survey or form\
    \ with an international audience, where salary might be completed by respondents\
    \ in the values of their local currency.\n+   \n+   - Spelling is consistent.\
    \ My home province in Canada is “British Columbia”, but is often abbreviated to\
    \ “B.C.” or “BC”. Or consider the 57 different ways that “Philadelphia” was spelled\
    \ in the US Paycheck Protection Program (PPP) applications. (Au, 2020a)\n+   \n\
    +   - In some cases, the mode of data collection can introduce differences in\
