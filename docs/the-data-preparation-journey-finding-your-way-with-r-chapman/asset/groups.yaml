    \ can give an immediate indication if the code has worked. This is particularly\
    \ true in the early stages of writing your code—the functions can be removed when\
    \ you are confident you are getting the results you expect.\n\n```r\nlibrary(\"\
    tidylog\")\n```\n\nAfter running the library(tidylog) function, the results are\
    \ automatically generated.\n\nThe Major League Baseball teams play in cities in\
    \ the United States and Canada (currently only Toronto!), but draw the best players\
    \ from around the world. In this example the code creates a summary table to show\
    \ the country of birth of the player who batted in the 2001 season. For this we\
    \ will use the data stored in the R package that contains the Lahman baseball\
    \ database (named after Sean Lahman, the person who initially created the database)\
    \ (Friendly et al., 2020).\n\nAt the completion of this run, the {tidylog} package\
    \ produces some summary information about the join, the grouping, and the tally\
    \ functions.\n\n```r\n## start with the Batting table\nLahman::Batting |>\n  ##\
    \ filter for year\n  filter(yearID == \"2001\") |>\n  ## join to People table\
    \ (where the birth country is recorded)\n  left_join(Lahman::People, by = \"playerID\"\
    ) |>\n  ## now group_by and tally\n  group_by(birthCountry) |>\n  tally() |>\n\
    \  arrange(desc(n)) |>\n  slice_head(n = 10)\n```\n\n```\n## filter: removed 110,845\
    \ rows (99%), 1,339 rows remaining\n\n## left_join: added 25 columns (birthYear,\
    \ birthMonth, birthDay, birthCountry, birthState, ...)\n\n##          > rows only\
    \ in x          0\n\n##          > rows only in y  (19,456)\n\n##          > matched\
    \ rows     1,339\n\n##          >                 ========\n\n##          > rows\
    \ total       1,339\n\n## group_by: one grouping variable (birthCountry)\n\n##\
    \ tally: now 22 rows and 2 columns, ungrouped\n\n## slice_head: removed 12 rows\
    \ (55%), 10 rows remaining\n```\n\n```\n## # A tibble: 10 x 2\n##   birthCountry\
    \     n\n##   <chr>        <int>\n```\n\n| birthCountry | n |\n|---|---|\n| USA\
    \ | 1002 |\n| D.R. | 120 |\n| P.R. | 57 |\n| Venezuela | 54 |\n| Mexico | 19 |\n\
    | Cuba | 16 |\n| CAN | 14 |\n| Japan | 14 |\n| Panama | 11 |\n| Australia | 6\
    \ |\n\n## 11 Exploration and validation strategies\n\nIn this chapter:\n\n- Exploratory\
    \ data analysis to identify problems, including the {skimr} package\n- Using structured\
    \ tests with the {validate} package\n\n### 11.1 Identifying dirty data\n\nEarlier\
    \ in Chapter 2, challenges associated with “dirty data” were introduced.\n\n**The\
    \ first challenge:** How do we find the things that are problematic with our data?\n\
    \n**The second challenge:** What can and should we do about them?\n\nThe term\
    \ “data validation” sometimes applies to verification that is applied when the\
    \ data is collected (for example, in a web-based survey tool), and in other contexts\
    \ it applies to a programmatic approach to ensuring the data meet specified conditions.\
    \ In both cases, we can think of data validation as a form of quality control,\
    \ from quick sanity checks to rigorous programmatic testing. (White et al., 2013)\n\
    \nValidation of data during collection might be through the use of drop-down boxes\
    \ that eliminate spelling mistakes or entry fields that require the entered text\
    \ to match a particular pattern. For example, a Canadian postal code is always\
    \ in the pattern of capital letter (but not all letters), digit from 0 to 9, capital\
    \ letter, space, digit, capital letter, and digit. The first letter of the postal\
    \ codes specifies a region; in Newfoundland and Labrador they start with the letter\
    \ “A” while in Yukon they start with “Y”, adding another dimension for possible\
    \ validation. Electronic data collection can also enforce that an element is completed\
    \ before submission.\n\nThese imposed validation rules come with risks and need\
    \ to be thoughtfully implemented. Forcing a person to complete a field might lead\
    \ to made-up values, which might be worse than a missing field. Imagine forcing\
    \ someone to report their income—they might not be comfortable sharing that information,\
    \ and in order to fulfill the requirements of the field enter a “1” or a preposterously\
    \ very large number, neither of them accurate. In this case, it might be better\
    \ for the form to provide a “Prefer not to answer” field, giving respondents an\
    \ option that does not distort the final result.\n\nFor our work here, we will\
    \ focus on checking and validating data after it has been collected. The analyst\
    \ can specify parameters prior to it being made available for the next steps.\
    \ These can be expressed as rules or assumptions, and are based on knowledge of\
    \ the subject. (van der Loo and de Jonge, 2018, Chapter 6: Data Validation)\n\n\
    The type of things we might evaluate include:\n\n- A field has to be structured\
    \ in a certain way; examples include postal codes and date fields.\n- A value\
    \ might have a certain range or a limited number of categories.\n- Some values,\
    \ such as age, have to be positive.\n- There might be a known relationship between\
    \ two or more variables.\n\nWe now turn to approaches to evaluate the values in\
    \ the data.\n\n### 11.2 Exploratory data analysis\n\nOne way to identify dirty\
    \ data is through the process of *exploratory data analysis* (EDA). (Tukey, 1977)\
    \ The EDA process is, first and foremost, intended to help guide our analysis,\
    \ but it has the additional benefit of providing clues about the ways that our\
    \ data is dirty.\n\nEDA consists of two groups of techniques:\n\n- summary statistics\n\
    - data visualization\n\nThe things we are looking for at this stage include:\n\
    \n- the variable types\n- missing values\n- invalid values and outliers, including\
    \ sentinel values\n- data ranges that are too wide or too narrow\n- the units\
    \ of the data\n\n(Adapted from (Zumel and Mount, 2019, p.54))\n\nFor this example,\
    \ we will look at some synthetic data about the employees of a company. The data\
    \ is stored in multiple sheets of an Excel file; we will explore the data in the\
    \ sheet “df_HR_train”, which records whether someone has completed the mandatory\
    \ training courses or not.\n\n```r\nreadxl::excel_sheets(dpjr::dpjr_data(\"cr25/cr25_human_resources.xlsx\"\
    ))\n```\n\n```\n## [1] \"readme\"      \"df_HR_main\"      \"df_HR_transaction\"\
    \n## [4] \"df_HR_train\"\n```\n\nOnce we have read the data into our environment,\
    \ we can use some EDA methods to check the data.\n\n```r\ndf_HR_train <- readxl::read_excel(dpjr::dpjr_data(\"\
    cr25/cr25_human_resources.xlsx\"), sheet = \"df_HR_train\")\n```\n\nOne way we\
    \ might begin our investigation is the dplyr::glimpse() function. This function\
    \ returns the dimensions of the dataframe, the variable types, and the first few\
    \ values of each variable.\n\n```r\nglimpse(df_HR_train, width = 65)\n```\n\n\
    ```\n## Rows: 999\n## Columns: 5\n## $ emp_id       <chr> \"ID001\", \"ID002\"\
    , \"ID003\", \"ID004\", \"ID0~\n## $ train_security <chr> \"TRUE\", \"FALSE\"\
    , \"TRUE\", \"FALSE\", \"FALSE~\n## $ train_crm    <chr> \"TRUE\", \"FALSE\",\
    \ \"TRUE\", \"TRUE\", \"FALSE\"~\n## $ train_qc     <chr> \"NA\", \"FALSE\", \"\
    FALSE\", \"FALSE\", \"FALSE\"~\n## $ train_history <chr> \"TRUE\", \"TRUE\", \"\
    TRUE\", \"TRUE\", \"TRUE\", ~\n```\n"
