    \ larger legal entity. (The current City of Toronto is an amalgamation of what\
    \ were six smaller municipalities.) Some regions have a rather turbulent history\
    \ of changes in their boundaries, and some countries have been created only to\
    \ disappear a few years later.\n\nIf you’re working in the area of social and\
    \ economic research, the national and international statistics agencies provide\
    \ robust and in-depth classification systems, many of which are explicitly designed\
    \ to allow for international comparisons. These systems cover a wide range of\
    \ economic and social statistics. Earlier in this chapter there was an example\
    \ using the North American Industry Classification System (NAICS), used in Canada,\
    \ the United States, and Mexico. (Executive Office of the President, Office of\
    \ Management and Budget, 2022, Statistics Canada (2022); see also Statistics Canada,\
    \ 2020). A similar classification system exists for Australia and New Zealand\
    \ (Australian Bureau of Statistics, 2006), and the European Union’s Eurostat office\
    \ publishes a standard classification system for the products that are created\
    \ through mining, manufacturing, and material recovery (EUROSTAT PRODCOM team,\
    \ 2022). For international statistics, you can start with the classification system\
    \ maintained by the United Nations Statistics Division (United Nations Statistics\
    \ Division, 2020). In Chapter 6, we saw population statistics reported by the\
    \ administrative geography of England and Wales.\n\nFollowing these standardized\
    \ categories in our own work is advantageous. It provides us with a validated\
    \ structure, and should it be appropriate, gives us access to other data that\
    \ can be incorporated into our own research.\n\nYour subject area has established\
    \ classifications; seek them out and use them. Ensuring that your data can be\
    \ combined with and compared to other datasets will add value to your analysis,\
    \ and make it easier for future researchers (including future you!) to work with\
    \ your data. (White et al., 2013)\n\n### 12.5 Indicator variables\n\n> To include\
    \ a categorical variable in a regression, a natural approach is to construct an\
    \ ‘indicator variable’ for each category. This allows a separate effect for each\
    \ level of the category, without assuming any ordering or other structure on the\
    \ categories. (Gelman et al., 2014, p.366)\n\nIndicator variables are also known\
    \ as dummy variables (Suits, 1957) and “one hot” encoding.\n\nExamples of this\
    \ approach abound. It can be a useful approach in forecasting methods; Hyndman\
    \ and Athanasopoulos provide examples where public holidays and days of the week\
    \ are set as dummy variables (Hyndman and Athanasopoulos, 2021, section 7.4 “Some\
    \ useful predictors”).\n\nIt is also a common approach in social data analysis,\
    \ where categorical variables are used to code information. In the section on\
    \ “Discrimination and collider bias” in (Cunningham, 2021, pp.106–110), the data\
    \ are represented in the following way⁴:\n\n```\n## # A tibble: 6 × 5\n##    female\
    \ ability discrimination occupation   wage\n##    <dbl>  <dbl>              <dbl>\
    \      <dbl>  <dbl>\n## 1      0  -0.786                 0     -0.555  0.162\n\
    ## 2      1   2.81                  1      4.93  11.6\n## 3      1  -0.977   \
    \              1     -4.23  -5.86\n## 4      0   1.75                  0     \
    \ 3.95  10.4\n## 5      0   0.152                 0      2.11   4.77\n## 6   \
    \   1  -0.561                 1     -1.48  -3.41\n```\n\nIn this data, the variable\
    \ female is coded as numeric, so it can be used as part of the regression modelling.\n\
    \nMore commonly, though, this variable will have been captured and saved in one\
    \ called gender or sex, and often as a character string. The source data for the\
    \ above table might have originally looked like this:\n\n```\ntb2 <- tb |> \n\
    \  dplyr::rename(gender = female) |>\n  mutate(gender = case_when(\n    gender\
    \ == 1 ~ \"female\",\n    TRUE ~ \"male\"\n  ))\n```\n\n```\ntb2\n```\n\n```\n\
    ## # A tibble: 10 × 5\n##    gender ability discrimination occupation   wage\n\
    ```\n\n⁴ Note: the data in this table is different from what appears in *Causal\
    \ Inference: The Mixtape*, since the values in the data in that source are randomly\
    \ generated.\n"
  mdcn: "\n在第一个解决方案中，我们分别对最大的几个省份进行命名：\n\n```\ncanpop |>\n  mutate(pt_grp = case_when(\n\
    \    # evaluation ~ new value\n    province_territory == \"Ontario\" ~ \"Ontario\"\
    ,\n    province_territory == \"Quebec\" ~ \"Quebec\",\n    province_territory\
    \ == \"British Columbia\" ~ \"British Columbia\",\n    province_territory == \"\
    Alberta\" ~ \"Alberta\",\n    # all others get recoded as \"other\"\n    TRUE\
    \ ~ \"other\"\n  ))\n```\n\n```\n## # A tibble: 13 × 3\n##   province_territory\
    \      population pt_grp\n##   <chr>                       <dbl> <chr>\n## 1 Ontario\
    \                  13448494 Ontario\n## 2 Quebec                    8164361 Quebec\n\
    ## 3 British Columbia          4648055 British Columbia\n## 4 Alberta        \
    \           4067175 Alberta\n## 5 Manitoba                  1278365 other\n##\
    \ 6 Saskatchewan              1098352 other\n## 7 Nova Scotia                923598\
    \ other\n## 8 New Brunswick              747101 other\n## 9 Newfoundland and Labrador\
    \  519716 other\n## 10 Prince Edward Island      142907 other\n## 11 Northwest\
    \ Territories      41786 other\n## 12 Nunavut                    35944 other\n\
    ## 13 Yukon                      35874 other\n```\n\n但这样需要输入很多内容。一种更简洁的做法是，将省份名称放入一个列表，然后用原始变量\
    \ `province_territory` 的值重新编码我们的新变量：\n\n```\ncanpop |>\n  mutate(pt_grp = case_when(\n\
    \    province_territory %in%\n      c(\"Ontario\", \"Quebec\", \"British Columbia\"\
    , \"Alberta\") ~\n      province_territory,\n    TRUE ~\n      \"other\"\n  ))\n\
    ```\n\n```\n## # A tibble: 13 × 3\n##   province_territory      population pt_grp\n\
    ##   <chr>                       <dbl> <chr>\n## 1 Ontario                  13448494\
    \ Ontario\n## 2 Quebec                    8164361 Quebec\n## 3 British Columbia\
    \          4648055 British Columbia\n## 4 Alberta                   4067175 Alberta\n\
    ## 5 Manitoba                  1278365 other\n## 6 Saskatchewan              1098352\
    \ other\n## 7 Nova Scotia                923598 other\n## 8 New Brunswick    \
    \          747101 other\n## 9 Newfoundland and Labrador  519716 other\n## 10 Prince\
    \ Edward Island      142907 other\n## 11 Northwest Territories      41786 other\n\
    ## 12 Nunavut                    35944 other\n## 13 Yukon                    \
    \  35874 other\n```\n\n我们还可以使用比较操作来创建一个人口阈值，本例中为四百万：\n\n```\ncanpop <- canpop\
    \ |>\n  mutate(pt_grp = case_when(\n    population > 4000000 ~ province_territory,\n\
    \    TRUE ~ \"other\"\n  ))\n\ncanpop\n```\n\n```\n## # A tibble: 13 × 3\n## \
    \  province_territory      population pt_grp\n##   <chr>                     \
    \  <dbl> <chr>\n## 1 Ontario                  13448494 Ontario\n## 2 Quebec  \
    \                  8164361 Quebec\n## 3 British Columbia          4648055 British\
    \ Columbia\n## 4 Alberta                   4067175 Alberta\n## 5 Manitoba    \
    \              1278365 other\n## 6 Saskatchewan              1098352 other\n##\
    \ 7 Nova Scotia                923598 other\n## 8 New Brunswick              747101\
    \ other\n## 9 Newfoundland and Labrador  519716 other\n## 10 Prince Edward Island\
    \      142907 other\n## 11 Northwest Territories      41786 other\n## 12 Nunavut\
    \                    35944 other\n## 13 Yukon                      35874 other\n\
    ```\n\n无论我们选择哪种方法，这个新变量都可以用来对表格进行分组：\n\n```\ncanpop |>\n  group_by(pt_grp) |>\n\
    \  summarize(pt_pop = sum(population)) |>\n  arrange(desc(pt_pop))\n```\n\n```\n\
    ## # A tibble: 5 × 2\n##   pt_grp          pt_pop\n##   <chr>            <dbl>\n\
    ## 1 Ontario        13448494\n## 2 Quebec          8164361\n## 3 other       \
    \    4823643\n## 4 British Columbia 4648055\n## 5 Alberta         4067175\n```\n\
    \n### 12.4.1 分类系统\n\n当我们开始在自己的数据中创建新变量时，了解一些已经存在的分类系统会很有用。这样，你可以：\n\n-   免去自行设计变量分类的麻烦，并且\n\
    -   确保你的分析可以与其他结果进行比较。\n\n当然，这些分类系统是针对特定学科领域的。\n\n例如，在许多社会和企业数据中，人们的年龄通常被归入以5年为间隔的“组”，从0-4岁、5-9岁、10-14岁等开始。但并非所有年龄分类系统都遵循这种方式；这取决于具体情境。劳动力的人口统计数据不会需要“0-4”这一类别，而对学龄儿童的分析可能会按他们就读小学、初中和中学的年龄进行分组。因此，许多人口统计表会以多种不同的年龄分组方式提供不同的数据集。（有关示例，参见加拿大统计局，2007。）\n\
    \n还要注意，分类系统中的组成要素会随时间变化。一个常见的例子是，世界各地的城市和国家的边界已经发生了变化。城市边界会变化，往往是人口较多的城市扩张，将较小的社区纳入更大的法律实体。（现在的多伦多市就是由六个较小的自治市合并而成的。）一些地区的边界变化历史相当动荡，有些国家刚成立几年后就消失了。\n\
    \n如果你从事社会和经济研究领域的工作，国家和国际统计机构会提供健全而深入的分类系统，其中许多系统明确设计用于国际比较。这些系统涵盖了广泛的经济和社会统计数据。本章前面有一个使用北美行业分类系统（NAICS）的示例，该系统在加拿大、美国和墨西哥使用。（美国行政管理和预算局，2022；加拿大统计局，2022；另见加拿大统计局，2020）。澳大利亚和新西兰也有类似的分类系统（澳大利亚统计局，2006）；欧盟的欧盟统计局发布了一个标准分类系统，用于对采矿、制造和材料回收产生的产品进行分类（欧盟统计局\
    \ PRODCOM 团队，2022）。对于国际统计资料，你可以从联合国统计司维护的分类系统入手（联合国统计司，2020）。在第6章中，我们看到了按英格兰和威尔士的行政区划报告的人口统计数据。\n\
    \n在我们自己的工作中遵循这些标准化类别是有益的。它为我们提供了一个经过验证的结构，并且在适当的情况下，让我们能够获取其他数据，并将其纳入我们自己的研究。\n\
    \n你的学科领域有既定的分类；去找出来并加以使用。确保你的数据能够与其他数据集合并和比较，将为你的分析增添价值，并使未来的研究者（包括未来的你！）更容易使用你的数据。（White\
    \ 等人，2013）\n\n### 12.5 指示变量\n\n> 要在回归中纳入分类变量，一种自然的方法是为每个类别构造一个“指示变量”。这样就可以为每个类别水平提供独立的效应，而无需假设各类别之间存在任何顺序或其他结构。（Gelman\
    \ 等人，2014，第366页）\n\n这种方法的例子不胜枚举。它在预测方法中是一种有用的方法；Hyndman 和 Athanasopoulos 提供了将公共假日和星期几设置为虚拟变量的示例（Hyndman\
    \ 和 Athanasopoulos，2021，第7.4节“一些有用的预测变量”）。\n\n在社会数据分析中，这也是一种常见的方法，其中分类变量被用来对信息进行编码。在（Cunningham，2021，第106-110页）中的“歧视与对撞偏差”一节中，数据以以下方式呈现⁴：\n\
    \n```\n## # A tibble: 6 × 5\n##    female ability discrimination occupation  \
    \ wage\n##    <dbl>  <dbl>              <dbl>      <dbl>  <dbl>\n## 1      0 \
    \ -0.786                 0     -0.555  0.162\n## 2      1   2.81             \
    \     1      4.93  11.6\n## 3      1  -0.977                 1     -4.23  -5.86\n\
    ## 4      0   1.75                  0      3.95  10.4\n## 5      0   0.152   \
    \              0      2.11   4.77\n## 6      1  -0.561                 1     -1.48\
    \  -3.41\n```\n\n在这份数据中，`female` 变量被编码为数值型，因此它可以用作回归建模的一部分。\n\n不过，更常见的情况是，这个变量会被捕获并保存为名为\
    \ `gender` 或 `sex` 的变量，而且通常是以字符串形式存储。上表的源数据最初可能如下所示：\n\n```\ntb2 <- tb |> \n \
    \ dplyr::rename(gender = female) |>\n  mutate(gender = case_when(\n    gender\
    \ == 1 ~ \"female\",\n    TRUE ~ \"male\"\n  ))\n```\n\n```\ntb2\n```\n\n```\n\
    ## # A tibble: 10 × 5\n##    gender ability discrimination occupation   wage\n\
    ```\n\n⁴ 注：此表中的数据与 *因果推断：混音带* 中显示的数据不同，因为该来源中的数据值是随机生成的。\n"
