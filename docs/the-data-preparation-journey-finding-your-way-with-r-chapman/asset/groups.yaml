    \     <dbl>\n## 1 CEU1021100001 144. 130.\n## 2 CEU1021200001 190. 176.\n## 3\
    \ CEU1021300001 344 247.\n```\n\n这里还有一个最终选项，使用 str_sub() 在 str_detect() 函数内部指定位置。\n\
    \n在继续之前，让我们单独查看 str_sub() 函数的结果。在此代码中，该函数从“Series ID”变量的第 8 和第 9 个位置提取所有字符字符串，结果是长度为两个字符的字符串。\n"
