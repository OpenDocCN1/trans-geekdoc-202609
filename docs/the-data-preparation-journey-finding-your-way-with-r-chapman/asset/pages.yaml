  md: "```\n## Warning: Missing values are always removed in SQL aggregation functions.\n\
    ## Use `na.rm = TRUE` to silence this warning\n## This warning is displayed once\
    \ every 8 hours.\n```\n\n```\nSEA\n```\n\n```\n## # A tibble: 5 x 5\n##   carrier\
    \     n min_air_time mean_air_time max_air_time\n##   <chr>   <int>        <dbl>\
    \         <dbl>        <dbl>\n## 1 AA       365          289          336.   \
    \      385\n## 2 AS       714          277          326.         392\n## 3 B6\
    \       514          283          330.         378\n## 4 DL      1213        \
    \  275          327.         389\n## 5 UA      1117          280          326.\
    \         394\n```\n\n# 10.1.3 Using SQL in your R code\n\nIn addition to writing\
    \ native R code, we can embed SQL inside R code. In the example below, an R chunk\
    \ in the R Markdown document has R code that uses the dbSendQuery() function.\
    \ Inside this function, we first name the connection we are using and then inside\
    \ the quotation marks write SQL code: \"SELECT * FROM flights WHERE dest = 'SEA'\"\
    .\n\nThis query instruction gets saved as the object SEA_sql.\n\nThe R chunk then\
    \ has a second line that uses the dbFetch() function to run the SQL query.\n\n\
    Both the dbSendQuery() and dbFetch() are functions from the {DBI} package.\n\n\
    ```\nSEA_sql <- dbSendQuery(con_nycf,\n    \"SELECT * FROM flights WHERE dest\
    \ = 'SEA'\")\n\ndbFetch(SEA_sql)\n```"
