  md: "```\n# join and summary table\nflights_SEA_summary <- flights_SEA |>\n# select(-origin,\
    \ -dest) |>\n  left_join(airlines, by = \"carrier\") |>\n  group_by(name) |>\n\
    \  tally() |>\n  arrange(desc(n))\n\nflights_SEA_summary |>\n  gt()\n```\n\n|\
    \ name | n |\n|---|---|\n| Delta Air Lines Inc. | 1213 |\n| United Air Lines Inc.\
    \ | 1117 |\n| Alaska Airlines Inc. | 714 |\n| JetBlue Airways | 514 |\n| American\
    \ Airlines Inc. | 365 |\n\nThe SQL code below returns the same table. We can see\
    \ one difference in how the code is written—it runs “inside out” with the third\
    \ step coming before the first and second, rather than in the linear manner we\
    \ are accustomed to in our R pipes.\n\n```\n-- 3. select `name` variable from\
    \ joined table and apply count\nSELECT `name`, COUNT(*) AS `n`\nFROM (\n  SELECT\
    \ `flights_sea`.*, `name`\n  -- 1. query to filter Seattle flights\n  FROM (\n\
    \    SELECT *\n    FROM `flights`\n    WHERE (`dest` = 'SEA')\n  ) AS `flights_sea`\n\
    \  -- 2. join to airlines table\n  LEFT JOIN `airlines`\n    ON (`flights_sea`.`carrier`\
    \ = `airlines`.`carrier`)\n)\n-- 4. define grouping for COUNT (from step 3) and\
    \ sort\nGROUP BY `name`\nORDER BY `n` DESC\n```"
