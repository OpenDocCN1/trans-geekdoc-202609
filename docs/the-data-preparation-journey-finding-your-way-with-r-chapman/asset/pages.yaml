  md: '# 5


    # Importing data: plain-text files


    In this chapter:


    +   - Importing data from delimited text files

    +   - Importing data from fixed-width text files


    # 5.1 Delimited plain-text files


    Plain-text files (sometimes called “ASCII files”, after the character encoding
    standard they use) are often used to share data. They are limited in what they
    can contain, which has both downsides and upsides. On the downside, they can’t
    carry any additional information with them, such as variable types and labels.
    But on the upside, they don’t carry any additional information that requires additional
    interpretation by the software. This means they can be read consistently by a
    wide variety of software tools.


    Plain-text files come in two varieties: delimited and fixed-width. “Delimited”
    is a reference to the fact that the files have a character that marks the boundary
    between two variables. A very common delimited format is the CSV file; the letters
    in the file name stand for “Comma Separated Values”, and use a comma as the variable
    delimiter. Another delimited type, somewhat less common, uses the tab character
    to separate the variables, and will have the extension “TSV” for, you guessed
    it, “Tab Separated Values”. Occasionally you will find files that use semi-colons,
    colons, or spaces as the delimiters.


    There are base R functions to read this type of file. The functions within the
    {readr} (Wickham and Hester, 2020) package has some advantages over the base R
    functions when it comes to plain-text files. (The {readr} package is part of the
    tidyverse.) Compared to the equivalent base R functions, the {readr} functions
    are quite a bit faster, and the package’s functions provide some useful flexibility
    when it comes to defining variable types as part of the read operation (rather
    than reading in the dat and then altering the variable types). As well, it returns
    a tibble instead of a dataframe. (For information about the'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'difference, see (Wickham, 2019a, 3.6 Data frames and tibbles). For working
    with very large files, you may want to investigate the `fread()` function in the
    `{data.table}` package (Doyle et al., 2023.)


    We activate `{readr}` by using the `library()` function:


    ```

    ```r

    library(readr)

    ```

    ```


    In this chapter, we will be using two of the `{readr}` functions. Each has a variety
    of arguments that allow us to control the behaviour of the function; those will
    be dealt with in the examples.


    | function | purpose |

    |---|---|

    | `read_csv()` | reads the contents of a CSV file |

    | `read_fwf()` | reads the contents of a fixed-width text file |


    # ## 5.2 Using `{readr}` to read a CSV file


    In the following examples, we will use versions of the data in the `{palmerpenguins}`
    data (Horst et al., 2022; Horst, 2020)


    In the code chunks below, an R character string object `penguins_path` is created
    that contains the text string with the location of the file “penguins.csv”.


    In the first example, the file has been loaded to our computer using the `{dpir}`
    package, and uses the `dpir_data()` function from that package to access the file
    (no matter its location on our computer).


    In the second example, the file is located in a directory called “data” that is
    in our RStudio project folder. The `{here}` package will generate the full path,
    with slash or backslash separators (depending on your computer’s operating system),
    starting at the location of the RStudio project.


    The `penguins_path` object is then used in the function `read_csv()` to create
    a dataframe object called `penguins_data`.


    ```

    ```r

    # Example 2

    # create object path using the {here} package

    penguins_path <- here::here("data", "penguins.csv")

    ```

    ```'
