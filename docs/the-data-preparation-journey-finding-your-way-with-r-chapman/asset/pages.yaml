  md: "# 7.1.1.1 Using labels\n\nThe labels in an dataframe created by {haven} can\
    \ be converted to a factor type, using the unlabelled() function.\n\nIf we were\
    \ to tally the number of penguins in each species using the penguins dataframe\
    \ that originated from the SPSS file, we would see this:\n\n```\npenguins_sav\
    \ |>\n  group_by(species) |>\n  tally()\n```\n\n```\n## # A tibble: 3 x 2\n##\
    \   species       n\n##   <dbl+lbl> <int>\n## 1 1 [Adelie]   152\n## 2 2 [Chinstrap]\
    \ 68\n## 3 3 [Gentoo]   124\n```\n\nIn this version, the “species” variable retains\
    \ the numeric values.\n\nBy applying the unlabelled() function, the “haven_labelled”\
    \ type variables are transformed into factor types, with the labels (that is,\
    \ the species names) now the shown in our summary table:\n\n```\npenguins_sav\
    \ |>\n  unlabelled() |>\n  group_by(species) |>\n  tally()\n```\n\n```\n## # A\
    \ tibble: 3 x 2\n##   species       n\n##   <fct>    <int>\n## 1 Adelie   152\n\
    ## 2 Chinstrap 68\n## 3 Gentoo   124\n```\n\nAn alternative approach is to the\
    \ explicitly change the variable type, with a to_factor transformation inside\
    \ one of the mutate functions, mutate() and mutate_if(). In this first example,\
    \ the variable species is mutated from labelled to factor type."
  merge: -1
  img_proc: true
- pgno: 102
  md: "```\npenguins_sav |>\n  mutate(species = as_factor(species)) |>\n  group_by(species)\
    \ |>\n  tally()\n```\n\n## # A tibble: 3 x 2\n##   species       n\n##   <fct>\
    \     <int>\n## 1 Adelie      152\n## 2 Chinstrap    68\n## 3 Gentoo      124\n\
    \nIn this second variant, the mutate_if(is.labelled) function transforms all of\
    \ the labelled variables.\n\n```\npenguins_sav |>\n  mutate_if(is.labelled, to_factor)\
    \ |>\n  group_by(species, island) |>\n  tally()\n```\n\n## # A tibble: 5 x 3\n\
    ## # Groups:   species [3]\n##   species island       n\n##   <fct>   <fct>  \
    \  <int>\n## 1 Adelie  Biscoe      44\n## 2 Adelie  Dream       56\n## 3 Adelie\
    \  Torgersen   52\n## 4 Chinstrap Dream     68\n## 5 Gentoo  Biscoe     124\n\n\
    # 7.1.2 Reading an SPSS survey file: “Video”\n\nThe functionality of a labelled\
    \ dataframe is very beneficial when working with survey data. The dataframe can\
    \ contain the variable codes as captured in the form, the values associated with\
    \ those values, as well as the text of the question in the label.\n\nThe file\
    \ used in this example comes from the University of Sheffield Mathematics and\
    \ Statistics Help’s “Datasets for Teaching”²\n\n²https://www.sheffield.ac.uk/mash/statistics/datasets"
