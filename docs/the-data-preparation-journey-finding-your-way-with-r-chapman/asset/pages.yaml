  img_proc: true
- pgno: 164
  md: "In addition to telling us that there are 61 records where the value in the\
    \ body_mass_g variable is greater than 5000 grams, it is also letting us know\
    \ that there are 2 NA values.\n\nWe can add an if() statement that filters out\
    \ the gentoo penguins, and then check the body mass.\n\n```\ncheck_penguins <-\
    \ check_that(\n  penguins,\n  if (species != \"Gentoo\") body_mass_g <= 5000\n\
    )\n\nsummary(check_penguins)\n```\n\nNow all the records (except the single “NA”)\
    \ pass. What has happened? The first thing is that we have excluded all of the\
    \ gentoo penguins—if it’s gentoo, it gets marked “pass”. All the remaining penguins\
    \ (that is, the chinstrap and Adélie birds) are evaluated against the body mass\
    \ value of 5000 grams. And they all pass.\n\nLet’s explore the data a bit more.\
    \ If we filter our penguins by those that are over 5000 grams, what do we find?\n\
    \n```\npenguins |>\n  filter(body_mass_g > 5000) |>\n  distinct(species)\n```\n\
    \n```\n## # A tibble: 1 x 1\n##   species\n##   <fct>\n## 1 Gentoo\n```\n\nSo\
    \ this is confirms that all of the heavier penguins are gentoos, meeting our expectations.\n\
    \n# Range:\n\nWe know that the {palmerpenguin} data is from three seasons of measurement,\
    \ 2007-2009. We can write a validation test to ensure that our year variable falls\
    \ within that range.\n\n```\ncheck_penguins <- check_that(penguins, year >= 2007\
    \ & year <= 2009)\nsummary(check_penguins)\n```"
