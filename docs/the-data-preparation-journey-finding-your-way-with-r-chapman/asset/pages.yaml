  md: '# ### 6.2 Extended example


    Very often, Excel files are far more complicated than the case above. In the following
    example, we will read the contents of one sheet in an Excel file published by
    the UK Office of National Statistics, drawn from the 2021 Census of England and
    Wales. The file “census2021firstresultsenglandwales1.xlsx” has the population
    by local authorities (regions), and includes sheets with notes about the data,
    and data tables containing the population by sex and five-year age groups, along
    with population density and number of households.


    Our focus is on sheet “P01”, with population by sex. The first few rows of the
    data look like this:


    ![](img/b86622d1e9ca82b3cbec45faaffaaf26_69_0.png)


    **FIGURE 6.1** *UK Census data.*


    The {readxl} package’s read_excel() function is the one we want to use. The first
    item is the path to the file. The function’s default is to read the first sheet
    in the Excel file, which is not what we want, so we use the sheet = argument to
    specify “P01”. We will also read only the first 10 rows in the sheet, using the
    n_max = 10 specification.'
