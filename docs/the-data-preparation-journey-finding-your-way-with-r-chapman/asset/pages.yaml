    \ 1, 1, 0, 0, 1, 0, 0\n```\n\nSome important things to note about dummy_cols()\n\
    \n+   - the function will create as many indicator variables as there are values\
    \ in the character or factor variable\n+   - the function will create indicator\
    \ variables for all of the character and factor variables in the data, unless\
    \ otherwise specified.\n\nLet’s look at how dummy_cols() behaves with two of the\
    \ variables in {palmer-penguins}:\n\n```\nlibrary(palmerpenguins)\n\nset.seed(1729)\
    \ # Ramanujan's taxicab number: 1^3 + 12^3 = 9^3 + 10^3\n\npenguin_subset <- penguins\
    \ |>\n  slice_sample(n = 6) |>\n  dplyr::select(species, island) |>\n  arrange(species)\n\
    ```\n\npenguin_subset\n\n```\n## # A tibble: 6 x 2\n##   species island\n##  \
    \ <fct>   <fct>\n## 1 Adelie  Biscoe\n## 2 Adelie  Torgersen\n## 3 Chinstrap Dream\n\
    ## 4 Gentoo  Biscoe\n## 5 Gentoo  Biscoe\n## 6 Gentoo  Biscoe\n```"
