  md: '# 12.4 Creating conditional and calculated variables


    We sometimes find ourselves in a situation where we want to recode our existing
    variables into other categories. An instance of this is when there are a handful
    of categories that make up the bulk of the total, and summarizing the smaller
    categories into an “all other” makes the table or plot easier to read. One example
    of this is the populations of the 13 Canadian provinces and territories: the four
    most populous provinces (Ontario, Quebec, British Columbia, and Alberta) account
    for roughly 85% of the country’s population...the other 15% of Canadians are spread
    across nine provinces and territories. We might want to show a table with only
    five rows, with the smallest nine provinces and territories grouped into a single
    row.


    We can do this with a function in {dplyr}, case_when().


    ```

    canpop <- read_csv(dpj r::dpjr_data("canpop.csv"))

    canpop

    ```


    ```

    ## # A tibble: 13 x 2

    ##   province_territory     population

    ##   <chr>                      <dbl>

    ## 1 Ontario                13448494

    ## 2 Quebec                  8164361

    ## 3 British Columbia        4648055

    ## 4 Alberta                 4067175

    ## 5 Manitoba                1278365

    ## 6 Saskatchewan            1098352

    ## 7 Nova Scotia              923598

    ## 8 New Brunswick            747101

    ## 9 Newfoundland and Labrador 519716

    ## 10 Prince Edward Island     142907

    ## 11 Northwest Territories     41786

    ## 12 Nunavut                  35944

    ## 13 Yukon                    35874

    ```'
  merge: -1
  img_proc: true
- pgno: 195
  md: "In this first solution, we name the largest provinces separately:\n\n```\n\
    canpop |>\n  mutate(pt_grp = case_when(\n    # evaluation ~ new value\n    province_territory\
    \ == \"Ontario\" ~ \"Ontario\",\n    province_territory == \"Quebec\" ~ \"Quebec\"\
    ,\n    province_territory == \"British Columbia\" ~ \"British Columbia\",\n  \
    \  province_territory == \"Alberta\" ~ \"Alberta\",\n    # all others get recoded\
    \ as \"other\"\n    TRUE ~ \"other\"\n  ))\n```\n\n```\n## # A tibble: 13 x 3\n\
    ##   province_territory      population pt_grp\n##   <chr>                   \
    \    <dbl> <chr>\n## 1 Ontario                  13448494 Ontario\n## 2 Quebec\
    \                    8164361 Quebec\n## 3 British Columbia          4648055 British\
    \ Columbia\n## 4 Alberta                   4067175 Alberta\n## 5 Manitoba    \
    \              1278365 other\n## 6 Saskatchewan              1098352 other\n##\
    \ 7 Nova Scotia                923598 other\n## 8 New Brunswick              747101\
    \ other\n## 9 Newfoundland and Labrador  519716 other\n## 10 Prince Edward Island\
    \      142907 other\n## 11 Northwest Territories      41786 other\n## 12 Nunavut\
    \                    35944 other\n## 13 Yukon                      35874 other\n\
    ```\n\nBut that's a lot of typing. A more streamlined approach is to put the name\
    \ of our provinces in a list, and then recode our new variable with the value\
    \ from the original variable province_territory:\n\n```\ncanpop |>\n  mutate(pt_grp\
    \ = case_when(\n    province_territory %in%\n      c(\"Ontario\", \"Quebec\",\
    \ \"British Columbia\", \"Alberta\") ~\n      province_territory,\n    TRUE ~\n\
    \      \"other\"\n  ))\n```"
  merge: -1
