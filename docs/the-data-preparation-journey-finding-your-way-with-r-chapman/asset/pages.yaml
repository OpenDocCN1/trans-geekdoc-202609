  md: '# 3


    # Data documentation


    In this chapter:


    +   - Why we want to create documentation

    +   - What elements to record

    +   - Project information, including data dictionaries

    +   - Code documentation through literate programming


    # 3.1  Introduction


    The documentation of the data sources, methods, and workflow is vital for reproducibility.
    There are two places where we need to embrace documentation: the first is within
    the code scripts, and the second is what we might consider the meta-information
    about our projects.


    > “If you’re not thinking about keeping track of things, you won’t keep track
    of things.” —Karl Broman


    Documentation is also essential if you intend to share your data (White et al.,
    2013). The documentation we create provides metadata (which we will see more of
    in the data dictionary section below).


    # 3.2  Documentation and recordkeeping


    The reasons for documenting our work are similar to the reasons we would save
    and output our cleaned data file:


    +   - To make the project available to a collaborator.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - To provide a record for others who might use the data in the future.
    Your project might repeat a year or more in the future, after you have moved on
    to a new role. Leaving good documentation is good karma, or a “pay it forward
    in advance”—imagine how good that future user is going to feel when they find
    your clear explanations!

    +   - To create a save point in our workflow, so that we can continue our work
    later but without having to go through all the steps to remember everything we’ve
    done.


    As well, things change (the data, the software and hardware we use, the motivations
    for our work) and capturing the details about those things at the point we implement
    them helps us make any necessary changes that might be required at a later date.


    There doesn’t seem to be a single-best how-to instruction on “documentation” in
    the context of data analytics or data science. What advice exists tends to be
    prescriptive and at a high level, and not overly descriptive of what makes good
    documentation. The term appears in some of the textbooks and manuals on how to
    do data science, and there are some journal articles that address documentation
    in the context of reproducible research. In the blog post “Let’s Get Intentional
    About Documentation,” Randy Au presents the case that a better term might be “recordkeeping”.


    > “Recordkeeping is keeping records, notes, and artifacts around to help in creating
    documentation in the future. It’s done by the people involved in doing the actual
    work saving things and making clarifications that only they really understand,
    with no expectation that someone else needs to understand everything. The material
    collected is primarily intended for use to write the actual documentation. Think
    of it as preserving raw data for future use.” (Au, 2020b)


    I like the way this is framed. In this view, “documentation” becomes a fully-realized
    user manual, suitable for complex and recurring projects with many different contributors,
    and that might be considered mission critical. A lot of data science work doesn’t
    meet those criteria, so what is needed isn’t “documentation” but the notes that
    someone could use to build the documentation.


    If it’s a one-off project, you can probably have minimal (but not zero!) recordkeeping.
    But a project that repeats on a regular schedule (whether daily, monthly, or annually)
    should have more robust recordkeeping, and potentially some documentation.


    And it’s important to think about this at the beginning of your work, perhaps
    even before the beginning. Taking this approach, recordkeeping gets built into
    the process and your daily workflow, and becomes part of the work of data analysis.
    For example, you could record the source of your data as you’re downloading it,
    or make comments about why you chose a particular function'
  merge: -1
