- pgno: 209
  md: '# 12.6.2 Missing numeric values


    > > “Missing data are unobserved values that would be meaningful for analysis
    if observed; in other words, a missing value hides a meaningful value.” (Little,
    2020)


    The functions used above for filling missing text values can also be used for
    missing numeric values. But when dealing with the replacement of numeric values,
    we need to be mindful that the values we use will be incorporated into models
    and analysis; we need to be clear that the filled values are estimates, including
    sufficient documentation in our methodology section.


    Furthermore, there is a great deal of literature on the topic of imputation of
    missing values. As researchers, we need to be aware of why the values are missing:
    are we dealing with values that are missing “at completely random,” “at random,”
    or “not at random?” Delving into the literature, you’ll discover that these terms
    are precisely defined, and the solutions we adopt to deal with missingness will
    depend on the reason (or reasons) why the data are missing. (Little, 2020)


    For the examples presented here, we will assume that you have already given significant
    thought to these methodological questions. As we discussed earlier in this chapter,
    how we clean data is influenced by our research questions. As well, we need to
    consider our cleaning strategy in light of why the raw data are the way they are.


    With that preamble, let’s move to working with some real data. In this example,
    the data series is the number of salaried employees in the Accommodation services
    industry in British Columbia, Canada, for the years 2001 through 2020. The data
    are collected and published by Statistics Canada, and for some years the data
    are judged to be “too unreliable to be published.” This leaves some gaps in our
    data.


    ```

    ## # A tibble: 6 x 4

    ##   label ref_year REF_DATE VALUE

    ##   <chr>   <dbl> <chr>     <dbl>

    ## 1 Salaried   2001 2001-01-01  4458

    ## 2 Salaried   2002 2002-01-01  4392

    ## 3 Salaried   2003 2003-01-01  4124

    ## 4 Salaried   2004 2004-01-01  4828

    ## 5 Salaried   2005 2005-01-01  4069

    ## 6 Salaried   2006 2006-01-01  5048

    ```


    We will employ Exploratory Data Analysis, and plot the data:'
