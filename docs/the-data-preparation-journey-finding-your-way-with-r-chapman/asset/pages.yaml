- pgno: 24
  md: '# 2.2 Data quality


    Part of the data preparation process is to ask, “What is the data’s *quality*?”


    One resource that is useful to frame your thinking on this is Statistics Canada’s
    *Quality Guidelines* (Statistics Canada, 2019). Like other official statistical
    agencies around the world, Statistics Canada’s reputation is staked on making
    high quality data available to the widest possible audience. They have identified
    six elements of data quality.


    +   - Relevance: The degree to which the data meets the user’s needs and relates
    to the issues that the user cares about.

    +   - Timeliness and punctuality: The delay between the information reference
    period and the date when the data becomes available.

    +   - Accuracy and reliability: Accuracy “is the degree to which the information
    correctly describes the phenomena it was designed to measure.”

    +   - Accessibility and clarity: “The ease with which users can learn that the
    information (including metadata) exists, find it, view it and import it into their
    own work environment.”

    +   - Interpretability: “The availability of supplementary information and metadata
    needed to interpret and use statistical information appropriately.”

    +   - Coherence and comparability: “The degree to which it can be reliably combined
    and compared with other statistical information within a broad analytical framework
    over time.”


    In our data preparation process, we want to ensure our own work is accessible
    and interpretable; this is the motivation behind documentation.


    Another typology of “data quality” is found in (Wang et al., 1995). High quality
    data is:


    +   - Accessible

    +   - Interpretable

    +   - Useful

    +   - Believable'
  merge: -1
  img_proc: true
- pgno: 25
  md: "“Dirty data” is data that falls short on the *believable* dimension, in particular,\
    \ evaluating whether the data are complete, consistent, and accurate. It is important\
    \ to note that these categories are not mutually exclusive; a variable might be\
    \ simultaneously inconsistent and inaccurate.\n\n# Complete\n\nFor our purposes,\
    \ “complete” means whether any values in each record are missing (internally complete).\n\
    \n“Complete” does not mean that every possible member of the population is represented\
    \ in the data. With a well-designed sample, it is possible that a subset of the\
    \ population can provide an accurate set of measures about the population. Furthermore,\
    \ it is possible to determine whether the records are an accurate representation\
    \ of the whole.\n\n# Consistent\n\nWe will consider a measure to be “consistent”\
    \ if the same value is reported in the same way.\n\nSome examples of consistency:\n\
    \n+   - Units are consistent. One example is temperature, and ensuring that the\
    \ values are consistently reporting in degrees Celsius, not mixing Fahrenheit\
    \ and Kelvin. Another might be in a survey or form with an international audience,\
    \ where salary might be completed by respondents in the values of their local\
    \ currency.\n+   \n+   - Spelling is consistent. My home province in Canada is\
    \ “British Columbia”, but is often abbreviated to “B.C.” or “BC”. Or consider\
    \ the 57 different ways that “Philadelphia” was spelled in the US Paycheck Protection\
    \ Program (PPP) applications. (Au, 2020a)\n+   \n+   - In some cases, the mode\
    \ of data collection can introduce differences in the value recorded. This can\
    \ apply to everything from variability of scientific instruments such as air quality\
    \ sensors (Khreis et al., 2008) to how people respond to surveys conducted in\
    \ different media (Abeysundera, 2015) (Holbrook et al., 2003) (St-Pierre and Béland,\
    \ 2004).\n\n# Accurate\n\nWhen we say “accurate”, we mean that the value recorded\
    \ in our data is the value measured.\n\nSome examples of inaccurate data are:\n\
    \n+   - The use of a default (or sentinel) value, inserted as a placeholder for\
    \ unknown or missing values in place of a missing or “unknown” value. This is"
  merge: -1
  img_proc: true
- pgno: 26
  md: 'sometimes part of the data collection or database software, leading to values
    that should have been “unknown” being entered as the default. This can be the
    consequence of a data entry validation process that requires an entry (that is,
    data entry cannot continue until the field has an entry) or an entry in a particular
