    , ~\"geo_level\",\n  \"K04\", \"England & Wales\", 0,\n  \"E92\", \"England\"\
    , 1,\n  \"E12\", \"Region\", 2,\n  \"E09\", \"London Borough\", 3,\n  \"E10\"\
    , \"County\", 3,\n  \"E07\", \"Non-Metropolitan District\", 4,\n  \"E06\", \"\
