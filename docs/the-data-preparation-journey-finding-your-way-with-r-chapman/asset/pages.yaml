    \ == 3,\n            direction = \"left-up\", name = \"field3\") |>\n  behead(direction\
    \ = \"left\", name = \"field4\") |>\n# now strip (behead) the column names\n \
    \ behead(direction = \"up\", name = \"gender\") |>\n# add row strips to preserve\
    \ visual compatibility\n  arrange(row)\n```\n```\n\nDid we get the results we\
    \ expected? Let’s do some quick checks of the data,"
