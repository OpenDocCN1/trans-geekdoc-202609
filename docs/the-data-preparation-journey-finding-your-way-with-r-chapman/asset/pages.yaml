  md: "so we don’t need to specify the direction as an argument. We will examine other\
    \ options for cleaning data later.\n\n```\npenguins_code <- penguins_code |>\n\
    \  # rename variables\n  rename(Value = \"variable\",\n    ...2 = \"variable_value\"\
    ,\n    Label = \"variable_label\") |>\n  # fill in blank names\n  fill(variable)\
    \ |>\n  # change to numeric\n  mutate(variable_value = as.numeric(variable_value))\n\
    \npenguins_code\n```\n\nAt this point, there are two possible solutions:\n\n+\
    \   1. Join the values from the “penguins_code” dataframe, so that in addition\
    \ to the variable with numeric values, there is also a variable with the character\
    \ strings.\n+   2. Using the functions in the {labelled} package, convert the\
    \ variables into “labelled” type, so the the numeric values remain and the labels\
    \ are applied. In this scenario, the end-state is the same as reading the SPSS\
    \ file directly.\n\n# Final step: join variables\n\n```\npenguins_code_wide <-\
    \ penguins_code |>\n  # mutate(row_num = row_number()) |>\n  pivot_wider(names_from\
    \ = c(variable), values_from = variable_label)\n\npenguins_code_wide\n```\n\n\
