- pgno: 84
  md: "# 6.2 Extended example\n\nA check of the tail of the data (above) reveals a\
    \ problem with the structure of the Excel file, which (mostly) reflects the nature\
    \ of the hierarchy. This is not a problem with the {tidyr} and {unpivotr} functions!\
    \ Those functions are doing things exactly correctly. The values are being pulled\
    \ from the value that is found at “left-up”.\n\nThe first thing that catches my\
    \ eye is that `field2`—the Region—should be NA for Wales, but it has been assigned\
    \ to the South West, which is the last English Region in the data.\n\nMore problematically,\
    \ the Welsh Unitary Authorities (W06) should be in `field3`, at the same level\
    \ as the English Unitary Authorities (E06), but instead have been assigned to\
    \ `field4`. This has led to Somerset, in England, to be assigned to the column\
    \ where we expect to see the names of the Welsh Unitary Authorities.\n\nLet’s\
    \ take a look at the details of the first row of the Welsh Unitary Authorities.\
    \ First, in the uk_census object, we see that the value of `local_format_id` for\
    \ the name (“Isle of Anglesey”) is 60.\n\n```\n```r\nuk_census |>\n  dplyr::filter((row\
    \ == 361)) |>\n  select(address, local_format_id, data_type, character, numeric)\n\
    ```\n```\n\nA tibble: 5 × 5\n\n|   | address | local_format_id | data_type | character\
    \ | numeric |\n|---|---------|-----------------|-----------|-----------|---------|\n\
    | 1 | A361 | 11 | character | W06000001 | NA |\n| 2 | B361 | 60 | character |\
    \ Isle of An~ | NA |\n| 3 | C361 | 33 | numeric | <NA> | 68900 |\n| 4 | D361 |\
    \ 33 | numeric | <NA> | 35200 |\n| 5 | E361 | 33 | numeric | <NA> | 33700 |\n\n\
    We can then use this to examine the details of the indent formatting, which we\
    \ captured in the formats object.\n\n```\n```r\nuk_census_formats$local$alignment$indent[60]\n\
    ```\n```\n\n```\n```text\n## [1] 4\n```\n```\n\nThere are 4 indents. You will\
    \ recall that the `behead_if()` function was looking left and up. In the case\
    \ of the Welsh entries, the function has looked left and up until it found an\
    \ entity that has fewer indents, which happens to be in England, not Wales."
  merge: -1
  img_proc: true
