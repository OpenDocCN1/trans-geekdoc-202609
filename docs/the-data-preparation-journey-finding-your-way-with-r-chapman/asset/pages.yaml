    ## [1] "1973-10-22"


    ```

    mdy("October 22nd, 1973")

    ```


    ## [1] "1973-10-22"


    ```

    dmy("22-Oct-1973")

    ```


    ## [1] "1973-10-22"


    A third manner in which dates can be stored is with a truncated representation.
    For example, total sales for the entire month might be recorded as a single value
    associated with “Jan 2017” or “2017-01”, or a quarterly measurement might be “2017-Q1”.


    ```

    # month

    ym("1973-10")

    ```


    ## [1] "1973-10-01"


    ```

    my("Oct 1973")

    ```


    ## [1] "1973-10-01"


    ```

    # quarter

    yq("1973-Q1")

    ```'
