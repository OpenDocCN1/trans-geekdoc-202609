- pgno: 205
  md: "```\n```r\npenguin_subset_1 <- penguin_subset |>\n  fastDummies::dummy_cols()\n\
    \nglimpse(penguin_subset_1, width = 65)\n```\n```\n\n```\n```\n## Rows: 6\n##\
    \ Columns: 8\n## $ species          <fct> Adelie, Adelie, Chinstrap, Gentoo, Ge~\n\
    ## $ island           <fct> Biscoe, Torgersen, Dream, Biscoe, Bis~\n## $ species_Adelie\
    \   <int> 1, 1, 0, 0, 0, 0\n## $ species_Chinstrap <int> 0, 0, 1, 0, 0, 0\n##\
    \ $ species_Gentoo   <int> 0, 0, 0, 1, 1, 1\n## $ island_Biscoe    <int> 1, 0,\
    \ 0, 1, 1, 1\n## $ island_Dream     <int> 0, 0, 1, 0, 0, 0\n## $ island_Torgersen\
    \ <int> 0, 1, 0, 0, 0, 0\n```\n```\n\nFirst, you will notice that we started with\
    \ two factor variables, species and island; we now have indicator variables for\
    \ both.\n\nAnd because there are three species of penguins and three islands,\
    \ we have three indicator variables for both of the original variables.\n\nIn\
    \ the instance where we have multiple character or factor variables in our source\
    \ data, we can control which variables get the `dummy_cols()` treatment with the\
    \ option, `select_columns`. In the example below, the result provides us with\
    \ an indicator variable for species but not island.\n\nIn addition, rather than\
    \ dropping the first created variable, we can specify that the most frequently\
    \ occurring value be removed with the argument `remove_most_frequent_dummy = TRUE`.\
    \ Because there are more Gentoo penguins in our sample of the data, the indicator\
    \ variable `species_Gentoo` is not created.\n\n```\n```r\npenguin_subset_2 <-\
    \ penguin_subset |>\n  fastDummies::dummy_cols(\n    select_columns = \"species\"\
    ,\n    remove_most_frequent_dummy = TRUE)\n\nglimpse(penguin_subset_2, width =\
    \ 65)\n```\n```\n\n```\n```\n## Rows: 6\n## Columns: 4\n## $ species <fct> Adelie,\
    \ Adelie, Chinstrap, Gentoo, Ge~\n## $ island  <fct> Biscoe, Torgersen, Dream,\
    \ Biscoe, Bis~\n```\n```"
