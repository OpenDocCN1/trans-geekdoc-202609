- pgno: 79
  md: '![](img/b86622d1e9ca82b3cbec45faaffaaf26_79_0.png)


    **FIGURE 6.3** *UK Census data.*


    This shows that for most of the various cell formattings used in the file most
    have zero indentation, but some have 1, 2, 3, or 4 indents.


    Back to the object uk_census. We are interested in the data starting in the eighth
    row, so we need to filter for that.


    For the {tidyxl} functions to work, the first column needs to define the hierarchical
    structure. To accomplish this, we will select it out using the != operator.


    The behead_if() function identifies a level of headers in a pivot table, and makes
    it part of the data. Similar to the {tidyr} function pivot_longer(), it creates
    a new variable for each row based on the headers. In the case of the UK Census
    data, the headers are differentiated by the number of indents in the formatting.


    Let’s test that by assigning the “left-up” position value to a new variable, field0.
    For each row in the uk_census object, the number of indentations associated with
    the local_format_id is evaluated; if it’s zero, the following happens: starting
    at the numeric value, the function looks left and then up until it finds a value
    that has fewer indentations. For example, the “England” row has a single indentation,
    so the function looks left and up until it finds a value that has zero indents
    in the formatting; the value from that cell is assigned to the variable field0
    (for zero indents).'
  merge: -1
  img_proc: true
- pgno: 80
  md: "```\nuk_census |>\n  dplyr::filter((row >= 7)) |>\n  filter(col != 1) |>\n\
    \  behead_if(indent[local_format_id] == 0,\n    direction = \"left-up\",\n   \
    \ name = \"field0\"\n  ) |>\n  select(address, row, col, content, field0) |>\n\
    \  dplyr::filter(row < 30)\n```\n\n```\n## # A tibble: 90 x 5\n##   address  \
    \ row   col content field0\n##   <chr>   <int> <int> <chr>   <chr>\n## 1 C7  \
    \        7     3 104     Area name\n## 2 D7          7     4 105     Area name\n\
    ## 3 E7          7     5 106     Area name\n## 4 C8          8     3 59597300\
    \ England and Wales\n## 5 D8          8     4 30420100 England and Wales\n## 6\
    \ E8          8     5 29177200 England and Wales\n## 7 B9          9     2 110\
    \     England and Wales\n## 8 C9          9     3 56489800 England and Wales\n\
    ## 9 D9          9     4 28833500 England and Wales\n## 10 E9         9     5\
    \ 27656300 England and Wales\n## # i 80 more rows\n```\n\nLet’s continue that\
    \ through all the levels of indentation. There are four, so we will create a variable\
    \ that starts with field and then a digit with the number of indentations.\n\n\
    ```\nuk_census_behead <- uk_census |>\n  dplyr::filter((row >= 7)) |>\n  filter(col\
    \ != 1) |>\n  behead_if(indent[local_format_id] == 0,\n    direction = \"left-up\"\
    , name = \"field0\") |>\n  behead_if(indent[local_format_id] == 1,\n    direction\
    \ = \"left-up\", name = \"field1\") |>\n  behead_if(indent[local_format_id] ==\
    \ 2,\n    direction = \"left-up\", name = \"field2\") |>\n  behead_if(indent[local_format_id]\
    \ == 3,\n    direction = \"left-up\", name = \"field3\") |>\n  behead_if(indent[local_format_id]\
    \ == 4,\n    direction = \"left-up\", name = \"field4\")\n```"
  merge: -1
