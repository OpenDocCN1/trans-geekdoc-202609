    The data has been read correctly, including the fact that the data variables are
    read in the correct format. But this loses an important piece of information:
    the geographical hierarchy. In the Excel file, the levels of the hierarchy are
    represented by the indentation. Our next challenge is to capture that information
    as data we can use.


    # 6.2.1 Excel formatting as data


    One thing to notice about this data is the Area name variable is hierarchical,
    with a series of sub-totals. The lower (smaller) levels, containing the component
    areas of the next higher level in the hierarchy, are represented by indentations
    in the area name value. The lower the level in the hierarchy, the more indented
    the name of the area.


    The specifics of the hierarchy are as follows:


    +   - The value “England and Wales” contains the total population, which is the
    sum of England (Excel’s row 8) and Wales (row 360).

    +   - England (but not Wales) is then further subdivided into nine sub-national
    Regions (coded as “E12” in the first three characters of the Area code variable).

    +   - These Regions are then are divided into smaller units, but the description
    of those units varies. These are Unitary Authorities (E06), London Boroughs (E09),
    Counties (E10), and Metropolitan Counties (E11); for our purpose, let’s shorthand
    this level as “counties”.

    +   - The county level is further divided into Non-Metropolitan Districts (E07),
    and Metropolitan Counties are subdivided into Metropolitan Districts (E08). The
    image above shows Tyne and Wear (an E11 Met County, at row 18) is subdivided,
    starting with Gateshead, while Cumbria (an E10 County, at row 31) is also subdivided,
    starting with Allerdale.

    +   - Wales is divided into Unitary Authorities, coded as “W06” in the first three
    characters of the Area code variable. In Wales, there is no intervening Region,
    so these are at the same level as the Unitary Authorities in England. “Local


    2 The hierarchy of the administrative geographies of the UK can be found at the
    “England” and “Wales” links on [the ONS “Administrative geographies” page] (https://www.ons.gov.uk/methodology/geography/ukgeographies/administrativegeography).'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Authority Districts, Counties and Unitary Authorities (April 2021) Map in United
    Kingdom³.


    This complicated structure means that the data has multiple subtotals—a `sum()`
    function on the `All persons` variable will lead to a total population of 277,092,700,
    roughly 4.7 times the actual population of England and Wales in 2021, which was
    59,597,300.


    What would be much more useful is a structure that has the following characteristics:


    +   - No duplication (people aren’t double-counted).

    +   - A code for the level of the hierarchy, to enable filtering.

    +   - Additional variables (columns), so that each row has the higher level area
    of which it is a part. For example, County Durham would have a column that contains
    the regional value “North East” and the country value of “England”.


    With that structure, we could use the different regional groupings in a `group_by()`
    function.


    As we saw earlier, the {readxl} function `read_excel()` ignores the formatting,
    so there is no way to discern the level in the characters.


    Let’s explore approaches to extracting the information that is embedded in the
    data and the formatting, and use that to prune the duplicated rows.


    # Approach 1 - use the Area code


    The first approach we can take is to extract the regional element in the `area_code`
    variable, and use that to filter the data.


    For example, if we want to plot the population in England by the county level,
    an approach would be to identify all those rows that have an Area code that starts
    with one of the following:


    +   - Unitary Authorities (E06), London Boroughs (E09), Counties (E10), and Metropolitan
    Counties (E11)


    For this, we can design a regular expression that identifies a letter “E” at the
    beginning by using the “^” character. (Remember, the “E” is for England, and “W”
    for Wales.) This is then followed by either a 0 or a 1 in the 2nd character'
  merge: -1
  img_proc: true
