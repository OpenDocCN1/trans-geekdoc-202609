  md: '+   - A high-level statement about *how* the analysis was done

    +     - For example: “This analysis used the daily data from 2010 through 2019
    to calculate average per month volumes, which were then used in an ARIMA model
    to develop a 6 month forecast.”

    +   - Details about the analysis and code:

    +     - Things that informed decisions (“I chose this statistical test because...”
    or “The variable date of birth was transformed into ‘Age on July 1, 2020’ because...”)

    +     - The instruction list—descriptive text that describes what files or chunks
    of code are doing, but not how they are doing it.

    +     - The data dictionary or code book.

    +   - Details about the software and packages used:

    +     - Versions and (if available) release dates.


