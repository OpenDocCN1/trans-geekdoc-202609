- pgno: 33
  md: '# 3.3 Code documentation


    > “Document and comment your code for yourself as if you will need to understand
    it in 6 months.” — attributed to Jenny Bryan


    In the journal article “Good enough practices in scientific computing”, the authors
    write “Good documentation is a key factor in software adoption, but in practice,
    people won’t write comprehensive documentation until they have collaborators who
    will use it. They will, however, quickly see the point of a brief explanatory
    comment at the start of each script, so we have recommended that as a first step.”
    (Wilson et al., 2017)


    # 3.3.1 Literate programming


    Computer scientist Donald Knuth introduced the idea of “literate programming”
    in 1984. In this approach, a natural language explanation takes a central role,
    and the code chunks for each step follow that explanation. The idea is to “code
    your documentation,” instead of “document your code.”


    Knuth wrote “Let us change our traditional attitude to the construction of programs:
    Instead of imagining that our main task is to instruct a computer what to do,
    let us concentrate rather on explaining to human beings what we want a computer
    to do.” (Knuth, 1992, p.99)


    In the context of a data science project, this is enabled in R Markdown (or Jupyter
    notebooks), where text descriptions of the what and why of a code chunk can precede
    that chunk. So rather than existing as a separate “documentation” document, the
    record of the programmer’s thoughts are captured in the file that runs the code.


    These two quotes capture the key concepts of code documentation:


    +   - “Document interfaces and reasons, not implementations.” (Wilson et al.,
    2014)

    +   - “Comments should explain the why, not the what.” (Wickham, 2015, p.68)


    Using plain language in these notes also encourages you to think a second time
    about what you have just coded. Explaining the code to an imagined future reader
    (or your rubber duck) may help you to see a better way to write your code.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# ### 3.3.2 The instruction list


    The instruction list is descriptive text that describes what chunks of code are
    doing.


    In “How to Share Data for Collaboration,” Ellis and Leek (Ellis and Leek, 2017)
    suggest something that is essential is a high-level outline of what the code is
    doing. Here’s a rephrase of their first two steps:


    +   - Step 1: Take the raw data file, run summarize code with parameters $a =
    1, b = 2$

    +   - Step 2: Run the code separately for each sample


    To then apply Knuth’s “Literate Programming” ideas, each step would then be followed
    by the code to carry out that step. The R Markdown format is ideal for this sort
    of work; the text description would be followed by a chunk of R code, followed
    by another text description/R chunk pair, and so on.


    In practice, you may find yourself taking a step-by-step approach:


    +   1. Create an outline of the basic plan,

    +   2. Within that plan add the steps that you will take in your analysis,

    +   3. Add some text detail for each step,

    +   4. Write the code.


    # ### 3.3.3 An example of documented code


    What do these principles look like in practice? This example shows what each step
    might look like.


    We start with the Outline:


    +   - Objective: Find relative sizes of the 10 largest economies in the world.

    +   - Data: The `{gapminder}` package will be used, using the most recent year
    of data (2007).

    +   - Calculation: Per capita GDP * population = total country GDP.

    +   - Table: Create table with top 10 countries.'
