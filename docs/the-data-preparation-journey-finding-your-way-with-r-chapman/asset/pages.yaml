  md: "We will come back to filtering and variable selection along with working with\
    \ date fields later, but here’s the code in R using the functions of the {dplyr}\
    \ package to filter for the British Columbia cases during the month of June 2019:\n\
    \n```\ntravellers_bc <- \ntravellers |> \n  filter(GEO == \"British Columbia\"\
    ,\n         REF_DATE == \"2019-06\")\n\nglimpse(travellers_bc, width = 65)\n```\n\
    \nThere are 287 rows, one for each of the categories in the Country of residence\
    \ variable. It’s important to note that these are not just countries, but the\
    \ variable also includes subtotals. What if we just want a monthly report on a\
    \ single continent? One option would be for us to filter the “COUNTRY” variable;\
    \ here we filter for visitors from Europe.\n\n```\ntravellers_bc |> \n  filter(`Country\
    \ of residence` == \"Europe\")\n```\n\nOne of the features of CANSIM and other\
    \ similar tables is that the individual series are given a single identifier.\
    \ In the case of CANSIM, these are called the “vector numbers”. Scroll to the\
    \ right on this table, and you’ll see a variable called VECTOR. The vector identifier\
    \ (sometimes called “the vector number” even though it’s a character string!)\
    \ for European travellers entering Canada via British Columbia is v1277198032.\n\
    \nThe {cansim} package also gives us a function to select a single vector number,\
    \ so we can be more efficient still. We can speed up the download time and skip\
    \ the filtering steps to get to the one we want. (Note that this function requires\
    \ us to enter a start date, and converts the reference date variable to the YYYY-MM-DD\
    \ format.)\n\n```\nget_cansim_vector(\"v1277198032\", start_time = \"2015-01-01\"\
    )\n```\n\nThis table has the shortcoming of not including the “GEO” or “Country\
    \ of residence” variables, so we need to ensure that we have adequately documented\
    \ what has been accessed.\n\nThe {cansim} package includes other very useful functions\
    \ if you find yourself exploring Statistics Canada data sets."
