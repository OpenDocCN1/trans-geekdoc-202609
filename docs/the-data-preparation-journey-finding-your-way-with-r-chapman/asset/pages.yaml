- pgno: 140
  md: 'Another option is the ons_browse_qmi() function, which opens the relevant ONS
    page in your web browser software.


    ```

    ons_browse_qmi(id = "retail-sales-index")

    ```


    Finally, we will use the relevant id value in an ons_get() function to retrieve
    the data.


    ```

    df_retail_sales <- ons_get(id = "retail-sales-index")

    ```


    There are 42,400 rows in this data (as of 2023-06-14), with multiple variables
    for each month. Your analysis will require further filtering and selecting, but
    with the {onsr} package providing the access to the data, you are well on your
    way.


    # 9.2.2 Statistics Canada


    Statistics Canada, a department of the Government of Canada, provides a socioeconomic
    time series database known as “CANSIM”. The data posted to the database is most
    of the aggregate data collected by Statistics Canada on a regular basis, such
    as the Labour Force Survey (from which we get updates on the unemployment rate),
    the Consumer Price Index Survey (about inflation), and health-related information
    from pregnancy and births to life expectancy and deaths.


    The package {cansim} (von Bergmann and Shkolnik, 2021) uses the API that Statistics
    Canada has created in order to facilitate direct download of hundreds of data
    tables and thousands of individual time series.


    ```

    library(cansim) # access Statistics Canada''s CANSIM data repository

    ```


    One of the many tables related to international travel that is published in CANSIM
    is “Table: 24-10-0050-01 Non-resident visitors entering Canada, by country of
    residence”¹.


    Here’s a screenshot of the table, showing the number of people arriving by their
    continent of residence.


    ¹The webpage for the table, showing the most recently available data, is here:
    https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=2410005001'
