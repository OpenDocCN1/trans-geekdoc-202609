    Metropolitan District\", 4,\n  \"W92\", \"Wales\", 1,\n  \"W06\", \"Unitary Authority\"\
    , 3\n)\n\nuk_region_table\n```\n\n```\n## # A tibble: 11 x 3\n##   area_code_3\
    \ category           geo_level\n##   <chr>       <chr>                  <dbl>\n\
    ## 1 K04         England & Wales           0\n## 2 E92         England       \
    \            1\n## 3 E12         Region                    2\n## 4 E09       \
    \  London Borough            3\n## 5 E10         County                    3\n\
    ## 6 E07         Non-Metropolitan District 4\n## 7 E06         Unitary Authority\
    \         3\n## 8 E11         Metropolitan County       3\n## 9 E08         Metropolitan\
    \ District     4\n## 10 W92        Wales                     1\n## 11 W06    \
    \    Unitary Authority         3\n```\n\nThis table can be saved as a CSV file\
    \ for future reference:\n\n```\nwrite_csv(uk_region_table, \"data_output/uk_region_table.csv\"\
    )\n```\n\nOur next step is to use a mutate() function to extract the unique values\
    \ in the area code variable in the dataframe uk_census_pop, and then use that\
    \ new variable to join the dataframe to the uk_region_table created in the previous\
