  md: '# 9


    # Data from web sources


    In this chapter:


    +   - Importing data from web repositories


    # 9.1 Introduction


    There is a lot of valuable data out there on the internet, just waiting for curious
    data analysts to find nuggets of insight in it. There are a variety of ways to
    access that data; in some cases, you can download a CSV or Excel file and then
    read that into R.


    But the brilliant people that make up the R community have made our life a whole
    lot easier by creating packages that allow us to write R scripts that link directly
    to data we want. This is particularly valuable if you are accessing a data set
    that gets updated regularly (say, a weekly financial report or the results of
    a monthly survey).


    The foundation of this connection to data sources on the internet are APIs (for
    Application Programming Interface). APIs allow two pieces of software to communicate.
    In the context of data access, a site will be set up with an API that defines
    how data can be accessed and how it will be provided.


    In general, an API package will require a connection to the internet. In some
    cases, an API may require a user key be requested (a strategy the site may use
    to authenticate users or limit the number or size of requests).


    There are two sorts of R packages that utilize APIs. The first are those that
    are dedicated to a particular source of data, such as a statistics agency. In
    addition to getting the data, these packages often have additional functions which
    do a lot of the initial manipulation of the data for us, getting it into a format
    that is useful for R.


    The second type are beyond the scope of this book, and are those that allow us
    to connect to the raw data source. Often with these sources, we will need'
  merge: -1
  img_proc: true
- pgno: 139
  md: "to do some wrangling of the data before we can use it. If you are interested\
    \ in learning more about creating your own connections in R to websites that provide\
    \ an API, the R package {httr2}(Wickham, 2023) might be a good place to start.\n\
    \n# 9.2 R packages for direct connection\n\nIn this section, we will explore examples\
    \ that allows access to the data repositories hosted by the UK Office of National\
    \ Statistics and Statistics Canada. There are many other tools available; some\
    \ are listed at the end of this chapter. Neither of these sites requires (at least\
    \ at the time of writing) an API key.\n\n# 9.2.1 Office of National Statistics\
    \ (UK)\n\nOur first example will be {onsr}, which downloads data directly from\
    \ the UK’s Office of National Statistics (Vasilopoulos, 2022).\n\n```\nlibrary(onsr)\n\
    ```\n\nFor this, we would like to obtain time series data of retail sales.\n\n\
    The first thing we might want to do is explore what’s available in our area of\
    \ interest. The ons_datasets() function gives a full list of the data that is\
    \ currently available.\n\n```\ndatasets <- ons_datasets()\n\ndatasets |>\n  select(id,\
    \ description) |>\n  filter(str_detect(id, \"retail\"))\n```\n\nFrom this we will\
    \ select “Retail sales data for Great Britain in value and volume terms, seasonally\
    \ and non-seasonally adjusted”, which has the id value of “retail-sales-index”.\n\
    \nThe function ons_ids() provides a list of the id column that is obtained from\
    \ the ons_datasets function."
