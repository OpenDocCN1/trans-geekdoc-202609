    # 7.1.1 {labelled} -


    Once we have read our SAS, SPSS, or Stata data into R using one of the {haven}
    functions, the package {labelled}(Larmarange, 2022) gives us a range of powerful
    tools for working with the variable labels, value labels, and defined missing
    values.


    ```

    library(labelled)

    ```


    The first function we will use is look_for(), which returns the labels, column
    types, and values of the variables in our data.


    ```

    look_for(penguins_sav)

