    \ == 3,\n            direction = \"left-up\", name = \"field3\") |>\n  behead(direction\
    \ = \"left\", name = \"field4\")\n```\n```\n\nIn the code below, the addition\
    \ is the assignment of column headers. In the UK Census data, the structure is\
    \ not particularly complex, but {tidyr} can also deal with nested hierarchy in\
    \ the headers as well.\n\n```\n```r\n# from the previous chunk:\n\nuk_census_behead\
    \ <- uk_census |>\n  dplyr::filter((row >= 7)) |>\n  filter(col != 1) |>\n  behead_if(indent[local_format_id]\
