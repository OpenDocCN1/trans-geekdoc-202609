  md: 'In our quest for data to analyze, we might come across a circumstance where
    an organization has collected survey data, and the data collectors have published
    the individual records, allowing researchers like you and me to further explore
    the data.


    These data files contain individual records, rather than a data file that has
    been summarized with counts and percentages. A file with the individual records
    is sometimes referred to as a “micro-file”, and one that has been anonymized for
    publication might be described as a Public-Use Micro File (abbreviated as “PUMF”)
    or Public Use Microdata Sample (PUMS)\index{PUMS|see {Public-Use Micro File}}.


    In this chapter, we will look at two circumstances where the data collectors have
    done just that. But rather than releasing the micro-data in a variety of formats,
    they have published a bundle that contains the raw text flat file along with syntax
    (code) files that apply variable names, variable labels, and value labels. This
    is great if we have a license for one of those proprietary software tools⁴, but
    what if we are an R user?


    Fortunately for us, there is a package that has functions to read a raw text file,
    and apply SPSS syntax to create an R object with labelled variables: {memisc}
    (Elff et al., 2021).


    ```

    library(memisc)

    ```


    # 7.3.1 National Travel Survey (NTS)


    Our first example uses information from the National Travel Survey (NTS), collected
    and published by Statistics Canada (Statistics Canada, 2021).


    Step 1 - Download the “SPSS” zip file for the 2020 reference period, and unzip
    it in the project sub-folder “data”. This should create a sub-folder, so that
    the file path is now “data\2020-spss”


    The zip file does not include an SPSS-format data file (.sav). Instead, the folder
    has a fixed-width text file for each of the three survey components (person, trips,
    and visits), and corresponding SPSS syntax files that can be used to read the
    files into the correct variables and to apply the variable and value labels.


    For this example, we will use the 2020 NTS “Person” file. The raw data file provided
    by Statistics Canada is “PERSON_NTS2020_PUMF.txt”.


    Step 2 - Use the SPSS syntax files (in R)


    The bundle also includes separate SPSS syntax files with the “.sps” extension.
    Because Canada is a bilingual country, Statistics Canada releases two versions


    ⁴Or a friend we can bribe with the promise of a chocolate bar.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'of the label syntax files, one in English and the other in French. They can
    be differentiated through the last letter of the file name, before the extension.
    These are:


    +   - variable labels: “Person_NTS2020_Pumf_vare.sps” (The equivalent file with
    French variable labels is “Person_NTS2020_Pumf_varf.sps”.)

    +   - variable values: “Person_NTS2020_Pumf_vale.sps”

    +   - missing values: “Person_NTS2020_Pumf_miss.sps”


    This structure works very well with the {memisc} functions, and these files do
    not require any further manipulation. (As we will see in our second example, this
    is not always the case.)


    Because Statistics Canada has made the data available from other years, we will
    consciously create flexible code that will permit us to rerun our code later with
    a minimum number of changes. Accordingly, we will assign the year of the data
    as an object.


    ```

    nts_year <- "2020"

    ```


    We can now use the object with the year number in a variety of ways, as we define
    the locations of the various input files. Note that this code uses the glue()
    function from the {glue} package to create the file name strings, and the here()
    function from the {here} package to determine the file path relative to our RStudio
    project location.


    ```

    # define locations of input files


    nts_year_format <- glue(nts_year, "-SPSS")


    input_folder <- here("data", nts_year_format)

    input_folder

    ```


    ## [1] "E:/github_book/data_preparation_journey/data/2020-SPSS"


    ```

    layout_folder <- here("data", nts_year_format, "Layout_cards")

    layout_folder

    ```


