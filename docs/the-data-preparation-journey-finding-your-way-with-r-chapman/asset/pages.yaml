    \ more rows\n## # ℹ 2 more variables: gender <chr>, numeric <dbl>\n```\n```\n\n\
    # ## Approach 3 - build a concordance table\n\nIf we need a more flexible and\
    \ re-usable approach, we can consider the option of creating a separate concordance\
    \ table (also known as a crosswalk table). A table of this sort contains the distinct\
    \ values of key variables and their corresponding values in another typology or\
    \ schema. Once a table like this is built, it can be joined to our data, as well\
    \ as to any other table we might need to use in the future.\n\nFor the UK Census\
    \ data, we will create two separate concordance tables. We will save these tables\
    \ as CSV files, so they are readily available for other instances when their use\
    \ will make filtering and summarizing the data more efficient.\n\nFor the first\
    \ table, we will build a table with each type of administrative region and its\
    \ associated three-digit code. This is done programatically in R, using the {tibble}\
    \ package (Müller and Wickham, 2021). We will use the tribble() function, which\
    \ transposes the layout so it resembles the final tabular structure.\n\nIn addition\
    \ to the area code prefix and the name of the administrative region type, the\
    \ level in the hierarchy is also encoded in this table."
