    to our expectations. The {tidylog} package (Elders and Oldoni, 2020)


    The authors of the package acknowledge that the functionality adds some computational
    and time overhead to the processing, but this may be worth the cost. Judiciously
    used, the information it returns can give an immediate indication if the code
    has worked. This is particularly true in the early stages of writing your code—the
    functions can be removed when you are confident you are getting the results you
    expect.


