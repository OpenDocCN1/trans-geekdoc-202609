- pgno: 186
  md: "There are three “supersectors” in the NAICS system: primary industries, goods-producing\
    \ industries, and service-producing industries. The “Series ID” variable string\
    \ starts with “CEU” followed by the digits in positions 4 and 5 representing the\
    \ supersector. The first row, supersector “00”, is the aggregation of the entire\
    \ workforce.\n\nMining, Quarrying, and Oil and Gas Extraction is a sector within\
    \ the goods-producing industries, with the NAICS code number 21. This is represented\
    \ at digits 6 and 7 of the string.\n\nMining (NAICS 212) is a subsector, comprising\
    \ three industries (at the four-digit level).\n\nThe hierarchical structure of\
    \ the dataframe means that if we simply summed the column we would end up double-counting:\
    \ the sum of coal, metal ore, and non-metallic mineral industry rows is reported\
    \ as the employment in Mining (except Oil and Gas).\n\nLet’s imagine our assignment\
    \ is to produce a chart showing the employment in the three subsectors, represented\
    \ at the three-digit level.\n\nFirst, let’s create a table with all the rows associated\
    \ with the sector, NAICS 21.\n\n```\n# create NAICS 21 table\nbls_employment_naics21\
    \ <- bls_employment |>\n  filter(str_detect(`Series ID`, \"CEU1021\"))\n\ngt(\n\
    \  bls_employment_naics21\n)\n```\n\n| Series ID | Annual 2019 | Annual 2020 |\n\
    |---|---|---|\n| CEU1021000001 | 678.1 | 553.0 |\n| CEU1021100001 | 143.6 | 129.8\
    \ |\n| CEU1021200001 | 190.4 | 176.3 |\n| CEU1021210001 | 50.5 | 39.8 |\n| CEU1021220001\
    \ | 42.2 | 41.4 |\n| CEU1021230001 | 97.8 | 95.1 |\n| CEU1021300001 | 344.0 |\
    \ 246.8 |\n\nIn the table above, we see the first row has the “Series ID” of CEU1021000001.\
    \ That long string of zeros shows that this is the sector, NAICS 21. The employment\
    \ total for each year is the aggregation of the subsectors 211, 212, and"
  merge: -1
  img_proc: true
- pgno: 187
  md: "213. As well, this table also shows the industries within 212, starting with\
    \ CEU1021210001 (NAICS 2121).\n\nWhat if we selected only the values that have\
    \ a zero in the ninth spot?\n\n```\ngt(\nbls_employment_naics21 |>\n  # remove\
    \ the ones that have a zero in the 5th spot from the end\n  filter(str_detect(`Series\
    \ ID`, \"00001$\"))\n)\n```\n\n| Series ID | Annual 2019 | Annual 2020 |\n|---|---|---|\n\
    | CEU1021000001 | 678.1 | 553.0 |\n| CEU1021100001 | 143.6 | 129.8 |\n| CEU1021200001\
    \ | 190.4 | 176.3 |\n| CEU1021300001 | 344.0 | 246.8 |\n\nThat’s not quite right—it\
    \ includes the “21” sector aggregate.\n\nLet’s filter out the rows that have a\
    \ zero after the “21” using an exclamation mark at the beginning of our str_detect()\
    \ function.\n\n```\n# NAICS 212\nbls_employment_naics21 |>\n  # use the exclamation\
    \ mark to filter those that don't match\n  filter(!str_detect(`Series ID`, \"\
    CEU0210\"))\n```\n\n```\n## # A tibble: 6 x 3\n##   `Series ID`   `Annual 2019`\
    \ `Annual 2020`\n##   <chr>                 <dbl>         <dbl>\n## 1 CEU1021100001\
    \          144.          130.\n## 2 CEU1021200001          190.          176.\n\
    ## 3 CEU1021210001           50.5          39.8\n## 4 CEU1021220001          \
    \ 42.2          41.4\n## 5 CEU1021230001           97.8          95.1\n## 6 CEU1021300001\
    \          344           247.\n```\n\nThat doesn’t work, because it leaves in\
    \ the four-digit industries, starting with 2121.\n\nThe solution can be found\
    \ by focusing on the characters that differentiate the levels in the hierarchy."
  merge: -1
  img_proc: true
- pgno: 188
  md: "Let’s add the digits 1 to 9 to the front of the second filter (the 8th character\
    \ of the string), and leave the next character (the 9th character) as a zero.\
    \ This should find “CEU1021200001” but omit “CEU1021210001”.\n\n```\n# NAICS 212\n\
    bls_employment_naics21 |>\n  # remove the ones that have a zero in the 5th spot\
    \ from the end\n  # - add any digit from 1-9, leave the following digit as 0\n\
    \  filter(str_detect(`Series ID`, \"[1-9]00001$\"))\n```\n\n```\n## # A tibble:\
    \ 3 x 3\n## `Series ID` `Annual 2019` `Annual 2020`\n## <chr>       <dbl>    \
    \     <dbl>\n## 1 CEU1021100001 144. 130.\n## 2 CEU1021200001 190. 176.\n## 3\
    \ CEU1021300001 344 247.\n```\n\nA second option would be to use a negate zero,\
    \ “[ˆ0]”. You’ll notice that this uses the carat symbol, “ˆ”. Because it is inside\
    \ the square brackets, it has the effect of negating the named values. This is\
    \ different behaviour than when it’s outside the square brackets and means “start\
    \ of the string”.\n\n```\n# NAICS 212\nbls_employment_naics21 |>\n  # remove the\
    \ ones that have a zero in the 6th spot from the end\n  # - add any digit that\
    \ is not a zero\n  filter(str_detect(`Series ID`, \"[^0]00001$\"))\n```\n\n```\n\
    ## # A tibble: 3 x 3\n## `Series ID` `Annual 2019` `Annual 2020`\n## <chr>   \
    \    <dbl>         <dbl>\n## 1 CEU1021100001 144. 130.\n## 2 CEU1021200001 190.\
    \ 176.\n## 3 CEU1021300001 344 247.\n```\n\nAnd here’s one final option, using\
    \ str_sub() to specify the location, inside the str_detect() function.\n\nLet’s\
    \ look at the results of the str_sub() function in isolation before we move on.\
    \ In this code, the function extracts all of the character strings from the 8th\
    \ and 9th positions in the “Series ID” variable, resulting in strings that are\
    \ two characters long."
  merge: -1
  img_proc: true
- pgno: 189
  md: "```\n# extract the character strings in the 8th & 9th position\nstr_sub(bls_employment_naics21$`Series\
    \ ID`, start = 8, end = 9)\n```\n\n## [1] \"00\" \"10\" \"20\" \"21\" \"22\" \"\
    23\" \"30\"\n\nStarting on the inside of the parentheses, we have the str_sub()\
    \ function to create those two-character strings. Next is the str_detect() with\
    \ a regex that identifies those that have a digit other than zero in the first\
    \ position, and a zero in the second. The table is then filtered for those rows\
    \ where that was detected.\n\n```\n# NAICS 212\nbls_employment_naics21_3digit\
    \ <- bls_employment_naics21 |>\n  # filter those that match the regex in the 8th\
    \ & 9th position\n  filter(str_detect(\n    str_sub(`Series ID`, start = 8, end\
    \ = 9),\n  \"[^0][0]\"))\n\nbls_employment_naics21_3digit\n```\n\n## # A tibble:\
    \ 3 x 3\n##   `Series ID`   `Annual 2019` `Annual 2020`\n##   <chr>          \
    \       <dbl>         <dbl>\n## 1 CEU1021100001          144.          130.\n\
    ## 2 CEU1021200001          190.          176.\n## 3 CEU1021300001          344\
    \           247.\n\nThe final step in cleaning this table would be to put it into\
    \ a tidy structure. Currently it violates the second principle of tidy data, that\
    \ each observation forms a row. (Wickham, 2014, p.4) In this case, each year should\
    \ have its own row, rather than a separate column for each.\n\nWe can use the\
    \ {tidyr} (Wickham, 2021b) package's pivot_longer() function for this:\n\n```\n\
    bls_employment_naics21_3digit |>\n  pivot_longer(\n    cols = contains(\"Annual\"\
    ),\n    names_to = \"year\",\n    values_to = \"employment\")\n```"
  merge: -1
  img_proc: true
