- pgno: 32
  md: 'as soon as you incorporate the function into your script. These habits will
    not only capture what you’re thinking at the time, but will also encourage you
    to think about the “why” of your decisions—and perhaps lead you to a different
    choice.


    The idea of reproducibility is a fundamental element of good scientific practice,
    and should be extended to include the analysis of the data. “The standard of reproducibility
    calls for the data and the computer code used to analyze the data be made available
    to others.” (Peng, 2011, p.1226)


    And while it’s important in an academic environment, this necessity for reproducibility
    extends to business and government settings as well. In any situation where the
    data analysis is supporting decisions, it is imperative that the analyst (i.e.
    you) be able to explain their methods, and quickly and effectively respond to
    changes in the data (you might receive an update to the data with more records
    or revisions to the existing records).


    The benefits of a reproducible data science process are summarized here:


    +   - Saves time,

    +   - Produces better science,

    +   - Creates more trusted research,

    +   - Reduces the risk of errors, and

    +   - Encourages collaboration. (Smith, 2017)


    All of the details involved with creating a reproducible workflow are outside
    the scope of this book; here we will concern ourselves with documentation.


    # ### 3.2.1 Elements of effective recordkeeping


    There are three things to capture in your recordkeeping:


    +   1. The why and how of the decisions made.

    +   2. How things work together.

    +   3. How to make changes.'
  merge: -1
