    # 9.3 Other R packages for direct access to data


    The following is an incomplete list (in alphabetical order by name) of other packages
    that have been developed to provide direct access to a specific web resource.


    +   - {bcdata} (Teucher et al., 2023) has tools to search, query, and download
    tabular and ‘geospatial’ data from the British Columbia Data Catalogue.

    +   - {fredr} (Boysel and Vaughan, 2023) connects to the “Federal Reserve Economic
    Data”, or FRED, hosted by the Federal Reserve Bank of St. Louis. This data repository
    has (according to Wikipedia) over 800,000 economic time series from various sources.

    +   - {opendatatoronto} (Gelfand and City of Toronto, 2022) provides a direct
    connection to the City of Toronto Open Data Portal.

    +   - The {readabs} (Cowgill et al., 2023) package downloads and tidies data from
    the Australian Bureau of Statistics.

    +   - {RBNZ} (Watson, 2020) downloads data from the Reserve Bank of New Zealand
    Website.

    +   - {tidycensus} (Walker et al., 2023) has tools that connect to the United
    States Census Bureau and returns tidyverse-ready dataframes with the option of
    adding geographic details to allow for mapping. (See also (Walker, 2023).)'
