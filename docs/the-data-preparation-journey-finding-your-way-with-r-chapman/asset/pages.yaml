- pgno: 206
  md: "```\n## $ species_Adelie  <int> 1, 1, 0, 0, 0, 0\n## $ species_Chinstrap <int>\
    \ 0, 0, 1, 0, 0, 0\n```\n\n# 12.6 Missing values\n\nFrequently, our data will\
    \ have missing values. Some of this will be gaps in the data, and in other cases\
    \ it will be due to the structure of the source data file.\n\nThere are a variety\
    \ of solutions to dealing with gaps in data values (sometimes called “missingness”),\
    \ from listwise deletion (removing all rows with missing values) to complex algorithms\
    \ that apply methods to impute the best estimate of the missing value. There is\
    \ in-depth literature on this topic (see (Little, 2020), (Gelman et al., 2014,\
    \ chapter 18), and (Gelman and Hill, 2007, chapter 25)); what is presented here\
    \ are some solutions to common and relatively simple problems.\n\n# 12.6.1 Missing\
    \ as formatting\n\nA common spreadsheet formatting practice that makes the tables\
    \ human-readable but less analysis-ready is to have a sub-section heading, often\
    \ in a separate column. In the example Excel file that we will use for this, the\
    \ sheet “Report” contains data on tuition fees paid by international students\
    \ in British Columbia, arranged in a wide format. The name of the individual institution\
    \ is in the second column (in Excel nomenclature, “B”), and the region (“Economic\
    \ Development Region”) is in the first column. However, the name of the region\
    \ only appears in the row above the institutions in that region. This makes for\
    \ a nicely formatted table, but isn’t very helpful if we are trying to calculate\
    \ average tuition fees by region⁵.\n\nOur first step is to read in the data. Note\
    \ that the code uses the Excel naming convention to define the rectangular range\
    \ to be read and omits the title rows at the top and the notes at the bottom of\
    \ the sheet.\n\n```\ntuition_data <- \n  readxl::read_excel(dpjr::dpjr_data(\"\
    intl_tuition_fees_bc.xlsx\"),\n                     sheet = \"Report\",\n```\n\
    \n⁵The creators of the file have provided us with a tidy sheet named “Data” and\
    \ deserve kudos for sharing the data in a variety of layouts. But please be aware\
    \ that this approach is the exception, not the rule."
