  md: '# 10


    # Linking to relational databases


    In this chapter:


    +   - Importing data directly from relational databases (SQL)

    +   - Using relational data as part of the data preparation workflow


    # 10.1 Relational data


    Relational databases are commonly used for data storage. Unlike a “flat file”
    which contains all of the variables, the data is stored in multiple tables, which
    are linked via common variables (known as the “keys”). This facilitates efficient
    storage, as information does not need to be duplicated in multiple rows. We have
    seen an example of a relational table earlier, where we built a concordance table
    for the administrative geography of England and Wales in 6.


    In that example, all of the data was loaded into our computer’s memory. In other
    instances, the size of the database, across multiple tables, will be such that
    it exceeds the capacity of your computer. In those cases, a server-based database
    will be established, and as the data analyst, we will need to retrieve only the
    variables and records that we need for our work. A database query can also include
    the calculation of summary statistics, which shifts the computational load to
    the server.


    While SQL is the most commonly used query language, there are R packages that
    allow us to


    +   - Connect to a database,

    +   - Write the code for our queries in R,

    +   - Run the query, and

    +   - Do our work in an R environment.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Writing your code in an R Markdown or Quarto document also gives you the flexibility
    to write the code in SQL, if that’s your preferred approach.


    This exercise replicates the joins described in the “Relational data” chapter
    of *R for Data Science* by Hadley Wickham & Garrett Grolemund (Wickham and Grolemund,
    2016). Instead of using the R {nycflights13} package (Wickham and RStudio, 2021),
    we will use a SQLite version of the same database.


    In this database, there are five separate tables. The table `flights` in the database
    contains all 336,776 flights that departed from New York City in 2013. The data
    comes from the US Bureau of Transportation Statistics and is documented in ?flights


    The other tables in the database are:


    +   - `airlines` lets you look up the full carrier name from its abbreviated code,

    +   - `airports` gives information about each airport, identified by the `faa`
    airport code,

    +   - `planes` gives information about each plane, identified by its `tailnum`,

    +   - `weather` gives the weather at each NYC airport for each hour.


    The tables are *related* to `flights` by the fact that they have variables in
    common. These are known as the “key” variables.


    This diagram shows the relationships:


    ![](img/b86622d1e9ca82b3cbec45faaffaaf26_145_0.png)


    FIGURE 10.1 nycflights13.


    (From (Wickham and Grolemund, 2016), p.174)'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 10.1.1 Connect to the database


    SQL is a language widely used to manipulate and extract data in relational databases.
    As a consequence, there are many relational databases built in this format. Most
    often, these databases will be housed on a network server, but for smaller databases,
    you might install the file on your computer.


    In R, we can use the package {dbplyr} (Wickham et al., 2023a) to access SQL databases
    and SQL functions. In addition, we need {DBI} (Müller, 2022) and {RSQLite} (Müller
    et al., 2023) to establish the connection to the RSQLite database.


    ```

    library(dbplyr)

    library(DBI)

    library(RSQLite)

    ```


    The code below establishes the connection to the database and assigns the connection
    (not the data table!) to the object con_nycf (for “Connection to New York City
    Flights”). You will note that the {RSQLite} function SQLite() is inside the {DBI}
    function dbConnect(). The {DBI} package supports a wide range of different database
    types, including the widely-used MySQL and Postgres.


    ```

    # establish the connection to the database file

    con_nycf <-  DBI::dbConnect(RSQLite::SQLite(), "data/nycflights13_sql.sqlite")


    # list the tables in the connected database

    dbListTables(con_nycf)

    ```


    ## [1] "airlines"   "airports"   "flights"    "planes"

    ## [5] "sqlite_stat1" "sqlite_stat4" "weather"


    Now that we have a connection to the database, we can establish a connection to
    a particular table, using the {dplyr} function tbl(). Note that the flights object
    is not the table but is the connection to the table.


    ```

    flights <- tbl(con_nycf, "flights")

    ```'
  merge: -1
  img_proc: true
- pgno: 147
  md: "# 10.1.2 Submit queries\n\nWith the object “flights” now established in our\
    \ environment, we can write R code to create a subset of the flights—those that\
    \ went to Seattle. Again, the flights_SEA object is not a dataframe, but a set\
    \ of instructions that creates the connection and the query.\n\n```\nflights_SEA\
    \ <- flights |>\n  filter(dest == \"SEA\")\n```\n\nWe can also use the show_query()\
    \ function of {dbplyr} to generate the SQL translation of the R code:\n\n```\n\
    flights_SEA <- flights |>\n  filter(dest == \"SEA\") |>\n  show_query()\n```\n\
    \n```\n## <SQL>\n## SELECT `flights`.*\n## FROM `flights`\n## WHERE (`dest` =\
    \ 'SEA')\n```\n\nIn SQL, we use SELECT to select the columns (or variables) we\
    \ want (you will note this is the same term as {dplyr}). The asterisk “*” is a\
    \ wildcard to select all the tables.\n\nFROM indicates which table from which\
    \ we want to draw the columns.\n\nAnd finally, the filtering by city uses the\
    \ SQL function WHERE.\n\nIn the code below, we create a summary table of the average\
    \ flight time from New York to Seattle, by airline.\n\n```\nSEA <- flights_SEA\
    \ |>\n  select(\"month\", \"carrier\", \"air_time\") |>\n  group_by(carrier) |>\n\
    \  summarize(\n    n = n(),\n    min_air_time = min(air_time),\n    mean_air_time\
    \ = mean(air_time),\n    max_air_time = max(air_time)) |>\n  # enter the resulting\
    \ table into the R environment\n  collect()\n```"
  merge: -1
  img_proc: true
