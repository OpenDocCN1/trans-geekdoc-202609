  md: '# 11


    # Exploration and validation strategies


    In this chapter:


    +   - Exploratory data analysis to identify problems, including the {skimr} package

    +   - Using structured tests with the {validate} package


    # 11.1 Identifying dirty data


    Earlier in Chapter 2, challenges associated with “dirty data” were introduced.


    **The first challenge:** How do we find the things that are problematic with our
    data?


    **The second challenge:** What can and should we do about them?


    The term “data validation” sometimes applies to verification that is applied when
    the data is collected (for example, in a web-based survey tool), and in other
    contexts it applies to a programmatic approach to ensuring the data meet specified
    conditions. In both cases, we can think of data validation as a form of quality
    control, from quick sanity checks to rigorous programmatic testing. (White et
    al., 2013)


    Validation of data during collection might be through the use of drop-down boxes
    that eliminates spelling mistakes or entry fields that require the entered text
    to match a particular pattern. For example, a Canadian postal code is always in
    the pattern of capital letter (but not all letters), digit from 0 to 9, capital
    letter, space, digit, capital letter, and digit. The first letter of the postal
    codes specify a region; in Newfoundland and Labrador they start with the letter
    “A” while in Yukon they start with “Y”, adding another dimension for possible
    validation. Electronic data collection can also enforce that an element is completed
    before submission.


    These imposed validation rules come with risks and need to be thoughtfully implemented.
    Forcing a person to complete a field might lead to made-up values,'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'which might be worse than a missing field. Imagine forcing someone to report
    their income—they might not be comfortable sharing that information, and in order
    to fulfill the requirements of the field enter a “1” or a preposterously very
    large number, neither of them accurate. In this case, it might be better for the
    form to provide a “Prefer not to answer” field, giving respondents an option that
    does not distort the final result.


    For our work here, we will focus on checking and validating data after it has
    been collected. The analyst can specify parameters prior to it being made available
    for the next steps. These can be expressed as rules or assumptions, and are based
    on knowledge of the subject. (van der Loo and de Jonge, 2018, Chapter 6: Data
    Validation)


    The type of things we might evaluate include:


    +   - A field has to be structured in a certain way; examples include postal codes
    and date fields.

    +   - A value might have a certain range or a limited number of categories.

    +   - Some values, such as age, have to be positive.

    +   - There might be a known relationship between two or more variables.


    We now turn to approaches to evaluate the values in the data.


    # 11.2 Exploratory data analysis


    One way to identify dirty data is through the process of *exploratory data analysis*
    (EDA). (Tukey, 1977) The EDA process is, first and foremost, intended to help
    guide our analysis, but it has the additional benefit of providing clues about
    the ways that our data is dirty.


    EDA consists of two groups of techniques:


    +   - summary statistics

    +   - data visualization


    The things we are looking for at this stage include:


    +   - the variable types'
  merge: -1
  img_proc: true
