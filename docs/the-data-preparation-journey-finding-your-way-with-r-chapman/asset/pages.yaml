    \ quiet this message.\n```\n\n# FIGURE 5.1 read_csv message.\n\nThe function returns\
    \ a message letting us know the type that each variable is assigned.\n\nThe arguments\
    \ of the {readr} package allow a lot of control over how the file is read. Of\
    \ particular utility are the following:\n\n| argument | purpose |\n|---|---|\n\
    | col_types = cols() | define variable types |\n| na = \"\" | specify which values\
    \ you want to be turned into NA |\n| skip = 0 | specify how many rows to skip;\
    \ the default is 0 |\n| n_max = Inf | the maximum number of records to read; the\
    \ default is Inf for infinity, interpreted as the last row of the file |\n\nAdding\
    \ the col_types = cols() parameter has two benefits. First, defining the variable\
    \ type avoids errors (such as numeric fields will be read as such, and not as\
    \ characters) and speeds up the read process since R doesn't have to check and\
    \ infer the variable type.\n\nSecond, it allows us to alter what {readr} has decided\
    \ for us. For example, we could set the species variable to be a factor type variable.\n\
    \nWhen we show the entire table, we can see that the variable species is now a\
    \ factor type.\n\n```\npenguins_data <- read_csv(penguins_path,\n    col_types\
    \ =\n      cols(species = col_factor()))\npenguins_data\n```"
