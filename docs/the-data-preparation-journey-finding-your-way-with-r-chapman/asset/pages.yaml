- pgno: 191
  md: "# noc_occupation_title\n\nThis variable combines two values: the three-digit\
    \ NOC code and the title of the occupation.\n\nWe will use the {tidyr} function\
    \ `separate_wider_delim()` to split it into two variables. The function gives\
    \ us the arguments to name the new columns that result from the separation and\
    \ the character string that will be used to identify the separation point, in\
    \ this case “:”. **Don’t forget the space!**\n\nThis function also has an argument\
    \ `cols_remove =`. The default is set to TRUE, which removes the original column.\
    \ Set to FALSE if it retains the original column; we won’t use that here but it\
    \ can be useful.\n\nThere are also `separate_wider_*()` functions based on fixed-width\
    \ positions and regular expressions.\n\n```\nnoc_table_clean <- noc_table |>\n\
    \  tidyr::separate_wider_delim(\n    cols = noc_occupation_title,\n    delim =\
    \ \": \",\n    names = c(\"noc\", \"occupation_title\")\n  )\n\ngt(head(noc_table_clean))\n\
    ```\n\n| noc | occupation_title | certification_training_requirements | employment\
    \ |\n|---:|---|---|---:|\n| 063 | Accommodation service managers | A university\
    \ degree or college diploma in hotel management or other related discipline or\
    \ equivalent job experience | 6,479 |\n| 652 | Occupations in travel and accommodation\
    \ | Related post-secondary diploma; On the job training | 5,771 |\n| 673 | Cleaners\
