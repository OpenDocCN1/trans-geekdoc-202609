    # 7.1.2.2 Handling missing values


    Very often, SPSS files will have “user defined missing values.” In the video survey
    file, they have been coded as “NA”. But often, the analysis of survey results
    will have multiple types of “missing values”:


    +   - respondent left the question blank


    ³The reference page for {janitor} is here: http://sfirke.github.io/janitor/'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   - respondent didn’t answer the question because of skip logic (in other
    words, the respondent didn’t see the question)

    +   - the analyst may have decided to code “Don’t know” or “Not applicable” as
    “missing” when calculating the percentages of responses in the other categories.


    Depending on the circumstance, you may want to count some of these. For example,
    if there a lot of “Don’t know” and “Not applicable” responses, you may wish to
    analyze which one it is (they mean very different things!) If they are all coded
    as “NA”, you have lost the ability to gain that insight.


    In the code below, adding the user_na = TRUE argument to the read_spss() function
    maintains the original values.


    ```

    df_video <- read_spss(dpjr::dpjr_data("Video_SPSS.sav"), user_na = TRUE)


    df_video <- janitor::clean_names(df_video)


    df_video

    ```


