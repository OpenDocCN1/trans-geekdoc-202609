  md: '# 12


    # Cleaning techniques


    In this chapter:


    +   - Cleaning dates and strings

    +   - Creating conditional and calculated variables

    +     - indicator variables (also known as dummy variables (Suits, 1957) and “one
    hot” encoding)

    +   - Dealing with missing values


    # 12.1 Introduction


    We have already applied some cleaning methods. In the chapters on importing data,
    we tackled a variety of techniques that would fall into “data cleaning,” including
    assigning variable types and restructuring data into a tidy format. In this chapter,
    we look in more depth at some examples of recurring data cleaning challenges.


    # 12.2 Cleaning dates


    A recurring challenge in many data analysis projects is to deal with date and
    time fields. One of the first steps of any data cleaning project should be to
    ensure that these are in a consistent format that can be easily manipulated.


    As we saw in (Broman and Woo, 2017), there is an international standard (ISO 8601)
    for an unambiguous and principled way to write dates and times (and in combination,
    date-times). For dates, we write YYYY-MM-DD. Similarly,'
  merge: -1
  img_proc: true
- pgno: 173
  md: "time is written T[hh][mm][ss] or T[hh]:[mm]:[ss], with hours (on a 24-hour\
    \ clock) followed by minutes and seconds.\n\nWhen we are working with dates, the\
    \ objective of our cleaning is to transform the date into the ISO 8601 standard\
    \ and then, where appropriate, transform that structure into a date type variable.\
    \ The benefits of the date type format are many, not the least of which are the\
    \ R tools built to streamline analysis and visualization that use date type variables,\
    \ (Wickham et al., 2023b, Chapter 18) and those same tools allow us to tackle\
    \ cleaning variables that capture date elements.\n\nOne such package is {lubridate},\
    \ part of the tidyverse.\n\n# 12.2.1 Creating a date-time field\n\nThe first way\
    \ that dates might be represented in your data is as three separate fields, one\
    \ for year, one for month, and one for day. These can be assembled into a single\
    \ date variable using the make_date(), or a single datetime variable using make_datetime().\n\
    \nIn the {Lahman}(Friendly et al., 2020) table “People”, each player’s birth date\
    \ is stored as three separate variables. They can be combined into a single variable\
    \ using make_date():\n\n```\nLahman::People |>\n  slice_head(n = 10) |>\n  select(playerID,\
    \ birthYear, birthMonth, birthMonth, birthDay) |>\n  # create date-time variable\n\
    \  mutate(birthDate = make_datetime(birthYear, birthMonth, birthDay))\n```\n\n\
    | ## | playerID | birthYear | birthMonth | birthDay | birthDate |\n|---|---|---|---|---|---|\n\
    | ## 1 | aardsda01 | 1981 | 12 | 27 | 1981-12-27 |\n| ## 2 | aaronha01 | 1934\
    \ | 2 | 5 | 1934-02-05 |\n| ## 3 | aronto01 | 1939 | 8 | 5 | 1939-08-05 |\n| ##\
    \ 4 | aasedo01 | 1954 | 9 | 8 | 1954-09-08 |\n| ## 5 | abadan01 | 1972 | 8 | 25\
    \ | 1972-08-25 |\n| ## 6 | abadfe01 | 1985 | 12 | 17 | 1985-12-17 |\n| ## 7 |\
