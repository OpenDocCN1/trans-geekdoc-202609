    # 2.2.1 Tidy data


    When we are cleaning our data, we should also consider the structure. The goal
    should be a tidy structure, one that meets the following three principles or rules:


    +   - Each variable must have its own column.

    +   - Each observation must have its own row.

    +   - Each value must have its own cell. (Wickham, 2014)


    In many instances, achieving a tidy structure may require reshaping the data,
    using the {tidyr}(Wickham, 2021b) packages’s pivot_() functions. In others, the
    data may have multiple variables in each cell which need to be split (such as
    addresses) into a separate column for each variable.


