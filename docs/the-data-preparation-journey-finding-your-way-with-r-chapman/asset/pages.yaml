  md: "But it would be much more helpful and efficient if we attach the value labels\
    \ to the dataframe.\n\nOne strategy is to create a new factor variable, that uses\
    \ the value description instead of the numeric representation. For this, we will\
    \ use the fct_recode() function from the {forcats} package(Wickham, 2021a).\n\n\
    ```\nlibrary(forcats)\n\njcush_forcats <- jcush |>\n  # 1st mutate a new factor\
    \ variable with the original values\n  mutate(health_desc_fct = as.factor(GHJ1DHDI))\
    \ |>\n# 2nd recode the values\nmutate(\n  health_desc_fct = fct_recode(\n    health_desc_fct,\n\
    \    \"Poor\" = \"0\",\n    \"Fair\" = \"1\",\n    \"Good\" = \"2\",\n    \"Very\
    \ Good\" = \"3\",\n    \"Excellent\" = \"4\",\n    NULL = \"9\"\n  )\n)\n```\n\
    \nThe levels() function allows us to inspect the labels. Note that because we\
    \ specified the original value of “9” as NULL, it does not appear in the list.\n\
    \n```\nlevels(jcush_forcats$health_desc_fct)\n```\n\n## [1] \"Poor\"    \"Fair\"\
    \    \"Good\"    \"Very Good\" \"Excellent\"\n\nWhen we tally the results by our\
    \ new variable, the GHJ1DHDI records with the value 9 are shown as “NA”."
