    # 11.3  Validation methods


    While exploratory data analysis uses visualization and scans of data summaries
    to spot potentially dirty data, validation is a structured process of testing.


    # 11.3.1  The {validate} package


    As with other data analysis topics, people in the R user community have confronted
    the problem of dirty data and have written and shared functions to help the rest
    of us. The {validate} package (van der Loo and de Jonge, 2021, van der Loo et
    al. (2022)) was written and is supported by methodologists at'
  merge: -1
