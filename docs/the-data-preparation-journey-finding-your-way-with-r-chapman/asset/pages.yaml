- pgno: 163
  md: 'Statistics Netherlands, and provides tools for us to write structured validation
    tests.


    The first function we will investigate in the package is check_that(), using the
    data in {palmerpenguins} (Horst et al., 2022; Horst, 2020). We know that the data
    in the package are nice and clean—they have already gone through a validation
    process.


    ```

    library(tidyverse)


    library(palmerpenguins)

    library(validate)

    ```


    # Range of values:


    We know, being experts on all things penguin, that gentoo penguins (Pygoscelis
    papua) are the third largest of the penguin species and can weigh up to 8.5 kg.
    So we might want to see if we have any records with penguins with a body mass
    of more than 8500 grams. The check_that() function inverts this question; we are
    ensuring that all of the records have penguin body mass values that are less than
    or equal to 8500 grams. If the value is below that value, it returns a “pass”.


    ```

    check_penguins <- check_that(penguins, body_mass_g <= 8500)


    summary(check_penguins)

    ```


    The summary() function on the object that the check_that() function creates shows
    that all of the penguins have a body mass of less than or equal to 8500 grams,
    and there are 2 “NA” values in the data.


    # Relationship:


    While the heaviest gentoo penguins can be up to 8.5 kg, it is very unusual to
    find an Adélie or chinstrap penguin that weighs more than 5 kg. What happens if
    we change the body mass threshold to 5000 grams?


    ```

    check_penguins <- check_that(penguins, body_mass_g <= 5000)


    summary(check_penguins)

    ```'
