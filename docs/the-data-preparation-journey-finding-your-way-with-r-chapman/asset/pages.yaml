    ```\n\nIn many uses of this data, we will want to remove the subtotal rows. In\
    \ the code below, a case_when() function is applied to create a new variable that\
    \ contains a value “subtotal” for the rows that are disaggregated at the next\
    \ level (for example, the cities within a Metro county, or the counties within\
    \ a region).\n\nThe first step is to create a new dataframe field3_split that\
    \ identifies all of the areas at the county level that have a disaggregation.\
    \ This is done by first filtering by field4, where there is a valid value (identified\
    \ as not an “NA”), and creating a list of the distinct values in field3. That\
    \ list is then used as part of the evaluation within the case_when() to assign\
    \ the value “subtotal” to the new variable subtotal_row.\n\n```\nfield3_split\
    \ <- uk_census_behead_revised |>\n  filter(!is.na(field4)) |>\n  distinct(field3)\n\
    \nfield3_split\n```\n\n```\n## # A tibble: 33 x 1\n##  field3\n##  <chr>\n## 1\
    \ Tyne and Wear (Met County)\n## 2 Cumbria\n## 3 Greater Manchester (Met County)\n\
    ## 4 Lancashire\n## 5 Merseyside (Met County)\n## 6 North Yorkshire\n## 7 South\
    \ Yorkshire (Met County)\n## 8 West Yorkshire (Met County)\n## 9 Derbyshire\n\
    ## 10 Leicestershire\n## # i 23 more rows\n```"
