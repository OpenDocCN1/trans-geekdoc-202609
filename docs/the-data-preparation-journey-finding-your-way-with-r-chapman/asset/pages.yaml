    to 2012 or 1912?), and ambiguous ordering of months and days (does “12” refer
    to the twelfth day of the month or December?)


    If we know the way the data is stored, we can use {lubridate} functions to process
    the data into YYYY-MM-DD. These three very different date formats can be transformed
    into a consistent format:


    ```

    ymd("1973-10-22")

