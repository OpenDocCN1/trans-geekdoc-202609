    # ## VI. CONCLUSIONS


    This article introduces a smart security system based on HTML gateway from the
    perspective of UDP protocol and system design, defines the main functions of HTMLNET
    gateway, and operates the UDP framework and verification methods according to
    the characteristics of the video stream. In this work, we complete the drawing
    and design of the smart security system based on fingerprint recognition, password
    control, remote control, interface, HTML5-multi-device, touch buttons, and etc.
    After the implementation, the system is running and can fulfill the expected requirements.


