    For the sender, we put the all-zero into the checksum field and add a dummy header.
    A UDP datagram can be viewed as a collection of 16-bit segments. If the part of
    the datagram is not an even number of bytes, an all-zero byte at the end is added
    (not sent). Then we calculate the sum of 16-bit words according to binary complement
    and write the binary complement of this into the checksum field.


    For the receiver, the received datagram is added with the padding (if it is not
    an even number of bytes, all zero bytes are made) and the sum of these 16-bit
    words is calculated according to the binary complement. If there is no error,
    or otherwise, there is an error, and the receiver should discard the UDP datagram.


    # B. UDP Communication Framework


    Based on the architecture, the software of the client mobile monitors the monitoring
    of sensor data and can perform real-time scheduling of related event. The received
    data of the main controller manages the WiFi module through a serial port, and
    the WiFi module sends the data to the server in JSON format which delivers them
    to the client server. The cloud server of OneNet platform can share data with
    terminals devices in real-time. Fig. 5 is a schematic diagram of system communication.


