    # ## B. HTML-NET module


    The HTML-NET device is developed on the Linux Operating System with the M76AN
    gateway provided by MediaTek. It uses an STC14WK3254 enhanced C51 single-chip
    bare with 4 UART (Asynchronous Universal Transmitter/Receiver) ports connected
    inside the module. The module includes a wealth of interfaces: wireless antenna
    interface, Ethernet network interface, USB2.0 interface, UART0, UART serial ports.


    In addition TCP/IP communication and serial port transparent transmission, HTML-NET
    also has web page design, which can be used for cross-platform UI user interface
    design and configuration. The HTML web pages communicate with the UART1 serial
    port to bridge the Websocket protocol and control the STC15WK3254 microcontroller.
    HTML web pages are saved in the module system/html web directory.


    The HTML-NET module has a built-in UDP (User Datagram Protocol) server and uses
    a unique mechanism to re-encapsulate UDP communication and shared ID address.
    IP of the UDP client is obtained specially. For the client connected to WiFi network,
    the IP address will change often due to the occasion of mobile phones.


    The HTML-NET interface mainly includes HTML-NET module, Ethernet network interface,
    USB interface, 3.3V voltage regulator circuit, IO expansion circuit, and indicator
    circuit. The HTML-NET module uses a DC (Direct Current) step-down converter MP2359
    for the HTML-NET module separately due to the high current required. MP2359 is
    a converter with built-in DC/DC by CMOS process switch, and the maximum output
    is 1.2A, which can be satisfied by the HTML-NET module.


    # III. UDP PROTOCOL COMMUNICATION


    UDP is a transport protocol that provides multiplexing, demultiplexing, and error
    detection services on top of IP


    datagram [5-6]. Looking at the characteristics of data streaming in UDP, UDP has
    the following advantages:


    +   - UDP does not have the time delay to establish a connection. TCP needs to
    maintain the connection in the end system, which loads a certain amount of overhead,
    including receiving and sending buffers, congestion control, sequence numbering,
    and connection maintenance. UDP has low overhead and has saves space and time.

    - UDP has no congestion control. The application layer can better control the
    data to be sent and the sending. Congestion in the network will not affect the
    speed of the transmission. Some applications require transmission at a stable
    speed, which can tolerate some data loss, but cannot afford large loss (such as
    real-time video, broadcast, etc.).

    - UDP provides best-effort delivery, but no guarantee reliability. All the reliability
    requires users to complete the application layer. It has no checksum mechanism
    or retransmission mechanism. If it is not transmitted the endpoint gets nothing.
    UDP will not return an error to the application layer. UDP is also used in multimedia
    applications (such as IP telephony, real-time video streaming, media, etc.).


    # A. UDP Verification Method


    When calculating a checksum, a 12-byte pseudo header needs to be added before
    the UDP datagram. The pseudo header is not the real header of UDP. In contrast,
    it is added when calculating the checksum of UDP datagram. It is calculated according
    to this content UDP datagram. The pseudo header is neither sent nor, but only
    for calculating the checksum. In this check, the checksum only checks the UDP
    datagram, but also checks the source and destination IP address.'
