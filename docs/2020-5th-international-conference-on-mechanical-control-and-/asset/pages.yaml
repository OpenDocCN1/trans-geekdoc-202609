    **Abstract—**Smart security refers to the information technology of security services.
    With the rapid development of information technology in the 21st century, the
    boundary between intelligent security and computer is greatly disappearing. We
    design a security system using HTML5 (Hyper Text Markup Language 5 gateway) and
    UDP (User Data Protocol), with fingerprint recognition, password control, remote
    control, user interface, HTML5 multipaging device and notifications. We complete
    the design and drawing of the PCB (Printed Circuit Board), release the software
    and hardware design and construction, and complete the overall security system
    design.


    **Keywords—**Smart Security; HTML5; UDP


    # I. INTRODUCTION


    With the development of automatic control and communication technology, products
    that are closely integrated with the Internet of Things have advanced rapidly.
    Such as user interface, smart interaction, web camera, remote control, etc. This
    article designs a security system based on HTML5 (Hyper Text Markup Language 5)
    gateway, with the following functions:


    +   (1) Using HTML5 to realize real-time video capture of local area network monitoring
    and multi-platform login.


    +   (2) Using control, the system can remotely view the current visitor situation
    and temperature and humidity, and can control the switch of the access control
    through the web page;


    +   (3) Drawing an independent PCB (Printed Circuit Board), which improves the
    stability and anti-interference ability of the work.


    +   (4) Using voice prompt to interact with users through user experience;


    +   (5) Using the fingerprint recognition method to control the access control
    system, convenient and fast;


    +   (6) Using the touch screen, users can make more intuitively touch the work.


    The system can be divided into nine modules: main control module, HTML5-node,
    voice module, sound module, fingerprint module, touch display,


