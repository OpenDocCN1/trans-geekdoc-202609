    # 基于HTML5网关的智能安防系统设计


    杜文文¹，王鹏¹，卓正林¹，赵亚南¹，天磊¹

    *山东科学技术大学信息与通信学院

    中国山东省青岛市，266590

    *通讯作者邮箱：wengpeng045@foxmail.com


    **摘要—** 智能安防是指安全服务的信息技术。随着21世纪信息技术的飞速发展，智能安防与计算机之间的界限正逐渐消失。我们使用HTML5（超文本标记语言5代网关）和UDP（用户数据报协议）设计了一种安全系统，具有指纹识别、密码控制、远程控制、用户界面、HTML5多页设备和通知等功能。我们完成了PCB（打印电路板）的设计与绘制，发布了软硬件设计与制作，并完成了整个安全系统的设计。


    **关键词—** 智能安防；HTML5；UDP


    # I. 引言


    随着自动控制和通信技术的发展，与物联网密切结合的产品发展迅速。例如用户界面、智能交互、网络摄像头、远程控制等。本文设计了一种基于HTML5（超文本标记语言5）网关的安全系统，具有以下功能：


    - (1) 使用HTML5实现局域网监控的实时视频采集和多平台登录。

    - (2) 通过控制，系统可以远程查看访客情况及温湿度，并通过网页控制门禁开关的切换；

    - (3) 绘制独立的PCB（打印电路板），提高了工作的稳定性和抗干扰能力。

    - (4) 使用语音提示通过用户体验与用户交互；

    - (5) 使用指纹识别方法控制门禁系统，方便快捷；

    - (6) 使用触摸屏，用户可以更直观地触摸操作。


    该系统可分为九个模块：主控模块、HTML5节点、语音模块、音频模块、指纹模块、触摸显示、摄像头模块、WiFi通信模块和IoT平台[3]。图1显示了程序的整体结构。


    本工作结合HTML5与技术构建了语音交互智能安防系统；使用HTML5和本地网关制作网页；使用HTML-节点和网关连接到网络；使用STM32F103RTC6芯片作为底层MCU（微控制器）与语音、触摸屏和移动传感器进行通信；使用WiFi模块进行数据协议传输。


    # A. 无线通信方法


    无线通信技术可能ZigBee、RFID（无线射频识别）、蓝牙等技术。WiFi用于连接设备。WiFi是一种稳定的无线通信技术；蓝牙；RFID是无线射频识别[4]。电子设备可以通过网络实现远距离数据交换。表1从六方面对这四种短距离无线技术进行了水平比较。


    根据表1，与其他类型的无线通信方法相比，该方法符合本项目的需求。首先，WiFi通信技术容易与其他设备兼容。其次处理了所有设备与其他设备的互连。可以看出，选择WiFi作为无线通信方法可以轻松完成设备与互联网之间的交互，一步到位，避免二次通信。


    ![](img/8c171282c1cc602062ed1901608ef3ac_0_0.png)


    图1 方案的整体结构


    # 表 I 四种短距离无线通信技术的水平比较


    | 特性 | WiFi | ZigBee | RFID | 蓝牙 |

    |---|---|---|---|---|

    | 单点覆盖范围 | 50m | 50-30m | 1m | 15m |

    | 传输速率 | 50Mbps | 250Kbps | - | 1Mbps |

    | 频段 | 2.4GHz | 2.4GHz | 868MHz或915MHz | 2.4GHz |

    | 安全性 | 中 | 中 | 低 | 高 |

    | 标准 | IEEE802.11 | IEEE802.15.4 | 未使用 | 未使用 |

    | 功耗 | 500mW | 15mA | 5mA | 10mA |


    ## B. HTML-NET 模块


    HTML-NET设备在Linux操作系统上，基于MediaTek提供的M76AN网关开发。它使用增强型STC14WK3254 C51单片机，内部连接了4个UART（异步通用传输收发器）端口。模块包含了丰富的接口：无线天线接口、以太网接口、USB2.0接口、UART0、UART串口。


    此外，由于TCP/IP通信和串口透明传输，HTML-NET还具有网页设计，可用于跨平台UI用户界面设计和配置。HTML网页与UART1串口通信，以桥接Websocket协议并控制STC15WK3254微控制器。HTML网页保存在模块系统的/html
    web目录下。


    HTML-NET模块内置了UDP（用户数据报协议）服务器，并使用唯一机制重新封装UDP通信并共享ID地址。专门获取UDP客户端的IP。对于连接WiFi网络的客户端，由于手机的情况，IP地址会频繁变化。


    HTML-NET接口主要包括HTML-NET模块、以太网接口、USB接口、3.3V稳压电路、IO电路和指示灯。HTML-NET模块内置UDP服务器，并使用一种独特机制重新封装UDP通信并共享ID地址。


    # III. UDP 协议


    UDP是一种不可靠的传输协议，具有以下特点：


    - 不建立连接。

    - 不保证交付。

    - 不保证顺序。

    - 不支持流量控制。

    - 不支持拥塞控制。

    - 头部开销小。


    UDP 协议：


    首先，WiFi通信技术容易与其他设备兼容。其次处理了所有设备与其他设备的互连。可以看出，选择WiFi作为无线通信方法可以轻松完成设备与互联网之间的交互，一步到位，避免二次通信。


    ## B. HTML-NET 模块


    HTML-NET设备在Linux操作系统上，基于MediaTek提供的M76AN网关开发。它使用增强型STC14WK3254 C51单片机，内部连接了4个UART（异步通用传输收发器）端口。模块包含了丰富的接口：无线天线接口、以太网接口、USB2.0接口、UART0、UART串口。


    此外，由于TCP/IP通信和串口透明传输，HTML-NET还具有网页设计，可用于跨平台UI用户界面设计和配置。HTML网页与UART1串口通信，以桥接Websocket协议并控制STC15WK3254微控制器。HTML网页保存在模块系统的/html
    web目录下。


    HTML-NET模块内置了UDP（用户数据报协议）服务器，并使用一种独特机制重新封装UDP通信并共享ID地址。专门获取UDP客户端的IP。对于连接WiFi网络的客户端，由于手机的情况，IP地址会频繁变化。


    HTML-NET接口主要包括HTML-NET模块、以太网接口、USB接口、3.3V稳压电路、IO电路和指示灯。HTML-NET模块内置UDP服务器，并使用一种独特机制重新封装UDP通信并共享ID地址。


    # III. UDP 协议


    UDP是一种不可靠的传输协议，具有以下特点：


    - 不建立连接。

    - 不保证交付。

    - 不保证顺序。

    - 不支持流量控制。

    - 不支持拥塞控制。

    - 头部开销小。


    UDP 协议：


    首先，WiFi通信技术容易与其他设备兼容。其次处理了所有设备与其他设备的互连。可以看出，选择WiFi作为无线通信方法可以轻松完成设备与互联网之间的交互，一步到位，避免二次通信。


