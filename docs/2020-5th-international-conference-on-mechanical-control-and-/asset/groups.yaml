    # Design of Smart Security System Based on Hyper Text Markup Language 5 Gateway


    Wenwen Dou¹, Peng Wang¹, Zhenglin Cul¹, Yanan Zhao¹, Wenlei Tian¹

    *College of Information and Communication, Shandong University of Science and
    Technology

    Qingdao, Shandong, 266590, China

    *Corresponding author''s e-mail: wengpeng045@foxmail.com


    **Abstract—**Smart security refers to the information technology of security services.
    With the rapid development of information technology in the 21st century, the
    boundary between intelligent security and computer is greatly disappearing. We
    design a security system using HTML5 (Hyper Text Markup Language 5 gateway) and
    UDP (User Data Protocol), with fingerprint recognition, password control, remote
    control, user interface, HTML5 multipaging device and notifications. We complete
    the design and drawing of the PCB (Printed Circuit Board), release the software
    and hardware design and construction, and complete the overall security system
    design.


    **Keywords—**Smart Security; HTML5; UDP


    # I. INTRODUCTION


    With the development of automatic control and communication technology, products
    that are closely integrated with the Internet of Things have advanced rapidly.
    Such as user interface, smart interaction, web camera, remote control, etc. This
    article designs a security system based on HTML5 (Hyper Text Markup Language 5)
    gateway, with the following functions:


    +   (1) Using HTML5 to realize real-time video capture of local area network monitoring
    and multi-platform login.


    +   (2) Using control, the system can remotely view the current visitor situation
    and temperature and humidity, and can control the switch of the access control
    through the web page;


    +   (3) Drawing an independent PCB (Printed Circuit Board), which improves the
    stability and anti-interference ability of the work.


    +   (4) Using voice prompt to interact with users through user experience;


    +   (5) Using the fingerprint recognition method to control the access control
    system, convenient and fast;


    +   (6) Using the touch screen, users can make more intuitively touch the work.


    The system can be divided into nine modules: main control module, HTML5-node,
    voice module, sound module, fingerprint module, touch display,


    # II. SYSTEM MODULE


    camera module. WiFi communication module, and IoT platform [3]. Figure1 shows
    the overall structure of the program.


    This work combines HTML5 with technology to build a voice interact smart security
    system; using HTML5 and local gateway to web pages; using HTML-node and gateway
    to connect to web; STM32F103RTC6 chip as a lower-level MCU (Micro Control Unit)
    to communicate with voice sounds, touch display screens, and mobile sensors; using
    WiFi modules for data protocol.


    # A. Wireless Communication Method


    Wireless communication technologies may include ZigBee, RFID (radio frequency
    identification), Bluetooth, and other technologies. WiFi is used to connect connect
    devices. WiFi is a stable wireless communication technology; Bluetooth; RFID is
    a radio frequency identification; Bluetooth [4]. Electronic devices can realize
    real-distance data exchange through the network. Table 1 makes a horizontal comparison
    of these four-short wireless technologies from six.


    According to Table 1, it is in line with the needs of this project compared to
    the other types of wireless communication methods. First of all, the WiFi communication
    technology is easy to be compatible with other devices. Secondly handles the interconnection
    of all and other devices. It can be seen that choosing WiFi as a wireless communication
    method can easily complete the interaction between the device and the Internet,
    achieve one step, and avoid secondary communication.


    ![](img/8c171282c1cc602062ed1901608ef3ac_0_0.png)


    Figure1. The overall structure of the scheme'
  - '[PAGE 1]


    # TABLE I. HORIZONTAL COMPARISON OF FOUR-RANGE WIRELESS COMMUNICATION TECHNOLOGIES


    | Species | WiFi | ZigBee | RFID | Bluetooth |

    |---|---|---|---|--|

    | Single point coverage | 50m | 50-30m | 1m | 15m |

    | Transmission rate | 50Mbps | 250Kbps | - | 1Mbps |

    | Frequency band | 2.4GHz | 2.4GHz | 868MHz or 915MHz | 2.4GHz |

    | Safety | Medium | Medium | Low | High |

    | Standard | IEEE802.11 | IEEE802.15.4 | Not used | Not used |

    | Power consumption | 500mW | 15mA | 5mA | 10mA |


    # ## B. HTML-NET module


    The HTML-NET device is developed on the Linux Operating System with the M76AN
    gateway provided by MediaTek. It uses an STC14WK3254 enhanced C51 single-chip
    bare with 4 UART (Asynchronous Universal Transmitter/Receiver) ports connected
    inside the module. The module includes a wealth of interfaces: wireless antenna
    interface, Ethernet network interface, USB2.0 interface, UART0, UART serial ports.


    In addition TCP/IP communication and serial port transparent transmission, HTML-NET
    also has web page design, which can be used for cross-platform UI user interface
    design and configuration. The HTML web pages communicate with the UART1 serial
    port to bridge the Websocket protocol and control the STC15WK3254 microcontroller.
    HTML web pages are saved in the module system/html web directory.


    The HTML-NET module has a built-in UDP (User Datagram Protocol) server and uses
    a unique mechanism to re-encapsulate UDP communication and shared ID address.
    IP of the UDP client is obtained specially. For the client connected to WiFi network,
    the IP address will change often due to the occasion of mobile phones.


    The HTML-NET interface mainly includes HTML-NET module, Ethernet network interface,
    USB interface, 3.3V voltage regulator circuit, IO expansion circuit, and indicator
    circuit. The HTML-NET module uses a DC (Direct Current) step-down converter MP2359
    for the HTML-NET module separately due to the high current required. MP2359 is
    a converter with built-in DC/DC by CMOS process switch, and the maximum output
    is 1.2A, which can be satisfied by the HTML-NET module.


    # III. UDP PROTOCOL COMMUNICATION


    UDP is a transport protocol that provides multiplexing, demultiplexing, and error
    detection services on top of IP


    datagram [5-6]. Looking at the characteristics of data streaming in UDP, UDP has
    the following advantages:


    +   - UDP does not have the time delay to establish a connection. TCP needs to
    maintain the connection in the end system, which loads a certain amount of overhead,
    including receiving and sending buffers, congestion control, sequence numbering,
    and connection maintenance. UDP has low overhead and has saves space and time.

    - UDP has no congestion control. The application layer can better control the
    data to be sent and the sending. Congestion in the network will not affect the
    speed of the transmission. Some applications require transmission at a stable
    speed, which can tolerate some data loss, but cannot afford large loss (such as
    real-time video, broadcast, etc.).

    - UDP provides best-effort delivery, but no guarantee reliability. All the reliability
    requires users to complete the application layer. It has no checksum mechanism
    or retransmission mechanism. If it is not transmitted the endpoint gets nothing.
    UDP will not return an error to the application layer. UDP is also used in multimedia
    applications (such as IP telephony, real-time video streaming, media, etc.).


    # A. UDP Verification Method


    When calculating a checksum, a 12-byte pseudo header needs to be added before
    the UDP datagram. The pseudo header is not the real header of UDP. In contrast,
    it is added when calculating the checksum of UDP datagram. It is calculated according
    to this content UDP datagram. The pseudo header is neither sent nor, but only
    for calculating the checksum. In this check, the checksum only checks the UDP
    datagram, but also checks the source and destination IP address.'
