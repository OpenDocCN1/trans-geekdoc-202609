    use submissive facial expressions or body language. All of these traits signal
    that you lack self-confidence and could make you look apologetic. Just stand or
    sit still, face the person and look them in the eye while they’re talking.


    Keep the person and the problem separate. No matter how much their behaviour frustrates
    you and winds you up, try to keep an open mind. The person might not just be being
    difficult, they might actually have a valid and good point.


    When they’ve finished, try to hold the silence. This might put them off their
    guard. They’re expecting you to say something – so you’ve got the initiative now.
    Make sure that when your chance to respond comes, you insist that nobody interrupts
    you. This shouldn’t be a problem if you had the self-control not to interrupt
    them. If you’re interrupted, politely remind the person that you deserve to be
    heard – it’s your turn now.


    ##### Step 2 – Deliver


    Make sure you know what you want to achieve and the basis of your argument. If
    you don’t, you’re not ready – so find more time to prepare. If you don’t know,
    how can the other person be expected to understand your point of view?


    Take control by setting out the facts. There’s no harm in repeating the other
    person’s argument or position back to them. This way they’ll know you’ve listened.
    Having heard it again, they might even realise how stupid or weak it sounds! Repeating
    it back to them also gives you more chance to think about it.


    Then, speak authoritatively in the first person. This means saying ‘I’ more than
    you might normally. For example, it’s more constructive to say ‘I don’t agree
    with you’ than ‘you’re wrong’. There’s nothing wrong with saying ‘I disagree’
    or ‘I feel strongly that that is the wrong approach …’. Make sure you have some
    substance to back up your opinion though. Otherwise the other person could counter
    that you’re basing your opinion simply on judgement, not fact. This could also
    mean that you start to lose credibility – and then you’re on the slippery slope
    to losing the argument.


    There’s one exception to the principle of saying ‘I’ – never say ‘I’m sorry’ for
    putting forward your opinion. Never apologise for standing up for yourself unless,
    on reflection, your behaviour was aggressive or inappropriate in some way.


    Speak assertively; try not to stutter and don’t mumble. Remember to breathe! This
    will help you to think and speak at a measured pace. Be positive at all times
    and don’t be frightened to encourage discussion about the issue; even though the
    person might eventually realise you’re right, they won’t necessarily accept this
    if they don’t feel you’ve given them a chance to present their thoughts in full.


    ##### Step 3 – Take the initiative at the end


