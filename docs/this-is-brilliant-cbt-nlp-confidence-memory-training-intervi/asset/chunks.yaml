- raw: '![images](images/00038.gif)From your CV, it looks as if you have taken six
    years out of the job market. How do you think you will fit in coping with the
    routine and the demands of work?


    (Candidates should not have to see this as a negative area in their past, but
    sometimes it can feel that way.)


    ![images](images/00039.gif)Yes, I took a break from paid work to have my children
    and see them settled into school. I have not had salaried employment for the past
    few years, but I have actually been working very hard. Bringing up a family has
    ensured I can deal with the unexpected as well as the routine and I often work
    a much longer day than I did when I was in paid employment. Besides, I certainly
    haven’t forgotten all the skills I used in the drawing office. I keep up to date
    with the relevant trade press and, more significantly, by doing some drawing work
    for friends.


    ![image](images/00004.jpeg)


    Choose positive words such as ‘useful’, ‘considerable’, ‘extensive’ and ‘relevant’.


    Avoid negative words and phrases such as ‘only’, ‘a little’, ‘limited’ or ‘not
    much’ when describing activities and experience.


    ![images](images/00038.gif)You seem to have done a wide range of jobs that don’t
    meet up to your qualifications: they are not ‘graduate’ jobs.


    ![images](images/00039.gif)Getting some kind of work was more important to me
    than anything else. Actually I learned a lot about myself, how much I enjoy imparting
    information to people. I also discovered some gaps in my knowledge and experience,
    especially about working under pressure; there is not one job I have done that
    has not taught me something, even if it is only never to do that kind of work
    again.


    ![images](images/00038.gif)I see that you were made redundant by your last employer
    nine months ago. How have you coped with this?


    ![images](images/00039.gif)It was not a complete surprise because the company
    had been in financial difficulties for a while and many of us were aware that
    our jobs might be under threat. Nevertheless, it was a shock and very hard at
    first. I’ve always been someone with an optimistic attitude, but this field is
    competitive. I enrolled on an IT course to give me some new design skills very
    soon after I lost my last job and I have also been doing some voluntary work for
    my local secondary school, helping with computer skills classes. My CAD skills
    have certainly developed significantly since leaving my last company and I am
    very eager to get back into full-time work.


    ![images](images/00038.gif)You don’t think you will have lost a bit of your edge
    and slipped out of the work routine during that time?


    (This is one possible, rather mean, follow-up question.)


    ![images](images/00039.gif)Quite the opposite. I have filled my time constructively
    and increased my skills, but I really enjoyed work. I think my energy levels and
    enthusiasm are on top form and I intend for them to stay that way.


    ![images](images/00038.gif)I notice that you were made redundant after only eight
    months in a previous post: why do you think this happened?


    ![images](images/00039.gif)It was basically a last-in-first-out policy and the
    company folded completely six months after I left. It was a pity; they had had
    some good ideas and our design team worked well together. It was the smallest
    company I had worked for and I gained a lot from having to be very flexible.


    ![images](images/00038.gif)It looks from your CV as if you haven’t had much work
    experience at all – other candidates we are seeing today are likely to have had
    far more.


    ![images](images/00039.gif)I did think about working for a year before I went
    to university and I had intended to take on a part-time job while I was studying.
    In fact, my father was very ill for a major part of my course and I ended up helping
    out a lot at home and spending time with him and my family. My course was quite
    practical and, as you can see, I got a good result even with all the stress going
    on outside. I really believe I am capable of doing this job and doing it well,
    and you do emphasise your high standard of training and induction.


    ![images](images/00039.gif)It was really difficult to find the sort of work I
    wanted when I first left school. I was desperate to get into something with the
    media and it was hard for me to accept that that just might not be possible at
    that time. I did do some voluntary work for my local hospital radio and some unpaid
    work experience with two local newspapers – I guess I should have mentioned those
    on my CV.


    ![image](images/00004.jpeg)


    Emphasise all your valuable experience to make the best impression. It is common
    for job applicants to dismiss useful experience as irrelevant. Voluntary work,
    work-shadowing, work experience and helping out with a family business are common
    examples of topics that candidates neglect.


    ![images](images/00038.gif)Why did you drop out of university before you had completed
    your course?


    ![images](images/00039.gif)It was the wrong subject and the wrong time and place
    for me. I had been reluctant to carry on with my studies and I am afraid my first-year
    results showed that. The evening job I was doing at the local sports centre was
    far more exciting to me and the manager was very happy with me. If I go back to
    studying I want it to be part-time and I want it to be a more practical course
    than the degree I started.


    It is difficult when, as a candidate, you know that there are extremely private
    and personal reasons that have affected an area of your life at a particular time
    – it may have been a bereavement, serious illness of someone close to you, a broken
    relationship or marriage, or problems within your family at an important time
    during your schooling. You are reluctant to reveal information that feels personal
    and private, which might make you feel upset and your interviewer embarrassed
    and which quite frankly is beyond the scope of what a prospective employer has
    a reasonable right to know.


    Balanced against this is your knowledge that the facts of your personal circumstances
    at the time offer a legitimate and understandable explanation for a drop in your
    work or academic performance. It is perfectly reasonable to say that you were
    affected by difficult personal circumstances that you would rather not discuss
    at an interview but, if it is something you feel comfortable about mentioning,
    then do so. A family break-up during your school examinations or a marriage falling
    apart just as you applied for a promotion might be something you would rather
    reveal and get out of the way. Even the least well-trained of interviewers should
    not then follow this up with a run of personal and intrusive questions. It is
    also helpful to add a comment suggesting that whatever a problem was it is now
    behind you and is not affecting your performance any longer. That, after all,
    is what the person who is contemplating paying your salary and investing in your
    training and development really wants to know.


    ![images](images/00038.gif)You have changed jobs frequently in the last few years.
    Does this mean you get restless if you are in any job for a considerable length
    of time?


    ![images](images/00039.gif)Some of my recent moves have been because I have needed
    to relocate to different places for personal reasons. I am now settled here and
    have bought a property. Of all the jobs I have done in the past three years, I
    really enjoyed my work at the finance company. I have very good references from
    them and the work I was doing looks very similar to the responsibilities you list
    in your advert and job spec.'
