- raw: '### An evolutionary equation for men


    Looking big = Looking strong = Powerful protector = Gain mate = Procreate = Gene
    survival


    As part of his display the male will attempt to stand in front of the female with
    his feet slightly apart, to increase his physical space as well as cutting off
    any hope of advance from other males. If she finds him attractive the female will
    turn towards him, indicating acceptance; if not, he receives the ‘cold shoulder’
    treatment and turns to another possible suitor.


    ![Image](images/00018.gif)


    What is the male doing here and how is the female responding? Answers on pages
    224–5.


    Of course, the male wants to looks good so he engages in preening behaviour by
    brushing back his hair, straitening his tie or smoothing some other piece of clothing.
    (Women in the same circumstances self-preen too.)


    Whilst all this is going on his eyes are working overtime – although he has done
    this many times before – and as he makes his approach the male attempts to hold
    her gaze. Once in front of the female his eyes will alternate between her eyes
    and her mouth.


    Pupil dilation is not only a sign of a good hand at poker, but also a significant
    body language sign of physiological attraction. Boy meets girl or girl meets boy,
    the magic happens and both parties want to see as much of each other as they can,
    so their pupils dilate. However, pupil dilation is only one sign that indicates
    you may be attractive to the other person (if you frighten them their eyes will
    also dilate!), so check for a supporting cluster. If their eyebrows are raised,
    their shoulder moves out of parallax with yours, and their feet are pointing away
    from you, you are definitely not as attrative as you thought you were!


    Blink rate also increases in the other person when they find you attractive. There
    are some ladies who enjoy the attraction and attention of men for its own sake
    and so have become skilled in the flirtatious flutter of the eyelids.


    When he feels confident the male will then move from social space to intimate
    space. He might make an excuse to legitimise this by removing a real or an imagined
    hair or piece of fluff from the female’s shoulder. Or he might lower his voice
    to encourage the female to lean or come closer so she can hear. If more than a
    social closeness is maintained he might become bolder and may touch the female
    on the arm or shoulder in his conversation to illustrate a point or emphasis.
    If the female does not move back or frown he will then extend his hand to those
    socially acceptable places.


    ### Female body language and partnering


    Females have a much greater armoury of body language when it comes to making themselves
    attractive. Some say that males are so slow on the uptake they need two or three
    signals to catch up with the female intuition.


    So what does she do? There is a lot of self-touching – not only preening but touching
    her body, particularly her neck. She also makes herself appear more vulnerable
    by exposing her neck by stretching it. Whilst doing this she might laugh and throw
    her head back, which not only exposes her neck but highlights her bust, too.


    Unlike the man, who attempts to show off his strength and dominance, the woman
    engages in the reverse with a limp wrist and her palms facing outwards.


    When aroused, female lips engorge with blood, making them more red and fuller.
    She might emphasise this by licking her lips, which draws attention to this part
    of the face and their lustre.


    As an orifice the mouth is also considered alluring, so she may make an excuse
    to lick her fingers and/or she may also swallow noticeably when there is nothing
    in her mouth.


    ![Image](images/00019.gif)


    In which of these two pictures of the same woman does she look most attractive?
    More people will say the picture on the right.


    Like the male, the female’s eyes too are working overtime, except in a different
    way. Having managed to secure the social gaze of the male for just a little longer
    than usual, suggesting an intimate look, she will look down and possibly to the
    side, finally returning her gaze. She will repeat this submissive sign if the
    male does not pick up on it the first time around.


    Again, just like the male, if she finds a male that she sees who is attractive
    or pleasing, her pupils will enlarge and the male will respond likewise to this
    signal without even knowing it. Not so long ago ladies who enjoyed just the attention
    of men for its own sake, or wished to show to her friends how popular she was,
    might put a very little juice of the poisonous belladonna berry into her eyes
    which would make her pupils dilate. In Italian belladonna means ‘beautiful woman’.


    ### Humour


    Strange as it may seem, we all know but may not understand why humour is so sexy.
    Just look at the personal ads in next Sunday’s paper to notice how so many people
    want GSH (good sense of humour) in a partner. Humour outranks physical attractiveness
    in finding a life partner.[^(35)](#part0006_split_001.html#ch3ref35)


    ### The company you keep


    Most parents become concerned when their children mix with bad or inappropriate
    company, especially during the teenage years when peer group cultural cloning
    has such an influence on social behaviour and values of the young. It is natural
    to judge people by the company they keep. Long ago the Book of Proverbs suggested:
    ‘He that walketh with wise men shall be wise’ (13:20), and later: ‘A man that
    hath friends must show himself friendly’ (18:24).


    This phenomenon also explains people’s aspirations to be part of the ‘in crowd’;
    to be seen with the ‘beautiful people’ or walk in the ‘corridors of power’. It
    also works in commerce to make an organisation more attractive. Most firms, and
    certainly consultancies, will list their clients as a way of demonstrating their
    bona fides.


    ![Image](images/00004.jpeg)


    So to increase your attractiveness quotient, align yourself with attractive people.[^(36)](#part0006_split_001.html#ch3ref36)


    ### And when it all comes together over time


    Touching socially acceptable parts of the body would be a good indication of the
    desire for intimacy. By the time it has got this far men are driven by their feelings
    and desires. For women, whilst light petting might be physically enjoyable, common
    sense kicks in whilst she reviews future consequences and options before she gives
    permission to continue. Females, as every male knows, will reject advanced physical
    intimacy if they do not feel comfortable or they still have reservations about
    the person. This includes possible future scenarios if petting continues.[\*](#part0006_split_001.html#ch3fn5)


    If these are no issues for the female then intimacy is allowed to become mutual.
    Mock physical play and fighting makes touch socially acceptable and so the relationship
    matures. Deliberate physical contact, usually kissing, is the opening act for
    reciprocal intimacy. Increased mutual personal touching occurs in the sequence
    from peripheral to central, and consummation is enjoyed. It is a dance where both
    must move together in time and action; too fast or too slow can have disappointing
    outcomes for one or both of the romantic pair.


    ### Summary


    Many of the following features of attractiveness are inherited and difficult to
    fake, but please remember that there are very few individuals – male or female
    – who possess, thankfully for 99.999 per cent of us, all these genetically inherited
    qualities.


    Remember also, here we discount the huge effect of personality and are only concerned
    with the physical aspects of both male and female.


    #### For females'
