  trans: '


    ![images](img/00038.gif)从你的简历来看，似乎你离开职场六年了。你认为自己如何适应工作的常规和要求？


    （候选人不应将其视为过去的负面领域，但有时可能会有这种感觉。）


    ![images](img/00039.gif)是的，我暂时离开有偿工作是为了生儿育女，并看着他们顺利入学。过去几年我没有领薪工作，但我实际上一直在非常努力地工作。抚养家庭让我能够应对意外情况以及日常事务，而且我工作的时间通常比从事有偿工作时要长得多。此外，我当然没有忘记我在制图室使用的所有技能。我通过阅读相关行业报刊保持知识更新，更重要的是，通过为朋友做一些制图工作来保持技能。


    ![image](img/00004.jpeg)


    选择积极的词汇，如“有用的”、“相当大的”、“广泛的”和“相关的”。


    描述活动和经验时，避免使用“仅”、“一点”、“有限”或“不多”等消极词汇和短语。


    ![images](img/00038.gif)你似乎做过很多与你的资历不符的工作：它们不是“毕业生”工作。


    ![images](img/00039.gif)找到某种工作对我来说比任何事情都重要。实际上，我学到了很多关于自己的事情，比如我有多么喜欢向他人传授信息。我还发现了自己知识和经验中的一些空白，尤其是在压力下工作方面；我做过的每一份工作都教会了我一些东西，即使只是再也不做那种工作。


    ![images](img/00038.gif)我看到你九个月前被上一家雇主裁员了。你是如何应对的？


    ![images](img/00039.gif)这并非完全出乎意料，因为公司一直面临财务困难，我们中许多人都意识到我们的工作可能面临威胁。尽管如此，起初这仍是一个打击，非常困难。我一直是一个乐观的人，但这个领域竞争激烈。我在失去上一份工作后不久就报名参加了
    IT 课程，以获得一些新的设计技能，并且我还一直在为当地中学做志愿者，协助计算机技能课程。自离开上一家公司以来，我的 CAD 技能无疑有了显著提升，我非常渴望重新全职工作。


    ![images](img/00038.gif)你不认为你在这段时间里会有点生疏，脱离工作常规了吗？


    （这是一个可能的、相当刻薄的后续问题。）


    ![images](img/00039.gif)恰恰相反。我把时间用在了建设性的事情上，并提升了技能，但我真的很喜欢工作。我认为我的精力和热情都处于最佳状态，并且我打算保持这样。


    ![images](img/00038.gif)我注意到你在之前的一个职位上只待了八个月就被裁员了：你认为这是为什么？


    ![images](img/00039.gif)基本上是“后进先出”政策，我离开后六个月公司就彻底倒闭了。这很遗憾；他们有一些好主意，我们的设计团队合作得很好。这是我工作过的最小的公司，我从不得不非常灵活中获益良多。


    ![images](img/00038.gif)从你的简历来看，似乎你几乎没有工作经验——我们今天见到的其他候选人可能有更多经验。


    ![images](img/00039.gif)我确实考虑过上大学前工作一年，并且打算在学习期间找一份兼职工作。事实上，我父亲在我的课程大部分时间里病得很重，我最终在家帮了很多忙，并陪伴他和家人。我的课程相当实用，而且，正如你所见，尽管外界有各种压力，我还是取得了好成绩。我真的相信我能胜任这份工作并做好，而且你们强调了你们高标准的培训和入职指导。


    ![images](img/00039.gif)我刚离开学校时，很难找到我想要的那种工作。我急切地想进入媒体行业，很难接受那时这可能根本不可能。我确实为当地医院广播电台做过一些志愿者工作，并为两家当地报社做过一些无薪工作经验——我想我应该在简历中提到这些。


    ![image](img/00004.jpeg)


    强调你所有宝贵的经验，以留下最佳印象。求职者常常将有用的经验视为无关紧要。志愿工作、工作跟随、工作经验以及帮助家庭企业是候选人容易忽略的常见话题示例。


    ![images](img/00038.gif)你为什么在完成课程前退学了？


    ![images](img/00039.gif)那是错误的科目，对我来说也是错误的时间和地点。我一直不愿继续学业，恐怕我的大一成绩也说明了这一点。我在当地体育中心做的晚班工作对我来说要有趣得多，经理也对我很满意。如果我回去学习，我希望是兼职，并且希望是比我开始的学位更实用的课程。


    作为候选人，当你知道有些极其私人和个人的原因在特定时期影响了你生活的某个方面时，这很困难——可能是丧亲、亲近的人患重病、关系破裂或离婚，或者在学业重要时期家庭出现问题。你不愿透露感觉私人和私密的信息，这可能会让你感到难过，让面试官感到尴尬，而且坦率地说，这超出了潜在雇主有合理权利知道的范围。


    与此相平衡的是，你了解当时个人情况的事实为工作或学业表现下降提供了合理且可以理解的解释。完全可以说，你受到了不愿在面试中讨论的困难个人情况的影响，但如果你觉得舒适地提及，那么就可以说。在学校考试期间家庭破裂，或者在申请晋升时婚姻破裂，可能是你宁愿透露并了结的事情。即使训练最不足的面试官，之后也不应该再追问一连串私人和侵入性的问题。此外，补充一句评论，暗示无论问题是什么，现在都已过去，不再影响你的表现，这也是有帮助的。毕竟，这就是考虑支付你薪水并投资于你的培训和发展的人真正想知道的。


    ![images](img/00038.gif)你过去几年频繁更换工作。这是否意味着你在任何一份工作上待相当长的时间就会感到不安？


    ![images](img/00039.gif)我最近的一些变动是因为出于个人原因需要搬到不同的地方。我现在在这里安顿下来，并买了房产。在过去三年做过的所有工作中，我真的很喜欢在金融公司的工作。我从他们那里得到了非常好的推荐，而且我当时做的工作与你在招聘广告和工作规格中列出的职责非常相似。


    '
  toc: []
- raw: '![images](images/00039.gif)Many of those jobs were temporary anyway and my
    employers in those situations were not expecting me to stay long, for example
    when I was providing Christmas or holiday cover. I did not want to commit myself
    to a career until I was more sure of the direction in which I wanted to go. My
    temporary job in the local planning department gave me my first real involvement
    with work that touched on environmental issues, and I have done a great deal of
    voluntary work with urban and rural environmental improvement projects, so I hope
    that demonstrates my enthusiasm and commitment to a career with your organisation
    – it feels like the opportunity I have been waiting for.


    ![images](images/00039.gif)In an ideal situation I would not have chosen to change
    jobs so often, but at the moment it has been easier to get short-term contracts
    than anything permanent. It has certainly meant I get up to speed in new situations
    very quickly, but I would prefer a more secure situation and the opportunity to
    gain more management experience.


    ![image](images/00004.jpeg)


    In the current economic climate many applicants will face the situation of frequent
    job changing, short contracts and periods of unemployment. Interviewers are not
    picking on you when they mention it; they need to know how you cope and what your
    strategies are when you are in a disheartening position.


    ![images](images/00038.gif)How have you motivated yourself to keep looking for
    work since you were made redundant?


    ![images](images/00039.gif)I have tried to build a lot of structure into my job
    hunting and the most important thing I have done is to keep in touch with a regular
    network of contacts. This not only keeps my name out there, it also keeps me in
    touch with any new developments and ideas. That is how I heard that you may be
    looking for someone with my experience.


    ![images](images/00038.gif)You have requested us not to approach your current
    employer for a reference. Why aren’t you happy for us to do this?


    ![images](images/00039.gif)My current company may be looking at some cost-cutting
    measures and if they think I am looking elsewhere I may turn out to be one of
    them. I am quite happy with my work there, but I have been at that level for two
    and a half years now and I think the job you are offering is ideal. I feel sure
    I would enjoy it, but I can’t guarantee that I shall be the successful candidate
    and I don’t want to unsettle things with my current firm.


    ![images](images/00039.gif)My current manager has only been in the post for three
    months and if he were asked to write my reference I am not sure that he knows
    enough about my work, what it entails, what my strengths are, or to be able to
    do justice to my skills. I feel you would get far more relevant information from
    my previous boss, for whom I worked for four and a half years.


    ![images](images/00038.gif)Your reference shows that last year you had 15 days
    off work due to sickness. Is this a typical annual record for you?


    ![images](images/00039.gif)No, far from it. Those 15 days were all in a block
    and it was because I had had an accident while on a skiing holiday. My attendance
    record up to then has been good.


    ![images](images/00038.gif)Apart from your annual leave entitlement and public
    holidays, how many days were you absent from work last year?


    ![images](images/00039.gif)Four – two were for dental surgery and the other two
    for an extremely heavy cold that meant I was useless on the telephone, but I am
    usually pretty hardy.


    (Health records are of concern to employers. Many organisations will use a pro
    forma reference request, which they send to your current employer or your nominated
    referee. This form usually contains a section asking for details of how many days
    you have taken off work due to sickness, so your interviewer may already have
    access to accurate information on this.)


    ![images](images/00038.gif)What is your time-keeping like?


    ![images](images/00039.gif)Good, I am usually the first to arrive in the mornings
    and I dislike being late for a meeting, training session or anything. I think
    you owe it to your colleagues as well as your manager to be punctual.


    ![images](images/00038.gif)You left your last job without having another one lined
    up to go to. Wasn’t that a bit risky?


    ![images](images/00039.gif)Yes, I suppose it was, but I had never intended to
    stay in sales for that long and it felt like the right decision. There had been
    a lot of changes there recently and very few staff were happy. It takes a great
    deal for me to become discouraged. But I felt my wisest option was to leave and
    start looking for something else. The sales work was useful, especially dealing
    with people and working under pressure – two things that I have become very good
    at. I’m sure they would be valuable in your customer-support department.


    ![images](images/00038.gif)One of your references suggests that you sometimes
    lose your cool in the office. What is your reaction to this?


    ![images](images/00039.gif)It has happened very occasionally, but I have always
    been quick to apologise if I have been unreasonable and it has certainly never
    happened in front of a client. I am aware of it, so I make an effort to keep calm
    and explain what is annoying or frustrating me. I think most of my colleagues
    would say that, although I can be a little volatile, I am a helpful and supportive
    member of the department for the vast majority of the time.


    ![images](images/00038.gif)Have you ever been asked to resign?


    ![images](images/00039.gif)No, but I have come close enough to it to resign of
    my own accord rather than waiting to be asked. We had undergone a restructuring
    with a new manager, with whom I admit I did not hit it off, and yet I had worked
    successfully and productively there for ten years. I knew that cost-cutting and
    streamlining measures were on the cards and I just had to accept that I was not
    flavour of the month. It was hard, but it was a useful lesson and I spent an interesting
    18 months working as an independent consultant.


    ![images](images/00039.gif)No, I am pleased to say that is not an experience I
    have had to go through.


    ![images](images/00039.gif)Yes. It was the first job I had after I left school.
    I really wanted to get into anything to do with cars and somehow I ended up working
    for an insurance company – I don’t think it was ever going to work out.


    ![image](images/00004.jpeg)


    Don’t shoot yourself in the foot. If you have had awful experiences, losing jobs
    through no fault of your own, or even as a result of your own actions – if this
    is in the past, and won’t emerge through references – don’t mention it.


    ### What am I supposed to say?


    Some interviewers will try to find out more about your strengths and weaknesses
    by confronting you with imaginary scenarios to see just how good you are at thinking
    on your feet. These questions are not designed with one ‘right’ answer in mind,
    so don’t waste time agonising over the correct solution. What your interviewer
    is looking for is evidence of your common sense, your ability to take decisions
    under pressure and your capacity to know your own limits.


    ![images](images/00038.gif)You are the manager of a large supermarket and you
    receive an anonymous telephone call saying that a number of the baby-food products
    you carry have been tampered with by a protest group. How do you react?


    ![images](images/00039.gif)I would suspect it was probably a hoax but, of course,
    I would take every precaution in case it were not. If I had an assistant, I would
    ask them to arrange to cordon off the baby-food aisle and see what could be done
    to stop any items getting through the checkouts. I would also make a calm announcement
    over the PA. I would telephone the police and also local press and radio to begin
    a recall of any suspect items. If I had no assistant, my priority would be to
    stop anyone buying any of the products in question and then contact the police.'
