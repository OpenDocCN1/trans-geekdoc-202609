    The benefits of knowing numbers and names are clear; but so too are the dangers
    of forgetting them. If you’ve ever sent something to the wrong address, bought
    a piece of furniture that was just too big, missed an important appointment, forgotten
    a special birthday or anniversary or made a mistake about something as clear cut
    as someone’s name … then you’ll know how embarrassing, frustrating and costly
    it can be to let these particular ‘prizes’ slip through the net.


    | ![images](images/00021.gif) || Memory is what tells a man that his wife’s birthday
    was yesterday. |


    | --- | --- |


    Mario Rocco


    This chapter is about getting to grips with some of the hardest-to-hold information.
    It will provide you with practical strategies for storing these vital details;
    show you how to make the most of everything else you’ve learnt about your memory;
    and give you a wide range of applications so that you can start putting your new-found
    confidence to use.


    You can do it. You’ve already seen clear evidence of your memory’s phenomenal
    power. You’ve proved that strategies and systems can have a revolutionary impact
    on your learning. Now you’re ready to get your brain in gear and master numbers
    and names once and for all.


    ## Numbers


    Systems for remembering numbers have been around for centuries, and they all work
    on the same basic principle: that numbers are hard because they’re intangible
    and abstract, so to make them easier you need to make them mean something. We
    do that naturally when we spot familiar number-facts or find patterns that suggest
    some sort of meaningful design. Number systems simply give you a way to do it
    quickly and easily every time.


    ### Number rhymes


    Rhyme has played an important role in the history of number learning. As well
    as individual verses, like: ‘In sixteen hundred and sixty-six, London burned like
    rotten sticks’, a very specific strategy has been around for centuries that uses
    rhyme to make numbers so much more memorable.


    Instead of thinking of abstract ideas – ‘one, two, three’ – you use rhymes to
    give you concrete images: ‘bun’, ‘shoe’, ‘tree’. These can be used as ‘pegs’ for
    other bits of information, or the images themselves can be linked into pairs or
    larger sets, connected to other kinds of information, organised into imaginative
    stories or arranged around journeys of the mind.


    The Number Rhyme System is quick to learn and it delivers immediate results. It
    can struggle with longer lists or large sets of numbers, but it’s a useful strategy
    to have up your sleeve, and a good way to see what happens when you turn numbers
    into pictures.


    Start by setting up ten rhyming images. Here are some suggestions, but it’s your
    memory, so use rhymes that are going to work for you.


    1. sun, bun, gun


    2. shoe, loo, goo


    3. key, tree, sea


    4. door, saw, war


    5. hive, jive, drive


    6. bricks, sticks, tricks


    7. heaven, Devon, Evan


    8. skate, gate, Kate


    9. wine, vine, mine


    10. hen, pen, wren


    For digit learning you’ll also need 0: so how about ‘port’ for nought or ‘hero’
    for zero?


    So you simply choose your favourite rhyme for each of the numbers, zero to 10.
    Then, whenever you want to learn a numbered list, you have a ready-made row of
    ‘pegs’ on which all the items can be hung. And to remember numbers themselves,
    you’ve got some very clear pictures to use instead.


    ![image](images/00004.jpeg)


    The seven steps to building strong memories still hold true. Plan what you’re
    going to do with the images, visualise them with as much personal, powerful detail
    attached as possible, organise them in effective ways – and then practise with
    them until the memories are fixed.


    ### Learning a list


    To learn the following inventory of household objects …


    lamp TV bath vase bed curtains computer


    dishwasher fridge toaster


    … simply create a strong mental picture for each one and link it to the appropriate
    number image, using the sort of connections that form the organising structure
    of your memory stories. One thing can be joined to another, or transform into
    it, explode to release it, smash into it, play with it, eat it … Remember to include
    all your senses, to imagine your own reactions to what’s going on, and to exaggerate
    every memorable detail.


    Here are some ideas:


    | 1 || lamp: if your rhyme for ‘1’ was ‘sun’, you could imagine the lamp burning
    as brightly as the sun itself. If you’d chosen ‘bun’, you might design your lamp
    to look exactly like a delicious currant bun. |


    | --- | --- |


    | 2 || TV: smashing the TV with a shoe, a show about loos, or a TV-set covered
    in sticky goo. |


    | 3 || bath: perhaps there’s a tiny key floating in your bath, or a tree growing
    up through the water. |


    | 4 || vase: open the door and knock a priceless vase to the floor, or picture
    the vase painted with vivid scenes of war. |


    | 5 || bed: a tiny bed for every bee in the hive; a jive competition being held
    on your bed; or the bed being moved from the bedroom to sit in the middle of the
    drive … |


    Now it’s your turn. Have a go with the next five items on the list.


    | 6 || curtains |


    | --- | --- |


    | 7 || computer |


    | 8 || dishwasher |


    | 9 || fridge |


    | 10 || toaster |


    When you’ve designed your five image links and given yourself a couple of minutes
    to practise, see how many of the original ten objects you can remember, using
    the number-rhyme ‘pegs’ to organise your creative ideas. Can you go through the
    whole list, backwards as well as forwards? What was the eighth item? What came
    before the curtains?


    ![image](images/00034.gif)


    Just like memory journeys, the number-rhyme system lets you use one memory to
    trigger another. Each image hooked on to one of the ten pegs can be the starting-point
    for a scene or story designed to store as much information as you like. The bun-shaped
    lamp might fall over into a luxurious chocolate cake and have to be prised out
    with a long stick of celery. After being smashed by your shoe, what if the TV
    set started leaking litres of coffee on to the carpet – with juicy green olives
    floating in it? The key could be floating in a bath full of strawberry jam, and
    a passing chicken might get its feet stuck … until it pulled on a long sausage
    and dragged itself free – only to fall into a huge pot of sugar … Suddenly, ‘3’
    isn’t just bath, it’s also strawberry jam, chicken, sugar … and you’ve got a detailed
    shopping list that you won’t forget in a hurry!


    ### Learning numbers


    Your friend’s new house number is 48, so you might imagine them holding a saw
    with a pair of skates hanging from the end.


    Rob’s extension number is 72, so you could visualise a heavenly shoe sitting on
    his desk: bright white, decorated with angels and haloes.


    Your top price in the negotiations is £56,000, so perhaps you imagine hitting
    a hive with sticks, releasing the bees, being stung … and the pictures in your
    mind would help you to avoid being stung for real.


    Have a go yourself. Check you have ten images based on number rhymes, then use
    them to learn the following facts.


    You need to go to a meeting in room 39.


    The security code on your bank card is 924.


    The prize is behind door number 6.


    Your hotel room is 1875.


    Your favourite TV show is starting now on channel 606.


    ![image](images/00004.jpeg)


    Sometimes the basic pictures will work fine, but you can always be creative about
    the way you interpret the rhymes. The number 7 starts as ‘heaven’, but it might
    also be ‘heavenly’, ‘heaven-sent’, angels, haloes, fluffy clouds … The number
    2 could be any kind of footwear. Zero might turn into the super-hero of your choice,
    a costume or gadget – or even one of his special powers. So 720 could be an angel
    wearing shoes decorated with pictures of Superman, a cloud holding up a ballet
    shoe and a utility belt, or a heavenly shoemaker leaping between tall buildings.


    ## Did you know?

