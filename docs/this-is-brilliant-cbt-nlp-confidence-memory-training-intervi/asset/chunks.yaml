- raw: 'You can explore and change the qualities of your internal audio in much the
    same way that you changed your mental imagery above. Use the following technique
    to change the way you feel when you think about a future event. It can be used
    in all kinds of situations when you want to feel a certain way. How do you want
    to feel when you wake up in the morning, when you get to work on Monday, when
    your partner does something that annoys you? How many different voices can you
    create for yourself?


    ### Use your inner voice to change the way you feel


    Think about an upcoming event that is important to you and decide how you want
    to feel at that time. Now choose an actor or someone you know well who has the
    tone of voice that you want to have at the event.


    Imagine that the event is just about to start and have a conversation with yourself
    in the tone of voice you have chosen. For example, you may want to feel confident
    and determined to get a result. Choose the voice of one of your heroes, saying,
    ‘This is an important day for me. I will be asking some tough questions and expecting
    clear answers. I will be positive, focused and determined to get a result we can
    act on.’ Now say it again and turn up the volume. Adjust the tone and pace until
    you begin to feel confident and determined.


    You can also turn the volume down when your internal dialogue gets carried away
    with itself. When you keep repeating negative dialogue over and over, telling
    yourself what a mess you made of this or that or churning over a work problem
    when you are trying to sleep, simply turn the volume down and notice the words
    fading away into the distance until they have gone completely. You can also change
    negative voices into humorous voices, such as Bart Simpson or Mickey Mouse. Notice
    how easily the negative feelings disappear when you do that.


    When you realise that you have control over your inner voice and associated sounds,
    you can walk around with a symphony orchestra in your head and a host of film
    stars and cartoons at the ready, should you require their services. Have fun!


    ### Feeling fantastic


    The feelings you have during a day are the result of how you have chosen to associate
    with your experiences. This is the emotional domain. The word used to describe
    those feelings is ‘kinaesthetic’.


    Your feelings are generated by imagined events as well as real experiences. If
    you have an argument with a partner or a disagreement with a shop assistant, the
    feelings you experience will be part of a learned pattern of reacting to those
    circumstances. A memory consists of visual, auditory and kinaesthetic elements,
    sometimes including smells and tastes as well. Feelings result from thinking in
    a particular way. For example, a feeling of apprehension may be the result of
    creating dark, murky images and internal dialogue that is warning you to be on
    the alert for an awkward or difficult situation. Imagine how this contrasts with
    the feelings of another person in the same situation who is creating bright, clear
    images with internal dialogue that is full of excitement.


    You have the capacity for a wide range of feelings – from excited highs to heavy
    lows and, at worst, depression. There are many techniques to help you feel the
    way you want to feel. Some of them help you to change the feelings you have attached
    to negative memories, while others give you a way to create any feeling you want
    at any time.


    ### Use your best experiences to feel great


    The way we attach feelings to our thoughts is very haphazard. We allow people
    and circumstances to influence the way we feel. Once a thought has a feeling attached,
    it becomes well and truly anchored. Each time we recall that thought, the exact
    same feeling will surface. For example, when you look at a photograph taken on
    a great holiday, the feelings you had at the time return. When you answer the
    phone and hear the voice of someone you had a negative experience with, you feel
    the same way as when that experience happened.


    Anchored feelings become embedded in your memory very easily. A classic anchor
    is when you have a bad encounter with a sales assistant and decide never to visit
    that shop again. Whenever someone mentions the shop’s name, you relive the feelings
    you had at the time of your encounter, even though it may have taken place a long
    time ago.


    The process of anchoring feelings to thoughts is an automatic feature of the unconscious
    mind. The result is called a ‘state’. It is not just a state of mind but also
    a state of mind and body, as the way you think and feel causes the body to become
    either relaxed or tense.


    Now, what if you could use this process to create great feelings, or states, whenever
    you wanted them? In other words, exercise choice over the feelings you anchor
    and the states you create. What if you could produce feelings of being courageous,
    confident, calm, decisive, optimistic, attentive, playful, empathetic, curious
    or focused? What if you could create a positive state for learning and being open-minded;
    for leadership, motherhood, fatherhood; for being dynamic or having abundant energy;
    for love, sensitivity? Well, you can with the following very simple technique.


    ![image](images/00003.jpeg)


    Louise had to present to the board of directors on a regular basis. The more she
    did it, the more nervous she became.


    On one particular day, she was excited that she was going to present her new idea,
    which would save the company a great deal of money. She was also anxious about
    blowing it and really wanted to get the board to listen to her idea.


    We helped Louise to access a confident state she knew well from another situation
    and anchor this state to the boardroom door handle. As soon as she touched the
    handle, the confident state emerged and she was able to give her presentation.


    ### Anchoring resourceful states


    Decide which positive state you would like to anchor. Choose one from the list
    on the previous page – or you may have some other specific state in mind. For
    the purpose of this exercise, we will call it ‘state X’. Read through the exercise
    and commit it to memory – you will need to keep your attention focused internally
    throughout the process, so you will not want to be checking the book for what
    to do next.


    Preparing for the exercise


    You are going to attach a state to a trigger point somewhere on your body, such
    as pinching your ear or squeezing your thumb. Choose something that you are unlikely
    to do accidentally and can repeat with precision.


    The procedure


    1.  Recall a time when you had a strong feeling of having state X and keep thinking
    about that memory. Choose any context you like, as long as the feeling of state
    X is very strong. If you can’t think of one, then put yourself into an imaginary
    situation where you are in a high level of state X. Pay attention to the qualities
    of your image and any sounds. You are going to use your internal representation
    to intensify the feeling of state X. It may help to close your eyes as you do
    the exercise.


    2.  Project the image in front of you above the horizon level. Make sure you are
    looking at yourself in the image.


    3.  Put a frame around the image. Make it colourful and bright with a high level
    of contrast. If sound is involved, adjust an imaginary graphic equaliser so that
    it is across the full range of treble, middle and bass. Make it surround sound.


    4.  Intensify the colour, brightness, contrast and sound.


    5.  Slowly bring the image closer to you and notice how the frame eventually disappears
    until the image is so close it has enveloped you and is all around you. As the
    feeling of state X approaches the peak of its intensity, set your anchor by gently
    squeezing your thumb (or pinching your ear or whichever anchor you have chosen).
    Release the anchor as soon as the sensation begins to diminish. ![Image](images/00009.gif)'
