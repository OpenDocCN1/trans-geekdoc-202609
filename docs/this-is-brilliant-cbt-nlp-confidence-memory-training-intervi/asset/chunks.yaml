    *   Your new colleague is called Fred Bloom. Imagine him walking into your office
    wearing bright red clothes and carrying a bunch of blooming flowers. Maybe he’s
    half red, half blue (for Bloom). Why does he seem so worried about finding the
    loo? As he sits down at his desk, why is he setting up a loom?


    *   If you learnt that Henry the Eighth’s first wife was called Catherine of Aragon,
    you could imagine her doing something with a cat and a rag, being arrogant, getting
    into a rage … put her into a scene alongside her infamous husband … and set up
    memorable images even before you found out anything more about her.


    But when you’ve got the real person in front of you there’s so much more you can
    do to connect them with their name. As well as seeing them act out the images
    you’ve designed, you can use the way they look and the things they’re wearing
    to help you.


    ##### Lookalikes


    Does this person remind you of someone else? It could be a famous face or a family
    member, but it makes sense to use any resemblance they have to someone you already
    know. What if they were really that other person in disguise? How would that make
    you feel, and how might it change the things you imagine?


    *   If your new neighbour Andy Webster happens to look like Elvis, you could imagine
    him using his huge hands (Andy) to stir the webs (Webster) on his garden fence
    – dressed in a Las Vegas jumpsuit and gyrating his hips like the King. When you
    next bumped into him, you’d have the Elvis connection to take you straight to
    the images based on his name. You’d still be able to get there by picturing him
    standing by his fence, and you’d still have the ‘fake’ recollection of how you
    felt when you saw his cleaning and dancing in action; but you’d also be using
    his physical appearance as a direct link into your multi-layered memory for Andy
    Webster.


    *   Maybe your colleague Helen Martino looks like the Queen of England. Imagine
    this really is the Queen in disguise, arriving at your office in a royal limousine
    decorated with devils and fiery furnaces (images of hell for Helen) and drinking
    from a huge Martini cocktail (Martino). Look for clues in the jewellery she’s
    wearing (are those miniature crowns on her necklace?) or in the way she walks
    (like she’s in a regal parade?) that will remind you of the royal connection.
    Even away from the context of your office her appearance should trigger you to
    think about a very memorable mental scene: this Queen lookalike in a hellish car
    drinking Martinis … Helen Martino.


    ![image](images/00004.jpeg)


    Don’t forget how important location is to memory. If you’re ever struggling to
    remember the name of someone you’ve met, think carefully about where you were
    when you last saw them. Focus on the exact part of the room, building or town;
    see the two of you standing there; but also imagine what you could see from that
    spot, using every available detail to reconnect you with the memory.


    ##### Features and fashions


    Like a caricaturist painting an exaggerated portrait, highlight any details that
    you could emphasise in your memory and use as links to someone’s name. Temporary
    ‘hooks’ might be details of clothing, jewellery, make-up or hairstyle; but you
    can find more permanent links in face-shape, nose-size, birth-marks, height –
    anything that you’d be sure to notice about the person in question when you met
    them again.


    *   If Amira Khan had a very round face, you could imagine her looking at herself
    in a very round mirror (Amira) made out of tin cans (Khan).


    *   If Rick Carpenter was particularly tall, you might imagine him using his carpentry
    skills to build an incredibly high wooden shelf to hold all his model rickshaws.


    #### Step 7: Practising


    You need to start practising new names straight away, while the real person’s
    still there in front of you. Make sure you drop their name into conversation a
    few times, but you can also be saying it ‘aloud’ in your own head, getting used
    to how it sounds and building up the association with its owner. At the same time
    you’ll be creating the images and links that will keep this person in your mind
    for the long term; so, while you’re talking to them, run through the triggers
    you’ve set up and practise following the images and associations that take you
    back to their name.


    ![image](images/00024.jpeg)


    Try out these techniques for yourself on the following names.


    With this first set, practise creating memorable images and connecting them to
    the people in question.


    Your travel agent is Doug Reddy.


    The party is being hosted by Maddie Tan.


    Your new neighbours are Bart and Sue White.


    With the next group of names, create images for them all and then fix them into
    the first five loci of a memory journey.


    Lily Sato    Jake Moody    Rowan Carter    Imogen Fox    Carlo Mancini


    Put these strategies into practice in your everyday life and see what a difference
    they make. If you follow the steps carefully, you’ll start remembering people
    for long enough to do something more permanent with their names: putting them
    in your diary, adding them to your phonebook or filing them mentally in stories
    and journeys.


    And because you know how name learning works, you can start activating memories
    about you.


    ![image](images/00004.jpeg)


    To give other people the best chance of remembering you …


    *   Introduce yourself clearly – and make sure they’ve heard.


    *   Help them to visualise your name by mentioning how it’s spelt or what it means.


    *   Give them information about you that’s easy to picture.


    *   Talk about logical details and imaginative ideas to activate both sides of
    their brain.


    *   Give people reasons to remember you. What’s in it for them to learn your name?


    *   Back up their natural memory with business cards, thankyou letters or follow-up
    emails.


    In the next chapter you’ll learn more about using memory techniques to affect
    other people’s memories: writing unforgettable exam answers, giving powerful presentations,
    making the best possible impact in interviews. But first, to round off Chapter
    8 …


    ### Names with numbers


    It’s time to bring together the two main themes of this chapter: connecting names
    to numbers. This skill will also feature in many of the high-pressure memory challenges
    to come; but for now, you need to see how easy it is to link numbers to names.


    Carol Wu lives in apartment 702.


    Imagine a carol singer trying to woo Carol Woo at her apartment. She has nothing
    to wear for a date – until a heavenly hero gives her some beautiful shoes. In
    the Number Rhyme System, heaven/hero/shoe = 702.


    Leon Morales’ date of birth is 23.06.71.


    Perhaps you picture a lion (Leon) shouting for ‘more ales’ (Morales) at Leon Morales’
    birthday party, wearing a gnome’s jacket (because, in the Major System, NoMeS
    JaKeT = 230671) There’s plenty going on in this scene, but every detail is clear
    – and memorable, when you put all your training into action.


    Use everything you know about memory – and both sides of your brilliant brain
    – to remember that …


    Tom Fischer’s extension number is 849.


    Holly Santos owes you £458.


    Rocky Singh has ordered 26 TVs and 15 DVD players.


    Lola O’Neil was born on 15.09.78.


    … then cover up the information and test your brilliant memory for numbers and
    names.


    ![image](images/00010.jpeg)


    *   Abstract numbers and names are easy to forget – but can be made memorable.


    *   Number systems let you turn digits into images and fix them in your mind.


    *   To remember people, create powerful links between names and faces.


    *   Use your memory training to help other people remember you.


    *   Link numbers and names to store key details about all the people in your life.


    [![Image](images/00035.jpeg)](http://www.amazon.co.uk/Brilliant-Memory-Training-Worrying-Lifeskills/dp/0273745816/ref=sr_1_1?ie=UTF8&qid=1381744231&sr=8-1&keywords=brilliant+memory+training)


    ![Image](images/00036.jpeg)


