- raw: "Next time you go to the newsagents pick up a magazine about a subject that\
    \ you know nothing about and flick through it. Broadening our horizons and knowing\
    \ what is happening in the media and around the world opens up paths of conversation\
    \ that otherwise would have remained closed. Read your industry publications as\
    \ well as a quality broadsheet and tabloid so you have a spectrum of views.\n\n\
    ### How to end a conversation\n\nEven though we might enjoy a conversation, at\
    \ some point it is obvious that both parties have run out of interesting things\
    \ to say and the conversation has lost its purpose. Below are some ideas for ending\
    \ a conversation gracefully.\n\n#### Connect them to someone else\n\nRather than\
    \ abruptly leaving a person standing or sitting, which is plain rude, one of the\
    \ best ways to leave a conversation is to connect the person to someone else in\
    \ the room by making an introduction. This might mean saying, for example, ‘Paul,\
    \ I would like to introduce you to Niall who is an accountant. Niall, this is\
    \ Paul who is a lawyer for Global Bank.’\n\nOnce the introduction is made, you\
    \ step out and walk away. Done naturally this gives a good chance for you to meet\
    \ someone else and also for the person you left to make a new connection with\
    \ somebody they just might have more in common with or gain information that could\
    \ be of benefit.\n\n#### Give a plausible reason to leave\n\nFor example: ‘I’m\
    \ really sorry, I’ve enjoyed our conversation, but I need to check whether my\
    \ friend has arrived. It was great speaking to you and I hope you enjoy the evening.’\
    \ Or ‘I’m really sorry but I must go because I need to speak to Jack before he\
    \ leaves. It was great speaking to you. Can I introduce you to our sales manager\
    \ before I go?’\n\n![image](images/00004.jpeg)\n\nApply the five-minute rule.\
    \ Five minutes is generally long enough to start a conversation and to ask questions\
    \ to find mutual interests. If there are no obvious synergies, thank the person\
    \ you are speaking to and exchange contact details. Never leave the person alone\
    \ but again introduce them to someone whom you have met earlier who you think\
    \ would be a useful connection or look to bring someone else into the conversation.\
    \ You never know when someone can help you. Later on down the line that person\
    \ could be the one individual you most need to know. Always be respectful and\
    \ mindful, and don’t forget to exchange contact details.\n\nFinally, before you\
    \ leave any event make sure that you have said goodbye and thanked the host. Often\
    \ the host will be circulating but it is vital feedback and appreciation which\
    \ will lead to more invitations. Double check that you have met everyone you wanted\
    \ to and then leave. If you are done, avoid hanging around or lingering until\
    \ the very end. Not only is this an inefficient use of your time but the hosts\
    \ might be wanting people to leave so they can wrap up the event and clear the\
    \ venue.\n\n### Ask for what you want\n\nThe reason you are networking is to accomplish\
    \ your goals and so no matter how well a conversation is going it is important\
    \ that you ask for what you want. Asking for what you want is powerful but it\
    \ also needs to be done in such a way that it will give you the information you\
    \ need.\n\nIn their book The Power of Networking (1999), Sandy Villas and Donna\
    \ Fisher suggest using the question ‘Who do you know who…?’ rather than ‘Do you\
    \ know anyone who …?’ to make a request. The latter can be answered with a closed\
    \ yes or no, ending further conversation. By asking the former question the person\
    \ is forced to think of people they know.\n\nSome other powerful networking questions\
    \ that Villas and Fisher highlight are:\n\n*   ‘Who do you know who I should know\
    \ (given the following circumstances)…?’\n\n*   ‘Who do you know who knows…?’\n\
    \n*   ‘Who do you know who would benefit from…?’\n\n*   ‘Who would you recommend\
    \ I contact about…?’\n\n*   ‘I am looking for… Who do you know who…?’\n\n*   ‘I\
    \ would like to know the names of people you know who…?\n\nAsking the right questions\
    \ opens up new possibilities to further your networking goals.\n\n### Share your\
