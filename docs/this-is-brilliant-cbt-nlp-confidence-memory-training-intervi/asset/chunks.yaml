    Albert Ellis, the American psychologist and psychotherapist, talked about ‘thought-feeling
    fusion’ by which he meant that our cognitive and emotional responses are often
    two aspects of the same thing. Usually in CBT we are looking for the negative
    thoughts that prime distressing emotions, but it is important to recognise that
    our feelings can also encourage us along certain lines of thought. Sometimes our
    strong feelings can be treated as ‘evidence’ for the truth of our negative thoughts.
    This is called emotional reasoning and it can get us into all kinds of trouble.


    ![image](images/00003.jpeg)


    ‘He’s really winding me up!’ This is a common complaint in my household. What
    it often means is that one of my children is feeling stressed and frustrated by
    the other and therefore assumes that the other has deliberately behaved in a way
    to produce this effect. The reality is that often this is not the case: the impact
    of the behaviour is unintentional, but the level of irritation the ‘victim’ is
    experiencing makes any other more innocent explanation seem impossible. We have
    to take great care not to let the emotions we feel function as evidence for the
    truth of our beliefs.


    The following are common examples of emotional reasoning:


    | I feel attacked || ![Image](images/00005.jpeg) || ‘Someone must be getting at
    me…’ |


    | --- | --- | --- |


    | I feel guilty || ![Image](images/00005.jpeg) || ‘I must have done something
    bad…’ |


    | I feel scared || ![Image](images/00005.jpeg) || ‘Something awful is about to
    happen.’ |


    The antidote to emotional reasoning is to recognise that our emotions are not
    reliable guides when it comes to establishing facts. Often our emotions cloud
    our judgement or act as a field of static that make it hard for us to see things
    clearly.


    *   Recognise that your emotions are not necessarily accurate guides when it comes
    to establishing the truth.


    *   Set your feelings to one side and consider what hard evidence there may be
    that supports your conclusions.


    *   Consider other possible explanations.


    *   Ask yourself: ‘Would someone else be reacting to this situation in the same
    way?’


    ### Thinking error 6: blaming


    #### ‘It’s all your fault’


    On the whole blame is a pretty counterproductive pastime. The task of dishing
    out responsibility for what has happened can preoccupy people in a way that effectively
    disengages their problem-solving abilities. When the situation is ‘someone else’s
    fault’ then there is little call to do anything further about it, let alone seek
    to understand the role that one’s own behaviour, feelings or assumptions might
    have played in bringing the problem about. Blame is a dead end cognitively and
    a sure-fire cue for a whole host of destructive emotions such as resentment, bitterness,
    anger and hatred.


    Often blaming others is a defensive manoeuvre for people who are unable to tolerate
    the possibility that they might be at fault in some way. By now you will probably
    recognise that this fear of being flawed is because of a distorted sense of how
    bad it would be to be less than perfect. Scratch the surface of someone inclined
    to blame others and you will often unearth dysfunctional assumptions such as ‘I
    must be perfect and good at all times or people will hate me’ (catastrophising)
    or ‘If I am not perfect then I am useless and unworthy’ (polarised thinking).


    There are some people who err on the other side and have a tendency to make themselves
    overly responsible for the bad things that happen to them and others.


    People who suffer from Obsessive Compulsive Disorder (OCD) – a condition in which
    people attempt to reduce their anxiety by performing rituals like washing or making
    unusual mental rules for themselves – are particularly prone to self-blame. Their
    sense of how awful it would be if they did cause harm often appears to convince
    them that they have or could, even in magical and implausible ways.


    One teenage girl I worked with was convinced that if she did not switch off her
    bedroom light in the right way some terrible illness or accident would befall
    the people she loved. I knew another woman who was convinced that germs she might
    have transferred to a letter were going to make the recipient’s baby sick. She
    fretted about this constantly and became so obsessed with the idea that she was
    unable to sleep at night.


    These kind of examples are extreme, and may seem bizarre to anyone who does not
    suffer from OCD. However, we can all demonstrate a tendency to make ourselves
    responsible for things that may only partially be within our control or even completely
    beyond it. The tell-tale emotion of self-blame is guilt. When we do cause distress
    to others guilt is a natural and appropriate emotion, but if you feel guilty a
    lot of the time for no very good reason then this could be an indication that
    a distorted sense of overdeveloped responsibility or a very negative set of core
    beliefs may be controlling your life.


    ### Thinking error 7: filtering and magnifying


    #### ‘You see! It’s just as I thought…’


    This is an almost universal thought distortion of which we are all guilty at times.
    Filtering, as the name suggests, is when we only attend to information that fits
    with our preconceptions and disregard other equally legitimate information. Magnifying
    is when we exaggerate the importance or frequency of events that fit with our
    current beliefs.


    ![image](images/00003.jpeg)


    Jane is organising a wedding for her best friend. In the middle of the reception
    it becomes apparent that the caterers have mixed up the orders and sent vol-au-vents
    rather than the blinis with salmon and cream cheese that were requested.


