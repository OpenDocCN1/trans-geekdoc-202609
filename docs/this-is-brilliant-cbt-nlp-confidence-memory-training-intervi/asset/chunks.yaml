- raw: "1.  If you are selling something that is far from unique then you will be\
    \ lucky to get a price better than the market value.\n\n2.  If you are buying\
    \ something that isn’t rare then if you can bide your time and buy when some of\
    \ the conditions outlined above are in your favour, you may get a very good price.\n\
    \n3.  If you are selling something rare and desirable you should get a good price.\n\
    \n4.  If you are selling something rare that a few people might want, but you\
    \ are willing to wait, you should aim for a good price.\n\n5.  If you are buying\
    \ something rare and desirable then be prepared to pay a premium (or be prepared\
    \ to live without it).\n\n6.  If you are after something rare of limited desirability\
    \ then the good haggler may do well … keep your nerve and try not to show how\
    \ badly you want it.\n\n### To open, or not to open?\n\n#### The advantage of\
    \ letting your opponent open\n\nGiven that most negotiators are not aggressive\
    \ enough, the chances are that your opponent will open too low when selling, or\
    \ too high when buying. If you then respond with an aggressive counter-offer,\
    \ the bargaining phase is off to a good start.\n\n#### The advantage of opening\n\
    \nConfident negotiators often open because if you aggressively open you can start\
    \ the bargaining phase in a dominant position. If your opponent seems a confident\
    \ personality, then this stratagem is unlikely to work.\n\nThere is no ‘one-size-fits-all’\
    \ advice. The comforting thing is that both opening, and not opening, have advantages,\
    \ so you can maximise the possibilities in either case.\n\n#### If the value of\
    \ the item under negotiation is unclear, try to get your opponent to open\n\n\
    In addition to the likelihood that your opponent will open timidly, there is a\
    \ good chance they will mistakenly value the item too low (when selling), or too\
    \ high (when buying). If your opponent seems inexperienced then this is a particularly\
    \ attractive approach. You will want to prompt them to open by comments such as\
    \ ‘What’s your best offer?’, or perhaps better ‘What do you think it’s worth?’,\
    \ or ‘What would you accept?’, or ‘What’s your budget?’, or ‘You must have some\
    \ idea how much you want/are willing to pay?’\n\n### Opening offers and counter-offers\n\
    \nThis section offers you clear advice on how to pitch your first offer.\n\n####\
    \ The classic opening gambit\n\nThe classic advice is to make your first offer\
    \ or counter-offer as the highest (if you are selling) or lowest (if you are buying)\
    \ figure that is credible. To be brutally honest, it doesn’t matter if your offer\
    \ edges into incredible territory … that is a much less damaging mistake than\
    \ pitching your opening offer too cautiously. There are, however, situations in\
    \ which the classic advice is the wrong advice and I’ll now explain these situations.\n\
    \n#### When you want an auction to set the final price\n\nIf you are selling on\
    \ an online auction site or if you hope to be able to play one buyer off against\
    \ another, then you can open at a knock-down price. This usually attracts multiple\
    \ bidders and sets the best environment for a bidding frenzy.\n\n#### When you\
    \ want a (reasonably) quick sale\n\nThere are two obvious approaches to selling\
    \ something like your house. You can price it just below the market price, which\
    \ almost guarantees a quick sale and you can be quite aggressive in resisting\
    \ pressure to further reduce the price once you have one or more buyers interested\
    \ – indeed you may get multiple buyers bidding above the offer price. Alternatively,\
    \ you can set an optimistic price ‘because I can always reduce the price later’.\
    \ The second method may lead to someone who really wants the house paying your\
    \ price, but usually leads to you reducing the price at a later date, by which\
    \ time your house has missed the buzz of being new to the market.\n\n#### In a\
    \ market bazaar\n\nOpening offers in this situation tend to be:\n\n*   unbelievable,\
    \ and …\n\n*   determined by local custom (often hundreds or even thousands of\
    \ years old).\n\nSo ask someone familiar with local customs for advice … and brush\
    \ up on your overacting.\n\nI am now going to say something that may seem totally\
    \ out of character. If you are a tourist in an under-developed country then you\
    \ have to haggle because to refuse to do so will confuse the trader (at best)\
    \ or be considered rude (at worst). However, please remember that the money involved\
    \ means much more to the trader than it does to you, so don’t compete for the\
    \ lowest possible price – give them an extra bit of profit.\n\n### Summary\n\n\
    The essence of haggling is I want. If you have logical arguments to use to get\
    \ what you want, that is fine, but if you don’t, you need to pit your will and\
    \ skill as a negotiator against your opponent so that you get a better deal than\
    \ they do. If you treat this battle of will and skill as a game, you will be able\
    \ to be very competitive without getting emotional.\n\nWhen valuing an item you\
    \ can either research the prices of similar items, or if the item is unique you\
    \ can search for an analogy to compare it with, consult an expert, sell by auction\
    \ or work out what you would be willing to pay.\n\nWhen buying or selling an item,\
    \ the most important thing to know is when you can be ambitious on price. The\
    \ buying/selling world breaks down into six cases which show how the laws of supply\
    \ and demand will determine when you should be ambitious in your haggling.\n\n\
    If the value of an item is unclear it is best to encourage your opponent to make\
    \ the opening offer. In other situations it is less clear if it is best to make\
    \ the opening offer. If your opponent opens they may well be too timid, which\
    \ will be to your benefit. If you open then you can confidently set the agenda\
    \ on price. This means you can benefit regardless of whether you make the opening\
    \ offer or not.\n\n[![Image](images/00045.jpeg)](http://www.amazon.co.uk/Brilliant-Negotiations-2e-Negotiators-ebook/dp/B00A8N8J2A/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320668&sr=8-1&keywords=brilliant+negotiations)\
    \ \n\n![Image](images/00046.jpeg) \n\nHow you put yourself across to your audience\
    \ is the key. No, you are not expected to be a professional actor but you are\
    \ expected to be a brilliant presenter. You are expected to put on a show because\
    \ that’s what presentations need – a bit of underlining, a bit of drama, a bit\
    \ of swagger and total poise.\n\n| ![Image](images/00021.gif) || ‘Always act confident.’\
    \  \n\nBarack Obama |\n\n| --- | --- |\n\n### But acting can help\n\nDustin Hoffman\
    \ takes his job very seriously. When he was in Marathon Man he had to appear exhausted\
    \ in one scene. Ever the perfectionist, he stayed up all night and arrived on\
    \ the set the next day white, puffy eyed and knackered. Laurence Olivier surveyed\
    \ him in amusement: ‘Why don’t you try acting, dear boy? It’s so much easier.’\n\
    \nAt an event in Bombay in 2009 at a ceremony called ‘The Giants of Mumbai’ (Bombay/Mumbai\
    \ … take your pick) philanthropists and high achievers were honoured for their\
    \ work for the city in front of the local great and good. There was a lawyer,\
    \ educationalist, businessman, academic, broadcaster, doctor and two actors from\
    \ Bollywood, one of whom had arrived to female screams and lots of paparazzi camera\
    \ flashes and clicks. Shahid Kapoor is an actor: 30 years old, very good looking\
    \ and knows it; a rising star. He spoke and here’s my recollection of what he\
    \ diffidently said:\n\n‘I have acquired a certain transient fame … After my last\
    \ film who even knows about that? … But that fame allows me to open doors … I\
    \ want to do that for you … for any of you doing the great work for the poor of\
    \ Mumbai that you do. Thank you for that and for this award. I am here for you.’\n\
    \nWhat film actors have is the knack of speaking well, clearly and straight. Learn\
    \ from them to be confident, poised and a good speaker … it’s a great start. As\
    \ for Shahid, we were all blown away.\n\n![image](images/00004.jpeg)\n\nFirst\
    \ of all learn to speak well – clearly and simply. And learn to respect your audience\
    \ (as well as love them).\n\n### In praise of hard work (in praise of America)"
