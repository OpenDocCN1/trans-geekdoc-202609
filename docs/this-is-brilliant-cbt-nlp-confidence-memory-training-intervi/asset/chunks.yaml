- raw: '6.  Now take a couple of deep breaths to change your state. Wait a few moments
    and then trigger or fire your anchor. Enjoy the intensity of feeling state X.
    Fire it a few more times to get used to it and strengthen it. Make sure that you
    break your state by breathing deeply between each firing. Now you can use this
    anchor any time you want to have the feelings associated with state X.


    You can test the anchor by future pacing. Think about a situation in the future
    where you will want state X. As you run through the scenario in your mind, fire
    your anchor. The key to successful anchoring is the intensity of feeling, the
    timing of setting the anchor and the precision with which you set and fire the
    anchor.


    Just as you can create a positive anchor, you can eliminate negative anchors.
    For example, you may have had a negative experience with someone when you did
    not cope well. You may have had bad experiences at work that are still causing
    you to lose confidence or become frustrated. Your reactions in those situations
    create a negative state that makes your inner resources inaccessible. Even though
    the incident might have happened some time ago, you still carry the feelings associated
    with it and behave accordingly. Your behaviour reinforces your state and forms
    a strong habit, such that, every time you find yourself in a similar situation,
    the limiting behaviour is triggered.


    The following technique uses space and physical location to relieve those negative
    and stressful feelings. You needn’t keep such bad feelings in your memory – you
    can collapse them and, if you wish, replace them with positive feelings.


    ![image](images/00003.jpeg)


    Phil realised, with coaching, that he had deliberately been perpetuating a negative
    relationship with Sarah, his colleague. Whenever they met, he would be in a negative,
    defensive state, which Sarah would pick up on. They would argue and part feeling
    bad.


    Using the collapsing anchors technique, below, Phil was able to establish a new
    way of approaching Sarah to rebuild the relationship.


    ### Collapsing anchors


    1.  Mark two spaces on the floor about 2 metres (6 feet) apart.


    2.  Label one space with a minus sign, the other with a plus sign.


    3.  Stand on the minus sign and bring an unpleasant memory into your mind. Talk
    about the event for a minute or so and check how you feel as you recall the experience.


    4.  Take a couple of deep breaths and walk briskly over to the plus sign space,
    bringing a pleasant memory into your mind and make this more intense than the
    negative feeling. Talk about this experience for a minute or so, paying attention
    to the images and sounds you use to recall the events. Intensify the qualities
    of colour, size, clarity, brightness and volume, then bring the image close to
    you. Bring the image closer and closer and notice how your feelings intensify.
    Hold this feeling for a few moments and then relax.


    5.  Staying on the plus sign, talk again about the earlier unpleasant experience
    and notice how the negative feelings you had before have disappeared. You have
    collapsed the negative anchor.


    #### Anchors in your environment


    Anchors are all around you, causing you to feel a wide range of emotions – happy,
    sad, frightened, jubilant, angry or even nauseous. You may even be an anchor for
    someone else, causing them to respond towards you in a way that you may find confusing.
    Such responses can be either within your awareness, in which case you can connect
    precisely with the incident or circumstances that produced the feelings, or out
    of your awareness, in which case you can connect with the uncomfortable feelings
    but not the memories of the incident or circumstances that caused them. Here are
    some examples.


    Meetings at work often highlight opposing viewpoints and sometimes emotions can
    run high. If not carefully managed, people can leave feeling negative and inadvertently
    anchor that state to any follow-up meetings on the same topic. This can have a
    number of outcomes.


    ![image](images/00003.jpeg)


    As the sales director of a large company, Joe had been attending the same meeting
    on a regular basis, 40 miles from his home, for 2 years. The meeting always had
    the same format and people had adopted their own ways of dealing with the negativity
    that had grown over the years.


    The meeting consisted of a series of reports from various sectors of the business.
    When he first started to attend the meeting, Joe had put forward an idea as a
    result of a presentation by the HR director, but his idea had been ignored. That
    caused Joe to feel that, if he were to offer ideas in the future, the same thing
    would probably happen. Because of that, the very thought of attending the meeting
    put him into a negative state. He never offered an idea again and, when others
    were speaking, Joe would be checking his e-mails on his mobile.


    You could say that by checking his e-mails Joe was making the best use of his
    time in the meeting, if what he believed was really true. No one ever challenged
    him – they just accepted that was what Joe did in meetings, in the same way that
    Mary, the operations director, brought her production analysis sheets and worked
    on them until it was her time to present.


    If no one was listening, what was the point of the presentations? Each director
    might just as well have produced a report and sent it round to their colleagues
    to read in their own time. The amount of high-level management time that was being
    wasted due to a set of anchors which had become engrained in the culture was extraordinary.


    You need to prevent such anchors from taking root if high levels of productivity
    are to be maintained. Some simple steps would be to ensure that very clear outcomes
    for each attendee as well as for the items on the agenda are established, so individuals
    can make an assessment of the value of them attending the meeting. As far as possible,
    breaking routines, such as where people sit, the venue, length and format of the
    meeting, also helps to break negative anchors and keep proceedings fresh.


    ![image](images/00003.jpeg)


    Chris was being coached. Following a number of personal relationship failures,
    he felt that he needed some help to restore his self-belief.


    Things were going great until one day he arrived at the coach’s house and tarmac
    was being laid outside in the driveway. The smell of the tarmac took Chris right
    back to a really nasty experience. The coach used the collapsing anchors technique
    to help Chris to regain his equilibrium.


    Here are some everyday anchors that can evoke different states in people:


    *   music – a happy or sad song playing in the car, in the supermarket or on the
    television


    *   the smell of coffee, freshly baked bread, garlic or any other food


    *   the smell of vomit, hospitals, disinfectant, dog excrement


    *   the scent of perfume and aftershave


    *   a crucifix or any other religious sign – such signs can be strongly anchored
    in belief and evoke strong reactions in some people


    *   images of places, things and people


    *   negative notices in the working environment, such as ‘do not move the furniture’,
    ‘keep out’, and so on.


    Advertisers know full well the power of anchoring – hence the use of music in
    shops to create a certain atmosphere, aromas to entice people into coffee shops
    and restaurants and the suggestion of wonderful relationships resulting from the
    scent of a particular aftershave in television advertising.


    Once you are aware of what you are anchored to in your environment you can choose
    to change your responses. Take some time to notice things and people around you
    that trigger specific responses in you. If you enjoy a particular response and
    it is getting positive results for you, then use the anchoring technique mentioned
    earlier in this chapter to make it even more powerful. If not, then use the collapsing
    anchors technique to rid yourself of it.'
