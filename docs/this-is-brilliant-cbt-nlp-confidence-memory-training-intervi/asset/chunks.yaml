- raw: '![images](images/00038.gif)You work for a company that has been involved in
    secret merger talks with another company. You are aware of this because it is
    your job to know, but you don’t have any authority in these talks, or this deal.
    You are the last person in the office and you get a call from a member of the
    financial press saying that they have heard that this merger is taking place.
    What would you do?


    ![images](images/00039.gif)I would say that they would have to speak to one of
    the directors of the company and that unfortunately none of them was available
    at the moment. I would check the diaries and give them the earliest possible time
    when they could call back. If they pressed me, I would simply repeat my previous
    answer very calmly and very politely.


    ![images](images/00038.gif)You run the research and development section for your
    company and you have one designer in your section who is brilliant at his job,
    but very difficult to work with, unpredictable, bad-tempered and unable to conform
    to the company rules on many occasions. Yet there is no doubt he helps you make
    a lot of money because on a good day his ideas are brilliant. How do you deal
    with this?


    ![images](images/00039.gif)I would have to look at whether we were losing other
    good staff because of him, how likely he would be to join one of our competitors
    if we got rid of him but, most importantly, whether there were things we could
    do to get him to work more effectively as a member of the whole team. I would
    start by talking to him and possibly involving the human resource department in
    this discussion, and together we would all agree clear targets for improvements
    with a specific review period. I might also offer training and support if this
    seemed appropriate.


    ![image](images/00004.jpeg)


    One potential difficulty with this type of question is that you won’t have much
    time to answer. Ensure you get used to taking less time to think by getting a
    friend to confront you with scenarios that they dream up (friends are capable
    of being far meaner than many real live interviewers).


    Interviewers should not ask you questions about sex, religion and politics. Indeed,
    many of these questions are illegal and you will find some advice on this in the
    following chapter. They can, however, ask you questions about current affairs
    and general knowledge. Unless you are facing a particularly devious interviewer,
    these questions are not designed to reveal your political leanings; they are designed
    to test your ability to express your opinion, formulate an argument, defend a
    point of view. They won’t usually pick contentious issues.


    ![images](images/00038.gif)What do you think of staging the Olympic Games in London?


    ![images](images/00039.gif)I think it’s great. I think it will help the economy
    and, if tourism starts to decline as people become more concerned about air travel,
    the games might be just what we need to keep Britain buoyant. If everything is
    finished on time, it will be a good model of how we can meet challenging deadlines.


    ![images](images/00039.gif)I have real reservations about it, even though I am
    a sports enthusiast. I think it may be difficult to justify so much expenditure
    when there are so many other demands on public and private finance. Of course,
    I would not mind being proved wrong on this occasion.


    Here are a few more current affairs questions to give you an opportunity to work
    out your own answers.


    ![images](images/00038.gif)How would you improve the public transport system in
    this town/city?


    ![images](images/00038.gif)What steps would you take to integrate the student
    population more effectively into the local community?


    ![images](images/00038.gif)If you were suddenly given a million pounds to spend
    on improving this town, how would you spend it?


    ![images](images/00038.gif)How would you encourage more young people to continue
    with their education?


    ![images](images/00038.gif)Do you think people should be given incentives to recycle
    their rubbish, or be penalised if they don’t?


    ![images](images/00038.gif)Which story grabbed your attention in the news today?


    ![images](images/00038.gif)What new law would you introduce?


    ![images](images/00038.gif)What current law would you repeal?


    ![images](images/00038.gif)How would you improve the state of the country’s finances?
    (Well everyone is probably thinking about it).


    ![image](images/00004.jpeg)


    Think of questions of your own, especially any that relate to the type of work
    or the area of the economy in which you are seeking work.


    ![images](images/00038.gif)If you were compiling a book of significant world events
    of the past decade, what events would you include?


    ![images](images/00039.gif)I might try to shift the boundaries of your question
    a little bit and say what movements and trends of the past decade have been the
    most significant. In the longer term, I think these might have more influence
    than specific events. I suppose I would include the huge expansion in global communication,
    which seems to be changing so many businesses, and the speed with which information
    about anything can be got around the world. The expansion of Europe and the development
    of China’s economy are likely to have long-lasting effects on world economic trends
    too. Of course, heightened awareness of security issues of all kinds is probably
    significant – the plans to introduce ID cards here in the UK, for example. On
    a personal note, I would like to think that an increasing awareness of environmental
    issues, especially energy consumption, will become a more significant part of
    everyone’s thinking – at national and personal levels.


    (It is OK to include personal comments in questions like this, but you do need
    to exercise caution. You would not make the same comments about global warming
    to an environmental pressure group as you would to an oil company.)


    ![image](images/00004.jpeg)


    If you want to make the right impression, it is especially important to be prepared
    for this type of question if you are going for a job in the media, policy development,
    lobbying, etc. You may also find you face this type of question related specifically
    to your own profession, e.g. education, health, the environment, the legal system,
    etc., so consider carefully the issues and talking points within your profession.


    ### That was mean


    There are some interviews where it is not so much the questions that hit a raw
    nerve with you, but problems about the interview itself: silences, questions you
    just can’t answer or aggressive interviewers.


    Silence may be golden – it may be a beautiful thing on a deserted beach under
    a starry sky – but it loses its poetry and magic when it causes an embarrassing
    void in the flow of an interview conversation. To make matters worse, not all
    interview silence is the same kind of silence. There is the silence that means
    you have not got a clue what to say; the silence that means you know what the
    interviewer is getting at, but it is an awkward question and you need time to
    think about it; or the silence where you believe you have given a thorough, cogent
    and complete answer and yet your interviewer lets you down – he or she does not
    respond with the next question. In all three instances, resist the temptation
    to tell a joke, sing a song or rush out of the room in tears; there are more effective
    ways to deal with the situation.


    If you really don’t know the answer to a question, then you should say so. This
    problem is most likely to occur if you are being asked technical/professional
    questions that you do not know the answers to at this stage, or if you are being
    asked to provide factual information of some kind.


    ![images](images/00039.gif)I am sorry, but that isn’t an area I am familiar with
    at present, so I can’t really give you any details on that.'
