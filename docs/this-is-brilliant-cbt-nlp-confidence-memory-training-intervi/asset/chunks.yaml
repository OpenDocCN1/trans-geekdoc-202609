- raw: 'Put simply – if you don’t get what you want, you’ll probably feel sorry for
    yourself and perhaps frustrated. That’s not great but it isn’t the end of the
    world – you should still be able to overcome this with self-discipline. However,
    if you don’t get what you need, you’ll come to a grinding halt.


    #### Personal motivators


    Opposite is a list of ten aspects of life that people feel are important to them.
    Look through them and think about them in terms of what you need in life, not
    so much in terms of what you want. Most people know themselves well enough to
    be able to differentiate between the two. Then rank each aspect of life in terms
    of its importance to you; mark the most important as 1 through to the least important,
    10. If you want to discuss your answers with someone else, don’t do this until
    you’ve completed it, otherwise they might distract you from your personal thoughts.


    \_\_\_\_\_  Enjoyment


    \_\_\_\_\_  Interesting work


    \_\_\_\_\_  Religion


    \_\_\_\_\_  Salary


    \_\_\_\_\_  Personal development and learning


    \_\_\_\_\_  Recognition and appreciation


    \_\_\_\_\_  Job security


    \_\_\_\_\_  Family


    \_\_\_\_\_  Ambition


    \_\_\_\_\_  Friends and relationships


    Each individual is different; understanding which of these aspects of life are
    most important to you personally is essential. Knowing this will help you to get
    your true priorities in order. You’ll have a clearer focus and you’ll be able
    to shape your life to accommodate it. If you don’t know what drives you and keeps
    you motivated, you can’t aspire to it and you can’t provide it. If you can’t provide
    it, you’ll end up in a downward spiral. It’s impossible to maintain a positive
    mindset if you’re not getting what you need in life to keep you enthusiastic and
    motivated.


    Most people have a rough idea of where their orientation tends to be. Be careful
    though, don’t make any presumptions – you might be surprised to find that, deep
    down, you need something different to what you originally thought; therefore it
    could be that you’re not getting it – simply because you didn’t know you needed
    it. Your mental attitude will suffer if this happens.


    When you reflect on the list, consider it in the light of the most important motivators
    you’ve identified as being the things you need and the less important being the
    things you want (or perhaps even don’t want in some cases). Focus on the motivators
    at the top of your list – they’re the things that really matter to you; the things
    you really need. Now ask yourself if you’re getting them. If not, why not and
    what do you need to do to change?


    It’s just as bad to feed yourself constantly with something you don’t actually
    need. That would be like putting unleaded petrol in a diesel engine. Yes, you’re
    re-fuelling the car but watch out, you’ll cause some serious damage; ultimately
    your engine seizes and you break down. It’s also a huge waste of time and effort
    – time you could have spent filling up with the right fuel and getting to where
    you want to go.


    ![image](images/00004.jpeg)


    To feel confident, it really helps if you feel motivated and positive about life.
    To feel motivated, you need to know what makes you tick.


    ### Handling conflict with confidence


    One common denominator between self-confidence at home and at work is interpersonal
    conflict. Conflict is a natural phenomenon. You can reduce the chance of it happening
    but you’re never going to get rid of it completely. So, it happens. If dealt with
    calmly, it can in fact be a positive thing.


    It can help you to:


    *   clear the air


    *   clarify what the other person is thinking


    *   put your point of view across


    *   discover a better way of doing something.


    It doesn’t matter if you’re having an argument at home with a friend or member
    of your family or you’re having a disagreement at work with your boss or a colleague:
    the same rules apply to dealing with conflict.


    There’s an art to dealing confidently with conflict. Just as an army needs a strategy
    to win a battle, so, on a more tactical level, do you need tactics to deal with
    a personal skirmish. We all encounter these skirmishes from time to time, some
    of us even on a daily basis. But how do you normally react? You’ll probably tend
    to react in the same way each time; that’s because you have your own instinctive
    way of dealing with conflict.


    If you’ve started to use some of the tips covered so far in Brilliant Self Confidence,
    you should find that the number of conflict situations you encounter has started
    to reduce. For example, the simple act of adapting your communication style should
    make a huge difference to your relationships at work, at home and socially.


    #### Your instinct


    Have you ever thought constructively about how you instinctively react when someone
    criticises you, says you’re wrong, frustrates you or winds you up? Some people
    come out of their corner fighting every time, even when they think or even know
    the other person is right. Other people will just give in or avoid the conflict,
    even when they know the other person is wrong. What do you tend to do?


    The conflict zone chart ([Figure 8.4](#part0007_split_001.html#ch8fig4)) shows
    two conflict handling extremes. Some people will ‘contest’ regardless of the situation;
    others will just ‘give in’. Look at the chart and put a cross on the line between
    ‘contest’ and ‘give in’ to show where you think your instinctive approach to conflict
    falls.


    So you’ve drawn a cross somewhere on the line. Most people assess themselves correctly
    in terms of their leaning but some people find it difficult to judge the degree
    to which they lean; in other words, the strength of their style. To help with
    this, go to [www.thinkconfidence.com](http://www.thinkconfidence.com) and complete
    the Think Confidence Conflict Style Questionnaire. It’s a simple questionnaire
    that helps you to identify your instinctive conflict style and the degree to which
    you use it.


    ![Image](images/00028.gif)


    Figure 8.4 The conflict zone


    Some people score themselves at one or the other of the extremes; others see themselves
    falling in the middle. This middle ground is the area of ‘compromise’. You might
    think that to compromise is the right approach regardless of the situation; the
    solution that suits both people. Well that’s true, but not all the time.


    You might also think that to be at one or the other extreme is wrong; after all,
    to ‘give in’ can’t ever be right, can it? Well yes, in certain situations, it
    can. Equally, at the other extreme, some think that to ‘contest’ an issue strongly
    and to insist you’re right could be construed as ‘over-doing it’. Try not to think
    like this either; as long as you aren’t aggressive or violent, contesting an issue
    can also be right in certain situations. The key is to have the self-discipline
    and confidence to choose the right approach for the right situation.


    ![image](images/00003.jpeg)


    Rob


    Rob was organising a weekend trip to France with a group of five friends. They’d
    arranged to meet in the local pub one evening. The aim was to discuss and agree
    where they’d stay, how many nights they’d stay for and what the travel arrangements
    would be. Everyone had agreed that Rob would be the best person to coordinate
    the trip because he’d been to France the year before on a similar trip with other
    friends. Rob was happy to be in charge.


    The meeting started off well. They were all good friends and had known each other
    for some time. There was, however, one person in the group who was more outspoken
    than the rest and throughout the evening tended to dominate the conversation.
    Rob found this odd because during the course of the evening it transpired that
    this person (Lynda) had never even been to France before!'
