- raw: '#### Rule 1 – Don’t go into a haggling session unprepared


    The single most important piece of homework is to know all the reasons why you
    should get a good deal – for example, if you are buying, what prices are being
    quoted on the Internet. One specific item of preparation you must do is encapsulated
    in the next rule.


    #### Rule 2 – Set yourself a really challenging objective


    There has been loads of academic research on negotiations, and time and again
    this research shows that the more challenging your objective, the better you will
    do. The more challenging your objective, the more competitive you will be in the
    haggling session.


    #### Rule 3 – Be clear upfront what you want


    It is much better to state clearly upfront what you want, rather than to keep
    slipping in new conditions as you go along. It is another example of the universal
    KISS principle – Keep It Simple, Stupid! This doesn’t mean that you shouldn’t
    be flexible if your opponent offers you an attractive alternative to what you
    originally asked for.


    #### Rule 4 – Haggling is a game


    Haggling is a battle of wills, and the best way to be very competitive, but remain
    unemotional, is to treat it as a game.


    You will often be up against someone who has been trained to haggle, or who may
    be part of a culture with over a thousand-year history of haggling. They will
    expect you to haggle, and in extreme cases they will be offended if you do not
    play the game.


    #### Rule 5 – You do not have to be reasonable


    Many bargaining strategies are based on rational arguments. When haggling you
    know that your opponent wants to get things out of the negotiation, and your objective
    is to minimise what they get so as to maximise what you get. It is a battle of
    wills where your objective is to convince your opponent that the only way to conclude
    a deal is to agree with one of your offers.


    ![image](images/00004.jpeg)


    I want … and if I don’t get what I want then I will go elsewhere.


    #### Rule 6 – Be rational if it suits your cause


    Throw in logic whenever it supports your position. Comments such as ‘I can get
    it cheaper on the Internet’ can be deployed whenever it suits you. As the next
    rule states, you can even use false logic.


    #### Rule 7 – Bluffing is absolutely fine (but try not to get caught out)


    ‘I can buy something similar for £12,500’ is almost impossible to disprove. Bluffing
    is an acceptable (but dangerous) strategy in bargaining. Bluffing is totally acceptable
    in haggling, and although you should try to avoid getting caught, you should look
    totally unembarrassed if you do get caught out.


    #### Rule 8 – A bit of overacting never hurts


    ![Image](images/00043.gif)


    A bit of overacting never hurts


    In this game, a bit of overacting will almost always be acceptable. I suggest
    you work on your look of complete astonishment – to be used when you hear your
    opponent’s opening offer. Often the experienced haggler will overact with a touch
    of humour.


    #### Rule 9 – Many questionable bargaining practices are acceptable


    In the next chapter I draw boundaries as to what techniques are acceptable. For
    example, blatant use of your negotiating power (leverage) is seldom acceptable
    as a bargaining tactic, but is fine in haggling.


    Borderline tactics such as ‘nibbling’ are also OK – nibbling is where you appear
    to have agreed a deal and then come back demanding additional sweeteners: ‘You
    will throw in a full tank of petrol, won’t you … surely you aren’t going to lose
    the deal over a tank of petrol?’


    #### Rule 10 – Use every bit of leverage you have


    If you have a strong, credible walk-away scenario, then make sure your opponent
    is very aware of it, for example, ‘If you cannot sweeten that deal then I will
    go back and see if your competitor can do better.’


    If it is credible, then strongly encourage your opponent to think about the chances
    of future business from you. Likewise, if you are a regular customer then play
    that up for all it’s worth. If you have friends to whom you may pass on a recommendation,
    that is worth mentioning. Phrases such as ‘I work for the biggest employer in
    the town, so lots of people will get to know if I am happy with your service’
    can work well.


    #### Rule 11 – Take your time


    Realising that haggling is a game, you may be tempted to short-circuit the process.
    For example, you may say something silly like: ‘We know we are going to end up
    agreeing on £15,000, let’s just shake hands.’ Bad tactic! £15,000 will be taken
    as your current offer and your opponent will work on improving from this position.
    You cannot hurry the process, so relax and enjoy it.


    #### Rule 12 – Never reveal your budget


    If your opponent is an experienced negotiator they will try to get you to tell
    them what your budget is. Keep your budget to yourself because as soon as your
    opponent knows what it is, you can be sure they won’t let up till they have extracted
    the full amount from you.


    #### Rule 13 – Don’t be fooled into meeting them halfway


    If your opponent offers to meet you halfway, then take halfway as their current
    offer and continue haggling from there.


    #### Rule 14 – Make smaller and smaller concessions


    Psychologically you want to indicate that you are reaching the end of your flexibility
    by making your concessions decrease towards zero. For example, in the motor trade
    a salesman may indicate the end of his concessions by saying something like: ‘Well
    I could throw in mats and mudflaps.’


    The next rule is the flipside of this technique.


    #### Rule 15 – Consider breaking through the other side’s preferred ‘best offer’


    Your opponent will often apply Rule 14 to you so you will get a clear idea of
    what appears to be their best offer. You may decide that it is acceptable, or
    you can try to break through this offer to see if there is a better offer to be
    had. There is nothing to be lost (but your time) by trying to break through what
    they are signalling is their best offer. The following are some possible techniques:


    *   ‘That is more than I am willing to pay. The highest I will offer is £13,500,
    and I will shake your hand on that figure now.’


    *   ‘We are clearly not going to be able to do a deal. I will see if I can get
    a better deal elsewhere’ or ‘I need to talk to my wife/husband because this is
    much more than we wanted to pay’ … you then leave them to stew for a period of
    time and come back at a later date to see if they are willing to move.


    *   ‘I am a cash buyer who can do a deal right now, you are going to have to do
    better than that’ … or maybe ‘a lot better than that’.


    *   ‘Can I talk to your boss?’ … often if you can change the person you are haggling
    with, your new opponent will be willing to make concessions to show that they
    have the authority and skill to do a deal.


    If you think they are really not going to move much then maybe, ‘That’s quite
    an attractive offer, and if you will throw in an extended warranty (or something
    else you want) then I will do the deal.’ Or maybe, ‘If you are willing to pay
    the postage then I will accept your price.’ As you can always decide in the end
    to accept their original offer there is usually nothing to be lost by having a
    go.


    #### Rule 16 – Silence is a great tactic


    People find silence very uncomfortable and there is no better way that you can
    politely apply this amount of pressure. Just sit there silently appearing to mull
    over what the other side has offered and frequently your opponent will sweeten
    the deal for you.


    #### Rule 17 – If you can get an auction going then do so


    If you are buying and you have more than one potential supplier, or if you are
    selling and have more than one person interested in buying, then you should play
    one off against the other(s). There is nothing like an auction for getting the
    best deal … competing buyers and sellers often get carried away in the desire
    to win the deal.


    #### Rule 18 – Timing is crucial'
