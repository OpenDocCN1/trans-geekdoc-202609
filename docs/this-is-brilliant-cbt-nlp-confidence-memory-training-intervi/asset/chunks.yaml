- raw: "*   Enjoy being a bit dramatic: You know where you are, why and to whom you\
    \ are talking. You have a good, simple, strong story and the logic is sound and\
    \ bombproof. The slides are coming along nicely. Yet you need to impart some surprise\
    \ or ‘oomph’ into it at, say, two points so that you stand out from your colleagues\
    \ (in other words your competitors) and so that the audience remembers your message.\
    \ Vivid recollections of mine focus on disasters: in the old glass slide days\
    \ when the slide projector caught fire and the slides melted in front of us so\
    \ that ‘why we shall succeed’ dripped into the reproachful word ‘succ’, which\
    \ slowly blackened and disappeared; the slides that had been fed in back to front,\
    \ making it look as though the presentation was in an eastern European language.\
    \ Think of what you most want your audience to remember and then brainstorm a\
    \ solution that dramatises the point. It could be a huge word on the screen, a\
    \ piece of animation or video or soundtrack, a great quote – or you could remove\
    \ your jacket, tie and shoes, saying ‘This is about removing excess cost and baggage.’\
    \ Whatever. It’s about finding just one moment when you go for a bit of dramatic\
    \ emphasis.\n\n*   Don’t be too mechanical: Breathe life into your stuff. On the\
    \ road to brilliance you have to learn to make what you say attention-grabbing\
    \ and interesting. When you stand up, you have to look as though you care. You\
    \ have to breathe life into the case you are making. You have to be passionate\
    \ for your cause. You have to be (and be seen to be) glad to be doing your presentation.\
    \ I was recently at an event celebrating an AFRUCA anniversary (Africans Unite\
    \ Against Child Abuse). While there, I reflected how much better the Africans\
    \ were at demonstrating passion, sincerity and involvement. The reason, I suspect,\
    \ that so few leaders currently come from the UK is that we are hopeless at being\
    \ extrovert – unlike the South Africans, Zimbabweans, Australians, Americans,\
    \ French, Italians. So when you get up there give it some ‘welly’. Be animated\
    \ – look and sound dynamic.\n\n*   Practise, practise, practise: You will need\
    \ technical run-throughs and you will need to know your material very well. Also,\
    \ the situation may be changing, which means you may have to be nimble-footed\
    \ enough to change parts of your presentation at the last moment. But most of\
    \ all you must leave yourself time to explore performance – to work on pace, on\
    \ pauses, on the louder and on the softer bits. Don’t imagine that any good performance\
    \ you’ve ever seen wasn’t very well practised. They say Steve Jobs took weeks\
    \ working on some presentations. Practise alone so you get used to your own voice.\
    \ Don’t do what some have attempted – editing and moving material around while\
    \ actually performing. This is nerve-racking for technicians and rotten for the\
    \ performance – what you have when you start is what you go with. Do at least\
    \ two trial runs: the first is what I’d call a ‘walk-through’, just to make sure\
    \ all the elements sit together; then a ‘run-through’ which is a rehearsal with\
    \ feeling. Mark up your script with cryptic notes and dream the performance in\
    \ slow motion. Have a plan B – there could be a power cut or a fire, maybe hardly\
    \ anyone turns up, maybe you are the only speaker standing because of dodgy pasta\
    \ at dinner that you alone missed because you were rehearsing. There is no substitute\
    \ for maximising your chance of success through practice.\n\n![image](images/00004.jpeg)\n\
    \nIf you’re on stage we have no place for being shy. Aim for a power performance\
    \ with loads of feeling, thoughtfulness and confidence. Everyone can be really\
    \ good. It just needs hard work and a lot of thought. Nearly all brilliant presenters\
    \ are made, not born.\n\n![image](images/00010.jpeg)\n\nA bit of theatricality\
    \ is vital if you want to be brilliant. Even if your performance is controlled\
    \ you are still on stage and you have to fill that stage. You are not there to\
    \ talk or to read a script – you are there to command attention, engage people\
    \ and convince them about your story. Tom Peters and Jim Collins have been engaged\
    \ in an energetic debate about styles of leadership. The former advocates executives\
    \ to be charismatic, noisy, short-term and disruptive; the latter is all for quiet,\
    \ reserved, process-driven, data-rich, team-building and long-term.\n\nEach has\
    \ a point. We probably need both but, arguably we don’t have a ‘long term’ any\
    \ more – we have now. And if you’re on stage we have no place for the ‘quiet man’\
    \ – remember Iain Duncan Smith, one-time leader of the Conservative Party in the\
    \ UK? Aim for a powerful performance with lots of feeling and loads of confidence.\
    \ But, back to Iain Duncan Smith for a second. I recently saw him perform at a\
    \ small gathering talking about poverty in the UK and the role of welfare. He\
    \ was very funny … proving his credentials as a human being up front and then\
    \ without notes, he gave a brilliant exposition. He really knew his stuff and\
    \ spoke persuasively and with supreme confidence.\n\nThe ‘quiet man’ had transformed\
    \ himself into a brilliant presenter – yes, it can be done.\n\n[![Image](images/00048.jpeg)](http://www.amazon.co.uk/Brilliant-Presentation-3e-presenters-ebook/dp/B00F0LMEAI/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320718&sr=8-1&keywords=brilliant+presentation)\
    \ \n\n![Image](images/00049.jpeg) \n\n### Getting started\n\nSo you’ve dressed\
