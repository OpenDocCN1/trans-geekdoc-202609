- raw: 'Now let’s put this psych stuff into what happens when you meet someone that
    you are interested in for the first time, especially if you find them attractive.


    We can express this graphically:


    ![Image](images/00015.gif)


    Graph 1 suggests that you are slightly anxious to make a great impression on the
    person. You begin somewhat nervously but grow in confidence. Then, say, about
    halfway through you have difficulty maintaining your most alluring and attractive
    self (male or female); your nervousness returns and your ‘performance’ drops.


    Graph 2 shows the effect of primacy and recency in the person to whom you are
    attracted. They remember your first and last impression.


    Graph 3 combines Graphs 1 and 2. Unfortunately, as you can see, when you were
    at your most sparkly your behaviour is not being registered as significantly as
    that at the start and end of the encounter.


    ![Image](images/00004.jpeg)


    When you plan to meet or introduce yourself for the first time, make sure that
    not only do you plan your ‘approach’ but also your ‘retreat’ to ensure you have
    created the best first and last impression that you can.


    First we will cover briefly those things that we cannot do much about, mainly
    because we recruited the wrong grandparents. Here we are reflecting on the bodies
    we were blessed with unless, of course, we indulge in artificial help – and many
    of us do!


    Unfortunately for the political correctness and equality brigade, looks do count.
    Research paper after research paper shout from the academic journals that ‘beauty
    is best/better/good/significant/successful’.


    Those not so blessed have, in the past, blamed this obsession with looks on the
    media – who constantly bombard us with photo after picture after photo of the
    fortunate 5 per cent of the population that fall into this category. Not so, says
    research. ‘If the world were to eliminate every magazine and media form containing
    images of youthful, flawless bodies, we would still create and desire these images
    in our minds’, says Harvard psychologist Nancy Etcoff.[⁶](#part0006_split_001.html#ch3ref6)
    We are the descendents of those who chose physical beauty.


    So, if we are to believe the evolutionary psychologists, we have to face facts:
    beauty/handsomeness is better.[⁷](#part0006_split_001.html#ch3ref7) Those who
    were given the beauty pills at birth enjoy a much better life than the rest of
    us. You fly in the face of reality if you do not accept that society is seduced
    by attractiveness. Beautiful people invite more interpersonal attention – whether
    male or female. If you want to surprise an exceptionally attractive person, ignore
    them and flirt with their friend; as they expect to be the centre of interpersonal
    attention or admiration,[⁸](#part0006_split_001.html#ch3ref8) their response is
    interesting.


    Should you have done something inappropriate at work or socially, the more attractive
    you are the less blame is attributed to you.^([9](#part0006_split_001.html#ch3ref9))
    If you have been criminal, you might get a lower prison sentence.^([10](#part0006_split_001.html#ch3ref10))


    Enough. Enough about things that 95 per cent of us cannot do anything about and
    let’s move on to things we can.


    ### Propinquity


    In psychology, propinquity is a very old concept going back to the 1930s^([11](#part0006_split_001.html#ch3ref11))
    and, like most of social psychology, once you have thought it through it is obvious.
    Simply stated, the more time we spend with another the more they are likely to
    like us and we them.


    In industry there is now a movement called ‘The Allen Curve’^([12](#part0006_split_001.html#ch3ref12))
    – this is that rather than having people in separate offices, they work in a large
    open-plan space. Propinquity is at work here, too, because the employees talk
    to each other rather than use technology to communicate, and performance is improved.
    There are variations on the phrase but they all demonstrate propinquity: ‘Married
    couples that dine/pray/garden together, stay together’.


    So, if you want to be liked, employ a little propinquity and just let the conversation
    happen and the relationship might bloom. This old adage just might be true:


    ‘Time equals commitment.’


    ### Endogamy


    For most of our history as humans there have been strict rules about who you could
    and could not marry. Although the restrictive and discriminatory laws may be gone,
    we still tend to like people like ourselves in terms of colour, religion, culture,
    social standing – right down to the way we dress and even eye colour.


    So, if you want to be liked and found attractive, be as like as you possibly can
    to your target group or the person with whom you are smitten.


    Even Cicero 100 years before Christ wrote:


    ‘Like readily consorts with like.’


    In 1967 the ban of a mixed marriage between a Caucasian and an African American
    was ruled unconstitutional in 16 states in the USA. We all owe a huge debt to
    Martin Luther King.


    ### Stay around attractive people.


    What we can do is cultivate friendships with attractive people. Patronage has
    a long history and is alive and well today. The same principle operates in attractiveness;
    an unattractive man who has an attractive wife is viewed as more attractive, and
    vice versa. Individuals themselves feel more attractive if they have an attractive
    partner.


    ### Height


    We have spoken of the advantages of height for men elsewhere (see page 98). It
    is well known in the attractiveness stakes that women prefer men who are taller
    than average and taller than themselves. Perhaps this goes back to their ancestral
    preoccupation of desiring a caveman protector for herself and her offspring. Men,
    not surprisingly, much prefer their female partners to be shorter than themselves.[^(13)](#part0006_split_001.html#ch3ref13)
    Imagine how Ms De-Fen Yao from China feels being the tallest living women in the
    world, standing at 7 foot 9 inches (2.3m).^([14](#part0006_split_001.html#ch3ref14))


    If you are height challenged you know that there are other factors that add to
    one’s attractiveness, such as personality, interpersonal skills and power. Also,
    usually you place more effort in the development of these alternative fundamentals.


    ### Hair


    For women, strong lustrous hair^([15](#part0006_split_001.html#ch3ref15)) is an
    indicator of youth, thus explaining all those neotenic models pouting out of adverts
    of coiffeur salons all over the world promoting hair products. Youth, again, is
    one of the reasons it is said that men prefer blondes, as it is less common to
    be a natural blonde after a woman reaches 30 years of age.^([16](#part0006_split_001.html#ch3ref16))
    With the perennial march of time, blonde hair becomes darker.


    Bad hair and skin during medieval times were signs of sickness and this is endorsed
    by today’s medical standards, as poor hair and hair loss can be an indication
    of iron deficiency caused by blood loss, diabetes, thyroid disease and malnutrition.


    Male baldness is not found attractive by some women, particularly younger women.^([17](#part0006_split_001.html#ch3ref17))
    However, if you are follically challenged in the upper follicle department, just
    call to mind Bruce Willis, Dr Phil, Sean Connery and … Homer Simpson (I joke!).


    ### Body shape


    With body shape let us state and start with the obvious.'
  fmt: '

    Now let’s put this psych stuff into what happens when you meet someone that you
    are interested in for the first time, especially if you find them attractive.


    We can express this graphically:


    ![Image](images/00015.gif)


    Graph 1 suggests that you are slightly anxious to make a great impression on the
    person. You begin somewhat nervously but grow in confidence. Then, say, about
    halfway through you have difficulty maintaining your most alluring and attractive
    self (male or female); your nervousness returns and your ‘performance’ drops.


    Graph 2 shows the effect of primacy and recency in the person to whom you are
    attracted. They remember your first and last impression.


    Graph 3 combines Graphs 1 and 2. Unfortunately, as you can see, when you were
    at your most sparkly your behaviour is not being registered as significantly as
    that at the start and end of the encounter.


    ![Image](images/00004.jpeg)


    When you plan to meet or introduce yourself for the first time, make sure that
    not only do you plan your ‘approach’ but also your ‘retreat’ to ensure you have
    created the best first and last impression that you can.


    First we will cover briefly those things that we cannot do much about, mainly
    because we recruited the wrong grandparents. Here we are reflecting on the bodies
    we were blessed with unless, of course, we indulge in artificial help – and many
    of us do!


    Unfortunately for the political correctness and equality brigade, looks do count.
    Research paper after research paper shout from the academic journals that ‘beauty
    is best/better/good/significant/successful’.


    Those not so blessed have, in the past, blamed this obsession with looks on the
    media – who constantly bombard us with photo after picture after photo of the
    fortunate 5 per cent of the population that fall into this category. Not so, says
    research. ‘If the world were to eliminate every magazine and media form containing
    images of youthful, flawless bodies, we would still create and desire these images
    in our minds’, says Harvard psychologist Nancy Etcoff.[⁶](#part0006_split_001.html#ch3ref6)
    We are the descendents of those who chose physical beauty.


    So, if we are to believe the evolutionary psychologists, we have to face facts:
    beauty/handsomeness is better.[⁷](#part0006_split_001.html#ch3ref7) Those who
    were given the beauty pills at birth enjoy a much better life than the rest of
    us. You fly in the face of reality if you do not accept that society is seduced
    by attractiveness. Beautiful people invite more interpersonal attention – whether
    male or female. If you want to surprise an exceptionally attractive person, ignore
    them and flirt with their friend; as they expect to be the centre of interpersonal
    attention or admiration,[⁸](#part0006_split_001.html#ch3ref8) their response is
    interesting.


    Should you have done something inappropriate at work or socially, the more attractive
    you are the less blame is attributed to you.^([9](#part0006_split_001.html#ch3ref9))
    If you have been criminal, you might get a lower prison sentence.^([10](#part0006_split_001.html#ch3ref10))


    Enough. Enough about things that 95 per cent of us cannot do anything about and
    let’s move on to things we can.


    ## Propinquity


    In psychology, propinquity is a very old concept going back to the 1930s^([11](#part0006_split_001.html#ch3ref11))
    and, like most of social psychology, once you have thought it through it is obvious.
    Simply stated, the more time we spend with another the more they are likely to
    like us and we them.


    In industry there is now a movement called ‘The Allen Curve’^([12](#part0006_split_001.html#ch3ref12))
    – this is that rather than having people in separate offices, they work in a large
    open-plan space. Propinquity is at work here, too, because the employees talk
    to each other rather than use technology to communicate, and performance is improved.
    There are variations on the phrase but they all demonstrate propinquity: ‘Married
    couples that dine/pray/garden together, stay together’.


    So, if you want to be liked, employ a little propinquity and just let the conversation
    happen and the relationship might bloom. This old adage just might be true:


    ‘Time equals commitment.’


    ## Endogamy


    For most of our history as humans there have been strict rules about who you could
    and could not marry. Although the restrictive and discriminatory laws may be gone,
    we still tend to like people like ourselves in terms of colour, religion, culture,
    social standing – right down to the way we dress and even eye colour.


    So, if you want to be liked and found attractive, be as like as you possibly can
    to your target group or the person with whom you are smitten.


    Even Cicero 100 years before Christ wrote:


    ‘Like readily consorts with like.’


    In 1967 the ban of a mixed marriage between a Caucasian and an African American
    was ruled unconstitutional in 16 states in the USA. We all owe a huge debt to
    Martin Luther King.


    ## Stay around attractive people


    What we can do is cultivate friendships with attractive people. Patronage has
    a long history and is alive and well today. The same principle operates in attractiveness;
    an unattractive man who has an attractive wife is viewed as more attractive, and
    vice versa. Individuals themselves feel more attractive if they have an attractive
    partner.


    ## Height


    We have spoken of the advantages of height for men elsewhere (see page 98). It
    is well known in the attractiveness stakes that women prefer men who are taller
    than average and taller than themselves. Perhaps this goes back to their ancestral
    preoccupation of desiring a caveman protector for herself and her offspring. Men,
    not surprisingly, much prefer their female partners to be shorter than themselves.[^(13)](#part0006_split_001.html#ch3ref13)
    Imagine how Ms De-Fen Yao from China feels being the tallest living women in the
    world, standing at 7 foot 9 inches (2.3m).^([14](#part0006_split_001.html#ch3ref14))


    If you are height challenged you know that there are other factors that add to
    one’s attractiveness, such as personality, interpersonal skills and power. Also,
    usually you place more effort in the development of these alternative fundamentals.


    ## Hair


    For women, strong lustrous hair^([15](#part0006_split_001.html#ch3ref15)) is an
    indicator of youth, thus explaining all those neotenic models pouting out of adverts
    of coiffeur salons all over the world promoting hair products. Youth, again, is
    one of the reasons it is said that men prefer blondes, as it is less common to
    be a natural blonde after a woman reaches 30 years of age.^([16](#part0006_split_001.html#ch3ref16))
    With the perennial march of time, blonde hair becomes darker.


    Bad hair and skin during medieval times were signs of sickness and this is endorsed
    by today’s medical standards, as poor hair and hair loss can be an indication
    of iron deficiency caused by blood loss, diabetes, thyroid disease and malnutrition.


    Male baldness is not found attractive by some women, particularly younger women.^([17](#part0006_split_001.html#ch3ref17))
    However, if you are follically challenged in the upper follicle department, just
    call to mind Bruce Willis, Dr Phil, Sean Connery and … Homer Simpson (I joke!).


    ## Body shape


    With body shape let us state and start with the obvious.

