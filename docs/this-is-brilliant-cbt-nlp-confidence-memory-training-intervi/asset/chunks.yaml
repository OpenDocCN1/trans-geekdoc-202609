- raw: 'With a bit of creative thinking you can write sentences that represent long
    sequences of numbers. There’s a technique called the Word Length System in which
    you simply choose words with particular numbers of letters, then weave them into
    memorable sentences and stories. Zero is a bit of a problem, but you can solve
    it by using a ten-letter word or including some other agreed detail – maybe just
    a word beginning with z. To learn the serial number on your bike, 45597, you might
    use a memorable phrase like: ‘lock every night, defeating thieves’. ‘Contains
    my precious yesterdays’ could be how you remember the combination lock on your
    secret diary: 8280.


    #### The Major System


    French mathematician and astronomer Pierre Herigone invented this memory system
    back in the 1600s, but it’s been developed over the centuries and used by people
    all around the world. The idea is that each digit is represented by a designated
    consonant or consonants, which can be turned into words and phrases by including
    the vowels of your choice. And once you’ve got meaningful words to work with,
    rather than tricky, abstract numbers, the rest of your memory skills can do their
    thing.


    The most common version of the Major System looks like this:


    0: s, z or soft c: z is the first letter of the word ‘zero’, and the other consonants
    here sound similar.


    1: d or t: like the number 1, these letters both have one downstroke.


    2: n: like 2, it has two downstrokes.


    3: m: this time both the number and its letter have three downstrokes.


    4: r: the last letter of ‘four’; and 4 and R are almost mirror images.


    5: l: in the system of Romal numerals, L stands for 50.


    6: j, sh, soft ch, dg, zh and soft g: a handwritten j looks like a 6 – and g like
    a 6 upside down.


    7: k, hard c, hard g, hard ch, q or qu: there are two 7s in a K.


    8: f or v: a handwritten f looks like an 8, and v sounds similar.


    9: b or p: b looks like 9 rotated, p could be a mirror-image 9, and the two letters
    have a similar sound.


    The Major System is phonetic: sound-based. Spellings don’t matter because it’s
    the consonant sounds of a word that give you its number code.


    So the number 974190 could be learnt as BiG ReD BuS.


    Castle holds the numbers 705 (CaSL).


    To remember that your car is parked in bay 31 you might picture it covered in
    MuD.


    To learn the first eight digits of Pi, you could use the Major System to give
    you MeTeoR TaiL PiNK: 3.1415927.


    ![image](images/00004.jpeg)


    Don’t get confused by double letters. The real word you’ve chosen may need them
    to be spelt correctly, but if they make one sound they should only represent one
    number. For example, the word bliss would be used to remember 950, not 9500. For
    9500, blue seas would work perfectly. Kill is 75, not 755; but 755 could be Kill
    Lee.


    The Major System takes a bit of learning but it’s a very powerful way of memorising
    specific numbers, allowing you to create strong images and to connect them directly
    to your subject matter. It can be a bit complicated and time consuming for everyday
    number learning, but it’s great for longer numbers – especially the ones you want
    to learn long term.


    To see if the Major System might work for you, try using it to memorise the following
    information.


    Remember the key steps:


    *   Turn each digit into a consonant from the list.


    *   Group the consonants into real words, inserting vowels as necessary.


    *   Create strong images for the words you’ve chosen.


    *   Find ways to link these images with the numbers you started with.


    Your new fridge can’t be wider than 67 cm.


    The antique vase was made in 1743.


    Your mother-in-law’s birthday is 24/11.


    The catalogue code for your new television is 349658302.


    And what about the other way round? See how quickly you can change the following
    images back into the numbers that count.


    Every time you press the buttons on the security door at work, you imagine hearing
    an EVIL LION. So, what’s the code?


    Think what would happen if you had NO PROOF that your credit card actually belonged
    to you. What’s your PIN?


    When you want to phone your friend Alice, you think about her wearing an OLD BLUE
    SHEET – so what’s her number?


    (The answers, by the way, are 8552, 2948 and 519561.)


    ![image](images/00034.gif)


    If you need to remember lots of two-digit numbers (like birth years, Bingo calls,
    football squad numbers) or long number sequences, it’s a good idea to invest some
    time in developing your own double-digit system. You could easily use the Major
    System’s number/letter combinations to turn every two-digit number into a familiar
    person, giving you a powerful, ready-made image for every pair of numbers, and
    instantly cutting your workload in half.


    You might decide to turn 00 into Steven Spielberg


    01 could be Sammy Davis Jr


    19: Tweety Pie


    36: Michael Jackson


    64: Julia Roberts


    77: King Kong


    It’s great memory training to design and rehearse your own system and then put
    it into practice, turning pairs of numbers into people that can be incorporated
    in any of your other memory techniques.


    #### Number shapes


    This strategy is popular because it’s easy to remember the key images, but they
    can all be extended to provide a wide range of possibilities.


    Each of the ten digits has a main image based on the way it looks. Here’s one
    set of ideas, but you can easily customise it to suit the way you see numbers
    – as long as each image is different from all the others.


    0 looks like a ball


    1 is the same shape as a pencil


    2 could be a swan


    3 on its side resembles hills


    4 might suggest the sail on a yacht


    5 looks like a sharp hook


    6 tipped forward might be a cannon


    7 resembles a lamp


    8 could be a snowman


    9 looks like a lollipop


    You can use these ready-made images for remembering straightforward information
    like:


    ##### House numbers


    Picturing a swan sitting on your aunt’s doorstep holding a pencil in its beak
    would remind you that she lives at number 21.


    ##### Measurements


    Seeing a snowman sailing a boat across your kitchen table would remind you that
    it’s 84 cm wide.


    ##### Statistics


    Imagining a cannon on the banks of the Amazon shooting doves over snowmen playing
    football … would tell you that this river’s length is 6280 km.


    You can also expand the main images to give you more options. As well as being
    a ball, 0 could be any kind of sporting equipment: golf club, tennis racket, bike
    helmet. For 3 you could go beyond hills to think about anything in the countryside:
    trees, flowers, rabbits. The number 6 could be more sorts of weaponry than just
    a cannon: crossbow, slingshot, atomic bomb … Just make sure that any extra ideas
    you pick are clearly connected to a number’s main ‘theme’.


    ![image](images/00004.jpeg)


    For longer sequences of numbers, make it easier to write memory stories by including
    verbs and adjectives as well as nouns. With practice you can create concentrated
    stores of detailed information.


    *   The number 2 could be a bird, aeroplane or kite – or the action of flying,
    floating or gliding.


    *   You might want to visualise 7 as a lamp, torch or candle – or ‘bright’, ‘shiny’
    or ‘hot’.


    *   If you needed to know the security code 2170674, you could tell yourself a
    story about a penguin (2) writing (1) on a glowing (7) golfball (0) and then firing
    it (6) into the hot (7) sea (4). Stretch your creative brain and start turning
    numbers into the most varied, rich and memorable stories imaginable.


    When you know how to handle numbers, you can add them to other collections of
    information.


    ##### Improve your passwords


    Make your passwords more secure by inserting seemingly random numbers. If you’ve
    chosen the password myfriends for your social networking website, and you’re already
    used to visualising a group picture of your friends on the computer screen, you
    could now imagine the person on the left holding a beach-ball (0) and the one
    on the right trying to spike it with a hook (5). Now your password is 0myfriends5:
    much safer!


    ##### Add extra detail to your life planning'
