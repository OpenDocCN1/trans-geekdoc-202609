- raw: 'Everything begins with a thought and that thought will attract similar ones
    until you have a cluster of thoughts. That cluster becomes a pattern of thinking,
    which forms a habit. The habit will then be applied to many different scenarios.
    Scientists believe that the conscious mind is able to cope with only about seven
    pieces of information at any one time and can become overloaded very quickly.
    This means that if you fill your conscious mind with negative thought patterns
    that create negative feelings, you have no room for anything else. By taking control,
    you are exercising more choice over your conscious thinking and, the more you
    do this, the more you will build a reserve of unconscious patterns that work effectively
    for you.


    The first step in taking control is to be aware of how thoughts are generated.
    When you think, you have an internal selection process. If you were to absorb
    everything happening around you, your brain would become overloaded, so you select
    what you consider to be important and ignore the rest. For example, think about
    a conversation you had recently or a television programme you watched – how much
    of it do you remember? Chances are, you will be able to summarise the event and
    expand on the aspects of most interest to you, but you won’t be able to recall
    every word. Your internal selection process has chosen what it wants to retain
    as a combination of images and sounds with the feelings you had at the time. Added
    to this will be some internal dialogue – in other words, what you have said to
    yourself about the situation.


    This is how you represent your unique version of reality – in pictures, sounds,
    internal dialogue and feelings, as well as, sometimes, smell and taste. You capture
    your personal understanding of reality via a combination of your external senses
    and inner thoughts and it is this captured version that you use to make decisions
    and form judgements. This unique perspective of events is called your ‘internal
    representation’ or ‘map of reality’.


    Let’s take a look at these components of your internal representation, beginning
    with the visual sense.


    ### Working with your visual imagery


    Bring to mind a pleasant memory and spend a few moments enjoying it. Capture the
    imagery, then come back to this page when you are ready.


    Describe the image you created. Was it clear? Was it in colour? Did it have a
    frame around it or did the edges fade away? Did it have depth? Was there any movement?
    Was it bright or dark and murky? How about the contrast and detail? How close
    was this image to you and did you project it above or below the horizon? Could
    you see yourself in the image or was the image all around you?


    Just as you can look at the visual details of a photograph or film, you can look
    at the details of the images that make up your thoughts. Those details refer to
    the qualities of the image, but not the image itself. The ability to imagine and
    change those qualities is unlimited. The number of different qualities you can
    work with in your mental imagery will be determined by the amount of practice
    you have had at doing so. Just as you intentionally imagined a pleasant experience,
    the very same process happens hundreds, if not thousands, of times each day to
    represent each thought you are having. Sometimes you may not be aware of your
    mental imagery, but it is there nonetheless and you can use it to good effect.


    ![image](images/00003.jpeg)


    Harriet was having difficulty leaving her work behind at the end of the day. She
    was becoming more and more stressed as the pile just didn’t seem to go down.


    During coaching, we acknowledged that Harriet was very fond of pretty things.
    We asked her to visualise herself at the end of the day wrapping the outstanding
    work up in pretty coloured paper, tying a coloured bow around it and leaving it
    there until the next morning when she could unwrap it and continue with her work.


    Harriet became much more relaxed about her work after that and her productivity
    increased.


    Let’s play around with your visual imagery a little and see how easy it is to
    change, or reprogramme, your thoughts and feelings.


    ### Zap away bad feelings


    It is quite easy to eliminate bad feelings for any situation in which you would
    like to feel more in control or be more confident.


    Perhaps the thought of facing a difficult situation with someone is causing you
    to feel frustrated, tense or low in confidence. At times like these, when you
    are emotionally stressed, you consume a great deal of energy making yourself feel
    bad. Even though you don’t enjoy feeling bad, it may be something over which you
    have had no control in the past. When you are feeling this way, you have entered
    the realm of ‘self-preservation’. As a result, your ability to think rationally
    and make sound decisions is impaired. The goal then becomes one of survival, saving
    face, winning or seeking recognition. You only have to feel that way once or twice
    before a habit, or programme, is formed and then you have set a pattern for thinking
    yourself into bad feelings.


    Eliminate the bad feelings by using the following technique:


    ### Zapping away bad feelings


    Bring to mind a specific time when you were unhappy with the way you felt or behaved.


    Now focus on the image that comes to mind as you first access the memory. Quickly
    send it zooming away into the distance. As it goes, notice that it gets smaller
    and smaller until it disappears completely. It’s just like the starship Enterprise
    whizzing off at warp factor 10 into deep space and, in a fraction of a second,
    disappearing completely from view.


    You can do the same thing with all your images of unpleasant experiences – just
    zap them off into deep space. As you do, notice how much better you feel.


    ![image](images/00003.jpeg)


    John had an away from pattern that was causing him a great deal of stress as he
    predicted all the awful things that might happen to him. He had plenty of time
    to dwell on his thoughts when walking his dog in the mornings. As he did so, his
    head would go down into the internal dialogue position as he told himself how
    awful things were.


    During coaching, we suggested that, while out dog-walking, he might keep his head
    up and notice the scenery around him, visualising all the good things that had
    happened the day before.


    Now exercise your ability to choose something different using the following technique.


    ### Choosing to respond differently


    As soon as you have zapped away the negative image using the technique described
    above, bring to mind a memory with positive feelings attached to it. It might
    be an experience where you were very confident or highly motivated to achieve
    a positive result.


    Now work on the image. Make sure that it is colourful, big and bright.


    When you have intensified those qualities, bring the image closer and imagine
    stepping into it. Take a few moments to absorb and enjoy the positive feelings
    generated by the effect.


    ### Working with your internal audio


    As well as making pictures in your mind, you can replay conversations with other
    people, environmental sounds and music. Do you sometimes replay conversations
    or anticipate a future event and actually hear what people said or might say?
    Your internal audio may or may not be accompanied by images.


    What about your internal dialogue? What do you find yourself saying over and over
    in your mind?


    Your internal voice is very powerful and has a direct influence on how you feel
    at any particular moment in time. A large part of how you feel is reflected in
    the tone of your voice – both your spoken words and those you say to yourself.


    Here’s something to think about. If you were to record all your internal dialogue
    for one day and then play it back, would it motivate you?'
