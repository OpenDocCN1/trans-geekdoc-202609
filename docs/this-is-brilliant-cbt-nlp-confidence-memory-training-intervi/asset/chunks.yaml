- raw: 'The main skill here is not having a fantastic story to tell or even to be
    witty, instead the key to keeping conversations going is to listen carefully and
    ask thoughtful questions.


    When an experiment was carried out that involved a control group meeting a range
    of people in sequence, some of the people asked a lot of questions while others
    virtually did all the talking. Each subject in the control group was asked to
    rate how interesting they thought each person they met was. The surprising result
    was that those who listened more and spoke less were consistently rated as being
    more interesting. To be interesting, be interested.


    ![image](images/00004.jpeg)


    When you are with someone, regardless of whether you are speaking or listening,
    one way to keep engaged is to hold a positive intention towards the other person.
    By this I mean to think about the person in a positive way. While I am not proposing
    that people are telepathic, sometimes our body language reflects our thoughts.
    When there is inconsistency between what you say and your body language then people
    do not believe your words. You will appear insincere.


    The following ten points are worth bearing in mind.


    1.  Listen for key words or information and ask open questions based on the information
    appropriately. For example, if someone says they work at Faber Maunsell, it makes
    sense to ask them what their company does if you are not familiar with it. Sometimes
    details are dropped in incidentally: for example, ‘Last week I dropped my son
    off at university which is near here, feels like I’ve done this journey a thousand
    times.’ Here you have information to kick start a range of questions you could
    ask, about the university, about his son, about the course his son is taking,
    each of which could lead to further conversation.


    2.  There is a fine line between asking questions and interrogation so be aware
    of sharing something about yourself as appropriate and let the conversation flow
    between you. Try to link their stories to your own experience in some way but
    without dominating the conversation.


    3.  Be focused on your intent to share your aims for the conversation early. This
    might be asking plainly ‘Why are you here?’ or ‘How did you decide to come to
    this conference?’, and then sharing your main aims.


    4.  Start with closed questions. If you receive a positive response you can move
    on to ask more open questions that require more than a one-word answer. The quickest
    way to do this is to use one of the following to start your question: what, why,
    how, where, who or when? If the person you are speaking to is particularly shy
    or does not feel comfortable talking with people they do not know, then it makes
    sense to build the conversation gradually.


    5.  If you are in a group, ensure that you make eye contact with everyone and
    do not isolate any particular individual. This can happen sometimes unintentionally.
    A 20-minute reminiscence about old school days or how the office used to be might
    be fun, but probably not for the person who did not go to your school or work
    in your office. Check to see if everyone is engaged and bring in people you feel
    are not included. Normally this can be done in a subtle way, ‘Mike, which school
    did you go to?’ or ‘Was it similar in your company?’ This attention to the individual
    will let the group feel comfortable in expressing their opinions.


    6.  Another tip to keep conversation fresh in a group is to bring in other people
    who can add something or change the direction of the conversation. ‘Hi, come and
    join us, we’re just talking about…’ can open the door to another person to connect
    with.


    7.  Summarise and paraphrase to show understanding. A useful tool to keep conversation
    going is to check your understanding of what the other person is saying. Not only
    does this keep you focused but done in the right way it demonstrates that you
    are listening. This can be done by asking a simple question and then repeating
    back in summary form what you have heard the person say. For example, ‘Can I just
    check I understood that? You have been coming for five years and you have never
    been introduced to the chair of the conference’ would be a neat summary.


    8.  Paraphrasing is using the near exact words somebody uses, and repeating them.
    Normally a few key words are enough. Using a similar example, a paraphrase of
    the statement would look as follows. Statement: ‘I’ve been coming for five years
    but I’ve never been introduced to the chair of the conference.’ Paraphrase: ‘You’ve
    never been introduced to the chair of the conference?’ To avoid the person feeling
    like you are parroting them, it is essential that you do not use the paraphrase
    too often. Done occasionally it is a powerful tool that lets others know you value
    their input.


    9.  The brilliant networker will also listen out for the emotion or feeling behind
    the words being said and check this out with the speaker. Emotion can be seen
    from body language, heard in the tone of voice or be evident in their facial expression.
    Networker: ‘You’ve never been introduced to the chair of the conference. You seem
    upset by that. Am I right?’ Person: ‘Yes – I do feel angry that I’ve never been
    introduced.’ Notice how the networker checked for understanding rather than simply
    saying ‘You are upset’, which may be an incorrect assumption. When reflecting
    back an emotion we are showing empathy with another. This is not the same as agreement
    or sympathy but gives the person the feeling that they are understood.


    10.  Remember that the person you are speaking to has needs and wants. Always
    listen with the intention: ‘How can I assist this person?’ and ‘Who do I know
    that I could connect them to for advice or help?’ Then offer to make the connection
    without pressure but as a genuine desire to help.


    ![image](images/00004.jpeg)


    When you connect people or make an introduction be sure to say more than their
    names. Give them a hook or piece of information that will allow them to continue
    the conversation together: for example, ‘Come and join us’ is OK but ‘Come and
    join us, I’d like to introduce you to Daniel who is here for the first time this
    evening and runs an internet company in Roehampton’ is brilliant. When connecting
    two people you know, highlight any mutual interests that they might have.


    If you read around the subject of emotional intelligence, a term first coined
    by Daniel Goleman, you will see how important the emotions are for making decisions
    even if we know logically we should take another course of action. Brilliant networkers
    are able to build strong emotional links with those they speak to, creating the
    foundations for future relationships.


    #### Be ‘appropriately vulnerable’


    One of the most powerful ways that you can keep a conversation going is by showing
    appropriate vulnerability – sharing your feelings. For example, ‘I’m feeling a
    little nervous. This is my first time at a networking event and I don’t seem to
    know anyone.’ By expressing our vulnerability we express our humanness and make
    it easier for people to relate to us. Often they might be experiencing the same
    feelings as we are and by voicing them we give others permission to do so too.


    #### Be curious!


    Brilliant networkers are generally curious people. While some are experts in their
    field they often have a wide range of interests and friends, and are well read.
    This enables them to start and maintain conversations on a wide range of topics.
    As mentioned at the beginning of the last chapter, brilliant networkers know the
    value of diversity, which opens them up to a wider range of opportunities. Think
    of the process as a Scrabble board and the letters as types of contacts. You would
    never win the game by only using multiples of the same letter. The wider the variety
    of contacts you have, the more combinations available, the higher your chance
    of success.


    ![image](images/00004.jpeg)'
