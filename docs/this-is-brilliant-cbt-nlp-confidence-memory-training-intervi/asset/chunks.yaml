- raw: 'If you are buying a car it is worth finding out when the garage’s accounting
    period ends. Often dealers rely on substantial bonuses from the car manufacturers
    that are tied to specific targets. If the dealer is short of their target, they
    may be willing to sell you a car below its cost price to make their quota. Many
    organisations face similar pressures … there are few companies that aren’t keen
    to make a deal just before their financial year ends.


    There are other obvious timing issues to bear in mind, for example you want to
    buy garden furniture at the end rather than the beginning of summer … and the
    same applies to motor bikes and many other items; but, of course, you want to
    buy cavity wall insulation in the height of summer. If your purchase or sale is
    seasonal, then sell in the high season and buy in the low season.


    Likewise, you may choose a particularly quiet day or time of day to haggle, as
    your opponent is more likely to push that extra yard for a deal if business is
    slack. Alternatively, if you are at an antiques or flea market, then stall-holders
    are often more receptive to haggling at the end of the day.


    #### Rule 19 – If things go wrong after you close the deal you can renegotiate


    It is not at all uncommon after you have concluded a deal that things do not go
    as promised: delivery is late; it’s the wrong colour; it’s scratched; it has faults;
    it breaks down; etc. If things go wrong you are entitled to start haggling again
    for compensation. Most companies do not want unsatisfied customers so will have
    a budget for remedial action to make you happier – but that money is earmarked
    for those who moan … loudly!


    A common mistake a lot of negotiators make in such circumstances is to fail to
    state precisely what they want their opponent to do for them. Making a clear,
    reasonable demand is much more likely to get you a good result. Something like
    ‘it is the wrong colour, either replace it with the specification I ordered or
    pay me £500 to keep the wrong colour’ is the right approach.


    #### Rule 20 – Don’t get emotionally attached to the object of the haggling


    When buying you are much better placed if you are willing to walk away from the
    deal. Try not to get emotionally attached to what you are buying.


    #### Rule 21 – Never get angry


    If a negotiation turns into an argument you are very unlikely to get what you
    want. The only time anger can work is when you are complaining about the delivered
    item when you are trying to get some compensation. If possible you should simulate
    the anger so you remain rational enough to have a clear objective about the level
    of compensation you are after.


    #### Rule 22 – Never be unreasonable


    There is a narrow dividing line between an ambitious offer in a haggle and an
    unreasonable demand. Unless you are in a market bazaar you should stick to the
    credible side of the line.


    #### Rule 23 – Be ready to ‘flash the cash’


    Although I leave the general discussion of closing deals to a later chapter, I
    will single out one great technique. An excellent way to close a deal is to pull
    out a wad of banknotes for the price you want to pay and thrust them into your
    opponent’s hand. You may be surprised how effective this can be in an appropriate
    situation, such as when you are buying something from a private seller.


    ![Image](images/00044.gif)


    Be ready to flash the cash


    The rules of haggling have explained how you can play the game to achieve a great
    deal. But how do you know what is a great deal? The most difficult issues facing
    a haggler are all to do with money. How do you know what is a reasonable price
    to have as your target to close the deal at? Should you make the opening offer,
    or should you invite your opponent to make the first move? If you decide to make
    the opening offer, what price should you open at? If the other side opens, what
    should your first counter-offer be? The remaining sections in this chapter answer
    these tricky questions.


    ### How to value something


    This section is as applicable to bargaining as it is to haggling. It is also applicable
    to the situation where you are going to set a price and stick to it (sticker price),
    or when you are going to set a price and then allow only a small amount of negotiation
    (sticker price plus or minus a bit).


    #### What is a fair price?


    ##### If there is a clear market price then find out what it is


    Time and again I stress the importance of research. By using the Internet, looking
    at printed advertisements, talking to sales brokers (such as estate agents), you
    should get a good idea what the market prices for many items are. If you do better
    than that market price you are doing well.


    What do you do if there isn’t a clearly identifiable market price?


    ##### Valuing a unique item


    Although you may not be able to find a clear market value for an item, you may
    be able to find other ways to determine a value. Say you are selling a company,
    there are a number of guidelines that are widely applied to valuing a company.
    One can buy books, software models, and the like, to assist you in a valuation.
    Many of these tools will value a company on key issues such as market capitalisation,
    or the projected earnings power over some period (say ten years) plus a valuation
    of assets. Assets can be tangible items such as buildings and stocks, or intangible
    but saleable items such as brand names, customer lists, goodwill and the like.
    Other unique items may also have widely published mechanisms to help you value
    them: for example, during the (lunatic) dotcom boom web-based businesses were
    often valued according to the number of hits they got per day.


    There are a number of other techniques for helping to value a unique item:


    *   By analogy: Often you will be able to say this item is worth more/less/the
    same as this other item which sold for a known amount. Talking to an experienced
    estate agent, I found that he heavily used this technique.


    *   Consult an expert: Often the expert uses a mixture of analogy and intuition
    to make their estimate.


    *   Sell by auction: One solution that can be appropriate is to cut out the haggling
    and use an online auction site such as eBay or a physical auction house to sell
    the item.


    *   What would I pay? Obviously you can do this only if you are not too emotionally
    attached to an item, but asking yourself (and your friends and colleagues) what
    they would pay can be very instructive.


    The following points describe how aggressive you can be in the price you wish
    to close the deal at.


    ##### Is it a buyers’ or sellers’ market?


    A classic example of this phenomenon would be a booming property market. If prices
    are rising rapidly then few houses will be sold for significantly less than their
    asking price. In comparison, in a flat or falling market, properties will be susceptible
    to aggressive haggling.


    ##### How are supply and demand balanced?


    If supply exceeds demand then the balance of power lies with the buyer, and if
    demand exceeds supply then the seller holds the whip hand.


    ##### Did the buyer make an unsolicited approach to the seller?


    Using the example of the sale of a company – if a buyer asks the seller to sell,
    rather than the seller putting the company on the market, then the seller is in
    a much stronger position to get a high price.


    ##### Who is under the tightest time pressures?


    The stronger the time pressure someone is under, the less aggressive they can
    be in obtaining the best price. For example, if you are selling bulky items that
    are cluttering up your house, you may decide that it is worth asking competitive
    prices just to clear them out of the way.


    ##### How good is your walk-away scenario?


    If you have a strong walk-away scenario then you will definitely have good leverage
    and you should be aiming to haggle aggressively.


    ##### Know when to be ambitious


    The buying/selling world breaks down into six cases:'
