    Think about your own selling context. What other questions are there that would
    work well for you?


    #### 7 Budget


    There may or may not be a budget for your offering. It is really helpful to know
    what amount has been budgeted and with what timescale. When qualifying, assess
    where a prospect is in their buying cycle. So many salespeople ignore the customer
    buying cycle and just enforce a rigid sales cycle and wonder why they fail. If
    a customer has budget available and is ready to buy immediately, then don’t ask
    unnecessary questions. Just close the deal.


    We were able once to do a deal with an organisation (later to become a key account)
    in which they used their budget for the following year and we invoiced them at
    a later date. They appreciated our flexibility!


    Here are some questions you might consider:


    *   How do you handle budget considerations?


    *   What price range are you considering?


    *   Who is paying for this?


    *   How will the funding for the project be justified?


    ![image](images/00024.jpeg)


    Think about your own selling context. What other questions are there that would
    work well for you?


    #### 8 Momentum/qualifying


    Salespeople sometimes spend too long talking to prospects when there is little
    hope of the prospect buying and where there is no momentum. Ask qualifying questions
    to establish whether this opportunity is worth pursuing.


    Here are some questions you might consider:


    *   What do you see as the next action steps?


    *   What is your timeline for implementing/purchasing this type of service/product?


    *   What constraints do you have in this area?


    *   What further information do we need to discuss before we move this forward?


    ![image](images/00024.jpeg)


    Think about your own selling context. What other questions are there that would
    work well for you?


    #### 9 Extending the relationship


    Of course, questions do not stop when the prospect becomes a customer. Keep on
    asking questions. If they are delighted by you and your service then ask questions
    that will allow you to extend the relationship or cross-sell. Or ask them to give
    you a referral – people will happily do this if they like the product/service
    and like you! Ask for referrals at the height of the gratitude curve – when they
    think you are great and have offered an outstanding service, or when they are
    experiencing the benefits of your product.


    Here are some questions you might consider:


    *   What else are you looking to address in the business right now, or in the
    future?


    *   What other opportunities are there within the business?


    *   Would it be helpful for you to know what else we offer?


    *   Who else do you know in business who might like what we have to offer?


    ![image](images/00024.jpeg)


    Think about your own selling context. What other questions are there that would
    work well for you?


    ![image](images/00010.jpeg)


    So, it is not just about asking random questions in order to tease out answers.
    Brilliant Selling needs to be focused on asking the right questions at the right
    time to the right person. Successful salespeople use similar skills in this area
    to a top business coach – they ask questions that:


    *   are understandable and logical;


    *   work to help the buyer get clarity;


    *   and build momentum.


    Take your time before each sales meeting you have in the future and ask yourself
    which questions are most appropriate. Notice that questions are the answer to
    developing a better understanding of the people you want to influence. The key
    points from this section are:


    *   There are seven principles – be curious, have an outcome, let the conversation
    flow, use open and closed questions, make your questions understandable, identify
    motivations and avoid offending your buyers.


    *   Ask focused questions to identify needs and wants, selection criteria, options,
    reaction to your product/service, the people involved, decision making, budget,
    qualification and how to extend the relationship.


    And, of course, questions are only half of it. If you cannot listen well then
    you will reduce rapport and be unable to take the customer to the next stage …


