    # Our business titles cover all kinds of management and career issues to help
    you get where you need to be.


    This section includes chapters on tough interview questions, negotiations, presentations,
    networking and selling.


    So, if you want to:


    * Deal with awkward questions from mean interviewers

    * Learn how to haggle

    * Give your best in presentations

    * Discover how to strike up conversation with strangers and avoid awkward pauses
    when networking

    * Focus on asking the right questions at the right time to the right person when
    selling your service/product


    ... then read on!


    ![Image](images/00037.jpeg)


    This chapter shows you how to handle any weak spots and tricky issues in your
    career history, awkward questions, embarrassing pauses and mean interviewers.
    Unless you are one of those rare people so annoying to the rest of us, who have
    led a charmed life and found that every decision has turned out well and that
    fortune has always smiled on them, you are likely to have aspects of your past
    (be it poor examination results, a period of unemployment, a patchy work history,
    poor health record, etc.) that you don’t want to be asked about at job interviews.
    Yet you know that, because these issues are part of your history, they are likely
    to emerge from your CV, application form or employment and character references,
    so they are likely to arouse a future employer’s curiosity. Interviewers do want
    an explanation of results or circumstances that appear to contradict other evidence
    of your history and character, and leave them wondering ‘Why?’


    ![image](images/00004.jpeg)


    Remind yourself that you have been called for an interview. You aren’t there just
    to make up the numbers, so whatever drawbacks you think you have, they must like
    what they have seen on paper.


    Before preparing answers to any tricky questions that may be applicable to you,
    you should remember that interviewers ask these things because they genuinely
    want to know. They want to ascertain whether some weak spot was a temporary glitch
    or reflects a more pervasive problem. There is a possible second reason why you
    may be questioned on these ‘Achilles’ heels’ – interviewers know that you are
    likely to feel vulnerable on these and they want to see whether you become hostile
    or defensive, or whether you take the opportunity to use your skills of communication,
    persuasion, analysis and calm reason to offer plausible and convincing explanations.


    ## A brief word about truth


    This book does not promise to offer a rigorous analysis of the philosophical and
    moral place of truth in the competitive jungle of job hunting. It does, however
    offer some common-sense advice on this subject. If you are hiding something on
    your CV and/or during a job interview, you are unlikely to communicate so effectively
    or to be as relaxed and natural as you would like. Things that you have chosen
    not to say, fictional exam results, jobs that you invent or references written
    by your mum to enhance your case may well trip you up. Employers almost always
    take up references before they employ you and if you have to hide the truth at
    an interview, then you have to ask yourself how you are going to keep this up
    if you are the successful candidate. Remember, also, that if an employer finds
    out later that you have not been straight with them, they may use this as grounds
    for dismissal or other disciplinary procedures.


    This chapter covers many of the issues about which candidates feel anxious – and
    some suggested ways to deal with these.


    ![image](images/00003.jpeg)


    Get started by considering this sample question and model answer. This question
    and answer are followed by a quick analysis of what makes that answer a success.


    ![images](images/00038.gif)Do you have any qualifications?


    If you do, then this question won’t make you feel vulnerable; if you don’t, then
    you want to put together a good, open, enthusiastic response.


    ![images](images/00039.gif)My main strength is in practical and relevant work
    experience. I have worked in the hotel sector for seven years and I have taken
    advantage of a lot of in-house training courses. I started as a receptionist as
    soon as I left school: I was impatient to be at work and earning a salary. In
    my current job as assistant manager, I have had experience of dealing with all
    kinds of issues, on the customer side and the human resources side. I would certainly
    be happy to take a relevant qualification if the opportunity arose; I think it
    could help me in the future and it is always useful to take an opportunity to
    step back and look at what you are doing. I don’t feel that having no qualifications
    on paper has held me back so far.


    Why this answer works:


    * It does not avoid the fact that you have no formal qualifications, but it does
    avoid coming out with a surly and forbidding ‘No’.

    * It moves on quickly to demonstrate a commitment to training.

    * It emphasises progress up the career ladder.

    * It does acknowledge a bit of impatience and the possibility of an unwise decision
    in the past.

    * It reassures that this decision has not had dire consequences.

    * It expresses a positive attitude to education and learning in the future.


    Try analysing some of the answers that follow in this chapter to see why they
    work. You can use the same technique when you are devising your own model answers.


    ![images](images/00038.gif)I see that you got very good GCSE results and yet your
    A-level results are poor. What happened?


    ![images](images/00039.gif)I was unsure of whether I wanted to stay on at school
    and do A levels; it was something my parents pushed for, but my heart was not
    really in it. I had become too interested in other things and I just didn’t put
    in the effort I should.


    (A possible follow-up question to this that could easily provoke a defensive response
    might be as follows.)


    ![images](images/00038.gif)Can I take it, then, that if you don’t like something,
    you stop working hard at it? What if we give you a job and you find there are
    parts of it you don’t enjoy?


    ![images](images/00039.gif)I have had a good work record for the past three years
    since I left school and I have had no difficulty in handling routine and repetitive
    tasks during that time. I have grown up a lot since I was 17 and I seem to learn
    better at work, rather than in a school environment. I am doing an evening course
    in website design though, and I am really enjoying that.


    ![images](images/00038.gif)There appears to be an eight-month gap on your CV.
    What were you doing during this time?


    ![images](images/00039.gif)I had been temping for the previous two years and I
    really wanted something with more of a sense of direction. With hindsight, I might
    have done better to wait until I had something permanent before I gave up the
    temporary work, but I really wanted to concentrate on my job search and concentrate
    on it 100 per cent. I wasn’t expecting the job market to plummet so badly during
    that time. I got my act together by doing a short, intensive course in secretarial
    skills and was very pleased to get back into the work environment.


    ![images](images/00038.gif)You only got a third-class degree. We are really looking
    for someone with a good honours degree. Why should we consider you?


    (Remember, whatever they say, they have still chosen to interview you.)


    ![images](images/00039.gif)Of course, I was disappointed – I had hoped for an
    upper second and my first two years’ results indicated that I would achieve this.
    I had a lot of personal problems during my final year which are well behind me
    and sorted out now, but they did affect my result. My individual and group project
    results were good and I think these developed the communication, time management
    and information-gathering skills that I need for this particular post – so I know
    I am strong on useful, relevant work skills.

