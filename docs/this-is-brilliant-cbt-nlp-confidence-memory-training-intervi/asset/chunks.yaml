  trans: "\n\n\n![This is brilliant: 10 Brilliant chapters from 10 Brilliant books](http://www.pearson.com/uk)\n\
    \n## 目录\n\n简介\n\n第一部分：生活\n\n1. 卓越认知行为疗法 – 第 3 章：常见思维陷阱及如何避免（作者：Stephen Briers\
    \ 博士）\n\n2. 卓越神经语言程序学 – 第 4 章：通过思考获得美好感觉（作者：David Molden 和 Pat Hutchinson）\n\n\
    3. 卓越肢体语言 – 第 10 章：肢体语言与吸引力（作者：Max A. Eggert）\n\n4. 卓越自信 – 第 8 章：家庭与工作中的自信（作者：Mike\
    \ McClement）\n\n5. 卓越记忆训练 – 第 8 章：数字与姓名（作者：Jonathan Hancock）\n\n第二部分：商业\n\n6.\
    \ 卓越艰难面试问答 – 第 9 章：你的致命弱点（作者：Susan Hodgson）\n\n7. 卓越谈判 – 第 4 章：讨价还价（作者：Nic Peeling）\n\
    \n8. 卓越演示 – 第 10 章：精彩表现（作者：Richard Hall）\n\n9. 卓越人际网络 – 第 15 章：谈话艺术（作者：Steven\
    \ D’Souza）\n\n10. 卓越销售 – 第 12 章：提出正确问题（作者：Jeremy Cassell 和 Tom Bird）\n\n## 简介\n\
    \n欢迎阅读您的专属电子书，收录了“卓越”系列中最佳章节。无论您是否购买过全球已售出的 150 万本卓越图书中的某一本，我们都选录了 10 本畅销卓越图书中的\
    \ 10 个章节，让您对该系列有所了解，并希望能激励您阅读更多！我们为您挑选了最具启发性和实用性的章节，希望您能学到新知识，在所选主题上更进一步，成为卓越人士。\n\
    \n卓越图书完全以您为中心设计。我们从基础入手，在您需要时，为您提供所需的知识。章节中穿插了各种学习特色，帮助您巩固知识：\n\n卓越技巧  \n\n卓越定义\
    \  \n\n卓越做法与禁忌  \n\n卓越行动要点  \n\n卓越回顾\n\n卓越系列在商业、管理、生活技能、计算机、教学和学习技能等领域共有 150 种书目，因此无论您需要帮助、建议还是灵感，我们都能满足您的个人和职业需求。\n\
    \n# 第一部分\n\n# 生活\n\n我们的生活类图书涵盖各种个人发展主题，帮助您获得灵感并实现目标。\n\n本部分包含认知行为疗法、神经语言程序学（NLP）、肢体语言、自信心和记忆训练的章节。\n\
    \n因此，如果您想：\n\n*   学习如何使用认知行为疗法避免常见思维陷阱\n\n*   使用 NLP 通过思考获得美好感觉\n\n*   了解肢体语言和吸引力的规则\n\
    \n*   提升家庭与工作中的自信心\n\n*   找出记住姓名和数字的秘诀\n\n... 请继续阅读！\n\n![Image](img/00002.gif)\n\
    \n哲学家苏格拉底正坐在雅典城门外，这时有个男人走到他面前。男人说：“我正考虑搬到雅典。在这里生活怎么样？”苏格拉底抬头问他：“我很乐意告诉你，但请先回答我一个问题：你现在住的地方怎么样？”那人回答说：“糟糕透了！那里的人都是背后捅刀子的和小偷。我离开后不会留下任何朋友——只有敌人。”苏格拉底皱起眉头回答说：“好吧，你最好赶快离开，因为在雅典你也只会遇到同样的事情。”\n\
    \n后来，第二个男人走近，他也正考虑搬到雅典。这位老哲学家再次问他关于家乡的经历。那人微笑着说：“我来的地方，人们都通力合作、互相帮助。到处都是善意，你总是受到尊重。”苏格拉底微笑着说：“欢迎来到雅典，你在这里也会发现同样的事情。”\n\
    \n苏格拉底知道，我们的心态决定了我们对世界的体验，他意识到这两个人都会带着他们习惯性的态度、看法和互动方式。正是他们处理信息的方式以及思维中的偏见，很可能和他们所处环境的性质一样，决定了他们生活的质量。\n\
    \n为了摆脱我们很容易为自己建造的精神牢笼，CBT 坚持认为，我们首先需要更加意识到思维中的偏见，这些偏见会让我们陷入困境并感到不快乐。在本章中，我们将探讨一些最常见的思维陷阱，并帮助您更加意识到它们如何持续加剧我们的困难。您将有机会分析自己的思维方式，并学习避免常见思维错误的简单策略。\n\
    \n### 思维错误 1：灾难化\n\n#### “世界末日要来了！”\n\n“我找不到我的钱包……哦不！我肯定是把它落在超市了……肯定有人把它偷了……可能是有人在我从取款机取钱时偷看了我的肩膀，那样他们就知道我的密码，很可能已经把我的银行账户清空了，或者盗用了我的身份……这意味着我这个月付不了账单……万一银行决定收回房子怎么办？我们就完蛋了。我们将流落街头……我怎么能这么愚蠢？”\n\
    \n我们都认识这样思考的人。灾难化是焦虑者的典型特征。它将悲观主义（即认为在任何情况下，坏结果或令人痛苦的结果比好结果更可能发生）与一种极度夸大的威胁感结合在一起。事情不仅会很糟糕，而且会非常糟糕。\n\
    \n不幸的是，灾难化的人很难现实地评估情况的重要性：他们可能会因为相对微不足道的挫折而像遭遇重大不幸一样痛苦。他们不断地将自己投射到充满厄运的未来，让想象力在可怕的场景中肆意妄为。\n\
    \n灾难化的人很少考虑自己可能拥有的应对最坏情况的资源。如果你是这样的人，请问自己：\n\n*   在过去发生过的所有坏事或未来可能发生的坏事中，这件事有多糟糕？\n\
    \n*   如果我别无选择，只能面对这种情况下可能发生的最糟糕的事情，我实际上会怎么做？\n\n*   想想你过去如何处理其他困难。那时什么帮助了你？\n\n\
    ### 思维错误 2：过度概括\n\n#### “事情总是对我不利……”\n\n"
