    ![images](images/00039.gif)That is not an area with which I am very familiar at
    the moment, but I see from your recruitment brochure that you offer a thorough
    induction programme and training opportunities, so I would like to take advantage
    of one of these if I were to be offered a position with you.


    ![images](images/00039.gif)I am not familiar with that legislation, but it is
    something I would make sure I brought myself up to speed on very quickly if you
    were to offer me this job.


    ![images](images/00039.gif)I have never used that software before, but I would
    be happy to do any necessary training either through your training department
    or on an external course if that was more appropriate.


    ![image](images/00004.jpeg)


    Make a good impression by being straightforward, by emphasising your ability to
    find out answers to what you don’t know. Stay cool and confident – it counts for
    a lot.


    Show some of your finer qualities in action, e.g., self-assurance, assertiveness,
    honesty and composure.


    It is entirely acceptable to ask for clarification if you don’t understand a question,
    though do this in a way that does not make your interviewer look silly. ‘I’ve
    no idea what you’re on about’ is not a response that will endear you to your interviewer.


    ![images](images/00039.gif)I am sorry, I am not quite sure what you are asking.
    Could you ask me that question again, please?


    ![images](images/00039.gif)I am not sure where I should start with that. Please
    could you give me a little bit more of an explanation?


    Asking for a few moments to think about your answer can immediately remove the
    anxiety factor from a silence.


    ![images](images/00039.gif)That’s an interesting question; may I have a moment
    or two to collect my thoughts?


    ![images](images/00039.gif)There is quite a lot I could say about that; can you
    bear with me while I think about that for a minute?


    (These responses are fine. Take it that you have overdone it if the interviewer
    goes away, makes a cup of coffee and deals with one or two telephone calls in
    the time you have taken to get your thoughts into order.)


    If you are faced with a situation where you think you have given a complete answer,
    but a silence ensues because you are not asked another question, then you can
    always say:


    ![images](images/00039.gif)Is there anything you would like me to add?


    ![images](images/00039.gif)Should I go on to tell you a little about how my previous
    job gave me some useful experience of dealing with these types of problems?


    Encountering an aggressive interviewer is an unpleasant but, happily, rare experience
    for a candidate. To some extent, this style of interview is out of fashion, and
    concerns about equal opportunities plus an increasing reliance on competence-based
    interviews make it unlikely to find favour. Nevertheless, your interviewer could
    be having an off day, be under a lot of pressure or simply not have the ideal
    personality for interviewing.


    An employer may wish to determine how you react in a hostile situation and to
    discover aspects of your personality through other means than just asking you
    to describe them. Keeping calm and avoiding hitting your adversary is a fundamental
    starting point. It is, however, important that you don’t crumble under the pressure
    and that you continue expressing your well-prepared answers clearly and assertively.


    ![image](images/00004.jpeg)


    Aggressive-sounding questions often begin with the word ‘why’. ‘Why did you take
    this decision?’ ‘Why did this problem arise?’ Just stay calm; don’t be panicked
    into giving a poor answer and try not to take the whole thing too personally.


    Remember the questions are not any more difficult, even if they are being asked
    in an unpleasant way. It may be that the position you have applied for will mean
    that you are placed with some fairly aggressive colleagues or clients and if your
    interviewer is aware of this, they want to ascertain that you will be able to
    cope.


    Once in a while, you are nice, your interviewer is pleasant, but circumstances
    are difficult. Your interview is constantly interrupted by telephone calls or
    by people bursting into the room. Your interviewer probably feels even more flustered
    than you by this (unless it is some bizarre psychological test). Bad planning,
    time pressure or staff shortages are more likely explanations. Take a note of
    where the conversation broke off, so that you can get it back on track quickly
    if your interviewer is struggling with ‘And where were we?’ One candidate being
    interviewed for a job at a company based in a coastal town had their interview
    interrupted because the interviewer was a member of the local lifeboat crew and
    he was summoned to a rescue – so some interruptions have to be forgiven.


    ### Summary and reminders


    You can deal with even the most awkward, challenging or disconcerting questions
    by careful thought and planning.


    1. Prepare ahead for any areas where you know you may be vulnerable.


    2. Ensure that those people whose names you are giving as referees know this beforehand
    and have given their permission for you to do so. This is not only courteous but
    it means, if there are any areas of concern, they may be prepared to discuss them
    with you in advance.


    3. Accept that some interviews will go badly and you can’t always redeem the situation.


    4. Be candid and truthful, but don’t give people information they don’t ask for;
    you don’t have to drag all the skeletons out of your cupboard.


    5. Remember that you would never have been called for an interview if there was
    not a real chance that you could be the successful candidate, so be positive.


    [![Image](images/00040.jpeg)](http://www.amazon.co.uk/Brilliant-Interview-Questions-Business-ebook/dp/B00A8N8J5M/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320560&sr=8-1&keywords=brilliant+answers+to+tough+interview+questions)


    ![Image](images/00041.jpeg)


    If you do not intend to have a long-term relationship with the other side … it’s
    time to haggle! Almost everything you purchase or sell in your private life will
    be susceptible to haggling. Although you cannot haggle for your basket of groceries,
    this is the exception rather than the rule. The great thing about haggling is
    that you can relax and enjoy it, because even if you make a mistake there will
    be no long-term damage. You also benefit from the fact that when buying and selling,
    your opponent expects you to haggle – even the smartest of London jewellers will
    not be offended by you haggling for jewellery or designer watches.


    Haggling is a game with well-established rules. The first section in this chapter
    provides you with a comprehensive set of these rules, which will equip you to
    be a very effective haggler. The last three sections explain how to answer three
    of the most difficult issues in negotiation:


    1. How do you establish the value of something?


    2. Should you make the opening offer?


    3. At what level do you pitch an opening offer or your first counter-offer?


    ![image](images/00042.gif)


    If you cannot bear the thought of haggling, you must at the very least ask politely
    ‘What is your best price/offer?’


    ### The rules of haggling

