    [\*](#part0006_split_001.html#ich3fn2) Men, please note: androstenol is produced
    by fresh male sweat and is arousing for women but only for 20 minutes, then exposure
    to oxygen converts it to androstenone – the locker-room smell – and it will certainly
    not have the effect you had hoped!


    [\*](#part0006_split_001.html#ich3fn3) Pheromone from the Greek pherein, meaning
    to transfer, and hormon, to excite.


    [\*](#part0006_split_001.html#ich3fn4) The ‘old’ brain which sits on top of the
    spinal column in the base of the skull is sometime referred to as the ‘reptilian
    brain’, because all vertebrates from reptiles to mammals have one.


    [\*](#part0006_split_001.html#ich3fn5) With the advent of the sexual revolution
    of the 1960s there has been an increasing relaxation of these reservations, as
    sex is a basic drive for both men and women.


    [\*](#part0006_split_001.html#ich3fn6) Please take into account that this summary
    for this chapter is concerned with body language and attraction, because read
    out of context I am sure it could offend both men and women!


    [![Image](images/00022.jpeg)](http://www.amazon.co.uk/Brilliant-Body-Language-Lifeskills-ebook/dp/B00A8N8IF8/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320591&sr=8-1&keywords=brilliant+body+language)


    ![Image](images/00023.jpeg)


    Let’s just reflect for a moment on the reality. You’re three-quarters of the way
    through Brilliant Self Confidence; you’re getting to the point where your Self-Confidence
    Project is going to really get into gear. There are still some significant issues
    we haven’t yet touched on though. There are two key questions you need to answer:


    1. Do you feel satisfied with the way your life is going?


    2. How motivated are you?


    ## Finding the right balance


    It’s difficult to feel satisfied and happy if you don’t have a balance to your
    life. I find that confident people often feel content and happy because they’re
    in control of their lives. They’ve found the happy medium between the four key
    elements in their life:


    * Their commitments and time spent at work


    * Their love for and time spent with their family


    * Their personal health and fitness


    * Their time spent on ‘personal’ recreation and hobbies.


    There’s a direct link here to self-confidence. Most confident people have found
    an acceptable balance between their responsibility to others and their own wants
    and needs. This helps them to feel satisfied and to stay positive. We notice this
    about them at work and socially because it’s reflected in their behaviour, their
    approach to life and the way they conduct themselves.


    Importantly, they also tend to be realists – they’ve come to terms with the fact
    that we all have responsibilities. For example, the majority of people have to
    work to earn a living. Most confident people accept this and get on with it.


    You’ll struggle to stay confident if you don’t feel in control and satisfied with
    your life. Why? … because you’ll end up demotivated, rudderless and, ultimately,
    failing while others achieve.


    A lot of people who lack self-confidence feel it’s selfish to think of themselves.
    This is just not true; confident people realise that balancing your own wants,
    needs and aspirations with your responsibility to others is vital.


    ![Image](images/00024.jpeg)


    ### Life balance


    Even if, on the face of it, you feel satisfied in your life – try this exercise.
    Ask yourself if the balance in your life is right. Be realistic though – for example:
    don’t kid yourself that you aren’t happy because you spend more time at work than
    you do on holiday!


    It’s important that you open your mind and think creatively when you do this,
    particularly when you’re thinking about yourself and the things you’d like to
    do or achieve. Some people find it helpful to refer to the strategic objectives
    and tactical goals they set (in [Chapter 3](#part0004_split_000.html#3Q280-ea80c314fec9453c9538b477b18d86f4))
    when they’re doing this exercise. Look at these again and satisfy yourself that
    the time and effort you’re planning to put into different aspects of your life
    are balanced fairly.


    The ‘life balance’ exercise is about the present though. It’s about the way you’re
    leading your life at the moment and whether or not you’ve got your priorities
    right. Try thinking about how much time you spend at work and then consider the
    other aspects of your life which are or should be important to you. This is a
    personal and private exercise and only you will know what’s important to you.
    It might help to think in terms of:


    * Your responsibility to others (work, family etc.)


    * Your responsibility to yourself (work, enjoyment, health, hobbies etc.).


    Some people find it helpful to actually map out how much time they spend on the
    different elements of their life. This highlights any inconsistencies and shows
    whether or not you’re spending too much time on one particular aspect of your
    life. In other words, whether or not you’ve got your priorities right.


    Have a look at this pie chart put together by Ailsa. She’s calculated the amount
    of time she spends on different aspects of her life over a weekly period.


    Ailsa has chosen family, health, work and recreation as her key elements. You
    can see straight away just by looking at the larger, white portion that she spends
    a lot of her time at work (this includes her journey to work).


    Ailsa is married with two young children; she works full time and sometimes doesn’t
    get home until after they’ve had their bedtime story (read by her husband, who
    works part time). The main message she’s learnt from doing this exercise is that
    she just doesn’t spend enough time with her children. So this simple exercise
    led her to change her work pattern to accommodate … an exercise well worth doing!


    ![Image](images/00025.gif)


    #### Figure 8.1 Life balance


    Have a go at developing your own pie chart; you could choose the same elements
    as Ailsa or you might decide to change them to reflect your own life more specifically.
    For example, if you spend a lot of time cleaning the house, then cleaning could
    be one of the elements you include on the chart. Include anything you think takes
    up a significant amount of time. Don’t forget to put sleeping time on the chart.
    Ailsa decided to include sleep in the health portion (and realised that she probably
    doesn’t get enough of it!).


    Remember, you’re looking at a period of a week in your life. It needs to be a
    fairly ‘typical’ week so don’t choose a week that doesn’t reflect the general
    pattern of your routine. Make sure you include the weekend so the exercise reflects
    seven days’ worth of your time. Some people find it helpful to break the week
    into days and then to break each 24-hour period down.


    Ultimately, your pie chart represents 168 hours of your life. Once you’ve allocated
    times to activities, you should have a good feel for how your time is spent. When
    you’ve finished the chart, reflect on it and ask yourself if you’ve got your priorities
    right. The pie chart can be a real eye opener. In fact I’ve known some people
    who’ve radically changed the way they live, simply as a result of what they’ve
    discovered by doing this exercise.


    ## Personal effectiveness and discipline


    People’s perception of how you come across to them socially and at work isn’t
    just based on how you look and sound. It’s also based on how you behave and how
    you organise yourself. You’ll feel more confident, and there’s more chance people
    will perceive you as confident and in control, if they see you as an organised,
    tidy and efficient person.


    ### Personal organisation


    How many confident people do you know who are disorganised? If you can think of
    any at all, they tend to be the exception to the rule. Confident people are usually
    organised, both practically and mentally. There’s a lot of truth in the saying
    ‘disorganised desk, disorganised mind’.

