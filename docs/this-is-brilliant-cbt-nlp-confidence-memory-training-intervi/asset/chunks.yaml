    \ can colour our thinking – often in unhelpful ways. We can describe events to\
    \ ourselves in terms that can either inflame our reactions or calm them down.\n\
    \nIf I tell myself, ‘That man despises everything I stand for,’ rather than, ‘We\
    \ don’t always see eye to eye’ I will instantly feel on the defensive next time\
    \ we meet. If I say to myself that a situation was ‘utterly humiliating’ as opposed\
    \ to ‘briefly uncomfortable’ I will be making strenuous efforts to avoid similar\
    \ situations in future – even if such protective manoeuvres are entirely unnecessary.\
    \ My language has effectively raised the stakes.\n\nEmotive language is one of\
    \ the main reasons why people end up convincing themselves that they will be unable\
    \ to tolerate situations that they have perfectly adequate resources to cope with:\n\
    \n*   ‘It would be the worst thing if people laughed at my performance. I would\
    \ look like such an idiot’.\n\n*   ‘I wouldn’t be able to live with myself if\
    \ anything happened to her.’\n\n*   ‘It would be simply awful to end up alone…\
    \ .’\n\nBe careful that when you describe past or future events to yourself you\
    \ do not prejudice yourself: this is counterproductive. It is very hard to think\
    \ objectively about a scenario that has already been given a strong emotional\
    \ inflection and it is often our language that colours our perceptions and feeds\
    \ our anxieties and low moods.\n\n*   When thinking or talking about emotionally\
    \ inflammatory scenarios check your vocabulary and make sure you are not throwing\
    \ fuel on the fire of your negative thoughts.\n\n*   Strive to achieve the most\
    \ neutral, objective tone that you can.\n\n*   When recalling distressing events\
    \ imagine that you are writing a bulletin for a news broadcast that requires you\
