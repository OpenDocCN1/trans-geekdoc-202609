- raw: 'If you are at a party or a dinner you might ask of another guest, ‘How do
    you know so and so?’ or ‘Do you know anyone else here tonight?’ If it is a business
    conference you might say, ‘Hi, we haven’t met, my name’s Steven. This is my first
    time at this conference. Did you come last year?’ Alternatively you might refer
    to an element on the programme: ‘Have you heard this speaker before?’ or ‘What
    did you think of the last speaker?’ Look out and observe details around you that
    could provide opportunities to connect with others.


    #### If you have arrived with another person, go solo


    One of the main barriers to networking is that we naturally prefer to speak to
    the people we know. If you have come in a group or with a partner, separate and
    meet new people. Often it is easier for people to approach those who are alone
    rather than in couples. You can compare notes with your partner or group afterwards.


    #### Introduce yourself


    Start by introducing yourself with a warm smile and simple introduction: ‘Hello,
    pleased to meet you, I’m Steven.’ Generally the person will respond with their
    name and then the conversation will flow (we will explore how to make it flow
    below). Give the person time to think and to feel comfortable speaking with you.


    ![image](images/00004.jpeg)


    When you start a conversation with strangers, remember that they might also be
    feeling nervous or apprehensive. By being the first to start a conversation, you
    are the one breaking the ice, and will be perceived as being confident. A simple
    question like ‘I’ve just arrived and don’t seem to know anyone here. Are you in
    the same boat?’ can give the other person a chance to connect.


    #### Names are there to be used


    Our names, especially first names, are possibly the one consistent label that
    many of us identify with throughout our lives. Many people take pride in their
    name and take time to discover its meaning. Even in a large crowd with a lot of
    noise, if someone calls your name you are still likely to hear it.


    When someone remembers and uses our name it makes us feel valued as a person.
    They have taken the time to remember it and this in turn makes us feel special.
    Those well trained in sales or customer service know that the sweetest sound the
    customer can hear is their name repeated to them and that this then builds rapport
    and puts people on closer terms.


    When someone forgets our name it can make us feel that we were not important enough
    to be remembered. The implication is that ‘You don’t matter’ or at worst it can
    seem like deliberate rudeness, ‘Your name is not important’.


    When you arrive at an event and are introduced to a group of people quickly, do
    not be shy at this point to stop the host and just check you have all the names
    correctly. ‘Sorry, I missed that, it was so fast, can I check, your name is …?’
    Taking the time now to hear and remember the names properly will save a lot of
    guesswork in the future. It is also understood and forgivable when you have just
    met to clarify such information.


    When you are first introduced to someone you can use their name as you answer,
    to reinforce it in your memory, for example:


    ‘Hi, I’m Katie.’


    ‘Hi Katie, good to meet you.’


    Although it might sound awkward, you have a far better chance of remembering the
    name, saving embarrassment later.


    Once you have a name, remember to use it occasionally during the conversation
    or as you are finishing the conversation. This will help reinforce it. If the
    person has a name badge or you have been given a business card, referring to these
    when you have quiet times at the event and associating them with the person’s
    face will also help you remember.


    If in doubt it is always better to ask for a name than to guess. Although this
    is clumsy it can be more easily forgiven than if you use the wrong name all evening.
    ‘Sorry, as I was coming in I missed your first name, could you repeat it?’ ‘Sure,
    I’m Mike.’


    ![image](images/00004.jpeg)


    If a name is difficult to pronounce or long, ask the person to tell you how to
    say their name rather than guessing and coming up with something of your own creation.
    ‘Paramahansa, that’s a beautiful name, how do I pronounce that correctly?’ Unusual
    names can also be great conversation starters: ‘That’s a beautiful name, what
    does it mean?’


    If you are asked to introduce someone to another person but you do not know their
    name, this is a sticky situation. There are very few ways to get out of it but
    one is to step back and assume that they can introduce themselves: ‘Please go
    ahead and introduce yourself to each other, I would really like you to meet.’
    Once they have said their names, take a mental note and remember them.


    #### Forget yourself


    Once you have done what you can to prepare to connect with someone and make the
    impression you want to give, the best thing you can do paradoxically is to forget
    yourself, ‘let go’ and be immersed in the person you are speaking to while being
    aware of the needs of others around you.


    ### How to approach a group of people


    The dynamics of approaching a group of people are slightly different than one-to-one
    situations but only at the outset. It is quite common for groups to be a collection
    of people having one-to-one conversations with the person next to them, rather
    than one person speaking at a time.


    *   Groups form early, so arrive on time or early at an event before closed groups
    have formed. If you can start a one-to-one conversation with as many people as
    you can, then if they later join a group you have a ‘go to’ person to approach
    who is familiar to you.


    *   Usually at every formal networking event there is a host or organiser. If
    you know that you want to join a group, asking the host to introduce you will
    normally allow you to break the ice without the burden being on you.


    *   Keep a close eye out and look for opportunities to join a conversation by
    speaking to a pair or the person at the end of a group, if the group is fractured.
    Again the opener does not need to be memorable. It could be, ‘Do you know the
    football results?’ if there is a match on, or ‘Do you have the time?’ to someone
    at the end of the group.


    *   If the event host does any icebreakers – even if these are just a round-robin
    of introductions – take note of any details about people you want to talk to.
    If they are in a group and you have something specific to see them about, you
    could flag the request at that point and request to speak later. Always acknowledge
    that you are interrupting a conversation. For example, ‘Excuse me, I don’t want
    to disturb your conversation but in the introductions I heard that you work in
    the pharmaceutical industry. I’m a researcher. I know you are busy now but would
    it be possible to chat to you later this evening?’ On many occasions the person
    will continue the conversation with you then and there.


    *   Sometimes the group could be at a conference or forum and you want to get
    noticed. One of the easiest ways to do this is to ask a short intelligent question
    if questions are taken after speakers. Being the first person to do this also
    illustrates confidence. You can phrase the question in such a way that people
    know who you are and what you do. For example: ‘Claire Smith, novelist and copywriter.
    I really enjoyed the point you made about grammar schools. Do you believe that
    they support a meritocratic educational system?’


    *   Sometimes when people are in a pair or a larger group they will be open to
    outsiders and you can then join them on their invitation. Other groups might want
    to stay private and although they may be polite at first, essentially they do
    not want you to join. Listen and look out carefully for verbal and non-verbal
    cues and if you do not get a positive response move quickly and politely on. There
    will always be more people to speak to.


    ### Keeping the conversation going'
