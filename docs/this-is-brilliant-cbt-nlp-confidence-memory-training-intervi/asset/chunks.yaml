- raw: "Human beings are drawn to patterns. We frequently use our experience as a\
    \ template for our predictions about the future. However, people who are inclined\
    \ to generalise require little evidence in order to deduce laws and assumptions\
    \ about the way the world works – and invariably their observations and deductions\
    \ are pretty downbeat. A man loses a game of Scrabble and thinks to himself ‘Typical!\
    \ I never win at anything.’ A young girl gets teased at school and concludes,\
    \ ‘Everyone hates me!’ An elderly lady reads about a mugging in the local paper\
    \ and ruefully concludes that ‘No one is safe these days…’. All of these are examples\
    \ of generalisation in which an individual draws some far-reaching, universal\
    \ conclusion on the basis of a single unpleasant experience or discrete piece\
    \ of information.\n\nThe language of people prone to generalisation is usually\
    \ a reliable giveaway. If you hear yourself using absolute terms like ‘never’,\
    \ ‘always’, ‘everyone’ and ‘no one’ a lot, then the chances are you may be vulnerable\
    \ to this type of thinking.\n\nIn order to counter generalisation you need to\
    \ train yourself to look for exceptions to your own rules. If you have one friend\
    \ in the world then it is not the case that ‘no one’ likes you and it is highly\
    \ unlikely you have ‘never’ won at anything – even if your distorted thinking\
    \ probably makes it hard for you to bring any past victories to mind. The danger\
    \ with generalisations is that we tend to screen out anything that does not correspond\
    \ with our ill-founded convictions, whereas we eagerly seize upon fresh evidence\
    \ that appears to support our negative beliefs about ourselves and others.\n\n\
    Unfortunately, generalisations easily become self-fulfilling prophecies. For example,\
    \ someone who believes she is universally unpopular will make little effort to\
    \ make herself amenable to other people.\n\n### Thinking error 3: mind reading\n\
    \n#### ‘She thinks I am an idiot’\n\nWe make assumptions about other people and\
    \ their intentions all the time. To some extent this is necessary, and we can\
    \ reliably infer a great deal from people’s actions and past behaviour towards\
    \ us. However, in some circumstances our imaginations run riot. We leap to conclusions\
    \ about other people’s motives and attitudes on the basis of very little hard\
    \ evidence. We are especially inclined to do this when those motives and attitudes\
    \ affect us directly.\n\nThe trouble is that when we make these kinds of assumptions\
    \ we leave ourselves open to all kinds of misunderstandings and paranoid projections.\
    \ The fact of the matter is that we have no way of knowing for certain what another\
    \ person is thinking unless they choose to tell us.\n\n![image](images/00003.jpeg)\n\
    \nOne of the interventions often recommended to CBT clients prone to mind reading\
    \ involves consulting other people regarding their views and perceptions.\n\n\
    A young male client who was sent away with the homework task of asking his family\
    \ and friends what they valued about him made every excuse under the sun to avoid\
    \ having to complete the assignment. He would feel self-conscious. He wouldn’t\
    \ be able to get hold of some of the relevant people. He didn’t have the time\
    \ because of the pressure of his college work. Before his session the following\
    \ week I half expected him to turn up claiming that the dog had eaten his homework\
    \ sheets.\n\nNevertheless, when Paul did arrive for his session we were both pleasantly\
    \ surprised by the results. Not only had he completed the task and interviewed\
    \ the people as suggested, but reported that he had been both moved and secretly\
    \ delighted by some of the compliments he had been paid.\n\nPaul confessed that\
    \ he had been terrified of conducting these enquiries because he had been convinced\
    \ that even the people closest to him perceived him as ‘an annoying nerd’. This\
    \ wasn’t actually the case, but because of this entrenched belief Paul had never\
    \ risked testing out the reality of the situation. Relying instead on his highly\
    \ developed ‘mind reading’ powers, Paul had laboured under an unnecessary assumption\
    \ that was eating away at his self-esteem.\n\n### Thinking error 4: polarised\
    \ and rigid thinking\n\n#### ‘It’s black or white…’\n\n‘It’s right or it’s wrong’,\
    \ ‘You’re a winner or loser’, ‘If it’s not the best then it’s rubbish…’. People\
    \ who tend to think all the time in these kind of dichotomies are likely to create\
    \ all kinds of problems for themselves psychologically. The world is just not\
    \ that simple. Our classifications are always imperfect, and trying to force reality\
    \ into convenient boxes seldom works very well.\n\nThink about weight for example.\
    \ Polarised thinking would insist that if you are not thin you must therefore\
    \ be fat. This ignores the fact that if you lined the population of London up\
    \ in a line there would be little agreement on the point at which the ‘skinny’\
    \ people ended and the ‘overweight’ people began. Obesity is a good example of\
    \ a continuum concept with a rather arbitrary cut off. It’s also a cultural construct\
    \ – a social judgement rather than an objective truth.\n\nPolarised and rigid\
    \ thinking often goes hand in hand with strong moral judgements and self-evaluations\
    \ that can cause a great deal of unnecessary distress. You may also have noticed\
    \ that polarised or dogmatic thinkers usually spend a great deal of time trying\
    \ to impose their own classification system on other people. Their moral absolutism\
    \ tolerates no dissent – after all, in their eyes there is only one right way.\
    \ Unfortunately this kind of polarised thinking leads to a great many evils in\
    \ society including racism, bigotry, sexism and political extremism. Often people\
    \ who think in rigid ways put themselves and others under a great deal of unnecessary\
    \ pressure.\n\nPeople who think in extremes have few places to go. It is no coincidence\
    \ that CBT places so much emphasis on softening the absolutes in our thinking\
    \ and encouraging us to think more flexibly. This is not about ditching your values\
    \ or becoming an amoral person. It is simply about recognising that people can\
    \ see and experience things in different ways, and that more flexible, sophisticated\
    \ ways of perceiving are likely to be better for your mental health.\n\n![image](images/00004.jpeg)\n\
    \nThink in terms of sliding scales\n\nPeople often complain that CBT places an\
    \ unnecessary emphasis on percentages, ratings and measurements. However, recognising\
    \ that, when it comes to levels of conviction or the degrees of emotion we feel,\
    \ we are always at some point on a sliding scale creates the possibility of moving\
    \ up and down in either direction. If there are only two opposites to choose from,\
    \ then shifting from one position to the other often becomes a daunting task.\
    \ Moving a few inches in either direction is a much less intimidating and more\
    \ realistic prospect.\n\nHere are a few suggestions:\n\n*   Watch out for terms\
    \ in your speech and thinking such as ‘should’, ‘ought to’ and ‘must’ that may\
    \ indicate the presence of unhelpfully rigid assumptions about yourself and the\
    \ world:  \n\n    – ‘Women should always obey their husbands.’  \n\n    – ‘I must\
    \ always put others first.’  \n\n    – ‘Children should be seen and not heard.’\n\
    \n*   Try to embrace the grey: recognise that many concepts are better conceptualised\
    \ as a sliding scale rather than a choice between stark alternatives.\n\n*   Learn\
    \ to see your values and convictions as a matter of personal choice rather than\
    \ obligatory for everyone.\n\n*   Expose yourself to other views that don’t necessarily\
    \ fit in with your own and see if you can find any common ground with those who\
    \ hold them.\n\n### Thinking error 5: emotional reasoning\n\n#### ‘I feel so guilty…\
    \ I must have done something awful’"
  fmt: "\nHuman beings are drawn to patterns. We frequently use our experience as\
    \ a template for our predictions about the future. However, people who are inclined\
    \ to generalise require little evidence in order to deduce laws and assumptions\
    \ about the way the world works – and invariably their observations and deductions\
    \ are pretty downbeat. A man loses a game of Scrabble and thinks to himself ‘Typical!\
    \ I never win at anything.’ A young girl gets teased at school and concludes,\
    \ ‘Everyone hates me!’ An elderly lady reads about a mugging in the local paper\
    \ and ruefully concludes that ‘No one is safe these days…’. All of these are examples\
    \ of generalisation in which an individual draws some far-reaching, universal\
    \ conclusion on the basis of a single unpleasant experience or discrete piece\
    \ of information.\n\nThe language of people prone to generalisation is usually\
    \ a reliable giveaway. If you hear yourself using absolute terms like ‘never’,\
    \ ‘always’, ‘everyone’ and ‘no one’ a lot, then the chances are you may be vulnerable\
    \ to this type of thinking.\n\nIn order to counter generalisation you need to\
    \ train yourself to look for exceptions to your own rules. If you have one friend\
    \ in the world then it is not the case that ‘no one’ likes you and it is highly\
