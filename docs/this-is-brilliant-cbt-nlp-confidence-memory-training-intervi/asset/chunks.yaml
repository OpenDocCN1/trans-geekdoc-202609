    # Rob 的经历与冲突处理


    Rob remembered from his trip the year before that they’d really regretted not
    hiring a car for the weekend. They’d decided to go on the ferry as foot passengers
    and get the train to the village they were staying in. This had turned out to
    be a big mistake because, although beautiful and picturesque, the village was
    in the middle of nowhere. As a result, they’d ended up having to get taxis everywhere
    and this had meant they’d ended up spending much more than they’d planned. Not
    having a hire car also meant they’d had no flexibility – every time they wanted
    to go out, they had to ring for a taxi. This turned out to be really frustrating.


    So, Rob explained all this when they were talking about transport arrangements.
    Lynda, however, just would not listen. She was adamant that the cost of taxis
    would be less than hiring cars. However, Rob had already worked out that, even
    if they hired two cars, it would still be cheaper than hiring taxis throughout
    the weekend and, of course, they’d have the flexibility to go where they wanted
    when they wanted.


    This led to a disagreement. Rob began to feel very uncomfortable with the situation
    because he just didn’t like arguing. He ended up giving in to Lynda even though
    he knew he was right. None of his other friends in the group could make up their
    minds what was best. One or two of them even tended to side with Lynda because
    she was so direct with her views. Rob just didn’t stand up for himself so they
    weren’t convinced by his argument – even though he’d actually been there and experienced
    the problem!


    Rob just wasn’t a person who felt comfortable contesting an issue. His instinct
    was to give in whenever he found himself in a conflict situation. He felt particularly
    uncomfortable with Lynda because she was a person who would instinctively contest.


    The whole group lost out eventually because they didn’t hire cars and, just as
    Rob had predicted, they regretted it.


    ![image](images/00004.jpeg)


    ## 主动坚持的重要性


    When you think you’re right, don’t give in. It’s time to be actively assertive
    in order to contest the issue. You’ll need to motivate yourself to do this, particularly
    if your instinct is to give in. Make a pact with yourself not to let this happen
    the next time you think you’re right and the other person contests.


    Like Rob, the majority of the people I meet who lack confidence tend to either
    give in or do their best to avoid the conflict in the hope that it will go away
    and not come back. The trouble is, the problem rarely does go away; more often
    than not it will fester and then come back with a vengeance.


    So, you’re probably getting a feel for what I’m suggesting here. People who have
    confidence and use this confidence in a balanced manner are able to deal with
    each conflict situation that confronts them in the way that best suits. They have
    the self-control and sensitivity to avoid or perhaps even give in when they should
    and they have the self-belief and self-confidence to stand up for themselves when
    they think they’re right.


    Identifying the type of conflict situation you’re encountering is the first step
    to making a judgement and doing something about it.


    So, if any of the following applies, you need to dig deep, present your case confidently
    and contest the issue:


    *   When you’re sure you’re right and the potential repercussions of the other
    person winning the argument are serious.


    *   When you’re sure you’re right and any delay in presenting your case could
    have a negative impact.


    ![image](images/00003.jpeg)


    ## Mike 的案例


    Mike


    Mike was on a skiing holiday in Austria with his family. An easygoing, confident
    person, Mike would only contest an issue if he really felt he was right or that
    a matter of principle was involved.


    He’d hired a snowboard for his son Toby to use. Unfortunately, at lunchtime on
    the last day of their holiday, one of the boot straps (bindings) on the snowboard
    broke while Toby was using it. As a result, Toby couldn’t ski on the last afternoon
    and Mike had to take him back to their apartment using the lift system up and
    down the mountain. This took all afternoon because they were a long way away and
    had to use a number of different lifts to get back. They’d wasted a whole afternoon
    of their holiday.


    Mike was certain that Toby wasn’t responsible for breaking the snowboard and that
    the hire shop should take responsibility because it was a ‘mechanical’ failure
    rather than a ‘breakage’.


    So, when they arrived back at the shop, Mike calmly explained what had happened
    to the shop owner. He also explained that neither he nor Toby had been able to
    ski since lunchtime, they’d wasted the ski passes they’d paid for and they’d had
    a long trip back using the lift system.


    Mike made it clear to the shop owner that he didn’t feel it was fair for him to
    pay for the hire of the snowboard for the last day … And that was when the conflict
    started because the owner completely disagreed. Mike stood his ground even though
    the owner became quite annoyed … ‘If you hire a car and have an accident, you
    pay for it … hiring a snowboard is just the same,’ he kept on saying. But Mike
    wouldn’t budge because as far as he was concerned he was right. He retorted, ‘If
    I hired a car and I had an accident which was my fault I would have to pay for
    it, but if I hired a car and it broke down through no fault of my own, I would
    not … you have hired me a snowboard and the binding has snapped – my son did not
    break it.’


    And so the argument went on, but Mike stood up for himself because he thoroughly
    believed he was right. As a result the owner backed down and didn’t charge him
    for the last day’s hire of the snowboard.


    So what’s the moral of the story? If you feel strongly about something, prepare
    before you speak and have facts and reason to back up your argument. Mike prepared
    before he went back to the shop. He took a deep breath before he went in and presented
    the owner with his case. It worked.


    ## 何时应该让步


    On the other hand, when might it make sense to give in?


    *   When you know the person is right or has a better idea than you.


    *   When you know you are right but the issue is of such minor importance that
    it’s just not worth getting into an argument.


    *   When you’re working with someone who’s learning (perhaps a young person) and
    you don’t want to demotivate them. The person is full of energy and enthusiasm
    and wants to help. They come up with an idea that you know won’t work because
    you perhaps tried it when you were learning. As long as the consequences of them
    trying their idea and failing aren’t likely to be serious, let the person have
    a go. They’ll feel more inclined to come up with ideas in the future because they
    know you’ll listen. If you don’t let them have a go, you could end up with a demotivated
    person who doesn’t think you value their opinion or, perhaps even, trust them.


    ## 何时应该回避冲突


    Or perhaps, it would be more sensible to avoid the conflict (this isn’t giving
    in; you’re just avoiding the conflict for the moment with a view to addressing
    it again later if it’s still there).


    So, when would it make sense to avoid it?


    *   When tempers are getting frayed and people aren’t thinking straight.


    *   When the issue is of such minor importance that it’s just a waste of time
    to argue about it.


    *   When you’re not prepared properly with your argument.


    *   When you’re not in the right frame of mind.


    *   When you’re in a place that isn’t appropriate (perhaps a public place where
    others can overhear you).


    ## 妥协的艺术


    There are times too when the most sensible course of action is to compromise.
    If you score yourself between the two extremes on the Conflict Zone chart, your
    instinct will tend to push you towards the middle ground of compromise.


    The compromise style lends itself best to the following situations:


    *   When a solution is moderately important but not worth the effort or possible
    continued conflict that might result from either contesting or giving in.


    *   When you need to achieve a temporary settlement to a larger issue.

