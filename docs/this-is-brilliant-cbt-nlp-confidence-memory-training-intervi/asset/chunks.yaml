- raw: '*   When you’re under time pressure.


    *   When both sides have essential needs to consider.


    *   When you’re dealing with someone of equal power or authority.


    #### Choosing the right style


    Be aware of your instinctive way of dealing with conflict; it could be to contest,
    to compromise or even to give in. Whichever it is, don’t worry; there’s nothing
    wrong with any of these approaches. Be aware though: you’ll react to conflict
    in your natural instinctive way time and time again if you don’t consciously think
    about it. The key is to make sure you don’t ‘default’ into your comfort zone when
    your instinctive approach isn’t the right approach.


    ![image](images/00004.jpeg)


    Pinch yourself next time you face conflict. Look at how you’re behaving. Ask yourself
    if you’ve chosen the right style. Prepare yourself if you need to switch from
    your natural style.


    #### Showing emotion


    There’s nothing wrong with showing your emotion! In fact, you’ll find it hard
    to deal with conflict effectively if you withhold your true feelings.


    More often than not, the main reason we hold back is that we fear the consequences
    of showing our emotions. We worry that we’ll embarrass ourselves and we wonder
    what the person will think of us and how they might react. It’s for this reason
    that people tend to show and share their emotion more readily at home than they
    might at work.


    Try to set aside these worries (particularly at work). After all, there shouldn’t
    be any embarrassment if you control the way you communicate your emotion. Some
    people might even see your lack of visible emotion as a sign that you don’t care
    … not a good way for your work colleagues to perceive you.


    Continually holding in your emotion can be like blowing up a balloon – breath
    by breath it gets bigger until, eventually, unless you release some of the air
    – BANG! Releasing some of the air is the important thing to remember here. If
    you let go of the balloon and release all of the air, it’ll fly away wildly and
    you’ll lose control. So, controlling the way you release the pressure is the key
    to communicating your emotion effectively.


    These essential rules should stand you in good stead:


    *   Think carefully before you talk or act.


    *   Communicate your emotions in a controlled way.


    *   Don’t let your emotions cloud your judgement.


    *   Make sure you’re receptive to the emotions of the other person.


    *   Adapt your communication style to accommodate the style of the other person.


    ![image](images/00004.jpeg)


    It’s more damaging to bottle up your emotion than to share it. Just make sure
    you prepare yourself and communicate it with self-control.


    #### Dealing with difficult people


    Even when you have the confidence to change the way you approach a conflict situation,
    from time to time you’ll still encounter people who you find it difficult to deal
    with. Some of these people will be people you already know. That means you can
    pre-empt and prepare for what’s going to happen before you see them; it’s unlikely
    they’re going to change the way they behave.


    The first thing to do when dealing with a person you find difficult is to reflect
    on your natural communication style. Simply adapting your style to match theirs
    may well be enough to convert a ‘difficult person’ into a person you don’t feel
    uncomfortable with. Hopefully you’ll have nipped the problem in the bud before
    it’s even started.


    So, what should you do if you’ve tried adapting your style and still the person
    is being difficult and insisting they’re right? Here are some ideas:


    ##### Stand up for yourself


    I’ve mentioned that a lot of the people I meet who lack confidence find the hardest
    conflict situations to be the ones where they have to stand up for themselves.
    This may mean ‘contesting’ an issue, insisting on your rights or strongly voicing
    your concerns. They find this hardest because it’s against their nature. If you’re
    one of these people, you’re going to find this one of the most challenging parts
    of your Self-Confidence Project.


    You’ll find that being more assertive will help here. Think back (to Chapter 6):
    if you tend to lean naturally towards the passive side of the Assertiveness Seesaw,
    you’ll have to work hard to fight your gremlin. Extreme passiveness normally means
    giving in. Your gremlin will be trying hard to keep you on the passive side of
    the bar. You’ll never be able to stand up for yourself if you stay there. Remember
    the Brilliant Self Confidence principle – don’t let the gremlin get you.


    The three simple steps in [Figure 8.5](#part0007_split_001.html#ch8fig5) should
    also help when you need to stand up for yourself and when you’re dealing with
    difficult people at home or at work.


    ![Image](images/00029.gif)


    Figure 8.5 Dealing with difficult people


    ##### Step 1 – Suss out the situation


    If the person wants to speak, let them; be quiet and don’t rush in; control yourself
    and wait it out. Let them get it off their chest. Don’t interrupt them. Actively
    listen, look alert and don’t get distracted. Control your body language – don’t
    let your body speak for you instead of your mouth. Don’t fidget, shrug your shoulders,
    use submissive facial expressions or body language. All of these traits signal
    that you lack self-confidence and could make you look apologetic. Just stand or
    sit still, face the person and look them in the eye while they’re talking.


    Keep the person and the problem separate. No matter how much their behaviour frustrates
    you and winds you up, try to keep an open mind. The person might not just be being
    difficult, they might actually have a valid and good point.


    When they’ve finished, try to hold the silence. This might put them off their
    guard. They’re expecting you to say something – so you’ve got the initiative now.
    Make sure that when your chance to respond comes, you insist that nobody interrupts
    you. This shouldn’t be a problem if you had the self-control not to interrupt
    them. If you’re interrupted, politely remind the person that you deserve to be
    heard – it’s your turn now.


    ##### Step 2 – Deliver


    Make sure you know what you want to achieve and the basis of your argument. If
    you don’t, you’re not ready – so find more time to prepare. If you don’t know,
    how can the other person be expected to understand your point of view?


    Take control by setting out the facts. There’s no harm in repeating the other
    person’s argument or position back to them. This way they’ll know you’ve listened.
    Having heard it again, they might even realise how stupid or weak it sounds! Repeating
    it back to them also gives you more chance to think about it.


    Then, speak authoritatively in the first person. This means saying ‘I’ more than
    you might normally. For example, it’s more constructive to say ‘I don’t agree
    with you’ than ‘you’re wrong’. There’s nothing wrong with saying ‘I disagree’
    or ‘I feel strongly that that is the wrong approach …’. Make sure you have some
    substance to back up your opinion though. Otherwise the other person could counter
    that you’re basing your opinion simply on judgement, not fact. This could also
    mean that you start to lose credibility – and then you’re on the slippery slope
    to losing the argument.


    There’s one exception to the principle of saying ‘I’ – never say ‘I’m sorry’ for
    putting forward your opinion. Never apologise for standing up for yourself unless,
    on reflection, your behaviour was aggressive or inappropriate in some way.


    Speak assertively; try not to stutter and don’t mumble. Remember to breathe! This
    will help you to think and speak at a measured pace. Be positive at all times
    and don’t be frightened to encourage discussion about the issue; even though the
    person might eventually realise you’re right, they won’t necessarily accept this
    if they don’t feel you’ve given them a chance to present their thoughts in full.


    ##### Step 3 – Take the initiative at the end'
