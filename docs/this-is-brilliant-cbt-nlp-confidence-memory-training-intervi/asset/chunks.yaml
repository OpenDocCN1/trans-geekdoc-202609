    \ evidence that her flatmate really did care about her well-being. She discovered\
    \ lots of small things she did for her that had previously gone unnoticed. The\
    \ relationship improved and they healed the rift. The point at which this situation\
    \ turned around was when Michelle flipped her that mindset to a this mindset and\
    \ created a positive intention to find the good in her flatmate.\n\n### Flipping\
    \ a that to a this\n\n1.  Think of a task you really don’t enjoy doing that causes\
    \ you to procrastinate, or one you do very quickly to get it out of the way. Whichever\
    \ you choose, it causes you bad feelings and, possibly, leads you to perform it\
    \ below your usual standard.\n\n2.  Create a conscious positive intention relating\
    \ to completing the task and begin to focus on the intention.\n\n3.  Either use\
    \ the absurdity technique described above or begin to develop the positive aspects\
    \ of the task, or both. How absurd is it that you have been thinking of the task\
    \ in that way? Keep looking for the good and release your mind from the negative\
    \ aspects of the task.\n\nThinking in a this way will allow your mind to be creative\
    \ and come up with solutions and ideas rather than becoming stressed by the bad\
