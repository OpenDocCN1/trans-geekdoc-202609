- raw: 'Most men like those physical attributes that give an indication of positive
    sexual reproduction – breasts, legs, bottoms, hourglass figure and that major
    sign of youth, a good skin. Women on the other hand, put far less emphasis on
    the procreative and more on the protective. For many women strong upright shoulders,
    a strong chin, muscled arms, a trim bottom and strong legs are gazed upon with
    pleasure, especially when it is topped off with a V-shaped torso. For most of
    us males it gets worse, since the research suggests[^(18)](#part0006_split_001.html#ch3ref18)
    a waist to shoulder ratio of 0.75 is the most attractive. That is why so many
    men spend hours in the gym trying to make their normal manly bodies more manly
    and hiding their non-exercised legs, which now, compared to their muscled upper
    bodies, appear relatively skinny. Perhaps males should thank Beau Brummell for
    making long trousers fashionable.


    There is some suggestion that young men prefer a slimmer female, and as they grow
    older, some would say more sensible, preference increases for what we might call
    the more generous, or in the adjective of the singles adverts, ‘cuddly’ frame.


    Unfortunately for the obese they are not regarded as physically attractive. Even
    children^([19](#part0006_split_001.html#ch3ref19)) as young as six years old impute
    the unfavourable attributes to them. Here the implications impact not only on
    relationships but also employment.


    Also stating the obvious, because it is usually only young to lower middle-age
    females that can reproduce easily, men have a preference for, and marry, younger
    women. Females who have a youthful appearance, which would include a good skin,
    firm breasts and long thick hair,^([20](#part0006_split_001.html#ch3ref20)) also
    do well in the attractiveness stakes – you knew this anyway. All this to satisfy
    the evolutionary driver: ‘To breed is to succeed.’


    We have to remember here that physical attractiveness is also very much affected
    by culture and era. Even without her arms Venus de Milo was the beauty of her
    time (in 120 BC) and yet has a very small bust; while England’s hero John Bull
    is very portly when compared to the svelte male models of today, yet both were
    considered attractive in their day.


    ### Faces


    Now, surprise, surprise, of course men are attracted to women who can bear them
    lots of healthy babies and women are attracted to men who appear strong enough
    to protect all those babies, yet both men and women are more impressed with the
    face[^(21)](#part0006_split_001.html#ch3ref21) of a potential mate rather than
    any other part of the body.


    We naturally have a preference for certain types of faces over others, with usually
    such faces being those of our family members. This may explain why you may be
    attracted to others who resemble them – a phenomena known as assortative mating.


    For the female, having a youthful face is the most significant fertility sign
    to a male. This certainly explains why a woman will spend a fortune on make-up
    and another fortune in time applying it to look much younger than they are. This
    idea is captured in the cruel quote by the slightly misogynous Oscar Wilde:


    ‘A man’s face is his autobiography. A woman’s face is her work of fiction.’


    This may have been true in Wilde’s time, but now grooming products for men come
    rushing out of the closet again, long after the beauty spot antics which were
    made fashionable by Prince George’s favourite, Beau Brummell, at the end of the
    eighteenth century. Fast forward to 1980 and we find more and more items are available
    to enhance the male visage. Today there are 40 million entries in Google for ‘men’s
    make-up’.


    Concerning attractiveness, psychologists at the University of New Mexico have
    actually found that when a woman ovulates she shows a preference for men whose
    body odour suggested symmetry!^([22](#part0006_split_001.html#ch3ref22)) Makers
    of men’s aftershave and fragrance take note!


    Interestingly, a female when ovulating prefers in a male a strong jawline, heavy
    brows and broad cheekbones, all of which are associated with a high level of testosterone.[^(23)](#part0006_split_001.html#ch3ref23)
    Men, if you do not have this type of face, all is not lost, because in early follicular
    or luteal phases the chin preference gives way to a good skin, indicating good
    health over the Marlboro-man look.


    Babies of both sexes prefer to look at symmetrical faces^([24](#part0006_split_001.html#ch3ref24))
    than those, shall we say in a kindly way, that are more interesting.


    However, physical attractiveness is only one factor out of many that makes us
    attractive enough to achieve an ongoing relationship and to maintain it. Divorce
    rates among the beautiful people who inhabit both screen and stage is significantly
    higher than average. Yes, looks are seductive, but in the long term it is what
    lies beneath that is the foundation of long relations.


    ### Eyes


    Lashed eyes are another sign of health. Besides being the window to the soul,
    large eyes in women are a definite plus in the looks department and have been
    for a long time, as Mark Antony found out when he visited Egypt in 41 BC. But
    here again we can take heart if we are not in the beauty queue when we were made.
    Cleopatra VII Philopator, although she knew the advantage of eye make-up, was
    better known in her time for her wit, intelligence and the sweetness of her voice.


    Perhaps here while we are talking about the eyes of a female, we should also mention
    the advice of Victor Hugo when he wrote:


    ‘When a woman is talking to you, listen to what she says with her eyes.’


    Although the variation in the maximum size of our pupils is individual, you can
    check if that special person you have just met finds you attractive by checking
    the change in their pupil size – providing, of course, you are not both in a dimly
    lit bar where you both have to dilate your pupils just to be able to see. Because
    of colour convergence, those with blue eyes are easier to ‘read’ than brown eyes
    and for that reason they disclose more of their feelings towards you. In the WASP
    world where females have more of a choice concerning eye colour, blue eyes are
    thought to be marginally more attractive than brown.


    Our eyes also become somewhat watery when we find someone attractive, which is
    yet another physiological reaction that is difficult to develop but easy to recognise.


    ### Glasses


    Early research found that wearing glasses[^(25)](#part0006_split_001.html#ch3ref25)
    has an interesting effect on the way that you are perceived. Men are rated more
    intelligent and also serious, conventional and hardworking, but less manly. Women
    are rated more intelligent, honest, serious and sometimes ‘dizzy’.


    ![Image](images/00016.gif)


    Which version of the same lady do you find more attractive?


    In their alter egos as Superman, Spiderman, Superwoman and Wonder Woman, none
    of the superheros wear glasses, despite tonnes of testosterone for the first two
    and an oestrogen explosion for the latter.


    For the same reason, we have grey hair and wrinkles after the age of 40, we begin
    to notice that our ability to focus on near objects begins to decline, and by
    that age, as our arms are fixed in length, glasses are the only way to go. This
    is the onset of presbyopia – such an unkind word, from first the Greek and then
    the Latin, meaning ‘old man eyes’. No wonder ‘men and women do not make passes
    at people with glasses’. I tell people that my glasses are to make them more attractive.


    ![Image](images/00004.jpeg)


    Take off your glasses to appear more attractive and younger because for most of
    us our vision declines with increasing age.[^(26)](#part0006_split_001.html#ch3ref26)


    ### Breasts'
