- raw: '*   By asking the right questions you will demonstrate that you are interested,
    rather than being focused on making a sale. This will increase the likelihood
    that the prospect/buyer will open up and that rapport will start to build.


    *   You will identify what really matters and what the core issues are that you
    can help to address.


    *   It gives you an element of control.


    *   It creates momentum, which is one of the core goals of every sales conversation.


    *   Questions encourage emotional involvement.


    ### Asking the right questions


    Here are seven core principles that will guide you to ask the right questions:


    #### 1 Start with an attitude of curiosity


    Any salesperson used to a consultative approach will use questions naturally.
    Asking intelligent questions comes from an attitude of curiosity. Think about
    it – you are on a ‘quest’ for information. Anyone who has kids knows that if they
    are curious about something they will quite naturally ask questions.


    Curiosity is infectious. You will soon find the person you are influencing becomes
    curious about their own situation!


    ‘The important thing is not to stop questioning. Curiosity has its own reason
    for existing.’ – Albert Einstein, German physicist


    #### 2 Have a clear outcome for your questions


    Ask yourself: what am I trying to achieve by asking questions? This avoids asking
    unnecessary or random questions.


    #### 3 Let the conversation flow naturally


    Good questioning techniques do not mean that you become an interrogator. Avoid
    the clipboard approach.


    #### 4 Use both open and closed questions


    *   Open questions start with who, why, what, how, where and when.


    *   Closed questions elicit a yes/no answer.


    There is no evidence that we have ever seen that open questions are more successful
    in making a sale. However, it is likely that you will start with open questions
    to elicit information and there will be more open questions in a typical sales
    conversation. Use closed questions for clarification and agreement.


    #### 5 Make your questions understandable


    I have heard many a sales question that is frankly unintelligible. Sometimes people
    use multiple questions, or ask a question and then answer it themselves, or ask
    a question that has no real link to what is being discussed. Make sales questions
    straightforward to understand – often the simple questions are the most powerful.
    Such as:


    *   What do you want?


    *   What are your key priorities?


    *   What is really going to make the difference?


    *   What is working for you?


    #### 6 Ask questions that help you pinpoint the dominant buying motivations


    Buying motivations and specific needs are not always the same. Buying motivations
    are about desires and feelings – they are more emotional and intangible.


    You can find out what motivates your buyer – what they want – by asking simple
    questions such as: ‘What kind of similar products or services have you bought
    in the past?’. The knowledge you gain will tell you what benefits to emphasise.


    #### 7 Avoid offending your buyers!


    Some questions can offend a prospect and cause them to reject you and your ideas.


    Avoid leading or ‘set up’ questions such as, ‘You do want your children to have
    a fair chance, don’t you?’. What is the prospect going to say? ‘No! It’s a tough
    world – let them sink or swim!’


    Nosey, gossipy or overly personal questions can be a real turnoff. Stick to business!


    Sometimes your manner can be threatening. Instead of asking, ‘How much do you
    want to spend?’, why not phrase it, ‘How much had you planned to invest?’.


    ### Focused questions


    ‘If you are not moving closer to what you want in sales (or in life), you probably
    aren’t doing enough asking.’ – Jack Canfield, US inspirational self-help author
    and success coach


    So – what areas of questioning are most useful? Research suggests that you will
    make the most impact if you focus your questioning around these nine areas:


    #### 1 Needs and wants


    This is absolutely central to the role of the salesperson. Find out more about
    specific questions that elicit needs and wants by reading the chapter ‘Identifying
    what the prospect wants and needs’ in Part 4.


    #### 2 Ask the buyer for selection criteria


    This is often avoided in sales, so take the initiative and find out who your contact
    is dealing with right now and who else they might be considering. This will elicit
    the buyer’s criteria and values and will help you align your service/product with
    what the organisation wants.


    The more you can align the values of the buyer with what you can provide in terms
    of service and delivery, the more you are likely to build a long-term relationship.
    I had a colleague once who was even more upfront. He used to ask: ‘What can I
    do to win your business?’.


    ‘Selling’ is closely linked in meaning to ‘serving’. The founder of a client of
    ours, Sodexo, based his whole strategy on the maxim ‘True dignity lies in being
    of service to others’. How can you be ‘of service to others’ unless you know how
    they like to be served?


    Here are some questions you might consider:


    *   What’s important in your commercial relationships with suppliers?


    *   How do you choose your current suppliers?


    *   How do you decide with whom to do business?


    *   What do you really value in a salesperson?


    ![image](images/00024.jpeg)


    Think about your own selling context. What other questions are there that would
    work well for you?


    #### 3 Options


    Discover what options your buyer is considering. If they are still at the options
    stage you can influence their decision making.


    Here are some questions you might consider:


    *   What sort of options are you looking for?


    *   Who are we up against?


    *   Who else will you be speaking with in regard to this decision?


    *   What have you been considering?


    ![image](images/00024.jpeg)


    Think about your own selling context. What other questions are there that would
    work well for you?


    #### 4 Your service/product


    You need to gauge the reaction to your service/product to find out if the buyer
    is likely to buy and what more information they need to make a decision.


    Here are some questions you might consider:


    *   What are your expectations/requirements for this product/service?


    *   Have you seen anything else on the market that you especially do not like?


    *   What further information do you need right now?


    *   If you do decide to go ahead, what sort of consequences will this have?


    ![image](images/00024.jpeg)


    Think about your own selling context. What other questions are there that would
    work well for you?


    #### 5 People


    Often a buying decision for an organisation will have implications for many people.
    We sell training, coaching and consultancy services at Brilliant Selling ([www.brilliant-selling.com](http://www.brilliant-selling.com)),
    and the people who could be implicated by any decision to use us include sales,
    HR, operations, marketing, senior management and the board.


    Here are some questions you might consider:


    *   Who will be involved if we progress to the next stage?


    *   How will people’s roles change if you decide to take this product/service?


    *   Who will be involved in the roll-out?


    *   What obstacles might be in the way of moving this forward?


    ![image](images/00024.jpeg)


    Think about your own selling context. What other questions are there that would
    work well for you?


    #### 6 Decision making


    I remember that I once had three meetings with someone and focused quite a lot
    of time and energy on the opportunity, before finding out that this person was
    not the decision maker. Have you ever done something similar? Find out what the
    decision-making process is and who is involved. This will allow you to focus your
    energy.


    Here are some questions you might consider:


    *   What can you tell me about your decision-making process?


    *   Who is the key decision maker within the business?


    *   How can we help support you internally?


    *   How much support does this have at the executive level?


    ![image](images/00024.jpeg)'
