    \  I wake up and feel a bit off colour. My immediate thoughts run as follows:\
    \ ‘Not good… not good. I haven’t felt okay for a few days now – perhaps there’s\
    \ something seriously wrong with me… Come to think of it my legs feel really heavy\
    \ and my hand was shaking the other day when I was reading that tax bill. I know\
