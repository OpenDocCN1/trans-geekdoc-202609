- raw: 'Certainly in Western culture, large breasts are attractive to men because
    the research suggests a top breast to under breast ratio indicates that a female
    enjoys a greater level of estradiol, a sex hormone critical for fertility. Breast
    position is also an excellent and obvious sign of fertility^([27](#part0006_split_001.html#ch3ref27))
    and men, as we all know, at a basic level are driven to reproduce, which explains
    all those vain attempts at surreptitious staring.


    ### Male and female voices


    Here we go back to Darwin^([28](#part0006_split_001.html#ch3ref28)) again when
    he wrote:


    ‘Although the sounds emitted by animals of all kinds serve many purposes, a strong
    case can be made out that vocal organs were primarily used and perfected in relation
    to the propagation of the species.’


    Most men show an enhanced preference for women with high-pitched voices – remember
    Ms Monroe when she sang ‘Happy Birthday, Mr President …’? Women, on the other
    hand – although not so strongly affected by voice pitch – by and large prefer
    men with deep voices.


    Interestingly, women with a higher pitched voice are also blessed with a more
    attractive face and in men it is the reverse. All this is to do with hormone levels
    – mainly testosterone – because it suggests dominance (or lack of), fertility,
    health and attractiveness.


    ### Skin


    Skin is the body’s window on health, and healthy people are attractive people.
    Even in some primates their skin indicates social-sexual availability to potential
    mates. Because skin blood perfusion reflects cardiovascular health,[^(29)](#part0006_split_001.html#ch3ref29)
    the fitter we are the more attractive we are, and this holds true for both sexes.
    At a very basic level both males and females want/need to procreate and a fit
    person is the best bet to satisfy this need.


    Have you ever wondered why the higher-ranking women (power, status, resources,
    etc.) in societies from the US to India and most places in between have, in the
    main, fairer skins?^([30](#part0006_split_001.html#ch3ref30)) By and large powerful
    men prefer fair skin in a female, whilst females of any status are indifferent
    or have a slight preference for males with a darker skin. This is the basic hair
    colour protocol for maidens and heroes of the corset-ripper genre of ever-popular
    romantic novels. The natural outcome of generations of men acting on this sexual
    proclivity has been fairer and fairer children.


    All this might eventually change, with Hollywood enjoying a Mediterranean climate
    and producing sun-tanned beauties for the screen, and the advent of profitable
    spray tan parlours and the associated advertising which tell us that ‘Bronze is
    Beautiful’.


    ### Personal aroma


    Body odour (BO), even if it is sweet smelling, is a somewhat taboo topic, but
    it has a very significant place in body language and attractiveness. In all cultures
    BO resulting from a lack of personal hygiene has a strong adverse effect on another
    person of either sex, usually resulting in rejection.


    What has this to do with attractiveness? Pheromones play a large part in physical
    attraction, especially the pheromone called androstenone.


    Personal scents can attract; fresh sweat on males is attractive to females, not
    only because of the male pheromone androstenone[^(\*)](#part0006_split_001.html#ch3fn2)
    but also because it is an indication of good health and virility. However, our
    personal odour, given off by our pheromones, is as unique as our signatures on
    our bankcards – much to the chagrin of the escaping prisoner when the dogs pick
    up and identify his individual scent from all the others on his escape route.
    We may not be as astute as man’s best friend, but 95 per cent of us given personal
    odour alone can tell whether it originates from a male or a female.


    A recent study^([31](#part0006_split_001.html#ch3ref31)) suggests that women who
    are exposed to different male sweat scents responded to them differently. Perspiration
    from men watching ‘educational’ videos stimulated different parts of the female
    brain than the sweat produced when men were watching another type of video. This
    suggests that women can identify, through odour, a man who is interested in her.


    Unfortunately for the males amongst us, women are not as skilled in this area
    as lepidoptera (moths and butterflies) where some species can, at six miles in
    any direction, recognise a suitable mate.


    For attractiveness, any perfume with musk would appear to be the winner. Women
    are more sensitive to it than males but even they can detect it in one part per
    100,000, and the fairer sex are more likely to respond to it during ovulation
    since the oestrogen hormone makes the odour very attractive. So if you want to
    be more physically attractive, go for musk. (See when you should break this rule,
    on page 50.)


    ### Pheromones


    Pheromones[^(\*)](#part0006_split_001.html#ch3fn3) work for bats, pigs, elephants
    and mice, sending real non-verbal messages to one another indicating fear, membership
    of a social group, that they are sexy or that they can induce a female to be ready
    for sex. All this sounds great but, unfortunately, irrespective of your gender
    preference if you are human you lack the essential equipment to practise this
    advantage on someone you find attractive. The animals mentioned above, and almost
    any animal that has fur or hair, have the advantage of a piece of equipment located
    in their nose which has been christened by scientists as the vomeronasal organ
    (VNO). Pheromones wafting past this funny sounding organ are recognised and delivered
    to the brain. Humans also have a VNO but unfortunately, or fortunately, depending
    on your proclivities at the time, it does not work as well as it should. Rather
    like our toes – they are there but are not as useful as those of our primate ancestors.


    But hope is on the horizon; there has been some research by two Nobel-Prize-winning
    scientists collaborating at Harvard^([32](#part0006_split_001.html#ch3ref32))
    that all is not lost – we share a gene with the humble mouse that is essential
    to pheromone detection – so watch, not smell, this space and don’t be taken in
    just yet by the marketing hype, even if you are looking for a partner.


    ### Legs


    Secretly, many women want to make their legs look longer, as longer legs equal
    greater sex appeal.[^(33)](#part0006_split_001.html#ch3ref33) Many things happen
    when a girl advances into puberty, but for the male of the species she becomes
    a potential mate. At the same time the growth hormones kick in, especially in
    elongation of a females’ legs. In the simple male mind, and of course at a sexual
    level (most males do tend to be very simple beings) long legs equal reproductive
    readiness.


    ![Image](images/00017.gif)


    An example of lordosis in action, but note the arms akimbo, not in aggression,
    but to lift the bust.


    So for women, high heels and, if she can get away with it, a short skirt says
    to the deep level[^(\*)](#part0006_split_001.html#ch3fn4) of the male brain ‘reproductive
    ready’. Heels give the impression of lordosis, because they give an inward curvature
    to the spine which in turn pushes the bottom out, which is another sign of post
    pubescence. As experienced beach Romeos have come to recognise, high heels are
    not always necessary for lordosis to occur. Most women, if they find a man physically
    attractive, will curve their back by going up on their toes without being conscious
    of what they are doing.


    ### Male body language and partnering


    Males compete for the attention of the female, so when they are in a pack they
    will compete for air time. It does not matter what they say, as long as they are
    reducing the air and vision time of other male suitors. So, like the peacock’s
    sexual display, men want to appear physically bigger;^([34](#part0006_split_001.html#ch3ref34))
    the shoulders go back, the chest is pushed out and the hands are either pronated
    (with the knuckles turned outward to enhance the ‘V’ shape) or are placed on the
    hips.'
