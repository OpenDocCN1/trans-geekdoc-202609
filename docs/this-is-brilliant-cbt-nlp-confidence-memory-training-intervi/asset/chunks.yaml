- raw: 'You and others around you will slowly notice a change in you as you take control
    of your behaviour in response to triggers that may in the past have produced a
    negative response. Being aware of the anchors that trigger your responses, being
    able to change them and having the techniques to create brilliant new anchors
    gives you more control over your emotional states, your relationships and your
    life.


    ### Fixing your phobias


    Phobias are exaggerated anchored responses to everyday situations. They can cause
    muscle tension, hyperventilation, perspiration and dizziness. When a phobic response
    is being experienced, your internal dialogue and imagery will be predicting dire
    consequences. Phobias are irrational fears – as opposed to the rational fears
    caused by things that actually happen, such as the house being on fire. Because
    phobias are irrational, they are relatively easy to overcome.


    NLP is very effective at fixing all kinds of phobias, including fear of bridges,
    confined spaces, open spaces, flying, lifts, spiders, bees, birds, frogs and snakes.
    This even extends to phobias about wet hair in the shower plughole, or oranges
    and bananas.


    In our experience, many people try to hide their phobias and avoid situations
    where they may have to face their fear. That is because they perceive their problem
    as being ridiculous and try to avoid the embarrassment caused by their reaction.
    At a deep level, this can have an adverse effect on self-esteem, as a phobia is
    often thought of as a weakness.


    Underlying any phobia is a belief about what will happen in the situation causing
    the phobia. For example, when Paul was a teenager, he choked on an orange. Over
    time, he unconsciously anchored a negative response to that experience. Eventually,
    this became a phobic reaction to oranges, to such an extent that he had to leave
    the room whenever someone began to peel an orange. He believed that if he ate
    an orange he would choke.


    The test for whether a person has a phobia or not – as opposed to being merely
    very concerned – is that he or she will react very physically to even the thought
    of the fear. Because it is the thought that produces the reaction, it can be eliminated
    without having to relive the experience.


    If a phobia is affecting your enjoyment of life and/or your self-esteem, use the
    following technique – it has a very high success rate. We suggest that you familiarise
    yourself with the procedure before using it. This will enable you to complete
    the exercise without the distraction of referring to the notes.


    ![image](images/00003.jpeg)


    During one of our programmes, Colin, a delegate, moved the curtains to shade us
    from the sun. As he did so, a large spider ran out and Colin virtually flew across
    the room and out of the door. Another delegate removed the spider and Colin returned
    to his seat, highly embarrassed. He explained the strength of his phobia and we
    suggested that, if he would like to deal with it, we could do so very quickly.


    After a 10-minute phobia fix, Colin asked if he could go and find a spider. We
    found one in the conservatory and he was quite happy to stand and look at it from
    a distance of 6 cm (2½ inches).


    ### Fast phobia fix


    We are going to ask you to do a few things very quickly in your mind so that your
    phobia will never bother you again.


    1.  Imagine that you are sitting in a cinema and, on the screen, there is a black
    and white still picture in which you see yourself just before your last experience
    of having the phobic response.


    2.  Now imagine that you are floating out of your body and up to the projection
    room, where you can see yourself sitting in the cinema. You can also see yourself
    in the still picture on the screen.


    3.  Turn the snapshot on the screen into a black and white film and watch it until
    just after the unpleasant phobic experience. When you get to the end, stop it
    as a still. Now jump inside the picture and run it backwards in colour. Everything
    in the film will happen in reverse – people walking backwards, talking backwards
    and the scenery moving backwards.


    4.  This completes the exercise. Take a few deep breaths and test the results
    by thinking about what it was that you used to be phobic about.


    ### Reframing


    The exercises in this chapter will have helped you to work with the emotions attached
    to your thinking and given you access to your inner resources. There may be times
    when the way you are thinking is creating a barrier. You can change your perspective
    completely by reframing this kind of thinking in a number of ways. In the same
    way that placing a new frame around a picture can give it a whole new appearance,
    placing a new frame around your thoughts can give you a very different perspective.


    ![image](images/00003.jpeg)


    Frank was ‘at his wits’ end’ (his words) regarding trying to get his youngest
    son, Timmy, to keep the house tidy. The relationship became increasingly strained
    as Frank continued to lay down the law. He often raised his voice and Timmy responded
    by retreating into silence and making himself scarce. The situation became progressively
    worse and Timmy’s performance at school suffered. Frank explained that he was
    lost for a way to help Timmy ‘get his act together’. Timmy was getting a hard
    time from his dad and his falling marks at school were a direct result of stress.


    We offered Frank the following reframe:


    ‘It appears that you have been pushing Timmy to meet a certain standard of tidiness,
    which is causing him a good deal of stress and creating distance between you.
    His untidiness may, in fact, be a phase that kids of his age go through and a
    sign that he’s behaving normally. By letting him be a normal teenager, you might
    find that Timmy is not so stressed and is better able to focus on his schoolwork.’


    In short, Frank was offered a reframe that moved him from thinking ‘my boy is
    untidy’ to ‘my boy is untidy, which is normal behaviour for any teenager’. It
    helped Frank to realise that his behaviour towards Timmy had caused the breakdown
    in the relationship between them. He immediately stopped hounding him about being
    untidy and started to help him more with his schoolwork.


    This type of reframe changes the meaning of the situation. Another type of reframe
    shifts the meaning between contexts. For example, a person who may be highly critical
    of other people’s ideas might be perceived by his team as being difficult or negative.
    The presence of a critic on the team can be very useful, however, when evaluating
    ideas resulting from a creative brainstorm. It’s not that the behaviour of the
    critic is a problem, it’s more a case of knowing how best to use that particular
    skill. This type of reframe puts the behaviour in a positive frame in another
    context.


    A common cause of frustration in couples is demonstrated in the next example.


    ![image](images/00003.jpeg)


    Fiona likes to be on time and is obsessive about dates, times, schedules and lists.
    Mike, Fiona’s partner, is the exact opposite, preferring to take a more relaxed
    and laid-back approach to life. Mike was feeling torn, wanting to please Fiona
    while at the same time being unable to rationalise the pressure she was putting
    him under.


    After some coaching, Mike realised that Fiona’s ability as an organiser was useful
    in many ways, including remembering family birthdays, shopping, planning holidays
    and generally running the family very effectively. Having reframed his thinking
    in this way, the pressure eased. It was attached to the way he had been thinking,
    not to the circumstances.


    #### Don’t think that, think this!


    Any reframe is simply saying, ‘Don’t think of it that way, think of it this way’,
    ‘It’s not that, it’s this!’ You can apply simple reframes to all kinds of situations
    that are not working out as you would like.'
