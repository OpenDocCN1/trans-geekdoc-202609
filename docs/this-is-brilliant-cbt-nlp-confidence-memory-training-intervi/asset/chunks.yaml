    Next time you go to the newsagents pick up a magazine about a subject that you
    know nothing about and flick through it. Broadening our horizons and knowing what
    is happening in the media and around the world opens up paths of conversation
    that otherwise would have remained closed. Read your industry publications as
    well as a quality broadsheet and tabloid so you have a spectrum of views.


    ## How to end a conversation


    Even though we might enjoy a conversation, at some point it is obvious that both
    parties have run out of interesting things to say and the conversation has lost
    its purpose. Below are some ideas for ending a conversation gracefully.


    ### Connect them to someone else


    Rather than abruptly leaving a person standing or sitting, which is plain rude,
    one of the best ways to leave a conversation is to connect the person to someone
    else in the room by making an introduction. This might mean saying, for example,
    ‘Paul, I would like to introduce you to Niall who is an accountant. Niall, this
    is Paul who is a lawyer for Global Bank.’


    Once the introduction is made, you step out and walk away. Done naturally this
    gives a good chance for you to meet someone else and also for the person you left
    to make a new connection with somebody they just might have more in common with
    or gain information that could be of benefit.


    ### Give a plausible reason to leave


    For example: ‘I’m really sorry, I’ve enjoyed our conversation, but I need to check
    whether my friend has arrived. It was great speaking to you and I hope you enjoy
    the evening.’ Or ‘I’m really sorry but I must go because I need to speak to Jack
    before he leaves. It was great speaking to you. Can I introduce you to our sales
    manager before I go?’


    ![image](images/00004.jpeg)


    Apply the five-minute rule. Five minutes is generally long enough to start a conversation
    and to ask questions to find mutual interests. If there are no obvious synergies,
    thank the person you are speaking to and exchange contact details. Never leave
    the person alone but again introduce them to someone whom you have met earlier
    who you think would be a useful connection or look to bring someone else into
    the conversation. You never know when someone can help you. Later on down the
    line that person could be the one individual you most need to know. Always be
    respectful and mindful, and don’t forget to exchange contact details.


    Finally, before you leave any event make sure that you have said goodbye and thanked
    the host. Often the host will be circulating but it is vital feedback and appreciation
    which will lead to more invitations. Double check that you have met everyone you
    wanted to and then leave. If you are done, avoid hanging around or lingering until
    the very end. Not only is this an inefficient use of your time but the hosts might
    be wanting people to leave so they can wrap up the event and clear the venue.


    ## Ask for what you want


    The reason you are networking is to accomplish your goals and so no matter how
    well a conversation is going it is important that you ask for what you want. Asking
    for what you want is powerful but it also needs to be done in such a way that
    it will give you the information you need.


    In their book The Power of Networking (1999), Sandy Villas and Donna Fisher suggest
    using the question ‘Who do you know who…?’ rather than ‘Do you know anyone who
    …?’ to make a request. The latter can be answered with a closed yes or no, ending
    further conversation. By asking the former question the person is forced to think
    of people they know.


    Some other powerful networking questions that Villas and Fisher highlight are:


    *   ‘Who do you know who I should know (given the following circumstances)…?’

    *   ‘Who do you know who knows…?’

    *   ‘Who do you know who would benefit from…?’

    *   ‘Who would you recommend I contact about…?’

    *   ‘I am looking for… Who do you know who…?’

    *   ‘I would like to know the names of people you know who…?’


    Asking the right questions opens up new possibilities to further your networking
    goals.


    ## Share your goals early


    As a general rule, when time is short at an event, it is important to share your
    goals early. You might enjoy the company of the person and want to spend more
    time with them on a future occasion, but it is important that you try to meet
    as many people as possible – without being rude and without spoiling the event
    for yourself.


    You need to strike a balance. Networking should be as enjoyable and fun as meeting
    new friends, not a stressful race akin to a non-stop, one-day tour of several
    capital cities in the world. This is where the value of knowing in advance who
    is going to be at an event allows you to focus your attention. Be open to serendipity
    and to all you meet. It could be the person in the lunch queue who introduces
    you to your future partner. The key is to be open and ready to connect to everyone.


    ## The hard sell


    Perhaps one of the main reasons that networking has a bad name is because of individuals
    who approach you like pit-bull terriers, promoting their products shamelessly
    and not letting you go until you have either signed up or promised to let them
    contact you with further information.


    When you approach someone at a networking event – although it is important to
    be clear about what you do and can offer – the aim is to develop a long-term relationship,
    not simply make a quick sale. When networking, ensure you are making requests,
    not demands.


    ## Networking requests


    | Demanding || ‘I need you to give me…’ |

    | --- | --- |

    | Empowering || ‘I am looking for… and thought you might…’ |

    | Vague || ‘I would like to contact good prospects for my business.’ |

    | Clear || ‘My ideal client is… Who do you know who…?’ |

    | Manipulative || ‘If you will… I will…’ |

    | Empowering || ‘I have some people to refer to you who… and keep me in mind when
    you meet people who…’ |

    | Hesitant || ‘I know you’re busy and probably won’t have time and I don’t want
    to bother you, but…’ |

    | Straightforward || ‘I would like your assistance, if possible. Any amount of
    time you can give me will be appreciated.’ |

    | Too broad || ‘I am looking for a job. Who can you recommend that I talk to?’
    |

    | Specific || ‘I am looking for job with a… company that can use my … expertise.
    Who do you know who…?’ |

    | Confusing || ‘Do you think you could help me sell some of my widgets to people
    who have gadgets?’ |

    | Clear || ‘I want to contact people who are looking for widgets to better… Who
    do you know who I could call?’ |


    From The Power of Networking (1999) by Sandy Villas and Donna Fisher, Thorsons.


    ![image](images/00004.jpeg)


    Before making a request take a moment to think about what you really need and
    refine your request so that it meets the criteria in the box opposite. Think about
    how you can also assist the other person with a need they might have.


    [![Image](images/00050.jpeg)](http://www.amazon.co.uk/Brilliant-Networking-2e-networkers-ebook/dp/B00A8N8JDO/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320689&sr=8-1&keywords=brilliant+networking)


    ![Image](images/00051.jpeg)


    When I was learning to be a coach my trainer told me that ‘questions are the answer’.
    It is much the same with selling. You cannot sell well without gathering information
    and it is tough to gather information without asking questions. Yet, according
    to a study by the Sales Career Training Institute, salespeople typically spend
    too much time pitching and not enough time asking the right questions so that
    they can discover the prospect’s/buyer’s real concerns and issues, as well as
    the hot buttons they need to press to get someone to buy.


    ‘Judge others by their questions rather than by their answers.’ – Voltaire, French
    writer and philosopher


    So, what are the benefits of asking the right questions?

