- raw: "Take control of the conflict situation by being the one to conclude it. Have\
    \ the moral courage to offer an ultimatum if you think it’s warranted. Try to\
    \ end it on your terms but be prepared to compromise if you judge it to be fair\
    \ and necessary. If you’ve decided to contest the issue, never walk away without\
    \ either solving it or agreeing a next step.\n\n![image](images/00003.jpeg)\n\n\
    Naomi\n\nNaomi was rather like Rob in her approach to dealing with difficult people.\
    \ Her instinct was to give in rather than hurt someone’s feelings or, even better,\
    \ to avoid the conflict altogether in the hope that it would go away.\n\nThe trouble\
    \ was, she’d tried both these approaches and still she kept coming into conflict\
    \ with a particular person (Marie). They were both managers of a call centre team\
    \ dealing with holiday insurance. They worked different shifts and as a result\
    \ didn’t see much of each other.\n\nNaomi had got to the point where she felt\
    \ the team was suffering due to Marie’s insistence on shaping the way it operated.\
    \ Naomi would regularly come in to work and find that Marie had introduced a new\
    \ procedure that she knew nothing about. Not only did Naomi feel this was unprofessional\
    \ because they were supposed to be managing the team jointly, she also felt that\
    \ some of these new procedures were wrong and inefficient.\n\nNaomi decided to\
    \ try out the three-step plan to deal with Marie. She had to summon up a significant\
    \ amount of courage to do this because it meant going completely against her instinct.\
    \ The first thing she did was arrange a meeting with Marie. She explained beforehand\
    \ that the reason for the meeting was to talk about the most recent new procedure\
    \ Marie had introduced.\n\nStep 1 was easy for Naomi – all she had to do was look\
    \ Marie in the eye, listen and take in exactly what she said. She didn’t even\
    \ have to invite Marie to speak because she immediately launched into justifying\
    \ why she’d introduced the new procedure. Naomi also made a point of taking some\
    \ notes while Marie was speaking. They were just far enough away from each other\
    \ so that Marie couldn’t read them. Naomi noticed her looking down at them every\
    \ now and then. This made her feel more confident; she was sure she detected a\
    \ sense of unease in Marie’s behaviour.\n\nStep 2 was harder – Naomi had to deliver\
    \ her points; this was against her natural inclinations. She waited until Marie\
    \ had finished. She finished the note she was taking and looked up. She let the\
    \ silence extend. Just as she sensed Marie was about to start talking again, she\
    \ spoke up. She started by summarising what Marie had said (her notes were helpful\
    \ here). She explained clearly why she felt the procedure wasn’t working and suggested\
    \ another solution. At one point Marie tried to interrupt. Naomi said very assertively,\
    \ ‘I’ve listened carefully to your points – I would like to finish explaining\
    \ mine please.’ Marie stopped talking immediately.\n\nNaomi didn’t let Marie interrupt\
    \ until she’d finished. They then had a discussion. Naomi was clear in her mind\
    \ right from the start that she wouldn’t give in. She’d thoroughly researched\
    \ her argument and was prepared to stand up for it. She was surprised to see that\
    \ after a while, Marie backed down and, believe it or not, accepted it.\n\nStep\
    \ 3 went well too – Naomi kept the initiative by explaining she didn’t feel it\
    \ was in the best interests of the team for Marie to make decisions without involving\
    \ her. She proposed that from now on they meet once a week so that they could\
    \ manage the team more effectively together. Marie seemed a little wary of this\
    \ idea but agreed to it in the interests of the team.\n\nNaomi found that subsequently,\
    \ over time, her working relationship with Marie improved. It was never fantastic\
    \ but the change in her approach to dealing with the conflict with Marie made\
    \ a huge difference. Marie started to get used to this and in time even admitted\
    \ privately that she respected Naomi more for it and found it easier to work with\
    \ her because she ‘knew where she stood with her’.\n\nThese tips should also help\
    \ you to stop conflict escalating when you encounter it:\n\n*   Ask yourself whether\
    \ it really matters that much – in other words, is it worth getting into an argument.\
    \ What’s the worst case scenario?\n\n*   Change the subject – stop talking about\
    \ it.\n\n*   Don’t repeat it to others to make you feel better or just to get\
    \ it off your chest.\n\n*   Put yourself in the other person’s shoes – see it\
    \ from their side.\n\n*   Choose not to associate with negative people or people\
    \ who argue for argument’s sake.\n\n*   Focus on fact, not emotion.\n\n*   Clear\
    \ your mind. Get out of the environment, go for a walk or do some physical exercise.\n\
    \n*   Compliment the person. Some people are very susceptible; you might find\
    \ that just being nice can help you to win the argument or get your way.\n\n*\
    \   Acknowledge that you’ve heard the other person’s point of view. Some people\
    \ just need to know that you’re listening and you understand their concerns.\n\
    \n*   Use open-ended, not closed questions. An open-ended question invites discussion,\
    \ a closed question invites a yes or no answer. For example: \n\n    *   Open-ended\
    \ question – ‘How did you think that meeting went?’\n\n    *   Closed question\
    \ – ‘Did you think that meeting went well?’\n\n*   Manage the person’s expectations;\
    \ don’t promise you can do everything. If you say you’ll do something, make sure\
    \ you can and will do it. You’ll gain more respect and people will know where\
    \ they stand with you.\n\n*   Email – don’t send emotionally charged or angry\
    \ emails. Try to deal with the issue face to face. If you have no choice and must\
    \ reply to someone by email, try writing the email first but not sending it. Have\
    \ a break and cool down, then have another look at it. Don’t send it until it\
    \ is written in a controlled and professional way. It could backfire on you otherwise.\n\
    \n*   Sleep on it – it’s amazing how a night’s sleep can put a different perspective\
    \ on a disagreement.\n\n#### Have no fear!\n\nThere should be no need for you\
    \ to fear conflict at home or at work from now on. You’ll feel more confident\
    \ to deal with disagreement if you try to see it as something that’s bound to\
    \ happen from time to time – you might not be able to stop it happening but you\
    \ can deal with it. Approach it as a natural phenomenon that’s part of life. It’s\
    \ a fact that people behave and think differently and therefore, on occasions,\
    \ they’ll disagree with each other.\n\nThat’s actually a good and positive thing\
    \ – if we were all the same, we would progress as a race of people at a much slower\
    \ rate. It’s proven, for instance, that the most successful teams are the ones\
    \ with the most diverse mix of personalities, knowledge and intelligence. The\
    \ key to real success is understanding how to turn any differences of opinion\
    \ (conflict) into agreement and effective action.\n\nIf you really think about\
    \ it and try to analyse why conflict occurs, more often than not you’ll come to\
    \ the conclusion that it stems from differences in personal style and approach.\
    \ A disagreement may start as a result of differences in opinion but the escalation\
    \ to conflict often comes as a result of differences in behaviour and personal\
    \ style. In extreme cases the differences in opinion are completely forgotten\
    \ and the clashes in style and behaviour take over as the core conflict issue\
    \ itself.\n\n![image](images/00004.jpeg)\n\nExpect disagreements to happen. Your\
    \ challenge is to deal calmly with each situation so that it doesn’t escalate\
    \ to conflict. Remember the three key steps: Wait, Deliver, Take the initiative.\n\
    \n#### Are you just plain shy?\n\nAnother common denominator between confidence\
    \ at home and at work is shyness."
