    Emotive language is one of the main reasons why people end up convincing themselves
    that they will be unable to tolerate situations that they have perfectly adequate
    resources to cope with:


    *   ‘It would be the worst thing if people laughed at my performance. I would
    look like such an idiot’.


    *   ‘I wouldn’t be able to live with myself if anything happened to her.’


    *   ‘It would be simply awful to end up alone… .’


    Be careful that when you describe past or future events to yourself you do not
    prejudice yourself: this is counterproductive. It is very hard to think objectively
    about a scenario that has already been given a strong emotional inflection and
    it is often our language that colours our perceptions and feeds our anxieties
    and low moods.


    *   When thinking or talking about emotionally inflammatory scenarios check your
    vocabulary and make sure you are not throwing fuel on the fire of your negative
    thoughts.


    *   Strive to achieve the most neutral, objective tone that you can.


    *   When recalling distressing events imagine that you are writing a bulletin
    for a news broadcast that requires you to assume a detached, objective perspective.


    ![image](images/00006.jpeg)


    ### How brilliant are you at spotting thinking errors?


    The following quiz is designed to see whether you can use your knowledge to identify
    which common thinking errors are being committed in these examples. Remember,
    you are looking for cases of the following:


    *   catastrophising


    *   polarised ‘black and white’ thinking


    *   rigid thinking


    *   excessive self-blame


    *   unrealistic blame of others


    *   filtering


    *   magnifying


    *   mind reading


    *   emotive language.


    Be aware that some of these thinking errors are not mutually exclusive and you
    may find more than one in the same example.


    Also, as you run through the list try to speculate about the emotions that might
    be associated with the type of thoughts and behaviours described. (The answers
    are on [page 57](#part0004_split_001.html#ch01-page_57).)


    1.  A man is invited to a party to celebrate a colleague’s recent promotion. He
    crumples the invite and chucks it in the bin. He thinks: ‘Joel must be feeling
    pretty pleased with himself now that all his scheming has paid off. Ever since
    he arrived he has been making trouble and trying to edge me out. Look at the way
    he struck up that friendship with the supervisor – what a reptile! I can still
    hear the sarcasm dripping from his voice when he said how “sorry” he was that
    I didn’t get enough recognition for the Johnson deal. I bet he has been spreading
    all kinds of lies and rumours about me. Of course this means I will probably never
    get promoted and I will spend the rest of my life pushing paper in this bloody
    dead-end job.’


    2.  I wake up and feel a bit off colour. My immediate thoughts run as follows:
    ‘Not good… not good. I haven’t felt okay for a few days now – perhaps there’s
    something seriously wrong with me… Come to think of it my legs feel really heavy
    and my hand was shaking the other day when I was reading that tax bill. I know
    Jill thinks it’s just because I have been working really late and I’m a bit run
    down but what if it’s multiple sclerosis? I know that someone on my mother’s side
    had MS. Oh God! Now I can feel these weird tingling sensations in my fingers.
    What’s happening to me?’


    3.  ‘There’s just no excuse for behaviour like that… The way she spoke to you
    was simply unforgivable. We have always had Christmas at your mother’s. It’s a
    family tradition. What was she thinking? Young people are all the same: no respect
    for their elders.’


    4.  ‘If she says no I know I just won’t be able to cope. I would be so embarrassed.
    I’m going to make a fool of myself and it will all be for nothing. Why would she
    want to go to the dance with me anyway? I am sure she would much rather go with
    Kieran… She probably only said she liked me because she felt sorry for me.’


    5.  ‘Everything’s ruined. I’ve just made a complete mess of things. I just played
    one wrong note after another and I know I cocked up the rhythm in that middle
    section completely. They all expected me to get a distinction and I barely managed
    to scrape a merit. They are going to be so disappointed in me. Maybe I should
    give up the piano altogether. What’s the point in struggling on when I obviously
    don’t have any talent for it?’


    ### Homework: getting personal


    Over the next week keep a record of your upsetting thoughts. Carry a notebook
    with you and write them down as soon as you can, using the same phrasing and images
    that run through your mind at the time.


    Once you have collected a good sized sample of your thinking go carefully through
    your log and see whether you can find evidence of the kind of thinking errors
    described in this chapter. Once you become aware of the cognitive habits that
    may be strengthening your negative thought patterns it becomes much easier to
    start breaking them.


    Answers: 1) mind reading, filtering, emotive language, blaming, magnifying, catastrophising;
    2) magnifying, filtering, catastrophising and emotive language 3) generalisation,
    polarised thinking, rigid thinking, emotive language; 4) emotive language, catastrophising;
    5) emotive language, generalisation, polarised thinking, filtering, magnifying,
    mind-reading.


    [![Image](images/00007.jpeg)](http://www.amazon.co.uk/Brilliant-Cognitive-Behavioural-Therapy-ebook/dp/B00AQW931Y/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320605&sr=8-1&keywords=brilliant+CBT)


    ![Image](images/00008.jpeg)


    Your mind will represent your thinking in pictures, sounds and feelings and sometimes
    even smells and tastes. The quality and detail of your representations will vary
    according to whether your thoughts are positive or negative. Knowing how you represent
    your thoughts, of which values, metaprogrammes and beliefs are a part, will help
    you make the changes you want in areas where you would like to improve your results.


    When you feel anxious, uncertain, confused, angry or frustrated, you become tense
    and stressed. Being in that state prevents you from accessing all your wonderful
    inner resources. Whatever situation you are in, if you are feeling any of these,
    it is unlikely that you are performing to your full potential. Think of a time
    recently when you were feeling stressed and recall what was on your mind. Your
    thoughts were responsible for creating your feelings. Every thought you have results
    in a feeling, so the way to control your feelings is to control your thoughts.


    Test this out. Sit quietly and think of a situation where you did something that
    you didn’t feel so good about. Notice what feelings come up. Now take a deep breath
    and think about a situation where you did something that you felt really good
    about and, again, notice the feelings that come up.


    You have just used your imagination to recall two experiences that resulted in
    very different feelings. You can use the connection between your imagination and
    your feelings to put you in control and enable you to choose the way you feel.
    Your feelings have a direct impact on your capability, regardless of the situation.


    ### It’s the first thought that counts

