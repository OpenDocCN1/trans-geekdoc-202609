    attractive, will curve their back by going up on their toes without being conscious
    of what they are doing.


    ## Male body language and partnering


    Males compete for the attention of the female, so when they are in a pack they
    will compete for air time. It does not matter what they say, as long as they are
    reducing the air and vision time of other male suitors. So, like the peacock’s
    sexual display, men want to appear physically bigger;^([34](#part0006_split_001.html#ch3ref34))
    the shoulders go back, the chest is pushed out and the hands are either pronated
    (with the knuckles turned outward to enhance the ‘V’ shape) or are placed on the
    hips.

