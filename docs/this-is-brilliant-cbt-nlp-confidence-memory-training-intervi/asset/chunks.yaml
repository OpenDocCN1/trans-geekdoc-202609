- raw: 'Remember the to-do list you learnt in Chapter 5? Rather than just remembering
    to go to the bank, you could now leave yourself a reminder to withdraw £40 (a
    wet tennis ball on the bank teller’s desk) from account number 7523 (a glowing
    hook stuck into a floating tree in the lobby). You’ve already got multi-layered
    imagery to remind you about Scott’s birthday card, and now you can include a reminder
    about his address (a lollipop (9) and a rose (3) sticking out of the model castle
    on the card). He lives at 93 Castle Street.


    ### Personal numbers


    Lots of other numbers you need to know – birthdays, phone extensions, team numbers
    – are linked to people; so, to learn them, you need sound strategies for remembering
    names. And names are a very powerful example of the complexities of memory. The
    names you know well are some of the easiest things to recall, but new names can
    be hard to hold in your head even for a few seconds. Your right brain helps you
    to recognise faces you’ve seen before; your left brain should lead you to the
    details of their name; but bringing the two sides together – often under time
    pressure and amidst a range of distractions – can be frustratingly hard.


    ### Did you know?


    Context is particularly significant when you’re trying to remember names. Memory
    relies a great deal on expectation. You know you’re likely to meet your colleague
    Sarah in the corridors at work, but when you bump into her in the middle of town
    it’s so much harder to remember who she is, let alone what she’s called. We also
    expect people to look a certain way – so any changes in hairstyle or clothing
    can play havoc with our memory. It’s one of the reasons why people are so hard
    to remember: they change location and appearance, and your natural memory needs
    lots of artificial help.


    #### Expecting to forget


    Another reason why names are so tricky is that we try to learn them in the worst
    possible conditions. Your memory training should have shown you the importance
    of taking control: deciding to use your memory well, making a clear plan about
    how to do it, and utilising your whole brain to fix information firmly in your
    mind. But when it comes to learning names, all too often we:


    *   assume it’s going be impossible


    *   do nothing to improve the quality of the information that’s given to us


    *   rely on nothing more than our natural recall


    No wonder names prove to be such a problem.


    The solution is contained in the seven steps of memory making. Now more than ever
    you need clear strategies for taking charge of challenging situations, and active
    learning techniques to get your brain working brilliantly.


    ### Remembering names


    #### Step 1: Deciding


    You have to assume that you’re going to remember the names you come across and
    the people you meet: not just by trying harder, but by doing it better. You need
    to concentrate from the start and put in the right sort of effort – and you need
    to prepare yourself to find the space and time to do it properly. Going into any
    name-learning situation, you’ve got to be very clear about what you want to get
    out of it, and what you’re going to do to make your memory work.


    #### Step 2: Strategising


    Your strategy for success needs to kick in the moment you hear someone’s name
    – because, unless you listen carefully, your memory really doesn’t stand a chance.
    It’s hard enough to stop and focus on the names we read, but in real-life situations
    they’re often fired at us so quickly or quietly or while we’re so busy shaking
    hands or thinking of something to say that they’re extremely hard to take in.
    At business events or on social occasions there are usually numerous other distractions,
    too: in the room around us, but also within us – nerves, excitement, our eagerness
    to please … Even when we’re just reading names in a document our brains are often
    too busy with other things to take much notice. So the first stage of remembering
    people has to be looking and listening, concentrating on a name, actively taking
    it on board and starting to do something with it. It’s an area of learning where
    we can often be extremely strategic, choosing exactly whom to remember – and how.


    ![image](images/00004.jpeg)


    Be interested in names, ask how they’re spelt, what they mean. Repeat them immediately:
    ‘Hello Chris, really nice to meet you.’ Hear the name, look at the person, and
    tell yourself that you’re going to put together a memory that will last.


    #### Step 3: Personalising


    Some of the things that make name learning hard – like the emotional strains involved
    in meeting people – can be turned round and used to your advantage. As you meet
    someone new, consciously consider how you feel. Say their name in your head as
    you think: do I like this person? Are they attractive? Is what they’re saying
    interesting? Would they make a good colleague, friend, partner … ? Set up connections
    through feelings and you’re much more likely to recall the meeting, but you’ll
    also be creating mental links to their name – especially when you focus on what
    the moment ‘means’, and on your reasons to remember.


    #### Step 4: Visualising


    As well as looking at the person in front of you, look at their name – in your
    mind’s eye. Picture it written across their face or picked out in a neon sign
    hanging above their head. Imagine what their signature might look like. Whether
    you’re reading a name on paper or seeing it in your head, treat it just as you
    would any other word: as a collection of letters and sounds that can provide you
    with memorable possibilities. What does the name sound like or look like? Do particular
    syllables suggest objects, people, places? Are there words-within-words that could
    give you useful associations? Unpick names to reveal images that you can work
    with. For example:


    ##### Harry Floris


    Harry looks and sounds like hairy. Floris is very similar to florid, red-faced;
    and to florist, a flower-seller. The first syllable of his surname sounds like
    floor, but it also looks like flow. Flow rice? Rice flowing across the floor?
    The name Flo is in there, along with Lori – and Rolf, backwards: perhaps the people
    being swept away by the flow … ?


    ##### Angela MacDonald


    There’s an angel in Angela, maybe one with gel in its hair. The Mac could be a
    raincoat. Donald might get you thinking of Donald Duck, or another famous Don:
    Johnson, Quixote, Corleone …


    #### Step 5: Exaggerating


    As soon as you’ve extracted some image ideas, make them important. Imagine they’re
    part of this moment, revealing key aspects about this person in front of you and
    providing you with big clues about who they are. Ask yourself questions and exaggerate
    the answers – along with everything else that you start seeing in your mind’s
    eye.


    *   Why is this red-faced man taking his flowery shirt off so flamboyantly? To
    show you his hairy chest. The hairs reach to the floor, which also seems to be
    covered in rice, flowing around you and hairy Harry Floris.


    *   Why has this woman got a halo hanging over her gelled-back hair? Imagine she’s
    holding a mac that seems to be wrapped around a writhing, quacking duck. Clearly
    Angela MacDonald has a very famous character in her heavenly raincoat! As always,
    make the imagery bold and bright, funny, strange, violent, surprising – and powerfully
    memorable.


    #### Step 6: Organising


    On paper or in person, names need to be connected to their owners. You’ve already
    started this process by using your feelings about them, picturing their names
    imprinted on them and visualising strange and memorable things happening to them.
    Even just reading the name of a party host or conference delegate should get you
    linking imagery with a real character – even one you’ve never actually seen.


    ![image](images/00004.jpeg)


    If you’re learning names on paper, connect the images you create to what the real
    person could look like or might be expected to do.'
