    \ of its truth, convictions and logic. For example, suppose that a young executive\
    \ plans to present a proposal to launch a range of premium organic chilled meals\
    \ at the next senior management meeting. His boss is sceptical about the plan\
    \ and the way his executive is going about it.\n\n* Why are you making this presentation\
    \ when our resources are already overstretched?\n\n    Because research shows\
    \ there’s a big gap in the market for this concept, and it is very high margin\
    \ so there’s an incremental volume and profit opportunity. And I’ll put in extra\
    \ time myself to make sure the presentation is brilliant. The resource issue is\
    \ down to me and my time.\n\n* Why do such a high-profile presentation? There’ll\
    \ be sceptics there on our team who’ll suggest the absence of competitive activity\
    \ may suggest that our competitors know something that we don’t?\n\n    Because\
    \ it’s very hard to get the product right but I know we can do this if I can enthuse\
    \ enough people on the team. Hence my wanting to put on a bit of a show. No one\
    \ else has our organic credentials so competitors are wisely steering clear. Anyway,\
    \ I think we’re a bit smarter than them and I want to show that in my all-singing-and-dancing\
    \ presentation.\n\n* Why do you think that you can overcome your colleagues’ antipathy,\
    \ which you concede is a problem? They’ll probably say if Tesco were to agree\
    \ with your market diagnosis they could simply do it themselves – and probably\
    \ would.\n\n    Because I want to be high profile on this and gain first-mover-advantage.\
    \ You see, if we can get Tesco to stock, in addition to the easier targets like\
    \ Sainsbury and Waitrose – and I think we can because the taste tests on our product\
    \ are exceptional – then the organic story plus our pricing makes this a must-stock\
    \ range.\n\n* Why should we do this and run the risk of cannibalising our relatively\
    \ successful, but static and under margin-pressure, non-organic offering?\n\n\
    \    Because it’s all down to positioning, isn’t it? If we launch head to head\
    \ against ourselves then you have a strong point, but if we aim more upmarket\
    \ and go for people organically predisposed and avoid recipe duplication, then\
    \ we should be OK. Especially if our marketing is as exciting as I plan and aim\
    \ to show.\n\n* Why would you want to put your career on the line now, just when\
    \ you are on track for promotion? You see, if you go high profile, make this the\
    \ presentation of a lifetime and it fails to hit plan, your life here is over,\
    \ and I doubt if any of our competitors would be impressed either. Why not dip\
    \ your toe in the water? No big launch. No glitzy internal presentation. Will\
    \ you think about that?\n\n    That’s a very strong point boss and very well made.\
    \ Can I go away and have a think about it? What sort of promotion did you actually\
    \ have in mind by the way?\n\n## Why? Why?? Why??? Why???? Why?????\n\nThis technique\
    \ will usually find the weak point in any argument, position or presentation.\
    \ Try it on the argument in your next presentation. When, through laziness or\
    \ because we can’t quite make the argument compute, most of us make jumps in our\
    \ logic, bury issues that don’t suit the argument or, if we are politicians, we\
    \ sometimes fib. Sometimes, we even tell really big porkies just to get a brilliant\
    \ presentation away – sometimes, we believe 2 + 2 = 5 in reality, not as a metaphor,\
    \ because we just can’t be bothered to do the simple arithmetic.\n\n![image](img/00004.jpeg)\n\
    \n"
