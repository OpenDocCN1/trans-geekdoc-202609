    It is clear that Jane is a past master at both filtering and magnifying. She ignores
    completely the many things that have gone according to plan on her friend’s big
    day and focuses entirely on the one minor detail that didn’t.


    The reason she does so is because she is unconsciously looking for evidence to
    support her core belief, ‘I am no good’, and in order to do so she has to screen
    out the abundant evidence of her success as a wedding planner, concentrating exclusively
    on her one ‘failure’ – even though the mix-up was not even her fault.


    She works hard to inflate both the significance of the wrong canapés and the bride’s
    reaction: note that Jane does not ascribe her friend’s possible tearfulness to
    the joy of the whole occasion or any other cause. She also has to convince herself
    that her friend’s reassurance is based entirely on an altruistic desire to make
    Jane feel better, not that she genuinely might not care about the vol-au-vent
    switch. Jane also superimposes her own assumption that the day has to be ‘perfect’
