    \ \n\n![Image](images/00008.jpeg) \n\nYour mind will represent your thinking in\
    \ pictures, sounds and feelings and sometimes even smells and tastes. The quality\
    \ and detail of your representations will vary according to whether your thoughts\
    \ are positive or negative. Knowing how you represent your thoughts, of which\
    \ values, metaprogrammes and beliefs are a part, will help you make the changes\
    \ you want in areas where you would like to improve your results.\n\nWhen you\
    \ feel anxious, uncertain, confused, angry or frustrated, you become tense and\
    \ stressed. Being in that state prevents you from accessing all your wonderful\
    \ inner resources. Whatever situation you are in, if you are feeling any of these,\
    \ it is unlikely that you are performing to your full potential. Think of a time\
    \ recently when you were feeling stressed and recall what was on your mind. Your\
    \ thoughts were responsible for creating your feelings. Every thought you have\
    \ results in a feeling, so the way to control your feelings is to control your\
    \ thoughts.\n\nTest this out. Sit quietly and think of a situation where you did\
    \ something that you didn’t feel so good about. Notice what feelings come up.\
    \ Now take a deep breath and think about a situation where you did something that\
    \ you felt really good about and, again, notice the feelings that come up.\n\n\
    You have just used your imagination to recall two experiences that resulted in\
    \ very different feelings. You can use the connection between your imagination\
    \ and your feelings to put you in control and enable you to choose the way you\
    \ feel. Your feelings have a direct impact on your capability, regardless of the\
    \ situation.\n\n### It’s the first thought that counts"
