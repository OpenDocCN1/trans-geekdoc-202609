  trans: "\n\n人类被模式所吸引。我们经常将自己的经验作为预测未来的模板。然而，倾向于概括的人只需要很少的证据就能推断出关于世界运作方式的规律和假设——而且他们几乎总是观察和推断得相当悲观。一个人输掉一场拼字游戏，心里想：“真典型！我什么都赢不了。”一个小女孩在学校被嘲笑，得出结论：“每个人都讨厌我！”一位老妇人在当地报纸上读到一起抢劫案，懊恼地得出结论：“如今没人是安全的……”。所有这些都是概括的例子，即个人基于单一的不愉快经历或孤立的信息片段，得出一些深远的、普遍的结论。\n\
    \n容易概括的人的语言通常是一个可靠的信号。如果你发现自己经常使用“从不”、“总是”、“每个人”和“没人”等绝对词汇，那么你很可能容易受到这种思维方式的影响。\n\
    \n为了对抗概括，你需要训练自己寻找自己规则中的例外。如果你在世界上只有一个朋友，那么并不是“没人”喜欢你，而且你“从未”赢过任何事情的可能性也非常小——即使你扭曲的思维可能让你难以想起任何过去的胜利。概括的危险在于，我们倾向于屏蔽任何与我们毫无根据的信念不符的东西，而我们却急切地抓住任何似乎支持我们对自己和他人负面信念的新证据。\n\
    \n不幸的是，概括很容易成为自我实现的预言。例如，一个认为自己普遍不受欢迎的人，会很少努力让自己变得讨人喜欢。\n\n## 思维错误 3：读心术\n\n###\
    \ “她觉得我是个白痴”\n\n我们不断地对他人及其意图做出假设。在某种程度上这是必要的，我们可以根据人们的行为和过去对我们的态度，可靠地推断出很多事情。然而，在某些情况下，我们的想象力会失控。我们基于非常少的确凿证据，就对他人的动机和态度下结论。当这些动机和态度直接影响我们时，我们尤其倾向于这样做。\n\
    \n问题是，当我们做出这种假设时，我们就让自己暴露于各种误解和偏执投射之中。事实是，除非对方选择告诉我们，否则我们无法确切知道另一个人在想什么。\n\n![image](img/00003.jpeg)\n\
    \n对于容易进行读心术的 CBT 来访者，通常推荐的干预措施之一是咨询他人关于他们的看法和感知。\n\n一位年轻男性来访者被布置了回家作业，要求他询问家人和朋友他们欣赏他的哪些方面，但他找了各种借口来避免完成这项任务。他会感到自惭形秽。他联系不到一些相关的人。由于大学课程的压力，他没有时间。在下周的会谈之前，我半期待他会声称狗吃掉了他的作业纸。\n\
    \n然而，当保罗确实来参加会谈时，我们都对结果感到惊喜。他不仅完成了任务并按建议采访了相关人员，还报告说，他受到的一些赞美既让他感动，又暗自欣喜。\n\n\
    保罗承认，他一直害怕进行这些询问，因为他深信即使是最亲近的人也认为他是“一个烦人的书呆子”。事实并非如此，但由于这种根深蒂固的信念，保罗从未冒险去检验情况的真实性。相反，他依赖自己高度发达的“读心术”能力，一直带着一个不必要的假设，这个假设正在侵蚀他的自尊心。\n\
    \n## 思维错误 4：非黑即白和僵化思维\n\n### “要么黑，要么白……”\n\n“要么对，要么错”，“你要么是赢家，要么是输家”，“如果不是最好的，那就是垃圾……”。那些总是以这种二元对立方式思考的人，很可能会给自己带来各种心理问题。世界并非如此简单。我们的分类总是不完美的，试图将现实强行塞进方便的框架里，通常效果并不好。\n\
    \n以体重为例。非黑即白的思维会坚持认为，如果你不瘦，那你就一定是胖。这忽略了这样一个事实：如果你把伦敦的人口排成一排，人们很难就“瘦子”结束和“超重者”开始的界限达成一致。肥胖是一个连续体概念的良好例子，其临界点相当随意。它也是一种文化建构——一种社会评判，而非客观真理。\n\
    \n非黑即白和僵化的思维常常与强烈的道德评判和自我评价相伴而生，这会造成大量不必要的痛苦。你可能也注意到，非黑即白或教条式的思考者通常花大量时间试图将自己的分类体系强加于他人。他们的道德绝对主义不容异议——毕竟，在他们眼中，只有一种正确的方式。不幸的是，这种非黑即白的思维会导致社会中的许多弊端，包括种族主义、偏执、性别歧视和政治极端主义。通常，以僵化方式思考的人会给自己和他人带来大量不必要的压力。\n\
    \n以极端方式思考的人没有多少退路。毫不奇怪，CBT 非常强调软化我们思维中的绝对化，并鼓励我们更灵活地思考。这并不是要你放弃价值观或成为一个无道德的人。这仅仅是认识到，人们可以以不同的方式看待和体验事物，而更灵活、更精妙的感知方式很可能对你的心理健康更有利。\n\
    \n![image](img/00004.jpeg)\n\n### 以滑动尺度来思考\n\n人们常常抱怨 CBT 不必要地强调百分比、评级和测量。然而，认识到在确信程度或我们感受到的情绪强度方面，我们总是处于滑动尺度上的某个点，这就创造了向任何方向上下移动的可能性。如果只有两个对立面可供选择，那么从一个位置转移到另一个位置往往变得令人生畏。向任何方向移动几英寸，是一个不那么令人生畏且更现实的前景。\n\
    \n以下是一些建议：\n\n*   注意你言谈和思考中“应该”、“ ought to” 和 “必须” 等词语，这些词可能表明你对自己和世界存在不利的僵化假设：\n\
    \n    – “女人应该总是服从丈夫。”\n\n    – “我必须总是把别人放在第一位。”\n\n    – “孩子应该只可看见，不可听见。”\n\n\
    *   试着接受灰色地带：认识到许多概念最好被概念化为滑动尺度，而不是在截然不同的替代方案之间做选择。\n\n*   学会将你的价值观和信念视为个人选择，而不是对每个人都强制性的。\n\
    \n*   让自己接触不一定符合你自己的观点，看看你能否与持有这些观点的人找到任何共同点。\n\n## 思维错误 5：情绪推理\n\n### “我感到如此内疚……我一定做了什么可怕的事”\n\
    \n"
