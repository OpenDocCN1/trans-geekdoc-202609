    \n## Introduction\n\nWelcome to your exclusive eBook of the best chapters from\
    \ the Brilliant series. Whether you’ve bought one of the 1.5 million Brilliant\
    \ books that have been sold around the world or not, we’ve included 10 chapters\
    \ from 10 of our bestselling Brilliant books to give you a little taste of the\
    \ series, and hopefully motivate you to read more! By choosing the most inspiring\
    \ and useful chapter for you, we hope you’ll learn something new and get one step\
    \ closer to being Brilliant on your chosen subject.\n\nBrilliant books are completely\
    \ designed with you in mind. We start with the basics and work on giving you what\
    \ you need to know, exactly when you need it. Scattered throughout the chapters\
    \ you’ll find learning features to help strengthen your knowledge:\n\nBrilliant\
    \ tips  \n\nBrilliant definitions  \n\nBrilliant dos and don’ts  \n\nBrilliant\
    \ action points  \n\nBrilliant recaps\n\nBrilliant now has 150 titles available\
    \ in the business, management, lifeskills, computing, teaching and study skills\
    \ areas, so if you need help, advice or inspiration we’ll have something for all\
    \ your personal and professional needs.\n\n# PART 1\n\n# LIFE\n\nOur life titles\
    \ cover all kinds of personal development topics to help you feel inspired and\
    \ achieve what you want.\n\nThis section includes chapters on cognitive behavioural\
    \ therapy, neuro-linguistic programming (NLP), body language, self confidence\
    \ and memory training.\n\nSo, if you want to:\n\n*   Learn how to avoid common\
    \ thinking traps using cognitive behavioural therapy\n\n*   Use NLP to think your\
    \ way to feeling great\n\n*   Understand the rules of body language and attraction\n\
    \n*   Improve your confidence at home and work\n\n*   Find out the secrets to\
    \ remembering names and numbers\n\n... then read on!\n\n![Image](images/00002.gif)\
    \ \n\nThe philosopher Socrates was sitting outside the city gates of Athens when\
    \ a man comes up to him. The man says: ‘I am thinking of moving to Athens. What\
    \ is it like living here?’ Socrates looks up and asks him: ‘I would gladly tell\
    \ you but answer me one question: what is it like where you live now?’ The man\
    \ replied: ‘Terrible! The people are back-stabbers and thieves. I will be leaving\
    \ no friends behind me – only enemies.’ Socrates frowned and replied, ‘Well, you\
    \ had best be on your way because you will only find the same thing here in Athens.’\n\
    \nLater a second man approached who was also considering moving to Athens. Once\
    \ again the old philosopher asked him about his experience of his home town. The\
    \ man smiled and said, ‘Where I come from the people all work together and help\
    \ each other. Kindness is everywhere and you are always treated with respect.’\
    \ ‘Welcome to Athens,’ smiled Socrates, ‘you will find the same thing here.’\n\
    \nSocrates knew that our mindset determines our experience of the world and he\
    \ recognised that both men would carry their habitual attitudes, perceptions and\
    \ ways of interacting with them. It was the way they processed information and\
    \ biases in their thinking that were likely to dictate the quality of their lives\
    \ just as much as the nature of their surroundings.\n\nIn order to escape from\
    \ the mental prisons that we can so easily build for ourselves, CBT insists that\
    \ we first need to become more aware of the biases in our thinking that can keep\
    \ us trapped and unhappy. In this chapter we shall examine some of the most common\
    \ thinking traps and help you become more aware of the ways in which they can\
    \ perpetuate our difficulties. You will be given the opportunity to analyse your\
    \ own thinking style and learn simple strategies for avoiding common thinking\
    \ errors.\n\n### Thinking error 1: catastrophising\n\n#### ‘The end of the world\
    \ is nigh!’\n\n‘I can’t find my purse… Oh no! I must have left it in the supermarket\
    \ … Someone is sure to have nicked it… Maybe it was stolen by someone who was\
    \ looking over my shoulder when I got the money out of the cash dispenser in which\
    \ case they know my PIN number and will probably already have emptied my bank\
    \ account or stolen my identity… That means I won’t be able to pay my bills this\
    \ month… What if the bank decides to repossess the house? We’ll be ruined. We’re\
    \ going to end up out on the street… How could I have been so stupid?’\n\nWe all\
    \ know people who think like this. Catastrophising is the hallmark of an anxious\
    \ person. It combines pessimism (i.e. assuming that in any situation a bad or\
    \ distressing outcome is more likely than a good one) with a wildly exaggerated\
    \ sense of threat. Things will not only be bad. They will be really bad.\n\nUnfortunately\
    \ people who catastrophise find it hard to appraise the significance of a situation\
    \ realistically: they can end up becoming just as distressed by relatively trivial\
    \ setbacks as a major misfortune. They constantly project themselves into a doom-laden\
    \ future and allow their imaginations to run riot with frightening scenarios.\n\
    \nPeople who catastrophise seldom take into account any resources they might have\
    \ to deal with the worst-case scenario. If this is you ask yourself:\n\n*   On\
    \ the scale of all the bad things that have happened in the past or could happen\
    \ to you in the future, how bad could this event be?\n\n*   If I had no choice\
    \ but to deal with the very worst thing that could happen in this situation what\
    \ would I actually do?\n\n*   Think about how you may have dealt with other past\
    \ difficulties. What helped you then?\n\n### Thinking error 2: generalisation\n\
    \n#### ‘Things always go wrong for me…’"
