    Babies of both sexes prefer to look at symmetrical faces^([24](#part0006_split_001.html#ch3ref24))
    than those, shall we say in a kindly way, that are more interesting.


    However, physical attractiveness is only one factor out of many that makes us
    attractive enough to achieve an ongoing relationship and to maintain it. Divorce
    rates among the beautiful people who inhabit both screen and stage is significantly
    higher than average. Yes, looks are seductive, but in the long term it is what
    lies beneath that is the foundation of long relations.


    ## Eyes


    Lashed eyes are another sign of health. Besides being the window to the soul,
    large eyes in women are a definite plus in the looks department and have been
    for a long time, as Mark Antony found out when he visited Egypt in 41 BC. But
    here again we can take heart if we are not in the beauty queue when we were made.
    Cleopatra VII Philopator, although she knew the advantage of eye make-up, was
    better known in her time for her wit, intelligence and the sweetness of her voice.


    Perhaps here while we are talking about the eyes of a female, we should also mention
    the advice of Victor Hugo when he wrote:


    ‘When a woman is talking to you, listen to what she says with her eyes.’


    Although the variation in the maximum size of our pupils is individual, you can
    check if that special person you have just met finds you attractive by checking
    the change in their pupil size – providing, of course, you are not both in a dimly
    lit bar where you both have to dilate your pupils just to be able to see. Because
    of colour convergence, those with blue eyes are easier to ‘read’ than brown eyes
    and for that reason they disclose more of their feelings towards you. In the WASP
    world where females have more of a choice concerning eye colour, blue eyes are
    thought to be marginally more attractive than brown.


    Our eyes also become somewhat watery when we find someone attractive, which is
    yet another physiological reaction that is difficult to develop but easy to recognise.


    ## Glasses


    Early research found that wearing glasses[^(25)](#part0006_split_001.html#ch3ref25)
    has an interesting effect on the way that you are perceived. Men are rated more
    intelligent and also serious, conventional and hardworking, but less manly. Women
    are rated more intelligent, honest, serious and sometimes ‘dizzy’.


    ![Image](images/00016.gif)


    Which version of the same lady do you find more attractive?


    In their alter egos as Superman, Spiderman, Superwoman and Wonder Woman, none
    of the superheros wear glasses, despite tonnes of testosterone for the first two
    and an oestrogen explosion for the latter.


    For the same reason, we have grey hair and wrinkles after the age of 40, we begin
    to notice that our ability to focus on near objects begins to decline, and by
    that age, as our arms are fixed in length, glasses are the only way to go. This
    is the onset of presbyopia – such an unkind word, from first the Greek and then
    the Latin, meaning ‘old man eyes’. No wonder ‘men and women do not make passes
    at people with glasses’. I tell people that my glasses are to make them more attractive.


    ![Image](images/00004.jpeg)


    Take off your glasses to appear more attractive and younger because for most of
    us our vision declines with increasing age.[^(26)](#part0006_split_001.html#ch3ref26)


    ## Breasts

