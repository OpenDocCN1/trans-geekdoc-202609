- raw: "While Britain was creating the aristocratic and amoral character Raffles,\
    \ the Americans were creating Rockefellers. While Britain was defending an empire,\
    \ they were building an economy. They worked incredibly hard and they still do.\
    \ They don’t dream the ‘American dream’ – they create it brick by brick. Their\
    \ success is founded on an astonishing attention to detail. Whenever you hear\
    \ people knock the USA, as many do, remember their work ethic and look at some\
    \ of their achievements.\n\nWhich leads me to Al Pacino who, when he performed\
    \ in and directed Shakespeare’s Richard III in Britain, gathered the cast around\
    \ and dissected the text with them word by word, examining meaning and motive\
    \ until it became clearer and clearer what was going on. Shakespeare, he told\
    \ his exhausted fellow thespians, wasn’t casual or sloppy. If a word was there,\
    \ it was there for a very good reason. Find it, he said, find it.\n\nSo it is\
    \ with presenting – if a word is there it must be there for a reason. Getting\
    \ it right will be achieved only by rigorous questioning and a refusal to stop\
    \ until you get to the bottom of an issue. I recommend such rigour to you in preparing\
    \ a presentation. If you work in an American company you will find that exhaustive\
    \ examination of every word and nuance is commonplace. Although, and there is\
    \ a downside, you’ll also find a rather tiresome didacticism in their presentations.\
    \ They tend to shout rather than converse.\n\n![image](images/00004.jpeg)\n\n\
    Work as hard as you can on creating a solid, logical argument for your presentation.\n\
    \n### Performance starts with how you sound\n\nYour voice is crucial and while\
    \ actors start with an advantage you need to improve and work on your voice, how\
    \ it carries, how much variation there is in it, how resonant it is, how good\
    \ your diction is. This is potentially your biggest asset – or liability. For\
    \ most audiences it’s all that exists of you when you give a ‘whiz bang’ slide\
    \ presentation. The rest being hidden in darkness.\n\nThe key when it comes to\
    \ training your voice is not to be shy. Learn some Shakespeare and declaim. Or,\
    \ it could be Keats, Shelley, T.S. Eliot or Carol Ann Duffy – anyone you like.\
    \ Just learn it and then try saying it out loud – in the bathroom to start with,\
    \ then outside. Raise your voice and let go with exaggerated theatricality. Enjoy\
    \ yourself. All I want is for you to be in total control of the content so that\
    \ you can focus on delivery. For example, imagine reciting ‘Ode to a Nightingale’\
    \ to a child, to your parents, to an old lady, to a lover, in a large church to\
    \ 200 people, in a sitting room to 12 people. The exercise is in learning how\
    \ to deliver the same thing in different contexts and exploring your own range\
    \ of expression.\n\nSo how do you feel about your voice? Personally, I like and\
    \ I lean on mine. It sounds quite strong and it gives me confidence – I can play\
    \ with its range and pace. When it isn’t quite there, through a cold or a surprise\
    \ attack of nerves, my sense of self-belief begins to flutter.\n\n![image](images/00004.jpeg)\n\
    \nLean on your voice. It’s your friend. Look after it with water and mints. Listen\
    \ to it. Practise. After all that’s what singers do.\n\nYour voice is as important\
    \ to you as a presenter as your putting stroke is to you as a golfer – so look\
    \ after it. Record yourself and listen to yourself. Work with a coach if necessary\
    \ – and it probably is. Someone who slows you down, who makes you speak in lower\
    \ bass tones. Look at what Sir Gordon Reece managed to do for Margaret Thatcher\
    \ – she was transformed from a Finchley housewife-politician who, as education\
    \ minister, stopped school milk (‘Margaret Thatcher – school milk snatcher’) to\
    \ a world statesperson who spoke with gravitas and passion. The late Edward Heath\
    \ had voice coaching with the same result, producing in his case a statesmanlike\
    \ burr. Current politicians try anything from nasal surgery to coaching to get\
    \ their voice sounding more impressive.\n\n### Illogical arguments show up in\
    \ a presentation\n\nThe question is ‘Does the argument hold water?’ not ‘Is this\
    \ good rhetoric?’ Don’t be sloppy in building an argument and in creating the\
    \ logic of your story. At least one acid test of building a credible presentation\
    \ lies in the practice of constantly interrogating the logic and the flow of the\
    \ argument.\n\nDon’t go to bed until you’ve cracked it. Toyota created ‘the five\
    \ whys’ as their process of inquisition whereby any proposal was intellectually\
    \ tortured until it confessed to its weakness, or survived through the strength\
    \ of its truth, convictions and logic. For example, suppose that a young executive\
    \ plans to present a proposal to launch a range of premium organic chilled meals\
    \ at the next senior management meeting. His boss is sceptical about the plan\
    \ and the way his executive is going about it.\n\n*   Why are you making this\
    \ presentation when our resources are already overstretched?  \n\n    Because\
    \ research shows there’s a big gap in the market for this concept, and it is very\
    \ high margin so there’s an incremental volume and profit opportunity. And I’ll\
    \ put in extra time myself to make sure the presentation is brilliant. The resource\
    \ issue is down to me and my time.\n\n*   Why do such a high-profile presentation?\
    \ There’ll be sceptics there on our team who’ll suggest the absence of competitive\
    \ activity may suggest that our competitors know something that we don’t?  \n\n\
    \    Because it’s very hard to get the product right but I know we can do this\
    \ if I can enthuse enough people on the team. Hence my wanting to put on a bit\
    \ of a show. No one else has our organic credentials so competitors are wisely\
    \ steering clear. Anyway, I think we’re a bit smarter than them and I want to\
    \ show that in my all-singing-and-dancing presentation.\n\n*   Why do you think\
    \ that you can overcome your colleagues’ antipathy, which you concede is a problem?\
    \ They’ll probably say if Tesco were to agree with your market diagnosis they\
    \ could simply do it themselves – and probably would.  \n\n    Because I want\
    \ to be high profile on this and gain first-mover-advantage. You see, if we can\
    \ get Tesco to stock, in addition to the easier targets like Sainsbury and Waitrose\
    \ – and I think we can because the taste tests on our product are exceptional\
    \ – then the organic story plus our pricing makes this a must-stock range.\n\n\
    *   Why should we do this and run the risk of cannibalising our relatively successful,\
    \ but static and under margin-pressure, non-organic offering?  \n\n    Because\
    \ it’s all down to positioning, isn’t it? If we launch head to head against ourselves\
    \ then you have a strong point, but if we aim more upmarket and go for people\
    \ organically predisposed and avoid recipe duplication, then we should be OK.\
    \ Especially if our marketing is as exciting as I plan and aim to show.\n\n* \
    \  Why would you want to put your career on the line now, just when you are on\
    \ track for promotion? You see, if you go high profile, make this the presentation\
    \ of a lifetime and it fails to hit plan, your life here is over, and I doubt\
    \ if any of our competitors would be impressed either. Why not dip your toe in\
    \ the water? No big launch. No glitzy internal presentation. Will you think about\
    \ that?  \n\n    That’s a very strong point boss and very well made. Can I go\
    \ away and have a think about it? What sort of promotion did you actually have\
    \ in mind by the way?\n\n### Why? Why?? Why??? Why???? Why?????\n\nThis technique\
    \ will usually find the weak point in any argument, position or presentation.\
    \ Try it on the argument in your next presentation. When, through laziness or\
    \ because we can’t quite make the argument compute, most of us make jumps in our\
    \ logic, bury issues that don’t suit the argument or, if we are politicians, we\
    \ sometimes fib. Sometimes, we even tell really big porkies just to get a brilliant\
    \ presentation away – sometimes, we believe 2 + 2 = 5 in reality, not as a metaphor,\
    \ because we just can’t be bothered to do the simple arithmetic.\n\n![image](images/00004.jpeg)"
