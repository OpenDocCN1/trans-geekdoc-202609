    ‘Michelle, could it be that your flatmate cares about you and doesn’t want to
    see you get hurt? Maybe she has had a painful relationship and doesn’t want you
    to experience the same pain. Perhaps focusing on the perceived jealousy is keeping
    you from noticing ways in which she really does care. However it may seem to you,
    the reality could be very different. If she does care for you, what is it she
    does that will tell you this?’


    Michelle decided to look for evidence that her flatmate really did care about
    her well-being. She discovered lots of small things she did for her that had previously
    gone unnoticed. The relationship improved and they healed the rift. The point
    at which this situation turned around was when Michelle flipped her that mindset
    to a this mindset and created a positive intention to find the good in her flatmate.


    ### Flipping a that to a this


    1. Think of a task you really don’t enjoy doing that causes you to procrastinate,
    or one you do very quickly to get it out of the way. Whichever you choose, it
    causes you bad feelings and, possibly, leads you to perform it below your usual
    standard.


    2. Create a conscious positive intention relating to completing the task and begin
    to focus on the intention.


    3. Either use the absurdity technique described above or begin to develop the
    positive aspects of the task, or both. How absurd is it that you have been thinking
    of the task in that way? Keep looking for the good and release your mind from
    the negative aspects of the task.


    Thinking in a this way will allow your mind to be creative and come up with solutions
    and ideas rather than becoming stressed by the bad feelings associated with that-type
    thinking.


    ![image](images/00004.jpeg)


    Every new skill you attempt requires a degree of practice. The more you practise
    these techniques, the more you will reprogramme your thinking to create new feelings
    and behaviour that serve you well. Take one technique at a time and practise it
    several times on issues that are real for you before moving on to the next technique.


    ![image](images/00010.jpeg)


    In this chapter you have learned that:


    * your feelings play a large part in who you are and how you behave – negative
    feelings produce negative results and vice versa


    * you can choose the way you feel


    * you can change your feelings using your internal imagery, dialogue and sounds


    * changing your imagery and therefore your feelings will help to create better
    results


    * associating with your images (this) will make them stronger; dissociating (that)
    will weaken them; you can choose whether or not to associate or dissociate with
    your images


    * you can use reframing to change the way you are thinking about something


    * phobias are the result of distorted beliefs and can be fixed.


    [![Image](images/00011.jpeg)](http://www.amazon.co.uk/Brilliant-NLP-emotions-Lifeskills-ebook/dp/B00AN4XXAC/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320704&sr=8-1&keywords=brilliant+nlp)


    ![Image](images/00012.jpeg)


    ### Making the most of what you’ve got


    Before you delve into this chapter I have to make an apology: there is a lot about
    sex here and because it underlies so much, if not drives the body language of
    attraction, there is much repetition but from different perspectives.


    What women like and need and what men like and need is addressed again and again
    because, let’s just say it and get it over with, most males are programmed to
    be promiscuous; most females are programmed (some would say sentenced) to be selective.
    Males seek primarily physical satisfaction; females desire social satisfaction.
    Women choose their men; men compete to be chosen. Males produce millions of sperm;
    females have a limited number of eggs. Both choose the best partnering option
    they can for the production of offspring; males by having as many children as
    possible, females by having as many as can be nurtured to adulthood.


    ![image](images/00013.gif)


    Attraction (noun)


    The facility to manifest qualities such as interest, charm, fascination, amusement
    and generosity such that others seek your company.


    Let’s get real, too. Men do not, as Dr Alfred Kinsey^([1](#part0006_split_001.html#ch3ref1))
    suggested, think about sex every 7 seconds. It is only several times a day, according
    to the US National Academy of Scientists, and it is only slightly lower for women.


    Nevertheless, it is not money that makes the world go round but that very basic
    need we call sex. This is where the language of words literally loses ‘hands down’
    to body language. In the early part of relationships body shape and what we do
    with it really does speak louder than words.^([2](#part0006_split_001.html#ch3ref2))


    As most women will attest, it is an unfair and inappropriate world. Basically,
    fertility is written all over the female body. For women the quadriga of youth,
    bust, hair and body shape dominate the way a woman is initially viewed or valued
    by the male and, to a certain extent, by society.[\*](#part0006_split_001.html#ch3fn1)


    ![image](images/00003.jpeg)


    One of the reasons Alan Ayckbourn^([3](#part0006_split_001.html#ch3ref3)) felt
    so moved to write his insightful play Body Language was because, as a writer when
    checking the top book rankings in the Sunday papers, it suddenly dawned on him:


    ‘The English best-seller books in any week usually consist of four books about
    dieting, six books about make-up and so on. So, we are indeed an obsessive nation.’


    With the advent of feminism in the 1960s one might have expected that such discrimination
    would have waned, but ‘lookism’ does prevail^([4](#part0006_split_001.html#ch3ref4))
    and unlike gender, sexual orientation, race, religion and political orientation,
    or country of origin, it would almost be impossible to legislate against this
    because it is so individual.


    Our sexuality is unique among mammals. Sex for other mammals is driven primarily
    by their biology and for the most part it is an instinctive approach. We still
    have our instincts, we still have the same physiology, but now there is a very
    thin veneer of our cultural heritage and social mores. Most animals have sex when
    they are ready; we humans have sex dancing through the requirements of our cultural
    heritage and our psychological hurdles.


    No wonder it is complicated, as Dr Alfred Kinsey over 60 years ago suggested:


    ‘… sex is dealt with in the current confusion of ignorance and sophistication,
    denial and indulgence, suppression and stimulation, punishment and exploitation,
    secrecy and display.’^([5](#part0006_split_001.html#ch3ref5))


    Here, what is of interest to both sexes are the secondary sexual characteristics.
    Unless you are a young performing pop star of either sex they are not usually
    accentuated. Most of the body language of attraction then is how we accentuate
    and articulate our secondary characteristics.


    Note: In this section, perhaps more than the others, we are talking in generalities
    and there are always exceptions to the rules of attractiveness.


    ### Primacy and recency


    An additional point on first male/female impressions we must cover is what is
    known as the ‘primacy’ and ‘recency’ effects; that is, the first and last things
    that we see and hear when we meet someone for the first time. We have covered
    at length how important first impressions are (primacy effect) but the recency
    effect is almost, but not quite, as powerful.


    ![Image](images/00014.gif)


    To illustrate this, read out to a friend the same string of numbers (6140903602786)
    three times slowly and then ask them to write down as many as they can remember.
    Most will remember 6140 and 2786 – i.e. the first and the last.


    What happens here is that our short-term memory when we first hear the string
    of numbers kicks in so they are easily remembered and there is time for rehearsal.
    The recency effect is similar when recalling the numbers from short-term memory.

