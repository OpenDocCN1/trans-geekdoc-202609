    3. Does the person smile a lot?


    4. Does the person attempt to amuse?


    5. Does the person have their feet pointing towards you?


    6. Does the person groom and touch themselves frequently?


    7. Does the person attempt to find a reason to touch you?


    8. Does the person laugh easily and often when they are with you?


    9. Does the person hold their arms to their sides?


    10. Does the person frequent the same places as you?


    11. Does the person pay more attention to you than others when in the company
    of others?


    12. Does the person lick their lips more frequently than others?


    13. Does the person move into your personal space?


    14. Does the person have an initial high blink rate?


    15. Does the person breathe more quickly in your presence?


    16. Does the person mirror you?


    17. Does the person have significant eye dilation, especially when surroundings
    are bright?


    18. Does the person speak more softly to increase intimacy/draw you closer?


    19. Does the person discuss opportunities to see you again before you part?


    20. Does the person give you their best smile when you separate?


    21. Does the person’s handshake seem slightly prolonged?


    ### 21 early signs that she finds you attractive


    1. Does she let you stand in front of her?


    2. Does she look at you, and when you catch her eye for the first time does she
    look down?


    3. Does she arch her back when she first sees you?


    4. Does she go on to her tip toes when she first sees you?


    5. Does she expose her neck when she laughs at something you said?


    6. Does she put her hand on her neck and/or under her hair?


    7. Does she rub her foot behind the calf of her other leg?


    8. Does she stand occasionally with her legs slightly apart?


    9. Does she toss her head so that her hair flicks away?


    10. Does she touch you whilst with her friends?


    11. Does she, when sitting, turn slightly side on, enabling you to see all of
    her?


    12. Does she, when sitting, cross one leg over the leg that is closest to you?


    13. Does she, when you are not sitting next to her, have her knees pointing towards
    you?


    14. Does she allow one shoe to dangle off her foot when sitting when her legs
    are crossed?


    15. Does she adjust her clothing, especially round her waist, to show off her
    figure?


    16. Does she not show annoyance if she catches you taking a sneaky look at her
    bust?


    17. Does she turn and expose her neck?


    18. Does she laugh or giggle a lot when you try to be funny?


    19. Does she roll her hips when she walks towards you?


    20. Does she lean forward when you lean forward?


    21. Does she look at you when you walk away from her? (Ask a friend to observe!)


    In Victorian times it was much easier; single maidens as they passed a male who,
    shall we say, was slow on the uptake, just happened to accidentally drop their
    handkerchief and the male felt compelled to be a gentleman and return it to the
    maiden, who would then fain surprise at her gaucherie. At the annual Hunt Ball
    (the posh equivalent of a singles’ event but arranged by pickie parents), if a
    lady – they did not allow women in – caught your eye and then hid behind her fan
    the gallant gentleman – they did not allow men in either – could count on being
    the last swain on the dance card.


    ### 21 early signs that he finds you attractive


    1. Does he make himself taller?


    2. Does he puff out his chest?


    3. Does he attempt to increase his ‘physical’ zone?


    4. Does he put his hands on his hips?


    5. Does he keep looking at you?


    6. Does he nod his head up and down slightly when you are talking?


    7. Does he keep his arms away from his chest?


    8. Does he attempt to interrupt other males when they are talking to you?


    9. Does he make eye contact all the time you are speaking?


    10. Does he give an encouraging smile or laugh at what you say?


    11. Does he attempt physically to block other males from moving close to you?


    12. Does he attempt to move into your private space?


    13. Does he find an excuse to touch your hand, elbow, arm or shoulder?


    14. Does he move his head slightly to his right when you are talking?


    15. Does he try to prolong conversations with you?


    16. Does he sneak an occasional look at your bust?


    17. Does he track you as you move through the room? (Ask a friend to observe!)


    18. Does he offer to do things for you? (Getting a drink or chair for you, opening
    a door, etc.)


    19. Does he try to sit close to you or next to you rather than opposite you?


    20. Does his tic (verbal or physical) become more noticeable?


    21. Does he attempt to walk with you when you leave?


    In medieval times it was easier because all the champion of the joust had to do
    was to present to the lady of his heart’s desire his colours and, with the king’s
    approval, the deal was sealed.


    ## So what does all this mean … ?


    To get all this into proportion, as important as attractiveness is, most of what
    we have been dealing with here has pertinence only to first impressions, and fortunately
    ongoing relations and those that grow into intimate relations take far more into
    consideration.


    When we first meet someone we reveal very little of ourselves. Much of our behaviour
    is governed by social/cultural norms, with personal individuality kept at a minimum.
    We smile a lot, agree a lot, and nod our heads a lot, wanting to appear an agreeable
    person.


    '
  toc: []
- raw: '(As an aside, the desire to make a good first impression is also one of the
    many reasons that makes interviewing such an unreliable technique for employee
    selection. The parties on both sides of the office desk are on their best behaviour;
    candidates presenting themselves in the best way they can and recruiters presenting
    their organisation in the best way they can, which explains the frequent disappointment
    of both parties three months later.)


    As relationships move on we begin to reveal more of our psychological apparel.
    According to Maslow’s hierarchy of needs,[^(37)](#part0006_split_001.html#ch3ref37)
    once we have and have satisfied our need for air, water, food and safety, then
    sex and social needs come to the fore. It is here that most of the body language
    of attraction comes into play. To survive, ongoing and permanent relationships
    demand far more of the couple than just the satisfaction of the sex drive or to
    be socially acceptable to our peers. Higher aspects of ourselves, such as interpersonal
    behaviour, our personality, our values and spirituality – all those significant
    aspects that make us truly human – are necessary not only in permanent relationships
    but in both life and work.


    One of the essential criteria for success is the strength of your interpersonal
    skills. Socially you need to have empathy, understanding, generosity, respect
    and, at work, social acceptance, influence and persuasiveness, since it is hard
    for you to get to the top without being able to get others to do things for you
    and for them to be happy and contented to do so. It is difficult to manifest these
    competences and traits without a portfolio of non-verbal skills and an understanding
    of body language.


    Now we might not be as attractive as we wish but in life it is very important
    to be able to influence others, so this is our next topic.


    | ![Image](images/00021.gif) || ‘I can win an argument on any topic, against any
    opponent. People know this, and steer clear of me at social events. Often, as
    a sign of their great respect, they don’t even invite me.’ |


    | --- | --- |


    |   || Dave Barry, comedian |


