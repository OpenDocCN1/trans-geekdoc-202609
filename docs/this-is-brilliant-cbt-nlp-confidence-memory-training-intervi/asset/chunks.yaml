    *   Try to see the whole picture – take into account all the facts, even if they
    don’t seem to fit with your expectations.


    *   See whether you can build a case for the opposite of what you currently believe:
    in our example that the wedding was a runaway success and that Jane did an exceptional
    job.


    *   Check that you are not blowing certain elements out of proportion. Did other
    people react in the same way as you did?


