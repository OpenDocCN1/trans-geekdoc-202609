    \ behind the contact.\n\n#### Do some research before the event\n\nOne of the\
    \ most important things to enable you to have confidence in approaching people\
    \ at an event is to do background research on them. If you have been given details\
    \ of other attendees, make use of this essential information. If they have a business,\
    \ look at their website; if they have written a book, it would be good if you\
    \ could read all or part of it prior to the event. This background research will\
    \ allow you to ask thoughtful questions from the outset and also to continue the\
    \ conversation later. For example, ‘Hi, I’ve been wanting to meet you. I really\
    \ enjoyed your book. What inspired you to write it?’\n\n#### Say something positive\
    \ or neutral\n\nSaying that the food is terrible might start a conversation, but\
    \ it may become a conversation that descends quickly into finding everything wrong\
    \ with a situation and you, by association, appearing as a complaining person.\
    \ A far better method would be to ask something neutral like, ‘Did you have far\
    \ to come to get here today?’ or ‘Why did you decide to come to this event?’,\
    \ or to pay someone a genuine compliment.\n\nSome subjects at networking events\
    \ should be avoided unless you have come together to discuss them specifically.\
    \ These include religion and politics, which can be highly emotive because of\
    \ conflicting ideas, emotions or perceptions. A sense of humour is a bonus but\
