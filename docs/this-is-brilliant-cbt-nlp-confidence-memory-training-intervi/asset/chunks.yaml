  trans: "\n\n# 掌控冲突局面，由你来结束它\n\n掌控冲突局面，由你来结束它。如果你认为有必要，要有道德上的勇气提出最后通牒。尽量按自己的条件结束冲突，但如果你判断公平且必要，也要做好妥协的准备。如果你决定争论这个问题，永远不要在没有解决它或商定下一步的情况下就离开。\n\
    \n![image](img/00003.jpeg)\n\n## Naomi\n\nNaomi 在处理难相处的人方面，与 Rob 的方法颇为相似。她的本能是选择退让，以免伤害他人的感情，或者更好的做法是，完全避免冲突，希望它会自行消失。\n\
    \n问题是，她尝试过这两种方法，却仍然不断与某个特定的人（Marie）发生冲突。她们都是处理假期保险的呼叫中心团队的经理。她们上不同的班次，因此很少见面。\n\
    \nNaomi 已经到了这样的地步：她觉得团队正在受苦，因为 Marie 坚持要塑造团队的运作方式。Naomi 经常来上班，发现 Marie 引入了一个她一无所知的新程序。Naomi\
    \ 不仅觉得这不专业，因为她们本应共同管理团队，她还觉得其中一些新程序是错误且低效的。\n\nNaomi 决定尝试三步计划来处理与 Marie 的关系。她必须鼓起相当大的勇气才能这样做，因为这意味着完全违背她的本能。她做的第一件事是与\
    \ Marie 安排一次会议。她事先解释说，会议的原因是讨论 Marie 最近引入的新程序。\n\n对 Naomi 来说，第 1 步很容易——她所要做的就是看着\
    \ Marie 的眼睛，倾听并吸收她所说的每一个字。她甚至不需要邀请 Marie 发言，因为 Marie 立即开始为自己引入新程序的理由进行辩解。Naomi\
    \ 还特意在 Marie 说话时做了一些笔记。她们之间的距离足够远，Marie 看不到笔记内容。Naomi 注意到 Marie 不时低头看笔记。这让她感到更自信；她确信自己察觉到了\
    \ Marie 行为中的不安。\n\n第 2 步更难——Naomi 必须表达自己的观点；这违背了她的自然倾向。她等到 Marie 说完。她写完正在做的笔记，抬起头。她让沉默持续下去。就在她感觉到\
    \ Marie 即将再次开口时，她开口了。她先总结了 Marie 说的话（她的笔记在这里很有帮助）。她清楚地解释了为什么她觉得该程序行不通，并提出了另一个解决方案。在某个时刻，Marie\
    \ 试图打断。Naomi 非常坚定地说：“我仔细听取了你的观点——请让我把我的观点讲完。”Marie 立即停止了说话。\n\nNaomi 没有让 Marie\
    \ 打断，直到她讲完。然后她们进行了讨论。Naomi 从一开始就心里很清楚，她不会退让。她已经充分研究了自己的论点，并准备为之捍卫。她惊讶地发现，过了一段时间，Marie\
    \ 让步了，而且，信不信由你，接受了它。\n\n第 3 步也进行得很好——Naomi 通过解释，她不觉得 Marie 在不让她参与的情况下做决定符合团队的最佳利益，从而保持了主动权。她提议从现在起，她们每周见面一次，以便能够更有效地共同管理团队。Marie\
    \ 对这个想法似乎有点戒心，但为了团队的利益同意了。\n\nNaomi 发现，随后，随着时间的推移，她与 Marie 的工作关系有所改善。虽然从未完美，但她处理与\
    \ Marie 冲突的方式的改变产生了巨大的影响。Marie 开始习惯这种情况，并且随着时间的推移，甚至私下承认她更尊重 Naomi，并且发现与她合作更容易，因为她“知道自己在\
    \ Naomi 那里处于什么位置”。\n\n这些技巧也应该能帮助你在遇到冲突时防止其升级：\n\n*   问问自己是否真的那么重要——换句话说，值得为此争论吗？最坏的情况是什么？\n\
    \n*   换个话题——不要再谈论它了。\n\n*   不要向别人重复，以让自己感觉好受些，或者只是为了发泄。\n\n*   设身处地为对方着想——从对方的角度看问题。\n\
    \n*   选择不与消极的人或为了争论而争论的人交往。\n\n*   关注事实，而不是情绪。\n\n*   清空思绪。离开环境，去散步或做一些体育锻炼。\n\
    \n*   赞美对方。有些人非常敏感；你可能会发现，仅仅友好一点就能帮助你赢得争论或达到目的。\n\n*   承认你已经听到了对方的观点。有些人只需要知道你在倾听，并且理解他们的担忧。\n\
    \n*   使用开放式问题，而不是封闭式问题。开放式问题邀请讨论，封闭式问题邀请是或否的回答。例如：\n\n    *   开放式问题——“你觉得那次会议怎么样？”\n\
    \n    *   封闭式问题——“你觉得那次会议开得好吗？”\n\n*   管理对方的期望；不要承诺你能做所有事情。如果你说你会做某事，请确保你能并且会去做。你会赢得更多尊重，人们会知道自己在你那里处于什么位置。\n\
    \n*   电子邮件——不要发送情绪化或愤怒的电子邮件。尽量当面处理问题。如果你别无选择，必须通过电子邮件回复某人，试着先写好电子邮件但不要发送。休息一下，冷静下来，然后再看一遍。不要发送，直到它以受控且专业的方式写成。否则，可能会适得其反。\n\
    \n*   睡一觉再想——一夜好眠能给分歧带来不同的视角，这真是令人惊讶。\n\n### 毫无畏惧！\n\n从今以后，你不应该在家里或工作中害怕冲突。如果你尝试将冲突视为一种不时会发生的事情，你会感到更有信心去处理分歧——你可能无法阻止它发生，但你可以处理它。将其视为生活的一部分的自然现象。人们的行为和思维方式不同，因此偶尔会互相意见不合，这是事实。\n\
    \n这其实是一件好事和积极的事情——如果我们都一样，作为人类种族的进步速度会慢得多。事实证明，例如，最成功的团队是那些拥有最多样化的人格、知识和智力组合的团队。真正成功的关键是理解如何将任何意见分歧（冲突）转化为协议和有效行动。\n\
    \n如果你真的思考一下，并尝试分析冲突发生的原因，大多数时候你会得出结论：它源于个人风格和方法的差异。分歧可能始于意见不合，但升级为冲突通常是由于行为和个人风格的差异。在极端情况下，意见分歧被完全遗忘，风格和行为的冲突成为核心冲突问题本身。\n\
    \n![image](img/00004.jpeg)\n\n预期分歧会发生。你的挑战是冷静地处理每种情况，以免其升级为冲突。记住三个关键步骤：等待、表达、采取主动。\n\
    \n### 你只是天生害羞吗？\n\n家庭和工作中自信的另一个共同点是害羞。\n\n"
