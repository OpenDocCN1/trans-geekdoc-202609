    \ would work well for you?\n\n#### 7 Budget\n\nThere may or may not be a budget\
    \ for your offering. It is really helpful to know what amount has been budgeted\
    \ and with what timescale. When qualifying, assess where a prospect is in their\
    \ buying cycle. So many salespeople ignore the customer buying cycle and just\
    \ enforce a rigid sales cycle and wonder why they fail. If a customer has budget\
    \ available and is ready to buy immediately, then don’t ask unnecessary questions.\
    \ Just close the deal.\n\nWe were able once to do a deal with an organisation\
    \ (later to become a key account) in which they used their budget for the following\
    \ year and we invoiced them at a later date. They appreciated our flexibility!\n\
    \nHere are some questions you might consider:\n\n*   How do you handle budget\
    \ considerations?\n\n*   What price range are you considering?\n\n*   Who is paying\
    \ for this?\n\n*   How will the funding for the project be justified?\n\n![image](images/00024.jpeg)\n\
    \nThink about your own selling context. What other questions are there that would\
    \ work well for you?\n\n#### 8 Momentum/qualifying\n\nSalespeople sometimes spend\
    \ too long talking to prospects when there is little hope of the prospect buying\
    \ and where there is no momentum. Ask qualifying questions to establish whether\
    \ this opportunity is worth pursuing.\n\nHere are some questions you might consider:\n\
    \n*   What do you see as the next action steps?\n\n*   What is your timeline for\
    \ implementing/purchasing this type of service/product?\n\n*   What constraints\
    \ do you have in this area?\n\n*   What further information do we need to discuss\
    \ before we move this forward?\n\n![image](images/00024.jpeg)\n\nThink about your\
    \ own selling context. What other questions are there that would work well for\
    \ you?\n\n#### 9 Extending the relationship\n\nOf course, questions do not stop\
    \ when the prospect becomes a customer. Keep on asking questions. If they are\
    \ delighted by you and your service then ask questions that will allow you to\
    \ extend the relationship or cross-sell. Or ask them to give you a referral –\
    \ people will happily do this if they like the product/service and like you! Ask\
    \ for referrals at the height of the gratitude curve – when they think you are\
    \ great and have offered an outstanding service, or when they are experiencing\
    \ the benefits of your product.\n\nHere are some questions you might consider:\n\
    \n*   What else are you looking to address in the business right now, or in the\
    \ future?\n\n*   What other opportunities are there within the business?\n\n*\
    \   Would it be helpful for you to know what else we offer?\n\n*   Who else do\
    \ you know in business who might like what we have to offer?\n\n![image](images/00024.jpeg)\n\
    \nThink about your own selling context. What other questions are there that would\
    \ work well for you?\n\n![image](images/00010.jpeg)\n\nSo, it is not just about\
    \ asking random questions in order to tease out answers. Brilliant Selling needs\
    \ to be focused on asking the right questions at the right time to the right person.\
    \ Successful salespeople use similar skills in this area to a top business coach\
    \ – they ask questions that:\n\n*   are understandable and logical;\n\n*   work\
    \ to help the buyer get clarity;\n\n*   and build momentum.\n\nTake your time\
    \ before each sales meeting you have in the future and ask yourself which questions\
    \ are most appropriate. Notice that questions are the answer to developing a better\
    \ understanding of the people you want to influence. The key points from this\
    \ section are:\n\n*   There are seven principles – be curious, have an outcome,\
    \ let the conversation flow, use open and closed questions, make your questions\
    \ understandable, identify motivations and avoid offending your buyers.\n\n* \
    \  Ask focused questions to identify needs and wants, selection criteria, options,\
    \ reaction to your product/service, the people involved, decision making, budget,\
    \ qualification and how to extend the relationship.\n\nAnd, of course, questions\
    \ are only half of it. If you cannot listen well then you will reduce rapport\
    \ and be unable to take the customer to the next stage …\n\n[![Image](images/00052.jpeg)](http://www.amazon.co.uk/Brilliant-Selling-2nd-edn-ebook/dp/B00EIC5RJK/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320747&sr=8-1&keywords=brilliant+selling)\
