  trans: "\n\n1. 如果你销售的东西远非独一无二，那么你能卖出高于市场价值的价格就算幸运了。\n\n2. 如果你购买的东西并不稀有，那么如果你能耐心等待，在上述一些条件对你有利时再购买，你可能会得到一个非常好的价格。\n\
    \n3. 如果你销售的是稀有且受欢迎的东西，你应该能得到一个好价格。\n\n4. 如果你销售的是稀有且少数人可能想要的东西，而你又愿意等待，你应该争取一个好价格。\n\
    \n5. 如果你购买的是稀有且受欢迎的东西，那么要做好支付溢价的准备（或者做好没有它也能活下去的准备）。\n\n6. 如果你追求的是稀有但吸引力有限的东西，那么善于讨价还价的人可能会做得很好……保持镇定，尽量不要表现出你多么想要它。\n\
    \n## 开盘，还是不开盘？\n\n### 让对手先开盘的优势\n\n鉴于大多数谈判者不够激进，你的对手在出售时很可能开价过低，在购买时很可能开价过高。如果你随后做出激进的还价，讨价还价阶段就开局良好。\n\
    \n### 开盘的优势\n\n自信的谈判者经常先开盘，因为如果你激进地开盘，你可以在讨价还价阶段占据主导地位。如果你的对手看起来是个自信的人，那么这个策略不太可能奏效。\n\
    \n没有“一劳永逸”的建议。令人欣慰的是，开盘和不开盘都有优势，因此无论哪种情况，你都可以最大限度地利用可能性。\n\n### 如果被谈判物品的价值不明确，试着让对手先开盘\n\
    \n除了对手可能会开价过低之外，他们还有很大机会错误地低估物品价值（在出售时），或高估物品价值（在购买时）。如果你的对手看起来缺乏经验，那么这是一个特别有吸引力的方法。你可以通过诸如“你最好的报价是多少？”之类的评论来提示他们开盘，或者也许更好的是“你觉得它值多少钱？”、或者“你能接受多少？”、或者“你的预算是多少？”、或者“你一定心里有个数，你想要/愿意支付多少？”\n\
    \n## 开盘报价和还价\n\n本节为你提供关于如何定价第一个报价的明确建议。\n\n### 经典开局策略\n\n经典建议是，让你的第一个报价或还价成为（如果你在出售）尽可能高的可信数字，或者（如果你在购买）尽可能低的可信数字。坦率地说，你的报价即使进入了不可信的领域也没关系……这比过于谨慎地定开盘报价要少得多的损失。然而，也有经典建议是错误建议的情况，我现在将解释这些情况。\n\
    \n### 当你希望通过拍卖来确定最终价格时\n\n如果你在在线拍卖网站上出售，或者你希望能够让一个买家与另一个买家竞争，那么你可以以低价开盘。这通常会吸引多个竞标者，并为竞价狂潮创造最佳环境。\n\
    \n### 当你希望（相对）快速出售时\n\n出售像你的房子这样的东西有两种明显的方法。你可以将其定价略低于市场价，这几乎能保证快速出售，并且一旦有一个或多个买家感兴趣，你可以在抵制进一步降价的压力方面相当强硬——事实上，你可能会得到多个买家出价高于报价。或者，你可以设定一个乐观的价格“因为我以后随时可以降价”。第二种方法可能会导致真正想要这栋房子的人支付你的价格，但通常会导致你在以后的某个日期降价，到那时你的房子已经错过了作为新房源的热度。\n\
    \n### 在市场集市上\n\n在这种情况下，开盘报价往往是：\n\n* 不可思议的，以及……\n\n* 由当地习俗决定（通常有数百甚至数千年的历史）。\n\
    \n所以请向熟悉当地习俗的人寻求建议……并提升你的夸张演技。\n\n我现在要说一件可能看起来完全不合常理的事情。如果你是欠发达国家的游客，那么你必须讨价还价，因为拒绝这样做会让商人困惑（最好的情况）或被认为无礼（最坏的情况）。但是，请记住，涉及的钱对商人来说比对你来说重要得多，所以不要争取最低可能的价格——给他们多一点利润。\n\
    \n## 总结\n\n讨价还价的本质是“我想要”。如果你有逻辑论据可以用来得到你想要的东西，那很好，但如果你没有，你就需要将你作为谈判者的意志和技巧与你的对手对抗，以便你能比他们得到更好的交易。如果你将这场意志和技巧的较量视为一场游戏，你就能非常有竞争力而不至于情绪化。\n\
    \n在评估物品价值时，你可以研究类似物品的价格，或者如果物品是独一无二的，你可以寻找一个类比来与其比较，咨询专家，通过拍卖出售，或者计算你愿意支付多少。\n\
    \n在购买或出售物品时，最重要的是知道何时可以在价格上大胆一些。买卖世界分为六种情况，这些情况显示供需法则将决定你何时应该在讨价还价中大胆一些。\n\n如果物品的价值不明确，最好鼓励你的对手先提出开盘报价。在其他情况下，是否最好先提出开盘报价就不那么清楚了。如果你的对手先开盘，他们可能会过于谨慎，这对你有利。如果你先开盘，你可以自信地在价格上设定议程。这意味着无论你是否先提出开盘报价，你都可以获益。\n\
    \n![Image](http://www.amazon.co.uk/Brilliant-Negotiations-2e-Negotiators-ebook/dp/B00A8N8J2A/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320668&sr=8-1&keywords=brilliant+negotiations)\n\
    \n![Image](img/00046.jpeg)\n\n你如何向听众展示自己是关键。不，你不需要成为专业演员，但你需要成为一名出色的演讲者。你需要表演一场演出，因为演示需要这一点强调，一点戏剧性，一点自信和从容。\n\
    \n| ![Image](img/00021.gif) || ‘始终表现得自信。’  \n\n巴拉克·奥巴马 |\n\n| --- | --- |\n\n\
    ### 但表演可以有所帮助\n\n达斯汀·霍夫曼非常认真地对待他的工作。当他在《马拉松人》中时，他必须在一个场景中显得疲惫不堪。作为一个完美主义者，他彻夜未眠，第二天到达片场时脸色苍白，眼睛肿胀，精疲力竭。劳伦斯·奥利维尔饶有兴趣地打量着他：“亲爱的孩子，你为什么不试试表演呢？这要容易得多。”\n\
    \n2009 年在孟买的一个活动上，在一个名为“孟买巨人”（孟买/孟买……随你挑）的仪式上，慈善家和高成就者因他们为城市所做的工作而受到当地名流的表彰。有一位律师、教育家、商人、学者、广播员、医生和两位宝莱坞演员，其中一位演员到达时引起了女性的尖叫和大量的狗仔队相机闪光和咔哒声。沙希德·卡普尔是一名演员：30\
    \ 岁，非常英俊，并且知道这一点；一位新星。他讲了话，以下是我对他腼腆所说的话的回忆：\n\n“我获得了一定的短暂名声……拍完最后一部电影后，谁还记得那个呢？……但那种名声让我能够打开大门……我想为你们这样做……为任何为孟买穷人做伟大工作的你们。谢谢你们，也谢谢这个奖项。我来这里是为了你们。”\n\
    \n电影演员拥有的是说话得体、清晰、直接的诀窍。向他们学习，变得自信、从容、成为一名好演讲者……这是一个很好的开始。至于沙希德，我们都被震撼了。\n\n![image](img/00004.jpeg)\n\
    \n首先学会说话得体——清晰而简单。并学会尊重你的听众（以及爱他们）。\n\n## 赞美努力工作（赞美美国）\n\n"
