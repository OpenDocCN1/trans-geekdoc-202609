- raw: 'If you tend to be disorganised in the way you run your life, you’ll struggle
    to think clearly and logically. If you can’t think clearly and logically, you’ll
    let both yourself and others around you down. The result, of course, is that nothing
    people perceive in you is positive. At best they’ll see you as messy and scatty;
    at worst they’ll see you as lazy, unreliable, unprofessional, selfish … and the
    list goes on.


    The difficulty is that people won’t necessarily tell you they see you like this,
    they’ll just perceive it. More often than not, if they perceive it, you’ll detect
    it in their behaviour towards you. As we’ve seen already, this could have a significant
    impact on your work and personal life.


    So, when you started thinking about building your self-confidence, you might not
    have seen the link between personal organisation and confidence. Don’t worry though,
    you wouldn’t have been the first person not to. The key now is to address the
    issue if you need to.


    #### Managing your time


    Being efficient and organised with the use of your time is essential. If you feel
    that your life is under control and that you’re making the most of it, your sense
    of well-being will be stronger. This is bound to help with your personal self-belief
    in relation to what you would like to achieve.


    Try asking yourself how you tend to approach life. Are you what is often referred
    to in ‘time management language’ as a Type A personality or a Type B personality?


    *   Type A – Describes people who like to get things done and push themselves
    quite hard. They’ll cram a lot into their day. However, they sometimes take on
    too much and fail to set aside enough time for relaxation or reflection on where
    they are going.


    *   Type B – Describes people who work at a slower pace and are able to bring
    a healthy balance to their lives. They aren’t so conscious of time deadlines.
    People who demonstrate extreme Type B behaviour often let others down because
    of their laid-back nature.


    Having established where you see yourself on the Time Line (see [Figure 8.2](#part0007_split_001.html#ch8fig2)),
    consider whether or not you would benefit by changing your approach slightly.
    You might find that you fall between Type A and Type B behaviour. That’s not unusual.
    In fact, it’s quite a nice place to be because you’re not leaning towards either
    extreme.


    ##### Don’t be late!


    Type A people tend to be late because they’ve got so many other things to do.
    Type B people may be late because they’re just more relaxed about the concept
    of time. There are the obvious reasons for not being late, the main one being
    that you’ll let others down and waste their time. Some people naturally feel bad
    when they let people down, others don’t. Ask yourself where you stand here.


    So, what’s this got to do with confidence? Put simply, if you want to feel confident
    at all times, you’ll need to have this considerate mentality built into your mindset.


    ![Image](images/00026.gif)


    Figure 8.2 The time line


    Letting people down is a good enough reason on its own for not being late, but
    there are other more personal reasons that can also have a direct impact on your
    confidence:


    *   If you’re late, you’re already on the back foot. The other person already
    sees something negative in you because you’ve let them down. You can’t afford
    to project any negativity at all if you want to come across, and therefore feel,
    confident. If you’re late, you’ll have a slope to climb, created completely through
    your own making, rather than a level playing field.


    *   If you’re late, you’ll cause a distraction for yourself (and others). You’ll
    be thinking about what people think of you rather than how you’re coming across.
    You know you’re late and this will be (or certainly should be) on your mind. You
    can’t afford any distractions if you’re trying to come across confidently. You
    need 100 per cent attention on the task at hand – i.e. to look and sound confident.


    Wherever you find yourself on the Time Line, make the decision right now that
    you will endeavour never to be late again. Of course, if you’re delayed by events
    outside your control, then that’s understandable. Don’t forget to explain this
    though when you get there!


    ![image](images/00004.jpeg)


    Don’t be late, don’t even be on time – be slightly early. Then you’ve got time
    to prepare yourself to come across confidently. You’ll be on the front foot (and
    already one step ahead of people who haven’t yet arrived).


    #### Staying healthy and keeping fit


    ‘Life is like riding a bicycle. To keep your balance you must keep moving.’


    Albert Einstein


    I’m not sure that Einstein meant this quote to be taken literally – after all,
    it’s unlikely he was a fitness fanatic! More than likely, he was referring to
    keeping active in terms of new ideas and thinking so you don’t get left behind.
    But perhaps there is a more literal meaning to this quote … Let’s presume so for
    the moment.


    If you’re out of shape, there’s more chance you’ll feel insecure and unattractive.
    So by keeping in reasonable shape, you’ll improve your physical appearance and
    feel more energetic.


    Of course, this doesn’t happen on its own. You’ll need to make the effort to achieve
    it. It’s true that there’s a direct link between your physical state and your
    mental state. The healthier you are, the more energy you’ll have. The more energy
    you have, the easier you’ll find it to maintain a positive mental attitude.


    ![Image](images/00027.gif)


    Figure 8.3 Health and fitness


    It’s also been proven that physical exercise is a powerful natural antidote to
    depression. So there are no negatives about keeping fit, there are only positives.


    Consider health and fitness on two levels:


    *   Your general health


    *   Your physical fitness


    ##### General health


    With the exception of illnesses over which you have no control, everyone should
    be able to stay healthy. If you’re sensible with your diet and keep it balanced,
    if you ensure your body isn’t physically stressed, if you get enough sleep and
    you get exercise, then you should be able to stay in good general health. If one
    of these key requirements is missing due to your lifestyle, you should think about
    making a change – you’ll struggle to stay positive otherwise.


    ##### Physical fitness


    It’s also important to keep physically fit. Don’t worry though, you don’t have
    to be super-fit – you just need to keep your body in trim. This is harder for
    some people than others due to physique and dietary considerations. BUT – everyone
    can do it. It just takes self-discipline. You need to find a realistic level of
    fitness that suits you.


    This is worth trying if you haven’t tried it already. Of course, ‘physical fitness’
    means different things to different people. Don’t worry about other people – don’t
    try to match others unless you feel it would help. Manage your expectations here
    and do what you feel comfortable with. For one person this could mean walking
    twenty minutes a day, for another it could mean running for twenty minutes a day.


    There are all sorts of fitness regimes you could consider – too many to list here.
    Do some research on the internet and pick one that suits you. You might also consider
    joining a gym, perhaps even joining a club. It doesn’t have to be a running club
    – it could be any type of sport or perhaps a walking club. Start off slowly and
    work up, don’t challenge yourself too much at the beginning.


    ### Finding your focus


    #### Understanding what drives you


    To feel confident and in control of your life, you need to know what drives you;
    you need to know what makes you tick. Knowing what you actually need to keep you
    enthusiastic about life is an essential component of personal motivation. Knowing
    what you need is much more important than just knowing what you want. Needs are
    essential requirements, wants are desirables. There’s a significant difference
    here in relation to feeling and being confident.'
