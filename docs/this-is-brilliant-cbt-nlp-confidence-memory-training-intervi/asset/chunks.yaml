- raw: 'Sometimes we’re tempted to tell really big porkies just to get our presentation
    flying … or, if we’re honest, we know the story we’re telling doesn’t quite stand
    up and we know it shows.


    ### A strong argument helps you feel confident


    Your performance deserves a strong, bulletproof argument (as opposed to just a
    bullet-point argument). Not only will it always be better if it has this, it will
    also be easier to perform – no more butterflies about being destroyed by questions
    in the Q&A because of corrupt logic.


    So let’s consider the ways in which your performance can be enhanced so that you
    stand out as a presenter. At this stage there will be those among you who say
    that you hate acting. You might as well say you hate work. Crudely, if you are
    an executive, learn to present by putting on a good show because all corporate
    life nowadays involves a degree of acting – as in maintaining a poker face, as
    in controlling your temper, as in being nice to people you don’t really like,
    as in being patient with the personal woes of an employee, as, in short, doing
    your job. And any way you can find that helps the performance is worth taking.
    Even bribing yourself to do a great show.


    ![image](images/00004.jpeg)


    Reward yourself every time you do a major presentation.


    ### Performance – left and right brain


    Left brain is the functional stuff that obviously matters. The techniques that
    make you clear, audible and authoritative. Right brain is the creative stuff that,
    when it works, makes your presentation fly.


    To start with you need to be sure you have the ability to achieve those functional
    competence issues and pass the left-brain test. You need to tick these boxes.
    Do you:


    *   look good;


    *   seem confident;


    *   know your stuff;


    *   seem very well rehearsed;


    *   come across as audible and clear;


    *   finish on schedule (and never over-run)?


    And then the right-brain stuff that fills Malcolm Gladwell’s book Blink. This
    is about first impressions and qualitative responses from the audience’s viewpoint:


    *   Do I warm to this person?


    *   Do I trust this person?


    *   Would I like to meet this person again and carry on the conversation?


    *   Are they inspiring?


    I’ve already talked about sitting on the metaphorical flight deck doing your pre-presentation
    check. Now, to achieve ‘flight clearance’ to do a presentation by your left-brain
    control tower, read the book, follow the tips, practise, work with peers to make
    sure they can see you, hear you and understand you.


    For right-brain flight clearance you need to read and put into practice what’s
    in this book. But you should also, when you’ve done that, work with a presentation
    coach who’ll help you do the three things that make the real difference to your
    on-stage presence. They’ll do the following:


    1.  Help you find your voice – the style, tone and pitch which seems to work best
    for you.


    2.  Help you be yourself but a bigger more dramatic version of you.


    3.  Help you simplify and strengthen the impact of your body language.


    And you’ll find the more work you do the easier this process of self-discovery
    is. There are some presenters who just love doing it and whose appetite for it,
    like a chef who loves food and the taste of it, is totally beguiling. Like Sophie
    Patrikios, Head of Consumer Services at Lego. Like the service Lego claim to provide,
    she’s fun, knowledgeable and engaging. If you get the chance to see her do so.
    She’s not just nerveless about it, so much as in love with presenting and telling
    her story.


    ![image](images/00004.jpeg)


    Find your voice. Find the ‘you’ that comes across best in a presentation. The
    more you do presentations the easier this is.


    ![image](images/00047.gif)


    *   Be yourself: David Abbott, one of the legendary advertising figures of the
    twentieth century, spoke of people going into ‘presentation-speak, hunched up,
    glazed eyes, Dalek-voiced and didactic’. There’s no need for that. Take what you
    have and make a vow to lift yourself up two or three levels. Be bigger. Impose.
    But don’t be someone else.


    *   Work on how you look: Of course you need help, how can you work this out yourself?
    Get advice on how to dress – for women, a well-cut trouser suit always looks powerful
    and modern. (But in the end women have a much better sense of style than I have.
    My only comment is make sure you feel great and if that means buying a new outfit
    for every big presentation you make, then do it. It’s a good incentive to be brilliant.)
    For men, a dark suit with a white or light blue shirt and no tie (though you can
    wear one if you want). Slight sun tan – no workaholic you. Do not let anyone,
    however well intentioned, make you wear anything or have a look that makes you
    feel awkward. The whole point about this is to make you feel better about yourself
    – you are the star. You need to think and feel that you look your best to be your
    best.


    *   Do you have stage presence? Look around you as you go on stage – the bigger
    the stage, the bigger the look and the bigger the sweep of your gaze. Walk on
    with a straight back. However you really feel, look as though you are glad to
    be there. It’s worth repeating that – look as though you are glad to be there.
    Smile and say ‘Ha!’ under your breath (especially under your breath if you are
    miked-up) – it will animate your face. If it’s a smaller event, simply try to
    be engaged and interested in what is going on and when you start or stand up to
    speak make eye contact with a few people and think ‘Hey, I really like (even love)
    these people.’ It’s amazing how this communicates to an audience. The number of
    times I’ve seen ill-at-ease, shifty, grumpy or even downright hostile speakers
    is legion. Try to imagine that the people out there have loads of money and that
    they are going to give some to you, but only if you look cheerful and really glad
    to be with them. Stage presence is like sex appeal – some people have it naturally,
    some acquire it. Whenever Marilyn Monroe stepped into a room everyone stopped
    and noticed.


    *   Try to radiate self-belief: As someone once said to me, ‘You have to believe
    what you are saying even if you don’t believe it.’ What is it that marks out the
    brilliant presenter? The best presenters in the advertising business tend to be
    shameless showmen. ‘Shameless’ is such a great word – say it to yourself next
    time you walk up on stage, ‘Hey I feel totally shameless today’, and see what
    happens. All you have to do is radiate confidence and a conviction about your
    subject. Lord Denning, one of the more formidable orators of the twentieth century
    and a fine lawyer, recalled his pupil master saying to him: ‘People pay us for
    our certainty, not for our doubts.’ Always act confident.


    *   Never talk in jargon: Something about standing up in public and talking has
    always (once I conquered my nerves) made me giggle. And in truth many presentations
    are absurd, especially in a world where jargon is rife. A few years ago someone
    invented ‘bullshit bingo’ – a game in which you drew a box within which were 36
    squares. Each square contained a piece of management jargon – ‘going forward’,
    ‘strategic’, ‘focus’, ‘blue sky’, ‘global’, ‘scale-up’, ‘benchmarking’, ‘culture’,
    ‘ratio’, ‘downsizing’, ‘outsourcing’ and so on. The game was to mark off each
    loathsome word as it occurred and if a vertical or horizontal line was filled
    then the lucky winner leapt to their feet shouting ‘bullshit’. Avoid all jargon,
    speak English – in short sentences with short words. And remember that the way
    a script is written bears no relation to normal writing – it should have short
    sentences, big type; it should be fast … conversational … bold.'
