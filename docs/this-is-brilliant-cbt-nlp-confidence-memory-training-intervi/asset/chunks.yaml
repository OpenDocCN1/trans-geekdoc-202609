    A lot of the people I meet on confidence-building courses describe themselves
    as ‘shy’. They struggle to come forward to speak both at home and at work. Overcoming
    shyness isn’t difficult but it does require discipline, preparation and courage.
    In other words, it requires a number of the tips and behaviours already mentioned
    in the book. Put these into effect and you’ll find it easier to deal with your
    tendency to feel shy.


    ‘You gain strength, experience and confidence through every experience where you
    really stop to look fear in the face. You must do the thing you cannot do.’


    Eleanor Roosevelt


    ![image](images/00003.jpeg)


    Jenny


    Jenny had two young children at primary school. Being shy, she found it hard to
    talk to the other mums at the school gate. It got to the stage where, at pick-up
    time at the end of the school day, she’d find herself hiding in her car watching
    all the other parents chatting in the playground waiting for the kids to come
    out.


    The situation got worse and worse; as the other parents got to know each other
    better, she knew no one. It got so bad that she ended up getting out of her car
    as the kids came out, picking them up, talking to no one and driving home. This
    went on for a whole year! Of course, the longer she didn’t talk to people, the
    harder it became to strike up a conversation.


    It wasn’t until her seven-year-old daughter Daisy asked her why she never talked
    to any of her friends’ parents that she realised she had to do something about
    it.


    So she booked a confidence course and that’s how I met her.


    After the course she had a plan which she put into practice straight away. It
    required discipline, preparation and courage.


    ## 1\. Discipline


    Firstly, Jenny vowed to herself that never again would she sit in her car waiting
    for the children. She would force herself to talk to at least one person every
    day at the school gate. Ideally, each day she would choose a different person
    so that she started to get to know people more quickly.


    ## 2\. Preparation


    Secondly, she prepared. She worked out what she was going to say while she was
    on her way to the school in the car. The things she thought of revolved around
    topics she’d have in common with other parents – for example, school clubs, sporting
    events, etc. She also prepared in her mind. In other words, she psyched herself
    up. This was probably the most important part of her preparation because it was
    mainly her fear of talking to the other parents that was holding her back. Lastly
    she prepared by visualising herself actually doing it confidently. By the time
    she got to the school she was ready.


    ## 3\. Courage


    Thirdly, she acted. When she arrived at the school, she looked at the parents
    waiting at the gate and decided on the person she would talk to. She had the topics
    at the forefront of her mind.


    She courageously and confidently got out of her car, walked to the gate with her
    shoulders back and head up and went through with it. The first day it was a major
    challenge just walking up to the person (Jenny even described it as ‘embarrassing’).
    The second day, it became a little easier, the third day even easier. By the end
    of the first week she’d struck up a conversation with five different parents.
    The next week, one of the parents even came up to her for a chat! And on it went.


    Of course, introducing herself to other parents wasn’t just good for her, it benefited
    her children too; they saw their mum behaving more ‘normally’ and it opened up
    more opportunities for them to go round to their friends’ houses to play. Even
    better, they got invited to more birthday parties!


    Jenny overcame her fear of talking to other parents in the playground. The same
    principles apply whenever you have a fear of doing something: you’ll need discipline,
    preparation and courage.


    So, the time has come to show your confident self …


    ### Make an immediate difference At Work:


    *   Speak up more in meetings, never leave without contributing.

    *   Offer to do that presentation, don’t wait to be asked.

    *   Show an active interest in others; get yourself round the office more.

    *   Hold yourself confidently; use charismatic body language around the workplace.

    *   Be assertive; say what you’re thinking when you’ve got a point to make.

    *   Liven up; show some energy and a degree of urgency to get things done.

    *   Be decisive; stand up and be counted.


    ### Make an immediate difference At Home:


    *   Widen your circle of friends; socialise with positive, not negative people.

    *   Be active; keep healthy and fit.

    *   Get your priorities right; make sure you have a balance between work and recreation.

    *   Get motivated; ensure you’re getting what you need.

    *   Enjoy life; do something for yourself every now and then.

    *   Achieve more; set personal objectives.

    *   Don’t hide; take the initiative at social events.


    Approach this in simple terms. Use the GARMS principle ([Figure 8.6](#part0007_split_001.html#ch8fig6)).
    It’s self-explanatory. It works.


    ![Image](images/00030.gif)


    Figure 8.6 The GARMS principle


    ![image](images/00010.jpeg)


    Chapter 8


    *   Consider the four key elements to life and find the right balance.

    *   It matters if you’re messy and disorganised; it can have a negative impact
    on how people see you.

    *   Help yourself to stay confident by keeping healthy and fit.

    *   Personal motivation and drive are essential to keeping a confident frame of
    mind.

    *   Know your natural conflict style. What’s your ‘default’ position when under
    pressure?

    *   Have the courage to use the right style for the right conflict situation.

    *   Decide on a plan for dealing with difficult people.

    *   If you’re shy, adopt DPC: discipline, preparation, courage.


    [![Image](images/00031.jpeg)](http://www.amazon.co.uk/Brilliant-Self-Confidence-Lifeskills-ebook/dp/B00AR06LSS/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320733&sr=8-1&keywords=brilliant+self+confidence)


    ![Image](images/00032.jpeg)


    In this chapter you will learn:


    *   a range of systems for remembering numbers

    *   easy ways to learn everyday digits: TV channels, times, dates, prices, PINs
    …

    *   the skills involved in putting names to faces

    *   simple techniques for helping other people to remember you

    *   how to manage your life by linking numbers to names


    You’re not alone: everyone finds numbers and names hard to remember. Numbers are
    abstract ideas, hard to hold on to, easily confused. Names are arbitrary labels
    that can be too common, too rare, too complicated or just too straightforward
    to stay in your head. Both are often presented in the worst ways imaginable: a
    long phone-number called out across a busy office; five new names fired at you
    around a restaurant table. And both are particularly frustrating because they
    have such a major impact on your life.


    ![image](images/00033.gif)


    Just think – if you could cope with numbers, you’d be able to:


    *   remember meeting times, appointment dates, birthdays, anniversaries

    *   make better judgements about prices, negotiate more favourable deals

    *   save time making phone calls, following directions, finding addresses

    *   recall DIY measurements, recipe amounts, clothes sizes

    *   learn history dates, geography statistics, science facts, literary references


    If you knew how to learn names, you could:


    *   strengthen your relationships with colleagues at work

    *   improve your networking skills and make powerful new contacts

    *   feel more confident in social situations

    *   boost your knowledge about famous figures, past and present

    *   make sure other people remember you for all the right reasons


    And if you were brilliant with them both, you’d be able to bring a new level of
    order to every area of your life: linking people to their birthdays; connecting
    names and addresses, ages, phone-numbers, order references, team positions; recalling
    whom to meet in which office at what time …

    '
  trans: '


    很多人在自信心建设课程中遇到的人都自称“害羞”。他们在家里和工作中都很难鼓起勇气发言。克服害羞并不难，但确实需要自律、准备和勇气。换句话说，这需要书中已经提到的一些技巧和行为。将这些付诸实践，你会发现更容易应对自己容易感到害羞的倾向。


    “你只有在真正直面恐惧的每一次经历中，才会获得力量、经验和自信。你必须去做那些你认为自己做不到的事。”


    埃莉诺·罗斯福


    ![image](img/00003.jpeg)


    Jenny


    Jenny 有两个上小学的年幼孩子。由于害羞，她发现很难在学校门口和其他妈妈交谈。情况发展到，放学接孩子的时候，她总是躲在车里，看着操场上其他家长聊天，等孩子出来。


    情况越来越糟；随着其他家长彼此越来越熟，她却一个都不认识。情况糟糕到，当孩子出来时，她下车接孩子，不与任何人交谈，然后开车回家。这样持续了一整年！当然，她越不和别人说话，就越难开启一场谈话。


    直到她七岁的女儿黛西问她为什么从不和她朋友的家长说话，她才意识到必须采取行动。


    于是她报名参加了一门自信心课程，这就是我认识她的方式。


    课后她制定了一个计划并立即付诸实践。这需要自律、准备和勇气。


    ## 1\. 自律


    首先，Jenny 向自己发誓，再也不坐在车里等孩子了。她要强迫自己每天在学校门口至少和一个人交谈。理想情况下，每天她都会选择一个不同的人，这样她就能更快地认识人们。


    ## 2\. 准备


    其次，她做好了准备。她在开车去学校的路上想好了要说什么。她想到的事情都围绕着她与其他家长共有的话题——例如，学校俱乐部、体育赛事等。她还在心里做好了准备。换句话说，她给自己打气。这可能是她准备中最重要的部分，因为主要是她对与其他家长交谈的恐惧在阻碍着她。最后，她通过想象自己自信地去做来做准备。当她到达学校时，她已经准备好了。


    ## 3\. 勇气


    第三，她采取了行动。当她到达学校时，她看着校门口等待的家长，决定要和谁交谈。她把话题放在脑海的最前面。


    她勇敢而自信地下了车，挺直肩膀，抬起头走到校门口，并完成了这次交谈。第一天，仅仅走到那个人面前就是一个巨大的挑战（Jenny 甚至形容这很“尴尬”）。第二天，变得容易了一些，第三天更容易。到第一周结束时，她已经和五个不同的家长搭上了话。第二周，甚至有一个家长主动过来和她聊天！事情就这样继续下去。


    当然，向其他家长自我介绍不仅对她有好处，也对她的孩子有好处；他们看到妈妈行为更“正常”了，这为他们去朋友家玩开辟了更多机会。更棒的是，他们收到了更多生日派对的邀请！


    Jenny 克服了在操场上与其他家长交谈的恐惧。同样的原则适用于每当你害怕做某事的时候：你需要自律、准备和勇气。


    所以，是时候展示你自信的自我了……


    ### 在工作中立即产生影响：


    *   在会议上多发言，绝不空手而归。

    *   主动承担那个演示，不要等着别人邀请。

    *   对他人表现出积极的兴趣；多在办公室里走动。

    *   自信地举止；在工作场所使用富有魅力的肢体语言。

    *   坚定果断；当你有观点要表达时，就说出你的想法。

    *   充满活力；展现一些精力和紧迫感来完成事情。

    *   果断决策；站出来，让自己被看到。


    ### 在家中立即产生影响：


    *   扩大朋友圈；与积极的人，而非消极的人社交。

    *   保持活跃；保持健康和体魄。

    *   把事情排好优先级；确保工作和娱乐之间有平衡。

    *   激励自己；确保你得到所需的东西。

    *   享受生活；不时为自己做点事。

    *   取得更多成就；设定个人目标。

    *   不要躲藏；在社交活动中主动出击。


    用简单的方式来处理这个问题。使用 GARMS 原则（图 8.6


    图 8.6 GARMS 原则


    ![image](img/00010.jpeg)


    第 8 章


    *   考虑生活的四个关键要素，找到正确的平衡。

    *   如果你邋遢无序，这很重要；这会对别人对你的看法产生负面影响。

    *   通过保持健康和体魄来帮助自己保持自信。

    *   个人动力和驱动力对于保持自信的心态至关重要。

    *   了解你天生的冲突风格。在压力下，你的“默认”立场是什么？

    *   有勇气为正确的冲突情况使用正确的风格。

    *   制定处理难缠之人的计划。

    *   如果你害羞，采用 DPC：自律、准备、勇气。


    ![Image](http://www.amazon.co.uk/Brilliant-Self-Confidence-Lifeskills-ebook/dp/B00AR06LSS/ref=sr_1_1_bnp_1_kin?ie=UTF8&qid=1381320733&sr=8-1&keywords=brilliant+self+confidence)


    ![Image](img/00032.jpeg)


    在本章中，你将学到：


    *   一系列记忆数字的系统

    *   学习日常数字的简单方法：电视频道、时间、日期、价格、PIN 码……

    *   将名字与面孔联系起来所涉及的技能

    *   帮助其他人记住你的简单技巧

    *   如何通过将数字与名字联系起来来管理你的生活


    你并不孤单：每个人都觉得数字和名字难以记住。数字是抽象的概念，难以掌握，容易混淆。名字是任意的标签，可能太常见、太罕见、太复杂，或者太简单而留不在你脑海中。两者往往以最糟糕的方式呈现：在繁忙的办公室里大声念出的长电话号码；在餐厅桌边向你连续抛出的五个新名字。两者都特别令人沮丧，因为它们对你的生活有如此重大的影响。


    ![image](img/00033.gif)


    想想看——如果你能应对数字，你就能：


    *   记住会议时间、预约日期、生日、纪念日

    *   对价格做出更好的判断，谈判达成更有利的交易

    *   节省打电话、问路、找地址的时间

    *   回忆 DIY 测量数据、食谱用量、衣服尺码

    *   学习历史日期、地理统计数据、科学事实、文学引用


    如果你知道如何学习名字，你就能：


    *   加强与工作同事的关系

    *   提高社交技巧，建立强大的新联系

    *   在社交场合感到更自信

    *   增加对过去和现在名人的了解

    *   确保别人出于所有正确的原因记住你


    如果你对两者都精通，你就能为生活的每个领域带来新的秩序：将人们与他们的生日联系起来；将名字与地址、年龄、电话号码、订单参考、团队位置联系起来；回忆在什么时间在哪个办公室见谁……


