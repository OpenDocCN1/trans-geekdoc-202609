- raw: 'A problem can only exist in your mind – outside your mind there are only sets
    of circumstances. That you call a circumstance a problem is indicative of your
    way of thinking. One person’s problem is another’s source of motivation. So, it
    really matters how you think about any situation you find yourself in because
    it has consequences.


    The words ‘this’ and ‘that’ are used many times during the course of a day, but,
    when used with tasks and people – for example ‘that task’ or ‘this person’ – they
    indicate whether the speaker is associated with or dissociated from what he or
    she is referring to. Where there is a positive intention towards a task/person,
    there is likely to be a positive mindset around it – it’s a this. When there is
    no positive intention towards it, there is likely to be a negative mindset around
    it – it’s a that.


    Being dissociated from something is a source of procrastination. If you could
    choose not to get involved, then there would be no issue, but, when you have to
    get involved because it’s your job to do so, then you are forced to associate,
    which is when negative feelings can take hold of your thinking. In situations
    of forced association, it is useful to reframe your thinking and turn that into
    this with a positive intention.


    There are four key principles involved:


    1.  You can be either associated (this) or dissociated (that) with tasks and people.
    When you are associated in a positive way, you are emotionally connected and likely
    to achieve better results than when you have put distance between yourself and
    the task or person, thus becoming dissociated. Poor performance results from ‘forced
    association’ with a that – when you perform a that task without a clear positive
    intention, you are forcing yourself to associate with it and so the emotional
    connection is likely to be negative. That is a recipe for poor performance.


    2.  Having a conscious positive intention prepares the way for success – all your
    intentions are positive for you, even though it may not appear that way to other
    people. Your unconscious mind may be telling you not to go ahead with an unpleasant
    task because its positive intention is to keep you feeling good. Having a clear
    positive intention and looking for the good in the task allows you to take control
    of your success. Just as a clear positive intention clears the way for success,
    so not having one causes you to struggle. Your unconscious intention will be to
    feel better and look for ways that mean you don’t have to undertake an unpleasant
    task or meet someone who makes you feel uncomfortable. In doing so, you cause
    yourself stress and discomfort.


    3.  When you exaggerate the absurdity of the way you are thinking about a situation,
    you prepare the ground for change. You can find absurdity in almost anything and
    use it to create change. An example demonstrating this follows in the next section.


    4.  Changing that to this is primarily a matter of focusing on what is good and
    having a positive intention. The concept of yin and yang demonstrates that, to
    achieve balance and flow in life, everything must contain an element of its opposite.
    Hot will contain elements of cold, good will contain elements of bad and vice
    versa. So, every that must contain an element of this. Unfortunately, while you
    are focusing on that you are oblivious to the this, which is undoubtedly present.
    Your results will be more successful if you choose to stay focused on this and
    allow it to develop and grow.


    There can be any number of reasons behind you considering something or someone
    as a that. Examples of that could be:


    *   activities you don’t enjoy and don’t look forward to


    *   work that you don’t feel fully competent to complete to a satisfactory standard


    *   someone or something you have negative beliefs about


    *   activities that conflict with a personal value


    *   someone you find difficult or frustrating to be with.


    #### Using absurdity to create a change in thinking


    You can find absurdity in just about anything. Consider the statement, ‘I have
    to have dinner on the table by 6 p.m. every day.’ It implies that all the family
    members will be hungry and ready to eat at exactly the same time every day. The
    likelihood of that being the case is remote and, therefore, the statement is absurd.


    This technique takes the absurdity in your thinking and exaggerates it. In doing
    so, your situation becomes so ridiculous that you will want to change your view
    and reframe it because it is too painful to continue thinking in the old way.


    ![image](images/00003.jpeg)


    Peter was a project manager who was a real stickler for detail and procedure.
    He had been given responsibility for a major project involving Simon. Simon became
    more and more anxious whenever he thought about the project.


    Peter and Simon had clashed from the outset. Simon didn’t know how to deal with
    Peter when he insisted on introducing details that Simon believed were unnecessary
    at the meetings. This began to affect his ability to contribute rationally. He
    would sneer and make derogatory comments about Peter’s style of management in
    front of the project team. When questioned about the situation, Simon replied,
    ‘He needs to learn a lesson if he’s going to get on – I’ll teach him, don’t you
    worry.’


    Simon was offered the following reframe:


    ‘So, Simon, it seems you want to go on feeling bad about this relationship, don’t
    you? You are going to continue to snipe at Peter and have everyone else laugh
    and snigger at you behind your back. You don’t even mind that they perceive you
    as behaving like a child. The project will suffer and your emotional energy will
    be tied up in creating negative feelings towards Peter, so you will have very
    little left for creativity in relation to the project. You won’t mind that, though,
    because teaching Peter a lesson is so much more important to you than building
    good relationships and getting the project completed successfully. Your antagonistic
    behaviour will serve you well when you find yourself not being invited on to the
    team for future projects. You may even find yourself without a role at all and
    that’s OK because the most important thing here is to make Peter look silly, isn’t
    it?’


    This technique may appear a little harsh, but, with the right person, it could
    be the most effective tool to use. In this case, Simon is the type to allow his
    ego to get in the way, so the technique had to be stronger than his overinflated
    ego. What Simon received was a reframe that moved him from thinking ‘Peter needs
    to be taught a lesson’ to ‘My career is more important than the way I feel about
    Peter’. This caused sufficient pain to Simon’s ego for him to let go of the need
    to teach Peter a lesson and instead make positive adjustments to his own thinking
    and behaviour.


    #### Focus on a positive intention


    The absurdity technique may do the trick for some people (we hope you tried it
    out on your own situation with state X), but sometimes you may need a little more
    positive encouragement. However negatively you view a situation or a person, there
    is always some good to be found.


    ![image](images/00003.jpeg)


    Michelle was having a problem with her flatmate, who seemed to be interfering
    in her life. She took it to mean that her flatmate didn’t trust her to make her
    own decisions about boyfriends. Michelle began to mistrust her own judgement and
    became withdrawn, refusing invitations to nights out.


    When questioned, she said that her flatmate didn’t want her to have a good time
    and was jealous of her boyfriends. This frame of thinking caused a deep rift in
    the friendship.


    Michelle was offered the following reframe:'
