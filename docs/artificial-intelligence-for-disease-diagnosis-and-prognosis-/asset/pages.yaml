  md: '# 4.6 USE OF RIDGE REGRESSION, ELASTIC NET AND LASSO MODELS


    Linear regression algorithms are widely used ML algorithms. The ordinary linear
    least squares regression is the most common algorithm, in which the cost function
    minimizes the sum of squared residuals (Figure 4.3a). Ordinary linear least squares
    regression may be useful for simplified data but pharmacogenomic data are complicated
    and, therefore, this regression should not be used for drug sensitivity predictions.
    The major drawback is overfitting, where the model displays low bias but suffers
    from higher variance. The addition of extra factors in the cost function has been
    shown to be useful to minimize overfitting. For example, in the ridge regression,
    a so-called L2 regularization factor has been added, which is the squared value
    of the slope multiplied by λ (Figure 4.3b). Similarly, in the least absolute shrinkage
    and selection operator (lasso) model L1 regularization (λ * absolute value of
    slope) has been added to the ordinary linear least-squares cost function (Figure
    4.3c). Finally, the elastic net algorithm applies both L1 and L2 regularizations
    (Figure 4.3d). By regulating the value of λ, these models can be regulated [9].


    ![](img/bffdb4a72252285ac92f0fad78a7f104_65_0.png)


    Figure 4.3 Linear models. (a) Ordinary linear least squares regression. (b) Ridge
    regression. (c) Least absolute shrinkage and selection operator (Lasso). (d) Elastic
    net algorithm.'
