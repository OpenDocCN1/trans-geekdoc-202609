  md: '# 2.1 INTRODUCTION


    In the modern world, the number of incurable and deadly diseases is increasing
    rapidly even though there is a significant advancement in the medical field [5].
    For the betterment of human health incurable and deadly diseases need to be identified
    at their early stage. Therefore, there is a need for analyzing medical data and
    images in a minimum amount of time with greater accuracy. Analyzing medical data
    with greater efficiency can also help to predict and detect the disease promptly.
    Implementing and designing new effective algorithms for processing medical data
    is always challenging as decision-making from medical data is difficult due to
    the complex nature of the medical data. Additionally, processing large medical
    data requires a huge amount of time as a huge amount of data needs to be processed
    for decision making. In the healthcare field, starting from information from medical
    data and then for disease diagnosis machine learning (ML) is gaining attention
    and has significant progress.


    ML is being applied in different techniques and algorithms in various healthcare
    activities [3]. For clinical decision-making, machine learning is being mostly
    employed. When ML is applied to medical data, then the learning model can interpret
    the data to suggest the best actions that need to be performed to improve an individual''s
    health. In general, the ML model needs to learn the problem statement and the
    quality of the data is also important for decision making [5]. In general, the
    ML model is not very strong and concrete when it is first used but with repetition,
    it gains experience from the previous iterations. Additionally, the learning model
    can also become robust and automated with the previous training experience. There
    are two ways that clinical decision-making is performed by comparing the previous
    knowledge that is included in the dataset. The first one is based on intuition
    on the underlying pattern of the medical dataset and is mostly used in medical
    emergencies. Another approach is a slow and reasoned approach where a large medical
    dataset is used to train the learning model. The second approach is more accurate
    but it takes a little bit more time as a large dataset needs to be handled to
    train the learning model. With the advancement of the processing power of computing
    devices, a reasoned approach is being used in the healthcare sector to improve
    quality.


    Artificial intelligence (AI) is a branch of computer science where the intelligence
    of the machine is being integrated to perform any task. ML is a subset of AI and
    it is training algorithms for decision making. ML is being used in different areas
    of healthcare where the goal to integrate ML is to interpret the medical data
    in a meaningful way for the prediction and assessment of a disease [6]. ML models
    are being used in different areas such as heart disease prediction, type 2 diabetes
    risk prediction, and so on [6]. ML model is trying to bring a paradigm shift to
    healthcare due to the rapid progress of the analytical technique [6]. Most recently,
    the world is undergoing unprecedented challenges due to the COVID pandemic [4].
    Different researchers are also trying to integrate AI and ML models for predicting
