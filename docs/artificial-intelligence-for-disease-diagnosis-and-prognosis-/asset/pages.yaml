    # 15.5.1.3 Integrity Validation


    Integrity validation allows the receiver to ensure that the received message is
    intact and has not been manipulated during the transmission. A vast range of manipulation
    can occur during the transmission, which changes the message content, whether
    it is caused by malicious activities or transmission errors. Changing content
    may include adding, removing, or transposing fragments. Deploying an integrity
    validation module can be feasibly achieved after generating cryptographic keys
    [15]. However, this task is still challenging for WBAN because of its resource
    scarcity [53].


    As discussed earlier, IEEE 802.15.6 has three levels of security where integrity
    validation is provided in the second and third levels [34]. Figure 15.6 shows
    the WBAN MAC frame body. The length is variable and can expand to a maximum of
    255 octets. WBAN entities can exchange secured and unsecured frames. Sensor nodes
    are to choose a security level that fulfills their security requirements during
    the association process. Two additional fields are used in the secured frames,
    MIC and “Low-Order Security Sequence Number.” The latter is used to verify message
    freshness to detect replay attacks, while the MIC field is used to validate message
    integrity by setting it as the MAC [34].


    # 15.5.1.4 Encryption


    WBAN data plays a critical role in disease diagnosis and treatment. Confidentiality
    is essential to protect this sensitive information either during transmission
    or storage. Abundant encryption algorithms have been introduced in the literature,
    such as 3-DES [59] and RSA [65]. However, not all of them can fit the rigid resource
    constraints of WBAN. For example, encryption algorithms with long keys, countless
    number of rounds, and huge block sizes are inapplicable to WBAN. Therefore, in
    2015, the National Institute of Standards and Technology (NIST) started the process
    to standardize a lightweight encryption algorithm for constrained devices such
    as WBAN'
