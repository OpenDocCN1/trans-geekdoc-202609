    # 7.6.2 HER2 and CEP17 Detection


    The HER2 and CEP17 signals are detected in four steps: Background separation,
    noise reduction, splitting jointed signals, and scoring the signals. For CISH
    quantification, the color unmixed dye channels are used for signal detection.
    In the first stage, the black HER2 dye and magenta CEP17 dye channels are obtained
    using the color unmixing method which serves as the background for segmenting
    the HER2 and CEP17 signals, accordingly. In the second stage, noise is removed.
    Two types of noises were encountered for detecting the signals: Color noise and
    white noise. For example, in the CEP17 dye image, the magenta CEP17-dye is overlapped
    by blue nuclei dye or black HER2 dye. These are the color noise for CEP17 detection
    and are excluded from quantification as they are weak signals. In the HER2 dye
    image, the color noise is produced by overlapping the black dye with magenta or
    blue dye. White noise includes the pixels having high value in all channels of
    RGB images. When the noise is removed, the partly jointed signals are separated
    utilizing distance transformation and watershed algorithm. After that, each candidate
    signal is scored based on the likelihood of its corresponding dye amount. A signal
    with a high'
