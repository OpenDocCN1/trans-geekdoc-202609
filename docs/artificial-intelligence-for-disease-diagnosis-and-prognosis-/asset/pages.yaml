    # 4.5 DRUG SENSITIVITY PREDICTION STUDIES


    Drug sensitivity prediction problems can be categorized as classification problems
    or regression problems. In a classification model, an algorithm learns whether
    a particular drug would display considerable sensitivity or resistance to a cancerous
    object, for example, a cancer cell line or patient-derived xenograft (PDX). In
    such a scenario, cell viability or death is measured in the presence of a drug
    covering a wide range of concentrations to fit a drug response curve that determines
    drug sensitivity. A fitted curve can later be used to determine quantitative parameters
    such as half-inhibitory concentrations (IC₅₀—half-maximal inhibitory concentration,
    EC₅₀—half-maximal effective concentration, or GR₅₀—half-maximal growth rate inhibition),
    the area under the curve, the area above the curve, or other drug sensitivity
    scores. Such scores can be used to develop a regression model where the prediction
    model is trained against drug sensitivity scores. Datasets summarized in Table
    4.1 provide drug sensitivity scores that can be used to develop both classification
    models and regression models.'
