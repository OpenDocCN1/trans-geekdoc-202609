    # 12.7 CONCLUSION


    The current strategy for managing diabetes is the reactive approach which only
    intervenes after the disease occurs. A proactive approach can bring substantial
    health benefits to the patients by starting early interventions long before the
    disease progresses. The OGTT and HbA1c tests are performed widely to diagnose
    and manage diabetes. The ML model can detect individuals at an increased risk
    of developing the disease in the future and thus facilitate the prevention or
    delay of its progression. Developing a framework for early-onset detection of
    T2D has a huge benefit for starting early intervention and slowing down its progression.
    To this end, we have developed a novel approach for the early prediction of T2D
    progression. The developed ML pipeline has the capability to detect people who
    are going to develop T2D in the future.


    The HbA1c test measures the average amount of glucose for the previous 3–4 months.
    A test value of HbA1c ≥6.5% is used as a threshold to diagnose diabetes, and healthcare
    professionals often recommend maintaining HbA1c levels ≤7.5% to remain in the
    good controlled group. The HbA1c test levels are extensively utilized to identify
    patients with uncontrolled or poorly controlled diabetes. Uncontrolled or poorly
    controlled diabetes causes health difficulties in the future. These complications
    can be avoided with the proactive intervention and treatment plan by accurately
    predicting HbA1c levels in advance. Therefore, advanced prediction of HbA1c facilitates
    the management of diabetic patients. In the literature, several attempts were
    made to only estimate instantaneous HbA1c using BG measurement data. We devised
    a novel approach for the advanced prediction of HbA1c levels. The framework achieved
    an accuracy of 88.65%. This research work also compared and discussed the existing
    works related to the current HbA1c estimations. This advanced HbA1c prediction
    is the pioneer in facilitating futuristic knowledge about the patient’s glycemic
    profile so that necessary intervention can be taken. Thus health complexities
    that arise from diabetes can be reduced.


    Several areas came across in this chapter that were beyond this research and could
    be interesting to explore in the future. First, one limitation of this research
    work was the lack of evaluation of the model on other similar OGTT datasets. Second,
    as the risk of cardiovascular disease progression is significant among T2D patients,
    an extension of this research could be to predict T2D leading to cardiovascular
    disease using deep learning approach. Third, predicting a smaller range of HbA1c
    is crucial to avoid misclassification of patients. In our MSMC model, the range
    was 1.5%. The further split of the patients into smaller ranges such as 0.5%,
    0.25%, and 0.1% have the potential to make the model generalized. The prediction
    of a narrower HbA1c'
