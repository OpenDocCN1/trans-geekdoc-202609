  md: '+   • **Log Loss**: AUC ROC works with the probability of classification. But
    sometimes the model can perform even better which is not taken into account. To
    solve this issue, log loss calculates the log of correctly predicted probabilities
    for each instance. This value gradually decreases with time as the model is trained
    more and more.


    +   • **Gini Coefficient**: Gini coefficient is used for classification models.
    Gini is the ratio between the area between the ROC curve and the diagonal line
    and the area of the above triangle.


    +   • **Concordant-Discordant Ratio**: The concordant-discordant ratio is used
    to define the relationship between pairs of classes. This is one of the most important
    metrics for classification problems.


    +   • **Root Mean Squared Error (RMSE)**: RMSE is the most important metric to
    evaluate any regression model. The idea is to find the error for each instance,
    square them, and find the mean root of that. The equation for RMSE is:


    ```

    RMSE = \sqrt{\frac{\sum_{i=1}^{N} (Predicted_i - Actual_i)^2}{N}}

    ```


    +   • **Root Mean Squared Logarithmic Error**: This is also one of the most important
    metrics to evaluate any regression model. It is very similar to RMSE. But the
    major difference is that we take the logarithmic value after calculating the error.
    The equation for RMSLE is:


    ```

    RMSLE = \sqrt{\frac{\sum_{i=1}^{N} (log(Predicted_i + 1) - log(Actual_i + 1))^2}{N}}

    ```


    +   It is used when we do not want to penalize the model with huge differences
    that we can find from RMSE.


    # 2.5 APPLICATIONS IN REAL-LIFE SCENARIOS


