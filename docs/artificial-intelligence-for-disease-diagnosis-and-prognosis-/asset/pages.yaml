  md: '# ## 11.5.2 Machine Learning-Based Methods


    One of the earliest methods for detecting tissue folds was proposed by Palokangas
    et al. [26]. This method also utilized the saturation-intensity difference image
    but relied on the k-means clustering method other than the threshold-based techniques
    to identify the folded regions. The k-means clustering is an unsupervised method
    meaning there is no need of labeled data. One of the major challenges of applying
    machine learning techniques on medical image-based data for object detection or
    segmentation is annotating a significant number of images to prepare label data
    for training as it requires a significant amount of time and effort. However,
    an unsupervised method such as K-means can categorize the unlabeled input data
    such as the pixels into a specified number of clusters and is useful for detecting
    objects from unannotated images. Pixels with similar properties are kept in the
    same cluster and each cluster is considered as a candidate for a possible class.
    Nevertheless, the performance of K-means clustering depends on the selection of
    the number of clusters which is the value of K and the initialization of centroids.
    A pathological specimen may contain different types of components in a slide such
    as nuclei, cytoplasm, background, blurred regions, tissue folds, or other irregularities.
    An optimal number of clusters should be selected to separate the tissue-fold regions
    from other components of the slide. Palokangas et al. determined the cluster number
    based on the variance of the cluster containing folds. The second issue when applying
    the K-means is its random initialization of initial centroids. A poor selection
    of initial centroids may lead to inefficient clustering. The computation time
    could increase significantly as well. Another major limitation of the k-means
    method is that it cannot handle well data with varying sizes and densities, unlike
    the Gaussian mixture model. Palokangas et al. utilized a post-processing step
    to compensate for the misclassifications in their method. This method detects
    only the prominent tissue folds and results in high false positives in the absence
    of folds in the slide. Moreover, this method relied on a 20× magnification image
    and was demonstrated for only H&E slides. Although the unsupervised methods provide
    the advantage of using an unlabeled image, it could be confused by other irregularities
    of the specimen. Therefore, a supervised method such as template matching, SVM
    or CNN is more suitable for detecting artifacts from histopathology slides.


    Hashimoto et al. proposed a quality evaluation method that derives the quality
    of the image block using a linear regression model based on the amount of blurriness
    and noise. This method was compared with the pathologist’s rank scores and mean
    square errors for the selected image blocks. In both cases, the proposed method
    had high concordance. This method was designed for evaluating only selected regions
    of interest, training and test images were captured from the same slide, was demonstrated
    on a single H&E slide, and resulted in false positives for the tissue artifact-affected
    image blocks. Therefore, the practical usability and the generalizability of the
    method require more investigation [27]. Lopez et al. proposed a blur detection
    method in which they identified a set of features which include Haralick features
    and a Tenengrad operator [28]. After that, a decision tree classifier was utilized
    to detect an image block with a focus blur problem. This method included H&E and
    IHC slides scanned by a'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'single scanner. This method achieves good accuracy if applied only to H&E or
    IHC slides, but the generalized accuracy is lower.

    Hossain et al. proposed another quality evaluation method that incorporated tissue
    artifact detection with the quality evaluation based on blurriness and noise [29,30].
    They proposed a supervised artifact detection method in which they have utilized
    SVM with optimally selected features. The features were selected from a features
    bank which included saturation-based colorimetric features, texture features,
    shape features and other physical property-based features. The rotation-invariant
    classification performance was also investigated for the feature selection. They
    have shown in their experiment that traditional machine learning techniques such
    as SVM with optimally selected handcrafted features can achieve better classification
    performance than deep learning models such as CNN when the dataset is significantly
    small. In their work, they have considered scanning artifacts and tissue artifacts
    both types of artifacts for evaluating the quality of a WSI for automated analysis.
    Tissue folds and air bubbles were detected as tissue artifacts using two binary
    SVM classifiers. While the focus blur and noise artifacts were detected to identify
    the scanning failure. Focus blur was identified based on the width of the edges.
    The noise was identified based on the assumption that it is a random value that
    is different from its neighbors. One important aspect of this work is the investigation
    of issues for practical implementation of an automated image analysis system in
    hospitals and the incorporation of pathologists'' feedback to design a user-friendly
    system. They have analyzed the time requirement of the artifact detection and
    quality evaluation system. The system was demonstrated for 52 different slides
    by two different scanners which includes multiple organs, and different stains
    to ensure its robustness and practical use. They have experimented with different
    resolution images for tissue artifact and scanning failure detection and finally
    selected the resolution for which the accuracy is optimal, and time is minimal.
    Their proposed system relies on a thumbnail image for tissue artifact detection
    and a 20× image for scanning failure detection. However, it is necessary to consider
    other tissue artifacts while designing a fully automated system. The focus blur
    was detected based on the width of the edges which requires a lot of time. Recently,
    CNN-based models were found to be effective for detecting focus blur in a comparatively
    short time even using lower magnification such as 10×. Moreover, some CNN-based
    models are found productive when the dataset is limited. Transfer learning can
    also be utilized by using the bottleneck features and training only the final
    layers.


    # 11.5.3 Deep Learning-Based Methods


    Two major tasks while designing a machine learning solution are identifying the
    discriminative features and training the machine with those features. Traditional
    machine learning techniques rely on human intuition or a separate algorithm for
    feature selection while deep learning methods such as CNN can extract and identify
    features on their own. This autonomous approach of incorporating the feature selection
    process with parameter tuning while training the model enables deep learning methods
    to solve many complex problems. CNN-based models were found to be very'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'effective for processing visual information to convert them into meaningful
    features to produce the desired outcome. In recent times, many CNN-based models
    have been demonstrated for several medical image analysis tasks such as biomarker
    detection, anomaly detection, cancer classification, nuclei segmentation, grade
    assessment and others.


    Senaras et al. proposed a CNN-based method to detect focus blur problems of WSIs
    and demonstrated it on a diverse dataset [1]. The image dataset used for training
    the model included 8 different labels of focus blurs, generated by varying the
    focus plane and extracting from 16 differently stained slides at 40× magnification.
    This method outperforms Lopez’s method in terms of accuracy and speed. However,
    in the comparative study, they used a 20× image downsampled from a 40× image while
    Lopez’s result was generated for a 20× image. The image quality of the WSI scanner
    can be explained using the sensor resolution such as the sampling rate and optical
    resolution such as numerical aperture. WSI scanned at 40× have higher numerical
    aperture and lower pixel size such as 0.23 micron/pixel than 20×. When a 40× image
    is downsampled to a 20× image, the sample rate or the pixel size of the image
    is converted to a 20× equivalent one such as 0.46 micron/pixel. However, the numerical
    aperture means the optical resolution remains unchanged. As a result, 20× down-sampled
    images usually provide finer details than actual 20× images. This method takes
    more than 10 minutes to evaluate a WSI while the modern WSI scanners can scan
    a slide within a minute. Time is an important consideration for the practical
    implementation, and it will be efficient if the quality of the WSI is evaluated
    in less than a minute without adding any extra time to the scanning process. Another
    CNN-based focus blur-detection method is proposed by Kohlberger et al. where they
    incorporated the clinical relevancy of the focus problem and categorized the focus
    blurs accordingly [31]. This method digitally generated the focus blur-affected
    images to increase the diversity of the training data. This synthetic data generation
    saves time and money for training a machine learning model whose performance highly
    depends on using a significantly large and diverse dataset. However, the impact
    of such data generation on the performance of the trained model requires more
    investigation. This method was demonstrated on two different scanners (spearman
    rank coefficients were 0.81 and 0.94 for two scanners) and the result differs
    significantly for them. Therefore, it is necessary to consider more scanners to
    ensure the reproducibility of the method.


    Foucart et al. proposed a residual CNN-based method to identify tissue-fold artifacts
    that can utilize an imprecisely and inaccurately annotated dataset [32]. In medical
    image analysis, annotating data for training machine learning models is a time-consuming
    and arduous task. Moreover, it requires proper training or experience. Weekly
    supervised methods are very useful for this type of application where data annotation
    is difficult. They investigated the performance of the residual network for both
    detection and segmentation on the low-resolution image such as 1.25× image by
    varying the residual units. The model tends to provide higher accuracy for segmentation
    than the detection which may be caused by the erroneous annotation. The segmentation
    network took less than two minutes to locate the tissue ffold artifacts from a
    WSI when implemented using a GPU-enabled computer.'
