    On the other hand, recent research shows that despite all the incorporated security
    measures in the IEEE 802.15.6 standard, it still has some vulnerabilities. For
    example, analyzing the key agreement protocols to establish the pre-shared MK
    shows that four protocols are vulnerable to key compromise impersonation (KCI)
    and do not fulfill the forward secrecy requirement. Furthermore, one protocol
    is prone to offline dictionary attack [81, 82].


    # 15.4 WBAN THREATS


    WBAN is vulnerable to different kinds of attacks and malicious activities. There
    are different classifications for attacks. Based on the attack origin, they can
    be classified into internal and external as follows [1]:


    +   - **Internal attacks**: These attacks are launched by internal intruders.
    For instance, when a node got compromised. Internal attacks are more complicated
    and challenging to defeat as compromised nodes have already passed the traditional
    security countermeasure and could have a copy of the keys. Therefore, more advanced
    security measures are required to protect the network [23].

    +   - **External attacks**: These attacks are sourced from outside the network
    by external adversaries.


    Attacks on WBAN can also be classified into passive and active as follows [1]:


    +   - **Passive attacks**: Information gathering is the main goal of passive attacks.
    Although it is less harmful than active attacks, it violates the patient’s privacy.
    Attackers can take advantage of the gathered data to launch more advanced attacks.

    +   - **Active attacks**: A vast range of attacks are regarded as active attacks,
    such as DoS attacks, packet alteration attacks, and route poisoning attacks. Attackers
    can target the network operation to deplete the resources and degrade the overall
    performance.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '![](img/bffdb4a72252285ac92f0fad78a7f104_277_0.png)


    Figure 15.4 WBAN threat taxonomy.


    Moreover, WBAN is also vulnerable to different kinds of malicious activities launched
    by WBAN nodes. Different reasons are behind these malicious activities. Nodes
    could launch internal attacks when they got compromised. Moreover, even benign
    nodes could act selfishly in order to save resources. For example, when a relay
    node stops relaying packets to save power, it could disrupt the network operation.
    Therefore, misbehaving activities launched even by legitimate nodes are very deleterious
    and dangerous because cryptographic security measures are not able to defeat them.
    However, some advanced countermeasures, such as AI-based TMS [22, 23], which will
    be discussed later in this chapter, can detect malicious activities like dropping
    attacks.


    In what follows, a wide range of attacks is discussed and grouped based on CIA
    (confidentiality, integrity, and availability) security requirements they violate.
    It is worth mentioning that this list of attacks is not exhaustive.


    # 15.4.1 Attacks on Confidentiality


    There are many attacks that can compromise confidentiality as listed below:


    +   * **Eavesdropping Attack**: It is a passive attack where the adversary can
