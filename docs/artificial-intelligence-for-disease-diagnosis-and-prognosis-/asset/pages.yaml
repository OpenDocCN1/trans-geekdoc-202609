    # 16.6 CONCLUSION


    Physiological data is the personal property of a person hence confidential. So,
    security and privacy are significant concerns in the study of the healthcare domain.
    This current chapter illustrates a scenario of security and privacy in physiological
    data based on AI. A brief explanation of the step-by-step physiological data flow
    from the signal source to the user''s end is presented. The role of AI handling
    the security and privacy issues in each step is also briefly described, as well
    as the gap between the current ML approaches. In addition, the motivation of the
    mitigation method in this domain is also depicted.


