    # 7.5 QUALITY EVALUATION OF WSI


    # 7.5.1 Image Quality Issues for Automated Analysis


    The quality of automated analysis highly depends on the quality of the image used.
    With the advent of many robust and fast WSI scanners, the WSI is getting more
    popular among pathologists and practitioners for routine clinical works. The achievable
    limit of quality has improved significantly over the years for WSI. However, the'
