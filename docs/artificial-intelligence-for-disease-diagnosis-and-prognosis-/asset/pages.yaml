    like in the ARX structure requires increasing the number of rounds. Therefore,
    choosing an algorithm that needs a fewer number of rounds is desirable for constrained
    devices. One group of authors [83] introduced LWE, a 3-round block cipher encryption
    algorithm. it uses 64 bits for key and block size with a view to fit the resource
    constraints of the medical sensors. Furthermore, it has been contrasted with well-known
    lightweight algorithms such as Rectangle [96] and TWINE [77]. The performance
    results show that LWE performed better in encryption/decryption rates without
    creating a heavy load on the infrastructure.


    # 15.5.2 Intrusion Detection Systems


    IDS is a vital cyber-security tool to monitor the network and detect any malicious
    activities. It is able to resist inside attacks launched by nodes that have passed
    the traditional cryptographic security measures. It is regarded as an additional
    layer of protection to detect and defeat internal and external abuses. Different
    methods are proposed in the literature to achieve an effective IDS scheme which
    could be classified based on the detection method.


    # 15.5.2.1 Signature-Based IDS


    It is also called rule-based IDS. In this kind of IDS, a profile (signature) is
    created for each previously known attack. This signature is then used to detect
    any malicious activity that matches the pre-defined attack pattern. The main disadvantage
    of this kind of detection method is the inability to detect unknown attacks. This
    requires updating the signature database periodically in order to detect new attacks.
    Authors [5] have proposed a lightweight IDS inspired by the human immune system'
