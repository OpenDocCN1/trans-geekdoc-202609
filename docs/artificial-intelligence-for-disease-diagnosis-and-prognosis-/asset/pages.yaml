    Figure 5.22 A typical CNN model for skin disease classification and recognition
    [27].


    # Convolutional Layers.


    The fundamental building layer of the CNNs is the CONV layer including a set of
    K learnable filters as “kernels” (nearly always as square matrices). These small
    filters extend throughout the full depth of the volume. As illustrated in Figure
    5.23, the input of a CONV layer passes three main steps.'
