    # 3.4 FUTURE IMPLEMENTATION ROADMAP OF PRECISION MEDICINE


    Precision medicine is broadly welcomed around the world. However, the area is
    still in its infancy, and many aspects are untouched, with many challenges lying
    ahead. Tech companies such as IBM, Google, Apple, and Amazon invest heavily in
    healthcare analytics to facilitate precision medicine. However, despite the assistance
    and advancements fueled by AI for omic data processing and analysis, various challenges
    still exist.


    +   - Scarcity of data validation: Obtaining statistically significant and valid
    patient data.

    +   - Transparency and reproducibility: Business companies, commercial platforms,
    and research publications offer limited information for the public to reuse the
    data and models.

    +   - Training and education: There is a lack of a comprehensive mechanism for
    patients and physicians to get updated, educated, and trained on emerging tools
    and technologies used in precision medicine.


    It is still a big challenge to construct an infrastructure that supports the prevalent
    sharing and effective use of health and genomic data to advance a healthcare system
    that is the least reliant on external sponsored resources. A framework proposed
    in our previous work to address the issue of data integration and staged analysis
    involves four significant modules: Primary analysis, secondary analysis, knowledge
    management for knowledge services, and data analytics for data services [1]. As
    shown in Figure 3.1, diverse data is acquired from different input sources, including
    clinical, molecular, and -omic, sensory, environmental, and published literature.
    The collected data is pre-processed to remove the undesirable data items. The
    secondary analysis module uses the pre-processed data to analyze further, where
    some parts of the data are integrated for a combined analysis. At this stage,
    correlations among various data items among the genes are found. The analyzed
    data is saved to reuse for various services. The knowledge management (KM) and
    data analytic (DA) modules employ the analyzed data generated at the secondary
    analysis. The DM module constructs KBs by creating, maintaining, and validating
    knowledge rules from the analyzed data, whereas the DA module targets designing
    descriptive, predictive, and prescriptive services models.'
