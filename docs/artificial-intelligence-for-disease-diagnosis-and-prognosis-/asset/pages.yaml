- pgno: 86
  md: 'RECENTLY, SKIN DISEASES have extensively affected people''s lives worldwide.
    Being one of the most serious and common diseases among people, timely and accurate
    diagnosis of skin diseases particularly the most threatening, such as skin cancer,
    is vital to receiving the effective treatment. In the last decade, automated computerized
    skin disease systems based on machine learning and deep learning have gained extreme
    attention among researchers due to their outstanding performance. This chapter
    is allocated to the overall process and trends toward skin disease recognition
    and classification based on machine learning and deep learning. The main purpose
    of this chapter is to provide knowledge useful for both beginners and more advanced
    level researchers in this field. To this end, after presenting a brief introduction
    to skin diseases, main steps of automated skin disease recognition systems such
