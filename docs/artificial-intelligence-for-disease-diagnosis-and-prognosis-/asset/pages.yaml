    Another major challenge of HER2 quantification is tumor heterogeneity. HER2 tumor
    heterogeneity indicates a situation where cancer has different tumor cells expressing
    different levels of HER2 amplification in the same patient [16]. It includes obvious
    HER2-positive tumor cells with HER2 negative or equivocal cells for the same case.
