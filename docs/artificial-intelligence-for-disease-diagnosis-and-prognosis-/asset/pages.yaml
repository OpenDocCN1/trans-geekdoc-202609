- pgno: 164
  md: '# 8.2.6 Enrichr Web


    Based on 1575 positively co-expressed genes of CALD1 in GBM identified from ULCAN,
    Enrichr (amp.pharm.mssm.edu/Enrichr) was used to determine Gene Ontology (GO)
    and pathway enrichment [15]. The bar graphs retrieved from Enrichr web were ranked
    by p-value from several databases, including the Kyoto Encyclopedia of Genes and
    Genomes (KEGG)-2021, Wiki pathway-2021, and GO (biological process and molecular
    function)-2021.


    # 8.3 MULTIOMICS ANALYSIS AND RESULTS


    In this section, we present the results of our data-driven review.


    # 8.3.1 Gene and Protein Expression Analysis


    To investigate the expression level of CALD1 in brain cancer and their normal
    counterparts, we first determined the mRNA expression pattern of CALD1 using TCGA
    data through UALCAN web. A significant high mRNA expression levels of CALD1 in
    GBM were found (Figure 8.1a). Since the number of normal samples is relatively
    lower, we compared the expression pattern using GTEx data via GEPIA2 web. The
    result (Figure 8.1b) also shows the overexpression of CALD1 in patients with GBM
    compared to the normal brain tissues. Also, CALD1 is significantly overexpressed
    in GBM tissues compared to their normal counterparts in terms of protein expression
    (Figure 8.1c), which was analyzed using CPTAC data through UALCAN web. To crosscheck
    CALD1 protein expression in normal brain and brain cancer tissues, we showed the
    immunohistochemistry results (Figure 8.1d) derived from Human Protein Atlas web.
    These results also confirm the overexpression of CALD1 at the protein levels in
    brain cancer samples relative to normal brain tissue at both the early and advanced
    stage of GBM.


    # 8.3.2 Mutation and Genetic Alteration Analysis


    We analyzed the alteration frequency of CALD1 copy number in brain cancer using
    the cBioPortal web. The results show that the mutation and amplification are responsible
    for the copy number alterations (CNA) (Figure 8.2a). The cBioPortal was queried
    with CALD1 gene over 7 studies covering 2178 GBM patients/2198 samples. It resulted
    in 10 mutations, including 3 duplicate mutations in patients with multiple samples.
    Most of the mutations are of missense type. We also noticed that mRNA expression
    levels and CNA are correlated in general, and diploid and gain are primary sources
    of CNA that contribute to the correlation in particular (Figure 8.2b).


    # 8.3.3 Survival Analysis


    We next investigated whether CALD1 mRNA expression has any potential role on GBM
    prognosis. To find the prognostic relevance of CALD1 in brain cancer, we performed
    survival analysis using TCGA data via TIMER web. Here, we used a Kaplan–Meier
    curve for the survival analysis, which is used to measure the fraction of'
