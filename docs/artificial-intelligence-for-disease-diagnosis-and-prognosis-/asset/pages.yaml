    # 4.4 PHARMACOGENOMIC DATASETS AND DATA PROCESSING


    To build a prediction model, high-quality pharmacogenomic data are necessary.
    Several studies mentioned in Table 4.1 have generated or curated high-quality
    pharmacogenomic data, initially from cell lines and later from patient-derived
    xenografts and primary patient materials. These datasets primarily offer drug
    sensitivity data as well as baseline transcriptomic and genomic data.


    Data pre-processing is one of the initial but important steps in any computational
    analysis. It includes several steps such as data selection, imputation of missing
    values, noise filtering, feature selection, and normalization. The selection of
    appropriate datasets remains challenging due to possible inconsistencies between
    different datasets [28]. Two elegant studies compared the largest publicly available
    pharmacogenomic datasets and suggested that individual datasets independently
    demonstrate considerable predictive power [15, 29]. Furthermore, pharmacogenomic
    datasets come with different types of biological data including genetic mutations,
    gene expression, copy number variations, protein expression, epigenetic modifications,
    and metabolomic data. Gene expression data can have more than 20,000 features,
    and then combining all features from a biological sample will result in several
    thousand variables. However, the largest pharmacogenomic dataset may contain around
    1000 samples. Therefore, systematic selection of important features is crucial
    to developing an ideal predictive model [30, 31]. Several techniques for feature
    selection have been'
