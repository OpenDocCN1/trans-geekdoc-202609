    DIABETES MELLITUS (DM) is a metabolic disorder which affects millions of people
    around the world. DM occurs when the glucose levels get elevated in blood stream.
    If the DM remains undetected and uncontrolled for prolonged period, many severe
    complications can arise in various body organs leading to life threatening situations.Therefore,
    prevention or delayed onset of diabetes can provide life changing experience for
    many people. However, it can only be achieved if a rigorous screening process
    can be developed which can identify individuals who are at risk of developing
    diabetes in near future. Machine learning techniques can be used to extract various
    diabetes-related features and then exploiting them to predict the long-term possibility
    of diabetes development. In this chapter, machine and deep learning techniques
    for advanced prediction of hemoglobin A1c (HbA1c), a fundamental index used for
    diabetes management will be explained in detail along with its rigorous performance
    evaluations.'
