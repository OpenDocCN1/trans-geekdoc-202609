    # 11.2.1 Morphological Image Analysis


    The application of digital image analysis, pattern recognition and machine learning
    techniques enable detailed analysis of tissue architecture and morphology which
    lead to better diagnosis. Features such as nuclei shape, size, and distortion
    are effective in determining the degree of malignancy for a cancer patient. Hematoxylin
    and Eosin (H&E) staining is considered the standard staining method in histopathology.
    Hematoxylin dye stains the acidic components of the tissue such as nuclei in blue
    color and the eosin stains all other components of the tissue in pink which includes
    the cytoplasm, cell walls and extracellular fibers. This interpretation is often
    sufficient for many diagnoses which are based on the structure of the cells. The
    H&E WSI is used routinely in digital pathology for the morphological assessment
    using automated algorithms to understand cell and tissue structure [5–10]. In
    the breast cancer analysis, malignant and invasive cancer regions are identified
    on the H&E WSI. Figure 11.4 shows an H&E WSI of breast tissue. Although H&E is
    useful for detecting the changes in the cells, one major limitation of the H&E
    slide is the lack of molecular data associated with a cell.


    # 11.2.2 Molecular Image Analysis


    In order to visualize more detailed information of the molecules present in the
    specimen, special stains are used such as immunohistochemistry (IHC), chromogenic
    in situ hybridization, fluorescence in situ hybridization and others. IHC expresses
    antibody-antigen interactions and is commonly used for subtype cancer classification.
    In IHC-DAB (diaminobenzidine)-stained images, positively stained regions are brown
    and negative are blue. The number of positive and negative nuclei is counted to
    estimate the percentage of positive nuclei to analyze the cancer tissue. IHC is
    also used for assessing the grade of breast cancer where the staining strength
    in the cell membrane is scored to identify HER2-positive cancer. The presence
    of estrogen receptor (ER), progesterone receptor (PR), HER2, and proliferation
    marker protein Ki67 in IHC is used for the diagnosis of breast cancer. There are
    several automated and semiautomated image analysis methods available for IHC-based
    image analysis [11–13].'
