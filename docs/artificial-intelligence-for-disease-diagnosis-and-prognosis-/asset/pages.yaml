- pgno: 184
  md: '# 10.1 INTRODUCTION


    Breast cancer (BC) is the most frequent cancer that affects women all over the
    world. In 2020, over 279,000 instances were reported in the United States, with
    a 15% fatality rate compared to other cancers. It is an uncontrollable cell division
    that can spread to other parts of the body. It usually begins in the epididymis
    that leads to the nipple. Dimpling on the breast skin and a lump in one of the
    armpits is followed by a change in the size of one or both breasts. There are
    two types of breast tumors: Benign and malignant. Benign tumors are non-cancerous
    since they do not spread into the breast tissue around the duct and do not pose
    a threat to one’s life. The traditional technique for cancer diagnosis relies
    heavily on medical specialists’ experience and visual examinations. Consequently,
    this form of assessment takes a while and is prone to human error. As a result,
    there is a need to build an automatic diagnosis method for cancer early detection.
    Several studies have used machine learning approaches to create pattern recognition
    and classification models for clinical diagnosis. Machine Learning (ML) is a subset
    of Artificial Intelligence (AI) that permits a system to learn by feeding it a
    set of facts and learning through experience rather than significant programming.
    Most researchers used three types of data to aid in the early detection of breast
    cancer: Image data, text data, and biomarker data. Firstly, for text data, Shiny
    et al. [1] proposed a Support Vector Machine (SVM) discriminate ratio. They compared
    three of the most popular machine learning (ML) algorithms. The methods used in
    the original Wisconsin BC dataset were Random Forest (RF), SVM, and Naive Bayes
    (NB). The results show that SVM has the best performance and accuracy, with 97.2%
    accuracy. In addition to KNN, NB, and DT, Jiande et al. [2]used the SVM algorithm.
    Using an ML approach, they used gene expression data to classify (triple-non-triple)
    negative BC patients. The implementation of various algorithms revealed that SVM
    had the best performance, with an accuracy of 90%. Mücahid et al. [3] proposed
    a model for the detection of BC based on age, biomarkers, glucose, and body mass
    index using Artificial Neural Networks (ANNs) and (NB). Feature selection (FS)
    techniques are also used to improve the model’s performance. The goal of FS was
    to reduce data dimensionality and achieve high BC classification accuracy. The
    proposed system was a two-stage mechanism. First, the 22 features from the WDBC
    dataset were chosen using FS techniques. The ANN classifier with 15 neurons (15-neuron
    ANN) achieved 96.4% accuracy for BC classification, with 99.9% sensitivity, 98.4%
    precision, 1.6% false-positive rate, and 0.42-second processing time. In the initial
    trial conducted without FS, the suggested 15-neuron ANN classifier attained a
    classification accuracy of 98.8%. The accuracy of categorization improved by 0.6%
    on average after using FS. Secondly, image datasets, two types of images can be
    used to detect breast cancer: (i) Mammogram images and (ii) histology images.
    Mammography screening has long been considered as the most successful method of
    detecting abnormalities in the breast tissue, with the most common results being
    breast masses and calcifications, both of which can indicate the presence of cancer
    [4]. We may use deep learning algorithms on both sorts of photos, but the latter,
    i.e. histology images, has a greater accuracy because the images contain considerably
    more cell information and are high resolution [5]. As a result, in this scenario,
    we''ll'
  merge: -1
