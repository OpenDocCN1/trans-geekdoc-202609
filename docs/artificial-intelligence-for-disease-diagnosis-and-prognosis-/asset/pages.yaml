  md: 'also varies for different WSI scanners. Therefore, it is necessary to demonstrate
    a color enhancement-based detection method for multiple scanners and multiple
    slides prepared by different laboratories. This method was demonstrated for multiple
    scanners, but only H&E slides were used. This method utilized a low-resolution
    thumbnail image which is efficient for practical, but only tissue-fold artifacts
    were detected. Another method for detecting the tissue fold based on the saturation
    is proposed by Kothari et al. where two adaptive thresholds are applied to differentiate
    the folded regions from the normal tissue [22]. They have shown that a saturation
    and intensity difference is a major indicator to identify tissue fold by investigating
    connectivity of pixels in a slide based on their saturation-intensity difference
    for H&E specimens. They created a connectivity map of pixels where two pixels
    were considered connected if they had the same saturation-intensity difference
    and were in the 8 × 8 neighborhood. The connected pixels'' count was highest for
    the nuclei regions that have an intermediate saturation-intensity difference while
    for the folded regions the difference was higher and the connected pixels'' count
    was lower. Two threshold values were derived from the map to locate the tissue-fold
    pixels from nuclei and other parts of the specimen. This saturation-intensity-based
    feature was selected from a list of 461 features derived from 105 H&E-stained
    WSIs using a statistical method that ensures the efficacy of saturation-based
    features for tissue-fold detection. This method achieved better detection accuracy
    compared to the Pinky et al. method when applied on different slides. This method
    was demonstrated on a cancer specimen, and it was found that the cancer prediction
    models performed better after eliminating the tissue folds. However, a single
    colorimetric feature-based method may not be robust for a reproducible image analysis
    system. Moreover, it is necessary to demonstrate the method for other stains.


    Both image enhancement-based methods demonstrated the effectiveness of the saturation-based
    features for tissue-fold detection. Both utilized a low-resolution thumbnail image
    which ensured fast detection, important for practical implementation. However,
    these methods only considered tissue artifacts and detected only tissue folds
    in their work, and it is necessary to detect other popular artifacts such as air
    bubbles, ink marks, and dust for automated analysis.


    In another study, Zerbe et al. proposed a method that utilizes the Tenenbaum gradient
    to estimate the sharpness of image patches to assess the presence of focus blur
    and classified them as excellent, okay, review, or defective. However, this method
    did not consider the tissue artifacts [23]. Shrestha et al. proposed a reference-based
    image quality evaluation method that compares the focus quality, brightness, and
    contrast of an image with the reference to judge the usability [24]. In pathological
    image analysis, it is not possible to find an ideal reference image. Therefore,
    it is not practicable to evaluate the focus quality of an image by comparing it
    with a standard reference image. A detection or evaluation method that doesn''t
    rely on reference is more suitable for practical use. MS Hosseini et al. proposed
    a no-reference focus quality evolution method that boosts the high-frequency information
    of the image to estimate the focus problem [25].'
