  md: 'analysis of studying COVID-19 identification. The public databases for diagnosing
    and predicting COVID-19 are discussed. The most up-to-date DL approaches were
    used to diagnose, segment, and forecast the spread of COVID-19. The availability
    of a large public database is one of the problems in developing a reliable and
    accurate COVID-19 diagnosis system. We believe that with more public databases,
    researchers will be able to construct better DL models to reliably detect and
    predict COVID-19. As a result, this will aid in the development of the finest-performing
    paradigm. We believe that the fusion of the data models can assist in diagnosis
    and prediction performance. To construct an accurate model, the extracted features
    from the DL architecture can be combined with the applied ML to enhance the obtained
    classification results. Furthermore, constructing an appropriate segmentation
    model is difficult because it requires professionals to delineate the lungs. Therefore,
    the visualization process of the chest X-ray or CT is utilized to detect the most
    significant features that are essential to the accurate diagnosis of these cases.
    In the future, we plan to use feature selection algorithms applied to COVIDX and
    other updated collected datasets to investigate and visualize the images with
    reliable and efficient accuracy.


