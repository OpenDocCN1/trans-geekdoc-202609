  md: 'TMS attacks. In addition to its desirable security protection, trust management
    has been introduced in different applications, such as trust-based routing protocols
    [94], access control and role assignment [57].


    The trust relationship is usually evaluated using two components based on the
    source of information: direct trust and indirect trust. In direct trust, the trustor
    directly monitors the trustee and records the successful and unsuccessful interactions.
    The indirect trust component is evaluated based on the received recommendations
    from other nodes in the network. The trustor could always consider this second-hand
    information, or may only consider them when no sufficient observation history
    is available to assess the trustee. Unfortunately, the indirect trust process
    is resource consuming and prone to dishonest recommendation attacks [25].


    Although TMS is introduced to enhance the overall security, it can be vulnerable
    to some internal attacks, which makes designing a robust TMS a challenging task.


    +   * On-off attack: In an on-off attack, the smart adversaries change their behavior
    alternately to keep themselves undetected and their trust values above the trust
    threshold. This kind of attack can manipulate the TMS and disrupt the network
    operation [46].


    +   * Bad-mouthing attack: One of the dishonest recommendations for attacks. In
    this kind of attack, the recommender tends to give negative recommendations about
    a trustworthy node to destroy its reputation [27].


    +   * Ballot-stuffing attack: Another type of dishonest recommendation for attacks,
    in which the recommender gives positive recommendations about malicious nodes
    to promote them [42].


    +   * Collusion attack: Unlike bad-mouthing and ballot-stuffing attacks where
    just one malicious node provides dishonest recommendations, in collusion attacks,
    a group of malicious nodes colludes to provide dishonest recommendations. Collusion
    attacks are challenging to detect and can mislead the system to make unfair decisions
    [26].


    +   * Selective forwarding attack: Discussed in Section 15.4.


    The trust management schemes can be divided into four main groups based on their
    trust evaluation method.


    # 15.5.3.1 Fuzzy Logic-Based TMS


    The trust relationship is evaluated in this kind of TMS using fuzzy logic and
    pre-defined criteria that have a fuzzy nature. The authors [29] proposed DTMS,
    a distributed fuzzy logic-based trust management scheme. Each node inside the
    network monitors the others behavior and forecasts their trustworthiness with
    a view to remove malicious, compromised and selfish nodes. DTMS used two weighting
    techniques. The first is used to estimate the current trust based on direct observations
    and second-hand information from neighbor nodes, while the second is used to evaluate
    overall trust based on the current trust and the trust history. DTMS shows'
