  md: "Face recognition algorithms include Local Binary Pattern, HoG, Fisherface,\
    \ as well as deep neural network models such as FaceNet, Probabilistic Face Embedding,\
    \ ArcFace, and SpherFace. For image recognition, however, the “FaceNet” model\
    \ is used in this article. FaceNet is a one-shot model that learns a mapping from\
    \ face images to a compact Euclidean space where distances are directly proportional\
    \ to face similarity. Rather than using an intermediate bottleneck layer as in\
    \ previous deep learning methods, FaceNet uses a deep convolutional network to\
    \ directly optimize the embedding itself [29]. Faces are normally aligned with\
    \ simple affine transformations before being fed into convolutional neural networks\
    \ to extract identity-preserving features in a traditional deep face recognition\
    \ system [30]. Face recognition is becoming increasingly common for use in a variety\
    \ of applications, including security systems and from the dataset Labeled Faces\
    \ in the Wild (LFW), the AceNet can provide accuracy of up to 99.63%, and 95.12%\
    \ on the YouTube Faces DB [31].\nFigure 13.3 depicts the security stages that\
    \ a patient must go through to obtain their results or access to their profile\
    \ in the data store.\n\n**Code Generation** For security purposes, a random code\
    \ will be created in this application. All processes will be handled by this application.\
    \ So this randomly generated code will be sent to the patient to encrypt the face\
    \ images data. At first, the application will be installed and registered by the\
    \ patient. And then images will be taken by performing continuous command of the\
    \ application so that it make sure the security of the data and also send data\
    \ in the word cloud by using a secure channel. It’s the most important part of\
    \ this work. To generate random code in this project, we used the Pseudorandom\
    \ Code Generator (PRCG). Any software that uses math to simulate randomness is\
    \ referred to as a pseudorandom number generator (PRNG). A deterministic random\
    \ bit generator is another name for it (DRBG). It is produced by a computer and\
    \ is required by many computer applications, including games and protection. These\
    \ generators employ a numerical algorithm to generate a series of numbers that\
    \ exhibit many of the characteristics of genuinely random numbers. Despite the\
    \ fact that the sequence of pseudorandom numbers is not completely random, a good\
    \ generator can generate numbers that are nearly identical to truly random numbers.\
    \ The algorithm will produce the pseudorandom pattern after selecting an initial\
    \ number or seed [32]. When a user crosses their security system with their code,\
    \ it is the security system [33]. The user may receive a code from the central\
    \ repository, which they must match with the code in their application to obtain\
    \ the desired result. This is the most critical protection system for both the\
    \ device and cloud.\n\n```\nFROM random IMPORT seed\nFROM random IMPORT randint\n\
    FOR_IN range(6):\n    SET value TO randint(0, 9)\n    OUTPUT(value)\n```"
