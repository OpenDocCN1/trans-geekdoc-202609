    The ReLU is calculated as follows:


    ```

    ReLU (y_i) = max (0, y_i) (14.2)

    ```


    where y_i is the output of the convolutional layer.


    The pooling layer comes next to convolutional layers that subside the features
    map by a factor of 2. The motivation of the pooling layer is to reduce overfitting
    and training time. A SoftMax function is used in the fully connected layer to
    classify images. An efficient optimization algorithm is required to learn such
    an extensive number of model parameters as reported in Table 14.2. We applied
    an adaptive moment estimation (Adam) algorithm to optimize model parameters that
    improve the root mean square propagation optimizer by calculating running averages
    of both the gradients and the second moments of the gradients [18].


    # 14.3.3 Transfer Learning for Fine-Tuning of the VGG16 Model


    As it is required to train more than 144 million parameters, the VGG16 network
    needs a massive amount of training dataset. It is always crucial to obtain quality
    data. Thus, we apply transfer learning which is a popular approach in deep learning,'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'where a previously trained model is utilized to solve a new related problem.
    Transfer learning is useful when the training dataset images are small in numbers.
    To elevate the data scarcity issue, the ImageNet dataset was used to fine-tune
    models which contain 14 million images. First, a pre-trained model is built on
    the ImageNet dataset using VGG16 on the image. Then this pre-trained VGG16 model
    is used to fine-tune the model with the facemask dataset. Figure 14.3 illustrates
    the transfer learning mechanism using the pre-trained model.


    ![](img/bffdb4a72252285ac92f0fad78a7f104_263_0.png)


    # Figure 14.3 Transfer learning scheme of the proposed VGG16 model with a pre-trained
    model.


    # 14.3.4 Testing Phase


    To test the proposed facemask detection system, we import two files: One is the
    fine-tuned VGG16 model which is built using transfer learning and the XML classifiers.
    The proposed method is tested on both offline images and real-time video streams.
    To test the effectiveness of the proposed method on the real-time video stream,
    we set up the video acquisition using the webcam and pass each frame through the
    XML classifiers. It detects any face in the frame and a boundary box is drawn
    if the face is detected, and cropped face area is sent to the model for prediction.
    Region of interest (ROI) of face area is calculated, and the model returns its
    prediction after calculation. If the mask is predicted in the face, a green text
    “Mask” is set to appear at the top of the face. If not, “No Mask” will appear.


    # 14.3.4.1 Video Acquisition Using OpenCV


    Computer vision methods are included in an Open-Source Computer Vision Library
    (OpenCV). In this proposed solution, we capture a live stream video with a camera.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'OpenCV provides a convenient interface to accomplish this task using its library.
    To capture a video, we construct the Video Capture object. The device index or
    the name of a video file can be used as a parameter. A device index is a number
    that identifies which camera is being used. A camera is usually attached. In this
    case, we just set the value to 0. The second camera is selected by passing 1,
    and so on. We set up an infinite while loop and use the read () method to read
    the frames. cv2.imshow() method is used to show the frames in the video. We can
    break the loop when we click a specific key.


    # 14.4 RESULTS AND DISCUSSION


    In this section, we evaluate the performance of the proposed VGG16 facemask detection
    system using a benchmark facemask dataset as mentioned in Section 14.3.1. Experimentation
    was carried out on a local PC with Intel Core i7 Processor, 32GB RAM, Nvidia GTX
    980Ti GPU, and relevant software and libraries such as Python, Keras, TensorFlow,
    and OpenCV.


    Most widely used evaluation metrics such as precision (PR), recall rate (RR),
    and accuracy (AC) are used to assess the performance of the proposed method [5].
    The precision denotes the proportion of the real target predicted by the model,
    and the recall rate represents the proportion of all real targets detected. Predicted
    bounding boxes with the intersection over union (IOU) value greater than the threshold
    (0.5 by default) are defined as positive samples and vice versa. PR, RR, and AC
    are defined as follows:


    \(PR = \frac{TP}{TP + FP}\) (14.3)


    where $TP$ defines the number that correctly predicted positive class samples
    as positive, and $FP$ defines the number that incorrectly predicts positive class
    but not positive.


    \(RR = \frac{TP}{TP + FN}\) (14.4)


    where $FN$ defines the number that incorrectly predicts negative class but positive.


    \(AC = \frac{TP}{TP + FP + TN + FN}\) (14.5)


    Table 14.2 provides the comparison results among different algorithms in terms
    of PR, RR, and AC. According to the results in Table 14.2, it can be seen proposed
    method reports perfect accuracy in precision and 0.92 recall rate. Overall proposed
    VGG16 model significantly outperformed the state-of-the-art, yielding 41% (0.41
    in ratio) and 20% (0.20 in ratio) of performance improvement in terms of accuracy
    from MobileNet V2 and RestNet50, respectively.


    Figure 14.4 provides the results of the cross-validation approach during model
    building to ensure higher generalization performance in the testing phase. According
    to the results in the figure, it can be confirmed that the proposed VGG16 provides
    stable performance which justifies the higher test accuracy.'
