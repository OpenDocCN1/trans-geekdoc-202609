    to develop a drug combination prediction model. Like the monotherapy prediction
    models, several initial studies used ML algorithms to build a prediction model
    using pharmacogenomic data from cell lines [76–89]. Although these methods, including
    a study initiated by the DREAM challenge, were not optimal for clinical development,
    they provide a substantial framework for further development [77, 98].


    Several studies have used feedforward neural networks to develop drug combination
    prediction models using previously published or publicly available data. For example,
    Xia et al. used data from transcriptomic and proteomic data from the NCI-ALMANAC
    database [91] to develop a feedforward neural network [92]. They used two separate
    submodels to process biological data and drug descriptors. The use of submodels
    allowed them to reduce the dimensionality before introducing data to the final
    prediction model. Furthermore, two studies used data from O''Neil et al. [84]
    to develop a deep learning model [93] or a modified DL model [94]. Although these
    models display considerable improvement in prediction performance compared to
    classical ML approaches, they also need to be upgraded with clinically relevant
    pharmacogenomic data.


    The incorporation of drug descriptors with pharmacogenomic data remains challenging
    due to the substantial increase in the number of features. Recent studies have
    focused on methods that allow a reduction of variables prior to building the prediction
    model. Jiang et al. implemented a GCN to build a cell-line-specific drug combination
    prediction model [95]. Several other studies used autoencoders [96] or a restricted
    Boltzmann machine (RBM) [97] to extract meaningful features from high-dimensional
    pharmacogenomic data. Nevertheless, the extraction of meaningful features can
    improve the predictive performance of a model.'
