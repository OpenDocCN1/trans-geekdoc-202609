  img_proc: true
- pgno: 139
  md: '[10]. However, the health and economic damage are far greater in reality. Therefore,
    the selection of patients for HER2-targeted therapy is a crucial step while deciding
    on the treatment plan for a BC patient.


    HER2 positivity can be determined by assessing the HER2 gene amplification or
    subsequent HER2 protein overexpression. An immunohistochemistry (IHC) test is
    used for assessing HER2 protein expression and in situ hybridization (ISH) test
    for assessing HER2 gene amplification. In clinical practice, the IHC test is utilized
    initially to determine the HER2-positive status. However, IHC test results are
    not conclusive for the cases. Therefore, a reflex ISH test is required and performed
    using Fluorescence ISH (FISH) or Chromogenic ISH (CISH) to confirm the result,
    according to the American Society of Clinical Oncology and College of American
    Pathologists (ASCO/CAP) guideline [11]. Most laboratories use FISH as the reflex
    test. However, the FISH test requires special training, special setup, and a lot
    of time for preparing the specimen and quantifying the signals. On the other hand,
    the CISH test requires the pathologists to count myriads of signals manually which
    is laborious and time consuming. Some commercial tools are available for assistance,
    but they are not reliable and not user friendly. The limitations of current tests
    signify the need for a more practical and efficient system for HER2 assessment.
    Moreover, in a study of 1787 patients, it was found that 9.7% of the HER2 negative
    patients benefited from anti-HER2 therapy [12] which might be due to the false-negative
    results of the HER2 test. Therefore, the need for a more practical and accurate
    system is undeniable to select patients for therapy and to advance patient care.


    In this chapter, we present an automatic HER2 grading system for selecting invasive
    BC patients for giving HER2 therapy. This system is developed based on the HER2
    quantification method proposed by our group in a previous study [13], and validated
    by Memorial Sloan Kettering Cancer Center. The system is expected to determine
    HER2 status automatically and provide useful information to decide on the therapeutic
    plan, thus improve patient care with optimal therapies.


    # 7.2 CLINICAL PRACTICES FOR HER2 QUANTIFICATION


    HER2 positivity can be determined by counting the HER2 gene inside the nucleus
    or the subsequent HER2 protein receptors outside the nucleus. Figure 7.1 shows
    the example of a normal cell and HER2-positive cell. Based on the biomarker used,
    HER2 tests can be divided into two categories: Gene-based test and protein-based
    test. Both types of tests are intended to detect HER2 positivity but they quantify
    different biological targets for this purpose. IHC assesses the HER2 protein expression
    while ISH tests such as FISH or CISH detect the HER2 gene amplification. IHC,
    FISH, and CISH are the FDA approved tests for HER2 assessment.


    IHC detects proteins in the cell membrane (cell boundary). If a HER2 protein is
    in the cell membrane, the membrane will be stained in IHC. Pathologists then score
    the staining strength in the cell membrane as 0, 1+, 2+, or 3+, according to the
    criteria given in Table 7.1. After that, the HER2 protein expression is classified
    as negative (scores 0 and 1+), equivocal (score 2+), or positive (score 3+). IHC
    is a qualitative test, and the score is subject to inter and intraobserver variation.
    Moreover, the'
