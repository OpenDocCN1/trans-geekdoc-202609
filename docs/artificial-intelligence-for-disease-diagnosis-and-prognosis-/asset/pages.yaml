  md: 'Based on its shape, it is also called “ramp function.” It is zero for negative
    values and increases linearly for positive values. It not only outperforms the
    activation functions of Sigmoid and tanh, but also is computationally efficient
    and not saturable. However, the problem arises only when the input value is zero
    because the gradient cannot be taken. To overcome this limitation, another form
    of ReLUs is used, namely Leaky ReLUs [28], in which the small, non-zero gradient
    is allowed when the unit is not active:


    \( f(net) = \begin{cases} net & \text{if } net >= 0 \\ \alpha \times net & \text{otherwise}
    \end{cases} \) (5.8)


    The final activation function is the exponential linear units (ELUs) introduced
    [16] as follows:


    \( f(net) = \begin{cases} net & \text{if } net >= 0 \\ \alpha \times (exp(net)
    - 1) & \text{otherwise} \end{cases} \) (5.9)


    \(\alpha\) is a constant whose typical value is 1.


    # 5.6.4 CNN-Based Classifiers


    The introduced feedforward neural networks can be used in image processing. However,
    they are not efficient enough due to the many connections made between all nodes
    in one layer and those in the next layer. In this case, the efficiency can be
    improved by carefully pruning these connections according to the structure of
    the images which results in a better performance. A very common type of NN is
    CNN in which the spatial relationships in data are preserved through very few
    connections between layers. A typical CNN architecture applied in the field of
    skin disease classification and recognition is illustrated in Figure 5.22. CNNs
    are composed of different layers of Convolutional (CONV), Activation, Pooling
    (POOL), Fully connected (FC), Batch normalization (BN), and Dropout (DO), which
    are explained in details in the following paragraphs.


