    # ### 7.6.4 Color Correction for HER2 Scoring


    Color is an important property for automated image analysis using WSI and variation
    in color can cause trouble for the analysis tools. In the WSI system, the color
    variation can be caused by the thickness of the specimen, staining concentration,
    scanner settings, WSI visualization software, or the display device. The proposed
    system utilizes the RGB values of pixels to score the signals. Therefore, it is
    necessary to apply color correction prior to signal detection and scoring. Automatic
    color correction is a common feature of automated image analysis systems. Two
    most common approaches of color correction in WSI are color calibration using
    a color chart and color transformation based on a reference image. The color chart-based
    method is intended to compensate for the color variations introduced by the scanners.
    While the other method is focused on the scanning issues and utilizes the shape
    of color distribution of a reference image. In the proposed system, slide controls
    are utilized to calibrate the color of the slide. Controls are circular patches
    of the specimen where the staining is standard. The proposed system calibrated
    the color of signals utilizing the color correction method proposed by Murakami
    et al. [29]. However, instead of applying the color correction to the entire WSI,
    the system estimates the color corrected values for pixels using the loop-up table
    and the corrected pixels are utilized scoring and selecting the signals. This
    approach saves time for estimating the corrected values.


