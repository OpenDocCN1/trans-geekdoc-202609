    # ### 5.5.1 Feature Extraction


    The information collected from the image is referred as features. The features
    are the information taken from pictures in numerical values, which are difficult
    for human beings to comprehend and relate to one another. The dimensions of the
    features retrieved from a picture are usually substantially lower than the original
    image.


    In general, two characteristics may be derived from images depending on the application:
    Local and global features. The image retrieval, object detection, and classification
    are all done using global features, but skin disease diagnosis and identification
    are made with local features. Combining global and local features enhances identification
    accuracy while it increases the computation cost. This technique of discovering
    and extracting image features from vast textual data is known as feature extraction
    in machine learning.


    **GLCM Features.** Texture characteristics are derived from the statistical distribution
    of intensity combinations at defined places relative to each other in the image
    in statistical texture analysis. Statistical features are classified into first-order,
    second-order, and higher-order statistics, based on the number of the intensity
    points in each combination. The GLCM approach is a technique for obtaining statistical
    texture characteristics of the second order. This method has been used in a wide
    range of applications. Third- and higher-order textures consider connections between
    three or more pixels. These are theoretically conceivable, but they are not widely
    used due to the time required to calculate them and the difficulty in interpreting
    the results.


    Each row and column of the GLCM corresponds to the number of gray levels (G) in
    the image. The matrix element P (i, j |Δx, Δy) includes the second-order statistical
    probability values for changes in gray levels “i” and “j” at a certain distance
    (d) and specific angle (θ). The element of this matrix is the frequency with which
