  md: '# Real-Time Facemask Detection Using Deep Convolutional Neural Network-Based
    Transfer Learning


    Jakaria Islam Emon, M. M. Manjurul Islam, Syeda Amina Abedin and Shakhawat Hossain

    Department of Computer Science, American International University-Bangladesh,
    Dhaka

    Rupam Kumar Das

    College of Science and Engineering, University of Glasgow, United Kingdom


    # CONTENTS


    +   14.1 Introduction .................................................... 244

    +   14.2 Related Works ................................................... 245

    +   14.3 Materials and Method ............................................ 246

    +   14.3.1 Dataset ....................................................... 246

    +   14.3.2 VGG16 Architecture ............................................ 247

    +   14.3.3 Transfer Learning for Fine-Tuning of the VGG16 Model ....... 248

    +   14.3.4 Testing Phase ................................................. 249

    +   14.3.4.1 Video Acquisition Using OpenCV ............................ 249

    +   14.4 Results and Discussion .......................................... 250

    +   14.5 Conclusion and Future Work ...................................... 251


    T HE PANDEMIC of COVID-19 has caused severe harm and infected tens of millions
    of people across the globe. In response to the rapid outbreak of COVID-19, this
    chapter presents an automated facemask detection technology in a real-time video
    stream using a deep convolutional neural network (DCNN)-based transfer learning
    mechanism. The proposed framework has two blocks—the first module leverages the
    training phase which was built on visual geometry group network (VGG16), a variant
    of DCNN, to learn a model on a benchmark dataset. To build an accurate model,'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'VGG16 needs an abundance of data. Thus, we deploy a pre-trained model to be
    built on ImageNet, a large visual database, for fine-tuning the VGG16 model using
    knowledge transfer. In the second phase, we perform testing on offline facemask
    images and real-time video streaming using fine-tuned VGG16 model. The proposed
    methodology is successfully capable of identifying mask and nonmask people, yielding
    41% (0.41 in ratio) and 20% (0.20 in ratio) of performance improvement in terms
    of accuracy from MobileNet V2 and RestNet50, respectively. The experimental results
    suggest that the proposed facemask detection algorithm can be deployed in a public
    place with satisfactory performance to contribute to controlling COVID-19 pandemics.


    # # 14.1 INTRODUCTION


    In recent history, the greatest pandemic spread throughout the world is Coronavirus
    Disease 2019 (COVID-19), which occurred in late 2019. COVID-19 is a deadly infectious
    disease caused by the severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2)
    [1]. As of October 2021, more than 246 million cases and 4.99 million deaths have
    been confirmed, making it one of the deadliest pandemics in history. Coronavirus
    infection is transmitted mainly by respiratory droplets formed when people breathe,
    talk, sneeze, or cough as per the Centers for Disease Control and Prevention (CDC)
    [2].


    Therefore, many solutions namely lockdowns, shutdowns, and confinement are suggested
    by most of the world''s governments to prevent the spread of COVID-19 infection
    rapidly. Beyond that, the activities in many parts of the world have slowed or
    stopped due to the human, economic, and social impacts of distancing and protection
    measures. In addition to various preventive measurements, the World Health Organization''s
    (WHO) interim guidance suggested that the use of facemasks has clear links to
    reducing the spread of SARS-CoV-2 [3]. Specialists also endorse using masks in
    public places to reduce the transmission of infections [4]. As a preventive measure
    for the ongoing pandemic, this chapter seeks to develop a deep learning-based
    facemask detection system that is capable of identifying whether people in surveillance-type
    video streams are correctly wearing their masks. In the era of massive data, deep
    learning methods have been put to use to analyze these diverse data; these methods
    include representation learning for feature extraction and supervised learning
    for prediction. The accumulation of the large volumes of data and the exploitation
    of parallel computing resources have accelerated the development of deep learning
    technology; over the past decade, these deep learning models have been used in
    various fields of academia and industry, and they are also being actively applied
    in computer vision [5].


    Deep learning is a method of constructing and training a deep neural network with
    hidden layers to be mainly used for classification and prediction. The outstanding
    performance of the visual geometry group network (VGG16) [6]—an image classifier
    based on a deep convolutional neural network (DCNN)—won the ImageNet [7] challenge
    in 2014 for image classification with an overwhelming margin. The primary aim
    of this chapter is to build VGG16 classifier-based transfer learning process for
    automatic facemask detection in real-time video streaming.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'The rest of the chapter is structured as follows. Section 14.2 deals with the
    review of related works in the past. Section 14.3 describes the materials and
    method of this research. In Section 14.4, we present the experimental results
    and findings of the proposed methodology. Finally, the conclusion of the proposed
    work is presented in Section 14.5.


    # 14.2 RELATED WORKS


    Image reconstruction and facial recognition for identity verification are one
    of the most common research topics [8]. The continuing epidemic has made research
    with similar intentions utterly popular. The main goal of our effort is to detect
    persons who are wearing masks or not in the real-time video stream. Researchers
    developed a method that can independently determine the existence of nose and
    mouth to detect facemask [9]. Their proposed system was efficient but it had a
    limitation—only complete front faces can be processed, and the sensors may be
    tricked simply by covering the mouth and nose by hand. Qin and Li developed a
    facemask recognition technique that can classify the pictures into three categories:
    Proper facemask wearing, wrong facemask wearing, and no facemask wearing using
    the SRCNet classification network [10]. Deb et al. proposed a different approach
    to the system that applies MobileNetV2 for facemask classification [11]. But this
    method is not representative of the different inter-ethnic, gender, and different
    face types.


    Cabani et al. suggested a mask recognition system based on facial characteristic
    images with additional training data [9]. At the same time, the mobile application
    [12] was developed to educate individuals to use masks properly by detecting whether
    the masks of users covered their nose and their mouth simultaneously. For masked
    and non-masked face recognition, Ejaz et al. utilized the principal component
    analysis (PCA) technique [13]. While identifying faces without a mask, PCA''s
    accuracy is 96.25%, but it drops to 68.75% when doing so while wearing a mask.
    Javed et al. created an interactive model, called MRGAN, which eliminates items
    like microphones from face pictures and recomposes the deleted area with an adversary
    network of the generating region [14]. A deep neural network architecture called
    DarkNet-19 was utilized by Li and colleagues for face identification and they
    used YOLOv3 for face detection [15]. An automated method for the identification
    of the presence or absence of the required surgical mask in operation rooms was
    proposed [16]. The goal of that system was to sound an alarm if a member of staff
    is not wearing a mask while on duty.


    But relatively little research has been done on mask detection from the real-time
    video stream and these existing research works need further refinement for improved
    classification accuracy. Thus we propose a transfer learning strategy that leverages
    the pre-trained VGG16 model to enhance the facemask identification scheme from
    a live video stream to fight against COVID-19.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 14.3  MATERIALS AND METHOD


    Figure 14.1 illustrates the proposed facemask detection system, which comprises
    two main blocks. In the training phase, VGG16 classifier is fine-tuned using a
    limited medical facemask dataset with weights sharing from a large pre-trained
    ImageNet weight model. The fine-tuned model is further validated using a validation
    dataset for performance measurement. In the testing phase, models are tested with
    offline images and video streams for classification performance measurements.
    Detailed descriptions of the proposed methodology are as follows.


    # 14.3.1  Dataset


    We apply the benchmark facemask dataset from Kaggle to build and test the VGG16
    model for classification accuracy measurement [17]. The dataset consists of 1500
    mask and non-mask images. We randomly split this dataset into three sets such
    as training, validation, and testing sets. We kept 33% of the dataset (i.e., 500
    images) for testing which is completely unknown to the model to ensure a higher
    generalization performance which means the testing set did not participate in
    model building. Note that 67% of the dataset (i.e., 1000 images) was used for
    model building in the training phase.


    ![](img/bffdb4a72252285ac92f0fad78a7f104_260_0.png)


    Figure 14.1  Schematic representation of the proposed work for identifying facemasks.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 14.3.2 VGG16 Architecture


    The proposed algorithm is based on the VGG16 deep learning model which is a variant
    of DCNN architecture [6]. VGG16 is regarded as one of the best computer vision
    model architectures to date. The main motivation of using VGG16 is that they focused
    on having convolution layers of 3 × 3 filter with a stride 1 and always used the
    same padding and max pool layer of 2 × 2 filter of stride 2 instead of having
    a large number of hyperparameters. It follows the arrangement of convolution and
    max pool layers consistently throughout the whole architecture. In the end, it
    has 3 fully connected layers (FC) followed by a SoftMax for the output layer.
    The 16 in VGG16 denotes its 16 layers that have weights. This network is a pretty
    large network with approximately 144 million parameters. The depiction of the
    proposed architecture of the VGG16 network is shown in Figure 14.2. Table 14.1
    presents the dimensionality of each layer in the VGG16 architecture.


    ![](img/bffdb4a72252285ac92f0fad78a7f104_261_0.png)


    Figure 14.2 Proposed VGGNet16 network for facemask detection.


    In the convolutional layer of VGG16, it performs mathematical operations on two
    functions in the form of integration of products among functions. The main motivation
    of convolution operation is to find salient features. If f is the input and w
    is the filter, the convolution operation can be defined as follows,


    ```

    y = f * g = \(\int_{-\infty}^{\infty} f(t - \tau) w(\tau) d\tau,\) (14.1)

    ```


    where t defines an amount of shift. After the convolutional operation, we apply
    the activation function to introduce the nonlinearity of the model. Various activation
    functions namely rectified linear unit (ReLU), linear function, Sigmoid, or tanh
    mostly used, but we apply ReLU in this study to train the model since it ensures
    fast and near-global optimization of weights in comparison with other activation
    functions.'
  merge: -1
  img_proc: true
