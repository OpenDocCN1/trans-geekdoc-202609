  md: '# 15.5.1.2 Authentication and Key Establishment


    Authentication is the cornerstone to secure the network on all tiers of communication
    in WBAN. Considerable research has been put forward to fill this research gap
    in the literature. However, the majority of the proposed schemes are vulnerable
    to specific attacks or do not fulfill all the security requirements [64,90], which
    makes proposing a practical and secure authentication scheme for WBAN an open
    area for further research [50]. In what follows, the potential authentication
    schemes will be presented.


    **Non-cryptographic security schemes.** The non-cryptographic authentication schemes
    take advantage of some physical characteristics of the targeting network, such
    as human physiological signals. They have been classified as non-cryptographic
    because of the used technique; however, many proposed schemes are able to create
    secret keys to encrypt the exchanged messages.


    +   1. **Biometric-based security schemes:** Many lightweight authentication schemes
    are proposed in the literature based on the body bio-signals because there is
    a thought that these signals are difficult to be forged. A novel security scheme
    is proposed for WBAN in [69]. The proposed scheme is able to generate and distribute
    symmetric keys by sensing the ECG signal. The authors used time synchronization
    to avoid broadcasting the ECG signal. Moreover, the study proves the robustness
    of the proposed method by running informal and formal security analyses.


    +   2. **Channel-based security schemes:** Another approach to use the physical
    characteristics to authenticate nodes is built on the assumption that the communication
    channel qualities between two nodes are the same. The proposed schemes in the
    literature can be categorized into:


    +   • **Security schemes based on an out-of-band (OOB) communication channel:**
    Some schemes introduce the use of an auxiliary channel to authenticate nodes assuming
    that this out-of-band channel is not prone to eavesdropping attacks. For example,
    a visual OOB channel is introduced in [49] to help the patient authenticates sensor
    nodes by comparing LED blinking patterns.


    +   • **Security schemes that require additional hardware:** Few studies introduced
    adding additional hardware to facilitate the authentication process, such as the
    good neighbor scheme where the authors used multiple antennas at the receiver
    side [12].


    +   • **Security schemes based on channel characteristic measurements:** Many
    schemes considered the channel characteristic measurements, such as received signal
    strength (RSS) measurements. Authors in BANA [73] and MASK-BAN [74] proposed lightweight
    authentication schemes based on RSS. In such schemes, there are some nodes distribution
    restrictions where the nodes are usually distributed within the half-wavelength
    range.'
