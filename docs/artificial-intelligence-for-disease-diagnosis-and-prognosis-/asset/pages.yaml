  md: 'then the dimension of the data pool also increases making the function more
    complex. There are three types of regression analysis–linear regression, multiple
    linear regression, and nonlinear regression.


    In linear regression, there is only one independent function. There is a linear
    relationship between the slope and the intercept due to dependent and independent
    variables. The independent value is not random. The value of residual error is
    zero, constant across all observations, not correlated among observations, and
    follows the normal distribution. If we formulate simple linear regression, the
    equation will be


    $Y = a + bX + \epsilon$


    where:


    +   - Y : Dependent variable

    +   - X : Independent (explanatory) variable

    +   - a : Intercept

    +   - b : Slope

    +   - ε : Residual (error)


    ![](img/bffdb4a72252285ac92f0fad78a7f104_31_0.png)


    Figure 2.6 Simple linear regression analysis.


    Multiple linear regression analysis is a lot like the simple linear model. The
    only crucial difference is that there are multiple independent variables used
    in the model. If we formulate multiple linear regression, the equation will be


    $Y = a + bX_1 + cX_2 + ...... + dX_n + \epsilon$


    where:


    +   - Y : Dependent variable

    +   - X1, X2 .... X3 : Independent (explanatory) variable

    +   - a : Intercept

    +   - b, c, d : Slopes

    +   - ε : Residual (error)'
