  md: 'instances with different attributes or features stay in different clusters.
    Here data is processed by the algorithm and finds natural groups if it exists
    in the data. Clustering unsupervised learning can possess different techniques
    and types. Here we will discuss a few.


    +   * Partition clustering: Here, data is partitioned or clustered in such a way
    that one data can belong to one cluster only.


    *Agglomerative clustering*: In this method, data is initially clustered into a
    fixed number of clusters and does not require the number of clusters where each
    data is a single cluster. As the data is trained, the number of clusters decreases
    as they merge into one another. Finally, it forms a single cluster containing
    all the instances.


    *Probabilistic clustering*: Here data is clustered based on the probability distribution
    of the objects.


    *Overlapping*: In this process, data is clustered using fuzzy sets where every
    point might belong to two or more clusters. Each piece of data will have a separate
    degree of membership.


    Based on these techniques there are different algorithms—Hierarchical clustering
    (builds a hierarchy of clusters), K-means clustering (clusters the data based
    on the highest value of K), Dendrogram clustering (height of the dendrogram is
    the level similarity between clusters), K-Nearest neighbor clustering (similar
    to supervised learning KNN but with unlabeled data).


    +   * Association: The Association rule is unsupervised learning based on the
    if-else condition. It checks if one data instance is dependent on another data
    instance. The goal is to find some relation or association among the data points.
    The “if” element in an association is called antecedent and the statement part
    is called the consequent.


    There are three types of association learning rules:


    *Apriori Algorithm*: Breadth-first search and the Hash tree is used for this algorithm.
    Datasets that contain transaction are a popular use case for this algorithm.


    *Eclat Algorithm*: Eclat stands for equivalent class transformation. This relies
    on the depth-first search technique to find an association among the instances
    inside the dataset.


    *F-P Growth Algorithm*: F-P stands for the frequent pattern. It is an improved
    version of the Apriori algorithm. It works by representing the dataset as a tree
    structure. This structure is known as a frequent pattern whose purpose is to extract
    the most frequent patterns.


    Unsupervised learning is very good at detecting anomalies. It can detect fraud
    transactions pretty well. Moreover, it is good at working with fewer features
    and decomposing the dataset into multiple components. On the contrary, the output
    of the model is not labeled and not known. This leads to less accurate data for
    the general user.'
