    # 12.2 TYPES OF DIABETES


    Classification and diagnosis of diabetes are two complex tasks. There are mainly
    three types of diabetes such as type 1 diabetes (T1D), type 2 diabetes (T2D),
    and gestational diabetes mellitus (GDM). T1D occurs when the immune system destroys
    beta cells in the pancreas [6]. These beta cells are responsible for insulin production.
    Due to beta cells’ damage, the body generates insulin in a lower amount which
    results in insulin deficiency. Insulin is responsible for carrying glucose to
    the body cells. Cells use this glucose as a fuel to generate energy. The energy
    production process is shut off due to the damage of beta cells as glucose is not
    transferred to the body cells in the absence of insulin. Consequently, glucose
    accumulates in the bloodstream and causes high blood sugar.


    Children and adolescents are most susceptible to developing T1D. Although the
    exact reason for T1D is unknown to researchers, gene plays a role in this harmful
    development [7]. Environmental factors such as viral infection, toxin encounters,
    or food habits are also associated with T1D. A family history of diabetes increases
    the risk of developing the condition among the progeny. If T1D goes untreated,
    serious health complications, sometimes life-threatening problems could arise.
    T1D patients are at risk of developing eye disease, kidney damage, nerve cell
    damage, and cardiovascular disease.


    T2D is the most common category of diabetes that develops due to insulin resistance
    [8]. The root causes responsible for T2D diabetes are not fully understood, but
    researchers have observed a correlation between T2D and obesity, age, ethnicity,
    and a family history of diabetes [9]. A study [10] showed that eating calorie-rich
    refined foods and beverages and too few whole fruits, vegetables, and whole-grain
    can significantly elevate the risk of developing T2D. Although T2D is commonly
    seen among older people, children, adolescents, and younger adults are also at
    significant risk of T2D development due to physical inactivity, poor dieting,
    and rising level of obesity. Symptoms for T2D are similar to that of T1D, except
    the progression of the symptoms are slowly appears, and onset time is challenging
    to determine in the case of T2D. Some patients are first diagnosed with T2D only
    when they develop health complications, such as foot ulcers, a change in renal
    failure vision.


    According to the American Diabetes Association (ADA), diabetes is detected between
    24 and 28 weeks of pregnancy is known as GDM [11]. GDM elevates BG levels which
    can affect the newborn baby’s health. In the case of GDM, the BG level goes to
    normal soon after delivery. However, there is a risk of developing T2D if someone
    develops GDM during pregnancy. There is a high chance of developing'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'GDM at a later birth for women with hyperglycemia during their first pregnancy.
    About 50% of pregnant women with hyperglycemia develop T2D after 5-10 years of
    their delivery [12]. During pregnancy, the placenta produces other hormones that
    impair insulin action in the body cells. As a result, the BG level rises.


    # 12.3 HOW IS DIABETES DIAGNOSED


    The World Health Organization (WHO) provides guidelines to diagnose diabetes as
    summarized in Figure 12.1. The BG value of <100 mg/dL is considered normal, BG
    values between 100 and 126 mg/dL are considered pre-diabetes, and BG values ≥126
    mg/dL are confirmed as the development of diabetes. Alternately, ADA considers
    the level of HbA1c <5.7% as normal, 5.7% to 6.4% as pre-diabetes, and ≥6.5% as
    diabetes.


    ![](img/bffdb4a72252285ac92f0fad78a7f104_220_0.png)


    Figure 12.1 Illustration of diabetes diagnosis and HbA1c test ranges.


    # 12.4 MANAGEMENT OF DIABETES


    The proper management of diabetes refers to maintaining BG levels near normal
    by adjusting food intake, medication, or physical activity. In recent years, there
    has been much advancement in electronic health technology, which has proved to
    be a cost-effective method for monitoring health-related data. The advancement
    of e-health technology allows for a cohort of health-related data to be collected.
    For diabetes diagnosis and management, BG measurement plays a vital role in reducing
    diabetes-related health complications. Different laboratory tests such as oral
    glucose tolerance test (OGTT) and HbA1c measures are used for diabetes management.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '![](img/bffdb4a72252285ac92f0fad78a7f104_221_0.png)


    Figure 12.2 Glucometer.


    Advancement in sensor technology facilitates the daily monitoring of BG. These
    sensor devices used to measure BG are three types: Invasive, semi-invasive, and
    non-invasive. A brief overview of each category is presented in the subsequent
    sections.


    For self-management, a BG measurement device was not available before the 1960s.
    The first device easy to use at home was developed in 1981, known as a Glucometer
    [13]. This meter was based on the same basic principle used for today''s measurement.
    At first, the blood sample is exposed to an enzyme, which oxidizes the blood (releases
    electrons). Then released electron passes through an electrode, which reads the
    current value proportional to the oxidized glucose. The more glucose present in
    the blood, the higher the oxidation, leading to higher glucose levels. Over the
    years, the device''s ability to measure BG accurately has been improved, and nowadays,
    advanced glucose meters are available for use, as shown in Figure 12.2.


    One of the significant advancements in the BG monitoring system is developing
    the continuous glucose monitoring (CGM) system. CGM is an approach to measuring
    BG continuously throughout the day and night, which can provide a complete picture
    of a user''s BG level necessary for better treatment decisions and glucose control
    [14]. A tiny electrode known as a glucose sensor is inserted under the skin to
    measure the interstitial fluid''s glucose level. The most well-known CGM devices
    available are Dexcom and Freestyle Libre. However, CGM measures BG differently
    from the traditional gold standard method. The CGM system measures the glucose
    from the interstitial fluid, not directly from the blood. The main drawback is
    that this CGM reading lags behind the actual BG value by 10–15 minutes [15].


    A needle-free alternative to the finger prick test is a long-lasting dream device
    for many patients with diabetes. In the early 2000s, Cygnus incorporated Glucowatch
    [16]. It used a weak electrode to draw glucose from the interstitial fluid into
    an auto sensor. Approved by the FDA in 2002, the device was supposed to provide
    regular and painless measurement, but soon it gained a bad reputation due to its
    painful rashes in'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'the skin’s contact point, inaccurate reading, and long warm-up time. Despite
    promises from many companies, no product has taken its place in reality. Non-invasive
    glucose monitoring system remains a dream device among diabetes patients.


    # 12.5 CURRENT CHALLENGES AND LIMITATIONS


    In recent years, there have been praiseworthy advancements in sensor technology,
    which proved cost-effective and secured their utilization in support of health
    and health-related fields. These advancements facilitate generating a significant
    amount of health-related data. A key challenge is a lack of any readily available
    insight into those health data. Therefore, for a deeper understanding or, more
    specifically, for knowledge discovery from raw healthcare data, machine learning
    (ML) models are frequently implemented [17]. We have witnessed healthcare professionals’
    interest in utilizing available data from diabetes patients for diabetes management
    by applying ML and data mining techniques. However, today’s healthcare practitioners
    are already overwhelmed with various professional and administrative responsibilities.
    Therefore, to extract any useful information from such data, we require to build
    models to facilitate the practitioner by providing a more in-depth insight and
    a “second opinion” based on the data.


    One of the fundamental challenges in diabetes diagnosis and management is that
    little work is done in the early-onset detection of diabetes progression. Another
    crucial challenge in diabetes management is whether the approach should be reactive
    or proactive. Reactive responses are often recommended after the development of
    diabetes, while proactive activity is carried out before the development of the
    disease. Early intervention through proactive responses can reduce healthcare
    burdens and complications through early-onset detection of diabetes and proper
    diabetes management. Although ML techniques had been applied for disease diagnosis,
    few works addressed the early onset detection of T2D. Furthermore, the current
    approach of HbA1c estimations is used to take reactive actions for diabetes management.
    The estimations of HbA1c are sometimes way off from the actual levels. Moreover,
    these estimations are derived using current BG measurements. The advanced CGM
    technology has not been utilized for HbA1c prediction. There is no previous work
    on the early prediction of HbA1c that may facilitate proactive responses for diabetes
    management.


    # 12.6 MACHINE LEARNING FOR DIABETES MANAGEMENT


    This section aims to investigate previous ML-based works related to diabetes prediction
    and management. We start with a brief introduction to the ML. Then we summarized
    ML techniques implemented for diabetes detection and prediction. Finally, we present
    a summary of findings in the literature with their limitation and our future work
    scope.


    Arthur Samuel first coined the term ML in 1959 [18]. ML enables a machine or computer
    to learn from data without being programmed explicitly. The ML approach trains
    a computer to behave like humans and animals: Learn from experience. ML'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'algorithms use statistical or computational methods to develop a relationship
    between data and outcomes without predetermined equations or models. The algorithm
    tries to find a pattern in data and make better decisions and predictions. Accurate
    prediction of a specific event occurring in the future, based on past data, has
    seen a surge in interest due to advances in data mining and ML techniques. Lately,
    we have seen such approaches applied in many fields, including business management,
    industrial automation, sports analytics, and healthcare. In the present era of
    big data, ML techniques are applied for solving problems in areas such as image
    processing for face and object detection, drug discovery, disease detection, DNA
    sequencing, predictive maintenance, voice recognition, and machine translation
    [19]. ML tasks are divided into two main categories: (a) Supervised learning,
    where an algorithm learns from available training data, also known as ground truth,
    and (b) Unsupervised learning, in which an algorithm tries to discover insight
    about unlabeled data. By taking into consideration the severe impacts of diabetes,
    ML and data mining-based approaches have recently attracted enough attention among
    the diabetes research community.


    # 12.6.1 Machine Learning Algorithm Used for Diabetes Management


    A support vector machine (SVM) is one of the most popular supervised ML approaches
    used for classification and regression. SVM finds a hyperplane to maximize the
    margin between the groups by utilizing the Lagrangian optimization technique [20].
    SVM uses a kernel technique that transforms the data to distinguish between different
    classes of data. Yu et al. [21] implemented SVM to test its potential for diabetes
    detection. Their study used a total of six years of health records from the National
    Health and Nutrition Examination Survey (NHANES) conducted on the US population.
    An AUC score of 83.47% and 73.18% was reported for 10-fold cross-validation on
    diabetes and pre-diabetes detection. Barakat et al. [22] proposed an intelligible
    SVM for the diagnostic of diabetes. The data was sourced from the National Survey
    of Diabetes, 1991, in the Sultanate of Oman. Optimized SVM with RBF kernel and
    gamma, regularization parameters were chosen based on the training data''s best
    performance.


    An ensemble learning method that generates multiple classifiers and provides a
    final result by combining results from all classifiers based on voting. There
    are two methods of ensembling, namely boosting and bagging. In boosting approach,
    misclassified instances are given more weight during later iterations. However,
    trees are built upon a bootstrap sample during the implementation bagging method.
    One particular example of the bagging method is a random forest (RF) algorithm
    proposed by Breiman [23]. Researchers also [24] utilized the RF model to select
    a single-nucleotide polymorphism (SNPs) responsible for the development of diabetes.
    The experiment was carried out with a dataset of 677 subjects, 429 healthy and
    248 people with diabetes. An AUC score of 85.3% was achieved for the selected
    SNP feature.


    Logistic regression (LR) is a statistical method where log-odds of the probability
    of an event are linear combinations of independent variables [25]. Although the
    model outputs the probability of an event, it is used in the classification task
    by applying a threshold. The logistic regression approach''s outcome is binary,
    such as positive'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'or 1 (diabetes) and negative or 0 (non-diabetes). Logistic regression tries
    to develop a relationship between feature and outcome by finding the best descriptive
    fitting model [26]. There are two ways of learning this function. A discriminating
    model learns the function directly to compute class posterior, while a generative
    model learns the conditional class probability, class prior, followed by applying
    the Bayes rule. A modified alternative to discriminative and generative models
    is to merge probability altogether to learn the discriminative function that directly
    maps input to output. Devi et al. [27] proposed a modified LR model for detection
    and finding the most relevant predictor of T2D. The study has used a dataset consisting
    of 739 patients with 31 detailed features such as age, gender, random blood sugar,
    fasting blood sugar, cholesterol, lipoprotein, HbA1c. An accuracy of 90.4% was
    reported for the sigmoid activation function.


    A Naïve Bayes (NB) classifier is a candid and compelling model used for classifying
    data based on the Bayes theorem [28]. NB classifiers assume that all attributes
    are conditionally independent of the given class label. The goal of this classifier
    is to learn a representative function from a given training labeled dataset. Nongyao
    et al. [29] compared primary ML classifiers such as ANN, decision trees (DT),
    NB, LR, and RF. The diabetes data came from 26 primary care units in Thailand,
    consisting of 12 features such as smoking behavior, BMI, family history of hypertension,
    and diabetes. They have built unbiased models using a cross-validation method
    and achieved the highest accuracy of 85.56% for random forest classifiers.


    An artificial neural network (ANN) is one of the dominant tools used in ML. As
    the name ‘neuron’ suggests, ANN is a brain-inspired system that tries to replicate
    the human brain [30]. ANN consists of an input and output layer and a hidden layer
    (in most cases) to transform input into some form that the next layer can use.
    ANN is handy in finding a pattern or feature extraction from data considered complicated
    or laborious for a human. The success of ANN is due to a technique known as “backpropagation,”
    which allows changing the weight of the hidden layer if there is any misclassification.
    The fundamental advantage of ANN is that it does not require in-depth knowledge
    about the relationship between variables. Instead, it tries to recognize a pattern
    in the dataset and store those patterns as a weight for later use for the test
    case. One study [31] developed a deep neural network-based model to monitor BG
    levels. Their model was evaluated using Diabetes Research in Children Network
    (DirecNet) data consisting of 25 patients with type 1 diabetes for 30 minutes
    prediction. They reported accuracies of 64.88% for diabetes detection.


    # 12.6.2 Type 2 Diabetes Progression Prediction


    One of our recent studies presented an ML-based framework for early-onset detection
    of T2D and implemented workflow is summarized in Figure 12.3. The OGTT data gathered
    from a clinical trial known as the San Antonio Heart Study (SAHS) were pre-processed,
    remove anomalies and noise. Two novel feature extraction techniques were proposed,
    and the best features were selected through feature selection techniques. Finally,
    the ML framework was optimized for advanced T2D progression prediction. The performance
    of the developed model is discussed and benchmarked'
