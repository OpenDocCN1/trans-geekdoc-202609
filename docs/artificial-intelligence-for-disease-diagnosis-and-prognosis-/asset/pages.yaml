  md: '# 12.1 INTRODUCTION TO DIABETES


    Diabetes is one of the fastest-growing diseases that develops from rising blood
    glucose

    (BG) levels. The human body organ pancreas generates insulin which maintains BG

    levels. The insufficient insulin in the blood or the incapability of the body
    to utilize

    insulin helps to develop diabetes [1]. The consequences of diabetes result in
    an increase

    of healthcare expenditure. The International Diabetes Federation (IDF) estimated

    that about 425 million people lived with diabetes in 2017 worldwide. The global

    summary report of diabetes is adapted from [2]. IDF has also forecasted 629 million

    people are going to develop diabetes by the year 2045.


    The diabetes scenario for the Middle East and North Africa (MENA) region is

    alarming. It is the most vulnerable area for diabetes, with 39 million in 2017,
    which

    will reach 67 million by 2045 with an increment of 78%. Qatar, with 14.1% diabetics

    of the total population, is one of the countries most affected by diabetes. This
    disease

    will worsen in the next few decades due to the increase in the elderly population

    and the high level of obesity. According to the Qatar diabetes survey conducted
    in

    2015, the prevalence of diabetes in Qatar was 17%, and 11–23% had pre-diabetes.

    One-third of diabetic people in Qatar were unaware of their disease. Approximately

    23% of women living in Qatar developed diabetes during their pregnancy. A Qatari

    population-based clinical study [3] conducted to forecast diabetes prevalence
    warned

    that 24% Qatari population would develop diabetes by the year 2050. Qatar’s annual

    healthcare cost was 1.5 billion in 2015, and it is estimated that by 2055 cost
    will reach

    8.4 billion. The Qatar national vision 2030 envisions a healthy population. Early-onset

    detection of diabetes and a proper diabetes management plan might help fulfill
    their

    vision of 2030.


    About $727 billion is spent yearly by diabetes patients, which is equivalent to

    one in every eight dollars spent on healthcare. The people of the working-age
    group

    (20–64 years) are highly affected by diabetes, with 326.5 million people currently

    living with diabetes. Gender-wise, 221 million men and 204 million women developed

    diabetes. The study of IDF also found that there are 280 million diabetic people
    in

    an urban setting, while the figure for rural counterparts is 145 million. The
    number

    of people living with diabetes in the urban setup will reach 472 million by 2045.

    The most alarming part of the study by IDF is that about half of the diabetic

    people are unaware of their disease. Hence, priority should be given to facilitating

    screening, diagnosing, and providing necessary healthcare to diabetes patients.
    People

    who go undiagnosed with diabetes incur a larger expenditure on healthcare than
    those

    diagnosed with diabetes.


    Hyperglycemia and hypoglycemia are two significant hallmarks of diabetes. If

    these two are not appropriately monitored, there is a high risk of developing
    health

    complexities such as cardiovascular diseases. If taking appropriate measures would

    have been possible beforehand, these health complications can be tackled. One
    study

    [4] highlighted that advanced detection of diabetes can lower the risk of health

    complexities by taking necessary intervention in advance. Another critical biomarker

    used for diabetes management is glycated hemoglobin (HbA1c). Another study [5]
    found

    that a low HbA1c test value is correlated with the reduced microvascular difficulties'
