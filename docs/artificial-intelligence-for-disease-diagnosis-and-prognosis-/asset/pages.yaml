    CANCER TREATMENT remains challenging due to heterogeneous drug responses and primary
    or acquired resistance to treatments. Technological advancements have allowed
    cost-effective genetic and transcriptomic profiling of individual cancer patients
    that can be used for better disease classification and personalized treatment.
    However, the use of complex data in clinical practice remains challenging. Artificial
    intelligence (AI) has been used to develop drug sensitivity prediction models,
    raising the opportunity of using it for personalized cancer medicine. Incorporating
    large-scale pharmacogenomic data to the various machine learning (ML) algorithms,
    several models have been developed for preclinical assessment or research purposes.
    Although these advancements clearly show promise, several challenges remain to
    be'
