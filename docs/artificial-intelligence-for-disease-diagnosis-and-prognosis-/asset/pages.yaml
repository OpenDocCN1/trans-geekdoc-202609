    occasional failures in quality remain an issue up to the present time. Scanning
    failure and faulty specimens are the principal sources of quality failures in
    WSI.


    Scanning failures introduce out of focus regions and noises in the image which
    trouble the automated image processing or machine learning algorithms. The WSI
    scanners utilize an optimal number of focus points, selected manually or automatically
    from the tissue surface to convert the specimen into a digital image. However,
    the tissue surface is uneven and focus depth varies from region to region. If
    a focus point is selected from a region having a different depth compared to its
    neighboring regions, the neighboring regions could suffer from focus blur problems.
    Therefore, the WSI sometimes has out of focus regions. Focus error can also be
    introduced due to errors in stage alignment and optical alignment.


    The faulty specimen contains tissue artifacts such as tissue folds, tissue wrinkles,
    tissue tears, air bubbles, tissue dirt, pen marks, and others. Tissue artifacts
    are produced due to the errors that happened while preparing the specimen. Tissue
    folds and air bubbles are the most common artifacts found in pathology. Tissue
    fold is the overlapping of tissue which is usually caused by faulty bleed or fatty
    tissue. The air bubble is air trapped under the tissue cover, produced during
    flotation, and mounting. Such artifacts hide or alter significant features which
    may lead to inaccurate analysis. For example, tissue-fold regions stock more dye
    than normal regions, making them look like tumors.


    Both scanning failures and failures in specimen preparation degrade the image
    quality. However, if the quality degradation is caused by scanning failures such
    as focus problem or noise it can be resolved by rescanning the specimen. But rescanning
    could not help improve the quality of artifact-affected regions. An intelligent
    approach is to detect such artifacts and eliminate them from analysis for a risk-free
    diagnosis. We proposed a practical quality evaluation method for automated analysis
    using WSI. This method detects useless regions of the image (i.e., tissue artifacts
    and'
