    it is black for HER2 and magenta for CEP17 signals. This method utilizes the color
    unmixing technique to separate the dye channels from the RGB image of CISH. The
    U-net was trained to differentiate background, boundary, and inner nucleus pixels
    from a color unmixed blue channel. The output of the U-Net is the probabilities
    of each pixel being background, boundary, or inside the nuclei.


    In the FISH specimen, the crosstalk of dyes was not significant to differentiate
    them. Therefore, the method utilized grayscale extended layer image of nuclei
    channel for nuclei detection. After the U-net segmentation, each candidate is
    scored based on its shape and size feature. Scrutinizing cancerous cells with
    larger nuclei sizes is a common practice in cytopathology and the shape is useful
    to differentiate a complete singular nucleus from partially missing or jointed
    nuclei. The non-singular nucleus as shown in Figure 7.11b,c is not suitable for
    HER2 quantification.


    ![](img/bffdb4a72252285ac92f0fad78a7f104_151_0.png)


