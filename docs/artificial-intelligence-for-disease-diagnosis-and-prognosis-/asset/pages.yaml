    173

    +   10.4 Conclusion ......................................................................
    174


    BREAST CANCER is a disease that develops when the cells in the breast grow out
    of control as a result of abnormalities in the DNA. These aberrant cells build
    up and eventually form a tumor or a tumor that can be felt. Breast cancer is caused
    primarily by advancing age and a family history of the disease. As a result, faster
    detection of breast cancer is required to reduce the number of fatalities linked
    to this disease. As a result of recent discoveries in artificial intelligence,
    deep learning models have made significant gains in computer vision, e-commerce,
    cyber-security, and healthcare because of deep learning. Numerous programs have
    developed effective solutions to aid radiologists in medical image processing.
    Automatic lesion identification and categorization in mammograms, for example,
    are still regarded as critical issues that necessitate a more exact diagnosis
    and study of problematic lesions. This survey looks at several commonly used breast
    cancer datasets, whether they are text or images, as well as related works demonstrating
    previous efforts for breast cancer diagnosis.'
