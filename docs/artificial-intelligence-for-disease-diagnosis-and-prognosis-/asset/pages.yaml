  md: '# # Future Challenges in Artificial Intelligence for Smart Healthcare


    **Faisal Tariq**

    James Watt School of Engineering, University of Glasgow, UK


    **S. M. Riazul Islam**

    Department of Computer Science, University of Huddersfield, Huddersfield, UK


    **Ghita Kouadri Mostefaoui**

    Department of Computer Science, University College London, UK


    # ## CONTENTS


    +   - 17.1 Introduction ............................................ 306

    +   - 17.2 Optimizing AI Architecture for Smart Healthcare ............ 306

    +   - 17.3 AI-Enabled Disease Diagnosis Using Imaging ................. 306

    +   - 17.4 AI in Bioinformatics and Multiomics ........................ 307

    +   - 17.5 AI-Enabled Electronic Health Records ....................... 307

    +   - 17.6 Explainable AI in Healthcare ............................... 307

    +   - 17.7 Security and Privacy Challenges ............................ 308


    ARTIFICIAL INTELLIGENCE (AI) techniques in general have proliferated in all areas
    of healthcare including disease detection, electronic health records, patient
    management, clinical decision making, image analysis, disease prediction and treatment.
    Another rapidly evolving area is personalized medicine research and design. With
    more powerful hardware processing, software agility, networking and communication
    capabilities, AI is becoming a dominant player in smart healthcare systems. Despite
    rapid progress made over the last decade, there exist significant challenges in
    various aspects of technology and biological factors that need to be addressed
    in order to ensure successful use of AI in smart healthcare. In this chapter,
    we will briefly outline the major challenges for AI adoption in various aspects
    of a smart healthcare system.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# ## 17.1 INTRODUCTION


    Artificial Intelligence (AI) research for smart healthcare has been increasing
    rapidly but the actual clinical implementation is still lagging far behind the
    expected level of adoption due to various challenges and limitations [7]. The
    rest of the chapter identifies some key challenges for AI adoption in smart healthcare
    and steps required to potentially transfer these research outcomes into real-life
    clinical practices.


    # ## 17.2 OPTIMIZING AI ARCHITECTURE FOR SMART HEALTHCARE


    The AI system is not optimally or customized for healthcare. A number of challenges
    remain from a technical perspective. For example, most power chips are not specifically
    designed for AI algorithms and thus often lack efficiency. Also, they are very
    expensive which hinders widespread adoption. So, designing low-cost solutions
    is of paramount importance.


    Massive proliferation of the Internet of Things (IoT) in healthcare requires AI
    systems to work in distributed fashion. However, communication and networking
    technology to support the distributed nature of AI algorithms are still not up
    to the mark. Particularly latency, reliability, and ubiquitous availability of
    networks seriously hamper development of distributed AI solutions for IoT-enabled
    healthcare systems [8]. Therefore, a disruptive design is needed that can support
    extreme latency and reliability which is crucial for remote surgery and remote
    patient monitoring.


    # ## 17.3 AI-ENABLED DISEASE DIAGNOSIS USING IMAGING


    AI has been used widely for predicting, detecting, and diagnosing diseases. For
    example, various cancers can be diagnosed from magnetic resonance imaging (MRI),
    computed tomography (CT), and positron emission tomography (PET) scans [4, 7].
    AI algorithms are also used for detecting chest problems from radiographs, Alzheimer
    disease, cardiac disease, and so on.


    While the performance of deep learning algorithms often exceeds the performance
    of expert radiologists and consultant oncologists, they are mostly evaluated in
    the controlled and historical image datasets. Thus the lack of so-called gold
    standard benchmarking via randomized control trials (RCTs) remains a major challenge.
    So, more RCTs need to be carried out to make AI solutions clinically viable. Also,
    the metrics used for AI systems are from traditional AI performance parameters
    (such as specificity and selectivity), which may not translate to effective clinical
    performance. Thus more clinically suitable metrics need to be defined to ensure
    appropriate evaluation of clinical AI systems.


    Generalisation is also a major challenge for imaging. For example, skin cancer
    detection from images is very effective but performance varies widely among various
    ethnic groups due to different skin tones. Thus, a mechanism needs to designed
    to avoid this bias in AI system training datasets.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# 17.4 AI IN BIOINFORMATICS AND MULTIOMICS


    In multiomics analysis (see Chapter 8), multiple datasets are analyzed in an integrated
    manner to uncover the pattern associated with a particular disease. AI-enabled
    multiomics analysis helps us to identify new biomarkers and design targeted therapy.
    To date, researchers have developed many such tools to make multitier datasets
    more effective [6]. Nevertheless, we need to develop more precise and efficient
    tools, especially for clinical practice applications. In this context, effective
    collaborations between molecular biologists, medical practitioners, and computer
    scientists are essential to developing biological knowledge-guided holistic frameworks.


    # 17.5 AI-ENABLED ELECTRONIC HEALTH RECORDS


    The Electronic Health Record (EHR) is a widely adopted mechanism for managing
    patient information and administering treatment/medicine. Traditionally, labor
    intensive and expert dependent phenotyping has been used to make them useful for
    further exploitation as it is really challenging to produce workable analytic
    models for EHR data for further processing. Deep learning has been used for automating
    the process and reducing human expert dependency but has thus far gained limited
    success due to a lack of generalizability of datasets in various institutions
    and settings [9]. Also, finding a true pattern from long-term data is very challenging
    due to the complexity and diversity of various clinical events along with fluctuation
    of data density and irregular sampling problems. Multimodality of data is another
    challenge for automation and makes the task of labeling very complicated. Most
    machine learning (ML) approaches consider neural networks as black box and hence
    lack interpretability, explainability, and transparency of their inner workings,
    which makes it difficult for efficiency benchmarking as well as reusing the system
    in different settings. Transfer learning [2] can be exploited to improve the performance
    of AI-based EHR systems, which can prevent the above-mentioned pitfalls.


    # 17.6 EXPLAINABLE AI IN HEALTHCARE


    AI-driven systems are undoubtedly well-performing. Yet the lack of explainability
    continues to trigger criticism, especially when it comes to its applications in
    healthcare. Explainability “can assist clinicians in evaluating the recommendations
    provided by a system based on their experience and clinical judgment. This allows
    them to make an informed decision whether or not to rely on the system’s recommendations
    and can, consequently, strengthen their trust in the system” [1]. The paradigm
    of explainable AI (XAI) in healthcare is enormous because of its multidimensional
    perspectives. It involves not only the technical work but also medical, ethical,
    legal, and social aspects that indeed need in-depth investigation [1]. Currently,
    some studies on disease diagnosis from explainability context based on generic
    XAI tools such as SHAP and LIME exist [3]. However, healthcare-focused domain-specific
    XAI frameworks need to be developed.'
  merge: -1
  img_proc: true
- pgno: 322
  md: "# 17.7 SECURITY AND PRIVACY CHALLENGES\n\nWhile AI techniques have shown promising\
    \ improvement in disease diagnosis and prognosis, security remains a major challenge.\
    \ As identified in Chapters 15 and 16, there are significant vulnerabilities that\
    \ need addressing. Particularly, many algorithms have been found to have loopholes\
    \ that could be compromised to adversarial attacks. This can be life-threatening\
    \ for some cases. For example, images of benign moles can be misdiagnosed as malignant\
    \ by deliberately adding adversarial noise or even just by introducing a simple\
    \ rotation [5]. Appropriate steps need to be taken to ensure such attacks can\
