    # 15.3.3 Security in WBAN


    Ensuring a high level of security and privacy in WBAN plays a pivotal role in
    adopting this technology on a large scale. The sensitive information must be protected
    during all phases from sensing bio-signals to storage. Any compromise could disclose
    a patient’s health records, and even endanger the patient’s life. WBAN inherits
    many security vulnerabilities and concerns from WSN. These inherited security
    concerns, in addition to the strict resource constraints impose unprecedented
    security requirements, and open the way to further scientific research to meet
    these requirements. The basic security requirements of WBAN are outlined as follows:


    +   * *Confidentiality*: Data must be protected from being disclosed to any unauthorized
    party [10]. Adopting a proper encryption algorithm could protect data during transmission
    and storage phases. Unprotected data can be readily disclosed during transmission
    in open channels by eavesdropping attacks, or when stored in plain format when
    medical servers or nodes got compromised.


    +   * *Integrity*: The attacker can intercept data during the transmission phase
    and delete, inject, or modify the transmitted packet. Confidentiality alone cannot
    protect the data from alteration. Therefore, the receiver must be able to ensure
    that the received data is original and has not been modified on its way [66].'
