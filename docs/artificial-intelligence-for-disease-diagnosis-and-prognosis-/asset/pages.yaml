    # 15.4.3 Attacks on Service Availability


    The most common attacks that impact service availability are DoS attacks, in which
    the adversary disrupts the network''s operation and deprives other entities from
    accessing the required resources. DoS attacks can target different stack layers.
    The most common DoS attacks are discussed below:


    +   • **Jamming Attack**: Jamming attacks target the physical layer. It was first
    discussed in the literature in 1982 [86]. Since then, wireless networks have always
    been vulnerable to jamming attacks. The adversary blocks legitimate communication
    within the network by intentionally interfering with the used frequency, which
    notably decreases the signal-to-interference-plus-noise ratio (SINR). In WBAN,
    jammers can easily degrade network performance, which could delay urgent and critical
    bio-signal messages or medication commands. Moreover, it could deplete the batteries
    of the sensor nodes because of the re-transmission attempts.


    +   • **Tampering Attack**: A tampering attack can occur when the adversary can
    access WBAN nodes physically. The attacker can cause hardware damage or get access
    to critical data, such as encryption keys [54]. Although sensor nodes are usually
    close to the human body, raising awareness among patients about who is authorized
    to handle these sensor nodes can help defeat tampering attacks.


    +   • **Collision Attack**: A collision attack is a data link attack that occurs
    when more than one node transmits at the same time [38]. When an overlapped transmission
    happens, senders enter the re-transmission phase, which depletes the node''s resources
    and degrades the network''s performance. The attacker overlaps the other''s transmission
    intentionally, which results in a collided frame. This causes the cyclic redundancy
    check (CRC) process on the receiver side to fail verifying the received frame
    and discarding it.


    +   • **Selective Forwarding Attack**: It is one of the dropping attacks in which
    malicious or selfish nodes drop received frames instead of forwarding them. In
    a selective forwarding attack, the malicious or the selfish node selectively forward
    some packets and drops others [37]. For example, in extended two-hop star topology
    in WBAN, relay nodes can drop all the frames sourced from a particular node.


    +   • **Exhaustion Attack**: It is a sort of DoS attack in which the attacker
    tries to deplete the resources of the victimized node. For instance, in the denial
    of sleep attack, the victim''s battery becomes depleted significantly [70].'
