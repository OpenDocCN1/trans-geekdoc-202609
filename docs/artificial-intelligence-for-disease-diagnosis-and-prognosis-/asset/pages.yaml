    # 15.5.3 Trust Management Systems


    Cryptographic security measures are imperative to protect WBAN from security breaches
    and privacy violations. However, internal attacks, malicious activities, and selfish
    behavior could not be detected and defeated using this kind of security countermeasures.
    For instance, a sensor node, which passed all cryptographic measures and is regarded
    a legitimate node, could stop relaying frames for others and consequently disrupt
    the network operation. Therefore, a trust relationship between WBAN nodes could
    enhance the overall security and protect the network from malicious activities.
    Therefore, it is necessary to deploy an effective TMS that can continuously monitor
    the behavior of sensor nodes with a view to differentiate between trustworthy
    nodes and untrustworthy ones. The trust relationship can be defined as follows
    Node X trusts node Y if and only if X has adequate confidence in Y''s behavior
    and performance in the future [24]. As with other security schemes, deploying
    a trust management scheme in WBAN is a challenging task [35]. Thus, more consideration
    must be given to the WBAN architecture, resource limitation, communication overhead,
    and'
