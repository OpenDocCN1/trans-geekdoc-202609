    # 6.2 DATASET DESCRIPTIONS


    Collecting datasets for COVID-19 cases is an important task for helping the research
    in support of their diagnosing tasks. The COVIDx dataset [10] and COVIDx-CT [11]
    are presented in this survey to explain their roles in several recent types of
    research in the COVID-19 pandemic.


    # 6.3 COVIDx DATASET


    COVIDx is an open-access benchmark dataset comprising 13,975 CXR images from 13,870
    patient cases, containing the most publicly available COVID-19 positive examples.
    A representative X-ray scan from the COVIDx dataset [10] is shown in Figure 6.2.


    # 6.4 COVIDx-CT DATASET


    It was composed of 104,009 chest CT slices from 1489 patient instances, and it
    is called COVIDx-CT. This CT imaging data is noteworthy since it was produced
    from CT imaging data as shown in Figure 6.3. Their contribution includes cleaning
    and formatting raw data in a format appropriate for benchmarking, as well as giving
    bounding box annotations for body regions inside CT images [11, 12].


