  md: '# 7.9 CONCLUSION


    Existing commercial tools designed to quantify the CISH slides fail to detect
    singular nucleus and include non-singular nucleus in the quantification. They
    also failed to detect reliable CEP17 and HER2 signals and quantified false positives
    in the primary experiment. The proposed includes a limited number of singular
    nuclei which are suitable for quantification and prominent signals with high likelihood
    scores for accurate analysis. The nuclei and signal detection algorithms of the
    proposed system were validated by comparing it with pathologists'' manual nuclei
    and signal selection.


    Currently, the IHC test is performed followed by the manual FISH test as the reflex
    assessment to determine the HER2 grade of a patient. However, the FISH test is
    not performed by the breast pathologist as it requires a long time and more effort.
    This chapter presents an automated HER2 grading system using CISH WSI which requires
    less effort and has a significantly low turnaround time compared to the manual
    FISH counting. Moreover, this quantification does not require any training or
    special work environment making the system suitable for a breast pathologist.
    The system was validated for HER2 quantification using CISH slides by comparing
    it with the pathologist''s manual CISH count and FISH counts. This ensures the
    reliability of the system. In addition, the system was demonstrated for FISH slides
    to confirm its validity. Thus, the proposed system allows the laboratories to
    select the quantification option freely depending on their convenience. Clinically,
    the FISH test is performed only for equivocal cases (IHC 2+), and one major reason
    is its cost. The proposed system can be utilized for routine HER2 assessment to
    verify the IHC results for all invasive BC patients as the IHC test result is
    not conclusive for all cases and proposed quantification is cost and time efficient,
    comparable to the IHC test.


    However, there remain some scopes of improvement in the system. Sometimes, the
    CISH WSI is affected by the HER2 background noise which has similar properties
    to the HER2 signals. The proposed method can detect the presence of the noise
    in the slide but could not separate them from quantification if it occurs inside
    a nucleus. The proposed system was utilized for the cell block CISH images having
    higher thickness than 4 microns. The cell block images exhibit more nuclei overlapping
    than usual. Finding singular nuclei is a challenge for cell block images. Multinucleation
    is another issue faced while quantifying the cell block images. The nuclei detection
    accuracy falls for cell block CISH images. Currently, the system relies on the
    pathologist to select the regions on the H&E slide for quantification. In the
    future, automatic invasive cancer detection and representative region selection
    methods can be integrated with the system to make it more practical. The turnaround
    time could be optimized further to quantify a CISH case within a minute.


