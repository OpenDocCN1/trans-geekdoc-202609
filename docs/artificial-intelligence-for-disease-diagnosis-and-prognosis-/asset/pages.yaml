- pgno: 162
  md: 'treatment in a clinical setting and the use of their expression levels as prognostic
    markers of human cancers is still in its infancy. In this context, this chapter
    reviews the significance of CALD1 expression in brain cancer using a number of
    online bioinformatics platforms and tools. The chapter investigates the expression
    patterns, functions, and prognostic values of CALD1 in brain cancer by accessing
    and analyzing all currently available gene expression data. This systemic review
    will eventually be helpful to gain some insights into whether CALD1 expression
    can be used as a biomarker for the prognosis of brain cancer.


    # 8.1 INTRODUCTION


    In 2020, nearly 24,000 people received a brain cancer diagnosis in the United
    States alone and this cancer is the ninth leading cause of cancer-related mortality.
    Treatment of malignant tumors of the brain has remained a challenge for a long
    time. Detection of brain cancer at an early stage can be highly useful in attempting
    to cure them. Molecular-targeted treatments have recently transformed the therapeutic
    approach for different tumors. To adopt a targeted therapy for the treatment of
    brain cancer patients, it is important to better understand the status of various
    molecular processes including gene expression and methylation of the related genes.
    Various genes such as Fibronectin 1 (FN1), Nicotinamide phosphoribosyltransferase
    (NAMPT), and CALD1 are mutated in brain cancers [1–3]. Whereas FN1 is a well-known
    biomarker for brain cancer diagnosis, NAMPT is not expressed in all the studies.
    In contrast, although CALD1 is overexpressed in all the studies, it is not studied
    comprehensively from a data-driven perspective. Systematic reviews are helpful
    to understand the prognostic role of genes in human cancers and can help enhance
    our realization in targeted therapy [4,5]. In this chapter, we will review the
    roles of CALD1 in brain cancer.


    CALD1 performs as a cytoskeleton-associated protein and regulates cell morphology
    and motility via actin filaments modulation [6]. The transcriptional variance
    of the CALD1 gene consists of 15 exons and is characterized by the recombination
    of alternative splicing modes. Different isoforms of CALD1 are responsible for
    the distinct functions of cell types. Earlier it was reported that CALD1 expression
    is restricted to vessel architectures in glioma [7]. Another study reveals that
    CALD1 transcriptomic level in glioma patient-derived tumor cells is associated
    with glioma grades progression [3]. Liu et al. [8] showed that CALD1 can be considered
    a prognostic biomarker and is correlated with immune infiltrates in gastric cancers.
    The association of CALD1 is also evident in bladder cancer [9].


    Despite a good volume of related research, the application of CALD1-assisted targeted
    therapy is still in the early stages, and the use of its expression level as a
    prognostic marker in brain cancer is an area of active investigation. In this
    chapter, we thoroughly reviewed the biomarker utility and prognostic significance
    of CALD1 in human brain cancer using multiomics analysis. We comprehensively analyzed
    CALD1 expression pattern, various functions, and different prognostic impacts
    on brain cancer using all currently available gene expression data. This multiomics
    analysis'
