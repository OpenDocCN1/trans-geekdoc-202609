- pgno: 1
  md: '# Artificial Intelligence for Disease Diagnosis and Prognosis in Smart Healthcare


    Artificial Intelligence (AI) in general and machine learning (ML) and deep learning
    (DL) in particular and related digital technologies are a couple of fledging paradigms
    that next-generation healthcare services are sprinting towards. These digital
    technologies can transform various aspects of healthcare, leveraging advances
    in computing and communication power. With a new spectrum of business opportunities,
    AI-powered healthcare services will improve the lives of patients, their families,
    and societies. However, the application of AI in the healthcare field requires
    special attention given the direct implication with human life and well-being.
    Rapid progress in AI leads to the possibility of exploiting healthcare data for
    designing practical tools for automated diagnosis of chronic diseases such as
    dementia and diabetes. This book highlights the current research trends in applying
    AI models in various disease diagnoses and prognoses to provide enhanced healthcare
    solutions. The primary audience of the book are postgraduate students and researchers
    in the broad domain of healthcare technologies.'
  merge: -1
  img_proc: true
