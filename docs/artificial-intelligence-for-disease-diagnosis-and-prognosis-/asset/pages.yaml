    # 9.2 BACKGROUND


    Many studies have been conducted on the use of machine learning and speech pattern
    recognition in PD patients. In case of the PD detection using the different types
    of machine learning model such as Support Vector Machine (SVM), K-Nearest Neighbour
    (KNN), Decision Tree (DT), Naïve Bayes (NB), Gaussian Naïve Bayes (GNB), Logistic
    Regression (LR), Random Forest (RF), Linear Discriminant Analysis (LDA), Gradient
    Boosting (GB), and Fuzzy Logic (FL) have been used. Furthermore, the generic system
    of the ML model is shown in Figure 9.1.


    In comparison to the standard principal component analysis (PCA), statistical
    compression techniques have provided much stronger classification of the data
    [16]. In a higher dimensional space sense, PCA can only minimize the dimension
    of the data.


    Deep learning approaches have recently looked promising in clinical image analyses
    and disease identification applications. Later, features can be different types
    based on datasets like motion [17], voice [18], MRI [19], gait and tremor [20],
    handwriting [21], and Archimedes spiral [22]. Acoustic features [23], time frequency
    features [24], recursive feature elimination, and feature importance methods [25]
    were used for deriving the most significant features. The authors [26] conducted
    a feature selection approach called maximum information gain minimum correlation
    (MIGMC) using a similarity network model. Likewise, a computer vision-based study
    has been applied to recognize PD using microphony [27]. In the meantime, Peker
    et al. [28] integrated voice features and complex-valued neural networks to diagnosis
    of PD as well.


    Patients with PD can suffer from speech impairment or vocal cord issues. Therefore,
    the assessment of the voice and speech has received a lot of attention as a way
    to detect and measure the severity of PD symptoms. According to studies [29,30],'
