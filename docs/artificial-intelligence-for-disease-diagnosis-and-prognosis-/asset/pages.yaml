  md: 'likelihood score is selected for quantification. In this way, the proposed
    method ensures that only prominent signals are used for quantification and weak
    as well as false-positive signals are rejected.


    In the case of FISH, the extended focus image of CEP17 and HER2 channels is used
    as the background. The interference between dyes is negligible in FISH, therefore
    the nature of the noise is different here than in CISH. The noise is low intensity
    pixels which are removed by applying a threshold, derived based on the distribution
    of pixel intensities of the grayscale image. After that, partly jointed signals
    are separated. Then each signal is scored based on its pixels’ intensity.


    In the case of HER2 detection. The third step which separates the jointed signals
    were ignored as the HER2 signal may form a cluster of multiple signals. Instead,
    we developed a strategy that identifies HER2 clusters and then counts the number
    of signals in the cluster. The average size of HER2 signals is utilized to identify
    a cluster and then count the number of signals in it.


    # 7.6.3 Signal Quantification for HER2 Scoring and Cancer Grading


    In 2007, ASCO/CAP provided a guideline to determine the HER2 amplification grade,
    realizing the impact of inaccurate HER2 assessment which was updated in 2013 and
    later in 2018. The proposed system followed the ASCO/CAP 2018 guidelines to score
    the HER2 amplification and classify the HER2 cancer grade. At first, the proposed
    method counts HER2 and CEP17 signals for the selected nuclei. Then sorted the
    nuclei in descending order based on the HER2-CEP17 difference, nuclei with less
    than 2 CEP17 or HER2 signals were not included. Then calculated the HER2-to-CEP17
    ratio and average HER2 copy number per nuclei for at least 20 nuclei taking from
    the top of the sorted list. After that, the HER2 grade is determined based on
    the ASCO/CAP chart, given in Table 7.2. For the ISH equivocal cases, an additional
    IHC test is recommended. If the reflex IHC test score is 2+, then ISH quantification
    is repeated using a higher number of nuclei such as 40 or 60. After that, the
    ISH result is considered final. If the reflex IHC score is 0/1+/3+, the result
    of the ISH score is considered resolved by IHC. The decision for providing HER2-targeted
    therapy is based on the HER2 grade of the patient.


    TABLE 7.2 HER2 Grading Criteria


    | Parameter Scores | HER2 Quantification Report Based on ASCO/CAP Guide [2018]
    | HER2 Grade | Cancer |

    |---|---|---|---|

    | HER2/CEP17 ≥ 2.0 Avg. HER2 copy ≥ 4.0 | ISH Positive | Group 1 | |

    | HER2/CEP17 ≥ 2.0 Avg. HER2 copy < 4.0 | ISH equivocal | Group 2 | |

    | HER2/CEP17 < 2.0 Avg. HER2 copy ≥ 6.0 | ISH equivocal | Group 3 | |

    | HER2/CEP17 < 2.0 Avg. HER2 copy ≥ 4.0 and < 6.0 | ISH equivocal | Group 4 |
    |

    | HER2/CEP17 < 2.0 Avg. HER2 copy < 4.0 | ISH Negative | Group 5 | |'
