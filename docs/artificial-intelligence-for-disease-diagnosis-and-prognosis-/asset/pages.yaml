    # 5.1 INTRODUCTION


    Skin is the most extensive organ (around 3.6 kg and 2 square meters for an adult)
    covering the human body as a waterproof shield to protect it from harmful UV lights,
    dangerous chemical substances, extreme temperatures, adventitious viruses, bacteria,
    and potentially dangerous diseases. It also stabilizes the body temperature and
    produces vitamin D from sun light. Skin contains nerves, muscles, and blood and
    lymphatic vessels and is formed by three layers of epidermis, dermis, and subcutaneous
    tissues (also called the hypodermis). Among these three layers, the epidermis
    is the outer layer of the skin with no blood supply and two main functionalities
    of being as a barrier to the environmental infections and regulating the water
    quantity that the body loses as transepidermal water loss (i.e. preventing dehydration).
    Dermis is the inner layer of the skin which is located between the epidermis and
    hypodermis and composed of connective tissue, blood vessels, and hair follicles.
    The sense of touch and heat are provided through this layer. The lowermost layer
    of the skin under the dermis is the hypodermis containing the fat of the body
    whose blood vessels and nerves are larger than those of the dermis.


    Due to the vital role of the skin in protecting the healthy life of people with
    numerous important functions, accurate identification of skin conditions is essential.
    Skin disease/disorder is an atypical skin condition likely to occur in people
    from almost all age ranges. As one of the most common diseases among people, almost
    20% of Americans (one person out of five) are suffering from some type of skin
    disease [14]. Some skin diseases and disorders have external and situational causes
