- pgno: 41
  md: 'This quote from Charles Darwin is the basis of evolutionary learning. It is
    not a particular single algorithm, but a combination of multiple algorithms. Problems
    that cannot be easily solved in polynomial time are solved using evolutionary
    algorithms. Evolutionary algorithms are usually combined with other algorithms
    to find an optimal solution in a shorter time. Without the presence of an evolutionary
    algorithm in such cases, generic algorithms might struggle to find an optimal
    solution within the time limit.


    In simple words, “survival of the fittest” is the main motivation for evolutionary
    algorithms. The steps in evolutionary algorithms are made mimicking the scenario
    of evolution found in nature. It is divided into four basic steps—initialization,
    selection, genetic operators, and termination.


    After initialization, the process of natural selection is a method of killing
    all living beings. Those living beings are considered unfit for their environments.
    Beings that can survive the tough environment are naturally “selected.” These
    beings can sustain a rough environment. Then comes crossover and mutation. In
    nature, living beings usually reproduce and propagate to their descendants. Similarly,
    the algorithms reproduce and propagate. The crossover of the genes produces completely
    new living beings. Similarly, evolutionary algorithms can crossover and create
    a new outcome. Fitness is a measurement using which we can understand how well
    a model is performing. As genes are carried from one generation to another, they
    might deform and change their qualities. This is known as mutation. Depending
    on the environment it can enhance the abilities of the beings. Mutation introduces
    diversity in the beings as well as the algorithm. Due to mutation, a new solution
    to a problem may arise. The main target is to optimize the fitness function so
    that the score for fitness is maximum during termination.


    ![](img/bffdb4a72252285ac92f0fad78a7f104_41_0.png)


    # Figure 2.15 Evolutionary learning.'
