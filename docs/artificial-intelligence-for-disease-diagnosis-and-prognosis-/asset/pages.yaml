- pgno: 7
  md: '# Preface


    Artificial Intelligence (AI) in general and machine learning and deep learning,
    in particular, are becoming increasingly sophisticated and continuously pushing
    the boundary of machine capabilities to be more efficient, more rapid, and low
    cost. In line with this, the potential for AI in healthcare is enormous. Indeed,
    AI and related digital technologies are a couple of fledging paradigms that next-generation
    healthcare services are sprinting towards. These digital technologies can transform
    various aspects of healthcare, leveraging advances in computing and communication
    power. With a new spectrum of business opportunities, AI-powered healthcare services
    will improve the lives of patients, their families and societies. Because of the
    AI-driven paradigm shifts in healthcare approaches, researchers across the globe
    have started to explore various technological solutions. This book provides comprehensive
    coverage of AI models across multiple disease diagnoses and prognoses highlighting
    the recent advances, working principles, and relevant challenges.


    The book introduces a broad perspective of how AI has become an integral part
    of medical research and has contributed to producing new drugs. It helps us to
    understand how AI can better analyze the evolving nature of diseases. In clinical
    practice, the use of multiple medications, called polypharmacy, is a well-known
    problem, which can occur in many situations. For example, new medication administration
    where a proper diagnosis is not noted can result in the unnecessary use of drugs.
    Therefore, drug sensitivity prediction that helps to prevent polypharmacy is crucial
    for quality treatment. The book provides a thorough discussion on how AI approaches
    can be helpful in drug response prediction. Precision medicine is an emerging
    approach to disease treatment and prevention. To personalize treatment and medical
    services, it can exploit people’s unique characteristics, such as their genome
    sequence, microbiome composition, and lifestyle. The book pays adequate attention
    to how better-quality patient care can be ensured using precision medicine. Apart
    from generic AI approaches irrespective of diseases, the book introduces particular
    AI methods and systems for a set of specific diseases, including breast cancer,
    glioblastoma, COVID-19, skin lesions, and Parkinson’s disease. The book also provides
    good tutorial content on data-driven cancer analysis using web-based online tools
    in the context of a specific gene and cancer type.


    Currently, there are few books that cover AI applications in healthcare in general.
    Unlike those, this book is more focused on the diagnosis and prognosis of human
    diseases. Moreover, this book covers a few additional topics, such as privacy
    and security in AI-based healthcare, which are becoming vitally important but
    largely ignored by existing books. As this is a rapidly developing field, we captured
    the'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'latest developments in the area during the last couple of years, making this
    book distinct from the others.


    Since we have presented most of the book’s content in a tutorial manner, it will
    be well-perceived by the general audience with no solid technical background.
    However, in particular, the book will be a good fit for postgraduate students
    and researchers in the broad domain of healthcare technologies. Also, the book
    can be helpful as a reference for BSc/MSc project/thesis works. Overall, we expect
    that this edited book will help readers understand how to achieve enhanced healthcare
    solutions in the era of AI.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Editors


    Ghita Kouadri Mostefaoui, PhD, is currently Associate Professor at the Department
    of Computer Science, University College London (UCL). Her current teaching includes
    programming, computer architecture and software engineering. Before joining UCL,
    Dr. Mostefaoui worked as Software Engineer at the UK Synchrotron where she developed
    the beamlines archiving application. Prior to that, she worked as Research Officer
    at Oxford University, where she contributed to several e-health projects. She
    received her PhD in computer science from both the University of Fribourg, Switzerland
    and Université Pierre et Marie Curie (Paris 6). Dr. Mostefaoui is also a Fellow
    of the Higher Education Academy.


    S. M. Riazul Islam, PhD, is currently a Senior Lecturer in Computer Science at
    the University of Huddersfield, United Kingdom. Before, moving to the UK, he was
    an Assistant Professor at the Department of Computer Science and Engineering,
    Sejong University, South Korea, from 2017 to 2022. His prior affiliations were
    at Inha University as a Postdoctoral Fellow, at Samsung R&D Institute as a Senior
    Engineer, and at the University of Dhaka as an Assistant Professor in EEE. He
    received his PhD in information and communication engineering from Inha University,
    South Korea, in 2012. His research interests include applied AI, machine learning,
    data science, and IoT.


    Faisal Tariq, PhD, is currently Senior Lecturer at the James Watt School of Engineering,
    University of Glasgow, United Kingdom. Prior to his current role, he worked at
    Queen Mary University of London as a lecturer. He received his MSc in engineering
    from Chalmers University of Technology, Sweden and PhD from the Open University,
    UK. His research interests include applications of AI and machine learning (ML)
    in various domains including smart wireless communications, healthcare technology,
    cyber security, and intelligent Internet of Things (IIoT). He received the best
    paper award in IEEE WPMC 2013. He is Associate Editor for IEEE Wireless Communications
    Letters and Editor for the Journal of Networks and Computer Applications. He is
    a senior member of IEEE and Fellow of the Higher Education Academy.'
