    max pooling is applied in the middle of the CNN architecture with the purpose
    of spatial size reduction while average pooling is common as the final layer of
    the network to prevent entirely using FC layers. One example of applying max pooling
    on a sample input with strides of 1 and 2 is illustrated in Figure 5.28.


