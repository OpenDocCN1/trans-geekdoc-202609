    # 16.4 LIMITATION OF EXISTING AI-BASED APPROACHES


    Introducing AI in healthcare systems makes it more efficient, affordable, and
    personalized. ML as a subset of AI plays a huge role in security and privacy of
    physiological data protection. Physiological data handling requires a high level
    of security, privacy, and trust platform. Hence, these issues should be carefully
    taken into account to expand the usage of physiological data in different domains.
    Recently, a number of ML-based solutions have been involved with handling the
    security and privacy features. These solutions are not fully able to maintain
    the users’ security and privacy. As the application area of physiological data
    usage is expanded it become complex to handle the domain. Existing solutions are
    not aware of time complexity, unable to share domain knowledge with others, support
    the black-box model which has a lack of trust to users, while sharing data.


    The traditional ML approach followed a black-box model, which hid all the processes
    and only published the reasoning outcome. So the expert or practitioner could
    not guess which factors were considered for reasoning, and could not justify knowledge
    behind the belief. While performing diagnosis or producing prescriptions, an expert
    system should explain the justification behind the decision. Conventional ML approaches
    use central servers/processors to process data that may cause harm to data security
    and privacy during transmission. The applications in healthcare domains are safety
    critical and contain personal sensitive information. Hence, attention should be
    taken while training the model and doing prediction or classifications.


    # 16.5 MOTIVATION TO OVERCOME THE LIMITATIONS


    To decrease the computational complexity in the ML approach, a distributed approach
    should be followed. The distributed approach such as the federated learning (FL)
    [46] method may be helpful in this regard. The distributed ML approach saves computational
    cost as well as maintains the security and privacy of the client. It does not
    allow the local data for processing in a central server, rather process it locally.
    This decentralization keeps the data in source and maintains security and privacy.


    In order to raise the security, and trust the traditional black-box method need
    to be replace with explainable features which can express the cause and facts
    behind the reasoning. So, explanation is necessary to ensure security and to build
    trust on the platform. Explainable AI (XAI) can be successfully used in this regard
    [47]. A number of XAI commercial platforms are engaged in providing this service.
    Among them IBM, Google, Darwin AI, Flowcast, Imandra, Kybdi, Factmata are most
    noticeable [48].


    XAI- and FL-supported ML models are crucial in the healthcare domain for security
    and privacy protection. XAI and FL are mainly focused on prediction and classification
    in diagnosis, health records, and prediction of diseases. Another group [49] utilized
    FL to minimize the communication and computation costs compared to the traditional
    ML-based approach. This approach is evaluated with real patient'
