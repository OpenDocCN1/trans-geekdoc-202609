    # 11.1 INTRODUCTION


    Traditionally, the pathological analysis starts with a biopsy to remove tissue
    from the body, then the specimen is processed at different stages to place it
    on a transparent glass slide in a life-like state which is then examined under
    the microscope for analysis or to make a diagnostic decision. A pathologist compiles
    the entire specimen manually by adjusting the microscope to select suitable regions
    for examination during which artifact-affected areas are identified and ignored.
    Such manual selection and examination of regions are time-consuming, labor-intensive
    and the assessment may vary among pathologists. Figure 11.1 shows the approach
    of a traditional microscopy-based pathological system. A biopsy specimen goes
    through a series of steps to prepare the glass slide which includes tissue fixation,
    fitting tissue into a cassette, tissue processing, sectioning, and staining. When
    the glass slide specimen is ready, it is observed using a microscope. Pathological
    analysis using a glass slide specimen and microscope involves checking the quality
    of the glass slide specimen, selecting the appropriate region, and compiling the
    observed information. In a microscope-based traditional pathology, all these tasks
    are performed manually by a pathologist.


    In digital pathology, an advanced imaging device called whole slide imaging (WSI)
    scanner is utilized in place of the microscope. The WSI scanner converts the entire
    pathological specimen into a digital image which is observed on a computer screen
    for analysis and diagnosis using special software. The WSI scanner is considered
    the key to digital pathology. WSI system enables inch-perfect conversion of pathology
    specimens into a digital image, rapid transmission of the digital specimen for
    consultations, lossless preservation of the specimen, and user-friendly examination
    of the specimen on a digital display. Moreover, the incorporation of the digital
    specimen to pathology allows the application of pattern recognition and image
    analysis techniques for automated analysis and diagnosis. However, the quality
    of analysis using automated methods highly depends on the quality of the digital
    specimen which can be affected by different artifacts. The digital specimen includes
    the artifact contained in the glass slide, plus the artifacts generated while
    converting the glass slide to the digital image. Artifacts such as tissue fold
    and focus blur trouble the automated tools and thus mislead the analysis. In traditional
    pathology, artifacts are detected and ignored'
