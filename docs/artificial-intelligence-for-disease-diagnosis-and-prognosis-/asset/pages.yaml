    # 11.3.2 Tissue Artifacts


    The glass slide specimen preparation is a lengthy process that starts with surgical
    biopsy followed by fixation, tissue processing, embedding, sectioning, and staining
    and ends with placing a coverslip on the top of the slide. Tissue fixation is
    done soon after removing the tissue after surgery to preserve the tissue in its
    original state. Usually, 10% buffered formalin is used as a fixative to prevent
    decay due to autolysis and putrefaction. Tissue fixation is crucial as the investigation
    of molecules or tissue structure depends on the accurate preservation of the specimen.
    After fixation, the specimen is cut using a scalpel to fit it into a cassette
    where it is stored until processed. Tissue processing is the next step, which
    is a combination of three takes dehydration, cleaning, and embedding. Dehydration
    is performed to remove water and formalin from the tissue by immersing the specimen
    in alcohol. After that xylene is used to remove the alcohol used earlier. This
    allows the infiltration with paraffin wax and the tissue is enclosed by the paraffin
    wax. Then the tissue block is embedded into a supporting medium. After embedding
    the tissue is cut into sections and placed on slides. Before sectioning, the wax
    is removed to expose the tissue. Then the tissue is sectioned into thin slices
    of 4–5 µm using a microtome or an automatic sectioning machine and placed on a
    glass slide. After that, the slide is stained and protected with a coverslip to
    prevent it from drying out. Faults in the preparation cause artifacts'
