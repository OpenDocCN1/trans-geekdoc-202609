    # 11.5 REVIEW OF EXISTING ARTIFACT DETECTION METHODS


    Several artifact detection methods have been developed for digital pathology.
    Most of the methods detect either tissue artifacts or scanning artifacts while
    a few methods incorporate both types of artifact detection. Again, most of the
    tissue artifact detection methods only detected the tissue-fold artifacts considering
    it as the only major tissue artifact. Methods for detecting air bubble, dust,
    ink mark, hemorrhage, and crush artifacts are very few. On the other hand, most
    of the papers that identified the scanning issues for quality evaluation considered
    focus blur as the major artifact and detected them. In this chapter, the artifact-detection
    methods are reviewed by categorizing them into three groups based on the used
    technology as image enhancement-based approach, machine learning approach, and
    others. Methods that modify or enhance the image information for detecting the
    artifacts are considered image enhancement-based approaches. Machine learning-based
    artifact detection methods utilize some representative features extracted from
    the artifact and use them to teach a model to differentiate artifacts from normal
    tissue areas. The machine learning methods can be'
