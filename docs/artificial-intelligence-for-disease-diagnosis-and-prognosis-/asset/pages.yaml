    # 7.4 ARCHITECTURE OF THE AUTOMATED CANCER GRADING SYSTEM


    The proposed automatic HER2 grading system utilizes the bright field dual-color
    CISH WSI for HER2 quantification as CISH offers more user friendly and practical
    features. The automated cancer grading system can be described in three parts:
    Specimen preparation, WSI acquisition, and automated HER2 scoring as illustrated
    in Figure 7.8. Automated HER2 cancer grading can be affected by multiple sources
    such as the quality of the glass slide specimen, quality of the WSI, the color
    of the WSI, and location of the tumor used for the quantification.


