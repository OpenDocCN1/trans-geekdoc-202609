- pgno: 72
  md: '# 4.12 CLINICALLY RELEVANT PREDICTION MODELS


    Because pharmacogenomic data for cell lines can be relatively easily obtained,
    most studies have used this type of data to develop prediction models. Although
    cell line models are widely used to study several aspects of cancer, they may
    not always represent cancer patients well. Therefore, the model developed based
    on cell line data may perform poorly with the primary clinical materials. To overcome
    such limitations, recent studies have used clinically relevant PDXs [46] or three-dimensional
    organoid culture models [45] to develop ML models. These studies have developed
    clinically relevant prediction models that increase the probability of successful
    clinical applications.


    # 4.13 LIMITATIONS IN CURRENT APPROACHES


    Although we have experienced rapid development in computational power, we still
    have a limited amount of clinically relevant pharmacogenomic data to develop a
    drug sensitivity prediction model. Most current studies have used pharmacogenomic
    data from cell lines. While cell line data are useful for hypothesis generation,
    they do not recapitulate clinical phenotypes. In humans, tumors form in a multicellular
    environment and interact with surrounding cells. A model that does not consider
    possible interactions of other cells with tumor cells may not achieve clinical
    level accuracy. To overcome such limitations, recently several studies have used
    PDXs and tumor organoids [45, 46]. Furthermore, several attempts have been taken
    to develop PDX repositories that provide clinically relevant pharmacogenomic data
    [23–25, 99].


    Any genetic or epigenetic changes may reflect the baseline gene expression level
    in cancer cells. Therefore, the use of baseline gene expression data are useful
    to understand cancer biology. However, during drug treatment, although cells can
    hold similar genetic or epigenetic features, the gene expression pattern can become
    deregulated and that in turn can alter drug sensitivity. Currently, the majority
    of pharmacogenomic datasets provide base gene expression data that has been widely
    used to develop prediction models [10, 14, 16, 52]. Only a few studies have provided
    insight into drug perturbations [37, 88]. Therefore, in the future, we may need
    a large amount of clinically relevant drug perturbation data. For example, data
    about how a patient responded to a specific drug in the clinic and how the gene
    expression pattern has been changed after drug treatment would provide valuable
    information for future predictive models.


    The computational challenges in the implementation of AI in precision medicine
    have been highlighted previously, including medical data processing, environmental
    data collection, clinical text, and data processing [9, 100, 101]. Besides those
    limitations, the incorporation of pharmacogenomic data in the clinical decision
    system can be challenging. Furthermore, as discussed partly above, the development
    of a prediction model in which each step can be explained remains challenging.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 4.14 CONCLUSION


    Drug sensitivity prediction for any single drug or a combination of drugs is challenging
    but has the utmost clinical interest in order to improve the quality of treatment
    by reducing the unnecessary use of drugs, particularly for cancer treatment. Although
    recent studies in the development of predictive models have displayed promise,
    a large amount of work still needs to be done for clinical applications. Long-term
    clinical trials to collect clinically relevant pharmacogenomic data for specific
    drugs could be useful but would be very expensive. Perhaps pharmacogenomic data
    from cell lines, PDXs, tumor organoids, and primary patients can be incorporated
    to develop clinically relevant models. Therefore, despite very promising inventions
    in drug sensitivity prediction models, we need to put more effort in generating
    pharmacogenomic data from primary patients to develop clinically applicable models.


