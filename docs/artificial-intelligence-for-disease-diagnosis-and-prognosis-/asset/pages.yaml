    # 3.3 ROLE OF ARTIFICIAL INTELLIGENCE AND MACHINE LEARNING IN PRECISION MEDICINE


    AI applications in medicine are categorized into virtual and physical divisions.
    Whereas the virtual branch involves machine learning (ML) and deep learning (DL),
    the physical branch refers to medical devices, sophisticated robots, and other
    physical objects [19]. Here we focus on the role of the virtual branch in precision
    medicine because its importance and utility in precision medicine are enormous,
    where some even phrased as “there is no precision medicine without AI.” After
    all, these approaches use the cognitive capabilities of physicians on a new scale
    [20]. Furthermore, AI techniques are changing the way physicians make diagnostic
    and treatment decisions. Therefore, physicians in everyday practice are motivated
    to look at advances and innovations spreading over faster than ever using disruptive
    AI tools and techniques and exponential increase of healthcare data [21]. Some
    areas are underlined here, where applications of ML and DL have been widely used.


    +   1. Biomedical data processing: Electronic health records (EHRs) and other
    health systems generate clinical data in structured and unstructured formats.
    It is straightforward to incorporate in the clinical workflow; however, the unstructured
    data is more challenging to process, obtaining meaningful information that might
    help solve clinical questions about patient health conditions, clinical reasoning,
    and inferencing. Traditionally, clinically relevant information from clinical
    documents is extracted through manual methods with the support of clinical domain
    experts, which creates hurdles in terms of scalability and costs. ML algorithms
    have been used to ease the human job on manual assessment of unstructured clinical
    and scientific data. In the last few years, ML algorithms, especially DL, have
    made several successes in the text mining domain, including text annotations,
    classification, clustering, summarization, named entity recognition, and many
    others. The modern DL algorithms armed with word embeddings took over traditional
    ML or shallow neural network models. The latest state-of-the-art model called
    BERT—Bidirectional Encoder Representations from Transformers is considered a big
    success in text processing for a wide range of tasks, such as question answering,
    text quality assessment, and language inference [22]. The BERT model''s exhibition
    of higher accuracy on different text processing tasks and other variations like
    BioBERT encourages'
