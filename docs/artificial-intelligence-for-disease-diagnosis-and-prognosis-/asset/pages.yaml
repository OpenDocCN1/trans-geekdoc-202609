  md: '![](img/bffdb4a72252285ac92f0fad78a7f104_66_0.png)


    Figure 4.4 Random forest model. In a random forest model, a relatively large dataset
    is divided into several small datasets. This process is called bootstrapping and
    bagging. Then small datasets are used to develop the decision trees. The test
    dataset is applied on all decision trees and the predicted values are aggregated
    to make the final prediction.


    Several initial studies developed sparse linear regression models to predict drug
    sensitivity. These studies usually applied ridge regression [42, 45, 47] and elastic
    net algorithms [10, 14, 16, 32]. Although the performance of those models was
    poorly generalized, those studies generated a massive amount of pharmacogenomic
    data that were useful for follow-up studies.


    # 4.7 RANDOM FOREST AND KERNEL FUNCTIONS IN DRUG SENSITIVITY PREDICTION


    Decision trees are popular supervised learning algorithms and are widely used
    for clinical decision analysis [63]. In a decision tree, model data are taken
    in the root node of the tree and, according to a test rule, keep growing until
    a decision can be drawn [64]. The beauty of a decision tree is that each step
    can be understood, interpreted, and visualized. A random forest uses a group of
    decision trees to solve relatively complex problems. In this method, data are
    randomly divided into small sets and then applied to decision trees (Figure 4.4).
    Prediction is made by the most chosen value (classification) or by the mean/median
    value (regression) from the decision of all trees. This process eventually increases
    the prediction accuracy [65].


    Stetson et al. used pharmacogenomic data from the Genomics of Drug Sensitivity
    in Cancer (GDSC), Cancer Cell Line Encyclopedia (CCLE), and the National Cancer
    Institute (NCI) datasets and used 1000 selected genes to develop and compare ML
    models [33]. They found that the random forest model outperforms several other'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'models including elastic net and kernel functions. While nonlinear models may
    be relatively better than linear models, particularly for classification problems,
    they can display poor performance with regressions.


    The kernel functions can handle not only classification and regression problems
    for supervised learning but also can be applied to unsupervised learning. A wide
    range of functions, such as linear, nonlinear, sigmoid, radial, and polynomial,
    can be used to transform data to a high-dimensional space. Support vector machines
    (SVMs) are among the most popular kernel-based algorithms to be applied in drug
    sensitivity prediction [49]. Bayesian multitask multiple kernel learning (BM-MKL
    or BMT-MKL) is another such type of algorithm that has shown promising outcomes
    in an NCI-DREAM challenge summarized by Costello et al. [48].


    # ## 4.8 MATRIX FACTORIZATION ALGORITHM FOR DRUG SENSITIVITY PREDICTION


    Matrix factorization (MF) is one of the widely used unsupervised learning algorithms
    for dimensionality reduction but can also be used for supervised learning problems.
    MF is a popular method in e-commerce recommender systems [66]. The beauty of MF
    is that it can process high-dimensional data with missing information. MF decomposes
    the input matrix into lower-dimensional matrices that have the same number of
    latent factors [9]. The drawback of the system is that each specific model needs
    to be customized to serve a specific purpose. Using a modified recommender system,
    Suphavalai et al. developed Cancer Drug Response prediction using a Recommender
    System (CaDRReS) [53]. CaDRReS calculates cell line features (CCLE/GDSC data)
    using gene expression information, correlates the drug sensitivity information,
    and then factorizes into cell line and drug matrices. Besides drug sensitivity
    prediction, the method can be applied to explore the mechanisms of drug action,
    the interaction between drug and signaling pathways, and subtypes of cell lines
    or patients [53].


    # ## 4.9 USE OF NEURAL NETWORK ALGORITHMS TO PREDICT DRUG SENSITIVITY


    DL algorithms are a subtype of ML algorithms in which the backbone is developed
    by biologically inspired neural network algorithms. The algorithm can autonomously
    learn classification or regression problems from suitably labeled data. The algorithm
    applies nonlinear activation to process input data through hidden layers by forming
    a complex neural network. This process allows it to learn complex functions and
    at the same time amplifies important features to minimize noise. Figure 4.5 summarizes
    a simple DL model where training data are processed through a hidden layer and
    then a dropout layer. It is not mandatory to introduce a dropout layer, but a
    random dropout layer can help the model to learn important features and to reduce
    overfitting. The algorithm minimizes a cost function by defining values of weights
    and biases for each layer. Usually, gradient descent is used to find the minima,
    where gradients are determined by the chain rule of derivatives (also known as
    backpropagation) [67]. Such types of algorithms are widely used for image classification
    and have also'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'recently been used for drug sensitivity prediction [68]. However, the classification
    of images is an easier task due to the availability of data, whereas currently,
    the availability of pharmacogenomic data is relatively limited when compared to
    the number of dimensions of such type of data. Therefore, the development of a
    DL model using pharmacogenomic data remains challenging [9]. Initial studies applied
    feedforward neural networks to develop a drug sensitivity prediction model [52,
    54]. Instead of using all available or transcriptomic features, those studies
    reduced the number of features by selecting important genomic [52] or transcriptomic
    [54] variables. Follow-up studies have applied a similar approach to building
    deep neural network (DNN) models and have shown that those models perform better
    than classical ML models [55, 57].


    ![](img/bffdb4a72252285ac92f0fad78a7f104_68_0.png)


    Figure 4.5 Deep neural network. In a DNN model, every node of the input layer
    is fully connected to the nodes of the hidden layer. A dropout layer can be included
    to remove some nodes randomly.


    Convolutional neural networks (CNNs) are yet another domain of neural networks
    that are useful to find important features. The method applies several convolution
    and pooling steps from which it learns these features [67]. CNNs are widely used
    for image classification but recently have been used for drug sensitivity prediction.
    The Cancer Drug Response Profile scan (CDRscan) applied convolutions separately
    to molecular fingerprints of drugs and genomic fingerprints of cell lines and
    then merged the output results to develop a prediction model [59]. Using pharmacogenomic
    data from GDSC, particularly transcriptomic, somatic mutations and copy number
    variations, a similar model was built by Sharifi-Noghabi et al. and then validated
    by PDXs and primary patient materials [56]. Due to the nature of pooling important
    features during learning [67], models developed by CNN displayed considerably
    higher robustness and generalizability.


    To develop a general model of therapy response prediction, chemical and structural
    information of multiple drugs is required to be incorporated during training.
    The two-dimensional molecular fingerprint is widely used for this purpose, in
    which partial structures of the molecules are determined and converted into a
    binary representation. The extended-connectivity fingerprint (ECFP) algorithm
    is a popular algorithm for determining two-dimensional molecular fingerprints
    [69]. The 3-dimensional structural information can also be collected in a similar
    fashion by a 3-dimensional'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'fingerprint descriptor. Such types of converted information can be used as
    the input to a neural network. Weininger developed the Simplified Molecular-Input
    Line-Entry System (SMILES), a linear notation method [70] that can be used in
    CNN. Molecular graphs are a nonstructural way of storing atomic features from
    small-molecule drug structures with multiple atoms and bonds [71]. Because conventional
    CNNs are usually used for structural data, a modified CNN known as graph convolutional
    networks (GCN) has been developed to use molecular graphs [72]. Nguyen et al.
    used GCN to extract important molecular features from small-molecule drugs, combined
    that data with the CNN-extracted genomic features, and fed it into the fully connected
    feed-forward neural network [62]. Use of graph representation of drugs seems to
    provide improved predictive performance over SMILES [60].


    Although DL models displayed a promise in the prediction of drug sensitivity,
    model interpretation remains challenging due to the difficulties in understanding
    the model''s internal rationality for a prediction. By incorporating genomic and
    transcriptomic data with the prior knowledge of signaling pathways and cellular
    architecture, Kuenzi et al. developed a visible neural network model (VNN) that
    can be relatively easily explained [40]. The model processes the chemical information
    of drugs separately and later combines it with the embedded genotype data. Although
    the model developed using VNN displayed similar or slightly better predictive
    performance, it holds the distinction of being easily explainable.


    # 4.10 DIMENSIONALITY REDUCTION PRIOR TO DRUG SENSITIVITY PREDICTION: AUTOENCODER
    AND VARIATIONAL AUTOENCODER


    Because pharmacogenomic data contains many features in comparison to sample numbers,
    an autoencoder has been used to reduce the dimension of features. An autoencoder
    is used to map high-dimensional data onto a lower-dimensional latent space in
    which the algorithm learns latent variables from the observed data. It contains
    two different types of layers: An encoding layer that projects the high-dimensional
    data to the lower-dimensional latent space and a decoding layer that decodes data
    from the latent space (Figure 4.6a). The loss function is calculated as the least
    square difference between input and decoded data. An autoencoder can take unlabeled
    data to develop the model, which can be used to reduce features that later can
    be used for drug sensitivity prediction [39, 73]. An improved form of an autoencoder
    (known as a variational autoencoder or VAE) in which the deterministic bottleneck
    layer has been replaced with stochastic sampling vectors (mean and standard deviation)
    (Figure 4.6b). Due to the stochastic nature of the sampling vector, the loss function
    can be updated by adding a Kullback-Leibler (KL) divergence term. This reparameterization
    trick allows the algorithm for backpropagation optimization [74].


    Chiu et al. applied an autoencoder on unlabeled mutation and gene expression data
    from TCGA (The Cancer Genome Atlas) to develop a model that can be used to determine
    the latent variables from labeled data from CCLE (Cancer Cell Line Encyclopedia)
    [38]. The latent variables were used to develop a feedforward neural network to
    perform the drug sensitivity prediction. Due to the abundance of unlabeled data
    compared to labeled pharmacogenomic data, the implementation of an autoencoder'
  merge: -1
  img_proc: true
- pgno: 70
  md: '![](img/bffdb4a72252285ac92f0fad78a7f104_70_0.png)


    Figure 4.6 Schematic representation of autoencoders. (a) In an autoencoder, latent
    variables are determined by reducing dimensions, and then data are decoded from
    the latent variables. (b) In a VAE, similar encoding/decoding processes are used
    unless the latent variables are coded by the mean and standard deviation.


    prior to the development of a prediction model increases prediction performance.
    Besides the autoencoder, VAE has also been applied to develop a monotherapy prediction
    model. Dincer et al. used gene expression data from acute myeloid leukemia (AML)
    patients to determine an eight-dimensional latent representation using a VAE and
    then a lasso model for the final drug sensitivity prediction [61]. A similar model
    was also described in which drug-induced gene expression perturbation was used
    in a VAE [37]. These are classical examples where a simple linear model can be
    developed for prediction from high-dimensional complex data. The use of drug-induced
    gene expression perturbation can be a viable approach for the reduction of features
    and can provide useful insights in determining pathways that regulate drug response
    [58].


    # 4.11 DRUG COMBINATION PREDICTIONS


    Although most studies have focused on the development of monotherapy prediction,
    the use of monotherapy for cancer treatment is very limited in real life. Due
    to the complex nature of the disease, most cancers are treated with a combination
    of drugs. Therefore, the development of an algorithm that can suggest a combination
    of therapies, or whether a therapeutic combination will display an enhanced efficacy
    (also known as synergy), will have a great impact in clinical settings. Table
    4.3 summarizes notable studies that have attempted to develop methods for drug
    combination prediction.


    The development of an ideal model to determine drug combinations required a large
    amount of genetic/transcriptomic information from biological samples, drug combination
    response, and structural information of the drug. As summarized in Table 4.3,
    several used a limited amount of published or publicly available data'
  merge: -1
  img_proc: true
