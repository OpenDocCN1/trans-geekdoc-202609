  md: '![](img/bffdb4a72252285ac92f0fad78a7f104_106_0.png)


    Figure 5.23 Three main steps that a volume (input image or a feature map) passes
    in a CONV layer [8].


    ![](img/bffdb4a72252285ac92f0fad78a7f104_106_1.png)


    Figure 5.24 Visual presentation of the 2D convolution operation [27].


    The initial depth of the inputs equals the number of the channels in the image
    (e.g. three when the images are RGB images). The depth in the deeper CONV layers
    of the network is the number of filters in the previous layer. In the first step,
    the number of filters and their kernel sizes are determined each of which is convolved
    with the input volume and in the second step. One example for convolution operation
    is illustrated in Figure 5.24. Here, \(W_{j,i}\) is the filter with the kernel
    size of \(3 \times 3\), where \(j\) and \(i\) are the filter and layer number,
    respectively. This small window moves over a 2D grid of an image or a feature
    map from left to right and up to down. The step size according which the window
    is moving across the image is determined by *stride* step size which is normally
    either 1 (moving one pixel at a time) or 2 (skip two pixels at a time). In each
    movement, the elements of the window are multiplied to the corresponding elements
    of the grid. Convolution operation is completed by summing up these element-wise
    multiplication values to achieve a scalar value. All the obtained values from
    convolution result in another 2D grid called feature map/activation map as shown
    in the third step of Figure 5.23. Once all the \(K\) filters are applied to the
    input volume, \(K\) 2D activation maps are achieved which are stacked along the
    depth dimension as the final output volume (illustrated in Figure 5.25).


    It should be mentioned that zero-padding is applied along the borders of the input
    to keep the original image size so that the output volume size matches that of
    the input (shown in Figure 5.26). Assume I, F, S, and P are the input square image
    size (one dimension), filter kernel size, stride value, and the amount of zero-padding,
    respectively. The following equation is required to be integer to have a valid
    CONV layer:


    ```

    ((I – F + 2P)/S) + 1 (5.10)

    ```'
