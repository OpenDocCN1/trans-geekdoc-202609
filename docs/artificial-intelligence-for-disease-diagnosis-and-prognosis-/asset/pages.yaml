  md: '+   3. Proximity-based security schemes: In proximity schemes, the secret key
    can be extracted by taking advantage of the small-scale fading variations and
    a third-party radio-frequency (RF) source [55].


    **Cryptographic security schemes.** These vary depending on the key types, and
    can be classified into the following categories.


    +   1. Public key signature schemes: The public key cryptography (PKC) is a robust
    security approach to provide authentication. It could be mathematically implemented
    as an integer factorization problem like RSA or a discrete logarithmic problem
    like in elliptic curve cryptography (ECC). However, both approaches are still
    regarded as greedy in consuming the limited resources of WBAN. Authors [87] proposed
    a hybrid multiplication method to reduce the memory access rate, which results
    in speeding up the process by around seven times. Moreover, an ECC-PKC library
    has been introduced to be used for WSN [87].


    +   2. ID-based signature schemes: It is a kind of PKC where the public key includes
    identity information, and the private key is generated by a trusted third party
    (TTP), namely, private key generator (PKG). ID-PKC schemes do not meet all the
    security requirements of WBAN [13, 36, 93]. They are vulnerable to key escrow
    problems because of the existing TTP. Moreover, as PKG has all the private keys,
    it can easily decrypt all the exchanged messages and forge any signature.


    +   3. Certificateless signature schemes: This is a kind of PKC that has been
    introduced to reduce the resource consumption of PKC and the key escrow problem
    of ID-PKC [4]. The inborn key escrow problem in ID-PKC has been resolved by introducing
    a key generator center (KGC), which holds a master key instead of the private
    keys. The KGC is responsible for sending a partial private key (DA) to nodes,
    which in turn can create their private keys. Many remote authentication schemes
    between the hub and the application providers have been introduced in the literature
    [39, 71, 76, 91, 95]. However, further research is still going on to produce a
    security scheme that meets all the security requirements and is not vulnerable
    to attacks.


    +   4. Symmetric-based schemes: One group [50] proposed a symmetric-based authentication
    scheme using a pre-shared key and unique IDs to achieve mutual authentication,
    unlinkability, and forward secrecy security requirements. However, the adversary
    can take advantage of the unmasked value (\(\gamma\)) to link two sessions to
    the same node. Therefore, a modification has been suggested [41] to fulfill the
    unlinkability and forward secrecy. However, this security scheme still has key
    escrow problem because the hub still has all the IDs in addition to the master
    key.'
