  md: 'various precision medicine applications like automatic concept extraction for
    cancer, genomics, and precision oncology [23].


    +   2. **Phenotype discovery**: The biological process may involve a related set
    of genes—known as pathways that play critical roles in regulating various behavior.
    For example, Hippo pathways include genes that regulate cell proliferation and
    growth in living organisms [24]. The Hippo pathway was initially postulated to
    have a key role in the egregious overgrowth of cells in cancer. However, recently,
    the postulate has been validated by discovering mutations and altered expressions
    of a subset of Hippo pathway genes in human cancers [25]. These analyses are based
    on enhanced statistical methods, such as GSEA, to find the association of different
    clinical characteristics into the expression level of a subset of gene sets in
    the Hippo pathway. GSEA is one of the key computational methods that allow whether
    an a priori defined set of genes shows statistically significant, concordant differences
    between two biological states (e.g., phenotypes) [17]. For example, comparing
    the expression status of genes in a particular pathway associated with stage-I
    compared to advanced stage-IV cancer, GSEA determines and ranks these genes to
    be expressed (either higher or lower).


    +   3. **Image analysis**: Medical images are a source of information necessary
    for disease diagnosis and treatment and due to the patient-specific nature, they
    can be an important component for precision medicine [26]. Various technologies
    have been developed for image information processing, such as photorealistic visualization
    of images with cinematic rendering, artificial agents for in-depth image understanding,
    and patient-specific computational models with enhanced predictive capabilities
    that enables precision medicine to step forward. Also, AI and DL can add value
    and speed to a pathologist’s diagnosis in the domain of digital pathology to learn
    complex morphological patterns in various diagnostic or prognostic tasks [27].


    +   4. **Next-generation sequencing**: The improvements in NGS to generate hundreds
    of millions to multigigabit levels of DNA sequence has significantly expanded
    the possibilities for patient care and research for diagnostic genome sequencing
    for personalized healthcare and precision medicine [28]. With the integration
    of this powerful genome testing technology into standards of patient care across
    multiple specialties, the role of professionals like clinicians will broaden.
    The NGS technology supports the very claim of precision medicine—the right treatment
    to the right patient at the right time, by allowing the rapid and accurate sequencing
    of many genes at once [29]. Most of the steps of the NGS bioinformatics pipeline,
    like sequencing alignment, variant calling, variant filtering, variant annotation,
    and prioritization, for performing appropriate analyses, involves AI and ML in
    processing and integrating diverse datasets for enhanced diagnosis and treatment
    decisions, especially in case of rare diseases [30]. Some of the examples using
    DL for variant calling are DeepVariant [31] that uses a deep convolutional neural
    network (CNN) for variant calling from'
