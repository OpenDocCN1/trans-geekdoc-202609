    improvement of computational power and the development of advanced algorithms.
    Although initial studies primarily focused on sparse linear regression models,
    later studies introduced more sophisticated models. Figure 4.2 presents a timeline
    graph of different models that have been introduced in drug sensitivity prediction
    studies, and it is clear that current studies are more biased toward deep neural
    network architecture.'
