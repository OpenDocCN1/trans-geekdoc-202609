    # 11.4 CHALLENGES FOR AUTOMATED ANALYSIS DUE TO ARTIFACTS


    In digital pathology, analysis is performed by examining the WSI using automated
    methods. The accuracy of the analysis depends on how well the method extracts
    morphological features or detects the biomarkers which require an artifact-free
    quality WSI. The analysis could be misleading and unproductive if the WSI contains
    artifacts, and such areas are included in the analysis. Markiefka et al. performed
    the diagnosis of deep learning-based classification method. In the experiment,
    they have intentionally added artifacts in the test set to show that the performance
    of the deep learning model degrades significantly in the presence of artifacts
    in WSI. [20] In a similar investigation, we have generated digitally degraded
    images by adding focus blur and noise. The focus blur artifact was produced by
    using a Gaussian blur filter where the standard deviation was varied from 2 to
    14 with a step size of 2. The noise artifact was generated by varying the standard
    deviation of the Gaussian noise filter from 2 to 14 with a step size of 2. We
    also produced excessive sharp images by using unsharp masking, the characteristic
    of the Gaussian filter was the same. After that these artifact-affected images
    were utilized for molecular analysis and morphological analysis. The morphological
    analysis identified a significant difference in the texture features between the
    original image and the digitally blurred image. In the molecular analysis, the
    HER2 (human epidermal growth factor receptor 2) detection and nuclei detection
    methods failed to detect the HER2 gene from blurry, noisy, and excessively sharp
    images where it successfully detected the gene from the original images, illustrated
