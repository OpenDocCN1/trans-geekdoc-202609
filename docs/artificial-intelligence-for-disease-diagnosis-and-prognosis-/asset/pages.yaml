    # 13.1 INTRODUCTION


    Cyber-security is the most critical sort of security that individuals must be
    concerned about in the digital age. Electronic information is stored and organized
    in banks, schools, hospitals, corporations, governments, and practically every
    other modern institution one can think of. This implies that anyone with a computer,
    an internet connection, and profound computer knowledge may view, steal, or manipulate
    all of your most sensitive information, including credit card numbers and checking
    accounts, medical records, and phone bills. Hacking is the term used to describe
    the acts aimed at compromising digital devices like computers, cellphones, tablets,
    and even entire networks; and the more current concept of hacking revolves around
    the difficulty of understanding and manipulating technology [2]. Computer infections
    generated by hackers cost losses of about $55 billion at various organisations,
    nearly doubling the harm they caused in 2002 (https://www.trustwave.com). In modern
    times, less human interference and more interaction are allowed by utilizing underlying
    technologies such as pervasive computing, communication capabilities, internet
    protocols, and apps. Therefore, a new technology combining all the above facilities
    called IoT turned our way of life from traditional to smart. Various protocols
    are required to identify desired tasks by the IoT devices, such as spoken language
    instead of the structure exchanges of messages. Moreover, it is essential to determine
    the appropriate limitations that comply with each device while performing multiple
    parallel tasks [3]. As a result, confirming the secrecy of an IoT device is critical
    for user data security.


    Skin lesions are serious conditions that affect a large portion of people all
    over the world. Early diagnosis of melanoma using noninvasive dermatoscopy methods
    boosts the survival percentage substantially [4]. And it is one of the most common
    cancers in the white population, hence computer-assisted approaches for classifying
    skin lesions based on dermoscopic images are of great interest. Skin cancer has
    the highest chance of occurrence with a substantial malignancy risk among all
    cancer forms. Deep learning has been recently introduced in the fields of skin
    lesion segmentation and classification.


    Melanoma has a greater number of fatalities than non-melanoma skin cancer. Therefore,
    discriminating between cancerous and non-cancerous melanoma skin images has received
    a lot of attention nowadays [5]. In 2008, a total of 8694 patients’ skin excisions
    were studied. Basal cell cancer (BCC) had 72.7% PPV (Positive Predictive Value),
    squamous cell carcinoma (SCC) had 49.4% PPV, and cutaneous melanoma (CM) had 33.3%
    PPV. The sensitivity score was about 63.9%, 41.1%, and 33.8%, respectively, for
    BCC, SCC and CM in typical clinical diagnosis. Although only 6.3%'
