    # 15.5 WBAN THREAT COUNTERMEASURES


    The WBAN nature and its critical health applications impose achieving a high level
    of security and privacy. Data must be protected during collection, transfer, processing,
    and storing. Any kind of vulnerabilities could be exploited by adversaries to
    launch a fatal attack. On the other hand, any proposed security measures must
    take into account the security requirements of WBAN and the strict resource limitations.
    In this section, various security countermeasures will be discussed at different
    levels. It is worth mentioning that WBAN security is still an open area of research
    and there is a limited number of WBAN-specific schemes proposed in the literature.
    Therefore, some security schemes discussed throughout this section are generally
    proposed for WSN, which have a high potential to fit WBAN requirements; however,
    further investigation before the adoption is highly recommended. Figure 15.5 shows
    a high-level perspective of the security countermeasures discussed throughout
    this section.


    # 15.5.1 Secure Communication


    Secure communication is regarded as the cornerstone to guarantee the confidentiality,
    privacy, and integrity of the WBAN. Therefore, in this section, the security requirements,
    authentication and key establishment, integrity validation, and encryption are
    discussed.


    # 15.5.1.1 Security Requirements


    To ensure an end-to-end secure communication, there are some security requirements
    to be met by any proposed scheme that provides authentication, encryption, and
    integrity validation.


    +   - Lightweight: As WBAN has limited resources, any security scheme must be
    computationally lightweight [67].

    +   - Anonymity: To ensure that privacy is guaranteed, outsiders should not be
    able to identify the involved parties in the authentication process [72].

    +   - Mutual authentication: In mutual authentication, the two parties can authenticate
    each other with a view to protecting from impersonation attacks [91].

    +   - Unlinkability: Unlinkability is a critical requirement to prevent an attacker
    from tracing the identity of the nodes. Moreover, the unlinkability must still
    be maintained even if the attacker is able to capture two frames belonging to
    the'
