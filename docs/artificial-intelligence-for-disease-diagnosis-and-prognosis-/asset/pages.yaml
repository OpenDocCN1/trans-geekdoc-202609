    # 6.1 INTRODUCTION


    In December 2019, the COVID-19 virus was discovered in Wuhan (China) that immediately
    spread around the globe [1]. This virus enters into the lung cells and spread
    throughout the respiratory system, where it replicates and kills the cells [2,
    3]. The virus is extremely dangerous and can cause death in persons who have weaker
    immune systems [4]. Around the world, infectious disease specialists and clinicians
    have attempted to find a cure for the disease [5]. COVID-19 is the highest cause
    of death in many countries in the world, and hence the detection is crucial in
    the early phases of its development. However, using the Polymerase Chain Reaction
    (PCR) test for detection is time-consuming which is a risk for patients with COVID-19.
    So, first and foremost, medical imaging applications are used to identify COVID-19,
    then PCR test is used for assisting clinicians in deciding finally. Two medical
    imaging procedures are used to diagnose COVID-19: X-ray and CT scan. The X-ray
    modality is the initial approach for diagnosing COVID-19. It has the advantage
    of being inexpensive and low-risk for human health radiation dangers [6]. Detection
    of COVID-19 based on X-rays is a difficult process. The radiologist must pay close
    attention to the white spots in these images that contain water and pus, as they
    are very lengthy and problematic. The initial technique for diagnosing COVID-19
    is to use X-rays, which has the advantages of being inexpensive and is considered
    a low risk of human health radiation concerns. However, COVID-19 detection using
    X-ray is a difficult task. Because the white spots in these images, which contain
    water and pus, are exceedingly long and problematic, the radiologist must pay
    particular attention to them. Because X-rays have an important rate of inaccuracy,
    CT scans can be worked for more precise detection. Nonetheless, CT are meaningfully
