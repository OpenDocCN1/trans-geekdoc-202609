    # 9.1 INTRODUCTION


    Parkinson''s disease (PD) is the world''s second-most frequent neurological disorder
    after Alzheimer''s disease. Moreover, PD is a lifelong and degenerative disease.
    PD was originally discovered by the English physician James Parkinson [1]. Generally,
    the disturbance of dopamine neuronal activity in the basal ganglia causes PD.
    It mostly affects around 1 million or about 1% of adults over the age of 50 in
    the United States [2]. Men are much more likely than women to be afflicted. The
    symptoms appear gradually and intensify over time. There are two main types of
    PD symptoms: Motor and non-motor. Movement issues, trembling, stiffening, walking
    difficulties, and postural imbalance are all instances of motor symptoms [3, 4].
    In addition, vascular dementia, mental issue, melancholy, and severe depression
    are some non-motor symptoms. Although immunotherapy can help with the signs of
    PD and enhance the quality of life in patients, therapy alone may not able to
    cure the disease fully. In the following decades, the prevalence of PD is only
    anticipated to rise. Resting tremor affects more than 75% of Parkinson''s sufferers
    at a certain time during their illness and symptomatic tremor occurs in 60% of
    sufferers during motion or action [5]. In addition numerous sufferers with PD
    in the community remain undiagnosed due to poverty, remote location, or other
    reasons. Thus, these patients become much worse day by day. It is reported that
    the number of individuals affected by PD will rise at a quicker pace until 2050
    [6]. Therefore, most developed countries are becoming highly concerned.


    Actually, early detection of PD is critical for minimizing consequences and complications.
    The symptoms and severity vary among individuals. Several motor symptoms have
    been identified that are either actively or passively connected to PD. The following
    are the signs and symptoms: Tremor, Dysarthria, Akinesia, Bradykinesia Dysphagia,
    Dystonia, Fall, Hypokinesia, Rigidity, Hypomimia, Kinesia Paradoxica, Hypophonia,
    Postural instability, and so on [7]. Moreover, specific medical tests which can
    definitely confirm PD in its early stages are absent [8, 9]. In a conventional
    clinical context, a specialist may ask the patient to undertake various cognitive
    and physical tests such as postural instability, sleep difficulties, speech problems,
    constipation, and so on, in order to diagnose PD in any stage [10]. Currently,
    computer-assisted prognostic systems are being used to aid in the detection of
    PD. A brain scan can be done by various image-based screening tests such as Magnetic
    Resonance Imaging (MRI), Functional Magnetic Resonance Imaging (fMRI), Single
    Photon Emission Computed Tomography (SPECT), brain ultrasound scans and Positron
    Emission Tomography (PET)/Computerized Tomography (CT) scans [11–13]. In addition,
    a specialist can obtain precise images of the brain''s dopaminergic system using
    the dopamine transporters (DaT) scan technology [14, 15]. The above-mentioned
    screening technology cannot prove the existence of PD. However, it can assist
    the specialist'
