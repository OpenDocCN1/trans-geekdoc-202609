    # 7.5.3 Scoring WSI Quality


    The proposed method was designed to evaluate WSI quality at higher magnification
    (i.e., 20× or 40×). The proposed method was demonstrated using a 20× WSI and then
    the procedure to evaluate 40× is explained in this chapter. At first, this method
    divides the entire WSI into non-overlapped and fixed-size blocks. Then, it eliminates
    the useless blocks such as artifact-affected blocks and glass blocks. An image
    block with more than 75% white pixels is considered a glass block and eliminated
    for further work. A pixel is considered white if its intensity is higher than
    200 in grayscale. After that, the method scores each image block except the artifact-affected
    blocks and glass blocks. The proposed method utilizes the localization information
    of artifacts and glass blocks of low magnification to trace them at higher magnification.
    In the experiment, 20× magnification WSIs were used for quality evaluation and
    the block size was 2000 × 2000 pixels which made it easier to integrate the artifact
    detection results at higher magnification to eliminate the detected blocks. For
    the rest of the blocks, the quality was scored to estimate the quality of the
    WSI.


    The proposed method utilizes two metrics for judging the quality of image blocks
    which are blur index and noise index. The blur index is obtained by measuring
    the distance between the local maximum and local minimum of edge pixels. The local
    maximum gradient is detected for each edge’s direction. If this gradient is higher
    than a predefined threshold, then it is considered as an edge pixel and the width
    is estimated for that edge; illustrated in Figure 1.9. Then, the total width of
    all edges is divided by the number of edges which gives the blur index. Out of
    focus regions have small gradients on edge pixels compared to the sharp regions.
    Thus, a smaller value of the blur index indicates that the image is sharper. This
    method considers a pixel as noise if it is independent of its surrounding pixels
    and not belongs to an edge. Noises and edges of the image are detected by filtering.
    Then, the minimum difference between the center pixel and surrounding pixels in
    a 3 × 3 pixel window is calculated at all pixels to filter the edge pixels. After
    that, the average value of these minimum differences is used to quantify noise
    in the image. The higher value means that the image seems to have more noise or
    excess sharp pixels.


    After that, the quality degradation index of a block is derived using a linear
    regression model


    ```

    q = α + βs + γn

    ```


    where q is the quality degradation index for image blocks, s is sharpness degradation
    or blur index, n is noise index, and α, β, and γ are coefficients of prediction.
    The coefficient of prediction was derived by training regression model where the
    mean square error (MSE) between the original image (20×) and its degraded version
    was in place of the quality degradation in Equation (7.1). The magnification of
    the training images should be the same as the magnification of WSI, we want to
    evaluate. If we'
