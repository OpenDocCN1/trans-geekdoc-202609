    Both operations enhance the color metric features by changing the saturation and
    intensity while it keeps the hue unchanged. In their method, the constant was
    derived adaptively based on the saturation-luminance difference of a pixel to
    enhance a tissue-fold pixel more than a normal pixel. After that, a fixed threshold
    was applied on the luminance change to identify a tissue-fold pixel that has higher
    change than a normal pixel. The fixed threshold may not work well for all slides
    due to the technical and biological variation in slides. The color of the WSI
    depends on the staining protocol of the laboratory which varies among the laboratories.
    A tissue fold in a lightly stained slide can be similar to a normal region in
    a highly stained slide. The color'
