    ARTIFICIAL INTELLIGENCE (AI) is one of the emerging fields in the modern computing
    domain. Using AI techniques, machines can obtain knowledge through data analysis,
    which helps them to act rationally. AI-empowered healthcare has proven to be efficient
    and affordable with personalized features. The power of AI can accelerate diagnostics,
    image analysis, resource optimization, and medical diagnosis. Therefore, it is
    essential to aggregate AI technologies to healthcare. Recent advancements in AI
    technology demonstrate remarkable performance in implementing AI and machine learning
    in healthcare. Healthcare systems are capturing various'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'types of physiological data to provide required services to users. It requires
    a high level of accountability and transparency. Most wireless protocols support
    authentication to ensure data security even though this data can be vulnerable
    to traditional and zero-day attacks. So, security and privacy are two main issues
    that are the barriers to accommodating technology in healthcare. This chapter
    presents an analysis of security and privacy solutions utilizing an AI-based method
    in physiological data protection. In addition, we discuss the possible drawbacks
    which affect the security and privacy in machine learning (ML)-based approaches.
    Moreover, a motivation to overcome these flaws is also presented.


    # 16.1 INTRODUCTION


    Nowadays, the span of application of wearable technology is increasing day by
    day. Consumers use wearable devices to capture physiological data for personal
    and clinical use. Different types of portable devices (watches, glasses, wristbands,
    jewellery) from several companies are available; most use Bluetooth and Wi-Fi
    as the communication protocols. Wearable devices record physiological (heartbeat,
    respiration, blood pressure), personal data (profile), and geolocation which can
    interact through the internet and cloud servers. They become an entity on the
    Internet of Things (IoT). Wearable devices use embedded technology which provides
    low computational power and storage capacity [1]. As a result, they are prone
    to face security and privacy challenges compared to the traditional approaches.
    Since it is part of the IoT, unauthorized persons can get into these devices due
    to weak security. Wearable devices are vulnerable to user data security due to
    poor security firmware systems [2].


    Healthcare deals with analysis, processing of personal health-related physiological
    data and creating a bridge between users and healthcare providers utilizing various
    types of communication technology. Any misuse or misinterpretation can cause a
    life threat even death for its user. The term security is used to handle data
    integrity, confidentiality, and availability. Whereas privacy maintains the authentication
    and proper handling of individual''s data. The scope and area of both privacy
    and security is different. The measure of security cannot guarantee the protection
    of user privacy. So, measures should be taken individually to preserve the rights
    of users'' security and privacy in the healthcare domain.


    Nowadays different types of security and privacy issues arise. Among them the
    lack of authentication due to insecure PINs, intercepting messages (spoofing)
    between the cloud server and the healthcare devices, third-party access to sensitive
    information from devices including location information, insecure HTTPS protocols,
    image and video recordings, without users'' consent are most noticeable. These
    security and privacy issues create various types of threats i.e. data injection,
    denial of service (DOS), Wi-Fi signal hijacking, eavesdropping, spyware, and malware.
    Different types of mitigation methods are recommended: (i) Firmware updates in
    regular intervals, (ii) Usage of fixed and private identity resolving are key
    while pairing with mobile devices, (iii) Generation of MAC address randomly, at
    regular interval. As the application area of physiological data usage has expanded
    it''s become complex to handle the healthcare domain.'
