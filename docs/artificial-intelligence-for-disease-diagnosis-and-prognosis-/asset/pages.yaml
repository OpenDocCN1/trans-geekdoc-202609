  md: 'superior performance compared with benchmark schemes. However, using trust
    matrices and tables in addition to considering many factors to estimate the trust
    produce a significant network overhead [40]. Fuzzy-Based Trust Management–The
    Internet of Medical Things (FTM-IoMT) [6] is another fuzzy-based TMS. It has been
    proposed for the IoMT to protect from Sybil attacks. The authors adopted a centralized
    approach that uses features like integrity, receptivity, and compatibility to
    evaluate the trust value. The performance results show a good detection accuracy.
    However, it also shows a noticeable processing overhead. Therefore, further investigation
    is required to reduce server-side overhead and enhance packet delivery delays.


    # 15.5.3.2 Probability-Based TMS


    The probability distribution theory is widely used in the literature to infer
    the trust value from former estimations. The beta probability distribution is
    approximately the most used one. However, few schemes are built on different probability
    distributions such as exponential probability distribution and binomial probability
    distribution [18, 97]. A reputation-based framework for sensor networks (RFSNs)
    [20] is regarded as the first beta trust management scheme in the literature [24].
    The authors used the watchdog technique to monitor the behavior of adjacent sensor
    nodes and collect observations which were then used to update the posterior reputation
    value. Authors [23] have proposed a lightweight trust management scheme for Wireless
    Medical Sensor Network (WMSNS). LTMS (Lightweight Trust Management Systems) provided
    two algorithms to evaluate the trust relationship. The first is proposed to fit
    the strict resource limitations of in-body sensor nodes, while the second provides
    further protection from on-off attacks and proposed to fit on-body and off-body
    sensor nodes. The two proposed algorithms have contrasted with benchmark trust
    schemes and showed superior performance in terms of attack detection and overhead
    processing. An ETRES (exponential-based trust and reputation evaluation system)
    [97] is another probability-based trust scheme. The authors used exponential distribution
    to evaluate the trust relationship, assuming that the future behavior should have
    the same mode as the old one. The authors suggest using the entropy theory to
    evaluate the uncertainty to reduce the overhead caused by considering an indirect
    trust module. Moreover, the authors used a weighting technique to emphasize the
    most reputable recommenders and recent observations. The performance results of
    ETRES showed a slight improvement compared to RFSN [19] and BTMS [17].


    # 15.5.3.3 Weighting-Based TMS


    In this kind of TMS, the trust relationship is evaluated by weighting the performance
    of other sensor nodes over time. It is easy to implement and deploy; however,
    it does not have a solid statistical or mathematical foundation [35]. The authors
    in [45] proposed a weighting-based trust scheme with a risk assessment to ensure
    a quick reaction to malicious activities. The risk assessment module makes destroying
    the trust easier than building it, which enhances the reliability of the proposed
    scheme. The overall trust value is evaluated using direct trust, received recommendations,
    risk'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'factor, and the previous trust value. Another weighting-based TMS is RaRTrust
    [47]. The authors used both reputation and risk to evaluate the trust relationship
    with a view to defeat on-off attacks. Moreover, they adopted a timing window for
    ratings to reduce network congestion and delay. As a result, RaRTrust shows resiliency
    to on-off attacks and bad-mouthing attacks, while TMR is just able to defeat on-off
    attacks.


    # 15.5.3.4 Other TMSs


    Some trust management schemes do not fall within the previous classification.
    For instance, one group [33] proposed a cluster based with a 3-tier architecture
    trust management scheme. Tier-1 only considers nodes registration, while tier-2
    defines five levels of misbehavior activities to secure the data communication
    between nodes, and the third tier is to monitor the energy consumption and migrate
    the cluster head process to another node. The proposed scheme evaluates the trust
    relationship using previous information and second-hand information to discover
    malicious nodes.


    # 15.6 CONCLUSION


    In this chapter, the current research on WBAN has been comprehensively investigated
    with a particular focus on security. A brief introduction about WBAN and its architecture
    and topology was presented first to provide the reader with the required information
    to comprehend the chapter''s content readily. Next, attacks on WBAN and security
    requirements have been widely discussed. Finally, security countermeasures at
    different levels have been investigated, including secure communication, intrusion
    detection, and trust management.


    Due to the sophisticated nature of modern attacks on WBAN, traditional signature-based
    methods would not be sufficient to mitigate them effectively. Instead, more advanced
    methods supported by recent developments in AI should be implemented. AI systems
    are trained to identify malware, recognize network traffic patterns, and detect
    APT attacks before reaching the target. Therefore, integrating AI into WBAN security
    would be the greatest method to detect and respond to WBAN attacks in real time
    and provide authenticity protection.


