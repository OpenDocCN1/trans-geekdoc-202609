  md: 'In the realm of medical treatment, we can see the use of evolutionary algorithms
    to detect some neurologic diseases. Diseases like Alzheimer''s, depression, and
    Parkinson''s are detected using evolutionary algorithms based on the feature extraction
    from speech signals.


    +   - Active Learning: Active Learning is a special type of supervised machine
    learning algorithm that can interactively query a user to label data with the
    desired outputs. The size of the training dataset is kept at a minimum constructing
    a high-performance classifier. The creation of active learning was done keeping
    a few points in mind—it will work for a dataset with a huge and small number of
    data; annotation of unlabeled data costs human effort, time, and money; the computation
    power is limited.


    Active learning is based on the concept of achieving higher accuracy with a small
    number of labeled training data. The model itself will select the data from which
    the model will learn. This is done by proactively selecting the next set of examples
    that will be labeled from the unlabeled data. That''s why during the training
    stage, the active learner can interactively ask queries. Those queries are usually
    unlabeled that are asked to humans for labeling the instances.


    Implementation of active learning can be done using three main approaches.


    +   - Stream-based selective sampling approach: During the training process, the
    model is presented with data and the model calculates if labeling the data will
    be beneficial for the model. That is, whether the model wants the data to be labeled
    or not. The main issue in this approach is high human labor. Moreover, it is very
    hard to hire a data scientist to label data within the budget.


    +   - Pool-based sampling approach: This is the most applicable method for active
    learning. The active learner goes through the entire dataset and evaluates the
    dataset. Then the best group of queries are selected. In some cases, the active
    learner is even trained on the fully labeled training dataset. Based on that the
    learner detects which of the unlabeled data will be beneficial for that scenario
    if that data is inserted into the data pool. Then the model has to be trained
    once again. The only drawback of this approach is high memory consumption.


    +   - Membership query synthesis approach: This approach is not applicable for
    all scenarios. Here data is generated synthetically. The creation of new data
    is allowed to the active learner. This is effective in situations where it is
    easy to create new data instances.


    In healthcare, in the field of medical imaging data and other cases, there may
    be a limited amount of labeled data. In such cases, a human annotate can label
    the data to assist the algorithm. It may be a bit tedious and slow process to
    label those data and readjust the model accordingly. But it saves time compared
    to traditional data collection methods.'
