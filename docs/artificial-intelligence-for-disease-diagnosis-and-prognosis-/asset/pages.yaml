    Let us say we want to recognize human activity or gait from images or videos.
    A lot of things can go wrong here. The camera might fall or shake slightly making
    the images blurry and out of focus. And the worst-case scenario, the camera might
    stop working altogether. We don''t want these types of anomalies in our data.
    So, we need to exclude such data. The data cleaning process helps eliminate such
    anomalies in the data, making the dataset more robust and real-life accurate.


    The data cleaning process can be conducted in a few different ways—manually, automated,
    or a combination of both. Manual cleaning of the data is pretty laborious as it
    requires going through every data. For our example, we need to go through each
    frame to check if they are accurate. If not, we have to discard those frames.
    Researchers tend to set fixed binding clauses or threshold values for automated
    data cleaning that confines the data into those rules. While automated data cleaning
    may be significantly faster, it can also be inaccurate at times. That is where
    a mixture of both comes in handy. Using a combination of both makes a dataset
    more robust and accurate.


    Features are those measurable variables that define the property or characteristics
    of any situation, occurrence, event, or fact. They are considered the building
    block of any dataset. For any model to function most efficiently and accurately,
    it is necessary to define the appropriate features of a given dataset.


    While defining the features we should keep a few things in consideration. Redundant
    features should not be a part of the feature set at any cost. This makes the model
    perform worse not only in the sense of accuracy but also latency. For example,
    we are using temperature data for monitoring a patient. A particular temperature
    sensor might record data in both Celsius and Fahrenheit. Using both of them as
    features will create redundancy as they have a linear relation between them. So,
    we should include only one of them as a feature for that particular case.


    Another factor is the normalization of the features. Before feeding the features
    to any ML or deep neural network, it is necessary to normalize the data to a particular
    range of values, usually 0 to 1. To avoid any more issues, we should make sure
    that all the units of the feature set are consistent. Let us consider our previous
    example, but with a caveat. Instead of using one temperature sensor, we will be
    using multiple temperature sensors for different parts of the body. We should
    make sure that all the data of various parts of the body are in either Celsius
    or Fahrenheit. Moreover, other features which have temperature in their unit should
    also use the same unit. In brief, consistency is a key factor.


    Also, we should take such features into consideration that have their values distributed
    somewhat evenly. Let us say we want to find the symptoms of a disease. If we have
    a model that takes age as a feature, we should make sure that the data consists
    of people of all ages. If the dataset consists of data for 2 people that are 50
    years old and data for 100 people that are 55 years old, then age should not be
    considered as a feature for that model. So, we need an even distribution of data.
    It helps the model to learn how much value that feature value carries for that
    particular label.'
