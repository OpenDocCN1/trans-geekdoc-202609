    [17,18]. The chemotherapy can also increase the HER2 gene copy number [19], making
    the HER2 assessment more challenging for a patient who has received chemotherapy.


    # 7.3 WHOLE SLIDE IMAGING AND AUTOMATED IMAGE ANALYSIS


    WSI system provides the platform for automated image analysis and diagnosis utilizing
    AI for digital pathology. WSI scanner converts the entire pathological specimen
    into a high-resolution digital image, mostly know as whole slide image. In digital
    pathology, the analysis and diagnosis are performed using this image. In traditional
    pathology, the diagnosis is performed based on the microscopic view of some selected
    areas from the specimen. The analysis depends on the pathologist and his selected
    areas. Consequently, the analytic result sometimes differs among pathologists.
    While the WSI allows scrutinization of the entire specimen using automated tools
    on a computer screen which improves analysis and helps reduce the bias among pathologists.
    Figure 7.4 shows the system of monitor-based analysis using WSI. WSI images are
    very large in dimensions, usually in the order of gigapixels. A pyramid shaped
    model is used to store the multi-resolution WSI, where each layer of the pyramid
    represents a different magnification or resolution of the image. The top layer
    provides the lowest-resolution image, and the bottom layer is for the highest-resolution.
    This type of system is suitable for developing an automated analysis system for
    digital pathology. For example, some pathological tasks can be performed using
    a low-resolution image like tissue segmentation while some tasks like analyzing
    tissue structures require a high-resolution image. A higher-resolution image provides
    finer details of the specimen, but it requires high time to process this huge
    amount of data.


    Image processing and machine learning techniques can be applied on WSI to extract
    features, correlate, and interpret them for diagnostic decisions, which is implausible
    in an observation dependent diagnosis. Machine learning can be applied to WSI
    to automate pathological operations such as counting mitosis [20], detecting tissue
    artifacts [21], detecting infectious agents like asbestos, identifying cancer
    [22, 23], classifying cancers [24–26], and others.


    However, the accuracy of the analysis largely depends on the quality of the image.
    WSI quality is sometimes insufficient for analysis due to scanning failure or
    poor specimen, mainly. Poor quality images could lead to inaccurate analysis and
