    # 5.7.1 Segmentation Tasks


    One of the most popular evaluation metrics for assessing the performance of the
    segmentation tasks is the Intersection-over-Union (IoU) which measures the overlap
    between the ground-truth data and the segmentation conducted by the proposed algorithms.
    The values of IoU are between 0 (poor performance) to 1 (the best performance).
    It is calculated as follows:


    \( IoU = \frac{Area of overlap}{Area of union} = \frac{target \cap prediction}{target
    \bigcup prediction} \) (5.12)


    Here, Area of overlap is the value of overlapping between the ground-truth segmented
    area and the predicted one by the algorithms. Area of union is the union of the
    two items. Additionally, there are five more evaluation metrics for segmentation
    task which are calculated based on the TP, TN, FP, and FN obtained from the confusion
    matrix.


    One of these metrics is accuracy which is defined as the fraction of the number
    of right predictions made by the model over the total number of predictions as
    follows:


    \( Accuracy = \frac{TP + TN}{TP + TN + FP + FN} \) (5.13)


    Here, for the segmentation task, the pixel-level accuracy and the pixel values
    over and below 128 are considered as positive and negative, respectively. Recall/Sensitivity
    which indicates the True-Positive rate is calculated by dividing correctly predicted
    data as positive over all the positives:


    \( Recall/Sensitivity = \frac{TP}{FN + TP} \) (5.14)


    Specificity as an evaluation metric is the proportion of correctly predicted negatives
    in relation to all the negatives as follows:


    \( Specificity = \frac{TN}{FP + TN} \) (5.15)


    The Jaccard index/Jaccard similarity coefficient measures the similarity and differences
    between the sample sets and ranges from 0 to 1. It is calculated based on the
    following equation:


    \( Jaccard = \frac{TP}{TP + FN + FP} \) (5.16)


    The most broadly used metric for validating skin disease segmentation algorithms
    is the Dice similarity coefficient through which the similarity between two sets
    of data can be measured as follows:


    \( Dice = \frac{2TP}{2TP + FN + FP} \) (5.17)'
