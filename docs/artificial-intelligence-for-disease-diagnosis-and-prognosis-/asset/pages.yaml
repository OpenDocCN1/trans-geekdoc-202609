    # 9.3 PROBLEM ANALYSIS


    Due to aging, detecting PD can create numerous challenges including loss of balance,
    poor movements, muscular rigidity, and slumped posture. Later, PD affects the
    nerve cells, where cells deliver messages to muscles that allows it to move. Neurons
    which are sick str unable to regulate muscles normally. PD diagnosis is not straightforward,
    which means a particular clinical test such as a blood test or an electrocardiogram
    (ECG) cannot indicate whether a person has the disorder. Moreover, the proper
    cause of the disease remains unknown [53]. In some scenarios, PD may be induced
    by inherited factors [54]. As there is no conclusive test for PD, there is a strong
    possibility of misdiagnosis. Conversely, it is challenging for a large number
    of people to make the proper physical appointments at the clinic for screening
    and therapy. As a sense, the majority of persons with PD are highly dependent
    on medical interventions. Conceptually, it has been claimed that early diagnosis
    may effectively control or reduce PD symptoms. Hence, an automated system for
    early diagnosis of PD is a major consideration, as the condition could become
    incurable if detected at an advanced stage.


    Definitely, a sufferer can receive proper treatment if early and reliable diagnosis
    is feasible. Hereby, the DL and ML methods can provide radiological experts with
    information that help make better and more reliable decisions for a sufferer.


    # 9.4 POSSIBLE SOLUTION


    There is no known treatment for PD, the medical records and personal observations
    of the patient are used to evaluate the disease’s severity. However, clinical
    symptoms are used to diagnose PD. Dopamine is a feature to assess as a suspected
    PD patient which is measured by Fluorodopa positron emission tomography (PET).
    Further, computed tomography (CT) and MRI can be used to determine a structural
    issue in a suspected PD patient [55]. Therefore, the most frequently used rating
    scales for the'
