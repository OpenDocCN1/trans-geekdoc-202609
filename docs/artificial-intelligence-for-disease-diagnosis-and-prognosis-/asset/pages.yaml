- pgno: 113
  md: '# 5.7.2 Classification Tasks


    Common evaluation metrics for assessing the performance of the classification
    are accuracy, Precision, Recall/Sensitivity, F1-Score, Specificity, and Matthews
    Correlation Coefficient (MCC) Score, among which accuracy, Recall/Sensitivity,
    and Specificity are common metrics between the segmentation and classification
    as defined in the previous section with a difference that in classification task
    they are not in pixel level but they are calculated at the whole image level.


    The _Precision_ is determined by calculating the fraction of the positive class
    correct predictions over all the predictions as positive (correct or incorrect):


    ```

    Precision = \frac{TP}{TP + FP} \quad (5.18)

    ```


    The mean of the Precision and Recall is defined as the _F1-Score_ which has a
    value between 0 (i.e. either the Precision or the Recall is zero) to 1 (i.e. perfect
    Precision and Recall). This is similar to Dice similarity coefficient and is calculated
    as follows:


    ```

    F1-Score = \frac{2 * (Precision * Recall)}{Precision + Recall} \quad (5.19)

    ```


    A more informative and valid score can be obtained by MCC in evaluating the classification
    performance which makes it more preferable rather than accuracy and F1-Score.
    Based on MCC, the accuracy of the classifier is measured through the comparison
    made between the observed and expected results as follows:


    ```

    MCC = \frac{(TP * TN) - (FP * FN)}{\sqrt{(TP + FP) * (TP + FN) * (TN + FP) * (TN
    + FN)}} \quad (5.20)

    ```


    These metrics are calculated for each of the classes in the classification task
    and the overall performance is evaluated by taking the average of all these values.
    As an example, the performance of multi-class classifier in Figure 5.32 is evaluated
    based on these evaluation metrics for the first class as follows:


    _accuracy_ = \(\frac{7+8}{7+8+17+4} = 0.41 = 41\%\), _Recall/Sensitivity_ = \(\frac{7}{7+4}
    = 0.63 = 63\%\), _Specificity_ = \(\frac{8}{8+17} = 0.32 = 32\%\), _Precision_
    = \(\frac{7}{7+17} = 0.29 = 29\%\), _F1-Score_ = \(\frac{2*0.29*0.63}{0.29+0.63}
    = 0.39 = 39\%\).


    One sample Python code for computing the confusion matrix and evaluation metrics
    is illustrated in Figure 5.33.


    In addition to the above-mentioned evaluation metrics which are calculated according
    to the values of the confusion matrix, the area under the curve (AUC) for the
    receiver operating characteristic (ROC) can perfectly evaluate the ability of
    the classifier. The ROC curve is formed by plotting the True Positive rate (i.e.
    Sensitivity/Recall) against the False-Positive rate (i.e. 1-Specificity) under
    different threshold values whose AUC is determined by taking its integral. The
    examples of ROC curves for different machine learning-based classifiers with their
    AUCs are illustrated in Figure 5.34. The AUC takes a value between 0 and 1 and
    the values close to 1 indicate the high capability of the classifier. Comparing
    the results, the highest value of AUC which is 0.90 belongs to SVM+Naïve Bayes
    and SVM classifiers which proves that those classifiers outperform the others.'
