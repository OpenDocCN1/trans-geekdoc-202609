- pgno: 60
  md: 'addressed for clinical benefits. This chapter will describe recent advancements
    in drug response prediction methods using ML algorithms. Monotherapy and drug
    combination prediction methods will be discussed. A brief overview of pharmacogenomic
    data selection methods and appropriate ML algorithms will also be included. Furthermore,
    the limitations of current approaches will be addressed. The ability to predict
    drug responses for individual cancer patients will improve the quality of treatment
    by reducing unnecessary drug-associated side effects and financial burdens.


    # 4.1 INTRODUCTION


    In the past decades, artificial intelligence (AI) has been widely applied to cancer
    research in diagnosis, treatment planning, drug development, drug sensitivity
    prediction, and prognosis determination. Advancements in digital data collection
    have made a massive amount of data available for the development of computational
    programs. Improvements in computer hardware and algorithms have made AI more accessible
    to researchers for the development of better in silico tools using experimental
    data.


    Due to the heterogeneous response to drugs, cancer treatment remains challenging.
    Although we would expect a drug to trigger a similar response in the same type
    of cancer, the response can be very different for different patients that share
    a similar cancer subtype. Therefore, there is an unmet need for development tools
    that can guide whether a patient will benefit from a drug prior to applying it.
    Such an approach would be beneficial in determining personalized cancer medicine.


    Machine learning (ML), a subset of AI, has been applied widely and some of the
    earlier studies have been documented their applications in cancer research [1-9].
    These studies offer valuable opinions on the advancement of the field, relevant
    computational challenges, and illustrate the importance of the field for cancer
    treatment. The area of cancer research is very broad, and ML can be used for several
    different aspects. In this chapter, we will briefly discuss ML algorithms that
    are currently applied to drug response prediction.


    # 4.2 ML IS A SUBSET OF AI


    Any technique that enables computers to mimic human intelligence can be categorized
    as AI, and if a method allows a computer to perform a task from experience, it
    can be categorized as ML (Figure 4.1a). Therefore, ML is a subset of AI that has
    been widely applied in cancer research, particularly drug sensitivity prediction.
    ML algorithms can be further classified into four subgroups: (1) Supervised learning—where
    algorithms are trained with a dataset linked to known outcomes to build hypothetical
    models that allow prediction of the outcome from unknown samples. (2) Unsupervised
    learning—which identifies hidden patterns from unlabeled data that allow clustering
    and pattern detection in unlabeled biological samples. (3) Semi-supervised learning—where
    data with known and unknown outcomes are mixed and algorithms learn from partially
    labeled data to develop a prediction model. (4) Reinforcement learning—where the
    algorithm learns how to predict a situation using completely unlabeled data (Figures
    4.1b and 4.1c). In drug sensitivity prediction, supervised learning is widely
    used, and'
