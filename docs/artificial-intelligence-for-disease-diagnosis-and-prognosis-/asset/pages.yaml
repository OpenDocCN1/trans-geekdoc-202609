    # ### 5.6.1 Data Augmentation


    The performance of the deep learning-based models is highly dependent on the size
    of the training data. Large amount of training data prevents the model from overfitting,
    increases the generalizability of the model, and enhances its performance. However,
    collecting such a large number of data especially in medical image analysis is
    really challenging, costly, and energy-consuming due to patient privacy, rarity
    of diseases, and the necessity for labeling the images by a professional expert.
    On the other hand, as the future testing data seen by the network can contain
    several variations making them different from the training ones, it is important
    to train the model with various data and make it robust through learning more
    robust features. To address these issues, the original training data are artificially
    transformed by applying data augmentation. Data augmentation is composed of a
    wide range of techniques through which random jitters and perturbations are applied
    to generate new training samples from the original images keeping the class labels
    unchanged to improve the size and the quality of the original dataset. In testing
    phase, no data augmentation is applied. Applying different augmentations on the
    training data, the testing accuracy is increased as the model can learn more significant
    properties with different possible'
