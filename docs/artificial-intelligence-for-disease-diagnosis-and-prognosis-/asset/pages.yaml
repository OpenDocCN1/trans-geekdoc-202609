    PARKINSON''S DISEASE (PD) is an illness of the neurological system that involves
    tremors, muscle stiffening, impairment of posture and movement, state of imbalance,
    changes in speech and writing, and reduction of concentration. Considering proper
    care, early and quick PD detection is essential for every probable patient. For
    detecting PD, however, there are no specific medical tests except the assessment
    of clinical symptoms. For a conclusive outcome, several physical issues must be
    noticeable in order to diagnose PD. Artificial Intelligence (AI)-driven approaches
    such as machine learning (ML), deep learning (DL), computer vision, and natural
    language processing (NLP) have been used for the classification and assessment
    of the severity of PD patients. However, a comprehensive and technical overview
    of AI methods through various data like non-motor signs and symptoms of PD are
    missing. Therefore, in this chapter, we present a systematic review of the literature
    based on the application of AI that serves to identify PD that have been recently
    published to diagnose PD from the medical and technical database. Hence, the review
    covers numerous'
