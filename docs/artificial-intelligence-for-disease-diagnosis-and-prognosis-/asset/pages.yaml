- pgno: 286
  md: 'for resource constrained networks. It adopted the properties of the immune
    cells with a signature database. For example, the detection nodes represent the
    dendritic cells and similarly, T-cells and B-cells, are mapped to appointed nodes
    in the detection process. The detection node is able to stimulate other members
    in the detection process.


    # 15.5.2.2 Anomaly-Based IDS


    In this kind of IDS, the normal network operation and node behavior are profiled.
    The detection engine is then able to report anomalies when there is a certain
    amount of variation. Researchers [11] have suggested a classification of anomaly-based
    IDS as follows.


    **Statistical-Based.** The statistical-based anomaly IDS builds a reference profile
    for the normal network operation without malicious activities. Afterward, the
    IDS monitors the network, periodically generates a profile and compares it with
    the reference profile to compute the anomaly score. If the anomaly score exceeds
    a certain threshold, then an anomaly is detected. One group [30] proposed a sink
    assistant statistical IDS for WBAN. The proposed scheme is successfully able to
    detect replay attacks, jamming attacks, data forging attacks, exhausting DoS attacks,
    and selective forwarding attacks. The detection performance shows high true-positive
    and low false-positive rates. Another statistical IDS is a proposed scheme using
    a variety of statistics, such as forward percentage (FP), maximum sequence counter
    (MSC), malicious flooding on a specific target, global forward percentage (GFP)
    and local forward percentage (LFP), to detect abnormal behavior [32]. Moreover,
    the proposed scheme is able to provide more details about the attack, such as
    the attack type and source. The performance results show high accuracy in detecting
    selfish activities and less accuracy in detecting blackhole and spoofing attacks.


    **Knowledge Based.** A knowledge-based anomaly IDS depends on having prior knowledge
    about the network conditions in both cases normal operation and under certain
    attacks. Different techniques could be used in this kind of IDS, such as expert
    systems, description languages, finite state machines, data clustering, and outlier
    detection [5, 11].


    **Machine Learning Based.** Machine learning-based IDS is an intelligent approach
    to detect abnormal activities in the network. A detection model is built using
    a machine learning algorithm and trained using example patterns from a real network.
    The advantage of this data-driven detection engine is the ability to detect even
    unknown attacks. Many machine learning algorithms have been used to build a detection
    model, such as SVM [9] and random forest [51]. One group of authors [79] proposed
    iDetect, a distributed intelligent IDS to detect WBAN attacks. The model is built
    using a multi-objective genetic algorithm to make a trade-off between high-detection
    performance and resource consumption. The performance results show a good detection
    accuracy against jamming attacks, random jamming attacks, and selective forwarding'
