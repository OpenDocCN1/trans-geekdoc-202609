    annual number of cases of skin cancer has increased to 53%, and melanoma affects
    one in every 52 women and one in every 32 men in the United States. It is estimated
    that about 10,000 individuals died from it [7]. In the United States, a total
    of 178,560 new cases of melanoma have been reported since 2018. Furthermore, 9320
    people have died due to melanoma, in which 3330 were women and 5990 were men [8].


    CNNs have shown great promise, and they’re frequently employed in various contests
    such as the ImageNet challenge, in which researchers attempt to categorize lots
    of different natural objects [9, 10]. In this study, we have fine-tuned and trained
    various neural network architectures such as VGG16, DenseNet201, InceptionV3,
    NasNetLarge, and ResNet to identify multiple skin lesions successfully. However,
    an existing CNN architecture such as VGGNet with a very deep neural Network and
    layers have the strength to classify complex classification like skin lesions
    [11]. In [12], a group of researchers achieves the best accuracy with 84.00% accuracy
    on the “HAM10000” dataset. “HAM10000” is a well-known dataset that researchers
    widely use for classifying skin lesions. Various machine learning and image processing
    concepts and applications were deployed on the dataset to develop a robust computerized
    skin lesion classifier. There are 10,015 dermatoscopic images in the dataset,
    which is released as a training set for academic machine learning purposes. More
    than half of the lesions have been confirmed by pathology, while the remaining
    cases have either been followed up or confirmed by in vivo confocal microscopy.
    The dataset is publicly available through the ISIC archives on the Harvard Dataverse
    [13].


    Although in our earlier study, we have identified the risk of cancer in skin related
    patient by evaluating genetic information of the patient [14], this particular
    study follows non-invasive strategy of identifying the risk of skin lesions. Therefore,
    in this study, our main aim is to develop a framework for pre-screening skin lesions
    at an early stage so that the patient can take proper steps before the condition
    gets worse. In our framework, we have hypothesized that the patient would be able
    to use the device at home for free as well as the data, which is well secured
    from unauthorized access.


    # 13.1.1 Related Work


    There are numerous works on building Computer-Assisted Diagnosis (CAD) for skin
    lesions. However, very few studies proposed an IoT-based skin lesion detection,
    more specifically with enough safety measures of the patient’s data. As a result,
    we proposed a framework to determine a combination of an IoT-based CAD with proper
    safety focus of the acquired data and results.


    In 2019, Kiran Pai et al. trained a Convolutional Neural Networks for classifying
    skin lesions on the “HAM10000” dataset. They have utilized VGG16 architecture,
    and they were able to achieve an accuracy of 79% [15]. In another research study,
