    +   - *Revocability*: Revocability requirements allow revoking any malicious node
    effectively to keep the network secure [91].

    +   - *Non-repudiation*: By fulfilling a non-repudiation requirement, senders
    cannot deny their messages [72].

    +   - *Resilience to well-known attacks*: Security schemes must be resilient to
    well-known attacks, such as replay and impersonation attacks [14].'
