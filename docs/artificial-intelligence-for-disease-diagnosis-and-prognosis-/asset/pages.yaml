    # 10.2.4 Breast Cancer Histopathological Database (BreakHis)


    The Breast Cancer Histopathological Image Classification (BreakHis) is made up
    of 9109 microscopic images of breast tumor tissue collected from 82 people at
    various magnification levels (40×, 100×, 200×, and 400×) as shown in Figure 10.2.
    There are 2480 benign and 5429 malignant samples in this collection (700×460 pixels,
    3-channel RGB, 8-bit depth in each channel, PNG format) [10].'
