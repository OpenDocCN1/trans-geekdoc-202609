    # ## 15.3 WIRELESS BODY AREA NETWORK


    The standardization process of wireless sensor networks for healthcare applications
    is triggered by projecting its importance and critical role in the near future.
    Therefore, the Physical (PHY) and medium access control (MAC) layers are defined
    in the IEEE 802.15.6 [34] in order to ensure interoperability amongst devices
    from different vendors. The standard supports three kinds of physical layers namely
    narrowband (NB) PHY, ultra-wideband (UWB) PHY, and human body communication (HBC)
    PHY, which support different frequency bands and data rates in order to meet the
    requirements of different potential applications.


    # ### 15.3.1 WBAN Topology


    Each body area network (BAN) consists of one single sink node and a set of sensor
    nodes. The maximum number of nodes within one BAN is specified by 64 in the IEEE
    802.15.6 standard. The star topology is adopted in the standard with two kinds
    of communications, simple and extended. In the simple one-hop star topology, all
    nodes should be within the direct communication range of the sink, while in the
    extended two-hop star topology, some nodes relay traffic to others as shown in
    Figure 15.1.


    WBAN nodes could be classified according to their role, deploying location, and
    functionality [7]. Based on their roles, sensor nodes can be classified into:


    +   * Hub: It could also be called sink or coordinator. It is the gateway of BAN''s
    nodes to other BANs and networks. It usually has superior resources compared to
    other nodes as all BAN traffic goes through it.

    +   * Relay node: In the extended star topology, some nodes have the relaying
    capability to help nodes that are not in the direct communication range.

    +   * End node: These nodes are designed to sense the bio-signals and report them
    to the sink either directly if they are in the direct communication range, or
    via relay nodes.


