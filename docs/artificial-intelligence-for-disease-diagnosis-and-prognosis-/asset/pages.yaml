    # 2.4 EVALUATION METHODS


    Building an ML model is not everything. Making sure that the model works properly
    is also a big deal. But how we can determine that the model we designed is working
    properly? To find that, we need some variables. These variables are called evaluation
    metrics that help us understand and evaluate the model. There can be various types
    of evaluation metrics based on whether the model is designed for classification
    or regression.


    +   - Confusion Matrix: The confusion matrix is an N × N matrix. Here N is the
    number of classes that will be predicted. From this matrix, we find the accuracy
    of the model, positive predictions, negative predictions, precision, recall, and
    specificity. Usually, we care about any one of those metrics.


    +   - F1-Score: From the confusion matrix we can find the recall and precision.
    And from those two values, we can find the value of the F1-Score. In some cases,
    it is necessary to have a balance between precision and recall value. For those
    cases, we calculate the F1-Score to understand the model.


    ```

    F₁ = ( (recall⁻¹ + precision⁻¹) / 2 )⁻¹

    ```


    +   - Gain and Lift Charts: Checking the rank ordering of the probabilities is
    the main concern for gain and lift charts. It is effective in cases where campaigning
    is involved.


    +   - Kolomogorov Smirnov Chart: The Kolomogorov Smirnov or K-S chart is used
    to measure the performance of classification models. The higher the value, the
    better the model can decern between positives and negatives.


    +   - Area Under the ROC Curve (AUC-ROC): This metric is more often used in the
    industry. ROC curve provides us the graph of sensitivity vs. (1-specificity).
    Having a higher value means the model is performing well. In some cases, the lift
    chart will fail to provide the current data if the parameters change. But, this
    makes more sense.'
