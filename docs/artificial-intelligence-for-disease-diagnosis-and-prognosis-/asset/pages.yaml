    # 2.2 MACHINE LEARNING ALGORITHMS


    # 2.2.1 Supervised Learning


    As the name refers, the learning procedure of the algorithm will be under supervision.
    But, under the supervision of what? Under the supervision of structured output.
    That means, the inputs to the model during the training process will have specific
    outputs.


    In the simplest of sense, supervised learning can be considered similar to a function.
    There is an input X and output Y, where you have to map the input and the output
    using an algorithm that is the function f().


    ```

    Y = f(X)

    ```


    The training procedure does the mapping of the function according to the input
    and output. That function is a programmed algorithm that is used to train and
    optimize on labeled training data. Later, this trained model or algorithm is used
    to predict or classify data based on the input of the model of unlabeled test
    data.


    In supervised learning, there are two types of predictions—classification and
    regression. Classification is allocating outputs into different discrete classes.
    Accuracy is the main parameter to evaluate the model. Regression is predicting
    a continuous value. Various types of error values are calculated to evaluate a
    model.


    +   • K-Nearest Neighbor (KNN): K-Nearest Neighbor is a super-simple supervised
    way to classify data. As it does not have any specific algorithm and specialized
    training procedure like other algorithms it is considered a lazy learning algorithm.
    It is also called a non-parametric algorithm as no parameter is defined or assumed
    about the underlying data. Instead of depending on different'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'parameters, it uses distance to classify any testing data. We can use multiple
    techniques to calculate the distance value. The most common approach is Euclidean
    distance.


    ![](img/bffdb4a72252285ac92f0fad78a7f104_28_0.png)


    Figure 2.3 K-Nearest neighbor.


    Let us consider we have a lot of data on different cell types—stem cells and fat
    cells. The data is plotted in Figure 2.3. We want to use KNN to classify new cell
    data for K = 11. Then the new data is compared with the rest of the data to find
    the distance between the new data and the training data. Then K number of least
    distances from training instances is summarized. Among those data, the label with
    the highest number of occurrences is then classified for the new data. In this
    case, in the range of K = 11, there are data for 8 fat cells and data for 3 in
    the boundary. So, the new data gets labeled as a fat cell. If there is a tie anytime,
    then a random label is selected.


    In KNN, the larger the dataset, the more accurate the output will be. Although
    the accuracy of KNN is very high, it has a few drawbacks as well. The computational
    and memory cost is considerably higher for KNN as it needs to load all the training
    data, which is vectors in a multi-dimensional free space, to the memory and compute
    the distance of new data from all those points.


    +   • Support Vector Machine (SVM): SVM is a simple ML model that classifies both
    linear and nonlinear data. Both linear and nonlinear classification is possible
    using SVM. SVM maps data to n-dimensional feature space. Then the data among different
    classes are separated using a hyperplane with some degree of tolerance. A hyperplane
    is a function or a plane that separates data of different labels and has one less
    dimension in contrast to the dimension of the data space itself. The hyperplane
    is defined in such a way that the distance between the classes is maximum. It
    helps to insert new data point into the data pool. A hyperplane can also be termed
    as “Decision Boundary.” The data points that have the minimum distance to the
    hyperplane are known as “Support'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Vector” as they are used as supports while determining the hyperplane. There
    may be instances where the data is not linearly separable. In such cases, the
    data space is transformed into a higher-dimension space using some nonlinear transformation.


    ![](img/bffdb4a72252285ac92f0fad78a7f104_29_0.png)


    # Figure 2.4 Support vector machine.


    For example, we want to find out if a person is obese or not. We have two features
    – one on the X-axis, another on the Y-axis that can be height, weight, etc. We
    apply the SVM algorithm to determine the best hyperplane that separates obese
    data from not obese. If new test data is plotted, we can determine its class based
    on its location relative to the hyperplane.


    SVM is highly effective in high-dimensional spaces. Even if the number of dimensions
    is greater than the number of samples, SVM is still effective. SVM is very versatile
    as different kernel functions can be specified for the decision function that
    allows using custom kernels alongside common kernels. But it is necessary to avoid
    over-fitting while choosing kernel functions if the number of features is much
    greater than the number of samples. If we want to calculate probability estimates,
    we need to use expensive five-fold cross-validation as SVM does not provide those
    directly.


    +   • Decision Trees (DT): Decision trees are a prediction-based supervised ML
    technique designed like a tree where the decisions and possible outcomes are taken
    into consideration in each node of the tree to find the final consequence of any
    given input. Both classification and regression problems can be solved using decision
    trees.


    Depending on different conditions, a dataset is usually split in many different
    ways to make a decision tree. The tree can be categoric or numeric, or a combination
    of both. The classification can be categoric or numeric. Moreover, final classifications
    can be repetitive.


    A decision tree works from starting at the top. Then it works its way down and
    finally gets to a point where there are no more decisions to take. There are'
