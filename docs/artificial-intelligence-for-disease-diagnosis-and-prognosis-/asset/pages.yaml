    for the prognosis of BC patients.


    The rest of this chapter is organized as follows. Section 8.2 provides the materials
    and methods. Whereas the multiomics analysis and results are presented in Section
    8.3, the final section concludes the chapter.


    # 8.2 MATERIALS AND METHODS


    In this section, we provide the details of online bioinformatics tools used in
    this study.


    # 8.2.1 ULCAN Web


    CALD1 mRNA and protein expression were examined with TCGA level 3 RNA-seq and
    clinical proteomic tumor analysis consortium (CPTAC) data, respectively, using
    ULCAN web (ualcan.path.uab.edu) [10]. A student''s t-test was used to analyze
    the data, and a p-value of 0.05 was considered significant. Positively co-expressed
    genes of CALD1 in GBM were retrieved from the ULCAN web. Co-expression coefficient
    r value > 0.30 and P ≤ 0.01 was considered to extract co-expressed genes in this
    analysis.


    # 8.2.2 GEPIA2 Web


    CALD1 mRNA expression in GBM and normal tissue was examined with TCGA level 3
    and genotype tissue expression (GTEx) RNA-seq data using GEPIA2 web (gepia2.cancer-pku.cn)
    [11]. A student''s t-test was used to analyze the data, and a p-value of 0.05
    was considered significant.


    # 8.2.3 Human Protein Atlas


    The expression of CALD1 protein in GBM tissues and normal tissues was examined
    using immunohistochemistry (IHC) staining data from the Human Protein Atlas (proteinatlas.org)
    [12]. IHC staining was performed using the HPA017330 antibody targeting CALD1.


    # 8.2.4 cBioPortal Web


    Mutations and Copy number alterations (CNAs) of CALD1 in GBM were examined using
    TCGA datasets via the cBioPortal web (cbioportal.org) [13]. Also, the co-relationship
    between CALD1 mRNA expression and CNAs was analyzed using the cBioPortal web.


    # 8.2.5 Tumor IMmune Estimation Resource (TIMER) Web


    Using the TIMER web (cistrome.shinyapps.io/timer) [14], a prognostic relationship
    was examined between CALD1 mRNA expression and Glioblastoma (GBM) patient survival.
    Survival curves were analyzed using a threshold log-rank test using scan mode
    expression values. The significance level was set at p < 0.05.'
