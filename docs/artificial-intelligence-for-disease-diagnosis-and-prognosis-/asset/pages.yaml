    preparation. Major factors that decide the quality of the specimen include the
    sectioning technique, thickness of the tissue, tissue digestion, washing steps,
    detection kit, probe, and hybridization time. Therefore, we optimized the specimen
    preparation protocol to keep the specimen standard which is useful for automated
    analysis. We prepared 4-micron thick serial section slides in the order CISH-H&E-FISH
    for the proposed system. We used the VENTANA Ultra Red ISH DIG detection kit and
    INFORM HER2 Dual ISH DNA Probe Cocktail to estimate the number of copies of the
    HER2 gene in CISH slides. The hybridization time was 6 hours. Failure in the'
