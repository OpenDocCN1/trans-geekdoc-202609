    MACHINE LEARNING (ML) has attracted significant interest toward developing smart
    healthcare systems by providing intelligent clinical decision making especially
    on disease assessment and its associated risk prediction. At present, many diseases
    need to be identified at early stages to prevent the associated risk which can
    also play an important role in smart digital healthcare interventions. When ML
    is applied to clinical data it tries to interpret the data to suggest the best
    action that needs to be performed to improve the individual’s health. However,
    there remain significant challenges to incorporate the ML-based approach in a
    real-world setting such as performance between trained model and computational
    time, and so on. This chapter focuses on discussing the basics of the methodology
    of the ML approach for disease assessment and it also highlights different assessment
    aspects. Additionally, it will also discuss different disease detection and assessment-related
    application areas of the ML-based approach and its associated pros and cons. It
    will also elucidate different challenges of this approach and potential solutions
    to bring this ML approach in real-world settings for the benefit of humanity.'
