- pgno: 15
  md: '# Introduction to Artificial Intelligence (AI) for Disease Diagnosis and Prognosis
    in Smart Healthcare


    S. M. Riazul Islam

    Department of Computer Science, University of Huddersfield, Huddersfield, UK


    Faisal Tariq

    James Watt School of Engineering, University of Glasgow, UK


    Ghita Kouadri Mostefaoui

    Department of Computer Science, University College London, UK


    # CONTENTS


    +   1.1 AI Applications and Advantages ........................ 1

    +   1.2 AI Technologies ....................................... 2

    +   1.3 AI in Smart Healthcare ................................ 2

    +   1.4 Organisation of This Book ............................. 3


    THE INTELLECTUAL capability of animals, including humans, is known as natural
    intelligence. In contrast, intelligence demonstrated by machines is termed artificial
    intelligence (AI). An AI-driven system can perceive its environment and take the
    most favorable actions to achieve its goals. As such, AI-driven systems can independently
    find ways to solve problems, be able to conclude, and make decisions. In this
    chapter, we first provide an overview of AI applications, advantages, and technologies,
    followed by a discussion on AI in healthcare. Then, we present a short description
    of each chapter.


    # 1.1 AI APPLICATIONS AND ADVANTAGES


    Due to advancements in AI, we can find a significant collaboration between humans
    and machines in our daily lives. Like electricity or computers, AI is now a versatile
    technology with endless applications. AI has impacted various fields such as'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'agriculture, autonomous vehicles, gaming and home appliances. In addition,
    it has enhanced language translation, image recognition, customer service, finance,
    sales and marketing and many other domains. When it comes to human health, many
    healthcare service providers and related organisations are relying on AI.


    # 1.2 AI TECHNOLOGIES


    AI encompasses a wide range of tools and technologies. Whereas some of them are
    proven, others are emerging. Major subfields of AI are machine learning (ML),
    natural language processing (NLP) and computer vision (CV). It is worth noting
    that ML algorithms process large amounts of data and learn from them. There are
    different types of ML models and approaches such as supervised learning, unsupervised
    learning and reinforcement learning. Besides, deep learning (DL) models (another
    prominent family of ML methods), built on artificial neural networks, are widely
    used in AI applications. In addition, various other digital technologies and soft
    computing approaches, including the Internet of Things (IoT), fuzzy logic and
    genetic algorithms, play a significant role in developing AI-driven systems [1,
    2]. When it comes to the components of AI applications, it usually contains three
    key elements: Data, algorithms and human feedback. Therefore, ensuring each of
    these components is adequately structured and validated for developing and implementing
    AI applications is highly important.


    # 1.3 AI IN SMART HEALTHCARE


    The term “AI in healthcare” refers to the systematic use of AI technologies to
    analyze medical and healthcare data and extract actionable insights for improved
    healthcare services. The adoption of AI in healthcare simplifies the lives of
    patients, physicians, and care providers in less time, with reduced errors at
    lower cost. AI in healthcare has facilitated pharmaceutical companies to accelerate
    their drug discovery process. It has made clinical trial automation more straightforward
    and shortened the required time. AI-enabled medical robots can assist patients.
    In the era of big data, data-driven medicine has the potential to improve disease
    diagnosis and open the door to targeted therapy [4]. It has made brain diseases
    such as Alzheimer''s disease prediction and detection more accurate and precise
    [3, 4]. Researchers have uncovered many medical diagnostic systems using AI algorithms
    [5]. AI-driven systems are even effective in detecting, monitoring, and managing
    contagious diseases like coronavirus (COVID-19) [6].


    Because of its immense and broad business opportunities, big high-tech firms are
    also studying and implementing AI technologies to solve practical problems in
    healthcare. For example, Amazon Comprehend Medical is an NLP service that uses
    ML for disease diagnosis from health data. IBM Watson Health is a digital tool
    that provides cloud, data and AI solutions for many medical problems. Also, Google
    Health and Samsung Health can track various aspects of daily life, contributing
    to people''s well-being.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'However, the application of AI in the healthcare field requires special attention,
    given the direct implications for human life and well-being. Rapid progress in
    AI leads to the possibility of exploiting healthcare data for designing practical
    tools for the automated diagnosis of chronic diseases such as dementia and diabetes.
    Data is the fuel for any AI application. On the other hand, in the medical domain,
    data can be challenging to obtain, mainly for privacy concerns. That makes the
    combination of both AI and healthcare a significant research challenge. The role
    of this book is to explore the advances, opportunities, and challenges of AI in
    healthcare solutions. We highlight the current research trends in applying AI
    models to various disease diagnoses and prognoses to make healthcare more effective
    and efficient.


    # 1.4 ORGANISATION OF THIS BOOK


    In Chapter 2, we provide a comprehensive overview of ML approaches for human disease
    assessment along with their benefits and shortcomings. In addition, the chapter
    explains the challenges associated with healthcare applications in real-world
    settings.


    Chapter 3 provides an overview of the potential applications of precision medicine.
    It explains the interplay between data science, AI, and ML in the context of precision
    medicine realization. Moreover, the chapter suggests a useful road map for the
    developers to apply precision medicine to futuristic healthcare solutions.


    Chapter 4 presents the recent developments in drug response prediction methods
    using ML algorithms. It discusses both the monotherapy and drug combination prediction
    methods. The chapter also provides an overview of pharmacogenomic data selection
    methods and relevant ML algorithms.


    Chapter 5 presents a thorough tutorial on AI-based skin disease diagnosis. It
    first introduces the skin diseases and then subsequently describes the image acquisition
