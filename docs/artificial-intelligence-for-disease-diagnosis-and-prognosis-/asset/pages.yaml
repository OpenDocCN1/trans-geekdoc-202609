    captured frames and the sender [50].


    +   - *Session key establishment*: Once the authentication process is achieved
    successfully, a session key should be created and exchanged in a secure manner
    for subsequent communication between the nodes [91].

    +   - *Forward secrecy*: This implies that the session key must still be secured
