    PRECISION MEDICINE applications are growing and creating tremendous opportunities
    to shape the future of healthcare. Though it is currently more visible in oncology,
    other domains such as precision medication and rare/genetic diseases are no exception.
    It also demonstrated some promise in treating COVID-19. The data-driven approaches,
    artificial intelligence (AI), and machine learning (ML) are rightfully improving
    the traditional symptom-driven practice of medicine and changing the mode of medicine
    from “reactive” to “predictive.” Advancements in genetics, the availability of
    genetic data, fast and accurate genome and transcriptome sequencing, and computational
    tools allow creating personalized treatment plans. We are motivated to inspect
    the potential applications of precision medicine in oncology and beyond. We intend
    to describe the features of famous and powerful bioinformatics tools and techniques.
    What role data science, AI, and machine learning can play in boosting the practicality
    of precision medicine will be an important thesis of this chapter. Finally, we
    aim to propose a comprehensive roadmap for a developer and implementer community
    to apply for precision medicine in futuristic healthcare solutions.


    # ### 3.1 INTRODUCTION


    Precision medicine is a fledging paradigm that holds the potential to revolutionize
    medicine and healthcare [1]. Various people describe precision medicine differently
    since related terms personalized, stratified, and individualized medicine are
    used across multiple disciplinary domains, but recently precision medicine has
    become'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'a ubiquitous term [1, 2]. Precision medicine also referred to as precision
    health, is an approach to consider disease based on patient-individual data, including
    diagnoses, phenotype, biologic findings, environmental factors, demographic information,
    and lifestyle factors [3].


    Precision medicine is an attention-grabbing area of research that has the potential
    to bring diverse communities together to deal with heterogeneity in clinical,
    genomic, and environmental information that influences patient care. It is an
    exciting area of research for the research community to exploit technological
    advancements for common goals. However, it is challenging to grasp the technicalities
    involved in drawing relationships among different prospects in this cross-disciplinary
    research field.


    The paradigm shift from traditional general and guideline-specific therapy toward
    personalized and patient-specific precision medicine is possible due to advancements
    in investigation tools, biomarker technologies, and AI use in healthcare [4].
    Traditionally, a general approach is considered to leverage the average conditions
    and clinical outcomes for the patients of interest, while precision medicine entails
    the individual lifestyle, gene variability, and environment [5]. As a result,
    traditional approaches may work for one cohort of patients and not for the other,
    whereas precision medicine is highly likely to be effective for each cohort of
    patients based on their individualistic characteristics and conditions. In addition,
    precision medicine has changed the signs or symptoms approach that deals with
    patients in the same way if they have the same symptoms with a target-oriented
    approach that allows each group of patients to be treated correctly with the proper
    treatment.


    # 3.2 THE EVOLVING PARADIGM OF PRECISION MEDICINE


    Precision medicine is rapidly evolving, with the advent of innovative genome sequencing
    technologies [6], especially the advances in next-generation sequencing (NGS)
    technology have spurred precision medicine applications to gauge personalized
    therapies and improve outcomes of patient care [7]. NGS allows sequencing of long
    sequences consisting of a high number of nucleotides in a short period at a reasonable
    cost [8, 9]. Nevertheless, the success of practicing precision medicine at the
    point of care requires smooth access to the genomic variant data and their correct
    interpretations [10]. Among the three main types of NGS sequencing, targeted sequencing
    (TS) is more practical in the context of precision medicine due to the lower costs
    and the higher depth, particularly for the discovery of new druggable targets
    [9, 11]. Furthermore, blasting services such as NCBI BLAST (Basic Local Alignment
    Search Tool) [12] facilitates target sequence matching with reference genome sequences
    passed in a query. Depending on the size of input and type of sequence, alignment
    results are obtained relatively quickly, making the processes suitable in actual
    setups.


    Other bioinformatics tools are available to make knowledge-based interpretation
    of variant data a reality at the point of care. For instance, TBTools is a stand-alone
    tool with over a hundred functions and a user-friendly interface designed for
    big data analyses, ranging from bulk sequence processing to interactive data visualization
    [13]. GMAP (Genomic Mapping and Alignment Program) [14] is another tool for NGS
    sequence mapping working on genomic, transcriptomic, and epigenomic data.'
