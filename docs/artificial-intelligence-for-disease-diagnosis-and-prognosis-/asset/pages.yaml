  img_proc: true
- pgno: 275
  md: '+   Availability: WBAN provides critical services. The adversary may launch
    an attack to disrupt the communication between the caregivers and the sensor nodes
    [3]. Disrupting the network’s operation may endanger the patient''s life. Therefore,
    maintaining the ability to access the required data under any circumstances is
    a crucial requirement.


    +   Data Authentication: When the integrity requirement is fulfilled, the receiver
    can ensure that the received data is intact and has not been modified during the
    transmission phase. However, the receiver cannot verify that the received message
    was sent by the original sender, which it is believed to be [14]. Therefore, to
    achieve data authentication, IEEE 802.15.6 standard defines the message authentication
    code (MAC) in order to ensure that the received message is sent by the original
    sender.


    +   Data Freshness: Data freshness is an essential requirement to ensure that
    no adversary can capture messages and replay them later [44]. A replay attack
    may cause instability and confusion in the network and could make the physicians
    take wrong decisions based on inaccurate information. Two levels of freshness
    can be achieved, strong and weak freshness. In strong freshness, the received
    message must be in order and on time; however, there is no guaranteed delay in
    the weak freshness.


    +   Secure Management: Cryptographic security countermeasures, such as authentication,
    encryption, and integrity validation require security keys. Therefore, secure
    management is essential to ensure that the security keys are distributed in a
    secure manner [43].


    There are three levels of security defined in the IEEE 802.15.6 standard. All
    nodes, including the sink, have to choose one of these levels in accordance with
    their application requirements.


    +   Level-0 unsecured communication: In the first security level, there is no
    security countermeasure applied. Unsecured frames are transmitted without authentication,
    encryption, integrity, or even replay defence.


    +   Level-1 authentication: In the second security level, authenticated frames
    are exchanged but not encrypted. Moreover, integrity validation and replay defence
    are provided; however, no confidentiality and privacy protection.


    +   Level-2 authentication and encryption: The third security level provides the
    highest security. Authenticated and secured frames are exchanged at this level.
    Moreover, confidentiality, privacy protection, replay defence, and integrity validation
    are all provided at this level.


    During the association process, each node and the hub need jointly to select one
    of the aforementioned levels based on their respective requirements. The security
    key generation is shown in Figure 15.3. A pre-shared master key (MK) is activated
    or established during the association process for secure unicast communication.
