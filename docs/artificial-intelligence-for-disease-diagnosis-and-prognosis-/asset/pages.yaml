    # 7.6.1 Singular Nuclei Detection


    The proposed method utilizes machine learning for detecting singular nucleus.
    A non-singular nucleus contains overlapped regions or partially missing regions.
    Including non-singular nuclei in the quantification compromises the reliability
    of the HER2 score as it misleads localizing and counting signals. Therefore, the
    proposed method selected the nuclei for quantification in two stages: The candidate
    detection stage and the selection stage. The candidate detection stage includes
    all possible singular nuclei which are then scored in the selection stage. Only
    high-score nuclei are used to make'
