    # 2.1.1 Methodology for Disease Assessment


    Identifying a disease accurately is a huge challenge in the field of medical treatment.
    It is felt more severely in recent days with the introduction of COVID in our
    lives. The detection of COVID and its effect on our bodies may take a long time.
    The state of the patient can degrade significantly within that period, which may
    cause permanent damage to the body or even death. Overcoming this challenge can
    remarkably decrease the risk of diseases and create the scope for initial treatment
    that may save one from permanent damage. The procedure of identifying a disease
    and its intensity is formally known as disease assessment [7]. The difficulty
    of the entire process of disease assessment can vary based on the disease itself
    or the approach taken. With the advancement of technology, most approaches are
    ML-based regardless of the disease type. X-ray images are now classified using
    a computer vision-based AI model. The model needs to be built systematically to
    do such assessments using the ML/AI model. The approach can differ depending on
    the application and disease, but most follow a usual course.


    First is data collection. Data collection is referred to as the activity of gathering
    data from different types of sources according to our needs and entering the data
    into one single framework. It is one of the most important works in the entire
    process, and can be a bit tedious depending on the approach and need. If we want
    to determine the effect of COVID on a patient from chest X-rays, we need to collect
    X-ray images of thousands of people. Images from patients who are in different
    stages of COVID need to be collected. Data of those that don''t have a record
    of COVID is also necessary to'
