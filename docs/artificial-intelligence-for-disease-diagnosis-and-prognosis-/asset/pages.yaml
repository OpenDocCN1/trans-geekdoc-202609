  md: 'Babaie et al. investigated the performance of different machine learning methods
    for detecting tissue-fold artifacts when the annotated dataset is limited [33].
    This method utilized the transfer learning technique for 5 different CNN models
    which include VGG16, Google Net, Inception V3, ResNet 101 and Dense Net 201. After
    that the performance of traditional machine learning methods such as decision
    trees, SVMs, and KNNs were compared with the traditional method. Further, the
    feature extraction capability of CNN was combined with the SVM classifier which
    depends on a limited datapoint to classify an image. The Dense Net 201 and SVM-based
    classifiers outperformed others providing an accuracy higher than 96%. However,
    the generalized performance was 81% which is significantly lower. In the experiment,
    multiple tissue organs were considered. Including images from different stains
    and scanners is important to ensure the robustness of the method.


    Janowczyk et al. proposed an open-source tool for checking the quality of WSI
    images for automated analysis [34]. This tool relies on the supervised method
    using a set of image features such as brightness, contrast, edge and others to
    identify image regions that are suitable for analysis. The method was demonstrated
    on 450 images at 40× magnification to identify artifact-free regions in the presence
    of tissue-fold, air-bubble, ink mark, and focus blur artifacts. This experiment
    was performed using a machine with four hyperthreaded core processors and it took
    130 minutes for evaluating 450 images. The high computation time is expected as
    the method relies on a high-resolution image. The method established 95% concordance
    with the pathologist’s manual evaluation. However, the detail of the method is
    not available for reproducing the results, to the best of our knowledge. The performance
    of the method degrades in the presence of compression artifacts, stromal regions,
    or faintly stained regions in the WSI. Moyes A et al. presented another unsupervised
    method to separate the stains in a histological slide and detect stain-dependent
    artifacts such as color pigments [35]. Smit et al. proposed a multi-class pixel-wise
    semantic segmentation method that identified the source of the quality degradation
    in the WSI so that appropriate actions can be taken to fix the issues. This work
    utilized a diverse dataset which included images from multiple tissues, stains,
    and scanners and segmented the major artifacts such as tissue fold, air bubble,
    ink mark, dust, and focus blur. However, 85% data was used for training and only
    15% for the evaluation of where the highest dice coefficient score was 0.91.


    # 11.6 DISCUSSION


    In digital pathology, the WSI serves as the basis for analysis and diagnosis.
    For a reproducible automated whole slide imaging system, it is necessary to eliminate
    unnecessary parts and useless artifacts of the WSI thereby analyzing only those
    areas that are sufficient in quality and relevant clinically. The first article
    regarding artifact detection was published less than two decades ago. Since then,
    not many articles published on this subject. A few methods utilizing different
    image analysis techniques are proposed for detecting artifacts from digital pathology
    specimens, these methods range from classifying image patches with an artifact
    to locating the precise boundary of artifact for segmentation. Most of these methods
    either detect'
  merge: -1
  img_proc: true
- pgno: 212
  md: "tissue artifacts or scanning artifacts but for a complete-reproducible automated\
    \ image analysis system, both artifacts should be considered for quality assurance\
    \ of WSI. All these papers have shown promising results for detecting specific\
    \ artifacts, but these results are not sufficient to warrant the method's generalized\
    \ performance to unseen data. Therefore, it is necessary to undertake a comprehensive\
    \ investigation of how well a method performs for detecting all the common tissue\
    \ and scanning artifacts from unseen images of different organs, different stains\
    \ slide prepared at different labs, and scanners by different scanners using the\
    \ different scan profiles. Moreover, only a few papers were intended for developing\
    \ a practical system by integrating the quality evaluation with the analysis system.\
    \ Time is an important consideration for making a system practical. However, detecting\
    \ some artifacts such as focus blur and noise from a low-resolution image is challenging\
    \ and using a high-resolution image will increase the detection time significantly,\
    \ making the system less practical. On the other hand, artifacts such as tissue\
    \ folds, air bubbles, and ink marks can be detected from a low-resolution image\
    \ at high precision. Therefore, an efficient approach could be utilizing the multi-resolution\
    \ imaging system of WSI where the different resolutions will be used for detecting\
    \ different artifacts depending on the nature of the artifact. Lastly, the design\
    \ of the quality assurance system should be practical and user-friendly for its\
    \ successful integration with the automated image analysis and diagnosis system\
    \ in the pathology pipeline. Furthermore, the results of the quality evaluation\
    \ system can be utilized for efficient focus point selection by integrating the\
    \ quality assurance system with the WSI scanning system. This type of pipeline\
    \ of integrated systems is useful for smart healthcare where an automated system\
    \ evaluates the competency of the specimen, selects suitable regions from the\
