  md: 'further divided into two sections, the traditional machine learning approach
    and the deep learning approach. In this chapter, the traditional machine learning
    approach means the methods that utilize SVM, Naive Bayes, K-means clustering,
    linear regression, logistic regression, or similar models where the selection
    of features to feed the model is made by the user or by a separate method. Traditional
    machine learning models are efficient for solving classification, regression,
    clustering, and dimension reduction problems especially when the dataset is limited.
    The deep learning method means the methods where the selection of features to
    train the model is made by the method itself. These models can learn features
    from the given data such as images or videos and identify significant features
    for the given task without experts explicitly identifying them. Recent research
    has shown that the deep learning-based method particularly CNN achieves better
    performance than traditional machine learning-based methods while it requires
    a significantly larger dataset, higher computation power and time for training.
    Examples of some popular CNN models include VGG16, ResNet, InceptionNet, GoogleNet,
    and MobileNet. There are some other methods for detecting artifacts that rely
    on different techniques such as the Tanengrad operator, Laplacian operator, the
    magnitude of Sobel gradient or the behavior of point spread function (PSF) of
    the scanner. Table 11.1 shows the list of the reviewed artifact detection methods
    in this chapter. Some commercial artifact detection applications are also available,
    but the details of these works are not sufficient for reproducing the experiment.
    Therefore, they are not included in this table.


    # 11.5.1 Image Enhancement-Based and Other Methods


    The tissue folds contain multiple layers of tissue, have a higher thickness and
    soak more dye compared to the normal tissue areas. As a result, the tissue fold
    appears dark in color having higher saturation and lower brightness compared to
    the normal tissue areas. Most of the image enhancement-based methods are motivated
    by this fact and utilize the saturation difference between the tissue fold and
    normal tissue as the major property to identify tissue-fold pixels. The saturation
    difference property of the tissue fold motivated the development of a color-shifting
    method to enhance the color metric difference in folded and non-folded areas.
    One effective way to enhance the color metric differences without changing its
    hue is to transform the RGB image to HSV (hue, saturation, and value) image and
    then modify the saturation or luminance component. Increasing the saturation decreases
    the luminance of the image and vice-versa.


    Pinky A Bautista et al. proposed a similar color enhancement-based tissue-fold
    detection method [21]. In their method, they have shown that the shifting and
    scaling can be directly applied to the RGB values of the pixel to enhance the
    luminance and saturation accordingly without transforming the RGB image to the
    HSV space. This method modified the saturation by adding some constant to the
    RGB values of the pixel which is considered as color enhancement by shifting the
    saturation. However, adding a constant to the RGB values decreases the saturation
    and increases the luminance of the pixel. On the contrary, adding a constant to
    the saturation value of the pixel in HSV space increases the saturation and decreases
    the luminance.'
