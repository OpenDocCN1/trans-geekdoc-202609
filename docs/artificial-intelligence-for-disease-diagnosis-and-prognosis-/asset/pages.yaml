    # 5.7 EVALUATION METRICS


    Most of the metrics for evaluating the performance of skin disease recognition
    and classification systems are based on the information achieved from the confusion
    matrix (the table for presenting the performance of the prediction model). In
    this matrix which is designed for both binary and multi-class classification cases,
    each entry indicates the number of predictions/classification made correctly or
    incorrectly by the model. As shown in Figure 5.32, for the binary classification
    problem, there are two classes of positive and negative. In this confusion matrix,
    TP, TN, FP, and FN represent True Positive, True Negative, False Positive, and
    False Negative, respectively. True Positive refers to the number of predictions
    made by the model through which the sample is correctly classified as positive
    class while the actual class of the sample is also positive. Similarly, if the
    actual class is negative and the model also predicts its class as negative, it
    is considered to be a True-Negative prediction. False Positive is the number of
    incorrect predictions by the classifier in which the actual class of negative
    is predicted as positive. In contrast, False Negative refers to the number of
    misclassifications where the model predicts the actual class of positive as negative.


    Unlike binary classification, multi-class classification is based on the predictions
    made by the system for more than two classes. So, here, there are no positive
    or negative classes and we need to find TP, TN, FP and FN for each class individually
    based on the information we obtain from the whole table. One simple example of
    a three-class classification task with the calculation of the values of these
    four parameters for class 1 are presented in Figure 5.32. Similarly, they can
    be calculated for'
