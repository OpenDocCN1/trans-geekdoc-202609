    # 6.6 CONCLUSION


    COVID-19 is a developing pandemic disease that has put the health of many people
    throughout the world in danger in a very short time. It has a direct effect on
    lung cells and, if not detected early, can result in permanent damage, even death.
    X-ray or CT images, as well as PCR 15 results, are used by professionals to accurately
    detect the disease. Instead of COVID-19, the PCR results reveal another form of
    lung infection, such as respiratory tuberculosis. DL networks were utilized to
    conduct a wide-ranging'
