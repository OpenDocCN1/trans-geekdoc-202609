  md: 'use histology images. Our task is to detect the mitosis cell in the image.
    Mitosis count is a critical indicator for the diagnosis of breast cancer. Many
    machine learning and deep learning techniques like SVM, Decision Tree, CNN, etc.
    have been applied [6,7]. But very few deep learning models which have a larger
    number of layers have been applied due to various computation and data-related
    problems. In this case study we are going to apply U-Net for image segmentation
    and then Faster R-CNN for object detection. Early identification is critical for
    BC because it improves survival rates, reduces treatment risks, and lowers mortality.
    This chapter is organized as follows: Section 10.2 describes the several types
    of breast cancer datasets. Section 10.3 describes related works and concludes
    in Section 10.4.


    # 10.2 DATASETS


    Collecting datasets for breast cancer cases is a critical task for assisting researchers
    in their diagnostic tasks. The Breast Carcinoma Subtyping dataset, the PatchCamelyon
    dataset, the Breast Cancer Semantic Segmentation dataset, and the Breast Cancer
    Histopathological Dataset. The dataset is presented in this survey to explain
    the roles of each of them in several recent research studies on breast cancer
    diagnosis.


    # 10.2.1 Wisconsin Breast Cancer Dataset (WBDC)


    Wisconsin Breast Cancer Dataset (WBCD) downloaded from the UCI ML Repository in
    this part. This dataset is utilized to separate between cancerous and benign tumors.
    In Wisconsin, all features were derived from fine needle aspirate images that
    depict nucleus features. In Wisconsin hospitals, the WDBC contains the characteristics
    of 569 patients (357 benign and 212 malignant cases) and 32 qualities. The measurement
    result is represented by each property. The identifying number and patient diagnosis
    status are the first and second attributes, respectively. Standard error, mean,
    and the least of red nucleus traits are the remaining properties.


    # 10.2.2 Breast Carcinoma Subtyping (BRACS)


    The Breast Carcinoma Subtyping (BRACS) dataset is a vast collection of annotated
    Hematoxylin and Eosin (H&E)-stained pictures designed to aid in the diagnosis
    of breast lesions. There have been 547 Whole Slide Images (WSIs) and 4539 Regions
    of Interest (ROIs) retrieved from the WSIs in BRACS. Each WSI and its associated
    ROIs are categorized into several lesion types by a group of three board-certified
    pathologists. BRACS distinguishes between three types of lesions: Benign, malignant,
    and atypical, which are further subdivided into seven categories [8].


    # 10.2.3 Breast Cancer Semantic Segmentation (BCSS) Dataset


    The BCSS dataset comprises approximately 20,000 tissue region segmentation annotations
    from The Cancer Genome Atlas breast cancer pictures (TCGA). Using the Digital
    Slide Archive, pathologists, pathology residents, and medical students collaborated
    to annotate this large-scale dataset as shown in Figure 10.1. It allows for the
    creation of very accurate tissue segmentation machine-learning algorithms [9].'
