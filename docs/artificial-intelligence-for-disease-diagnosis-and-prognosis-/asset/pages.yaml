    WHOLE SLIDE IMAGING (WSI) with artificial intelligence (AI) has become a spearhead
    for smart healthcare in diagnostic pathology. This chapter discusses an automatic
    system designed using WSI and AI technology to grade invasive breast cancer patients
    enabling therapeutic decisions. Cancer is one of the top five leading causes of
    death in the United States and invasive breast cancer is the most'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'worrisome form of cancer as its treatment is complicated and requires considering
    numerous factors. This chapter addresses the shortcomings of current practices
    for selecting patients for therapy, introduces WSI technology for automated analysis,
    and describes how the proposed system utilizes WSI and AI to bridle the challenges
    of grading patients for therapy. The result of the validation experiments which
    ensures the potential of the system for clinical implementation is also included.


    # 7.1 INTRODUCTION


    Breast Cancer (BC) is one of the most frequent forms of cancer. BC becomes invasive
    when cancer-affected cells travel from their origin to the surrounding breast
    tissue through the bloodstream or lymphoid system. According to the most recent
    study of the National Cancer Institute (NCI), 12.9% of women born in the United
    States have the chance to develop invasive BC [1]. Meaning, 1 in 8 women will
    be diagnosed with invasive BC at some point during her lifetime and this rate
    is increasing over time, despite all the research for decades. In 2021, an estimated
    330,840 new cases of invasive BC were expected to be diagnosed in women in the
    United States [2], while this count was 268,600 in 2019 [3]. This risk factor
    is lower for men, 1 in 833 men has the risk of being diagnosed with invasive BC.


    Besides lung cancer, invasive BC has the highest death rate for women. Human epidermal
    receptor growth factor receptor 2 (HER2) positive is one of the most aggressive
    forms of BC that decreases survival rates and high-recurrence. Approximately 25%
    of BC patients are HER2 positive [4,5]. HER2 (also known as ERBB2) is a member
    of the human epidermal growth factor receptor family. The HER2 receptor is responsible
    for the growth, division, and repair of a normal cell. In an HER2-positive BC
    patient, the HER2 gene makes too many copies of itself which leads to uncontrolled
    growth and division of breast cells. Therefore, HER2 is used as a predictive and
    prognostic biomarker not only for BC but also for gastric and stomach cancer as
    well. HER2-positive tumors respond differently to the conventional treatment plans
    of BC than the HER2-negative tumors. In clinical practice, HER2 assessment is
    performed routinely for all breast cancer patients to determine the HER2 amplification
    status and to decide on the treatment plan.


    The treatment of invasive BC patients includes surgery, chemotherapy, radiation,
    hormone therapy, and targeted therapy. These treatments can be given independently
    or in a combination depending on the size of the tumor, location of the tumor,
    type of cancer, stage of cancer, HER2 status, and some other factors. In 1998,
    the United States Food and Drug Administration approved trastuzumab for the treatment
    of HER2-positive patients of BC and gastric cancer. Later in 2010, it was approved
    for HER2-positive stomach cancer patients. HER2-positive patients benefit from
    anti-HER2-targeted therapy such as trastuzumab or lapatinib. Trastuzumab attaches
    itself to the HER2 protein, thus blocking cancer cells from receiving growth signals.
    Such targeted therapy helps increase the survival time if given appropriately
    [6]. But if this treatment is given to an HER2-negative patient it may cause cardiac
    toxicity and other serious side effects [7]. Expense is another consideration
    [8, 9]. A single false HER2-positive decision may cost $50,000 plus the cost of
    mitigating the side effects'
