    THE IMPLEMENTATION of Artificial Intelligence (AI) and Internet of Things (IoT)
    are extensively increasing in different field of expertise for automation of the
    processes. And the use of AI and IoT in the field of healthcare contributed automatic
    devices which greatly serve modern civilization in reducing time and cost. However,
    there is a security concern when employing autonomous devices that can disclose
    one''s personal information. Therefore, in this study we propose a state-of-the-art
    pipeline to build smart healthcare systems with integrated security. In our study,
    we have proposed an app, which will collect skin lesion images of patients with
    proper authorization of the patients from any place. Collected data will be sent
    to the cloud where a Computer-Assisted Diagnosis (CAD) system is deployed to classified
    the skin lesion condition. Our proposed CAD established using deep learning-based
    technology to identify a dermoscopic image such as skin lesions. In this study,
    our focus was mainly on classifying seven various types of skin lesions, particularly
    early-stage melanoma, in order to suggest to patients a recommendation system
    for taking the'
