  md: '# 7.5.2 Artifact Detection for Quality Evaluation


    We detected tissue fold and air bubbles as these are the most common artifacts
    in pathology. The proposed method utilized low-resolution WSI for detecting artifacts
    using support vector machines (SVMs). Two binary SVM classifiers were trained
    using a set of selected features: One for detecting tissue fold and the other
    for air bubbles. A set of 9 suboptimal features were selected for each classifier
    from a bank of 126 features which includes conventional GLCM features, rotation
    invariant GLCM features, and other features derived based on the physical properties
    of artifacts. We utilized the sequential feature selection (SFS) method which
    provides a suboptimal feature set by evaluating its performance for the classification.
    The features were ranked, and a set of features selected based on the average
    classification error in a 10-fold cross-validation experiment. We relied on the
    SFS as it is computationally faster than the optimal feature selection method
    such as the branch and bound method, especially when the feature space is large.
    The orientation of artifacts may rotate at an arbitrary angle from slide to slide,
    thus we trained the SVM classifiers to achieve rotation invariant classification.
    In our experiment, we have found that using rotated images for augmenting the
    training data results in better accuracy for the classifier than using rotation-invariant
    features. Thus, we trained the classifiers using the selected features derived
    from original images and their rotated versions. Each image was rotated in 15-different
    angles starting from 15 to 345 degrees.


    We experimented with 1× and 5× magnification and analyzed the effects of resolution
    on artifact detection accuracy. Using 5× magnification instead of the 1× image
    improves the artifact detection accuracy but the detection time increases significantly.
    In the 4-fold cross validation, the average classification accuracy was 99.40%
    for 5× magnification WSI compared to 98.11% for 1× magnification. The detection
    time varied from 4 to 10 seconds for 1× magnification depending on the WSI dimensions
    while it ranged from 14 to 50 sections. For this experiment, we used 5 WSIs and
    a personal notebook with a 2.6 GHz Intel Core i5 processor (without any external
    graphics card) for detecting the artifacts using the proposed method.


    We also experimented with traditional machine learning methods such as SVM and
    deep learning methods such as CNN for detecting artifacts when a limited number
    of samples is available. The accuracy was 98% for detecting tissue fold and 97%
    for air bubbles using SVM. While using CNN the best accuracy was 87.33% and 92.17%
    for tissue-fold and air bubble detection, respectively. In the CNN experiment,
    we fine-tuned the final layers of a VGG16 model which was pre-trained on the ImageNet
    dataset. We utilized data augmentation for training the model and then investigated
    the model’s performance for different epochs, batch sizes, learning rates, dropouts,
    and optimizers. The result of the study suggests that the SVM classifier with
    optimally selected features yields more accurate and stable classification than
    CNN-based model when the amount of training data is limited. Moreover, SVM is
    simple to implement and computationally fast.


    The proposed method used 1× magnification image and divide the WSI into non-overlapped
    images blocks of 100×100 pixels. Then two different SVM classifiers detected tissue-fold
    and air bubble artifacts for these blocks. Image blocks'
