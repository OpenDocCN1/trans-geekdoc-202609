    # 9.5 CONCLUSION


    Neurodegenerative disease detection and diagnosis has now become a promising research
    area. Whereas, PD is a long-term disorder that worsens with time. As a result,
    early identification of PD should receive a lot of attention. In this study, we
    discussed from the state-of the-art techniques to some common DL and ML classification
    techniques that have been applied to PD detection. Various feature extension and
    reduction methods have been suggested in order to improve classification performance.
    As a result, the methods described above can provide a reliable solution for detecting
    PD in its early stages.


    In this chapter, we have suggested a method that acts as a bridge between ML and
    DL techniques as well as unweighted symptoms that can be averted by the dataset.'
