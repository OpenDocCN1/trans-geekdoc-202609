  - 4.6 精确说明如何修改 AND-OR-GRAPH-SEARCH 算法，在不存在无循环计划时生成循环计划。你需要处理三个问题：为计划步骤标记，使循环计划能够指回计划的早期部分；修改
    OR-SEARCH，使其在发现循环计划后仍继续寻找无循环计划；并增强计划表示，以指示计划是否为循环计划。下面展示算法在 (a) 滑稽吸尘器世界，以及 (b)
    滑稽、紊乱吸尘器世界的工作情况。你可以使用电脑实现来验证结果。
- - '##'
  - 4.7 在 第 4.4.1 节 中，我们引入了信念状态来解决感知无法观测的搜索问题。一个动作序列解决感知无法观测问题，如果它能将初始信念状态 *b* 中的每一个物理状态映射到目标状态。假设代理知道
    *h*^(\*)(*s*)，即在完全可观测问题中解决物理状态 *s* 的真实最优成本，对于信念状态 *b* 中的每一个状态 *s*。请用这些成本来找出一个适当的启发函数
    *h*(*b*)，用于感知无法观测问题，并证明其适当性。评论该启发函数在 第 4.14 图 的感知无法观测吸尘器问题中的准确性。A^(\*) 在该问题上表现如何？
