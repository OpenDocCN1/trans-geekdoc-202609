  - 变量域 `distributed constraint satisfaction` 研究在存在若干代理人时如何解决 CSP，每个代理人控制一部分约束变量。自
    2000 年以来，每年都有针对该问题的工作坊，并且在其他地方也有良好覆盖 (`Collin et al.`, 1999; `Pearce et al.`,
