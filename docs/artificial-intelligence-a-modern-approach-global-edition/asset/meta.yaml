  - 4.9 第 139 页 假设给定的动作在同一信念状态内的任何物理状态下具有相同的执行成本。（这导致一个明确的步骤成本的信念状态搜索问题。）现在考虑当该假设不成立时会发生什么。在这种情形下，最优性的概念是否仍然有意义，或需要修改？请同时考虑对“执行成本”的不同定义，例如：使用该动作的最小物理成本；最大物理成本；一个包含下限（最小成本）和上限（最大成本）的成本区间；或者仅保留该动作的所有可能成本集合。针对每种情况，探讨在必要时对
    A^(\*) 进行修改后，是否仍能返回最优解。
