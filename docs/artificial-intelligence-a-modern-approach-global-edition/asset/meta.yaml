- - '#'
  - 迭代加深搜索（或迭代加深深度优先搜索）是一种通用策略，常与深度优先树搜索结合使用，用于确定最佳深度限制。它通过逐步增加限制——首先是 0，然后是 1，接着是
    2，以此类推——直到找到目标。当深度限制达到 `d`，即最浅目标节点的深度时，这将发生。算法如下图 `![Figure 3.18](img/#index_split_010.html#filepos393712)`
    所示。迭代加深结合了深度优先和宽度优先搜索的优点。与深度优先搜索一样，其内存需求较小：精确为 `O(bd)`。与宽度优先搜索一样，在分支因子有限且节点深度的路径成本是非递减函数时，它是完备的且最优的。`![Figure
    3.19](img/#index_split_010.html#filepos394196)` 展示了在二叉搜索树上 `ITERATIVE-DEEPENING-SEARCH`
    的四次迭代，目标在第 4 次迭代中找到。
