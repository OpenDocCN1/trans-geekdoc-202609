    # What is Supervised Learning?


    ![image](d2d_images/chapter_title_below.png)


    Supervised learning is a type of machine learning where the algorithm is trained
    on a labeled dataset, where each input data point is associated with a corresponding
    output label. The goal of supervised learning is to learn a mapping between inputs
    and outputs, so that it can make accurate predictions on new, unseen data.Supervised
    learning can be further divided into two categories: classification and regression.


    Classification


    Classification is a type of supervised learning where the output variable is a
    categorical variable. In other words, the algorithm is trained to classify input
    data into one of several predefined categories. Examples of classification tasks
    include image recognition, spam detection, and sentiment analysis.


    In classification, the algorithm is trained on a dataset where each input data
    point is associated with a label that indicates the category it belongs to. The
    algorithm then learns to map input data to the corresponding category, so that
    it can make accurate predictions on new, unseen data.


    There are several types of classification algorithms, including decision trees,
    support vector machines, and logistic regression. Each algorithm has its own strengths
    and weaknesses, and the choice of algorithm depends on the specific requirements
    of the task at hand.


    Regression


    Regression is a type of supervised learning where the output variable is a continuous
    variable. In other words, the algorithm is trained to predict a numerical value
    based on input data. Examples of regression tasks include stock price prediction,
    weather forecasting, and housing price prediction.


    In regression, the algorithm is trained on a dataset where each input data point
    is associated with a numerical value. The algorithm then learns to map input data
    to the corresponding numerical value, so that it can make accurate predictions
    on new, unseen data.


    There are several types of regression algorithms, including linear regression,
    polynomial regression, and support vector regression. Each algorithm has its own
    strengths and weaknesses, and the choice of algorithm depends on the specific
    requirements of the task at hand.


    Supervised learning has several advantages over other types of machine learning.
    First, because the output labels are known, it is easier to evaluate the performance
    of the algorithm. Second, supervised learning algorithms can be trained on relatively
    small datasets, which makes it a practical approach for many applications. Finally,
    supervised learning can be used for a wide range of tasks, from image recognition
    to time series forecasting.


    However, there are also some limitations to supervised learning. One of the main
    limitations is the requirement for labeled data. Labeled data can be expensive
    and time-consuming to obtain, and in some cases, may not be available at all.
    In addition, supervised learning algorithms can suffer from overfitting, which
    occurs when the algorithm becomes too specialized to the training data and performs
    poorly on new, unseen data.


    In conclusion, supervised learning is a powerful approach to machine learning
    that has been successfully applied to a wide range of tasks and applications.
    By understanding the strengths and limitations of supervised learning, businesses
    and organizations can choose the best approach for their specific needs, and make
    the most of the exciting potential of machine learning technology.'
