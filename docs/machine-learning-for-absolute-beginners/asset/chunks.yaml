    # III


    # 无监督学习


    ## 什么是无监督学习？


    ![image](img/chapter_title_below.png)


    无监督学习机器学习机器学习，其目标是在没有给出特定的待预测输出值的情况下，发现数据集内部的模式和关系。在无监督学习中，输入数据由一个或多个特征组成，但没有对应的目标变量或标签。


    无监督学习中缺乏标记数据使其成为了一项挑战性任务，因为算法必须完全根据输入数据的结构来识别模式和关系。尽管存在这一挑战，无监督学习仍许多重要的应用，例如识别相似数据点的聚类、检测异常以及发现复杂数据集中的隐藏结构。


    无监督学习算法有多种类型，每种算法都有自己的优缺点。常见的无监督学习算法包括：


    ### 聚类 (Clustering)


    聚类是一种无监督学习算法，它根据特征的相似性将相似的数据点分在一起。聚类的目标是识别出彼此相似且与其他簇不同的数据点簇。


    聚类是市场细分、图像分割和客户细分等任务的有用算法。然而，它受到距离度量选择和聚类数量敏感性的限制。


    ### 降维 (Dimensionality Reduction)


    降维是一种无监督学习算法，它在保留重要特征的同时减少输入数据的维度。降维的目标是通过通过识别最重要的特征并消除噪声来简化输入数据。


    降维是特征提取、数据可视化和数据压缩等任务的有用算法。然而，它受到信息丢失的限制，这使得解释简化后的数据变得困难。


    ### 异常检测 (Anomaly Detection)


    异常检测是一种无监督学习算法，用于识别不符合数据集其他部分模式的异常数据点。异常检测的目标是检测隐藏在大数据集中的异常，如欺诈、错误和缺陷。


    异常检测是欺诈检测、网络入侵检测和质量控制等任务的有用算法。然而，它受到异常检测方法选择和数据集大小敏感性的限制。


    除了这些常见的无监督学习算法，还有许多其他类型的无监督学习算法可用于不同类型的数据集和应用。


    无监督学习的主要优势之一是能够在没有特定预测输出值的情况下，发现数据集内部隐藏的结构和模式。通过使用无监督学习算法，企业和组织可以获得对其数据的新见解，并发现传统数据分析方法可能无法发现的关系趋势。


    然而，无监督学习也存在一些局限性。主要的局限性之一是结果解释的困难，因为算法可能会发现难以解释或理解的模式和结构。此外，无监督学习算法对输入数据的质量敏感，在噪声或不完整的数据集上可能表现不。


    总之，无监督学习是机器学习中一种强大的技术，应用于数据分析、模式识别和异常检测。通过理解不同类型的无监督算法及其优缺点，企业和组织可以根据特定需求选择最佳方法，并最大限度地发挥机器学习技术令人兴奋的潜力。


    # 关于无监督学习的聚类


    聚类是一种无监督学习算法，根据特征的相似性将相似的数据点分在一起。聚类的目标是识别出彼此相似且与其他簇不同的数据点簇。聚类是机器学习中重要的技术，应用于数据分析、市场细分、图像分割和客户细分。


    聚类中有两种主要的类型：基于质心的层次。基于质心的算法（例如 `k-means` 聚类）通过迭代将数据点分组成 `k` 个簇，其中 `k` 是用户指定的聚类数量。算法从随机选择
    `k` 个数据点作为初始质心开始，然后根据距离度量（如 `Euclidean distance`）将每个数据点分配给最近的质心。算法然后根据新的簇分配更新质心，并重复该过程直到质心不再显著移动。


    另一方面，层次聚类算法通过构建簇的层次结构来工作，每个簇要么是一个数据点，要么是较小簇的组合。算法从每个每个点视为单独簇开始，然后根据距离度量迭代合并最近的簇对。结果是一个被称为
    `dendrogram`（树谱）的树状结构，可以在不同层上进行切割以产生不同数量的聚类。


    基于质心和层次聚类算法都有各自的优缺点。基于质心的算法快速高效，但对初始质心的选择和聚类数量敏感。层次聚类算法更灵活稳健，但计算开销大且难以解释。


    除了这两种主要的聚类算法外，还有许多其他类型的聚类算法可用于不同类型的数据集和应用。这些包括基于密度的聚类、谱聚类和模糊聚类。


