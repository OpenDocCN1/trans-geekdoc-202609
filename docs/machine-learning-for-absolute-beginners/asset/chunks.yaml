    # 初学者的机器学习


    机器学习基础与应用简介


    Daniel Huston


    ## 引言


    《初学者的机器学习》这本书旨在为没有任何基础经验的读者介绍令人兴奋且快速发展的机器学习领域。机器学习是人工智能的一个分支，它使计算机能够从数据中学习，并根据这些学习做出预测或决策。


    本书以清晰易于理解的风格编写，使读者能够轻松机器学习的核心概念和技术。它假设读者对该主题没有先验知识，从最基础的开始，逐步建立读者对该领域的理解。


    本书涵盖了广泛的话题，包括数据预处理、分类、回归、聚类和深度学习。它还包含了实践示例和动手练习，让读者能够应用所学知识，并在机器学习方面获得实战经验。


    无论你是学生、专业人士，还是仅仅对学习机器学习感兴趣的人，这本书都为理解这一令人兴奋领域的基础提供了坚实的基础。读完本书后，读者将对机器学习的概念和技术有深入的理解，并为未来应对更多课题做好充分准备。


    # I 机器学习简介


    ### 什么是机器学习？


    机器学习是人工智能的一个子领域，允许计算机在没有显式编程的情况下从数据中学习。机器学习的目标是让机器在接触到更多数据时，自动提高其在给定任务上的性能。这项技术正在彻底改变从医疗到金融的许多行业，并预计在未来几年内继续增长和发展。


    机器学习基于这样观点：计算机可以像人类一样从数据中学习。为了教机器如何执行某项任务，我们需要提供代表该任务的示例数据集。然后机器使用统计方法分析数据，并识别与当前任务相关的模式。


    机器学习主要有三种类型：监督学习、无监督学习和强化学习。在监督学习中，机器在标记的数据集上进行训练，以便对新数据进行预测。例如，如果我们想训练机器来预测一封邮件是否为垃圾邮件，我们会为机器提供一个标记好的垃圾邮件或非垃圾邮件数据集。然后机器将根据其在数据中发现的模式，学习将新邮件分类为垃圾邮件或非垃圾邮件。


    在无监督学习中，机器没有获得标记数据。相反，它被赋予一个数据集并要求自行发现模式或分组。例如，如果我们想根据购物行为对客户进行分组，我们会为机器提供一个客户交易数据集，并要求它将相似的交易分组。机器将识别数据中的模式并将相似交易分组。


    强化学习是机器学习的一种，机器通过试错来学习。机器被赋予一个要执行的任务和一个奖励系统，告诉它执行任务的效果如何。然后机器尝试不同的动作，并学习哪些动作能带来最大的奖励。例如，如果我们想教机器下象棋，我们会为它提供一个奖励系统，对好的走法加分，对错误的走法扣分。机器将通过尝试不同的走法并学习哪些走法带来的奖励最大来学会下象棋。


