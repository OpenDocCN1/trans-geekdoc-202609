    b) The ability of objects of different classes to be treated as objects of a common
    parent

    c) The process of creating child classes from parent classes

    d) The process of defining interfaces and abstract classes that specify a contract
    of methods


    Correct answer: b) The ability of objects of different classes to be treated as
    objects of a common parent


