    正确答案：a) `Memcached`


    7. 哪种技术可以通过在频繁访问的列和表上使用适当索引来优化数据库查询？a) `Profiling` b) `Caching` c) `Lazy loading`
    d) `Query optimization`


    正确答案：d) `Query optimization`


    8. 哪种技术可以减少 PHP 应用程序中的 HTTP 请求数量？a) `Opcode caching` b) `Database optimization`
    c) `Asynchronous processing` d) `Combining CSS and JS`


    正确答案：d) `Combining CSS and JS`


    9. PHP 中可以使用哪个库来执行异步编程和处理非阻塞 I/O？a) `pthreads` b) `ReactPHP` c) `Doctrine ORM`
