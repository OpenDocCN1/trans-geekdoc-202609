    Correct answer: a) Opcode caching


    ## 16. Cache invalidation is the process of:

    a) Storing the results of expensive computations in memory

    b) Clearing cached data when it becomes stale or outdated

    c) Encoding and decoding JSON data

    d) Implementing access control mechanisms


    Correct answer: b) Clearing cached data when it becomes stale or outdated


    ## 17. HTTP caching in PHP leverages which of the following?

    a) Regular expressions

    b) HTTP headers

    c) Opcode caching

    d) Inheritance


    Correct answer: b) HTTP headers


    ## 18. Which superglobal variable is used to handle file uploads in PHP?

    a) `$_POST`

    b) `$_GET`

    c) `$_REQUEST`

    d) `$_FILES`


    Correct answer: d) `$_FILES`


    ## 19. How can you move an uploaded file to a permanent location in PHP?

    a) Using the `move_uploaded_file()` function

    b) Using the `copy()` function

    c) Using the `rename()` function

    d) Using the `fopen()` function


    Correct answer: a) Using the `move_uploaded_file()` function


    ## 20. Which headers are typically set to trigger a file download in PHP?

    a) Content-Type and Content-Length

    b) Cache-Control and Expires

    c) Content-Disposition and Content-Encoding

    d) Authorization and User-Agent


    Correct answer: c) Content-Disposition and Content-Encoding


    ## 21. How can you validate the size of an uploaded file in PHP?

    a) By checking the `$_FILES[''file''][''size'']` property

    b) By comparing the file extension against a whitelist

    c) By using the `file_exists()` function

    d) By checking the file permissions


    Correct answer: a) By checking the `$_FILES[''file''][''size'']` property


    ## 22. Which PHP function is commonly used to send emails?

    a) `sendmail()`

    b) `mail()`

    c) `smtp_send()`

    d) `email_send()`


    Correct answer: b) `mail()`


    ## 23. What does the PHPMailer library provide for sending emails?

    a) Better support for HTML emails

    b) Attachment handling

    c) SMTP authentication

    d) All of the above


    Correct answer: d) All of the above


    ## 24. Which package manager is commonly used to install PHPMailer?

    a) Composer

    b) npm

    c) pip

    d) yum


    Correct answer: a) Composer


    ## 25. What should you consider when sending emails?

    a) Avoid using user data directly

    b) Encrypt the email

    c) Use mail()

    d) Include sensitive information in headers


    Correct answer: a) Avoid using user data directly


    ## 26. Which of the following is a recommended practice when sending large number
    of emails?

    a) Use basic mail()

    b) Use a third-party service or library delivery

    c) Send at once


    Correct answer: b) Use a third-party service or library delivery


    ## 27. Why is it important to handle errors or exceptions during the email sending
    process?

    a) To prevent email being marked as spam

    b) To ensure a smooth experience

    c) To increase delivery rate


    Correct answer: b) To ensure a smooth experience

