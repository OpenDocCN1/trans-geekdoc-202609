    答案：b) 使用 `mysqli_query`


    # 23. 使用哪种操作更新数据库中的现有记录？a) INSERT b) DELETE c) SELECT d) UPDATE

    答案：d) UPDATE


    # 24. 在 PHP 中如何使用 MySQLi 从数据库删除记录？a) 使用 `mysqli_delete` b) 使用 `mysqli_remove`
    c) 使用带有 DELETE 的 `mysqli_query` d) 使用带有 DELETE 的 `mysqli_select`

    答案：c) 使用带有 DELETE 的 `mysqli_query`


    # 25. 在 PHP 中执行必要的数据库操作后，你应该做什么？a) 关闭数据库连接 b) 删除数据库表 c) 重新连接数据库 d) 执行 COMMIT 语句

    答案：a) 关闭数据库连接


    # 26. 执行 PHP 数据库操作时应该考虑什么来增强安全性？a) 清理用户输入 b) 使用准备语句或参数化查询 c) 妥善处理错误 d) 以上所有

    答案：d) 以上所有


    # 27. 哪个扩展为不同系统提供了统一接口？a) MySQLi b) PDO c) SQL

    答案：b) PDO


    # 28. PDO (数据对象) 为数据库提供了哪些功能？a) 准备语句 b) 参数化查询 c) 统一接口 d) 以上所有

    答案：d) 以上所有


    # PHP 中的面向对象编程 (OOP)

    面向对象编程 (OOP) 是一种关注对象的编程范式，它封装了数据和行为。


    ## 类和对象

    1. 类是蓝图或模板，定义了对象的结构和行为。

    2. 对象是类的实例。它代表一个特定的实体。


    ## 封装

    1. 封装是将数据和方法封装在类中的做法，隐藏细节。

    2. 类属性通常被声明为 `private` 或 `protected` 以限制外部访问。

    3. 公有方法用于访问这些属性。


    ## 继承

    1. 继承允许从其他类继承属性和方法，创建父子关系。

    2. 子类（子类）可以继承父类（父类）的属性和方法。

    3. 继承的属性和方法可以在子类中重写或扩展。


    ## 多态

    1. 多态允许将不同类的对象视为共同父类的对象，提供了灵活性和扩展性。

    2. 多态允许在子类中重写方法，从而实现相同方法的实现。


    ## 抽象

    1. 抽象涉及定义接口和抽象类，指定方法但不提供实现细节。

    2. 抽象类不能实例化，作为子类实现抽象方法的蓝图。


    ## 接口

    1. 接口定义了类必须实现的方法 set。

    2. 一个类可以实现多个接口，允许它定义并强制接口所需的方法。


    # 类、对象和继承

    在 PHP 开发中，类、对象和继承是面向对象编程 (OOP) 的基本概念。它们允许你创建复用代码，定义不同实体之间的关系，并有效地组织应用程序逻辑。


    ## 类

    1. 类是定义对象结构和行为的蓝图或模板。

    2. 它将数据（属性）和行为（方法或函数）封装在一个单元中。

    3. 类使用 `class` 关键字加类名进行声明，通常位于自己的 PHP 文件中。


    ## 对象

    1. 对象是类的实例。它代表一个具有特定状态和行为的实体。

    2. 对象使用 `new` 关键字加类名创建，并可以赋值给变量。

    3. 每个对象都有自己的属性集，并可以调用其类定义的方法。


    ## 继承

    1. 继承是一种允许类从其他类继承属性和方法的机制，创建了父子关系。


