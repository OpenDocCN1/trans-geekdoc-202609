    a) By declaring it using the `object` keyword

    b) By calling the `createObject()` function

    c) By using the `new` keyword followed by the class name

    d) By assigning a value directly to a variable


    Correct answer: c) By using the `new` keyword followed by the class name


    3. What is encapsulation in PHP?

    a) The process of creating child classes from parent classes

    b) The practice of bundling data and methods within a class, hiding the internal
