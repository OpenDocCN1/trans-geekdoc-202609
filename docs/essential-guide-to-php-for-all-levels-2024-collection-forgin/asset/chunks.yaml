    \ c) By using the new keyword followed by the class name d) By assigning a value\
    \ directly to a variable\n\nCorrect answer: c) By using the new keyword followed\
    \ by the class name\n\n3.  What is encapsulation in PHP? a) The process of creating\
    \ child classes from parent classes b) The practice of bundling data and methods\
