    1.什么是 PHP 中的类 (class)？

    a) 对象的实例

    b) 具有自身状态和行为的特定实体

    c) 定义属性和方法的蓝图或模板

    d) 定义一组方法的契约


    正确答案：c) 定义属性和方法的蓝图或模板


    2.如何在 PHP 中创建对象 (object)？

    a) 使用 `object` 关键字声明它

    b) 调用 `createObject()` 函数

    c) 使用 `new` 关键字后跟类名

    d) 直接将值分配给变量


    正确答案：c) 使用 `new` 关键字后跟类名


    3. 什么是 PHP 中的封装 (encapsulation)？

    a) 从父类创建子类的过程

    b) 将数据和方法封装在类中的做法，从外部隐藏内部实现细节

    c) 不同类的对象被视为共同父类的能力

    d) 定义一组方法的契约


    正确答案：b) 将数据和方法封装在类中的做法，从外部隐藏内部实现细节


    4. 什么是 PHP 中的继承 (inheritance)？

    a) 不同类的对象被视为共同父类的能力

    b) 从父类创建子类的过程

    c) 将数据和方法封装在类中的做法，从外部隐藏内部实现细节

    d) 定义一组方法的契约


    正确答案：b) 从父类创建子类的过程


    5. 什么是 PHP 中的多态 (polymorphism)？

    a) 将数据和方法封装在类中的做法，从外部隐藏内部实现细节

    b) 不同类的对象被视为共同父类的能力

    c) 从父类创建子类的过程

    d) 定义一组方法的契约


    正确答案：b) 不同类的对象被视为共同父类的能力


    6. 什么是 PHP 中的接口 (interface)？

    a) 定义属性和方法的蓝图或模板

    b) 定义类必须实现的方法集的契约

    c) 允许类从其他类继承属性和方法的机制

    d) 将数据和方法封装在类中的做法，从外部隐藏内部实现细节


    正确答案：b) 定义类必须实现的方法集的契约


