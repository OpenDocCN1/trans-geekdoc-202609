    *   PHP is not case-sensitive, so variables $myVariable and $myvariable would\
    \ be considered the same.\n\nVariables in PHP:\n\n*   Variables in PHP are used\
    \ to store and manipulate data.\n\n*   A variable name starts with a dollar sign\
    \ ($) followed by the variable name, which can consist of letters, numbers, and\
