    \ (e.g., $person = new Person();).\n\n    *   Null: A special value indicating\
    \ the absence of a value (e.g., $result = null;).\n\nExample:\n\n![](image_rsrc2SR.jpg)\n\
    \nIn the example above, we define several variables of different data types. The\
