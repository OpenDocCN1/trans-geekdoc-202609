    4. Which ORM library is widely used in PHP for mapping database tables and records
    to objects? a) `Doctrine ORM` b) `Eloquent ORM` c) `cURL` d) `GD`


    Correct answer: a) `Doctrine ORM`


    5. Opcode caching is a technique used to optimize PHP application performance.
