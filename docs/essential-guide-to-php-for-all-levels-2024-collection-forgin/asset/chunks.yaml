    \n# PHP Syntax and Variables\n\nLet's dive into PHP syntax and variables.\n\n\
    PHP Syntax:\n\n*   PHP code is typically embedded within HTML markup using special\
    \ opening <?php and closing ?> tags.\n\n*   PHP statements end with a semicolon\
    \ (;) to denote the end of each statement.\n\n*   PHP is a loosely typed language,\
