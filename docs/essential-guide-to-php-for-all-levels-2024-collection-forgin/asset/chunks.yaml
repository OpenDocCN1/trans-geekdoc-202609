    11. PHP 中构建 Web 服务常用哪些协议？a) `SOAP` b) `XML-RPC` c) a 和 b 都 d) 以上都不是


    正确答案：c) a 和 b


    12. 构建 `SOAP` 服务涉及哪些步骤？a) 创建 `XML-RPC` b) 注册函数 c) 定义服务 d) 生成 WSDL


