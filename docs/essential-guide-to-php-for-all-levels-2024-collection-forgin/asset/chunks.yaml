    # Object-Oriented Programming (OOP) in PHP

    Object-Oriented Programming (OOP) is a programming paradigm that focuses on the
    concept of objects, which encapsulate data and behavior. PHP supports OOP principles,
    allowing developers to write modular, reusable, and structured code.


    ## Classes and Objects

    1. A class is a blueprint or template that defines the properties (attributes)
    and methods (functions) that an object of that class can have.

    2. An object is an instance of a class. It represents a specific entity with its
    own state (data) and behavior (methods).


    ## Encapsulation

    1. Encapsulation is the practice of bundling data and methods within a class,
    hiding the internal implementation details from the outside.

    2. Class properties are typically declared as `private` or `protected` to restrict
    direct access from outside the class. Public methods are used to access and modify
    those properties.


    ## Inheritance

    1. Inheritance allows classes to inherit properties and methods from other classes,
    creating a hierarchical relationship.

    2. A subclass (child class) can inherit properties and methods from a superclass
    (parent class).

    3. Inherited properties and methods can be overridden or extended in the subclass.


    ## Polymorphism

    1. Polymorphism allows objects of different classes to be treated as objects of
    a common parent class, providing flexibility and extensibility.

    2. Polymorphism enables methods to be overridden in the subclasses, allowing different
    implementations for the same method name.


    ## Abstraction

    1. Abstraction involves defining interfaces and abstract classes that specify
    a contract of methods without providing the implementation details.

    2. Abstract classes cannot be instantiated and serve as a blueprint for subclasses
    to implement the abstract methods.


    ## Interfaces

    1. Interfaces define a contract of methods that a class must implement.

    2. A class can implement multiple interfaces, allowing it to define and enforce
    a set of methods required by the interface.


    # Classes, Objects, and Inheritance

    In PHP development, classes, objects, and inheritance are fundamental concepts
    of Object-Oriented Programming (OOP). They allow you to create reusable code,
    define relationships between different entities, and organize your application''s
    logic effectively.


    ## Classes

    1. A class is a blueprint or template that defines the structure and behavior
    of objects.

    2. It encapsulates data (attributes or properties) and behavior (methods or functions)
    into a single unit.

    3. Classes are declared using the `class` keyword followed by the class name,
    and they typically reside in their own PHP files.


    ## Objects

    1. An object is an instance of a class. It represents a specific entity with its
    own state and behavior.

    2. Objects are created using the `new` keyword followed by the class name, and
    they can be assigned to variables.

    3. Each object has its own set of properties and can invoke the methods defined
    in its class.


    ## Inheritance

    1. Inheritance is a mechanism that allows classes to inherit properties and methods
    from other classes, creating a parent-child relationship.

