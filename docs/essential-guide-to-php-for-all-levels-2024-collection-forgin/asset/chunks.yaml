  trans: "\n这些示例演示了 Doctrine ORM 和 Eloquent ORM 的基本用法。这两个库都提供了许多更高级的功能，如查询构建、关系映射和缓存。你可以参考这些库的官方文档，获取更多关于其功能和能力的深度信息。\n\
    \n# 性能优化技术\n\n在优化 PHP 应用程序的性能时，有几种技术是可以采用的。以下是 PHP 中一些常用的性能优化技术：\n\n1.  代码优化：\n\
    \    *   使用高效的算法和数据结构。\n    *   尽量减少函数调用次数，并改用局部变量。\n    *   避免过度的字符串拼接或操作。\n\
    \    *   通过减少不必要的迭代来优化循环。\n    *   使用适当的数组函数进行数据处理。\n    *   避免过度或不必要的文件 I/O 操作。\n\
    \n2.  缓存：\n    *   利用 `OPcache` 或 `APCu` 等扩展进行字节码（opcode caching），将编译后的 PHP 代码存储在内存中，减少重复解析和编译的需求。\n\
    \    *   实现数据缓存机制（例如 `Memcached` 或 `Redis`）来存储频繁访问的数据并减少数据库查询。\n    *   通过为 CSS、JavaScript\
    \ 和图像等静态资源设置合适的响应头来利用浏览器缓存。\n\n3.  数据库优化：\n    *   通过在频繁访问的列和表上使用适当索引来优化数据库查询。\n\
    \    *   利用数据库系统提供的数据库查询缓存机制。\n    *   在使用 ORM 库时，采用预加载（eager loading）或懒性加载（lazy\
    \ loading）技术来优化相关数据的获取。\n    *   避免使用可能导致过度查询或低效数据库访问模式的 ORM 特性。\n\n4.  HTTP 请求优化：\n\
    \    *   通过合并 CSS 和 JavaScript 文件、使用图片精灵图（sprites）以及利用 `HTTP/2` 进行并行请求来减少 HTTP\
    \ 请求的数量。\n    *   实现 HTTP 响应压缩（例如 `gzip`）以减小网络传输的数据量。\n    *   使用 CDN（内容分发网络）将静态资产分发到靠近用户的地方，减轻负载。\n\
    \n5.  内存优化：\n    *   避免将不必要的数据加载到内存中。\n    *   在资源不再需要时适当管理并关闭连接。\n    *   使用适当的数据结构来最小化内存消耗（例如对于大数据集使用\
    \ `SplFixedArray` 代替普通数组）。\n    *   限制全局变量的使用，因为它们会在整个应用程序生命周期内消耗内存。\n\n6.  异步处理：\n\
    \    *   使用队列、消息代理（例如 `RabbitMQ` 或 `Apache Kafka`）或后台作业处理器（例如 `Gearman` 或 `Beanstalkd`）等工具实现异步处理，将耗时任务从主应用流中卸载。\n\
    \    *   使用 `cURL` 或 `ReactPHP` 等扩展对网络相关任务使用非阻塞 I/O 操作。\n\n7.  性能分析与监控：\n    *\
    \   使用 `Xdebug` 或 `Blackfire` 等性能分析工具识别代码中的瓶颈和性能问题。\n    *   使用 `New Relic`、`Datadog`\
    \ 或自定义监控解决方案监控应用程序性能，以获取对资源使用、响应时间和其他关键指标的洞察。\n\n需要注意的是，这些技术的有效性取决于应用程序的具体特性和底层基础设施。对应用程序进行性能分析（Profiling）和基准测试（benchmarking）将帮助识别需要优化的领域，并衡量所实施技术的影响。\n\
    \n# PHP 中的多线程与异步编程\n\nPHP 由于其请求-响应机制以及在 Web 应用中通常的使用方式，传统上并没有原生多线程支持。然而，PHP 确实提供了执行异步编程和并行处理的选项。让我们探索两种流行的方法：\n\
    \n*   使用 Promise 进行异步编程：可以使用实现 promise 或未来任务（futures）的库来实现 PHP 中的异步编程。Promise\
    \ 允许你执行非阻塞 I/O 操作并更高效地处理异步任务。这里是一个使用流行库 `ReactPHP` 的示例：\n\n首先，使用 `Composer` 安装\
    \ `ReactPHP`：\n\n![](img/image_rsrc2VT.jpg)![](img/image_rsrc2.jpg)\n\n- `ReactPHP`\
    \ 是一个强大的库，提供了事件驱动和非阻塞 I/O 能力，允许构建可扩展的应用程序。\n\n*   使用扩展进行并行处理：PHP 提供了通过多进程或线程实现并行处理的扩展。一种流行的并行处理扩展是\
    \ `threads`。\n\n要使用 `threads`，需要在在 PHP 安装中启用。请注意，`threads` 并非在所有 环境中都可用。\n\n![](img/image_rsrc2VU.jpg)\n\
    \n值得注意的是，PHP 8 引入了 `FFI`（外部函数接口）扩展，允许直接从 PHP 调用并与 C 交互。这开启了利用 C 库的可能性，但对 C 编程有了解。\n\
    \n总的来说，尽管 PHP 缺乏内置的多线程支持，但通过 Promise 进行异步编程和通过扩展进行并行处理为 PHP 应用程序提供了并发和并行的方法。\n"
