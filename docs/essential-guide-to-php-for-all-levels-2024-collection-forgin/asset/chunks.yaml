    # PHP 简介


    PHP（超文本预处理器）是一种广泛用于 Web 开发的服务器端脚本语言。它由 Rasmus Lerdorf 于 1994 年创建，之后已成为构建动态网站的健壮且流行的语言。PHP
    主要嵌入 HTML 代码中，允许开发者将 PHP 代码与静态标记混合。它是一种开源语言，这意味着它是免费的并拥有庞大的开发者社区。与 PHP 相关的关键特性和概念：


    1. **服务器端脚本**：PHP 在向客户端发送 HTML 之前在服务器上执行。这意味着服务器处理 PHP 代码生成动态内容，然后交付给用户。

    2. **与 HTML 集成**：PHP 代码封装在特殊标签 `<?php ?>` 中，使其易于嵌入 HTML 文档。

    3. **功能强大**：PHP 提供了大量的内置函数和库，简化了常见的 Web 开发任务。它支持处理数据库、文件上传、发送电子邮件等许多功能。

    4. **平台独立性**：PHP 是一种跨平台语言，意味着它可以运行在 Windows、Linux 等操作系统上。它还支持 Apache、Nginx 和 Microsoft
    IIS 等多个服务器。

    5. **数据库集成**：PHP 为数据库连接提供了极佳的支持。它具有内置扩展，可连接到 MySQL、PostgreSQL 和 Oracle 等管理系统。

    6. **面向对象编程 (OOP)**：PHP 支持 OOP 原则，允许开发者编写模块化可重用的代码。这使得创建更有结构且易于维护的应用程序成为可能。

    7. **框架与 CMS**：PHP 拥有丰富的框架和管理系统（CMS）生态系统，如 Laravel、Symfony、CodeIgniter、WordPress
    和 Drupal。这些工具提供了预构建的功能和库，帮助开发者高效地构建应用程序。

    8. **社区支持**：PHP 拥有庞大活跃的开发者社区，他们为语言的增长做出贡献，并通过论坛、在线教程和开源项目提供支持。


    总体，PHP 是一种用于 Web 开发的强大且灵活的语言。它的简单、多性和丰富功能使其成为构建动态网站和应用程序的理想选择。


    以下是 PHP 中常用术语及其用途的表格：


    | 术语 | 描述 |

    | :--- | :--- |

    | **变量** | 用于存储数据的命名容器。变量持有不同类型的数据并可以在程序执行期间更改。 |

    | **函数** | 执行特定任务的可重用代码块。函数接受输入参数，执行操作并返回结果（可选）。 |

    | **数组** | 在单个变量中存储多个值的数据结构。数组可以是索引的（数值或关联）或非索引的（使用 `array()` 构建）。 |

    | **字符串** | 字符序列。字符串可以使用单引号 `''''`、双引号 `""` 或使用 heredoc/nowdoc 语法封装。它们用于处理和显示文本。
    |

    | **运算符** | 对一个或多个操作数执行特定操作的符号。PHP 支持多种运算符，如算术、赋值、比较、逻辑等。 |

    | **条件** | 根据特定条件进行代码分支的语句。PHP 提供了 `if`、`else`、`elseif`、`switch` 以及三元运算符 `? :`
    来控制执行流。 |

    | **循环** | 在满足特定条件之前重复执行代码块的控制结构。PHP 支持 `for`、`while`、`do-while` 和 `foreach` 循环，用于迭代数组或数据集。
    |

    | **全局变量** | 在 PHP 脚本任何范围内均可的预定义变量。包括 `$_GET`、`$_POST`、`$_SERVER` 和 `$_SESSION`，它们存储了从客户端或服务器环境传递的信息。
    |

    | **对象** | 类实例，封装了数据和函数。对象是 PHP 面对象编程 (OOP) 的构建模块，提供了结构化模块化的代码组织方式。 |

    | **类** | 定义对象属性（变量）和行为（方法）的蓝图或模板。类用于在 OOP 中创建对象，提高了代码的可重用维护性。 |

    | **异常** | 代表程序执行期间发生的错误或异常事件的对象。异常用于错误处理，并可以使用 `try`、`catch`、`throw` 和 `finally`
    块进行捕获和处理。 |


    '
