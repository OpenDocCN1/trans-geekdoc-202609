    通过在 PHP 中有效处理 HTTP 请求和响应，你可以在 Web 中处理用户输入、生成动态内容、控制重定向，并为客户端请求提供适当的响应。


    # 使用 Cookies 和 Sessions


    在 PHP 中处理 Cookie 和 Session 对于管理用户数据和在多个请求之间维持状态至关重要。以下是 PHP 处理 Cookie 和 Session
    的概览：


    ### Cookies


    1. Cookie 是存储在客户端浏览器上的小段数据。

    2. 在 PHP 中，你可以使用 `setcookie()` 函数设置 Cookie，该函数接受名称、值、过期时间、域名、路径等参数。


    示例：


    ![](img/image_rsrc2TJ.jpg)


    * 要访问 Cookie 值，请使用 `$_COOKIE` 超全局数组。


    示例：


    ![](img/image_rsrc2TK.jpg)


    1. 你可以通过将它们的过期时间设置为过去，或使用带有空值的 `setcookie()` 函数来修改或删除 Cookie。


    ### Sessions


    1. Session 是一种在服务器上存储特定用户数据的方法。

    2. 在 PHP 中启动 Session，请在每个需要 session 数据的 PHP 文件开头使用 `session_start()` 函数。

    3. Session 数据存储在服务器上，并与唯一的 Session ID 关联，该 ID 通常存储在客户端浏览器的 Cookie 中。


    示例：


    ![](img/image_rsrc2TM.jpg)


    * 要访问 Session 数据，请使用 `$_SESSION` 超全局数组。


    示例：


    ![](img/image_rsrc2TN.jpg)


    * 你可以根据需要修改或取消 Session 数据。


    示例：


    ![](img/image_rsrc2TP.jpg)


    记住在每个需要访问 数据的 PHP 文件开头调用 `session_start()`。


    ### Session 配置


    1. PHP session 配置可以通过 `php.ini` 文件或使用 PHP 代码中的 `ini_set()` 函数进行修改。

    2. 配置选项包括 session 存储、session 寿命、session 名称等。

    3. 根据你的应用程序需求调整这些设置。


    示例：


    ![](img/image_rsrc2TR.jpg)


    ## Session 安全


    * 在使用 session 时要采取安全措施。

    * 使用安全的 HTTPS 连接传输 session 数据以防止窃听。

    * 登录后重新生成 session ID 以防止会话固定攻击。

    * 验证并清理 session 数据以防止 session 会话劫持或注入。


    示例：


    ![](img/image_rsrc2TS.jpg)


    在 PHP 中处理 Cookie 和 Session 允许你存储和检索特定用户数据、维持用户状态并个性化浏览体验。请谨慎处理存储在 Cookie 和 session
    变量中的数据，并实施安全措施以防止潜在的漏洞。


    # PHP 基础数据库操作 (CRUD)


    PHP 中的基础数据库操作涉及 CRUD 操作：在数据库中进行创建 (Create)、读取 (Read)、更新 (Update) 和删除 (Delete)
    Record。以下是使用 PHP 执行这些操作的概览：


    ### 连接数据库


    1. 在执行任何数据库操作之前，使用相应的扩展（例如 `MySQLi`, `PDO`）建立数据库连接。

    2. 提供必要的凭据，如主机名、用户名、密码和数据库名。


    使用 MySQLi 的示例：


    ![](img/image_rsrc2TT.jpg)


    ### 创建 (INSERT) 操作


    * 要向数据库表插入新记录，请构造 SQL 查询并使用数据库扩展中的适当方法执行。


    使用 MySQLi 的示例：


    ![](img/image_rsrc2TU.jpg)


    ### 读取 (SELECT) 操作


    * 要从数据库中检索数据，请使用 `SELECT` 语句构造 SQL 查询并执行它。


    使用 MySQLi 的示例：


    ![](img/image_rsrc2TV.jpg)


    ### 更新 (UPDATE) 操作


    * 要更新表中的现有记录，请使用 `UPDATE` 语句构造 SQL 查询并执行它。


    使用 MySQLi 的示例：


    ![](img/image_rsrc2TW.jpg)


    ### 删除 (DELETE) 操作


    * 要从数据库中移除记录，请使用 `DELETE` 语句构造 SQL 查询并执行它。


    使用 MySQLi 的示例：


    ![](img/image_rsrc2TX.jpg)


    ### 关闭数据库连接


    * 在执行必要的数据库操作后，关闭数据库连接以释放资源。


    使用 MySQLi 的示例：


    ![](img/image_rsrc2TY.jpg)


    值得注意的是，其他数据库扩展（如 `PDO`）为数据库管理系统提供了一致的接口，并提供预处理语句等功能。


    # SQL 和 MySQL 简介


    SQL（结构化查询语言）是管理数据库的标准语言。MySQL 是一种流行的关系型数据库管理系统 (RDBMS)。在 PHP 中，以下是对 SQL 和 MySQL
    的全面介绍：


    ### 数据库概念


    1. 数据库是组织成表的结构化数据集合，由行（记录）和列（字段）组成。

    2. 每个表代表一个特定的实体或概念，表之间的关系通过键（keys）建立。

    3. SQL 用于定义和与数据库交互，允许开发者创建、修改和查询数据。


    ### 创建数据库和表


    1. 在 MySQL 中创建数据库，可以使用 `CREATE DATABASE` 语句。

    2. 创建数据库后，可以使用 `CREATE TABLE` 语句在其中创建表，并指定表名、列及其数据类型。


    示例：


    ![](img/image_rsrc2TZ.jpg)


    ### 插入数据


    * 向表中插入数据，使用 `INSERT INTO` 语句后跟表名和要插入的值。


    示例：


    ![](img/image_rsrc2U0.jpg)


    ### 查询数据


    * SQL 提供了多种从数据库检索数据的命令，最常用 `SELECT` 语句。

    * 使用 `SELECT` 语句指定要检索的列和要查询的表。你还可以使用条件和过滤器来缩小范围。


    示例：


    ![](img/image_rsrc2U1.jpg)


    ### 更新数据


    * `UPDATE` 语句允许修改表中的现有记录。

    * 指定要更新的表，设置新值，并使用条件定位特定的行。


    ![](img/image_rsrc2U2.jpg)


    ### 删除数据


    * `DELETE` 语句用于从表中删除记录。

    * 指定表并使用条件确定删除哪些行。


    示例：


    ![](img/image_rsrc2U3.jpg)


    ### 关联与关系


    * SQL 允许通过连接 (joins) 来自多个表的数据。

    * 常见的连接类型包括 `inner join`, `left join`, `right join` 和 `full outer join`。

    * 连接用于根据键建立表之间的关系。


    示例：


    ![](img/image_rsrc2U4.jpg)


