    acts we see now, such as failure to deliver, failure to pay, and bait and switch
    schemes. They again were tied to elements, such as addresses, mailboxes, etc.
    that could be used to track down the fraudsters. The `U.S. Postal Service` has
    years of experience in shutting down these fraudsters. There were sophisticated
    fraudsters that would find ways to make tracking them difficult but nothing like
    what is seen with online fraud criminals. The Internet created opportunities not
    only for the novice fraudster but the sophisticated fraudsters and organizations
    to excel.


    ## THE INTERNET MARKETPLACE


    The Internet drastically changed how goods are bought and sold. No longer do sellers
    and buyers need to be geographically close. Traditional garage/yard and auctions
    had fixed locations and set times for sales to occur. Internet markets don’t sleep
    and are not bound by these limitations. This is a perfect environment for a fraudster
    to operate. Distance between them and their victims makes prosecution more difficult.
    The ability for fraudsters to conceal their real identity and their true location
    can’t be accomplished to such an extent in the brick-and-mortar world. The ability
    to quickly shut down and move their online operation can be done in minutes. Digital
    images of products can easily be created without the fraudster even possessing
    them. Their fictitious inventory can easily be stored and moved as needed. Electronic
    financial transactions open new avenues for fraud that can’t occur when the buyer
    and seller are dealing in cash transactions face to face.


    ### Common Internet Fraud


    There are at least seven cybercrime methods for profiting from Internet fraud.
    They are:


    1. **Nondelivery of Merchandise/ Nondelivery of Payment**: One of the most common
    fraud methods is failure of the seller to deliver the goods or for the buyer to
    fail to make payment.


    2. **Bait and Switch**: This occurs when the fraudulent seller represents one
    product for sale but delivers a substandard or defective product.


    3. **Overpayment Fraud**: The fraudulent buyer inadvertently overpays for an item
    and requests an overpayment refund. The problem is the entire payment was a fake.
    The seller refunds the overpayment only to learn that the fraudulent buyer reversed
    their original payment in full or the original check paid was no good. To make
    matters worse, if the seller also sent the item, they are out not only their product
    but the overpayment.


    4. **Triangulation Fraud**: An unsuspecting buyer places an order using credit,
    debit, or some other electronic method with a fraudulent seller. The fraudulent
    seller takes the funds from the unsuspecting buyer but uses stolen credit information
    to purchase the item for the buyer, using the buyer’s billing details as a delivery
    address. The buyer doesn’t realize that the fraudulent seller used stolen credit
    card information to fill their order.


    5. **Identify Theft**: The seller (fraudster) may or may not be interested in
    selling anything. Their goals are to get credit cards and personal information
    for later committing identify theft or to facilitate triangulation fraud.


    6. **Fraudulent Additional Purchases**: The buyer purchases one product or service
    only to later realize the seller also used their credit card information to buy
    additional items or services that did not agree to buy. Sometimes these additional
    charges will appear weeks or months later with goods or services delivered or
    not. This is common in vitamin and supplement markets.


    7. **Account Takeovers**: Cybercriminals obtain access to legitimate seller and
    buyer accounts. They then use these stolen accounts to commit the frauds previously
    listed or sell saved card details, payment gateway, and digital wallet accounts
    if available.


    ### Common Methods to Further Internet Fraud


    Online criminals can use many methods to lure an unsuspecting victim into believing
    the online scheme is real. Methods can include digital images (often copied from
    a real Web site) of nonexistent products in their posts. Other methods of misdirection
    can be a bit more sophisticated, and they often can include:


    1. **Fake Reviews**: Fraudsters have a variety of methods to build up their credibility
    to make themselves legitimate. These include using bots which are operated by
    other cybercriminals to post favorable reviews.


    2. **Account Collusion**: Fraudulent sellers will set up fake buyer/seller accounts
    to vouch for their fraudulent accounts. This adds to their creditability by manipulating
    their ratings. They will so use fake transactions between the accounts to avoid
    scrutiny.


    3. **Bid Shielding/Shilling**: In an Internet auction criminals will use fake
    accounts to drive up bids to secure more profits for the fraudulent seller. In
    bid shilling a buyer with a partner or fake account will artificially inflate
    the bids, discouraging others from bidding. At the last minute, the shilling account
    cancels the high bid and permits the fraudulent buyer to win the auction with
    a lower bid.

