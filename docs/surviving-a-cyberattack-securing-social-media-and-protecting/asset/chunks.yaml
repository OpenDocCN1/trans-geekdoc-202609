- raw: 'It may be helpful to give vulnerable adults real examples of individuals like
    themselves who fell victim to cybercrimes. One of the biggest cybercrimes that
    are targeting the elderly is called pig butchering. When asked to provide a definition
    of pig butchering for this book, cybercrime and crypto expert Erin West stated
    the following:


    Pig butchering is the most devastating scam threat to financial and mental health
    to date. Emanating from organized crime in Southeast Asia, this crime combines
    the traditional elements of a romance scam and then super drives it by coercing
    victims to invest their entire net worth into a fake cryptocurrency platform.
    The term pig butchering comes from the Chinese sha zu pan and is meant to fatten
    up the victim with love bombing until they are eventually slaughtered, and all
    of their money is lost.


    It works like this: a scammer connects with a victim on a social media platform,
    moves to an encrypted conversation, and begins a months-long courtship where the
    scammer shows an enviable lifestyle of fancy travel and a high-end home and vehicle.
    They will text up to 4–5 hours a day. Our victim is led to believe they have found
    true love. The scammer then discloses that they have made their money through
    cryptocurrency and gets the victim to invest a small amount into a phony Web platform
    controlled by the scammer. The victim is shown exponential gains, and the scammer
    induces the victim to invest more and more, liquidating retirement and children’s
    college accounts. Ultimately when the victim tries to remove the funds, the victim
    is hit with a 25% tax which requires new money. The victim will then take out
    high interest loans and a second mortgage, only to find out the entire affair
    was a scam. Victims in droves find themselves completely emotionally crushed and
    suffer the loss of their complete financial stability.


    Erin West has been a 25-year Deputy District Attorney with the Santa Clara County
    Prosecutor’s Office in California. She is assigned to the Regional Enforcement
    Allied Computer Team (REACT), which is a partnership of 17 local, state, and federal
    agencies, with the Santa Clara County District Attorney’s Office designated as
    the lead agency. It is one of five such teams in California specifically created
    in 1997 to combat high tech crimes. [http://reacttf.org/10701.htm](http://reacttf.org/10701.htm)


    ![](image/fig6-1.jpg)


    FIGURE 6.1  Unsolicited text message to start the pig butchering scam (images
    AI generated).


    [Figure 6.1](#chapter06.xhtml#fig6-1) is a real message received via text messaging.
    This is a typical message intended to start a conversation, as Erin West described
    in the preceding extract, to prompt the receiver to engage in further conversations.
    A photo of a woman is often used to make the unsolicited message seem real and
    to try and put the receiver of the massage at ease.


    The following real cases were pulled from U.S. Department of Justice press releases
    and demonstrate the fact that these schemes often involve multiple conspirators.


    Four Individuals Charged for Laundering Millions from Cryptocurrency Investment
    Scams” \[U.S. Department of Justice 2023\]


    A seven-count indictment was unsealed in Los Angeles charging four individuals
    for their alleged roles in a scheme to launder the proceeds of cryptocurrency
    investment scams and other fraudulent schemes involving millions of dollars in
    victim funds.


    Court documents alleged the defendant conspired to open shell companies and bank
    accounts to launder victim proceeds of cryptocurrency investment scams, also known
    as pig butchering, and other fraudulent schemes. They transferred the funds to
    domestic and international financial institutions. The overall fraud scheme in
    the related pig-butchering syndicate involved at least 284 transactions and resulted
    in more than $80 million in victim losses. More than $20 million in victim funds
    were directly deposited into bank accounts associated with the defendants.


    Four Accused of Nationwide Tech Support Fraud Scam Targeting the Elderly \[U.S.
    Attorney’s Office, Eastern District of Missouri, 2024\]


    An investigation commenced in August of 2023, after a seventy-eight-year-old Missouri
    man responded to a pop-up message claiming his computer was infected with a virus.
    The victim and his seventy-six-year-old wife were falsely told that their banking
    information had been compromised because someone had been accessing child pornography
    through the computer. To escape criminal prosecution, they were told they had
    to pay $88,000.


    Following instructions in a series of text messages, the Missouri couple gathered
    the money, took photos of it and sealed it in a cardboard box. They were told
    to wait for a courier but began to be suspicious and balked when the courier arrived.
    They called the police, and the courier was arrested.


    Charging documents say that courier was paid $500 to $1,000 to pick up cash from
    victims and use a counterfeit passport and fraudulently obtained debit card to
    deposit it into a bank. He then withdrew money in cashier’s checks to send to
    coconspirators.


    Investigators learned the leaders of the conspiracy provided couriers with assignments
    and instructions. Couriers were recruited from colleges. They fraudulently opened
    financial accounts using the names and passports of citizens of Taiwan.


    About $7 million in cashier’s checks were deposited into one bank account from
    this scheme between March 2020 and July 2023.


    India-Based Computer-Hacking Scam that Targeted Elderly Across the Country \[U.S.
    Attorney’s Office, District of Montana, 2024\]


    A Montana federal judge sentenced an Indian national to four years and three months
    in prison for his role in stealing $150,000 from a Kalispell woman through an
    international computer-hacking scheme that targeted elderly Americans nationwide
    and resulted in more than $1.2 million in total losses. The man sentenced was
    a phantom hacker, individuals who “… layer imposter tech support, financial, and
    government personas to gain access to someone’s computer and personal information”
    (para. 5). The scammer traveled overseas to collect the victim’s money in person.
    Victim statements to the court revealed how this crime negatively affected the
    victims beyond the financial loss.


    One victim statement stated “I feel very violated…I have crawled into a shell
    emotionally and don’t want to be vulnerable in any way. I don’t know who I can
    safely trust now. I don’t feel safe at all” (para. 7). Another victim wrote “I’m
    driving a 2007 car, and this loss has prevented me from affording a new car. The
    cost of living keeps going up, which doesn’t help when on a fixed income. I’m
    not sure I will ever have peace of mind again and trust others. This has cost
    me more than any monetary loss” (para. 8).


    The government alleged in court documents that a large enterprise originating
    from India was involved in stealing $1,236,470 from elderly Americans. The Montana
    case arose in February 2023, when a bank notified the FBI of the fraud, in which
    a fraudster tricked a seventy-three-year-old victim into giving them money through
    a pop-up notice that appeared on her computer screen. The notice explained that
    Jane Doe had been hacked and for her to call a number for customer support. The
    victim complied, and fraudsters directed her to remove cash from her bank accounts
    for safe keeping at the Fed. She complied and gave $150,000 in cash to the fraudsters.
    The FBI set up a ruse and captured the fraudsters. The investigation determined
    that the fraudsters remotely accessed the victim’s computer, using UltraViewer,
    which they had installed on her computer.


    NAVIGATING SOCIAL MEDIA SAFELY FOR SENIORS'
