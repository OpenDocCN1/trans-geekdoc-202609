- raw: "Introduces readers to the risks of connecting to the Internet, especially\
    \ with the rise of Internet of Things (IoT) devices. It offers practical advice\
    \ on ranking and mitigating those risks, emphasizing the importance of a properly\
    \ configured router. The chapter includes checklists for router setup and tracking\
    \ the devices connected to your network.\n\n[Chapter 3](#chapter03.xhtml): Safely\
    \ Going Online\n\nExplores the various hazards users face when accessing the Internet\
    \ and provides actionable steps to minimize those threats. It covers the essentials\
    \ of secure browsing, managing cookies, using antivirus and antispyware software,\
    \ and securing connections with VPNs and Wi-Fi. It also clarifies the important\
    \ distinction between privacy and security.\n\n[Chapter 4](#chapter04.xhtml):\
    \ Securing Social Media\n\nCovers the risks posed by social media platforms and\
    \ provides strategies for protecting personal data online. From creating and maintaining\
    \ secure passwords to adopting strong security habits, this chapter equips readers\
    \ with the tools needed to navigate social media safely.\n\n[Chapter 5](#chapter05.xhtml):\
    \ Protecting Children\n\nFocuses on the specific vulnerabilities children face\
    \ in the digital landscape. It offers guidelines for approving devices and managing\
    \ the associated cyber risks to ensure young users remain safe.\n\n[Chapter 6](#chapter06.xhtml):\
    \ Protecting Adult Family Members\n\nExamines the unique challenges of caring\
    \ for vulnerable adults who may not be equipped to handle online threats. It provides\
    \ strategies for protecting them from cybercrime and outlines steps to address\
    \ social media after a loved one passes.\n\n[Chapter 7](#chapter07.xhtml): Surviving\
    \ in the Online Marketplace\n\nHighlights the risks of online shopping and trading.\
    \ Offering tips on how to identify\n\nthreats and protect yourself while navigating\
    \ the digital marketplace in the modern age.\n\n[Chapter 8](#chapter08.xhtml):\
    \ Protecting a Small Home Business\n\nProvides critical advice for small home\
    \ businesses (SHBs). Covers a wide range of topics including protection from scams,\
    \ data security, social media management, and employee computer monitoring, helping\
    \ SHB owners secure their digital assets.\n\n[Chapter 9](#chapter09.xhtml): Surviving\
    \ a Digital (Cyber) Attack\n\nPrepares readers to respond to a cyberattack by\
    \ revisiting key prevention strategies from earlier chapters and offering additional\
    \ guidance on how to survive and recover from an attack.\n\n[Chapter 10](#chapter10.xhtml):\
    \ Future Trends\n\nDiscusses emerging trends in digital security and offers insights\
    \ into what the future may hold for both individuals and businesses as they continue\
    \ to face new and evolving cyber threats.\n\nT. Shipley  \n\nA. Bowker  \n\nJuly\
    \ 2024\n\nACKNOWLEDGMENTS\n\nI would like to thank my entire family, my wife and\
    \ daughter, and especially my parents who could have benefited from it.\n\nAlong\
    \ the way, I have been influenced by many who have dedicated their lives to fighting\
    \ fraud.\n\nJames “Jimmy” Deal, a friend and fellow fraud fighter was always there\
    \ and was always encouraging me to stay in the fight\n\nTodd G. Shipley\n\nI would\
    \ like to thank my children, Stephanie and Mark, and my grandchildren, Scarlett,\
    \ Raylan, Vivian, Margaret, Owen, Felicity, and Abigail— may this book contribute\
    \ to creating a safer online world for you and future generations.\n\nArt Bowker\n\
    \nTo ensure this book would be a valuable resource to the public we solicited\
    \ input on draft chapters from parents or individuals who had professional experiences\
    \ dealing with certain populations, such as vulnerable adults or cybercrime victims.\
    \ We are thankful to the following individuals’ comments and suggestions for improving\
    \ our book: Maryum Ali, Tim Barry, Stephanie Burlison, Bonnie Burthker, Jeff Coyle,\
    \ Julie Delaney, Anitra Merrett, Danielle Mahoney, Jack Riffle, Michael Sullivan,\
    \ Rich Threadgill, Rachel Yokely and “Big Ashes” John Cryer, CFE, Erin West, Esq.\n\
    \n| CHAPTER || 1 |\n\n| --- | --- |\n\nCYBERSURVIVAL VERSUS SAFETY\n\nIN THIS\
    \ CHAPTER\n\nUnderstanding that cybercrime is a fact in today’s world is the first\
    \ step to understanding the need to protect oneself and family. This chapter provides\
    \ up-to-date numbers and historical data on major cybercrime events and provides\
    \ an overview of the cyber-risks we all face.\n\nModern humans are a connected\
    \ species. The Internet has made this possible, providing communication and information\
    \ access few could have envisioned when it went commercial in the late 1980s.\
    \ Unfortunately, our information highway also connects the world’s criminally\
    \ inclined to countless unsuspecting and unprepared victims. Cybercrime impacts\
    \ us all, and the odds are pretty good that individuals, including children, will\
    \ face cybercrime attempts/acts multiple times throughout their lives. ([Figure\
    \ 1.1](#chapter01.xhtml#fig1-1))\n\nMany cybercrime studies are anti-malware vendor-supported\
    \ and focus on the dangers of an unsecured personal computer, mobile phone, or\
    \ device, which those vendors hope will translate into product sales. These are\
    \ serious concerns, and one is foolish not to protect their devices. Nevertheless,\
    \ it is naïve for people to believe that simple antivirus and antispyware software\
    \ and firewalls will protect them from all the cyberdangers present in the twenty-first\
    \ century. These basic measures are just the starting point of digital age survival.\n\
    \nSignificant data breaches over the last ten years, such as those experienced\
    \ by Target (2013), Sony (2014), Anthem (2015), OPM (2015), Equifax (2017), Microsoft\
    \ (2020), and Facebook (2021), were not attacks on individual users but on companies\
    \ entrusted with users’ data. Once the attackers gained information, they either\
    \ used it themselves for malicious purposes or sold it to others, who used it\
    \ to victimize individual users via identity theft or other financial crimes.\n\
    \nIt would be nice to think that all individuals must do is avoid shopping, working,\
    \ or getting services from companies that think cybersecurity is a low priority.\
    \ How does one determine that before they are victimized, and their data is stolen?\
    \ People could all start shopping at a store like Hee Haw’s Gordie’s General Store,\
    \ which had no computer or Internet vulnerability, but that is not today’s reality.\
    \ Additionally, with some organizations, there is no choice. People must deal\
    \ with them. Of course, the organizations we are referencing are government agencies\
    \ that have not established an impregnable cyberfortress. In 2014, the State Department,\
    \ the White House, the National Oceanic and Atmospheric Administration, and the\
    \ United States Postal Service joined the long list of hacked government entities.\
    \ These pale in comparison to the 2015 breach of the Office of Personnel Management\
    \ (OPM). This significant breach included the background information on government\
    \ employees who applied for security clearances. Like so many others, both volume\
    \ authors received OPM letters identifying them as data theft victims.\n\n![](image/fig1-1.jpg)\n\
    \nFIGURE 1.1  Number of victims of Internet crimes \\[FBI, 2024\\].\n\nThe information\
    \ in this book is advising you how to avoid victimization, not just from the authors’\
    \ perspective as law enforcement investigators, but from their own experience\
    \ as victims."
