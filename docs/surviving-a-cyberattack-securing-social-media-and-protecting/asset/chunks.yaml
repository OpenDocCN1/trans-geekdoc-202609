    # 5. 冒充


    一个日益引起关注的问题是利用用户账户的照片创建一个虚假的社交媒体账号，以欺骗他人提供账户访问权限或进行欺诈。


    ## 复仇性色情（REVENGE PORN）


    遗憾的是，某些人并不介意使用最具威胁性的图像来报复他人。人们出于恶意在互联网上发布他人的难看裸照。愤怒和情绪化的人会做出由于互联网的特性而无法挽回的行为。电子图像不会像纸质图像那样损坏。它们很容易在设备之间进行复制和传播。一旦这些图像发布到网上，它们就会流遍全球。一旦上线，它们就可以被下载、复制，甚至被搜索引擎缓存。一张尴尬的照片可能会变成数百万份完全相同的。


    遗憾的是，这通常是前性伴侣试图羞辱或骚扰某人。在未经许可的情况下发布裸露或具有性显骨内容的图像或视频。这在许多司法管辖区都是犯罪，绝不应该被视为无意的玩笑。这显然是青少年在拍摄当时看似无辜且有趣的照片时所面临的危险之一。许多青少年恋情的结束，而这些图像超出预期受众范围的风险是非常真实的。警告孩子这种潜在的陷阱是重中之重。分享青少年（十八岁以下）的性显骨图像一直是犯罪。大多数州现在还有法律禁止未经许可发布成年人图像。2018
    年，一名女性在某民事诉讼中获得了 645 万美元的赔偿，因为她的版权遭到了侵犯，被告意图伤害她她在网上冒充她、跟踪她，并故意造成了她的精神痛苦 [Doe v.
    Elam 2014]。


    ## 应对社交媒体风险：安全与隐私


    处理社交媒体风险的第一步是识别用户所有的账户。使用密码管理器记录每个账户的用户名/电子邮件和密码（参见表 4.1）。如果用户不再使用的账户没有任何用途，请将其关闭，因为这将消除账户稍后被破解的风险。对于剩余的账户，用户需要考虑两个相关但独立的概念，即安全和隐私。


    ### 表 4.1 用户的社交媒体账户记录


    ![](img/tab4-1.jpg)


    ### 阅读字体细则


    用户通常会注册最新、最亮眼的东西，社交媒体账号也不例外。我们经常在注册前懒得去阅读用户协议。我们通常只是点击接受按钮，从不阅读内容。社交媒体的隐私政策也是如此。大多数人直接点击通过，而没有实际阅读。用户在同意受其条款约束之前，应该花一点时间阅读协议。人们可能会对自己同意的内容感到惊讶。此外，用户应该阅读隐私政策，以及社交媒体网站关于他们将如何使用个人数据的说明。很多时候，数据会被卖给其他公司，或者在协议中被归类为共享你的数据。


    另一个安全考量是公司将如何处理账户泄露。用户应该理解如果他们的数据从网站被盗取，社交媒体网站将做什么。用户想要与其开展业务的公司可能对他们的个人信息构成真实威胁。这些协议是重要的，但用户应该意识到，社交媒体网站并不总是积极地寻找违规行为。例如，考虑
    `Facebook` 和 `Instagram`，它们都由 `Mega` 所有。它们都禁止性犯罪者在自己的网站上使用。。这并不意味着性犯罪者不在他们的网站上。性犯罪者经常用假名甚至真实姓名注册并进入网站。`Facebook`
    和 `Instagram` 都没有搜查性犯罪者登记信息或进行刑事背景检查以禁用性犯罪者账户。他们依靠个人用户向他们举报这些个人资料。它们在删除色情和其他禁止的内容方面做得更好，但不要误认为，这些内容在他们的网站上仍然可以找到。这是在允许孩子使用网站时需要考虑的问题。即使被社交媒体协议或政策禁止，他们仍有暴露于不恰当内容的风险。


    用户在阅读社交媒体网站的策略和协议后必须做出决定。用户是否可以在自己的端调整任何内容（例如他们如何使用社交媒体账号），以使其仍然可以维持？如果用户无法进行个人调整，那么他们应该注销社交媒体账户。用户应该在阅读政策/协议时就能注销它。用户应该意识到这些协议可以被修改，他们应该继续评估这些是否合适。用户不会一生受限于任何社交媒体。


    越来越多地，除了社交媒体提供的协议外，还有其他用户需要注意的协议。几乎所有雇主都有独立的政策或关于员工如何使用社交媒体的规定。雇主并不孤单。从小学到大学的学校也有此类规定。甚至兄弟组织和俱乐部通常会有社交媒体政策。这些政策共同规定了诸如谁可以为组织创建社交媒体形象，以及员工/学生/成员在社交媒体上可以和不能发布的内容。即使没有特定的社交媒体政策，组织通常也认为，在网上发布的反映组织或其成员负面影响的内容可以并且会导致某种不利的行动。新闻中充斥着员工或学生的故事，他们的在线帖子或与某些社交媒体小组的关联导致他们被组织纪律或解雇，因为他们的行为违反了明确的社交媒体政策或隐性的行为政策。


    ## 安全


    安全至关重要。如果用户的社交媒体账户没有安全保护，无论用户选择了哪些隐私设置，攻击者都可以获得完全访问权限。每个社交媒体服务都有不同的方法来保护用户对服务的访问。许多用户只是创建账户并登录，而不考虑服务的安全功能包含什么。大多数从不查看可更改的功能来识别可以增强安全的可能安全功能。以下是用户为了保护账户应该提供的某些安全类型。


    ### 联系邮箱/手机


