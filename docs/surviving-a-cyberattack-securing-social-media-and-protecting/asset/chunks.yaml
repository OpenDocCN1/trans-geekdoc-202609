- raw: 'Sometimes additional steps are required. For instance, an embedded URL in
    a link in a phishing email will not show up in a screenshot or printout. Capturing
    this link without clicking on it may be difficult. The simplest is to hover the
    user’s mouse cursor over the suspect link, and it will open a small screen showing
    the link. The user can then take a screenshot of the link or write it down.


    Who: Collection efforts should include the author or source of the information.
    This may require the user to look at the user profile and capture it alongside
    a troubling post. Emails will have to be expanded to show header info. Revealing
    the header information is different for each email client. If the user wants more
    information on finding the header information in their email, they can go to MX
    Toolbox’s Web site at [https://mxtoolbox.com/Public/Content/EmailHeaders/](https://mxtoolbox.com/Public/Content/EmailHeaders/).
    They have a detailed list of email clients and how to access the headers.


    Email headers contain tracking information for an individual email which is useful
    for law enforcement. They detail the route a message took across the Internet
    as it was passed through the various mail servers (called mail transfer agents)
    from the sender to the receiver. This can be one or two mail servers, or several
    more depending on the route taken and the email services used (Gmail to Gmail
    accounts never leave Google’s servers). These email headers, in addition to the
    server’s information, also contain time stamps (when the server passed on the
    email), IP addresses (of that server), sender/recipient information, and other
    potentially useful information for investigators. This information helps assist
    law enforcement to find and locate the person who sent the email.


    Why/What: Posts might be text, a picture, and/or video. Be prepared to describe
    why the user believes it warrants action beyond just providing the screenshots.
    Law enforcement may not have time to review the video or images without some specifics
    of why the user believes it is suspicious or illegal. For instance, the video
    provided reflects a person discussing threatening to harm or kill someone.


    Where: Sometimes, a post will include information that reflects where the author
    is located or maybe who their intended target is. If the user can ascertain that
    from the post, document it. When in cyberspace, it is important to provide an
    address of where the post was seen. In [Figure 9.5](#chapter09.xhtml#fig9-5),
    it is clear from the screenshot that it was viewed on Facebook, particularly as
    it includes the URL. One needs to get the entire address, not just the domain
    name. Sometimes, it is not clear from the screenshot. Maybe the post occurred
    in a chatroom or instant message. The user might have to write it down if they
    can’t get the location documented in the screenshot. Again, be complete in documentation.


    ![](image/fig9-5.jpg)


    FIGURE 9.5  Capturing usable online evidence for law enforcement.


    When: The user has taken screenshots, printed them out, or taken digital pictures.
    Maybe it includes the date and time, but maybe not. The user needs to document
    when they saw it, that is, the date, time, and their time zone. Go old school
    and write it down. For instance, the post was seen at the date/time/time zone
    at this cyberlocation (specific complete URL, specific chat, specific instant
    message, etc.)


    Reporting the Crime


    Documentation, including screenshots, has been made. Now, it is time to report.
    Clearly, if this is in the user’s area and is an emergency, call 9–1–1. Explain
    what you saw and saved and why the user thinks it warrants attention. Be prepared
    to provide copies of screen shots, printouts, pictures, and documentation to law
    enforcement electronically via email or a storage device. Find the appropriate
    law enforcement contact listed [Chapter 6](#chapter06.xhtml) of this book and
    report the crime.


    CREDIT MONITORING VERSUS FREEZING


    Credit Monitoring


    Credit monitoring is a service that tracks changes in an individual’s borrowing
    behavior. It intended to notify the user of potential fraud using their name and
    credit and any changes to their creditworthiness that could be caused by fraud.
    Monitoring does not prevent fraud, but it can alert the user that it is possibly
    occurring.


    A user can begin monitoring their own credit by requesting a free copy of their
    credit report ([https://www.annualcreditreport.com/](https://www.annualcreditreport.com/)).
    In the United States, the three credit bureaus are required by law to provide
    an individual a copy if requested. Contact the user’s bank and credit card companies
    and set up notifications to alert on transactions that might indicate fraud on
    the user’s account. This could be withdrawals, or purchases that exceed a specified
    amount, or other activity not normal for the user’s account and history.


    If the user does not reside in the United States, they will have to do a little
    research on the Internet to determine the exact resources and companies available
    for this service. Credit bureaus operating outside the United States offer similar
    services. This Business Insider link can give users a start [https://www.businessinsider.com/credit-score-around-the-world-2018-8#2-united-kingdom-2](https://www.businessinsider.com/credit-score-around-the-world-2018-8#2-united-kingdom-2).


    Credit Freeze


    A credit freeze is a method used to protect consumers from identity theft. It
    is a request to one or more of the credit bureaus to not share the user’s credit
    information with any third parties. In other words, if someone tries to get access
    to the user’s information for the purpose of obtaining credit from a business,
    access will be denied. [Table 9.4](#chapter09.xhtml#tab9-4) provides the reader
    with an outline of the Credit Freeze concept.


    TABLE 9.4  Credit Freezes


    | Who can place one: || Anyone can freeze their credit report, even if their identity
    has not been stolen. |


    | --- | --- |


    | What it does: || A credit freeze restricts access to the user’s credit report,
    which means the user—or others—won’t be able to open a new credit account while
    the freeze is in place. A user can temporarily lift the credit freeze if they
    need to apply for new credit. When the freeze is in place, the user will still
    be able to do things like apply for a job, rent an apartment, or buy insurance
    without lifting or removing it. |


    | Duration: || A credit freeze lasts until the user remove it. |


    | Cost: || Free |


    | How to place: || In the United States, contact any of the three credit bureaus—Equifax,
    Experian, and TransUnion. |


    Fraud Alerts


    A fraud alert is a security alert placed on an account. It usually references
    a credit card account or an account listing by a credit bureau. An alert is placed
    either by the customer, the credit card company, or the credit bureau when a possible
    fraudulent account activity is identified. Fraud alerts are available in different
    situations and have different benefits. [Table 9.5](#chapter09.xhtml#tab9-5) provides
    the reader with an outline of the Fraud Alert concept.


    TABLE 9.5  Fraud Alerts


    | Who can place one: || Anyone who suspects fraud can place a fraud alert on their
    credit report. |


    | --- | --- |


    | What it does: || A fraud alert will make it harder for someone to open a new
    credit account in the user’s name. A business must verify the user’s identity
    before it issues new credit in their name. In the United States, when placing
    a fraud alert on a user’s credit report, the user can get a free copy of their
    credit report from each of the three credit bureaus. |


    | Duration: || A fraud alert lasts one year. After a year, the user can renew
    it. |


    | Cost: || Free |


    | How to place: || In the United States, contact any of the three credit bureaus—Equifax,
    Experian, and TransUnion. The user doesn’t have to contact all three. The credit
    bureau contacted must tell the other two to place a fraud alert on the user’s
    credit report. |'
