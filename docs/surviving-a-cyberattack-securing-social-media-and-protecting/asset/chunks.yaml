    ## Router Setup Guide


    [content]

    ### Router Setup Guide


    To set up your Small Office and Home Office (SOHO) router, follow this guide.
    Some of the various steps will be dependent on the manufacturer.


    #### Setup Steps

    1. Plug in the router and turn on the router.

    2. Connect the Internet modem to the router. Plug the Ethernet cable into the
    router port named `WAN` or `uplink` or `Internet`.

    3. Turn the modem off and turn it back on (This is to ensure the router is recognized).

    4. Connect a computer to the router. Plug an Ethernet cable into the computer’s
    network connection and the other end into an open port on the router.

    5. Open the router’s administration tool. Open a Web browser on the computer connected
    to the router. Check the bottom of the router or installation manual for the IP
    address. Often, the default address is `http://192.168.1.1` or `http://192.168.0.1`.

    6. Log in to the router. Enter the default username and password (Provided in
    the router’s documentation).


    #### Router Setup Checklist


    | Task | Completed |

    | :--- | :--- |

    | Plug in the router and turn on the router. | |

    | Connect the Internet modem to the router (`WAN`/`uplink`). | |

    | Turn the modem off and turn it back on. | |

    | Connect a computer to the router via Ethernet. | |

    | Open the router’s administration tool via IP address. | |

    | Log in with default credentials. | |

    | Change default administrator passwords and usernames. | |

