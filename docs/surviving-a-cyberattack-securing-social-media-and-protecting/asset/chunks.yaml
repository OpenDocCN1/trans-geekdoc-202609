    即使用户没有向某个机构寻求服务，他们也会暴露自己。无数个人已经建立了社交网络个人资料，但往往没有考虑过安全或隐私设置。他们与他人分享信息，认为与其交流的对象正是他们所声称的身份。人们错误地说服自己，他们发布的内容不会被分享给他们不认可的人。人们往往错误地信任自己的亲属、朋友和同事不会将他们的信息转发给他人，或者他们认为自己的安全/隐私设置已经锁定。由于有了所有这些误解，人们还认为社交媒体网站拥有某种安全保护措施，可以防止他们成为受害者。


    不幸的是，这些网站包含的海量信息使其成为寻找可转化为价值信息（例如访问某人的银行账户）的犯罪分子的诱目标。社交媒体公司也无法免受网络攻击。2013 年，黑客从
    `Facebook`、`Twitter` 和 `LinkedIn` 等社交网络网站，以及电子邮件提供商 `Google` 和 `Yahoo` 处窃了两百万个密码。作为最大的社交媒体公司的
    CEO，并不意味着免受因密码使用不当导致的攻击。`Facebook` 创始人 `Mark Zuckerberg` 的 `Twitter` 和 `Pinterest`
    账户被接管，是因为他重复使用了黑客在 2012 年从商业社交媒体巨头 `LinkedIn` 的泄露密码库中发现的密码。


    攻击也字面上从每个方向和每个设备袭来。美国和西欧成千上万未安全的 `webcams`（摄像头）为位于俄罗斯联邦某处的网站提供了素材。作为一种极端的隐私侵犯，这些不安全的
    `webcams` 还可以被用来确定抢劫或入室盗窃的最佳时间。`Webcams` 并不是漏洞。一位安全专家正确地观察到，我们的咖啡壶、电视、炉子和冰箱都连接了
    `Internet`，而且它们的安全协议并不总是充分的。如何避免这种日益融入到普通家庭设备中的网络风险？最近的报告指出，某些现代车辆已被黑入，发现的漏洞允许攻击者控制汽车功能，例如启动和停止。


    在计算机早期，普渡渡大学计算机操作、审计与安全技术（`COAST`）项目的主任 `Gene Spafford` 认为：“唯一真正安全的系统是关掉电源、铸在混凝土块中并密封在带铅衬的、有武装守卫的房间里——即使是这样我也有疑虑。”
    Spafford [1989]。今天，我们生活在一个每个人不仅必须担心自己的计算机或系统，还要担心每个人的社会。现实情况是，无论一个人让自己的计算机和个人习惯变得多么安全，其他人都可能掉链并使他们暴露在网络危害之中。如果不是公司、机构或社交媒体上的“朋友”，那么就是咖啡壶或冰箱向世界泄露信息。


    更糟糕的是，网络受害不仅局限于个人身份标识和信用/财务被盗或隐私被侵犯。还有其他更阴险的危害正等待着网络公众。对儿童的性剥削长期以来困扰着 `Internet`。儿童性侵者经常访问青少年聊天室寻找受害者。欺凌和跟踪在网线上日益发生，10%
    到 40% 的青少年经历过网络欺凌。`Sextortion`（性勒索）是一种犯罪分子利用受害者的裸照获取财务报酬或更严重的后果，这不仅导致了财务损失，还导致了许多自杀。一些杀手，更具体地说，连环杀手正在利用
    `Internet` 狩猎受害者。


    网络犯罪分子经常使用社会工程技术说服受害者交出财务。`Internet Crimes Complaint Center`（`IC3`）报告称，2023 年因投资诈骗导致的损失在他们跟踪的所有网络犯罪中最多。根据
    `IC3` 数据，投资诈骗损失从 2022 年的 33.1 亿美元增加到 2023 年的 45.7 亿美元，增加了 38%。如图 1.2 所示，投资诈骗受害者通常超过四十岁。图
    1.3 显示所有报告的 `IC3` 犯罪损失严重影响了老年群体。网络威胁并没有随着人们年龄的增长而减少 [FBI, 2024]。


    安全或保护意味着一个人免受危险或伤害。我们可以减少并可能避免它，但 `Internet` 提供的访问并非没有危险或伤害。`cybersurvival`（网络生存）一词要好得多。它承认危险或伤害的存在，但其内涵超越了安全或保护，意味着克服那些攻击。


    写这本书的目标不是让用户“拔掉插头”并停止使用 `Internet`。在数字世界中做鸵鸟不是生活之道。作者们将根据他们的网络法律执法经验，不仅最大限度地提高读者避免成为受害的能力，而且在他们成为网络受害者时做好准备。目标是让读者在一个网络犯罪事件日益成为日常常态的世界中生存。作者们将提供有关如何加强网络防御以及识别和避免网络风险的信息。他们专门设立了章节来保护儿童、弱势成年人和小型企业。他们还为读者提供了有关如何在在线市场保持安全的信息。他们将教育读者在成为网络受害者时如何度地减少伤害。最后，作者们将教育读者如何向执法部门正确记录和报告网络攻击，以最大限度地增加犯罪者被捕和起诉的可能性，希望让当今数字世界中的每个人都更安全。


    ![](img/fig1-2.jpg)


    图 1.2 按年龄划分的 `IC3` 投资投诉。


    ![](img/fig1-3.jpg)


    图 1.3 按年龄分组的所有 `IC3` 投诉。


    作者们将通过简化概念且不用技术术语淹没读者来实现这些目标。当他们确实使用技术信息时，会有相应的解释。作者们多年来一直在对执法部门进行这些概念的教育和培训，他们知道如何向不具备计算机科学学位的人解释这些。

    '
