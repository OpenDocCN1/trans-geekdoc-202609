- raw: 'What type of router should one buy, and how much should they spend? Choosing
    the right router can be a challenge because one wants the best product for a reasonable
    price. The issue is that technology changes so quickly that it’s hard to recommend
    a make or model without the advice being almost immediately stale. There are some
    specific things the Wi-Fi router should do to protect your home network.


    Commonly, a major concern is with the range at which one can connect to the Wi-Fi
    router (e.g., does it cover the whole house?) and the speed at which one can get
    data when connecting. From a security standpoint, these are the last things one
    should be concerned with regarding our router. Most new routers are plug-and-play.
    The user must log in to the Web-style interface and go through a wizard to set
    it up. A software wizard or setup is a user interface that guides the user through
    a series of steps to configure a program. It simplifies complex or unfamiliar
    tasks by breaking them into smaller, manageable parts and is usually quick. Let’s
    take a look at the things you should look for when buying a Wi-Fi router for home
    use.


    1.Standards, standards, standards: Don’t get confused by the long list of standards
    such as 802.11g, 802.11n, or 802.11ac. They are written technical standards of
    a router’s capabilities. 802.11 is the official standard name, and the trailing
    letters are the revisions. The newest standard available is preferred for the
    average home user. Don’t buy old technology, as the newer standard will be superseded
    soon enough. Users should not risk their network by buying something old. They
    should purchase the most current version. Users can ask the sales clerk at a technology
    store or search Google for “current 802.11 standard.”


    2.Multiple band routers: When looking at routers, users will find most modern
    routers broadcast on multiple bandwidths. Typically, the 2.4GHz and 5GHz bands
    make it convenient to surf one band and stream video on another.


    3.To MIMO or not to MIMO: Multiuser or MIMO is a technology that allows many devices
    to get a high-bandwidth Wi-Fi signal simultaneously. It distributes the data more
    efficiently over multiple connections, giving users faster Wi-Fi speeds.


    4.Security: Wi-Fi networks are popular but can be insecure. Users must secure
    their home network to prevent hackers within range from eavesdropping. To do this,
    one must consider what security means in the Wi-Fi context. There is a list of
    mind-numbing acronyms about security features. They are listed as follows starting
    with the most secure and ending with the least secure:


    a.WPA3


    b.WPA2 + AES


    c.WPA + AES


    d.WPA + TKIP/AES


    e.WPA + TKIP


    f.WEP


    g.Open Network (no security at all)


    Remember that the network will only be as secure as the least safe device connecting
    to the network. That means phones, tablets, computers, or other devices connecting
    to the Wi-Fi all need the same level of security to make the network secure. The
    highest current security is WPA3. Wi-Fi protected access means the second implementation
    of the WPA protocol. Select the highest level of protection available for every
    device added to a home network. As of 2018 devices must also support the WPA protocol.
    The letters such as +AES after the protocol are the level of encryption used with
    the protocol.


    WPA3 Personal is the newest, most secure protocol currently available. It will
    work with devices that support Wi-Fi 6 (802.11ax). Older devices might work with
    the newer protocol. The older security level WPA2 might be acceptable, although
    not ideal. Sometimes only one protocol is available and that is one that must
    be used. Look into purchasing a newer router with the latest protocols. Refrain
    from relying on the oldest standard, wired equivalent privacy (WEP). The oldest
    standard is easily broken with free downloadable tools making them inherently
    unsafe to use. In [Table 2.1](#chapter02.xhtml#tab2-1) we have some basic recommendations
    for the suggested Wi-Fi protocol to use for personal or home use.


    TABLE 2.1  WIFI Suggested Protocol Use


    | Protocol || Recommend? |


    | --- | --- |


    | WEP-Wired Equivalent Privacy || No |


    | WPA-WIFI Protected Access || No |


    | WPA2- WIFI Protected Access 2 || Only if newest standard of WPA3 is not available
    |


    | WPA3- WIFI Protected Access 3 || Yes |


    5.Logging: This feature is essential as it lets one know if someone is targeting
    the network. In worst-case scenarios, logging can provide important information
    about the timing and nature of a security breach.


    6.Other features of interest: These can be nothing more than fluff, but they can
    be helpful in the right circumstances. A USB port on the router can add things
    like backup space for devices. These same features also present a potential security
    liability. (As an example, if the system is compromised, it’s possible the data
    in the backed-up files might be, as well.)


    7.Cost: Ultimately, the cost will be the primary driver in the purchase. After
    deciding on a budget, users should choose a router that fits their needs, as the
    most expensive ones may not always be the best option. The right Wi-Fi router
    should have essential features that will protect a home network. Cheaper, subpar
    routers can be dangerous and expose the network.


    Now that readers have a better understanding of what they should look for when
    selecting a Wi-Fi router, the next step is buying one. There are many different
    options, going to a local big box store and talking with a knowledgeable salesclerk
    can be valuable. Searching on the Internet for reviews of devices is also an option.
    The final purchase decision is a personal one based on one’s understanding of
    the product.


    Provider Modems with Wifi


    Service providers sometimes offer the option to have Wi-Fi enabled as a service
    provided by their equipment. This sounds good, but the issue is a matter of control.
    Users may not have control or access to the security functions within this device.
    The best approach is to have the service provider turn the Wi-Fi function off
    and add the preferred WiFi router and control after they service the device. [Table
    2.2](#chapter02.xhtml#tab2-2) provides the home user with a basic checklist to
    guide a home user when setting up a Small Office and Home Office (SOHO) router
    in their home. This is a guide and some of the various steps will be dependent
    on the make and manufacturer of the router being installed. Use this a guide to
    set up your SOHO router.


    TABLE 2.2  Router Setup Checklist


    | Required Items:A) wireless router with power cordB) two Ethernet cablesC) computer
    or laptop |


    | --- |


    |  || Task || Completed |


    | 1 || Plug in the router and turn on the router. ||  |


    |  || Connect the Internet modem to the router. Plug the Ethernet cable into the
    router Ethernet port named “WAN” or “uplink” or “Internet.” ||  |


    | 2 || Turn the modem off and turn it back on (This is to ensure the router is
    recognized). ||  |


    | 3 || Connect a computer to the router. Plug an Ethernet cable into the computer’s
    network connection and the other end into an open port on the router. ||  |


    | 4 || Open the router’s administration tool. Open a Web browser on the computer
    connected to the router. Check the bottom of the router or installation manual
    for the IP address. Often, the default address is [http://192.168.1.1](http://192.168.1.1)
    or [http://192.168.0.1](http://192.168.0.1). ||  |


    | 5 || Log in to the router. Enter the default username and password (Provided
    in the router’s documentation). ||  |


    |  || Make the following suggested changes to your router. The location within
    the routers will vary. These changes will help to secure your router from misuse
    by others. ||  |


    | A || Change default administrator passwords (and usernames). This is of utmost
    importance. Changing the admin username and password prevents users from accessing
    the router and making changes. ||  |'
