    The first step is to have a strong password. The password must not be easily guessed
    by someone who knows the user or by information users openly provides. For instance,
    if one is a diehard sports fan, who wears their favorite team’s jersey all over
    the place and posts online team comments/updates, it would not be a good idea
    to use a password that is not associated in some way with their favorite team.
    One should also have a separate password for each social media account. Also consider
    periodically changing the passwords. Consider using a password manager to assist
    in creating and storing passwords. If there is ever a breach, immediately change
    the password, don’t wait for a notice from the social media company to do it.
    Also change the password for the associated email accounts for that social media
    account. Finally, don’t keep passwords near your devices.


    ## Tips for Creating a Strong Password


    A brute force attack occurs when someone uses a program to try many different
    passwords until they find the correct one. To prevent this, your password should
    be long and complex. A strong password should include a mix of uppercase letters,
    lowercase letters, numbers, and symbols. Avoid using common words or information
    that is easily available.


    1. Your password should be at least twelve characters long.

    2. Use a combination of letters, numbers, and special characters.

    3. Do not use the same password for multiple accounts.

    4. Use a password manager to generate and store your passwords.

    5. Change your password regularly, or if you suspect it has been compromised.

