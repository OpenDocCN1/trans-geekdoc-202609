  trans: '

    有时需要额外的步骤。例如，钓鱼邮件链接中嵌入的 URL 不会出现在截图或打印件中。在不点击链接的情况下捕获该链接可能很困难。最简单的方法是将用户的鼠标光标悬停在可疑链接上，它会弹出一个小窗口显示该链接。用户随后可以对该链接进行截图或将其写下来。


    ### 收集

    收集工作应包括信息的作者或来源。这可能需要用户查看用户资料，并连同问题的贴帖子一起进行截图。电子邮件需要展开以显示信头信息。显示信头信息的方法在每个电子邮件客户端中都不同。如果用户想了解更多关于如何在其电子邮件中查找信头的信息，可以访问
    MX Toolbox 的网站：`https://mxtoolbox.com/Public/Content/EmailHeaders/`。他们提供了一份详细的邮件客户端列表以及访问信头的方法。


    ### 邮件信头

    邮件信头包含单封邮件的跟踪信息，这对于执法部门非常有用。它们详细记录了邮件从发送者到接收者在通过各种邮件服务器（称为邮件传输代理）时在互联网上经过的路径。取决于所经路径和使用的电子邮件服务，这可以是一个或两个邮件服务器，也可以更多（Gmail
    到 Gmail 账户永远不会离开 Google 服务器）。这些邮件信头除了服务器信息外，还包含时间戳（服务器传递邮件的时间）、IP 地址（该服务器的 IP）、发送者/接收者信息以及其他对调查人员可能有用的信息。这些信息有助于协助执法部门找到并定位发送邮件的人员。


    ### 为什么/是什么

    帖子可能是文本、图片和/或视频。要准备好描述用户为何认为除了提供截图之外，该内容还值得采取行动。如果没有关于用户为何认为其内容可疑或违法的具体说明，执法部门可能没有时间审查视频或图像。例如，提供的视频反映了一个人正在讨论威胁要伤害或杀死某人的情况。


    ### 在哪里

    有时，帖子会包含反映作者所在地或可能是其意图目标的信息。如果用户能从帖子中确定这些信息，请将其记录下来。在网络空间中，提供看到帖子的地址至关重要。在图 9.5
    中，从截可以清楚地看到它是在 Facebook 上查看的，因为它包含了 URL。需要获取整个地址，而不仅仅是域名。有时，从截图中无法看清。也许帖子发生在聊天室或即时消息中。如果用户无法在截图中记录位置，他们可能需要将其写下来。再次，记录要保持完整。


    ![](img/fig9-5.jpg)


    图 9.5 为执法部门捕获可在线证据。


    ### 何时

    用户已经截了屏、打印出来或拍摄了数字照片。其中可能包含日期和时间，也可能不包含。用户需要记录他们看到它的时间，即日期、时间和所在时区。采用传统方法将其写下来。例如，在日期/时间/时区于此网络位置（特定的完整
    URL、特定的聊天、特定的即时消息等）看到了该帖子。


    # 举报犯罪


    记录（包括截图）已经完成。现在是时候举报了。


    ## 信用监控与 信用冻结


    ### 信用监控

    信用监控是一种跟踪变化的服务。它不能防止欺诈，但会通知用户潜在的活动。在美国，用户可以通过访问 `https://www.creditreport.com/`
    请求此服务。它帮助用户识别其信息是否在未经授权的情况下被使用。


    ### 信用冻结

    信用冻结是一种用于保护消费者免受身份盗窃的方法。它限制了对用户信用报告的访问，这意味着他人无法开设新的信贷。用户在不解除冻结的情况下，仍然可以进行申请工作、租公寓或购买保险等。


    ## 欺诈警报

    欺诈警报是设置在账户上的安全警报。它通常指的是信用卡账户或信用局列出的账户列表。当发现潜在的欺诈账户活动时，客户、信用卡公司或信用局均可以设置警报。

    '
