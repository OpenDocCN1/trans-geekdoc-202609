  trans: '


    浏览社交媒体可以是老年人与家人朋友保持联系的一种有趣且兴奋的方式，但安全地进行至关重要。保护他们社交媒体使用的第一步是管理隐私设置。确保他们只与朋友和家人分享个人信息，并调整设置，使得只有通过的联系人才能查看他们的个人资料。许多平台提供双重身份验证，这要求在登录前从第二个设备获取代码或确认。这为他们的账户增加了额外的安全层保护，以防止被黑客攻击或未经授权的访问。用户可能需要协助他们完成这些设置，并定期检查以确保其设置得当。


    此外，对他们来说，警惕来自陌生人的好友请求也很重要，在没有验证对方身份的情况下不要接受。同样重要的是，他们要意识到诈骗者会创建真实朋友/亲属的虚假资料。


    提醒弱势成人，他们在社交媒体上看到的所有并非真实。随着虚假新闻和网络仇恨言论的兴起，老年人可能会陷入虚假信息和负面的陷阱，导致孤独感和脆弱感。社交媒体已成为我们日常生活中无处不在的一部分，各年龄的人使用各种平台进行联系、分享和获取信息。虽然它可以提供许多好处，例如与家人朋友保持联系，但它伴随着风险，特别是对老年人而言。老年人可能不熟悉社交媒体相关的技术和潜在危险。对他们来说，理解如何安全地浏览这些平台至关重要。他们需要时间在分享或相信信息之前进行核查。他们需要被提醒避免发布敏感或有争议的话题，并在与他人互动时保持尊重。通过遵循这些安全提示，老年人可以享受社交媒体的所有益处，而不损害他们的个人信息或安全。下方的“社交媒体安全讨论点”列表提供了与弱势成人讨论涵盖的关键社交媒体安全讨论要点。表
    6.4 讨论了在回顾网络安全话题时，与弱势成人讨论的各种话题类型。


    ### 表 6.4 社交媒体安全讨论点


    | # | 描述 |

    | --- | --- |

    | 1 | 创建强且唯一的密码。老年人应避免在多个账户上使用相同的密码，并为每个社交媒体账户创建一个强且唯一的密码。密码管理器对于可能忘记许多密码的老年人来说尤为重要。
    |

    | 2 | 谨慎点击来自未知来源的链接或打开附件。这些可能包含病毒或恶意软件，可能会损坏他们的设备或窃取其信息。这些链接还可能引导恶意网站，导致其系统感染恶意软件。在点击任何链接或下载附件之前，核实信息的来源总是更安全的。
    |

    | 3 | 发布前思考。在社交媒体上分享任何内容之前，老年人应该考虑这些内容可能如何被用来对付他们。这包括个人信息、照片，甚至是位置签到。 |

    | 4 | 谨慎对待好友请求。老年人应只接受他们认识并信任的人的好友请求。警惕可能试图在社交媒体上建立联系的陌生人关重要。他们还需要理解，诈骗者会以朋友/亲属的名字创建虚假资料来欺骗他们建立联系。
    |

    | 5 | 限制个人信息。应警告老年人不要在社交媒体平台上分享全名、地址、电话号码或出生日期等个人信息。 |

    | 6 | 注意虚假新闻和诈骗。老年人应警惕社交媒体上流传的虚假新闻和诈骗。建议在分享或相信这些信息之前对其进行事实核查。 |

    | 7 | 使用信誉良好的社交媒体平台。老年人应坚持使用信誉良好且著名的社交媒体平台，以减少诈骗和其他问题的风险。约会网站经常被犯罪分子利用，通过各种手段迫害受害者。诈骗者会试图说服目标在消息应用上继续交流，例如
    `WhatsApp` 或 `Telegram`。这些应用程序的使用是为了方便诈骗者的操作，并进一步隐藏他们的踪迹。 |


    ### 识别诈骗


    尽管采取了预防措施，弱势成人在使用社交媒体时仍可能遇到虚假资料、诈骗或其他令人担忧的内容。如果他们在社交媒体上遇到任何可疑活动或收到来自未知来源的消息，知道识别和报告它们就很重要。例如，如果有人收到来自朋友或家人的索钱可疑信息，他们应该在发送任何资金之前核实请求的真实性。他们可以通过其他通信方式直接与该人联系，例如打电话或要求信赖的家人核实他们是否在寻求帮助。诈骗者对
    AI 的使用将使这变得具有挑战。社交媒体平台对虚假资料、诈骗和其他令人担忧的内容设有专门的举报功能。弱势成人应该了解这些功能并在必要时使用。社交媒体上需要留意的某些红旗包括：


    * 最近创建的资料

    * 带有可疑或无信息且好友数量有限的资料

    * 索要个人信息或钱财的自来信息

    * 语法或拼写错误的帖子或消息

    * 要求要钱、汇款、购买/转移数字货币或礼品卡

    * 请求交换裸体照片或视频，这在以后可能被用于勒索弱势成人。


    ### 处理潜在的网络攻击/诈骗


    发现成年家庭成员已成为网络攻击或诈骗的受害者是一个压力巨大且令人担忧的情况。保持冷静并理智地处理情况至关重要。处理潜在事件的第一步是收集有关发生情况的所有信息和细节。这包括收到的任何可疑电子邮件、短信或电话，以及任何可能已泄露的财务交易或个人信息。记录一切并跟踪可能进一步调查所需的任何证据至关重要。如果受害发生在社交媒体平台上，请记录发生的地点以及涉及的个人资料。捕获所有文本/聊天消息。某些程序允许用户下载这些内容。如果没有，用户应该对消息进行截图。


    一旦收集了所有必要信息，立即采取行动保护受害者并防止进一步损害至关重要。这可能包括联系相关的金融机构冻结账户或注销信用卡，更改所有在线账户的密码和安全问题，并通知相关当局。（美国居民请参见
    表 6.7，美国境外请参见 表 6.8）。教育受害者如何识别和避免未来的潜在诈骗，以及定期监控其账户的任何可疑活动也很重要。最后，在这一困难时期提供情感支持和保证对于帮助受害者感到安全和放心至关重要。表
    6.5 是帮助从身份盗用和诈骗中恢复的四步指南。如果您或您的亲人成为受害者，请考虑这些步骤。


    ### 表 6.5 从身份盗用/诈骗中恢复的四个步骤


    | # | 步骤 | 行动 |

    | --- | --- | --- |

