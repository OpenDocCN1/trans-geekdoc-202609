  trans: "\n\n“买者自负”（买家/卖家要小心）在在线市场和传统市场同样适用。不要仅仅依赖产品数字图像、买卖双方简介和评论的表象。如果销售价格或展示的产品好得令人难以信，那么它很可能真的如此。对买家或卖家以及待售产品进行全面的尽职调查研究。在进行该研究时，不仅要使用他们的姓名和简介，还要使用他们提供的电子邮件地址、电话号码和邮寄地址。网上可能已有关于他们问题的报告。较新的简介可能是一个疑点。大量具有相似或相同评论的评价可能表明他们是虚造的。避免没有联系方式或拒绝提供合法联系方式的卖家。此外，请采取以下步骤：\n\
    \n### 在线交易安全检查清单\n\n`Table 7.1` 在线交易安全检查清单 旨在为您提供一个易于使用的清单，以协助您在在线交易中的安全。\n\n\
    1. **让卖家/买家提供电话号码并进行验证。**\n\n    * a. 警惕连接到 `Google Voice` 等服务的号码。报告显示，诈骗者会尝试发送带有\
    \ `Google Voice` 验证码的短信并向用户索要该代码来验证用户身份。如果用户提供了验证码，他们将尝试用它创建一个与用户手机号码关联的 `Google\
    \ Voice` 号，并将其用于欺诈交易。\n    * b. 电话的声音与他们声称的身份相符？例如，如果某人声称来自某个地方，但其说话方式与其所在地不符（例如带有外语口音或破碎的英语），这是一个红旗信号。\n\
    \    * c. 他们是否只在自己选择的时间与用户交谈？这可能表明他们正在使用一个听起来更合法的团队来与用户交流。没有口音的人听起来可能更有说服力。他们在促成交易方面可能更加老练。视频通话也是如此。他们可能使用一个表现更好的团队来看起来更具说服力。\n\
    \    * d. 注意清晰度较差的电话。这可能表明该电话是通过互联网从境外地点发出的。这也使得难以确定来电者的声音和合法性。\n\n2. **支付形式：**\
    \ 警惕那些坚持将电汇作为唯一接受支付形式的买家。一种常见的骗术是过度支付，然后在用户退回溢付款后取回全部款项。同样，不要兑取过度支付的支票。不要兑现，而是要求开具准确购买金额的支票。再次，一种常见的骗术是提供坏支票作为过度支付，让卖家退还差额。如果收到银行本票、汇票或其他等物，请拨打用户在网上找到的银行电话，而不是买家提供的号码，以验证支票的有效性。\n\
    \n3. **托管服务：** 对于大额物品，请使用合法的在线托管服务，该服务将在买家收到订单物品之前持有付款。\n\n4. **绝不要提供社会安全号码或驾执照号码：**\
    \ 合法的卖家不会询问此类信息，但身份窃取者会要求。\n\n5. **使用信用卡进行在线购物：** 如果货物未提供或有缺陷，这可以通过信用卡公司提供额外保护。此外，许多信用卡在尝试从曾有欺诈交易记录的商处购买时会提醒用户并阻止交易通过。\n\
    \n6. **面对面交易：** 有时卖家和买家会面对面完成交易。这大大增加了不仅是财务而且是人身伤害的可能风险。在公共场所安排会面地点，特别是警察站或物业处。犯罪分子不想与警察有瓜，将避免在此类地点会面。除了警察的存在，那里通常还有监控该区域的摄像头，这对有犯罪倾向的人具有进一步威慑。如果可能，最好在警察站内部。许多警察站已建立了网络销售安全区或安全交易区（参见\
    \ `Table 7.2 面对面交换货物`），专门确保买卖双方在交易期间的安全。Safe Trade Stations (`https://www.safetradestations.com/safetrade-station-list.html](https://www.safetradestations.com/safetrade-station-list.html)`)提供了提供此类服务的警察机构列表。如果会面地点没有参与的警察机构，请联系当地警察局。\n\
    \n"
