- raw: 'a.Geotagging occurs in so many functions now. One of the most obvious is the
    tagging of a user’s photos with the geolocation they were taken. This can be dangerous
    and compromise one’s safety. For example, if a child takes photos with the geotagging
    feature on and posts the photos online, they could potentially be providing a
    stalker with the exact location of their bedroom. Not all social media keeps this
    data when images are posted, but why risk this occurrence?


    3.Remove third-party plugins or apps.


    a.Third-party plugins and apps may seem cool on a social media site. When used
    they are often leaving the social media site’s security and going to an unknown
    site with questionable security. Taking that survey from Facebook about what kind
    of animal a user is could lead to allowing an unknown company in an unknown country
    access to one’s phone.


    b.Review of social media profile. Sites such as Facebook and LinkedIn allow users
    to see their profile as others would. Use this feature to review what others are
    seeing to insure information is not being inadvertently leaked.


    [Table 4.2](#chapter04.xhtml#tab4-2) Social Media Security/Privacy Checklist has
    been added to provide you with a checklist for reviewing your social media and
    privacy. Use this checklist as a personal guide to help secure your social media
    accounts.


    TABLE 4.2  Social Media Security/Privacy Checklist


    ![](image/tab4-2.jpg)


    STEPS TO AVOIDING SOCIAL MEDIA SCAMS


    1.Be selective when accepting friends, posting, and clicking.


    2.Be selective with people the user doesn’t know. Accepting all requests to connect
    with can be dangerous. If one doesn’t know someone, do they really want to connect
    with them? Fake accounts are used to try and gain access to user’s accounts or
    to their connections. One should be suspicious of recently created accounts, particularly
    if they are portraying someone very likely to have created an account much earlier.
    Some accounts one may even know, but criminals impersonate friends trying to gain
    access to the user’s account and friends list. It is not uncommon to see a fake
    account attempt to connect with user when the real person is already a connection.


    3.Think twice before clicking on a link.


    4.Be careful where one checks in from. Is geolocation on and has the user just
    alerted a burglar they are not home?


    5.Don’t share personal information online.


    6.Be mindful of phishing scams.


    7.Don’t use social credentials to sign into third-party sites.


    8.Avoid quizzes and games that may give access to a user’s profile and other personal
    information. These are often designed for the user to reveal details about themselves
    that can be used to obtain a password or overcome two-factor authentication questions.


    9.Avoid the clickbait material posted. Often, it is a breaking celebrity death
    or some news about the latest photos stolen from a celebrity. These can and often
    are attempts at gaining access to a user’s device through links that are malicious.


    USING PSEUDONYMS ON SOCIAL MEDIA


    It is certainly possible to use different pseudonyms for different social media
    services. Social media networks want users to feel safe and trust one another
    and using a pseudonym does not denote trust. Given the current environment of
    phony accounts set up to allow bots (computer code that tries to act like a human)
    to respond on social media it’s easy to see why companies only want real people.
    They are using techniques like requiring a user’s cell phone to verify accounts.
    Gone are the days when people could make up multiple accounts and not have them
    associated with themselves. (Hackers and law enforcement still get around some
    of these security efforts.) Separate accounts may be a good way to ensure your
    personal protection. Be aware that using a pseudonym on a social media account
    may be prohibited by the site. It can be deleted without notification and the
    user will likely lose all data associated with that account. Additionally, spoofing
    (using) another individual’s identity is never a clever idea and is illegal.


    OTHER THINGS NOT TO DO ON SOCIAL MEDIA


    It is not necessary to post certain information on the Internet. It should be
    common knowledge by now not to post birth dates, addresses, family contact information,
    school information, and racy photos, but what other information should not be
    put online? What things should our children or other family members refrain from
    putting online?


    1.Remember pictures users share online are no longer controlled by the user.


    2.Before posting something that involves another person, they should be asked
    if they mind it being posted to a social media account.


    3.Users should not trust emails from people the they do not know.


    People love to share information on social media. When they go on vacation and
    leave their homes unoccupied, it is wise to not be so open with information. The
    things the user should avoid on social media while on vacation are:


    1.Posting specific travel plans, specifically about when, where, or how long the
    user will be on vacation. Post these travelogue photos when back at home.


    2.If the user can’t wait to post about the trip or post their favorite selfie,
    they should do it to a tight group of friends or family and not post them publicly.


    3.The best idea is to take a computer break while on vacation, and consider forgetting
    about social media for the trip.


    DOES SOCIAL MEDIA REVEAL LOCATION?


    Most social media sites can display the user’s physical location if they allow
    it. Location is data one’s phone collects from the GPS system. In some cases,
    the user’s computer can also reveal location information based on the Internet
    Protocol address the computer uses when the user goes online. To not allow this
    to occur, check the setting of the social media app to prevent this from occurring.


    Photos taken can also contain potential GPS location data. Some, but not all social
    media sites remove this data when posted online. Save the hassle and change the
    settings in your phone to stop the phone’s photo function from collecting this
    information.


    BEING ON SOCIAL MEDIA WITHOUT A PROFILE


    Individuals may decide not to have a social media presence. This does not mean
    they will not find themselves being posted to social media profiles. Friends,
    schools, and employers will post an individual’s pictures to social media, often
    without seeking permission. These images can include not only the picture but
    also identifying information. Be aware of who is taking pictures and what they
    intend to do with those images. Some entities will honor a request not to post
    them or to block the individual’s face out of the image.


    SOCIAL MEDIA ON THE USER’S CELL PHONE


    Cell phone social media apps have a tendency to leak data whether or not the user
    wants it to. When the user agrees to download the app, they click through the
    agreements to allow the app access to everything on the phone. By giving the app
    permission to access the user’s phone, one potentially is allowing them access
    to their personal information. It may seem the best advice is to remove all the
    apps from one’s phone. Removing all the apps from our phone may not be practical
    in today’s world. Communication apps and social media apps are how the world communicates.
    So, what can we do on cell phones to protect ourselves? Many of the same protections
    we have mentioned before apply to cell phones. Make sure the apps do not reveal
    more information than the user wants them to about who they are and where they
    are.


    1.Enable privacy.


    Make sure to review the privacy settings of their smartphone and the settings
    of any apps one downloads. Set the privacy settings as high as the user feels
    is needed for their situation.


    2.Only download apps from Google and Apple stores.'
