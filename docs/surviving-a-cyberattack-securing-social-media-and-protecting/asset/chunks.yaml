  trans: '

    在线借记卡和信用卡是两种不同的产物。它们最终使用相同的信贷交易系统，但在法律上是不同的，且用户的个人责任以及银行更换资金的要求也可能有所不同。借记卡类似于现代支票交易，它是对用户账户中实际拥有的资金的扣款。信用卡是信用的延伸，是银行机构的资金。根据所遭遇的欺诈情况，银行在更换个人资金方面可能没有处理其提供的信贷损失时那么快。借记卡的安全性比过去有所提高，但仍然存在欺诈者可能通过借记卡访问银行账户并耗尽个人资金的可能性。使用信用卡进行在线购物通常是最佳安全选择。


    ### 第三方钱包或虚拟卡


    在在线购物时，防止欺诈的一种良好方法是使用第三方钱包，如果用户拥有 `Google`、`Apple` 或 `PayPal` 账户即可可以使用。它们拥有用于保护用户交易的支付系统。它们使用一种名为
    `tokenization`（令牌化）的过程。它们通过自己的系统提供虚拟信用卡号或支付，而不是用户的原始卡片。


    许多信用卡公司都提供虚拟卡作为选项。[Privacy.com](http://Privacy.com) ([`privacy.com/`](https://privacy.com/))
    也提供虚拟卡号服务，帮助防止用户成为受害者。


    ### 立即报告问题


    立即报告借记卡/信用卡上任何未经授权的交易。这应该向银行机构和执法部门报告。报告得越早，资金就能越快返回用户的账户。执法部门通常会提供一个案件编号，银行可能需要该编号作为犯罪已报告的证明。


    #### 表格 7.1 在线交易安全清单


    | 检查项目 | 动作 | 已验证 |

    | --- | --- | --- |

    | 定期检查您的信用卡/借记账户 | 定期检查账户活动。是否存在未经授权的交易？如果发现异常或可疑情况，联系银行。 | |

    | 信用卡/借记卡 PIN 码保护 | 不要向任何陌生人、家人或任何来电人员提供身份识别码。 | |

    | 避免公共网络 | 公共互联网网络（咖啡馆、机场和其他公共场所）是不安全的。如果用户必须使用，请考虑使用 `VPN` 以防止窃听。 | |

    | 强密码 | 再次，强密码（尤其是财务和银行信息的强密码）对于防止成为犯罪受害者至关重要。 | |

    | 使用安全的网站 | 寻找网站上的小锁功能。这意味着它们是安全的。在输入借记或信用卡详情之前，确保已看到它。如果没有，请停止输入信息。 | |

    | 寻找钓鱼攻击 | 钓鱼可以以伪造网站或账户登录页的形式出现，这些页面看起来合法但实际上并非。盲目跟随电子邮件、短信甚至网页中的链接可能是危险的。 | |

    | 双重身份验证 (2FA) | 确保为银行信息设置了双重身份验证。 | |

    | 账户警提醒 | 为任何种类的交易设置账户提醒，当用户账户发生交易时发出通知。 | |


    #### 表格 7.2 面对面商品交换


    | | | |

    | --- | --- | --- |

    | 1. | 警察到场以确保每个人的安全。部门将对现场交换有规定，例如特定的开放时间、需要预约，以及禁止携带枪支。如果可能，请在部门内部会面。 | |

    | 2. | 仅在白天时段见面，除非警察部门提供 24 小时的室内设施。 | |

    | 3. | 警察不会参与交易细节。如果交换的物品可能是被盗的，某些警察部门可能检查出售物品的序列号，以确定其是否在被盗物品数据库中。 | |

    | 4. | 在交易前或交易后携带大量现金要小心。交易完成后，采取预防措施防止被跟踪。遵循本章中关于接受支票或其他支付形式的预防措施。 | |


    某些物品在警察局进行交换是不切实际的，例如大型家具或无法运行的车辆。因此建议采取以下措施：


    * 如果交易必须在警察局外进行，人多力量大。永远不要让自己处于劣势。让两个或两个其他个人在场，并确保对方知道会有人在场。

    * 永远不要让某人单独离开，即使去厕所也不行。

    * 不要让超过一个人同时前往用户住所购买或出售物品。


    ### 结论


    本章概述了在线安全的最佳实践。这包括在在线购物时需要考虑的事项清单，以及一些帮助防止用户信用卡或卡片被破解的资源。第 8 章 将讨论小微企业保护。


    | 章节 | 8 |

    | --- | --- |


    # 保护小微企业


    ## 本章内容


    本章讨论了小型家庭业务 (SHB) 保护的概念。主题包括预防商业诈骗的方法、作为 SHB 如何处理社交媒体、数据备份、过时系统的数据销毁、接受政策以及监控
    SHB 员工的计算机使用情况。


    ## 21 世纪的小微企业


    由于新冠病毒肺炎，商业发生了变化。那些没有认为自己不需要在线业务的小微企业企业主面临着在社交距离成为新常态的世界中生存的严酷现实。新模式，即使对于餐厅等传统的实体店，也要求他们拥有一个强大的在线形象。零售业务必须提供让客户在线购物和购买的能力。在新冠病毒之前，许多企业允许员工灵活远程办公。那些没有拥抱远程办公的人现在将其视为继续运营的必要条件。


    创建在线形象也使企业、其员工和客户都成为犯罪分子的潜在目标。在疫情期间，犯罪分子在进行非法行为时并没有保持社交距离，例如干扰 Zoom 会议。书中之前涵盖的个人网络安全问题显然适用于
    SHB。为 SHB 电脑创建一个数字风险清单，如表 2.4 所示。这在硬件丢失或被盗时将非常重要。根据需要继续参考那些特定章节以涵盖 SHB 的网络保护。本章涵盖了某些对
    SHB 独特的领域。


    ## 预防常见的商业诈骗


    如今的商业诈骗通过电子邮件或电话进行攻击。它们的成功取决于所有者或 SHB 员工对技术的天真。通过实施良好的实践是可以预防的。良好实践的缺失可能会导致糟糕的局面，例如勒索软件对
    SHB 所有数据进行加密。


    ### 针对小微企业的常见诈骗


    联邦贸易委员会 [2024] 识别了九种小微企业诈骗，这些是书中其他地方欺诈计划的变体。它们是：


    虚假发票和未订购商品


