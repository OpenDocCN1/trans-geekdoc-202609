- raw: 'This chapter discusses concepts of caring for the adult vulnerable family
    members who are not necessarily capable of dealing with cyberissues. Topics include
    methods for protecting them from cybercrime, dealing with the aftermath of a cyberattack,
    and handling social media after they pass on.


    THE RISK TO VULNERABLE ADULTS IS REAL


    In 2024, the Federal Bureau of Investigation (FBI) Internet Crime Complaint Center
    (IC3) reported 2023 losses by those over the age of sixty topped $3.4 billion,
    an almost 11% increase in reported losses from 2022. There was also a 14% increase
    in complaints filed with IC3 by elderly victims. \[Federal Bureau of Investigation
    2024\]


    Protecting vulnerable adult family members (senior citizens and disabled adults)
    in the digital world can’t be overstated. As the world’s population begins to
    age, the number of older adults online is increasing. We often hear more about
    the issues with younger people and online risks. Overlooked are the numbers of
    older people on social media and the harm they face. They are using their computer,
    their smartphone, and their tablets to access all kinds of resources that can
    expose them to cyber risks.


    Vulnerable adult members are more trusting, particularly of government agencies,
    which makes them easy prey to schemes involving fraudsters pretending to be the
    government or convincing them to otherwise trust them. For a variety of reasons,
    they may feel isolated and lonely. These feelings of loneliness and isolation
    make them easy marks for criminals to manipulate them with attention and false
    praise. Their declining and/or limited mental/physical health due to age or illness
    affects their ability to suspect or detect another’s evil intent. They are also
    unfamiliar with technology. These factors coupled with the possibility they have
    financial assets/resources makes them a very inviting target for cybercriminals.
    Criminal elements recognize these factors and will not hesitate to exploit them
    for their own benefit. Family members need to develop a plan to aid them and protect
    them from these cyber risks.


    COMMON ONLINE THREATS


    Some of the more common threats to vulnerable adult family members are many of
    the same ones encountered by the rest of the population. Some threats seem specifically
    to target susceptible adults, such as identity theft. With the increasing use
    of technology and online transactions, it has become easier for scammers to steal
    personal and financial information. Vulnerable adults may not be as tech-savvy
    as younger generations, making them more susceptible to giving away their personal
    information to fake Web sites or parties they do not know.


    Online threats come in various forms. These often lead to financial losses, can
    compromise personal information, and can negatively affect a vulnerable adults’
    mental/emotional well-being. It is essential to be educated about these threats
    and how they operate. [Table 6.1](#chapter06.xhtml#tab6-1) lists some of these
    threats. [Table 6.2](#chapter06.xhtml#tab6-2) provides Web sites that provide
    more details about these threats, emerging trends, and/or methods for reporting
    and addressing them.


    TABLE 6.1  Types of Online Threats


    | Type || Definition |


    | --- | --- |


    | Identity theft || Identity theft is a crime during which someone uses another
    person’s personal information, such as their name, social security number, credit
    card number, or other identifying information, without their permission to commit
    fraud or other crimes. This can lead to financial loss and damage to the victim’s
    reputation and credit. |


    | Online scams || Online scams use the Internet to deceive victims into giving
    away their money, personal information, or sensitive data. These scams can take
    various forms, including fake Web sites/profiles, phishing emails, telephone calls
    or social media or text messages. Social engineering tactics are often used to
    trick victims into giving away money or personal information. They often promise
    unrealistic rewards or benefits. They can also involve threats to convince the
    victim that if they don’t take some action some financial or legal harm will befall
    them. These scams often involve impersonating a legitimate organization or authority
    and using fear or urgency to pressure victims into taking immediate action. Fake
    tech support, investment and cryptocurrency, Medicare and healthcare, romance,
    and grandparent scams described in this table are specific examples of these schemes.
    |


    | Fake tech support scams || These fraudulent schemes involve scammers impersonating
    technical support from legitimate companies, such as Microsoft or Apple, and tricking
    victims into giving them access to their computer or personal information. This
    scam can also manifest in the form of pop-up warnings on Web sites, urging the
    victim to call a fake tech support number. If pop-up warnings are showing, run
    a scan of the system as it may be infected. Fake pop-ups are also an indication
    that the user was visiting a Web site that is either infected or is untrustworthy.
    If the system is up to date, pop-up scams should be greatly minimized. Scams can
    lead to financial loss or identity theft. |


    | Investment and cryptocurrency scams: || These fraudulent schemes promise huge
    and unrealistic returns on investment. They will often convince the target they
    are an expert, or they know a trusted individual who is advising them. They use
    fake Web sites, social media accounts, reports, screen shots, and emails to establish
    the investment is real and a great value. This is all false. They range from investments
    in high-risk stocks/bonds, to gold markets and digital currencies, such as Bitcoin.
    They trick victims into investing money. Once invested the fraudsters will provide
    bogus information to show the victim their investment is growing, to entice them
    into investing further. Victims will not recover their investment or any fictitious
    profits. |


    | Medicare and healthcare scams: || Medicare and healthcare scams target elderly
    and vulnerable individuals by promising false or unapproved medical treatments
    or services. These scams can also involve identity theft, where scammers use stolen
    information to bill Medicare for fake services or equipment. |


    | Romance scams: || Romance scams are a type of online scam where fraudsters create
    fake profiles on dating Web sites or social media platforms to establish romantic
    relationships with unsuspecting victims. These scams often involve grooming victims
    for weeks or months before asking for money, often for fictitious investment schemes
    or personal information under false pretenses. Failing to convince the victim
    to forward money or personal information, sexual banter may occur to convince
    vulnerable adults to forward nude images for extortion schemes. |


    | Grandparent scams || This is one of the most common types of scams targeting
    older adults. In this scam, the elderly individual receives a call from someone
    pretending to be their grandchild or other relative in distress. The caller pretending
    to be the loved one claims to have been in a car accident, arrested, or in need
    of urgent financial assistance. In these cases, the scammers often use information
    found on social media or other public sources to make their story sound more convincing.
    They then request that the victim send money immediately through wire transfers,
    gift cards, or prepaid debit cards, making it difficult to track and recover the
    funds once they have been sent. Artificial intelligence (AI) may be used to impersonate
    loved ones to make the messages requesting financial assistance more believable.
    Consider adopting a password or password phrase for communicating with loved ones
    that can’t be guessed for ensuring the user is actually speaking to the real person
    and not an AI created voice. |'
