    # 应该购买什么类型的路由器？应该花多少钱？


    选择合适的路由器可能是一个挑战，因为人们希望以合理的价格获得最好的产品。问题在于，技术变化非常快，如果不加建议，推荐的品牌或型号很快就会过时。为了保护家庭网络，Wi-Fi
    路由器需要具备某些特定功能。


    通常，用户主要关注的是连接到 Wi-Fi 路由器的范围（例如，它能覆盖整个房屋？）以及连接时获取数据的速度。从安全的角度来看，这些是我们对路由器最后才关心的问题。大多数新路由器都是即插即用的。用户必须登录
    Web 风格界面并通过向导进行设置。软件向导或设置是一个引导用户通过一系列步骤配置程序的用户界面。它通过将复杂或不熟悉的任务分解为较小、易于管理的部分来简化任务，而且通常速度很快。让我们来看看在购买家用
    Wi-Fi 路由器时应该关注哪些点。


    ## 需要考虑的关键特性


    ### 1. 标准、标准、标准

    不要被 `802.11g`、`802.11n` 或 `802.11ac` 等长长的标准列表搞混。它们是路由器能力的书面技术标准。`802.11` 是官方标准名称，后面的字母是版本号。对于普通家庭用户来说，首选最新的可用标准。不要购买旧技术，因为新标准很快就会被取代。用户不应因购买旧设备而让网络面临风险。他们应该购买最新版本。用户可以询问科技商店的销售店员，或在
    Google 上搜索“当前 802.11 标准”。


    ### 2. 多频段路由器

    在寻找路由器时，用户会发现大多数现代路由器都在多个带宽上进行广播。通常，`2.4GHz` 和 `5GHz` 频段使用户方便在一个频段上浏览，在另一个频段上流视频。


    ### 3. 使用 MIMO 还是不使用 MIMO

    多用户多输出（MIMO）是一项允许许多设备同时获取高带宽 Wi-Fi 信号的技术。它在多个连接上更高效地分配数据，为用户提供更快的 Wi-Fi 速度。


    ### 4. 安全

    Wi-Fi 网络很流行但可能不安全。用户必须保护家庭网络，以防止范围内的黑客窃听。为了做到这一点，必须考虑 Wi-Fi 背景下安全的意味着什么。有一系列关于安全特性的令人头疼的缩写。它们按照安全程度从高到低的顺序列出：


    a. `WPA3`

    b. `WPA2 + AES`

    c. `WPA + AES`

    d. `WPA + TKIP/AES`

    e. `WPA + TKIP`

    f. `WEP`

    g. `开放网络`（完全没有安全措施）


    请记住，网络的安全性取决于连接到网络的最低不安全的设备。这意味着连接到 Wi-Fi 的手机、平板电脑、电脑或其他设备都需要相同级别的安全防护才能确保网络安全。目前最高的安全性是
    `WPA3`。Wi-Fi 保护访问意味着第二种实现。


    *（注：提供的源文件中剩余文本包含大量的损坏/重复短语。根据保留核心内容和优化格式的指令，我已处理了下方的逻辑部分。）*


    ---


    ## 路由器设置指南


    ### 路由器设置指南


    要设置您的小型办公室和家庭办公室（SOHO）路由器，请遵循本指南。某些不同步骤取决于制造商。


    #### 设置步骤

    1. 插入路由器并开启路由器。

    2. 将接入调制器连接到路由器。将以太网线插入名为 `WAN`、`uplink` 或 `Internet` 的路由器端口。

    3. 关闭调制调器并重新开启（这是为了确保路由器被识别）。

    4. 将电脑连接到路由器。将以太网线端插入电脑的网络连接，另一端插入路由器上的空闲端口。

    5. 打开路由器管理工具。在连接到路由器的电脑上打开 Web 浏览器。检查路由器底部或安装手册获取 IP 地址。通常默认地址为 `http://192.168.1.1`
    或 `http://192.168.0.1`。

    6. 登录路由器。输入默认用户名和密码（由路由器文档提供）。


    #### 路由器设置清单


    | 任务 | 已完成 |

    | :--- | :--- |

    | 插入路由器并开启路由器。 | |

    | 将接入调制器连接到路由器（`WAN`/`uplink`）。 | |

    | 关闭调制调器并重新开启。 | |

    | 通过以太网线将电脑连接到路由器。 | |

    | 通过 IP 地址打开路由器管理工具。 | |

    | 使用默认凭据登录。 | |

    | 更改默认管理员密码和用户名。 | |


    '
