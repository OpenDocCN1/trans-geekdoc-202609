- raw: '6.Users should use privacy settings on social media. Social media platforms
    have privacy settings that allow users to control who can see their posts and
    personal information. It is important to review and adjust these settings to one’s
    comfort level. Having accounts open to everyone on the Internet may not be the
    best option for one’s personal security level. Users should periodically check
    these settings to ensure they remain accurate.


    It is a common practice in the digital age for social media companies, data aggregators,
    and cell phone makers to collect information on user’s every online move. Many
    companies use data tracking and analytics to better understand their audience
    and deliver more targeted advertisements. To protect one’s information from these
    companies, a user can use ad blockers and limit the amount of personal information
    they share online. One can also review and adjust their privacy settings on various
    Web sites and apps. Additionally, being mindful of what one clicks on and which
    Web sites are visited also helps reduce the amount of data collected.


    It is also a good idea to regularly review and delete apps and accounts one no
    longer uses to minimize their digital footprint. Users should stay informed about
    data breaches and take steps to protect their information if data is compromised.
    Overall, being mindful and cautious of one’s online activity can go a long way
    to protecting personal information.


    Privacy versus Security


    Online security refers to measures taken to protect online information and systems
    from unauthorized access and potential threats. This includes implementing strong
    passwords, using firewalls and antivirus software, and frequently updating software
    and systems to prevent hackers from gaining access. Online security aims to ensure
    the confidentiality, integrity, and availability of online data and services.


    Alternatively, online privacy refers to the control individuals have over the
    collection, use, and sharing of their personal information online. This includes
    keeping personal information such as name, address, and financial details private
    and not sharing it with third parties without consent. Online privacy also involves
    being able to browse, communicate, and conduct transactions online without fear
    of being monitored or having personal information collected without permission.
    While online security focuses on protecting data from external threats, online
    privacy focuses on protecting personal information from being accessed or used
    without permission.


    BROWSER FUNCTIONS


    Going on the Internet is not just using the World Wide Web. There is a whole process
    underlying typing a uniform address locator (URL) or address in a browser (or
    clicking on a link in Google or another search engine). The technical aspect is
    written in numerous books. There is a lot that goes on behind the scenes for one
    to get to their favorite Web site on the Internet. From a security point of view,
    users have to know what a browser tells other people and Web sites about them.
    Only with this knowledge can they hope to limit their risk exposure.


    Selecting a Browser


    It is important to consider which browser has the strongest and most reliable
    security features. Some popular browsers, such as Google Chrome and Mozilla Firefox,
    offer built-in protection against malware and phishing attempts. It is also important
    to keep one’s browser up to date with the latest security updates and patches
    to ensure maximum protection. Additionally, look for a browser that allows for
    customization of security settings, such as adjusting the level of privacy and
    blocking certain types of cookies.


    Select browsers that have a strong track record of protecting user data and respecting
    privacy rights. Browsers that offer features like private browsing or incognito
    mode can also add an extra layer of security by not storing your browsing history,
    cookies, or login information. Additionally, consider browsers that offer features
    like ad blockers or antitracking technology, as these can also help protect a
    user’s online security and privacy. Ultimately, it is important to carefully research
    and compare different browsers to determine which one offers the best security
    features for a user’s specific needs and concerns.


    INITIAL BROWSER SET-UP


    Some considerations when one downloads and installs a new browser can include
    blocking cookies. This is different in every browser. But this is a must to prevent
    Web sites from tracking who you are. Each browser handles blocking cookies in
    a different manner.


    For a Chrome browser click the three dots icon in the top-right corner of the
    user’s screen. This will open a popup screen. Click on Settings. The new tab reflected
    in [Figure 3.2](#chapter03.xhtml#fig3-2) will give the user access to Privacy
    and Security settings. For a user to locate how to access their particular browser’s
    security settings, they should do a Google search with the following search parameters:
    browser privacy and security settings + (user’s specific browser).


    ![](image/fig3-2.jpg)


    FIGURE 3.2  Chrome browser “privacy and security” settings.


    ONGOING BROWSER MAINTENANCE


    From time to time, one needs to clean out the clutter and remove cookies, browsing
    history, and temporary Internet files. One can use a tool that enables them to
    remove tracking devices from their systems such as CCleaner, Bit Bleach (made
    famous by its use to Hillary Clinton’s system). This can also be accomplished
    under one’s browser settings. Under one’s browser’s Privacy and Security section
    there are multiple options for protecting oneself. The default setting Allow sites
    to save and read cookie data (recommended) is on by default. From a security standpoint,
    this is not the most effective option for a user because it does not stop companies
    or bad actors from tracking their browsing. The best option is to select the Block
    third party cookies, however, the user must understand some Web sites won’t appear
    properly if this is selected. The question is does the user want security or a
    great Web site experience? It’s the user’s choice, or chance, at being safe or
    allowing a bad actor the chance to access their system. [Figure 3.3](#chapter03.xhtml#fig3-3)
    describes how a browser communicates with a website to bring to your browser data
    and produce a website on your computer.


    ![](image/fig3-3.jpg)


    FIGURE 3.3  Web browser and server communication.


    ![](image/fig3-4.jpg)


    FIGURE 3.4  Two-factor authentication.


    There are also many software applications too for blocking cookies and Web sites
    that are available for download. Some are included as browser extensions but depend
    on the browser you are using. There are many different types of ad blocking software’s
    such as ADBlock or Ghostery that you might want to investigate to aid in your
    protection.


    Additional Hiding Measures


    A simple way to hide from data-seeking companies is to make up false identities.
    This is legal, but it might be a violation of the terms of a Web site’s service.
    As long as one is not doing something that is illegal, the use of “sock puppet”
    (a false online identity) is common on the Internet. This is an extreme measure
    and takes a lot of effort to ensure that one is using false information regularly.
    The problem can be when the user wants to use their real identity to buy something
    on Amazon. Their browser might reveal the user’s true identity.


