- raw: '5.Impersonation: An increasing concern is the taking of photos from a user’s
    account to create a fictitious social media account to trick others into providing
    access to their accounts or to commit fraud.


    REVENGE PORN


    Unfortunately, some individuals have no issue with using the most intimidating
    images to get back at someone. People post unflattering nude images of other people
    on the Internet out of spite. Angry and emotional people do things that due to
    the Internet’s nature cannot be undone. Electronic images do not degrade like
    paper images. They can easily be copied and disseminated from device to device.
    Once these images are posted online, they can literally spread worldwide. Once
    online they can be downloaded, copied, and even cached by search engines. One
    embarrassing image can become millions of exact copies. Regrettably, it’s typically
    a former sexual partner trying to embarrass or harass someone. The image is posted
    without consent revealing nude or sexually explicit images or videos. This is
    a crime in many jurisdictions and should never be overlooked as an innocent prank.
    This is clearly one of the dangers teens face when they take images of themselves
    which at the time seemed innocent and fun. Many teen romances end and the potential
    for these images to go beyond their intended audience is very real. Warning our
    kids of this potential pitfall needs to be a top priority. Sharing explicit images
    of teenagers (under eighteen) has always been a crime. Most states now also have
    laws prohibiting the nonconsensual posting of adult images. In 2018, a woman was
    awarded $6.45 million dollars in a civil case where her copyrights were violated
    as the defendant had impersonated her online with intent to harm, stalked her,
    and intentionally inflicted emotional distress \[Doe v. Elam 2014\].


    ADDRESSING SOCIAL MEDIA RISK: SECURITY VERSUS PRIVACY


    The first step in addressing social media risk is to identify all of a user’s
    accounts. Document each account’s username/email and password using a password
    manager (see [Table 4.1](#chapter04.xhtml#tab4-1)). Close accounts the user no
    longer uses if they serve no purpose, as this will eliminate the risk that the
    account can later be compromised. For the remaining accounts the user needs to
    consider two related but separate concepts, namely, security and privacy.


    TABLE 4.1  Documenting the User’s Social Media Accounts


    ![](image/tab4-1.jpg)


    Read the Fine Print


    Users often sign on to the newest and brightest thing and social media accounts
    are no different. We frequently do not bother to read user agreements prior to
    signing up. We typically just hit the accept button and never read the contents.
    The same thing holds for social media privacy policies. Most people click through
    and don’t actually read them. Users should take a moment to read the agreement
    before assenting to be bound by its conditions. One might be surprised by what
    they agree to. Also, users should read the privacy policy and what the social
    media site says about how they are going to use one’s data. Many times, it’s sold
    to other companies, or covered under the agreements as sharing your data.


    Another security concern is how companies will handle account breaches. The user
    should understand what the social media site will do if their data is stolen from
    the site. The very companies that the user wants to do business with could be
    a real threat to their personal information. These agreements are important, but
    users should be aware that social media sites don’t always aggressively look for
    violations. For instance, consider Facebook and Instagram, both of which are owned
    by Mega. Both prohibit sex offenders from using on their site. This does not mean
    that sex offenders aren’t on their site. They frequently sign up with bogus names
    or even their real name and get on the sites. Neither Facebook nor Instagram are
    scouring sex offender registrations or doing criminal background checks to deactivate
    sex offender accounts. They rely on individual users to report these profiles
    to them. They are better with removing pornography and other prohibited content
    but make no mistake these things can still be found on their sites. This is just
    something to think about when allowing children on sites. There is still an element
    of risk that they might be exposed to something inappropriate even if prohibited
    by a social media agreement or policy.


    The user has to make a decision after reading the social media site policy and
    agreement. Can the user adjust anything on their end, such as how they actually
    use their social media account, to make it still acceptable to maintain? If the
    user can’t make personal adjustments, then they should deactivate the social media
    account. One should be able to deactivate it as they read the policy/agreement.
    Users should be aware that these agreements can be modified, and they should continue
    to evaluate if they are the right fit. Users are not bound to any social media
    for life.


    Increasingly there are other agreements beyond those provided by social media
    that users all need to be aware of. Almost all employers have standalone policies
    or some provisions that deal with how their employees use social media. Employers
    are not alone. Schools from elementary through colleges also have such provisions.
    Even fraternal organizations and clubs will often have social media policies.
    Collectively these policies govern such things as who can create a social media
    presence for the organization, and what things can and cannot be posted by employees/students/members
    on social media. Even if there isn’t a specific social media policy, organizations
    frequently take the view that something posted online that reflects unfavorably
    on an organization or its members can and will result in some kind of adverse
    action. The news is full of stories of employees or students whose online post
    or association with some social media group resulted in them getting disciplined
    or terminated by their organization as their conduct violated an explicit social
    media policy or implicit behavior policy.


    SECURITY


    Security is of paramount importance. If the user’s social media account is not
    secured then an attacker can gain complete access, regardless of what privacy
    settings one may have selected. Every social media service has a different method
    of securing their users’ access to the service. Many users simply make an account
    and login without thinking about what the service’s security function includes.
    Most never look at the changeable features to identify the possible safer functions
    that could enhance security. The following are some of the types of security that
    should be available to the user to protect their accounts.


    Contact Email/Cell Phone


    A contact email is one required by most social media sites as a method to contact
    the accounts. In some cases, a social media account may request an additional
    email address as a backup in case the user’s access to the original is lost. Make
    sure to provide a backup email address if permitted. Cell phone numbers are also
    asked for two-factor authentication purposes.


