    `ZDNET`, 2017 年 12 月 12 日. [`www.zdnet.com/article/security-researcher-says-directv-hardware-can-be-easily-hacked/`](https://www.zdnet.com/article/security-researcher-says-directv-hardware-can-be-easily-hacked/)


