    ## 安全上网


    ### 本章内容


    上网会使用户暴露于风险之中。本章识别了这些风险并涵盖了消除它们的步骤。它特别涵盖了 `browsers`、`cookies`、`antivirus`、`antispyware`
    和 `firewall` 软件，通过虚拟专用网络 (`VPN`) 和 `Wi-Fi` 连接。它还讨论了隐私与安全之间的区别。


    ## 互联网风险


    第 2 章 涵盖了保护家庭网络的步骤，以确保没有人访问用户的设备。上网会让用户暴露在必须解决的其他风险中。本章探索了为了确保用户在线安全必须处理的其他领域。请记住，互联网不仅仅是万维网，它包含了每一个使用互联网的协议。这包括
    `email`、音乐共享工具、文件共享以及许多其他在访问互联网时经常被视为理所当然的基本功能。所有这些常用的互联网工具都可能让攻击者访问用户的计算机。


    ### 为联网使用保护计算机安全的考虑因素


    技术总是在变化，针对它的攻击也是如此。在线研究可能会因关于安全含义的冲突建议让普通人无所措。网络安全行业必须评估针对系统的威胁，以帮助确定应采取哪些安全措施。普通家庭计算机或小型企业的风险与大型公司不同。以下部分评估了连接互联网的计算机所带来的小型办公/家庭办公室
    (`SOHO`) 风险。


    ### 评估风险


    风险评估是评估和分析潜在漏洞与威胁的过程。它帮助用户确定威胁发生的概率，并识别如果这些威胁变为现实可能产生的后果。这一过程有助于识别需要改进的领域，以及可以添加以保护家庭网络的额外安全措施。表
    3.1


    #### 表 3.1 风险评估


    |   || 步骤 || 评估内容 |

    | --- | --- | --- |

    | 1. || 资产识别 || 第一步是识别个人家庭网络中的所有资产，如 计算机、`routers`、连接的设备和个人数据。 |

    | 2. || 威胁评估 || 识别可能损害网络的潜在威胁，例如 `malware`、`phishing`、物理盗窃或人为失误。 |

    | 3. || 漏洞评估 || 识别网络中任何使之更容易受到攻击的漏洞或弱点，例如过时的软件、弱密码或未安全的 `Wi-Fi` 网络。 |

    | 4. || 风险分析 || 评估每个威胁发生的概率和影响。 |

    | 5. || 优先级排序 || 根据发生概率对风险排序。这将帮助用户优先关注最关键的风险。 |

    | 6. || 风险缓解 || 开发一个计划来减轻或减少已识别的风险。这可能包括实施安全措施，如 `antivirus` 软件、`firewalls` 和使用强密码。
    |

    | 7. || 实施与监控 || 实施风险缓解计划并定期监控网络是否有任何新漏洞或威胁。记住，威胁和漏洞在不断涌现。 |


    通过这些步骤，`SOHO` 计算机用户可以识别并希望解决风险。从长远来看，这使得网络更安全，更不容易受到攻击。这个过程很重要，但永不会完结。定期审查和更新风险评估有助于确保用户持续的安全。


    ## 基础 SOHO 安全考虑因素


    到为止，本章查看了风险，并尝试评估应对网络威胁所需的类型。用户实际上可以采取哪些措施来影响网络安全？以下列表探索了一些基础知识：


    安装 SOHO 防火墙

    本地 `firewall` 是识别和防止外部网络攻击极佳地点。许多公司制造各种有助于保护家庭网络的设备。在用户网络和互联网之间放置防火墙是 `SOHO` 安全的基本要求。


    配置/更新操作系统

    用户对操作系统是否有深入了解，还是仅对其功能熟悉？`Windows` 用户的配置考虑与 `Apple` 用户不同。`Linux` 用户的考虑与两者也非常不同。用户需要审查安全需求并实施最佳实践。


    杀病毒/间谍软件检测软件

    现代系统面临许多外部（甚至是内部）来源的攻击。保护用户计算机系统的下一步是确保计算机安装了 `antivirus` 和 `spyware` 检测工具。这再次是一个需要研究的复杂领域，但它是安全的必然。


    使用虚拟专用网络 (VPN)

    `VPN` 在安全方面可以发挥重要作用。如果用户的风险评估确定其浏览流量可能被破解，那么安装和使用 `VPN` 可能是合适的。


    阻止浏览器 Cookie/活动内容


