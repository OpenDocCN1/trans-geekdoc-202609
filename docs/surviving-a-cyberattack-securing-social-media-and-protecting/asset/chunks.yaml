  trans: '


    本章讨论了连接互联网的风险，并对这些风险的排序提供了建议，特别是针对物联网（IoT）设备的风险。本章还涵盖了缓解这些风险的关键——使用配置恰当的路由器。此外，文中还包含了路由器配置清单以及连接到互联网的设备记录清单。


    ## 连接互联网


    易用性是衡量设备价值的标准。用户期望操作简单，并希望第一次使用时就能运行，无需反复调试。从历史角度看，计算机的进步一直在追求简单。一个例子是图形用户界面（`GUI`），它允许用户无需输入命令即可操作计算机。即插即用允许新设备在连接到计算机时立即开始工作。简单性已内置在如今的技术中，但简单性伴随着隐藏的代价，即安全性。


    如今，访问互联网需要两样：一个设备（笔记本电脑、台式电脑、平板电脑、手机等）和一个互联网服务提供商（`ISP`）。这非常简单。这种方式的互联网访问就像是在没有刹车和安全带的高速路上。本章将讨论设备如何连接到互联网、相关的风险以及如何确定安全优先级。


    ## 早期计算机连接


    最初，计算机及其所有相关设备是通过电缆或线路连接的。这些设备包括鼠标、键盘、打印机、扫描仪，以及曾经的调制解调器。调制解调器通过电话线连接到互联网，并通过另一根电缆连接到计算机。如果家庭用户没有调制解调器，他们的计算机就无法连接互联网。


    在商业环境中，情况要复杂一些。计算机通常连接到其他计算机，其中一些被称为 `routers`，并充当通信交通警察的角色。技术较高的家庭用户会有一个 `router`，特别是当他们家庭网络中有多台计算机时。稍后将详细讨论
    `routers`，它们的功能允许几台计算机“共享”另一个设备，例如打印机或调制解调器。早期的互联网连接即使在商业和家庭网络环境中也需要调制解调器来连接互联网。


    20 世纪 90 年代后期，调制解调功能从外部设备移动到了计算机内部组件。用户将电话线直接插入计算机的“端口”来接入互联网。`ISP` 开始扩展除“拨号上网”之外的服务类型，例如数字订阅线路（`DSL`）和电缆。这些额外的服务类型不需要外部调制解调器，只需通过“转换器”插入计算机，然后插入计算机端口即可。剩余的拨号
    `ISPs` 通过电话线直接插入计算机端口进行访问。外部设备（如打印机、扫描仪和 `routers`）仍需要直接连接到计算机的电缆才能工作。


    21 世纪初，无线技术出现（参见图 2.1](#）。计算机不再有电线直接连接到打印机等设备。计算机可以通过无线电波或 `Wi-Fi router` 连接到调制解调器。无线
    `router` 仍然通过拨号、`DSL` 或电缆 `ISP` 通过线路连接到用户的互联网连接。即使这也发生了变化。从手机开始，计算机可以通过无线 `ISP`
    上网。电线已成为过去。


    ![](img/fig2-1.jpg)


    图 2.1 无线访问。


    在向无线连接过渡期间，`ISPs` 开发出了一种结合了调制解调器和 `router` 功能的设备。这种组合调制解调器 `router` 允许家中许多计算机通过一个连接到互联网。这使得家庭用户能够从任何允许与其组合调制解调器/路由器通信的设备立即访问互联网。这些新设备的设计是为了方便普通家庭用户无忧地连接，然而，内置的安全措施却很松散。此外，家庭用户修改设备设置以增强安全性的权限有限。某些设备的
    `access code` 固定在设备底部。家中的任何访客（如维修人员、保姆等）只需将设备翻过来用手机拍张照片，就能获得接入无线网络所需的 `access
    code`。此外，`ISP` 供应商并不总是能跟上安全更新和补丁。AT&T Linksys 曾被发现这样一个漏洞，导致其变得容易受到攻击。（参见图 2.2。）


    ![](img/fig2-2.jpg)


    图 2.2 路由器工作原理概念。


    ## 路由器是守护者


    如前所述，由于 `routers` 可以与其他设备共享网络资源（通信），它们就像通信交通警察。它们的功能远不止于此。在计算机和黑客之间提供了额外的防御层。


    设备要连接到互联网，需要一个唯一的互联网协议（`IP`）地址，由 `ISP` 提供。该 `IP address` 在发送电子邮件、浏览等活动期间会提供给其他计算机。如果不使用
    `router`，该 `IP address` 就会变成攻击者的直接连接。从意义上说，这就像向某人提供未公开的电话号码，让他们可以骚扰对方。


    `Routers` 是第一道防线。攻击者在攻击计算机之前必须绕过 `router`。`Routers` 使用 `ISP` 提供的相同 `IP address`
    连接互联网。它通过提供互联网不可见的本地 `IP addresses` 来“过滤”指向其受保护设备的通信。通信进入 `router`，由 `router`
    决定应由哪台设备接收，然后根据其分配的本地 `IP address` 进行转发。一个配置适当的 `router` 不会广播这些本地 `IP addresses`
    或它服务的设备数量。


    将其类比为老式的酒店接线员。拨入电话的人永远不知道客人住在哪个房间。“通话”到达 `router`（接线员），由接线员根据此类通信规则将其转发给目标接收者（房间）；例如，晚上
    9 点后不再转发通话。如果通信被认为是威胁或不允许，`router` 就不会将其转发给设备。


    `Routers` 经常带有防火墙，可以限制入站和出站通信。其他路由器则拥有防火墙控制网络内设备之间的通信。这样一来，受攻击的设备（如打印机）就无法用于控制另一台设备（如计算机）。


    `Routers` 还可以为某些设备提供家长控制或限制。这些控制包括在特定时间无法访问互联网，或禁止访问特定网站或包含违反标准文本的网页（显性语言或过多脏话）。


    某些 `routers` 支持虚拟专用网络（`VPN`），允许用户远程连接到特定网络，例如家庭用户远程连接到其业务网络。`Routers` 还监控网络使用情况，并在出现可疑情况时发送电子邮件或短信警报。


