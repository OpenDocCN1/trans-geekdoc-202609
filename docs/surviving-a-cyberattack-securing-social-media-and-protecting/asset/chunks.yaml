  trans: '


    简单的 Google 搜索就可以找到许多供父母使用的网络安全实践资源。一些很棒的网站包括 [safekids.com](http://safekids.com)，它现在隶属于
    [ConnectSaftey.org](http://ConnectSaftey.org)，以及 [commonsensemedia.org](http://commonsensemedia.org)。除了丰富的资源外，这些网站还提供了可以打印并签名的承诺书（pledges）。[Safekids.com](http://Safekids.com)
    为十以下儿童、青春期儿童/青少年、手机使用以及父母提供了单独的承诺书。总而言之，这些承诺书是关于的能够让所有人都能理解的、关于什么是允许的、什么是不允许的宽泛陈述。它们还共同包含了明确将进行使用时间段和电脑管理的陈述。对于非常年幼的孩子，用户（父母）可能需要关注某些元素，例如使用时间段，并让他们意识到自己将受到监控。随着孩子的成长并获得更多的数字自由，当孩子涉足网络世界时，人们也希望继续与他们沟通父母的期望。重要的是，这些陈述是父母在管理孩子网络风险时在此基础上建立的基础。


    # 识别需求与技术


    管理个人网络风险的第一步是识别他们为了教育和发展目的需要哪些电脑。这个过程将取决于孩子所处的年龄段。一些平板电脑可能适合较小的孩子（三到五岁），但手机是不妥的。用户还必须理解，允许的设备越多，意味着需要管理的设备也越多。在允许儿童拥有电子邮件帐户以及在游戏系统或社交网络上拥有个人资料时，也应该考虑同样的流程。考虑使用表
    5.1，这是一份通用的数字访问年龄指南。这只是一个建议。孩子的成长速度非常不同。父母应将其视为指南，在此基础上管理孩子的网络风险。


    ## 表 5.1 设备年龄指南


    | 年龄段 | 设备类别 | 设备适用性 |

    | :--- | :--- | :--- |

    | 3-8 岁 | 教育平板电脑 | 如 `Leap` 或 `Vtech` 等平板电脑 |

    | 6-12 岁 | 教育软件 | 帮助孩子进行媒体使用 |

    | 8-16 岁 | 游戏机 | 如 `Nintendo Switch` 或 `PlayStation` 等游戏机 |

    | 10-16 岁 | 虚拟现实头戴设备 | 提供沉浸式体验 |

    | 8-16 岁 | 笔记本电脑 | 帮助孩子进行数学、科学和语言艺术学习 |

    | | 智能手机 | 孩子使用 |

    | | 电子阅读器 | 孩子使用 |


    ## 表 5.2 父母参考


    | 父母参考 | 网址 |

    | :--- | :--- |

    | Common Sense Media | 该网站对电影、电视节目、书籍、游戏提供提供评分 | https://www.commonsensemedia.org
    |

    | Family Online Safety | 该机构为父母保护孩子在线提供资源和技巧 | https://www.fosi.org/ |

    | Screenagers | 这部电影和网站指导父母应对数字世界 | https://www.screenagers.com/ |

    | National PTA | 与 Norton 推出了 Smart Talk，这是一个免费工具，帮助家庭设置安全规则 | https://thesmarttalk.org/
    |

    | 美国儿科学学会 | 该组织提供了关于屏幕时间和媒体使用的指南 | https://www.healthychildren.org/English/family-life/Media/Pages/Default.aspx
    |


    # 管理网络风险的四个基本流程


    管理网络风险的四个基本流程是：控制设备、限制、监控和定期检查。


    ## 控制设备


    如果不需要，从一开始就不要购买。这很简单，但家庭通常有多个处于特定年龄段的孩子。用户必须考虑，一个孩子可能会允许另一个使用未经许可的设备。用户必须考虑如何防止这种情况的发生。


    ## 限制


    限制有两种：口头/书面协议和技术执行。之前讨论的承诺书可能会规定使用时间段或设备禁止。决定起草书面协议还是进行口头协议限制取决于用户及其对正式程度的需求。


    技术限制包括：在家庭电脑上设置家长控制的特定帐户、在其他设备上实施家长控制、使用密码、限制安装新的软件/硬件以及路由器配置。


    ## 监控


    监控可以简单地要求孩子在家庭公共区域使用设备以便积极监督。也可以是技术性的，具体来说使用监控软件/硬件记录他们的行为以供以后查看。在本章后面的部分将讨论有关技术监控的问题。


    ## 定期检查


