- raw: 'The first step is to have a strong password. The password must not be easily
    guessed by someone who knows the user or by information users openly provides.
    For instance, if one is a diehard sports fan, who wears their favorite team’s
    jersey all over the place and posts online team comments/updates, it would not
    be a good idea to use a password that is not associated in some way with their
    favorite team. One should also have a separate password for each social media
    account. Also consider periodically changing the passwords. Consider using a password
    manager to assist in creating and storing passwords. If there is ever a breach,
    immediately change the password, don’t wait for a notice from the social media
    company to do it. Also change the password for the associated email accounts for
    that social media account. Finally, don’t keep passwords near your devices.


    Tips for Creating a Strong Password


    A brute force attack occurs when a computer program is used to try passwords until
    it finds one that works. Such programs can be particularly effective if information
    is known about the user who created the password to be cracked. This information
    provides a dictionary of possible passwords to try first in the attack. Accounts
    as well as devices frequently are set to lock the account/device after so many
    failed attempts that minimize a brute force attack’s success. To further guard
    against such attacks consider the following tips:


    1.The longer your password the better. It should be between eight and fourteen
    characters in length. Use a mix of characters (numbers, uppercase and lowercase
    letters, and special characters, e.g., \*, #, etc.).


    2.Consider creating a passphrase instead of a password. A passphrase is a group
    of words, which can be easily remembered, for instance, the strong will survive.
    One can also use the phrase as a starting point and mix it up a bit by substituting
    numbers or special characters for letters and mixing in upper case letters. The
    above passphrase might become. The “Stron\* will surv!ve”, by using uppercase
    letters for the first two words and substituting the ! special character for the
    letter. Quotes can also be used as passphrases, provided they substitute characters
    for letters and include upper case letters.


    3.Consider using a password or passphrase generator, which can be located online.
    Once the user has a password or passphrase, they can further modify it for use
    on each social media account. For instance, if your passphrase is The Stron\*
    will survive apply “add FB” at end for the Facebook account, TW for Twitter, and
    so on for each social media account.


    Password Managers


    Password managers come in several flavors. The user can download one that is only
    on their local machine or use the ones that are resident in their browser. There
    are also ones that can be used across devices. There are generally commercial
    password managers that require an annual fee. The following list explores the
    pros and cons of each type.


    1.Downloaded password managers.


    Downloaded password managers can be the safest because they are only on the user’s
    computer. If a user has one that requires a password to access it, don’t keep
    it open all the time in order to keep your passwords safe.


    2.Browser password managers.


    Most modern browsers can store passwords in the browser for ease of use. This
    is popular and commonly used as a storage location. From a security point of view,
    these can be dangerous. If the browser is insecure the password can be compromised.
    Again, this is balancing security with ease of use.


    3.Cross platform password managers.


    Many of the password managers offer the ability to use their systems to store
    passwords. The advantage is that a user can then access the passwords from their
    cell phone, a computer at work, or a tablet. This has obvious advantages and makes
    use of passwords across the user’s many devices easier. From a security point
    of view, there are now multiple places that can expose the user’s password. Selecting
    this as an option needs to be carefully considered by the user.


    A definite security function should be to never allow automatic logins. Ensure
    cell phones, computers, or other devices are password protected so if someone
    finds them on, they can’t login into the user’s accounts through their browser.


    Security Questions


    Security questions are a commonly used feature on many Web sites for verification
    of a user when accessing a Web site. This feature requires the user to answer
    several questions. Unique answers are then required to verify the user’s access.
    One or multiple questions can be asked to gain entry to a Web site. Be cognizant
    of the answers provided. For instance, if it asks for the users to name their
    first teacher, boss, and so on, consider a consistent method, such as always providing
    only the first name or full name for such questions. Otherwise, the user might
    not be allowed in if they provided the full name at initial setup, but later responded
    by just giving a first or last name when asked. The same thing applies for questions
    asking for the location of your first kiss, job, home, and so on. Did the user
    initially provide just the city, or did they provide the city and state? If they
    provided the state did they abbreviate it or spell it out? Implementing a standard
    practice will keep users from getting stumped by questions they obviously know
    the answers to.


    Two-Factor Authentication


    Once the user has their passwords selected, they need to set up two-factor authentication
    for each account. Two-factor authentication relies on a user to provide a password
    and one additional security feature to prove who they are when accessing a social
    media account. Most often this second feature involves a cell phone number. Once
    the individual provides a password a text message or call is initiated, providing
    a separate code to the identified number. This code then must be provided to the
    account to gain access. Be aware that if the user didn’t password protect their
    cell phone and it is stolen, the thieves can defeat two-factor authentication
    protection as they will receive that text message or call providing the code.
    Scammers may perform SIM card swaps to deactivate your phone and gain control
    of your two-factor verfication codes. To prevent this, setup a PIN or password
    on your celluar accounts to protect against unauthorized changes.


    Other security features, such as biometrics, can also be used. This would include
    fingerprints or facial scans. A scan must then be provided to gain access to the
    account. Beware that criminals have found that they can trick a user into proving
    a facial scan to them which can then later be used to defeat this security feature
    to access the user’s account. There are also hardware-based security keys, such
    as USB drives for two-factor authentication. Using two security features provides
    a user with a higher level of assurance than authenticating account access with
    just a password.


    Privacy


    The next thing the user needs to do is to review the privacy settings with each
    account. Doing this will help to ensure that they have done the most to protect
    themselves online. Following are several things users can do when they are logged
    into each account to tighten up the privacy settings and prevent any wrongdoing
    with their accounts.


    1.Tighten up privacy settings.


    a.Each social media service has different privacy settings. As a new user, and
    as a regular user, these settings need to be checked on a regular basis because
    social media companies change these settings and often don’t tell users. One’s
    privacy could not be as secure as possible if left unchecked.


    2.Turn off geotagging or location identification.'
