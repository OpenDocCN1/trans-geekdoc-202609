- raw: "| Cyberharassment || Cyberharassment is the act of harassing, intimidating,\
    \ or threatening someone using electronic communication tools such as social media,\
    \ text messages, or online forums. It can take many forms, including spreading\
    \ rumors, sharing embarrassing or private information, or sending hurtful or threatening\
    \ messages. Some users (trolls) will repeatedly post negative messages on other’s\
    \ posts. Cyberbullying is a subset of cyberharassment. Cyber-stalking is also\
    \ another type, which can involve real-world stalking. |\n\n| Sextortion || A\
    \ crime often targeting minors can also have vulnerable adults as victims. The\
    \ victim is tricked by another to send sexually explicit images Shortly after\
    \ receiving the images the victim will be told they will send them to friends,\
    \ the names of whom have been obtained from social media profiles, unless they\
    \ send money, gift cards, and so on. |\n\n| Malware and viruses || Malware and\
    \ viruses are types of malicious software designed to exploit or damage a computer\
    \ system or network. They can be unwittingly downloaded by users through infected\
    \ emails, links, or downloads and can cause significant harm, such as stealing\
    \ personal information, encrypting data, or causing system crashes. |\n\nTABLE\
    \ 6.2  Resources on On-line Threats\n\n| Organization || Web site |\n\n| --- |\
    \ --- |\n\n| American Association of Retired Persons (AARP) || [https://www.aarp.org/home-family/personal-technology/](https://www.aarp.org/home-family/personal-technology/)\
