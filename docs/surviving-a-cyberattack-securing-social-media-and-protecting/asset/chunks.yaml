- raw: 'A simple Google search can locate numerous resources covering cybersafe practices
    for parents to use. Some good sites are [safekids.com](http://safekids.com), which
    is now affiliated with [ConnectSaftey.org](http://ConnectSaftey.org), and [commonsensemedia.org](http://commonsensemedia.org).
    Besides great resources, these sites provide pledges that can be printed and signed.
    [Safekids.com](http://Safekids.com) provides separate pledges for under ten, preteens/teens,
    cell phone use, and for parents. Collectively, these pledges are broad statements
    that all can understand about what is and is not allowed. They also collectively
    include statements that make it clear that timeframes for use and computer management
    will occur. For very young children, the user likely will have to focus on certain
    elements, such as time frames of use, and notice they will be monitored. As the
    user’s child develops and obtains more digital freedom, one will also want to
    continue communicating with them about parental expectations as the child ventures
    into the cyberworld. The important thing is that the statements are a starting
    point for parents to build upon in managing their child’s cyber risk.


    IDENTIFYING NEEDS AND TECHNOLOGY


    The first step in managing one’s cyber risk is identifying what computers they
    need for education and development purposes. This process is going to be informed
    by what age group their child falls into. Some tablets may be appropriate for
    younger children, three to five years old, but a cell phone is inappropriate.
    The user also must understand that the more allowed devices translate into more
    devices that need to be managed. The same process should be considered for allowing
    children to have an email account and a profile on a gaming system or on a social
    network. Consider using [Table 5.1](#chapter05.xhtml#tab5-1) which is a general
    age guide for digital access. It is only a suggestion. Children develop at very
    different rates. Parents should view this as a guide to what could be appropriate
    given the technology and their children’s ages. It should not be considered a
    hard and fast rule.


    [Table 5.2](#chapter05.xhtml#tab5-2) is a list of Web references for parents to
    gain additional understanding of technology and how to govern its use with their
    children. Once the user comes up with an approved device list, they can start
    planning how to manage the risk associated with each device.


    TABLE 5.1  Parental Digital Device Age Guide


    | Age group || Device category || Appropriateness of device |


    | --- | --- | --- |


    | 3–8 years || Educational tablets || Tablets such as LeapFrog or Vtech, offer
    age-appropriate educational games and activities for young children. |


    | 6–12 years || Educational software || Computer software designed for children
    can provide fun and interactive learning experiences in various subjects, such
    as math, science, and language arts. |


    | Gaming consoles || Video game consoles such as the Nintendo Switch or PlayStation
    can provide entertainment and help children develop hand–eye coordination and
    problem-solving skills. |


    | Smartwatches || These devices offer basic features such as alarms, timers, and
    step counters while allowing for limited communication with parents. |


    | 8–16 years || Virtual reality headsets || These devices offer immersive experiences
    and can be used for educational purposes such as virtual field trips or interactive
    learning games. |


    | Digital cameras || Children can use digital cameras to explore their creativity
    and learn about photography. |


    | Child-friendly laptops || These laptops are designed for children, with pre-installed
    parental controls and educational software. |


    | 10–16 years || Smartphones || Smartphones can be helpful for older children
    to stay connected with family and friends and for educational purposes such as
    online resources. |


    | E-readers || These devices offer access to a wide range of digital books and
    can be a great way to encourage reading in older children. |


    | Podcasts || Listening to podcasts can be a fun and educational activity for
    children, with many podcasts geared toward kids on various topics such as science,
    history, and storytelling. |


    TABLE 5.2  Parent Web References


    | Parent reference || Web address |


    | --- | --- |


    | Common Sense Media: This Web site offers reviews and ratings of age-appropriate
    movies, TV shows, books, games, and apps for children. || [https://www.commonsensemedia.org/](https://www.commonsensemedia.org/)
    |


    | Family Online Safety Institute: This organization provides resources and tips
    for parents on how to keep their children safe online. || [https://www.fosi.org/](https://www.fosi.org/)
    |


    | Screenagers: This documentary film and Web site guides parents on navigating
    the digital world with their children. || [https://www.screenagersmovie.com/](https://www.screenagersmovie.com/)
    |


    | National PTA and Norton have put together The Smart Talk, a free tool that helps
    families set digital safety ground rules together. || [https://thesmarttalk.org/#/](https://thesmarttalk.org/#/)
    |


    | American Academy of Pediatrics: This organization provides guidelines on screen
    time and media use for children of different ages. || [https://www.healthychildren.org/English/family-life/Media/Pages/Default.aspx](https://www.healthychildren.org/English/family-life/Media/Pages/Default.aspx)
    |


    FOUR BASIC PROCESSES FOR MANAGING CYBER RISK


    There are four basic processes for managing a user’s child’s cyber risk: Control
    Devices, Restrictions, Monitoring, and Periodic Checking.


    Controlling Devices


    If the device is not needed, don’t purchase it in the first place. That is straightforward,
    but families frequently have more than one child in a particular age group. The
    user must consider that one child may decide to allow a younger sibling to access
    the device they are not permitted to use. The user must consider how they are
    going to prevent that from occurring. Don’t allow devices into the home unless
    one is prepared to address all the risks that they may represent to the user’s
    entire family.


    Restrictions


    Restrictions include two kinds: verbal/written agreements and technological enforcement.
    Earlier discussed pledges may lay out use time frames or device prohibitions.
    Whether one decides to draw up written agreements or have verbal agreements on
    restrictions is up to the user and their family’s needs for formality.


    Technological restrictions include such things as setting up specific user accounts
    on family computers with parental controls, imposing parental controls on other
    devices, using passwords, restricting new software/hardware to be installed, and
    router configurations.


    Adding Restrictions on Windows 11


    Parents can go to Microsoft’s Web site at [https://www.microsoft.com/en-us/microsoft-365/family-safety](https://www.microsoft.com/en-us/microsoft-365/family-safety)
    to learn about how to add restrictions to Windows 11.


    Parents can go on the computer to:


    Settings > Accounts > Family & Other Users > Family and click on Add Someone


    Consistent with Microsoft’s requirements the user and their child will both need
    Microsoft accounts (not local accounts on the computer).


    Monitoring


    Monitoring can be as simple as requiring the child to use the device in a public
    area of the home where they can be actively supervised. It can also be technological
    in nature, specifically using monitoring software/hardware to record what they
    do for later review. Later in this chapter, issues regarding technological monitoring
    are discussed.


    Periodic Checking'
