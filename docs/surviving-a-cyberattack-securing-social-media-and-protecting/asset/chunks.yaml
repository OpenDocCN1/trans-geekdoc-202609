- raw: 'Caveat emptor (let the buyer/seller beware) is just as true in online markets
    as it is in traditional markets. Don’t rely on just appearances of digital images
    of products, buyer/seller profiles and reviews. If the sale price or product presented
    is too good to be true it likely is. Complete some due diligence Internet research
    on the buyer or seller as well as the product being offered for sale. Use not
    only their names and profiles but email addresses and telephone numbers, and mail
    addresses they provide in conducting that research. There could already be reports
    online about problems with them. A relatively new profile may be a concern. Numerous
    reviews with similar or the same comments may be an indication that they are fake.
    Avoid sellers without contact information or who refuse to provide legitimate
    contact information. Additionally, take the following steps:


    [Table 7.1](#chapter07.xhtml#tab7-1) Online Transactions Security Checklist has
    been provided to give you an easy to use checklist to assist with your security
    in online transactions.


    1.Get the seller/buyer to provide a phone number and verify it.


    a.Be cautious of numbers that are connected for services like Google Voice. There
    are reports where scammers will try to verify a user’s identity by sending a text
    message with a Google Voice verification code and ask the user for that code.
    If the user gives them the verification code, they’ll try to use it to create
    a Google Voice number linked to the user’s phone number which they will use for
    fraudulent transactions.


    b.Does the voice connected to the number match who they claim to be from? For
    instance, if the person claims they are from one location, but they speak in a
    manner inconsistent with their whereabouts, such as with a foreign accent or broken
    English, that is a red flag.


    c.Do they only speak to the user at a time of their choosing? This may be an indication
    they are using a cohort that sounds more legitimate to communicate with the user.
    Someone without an accent may sound more convincing. They may also be more sophisticated
    in getting the sales closed. The same applies to video calls. They may be using
    a cohort that presents a better presence to look more convincing.


    d.Be aware of telephone calls where the clarity is bad. This may be an indication
    that the call is being made from a foreign location via the Internet. It also
    makes it difficult to ascertain the voice and legitimacy of the caller.


    2.Forms of Payment: Beware of buyers who insist on wire transfers as the only
    form of payment they’ll accept. A common scheme is to overpay and then retrieve
    the entire payment after the user returns the overpayment. Similarly, do not cash
    checks that are an overpayment. Don’t cash the check but instead ask for a check
    in the exact purchase price. Again, it is a common scheme to provide a bad check
    as an overpayment and get the seller to return the overage. If given a cashier’s
    check, money order or other equivalent, call the bank at a number the user finds
    online, not a number provided by the buyer, to verify the check’s validity.


    3.Escrow Services: For big-ticket items, use a legitimate online escrow service
    that will hold the payment until the buyer receives what they’ve ordered.


    4.Never Provide a Social Security or Driver’s License Number: Legitimate sellers
    don’t ask for that information, but an identity thief would.


    5.Use a Credit Card to Make Online Purchases: This provides added protection through
    the credit card company if the goods are not provided or are defective. Additionally,
    many credit cards will alert the user when an attempt to purchase from a vendor
    that has a history of fraudulent transactions and stop the transaction from going
    through.


    6.In-Person Transactions: At times the seller and buyer will complete the transaction
    in person. This substantially increases the possible risk of not only financial
    but physical harm. Arrange the meeting place in a public place, specifically a
    police station or property. Criminals want nothing to do with the police and will
    avoid meeting at such a location. Besides a police presence they also usually
    have cameras monitoring the area, a further deterrence to those criminally inclined.
    Inside the police station is best if possible. Many police stations have established
    Internet Sales Safe Zone, or Safe Trade Zones (See [Table 7.2](#chapter07.xhtml#tab7-2)
    In Person exchange of goods) specifically to make buyers and sellers safe during
    these transactions. Safe Trade Stations ([https://www.safetradestations.com/safetrade-station-list.html](https://www.safetradestations.com/safetrade-station-list.html))
    has a listing of police agencies providing this service. If the meeting location
    does not have a participating police agency, contact the local police, and discuss
    the need for a safe place to facilitate the transaction. They will advise accordingly
    of hours of operation and further specifics.


    Online Research of Telephone Numbers


    Looking up a telephone number can reveal information on the owner. A simple Google
    search can reveal quite a bit, particularly if it has been reported as a contact
    in fraudulent schemes. There are also numerous sites online that let a user add
    the number and research databases to provide information on the number and its
    owner. Some sites charge a nominal fee for the search information. Here are a
    few such sites:


    ■[https://www.intelius.com/reverse-phone-lookup/](https://www.intelius.com/reverse-phone-lookup/)


    ■[https://socialcatfish.com/reverse-phone-lookup/](https://socialcatfish.com/reverse-phone-lookup/)


    ■[https://www.peoplelooker.com/](https://www.peoplelooker.com/)


    Be aware that the information provided may not always be accurate and they might
    provide information on the wrong person.


    Investigate the Merchant Before Buying


    Users want to believe that what is seen in an ad on Facebook or somewhere else
    on the Internet is a legitimate vendor looking for business. This is simply not
    the case. Online criminals work hard to fool users into thinking they are real.
    Reviewing the merchant’s Web site, looking for reviews and sampling Googling may
    prevent the user from making a regretful online transaction. Start by going directly
    to their Web site. Look through the Web site especially at their “About” page
    and the links that may appear at the bottom of the page. These can be linked to
    other Web sites and can reveal information of interest about the site’s ownership.
    Look up the merchant’s name on the Better Business Bureau’s Web site. Are they
    even listed; are there complaints? Research other buyer’s reviews on social media,
    blogs and scam reporting sites like Scam Advisor ([https://www.scamadviser.com/](https://www.scamadviser.com/))
    to identify complaints about the merchant.


    IDENTIFYING FRAUDULENT WEB SITES


    A simple way to identify if a Web site is a scam site is to copy and paste the
    site address (URL) into one of several Web sites, all of which have their own
    database of problem Web sites. Consider checking with more than one of the following
    Web sites:


    ■[https://www.scamadviser.com/](https://www.scamadviser.com/)


    ■[https://www.urlvoid.com/](https://www.urlvoid.com/)


    ■[https://www.lookout.com/life/free-online-shopping-checker](https://www.lookout.com/life/free-online-shopping-checker)


    ■[https://www.scamdoc.com/](https://www.scamdoc.com/)


    Vendors Using Social Media Accounts


    Some vendors are only selling through social media accounts. These require research
    as well. How recently was the account created? Can the person who created the
    account be identified? Does the social media account provide contact information,
    such as telephone numbers, emails, and/or a mailing address? This information
    all needs to be confirmed. Check for buyer/seller reviews on the social media
    site. If anything looks questionable avoid transactions with this vendor.


    DANGERS USING PERSONAL DEBIT/CREDIT CARDS'
