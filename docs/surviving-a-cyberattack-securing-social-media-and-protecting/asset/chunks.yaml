- raw: 'Only download third-party applications from your operating system’s actual
    store. Androids use the Google store and iPhone users use the Apple store. This
    helps to ensure the application has been reviewed and won’t be malware. Research
    the apps before downloading them. A simple Google search may tell the user more
    about the app than the advertisement on the app store.


    3.Be suspicious.


    People on the Internet send weird stuff to phone users such as weird text messages
    from someone one doesn’t know, weird emails, and weird phone calls. Always be
    suspicious and don’t just believe people or messages one receives. If the user
    doesn’t know who they are from, delete them.


    4.Use two-factor authentication.


    Two-factor authentication should be turned on for every app one uses. If the app
    does not verify your connection to the app, be wary and consider not using the
    app.


    5.Get a good password manager.


    Password managers on cell phones help to prevent our using the same password repeatedly.
    Several good ones exist. Do a little research and the user will find one that
    suits their needs.


    6.Close old accounts.


    Don’t keep old accounts open. It is a huge security risk.


    7.Use a VPN on public Wi-Fi.


    Use a VPN on your phone, especially when you are away from your home Wi-Fi network.


    8.Be mindful of app permissions.


    Apps ask for way too many permissions. Pay attention to what one allows. If the
    app asks for too much access, consider uninstalling the app.


    DATING AND/OR HOOK-UP SITES


    Dating sites such as [Match.com](http://Match.com) and hook-up sites such as Tinder
    are very much social media in that they require the user to set up a profile from
    which to interact with others on a network platform. Dating site profiles also
    require an email account. Even the raciest of these sites also have user agreements,
    and privacy and security settings. They usually initially allow users to create
    profiles for free but gaining access to many of the sites’ major features require
    a monthly subscription. (Facebook also has its own site, Facebook dating, which
    is free.) Many sites also allow users to buy additional services, such as special
    profile prominence, additional messaging capabilities, and/or the ability to buy
    digital gifts/tokens. One major difference with these sites, particularly the
    hook-up sites, is users tend to use pseudonyms. Another difference is the users’
    goal by using these sites is to move from the online world to the real world (a
    date and/or hook-up). Some of these sites are designed to only generate revenue
    through the online communication services they offer users and don’t want users
    to meet offline. The fine print appearing on many of these sites is the acknowledgement
    that the site is purely for entertainment purposes and users have no intention
    of meeting in person.


    Remember those western movie scenes where the saloon ladies were constantly being
    friendly to get the cowboys to buy them drinks to make money for the saloon? It
    is the same principle in operation digitally. The profile keeps the user’s interest
    and instead of buying drinks they get the user to buy tokens and messages to continue
    to be able to engage with the profile. These particular profiles, which no doubt
    are run by the site and not real individuals, are just there to get users to buy
    digital goods. Often these profiles will have a small heart on the profile identifying
    them as users only interested in online activities, specifically chat.


    One fraudster technique is to connect with a user on a dating site for a few days
    and then request they continue their communication outside the dating site’s purview.
    They will suggest chat apps like WhatsApp, Telegram, Signal, Google Chat, Viper,
    and so on. Once fraudsters get them on the chat app they will make a pitch as
    to why they need money or encouraging the user to invest in some scheme. Getting
    the user to switch to an outside chat app insures they don’t have to worry about
    the dating site deleting their profile for something they can see on their network
    and be proven to be shady. These outside apps also create other avenues for a
    user to fall victim to cybercrime.


    One would think that sites which collect a fee would do a better job of policing
    who is on its site, for instance prohibiting sex offenders on the site. Match
    Group, which owns free dating apps, such as Tinder, OkCupid, Plenty of Fish, and
    other free dating apps were found not to be screening whether users were registered
    sex offenders. \[Holmes 2019\]. A 2020 House subcommittee was investigating Tinder
    and Bumble for allegedly allowing minors and sex offenders to use their services
    \[Ortuay 2020\]. One would also assume that paid sites would not try to trick
    it’s own consumer base. The Federal Trade Commission (FTC) sued online dating
    service Match Group, Inc. alleging that the company used fake love interest advertisements
    to trick hundreds of thousands of consumers into purchasing paid subscriptions
    on [Match.com](http://Match.com). \[Federal Trade Commission 2019\] These risks
    are in addition to nefarious users on the platform that are trying to commit romance
    scams and other online fraud schemes.


    There are also stories of robbers and murderers using such sites to find their
    next victims. We encourage readers to avoid using these sites. Despite the clear
    risks many individuals may find value in the services offered by those sites and
    will disregard our warning. With that in mind here are some suggestions:


    1.Users should not use even a portion of their name on these sites. These sites
    frequently require the user to say where they are located. The location and the
    user’s name can be used to locate their profile on other sites, such as Facebook,
    which can lead to the user’s full identity. With the user’s full identity, they
    may be able to locate their actual address.


    2.Avoid allowing these sites to connect to other accounts, such as Facebook to
    upload pictures for your profile. These uploaded or shared images can further
    be used to connect the user’s dating profile with their off-line persona.


    3.Be critical of all the “likes” and “messages,” particularly those coming from
    geographic locations not nearby or in the user’s interest area. They are either
    individuals trying to scam the user or the sites profiles to keep one interested
    in using the service.


    4.Be very suspicious of profile pictures. Many users will use images pulled from
    other Web sites as their profile pictures. The user can do a reverse search using
    either Google Image search or TinEye and possibly find where else the image appears.
    There are also pay sites that will search images, such as Social Catfish ([https://socialcatfish.com/](https://socialcatfish.com/))
    or FaceCheckID ([https://facecheck.id/](https://facecheck.id/)) A person using
    someone else’s picture is a red flag to refrain from having any contact with them.


    5.Never forward bank or financial information to a profile. It is always a scam.
    They are not going to use the funds to travel to meet the user.


    6.If one is going to risk any real-world meeting, know who the user is going to
    meet. Get as much real information on that person as possible. Use it to check
    sex offender registrations lists. If possible do online criminal background checks.
    Make sure the meeting is in a very public place. Do not provide a home or work
    address. Users should tell someone where the meeting location is and who they
    are meeting and what time the meeting will be over. They should have their cell
    phone charged and with them at all times. Doing all this will allow the authorities
    to at least start the search to locate the user if needed.


