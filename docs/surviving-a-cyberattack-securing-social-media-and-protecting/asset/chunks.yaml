- raw: 'Considering all the topics discussed in this chapter you can begin to assess
    the possible threats to your personal home network and family. In [Table 3.2](#chapter03.xhtml#tab3-2)
    Risk Assessment, we have provided a list of considerations that you can use to
    guide your personal identification of the weaknesses in your home use of technology.
    Use this list as a basic guide and add additional items that might be unique to
    your personal home environment. As you complete the checklist make a note of when
    you reviewed this and how you accomplished it.


    TABLE 3.2  Risk Reassessment


    | Things to consider || Reviewed/completed |


    | --- | --- |


    | Uset strong and unique passwords for all online accounts. ||  |


    | Avoid using default passwords for devices and change them regularly. ||  |


    | Avoid using easily identifiable information, such as your full name or birthdate,
    in online usernames or passwords. ||  |


    | Use a password manager to securely store and generate strong passwords for all
    accounts. ||  |


    | Enable two-factor multifactor authentication for added security. Use an authenticator
    app when available. ||  |


    | Regularly update software and operating systems to protect against security
    vulnerabilities. ||  |


    | Use reputable antivirus software and keep it updated. ||  |


    | Use a firewall to protect against unauthorized access to your computer or network.
    ||  |


    | Use a secure browser and enable the Do Not Track feature to prevent Web sites
    from tracking your online activity. ||  |


    | Read and understand the privacy policies of Web sites and apps before providing
    personal information. ||  |


    | Identify the privacy settings on social media and adjust them for one’s security
    needs. ||  |


    | Be cautious of phishing emails and never click on suspicious links. ||  |


    | Don’t share personal information on social media platforms or in online forms
    or accounts. ||  |


    | Avoid using public Wi-Fi when possible. ||  |


    | Use a virtual private network (VPN) when accessing the internet on public networks.
    ||  |


    | Regularly back up important data on external hard drives or secure cloud storage.
    ||  |


    | Use a shredder for sensitive documents before disposing of them. ||  |


    | Keep personal devices, such as laptops and smartphones, physically secure and
    use passcodes or biometric authentication to prevent unauthorized access. Don’t
    leave devices unattended in public places. ||  |


    | Avoid using public computers or shared devices for sensitive tasks such as online
    banking or shopping. ||  |


    | Regularly review bank and credit card statements for any unauthorized charges
    or suspicious activity. ||  |


    | Educate yourself on current security threats and stay vigilant in protecting
    your personal data. ||  |


    CONCLUSION


    Going on the Internet is not without security issues. This chapter covered the
    best security practices for a variety of tools and features available. [Chapter
    4](#chapter04.xhtml) discusses additional steps to secure social media.


    | CHAPTER || 4 |


    | --- | --- |


    SECURING SOCIAL MEDIA


    IN THIS CHAPTER


    This chapter covers securing social media. It discusses the concerns and risks
    of social media use and the approaches to secure one’s personal data online. This
    includes password security and how important maintaining secure passwords is in
    an online world.


    SOCIAL MEDIA USE


    Social media is as ubiquitous as the telephone and television. Increasing it is
    used not only to connect to friends and family but also as a necessary business
    tool. Unfortunately, social media security is an afterthought for most users.
    We live in an environment where many social media accounts have been broken into
    and no one is immune. It is a digital survival necessity that one considers what
    social media security means and implements its requirements.


    Many argue the best thing to do to protect oneself from any security issues is
    to simply never open any social media accounts in the first place, and if the
    user did, they should immediately close and delete them. This is the equivalent
    of becoming a modern-day hermit. This is not a realistic approach in today’s world
    as access to not only individuals, but goods, services, and information is greatly
    enhanced through social media connectively. Account break-ins are unfortunately
    becoming more common. In September of 2018, an attacker obtained digital credentials
    that allowed them to access Facebook users’ information, including names, birth
    dates, current cities, hometowns, and more, which affected an estimated twenty-nine
    million people. These massive breaches against a provider make headlines, but
    they are not the only attacks happening. Individuals are often singled out or
    targeted by attackers looking for information that can be used to extort or embarrass
    users or to gain access to other accounts of value, such as a bank account. This
    chapter will discuss how to secure a user’s social media accounts to minimize
    the risk, whether it comes in the form of a massive breach or a targeted attack.
    Hopefully, during the process, the user will become aware that what one posts
    on social media has a long shelf life and may someday be viewed by individuals
    beyond their intended audience.


    Social media entities do not provide their services as philanthropic gestures
    to the public. They use their platforms to make money. They drive content to users’
    feeds based on their proprietary algorithm. These formulas scrutinize surfing
    habits, likes/dislikes, posts, online shopping, contacts, geolocation, and a host
    of other unknown criteria to drive content to users. Companies pay social media
    to use this information to sell goods and services to users. All of this is done
    to make users addicted to social media and the goods and services being pushed
    on this twenty-first-century platform.


    Businesses aren’t the only ones trying to use social media to change thoughts
    and behavior. As was seen during the 2016 US elections countries are willing to
    use social media to manipulate the actions of users, including how individuals
    vote. It is important to discuss these issues to reduce one’s risk of being manipulated.


    THE VALUE OF USER’S INFORMATION TO OTHERS


    Information is valuable for both legitimate and illegitimate reasons. Family,
    friends, coworkers, and business partners can have a legitimate reason for knowing
    personal information. Criminals can use our personal information to cause both
    financial and physical harm to us and our loved ones. The following list describes
    the value of personal information:


    1.Mining Personal Information: Publicly open social media accounts provide leads
    to a user’s interests, family, and friends. These leads identify where one shops,
    lives, and goes to school. It could potentially provide information on a user’s
    banking and investing account locations. This information can be used as a real-world
    attack. It could be used to create a password dictionary to help in a brute force
    attack on social media accounts, emails, and so on. Information gained can be
    used to trick users or others in a social engineering act to gain access to an
    account or system or trick one to send/authorize funds be transmitted.


    2.Gain Access to Work Accounts: Information on social media can point to an employer’s
    network, such as a work email, which can be used to attack that network. Users
    should make sure their social media does not link to their work email.


    3.Steal Users’ Identity: The theft of a single account can potentially lead to
    the access of other accounts the user has control over. It could also be used
    to register accounts on other sites.


    4.Blackmail: Some strange people will get a user’s sensitive or personal data,
    such as photos, to try and use it against the user. Harassment can occur as well
    as blackmailing the user for money or incriminating photos. This has become an
    issue for teenagers chatting online with strangers.'
