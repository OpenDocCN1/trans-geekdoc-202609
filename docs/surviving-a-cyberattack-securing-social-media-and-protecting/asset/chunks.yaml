    \ risks, there are a few precautions that users can take:\n- First, it is important\
    \ to keep Bluetooth turned off when not in use, as this will prevent unauthorized\
    \ devices from connecting to your device.\n- Only pair with trusted devices and\
    \ avoid using Bluetooth in public places where hackers may have the opportunity\
    \ to intercept your connection.\n- Don’t set devices to “discoverable” mode so\
    \ devices cannot detect and connect without permission.\n\nSome other common Bluetooth\
    \ threats include pairing your phone to a rental car. Pairing can conveniently\
    \ download contact list, emails, and text messages. If you don’t delete this information\
    \ from the rental car or an old car traded in, other people can potentially access\
    \ your data.\n\n## WHO ELSE IS WATCHING YOUR WEBCAM?\n\nYou carefully set up that\
    \ webcam to watch your house or your children while you were away. It has been\
    \ great to see if your children made it home on time or if they are doing their\
    \ homework after school. It’s unnerving to think about who else might be watching\
    \ your webcam? If you do not pay attention to security on this toy, anyone in\
    \ the world could potentially be watching your kids all day and you at night.\
    \ The website `Shodan` (`www.shodan.io`) provides white hat (ethical) hackers\
    \ as well as criminals, sexual predators, and the government of any country the\
    \ ability to find and identify unsecured webcams connected to the Internet. Finding\
    \ devices on the Internet can be as simple as going to their website (`www.shodan.io`).\
    \ Unsecured systems, cameras, printers, and other devices connected to the Internet\
    \ can and are scanned for access. Your camera in your house, which you thought\
    \ was plug-and-play easy, may be broadcasting your living room to the world. You\
    \ can simply search for your `IP address` by going to the `Shodan` website and\
    \ entering your `IP address`. If `Shodan` has crawled the `IP address`, any information\
    \ will be found there.\n\n## Webcam Gate\n\nIn 2010, a Pennsylvania school district\
    \ agreed to pay $610,000 to settle a federal lawsuit. The suit, which was dubbed\
    \ the “Webcam Gate” scandal involved the school surreptitiously and remotely activating\
    \ webcams embedded in school-issued laptops the students were using at home [Robbins\
    \ 2010]. This is a cautionary tale to be aware of what devices are brought into\
    \ your home and to act accordingly. This includes employer-owned devices you bring\
    \ home that may have remote monitoring capabilities similar to that used by the\
    \ school in this case.\n\n## TEXT MESSAGE SECURITY\n\nTexting can pose a variety\
    \ of dangers, one of them being the interception of SMS messages. This means that\
    \ someone can access and read the contents of text messages without the phone\
    \ owner’s knowledge or consent. This can be particularly concerning when it comes\
    \ to sensitive information such as bank account numbers or credit card details.\
    \ Even simply sending a photo of a credit or debit card to a friend or relative\
    \ can put one’s financial security at risk if intercepted. Furthermore, the data\
    \ remains on the service provider’s network, making it vulnerable to hackers or\
    \ other malicious actors.\n"
  trans: "\n请注意，即使是无法访问敏感数据的 IoT 设备，也可能被用于提供有关用户习惯的信息。例如，智能家用电器或健身追踪器等低风险设备，一旦被破解，可能会让黑客获知某人何时在家，或者在特定时间可能在何处。\n\
    \n## 检查设备以识别家庭安全风险\n\n用户应该对自己目前拥有的设备有一个通用的了解，并且他们可能对家庭技术的不安全性感到担忧。将这些物品分为不同的功能，记录它们的特定用途，并绘制家庭网络图，是很有帮助的。使用表\
    \ 2.4 开始绘制你房屋技术的设备图。\n\n1. 确定家里哪些设备允许访问互联网。这些通常是由服务提供商提供的路由器，或者是用户自行添加的路由器。\n\
    2. 查看通过无线或以太网线连接到此路由器的设备。以太网线连接本质上更安全，因为它们是定向连接的。Wi-Fi 的安全性较低，因为它使用可以被截获的无线电波。\n\
    3. 大多数 IoT 设备将通过路由器连接到互联网。\n    a. 每个设备都附有有关如何连接它的说明书。\n    b. 识别每个设备的登录程序。\n\
    \    c. 逐一登录设备并识别该设备可用的安全功能。\n    d. IoT 设备最经常被忽视的安全措施是更改管理员和密码；请立即更改这些内容。\n \
    \   e. 考虑在路由器中使用 `MAC filtering` 功能，并为 IoT 设备分配内部 IP 地址。\n\nTable 2.4 数字风险清单]应包含所有家庭成员的设备，包括手机、iPad\
    \ 或平板电脑、电脑和家庭路由器。还有其他需要考虑的因素。例如，汽车呢？冰箱、监护摄像头、安全摄像头、GPS 设备、家用恒温器或任何通过无线连接的电子设备都可能带来风险。记录物品的品牌、型号、序列号以及任何识别标记（这在物品被盗时可以帮助警方，也可用于保险之目的）。\n\
    \n一旦某人对这些物品有了清单，他们就能更好地判断未经授权访问家庭的风险。如果某些设备是移动的，将会遇到新的风险。在工作中使用移动设备、连接到办公室网络、连接朋友家的\
    \ Wi-Fi 以及在当地咖啡店连接，都会让移动设备面临额外的风险。图 2.3 展示了如何绘制房屋图的示例。\n\n![](img/fig3.jpg)\n\
    图 2.3 房屋绘制图。\n\n在绘制房屋图时，用户应该物理地画出路由器的位置。要记住，普通家庭路由器的 Wi-Fi 信号传输范围大约为一百英尺。可以查看制造商网站来确定其传输距离。\n\
    \n## 某些蓝牙的危险\n\n蓝牙技术虽然方便且被广泛使用，但如果不妥善保护，可能会产生潜在的危险。主要风险之一是窃听，因为蓝牙信号可以被黑客截获，他们可以获取密码、信用卡号和个人对话等敏感信息。这可能导致身份盗窃、财务损失和隐私侵犯。此外，未安全的蓝牙连接还可能受到恶意软件攻击，允许黑客控制设备。\n\
    \n为了确保蓝牙安全并最大限度地减少这些风险，用户可以采取一些预防措施：\n- 首先，在不使用时关闭蓝牙很重要，因为这可以防止未经的设备连接到你的设备。\n\
    - 仅与受信任的设备配对，并避免在黑客可能有机会截获你连接的公共场所使用蓝牙。\n- 不要将设备设置为“可发现”模式，以免设备在未经许可的情况下检测并连接。\n\
    \n其他常见的蓝牙威胁还包括将手机与租汽车配对。配对可以方便地下载联系人列表、电子邮件和短信。如果你没有从租汽车或折旧的旧车中删除这些信息，其他人可能会访问这些数据。\n\
    \n## 还有谁在看你的摄像头？\n\n你仔细设置摄像头是为了在你离开时看你的房子或孩子。看到孩子们是否准时回家或在放学后做作业是很棒的。但还有谁可能在看你的摄像头令人不安。如果你不注意这个玩具的安全，世界上任何人都可能整天盯着你，晚上也一样。`Shodan`\
    \ 网站为白帽（伦理）黑客、犯罪分子、性犯罪者以及任何国家提供了发现和识别连接到互联网的不安全摄像头的能力。发现互联网上的设备只需访问他们的网站并输入你的\
    \ `IP 地址`。如果 `Shodan` 爬取了 `IP 地址`，任何信息都会在那里被找到。\n\n## 摄像头门事件\n\n2010 年，宾夕法尼亚的一个学区同意支付\
    \ 61 万美元达成一项联邦诉讼的和解。这项被称为“摄像头门”丑闻的诉讼涉及学校秘密并远程激活学生在家里使用的笔记本电脑中的嵌入摄像头 [Robbins 2010]。这是一个警示，提醒人们要留意带家中的设备并采取相应措施。这包括你带回家的公司设备，这些设备可能具有与本案学校类似的远程监控功能。\n\
    \n## 短信安全\n\n短信可能会带来各种危险，之一就是短信被截获。这意味着有人可以在未经手机主人知情或同意的情况下访问并阅读短信内容。当涉及银行账户号码或信用卡详情等敏感信息时，这可能尤为令人担忧。即使向朋友或亲戚发送信用卡照片，如果被截获，也会危及财务安全。此外，数据留在服务提供商的网络中，使其受到黑客或其他恶意入侵者的攻击。\n"
