    ## PREVENTION


    All the steps previously suggested to strengthen systems are applicable to vulnerable
    adults’ systems (computer, tablets, Kindle books, cell phones, etc.). Make sure
    their systems have up-to-date software and antivirus and antispyware installed.
    Also make sure their social media profiles settings are restricted too. Many of
    these threats can be stopped before they even appear to vulnerable adults by strengthening
    their defenses. Educate them about accessing the spam folder. They should only
    be exploring the spam folder for a specific email that they were expecting that
    got misidentified as a problem.


    Be aware that many assisted living facilities will provide free Wi-Fi to their
    residents. Assess how secure the vulnerable adults’ systems are.


    ## MONITORING FOR VULNERABLE ADULT SCAMS


    ### TABLE 6.3 Red Flag Discussions


    | | Red flag | Covered |

    | :--- | :--- | :--- |

    | 1. | Emails or messages from unknown senders or companies they have not interacted
    with before. Included are unknown or untrustworthy callers. | |

    | 2. | Telephone calls or emails purportedly from government agencies, financial
    institutions, or utilities threatening some actions (liens, accounts being frozen/closed,
    or arrest) unless they take immediate actions. Government agencies do not communicate
    in this matter. | |

    | 3. | Unsolicited messages or emails asking for personal information, such as
    passwords, bank account numbers, or social security numbers. | |

    | 4. | Unsolicited requests for remote access to their computer. | |

    | 5. | Poor grammar and spelling in messages or emails. | |

    | 6. | Suspicious links or attachments in messages or emails. | |

    | 7. | Fake Web sites or social media profiles. Stress that fake social media
    profiles of friends and relatives can be created by cybercriminals. | |

    | 8. | Messages or emails claiming they won a prize or lottery that were not entered.
    | |

    | 9. | Unsolicited offers for investments or financial opportunities. Any offers
    that sound too good to be true. | |

    | 10. | Requests for advance fees, wire transfers, or use of prepaid debit or
    gift cards as payment. | |

