    # 延长欺诈警报


    延长欺诈警报是一种出现在用户信用报告上的通知，有效期为七年。它要求贷款机构在处理信用（credit）或贷款申请之前核实用户的身份。延长欺诈警报是为身份盗窃受害者设计的，旨在为他们的信用历史提供更长时间的保护。该警报需要受害者提供更多信息，并且通常需要提交执法部门的报告，以验证其身份盗窃受害者的身份。表格
    9.6 为读者提供了延长欺诈警报概念的轮纲。


