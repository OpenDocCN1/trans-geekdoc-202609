- raw: 'Users expose ourselves even when they don’t deal with an organization for
    services. Countless individuals have established social networking profiles, frequently
    without considering the security or privacy settings. They share information with
    others, believing those they communicate with are who they purport to be. People
    erroneously convince themselves that what they post will not be shared with someone
    they don’t approve. People often erroneously trust their relatives, friends, and
    associates not to forward their information to others or they believe that their
    security/privacy settings are locked down. With all these misconceptions, people
    also believe that social media sites have security that prevents them from being
    victimized. Unfortunately, the wealth of information these sites contain makes
    them a tempting target for those criminals looking for information that can be
    converted into something of value, such as access to someone’s bank account. Social
    media companies are not immune to cyberattacks. In 2013, hackers stole two million
    passwords from social networking sites, such as Facebook, Twitter, and LinkedIn,
    and email providers Google and Yahoo. Being the CEO of the largest social media
    company does not make one immune from being attacked for poor password usage.
    Facebook founder Mark Zuckerberg had his Twitter and Pinterest accounts taken
    over due to his reuse of passwords that the hackers found in a dump of stolen
    passwords from business social media giant LinkedIn in 2012.


    Attacks are also literally coming from every direction and device. Thousands of
    unsecured webcams in the United States and Western Europe provide footage for
    a Web site based somewhere in the Russian Federation. An extreme privacy invasion,
    these unsecured webcams can also be used to determine the best time to commit
    a robbery or burglary. Webcams are not the only vulnerability. One security expert
    correctly observed that our coffee pots, televisions, stoves, and refrigerators
    are enabled on the Internet, and their security protocols are not always adequate.
    How does one avoid an Internet risk that is increasingly being built into common
    household devices? Recent reports have noted certain modern vehicles have been
    hacked and the discovered vulnerabilities allowed actors to control car functions,
    such as starting and stopping.


    In the early days of computing, Gene Spafford director of the Computer Operations,
    Audit, and Security Technology (COAST) Project at Purdue University opined, “The
    only truly secure system is one that is powered off, cast in a block of concrete
    and sealed in a lead-lined room with armed guards - and even then I have my doubts.”
    Spafford \[1989\] Today, we live in a society where everyone must be concerned
    about not just their own computer or system but everyone’s. The reality is the
    world is such that no matter how safe one makes their computer and their personal
    practices, someone else may drop the ball and expose them to cyberharm. If it
    is not a company, an agency, or a “friend” on social media, it is a coffee pot
    or refrigerator leaking information to the world.


    To make matters worse, cybervictimization is not just limited to having personal
    identifiers and credit/finances stolen or privacy invaded. There are other, more
    sinister harms awaiting the cyberpublic. Sexual exploitation of children has long
    plagued the Internet. Child molesters regularly visit teen chatrooms looking for
    victims. Bullying and stalking are increasingly occurring online, with 10% to
    40% of youth experiencing cyberbullying. Sextortion, a form of blackmail where
    the criminal uses sexual explicit images of the victim to gain financial reward
    or worse, has resulted in not only financial loss but numerous suicides. Some
    murderers, and more specifically, serial killers are using the Internet to hunt
    victims.


    Cybercriminals often use social engineering techniques to convince victims to
    part with their finances. The Internet Crimes Complaint Center (IC3) reported
    the losses reported due to investment scams in 2023 became the most of any cybercrime
    tracked by them. According to IC3 investment fraud losses rose from $3.31 billion
    in 2022 to $4.57 billion in 2023, a 38% increase. As reflected in [Figure 1.2](#chapter01.xhtml#fig1-2)
    investment fraud victims were often over the age of forty. [Figure 1.3](#chapter01.xhtml#fig1-3)
    shows that all reported IC3 crime losses significantly impacted the older population.
    The cyberthreat clearly does not diminish as people get older \[FBI, 2024\].


    Safety or protection implies one is free from danger or harm. We can minimize
    and maybe avoid it, but the access made available by the Internet is not free
    from danger or harm. The term cybersurvival is much better. It recognizes that
    there is danger or harm but has a connotation that goes beyond safety or protection
    to overcoming those attacks.


    The goal in writing this book is not to make users “unplug” and refrain from using
    the Internet. Being an ostrich in a digital world is no way to live. The authors
    will draw on their collective cyberlaw enforcement experience to not only maximize
    readers’ ability to avoid being a victim but also to prepare readers in the event
    they become a cybervictim. The goal is to enable readers to survive in a world
    where cybercrime events are becoming an everyday occurrence. The authors will
    provide information on how to strengthen cyberdefenses and recognize and avoid
    cyber risks. They devote specific chapters to protecting children, vulnerable
    adults, and small businesses. They also provide readers with information on how
    to be safe in the online marketplace. They will educate readers on minimizing
    the harm if they become a cybervictim. Finally, the authors will educate readers
    on how to properly document and report a cyberattack to law enforcement to maximize
    the potential for the perpetrator to be apprehended and prosecuted, hopefully
    making everyone safer in today’s digital world.


    ![](image/fig1-2.jpg)


    FIGURE 1.2  IC3 investment complaints by age range.


    ![](image/fig1-3.jpg)


    FIGURE 1.3  All IC3 complaints by age group.


    The authors will accomplish these goals by simplifying concepts and not inundating
    readers with technical jargon. When they do use technical information, it is explained.
    The authors have collectively educated and trained law enforcement on these concepts
    for years, and they know how to explain things to individuals who do not possess
    a degree in computer science or security. For those with a computer science or
    technical background who happen to pick up this book, the authors hope it is a
    valuable resource for explaining things to loved ones who are less technically
    advanced.


    CONCLUSION


    Understanding that cybercrime is a fact in today’s world is the first step to
    understanding how to begin to protect oneself when using the technology around
    them. This chapter discussed the crimes committed through technology and the places
    criminals target victims. The next chapter will begin the journey of understanding
    how to protect oneself and the technology used at home and in the small-business
    environment.


    REFERENCES


    Federal Bureau of Investigation (2024). Internet Crime Complaint


    Center. “2023 Internet Crime Report,” April 21, 2024. [https://www.ic3.gov/Media/PDF/AnnualReport/2023\_IC3Report.pdf](https://www.ic3.gov/Media/PDF/AnnualReport/2023_IC3Report.pdf)


    Gene Spafford (1989) “Quotable Spaf” [https://spaf.cerias.purdue.edu/quotes.html#:~:text=The%20original%20quote%20is%3A%20The,’Reilly%2C%201997%2C%20S](https://spaf.cerias.purdue.edu/quotes.html#:~:text=The%20original%20quote%20is%3A%20The,’Reilly%2C%201997%2C%20S).


    | CHAPTER || 2 |


