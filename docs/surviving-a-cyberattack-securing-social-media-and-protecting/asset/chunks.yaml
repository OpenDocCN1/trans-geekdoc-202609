    # 家庭科技用户协议


    家庭科技用户协议是一系列父母和孩子在在家中使用技术产品时同意遵守的规则和准则。这些协议非常重要，因为它们有助于建立预期、设定界限并促进负责任的技术使用。通常，孩子们在很小的时候就会接触技术，可能并不理解潜在的风险和后果。通过建立用户协议，父母可以教育孩子如何安全、适当地使用技术，同时为监控使用情况和解决可能出现的任何问题制定准则。


    创建用户协议应该是父母和孩子之间的共同努力，以便双方之间进行开放的沟通与理解。这些协议可以涵盖多个主题，如时间限制、适当内容、网络安全以及违反规则的后果。随着孩子的成长和技术的演进，父母定期重新审视并更新协议是非常关重要的。通过让孩子参与这一过程，他们将对自己的技术使用有更好的更好的理解和主翁感。表
    5.5 为想要创建家庭科技用户协议的父母提供了在线资源。


    ## 表 5.5 父母用户协议在线指南


    | 引用 | 网页地址 |

    | --- | --- |

    | Common Sense Media 的家庭媒体协议 | [`www.commonsensemedia.org/family-media-agreement`](https://www.commonsensemedia.org/family-media-agreement)
    |

    | 联邦贸易委员会保护孩子在线隐私父母指南 | [`www.consumer.ftc.gov/articles/0031-protecting-your-childs-privacy-online`](https://www.consumer.ftc.gov/articles/0031-protecting-your-childs-privacy-online)
    |

    | 国家在线安全父母在线安全中心 | [`nationalcollege.com/categories/online-safety`](https://nationalcollege.com/categories/online-safety)
    |

    | KidsHealth 的网络安全 | [`kidshealth.org/en/parents/net-safety.html`](https://kidshealth.org/en/parents/net-safety.html)
    |

    | ConnectSafely 的儿童与科技父母指南 | [`connectsafely.org/parentguides/`](https://connectsafely.org/parentguides/)
    |


    # 使用监控软件


    父母保留执行控制和管律孩子的法律权利。监控软件（包括 GPS 追踪软件）提供了侵入用户孩子隐私的能力，这在过去的几代中是不可能的。这种监控能力已内置在某些父母控制软件中，特别是手机应用程序中，初看之下这似乎是用户想要利用的功能。然而，这可能会让人怀疑，自己是想做孩子的父母，还是他们孩子在线体验的监狱管理员。除了这个重要问题外，用户还必须考虑重要的法律后果。


    ## 法律问题


    美国联邦和/或州的窃听法案（统称为 `Title III` 法律）禁止非通信参与方拦截“实时”通信。联邦法提供了最低的隐私保护水平，而某些州提供了更强的保护。许多美国法院裁定，计算机监控可以被视为窃听。`Title
    III` 法律对违规行为包含了刑事和民事惩罚。


    除了法律程序（如法院命令或搜查令）），监控可以在获得同意的情况下进行。同意有两种：第一种是“单方同意”，包含在联邦法和 38 个州的法律中。另一种类型被称为“双方同意”。这意味着通信双方都必须同意监控，才能符合此豁免条件。有十二个州（加利福尼亚州、康涅狄格州、佛罗里达州、伊利诺伊州、马里兰州、马萨诸塞州、密歇根州、蒙大拿州、内华达州、新罕什尔州、宾夕法尼亚州和华盛顿州）要求双方同意。


    许多人可能认为，只需要孩子的同意通过应用程序监控其数字生活即可。这可能没问题，有些州要求通信双方都同意监控。假设用户住在双方同意州之一，且是一个单亲家庭。孩子开始与非监护父母发短信。那位非监护父母会同意监控他们与孩子的通信吗？他们会对此制造麻烦并采取法律行动吗？如果一个人住在单方同意州，而孩子带着设备（如手机）去了一个双方同意州（例如参加学校旅行或在假期探访亲戚），那么在
    във州期间发生的任何通信都需要双方同意才能进行监控。


    ## 其他问题


    监控软件除了法律担忧外，还有其他问题。并非所有设备（如游戏系统）都可以安装监控软件。大多数防病毒软件以及防火墙都会禁用或对监控软件的功能产生其他问题。毕竟，它是间谍软件。这要求用户通过其防病毒软件和防火墙为监控软件授权异常。如果创建了异常，就会为其他人安装其他监控软件的机会，以针对用户或其家庭实施恶意目的。如果有人未经授权访问监控软件的结果，他们可能会获得有关用户及其家庭的巨量信息。获取某些监控应用程序（特别是低成本或免费软件）会引起更多问题，例如在用户的系统中引入其他恶意软件。


    监控软件会产生大量待审查的数据。这些数据根据安装的设备数量倍增。取决于应用程序，它还可以向用户发送关键事件的警报。如果警报配置不当，很快会被虚假信息淹没。例如，如果用户决定每次孩子访问带有“sex”一词的网站时收到警报，用户就会收到关于性别歧视、性教育或标题为《性别大战》的新闻邮件警报。监控软件必须正确配置并处理数据审查，否则它将迅速违背你管理孩子网络风险的初衷。


    ## 部署监控软件


    1. 如果监控应用程序允许，选择阻止某些活动的功能，或仅在尝试突破限制时生成警报。通过完全停止通信，阻止有助于缓解对无意监控需要双方同意的通信的担忧。

    2. 告知孩子其设备上部署了监控软件。这可能会阻止他们的不良行为，也可能使他们转向未受监控的设备。

    3. 如果不需要，避免捕获所有内容。例如，如果担心色情浏览，没必要捕获基于网络的电子邮件。

    4. 设置监控在关键事件时触发（如色情网站）。某些监控程序预定义了问题网站列表。这进一步限制了监控范围。

    5. 考虑仅捕获发出的通信，因为你的孩子可能同意了监控。


    # 关于监控软件的最后思考


