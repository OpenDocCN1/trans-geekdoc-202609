    able to insert spyware on the user’s system to track their online and offline
    activities. In other cases, such as cyberbullying, they may harass the user or
    their loved ones online without direct access to the user’s data or system. They
    frequently attack the most vulnerable, our kids and older loved ones. Being able
    to survive any of these requires some planning and levelheaded responses. There
    are many types of potential cyberattacks that can harm, disable, or steal data.
    Some of the common attacks and ways to prevent them are referenced in [Table 9.1](#chapter09.xhtml#tab9-1).


    ![](image/fig9-1.jpg)


    FIGURE 9.1  Common cyberthreats.


    TABLE 9.1  Attacks and prevention.


    | Attacks | Prevention |

    | --- | --- |

    | Malware: A malicious file that is downloaded to a computer. The file can potentially
    steal credit card data, collect user keystrokes and passwords, and/or encrypt
    the device data and demand ransom. This all depends on the software’s preprogrammed
    functionality.Trojan horse: A Trojan, or Trojan horse, is malware that delivers
    its payload by hiding itself within something legitimate. This can be a software
    download update from a malicious site or possibly a link in an email or a legitimate-looking
    attachment that contains the malware. Ransomware: A malware program specifically
    designed to encrypt the files on a user’s computer and present a demand for a
    ransom to receive the decryption key. The hacker wants payment in a crypto currency
    at a specific Web site generally hidden on the Dark Web. | 1. Avoid downloading
    programs from unrecognized sources.2. Have an up-to-date antivirus program.3.
    Backup all data. (See [Chapter 8](#chapter09.xhtml) for suggestions). |

    | Social Engineering: The manipulation of people into divulging confidential information.
    Social engineering is the art of psychological manipulation. The goal is to get
    people into performing actions. Criminals use these methods because it is easier
    to exploit. Phishing/spear phishing/smishing are forms of social engineering.
    | 4. Never give out information over the phone.5. Do not honor requests from someone
    you know.6. Don’t click on links in email or text message. |

    | Cyberstalking/Cyberharassment is the use of the Internet or other means to harass,
    intimidate. This includes both children and adults. This can include someone posting
    illicit images of a former lover (revenge porn) or doxing, the release of personal
    information, such as your address and telephone number, on a social media site
    for harassment purposes. | 7. Limit the amount of personal information published.8.
    Check the privacy settings on all accounts.9. Turn on two-factor authentication
    previously discussed in this book. |


    ## Phishing, Spear Phishing, and Smishing


    A phishing scam is an official-looking email from the government, a bank, or well-known
    company that cons the victim into exposing their system. The email may contain
    a link or other instructions to follow that trick the victim into providing the
    attacker with personal or company information such as banking details or login
    and password information for accounts. Phishing attacks frequently involve sending
    hundreds or thousands of emails to users purporting to be from a specific bank
    or company, with the random hope that some of their targets actually have a relationship
    with the entity they are purporting to be. Spear phishing uses the same techniques,
    but it is a targeted attack, usually toward a business or government agency. They
    will purport to be an entity that the intended target will trust. For instance,
    they will create an email purporting to be inside a target’s employer, such as
    a president, to convince the target to take some action that is detrimental to
    the employer. The action sought varies but could include allowing the attacker
    to gain access to the employer’s systems or to convince them to wire transfer
    funds. Smishing is the same as phishing but is accomplished via sending text messages
    instead of emails. [Figure 9.2](#chapter09.xhtml#fig9-2) is an example of another
    phishing emails using known companies that the receiver might actually have as
    a service. It is necessary in today''s email security to review any emails you
    receive especially if they come from a known service. The scammers copy a known
    service and intentionally use the same messages and images to attempt to fool
    you into clicking on the emails and then using your login and password to gain
    access to the account. Unfortunately that website is the scammers and you just
    gave them your username and password which they can use take over your account.


    ```

    ![](image/fig9-2.jpg)

    ```

    FIGURE 9.2  Email phishing example.

