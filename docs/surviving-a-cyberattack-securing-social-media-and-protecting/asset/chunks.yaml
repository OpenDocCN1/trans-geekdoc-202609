    ## 预防


    之前建议的所有加强系统的步骤都同样适用于脆弱成年人的系统（电脑、平板电脑、Kindle 电子书、手机等）。确保他们的系统安装了最新的软件以及防病毒和反间谍软件。还需确保他们的社交媒体个人资料设置也受到限制。通过加强防御，许多威胁可以在它们出现在脆弱成年人面前之前就被阻止。教育他们如何访问垃圾邮件箱。他们应该只在垃圾邮件箱中寻找他们期待的、被误判为问题的特定电子邮件。


    请注意，许多辅助生活机构会为居民提供免费 Wi-Fi。评估脆弱成年人系统的安全性。


    ## 监控脆弱成年人诈骗


    ### 表格 6.3 危险信号讨论


    | | 危险信号 | 涵盖 |

    | :--- | :--- | :--- |

    | 1. | 来自未知发送者或他们以前从未互动过的公司的电子邮件或消息。包括未知或不可信赖的来电员。 | |

    | 2. | 声称来自政府机构、金融机构或公用事业公司的电话或电子邮件，威胁除非立即采取行动，否则将采取某些行动（留置、账户冻结/关闭或逮捕）。政府机构不会就此类事项进行沟通。
    | |

    | 3. | 索要个人信息的非请求消息或电子邮件，例如密码、银行账户或社会安全号码。 | |

    | 4. | 请求远程访问其计算机的非请求要求。 | |

    | 5. | 消息或电子邮件中的语法和拼写错误。 | |

    | 6. | 消息或电子邮件中可疑的链接或附件。 | |

    | 7. | 假的网站或社交媒体个人资料。强调网络犯罪分子可以创建亲友的假社交媒体账号。 | |

    | 8. | 声称中中了未参加的奖项或彩票的消息或电子邮件。 | |

    | 9. | 投资或财务机会的非请求报价。任何听起来好得不可相信的提议。 | |

    | 10. | 要求预付、汇款或使用预付借记卡或礼品卡作为支付。 | |


