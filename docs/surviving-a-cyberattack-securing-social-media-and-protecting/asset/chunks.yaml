    # 网络犯罪举报资源


    | 国家 | 类别 | 资源链接 |

    | :--- | :--- | :--- |

    | 日本 | 网络犯罪/诈骗 | [在日本进行反诈骗举报](https://japanantifraud.org/report-a-fraud-in-japan/#:~:text=If%20you%20have%20been%20scammed,Center%20of%20Japanese%20Police%20Department.&text=Please%20leave%20this%20field%20empty,human%20by%20selecting%20the%20cup)](https://japanantifraud.org/report-a-fraud-in-japan/#:~:text=If%20you%20have%20been%20scammed,Center%20of%20Japanese%20Police%20Department.&text=Please%20leave%20this%20field%20empty,human%20by%20selecting%20the%20cup)
    |

    | 新西兰 | 网络犯罪 | [`www.police.govt.nz/advice-services/cybercrime-and-internet`](https://www.police.govt.nz/advice-services/cybercrime-and-internet)
    |

    | 新西兰 | 身份盗用 | [`www.scamwatch.gov.au/report-a-scam`](https://www.scamwatch.gov.au/report-a-scam)
