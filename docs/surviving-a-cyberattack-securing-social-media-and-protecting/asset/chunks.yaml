    浏览器的私密模式是一项允许用户在不留下任何在线活动痕迹的情况下浏览的功能。这意味着当使用私密模式时，浏览器不会保存浏览历史、Cookies 或设备上的临时文件。这对于关注隐私或与他人共享设备的人来说是一个非常有用的工具。Chrome
    将此功能称为无痕模式。此外，请记住，使用无痕模式并不能完全免受钓鱼诈骗或其他恶意软件的在线威胁。访问网站时，即使使用私密模式，用户的 IP 地址可能会被暴露。


    [/content]


    [content]

    使用他人的 WiFi


    参考第 2 章 讨论的路由器和 WiFi 安全。当你不在家使用其他 WiFi 时，如何知道你所连接的连接是安全的？在朋友家里、咖啡馆或其他其他地方访问 WiFi，某些业务可能会让用户面临风险。用户可能不知道有人在监视他们的网络。在决定使用这些未知的
    WiFi 之前，用户需要保护好自己的设备。以下是一些注意事项：


    1. 在访问未知的 WiFi 之前，确保启用防火墙软件。

    2. 确认公共 WiFi 连接的名称是否正确。恶意攻击者可以设置类似的名称来诱骗用户接入错误的连接。

    3. 如果 WiFi 连接不需要用户名和密码，请考虑不要使用。这不是安全的。有些业务会提供用户名和密码，但完全没有安全功能。

    4. 在出门之前，关闭笔记本电脑或 iPhone 上自动连接 WiFi 的功能。用户也应该关闭蓝牙连接。

    5. 仅使用 `HTTPS` 服务访问网站，以防止访问可能恶意的网站。`HTTPS` 确保与特定网站的通信是安全的。`SSL` 是用于通信安全的加密形式。

    6. 使用虚拟专用网络 `VPN`（见 VPN 章节）。在使用社交媒体账户时，确保激活双因子身份验证。

    7. 关闭文件共享和网络发现。

    8. 在不在家时关闭 WiFi。这可以防止设备发生任何意外连接。


    [/content]


    [content]

    WiFi 攻击类型


    用户可能会遇到多种 WiFi 攻击。一种常见的类型是中间人攻击 (`MITM`)，攻击者拦截并中继用户与无线网络之间的通信。这允许攻击者窃取登录凭据或财务数据等敏感信息。另一种常见的
    `MITM` 攻击是用户可能会遇到恶意访问点或伪造的 WiFi 热点。这是攻击者设置虚假无线网络以诱骗用户连接。这允许攻击者监控并控制用户的所有流量。WiFi
    用户需要意识到这些攻击类型，并采取措施保护自己和数据。


    [/content]


    [content]

    ###识别 WiFi 攻击


    WiFi 用户识别 `MITM` 攻击的主要方法是注意他们所连接的网络。如果用户发现自己在不知情的情况下连接到了不同的网络，这可能是 `MITM` 攻击的象。此外，用户可能会注意到互联网连接比平时慢，或者频繁遇到断开。这可能是黑客通过路由器拦截并中继用户流量的结果。


    识别 `MITM` 的另一种方法是查看网络上的任何异常活动，例如频繁的网络中断或网速缓慢。这可能是有人拦截并重定向网络流量的迹。此外，检查尝试访问网站的安全证书有助于识别中间人攻击。如果证书无效或已被更改，很可能有人尝试拦截连接。始终保持警惕并定期检查网络和设备设置以防止此类攻击。用户还需要警惕任何索要个人信息或登录凭据的弹出消息或警报，因为这些也是
    `MITM` 使用的策略。如果用户发现网络上出现任何奇怪或意外的行为，及时断开并进一步调查以防止潜在攻击。


    [/content]


    [content]

    ### 使用虚拟专用网络 (VPN) 获得更好的安全性


    `VPN` 是通过互联网到另一个网络的安全连接。它允许通过互联网进行通信而不让恶意攻击者或政府查看你的流量。它还可以用于访问地区限制的网站，或在开放或公共
    WiFi 连接上从窥探的恶意攻击者那里隐藏浏览活动。`VPN` 将用户的设备连接到互联网某处的服务器，从而允许使用该计算机的互联网连接浏览网页。世界其他地方看到的是该计算机而不是用户。它充当代理，防止寻找用户的人识别其真实位置


    ### VPN 如何工作


    用户使用该公司的软件将设备连接到 `VPN`。然后，用户的设备就像位于与 `VPN` 相同的本地网络上。用户的浏览随后通过加密连接发送到 `VPN` 服务。用户连接互联网的方式就像他们身处
    `VPN` 所在地一样。在公共 WiFi 上使用 `VPN` 的用处是，用户不会被本地观察，流量也不会被拦截。`VPN` 服务可以看到用户的所有流量。图 3.5
    描述了 VPN 如何工作。


    ![基础 VPN 描述](img/fig3-5.jpg)


    ### 3. 获取 VPN


    找到 `VPN` 服务最简单的方法是在搜索引擎上搜索当前的 `VPN`。有许多 `VPN` 服务可供。每种 `VPN` 服务在功能和定价上都有不同。稍作研究即可提供适用于用户需求的服务列表。


    选择合适的虚拟专用网络 (`VPN`) 服务对于新手互联网用户来说可能非常困惑。选择正确的 `VPN` 服务的第一步是了解自己的需求。确定为什么需要 `VPN`
    以及哪些功能对用户是重要的。例如，如果用户想要访问地理限制的内容，则寻找具有广泛服务器网络的 `VPN`。如果用户想要保护自己的在线隐私，则寻找具有严格无日志策略的
    `VPN`。了解自己的需求将有助于缩小范围并使选择过程变得更容易。


