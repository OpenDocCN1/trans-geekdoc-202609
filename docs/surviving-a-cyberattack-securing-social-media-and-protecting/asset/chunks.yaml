    # 地理标记


    地理标记现在已出现在许多功能中。其中最显而易见的一个是在用户拍摄的照片上添加拍摄时的地理位置标记。这可能是危险的并会危及个人安全。例如，如果一个孩子在开启地理标记功能的情况下拍摄照片并将照片发布到网上，他们可能会向跟踪者者提供其卧室的确切位置。并不是所有的社交媒体在发布图像时都会保留这些数据，但为什么要冒这种风险的险呢？


    # 移除第三方插件或应用程序


    ### 第三方插件和应用程序

    第三方插件和应用程序在社交媒体网站上可能看起来很酷。当使用它们时，通常会离开社交媒体网站的安全防护，进入一个安全性存疑的未知网站。参加 `Facebook`
    提供的关于用户是哪种动物的调查，可能会导致一个未知国家的未知公司访问用户的手机。


    ### 检查社交媒体个人资料

    `Facebook` 和 `LinkedIn` 等网站允许用户以他人的视角查看自己的个人资料。利用此功能检查他人看到的内容，以确保信息没有被无意中泄露。


    Table 4.2 社交媒体安全/隐私清单已添加，旨在为您提供一个审查社交媒体和隐私的清单。使用此清单作为个人指南，帮助保护您的社交媒体账户。


    表格 4.2 社交媒体安全/隐私清单


    ![](img/tab4-2.jpg)


    # 规避社交媒体诈骗的步骤


    1. **在接受好友、发布内容和点击时要具有选择性。**

    2. **对不认识的人要谨慎选择。** 接受所有的连接请求可能是危险的。如果一个人不认识某人，他们真的想与之建立联系吗？假账户被用来尝试访问用户的账户或其人脉。应该对最近创建的账户保持怀疑，特别是当这些账户表现得像很可能早就创建了账户的人时。有些账户你可能认识，但犯罪分子会冒充朋友试图访问用户的账户和好友列表。当真实本人已经是联系人时，看到一个假账户尝试与用户连接的情况并不罕见。

    3. **在点击链接前想两次。**

    4. **小心你的签到地点。** 地理标记是否已开启？用户是否刚刚提醒了窃偷自己不在家？

    5. **不要在网上分享个人信息。**

    6. **留意钓鱼诈骗。**

    7. **不要使用社交凭据登录第三方网站。**

    8. **避免可能获取用户个人资料和其他个人信息的问答和游戏。** 这些通常设计用于让用户泄露关于自己的细节，这些细节可用于获取密码或破解双重身份验证问题。

    9. **避免点击发布的点击党内容。** 通常，这些内容是关于名人去世的突发新闻或关于最新的名人被偷照片的新闻。这些可能且往往是通过恶意链接访问用户设备的尝试。


    # 在社交媒体上使用假名


    为不同的社交媒体服务使用不同的假名是完全可能的。社交媒体网络希望用户感到安全并彼此信任，而使用假名并不代表信任。鉴于目前存在许多允许机器人（试图模仿人类的计算机代码）在社交媒体上做出响应的假账户，很容易理解为什么公司只想要真人。他们正在使用一些技术，例如要求用户感到安全并彼此信任，而使用假名并不代表信任。鉴于目前存在许多允许机器人（试图模仿人类的计算机代码）在社交媒体上做出响应的假账户，很容易理解为什么公司只想要真人。他们正在使用一些技术，例如要求用户感到安全并彼此信任，而使用假名并不代表信任。鉴于目前存在许多允许机器人（试图模仿人类的计算机代码）在社交媒体上做出响应的假账户，很容易理解为什么公司只想要真人。他们正在使用一些技术，例如要求用户感到安全并彼此信任，而使用假名并不代表信任。


