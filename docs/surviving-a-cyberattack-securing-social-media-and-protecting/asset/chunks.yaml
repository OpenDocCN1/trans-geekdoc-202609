    | B | 开启加密。如果此功能可用，考虑使用它来进一步加固用户访问（但在实施之前，请了解其功能以及密钥如何以及存储在何处）。 |

    | C | 更改无线网络名称；这通常被称为 `SSID`。不要使用默认名称。使其具有唯一性以便易于记忆。这是计算机看到并连接的 WiFi 名称。 |

    | D | 启用媒体访问控制（`MAC`）地址过滤——或访问控制。你可以使用此功能来控制访问路由器的设备。`MAC` 地址是与计算机网卡或其他设备关联的物理地址。在
    Google 上搜索以获取设备 `Mac` 地址的步骤。使用此功能仅允许用户录的 `MAC` 地址使用路由器。（大多数现代路由器都会提供设备列表及其 `MAC`
    地址，以允许其接入网络。） |

    | E | 为设备分配静态 IP 地址。这是另一项安全功能，可以防止未知设备进入并使用路由器。通过此功能，用户可以为他们允许的每个设备分配内部 IP 地址。
    |

    | F | 在更改密码并为路由器 WiFi 连接命名后禁用 `SSID` 广播。一个重要的安全特性是关闭其广播。如果不进行广播，没人知道它的存在。只有用户知道名称和密码，因此只有他们可以访问路由器的
    WiFi。 |

    | G | 关闭 `Ping` 返回。大多数路由器都有一个响应请求的功能，称为 `Ping`，用于识别它们是否在线。关闭此功能可以使路由器免于某些利用该功能识别攻击目标的特定互联网威胁（隐于身形）。
    |

    | H | 在路由器上启用防火墙（如果已安装）。某些现代路由器具有额外功能，例如防火墙，其功能是增加安全性以防止访问网络，因此防火墙对它们来说非常重要。 |

    | I | 开启内部安全日志。大多数情况下，路由器上的安全事件日志默认是关闭的。开启此功能以记录并提供任何安全事件或对设备的未经授权访问，以便日后审查。 |


    注意

    此表包含的信息是一个通用指南，具体步骤将取决于路由器的品牌和型号。请务必审阅制造商的安装指南以获取详情。


    完成这些步骤后，验证计算机是否可以连接到路由器和互联网。


    # 物联网 (IOT)


    物联网（`IoT`）是一个术语，用于表示所有具有唯一标识符并连接到互联网的设备。它不仅涵盖计算机，还涵盖任何可以通过互联网通信的设备。该列表在不断增长，可以包括医疗设备、工业、建筑或农业设备、家用电器和环境控制。为什么这是一种风险？首先，这些设备通常没有安全功能或安全功能非常松散。其次，这些设备正越来越多地成为生活的一部分。对于普通公众来说，它们可以包括从家用恒温器到孩子的说话娃娃，或是起搏器等任何物品。销售这些设备的供应商可能没有披露它们的安全风险。黑客已利用看似毫无价值的
    `IoT` 设备攻破了高价值目标。2018 年，一组黑客利用赌场里的鱼缸恒温器盗取了高额客户数据库。任何 `IoT` 设备都可能带来潜在的安全风险。意识到风险是变得更加安全并能够采取行动的第一步。


    ## 如何发现网络风险？


    识别网络风险有时是一项令无无措的任务。在当今世界，任何时候连接到互联网的任何设备都可能受到攻击，个人信息可能会暴露。我们中的许多人记得小时候就被告诫要小心世界潜在的危险。“不要和陌生人说话”是我们小时候听过的最常见的警告之一。这是为了帮助我们在不可预测的世界中保持安全，并避免与未知人员发生的问题。我们教导孩子“陌生人危险”的概念，并且不要从陌生人那里拿糖。


    很少有人能预料到等待我们的数字危险，特别是这些危险在婴儿潮一代成长时期并不存在。早期的 X 世代（出生于 1965 年至 1980 年之间的公民）在 20
    世纪 90 年代万维网出现并普及之前，已经是成年人、青少年或儿童。他们的父母或老师中很少有人知道如何使用电脑，更不用对不断发展的数字危险做好准备了。


    千禧一代（出生于 1981 年至 1996 年之间）面临着类似的问题，因为他们的父母中很少有人接触过数字安全的基础知识。简而言之，我们处于这样一个社会：像陌生人危险这样的实体威胁被灌输到我们脑海中，但现代社会的数字危害才开始被强调。另一个问题是，数字危害似乎在不断变化或演变。似乎随着每项新技术的创新，某些犯罪分子利用它来实现邪恶的目的。


    ## 我们的 IoT 风险是什么


    为了清楚起见，本节将从潜在风险与实际损害的角度来看待。最坏的情况是所有的 `IoT` 设备都可以被黑入并接管。如果黑客可以接管设备，他们利用这种控制可以实现什么？他们能暴露个人信息或威胁儿童的安全吗？


    风险可以被视为一个连续体，每个设备都带有与其关联的所有风险。将其考虑为用于攻击其他设备并可能控制该设备的潜在风险。该设备本身是否具有实现某些目标的内置硬件，即在监视或控制该位置的某些功能（温度、锁、空气和照明）吗？黑客的控制是否会导致设备引发电气火灾或其他损坏？`表
    2.3` 列出了人们在家庭 IoT 设备中可能发现的四种 IoT 风险等级。你可以借此了解你家中可能存在的风险。


    ### 表 2.3 IoT 风险的四个等级


    | 风险等级 | IoT 风险描述 |

    |---|---| |

    | 低风险 | 此级别涵盖不处理敏感或个人数据的 IoT 设备，它们的故障或滥用不会对个人或组织构成重大威胁。这些设备的示例包括智能家用电器、健身追踪器和环境传感器。
    |

    | 中等风险 | 这一级别的设备可能对个人和组织构成中等风险。这些设备可能会收集个人信息（如健康数据或财务信息），但对敏感数据的访问有限。这些设备被破解可能会导致个人信息暴露或服务中断。
    |

    | 高风险 | 这一级别的 IoT 设备在被攻破后具有造成重大损害或中断的潜力。它们可能访问关键基础设施或敏感数据，设备破解可能导致严重后果。高风险 IoT
    设备的示例包括医疗设备、工业控制系统和智能汽车。 |

    | 关键风险 | 这一级别的设备对个人和组织构成最高风险。它们拥有访问高度敏感数据的权限，并且对于关键基础设施（如电网、交通系统或供水系统）的运行至关重要。这些设备被破解可能会导致灾难性后果，包括大范围的服务中断和潜在的生命损失。
    |


