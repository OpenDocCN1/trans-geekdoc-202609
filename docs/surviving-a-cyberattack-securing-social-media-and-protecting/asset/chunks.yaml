    # FUTURE TRENDS


    ### IN THIS CHAPTER


    This chapter discusses future cyberconcerns and what can be done to prevent being
    a victim.


    ## PREPARING FOR THE FUTURE


    Proper preparation for surviving a cyberattack requires maintaining some awareness
    of future threats. This chapter focuses on two technologies, artificial intelligence
    (`AI`) and facial recognition, that the authors believe will increasingly be used
    to victimize the unprepared.


    ### The Basics


    Malware criminals constantly develop new viruses/worms and spyware to overcome
    a user’s protection. Chapters [2](#chapter02.xhtml) and [3](#chapter03.xhtml)
    covered the importance of keeping current on all updates. Keeping software and
    systems updated is just one aspect of being prepared. User should also consider
    keeping up with news. Both authors were victims of the 2015 United States Office
    of Personnel Management (O.P.M.) breach. The news alerted the authors of this
    breach weeks before O.P.M. officially notified us data was included. For various
    reasons, some companies must be more ethical when providing notification. Trusted
    news sources can alert users ahead of company notification. It can also be beneficial
    to regularly visit sites such as the Internet Complaint Center (`IC3`) ([https://www.ic3.gov/Home/AlertsChoice](https://www.ic3.gov/Home/AlertsChoice)),
    Krebs on Security ([https://krebsonsecurity.com](https://krebsonsecurity.com)),
    and The Kim Komando Show ([https://www.komando.com/](https://www.komando.com/))
    for cybercrime trends.


    ## Artificial Intelligence (AI)


    One of the most significant future cybercrime concerns is artificial intelligence
    (`AI`). A 2023 Presidential Executive Order on artificial intelligence provides
    the following definition:


    b) The term “artificial intelligence” or `A.I.` has the meaning outlined in 15
    U.S.C. 9401(3): a machine-based system that can, for a given set of human-defined
    objectives, make predictions, recommendations, or decisions influencing real or
    virtual environments. Artificial intelligence systems use machine- and human-based
    inputs to perceive real and virtual environments; abstract such perceptions into
    models through analysis in an automated manner; and use model inference to formulate
    options for information or action. [Executive Order 2023, 15 USC 9401: Definitions
    (b)]


    AI promises to solve all kinds of societal problems, including but not limited
    to disease cures and engineering problems. Current AI has limitations, but these
    limitations will likely be overcome with technological advances. The question
    is how quickly and whether humans control the advances or whether the AI controls
    its own advancement.


    AI promises cybercriminals, either individuals or organizations, a powerful new
    tool to commit cyberattacks and make them more effective. AI can be adopted for
    cybercrime in several ways. As a direct tool, it can be used to find errors or
    exploits in software code. It can then be used to create viruses or worms that
    exploit those exploits.

