    向读者介绍了连接互联网的风险，特别是随着物联网（IoT）设备的兴起的背景。它提供了关于风险排序和缓解风险的实用建议，并强调了正确配置路由器的重要性。本章节包含了路由器设置清单以及连接到你网络上的设备跟踪。


    ## 第 3 章](#chapter03.xhtml)：安全上网


    探索用户在访问互联网时面临的各种危害，并提供最大限度减少这些威胁的可操作步骤。它涵盖了安全浏览、管理 Cookie、使用反病毒和反间谍软件，以及通过 VPN
    和 Wi-Fi 保护连接的要点。它还澄清了隐私与安全之间重要的区别。


    ## 第 4 章](#chapter04.xhtml)：保护社交媒体


    涵盖了社交媒体平台带来的风险，并提供了在线保护个人数据的策略。从创建和维护安全密码到养成良好的安全习惯，本章为读者提供了安全导航社交媒体所需的工具。


    ## 第 5 章](#chapter05.xhtml)：保护儿童


    关注儿童在数字领域中面临的特定脆弱性。它提供了批准设备和管理相关网络风险的指南，以确保年轻用户保持安全。


    ## 第 6 章](#chapter06.xhtml)：保护成年家庭成员


    研究了照顾可能不具备处理网络威胁能力的脆弱成年人所面临的独特挑战。它提供了保护他们免受网络犯罪的策略，并概述了亲人去世后处理社交媒体的步骤。


    ## 第 7 章](#chapter07.xhtml)：在在线市场中生存


    强调了在线购物和交易的风险。提供了在现代时代穿于数字市场时如何识别威胁并保护自己的人的贴士。


    ## 第 8 章](#chapter08.xhtml)：保护小型家庭业务


    为小型家庭业务（SHBs）提供关键建议。涵盖了广泛的话题，包括防范诈骗、数据安全、社交媒体管理和员工计算机监控，帮助 SHB 所有主保护其数字资产。


    ## 第 9 章](#chapter09.xhtml)：在数字（网络）攻击中幸存


    通过回顾前面章节中的关键预防策略，让读者准备应对网络攻击，并提供关于如何在攻击中幸存和恢复的额外指导。


    ## 第 10 章](#chapter10.xhtml)：未来趋势


    讨论了数字安全的新兴趋势，并对个人和企业在持续面对新且不断演变的网络威胁时未来可能发生的情况提供了见解。


    T. Shipley


    A. Bowker


    2024 年 7 月


