    # MONITORING CHILDREN’S ONLINE ACTIVITIES


    In today’s digital age, it is crucial for parents to closely monitor their children’s
    online activities. With the vast amount of information and content available on
    the Internet, there are also risks and dangers that children may be exposed to.
    It is important for parents to be aware of where children go online and what they
    are doing in order to protect them from online scams and predators. By monitoring
    their children’s online activities, parents can better guide and educate them
    on safe Internet practices, as well as identify any red flags or warning signs
    that may indicate their child is being targeted.


    Monitoring where one’s children go and what they are doing online is only one
    of the methods to ensure others don’t take advantage of them. The other is to
    educate them on the following:


    1. Be selective when accepting friends, posting, and clicking. Don’t accept requests
    from individuals they don’t know, even those who appear to be children.

    2. Think twice before they post. Remember posts can have a very long shelf life
    and can literally be seen by anyone.

    3. Be careful where they check in from.

    4. Don’t share personal information online.

    5. Don’t send pictures to others, even if they know them. This one is harder than
    we think because kids post everything online.

    6. Be mindful of phishing scams.

    7. Don’t use social media credentials to sign into third-party sites.

    8. Avoid quizzes and games that require access to profile information.

    9. Don’t believe everything that is posted online. Verify information with multiple
    sources and check with a trusted adult about the information.

    10. Make them cautious about groups or causes they follow. Joining or following
    inappropriate groups, such as those who are racist or extremist, can impact their
    lives later in life.


    # INSTILL GOOD CELL PHONE HABITS

