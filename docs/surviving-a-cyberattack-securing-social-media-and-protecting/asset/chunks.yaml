    | B | Turn on encryption. If this function is available, consider using it to
    further harden access by users (but understand its function and how and where
    the keys are stored before implementing). |

    | C | Change the wireless network name; this is often called the `SSID`. Don’t
    use the default name. Make it unique so that it is easy to remember. This is the
    WiFi name one’s computer sees and connects to. |

    | D | Enable media access control (`MAC`) address filtering—or access control.
    You can use this function to control the devices with access to the router. A
    `MAC` address is a physical address associated with the computer’s network card
    or other device. Do a Google search to find steps to obtaining the devices’ `Mac`
    address. Using this allows only those `MAC` addresses the user enters to utilize
    the router. (Most modern routers will provide a list of the devices and their
    `MAC` addresses to allow on the network.) |

    | E | Assign static IP addresses to devices. This is another security feature
    that prevents unknown devices from entering and using the router. With this function,
    one can assign an internal IP address to each device they allow. |

    | F | Disable `SSID` broadcast after the password is changed and the WiFi connection
    for the router is named. A important security feature is to turn its broadcast
    off. If it’s not broadcasting, no one knows it’s there. Only the user knows the
    name and password, so only they can access the router’s WiFi. |

    | G | Turn off `Ping` return. Most routers have a function to respond to requests
    called a `Ping` that identifies if they are online. Turning off this function
    hides the router from certain Internet threats that are using the function to
    identify targets for attack. |

    | H | Enable a firewall on router (if installed). Some modern routers have additional
    features, such as a firewall whose function is to add security to prevent access
    to a network, therefore it’s important to them. |

    | I | Turn on the Internal security logging. Logging of security events on a router,
    in most cases, is turned off by default. Turn this function on to record and make
    any security event or unauthorized access to devices available for later review.
    |


    NOTE

    The information contained in this table is a general guide, and the steps will
    vary depending on the router’s make and model. Always review the manufacturer’s
    installation guidelines for details.


    Once these steps have been completed, verify the computer can connect to the router
    and the Internet.


    # Internet of Things (IOT)


    The Internet of Things (`IoT`) is a term adopted to denote all devices that connect
    with the Internet with unique identifiers. It covers not only computers but any
    device that can communicate via the Internet. The list is constantly growing and
    can include medical devices, industrial, construction, or farming equipment, household
    appliances and environmental controls. Why is this a risk? First, these devices
    typically have either no security or very lax security features. Second, these
    devices are becoming more and more a part of life. For the general public they
    can include anything from a home thermostat to a child’s talking doll, or a pacemaker.
    The vendors who sold these devices may not have disclosed their security risks.
    Hackers have used seemingly worthless `IoT` devices to breach high-value targets.
    In 2018, a group of hackers used a fish-tank thermostat in a casino to steal a
    high-roller database. Any `IoT` devices can pose a possible security risk. Becoming
    aware of the risks is the first step to becoming more secure and being able to
    take action.


    ## HOW DOES ONE SPOT THE CYBER RISKS?


    Identifying cyber risks can sometimes be an overwhelming task. In today’s world,
    any device connected to the Internet at any time can potentially be compromised
    and personal information can be exposed. Many of us remember being cautioned about
    our world’s potential dangers as children. The admonishment, “Don’t talk to strangers,”
    is one of the more common warnings we heard as children. It was an attempt to
    help us be safe in an unpredictable world and avoid the issues of people unknown
    to us. We taught our children the concept of “stranger danger” and don’t take
    candy from strangers.


    Few could have predicted the digital dangers awaiting us, particularly as they
    did not exist when Baby Boomers were growing up. Early Generation X, citizens
    born between 1965 and 1980, were either young adults, teenagers, or preteens before
    the Internet truly took off with the 1990s public arrival of the World Wide Web.
    Few of their parents or teachers had any idea how to use a computer, let alone
    be prepared for the developing digital dangers.


    The Millennials (born between 1981 and 1996) faced a similar problem as few of
    their parents had acquainted themselves with even the basics of digital safety.
    In short, we have a society where brick-and-mortar threats, such as stranger danger,
    were drilled into us, but the digital hazards of modern society are only now starting
    to be stressed. Another problem is that digital hazards seem to be constantly
    changing or evolving. It seems that with each new technological innovation, some
    criminal adapts it for a nefarious purpose.


    ## What Is Our IoT Risk


    For clarification this section will look at this from a risk potential versus
    actual harm. The worst-case scenario is that all `IoT` devices are capable of
    being hacked and taken over. If a hacker can take over the device, what can they
    accomplish with that control? Can they expose personal information or threaten
    children’s security?


    Risk might be viewed on a continuum, with each device having all the risks associated
    with devices attached to it. Consider it as a potential risk as a device used
    to launch an attack against another device and possibly control that device. Does
    the device itself have the built-in hardware to accomplish some objective, that
    is, spying or controlling some function at the location (temperature, locks, air,
    and lighting)? Can the hacker’s control cause the device to set an electrical
    fire or some other damage? `Table 2.3` is a list of the Four Levels of IoT Risk
    the a person may find with the IoT devices in their home. You can use this to
    understand the possible risk you have in your home.


    ### TABLE 2.3 Four Levels of IoT Risks


    | Risk Level | Description of IoT Risk |

    |---|---| |

    | Low risk | This level encompasses IoT devices that do not handle sensitive or
    personal data, and their failure or misuse does not pose a significant threat
    to individuals or organizations. Examples of these devices include smart home
    appliances, fitness trackers, and environmental sensors. |

    | Moderate risk | Devices in this level may pose a moderate risk to individuals
    and organizations. These devices may collect personal information, such as health
    data or financial information, but have limited access to sensitive data. A breach
    of these devices could result in the exposure of personal information or disruption
    of services. |

    | High risk | IoT devices at this level have the potential to cause significant
    harm or disruption if compromised. They may have access to critical infrastructure
    or sensitive data, and a breach could have severe consequences. Examples of high-risk
    IoT devices include medical devices, industrial control systems, and smart cars.
    |

    | Critical risk | Devices in this level pose the highest risk to individuals and
    organizations. They have access to highly sensitive data and are integral to the
    functioning of critical infrastructure, such as power grids, transportation systems,
    or water supply systems. A breach of these devices could have catastrophic consequences,
    including widespread disruption of services and potential loss of life. |

