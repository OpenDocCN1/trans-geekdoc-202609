- raw: 'It can also be used to find vulnerabilities in a company’s cyberdefenses and
    overcome them. Cybercriminals can also use AI to pick the best targets for their
    attacks, be they companies to exploit or the most vulnerable and/or profitable
    targets for fraud schemes.


    The law-abiding will use AI to make their software and defenses more secure. It
    then becomes an arms race of sorts with whose AI is better. The race’s winners
    will be those with the resources to obtain the best AI. Companies will often be
    up against criminal organizations sponsored by their country’s resources. The
    small business owner’s odds could be better in this battle. The options they have
    are going to be those practices we mentioned in [Chapters 8](#chapter08.xhtml)
    and [9](#chapter09.xhtml) for dealing with the aftermath. The private citizen
    likewise must be prepared to implement those practices mentioned in [Chapter 9](#chapter09.xhtml)
    for surviving an AI cyberincident of a victim entity that has their data.


    AI also provides cybercrime criminals with a powerful social-engineering tool
    to overcome a victim’s reluctance and gain their trust. It can be used to make
    phishing email/texting messages more believable. AI can generate images and videos
    that seem very real. They can fabricate pictures and videos of real individuals,
    including celebrities, to make their sales pitches more legitimate. They can convert
    images or videos of themselves, changing their age, race, and gender, and interact
    with their target in real time. It can be used to create fake voices, even in
    real time, for fraudulent phone schemes. These fake voices can even impersonate
    individuals the victim knows. It also allows one person to create multiple fake
    individuals to further sell their scheme. Not only does this make criminal social
    engineering more effective, it also further conceals their identity.


    The protections noted in this book about never forwarding anyone’s identifiers
    or banking information are the best defense. People should not invest in any scheme
    with someone they meet online, no matter how good it seems. They should make direct,
    independent contact with banks or other institutions before taking any action.


    A Cybercriminal at Work


    In the 2000s, a convicted bank robber and registered sex offender obtained a profile
    on the dating site Plenty of Fish. With this profile, he met an older female,
    gained her trust, and unlawfully obtained her credit card information. He used
    the credit card information to purchase a computer system illegally.


    With the computer, he created a fictitious business. Using the knowledge he had
    gained while in prison, creating the warden’s annual report, he created a fake
    company prospectus. Using the computer, he opened an Internet voice mail with
    different extensions. Anyone calling the number at the prompt would be presented
    with options for connecting with various departments, such as sales, engineering,
    and so on. He owned the company and was looking for investors.


    Going back online and using his Plenty of Fish profile, he presented himself as
    a business owner with a PhD degree in engineering. He connected with a different
    older female who was married. He gained her trust and got her to cash out her
    401(k) to invest in his fictitious company. The man was caught after the first
    victim reported his credit card fraud, and his scheme was detected through a review
    of his seized computer. He was sent back to prison.


    His arrest and imprisonment were all done before AI. Imagine what this one criminal
    could have accomplished had he had access to AI to commit his fraudulent activity.
    AI will change the speed at which criminals can produce a fraudulent scheme. Law
    enforcement’s challenge will be to keep up with those rapid advancements when
    criminals use AI.


    Detecting AI in Use


    There are programs to determine if AI was used, particularly for text. A simple
    Google search will reveal them. One suite of tools, Google Cloud’s Vision AI ([https://cloud.google.com/vision](https://cloud.google.com/vision))
    can be used to analyze and detect AI-created material (text, images, and videos),
    but it is not free. There are other options for those who cannot invest in such
    programs. The Better Business Bureau (B.B.B.) has tips for detecting AI use in
    text, photos, and video ([https://www.bbb.org/all/spot-a-scam/how-to-identify-ai](https://www.bbb.org/all/spot-a-scam/how-to-identify-ai))


    AI is progressing, so errors and red flags in AI-generated content will likely
    be reduced. As technology evolves, tips for identifying problematic content will
    also change. Stay vigilant against fake videos and images by fact-checking before
    believing. Consider using SIFT, a four-step process for detecting manipulation
    \[Caulfield 2019\]. The SIFT steps are: Stop, Investigate the source, Find better
    coverage, and Trace claims, quotes, and media back to the original context.


    Stop


    In Stop, the user pauses and considers their knowledge of the Web site or information
    source, their reputation for being factual, and the claim being made. If the user
    does not have that knowledge, further research on the topic is suggested. Caulfield
    \[2019\] notes:


    Second, after you begin to use the other moves, it can be easy to go down a rabbit
    hole, going off on tangents only distantly related to your original task. If you
    feel yourself getting overwhelmed in your fact-checking efforts, STOP and take
    a second to remember your purpose. If you just want to repost, read an interesting
    story, or get a high-level explanation of a concept, it’s probably good enough
    to find out whether the publication is reputable. If you are doing deep research
    of your own, you may want to chase down individual claims in a newspaper article
    and independently verify them. Please keep in mind that both sorts of investigations
    are equally useful. Quick and shallow investigations will form most of what we
    do on the Web. We get quicker with the simple stuff in part so we can spend more
    time on the stuff that matters to us. But in either case, stopping periodically
    and reevaluating our reaction or search strategy is key. (para. 7)


    Investigate the Source


    Who is presenting the information? Do they have an agenda or bias for presenting
    the information in a particular manner? Caulfield \[2019\] notes: “Taking sixty
    seconds to figure out where media is from before reading will help you decide
    if it is worth your time, and if it is, help you to understand its significance
    and trustworthiness better” (para. 11).


    Find Better Coverage


    Look for other sources of information beyond the initial reporting site. Focus
    on sites that are trusted for reporting and analysis. Develop a consensus from
    these other sources on whether the information initially presented is accurate.


    Trace claims, quotes, and media back to the original context


    Often, what is seen online has been reposted or forwarded from another site. Go
    back to where the original post was made. Tracing a claim, quote, etc., back to
    the original source can provide a sense of whether the version initially seen
    by the user was accurately presented.


    FACIAL RECOGNITION


    Facial recognition technology has evolved rapidly in recent years, enabling the
    identification and verification of individuals based on their facial features.
    This technology uses biometric data to identify individuals by analyzing their
    facial features and comparing them to a database of known faces. Its effectiveness
    has also been enhanced with AI. While it has many potential benefits, such as
    enhanced security and improved efficiency in law enforcement, it also has the
    potential to be misused by criminals. One of the most concerning ways facial recognition
    can be exploited is by stalkers and/or rapists, who could use the technology to
    identify, track, and target potential victims.


    A Stalker’s Dream'
  fmt: '

    It can also be used to find vulnerabilities in a company’s cyberdefenses and overcome
    them. Cybercriminals can also use AI to pick the best targets for their attacks,
    be they companies to exploit or the most vulnerable and/or profitable targets
    for fraud schemes.


    The law-abiding will use AI to make their software and defenses more secure. It
    then becomes an arms race of sorts with whose AI is better. The race’s winners
    will be those with the resources to obtain the best AI. Companies will often be
    up against criminal organizations sponsored by their country’s resources. The
    small business owner’s odds could be better in this battle. The options they have
    are going to be those practices we mentioned in [Chapters 8](#chapter08.xhtml)
    and [9](#chapter09.xhtml) for dealing with the aftermath. The private citizen
    likewise must be prepared to implement those practices mentioned in [Chapter 9](#chapter09.xhtml)
    for surviving an AI cyberincident of a victim entity that has their data.


    AI also provides cybercrime criminals with a powerful social-engineering tool
    to overcome a victim’s reluctance and gain their trust. It can be used to make
    phishing email/texting messages more believable. AI can generate images and videos
    that seem very real. They can fabricate pictures and videos of real individuals,
    including celebrities, to make their sales pitches more legitimate. They can convert
    images or videos of themselves, changing their age, race, and gender, and interact
    with their target in real time. It can be used to create fake voices, even in
    real time, for fraudulent phone schemes. These fake voices can even impersonate
    individuals the victim knows. It also allows one person to create multiple fake
    individuals to further sell their scheme. Not only does this make criminal social
    engineering more effective, it also further conceals their identity.


    The protections noted in this book about never forwarding anyone’s identifiers
    or banking information are the best defense. People should not invest in any scheme
    with someone they meet online, no matter how good it seems. They should make direct,
    independent contact with banks or other institutions before taking any action.


    ## A Cybercriminal at Work


    In the 2000s, a convicted bank robber and registered sex offender obtained a profile
    on the dating site Plenty of Fish. With this profile, he met an older female,
    gained her trust, and unlawfully obtained her credit card information. He used
    the credit card information to purchase a computer system illegally.


    With the computer, he created a fictitious business. Using the knowledge he had
    gained while in prison, creating the warden’s annual report, he created a fake
    company prospectus. Using the computer, he opened an Internet voice mail with
    different extensions. Anyone calling the number at the prompt would be presented
    with options for connecting with various departments, such as sales, engineering,
    and so on. He owned the company and was looking for investors.


    Going back online and using his Plenty of Fish profile, he presented himself as
    a business owner with a PhD degree in engineering. He connected with a different
    older female who was married. He gained her trust and got her to cash out her
    401(k) to invest in his fictitious company. The man was caught after the first
    victim reported his credit card fraud, and his scheme was detected through a review
    of his seized computer. He was sent back to prison.


    His arrest and imprisonment were all done before AI. Imagine what this one criminal
    could have accomplished had he had access to AI to commit his fraudulent activity.
    AI will change the speed at which criminals can produce a fraudulent scheme. Law
    enforcement’s challenge will be to keep up with those rapid advancements when
    criminals use AI.


    ## Detecting AI in Use


    There are programs to determine if AI was used, particularly for text. A simple
    Google search will reveal them. One suite of tools, Google Cloud’s Vision AI (`https://cloud.google.com/vision`)
    can be used to analyze and detect AI-created material (text, images, and videos),
    but it is not free. There are other options for those who cannot invest in such
    programs. The Better Business Bureau (B.B.B.) has tips for detecting AI use in
    text, photos, and video (`https://www.bbb.org/all/spot-a-scam/how-to-identify-ai`).


    AI is progressing, so errors and red flags in AI-generated content will likely
    be reduced. As technology evolves, tips for identifying problematic content will
    also change. Stay vigilant against fake videos and images by fact-checking before
    believing. Consider using SIFT, a four-step process for detecting manipulation
    [Caulfield 2019]. The SIFT steps are: Stop, Investigate the source, Find better
    coverage, and Trace claims, quotes, and media back to the original context.


