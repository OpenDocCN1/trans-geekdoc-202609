    仅从你操作系统的官方商店下载第三方应用程序。Android 用户使用 Google 商店，iPhone 用户使用 Apple 商店。这有助于确保应用程序经过了审核且不会是恶意软件。在下载之前对应用程序进行研究。简单的
    Google 搜索可能会向用户提供比应用商店广告更多关于该程序的信息。


    ### 3. 保持怀疑。


    互联网上的人会向手机用户发送各种奇怪的东西，例如来自陌生人的奇怪短信、奇怪的电子邮件和奇怪的电话。务必始终保持怀疑，不要轻目相信收到的个人或信息。如果用户不知道信息来自何处，请将其删除。


    ### 4. 使用双重身份验证。


    用户使用的每个应用程序都应该开启双重身份验证。如果该程序未验证你与该应用程序的连接，请保持警惕并考虑不要使用该程序。


    ### 5. 获取一个好用的密码管理器。


    手机上的密码管理器可以帮助防止重复使用同一个密码。目前有几个不错的选择。稍作研究，用户就能找到适合自己的一个。


    ### 6. 关闭旧账户。


    不要让旧账户一直开启。这是一个巨大的安全风险。


    ### 7. 在公共 Wi-Fi 上使用 VPN。


    在手机上使用 VPN，特别是当你离开家中的 Wi-Fi 网络时。


    ### 8. 注意应用程序权限。


    应用程序请求的权限太多了。注意你允许了哪些权限。如果程序请求的访问权限过多，请考虑卸载该程序。


    ## 约会及/或约友网站


    如 [`Match.com](http://Match.com) 这样的约会网站和如 `Tinder` 这样的约友网站很大程度上属于社交媒体，因为它们要求用户建立个人资料，以便在网络平台上与其他互动。约会网站的个人资料还需要电子邮件帐户。即使是这些网站中最露骨的，也有用户协议以及隐私和安全设置。它们通常允许用户免费创建个人资料，但要访问许多网站的许多功能需要按月订阅。（`Facebook`
    也有它自己的网站 `Facebook dating`，它是免费的。）许多网站还允许用户购买额外服务，例如个人资料置顶、额外的消息功能和/或购买数字礼物/代币的能力。这些网站（特别是约友网站）的一个主要区别是用户倾向于使用假名。另一个区别是用户使用这些网站的目标是从线上世界转向现实世界（约会和/或约友）。某些网站的设计仅通过其向用户提供的在线通信服务来产生收入，而不希望用户在线下见面。许多此类网站上出现的微小字体是承认该网站纯粹用于娱乐目的，用户无打算面谈。


    还记得那些西部电影中的场景吗？酒馆里的女人们一直表现得很友好，为了让牛仔们给她们买饮料，从而为酒馆赚钱？在数字领域中运行着同样的原理。个人资料保持了用户的兴趣，他们不是买饮料，而是让用户购买代币和消息，以便继续与个人资料互动。这些特定的个人资料无疑由网站而非真实个人运营，只是为了让用户购买数字商品。通常这些个人资料上会有一个小心形，标明它们是只对在线活动（特别是聊天）感兴趣的用户。


    一种诈骗者的技巧是在约会网站上与用户联系。


    等等，提供的文本在结尾有许多碎片化的句子。我将在保持核心内容的同时对提供的文本进行格式化。

