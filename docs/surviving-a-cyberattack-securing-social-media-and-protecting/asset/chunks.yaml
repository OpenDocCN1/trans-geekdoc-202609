    接下来，研究并比较不同的 VPN 服务。寻找来自信誉良好的的评价和评分，并阅读用户体验。注意速度、安全协议、用户易用性和客户支持等因素。此外，检查价格计划并选择一个符合预算的。某些
    VPN 服务提供免费试用或退款保证，这对于新手用户在承诺长期订阅之前测试服务非常有帮助。通过详尽的研究和比较不同的选项，新手互联网用户可以选择出符合其特定需求和预算的
    VPN 服务。


    考虑的最重要因素是 VPN 服务提供的安全和隐私保护水平。新手互联网用户可能不熟悉 VPN 使用的各种加密协议，因此选择一个提供强加密并遵循行业安全标准的服务非常重要。此外，某些
    VPN 供应商会记录用户活动日志，而另一些则有严格的`no-logging policy`（无日志策略）。对于新手用户，选择`no-logging VPN`
    以确保最大的隐私可能是最好的。用户可能还想考虑 VPN 服务器的位置和速度。这些会影响用户的浏览和流媒体速度。用户还可以通过`Google’s Safe Browsing
    technology` (`https://transparencyreport.google.com/safe-browsing/search?hl=en`)
    运行网站 URL，以查看该网站是否已被标记。


    # 用户的个人数据已经泄露在网上


    我们对互联网经常误解的一点是，各种网站收集的关于我们和家人的数据量。揭示个人在线上可能有多少数据最简单的方法是`Google your name`（在谷歌搜索你的名字）。找到的数据可能只是收集个人信息的公司数据库中实际存在的一小部分。互联网上可获得的用户数据收集自许多地方。如果想获得关于在线个人数据更令人可怕的体验，可以前往
    `www.spokeo.com` (http://www.spokeo.com)、`www.pipl.com` (http://www.pipl.com)
    或 `www.zabasearch.com` (http://www.zabasearch.com) 等网站并搜索你的名字。


    通常被称为`data aggregators`（数据聚合器）的公司会收集并排序我们的个人信息，以出售给他人并用于营销目的。如果你愿意支付几美元，这些数据聚合器将给你更多信息。这些数据聚合器是收集你的数据、尝试对其进行清理并将其与其他数据进行匹配，然后将这些信息出售或分发给其他数据发布者和营销人员的公司。此类数据的额外用户可能包括搜索引擎、评论网站和你的社交媒体网站。


    ## 从数据聚合器中删除个人数据


    数据聚合器是网站，从社交媒体、公共记录和其他在线平台等各种来源收集并存储大量的个人信息。这些数据随后可以出售给营销公司、广告商或其他利益方。如果某人担心自己的隐私并想从这些聚合器中删除数据，可以遵循以下步骤。


    首先，识别拥有个人信息的数据聚合器。用户可以通过进行简单的在线搜索或使用搜索引擎来做到。一旦确定了聚合器，请访问他们的网站并寻找他们的`opt-out`（退出）或`removal
    policies`（删除策略）。某些聚合器备有专门的`opt-out form`（退出表单）供用户填写，而另一些则可能要求用户直接向他们发送电子邮件。务必仔细遵循说明并提供所有必要信息，以成功删除你的数据。记录已退出的聚合器也是一个好主意，以备后参考。用户可能还会考虑使用在线隐私保护服务，这些服务可以帮助他们同时从多个聚合器中识别并删除数据。


    用户还可以访问如 `https://www.privacyrights.org/data-brokers` 等网站，获取有关这些网站的更多信息以及如何从单个网站删除其数据的途径。


    ## 罪犯如何共享用户数据？


    这是一个比较复杂的问题，需要另一本书才能很好描述。罪犯非常擅长利用技术对付我们。他们使用的这些工具通常被称为`anonymization`（匿名化）、`Dark
    Web` 或 `Dark Net`。这些工具会影响用户的浏览和流媒体速度。用户还会考虑这些工具。这些工具公开共享并出售我们的信息，例如电子邮件、密码或信用卡信息。


    这些工具最常见的工具是名为 `Tor` 的。你可以合法地在 `www.torproject.org` 找到它。它是一个工具。它是一个在**注册的非营利组织，通过捐赠资金（即使来自政府）。请记住，根据用户对个人风险和安全的评估，`Tor
    browser` 可能是一个符合其需求的工具。考虑到没有任何软件可以保证对所有恶意软件类型提供完全保护，因此养成良好的浏览习惯并定期备份重要数据作为额外的保护层至关重要。

