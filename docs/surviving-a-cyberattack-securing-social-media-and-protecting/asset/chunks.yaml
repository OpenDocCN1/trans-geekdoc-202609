    最后一个过程涉及定期检查，以确保用户的孩子没有找到绕过其设置的协议和限制的方法。其中最简单的方法是确保受限设备处于它应该所在的位置。更具侵入性的步骤可能包括检查搜索历史，可以通过浏览器的
    `History` 标签页访问。要找到此标签的位置，可以在 Google 上搜索（`Browser name` + `search history`）。检查路由器日志也是一种选择，但需要开启日志记录并了解用户路由器的操作。不要忘记询问有关孩子使用的问题，包括在用户无法控制的设备上的使用，例如在朋友家里。


    ## 识别设备上安装的程序


    在当今世界，手机应用对许多青少年和孩子来说就是一切切。不久之前，视频应用 `Vine` 曾非常流行；如今则是 `TikTok`（这在美国可能被禁用）。在 `Instagram`
    上分享个人故事和照片也很流行。许多游戏应用非常受欢迎，还有各种即时通讯应用。通常，用户在世界上的物理位置决定了他们可以使用哪些应用。作为家长，审查应用是必要的，以保护孩子免受可能导致其遭受他人伤害的技术。用户是否查看过孩子的手机并打开所有应用来查看它们是什么？某些设备带有应用，例如“`Calculator#`”，它们看起来无害，但打开应用后，人们很快就会发现应用不是计算器，而是向父母隐藏通信的手段。如果用户对设备拥有家长控制权，他们应该能够限制下载应用或安装新应用。以下是用户需要注意的应用列表，他们的孩子可能在不理解危险的情况下使用这些应用。这不是一个详尽的列表，但它可能会让你对与这些应用相关的风险/问题有一个大致的概念。表格
    5.3 反映了这些应用，没有优先级顺序。


    ### 表格 5.3 家长需要了解的问题应用


    | 应用 | 是什么种的应用？ | 为什么家长应该担心？ |

    | --- | --- | --- |

    | `Tor` 和 `I2P` | 提供对暗网的访问。 | 获取药物和其他成人材料。 |

    | `TikTok` | 用户分享个人视频。 | 在美国对色情内容的访问可能会受到限制。由于最近州级的立法变化。 |

    | `WhatsApp` | 通讯（在线电话、短信、视频聊天） | 难以控制内容。 |

    | `Kik` | 提供群组或私信。 | 供应商未设置年龄限制。供应商的消息在 48 小时后删除，难以监控。 |

    | `Snapchat` | 群组或私信、视频和照片。 | 难以监控。 |

    | `Blendr`, `Tinder`, `MeetMe`, 和 `Hot or Not` | 在线成人约会应用，允许消息以及照片和视频交换。 | 儿童可以将个人信息和图片上传到成人网站，导致与网站上的成人见面。`Hot
    or Not` 还由于“评分”系统导致网络欺凌风险。 |

    | `Calculator#` | 秘密应用 | 用于向查看孩子手机的父母隐藏通信的应用。 |


    如果用户发现可能不合适或可能危害孩子的应用，必须做出一些决定。首先，不要恐慌。研究该应用并找出它是做什么的。下载该应用并了解其社交媒体方面可能会让人开眼界。如果处于关系中，在没有先与伴侣确认的情况下进入约会应用是有问题的。用户可能想要考虑在线上关注/添加孩子的好，以进入他们的世界。不要在他们的页面上发布内容。如果发现问题，与他们交谈。利用这次对话来解决你的顾虑。


    ## 社交媒体


    由于《1998 年儿童在线隐私保护法》（[`COPPA` of 1998 [`COPPA` 1998`],]），最流行的社交网络如 `Facebook` 要求人们至少十三岁才能开户。`COPPA`是一项美国法律，禁止任何运营在线服务的组织或个人（包括社交媒体服务）在没有父母许可的情况下收集十三岁以下任何人的个人信息。为了避免父母许可的要求，这些在线服务决定直接禁止
    13 岁以下的人拥有账户。《通用数据保护条例》（`GDPR` [`European Union 2016``]）适用于覆盖欧洲的 16 岁以下成年人的在线服务，尽管取决于成员国。


    ### 监管社交媒体的各州


    2023 年，美国各州开始通过立法，要求未成年人获得父母或监护人的同意才能注册社交媒体账户。两个著名的例子是俄亥俄州和犹他州。[`Ohio 2023, Utah
    2023`]。犹他州的《社交媒体监管法》（`SMRA`）要求未成年人获得父母或监护人的同意才能开设社交媒体账户。它还要求社交公司验证用户的年龄，并允许父母监控孩子所看到的内容。该法律还规定了宵禁，防止未成年人在晚上
    10:30 到第二天早晨 6:30 之间访问其账户，除非获得父母的许可。这两个州都提起了诉讼，目前尚不清楚这些法律是否会立住，或者其他州和联邦政府是否会采取类似的措施。


    ### 特别针对未成年人的在线服务


    某些在线服务允许 13 岁以下的未成年人拥有账户，前提是获得父母的许可。正如未成年人可能会撒谎年龄以获得超出年龄要求的账户一样，捕食者也可以通过恶意手段渗透这些服务以接触用户的孩子。针对未成年人的网站并不能消除监控其使用的需要。用户必须决定孩子访问的适当年龄，以及他们希望批准哪些账户。记住，任何账户，即使是像
    `Facebook` 这样的主流服务，都可能让孩子接触到用户不希望他们在特定年龄看到的内容。


    ### 表格 5.4 儿童社交媒体隐私清单


