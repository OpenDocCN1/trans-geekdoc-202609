  trans: '


    向易感成年人提供与他们身份相似的网络犯罪受害者的真实案例，可能会有所帮助。针对老年人的最大网络犯罪之一被称为“杀猪盘”（pig butchering）。在被要求为本书对“杀猪盘”提供定义时，网络犯罪和加密货币专家
    Erin West 出了以下观点：


    杀猪盘是迄为止对财务和心理健康破坏性最大的诈骗威胁。这种犯罪源于东南亚的有组织犯罪，它结合了浪漫诈骗的传统元素，并通过强迫受害者将其全部净资产投资到一个虚假的加密货币平台来进一步升级。“杀猪盘”一词源于中文的
    `sha zu pan`，意为通过爱轰（love bombing）让受害者变肥，直到最终将其杀掉，并损失所有的钱。


    其运作方式是这样的：骗子在社交媒体平台上与受害者联系，转到加密聊天窗口，并开始为期数月的追求，在此期间，骗子会展示令人羡慕的生活方式，如奢华旅行、高端家居和车辆。他们每天会发长达
    4–5 小时的消息。受害者被误导认为找到了真爱。随后，骗子透露自己通过加密货币赚了钱，并让受害者小额投资一个由骗子控制的虚假 Web 平台。受害者看到了指数级的收益，骗子随之诱导受害者投入越来越多的资金，变卖退休金和子女的大学账户。最终，当受害者尝试提取资金时，会被要求缴纳
    25%的税费，且需要提供新资金。受害者随后会借出高利率贷款和二抵抵押贷款，结果发现整个过程都是一个骗局。大量受害者发现自己在情感上被彻底击垮，并遭受了财务完全丧失的痛苦。


    Erin West 曾在加利福尼亚州圣克拉拉县（Santa Clara County）检察官办公室担任过 25 年的副地区检察官。她被分配到地区执法联盟计算机小组（`REACT`），这是一个由
    17 个地方、州和联邦机构组成的伙伴关系，其中圣克拉拉县检察官办公室被指定为领导机构。它是加利福尼亚州 1997 年专门为打击高科技犯罪而创建的五个小组之一。[`reacttf.org/10701.htm`](http://reacttf.org/10701.htm)


    ![](img/fig6-1.jpg)


    图 6.1 用于启动杀猪盘诈骗的垃圾短信（图像由 AI 生成）。


    图 6.1 是一条通过短信收到的真实信息。这是一条典型的旨在开启对话的消息，正如 Erin West 在前文摘要中所描述的，旨在引导接收者参与进一步对话。通常会使用一张女性的照片来使这条垃圾信息看起来真实，并试图让信息的接收者放松。。


    以下真实案例摘取自美国司法部的新闻稿，证明了这些计划通常涉及多个共谋者。


    ### 四人因涉从加密货币投资诈骗中洗钱数百万美元被指控 [美国司法部 2023 年]


    洛杉矶揭开了一份包含七项指控的起诉书，指控四个人在了一项旨在洗白加密货币投资诈骗收益以及涉及数百万美元受害者资金的其他诈骗计划中扮演了涉的角色。


    法院文件指控，被告合谋开设壳公司和银行账户，以洗白加密货币投资诈骗（也称为杀猪盘）及其他诈骗计划的受害者收益。他们将资金转移到国内和国际金融机构。相关杀猪盘团伙的整个诈骗计划涉及至少
    284 笔交易，导致受害者损失超过 800 万美元。超过 2000 万美元的受害者资金直接存入了与被告相关的银行账户。


    ### 四人因针对老年人的全美技术支持诈骗被指控 [美国检察官，密苏里州东区，2024 年]


    调查于 2023 年 8 月开始，在此之前，一名 78 岁的密苏里州男子对一个声称其电脑感染了病毒的弹出消息做出了回应。受害者和他 76 岁的妻子被虚假告知，他们的银行信息已泄露，因为有人正通过电脑访问儿童色情。为了逃避刑事起诉，他们被告知支付
    88,000 美元。


    按照一系列短信中的指示，这对密苏里州夫妇收集了钱，拍了照片并将其密封在纸箱里。他们被要求等待快递员，但在快递员到达时开始产生怀疑并拒绝交钱。他们报警了警察，快递员被捕。


    指控文件显示，该快递员被支付了 `$500` 至 `$1,000` 来从受害者处提取现金，并使用伪造护照和欺骗获得的借记卡将其存入银行。随后，他提取出银行汇票发送给共谋者。


    调查人员了解到，阴谋的领导者为快递员提供了任务和指示。快递员是从大学招募的。他们利用台湾公民的名字和护照欺骗性开设金融账户。


    在 2020 年 3 月到 2023 年 7 月之间，通过该计划有约 700 万美元的汇票被存入一个银行账户。


    ### 针对全美老年人的印度计算机黑客诈骗 [美国检察官，蒙塔大纳州，2024 年]


    蒙塔大纳州的一个联邦法官判处一名印度籍人士入禁四三个月，原因是他在一项针对全美美国老年人的国际计算机黑客计划中，从卡利斯佩（Kalispell）的一位女性那里盗取了
    15 万美元，该计划导致总损失超过 120 万美元。被判的男子是一个“幻影黑客”，即那些“……层层伪装的技术支持、财务和政府身份以获取他人计算机访问权限的人”（第
    5 段）。该骗子前往海外收集受害者的钱。受害者对法的陈述揭示了这种犯罪如何在财务损失之外对受害者产生了负面影响。


    一份受害者陈述道：“感到非常受侵犯……我在情感上缩进了壳，不想以任何方式变得脆弱。我不知道现在还能安全地信任谁。我觉得完全不安全”（第 7 段）。另一位受害者写道：“我开着一辆
    2007 年的车，这笔损失让我无法买新车。生活成本不断上涨，对于靠固定收入的人来说这毫无帮助。我不确定是否还能再次获得内心的平静并信任他人”（第 8 段）。


