- raw: 'Private mode in a browser is a feature that allows users to browse the Internet
    without leaving any trace of online activity on the local device. This means that
    when using private mode, the browser will not save any browsing history, cookies,
    or temporary files on the user’s device. This makes it a great tool for those
    who are concerned about their online privacy or for those who share devices with
    others. Incognito mode is what the Chrome browser calls private browsing. Also,
    keep in mind that using the private browsing mode won’t protect one from online
    threats like phishing scams or other malware. It is also not an anonymous browsing
    tool. The user’s Internet protocol address can be revealed to a Web site when
    visiting it even using the so-called private mode.


    USING SOMEONE ELSE’S WIFI


    [Chapter 2](#chapter02.xhtml) discussed routers and WiFi and the considerations
    for securing one’s home network. What about when one is away from their home and
    using some other WiFi? How does one know that they are secure and what can be
    done about it? Accessing WiFi at a friend’s house, the local coffee shop, or some
    other local business can put a user at risk. The user doesn’t know what efforts
    they have taken to protect their network or who else may be spying on their network.
    One needs to protect their device before deciding to use these unknown WiFi networks.
    Here are some considerations:


    1.Ensure firewall software is enabled prior to accessing the unknown WiFi.


    2.Know the name of the public WiFi connection is correct. Ask an employee to be
    sure. Don’t just assume the WiFi connection one sees is the correct one. Bad actors
    can set up similar names to trap users into accessing the wrong one.


    3.Consider not using the WiFi connection if it does not ask for a username and
    a password. This is not secure. Some businesses will provide a common username
    and password to their regular customers. This is okay as it is not an open system
    with no security functions at all in place.


    4.Prior to going out, turn off the function in your laptop or iPhone that automatically
    connects to the nearest WiFi connections. A user should do the same for Bluetooth
    connections.


    5.Only connect to Web sites using the encrypted HTTPS service or SSL. This prevents
    one from possibly going to a site that may be malicious in nature. HTTPS ensures
    that communication to and from a particular Web site is secure. SSL is a form
    of encryption used by Web sites to secure communications.


    6.Use a virtual private network or VPN (See VPN section). If using social -media
    accounts, ensure they have activated two factor authentication.


    7.Turn off file and printer sharing and network discovery.


    8.Turn off WiFi if it is not being used. This can prevent any accidental connection
    and attempts to access one’s device when not at home.


    KINDS OF WIFI ATTACKS


    There are several types of WiFi attacks that a user may encounter. One common
    type is a man-in-the-middle attack (MITM), where an attacker intercepts and relays
    communication between the user and the wireless network. This allows the attacker
    to steal sensitive information such as login credentials or financial data. Another
    common attack, building on the MITM, is that a WiFi user may encounter a rogue
    access point or a fake WiFi hotspot mimicking a legitimate site. This is when
    an attacker sets up a fake wireless network in order to trick users into connecting
    to it. This allows the attacker to monitor and intercept the user’s internet traffic
    like the MITM but control all the traffic. It is important for WiFi users to be
    aware of these types of attacks and take precautions to protect themselves and
    their data.


    Identifying a WiFi Attack


    The main way a WiFi user can identify a MITM attack is by paying attention to
    the network they are connected to. If the user notices they are suddenly connected
    to a different network without their knowledge, it could be a sign of a MITM.
    Additionally, the user may notice that their Internet connection is slower than
    usual or that they are experiencing frequent disconnections. This could be a result
    of the hacker intercepting and relaying the user’s network traffic through their
    own router.


    Another way to identify a MITM is to look for any suspicious activity on the network,
    such as frequent network interruptions or slow internet speeds. This could be
    a sign of someone intercepting and redirecting the network traffic. Additionally,
    checking the security certificate of the Web site one is trying to access can
    also help identify a man-in-the-middle attack. If the certificate is not valid
    or has been changed, it is likely that someone is trying to intercept the connection.
    It is important to always be vigilant and regularly check the network and device
    settings to stay protected from such attacks. It is also important for the user
    to be wary of any pop-up messages or alerts asking for personal information or
    login credentials, as these could also be a tactic used in a MITM. If the user
    notices any strange or unexpected behavior on their network, it is important to
    disconnect and investigate further to protect against potential attacks.


    USING A VIRTUAL PRIVATE NETWORK (VPN) FOR BETTER SECURITY


    A VPN is a secure connection to another network over the Internet. It allows one
    to communicate through the Internet without bad actors or governments viewing
    your traffic. It can also be used to access region-restricted Web sites or hide
    browsing activity from snooping bad actors when on an open or publicly accessible
    Wi-Fi connection. A VPN connects the user’s device to another server somewhere
    on the Internet, which then allows one to browse the Internet using that computer’s
    Internet connection. The rest of the world then sees this computer and not the
    user. It acts as a proxy preventing anyone looking for the users from identifying
    their real location.


    How a VPN Works


    The users connect their device to a VPN using software from that company. The
    user’s device then acts as if it’s on the same local network as the VPN. The user’s
    browsing is then sent over an encrypted connection to the VPN service. One can
    connect to the Internet as if they were present at the VPN’s location. The benefits
    of using a VPN on a public Wi-Fi is that users can now not be observed locally
    and cannot have their traffic intercepted. Keep in mind the use of a VPN only
    hides the user’s traffic from observers. The VPN service sees all of the user’s
    traffic. [Figure 3.5](#chapter03.xhtml#fig3-5) describes how a VPN works.


    ![](image/fig3-5.jpg)


    FIGURE 3.5  Basic VPN description.


    Obtaining a VPN


    The simplest way to find a VPN service is to do a simple search on a search engine
    for current VPN’s. There are numerous VPN services available. Each and every VPN
    service has variation in its services and pricing. A little research will provide
    a list of compatible services for the user’s needs.


    Selecting the appropriate virtual private network (VPN) service can be overwhelming
    for novice Internet users. The first step in selecting the right VPN service is
    to understand one’s needs. Identify why a VPN is needed and what features are
    essential for the user. For instance, if the user wants to access geo-restricted
    content, then look for a VPN with a wide server network. If the user wants to
    protect their online privacy, then look for a VPN with a strict no-logs policy.
    Knowing one’s needs will help narrow down the options and make the selection process
    easier.'
