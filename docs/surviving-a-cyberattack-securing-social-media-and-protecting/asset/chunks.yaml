    dealing with certain populations, such as vulnerable adults or cybercrime victims.
    We are thankful to the following individuals’ comments and suggestions for improving
    our book: Maryum Ali, Tim Barry, Stephanie Burlison, Bonnie Burthker, Jeff Coyle,
    Julie Delaney, Anitra Merrett, Danielle Mahoney, Jack Riffle, Michael Sullivan,
    Rich Threadgill, Rachel Yokely and “Big Ashes” John Cryer, CFE, Erin West, Esq.


    | CHAPTER | 1 |


    ## CYBERSURVIVAL VERSUS SAFETY


    ### IN THIS CHAPTER


    Understanding that cybercrime is a fact in today’s world is the first step to
    understanding the need to protect oneself and family. This chapter provides up-to-date
    numbers and historical data on major cybercrime events and provides an overview
    of the cyber-risks we all face.


    Modern humans are a connected species. The Internet has made this possible, providing
    communication and information access few could have envisioned when it went commercial
    in the late 1980s. Unfortunately, our information highway also connects the world’s
    criminally inclined to countless unsuspecting and unprepared victims. Cybercrime
    impacts us all, and the odds are pretty good that individuals, including children,
    will face cybercrime attempts/acts multiple times throughout their lives. ([Figure
    1.1](#chapter01.xhtml#fig1-1))


    Many cybercrime studies are anti-malware vendor-supported and focus on the dangers
    of an unsecured personal computer, mobile phone, or device, which those vendors
    hope will translate into product sales. These are serious concerns, and one is
    foolish not to protect their devices. Nevertheless, it is naïve for people to
    believe that simple antivirus and antispyware software and firewalls will protect
    them from all the cyberdangers present in the twenty-first century. These basic
    measures are just the starting point of digital age survival.


    Significant data breaches over the last ten years, such as those experienced by
    Target (2013), Sony (2014), Anthem (2015), OPM (2015), Equifax (2017), Microsoft
    (2020), and Facebook (2021), were not attacks on individual users but on companies
    entrusted with users’ data. Once the attackers gained information, they either
    used it themselves for malicious purposes or sold it to others, who used it to
    victimize individual users via identity theft or other financial crimes.


    It would be nice to think that all individuals must do is avoid shopping, working,
    or getting services from companies that think cybersecurity is a low priority.
    How does one determine that before they are victimized, and their data is stolen?
    People could all start shopping at a store like Hee Haw’s Gordie’s General Store,
    which had no computer or Internet vulnerability, but that is not today’s reality.
    Additionally, with some organizations, there is no choice. People must deal with
    them. Of course, the organizations we are referencing are government agencies
    that have not established an impregnable cyberfortress. In 2014, the State Department,
    the White House, the National Oceanic and Atmospheric Administration, and the
    United States Postal Service joined the long list of hacked government entities.
    These pale in comparison to the 2015 breach of the Office of Personnel Management
    (OPM). This significant breach included the background information on government
    employees who applied for security clearances. Like so many others, both volume
    authors received OPM letters identifying them as data theft victims.


    ![](image/fig1-1.jpg)


    FIGURE 1.1 Number of victims of Internet crimes [FBI, 2024].


    The information in this book is advising you how to avoid victimization, not just
    from the authors’ perspective as law enforcement investigators, but from their
    own experience as victims.

