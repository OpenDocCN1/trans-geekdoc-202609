  trans: '


    它也可以用于发现公司网络防御中的漏洞并克服这些漏洞。网络犯罪分子也可以利用 AI 为其攻击选择最佳目标，无论是待剥削的公司，还是欺诈计划中最脆弱和/或利润最丰厚的目标。


    守法者将使用 AI 来使他们的软件和防御更加安全。这随后演变成某种比比谁的 AI 更优的军备竞赛。竞赛的获胜者将是那些拥有资源获取最佳 AI 的人。公司往往要与其国家资源支持的犯罪组织作斗。在这场战斗中，小型企业主的机会可能更大。他们拥有的选择将我们在第
    8 章和第 9 章中提到的处理后果的实践。同样，私人也必须准备好实施第 9 章中提到的实践，以便在拥有他们数据的受害实体发生 AI 网络事件时生存下来。


    AI 还为网络犯罪分子提供了一种强大的社会工程工具，用来克服受害者的抗拒心理并赢得他们的信任。它可以用于让钓鱼邮件/短信信息更具可信度。AI 可以生成看起来非常真实的图像和视频。他们可以伪造真实人物（包括名人）的照片和视频，以使他们的推销更加合法。他们可以转换自己的图像或视频，改变年龄、种族和性别，并与目标进行实时互动。它可以创建伪造语音（甚至是实时的），用于欺诈电话计划。这些伪造语音甚至可以冒充受害者认识的人。它还允许一个人创建多个虚假个人来进一步推销他们的计划。这不仅让犯罪社会工程变得更有效，还进一步隐藏了他们的身份。


    书中提到的关于绝不转发任何人的身份标识符或银行信息的保护措施是最佳防御。人们不应该与他们在网上结识的人投资于任何计划，无论该计划看起来有多好。在采取任何行动之前，他们应该与银行或其他机构建立直接、独立的联系。


    ## 网络犯罪分子的作案


    在 2000 年代，一名被定罪的银行劫和注册性侵犯者在 Plenty of Fish 交友网站上获得了一个简介。通过这个简介，他遇到了一位年长的女性，获得了她的信任，并非法获取了她的信用卡信息。他利用信用卡信息非法购买了一台计算机系统。


    利用这台电脑，他创建了一家虚构的企业。利用他在监狱期间创建院长年度报告时积累的知识，他创建了一份虚假公司股说明书。利用计算机，他开设了具有不同分机的互联网语音信箱。任何拨打提示号码的人都会看到连接到各个部门（如销售、工程等）的选项。他拥有这家公司并正在寻找投资者。


    回到网上并使用他的 Plenty of Fish 简介，他伪装成一个拥有工程学博士学位的企业主。他联系了另一个不同的已婚年长女性。他获得了她的信任，并让她提取出
    401(k) 退休金来投资他的虚构公司。在在第一位受害者报告其信用卡欺诈后，该男子被捕，他的计划也通过对其没收的计算机进行审查被发现。他被送回了监狱。


    他的逮捕和监禁全在 AI 出现之前。想象一下，如果这个犯罪分子可以接触 AI 来进行他的欺诈活动，他本可以取得什么样的成就。AI 将改变犯罪分子产生欺诈计划的速度。执法部门面临的挑战将是在犯罪分子使用
    AI 时跟上这些快速的进展。


    ## 检测 AI 的使用


    有一些程序可以确定是否使用了 AI，特别是针对文本。简单的 Google 搜索就能发现它们。一组工具，Google Cloud 的 Vision AI (`https://cloud.google.com/vision`）可以用于分析和检测
    AI 创建的内容（文本、图像和视频），但它不是免费的。对于那些无法投资此类程序的人，还有其他选择。商业改进局（B.B.B.）提供了检测文本、照片和视频中使用
    AI 的提示（`https://www.bbb.org/all/spot-a-scam/how-to-identify-ai`）。


    AI 正在进步，因此 AI 生成内容中的错误和红旗可能会减少。随着技术的演进，识别问题内容的提示也会发生变化。在相信之前通过事实核查对虚假视频和图像保持警惕。考虑使用
    SIFT，这是一种检测操纵的四步流程 [Caulfield 2019]。SIFT 步骤是：停止（Stop）、调查来源（Investigate the source）、寻找更好的报道（Find
    better coverage）以及将声明、引用和媒体追溯到原始语境（Trace claims, quotes, and media back to the
    original context）。


    ### 停止 (Stop)


    在“停止”步骤中，用户停下来考虑他们对该网站或信息来源的了解、其其实际性的声誉以及所提的声明。如果用户没有这些知识，建议对该主题进行进一步研究。Caulfield
    [2019] 指出：


    第二，在你开始使用其他动作后，很容易掉进“兔子洞”，偏离到与原始任务仅有遥远相关的旁上。如果你感到自己在事实核查工作中力不从心，请停止并花几秒钟记住你的目的。如果你只是想重新发布、读一个有趣的故事或获取某个概念的高层次解释，那么查明一下该出版物是否信誉良好就足够了。如果你在进行自己的深度研究，你可能想要追溯报篇文章中的单个声明并独立地验证它们。请记住，这两种调查都同样有用。快速而浅的调查将构成了我们在网上进行的大部分工作。我们处理简单事情时变得更快，部分是因为这样我们可以把更多时间花在重要的事情上。但无论哪种情况，定期停止并重新评估我们的反应或搜索策略都是关键。（para.
    7）


    ### 调查来源 (Investigate the Source)


    是谁在提供信息？他们是否有意图或偏见要以特定方式呈现信息？Caulfield [2019] 指出：“在阅读之前花六十秒弄清楚媒体的来源将有助于你判断它是否值得投入时间，如果值得，将帮助你更好地理解它的意义和可信度”（para.
    11）。


    ### 寻找更好的报道 (Find Better Coverage)


    寻找初始报道网站之外的其他信息源。关注那些在报道和分析方面受信任的网站。从这些其他来源中形成共识，判断最初呈现的信息是否准确。


    ### 将声明、引用和媒体追溯到原始语境 (Trace claims, quotes, and media back to the original context)


    通常，在网上看到的内容是从另一个网站重新发布或转发的。回到最初发布的地方。将声明、引用等追溯到原始来源，可以让你判断最初看到的版本是否经过准确呈现。


    ## 面部识别 (FACIAL RECOGNITION)


    面部识别技术在近年来发展迅速，能够根据面部特征识别并验证个人身份。该技术使用生物识别数据，通过分析面部特征并与已知脸数据库进行对比来识别个人。其有效性也得到了
    AI 的增强。虽然它有许多潜在的益处，例如增强安全和提高执法部门的效率，但它也有被犯罪分子滥用的可能性。面部识别技术被利用的最令人担忧的方式之一是被跟踪者和/或强奸犯利用，他们可以利用该技术识别、跟踪并锁定潜在受害者。


    跟踪者的梦 (A Stalker’s Dream)


