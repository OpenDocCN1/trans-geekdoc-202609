- raw: 'Cookies and other browser-tracking devices are used by marketing firms and
    Web site owners every day for legitimate purposes. They can be a privacy and security
    issue for users with an evaluated risk. Blocking and preventing the tracking of
    online behavior may be an effective strategy based on the user’s potential threats.


    6.Install/Update Browser(s)


    Browsers can be a complicated issue. There are many different browsers, and each
    has its strengths and weaknesses. Users should select a browser to match their
    risk profile and ensure it is current.


    7.Use Encryption


    Encryption is something of a mystery to many users. The choice of when to use
    encryption is really based on their threat analysis. The average user is probably
    not going to need to use encryption. But the threat level determined in a user’s
    evaluation will dictate those requirements. Keep in mind that the successful use
    of encryption depends on many factors. Is the data at rest (stored on a hard drive)
    or being sent in an email communication? Each has different requirements and impacts
    the effectiveness of encryption’s use.


    8.Use a Secured Computer


    A secure computer is one that user has identified the risk to it and then accomplished
    the steps necessary to positively secure that same device.


    9.Maintain Updates


    Keeping a device secure is a continual process. Once the system is secured, based
    on the technology and understanding at the moment doesn’t mean it will be secured
    next month or even tomorrow. Keeping the operating system, the router, browsers,
    and the other software current is a critical and ongoing function. [Figure 3.1](#chapter03.xhtml#fig3-1)
    gives you a visual outline of the considerations listed above when setting up
    a computer for your home use.


    ![](image/fig3-1.jpg)


    FIGURE 3.1  Considerations when setting up a computer.


    EVALUATING THE USER’S INTERNET RISK


    In today’s digital age the Internet has become an integral part of everyone’s
    daily lives. People use it for everything from connecting with friends and family
    to shopping and banking. The convenience and accessibility that the Internet provides
    comes with risks. It is important for users to evaluate those risks and take necessary
    precautions to protect their personal information.


    The risks can include data posted online from various data breaches, online scams
    of which there are many, and the traditional threat of identity theft. It is essential
    to be aware of potential threats and be cautious when sharing personal information
    online. This can include using secure and trusted Web sites, regularly changing
    passwords, and being mindful of what information is being shared on social media.
    It is also important to be aware of who has access to personal data, including
    search engines and data aggregators. By evaluating risks and taking proactive
    measures, a user can better protect their personal information and enjoy a safer
    online experience. Once the user has risk awareness, they can take steps to minimize
    the threats. This can include the basics of using strong and unique passwords,
    being cautious of what information they share online, and regularly monitoring
    their accounts for any suspicious activity. It is also important to stay updated
    on security measures and potential threats by keeping informed on online safety
    practices. By evaluating Internet risks, the user can better protect themselves
    and their personal information while using the vast resources and connections
    that the Internet provides.


    Going on the Internet is not just using the World Wide Web. Being on the Internet
    exposes users to various risks. It is important to be aware of these risks and
    take precautionary measures to protect personal information. One main risk is
    the data collected by search engines. Search engines store a user’s search history
    and personal information. This data is sold and used for targeted advertising.
    The data sold to third parties is often done without a user’s knowledge or consent.
    These data aggregators collect and sell personal and company data to various other
    companies. The data is used to define a user’s buying behavior and makes it easier
    for data collectors to track their online activities. Moreover, hackers and other
    technology thieves pose a significant threat as they gain illegal access to a
    user’s sensitive data through phishing scams, malware, or by exploiting vulnerabilities
    in user’s devices and the systems storing their data.


    THE OTHER RISKS A USER NEEDS TO KNOW


    There is a whole slew of risks users may not have known about. They are also threats
    to user’s personal information that they have little control over. These include
    a user’s doctors, government agencies, and businesses they shop with online or
    in person. Many users don’t even know as they are online associates with companies
    like eBay, Amazon, or Walmart.


    Steps to Protect Personal Information (PI)


    In today’s world, there is nothing a user can do to guarantee protection of their
    personal data, but there are steps that can be taken to help prevent its misuse.
    Here are some of the steps users need to consider.


    1.At home/office. We throw away a lot of material that has PI on it. One’s garbage
    is full of it. Old-school hackers frequently used “dumpster diving” to locate
    PI and other sensitive information for later malicious use. Consider this when
    throwing away mail, pill bottles, and doctor instructions. Just like one does
    with recycling, consider making a separate destruction box for these things that
    need to be securely destroyed by shredding, tearing up, or burning if permitted
    in one’s community. Consider hiring a service to securely destroy items that contain
    PI.


    2.Two-Factor and multifactor authentication. This adds an extra layer of security
    to a user’s accounts by requiring a code or token in addition to their password.
    This can help prevent unauthorized access to accounts, even if someone has obtained
    the user’s password. Smart phones also use authenticator apps. These are used
    to generate a one-time use code that is only known by the app and the Web site
    being accessed. [Figure 3.4](#chapter03.xhtml#fig3-4) describes how the basics
    of two-factor authentication works.


    3.Avoid using public Wi-Fi for sensitive activities. Public Wi-Fi networks are
    often unsecure, making it easy for hackers to intercept a user’s data. Avoid using
    public Wi-Fi for activities that require a user to enter sensitive information,
    such as online banking or shopping. This is of course unless a user has employed
    a VPN as previously described.


    4.Be wary of suspicious emails and messages. Phishing scams are one of the most
    common methods used by hackers to obtain personal information. Be cautious of
    emails and messages asking for personal information or directing a user to click
    on suspicious links or open a document that wasn’t requested. When in doubt, contact
    the sender or company using verified contact information (not the information
    provided in the message) to insure it is a legitimate request. A user can also
    look at the sender’s email address to see if it is legitimate.


    5.Users should regularly monitor their accounts and credit. Make it a habit to
    regularly check bank and credit card statements for any unauthorized charges.
    A user can also check their credit report for any suspicious activity. If a user
    notices any discrepancies, they should report them immediately. Opening accounts
    with the credit reporting agencies can also be a good tool for observing when
    changes to accounts are made. If one is concerned about their personal information
    being used to open new accounts, they can consider freezing their credit. This
    will prevent anyone from opening new credit accounts in a user’s name.'
