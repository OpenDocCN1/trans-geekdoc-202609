    [https://anti-fraud.ec.europa.eu/olaf-and-you/report-fraud/](https://anti-fraud.ec.europa.eu/olaf-and-you/report-fraud/)
    |

    | Israel | Cybercrime: [https://www.gov.il/en/departments/general/contact#:~:text=Computer%20Emergency%20Response%20Center%20(CERT,119%20%7C%20Israel%20National%20Cyber%20Directorate](https://www.gov.il/en/departments/general/contact#:~:text=Computer%20Emergency%20Response%20Center%20(CERT,119%20%7C%20Israel%20National%20Cyber%20Directorate))br>Identity
    Theft: [https://www.btl.gov.il/English%20Homepage/stations/Call%20Centers/Pages/reporting-fraud.aspx](https://www.btl.gov.il/English%20Homepage/stations/Call%20Centers/Pages/reporting-fraud.aspx)
    |

