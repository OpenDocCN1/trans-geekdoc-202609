- raw: 'The best current parenting advice is to have a routine of making the child
    plug the phones, tablets, and computers into charge at night in a common area.
    No sleeping with the devices. This is tough; failure is inevitable without coparent
    discipline on this issue. There is no reason for kids to go to bed with a cell
    phone. Consider adding language to the home technology user agreement about cell
    phone usage, including no usage after bedtime, no usage at the dinner table at
    home, or in a restaurant, and where the device is to be maintained after bedtime.
    [Table 5.6](#chapter05.xhtml#tab5-6) is provided as a checklist for parents to
    guide them with your children''s use of cellular telephones. Again, watching over
    our children is a complicated and ongoing issue. Cellular telephones today are
    small computers that provide children with connections around the world. This
    checklist is intended to provide some considerations for helping parents educate
    their children with the safety concepts required to prevent them from becoming
    a victim on their phones.


    TABLE 5.6  Parent Checklist for Monitoring Children Online


    |  || Item to address || Completed |


    | --- | --- | --- |


    | 1. || Set rules and boundaries for Internet usage, including time limits and
    guidelines for appropriate content. ||  |


    | 2. || Consider installing parental control software to restrict access to certain
    Web sites or content. ||  |


    | 3. || Regularly check the browser history to see which Web sites your child
    has been For cell phones also randomly check text messages and contacts to see
    who they are messaging and about what subjects. ||  |


    | 4. || Talk to your child about the potential dangers of sharing personal information
    online. ||  |


    | 5. || Teach your child to never click on suspicious links or pop-ups. ||  |


    | 6. || Monitor your child’s social media accounts and set privacy settings to
    limit who can see their posts. ||  |


    | 7. || Teach your child to use strong and unique passwords for their online accounts.
    ||  |


    | 8. || Encourage your child to communicate to you or a trusted adult if they
    encounter something online that makes them uncomfortable. ||  |


    | 9. || Regularly review your child’s contacts, friend lists and groups they join
    on social media platforms. ||  |


    | 10. || Keep communication lines open with your child and have frequent discussions
    about their online activities. ||  |


    RED FLAGS TO LOOK OUT FOR WITH CHILDREN


    Make sure children know that they can talk to the parent and especially show any
    bad behavior they observe or is directed toward them. It is easier to intervene
    and help them through the situation than after something horrid has occurred.
    When they do not talk to us, we have to look for signs that they are being abused
    by someone online. [Table 5.7](#chapter05.xhtml#tab5-7) provides a noninclusive
    list of possible common red flags that children might exhibit if they have experienced
    online abuse.


    TABLE 5.7  Warning Red Flags with Your Children


    |  || Red flag || Constantly observing for |


    | --- | --- | --- |


    | 1. || Your child is spending more time than usual online, texting, gaming, or
    using social media apps. ||  |


    | 2. || Or, your child is spending a lot less time than usual online, texting,
    gaming or using social media apps. ||  |


    | 3. || Being secretive (more than normal) about:  ■to whom they are talking■what
    they’re doing online■what they are doing on their smart phone■hiding their smart
    phone ||  |


    | 4. || Suddenly blocking you (or other family members) on social media. ||  |


    | 5. || Your child seems distraught (even angry or fearful) or distant from you
    other family and friends after being on social media, texting, or emailing. ||  |


    | 6. || The sudden appearance on their smart phone, laptop, or tablet of:  ■new
    phone numbers■new text messages■new email addresses■new communication apps ||  |


    | 7. || There is a sudden change in behavior toward school and favorite activities.
    ||  |


    | 8. || Your child isolates from family and friends. ||  |


    | 9. || You notice changes in your child’s eating, sleeping, and/or spending patterns
    or habits. ||  |


    | 10. || There are instances of self-harm, such as cutting themselves and/or suicidal
    ideations. ||  |


    The parent knows their child best. If they do come to you with an issue from something
    that occurred online, listen, encourage them that they have done the correct thing
    and take them seriously. Depending on what has occurred, notifying the proper
    authorities can be warranted. The social media platform might be contacted to
    address any ongoing abuse. Keep in mind that all the social media platforms will
    have a different procedure and that procedure might include contacting the offender.
    Weigh carefully whether to contact the social media company before contacting
    law enforcement. It is never a good idea to contact the offending person. Leave
    that to law enforcement.


    Additional Considerations


    Juvenile sexting entails youths sending or posting sexually suggestive text messages
    and images, including nude or seminude photographs, via cellular telephones or
    over the Internet. \[Bowker and Sullivan 2010\] Pornographic images of minors,
    even if taken by the minor themselves, are illegal. Minors who send such images
    can leave a digital trail that comes back to a parent or guardian as they are
    the Internet account holder. Anyone who has possession of such contraband images
    can face legal consequences. For this reason, parents or legal guardians who detect
    such images should seek legal guidance.


    CONCLUSION


    Technology has changed how we view the security of our children. This chapter
    provided guidance on how to protect our children when they use technology. Whether
    it’s computers, smartphones, or social media, we need to protect our children
    from the possible evils they may encounter. [Chapter 6](#chapter06.xhtml) will
    discuss how we can protect vulnerable adults who may not understand technology,
    or the risks associated with going online.


    REFERENCES


    Bowker, A., and Sullivan, M. “Sexting: Risky actions and overreactions.” FBI Law
    Enforcement Bulletin, July 1, 2010. [https://leb.fbi.gov/articles/featured-articles/sexting-risky-actions-and-overreactions](https://leb.fbi.gov/articles/featured-articles/sexting-risky-actions-and-overreactions)


    Children’s Online Privacy Protection Act of 1998, 15 U.S.C. 6501–6505. [https://www.ftc.gov/legal-library/browse/rules/childrens-online-privacy-protection-rule-coppa](https://www.ftc.gov/legal-library/browse/rules/childrens-online-privacy-protection-rule-coppa)


    European Union. 2016\. Regulation (EU) 2016/679 of the European Parliament and
    of the Council of 27 April 2016 on the protection of natural persons with regard
    to the processing of personal data and on the free movement of such data, and
    repealing Directive 95/46/EC (General Data Protection Regulation). Official Journal
    of the European Union, L 119/1. [https://eur-lex.europa.eu/eli/reg/2016/679/oj](https://eur-lex.europa.eu/eli/reg/2016/679/oj)


    The National Center for Missing & Exploited Children. 2024\. “No escape room launches
    with new data.” NCMEC Blog, April 16, 2024. [https://www.missingkids.org/blog/2024/no-escape-room-launches-with-interactive-experience](https://www.missingkids.org/blog/2024/no-escape-room-launches-with-interactive-experience)


    Ohio Legislature. 2023\. The Parental Notification by Social Media Operators Act.
    [https://codes.ohio.gov/assets/laws/revised-code/authenticated/13/1349/1349.09/10-3-2023/1349.09-10-3-2023.pdf](https://codes.ohio.gov/assets/laws/revised-code/authenticated/13/1349/1349.09/10-3-2023/1349.09-10-3-2023.pdf)


    Utah Legislature. 2023\. Social Media Regulation Act (SMRA). [https://le.utah.gov/~2023/bills/static/SB0152.html](https://le.utah.gov/~2023/bills/static/SB0152.html)


