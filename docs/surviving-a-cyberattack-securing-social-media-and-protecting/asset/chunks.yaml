- raw: 'This chapter discusses the risks of connecting to the Internet and provides
    suggestions for ranking those risks particularly as they relate to Internet of
    Things (IoT) devices. The key to mitigating those risks, the use of a properly
    configured router, is also covered. Additionally, included are checklists for
    router configuration and documenting the devices that connect to the Internet.


    CONNECTING TO THE INTERNET


    Ease of use is how devices are valued. Users expect things to be simple to operate
    and want them to work the first time without much tinkering. Computer advances
    have historically strived toward simplicity. An example is the graphical user
    interface (GUI) that allows users to operate a computer without typing commands.
    Plug and play also allows a new device to start working immediately when connected
    to a computer. Simplicity is built into today’s technology. Simplicity comes with
    a hidden cost, namely security.


    Today, Internet access requires two things: a device (laptop, desktop, tablet,
    cell phone, etc.) and an Internet service provider(s) (ISP). It is simple. Internet
    access in this manner is like freeway driving with no brakes and no seat belt.
    This chapter will discuss how devices connect to the Internet, the associated
    risks, and how to prioritize security.


    EARLY COMPUTER CONNECTIVITY


    Initially, computers and all their associated devices were connected via cables
    or lines. These devices included mice, keyboards, printers, scanners, and, once
    upon a time, a modem. The modem was connected to the Internet via a phone line,
    and in turn was connected to the computer via another cable. If the home user
    didn’t have a modem, their computer couldn’t connect to the Internet.


    In the business setting, things were a bit more complex. Computers often connected
    to other computers, some of which were called routers, and acted as communication
    traffic cops. The more tech-savvy home user had a router, particularly if they
    had more than one computer in their home network. Routers will be discussed in
    more detail later, but their functionality allows several computers to “share”
    another device, such as a printer or modem. Early Internet connections, even in
    the business and home network setting, required a modem to connect to the Internet.


    In the late 1990s, modem functions moved from an external device to an internal
    computer component. Users plugged their phone line directly into a “port” on a
    computer to have Internet access. ISPs began expanding the types of service offered
    beyond “dial-up,” such as digital subscription lines (DSL) and cable. These additional
    service types did not require an outside modem but merely plugged into a computer
    via a “converter” and then into a computer port. Those remaining dial-up ISPs
    were accessed by the telephone line plugging directly into a computer port. External
    devices, such as printers, scanners, and routers, still required cables connected
    directly to a computer in order to function.


    In the early 2000s, wireless arrived on the scene ([Figure 2.1](#chapter02.xhtml#fig2-1)).
    No longer did a computer have a wire connecting it directly to a device, such
    as a printer. Computers could connect to a modem via radio waves or a Wi-Fi router.
    A wireless router is still connected to the user’s Internet connection via dial-up,
    DSL, or cable ISP via a line. Even that was to change. Starting with cell phones,
    computers could go online via a wireless ISP. Wires became a thing of the past.


    ![](image/fig2-1.jpg)


    FIGURE 2.1  Wireless access.


    During the transition to wireless connections, the ISPs came up with a device
    that combined modem functions with that of a router. This combination modem router
    allowed numerous computers in the home to connect to the Internet through one
    connection. This provided the home user with immediate access to the Internet
    from any device they allowed to communicate to their combination modem/router.
    These new devices were built to facilitate worry-free connecting for the typical
    home user, however, built-in security measures were lax. Additionally, the home
    user has limited access to modify the device’s settings to enhance security. Some
    devices have the access code fixed to the device’s bottom. Any visitor to the
    home, such as a repair person, babysitter, and so on, needs only to turn over
    the device and take a picture of it, and they have the access code required to
    get on the wireless network. Additionally, ISP providers don’t always keep up
    with security updates and patches on these devices, making them vulnerable to
    hackers. Just such a vulnerability was discovered in AT&T’s DirecTV Linksys wireless
    video bridge \[Whittaker 2017\]. Home security of these devices continues to be
    an issue. (See [Figure 2.2](#chapter02.xhtml#fig2-2).)


    ![](image/fig2-2.jpg)


    FIGURE 2.2  Conceptualizing how routers work.


    THE ROUTER IS THE GUARDIAN


    As previously discussed, routers are like communication traffic cops due to their
    ability to share network resources (communications) with other devices. They do
    much more than that. They provide an additional layer of defense between your
    computer(s) and hackers.


    For a device to connect to the Internet, it needs a unique Internet protocol (IP)
    address, which an ISP supplies. That IP address is provided to other computers
    during activities such as sending emails, browsing, and so on. If one does not
    use a router, that IP address becomes a direct connection for an attacker. In
    a real sense, it is like providing an unpublished telephone number to someone
    so they can harass the person on the other end at will.


    Routers are the first line of defense. An attacker must bypass the router before
    they can even start attacking a computer(s). Routers use the same IP address provided
    by the ISP to connect to the Internet. It “filters” communications to computer
    devices under its protection by providing local IP addresses, which are not visible
    to the Internet. Communication comes into the router, which decides which device
    should receive it, and then forwards it based on the local IP address it assigned.
    A properly configured router does not broadcast these local IP addresses or how
    many devices it serves.


    Compare it to an old-time switchboard operator at a hotel. Incoming callers are
    never told who is staying in which room. The “call” goes to the router (switchboard
    operator), who then forwards it to its intended recipient (room) based upon rules
    for such communication; for instance, no calls forwarded after 9:00 p.m. If the
    communication is deemed a threat or not allowed, the router does not forward it
    to the device.


    Routers frequently have firewalls that restrict incoming as well as outgoing communication.
    Others have firewalls that control communication between devices on the network.
    In this way, a compromised device, such as a printer, could not be used to gain
    control of another device, such as a computer.


    Routers can also provide parental controls or restrictions for certain devices.
    These controls can include the inability to access the Internet during certain
    times or prohibitions against specific Web sites or Web pages with text that violates
    certain standards (explicit language or too much profanity).


    Some routers support virtual private networks (VPN), which allow users to connect
    to specific networks remotely, such as a home user connecting remotely to their
    business network. Routers also monitor network usage and can send email or text
    alerts when something starts to go look suspicious. In this way, your router becomes
    an early warning system for trouble.


    THE FIRST LINE OF DEFENSE'
