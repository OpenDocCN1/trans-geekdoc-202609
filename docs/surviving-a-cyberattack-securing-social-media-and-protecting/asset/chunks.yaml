    ## PERSONAL CYBER INSURANCE


    A cyber insurance policy can provide reimbursement for the costs associated with
    the theft of digital information. Deciding if this kind of insurance is needed
    depends on what the user thinks the loss of their personal information can mean
    to them. A simple search on a favorite search engine can find the few companies
    offering this kind of insurance. These kinds of insurance can offer a homeowner
    the following coverages: personal, extortion, or fraud.


    - **Personal protection coverage**: Protects against the financial costs of personal
    online attacks.

    - **Cyber extortion**: Protects when online criminals threaten to expose personal
    data, photographs, or messages in return for a ransom of money or cryptocurrency.

    - **Cyber financial loss**: Protects when a fraud of some kind occurs against
    the victim, such as fraudulent use of credit cards or identity theft.

    - **Data breach**: Protects when personal data entrusted to the user is lost,
    stolen, or published, such as volunteer nonprofit data or small business credit
    card information from buyers, a thumb drive, or personal computing device is stolen.


    ## CONCLUSION


    This chapter covers a lot of information on what to do to survive a cyberattack.
    This is sometimes a complex and difficult task. With the things covered in this
    chapter and in other chapters of this book, the user should be able to limit the
    damage from the attack and work on recovery. [Chapter 10](#chapter10.xhtml) discusses
    what the future may hold.


    ## REFERENCES


    Federal Bureau of Investigation. n.d. “How to Respond and Report.” Ransomware.
    FBI, n.d. [https://www.fbi.gov/scams-and-safety/common-scams-and-crimes/ransomware](https://www.fbi.gov/scams-and-safety/common-scams-and-crimes/ransomware)


    | CHAPTER | 10 |

