    # Financial and Reporting Procedures


    1. **Contact financial institutions**: As soon as identity theft or fraud is suspected,
    contact banks, credit card companies, and other financial institutions. Inform
    them about the suspicious activity and ask them to freeze accounts to prevent
    further unauthorized transactions.


    2. **File a report with the authorities**: File a report with the local police
    department or appropriate agency. (See [Table 6.7](#chapter06.xhtml#tab6-7) for
    US residents and [Table 6.8](#chapter06.xhtml#tab6-8) for outside the United States).
    This will help create an official record of the incident and may be necessary
    for future steps, such as disputing fraudulent charges or for insurance purposes.


    3. **Review credit report**: Request a copy of a credit report from one of the
    major credit bureaus. [Chapter 9](#chapter09.xhtml) contains the contacts for
    Equifax, Experian, or TransUnion as well as for those credit bureaus outside the
    United States. Review the report carefully for any unauthorized accounts or inquiries.
    If any discrepancies are detected dispute them with the credit bureau.


    4. **Monitor your accounts and credit**: It is important to monitor bank and credit
    card statements regularly for any unfamiliar charges or transactions. Consider
    placing a fraud alert or credit freeze on credit reports to prevent new accounts
    from being opened in your name without your knowledge. Consider signing up for
    a credit monitoring service to receive alerts on any suspicious activity on the
    credit report.


    ## REPORT TO THE PROPER AUTHORITIES


    Reporting cyberschemes can help prevent others from falling victim to the same
    scam and can also aid in the investigation and prosecution of scammers. It is
    important to take swift action when someone has been targeted by a scam and to
    report it to the proper authorities. [Table 6.6](#chapter06.xhtml#tab6-6) provides
    the steps to reporting an on-line crime to law enforcement. Review these steps
    if you or your loved one become a victim.


    ### TABLE 6.6 Reporting Scams to the Authorities


    | Step | Description |

    | :--- | :--- |

    | Gather all necessary information | Before reporting a scam, it is important
    to have all the relevant details about the scammer and the scam itself. This includes
    any communication or documentation received, as well as the name, contact information,
    and any other identifying information of the scammer. |

    | Contact the appropriate authorities | If the scam involves financial fraud,
    contact the local police department. In the United States also report it to the
    Federal Trade Commission (FTC) or the Consumer Financial Protection Bureau (CFPB).
    If it is an online scam, report it to the Internet Crime Complaint Center (IC3).
    For scams related to identity theft, contact the Federal Trade Commission (FTC)
    or the Social Security Administration (SSA). For cases involving federal tax refunds
    schemes contact the Internal Revenue Service (IRS). |

    | File a report | Most of these authorities have online complaint forms that can
    be filled out to report the scam. These forms usually ask for the details of the
    scam, the scammer’s information, and contact information. Make sure to provide
    as much detail as possible in the report. |

    | Follow up | After filing a report, it is important to follow up with the authorities
    to ensure that the report has been received and that they are taking appropriate
    action. Ask for a case or reference number for the report, which will help track
    the progress of the investigation. |

    | Report to the relevant financial institution | If the scam involved a fraudulent
    transaction on a credit or debit card, report it to the bank or credit card company
    immediately. They may be able to reverse the transaction and prevent further fraudulent
    charges. |

    | Inform others | Scammers often target multiple victims, so it is important to
    warn others about the scam. Report the scam to consumer protection agencies, sharing
    the experience on social media, or write reviews on Web sites that track scams
    and frauds. |

    | Be cautious of follow-up scams | After reporting a scam, the victim may receive
    follow-up calls or emails from scammers pretending to be from the authorities.
    They may ask for more personal information or money to help resolve the scam.
    Be cautious of these follow-up scams and always verify the legitimacy of the contacting
    person. |

    | Place fraud alerts through all the credit reporting agencies and ask for credit
    reports. | See [Chapter 9](#chapter09.xhtml) for a discussion on credit monitoring
    versus freezing and the associated tables for listing of credit bureaus. |


    ### TABLE 6.7 Reporting Cybercrimes in the United States


    | Local/State |

    | :--- |

    | Google Search: Local Police or Sheriff’s Department – `[city/town name] + Police
    Department` (ex: Cleveland, Ohio Police Department) |

    | Google Search: State Attorney General’s Office – `[state name] + Attorney General’s
    Office` (e.g., Nevada Attorney General’s Office) |

    | Federal | |

    | Consumer Financial Protection Bureau (CFPB) | [https://www.consumerfinance.gov/complaint/](https://www.consumerfinance.gov/complaint/)
    |

    | Federal Bureau of Investigation (FBI) Internet Crime Complaint Center (IC3)
    | [https://www.ic3.gov/](https://www.ic3.gov/) |

    | Federal Trade Commission (FTC) | [https://reportfraud.ftc.gov/#/](https://reportfraud.ftc.gov/#/)
    |

    | Internal Revenue Service | [https://www.irs.gov/identity-theft-central](https://www.irs.gov/identity-theft-central)
    |

    | Medicare Fraud | [https://www.medicare.gov/basics/reporting-medicare-fraud-and-abuse](https://www.medicare.gov/basics/reporting-medicare-fraud-and-abuse)
    |

    | Social Security Administration | [https://www.ssa.gov/](https://www.ssa.gov/)
    |

    | U.S. Postal Inspection Service (USPIS) | [https://www.uspis.gov/](https://www.uspis.gov/)
    |


    ### TABLE 6.8 Reporting Cybercrimes Outside the United States


    Reporting mechanisms vary from one country to another. Some countries have a dedicated
    online option and others advise the party to go to their local police department.


    | Country | Details |

