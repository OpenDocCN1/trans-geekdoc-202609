  trans: '


    目前最好的育儿建议是建立一种常规惯例：让孩子在晚上将手机、平板电脑和电脑连接到公共区域进行充电。不要把设备带上睡觉。这很困难；如果父母双方在这一问题上没有达成统一的纪律，失败是不可避免的。孩子没有理由带着手机上床。考虑在家庭技术用户协议中增加关于手机使用的条款，包括睡寝时间后不准使用、在家里餐桌上或餐厅内不准使用，以及睡寝后设备应存放在何处。查表
    5.6 提供了一份清单，帮助父母指导孩子使用手机。再次，看护孩子是一个复杂且持续的问题。如今的手机手机是微型计算机，为孩子们提供了与全球的连接。该清单旨在为父母提供一些建议，帮助他们教育孩子掌握安全概念，防止他们成为手机世界的受害者。


    ### 表格 5.6 父母监控孩子上网清单


    | | 待解决事项 | 已完成 |

    | --- | --- | --- |

    | 1. | 为上网使用设定规则和边界，包括时间限制和适当内容指南。 | |

    | 2. | 考虑安装家长控制软件，以限制对某些网站或内容的访问。 | |

    | 3. | 定期检查浏览器历史，查看孩子访问了哪些网站。对于手机，还要随机检查短信和联系人，查看他们正在给给谁发信息以及关于什么的话题。 | |

    | 4. | 与孩子谈论在网上分享个人信息的潜在危险。 | |

    | 5. | 教导孩子永远不要点击可疑的链接或弹出窗口。 | |

    | 6. | 监控孩子的社交媒体账号，并设置隐私设置以限制谁可以看到他们的帖子。 | |

    | 7. | 教导孩子为他们的在线账户使用强且唯一的密码。 | |

    | 8. | 鼓励孩子在网上遇到让他们感到不适的内容时，向你或信任的成年人沟通。 | |

    | 9. | 定期查看孩子的联系人、朋友列表以及他们在社交媒体平台上加入的群组。 | |

    | 10. | 与孩子保持沟通畅通，并对他们的在线活动进行频繁讨论。 | |


    ### 孩子身上需要警惕的红信号


    确保孩子知道他们可以和父母交流，特别是要展示他们观察到的或针对他们的任何不良行为。在可怕的事情发生之前干预并帮助他们度过困境要比事后容易得多。当他们不和我们交流时，我们必须寻找他们是否被他人在线虐待的迹象。查表
    5.7 列出了孩子在经历在线虐待后可能表现出的常见红信号非完全列表。


    ### 表格 5.7 孩子身上的警示红信号


    | | 红信号 | 持续关注项 |

    | --- | --- | --- |

    | 1. | 你的孩子在网上、发短信、游戏或使用社交媒体应用花费的时间比平时多。 | |

    | 2. | 或者，你的孩子在网上、发短信、游戏或使用社交媒体应用花费的时间比平时少得多。 | |

    | 3. | 对以下内容表现得比比常更保密：■他们在和谁说话■■他们在网上在做什么■■他们在智能手机上在做什么■■隐藏智能手机■ | |

    | 4. | 突然在社交媒体上拉黑你（或其他家庭成员）。 | |

    | 5. | 你的孩子在玩社交媒体、发短信或发邮件后，显得心烦意乱（即使是愤怒或恐惧）或与你及家庭朋友疏远。 | |

    | 6. | 他们的智能手机、笔记本电脑或平板上突然出现：■新电话号码■新短信■新电子邮箱地址■新通信应用■ | |

    | 7. | 对学校和喜欢的活动行为发生了突然变化。 | |

    | 8. | 你的孩子孤立了家人和朋友。 | |

    | 9. | 你注意到孩子在饮食、睡眠和/或消费模式或习惯上发生了变化。 | |

    | 10. | 出现自残行为，例如割伤自己和/或自杀念头。 | |


    父母最了解自己的孩子。如果他们真的来找你，说明他们信任你。如果（此处原文逻辑较乱）他们遭遇了在线虐待……


    （注：参考文献部分未根据原文的逻辑完整性进行翻译）


