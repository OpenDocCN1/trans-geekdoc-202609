- raw: "Closing social media accounts after a family member’s death may seem like\
    \ a cold and impersonal task, but it is essential to address the emotional aspect\
    \ of it. Social media has become a platform for people to express their thoughts,\
    \ feelings, and memories. For the deceased, their social media accounts serve\
    \ as a digital representation of their life. Therefore, it is essential to handle\
    \ these accounts with sensitivity and respect. It is also crucial to highlight\
    \ the importance of removing personal information and photos from the deceased’s\
    \ social media accounts. These accounts hold a wealth of personal data that should\
    \ not be left unattended. Not only can it be used for malicious purposes, but\
    \ it also goes against the deceased’s right to privacy. Therefore, it is essential\
    \ to take the necessary steps to protect their identity and reputation. Aside\
    \ from the practical reasons for closing a deceased family member’s social media\
    \ account, there is also an emotional aspect to consider. Social media can be\
    \ a way to keep memories alive, and the thought of permanently removing a loved\
    \ one’s online presence can be challenging to come to terms with. One way to preserve\
    \ the deceased’s digital memories is by creating a memorial page on the social\
    \ media platform. This allows friends and family to continue sharing memories,\
    \ stories, and messages to honor the deceased. Another option is to download photos\
    \ and videos from the accounts and store them in a physical storage device, providing\
    \ a tangible way to remember and cherish the deceased’s online presence. This\
    \ can be done by downloading photos and videos to a physical storage device, such\
    \ as a USB drive or external hard drive. Search the social media platform’s help\
    \ section for how to download the account. This way, family members can keep and\
    \ cherish these memories for years to come. [Table 6.9](#chapter06.xhtml#tab6-9)\
    \ reflects things to consider when closing the deceased social media accounts.\n\
    \nTABLE 6.9  Considerations for Closing Social Media for the Deceased\n\n| Action\
    \ || Description |\n\n| --- | --- |\n\n| 1. || Choose a person to manage the process\
    \ || The first step is to select a trusted family member or friend to handle the\
    \ closure of the deceased’s social media accounts. This person will need access\
    \ to the accounts and should have a clear understanding of the deceased’s wishes.\
    \ |\n\n| 2. || Gather necessary information || Before starting the account closure\
    \ process, it is essential to collect all the necessary information, including\
    \ login credentials, email addresses associated with the accounts, and any other\
    \ relevant details. |\n\n| 3. || Contact the social media platform || Each social\
    \ media platform has its own process for closing accounts of deceased users. It\
    \ is best to reach out to them directly and follow their specific instructions.\
    \  \n\nSome platforms, such as Facebook, have a designated option for memorializing\
    \ an account, where the profile is kept as a digital memorial for friends and\
    \ family to remember the deceased. |\n\n| 4. || Provide necessary documents ||\
    \ Some social media platforms may require certain documents to verify the death,\
    \ such as a death certificate or obituary. It is important to follow their instructions\
    \ and provide the necessary documents to ensure the account is closed properly.\
    \ |\n\n| 5. || Delete personal information || Once the accounts are closed, it\
    \ is crucial to remove any personal information or photos of the deceased. This\
    \ includes removing tags, posts, and comments that might contain sensitive information.\
    \ It is also essential to check if the deceased had any other online accounts,\
    \ such as email or online banking, and close them to prevent any potential identity\
    \ theft. |\n\nThe following list provides general steps for closing a loved one’s\
    \ accounts:\n\n1.Log into the social media accounts using the provided credentials.\n\
    \n2.Go to the settings or account management section.\n\n3.Look for an option\
    \ to “deactivate” or “delete” the account.\n\n4.If there is an option to deactivate,\
    \ this will temporarily suspend the account and it can be reactivated later. If\
    \ the user wants to permanently delete the account, look for an option to “delete”\
    \ or “close” the account.\n\n5.Follow the prompts and confirm the deletion of\
    \ the account.\n\n6.Repeat this process for all social media accounts belonging\
    \ to the deceased.\n\nDealing with the passing of a loved ones passing can be\
    \ terribly tough especially when dealing their personal social media which could\
    \ include their private messaging. [Table 6.10](#chapter06.xhtml#tab6-10) has\
    \ include some resources for dealing with the grief of the loved ones passing.\
    \ We all handle grief differently. Don't be afraid to connect with these on-line\
    \ or other local resources if you need to discuss the events.\n\nTABLE 6.10  Online\
    \ Resources Grief Support\n\n| Group || Description || Web address |\n\n| ---\
    \ | --- | --- |\n\n| GriefShare || Offers online grief support through video-based\
    \ sessions, online resources, and an online grief support community. || [https://www.griefshare.org](https://www.griefshare.org)\
    \ |\n\n| The Compassionate Friends || Provides a variety of online grief support\
    \ resources, including chat rooms, virtual support groups, and online forums.\
    \ || [https://www.compassionatefriends.org](https://www.compassionatefriends.org)\
    \ |\n\n| National Alliance for Grieving Children || Offers online support groups\
    \ and webinars for children, teens, and their families who are grieving the loss\
    \ of a loved one. || [https://childrengrieve.org](https://childrengrieve.org)\
    \ |\n\n| Modern Loss || This online community offers support, resources, and personal\
    \ essays for people who have experienced loss. || [https://modernloss.com](https://modernloss.com)\
    \ |\n\n| Open to Hope || This Web site provides articles, podcasts, and videos\
    \ on grief and loss, as well as an online community for support and connection.\
    \ || [https://www.opentohope.com](https://www.opentohope.com) |\n\nCONCLUSION\n\
    \nIt is never too late to act and implement safety measures to protect our loved\
    \ ones in the digital world. By being proactive and staying informed, we can create\
    \ a safe and secure online environment for our adult family members. This can\
    \ involve setting up privacy settings on social media accounts, using secure passwords,\
    \ and regularly updating our devices and software. It is also important to have\
    \ open and honest conversations with our family members about the potential dangers\
    \ of the Internet and how to stay safe. With the right tools and knowledge, we\
    \ can all play a role in protecting ourselves and our loved ones in the digital\
    \ world.\n\nThere are many resources available for those looking to learn more\
    \ about online safety and security. Government agencies, nonprofit organizations,\
    \ and technology companies offer a variety of educational materials and support\
