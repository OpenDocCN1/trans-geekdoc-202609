- raw: 'We all know that technology is increasing becoming a part of our vehicles
    from Bluetooth capability and GPS location to autonomous driving features. As
    we have previously stressed, security is not always a priority when these new
    features are implemented. These vulnerabilities allowed thieves to steal the vehicle
    with the use of a USB device or allow hackers to remotely control the vehicle
    such as starting or stopping it. The modern car owner must become acquainted with
    their vehicle’s computer functions and as well of keeping up with all manufacturer’s
    computer updates. An obviously important first step is to change the default passwords.
    Do Internet research on the vehicle and its computers for updates on known vulnerabilities
    and address them. For other steps check out the Physics World article titled “How
    to hack a self-driving car” \[Ornes 2020\].


    CONCLUSION


    Understanding the fundamental concepts of cybersecurity is essential in protecting
    individuals and their digital information in today’s digital world. This chapter
    discussed the risk of connecting to the Internet and made suggestions for ranking
    those risks particularly as they relate to IoT devices. The key to mitigating
    those risks is the use of a properly configured router. The chapter also provided
    checklists for router configuration and for documenting the devices that connect
    to the Internet. [Chapter 3](#chapter03.xhtml) will go beyond the router and discuss
    additional measures that need to be in place for online cybersafety.


    REFERENCES


    Ornes, S. 2020\. “How to hack a self-driving car.” Physics World, August 18, 2020.
    [https://physicsworld.com/a/how-to-hack-a-self-driving-car/](https://physicsworld.com/a/how-to-hack-a-self-driving-car/)


    Robbins 2010. Robbins v. Lower Merion School District, Dist. Court, ED Pennsylvania
    2010 Civil Action No. 10-665.


    Whittaker, Z. 2017\. “Security researcher says DirecTV hardware can be easily
    hacked.” ZDNET, December 12, 2017. [https://www.zdnet.com/article/security-researcher-says-directv-hardware-can-be-easily-hacked/](https://www.zdnet.com/article/security-researcher-says-directv-hardware-can-be-easily-hacked/)


    | CHAPTER || 3 |


    | --- | --- |


    SAFELY GOING ONLINE


    IN THIS CHAPTER


    Going online can expose users to risk. This chapter identifies those risks and
    covers steps to eliminate them. It specifically covers browsers, cookies, antivirus,
    antispyware, and firewall software, connecting via virtual privacy networks (VPN)
    and Wi-Fi. It also discusses the differences between privacy versus security.


    INTERNET RISKS


    [Chapter 2](#chapter02.xhtml) covered steps for securing home networks to ensure
    no one has access to the user’s devices. Going online exposes users to other risks
    that must be addressed. This chapter explores other areas that must be addressed
    to ensure the users are secure while online. Keep in mind that the Internet is
    not just the World Wide Web, it includes every protocol that uses the Internet.
    This includes email, music-sharing tools, file sharing, and many other basic functions
    that are often taken for granted when accessing the Internet. All these many useful
    Internet tools can give bad actors access to user’s computers.


    Considerations for Securing the User’s Computer for Online Use


    Technology is always changing and so are the attacks against it. Online research
    can overwhelm the average person with conflicting advice as to what security means.
    The cybersecurity industry must evaluate the threat against the system to help
    determine what security measures to put into place. The average home computer
    or small business has different risks than a larger company. The following section
    evaluates the small office/home office (SOHO) risks posed by an Internet connecting
    computer.


    Evaluating the Risk


    Risk assessment is the process of evaluating and analyzing potential vulnerabilities
    and threats. It helps users determine the likelihood of a threat occurring and
    to identify potential consequences if those threats were to materialize. This
    process helps identify areas that need improvement and additional security measures
    that could be added to protect the home network. [Table 3.1](#chapter03.xhtml#tab3-1)
    covers this process.


    TABLE 3.1  Risk Assessment


    |  || Step || Evaluation |


    | --- | --- | --- |


    | 1. || Assets Identification || The first step is to identify all the assets
    in one’s home network, such as computers, routers, connected devices, and personal
    data. |


    | 2. || Threat Assessment || Identify potential threats that could compromise
    the security of the network, such as malware, phishing attacks, physical theft,
    or human error. |


    | 3. || Vulnerability Assessment || Identify any vulnerabilities or weaknesses
    in the network that could make it more susceptible to attacks, such as outdated
    software, weak passwords, or unsecured Wi-Fi networks. |


    | 4. || Risk Analysis || Evaluate the likelihood and potential impact of each
    identified threat, taking into account the user’s network’s vulnerabilities. |


    | 5. || Prioritization || Prioritize the risks based on their potential impact
    and likelihood of occurrence. This will help the user focus on the most critical
    risks first. |


    | 6. || Risk Mitigation || Develop a plan to mitigate or reduce the identified
    risks. This may include implementing security measures such as installing antivirus
    software, enabling firewalls, updating software, and using strong passwords. |


    | 7. || Implementation and Monitoring || Implement the risk mitigation plan and
    regularly monitor the network for any new vulnerabilities or threats. |


    | 8. || Review and Update || Periodically review the risk assessment and update
    it as needed. Remember new threats and vulnerabilities are constantly emerging.
    |


    With these steps a SOHO computer user can identify and hopefully address potential
    risks to their network. Over the long run this makes the network more secure and
    less susceptible to attacks. The process is important, but it is never finished.
    Regular review and updating the risk assessment helps to ensure the ongoing security
    of the user’s network.


    BASIC SOHO COMPUTER SECURITY CONSIDERATIONS


    Thus far, the chapter has looked at the risk and tried to evaluate the kinds of
    things needed to address network threats. What are some of the things the user
    can actually do to affect network security? The following list explores some of
    the basics:


    1.Install a SOHO Firewall


    A local firewall is a great place to aid in the identification of and prevention
    of outside network attacks. Numerous companies make a variety of devices that
    can aid in securing a home network. Having one in between the user’s network and
    the Internet is a basic requirement for SOHO security.


    2.Configure/Update the Operating System


    Does the user have a thorough knowledge of their operating system or just a general
    familiarity of its functionality? Windows users have different configuration concerns
    than Apple users. Linux users also have very different considerations than either
    of those two. Users need to review the security requirements and implement the
    best overall practices for their operating system.


    3.Antivirus/Spyware Detection Software


    Modern systems are under attack from numerous external (and even internal) sources.
    The next step in the protection of a user’s computer systems is to ensure that
    the computers have antivirus and spyware detection tools installed. This, again,
    is a complex area requiring some research, but it is a security necessity.


    4.Use a Virtual Private Networks (VPN)


    VPN’s can serve an important purpose in security. If the user’s risk assessment
    determines that their browsing traffic can possibly be compromised, installing
    and using a VPN might be appropriate.


    5.Block Browser Cookies/Active Content'
