  trans: '

    TikTok 是一款允许用户创建、观看和分享短视频的社交媒体应用。视频可以在 TikTok 上查看，也会出现在其他平台上。2023 年，联邦调查局（FBI）和美国司法部对
    TikTok 发起了调查，其中包括对该公司涉嫌监视美国记者的指控 [Hansen 2023]。国会也举行了听证会，并在 2024 年通过了在美国禁止该应用的法律
    [Associated Press 2024]。这并并非终结，因为该法律可能会面临法庭挑战。


    美国出于几个原因想要禁用该应用程序。主要原因是国家安全，因为 TikTok 是一家中国公司，人们担心中国政府会强制公司提供用户数据，包括来自其他国家公民的数据。美国此前曾在联邦员工的手机上禁止了
    TikTok 应用。在 50 个州中，有 32 个州已禁止在公共部门员工的手机上使用它。这说明存在一种真实的可能性：无论公司如何安全地维护个人数据，都可能被迫将这些数据提供给他人，包括政府。在美国，访问互联网服务提供商维护的数据需要基于合理理由的授权。其他国家有不同的标准。因此，在选择社交媒体、应用以及决定分享或发布内容时，请记住这一点。


    ## 结论


    社交媒体改变了我们今天生活的的世界。从我们使用的电脑到随身携带的手机；社交媒体在我们的生活中无处不在。本章讨论了如何安全使用社交媒体，以及如何保护我们使用的各种社交媒体工具。下一章将介绍如何在网上保护儿童。


    儿童使用技术带来了一些积极的影响，也带来了一些非常糟糕的影响。下一章将就保护儿童免受目前通过技术针对儿童的邪力量提供指导。


    ## 参考文献


    - Associated Press. 2024\. “在美国禁止 TikTok 对你意味着什么。” AP News, 2024 年 4 月 24 日. [`apnews.com/article/tiktok-divestment-ban-what-you-need-to-know-5e1ff786e89da10a1b799241ae025406`](https://apnews.com/article/tiktok-divestment-ban-what-you-need-to-know-5e1ff786e89da10a1b799241ae025406)

    - Doe v. David K. Elam II, 2:14-cv-09788-PSG-SS (C.D. Cal. 2014).

