    PREFACE


    The authors, with a combined investigative experience of over 50 years, aimed
    to create an easy-to-understand guide for the general public to prevent and survive
    cybercrime. This book, consisting of ten chapters, is the result of their efforts.
    Both authors have successfully trained law enforcement in cybercrime techniques,
    even those with minimal computer skills. The book is written in a way that anyone
    with basic computer skills can understand, while also providing helpful information
    for advanced practitioners. Readers will benefit from the included checklists
    for applying the book’s steps and principles. The chapters are written to be stand-alone
    references for the reader, and it is not necessary to read the book all at once,
    cover to cover.


    [Chapter 1](#chapter01.xhtml): Cybersurvival Versus Safety


    Explains that cybercrime is a fact in today’s world and is the first step to understanding
    how to begin to protect oneself when using the technology around them. It discusses
    the crimes committed through technology and the places criminals target victims.


    [Chapter 2](#chapter02.xhtml): Digital (Cyber) Security Basics.'
