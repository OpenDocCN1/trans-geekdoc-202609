    我们都知道，技术正日益成为我们车辆的一部分，从蓝牙功能和 `GPS` 定位到自动驾驶功能不一如此。正如我们之前强调的，在实现这些新功能时，安全性并不总是首要任务。这些漏洞允许小偷使用
    `USB` 设备盗取车辆，或允许黑客远程控制车辆（例如启动或停止车辆）。现代车主必须熟悉其车辆的计算机功能，并跟上制造商所有的计算机更新。一个显然重要的第一步是更改默认密码。在互联网上对车辆及其计算机进行有关已知漏洞的更新研究并解决它们。关于其他步骤，请参阅《Physics
    World》中题为“如何黑进自动驾驶汽车”的文章 [Ornes 2020]。


    ## 结论


    在当今的数字世界，理解网络安全的基本概念对于保护个人及其数字信息至关重要。本章讨论了连接互联网的风险，并对这些风险进行了排序建议，特别是与 `IoT` 设备相关的风险。减轻这些风险的关键在于使用配置恰当的
    `router`。本章还提供了 `router` 配置清单以及连接到互联网的设备文档清单。第 3 章 将超出 `router` 的范围，讨论在线网络安全需要采取的额外措施。


