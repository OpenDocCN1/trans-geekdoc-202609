- raw: 'TikTok is a social media app that permits users to create, watch, and share
    short-form videos. The videos can be seen on TikTok but also appear on other platforms.
    In 2023, the FBI and US Department of Justice launched an investigation into TikTok
    including allegations that the company spied on American journalists \[Hansen
    2023\]. Congress also had hearings and in 2024 passed legislation banning it in
    the United States \[Associated Press 2024\]. This is not the end as there likely
    will be court challenges to the law.


    The United States wants to ban the application for several reasons. The main reason
    is national security, as TikTok is a Chinese company and there is a concern that
    the Chinese government will compel the company to provide user data, including
    from citizens of other countries. The United States previously banned the TikTok
    application on federal employees’ phones. States have banned its use on public
    sector employees’ phones in thirty-two of fifty states. This is an example that
    the real possibility exists that no matter how secure a company maintains personal
    data, it could be compelled to provide that data to others, including governments.
    In the United States it requires a warrant based upon probable cause to access
    data maintained by an Internet service provider. Other countries have different
    standards. So, keep that in mind when choosing social media, apps, and what to
    share or post.


    CONCLUSION


    Social media has changed the world we live in today. From the computers we use
    to the smartphone we carry; social media is ever present in our lives. This chapter
    discussed how to safely use social media and secure the different social media
    tools available to us. The next chapter will cover how to protect children online.


    The use of technology by children presents positive things and some very terrible
    things. The next chapter will provide guidance on how to protect children from
    the forces of evil presently targeting children through technology.


    REFERENCES


    Associated Press. 2024\. “What a TikTok ban in the US could mean for you.” AP
    News, April 24, 2024. [https://apnews.com/article/tiktok-divestment-ban-what-you-need-to-know-5e1ff786e89da10a1b799241ae025406](https://apnews.com/article/tiktok-divestment-ban-what-you-need-to-know-5e1ff786e89da10a1b799241ae025406)


    Doe v. David K. Elam II, 2:14-cv-09788-PSG-SS (C.D. Cal. 2014).


    Federal Trade Commission. “FTC sues owner of online dating service [Match.com](http://Match.com)
    for using fake love interest ads to trick consumers into paying for a [Match.com](http://Match.com)
    subscription.” Federal Trade Commission, September 25, 2019. [https://www.ftc.gov/news-events/news/press-releases/2019/09/ftc-sues-owner-online-dating-service-matchcom-using-fake-love-interest-ads-trick-consumers-paying](https://www.ftc.gov/news-events/news/press-releases/2019/09/ftc-sues-owner-online-dating-service-matchcom-using-fake-love-interest-ads-trick-consumers-paying)


    Hansen, C. 2023\. “Justice Department investigation TikTok owner for spying on
    U.S. journalists: Reports.” US News, March 17, 2023.


    [https://www.usnews.com/news/national-news/articles/2023-03-17/justice-department-investigation-tiktok-owner-for-spying-on-u-s-journalists-reports](https://www.usnews.com/news/national-news/articles/2023-03-17/justice-department-investigation-tiktok-owner-for-spying-on-u-s-journalists-reports)


    Holmes, A. 2019\. “Tinder says ‘there are definitely registered sex offenders
    on our free products.’” Business Insider, December 2, 2019.


    [https://www.businessinsider.com/tinder-says-registered-sex-offenders-use-app-match-group-2019-12#:~:text=Tinder%2C%20OkCupid%2C%20Plenty%20of%20Fish,ProPublica%20and%20Columbia%20Journalism%20Investigations](https://www.businessinsider.com/tinder-says-registered-sex-offenders-use-app-match-group-2019-12#:~:text=Tinder%2C%20OkCupid%2C%20Plenty%20of%20Fish,ProPublica%20and%20Columbia%20Journalism%20Investigations)


    Ortuay, B. 2020\. “Dating apps face US inquiry over underage use, sex offenders.”
    AP News, January 30, 2020. [https://apnews.com/article/a93a6e2b02b7f979efca92ea7266e9f2](https://apnews.com/article/a93a6e2b02b7f979efca92ea7266e9f2)


    | CHAPTER || 5 |


    | --- | --- |


    PROTECTING CHILDREN


    IN THIS CHAPTER


    This chapter discusses protecting children from the risks associated with using
    new technology. It covers approving devices and processes for managing cyber risk.


    CHILDREN AND TECHNOLOGY


    Very few children in the developed world grow up without a computing device. A
    few years ago, it was computers, but now it is often a smartphone. Due to COVID-19
    quarantines many schools provided computers to students for home use. Social media
    is an important aspect of children’s lives. They share their lives online in ways
    most adults can’t fathom. Not too long ago, the high school rock star was the
    sports player who got their picture in the newspaper. Today, there are YouTube
    famous kids who are unknown to many of us old enough to vote, making thousands
    of dollars a month talking about themselves. Other young adults film themselves
    playing video games and have hundreds of thousands of online followers. Technology
    has changed adult lives, but children have grown alongside that technology. Adults
    have to spend some time learning technology and how it works. Parents need to
    identify technology that can assist children in developing into law-abiding citizens
    both online and in the real world. Parents must also instill in them how to use
    that technology in a manner that does not place them or others at risk.


    Keeping children safe in the digital world, just like in the real world, requires
    a commitment to effectively communicate to them the risks. This volume can provide
    users with technological suggestions to manage cyber risk. No matter how much
    the user secures family’s devices, one can’t control their children’s access to
    other devices. Schools may have adequate controls, but what about the local library?
    What about a friend’s house? Do their friend’s parents manage cyber risk in their
    homes? Are they secure from cyberdangers? The reality is no matter how secure
    one makes devices, a committed child, either on their own, with a friend’s help
    or, worse, a predator, can obtain the knowledge to overcome the best-laid protections.
    We are reminded of an FBI Special Agent’s story of how they installed monitoring
    software on their children’s computers to keep them safe. Much to the agent’s
    surprise, the enterprising child found a way to defeat it.


    Sexual predators are not all met online but can be teachers, coaches, and so on.
    Sometimes, these predators either provide a burner phone or provide funds for
    the purchase of an unmonitored phone to overcome any parental oversight. There
    have been cases where sexual predators have instructed their minor victims to
    remove or destroy computer hard drives as the last step before their minor target
    leaves to meet them to further frustrate law enforcement efforts to locate them
    after they have been reported missing by their parents. The only way to truly
    protect your child is to instill appropriate cyberpractices in them.


    INSTILLING BEST CYBERPRACTICES'
