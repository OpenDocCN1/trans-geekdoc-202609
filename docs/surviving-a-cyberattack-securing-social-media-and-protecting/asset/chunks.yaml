- raw: 'Phony invoices are sometimes sent to an SHB. They mirror products or services
    an SHB might order. The fraudsters are counting on the person responsible for
    paying expenses assuming they are legitimate and making payment. Scammers also
    will call an SHB to confirm a fictitious order by verifying an address or offering
    a free catalog or sample. If the SHB answers yes to any of the scammer’s inquiries
    the unordered merchandise will arrive at the SHB. This is then followed by the
    scammers’ high-pressure demands for payment. Remember in the United States any
    unordered merchandise received can be kept without making payment. [Figure 8.1](#chapter08.xhtml#fig8-1)
    is an example of what a phishing email and attachment could look like. Be aware
    of the kinds of phishing attempts that are occurring and don''t click on emails
    or their attachments without knowing for sure that they are real and not from
    a scammer.


    ![](image/fig8-1.jpg)


    FIGURE 8.1  Invoice phishing example.


    Online Listing and Advertising Scams


    Scammers will also try to trick SHB into paying for nonexistent advertising or
    a listing in a phony business directory. They will again use tactics to get confirmation
    from the SHB. Later, the SHB will get a big bill, and the scammer may use details
    from their previous interaction or even a recording to pressure payment.


    Business and Government Impersonation Scams


    SHBs are not immune to this scam. A scammer pretending to be a trusted entity
    will try to scare an SHB into rushing payment or giving information. They will
    pretend to be a utility company threatening to shut off services that will interrupt
    business operations. Some scammers will claim they are a Web hosting company and
    will threaten the SHB will lose their Web site URL if payment is not immediately.
    Pretending to be government agents, they will threaten to suspend business licenses,
    impose fines, or initiate civil action. Some will try to sell workplace compliance
    posters that a SHM can get for free. Others will try to convince s SHB to pay
    an application fee for a nonexistent business grant.


    Tech Support Scams


    Tech support scams also target SHBs. The goal is to get access to money or computer
    systems, or both. The scammer claims to an unsuspecting employee that they are
    an SHB’s tech support and they need access to help with an update or some other
    nonexistent problem. Once gaining access scammers will go after an SHB’s sensitive
    data like passwords, customer records, or credit card information.


    Social Engineering, Phishing, and Ransomware


    Cyberscammers will trick employees into believing they are a supervisor or senior
    employee to get them into sending money or giving confidential or sensitive information
    like passwords or bank information. It can start with a phishing email, social
    media contact, or a call and will stress the need for urgency in providing the
    information. Scammers will use spear phishing tactics to send targeted emails
    to specific employees to gain access. Malicious emails are used to trick an employee
    into clicking on a link that infects their system or encrypts data which can only
    be unencrypted by payment of a fee to the scammer.


    Business Coaching Scams


    Some scammers will con SHBs with bogus business coaching programs. The programs
    use false testimonials, videos, seminar presentations, and telemarketing calls
    and promise to help grow the SHB. They may start with low initial costs that only
    grow with more services offered. The growth promises never materialize.


    Changing Online Reviews


    Some scammers will claim to post online reviews to help an SHB for a small fee.
    Others may threaten to post unfavorable online reviews unless payment is made.
    Posting fake reviews is illegal.


    Credit Card Processing and Equipment Leasing Scams


    Scammers know SHBs are looking to cut costs. Under this scam, they promise lower
    rates for processing credit card transactions or better deals on equipment leasing.
    They scammers will fail to deliver on these promises and are only interested in
    getting the SHB’s money.


    Fake Check Scams


    The overpayment scam has been discussed before. In this case the scammer is targeting
    an SHB with a check that exceeds what was due. They convince the SHB to send the
    overpayment back. The scammer’s original check later bounces leaving the SHB out
    the cost of the payment they sent the scammer.


    Instituting Best Practices


    Even the smallest of businesses should have some documentation on what acceptable
    practices are. To prevent mishaps, all employees should receive initial and regular
    periodic training on those acceptable practices. [Table 8.1](#chapter08.xhtml#tab8-1)
    provides a checklist of acceptable practices.


    TABLE 8.1  Scam Prevention Checklist


    | Action || Date |


    | --- | --- |


    | Train employees to prevent fraud. ||  |


    | Verify invoices and payments and segregate accounting duties. ||  |


    | Maintain internal controls. ||  |


    | Know employees. Check references and do employee background checks. ||  |


    | Be tech-savvy: Learn about the technology the SHB uses. ||  |


    | Protect client credit card information and any personal identifiers collected.
    ||  |


    | Limit staff access to data, including the ability to modify it. Employees should
    only have access to data needed to perform their job function. More than one embezzlement
    has occurred when a thief adds a fictitious vendor to a system to get checks fraudulently
    issued, which they later cash. ||  |


    | Consider purchasing insurance to mitigate fraud losses. ||  |


    | Report scams to the FTC or local law enforcement. ||  |


    Free and Low-Cost Online Cybersecurity Learning Content


    SHB owners and their employees need to keep regularly informed on cybersecurity
    issues. Employee awareness training is available from the National Institute of
    Standards and Training program, the National Initiative for Cybersecurity Education
    (NICE) [https://www.nist.gov/itl/applied-cybersecurity/nice/resources/online-learning-content](https://www.nist.gov/itl/applied-cybersecurity/nice/resources/online-learning-content).
    The links on the Web site are for free or low-cost online educational training.
    The topics range from information technology to cybersecurity. Consider using
    these Web sites as a regular cybersecurity education program.


    Acceptable Use Policy (AUP)


    Human beings are frequently the weakness link in computer security. Either through
    error or intentional acts they annually cause significant employer losses. SHBs
    need an acceptable use policy (AUP) that establishes what employees are allowed
    to do with their computer resources to prevent harm to business systems and data.
    Examples of harm include destruction of data/systems, theft of intellectual property,
    and fraud. Another example is loss of productivity as employees are wasting time
    on computer resources playing games, surfing the Internet, or working on nonbusiness-related
    tasks. Employees can also use SHB computers to engage in sexual harassment behavior
    (viewing and sharing porn and sending explicit messages with other employees)
    or sending harassing and threatening messages.


    A proper AUP will spell out what is acceptable and unacceptable conduct and provides
    a mechanism to compel compliance, including penalties for noncompliance. AUPs
    also alert employees that they have no expectation of privacy when using employer
    owned equipment allowing employers to monitor and log their computer behavior.
    Along with a written AUP, computers users should see a banner when they start
    up or log on to an employer computer. AUP also should cover bring your own devices
    (BYOD) when those devices are used for business purposes. An AUP should also cover
    an employee’s social media use if it impacts the SHB. A simple Google search can
    provide an AUP that an SHB can modify to meet their needs.


    Enforcing AUP'
