    考虑到本章讨论的所有主题，你现在开始评估对你个人家庭网络和家庭可能构成的威胁。在表 3.2 风险评估中，我们提供了一份考虑清单，你可以利用它来指导你识别个人家庭在使用技术时的弱点。请将此列表作为基础指南，并添加可能在你个人家庭环境特有的其他项目。在完成检查清单时，请记录下你审查的时间以及你是如何完成的。


    ### 表 3.2 风险重新评估


    | 需要考虑的事项 | 已审查/完成 |

    | --- | --- |

    | 为所有在线账户使用强强度且唯一的密码。 | | |

    | 避免对设备使用默认密码，并定期更改它们。 | | |

    | 避免在在线用户名或密码中使用易于识别的信息，如你的全名或出生日期。 | | |

    | 使用密码管理器为所有账户安全地存储和生成强密码。 | | |

    | 启用双重/多因素身份验证以增加安全性。可用时使用身份验证器应用。 | | |

    | 定期更新软件和操作系统，以防止安全漏洞。 | | | |

    | 使用信誉良好的防病毒软件并保持其更新。 | | | |

    | 使用防火墙防止未经授权访问你的计算机或网络。 | | | |

    | 使用安全的浏览器并启用“请勿追踪”功能，防止网站跟踪你的在线活动。 | | | |

    | 在提供个人信息之前，阅读并理解网站和应用程序的隐私政策。 | | | |

    | 识别社交媒体上的隐私设置，并根据个人的安全需求进行调整。 | | | |

    | 警惕钓鱼邮件，永远不要点击可疑链接。 | | | |

    | 不要在社交媒体平台、在线表单或账户上分享个人信息。 | | | |

    | 尽可能避免使用公共 Wi-Fi。 | | | |

    | 在公共网络上访问互联网时，使用虚拟专用网络 (VPN)。 | | | |

    | 定期在外部硬盘或安全的云存储上备份重要数据。 | | | |

    | 在丢弃敏感文档之前，使用碎纸机。 | | | |

    | 保持个人设备（如笔记本电脑和智能手机）的物理安全，并使用密码码或生物识别认证以防止未经授权访问。不要将设备留在公共场所无人看管。 | | | || 避免使用公共计算机或共享设备处理网银或购物等敏感任务。
    | | | |

    | 定期检查银行和信用卡账单，查看是否有任何未经授权的费用或可疑活动。 | | | |

    | 了解当前的安全威胁，并在保护个人数据方面保持警惕。 | | |


    ### 结论


    访问互联网并不是没有安全问题的。本章涵盖了各种可用工具和功能的最佳安全实践。第 4 章 讨论了保护社交媒体的额外步骤。


    | 章节 | 4 |

    | --- | --- |


    ### 保护社交媒体


    #### 本章内容

    本章涵盖了社交媒体的安全保护。它讨论了使用社交媒体的关注点和风险，以及在线保护个人数据的方法。这包括密码安全，以及在在线世界中维护安全密码有多重要。


    #### 社交媒体的使用

    社交媒体像电话和电视一样无处不在。它不仅是为了连接朋友和家人，还作为一种必要的业务工具。遗憾的是，社交媒体安全对大多数用户来说是事后考虑的问题。我们生活在一个社交媒体安全对大多数用户来说是事后考虑的世界里。


