- raw: 'The next consideration is identifying all the devices that deal with this
    kind of data. These would obviously include desktop or laptop computers but might
    also include mobile devices as well. If the SHB has a network, is the data maintained
    on a network server on a user’s computer or both. After identifying the devices,
    consider how many kinds of important data is maintained on the device. It may
    make sense to back up only particular drives/folders of a device, or it might
    make sense to back up the entire device’s storage. [Table 8.3](#chapter08.xhtml#tab8-3)
    provides considerations for data backup. This is not an all-inclusive list but
    covers much of the important data an SHB needs backed up. Review the SHB’s data
    and identify where the data is normally stored to properly complete this list.


    TABLE 8.3  Critical Data Types to Consider Backing Up


    | Action || Date |


    | --- | --- |


    | Company Personnel RecordsFederal, state, and local tax recordsPayroll recordsPension/401K
    recordsCurrent and past employee records ||  |


    | --- | --- |


    | Administrative DocumentsSales dataMarketing dataSocial media account informationInsurance
    recordsLeasing documents for equipment and propertyAttorney/client materialPending
    legal case informationFederal and state tax filings ||  |


    |  Financial DataFinance system dataDaily transactionsWeb site transactionsEquipment
    inventoryRevenue recordsBank statementsExpense receiptsTravel receipts ||  |


    | Proprietary DataCustomer listsSales dataTrademark and patent filingsProprietary
    code ||  |


    Storage Needs/Cost


    An SHB has identified its critical data and where it is maintained. Now it needs
    to decide how often data needs backed up, what is the best backup solution for
    the SHB (software/hardware/cloud), and what it is going to cost. [Figure 8.2](#chapter08.xhtml#fig8-2)
    describes the basic data storage concepts typically available to a home user.


    ![](image/fig8-2.jpg)


    FIGURE 8.2  Data storage options


    Cloud Storage


    Many business applications are available through cloud technology, which is just
    another form of backup. Evaluate in the SHB plan how much data is stored in the
    cloud and how data can be accessed after an incident. Using online backup services
    makes backing up all data simple. The lesson learned, however, is that this needs
    to be managed. If an SHB is using cloud backups, when was the last time it checked
    the cloud services files to ensure that the data is being backed up, and is the
    current version of an SHB’s data? Did someone working on the bookkeeping system
    make a new personnel folder that is not in the cloud backup plan? If so, those
    necessary files might not have been backed up.


    Local Data Backups


    Is the SHB saving files to an attached USB Drive? This can simplify the backup
    process if all the necessary files are copied to a second drive installed on an
    SHB’s computer. Choosing a system for locally backing up an SHB’s data can be
    cost effective, but it has issues that need to be considered. What is the backup
    schedule? The best practice for an SHB would be to back up nightly. Backup software
    programs for individuals and SHBs are readily available. Most allow users to set
    a schedule that will automatically back up their data at regular times each day
    or night. Software that has encryption can increase data security, preventing
    hackers from having access and stopping the release of an SHB’s client’s personal
    data.


    Recent backup copies should be removed from the premises and stored off-site.
    If the office burns down the business can survive the tragedy if the backups are
    safe off-site. None of this works if the SHB does not adhere to the backup schedule
    and the removal of the copies to off-site storage.


    Using a Network Attached Storage Device


    A network attached storage device (NAS) is a very effective method for backing
    up data for an SHB. A NAS is a file-level data storage server connected to the
    SHB network. The beauty of these small devices is that they can provide computer
    data storage to everyone across a network. A NAS can be attached to the internal
    company router and provide a separate drive letter for everyone to back up their
    data. Most of them are simple devices to install and operate and don’t need an
    IT person to install them. Since they are still hard drives, they need to be monitored.
    They are a great option for backups and data retention. In [Figure 8.3](#chapter08.xhtml#fig8-3)
    we have described could properly backup their data to prevent data loss. Following
    this process helps the home user to secure their data in multiple locations, thereby
    preventing the loss from having data stored in a single location.


    ![](image/fig8-3.jpg)


    FIGURE 8.3  Best SHB data backup concept.


    DISPOSING OF SHB EQUIPMENT


    Backing up is important, but what does an SHB do with all their business computers
    and cell phones when no longer needed? Does an SHB need to retain the data for
    legal purposes? Does the SHB have a policy for data retention? Is it consistent
    with the law?


    A primary consideration for disposing equipment is not to allow any personal,
    company, or client data to remain on the devices. Donating SHB equipment to a
    nonprofit that repairs and reintroduces the equipment to people who need it is
    a good thing. If an SHB’s client data remains on the device that creates a big
    security issue. Here are some things to consider when disposing of SHB equipment.


    The number one goal is to make your business data unreadable. The data destruction
    should ensure that no person can recover any data. It’s important to consider
    the time involved in the process as well as the cost. Another consideration is
    the destruction required under a legal requirement. If it is, make sure the destruction
    process complies with the laws the SHB may be required to satisfy. One of the
    best standards for data destruction is the National Institute of Standards and
    Technology (NIST) guidelines ([https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-88r1.pdf](https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-88r1.pdf)).
    Here are some possible data destruction methods:


    1.Delete/reformat: This is the least recommended process, as the data can potentially
    be recovered.


    2.Data wiping: This is the process of writing data over the existing data to obliterate
    the existing data completely.


    3.Degaussing: This is the process of using high-powered magnets to destroy the
    data (this may work on a hard drive but not on solid-state devices).


    4.Physical destruction: Destruction of the device by drilling holes into a hard
    drive, using a hammer to break the device into pieces, or shredding. There are
    hard drive shredders made for complete drive destruction.


    These techniques can be used on computers, hard drives, cellphones, thumb drives,
    or an IOT device. An SHB’s destructive choice is based on the time and costs involved
    in the process. Another potential resource is finding a local company specializing
    in data destruction.


    Data Retention Legal Requirements


    Has the SHB been told that they need to retain data for a lawsuit? Reacting timely
    and appropriately is a necessity to avoid costly litigation expenses, including
    court sanctions. Data can easily be overwritten and an SHB can be blamed for the
    loss even if it is unintentional. Contact an attorney and a digital forensic specialist
    for data retention advice and assistance as soon as possible.


    Device Tracking


    There are programs that can help SHB keep track of their devices in case they
    are stolen or lost. They frequently also can remotely wipe the device to prevent
    data theft. Again, a Google search is one of the best ways to find the product
    that fits the SHB’s needs.


    CONCLUSION'
