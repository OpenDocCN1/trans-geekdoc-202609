  trans: '


    表 9.2 描述了用于攻击你的计算机和智能手机的犯罪通用类别。图 9.3 是一张描述这一过程的图片。


    ### 表 9.2 网络犯罪的通用类别


    | 针对计算设备的犯罪 | 使用计算设备的犯罪 |

    | --- | --- |

    | 病毒 | 钓鱼邮件 |

    | 恶意软件 | 鱼叉式钓鱼 |

    | 勒索软件 | 短信钓鱼 (smishing) |

    | 拒绝服务攻击 (DOS) | 网络骚扰 |

    | | 身份盗窃 |

    | | 社会工程学（也可以通过电话、短信甚至信件无需电脑完成） |


    ![](img/fig9-3.jpg)


    **图 9.3 数据攻击可能的样子。**


    ### 定期数据备份


    在当今世界，几乎每一张拍摄的照片和每一次通信都是在电脑或手机上完成的。全球超过一半的互联网用户通过手机访问互联网。当计算设备因意外或恶意活动而故障时，除非已备份数据，否则已故亲人的家庭照片、业务文件、学校作业等都会丢失。确保个人从数据灾难中恢复的最重要措施是采用第
    8 章中讨论的创建定期备份程序。


    ### 立即网络响应


    表 9.3 是一份清单，包含了 FBI 处理计算机系统攻击的通用指南，以及一些额外的建议。更多来自 FBI 的信息可以访问 `https://www.fbi.gov/investigate/cyber#What-You%20Should%20Know`
    和 `https://www.fbi.gov/how-we-can-help-you/scams-and-safety/common-scams-and-crimes/ransomware`。


    #### 勒索软件攻击


    本书反复强调要保持操作系统、软件（包括可靠的杀病毒软件和反恶意软件）以及应用程序处于最新状态，并执行数据备份程序，且不要点击链接或下载可疑文件。所有这些步骤也是
    FBI 防止勒索软件攻击的建议，以及在攻击发生时制定应急预案。FBI 的立场不支持支付赎金。他们指出：


    支付赎金不能保证你或你的组织能找回任何数据。它还会鼓励犯罪者针对更多受害者，并为他人参与此类非法活动提供动力。如果你是勒索软件的受害者，请联系当地的 FBI
    地区办事处寻求协助，或在线提交举报。向 FBI 互联网犯罪投诉中心 (IC3) 提交报告。（联邦调查局，n.d.）图 9.4 是计算机在勒索软件攻击期间可能显示的消息示例。


    ![](img/fig9-4.jpg)


    **图 9.4 计算机上的勒索软件说明示例。**


    在表 9.3 中，我们提供了一份成为勒索软件攻击受害者时的考虑因素清单。在攻击发生前查看此内容，这样在你万一成为勒索软件受害者时，你就知道需要完成的事情。


    ### 表 9.3 网络攻击响应清单


    | 行 | 日期 | 备注 |

    | --- | --- | --- |

    | 隔离所有可能感染的计算机。这意味着从网络中移除所有可能感染的设备。这将防止任何进一步的网络泄露。从物理上拔掉计算机的网线，或关闭设备上的 Wi-Fi。
    | | |

    | 关闭任何其他设备的电源。 | | |

    | 通过将其离线来立即保护备份数据或系统。 | | |

    | 修改在线账户密码和网络密码。 | | |

    | 检查日志。计算机和网络服务器都有计算机和用户操作的日志。检查这些日志可以提供有关攻击范围的信息。可能需要 IT 支持协助来查找和解释这些日志 | | |

    | 根据需要从当地 IT 支持处寻求帮助。 | | |

    | 警告家人、朋友和同事可能发生的攻击。 | | |

    | 联系执法部门（第 6 章，参见表 6.9） | | |

    | 联系涉及的互联网提供商 (ISP)、社交媒体或网站。 | | |

    | 关闭受影响的账户 | | |


    ### 应对网络骚扰


    - **不要参与**：不要对骚扰者做出反应，不要回应或回复消息或帖子，简单地忽略此人的存在。网络骚扰者通常只想要用户的反应。得不到任何反应可能会停止他们的活动。

    - **屏蔽**：采取恰当措施防止此人在该服务上联系用户。大多数社交媒体服务都有屏蔽联系的方法。

    - **举报他们**：通知用户被联系的 Web 服务商，并在需要时联系执法部门。

    - **检查手机间谍软件**：这要稍微复杂一点，但要确保杀病毒软件已更新到最新版本。如果用户仍然认为手机或计算机存在问题（骚扰者黑入了用户的设备），请停止使用它，更换账户，并购买新手机或计算机。如果情况恶化，考虑咨询数字黑客专家。请注意，某些骚扰者可能会在受害者的车辆或身上留下跟踪设备。如果怀疑如此，请寻求执法部门协助。

    - **如果他们出现在现实生活中怎么办**：如果是紧急情况，请拨打 `911`。如果用户无法逃离现场，请去安全的地方，然后拨打 `911`。


    ### 联系执法部门


    如果警方不知道犯罪发生，他们就无法提供帮助。案件看起来可能很小，但报告它可以让当局了解犯罪分子正在作案。用户的报告即使很微小，也可能为执法提供必要的信息。其他考虑因素包括：


    1. 如果有人面临危险，始终联系执法部门。

    2. 向保险公司报告损失通常需要警方报告单号。

    3. 联系发生诈骗的公司和银行。

    4. 向所有信用报告机构申请信用卡警告。


    ### 举报网络犯罪


    第 6 章（本卷；表 6.9 和 6.10）提供了举报网络犯罪的执法部门联系方式。执法部门需要各种信息，指向谁、什么、何地、何时以及为什么。以下是举报时可能需要的信息。


    #### 记录


    记录是执法部门可以用于调查的证据，一画胜于千言。


    '
