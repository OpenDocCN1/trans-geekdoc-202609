  trans: '


    虚假发票有时会被发送给 SHB。它们模仿了 SHB 可能订购的产品或服务。诈骗者希望负责支付费用的人员假设这些费用是合法的并进行付款。诈骗子还会致电 SHB，通过验证地址或提供免费目录或样品来确认一个虚假订单。如果
    SHB 对诈骗子的任何询问回答了“是”，未订购的商品就会送达 SHB。随后，诈骗子会进行高压付款要求。请记住，在美国，收到的任何未订购商品都可以保留，而无需付款。图
    8.1 是钓鱼邮件和附件的示例。请注意正在发生的网络钓鱼尝试类型，在不确定邮件真实且并非来自诈骗者之前，不要点击邮件或其附件。


    ![](img/fig8-1.jpg)


    图 8.1  发票钓鱼示例。


    ## 在线列登与广告诈骗

    诈骗子还会试图欺骗 SHB 为不存在的广告或虚假商业目录中的列登付费。他们将再次利用策略来获取 SHB 的确认。稍后，SHB 将收到一张巨额账单，诈骗子可能会利用之前的互动细节甚至录音来施压付款。


    ## 假冒业务与政府诈骗

    SHB 也不受这种诈骗的影响。假装成信任实体的诈骗子会试图恐吓 SHB 付款或提供信息。他们会假装是公用事业公司，威胁关闭将业务运营的服务。某些诈骗子会声称他们是
    Web 托管公司，威胁如果不立即付款，SHB 将失去其网站 URL。他们假装成政府人员，威胁要吊销营业执照、罚款或提起民事诉讼。有些人会试图销售 SHM 可以免费获取的职场合规海报。另一些则会试图说服
    SHB 为不存在的业务拨款支付申请费。


    ## 技术支持诈骗

    技术支持诈骗也针对 SHB。其目标是获取资金或计算机系统，或两者兼有。诈骗子向毫无防备的员工声称他们是 SHB 的技术支持，需要访问权限以帮助进行更新或其他其他不存在的问题。一旦获得访问，诈骗者就会猎取
    SHB 的敏感数据，如密码、客户记录或信用卡信息。


    ## 社会工程学、钓鱼与勒索软件

    网络诈骗者欺骗员工相信他们是主管或高级员工，诱使他们发送资金或提供机或敏感信息（如密码或银行信息）。这可能始于钓鱼邮件、社交媒体联系或电话，并强调提供信息的紧迫性。诈骗子将使用鱼叉式钓鱼策略向特定员工发送针对性邮件以获取访问权限。恶意邮件用于欺骗员工点击链接以感染其系统或加密数据，而数据只能通过向诈骗子支付费用来解密。


    ## 业务教练诈骗

    某些诈骗子会用虚假的业务教练计划欺骗 SHB。这些计划使用虚假的证言、视频、研讨会演示和推销电话，承诺帮助 SHB 增长。他们可能从低初始成本开始，并随着提供的服务增加而增加。增长的承诺从未实现。


    ## 更改在线评价

    某些诈骗子会声称通过少量费用发布在线评价来帮助 SHB。另一些则可能会收取费用将 SHB 下架。


    ## 信用卡处理与设备诈骗

    诈骗子还会试图欺骗 SHB 为不存在的广告或虚假商业目录中的列登付费。他们将再次利用策略来获取 SHB 的确认。稍后，SHB 将收到一张巨额账单，诈骗子可能会利用之前的互动细节甚至录音来施压付款。


    ## 假冒业务与政府诈骗

    SHB 也不受这种诈骗的影响。假装成信任实体的诈骗子会试图恐吓 SHB 快速付款或提供信息。他们会假装是公用事业公司，威胁关闭将业务运营的服务。某些诈骗子会声称他们是
    Web 托管公司，威胁如果不立即付款，SHB 将失去其网站 URL。他们假装成政府人员，威胁要吊销营业执照、罚款或提起民事诉讼。有些人会试图销售 SHM 可以免费获取的职场合规海报。另一些则会试图说服
    SHB 为不存在的业务拨款支付申请费。


    ## 技术支持诈骗

    技术支持诈骗也针对 SHB。其目标是获取资金或计算机系统，或两者兼有。诈骗子向毫无防备的员工声称他们是 SHB 的技术支持，需要访问权限以帮助进行更新或其他其他不存在的问题。一旦获得访问，诈骗者就会猎取
    SHB 的敏感数据，如密码、客户记录或信用卡信息。


    ## 社会工程学、钓鱼与勒索软件

    网络诈骗者欺骗员工相信他们是主管或高级员工，诱使他们发送资金或提供机密或敏感信息（如密码或银行信息）。这可能始于钓鱼邮件、社交媒体联系或电话，并强调提供信息的紧迫性。诈骗子将使用鱼叉式钓鱼策略向特定员工发送针对性邮件以获取访问权限。恶意邮件用于欺骗员工点击链接以感染其系统或加密数据，而数据只能通过向诈骗子支付费用来解密。


    ## 业务教练诈骗

    某些诈骗子会用虚假的业务教练计划欺骗 SHB。这些计划使用虚假的证言、视频、研讨会演示和推销电话，承诺帮助 SHB 增长。他们可能从低初始成本开始，并随着提供的服务增加而增加。增长的承诺从未实现。


    ## 更改在线评价

    某些诈骗子会声称通过少量费用发布在线评价来帮助 SHB。另一些则可能会收取费用将 SHB 下架。


    ## 信用卡处理与设备诈骗

    诈骗子还会试图欺骗 SHB 为不存在的广告或虚假商业目录中的列登付费。他们将再次利用策略来获取 SHB 的确认。稍后，SHB 将收到一张巨额账单，诈骗子可能会利用之前的互动细节甚至录音来施压付款。


    ## 虚假支票诈骗

    之前讨论过过度付款。在这种情况下，诈骗者针对 SHB。


    ## 实施最佳实践

    即使是最小的企业也应该有一些关于接受实践的文档。为了防止意外，所有员工应接受培训。表 8.1 提供了一个清单。


    ### 表 8.1 预防清单


    | 行动 | 日期 |

    | --- | --- |

    | 培训员工以防欺诈 | |

    | 验证付款并分离职责 | |

    | 维护内部控制 | |

    | 了解员工 | |

    | 精通技术：学习技术 | |

    | 保护客户信息 | |

    | 考虑购买保险 | |

    | 向 FTC 或执法部门报告诈骗 | |


    ### 免费和低成本在线学习内容

    SHB 所有者及其员工需要定期了解网络安全。员工意识培训可以从国家标准与技术学院的网络安全教育倡议 (NICE) 获取：`https://www.nist.gov/itl/applied-cybersecurity/nice/online-learning-content`(https://www.nist.gov/itl/applied-cybersecurity/nice/online-learning-content)。网站上的链接提供免费或低成本的在线培训。主题涵盖信息技术到网络安全等。考虑将这些网站作为常规教育计划。


