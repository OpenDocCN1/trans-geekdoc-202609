    # 6. 社交媒体隐私


    用户应该使用社交媒体上的隐私设置。社交媒体平台拥有隐私设置，允许用户控制谁可以查看他们的帖子和个人信息。根据自己的舒适度检查并调整这些设置是非常关重要的。让账户对互联网上的所有人开放可能不是个人安全水平的最优选择。用户应定期检查这些设置，以确保它们保持准确无误。


    在数字时代，社交媒体公司、数据聚合者和手机制造商收集用户每一次在线操作的信息是一项常见做法。许多公司使用数据跟踪和分析来更好地了解其受众并投放更具针对性的广告。为了保护信息免受这些公司的侵害，用户可以使用广告拦截器并限制在网上分享的个人信息量。用户还可以查看并调整各种网站和应用程序上的隐私设置。此外，留意自己点击的内容和访问的网站也有助于减少被收集的数据量。


    定期检查并删除不再使用的应用程序和账户也是一个好主意，可以最大限度地减少数字足迹。用户应该关注数据泄露事件，并在数据遭到泄露时采取措施保护自己的信息。总之，对自己的在线活动保持警惕和谨慎对保护个人信息大有益。


    ## 隐私与安全


    在线安全是指为了保护在线信息和系统免受未经授权的访问和潜在威胁而采取的措施。这包括实施强密码、使用防火墙和防病毒软件，以及频繁更新软件和系统以防止黑客入侵。在线安全旨在确保在线数据和服务的机密性、完整可用可用。


    相反，在线隐私是指个人对其在线信息收集、使用和共享的控制。这包括保持姓名、地址和财务细节等个人信息的私密，并在未经同意的情况下不与第三方共享。在线隐私还涉及能够在在线上浏览、通信和进行交易，而不必被监控或在未经许可的情况下被收集个人信息。在线安全侧重于保护数据免受外部威胁，而在线隐私侧重于保护个人信息免受未经许可的访问或使用。


    ## 浏览器功能


    访问互联网不仅仅是使用万维网。在浏览器中输入统一资源定位符（`URL`）或地址（或点击 Google 或其他搜索引擎中的链接）背后有一整套过程。技术方面已写在许多书中。为了让人访问互联网上喜爱的网站，背后有很多大量工作。从安全的角度来看，用户必须知道浏览器向他人和网站透露了关于他们的什么信息。只有拥有这些知识，他们才希望限制自己的风险暴露。


    ### 选择浏览器


    考虑哪个浏览器具有最强大且最可靠的安全功能是非常重要的。一些流行的浏览器，如 `Google Chrome` 和 `Mozilla Firefox`，提供了针对恶意软件和网络钓鱼尝试的内置保护。将浏览器更新到最新的安全更新和补丁以确保获得最大的保护也很重要。此外，寻找一个允许自定义安全设置的浏览器，例如调整隐私级别和阻止某些类型的
    cookie。


    选择在保护用户数据和尊重隐私权方面有良好记录的浏览器。提供私人浏览或无痕模式功能的浏览器也可以通过不存储您的浏览记录、cookie 或登录信息来增加额外的安全保障。此外，考虑提供广告拦截器或反跟踪技术功能的浏览器，因为这些功能也能帮助保护用户的在线安全和隐私。最终，仔细研究和比较不同的浏览器，以确定哪一个能为用户的特定需求和疑虑提供最佳安全功能是至关重要的。


    ### 浏览器初始设置


    在下载和安装新浏览器时，可以考虑的因素包括阻止 cookie。这在每个浏览器中都不同。但为了防止网站跟踪你是谁，这是必须的。每个浏览器处理阻止 cookie
    的方式不同。


    对于 `Chrome` 浏览器，点击屏幕右上角的三个点图标。这将打开一个弹出窗口。点击`设置`。在图 3.2 中显示的新标签页将允许用户访问`隐私和安全`设置。用户要找到访问其特定浏览器安全设置的方法，应使用以下搜索参数进行
    Google 搜索：`browser privacy and security settings + (特定浏览器)`。


    ![](img/fig3-2.jpg)


    图 3.2 Chrome 浏览器“隐私和安全”设置。


    ### 持续浏览器维护


    人们需要定期清理杂物并移除 cookie、浏览历史和临时 Internet 文件。用户可以使用能够从系统中移除跟踪设备的工具，例如 `CCleaner`、`Bit
    Bleach`（因用于希拉里·克林顿的系统而闻名）。也可以在浏览器设置下完成。在浏览器的`隐私和安全`部分有多个保护自己的选项。默认设置`允许网站保存和读取
    cookie 数据（推荐）`是开启的。从安全的角度来看，这对于用户来说不是最有效的选项，因为无法阻止公司或恶意分子跟踪他们的浏览。最好的选项是选择`阻止第三方
    cookie`，但用户必须理解，如果选择了此项，某些网站将无法正常显示。问题是用户想要安全还是极佳的网站体验？这是用户的选择，或者是运气，是安全还是让恶意分子有机会访问他们的系统。图
    3.3 描述了浏览器如何与网站通信以向浏览器带来数据并在计算机上生成网站。


    ![](img/fig3-3.jpg)


    图 3.3 浏览器与服务器的通信。


    ![](img/fig3-4.jpg)


    图 3.4 双重认证。


    ## 额外的隐藏措施


    隐藏数据寻求公司的一种简单方法是虚构身份。这是合法的，但可能违反网站的服务条款。只要不从事违法行为，在互联网上使用“账号”（虚在线身份）是常见的。这是一种极端措施，需要大量精力来确保定期使用虚假信息。当用户想使用真实身份在
    `Amazon` 上购买东西时可能会出现问题。浏览器可能会暴露用户的真实身份。


    ## 私密模式


    还有许多可下载的阻止 cookie 和网站的应用程序。有些作为浏览器扩展提供，但取决于你正在使用的浏览器。有许多不同的广告拦截软件，如 `ADBlock`
    或 `Ghostery`，你可能想调查这些以协助你的保护。


    '
