- raw: "Extended Fraud Alert\n\nAn extended fraud alert is a notification that appears\
    \ on the user’s credit reports for seven years. It asks lenders to verify the\
    \ user’s identity before processing credit or loan applications. The extended\
    \ fraud alert was designed for identity theft victims to add a more extended period\
    \ of protection on their credit history. The alert requires more information from\
    \ the victim, and generally requires the submission of a law enforcement report\
    \ to verify the status as an identity theft victim. [Table 9.6](#chapter09.xhtml#tab9-6)\
    \ provides the reader with an outline of the Extended Fraud Alert concept.\n\n\
    TABLE 9.6  Extended Fraud Alerts\n\n| Who can place one: || An extended fraud\
    \ alert is only available to people who have had their identity stolen and completed\
    \ an FTC identity theft report at [IdentityTheft.gov](http://IdentityTheft.gov)\
    \ or have filed a police report. |\n\n| --- | --- |\n\nThree Major Credit Bureaus\
    \ Freeze Services\n\nIn the United States the credit bureaus work independently\
    \ and require that each one is contacted to add alerts. [Table 9.7](#chapter09.xhtml#tab9-7)\
    \ is a listing of the contact information the user can use to set up an alert.\
    \ [Table 9.8](#chapter09.xhtml#tab9-8) is a listing of the contact information\
    \ for credit bureaus outside of the United States.\n\nTABLE 9.7  U.S. Credit Bureau\
