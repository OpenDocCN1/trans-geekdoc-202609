    Closing social media accounts after a family member’s death may seem like a cold
    and impersonal task, but it is essential to address the emotional aspect of it.
    Social media has become a platform for people to express their thoughts, feelings,
    and memories. For the deceased, their social media accounts serve as a digital
    representation of their life. Therefore, it is essential to handle these accounts
    with sensitivity and respect.


    It is also crucial to highlight the importance of removing personal information
    and photos from the deceased’s social media accounts. These accounts hold a wealth
    of personal data that should not be left unattended. Not only can it be used for
    malicious purposes, but it also goes against the deceased’s right to privacy.
    Therefore, it is essential to take the necessary steps to protect their identity
    and reputation.


    Aside from the practical reasons for closing a deceased family member’s social
    media account, there is also an emotional aspect to consider. Social media can
    be a way to keep memories alive, and the thought of permanently removing a loved
    one’s online presence can be challenging to come to terms with.


    One way to preserve the deceased’s digital memories is by creating a memorial
    page on the social media platform. This allows friends and family to continue
    sharing memories, stories, and messages to honor the deceased. Another option
    is to download photos and videos from the accounts and store them in a physical
    storage device, providing a tangible way to remember and cherish the deceased’s
    online presence. This can be done by downloading photos and videos to a physical
    storage device, such as a `USB drive` or external hard drive. Search the social
    media platform’s help section for how to download the account. This way, family
    members can keep and cherish these memories for years to come. [Table 6.9](#chapter06.xhtml#tab6-9)
    reflects things to consider when closing the deceased social media accounts.


    ### TABLE 6.9 Considerations for Closing Social Media for the Deceased


    | Action | Description |

    | :--- | :--- |

    | 1. Choose a person to manage the process | The first step is to select a trusted
    family member or friend to handle the closure of the deceased’s social media accounts.
    This person will need access to the accounts and should have a clear understanding
    of the deceased’s wishes. |

    | 2. Gather necessary information | Before starting the account closure process,
    it is essential to collect all the necessary information, including login credentials,
    email addresses associated with the accounts, and any other relevant details.
    |

    | 3. Contact the social media platform | Each social media platform has its own
    process for closing accounts of deceased users. It is best to reach out to them
    directly and follow their specific instructions. Some platforms, such as `Facebook`,
    have a designated option for memorializing an account, where the profile is kept
    as a digital memorial for friends and family to remember the deceased. |

    | 4. Provide necessary documents | Some social media platforms may require certain
    documents to verify the death, such as a death certificate or obituary. It is
    important to follow their instructions and provide the necessary documents to
    ensure the account is closed properly. |

    | 5. Delete personal information | Once the accounts are closed, it is crucial
    to remove any personal information or photos of the deceased. This includes removing
    tags, posts, and comments that might contain sensitive information. It is also
    essential to check if the deceased had any other online accounts, such as email
    or online banking, and close them to prevent any potential identity theft. |


    The following list provides general steps for closing a loved one’s accounts:


    1. Log into the social media accounts using the provided credentials.

    2. Go to the settings or account management section.

    3. Look for an option to “deactivate” or “delete” the account.

    4. If there is an option to deactivate, this will temporarily suspend the account
    and it can be reactivated later. If the user wants to permanently delete the account,
    look for an option to “delete” or “close” the account.

    5. Follow the prompts and confirm the deletion of the account.

    6. Repeat this process for all social media accounts belonging to the deceased.


    Dealing with the passing of a loved ones passing can be terribly tough especially
    when dealing their personal social media which could include their private messaging.
    [Table 6.10](#chapter06.xhtml#tab6-10) has include some resources for dealing
    with the grief of the loved ones passing. We all handle grief differently. Don''t
    be afraid to connect with these on-line or other local resources if you need to
    discuss the events.


    ### TABLE 6.10 Online Resources Grief Support


    | Group | Description | Web address |

    | :--- | :--- | :--- |

    | GriefShare | Offers online grief support through video-based sessions, online
    resources, and an online grief support community. | [https://www.griefshare.org](https://www.griefshare.org)
    |

    | The Compassionate Friends | Provides a variety of online grief support resources,
    including chat rooms, virtual support groups, and online forums. | [https://www.compassionatefriends.org](https://www.compassionatefriends.org)
    |

    | National Alliance for Grieving Children | Offers online support groups and webinars
    for children, teens, and their families who are grieving the loss of a loved one.
    | [https://childrengrieve.org](https://childrengrieve.org) |

    | Modern Loss | This online community offers support, resources, and personal
    essays for people who have experienced loss. | [https://modernloss.com](https://modernloss.com)
    |

    | Open to Hope | This Web site provides articles, podcasts, and videos on grief
    and loss, as well as an online community for support and connection. | [https://www.opentohope.com](https://www.opentohope.com)
    |


    ### CONCLUSION


    It is never too late to act and implement safety measures to protect our loved
    ones in the digital world. By being proactive and staying informed, we can create
    a safe and secure online environment for our family members. This can involve
    setting up privacy settings on social media accounts, using secure passwords,
    and regularly updating our devices and software. It is also important to have
    open and honest conversations with our family members about the potential dangers
    of the Internet and how to stay safe. With the right tools and knowledge, we can
    all play a role in protecting ourselves and our loved ones in the digital world.


    There are many resources available for those looking to learn more about online
    safety and security. Government agencies, nonprofit organizations, and technology
    companies offer a variety of educational materials and support programs. Additionally,
    there are many online courses and tutorials available for those looking to improve
    their digital literacy. By taking advantage of these resources, we can continue
    to learn and adapt with technology, and in turn, better protect ourselves and
    our loved ones in the digital world. Make a commitment to stay informed, stay
    vigilant, and take necessary steps to ensure a safe and secure online experience
    for ourselves and our adult family members.


    ### REFERENCES


    U.S. Department of Justice


    Office of Public Affairs. 2023\. “Four Individuals Charged for Laundering Millions
    from Cryptocurrency Investment Scams.” U.S. DOJ Press Release 23-1419, December
    14, 2023. [https://www.justice.gov/opa/pr/four-individuals-charged-laundering-millions-cryptocurrency-investment-scams](https://www.justice.gov/opa/pr/four-individuals-charged-laundering-millions-cryptocurrency-investment-scams)


    Federal Bureau of Investigation Internet Crime Complaint Center. 2024\. “2023
    IC3 Elder Fraud Annual Report.” [https://www.ic3.gov/Media/PDF/AnnualReport/2023\_IC3ElderFraudReport.pdf](https://www.ic3.gov/Media/PDF/AnnualReport/2023_IC3ElderFraudReport.pdf)

