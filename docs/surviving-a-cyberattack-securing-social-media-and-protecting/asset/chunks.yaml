- raw: 'We are not here to recommend or disapprove monitoring applications. They are
    an invasion of privacy and should be carefully considered before including them
    in one’s efforts to manage their child’s cyber risk. They should not be a standard
    process for every household. The user is definitely better off if they can use
    restrictions as opposed to active monitoring. In some extreme situations, such
    as cases where the child has either been a cyberoffender or a cybervictim, particularly
    bullying, it may be justified. The user is encouraged to consider all the caveats
    that have been discussed and seek legal guidance before deploying this extreme
    management measure on their child’s devices.


    EDUCATING CHILDREN ON SOCIAL MEDIA PASSWORDS


    The user’s children are likely on social media, even if they say they are not.
    A brief search on Instagram or Pinterest will probably find their pages. Kids
    today mostly avoid Facebook. Some accounts there are just to satisfy their parents
    that they are not doing anything online to be concerned with. The best thing to
    do is start early with them about password usage on their accounts. Give them
    the lessons learned in [Chapter 4](#chapter04.xhtml) about passwords. Tell them
    not to share their passwords. As we know, childhood friends today can be enemies
    tomorrow. Password sharing can be emotionally detrimental when someone fakes the
    user’s child’s posts and says or does something mean or embarrassing. As we have
    seen in the past, it doesn’t have to be the children. Parents can be just as mean
    and callous (or even criminal) toward other children online. Users need to stress
    to their children to immediately change their password if there is a data breach
    and not wait for a notice from the social media provider to do it. It should also
    be stressed not to keep their password written down on paper or a sticky note
    on their computer.


    CRIMES CHILDREN ENCOUNTER ONLINE


    Online victimization is not limited to adults. Children can fall for and are subject
    to a variety of scams and criminal offenses. Parents need to be ever vigilant
    not only on the playground but in the virtual environments our children play.
    The following are a few of the possible offenses to be aware of:


    Cyberbullying. Bullying of any kind is detrimental to our children. Bullying on
    the Internet can be overwhelming and unusually harmful. Children today spend so
    much time on their technology that encountering someone who can be mean is probably
    more likely than not. Bullying that commences offline, such as in school, can
    be even more harmful when it includes online harassment. Bullying victims targeted
    offline and online can never get a break from the abuse, even in their own homes.


    Cyberpredators. There are both men and women on the Internet that prey on our
    children. These predators may try and physically meet a child, but some, through
    trickery and blackmail, convince children to expose themselves for financial gain.
    Tragically, there have been sex extortion cases where the victim commits suicide.
    The National Center for Missing & Exploited Children (NCMEC) has an interactive
    experience, No Escape Room ([https://noescaperoom.org/](https://noescaperoom.org/))
    that exposes parents and caregivers to the real-world threat from financial sextortion
    of minors \[NCMEC 2024\].


    Phishing. This term refers to people(s) who use email messages to trick a receiver
    into clicking on a link or attachment that has malicious content which can lead
    to data and identity theft and fraud.


    Other Online Considerations


    Things posted on social media can remain on the Internet for years. Something
    the user’s child posted a few years ago might not be socially acceptable today.
    Teaching children to protect themselves includes not posting material that is
    inflammatory, sexual, or bigoted. It can’t be stressed enough that minors need
    to be careful what they post online.


    Make sure children are aware that schools also often have policies about posting
    online content. Information posted online, even outside of school, can result
    in discipline if it violates school rules.


    Children also need to understand that not everything that appears online is fact.
    This is a hard one even for adults. At a young age children need to learn to be
    cautious about what they see online. This is going to be harder as artificial
    intelligence is increasing being used to manipulate images and videos or fabricate
    stories. The implications of not being more critical of online posts should be
    apparent. Recently, a young female student was caught carrying a knife to school.
    When asked why she was carrying a knife she replied that there were posts on a
    social media site cautioning young women to be careful as it was National Rape
    Day. She was carrying the knife as she was expecting to be attacked due to this
    fictitious occasion.


    The above incident is less likely to occur if the child understands they can come
    to a parent if they see something online that is questionable or just not right.
    This requires the parent to have a discussion defining problem material, which
    can range from bullying toward them or others, threatening violence, suicide ideations
    or threats, or sexually explicit posts.


    MONITORING CHILDREN’S ONLINE ACTIVITIES


    In today’s digital age, it is crucial for parents to closely monitor their children’s
    online activities. With the vast amount of information and content available on
    the Internet, there are also risks and dangers that children may be exposed to.
    It is important for parents to be aware of where their children go online and
    what they are doing in order to protect them from potential online scams and predators.
    By monitoring their children’s online activities, parents can better guide and
    educate them on safe Internet practices, as well as identify any red flags or
    warning signs that may indicate their child is being targeted by scammers or other
    malicious individuals.


    Monitoring where one’s children go and what they are doing online is only one
    of the methods to ensure others don’t take advantage of them online. The other
    is to educate them on the following:


    1.Be selective when accepting friends, posting, and clicking. Don’t accept requests
    from individuals they don’t know, even those who appear to be children.


    2.Think twice before they post. Remember posts can have a very long shelf life
    and can literally be seen by anyone.


    3.Be careful where they check in from.


    4.Don’t share personal information online.


    5.Don’t send pictures to others, even if they know them. This one is harder than
    we think because kids post everything online.


    6.Be mindful of phishing scams.


    7.Don’t use social media credentials to sign into third-party sites.


    8.Avoid quizzes and games that require access to profile information.


    9.Don’t believe everything that is posted online. Verify information with multiple
    sources and check with a trusted adult about the information.


    10.Make them cautious about groups or causes they follow. Joining or following
    inappropriate groups, such as those who are racist or extremist, can impact their
    lives later in life.


    INSTILLING GOOD CELL PHONE HABITS'
