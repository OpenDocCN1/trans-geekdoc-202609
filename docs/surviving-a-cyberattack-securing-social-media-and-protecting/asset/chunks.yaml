    # 章节概述


    本章概述了小型家庭企业（SHB）保护其系统和数据的最佳实践。这些实践包括培训员工以及建立使用准则，涵盖社交媒体的使用规定。文中涵盖了多种数据备份方法，以及在数据不再需要时安全地销毁数据。第
    9 章将讨论如何应对网络攻击。


    ## 参考文献


    联邦贸易委员会. 2024\. “诈骗与您的小微企业：业务指南。”联邦贸易委员会，2024 年 7 月。[`www.ftc.gov/business-guidance/resources/scams-your-small-business-guide-business#comm`](https://www.ftc.gov/business-guidance/resources/scams-your-small-business-guide-business#comm)
    关于诈骗。


    # 第 9 章：在数字（网络）攻击中生存


    ## 本章内容


    本章讨论了如何预防、生存和应对特定的网络攻击，并强调了之前章节中涵盖的步骤。


    ## 在网络攻击中生存


    网络攻击被视为对设备或数据的破坏或盗窃。该术语已扩大到包括对个人产生的影响（不仅数据或设备），例如网络跟踪、他人发布前情人的非法图片（报复性色情）或人肉搜索（doxing），即在社交媒体网站上发布个人信息（如地址和电话号码）进行骚扰。网络攻击还包括利用计算机性剥儿童以及情感/心理脆弱的人群。这些攻击以不同的方式发生（参见图
    9.1）。攻击者可能会尝试访问您的设备以窃取数据，或植入恶意软件以加密数据索勒金。对于网络跟踪者，他们可能在用户的系统中插入间谍软件以跟踪其在线和线下活动。在其他情况下，例如网络欺凌，他们可以在不直接访问用户数据或系统的情况下，在网上骚扰用户或亲友。他们经常攻击最脆弱的群体，我们的孩子和年长的亲友。要在任何此类攻击中生存需要一些计划和冷静的应对。存在许多类型的潜在网络攻击可能会损害、禁用或盗取数据。表
    9.1 中提到了一些常见的攻击及其预防方法。


    ![](img/fig9-1.jpg)


    图 9.1  常见的网络威胁。


    表 9.1  攻击与预防。


    | 攻击 | 预防 |

    | --- | --- |

    | 恶意软件：下载到计算机中的恶意文件。该文件可能窃取信用卡数据、收集用户击键记录和密码，并/或加密设备数据索要勒金。这完全取决于软件的预设功能。木马程序：木马（Trojan
    horse）是一种通过隐藏在合法内容中来传递载荷的恶意软件。这可能是来自恶意网站的软件下载更新，也可能是电子邮件中的链接或看似合附件，其中包含恶意软件。勒索软件：一种专门用于加密用户计算机上的文件并要求勒金以获取解密密钥的恶意软件程序。黑客希望在通常隐藏在暗网的特定网站上获得加密货币支付。
    | 1. 避免从未识别的来源下载程序。2. 保持杀病毒软件更新。3. 备份所有数据。（建议参见第 8 章）。 |

    | 社会工程：操纵人员使其泄露机密信息。社会工程是心理操纵的艺术。其目标是让人执行某些操作。犯罪分子使用这些方法是因为更容易被利用。网络钓鱼（Phishing）、针对性网络钓鱼（Spear
    phishing）、短信钓鱼（Smishing）都是社会工程的形式。 | 4. 绝不要通过电话提供信息。5. 不要理会你认识提出的请求。6. 不要点击电子邮件或短信中的链接。
    |

    | 网络跟踪/网络骚扰：利用互联网或其他手段进行骚扰、恐吓。这包括儿童和成人。这包括他人发布前情人的非法图片（报复性色情）或人肉搜索，即在社交媒体网站上发布个人信息（如地址和电话号码）以骚扰目的。
    | 7. 限制发布的个人信息数量。8. 检查所有账户的隐私设置。9. 开启本书之前讨论过的双重身份验证。 |


    ## 网络钓鱼、针对性网络钓鱼和短信钓鱼


    网络钓鱼诈骗是来自政府、银行或知名公司的官方外表电子邮件，旨在诱骗受害者暴露其系统。邮件可能包含一个链接或其他需要遵循的指令，欺骗受害者向攻击者提供个人或公司信息，例如银行详情或账户的登录名和密码信息。钓鱼攻击频繁涉及向用户发送成百上千封封邮件，冒称来自特定的银行或公司，随机希望其中某些目标确实与他们冒称的实体有关系。针对性网络钓鱼使用相同的技术，但它是有针对性的攻击，通常针对企业或政府机构。他们会冒称是目标会信任的实体。例如，他们会创建一封伪造成目标雇主内部（如总裁）的电子邮件，以说服目标采取对雇主不利的操作。寻求的操作各异，但可能包括允许攻击者访问雇主的系统，或说服他们汇款资金。短信钓鱼（Smishing）与网络钓鱼相同，但通过发送短信而非电子邮件来实现。图
    9.2 是另一个网络钓鱼邮件的示例，使用了接收者可能实际使用的知名公司。在如今的电子邮件安全中，审查收到的任何邮件都是必要的，特别是当这些邮件来自已知服务时。诈骗者复制知名服务，并刻意使用相同的信息和图像试图欺骗你点击邮件，然后使用你的登录名和密码访问账户。不幸的是，那个网站是诈骗者的，而你刚刚给了他们登录名和密码，他们可以利用这些接管你的账户。


    ```

    ![](img/fig9-2.jpg)

    ```

    图 9.2  电子邮件钓鱼示例。


    '
