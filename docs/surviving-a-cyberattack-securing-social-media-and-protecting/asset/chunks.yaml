    公共事务办公室。2023\. “四人因洗钱加密货币投资诈骗资金被指控”。美国司法部新闻稿 23-1419，2023 年 12 月 14 日。[`www.justice.gov/opa/pr/four-individuals-charged-laundering-millions-cryptocurrency-investment-scams`](https://www.justice.gov/opa/pr/four-individuals-charged-laundering-millions-cryptocurrency-investment-scams)


