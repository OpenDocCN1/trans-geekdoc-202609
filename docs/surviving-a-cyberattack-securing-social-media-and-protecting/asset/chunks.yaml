  trans: "\n\n在当今世界，社交媒体和在线平台为犯罪分子获取可能作为目标或身份的面部图像提供了丰富的宝库。这项技术允许攻击者在公共场所拍摄潜在受害者的照片，并将其上传到人脸识别网站。一旦这样做，该网站可能会将照片与受害者的社交媒体账户关联，从而获取该人的真实姓名、地址等信息。这可能导致现实生活中的跟踪并对受害者造成潜在伤害。\n\
    \n人脸识别软件还可以帮助收集真实个人的照片。这些收集来的照片被用于支持虚假资料，进而针对他人进行欺诈或更恶劣的行为。通过这种方式，真人（通常是成人娱乐明星）的照片在各种场景下被收集，并用于在约会网站上创建虚假档案。\n\
    \n## 结论\n\n随着技术的不断进步，犯罪的未来将发生巨大变化。随着 `AI`、大数据和 `IoT` 的广泛使用，犯罪分子将拥有更复杂的工具来实施其非法活动。此外，加密货币和其他数字形式货币的兴起将使犯罪分子更容易进行洗钱和隐藏踪迹。随着犯罪分子越来越擅长利用技术漏洞并针对毫无防备的受害者，网络犯罪将继续增加。\n\
    \n通过利用预测分析和机器学习，执法机构能够识别犯罪模式并预测潜在的犯罪行为。实时监控和人脸识别软件也将协助追踪嫌疑人和破破案件。这种情况正在欧洲和中国发生。智能城市也可以在减少犯罪方面发挥作用。在城市地区整合技术将允许安全措施的进步，包括自动人脸识别和生物识别系统。这可能威慑犯罪分子，并使识别和追踪他们变得更容易。即使是使用区块链技术也可以创建一个防篡改的系统来存储证据并确保法律程序中数据的完整性。所有这些技术变化必须取得平衡，特别是在西方世界，要在个人隐私权与政府解决犯罪的需求之间。技术并非一无处。书中讨论的方法和流程将帮助用户应对网络威胁。对于社会而言，保持警惕并适应未来的变化以防止和打击网络犯罪活动是至关重要的。\n\
    \n## 参考文献\n\n- Caulfield, M. (2019). “SIFT (四步法).” Hapgood, June 19, 2019. [`hapgood.us/2019/06/19/sift-the-four-moves/`](https://hapgood.us/2019/06/19/sift-the-four-moves/)\n\
    - 行政命令第 14110 号. “人工智能的安全、安全和可赖的发展与使用.” 2023 年 10 月 30 日发布。\n- [`www.whitehouse.gov/briefing-room/presidential-actions/2023/10/30/executive-order-on-the-safe-secure-and-trustworthy-development-and-use-of-artificial-intelligence/`](https://www.whitehouse.gov/briefing-room/presidential-actions/2023/10/30/executive-order-on-the-safe-secure-and-trustworthy-development-and-use-of-artificial-intelligence/)\n\
