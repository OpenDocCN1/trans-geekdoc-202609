    \ weird emails, and weird phone calls. Always be suspicious and don’t just believe\
    \ people or messages one receives. If the user doesn’t know who they are from,\
    \ delete them.\n\n### 4. Use two-factor authentication.\n\nTwo-factor authentication\
    \ should be turned on for every app one uses. If the app does not verify your\
