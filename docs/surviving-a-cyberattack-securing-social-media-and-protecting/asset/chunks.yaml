- raw: 'Online debit cards and credit cards are two different things. They end up
    using the same credit transaction system, but they are legally different and the
    user’s personal liability and the bank’s requirement to replace the funds may
    be different. A debit card is like a modern check transaction. It is a debit against
    funds the user actually has in their account. A credit card is an extension of
    credit and is the banking institution’s money. Depending on the circumstances
    of the fraud encountered the bank may not be as quick to replace personal funds
    as it will be to deal with a loss on credit that was provided. Debit cards have
    better security than in the past. There is still the possibility a fraudster can
    access their bank account through a debit card and drain personal funds. Using
    a credit card to make online purchases is most often the best security option.


    Third-Party Wallets or Virtual Cards


    A good way to help prevent fraud when making purchases online is to use a third
    party wallet which is available if the user has an account with Google, Apple,
    or PayPal. They have a payment system that can be used to protect the user’s transactions.
    They use a process called tokenization. They provide a virtual credit card number
    or payment through their system and not the user’s original card.


    Many credit card companies offer virtualized cards as an option. [Privacy.com](http://Privacy.com)
    ([https://privacy.com/](https://privacy.com/)) also offers a service of virtual
    cards numbers to help prevent the user from becoming a victim.


    Report Problems Immediately


    Report any unauthorized transactions on debit/credit card immediately. This should
    be to the banking institution and law enforcement. The sooner the report is made
    the sooner the funds can be returned to the user’s account. Law enforcement will
    generally provide a case number which the bank may want as proof the crime has
    been reported.


    TABLE 7.1  Online Transactions Security Checklist


    | Item to check || Action || Verified |


    | --- | --- | --- |


    | Regularly check your credit/debit accounts || Check account activity regularly.
    Is there a transaction that was not authorized? Contact the bank if something
    unusual or questionable is detected. ||  |


    | Credit/debit card PIN protection || Do not give a personal identification number
    to anyone strangers, family members or any caller. ||  |


    | Avoid public networks || Public Internet networks (coffee shops, airports, and
    other public places) are not secure. If a user must use one consider the use of
    a VPN to prevent eaves dropping. ||  |


    | Strong passwords || Again, strong passwords especially on financial and banking
    information is critical to preventing becoming a victim of a crime. ||  |


    | Use secure Web sites || Look for the little lock feature on the Web sites. This
    means they are secure. Make sure to look for it before entering debit or credit
    details. If it is not present stop entering information. ||  |


    | Look for phishing attacks || Phishing can take the form of a fake Web site or
    account login page that appears to be legitimate but is not. Blindly following
    links in an email, text message or even from a Web page can be dangerous. ||  |


    | Two-factor authentication (2FA) || Ensure two-factor authentication is set for
    banking information. ||  |


    | Account alerts || Setup up account alerts for transactions of any kind to notify
    when something is transacted on the user’s account. ||  |


    TABLE 7.2  In Person Exchanges of Goods


    | 1. || Police provide their presence to make sure everyone is safe. Departments
    will have rules about onsite exchanges, such as specific hours of availability,
    appointments required, and no firearms. If possible, have the meeting inside the
    department. |


    | --- | --- |


    | 2. || Meet only during daylight hours unless the police department has offered
    inside facilities twenty-four hours a day. |


    | 3. || Police will not get involved in the transaction details. If the item being
    exchanged might be stolen some police departments may be willing to check the
    serial number of a sale item to determine if it’s in a database of stolen property.
    |


    | 4. || Be careful carrying a large sum of cash, either before or after the transaction.
    Take precautions to protect against being followed when the transaction is completed.
    Follow this chapter’s precautions on accepting checks or other payment forms.
    |


    Some items are impractical to meet at a police station for exchanges, such as
    large furniture or a vehicle that isn’t running. The following is therefore suggested:


    ■If the transaction must occur outside the police station, there is safety in
    numbers. Never be outnumbered. Have two or more other individuals there and make
    sure the other party knows that others will be present.


    ■Never let someone go anywhere unaccompanied in one’s home, not even to the bathroom.
    Always make sure they are escorted.


    ■Don’t have more than one group come to the user’s residence at one time to buy
    or sell.


    CONCLUSION


    This chapter has provided an overview of best practices for securing purchases
    online. This includes a checklist of things to consider when purchasing items
    online and some resources to help prevent the user from having their credit or
    debit card compromised. [Chapter 8](#chapter08.xhtml) will discuss small business
    protection.


    | CHAPTER || 8 |


    | --- | --- |


    PROTECTING A SMALL HOME BUSINESS


    IN THIS CHAPTER


    This chapter discusses concepts of small home business (SHB) protection. Topics
    include prevention methods from business scams, handling social media as an SHB,
    backing up data, data destruction for out-of-date systems, Acceptable Use Policy,
    and monitoring SHB employees’ computer use.


    SHB IN THE TWENTY-FIRST CENTURY


    Commerce changed as the result of the coronavirus pandemic. SHB owners who did
    not think they needed an online presence faced the harsh reality of trying to
    survive in a world where social distancing became the new norm. The new model,
    even for traditional brick and mortar businesses like restaurants, requires them
    to embrace having a robust online presence. Retail businesses have to offer the
    ability for customers to shop and buy online. Before coronavirus, many businesses
    permitted employees the flexibility to telework. Those who did not embrace teleworking
    are now seeing it as a necessity to continue operations during chaotic times.


    Creating an online presence also makes businesses, their employees, and their
    customers all potential targets for criminals. During the pandemic, criminals
    did not practice distancing for their illegal behavior, including disrupting Zoom
    meetings. The issues covered earlier in the book for personal cybersecurity are
    obviously applicable to SHBs. Create a Digital Risk Checklist for SHB computers
    as reflected in [Table 2.4](#chapter02.xhtml#tab2-4). This will be important in
    case hardware is lost or stolen. Continue to refer to those particular chapters
    as needed to cover SHB cyberprotection. This chapter covers additional areas that
    are somewhat unique to an SHB.


    PREVENTING COMMON BUSINESS SCAMS


    Today’s business scams attack by email or telephone call. Their success depends
    upon the owner’s or SHB employee’s naïveté about technology. Prevention is possible
    by implementing good practices. A lapse of good practice can result in a terrible
    situation, such as the ransomware encryption of all of an SHB’s data.


    Common Scams that Target Small Businesses


    The Federal Trade Commission \[2024\] identifies nine small business scams that
    are a variation of fraudulent schemes noted elsewhere in this book. They are:


    Fake Invoices and Unordered Merchandise'
