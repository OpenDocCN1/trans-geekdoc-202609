- raw: 'The first component to enforcing an AUP is to establish which computer a user
    is authorized to use. This can be a device specifically assigned to them or a
    computer with several different user profiles which have been set up for their
    use. SHB may need to outsource setting up user profiles depending upon their personnel’s
    level of expertise.


    SHBs should document the specific device or user account associated with each
    employee. SHB should also assign employees a specific email account for them if
    their job function requires it. Once an SHB has designated a device or user account
    it can then establish which employer system components/services an employee can
    access. This can be accomplished in a number of ways. When setting up user accounts,
    the SHB can restrict which programs they run, whether they can install software/hardware,
    or what files they can access. An SHB can even limit the hours employees have
    for Internet access. An SHB can also accomplish restrictions through specific
    programs and by using the business router.


    The final component is monitoring employee compliance with the AUP. This can be
    accomplished by file activity monitoring (FAM). There are free and paid programs
    that perform FAM. It is suggested conducting a Google search to find the best
    one suited to an SHB’s needs. There are also YouTube videos that show how to deploy
    and use FAM. A good feature to look for in a FAM is the ability to send alerts.
    An important alert to consider are attempts to access/copy/remove sensitive files/folders.
    Others are alerts on hits by antivirus software.


    Beyond FAM there are monitoring software programs that will record keystrokes
    typed and take screen shots of user’s activities. As noted in [Chapter 5](#chapter05.xhtml),
    there can be legal implications for deploying such software. An additional consideration
    is these programs can store user activity logs. A Google search can locate the
    top current monitoring programs that best suits an SHB’s needs. Any violations
    of an AUB detected should be investigated and addressed promptly.


    BUSINESS SOCIAL MEDIA


    All the precautions discussed in the previous chapters mentioning social media
    are just as valid for businesses as well. [Table 8.2](#chapter08.xhtml#tab8-2)
    lists some additional considerations for businesses having a social media presence.


    TABLE 8.2  Business Social Media Checklist


    | Action || Date |


    | --- | --- |


    | Plan how the SHB wants to use social media and which sites are appropriate to
    further the business. ||  |


    | Open a social media account consistent with a site’s requirements for businesses.
    Some social media sites have features that are specific to businesses. For instance,
    Facebook has both business pages, which represent a business or brand, and personal
    pages, which are for individuals. Individuals are not supposed to set up an account
    for a business as if they were an individual. ||  |


    | Review the site’s features specific to business accounts, such as controls for
    restricting posts/comments, moderation of posts, procedures for granting access
    to users, granting control to moderators, etc. ||  |


    | Consider how much to allow customers/clients to interact with the business’s
    social media. Can they post comments? If comments are allowed, consider using
    the moderation controls that may be present on a particular social media site.
    ||  |


    | Consider how each post fits with the SHB’s overall marketing plan. If it doesn’t
    fit, don’t post it. ||  |


    | Define which employee(s) will have access to social media to make posts, moderate
    other’s posts, and respond to posts. ||  |


    | Consider how the SHB is going to monitor the account. Can the SHB give an employee
    this ability and if so, who? ||  |


    | Document accounts and passwords consistent with [Chapter 4](#chapter04.xhtml)
    [Table 4.1](#chapter04.xhtml#tab4-1) and require staff not to change passwords
    without management approval. ||  |


    CONFERENCING SECURITY BEST PRACTICES


    During the coronavirus pandemic conferencing was quite common as were disruptions
    by uninvited guests. Here are some considerations to conducting online conference
    meetings:


    Attendees


    Know how to operate the software prior to the meeting. Some tools like Microsoft
    Teams have many features that users might not initially understand and finding
    out how they function during the first online meeting is not a good idea. Know
    the features before starting live. Setting up the software before the meeting
    starts may be required, since waiting for the conference start time may put the
    user behind and late for the meeting. Is video needed to be on during the meeting?
    What is in the video background that can be used to identify the user or their
    location? While in the meeting, act like the microphone and camera are always
    on, even if they are muted and/or off. This will prevent the user from saying
    or doing something improper in the event the microphone and/or camera becomes
    unmuted.


    Host


    Open meetings can allow unwanted people to attend. Make sure to create a meeting
    ID and a password that is given just to the meeting attendees. If the meeting
    software has a lock feature, lock the meeting after everyone has accessed the
    meeting room. This helps to prevent any possible intruders from gaining access.
    Consider whether to record the meeting and the legal issues associated with recording
    them. If recording the meeting, make sure everyone is informed that the meeting
    is being recorded before starting. (See [Chapter 5](#chapter05.xhtml), Legal Issues)
    When the meeting is over, don’t share the link to the video unless it’s appropriate.
    Once sent to someone else, the user has no control over the link unless it is
    secured with a username and password access.


    Use the virtual waiting room feature for the meetings to allow people to join,
    and don’t start the meeting until it is ready. Consider not allowing screen sharing
    unless it is limited to a few participants. Does the meeting need video for the
    participants? Consider just using the audio. Also consider whether the chat or
    instant message feature is on during the meeting and if someone needs to address
    those messages in real time during the meeting.


    DATA BACK UPS ARE AN SHB NECESSITY


    Data loss happens all the time. Sometimes it’s accidental, and sometimes it is
    not. Data retention is critical to the SHB’s continued operation. Every essential
    computer that operates in the business needs to have a backup plan. This is not
    only for the fear of a virus or ransomware, but also for things like floods, fire,
    and so on. Hard drives, even the solid-state variety, fail. Spending a few hundred
    dollars up-front will save the SHB spending thousands later on recovery costs.


    Making a Data Backup Plan


    Businesses come in a variety of sizes. If the user’s SHB approaches significant
    size, consider speaking with an accountant and/or lawyer about what records need
    to be backed up and the best method for doing so. This discussion here is intended
    for the smallest of businesses, with significantly fewer employees and/or revenue.
    The SHB may wish to consider outsourcing their data storage and IT needs depending
    upon their size.


    Identify Important Data


    Identify what data is critical to the SHB. Common SHB examples are any records
    that reflect income received, expected income (accounts receivable), paid expenses,
    expenses needing paid (accounts payable), sales receipts, and assets, such as
    inventory. Any information pertaining to suppliers and customers is also important.
    Depending on the business’s size, these records may be maintained in accounting
    files or spreadsheets. Records in word-processing documents, such as templates
    for invoices and letterheads, business plans/reports, personnel records, and draft
    contracts are also important. Other records may be scanned, such as signed contracts
    and tax returns. Some records may be emails to or from suppliers and customers.
    Other records might be digital inventory photos.'
