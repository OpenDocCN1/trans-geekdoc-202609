- raw: 'Navigating social media can be a fun and exciting way for seniors to stay
    connected with family and friends, but it’s important to do so safely. The first
    step in protecting their social media usage is to manage their privacy settings.
    Make sure they only share personal information with friends and family and adjust
    their settings so that only approved connections can view their profile. Many
    platforms offer two-factor authentication, which requires a code or confirmation
    from a second device before logging in. This adds an extra layer of security to
    prevent hacking or unauthorized access to their accounts. The user may have to
    assist them with these settings and periodically check them to make sure they
    are properly set.


    It’s also important for them to be wary of friend requests from strangers and
    not to accept them without verifying the person’s identity. It is equally important
    for them to be aware that fraudsters will create fake profiles of real friends/relatives.


    Remind vulnerable adults that not everything they see on social media is true.
    With the rise of fake news and online hate speech, seniors may fall prey to false
    information and negative comments, leading to feelings of isolation and vulnerability.
    Social media has become a ubiquitous part of our daily lives, with people of all
    ages using various platforms to connect, share, and stay informed. While it can
    offer many benefits, such as staying connected with friends and family, it also
    comes with risks, especially for older adults. Seniors may not be as familiar
    with the technology and potential dangers associated with social media. It’s essential
    for them to understand how to navigate these platforms safely. They need the time
    to fact check information before sharing or believing it. They need to be reminded
    to avoid posting sensitive or controversial topics and be respectful in their
    interactions with others. By following these safety tips, seniors can enjoy all
    the benefits of social media without compromising their personal information or
    safety. The following list of Social Media Safety Discussion Points provides key
    social media safety discussions points to cover with vulnerable adults. [Table
    6.4](#chapter06.xhtml#tab6-4) discusses the kinds of topics to discuss with vulnerable
    adults when reviewing the topic of safety on-line.


    TABLE 6.4  Social Media Safety Discussion Points


    | 1 || Create strong and unique passwords. Seniors should avoid using the same
    password for multiple accounts and should create a strong and unique password
    for each social media account. A password manager is especially important for
    aging seniors who may forget numerous passwords. |


    | --- | --- |


    | 2 || Be cautious about clicking on links or opening attachments from unknown
    sources. These could contain viruses or malware that can damage their devices
    or steal their information. These links can also lead to malicious Web sites where
    their system gets infected with malware. It’s always safer to verify the source
    of the message before clicking on any links or downloading attachments. |


    | 3 || Think before posting. Before sharing anything on social media, seniors
    should think about how it could potentially be used against them. This includes
    personal information, photos, and even location check-ins. |


    | 4 || Be selective with friend requests. Seniors should only accept friend requests
    from people they know and trust. It is essential to be cautious of strangers who
    may try to establish a connection on social media. They also need to understand
    that fraudsters will create fake profiles in the names of friends/relatives to
    trick them into connecting. |


    | 5 || Limit personal information. Seniors should be cautioned against sharing
    personal information such as their full name, address, phone number, or date of
    birth on social media platforms. |


    | 6 || Be aware of fake news and scams. Older adults should be vigilant about
    fake news and scams circulating on social media. It is advisable to fact-check
    information before sharing or believing it. |


    | 7 || Use reputable social media platforms. Seniors should stick to using reputable
    and well-known social media platforms to minimize the risk of scams and other
    issues. Dating-sites are frequently used by criminals to victimize victims with
    all manner of schemes. Scammers will try to convince their targets to continue
    their communications on message applications, such as WhatsApp or Telegram. These
    applications are used for fraudster’s convenience and to further hide their tracks.
    |


    IDENTIFYING SCAMS


    Despite taking precautions, vulnerable adults may still come across fake profiles,
    scams, or other concerning content while using social media. If they come across
    any suspicious activity or receive messages from unknown sources on social media,
    it is important to know how to identify and report them. For example, if someone
    receives a suspicious message from a friend or family member asking for money,
    they should verify the request’s authenticity before sending any funds. They can
    do so by contacting the person directly through another means of communication,
    such as calling them or asking a trusted family member to verify they are seeking
    assistance. AI use by scammers will make this challenging. Social media platforms
    have dedicated reporting functions for fake profiles, scams, and other concerning
    content. Vulnerable adults should be aware of these functions and use them when
    necessary. Some red flags to watch out for on social media include:


    ■recently created profiles


    ■profiles with suspicious or no information and a limited number of friends


    ■unsolicited messages asking for personal information or money


    ■posts or messages with bad grammar or spelling mistakes


    ■requests for money, wire transfers, the purchase/transfer of digital currency
    or gift cards


    ■requests to exchange nude photos or videos, which can later be used for extortion
    of the vulnerable adult.


    DEALING WITH POTENTIAL CYBERATTACKS/SCAMS


    Discovering that an adult family member has fallen victim to a cyberattack or
    scam can be a stressful and concerning situation. It is important to stay calm
    and approach the situation with a level head. The first step in dealing with a
    potential incident is to gather all the information and details about what happened.
    This can include any suspicious emails, text messages, or phone calls that were
    received, as well as any financial transactions or personal information that may
    have been compromised. It is important to document everything and keep track of
    any evidence that may be needed for further investigation. If the victimization
    occurred on a social media platform document where it occurred and which profile(s)
    were involved. Capture all text/chat messages. Some programs allow users to download
    these. If not, users should take screenshots of the messages.


    Once all the necessary information is collected, it is important to take immediate
    action to protect the victim and prevent any further damage. This may include
    contacting the financial institutions involved to freeze accounts or cancel credit
    cards, changing passwords and security questions on all online accounts, and notifying
    the appropriate authorities. (See [Table 6.7](#chapter06.xhtml#tab6-7) for US
    residences and [Table 6.8](#chapter06.xhtml#tab6-8) for outside the United States)
    It is also important to educate the victim on how to recognize and avoid future
    potential scams, as well as regularly monitoring their accounts for any suspicious
    activity. Last, offering emotional support and reassurance during this difficult
    time is crucial in helping the victim feel safe and secure. [Table 6.5](#chapter06.xhtml#tab6-5)
    is a Four step guide to helping recover from Identify Theft and Fraud. If or your
    loved one become a victim consider these steps.


    TABLE 6.5  Four Steps to Recovering from Identify Theft/Fraud


    |  || Step || Action |


    | --- | --- | --- |'
