    to evaluate if they are the right fit. Users are not bound to any social media
    for life.


    Increasingly there are other agreements beyond those provided by social media
    that users all need to be aware of. Almost all employers have standalone policies
    or some provisions that deal with how their employees use social media. Employers
    are not alone. Schools from elementary through colleges also have such provisions.
    Even fraternal organizations and clubs will often have social media policies.
    Collectively these policies govern such things as who can create a social media
    presence for the organization, and what things can and cannot be posted by employees/students/members
    on social media. Even if there isn’t a specific social media policy, organizations
    frequently take the view that something posted online that reflects unfavorably
    on an organization or its members can and will result in some kind of adverse
    action. The news is full of stories of employees or students whose online post
    or association with some social media group resulted in them getting disciplined
    or terminated by their organization as their conduct violated an explicit social
    media policy or implicit behavior policy.


    ## SECURITY


    Security is of paramount importance. If the user’s social media account is not
    secured then an attacker can gain complete access, regardless of what privacy
    settings one may have selected. Every social media service has a different method
    of securing their users’ access to the service. Many users simply make an account
    and login without thinking about what the service’s security function includes.
    Most never look at the changeable features to identify the possible safer functions
    that could enhance security. The following are some of the types of security that
    should be available to the user to protect their accounts.


    ### Contact Email/Cell Phone


    A contact email is one required by most social media sites as a method to contact
    the accounts. In some cases, a social media account may request an additional
    email address as a backup in case the user’s access to the original is lost. Make
    sure to provide a backup email address if permitted. Cell phone numbers are also
    asked for two-factor authentication purposes.


    ### Passwords

