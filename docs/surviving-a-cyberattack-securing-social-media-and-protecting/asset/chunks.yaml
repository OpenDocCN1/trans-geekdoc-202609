- raw: 'Home technology user agreements are a set of rules and guidelines that parents
    and children agree to follow when using technology at home. These agreements are
    important because they help establish expectations, set boundaries, and promote
    responsible technology use. Often, children are exposed to technology at a young
    age and may not understand the potential risks and consequences. By establishing
    a user agreement, parents can educate their children on safe and appropriate technology
    use while also setting guidelines for monitoring usage and addressing any issues
    that may arise.


    Creating a user agreement should be a collaborative effort between parents and
    children, allowing for open communication and understanding between both parties.
    These agreements can cover a range of topics such as time limits, appropriate
    content, online safety, and consequences for breaking the rules. It is important
    for parents to regularly revisit and update the agreement as their children grow
    and technology evolves. By involving children in the process, they will gain a
    better understanding and ownership of their technology use. [Table 5.5](#chapter05.xhtml#tab5-5)
    provides online resources for parents looking to create a home technology user
    agreement.


    TABLE 5.5  Parents’ Online Guides to User Agreements


    | Reference || Web address |


    | --- | --- |


    | Common Sense Media’s Family Media Agreement || [https://www.commonsensemedia.org/family-media-agreement](https://www.commonsensemedia.org/family-media-agreement)
    |


    | Federal Trade Commission’s Parent’s Guide to Protecting Kids’ Privacy Online
    || [https://www.consumer.ftc.gov/articles/0031-protecting-your-childs-privacy-online](https://www.consumer.ftc.gov/articles/0031-protecting-your-childs-privacy-online)
    |


    | National Online Safety’s Parent Online Safety Hub || [https://nationalcollege.com/categories/online-safety](https://nationalcollege.com/categories/online-safety)
    |


    | KidsHealth’s Internet Safety || [https://kidshealth.org/en/parents/net-safety.html](https://kidshealth.org/en/parents/net-safety.html)
    |


    | ConnectSafely’s Parents’ Guide to Kids and Tech || [https://connectsafely.org/parentguides/](https://connectsafely.org/parentguides/)
    |


    USING MONITORING SOFTWARE


    Parents retain legal rights to enforce control and discipline their children.
    Monitoring software, including GPS tracking software, provides the ability to
    invade the user’s child’s privacy, which was not possible in generations past.
    Some of this surveillance capability is built into some parental controls, particularly
    on cell phone applications, and may seem at first glance something the user wants
    to utilize. This may, however, make one question whether they want to be a parent
    or a prison guard over their children’s online experiences. Besides this important
    question, there are important legal ramifications that the user must consider.


    Legal Issues


    US federal and/or state wiretap laws, collectively referred to as Title III laws,
    prohibit the interception of “real-time” communication by someone not a party
    to the communication. Federal law provides a minimum privacy protection level,
    with some states providing greater protection. Many hear the word wiretap and
    think it refers only to the intercepting of a telephone call. US courts have determined
    that computer monitoring can be considered a wiretap. Title III laws contain both
    criminal and civil penalties for violations.


    Besides legal processes, such as a court order or warrant, monitoring can occur
    with consent. There are two kinds of consent. The first is one-party consent,
    which is contained in federal law and thirty-eight state statutes. The other type
    is called two-party consent. This means that both parties to the communication
    have to consent to the monitoring for it to qualify for this exception. There
    are twelve states (California, Connecticut, Florida, Illinois, Maryland, Massachusetts,
    Michigan, Montana, Nevada, New Hampshire, Pennsylvania, and Washington) that require
    two-party consent.


    Many may think that all that is needed is to get the child’s consent to have their
    digital lives monitored with these applications. That may be okay, but as noted,
    there are states that require both parties to the communication to consent to
    being monitored. Suppose the user is in one of those two-party states, and they
    are a single parent. The child starts texting with a noncustodial parent. Will
    that noncustodial parent be okay with monitoring their communication with the
    child? Will they make an issue of it and bring legal action? If one lives in a
    single consent state and their child the device, such as a cell phone, into a
    two-party state on, say, a school trip or a holiday to visit relatives, any communication
    that occurs while in that state requires both parties’ consent to the monitoring.


    Other Issues


    Monitoring software has other issues besides legal concerns. Not all devices,
    such as gaming systems, can have monitoring software installed. Most antivirus
    software, as well as firewalls, will disable or otherwise cause issues for monitoring
    software functions. It is, after all, spying software. This requires the user
    to authorize an exception for the monitoring software through their antivirus
    software and firewall. If an exception is created it opens an opportunity for
    someone else to install other monitoring software for nefarious purposes against
    the user or their family. If someone gains unauthorized access to the monitoring
    software results, they could obtain an enormous amount of information about the
    user and their family. Obtaining some monitoring applications, particularly low-cost
    or freeware, will cause more problems, such as the introduction of other malware
    on the user’s system.


    Monitoring software can produce tons of data to be reviewed. This data is multiplied
    by how many devices it is installed on. Depending on the application, it can also
    send alerts to the user on key events. If one has the alerts improperly configured,
    they will quickly get inundated with false positives. For instance, if user decided
    to get an alert every time their child visited a Web site with the word sex appearing,
    the user would get email alerts for news articles about sex discrimination, sex
    education, or with a title such as The Battle of the Sexes. Monitoring software
    has to be configured and data reviews handled properly, or it will quickly overwhelm
    one’s intended purpose of managing your child’s cyber risk.


    Deploying Monitoring Software


    1.If the monitoring application permits it choose features that block certain
    activities or only generate alerts if an attempt was made to overcome restrictions.
    Blocking can help alleviate concerns over inadvertently monitoring communication
    requiring two-party consent by stopping the communication altogether.


    2.Inform the child that monitoring software has been deployed on their devices.
    This may discourage them from bad behavior or may drive them to a nonmonitored
    device.


    3.Avoid capturing everything if it is not needed. For instance, if one is worried
    about pornographic browsing, there is no need to capture Web-based email.


    4.Set monitoring to trigger on key events such as pornographic Web sites. Some
    monitoring programs have predefined lists of problematic sites. This further limits
    the scope of one’s monitoring.


    5.Consider only capturing outgoing communication, as your child has presumably
    consented to the monitoring.


    Final Thoughts on Monitoring Software'
