  trans: '


    本章讨论了照顾那些不具备处理网络问题能力的脆弱成年家庭成员的概念。主题包括保护他们免受网络犯罪的方法、处理网络攻击的后果，以及在他们去世后处理其社交媒体。


    ## 脆弱成年人面临的风险是真实的


    2024 年，联邦调查局（`FBI`）网络犯罪投诉中心（`IC3`）报告称，60 岁以上人群在 2023 年的损失超过了 34 亿美元，与 2022 年的报告损失相比增长了近
    11%。老年受害者向 `IC3` 提交的投诉也增加了 14%。[联邦调查局 2024 年]


    在数字世界中保护脆弱的成年人家庭成员（老年人和残障成年人）怎么强调都不为过。随着世界人口开始老龄化，在线老年人的数量正在增加。我们经常听到更多关于年轻人的问题和网络风险。但被忽视的是社交媒体上的老年人数以及他们面临的伤害。他们正在使用电脑、智能手机和平板电脑访问各种可能让他们暴露于网络风险之中的资源。


    脆弱的成年成员更容易信任他人，特别是政府机构，这使他们成为那些假冒政府或诱导他们信任自己的诈骗者的易受猎物。由于各种原因，他们可能会感到孤立和孤独。这种孤独和孤立感让他们很容易被犯罪分子通过关注和虚假赞美来操纵。由于年龄或疾病导致的心智/身体健康下降或有限，影响了他们怀疑或检测他人恶意意图的能力。他们也不熟悉技术。这些因素加上他们拥有财务资产/资源的可能性，使他们网络犯罪分子极具吸引力的目标。犯罪分子识别出了这些因素，并将不会犹豫地利用它们牟利。家庭成员需要制定计划来帮助他们并保护他们免受这些网络风险。


    ## 常见的在线威胁


    脆弱成年人家庭成员面临的一些常见威胁与大多数人遇到的威胁许多相同。某些威胁似乎专门针对易感的成年人，例如身份盗窃。随着技术和在线交易的使用增加，诈骗者偷取个人和财务信息变得更容易了。脆弱成年人可能没有年轻一代那么精通技术，使他们更容易向虚假网站或不认识的人透露个人信息。


    在线威胁有多种形式。这些威胁通常会导致财务损失，损害个人信息，并对脆弱成年人的心理/情感健康产生负面影响。了解这些威胁及其运作方式至关重要。表 6.1 列出了其中一些威胁。表
    6.2 提供了提供更多有关这些威胁、新兴趋势和/或报告及处理方法的详细信息的网站。


    ### 表 6.1 在线威胁的类型


    | 类型 | 定义 |

    | : --- | --- |

    | 身份盗窃 | 身份盗窃是一种犯罪，指某人在未经许可的情况下使用他人的个人信息（如姓名、社会安全号码、信用卡号或其他识别信息）来实施欺诈或其他犯罪。这可能导致财务损失以及对受害者声誉和信用的损害。
    |

    | 在线诈骗 | 在线诈骗利用互联网欺骗受害者交出资金、个人信息或敏感数据。这些诈骗可以采取各种形式，包括虚假网站/个人资料、钓鱼邮件、电话、社交媒体或短信。通常使用社会工程策略来诱骗受害者交钱或个人信息。他们通常承诺不切实际的奖励或利益。他们还可能涉及威胁，以说服受害者如果不采取某些行动，就会面临财务或法律损害。这些诈骗通常涉及冒充合法组织或机构，并利用恐惧或紧迫感迫使受害者立即采取行动。本表描述的虚假技术支持、投资和加密货币、Medicare
    和医疗保健、浪漫诈骗都是具体的例子。 |

    | 虚假技术支持 | 这些欺骗计划涉及冒充合法公司（如 `Microsoft` 或 `Apple`），并欺骗受害者让他们获得计算机或个人信息的访问权限。如果显示弹出警告，请对系统进行扫描，因为系统可能被感染。这是虚假的。如果系统已更新，弹出窗口诈骗应会大幅减少。诈骗可能导致财务损失或身份盗窃。
    |

    | 投资和加密货币诈骗 | 这些欺骗计划承诺巨额且不现实的投资回报。他们通常会说服目标他们是专家，或者他们认识一位正在提供建议的可靠人士。他们使用虚假网站、社交媒体账号、报告、截图和电子邮件来证明投资是真实的且具有巨大价值。这些投资范围从高风险股票/债券投资，到黄金市场和数字货币（如
    `Bitcoin`）。他们诱骗受害者投入资金。一旦投资，诈骗者就会提供虚假信息显示受害者的投资正在增长，以诱他们进一步投资。受害者将无法收回他们的投资或任何虚假利润。
    |

    | Medicare 和医疗保健诈骗 | 这些诈骗通过承诺虚假或未经批准的医疗治疗或服务来针对老年人和脆弱个体。这些诈骗还可能涉及身份盗窃，诈骗者使用盗取的信息向
    Medicare 为虚假服务或设备开账。 |

    | 浪漫诈骗 | 这些都是虚假的。这些诈骗通常在要求要钱之前对受害者进行数周或几个月的诱导，通常是为了虚假的投资计划或以虚假名义获取个人信息。如果未能说服受害者转账或提供个人信息，可能会发生性暗示调情，以说服脆弱成年人发送裸照以进行勒索计划。
    |

    | 祖父母诈骗 | 这是针对老年人最常见的诈骗类型之一。在这种诈骗中，老年人会接到一个假冒成他们的孙辈或其他陷入困境的亲属的电话。冒充亲人的来电者声称发生了车祸、被捕或需要紧急资金援助。在这些情况下，诈骗者经常利用社交媒体或其他公共来源找到的信息使他们的故事听起来更有说服力。他们要求受害者立即通过电汇、礼品卡或预付借记卡发送资金，一旦资金寄出就很难追踪和追回。人工智能（`AI`）可能被用来冒充亲人，使请求资金援助的信息更具可信度。考虑在与亲人交流时采用一个无法被猜到的密码或密码短语，以确保用户实际上是在与真人对话，而不是
    AI 创建的语音。 |


    '
