    claims of a limited time offer or limited availability to pressure them into acting.
    ||  |


    | 12. || Threats or urgent messages claiming their account will be closed or suspended
    or messages with intimidating language, such as threats of legal action or account
    suspension. ||  |


    | 13. || Requests for personal information such as social security number, credit
    card numbers, or bank account information from unknown sources. ||  |


    | 14. || Unexpected charges on their credit card or bank account. ||  |


    Aside from monitoring for scams, it is also important to set boundaries for vulnerable
    adults’ online activities. This can include limiting their access to financial
    accounts or setting up alerts for suspicious activity on their accounts. It is
    also important to stay involved in their financial affairs and to regularly check
    in with them about any potential scams they may have encountered. Staying involved
    can help prevent them from making any impulsive or uninformed decisions that could
    put them at risk. Regular checking bank and credit cards statements can detect
    irregularities and recover or minimize losses that may have occurred.


    Openly talking about the various types of scams and warning signs empowers vulnerable
    adults to recognize and avoid potential scams on their own. It is also important
    to stay involved in their daily lives and to have regular conversations about
    their financial decisions and any change in their financial situation. This allows
    intervention should any red flags or concerning behavior be detected. Monitoring
    and setting boundaries do not mean isolating vulnerable family members from the
    Internet. Encourage them to ask for help or clarification from a trusted person
    they know if they receive any suspicious calls or emails. Staying involved in
    a vulnerable family member’s financial decision is also crucial in preventing
    them from being exploited. If the user is unable to monitor their finances, consider
    appointing a trusted family member or financial advisor to help oversee their
    accounts.


    Depending on the concern present the user may wish to consider installing monitoring
    software on their systems but only after careful consideration of legal concerns
    discussed in this book. Remember to report any suspected scams or cybercrimes
    to the appropriate authorities (see [Tables 6.7](#chapter06.xhtml#tab6-7) and
    [6.8](#chapter06.xhtml#tab6-8)). Seek help from trusted family members or professionals
    if the vulnerable family member has fallen victim to a scam. With vigilance and
    awareness, elderly loved ones can be made safe from these malicious schemes.


    Noticing Behaviors Associated with Victimization


    There are numerous behavioral red flags that may indicate a vulnerable family
    member is being targeted by a scammer. One major red flag is a sudden change in
    financial habits or patterns. For example, if a loved one was always careful with
    their money but suddenly begins making large, unusual purchases or giving away
    money to unfamiliar people, this could be a sign that they are being manipulated
    by a scammer. Another red flag is increased isolation or withdrawal from family
    and friends. Scammers often try to isolate their victims to gain their trust and
    control over their actions. If a loved one is becoming more secretive or distant,
    it is important to investigate further and make sure they are not being targeted
    by a scammer.


    Another common behavioral red flag is a sudden change in personality or mental
    state. Scammers often use fear tactics or emotional manipulation to exploit their
    victims, which can lead to changes in behavior or mood. If a loved one becomes
    more anxious, fearful, or paranoid, it could be a sign that they are being attacked
    by a cybercriminal. If they seem confused or disoriented when discussing their
    finances or any recent interactions, this could also be a red flag. It is important
    to pay attention to any changes in a loved one’s behavior and address them as
    soon as possible to protect them from potential scams or minimize the harm. Early
    detection of behavior changes due to victimization will help minimize the damage
    inflicted. Here are some specific changes that may indicate a family member has
    fallen victim to a scam:


    ■sudden financial difficulties


    ■increased secrecy about online activities


    ■spending time with a “new friend” they’ve met online


    ■querying about installing new communication apps on their smartphone


    ■expresses desire to travel out of the state or country to meet someone


    ■new interest in cryptocurrency


    ■believe that their wealth will soon increase


    Difficult Conversations


    No one wants to acknowledge they may have been fooled or tricked into making a
    mistake. It is a challenging and emotional task to discuss such matters with family
    members who may have been independent for most of their lives and may not be used
    to being vulnerable or dependent on others. They may feel embarrassed or ashamed
    about falling for a scam, making it difficult to be open and talk about the issue.
    Some may have cognitive impairments, making it harder for them to fully understand
    the situation and the potential consequences of their actions. They may also have
    a fear of losing their independence or pride, making them hesitant to admit when
    they have been taken advantage of. This can make it challenging to broach the
    subject of potential scams. These conversations can also be difficult because
    family members may feel guilty or responsible for not being able to protect their
    loved ones from being scammed. It can also be emotionally taxing to see a family
    member being taken advantage of, and it can be challenging to confront them about
    it.


    Many of them may have grown up in a time where trusting others was the norm, and
    they may have a hard time accepting that there are people out there who are looking
    to take advantage of them. The embarrassment and shame that they feel for falling
    for what seems an obvious scam may prevent them from admitting the deception to
    their loved ones. They may feel defensive or refuse to discuss it altogether.
    Pride can make them stubborn to admit something is amiss. They may have a hard
    time accepting that they are no longer able to make decisions on their own or
    may not want to admit that they are being taken advantage of. These factors may
    make it hard to have a productive conversation. It is important for family members
    to approach these conversations with sensitivity and empathy, and to have patience
    and understanding for their vulnerable loved ones.


    At-risk adults who live with the user might make it easier to recognize underlying
    issues with family members’ cognitive/emotional concerns. Vulnerable adults living
    alone may make it harder to notice cognitive decline. Web sites such American
    Association of Retired Persons (AARP; [https://www.aarp.org/health/brain-health/alzheimers-and-dementiaas](https://www.aarp.org/health/brain-health/alzheimers-and-dementiaas))
    and the National Council on Aging’s Eldercare Locator ([https://eldercare.acl.gov/Public/Index.aspx](https://eldercare.acl.gov/Public/Index.aspx))
    provide online resources to help in recognizing and dealing with cognitive decline.


    There are times when it becomes necessary for users to recognize that they must
    assume full control over elder parents’ finances due to their diminishing physical/mental
    abilities. Sometimes this can be accomplished with the voluntary cooperation of
    the elderly before they lose the ability to legally consent to such measures.
    It sometimes requires legal intervention through a probate court and formal guardianship.
    Users should consult with legal counsel for the best option that insures they
    can protect their family members.


