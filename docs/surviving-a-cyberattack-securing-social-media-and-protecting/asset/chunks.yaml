    Todd G. Shipley


    我要感谢我的孩子 Stephanie 和 Mark，以及我的孙辈们 Scarlett、Raylan、Vivian、Margaret、Owen、Felicity
    和 Abigail——愿这本书能为你们和后代创造一个更安全的在线世界贡献力量


    Art Bowker


    为了确保这本书成为公众的一项宝贵资源，我们向具有处理特定人群（如脆弱成年人或网络犯罪受害者）专业经验的父母或个人征求了草案章节的意见。感谢以下个人对改进我们书籍意见和建议：Maryum
    Ali, Tim Barry, Stephanie Burlison, Bonnie Burthker, Jeff Coyle, Julie Delaney,
    Anitra Merrett, Danielle Mahoney, Jack Riffle, Michael Sullivan, Rich Threadgill,
    Rachel Yokely 以及 “Big Ashes” John Cryer, CFE, Erin West, Esq.


    | 章节 | 1 |


    ## 网络生存 VS 安全


    ### 本章内容


    理解网络犯罪是当今世界的事实，是理解保护自己和家庭需求的第一步。本章提供了关于重大网络犯罪事件的数字和历史数据，并对我们所有人面临的网络风险进行了概述。


    现代人类是一个连接的物种。互联网使得这一切成为可能，提供了在 20 世纪 80 年代后期商业化时很少有人能想象的通信和信息访问。遗憾的是，我们的信息公路也把世界上有犯罪倾向的人与无数毫无防备且未做好准备的受害者连接起来。网络犯罪影响着我们每，个人（包括儿童在内）在一生中多次面临网络犯罪尝试/行为的概率很大。（(图
    1.1）


    许多网络犯罪研究是由反恶意软件供应商支持的，侧重于不安全的个人电脑、手机或设备的危险，这些供应商希望这些担忧能转化为产品销售。这些确实是严重的担忧，不保护自己的设备是愚蠢的。然而，如果人们认为简单的反病毒、反间谍软件和防火墙就能保护他们免受
    21 世纪存在的所有网络危险，那是天真的。这些基础措施只是数字时代生存的起点。


    过去十年发生的重大数据泄露，例如 Target (2013)、Sony (2014)、Anthem (2015)、OPM (2015)、Equifax (2017)、Microsoft
    (2020) 和 Facebook (2021) 所经历的，并不是针对个人用户的攻击，而是针对委托用户数据的公司。一旦攻击者获得了信息，他们要么将其用于恶意目的，要么卖给他人，后者通过身份盗窃或其他金融犯罪使个人用户受害。


    如果认为个人所做的只是避免在认为网络安全不是优先事项的公司处购物、工作或获取服务，那就太好了。但在受害和数据被盗之前，人们如何确定这一点呢？人们本可以开始在像
    Hee Haw’s Gordie’s General Store 那样的商店购物，那里没有计算机或互联网漏洞，但那不是当代的现实。此外，对于某些机构，人们没有选择。人们必须与他们打交道。当然，我们提到的这些机构是指尚未建立不可逾越的网络堡垒的政府机构。2014
    年，美国国务院、白宫、国家海洋和大气管理局以及美国邮政加入了被黑客攻击的政府实体长名单。与 2015 年人事管理局（OPM）的泄露相比，这些显得微不足道。这次重大泄露包含了申请安全审查的政府员工的背景信息。像许多其他人一样，两位作者都收到了
    OPM 的信函，确认他们是数据盗窃受害者。


    ![](img/fig1-1.jpg)


    图 1.1 网络犯罪受害者人数 [FBI, 2024]。


    书中的信息是建议你如何避免受害，不仅是基于作者作为执法调查人员的视角，还基于他们作为受害者的经验。


