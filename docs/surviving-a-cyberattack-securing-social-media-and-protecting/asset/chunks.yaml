- raw: 'Be aware even an IoT device that can’t get access to sensitive data can still
    be used to provide information about user habits. For instance, a low-risk device
    such as smart home appliances or fitness trackers could, if compromised, let hackers
    know when one is regularly home or where they might be at a given time.


    Checking Devices for Home Security Risks


    Users should have a general understanding of what devices they have at this point,
    and they may be apprehensive about the insecurity of their home technology. It’s
    helpful to break the items into separate functions, note their particular use,
    and map out one’s home network. Use [Table 2.4](#chapter02.xhtml#tab2-4) to start
    mapping the technology in your house.


    1.Determine what devices allow access to the Internet in the house. These will
    generally be routers provided by one’s service provider or ones the user has added
    to the home network (see the section on protecting routers).


    TABLE 2.4  Digital Risk Checklist


    ![](image/tab2-4.jpg)


    2.Look at the devices that attach to this router wirelessly or by Ethernet cable.
    Ethernet cables are inherently more secure connections because they are direct
    connections through the cable. Wi-Fi is less secure because it uses radio waves
    that can be intercepted. Our section on protecting one’s router discusses features
    to mitigate this insecurity.


    3.Most IoT devices will connect to the Internet through one’s WiFi connection
    on their router.


    a.Each device comes with instructions about how to connect it.


    b.Identify the login procedures for each device.


    c.Login into the devices one at a time and identify the security function available
    for that device.


    d.The most often overlooked security for IoT devices is changing the admin names
    and passwords; change these immediately.


    e.Consider using the MAC filtering function in the router and assigning internal
    IP addresses to the IoT devices.


    [Table 2.4](#chapter02.xhtml#tab2-4) should include all family members household’s
    devices, including cell phones, iPads or tablets, computers, and home routers.
    There are other things to consider. For example, what about one’s car? Does it
    connect wirelessly to their smartphone? Refrigerators, nanny cams, security cameras,
    GPS devices, home thermostats, or any other electronic devices that connect wirelessly
    to a home network can pose security risks. Record the make and model, serial number,
    and any identifying marks of such items (this could help the police if the items
    are stolen and also for insurance purposes).


    Once one has an inventory of these things, they can better determine the risk
    of potential unauthorized access to their homes. If some devices are mobile, new
    risks will be encountered. Using mobile devices at work, connecting to the office
    network, connecting to the Wi-Fi at a friend’s house, connecting at the local
    coffee shop, and so on, opens mobile devices to additional risks.


    [Figure 2.3](#chapter02.xhtml#fig2-3) shows an example of how one can map their
    house.


    ![](image/fig2-3.jpg)


    FIGURE 2.3  Mapping the house.


    When mapping one’s house, users should physically draw where their routers are.
    It’s important to remember that the average stock home router broadcasts Wi-Fi
    signals approximately one hundred feet away. One can look at their router’s manufacturer’s
    Web site to determine how far it broadcasts.


    SOME BLUETOOTH DANGERS


    Bluetooth technology, while convenient and widely used, can pose some potential
    dangers if not secured properly. One of the main risks is eavesdropping, as Bluetooth
    signals can be intercepted by hackers who can gain access to sensitive information
    such as passwords, credit card numbers, and personal conversations. This can lead
    to identity theft, financial loss, and invasion of privacy. Additionally, unsecured
    Bluetooth connections can also be vulnerable to malware attacks, allowing hackers
    to take control of devices.


    To secure Bluetooth and minimize these risks, there are a few precautions that
    users can take. First, it is important to keep Bluetooth turned off when not in
    use, as this will prevent unauthorized devices from connecting to your device.
    Only pair with trusted devices and avoid using Bluetooth in public places where
    hackers may have the opportunity to intercept your connection. Don’t set devices
    to “discoverable” mode so devices cannot detect and connect to another device
    without permission.


    Some other common Bluetooth threats can be pairing your phone to a rental car.
    The pairing can conveniently download your contact list, emails, and text messages.
    If you don’t delete this information data from the rental car (or an old car you
    trade in) other people can potentially access your data.


    WHO ELSE IS WATCHING YOUR WEBCAM?


    You carefully set up that webcam to watch your house or your children while you
    were away. It has been great to see if your children made it home on time or if
    they are doing their homework after school. It’s unnerving to think about who
    else might be watching your webcam? If you do not pay attention to your security
    on this neat new toy, anyone in the world could potentially be watching your kids
    all day and you at night. The Web site Shodan ([www.shodan.io](http://www.shodan.io))
    provides white hat (ethical) hackers as well as criminals, sexual predators, and
    the government of any country the ability to find and identify unsecured webcams
    connected to the Internet. Finding devices on the Internet can be as simple as
    going to their Web site ([www.shodan.io](http://www.shodan.io)). Unsecured systems,
    cameras, printers, and other devices connected to the Internet can and are scanned
    for access. Your camera in your house, which you thought was plug-and-play easy,
    may be broadcasting your living room to the world. You can simply search for your
    IP address by going to the Shodan Web site and entering your IP address. If Shodan
    has crawled the IP address any information, it will be found there.


    Webcam Gate


    In 2010, a Pennsylvania school district agreed to pay $610,000 to settle a federal
    lawsuit. The suit, which was dubbed the “Webcam Gate” scandal involved the school
    surreptitiously and remotely activating webcams embedded in school-issued laptops
    the students were using at home \[Robbins 2010\]. This is a cautionary tale to
    be aware of what devices are brought into your home and to act accordingly. This
    includes employer-owned devices you bring home that may have remote monitoring
    capabilities similar to that used by the school in this case.


    TEXT MESSAGE SECURITY


    Texting can pose a variety of dangers, one of them being the interception of SMS
    messages. This means that someone can access and read the contents of text messages
    without the phone owner’s knowledge or consent. This can be particularly concerning
    when it comes to sensitive information such as bank account numbers or credit
    card details. Even simply sending a photo of a credit or debit card to a friend
    or relative can put one’s financial security at risk if intercepted. Furthermore,
    the data remains on the service provider’s network, making it vulnerable to hackers
    or other malicious actors. It is important for individuals to be cautious about
    the way they communicate, especially on their cell phones, and take steps to protect
    their personal information.


    To avoid the dangers of SMS interception, it is crucial to be mindful of the information
    that is shared through text messages. These issues can be avoided by opting for
    more secure methods of communication such as encrypted messaging apps. The best
    practice would be to regularly review one’s text message history and delete any
    messages containing sensitive information.


    PROTECTING ONE’S VEHICLE'
