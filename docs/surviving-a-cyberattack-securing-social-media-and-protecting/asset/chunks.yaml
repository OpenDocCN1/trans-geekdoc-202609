    # Reporting the Crime


    Documentation, including screenshots, has been made. Now, it is time to report.


    ## Credit Monitoring vs. Freezing


    ### Credit Monitoring

    Credit monitoring is a service that tracks changes. It does not prevent fraud
    but notifies the user of potential activity. In the United States, a user can
    request this by visiting `https://www.creditreport.com/`. It helps users identify
    if their information has been used without authorization.


    ### Credit Freeze

    A credit freeze is a method used to protect consumers from identity theft. It
    restricts access to the user’s credit report, which means others won’t be able
    to open new credit. The user will still be able to do things like apply for a
