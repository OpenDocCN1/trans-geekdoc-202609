  trans: '


    执行 `AUP`（可接受使用政策）的首要要素是确定用户被授权使用的计算机。这可以是专门分配给他们的设备，也可以是为他们使用而设置的带有不同用户配置的计算机。根据人员的专业水平，SHB
    可能需要外包用户配置的设置工作。


    SHB（小型商业实体）应该记录与每个员工相关的特定设备或用户账户。如果其工作职需要，SHB 还应该为员工分配一个特定的电子邮件帐户。一旦 SHB 指定了设备或用户账户，它就可以确定员工可以访问哪些雇主系统组件/服务了。这可以通过多种方式实现。在设置用户账户时，SHB
    可以限制他们运行的程序、他们是否可以安装软件/硬件，或者他们可以访问哪些文件。SHB 甚至可以限制员工访问互联网的时间。SHB 还可以通过特定程序和使用业务路由器来实现限制。


    最后一个要素是监控员工对 `AUP` 的遵守情况。这可以通过文件活动监控（`FAM`）来实现。市上有免费和付费的程序可以执行 `FAM`。建议进行 Google
    搜索以找到最适合 SHB 需求的程序。YouTube 上也有视频演示如何部署和使用 `FAM`。`FAM` 中值得寻找的一个良好功能是发送警报的能力。需要考虑的重要警报包括访问/复制/删除敏感文件/文件夹的尝试。其他是防病毒软件命中时的警报。


    除了 `FAM` 之外，还有监控软件程序可以记录输入的击键并对用户的活动进行截图。如 第 5 章 所示，部署此类软件可能会产生法律影响。另一个考虑因素是这些程序可以存储用户活动日志。通过
    Google 搜索可以找到当前最适合 SHB 需求的顶级监控程序。检测到的任何 `AUB` 违规行为都应及时调查并处理。


    # 业务社交媒体


    之前章节中提到的有关社交媒体的所有预防措施对企业来说同样有效。表 8.2 列出了对拥有社交媒体影响力的企业需要考虑的一些额外考虑因素。


    ### 表 8.2 业务社交媒体清单


    | 行动 || 日期 |

    | --- | --- | --- |

    | 计划 SHB 想如何使用社交媒体，以及哪些网站有助于业务发展。 | | |

    | 开一个符合该站点对企业要求的社交媒体帐户。某些社交媒体网站具有特定于企业的功能。例如，Facebook 既有代表企业或品牌的业务主页，也有面向个人的个人主页。个人不应该像个人身份一样为企业设置帐户。
    | | |

    | 审查该站点针对业务帐户的特定功能，例如限制帖子/评论的控制功能、帖子审核、授予用户访问权限的程序、授予管理员控制权等。 | | |

    | 考虑允许客户/访客与业务社交媒体互动的程度。他们可以发布评论吗？如果允许评论，请考虑使用特定社交媒体网站可能存在的审核控制功能。 | | |

    | 考虑每条帖子如何符合 SHB 的整体营销计划。如果不符合，就不要发布。 | | |

    | 定义哪些员工将拥有访问社交媒体以发布帖子、审核他人帖子并回复帖子的权限。 | | |

    | 考虑 SHB 如何监控账户。SHB 是否可以给员工这种能力？如果是的话，给谁？ | | |

    | 记录与 第 4 章 表 4.1 一致的帐户和密码，并要求员工在没有管理批准的情况下不要更改密码。 | | |


    # 视频会议安全最佳实践


    在新冠肺炎肺炎期间，视频会议非常常见，不请自来客的骚扰也同样常见。以下是举行在线会议的一些考虑因素：


    ### 与会者


    在会议之前了解如何操作该软件。像 `Microsoft Teams` 这样的工具具有许多用户起初可能不理解的功能，在第一次在线会议期间寻找它们的工作原理并不是一个好主意。在直播开始前熟悉这些功能。可能需要在会议开始前设置好软件，因为等待会议开始时间可能会导致用户落后并迟到参会。会议期间需要开启视频吗？视频背景中有什么可以用来识别用户或其位置？在会议期间，要表现得好像麦克风和摄像头一直是开启的，即使它们处于静音和/或关闭状态。


    ### 主持者

    开放式会议允许不受欢迎的人参加。确保创建会议 ID 和密码。如果会议软件有锁定功能，请在所有人进入后锁定会议。考虑录制会议以及相关的法律问题。参见 第 5
    章 法律问题）。会议结束后，除非使用用户名和密码进行保护，否则不要分享链接。使用虚拟房间功能来加入会议。


    # 数据备份是 SHB 的必要需求


    数据丢失时有发生。有时是无意的，有时则不是。数据留存对 SHB 的持续运营至关重要。业务运行的每台基本计算机都需要一个备份计划。这不仅是为了防止病毒或勒索软件，也是为了应对洪水、火灾等情况。硬盘，即使是固态硬盘也会故障。预先花费几百美元可以节省
    SHB 在恢复成本上花费数千美元。


    ## 制定数据备份计划


    企业的规模各异。如果用户的 SHB 达到相当规模，请考虑与会计师和/或律师讨论哪些记录需要备份以及执行的最佳方法。此处的讨论是针对规模最小的企业，其员工人数和/或收入要少得多。SHB
    可能根据其规模考虑外包其数据存储和 IT 需求。


    ## 识别重要数据


    识别哪些数据对 SHB 至关重要。常见的 SHB 示例是任何反映已收入、预期收入（应收账款）、已付费用、待支付费用（应付账款）、销售收据和库存等资产。任何与供应商和客户相关的信息也是重要的。根据业务规模，这些记录可能维护在会计文件或电子表格中。文字处理文档中的记录（例如发票模板和信信抬头、业务计划/报告、人事记录和合同草案）也是重要的。其他记录可以是扫描的，例如签署的合同和税务报表。某些记录可能是发给或来自供应商和客户的电子邮件。其他记录可能是数字库存照片。


    '
