- raw: 'The final process involves periodically checking to ensure the user’s child
    has not found a way to bypass the agreement and restrictions one has put in place.
    The simplest of these is ensuring the restricted device is where it should be.
    More intrusive steps may include checking browser search histories, which can
    be accessed through a browser’s History tab. For the location of this tab conduct
    a Google search (Browser name + search history). Checking router logs is also
    an option but requires logging to be on and knowledge of the user’s router’s operation.
    Don’t forget to ask questions about one’s child’s use, including on devices the
    user doesn’t control, such as at a friend’s home.


    IDENTIFY PROGRAMS INSTALLED ON THE DEVICE


    In today’s world, phone apps are everything to many teenagers and children. Not
    so long ago, Vine, a video app, was popular; today, it’s TikTok (which may be
    banned in the United States). Sharing personal stories and pictures on Instagram
    is popular, too. Many game apps are popular, as well as various instant messaging
    apps. Often, the user’s physical location in the world defines the apps one can
    use. As a parent, reviewing the apps is necessary to protect one’s children using
    technology that may lead to their harm from others. Has the user looked at their
    children’s phone and opened all the apps to see what they are? Some devices have
    apps, such as “Calculator#,” that seem innocent, but upon opening the application,
    one quickly realizes that the app is not a calculator but a means to hide communications
    from parents. If one has parental control of the device, they should be able to
    limit the download of the app or the installation of new apps. Following is a
    listing of those apps that users need to be aware of that their children might
    be using without understanding the danger. This is not an exhaustive list, but
    it will hopefully give an idea of the kinds of risks/issues associated with these
    apps. [Table 5.3](#chapter05.xhtml#tab5-3) reflects the apps in no order of preference.


    TABLE 5.3  Problematic Apps Parents Need to Know


    | App || What kind of app is it? || Why should a parent be concerned? |


    | --- | --- | --- |


    | Tor and I2P || Provides access to the Dark Web. || Access to drugs and other
    adult material. |


    | Tik Tok || Users share personal videos. || Access to pornography may be limited
    in the United States This is due to recent state level legislative changes. |


    | WhatsApp || Communication (online phone, text, video chat) || Difficult to control
    content. |


    | Kik || Provides group or private messages. || No age limit is applied by the
    vendor. Vendor messages are deleted after forty-eight hours, and it is difficult
    to monitor. |


    | Snapchat || Group or private messages, videos, and photos. || Difficult to monitor.
    |


    | Blendr, Tinder, MeetMe, and Hot or Not || Online adult dating apps that allow
    for messaging and exchange of photos and videos. || Children can upload personal
    information and pictures to adult sites leading to potential meeting of adults
    from the site. Hot or Not can also lead to a cyberbullying risk due to “rating”
    system. |


    | Calculator# || Secret app || An app used to hide communications from parents
    looking at the children’s phones. |


    The user must make some decisions if they find an app that might not be appropriate
    or that might endanger their children. First, don’t panic. Research the app and
    find out what it does. Downloading the app and finding out about its social media
    aspects can be enlightening. Going on a dating app if one is in a relationship
    would be problematic without first checking with a partner. The user might want
    to consider following / friending their kids online to see into their world. Don’t
    post on their pages. Talk with them if there is an issue found. Use this conversation
    to resolve your concerns.


    Social Media


    Due to the Children’s Online Privacy Protection Act \[COPPA\\ of 1998 \[COPPA
    1998\], the most popular social networks, such as Facebook, require a person to
    be at least thirteen years of age to open an account. COPPA is a US law that prohibits
    any organization or person operating online services (including social media services)
    to collect the personal information of anyone under the age of thirteen without
    parental permission. To avoid the parental permission requirements, these online
    services decided to just prohibit those under the age of 13 from having an account.
    The General Data Protection Regulation (GDPR) \[European Union 2016\] applies
    to online services covering Europe for minors less than sixteen years of age,
    although depending upon the member country, it can be as low as thirteen years
    of age. The COPPA and GDPR provisions are crafted to protect minors’ privacy rights
    and are not meant to provide safeguards against other cyber risks. This is why,
    as a parent, the user should not just accept that your thirteen-year or older
    minor is free from all danger because they can legally sign up for an account.
    Minors who lie about their age to obtain an account also risk the deletion of
    all data, such as pictures, if the online services find out they improperly obtained
    an account.


    Individual States Regulating Social Media


    In 2023, states in the United States began passing legislation requiring minors
    get consent from a parent or guardian to sign up for a social media account. Two
    notable examples were Ohio and Utah. \[Ohio Legislature 2023, Utah Legislature
    2023\]. Utah’s Social Media Regulation Act (SMRA) requires minors to get consent
    from a parent or guardian to sign up for a social media account. It also requires
    social companies to verify users’ ages, and it enables parents to monitor the
    content their kids are seeing and posting. The law also provides a curfew, preventing
    minors from accessing their accounts between the hours of 10:30 p.m. and 6:30
    a.m., unless granted permission by their parents or guardian. Lawsuits have been
    filed in both states and it is yet to be determined if the laws will stand or
    if other states and the federal government will enact similar measures.


    Online Services Especially for Minors


    There are online services that allow minors under the age of thirteen to have
    an account, provided they obtain parental consent. Just as minors may lie about
    their age to obtain an account beyond the age requirements, predators can infiltrate
    these services by nefarious means to gain access to the user’s child. A site reserved
    for minors does not negate the need to monitor its use. A user must decide the
    appropriate age for their child to have access and what accounts they wish to
    approve. Remember, any account, even mainstream services like Facebook, can expose
    children to material the user would rather not have them see at a particular age.


    Some additional things to consider with one’s child’s use of social media are
    similar to the user’s security and privacy. Get a list of one’s children’s social
    media accounts and use [Table 5.4](#chapter05.xhtml#tab5-4) to help manage its
    use. Remember, the more accounts they have, the more work is involved in effectively
    managing their use. [Table 5.4](#chapter05.xhtml#tab5-4) is provided as a checklist
    for parents to guide them through the process of securing your children''s social
    media use. Watching over our children is a complicated and ongoing issue when
    it comes to technology. We hope this checklist can provide some concepts to alleviate
    the stress of our children and social media use.


    TABLE 5.4  Children’s Social Media Privacy Checklist


    ![](image/tab5-4.jpg)


    CHILDREN AND USER AGREEMENTS'
  fmt: '

    The final process involves periodically checking to ensure the user’s child has
    not found a way to bypass the agreement and restrictions one has put in place.
    The simplest of these is ensuring the restricted device is where it should be.
    More intrusive steps may include checking browser search histories, which can
    be accessed through a browser’s `History` tab. For the location of this tab conduct
    a Google search (`Browser name` + `search history`). Checking router logs is also
    an option but requires logging to be on and knowledge of the user’s router’s operation.
    Don’t forget to ask questions about one’s child’s use, including on devices the
    user doesn’t control, such as at a friend’s home.


    ## IDENTIFY PROGRAMS INSTALLED ON THE DEVICE


    In today’s world, phone apps are everything to many teenagers and children. Not
    so long ago, `Vine`, a video app, was popular; today, it’s `TikTok` (which may
    be banned in the United States). Sharing personal stories and pictures on `Instagram`
    is popular, too. Many game apps are popular, as well as various instant messaging
    apps. Often, the user’s physical location in the world defines the apps one can
    use. As a parent, reviewing the apps is necessary to protect one’s children using
    technology that may lead to their harm from others. Has the user looked at their
    children’s phone and opened all the apps to see what they are? Some devices have
    apps, such as “`Calculator#` that seem innocent, but upon opening the application,
    one quickly realizes that the app is not a calculator but a means to hide communications
    from parents. If one has parental control of the device, they should be able to
    limit the download of the app or the installation of new apps. Following is a
    listing of those apps that users need to be aware of that their children might
    be using without understanding the danger. This is not an exhaustive list, but
    it will hopefully give an idea of the kinds of risks/issues associated with these
    apps. [Table 5.3](#chapter05.xhtml#tab5-3) reflects the apps in no order of preference.


    ### TABLE 5.3 Problematic Apps Parents Need to Know


    | App | What kind of app is it? | Why should a parent be concerned? |

    | --- | --- | --- |

    | `Tor` and `I2P` | Provides access to the Dark Web. | Access to drugs and other
    adult material. |

    | `TikTok` | Users share personal videos. | Access to pornography may be limited
    in the United States This is due to recent state level legislative changes. |

    | `WhatsApp` | Communication (online phone, text, video chat) | Difficult to control
    content. |

    | `Kik` | Provides group or private messages. | No age limit is applied by the
    vendor. Vendor messages are deleted after forty-eight hours, and it is difficult
    to monitor. |

    | `Snapchat` | Group or private messages, videos, and photos. | Difficult to monitor.
    |

    | `Blendr`, `Tinder`, `MeetMe`, and `Hot or Not` | Online adult dating apps that
    allow for messaging and exchange of photos and videos. | Children can upload personal
    information and pictures to adult sites leading to potential meeting of adults
    from the site. `Hot or Not` can also lead to a cyberbullying risk due to “rating”
    system. |

    | `Calculator#` | Secret app | An app used to hide communications from parents
    looking at the children’s phones. |


    The user must make some decisions if they find an app that might not be appropriate
    or that might endanger their children. First, don’t panic. Research the app and
    find out what it does. Downloading the app and finding out about its social media
    aspects can be enlightening. Going on a dating app if one is in a relationship
    would be problematic without first checking with a partner. The user might want
    to consider following / friending their kids online to see into their world. Don’t
    post on their pages. Talk with them if there is an issue found. Use this conversation
    to resolve your concerns.


    ## Social Media


    Due to the Children’s Online Privacy Protection Act [`COPPA` of 1998 [`COPPA`
    1998`],], the most popular social networks, such as `Facebook`, require a person
    to be at least thirteen years of age to open an account. `COPPA` is a US law that
    prohibits any organization or person operating online services (including social
    media services) to collect the personal information of anyone under the age of
    thirteen without parental permission. To avoid the parental permission requirements,
    these online services decided to just prohibit those under the age of 13 from
    having an account. The General Data Protection Regulation (`GDPR`) [`European
    Union 2016``] applies to online services covering Europe for minors less than
    sixteen years of age, although depending upon the member country.


    ### Individual States Regulating Social Media


    In 2023, states in the United States began passing legislation requiring minors
    get consent from a parent or guardian to sign up for social media account. Two
    notable examples were Ohio and Utah. [`Ohio 2023, Utah 2023`]. Utah’s Social Media
    Regulation Act (`SMRA`) requires minors to get consent from a parent or guardian
    for social media account. It also requires social companies to verify users’ ages,
    and it enables parents to monitor the content their kids are seeing. The law also
    provides a curfew, preventing minors from accessing their accounts between the
    hours of 10:30 p.m. and 6:30 a.m., unless granted permission by their parents.
    Lawsuits have been filed in both states and it is yet to be determined if the
    laws will stand or if other states and the federal government will enact similar
    measures.


    ### Online Services Especially for Minors


    There are online services that allow minors under the age of thirteen to have
    an account, provided they obtain parental consent. Just as minors may lie about
    their age to obtain an account beyond the age requirements, predators can infiltrate
    these services by nefarious means to gain access to the user’s child. A site reserved
    for minors does not negate the need to monitor its use. A user must decide the
    appropriate age for their child to have access and what accounts they wish to
    approve. Remember, any account, even mainstream services like `Facebook`, can
    expose children to material the user would rather not them see at a particular
    age.


    ### TABLE 5.4 Children’s Social Media Privacy Checklist


