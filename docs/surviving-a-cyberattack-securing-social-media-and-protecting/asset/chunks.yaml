    # Geotagging

    Geotagging occurs in so many functions now. One of the most obvious is the tagging
    of a user’s photos with the geolocation they were taken. This can be dangerous
    and compromise one’s safety. For example, if a child takes photos with the geotagging
    feature on and posts the photos online, they could potentially be providing a
    stalker with the exact location of their bedroom. Not all social media keeps this
    data when images are posted, but why risk this occurrence?


    # Remove third-party plugins or apps


    ### Third-party plugins and apps

    Third-party plugins and apps may seem cool on a social media site. When used they
    are often leaving the social media site’s security and going to an unknown site
    with questionable security. Taking that survey from `Facebook` about what kind
    of animal a user is could lead to allowing an unknown company in an unknown country
    access to one’s phone.


    ### Review of social media profile

    Sites such as `Facebook` and `LinkedIn` allow users to see their profile as others
    would. Use this feature to review what others are seeing to insure information
    is not being inadvertently leaked.


    [Table 4.2](#chapter04.xhtml#tab4-2) Social Media Security/Privacy Checklist has
    been added to provide you with a checklist for reviewing your social media and
    privacy. Use this checklist as a personal guide to help secure your social media
    accounts.


    TABLE 4.2 Social Media Security/Privacy Checklist


    ![](image/tab4-2.jpg)


    # STEPS TO AVOIDING SOCIAL MEDIA SCAMS


    1. **Be selective when accepting friends, posting, and clicking.**

    2. **Be selective with people the user doesn’t know.** Accepting all requests
    to connect with can be dangerous. If one doesn’t know someone, do they really
    want to connect with them? Fake accounts are used to try and gain access to user’s
    accounts or to their connections. One should be suspicious of recently created
    accounts, particularly if they are portraying someone very likely to have created
    an account much earlier. Some accounts one may even know, but criminals impersonate
    friends trying to gain access to the user’s account and friends list. It is not
    uncommon to see a fake account attempt to connect with user when the real person
    is already a connection.

    3. **Think twice before clicking on a link.**

    4. **Be careful where one checks in from.** Is geolocation on and has the user
    just alerted a burglar they are not home?

    5. **Don’t share personal information online.**

    6. **Be mindful of phishing scams.**

    7. **Don’t use social credentials to sign into third-party sites.**

    8. **Avoid quizzes and games that may give access to a user’s profile and other
    personal information.** These are often designed for the user to reveal details
    about themselves that can be used to obtain a password or overcome two-factor
    authentication questions.

    9. **Avoid the clickbait material posted.** Often, it is a breaking celebrity
    death or some news about the latest photos stolen from a celebrity. These can
    and often are attempts of gaining access to a user’s device through links that
    are malicious.


    # USING PSEUDONYMS ON SOCIAL MEDIA


    It is certainly possible to use different pseudonyms for different social media
    services. Social media networks want users to feel safe and trust one another
    and using a pseudonym does not denote trust. Given the current environment of
    phony accounts set up to allow bots (computer code that tries to act like a human)
    to respond on social media it’s easy to see why companies only want real people.
    They are using techniques like requiring a user to feel safe and trust one another
    and using a pseudonym does not denote trust. Given the current environment of
    phony accounts set up to allow bots (computer code that tries to act like a human)
    to respond on social media it’s easy to see why companies only want real people.
    They are using techniques like requiring a user to feel safe and trust one another
    and using a pseudonym does not denote trust. Given the current environment of
    phony accounts set up to allow bots (computer code that tries to act like a human)
    to respond on social media it’s easy to see why companies only want real people.
    They are using techniques like requiring a user to feel safe and trust one another
    and using a pseudonym does not denote trust.

