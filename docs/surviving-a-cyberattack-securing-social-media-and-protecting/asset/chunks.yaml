    # 第七章：在 21 世纪的在线市场讨价交易中生存


    寻找廉价商品是人的本性。在互联网出现之前，人们通常通过访问车库拍卖、庭院销售以及参加拍卖来寻找便宜商品。互联网改变了这一点，`eBay`、`Craigslist`、`Facebook
    Marketplace`、`Next Door`、`Etsy` 等在线市场的出现，满足了这种寻找便宜商品的需求。网络犯罪注意到了这一点，并开发了在这些在线场所盗窃的方法。卖家和买家都无法避免这些犯罪的影响。这些犯罪不仅限于在线盗窃。一些买家和卖家在将在线交易转为现实面交货物时遭到了杀、攻击和/或抢劫。本章将讨论在线市场的风险以及如何降低这些风险。


    ## 传统市场


    在在线市场出现之前，商品和服务的销售非常简单。市场受 `caveat emptor`（买家自负）原则严格监管。参与者可以实地检查货物并面对面交流。虽然可能存在夸大描述，但买家可以使用自己的感官和判断力，在出价时考虑这些夸大因素或直接离开。庭院/车库销售或拍卖的买家会带走购买的物品，因此不会发生无法交付的情况。如果卖家接受了坏支票或伪币，他们可能会被欺骗，但这类情况非常罕见。如果产品被证明有缺陷，他们知道去哪里退货或找谁索要退款。在美国，`联邦贸易委员会`（Federal
    Trade Commission）和`商业改进局`（Better Business Bureau）可以协助处理欺骗性经营的实体店。


    邮购交易是我们现在看到的许多网络欺诈行为的温床，例如不交货、不付款以及诱饵替换计划。它们再次与地址、邮箱等元素挂钩，这些元素可用于追踪诈骗者。`美国邮政`（U.S.
    Postal Service）在打击这些诈骗者方面拥有多年经验。虽然复杂的诈骗分子会设法增加追踪难度，但与网络欺诈犯罪分子完全不可相比。互联网不仅为新手诈骗者提供了机会，也为复杂的诈骗分子和组织提供了大发展的空间。


    ## 在线市场


    互联网极地改变了商品的买卖方式。卖家和买家不再需要在地理上接近。传统的车库/庭院销售和拍卖有固定的地点和设定的销售时间。在线市场永不休眠，不受这些限制。这是诈骗者运作的完美环境。他们与受害者之间的距离使得起诉变得更加困难。诈骗者隐藏真实身份和真实位置的能力在实体世界是无法达到这种程度的。快速关闭并移动其在线业务的能力可以在几分钟内完成。产品的数字图像可以轻松创建，即使诈骗者根本并不拥有它们。他们的虚假库存可以根据需要轻松存储和移动。电子金融交易为欺骗开启了新途径，而这在买卖双方面对面现金交易时是无法发生的。


    ### 常见的网络欺骗


    至少有七种通过网络欺骗获利的犯罪方法。它们是：


    1. **未交付货物/未交付付款**：最常见的欺骗方法之一是卖家未交付货物或买家未付款。


    2. **诱饵替换（Bait and Switch）**：这发生在欺骗性卖家代表某种产品出售，但交付了不合格或有缺陷的产品时。


    3. **过度付款欺诈**：欺骗性买家无意中过度支付了物品费用并要求退还过度部分。问题是整个付款都是假的。卖家退还了过度付款，结果发现欺骗性买家全额撤销了原始付款，或者原始支票是无效的。更糟糕的是，如果卖家还发送了物品，他们不仅损失了产品，还损失了过度付款的部分。


    4. **三角欺骗（Triangulation Fraud）**：毫无防备的买家使用信用卡、借记卡或其他电子方法向欺骗性卖家下单。欺骗性卖家获取了无防备买家的资金，但使用被盗的信用卡信息为买家购买物品，并将买家的账单详情作为交付地址。买家并没有意识到欺骗性卖家使用了盗取的信用卡信息来完成他们的订单。


    5. **身份盗窃**：卖家（诈骗者）可能对销售任何东西都不感兴趣。他们的目标是获取信用卡和个人信息，以便日后实施身份盗窃或协助三角欺骗。


    6. **欺诈性额外购买**：买家购买产品或服务，后来发现卖家还使用了他们的信用卡信息购买了他们并未同意购买的额外物品或服务。有时这些额外费用会在几周或几个月后出现，货物并未交付。这在维生素和补充剂市场很常见。


    7. **账户接管**：网络犯罪分子获取合法卖家和买家账户的访问权限。然后他们使用这些被盗账户实施上述欺诈，或出售保存的卡信息、支付网关和数字钱包账户。


    ### 进一步网络欺骗的常见方法


    在线犯罪可以使用许多方法诱导毫无防备的受害者相信在线骗局是真实的。方法包括在帖子中发布不存在的产品的数字图像（通常从真实的网站复制）。其他误导方法可能稍微复杂一些，它们通常包括：


    1. **虚假评论**：诈骗者有多种方法来建立信誉，使自己看起来合法。这些包括使用其他网络犯罪分子操作的机器人来发布好评。


    2. **账户合谋**：欺骗性卖家会建立虚假的买家/卖家账户为他们的欺骗账户背书。这通过操纵评分来增加他们的信誉。他们这样利用账户间的虚假交易来规避审查。


    3. **报价保护/抬抬（Bid Shielding/Shilling）**：在网络拍卖中，犯罪分子会使用虚假账户抬高报价，为欺骗性卖家获取更多利润。在抬价中，买家通过伙伴或虚假账户人为抬高报价，阻碍他人竞价。在最后时刻，抬价账户取消高价，允许欺骗性买家以较低的报价赢得拍卖。


