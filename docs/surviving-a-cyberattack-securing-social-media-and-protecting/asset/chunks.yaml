  trans: '

    下一个考虑因素是识别出所有处理此类数据的设备。这些设备显然包括台式电脑或笔记本电脑，但也可能包括移动设备。如果 `SHB` 拥有网络，数据是维护在网络服务器上、用户的计算机上，还是两者兼有？在识别出设备后，考虑设备上维护了多少种类的重要数据。仅备份设备的特定驱动器/文件夹可能是合理的，而备份整个设备的存储空间也可能是合理的。表
    8.3 提供了数据备份的考虑因素。这不是一个详尽的列表，但涵盖了 `SHB` 需要备份的大部分重要数据。检查 `SHB` 的数据并识别数据通常存储在何处，以正确完成此列表。


    ### 表 8.3 需要考虑备份的关键数据类型


    | 动词 || 日期 |

    | --- | --- |

    | 公司人员记录 | 联邦、州和当地税收记录、工资记录、养老金/401K 记录、当前及过去的员工记录 || |

    | --- | --- |

    | 行政文档 | 销售数据、营销数据、社交媒体账户信息、保险记录、设备和物业租赁文件、律师/客户材料、待处理法律案件信息、联邦和州税收申报 || | |

    | 财务数据 | 财务系统数据、每日交易、网站交易、设备库存、收入记录、银行对单、费用收据、差旅收据 || | |

    | 专有数据 | 客户列表、销售数据、商标和专利申请、专有代码 || |


    ### 存储需求/成本

    `SHB` 已经确定了关键数据及其维护位置。现在它需要决定多长时间备份一次数据，对于 `SHB` 来说最佳备份方案是什么（软件/硬件/云端），以及成本是多少。图
    8.2 描述了家庭用户通常可以使用的基本数据存储概念。


    ![](img/fig8-2.jpg)


    **图 8.2 数据存储选项**


    #### 云存储

    许多业务应用程序可以通过云技术获得，这只是备份的另一种形式。在 `SHB` 计划中评估云端存储了多少数据，以及在发生事故后如何访问数据。使用在线备份服务使备份所有数据变得简单。然而，吸取的教训是，这需要管理。如果
    `SHB` 正在使用云备份，它上一次检查云服务文件以确保数据正在备份且是 `SHB` 数据的当前版本是什么时候？负责账目系统的人是否创建了不在云备份计划中的新人员文件夹？如果是这样，那些必要的文件可能没有被备份。


    #### 本地数据备份

    `SHB` 是否正在将文件保存到连接的 `USB Drive` 中？如果将所有必要文件都复制到安装在 `SHB` 计算机上的第二个驱动器上，这将简化备份过程。选择一个系统来本地备份
    `SHB` 的数据可能是具有成本效益的，但它存在需要考虑的问题。备份计划是什么？对于 `SHB` 来说，最佳实践是每晚备份。适用于个人和 `SHB` 的备份软件随处可见。大多数软件都允许用户设置计划，在每天或每晚的固定时间自动备份其数据。具有加密功能的软件可以增加数据安全性，防止黑客访问并阻止
    `SHB` 客户个人数据的泄露。


    最近的备份副本应从现场移除并存储在异地。如果办公室发生火灾，只要备份在异地是安全的，业务就能从这场灾难中生存。如果 `SHB` 不遵守备份计划以及将副本移至异地存储，这一切都无法实现。


    #### 使用网络附属存储设备

    网络附属存储设备 (`NAS`) 是 `SHB` 备份数据的一种非常有效的方法。`NAS` 是连接到 `SHB` 网络的的文件级数据存储服务器。这些小型设备的优势在于，它们可以为网络上的所有人提供计算机数据存储。`NAS`
    可以连接到公司内部路由器，并为每个人提供一个独立的驱动器号来备份其数据。大多数设备安装和操作非常简单，不需要 IT 人员进行安装。由于它们仍然是硬盘，因此需要监控。它们是备份和数据保留的极佳选择。在图
    8.3 中，我们描述了如何正确备份数据以防止数据丢失。遵循这一过程有助于家庭用户在多个位置保护数据，从而防止由于数据存储在单一位置而导致的丢失。


    ![](img/fig8-3.jpg)

    **图 8.3 最佳备份概念。**


    ### 处理 SHB 设备

    备份很重要，但当 `SHB` 不再需要所有的计算机和手机时，它们该如何处理？`SHB` 是否需要为了目的保留数据？处理设备的首要考虑因素是不让个人、公司数据遗留在设备上。将
    `SHB` 设备捐赠给维修它的非营利组织是件好事。这符合法律吗？


    首要目标是让你的数据变得不可读。数据销毁应确保没有任何人可以恢复它。考虑该过程所需的时间和成本也是重要的。另一个考虑因素是法律要求规定的销毁。如果是，请确保销毁过程符合法律。数据销毁的最佳标准之一是美国国家标准技术研究院
    (`NIST`) 指南（[`nvlpubs.nist.gov/nistpubs/nist800-88.pdf`](https://nvlpubs.nist.gov/nistpubs/nist800-88.pdf)）。是一些可能的数据销毁方法：


    1. `删除/格式化`：这是最不推荐的方法，因为数据可能被恢复。

    2. `数据擦除`：这是通过在现有数据上写入数据来彻底消除现有数据的过程。

    3. `消磁`：这是使用强磁铁破坏数据的过程（这可能适用于硬盘，但不适用于固态设备）。

    4. `物理销毁`：通过在硬盘上钻孔、使用锤子将设备击碎或粉碎来破坏设备。有用于完全销毁驱动器的硬盘粉碎机。


    这些技术可以用于计算机、硬盘、手机、优盘或 `IoT 设备`。`SHB` 的销毁选择取决于过程所需的时间和成本。另一个潜在资源是寻找当地专门从事数据销毁的公司。


    #### 数据保留法律要求

    `SHB` 是否被告知需要保留数据以备诉讼？及时妥善地应对是避免昂贵诉讼费用（包括法院制裁）的必要。数据很容易被覆盖，即使是无意的，`SHB` 也可能为丢失承担责任。请尽快联系律师和数字取证专家获取数据保留方面的建议和协助。


    #### 设备跟踪

    有些程序可以帮助 `SHB` 跟踪其设备，以防被盗窃或丢失。它们通常还可以远程擦除设备以防止数据被窃。再次，Google 搜索是寻找符合 `SHB` 需求最佳方法之一。


    ### 结论


