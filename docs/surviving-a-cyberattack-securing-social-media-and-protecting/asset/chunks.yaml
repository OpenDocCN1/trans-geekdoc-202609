- raw: '[Table 9.2](#chapter09.xhtml#tab9-2) describes the kinds of general categories
    of crime types that can be used to attack your computers and smart phones. [Figure
    9.3](#chapter09.xhtml#fig9-3) is an image that describes this process.


    TABLE 9.2  Cybercrime general categories


    | Crimes against computing devices || Crimes using computing devices |


    | --- | --- |


    | viruses || phishing emails |


    | malware || spear phishing |


    | ransomware || smishing |


    | denial of service attacks (DOS) || cyberstalking |


    |  || identity theft |


    |  || Social engineering (this can also be accomplished without a computer via
    a telephone call or message or even through a letter) |


    ![](image/fig9-3.jpg)


    FIGURE 9.3  What a data attack can look like.


    Regular Data Backups


    In today’s world, almost every picture taken, and every communication made is
    done on a computer or cell phone. More than half the world’s Internet users access
    the Internet from a smartphone. When computing devices fail either by accident
    or due to malicious activity, family pictures of deceased loved ones, business
    documents, schoolwork, and so on are all gone unless the data was backed up. The
    most important measure to take to insure one recovers from data disasters is adopting
    procedures for creating regular backups that were discussed in [Chapter 8](#chapter08.xhtml).


    THE IMMEDIATE CYBER-RESPONSE


    [Table 9.3](#chapter09.xhtml#tab9-3) is a checklist that includes FBI general
    guidelines for dealing with an attack on a computer system with a few additional
    suggestions. More information from the FBI can be found at [https://www.fbi.gov/investigate/cyber#What-You%20Should%20Know](https://www.fbi.gov/investigate/cyber#What-You%20Should%20Know)
    and [https://www.fbi.gov/how-we-can-help-you/scams-and-safety/common-scams-and-crimes/ransomware](https://www.fbi.gov/how-we-can-help-you/scams-and-safety/common-scams-and-crimes/ransomware)


    Ransomware Attacks


    This book has repeated stressed to keeping operating systems, software (including
    sure antivirus and antimalware) and applications current and up to date, and data
    backup procedures, and not clicking on links or making questionable downloads.
    All these steps are also FBI recommendations for preventing ransomware attacks
    along with creating a contingency plan in case of an attack. The FBI position
    does not support paying ransom. They note:


    Paying a ransom doesn’t guarantee you or your organization will get any data back.
    It also encourages perpetrators to target more victims and offers an incentive
    for others to get involved in this type of illegal activity. If you are a victim
    of ransomware contact your local FBI field office to request assistance, or submit
    a tip online. File a report with the FBI’s Internet Crime Complaint Center (IC3).
    (Federal Bureau of Investigation, n.d.) [Figure 9.4](#chapter09.xhtml#fig9-4)
    is an example of a message a computer might display during a ransomware attack.


    ![](image/fig9-4.jpg)


    FIGURE 9.4  Example ransomware note on a computer.


    In [Table 9.3](#chapter09.xhtml#tab9-3) we have provided a checklist of considerations
    if you become a victim of a ransomware attack. Review this before an attack so
    you can have an idea of the kinds of things you need to accomplish of you ever
    do become a ransomware victim.


    TABLE 9.3  Cyberattack Response Checklist


    | Action || Date || Notes |


    | --- | --- | --- |


    | Isolate all potentially infected computers. This means removing all the possibly
    infected devices from the network. This will prevent any further exposure to the
    network. Physically discount the network cable from the computer or turn off Wi-Fi
    on the device. ||  ||  |


    | Power off any other devices. ||  ||  |


    | Immediately secure backup data or systems by taking them offline. ||  ||  |


    | Change online account passwords and network passwords. ||  ||  |


    | Review logs. Computers and networks servers have logs of the computer’s and
    users’ actions. Reviewing these logs can provide information about the extent
    of the attack. IT support assistance may be needed to find and interpret these
    logs ||  ||  |


    | Get help from local IT support as needed. ||  ||  |


    | Warn family, friends, and associates about the possible attack. ||  ||  |


    | Contact kaw enforcement ([Chapter 6](#chapter06.xhtml), see [Table 6.9](#chapter06.xhtml#tab6-9))
    ||  ||  |


    | Contact the ISP, social media, or Web site involved. ||  ||  |


    | Close affected accounts ||  ||  |


    RESPONDING TO CYBER HARASSMENT


    Don’t engage: Don’t react to the harasser, don’t respond or reply to messages
    or posts, simply do not acknowledge the person’s existence. Online harassers generally
    only want a reaction from the user. Getting none most likely will stop their activity.


    Block: Take the proper measures to prevent this person from contacting the user
    on the service. Most social media services have some way to block contact.


    Report them: Notify the Web service they contacted the user on, and if needed,
    contact law enforcement.


    Checking for spyware: This is a little trickier, but make sure antivirus software
    is up to date. If the user still thinks there is an issue with their phone or
    computer (the stalker has hacked the user’s device), stop using it, change accounts,
    and get a new phone or computer. If things get worse, consider consulting with
    an expert on digital hacking. Beware some stalkers may leave a tracking device
    in their victim’s vehicle or person. Seek law enforcement assistance if this is
    suspected.


    What to do if they show up in real life: Call 911 if it’s an emergency. If the
    user can’t escape the location, go somewhere safe, then call 911.


    CONTACTING LAW ENFORCEMENT


    If the police don’t know the crime occurred, there is nothing they can do to assist
    the user. The case may seem minor, but reporting it lets the authorities know
    a criminal is at work. The user’s report, even if it’s minor, may provide necessary
    information to further law enforcement investigations. Other things to consider
    include:


    1.Always contact law enforcement if someone is in immediate danger.


    2.Reporting the loss to your insurance company often requires a police report
    number.


    3.Contact the companies and banks where the fraud occurred.


    4.Place fraud alerts through all the credit reporting agencies and ask for credit
    reports.


    REPORTING A CYBERCRIME


    [Chapter 6](#chapter06.xhtml) (this volume; [Tables 6.9](#chapter06.xhtml#tab6-9)
    and [6.10](#chapter06.xhtml#tab6-10)) provides law enforcement contacts for reporting
    cybercrimes. Law enforcement will require a variety of information that points
    to the activities who, what, where, when, and why. The following is the information
    that may be required to make a report.


    Documentation


    Documentation is evidence law enforcement can use to commence an investigation
    and a picture is worth 1,000 words. It is suggested to take screen shots of the
    incident with one important exception. If the report is about a site or person
    that is accused of human trafficking or specifically shows appalling images of
    children in a sexual context, do not copy them, screenshot them, or save them
    to a computer or other media. Doing so may be violating the same law that is being
    reported. Take notes that identify the site location and/or who posted. For instructions
    on taking screen shots see Windows, Mac, Smartphone, or do a Google search for
    the user’s specific device + screenshot. [Figure 9.5](#chapter09.xhtml#fig9-5)
    uses the Facebook Group, The Cyber Safety Guys, to give the user the important
    focus areas. It will likely require taking several screenshots to make sure all
    information is captured. Be aware of where the screenshots are being saved, as
    they are going to be needed later. If the user can’t take screenshots, consider
    printing the material out. The user also might take digital pictures of the material.'
