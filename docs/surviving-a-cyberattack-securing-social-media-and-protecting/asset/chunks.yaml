    # 财务与报告程序


    1. **联系金融机构**：一旦怀疑发生身份盗用或欺诈，请立即联系银行、信用卡公司和其他金融机构。告知他们可疑活动，并要求他们冻结账户以防止进一步的未经授权的交易。


    2. **向当局报案**：向当地警察部门或相应机构报案。（美国居民请参考第 6.7 表，美国境外地区请参阅第 6.8 表）。这将有助于为事件建立官方记录，并可能对于后续步骤（如对欺诈费用提出争议或保险用途）是必要的。


    3. **检查信用报告**：向一家主要的信用信局索取一份信用报告副本。第 9 章包含了 Equifax、Experian 或 TransUnion 的联系方式，以及美国境外其他信用信局的联系方式。仔细检查报告，查看是否有任何未经授权的账户或查询。如果发现任何差异，请向信用信局提出争议。


    4. **监控您的账户和信用**：定期监控银行和信用卡账单，以发现任何不熟悉的费用或交易非常重要。考虑在信用报告上设置欺诈警报或信用冻结，以防止在您不知情的情况下以您的名义开设账户。考虑注册信用监控服务，以便在信用报告出现任何可疑活动时接收提醒。


    ## 向适当当局报案


    报告网络诈骗可以帮助防止他人陷入同样的诈骗陷阱，并协助对诈骗者进行调查和起诉。当有人成为诈骗目标时，采取行动并向适当当局报案至关重要。第 6.6 表提供了向执法部门报告网络犯罪的步骤。如果您或您的亲人成为受害者，请审阅这些步骤。


    ### 表 6.6 向当局报案诈骗


    | 步骤 | 描述 |

    | :--- | :--- |

    | 收集所有必要信息 | 在报案诈骗之前，收集有关诈骗者和诈骗本身的所有细节非常重要。这包括收到的任何通信或文件，以及诈骗者的姓名、联系信息和任何其他身份信息。
    |

    | 联系适当当局 | 如果诈骗涉及财务欺诈，请联系当地警察部门。在美国，还需向联邦贸易委员会（FTC）或消费者金融保护局（CFPB）报告。如果是网络诈骗，请向互联网犯罪投诉中心（IC3）报告。对于与身份盗用相关的诈骗，请联系联邦贸易委员会（FTC）或社会安全局（SSA）。对于涉及联邦税退款计划的案件，请联系美国国税务局（IRS）。
    |

    | 提交报告 | 这些当局大多数都有在线投诉表单，可以通过填写这些表单来报告诈骗。这些表单通常要求提供诈骗细节、诈骗者信息和联系方式。确保在报告中提供尽可能详细的细节。
    |

    | 跟进 | 报案后，向当局跟进至关重要，以确保他们已收到报告并且他们正在采取适当行动。索要报告的案件号或参考号，这将有助于跟踪调查进度。 |

    | 向相关金融机构报案 | 如果诈骗涉及信用卡或借记卡的欺诈交易，请立即向银行或信用卡公司报告。他们可能撤销交易并防止进一步的欺诈扣。 |

    | 告知他人 | 诈骗者通常针对多个受害者，因此向他人发出诈骗警告非常重要。向消费者保护机构报案，在社交媒体上分享经历，或在跟踪诈骗和欺诈的网站上发表评论。
    |

    | 警惕后续诈骗 | 报案后，受害者可能会收到冒充当局的诈骗者发来的后续电话或邮件。他们可能会索要更多个人信息或金钱以帮助解决诈骗。警惕这些后续诈骗，并始终通过第
    9 章核实其真实性。 |


    ### 表 6.7 在美国报告网络犯罪


    | 机构 | 搜索方式 |

    | :--- | :--- |

    | 当地警察部门 | 搜索 `[城市名] 警察局`（例如：克利夫兰警察局） |

    | 州检察长办公室 | 搜索 `[州名] 检察长办公室`（例如：内华达州检察长办公室） |

    | 联邦调查局（FBI） | 联邦调查局（FBI） |

    | 互联网犯罪投诉中心（IC3） | 联邦贸易委员会（FTC） |

    | 消费者金融保护局（CFPB） | 联邦贸易委员会（FTC） |

    | 美国国税务局（IRS） | 美国国税务局（IRS） |

    | 联邦贸易委员会（FTC） | 联邦贸易委员会（FTC） |

    | 社会安全局（SSA） | 社会安全局（SSA） |

    | 联邦邮政检查局（USPIS） | 联邦邮政检查局（USPIS） |


    ### 表 6.8 在美国境外报告网络犯罪


    报告机制因国家而异。有些国家有专门的在线选项，另一些国家则建议前往当地警察部门。


    | 国家 | 细节 |

    | :--- | :--- |

    | 澳大利亚 | 网络犯罪：[`www.cyber.gov.au/report-and-recover`](https://www.cyber.gov.au/report-and-recover)<br>身份盗用：[`www.scamwatch.gov.au/report-a-scam`](https://www.scamwatch.gov.au/report-a-scam)
    |

    | 加拿大 | 网络犯罪：[`www.cyber.gov.ca/incident-management`](https://www.cyber.gov.ca/incident-management)<br>身份盗用：[`www.priv.gc.ca/privacy-topics/identities/identity-theft/guide/`](https://www.priv.gc.ca/privacy-topics/identities/identity-theft/guide/)
    |

    | 欧盟 | 网络犯罪：[`www.europol.europa.eu/report-a-crime/report-cybercrime-online`](https://www.europol.europa.eu/report-a-crime/report-cybercrime-online)<br>欺诈：[`anti-fraud.ec.europa.eu/olaf-and-you/report-fraud/`](https://anti-fraud.ec.europa.eu/olaf-and-you/report-fraud/)
    |

    | 日本 | |


