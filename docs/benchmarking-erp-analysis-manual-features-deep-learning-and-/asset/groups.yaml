    # III. DATASETS


    # A. Datasets


    In light of the limited availability of public ERP datasets, we systematically
    searched all accessible resources known to the authors, including platforms such
    as OpenNeuro, FigShare, and PhysioNet. We identified 12 datasets, each with a
    sufficient sample size (40+ subjects) to ensure robust statistical evaluation,
    including ADHD-WMRI [53], AOPD [54], CESCA-AOOD, CESCA-VOOD, CESCA-FLANKER [55],
    mTBI-ODD [56], NSERP-MSIT, NSERP-ODD [57], PD-ODD [58], PD-SIM [58], RLPD [59],
    and SCPD [60]. These datasets span a broad range of cognitive paradigms and clinical
    conditions, including attention deficit hyperactivity disorder (ADHD), Parkinsons
    disease (PD), traumatic brain injury (TBI), and aging-related cognitive decline.
    To ensure fair and consistent benchmarking, all datasets are preprocessed using
    a unified ERP preprocessing pipeline (Section III-B).


    Among them, 6 datasets, including CESCA-AOOD, CESCA-VOOD, CESCA-FLANKER, mTBI-ODD,
    NSERP-MSIT, and NSERP-ODD, are used for ERP stimulus classification, which aims
    to distinguish cognitive responses elicited by different experimental conditions,
    such as target vs non-target and congruent vs incongruent stimuli. The remaining
    6 datasets, including PD-SIM, PD-ODD, RLPD, SCPD, AOPD, and ADHD-WMRI, are employed
    for brain disease detection tasks.


    # B. Data Preprocessing Pipeline


    To get ERP trials for training, we apply the following unified preprocessing pipeline.
    1) Removal of non-EEG channels: All non-EEG channels are removed, such as EOG
    or coordinate information. 2) Notch and band-pass filtering: A notch filter at
    50 Hz or 60 Hz is applied to suppress line noise, followed by a band-pass filter
    between 0.5 Hz and 45 Hz. 3) Bad channel interpolation: Bad channels are interpolated
    when marked. 4) Average re-referencing: Average re-referencing is applied to reduce
    global noise and potential baseline shifts. 5) Artifact removal: Independent component


    analysis (ICA), combined with ICLabel [61], is used to automatically identify
    and remove components associated with eye blinks, muscle activity, and cardiac
    artifacts. 6) Resampling: All recordings are resampled to a uniform sampling rate
    of 200 Hz. 7) Baseline correction: Baseline correction is applied to enhance stimulus-related
    ERP components relative to background noise. 8) Trial epoching: EEG recordings
    are then segmented into ERP trials based on stimulus events, and the non-ERP recordings
    are discarded (e.g, resting state). The baseline correction and epoch window length
    vary across ERP tasks and datasets. 9) Z-Score Normalization: Each channel of
    every segmented ERP trial is normalized independently to zero mean and unit variance.
    The statistics of the processed datasets are summarized in Table I. More details
    of the preprocessing are provided in our GitHub repository.


    # IV. METHOD


    # A. Manual Extract Features


    Widely used features in spontaneous EEG and ERP data analysis. We manually extract
    these features and apply a linear projection layer to them for ERP task classification.


    1) EEG Feature Extraction: We compute 31 widely used features, including 10 time-domain
    statistical features, 11 frequency band features, 7 spectral distribution features,
    and 3 data complexity features.


    Time-Domain Statistical Features: These include the mean, median, minimum, maximum,
    skewness, kurtosis, root mean square (RMS), interquartile range, and standard
    deviation [21]-[23], [33]. Statistical features are designed to capture fundamental
    time-domain statistical characteristics of EEG signals.


    Frequency-Band Power Features: This category consists of absolute power in the
    δ, θ, α, and β bands, total power, the θ/α ratio, the α/β ratio, and the relative
    power of the four frequency bands [31]-[33]. Absolute band power is computed by
    numerically integrating the power spectral density (PSD) within each frequency
    band, providing a direct measure of oscillatory energy associated with specific
    neuro processes.'
