    ## D. ERP Transformer的Patch嵌入比较


    现有的EEG Transformer模型通常采用三种类型的token嵌入：多变量（multi-variate）、单变量（uni-variate）和全变量（whole-variate）。例如，Medformer
    [74]采用多变量patch嵌入，PatchTST [72]采用单变量patch嵌入，iTransformer [73]使用全变量patch嵌入。给定一个多变量EEG输入样本（x
    ∈ ℝ^{T×C}）和patch长度L，多变量嵌入使用patch p ∈ ℝ^{L×C}，单变量嵌入使用patch p ∈ ℝ^{L×1}，全变量嵌入使用patch
    p ∈ ℝ^{1×C}。这些patch随后被线性投影为token嵌入，作为Transformer编码器的输入。图5展示了这三种嵌入策略。为了研究哪种嵌入方法最适合ERP数据分类，我们实现了一个Transformer模型并评估了三种token嵌入设计。Transformer架构的所有其他组件在不同设置下保持一致，从而可以对嵌入方法进行受控比较。我们希望这一比较能够为未来设计用于ERP分析的Transformer的工作提供启发。


    ## A. 实验设置


    所有方法的批量大小均为128。训练轮数设置为200，并基于最佳F1分数进行早停（patience=15）。我们使用AdamW优化器，学习率为1×10^{−4}，并通过CosineAnnealingLR进行调度。模型性能使用准确率、F1分数和AUROC进行评估。我们采用受试者独立评估协议[79]下的蒙特卡洛交叉验证，训练集、验证集和测试集的受试者比例为6:2:2。这一设置确保各划分之间没有受试者重叠，同时在不同随机种子下保持受试者划分的随机性。对于基础模型方法，包括BIOT、LaBraM和CBraMod，我们对其公开发布的检查点进行微调。每个实验使用五个随机种子（41-45）重复进行，结果以均值和标准差报告。所有实验均在4块NVIDIA
