    are directly applicable to ERP decoding. This gap necessitates systematic benchmarking
    of methods for ERP analysis.


    To this end, we conduct a comprehensive and fair benchmark evaluation of ERP classification
    methods. We implement a wide range of approaches, including 2 manual feature extraction
    methods (with 31 and 91 handcrafted features, respectively), 10 state-of-the-art
    deep learning methods for EEG, and 3 advanced EEG foundation models, within a
    unified data preprocessing and evaluation framework. The benchmark covers two
    representative and practical ERP classification tasks across **12 datasets**.
    The first focuses on **ERP stimulus classification**, such as distinguishing standard
    and target stimuli in oddball paradigms, to evaluate models’ ability to capture
    fundamental stimulus-locked cognitive responses. The second addresses **ERP-based
    brain disease detection**, such as identifying neurological or psychiatric conditions,
    thereby assessing model utility in more complex and clinically relevant scenarios.
    Furthermore, to guide the development of more effective models, we conduct a comparative
    analysis of three prevalent patch-embedding strategies for EEG data within a state-of-the-art
    Transformer framework. This embedding comparison aims to identify the optimal
    embedding method for ERP classification, offering critical insights for designing
    dedicated Transformer backbones for **ERP analysis**. All the tasks are performed
    under a rigorously **subject-independent** setup to evaluate cross-subject learning
    ability.


    In summary, our motivation is to answer the following question through this systematic
    benchmark study:


    +   - **Q1:** How do deep learning-based EEG methods compare with traditional
    manual feature extraction methods when applied to ERP data?

    +   - **Q2:** Do EEG Foundation Models with pre-trained weights outperform supervised
    EEG deep learning models trained from scratch on ERP classification tasks?

    +   - **Q3:** What is the most robust and generalizable method for ERP classification
    so far?

    +   - **Q4:** Which patch embedding strategy is most suitable for designing ERP-specific
    Transformer models?


    To provide a concise **takeaway message**, we summarize the answers below for
    the readers convenience:


    +   - **A1:** Most deep learning methods consistently outperform manual feature
    extraction approaches on ERP tasks.

    +   - **A2:** Existing EEG foundation models do not demonstrate clear performance
    advantages over supervised deep learning models trained from scratch.

    +   - **A3:** **EEGConformer** achieves the best average ranking and shows the
    most competitive overall performance.

    +   - **A4:** Uni-variate patch embedding (See Figure 5) achieves better overall
    performance than multi-variate and whole-variate patching strategies for ERP-specific
    Transformer.


    The rest of this paper is organized as follows: Section **III** presents statistical
    information about the ERP datasets used in this study, along with the unified
    preprocessing pipeline. Section **IV** describes the methods compared in our benchmark,
    as well as a test Transformer implemented for embedding comparison. Section **V**
    provides implementation details and reports experimental results with corresponding
    analysis. Section **VI**


    discusses the limitations of existing methods and outlines directions for future
    work. Section **VII** concludes the paper.


    # II. RELATED WORK


    **Manual Feature Extraction:** There is a long history of identifying potential
    biomarkers in ERP signals for classification or brain interpretation. Different
    types of features are used, including statistical features like mean, skewness,
    kurtosis, and standard deviation [21]–[23], time-domain shape features such as
    line length, peak-to-peak amplitude, and positive/negative peak amplitudes [24]–[26],
    spectral distribution features like phase shift, phase coherence, bispectrum,
    and bicoherence [27]–[30], frequency-band power features like power spectrum density,
    relative band power, ratio of EEG rhythm, and energy [31]–[33], complexity features
    like Shannon entropy, Tsallis entropy, and permutation entropy [34]–[36], and
    Hjorth parameters such as activity, mobility, and complexity [37]–[39].


    **Deep Learning Methods:** Deep learning methods with diverse architectures are
    widely used for EEG decoding. EEGNet [40] is a classic lightweight convolutional
    model, while EEG-Inception [41] extends temporal convolution with depthwise spatial
    blocks for ERP-based BCIs. AMWCN [42] integrates wavelet-based multiscale analysis
    and attention mechanisms to identify discriminative frequency bands and temporal
    segments. Transformer-based approaches, such as EEG-Transformer [43] and EEGConformer
    [44], leverage self-attention to capture long-range temporal dependencies and
    global contextual information in EEG signals. Neuro-BERT [45] introduces masked
    autoencoding for robust EEG representation learning, LGGNet [46] explicitly models
    local-global brain functional graphs, MOCNN [47] proposes multiscale octave convolution
    for ERP classification, and EEGMamba [48] employs bidirectional Mamba modules
    for efficient long-sequence EEG modeling.


    **Foundation Models:** Foundation models, which have achieved remarkable success
    in computer vision and natural language processing domains, are increasingly being
    explored for EEG representation learning. LaBraM [17] introduces a large-scale
    EEG foundation model that employs a neural tokenizer to reconstruct spectral representations
    during pre-training, enabling effective transfer to downstream EEG classification
    tasks. EEGPT [18] proposes a masked self-supervised learning framework based on
    high signal-to-noise EEG representations, enhanced by spatio-temporal representation
    alignment. FORMED [49] repurposes a general time series foundation model to EEG
    downstream tasks. NeuroLM [50] conceptualizes EEG signals as a foreign language
    and adopts language-model-inspired architectures to learn unified representations
    across cognitive and clinical tasks. LUNA [51] presents a topology-agnostic EEG
    foundation model using cross-attention mechanisms, supporting robust learning
    under heterogeneous channel montages. CSBrain [52] explores cross-scale spatiotemporal
    tokenization with structured sparse attention to model dependencies between local
    and global brain regions.'
