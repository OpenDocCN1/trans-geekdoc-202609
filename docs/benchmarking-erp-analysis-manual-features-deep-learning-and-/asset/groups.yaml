    # B. *Deep Learning Models*


    Deep learning methods for general time-series, medical time-series, and EEG data
    classification. They are trained from scratch in a fully supervised learning manner.
    We select classic or state-of-the-art methods with publicly available code.


    +   1) *TCN:* TCN [69] is a convolutional architecture designed explicitly for
    time-series modeling. They extend residual networks by incorporating causal and
    dilated convolutions, enabling effective learning of long-range temporal dependencies.
    By flexibly controlling receptive field size, TCNs balance model capacity and
    computational efficiency, thereby making them adaptable to time-series data across
    diverse domains. TCNs remain a strong and widely adopted baseline for time-series
    classification tasks, including EEG analysis.


    +   2) *ModernTCN:* ModernTCN [70] is a convolutional architecture designed for
    general time-series analysis and demonstrates strong performance, particularly
    in classification. It combines depthwise convolutions with multiple pointwise
    convolutions and introduces channel-independent embedding mechanisms. This design
    effectively addresses key limitations of convolutional models in multivariate
    time-series tasks, where performance is often constrained by small receptive fields
    and difficulties in modeling inter-variable dependencies.


    +   3) *TimesNet:* TimesNet [71] is a convolutional model for time-series analysis,
    especially on classification tasks. It transforms one-dimensional time-series
    data into two-dimensional tensors across multiple periodicities (where rows and
    columns represent intra- and inter-period variations, respectively), thereby leveraging
    the strengths of 2D convolutional networks for time-series analysis. The model’s
    core component, Times-Block, employs a parameter-efficient Inception module to
    extract complex temporal variations from 2D tensors.


    +   4) *PatchTST:* PatchTST [72] is a transformer-based model for time series
    prediction and representation learning, with its core innovation lying in a dual
    design of patching and channel independence. The model decomposes multi-channel
    data into multiple one-channel patches, treating them as semantically informative
    sub-sequence fragments for input. This approach preserves local features while
    significantly reducing computational complexity.


    +   5) *iTransformer:* The iTransformer [73] proposes a novel data-embedding method
    based on the transformer architecture for multivariate time-series analysis. Its
    distinctive feature is the reversal of the conventional tokenization strategy.
    Instead of using multi-channel samples at a single time point into a single temporal
    token, iTransformer treats each channel/variate as an independent variable token.
    This adjustment enables the self-attention module to model correlations between
    variables directly, thereby enhancing interpretability.


    +   6) *Medformer:* Medformer [74] is a multi-granularity patching Transformer
    model designed explicitly for medical time-series data (e.g., EEG, ECG). It captures
    correlations across signal channels via cross-channel patching and extracts features
    at multiple temporal scales via multi-granularity embedding. Subsequently, it
    applies two-stage (intra-granularity & inter-granularity) multi-granularity self-attention
    to learn features. Medformer is a modified Transformer model adapted for medical
    electro-biological time-series data.


    +   7) *MedGNN:* MedGNN [75] proposes a multi-scale spatio-temporal graph learning
    framework for medical time series such as electroencephalograms. This framework
    models cross-channel spatial relationships by constructing adaptive graph structures
    and integrating multi-scale temporal features via frequency-domain convolution.
    MedGNN further employs a differential-based attention mechanism and multi-scale
    graph transformers to capture local temporal dynamics and global graph dependencies
    in a synergistic manner.


    +   8) *EEGNet:* As a classic deep learning application in the EEG domain, EEGNet
    [40] efficiently extracts temporal and spatial features via convolutional operations.
    By stacking 2D temporal, depthwise, and separable convolution modules, it captures
    frequency features and feature relationships across different electrode channels.
    Its structure is compact and requires low space and computational cost.


    +   9) *EEGInception:* EEGInception [41] pioneers the integration of Inception
    modules [76] into deep learning models for ERP detection tasks. By employing multi-scale
    temporal convolutions to extract features across different temporal scales within
    EEG signals concurrently, and incorporating separable convolutions, batch normalization,
    and Dropout, it constructs a lightweight and efficient network architecture.


    +   10) *EEGConformer:* EEGConformer [77] is a Transformer-based architecture
    that integrates convolutional networks for spatio-temporal feature embedding with
    self-attention mechanisms for EEG representation learning. This design combines
    the strengths of convolutional networks in capturing local spatio-temporal patterns
    and self-attention in modeling global dependencies, while maintaining parameter
    efficiency and enhancing the ability to represent complex EEG structures.


