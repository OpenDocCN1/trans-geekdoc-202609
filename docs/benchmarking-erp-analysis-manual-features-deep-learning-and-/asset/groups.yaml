    a neural tokenizer to reconstruct spectral representations during pre-training,
    enabling effective transfer to downstream EEG classification tasks. EEGPT [18]
    proposes a masked self-supervised learning framework based on high signal-to-noise
    EEG representations, enhanced by spatio-temporal representation alignment. FORMED
    [49] repurposes a general time series foundation model to EEG downstream tasks.
