    # # Benchmarking ERP Analysis: Manual Features, Deep Learning, and Foundation
    Models


    Yihe Wang, Zhiqiao Kang*, Bohan Chen*, Yu Zhang, Xiang Zhang✉


    **Abstract—** Event-related potential (ERP), a specialized paradigm of electroencephalographic
    (EEG), reflects neurological responses to external stimuli or events, generally
    associated with the brains processing of specific cognitive tasks. ERP plays a
    critical role in cognitive analysis, the detection of neurological diseases, and
    the assessment of psychological states. Recent years have seen substantial advances
    in deep learning-based methods for spontaneous EEG and other non-time-locked task-related
    EEG signals. However, their effectiveness on ERP data remains underexplored, and
    many existing ERP studies still rely heavily on manually extracted features. In
    this paper, we conduct a comprehensive benchmark study that systematically compares
    traditional manual features (followed by a linear classifier), deep learning models,
    and pre-trained EEG foundation models for ERP analysis. We establish a unified
    data preprocessing and training pipeline and evaluate these approaches on two
    representative tasks, ERP stimulus classification and ERP-based brain disease
    detection, across 12 publicly available datasets. Furthermore, we investigate
    various patch-embedding strategies within advanced Transformer architectures to
    identify embedding designs that better suit ERP data. Our study provides a landmark
    framework to guide method selection and tailored model design for future ERP analysis.
    The code is available at https://github.com/DL4mHealth/ERP-Benchmark.


    +   **Index Terms—** ERP, event-related potential, EEG, brain-computer interfaces,
    deep learning, foundation model


    ![](img/6b8a0cc86f73ccc8d474525448d82e6d_0_0.png)


    **Fig. 1:** **ERP vs Spontaneous EEG.** ERP is inherently different from Spontaneous
    EEG, requiring specific analysis methods.


    # I. INTRODUCTION


    Event-related potential (ERP) is an EEG-derived measure of time-locked neural
    activity, serving as a foundational tool with broad applications in neuroscience,
    dementia, and cognitive science [1]–[3]. As a specialized category within the
    broader EEG signal domain, ERP exhibits distinct characteristics compared to spontaneous
    EEG activity [4]. While spontaneous EEG reflects ongoing intrinsic brain states
    but with limited functional specificity, ERP captures time-locked neurological
    responses elicited by specific sensory, audio, or cognitive


    events [5]–[7]. By aligning neural signals to controlled stimuli, ERP provides
    a direct and interpretable window into transient cognitive processes. The primary
    advantage of ERP lies in its temporal synchrony between external events and internal
    brain electrical responses, which typically yields a higher signal-to-noise ratio
    than spontaneous EEG activity [8]. In practice, ERP trials are extracted from
    continuous EEG recordings by segmenting event-centered epochs [3]. A short pre-stimulus
    interval (typically 0.2-0.5 seconds) is used for baseline correction to suppress
    background noise, followed by a longer post-stimulus interval (typically 0.8-1.5
    seconds) that contains the stimulus-evoked neural potential [9]. Figure 1 illustrates
    a signal comparison between ERP and spontaneous EEG.


    In recent years, deep learning has achieved substantial progress in EEG decoding
    across a wide range of applications, including motor imagery control [10], emotion
    recognition [11], sleep stage classification [11], seizure detection [12], and
    dementia detection [13]. Advanced deep learning techniques, such as foundation
    models that have demonstrated remarkable success in natural language processing,
    computer vision, and multimodal learning (e.g., ChatGPT [14], Gemini [15], and
    DINOv2 [16]), are also beginning to be explored for learning generalizable EEG
    representations. Recent EEG foundation models, including LaBraM [17], EEGPT [18],
    and CBraMod [19], have reported strong performance on various EEG downstream tasks.
    However, most existing deep learning model designs primarily target spontaneous
    EEG signals, such as resting-state and sleep EEG [11], or non-time-locked task-induced
    EEG, such as motor imagery [20]. In contrast, time-locked evoked EEG signals,
    exemplified by ERP, remain significantly underexplored. As a result, ERP analysis
    continues to rely mainly on manual feature extraction and conventional statistical
    approaches, or directly employs models designed for spontaneous EEG to ERP analysis,
    resulting in suboptimal performance. Given the distinct signal characteristics
    of ERP and its fundamental differences from spontaneous EEG, it remains unclear
    to what extent recent advances in deep learning


