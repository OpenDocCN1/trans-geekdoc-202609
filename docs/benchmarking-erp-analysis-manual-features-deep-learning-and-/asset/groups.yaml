  mdcn: '

    在受试者无关的评估设置下进行，旨在识别能够跨受试者泛化用于真实世界疾病检测应用的疾病特异性 ERP 特征。在六个数据集（PD-SIM、PD-ODD、ADHD-WMRI、SCPD、RLPD
    和 AOPD）中，最佳方法的 F1 分数分别为 66.79%、67.37%、66.43%、74.33%、73.87% 和 69.26%。总体而言，没有单一的
    ERP 范式在疾病检测中持续表现出明显优势。值得注意的是，三个较小的帕金森病数据集 SCPD、RLPD 和 AOPD 的性能相对高于两个较大的数据集 PD-SIM
    和 PD-ODD。这种趋势可能归因于较小数据集中更平衡的数据分布，其中帕金森病患者和健康对照受试者的数量完全相等。在方法比较方面，顶级性能主要由从头训练的深度学习模型以及从基础模型检查点微调的模型实现。基于手动提取特征的两种方法从未达到顶级结果。此外，与
    ERP 刺激类型分类不同，ERP 特异性特征在疾病检测中并不能始终优于通用 EEG 特征。在多个数据集中，ERP 特异性特征甚至表现更差，这表明这些数据集中的疾病相关信息可能与规范的
    ERP 成分关联不紧密。


    ## D. 整体性能分析


    为了在多个任务和评估指标上对不同方法进行全面比较，我们进一步分析了 15 种方法在 12 个数据集 × 3 个评估指标上的整体性能，共计 36 次评估。图
    4 展示了每种方法在全部 36 次评估中的平均排名，以及每种方法在每次评估上的具体排名热力图。排名越低且蓝色越深表示性能越好。


    我们观察到，从头训练的监督式深度学习模型在整体性能上持续优于其他方法。在所有评估方法中，EEGConformer 实现了最低的平均排名 3.96，表明其在多样化任务和评估指标上具有最稳定且具有竞争力的性能。继
    EEGConformer 之后，ModernTCN、TimesNet、CBraMod 和 Medformer 构成顶级群体。值得注意的是，只有 CBraMod
    属于基础模型类别，其余方法均是从头训练的。这表明现有基础模型可以部分迁移到 ERP 分类任务中。一个可能的解释是，目前的 EEG 基础模型很少在 ERP 特异性数据上进行预训练。大多数预训练资源由长序列自发
    EEG 组成，且未纳入 ERP 特异性预处理步骤，例如基线校正或基于事件的试验分段。因此，预训练期间学习到的表征可能与 ERP 为中心的下游任务并不最优对齐。基于手动特征的方法整体性能始终最差。在两种手工特征方法之间，ERP
    特异性特征相对优于通用 EEG 特征。这些结果凸显了手工统计和频域特征的局限性，它们难以在多样化的 ERP 范式和疾病条件下保持稳健性能，尤其是在受试者无关评估下。这表明，除了解释性或神经科学导向分析外，在以端到端性能为主要目标的真实世界应用中，手动特征提取的优势有限。


    ## E. Transformer 的 Patch 嵌入比较


    **Transformer 嵌入方法比较（F1 分数）**


    ![](img/6b8a0cc86f73ccc8d474525448d82e6d_8_0.png)


    *图 5：在现有 EEG Transformer 中常用的多变量、单变量和整体变量 token 嵌入之间的 F1 分数比较。所有其他 Transformer
    组件保持相同。*


    我们比较现有 EEG Transformer 模型中常用的三种 token 嵌入方法，以检验其对 ERP 数据分类的适用性。所有其他组件，包括自注意力模块、前馈网络和层归一化层，在各方法间保持相同。为了确保模型容量可比，多变量嵌入方法的
    patch 长度设为 25，单变量嵌入方法设为 100。因此，多变量、单变量和整体变量 token 嵌入方法的总参数数分别为 0.864、0.818 和 0.822
    百万。


    所有结果均以表 IV 中的 F1 分数报告。单变量嵌入方法实现了最佳性能


