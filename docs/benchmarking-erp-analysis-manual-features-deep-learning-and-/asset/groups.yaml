    ## D. Patch Embedding Comparison for ERP Transformer

    Existing EEG Transformer models commonly employ three types of token embeddings:
    multi-variate, uni-variate, and whole-variate. For example, Medformer [74] employs
    multivariate patch embedding, PatchTST [72] adopts univariate patch embedding,
    and iTransformer [73] uses whole-variate patch embedding. Given a multivariate
    EEG input sample (x ∈ ℝ^{T×C} and a patch length L, multi-variate embedding uses
    patches p ∈ ℝ^{L×C}, univariate embedding uses patches p ∈ ℝ^{L×1}, and whole-variate
    embedding uses patches p ∈ ℝ^{1×C}. These patches are then linearly projected
    into token embeddings that serve as inputs to the Transformer encoder. Figure
    5 illustrates the three embedding strategies. To investigate which embedding method
    is most suitable for ERP data classification, we implement a Transformer model
    and evaluate three token-embedding designs. All other components of the Transformer
    architecture are kept identical across settings, allowing a controlled comparison
    of the embedding methods. We hope this comparison could inspire future works on
    designing Transformers for ERP analysis.


    ## A. Experimental Setups

    Batch sizes are 128 for all methods. The training epochs are set to 200 with early
    stopping (patience=15) based on the best F1 Score. We use AdamW with learning
    rates of 1×10^{−4}, scheduled by CosineAnnealingLR. Model performance is evaluated
    using Accuracy, F1 Score, and AUROC. We adopt Monte Carlo cross-validation under
    the subject-independent evaluation protocol [79], with a 6:2:2 ratio of subjects
    for training, validation, and test split. This setup ensures that no subject overlaps
    across splits while maintaining random subject partitioning across different seeds.
    For foundation model methods, including BIOT, LaBraM, and CBraMod, we fine-tune
    their publicly released checkpoints. Each experiment is repeated with five random
    seeds (41-45), and results are reported with the mean and standard deviation.
    All experiments are conducted on 4 NVIDIA RTX A5000 GPUs using Python 3.10 and
    PyTorch 2.5.1+cu121. Additional implementation details and training scripts for
    each method are provided in our GitHub repository.


