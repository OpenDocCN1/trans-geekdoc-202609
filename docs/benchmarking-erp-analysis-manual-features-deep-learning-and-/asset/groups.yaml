    ### Manual Feature Extraction


    There is a long history of identifying potential biomarkers in ERP signals for
    classification or brain interpretation. Different types of features are used,
    including statistical features like mean, skewness, kurtosis, and standard deviation
    [21]–[23], time-domain shape features such as line length, peak-to-peak amplitude,
    and positive/negative peak amplitudes [24]–[26], spectral distribution features
    like phase shift, phase coherence, bispectrum, and bicoherence [27]–[30], frequency-band
    power features like power spectrum density, relative band power, ratio of EEG
    rhythm, and energy [31]–[33], complexity features like Shannon entropy, Tsallis
    entropy, and permutation entropy [34]–[36], and Hjorth parameters such as activity,
    mobility, and complexity [37]–[39].


    ### Deep Learning Methods


    Deep learning methods with diverse architectures are widely used for EEG decoding.
    EEGNet [40] is a classic lightweight convolutional model, while EEG-Inception
    [41] extends temporal convolution with depthwise spatial blocks for ERP-based
    BCIs. AMWCN [42] integrates wavelet-based multiscale analysis and attention mechanisms
