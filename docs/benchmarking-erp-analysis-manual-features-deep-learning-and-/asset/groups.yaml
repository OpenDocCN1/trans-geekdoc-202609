    # ERP 分析基准测试：手动特征、深度学习与基础模型


    Yihe Wang, Zhiqiao Kang*, Bohan Chen*, Yu Zhang, Xiang Zhang✉


    Yihe Wang 和 Xiang Zhang 隶属于北卡罗来纳大学夏洛特分校计算机科学系，美国北卡罗来纳州夏洛特市 28223。

    Zhiqiao Kang 隶属于中国广东省广州市华南理工大学未来技术学院，511442。

    Bohan Chen 隶属于美国加利福尼亚州戴维斯市加州大学戴维斯分校统计系，95618。

    Yu Zhang 隶属于美国加利福尼亚州帕洛阿尔托斯坦福大学公共心理健康与人口科学系，94305。

    Xiang Zhang 为通讯作者（E-mail: xiang.zhang@charlotte.edu）。

    *共同贡献。本工作是在其在 UNC Charlotte 的研究实习期间完成的。


    ## Abstract


    事件相关电位（ERP）是脑电图（EEG）的一种专门范式，反映了对外界刺激或事件的神经反应，通常与大脑对特定认知任务的处理相关。ERP 在认知分析、神经疾病检测和心理状态评估中发挥着关键作用。近年来，针对自发
    EEG 和其他非时间锁定任务相关 EEG 信号的基于深度学习的方法取得了长足进步。然而，它们在 ERP 数据上的有效性仍未得到充分探索，许多现有的 ERP
    研究仍高度依赖手动提取的特征。本文开展了一项全面的基准研究，系统比较了用于 ERP 分析的传统手动特征（后接线性分类器）、深度学习模型和预训练 EEG 基础模型。我们建立了统一的数据预处理和训练流程，并在
    12 个公开可用数据集上对两种代表性任务——ERP 刺激分类和基于 ERP 的脑疾病检测——评估这些方法。此外，我们在先进的 Transformer 架构中研究了各种
    patch-embedding 策略，以识别更适合 ERP 数据的嵌入设计。本研究为指导未来 ERP 分析的方法选择和定制模型设计提供了一个里程碑式框架。代码可在
    https://github.com/DL4mHealth/ERP-Benchmark 获取。


    ## Index Terms


    - ERP，事件相关电位，EEG，脑机接口，深度学习，基础模型


    ![](img/6b8a0cc86f73ccc8d474525448d82e6d_0_0.png)


    **Fig. 1:** **ERP 与自发 EEG。** ERP 与自发 EEG 本质上不同，需要特定的分析方法。


    ## I. INTRODUCTION


    事件相关电位（ERP）是 EEG 衍生的时间锁定神经活动测量指标，是一种在神经科学、痴呆和认知科学领域具有广泛应用的基础工具[1]–[3]。作为更广 EEG
    信号域中的一个专门类别，ERP 与自发 EEG 活动相比表现出不同的特征[4]。自发 EEG 虽反映持续的内在脑状态但功能特异性有限，而 ERP 则捕捉由特定感觉、音频或认知事件引发的时间锁定神经反应[5]–[7]。通过将神经信号与受控刺激对齐，ERP
    为瞬态认知过程提供了一个直接且可解释的窗口。ERP 的主要优势在于外部事件与内部脑电反应之间的时间同步性，通常比自发 EEG 活动具有更高的信噪比[8]。实践中，ERP
    试验通过对连续 EEG 记录进行事件中心时段分割来提取[3]。短暂的刺激前间隔（通常为 0.2-0.5 秒）用于基线校正以抑制背景噪声，随后是较长的刺激后间隔（通常为
    0.8-1.5 秒），其中包含刺激诱发的神经电位[9]。图 1 说明了 ERP 与自发 EEG 之间的信号比较。


    近年来，深度学习在 EEG 解码方面取得了长足进展，应用范围广泛，包括运动想象控制[10]、情绪识别[11]、睡眠分期分类[11]、癫痫检测[12]和痴呆检测[13]。先进的深度学习技术，例如在自然语言处理、计算机视觉和多模态学习中取得显著成功的
    foundation models（如 ChatGPT [14]、Gemini [15] 和 DINOv2 [16]），也开始被探索用于学习可泛化的 EEG
    表示。最近的 EEG 基础模型，包括 LaBraM [17]、EEGPT [18] 和 CBraMod [19]，在各种 EEG 下游任务上报告了强劲性能。然而，大多数现有深度学习模型设计主要针对自发
    EEG 信号，例如静息态和睡眠 EEG [11]，或非时间锁定的任务诱发 EEG，例如运动想象[20]。相比之下，以 ERP 为代表的时间锁定诱发 EEG
    信号仍显著未被探索。因此，ERP 分析仍主要依赖手动特征提取和传统统计方法，或直接将为自发 EEG 设计的模型应用于 ERP 分析，导致性能欠佳。鉴于 ERP
    的信号特征独特且与自发 EEG 存在根本差异，目前尚不清楚深度学习最新进展在多大程度上可直接应用于 ERP 解码。这一差距需要对 ERP 分析方法进行系统基准测试。


    为此，我们对 ERP 分类方法进行了全面且公平的基准评估。我们在统一的数据预处理和评估框架内实现了多种方法，包括 2 种手动特征提取方法（分别使用 31 和
    91 个手工特征）、10 种 EEG 的最先进深度学习方法以及 3 种先进的 EEG 基础模型。基准涵盖了 **12 个数据集**上的两种代表性且实用的 ERP
    分类任务。第一个侧重于 **ERP 刺激分类**，例如在 oddball 范式中区分标准刺激和目标刺激，以评估模型捕捉基本刺激锁定认知反应的能力。第二个解决
    **ERP-based 脑疾病检测**，例如识别神经或精神疾病，从而评估模型在更复杂且临床相关的场景中的实用性。此外，为指导更有效模型的开发，我们在最先进的
    Transformer 框架内对 EEG 数据的三种常见 patch-embedding 策略进行了比较分析。此嵌入比较旨在识别 ERP 分类最优的嵌入方法，为设计专用于
    **ERP analysis** 的 Transformer 主干提供关键见解。所有任务均在严格的 **subject-independent** 设置下进行，以评估跨受试者学习能力。


    总之，我们的动机是通过这项系统基准研究回答以下问题：


    - **Q1:** 当应用于 ERP 数据时，基于深度学习的 EEG 方法与传统手动特征提取方法相比如何？

    - **Q2:** 具有预训练权重的 EEG 基础模型是否在 ERP 分类任务上优于从头训练的监督 EEG 深度学习模型？

    - **Q3:** 目前最稳健且可泛化的 ERP 分类方法是什么？

    - **Q4:** 哪种 patch embedding 策略最适合设计 ERP 特定的 Transformer 模型？


    为提供简洁的 **takeaway message**，我们为读者方便总结了以下答案：


    - **A1:** 大多数深度学习方法在 ERP 任务上始终优于手动特征提取方法。

    - **A2:** 现有的 EEG 基础模型并未表现出比从头训练的监督深度学习模型更明显的性能优势。

    - **A3:** **EEGConformer** 实现了最佳平均排名，并显示出最具竞争力的整体性能。

    - **A4:** 单变量 patch embedding（见图 5）在 ERP 特定 Transformer 上比多变量和整体变量 patching 策略实现了更好的整体性能。


    本文其余部分组织如下：第 **III** 节介绍了本研究中使用的 ERP 数据集的统计信息以及统一的预处理流程。第 **IV** 节描述了基准中比较的方法，以及为嵌入比较而实现的测试
    Transformer。第 **V** 节提供实现细节并报告实验结果及相应分析。第 **VI** 节讨论现有方法的局限性并概述未来工作的方向。第 **VII**
    节总结全文。


    ## II. RELATED WORK


    ### Manual Feature Extraction


    在 ERP 信号中识别用于分类或脑部解释的潜在生物标志物有着悠久的历史。使用了不同类型的特征，包括统计特征如均值、偏度、峰度和标准差[21]–[23]，时域形状特征如线长、峰峰值幅度和正/负峰值幅度[24]–[26]，频谱分布特征如相位偏移、相位相干性、双谱和双相干性[27]–[30]，频带功率特征如功率谱密度、相对频带功率、EEG
    节律比值和能量[31]–[33]，复杂度特征如香农熵、Tsallis 熵和排列熵[34]–[36]，以及 Hjorth 参数如活动度、迁移率和复杂度[37]–[39]。


    ### Deep Learning Methods


    具有多样架构的深度学习方法被广泛用于 EEG 解码。EEGNet [40] 是一种经典的轻量级卷积模型，而 EEG-Inception [41] 则在 ERP-based
    BCI 中扩展了时域卷积并加入深度可分离空间块。AMWCN [42] 整合了基于小波的多尺度分析和注意力机制以识别判别性频带和时间段。基于 Transformer
    的方法，如 EEG-Transformer [43] 和 EEGConformer [44]，利用自注意力捕捉 EEG 信号中的长程时序依赖和全局上下文信息。Neuro-BERT
    [45] 引入了掩码自编码以实现稳健的 EEG 表示学习，LGGNet [46] 显式建模局部-全局脑功能图，MOCNN [47] 提出多尺度八度卷积用于
    ERP 分类，而 EEGMamba [48] 采用双向 Mamba 模块实现高效的长序列 EEG 建模。


    ### Foundation Models


    在计算机视觉和自然语言处理领域取得显著成功的 foundation models，越来越多地被探索用于 EEG 表示学习。LaBraM [17] 引入了大规模
    EEG 基础模型，采用神经 tokenizer 在预训练期间重建频谱表示，从而实现向下游 EEG 分类任务的有效迁移。EEGPT [18] 提出了一种基于高信噪比
    EEG 表示的掩码自监督学习框架，并通过时空表示对齐增强。FORMED [49] 将通用时间序列基础模型重新用于 EEG 下游任务。NeuroLM [50]
    将 EEG 信号概念化为外语，并采用受语言模型启发的架构学习认知和临床任务的统一表示。LUNA [51] 提出了一种使用交叉注意力机制的拓扑无关 EEG 基础模型，支持在异构通道布放下进行稳健学习。CSBrain
    [52] 探索了具有结构化稀疏注意力的跨尺度时空 tokenization，以建模局部和全局脑区之间的依赖关系。

