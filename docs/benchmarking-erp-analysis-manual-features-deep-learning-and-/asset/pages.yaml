    RLPD, and AOPD), the best method achieves F1 scores of 66.79%, 67.37%, 66.43%,
    74.33%, 73.87%, and 69.26%, respectively. Overall, no single ERP paradigm consistently
    demonstrates a clear advantage for disease detection. Notably, the three smaller
    Parkinsons disease datasets, SCPD, RLPD, and AOPD, achieve relatively higher performance
    than the two larger datasets, PD-SIM and PD-ODD. This trend may be attributed
    to the more balanced data distributions in the smaller datasets, which contain
    exactly equal numbers of Parkinsons disease and healthy control subjects. For
    method comparison, top-tier performance is primarily achieved by deep learning
    models trained from scratch and by models fine-tuned from foundation model checkpoints.
    Two methods based on manually extracted features never achieve top-tier results.
    Besides, unlike ERP stimulus-type classification, ERP-specific features do not
    consistently outperform generic EEG features in disease detection. In several
    datasets, ERP-specific features even perform worse, suggesting that the disease-related
    information in these datasets may be less tightly aligned with canonical ERP components.


    verse tasks and evaluation metrics. Following EEGConformer, ModernTCN, TimesNet,
    CBraMod, and Medformer constitute the top-tier group. Notably, only CBraMod belongs
    to the foundation model category, while the remaining methods are trained from
    scratch. This suggests that existing foundation models can partially transfer
    to ERP classification tasks. One possible explanation is that current EEG foundation
    models are rarely pre-trained on ERP-specific data. Most pre-training resources
    consist of long-sequence spontaneous EEG and do not incorporate ERP-specific preprocessing
    steps, such as baseline correction or event-based trial epoching. As a result,
    the representations learned during pre-training may not be optimally aligned with
    ERP-centric downstream tasks. Manual feature-based methods consistently perform
    the worst overall. Between the two handcrafted feature methods, ERP-specific features
    perform relatively better than generic EEG features. These results highlight the
    limitations of handcrafted statistical and frequency-domain features, which struggle
    to maintain robust performance across diverse ERP paradigms and disease conditions,
    particularly under subject-independent evaluation. This suggests that, beyond
    interpretability or neuroscience-oriented analysis, manual feature extraction
    offers limited advantages in real-world applications where end-to-end performance
    is the primary objective.


