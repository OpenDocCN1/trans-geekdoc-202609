    # B. ERP Stimulus Classification Results


    We first investigate stimulus-type classification in ERP data, with results summarized
    in Table II. All experiments are conducted under a subject-independent evaluation
    setup, aiming to identify stimulus-related ERP patterns that generalize across
    subjects. The Top-1, Top-2, and Top-3 performing methods are highlighted in red,
    blue, and green, respectively. Across the six datasets (CESCA-AOOD, CESCA-VOOD,
    CESCA-FLANKER, mTBI-ODD, NSERP-MSIT, and NSERP-ODD), the best method achieved
    F1 scores of 57.18%, 69.64%, 64.33%, 65.79%, 38.51%, and 68.40%, respectively.
    These results are substantially higher than random performance, indicating that
    meaningful and consistent stimulus-related ERP patterns can be extracted even
    under cross-subject evaluation. Among the three CESCA datasets, the visual oddball
    and flanker paradigms exhibit higher discriminability than


    the auditory oddball paradigm. Since these datasets share the same group of subjects
    and recording conditions, this observation suggests that visual oddball and flanker
    stimuli elicit more salient and distinguishable neural responses than passive
    auditory oddball stimuli. For the comparison of method performance, we observe
    that the top-tier results are predominantly achieved by deep learning models trained
    from scratch. In contrast, existing foundation models for medical time series
    and EEG do not demonstrate clear performance advantages when fine-tuned from their
    released checkpoints. Moreover, manually extracted features rarely achieve top-tier
    performance, whereas ERP features consistently outperform EEG features in this
    task.


