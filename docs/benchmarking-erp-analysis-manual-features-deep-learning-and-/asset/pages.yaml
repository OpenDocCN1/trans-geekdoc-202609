    embeddings, augments them with channel tags, and applies self-attention to capture
    temporal and spatial dependencies. This design supports multi-stage training and
    remains effective under missing-channel or missing-segment scenarios. We load
    their pre-trained weights for fine-tuning.


    2) LaBraM: LaBraM [17] is a foundation model for learning universal EEG representations
    through large-scale unsupervised pre-training. The framework’s core lies in a
    vector-quantization neural spectral prediction method: First, a neural tokenizer
    is trained to encode continuous EEG segments into a compact neural lexicon by
    reconstructing the Fourier spectrum of the raw EEG signals. Subsequently, a neural
    Transformer is pre-trained using masked EEG modeling (randomly masking portions
    of EEG segments and predicting their corresponding neural lexical entries) based
    on this lexicon. Equipped with learnable temporal and spatial embeddings, this
    model adaptively learns from EEG inputs of arbitrary channel counts and durations.
    This method uses more than 2,000 hours of EEG data for pre-training. We load their
    pre-trained weights for fine-tuning.


    3) CBraMod: CBraMod [19] is a foundation model for EEG that adopts a criss-cross
    Transformer as its backbone. By employing parallel spatial and temporal attention
    mechanisms, it separately models dependencies between channels at the same time
    point and between time segments within the same channel, thereby better aligning
    with the inherent structure of EEG signals. Additionally, the model uses Asymmetric
    Conditional Position Embeddings (ACPE) to dynamically generate position embeddings,
    enabling it to adapt flexibly to EEG data with varying channel configurations
    and temporal durations. This method uses more than 9,000 hours of EEG data for
    pre-training. We load their pre-trained weights for fine-tuning.


    ![](img/6b8a0cc86f73ccc8d474525448d82e6d_5_0.png)


    Fig. 3: Transformer Embedding Comparison. Three commonly used EEG Transformer
    patch embedding methods.'
