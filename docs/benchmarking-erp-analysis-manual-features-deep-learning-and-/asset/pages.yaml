    We compare three commonly used token embedding methods in existing EEG Transformer
    models to examine their suitability for ERP data classification. All other components,
    including the self-attention modules, feedforward networks, and layer normalization
    layers, are kept identical across methods. To ensure comparable model capacities,
    the patch length is set to 25 for the multi-variate and 100 for the uni-variate
