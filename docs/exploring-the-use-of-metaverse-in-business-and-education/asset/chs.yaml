  \n# 第 6 章\n\n* Soni Rathi\n    [![Orcid](https://orcid.org/0000-0002-2997-8622)](https://orcid.org/0000-0002-2997-8622)\n\
  \    印度恰加大学\n* Praveen Kumar\n    恰加大学\n\n### 摘要\n\n近年来，“人力资源分析”和元宇宙在人力资源中的应用术语日益突出，并越来越多地被组织采用。元宇宙和分析的组织取得了巨大成功。本章旨在实现某些目标，即：探讨人力资源分析的含义、重要性及优势，元宇宙的含义以及人力资源分析的作用。本章将通过包含理论分析来实现这些目标。\n\
  \n### 引言\n\n人力资源（HR）的动态角色近期已被人力资源管理（HRM）接管。人力资源作为组织最宝贵的资产，随着时间的推移往往具有竞争优势（Nishii,\
  \ Lepak and Schneider, 2008）。人力资源分析领域已存在一段时间，但其受欢迎程度最近才增加。劳动力、人才、人力资本和人员分析是人力资源分析的其他术语（Tursunbayeva,\
  \ Lauro and Pagliari, 2018），学术界和商业界经常通用。分析与人力资源管理之间的联系是显而易见的，尽管人力资源管理加入这一趋势的时间较晚（Sharma\
  \ and Sharma, 2017）。\n\n人力资源分析是人力资源指标与通用业务分析的结果。人力资源进入元宇宙，它在辅助虚拟环境融入人力资源实践方面发挥着至关重要的作用。这包括监督招聘和远程入职流程、开发虚拟培训和发展计划以及培养虚拟社区感和员工参与度。人力资源分析的目的是通过应用方法和集成过程改进人的决策，从而提升个人或组织绩效（Bassi,\
  \ 2011）。\n\n本文概述了人力资源分析及其意义、类型、各种来源的最新定义，并努力将其有效地整合在一起。研究分为四个部分。第一部分是引言；第二部分描述人力资源分析；此外，第三部分专门讨论人力资源分析在员工参与度和员工离职意向中的作用；第四部分包含了什么是元宇宙以及人力资源在元宇宙中的作用。最后在章末还提到了结论、局限性和未来方向。\n\
  \n\n\n\n\n# 人力资源分析概述\n\n“人力资源分析是一种主动且系统的过程，通过伦理化的收集、分析、沟通和使用基于证据的人力资源研究和分析洞察，帮助组织实现其战略目标”（Falletta\
  \ and Combs 2021）。尽管人们对人员/人才分析表现出极大兴趣（Boudreau and Casio, 2017; Falletta, 2014;\
  \ Huselid, 2018），但在人才分析的含义和能力上存在偏差。这在本地和全球已成为一个重大问题。可以通过识别员工的喜好来开发分析模型，提高员工留存率。它还支持主管决定是否要与其他组织的同等录取报价进行竞争、安排定制的激励计划，或确定公布晋升或加薪的最佳时。\n\
  \n随着数据可用性的增加，人力资源分析（HRA）的使用日益增长。由于对人员管理及其收入贡献方式意识的提高，此类数据将帮助满足可能任何需求（Bassi, 2011）。为了更有效地利用人力资本，HRA\
  \ 将有助于预测员工行为（Schneider, 2006）。人力资源分析有助于人力资源数据的收集、解释和评估。它还提供最新、可靠的数据以及增强的未来选择。此外，它有助于为组织障碍提供解决方案并对齐人力资源战略。人力资源分析在战术和功能等多个层面运作，因为它提供了一种协调团队目标与公司目标的方法。\n\
  \n## 定义与背景\n\n在本章继续之后，HRA 经常被称为劳动力分析（workforce analytics）和人员分析（people analytics）等术语，因为它们与人力资源/人才分析是通用的（Heuvel\
  \ and Bondarouk, 2017）。分析通常是指“使用分析、数据和系统性推理来做出决策”（Davenport, Harris and Morison,\
  \ 2010）。\n\n根据 Jones (2014) 的观点，人力资源经理发现人力资源分析是一种工具，为他们提供了决策所需的数据，可能帮助他们应对高员工流失率、提高新员工的熟练度并预测组织的效率和成就。Ranjan\
  \ and Basak (2013) 提到，“HR 的范围和方法应根据背景因素决定，例如目标、内部准备情况、投资意愿和实现目标的预期时间”。\n\n人力资源分析有几个目标（Ben-Gal,\
  \ 2018），即：\n- 以有效的方式收集和维护数据，以预测不同工作场所人员需求和供应的短期和长期模式。\n- 帮助全球公司/企业就最佳达成做出裁决。\n-\
  \ 生成并保持人力资本。\n- 在有效管理劳动力方面通过快速且显著的方式实现组织目标。\n- 对组织战略的成功实施产生积极影响。\n\n## 影响与全球趋势\n\
  \n根据麻理工学院和 IBM 的调查，高 HRA 水平组织的销售增长高 8%，利润率高 24%，每名人力资源的平均销售额高 58%。接近 22% 的受访者表示，使用数据缩短招聘周转时间有助于其组织留住人才，超过\
  \ 55% 的人表示有效的人力资源数据分析有助于留住优秀人才。\n\n以下是人力资源分析的一些热门全球趋势：\n\n- 预计到 2027 年，全球人力资源分析市场将以每年\
  \ 14.2% 的速度增长，达到 62.9 亿美元。\n- 由于新冠肺炎，全球劳动力市场发生了剧烈波动，55% 的美国人计划在明年内寻找新工作。\n- 随着机器学习\
  \ (ML) 和人工智能 (AI) 在全球数百万组织的人力资源分析中增加，数据分析专业人士和人力资源分析供应商预计将获得更多机会。\n- 根据 LinkedIn\
  \ 的《2020 年全球人才趋势报告》，在疫情之前，73% 的人力资源专业人士表示，人员分析将是公司未来五年的主要任务。\n\n### 图 1. 人力资源\n\
