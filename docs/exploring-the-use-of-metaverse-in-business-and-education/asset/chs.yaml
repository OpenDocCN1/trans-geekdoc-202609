  \ 10426.\n\n---\n\n# 第 14 章\n\n## 参与者态度与经验作用的实证分析\n\n* **Sridevi Nair**\n  印度 CHRIST\
  \ 大学商学院与管理学院\n* **Tanvi Tare**\n  印度 Incture Technologies\n\n### 摘要\n\n\n\n\n元宇宙（Metaverse）变得日益重要，企业正寻求将其应用于从入职培训到客户体验的各个流程。本研究旨在评估不同组织中，学习者特征对参与基于元宇宙的培训计划动机的影响。根据文献和理论，研究确定了两个主要特征：对元宇宙的态度以及对该技术的实际经验。研究数据通过结构化问卷收集，并从来自印度不同组织的员工中收集了\
  \ 103 份有效回复。数据分析阶段通过 `SPSS` 工具使用统计技术对数据进行了分析和解释。研究发现，这两项学习者特征之间存在强烈的正相关关系，且对元宇宙的态度对学习者动机的影响比使用经验更强。研究结果表明，组织应该更关注在工作场所中引入元宇宙的方式，并且在制定实施基于元宇宙培训计划的策略时，需要留出员工对任何变化（更多是技术性变革）的考虑。\n\
  \n### 引言\n\n网络空间的指数级增长标志着互联网的广泛覆盖，这使得在线世界成为现代生活的重要组成部分。人类对数字界面的依赖日益增加，使得与数字世界的互动实际上变得不可避免。近期，见证了数字技术的飞速发展，推动了其融入各个领域和机构。从人工智能、机器学习到区块链、物联网（IoT）和云计算，这些技术已成为许多组织运营中不可或缺的组成部分。这些技术的有望提高效率、简化流程并提供创新解决方案。随着社会的进步，人类与数字领域之间的共生关系不断演变，塑造着我们的日常生活和职业生活。作为人类，我们的交流在不断演变，因此虚拟通信也以元宇宙的形式呈现出新的形态（Ning\
  \ et al., 2023）。\n\n由于 Facebook 改名为 `Meta` 并专注于开发元宇宙，元宇宙的普及程度近期有所提高（Krauss et al.,\
  \ 2022）。这家科技行业巨头的这一战略性举措显著提升了人们对该概念的关注。尽管仍处于初期，但虚拟现实（`VR`）技术的快速进步正在提高人们对元宇宙的兴趣和接受度。这些创新正日益模糊物理世界与数字世界之间的边界，提供沉浸式和交互式的体验。`VR`\
  \ 头显的完善、触觉反馈系统、空间计算以及增强现实（`AR`）的整合是元宇宙演化的关键贡献者。这些进步为一个多维数字空间奠定了基础，在这个空间里，个人可以互动、社交、工作、游戏和创造。\n\
  \nCOVID-19 疫情也促进了在工作场所使用元宇宙的实现，将其重心从娱乐转向专业用途（Dwivedi et al., 2022）。元宇宙的核心理念是创建一个模拟物理情境社交互动的数字空间。定期的视频会议无法复制面对面的会议体验，这会影响员工之间的协作。元宇宙具有通过复制物理工作环境和鼓励同谊来增强远程办公的潜力，从而提高创造力和生产力（Karlsson\
  \ & Shamoun, 2022）。\n\n元宇宙在工作空间框架内的演变反映了我们感知和参与工作环境方式的动态变化。随着工作空间向在线领域转型，公司在监控和管理员工方面经历了巨大的变革。随着工作空间在元宇宙中不断演变，迫切需要一种优先考虑员工福祉的平衡方法（Pinnington\
  \ & Ayoko, 2021）。这种理解促使关注重点转向 `Davis (1989)` 模型所倡导的技术层面。事实上，学习者的特征对于他们适应新环境的能力至关重要。元宇宙技术具有创建沉浸式、灵活和交互式学习环境的潜力，这些环境可以增强动机、投入度和积极参与（Collins,\
  \ 2008）。对新体验开放、愿意实验和协作以及精通技术的学习者可能会在这样的环境中茁壮成长。然而，同样重要的是，用于学习的元宇宙技术的设计应考虑到无障碍和包容性，以确保所有学习者都有平等的获取和机会（Kye\
  \ et al., 2021）。\n\n研究显示了元宇宙如何接管工作场所，以及员工对参与此类技术的持怀疑态度（Karlsson & Shamoun, 2022）。如果员工对基于元宇宙的培训模式缺乏认可，那么实施该方案的整个计划将是徒劳的。因此，本研究探讨了影响员工动机的两个个人因素。\n\
  \n# 什么是元宇宙：它是如何出现的\n\n元宇宙（Metaverse）由两个单词组合：`Meta` 意为“结合”，`verse` 意为“宇宙”，是一种融合了现实世界与数字世界的应用程序/软件，创造出我们所处世界的镜像（Chua\
  \ & Yu, 2023）。它通过这种方法将虚拟世界与现实世界相结合，并与社会、经济和身份系统整合，以便其中生活、创作内容并最大限度利用这项技术（Ning et\
  \ al., 2021）。\n\n\n\n\n当 Facebook 首席执行官马克·扎克伯格在 2021 年 10 月宣布将 Facebook 更名为“Meta”时，这一切都成为了关注的焦点。这一公告在商业界产生了巨大影响，因为它意味着像\
  \ Facebook 这样规模巨头的公司业务模式发生了重大变化。扎克伯格将其描述为一个三维空间，提供了虚拟与增强现实的重叠（Kraus et al., 2021）。公司的更名体现了投入大量资金构建和培养元宇宙——一个促进沉浸式交互、社交连接和多维度体验的数字环境。这标志着\
  \ Facebook 致力于将虚拟现实 (VR) 和增强现实 (AR) 等技术整合到一个统一的平台。扎克伯格将元宇宙描绘为一个空间性的交互领域，强调了公司超越传统社交网络范式的愿景，重塑了个人在全球范围内与技术互动的方式。\n\
  \n“元宇宙”一词最早由尼尔·斯蒂芬森（Neal Stephenson）在 1992 年的一部小说中使用，描述人类进入平行宇宙。元宇宙将允许用户访问物理世界中可能无法实现的空间和环境，成为该地方的数字公民。它不断演变，并赋予了如“第二人生”、“3D\
  \ 虚拟世界”和“生活记录”等各种名称（Wang et al., 2022）。总之，元宇宙是一个时空空间，它是物理、数字和人类世界的融合，作为一个汇点，使个人能够跨越边界参与到物理世界中无法实现的活动。这种多维度的环境培养了存在感和连接性，允许用户进行互动、创作、社交，并增强了现实体验。元宇宙的概念定义了一个无边界数字边疆，物理、数字和人类世界在这里和谐共存，重新定义了我们感知和穿越沉浸式数字景观的方式（Qadir\
  \ & Fatah, 2023）。\n\n## 元宇宙与工作空间的整合\n\n自 70 年代后期以来，由于数字化工作方式的出现，公司和行业对远程办公越来越感兴趣（Vilhelmson\
  \ & Thulin, 2016）。这种在办公室之外进行、远离同事并依赖现代技术进行通信的工作类型被称为远程办公，有时也称为居家办公或灵活办公（Martino\
  \ & Wirth, 1990）。随着多年信息通信技术的进步，跨越物理边界进行通信的远程办公已成为可能。虚拟现实的想法自 60 年代和 70 年代以来一直被研究（Dionisio\
  \ et al., 2013）。然而，随着信息通信技术的进步，虚拟现实因其广泛的应用范围而获得了越来越多的关注。\n\n元宇宙的概念近年来引起了极大关注。元宇宙是一种虚拟现实理念，用户在其中创建存在于三维虚拟世界的虚拟（Dionisio\
  \ et al., 2013）。这一概念被认为是一个持续演变的过程，随着远程办公趋势的增长，像 Facebook 和微软这样的公司看到了其应用在增强员工远程办公体验方面的潜力（Kim,\
  \ 2021）。\n\n元宇宙受欢迎程度的提高和创造归因于数字时代无处不在的影响下人们需求和欲望的根本性转变。技术的快速进步改变了人们对数字平台的期望和互动。应对这些不断变化的需求，元宇宙提供了一个超越传统边界的多维数字环境。在一个万物互联、通信即时且现实与虚拟世界共存的时代，人们渴望更丰富、互动和沉浸式的体验。通过提供一个动态环境，用户可以以反映现代生活复杂性的方式参与、创作、协作和互动，元宇宙满足了这些期望。它满足了对增强连接性、个性化体验以及无缝穿越不同数字景观的需求。元宇宙的兴起标志着人们感知和参与技术方式的范式转移，驱动力是满足导航数字景观的个人不断变化的需求和欲望。由于\
  \ COVID-19 疫情，人们对灵活性、自由以及在保持远程办公社交属性的同时轻松连接和协作的能力产生了更大的需求（Fernandez, 2022）。未能识别这一趋势的公司面临落后和失去信誉的风险。因此，跟上元宇宙的发展至关重要，以确保企业为未来在工作场所实施做好准备（Karlsson\
  \ & Shamoun, 2021）。对于公司来说，元宇宙提供了新收入流、土地所有权、办公室定制和扩展性的可能性，以满足其特定需求。此外，虚拟货币和 NFT 引入了交易和货币化虚拟世界的新方式，为企业开启了新机会（Alvim,\
  \ 2022）。\n\n教育元宇宙潜力改变我们接触教育和专业培训的方式。通过提供一个学习者可以在其中参与实践体验和模拟的虚拟空间，它可以提供现实世界中由于资源、成本或风险限制而无法提供的机会。这将带来更高效、成本效益更高的培训开发计划，并为那些进入教育环境面临障碍的人提供教育机会。此外，教育元宇宙可以促进全球学习者和教育者之间的协作和社区建设，进一步增强学习体验（Mitra,\
  \ 2023）。\n\n元宇宙可以有效利用其强大的模拟能力来教学和培训组织的员工。然而，考虑用户对这些技术的态度至关重要，因为它们可能会放大居家办公的优点，也可能突出负面影响（Yarberry\
  \ & Sims, 2021）。研究表明员工幸福感与投入之间存在强相关性，这最终会导致组织的成功。因此，考虑到员工对组织变革的态度对于预测此类变化的成功非常关键（Jeon,\
  \ 2021）。\n\n\n\n\n\n本研究旨在确定学习者特征与参与基于元宇宙的培训计划动机之间是否存在关系。本研究设计的模型包含两个独立变量和一个因变量。对技术界面的使用经验和对元宇宙的态度是独立变量，而\
  \ `Learner Motivation`（学习者动机）是需要分析的因变量。该模型的设计考虑了组织中的员工，以及他们根据所取的两个独立变量参与基于元宇宙培训计划的意愿。\n\
  \n对技术界面的使用经验和对技术的态度借鉴自 `TETEM` 模型。`TAM` 框架（Davis, 1989）经过改进，通过技术增强培训效果模型（即 `TETEM`）包含了学习与发展。`TETEM`\
  \ 最初设计用于评估虚拟环境中的培训效果，其灵感源自 [Baldwin and Ford (1988)] 的培训效果模型。他们认为培训结果的主要预测因素包括受训者特征、工作氛围和培训设计，这些因素会影响培训转化。随着技术进步使工作场所发生巨大变化，评估这些因素对受众接受程度的影响变得至关重要。\n\
  \n在这一不断演变的格局中，[Landers and Callan (2012)] 识别了通过技术工具增强学习体验的三个关键因素。首先，在组织层面，文化在决定技术增强学习模块的有效性方面起着关键作用。对技术持怀疑或不反应态度的组织可能会阻此类此类的接受。这可以通过组织氛围和主管支持水平来评估。其次，更重要的是在个人层面，学习者对技术的态度和其先的技术经验是影响培训效果的关键因素。这些个人因素起着调节变量的作用，塑造了培训设计与学习者参与技术增强学习体验动机之间的关系。\n\
  \n将此模型应用到游戏化领域，Landers and Armstrong (2015) 引入了一个平行的框架。根据他们的调整，两组特征预测了学习者参与游戏化学习体验的动机。第一组涵盖组织因素，如组织氛围和主管支持。第二组侧重于个人特征，特别是学习者对视频游戏的经验以及对基于游戏的学习的态度。这些个人属性预计会调节培训设计与培训前效价（pre-training\
  \ valence）之间的关系，从而影响对培训的反应及后的学习结果。通过对学生的研究，获得了将 `TETEM` 应用于游戏化学习情境的实证证据。\n\n`TETEM`\
  \ 模型的核心在于，培训计划的有效性（无论是在虚拟环境还是游戏化环境中）都与组织和个人因素紧密相连。在个人层面，学习者对技术的态度和对技术工具的以往经验塑造了他们参与学习体验的动机。在游戏化的背景下，引入视频游戏经验和对基于游戏的学习态度等因素增加了培训设计与学习者动机之间复杂性。\n\
  \n`TETEM` 作为一个通用框架超越了传统的培训环境，适应了现代职场不断变化的动态。它强调了个人因素在塑造培训干预有效性方面的意义，无论是在虚拟环境还是游戏化场景。随着组织继续应对技术增强学习的演变格局，`TETEM`\
  \ 模型为优化培训计划以实现最大影响和成功提供了宝贵的见解。\n\n通过 `TETEM`，[Landers and Callan (2012)] 强调了技术采用的一个关键组成：如果消费者对技术感到不适或缺乏经验，使用新技术可能无法产生预期结果。这一观点强调了用户能力和熟悉程度在评估技术使用效果方面有多么重要人们对新技术工具或平台的舒适程度和以往经验极大影响了他们能够良好使用和导航工具的能力。在当前研究中，这两个变量被认为是学习者动机水平的预测因素。研究的概念框架如图\
  \ 1 所示。\n\n| 图 1. 概念框架 |\n| --- |\n| ![Figure979-8-3693-5868-9.ch014.f01](img/ch014.f01.png)\
  \ |\n| --- |\n\n## 方法论\n\n当前研究的目标是研究技术使用经验和对元宇宙态度对学习者动机的影响。为此，研究人员采用了定量问卷调查法。该方法借鉴自\
  \ [Landers and Callan (2017)] 的研究。在他们的研究中，研究人员在游戏化背景下评估了技术增强培训效果模型 (`TETEM`)）。该方法被发现适用于本研究。\n\
  \n## 参与者\n\n本研究的受访者从印度组织的员工中选出。大多数（53%）访访者为男性。超过 70% 的受访者属于 18-25 岁组。在学历方面，大多数受访者（23%）自称是研究生。数据清洗后，发现有\
  \ 103 份份完整回复用于最终分析。\n\n## 数据收集\n\n本研究的数据使用结构化问卷收集。问卷的设计考虑了研究的概念框架。问卷还包含一段展示给受访者的视频，随后要求他们回答随后的问题。插入问卷中的视频展示了元宇宙如何接管工作场所，以及由于元宇宙的使用，培训计划和工作生活如何获得沉浸式体验。问卷的第一部分收集了受访者的人口学细节，其余三个部分包含基于研究三个变量\
  \ 15 个问题，受访者需要在五点 Likert 量表上标记回答。\n\n关于技术经验和对元宇宙态度的陈述改编自 [Bourgonjon et al., (2009)]。样本陈述包括“我对使用元宇宙充满热情”和“我喜欢使用技术”。学习者动机使用\
  \ [Zaniboni et al., (2011)] 设计的工具进行测量。`T-VIES-it` 量表包含了如下陈述：“参加培训活动，我想提高工作中技术/实践知识”、“如果我参与培训活动，我有信心提高我的主动性”以及“得益于培训活动获得新技能对我的表现有积极影响”。\n\
  \n# 结果\n\n\n\n\n\n在对假设进行测试之前，研究人员检查了数据分布情况，以确定是否适用于参数检验。变量的描述性统计已在表 1 中提供。\n\n###\
