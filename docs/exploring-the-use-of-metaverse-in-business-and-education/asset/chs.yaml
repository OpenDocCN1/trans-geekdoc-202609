  \ |\n| E || 0.684 || 0.069 || 0.491 || 0.000 |\n| 2 || (常数) || 1.091 || 0.165 ||\
  \ 6.623 || 0.000 |\n| A || 0.726 || 0.049 || 14.734 || 0.000 |\n\n回归分析表明，技术经验的特征和对元宇宙的态度对学习者参与元宇宙培训计划的动机具有显著影响。发现技术经验可以预测学习者动机水平\
  \ 50% 的变异（`p<0.05`）。发现对元宇宙的态度可以预测动机水平接近 68% 的变异（`p<0.05`）。两个变量对学习者动机水平均显示出显著且强烈的影响。\n\
  \n# 讨论\n\n本研究分析了从职场专业人士收集的数据。分析的第一步涉及评估数据分布。数据集的偏度和峰度值被发现处于 +3 到 -3 之间，允许使用参数检验。研究人员随后继续检查了相关性。由于数据可以被视为正态分布，因此分析了皮尔逊相关性，并发现其显著且强烈。发现动机与技术经验之间的相关性为\
  \ 0.712，动机与技术态度之间的相关性为 0.826。同样，正如回归分析所示，技术经验和技术态度均被发现是预测动机水平的显著因素。发现态度可以预测动机水平中约\
  \ 68% 的变异，而经验发现可以预测动机水平中约 50% 的变异。这些结果将在本节中进一步讨论。\n\n元宇宙的兴起凸显了它在不断演变的技术格局中的重要性。然而，与任何变革性的技术转变一样，其成功的确定性仍然不确定的。自\
  \ Fred Davis 在 1985 年引入技术接受模型（TAM）以来，人们一直在努力理解和预测新技术的采用。TAM 认为，用户使用技术的意图以及其实际使用主要由两个因素决定：有用性和易用性。在元宇宙背景下，TAM\
  \ 的适用性表明，其广泛接受和融入日常生活取决于实用性以及用户操作的难易程度。因此，元宇宙的成功采用可能取决于这些关键方面（Davis, 1985）。\n\n\
  技术增强培训模型（TETEM）将 TAM 框架扩展到学习和发展。TETEM 专门关注学习目的的技术接受。Landers 和 Callan (2012)强调了技术采用的一个重要方面，如果用户缺乏舒适感或经验，新技术的利用可能无法产生预期结果。这一假设强调了用户熟悉度和熟练度的重要性。对技术的缺乏熟悉或不安会导致熟练度降低，阻碍用户发挥其全部潜力。这可能导致效率降低、操作错误或无法探索和利用所有功能。因此，这些因素可能会阻止用户从技术中获得最大收益或实现最佳结果。因此，促进用户舒适度、提供充足的培训并确保用户友好的界面对于确保新技术的成功整合和利用至关重要。\n\
  \nLanders 和 Armstrong (2015) 将 TETEM 应用于游戏化学习体验，并发现对游戏化学习的态度和对视频游戏的经验会调节游戏化对参与者培训前价值的影响。本研究借鉴了他们研究中的学习者特征变量，评估了对元宇宙的态度和技术经验对参与元宇宙培训计划动机的影响。\n\
  \n\n\n\n对于这种关系的一种解释可以在 Sweller (1988) 的认知负荷理论中找到。当学习者遇到一个使用不熟悉技术设计的学习模块时，由于他们努力操作并理解新工具或平台，其认知负荷会随之增加。这种源于理解和操作不熟悉技术而产生的高强度认知需求，可能会抑制学习者积极参与计划的动力。原本应用于吸收学习内容的认知资源被转移到应对新技术的机械原理上，从而削弱了学习者的热情和充分参与的意愿。相反，当学习者对模块中使用的媒介或技术具有先验经验时，他们的认知负荷会显著降低。熟悉感使学习者能够更有效地将认知资源投入到学习目标中，而不是花费精力在操作技术本身上。因此，拥有媒介经验会带来更顺畅的学习体验，让学习者能够更多地关注教育内容，更积极地参与，并获得更好的学习成果。因此，在学习模块中整合熟悉的技术，或为不熟悉的技术提供充分的培训和支持，对于营造有利于优化参与和提高学习效果的环境变得至关重要。\n\
  \n本研究提出的第二个关系是，对元宇宙的态度将对学习者的动机水平产生显著影响。这受到了建构主义学习理论的支持，该理论认为只有当学习者相信培训是有意义的，学习才能发生(Kraiger,\
  \ 2002)）。换句话说，学习者的态度会影响参与培训的动力，进而影响计划的学习成果。\n\n虽然发现经验和态度都有显著影响，但发现态度的影响更强。Karlsson\
  \ and Shamoun (2022)的一项研究发现，对虚拟环境有先验经验的员工对元宇宙表现出更积极的态度。这种熟悉感与职场中对元宇宙技术更高水平的接受度和热情有关。\n\
  \n然而，对元宇宙的态度并非全是正面的。Woldemichael (2019)的研究强调，员工对数据隐私、在线骚扰和敏感信息的潜在泄露表示担忧。另一项调查还发现，元宇宙技术的使用了对员工隐私和数据收集的担忧，大量员工担心雇主可能会监控他们的位置和屏幕活动。有趣的是，调查发现，与\
  \ `Meta`（原 Facebook）相比，员工更可能信任 `Microsoft` 和 `Google` 来引领虚拟职场技术的发展（Barr, 2022)。\n\
  \n在其他几项调查中，约有 53%的人不知道什么是元宇宙，并且对其一无所知，因此引发了元宇宙在职场中实施成功的问题(Bale et al., 2022)。员工的态度和感知也反映在调查中。调查结果显示，38.2%\
  \ 的人认为元宇宙可能会损害人际互动，65.3% 的人认为元宇宙将减少体力活动。考虑到人们目前对元宇宙的看法以及该研究的发现，很明显公司在启动任何基于元宇宙的计划之前，必须先努力改变员工的态度。应对此的一种方法是概述一种微妙的策略，即向基于元宇宙的平台切换是有计划的、渐进的部署，而不是突然的改变。公司不是将整个培训计划转移到元宇宙，而是逐步将其与传统培训技术相结合。分阶段过渡还将让员工有机会按照符合其舒适度和学习偏好的节奏来熟悉元宇宙。通过提供多种培训选择，组织承认了员工的多样需求，创造了一个适应不同学习风格的包容环境。可以鼓励员工探索使用元宇宙作为工具的微妙之处，培养他们在数字技能发展中的自主感和赋感。\n\
  \n基于对适应技术需要时间和支持的理解，组织可以利用这种渐进式的整合，确保元宇宙的用户体验始终保持在高水平。这涉及投资用户友好的设计、直观的界面以及全面的培训计划，使员工具备无缝导航元宇宙所需的技能。目标不仅是引入一个新的技术维度，更是提升员工的整体体验，培养他们利用元宇宙作为工具的自信心和胜任能力。\n\
  \n\n\n通过这种方式，当元宇宙逐步且审慎地引入时，它具有作为一种扩展维度来彻底改变工作场所的潜力。组织必须认识，改变员工对元宇宙的态度是成功实施的根本前提。分阶段的过渡策略提供了多种培训选择，并确保了良好的用户体验。它还为元宇宙无缝整合到专业领域铺平了道路。通过将元宇宙视为一个扩展的工作场所维度，组织可以开启协作、创新和自适应学习的新纪元，将自己置于演变工作范式的前沿。\n\
  \n## 局限性\n\n本研究最大的局限性之一是它依赖于调查数据。问调查依赖于自我报告数据，这可能会受到各种偏差的影响，例如社会期望性偏差、回忆偏差和响应偏差。受访者提供的答案可能是他们认为预期的，而不是反映他们真实的感受或经历。为了鼓励真实回答，研究并未要求受访者提供姓名或电子邮件等个人数据。然而，如果有观察学习水平的实验性研究支持，本研究的发现将更具效性。\n\
  \n此外，调查信息记录的是特定时间点的动机、经历和态度。本研究考虑时间动态的能力可能受到组织背景、技术使用或个人情况随时间变化的限制，而这些变化未能得到很好的反映。\n\
  \n最后，尽管调查结果提供了定量见解，但它们可能错过了参与者经历的一些复杂性和深度。将定性技术与调查数据相结合，可以为所的研究主题提供更全面的视角。开放式调查问题、焦点小组和访谈都是定性方法的示例，它们使参与者能够用自己的话表达经历，并提供定量测量可能遗漏的细微观点。通过对定性和定量数据进行三角互证，可以提高发现的效性和深度，并对组织环境中学习者动机水平、对技术的态度以及技术经验之间的关系获得更全面的理解。这种混合方法研究使得对所研究现象进行更深入的分析以及对调查数据进行更复杂的解释成为可能。\n\
  \n## 未来研究空间\n\n目前的手稿仅是一项初步研究，试图识别一些可能预测将元宇宙纳入组织运作成功的个人因素。这适用于组织的任何职能或部门。未来的研究可以评估不同人口统计分组（年龄和性别）对技术态度和技术经验的个人特征。这将有助于深入了解这些变量是如何发挥作用的以及这种关系在不同类别之间的差异。\n\
  \n另一个可以探索的维度是扩展模型，以考虑特定于不同背景的其他变量。例如，在研究学习领域元宇宙的使用时，还可以评估培训背景、感知的组织支持、领导态度等。\n\n\
  另一个可以探索的方面是调整模型，以了解它是否可以用于预测健康和福祉等其他背景下的有效性。其中一项应用已在 `Garcia et al., (2022)]` 中进行了探索。在他们的研究中，他们探索了为健身爱好者创建一个虚拟虚拟营养师的可能性。\n\
  \n## 结论\n\n现代工作场所不断变化的本质无疑正推动着基于元宇宙的培训计划和工作环境的趋势。组织越来越多地意识到，他们需要创意的方法来适应不断演变的工作性质。\n\
