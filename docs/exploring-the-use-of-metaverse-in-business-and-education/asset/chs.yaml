- "# 商业与教育中的元宇宙应用探索\n\n\n\n*   Jeetesh Kumar\n    马来西亚泰勒大学\n*   Manpreet Arora\n \
  \   印度喜米恰尔·普拉什邦中央大学\n*   Gül Erkol Bayram\n    土耳其西诺普大学\n\n\n![tpg_2328-1405.png](img/tpg_2328-1405.png)![Information_Science_Reference.png](img/Information_Science_Reference.png)\n\
  \n\n\n\n\n\n\nJeetesh Kumar, Manpreet Arora, Gül Erkol Bayram\n\n\n\n\n\n\n*   Jeetesh\
  \ Kumar\n    马来西亚泰勒大学\n*   Manpreet Arora\n    印度喜米恰尔·普拉什邦中央大学\n*   Gül Erkol Bayram\n\
  \    土耳其西诺普大学\n\n\n在不断演进的技术与人类互动版图中，元宇宙概念已成为探索和创新的焦点。作为这本综合参考书 `Exploring the Use\
  \ of Metaverse in Business and Education` 的编辑，我们非常荣幸地呈献这一合集，深入探讨了元宇宙的多维度领域，考察了其在各个领域的意义、应用和影响。\n\
  \n在当今互联通的世界中，元宇宙处于虚拟现实、增强现实、人工智能和区块链技术的交汇点。它提供了沉浸式体验，并连接了超越传统边界的虚拟领域，塑造了我们沟通、娱乐、工作和学习的方式。COVID-19\
  \ 疫情加速了数字化解决方案的，进一步凸显了元宇宙在促进远程工作、教育和社会互动方面的相关性。\n\n本书证明了学术研究在理解和利用元宇宙潜力方面日益增长重要性。从探索基础技术到研究现实应用，这些页码中的贡献为元宇宙的发展提供了宝贵的见解。\n\
  \n\n作者 Esra Anis 和 Ülker Çolakoglu 均来自土耳其旅游学院，邀请读者开启进入元宇宙迷人世界的旅程。本章将元宇宙定义为融合物理与数字世界的\
  \ 3D 宇宙空间，追溯了其在娱乐、商业和旅游等领域的演变。\n\n\nKritika 女士代表国际工程师协会与 Wiys 印度分，带领读者经历了一场元宇宙快速演变的历程，并对其未来趋势提供了见解。\n\
  \n\nManjit Kour 和 Kavita Rani 均来自印度钱地加尔大学，深入探讨了元宇宙的道德复杂性。这项研究探索了围绕虚拟货币和资产加剧的隐私、数据安全和社会不平等的担忧，主张建立伦理框架以确保公平和用户福利。\n\
  \n\n来自阿拉伯联酋阿布比大学的 Muhammad Tariq 探索了元宇宙对贸易和商业的转型性影响。通过现实案例研究，读者可以了解元宇宙如何彻底新品牌、营销和电子商务，重塑传统的收入生成策略。\n\
  \n\nVaishali Dhiman 和 Manpreet Arora 均来自印度喜米恰尔·普拉什邦中央大学，揭示了元宇宙研究和创业中不断变化的趋势。通过文献计量分析，读者探索了主题趋势和合作，有助于对元宇宙对创业的影响产生更深入理解。\n\
  \n\n来自印度钱地加尔大学的 Soni Rathi 考察了 `HR` 和元宇宙在增强员工参与度和降低离职率方面的意义。通过理论分析，读者获得了这些技术如何重塑劳动力表现和人才管理。\n\
  \n\n来自印度不同机构的 ASIK JAMADER、Santanu Dasgupta 和 Govind Baibhaw 探索了可持续性概念在韧性品牌管理中的应用。他们主张将可持续营销实践与心理资本理论相结合，培养乐观和性格以提升业务表现。\n\
  \n\n\n\n\nSaumendra Das、Nayan Deep Kanwal、Udaya Patro、Tapaswini Panda 和 N Saibabu\
  \ 来自印度和马来西亚的不同机构，深入探讨了工业 5.0 的挑战与机遇。他们提出了一个 AI 伦理框架，以确保工业 5.0 中 AI 技术的负责任开发和管理，旨在促进日常生活中伦理\
  \ AI 应用。\n\n\n来自印度喜马马尔·普拉德什邦中央大学的 Sunaina Rathore 和 Manpreet Arora 探索了元宇宙中的可持续性报告。通过对印度公司元宇宙技术披露的分析，读者可以了解这些技术如何促进多个行业的可持续性，并影响企业报告实践。\n\
  \n\n来自印度旁遮普奇特卡拉大学 Chitkara 商学院的 Saurabh Bhattacharya 和 Babita Singla 探索了元宇宙银行的潜力。他们预见到了一个变革性的金融格局，审视了虚拟空间内银行策略的未来趋势和挑战，邀请读者应对元宇宙银行的复杂性。\n\
  \n\n来自印度旁遮普奇特卡拉大学的 Nitika Sharma 和 Sridhar Manohar 深入探讨了元宇宙中 NFT 的法律影响。通过对数字知识产权的探索，读者可以深入了解\
  \ NFT 对技术、法学和社会层面的动态影响，强调了建立全面法律框架的必要性。\n\n\n来自土耳其不同大学的作者 Emre Yasar、Erge Tür、Eda\
  \ Yayla 和 Nesrin Aydin Alakus 考察了元宇宙在旅行社中的作用和未来趋势。通过实证观察，读者探索了元宇宙对旅行社活动的潜在贡献，突显了其对旅游业客户体验的积极影响。\n\
  \n\n来自马来西亚不同大学的 Md. Tariqul Islam、Jeetesh Kumar、Siti Rahayu Hussin 和 Foong Yee Wong\
  \ 探索了旅行 Vlog 的演变以及虚拟现实（`VR`）的整合。读者可以了解到旅行 Vlog 在促进目的地推广和培养全球探险者社区方面的作用，并预想了 VR 在增强旅游业故事讲述能力方面的潜力。\n\
  \n\n来自印度克里斯特大学的 Sridevi Nair 和印度 Incture Technologies 公司的 Tanvi Tare 评估了学习者特征对基于元宇宙的培训计划动机的影响。通过实证分析，读者可以了解学习者态度、经验与动机之间的关系，为职场环境下的教学成效提供启示。\n\
  \n\n来自中国上海交通大学心理健康中心的作者 Kadir Uludag 探索了新冠肺炎疫情期间虚拟学术环境的使用。通过研究增强现实元素，读者发现了虚拟环境如何改善教育环境中的社交互动和参与度，为在危机期间利用技术增强教育体验提供了见解。\n\
  \n在作为这本编选参考书《探索元宇宙在商业与教育中的应用》的结语中，我们回顾了尊贵的贡献者们丰富的见解和观点。在书中，这本书充当了通往元宇宙在从商业贸易到教育和社会等各个领域变革潜力的门户。\n\
  \n作为编辑，我们对本合书中涵盖的多元化主题深表欣慰，每个主题都阐明了元宇宙演变和影响的不同侧面。我们的贡献者为这一新兴领域提供了全面的概述，从塑造虚拟环境的基础技术到指导其开发的伦理考量。\n\
  \n这本书最引人注目的方面之一是它的跨学科。通过学术界和工业界的合作，研究人员汇聚在一起探索元宇宙的多维度，弥补了理论与实践之间的鸿沟。这种合作精神强调了应对新兴技术及其对社会影响时所需的集体努力。\n\
  \n展望未来，元宇宙将继续在塑造我们的数字格局中发挥关键作用。它变革我们工作、学习、社交和开展业务的潜力是不可否认的，为全球利益相关者带来了机遇与挑战。\n\n\
  我们希望这本书能为寻求深层理解元宇宙及其影响的学术学者、学生、专业人士和政策制定者提供宝贵的资源。书中分享的见解激发了进一步的研究、创新和对话，引导我们迈向一个元宇宙丰富生活并增强人类体验的未来。\n\
  \n最后，我们诚心感谢所有分享专业知识和视角的贡献者，以及读者的关注与参与。我们衷心希望这本书能激发好奇心，促进合作，并为元宇宙及其变革潜力的持续讨论做出贡献。\n\
  \n编辑：\n\n\n## 跨越数字边界的新世界\n\n* Esra Anış\n  ![Orcid Imagehttps://orcid.org/0000-0002-6970-3180](https://orcid.org/0000-0002-6970-3180)\n\
  \  土耳其 Adnan Menderes 大学旅游管理系\n\n* Ülker Çolakoğlu\n  土耳其 Adnan Menderes 大学旅游管理系\n\
  \n### 摘要\n\n本书的这一章邀请读者进入一个名为“元宇宙”、超越数字边界的新世界。该术语源于 1992 年的一部科幻小说，已从一个单纯的概念演变为一种影响娱乐、商业和旅游等多个部门的变革力量。虽然对于大多数人来说这是一个新词，但它在游戏和电影中拥有悠久的历史。此外，元宇宙似乎是未来几年将影响游客、酒店业和旅游业的下一种颠覆性技术，通过在物理和虚拟世界中提供浸式体验来实现。\n\
  \n### 引言\n\n随着当今世界技术的快速发展，人们切换数字环境的能力也在增强。这些发展的开头是一个被称为`元宇宙`的术语，人们经常听到但无法充分探索。元宇宙邀请人们进入这个超越数字边界的新世界。它鼓励人们探索他们可能听过但并不完全的领域。本章旨在阐明元宇宙迷人的世界，并鼓励人们不仅是听过它，还要开启一段探索和理解的之旅。\n\
  \n\n\n\n2021 年，马克·扎克伯格（Facebook 首席执行官）宣布公司更名为“Meta”。扎克伯格断言，未来未来的格局存在于元宇宙（metaverse），这是一个虚拟世界，人们可以在其中参与生活、工作、购物和娱乐等各种活动。然而，这个词最早是由科幻小说作家尼尔·斯蒂芬森（Neal\
  \ Stephenson）于 1992 年提出的。在尼尔·斯蒂芬森的科幻小说《雪崩》（*Snow Crash*）中，角色们使用与今天类似的数字化身，通过佩戴目镜和“耳机”来探索在线世界。叙述的核心人物希罗·主角（Hiro\
  \ Protagonist）是一名黑客兼披萨外卖员，故事的大部分内容围绕着他努力阻止一种会导致元宇宙用户现实世界脑损伤的计算机病毒的努力（Geraghty et\
  \ al., 2022; Huddleston, 2021; Stephenson, 1992）。\n\n元宇宙对多个行业都有影响，包括游戏、电影、电视、房地产、商业和旅游业。这个迷人的领域已出现在许多科幻电影中，描绘了这种创新现实中的叙事，在这种现实中虚拟体验与实体体验并存。例如，反映元宇宙的著名电影和电视剧包括《少数报告》（2002）、《第十三层》（1999）、《头号玩家》（2018）、《自由玩家》（2020）、《阿凡达》（2009）、《她》（2013）、《黑客帝国》（1999）、《传说的：Lucy》（*Lucy*，2014），以及电视剧如《黑镜子》（2011-2019）、《兴趣点》（2011-2016）、《爱，死亡+机器人》（2019-...）等（Özyalvaç,\
  \ 2023).\n\n在将其公司更名为 Meta 后，Facebook 首席执行官马克·扎克伯格概述了一个具身宇宙的愿景，将元宇宙推向了前沿。公告之后，多家科技公司启动了元宇宙项目，其中包括知名实体，如视频游戏系列《堡垒之夜》和\
  \ *Roblox*，以及科技巨头英伟达和微软。此外，数字资产投资者 Tokens.com 在元宇宙平台 Decentraland 上购买了一块虚拟土地，并花费了\
  \ 240 万加密货币完成此次收购（Forbes, 2022）。\n\n与扎克伯格领导的 Meta Platforms 类似，其他公司现在也在规划它们的元宇宙策略。值得注意的是，元宇宙市场的重要参与者包括腾讯控股、英伟达公司、微软公司、字节跳动、Epic\
  \ Games、网易、Roblox 公司、Nextech AR Solutions 公司、Unity Technologies、The Sandbox、莉莉丝游戏、Active\
  \ Theory 和 Decentraland，他们对这一新兴领域投入了巨资。根据 Grand View Research 的一份报告，到 2030 年，元宇宙市场的投资将价值\
  \ 6788 亿美元。由于不断采用扩展现实（XR）技术来增强跨平台的用户体验，元宇宙市场也在增长。此外，在元宇宙中使用加密货币购买数字资产的需求日益增长，预计将显著推动市场发展。虚拟现实（VR）、增强现实（AR）和混合现实（MR）设备的发展和传播预计将在未来几年推动市场增长（Bloomberg,\
  \ 2023).\n\n## 历史起源：从《雪崩》到现代现实\n\n虽然“元宇宙”这个词对许多人来说相对新，但它有着深厚的历史，它最早源于尼尔·斯蒂芬森（1992)\
  \ 的小说《雪崩》（*Snow Crash*）。在小说中，元宇宙是一个虚拟世界。1995 年，第一个元宇宙是虚拟世界 *Second Life*，2003 年是\
  \ *Roblox*，2006 年是 *Minecraft*。元宇宙是一个虚拟世界，用户可以通过数字化身进入其中。像 *Ingress*、*Pokémon Go*\
  \ 和《哈利波特：魔法对决》这样的游戏利用手机、陀螺仪和 GPS 等功能将虚拟内容叠加到现实世界中（Geraghty et al., 2022).\n\n| 图\
  \ 1. 元宇宙中的视频 |\n| --- |\n| ![979-8-3693-5868-9.ch001.f](img/979-8-3693-5868-9.ch001.f)\
  \ |\n| --- |\n| 来源：YouTube (2022). [`www.youtube.com/v=ZptfnA`](https://www.youtube.com/v=ZptfnA)\
  \ |\n\n元宇宙不再仅仅是游戏；它已经扩展到音乐表演和体育赛事等体验。例如，TikTok 在 2020 年 8 月举办了歌手 The Weekend 的现场演唱会，吸引了超过\
  \ 27 万名在线观众（TikTok, 2020). 此外，《堡垒之夜》在其虚拟世界内成功举办了多次演唱会。歌手 Travis Scott 的演唱会达到了 1200\
  \ 万并发用户。同样，歌手 Ariana Grande 在《堡垒之夜》举办的演唱会也让观众享受了这种体验（Nishijima, 2021).甚至最受关注的电视节目之一（超级碗\
  \ LVI）也加入了元宇宙，Miller Lite 与 Decentraland（一个三维虚拟世界）合作举办了一场虚拟活动（Chaturvedi, 2022;\
  \ Geraghty et al., 2022).\n\n“元宇宙”（metaverse）一词是由希腊语前缀“Meta”和英语单词“universe”组成的。在希腊语中，`Meta`\
  \ 常用前缀，表示“之后”或“超越”，这种用法已进入英语语言（Xrtoday, 2021; Çolakoğlu et al., 2023).这个词最早出现在尼尔·斯蒂芬森的科幻小说《雪崩》（Stephenson,\
  \ 1992）。从概念上讲，它是数字宇宙与物理宇宙的汇，使用户能够在工作、兴趣探索、教育培训、医疗和社交互动等目的之间进行无缝切换（见图 1）。它很大程度上仍处于概念阶段，尚未完全实现。即使仅在游戏领域，也有玩家主流采的明确证据。元宇宙的现有版本赋予了用户创建自己的化身并在数字平台上探索其他资源的能力（Dwivedi\
  \ et al., 2022, 2023; Koohang et al., 2023; Buhalis et al., 2023a).\n\n\n\n\n史蒂芬森元宇宙的特征通过其\
  \ 3D 特性得到了体现，这作为现实世界的隐喻。此外，用户可以使用类似于现代 VR 头戴设备的眼镜访问元宇宙，元宇宙提供了第一人称视角，并赋予用户部分自定义的虚拟化身\
  \ (Çolakoğlu et al., 2023; Xrtoday, 2021)。同时，元宇宙还表现出诸多特征，例如：没有限制或边界；没有单一的权威进行控制；它始终活跃且无法关闭；它拥有与现实世界相似的功能性经济；它提供沉浸式的感官体验；人们可以建立真实的社交连接\
  \ (Metamandrill, 2023)。\n\n元宇宙构成了一个领域，在该领域中，实时的多感官社交互动相比传统的二维计算机媒介环境为客户和企业提供了更深刻的体验。社交互动是一个多层现象，涉及非语言和言语行为的多个维度、众多参与者、动态语境，以及通常的技术媒介\
  \ (Rather, 2023; De Jaegher et al., 2010)。虚拟世界中的关键技术旨在促进互动并满足消费者的社交需求 (Rather, 2023;\
  \ Oh et al., 2023)。\n\n| 图 2. 元宇宙的层级 |\n| --- |\n| ![Figure979-8-3693-5868-9.ch001.f02](img/ch001.f02.png)\
  \ |\n| --- |\n| *来源: Radoff (2021).* |\n\n“构建元宇宙”博客的作者 Jon Radoff 为元宇宙提出了一个由七层组成的概念性框架（见图\
  \ 2）。第一层涉及一种去物质化的现实体验，接着是第二层，侧重于对一个广阔且生生世界的发现与探索。第三层强调了一个创造者可以在其中蓬勃发展的经济体，而第四层引入了模糊现实世界与虚拟世界边界的空间计算。第五层的特征是具有互操作性组件的去中心化体验，随之后的是第六层，它包含了允许直接交互的人机界面。最后一层是创建一个更大虚拟网络和接口的基础设施\
  \ (Metamandrill, 2023; Radoff, 2021)。\n\n## 旅游与酒店业：重新定义体验\n\n国际旅游和酒店业经历了显著的转型，这不仅是因为\
  \ COVID-19 疫情，也因为像元宇宙这样的颠覆性技术 (Buhalis et al., 2023; Shaheer et al., 2022; Rather,\
  \ 2023)。根据 Forbes (2022)，元宇宙作为一种未来的环境，具有转型旅游业的潜力。然而，元宇宙的成功建立需要科技公司、创新者政策制定者之间强有合作。Forbes\
  \ (2022) 预测，在未来几年中观察元宇宙在多大程度上催化旅游业转型将是非常有趣的。\n\n旅游和酒店业对元宇宙的作用日益日益关注 (Revfine, 2023;\
  \ Rather, 2023)，因为它通过鼓励跨越物理边界的广泛地理位置的旅游服务和活动，增强了社交互动、存在感、参与感和情感体验 (Cifci et al.,\
  \ 2023; Koo et al., 2022)。\n\n尽管平行虚拟世界的想法在几十年来被认真提及过，但人类对 COVID-19 疫情相关的封锁、社交距离的必要性以及由此产生的脱离感和孤立感的集体体验，加速了围绕创造另性现实的集体想象。在这一现实中，人们将共同行动，并在任何时间的任何时候与他人共享体验。元宇宙可能是一个人们在需要时不受限制地旅行的世界\
  \ (Gursoy et al., 2022: 3)。\n\n元旅游（Metatourism）为游客提供了以沉浸方式体验不同虚拟目的地的机会，无需离开当前所在地或面临高昂成本。这种情况在创造旅游部分公平方面代表了重要优势\
  \ (Demir, 2022: 546)。根据 Buhalis et al. (2023a)，元宇宙将成为未来几年影响社会的下一种颠覆性技术，通过在虚拟和物理环境中提供沉浸式体验。\n\
  \n\n\n\n# 元宇宙对旅游业的重塑今天看来是可行的。得益于 `VR` 和 `AR` 技术，人们很快就能在舒适的家中旅行，或者体验他们认为不可能的视觉和听觉景观。例如，`Ariva\
  \ Wonderland NFT Metaverse` 游戏（见图 3）是为真实地点（如`金字塔`、`埃菲尔铁塔`、`自由女神`等）提供虚拟旅游的最新技术。包含了旅行、互动、商务、收益、财产、时空旅行等。`Ariva\
  \ Wonderland NFT Metaverse` 为用户提供了完全沉浸式的第二人生体验，允许他们在元宇宙中旅行、工作、观看戏剧表演、登台、参观博物馆、与其他用户互动、看电影、组织会议甚至在元宇宙中结婚，以及更多功能。`Ariva\
  \ Wonderland NFT Metaverse` 由 7 个星系和 7 个陨石组成，总共有 49 块通过 160,000 个不同空间区域连接到大陆的土地。`Ariva`\
  \ 是一个旨在通过为区块链旅游和旅游部门提供新一代、以区块链为中心的生态系统，来改善当前旅游业低效问题的平台。`Ariva` 希望通过将其最新的产品和服务服整合到其生态系统中，彻底变革全球行业（PortalCripto,\
  \ 2022）。\n\n| 图 3. Ariva Wonderland NFT 元宇宙（你可以通过扫描二维码查看图片和视频） |\n| --- |\n| ![Figure979-8-3693-5868-9.ch001.f03](img/ch001.f03.png)\
  \ |\n| --- |\n| *来源：PortalCripto (2022) 和 YouTube (2024b).* |\n\n此外，元宇宙具有变革数字宇宙的潜力，并在酒店业中产生新的前景。应对客人不断变化的期望是酒店业面临的首要挑战之一。对优化客人期望的需求日益增长，包括无缝的预订流程、独特的住宿体验和极具价值的优惠套餐。鉴于许多现代旅行者精通技术的特质，元宇宙可以重塑酒店业并重新定义客人体验。客人体验始于住宿的调研阶段，如果采用元宇宙，它可以将酒店预订流程提升到更先进的水平。客户可以像现在一样通过元宇宙访问订房信息，包括房型大小、价格和特色等细节。然而，随着元宇宙的整合，旅行者还可以沉浸在虚拟的三维酒店游览中。在入住之前，个人可以变成数字化身，虚拟地浏览酒店物业。三维漫步游览为旅行者提供了对酒店房间、装饰和设施的沉浸式、第一手体验，超越了静态打印件或图片的能力。这种游览让客人在酒店决策过程中产生切实的信心，并具有提高直订和转化率的潜力。在酒店管理领域，客人满意度是成功的最终基准。因此，利用元宇宙提供互动式客房体验或真实的当地文化沉浸，可以成为酒店经营者的决定性优势。这种高水平的服务不仅让酒店经营者处于竞争对手面前，还赋予了客人对未来旅行体验更大的控制权（Forbes,\
  \ 2022）。\n\n酒店业有很多令人兴奋的机会，企业也正逐渐意识到这一现实。特别是餐厅，拥有通过提供沉浸式烹饪体验来激励预订以吸引潜在客户的能力。对于住宿行业的企业可以提供虚拟游览和元宇宙会议。在旅游业内，各种酒店品牌利用元宇宙和\
  \ `NFTs` 进行营销和投资。例子包括希尔顿、万豪酒店、万悦瑞酒店、千禧酒店、新前线、科契拉、维京航空、首尔、Rendezverse、卡塔尔航空、阿联酋航空、百维啤酒、星雪域、美团披萨、CitizenM、Oveit、Lucky\
  \ Block 赌场、RendezVerse、沃当劳、Chipotle、Pinktada 等（Revfine, 2023a; 2023b）。未来，游客将越来越多地选择元宇宙旅游和酒店业体验、服务和产品，就像今天一样（Buhalis\
  \ et al., 2023b; Rather, 2023; Gursoy et al., 2022）。\n\n\n最后但同样重要的是，元宇宙的特征是物理与数字生活的无缝融合，创造了一个我们可以在其中工作、游戏、放松、交易和社交的虚拟社区（Rather,\
  \ 2023; Moy and Gadgil, 2022）。元宇宙代表了互联网演化的下一个阶段，强调物理世界的整合。对于某些用户来说，元宇宙是一个旨在数字化复制现实世界的领域。相反，对于另一些人来说，它意味着通过三维计算、增强现实\
  \ (`AR`)、虚拟现实 (`VR`) 等技术与世界的互动转变。此外，元宇宙可以作为休闲和娱乐的空间，提供逃离现实世界的场所，或者作为一个个人可以在其中进行活动的虚拟领域（Geraghty\
  \ et al., 2022）。因此，看来元宇宙为旅游客户以及企业提供了大量的期待和非凡的机会。虚拟世界与物理世界的结合使游客能够无缝地工作，并为旅游景点、酒店业产生巨大的挑战和机会（Buhalis\
  \ et al., 2023a; Rather et al., 2023）。尽管元宇宙仍处于初期阶段，但它正作为一种破坏性的新兴未来趋势演变，影响着旅游景点和酒店品牌的竞争力（Rather,\
  \ 2023）。\n\n未来，潜在旅行者可能会通过元宇宙对目的地进行虚拟游览，然后做出旅行和住宿安排，由于经济、商务或其他考虑减少对实体旅行的需求。元宇宙技术还有潜力取代传统的导游，为各种景点提供增强体验。这种创新可能会在酒店业和旅游业创造一条新的业务线。游客和旅游部门都可能面临困境，在渴望沉浸于虚拟世界并体验现实世界与拥抱元宇宙之间挣扎。总之，元宇宙承诺提供超越传统旅游限制的沉浸式旅行体验，通过眼镜或\
  \ `VR` 头显设备窥视目的地。\n\n\n\n\n\n\n\n\n- Buhalis, D., Leung, D., & Lin, M. (2023a).\
