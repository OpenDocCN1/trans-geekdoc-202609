  \n# 第 9 章：多部门分析\n\n### 摘要\n\n元宇宙是一个我们彼此以及周围世界进行交互的虚拟环境。在研究中，作者探索了可持续性报告和整合报告中披露不同元宇宙技术的程度。为此，从\
  \ Nifty 100 指数中选取了已发布相关元宇宙技术披露的特定印度公司。本研究还试图强调印度企业发起的重要的物联网（IoT）、人工智能（AI）和虚拟现实（VR）技术平台、倡议和项目，这些项目旨在提高其生产力和运营效率并确保工作场所的安全。\n\
  \n### 引言\n\n\n\n\n元宇宙是一个不断演化的下一代互联网平台，数字现实与物理现实在此融合。它是一个供人们游戏、工作和社交的虚拟共享空间(Wang\
  \ et al., 2022)。“元宇宙”（Metaverse）一词源于“元宇宙”（meta-universe），即将物理空间和数字空间整合进虚拟宇宙之中(Pamucar\
  \ et al., 2022)）。随着元宇宙的出现，城市领域的数据基础设施和数字现实经历了持续的“平台化”。元宇宙是全球性平台公司“Meta”所启动的一个非常近期的平台项目(Allam\
  \ et al. 2022)。\n\n## 技术整合与运营效率\n\n元宇宙涉及人工智能（AI）、机器学习（ML）、物联网（IoT）以及虚拟现实（VR）/增强现实（AR）的使用。这些工具已被当今机构持续应用于其日常运营中。诸如‘Authbase’（Reliance\
  \ Industries Limited）等公司已使用 AI 工具实时缓解黑客和机器人攻击。Reliance 还报告了其“Mygov Corona 帮助台”（由\
  \ Jio Haptik 提供），该服务在 COVID-19 疫情期间作为强大的“聊天机器人解决方案”发挥了作用。同样，这些企业也使用 ML 技术来预测任何设备的未来健康状况。这些机构还创建了虚拟现实模拟器，培训员工在模拟环境中处理复杂的设备，以确保操作安全。所有这些工具不仅提高了组织的运营效率，还引导它们向可持续发展迈进，例如\
  \ Tech Mahindra Limited 一直通过“管道监控”进行水资源管理。这种管道监控基于机器学习技术，能够自动检测并预测任何可能发生的故障。\n\n\
  ## 实现可持续发展目标的潜力\n\n元宇宙在实现整体可持续发展方面具有巨大潜力。它的“平台化”应当被优化利用，以实现联合国可持续发展目标（SDGs）。借助虚拟现实的帮助，元宇宙能够将想象变为现实，由于元宇宙不受时空限制，因此实现“可持续教育”(Park\
  \ & Kim, 2022; Lee & Hwang, 2022)。它可以为可持续学习提供“类游戏体验”。通过元宇宙的产品，可以创建创新的教育环境。因此，通过使用元宇宙可以实现联合国第四个可持续发展目标（优质教育）。\n\
  \n## 交通与城市移动\n\n除了教育外，交通在可持续发展中也起着重要作用。“交通”在可持续发展中的作用首次在 1992 年联合国地球高峰会上得到认可，并在《议程\
  \ 21》文件中得到了加强。但 2021 年行的第二届全球可持续交通会议提供了一个讨论可持续交通并提出未来发展方案的平台。人们认为，可持续交通对于实现 SDGs\
  \ 起着至关重要的作用，因为它提供了安全、高效且具有韧性的移动基础设施，能够最大限度地减少碳排放和巨大的环境影响（联合国机构间报告，2021）。因此，可以使用元宇宙技术来改变交通系统。它可能涉及培训公共交通运营以确保安全、交通运营以及使用\
  \ AI 进行“自动驾驶”，以获得可持续交通(Pamucar et al., 2022)。\n\n环境污染也是世界面临的一个主要不可持续挑战，特别是在人口负担更沉重的“特大城市”。“元宇宙远程办公”有助于减轻特大市的这种“人口压力”。远程办公可以正向地影响个人离开特大城市并搬迁到非特大城市的意愿(Choi,\
  \ 2022)。因此，元宇宙技术实际上有助于实现整体可持续发展。它可以协助为不可持续的挑战提供可持续的解决方案。关于元宇宙的文献仍在不断发展。研究人员和学者不断对其提供见解。根据现有文献，元宇宙可以改变我们与彼此以及周围世界互动的方式。但是，“元宇宙生态系统”对可持续性报告的影响尚不清楚。本章旨在通过使用\
  \ `MAXQDA` 软件进行内容分析，研究元宇宙技术与可持续性报告之间的关系，并提供关于如何利用元宇宙促进可持续性报告实践的见解。\n\n## 研究目标\n\n\
  然而，本研究围绕在 NSE 上市的主要公司与元宇宙相关的披露展开。因此，本章旨在实现目标：\n\n* 1. 检查不同部门的可持续性报告/整合报告中讨论元宇宙技术的程度。\n\
  * 2. 分析哪种行业或部门对元宇宙技术的贡献更大。\n\n## 文献综述\n\nJauhiainen et al. (2022) 在一项系统性文献综述中指出，需要尽力减少元宇宙内的能量消耗，解决能源短缺，并优化自然和可再生资源的使用。他们的文献综述强调了元宇宙在促进持续、包容和可持续增长方面的潜力。De\
  \ Giovanni (2023) 也强调了元宇宙带来的不可持续挑战。他们的研究还强调了由于这些技术的使用导致的能量消耗。Vlăduțescu & Stănescu\
  \ (2023)发现元宇宙减少了环境污染，因为它用 3D 虚拟取代了现实互动，并用数字交换“物理商品”。Jauhiainen 等人 (2020) 也认为元宇宙有助于环境保护和可持续发展，但会逐渐增加电子垃圾和能量消耗。此外，一项研究建议元宇宙可以影响“城市规划”并有助于“可持续性问题”的报告(Dorostkar\
  \ & Najarsdeghi, 2023)。研究发现，元宇宙是减少全球温室气体排放的一种创新方法。\n\n因此，元宇宙是为不可持续挑战提供解决方案还是阻碍可持续增长已成为争议的问题。然而，仍有证据表明元宇宙促进了可持续消费。Pellegrino\
  \ et al. (2023) 提供了元宇宙对“可持续消费”经济和环境影响的理解。元宇宙具有通过数字产品替代物理商品来减少碳排放的潜力(Bibri & Allam,\
  \ 2022)。此外，这些云计算和区块链技术产品需要大量的能量或电力(Stoll et al., 2022)。因此，由于能量消耗和碳排放的增加，元宇宙对自然环境可能会产生若干负面影响。为了使元宇宙具有可持续性，必须在全球范围内通过明确的法规和可持续政策来减轻元宇宙技术的潜在有害影响(Vlăduțescu\
  \ & Stănescu 2023)。\n\n\n\n\n它还导致了数据驱动型智慧城市的创建并增强了城市可持续性（Allam et al., 2022）。研究发现，元宇宙创造了一个假设性的“平行虚拟世界”，为这类数据驱动的型城市提供了不同的生活和工作方式。元宇宙还通过增强农业、制造业、建筑业、能源和和服务业在内的各个行业，提升了全球范围内人们的生活质量（Mozumder\
  \ et al., 2023）。许多公司正在接触这一新现实，以寻求业务增长的更好机会。例如，机器人技术被企业广泛用于执行重复性工作，从而节省了时间并在运营中带来了巨大的规模经济和效率（Bochmann\
  \ et al., 2017）。但元宇宙对于未来的智慧城市而言仍面临关键挑战，因为它仍然涉及相关的伦理、环境、人类、社会和文化考量（Allam et al.,\
  \ 2022）。然而，如果我们从与可持续性管理会计实践相结合的大数据分析视角来看，那么对于组织在管理信息孤岛、降低成本和竞争优势方面产生增值策略将具有许多益处（Abdelhalim,\
  \ 2023）。\n\n除了更好的生活质量和更好的业务增长机会外，元宇宙在许多方面具有可持续增长的潜力。此类元宇宙技术可以实时跟踪运营对环境的影响，并分析和预测充足资源的需求。Rane\
  \ 等人（2023）也证实了元宇宙通过环境、经济和社会可持续性转型世界，并转变实现可持续发展目标（SDGs）方法的巨大潜力。Al-Emran（2023）开发了\
  \ `T-EESST`（技术与环境、经济和社会可持续性理论），并发现技术的使用显著影响了三重底线。\n\nBoccia & Covino (2023) 认为，元宇宙的应用能够提供可持续的机会，但可能导致一些负面的环境影响，如能源消耗和二氧化碳排放。这些数字技术可能会产生大量的电子垃圾，需要组织进行适当的电子垃圾管理。此外，组织必须观察元宇宙是否是一种负责任的技术形式，正如工业\
  \ 5.0 那样（De Giovanni, 2022）。因为工业 5.0 不仅仅是技术，“人为因素”依然存在，用以实现负责任且充实的工作体验。\n\n## 方法与数据收集\n\
  \n在本章中，抽样总体是印度所有证券交易所上市的所有公司。但目标群体选取为在 `NSE` 上市的公司。研究选取的最终样本来自 `Nifty 100` 公司。然而，最终样本为\
  \ 34 家公司，分布在 `Nifty 100` 列表所示的 15 个行业中。这 34 家公司一直在全球范围内采用 `GRI`（全球报告倡议）这一可持续性报告框架。仅选取了那些在过去五年中持续根据\
  \ `GRI 标准`（2016）准备可持续性报告和整合报告的公司。这刻意的抽样方法。因此，从 `Nifty 100` 指数中选择了在其可持续性报告中实施元宇宙技术的特定印度公司。\n\
  \n就本研究而言，它仅限于分析那些根据 `GRI` 报告框架发布报告并在过去几年持续根据这些标准进行报告的公司报告。此外，提取了这些公司的可持续性报告以进行内容分析，以识别这些报告中元宇宙技术相关披露的程度。为此目的，从为研究选定的\
  \ `nifty` 公司的官方来源提取了带有 `GRI` 内容索引的可持续性报告和整合报告。然后，这些报告被导入到 `MAXQDA` 软件中作为一个元宇宙项目。接着，通过\
  \ `text search and autocode`（文本搜索和自动编码）功能，将如“metaverse”（元宇宙）、`Internet of Things`（物联网）、`IoT`、`AI`、`Artificial\
  \ Intelligence`(人工智能）、`Machine learning`(机器学习）、`internet`(互联网）、`Big data`(大数据）、“Virtual\
  \ reality”（虚拟现实）和“augmented reality”（增强现实）等词汇列表保存到软件中，以句子为单位对报告的相关段落进行自动编码。然后，检索这些编码段落的概述以进行进一步分析。然而，本研究限于限于那些过去五年符合\
  \ `GRI` 标准的公司的可持续性/整合报告。因此，特定部门较高的元宇宙披露量可能是该部门内公司数量较多的结果。此外，解释（尤其是定性内容分析）的主观性是始终存在的。\n\
  \n## 1.) 定量内容分析与解释\n\n定量分析涉及在 `MAXQDA` 中创建的子编码分析以供进一步分析。它代表了子编码的频率。频率越高，该子编码的影响越大。此外，这里还显示了特定行业中文档或可持续性报告的数量。\n\
