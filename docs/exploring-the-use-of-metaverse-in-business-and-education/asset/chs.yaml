  # 第 5 章\n## 演变格局的回顾性分析\n\n### Vaishali Dhiman\n希马恰普尔邦大学\n\n### Manpreet Arora\n\
  ![Orcid Imagehttps://orcid.org/0000-0002-4939-1992](https://orcid.org/0000-0002-4939-1992)\n\
  希马恰普尔邦大学\n\n### 摘要\n创业者逐渐发现元宇宙的巨大潜力，它正在变成一个用户在数字领域及彼此之间进行互动的环境。本研究旨在解释元宇宙与创业活动交汇处的复杂模式、协作和主题趋势。利用\
  \ Scopus 数据库集合，本计量学分析调查了 2005 年至 2023 年元宇宙与其创业领域的知识图谱。主要发现显示，2020 年后出版量大幅增加，表明对元宇宙影响的关注日益增加。合作和文献的多样性展示了一个活跃的全球研究社区。主题图描绘了交织的主题，强调了大数据、区块链、人工智能和虚拟现实等关键主题，以及人类学习等利基领域。本研究有助于更好地理解元宇宙及其对创业的影响。\n\
  \n### 引言\n\n\n\n\n元宇宙曾经仅仅是一个科幻概念，而现在已迅速演变为创业领域或创业世界中充满活力且不断扩张的生态系统。元宇宙为新的经济倡议和技术创新展现了巨大的潜力(Allam\
  \ et al., 2022; Yaqoob et al., 2023)。因此，远见卓者和创业者通过审视元宇宙在创业生态系统中从早期阶段到如今作为复杂数字领域的发展，迅速抓住了这一机会。\n\
  \n从元宇宙的发展中可以看出，它已经远远超出了虚拟游戏环境，并从一个理论构想迅速发展为适用于创业者的蓬勃生态系统（(Weking et al., 2023; Yemenici,\
  \ 2022)）。虽然元宇宙的概念已经存在了一段时间，但随着新冠肺炎疫情的爆发，它吸引了大量的关注并经历了重大的转变。在疫情期间，人们在遭受痛苦的同时，在维持社交距离机制的情况下寻求替代方案进行互动、工作和社交，这加速了人们对虚拟技术和虚拟世界的接受与发展(Arora\
  \ & Sharma, 2023)。\n\n元宇宙的发展进程很大程度上受到了创业者的影响，他们利用了商业创业和科学突破的机遇。创业者在扩展元宇宙的应用范围方面至关重要，这对从商业、教育到娱乐和社交互动等各种行业产生了重大影响。虚拟现实和区块链等先进技术的融合有助于进一步普及元宇宙，并为创业者提供了新的机会，去重新思考所有权模型、用户体验和经济范式(Calandra\
  \ et al., 2023)。\n\n此外，既有企业和新兴创业者都对元宇宙感兴趣，因为它具有跨越边界并促进创新社交动态及协作的能力。在这一虚拟世界中运营的创业者必须穿越一个不断变化的格局，正如它所提供的体验一样，从监管疑虑到对改进隐私和安全措施的需求。尽管存在某些障碍，元宇宙仍然是一个动态的地方，创业者在处理隐私和监管问题的同时，在不断变化的环境中协商。\n\
  \n## 理解“元宇宙”术语\n\n“元宇宙”一词内涵广泛且不断变化，通常指的是由互联网支持的一组虚拟共享环境，允许用户相互之间以及与计算机生成的环境进行通信(Dionisio\
  \ et al., 2013; Sparkes, 2021)。它经常被解释为一种由于虚拟与现实融合而产生的集体共享虚拟环境。用户可以访问元宇宙中的各种活动，包括游戏、社交、工作、学习甚至进行业务活动。\n\
  \n数字宇宙是动态且互连通的，其目标是在虚拟环境中扩展和复制现实世界的元素。虚拟现实、增强现实、3D 技术和社交互动是元宇宙的核心元素，元宇宙结合这些元素创造了一个先进且多样化的数字环境(Arora\
  \ & Sharma, 2022; Arora et al., 2023)。随着技术的发展让我们更接近一个更加集成和互连通的数字未来，这个术语变得越来越流行。这是一个动态环境，来自世界各地的人可以在此连接和协作，不仅是为了乐趣，也是为了工作和业务。\n\
  \n## 创业世界中的元宇宙\n\n拥有想法并看到采取行动以实现该想法、且为当前市场开发创新产品的人被视为创业者(Arora & Sharma, 2021; Arora\
  \ et al., 2023; Dhiman & Arora, 2024)。创业者是元宇宙中的先驱，开辟了新路径并创造有趣的事物。元宇宙已成为创业领域的一种颠覆性力量，为创业者提供了广泛的数字机会。\n\
  \n在这个广阔的虚拟环境中，创业者是新颖体验的重要设计者，他们胆于挑战现有的业务模式或当前的创业环境(Enache, 2022)。这些创业者正在元宇宙中为贸易、社交和娱乐开辟新路径，而不仅仅是制作游戏。在创业世界中，元宇宙开始改变现状并为创业者提供新的前景。\n\
  \n在数字未来的无限世界中，元宇宙已演变为创新的画布，概念在这里萌发，传统边界被重新解释。元宇宙展示了一个物理与虚拟世界界限模糊的未来，并随着技术的发展变得日益流行(Kraus\
  \ et al., 2022; Arora et al., 2016)。它本质上是一个不断重塑和重新定义我们互动方式的数字边界。\n\n以下是一些逐渐发现元宇宙巨大潜力的知名创业者：\n\
  \n*   **马克·扎克伯格 (Mark Zuckerberg)**：在扎克伯格的指导下，Meta Platforms, Inc（原 Facebook）为创建元宇宙投入了巨资。他们的目标是建立一个结合了游戏、娱乐、工作和社交连接等数字活动的虚拟世界。\n\
  *   **埃隆·马斯克 (Elon Musk)**：SpaceX 和特斯拉的 CEO 对虚拟现实和元宇宙领域表现出了兴趣。马斯克承认虚拟世界的潜力及其对许多行业的影响，尽管他的主要关注点仍然是探索、电动汽车和其他革命性事业。\n\
  *   **菲利普·罗斯代尔 (Philip Rosedale)**：第二人生（Second Life）的创始人一直在致力于 High Fidelity，这是一个虚拟现实平台，旨在创建一个去中心化的元宇宙，用户可以在虚拟空间中创建、互动和交易。High\
  \ Fidelity 专注于实现用户生成内容和沉浸式社交体验。\n\n\n\n\n### b) 该领域内主要的概念结构和研究主题是什么？\n\n本文通过网络可视化和知识结构对研究问题进行了分析。章节的组织安排如下：第二节提供了该领域文献的简要见解；第三节作者讨论了论文的方法论部分；第四节展示了结果及其相应的解释；最后第五节提供了研究的结论。\n\
  \n## 文献综述\n\n元宇宙作为一个研究主题的热度日益增加，是因为它能够构建沉浸式环境，使个体更接近不同的现实。据确定，该主题引起了学术界的关注，不仅是因为它对新兴技术知识的影响，还因为它在数字生态系统增长中的意义（George-Reyes\
  \ et al., 2023）。Jacobides et al., (2023)指出，元宇宙是技术的集合，通过沉浸式虚拟世界或去中心化市场提供共享的数字体验。元宇宙被视为一组重叠且部分竞争的生态系统的集合。作者发现，现有企业急于拥抱元宇宙，以避免受到颠覆并保持其竞争地位，这导致了过度投资。总的来说，他们的研究为创新动态、技术炒作（technology\
  \ hypes）的演变，以及在建立和协调生态系统过程中涉及的问题提供了新的光。。Yemenici (2022) 提到，对于渴望在元宇宙中成为创业者的个人来说，必须首先评估元宇宙的商业潜力、便利和障碍。创业与元宇宙的结合对有抱的创始人具有提供许多商业机会的潜力。虚拟世界和虚拟现实的概念作为快速发展的数字时代的标志正变得日益重要。元宇宙技术似乎是未来在线社交互动的焦点（Kraus\
  \ et al., 2022）。Handoko et al., (2023) 提到，数字世界的发展是第四次工业革命时代的最新趋势。虚拟现实和增强现实是最近的两项技术，创造了被称为元宇宙的新技术。元宇宙是一个人们可以在其中进行在线交流的虚拟环境。随着元宇宙的发展，许多企业已投入其中。它们在整个元宇宙中购买土地并建设建筑和其他基础设施。基于\
  \ AI 系统的组织可以通过利用数据驱动技术和流程创新能力来扩展自动化服务。由 AI 和`IoT`驱动的金融科技公司通过支付代币和元宇宙钱包实现沉浸式协作的金融交易、购买和投资，同时在共享的交互虚拟\
  \ 3D 和模拟数字世界中管理财务数据、基础设施和价值交换（Andronie et al., 2023）。非同化代币（`NFT`）商品在工业设置中非常有用。近年来，它们在区块链与元宇宙结合的领域迅速获得了相关性。随着许多行业开始创造性地使用\
  \ NFT 来为创业开辟新的业务创新机会，NFT 的概念迅速演变。根据作者的发现，最有吸引力的 NFT 产品类型是收藏级数字作品和创意艺术品（Wu et al.,\
  \ 2023）。\n\n元宇宙预计在未来十年内成为万亿美元市场，改变创业的本质。然而，对元宇宙的研究具有前景和局限性，对创业本质的研究也有限。这项研究为调查元宇宙支持的创业建立了一个范式，包括供给和需求促进因素，以及技术和社会促进因素。在研究中，作者展示了元宇宙如何提供转型性路径（例如纯虚拟、物理到虚拟、虚拟到物理以及混合模式），并塑造了产品、倡议和流程。作者还考察了其对创业研究的影响，并规划了未来的研究议程，以便研究能够引导并指导实践（Weking\
  \ et al., 2023）。Calandra et al. (2023) 认为，元宇宙鼓励基于游戏化、协同设计和数字孪生等理论概念创建新的创业计划。同时，利用技术建立新的业务模式可能会为创业开辟新途径。元宇宙通过强化技术作为开发新业务模型工具的重要性来帮助数字创业者。通过利用新机会，元宇宙可以帮助数字创业者扩展其主营业务。Gupta\
  \ et al,. (2023) 表示，元宇宙为年轻企业家开启了一个全新的机会世界，让他们能够利用这一新的数字领域。然而，由于元宇宙仍处于增长早期，有建立建立规范和政策以促进元宇宙中可持续创业实践的发展。\n\
  \n## 方法论\n\n本研究采用了文献计量学方法，分析了从`Scopus`数据库下载的关于元宇宙和创业的学术出版数据。研究通过网络结构和主题图进行了关键词分析，以检查其知识结构。这些方法指导了该领域的现状、新兴和未来前景。网络结构使用\
  \ `VOSviewer` 显示，主题图则使用 `R` 软件的 `bibliometrix` 包呈现。搜索于 2023 年 12 月 5 日进行，关键词为“metaverse”\
  \ AND “entrepreneurial world” or “business world” OR “startup ecosystem” OR “innovation”。在应用过滤器之前，`Scopus`\
  \ 搜索中总共出现 309 项结果，过滤后提取了 235 项项目作为数据集。使用的搜索字符串为：\n```\nTITLE-ABS-KEY (“metaverse”\
  \ AND “entrepreneurial world” OR “business world” OR “startup ecosystem” OR “innovation”)\n\
  ```\n\n### 数据收集过程\n\n在这里，图 1 描述了当前研究的数据提取和过滤方法。`Scopus` 是一个著名的学术出版数据库；它包含并存储了关于全球发布研究的作者、出版物、期刊、书籍和国家的海量信息（Dhiman\
  \ & Arora, 2024）。这就是作者选择 `SCOPUS` 作为数据收集工具的原因。搜索了关键词“metaverse” AND “entrepreneurial\
  \ world” OR “business world” OR “startup ecosystem” OR “innovation”，首次结果出现了 309\
  \ 项。随后，使用过滤器缩小了范围，例如文档类型——文章、综述、书籍章节和会议论文；出版阶段——定稿；并从数据集中排除了非英语以外的文档。经过清理，最终使用了\
  \ 235 篇论文进行分析。\n\n| 图 1. 数据收集过程 |\n| --- |\n| ![Figure979-8-3693-5868-9.ch005.f01](img/ch005.f01.png)\
  \ |\n| --- |\n| *来源：作者原创* |\n\n\n\n\n\n## 表 1 描述了我们用于进一步分析的数据的主要统计信息。这些数据提供了 2005\
  \ 年至 2023 年期间学术活动的完整快照。学术界显得非常活跃，共有 174 个来源（包括各种期刊、书籍和会议论文）总共贡献了 235 篇文献。33.02%\
  \ 的年增长率表明，近年来研究产出大幅大幅增加。由于元宇宙具有虚拟属性，这一概念在疫情后变得更加重要，因为通过物理环境进行管理变得日益困难。\n\n### 表\
  \ 1. 数据简要描述\n\n| 数据主要信息 |\n| --- |\n| 时间跨度 || 2005:2025 |\n| 来源（期刊、书籍、会议等） || 174\
  \ |\n| 文献 || 235 |\n| 年增长率 (%) || 33.02 |\n| 作者 || 702 |\n| 关键词 || 1762 |\n| 参考文献\
  \ || 10207 |\n| 作者合作 |\n| 单作者文献 || 53 |\n| 每篇文档共同作者 || 3.23 |\n| 文献类型 |\n| 论文 ||\
  \ 83 |\n| 综述 || 23 |\n| 书章节 || 46 |\n| 会议论文 || 83 |\n\n来源：由作者创建并在 `RStudio` 中进行分析\n\
  \n大量的参考文献（`10,207`）展示了与现有材料的深度互动，体现了严谨且信息详实的研究方法。此外，使用的 `1,762` 个关键词展示了多样性，凸显了研究的多学科性质。每篇文档平均有\
  \ `3.23` 位共同作者，表明作者之间高度的协作，强调了团队合作和共享专业知识在知识创造和发展中的重要性。文献形式的广泛（包括论文、综述、书籍章节和会议论文）展示了发布研究成果的全面策略。总而言之，这一统计分析描绘了一个充满活力且合作紧密的学术社区的生动形象，该社区正积极为各个领域的知识进步做出贡献。\n\
  \n### 4.1 出版模式\n\n图 2 展示了元宇宙与创业结合的出版模式，显示出 2005 年至 2023 年间明显的轨迹。在最初几年（如 2005 年和\
  \ 2009 年），出版数量非常少，表明对该概念的研究较为缓慢。直到 2019 年出版物出现了一个空白，这可能意味着有一段时间学术界对元宇宙与创业结合的关注不足。2020\
  \ 年后出现了显著的复苏，当年仅有一篇论文，这表明在疫情期间及之后，人们对该主题产生了新的兴趣，因为物理连接变得具有挑战性，虚拟平台成为连接、沟通和开展活动的必要手段，这使得元宇宙概念获得了重要性。\n\
  \n| 图 2. 按年份计算的产量 |\n| --- |\n| ![Figure979-8-3693-5868-9.ch005.f02](img/ch005.f02.png)\
  \ |\n| --- |\n| 来源：Scopus 数据库 |\n\n然而，出版数量的重大高峰出现在 2021 年，大幅增加到 `61` 篇。2022 年以 `205`\
  \ 篇论文达到峰值，这表明数量显著增加，可能归因于学者对理解元宇宙的兴趣日益增长。2023 年有 `205` 篇出版物，势头持续，凸显了该创业领域的动态性质。\n\
  \n### 知识领域发表的潜在国家\n\n图 3 显示了不同国家的主要贡献。印度成为产出最多的贡献者，文章最多。这可能归因于印度对技术的日益增长兴趣和参与。中国紧随其后，显示了该国作为数字领域全球领导者的积极角色。美国和英国均以其创业生态系统闻名，确保了它们作为重要贡献者的地位，凸显了元宇宙相关创业的全球意义。\n\
  \n| 图 3. 按国家计算的产量 |\n| --- |\n| ![Figure979-8-3693-5868-9.ch005.f03](img/ch005.f03.png)\
  \ |\n| --- |\n| 来源：Scopus 数据库 |\n\n### 概念结构与主题\n\n概念结构用于识别专门的、发展的和演变的主题（Dhiman &\
  \ Arora, 2023），这需要对特定领域的基础概念进行组织和理解。图 4 展示了主题图，描绘了两个独特的时间切片：2005 年至 2020 年和 2021\
  \ 年至 2023 年，为元宇宙创业领域研究环境的变化提供了有用见解。术语 `混合现实`、`虚拟现实` 和 `增强现实` 巧妙地与切片另一侧（即 `2021-23`）的`元宇宙`总概念交织在一起。这种互动鼓励了在元宇宙更大的背景下对这些沉浸式技术进行更深入、更整合的研究。此外，还出现了一个主题转移，包含了`区块链`、`化身`和`可持续性`的相互连接波浪。\n\
  \n| 图 4. 知识领域的主题演变 |\n| --- |\n| ![Figure979-8-3693-5868-9.ch005.f04](img/ch005.f04.png)\
  \ |\n| --- |\n| 来源：RStudio |\n\n\n\n\n\n图 5 显示了该学科的主要、核心和演进主题。随后的主题地图描述了元宇宙和创业领域内研究主题的一个动态且互相关联的图谱，预示了其随时间推移而发生的微妙演变。核心主题包括关键术语`大数据`、`区块链`、`社交网络`、`在线学习`、`工程教育`、`医疗保健`、`增强现实`和`沉浸式体验`，它们主题地图的核心。这些主要主题代表了塑造元宇宙领域融合的基础基础。`医疗保健`、`数据`和`区块链`显示了技术在解决复杂问题中的重要性，而`社交网络`和`在线学习`则强调了其对人际连接、教育和创业途径的影响。`增强现实`和`沉浸式体验`增加了元宇宙在各行业的革命性潜力。专门主题包括`人类学习`、`数字创新`、`虚拟电厂`和`能源交易`，这些主题指示了更广泛背景下的特定研究领域，表明对与人类、学习以及数字技术在能源领域应用的某些元素有更深入的理解。新兴主题包括`学习事物`、`物联网`\
  \ (IoT)、`数字技术`、`人工智能`、`虚拟现实`和`元宇宙`。这些演进主题指向研究重心逐渐向新兴技术及其对学习、网络化和沉浸式体验的影响转变。\n\n\
  | 图 5. 主题地图 |\n| --- |\n| ![Figure979-8-3693-5868-9.ch005.f05](img/ch005.f05.png)\
  \ |\n| --- |\n| 来源：RStudio* |\n\n## 结论\n\n2005 年至 2023 年间，创业领域内元宇宙的探索经历了巨大的变化。观察到的趋势表明研究正处于一个关键阶段，2020\
  \ 年后出版数量的激增以及 2022 年和 2023 年的显著增加证明证了这一点。这一时期反映了人们对元宇宙革命潜力的理解加深，学者们关注其在不同领域的应用。主题地图分析表明了一个动态格局，其特征是主题众多，且学者对技术、创业、商业和社会问题之间融合的兴趣日益增长。出版数量的增加、协作活动的开展以及对`人工智能`和元宇宙本身等发展中问题的纳入，凸显了这些学科日益增长的重要性。如`大数据`、`区块链`和`社交网络`等关键核心主题，以及`人类学习`和`能源交易`等次要主题，展示了该领域研究的复杂性质。随着元宇宙继续吸引关注，这些发现为理解这一颠覆性技术格局带来的商业机会和挑战提供了全面的知识支持。\n\
  \n研究的协作特征（如大量的合作论文和来自不同国家的贡献）凸显了理解和利用元宇宙潜力进行创业活动在全球范围内的重要性和共同努力。`混合现实`、`虚拟现实`和`增强现实`\
  \ `元宇宙`等关键词的存在，表明随时间对对多种改变现实技术的彻底分析，展示了对其在创业活动中适用性的深刻掌握。这种关注可能代表学者们日益将元宇宙视为创业领域一个至关重要且具有变革性的课题。`元宇宙`一词的突出反映了对调查元宇宙内部商业潜力和困难的进一步关注。简而言之，元宇宙和创业的研究格局已经扩张，展示了对沉浸式技术和社会影响的深入调查。对可持续性、数字技术和学习的日益重视，强调了学者们理解这一新课题复杂性的方法。这项研究为构建元宇宙叙事做出了重大贡献，为创业者提供了重要见解，并帮助他们在该领域应对障碍和抓住机遇。\n\
