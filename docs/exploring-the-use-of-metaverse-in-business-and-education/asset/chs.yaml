  \n\n一个具有重大伦理影响的新时代随着元宇宙的出现而开启，这是一个可以创造交流的虚拟现实。本研究通过研究道德、技术与人类行为之间的关系，探讨了元宇宙的许多伦理困境。研究从隐私和数据安全开始，因为个人数据既可用又易受损害。\n\
  \n\n元宇宙是一个热词。虽然对于元宇宙是什么尚未达成共识，但其发展将需要\n\n\n本章还讨论了身份与呈现所带来的伦理困境。真实性、许可以及身份盗窃的可能性都因构建和修改数字形象的能力而受到质疑。它研究了围绕虚拟身份开发和管理的伦理问题，以及长期沉浸的心理影响。\n\
  \n\n元宇宙对社会经济的影响是另一个重要研究的问题。随着虚拟经济的增长，关于数字所有权、财富分配以及经济不等的担忧显现出来。本研究调查了虚拟货币、资产和平台可能如何在无意中加剧社会分化，并对伦理框架进行重新评估。\n\
  \n\n元宇宙的治理与监管问题也包含了伦理维度。缺乏普遍认可的监管框架对责任认定、内容监管以及避免恶意活动产生了疑问。本研究评估了国际组织、政府和从业者在制定平衡用户保护与创新的道德标准方面所起的作用。\n\
  \n\n总之，本章对元宇宙引发的伦理困境进行了详尽分析。通过解决隐私、身份、社会经济影响和治理相关的担忧，希望为当前的对话做出贡献。随着元宇宙的发展，理解并解决这些伦理问题对于形成一个将人类福祉和伦理考量放在首位的数字环境至关重要。\n\
  \n\n\n\n\n隐私和数据安全问题是提供安全可靠的元宇宙环境需要解决的主要问题。本节讨论了一些主要的隐私和安全关注点（图 11）。\n\n| 图 1. 隐私和数据安全问题\
  \ |\n| --- |\n| ![Figure979-8-3693-5868-9.ch003.f01](img/ch003.f01.png) |\n| ---\
  \ |\n\n在元宇宙中，用户的替身——即 `avatar`（化身），会创建一系列数据：隐私信息（语音、视频和消息内容）、专业用途的公司机密以及维持服务运行所需的个人信息。元宇宙中始终存在数据安全威胁。存储在虚拟环境、元宇宙平台和业务系统中的内容和隐私信息可能会被伪造和泄露。攻击者可能会构建一个虚假的化身并将其用于有害目的，或者如果某人在平台上，其化身数据（包括视频和语音录制）可能会被破解。当前系统的安全特性和管理规则不足以保护元宇宙虚拟环境免受网络犯罪和网络攻击；因此，必须对其升级以更好地适应元宇宙的需求。例如，实施更精确的身份验证、动态数据访问控制策略或对个人数据进行匿名化。为了减少未经授权访问的影响，还应对对敏感数据进行加密并安全存储。\n\
  \n与传统系统相比，元宇宙系统能够收集大量更多的敏感数据，这可能会严重损害用户隐私。众所周知，始终开启摄像头的 `HMDs`（头部显示器）可以捕捉私人区域的画面，而每一次讨论都会被带有实时麦克风的元宇宙耳机记录；眼球追踪技术能够捕捉用户的视线（Fineman\
  \ & Lewis, 2018）。正如数据安全防御措施一样，敏感数据需要通过加密、动态访问控制、细粒度身份验证和匿名化进行更严密的保护，以防止隐私问题。此外，应该明确隐私义务，并为元宇宙平台供应商收集的个人信息制定隐私计划。Falchuk\
  \ 等人 (2018) 讨论了元宇宙中的隐私问题并提出了建议，特别是关于化身以及其他有助于元宇宙不断演变的元素。他们强调了保护用户隐私的重要性，并提供了多种替代方案，例如物理上不可见的化身、可传送的化身，以及几种可以识别用户行为模式并表现出相似行为的克隆化身。\n\
  \n最，加强元宇宙平台本身的安全性至关重要。元宇宙面临各种安全风险，正如目前的软件系统一样（例如病毒、勒索软件、未修补的软件、不安全的系统架构）。此外，儿童可能会看到暴力或色情内容。例如，黑客曾针对\
  \ `Roblox`，这是一个作为例子的元宇宙。`Robux` 是游戏中使用的虚拟货币，黑客试图在对 `Roblox` 系统感染勒索软件后获取它。黑客还让极具攻击性的照片和种族言论变得可见，并导致视频游戏角色做出不体面的行为。此外，增强现实（`AR`）在工业和医疗等现实环境中的应用，为恶意攻击者提供了破坏安全和人类生命的机会（Fineman\
  \ & Lewis, 2018）。\n\n某些设备（如 `VR headsets`、`HMDs` 和物联网设备）可被用于管理内容访问并提供身份验证（Rogers\
  \ 等人，2015; Schneegass 等人，2016）。它们可能允许用户在不需要输入用户名和密码的情况下绕过所需的身份验证和授权过程。生物识别数据（如运动监控）也可能与设备关联。因此，如果恶意攻击者利用元宇宙设备的安全漏洞来劫持设备的管理员或用户权限，他们就可以破解元宇宙系统的中央管理服务器，窃取特定的设备信息（如视线信息、元宇宙活动等），或远程控制连接的设备。因此，任何用于元宇宙平台的设备都必须确保安全。至少，这些设备需要遵循严格的安全保护措施并接收补丁更新。此外，由于高\
  \ `CPU` 负载和可能的设备性能下降，建议在实现安全功能时，使用独立的安全芯片来代替设备中的软件模块。\n\n网络连接——即从用户设备到元宇宙平台的连接，以及化身之间的连接——在元宇宙平台上通常是不加密的。元宇宙平台上的嗅探和欺骗攻击允许攻击者拦截消息或敏感数据。因此，必须使用安全有效的加密技术对网络连接进行加密，具体取决于数据和元宇宙上下文。另一个主要担忧是可用性，因为分布式拒绝服务（`DDoS`）或网络中断等安全漏洞对元宇宙服务的损害大于对异步在线服务的损害。如果系统对业务运营至关重要，则应该建立业务连续性和灾恢复策略，例如\
  \ `DDoS` 攻击可能会对元宇宙系统产生意外影响。\n\n得益化身，人们可以在线下世界无法想象的方式进行交流和活动，化身使用户能够远离真实的自我，并表现出他们在现实生活中绝不会采取的行为（Franks,\
  \ 2011）。化身在元宇宙中所谓的匿名性以及赋予个人的能力，可能会鼓励以牺牲集体利益为代价而滥用权力。人们的财产可能被夺走而没有方法恢复，这可能会导致社会动荡（Locke,\
  \ 2003）。正如此，社会制定法律来处理偏离社会规范的行为。人们必须放弃自行惩罚他人的自主权，换取社会保护他们其他权利的承诺。只有当法治公平地适用于所有人，而不仅仅是为了进一步满足少数选定人的利益时，社会才能建立稳定性（Locke,\
  \ 2003）。因此，有理由为元宇宙中的化身权利提供同等的保护。\n\n\n\n\n元宇宙在带来兴奋和潜力的同时，也给个人和社会带来了新的威胁（The Conversation,\
  \ 2022）。在元宇宙中，记录在案的骚扰、性侵、欺凌、仇恨言论、种族主义、不受监管的赌博以及各种异常活动越来越多。例如，据报道，BBC 新闻的研究人员在扮演一名\
  \ 13 岁女孩时，目睹了诱导儿童、种族言论、色情内容和强奸威胁。一位英国女性在 2021 年 12 月的博客文中声称，她在注册由 Meta（前身为 Facebook）创建的虚拟游戏《Horizon\
  \ Worlds》后的六十秒内，遭受了三到四名男性化身的言语和性骚扰。元宇宙中频繁出现异常行为的原因有许多。异常行为在很大程度上是由“在线抑制”引起的，这种心理状态使人们在在线环境中感到更加放松，并倾向于参与特定的活动（Cheung\
  \ et al., 2021）。据称，那个骚扰她化身的人告诉《纽约时报》的卧底记者：“我不知道对你说什么。我想做什么就做什么，因为这是元宇宙。”\n## 诽谤\n\
  \n如前所述，元宇宙将消除对言论自由的所有限制。然而，正如社交媒体平台所示，这产生了一个意外之外的后果，即人们（也被称为“网络喷子”）可以不受限制地发布关于他人或实体的无意义的虚假陈述，在此过程中损害他们的声誉和诚信。由于“化身与用户[……]的关系类似于非生命商业实体与唯一股东之间的关系，该实体本质上是控制者的替身，基于此基础，[对于诽谤的]行为可能是可以追究的”，因此在这种情况下揭开“公司面纱”是合适的（Chin,\
  \ 2007）。基于此，提起诽谤诉讼可能是可行的（Chin, 2007）。如果我们接受化身仅是人们在元宇宙中进行活动的媒介且不具备独立的意识这一理论，那么接受化身就像公司的“替身”这一观点也是合情合理的。\n\
  \n\n政府、企业和个人都优先考虑可持续性（Whittaker et al., 2021）。对于元宇宙在促进可持续性方面的作用，存在不同的观点。一方面，有人声称元宇宙将通过减少面对面会议和观光的航空、铁路和私家车旅行来减少碳排放。此外，通过消除旅行和其他资源消耗，它将提高工作效率。从另一个角度来看，元宇宙将需要高计算能力和快速宽带速度，此外还有`NFTs`的使用和用户群的增长。结果是来自不可再生能源的电力需求将会增加。未来的可能会可能会`-效益分析`（`CBA`），并从`信息技术`（`IT`）专家的角度研究这个问题。\n\
  \n\n身份在元宇宙中具有更大的意义。例如，在账户接管中，个人可能会冒充他人（Haihan et al., 2021）。本质上，这将使真实的人面临风险。坏分子日益增加的免疫感加剧了这些问题，因为他们认为自己可以逃避任何惩罚。对化身的行为负责的一种可能方法是对其进行注册。\n\
  \n\n运行元宇宙并实现安全目标需要治理。它应该确保决策权、问责机制和促进适当行为的激励措施到位。整个软件生态系统需要更新和维护，这需要元宇宙治理。底层技术中的安全和隐私漏洞可能会引入元宇宙（Wang\
  \ et al., 2022）。\n\n询问虚拟世界的法律和规范是否适用于数字世界，以及国家法律如何在元宇宙中反映至关重要。不同领域会有具有可比性的规则吗？下如图所示，元宇宙至少受到国家法律和政策的影响。可以想象，随着新群体的加入、预期变化以及新概念和体验的出现，元宇宙随时间推移而改变。元宇宙的管理也将之改变。治理应该确保元宇宙的正常运行以及社区成员不受恶人的侵害。必须遵守政府规则；它们是无法避免的。元宇宙中的财务交易受多种法律约束，包括涉及消费者保护、网络安全、隐私和反洗钱的法律。在元宇宙中，监控、追踪和记录个人信息很容易。这种监控延伸了购买习惯，还涉及追踪他们的多个身份、如何花费时间，甚至是何时工作。可以监控生物数据，如心率、视线步态，这提供关于用户心理的各种个人细节（Renaud,\
  \ Rouleau, Granger, Barsetti, & Bouchard, 2002）。涉及此类数据的治理复杂性可能有所不同。虽然许多地方将其价值主张放在利用甚至出售数据上，但其他空间则将其业务模式建立在保护用户隐私的基础上。\n\
  \n\n\n\n\n\n\n财产法规定，在“真实”世界中，涉及知识产权（特别是购买艺术品时）存在两个所有者。首先，物理艺术品本身可以判定所有权。其次，取决于交易条件，买家可能可能不是艺术品知识产权的所有者。\n\
  \n然而，数字艺术交易涉及的究竟是什么形式的所有权呢？有人认为，在元宇宙中，“所有权”本质上仅仅是一种许可或服务提供。在这些情况下，真正的所有权仍然属于所有者。这可能意味着，买家在没有原所有者同意的情况下无法出售该物品\
  \ (Cheong,2022)。\n\n随着人们和企业投入巨资购买元宇宙中的“财产”，虚拟房地产也变成了 NFT。人们可能会声称，元宇宙是一个可以应用土地法原则的地方。一个挑战可能是确定元宇宙中私有财产的侵入者是否受现实世界法律的保护。如果现实世界中的某人决定对他们的虚拟房屋进行抵押，法律也需要随之改变。\n\
  \n为了保护用户，平台和服务提供商必须结合如使用条款之类的合同保障和技术防御。因此，问题变成了随着元宇宙的发展，公司和个人应如何保护他们的版权。例如，数字艺术家梅森·罗瑟尔德（Mason\
  \ Rothschild）创作了“MetaBirkins”，这是爱马仕著名的 Birkin 包包的 NFT 复制品。随后，爱马仕向罗瑟尔德发出了停止侵函 (Garno,\
  \ 2022)。内容所有者和许可方必须评估监控此类平台及维护其权利的必要范围，因为元宇宙为知识产权盗窃提供了新途径。\n\n\n尽管对元宇宙技术已经进行了大量研究，但元宇宙的安全和隐私问题还没有得到足够的关注。元宇宙像社交媒体平台一样，面临着巨大的隐私和安全挑战。\n\
  \n黑客可以实时从其他元宇宙用户那里收集生物识别信息（如语音和面部表情）以及用户行为（如交互和购买）。这些数据随后可用于识别用户。由于元宇宙与网络（或数字）世界交织，我们必须考虑网络安全和隐私问题。只有这样，我们才能以安全高效的方式为用户提供必要的服务。\n\
  \n网络安全和隐私应该提供一系列措施、方法和解决方案，以确保人员和系统受到各种风险和漏洞的保护 (Zhang et al., 2022)。元宇宙中必须提供隐私和安全保障。这些是基础且必要的组成部分，在元宇宙环境中，需要在整个服务过程中持续观察。也就是说，隐私和安全应该从首次部署到退役的期间，通过维护进行考虑和控制。\n\
