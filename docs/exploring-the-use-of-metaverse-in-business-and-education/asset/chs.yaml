  \n[content]\n\n第 15 章\n\n*   Kadir Uludag\n\n    ![Orcid Imagehttps://orcid.org/0000-0003-3713-4670)](https://orcid.org/0000-0003-3713-4670)\n\
  \n    上海交通大学心理健康中心，中国\n\n摘要\n\n\n\n\n\n冠状病毒大流行对学术环境产生了重大影响，干扰了正常的常规并限制了学生之间的社交互动。为了应对这一挑战，教育系统实施了临时措施，以提高在线学习环境中的教育质量和交流。虽然在线学习社区日益流行，但它们缺乏虚拟现实（`VR`）和增强现实（`AR`）提供的沉浸式体验，导致与\
  \ Web 应用程序辅助的传统课堂环境相比，学生的积极性和参与度有所下降。本章旨在探索结合增强现实元素的虚拟学术环境如何通过促进社交学习收益来改善教育成果。通过利用增强现实功能，包括元宇宙在内的虚拟学术环境具有通过改善社交互动，在冠状病毒疫情或未来爆发期间提高学术生产力的潜力。\n\
  \n### 引言\n\n先进虚拟现实（`VR`）和人工智能（`AI`）技术的进步催生了一系列新型应用，旨在增强我们对现实的感知并提供独特的学习体验。增强现实（`AR`）、虚拟现实（`VR`）和元宇宙平台具有完全改变教育活动场所的能力。(Lee,\
  \ 2012)。`VR` 技术的普及为提供卓越高效的教育开启了许多新鲜且迷人的前景 (Carruth, 2017)。然而，使用 `AR` 的学生可能会因为接触大量信息而产生认知过载\
  \ (Wu, Lee, Chang, & Liang, 2013)。总而言，本书章节强调了 `VR` 和 `AI` 技术对教育的转型影响，以及它们在冠状病毒疫情等疫情背景下提供的广阔前景。我们还将讨论在教育中采用新技术伴随的一些缺点或局限性。\n\
  \n元宇宙用于人类互动（类似于 `Second Life` 等平台上的互动）由于其能够促进人之间有意义的互动正成为一种趋势。这项技术非常有价值，因为它使个人能够在虚拟环境中参与并相互连接\
  \ (Vernaza, Armuelles, & Ruiz, 2012)。在 Facebook 公司宣布重新更名为元宇宙后，在新的热情和愿景驱动下，他们旨在将\
  \ Facebook 重塑为一个虚拟环境。这一决策凸显了他们对元宇宙概念的承诺，并标志着他们改变人们在在线空间中体验和互动方式的雄心。\n\n随着 `VR` 普及率持续上升，评估将传统教室转换为虚拟学习环境相关的障碍变得至关重要。识别在线学习与面对面教学优缺点的区别是必要的\
  \ (Jefferson & Arnold, 2009)。根据一项研究，医疗领域的虚拟社区是指利用电信方法提供教育服务的个人集合 (Demiris, 2006)。参与协作学习使个人能够与他人互动，从而提高动力\
  \ (Pang, & Halim, 2014)。\n\n此外，从行为角度考虑，增强现实可以通过多感官系统促进学习。然而，关于这种媒介在多大程度上可以有效实现教育目标仍存在争议\
  \ (Chen, 2016)。一项研究表明社区发挥着至关重要的作用 (Khoshnevis, & Lee, 2020)。需要进一步的研究来全面理解心理差异 (Hat,\
  \ 2019)。此外，`AR` 应用被开发用于增强存在感 (Gargrish, Mantri, & Kaur, 2020)。为了评估学生在面对听觉信息时如何保留科学知识，一项研究使用了受间设计。结果表明，`VR`\
  \ 提供了高度沉浸的体验，而 `AR` 在传递信息方面表现出更大的有效性 (Huang et al., 2019)。\n\n## 局限性与挑战\n\n文献也承认与使用此类应用相关的各种局限性。一个明显的缺点是，在教育环境中实施\
  \ `AR` 时，它在技术、教学和心理方面给教育工作者带来了新挑战。一个特定的关注点是学生在 `AR` 环境中可能的信息过载 (Wu et al., 2013)。此外，一项研究显示，最常报告的挑战是学生在使用\
  \ `AR` 技术时面临的困难 (Akçayır & Akçayır, 2017)。此外，伦理困境涉及身份、隐私和保密等关键方面。这些概念在不同背景下引发了严重的关注和挑战\
  \ (Demiris, 2006)。\n\n## 本章重点\n\n本章的重点在于整合 `VR` 和 `AR` 作为解决在线学习社区局限性的潜在解决方案。章节探讨了\
  \ `VR` 和 `AR` 如何增强现实感、动力以及对学术讨论的积极参与。它还强调了允许为教育目的创建 3D 环境和元宇宙体验的技术进步。然而，本章也强调了识别和解决与虚拟学术环境相关的潜在风险（如成瘾和过度依赖虚拟体验）的重要性。\n\
  \n\n\n\n\n# 方法\n\n本研究采用了 `SANRA`（一种用于叙述性综述文章质量的量表）叙述性综述方法（Baethge, Goldbeck-Wood,\
  \ & Mertens, 2019）。研究利用 `SANRA` 作为开展综述的方法论框架。我们没有采用系统综述的方法。\n\n# 主要结果与主要发现\n\n结果显示，大量研究主要倾向于对虚拟现实（VR）潜在应用的推测。此外，在流行病期间，评估\
  \ VR 的优势在量化和评价方面面临着挑战。\n\n然而，当使用研究设计调查其对特定领域或方面的影响时，仅识别出有限的研究文章。此外，需要注意的是，本研究并未对使用特定方法的先前的研究进行系统性调查。\n\
  \n# 讨论\n\n虚拟学术环境的使用已成为解决冠状病毒疫情期间在线学习局限性的潜在解决方案。疫情破坏了传统的学术环境，导致社交互动的减少，并在维持学生参与度方面面临挑战。尽管在线学习社区已被广泛采用，但它们通常缺乏虚拟现实（VR）和增强现实（AR）所提供的沉浸式体验。通过将\
  \ VR 和 AR 技术整合到虚拟学术环境中，教育系统可以为学生提供更具参与互动性的学习体验。这些技术具有增强动力、增加学生参与度并弥合在线与传统课堂环境差距的潜力。然而，探索和评估这些虚拟环境的有效性至关重要，以确保它们在疫情期间及以后有效满足学生的教育需求。通过评估和完善\
  \ VR 应用，我们可以优化其教育价值并确保其相关性。\n\n## 虚拟现实应用与心理学\n\n元宇宙应用与心理学的交叉受到了广泛关注，研究人员正在探索沉浸式虚拟环境的心理影响以及心理优缺点，特别是在疫情期间。根据报告，在\
  \ COVID-19 疫情期间，全球约 40% 的人口经历了抑郁情绪下降（Borisova et al., 2022）。考虑解决这一问题的潜在解决方案至关重要。\n\
  \n多年来，研究人员和从业者一直将 VR 作为工具，以获得与气候变化相关的态度和行为的洞察（Markowitz & Bailenson, 2021）。VR 具有变革心理健康问题评估、理解和管理的能力（Freeman\
  \ et al., 2017）。VR 为某些治疗干预创造了一个安全且受控的环境，从而扩大了提供个性化心理保健的潜力。然而，关于 VR 现实和个性化心理学的文献有限。先前的研究提到针对患有创伤后应激障碍的军人的虚拟现实暴露疗法（Rothbaum,\
  \ Hodges, Ready, Graap, & Alarcon, 2001）。此外，在其他与焦虑相关的的研究（Grillon, Riquier, Herbelin,\
  \ & Thalmann, 2006; Maples-Keller, Bunnell, Kim, & Rothbaum, 2017; Powers & Emmelkamp,\
  \ 2008）、疼痛减轻（[Malloy]）、恐惧症（[Parsons & Rizzo, 2008]）、社交认知（[Kandala, Didehani, Krawczyk,\
  \ & Chapman, 2013]）以及心理治疗（[Riva, 2005]）中也提到了 VR。\n\n总之，虚拟现实在医疗保健中作为一种培训工具的使用自长期以来是一项取得了显著的发展（Bracq\
  \ & Jannin, 2019）。在疫情期间，VR 应用其相关性至关重要。\n\n## 虚拟现实应用与教育\n\n虚拟技术与教育之间的关系正变得日益紧密，这些技术旨在提高教育效果（Martín-Gutiérrez,\
  \ Mora, Añorbe-Díaz, & González-Marrero, 2017）。虚拟现实具有吸引人们注意的能力。\n\n总之，在心理治疗环境中，VR\
  \ 可以被用于支持和协助。特别是在疫情期间，VR 应用具有至关重要性，它们可以提供培训（Parsons & Rizzo, 2008）。先前的研究提到了几个主要方面：当前领域内学习内容的组织、VR\
  \ 的设计元素以及构成 VR 基础的学习理论（Radianti, Majchrzak, Fromm, & Wohlgenannt, 2020）。\n\n## 虚拟现实在教育中的缺点\n\
  \n尽管具有潜力，但虚拟现实（VR）在心理学中的广泛整合尚未实现，由于存在动症和眼干等技术挑战（Park, Kim, Lee, Na, & Jeon, 2019）。之前的综述还提到了与\
  \ VR 相关的担忧，例如可能的副作用以及虚拟环境中习得的技能向现实世界的迁移性（Weiss & Jessel, 1998）。尽管如此，关于该主题的文献稀少，这表明未来研究需要彻底调查和评估这项技术的潜在缺点。\n\
  \n## 结论\n\n虚拟学术环境（包括元宇宙）具有显著提高学术生产力的潜力，特别是在潜在的疫情期间。在这种情况下，增强现实的使用在改善社交交流和教育成果方面发挥着至关重要的作用。然而，以平衡的观点来看这项技术是重要的，要考虑其正反两方面。\n\
  \n虽然 VR 应用可以提供宝贵的学习体验，但必须承认它无法完全替代现实体验。对于学生来说，了解与虚拟教育应用相关的潜在缺点和局限性至关重要。通过意识到这些潜在的负面影响，学生可以做出明智决策并积极应对虚拟学术环境。\n\
  \n\n\n\n此外，教育工作者机构有责任应对这些关注，并就学生如何正确使用增强现实技术提供指导。这包括促进虚拟体验与现实世界体验之间的健康平衡，强调面对面交流的重要性，并鼓励批判性思维能力，以便有效地应对虚拟学习环境。\n\
  \n通过兼考虑增强现实在教育中的优势与局限性，并提供适当的指导和支持，可以利用虚拟学术环境在潜在的流行病期间提高学术生产力，同时确保学生获得全面的教育体验。\n\
  \n## 未来研究建议\n\n如前面的研究所示，采用 `AR` 的概念视角将产生更大的教育效益。强调对 `AR` 的概念性理解而非仅仅关注技术层面，可以提高整体教育成果（Wu\
  \ et al., 2013）。新冠病毒疫情在全球范围内的爆发对各地的健康、政治和社会体系产生了广泛影响（Uludag, 2022），`AR` 解决方案应优先处理易受流行病影响的系统。\n\
  \n例如，可以开发如虚拟营养师（Garcia et al., 2022）等虚拟应用，以帮助个人在流行病期间保持健康的生活方式。类似的健康应用也可以支持个人的睡眠质量。这些应用可以根据个人在疫情期间的特定需求和情况，提供个性化的指导、营养建议和运动建议。\n\
  \n此外，考虑到从当前状况中汲取的教训，计算并预判未来潜在的流行病情景至关重要。应当主动建立预防措施，以缓解未来爆发对学术环境的影响。这包括制定稳健的应急计划，投资技术基础设施以支持虚拟学术环境，并为教育工作者和学生提供有效利用在线学习工具的培训。\n\
  \n## 局限性\n\n我们的手稿需要结合定量和定性方法来证实手稿内容。本章节不属于系统性综述。此外，流行病状况可能会存在差异，承认存在许多潜在的流行病情景是重要的。\n\
  \n手稿可能未充分提及不同学科、年龄组或文化背景个人的多样需求，这可能限制了流行病情况发现的适用性。这种局限性可能会限制我们发现的通用性和应用，因为流行病状况的影响取决于这些因素且差异巨大。为了增强研究的相关性和包容性，未来的研究应该考虑更广泛的视角和人口。\n\
