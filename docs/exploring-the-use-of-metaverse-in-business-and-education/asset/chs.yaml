  \ Levenson, and Boudreau, (2004)\n\n# 人力资源分析的重要性与意义\n\n人员分析的主要目标是通过分析技术对积累数据进行实质性评估，改进公司效率和成功，对劳动力做出明智且理性的决策，从而提高组织随时间发展的持续性。根据\
  \ Kale, Aher and Anute, 2022；Reddy and Lakshmikeerthi (2017);Kiran, Sharma, and\
  \ Brijmohan (2018);Bhattacharyya (2017); Reena, Ansari,and Jayakrishnan (2019);Fred\
  \ and Kinange (2015);Kirtane (2015)，人力资源分析的意义如下：\n\n* 改进劳动力产出和投资回报。\n* 提供评估员工如何为公司做出贡献的机会，并确定他们能在多大程度上实现其职业预期。\n\
  * 识别人力需求以及如何填补空缺。\n* 在人力资源的使用与战略及财务目标之间建立联系，以提高组织绩效。\n* 人力资源分析有助于人力资源规划。\n* 可以通过多种方式预测未来的\
  \ HR 趋势和模式（离职率、缺勤等）。\n* 帮助识别导致流失的主要原因的缺陷流程，有助于留住并维持高绩效员工。\n* 挖掘导致更高劳动力满意度和生产力的前因。\n\
  * 识别可能离职的高价值员工，并确定员工流失的根本原因。\n* 它有助于预测员工的需求和技能组合，以满足组织目标。\n* 开发高效的教育、发展和培训计划。\n\
  * 使用不同的 HR 指标对数据进行评估。\n* 它有助于展示结果以及是如何实现的。\n* 帮助主管或雇主实施务实的选择。\n* 估算人员配置政策对财务的影响。\n\
  * 通过对工作职责、员工参与度、员工投入度等进行评估，确定谁符合组织文化。\n* 根据员工效率、学术记录、纪律背景等数据，为人事人员提供有用信息，以估计哪些员工可以升级成为专家。\n\
  * 人员配置实践行业及其专业人才将获得更多信誉。\n* 它有助于通过卓越的选择（特别是在招聘人才方面）获得更好的组织成就。\n* 人事经理倾向于参与战术讨论，因为他们能够根据业务结果做出决策。\n\
  * 人事部门可以以此方式对底线负责。\n* 有助于为特定职位配置最有前景的人才。\n* 证明人力资本投资。\n* 它强调对组织成功产生重大影响的关键指标。\n\n\
  # 人力资源分析的类型\n\n人力资源分析的目标是通过收集和分析数据来改进关键人才。它主要用于根据可用数据做出决策、预测人员流失并发现更多优秀人才。人力资源分析被称为人员分析。它允许组织根据\
  \ HR 指标进行评估。HR 部门用于工作场所的不同类型分析包括：描述性、诊断性、预测性和规范性。\n\n### 1. 描述性分析\n\n最基本的的类型是描述性分析，也称为观察和报告。根据\
  \ Kale, Aher and Anute (2022)，`描述性分析` 是收集和报告过去发生情况的过程。这种分析描述了什么？描述性的人力资源分析指示并解释过去与现在数据的关联。（Reddy\
  \ and Lakshmikeerthi, 2017](#979-8-3693-5868-9.ch006.xhtml#r47)）。它通常收集所有可用的存档数据，进行呈现以做出合理的判断，并有助于确定未来的行动（Kale,\
  \ Aher and Anute, 2022](#979-8-3693-5868-9.ch006.xhtml#r29)）。描述性分析被用于比较两个部门之间的离职率，并评估员工平均带薪假天数。\n\
  \n| 图 2. 描述性分析 |\n| --- |\n| ![Figure979-8-3693-5868-9.ch006.f02](img/ch006.f02.png)\
  \ |\n| --- |\n| *来源：(Singh, Singh and Singh, 2022)* |\n\n### 2. 诊断性分析\n\n\n\n\n\n\
  诊断性分析试图有效识别问题产生的主要原因。这种分析描述了“为什么会发生这种情况？”识别问题对于解决问题至关重要。它依赖许多方法，包括数据钻取和数据挖掘。企业组织必须理解问题发生的原因并寻找解决方案（Kale,\
  \ Aher and Anute, 2022）。例如，人力资源经理使用诊断性分析来找出员工为何经常缺勤的原因。它也有助于改进员工的投入度，因为高投入的员工往往生产力最高。根据\
  \ 2019 年的报告，鞋类零售商 Clarks Clarks 发现，员工投入度每提高 1%，组织的绩效就能提升 0.4%。\n\n### 3. 预测性分析\n\
  通过预测性分析，组织利用历史数据活动预测未来的发生情况。分析历史数据有助于确定某事在未来发生的概率。这种分析预测的内容将会发生吗？它是通过多种统计技术获得的，包括人工智能、机器学习、数据建模和数据挖掘，这些技术同时利用近期和历史数据对未来进行预判（Reddy\
  \ and Lakshmikeerthi, 2017）。这类分析用于预测即将开展的项目成功还是失败。雇主可以通过预测未来事件发生的概率，减少失败的可能性，从而增加组织的增长（Kale,\
  \ Aher and Anute, 2022）。根据报告，汽车公司可以使用预测性分析预测员工何时会请计划假。通过使用缺勤预测，经理可以重新安排班次和/或分配工人。\n\
  \n### 4. 规范性分析\n规范性分析与根据预测性分析的结果为后续行动提供建议有关。这种分析描述了“我们如何让它发生？”这种分析可以通过预测和解释决策选项以及优化人员表现来进一步。它被用于分析复杂数据以预测最终结果、提供决策备并突出其他商业影响（Reddy\
  \ and Lakshmikeerthi, 2017）。此类分析提出的建议基于对数据的分析，这使其不那么反复。这意味着在识别预期成就的周围进行统计建模，以确定要遵循的最佳策略。它包括生成建议性措施以理解结果。组织利用这类分析来做出战术选择（Kale,\
  \ Aher and Anute, 2022）。例如，如果一个人经常在 YouTube 上观看鞋子评测视频，平台的算法可能会分析这些数据并推荐该人员可能喜欢的类似内容。\n\
  \n## 人力资源分析的阶段/程序\n人力资源分析由五个阶段组成（Jain and Nagar, 2015）（Boakye and Lamptey, 2020），如下所示：\n\
  \n#### 1. 定义人力资源分析目标\n为了能够根据目标实施人力资源分析，人力资源专业人员首先需要识别最关键的目标。目标可能是，例如找出导致效率提高的因素、确定离职员工的百分比、评估员工状况、评估职业风险的后果等。\n\
  \n### 2. 收集数据\n人力资源专业人员在确定想要实现的目标后，收集相关数据至关重要。有很多数据收集方法，包括问卷、访谈、观察和电子平台。这种数据收集可以是内部的或外部的，例如员工工龄、招聘阶段的被动数据、高低绩效者数据、HR\
  \ 计划等。\n\n| 图 3. 与人力资源相关的目标 |\n| --- |\n| ![Figure979-8-3693-5868-9.ch006.f03](img/ch006.f03.png)\
  \ |\n| --- |\n| *来源：(Jain and Nagar, 2015)* |\n\n#### 3. 人力资源指标评估\n后续阶段是确定组织在决策时打算采用的人力资源指标。简单来说，这涉及到识别员工的前因维度。例如，员工满意度指数、员工离职率等。因此，收集、保存和分发员工的相关数据以确保一致性和可访问性至关重要。\n\
  \n### 4. 数据分析\n为了从数据中获得有意义的信息，有必要进行高级统计分析。有效的人力资产决策需要 HR 部门具有强大的逻辑基础。为了确定职业风险是否对员工表现产生负面影响，必须进行回归分析。当方差结果为负且显著时，说明职业风险显著负面影响工作绩效。此外，为了确定员工流失率，将特定时期内离职员工的总数除以剩余员工的总数。\n\
  \n### 5. 决策阶段\n数据分析和提取有意义的信息是做出决策的第一步。在大多数情况下，这需要改变现有人力资源实践和流程，或创建新的 HR 政策、程序和流程。\n\
  \n\n\n\n\n# 人力资源分析简介\n\n通过人力资源分析，使工作场所的人员管理变得更加简单。该技术被用于存储与员工个人档案相关的信息，例如经验、技能组合、学术技能等。多种指标被用于提供数据，帮助人力资源部门进行招聘流程。人力资源分析评估了员工离职人数增减的原因。这保留了员工或工作满意度、职场承诺以及其他相关信息的证据（Tomar\
  \ and Gaur, 2020）。员工参与度是极受欢迎的，而且是一种情感-激励因素，因为高参与度的员工意味着具有创新能力的员工（Gawke, Gorgievski\
  \ and Bakker 2017; Orth and Volmer, 2017)），并且因为如此，他们对工作持有积极态度。它还会导致较低的缺勤率和离职倾向（Schaufeli\
  \ and Bakker, 2004; Saks, 2006）。许多研究人员从个人心理和认知归属的角度定义了员工参与度（Baumruk, 2004; Shaw,\
  \ 2005; Richman, 2006）。它还被称为个人在任职岗位上表现出的“自愿努力”（Frank, Finnegan and Taylor, 2004）。这强调了在执行官方分配职责时的“心理可用性、安全性和意义感”（Bhatnagar,\
  \ 2007; Bhatnagar, 2009）。\n\n人力资源分析可以帮助组织在提升绩效的同时保持员工的参与度。当组织拥有高质量数据、解读数据的技能以及做出决策的战术能力时，他们应该使用具有增值的人力资源分析（Minbaeva,2018）。相比之下，由于设备水平低、数据解读能力差、资源匮乏以及缺乏优质数据，人力资源部门很难获得具有增值的人力资源分析（Anderson,\
  \ 2017）。投入投入的员工并不一定是快乐或满意的员工。报告中缺乏对这一术语的理解和恰当的。组织及其员工形成了一种由该术语描述的关系。根据员工对组织目标的奉献程度，确定他们对工作有多么热情是重要的。参与度往往会提高留存率、绩效和生产力，而高绩效者会超出他们的职责范围（KUDOS,\
  \ 2021）。员工的参与度水平在 2021 年出现了十年来的首次下降。根据对 57,000 多名兼职员工的调查，员工参与度在 2021 年出现了十年来的首次下降。人力资源分析可以帮助组织在提升绩效的同时保持员工的参与度。当组织拥有高质量数据、解读数据的技能以及做出决策的战术能力时，他们应该使用具有增值的人力资源分析（Minbaeva,2018）。相比之下，由于设备水平低、数据解读能力差、资源匮乏以及缺乏优质数据，人力资源部门很难获得具有增值的人力资源分析（Anderson,\
  \ 2017）。投入投入的员工并不一定是快乐或满意的员工。报告中缺乏对这一术语的理解和恰当的。组织及其员工形成了一种由该术语描述的关系。根据员工对组织目标的奉献程度，确定他们对工作有多么热情是重要的。参与度往往会提高留存率、绩效和生产力，而高绩效者会超出他们的职责范围（KUDOS,\
