  \n# 第 11 章\n\n*   Nitika Sharma\n    印度旁遮普邦奇特卡拉大学\n*   Sridhar Manohar\n    [![Orcid\
  \ Image](https://orcid.org/0000-0003-0173)](https://orcid.org/0000-0003-0173)\n\
  \    印度旁遮普邦奇特卡拉大学\n\n### 摘要\n\nNFT 中的知识产权和法律问题目前关注较少，由于金融投资的日益数字化，这需要进一步的研究。由于 `NFT`\
  \ 是动态且不断演变的，并对数字所有权、技术、法律以及社会其他方面产生了一系列结果和影响（包括正面和负面影响），本章旨在从元宇宙的背景下探讨 `NFT`。数字知识产权法的影响在本章中起着重要作用。\n\
  \n### 引言\n\n\n\n\n近年来，元宇宙因涉及多种技术而引起了关注，这些技术提供了一个与现实世界类似的虚拟世界（Lee et al., 2021）。通过元宇宙的虚拟世界，人们可以参与社交、娱乐、学习、艺术创作等活动，甚至体验实时购物（Chen\
  \ et al., 2023）。Jasmini 等人（2023）将元宇宙定义为“超越宇宙的未来主义虚拟世界”，并预测未来几年内，大多数人口将通过使用元宇宙显著减轻任务，组织也将开发以元宇宙技术为中心的产品和服务。元宇宙融合了虚拟社交世界，为企业和投资者提供了巨大的空间，充满了机遇（Singh\
  \ & Sisodia, 2023）。元宇宙的兴起及其意义为投资者和企业进入虚拟空间并扩大其领域创造了机会。\n\n元宇宙与去中心化金融（`DeFi`）相结合，在虚拟空间提供各种服务，例如通过加密货币和区块链技术实现的便捷金融服务、艺术机会以及建立业务的机遇（Kumar\
  \ et al., 2023）。它能够通过加密货币、虚拟银行、虚拟货币交易所，事实上还有虚拟保险服务进行投资和交易（Kaur et al., 2023）。元宇宙使用的区块链技术在赋能资产数字管理方面做出了重大贡献，提供了一种安全的分配机制（Gadekallu\
  \ et al., 2022）。这些数字资产的一个方面是非同质化代币（`NFTs`），它们具有不可转让这一独特特性（Razi et al., 2023），在虚拟世界中不可替代性（Aksoy\
  \ & Uner, 2021），这与其他加密货币不同。`NFTs`还通过建立虚拟景观、房地产和创意所有权有助于社区发展和合作（Chalmers et al.,\
  \ 2022）。自从`NFTs`普及以来，其人气一直在增长，特别是在艺术领域。此外，由于元宇宙中的`NFTs`依赖去中心化技术运行，它们帮助艺术家直接将其独特创作变现，而无需通过中间人（Kharitonova,\
  \ 2024）。通过包含在`NFTs`中的智能合约，创作者将获得收益的一定比例。根据 Timucin 和 Biro（2023）的说法，智能合约提供了一种安全且高效的执行手段。然而，凡事都有两端。考虑到新兴的用途，将数字财产考虑在内很重要。回到互联网的早期，我们看到数字资产发生了演变。现在从`Web\
  \ 2.0`到`Web 3.0`的转变是目前需要关注的。`Web 3.0`提供的平台更以用户为中心，因为它高度依赖于`blockchain`技术。\n\n##\
  \ WEB 3.0 及其在塑造元宇宙中的作用\n\n回顾互联网的不同阶段，它已经经历了巨大的演变（Zhang et al., 2008）。互联网最初以`HTML`出现，随后双向通信的开启在\
  \ 2004 年通过`Web 2.0`开启了第二时代（Ibrahim, 2021）。`Web 2.0`应用利用网络作为平台，跨越所有连接设备，通过交付一种不断更新的服务，这种服务使用的人越多就越好，并从包括个人用户在多个来源混合数据（O’Reilly,\
  \ 2005）。`Web 2.0`的著名实例包括`Facebook`、`Outlook`和`Instagram`。`Web 2.0`的使用增加了虚拟世界的连接性和可用性（Ibrahim,\
  \ 2021）。此外，由于技术可用性和利用的增加，金融和科技取得了进步。传统网络在金融和银行领域的出现消除了金融交易对物理位于银行或存储场所的需求（Giglio,\
  \ 2021）。然而，具有许多优势的选择也伴随着缺点。`Web 2.0`有效分发信息的能力在近年来经历了显著增长。根据 Rani 等人（2022）的说法，个人经历着改变系统和信念的转变过程，对他们产生了影响。此外，尽管银行实施了强大的网络安全措施，黑客仍然发现了漏洞，并通过漏洞非法访问这些数据（Ali\
  \ et al., 2021）。\n\n\n\n著名的加密货币 `Bitcoin` 和 `Ethereum` 在构建称为 `Di fi` 世界的元宇宙构建中起着至关重要的作用。`NFTs`\
  \ 是这一背景下的一个重要方面（Kabanda et al., 2022）。`NFTs` 可以被视为一种各种数字资产的所有权方式。`NFTs` 多样性的增加与良好商业机会的出现相融合（Ali\
  \ et al., 2023）。与 `Bitcoin` 或任何其他加密货币不同，`NFTs`是非同质化的数字资产，它们并非相同，而是每个 `NFT` 都有一个独特的身份（Thomas\
  \ & David, 2022）。由于其独特的特性，`NFTs` 在近年来变得越来越流行。区块链技术的发展和数字所有权的理念推动了 `NFTs` 的演变。最初，`NFTs`\
  \ 主要与艺术世界相关，为艺术家提供了从数字创作中产生收入的新途径，并为收藏家提供了可验证的权权证据。然而，随着 `de fi` 的出现和元宇宙的发展，`NFTs`\
  \ 的范围已扩展到艺术之外。今天，`NFTs` 被应用于从游戏到虚拟房地产的各个行业，允许人们以安全透明的方式购买、出售和交易独特的数字资产。这些代币的演变导致了我们看待和参与数字资产方式的转变，为虚拟世界数字所有权的未来提供了视角。\n\
  \n`NFTs` 结合元宇宙为通往虚拟世界提供了一条良好的道路。但元宇宙究竟是什么？Dionisio et al. (2013) 将其定义为：“元宇宙一词是前缀‘meta’（意为‘超越’）和后缀‘verse’（universe\
  \ 的简称）的组合词。”这意味着一个非物理宇宙。这个“超越之宇宙”是一个计算机生成的世界。元宇宙是一个与现实世界平行的虚拟世界。`NFTs` 进入元宇宙有助于建立一个去中心化和以用户为中心的经济系统。根据\
  \ Kabanda et al. (2022)，`NFTs` 的使用使用户能够在元宇宙中建立其虚拟资产的所有权。此外，元宇宙有助于这些代币的交易，使用户可以轻松进行点对贷款，为金融投资者提供了一个灵活且以用户中心的平台，开启了新的投资方式。\n\
  \n# NFT 与数字所有权\n\n从使用区块链技术保护所有权，到为数字资产提供独特的表示，`NFTs` 防止了这些数字资产在元宇宙二级市场中被轻易复制和盗窃（Raman\
  \ & Raj, 2021），具有许多方面改变数字所有权概念的巨大潜力。它们可以创建一个由游戏、艺术与收藏品、房地产等驱动的数字生态系统，并具有身份验证这一核心优势，使原始所有者能够轻松收集版税（Tomić\
  \ et al., 2023).\n\n## NFT 的用途\n\n*   **A) 区块链游戏**：随着虚拟领域区块链技术的发展，区块链作为数字游戏的一股力量出现，它实现了数据安全并在用户之间建立了信任（(Stamatakis\
  \ et al., 2024)）。此外，基于区块链的 `NFTs` 使用户建立所有权。`NFTs` 包括货币、升级或独家物品。\n*   **B) 艺术画廊**：`NFTs`\
  \ 帮助艺术家展示他们的创作。它们让投资者购买、出售和 `NFTs` 到数字所有权。\n*   **C) 虚拟房地产**：在元宇宙中，非同质化代币提供了获取、交换和存储的安全手段。\n\
  \n\n\n\n随着元宇宙在数字领域的日益出现，人类的社交范围也随之扩大，这使得 NFT 实现这一目标最突出的方式之一，它提供了验证数字资产所有权的手段 (Behl\
  \ et al., 2024)。新兴的 NFT 身份困境带来了独特的挑战，需要仔细的审查和深思的解决方案，以确保在这个不断发展的数字环境中为用户提供无缝且可持续的体验。产生的问题是，现有的隐私安全保护是否足以应对诈骗者的伪造活动？\n\
  \nNFT 最初的开发是为了为艺术家建立一个技术复杂的领域。然而，不法诈骗者通过非法侵占同其他创作者的艺术作品污染了这一领域 (Collier, 2022)。有关这些数字资产的知识产权是创作者关注的问题，因为虽然区块链有助于提供免受这些资产的信息安全保护，但在版权方面，目前还没有盛行的法律可以帮助创作者在面对其独特作品时，获得版权持有者的合法权利\
  \ (Kulakova, 2022)。在版权和商标的帮助下，可以提高创作者的透明度 (Bamakan et al., 2022)。因此，NFT 在知识产权中的范围或潜力是一个值得关注的问题，最重要的是它为创作者或\
  \ NFT 持有提供了原始所有权。此外，消除创作者对艺术品伪造的恐惧，使 NFT 成为一个良好的财务投资途径。创作者对伪造担忧的减少为 Web 3.0 领域的新投资机会铺了道路。\n\
  \n## NFT 的版权保护\n\n在版权保护方面，NFT 缺乏 set 的安全标准 (Aksoy & Uner, 2021)。区块链的去中心化性质使得信息难以追踪，版权主张成为了一项艰巨的任务\
  \ (Makridakis & Christodoulou, 2019)。正如上一节所述，拥有 NFT 同时也带来了知识产权；然而，首先找到这些独特资产的创作者是至关重要的。存在伪造的可能性，这进一步导致了欺诈行为，例如销售卖家并不有的\
  \ NFT (Bhujel & Rahulamathavan, 2022)。此外，所有权问题仍然是数字世界中关注的问题，这引发了元宇宙投资者和参与者之间关于版权主张的问题。\n\
  \n然而，目前的版权法并不完全适用于和兼容于调节 Web 3.0 环境。研究涉及 NFT 的法律问题是研究中的一个关键因素。监督版权保护的某些步骤可能对于现有的\
  \ web 3.0 环境来说并不重大，但可能会导致许多变化，例如自动检测伪造或侵权作品的优化平台，这将为创作者带来重大革命。\n\n## 区块链技术与智能合约\n\
  \n区块链是 NFT 所有功能的基础，记录了跨平台的交易 (Hammi et al., 2023)。这种原因使得 NFT 彼此独一无二，降低了操纵风险 (Rahulamathavan,\
  \ 2022)。为了实现这一点，NFT 利用智能合约来管理所有权和可转性。但什么是智能合约？众所周知，区块链技术高度依赖代码和去中心化，从而确保了被称为智能合约的自动执行协议\
  \ (Singh et al., 2020)。由于其自动化，它消除了交易成本或中间环节的需求。此外，智能合约还促进了向原始创作者支付版税的自动化。\n\n##\
  \ 法律问题与挑战\n\n数字资产面临的主要挑战是伪造者。这些人复制或盗取创作者的作品并将其作为自己的作品出售，使得很难辨别真伪 (Mochram, 2022)。如果购买了伪造\
  \ NFT 会发生什么？如果购买了假 NFT，与 NFT 拥有相关的知识产权将缺失，使其变得毫无价值且无法合法交易 (Rawat et al., 2022)。尽管元宇宙技术和智能合约防止伪造方面做出了努力，但仍然发生，这成为了\
  \ web 3.0 的一个重大漏洞。这种差距的存在由于多种原因，主要原因是区块链和元宇宙在全球范围内的使用 (Truong et al., 2023)。尽管不同平台拥有验证流程使法律问题难以产生，但需求、意识缺乏、技术进步以及许多其他原因使得追踪或阻止伪造活动变得困难\
  \ (Razi et al., 2023)。\n\n\n\n\n\nNFT 不断增长的范围扩大了各种商业和投资机会。根据(Razi et al, 2023)，NFT\
  \ 市场规模预计将从 213.9 亿美元增长到 2030 年的 21100 亿美元，复合年增长率（CAGR）高达 33.7%，这描绘了 NFT 领域的市场机会和增长。此外，通过\
  \ Web 3.0 工具（如加密货币和 NFT）探索商业机会或扩展现有业务，增加了虚拟上在任何地方、任何时间工作的优势。机会主义者无需寻找物理空间或过量资金即可通过\
  \ Web 3.0 建立业务或产生收入。除了商业机会外，Web 3.0 还为多元化投资打开了大门，加密货币和 NFT 是其中的重要参与者。由于 NFT 演变的未来前景在未来几年内清晰可见，早期的意识、接触和投资在未来几年内可能会取得硕果。同样，理解业务范围并把握其提供的机会，对于在这个繁荣的数字领域取得成功至关重要。\n\
  \n以下是 NFT 新兴热潮中流行的几种繁荣 NFT 商业模式案例研究：\n\n### Cryptopreneurs NFT\n\nCryptopreneurs\
  \ NFT 的商业模式结合了托管系统，以促进加密货币交易，确保交易的无缝衔接并保护创作者免受欺诈活动。该公司主要服务于对购买和销售 NFT 或 Web 3.0\
  \ 服务感兴趣的 3.0 创作者和创业者。\n\n| 图 1. Cryptopreneurs NFT 原版 NFT 收藏¹ |\n| --- |\n| ![Figure979-8-3693-5868-9.ch011.f01](img/ch011.f01.png)\
  \ |\n| --- |\n\n这是一个将 NFT 创作者聚集在一起社区的数字收藏平台。此外，该平台为 Web 2.0 和 Web 3.0 平台提供财务和投资培训材料，以支持社区升级和强大业务的发展。为了支持一种完全虚拟且不受其数字化限制的商业模式，他们还提供数字营销服务和该领域的技能增强。此外，如上述图\
  \ 1 所示，他们拥有原版收藏 NFT，其目的是鼓励创作者创作原创作品并将其列在网站上，以防范欺诈活动。\n\n### Metropoly\n\n名为 Metropoly\
  \ NFT 的区块链商业模式将热门房地产视为 NFT。每处房产都被上传到区块链网络并进行代币化，可以在任何时间从任何地点访问。通过 Metropoly 商业模式，投资者和用户可以通过购买房地产和产生被动收入来实现投资组合多元化。此外，投资者可以通过这种投资的高流动性满足他们的即时需求。\n\
  \n| 图 2. Metropoly 生态系统² |\n| --- |\n| ![Figure979-8-3693-5868-9.ch011.f02](img/ch011.f02.png)\
  \ |\n| --- |\n\n对于寻求房地产投资的人来说，Metropoly 是一个极好的商业模式。提供的收益包括由实体房产支持的非同质化代币（NFTs）、房地产\
  \ NFT 交易平台以及在新房产进入二级市场之前获取它们的机会。上述图 2 反映了 Metropoly 的各种特性。\n\n### Pudgy Penguins\n\
  \nPudgy Penguins 使用以太坊区块链存储 8888 个 NFT 系列的所有权，是 Web 3.0 平台上的原创数字艺术 NFT 品牌，通过知识产权和社区赋能加速创新。下方图\
  \ 3 中的图像取自 Pudgy Penguins 网站。该图表明，除了该品牌的服装系列外，网站还提供购买媒体 GIF 的选项。\n\n| 图 3. Pudgy\
  \ Penguins |\n| --- |\n| ![Figure979-8-3693-5868-9.ch011.f03](img/ch011.f03.png)\
  \ |\n\n### 未来前景\n\n元宇宙日益增长的普及表明，NFT 在未来将至关重要。现有文献尚未探索 NFT 的潜力，即创作者如何在不需要中介的情况下直接将其作品商业化。创作者与投资者之间的这种直接联系可以彻底改变这种局面。此外，NFT\
  \ 为创作者和创业者开辟了新道路，因为它们为业务发展提供了独特的体验。\n\n### NFT 的法律问题\n\nNFT 涉及许多与版权、税务等相关的复杂问题。确定实际所有者或创作者非常困难，这极大影响了此类创作者的业务利润。虽然区块链上有`smart\
  \ contracts` 可用，但也受到不同国家法律限制的约束。现有文献在法律方面仍然缺失，这使得进一步的研究至关重要。\n\n- FRQ1: 法律框架如何影响创作者和投资者的利益？\n\
  - FRQ2: 与版权和知识产权相关的演进法律如何适应 NFT 在所有权方面提出的挑战？\n\n### 意识：面临的挑战\n\n虽然 NFT 为投资者和创作者提供了许多机会，但知识和意识的缺乏是一个巨大的挑战\
  \ (David & Won, 2022)。\n\n- FRQ3: 提高 NFT 相关意识的措施和影响是什么？它将如何影响决策过程？\n- FRQ4: 缺乏意识会导致创作者和投资者的行为偏见吗？它对决策的影响有多大？\n\
  \n### 传统 � vs. 数字\n\n虽然有很多关于传统金融与数字金融，或传统业务与元宇宙业务对比的研究 (Gomber et al., 2017; Klein\
  \ et al., 2019; Nair & Menon, 2017)，但它对经济或投资者财富的长期影响是一个可以研究的领域。\n\n- FRQ5: 与传统业务或传统投资相比，NFT\
  \ 的长期影响是什么？\n\n\n\n\n\n# FRQ6: 早期采用 NFT 是否对投资者的财富创造产生显著影响？\n\n## 结论\n\n过去的文献已经涵盖了许多关于\
  \ NFT 和元宇宙的研究，然而在解决与知识产权版权保护相关的法律问题方面，仍存在巨大的空白。本研究探讨了了其中一些问题，并为该领域的进一步研究提供了范围。过去的文献也考虑了伪造者的问题，但对于停止伪造活动的措施仍然缺位。此外，创作者和投资者的意识可以显著影响整个\
  \ Web 3.0 环境的格局，且不合规情况可以得到显著改善。本研究为未来深入研究 NFT 及其实际意义提供了基础。\n\n# 参考文献\n\n- Bamakan,\
