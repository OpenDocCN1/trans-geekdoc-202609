  \ et al., 2024）。因此，可能领域的隐私泄露可能带有更严重后果的风险，这种现象被称为“技术影响的放大”。尽管元宇宙可以极大改变人们互动、社交和度过的方式，但就像任何开启机会的技术进步一样，它也为人的阴暗面留下了空间（Dwivedi\
