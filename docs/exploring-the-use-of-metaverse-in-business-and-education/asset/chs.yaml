  \nTech Mahindra ltd 还对其自动化平台（`GAiA`）进行了披露，以提供环境和业务解决方案、云服务（`mPAC`）以及作为数字电信平台的“BlueMarble”。该公司还报告了\
  \ `AI` 和 `ML` 技术以及 `IoT` 在确保网络安全和大数据管理中的重要性。它还报告了利用 `Computer Vision`（计算机视觉）技术为一家医疗技术公司提供“认知检测”的解决方案。该公司还报告了在大流行期间通过自动化和\
