  \ |\n| A || .826** || 1 ||  |\n| E || .712** || .703** || 1 |\n\n** 相关性在 0.01 水平上显著（双尾）。\n\
  \n发现所有变量之间的相关性均显著（`p<0.05`）。发现参与培训计划的动机与参与者对元宇宙的态度（0.826）以及参与者的技术经验（0.712）存在极强相关。在建立相关性后，研究人员通过回归分析评估了其影响。分析结果已在表\
  \ 3 中给出。\n\n### 表 3 回归分析\n\n| 预测变量 || R || R 平方 || 调整 R 平方 || F || Sig. |\n| ---\
