  \n\n\n\n\n旅游业被认为是元宇宙应用将频繁使用的领域，因为它是一个高度注重体验的领域，需要人们进行密集的信息搜索（Dwivedi et al., 2022）。元宇宙是指对大型虚拟共享环境的探索与参与，通过虚拟化身模拟沉浸式旅行体验（Shin\
  \ & Kang, 2024）。由于旅游产品和体验具有无形性，因此很难进行评估。旅游消费者从不同来源获取信息，以体验并比较可能的选择（Buhalis et al.,\
  \ 2023）。元宇宙为旅行者提供了在到达目的地之前体验目的地和运营模式的机会（Buhalis et al., 2022）。元宇宙旅游建立在现有的虚拟旅游之上，这些旅游利用\
  \ 360 度或 3D 模态技术。通过促进与虚拟目的地中的其他代理和物体进行同步交互，通过化身的具化实现了心理和生理上的体验。因此，旅行者（即旅游消费者）有机会了解旅游服务。相应的，他们的预期和参与意愿也随之形成。\n\
  \n### 元宇宙对旅游业的影响\n\n在旅游业中，元宇宙赋予了访问虚拟资源的能力，以便在游客身处实地时增强消费者体验和目的地满意度。例如，游客可以使用增强现实（XR）设备体验考古寺庙中的古代仪式或火山爆发（Rauschnabel,\
  \ 2022）。另一方面，元宇宙世界中还积极组织了虚拟演唱会、数字购物和展览（Wang et al., 2022）。元宇宙旅游也可以作为一种可持续的旅游形式，减少由过度旅游造成的环境和生态破坏（Go\
  \ & Kang, 2023）。此外，社会弱势群体（如残障人士或身体面临挑战者）可能将元宇宙旅行视为替代旅行形式。元宇宙在扩大旅游活动范围方面具有意义。\n\n\
  随着元宇宙在旅游领域的使用，消费者可以从全面尝试和评估旅行替代方案的能力中获益，它可以在促进如伞跳等旅游活动中的体验性消费方面发挥作用。导航可以复制目的地、住宿业务或文化遗产遗地的数字孪生系统，使用户可以选择最符合其需求和偏好的选项（Buhalis\
  \ et al., 2023）。Gürsoy et al. (2022) 指出，元宇宙影响了旅游体验的阶段和消费者行为，从而带来了营销和运营的改进。总而言，元宇宙可能会成为该行业不可或缺的一部分（Gürsoy\
  \ et al., 2022）。\n\n### 未来趋势与挑战\n\n目前旅游领域内的元宇宙探索处于早期阶段（Buhalis et al., 2023）。现有研究主要集中在概念性讨论上（Go\
  \ & Kang, 2023）；Gürsoy et al., 2022；Buhalis et al., 2023）。该领域的实证研究非常有限（Shin & Kang,\
  \ 2024）。在此背景下，本研究的主要目标是辨别元宇宙的作用，特别是在旅行领域内。\n\n### 背景：旅游与元宇宙\n\nFacebook 最近更名为 Metaverse\
  \ 将这一概念推向了风暴中心（Bolar, 2022）。术语 `meta` 意为“超越”，结合具有“宇宙”意义的 `verse`，传达了超越的理念（Çolakoğlu\
  \ et al., 2022）。元宇宙代表了一个提供虚拟和物理体验的科技领域（Buhalis et al., 2023）。元宇宙通过利用增强现实和虚拟现实扩展了物理边界，使个人能够更近地探索目的地（Dwivedi\
  \ et al., 2022）。凭借其变革性特征，元宇宙有望在各个领域引入创新和机会，尽管它也面临着若干挑战（Dwivedi et al., 2023）。预计从元宇宙中获得巨大收益的部门是旅游业（Go\
  \ & Kang, 2023）。\n\n元宇宙是改变个人行为模式的影响因素之一（Gürsoy et al., 2022）。游客可以在假期之前通过元宇宙体验酒店或目的地；因此体验在假期开始就开始增加并多样化（Buhalis\
  \ et al., 2022）。这种体验会对购买行为产生积极贡献，但也可能产生负面影响；如果游客对体验感到失望或预期未得到满足，他们可能不会参与购买行为（Buhalis\
  \ et al., 2023）。元宇宙通常有助于游客，特别是在假期之前和期间。\n\n元宇宙为游客提供了在假期之前体验目的地和住宿的机会。因此，游客可以全面评估他们的假期选择（Monaco\
  \ & Sacchi, 2023）。通过元宇宙体验假期选择的游客会做出决策（Flavian et al., 2021）。因为元宇宙为游客提供了超越现实世界的虚拟旅行机会，使他们能够更近地探索目的地并体验新文化。同样，元宇宙在游客假期期间也能帮助他们。在访问目的地的文化址时，游客可以通过元宇宙以视觉和听觉方式获取信息，并看到过去的文化址（Buhalis\
  \ & Karatay, 2022）。元宇宙可以展示文化址的前后对比版本。游客可以通过元宇宙体验文化和历史遗址随时间的发展。\n\n\n\n\n元宇宙在目的地推广和营销中起着关键作用，已成为旅行社和目的地的重要工具（Volchek\
  \ & Brysch, 2023）。通过利用元宇宙，这些实体可以通过创建原创且迷人的数字内容来吸引潜在游客。虚拟现实视频、增强现实体验和交互式数字旅游览不仅让人们能够窥见真实的假期体验，更提升了游客对目的地的兴趣（Ioannidis\
  \ & Kontis, 2023）。通过利用元宇宙，旅游目的地增强了其营销实践，为向潜在游客传递信任感奠定了基础。这些优势促使目的地和企业的业务及管理模式发生了重大转变（Koo\
  \ et al., 2023）。值得注意的是，据报道，元宇宙中的用户满意度（特别是在智能旅游目的地）很高（Suanpang et al., 2022）。此外，将元宇宙纳入减少目的地过度旅游的潜力被强调为一项切实的成果（Kouroupi\
  \ & Metaxas, 2023）。\n\n酒店可以在元宇宙中推广其服务并准备广告。可以为潜在客户设计酒店虚拟之旅，并根据客户画像安排个性化服务。因此，酒店得到了推广，品牌意识也得到了加强（Adel,\
  \ 2023）。Abass and Zohry (2022)指出，酒店使用了元宇宙技术，但客户对此并无感知。Uçgun 和Şahin (2023) 表示，使用元宇宙将影响旅游业的传统结构。在同一项研究中，解释了元宇宙既有积极贡献也有消极影响。元宇宙的积极方面是它改进了销售和营销活动，为弱势群体参与旅游活动创造了机会并在旅游领域创造了新的就业机会。在元宇宙的负面方面，则强调了法律和个人方面的关注（Uçgun\
  \ & Şahin, 2023）。元宇宙也可以用于博物馆。博物馆可以利用元宇宙创建虚拟展览，游客可以以更不同且更令人印象深刻的方式体验艺术品（Wei, 2023）。\n\
  \n## 旅行社的数字化转型\n\n数智化的飞速发展正为人们的生活方式、经济和社会带来重大的变革。研究表明，自动化和人工智能技术的发展和演进势头将加强，预计将一直持续到\
  \ 2030 年（Samaan, 2021）。同时，Google Travel 的一项研究显示，74%的游客利用数字媒体进行行程规划。因此，这些转变预计将影响消费选择以及各行业采用的业务模式和营销策略（Nevmerzhitskaya,\
  \ 2013）。\n\n这种范式转移由“数字化转型”的概念概括，其定义为业务模式和流程的重组，并增加对技术计划的投入，以为客户和员工创造新价值（Solis, 2020）。这些发展强调了业务模式变革的不可避免性，促使企业根据数字化转型的要求使其流程焕发生机。\n\
  \n世界经济论坛（2020）和埃森哲（2018）强调，旅游业是全球数字化转型中适应速度最快、最活跃的行业。这种观点得到了 Buhalis and Law (2008)的强化，他们在研究旅游业务中的技术整合时断言，旅游业领域的技术采纳速度超过了其他行业。因此，在以快速且动态的数字化转型体验为特征的旅游部门，旅游企业整合数字战略已成为必然要求。这确保了竞争优势，并作为有效整合数字化转型举措以增强客户满意度和推动收入增长的手段。\n\
  \n旅行社是旅游业的基础支柱，构成了一个受持续数字化转型浪潮深度影响的复杂服务网络。在旅行社领域进行的数字化调查得出的见解显示，70%的旅行社预计通过数字化和技术投资，将对旅游业和业务成果产生非常积极的贡献。此外，高达\
  \ 73%的受访者强调了数字化对于在竞争激烈的市场中建立独特地位的不可缺性。值得注意的是，在线旅行社（OTA）将其营销预算的大部分（特别是 73%）分配给了数字营销策略（TÜRSAB,\
  \ 2019）。这些数据强调了数字化转型在塑造旅行社发展轨迹方面扮演的核心作用。\n\n人工智能和聊天机器人的引入是增强整个旅程个性化假期规划和客户支持的关键进展。一个值得注意的例子是\
  \ `Hello Hipmunk`，这是一个利用日历和电子邮件数据提供定制化建议的虚拟旅行社。另一个案例是 Thomas Cook 之前的服务 Cook-Jem，它提供通过聊天机器人进行旅行规划、假期期间的持续客户支持以及特定目的地的建议。此外，Thomas\
  \ Cook 将客户信息分析无缝整合到其销售策略中（TÜRSAB, 2019）。这些说明说明了旅行社不断演变的格局，展示了如何整合创新技术来提升客户体验和运营效率。\n\
  \n\n\n\n数字化对各行业的广泛影响导致了评估特定行业数字化转型的研究数量日益激增。在这方面，一项显著的贡献来自 Perelygina 等人 (2022)，他们深入研究了旅游业内的数字业务模式。他们的研究系统全面地对旅游业内的各种数字业务配置进行了分类，阐明了广泛的价值驱动因素。研究对包括在线旅行社、潜在客户生成和在线旅游市场平台在内的数字业务模式示例进行了系统分类，并对样本公司进行了调查。另一项值得关注的研究侧重于从旅行社的角度评估创新采纳过程。该研究探索了旅行社对多功能平台的采用和利用。研究结果显示，旅行社倾向于采用简单、快速且成本效益的多功能平台，这使他们能够在不干扰现有常规和操作的情况下无缝实现业务模式的数字化\
  \ (Aamir 等人, 2023)）。这些研究为旅游业不断演变的数字化转型格局提供了宝贵的见解。\n\nAboushouk 和 Elsawy (2020) 研究了用户生成的内容如何促进埃及旅行社的数字化转型。结果显示，用户生成的数字内容对埃及旅行社的数字化转型具有微弱的正向影响。Liyushiana\
  \ 等人 (2022) 从旅行社的角度研究了旅游业的数字化转型。研究结果显示，旅行社的数字化与组织文化、技术使用和流程密切相关。基于这一结果，研究强调了技术-组织-环境框架在数字化转型过程中的应用。Chang\
  \ 等人 (2021) 也开展了类似的研究。研究人员研究了台湾的旅行社，以识别数字化转型中的关键成功因素。结果是，他们利用技术-组织-环境-文化维度开发了数字化转型的影响维度和因素，并为旅游业数字化转型的影响因素创建了一个初步框架。\n\
  \n# 本章主要重点\n\n## 研究方法\n\n正如文献部分提供的信息所示，元宇宙（Metaverse）对旅游业利益相关者有若干影响。可以看出，旅游业的企业（如酒店和旅行社）可以将元宇宙作为数字资源来提供优质服务、说服客户并推广自己。然而，关于元宇宙对旅行社及其客户潜在影响的研究仍然有限。本研究旨在填补这一研究空白。本研究全面考察了从旅行社员工角度对元宇宙的印象，以及元宇宙对旅行社和客户的影响。\n\
  \n本研究采用了定性研究方法，因为有必要对旅行社员工关于元宇宙的观点收集深层次的见解。定性研究方法能够全面地探索个人对特定主题的思考（Creswell, 2013）。本研究选择的方法是在定性框架内应用半结构化访谈技术，用以征取旅行社员工对元宇宙的观点。半结构化访谈格式从研究者预定义的问题开始，并根据参与者的回答有机展开（Brinkmann,\
  \ 2014）。为了促进这一过程，严地设计了一份访谈表。\n\n访谈表包含五个人口统计学问题和八个用于了解参与者对元宇宙想法的问题。这些问题的灵感来自 Buhalis\
  \ 等人 (2022)的研究，旨在了解旅行社员工对元宇宙的意见。第一个问题用于确定员工对元宇宙的总体印象和想法。第 2-4 题用于确定元宇宙对旅行社运行可能的影响。第\
  \ 5-6 题旨在了解元宇宙对旅行社客户可能的影响。第 7-8 题设计用于确定元宇宙在旅行社中的未来。访谈表中的问题如下：\n\n* 1. 您如何评价旅游业中的元宇宙？您有什么想法？\n\
  * 2. 您对将元宇宙整合到业务流程中有什么想法？\n* 3. 元宇宙如何影响旅行社的业务活动？\n* 4. 元宇宙如何影响旅行社之间的竞争？\n* 5. 元宇宙在多大程度上可以为客户提供丰富的旅行体验？\n\
  * 6. 您认为客户在多大程度上会倾向于使用元宇宙？\n* 7. 您如何评估元宇宙在旅行社中的未来角色？\n* 8. 对于旅行社有效使用元宇宙，您有什么建议？\n\
  \n## 样本与数据收集\n\n本研究采用了目的抽样。在目的抽样中，在特定研究标准的范围选择选择参与者至关重要（Bernard, 2017）。在本研究中，选择参与者有一些标准。首先，纳入研究的参与者是某于安塔利亚（Antalya）持续经营并在土耳其多个领域开展活动的旅行社员工。将这些员工纳入研究的另一个标准是他们了解元宇宙。研究不包括没有听过元宇宙且不知道它是什么的员工。在这些标准下，对七位旅行社员工进行了访谈。\n\
  \n在定性研究方法中，当访谈出现不可避免的重复时，不需要增加参与者人数，研究者会意识到已经达到了数据饱和（Miles & Huberman, 1994）。Marshall\
  \ (1996) 指，当参与者的回答变得重复时，访谈应当结束。Creswell (2013) 解释说 5-25 名参与者对于访谈是足够的。基于这些信息，与 7\
  \ 位参与者完成了访谈。\n\n访谈于 2023.12.27 至 2024.01.21 期间根据参与者和研究者的方便时间进行。访谈平均时长为 23 分钟。访谈开始前，已告知参与者研究课题。访谈结束后，将录音转录为文本。\n\
  \n\n\n\n参与者的人口统计学特征如表 1 所示。参与者中有四名男性，三名女性。参与者的年龄范围在 21-28 岁之间。参与者具有本科或研究生学历。参与者的工作年限在\
  \ 3-6 年之间。访谈持续时间在 15-30 分钟之间。\n\n### 表 1.参与者的人口统计学特征\n\n| 参与者 | 性别 | 年龄 | 教育程度 |\
  \ 工作年限 | 访谈时间 |\n| --- | --- | --- | --- | --- | --- |\n| P1 | 男性 | 26 | 本科 | 3\
  \ 年 | 20 分钟 |\n| P2 | 男性 | 27 | 研究生 | 4 年 | 25 分钟 |\n| P3 | 女性 | 27 | 本科 | 5 年 |\
  \ 30 分钟 |\n| P4 | 男性 | 21 | 本科 | 3 年 | 23 分钟 |\n| P5 | 男性 | 27 | 本科 | 6 年 | 15 分钟\
  \ |\n| P6 | 女性 | 26 | 研究生 | 5 年 | 25 分钟 |\n| P7 | 女性 | 28 | 博士 | 3 年 | 26 分钟 |\n\
  \n## 结果\n\n通过对参与者提供的回复进行分析，研究中确定了四个主要主题。这些主要主题是：关于元宇宙的思考、元宇宙对旅行社的潜在影响、元宇宙对客户的潜在影响以及元宇宙在旅行社的未来。“关于元宇宙的思考”这一主主题包含了参与者对元宇宙的总体认知以及对其优缺点的思考。表\
  \ 2 显示了与关于元宇宙的思考这一主主题相关的子主题和代码。\n\n### 表 2. 关于元宇宙的思考\n\n| 主主题 | 子主题 | 子代码 |\n| ---\
  \ | --- | --- |\n| 积极观点 | 消极观点 | |\n| 关于元宇宙的总体思考 | 元宇宙的潜在优缺点 | 提供对目的地的便捷访问 | 通过减少物理访问损害当地经济\
  \ |\n| | 降低文化区域密度 | 因其虚构性质影响有限 |\n| | 提供虚拟访问文化遗迹的机会 | |\n| | 提供有关目的地和文化场所的初步信息 |\
  \ |\n\n参与者对旅游业中的元宇宙持有积极态度。`P7` 强调元宇宙在未来将主要用于旅行社。`P7` 表示：“认为随着时间的推移，元宇宙和其他应用将逐渐用于旅行社，并会产生影响。”`P2`\
  \ 认为元宇宙可以为旅游景点提供更广泛的访问途径。`P2` 表示：“例如，我无法去意大利的罗马斗场，但感谢元宇宙，我将能够访问它。”`P1` 认为通过元宇宙可以降低文化区域的密度。`P1`\
  \ 说：“例如，我们可以参加世界另一端的现场活动，或者坐在座位上参观历史文化遗迹。在这种情况下，文化区域的密度将会降低。”文中还提到元宇宙将使克服旅行障碍和提供先知识变得更容易。`P4`\
  \ 说：“未来，由于元宇宙中利用人工智能创建了文化区域，将有可能去这些地方。在先验知识方面将会好得多。”\n\n另一方面，持消极态的参与者担心元宇宙可能会通过减少物理旅行来损害当地经济。`P1`\
  \ 表示：“降低文化区域的密度可以是一个消面情况，也可以是一个积极情况。在消面意义上，由于对地点的虚拟访问，对人员的需求可能会消除，这些地区好奇心可能会消失。”此外，那些认为元宇宙更多像是一个虚构过程的人表示，其影响是有限的，且只能在销售阶段发挥作用。`P5`\
  \ 说：“我认为这更多是一个虚构过程。它在未来可以用于在销售阶段说服人们关于他们将要访问和看到的地方。”支持这一观点的参与者认为，元宇宙在本土市场尚未开放开发，并表示未来可以考虑整合元宇宙等技术。`P6`\
  \ 表示：“旅游业是一个不断演变的市场，但从我的观察来看，它并不是一个开放开发的市场，至少在国内市场是如此。”\n\n“元宇宙对旅行社的潜在影响”这一主主题描述了元宇宙将对旅行社产生何种影响。与主主题相关的子主题和代码如表\
  \ 3 所示。\n\n### 表 3.元宇宙对旅行社的潜在影响\n\n| 主主题 | 子主题 | 子代码 |\n| --- | --- | --- |\n| 积极观点\
  \ | 消极观点 | |\n| 元宇宙对旅行社的潜在影响 | 元宇宙整合领域 | 旅游计划 | 由于缺乏基础设施而难以整合 |\n| | 目的地推广 | | |\n\
  | | 销售和营销流程 | | |\n| | 元宇宙对业务运营的影响 | 可以增加销售 | 可以减少销售 |\n| | 客户说服时间可能更短 | | |\n|\
  \ 元宇宙对竞争的影响 | 使用元宇宙的旅行社可以获得竞争优势 | - |\n\n大多数参与者认为，元宇宙可以无缝地整合到旅行社的运营中。`P2` 设想通过展示旅游计划和通过元宇宙向客户介绍目的地来增加预订量。`P2`\
  \ 强调：“应该确保他们通过元宇宙预览他们将要访问的地方。如果能够整合，说服力将增强，并观察到订单量的增加。”`P3`、`P5` 和 `P7` 提出元宇宙可以在销售和营销中发挥作用。`P3`\
  \ 断言道：“我相信它可以整合到销售阶段。在在线旅游或预订期间，人们可以获得对他们将要访问的体验预览。”相反，`P1` 认为由于缺乏必要的基础设施，目前元宇宙是不行的，`P1`\
  \ 说：“未来可以整合。因为我认为我们现在还没有这样的基础设施。”\n\n除了 `P4` 之外，大多数参与者认为元宇宙对旅行社的业务活动有积极贡献。这些积极贡献包括增加销售。例如，`P5`\
  \ 认为元宇宙将增加可视化，从而增加销售。`P5` 表示：“它有积极影响。因为访问地、酒店和目的地将以视觉方式传达。”同样，`P6` 也认为销售将会增加。`P6`\
  \ 表示：“它可以提供身临其境的感觉，销售阶段可以更短。客户说服率将提高。同时，将观察到机构预订量的增加。”\n\n`P4` 认为元宇宙可能会负面影响业务活动。他认为元宇宙可能会严重损害一对一的关系，并声称虚拟环境不会影响人类的情感。他甚至强调使用元宇宙会导致销售减少。`P4`\
  \ 表示：“它会严重影响一对一的关系，因为人类是情感的。虚拟环境的面试和旅行将是有效的，这可能导致销售下降。”\n\n\n\n\n\n根据参与者的共同观点，使用元宇宙的旅行社将获得竞争优势。通过使用元宇宙，旅行社可以给客户留下第一印象，建立信任感并详细展示目的地。通过这种方式，旅行社可以提高客户的满意度。P2\
  \ 表示：“使用元宇宙的旅行社和不使用元宇宙的旅行社之间会有巨大的差异。提供第一印象是非常重要的，因为作为人类，我们希望看到并感到安全。看到我将要去去的地方会吸引我前往那里。”特别是对于那些每年只能休有限假期的人来说，通过虚拟宇宙访问和查看目的地可以帮助他们使度假计划更具针对性。这可能会吸引旅行社的注意，因为它有助于提高客户的效率。P1\
  \ 表示：“它创造了竞争优势。例如，我在安塔利亚，想去中国旅游。可以通过虚拟宇宙访问并看到那个地方；因此，当我去那里时，我可以毫无困难地进行度假/旅行。我可以预知会有什么或什么样的形象在等着我。”使用元宇宙的旅行社可以分享更多的视觉信息，并通过有效的广告策略创造吸引力。这可以增加预订，并使旅行社在收入和广告方面脱颖而出。P5\
  \ 表示：“使用它的人将比不使用的人处于更有优势的地位。具体来说，由于视觉上会有更多信息共享，如果广告得当，就会产生吸引力。”\n\n## 元宇宙对客户的潜在影响\n\
  \n元宇宙对客户的潜在影响的主题是指元宇宙如何改变客户的期望和偏好。与主主题相关的子主题和代码见表 4 。\n\n### 表 4. 元宇宙对客户的潜在影响\n\n\
  | 主题 | 子主题 | 子代码 |\n| --- | --- | --- |\n| 积极观点 | 消极观点 | |\n| 元宇宙对客户的潜在影响 | 客户的旅游体验\
  \ | 旅游体验将增加 | 旅游体验可能不会根据客户特征改变 |\n| 客户对元宇宙的使用 | 了解元宇宙的客户将使用 | 中年及以上客户可能不会使用 |\n\n\
  参与者认为，元宇宙具有为客户提供丰富内容旅游体验的潜力，但他们强调了考虑客户特征的重要性。提供最新的技术专业知识可能会带来满意度，特别是对于新一代人。然而，对于具有丰富旅游经验和特定偏好的个人来说，元宇宙的影响可能是有限的。主要是具有成熟既定偏好的客户可能不会以积极的观点看待元宇宙。P6\
  \ 表示：“我认为这种情况是相对的。例如，即使我喜欢数字媒体，我也想去访问并感受那个地区。但有些人有不同的想法。但从我工作的旅行社来看，我们针对的群体中，大多数中年人倾向于去实地看一看那个地方。”同样，P5\
  \ 表示：“我可以说它可以提供部分的旅游体验。这个问题是相对的。它可能会根据客户和他们的偏好而异。”\n\nP2 表示，元宇宙将为客户提供良好的旅游体验。强调的是，得益于元宇宙，可以提前体验旅游地并解决任何问题，从而丰富旅游体验。P2\
  \ 表示：“例如，当我现在想去某个地方时，只知道目的地的名称，但通过元宇宙的 360 度视图看到它，我将以有计划、程序化的出发，就像在出发之前去过那里一样。换句话说，我将有一次内容丰富的旅行。元宇宙将为旅行社和客户提供很多便利。”\n\
  \n参与者表示，了解元宇宙或对元宇宙好奇的人更有可能在假期期间使用元宇宙。P7 说：“认为对元宇宙有预先知识的客户会使用，但其他人需要时间来使用。”P4-P6\
  \ 等参与者表示，客户将使用元宇宙，但那些使用它的人是少数。P4 表示：“某些群体会使用它，我认为这种群体是少数。人们会使用它，但那些使用它的人是少数。最简单的例子是，我们可以在虚拟环境中旅游、旅游并感受其中的风。”\n\
  \nP2 强调客户将频繁使用元宇宙。P2 表示：“让我们看看安塔利亚的花卉节。我从未去过那里，但通过元宇宙可以看到它。在筛选过程中，我们将访问那些目的地和市场，因为我们在去之前就已经体验了。有时，我们会去餐厅并感到遗憾，所以我们不太可能出错。由于这个原因，我认为它受到高度推崇。”\n\
  \n客户的代际也被认为是使用元宇宙的影响因素。P3 指出，年龄较大且有习惯的客户倾向于不使用元宇宙。P3 表示：“我认为极少数中年和老年客户会偏好元宇宙。对于老年人的旅游偏好和选择过程这很难。例如，虽然现在可以通过网站或呼叫中心预订，但老年人仍然会根据他们展示的图片（电脑）来选择酒店。”\n\
  \n## 旅行社元宇宙的未来\n\n旅行社元宇宙的未来主题涉及元宇宙在未来旅行社中的地位。与主主题相关的子主题和代码见表 5 。\n\n### 表 5. 旅行社元宇宙的未来\n\
  \n| 主题 | 子主题 | 子代码 |\n| --- | --- | --- |\n| 积极观点 | 消极观点 | |\n| 旅行社元宇宙的未来 | 元宇宙未来的角色和用途\
  \ | 可以改变业务模式 | 元宇宙的使用将保持有限 |\n| 可以创建新部门 | | |\n| 旅行社青睐 | | |\n| 对旅行社的元宇宙建议 | 应该建立元宇宙团队\
  \ | |\n| 应该培训员工 | | |\n| 应该进行计划 | | |\n| 内容应该保持更新 | | |\n\nP2、P3、P5 和 P7 等参与者表示，未来旅行社将频繁使用元宇宙。甚至声称，由于元宇宙的使用，旅行社的业务模式将改变，并创建新的部门。P2\
  \ 表示：“它将改变旅行社经营业务。”P3 表示：“可以说这是我们不可避免的终结。也许未来我们不再被需要了。这可能会导致失业。当然，会开启不同的业务线，但那是为了那些更懂技术的人的。如果能有效地使用，可以在行业内取得突破，并将其作为一种旅游类型进行推广。”\n\
  \n\n\n\n根据 `P4` 和 `P6` 的观点，元宇宙在旅行社中的应用未来将受到限制。P6 表示：“它可以被用于销售和营销阶段。我不认为它可以在运营和规划阶段被利用。”P1\
  \ 则认为，现在对元宇宙在旅行社中的未来用途做出任何确定性陈述都为时过早了。P1 说：“现在回答这个问题是非常错误的。这是一个很新颖的问题，因为元宇宙仍然处于开发阶段，尚未与旅游业整合。”\n\
  \n关于旅行社需要做什么才能有效且成功地使用元宇宙，参与者强调了建立新团队、培训人员、规划以及保持元宇宙内容的实时更新。P1 强调了需要一个专门团队来使用元宇宙。P1\
  \ 说：“应该成立一个团队，并应该有人专门处理此事务，更新软件并检查新地点。”P3 认为员工应该接受培训并熟悉元宇宙。P3 表示：“首先，应该对使用它的人员进行培训。”P3\
  \ 陈述道。P7 建议旅行社应该首先规划元宇宙的使用，然后完成员工培训。P7 表示：“旅行社应该首先计划使用元宇宙和其他人工智能应用。然后员工培训就非常重要了。”P5\
  \ 强调应该由一个团队处理元宇宙，并且内容应该更新。P5 说：“此类应用的及时性应该得到良好控制。任何不准确都意味着给客户提供了错误信息，这将导致客户的不满意和流失。”\n\
  \n# 解决方案与建议\n\n在阐述对元宇宙的整体观点时，旅行社员工深入探讨了这项新兴技术的优缺点。参与者强调，元宇宙的优势包括便利到达目的地、缓解文化区域的拥堵、为文化遗迹提供虚拟游览的机会，以及提供有关预定地点的初步信息。在缺点方面，强调了两个主要担忧：元宇宙导致实体访问减少，从而给当地社区带来经济损失；以及由于其虚构性质导致产生的影响有限。尽管旅行社员工提到了许多优点，例如增强目的地的可访问性、虚拟探索、容量管理以及获取访问地点的预先信息，但\
  \ Tayfun 等人 (2022) 在其研究中强调，元宇宙技术的采用构成了潜在威胁。这些威胁涵盖了旅游业的就业问题、收入下降、企业适应技术进步的困境以及安全漏洞。\n\
  \n另一方面，Demir (2022) 从酒店行业角度研究了元宇宙技术，发现这项技术能够实现收入增长、品牌忠诚度和个人游客体验。从这些研究中可以看出，元宇宙可以增加收入，但也可能导致该领域的经济损失。在本研究范围内，由于旅行社员工表示，由于元宇宙技术导致前往旅游目的地的旅行减少，旅游地区的预期收入将下降，因此可以看出研究结果既支持也反对文献中的这一缺点观点。\n\
  \n在关于元宇宙技术对旅行社潜在影响的观点上，旅行社员工表示元宇宙可以为旅行社提供竞争优势。因此，使用元宇宙技术的旅行社可能会在竞争对手企业中获得竞争优势。Gursoy\
  \ 等人 (2023) 的研究也发现了与这一判断相似的结果。作者们发现，元宇宙技术为运营旅游业的企业有效地创造了可持续的竞争优势。在本研究范围内，旅行社员工得出结论，认为元宇宙可以缩短说服客户的过程，从而增加旅行社的销售额。同样，Ercan\
  \ (2022) 发现，通过元宇宙技术，旅游企业从虚拟游览、活动和旅游产品销售获得了额外收入。\n\nThapa (2023) 认为元宇宙技术为增强旅游和酒店业的营销工作提供了重大机会。此外，Uçgun\
  \ 和 Şahin (2023) 强调了元宇宙在提升销售和营销活动方面的潜力，表明这项技术在这些领域发挥着实质性作用。在研究背景下，观察到元宇宙在旅行社的销售和营销活动中提供了优势。因此，可以认为元宇宙在销售和盈利方面对旅行社产生了积极影响。尽管如此，对于元宇宙技术对旅行社的潜在负面影响仍存在担忧，特别是销售下降的形式。这可能归因于一些旅行社在适应旅游业元宇宙技术时面临的挑战。\n\
  \n旅行社员工在回答元宇宙技术对客户潜在影响的问题时表示，元宇宙将提供一种旅行体验。在研究范围内获得的类似结果可见于 Kaya 等人 (2022) 进行的研究中。在他们的研究中，作者表示元宇宙技术通过提供虚拟旅行和虚拟酒店游览丰富了旅游消费者的旅行体验。因此，使用元宇宙的旅游消费者可以在不需要实地访问的情况下进行虚拟旅行。此外，游客可以先通过元宇宙体验目的地，然后再进行实地访问。在这两种情况下，可以说元宇宙丰富了旅行体验。\n\
  \n本研究的另一个发现是，元宇宙技术提供了旅行体验，但这种体验是由客户群体决定的。显示，特别是中年和老年客户群体在使用元宇宙技术方面存在困难。与这一判断相似，Ağaoğlu\
  \ 等人 (2022) 表示，对技术适应了解较少的老年群体在使用元宇宙方面可能会遇到困难。旅行社员工也表示，只有在该领域拥有知识的人才能使用元宇宙技术，中年和老年人使用这项技术将很困难。因此，Ağaoğlu\
  \ 等人 (2022) 的发现与本研究的结果在这方面是一致的。\n\n\n\n旅行社员工提到了元宇宙（Metaverse）未来的作用，并建议旅行社使用这项技术。他们表示，随着元宇宙技术的发展，业务模式可能会发生变化，可能会形成新的部门，许多旅行社可能会倾向于使用这种技术。Volchek\
  \ and Brysch (2023)得出结论，元宇宙技术与旅游业在概念上是兼容的。从这个角度来看，元宇宙和旅游可以整合。正如旅行社员工提到的，随着这两个概念的兼容，可能会出现新的业务模式和部门。此外，Buhalis\
  \ et al. (2023)](979-8-3693-5868-9.ch012.xhtml#r8)指出，元宇宙是一项在未来营销方面将彻底改变旅行和旅游管理的技术。因此，在本研究范围内，旅行社员工表示许多旅行社未来将倾向于使用元宇宙，这一事实与\
  \ Buhalis et al. (2023) 出的判断相一致。\n\n在本研究范围内，旅行社员工对旅行社提出了建议，认为在企业中应该建立元宇宙团队，重视员工培训和规划，并保持虚拟内容的更新。Koo\
  \ et al. (2023)指出，体验元宇宙技术的游客可能会有更现实的预期，而且元宇宙在创意经济中提供了新的业务模式。此时，在旅行社中聘用专业的元宇宙团队、培训员工、规划元宇宙的进一步发展并保持元宇宙内容的更新是关重要的。当这些努力得以实现时，游客可能对元宇宙体验感到更加满意。此外，可以说作为所有这些努力的结果，旅行社可能会建立新的业务部门，这可能为业务和员工带来经济贡献。\n\
  \n## 理论意义\n\n从本研究文献部分的信息可以理解，元宇宙对运营旅游部门的利益相关者有若干影响。值得注意的是，运营旅游部门的酒店和旅行社等旅游企业可以应用元宇宙技术来优先考虑服务质量、说服旅游消费者并将其作为促销活动中的数字资源。然而，目前发现关于元宇宙对旅行社及其客户潜在影响的研究非常有限。本研究旨在填补相关文献中的这一空白。本研究从旅行社员工的角度对对元宇宙技术的印象，以及元宇宙对旅行社和客户的影响进行了全面概述。该研究清楚地揭示了元宇宙对旅行社和客户的影响。\n\
  \n本研究涵盖了从相关文献得出的四个主要主题的发现。首先，旅行社员工对元宇宙的潜在优缺点表达了意见。他们强调了优点，包括方便到达目的地、缓解文化区域的拥堵、实现文化遗迹的虚拟游览以及提供有关目的地的初步信息。相反，他们注意到了元宇宙的缺点是减少对目的地的实地访问，可能对当地经济造成损害，并由于其虚构性质导致影响有限。其次，旅行社员工评估了元宇宙对旅行社的潜在影响。在此背景下，他们对元宇宙在展示旅游计划、推广目的地、增强销售和营销流程、提高销量、加速客户说服以及为利用该技术的代理机构提供竞争优势的能力表达了积极看法。\n\
  \n旅行社员工在本节中表达的负面观点是，由于缺乏基础设施，元宇宙的整合非常复杂，并且具有减少销量的潜力。第三，旅行社员工揭示了元宇宙对客户的潜在影响。在本节中，旅行社员工表达了积极意见，认为游客的旅行体验将会增加，了解元宇宙的客户将使用这项技术。旅行社员工的负面观点是，旅行体验可能会根据游客的特征发生变化，中老年人可能无法成功使用元宇宙技术。最后，旅行社员工评估了元宇宙技术在旅行社未来。本节提到元宇宙技术的未来作用和用途。他们对元宇宙持积极态度，认为这项技术可以改变业务模式，创建新部门并受到机构欢迎。然而，他们也持负面观点，认为元宇宙的使用可能仍然有限。在相关章节，还看到建议在旅行社中建立元宇宙团队、培训人员、规划元宇宙的使用并保持元宇宙内容的更新。\n\
  \n## 实践意义\n\n本研究对相关文献提供了几项实践贡献。首先，看到通过展示元宇宙旅游计划的预告片向客户推广目的地，加速了销售和营销流程。这可能会缩短客户说服过程并增加销量。因此，使用元宇宙可以被认为是旅行社提高收入和收益盈利能力的关键因素。其次，元宇宙在旅行社之间提供了竞争优势。由于这种情况，旅行社可以通过使用元宇宙在品牌和声誉方面领先于竞争对手。结果，使用元宇宙技术的旅行社可以在旅游行业中获得认可。第三，元宇宙技术为客户的旅行体验做出贡献。因此，运营元宇宙的旅行社应该丰富这项技术的内容。\n\
  \n元宇宙的成功整合可以将旅行社定位为旅游业的先驱，为那些能够有效利用元宇宙技术的人创造意识并建立独特的身份认同。旅行社员工提供的建议强调了建立专门的元宇宙团队、对员工进行培训计划、制定正确使用元宇宙的策略以及确保元宇宙内容持续更新重要性。实现这些条件可以显著有助于旅行社的成功。这些贡献包括通过聘用元宇宙领域的专业人员来正确执行任务、通过完善的规划积极识别并解决潜在问题、通过经过培训的员工维持组织卓越，以及不断改进元宇宙技术以在旅行社领域取得成功。本研究的发现为旅行社和行业人士提供了宝贵的见解，强调了运营发展的性以及元宇宙技术在这一持续过程中的关键作用。\n\
  \n## 未来研究方向\n\n\n\n\n本研究采用了定性研究方法，因此所提供的见解是基于受访者的陈述。未来的研究可以利用定量研究方法对该主题进行探索，以补充和扩展定性发现。此外，本研究重点关注位于安塔利亚（Antalya）目的地的旅行社员工。后续研究可以通过纳入不同目的地的员工来增加发现的广度。此外，本研究专门针对旅行社员工。未来的研究计划可以通过纳入旅游业内不同部门的员工来扩大范围。这种包容性方法可以更全面地理解元宇宙（Metaverse）技术在旅游业不同层面的广泛影响。\n\
  \n## 结论\n\n旅行社应该考虑将元宇宙作为影响其财务成功的决定性因素。利用 `Metaverse` 可以为旅行社提供竞争优势，推动其在行业内发展。利用元宇宙技术对业务运营的积极影响，能够快速说服客户并提高销售额。此外，将\
  \ `Metaverse` 整合到销售和营销活动、目的地推广和旅游计划中可以是一种战略性方法。实施这些 `strategies` 可能会让利用 `Metaverse`\
  \ 的旅行社在行业中获得丰厚利润，并将自己定位为财务成功的实体。\n\n旅行社员工表示，使用 `Metaverse` 对客户有显著的积极影响。虽然 `Metaverse`\
  \ 在盈利、声誉、品牌和财务成功方面可以为旅行社做出贡献，但也可以为客户做出贡献。这些贡献体现在客户的旅游体验以及对 `Metaverse` 的深度了解上。此外，发现拥有\
  \ `Metaverse` 技术的旅行社未来可以改变其业务模式，并设立新的业务部门。这可能使旅行社使用符合时代需求的技术，因此他们可以在业务活动中有效应用 `Metaverse`。此外，专业性、培训、规划和及时性等因素也被认为对\
  \ `Metaverse` 的发展至关重要。这些因素可以被视为旅行社员工对企业关于 `Metaverse` 的建议主题。\n\n为了提供全面的评估，参与者普遍对\
  \ `Metaverse` 了积极观点。然而，也存在负面意见，例如担心元宇宙技术可能因减少实体访问而对当地经济产生负面影响、由于其虚拟性质导致的影响有限、由于基础设施差距带来的整合挑战、潜在的销售额减少，以及中老年和老年人在适应这项技术时面临的困难。旅行社未来有机会加强对\
  \ `Metaverse` 的使用，并致力于确保所有年龄段的人都能触及。例如，考虑到中老年和老年人在使用 `Metaverse` 时面临的挑战，可以为这一年龄段组织关于\
  \ `Metaverse` 的信息性讨论或培训课程。因此，在数字时代，应该努力确保所有年龄段的个人都能有效使用 `Metaverse` 而不会遇到困难。\n\n\
