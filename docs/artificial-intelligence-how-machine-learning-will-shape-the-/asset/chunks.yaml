- raw: 'One key early development was the adoption of an old idea that would – after
    then dropping out of fashion again – come to define the modern age of artificial
    intelligence: neural networks. In the early 1940s, scientists had created the
    first mathematical models of neurons – the building blocks of the brain, which
    use electrical impulses and chemical signals to carry signals across the brain
    and throughout the body’s nervous system – and set up electrical circuits to mimic
    them. In 1958, in the wake of the Dartmouth College meeting, and with funding
    from the US Office of Naval Research, the American psychologist Frank Rosenblatt
    built the first trainable artificial neural network. Dubbed Perceptron, and operating
    inside a room-sized machine of the same name, it involved an algorithm that could
    learn to recognise patterns and shapes presented to it.


    Today’s neural networks are much faster and more sophisticated than Perceptron,
    and each will be tailored differently to undertake a particular task, but many
    of the basic underlying principles remain much the same. Essentially, neural networks
    are a way of doing machine learning, whereby a computer learns by being exposed
    to previous examples of the task it’s trying to complete, and thus eventually
    receiving all the information needed to replicate that task. For example, a neural
    network that’s being developed to recognise pushbikes in photographs will be taught
    what pushbikes look like by being shown hundreds, even thousands, of images of
    pushbikes, each of which is labelled to say it’s a pushbike. (Obviously when a
    machine ‘sees’ an image, it is not viewing it in the same way we would: what it
    sees is strings of numbers into which the photo and accompanying text have been
    broken down.) If the training process is successful the algorithm will then be
    able to identify bikes in photos it has not ‘seen’ before. Generally the more
    examples it is trained with (which of course adds more time and cost to the process),
    the more accurate its results. Following the same principle, other neural networks
    analyse vast quantities of numerical data in order to create new images, make
    predictions, translate languages, control self-driving vehicles and discover new
    drugs. Neural networks have found planets. They’ve made music and art. And all
    this is just the tip of the iceberg.


    These systems are loosely modelled on the structure of the brain, with interconnecting
    neural nets comprising data-processing nodes in their thousands or millions, serving
    the same function as neurons. The Perceptron machine used only one layer of nodes,
    but modern systems can have multiple layers – in some cases up to fifty – that
    pass data through them. In neural networks with multiple layers, each of these
    layers has its own capabilities and can be trained to recognise different features.
    Such systems are now commonly called deep neural networks, and it’s these that
    have contributed to many of the artificial intelligence developments achieved
    over the last two decades.


    Broadly speaking, there are three types of layers in neural networks: an input
    layer, hidden layers and an output layer. The input layer is where information
    is fed into the neural network. The hidden layers do all the computer-processing
    (complex neural networks will have a large number of these). The output layer
    yields the final result. Nodes within each layer are connected to one another
    – there may be billions of connections in a large neural net system – and are
    all given numbers, known as weightings. (The weightings control how strong the
    connections between two nodes are, and so have an impact on the output.) Weightings
    are altered throughout the training process so that the final outputs are consistent
    and produce the results the creators of the system desire.


    Rosenblatt’s neural network could complete some very basic tasks, but because
    it used only one layer of nodes and a relatively simplistic weighting system its
    capabilities were severely limited. That’s not how people at the time saw the
    Perceptron, though. At the end of July 1958, when the *New York Times* reported
    that the Perceptron could differentiate between left and right after just fifty
    training attempts, it went on to claim that the ‘embryo’ of a computer could one
    day be expected to ‘walk, talk, see, write, reproduce itself and be conscious
    of its existence’.


    The technical limitations of the first neural networks were laid bare in 1969,
