  trans: '


    Buolamwini 等人开创性工作所产生的涟漪将在未来几年内扩散开来，因为立法者和监管机构都在努力应对 AI 带来的问题。特别是，需要认识到持续结构化审计（如
    Buolamwini 所进行的那种）是必不可少的。它不仅能带来更好的系统，还能迫使人们思考这些系统是如何被使用的，以及是否应该使用。


    目前，关于 AI 应用的不确定性非常普遍。“目前我们无法说英国哪些地方当局正在使用算法决策系统来指导儿童社会护理的优先级排序，”Jenny Brennan
    表示，她是 Ada Lovelace Institute 的 AI 政策研究员和软件工程师。“很明显的是，我们确实需要让监管机构检查算法系统的方式。”同样的不确定性和检查需求也存在于其他使用
    AI 的领域，不仅在英国，而且遍及全球。


    在阿姆斯特丹和赫尔辛基，城市当局已开始通过为城市部门使用的 AI 引入登记册来解决缺乏透明度的问题，阿姆斯特丹算法登记册的项目经理 Linda van de
    Fliert 表示。


    就 Jenny Brennan 而言，她指出了两种评估 AI 系统的方法，这些系统要么正在使用，要么正在考虑中。一种是算法审计，包括偏差审计和监管检查。另一种是算法影响评估，可能包括在
    AI 使用前或使用后考虑其社会影响。然而，她的研究得出结论，在清楚这些系统在实践中最佳版本究竟是什么样子之前，还有很长的路要走。


    “关于何时使用算法决策缺乏清晰度，通常也没有办法让人们真正比较情况，看看是否存在偏见或任何此类问题的证据，”Alice Xiang 表示，她是 Partnership
    on AI 的公平、透明度和问责制研究负责人。该组织是一个研究机构，得到包括 Apple、Amazon、Google、Microsoft、Samsung 和
    IBM 在内的 100 多个团体的支持。“在用于训练算法的数据的专有性质以及算法本身的专有性质方面，存在很多限制。”


    Xiang 表示，AI 决策目前的不透明性使得人们更难反对它们。诚然，当 Apple 的算法似乎表现出偏见，向男性和女性提供不同的信用额度时，美国曾出现过针对
    Apple 信用卡发布的显著反对，但这种反应很少见。“当你有，比如说，数百万用户受到影响时，即使只是一小群人聚在一起互相交流和比较情况，那也不一定是开展诉讼的真正好证据，而且即使这样也很少发生。”


    关于谁应该负责审计和评估存在分歧。已经制定了数十个 AI 伦理团体和指南，但其中许多缺乏实际权力。（2020 年 8 月，一个罕见的主动案例中，英国警察伦理委员会阻止了有缺陷的
    AI 的开发和部署，该 AI 本应预测某人是否会犯下暴力犯罪。


    2020 年 7 月，新西兰政府推出了一套名为算法宪章的标准，并称其为“世界首创”。


    “偏见的来源有很多：个人、结构性、社会性，认为我们可以用一个系统解决所有这些问题似乎很危险，也有点傲慢，”犹他大学计算机学院教授 Suresh Venkatasubramanian
    认为。他说，系统可能带来的每个潜在风险都应该被识别，并且应该逐一对其进行审计。“目标是将危害范围缩小到我们可以真正交付一份有意义的审计的程度，”他解释道，“然后从那里慢慢建立起来。”审计也必须在开发过程的正确阶段进行。“通常，审计风险合规团队是最后被叫来的人，”Rumman
    Chowdhury 表示，她是 Accenture Applied Intelligence 负责任 AI 部门的前负责人，离职后创立了算法审计公司 Parity。“伦理评估不是你只能做一次的事情。在不同阶段会采取某些行动。例如，在产品开发的最后阶段进行数据审计就不合适了。”至关重要的是，任何审计都必须随时间演变，因为会识别出新的问题，或者
    AI 应用中使用的训练数据或算法发生变化。


    在缺乏能够揭示全球范围内使用的 AI 系统中的威胁、歧视和偏见的广泛立法和审计的情况下，Buolamwini 的非营利组织 Algorithmic Justice
    League 正在采取自救措施。在网络安全领域，报告软件缺陷或漏洞的道德黑客可以通过漏洞赏金系统获得报酬。Algorithmic Justice League
    正在从这一过程中学习，开展算法漏洞赏金项目——人们可以披露自己受到 AI 的如何对待，并将进行调查。最终，Buolamwini 认为，要开发出能造福所有人的
    AI，每个人都必须参与其创建。“很容易认为你可能引入技术来解决他人的问题，而不真正将受影响最大的人带入社区。所以 \[它\] 不是为他们设计，而是与他们一起设计。”


    # AI 的未来


    AI 现在已牢固地嵌入我们日常生活的方方面面。在未来几十年里，它将变得更加强大和复杂。它将从在社交网络和科技产品中广泛使用，转变为被企业和社会所使用。


    但是，一些研究人员的终极目标呢：AGI，即人工通用智能？AGI 将代表一项革命性的进步。目前，AI 在某些特定任务上表现优于人类，但取决于你使用哪种定义，AGI
    将能够完美地完成交给它的每一项任务。它在各种实际意义上，可能拥有完全的人类能力。


    对一些人来说，这将是噩梦般的场景。Elon Musk，SpaceX、Tesla 和 Neuralink 的创始人、联合创始人或首席执行官，他因对 AGI 和其他形式的超级智能发表直言不讳的观点而多次与
    AI 社区发生冲突，他认为 AGI 比核武器更危险，并且该技术是“对人类文明存在的根本风险”。他曾警告说，随着快速自动化的发生，AI 网络可能会发展出自己的意识。“你说，‘网络中的深度智能能造成什么危害？’嗯，它可以通过制造假新闻、伪造电子邮件账户、发布假新闻稿以及操纵信息来发动一场战争，”他在
    2017 年表示。


    他并非孤身一人。哲学家 Nick Bostrom，牛津大学人类未来研究所所长，多次警告说，创造超级智能可能会导致“人类灭绝”。2015 年 3 月，Bostrom、Musk、DeepMind
    的联合创始人、Stephen Hawking 以及来自 Google、Facebook 和数百个其他机构的 AI 领袖签署了一封公开信，表示如果通用智能是终极目标，就需要采取安全措施，以确保其造福社会而不造成危害。


    2018 年，澳大利亚国立大学的研究人员着手绘制如何减轻 AGI 风险的图表。


