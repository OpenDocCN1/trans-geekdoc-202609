  trans: '


    如此迅猛的进步表明了 AI 的部分潜力。目前，它可以快速而高效地掌握单项任务。但研究人员设想一个未来世界，其中单一系统可以完成多项任务，而无需针对每一项任务进行调整。如果这种通用愿景得以实现，它将从根本上改变人类与机器的交互方式——远比目前更为深远。恰如其分的是，李世石在
    AlphaGo 的击败中赢得的那一盘棋，是人类唯一一次战胜该系统。但整体失利对这位有史以来最伟大的棋手之一产生了深远的影响。他于 2019 年退役，感觉这对他来说再也不会一样了。“即使我成为世界第一，”他说，“也有一个无法战胜的实体。”


    ## 更好的工具，更大的力量


    AI 传播的速度如此之快——并且仍在继续——以至于几年前仅限于少数实验室和资金雄厚的硅谷公司的许多创新，如今大多数人都能触及。计算机的价格持续下降，性能却不断提升。你现在可以购买一台高性能的笔记本电脑或台式机，使用
    Google、Amazon 或 Microsoft 的云服务运行 AI 应用程序，并可以自行学习如何使用它们。你只需要一个不错的互联网连接和几次鼠标点击。


    与此同时，驱动 AI 的硬件也在不断进步。例如，虽然 GPU 仍然是运行某些 AI 应用程序的首选处理器类型，但 Google、Intel、Graphcore
    以及许多其他初创公司正在竞相开发更快、更强大的 AI 芯片。Google 于 2016 年宣布了其 Tensor Processing Unit (`TPU`)
    AI 芯片。与此同时，由 Nigel Toon 和 Simon Knowles 创立的 Graphcore 已筹集了超过 4 亿美元的风险投资资金，用于生产其
    Intelligence Processing Unit (`IPU`) 芯片。“当 Google 宣布他们正在构建 `TPU` 时，那是一个重大时刻，”Graphcore
    首席执行官 Toon 说。“正是 `TPU` 让人们真正意识到，你实际上需要为此构建专用硬件。”


    Graphcore 的 `IPU` 是在过去半个多世纪中从零开始设计的，不仅是为了与当今存在的智能机器协同工作，更是为了预见 AI 的进一步扩展。第二个版本——Toon
    说这是他们一直打算制造的版本——使用了 594 亿个晶体管（用于执行计算的开关电气门），这些晶体管间距仅为七纳米。该公司表示，其 Mark 2 芯片的性能比第一代提升了八倍。这些芯片相互互连，以便在一个世界中能够有效地相互通信，在这个世界中，越来越多的数据将被投入到日益复杂的
    AI 系统中。“我们知道我们将要构建的这些知识模型最终会变得极其复杂，”Toon 说。“我们试图做的是创建一块硬件，其操作方式要复杂得多，这样你就可以实际利用数据中存在的根本稀疏性。”`IPU`
    现在已投入商业运行。


    大数据——AI 革命的生命线——在质量和纯数量方面也在改善。“人们开始认识到，进步的方式不仅仅是拥有聪明的算法和大量的计算能力，你需要的是经过非常精心策划的训练数据，”牛津大学计算机科学教授、艾伦·图林研究所
    AI 项目联合主任 Michael Wooldridge 说。全球各地的卫星现在正在以高分辨率拍摄地球，世界历史的一个版本已被自由记录在 Wikipedia
    上，我们的城市越来越充满了可以追踪从街道人流量到垃圾桶满载程度的传感器。在个人层面：你在智能手机上的每一次点击都会产生一个数据点，观看习惯被存储，医疗记录正在数字化，人们正在上传更多图像和视频到网络上。


    当然，在错误的人手中，这些数据可能会危及隐私并助长滥用。但在正确的人手中，它可以用以训练机器学习系统，从而对我们周围的世界产生积极的改进。研究人员正在利用大数据来编程无人机，这些无人机可以勘察森林砍伐并重新播种。大数据帮助
    AI 从数亿个分子中发现了新的抗生素。NASA 的数据已被分析以发现新行星。列表还在继续。


    不仅 AI 工具在兴起。该行业本身也在壮大，并吸引着越来越多的投资。根据由斯坦福大学运行的 AI Index 项目收集的数据（该项目分析全球行业状态及其变化），AI
    初创公司在 2010 年筹集了 13 亿美元。2018 年，这一数字达到 404 亿美元。虽然 2020 年的全球大流行可能导致了暂时的下滑，但整体趋势仍然是向上的。2018
    年，超过 3,000 家 AI 公司获得了资金。在 2014 年至 2019 年 11 月之间，向 AI 公司进行了超过 15,000 笔超过 40 万美元的投资——平均投资规模约为
    860 万美元。在此过程中，数千名额外员工已被大型科技公司录用。AI 研究部门得到了加强。并且，新的参与者也被吸引进来，来自资金雄厚的科技公司圈子之外——从制药公司到银行。


    AI 现在也是一项全球性事业。投资可能仍然主要由美国和中国主导，两国正在争夺成为 AI 超级大国，但世界其他地区也在大力投入。“谁成为这一领域的领导者，谁就会成为世界的统治者，”俄罗斯总统弗拉基米尔·普京在
    2017 年表示。


    AI 出版物和会议也随之爆发式增长。AI Index 显示，在 1998 年至 2018 年的 20 年间，经过同行评审的 AI 科学论文数量增加了 300%。如今，中国每年发表的
    AI 期刊和会议论文数量与整个欧洲一样多，已超过美国成为单一最大贡献者。而最大的 AI 研究会议 NeurIPS，在 2019 年有 13,000 名与会者，相比
    2012 年增长了 800%。


    如今，AI 领域拥有多个子领域，从模式匹配到语音识别，再到计算机视觉（教会机器“看”）和自然语言处理（使机器能够理解文本）。然而，可以说我们在商业化一种在某些领域已经如此普及的技术方面仍处于早期阶段。即使现在，了解在哪里以及使用什么类型的
    AI 也可能是一个挑战——2019 年的一项分析判断，欧洲 40% 的 AI 初创公司实际上并不使用 AI。


    因此，我们还有很长的路要走，才能弄清楚如何最好地利用我们周围已经存在的技术。最终，它将成为我们日常生活中无形的一部分。“那里有人，你需要思考他们如何融入你业务的其余部分，”Wooldridge
    说。“技术需要时间才能真正融入，并让人们找到正确的使用方式。”


    # 3


    ## 应用 AI


    并非所有 AI 都平等。有些已达到人类水平。有些还有很长的路要走。例如，Amazon 的 Echo 和 Google 的 Home 智能音箱中使用的语音识别系统，可能已经改进到可以帮助提出基本问题的人使用，但它们仍然非常不稳定。它们经常听错或误解基本命令。技术正在改进，但我们离拥有可用于类似人类对话的语音识别还很远。


