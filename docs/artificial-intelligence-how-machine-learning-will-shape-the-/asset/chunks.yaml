    work could be automated. ‘A lot of what I would spend my time doing as a lawyer
    felt like it didn’t need much brain power,’ he explains. His view was that machine
    learning could be utilised for reviewing some types of contract, such as those
    concerned with employment conditions. The tasks involved seemed simple enough.


    It didn’t, however, turn out that way. ‘The truth is it was much more difficult
    than we anticipated,’ Robinson says. ‘There are so many random things that could
    be in that document, that you can’t be confident that the AI will always identify
    them.’ What he therefore did was to create a system in which AI works with human
    lawyers rather than instead of them. The company’s system has been trained on
    historical contracts – both those in the public domain and documents provided
    by clients – and taught to look for particular elements. It’s therefore able to
    detect whether a non-compete clause has been sneakily added into a business contract,
    or whether an employment contract stipulates non-standard working hours.


    If it finds anomalies, the system alerts a human lawyer via email and they then
    check the document. The same thing happens if the system is unable to interpret
    a particular clause or contract. A recent assignment the company took on was checking
    contracts between big fast-food retailers and their suppliers during the early
    months of the coronavirus pandemic, to find out what each party’s obligations
    were in the event of a crisis. Robinson’s view is that lawyers find checking contracts
    tedious. At the same time, it’s dangerous to rely wholly on AI, because even if
    it’s getting things right 96 per cent of the time, that’s not good enough when
    companies’ and individuals’ lives and livelihoods are at stake. ‘We want to use
    AI to make the first attempt at everything in situations where it’s really easy
    for a person to check and see if it’s wrong or right,’ he says.


    However organisations end up using AI, there’s no doubt that as it spreads it
    will become easier to access and operate. At present most AI deployments involve
    handcrafted technology. In the future, a company’s AI requirements may be handled
    by a third party, using software that seems as straightforward as that inside
    word processors or slideshow builders. A company that wants to use AI to analyse
    specific datasets or images will be able to use a template to create this. The
    algorithm it picks may not have been created by the third-party service they’re
    buying the template from, but from another company further up the chain of businesses
    developing and industrialising AI. The technology will become plug-and-play. By
    that point we may hardly notice its interaction with our daily lives.

