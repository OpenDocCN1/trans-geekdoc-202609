  trans: '


    AI 的殖民性质有多种表现形式。它体现在算法歧视中，这使得不平等的现实世界在不平等的虚拟世界中得到反映。它贯穿于该行业的招聘实践。它涉及在世界相对贫穷地区广泛使用低薪劳动力，这些人处于
    AI 生产链的起始阶段，负责为训练准备数据。当然，人们从所做的工作中获得经济利益，但他们所在的社区是否可能从他们正在帮助创造的技术中受益，这一点值得怀疑。此外，AI
    治理规则往往由较富裕的国家制定。Mohamed、Png 和 Isaac 强调了一项关于 AI 伦理准则的全球审查，该审查发现非洲、南美和中美以及中亚地区未参与讨论。他们还指出，AI
    系统可能会在数据保护法律不如英国或欧洲严格的国家进行 Beta 测试。


    这种系统性不公正体现在个人经历中：有人因所做的工作而报酬过低，或未获得应得的晋升，或遭到同事的不尊重对待。近年来，数千名谷歌员工抗议公司对高管性骚扰指控的处理方式，以及未能妥善调查歧视指控；此外，数百名微软员工声称在工作中曾遭受骚扰和歧视。2020
    年 12 月，领先的 AI 伦理研究员 Timnit Gebru 表示，谷歌解雇了她，并指责该公司存在“制度性种族主义”，原因是公司对她合著的一篇学术论文提出异议。


    “多样化”和“具代表性”还意味着要考虑到全球超过十亿残障人士。AI 帮助创造了新的无障碍形式——例如，可以“看见”世界的计算机视觉应用程序。但要实现真正的包容性，还有很长的路要走。“我认为包容性
    AI 最重要的一步是让残障人士参与所有阶段，”微软首席创新架构师兼 AI for Accessibility 计划负责人 Mary Bellard 表示。这种包容不仅仅是让残障人士测试产品。还必须雇佣有残障的技术人员。“有时存在一种观念，即为‘残障人士’构建技术，而不是与‘残障人士’共同构建或由‘残障人士’构建，这两个想法之间有着重要的区别，”Bellard
    说。


    但周围也有人和组织正在努力改变现状。其中之一是 Tess Posner 创办的 AI4ALL，这是一家美国非营利组织，致力于让更多年轻女性和 BAME 群体对
    AI 产生兴趣。其举措包括为高中生举办夏令营。“我们经常听到这样的话，‘我是学校里唯一一个像我一样对这个感兴趣的人’，或者‘我从没想过能进入这个领域，因为我在该领域没看到像我这样的人，’”Posner
    说。这些夏令营旨在让此类学生接触 AI 榜样。来自大型科技公司的博士生和专家讲解 AI 的主要原则：机器学习的类型、如何使用 Python 编程语言、数据集在
    AI 中的重要性。AI4ALL 还为美国各地的高中教师提供开源 AI 教学资源，重点面向低收入学校，这些学校通常可能没有资金为学生投资计算机科学专项教育。Posner
    希望将教学资源翻译成其他语言，以便它们能在美国境内外更广泛地传播。


    AI Now 的多样性报告探讨了科技行业（尤其是 AI 领域）可以做出哪些改变。它主张公布所有职位和工作的薪酬水平（包括奖金和所有其他付款），并按种族和性别细分。它推动建立薪酬平等，以确保人们得到应有的工作报酬，并将目前代表性不足群体的晋升纳入公司目标。它还要求发布骚扰和歧视透明度报告。也许最重要的是，它倡导改革招聘方式，建议应建立举措联系非精英大学，并应找到更好的方式让承包商、临时员工和自由职业者成为全职员工。招聘实践和条件也应公开透明，让每个人都知道个人是如何被雇佣、支付报酬和晋升的。所有这一切的责任始于高级管理层。“企业层级顶端的人比单个研究人员和开发人员拥有更大的权力来制定方向并塑造伦理决策，”AI
    Now 的报告表示。


    ## 透明度与监管


    Joy Buolamwini 表明，AI 的问责制可以带来改变。2015 年，MIT 媒体实验室的一名研究生正坐在笔记本电脑前，试图让她正在使用的通用面部跟踪软件工作。问题是软件无法工作。它本应将数字艺术品投射到她的脸上，但却“无法看见”她。然而，当她的朋友坐在廉价笔记本电脑的网络摄像头前时，系统自动启动了。原因是什么？Buolamwini
    是黑人。她的朋友是白人。一旦 Buolamwini 戴上白色面具，软件就立即识别出了她。


    这并非 Buolamwini 第一次遇到源于主要基于白人皮肤图像训练的算法所导致的歧视。她曾试图教一个机器人玩躲猫猫游戏，但机器人没有反应。同样，她是隐形的。


    在 Buolamwini 坐在网络摄像头前五年后，她的研究改变了面部识别技术的开发方式，并将训练数据中选择偏差的问题提升到公众意识中。她 2018 年的 MIT
    论文《性别阴影》（由 Timnit Gebru 合著）审计了 IBM、微软和中国公司 Face++的面部识别系统性能，并发出了严厉的警示。


    她展示了，总体而言，这些系统在识别深色皮肤人群方面不如识别浅色皮肤人群效果好。微软表现最好，但即便如此，其对深色皮肤人群的 87.1%准确率与其对浅色皮肤对象的
    99.3%准确率相比相形见绌。IBM 软件中的差异幅度为 19.2%。当引入性别时，准确率进一步下降。IBM 和 Face++对深色皮肤女性的正确识别率仅为
    65%。微软略好，为 79%。对于浅色皮肤女性，三套软件的得分均高于 92%。性能差异高达 34%。


    一年后的后续研究——名为“可操作审计”


    通过让不透明的算法及其创建者承担责任，极具影响力的《性别阴影》及后续研究展示了一条前进的道路。它们非常公开地揭露了现有 AI 系统的失败，并引发了亟需的公共辩论，不仅关乎面部识别系统如何运作，更关乎它们应当如何被使用。Buolamwini
    曾出席立法者、政策制定者和警察官员面前，解释歧视性做法是如何运作的，以及她的审计如何揭露了这些做法。她的工作直接促成了对面部识别系统更严格的审查。这也导致这些系统在多个美国州被禁止。2020
    年 6 月，亚马逊、IBM 和微软都承诺，至少暂时停止向警察销售面部识别软件，此举是在全球范围内就系统性种族主义以及明尼阿波利斯警察杀害乔治·弗洛伊德的抗议活动之后作出的。


    '
