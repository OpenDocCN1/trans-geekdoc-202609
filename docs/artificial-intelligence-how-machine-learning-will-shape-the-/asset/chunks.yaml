    199. iv


    ## 关于作者


    `WIRED` 是全球最具权威性和受尊敬的出版物，报道塑造我们世界的新兴趋势、理念和技术。我们的使命是讲述推动这一变革的人们的故事，并理解其对商业、社会和个人的影响。`WIRED`
    已成为对这些变革力量及其对行业和个人意义的明智、智能分析的代名词，并且一直是变化的可靠预测者。


    **Matt Burgess** 是 `WIRED UK` 的副数字编辑。


    ## 引言


    人工智能时代已经到来。千禧年之际，在研究实验室中发展数十年的新兴技术已悄然融入我们的日常生活。它可能不像流行文化中灌输给你的科幻版本的人工智能那样，但它就在这里。并且它正在对世界产生巨大影响。


    到你坐下来读这本书或通过有声版将其灌入耳朵的时候，你已经多次与人工智能互动了。在几乎所有情况下，你可能没有意识到这正在发生。它在你每天使用的一些产品中已经如此普遍，以至于你几乎察觉不到。


    你在新闻动态中“点赞”的 Facebook 帖子之所以展示给你，是因为该公司的人工智能一直在监控你的过去活动，并可以预测你最有可能点赞的帖子。Netflix
    一直在向你推送电影和节目，因为它已经知道你喜欢什么。当你通过面部识别解锁 iPhone 时，这是因为 Apple 的算法已经映射了你的特征，并将其与你存储的面部特征匹配。


    你进行的每一次 Google 搜索都会显示由人工智能驱动的结果，这些结果是通过抓取整个网络的内容并对与你的搜索最相关的内容进行排名生成的。你汽车导航仪上的地图根据对移动数据的实时理解和对世界的知识生成最快路线。每次你低语“Alexa”——或者
    Amazon 的智能音箱认为它听到你说了唤醒词时——人工智能都会处理你说的话，并提供它计算出的最合适的回应。


    不仅仅是我们的日常生活正在被改变。在医疗保健和太空探索等多样化的领域中，人工智能正在从数十年收集的大量数据中学习，以帮助发现新药物和寻找新行星。与此同时，从私营公司到政府的组织越来越多地使用人工智能来改善其运营，减少从事重复性工作的人员的行政负担。


    我们仍处于人工智能革命的相当早期阶段。在未来十年左右，人工智能有巨大的潜力彻底改变我们许多最日常的活动——想想自动驾驶汽车和机器人配送——并为世界带来更多好处。该技术将引领打击信用卡欺诈的斗争，帮助检测上传到互联网的儿童性虐待图像，并在网络攻击使企业瘫痪之前识别它们。


    与所有技术一样，人工智能迄今所取得的成就以及未来可能取得的成就都有利有弊。从积极的一面来看，它正在民主化。曾经人工智能是拥有巨大资源的公司的专属，而现在任何想要上网并购买工具来实施它的人都可以使用它。最终，无论公司还是个人，即使没有任何技术知识，也将能够轻松使用人工智能。当然，它也变得越来越复杂。


    但也存在潜在问题。目前，我们与人工智能系统的大多数互动都相对无关紧要：它们是常规的，（有时）无缝的，并且最终令人难忘。一个无用的搜索结果，或几次重复尝试解锁手机，都不是值得记住超过几秒钟的时刻。然而，这项技术也可以用来监视我们并监控我们的每一项活动。它拥有威胁我们公民自由、我们的自由和我们人权的力量——并且在某种程度上已经被用于这些目的。因此，
    policing 世界对其着迷，或者政府竞相在人工智能领域占据主导地位，也不足为奇。这是一项引发重大权力和控制问题的技术。


    还有种族主义和性别歧视的问题。目前，人工智能由一小群人开发和控制——大多是为科技公司工作的白人男性。这种缺乏多样性已经对并将继续对数百万人产生严重后果，他们的生活可能受到人工智能系统的影响。早期的部署已经表明，人工智能和各种形式的社会压迫往往是相伴而生的。


    最终，人工智能可以成为一种巨大的善的力量——它已经以深刻的方式改变了世界。但未来十年将至关重要，将决定这种变化将走多远，以及它最终在多大程度上将造福社会。本书不仅解释了我们如何走到这一步，还探讨了我们接下来可能去往何处。


    # 1


    ## 早期岁月


    今天我们所理解的人工智能诞生于 1956 年夏天，地点是美国东海岸新罕布什尔州达特茅斯学院的一个低调的夏季度假地。


    在两个月的时间里，一群由 John McCarthy、Nathaniel Rochester、Claude Shannon 和 Marvin Minsky
    聚集在一起的计算机科学家，并确信计算机可以更像人一样行动，讨论如何改进一些最早机器所能做到的事情。“将尝试找出如何使机器使用语言、形成抽象和概念、解决目前仅限于人类的各种问题，并自我改进，”这四位主要研究人员在他们在达特茅斯相遇前一年写的一篇论文中写道。


    然而，研究人员对自己的努力感到失望。研讨会未能获得所需的全部资金；受邀者无法就任何共同标准达成一致；后续工作受到参与者各自有研究要追求的阻碍。无论如何，考虑到当时计算机相对基础的状态，达特茅斯夏季项目的目标是不切实际的。“我对迈向人类水平人工智能的突破的希望在达特茅斯并未实现，”McCarthy
    五十年后在一份备忘录中写道。


    但研讨会确实产生了影响。在它举行之前， nascent 人工智能研究通常归类为 Automata Studies，这可能导致一种有些支离破碎的方法。然而，在四位研究人员的原始提案中，他们第一次使用了“人工智能”这一短语。“这个术语被选择是为了把旗帜钉在桅杆上，”McCarthy
    半个世纪后写道。策略奏效了。这个新标签启动了现在已成为数十亿美元产业的事业，而 McCarthy 本人也被认为是其诞生者。


    '
