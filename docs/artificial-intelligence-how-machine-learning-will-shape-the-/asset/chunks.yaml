    # 致谢


    许多为本书出版做出贡献的人都在书中被提及（虽然我不会犹豫，也不会为在此再次列出他们的名字而道歉）。然而，还有其他人同样发挥了重要作用，但并未被明确提及。不分先后，我谨向以下人士表示感谢：Adrian
    Weller、Alastair Moore、Alex Harvey、Alexander Babuta、Alice Xiang、Bonaventure Dossou、Camille
    Marini、Chelsea Finn、Cori Crider、Daniel Leufer、David Dao、Emma Beede、Emily Wenger、Eric
    Olander、Fanny Hidvégi、Finale Doshi-Velez、Henry Ajder、Henry Shevlin、Jack Weast、Jeff
    Alstott、Jenny Brennan、José Hernández-Orallo、Julia Kreutzer、Jutta Treviranus、Kaiton
    Williams、Kanta Dihal、Ken Chatfield、Mark Harman、Mona Flores、Moshe Greenshpan、Nigel
    Toon、Lily Peng、Oren Etzioni、Ott Velsberg、Paul Newman、Ragnar Fjelland、Rashida Richardson、Renée
    Cummings、Richard Robinson、Rumman Chowdhury、Sandra Wachter、Sasha Luccioni、Saurabh
    Mishra、Shreya Shankar、Solon Barocas、Silvia Chiappa、Steven Feldstein、Suresh Venkatasubramanian、Tess
    Posner、Toshie Takahashi、Carol Reiley、Victor Riparbelli Rasmussen、Wenchao Li 和
    William Isaac。Dave Gershgorn、Jack Clark、James Vincent、Karen Hao 和 Will Knight
    的撰写与报道在 AI 领域设定了议程，功不可没。


    我还要感谢 WIRED 编辑团队的持续支持，特别是 Greg Williams 和 Mike Dent，他们与 Penguin 团队一起开发了这一系列图书。应将大部分功劳归于
    Penguin 的 Nigel Wilcockson，他在手稿的多个版本中展现了无与伦比的耐心和结构专业知识。Parity AI 首席执行官 Rumman
    Chowdhury 为本书的某些领域提供了指导。最后，但同样重要的是，如果没有我的伴侣 Stephanie 的坚定支持，我无法度过充满疫情的一年并完成本书。她的支持和鼓励使这一切成为可能。


    # 引言


    本书旨在作为 AI 世界及其所呈现的一些机遇和挑战的有见识的入门指南。然而，这些页面的篇幅不足以深入探讨某些主题。尽管上述所有人以及无数其他未具名且先于他们的人投入了时间和专业知识，但任何错误均由我本人承担。我希望本书以应有的严肃性呈现社会问题，并能，即使只是微小地，为创造一个更美好的
    AI 未来做出贡献。


