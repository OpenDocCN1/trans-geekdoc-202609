    ‘In Japan, we have a more positive, utopian view,’ says Toshie Takahashi, a professor
    studying the impact of AI at Waseda University, Tokyo. One narrative popular there
    involves Doraemon, a blue robot cat with neither claws nor ears that travels back
    in time to help a boy called Nobita Nobi. Perhaps the results of Takahashi’s research
    suggest a future path for our relationship with AI. She has shown that almost
    70 per cent of young people in the country have a positive image of it (‘People
    talk more about social good or social benefits, especially for an ageing society’),
    but that 60 per cent of them don’t want AI to be in humanoid form. In general,
    as Dihal points out, there’s a gradual move to presenting AI as something that
    isn’t human or a danger to society. ‘There’s an increase in exploring narratives
    where the artificial intelligence doesn’t look exactly humanoid or isn’t embodied
    at all.’ In other words, we may be heading for a future where we don’t judge AI
    in terms of human capabilities.


