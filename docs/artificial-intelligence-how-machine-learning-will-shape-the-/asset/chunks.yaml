  trans: '


    在 2019 年 6 月，马萨诸塞大学阿默斯特分校的研究人员训练了四个深度学习语言模型（`GPT-2`、`Google’s BERT`、`AllenNLP’s
    ELMo` 和 `Transformer`），持续了一天。


    AI 研究人员在环境影响方面需要改变思维方式，事实是有一些事情是可以做到的。“你可以选择训练使用什么数据、模型有多大，以及选择哪个数据中心进行训练，”Luccioni
    表示。Luccioni 与同事们一起构建了可以自动添加到 AI 模型中的代码，用于报告 AI 的环境影响。该代码名为`CodeCarbon`，它估算 AI
    模型所需计算资源产生的二氧化碳（`CO²`）数量。它通过自动检测训练中使用的能源电网和硬件来实现这一点，然后提供改进建议。随着 AI 训练数据变得更大，其能源足迹是开发者将不得不改进的东西。


    ### 自动驾驶汽车


    在 2004 年春天，十五辆车辆聚集在莫哈韦沙漠参加一场独特的比赛。第一个到达 229 公里外终点的车辆，穿越岩石地形、洼地、沟壑和不可预测的野生动物，将为其背后的团队赢得
    100 万美元。条件是什么？没有一辆车辆允许有驾驶员。所有车辆都必须自行驾驶到比赛终点。


    由国防高级研究计划署（`DARPA`）组织的比赛是该组织的第一场大挑战赛。站在起跑线上的是一群《疯狂的麦克斯》风格的车辆：巨大的六轮车、改装的 SUV，以及完全没有驾驶舱的沙滩车。数百人挤满了起跑线周围的看台，目睹了这场壮观景象的展开。


    就比赛而言，结果是一场失败。“优胜者”仅爬行了 11.9 公里。有些车辆几乎没能离开起跑漏斗。自动驾驶汽车被灌木丛弄糊涂；它们冻结，无法向前移动；它们撞上了栅栏；它们在山坡上陷入困境。


    然而，就提升自动驾驶车辆研究的知名度而言，该活动是成功的。一年后，五支团队完成了类似的 212 公里赛道，获胜团队在不到七小时内冲过终点线。将近二十年后，世界各地数百万辆汽车使用自动驾驶功能——例如车道控制和自动泊车——而完全自动驾驶汽车在公共道路上已经行驶了数千公里。


    美国汽车工程师学会（`SAE`）根据六个自动化等级对车辆进行排名，从零级的完全无自动化到五级的完全自动化。四级车辆可以在大多数条件下自动驾驶；五级车辆能够在所有条件下自主运行。在四级以下的所有等级，都需要驾驶员，并且必须保持专注并随时准备接管。在开发阶段，AI
    可以在类似电子游戏的模拟中进行训练，做出决策并付诸实施。


    创建完全自动驾驶车辆所需的技术和系统，与构建在`SAE`标准较低等级运行的半自动驾驶功能所需的技术相似。“自动驾驶汽车是机器人系统，任何机器人系统都有三个主要阶段。第一阶段是感知，第二阶段是规划，第三阶段是行动，”Jack
    Weast 表示，他是英特尔自动驾驶部门的首席系统架构师，也是英特尔拥有的自动驾驶系统公司`Mobileye`的副总裁。


    一个关键组件是计算机视觉。安装在车辆周围的摄像头捕捉汽车周围的世界，并能够检测对象并确定它们是什么。“你拥有带有算法的传感器，它们感知环境，分类对象，理解它们是什么，并构建一个世界模型，这是对现实世界中存在事物的虚拟表示，”Weast
    表示。


    摄像头和计算机视觉不是唯一可用的传感器。激光雷达（使用光波）和雷达（无线电波）也可以使用。它们的传感器发出信号，击中汽车周围的物体——从街道标志到行人——然后反射回汽车，在此过程中构建环境的数字图像。由于无线电波不如光波容易被吸收，它们可以传播更远的距离。关键是，无论使用什么组合的传感器和摄像头，都需要大量的它们。“你需要有冗余和独立性，”Paul
    Newman 表示，他是英国自动驾驶软件公司`Oxbotica`的创始人。“冗余是多个摄像头、多个激光器、多个雷达。独立性是，它们以完全不同的方式工作。”只有通过这种组合，才能确保安全。Newman
    的公司正在英格兰公共道路上试驾四级自动驾驶车辆。其自动驾驶车辆也在机场和矿山周围使用，这些地方对自动驾驶车辆来说问题较少，因为它们是更可预测的环境。由于汽车行业普遍认为自动驾驶汽车将在未来大规模使用，从科技公司到传统车辆制造商的每个人现在都在致力于其开发。（在加利福尼亚州，有六十家公司持有许可证，可以在有人类安全驾驶员的情况下测试自动驾驶汽车。）


    一旦信号被汽车接收回来，连同来自计算机视觉摄像头和任何正在使用的其他地图数据，车辆就准备好做出几乎即时的决策。事实上，它不断地感知并规划其下一步行动。它观察周围的所有物体，从汽车和卡车到行人和骑车者，并通过评估其速度和轨迹来预测它们接下来会做什么。


    在自动驾驶车辆内部，多个算法和 AI 系统正在工作，同时还有非 AI 的经典统计方法。“在规划阶段，有一个名为驾驶策略的逻辑模块，”英特尔的 Jack Weast
    表示。这决定了车辆应该如何行为。与监督学习和无监督学习不同，它基于涉及特定目标的强化学习。算法被告知要实现某些事情——例如经济驾驶——然后通过试错来尝试达到它。如果它们成功，AI
    会得到奖励，奖励就是告诉 AI 复制它刚刚展示的更多正确行为。“奖励可能是燃油经济性，奖励可能是安全性，奖励可能是到达目的地的时间，”Weast 表示。“你正在尝试优化某些事情，因此它是一个非常有效的工具。”


    在将自动驾驶理论变为现实方面，领先的公司可以说是 Waymo，它是谷歌的分支机构，于 2009 年在该科技巨头的研究实验室内启动。在十年的时间里，该公司的自动驾驶系统使其车辆在公共道路上行驶了超过
    3000 万公里。大部分行驶都有安全驾驶员坐在方向盘后，准备在事情看起来出错时接管汽车。但是，自 2015 年以来，一些行程在没有安全驾驶员在场的情况下进行。根据该公司的说法，截至
    2020 年初，在亚利桑那州凤凰城 260 平方公里的区域内，每周运行 1000 至 2000 次自动驾驶乘车，其中多达 10%是完全无人驾驶的。总体而言，在
    2020 年的头九个月里，实现了 105,000 公里的完全自动驾驶行驶。


