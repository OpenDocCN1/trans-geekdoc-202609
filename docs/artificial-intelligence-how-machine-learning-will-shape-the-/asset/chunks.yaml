    ‘它不仅仅关乎机器学习部分，还关乎如何呈现信息，’Doshi-Velez 认为，并强调 AI 系统得出的结论需要让人类思考。这样的结论不能太容易被接受，否则就有可能在缺乏关键性批判性思维的情况下被过度依赖。同样，它们也不能太难以消化，否则人类会直接忽略或敷衍过去。‘模型需要在其局限性方面保持透明，突出
    AI 预测可能不准确或无效的情况，’哈佛研究得出结论。


    但当人类与 AI 同步时，潜在的好处是巨大的。例如，哈佛项目的更积极成果表明，AI 最终可能有助于诊断一种经常被忽视且治疗方案差异巨大的心理健康状况。这为全球超过
    2.64 亿与抑郁症作斗争的人们带来了希望。


    ## AI 与人类的对抗，还是人类与 AI 的协作？


    那么，从中期来看，AI 和工作世界的未来会是什么样子？很可能是参差不齐的结果。一路上会有失望和失败，并且将继续存在。2018 年，IBM 不得不放弃一个旨在帮助癌症患者治疗的数百万美元项目，因为该项目被发现给临床医生提供了错误的建议。


    AI 也会造成冲击。2019 年 11 月，布鲁金斯学会的研究发现：‘受教育程度更高、薪酬更好的工人将受新技术影响最大，但也有例外。’目前工作涉及密切关注数据的人将特别脆弱：市场研究人员、销售经理、计算机程序员和个人理财顾问等。那些工作涉及大量人际交往技能的人，例如教育和社会护理领域的人，可能受影响较小：AI
    很难取代人类的同情心和共情能力。话虽如此，在日本，护理机器人已经被用来帮助该国老龄化的人口。无论如何，做出笼统概括是危险的。事实是，AI 采用情况将因当地文化和社会态度而有所不同。新加坡金融领域的自动化可能与巴基斯坦金融领域的自动化大不相同。


    不过，如果以谷歌在计算机视觉方面的工作或哈佛与精神科医生的研究为例，似乎总体趋势是 AI 不会取代现有工作，而是转变它们——并且也会创造新工作。已经有成千上万个职位存在，在世纪初是无法想象的。现在，成千上万的人从事
    AI 数据标注工作，帮助编纂训练机器学习的数据集。成千上万的人已被 Facebook 和 YouTube 等公司录用，负责审核可能违反其平台规则的内容，而这些内容在许多情况下最初是由
    AI 标记出来的。


    MIT Sloan 和波士顿的研究人员认为，那些最有望从 AI 中受益的公司是那些利用 AI 来增强和塑造传统流程，而不是取代它们的公司。换句话说，他们创造了一个环境，人类从
    AI 学习，AI 也从人类学习。工具制造商史丹利百得（Stanley Black & Decker）就是一个例子。它已开始使用计算机视觉来检查其制造的卷尺质量。该系统会实时标记缺陷，在生产周期早期发现问题，从而减少浪费。但人类仍然在场，对最严重的故障进行检查并做出判断。


    专家是创建可信 AI 系统的关键，Tractable 公司研究副总裁 Ken Chatfield 表示。Tractable 是一家 AI 公司，利用计算机视觉帮助在车祸后就保险索赔做出决策——其
    AI 正被一些最大的保险公司在现实世界中使用。该公司最初在数千张涉及事故车辆的图像上训练其 AI——包括受损的车门面板、破碎的挡风玻璃等。但当图像中突出的损坏由在评估事故报告方面拥有多年经验的专家标记时，系统性能的最大改进才出现。一旦
    AI 审查了图像并建议下一步该做什么，就是人类保险代理人接手。‘数据本身不够，我们作为研究人员的知识也不够——我们真的需要借助专家的知识才能训练模型，’Chatfield
    解释道。‘让专家参与也是我们建立信任所需要的。’


    总部位于伦敦的律师 Richard Robinson，Robin AI 的首席执行官，在法律领域也取得了不相上下的平衡。当他确信合同工作中许多重复性任务可以自动化时，他辞去了大型律师事务所的工作。‘作为律师，我花大量时间做的事情感觉不需要多少脑力，’他解释道。他的观点是，机器学习可以用于审查某些类型的合同，例如涉及雇佣条件的合同。这些任务看起来足够简单。


    然而，情况并非如此。‘事实是，这比我们预想的要困难得多，’Robinson 说。‘文件中可能有太多随机的东西，你无法有把握 AI 总能识别它们。’因此，他创建了一个系统，让
    AI 与人类律师协作，而不是取代他们。该公司的系统已在历史合同（包括公开领域的合同和客户提供的文件）上进行训练，并被教导寻找特定要素。因此，它能够检测竞业禁止条款是否被偷偷添加到商业合同中，或者雇佣合同是否规定了非标准工作时间。


    如果发现异常，系统会通过电子邮件提醒人类律师，然后由他们检查文件。如果系统无法解释某个特定条款或合同，也会发生同样的情况。该公司最近承担的一项任务是在新冠疫情早期几个月检查大型快餐零售商与其供应商之间的合同，以了解在危机发生时各方的义务是什么。Robinson
    认为，律师觉得检查合同很枯燥。同时，完全依赖 AI 是危险的，因为即使它有 96% 的时间做得正确，当公司和个人的生计和生存岌岌可危时，这还不够好。‘我们希望在人们很容易检查并判断对错的情况下，使用
    AI 对所有事情进行第一次尝试，’他说。


    无论组织最终如何使用 AI，毫无疑问，随着 AI 的普及，访问和操作它将变得更加容易。目前，大多数 AI 部署涉及手工制作的技术。未来，公司的 AI 需求可能由第三方处理，使用看起来像文字处理器或幻灯片制作软件内部一样简单的软件。一家想要使用
    AI 分析特定数据集或图像的公司，将能够使用模板来创建这一点。它选择的算法可能不是由他们购买模板的第三方服务创建的，而是由链条中更上游的另一家开发和工业化
    AI 的公司创建的。技术将变成即插即用。到那时，我们可能几乎不会注意到它与我们日常生活的互动。


