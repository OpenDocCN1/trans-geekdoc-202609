  trans: '


    在某些方面，网络安全行业领先于罪犯，因为它长期以来一直在使用能够检测企业网络中异常情况（例如恶意软件）的 AI 工具，这些异常情况可能会对数据和系统造成严重破坏。例如，Google
    于 2017 年开始使用机器学习来帮助在其 PlayStore 中发现恶意 Android 应用。芝加哥大学 SAND Lab 的 Emily Wenger
    与其他研究人员一起，利用 AI 创建了一个名为 Fawkes 的隐私保护工具，该工具通过一种称为图像伪装（image cloaking）的过程，在人们的照片中添加数据。这些添加的数据对人眼不可见，但可以混淆面部识别数据库。


    除了使用 AI 攻击传统计算机系统外，AI 还可以用于攻击其他 AI。这里的风险和赌注都很高，技术的恶意用途很难检测。本质上，它可以采取两种形式之一：对抗性攻击和木马攻击。在对抗性攻击中，会向图像中添加“扰动”（perturbations）——即人眼不可见的像素——以使
    AI 错误解读其所见内容。（这使用了 GAN 风格的技术，该技术最初由 Google 研究人员于 2014 年创建，当时他们发表了一篇论文，描述了如何通过向图像添加“扰动”来使其运行不正确。


    相比之下，木马攻击涉及在一段 AI 中植入恶意数据，而该 AI 很可能最终会被另一个 AI 使用。例如，一家公司可能会从另一家处理 AI 训练和创建的公司购买图像识别系统，却不知道该系统已经被入侵。只有当他们——或者供应链中更下游的最终用户——部署它时，问题才会显现。“你可能自己会有一堆测试数据，”波士顿大学助理教授
    Wenchao Li 说道，他揭露了木马攻击如何影响强化学习算法。“你测试了模型，在该测试数据集上看起来是正确的。现在你可以部署它。但问题是，你从别人那里得到的网络实际上里面有一个木马。”


    此类系统性威胁在数字世界中已存在多年。例如，笔记本电脑、计算机和手机制造商 ASUS 在 2019 年遭受了供应链攻击，当时该公司软件更新服务器被攻破，恶意软件被插入到发送出去的合法更新中。


    为了帮助应对针对 AI 系统的此类后门攻击，美国情报高级研究计划署（IARPA）发起了一个名为 TrojAI 的项目，研究人员竞相寻找有效的检测木马的方法。“要使木马攻击有效，触发器在正常运行环境中必须很少见，以便木马不会在测试数据集或正常操作中激活，其中任何一种情况都可能引起
    AI 用户的怀疑，”IARPA 在其网站上表示。


    检测这类攻击很难。“有人认为攻击者只应污染一小部分数据，因为，比如说，这个坏人需要一个团队，而你可能有一个警惕的供应商在监控训练过程，”波士顿大学的 Li
    说道，他是 IARPA 项目中一个团队的成员。


    目前，TrojAI 项目仍处于早期阶段，但参与其中的人表示它显示出前景。然而，检测木马需要对 AI 系统的结果进行深入分析，而要做到这一点需要另一个 AI，该
    AI 能够仔细分类受损系统的许多不同输出，并发现它如何做出决策。这种复杂性不可避免地给潜在的黑客留下了操作空间。合法 AI 用户与黑客之间的战斗将是一场持久战。


    # 7


    ## 让 AI 负责


    硅谷最大的技术公司——Google、Amazon、Facebook、Netflix、Microsoft 和 Apple——在 2010 年代推动了 AI 的发展和商业化。它们投资了数十亿美元来构建处理
    AI 决策所需的基础设施，然后将 AI 部署到其产品中。它们大力投资于保护其 AI 系统训练所用的海量数据，在巨大的数据中心中处理这些数据，并部署巨大的计算能力来处理它们。而且，它们花费了一大笔钱来吸引和留住最优秀的人才。


    多亏了它们，我们的生活已悄然发生了变革。Amazon 通过其支持 Alexa 的 Echo 扬声器，将语音识别技术带入了数百万个家庭。Apple 开创了隐私保护型机器学习，它从你与手机的交互中剥离个人详细信息，以确保人们无法从其提供的训练数据中重新识别个人。Microsoft
    的技术基础设施支撑着数百家其他公司的 AI 系统。Facebook 和 Instagram 的信息流中充满了 AI 决定我们最有可能与之互动的帖子，不仅来自我们的朋友和家人，还来自人们关注的广告商和品牌。Netflix
    的机器学习会根据我们的过去观看历史，引导我们观看它希望我们观看的节目和电影。Google 的绝大多数产品——包括电子邮件和文档中的建议回复、其翻译工具、地图提供的路线以及
    YouTube 推荐——都由 AI 驱动。


    但问题在于。绝大多数 AI 产品都是由一个特定群体开发的：白人男性。正如 AI 做出的决策可能会被喂给它们的数据集所偏差一样，其基本创建也可能会被构建它的人的文化背景和假设所偏差。“归根结底，重要的是谁在构建和塑造
    AI 系统，”非营利组织 AI4ALL 的首席执行官 Tess Posner 说道。“谁真正处于权力地位，可以影响构建什么、设计什么、创造什么？目前，这是一个非常同质化的技术人员群体。如果你是一群只代表一种人和背景的个人，你只能知道这么多。”


    讽刺的是，对于一个如此依赖数据的行业来说，AI 界在透露其员工队伍性质的数据方面却异常含蓄。科技公司、大学和其他学术机构传统上都不愿发布详细信息。一些国家的大公司情况正在慢慢改变，但它们仍然能够控制随其发布的统计数据所附带的叙述。总体而言，关于性别、性取向或种族等指标，明显缺乏详细信息。


    即便如此，大体情况是很清楚的。根据 2018 年 AI 指数（AI Index）的数据，平均而言，80% 的 AI 教授是男性，该指数研究了包括伦敦大学学院、斯坦福大学、卡内基梅隆大学、加州大学伯克利分校、牛津大学、苏黎世联邦理工学院和伊利诺伊大学厄巴纳-香槟分校在内的顶尖计算机科学院校（研究人员指出，所检查的院校之间“差异很小”）。


    毫不奇怪，纽约大学 AI Now 研究所 2019 年关于 AI 中性别、种族和权力的报告在讨论这些数字时得出结论：“AI 行业异常同质化，很大程度上是由于其对女性、有色人种、性别少数群体和其他代表性不足群体的对待方式。”


    '
