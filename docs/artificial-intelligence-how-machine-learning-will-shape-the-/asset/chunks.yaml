  trans: '


    然而，完全自动驾驶汽车大规模商用的日子还遥遥无期。还有法律问题需要克服。当完全自动驾驶汽车发生事故时，谁该负责？是硬件制造商还是软件制造商？还有实际问题。比方说，当道路上
    50%的车辆是自动驾驶的，而其余车辆由拥抱技术的人类驾驶时，它将如何运作？还有不可避免的信任和安全问题。机器能每次都做出正确的决定吗？它真的能有多安全？


    涉及半自动驾驶汽车的致命事故当然并非没有先例。例如，2018 年 3 月，一名使用特斯拉半自动驾驶功能的苹果员工，在他的车撞上混凝土护栏后死亡。美国国家运输安全委员会进行了调查，最终将责任归咎于驾驶员和车辆。


    谷歌的 Waymo 发布了一些细节，关于其自动驾驶汽车在总计 980 万公里的行程中涉及的事故数量。


    这样的诊断似乎证实了自动驾驶技术支持者的观点，即它实际上比传统交通更安全。毕竟，每年全世界有数百万人死于普通车祸。杰克·韦斯特说，英特尔在安全方面的做法是采用确定性方法——而不是让机器基于
    AI 认为事情发生的概率来做决定。“这就像是对 AI 推荐决策的一种检查，所以当这个概率算法不可避免地推荐一些可能对安全不利的事情时，我们有一个确定性的方法来检查该行为是否安全，”他说。


    自动驾驶汽车当然比人类有一些巨大的优势。它们能更快地感知周围环境，并且能同时向所有方向观察。它们的反应时间也更快。而且它们不会疲劳。“作为人类，我们搞砸的唯一一件事就是我们会失去注意力，”保罗·纽曼说。“我们只是会分心。而这是机器不会做的事。有多少事故是由疲劳和愚蠢的事情造成的？”


    此外，自动驾驶汽车可以相互学习。牛津比特公司支撑其车辆运行的 AI 系统每晚都会刷新。车辆在现实世界和虚拟模拟中遇到的所有新数据和新场景，都可以添加到系统的知识库中。一天之内，数百小时的新经验和知识可以被添加到车辆对驾驶方式的理解中。每辆车都可以拥有其他每辆车的经验——当每天有成千上万或数百万辆车辆运行时，这种共享的理解会呈指数级增长。


    技术专家认为，像这样的机器在现实世界中运作的方式，是通过向人们解释它们实际如何工作以及能带来哪些好处。“我们需要停止说这些东西在某种程度上是神秘且无法解释的，”纽曼补充道。“它们是经过设计的软件，周围有流程，我们可以说明我们期望它们如何表现。”


    # 4


    ## AI 的陷阱


    在 2015 年至 2020 年期间，申请英国签证以工作、学习或探望亲人的人会以通常方式填写文件，然后这些数据会被交给一个算法进行评估。算法会给他们一个评级：红色、黄色或绿色。在被评为绿色的人中，96.3%被直接放行。那些被标记为红色——即“风险最高”类别——的人不会被自动拒绝，但会接受进一步检查，高级员工会被叫来检查数据并做出最终决定。这个由内政部运行的部分自动化流程，最终批准了
    48%的红色申请。使用它的人信任其决定。


    但问题出现了。尽管该系统背后的初衷值得称赞——使签证申请更快速、更高效、更少官僚主义——但底层技术（称为分流工具）存在缺陷。它饱受数据、透明度和流程问题的困扰，导致不公平的决定。特别是，它根据人的原籍国而非经过仔细考虑的个人标准来判断其为高风险。“他们保留了一份不受欢迎国家的名单，仅仅因为来自某个特定国家提出申请——他们拒绝告诉我们这些国家的名称——那个人就更有可能被分流为黄色或红色，”法律组织
    Foxglove 的创始人科里·克赖德说。


    2020 年春天，Foxglove 对算法流程提出挑战，认为它违反了平等和数据保护法律。就在案件即将开庭前几天，英国政府废除了该工具，承认需要审查“分流工具中关于无意识偏见和普遍使用国籍的问题”。然而，它拒绝了该系统违反任何法律的说法。


    几个月后，在新冠疫情肆虐期间，一个类似的算法试图预测英国学生的 A-Level 考试成绩。它也使用历史数据来决定个人的未来。它也存在缺陷。随之而来的是广泛的抗议，学生走上街头，高呼“去他妈的算法”。


    这两个系统都不涉及特别复杂的算法——而且都没有使用人工智能。但它们都展示了数据本质上具有风险性。无论我们可能多么想要假设，数据很少，如果有的话，是中立的。由于数据最终由人类创建，它捕捉了我们的偏见。签证系统建立在关于人们原籍国的有偏见假设的数据之上。考试系统部分基于学生所在学校的以往记录来预测结果。两者都是对未来的警告。


    ### 偏见


    由于数据是 AI 的核心，因此 AI 并非没有偏见。向系统输入错误的数据会导致错误的数据输出。偏见有三种常见形式——尽管研究已识别出 20 多种偏见类型，以及
    AI 设置中可能存在的其他类型的歧视和不公平。对于*隐性偏见*，算法将其结果与数据中的性别、种族、收入等特征相关联，从而可能延续历史上的偏见形式：例如，系统可能“学习”医生是男性，因为它接受训练的历史数据显示医生是男性。（亚马逊不得不废弃它正在使用的一个
    AI 招聘工具，该工具基于十年的简历数据进行训练，因为系统推断出，由于男性历史上被雇佣的频率高于女性，因此他们一定更优秀。）对于*选择偏见*，结果被过度代表某一群体的数据集所扭曲。（一个用于评选美容比赛的
    AI 选出了大部分白人获胜者，因为它接受训练的数据集大部分包含白人图像。）对于*交互偏见*，系统会从人们与其交互时表现出的偏见中学习。（微软的聊天机器人 Tay
    于 2016 年在 Twitter 上推出，在使用的头二十四小时内变得更加连贯，但也重复了人们发送给它的所有性别歧视和种族歧视语言。）


