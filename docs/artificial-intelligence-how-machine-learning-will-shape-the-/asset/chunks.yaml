    # 5


    ## AI 和工作世界


    如果你想了解 AI 目前处于什么阶段，以及它接下来将走向何方，Ocado Technology 并不是一个糟糕的起点。在这家英国在线杂货科技公司的仓库里，由
    AI 引导的机器人沿着轨道以每秒四米的速度飞驰，几分钟内就能拣选出包含 50 件商品的订单。Ocado 的配送卡车随后行驶的路线由一个神经网络进行优化，该网络每秒进行超过
    1400 万次最后一公里路由计算，并且每当客户下新订单或向购物清单添加额外商品时，都会调整配送路线。


    但 Ocado 最雄心勃勃的自动化工作涉及包装机器人。撰写本文时，该公司拥有五台由计算机视觉驱动的机器人拣选臂，以及其他机器学习系统，这些系统可以识别需要包装的产品，并利用吸力将其抓取。与两个欧洲学术主导的项目合作开展的进一步进展正在筹备之中。


