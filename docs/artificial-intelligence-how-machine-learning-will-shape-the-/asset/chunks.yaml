- raw: 'Picking and packing aren’t easy if you’re a robot. ‘From a human’s perspective,
    it is a fairly simple task to pick and pack, and it doesn’t require an awful lot
    of training,’ says Alex Harvey, chief of advanced technology at Ocado Technology.
    ‘For a computer and for a robot, the dexterous manipulation involved is far beyond
    the state of the art today to be able to pick and pack the full range of items
    that we do.’


    Ocado’s Robotic Suction Pick (RSP) machine is a vacuum cup, powered by an air
    compressor, that sits at the end of an articulated arm. It uses computer vision
    and built-in sensors to select items gathered by a bot and place them into a shopping
    bag. Ocado.com sells a vast range of products, running into the tens of thousands.
    In terms of outward physical appearance, some are much the same: a tin of chopped
    tomatoes, for example, is not that different from a tin of lentils. But a tin
    of chopped tomatoes is very different indeed from a pack of yoghurts, which in
    turn are more sturdy than, say, a bunch of grapes. And, of course, even grapes
    aren’t all the same – they vary according to their variety and state of ripeness.
    Get the pressure of the vacuum cup wrong and the RSP will either drop or crush
    the item it is attempting to manipulate. Get the sequence wrong and there’s a
    danger that the tin of tomatoes will squash the grapes.


    At present, the company is expanding the number of items its robotic suction system
    can pick. ‘There’s no point having for sixty thousand different items, sixty thousand
    different control pieces of code,’ Harvey says. ‘What we want at Ocado is generalised
    control strategies.’ But challenges remain. ‘We need to fit a robot into the same
    square footage that the person sits in or operates in, and we need the robot system
    to achieve the same throughput.’ Until a robot can pick and pack as many items
    in an hour as a human being – Harvey says this is around 600–700 items – it is
    unlikely to be widely adopted: the impact on productivity would damage service
    and profits. It also has to be affordable, which means, on the one hand, scaling
    the technology to the point where it becomes economically worthwhile, and, on
    the other hand, not over-speccing it (for example, by using a camera with an unnecessarily
    high resolution). ‘When we’re deploying stuff in the real world, we want it to
    be economical in the way that we’re deploying it,’ Harvey says. ‘I don’t want
    to deploy a supercomputer next to every robot picker.’


    Whether or not such AI will ultimately replace humans is the billion-dollar question.
    Many now believe AI will work alongside humans. Obviously, AI offers the promise
    of greater efficiency, but so far, at least, this tends to hold good only where
    the environment is relatively controlled and predictable. Production lines and
    warehouses may well become fully automated. But where processes interact with
    the outside world – with all its randomness – it’s harder to envisage a wholly
    AI future. Delivery drivers, for instance, have to take into account such factors
    as the weather and the erratic behaviour of some pedestrians. It’s possible that
    there will be a future without them. It’s also possible, though, that AI will
    control lorries and delivery trucks on major highways where conditions are relatively
    predictable, and that human drivers will take over the driving as they reach the
    outskirts of the villages, towns and cities set as their destinations.


    Arguably, it’s the medical sphere where AI’s potential and its limitations have
    been most apparent – and where its possible future relationship with humans has
    been most clearly demonstrated. Take Google’s computer-vision system, for example.
    It’s capable of spotting diabetic retinopathy, a complication of diabetes that
    can cause sight loss. In lab conditions, it can achieve an accuracy rate of 90
    per cent and provide results in ten minutes.


    When put to a real-world test in Thailand, however, the deep-learning set-up often
    struggled.


    And then there was the human factor. At one clinic half the patients earmarked
    for the study declined to be involved after finding out that although the results
    would be virtually instantaneous (previously some results had taken ten weeks
    to arrive), a positive diagnosis would see them being referred to a hospital an
    hour’s drive away. One member of medical staff told the Google researchers that
    patients ‘are not concerned with accuracy, but how the experience will be – will
    it waste my time if I have to go to the hospital?’


    There’s little doubt that the technology works: tests in the trial proved accurate
    when conditions were right. And when things were going well, Beede says, senior
    nurses felt they had more time to spend with patients and speak to them about
    their health and lifestyles. But the unpredictability of the everyday world and
    the needs and concerns of humans cannot be ignored. ‘I think the main takeaway
    from this research is that we need to be designing AI tools with people at the
    centre,’ says Beede. ‘We need to be considering our success beyond the accuracy
    of the model. We need to understand how it’s actually going to work for real people
    in context.’ She argues that as more AI is implemented in the real world, more
    pilot studies will be required to ensure that it works for everyone involved.
    ‘That implementation is of equal importance to the accuracy of the algorithm itself,
    and cannot always be controlled through careful planning,’ the Google report concludes.


    The need for a proper and carefully considered partnership between humans and
    AI has been well demonstrated by Finale Doshi-Velez, a Harvard University computer
    science professor who leads its Data to Actionable Knowledge Lab. In one experiment,
    she and her colleagues recruited 220 psychiatrists to study case notes for hypothetical
    patients supposedly suffering from major depressive disorder.


    ‘What we found was that when the recommendation was correct, overall, everything
    improved,’ Doshi-Velez says. Doctors and AI decisions proved to be a formidable
    team. ‘Humans may have already had an idea, the recommendation reinforced it or
    caused them to change their mind to that idea.’ However, when the recommendation
    presented to the volunteer doctors was incorrect, it tended to lead to poorer
    forms of decision-making. The psychiatrists were influenced by incorrect recommendations
    from the AI, leading to lower levels of treatment selection accuracy. This is
    scarcely a new phenomenon. It’s long been known that if we put machines in charge
    of simple tasks, humans will, without continuous training, forget how to do them.
    Hence, at an everyday level, why digital contact books in phones have caused us
    not to remember phone numbers any more. Hence, at an extreme level, why on 1 June
    2009 the pilots of Air France Flight 447, who had come to rely heavily on the
    plane’s autopilot features, could not cope when the systems failed, and so presided
    over a crash in which 228 people perished. With AI this ‘paradox of automation’
    is only going to become more pronounced.


    The way in which information is presented is also an important factor in determining
    the success or otherwise of the final outcome. ‘Certain forms of explanation are
    more effective at preventing a wrong decision,’ Doshi-Velez says. It’s something
    the Google Health researchers have noticed, too. In their field trial in Thailand,
    says Google product manager Lily Peng, a system notification that an image was
    ungradable and that there should be a referral could very easily be misinterpreted.
    ‘For some people it means being referred to retinal specialists, which is at the
    higher end of care, versus refer for human review, which is what ended up being
    part of the protocol,’ she explains.'
