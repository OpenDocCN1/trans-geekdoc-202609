  trans: '


    所有这些偏见都表明，使用数据来预测未来结果存在风险。而在人工智能领域，这一问题尤为突出。以执法为例。在美国，警方尤其开始使用预测系统来评估某人再犯的可能性，或是否应获准保释，或犯罪高发期可能何时出现。问题是，此类系统不可避免地会将目标锁定在历史上一直受到警方特别关注的个人和社区。“如果你使用有问题的数据，你就会得到有问题的警务，”Renée
    Cummings 解释道，她是一位专门研究刑事司法领域人工智能及其歧视性影响的研究员。在美国，黑人被捕的可能性是白人的两倍多。他们更容易在没有理由的情况下被警察拦截，黑人男性被警察杀害的可能性是白人男性的
    2.5 倍。“它始于偏见，”Cummings 说。“人工智能确实放大了系统中固有的偏见和歧视。”


    2016 年，ProPublica 的一项调查揭示了名为 `COMPAS` 的预测软件如何对黑人存在偏见。


    即使从预测性警务人工智能系统中剔除了种族数据（这是平等法律的常见要求），问题依然存在。Rashida Richardson 是 AI Now 论文的作者，目前是罗格斯法学院的访问学者，她指出，有许多形式的数据可以作为种族的替代指标。位置就是其中之一。如果你居住在一个因其种族构成而已受到严密警务监控的地区，那么该地区存档的警务报告就会更多，因此人工智能更有可能将你的地区认定为犯罪高发区。其他可能导致扭曲的数据画像包括年龄和社交联系。荷兰使用的一种预测性警务工具会将人口统计数据（如单亲家庭数量、领取社会救济人数以及非西方移民人数）作为确定特定地区发生犯罪可能性的因素。


    目前几乎没有证据表明预测性或人工智能风险评估工具确实有效。显示算法决策工具能比人类做出更好预测的研究寥寥无几，而且由于警察部门通常对其使用人工智能技术讳莫如深，其数据很少被独立分析和验证。然而，洛杉矶警察局对名为
    `PredPol` 的系统（该系统在美国多个地方使用）的一项评审表示，“很难就该系统在减少车辆或其他犯罪方面的有效性得出结论”。


    2020 年 6 月，超过 1400 名数学家签署了一封公开信，表示他们不认为该领域应该与警方合作开发这些系统。


    人工智能偏见不仅出现在警务领域。住房、就业和金融事务都曾遭受偏见问题的困扰。医疗保健正在成为最新遭受此类问题的领域。例如，在美国，加州大学伯克利分校的研究人员发现，保险公司和医院用于管理每年约
    2 亿人护理的一种算法，给自我认同为黑人的人群的风险评分，低于同样生病的白人。


    随着人工智能变得更加复杂，研究人员担心算法建立的联系将变得更加晦涩。某些类型数据的替代指标将更难以识别，机器可能会在人类不联系在一起的某些信息类型之间建立联系，或者因为正在处理的信息规模而无法看到这些联系。这种情况的最初迹象已经显现。


    例如，2019 年 3 月，美国住房与城市发展部（`HUD`）指控 Facebook 在其住房定向广告的运作方式上存在歧视。


    “算法对人群的分组不一定基于性取向或肤色，”Sandra Wachter 说道，她是牛津互联网研究所人工智能法律与伦理学的副教授和高级研究员。她说，算法会将行为相似的人群分组。“这些相似之处可能是他们都穿绿色鞋子，或者他们周二吃印度食物，或者他们玩电子游戏。”问题是，此类相关性可能导致完全错误的推断——例如，算法可能会得出结论，穿绿色鞋子的人有或没有按时偿还贷款的倾向。对任何人来说，这样的结论都荒谬至极。但对人工智能来说，这可能看起来完全合乎逻辑。


    “即使银行能够说明用于做出决策的数据和变量（例如银行记录、收入、邮政编码），决策也取决于从这些来源得出的推断；例如，申请人不是可靠的借款人，”Wachter
    写道。


    ## 监控


    如果人工智能在处理数据时已被证明存在问题，那么在处理涉及人类的图像（尤其是通过面部识别技术）时，它也表现出了严重的缺陷。


    这些系统的工作原理在理论上相当简单。例如，如果连接到人工智能系统的监控摄像头检测到一张人脸，就会测量面部特征之间的距离（如额头与下巴之间的距离），并创建一个生物特征地图。此地图用于创建面部特征码（实际上是一系列数字）。然后将其与数据库中其他面部特征码进行比对，以寻找可能的匹配项。底层算法已在数据集中对人脸与其他人脸的匹配进行过训练。


    世界各地的警察部队使用此类人工智能来检测其系统中已登记为罪犯或潜在罪犯的人员。在实时部署使用时，如果出现匹配，现场警官会收到警报并可以追踪嫌疑人。一些运行实时面部识别系统的摄像头有明显标记。但许多更复杂的型号看起来与其他闭路电视摄像头没什么两样。2020
    年推出的一款特别先进的摄像头系列，使用六种人工智能算法，提供高达 1200 万像素的分辨率，并将面部识别与人群计数和车牌识别相结合。它可以监控周界和队列，甚至可以检测人们是否佩戴安全帽。


    至少，理论是这样。在实践中，实验室测试中的高准确性往往无法在现实世界中复制。低光照会严重干扰面部识别，低质量的视频素材也是如此。阳光尤其令人头疼。在英国警方早期进行的实时面部识别系统试验中，2470
    张人脸被判定与警方数据库中的人脸匹配。但实际上，只有 8% 是匹配的。所有其他所谓的匹配都证明是错误的。


    准确性是一个问题。由于许多系统主要在白人图像上进行训练，因此在检测黑人和棕色人种面孔时往往准确性较低。因此已经发生了错误识别事件。2020 年 1 月，来自密歇根州的
    41 岁黑人 Robert Williams 因算法导致的错误逮捕而被拘留了三十个小时。


    '
