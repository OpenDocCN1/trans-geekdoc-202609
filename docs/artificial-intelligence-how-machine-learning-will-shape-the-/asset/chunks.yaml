  trans: '


    # AI 取得巨大进展的一个领域是自然语言处理


    今天，机器可以与人类沟通，并以超越人类的速度和准确性理解我们发送给它们的消息。这对改善呼叫中心的客户服务具有巨大潜力，但该技术也对整个社会产生影响。能够更自然地与计算机——以及人类——交互，对社会、文化和经济问题可能具有深远影响。


    除了第一句话之外，你刚刚读到的段落并非由我撰写。它是由 AI 撰写的。它可能并非绝对完美，但确实展示了自 20 世纪 50 年代建立以来，自然语言处理（NLP）领域取得了多大的进步。涵盖从语言翻译到创建书面作品摘要的方方面面，如今
    NLP 技术是聊天机器人、Siri、Alexa 以及手机上的自动补全系统的核心。


    可以说，没有哪个 AI 领域像 NLP 那样从大数据中获益匪浅。研究人员创建的语言模型的大小，简单来说，是巨大的。例如，上面的 AI 生成段落来自 Megatron-11b
    语言模型，该模型拥有 110 亿个参数。但那只是沧海一粟。2020 年中期，位于旧金山的 AI 实验室 OpenAI 发布了其文本生成系统的最新版本：GPT-3。它包含了惊人的
    1750 亿个参数。


    GPT-3 或许是有史以来最先进的语言模型。向系统输入文本——无论是几句话还是几段——它就能以几乎无法与人类创作的散文区分开来的方式继续这段文字。如果告诉它应该产生的写作风格，它可以复制该风格。GPT-3
    可以像威廉·莎士比亚——或者任何历史人物——那样写作；它可以写创意小说，并已被实验性地用于内容审核。它也被用于编程。一位开发人员构建了一个网页布局生成器，一旦给出特定设计的书面描述，就能自动生成创建它的代码。另一位开发人员使用它创建了一个搜索引擎，可以回答向它提出的问题。


    “结果相当真实，因为它事先了解主题，并且在如此多的事物上进行了训练，”Samanyou Garg 说，他是一名正在构建 AI 电子邮件答复程序和使用 GPT-3
    撰写营销文案系统的研究人员。“根据我测试的情况，它在写作文本方面非常出色——可以是文章，可以是博客文章，也可以是生成一些营销材料。”


    与所有深度神经网络一样，文本生成系统通过在其训练数据中寻找模式，并在单词及其使用方式之间建立联系来工作（在 GPT-3 的情况下，是通过无监督学习）。当你向其中输入提示词时——例如本节的第一句话——它基本上是在猜测下一个应该是什么单词。不过，这些并非随机猜测：它们基于对最可能跟随的单词的有根据的计算。


    该系统远非完美。问它一个愚蠢的问题，它会编造任何答案。不时它会插入一些意义不大的句子。它有可能被用来为那些想要破坏社会的人生产假新闻和错误信息。它还有可能复制其学习数据中的人类偏见。Facebook
    的 AI 负责人 Jerome Pesenti 在推特上发布了 GPT-3 在收到单词提示（例如“犹太人”或“#blacklivesmatter”）后输出的种族歧视和性别歧视辱骂的例子。


    话虽如此，让 AI 研究人员对 GPT-3 感兴趣的是它所代表的质变。在早期迭代中，它有 15 亿个参数，然后是 1170 亿个，然后才达到目前的 1750
    亿个。每次升级后，其结果都大幅改善。这表明，仅仅增加输入此类系统的数据量，就能让 AI 更接近通用智能。


    GPT-3 并非唯一的选择。另外两个重要的自然语言处理模型来自 Google（其模型称为 BERT）和中国的谷歌等效公司百度（其模型称为 ERNIE）。这种半开玩笑的命名代表了开发
    AI 的大型科技公司之间既有竞争又有熟悉感。Google 和百度都拥有巨大的资源和对互联网的了解。它们也都成功地将深度学习用于翻译。


    迄今为止，绝大部分 NLP 研究都集中在英语上。不可避免地，这意味着世界上大片地区没有从 NLP 模型和进步中受益。例如，非洲尽管规模巨大、全球重要性极高，并且该大陆拥有超过
    2000 种语言，却几乎未被涉及。幸运的是，Masakhane 项目正在尝试改变这一现状。它号召来自三十个不同非洲国家的约 400 名 AI 研究人员的技能，已从
    38 个以上国家制作了 49 个不同的翻译项目，构建了新的数据集和训练模型，并发表了研究成果。在此过程中，它也面临着自身需要克服的挑战。参与研究人员之一 Bonaventure
    Dossou 表示，在为贝宁使用的 Fon 语言构建数据集的过程中，他不得不创建一个可以正确输入该语言的键盘。“当地艺术家实际上\[现在\]能够用 Fon
    语写下歌曲歌词，”他说。


    认为向翻译模型添加更多语言仅服务于地方利益是错误的。事实上，这可以造福所有人。百度的工作人员发现，随着更多特定语言被添加、学习和翻译，其 AI 对语言的整体理解也会增加。“映射不同语言之间的任何相关性是这一过程的必要组成部分，”该公司的一位发言人表示。截至
    2020 年，该公司的翻译工具支持超过 200 种语言，每天翻译 1000 亿个字符。“在开发基于深度学习的神经网络翻译模型时，我们发现，尽管语言在符号和语法上存在巨大差异，但在语义上可以非常相似，”发言人继续说道。“在许多层面上，无论人们使用何种语言变体进行交流，人类对世界的认知、描述和表达都是一致的。”


    现在被处理的数据量令人咋舌。例如，OpenAI 发布的一篇关于 GPT-3 的研究论文显示，该团队最初使用了对研究人员开放的 Common Crawl 数据集。


    其他数据来自历史书籍（已过版权保护期）以及从网络各处提取的信息。数百万个网页及其文本被抓取。事实上，你在英语互联网上遇到的任何类型的写作，很可能都已包含在该模型中（OpenAI
    也未透露用于训练 GPT-3 的信息的完整规模）。


    但这里存在一个问题——而且这个问题适用于所有深度学习。处理如此巨大的数据量需要消耗巨大的能量。OpenAI 承认了这一点，称其模型消耗了“大量资源”，尽管它没有透露潜在的环境影响或成本。未经证实的估计将训练的能源成本定为高达
    1200 万美元。无论真实数字如何，毫无疑问的是，更大的数据集即将到来，并且它们将消耗成比例更多的能量。AI 艾伦研究所的研究估计，2012 年至 2018
    年间，深度学习研究所需的计算量增加了 30 万倍。


    '
