- raw: 'Photoshopping has, of course, been around for decades. But deepfakes are far
    more sophisticated and can be just as convincing. Rather than simply relying on
    a human agent to fit images from different sources together, they feed original
    footage through an AI program that is able to use the data supplied to generate
    new data. Generative adversarial networks (GANs), created in 2014, are the commonest
    tool in use in this sphere. The larger the dataset with which they are supplied,
    the more realistic the images they generate.


    Deepfakes are yet another instance of the challenges to society that AI poses.
    Their use can be entirely innocent. But they can also cause real harm. And the
    technology behind them has come a long way since the first poor-quality images
    created on Reddit. It’s growing exponentially and is being democratised in the
    process through freely available online tutorials and open-sourced code. In July
    2019 the deepfake detection cybersecurity company Sensity found 14,678 deepfakes
    online.


    It’s not just a problem for movie stars and musicians. YouTubers, Instagram stars
    and women who stream on Twitch have also been targeted by the technology. In October
    2020 it was revealed that an AI bot on the messaging platform Telegram was using
    deepfake technology to ‘strip’ the clothes from photos of women and generate naked
    body parts in their place. More than 100,000 women had been victims. Most of those
    creating the images say they used the technology against women they knew.


    The fact is that the tentacles of online faking are reaching ever further. During
    the summer of 2019, for example, journalists working for AP found a faked LinkedIn
    account, with connections to leading influential US figures, was using a profile
    image developed by a GAN. ‘We encounter them very frequently on LinkedIn and Twitter,
    not even with us looking for them, we just come across these,’ explains Henry
    Ajder, at the time of speaking a threat intelligence researcher at Sensity. ‘These
    images are super-readily available, they are incredibly easy to access.’ In December
    2019 Facebook removed pages originating in Georgia and Vietnam that Sensity confirmed
    had used fake images as profile pictures.


    Audio is being similarly manipulated and it can help with financial scams. Cybersecurity
    company NISOS documented a case (with accompanying audio evidence) from June 2020
    when an employee at a tech firm received a voicemail, apparently from their CEO,
    asking for an urgent payment to be made.


    As for AI-generated text, a US college student, Liam Porr, reported using GPT-3
    to create blog posts that went on to be read 26,000 times within two weeks of
    their online publication.


    At the moment the quality of synthetic media varies considerably. Even so it can
    prove persuasive, particularly among people who are socially or politically biased
    in favour of the message it is pedalling. A video of Nancy Pelosi, the Speaker
    of the United States House of Representatives, which had been deliberately slowed
    down to make her appear drunk, was viewed millions of times after its release
    in May 2019. In Gabon in early 2019, a video of the country’s president – which
    some called a deepfake although no researchers were able to conclusively prove
    it either way – led to military unrest.


    Once synthetic media is supercharged it will inevitably be even harder to spot.
    Software tools will make it easy for anyone to manipulate video, text, audio and
    images convincingly. Efforts are being made by researchers to develop AI tools
    to spot deepfakes, but these have a long way to go. It seems inevitable that laws
    will need to be updated to offer better protection to individuals, that social
    media platforms will need to enforce robust policies, and that those who are the
    victims of malicious synthetic media will be able to win full recourse.


    And there’s no doubt that supercharged synthetic media is on its way. According
    to a report from Samsung Next, the investment arm of the South Korean tech giant,
    more than 170 start-ups working in the AI synthetic media landscape were in operation
    in November 2020. They ranged from companies such as Sensity, which is trying
    to mitigate the threat of synthetic media, to firms working on generating new
    content to be used in videos, audio recordings, advertising, apps and much more.
    Some are trying to build AI systems that can read out loud in the same natural
    way humans do, complete with pauses and expression. Others are seeking to turn
    written news articles into videos hosted by AI news anchors, to swap people’s
    faces into their favourite movie scenes, and to create realistic avatars that
    can be used in the multi-billion-dollar gaming industry.


    AI is making its way in Hollywood, too. The movie industry has been using CGI
    and visual effects for decades. Synthetic video offers studios the possibility
    of being able to cut down on filming costs and use performers in new ways. That’s
    still some way off, but Victor Riparbelli, the CEO of synthetic video company
    Synthesia, predicts that ‘In ten years’ time, I think you can produce a Hollywood
    film on a laptop.’


    Such potential advances serve as a reminder that, as with all technology in general,
    and AI in particular, synthetic media carries great promise as well as posing
    challenges and threats. Even now, some of the ways in which it is being used show
    that it is capable of much more than fake footage and dishonest messaging. In
    February 2020, during an Indian election campaign in Delhi, Manoj Tiwari, the
    president of the Bharatiya Janata Party (BJP), was able to reach an estimated
    15 million people by releasing two videos: one in which he spoke in English, the
    other in which a dubbing artist impersonated Tiwari and a lip-sync algorithm then
    altered his mouth to allow Tiwari to appear to be communicating in fluent Haryanvi,
    a Hindi dialect.


    Riparbelli says much of Synthesia’s work in the near future will focus on turning
    text into information videos. ‘You can imagine if you’re a big company with lots
    of retail workers, sending out a five-page PDF document on new security guidelines,
    it’s not an effective way to communicate with them,’ he explains. AI can turn
    these documents into an engaging video. ‘We see ourselves not as a replacement
    for normal video – this is not something which you buy to save money in a video
    production. This is an alternative to text.’


    Riparbelli is quick to point out that synthetic media cannot possibly work in
    all situations. It’s unlikely, for example, that anyone would respond kindly to
    a one-on-one meeting with their boss that actually involves chatting to a synthetic
    video powered by an AI chatbot. He also thinks transparency is essential: ‘I think
    a lot of the places where you’ve got to be served synthetic videos, it’s going
    to be obvious that it’s a synthetic video.’ If that can be achieved more generally,
    then some of the currently problematic aspects of synthetic media will be considerably
    mitigated.


    # 5


    ## AI and the world of work


    If you want to get a sense of where AI is now, and where it’s heading next, Ocado
    Technology is not a bad place to start. At the warehouses of the British online
    grocery tech company, robots, guided by AI, whizz around on rails at speeds of
    up to four metres per second, picking a 50-item order in minutes. The journeys
    then taken by Ocado’s delivery trucks are optimised by a neural network that makes
    more than 14 million last-mile routing calculations per second, and adjusts delivery
    routes each time a customer places a new order or adds extra items to their shopping
    lists.


    But Ocado’s most ambitious automation efforts involve packing robots. At the time
    of writing the company has five robotic picking arms powered by computer vision,
    and other machine-learning systems that can identify the products that need to
    be packed and use suction power to grab them. Further advances, undertaken in
    conjunction with two European academic-led projects, are in the pipeline.'
