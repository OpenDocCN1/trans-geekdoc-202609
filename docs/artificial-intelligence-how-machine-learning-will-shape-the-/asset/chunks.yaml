- raw: '‘In Japan, we have a more positive, utopian view,’ says Toshie Takahashi,
    a professor studying the impact of AI at Waseda University, Tokyo. One narrative
    popular there involves Doraemon, a blue robot cat with neither claws nor ears
    that travels back in time to help a boy called Nobita Nobi. Perhaps the results
    of Takahashi’s research suggest a future path for our relationship with AI. She
    has shown that almost 70 per cent of young people in the country have a positive
    image of it (‘People talk more about social good or social benefits, especially
    for an ageing society’), but that 60 per cent of them don’t want AI to be in humanoid
    form. In general, as Dihal points out, there’s a gradual move to presenting AI
    as something that isn’t human or a danger to society. ‘There’s an increase in
    exploring narratives where the artificial intelligence doesn’t look exactly humanoid
    or isn’t embodied at all.’ In other words, we may be heading for a future where
    we don’t judge AI in terms of human capabilities.


    # 2


    ## AI takes off


    Jeff Dean and Andrew Ng didn’t set out to teach their AI what a cat looked like
    – it learned on its own. ‘It basically invented the concept of a cat,’ Dean told
    the *New York Times* in 2012,


    Dean and Ng’s achievement, at Google’s experimental technology lab X, showed just
    how far AI had come in the fifteen years since IBM’s Deep Blue beat Garry Kasparov.
    That event had helped stimulate a resurgence of interest and research into AI.
    Over the following few years, AI would compete against humans at backgammon. The
    first robotic surgical systems were developed. Advances were made in machines’
    ability to recognise speech, understand written language and recognise hand-written
    digits.


    Various factors made Dean and Ng’s feat possible. By the start of the new millennium,
    the cost of hardware had dropped massively from just a decade before. It was much
    faster, too. In addition, AI researchers were benefiting from the discovery that
    the best computer chips to use for their work were not traditional central processing
    units (CPUs) but the graphics processing units (GPUs) that render the graphics
    in computer games (invented by Nvidia in 1999, they have around 200 times more
    processors per chip and can crunch data at faster speeds). Finally, with the global
    internet acquiring its first billion users by 2005 and the looming spread of smartphones,
    the amount of data available to ‘train’ neural networks was growing exponentially.


    Given these advances, it was no surprise that AI was breaking out from niche computer
    science departments to Silicon Valley. Big tech’s largest companies were now busy
    snapping up AI researchers, and paying them huge salaries to turn their attention
    to the vast datasets owned by their new employers. Google’s lab X was a leading
    example.


    To get their AI to learn what a cat was, Dean and Ng’s team produced a giant network
    of 16,000 computer processors, with one billion connections, trained on ten million
    random YouTube video thumbnails.


    Another – arguably more significant – achievement in 2012 was made by the artificial
    neural network, later named AlexNet, created by three researchers at the University
    of Toronto: Alex Krizhevsky, Ilya Sutskever and Geoffrey Hinton – the latter a
    pioneer in the world of AI. Using a traditional convolutional neural network with
    a GPU for the first time, it achieved overnight fame by winning that year’s ImageNet
    competition.


    By 2015 further advances had been made in speed and accuracy. The winners of that
    year’s ImageNet hit 96 per cent accuracy levels, besting human efforts at recognising
    objects in images for the first time. One year earlier, Facebook’s person recognition
    DeepFace neural network hit accuracy levels of 97.35 per cent for some faces –
    just a quarter of a per cent lower than humans scored in the same test. Facebook’s
    neural network was trained using 4.4 million labelled face pictures from 4,030
    people using the social network.


    It was at this time that another major player in the AI race started to garner
    headlines. DeepMind, a London-based AI company which Google purchased for a reported
    $400 million in 2014, had been a relatively obscure start-up. But it took the
    research world by storm with its announcement that its deep Q-network – a deep
    neural network using reinforcement learning – was able to win 49 classic Atari
    games, including *Space Invaders* and *Breakout*, despite being given only given
    limited information about them. ‘We’re trying to build a single set of generic
    algorithms, like the human brain,’ the company’s co-founder Demis Hassabis told
    *WIRED*.


    In March 2016 DeepMind took a quantum leap forward and, employing its AlphaGo
    system, managed to defeat the world champion of the 3,000-year-old board game
    Go. At one level, this might sound like an achievement on a par with Deep Blue’s
    defeat of Kasparov a couple of decades earlier. But Kasparov had been able to
    go toe-to-toe with Deep Blue, drawing most of the matches in the series before
    resigning, head in hands, in the final game. And he had been playing chess. Go,
    which is played on a 19×19 board with white and black tokens, is infinitely more
    complex (many AI researchers didn’t believe a machine would be able to beat the
    world’s best human players for several decades), and Lee Sedol, the world’s number-one
    Go player, who had won the game’s top title eighteen times, was, unlike Kasparov,
    trounced. He lost 4–1.


    AlphaGo initially learned how to play by watching humans, but over time it developed
    its own decision-making skills. Under the hood were multiple neural networks,
    embodying years of AI progress, and the power of Google’s global data centres.
    One neural network would select the next move to play. Another would aim to predict
    the winner of the game based on the moves so far made. The result was a system
    that didn’t just regurgitate styles of play it had learned from watching thousands
    of human moves, but invented its own. In one particular match the machine directed
    the person laying the physical pieces to make a move so unexpected that no human
    would have thought to have made it. ‘It’s not a human move. I’ve never seen a
    human play this move,’ said Fan Hui, a three-time European Go champion, who was
    commentating on the game and had worked with DeepMind to play hundreds of training
    matches against AlphaGo preceding its victory over Lee. ‘So beautiful.’


    Since that match against Lee the AlphaGo system has advanced further. In fact,
    it has gone beyond human knowledge. One version, dubbed AlphaGo Zero, learned
    how to play the game from scratch without being trained on previous human games
    – and in the process it learned to beat AlphaGo. DeepMind says it ‘accumulated
    thousands of years of human knowledge’ in just a few days. The next version, AlphaZero,
    was able to play not only Go but also chess and Shogi, without having to be adapted
    to play each different game.


    On 30 November 2020, DeepMind announced that its AI systems had moved beyond games
    to crack one of biology’s toughest challenges. Its AlphaFold system, it revealed,
    had managed to generate accurate 3D models of proteins, highly complex substances
    that are present in all living organisms.'
