  trans: '


    也存在隐私问题。闭路电视摄像头如今无处不在，我们几乎无法决定它们的安装位置或其图像的使用方式。随着时间的推移，它们可以升级为使用人脸识别技术。警察部队声称人脸识别可以让我们的生活更安全，并且是打击犯罪的重要武器。但这种优势必须与公民自由考量相权衡。在英国，几个人因决定遮住面孔而非被监控技术扫描而被拦下并盘问。一名青少年在法院已经处理完相关事务后被拦下（此处是过时数据库惹的祸）。


    也许在国家层面，监控世界的利弊最为明显。当然，在国家层面，其权力的真实范围也最为清晰。看看印度在 2020 年 4 月新冠疫情早期几周如何使用监控人工智能。随着第一波疫情蔓延，德里和孟买的警察部队派出无人机监控人们，以执行全国封锁并改善社交距离（孟买的一家本地初创公司通过捐赠
    45 架无人机做出了贡献）。机载摄像头拍摄了潜在非法聚集的画面，扬声器则播放命令人群散播的信息。实时观看视频的警察可以将警员调往需要的地方。


    与此同时，在旁遮普邦第二大城市阿姆利则，空中监控被进一步强化。初创公司 Skylark Labs 飞行无人机，利用计算机视觉精确检测人们站得有多近（如果他们站得足够远，周围会出现绿色边框；如果太近，则会出现红色边框）。Skylark
    的首席执行官 Amarjot Singh 解释道：“有一个映射算法，将整个城市的地图划分为十个网格，我们只需告诉\[警察\]选择他们想要飞行的网格——无人机就会自动起飞并在该网格内飞行。”他补充道：“如果检测到人，它就会标记该人，并向该地区附近的警察手机发送消息。”该系统随后推广到另外六个城市。最终开出了两百张罚单，并扣押了一些汽车。该技术的使用为政府控制公民设定了令人担忧的新先例——人们的行为正在头顶上方被悄悄监视。


    印度并非唯一由州和地方政府部署此类侵入性监控的国家。卡内基民主、冲突与治理项目高级研究员 Steven Feldstein 表示：“尝试采购、购买和投资这些系统的国家比我预想的要多。”他进行了首次关于人工智能监控——智慧城市系统、人脸识别和智能警务设置——在全球如何使用的审查。他估计，到
    2020 年夏天，179 个国家中有 77 个国家正在部署此类技术。


    而且，该技术在范围和雄心上都在不断扩大。人们现在可以通过虹膜、纹身、行走方式（步态识别技术）等被识别，而且不止于此。很快将无处可藏。中国和英国的研究人员构建了一个系统，能够在数周内识别人，即使他们改变了衣服和发型。


    一些当局对这些进步持谨慎态度。在美国，一些州已禁止人脸识别系统，俄勒冈州波特兰市采取了最彻底的禁令（连当地的企业也不允许使用该技术）。据报道，欧盟也在考虑类似限制。另一方面，在印度等国家，该技术正获得越来越大的影响力。那里的官员曾吹嘘，该技术在
    2020 年 2 月德里两天内发生的暴力骚乱中识别出 1100 人方面起到了关键作用。印度政府部长 Amit Shah 在被问及无辜人士被摄像头监控时据报道说道：“这是一种软件。它不看信仰。它不看衣服。它只看脸，通过脸，人就被抓住了。”


    对该技术来说，最极端的测试案例是中国。没有哪个国家像这个共产主义超级大国那样热衷于推进监控系统。它常规性地收集关于公民的大量数据，并广泛实施人脸识别技术。Steven
    Feldstein 表示：“中国模式相当独特。没有哪个国家在复制甚至有意愿进行全面监控方面能与他们相提并论。”中国也是全球最大的人工智能监控技术出口国。Feldstein
    估计，华为、海康威视、大华和中兴向 63 个国家提供技术。仅华为就向 50 个国家提供技术——远远领先于下一家最大的非中国公司日本 NEC（该技术在 14
    个国家使用）。


    上海研究院的研究人员于 2020 年 6 月发表的一项研究，让人一窥如果技术不受约束，反乌托邦的未来可能是什么样子。该研究利用中国 10 万部电梯中的安全摄像头网络，以及其他传感器（测量移动、温度等），并将数据输入多个算法，以帮助判断人们的行为是否“不正常”。


    每次电梯在某一层停下时，就会拍摄一张照片。研究人员在论文中表示：“来自 10 万部电梯的每一层大约有 100 万条记录。”总共检测到 643 起人们可能行为异常的情况。其中，超过
    100 起是由于设备错误，或网络安全摄像头采集的图像并非来自住宅楼（例如购物中心电梯或办公楼中的摄像头）。在 289 起案例中，研究人员认为“这里有不同之处”，并决定建筑管理人员应进一步了解详情。研究称，三起被标记的事件似乎显示人们在自家公寓内经营餐饮服务；六起事件暗示了过度拥挤。


    尽管该系统运行规模巨大，但相对比较原始。它并非实时工作，且收集的数据量庞大，导致研究人员没有分析人们的年龄和可能的职业。但潜力存在。这种潜力——不仅是检测不法行为，还包括窥探和控制那些没有做错任何事的人——对日常生活的方方面面都有令人担忧的影响，从家庭生活的日常惯例，到监控人们在工作中的生产力并为他们设定目标，再到在商店和机场监视我们。


    中国政权批评者会指出的一个大规模监控的压迫性实例，涉及该国以穆斯林为主的少数民族维吾尔族。据《纽约时报》报道，在 2019 年的某个地区，仅一个月内，人脸识别就被使用了
    50 万次，用于筛选经过摄像头的人是否为维吾尔族。


    ## Deepfakes


    2017 年底，一名匿名 Reddit 用户改变了网络世界。该用户以“deepfakes”为化名，开始分享名人的色情视频，使用深度学习将原始表演者的面孔替换为名人的面孔。泰勒·斯威夫特、加朵·加朵、梅茜·威廉姆斯和斯嘉丽·约翰逊只是部分受害者。自那以后，深度伪造已变得影响深远。


    '
