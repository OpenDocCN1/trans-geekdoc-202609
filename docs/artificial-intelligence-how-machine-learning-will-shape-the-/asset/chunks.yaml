  trans: '


    一旦这种情况发生，世界将会发生重大变化。人们的工作场所将面临比本世纪初任何时候都更大规模的自动化。对许多人来说，工作的整体性质可能会改变。我们与企业和政府服务的互动方式也将被改变。部署人工智能的社会需要了解人们如何反应这项技术以及他们对它的期望。与此同时，个人只有在系统运行高效、易于理解——并且可以信任的情况下，才会遵循人工智能给出的指示。


    # 6


    ## 武器化人工智能


    人工智能不可阻挡的崛起伴随着其政治化。这不仅仅是因为它为社会更高效地运行提供了潜力，或者它现在与经济成功紧密相连。而是因为它已成为争夺技术主导权的武器，而这种主导权伴随着巨大的政治影响力。在
    20 世纪 60 年代，前苏联和美国在太空竞赛中竞争。今天，美国和正在崛起的超级大国中国正在寻求在争夺控制技术世界及其基础设施的斗争中获得霸权。


    ### 政治


    长期以来，一直是西方大学、科技公司和政策制定者推动创新，来自世界各地的人才涌向美国从事人工智能工作。现在，中国正在寻求从 5G 到人工智能发展的各个领域推动技术标准。其野心是认真的。2017
    年，该国的执政党共产党宣布了到 2030 年成为人工智能世界领导者的目标。它目前正在人工智能开发上花费数十亿美元，其中大部分在私营部门。美国智库安全与新兴技术中心的分析表明，中国政府在
    2018 年在人工智能投资上的支出大约与美国计划在 2020 年支出的金额相同。


    其他指标也显示了中国的承诺。自 2005 年以来，它发表的人工智能研究论文比美国多，即使并非所有论文都对学术界产生了与美国工作相同的影响。然而，根据艾伦人工智能研究所
    2019 年 5 月的分析，这一情况即将改变，该分析表明，在一年之内，由中国主导的研究论文被他人引用的数量将与被引用的美国论文数量相匹配。


    中国目前可能在人工智能硬件开发方面落后于美国和其他国家，但它 nonetheless 拥有世界领先的人工智能软件公司之一。商汤科技、Face++ 和海康威视都在人脸识别方面处于领先地位。阿里巴巴、百度和腾讯现在在支出能力和对人工智能潜在员工的吸引力方面与谷歌、Facebook、微软和苹果不相上下。


    该国还将其影响力扩展到世界上许多经济欠发达国家。中国的“一带一路”倡议为发展中国家提供了新技术，这些技术在未来将由人工智能驱动。“在非洲，后端网络基础设施现在基本上几乎完全是中国的，介于华为和中兴之间，”负责中国非洲项目的埃里克·奥兰德说。“在加纳，他们在短短几年内就从
    700 个\[闭路电视\]摄像头增加到了 7000 个摄像头。”奥兰德补充说，在冠状病毒大流行期间，中国公司向非洲国家捐赠了技术，以帮助他们抗击病毒。例如，华为在
    2020 年春天提供了视频会议系统和热成像温度扫描仪，以及一些现金。


    然而，技术竞争并不仅限于中国和美国：世界各地的其他国家也在投资人工智能研究和开发，旨在跟上全球领导者的步伐，并寻求在本国部署这些技术。这种竞争不太可能导致技术的分裂，或简单地在中美之间形成两极分化。世界上大部分人工智能开发高度互联，不太可能完全被政治竞争所分割。它由开源出版、研究、突破和任何拥有互联网连接的人都可使用的培训数据集所主导。尽管如此，随着中国寻求实现其超级大国目标，国际紧张局势可能会增加。


    从短期来看，人工智能的扩张引发了监管问题。一些人声称，涵盖人权和数据保护的现有法律足以防止滥用。另一些人认为，人工智能引发了全新的问题，只能通过特定法律来解决。有些人对人工智能技术的特定方面感到紧张（几个美国城市已禁止使用人脸识别技术）。有些人认为，在某些领域根本不应该使用它（人工智能界普遍认为，该技术不应用于自主武器系统，例如无人机，这些系统可以在没有人类干预的情况下夺走生命）。


    欧盟可能最终会在这方面引领方向。其《通用数据保护条例》（GDPR）于 2018 年开始实施，重新定义了世界各地处理个人信息的方式。现在，它将注意力转向制定关于人工智能使用和控制的法律，如果和当颁布时，这将构成首个跨国人工智能监管（指南原定于
    2020 年发布，但随后推迟到 2021 年的未指定日期）。“我们想要一套以人为本的规则，”欧盟委员会主席乌尔苏拉·冯德莱恩在 2020 年 9 月表示。“算法不能是黑箱，如果出了问题，必须有明确的规则。”


    冯德莱恩的言论是在一份白皮书发布之后发表的，该白皮书阐述了欧盟可能采取的措施：例如，引入规则来管理“高风险”人工智能系统（例如用于医疗、警务和交通的系统）以及人工智能使用可能导致歧视、伤害或危及人类生命的情况。值得注意的是，共识观点还很遥远。在欧盟咨询的
    1200 多个团体中，42%认为需要新法律来管理人工智能，而 33%认为现有立法可以胜任。在可能的高风险人工智能应用方法上也存在类似的分歧（42%对 30%）。显然还有很长的路要走。


    ### 黑客


    如果各国正在使用人工智能作为强化权力和主导地位的工具，罪犯也开始武器化这项技术。首先是黑客和网络犯罪社区。


    问题是，目前并不需要太多就能欺骗人工智能。在红色停车标志上简单地添加黑白条纹胶带（在某些情况下拼写出“爱”和“恨”字样）——就像 2018 年一组九名研究人员在虚拟模拟中所做的那样——就足以欺骗自动驾驶汽车，使其认为限速是每小时
    45 英里。


    这些错误发生在研究条件下。但网络犯罪分子和黑客总是处于技术和创新的最前沿——这是领先于执法官员的唯一方法。他们很快就会转向使用人工智能。对一些人来说，人工智能将是工具而不是目标。例如，罪犯可能使用人工智能来帮助发现应用程序代码中的缺陷（应用程序开发人员也这样做以预先发现错误）。他们可能使用人工智能来创建新的恶意软件或攻击（多态恶意软件可以不断改变自身以逃避检测）。或者，他们可能编程人工智能来模仿人们的行为，作为网络钓鱼攻击的一部分，诱使人们相信电子邮件或资金请求是从他们信任的人那里发送的。


