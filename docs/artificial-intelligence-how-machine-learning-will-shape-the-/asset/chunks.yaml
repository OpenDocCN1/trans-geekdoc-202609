  trans: '


    Hernández-Orallo 的预测是，我们将在 AI 与“完全”AGI 之间达到一个中间地带，届时将存在知识远超人类的系统，能够处理广泛的任务，但并非无所不知。要解决新问题，它们需要更多数据，而这些数据必须由其人类所有者获取。“在我看来，AGI
    是一种具有通用能力的系统，这意味着它可以学习任何可能的技能，其中有些比其他更容易，就像我们人类一样，”他说。“这并不意味着该系统是超级智能。但这将是具有变革性的。”


    无论最终实现何种形式的 AGI，都会引发实际和伦理问题。鉴于我们无法理解 AGI 是通过哪些步骤得出那些决策的，依赖 AGI 做出的决策有多安全？我们如何决定何时使用
    AGI，何时依赖人类？“有成千上万聪明的人在从事 AI 研究。他们很可能在没有 AGI 定义的情况下进行研究和开发，”卑尔根大学教授 Ragnar Fjelland
    说道。


    > 然而，他们应该牢记的不仅仅是计算机能做什么的问题，还包括计算机应该做什么的问题。这个问题包含伦理考量。有时用技术取代人类是正确的。但是，基本态度应该是技术应当改善人类的状况，而不是取代人类。


    大多数 AI 研究人员都同意的一点是，如果 AGI 真的被创造出来，那也不会在很短时间内实现。在 2017 年的一项调查中，被询问的 352 名机器学习研究人员认为，实现人类水平机器智能的里程碑还有
    45 年的可能性，平均比例为 50%。


    当涉及 AGI 这样模糊的事物时，不愿将自身声誉置于风险之中几乎不足为奇。如果没有人能就 AGI 是什么达成一致，那么就无法知道创建它需要哪些工具，以及这些工具是否已经存在或需要发明。如果还需要更多技术突破——这似乎很可能——就无法猜测这些突破何时会发生。而且，即使实现了某种形式的
    AGI，人们无疑也会争论所创造的东西是否真的是 AGI。当谷歌在 2019 年声称实现了量子霸权——即使用按照量子力学原理运行的计算机比传统计算机更快地完成任务的能力——其竞争对手
    IBM 质疑了其结果，并认为量子霸权其实并不重要。


    我们已经拥有的 AI 系统远未掌握其当前的学习方法，也无法执行与其训练任务不同的任务。在人类实现能够跨多个不同领域工作的通用 AI 之前，还有很长的路要走。


    但利用我们目前拥有的技术，仍有大量进步可取。AI 正在改变并颠覆我们周围的世界。它带来了各种各样的挑战。我们目前拥有的系统中存在需要解决的伦理、社会和技术问题。构建
    AI 的人需要对其创造物负责。他们需要问自己，他们正在制作的系统是否正在改善我们周围的世界，以及是否可能被怀有恶意的人滥用。他们应该与受其技术影响的人交谈，并了解其带来的不同。AI
    的部署需要造福于所有人。追求 AGI 不应分散对此的注意力。


    ## Glossary


    ### AGI (artificial general intelligence)


    一种能够像人类一样思考、学习新任务并像人类一样理解世界的 AI 系统。通用智能是许多 AI 研究的目标。


    ### Computer vision


    计算机通过图像识别、对象检测和分类或对象跟踪来“看”的能力。计算机视觉可用于处理照片、录制的视频和实时画面。


    ### CPU (central processing unit)


    一种计算机芯片，用于进行告诉设备如何运行的计算。CPU 包含数以十亿计的晶体管，擅长运行某些 AI 算法。


    ### Deep learning


    机器学习的一个子集，使用多层神经网络从数据中学习。自二十一世纪初以来，深度学习一直是 AI 应用的最大加速器。


    ### GAN (generative adversarial network)


    一种使用监督学习和无监督学习来基于其见过的先前数据生成新数据的 AI。该过程已被用于创建假面孔并生成 AI 艺术作品。


    ### GPU (graphics processing unit)


    一种最初为游戏开发的图形芯片，在 AI 领域备受青睐，因为其处理能力强于 CPU，因此可以加快训练过程。它对于图像识别特别有用。


    ### Neural network


    一种松散模拟大脑构成的网络，有助于机器学习。计算和预测在网络的每一层中进行。


    ### NLP (natural language processing)


    计算机理解和使用人类语言的一种方式。这可以包括语言之间的机器翻译、文档摘要、语音转文本转换（反之亦然）以及情感分析。


    ### Reinforcement learning


    一种给定明确目标（例如，赢得游戏）的算法，然后通过试错来尝试达到该目标。每次它做了一件有效的事情就会得到奖励；当它失败时可能会受到惩罚。


    ### Supervised learning


    最常见的 AI 过程类型。监督学习系统会对其未见过的信息进行预测。为了做出这些预测，它首先会看到它试图解决的问题的先前示例。监督学习常用于图像识别任务。


    ### Unsupervised learning


    一种在没有任何先前知识的数据中寻找模式的学习系统。与监督学习不同，无监督学习不涉及使用先前示例进行训练。它对于查找结构和分类大量数据很有用。


    ## Acknowledgements


    在这个世界上创造的任何东西都不是一个人的产物——本书也不例外。虽然我在 WIRED 从事人工智能的报道已有五年多，涵盖了从医疗保健到网络安全的各个领域，但我对这个数十年历史的行业的了解仍仅浅尝辄止。本书的制作离不开他人的专业知识，我深感感激。


    在我在 WIRED 期间，AI 的使用呈指数级增长，现在似乎社会正处于真正的转折点。该技术已渗透到主流的日常使用中，并将越来越多地被用于在我们生活的更多领域解决新任务。AI
    的承诺令人兴奋不已：它有可能颠覆我们许多日常活动，并解锁关于我们星球（及其以外）的新秘密。想象 AI 重塑我们所熟知的世界绝非不可思议。尽管如此，仍有大量工作要做。我们需要确保
    AI 的使用是公平、负责任且包容的。没有人应该因为使用 AI 系统而受苦。


    幸运的是，有许多极其天赋异禀和才华横溢的人正在致力于 AI 的发展——既致力于改善世界，也致力于确保 AI 造福于所有人。在为本书进行报道的过程中，其中许多人抽出时间并与我分享了他们的深厚专业知识，我对此深表感激（特别是那些在新冠疫情封锁最严峻时期，忍受了我坐在卧室地板上进行
    Zoom 通话采访技术的人）。


