- raw: 'The ripples of the pioneering work done by Buolamwini and others will spread
    out over the next few years, as lawmakers and regulators all grapple with the
    issues that AI throws up. In particular, there will need to be a recognition that
    constant structured auditing, of the type that Buolamwini undertook, is essential.
    Not only does it lead to better systems, but it also forces people to address
    how those systems are utilised and if they should be used at all.


    At present, uncertainty about the application of AI is very widespread. ‘Currently
    we cannot say which local authorities in the UK, for instance, are using an algorithmic
    decision system to inform prioritisation in children’s social care,’ says Jenny
    Brennan, an AI policy researcher and software engineer at the Ada Lovelace Institute.
    ‘What is really clear is that we do need ways for regulators to inspect algorithmic
    systems.’ The same uncertainty and need for inspection exists across other sectors
    in which AI is utilised, not just in the UK but across the world.


    In Amsterdam and Helsinki city authorities have started tackling a lack of transparency
    by introducing registers for AI used by city departments, says Linda van de Fliert,
    the programme manager for Amsterdam’s algorithm register.


    For her part, Jenny Brennan pinpoints two approaches for assessing AI systems
    that are either currently in use or being considered. One is an algorithm audit
    that includes a bias audit and regulatory inspections. The other is an algorithmic
    impact assessment, which might include considering the societal impact of an AI
    before or after it is in use. Her research concludes, though, that there is some
    way to go before it’s clear precisely what the best versions of these systems
    would look like in practice.


    ‘There’s a lack of clarity around when algorithmic decisions are being used, and
    there’s usually not a way for folks to actually compare notes and see if there
    is evidence of bias or any of those sorts of issues,’ says Alice Xiang, the head
    of fairness, transparency and accountability research at the Partnership on AI.
    The organisation is a research body that is backed by more than 100 groups, including
    Apple, Amazon, Google, Microsoft, Samsung and IBM. ‘There’s a lot of constraints
    in terms of the proprietary nature of the data used to train algorithms and also
    the proprietary nature of the algorithms themselves.’


    The current opaqueness of AI decisions makes it harder for people to oppose them,
    Xiang says. True, there was a prominent backlash against Apple’s credit card launch
    in the US when its algorithms appeared to show bias by offering different credit
    limits to men and women, but such a reaction is rare. ‘When you have, say, millions
    of users being affected, even if just a small cluster of folks got together and
    managed to talk to each other and compare notes, that’s not necessarily really
    great evidence to go forth with a lawsuit, and even that rarely happens.’


    There is disagreement as to who should be responsible for audits and assessments.
    Dozens of AI ethics groups and guidelines have been drawn up, but many of them
    lack real power. (In one rare pro-active instance in August 2020, a UK police
    ethics board stopped the development and deployment of flawed AI that was supposed
    to predict if someone would commit violent crime.


    In July 2020 the government of New Zealand launched a set of standards that it
    called an algorithmic charter and a ‘world first’.


    ‘There are so many sources of bias: individuals, structural, societal, it seems
    dangerous and a bit arrogant to think that we can fix all this with one system,’
    argues Suresh Venkatasubramanian, a professor in the School of Computing at the
    University of Utah. He says that each of the potential risks a system poses should
    be identified, and that it should be audited for them one at a time. ‘The goal
    is to narrow the scope of the harms to the point where we can actually deliver
    an audit that makes sense for that,’ he explains, ‘and then slowly try to build
    up from there.’ Audits have to be done at the right stage of the development process,
    too. ‘Often the use of audit risk compliance teams are the last people anybody
    calls,’ says Rumman Chowdhury, the former head of Accenture Applied Intelligence’s
    Responsible AI division, who left to create the algorithmic audit company Parity.
    ‘Ethical assessment is not something you can just do once. There are certain actions
    you would take at different stages. It wouldn’t even be appropriate to do, for
    example, a data audit at the very end of product development.’ Crucially, any
    audit has to evolve over time, as new problematic issues are identified or if
    the training data or algorithms used in the AI application change.


    In the absence of widespread legislation and auditing that can expose threats,
    discrimination and biases in AI systems being used around the world, Buolamwini’s
    non-profit Algorithmic Justice League is taking measures into its own hands. In
    the world of cybersecurity ethical hackers that report flaws or vulnerabilities
    in software can be paid for their work through bug bounty systems. The Algorithmic
    Justice League is learning from this process by running an algorithmic vulnerability
    bounty project – people can disclose how they have been treated by AI and it will
    be investigated. Ultimately, Buolamwini believes that to develop AI that can be
    a benefit to all, everyone has to be involved in its creation. ‘It’s so easy to
    think you might introduce technology to solve other people’s problems without
    actually bringing the people who are most impacted into the community. So \[it’s\]
    not designing for but designing with.’


    # 8


    ## The future of AI


    AI is now firmly embedded as an integral part of our everyday lives. Over the
    coming decades it will become more powerful and more sophisticated. It will go
    from being used widely on social networks and in tech products to being used by
    businesses and within society.


    But what about the ultimate goal of some researchers: AGI, or artificial general
    intelligence? AGI would represent a revolutionary step forward. At the moment
    AI is proving better than humans at some specific tasks but, depending on which
    definition you use, AGI would be able to perform excellently at every task that
    it is given. It could, to all intents and purposes, have fully human capabilities.


    For some, this would be the nightmare scenario. Elon Musk, the founder, co-founder
    or CEO of SpaceX, Tesla and Neuralink, who has frequently had run-ins with the
    AI community for his outspoken views on AGI and other forms of super-intelligence,
    argues that AGI would be more dangerous than nuclear weapons, and that the technology
    is a ‘fundamental risk to the existence of human civilisation’. He has warned
    of AI networks developing their own consciousness, as rapid automation happens.
    ‘You say, “What harm can a deep intelligence in the network do?” Well, it can
    start a war by doing fake news and spoofing email accounts and doing fake press
    releases and by manipulating information,’ he said in 2017.


    He is not alone. The philosopher Nick Bostrom, the head of Oxford University’s
    Future of Humanity Institute, has repeatedly warned that creating super-intelligence
    could lead to the ‘extinction of mankind’. In March 2015, Bostrom, Musk, the co-founders
    of DeepMind, Stephen Hawking, and AI leaders from Google, Facebook and hundreds
    of other institutions signed an open letter stating that if general intelligence
    is the ultimate goal, safety measures need to be put in place to ensure that it
    benefits and does not harm society.


    In 2018, researchers at the Australian National University set out to chart how
    the risks of AGI could be mitigated.'
