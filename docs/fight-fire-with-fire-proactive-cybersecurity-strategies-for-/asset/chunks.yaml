- raw: 'Scanners embedded in the integrated development environment (IDE) can be useful
    in catching errors early on in the process and ideally provide timely feedback
    to the developer on weak coding practices. Static application security testing
    (SAST) tools focus on the lines of code and can help validate source code and
    third-party libraries as well as regularly scan both for insecure practices and
    known vulnerabilities. Dynamic application security testing (DAST) tools look
    for weaknesses while the app is running (usually web apps and services), and integrated
    application security testing (IAST) is meant to combine the goals of both but
    in more modern infrastructures. All of these tools require a level of hygiene
    in the application and the tool itself to be effective.


    #### Process Is Very Important


    Successful implementation not only incorporates timely feedback for the developer,
    but it also heavily relies on regular tuning and quality checks on the tool itself
    to guard against a flood of false positives and the apathy that creates. Failing
    to invest in validating the quality of these scans can end up in wasted investment
    and more “noise” that goes unactioned, leaving potentially serious issues to go
    unnoticed and allowing risk to accumulate.


    #### Define Value Up Front


    It''s also helpful to define the goals for using these tools. Each tool has limitations
    and should not be used as a “point and scan” solution alone. Many companies find
    it hard to get value from these tools because they fail to invest time in defining
    the goals for each tool and configuring the tools to meet those goals. SAST tools
    are notorious for too many findings (false positives); DAST tools can have coverage
    problems or fail to manage the complexity of an app and “not find enough.” It
    should not be expected that any one technology will find everything that is important
    and nothing that isn''t.


    If the goal is help uncover some problem areas at a faster pace and wider scale
    than a human can, or to help shift some of the testing capabilities to trained
    and supported engineering teams, these tools can be very useful by enabling scale
    and speed of testing. For organizations with very limited resources, tools can
    provide coverage where there might not be any otherwise.


    Many bug bounty reports find common weaknesses that could have been found by more
    automated processes. There''s a reason why cross-site scripting and injection
    vulnerabilities remain on the OWASP Top 10


    Using tools earlier in the product life cycle can uncover known vulnerabilities
    like these and provide feedback to the developers to help decrease repeat errors
    over time. These patterns should be monitored and measured and part of the feedback
    loop to communicate efficacy of the programs and tools—but more on that later.


    ### The Bottom Line


    Tools have an essential place in the security-by-design journey when met with
    robust processes and skilled teams. You still need knowledgeable humans to tune
    the tools, interpret the findings, and, of course, fix them.


    ## People


    Speaking of knowledgeable humans, it all starts with people. With one exception...


    ### It''s Not All About You


    It''s actually not even *mostly* about you. It''s about the business and what
    they are trying to achieve, and it''s about the customers and the safety they
    expect and deserve. As security pros, we are here to enable the business to achieve
    their goals safely. If the business is a race car, we are the brake; we are the
    pit crew when needed—there to fix, diagnose problems, and radio the driver so
    they know when it''s safe to hit the gas as well as inform them of potential threats
    and risks. We are the emergency response team when something really goes wrong.


    Now before you cringe at the brake analogy, consider this. A key enabler of a
    car''s ability to go faster than a snail''s pace is the presence and functionality
    of the brake. Without it, a car could not safely operate, and drivers would be
    stuck with a very slow and very frustrating user experience. The brake is what
    gives the car the flexibility to slow down when, where, and how it is needed to
    get the driver where they want to go. It allows for heavier materials and more
    robust builds and features. A brake by itself? A cool, albeit excessive, paperweight.
    But a brake as part of a multi-layered safety system? That''s an enabler of the
    ultimate in driver experience and vehicle performance. We are here to enable the
    business.


    ### Get to Know Who It *Is* About


    Aside from really understanding the business you''re protecting and the proposed
    product or service you''re assessing (get cozy with the 10-K and the 8-K SEC forms


    How do the developers work? How are they incentivized? What are their views on
    security, and how does it affect them? If you''ve heard some of the quotes from
    the beginning of this chapter, you probably have a few guesses, but ask anyway.
    So much can be gained in both insight and cooperation by practicing empathy and
    genuinely seeking to understand the world development teams have to create in.
    Listen to their experiences and aim to craft solutions that create as little friction
    for the developer experience as possible; even better is to co-create the solution
    with them. The key to getting buy-in is making sure the other side feels heard,
    valued, and understood.


    The goal is to embed security into the design, where not only are we working alongside
    the creation efforts, but we''re also teaching and evangelizing the principles
    of security so that we get better at creating—safely, with fewer defects at each
    iteration.


    ### Lead with Empathy


    Get intentional and genuine in the discovery and partnership process.


    It''s not a secret that security can have a dreaded reputation. Years of “Thou
    shalts” and “Thou shall nots” are hurdles we have to acknowledge and overcome.
    One strategy for building bridges and investing in people and connections is to
    create opportunities for individuals and teams to come together in a casual and
    genuine way.


    Sponsoring small activities that empower your team to engage with other teams
    is golden. Encourage them to treat partners to one-on-one coffees or small group
    lunches to help folks get to know each other as people and colleagues. These simple
    connections can pay large dividends in forming the partnerships needed to tackle
    the tough stuff down the road and not just with developers and engineering teams.
    It takes all kinds of disciplines and partnerships to make this work. That means
    including finance, product development, marketing, legal, HR, operations, technology,
    and so on. The key here is to provide space, resources, and the expectation to
    do these things. As a leader, you can empower your team by allocating thirty minutes
    every other week or month for relationship-building activities and pave the way
    for engagement by working with the leaders of other organizations to do the same.


    Successful implementation relies on an opt-in method rather than forced participation.
    Opt-in results in more engaging connections and allows for flexibility for personal
    preference, schedules, and working styles. Your goal here is to create the opportunity
    to be intentional about forming relationships between teams, not forcing people
    to talk to each other.


    Have geo-diverse teams? Casual virtual coffees or lunches can be very effective
    proxies for the serendipity enjoyed by on-site teams bumping into each other in
    the halls. Get creative and order a favorite coffee drink or an inexpensive lunch
    delivered to each participant and watch the ideas spark over lattes or a slice.


    ### Skill Up for Scale


    Teach ''em to fish. That''s fish—not phish.


    One of the bigger gripes I hear from engineering teams is that they aren''t clear
    on what security expects of them. “Just tell me what to do,” they say.'
