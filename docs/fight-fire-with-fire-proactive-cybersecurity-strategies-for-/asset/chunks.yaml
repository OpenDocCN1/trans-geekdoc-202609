    ### Ongoing Communication and Awareness Plan


    Continue the communication efforts during this phase. Upgrade your internal materials
    to show the maturity level attained and how it provides outcomes and key results
    for the business and the customers. Make sure that this is communicated at all
    levels of the organization. Highlight individuals who have reported security issues
    and show how that led to better outcomes for customers and the company. Provide
    industry examples of behavior that did not achieve the desired outcomes and show
    how the security program at your firm would change that negative outcome.


    ### Improved Net Promoter Score


    The net promoter score should continue to improve from the initial rating. At
    this point, regular net promoter scores should be collected, calculated, and leveraged
    to determine if there is a gap in the program or where additional information
    could be provided to the business to show how that perceived gap is being addressed.


    ### Target Maturity Achieved and Mature Services Available


    Achieving the target maturity means that you have mature security services to
    offer for challenging problems that solve business needs.


    ### Fewer Audit or Regulatory Issues


    With the target maturity, there should be fewer risk issues that take time away
    from more strategic capabilities. The best part about this is that the time recovered
    can be invested in greater efficiency and innovation—what I call “effovation.”


    ### Full Risk Framework Inclusion


    Governance and risk management are integrated within the risk forum to discuss
    and determine the right risk decisions—security awareness is now woven into the
    fabric of the company. Metrics should matter to drive risk conversations and mainly
    be focused on quantitative measures at this stage.


    ## Reaching Trusted Advisor


    At the level of trusted advisor, the elements already established have a much
    heavier influence on maintaining a culture of security awareness. This does not
    mean the work is done; on the contrary, maintaining this level once achieved requires
    ongoing effort.


    ### Business Regularly Engages Security


    Security awareness has been reached, and security is a trusted advisor to solve
    complex business problems. Continue to permeate the organization and align all
    security staff to understand business problems.


    ### Risk-Aware Business Decisions Aligned to Company Performance


    Businesses are less likely to just accept risk without understanding the key facts
    about the risk. The security team is adept at explaining risk and what that means
    to the bottom line as well as various elements of the company''s risk framework.
    Security risks can be combined with reputational, financial, and litigious risks.


    ### Communication and Awareness Plan Sustained


    Now that you have attained cultural engagement, what can you do to continually
    maintain engagement enthusiasm? Lean into research and talk with peers about additional
    methods to keep the spark of awareness alive.


    ### Net Promoter Score Sustained


    Maintain the net promoter score and set goals to improve this score alongside
    the customer net promoter scores. Ensure this is woven into scorecards where the
    team shares insight into why scores are rising or falling and what is being done
    about it.


    ### Target Maturity Sustained


    Achieving target maturity took an incredible amount of work. Do not lose sight
    of continuing to maintain and improve the maturity. Ensure improvements deliver
    value for a business problem, and don''t sacrifice good for perfect.


    ### Quantitative Risk Measurement


    Metrics matter and at this stage are objectives and key results (`OKR`)


    Effovation should reduce busywork, sometimes called `ClickOps`, allowing knowledge
    workers to focus on more complex problems—and in fact fail while doing so. Leaders
    should celebrate failures and what was learned from failure because those failures
    will drive greater wins. Leaders should also celebrate that knowledge workers
    have a desire to contribute and be recognized for being allowed to develop cool
    new ideas.


    ## Conclusion


    This framework outlines how security program maturity aligns with weaving a culture
    of security awareness throughout an organization. The work will be tough, but
    the rewards are incredible. In the end, your email will be full, and your phone
    won''t stop ringing—because you and your team may be the most sought-after people
    in the company.


