    — Renee Tarun, Deputy CISO, Fortinet*


    # About the Author


    ![](images/fbetwuf001.png)


    Renee Tarun is the deputy CISO at Fortinet. She has over twenty-five years of
    experience in information technology and cyber within the US Intelligence Community,
    Department of Defense, and law enforcement as well as private-sector entities
    around the world.


    Renee has focused on enterprise security, compliance and governance, and product
    security at Fortinet. Prior to joining Fortinet, she served as Special Assistant
    to the Director of the National Security Agency (NSA) for Cyber and as Director
    of NSA’s Cyber Task Force, where she shaped agency strategy as well as national
    cyber policy for the White House.


    In addition, Renee served in many other roles concentrating on development and
    engineering, cyber strategy, operations, resourcing, and relationship management
    for the NSA, the Department of Defense, and the US Secret Service.


    Renee is a board member for the George Mason University Volgenau School of Engineering
    and is co-author of *Cyber Safe*, a book aimed at keeping children safe online.


    # Acknowledgments


    This book has been a collaborative team effort involving many diverse cyber leaders
    and experts from across government and the private sector. It would not have been
    possible without their insightful contributions and thought leadership. Their
    dedication and energy continue to push boundaries and make our cyber world safer
    and more secure.


    I would like to thank the entire Fortinet team for supporting me in the creation
    of this book, and for providing me with the opportunity to share insight and knowledge
    that will help technology leaders around the world.


    # Contributors


    - **Sonia E. Arista**

    - **Marianne Bailey**

    - **Fatima Boolani**

    - **Beth-Anne Bygum**

    - **Laura Deaner**

    - **Lisa Donnan**

    - **Suzanne Hartin**

    - **Susan Koski**

    - **Jenny Menna**

    - **Mel T. Migriño**

    - **Sanju Misra**

    - **Terry Roberts**

    - **Maria S. Thompson**

    - **Anne Marie Zettlemoyer**


    # Introduction


    ***RENEE TARUN***


    Digital transformation and the ever-changing threat landscape have significantly
    altered the role of chief information security officers (CISOs) and security decision-makers.


    Traditional CISO responsibilities such as patch management and incident response
    are as critical as ever, but today''s CISOs must also concern themselves with
    supply chain risks, myriad privacy regulations, and 5G. In addition to fighting
    traditional and emerging threats, CISOs also face the stress of the skills gap:
    not having enough people to do the job.


    These challenges interwoven with network security are forcing CISOs to take a
    more holistic approach to balancing risk, security, and strategic business enablement.


    Technology is not the only approach to solving the quagmire of security challenges
    we face. Security leaders must address people, processes, and technology, synthesizing
    them to create security solutions that manage risk while advancing business objectives
    at the speed of today''s economy.

