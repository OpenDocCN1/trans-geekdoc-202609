  trans: '

    我们都知道，我们无法用任何确定的答案回答“我们是否安全？”这个问题，因为即使我们在此时此刻这一刻实际上是安全的，考虑到我们的业务环境、硬件、软件以及虚拟墙之外的世界发生的所有变化，在下一个一小时内我们可能不再安全了。但组织必须不断确定它们是否足够安全。


    理解安全性是否充分的关键组成部分包括：组织是否检测了它们应该检测的内容、防止了它们应该防止的内容、是否足够快速修复问题，以及是否跟上了所有影响我们安全的不断变化的因素。


    为信息安全计划制定一套指标（或关键风险指标，即 `KRIs`）以应对这些领域中的每一个领域，对于理解实际性能与风险偏好目标之间的差异至关重要。每个 `KRI`
    都需要一个与组织风险偏好相一致的阈值。


    将 `KRIs` 置于逻辑框架中将更清晰地沟通状态，并突出任何运行超出风险偏好范围并因此需要额外管理关注的领域。例如，如果我们正试图判断对事件的响应是否良好，我们的
    `KRIs` 可以包括平均响应时间、平均遏制时间和平均修复时间，可能还会对每项进行趋势分析。如果组织的风险偏好是“低”，那么这些 `KRIs` 中的每一个都需要“低”的阈值，以及“中”和“高”的阈值。如果这是你组织的既定偏好，那么性能应该处于“低”范围。暂时处于“中”可能在风险容忍范围内，但需要采取行动处理流程和控制，以便在短期内回到“低”水平。


    通过预防、检测和响应类别的 `KRIs`，我们拥有理解我们是否运行在风险偏好范围内的主要要素。为了确保我们当前的安全态势是可持续的，我们还需要围绕“我们是否能跟上不断变化的环境——技能组、威胁格局、监管要求等”的
    `KRIs`。


    从更详细的信息聚合而成的摘要级安全仪表板提供了一种沟通这些 `KRIs` 及其状态的简明方式，并用熟悉的红、黄、绿（想象交通信号灯）进行颜色编码。


    通过这种方式展示围绕检测、预防、响应和意识的 `KRIs`，并添加一个包含几个项目符号列表的执行摘要，你就可以突出领导层关注的关键项，并将注意力引向需要立即关注的领域。


    仪表板的全部意义在于能够一眼讲述一个完整且引人胜的故事，以确保投资投入到了正确的地方，并实施了能力和流程来保护组织及其客户。一个直观的仪表板是获得足够关注和资金以确保做好准备的有力工具。当然，这种准备工作必须辅以所需的资源，以便能够快速响应和修复任何事件。


    一旦你有了关于性能是否在风险偏好范围内的答案——以及如果不在范围之内，则有将其带回理想阈值的修复计划——接下来呢？这些信息在何时以及如何被使用？


    ## 如何参与网络风险的治理与监督


    任何将网络安全风险视为关键风险的组织，其 CISO 都应该积极参与公司的治理结构。该结构可能包括内部企业风险管理委员会的下属委员会，该委员会向董事会或董事会下属委员会报告。整体结构可能像图
    6-1 所示。


    为了让 CISO 参与到正确的岗位，他或她应该考虑参加哪些公司级或企业委员会是合适的。如果有一个整体的企业风险管理委员会，那么 CISO 成为表决成员是至关重要的。这种程度的参与让
    CISO 能够洞察并影响相关及集成风险（如业务连续性和韧性、第三方风险、声誉风险等）的管理。


    尽管名称可能不同，但企业风险管理委员会通常批准组织的整体风险偏好声明以及对其任何修订。该委员会还负责理解相对于各种阈值的执行情况。


    ![图 6-1. 风险管理组织图](img/c06f001.png)


    图 6-1 风险管理组织图


    如果风险性能超出风险偏好，或者更糟，超出了风险容忍范围，企业风险管理委员会或其等机构应该是 CISO 寻求方向和支持的地方。除了 `ERM Committee`
    之外，CISO 还应该是其他关键委员会的成员，例如业务连续性指导委员会和 IT 风险治理委员会。CISO 应该参与这些委员会，以支持公司的安全态势。


    一个需要特别指出的领域：如果组织设有隐私委员会或隐私办公室，CISO 参与其中或保持紧密的工作关系将非常有益。随着大量近期隐私法规，结合技术变化和攻击者的进步，相对于事件响应和数据保护的考虑因素已经扩大：


    *   现在安全事件很可能也是需要满足法律要求的隐私事件。

    *   如果怀疑发生事件，请立即联系隐私和法律部门，并讨论在律师客户特权下进行工作和沟通的适当性。同时确保所有工作都能支持满足法律要求。

    *   正如过去一样，可能会存在限制，无论是共享数据、何时共享还是出于什么目的共享。


    如何处理这些事件对公司的声誉影响巨大，因此再次，如果 CISO 参与了业务连续性指导委员会并对实体的应急计划及其结构有全面的了解，他或她将知道如何利用这一流程以获得最大的成功。


    参与治理委员会的其他益处还让 CISO 能够：


    -   向客户、监管机构和其他关键利益相关者使用集成风险语言

    -   引导公司将网络风险视为首要风险

    -   理解可能对安全态势产生影响的其他新兴风险

    -   向外部利益相关者展示对信息安全计划和网络风险的有效监管


    数字化转型、所有产品嵌入电子接口、虚拟化以及其他趋势将继续加速并变得无处不在。因此，CISO 积极参与公司战略制定、治理结构、风险偏好声明以及集成风险态势将变得更加重要。

    '
