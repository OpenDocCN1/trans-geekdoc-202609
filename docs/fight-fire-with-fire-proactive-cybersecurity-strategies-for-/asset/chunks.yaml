  trans: '


    由于用户名和密码通常是攻击者的首要目标且经常发生泄露，组织需要考虑额外的身份验证层，例如多因素认证。一旦用户通过身份验证，基于角色的访问控制（`RBAC`）将根据用户在组织内的特定角色授予访问权限和服务。


    组织连接到其环境的设备比以往任何时候都多，包括大量涌入的业务型 IoT 设备，以及采用自设备设备办公（`BYOD`）策略的组织。安全团队需要对所有这些设备具有可见性，以查看其类型、功能以及接入网络的目的。网络访问控制（`NAC`）技术可以通过允许安全团队发现并分类设备、建立适当的访问控制，并在威胁扩散到网络其他部分之前提供持续的监控和修复，从而帮助实施
    `ZTA`。


    零信任模型也适用于应用程序。零信任网络访问（`ZTNA`）为用户创建了应用的代理访问。这是一种无论用户或应用程序位于何处都能控制其访问的方法。应用程序可以位于数据中心或云端，而用户可以在办公室或远程工作。


    传统的远程访问由 `VPNs` 处理，它基于一旦用户或设备通过了网络边界控制，就会被视为受信任的假设，提供对网络的无限制访问。相反，`ZTNA` 采取的方法是，在用户或设备证明自己值得信任之前，无法访问任何内容。因此，组织应该将其远程访问从
    `VPNs` 演变为 `ZTNA` 解决方案。此类解决方案可以提供更好的用户体验，并提供更细粒的安全保护。


    如今日益增长的威胁要求零信任访问不仅仅是一个术语；它必须成为你安全架构中不可或缺的组成部分。由于网络很少是一个可行的方案，你必须平衡安全性和可用性才能获得成功。零信任访问让首席安全官（CISO）更容易发现所有访问网络的用户和设备，并管理与其相关的安全风险。


    ## AI 驱动的安全运营


    人类，即使是最优秀的安全分析师，也没有时间或能力去筛选、理解海量的数据格局并执行手动检测关联。海量未聚合的安全数据使得很难观察发生了什么以及如何优先考虑威胁。


    平均每个 `SOC` 每天接收到超过 10,000 条警报，大型企业每天接收的超过 150,000 条警报。与此同时，IT 团队面临人手不足或培训不足（由于网络安全技能缺口），无法跟上警报的速度。然而，这些团队忽略或忽视警报将带来危险的后果：单条警报可能就是检测并阻止重大事件与完全遗漏事件之间的区别。此外，证明符合安全和隐私标准及法律的需求消耗了大量的时间，这些时间本可以用于威胁的识别和响应。


    由人工智能和机器学习驱动的平台可以帮助实时识别并响应威胁。AI 和自动化工具简化了这些环境中的网络管理，向安全团队警报即将临的威胁，并处理自动的威胁响应。AI
    可以持续筛选从设备中收集的海量数据以识别威胁。它还可以自动调查传统上需要安全团队手动输入的大量警报，使团队更加高效。由 AI 驱动的平台让安全团队能够花费更多时间精炼策略、研究高级威胁并培养网络安全意识。


    当安全团队面临不断扩张的威胁格局和日益复杂的环境时，仅仅增加人力来解决问题是不可扩展的。因此，组织需要采用关键的 AI 驱动和自动化能力，以促进快速有效的安全运营。这些技术包括端点安全、高级威胁防护（如沙箱）以及安全运营平台（如
    `SOAR`）、端点防护和扩展检测与响应（`XDR`）。


    ### 端点安全解决方案


    端点在许多方面都是最后的防线。它是你的笔记本电脑、手机以及下载更新的智能设备。在企业规模下，端点包括所有此类设备，无论是公司发放的还是用于工作的个人设备。


    端点检测与响应（`EDR`）解决方案可以识别网络中的威胁并进行响应。`EDR` 解决方案可以分析威胁，并向你的 IT 团队提供有关威胁的信息。`EDR` 解决方案针对那些绕过主要防御进入环境的高级威胁。`EDR`
    解决方案通过隔离威胁并防止其扩散进一步保护你的网络。


    当然，在威胁到达那么远之前阻止它们更好。端点防护平台 (`EPP`）在威胁进入你的网络时对其目标进行关闭。然而，`EPP` 几乎无法提供 100% 的保护并阻止所有威胁渗透系统。你必须能够进行修复。因此，有效的端点安全策略通常包含
    `EDR` 和 `EPP`。


    ### 沙箱


    沙箱通过建立一个测试区域或“沙箱”来判断特定代码是否安全，从而保护你的网络和企业。它将恶意软件和恶意代码限制在与网络其余部分隔离的区域。恶意沙箱将应用程序限制在这个隔离环境中。在这个安全区域内，沙箱分析对象的行为。如果发生了糟糕的事情，只会影响沙箱而不会影响网络上的其他计算机和设备。与此同时，任何恶意代码都被隔离在沙箱中，使其不会扩散到企业的其他部分。


    ### 安全编排、自动化与响应 (SOAR)


    在基础阶段，安全运营侧重于查看各种日志、报告和分析，通常来自多个窗口。随着组织的成熟，他们需要一种安全架构能够统一收集和分析来自多种信息源和其他供应商工具的数据，包括日志、性能指标、安全警报和配置更改。对于大多数组织来说，这需要安全信息事件管理（`SIEM`）能力来收集分析数据，结合分布式事件关联引擎来实现复杂的事件模式检测。下一阶段是通过
    `SOAR` 技术实现自动响应，它允许单独的安全组件之间进行通信和互操作。


    '
