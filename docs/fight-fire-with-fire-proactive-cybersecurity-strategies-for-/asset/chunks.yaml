    ## Responsibilities of a CISO


    While many join the information security field from IT, others come from audit,
    legal, risk, engineering, or business functions. Each area brings a valuable view
    to the risk picture. No matter which of these areas you come from, as long as
    you don''t make decisions based entirely on your own experience, you will bring
    a more holistic view about what to prioritize. Stereotypically, a background in
    audit focuses on previous audit findings and compliance, whereas the business
    function may view security from a business enabler or cost avoidance perspective.
    All of these views are important to consider as you develop your security risk
    program.


    There is an expectation that CISOs and their leadership teams have a wide range
    of IT experience to understand and speak the lingo with IT employees and make
    informed decisions. Having deep knowledge about information security alone is
    not enough to be a CISO. Strong leadership and communication skills are even more
    valuable. You must understand the organization''s vision and strategy and create
    a security risk program aligned with business strategy. You will be expected to
    drive appropriate measures to ensure that information assets and technologies
    are safeguarded appropriately, depending on the type of data and exposure the
    system has. Resiliency is essential to discuss when creating a security program
    because inevitably incidents will happen and affect the business. Successful leaders
    help their businesses recover with limited business impact.


    ## CISO Archetypes


    The other day I was texting with a few CISO colleagues, and we started a video
    call, a scenario all too familiar in the days of the 2020 pandemic. We were talking
    about the fact that although there are many different personalities in our field,
    they are all able to succeed.


    CISOs tend to fall into one of three buckets or archetypes, according to [SecurityRoundtable.org](http://securityroundtable.org):


    *   The techie turned executive


    *   The enterprise security risk-focused thinker


    *   The “connect the dots” leader


    So which one is the “correct” archetype? Actually, it doesn''t matter whether
    you''re a techie, a risk-focused thinker, or a politically and threat-savvy “connect
    the dots” leader. The fit of the particular archetype to the organization determines
    whether the company, the security organization, and, by extension, the CISO are
    successful. Each archetype brings their own strengths and approach.


    The techie turned executive tends to work with or for the CIO, as more than half
    of all CISOs do today. A techie''s strength is the ability to understand the technology
    and how it can best help reduce risk. The techie turned executive needs to broaden
    their approach and look beyond technology when working with business leaders to
    articulate risk.


    The second archetype, the risk-focused thinker, aligns information security with
    business strategy. This leader understands the big picture and the business, as
    well as its risks. Because of the business and risk focus, these CISOs are increasingly
    reporting to the chief risk officer (CRO). According to consulting firm Korn Ferry,
    this shift is marked in the financial services sector because of increasing regulatory
    requirements around data privacy.


    The last archetype often comes from a government background and takes in the latest
    threats and geopolitical trends. Because of their experience and connections,
    they have a very broad view informed by the latest threats — as well as the threat
    actors behind them. Financial services and healthcare organizations are hiring
    more of these CISOs; in addition to their strong security background, they are
    savvy about regulatory issues.


    What makes the archetype fit so challenging is that companies often don''t know
    what they want from their CISOs, and CISOs aren''t always clear about the kind
    of leaders they want to be. Because CISO responsibilities and concerns aren''t
    the same from company to company and industry to industry, there is room to shape
    the role to best fit the strategic focus of the business. As a result, companies
    often look to the CISO to help define the role


    An incompatibility between cybersecurity executives and their organizations leads
    to burnout and contributes to high CISO turnover. According to research from the
    Enterprise Strategy Group, the average CISO lasts just two to four years.


    When a business is unsure of what they need, they may find out their current or
    recruited CISO is not a good fit for the company culture and risk profile. This
    scenario becomes crystal clear as you review CISO job descriptions. Such job descriptions
    often include technical duties like “create firewall rules,” governance-focused
    elements like “create and maintain KPIs,” and everything in between. CISO job
    descriptions are very different across industries as well as across organizations
    of different sizes and maturity levels.


    There are some important red flags to look out for when you''re looking a new
    role, according to CSO Online.


    For example, think hard before taking a role as a company''s first CISO. Many
    first-time CISOs last only one year because the C-suite expects too much too soon,
    no matter how long the organization (and its infrastructure) has been around.


    At the same time, as a new CISO, you might expect to have a healthy budget to
    work with, but the C-suite might not be ready to invest what you think they need
    to in order to address pre-existing issues. Anticipate possible conflicts around
    how secure you think the organization should be versus what the organization is
    willing to spend (see [Chapter 6](#c06.xhtml) to learn more about determining
    and framing issues relative to your organization''s risk appetite).


    On the positive side, being a company''s first CISO can allow you to take the
    initiative and develop and influence the security risk program for an organization
    with the proper support. It could be the best role you''ve ever taken in your
    career!


    The reporting structure is another issue. Today most CISOs report to the CIO,
    but not every CIO is a strong leader. If a CISO reports to a CIO who is not a
    strong leader, the CIO may look for an excuse to replace the CISO. If you see
    this dynamic, it could be time to look for another job or at least consider ways
    to strengthen your partnership with the CIO gradually.'
