    story and support it with data so that what you''re measuring can support the
    decisions and outcomes you''re seeking. While many are enamored by the term data-driven
    decision-making, data rarely drives decisions alone when humans are involved.
    Data influences decisions; our experience and context play an equally important
    role.


    The data scientist will help you determine what the data can and cannot be used
    for and help set expectations on baseline, cadence, and reasonableness for expected
    improvement. For example, if you''re trying to show value of the program over
    time by measuring the decrease of repeated defects, your results are dependent
    on development cycle times. In other words, you''ll only get one data point after
    each development cycle, so reporting cadence should correspond to when and how
    much data will be available to trend and analyze. If you have two-week sprints
    and want to measure repeated defects for each sprint after integrating a `SAST`
    tool, you''ll want to have enough sprints pass to have statistically adequate
    data to show effects over time. You''ll also need time to get a cohort through
    the training cycle to show the benefits of training in the overall solution.


