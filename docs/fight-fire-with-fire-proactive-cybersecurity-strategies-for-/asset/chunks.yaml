- raw: 'With an advanced solution that incorporates global data about emerging threats,
    new mitigation strategies, and best practices, you stand a better chance of remaining
    ahead of threat adversaries. Unified threat intelligence is foundational and must
    inform all of the end-to-end security capabilities described in this chapter.


    ## Integrated Security Platforms Enable and Protect Digital Innovation


    One key theme throughout this chapter is the need for integration. Making use
    of unified threat intelligence and any of the other critical capabilities described
    can work only if each component is relying on a security fabric. End-to-end security
    would be impossible if every component had to provide its own threat intelligence
    or integrate with another system. Rather, key capabilities like threat intelligence
    must be integrated, not bolted on afterward.


    Fully integrated security platforms offer critical capabilities in one package,
    including speed in detecting intrusions, lower cost of ownership, and a higher
    return on investment—allowing companies to save on staffing and maintenance.


    Open platforms are designed as fully integrated but can also incorporate existing
    solutions so that enterprises don''t have to rip and replace.


    Building blocks for end-to-end security platforms include technology solutions
    for security-driven networking, zero-trust access, dynamic cloud protection, and
    AI-driven security operations. These functions are informed by threat intelligence,
    driven by AI/automation, and managed through a single pane of glass.


    ### Security-Driven Networking


    Traditional network architecture and design tended to build out network access
    first and then layer on security—essentially treating them as two separate domains.
    Today''s dynamic work environments require a network that enables any person using
    any device to access any resource from any location. In addition, highly competitive
    markets inspire organizations to deliver optimized user experiences for their
    customers and employees while still providing adequate security.


    As we discussed in more depth in [Chapter 13](#c13.xhtml), security-driven networking
    converges networking and security. When security is woven into the network core,
    networks can evolve and expand to meet the digital demand while reducing risk.
    This approach enables a highly flexible and adaptable environment that can support
    innovation and leverage technology trends such as hyperscale computing, multi-cloud
    environments, and 5G.


    Traditional (WAN) architectures are often plagued with issues such as latency
    and slow performance when accessing cloud services. In addition, organizations
    continue to pay high MPLS costs for WAN transport that delivers a suboptimal user
    experience.


    Software-defined WAN (SD-WAN) solutions are increasingly popular for organizations.
    Such solutions simplify the management and operation of a WAN, reduce costs, and
    enable direct cloud access at remote branches, thus eliminating backhauling traffic
    (routing all branch office traffic through the data center). SD-WAN improves performance
    by prioritizing business-critical traffic and real-time services.


    Most SD-WAN solutions provide basic firewall and virtual private network (VPN)
    functions. However, they are often not sufficient, thus forcing IT teams to layer
    on additional security that increases complexity, creates more points of failure,
    and increases costs. Instead, organizations should look for secure SD-WAN solutions
    that provide a wide range of integrated security features, such as next-generation
    firewall, intrusion prevention, encryption, antivirus, and sandboxing capabilities.
    When you take an approach that combines these functions, you gain better performance,
    accelerated network and security convergence, consistent network and security
    policies, and operational efficiencies.


    In the past, organizations required workers located outside of the office to connect
    directly back to the core network to access cloud applications and data. Enterprises
    today are struggling to adopt converged security and networking strategies to
    address dominant trends including:


    *   The prevalence of multi-cloud environments.


    *   A more remote, distributed workforce working from cloud applications and accessing
    internal data, which can result in inconsistent security and network policies
    and enforcement mechanisms.


    *   The need for user experience improvements and workflow optimization, as 70%
    of users prefer working remotely but still report network performance issues.


    These trends are driving the need for secure access services edge (SASE)—a security
    and networking solutions bundle delivered at the cloud edge via a cloud-native
    architecture. As defined by Gartner, SASE converges networking and security technologies
    and enables flexible consumption for users wherever they are—both on and off the
    network.


    SASE solutions can provide:


    *   Consistent protection at the network edge


    *   Application of firewall and security policies regardless of user location


    *   The ability to shift from a CapEx to an OpEx model to lower costs and decrease
    complexity


    ### Zero-Trust Access


    Many organizations struggle with security today because they don''t necessarily
    know exactly who and what is on their networks in the first place; they don''t
    have visibility and control. If you can''t see it, you can''t protect it. In today''s
    world, employees and customers need access anytime, anywhere, from any device.
    No matter where they''re working, when they''re working, or what they''re working
    with, your workforce needs continuous monitoring and protection.


    Traditionally, enterprises have worried more about cyberattacks from outside the
    network than about malicious or accidental threats posed by insiders. But an increasing
    number of attacks and compromises involve people and devices already inside the
    network.


    There is no longer a network perimeter, no inside or outside. Monitoring must
    extend to two areas that previously weren''t high-profile concerns: the inside
    of the network (once presumed safe) and a proliferation of endpoints at the edge
    (which didn''t exist before).


    Organizations are now faced with more IoT and OT devices connecting into the network,
    such as card readers, vending machines, and ventilation systems. These “headless”
    devices were not built with security in mind and are often connected without the
    knowledge of security and IT, making the organization vulnerable to more threats.


    Leaders must shift their mindset to view every user and device as inherently untrustworthy,
    regardless of where they are. Requests by users and devices for access to resources
    are granted only after the user or device has been verified. This approach is
    referred to as a zero-trust model (ZTA).


    Implementing a zero-trust access approach focuses on having visibility and control
    over who and what is connecting to the network. It requires implementing controls
    to identify, authenticate, and monitor users and devices whether they are on or
    off the network. You must continuously verify all users as they access corporate
    applications and data. You must also be able to identify, classify, and profile
    every device on your network. Similarly, people and devices should have access
    only to what is absolutely needed, following the principle of least privilege.
    That involves segmentation, separation of duties, and need to know only access.


    When it comes to implementing ZTA for users, organizations must verify every user
    attempting to gain access and what role they play within the organization—are
    they an employee, a contractor, a guest, a partner, and so on. Single sign-on
    authentication helps to prevent password fatigue for users.'
