    # Mitigating Today’s Threats


    Today’s threats have greatly evolved, and the nature of the adversary has evolved
    as well. Lone hackers, hackers for hire, and small collectives still exist, their
    numbers growing as online materials enable almost anyone to become a hacker. Exploits
    are bought and sold as a commodity on the dark web and are readily available to
    any of these adversaries. Today, however, these attackers are joined by well-funded
    adversaries from organized crime rings around the world as well as government-supported
    hacking groups from particular nation-states.


    Your security posture must be strong enough to prevent a wide variety of outsiders
    from gaining access to your private and proprietary data, your processes, and
    your machines.


    Unfortunately not all of your malicious adversaries are outside your enterprise.
    Sadly, some threat actors have inside access to your systems, including disgruntled
    or unethical current and former employees misusing access and data for personal
    gain or simply to cause trouble. Other potential insider threats include suppliers,
    partners, board members, and anyone else who has access to your systems and data.


    There are other internal threats. We call them accidental insiders. You might
    call them humans. Accidental insiders expose the organization unintentionally
    because they are untrained, overworked, or unmotivated. These folks become threats
    when they respond to phishing attempts, use weak or default passwords, share passwords,
    leave devices unpatched or unlocked, and work over unsecured Wi-Fi networks.


    Your organization is up against well-funded adversaries as well as people who
    might just press the wrong key. You’ll learn about the many players behind today’s
    evolving threats in [Chapter 4](#c04.xhtml).


    ## Addressing the Skills and Diversity Gaps


    The gap between the number of cybersecurity workers we have and the number we
    need is widening. As of 2021, more than 3 million cybersecurity workers are needed
    globally, according to the `(ISC)² Cybersecurity Workforce Study.


    Addressing this gap requires a multi-pronged approach. Security knowledge needs
    to be more widely disseminated across the organization. Security and IT should
    be integrated, with cross-training between IT and security personnel. IT should
    also not be the only recruitment area for the security team: look across business
    units to identify potential candidates who bring experience of all types, from
    risk to finance to customer care to build out the security workforce.


    To close the skills gap, we need to create a culture where people want to engage
    in the security business. To make the field more attractive, from frontline security
    workers to leaders, we need to increase the visibility of and influence of the
    `CISO`. They need to be considered an integral part of the C-suite and central
    to business success, not a cyber janitor to clean up problems or take the fall
    when a breach happens.


    Although technical skills remain important, soft skills such as leadership, communications,
    planning, risk management, and strategy are just as vital. Such skills are especially
    critical for those in the `CISO` role who are leading security teams and communicating
    with the board.


    We also need to make the field more diverse by recruiting more women as well as
    people of all backgrounds including race, ethnicity, orientation, and disability
    status. Further, we need to expand hiring efforts to recruit veterans, whose backgrounds
    position them as valued and committed employees.


    Women are finally making some inroads in cybersecurity. In 2013, women held 11%
    of cybersecurity jobs; now women make up 24% of the cybersecurity workforce. While
    this improvement is positive news, more progress needs to be made, particularly
    since women make up half of the entire workforce.


    Closing the diversity gap is not just a feel-good measure. Closing the diversity
    gap drives business success and change. To lower cyber risk, we need to lower
    the level of group think. Teams with diverse backgrounds and experiences can uncover
    new, creative solutions to problems. Women bring unique traits to leadership,
    problem-solving, and security. For example, female `CISOs` scored higher than
    their male counterparts in critical soft skills, including 46% higher in leadership
    and 150% higher in analytical skills.


    Finally, we need to generate excitement within the security field by creating
    programs that effectively promote the security field including mentoring, internships,
    and engagement with schools from college down to K–12.


    `CISOs` can’t lead without a knowledgeable staff. [Chapter 5](#c05.xhtml) outlines
    the extent of the skills and diversity gaps. It gives you strategies for attracting
    the resources you need, including ways to upskill people in your organization
    who, after all, already know your business.


    Since this is the people section of this book, let’s start with you, and equip
    you with context about what it means to be a `CISO` in the face of today’s threats.


    ## Notes


    1. [1](#p01.xhtml#R_p01-note-0001). [https://www.isc2.org/Research/Workforce-Study](https://www.isc2.org/Research/Workforce-Study)


