  trans: '

    在这个阶段，业务部门应主要向安全部门寻求有关关键项目和倡议的建议。继续维护好人际关系并举行“炉边谈话”（fireside chats），利用获得的信息将目标成熟度与业务价值挂钩。教导你的直属下属在自己的水平上建立同伴关系。让你的领导者在炉边谈话中采取类似的方法，并听取反馈。确保这种叙述能够解释用户体验与安全性之间的权衡，以及如何维持并理解适当的平衡。最后，展示安全意识指标及其与客户净推荐值（NPS）的联系。


    ### 持续的沟通与意识计划


    在这一阶段继续努力沟通工作。升级你的内部材料，展示已达的成熟度水平，以及该水平如何为业务和客户提供产出结果和关键结果（OKRs）。确保这些信息传达到组织的各个层面。重点表扬报告了安全问题的个人，并展示他们的行为如何为客户和公司带来了更好的结果。提供行业案例，说明哪些行为未能达到预期结果，并展示贵公司的安全计划将如何改变这些负面结果。


    ### 提升净推荐值


    净推荐值应该从初始评分持续提升。在此时，应该定期收集、计算并利用净推荐值，以确定计划中是否存在差距，或者在哪些方面可以向业务部门提供额外信息，以展示如何解决这些感知到的差距。


    ### 达成目标成熟度并提供成熟化服务


    实现目标成熟度意味着你已经拥有了成熟的安全服务，能够为解决业务需求的挑战性问题提供支持。


    ### 减少审计或合规问题


    随着目标成熟度的提高，占用更多战略能力开发时间的安全风险问题将会减少。这最棒的一点是，找回的时间可以投入到更高的效率和创新中——我称之为“效能创新（effovation）”。


    ### 纳入全面的风险框架


    治理和风险管理已整合到风险论坛中，以讨论并确定正确的风险决策——安全意识现在已织入组织的肌理之中。


    ## 顾问式安全意识


    [费曼学习法]的灵感源于诺贝尔物理奖获得者**理查德·费曼**。


    1. 运用费曼技巧，你只需花上`20 min`就能深入理解知识点，而且记忆深刻，*难以遗忘*。


    ```

    if (condVar > someVal) {console.log("xxx")}

    ```


