  trans: '


    为了尝试将威胁行为者与其 TTP（战术、技术和程序）关联起来并进行归属认定，安全公司制定了自己的标识符。这些有时听起来很愚蠢的专利名称集合让人眼花缭乱。只需查询一下
    Fancy Bear 组，就能得到这段维基百科的描述：“Fancy Bear：


    你不需要记住这些好笑的名字，因为这些细节对于大多数从事网络安全工作的人来说并不重要。


    重要得多的是，是你花时间去了解你的组织拥有或做了哪些可能引起各种类型威胁行为者感兴趣的事情，以及你如何帮助你的组织向更安全的方向发展。


    ### 国家支持的攻击


    主权资金充足、技术先进，并受到政治、经济和国家安全军事原因的驱动。


    各国利用网络空间进行间谍活动并不令人意外。毕竟，世界已经转向在线，因此在今天，戴上伪装并用秘密相机拍摄文件已经没有意义了。现代国家拥有网络情报收集计划。以色列和美国拥有一些顶级的计划——对手`俄罗斯`、`中国`、`伊朗`和朝鲜也是如此。


    不意外的是，攻击者会寻找内部人员进行招募。2015 年，一个国家级行为者入侵了`人事管理局`（Office of Personnel Management）。


    最近的`SolarWinds` 事件


    `SolarWinds` 也凸显了针对较小供应商的攻击。虽然像`Microsoft` 或 `Amazon` 这样的大公司可能有资源自卫，但即使这些公司可能也难以抵御来自国家的针对攻击。值得考虑的是，组织永远不会被期望防御物理攻击，但由于某种原因被期望抵御国家级的网络攻击。


    国家还利用网络能力削弱其对手在冲突中的反应能力——无论是破坏电力设施，还是破坏核离心机等其他能力。当然，国家也利用网络空间进行间谍活动；他们只是在随时代更新间谍活动和战斗技术。


    但国家级攻击的目标已经扩展到传统的国家安全情报和反间报收集目的，甚至是为了冲突时期的环境准备。我们还看到个人报复的案例，例如伊朗政府在 2014 年对 `Sands
    Casino` 发起的破坏性恶意软件攻击。


    国家还利用复杂的在线心理战术来推动其国家安全目标，俄罗斯在社交媒体上干预选举就证明了这一点。


    各国利用网络攻击进行权力的不对称投影，以向其他国家展示非军事的“比例反应”。有时反应的目标是私营公司。例如，`伊朗`为了报复 2012 年美国政府的制裁，对美国金融机构发起了分布式拒绝服务（`DDoS`）攻击。


    国家还利用网络攻击获取经济优势。`中国`窃取了价值数十的美国贸易秘密，以帮助其经济飞跃发展，并让自己的企业在谈判和研发中处于优势。既然可以直接从美国公司偷一个公式，为什么要花几年时间研究新公式呢？既然你的政府可以获得竞争对手的提案，为什么要在一无所有的情况下进行合同谈判？前国家安全局（`NSA`）局长退休将军
    `Keith Alexander` 将其描述为“历史上最伟大的财富转移”。


    虽然美国政府确实出于国家安全原因做了相当大量的间谍工作，但它并不是为了支持美国企业进行间谍活动。国土安全部（`DHS`）多年来一直警告行业关注中国的知识产权窃取，最近又警告了中国产品中的后门。


    在一份 `DHS` 新闻稿中，代理局长 `Chad Wolfe` 指出，电视制造商 `TCL` 接受来自`中国共产党`的支持以在全球电子市场上进行竞争。`Wolfe`
    注意，“TCL 在其所有电视机中植入了后门，使使用户面临网络漏洞和数据泄露的风险。”


    这并不新鲜；`中国` 使用这些技术已经多年了，并继续不断进化和扩大其 TTP。


    其他国家寻求财务利益来资助其计划。像`朝鲜`这样受到严重制裁的国家已将其军队黑客转向网络犯罪，以充实政权库。`朝鲜`利用了对加密货币和金融机构的攻击。


    ### 网络犯罪分子


    网络犯罪并不是关于那种典型的、住在父母地下室里的家伙；它是一个复杂的行业。在世界上一些引渡潜力有限且法治不的国家，犯罪分子可以肆无忌惮地进行黑客活动，建立了像大型商业公司一样的组织，拥有帮助热线、培训、`R&D`部门和退款保证。在缺乏机会的地方，黑客提供了经济机会。像任何成功的业务一样，做法和技术随着市场格局而演变。


    当被盗的信用卡号和个人信息涌入暗网并导致价格下降（供需关系）时，网络犯罪分子开始尝试`恶意软件即服务`（malware as a service）、`业务邮件欺骗`（business
    email compromise）、复杂的人工操控勒索软件，以及最近的勒索 `DDoS`。


    有时威胁行为者会冒充其他已知的犯罪集团。从 2020 年年中开始，金融机构开始收到由冒充 `Fancy Bear` 或拉扎鲁斯小组（Lazarus Group）的行为者发送多个组织的信。


    有时国家与犯罪分子之间的界限会变得模糊。2020 年底，据报道 `Maze`、`Egregor` 和 `Evil Corp` 背后的威胁行为者与俄罗斯政府有关。一些报告声称
    `Maze`、`Egregor` 和 `Evil Corp` 都是由俄罗斯情报部门内部人员运营的同一个小组。美国财政部。


    政府员工也可能为网络犯罪组织工作以补充收入。归根结底，指导这些攻击的组织对企业来说并不如影响那样：勒索软件攻击在 2020 年给企业带来了 200 亿美元的损失。


    随着网络犯罪分子不断进化策略，他们也扩大了网络犯罪分群体。通过销售带有培训模块的`恶意软件即服务`，他们降低了成为网络犯罪分门槛。


    随着犯罪分子赚到更多钱，他们投入了更先进的技术，利用 `AI/ML`（人工智能/机器学习）并创建交付平台。


    ### 黑客主义者


    黑客主义


    ## 关键技术


    现在我们已经介绍了攻击背后的“谁”和“为什么”，我们将讨论一下攻击者是如何成功的。


    ### 钓鱼


    社会工程学仍然是最常见的攻击媒介。钓鱼是指通过伪装成信誉良好的公司的电子邮件试图获取个人个人信息的欺诈行为。钓鱼仍然占据统治地位，从`业务邮件欺骗`到`凭据收集`。


    当钓鱼邮件未成功时，攻击者会发送短信让员工点击链接或打开文件以启用恶意软件，或者在近年来经常是为了获取访问组织系统和数据的凭据。


    钓鱼者发送的消息范围广泛。从“您的电子邮件超过了大小限制”到“您的银行账户已被冻结”，再到“您有一个无法交付的包裹”。在 2020 年假日购物季前夕，`Dridex`
    背后的操作人员进行了一场大规模钓鱼诈骗，承诺收件者获得 100 美元的亚马逊礼品卡。


    '
