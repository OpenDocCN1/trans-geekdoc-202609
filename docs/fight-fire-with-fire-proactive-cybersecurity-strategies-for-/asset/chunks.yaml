- raw: '### Alignment to Risk Framework


    Each company has various methods by which they measure risk, typically in line
    with an enterprise risk management framework. Ensure that the security program
    has controls aligned to this framework, measured at the business unit level. Also,
    establish working sessions with people in the risk organization. They can be incredible
    advocates and assist in spreading the word about the security program.


    ## Program Build and Cultural Engagement


    The next phase involves building your security program while driving cultural
    engagement.


    ### Alignment to Business (Relationships)


    Relationship management is required throughout because cultural change cannot
    be enabled from the top down or bottom up—it must be woven into all levels of
    the organization. In this phase, determine if you can align dedicated personnel
    to the business and technology teams. If there are dedicated personnel, assign
    key leaders to have fireside chats with those teams. Be prepared with materials
    that describe the security mission and vision while also listening intently for
    business problems and how security could help to address them. With this knowledge,
    the security team will also gain insight into how to measure business outcomes
    and key results to further tell the security story. As the program builds, seek
    to establish business security champions—personnel who can be your ambassadors
    to carry the security message to the business.


    ### Ongoing Communication and Awareness Plan


    To be effective at driving program maturity, the security team must communicate
    the message in appropriate forums such as business steering committees, advisory
    groups, and councils. Hire appropriate personnel who are not technologists to
    help craft the messages in business meaningful ways with clear examples that convey
    the message about the value security brings to the organization. Besides the business
    forums, work with your colleagues in risk to identity risk forums to share information
    about the security program and seek advice. As part of these forums, establish
    a metric about the consulting engagements that security is asked to participate
    in. As the program matures, they should turn from tactical requests to strategic
    requests for programs.


    Educating employees about their responsibilities is one of the most important
    parts of your program build. These programs can utilize either a carrot or stick
    approach, and possibly both. Start by making the program personal—offer tips to
    utilize with home computers to enhance the online safety of employees'' children
    and even that of their aging parents.


    People want to do the right thing. Start with the basics and educate personnel
    in three to five areas and then measure their successes. Encourage positive behavior
    in reporting issues—celebrate those successes with your company''s rewards program
    and articles on the intranet spotlighting an individual who did the right thing.
    These individuals will tell ten to twenty more people what they did to receive
    praise, continuing to spread security awareness. Throughout the program build,
    measure reporting of issues to the security team. If done right, you should see
    an increase in reporting over time.


    Spend time having fireside chats with the frontline personnel—those in the help
    desk or customer care centers. Provide insight on things that do not seem right.
    Act on reports from these teams because these reports can often be the first sign
    of a possible issue. Praise these folks for their work; make sure their managers
    know about and reward positive behavior through your company''s rewards program
    for reporting security issues.


    For all employees, play games! Yes, I said play games. Choose games that encourage
    the players to learn trivia about security. Do crossword puzzles and play trivia
    games; then reward people with prizes. Remember: those who are rewarded will tell
    someone, and they will tell someone, and so on. As an example, have a top-ten
    set of questions about security and give hints throughout October, which is National
    Security Awareness month. Give a prize for the first person who answers all the
    trivia questions correctly. For another example, host a session where the security
    group demonstrates capabilities and provides security advice. Give a prize to
    the individual who gets the most security booths stamped on their card, like many
    conferences do.


    Of course, building a culture of security cannot be all fun and games. A consequences
    model, aligned with human resources, is needed for certain behaviors. For example,
    if an employee has privileged access to systems but abuses that privilege, what
    are the consequences, given the severity of the misuse of trust? And how do you
    differentiate between deliberate abuse and problems that arise when employees
    are in a hurry and skip security steps?


    Lastly, do not forget about customers—work with your business lines to understand
    their customers'' net promoter scores and find out what customers care about in
    terms of security. You can then connect those findings to the security program,
    and the rationale for those measures will resonate in terms of customer satisfaction.
    This metric will tie your security program to a customer trust score, and as the
    program matures, the customer trust score will increase.


    ### Initial Net Promoter Score


    In this program build phase, take the initial measurement of the score of the
    security program—from all levels of the organization. Use this as input to tailor
    messages about program success and as insight into the best ways to engage with
    employees for security awareness. Leave room for open-ended questions about what
    is being done well and where there is opportunity for growth. Share this score
    and tie it to program metrics on engagement as discussed earlier.


    ### Measurement of Target Maturity


    Once you have selected a framework to measure maturity, incorporate reporting
    on the program into risk and business forums. Building on those relationships,
    seek advice on how to connect maturity improvements into illustrations of business
    value. This is the start of establishing metrics that matter—meaningful to describe
    risk and to communicate to the board and to the business. Metrics and reporting
    need to be tailored to the audience and should be somewhat distinct for each one.
    Explain why and how these are important to enable the business.


    ### Talent Acquisition


    Depending on the funding available, ensure that you staff the most important functions
    and seek traditional and nontraditional backgrounds for your staffing. Interview
    for skill as well as cultural fit in the company and find personnel who can speak
    the language of the business.


    ### Begin Program Execution


    Develop the key tenets of program execution and report them to necessary constituents.
    Have the key messages and the mission and vision of the organization ready to
    share with risk committees, forums, and business meetings. Find ways to tie the
    messages into the culture of the company and communicate how the program raises
    security awareness for employees and customers.


    ### Reporting to Risk Framework


    Be totally transparent about the overall status of the program. Show how the program
    is improving the effectiveness of security. Measurements are likely to be mainly
    qualitative.


    ## Target Maturity and Cultural Enlightenment


    In this phase of the program, the organization achieves the target maturity level
    and can offer mature services. Continued work is needed so that the culture of
    security permeates the organization.


    ### Business Relationships in Place (Security Embraced)'
