    ### It''s Not All About You


    It''s actually not even mostly about you. It''s about the business and what they
    are trying to achieve, and it''s about the customers and the safety they expect
    and deserve. As security pros, we are here to enable the business to achieve their
    goals safely. If the business is a race car, we are the brake; we are the pit
    crew when needed—there to fix, diagnose problems, and radio the driver so they
    know when it''s safe to hit the gas as well as inform them of potential threats
    and risks. We are the emergency response team when something really goes wrong.


