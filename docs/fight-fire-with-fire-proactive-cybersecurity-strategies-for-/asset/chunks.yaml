- raw: "SOAR solutions offer faster incident response and standardize and scale processes\
    \ that improve security and reduce business risks and costs. An effective SOAR\
    \ solution remediates the flooding of alerts, reduces repetitive manual processes,\
    \ and augments tasks by filling in the gap where resources are limited. Teams\
    \ can create automated playbooks versus having to write scripts manually. They\
    \ can triage incidents in real time to do remediation for their enterprises.\n\
    \nAn effective SOAR system can be a valuable tool to alleviate the strain on IT\
    \ and security teams by incorporating automated responses to various events. Security\
    \ teams can customize a SOAR system to fit their organization's needs.\n\n###\
    \ Extended Detection and Response (XDR)\n\nAn emerging trend in detection and\
    \ incident response is extended detection and response (XDR). An XDR solution\
    \ collects and then correlates data across security layers, including endpoints,\
    \ email, servers, cloud workloads, and the network itself. It's an alternative\
    \ approach to traditional detection and incident response procedures. XDR solutions\
    \ integrate detection and response across multiple environments and provide a\
    \ more holistic view of threats.\n\nIn many instances, well-crafted threats are\
    \ hard to detect because they hide between security silos. Incidents spread faster\
    \ and fly under the radar of the SOC—ultimately causing more damage.\n\nAn XDR\
    \ solution isolates and dissects these threats. It correlates each threat with\
    \ individual security layers. As organizations look to reduce complexity in their\
    \ environments, an effective XDR solution is able to collect, normalize, and correlate\
    \ data from a wider range of sources. It allows security teams to be faster and\
    \ more effective at threat detection and response.\n\n## Adaptive Cloud Security\n\
    \nAs organizations adopt multi-cloud strategies and remote workforce policies,\
    \ networks have grown more distributed and workers more dependent on cloud applications\
    \ and environments. Organizations often have business-critical data and services\
    \ scattered across clouds and data centers. In many cases, security solutions\
    \ have not kept pace with cloud-based innovations. Organizations often end up\
    \ with a heterogeneous set of technologies, with disparate cloud security controls\
    \ in various cloud environments.\n\nFurther complicating matters, some organizations\
    \ unknowingly find themselves in what's called the shared responsibility model,\
    \ which makes the cloud provider responsible for some aspects of security and\
    \ the cloud user responsible for other aspects. Therefore, it is essential to\
    \ understand your service level agreements with your provider so you know who\
    \ is responsible for what and do not assume anything. For example, for SaaS deployments,\
    \ the provider is responsible for the availability and safe access to the application.\
    \ On the other hand, the customer is responsible for platform configuration, tracking\
    \ of security events, and data.\n\nAs organizations look to migrate more of their\
    \ on-prem services to the cloud, they still need to have visibility and control\
    \ in these environments. A cloud access security broker (CASB) sits between the\
    \ cloud users and the cloud applications. It adds a layer of security by monitoring\
    \ activity and ensuring policy compliance.\n\nCASBs offer insights into users,\
    \ user behavior, and the data stored in major SaaS applications. They also provide\
    \ data security, data loss prevention, and threat detection capabilities.\n\n\
    The cloud offers organizations immense business opportunities to be agile, efficient,\
    \ and cost effective. But without the right security infrastructure in place,\
    \ the cloud may present serious security challenges.\n\nMany organizations adopt\
    \ a multi-cloud strategy to reduce risk (as in, don't put all your eggs in one\
    \ basket). Mergers and acquisitions may force a multi-cloud strategy as can adoption\
    \ of certain applications or services available on only one cloud platform.\n\n\
    Multi-cloud increases complexity for security teams as each cloud provider has\
    \ different security tools, approaches, and configuration capabilities.\n\nTo\
    \ overcome these challenges, enterprises need solutions that integrate with all\
    \ major cloud providers, cover the entire attack surface, and provide centralized\
    \ security management.\n\n## Conclusion\n\nEnd-to-end security requires a platform\
    \ that offers integrated functionality and open APIs to incorporate information\
    \ and capabilities from existing tools and threat intelligence. Effective use\
    \ of a security platform will integrate your operations and your threat intelligence,\
    \ help you manage complexity, and provide automation to achieve speed and consistency.\
    \ To meet the challenges of today and tomorrow and have a chance of getting ahead\
    \ of increasingly sophisticated and automated adversaries, you need broad visibility\
    \ across the entire digital attack surface. With such an end-to-end security platform,\
    \ it is possible to better manage risk, reduce the complexity of supporting multiple\
    \ point products, and enable automated workflows to increase the speed of operations\
    \ and response.\n\n# Glossary\n\n**AI/ML**\n\n: Artificial intelligence/machine\
    \ learning. \n\n**API**\n\n: Application programming interface. \n\n**APT**\n\n\
    : Advanced persistent threat. \n\n**AWS**\n\n: Amazon Web Services. \n\n**Backdoor**\n\
    \n: Method by which users are able to get around normal security measures and\
    \ gain high-level access to a system. \n\n**CapEx**\n\n: Capital expenditures.\
    \ Cloud adoption often moves capital expenditures (for purchasing, maintaining,\
    \ and running hardware and software) to operating expenses (subscription and/or\
    \ monthly usage fees). \n\n**CASB**\n\n: Cloud access security broker. \n\n**CERT**\n\
    \n: Computer emergency response team. \n\n**CFO**\n\n: Chief financial officer.\
    \ \n\n**CGO**\n\n: Chief governance officer. \n\n**CIO**\n\n: Chief information\
    \ officer. \n\n**CISO**\n\n: Chief information security officer. \n\n**CISSP**\n\
    \n: Certified Information Systems Security Professional; a certification offered\
    \ by the International Information System Security Certification Consortium (ISC)².\
    \ \n\n**CPRA**\n\n: California Privacy Rights Act. \n\n**CRO**\n\n: Chief risk\
    \ officer. \n\n**CSA**\n\n: Cloud Security Alliance. \n\n**C-SCRM**\n\n: Cyber\
    \ supply chain risk management (see [Chapter 10](#c10.xhtml)). \n\n**CCPA**\n\n\
    : California Consumer Privacy Act. \n\n**CSP**\n\n: Cloud service provider. \n\
    \n**CSPM**\n\n: Cloud security posture management. \n\n**C-suite**\n\n: Refers\
    \ to the executive-level managers within a company. Common C-suite executives\
    \ include chief executive officer (CEO), chief financial officer (CFO), chief\
    \ operating officer (COO), and chief information officer (CIO). \n\n**CWPP**\n\
    \n: Cloud workload protection platform. \n\n**Dark web**\n\n: Pages on the web\
    \ that aren’t indexed by any search engines and aren’t viewable in a standard\
    \ browser. \n\n**DARPA**\n\n: Defense Advanced Research Projects Agency. The agency\
    \ that created the ARPAnet, predecessor of the internet. \n\n**DDoS**\n\n: Distributed\
    \ denial of service. \n\n**DevOps**\n\n: A practice in which development teams\
    \ work closely with operations teams. \n\n**DHS**\n\n: Department of Homeland\
    \ Security. \n\n**Digital transformation**\n\n: Using digital technologies to\
    \ transform business processes, user experiences, and products. \n\n**DLP**\n\n\
    : Data loss protection. \n\n**DoD/IC**\n\n: Department of Defense/Intelligence\
    \ Community. \n\n**Doxing**\n\n: The practice of publicly revealing private information\
    \ about someone, such as their phone number or address. \n\n**EDR**\n\n: Endpoint\
    \ detection and response. \n\n**Effovation**\n\n: A term coined by Susan Koski\
    \ to describe a blend of efficiency and innovation (see [Chapter 3](#c03.xhtml)).\
    \ \n\n**Endpoint security**\n\n: The practice of securing end-user devices such\
    \ as desktops, laptops, and mobile devices from being exploited by malicious actors\
    \ and campaigns. \n\n**EPP**\n\n: Endpoint protection platform. \n\n**FCI**\n\n\
    : Federal contract information. \n\n**GRC**\n\n: Governance, risk, and compliance.\
    \ \n\n**Hacktivist**\n\n: Attackers who have a political or social agenda. \n\n\
    **Hairpinning**"
  fmt: '

    `SOAR` solutions offer faster incident response and standardize and scale processes
    that improve security and reduce business risks and costs. An effective `SOAR`
    solution remediates the flooding of alerts, reduces repetitive manual processes,
    and augments tasks by filling in the gap where resources are limited. Teams can
    create automated playbooks versus having to write scripts manually. They can triage
    incidents in real time to do remediation for their enterprises.


    An effective `SOAR` system can be a valuable tool to alleviate the strain on IT
    and security teams by incorporating automated responses to various events. Security
    teams can customize a `SOAR` system to fit their organization''s needs.


    ## Extended Detection and Response (XDR)


    An emerging trend in detection and incident response is extended detection and
    response (`XDR`). An `XDR` solution collects and then correlates data across security
    layers, including endpoints, email, servers, cloud workloads, and the network
    itself. It''s an alternative approach to traditional detection and incident response
    procedures. `XDR` solutions integrate detection and response across multiple environments
    and provide a more holistic view of threats.


    In many instances, well-crafted threats are hard to detect because they hide between
    security silos. Incidents spread faster and fly under the radar of the `SOC`—ultimately
    causing more damage.


    An `XDR` solution isolates and dissects these threats. It correlates each threat
    with individual security layers. As organizations look to reduce complexity in
    their environments, an effective `XDR` solution is able to collect, normalize,
    and correlate data from a wider range of sources. It allows security teams to
    be faster and more effective at threat detection and response.


    ## Adaptive Cloud Security


    As organizations adopt multi-cloud strategies and remote workforce policies, networks
    have grown more distributed and workers more dependent on cloud applications and
    environments. Organizations often have business-critical data and services scattered
    across clouds and data centers. In many cases, security solutions have not kept
    pace with cloud-based innovations. Organizations often end up with a heterogeneous
    set of technologies, with disparate cloud security controls in various cloud environments.


    Further complicating matters, some organizations unknowingly find themselves in
    what''s called the shared responsibility model, which makes the cloud provider
    responsible for some aspects of security and the cloud user responsible for other
    aspects. Therefore, it is essential to understand your service level agreements
    with your provider so you know who is responsible for what and do not assume anything.
    For example, for `SaaS` deployments, the provider is responsible for the availability
    and safe access to the application. On the other hand, the customer is responsible
    for platform configuration, tracking of security events, and data.


    As organizations look to migrate more of their on-prem services to the cloud,
    they still need to have visibility and control in these environments. A cloud
    access security broker (`CASB`) sits between the cloud users and the cloud applications.
    It adds a layer of security by monitoring activity and ensuring policy compliance.


    `CASBs` offer insights into users, user behavior, and the data stored in major
    `SaaS` applications. They also provide data security, data loss prevention, and
    threat detection capabilities.


    The cloud offers organizations immense business opportunities to be agile, efficient,
    and cost effective. But without the right security infrastructure in place, the
    cloud may present serious security challenges.


    Many organizations adopt a multi-cloud strategy to reduce risk (as in, don''t
    put all your eggs in one basket). Mergers and acquisitions may force a multi-cloud
    strategy as can adoption of certain applications or services available on only
    one cloud platform.


    Multi-cloud increases complexity for security teams as each cloud provider has
    different security tools, approaches, and configuration capabilities.


    To overcome these challenges, enterprises need solutions that integrate with all
    major cloud providers, cover the entire attack surface, and provide centralized
    security management.


    ## Conclusion


    End-to-end security requires a platform that offers integrated functionality and
    open `APIs` to incorporate information and capabilities from existing tools and
    threat intelligence. Effective use of a security platform will integrate your
    operations and your threat intelligence, help you manage complexity, and provide
    automation to achieve speed and consistency. To meet the challenges of today and
    tomorrow and have a chance of getting ahead of increasingly sophisticated and
    automated adversaries, you need broad visibility across the entire digital attack
    surface. With such an end-to-end security platform, it is possible to better manage
    risk, reduce the complexity of supporting multiple point products, and enable
    automated workflows to increase the speed of operations and response.


    # Glossary


    - `AI/ML`: Artificial intelligence/machine learning.

    - `API`: Application programming interface.

    - `APT`: Advanced persistent threat.

    - `AWS`: Amazon Web Services.

    - `Backdoor`: Method by which users are able to get around normal security measures
    and gain high-level access to a system.

    - `CapEx`: Capital expenditures. Cloud adoption often moves capital expenditures
    (for purchasing, maintaining, and running hardware and software) to operating
    expenses (subscription and/or monthly usage fees).

    - `CASB`: Cloud access security broker.

    - `CERT`: Computer emergency response team.

    - `CFO`: Chief financial officer.

    - `CGO`: Chief governance officer.

    - `CIO`: Chief information officer.

    - `CISO`: Chief information security officer.

    - `CISSP`: Certified Information Systems Security Professional; a certification
    offered by the International Information System Security Certification Consortium
    (`ISC`)².

    - `CPRA`: California Privacy Rights Act.

    - `CRO`: Chief risk officer.

    - `CSA`: Cloud Security Alliance.

    - `C-SCRM`: Cyber supply chain risk management (see [Chapter 10](#c10.xhtml)).

    - `CCPA`: California Consumer Privacy Act.

    - `CSP`: Cloud service provider.

    - `CSPM`: Cloud security posture management.

    - `C-suite`: Refers to the executive-level managers within a company. Common C-suite
    executives include chief executive officer (`CEO`), chief financial officer (`CFO`),
    chief operating officer (`COO`), and chief information officer (`CIO`).

    - `CWPP`: Cloud workload protection platform.

    - `Dark web`: Pages on the web that aren’t indexed by any search engines and aren’t
    viewable in a standard browser.

    - `DARPA`: Defense Research Projects Agency. The agency that created the `ARPAnet`,
    predecessor of the internet.

    - `DDoS`: Distributed denial of service.

    - `DevOps`: A practice in which development teams work closely with operations
    teams.

    - `DHS`: Department of Homeland Security.

    - `Digital transformation`: Using digital technologies to transform business processes,
    user experiences, and products.

    - `DLP`: Data loss protection.

    - `DoD/IC`: Department of Defense/Intelligence Community.

    - `Doxing`: The practice of publicly revealing private information about someone,
    such as their phone number or address.

    - `EDR`: Endpoint detection and response.

    - `Effovation`: A term coined by Susan Koski to describe a blend of efficiency
    and innovation (see [Chapter 3](#c03.xhtml)).

    - `Endpoint security`: The practice of securing end-user devices such as desktops,
    laptops, and mobile devices from being exploited by malicious actors and campaigns.

    - `EPP`: Endpoint protection platform.

    - `FCI`: Federal contract information.

    - `GRC`: Governance, risk, and compliance.

    - `Hacktivist`: Attackers who have a political or social agenda.

    - `Hairpinning`

