- raw: 'We all know that we can''t answer the question “Are we secure?” with any certitude
    because even if we''re actually secure at this precise moment, we might not be
    in the next hour, given all the changes in our business environments, in our hardware,
    in our software, and in the world outside our virtual walls. But organizations
    must constantly figure out if they''re secure enough.


    Key components of understanding whether security is adequate include whether the
    organization is detecting what they should, preventing what they should, remediating
    issues rapidly enough, and keeping up with all the ever-changing factors that
    impact our security.


    Crafting a set of metrics, or key risk indicators (KRIs), for the information
    security program to address each of these areas is critical for understanding
    variance between actual performance and risk appetite targets. Each KRI needs
    to have a threshold that aligns with the organization''s risk appetite.


    Placing KRIs in a logical framework will more clearly communicate status and highlight
    any area operating outside of the risk appetite and therefore requiring additional
    management focus. For example, if we''re trying to determine whether we''re responding
    well to incidents, our KRIs could include average response time, average containment
    time, and average remediation time, perhaps with trending of each. If the organization''s
    risk appetite is “low,” then each of these KRIs needs thresholds for “low” as
    well as for “medium” and “high.” Performance should be in the “low” range, if
    that''s your organization''s stated appetite. Being temporarily in “medium” might
    be within risk tolerance but would require actions to address processes and controls
    to get back to “low” in the near term.


    With KRIs in the categories of prevention, detection, and response, we have the
    main elements to understand if we''re operating within risk appetite. To ensure
    that our current security posture is sustainable, we also need KRIs around whether
    we are keeping pace with the changing environment—skill sets, threat landscape,
    regulatory requirements, and so on.


    A summary-level security dashboard aggregated from more detailed information offers
    a succinct way to communicate these KRIs and their status, color-coded with familiar
    red, yellow, and green (think traffic lights).


    By presenting KRIs around detecting, preventing, responding, and awareness in
    this fashion and adding an executive summary with a few bullet points, you highlight
    key items of interest to leadership and bring focus to areas that need immediate
    attention.


    The whole point of a dashboard that tells a complete and compelling story at a
    glance is to ensure that investments are being made in the right places and that
    capabilities and processes are implemented to protect the organization and its
    customers. An intuitive dashboard is a powerful tool in garnering sufficient attention
    and funding to ensure preparedness. Of course, that preparedness must be complemented
    by having the resources needed to rapidly respond to and remediate any incidents.


    Once you have the answer to whether performance is within risk appetite—and the
    remediation plans to bring it back within the desired threshold, if not—then what?
    Where and how is this information used?


    ## How to Engage in Governance and Oversight of Cyber Risk


    The CISO of any organization where cyber is a critical risk should be actively
    engaged in the governance structure of the company. This structure may include
    subcommittees of an internal enterprise risk management committee that reports
    to the board of directors or to a subcommittee of the board. The overall structure
    might look something like [Figure 6-1](#c06.xhtml#c06-fig-0001).


    In order for the CISO to be engaged in the right places, he or she should consider
    in which corporate-level or enterprise committee(s) it would be appropriate to
    participate. If there is an overall enterprise risk management committee, it''s
    vital that the CISO be a voting member. This level of participation gives CISOs
    visibility into and influence over the management of related and integrated risks
    such as business continuity and resiliency, third-party risk, reputation risk,
    and so on.


    Though its name may vary, the enterprise risk management committee usually approves
    the organization''s overall risk appetite statement, along with any revisions
    to it. This committee is also tasked with understanding performance against the
    various risk appetite thresholds.


    ![Figure 6-1. An organization chart for risk management](images/c06f001.png)


    [*Figure 6-1*](#c06.xhtml#R_c06-fig-0001). *An organization chart for risk management*


    If cyber risk performance is outside of the risk appetite or, worse, outside of
    risk tolerance, the Enterprise Risk Management Committee, or its equivalent, would
    be the place the CISO would look for corporate direction and support. In addition
    to the ERM Committee, the CISO should also be a voting member of those few appropriate
    sub-committees, if they exist, focused on the other most critical risk areas,
    such as the Business Continuity Steering Committee and the IT Risk Governance
    Committee. The CISO should participate here to guide these critical programs,
    which are interwoven with and support the company''s security posture, in order
    to ensure decisions and actions undertaken strengthen cyber risk management for
    the organization.


    One area to call out specifically: if the organization has a Privacy Committee
    or a Privacy Office, it would be highly beneficial for the CISO to participate
    or have a close working relationship with this group. With a plethora of recent
    privacy regulations, combined with technology changes and the advances fraudsters
    have made, items to be considered relative to incident response and data and voice
    protection have expanded:


    *   It''s now more likely that a security incident could also be a privacy incident
    with legal privacy requirements to satisfy.


    *   If there is a suspicion of an incident, consider engaging the Privacy and
    Legal departments immediately and discussing the appropriateness of working and
    communicating under attorney/client privilege. Also ensure that all work done
    will be supportive of satisfying legislative privacy requirements.


    *   There may be constraints against sharing with law enforcement as we have in
    the past, whether that''s the data shared, when it''s shared, or how and for what
    purpose it''s shared.


    How these incidents are handled has a great impact on a company''s reputation
    so, here again, if the CISO has been engaged in the Business Continuity Steering
    Committee and has a comprehensive understanding of the entity''s Crisis Management
    Plan and its structure, he or she will know how to engage this process and leverage
    it for the greatest success in handling events.


    Other benefits of the CISO''s active participation in governance committees include
    enabling the CISO to:


    *   Speak the language of integrated risk to the company''s customers, regulators,
    and other key stakeholders


    *   Guide the company''s view of cyber risk as a top risk for the organization


    *   Understand emerging risks in other areas that might have an impact on the
    cyber risk posture


    *   Demonstrate to external stakeholders effective oversight of the information
    security program and cyber risk


    *   Be an advocate for the business


    Digital transformation, embedding of electronic interfaces in all products, virtualization,
    and other trends are going to continue to pick up speed and become even more pervasive.
    As a result, the CISO''s strong and active engagement in their company''s strategy
    development, governance structure, risk appetite statements, and integrated risk
    posture will become even more important. With an understanding of how the various
    risks are interwoven to impact a company''s cyber risk posture, the CISO can be
    well positioned to vigorously support the achievement of corporate objectives.'
  fmt: '

    We all know that we can''t answer the question “Are we secure?” with any certitude
    because even if we''re actually secure at this precise moment, we might not be
    in the next hour, given all the changes in our business environments, in our hardware,
    in our software, and in the world outside our virtual walls. But organizations
    must constantly figure out if they''re secure enough.


    Key components of understanding whether security is adequate include whether the
    organization is detecting what they should, preventing what they should, remediating
    issues rapidly enough, and keeping up with all the ever-changing factors that
    impact our security.


    Crafting a set of metrics, or key risk indicators (`KRIs`), for the information
    security program to address each of these areas is critical for understanding
    variance between actual performance and risk appetite targets. Each `KRI` needs
    to have a threshold that aligns with the organization''s risk appetite.


    Placing `KRIs` in a logical framework will more clearly communicate status and
    highlight any area operating outside of the risk appetite and therefore requiring
    additional management focus. For example, if we''re trying to determine whether
    we''re responding well to incidents, our `KRIs` could include average response
    time, average containment time, and average remediation time, perhaps with trending
    of each. If the organization''s risk appetite is “low,” then each of these `KRIs`
    needs thresholds for “low” as well as for “medium” and “high.” Performance should
    be in the “low” range, if that''s your organization''s stated appetite. Being
    temporarily in “medium” might be within risk tolerance but would require actions
    to address processes and controls to get back to “low” in the near term.


    With `KRIs` in the categories of prevention, detection, and response, we have
    the main elements to understand if we''re operating within risk appetite. To ensure
    that our current security posture is sustainable, we also need `KRIs` around whether
    we are keeping pace with the changing environment—skill sets, threat landscape,
    regulatory requirements, and so on.


    A summary-level security dashboard aggregated from more detailed information offers
    a succinct way to communicate these `KRIs` and their status, color-coded with
    familiar red, yellow, and green (think traffic lights).


    By presenting `KRIs` around detecting, preventing, responding, and awareness in
    this fashion and adding an executive summary with a few bullet points, you highlight
    key items of interest to leadership and bring focus to areas that need immediate
    attention.


    The whole point of a dashboard that tells a complete and compelling story at a
    glance is to ensure that investments are being made in the right places and that
    capabilities and processes are implemented to protect the organization and its
    customers. An intuitive dashboard is a powerful tool in garnering sufficient attention
    and funding to ensure preparedness. Of course, that preparedness must be complemented
    by having the resources needed to rapidly respond to and remediate any incidents.


    Once you have the answer to whether performance is within risk appetite—and the
    remediation plans to bring it back within the desired threshold, if not—then what?
    Where and how is this information used?


    ## How to Engage in Governance and Oversight of Cyber Risk


    The CISO of any organization where cyber is a critical risk should be actively
    engaged in the governance structure of the company. This structure may include
    subcommittees of an internal enterprise risk management committee that reports
    to the board of directors or to a subcommittee of the board. The overall structure
    might look something like [Figure 6-1](#c06.xhtml#c06-fig-0001).


    In order for the CISO to be engaged in the right places, he or she should consider
    in which corporate-level or enterprise committee(s) it would be appropriate to
    participate. If there is an overall enterprise risk management committee, it''s
    vital that the CISO be a voting member. This level of participation gives CISOs
    visibility into and influence over the management of related and integrated risks
    such as business continuity and resiliency, third-party risk, reputation risk,
    and so on.


    Though its name may vary, the enterprise risk management committee usually approves
    the organization''s overall risk appetite statement, along with any revisions
    to it. This committee is also tasked with understanding performance against the
    various risk appetite thresholds.


    ![Figure 6-1. An organization chart for risk management](images/c06f001.png)


    [Figure 6-1](#c06.xhtml#R_c06-fig-0001). An organization chart for risk management


    If cyber risk performance is outside of the risk appetite or, worse, outside of
    risk tolerance, the Enterprise Risk Management Committee, or its equivalent, would
    be the place the CISO would look for corporate direction and support. In addition
    to the `ERM Committee`, the CISO should also be a voting member of those few appropriate
    sub-committees, if they exist, focused on the other most critical risk areas,
    such as the Business Continuity Steering Committee and the IT Risk Governance
    Committee. The CISO should participate here to guide these critical programs,
    which are interwoven with and support the company''s security posture, in order
    to ensure decisions and actions undertaken strengthen cyber risk management for
    the organization.


    One area to call out specifically: if the organization has a Privacy Committee
    or a Privacy Office, it would be highly beneficial for the CISO to participate
    or have a close working relationship with this group. With a plethora of recent
    privacy regulations, combined with technology changes and the advances fraudsters
    have made, items to be considered relative to incident response and data and voice
    protection have expanded:


    *   It''s now more likely that a security incident could also be a privacy incident
    with legal privacy requirements to satisfy.

    *   If there is a suspicion of an incident, consider engaging the Privacy and
    Legal departments immediately and discussing the appropriateness of working and
    communicating under attorney/client privilege. Also ensure that all work done
    will be supportive of satisfying legislative privacy requirements.

    *   There may be constraints against sharing with law enforcement as we have in
    the past, whether that''s the data shared, when it''s shared, or how and what
    purpose it''s shared.


    How these incidents are handled has a great impact on a company''s reputation
    so, here again, if the CISO has been engaged in the Business Continuity Steering
    Committee and has a comprehensive understanding of the entity''s Crisis Management
    Plan and its structure, he or she will know how to engage this process and leverage
    it for the greatest success in handling events.


    Other benefits of the CISO''s active participation in governance committees include
    enabling the CISO to:


    *   Speak the language of integrated risk to the company''s customers, regulators,
    and other key stakeholders

    *   Guide the company''s view of cyber risk as a top risk for the organization

    *   Understand emerging risks in other areas that might have an impact on the
    cyber risk posture

    *   Demonstrate to external stakeholders effective oversight of the information
    security program and cyber risk

    *   Be an advocate for the business


    Digital transformation, embedding of electronic interfaces in all products, virtualization,
    and other trends are going to continue to pick up speed and become even more pervasive.
    As a result, the CISO''s strong and active engagement in their company''s strategy
    development, governance structure, risk appetite statements, and integrated risk
    posture will become even more important. With an understanding of how the various
    risks are interwoven to impact a company''s cyber risk posture, the CISO can be
    well positioned to vigorously support the achievement of corporate objectives.

