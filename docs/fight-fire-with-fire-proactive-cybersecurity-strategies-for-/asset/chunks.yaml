  trans: '

    通过整合有关新兴威胁的全球数据、新的缓解策略和最佳实践的高级解决方案，您更有机会领先于威胁对手。统一的威胁情报是基础，并且必须指导本章中描述的所有端到端安全能力。


    ## 集成安全平台赋能并保护数字创新


    本章的一个核心主题是集成的需求。只有当每个组件都依赖于安全织网（security fabric）时，利用统一的威胁情报以及本文描述的任何其他关键能力才能发挥作用。如果每个组件都必须提供自己的威胁情报或与另一个系统集成，那么端到端的安全将是不可能实现的。相反，威胁情报等关键能力必须是集成的，而不是事后补上去的。


    完全集成的安全平台在一个软件包中提供了关键能力，包括更快的入侵检测速度、更低的所有权成本以及更高的投资回报率——这使公司能够节省人力和维护成本。


    开放平台被设计为完全集成的，但也可以整合现有解决方案，以便企业无需进行拆除和重换。


    端到端安全平台的构建模块包括安全驱动网络、零信任访问、动态云保护以及 AI 驱动的安全运营的技术解决方案。这些功能受威胁情报的指导，由 AI/自动化驱动，并通过单一窗格（single
    pane of glass）进行管理。


    ### 安全驱动网络


    传统的网络架构和设计倾向于先构建网络访问，然后堆叠安全层——本质上将它们视为两个独立的领域。当今的动态工作环境要求网络能够让任何人使用任何设备从任何位置访问任何资源。此外，竞争异常激烈的市场激励组织为客户和员工提供优化的用户体验，同时提供充分的安全保障。


    正如我们在第 13 章中更深入讨论的那样，安全驱动网络将网络与安全融合。当安全织入网络核心时，网络就可以演进和扩展以满足数字需求，同时降低风险。这种方法提供了一个高度灵活且适应的环境，可以支持创新并利用超大规模计算、多云环境和
    5G 等技术趋势。


    传统的（WAN）架构在访问云服务时经常面临延迟和性能缓慢等问题。此外，组织继续为提供用户用户体验的 WAN 传输支付昂贵的 MPLS 成本。


    软件定义广域网（`SD-WAN`）解决方案越来越流行。此类解决方案简化了 WAN 的管理和操作，降低了成本，并允许远程分支机构直接访问云，从而消除了流量回传（将所有分支机构流量通过数据中心路由）。`SD-WAN`
    通过优先考虑业务关键流量和实时服务提高了性能。


    大多数 `SD-WAN` 解决方案提供基础防火墙和虚拟专用网络（`VPN`）功能。然而，这些功能通常不足，迫使 IT 团队增加额外的安全层，增加了复杂性、增加了故障点并提高了成本。相反，组织应该寻找提供广泛集成安全特性的
    `SD-WAN` 解决方案，例如下一代防火墙、入侵防御、加密、防病毒和沙箱功能。当您采用结合这些方法时，您将获得更好的性能、加速的网络安全收敛、一致的网络和安全策略以及运营效率。


    过去，组织要求位于办公室外的员工直接连接回核心网络以访问云应用程序和数据。如今的企业正努力采用融合的安全和网络策略，以应对以下主导趋势，包括：


    *   多云环境的普及。

    *   更远程、更分布式的劳动力通过云应用程序工作并访问内部数据，这可能导致安全和网络策略及执行机制的不一致。

    *   对用户体验改进和工作流优化的需求，因为 70% 的用户倾向于远程工作，但仍报告网络性能问题。


    这些趋势驱动了对安全访问边缘（`SASE`）的需求——一种通过云原生架构在云边缘交付的安全和网络解决方案包。根据 Gartner 的定义，`SASE` 融合了网络和安全技术，并允许用户在任何地方（无论是在网络内外）进行灵活消费。


    `SASE` 解决方案可以提供：


    *   网络边缘的一致保护

    *   无论用户位置如何都应用防火墙和安全策略

    *   能够从资本支出（CapEx）模式转到运营支出（OpEx）模式以降低成本并减少复杂性


    ### 零信任访问


    许多组织今天面临安全挑战，是因为他们并不完全清楚网络上到底是谁是什么；他们缺乏可见性和控制。如果你看不见，就无法保护它。在当今世界，员工和客户需要随时、随地通过任何设备进行访问。无论他们在何地工作、何时工作或使用什么工具工作，您的员工队伍都需要持续的监控和保护。


    传统上，企业对来自外部的网络攻击的担忧多于内部人员带来的恶意或无意威胁。越来越多的攻击和泄露涉及已经在网络内部的人员和设备。


    不再有网络边界，没有内外之分。监控必须扩展到两个以前不是重点关注的领域：网络内部（曾被认为是安全的）以及边缘泛滥的终端（以前并不存在）。


    组织现在面临更多连接到网络的 `IoT` 和 `OT` 设备，例如读卡器、自动贩卖机和通风系统。由于这些“无头”设备在设计时没有考虑安全性，且通常在安全和
    IT 部门不知情的情况下连接，这使组织面临更多威胁。


    领导者必须转变思维，将每个用户和设备视为本质上不可信的，无论他们在何处。用户和设备对资源的访问请求只有在用户或设备经过验证后才会授予。这种方法被称为零信任模型（`ZTA`）。


    实施零信任访问方法侧重于对连接到网络是谁是什么具有可见性和控制力。它要求实施控制措施来识别、验证和监控用户及设备，无论他们是在网络内还是网络外。你必须在用户访问企业应用程序和数据时持续验证。你还必须能够识别、分类并对网络上的每个设备进行画像描述。同样，根据最小权限原则，人和设备应仅具有绝对所需的访问权限。这涉及分段、职责分离和“按需知”的访问。


    在涉及为用户实施 `ZTA` 时，组织必须验证每个尝试获取访问权限的用户以及他们在组织中扮演的角色——他们是员工、承包商、访客、合作伙伴等。单登录认证有助于防止用户产生密码疲劳。

