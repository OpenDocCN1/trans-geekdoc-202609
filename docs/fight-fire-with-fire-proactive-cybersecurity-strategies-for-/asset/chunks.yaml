    # PART TWO Process


    Cybersecurity is no longer only the domain of your `IT` and security teams. From
    the loading dock to the C-suite, everyone must be security minded. The connection
    between your people and the security technology you invest in is encapsulated
    in processes.


    ## Processes Bridge How People Use Technology


    Sound processes build a bridge between your people and your technology. With the
    right processes in place, articulated in clear policies, people know up front
    what they should and not do. Sound processes and policies limit employee access
    to only the data they need to do their jobs, and the right processes can ensure
    that employees protect and properly use the data they need.


    To be mature, processes need to be clearly defined, agile, easy to follow, measurable,
    and repeatable. Written policies should be clear and succinct to ensure everyone
    understands what they should do. Defining processes and putting them in place
    is not a one-time effort. Maintaining cybersecurity is a continuous, evolving
    process. On a regular basis, you need to review your policies and processes to
    determine if they are effective or if they need to be modified.


    This section covers process areas of urgent concern for CISOs, including cyber
    risk management, blending `NOC` and `SOC`, secure development, compliance, and
    supply chain risk.


    ## Cyber Risk Management


    Cyber risk management entails assessing all of your risks from a cybersecurity
    perspective and deciding how to measure, manage, and communicate those risks.
    Risk management is familiar territory for business leaders, but cyber risk management
    requires additional expertise and understanding. Security leaders recognize that
    cyber risk cannot be reduced to zero; some security incidents are inevitable.


    Cyber risks must be evaluated within the larger context of business strategy and
    goals. Every organization has to define its risk appetite, deciding how much risk
    is acceptable.


    Cyber risk management is an area where CISOs have an opportunity to show their
    business leadership. Participating in relevant committees and working groups in
    areas such as data privacy and risk is one important way to ensure that cyber
    risks are brought to light and communicated clearly. Metrics should be developed
    that offer rapid insight into whether cyber risk is within the stated risk tolerance.


    Overall, you want to build a technology portfolio that mitigates cyber risk as
    much as possible given budget constraints. Since you cannot eliminate all risk,
    you have to be transparent about potential risk. The security team should make
    sure other teams acknowledge and accept the potential vulnerabilities associated
    with new software and technology that they adopt.


    [Chapter 6](#c06.xhtml) describes your strategic role in cyber risk management.


    ## Blending NOC And SOC


    Traditionally, the Network Operations Center and the Security Operations Center
    operated as silos, with the `NOC` handling hardware failures and network errors
    and the `SOC` defending against hackers. That approach doesn''t work in today''s
    environment.


    Because of the way today''s attacks are happening, you don''t necessarily know
    whether a problem has been caused by a hard drive going bad or an attack by an
    adversary. When an incident happens, your only saving grace is how quickly you
    respond. The goal is to improve your threat intelligence by getting your cyber
    response to network speeds. By blending `NOC` and `SOC` operations, we can better
    achieve that goal.


    While the exact methodology for blending `NOC` and `SOC` varies by organization,
    in all cases, people in charge of those areas need clear processes and checklists
    in place, as well as an opportunity to exercise those processes together.


    [Chapter 7](#c07.xhtml) covers practical issues related to blending `NOC` and
    `SOC` operations.


    ## Secure Application Development


    Security should not be an afterthought, especially when it comes to writing code.
    Yet many organizations struggle to incorporate security as a metric for code quality.


    Secure application development means being proactive and training your developers
    in secure coding practices and empowering them to become security champions. To
    achieve this goal, you need processes in place that ensure regular training sessions
    for development teams. In addition, secure development and security awareness
    training should be part of onboarding, required before newly hired developers
    put their hands on keyboards.


    Organizations need resources and processes in place so that developers and architects
    have access to security engineers as questions arise and when designing new features.


    Secure development entails knowing what libraries are in use and ensuring they
    are patched and up to date. Secure development means being vigilant about vulnerabilities
    in the technology stack and ensuring that patches and updates are applied in a
    timely manner.

