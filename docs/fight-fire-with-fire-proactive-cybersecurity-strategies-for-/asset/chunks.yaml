    家庭环境也必须作为办公室的延伸进行更新。对于处理敏感话题的人员来说，出于安全考虑，智能音箱已被移出家庭办公室。家庭路由器现在由终端用户计算小组进行管理，而在办公环境中，这些小组本仅负责公司拥有的技术。这需要向所有一线团队广泛传播有关信息安全实践的知识。


    ## 安全产品应如何适应


    与此同时，你的员工正渴望获得更多的技术和应用程序，以便他们在自己的岗位上表现得更高效。但许多供应商并没有将安全性嵌入到他们的产品中——将安全问题留给客户自行解决。例如，你如何将
    `Box` 或 `Microsoft 365` 集成到软件定义广域网（SD-WAN）中？在很多情况下，对速度和便利的追求被置于安全性之上。


    为了使用旧工具保护其环境，首席信息安全官（CISO）必须对他们想到的每一层应用控制措施：物理层、数据链路层、传输层、会话层和网络层。这种方法耗费大量时间，缺乏灵活性，不利于人员在云环境中自由移动，不利于人员使用临时虚拟环境，并且抑制了创新。如果你忽略或跳过哪怕一层或一个步骤，攻击者都能找到渗透并获取他们想要的数据的方法。


    一个明确的解决方案是最小权限原则，该原则不仅适用于人类，也适用于服务账户和 API。谨慎分配特权账户，仅赋予用户、服务账户和 API 访问完成工作或执行所需服务所需的权限。


    同样，当你允许用户进入你的网络边界内部时，仅允许这些用户访问你的 `VLAN`，不再多开放。


    此外，当前的网络架构并没有很好地为我们服务：


    *   与其让人们通过路由往返互联网流量的私有网络进行连接，更好的架构是在全球范围内分布接入点（Points of Presence）。通过这种架构，无论人们在何处，都可以连接到这些接入点，识别自己的身份，然后通过尽可能靠近这些接入点的技术接收他们所需的安全服务。整个网络架构必须变为分布式形式。


    *   与其使用基于边界的系统（数据在城堡内部易于可见且不受受保护），当今的安全模型对这些数据进行加密，并将其保护在独立的、通常是基于应用程序的仓库中。与其想象城堡和护城河，不如想象城堡内部锁闭房间里有副武装的骑士。


    *   与其连接到某个网络或区域，员工为了特定目的连接到特定的应用程序——即网络或区域的一个分段。必要的网络在连接时被创建。该网络理解每个人是谁、他们想做什么、他们拥有什么访问权限和许可，然后创建一条通往那里的路径。


    事实上，你可能在每个会话中都会创建多条路径。例如，如果用户连接到一个同样带有安全服务的接入点，如果用户正在访问其个人 `Gmail` 账户，可能会有一个通过公共互联网的连接，而该连接与安全性的关联可能很小。另一个连接可能是到任务关键型应用程序，因此将路由到一个具有更高
    `SLA`（服务水平协议）、更强加密以及各种相关安全服务（如数据泄露防护和用户行为分析）的网络上。另一个连接可能是到第三方 `SaaS` 应用程序，在该应用程序中对
    `CASB`（云访问安全网关）的使用会受到监控。`SD-WAN`。


