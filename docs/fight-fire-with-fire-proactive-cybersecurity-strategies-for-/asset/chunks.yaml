- raw: 'Today''s careers require us to reinvent ourselves multiple times. You can
    start a career in cybersecurity at any stage in your professional life. Think
    outside the box; you don''t need a four-year degree in computer science to work
    in cyber. No matter what your background is—English, history, or other liberal
    arts—there is a security career for you. The only question is where to start.
    Potential jobs include security analyst and penetration tester, as well as roles
    in risk and compliance, privacy, sales, marketing, product development, and quality
    assurance.


    If you don''t know what specific area you''re interested in, start looking from
    a broader perspective. As discussed earlier, consider adjacency and lateral moves.
    In whatever role or field you''re already in, start working on its cybersecurity
    aspects. Then, look into acquiring additional skills and moving deeper into the
    areas of cybersecurity that interest you most.


    Certifications are often a path to a security career. More than 80% of those responding
    to the Fortinet survey on the skills shortage


    Some courses are inexpensive, and others are even free. For example, Udacity.com
    offers a free course in network security


    ## To Move Up, Think Outside the Box


    Employers are looking for CISO candidates with soft skills in leadership, communications,
    planning, risk management, and operational skills. They are looking for hard skills
    in compliance, incident and response management, data protection, and how to quickly
    minimize the impact of a breach and quickly remediate the issue. As stated earlier,
    women have an inherent advantage in leadership and analytical skills but a reluctance
    to apply when they fear they''re not fully qualified. When you apply for a job,
    know what you''re bringing to the table.


    Opportunities definitely exist for women and other diverse candidates willing
    to step out and ask, even if you aren''t yet fully qualified. To diversify their
    teams, companies experiencing security challenges may be willing to take a chance
    on a candidate who doesn''t have all the required skills. In the meantime, traditional
    candidates may not want to take a chance on companies experiencing problems, opening
    another door for members of underrepresented groups. Industries that are growing
    also are more likely to give underrepresented candidates a chance. It is important
    to remember that even if you aren''t fully qualified on paper, you should be willing
    to pursue it.


    As noted earlier, education is one key to moving up. As you aspire to a CISO job,
    a master''s or bachelor''s degree in information technology, with a focus on cybersecurity,
    is one path to gain leadership and IT skills. If you aspire to the CISO role,
    another pathway is to earn an MBA so you can better communicate with business
    leaders and the board. You can find additional resources in the appendix.


    If you aspire to use a CISO job to move up even higher in your company or another
    company, evolution within the industry is opening those doors. As the CISO role
    gains visibility, more CISOs are now reporting directly to the corporate general
    counsel, to the board, or directly to the CEO. As CISOs attain wider recognition
    and the role becomes increasingly important, high performers are positioned to
    move even higher. Key skill sets for those roles will be financial and operational
    metrics.


    ## Conclusion


    We can make progress in filling the skills gap as we address the diversity gap.
    Women and members of other underrepresented diverse groups make up significant
    untapped potential to meet needs in cybersecurity. We need to be open to what
    they bring to the table and be willing to pay for and foster education to add
    new skills. To attract skilled talent across all groups, we need to build cultures
    of retention and inclusiveness with a team focus on success where people feel
    supported and have the resources to do their jobs. Closing the diversity gap also
    will bring about a fundamental shift in addressing our approach to security across
    organizations of all sizes, public and private.


    While the actions recommended in this chapter move us in the right direction,
    it must be said that they do not address a fundamental issue in the educational
    system in the United States, which is the lack of female engineering students.
    To encourage more women to go into this field, we have to rethink our educational
    system much further back in the pipeline. The cybersecurity skills and diversity
    gaps are best served in a world where young girls are educated in a way that opens
    the door to engineering programs. This is not true today, and without deliberate
    effort, we have little hope of closing the gender gap long-term.


    We must all work toward building an inclusive culture that encourages both girls
    and boys to participate in coding and robotics camps and competitions. Corporate
    partnerships, sponsorships, employee volunteer programs, and mentoring programs
    are among the ways that we can encourage long-term change that will address critical
    gaps in both skills and diversity.


