    # 处理指标时


    在查看你的指标时，尽量避开那些安全运营类或“震慑型”指标。你懂那种类型：比如声称公司每天拦截了数百封邮件、在外部边界上阻止了 500 多次入侵尝试，或者 90%
    的系统都安装了最新的反恶意软件保护。


    同样，在这些陈述的结尾问一句：“那又怎样？”这多吗？还是少呢？我们应该拦截更多还是更少？上个月或上个季度的情况如何？指标趋势如何？我们为什么要关心？我们做得够够吗？其他公司在这一领域看到了或在做什么？在制定指标时，请思考这些问题，并考虑指标的可持续性。你是否能够在不花费数周时间收集信息的情况下，定期提供这些指标？


    尽管许多机构的机会在增加，但我们仍然需要对公司和自己施加压力。许多公司将 `CISO` 角色视为一种“IT 事务”或功能。我乐观认为，随着时间的推移，我们将看到金融服务行业以外的更多公司，`CISO`
    角色的地位得到提升，类似于其他高管职位，如首席营销官、首席数字官、首席风险官和首席隐私官。随着网络安全被视为企业正常运行要素，这种情况将会发生。无论幸运还是不幸（取决于你的观点），当前的威胁形势正在增加人们对
    `CISO` 办公室的尊重。


