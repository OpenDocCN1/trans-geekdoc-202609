  trans: '


    例如，在卡罗莱纳州，该州已建立相关计划，支持地方政府和学校应对网络安全事件。这只是众多现有支持机制中的之一。该州的“大局”是对居民数据进行进行全面保护。这些数据不仅存储在州机构的系统中，还存储于当地县、市和学校中。此外，支持该州的大部分关键基础设施位于地方政府层面。这些系统提供如
    `911`、水务、电力等关键服务，但通常只获得有限的资源和资金支持。通过建立全州范围内的方法，卡罗莱纳州能够采取团队合作模式，并建立信任和互助的关系与伙伴关系。


    你如何如何在你的组织中应用这一概念？第一步是了解你所拥有的状况和资源。卡罗莱纳州 IT 部门通过首先进行优势、劣势、机会和威胁（`SWOT`）分析实现了这一点。他们识别了关键利益相关者，例如地方政府的信息技术和网络安全专业人员，他们可以召集起来，支持州政府结构内的任何受影响的方。随着时间的推移，建立了一个坚实的信任基础，这进一步促进了信息共享。`IOCs`、最佳实践和其他相关信息可以迅速在全州范围内传播，以确保所有潜在目标得到保护。任何人都可以通过建立人脉和关系，在需要时寻求帮助，来利用这种方法，从而加强整个生态系统。


    信息共享是缓解当今威胁的重要策略；有关此主题的更多信息，请参阅第 4 章。


    ## 通过网络保险降低风险


    网络保险作为一种风险降低策略是否有合理性？如果仍然缺乏购买和实施解决方案以支持所需的安全控制的资源，那么购买网络保险可能没有太大意义。但网络保险确实有其发挥的作用。


    正如本章其他部分所阐明的那样，我们不建议你仅依赖网络保险。这样做是轻率的，也是一种糟糕的风险管理方法。事实上，拥有网络保险并不会转移风险的任何所有权和责任，风险仍然完全由购买保险的组织承担。相反，应该将网络保险视为组织风险工具箱中的另一个工具。网络保险为客户和公司提供了一种减少网络泄露成本影响的方法，通过支付与泄露相关的第一方成本（例如取证、受害者通知和信用卡监控）。


    购买网络保险的另一个潜在理由是获得外部确认，证明组织已利用标准方法来实现安全计划。许多声誉良好的网络保险销售商要求客户在出售保单之前至少要符合网络安全最佳实践。这些最佳实践与
    `NIST 网络安全框架` 等行业框架对齐。


    如果你有一家小型企业，网络保险可能非常值得。据统计，超过 60%的受网络安全事件影响的小型企业未能恢复。


    ## 结语


    如今的 `CISO` 角色需要一个强大的战略思考者，他们不仅可以成为业务的协作伙伴，还可以成为其他风险组织的战略伙伴。在整个组织以及与关键外部联盟建立稳固的关系，可以使整个企业拥有更强的风险态势。嵌入到风险监督和治理过程中，配备丰富的
    `KRIs` 信息，并从广阔的角度对所有潜在影响的风险进行全面的理解，使得 `CISO` 能够确保组织目标成功的领导。


    ## 注释


    1. 1。 [`www.cisa.gov/critical-infrastructure-sectors`](https://www.cisa.gov/critical-infrastructure-sectors)

    2. 2。 [`us-cert.cisa.gov/resources/sltt`](https://us-cert.cisa.gov/resources/sltt)

    3. 3。 [`www.infragard.org/`](https://www.infragard.org/)

    4. 4。 [`www.nist.gov/cyberframework`](https://www.nist.gov/cyberframework)

    5. 5。 [`www.vox.com/sponsored/11196054/why-every-small-business-should-care-about-cyber-attacks-in-5-charts`](https://www.vox.com/sponsored/11196054/why-every-small-business-should-care-about-cyber-attacks-in-5-charts)


    # 7 融合 NOC 和 SOC


    ***MEL T. MIGRIÑO***


    当你的安全团队面临破坏性事件时，时间是至关重要的。在识别、响应和缓解问题方面的任何延迟都会增加风险并导致更多的中断。在网络运营中心（`NOC`）和安全运营中心（`SOC`）完全分离且对彼此世界的可见性有限的实体中，这些昂贵的延迟更有可能发生。当团队保持孤立状态时，效率低下和错误会减慢有效的事件响应，并阻碍整体网络和安全运营。


    随着网络威胁的数量和严重程度持续增加，孤立的 `NOC` 和 `SOC` 团队是你的组织负担不起的奢侈。但正如我们将看到的，解决方案并不一定是两个团队的快速、完全融合或合并。未能考虑融合的所有细节或急于完成过程可能会产生额外问题，而不一定能解决当前的问题。需要一个更细致的答案。


    ## 愿景


    正如消防员和急救医疗技术员共同应对火灾，并协作灭火和治疗受害者一样，集成的 `SOC` 和 `NOC` 响应团队可以共同工作排除事件故障，并保持网络既安全又可靠。融合
    `NOC` 和 `SOC` 的主要优势包括：


    - 更快地解决事件：与其在事件发生后独立工作，并有时对根源得出冲突的结论，不如融合后的团队可以快速识别问题、追踪原因，并彻底缓解和解决问题。

    - 减少系统停机时间：通过团队有效且快速地协同工作，安全事件不太可能演变为长时间的网络中断。

    - 减少事件影响：通过使用预先定义并练习的剧本（playbook）进行整体且协作的事件处理，融合的 `NOC` 和 `SOC` 能更快地终止事件，从而减轻其破坏性。

    - 改进流程：团队的共同办公或融合使得启动集成事件调查变得。

    - 增加信息共享：相互认识的团队成员更有可能以正式和非正式的方式共享信息。这种信息共享可以带来日常运营和长期业务成功。

    - 与其他相关团队的更好协调：融合团队（特别是当有一个单一联系人时）可以更容易根据需要与额外的小组进行协调。


