- raw: 'Having a strong insider threat program requires walking a careful line with
    staff, unions, human resources, and legal counsel. You are dealing with people
    who others think they know and who have been trusted with the level of access
    needed to do their jobs.


    Sometimes it is hard to decipher good and bad behavior, thus requiring sophisticated
    behavioral analytics. Security teams often lack the business context to understand
    what is expected, making those analytics hard. And of course it is sometimes harder
    to detect an insider from IT or security—they know what is being looked for and
    how to circumvent it. That is why regular review of privileged user behavior is
    so critical. Lack of tools, staff, policies, and processes make it very challenging
    to effectively manage the insider threat.


    Simple best practices can certainly help prevent trouble. Limit access; only provide
    access to systems and data that people need to do their jobs, also known as “least
    privilege.” And by their job, that means their current job, not the one they had
    five years ago. Regularly review access entitlements. Create a separation of duties
    to provide checks and balances, and require dual authorization for sensitive activities,
    whether sending large wire transfers or maintaining crypto keys.


    What should your insider threat program be looking for? Security teams should
    look for the following behaviors, whether purposely malicious or simply egregious
    policy violations that expose the company to risk:


    *   Unauthorized use of IT resources and applications


    *   Employees using unauthorized cloud accounts for storage of corporate information


    *   Rogue use of shadow IT


    *   Accessing, sharing, or distributing personally identifiable information


    *   Installing unapproved and unlicensed software


    *   Unauthorized use of restricted applications, including network sniffing and
    remote desktop tools


    *   Unauthorized transfer of data or using removable media to store or move data


    *   Unauthorized copying of business-critical data to a cloud or web service


    *   Transferring files to and from unusual destinations


    *   Moving files using instant messenger or social media applications


    *   Misuse, abuse, and malicious behavior


    *   Misusing file system administrator rights


    *   Disabling or overriding endpoint security products


    *   Using password cracking tools such as John the Ripper and Hashcat


    *   Accessing the dark web or nonwork-related sites


    What can you do to minimize unintentional insider threats and help make all employees
    part of the solution? Create a robust and continuous security awareness training
    program that includes education and training, not just for new employees or once
    a year, but on an ongoing basis. Everyone has to be part of the team.


    Phishing testing is a valuable part of such a program and should present increasing
    difficulty and change with the time of year and roles of employees. For example,
    in February test employees with Secret Admirer emails or send messages about a
    new benefit package that seem to come from HR. Customize phishing test messages
    to the business context of particular departments. For example, you might send
    general counsel employees information about free continuing legal education courses
    or send the accounting department fake business email compromise lures based on
    the latest real-world attack messages.


    Employees should know to report something that looks out of the norm and know
    whom they should report it to. One employee may be on the ball and spot a phish;
    another may be moving fast, or on a mobile device, and miss it. Reporting should
    always be encouraged, and possibly reinforced with a badge or thank-you email.
    In working with developers, explain why security is so important, even if it causes
    friction. Gain buy-in and build knowledge for shared responsibility through a
    security champion program with your development teams. Security built in from
    the start is always preferable to, and cheaper than, after the fact.


    Again, creating these messages requires circumspection. HR, Legal, and Corporate
    Communications have roles to play in defining how insider threats are handled.
    Security teams must make sure they don’t create a culture where employees feel
    mistrust because in most cases employees have good intentions.


    Ask business owners to provide you with context so you can tell a relevant, compelling
    story without security jargon. What would happen to your customers and your business
    if confidentiality, integrity, or availability were impacted by a cyberattack?
    People can become numb to news reports of cyber incidents; it is important to
    make the risk real for them. People want to feel part of the team and appreciated.
    They want to be seen as valued contributors and often feel connected to customers
    and to the corporate mission.


    Is it true that people can be your first line of defense, or should they be your
    last line of defense? Should we expect technology to stop everything? While the
    latest security tools and platforms move us closer to end-to-end security, as
    discussed in [Chapter 14](#c14.xhtml), employees should also feel that they are
    an important part of the security team. Adversaries are smart and constantly evolving,
    and we need everyone on the alert.


    We need to train our employees to be suspicious if something feels odd or seems
    not quite right, reinforcing the adage, “If you see something, say something.”
    It might be an email from the CEO’s personal account asking for a financial transfer,
    a call from IT asking for password information, a strange pop-up asking for credentials,
    or a stranger wandering around the office. Encourage people to ask questions rather
    than being afraid to slow down a process or appear unhelpful or paranoid.


    Employees regularly catch phishing emails not caught by sophisticated systems.
    Employees notice strange system behavior or inquiries received that just seem
    outside the norm. They know their jobs, processes, and applications better than
    a centralized cybersecurity team and should be brought into the conversation about
    the threat landscape and what bad actors might exploit in their unique work environment.


    Employees can also help you understand the crown jewels that an adversary might
    be interested in. A friend at the CIA used to say, “If you’re interested in China,
    China is interested in you.” How will the security team know about a plan to enter
    into a joint venture or bid on a new contract related to China if there isn’t
    a partnership with the business? Consider creating a business information security
    officer program to strengthen that link and to help ensure security is built into
    new systems and processes and that there is a link with security to help the business
    understand emerging threats and evolving risks.


    ## Conclusion


    By the time this book is published, the cyber threat landscape will no doubt have
    changed and evolved. There will be new variants of malware, new schemes and scams,
    and new catchy names for actor groups. Geopolitics will cause nation-states to
    target one another as interests shift.


    But what has stayed the same? The bad guys will continue to use our new tools
    and technologies to steal what they need and drive their objectives. The rewards
    of cyberattacks will cause our adversaries to innovate and improve their TTPs
    as we advance our defenses. At the same time, most intrusions will result from
    our employees falling for a phish and a failure to prioritize patching.


    We simply are not forcing people to bring their A game. If a nation-state like
    Russia truly wants to access your specific corporate network, you likely cannot
    stop them with even the best and most expensive commercial cybersecurity program.
    But you can make yourself a more challenging target for other attackers, not falling
    prey to the latest attacker “blast” campaign.'
