- raw: "## Mitigating Today’s Threats\n\nToday’s threats have greatly evolved, and\
    \ the nature of the adversary has evolved as well. Lone hackers, hackers for hire,\
    \ and small collectives still exist, their numbers growing as online materials\
    \ enable almost anyone to become a hacker. Exploits are bought and sold as a commodity\
    \ on the dark web and are readily available to any of these adversaries. Today,\
    \ however, these attackers are joined by well-funded adversaries from organized\
    \ crime rings around the world as well as government-supported hacking groups\
    \ from particular nation-states.\n\nYour security posture must be strong enough\
    \ to prevent a wide variety of outsiders from gaining access to your private and\
    \ proprietary data, your processes, and your machines.\n\nUnfortunately not all\
    \ of your malicious adversaries are outside your enterprise. Sadly, some threat\
    \ actors have inside access to your systems, including disgruntled or unethical\
    \ current and former employees misusing access and data for personal gain or simply\
    \ to cause trouble. Other potential insider threats include suppliers, partners,\
    \ board members, and anyone else who has access to your systems and data.\n\n\
    There are other internal threats. We call them accidental insiders. You might\
    \ call them humans. Accidental insiders expose the organization unintentionally\
    \ because they are untrained, overworked, or unmotivated. These folks become threats\
    \ when they respond to phishing attempts, use weak or default passwords, share\
    \ passwords, leave devices unpatched or unlocked, and work over unsecured Wi-Fi\
    \ networks.\n\nYour organization is up against well-funded adversaries as well\
    \ as people who might just press the wrong key. You’ll learn about the many players\
    \ behind today’s evolving threats in [Chapter 4](#c04.xhtml).\n\n## Addressing\
    \ the Skills and Diversity Gaps\n\nThe gap between the number of cybersecurity\
    \ workers we have and the number we need is widening. As of 2021, more than 3\
    \ million cybersecurity workers are needed globally, according to the (ISC)² Cybersecurity\
    \ Workforce Study.\n\nAddressing this gap requires a multi-pronged approach. Security\
    \ knowledge needs to be more widely disseminated across the organization. Security\
    \ and IT should be integrated, with cross-training between IT and security personnel.\
    \ IT should also not be the only recruitment area for the security team: look\
    \ across business units to identify potential candidates who bring experience\
    \ of all types, from risk to finance to customer care to build out the security\
    \ workforce.\n\nTo close the skills gap, we need to create a culture where people\
    \ want to engage in the security business. To make the field more attractive,\
    \ from frontline security workers to leaders, we need to increase the visibility\
    \ of and influence of the CISO. They need to be considered an integral part of\
    \ the C-suite and central to business success, not a cyber janitor to clean up\
    \ problems or take the fall when a breach happens.\n\nAlthough technical skills\
    \ remain important, soft skills such as leadership, communications, planning,\
    \ risk management, and strategy are just as vital. Such skills are especially\
    \ critical for those in the CISO role who are leading security teams and communicating\
    \ with the board.\n\nWe also need to make the field more diverse by recruiting\
    \ more women as well as people of all backgrounds including race, ethnicity, orientation,\
    \ and disability status. Further, we need to expand hiring efforts to recruit\
    \ veterans, whose backgrounds position them as valued and committed employees.\n\
    \nWomen are finally making some inroads in cybersecurity. In 2013, women held\
    \ 11% of cybersecurity jobs; now women make up 24% of the cybersecurity workforce.\
    \ While this improvement is positive news, more progress needs to be made, particularly\
    \ since women make up half of the entire workforce.\n\nClosing the diversity gap\
    \ is not just a feel-good measure. Closing the diversity gap drives business success\
    \ and change. To lower cyber risk, we need to lower the level of group think.\
    \ Teams with diverse backgrounds and experiences can uncover new, creative solutions\
    \ to problems. Women bring unique traits to leadership, problem-solving, and security.\
    \ For example, female CISOs scored higher than their male counterparts in critical\
    \ soft skills, including 46% higher in leadership and 150% higher in analytical\
    \ skills.\n\nFinally, we need to generate excitement within the security field\
    \ by creating programs that effectively promote the security field including mentoring,\
    \ internships, and engagement with schools from college down to K–12.\n\nCISOs\
    \ can’t lead without a knowledgeable staff. [Chapter 5](#c05.xhtml) outlines the\
    \ extent of the skills and diversity gaps. It gives you strategies for attracting\
    \ the resources you need, including ways to upskill people in your organization\
    \ who, after all, already know your business.\n\nSince this is the people section\
    \ of this book, let’s start with you, and equip you with context about what it\
    \ means to be a CISO in the face of today’s threats.\n\n## Notes\n\n1.  [1](#p01.xhtml#R_p01-note-0001). \
    \ [https://www.isc2.org/Research/Workforce-Study](https://www.isc2.org/Research/Workforce-Study)\n\
    \n2.  [2](#p01.xhtml#R_p01-note-0002).  [https://www.fortinet.com/resources-campaign/ciso/the-ciso-ascends-from-technologist-to-strategic-business-enabler-2](https://www.fortinet.com/resources-campaign/ciso/the-ciso-ascends-from-technologist-to-strategic-business-enabler-2)\n\
    \n3.  [3](#p01.xhtml#R_p01-note-0003).  [https://www.fortinet.com/resources-campaign/ciso/the-ciso-ascends-from-technologist-to-strategic-business-enabler-2](https://www.fortinet.com/resources-campaign/ciso/the-ciso-ascends-from-technologist-to-strategic-business-enabler-2)\n\
    \n# 1  \n\nFrom Technologist to Strategist\n\n***SANJU MISRA***\n\nI am glad that\
    \ this book is broken into three sections: people, process, and technology. There\
    \ is so much we need to do in each area to have a successful information security\
    \ program. I hope to engage you to reflect on your career in information security.\n\
    \nIn this chapter, I will share my experience and observations on making the leap\
    \ from technologist to CISO. This evolution wasn't easy at times, and I often\
    \ met with challenges, but it has also been very rewarding.\n\nThe CISO is a trusted\
    \ strategist who has a seat at the table, both internally, speaking to business\
    \ leaders about risk and what keeps them up at night, as well as externally, speaking\
    \ to the board of directors.\n\nIn these contexts, it's not important that you\
    \ display your technical acumen. It is assumed you have weighed the technical\
    \ considerations as part of your viewpoint. Rather, your ability to transcend\
    \ technical explanations and frame issues in terms of business risk is what allows\
    \ you to be heard, to be understood, and to be successful in protecting the enterprise\
    \ at a level appropriate for the risk tolerance of the company.\n\n## A Path to\
    \ CISO\n\nIf you asked a hundred information security and risk leaders how they\
    \ got involved in the field, I'm sure you'd hear some interesting stories.\n\n\
    I never thought about an information security career early on. I was a biology\
    \ major with an interest in what computers could do for the field, but not in\
    \ programming. I helped fellow students with their essays and term papers by typing\
    \ up their final presentations … yup, on a trusty Smith-Corona.\n\nA friend suggested\
    \ I use the computer lab and try WordPerfect as a word processor to complete the\
    \ final . Boy, it sure was easier to make updates and changes to documents compared\
    \ to the typewriter.\n\nWhen there was an opening to work part-time in the computer\
    \ lab, I took it. The job made me learn more about how computers work by troubleshooting\
    \ student questions about printing, using spreadsheets, and saving documents."
