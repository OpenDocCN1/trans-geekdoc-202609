- raw: 'Look out for organizations that want a CISO mainly for window-dressing. These
    companies want a CISO to assure the board and their customers that all is well
    with their data and compliance. In fact, they aren''t willing to make necessary
    changes. These companies can''t keep a CISO around, so you''ll see many job openings
    at these organizations. Their CISOs leave out of sheer frustration. They often
    feel they are just checking the box on compliance requirements, and their ideas
    for a strong cybersecurity program are always stalled because the budget or resources
    are never available. In such roles, you will never be running a sound cybersecurity
    program.


    Rock-star CISOs are a tough act to follow because the organization really wanted
    to keep their existing CISO. Expect comparisons with the previous CISO. This can
    be very frustrating, because every CISO has a unique brand and identity—yet their
    identity may never be recognized because of constant comparison with the prior
    CISO.


    If you decide to take such a role, keep the prior CISO''s programs in place. Over
    time, you can slowly modify and change the cybersecurity program by bringing your
    own personality and security philosophy to the enterprise.


    ## Evolution of the CISO Role


    As mentioned, the majority of CISOs report to the CIO. Forming a strong, collaborative
    relationship with the CIO whether you''re a subordinate of the CIO or outside
    IT in the risk, legal, or audit group is key. I''ll be bold and say you won''t
    be successful if you can''t influence the IT function. Without sincere respect
    and alignment between the CIO and the CISO, organizations may devolve into a tech
    turf war that creates roadblocks to success.


    With the increasing demand to embed security into all digital transformation processes
    and a move to more decentralized structures and business unit autonomy, the information
    security function is evolving to meet shifts in the business climate.


    Instead of just protecting the enterprise, the CISO role has evolved to enable
    fundamental changes in the business environment. This means the focus has shifted
    to the security officer being a business enabler. The CISO''s department is no
    longer the “Department of No” but rather the “Department of Know.”


    The COVID-19 pandemic forced CISOs to meet pressing business needs and to reimagine
    ways to enable the business to go on. Many employees started to work from home,
    and that meant the security risk model needed to adapt.


    It was especially challenging. How could existing tools securely handle the increased
    bandwidth, personally owned devices, and the sharing of home and corporate networks?
    More importantly, security folks needed to understand what teams and business
    employees were doing in 2020 to get their jobs at work (and home) done.


    If we don''t provide a simple secure method for the business to complete a task,
    people will go around the controls each and every time, and that introduces more
    risk. We as a security community need to continue building solutions and tactics
    that enable employees to work securely. Being a business enabler is the way to
    do that.


    Consider the case where a company restricts access to file-sharing websites. Despite
    these restrictions, many employees need to upload documents to these sites for
    regulators, customers, vendor partners, or corporate functions. So if you are
    a representative of the Department of No and don''t explain why you have the policy,
    the employee will upload those company documents while off the company VPN, on
    their home network, or via their home computer. It would be better to provide
    employees with the ability to do their job and not have to circumvent the controls
    you put in place.


    It''s important to realize that what made you a technical lead or subject matter
    expert won''t get you a seat at the table with business leaders and the board
    of directors. CISOs are not the most technical resource in the room.


    Instead, you need to be seen more as the CFO of cybersecurity. Like a CFO, you''ll
    need soft skills and the ability to influence and communicate effectively. Stop
    speaking in technical jargon. Speak the language of the business leader. Board
    members and the office of the chairperson are used to hearing risk and financial
    impact presentations, and you have to frame cybersecurity risk in the same way.


    Watch out for security operations terms or metrics. Each metric should be followed
    by “so what?” If you can''t answer that question in a nontechnical way, remove
    the metric or adapt it. Think about old-school business risk calculations. What
    is the chance of the event multiplied by the impact of that event? Risk definitions
    don''t change, even for the cybersecurity world.


    ## Technical Strengths Versus Security Officer Strengths


    Many of us came to our careers as subject matter experts in a particular technical
    field. If you are like us, you were the “go-to” person for that area of expertise.
    You built trust with others, and they reached out to you for solutions to tough
    technical problems. You may be used to addressing multiple audiences.


    If you have those technical strengths, start positioning yourself today for the
    CISO role. Take on the task or challenge no one wants … you know the one. It''s
    the one that''s considered too big, too hard, or where multiple people failed
    in the past. Increase your visibility to business leaders. Make sure their perception
    of you is extremely positive because perception becomes reality. Demonstrate your
    influence in getting work done. This is key in the CISO role as you typically
    don''t have direct responsibilities in the various areas you need to change in
    order to be successful. You''ll need those influencing skills.


    It''s important to build up relationships across the organization including with
    the legal, human resources, privacy, digital, and risk departments. All of these
    areas have inputs into the risk posture for the company, and you''ll be working
    with them more as you become the CISO.


    When you have the opportunity to present to senior business leaders or the board
    of directors, remember that you are the cybersecurity subject matter expert. Use
    your limited time to educate them and provide a risk view that is in alignment
    with other business risks. Be prepared to defend your position. Use nontechnical
    terms. Talk about risk. This requires you to know about the business drivers,
    the risk appetite, and the top risks the company tracks. Many board members also
    serve on other company boards so they may be versed in the subject. If they see
    another company approaching risk in a certain way, be prepared for questions about
    whether you''re doing enough or why you took another approach.


    Cybersecurity risk is similar to purchasing insurance. You invest in helping the
    business hedge against the devastating effects of cybercrimes. While external
    cybersecurity insurance may be purchased, there is an assumption that the CISO
    has the risks identified and controls put into place. If there is an incident,
    detect and respond quickly. Be resilient in terms of business impact.


    Be ready to answer the following questions prior to speaking to the board. What
    is the organization''s cyber risk level? What are the organization''s top risks?
    How is the organization''s risk posture trending? Are the risks going up or down?
    Is the organization''s level of cybersecurity spending appropriate for the company?
    Be prepared to request support and funding where needed. Use a pragmatic and straightforward
    approach for funding requests, as opposed to crying wolf or assuming you won''t
    get funding.


    Senior leaders are accustomed to applying metrics and watching trends. What are
    meaningful metrics for cybersecurity risk? Think about how to explain intrusion
    attempts. How would you explain metrics like the mean time to detect attacks?
    How will you explain the risks in supply chain and vendor management? Lastly,
    how will you quantify how your organization measures up compared with its peers?'
