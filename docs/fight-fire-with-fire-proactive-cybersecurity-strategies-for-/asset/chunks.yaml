  trans: '


    这种全面的外包，以及跨越公共云（`Amazon AWS`、`Microsoft Azure`、`Google GCP`）、私有云（`VMware`、`IBM`、`Red
    Hat`）、混合云（物理数据中心）和云协作应用的趋势，被远程办公的进一步加速。结果是网络攻击面的扩散，放大了组织的风险、复杂性以及随之而来的漏洞。


    ## 复杂性遭遇脆弱性


    这种去中心化的控制范围，结合对 IT 捷性的日益增长的需求，导致了云驱动型组织面临网络安全的“两难困境”：更高的灵活性伴随着更多的网络安全盲点。此外，现代云应用和基础设施的新颖性也促使了具有政治、财务和犯罪动机的攻击者，他们利用新的攻击向量和技术针对这一范式进行武器化攻击。


    用户追求效率、IT 服务的即时满足，以及对所有云能力的民主化访问，以增强业务生产力。与此同时，是 IT 部门而非云服务提供商，承担了监管和保护这些需求所释放的所有数据、配置、应用程序和工作负载的负担，同时还要努力在更大规模和更多化的网络攻击向量中确保组织安全。


    面对这些不受限制的选择（包括 `APIs`、`微服务`、`容器`、`无服务器基础设施`、`代码仓库`以及`云应用`），这些用户在识别和确定网络安全态势优先级时，往往缺乏足够的知识或细节关注。用户驱动的配置错误、糟糕的密码协议、松散的权限设置、低策略意识以及缺乏严格的组织监督都说明了这一点。考虑到人手不足、工作过载且技能低下的
    IT 人员正在使用手动的、易于出错且过旧的方法，这些方法并不适用于监控和修复此类行为。


    这些动态在迄今一些最大的云数据泄露事件中显而易见——`Capital One`、`Facebook`、`GoDaddy`、`Verizon`、`Docker
    Hub`、`WWE`、`Adobe`、`Best Western` 以及特定的联邦机构。这些案例中数亿记录和 PB 级的数据暴露直接是因为服务器和数据库部署错误以及访问防护疏散，这表明云安全及相关泄露事件的主要原因仍然是用户的疏忽和糟糕的网络治理。


    ## 更多（供应商与连接性）但并非越多越好


    另一个阻碍云网络安全“极乐世界”进展的方面，是与众多供应商合作时固有的陡峭的保护与防御学习曲线。例如，仅某一项云服务的典型培训和实施文档可能就有数百页长，需要特殊的配置以确保网络安全策略具有可重复性，并与现有的投资和环境保持协调。


    企业 IT 和运营技术网络中激增的设备和用户类型，这进一步加剧了这一局面。运行独特操作系统的易受连接设备和瞬态用户正同步增加地跨越不同的本地和云架构。这带来了许多未未知的“未知因素”，挑战着
    IT 部门去保护那些不断激增的瞬态资源、资产和身份。


    在这种背景下，对于寻求防止知识产权被这些新型、倍数增长的攻击向量外泄的组织来说，胜算显然是不乐观的。一个精疲力竭、培训不足且匮乏的网络安全劳动力必须再次应对对演进中的云安全和策略的认知不足，以及在所有这些领域可见性的下降。云端与传统
    IT 之间的代际专业差距进一步加剧了这些问题。


    ## 风险增加，预算不变


    尽管云端的采用带来了更复杂的威胁格局和增加的风险，但云安全支出仍然保持较低水平。作为参考，根据 `Gartner` 和上市公司的披露，2020 年商业网络安全工具和技术的支出超过
    600 亿美元，其中少于 10% 是以云为中心的。如果忽略交付方式（通过云安全或 `security SaaS`），当仅考虑专门用于保护云环境中数据和资产的解决方案（云安全）时，这一比例缩小到
    5% 以下。在公共云支出预计从现在的 2700 亿美元飙增到未来几年的 4000 亿美元的背景下，这种浅层次的安全投资显得尤为刺眼。


    这种差异可能归于由于市场尚处于婴儿阶段，对可用解决方案的成熟度和效能存在保留。此外，涉及将熟悉的本地技术重新调整用于云端并由翻新的传统网络安全类别提供资金的防御策略也可能发挥了作用。但这些修订后的技术和解决方案无法跟上云服务提供商产品快速创新的速度，无法应对这些领域惊人的数据生成和扩散。它们也不擅长阻止新型和新兴的漏洞及威胁。


    这些新挑战和更高的复杂性反过来促成了云工作负载保护平台 (`CWPP`)、云安全态势管理 (`CSPM`) 和云工作负载分段的产生。虽然这些系统是先进的，但我们预计它们将增强传统的、易理解的漏洞管理、微隔离、经典终端保护和系统管理功能。这种统一有望实现自动化且持续的环境可见性、跨组织多样化
    IT 足迹的漏洞和配置错误的迭代或运行时扫描，最重要的是，对现有防御技能组的稳步扩展。


    其他云安全挑战还包括：


    *   云资源的短生命周期，使得数据收集和事件调查变得困难。例如，当资源被终止或工作负载被弃用时，取证就会丢失。

    *   多云使用和云资源的可移植性，将组织的控制权分散到各个专业团队和供应商之间。

    *   手动流程对于弹性攻击面来说是无效且不兼容的。

    *   改造的静态技术由于依赖重启、扫描风暴和侵入式签名更新，给工作流和云系统增加了性能拖累。


    最终，彻底改革基础网络安全架构和设计带有固有的操作中断和技术效能风险，很少有组织敢于面对这些。文化层面（风险规避、变更管理障碍）和经验层面（在网络安全专业人员已紧张的人才市场中技能短缺）仍然是根源。同时，组织必须针对新现实制定自适应云网络安全计划，以确保在复杂、多化的
    IT 系统中“边做边学”产生的微小操作失误不会对整体网络安全态势造成灾难性影响。


    '
