    *   How does my program impact the company''s culture, reputation, and cost? Why
    should they care? How can they help?

    *   Are there pros and cons? Can I list them in a way that will resonate with
    the board?

    *   Is my message clear and succinct?


    ## Keep It Direct, Crisp, and Simple


    It''s not the Gettysburg Address, and it''s not a graduate-level course. One of
    my favorite quotes comes from Mark Twain: “I didn''t have time to write a short
    letter, so I wrote a long one instead.” Your time with the board is often very
    short. It is important to craft a clear and crisp message. I have seen many fifty-page
    briefings prepared for senior-level boards. Written papers have an executive summary
    for a reason; that is all most senior-level individuals will read! Your board
    brief should be that executive summary.


    State the purpose of your briefing immediately. Don''t leave them guessing. “Our
    reputation is at risk if we do not improve the security posture of our company.
    Our competitors have invested in state-of-the-art security. Our customers are
    vulnerable. We could be held liable if their data is breached. The average cost
    of a breach today is $$$. The cost of our remediation program is $$. These are
    our steps; this is our timeline.” Give them high-level, impactful, data-driven
    information that they can now use to make a risk decision.


    Don''t assume they know your subject, and don''t try to teach them details they
    do not need to know. You will lose them in the process, and they''ll lose your
    message. I will always remember one of the most challenging proposals I had to
    prepare.


    I was in a cybersecurity position in the Pentagon. We had an opportunity to obtain
    funding for a program we wanted to kick off. The `CIO` asked me to come to his
    office. I walked across the hall, and he sat across from me at his conference
    table. He explained that we had opportunity to obtain support from the Secretary
    of Defense. “You have one paragraph to explain the program, why he should care,
    and what it will cost and you cannot use one technical word,” he said. He told
    me to dictate, and he would capture it. If I explained anything in a technical
    manner—words like enterprise, interoperability, automation, advanced analytics—he
    would give me a verbal buzzer. It was quite a challenge, and it makes me laugh
    to this day. We were successful, but it was not an easy paragraph, and I received
    that verbal buzzer more often than I would have thought.


    I have found that analogies are incredibly useful. Recently, I was asked by board
    members why it is important for their company to mitigate all of their critical
    vulnerabilities. Why isn''t `80%` good enough? I used a very simple house-windows-and-doors
    analogy. If you put state-of-the-art locks and monitoring on all of your windows
    and doors except the back door, which you leave totally unprotected, you have
    not done much to protect your house. Add to that the bad guy who can scan your
    house before arriving to determine what protections you have on all of your windows
    and doors. You have just given that bad guy a road map to enter your house undetected.
    Immediately, the board members got it. I did not have to explain what a bad guy
    could do if they didn''t upgrade a specific `OS` or patch a specific vulnerability.
    It didn''t matter. All that mattered is the bad guy could get in, and `80%` mitigation
    is not good enough.


    ## Working Directly for the Board: The Ultimate Case Study


    After 9/11 I was asked to set up the first joint DoD/IC organization, the Unified
    Cross Domain Management Office (`UCDMO`). The `UCDMO` was established to solve
    the problem of cross-domain information sharing among all of `DoD`, including
    our troops overseas and the intelligence communities. There was no holistic strategy
    nor was there anyone in the lead. I used the analogy of kiddie soccer with everyone
    running toward the ball (yes, I used this analogy with the board). It resonated
    very well because I could provide example after example of duplication, lack of
    strategy, and agencies not playing their roles.


    The `UCDMO` was a “volunteer” organization that directly reported to the board
    and no one else. The board was co-chaired by the Director of National Intelligence
    `CIO` and the Department of Defense `CIO`. Each agency and service had a three-star
    general as a board member. Not only did I constantly have to convince the individual
    board members to staff my organization, but I also had to continuously provide
    evidence of success and therefore of value for the organization to continue to
    be funded. The board met every quarter for a two-hour status report meeting and
    annually to appraise the success and decide on the continuation of the office.
    I knew I could not rely on these meetings alone to communicate the work we were
    doing and the support we needed.


    ## The Power of One-on-One Meetings


    In order to be successful, I met with every board member individually, weekly
    or biweekly. I made it a point to get to know them and to understand their role
    and their specific interest. I was able to grow this organization from two people
    to fifty in less than a year and expand our budget significantly. When there was
    a tough issue—and we had plenty of them—I knew who to lobby, who would provide
    advice to make sure I thoroughly researched the issue, and who would support me
    at the board meeting. While that individual often changed from issue to issue,
    I cannot overemphasize how much a fellow board member can sway the position of
    the board or even calm concerns of other board members. I rarely was surprised
    by any member''s position, and that enabled me to prepare for that position ahead
    of time.


    During my one-on-one meetings, there were times my thirty-minute slot was cut
    to five. Sometimes it would be a walk down the hall to their next meeting. I learned
    very quickly that my elevator pitch needed to be the whole story. I learned the
    value of being clear, concise, and direct. What did I need from them? Why should
    they care? How is my proposal going to solve the problem? What are the risks?
    Why do I need additional resources, and when do I need them?

