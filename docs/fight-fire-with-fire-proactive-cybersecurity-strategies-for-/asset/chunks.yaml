    information-sharing framework must allow for anonymization of the submitter if
    requested. In addition, only pertinent data such as indicators of compromise (`IOCs`)
    should be shared.


    Building a collaborative relationship with external entities can sometimes be
    challenging. Generally in order to establish and maintain a relationship, there
    must first be trust. Unfortunately trust often takes time, and in today''s world,
    time is not always available. In cases where there is resistance to building trust,
    there are two main options: to force change through legislation or mandate or
    to enable change using a combination of a “carrot method” and other offers of
    assistance. These options should be considered on a case-by-case basis. It is
    not always advisable to use mandates and legislation to get a desired effect.

    ```

