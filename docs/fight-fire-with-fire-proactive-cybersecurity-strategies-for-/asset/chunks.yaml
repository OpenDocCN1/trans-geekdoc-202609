  trans: '

    这看起来似乎简单，但安全团队在这一上经常失败。我们把问题复杂化，并只会引用规则，而不是教授原则、衡量指标并对性能提供反馈。我们止步于解释“为什么”，未能对发现的结果进行语境化处理，也未能用易于理解的术语解释威胁模型。我们部署的工具产生过量的数据或太多的假阳性，让无人能理解或行动，导致了告警疲劳和冷漠。我们对工程团队谈论“如果……怎么办”，而他们习惯用二元逻辑工作——代码要么运行，要么不运行；灯要么亮，要么不亮。对于“如果……会怎样”，他们得到的只会回以白眼。现实是，双方都需要采取不同的做法才能获得不同的结果。


    我们需要成为真正优秀的老师、故事讲述者和教练。最新的行业比例显示，开发人员与安全工程师的比例约为 100:1——这还是针对那些在流程上投入资金的公司。


    底线是：安全工程师永远不会够用。我们不可能顾及一切。我们需要在开发者群体中倍增技能组合和思维，以扩展安全知识和努力的规模。这意味着要意识到，大多数在职的开发者在核心课程中并没有学习过安全原则或安全编码实践。这也意味着，许多人在涉及安全问题时并没有意识到或没有接受过关于“可能性艺术”的教育。


    我们经常忘记，虽然我们中的许多人以此为生，但大多数其他人并非如此。事件的影响在发生之前通常不是首要考虑的，产生的兴趣会随着时间的推移而减弱。随着工程课程的演变，这种情况开始发生变化；然而，现在坐在岗位上的人可能需要帮助来确定该做什么。而且不，这并不意味着要依靠每年的三十分钟安全合规培训。我们对此都会报以白眼。


    ## 安全代码培训——前置及后续


    我曾工作过八个行业，并以内部员工或顾问的身份与二十多家机构合作过。在所有这些场景中，我记得最深——即使是几十年前的经历——是入职培训和入职流程。它为业务奠定了基调，设定了工作预期，并与我同一天入职的人建立了紧密的关系。我们对第一天的共同经历，如果所谓的“某届同学”，帮助建立了即使在多年后依然持续的关系。


    在我过去的职业生涯中，我曾在政府工作过——既是联邦雇员，也是高安全机构的承包商。最初几天的安全简报非常有冲击力。即使在十年后，我依然记得。我记得它们设定的预期、它们强调的威胁、如果发生产生的影响，以及我在支持安全任务中所扮演的角色，以及我可能如何成为目标。从第一天起，这就是带有个人色彩的。


    然而，并非所有公司都在入职培训中将安全放在首位。由于显而易见的原因，这种信息的缺失对我来说很容易，但对于安全领域之外的人来说，这很少被忽略。这只是不是他们首要的问题。


    入职培训是一个独特的机会，可以传达对业务重要以及对员工重要记住的事情。这是在他们接触代码*之前*，培训开发者如何编写安全代码、安全标准是什么等内容的理想时机。


    一个安全编码强化训练训练营（无论是持续几天还是一周），或者一个包含互动式指导和真实世界案例的计划，都将在未来产生丰厚的回。开发者已经在岗位上了吗？让他们也去吧。许多公司对员工的持续学习有预算和预期。有些公司甚至要求每年参加若干小时的培训作为绩效考核的一部分。在技能提升的一年里，你可能为现有员工小组安排参加安全工程训练营的课程。你甚至可以将此整合到“安全冠军”计划中，由管理层提名开发者参加——而且最重要的是，分配给他们专门的时间来完成任务。这种提名做法，结合人力资源部门的一些支持，可以将开发者的反应从“我必须做这个”转变为“我可以做这个”，让开发者将被授予安全冠军的称号视为一种荣誉而非负担。


    ## 赢得构建的认同


    即使人们知道该做什么以及为什么要做，你仍然会遇到“那又怎样”的回。每个团队都必须竞争时间和资源以实现他们的新想法——构建一种“设计即安全”的能力也不无例外。作为一名安全领导者，你将不得不推销你的安全开发计划的优点，并证明为什么它值得获得立即且持续的认同、时间和预算。这正是故事讲述的艺术结合所有关系建立大显用场的地方。


    ## 让其易于理解，使其重要，并用数据支持


    你可能会惊讶于，有多少决策者是从主流媒体和出版物的标题中获取安全新闻的。你可能也会惊讶，有多少人认为他们的应用程序或实践不会成为目标。“我们的应用没有任何个人身份信息（PII），也没有资金流。风险在哪里？”他们说。如果它触及其他系统，它就可能成为攻击者利用的极价值的软目标，以进入更大的目标。


    “这种情况会发生在我们身上吗？”以及“我们身上会发生什么？”是你希望准备好并乐意回答的问题。在这种意义上，故事讲述的艺术涉及将“如果……怎么办”和他人的经历转化为某些与你的环境产生共鸣的内容。


    安全对话正在扩大。过去它们几乎完全关注数据泄露，而现在它们已扩展到涵盖更具破坏性的活动问题，包括勒索软件或破坏性攻击。随着名人级的黑客攻击以及诸如 NotPetya
    破坏性攻击（2017 年）、SolarWinds 间谍活动（2020 年）以及 Colonial Pipeline 勒索软件事件（2021 年），机构正越来越意识到，他们开发的内容和使用的技术如何被攻击者武器化，不仅损害其公司资产，还会影响其客户和公众。


    例如 NotPetya 案例，来自一家小公司广泛使用的税务软件的可信更新被劫持，用于对特定目标进行破坏性攻击。问题是该更新扩散到了所有用户，导致对意外目标造成了超过
    100 亿美元的附带损害，使占全球航运能力 20% 以上的航运巨头马士停摆了几天。


    利用标题中的案例来讲述对自身组织潜在影响的故事，并将这些案例与公司开发产品的方式联系起来，只是故事过程的一部分。你将希望向这些故事注入数据，以告知“设计即安全”能力可以带来的价值，以及如何衡量其成功。我们已经讨论过在开发过程早期发现漏洞与之后发现的成本效益。通常，公司在生产环境中发现和修复漏洞花费的时间和资金比在开发环境中要多。根据
    IBM 系统科学研究院的数据，在生产环境中发现漏洞的成本是开发环境的六倍，而在生产环境中修复的成本是开发环境修复的十五倍。NIST 估计，组织在生产环境漏洞上的花费可能是开发环境的二十五倍。

