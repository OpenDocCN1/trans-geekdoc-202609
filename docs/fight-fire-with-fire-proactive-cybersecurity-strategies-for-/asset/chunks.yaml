    # When approaching metrics


    When you look at your metrics, try to stay away from security operational or shock-and-awe
    metrics. You know the type: the ones that state the company blocked hundreds of
    emails every day, stopped more than 500 intrusion attempts on the external perimeter,
    or 90% of systems have the latest anti-malware protection.


    Again, ask “so what?” at the end of that statement. Is that a lot? A little? Should
    we block more or less? What was it last month or quarter? How is the metric trending?
    Why do we care? Are we doing enough? What are other companies seeing or doing
    in this space? Think of those questions as you''re putting together your metrics
    and consider the sustainability of metrics. Will you be able to provide these
    metrics on a regular basis without spending countless weeks gathering the information?


    With opportunities growing in many organizations, we still need to keep the pressure
    on companies and on ourselves. Many companies see the `CISO` role as an “IT thing”
    or function. I am optimistic that over time, we will see the `CISO` role elevated
    in more companies, outside the financial services industry, similar to other C-suite
    roles like chief marketing officer, chief digital officer, chief risk officer,
    and chief privacy officer. This will happen as cybersecurity is seen as essential
    to the proper functioning of the enterprise. Fortunately or unfortunately, depending
    on your perspective, the current threat landscape is increasing the respect for
    the office of the `CISO`.


