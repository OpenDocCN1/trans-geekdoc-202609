    \ at the table and is viewed as a valued business consultant. Now, let's get started\
    \ on our journey!\n\n## The Building Blocks of the Journey\n\nCultural change\
    \ must occur in tandem with the growing maturity of the security program. This\
    \ is important because organizational awareness should build as the maturity of\
    \ the security program increases. As the foundational elements for maturity are\
    \ achieved, security can evolve from alignment to risk tolerance to consultancy.\
    \ To evolve to consultancy, there must be mature services to offer so that during\
    \ the consultancy, risk-aware advice can be offered that is aligned with the risk\
    \ of the business objective.\n\nWhat are the building blocks for the journey to\
    \ a high-performing security organization that has the trust, respect, and ear\
    \ of the business? [`Figure 3-1](#c03.xhtml#c03-fig-0001)` shows the evolution\
    \ from building a foundation to becoming a trusted advisor. The rest of this chapter\
    \ describes the building stages of the security program and their alignment with\
    \ building a culture of security awareness.\n\nThe cultural elements of security\
    \ include:\n\n* Leadership and organizational support\n* Communications\n* Measuring\
    \ effectiveness\n* Measuring engagement\n* Relationship management\n\nIn [`Figure\
    \ 3-1](#c03.xhtml#c03-fig-0001)`, these cultural elements are in `italic text`.\n\
    \n![Figure 3-1. The evolution of a culture of security awareness](images/c03f001.png)\n\
    \n[`Figure 3-1`](c03.xhtml#R_c03-fig-0001). *The evolution of a culture of security\
    \ awareness* \n\n## Program and Cultural Foundation\n\nEstablishing a foundation\
    \ for the security program is critical. Even if there is already a program in\
    \ place, revisit these foundational areas to ensure the foundation is strong and\
    \ includes needed elements to achieve broader cultural awareness.\n\n### Leadership\
