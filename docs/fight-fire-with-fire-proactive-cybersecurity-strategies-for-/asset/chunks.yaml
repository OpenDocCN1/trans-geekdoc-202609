  trans: '


    *   更有效地利用新兴技术、自动化和工具。通过更深对齐，更多的工作可以自动化。自动化对于对齐的团队最有帮助。如果 NOC（网络运营中心）和 SOC（安全运营中心）处于孤立状态，则很难自动化最佳实践或使用
    AI 来识别威胁。可以进行联合调优以产生最佳结果，例如产生准确的警报而非误报或告警不足。随着更多工作实现自动化，工作过载的分析师可以专注于更高价值的任务。

    *   更少的仪表板。生成的仪表板包含与两个团队都相关的指标。

    *   更频繁、更有凝聚力的培训和桌面演练。这些演练可以建立响应专业知识和团队整合。


    ## 表面融合或过快融合的危险


    融合 NOC 和 SOC 的益处显而易见。但细节决定成败。50-50 的合并是难以保证的。在合并过程中，一种文化往往会胜过另一种。如果 NOC 的观点胜出，你的组织将获得一个高可用但不安全的网络。如果
    SOC 的心态占据主导，你的网络将非常安全，但访问限制会更多。


    如果过渡过于仓促、执行不力，和/或者一个团队在没有适当规划的情况下承担另一个团队的职责，可能会发生以下问题：


    *   NOC 对安全事件的分析错误，且事件未得到完全解决。

    *   SOC 对 `debug logs` 的分析持续且不完整，原生网络相关事件未得到适当评估和解决。

    *   变更管理流程和审批的执行不一致，导致混乱。

    *   在缺乏知识和不熟悉的情况下执行安全和/或网络活动，导致对终端用户的支持延迟。


    ## NOC 和 SOC 关注的问题不同


    要理解如何避免错误并成功地将 NOC 和 SOC 的能力结合在一起，我们必须理解每个团队心态之间的差异。


    在日常运营和突发事件期间，NOC 和 SOC 必然会关注不同的问题。当问题发生时，双方都会部署自己的响应团队——通常会使用重复的工具，并从两个不同的视角查看同一组数据。并不意外的是，网络团队从网络可用性的角度处理事件，而安全团队则从恶意意图或安全漏洞的角度来看待相同的问题。看起来是网络问题实际上可能是攻击或其他网络问题；而看起来像网络事件或威胁的实际上可能是网络问题。某些问题同时属于这两个范畴。


    NOC 和 SOC 在防火墙处汇合，这对两个团队都非常重要。然而，每个团队都有不同的技能、不同的关注点，甚至关注防火墙的原因也不同。


    NOC 专注于网络设备的可用性、可靠性和管理，包括交换机、路由器、有线和无线线路、笔记本电脑、平板电脑、负载均衡器和防火墙。一个主要重点是定义防火墙策略。NOC
    端还监控所有网络流量、网络上设备的可用性和容量阈值。一旦发生问题，NOC 团队会仔细查看 `debug logs` 并专注于网络设备故障。团队成员研究 `debug
    logs` 以确定交换机、防火墙或其他网络设备的具体问题。


    与此同时，SOC 团队整体上更关注监控可疑或恶意活动以及 IP 地址。需要的不是所有的 `debug logs`，而是对应特定 IP、日期和时间戳的标准化日志。SOC
    需要的不是防火墙策略，而是想知道其下一代（NG）防火墙如何实时响应潜在攻击：发出了警报，还是威胁被拦截在 NG 防墙中？SOC 事件调查始于根因分析，然后进行数字取证，专注于威胁行为分析/恶意软件分析。SOC
    调查小组还涵盖端到端的损害恢复和修复。


    至于大局，SOC 团队被授权审查通用网络策略，制定管理网络连接和集成的安全策略，并批准特定的网络连接。网络架构的任何更改和对网络安全策略的偏离都必须通过 SOC
    风险评估，并推荐管理风险的替代控制。


    在突发事件之后，两个团队可能会得出不同的结论并向管理层发送冲突的建议。结果是：触发问题的解决时间太长，团队感到沮丧，领导层（你预算的来源！）也感到沮丧。将这种挫败感乘以数百次安全事件，结果就是两个团队之间存在全面的脱节，为攻击者提供了更多机会，组织领导层的支持减少。在保持他们不同观点的同时，努力提高团队之间的合作与协作是成功的关键。


    ## 融合 NOC 和 SOC 的方法


    在 NOC 和 SOC 孤立的公司中，必须解决围绕这种合并的人员和变更管理问题。每个小组都有自己喜欢的工具和流程；将它们融合不会在一夜之间完成，如果可以的话话。每个中心也有自己的预算、领导者和组织结构。理想情况下，NOC
    和 SOC 的融合将提高网络和安全运营。


    组织采取不同的方法来实现加强协作和融合。


    有些组织创建了单一实体，例如网络融合中心（Cyber Fusion Center）或集成运营中心（Integrated Operations Center）。联合中心通常包括云运营团队。根据组织的威胁格局和风险偏忍度，在
    CISO 领导下对 NOC 和 SOC 进行完全融合可能是一个有利的方法。


    高度具有风险意识的组织倾向于在 CISO 组织下设立独立团队，以便在变更管理和审批上实现统一流程，并在注入安全和可用性的同时对齐策略和标准。然而，如果从 NOC
    到 CISO 组织的完全过渡没有经过良好的结构以确保职责分离，SOC 监控和阻止可疑或恶意流量的使命可能无法占据主导，因为（大多是由于） NOC 和 SOC
    之间新兴的信任文化可能会导致问题。例如，NOC 将具备调整网络带宽以实现网络目标的能力，而 SOC 可能由于团队之间发展的情谊而跳过对任何可疑流量的监控。


    一种简单的方法是团队留在 CIO 和 CISO 不同的领导组织下，但近距离工作以实现凝聚性的协作和更快的响应。


    其他组织可能保持传统的组织运营，但将团队安置在一起，不一定在同一个房间，而在同一设施内；称之为“近距离管理”（managed proximity）。


    ## 打破孤立以建立团队


    打破不同的心态和处理问题可能是困难的。对于许多具有技术技能的人来说，协作并不是第一能反应。当他们看到问题时，他们的第一反应是尝试解决它并独立解决。鼓励协作优先的心态是一个挑战。


    但一旦建立，协作就能减少团队之间的互相指责。融合或协作团队现在不再担心是谁的问题并试图将任务交给另一个团队，而是共同解决眼手的问题。这把重点放在了它所在的地方：快速解决事件并减少其影响。


    '
