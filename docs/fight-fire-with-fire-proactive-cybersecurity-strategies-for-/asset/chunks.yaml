- raw: 'With the understanding of where the CISO should plug in and how the overall
    cyber risk program should be measured, overseen, and governed, the question is
    now “Have the right cyber risks been brought forward to inform the governance
    and oversight process?” Leveraging the risk management life cycle to identify,
    assess, manage, remediate, and report risk will enable a full understanding of
    your cybersecurity posture.


    ## Thinking Strategically About Potential Risks


    As the CISO works with his or her team to understand which risks should be managed
    and reported on, it''s important to use a wide lens and think strategically.


    Historically, identified risks have included items very specific to the information
    security program such as vulnerabilities, cyberattacks, and insider threats. These
    types of risks still need to be measured and monitored.


    But, as previously mentioned, the role of the CISO has become much broader and
    so areas of potential contribution to the organization by the CISO broaden commensurately.


    As a result, risks to the organization from the cyber perspective should also
    include strategic considerations like:


    *   The risk of maintaining a fully staffed security program when security professionals
    are in enormously short supply


    *   The risk that security staff skill sets are not updated in alignment with
    the organization''s changing technology and priorities


    *   The risk of insufficient agility for operating in a totally new environment,
    such as with the rapid and massive transition to work from home due to COVID-19,
    or the movement into wholly new business areas


    *   The risk that the organization''s information security program won''t keep
    up and remain effective in the face of rapidly evolving threats


    In order to ensure consistently strong and comprehensive risk management in information
    security, the CISO should consider establishing a risk management group within
    his or her organization to assist with systematically managing risks such as these.
    An effective risk management program would encompass:


    *   Skilled risk managers


    *   Appropriate tools and processes for identifying, assessing, mitigating, and
    reporting risks


    *   A specific emerging/strategic risk component


    *   Strong governance that includes appropriate policies and procedures and an
    oversight structure to ensure not only compliance but satisfaction of all risk
    and business requirements


    As risks are identified and evaluated, both the likelihood and the potential impact
    of the risk materializing in your organization need to be determined so that you
    can develop a remediation plan. The higher the likelihood and potential impact,
    the higher that risk needs to be on your list of priorities.


    As you consider various risks, don''t lose sight of the fact that to be strategic,
    you must also be agile. Not all risks are going to be known at any given time,
    which is why your risk management program should include an emerging/strategic
    component. As members of the US Marines are fond of saying, “Adapt and overcome.”
    Cyber is ever evolving, and in order to survive the “fog of war,” you will need
    to build flexible risk mitigation strategies that support your business needs.


    As an example, considering the worldwide shortage of trained cybersecurity personnel,
    most organizations will determine the likelihood of remaining fully staffed is
    low and the impact of not doing so is high. This is clearly a risk that should
    be addressed.


    In creating a remediation plan to share with the Enterprise Risk Management Committee
    and other stakeholders, consider a multi-pronged approach to solving the problem.
    This should include “growing your own” through external partnerships with local
    schools and colleges, including STEM programs and internships.


    Of course, it also includes building on internal resources. These internal resources
    could include employees in IT and other risk organizations where personnel have
    transferable skills and might have an interest in moving over to information security.
    Another option to consider may be embedding security skills into the various work
    streams instead of consolidating the team under a single cyber risk division.


    There is no single approach that is the perfect fit for every organization. To
    be most effective, it''s important to select an approach that meets the needs
    of your individual organization.


    For example, many public-sector organizations struggle with obtaining appropriate
    funding for highly skilled individuals. Those that operate in areas of close proximity
    to tech hubs are generally on the losing end of any employment sourcing opportunities.
    If you are in environments similar to this where employment is a struggle, think
    less about creating a cyber “kingdom” and more about load balancing cyber throughout
    the various IT operations. For more details on this topic, see [Chapter 5](#c05.xhtml),
    “Addressing the Skills and Diversity Gap.”


    ## Reducing Risk by Sharing Information


    Information sharing is arguably one of the most important aspects of reducing
    risk. To best guard against today''s world of evolving risks and threats, we must
    share quickly and openly with those in similar business sectors as well as with
    other industries. The US Department of Homeland Security has classified sixteen
    industries as “critical infrastructure” sectors.


    Most sectors have Information Sharing and Analysis Centers (ISACs) or Information
    Sharing and Analysis Organizations (ISAOs). These groups exist solely for mutual
    support of like organizations by expeditious sharing of cyber threats and incidents
    as well as best practices. If your organization is not a member, strongly consider
    joining one of these valuable groups.


    In addition, it is highly recommended that you look to partner with other entities
    within your area. All state governments and some local governments participate
    in private-public sharing.


    Another point to take into consideration is how to share data. Many organizations
    today are hesitant to share data related to cyber incidents out of fear that if
    released, it may impact their reputation. This is an understandable and valid
    concern. The information-sharing framework must allow for anonymization of the
    submitter (if requested). In addition, only pertinent data such as indicators
    of compromise (IOCs) should be shared.


    Building a collaborative relationship with local government or other external
    entities can sometimes be challenging. Generally in order to establish and maintain
    a relationship, there must first be trust. Unfortunately trust often takes time,
    and in today''s world, time is not always available. In cases where there is resistance
    to building trust, there are two main options: to force change through legislation
    or mandate or to enable change using a combination of a “carrot method” and other
    offers of assistance. These options should be considered on a case-by-case basis.
    It is not always advisable to use mandates and legislation to get a desired effect.
    Attempting to legislate change may lead to a counterintuitive situation where
    granular and often pertinent information is not shared.


    What has been successful in some cases when working with external entities is
    establishing partnerships and offering solutions that will reduce their cyber
    risks. This may be done through offering support in the form of SME consultations
    and/or physical support to aid a cyber-impacted organization. Other times, it
    may be appropriate to formalize the actions with a mandate or through legislation,
    but it is advisable to work on building the relationship first before taking this
    route.


    Many states are actively implementing ways to reduce risk through the adoption
    of a “whole-of-state” approach to information sharing. Whole-of-state means looking
    past authoritative boundaries established by laws and adopting a more cohesive
    strategy based on partnerships across private, public, and academic channels.'
