    ### 与风险框架对齐


    每家公司都有各种衡量风险的方法，通常符合企业风险管理框架。确保安全计划的控制措施与该框架对齐，并在业务单元层面进行衡量。此外，与风险管理部门的人员建立工作会议。他们可以成为极佳的倡者，并帮助推广安全计划。


    ## 计划构建与文化参与


    下一阶段涉及构建你的安全计划的同时推动文化参与。


    ### 与业务对齐（关系）


    贯穿都需要关系管理，因为文化变革无法自上而下或自下而上实现——它必须编织到组织的各个层面。在此阶段，确定你是否可以将专职人员分配到业务和技术团队。如果有专人，安排关键领导者与这些团队进行炉边谈话（fireside
    chats）。准备好描述安全使命和愿景的材料，同时仔细倾听业务问题以及安全如何能帮助解决这些问题。通过这些知识，安全团队还将获得关于如何衡量业务成果和关键结果的洞察，以进一步讲述安全故事。随着计划的构建，寻求建立业务安全冠军——这些人员可以作为你的大使，将安全信息传递给业务部门。


    ### 持续沟通与意识计划


    为了有效推动计划的成熟，安全团队必须在适当的论坛（如业务指导委员会、顾问小组和委员会）传递信息。聘请非技术背景的适当人员，帮助以具有业务意义的方式制定信息，并用清晰的示例传达安全为组织带来的价值等信息。除了业务论坛外，还要与风险部门的同事合作，识别风险论坛，以分享安全计划的信息并寻求建议。作为这些论坛的一部分，建立一个关于安全团队受邀参与的咨询的指标。随着计划的成熟，他们应该从战术性请求转向计划的战略性请求。


    教育员工其责任是你计划构建中最重要的部分之一。这些计划可以采用“胡萝卜”或“大棒”的方法，也可能两者兼顾。从让计划个性化开始——提供用于家庭计算机的技巧，以增强员工儿童甚至其年迈父母的在线安全。


    人们想要做正确的事。从基础开始，在三个到五个领域对人员进行教育，然后衡量他们的成功。鼓励报告此类的积极行为——通过公司的奖励计划庆祝这些成功，并在内网上发表文章，推介绍那些做了正确事的个人。这些个人会告诉另外十到二十个人他们做了什么来获得表扬，继续传播安全意识。在整个计划构建过程中，衡量向安全团队报告问题的情况。如果操作得当，你应该看到报告量随着时间的推移而增加。


    花时间一线人员进行炉边谈话——那些帮助台或客户中心的人。对于不对劲的事情提供见解。对这些团队的报告采取行动，因为这些报告通常可能是潜在问题的第一个迹象。表扬这些人的工作；确保他们的经理知道并通过贵公司的奖励计划奖励报告安全问题的积极行为。


    对于所有员工，玩玩游戏！是的，我是说要玩玩游戏。选择那些鼓励玩家学习安全常识的游戏。做完字游戏并玩知识问答游戏；然后用奖品奖励人们。记住：获得奖励的人会告诉别人，他们又会告诉别人，以此类推。例如，设置十个关于安全的问题，并在
    10 月（国家安全意识月）期间提供提示。给第一个正确回答所有常识问题的人发放奖励。另一个例子是举办一次会议，由安全小组演示能力并提供安全建议。给卡片上盖最多安全展章的人发放奖励，就像许多会议所的那样。


    当然，建立安全文化不能全是玩乐。对于某些行为，需要与人力资源部门对齐的后果模型。例如，如果员工拥有系统的特权访问但滥用了该特权，鉴于滥用信任的严重性，后果是什么？你如何区分蓄意滥用与员工在忙中跳过安全步骤时产生的问题？


    最后，不要忘记客户——与你的业务部门合作，了解客户的净推荐值（NPS），并找出客户在安全方面关心什么。你可以将这些发现与安全计划联系起来，这些措施的原理将在满意度方面产生共鸣。这一指标将你的安全计划与客户信任分挂钩，随着计划的成熟，客户信任分将增加。


    ### 初始净推荐值


    在计划构建阶段，对组织所有层级的安全计划得分进行初始衡量。以此作为输入，来定制关于计划成功的信息，并作为与员工互动以提高安全意识的最佳方式的洞察。留出讨论开放式问题的空间，关于哪些方面做得好，在哪里有增长机会。分享这一分数，并如之前讨论的，将其与参与计划指标联系。


    ### 目标成熟度衡量


    一旦你选择了一个衡量成熟度的框架，就将计划报告纳入风险和业务论坛。在这些关系的基础上，寻求如何将成熟度的提高转化为业务价值说明的建议。这是建立重要指标的开始——即对描述风险以及向董事会和业务沟通具有意义的指标。指标和报告需要根据受众进行定制，并且对每个受众应有所不同。解释这些指标为什么以及如何对于实现业务至关重要。


    ### 人才招聘


    根据可用资金，确保为最重要的职能配备人员，并在招聘时寻求传统和非传统背景的人才。针对技能以及公司文化匹配度进行面试，并寻找能够说业务语言的人员。


    ### 开始计划执行


    制定计划执行的核心准则并向必要的组成部分报告。准备好关键信息以及组织的使命和愿景，以便与风险委员会、论坛和业务会议分享。找到将信息融入公司文化的方法，并传达计划如何提高员工和客户的安全意识。


    ### 向风险框架汇报


    完全透明地报告计划的整体状况。展示计划如何提高安全的有效性。衡量可能主要是定性的。


    ## 目标成熟度与文化启蒙


    在计划的这一阶段，组织达到了目标成熟度，并能够提供成熟的服务。需要持续努力，使安全文化渗透到整个组织中。


    ### 业务关系已到位（安全被接受）


    '
