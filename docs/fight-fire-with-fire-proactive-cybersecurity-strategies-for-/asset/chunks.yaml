  trans: '


    `SOAR` 解决方案提供了更快的事件响应速度，并能标准化和扩展流程，以提高安全性并降低业务风险和成本。有效的 `SOAR` 解决方案可以解决告泛滥的问题，减少重复的人工流程，并在资源有限的情况下通过填充空白来增强任务。团队可以创建自动化剧本，而不是必须手动编写脚本。他们可以实时对事件进行分级，并为企业执行修复。


    有效的 `SOAR` 系统通过整合对各种事件的自动化响应，可以成为缓解 IT 和安全团队压力的有力工具。安全团队可以定制 `SOAR` 系统以适应其组织的需求。


    ## 扩展检测与响应 (XDR)


    检测和事件响应领域的一个新兴趋势是扩展检测与响应 (`XDR`)。`XDR` 解决方案收集并关联来自多个安全层的数据，包括端点、电子邮件、服务器、云工作负载和网络本身。它是传统检测和事件响应程序的的替代方案。`XDR`
    解决方案整合了跨多个环境的检测与响应，并提供了更全面的威胁视图。


    在许多情况下，精心设计的威胁很难被检测，因为它们隐藏在安全孤岛之间。事件传播得更快，并避开 `SOC` 的雷达——最终造成更大的损害。


    `XDR` 解决方案能够隔离并剖析这些威胁。它将每个威胁与各个安全层关联起来。随着组织寻求减少其环境的复杂性，有效的 `XDR` 解决方案能够从更广泛源收集、规范化并关联数据。它允许安全团队在威胁检测和响应方面更快速、更有效。


    ## 自适应云安全


    随着组织采用多云策略和远程办公政策，网络变得更加分布式，员工对云应用程序和环境的依赖也日益增加。组织通常将业务关键数据和服务分散在各个云和数据中心。在许多情况下，安全解决方案未能跟上云创新的步伐。组织往往拥有一套异构的技术组合，在各种云环境中拥有不相同的云安全控制措施。


    更复杂的是，某些组织在不经意间发现自己处于所谓的“共责任模型”中，这使得云提供商负责安全性的某些方面，而云用户负责其他方面。因此，理解与提供商之间的服务水平协议（SLA）至关重要，这样你才知道谁负责什么，而不要做任何假设。例如，对于
    `SaaS` 部署，提供商负责应用程序的可用性和安全访问。另一方面，客户负责平台配置、安全事件跟踪和数据。


    随着组织寻求将其更多的本地服务迁移到云端，他们仍然需要在这些环境中拥有可见性和控制力。云访问安全代理（`CASB`）坐于云用户和云应用程序之间。它通过监控活动和确保策略合规性增加了一层安全防护。


    `CASBs` 提供了对用户、用户行为以及存储在主要 `SaaS` 中的数据的洞察。它们还提供数据安全、数据泄露防护和威胁检测能力。


    云为组织提供了敏捷、高效和成本效益的巨大业务机会。但如果没有正确的安全基础设施支撑，云可能会带来严峻的安全挑战。


    许多组织采用多云策略来降低风险（即，不要把所有的鸡蛋放在一个篮子里）。合并和收购可能迫使采用多云策略，采用仅在某个云平台上提供的某些应用程序或服务也是如此。


    多云增加了安全团队的复杂性，因为每个云提供商都拥有不同的安全工具、方法和配置能力。


    为了克服这些挑战，企业需要与所有主要云提供商集成的解决方案，覆盖整个攻击面，并提供集中的安全管理。


    ## 结论


    端到端安全需要一个提供集成功能和开放 `APIs` 的平台，以整合来自现有工具和威胁情报的信息与能力。有效利用安全平台将整合你的运营和威胁情报，帮助你管理复杂性，并提供自动化以实现速度和一致性。为了应对今天和未来的挑战，并有机会领先于日益复杂和自动化的对手，你需要对整个数字攻击面具有广泛的可见性。通过这样的端到端安全平台，可以更好地管理风险，减少支持多个点产品的复杂性，并实现自动化工作流以提高操作和响应速度。


    # 术语表


    - `AI/ML`: 人工智能/机器学习。

    - `API`: 应用程序编程接口。

    - `APT`: 高级持续威胁。

    - `AWS`: 亚马逊云服务。

    - `Backdoor`: 后门。用户能够绕过正常安全措施并获得系统高级级访问的方法。

    - `CapEx`: 资本支出。云采用通常将资本支出（用于购买、维护和运行硬件和软件）转移到运营支出（订阅和/或每月使用费）。

    - `CASB`: 云访问安全代理。

    - `CERT`: 计算机应急响应小组。

    - `CFO`: 首席财务官。

    - `CGO`: 首席治理官。

    - `CIO`: 首席信息官。

    - `CISO`: 首席安全官。

    - `CISSP`: 注册信息系统安全专家；由国际信息系统安全认证联盟 (`ISC`)² 提供的认证。

    - `CPRA`: 加州隐私权利法。

    - `CRO`: 首席风险官。

    - `CSA`: 云安全联盟。

    - `C-SCRM`: 网络供应链风险管理（请参见 第 10 章）。

    - `CCPA`: 加州消费者隐私法。

    - `CSP`: 云服务提供商。

    - `CSPM`: 云安全态势管理。

    - `C-suite`: 指公司内的执行级经理。常见的 C 级高管包括首席执行官 (`CEO`)、首席财务官 (`CFO`)、首席运营官 (`COO`) 和首席信息官
    (`CIO`)。

    - `CWPP`: 云工作负载保护平台。

    - `Dark web`: 暗网。未被任何搜索引擎索引且无法通过标准浏览器查看的网页。

    - `DARPA`: 美国国防高级计划署。创建互联网前身 `ARPAnet` 的机构。

    - `DDoS`: 分布式拒绝服务。

    - `DevOps`: 开发团队与运营团队紧密合作的实践。

    - `DHS`: 美国安全部。

    - `Digital transformation`: 使用数字技术转型业务流程、用户体验和产品。

    - `DLP`: 数据泄露防护。

    - `DoD/IC`: 国防部/情报社区。

    - `Doxing`: 公开披露他人隐私信息（如电话号码或地址）的行为。

    - `EDR`: 端点检测与响应。

    - `Effovation`: Susan Koski 创造的术语，用于描述效率与创新的结合（请参见 第 3 章）。

    - `Endpoint security`: 保护终端设备（如桌面、笔记本电脑和移动设备）免受恶意攻击者和攻击利用的安全实践。

    - `EPP`: 端点防护平台。

    - `FCI`: 联邦合同信息。

    - `GRC`: 治理、风险与合规。

    - `Hacktivist`: 具有政治或社会议程的攻击者。

    - `Hairpinning`: 回环。


