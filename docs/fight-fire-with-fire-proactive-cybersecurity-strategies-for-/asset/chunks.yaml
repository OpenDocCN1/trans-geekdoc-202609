- raw: "> “Cyber Supply Chain Risk Management (C-SCRM) is the process of identifying,\
    \ assessing, and mitigating the risks associated with the distributed and interconnected\
    \ nature of IT/OT product and service supply chains. It covers the entire life\
    \ cycle of a system (including design, development, distribution, deployment,\
    \ acquisition, maintenance, and destruction) as supply chain threats and vulnerabilities\
    \ may intentionally or unintentionally compromise an IT/OT product or service\
    \ at any stage.”\n\nThat is a very detailed definition. Let's break it down bit\
    \ by bit.\n\nWhat does “cyber supply chain risk management” mean? In this context,\
    \ cyber means everything that is interconnected; all information technology and\
    \ operational technology (IT/OT) hardware, software, and services including platforms,\
    \ devices, architectures, applications, online services, communications, and datasets.\
    \ And while C-SCRM does not include elements of the traditional supply chain like\
    \ raw ingredients for food or fabric for clothing, it does encompass “smart” elements\
    \ of those supply chains, such as smart tags used for inventory and tracking of\
    \ pallets or expensive individual items.\n\nWhat is cyber supply chain management?\
    \ It is “the process of identifying, assessing, and mitigating the risks associated\
    \ with the distributed and interconnected nature of IT/OT product and service\
    \ supply chains.” This part of the definition takes into its scope most IT systems,\
    \ whether on-premises, cloud-based, or mobile, as well as anything with embedded\
    \ software, like a fleet of cars or medical equipment.\n\nCyber supply chain risk\
    \ management “covers the entire life cycle of a system (including design, development,\
    \ distribution, deployment, acquisition, maintenance, and destruction).” From\
    \ this portion of the definition alone, you can see that C-SCRM activities cross\
    \ departments and functions, spanning organizational silos.\n\nThe final part\
    \ of the NIST definition explains why this comprehensive approach is important\
    \ because “supply chain threats and vulnerabilities may intentionally or unintentionally\
    \ compromise an IT/OT product or service at any stage.” The risk is pervasive\
    \ and crosses business and mission operations because of our significant reliance\
    \ on IT/OT systems.\n\nAlthough broad, this definition will keep us focused on\
    \ one of the arenas of today's supply chains that is rapidly evolving and increasing\
    \ in complexity.\n\nOur cyber supply chain is now as critical to us as our food\
    \ chain. It is integral to our overall environment and impacts our entire ecosystem\
    \ with its work, social, and economic interplay and dependencies.\n\n## The Ultimate\
    \ Moving Target\n\nIf you love solving high-impact, complex problems using innovative\
    \ frameworks, technologies, and analytics, C-SCRM is a great professional field\
    \ to work in.\n\nWhat is more important than identifying, prioritizing, and mitigating\
    \ digital age risks from impacting your company, organization, or customers? The\
    \ relentless pace of advances in technology and in the development of software\
    \ tools and applications, the ongoing changes and fragility in the rapidly globalizing\
    \ supply chain, and the global and evolving threats all add to the complexity\
    \ and impact.\n\nEstablishing a risk baseline and continuously keeping up with\
    \ the breadth of what is involved—what you have, who built it, what it is connected\
    \ to, how it is used, how it could be subverted, and how it must be protected,\
    \ defended, and responded to—is foundational. It is a significant undertaking\
    \ that requires executive-level focus, hands-on management, and accountability.\
    \ C-SCRM also demands repeatable frameworks and scalable processes, knowledge\
    \ of the ecosystem, and technical and business acumen.\n\nOf course, since this\
    \ ecosystem moves at the speed of technology, this knowledge base must be continually\
    \ reviewed, refreshed, and refined as the vendor solution and service base, the\
    \ operating environment, and the threat actors, vectors, and intentions continue\
    \ to change.\n\nC-SCRM is not limited to hardware and software resilience and\
    \ assurance. The executive and management levels must also assess risks that result\
    \ from their business and mission functions; reliance on and connections with\
    \ their partners, teammates, vendors, and suppliers; and the processes and people\
    \ who implement and manage them, only a portion of which is under their aegis\
    \ or control.\n\nThe world economy has become very specialized and fragmented,\
    \ further complicating our supply chains. The norm is for a small business to\
    \ have more than twenty suppliers and for a large manufacturer to have thousands.\
    \ Consequently, the activities of CSOs, CIOs, and CISOs necessarily include vetting,\
    \ selecting, contracting, and integrating a myriad of product lines and service\
    \ vendors with their own supply chains, linkages, and dependencies, thereby compounding\
    \ the risks.\n\nAnd, lest we forget, it is called risk management because it is\
    \ impossible to provide complete assurance against every possible threat, so we\
    \ must consider which practical, prioritized actions can and should be taken to\
    \ address the most damaging and probable of risks to the organization's crown\
    \ jewels, within resource and business constraints.\n\n## The Expansion of Software-Based\
    \ Functionality\n\nSoftware, software, software: It is the foundational building\
    \ block of the information and digital age. Software also changes the risk dynamic\
    \ across digital devices, networks, architectures, and systems of systems. The\
    \ dramatic growth of software-driven functionality is directly related to the\
    \ ever-evolving breadth of business and mission apps and features.\n\nSoftware\
    \ as a percentage of the embedded functionality in all of our platforms such as\
    \ planes, cars, unmanned aerial vehicles, appliances, and devices has grown exponentially.\
    \ This trend has enabled dynamic product innovation and delivery of new features\
    \ and capabilities faster than ever before. Many organizations become enamored\
    \ of and addicted to new applications, solutions, and tools without sufficient\
    \ concern for the increased attack surface and the inherent complexities of tracking\
    \ a software-based global supply chain.\n\nThe software supply chain alone poses\
    \ considerable and complex risks, detailed in a report by the Atlantic Council.\
    \ As much as 90% of IT vulnerabilities derive from software weaknesses, according\
    \ to Rich Pethia, the founder of the original Computer Emergency Response Team\
    \ at Carnegie Mellon University.\n\nToday everything from watches to cars to airplanes\
    \ runs software, and everything that has software-based functionality can be hacked.\
    \ With 5G and the increased use of edge processing, the attack surface expands\
    \ dramatically.\n\n### Hardware Supply Chain Risks\n\nWhile software empowers\
    \ innovation and reduces time to market, it still runs on hardware that does not\
    \ change as often and that involves different components, vendors, and supply\
    \ chains. As noted in the 2017 Report of the Defense Science Board Task Force\
    \ on Cyber Supply Chain, “The supply chain for microelectronics parts is complex,\
    \ involving multiple industry sectors. Each sector sells to each of the others.”\n\
    \n# PART THREE  \n\nTechnology\n\n ![](images/p03uf001.png)\n\nFast-evolving technology\
    \ in a hyper-connected world presents opportunities for growth that we as CISOs\
    \ must leverage and manage to ensure a successful and secure business. In manufacturing,\
    \ the once safe-and-siloed operational technology (OT) world is now perimeterless,\
    \ with sensors and other edges everywhere connected 24/7. These connected devices\
    \ now expose the OT world to the IT side of the house, raising the risk level\
    \ exponentially. More third parties, such as supply chain players, are now connected,\
    \ as are workers via tablets, smartphones, and other devices. Connections are\
    \ often both on an internal network and in the cloud—in fact, in multiple clouds.\
    \ All of these changes create more security vulnerabilities across workplace environments\
    \ than ever before."
