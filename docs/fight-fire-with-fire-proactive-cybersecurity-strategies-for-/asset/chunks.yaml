    Cyber supply chain risk management “covers the entire life cycle of a system (including
    design, development, distribution, deployment, acquisition, maintenance, and destruction).”
    From this portion of the definition alone, you can see that C-SCRM activities
    cross departments and functions, spanning organizational silos.


    The final part of the NIST definition explains why this comprehensive approach
    is important because “supply chain threats and vulnerabilities may intentionally
    or unintentionally compromise an IT/OT product or service at any stage.” The risk
    is pervasive and crosses business and mission operations because of our significant
    reliance on IT/OT systems.


    Although broad, this definition will keep us focused on one of the arenas of today''s
    supply chains that is rapidly evolving and increasing in complexity.


    Our cyber supply chain is now as critical to us as our food chain. It is integral
    to our overall environment and impacts our entire ecosystem with its work, social,
    and economic interplay and dependencies.


    ## The Ultimate Moving Target


    If you love solving high-impact, complex problems using innovative frameworks,
    technologies, and analytics, C-SCRM is a great professional field to work in.


    What is more important than identifying, prioritizing, and mitigating digital
    age risks from impacting your company, organization, or customers? The relentless
    pace of advances in technology and in the development of software tools and applications,
    the ongoing changes and fragility in the rapidly globalizing supply chain, and
    the global and evolving threats all add to the complexity and impact.


    Establishing a risk baseline and continuously keeping up with the breadth of what
    is involved—what you have, who built it, what it is connected to, how it is used,
    how it could be subverted, and how it must be protected, defended, and responded
    to—is foundational. It is a significant undertaking that requires executive-level
    focus, hands-on management, and accountability. C-SCRM also demands repeatable
    frameworks and scalable processes, knowledge of the ecosystem, and technical and
    business acumen.


    Of course, since this ecosystem moves at the speed of technology, this knowledge
    base must be continually reviewed, refreshed, and refined as the vendor solution
    and service base, the operating environment, and the threat actors, vectors.


    ## The Expansion of Software-Based Functionality


    Software, software, software: It is the foundational building block of the digital
    age. Software also changes the risk dynamic across digital devices, networks,
    architectures, and systems. The dramatic growth of software-driven functionality
    is directly related to business and mission.


    Software as a percentage of embedded functionality in all platforms, devices,
    and has grown exponentially. This trend has enabled dynamic product innovation
    and delivery of new features faster than ever before.


    The software supply chain alone poses considerable and complex risks, detailed
    in a report by the Atlantic Council. As much as 90% of IT vulnerabilities derive
    from software weaknesses, according to Rich Pethia, the founder of the original
    Computer Response Team at Carnegie Mellon University.


    Today everything from watches to cars to airplanes runs software, and everything
    that has software-based functionality can be hacked.


    ### Hardware Supply Chain Risks


    While software empowers innovation and reduces time to market, it still runs on
    hardware that does not change as often and that involves different components,
    vendors, and supply chains. As noted in the 2017 Report of the Defense Science
    Board Task Force on Cyber Supply Chain, “The supply chain for microelectronics
    parts is complex, involving multiple industry sectors. Each sector sells to each
    of the others.”

