- raw: 'One approach is to consciously adopt a decision-making model. Two categories
    of models for organizations are rational decision-making (for example, DECIDE


    ## Automating Compliance


    Policymaking and compliance practices generally do not keep pace with technology
    changes. In addition to changes across the technical landscape, changes in regulations
    compound the need to understand expectations and translate them into requirements
    for system architects, developers, and engineers. The speed at which companies
    adopt cloud computing, digital technology, and advanced capabilities such as artificial
    intelligence is far surpassing the pace of our ability to adapt or evolve policies.


    It is time to expedite the critical components of our practice and realize that
    technical interpretation of controls through automation is the best path forward.


    Enabling automation will require some policy changes. Except for updates of recent
    data privacy regulations, most areas of compliance need a refresh to ensure that
    requirements can be implemented in code or configured in digital and automated
    solutions.


    We need to lead by using the same leading-edge technology we are tasked to govern.


    Traditional approaches to defining policy, monitoring compliance, and auditing
    adherence to requirements are under pressure. Current approaches are rigid and
    not easily automated.


    Success in this area requires resisting the default approach: adding requirements
    to existing policy. Policies, like systems, require architecture and design review
    when new uses of data or new technologies are introduced. A fundamental rule is
    to avoid complexity and right-size compliance to meet regulatory expectations.
    This ensures systems are operating as intended to defend data.


    We must revisit our approach to writing policy, keeping in mind the following:


    *   Understand the implications. We must understand current and next-generation
    technology, security, and audit capabilities prior to writing policies. The way
    we write policies can make things more difficult for systems and development teams
    because they are often translating policy requirements into code. Today we defend
    and govern using software that executes the intent of our policies and standards.
    Gone are the days when a risk or compliance program can be developed independently
    of understanding how a system or application will interpret and execute the intent
    of the control.


    *   Conduct a full review of policy and technical standards. Prioritize reviews
    of secure software development, solution delivery, vendor management, and defect
    management practices. Assess the level of awareness before attempting to introduce
    tech-relevant changes to policy. Update requirements associated with demonstrating
    control performance so that the automation of such tasks validates performance
    in a compliance assessment or audit.


    *   Adjust the periodic review and sampling process to evaluate the effectiveness
    and integrity of the code behind an automated rule. This code is the attestation
    you supply during an audit; it provides the appropriate level of assurance.


    *   Update the Information Governance Council''s charter and the annual program
    to ensure that decisions and policy adjustments prepare for the introduction of
    next-generation technology and the use of data prior to the organization adopting
    the solutions. This will minimize implementation costs associated with delays
    or misunderstanding compliance requirements.


    Making governance, risk, and compliance (GRC) technology-relevant streamlines
    decision-making and in some cases reduces the heat of discussions when transformational
    changes in architecture, code, or sharing data are introduced.


    ### Training and Technology Briefings


    As we discussed in the previous section, we are defending compliance practices
    related to code. If we do not understand the code and software that executes the
    requirements, how can we ensure the organization''s ability to maintain the fundamentals
    of confidentiality, integrity, and assurance (CIA)?


    If you''ve joined an organization or recently been appointed to lead the governance
    program, evaluate the level of technology awareness of those in the Information
    Governance Council. A series of technology briefings and training sessions may
    be needed to help council members become current in important areas. It is paramount
    that compliance professionals who support the CISO and enterprise risk teams keep
    up with techniques to automate compliance and in turn help educate everyone involved.


    What does this mean to the compliance professional? Close the technical knowledge
    gaps by consistently putting time and effort into learning. For example:


    *   Have monthly training sessions given by your internal engineering and developer
    teams.


    *   Attend conferences where participants share how solutions are being used to
    perform security, compliance, and audit functions. Go to sessions with other compliance
    professionals or partner with other organizations to develop case studies or write
    white papers.


    In technology briefings by the information systems or technology teams, ask them
    to highlight how the automation of controls will be configured to ensure confidentiality,
    integrity, and resilience.


    If we don''t transform the skills of information governance practitioners, we
    will encounter unintended residual risks. For example, we may not be able to spot
    security and compliance risks in software, automated in code, or outlined in contract
    terms. We may not notice a lack of adherence to policy because we are unable to
    detect the gap in the software.


    Leaders are accountable to upskill and prepare assurance, risk, and compliance
    teams.


    ### Becoming Purpose-Driven


    All aspects of governance should be purpose-driven and technically informed.


    A purpose-driven Information Governance Council addresses the limitations of traditional
    organizational or political boundaries in its charter. In addition to the topics
    listed previously, here are some other elements you may want to incorporate in
    your council''s charter:


    *   Defined approaches to support increased adoption of automation and open-source
    code


    *   Clear expectations for the treatment of data using secure-by-design practices
    in both commercial applications and applications developed in-house


    *   Methods for incorporating up-to-date technology trends relevant to your industry
    so results maintain the required compliance posture


    ### Sourcing and Contract Templates


    Sourcing and contract templates are an upstream category of governance that may
    be overlooked in a traditional compliance governance model.


    Inserting clearly defined terms and requirements into contract templates is a
    basic component of good contract management practices. This practice minimizes
    confusion and defines compliance expectations related to data processing, data
    treatment, and security transferred to the supplier or strategic partner.


    Standard contract terms such as “reasonable and appropriate security controls”
    are no longer suitable. Such language does not convey specific technical expectations
    for the protection of information and data in the contract. This type of language
    may leave a company exposed given changes in technology as compared to the threat
    landscape.


    Ensure that policies remain up to date and in force by sending out updated agreements
    automatically. Here are some contract terms to consider:


    *   Proactively define compliance requirements that should be automated across
    vendor systems or practices.


    *   Require compensating practices if full automation is not possible.


    *   Audit critical controls of connected third parties or strategic partners if
    automation is not possible.


    *   Consider how frequently contract templates should be updated to keep pace
    with increasing risks associated with changes in technology.


    *   Provide technology and compliance briefs to smaller strategic partners that
    may not have the resources to remain current with trends.'
