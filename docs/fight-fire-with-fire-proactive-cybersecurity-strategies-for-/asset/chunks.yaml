    作为首席信息安全官（CISO），我们必须精通业务语言。我们必须影响他人改变他们的思维、习惯和对待技术的方法，并以维护安全的方式行为。我们需要一种文化转变，让每个人都能采用有效的、持续的流程来确保我们组织的安全。安全必须嵌入到供应商选择、员工入职和产品开发中。安全意识培训必须是持续，以匹配我们所面临的威胁节奏。


    我们需要既理解最新技术价值的安全领导者，更重要的是，他们要具备建立能够凝聚人心的技能，以及创建可重复流程的纪律性。


    ## 如何成为一名高效的 CISO？


    当今的安全领导者面临着巨大的压力。CISO 职位的流失率很高，平均任期仅为二十六个月。我们需要根本性的改变来赋予我们有效领导的能力、获得更好的工作与生活平衡，并管理工作中不可避免的压力。答案不是工作更长时间；95%
    的 CISO 每周工作时间比合同规定的多出十小时。


    我们需要通成功的捷径，例如从导师和同事那里学习。当然，挑战在于如何为这些学习找到时间。这就是为什么我和我的同事写了这本书：为了分享我们的知识，更重要的是分享我们的经验，这些你在教科书或认证考试中找不到的内容。我们汇聚在一起，分享来自不同行业和部门的安全领导者的观点，提供我们最佳的思考，并分享重要的教训。利用这些见解并运用书中的策略，可以帮助领导者和组织改进他们的文化和安全态势。


    ## 本本书适合谁读


    随着安全挑战的不断演变和文化转变的迫切需求，本书确定了我们作为领导者需要考虑的步骤。这本书适用于任何在网络安全和 IT 领导领域工作的人员，他们希望更好地理解不断变化的安全威胁本质，并对解决这些问题的有效方法感兴趣。


    我们还希望这本书能激励更多多元化的人考虑网络安全领导职业。正如我们在`第 5 章`]中讨论的，网络安全领域既存在技能差距，也存在多样性差距需要填。


    当你读完这本书时，你将进化为新一代 CISO。你将更好地理解如何采纳最佳实践和流程，鼓励你的员工有效、安全地使用技术。你将知道如何担任业务战略家，帮助你的组织将安全重新定义为业务赋能者。你还将学习如何全天候（24/7）改进安全，贯穿整个供应链，从边缘到云端，从一线员工到董事会。最后，你将获得吸引和培养下一代多元化人才的策略。


    让我们开始吧。


    ## 注意


    1. `1. [`nominetcyber.com/nominet-ciso-stress-report-one-year-on/`](https://nominetcyber.com/nominet-ciso-stress-report-one-year-on/)]


    # 第一部分：人


    ![](img/p01uf001.png)


    网络安全不再仅仅是 IT 和安全团队的领域。从装卸平台到高管层，每个人都必须具备安全意识。


    在你的组织内部，训练良好的员工可以是你最好的网络防线。但人也可能是你最糟糕的敌人。你可以购买顶的安全技术并实施最佳实践，但如果你的员工不遵守良好的安全实践和政策，或不正确使用这些技术，你的组织仍然处于风险之中。你还必须获得董事会的支持，以营造安全文化。


    ## CISO 角色是如何演变的


    成为 CISO 最重要的技能组合是什么？对最新威胁的现有知识？对网络安全技术的深度理解以缓解安全风险？还是对最新工具、战术、程序和活动的熟悉？


    技术知识不是 CISO 最重要的特征。如今 CISO 需要将人们聚集在一起的能力。越来越多，CISO 被提升到高管层并成为受信赖的业务顾问。这需要软技能，以及用每个人都能理解的语言进行沟通的能力。CISO
    必须是业务赋能者，用业务术语解释风险`第 1 章`讨论了这一关键角色的演变，以便你成为一名强大的安全领导者。


    ## 让董事会参与


    企业董事会比过去更关注网络安全。董事会成员开始理解，安全威胁不仅是安全团队的问题，而是整个业务的风险。


    网络安全不足会导致员工和客户数据暴露，并面临违反隐私法规的风险。脆弱的安全还会暴露专利信息。在工厂，薄弱的安全可能导致受伤甚至死亡。糟糕的网络安全会导致收入损失、声誉受损、诉讼和罚款。当组织发生数据泄露时，影响将波及收入、运营、股东和整个业务。


    越来越多，CISO 被要求向董事会汇报并回答有关网络安全的问题。如果足够幸运，网络安全甚至有助于推动董事会级别的决策。


    在向董事会汇报时，CISO 必须学会从技术性语言转向业务战略和风险，从解决战术问题转向关注大局。你的团队必须为董事会提供做出网络安全决策所需的信息。关于向董事会汇报你应该知道什么？`第
    2 章`涵盖了这一重要主题。


    ## 安全文化


    安全不是业务的一个部门。正如我们将看到的，安全必须被考虑到并纳入每一个过程中。人类往往是网络防御中最薄弱的环节。他们通常想做正确的事，但他们需要充分理解自己在网络安全方面的责任。


    整个业务需要全面的方位安全方法，将安全融入组织的 DNA 中。它从董事会开始，但也应结合跨业务部门的关键大使来营造安全文化。这些大使为适用于每个业务领域的文化带来了具体性，为遵循良好实践和政策提供了范。


    尽管安全是一个严肃的问题，但安全培训不必是枯燥的。尝试利用有趣且互动性的活动来参与员工：例如游戏化。与其每年进行一次安全培训，安全意识应该贯穿全年。


    随着越来越多的人远程办公，对针对多种工作环境的网络安全培训日益增长。员工需要安全意识培训，以应对在传统办公室和家里可能出现的许多问题。


    建立强大的安全文化对你的组织产生持久影响。但你的安全文化不能停止于内部流程；它应该渗透到你与客户和业务伙伴的往来中。它应该构建在你提供给别人的产品、和服务解决方案之中。


    你如何促进一种网络安全成为每个人的责任的文化？`第 3 章`提供了构建安全文化的策略，这种文化将通过第二部分]的流程和第三部分]的技术得到加强。


