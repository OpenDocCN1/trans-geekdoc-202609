    # 2 与董事会沟通


    MARIANNE BAILEY


    实现有效的沟通可能是最困难的任务之一。由于人们在日常生活中经常面临这一挑战，因为双方在交流时往往不在一个频道，因为一方假设另一方具有相同的背景、偏好和利益。在与董事会沟通时，这个问题并不同。


    为了弥补这种沟通鸿沟，理解董事会的使命、学会他们的语言并清晰地阐述他们关心的原因至关重要。


    ## 董事会


    董事会的功能（对许多公司都是如此）是评估组织的战略。董事会通常由董事主席、首席执行官、首席财务官、总法律顾问和外部专家组成。讨论的话题涵盖从组织的财务、投资、文化，到人员问题、多样性数据以及法律问题。向董事会的汇报必须以清晰、简洁且易于理解的形式呈现。


    ## 使用他们的语言


    第一个重大挑战是使用相同的语言。技术人员（包括网络安全人员）有自己独特的语言。他们很难在董事会理解的高度上讨论他们的计划。


    作为许多技术组织的领导者，从我的第一个领导职位直到担任 `NSA` 的网络安全主管以及五角大楼的网络安全副 `CIO`，我一直面临这一挑战。无论是技术人员还是领导者向我汇报，还是我准备人员向五角大楼、国会或白宫的高层董事会和委员会汇报，我都会需要花费大量时间从几十页的简报中提取相关信息。我很少看到清晰明了演示文。人们包含了过多的信息，而没有明确他们的核心信息。我会问他们：“你们想向我或你们的高级听众表达什么？你们想从我或他们那里得到什么？”理解你的听众并根据他们的职责调整你的信息非常重要。


    ## 准备董事会议


    做好功课。要能够回答以下问题：


    *   董事成员是谁？他们的背景如何？是否有董事成员会成为我计划的盟友？在董事会之前有机会与他们分享信息吗？如果有，请抓住每一次机会与他们一对面交流，解释你的计划和面临的问题。你会发现，即使只有一两个成为支持者的董事成员，也会非常有价值。

    *   公司的大型战略重点是什么？

    *   我的立场与我的领导层一致吗？你永远不想在董事会上反对你的领导层。要理解领导者有许多问题需要处理，而你的问题可能不是目前的首要任务。损害信任关系是不值得的。


    '
