- raw: '*   More effective use of emerging technology, automation, and tools. With
    more alignment, more work can be automated. Automation is most helpful for teams
    that are aligned. If the NOC and SOC are siloed, it is hard to automate best practices
    or use AI to identify threats. Tools can be jointly tuned so that they produce
    optimal results, such as accurate alerts versus false positives or under alerting.
    As more work is automated, overworked analysts can focus on higher-value tasks.


    *   Fewer dashboards. The resulting dashboards include indicators relevant to
    both teams.


    *   More frequent and cohesive training and tabletop exercises. These exercises
    build response expertise and team integration.


    ## The Danger of Blending Superficially or Too Quickly


    The benefits of blending NOC and SOC are clear. But the devil is in the details.
    A 50-50 merger is hard to guarantee. In a merger, one culture often prevails over
    the other. If the NOC perspective wins, your organization ends up with a highly
    available, insecure network. If the SOC mindset prevails, your network is highly
    secure, but access is more restricted.


    If the transition is rushed, it is not well executed, and/or either team assumes
    the responsibilities of the other team without proper planning, the following
    issues will likely occur:


    *   Incorrect analysis of security incidents by NOC and incidents are not fully
    resolved.


    *   Prolonged and incomplete analysis of debug logs by SOC and native network-related
    incidents are not assessed properly and resolved.


    *   Varying execution of change management process and approvals with resulting
    confusion.


    *   Security and/or network activities executed without knowledge and familiarity,
    resulting in delayed support to end users.


    ## NOC and SOC Focus on Different Issues


    To understand how to avoid mistakes and successfully knit NOC and SOC capabilities
    together, we must understand the differences between the mindset of each team.


    In ongoing operations and during disruptive incidents, NOC and SOC, by necessity,
    focus on different issues. When a problem occurs, each side deploys its own response
    team—often using duplicative tools and looking through two different lenses at
    the same set of data. Not surprisingly, the network team approaches incidents
    from a network availability standpoint while the security team approaches the
    same issues from the perspective of malicious intent or security vulnerabilities.
    What appears to be a network problem actually may be an attack or another cyber
    issue; and what looks like a cyber incident or threat may in reality be a network
    issue. Some issues fall into both categories.


    NOC and SOC meet at the firewall, which is important to both teams. Each team,
    however, has different skills, different concerns, and even different reasons
    for caring about the firewall.


    NOC is focused on availability, reliability, and management of network devices
    including switches, routers, wired and wireless lines, laptops, tablets, load
    balancers, and firewalls. A major focus is defining firewall policies. The NOC
    side of the house also monitors all network traffic, the availability of devices
    on the network, and capacity thresholds. In the event of a problem, the NOC team
    looks closely at the debug logs and focuses on network device troubleshooting.
    Team members study debug logs to determine what specifically is wrong with a switch,
    a firewall, or something else on the network.


    Meantime, the SOC team focuses more narrowly overall on monitoring suspicious
    or malicious activities and IP addresses. Instead of all the debug logs, the SOC
    team wants normalized logs that correspond to specific IPs, dates, and timestamps.
    Instead of firewall policies, the SOC team wants to know how its next-gen (NG)
    firewall responded in real time to a potential attack: Did an alert go out, or
    was the threat trapped in the NG firewall? A SOC incident investigation starts
    with root-cause analysis and proceeds to digital forensics focusing on threat
    behavior analysis/malware analysis. The SOC investigating team also covers end-to-end
    damage recovery and remediation.


    As for the bigger picture, the SOC team is empowered to review general network
    policies, formulate security policies governing network connections and integrations,
    and approve specific connections to the network. Any changes in the network architecture
    and deviation from network security policies must pass through a SOC risk assessment
    that recommends alternate controls to manage the risks.


    After a disruptive event, the two teams may reach divergent conclusions and send
    conflicting recommendations to management. The result: the triggering issue takes
    too long to solve, teams are frustrated, and leadership (the source of your budget!)
    is also frustrated. Multiply that frustration by hundreds of security incidents
    and the result is an overarching disconnect between the two teams, more opportunities
    for threat actors, and less support from an organization''s leadership. Working
    to improve cooperation and collaboration between the two teams while keeping their
    differing perspectives in mind is the key to success.


    ## Approaches to Blending NOC and SOC


    In companies where the NOC and SOC are siloed, the people and change management
    issues surrounding this merger must be addressed. Each group has its favorite
    tools and processes; meshing them will not happen overnight, if ever. Each center
    also has its own budget, its own set of leaders, and its own organizational structure.
    Ideally, a blended NOC and SOC results in improved operations of both the network
    and security.


    Organizations take different approaches to achieve increased collaboration and
    blending.


    Some organizations create a single entity such as a Cyber Fusion Center or Integrated
    Operations Center. Combined centers often include the cloud operations team. Depending
    on the threat landscape and risk appetite of the organization, a complete blending
    of NOC and SOC, with both under the CISO, may be a favorable approach.


    Organizations that are highly risk conscious would prefer to settle for separate
    teams under the CISO organization for a unified process on change management and
    approvals and alignment of policies and standards while instilling security and
    availability. However, if the full transition of the NOC to the CISO organization
    is not properly structured to ensure segregation of duties, the mandate of the
    SOC, which is to monitor and block suspicious or malicious traffic, may not prevail
    because the (mostly desired) emerging culture of trust between NOC and SOC could
    lead to problems. For example, NOC would have the capability to adjust the network
    bandwidth to achieve network goals, and SOC may skip policing any suspicious traffic
    because of the developing camaraderie between the teams.


    An easy-to-manage approach is for teams to remain under different leadership organizations
    of the CIO and CISO but to work in proximity to achieve cohesive collaboration
    and faster time to respond.


    Other organizations may keep traditional organizational operations but co-locate
    teams not necessarily in the same room but in the same facility; call it managed
    proximity.


    ## Breaking Down Silos to Build Teams


    Breaking down different mentalities and approaches to problems can be difficult.
    Collaboration is not the first instinct for many people with technical skills.
    When they see a problem, their first instinct is to try to solve it and to solve
    it alone. Encouraging a collaboration-first mentality is a challenge.


    But once in place, collaboration reduces finger pointing between teams. Instead
    of worrying about whose problem it is and seeking to lay the task on the other
    team, the blended or collaborating team now works together to solve the issue
    at hand. This puts the emphasis where it belongs: on rapidly resolving the incident
    and reducing its impact.'
