    Organizational processes need to change to prioritize secure development. The\
    \ overall development and release schedule must include tasks that ensure security,\
    \ building in time for patching, fixes, and code review. Customers expect secure\
    \ code, and you need processes in place to make this an integral part of product\
    \ management.\n\n[Chapter 8](#c08.xhtml) offers strategies for creating an effective\
    \ secure development program.\n\n## Compliance\n\nFrom a compliance standpoint,\
    \ organizations must navigate an alphabet soup of evolving privacy and security\
    \ regulations and standards. Privacy has been brought to the forefront by regulations\
    \ like the EU's `GDPR` and California's `CCPA`. The panoply of regulations faced\
    \ by any given organization depends in part on the industry, some of which are\
    \ highly regulated. For example, healthcare organizations are subject to `HIPAA`,\
    \ while any organization that processes credit or bank card transactions must\
    \ implement `PCI-DSS`.\n\nFor security, organizations may choose to adopt frameworks\
    \ from `NIST`, `ISO`, or others. Ultimately, you need a framework against which\
    \ to measure and strengthen your organization's security posture. Frameworks provide\
    \ a road map for benchmarking your security controls.\n\n[Chapter 9](#c09.xhtml)\
    \ covers the ins and outs of compliance processes and how to collaborate with\
    \ the rest of the organization in this key area.\n\n## Supply Chain Risk\n\nBeyond\
    \ your own organization and employees, you need processes that protect your entire\
    \ enterprise from end to end, which includes your supply chain. After all, a risk\
    \ assumed by one is a risk assumed by all. Organizations are often impacted by\
    \ actions across several levels of their supply chains.\n\nIn the past, organizations\
    \ selected a vendor for a service or a product—whether new software, a marketing\
    \ tool, an HVAC system, or a custodial service. Then, they simply brought the\
    \ product or service into their network, often without analyzing the potential\
    \ risks. From a security standpoint, that approach is a nonstarter. If you're\
    \ using `SaaS`, it is run by another company. If that software is not secured\
    \ properly, you're putting your organization at risk. If a third-party software,\
    \ service, or product has a vulnerability, you've just added an unforeseen—and\
    \ harder to locate—vulnerability to your own network. For example, the 2013 Target\
    \ hack.\n\nA breach at any point in your supply chain can compromise your security.\
    \ Security leaders must make prudent decisions that reflect this reality. Vetting\
    \ potential vendors and supply chain partners for security weaknesses and other\
    \ problems is critical. You must also be aware of the risks of single points of\
    \ failure along your supply chain. Bottom line: you need to understand and properly\
    \ vet your entire supply chain.\n\n[Chapter 10](#c10.xhtml) covers supply chain\
    \ risk.\n\nSecurity is not an absolute, because no one has unlimited money or\
    \ unlimited resources to invest. Given that you cannot reduce risk to zero, the\
    \ best guidance for establishing effective processes requires gauging your organization's\
    \ risk tolerance, as described next.\n\n## Note\n\n1. [1](#p02.xhtml#R_p02-note-0001).\
    \ [https://krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/](https://krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/)\n\
    \n# 6 Effective Cyber Risk Management Requires Broad Collaboration\n\n***SUZANNE\
    \ HARTIN AND MARIA S. THOMPSON***\n\nWhy does cyber risk management deserve broad\
    \ collaboration? Why does cyber risk management deserve a chapter in this book?\
    \ (Note: repetitive text segments removed for clarity).\n\n## Understanding Your\
    \ Organization's Risk Appetite\n\nFirst, let's look at the level your organization\
    \ is willing to take. `ISO 31000` risk management defines risk appetite as “the\
    \ amount and type of risk an organization is prepared to pursue, retain, or take.”\n\
    \nHere are some indications of risk appetite:\n- We buy insurance or we don't.\n\
    - We exceed the speed limit or we don't.\n- We try extreme sports or we don't.\n"
