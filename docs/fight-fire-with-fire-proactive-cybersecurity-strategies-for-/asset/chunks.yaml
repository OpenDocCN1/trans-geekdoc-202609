    The so-called shared-responsibility cybersecurity paradigms championed by the
    cloud providers place the onus of protecting critical network, access, application,
    and data resources on the resident organization. While expeditiously producing
    à la carte and embedded security services for the core computing, storage, and
    infrastructure solutions they provide, cloud vendors are largely indemnified for
    any role played in cloud security incidents and data breaches. Thus, buying organizations
    relying on these now business-critical capabilities are on the hook to identify
    and manage the myriad availability, transport, configuration management, and data
    leakage risks involved on their own.


    Moving forward, cloud providers and cloud consuming organizations can more equitably
    share the risk. Cloud providers ought to elevate their baseline for how much they
    defend the assets they host, and lead the charge on fostering cross-vendor integration
    of largely siloed approaches to traffic inspection, data governance, and access
    compliance. Although this is historically unprecedented, consuming organizations
    should also demand cybersecurity breach insurance and even warranty-like commitments
    typical of other service-based industries, particularly as the market power and
    share of suppliers become concentrated.


    Worth highlighting too are organizations such as the `Cloud Security Alliance`
    that are defining distinct frameworks, best practices, and standards-based guidelines
    for ensuring secure cloud computing environments. Since 2009, the not-for-profit
    Alliance has endeavored to deliver vendor-neutral subject matter research, education,
    and certifications so that diverse parties can operate in a forum where building
    and maintaining a trusted cloud ecosystem is the universal goal.


    Increased regulatory oversight could also prove beneficial in ensuring greater
    compliance to higher cybersecurity hygiene standards. `HIPAA` and `PCI-DSS` information
    protection mandates introduced decades ago are salient examples of how such interventions
    positively influence adherence and build accountability momentum.


    By working together, vendors, customers, and consortia such as the `Cloud Security
    Alliance` appear best positioned to defend against active cyber adversaries who
    are exploiting the very technological developments that are advancing the economy.


    # 12 The Convergence of Cyber and Physical


    ## IoT and Edge Security

    **SONIA E. ARISTA**


    As a CISO, your challenge has been focused on protecting your enterprise network,
    devices on that network, the network perimeter, and the work environment—whether
    that environment is a factory or an office. But for many businesses, the work
    environment is now merging with the home and leisure space. In 2020, many more
    workers began working remotely, and some continue to work from home or exotic
    locations; more than half of all workers surveyed by `PwC` would now like to work
    from home at least three days a week.


    Strong edge security encompasses visibility, protection, and potentially remediation
    at the point where data processing is conducted. The same sophisticated operational
    technology (`OT`) risks found in environments like manufacturing plants, healthcare
    facilities, and government infrastructure also can put your enterprise at risk.
    Protecting data, processes, and people beyond that traditional perimeter—where
    the cyber and physical converge—is a growing challenge CISOs must address.


    ## Expanding IoT Leads to Expanding Risks


    In managing your security program, you may be accustomed to monitoring only the
    devices, software, and other technology adopted in your enterprise. Internet-connected
    technology is entering our lives at a fast pace in consumer tech and gaming, healthcare,
    smart city infrastructure, and industrial IoT. Each internet-enabled device in
    your workers'' environments that has management capability is a new perimeter,
    or edge, and has the potential for security vulnerabilities. Your workers are
    using their own devices in the workspace and toggling back and forth between their
    personal apps/accounts and approved workplace accounts. Device-level vulnerabilities
    in the home, in a game, or in a nonapproved workplace app can traverse cyber boundaries
    and put your enterprise at risk. In the interest of being more productive or acclimating
    to these work-from-home environments, employees are also increasingly using technology
    that your security team has not adopted or vetted. This trend, coupled with increased
    digitalization of the work environment overall, is leading to an unmanaged, multiple-edge
    frontier of cybersecurity risks, resulting in potential breaches or disruption
    of business.


    Connected consumer technology is expanding to many so-called edges in the home,
    including doorbells, baby monitors, washing machines, dryers, dishwashers, coffee
    makers, `HVAC` systems, and more. These household appliances are internet-connected
    to help manufacturers calibrate remote devices and perform diagnostics and to
    help consumers optimize energy use. For example, many vehicles are now connected
    with features including navigation, entertainment, tracking (both for stolen cars
    and time of use to monitor teenage driving), vehicle-to-vehicle communication,
    and more. As another example, the gaming industry is increasingly vying for total
    immersion experiences through wearable technology and other sensory devices.


    In hospitals, edge devices monitor patients'' vital signs including heart rate,
    blood pressure, temperature, and glucose level; robots perform surgery; edge devices
    monitor patient moods; and more. Medical professionals use applications running
    on edge devices—their own phones and tablets—using `Wi-Fi`, `voice over IP`, `cellular`,
    and `Bluetooth` transmission methods to manage and transport data. Each device
    and transmission method has its own vulnerabilities; moreover since many of those
    devices are not managed or secured by your network, this creates enormous complexity
    in the network environment to identify what is trusted or secure.


    Sometimes the so-called edge lives in our bodies. Research, development, and use
    of implanted or ingested medical devices or pharmacology is growing, with tens
    of millions of people worldwide living with implanted medical devices as of 2001,
    according to `Science Direct`. These devices regulate heartbeats; provide diagnostics,
    for example, glucose levels in the case of diabetic patients; and more. When former
    Vice President Cheney famously expressed concerns that his pacemaker could be
    hacked, doctors replacing it were asked to disable the wireless feature. In 2017,
    the `FDA` recalled nearly a half-million pacemakers over concerns that the devices
    could be compromised. These advances are significant in terms of patient treatment
    and health, but the cybersecurity implications are sobering.


    Smart city and utility infrastructure has expanded to include transportation,
    power supply and transmission, water supply and transmission, and more, all of
    which open up multiple edge points in the form of smart sensors and other operational
    technologies. Smart city infrastructure hacks could dovetail with a terrorist
    attack to combine a physical threat with a disruption of first- responder systems
    or infrastructure. One well-known attack in 2016 disrupted Ukraine''s power grid.


    In manufacturing, the newly networked processing and automation functions derived
    from the rapid digitization of industry have potential vulnerabilities at multiple
    edge points. Attackers can exploit or manipulate code, override or disrupt data
    transfer, alter the robots and supporting software, seize control of other machines,
    and manipulate components at the edge. You probably remember that the `Stuxnet`
    attack in 2010

