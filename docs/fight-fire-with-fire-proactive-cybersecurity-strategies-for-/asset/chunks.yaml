    individual is, what they want to do, what they have access rights and permission
    to do, and then creates one path to get there.


    In fact, you might have multiple paths created every session. For example, if
    a user connects to a point of presence that also has attached security services,
    there might be one connection that goes over the public internet if the user is
    accessing their personal `Gmail` account, and that connection might have very
    little security associated with it. Another connection might be to a mission-critical
    application and thus would be routed over a network that has a much higher `SLA`
    (service-level agreement), much stronger encryption, and a variety of security
    services such as data loss prevention and user behavior analytics associated with
    it. Another connection might be to a third-party `SaaS` application in which the
    use of `CASB` (cloud access security broker) is monitored. `SD-WAN`.


    ## Protecting Data: What, Where, and How


    Eliminating unknown unknowns is critical. To successfully defend your data against
    threats, assume threats are already inside the network.


    Protecting data is paramount. But first, CISOs must know what data they have.


    Not all data needs equal protection. CISOs must adopt today''s tools and techniques
    to protect data.


    Take the following steps to protect your data—no matter where it lives—and establish
    security-aware routing:


    *   Begin by identifying and tagging your data based on how securely it needs
    to be protected: public, nonpublic, proprietary/IP, or confidential/governed by
    privacy regulations. Identify your valuable assets.


    *   Identify where data lives: cloud, multi-cloud, and/or on-premises servers.


    *   Limit access to levels of data; for example, only the HR team needs to know
    private data.


    *   Set boundaries on behavior; for example, by limiting access to nonpublic organization
    data if they are on public Wi-Fi or by defining acceptable behavior. Limit behavior
    that is not within norms.


    Now that you''ve identified, tagged, and established proper routing for your data,
    encrypt it end-to-end. Congratulations: at that point, your data is no longer
    an unknown unknown.


    ## Steps to Security-Driven Networking


    As you begin the transition to security-driven networking, build support from
    corporately funded decision-makers by generating metrics that show security events
    and their root causes, as well as security events that were avoided and why.


    Here are steps to take, depending on the security level you want to attain:


    ### Basic


    *   Take stock of what you have.


    *   Even though a perimeter-based system is not effective, you still must define
    and understand your perimeter.


    *   Define where your organization''s data lives and where its data goes.


    *   Classify and tag your data based on how securely it needs to be protected.


    *   Identify all of your cloud environments, what data resides in each, who can
    access each cloud, and for what purpose.


    *   Implement specific strategies to fight phishing and malware.


    *   Establish a core inspection point for all data.


    *   Establish a budget for cyber investment.


    ### Better


    *   Add more context and layers to that core inspection point.


    *   Bring in more monitoring.


    *   Adopt the principle of least access.


    *   Add intelligent technologies that integrate security event management.


    *   Establish breach protection.

