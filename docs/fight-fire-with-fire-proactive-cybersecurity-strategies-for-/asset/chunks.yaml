    \ We were successful, but it was not an easy paragraph, and I received that verbal\
    \ buzzer more often than I would have thought.\n\nI have found that analogies\
    \ are incredibly useful. Recently, I was asked by board members why it is important\
    \ for their company to mitigate all of their critical vulnerabilities. Why isn't\
    \ 80% good enough? I used a very simple house-windows-and-doors analogy. If you\
    \ put state-of-the-art locks and monitoring on all of your windows and doors except\
    \ the back door, which you leave totally unprotected, you have not done much to\
    \ protect your house. Add to that the bad guy who can scan your house before arriving\
    \ to determine what protections you have on all of your windows and doors. You\
    \ have just given that bad guy a road map to enter your house undetected. Immediately,\
    \ the board members got it. I did not have to explain what a bad guy could do\
    \ if they didn't upgrade a specific OS or patch a specific vulnerability. It didn't\
    \ matter. All that mattered is the bad guy could get in, and 80% mitigation is\
    \ not good enough.\n\n## Working Directly for the Board:The Ultimate Case Study\n\
    \nAfter 9/11 I was asked to set up the first joint DoD/IC organization, the Unified\
    \ Cross Domain Management Office (UCDMO). The UCDMO was established to solve the\
    \ problem of cross-domain information sharing among all of DoD, including our\
    \ troops overseas and the intelligence communities. There was no holistic strategy\
    \ nor was there anyone in the lead. I used the analogy of kiddie soccer with everyone\
    \ running toward the ball (yes, I used this analogy with the board). It resonated\
    \ very well because I could provide example after example of duplication, lack\
    \ of strategy, and agencies not playing their roles.\n\nThe UCDMO was a “volunteer”\
