  trans: '


    > “网络供应链风险管理（C-SCRM）是指识别、评估和缓解与 IT/OT 产品及服务供应链的分布式和互联互通特性相关的风险的过程。它涵盖了系统的整个生命周期（包括设计、开发、分发、部署、采购、维护和销毁），因为供应链威胁和漏洞可能会有意或无意地在任何阶段损害
    IT/OT 产品或服务。”


    这是一个非常详尽的定义。让我们逐条进行拆解。


    “网络供应链风险管理”意味着什么？在这种语境下，“网络”意味着一切互联的事物；即所有信息技术和运营技术（IT/OT）硬件、软件和服务，包括平台、设备、架构、应用程序、在线服务、通信和数据集。虽然
    C-SCRM 不包括传统供应链的元素（如食品的原料或衣物的面料），但它确实涵盖了这些供应链中的“智能”元素，例如用于库存管理和跟踪托盘或昂贵单体物品的智能标签。


    什么是网络供应链管理？它是“识别、评估和缓解与 IT/OT 产品及服务供应链的分布式和互联互通特性相关的风险的过程。”这个定义的这部分涵盖了大多数 IT 系统，无论是本地的、云端的还是移动端的，以及任何带有嵌入软件的设备，例如车队或医疗设备。


    网络供应链风险管理“涵盖了系统的整个生命周期（包括设计、开发、分发、部署、采购、维护和销毁）”。仅从定义的这部分就可以看出，C-SCRM 活动跨越了部门和职能，打破了组织孤岛。


    NIST 定义的最后一部分解释了为什么这种综合方法非常重要，因为“供应链威胁和漏洞可能会有意或无意地在任何阶段损害 IT/OT 产品或服务”。由于我们对 IT/OT
    系统的高度依赖，这种风险是无处不在的并跨越了业务和任务操作。


    尽管这个定义很广泛，但它使我们专注于当今供应链中一个快速演变且复杂性不断增加的领域。


    我们的网络供应链对我们来说现在食物链一样关键。它是我们整体环境不可或的一部分，通过工作、社会和经济的相互作用与依赖关系影响着我们的整个生态系统。


    ## 终极的移动目标


    如果你喜欢使用创新的框架、技术和分析来解决高影响的复杂问题，那么 C-SCRM 是一个非常好的职业领域。


    比起识别、优先排序和缓解数字时代风险对你的公司、组织或客户的影响，还有什么更重要的？技术进步以及软件工具和应用程序开发的无情步伐、快速全球化的供应链中持续的变化和脆弱性，以及全球性且不断演变的威胁，都增加了复杂性和影响。


    建立风险基准并持续跟上所涉及的广泛范围——你拥有什么、谁构建了它、它连接到什么、它是如何使用的、它如何可能被破坏、以及必须如何进行保护、防御和响应——是基础性的。这是一项艰巨的任务，需要执行层的关注、实地管理和问责制。C-SCRM
    还需要可重复的框架和可扩展的流程、对生态系统的了解以及技术和商业的敏锐度。


    当然，由于这个生态系统以技术速度移动，随着供应商的解决方案和服务基础、运行环境以及威胁者和攻击向量的变化，知识库必须不断进行审查、更新和完善。


    ## 软件功能性的扩展


    软件、软件、软件：它是数字时代的数字基石。软件还改变了跨数字设备、网络、架构和系统的风险动态。软件驱动的功能的剧烈增长与业务和任务直接相关。


    软件在所有平台、设备嵌入功能中的百分比已呈指数级增长。这一趋势使得动态的产品创新和比以往任何时候都更快的功能交付成为可能。


    软件供应链本身就带来了巨大且复杂的风险，正如大西洋委员会的一份报告所详。根据卡内基梅隆大学最早的计算机响应小组创始人 Rich Pethia 的说法，高达
    90% 的 IT 漏洞源于软件缺陷。


    今天，从手表到汽车到飞机的一切都运行着软件，任何具有软件功能的设备都可以被破解。


    ### 硬件供应链风险


    虽然软件推动了创新并缩短了上市时间，但它仍然运行在并不频繁变化的硬件上，涉及不同的组件、供应商和供应链。正如 2017 年国防科学委员会网络供应链任务组报告所述，“微电子元件的供应链非常复杂，涉及多个行业部门。每个部门都向其他所有部门销售。”


