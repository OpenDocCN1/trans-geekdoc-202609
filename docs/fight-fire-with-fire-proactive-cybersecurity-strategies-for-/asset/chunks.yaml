  trans: '


    在这些领域中，用于与边缘节点通信的软件如果没有经过适当的审查、更新和保护，就会产生安全风险的隐患，特别是当数据和指令通过开放的互联网通道传输时。为了促进系统集成，工程化
    API 面着快速上市的压力，这往往会减少安全审查的力度，而且从网络角度来看，适当的尽职调查被忽视了。随后，攻击者将有机会通过代码注入等技术操纵这些软件，从而损害安全、盗取个人和财务信息，或造成其他伤害和混乱。


    ### 设备特定方法会导致风险增加


    随着越来越多的制造商进入市场，他们正在创建并定义自己的边缘处理芯片和半导体，而不是使用通用组件。例如，Apple 在 2020 年 11 月发布了其 `M1`
    芯片，该公司正朝着将多个计算功能整合到一个组件中发展。其目标是创建一个针对设备本身特定处理进行优化的芯片。数据不需要传输到数据中心或云端以获取计算能力，也不需要依赖第三方的操作系统来启用软件功能。你的手机就是一个完美的例子。


    尽管这种策略支持了设备功能的运行优化，但这种自包含的、设备特定的方法会导致处理组件之间的变异，从而增加了复杂性、风险和漏洞。从安全管理的角度来看，企业中所有计算设备的这种程度的变异将加剧两个传统的信息安全挑战领域：补丁和供应链漏洞。在高度专有或封闭的系统中，测试和打补丁严重依赖于制造商的发布和修复计划（例如
    `Microsoft`）。组件之间增加的变异也导致了对这些个性化子组件的可视性和维护带来了挑战，从而在供应链中带来了更多的网络安全风险。


    在边缘侧，由于漏洞利用的近距离触发，识别和修复的时间线变得几乎为零。随着处理点更靠近边缘，这些特定操作系统特定处理器中的各种标准使得网络安全专业人员更难识别入侵指示（IoC）。在许多情况下，除非发生业务中断或其他指标事件，否则潜伏着数据窃取或数据完整性破坏的网络事件可能永远不会被用户或企业识别。


    ### 迈向解决方案：盘点


    另一个挑战是了解并理解企业中运行的所有技术。不仅许多公司正经历员工人数的巨大有机增长，而且过去几年的并购活动也在扩大，因为传统业务模式正试图为其服务组合和产品增加高科技赋能。


    公司需要迭代地盘点，了解企业中部署了哪些边缘设备、软件、应用和代码，包括员工自自采用的。最重要的是，这些信息安全计划必须能够扩展并适应日益增加的监管控制。目前的国际和国内法律以及行业指南严重落后于技术创新和应用。


    最后，对服务提供商和合作伙伴（即使是那些被间接使用的合作伙伴）有充分的理解对于帮助你的业务运营至关重要。例如，在 `SolarWinds` 破解事件之后，当之热门的问题是：你正在使用
    `SolarWinds` 吗？什么版本？或者哪些模块？许多安全领导者并不知道，首先必须检查——不仅是他们的环境，还包括他们的核心服务合作伙伴。这种初始知识的缺乏延迟了修复，并构成了更大的风险。


    ### 定义你拥有的东西


    许多企业最根本的差距之一是，他们并没有花时间来归类什么构成了自己的知识产权——行业内许多人将其称为保护你的“皇冠明珠”。为了在市场竞争中抢占先机超过了对数据完整性控制和保证的管理。例如，在软件开发领域，快速上市的压力意味着团队正在拼命编写代码以发布新软件和升级以满足客户需求。在此过程中，他们采取了安全捷径，未能对他们创建的内容进行分类，或者继续在不稳定的平台和旧基础设施上构建，积累了巨大的技术债。


    无论业务类型或行业垂直领域如何，许多组织随着时间的推移积累了大量的非结构化数据，包括从第三方获得的数据——这就是非结构化数据困境。


    尽管你认为大型数据池更有可能产生代表性的洞察，但算法偏差是一个真实的问题，数据集缺失的可能性也是如此，或者结果在开发功能时使用了错误的逻辑。


    特别是现在公司将客户数据集作为收入模式的一部分进行销售，这种对高度敏感或未标识数据的挖掘可能会引发大问题并偏偏结果。将正确的数据集提供给软件架构师和工程师——并确保这些工程师拥有相应的权限——对于确保
    `AI` 和 `ML` 的结果准确至关重要。


    如果没有正确的访问和安全协议，随着时间迭代下载和上传的数据可能会变得劣化、受污染且脆弱。随着大量数据稀释了任何微小污染的可视性，这种危险变得更加激烈。在这种环境下，数据治理比以往任何时候都重要。


    此外，如前所述，你的员工正在使用自己的边缘设备——手机、平板电脑、笔记本电脑——以及通常在企业中使用他们自己的应用和软件。在分布式工作力的场景下，一旦员工在边缘启动或引入了新软件或新设备，企业数据泄露、丢失和污染的风险是巨大的。


    *你无法保护你不知道拥有的东西*。


    '
