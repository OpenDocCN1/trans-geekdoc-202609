    solutions have become the Achilles'' heel of a complex cybersecurity landscape.
    The average enterprise deploys 47 different security solutions, according to the
    Ponemon Institute. Many of these solutions work independently, creating multiple
    silos to operate and maintain. Siloed systems make it difficult to correlate events
    and develop a coordinated response. Such systems also create potential security
    gaps. Multiple point solutions are costly and challenging to manage and maintain.


    Each of these solutions generates alerts that are a nightmare to monitor and prioritize,
    let alone coordinate. The resulting enterprise ecosystems become increasingly
    complicated with too many vendors, too many alerts, and not enough skilled people
    to respond to cyber threats in real time. Finding professionals who can operate
    and maintain a myriad of tools is also a challenge; when these skilled people
    leave the organization, it creates gaps.


    To assemble a set of solutions, many enterprises moved from point solutions to
    suites of products that offered more capabilities than single point solutions
    did. Suites are a step toward integration in theory, but in practice, they often
    include one really good solution while the rest are simply mediocre. As a result,
    such suites don''t offer true end-to-end security. Instead of solving security
    problems, these suites and point solutions require more human monitoring, pose
    a challenge to adopting new technologies, and create numerous potential points
    of failure. They also add cost, maintenance, and operational burdens for security
    and networking teams who are already understaffed and overworked. Overall, the
    lack of integration can cause delays in implementation, slower returns on investment,
    and a higher total cost of ownership.


    Since criminal enterprises are using scalable platforms for their attacks, organizations
    must fight fire with fire. As enterprises strive for speed and scale, cybersecurity
    leaders will seek to move beyond cybersecurity point solutions and suites and
    invest in carefully crafted, fully integrated security platforms. This is the
    real meaning of end-to-end security, a strategy and implementation approach that
    stands a chance of getting ahead of the challenges just mentioned.


    While each organization needs to define a comprehensive and adaptable security
    posture to meet their needs, there are some fundamental capabilities required
    for end-to-end security that every organization should consider.


    End-to-end security encompasses three driving forces:


    *   A broad view of the entire threat vector

    *   Automation

    *   A full integration of cybersecurity solutions across the network


    The rest of this chapter explores key capabilities, including key features to
    look for as you evolve your platform.


    ## Unified Threat Intelligence


    Unified threat intelligence is critical to face today''s threats because, to succeed,
    threat intelligence must reach outside of your organization to your entire industry
    sector and beyond. You need to know the nature of threats you face before the
    attackers target your enterprise. Threat intelligence must be timely, accurate,
    and actionable. Achieving end-toend security requires incorporating threat intelligence
    in every component, unified and integrated across the platform.

