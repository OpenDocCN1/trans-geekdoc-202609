- raw: "NOC and SOC can work well together if leadership and teams exercise appropriate\
    \ delineation of responsibilities, adopt good technology, and establish sound\
    \ policies. But remember: Rushing leads to risks and regrets. Regardless of the\
    \ transition model, adequate time for knowledge transfer and training must be\
    \ allowed. Usually six to twelve months will be enough. This can be extended depending\
    \ on the results.\n\nNormally after the training, NOC can assume SOC Level 1 support\
    \ and monitoring. However, forensics, which is a specialized skill, remains a\
    \ SOC domain. In the same way, the SOC team can assume the network monitoring\
    \ and initial triage, but in-depth analysis of the debug logs may really take\
    \ time. Plan for a one-year transition.\n\nSome type of blending, or at the very\
    \ least, collaboration, is the direction the industry is heading. But the best\
    \ approach is like driving on a curvy, mountainous road: proceed with extreme\
    \ caution. Collaborate, cooperate, and blend slowly. Test the road and keep looking\
    \ ahead before moving too quickly. It's better to live with a little bit of tension\
    \ than with a failed merger.\n\nIf you keep the potential dangers, details, and\
    \ differences in mind, you can slowly but successfully blend the two teams or\
    \ establish a new normal of increased collaboration and cooperation.\n\n# 8  \n\
    \nSecurity by Design  \n\nStrategies for a Shift-Left Culture\n\n***ANNE MARIE\
    \ ZETTLEMOYER***\n\nHacker summer camp is an annual weeklong trek into the blistering\
    \ heat of Las Vegas in August where more than 10,000 security pros and fans gather\
    \ to rub elbows, share ideas, and reconnect over a series of security conferences,\
    \ mainly BsidesLV, DEF CON, and Black Hat. It's a family reunion of sorts, where\
    \ memories are made (and forgotten) and ideas are formed, argued, developed, and\
    \ matured.\n\nIt was at this event a few years ago where I had conversation after\
    \ conversation around security by design—DevSecOps to some (security should be\
    \ in the definition!), definitely not DevSecOps for others (DevOps must be held\
    \ pure!), and to all the endeavor to “shift left” and bring security to the beginning\
    \ of the development process versus bolting it on at the end. It's the noble effort\
    \ to include “secure” in the definition of quality and “safe” in the definition\
    \ of ready and to do so efficiently and effectively throughout the product life\
    \ cycle. Whether you're a DevOps purist or a DevSecOps advocate, despite the many\
    \ debates on labels, we can all agree that the things we create should be safe\
    \ and stay safe for as long as they are in use.\n\nObviously…right?\n\nIf you've\
    \ ventured into the space of application security or security by design, you'll\
    \ have seen that the notion of securing something up front is many times met with\
    \ a lot of head nodding (oh yes, that's a great idea!), only to result in even\
    \ more head shaking when speed of development overtakes the priority of compliance\
    \ or security (oh wait, you meant now?).\n\nYou may have heard a series of relatable\
    \ and somewhat understandable lamentations like:\n\n*   “All these rules slow\
    \ us down.”\n\n*   “We just want to iterate to an MVP to prove the value.”\n\n\
    *   “But we passed the audit already. We'll deal with that later.”\n\n*   “You\
    \ security folks are just spreading FUD. It's fine!”\n\nand my favorite:\n\n*\
    \   “It just has to work!”\n\nBy this point, I see security pros experience a\
    \ plethora of reactions—including disbelief, frustration, throwing hands up, and\
    \ maybe even some weeping or full-on carb bingeing. Why? Because it's frustrating\
    \ to have good intentions fall through, but I can tell you this: those developers\
    \ are diving into their feelings on the other side too.\n\nThe result? We spin\
    \ our wheels, relying on expensive near-production or post-production assessments\
    \ or alerts like pen-tests, bug bounties, and the dreaded “incident” to reveal\
    \ problem areas. As a result, the business ends up spending ten or eleven times\
    \ more on fixing security flaws found “at the end” than it would have had we worked\
    \ together more effectively up front. That doesn't include the costs of a compromise\
    \ or breach.\n\nSo, what can we do differently?\n\nIn this chapter, I'll share\
    \ my experiences across industries and dive into methods and ideas on how to establish\
    \ a secure development culture and build the partnerships in order to create securely\
    \ *by design*.\n\n## What Is Secure Development? What Does It Encompass?\n\nBefore\
    \ diving into strategies, let's define our terms.\n\nSecure application development\
    \ includes both secure coding and secure practices. As mentioned earlier, “secure”\
    \ must be part of the definition of quality and functional acceptance. It's not\
    \ enough to focus on writing secure code; writing the code is just one part of\
    \ the development life cycle.\n\nWe have to put equal emphasis on maintaining\
    \ the safety and security standard for quality by investing in people (both skill\
    \ and capacity) as well as achieving and maintaining proper hygiene of the product\
    \ along with the infrastructure it sits on and interacts with. We need to make\
    \ space for tech refresh, remediation of vulnerabilities, and required upgrades\
    \ as systems, products, and infrastructure age. Like most things, it's a combination\
    \ of people, process, and technology that makes the magic work … in that order.\n\
    \n## Skipping Ahead to Process and Technology—Wait, What?\n\nIt's true that everything\
    \ starts with people, and we'll spend the most time exploring strategies on how\
    \ to hack that part of the people-process-technology triad. However, since we're\
    \ still talking about definitions, let's get a few things out of the way.\n\n\
    ### Fit for Purpose and Scale\n\nI'll start out by saying that not all of this\
    \ is going to apply to everything your company develops. How you harden your products\
    \ and approach security by design must be appropriate for your product's threat\
    \ landscape and your business's risk appetite. The strategies in this chapter\
    \ are meant to provide ideas on how to approach some of the tougher problems in\
    \ implementing a secure-by-design culture, but there is not a one-size-fits-all\
    \ methodology. Not every product needs the same frequency or level of scrutiny,\
    \ and deciding what “fit for purpose and scale” means will change for products\
    \ as well as the business over time.\n\nThat said, there are some key components\
    \ of testing and tools that make security by design easier and more successful\
    \ for many. Let's talk about a few of those components.\n\n### Findings by People\n\
    \nWhile many types of testing can be automated, a few require humans to take the\
    \ lead.\n\n#### Design Review and Threat Modeling\n\nUsually done by a security\
    \ engineer (hopefully embedded in the product or development team), this component\
    \ helps the team think through how things can go wrong. What are the possible\
    \ misuses of the technology? What weak points are introduced into the business's\
    \ ecosystem through its development or connectivity? When done regularly and across\
    \ business units, this process also helps inform the security organization's strategy\
    \ on what capabilities and functions are needed to keep up with business needs.\n\
    \nThreat modeling is time-intensive. If resources are scarce, it should be prioritized\
    \ for the highest risk or most valuable assets and programs at a frequency that\
    \ makes sense for decision-making. Regular security engineering reviews should\
    \ be slated throughout the development process and may include activities like\
    \ reviewing technical architecture documents, interpreting security findings,\
    \ and approving remediation plans.\n\n#### Penetration Tests and Bug Bounty Programs\n\
    \nThese tests find vulnerabilities by emulating how an attacker might interact\
    \ with and compromise an application, infrastructure, or system. Penetration tests\
    \ should be done pre-production and are often required by various compliance standards\
    \ and regulations. Bug bounty programs are structured agreements on how to handle\
    \ and reward responsible vulnerability disclosure for researchers who test products\
    \ postproduction.\n\n### Findings by Tools"
  fmt: "\nNOC and SOC can work well together if leadership and teams exercise appropriate\
    \ delineation of responsibilities, adopt good technology, and establish sound\
    \ policies. But remember: Rushing leads to risks and regrets. Regardless of the\
    \ transition model, adequate time for knowledge transfer and training must be\
    \ allowed. Usually six to twelve months will be enough. This can be extended depending\
    \ on the results.\n\nNormally after the training, NOC can assume SOC Level 1 support\
    \ and monitoring. However, forensics, which is a specialized skill, remains a\
    \ SOC domain. In the same way, the SOC team can assume the network monitoring\
    \ and initial triage, but in-depth analysis of the `debug logs` may really take\
    \ time. Plan for a one-year transition.\n\nSome type of blending, or at the very\
    \ least, collaboration, is the direction the industry is heading. But the best\
    \ approach is like driving on a curvy, mountainous road: proceed with extreme\
    \ caution. Collaborate, cooperate, and blend slowly. Test the road and keep looking\
    \ ahead before moving too quickly. It's better to live with a little bit of tension\
    \ than with a failed merger.\n\nIf you keep the potential dangers, details, and\
    \ differences in mind, you can slowly but successfully blend the two teams or\
    \ establish a new normal of increased collaboration and cooperation.\n\n# 8\n\n\
    ## Security by Design: Strategies for a Shift-Left Culture\n\n**ANNE MARIE ZETTLEMOYER**\n\
    \nHacker summer camp is an annual weeklong trek into the blistering heat of Las\
    \ Vegas in August where more than 10,000 security pros and fans gather to rub\
    \ elbows, share ideas, and reconnect over a series of security conferences, mainly\
    \ `BsidesLV`, `DEF CON`, and `Black Hat`. It's a family reunion of sorts, where\
    \ memories are made (and forgotten) and ideas are formed, argued, developed, and\
    \ matured.\n\nIt was at this event a few years ago where I had conversation after\
    \ conversation around security by design—`DevSecOps` to some (security should\
    \ be in the definition!), definitely not `DevSecOps` for others (DevOps must be\
    \ held pure!), and to all the endeavor to “shift left” and bring security to the\
    \ beginning of the development process versus bolting it on at the end. It's the\
    \ noble effort to include “secure” in the definition of quality and “safe” in\
    \ the definition of ready and to do so efficiently and effectively throughout\
    \ the product life cycle. Whether you're a DevOps purist or a DevSecOps advocate,\
    \ despite the many debates on labels, we can all agree that the things we create\
    \ should be safe and stay safe for as long as they are in use.\n\nObviously…right?\n\
    \nIf you've ventured into the space of application security or security by design,\
    \ you'll have seen that the notion of securing something up front is many times\
    \ met with a lot of head nodding (oh yes, that's a great idea!), only to result\
    \ in even more head shaking when speed of development overtakes the priority of\
