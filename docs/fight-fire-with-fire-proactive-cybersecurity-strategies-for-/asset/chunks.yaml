    *   How many software defects and security flaws were found in the last year?

    *   How many defects were repeat findings?

    *   Have any defects led to incidents, outages, or compromises?


    Once you have these numbers, you can help paint the picture of the potential benefit
    of shifting left with a security-by-design program. Next, you''ll want to include
