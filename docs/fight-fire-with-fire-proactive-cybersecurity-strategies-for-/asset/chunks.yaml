  trans: '

    在本章的开头，我承认我们的领域并不一直能跟上技术快速发展、先进计算以及不断扩张的威胁格局的步伐。随着我们看到攻击增加——威胁攻击者利用低质代码、配置错误或在补丁、变更控制或定期审查期间未识别的漏洞——保持与时同步变得更加重要。信息治理委员会（Information
    Governance Council）和治理负责人与架构及网络防御负责人的合作，在解决这些问题方面正发挥着更为重要的作用。数据表明，修订后的主动性、技术驱动型政策可以简化合规实践、填补差距并加速快速采用。


    ## 在不断变化的环境中交付价值


    全球数据隐私法规不断调整，这在一定反映了威胁格局的变化。它也反映了对源于基础不合规行为的错误或错误的容忍度降低。近期加州通过的法规就是一个例子，就在《加州消费者隐私法案》通过十个月后。


    新规加上长期疫情带来的经济压力，为任何组织的治理、风险和合规（GRC）领导提供了调整策略和交付更多价值的独特机会。


    在这样的时期，管理层需要修订后的政策和明确的指令，在确保合规的同时允许持续创新。策略的细微调整也能创造额外价值。


    以下是几个具体的例子：


    * 增加并启用自动化。建立行业框架（如本章后文所述），使自动化能够被易于采纳；结果将更更容易识别跨组织和系统的政策差距。

    * 增加补偿性控制，例如基于分析的检测工具，这些工具可在流程或系统偏离策略时发出警报。

    * 通过使用与您的信息系统、信息技术和产品团队相同的术语来传达明确预期，加速政策的采用。将政策要求的解释权留给他人会导致采纳和实施该实践的延迟。

    * 扩展指标和衡量标准，突出可以通过技术投资解决的合规挑战。


    ### 量化成本——不，换个说法——量化价值


    安全和合规专业人员知道如何计算运营合规和保证职能的全成本。然而，我们不应止于此。将技术与合规指标以及报告仪表板策略相结合，提供了一个从业务价值和贡献来传递传统保证实践的机会。合规相关的指标展示了对要求和法规的遵守，涵盖了多个领域。例如与以下内容相关的指标：


    * 对政策和要求的遵循情况

    * 显示组织何时偏离合规的指标和指示

    * 与潜在罚款相关的成本


    向领导层展示价值的绩效衡量标准包括您的服务对降低企业风险的贡献。通过将运营成本（例如处理各种类型评估和保证审计的费用）整合到技术路线图、当前合规态势和风险降低指标中，为领导者建立可见性。


    以下是几个具体的例子：


    * 开发一个仪表板，跟踪系统生命周期升级或退役项目与遗留合规风险（如安全暴露、监管罚款和合规相关发现）减少之间的关系。

    * 计算当连接的战略供应商和合作伙伴承担网络责任保险时，风险转移的增加。


    运营指标是合规负责人转型绩效和展示价值的另一个领域。以下是供您的组织审查的几个问题：


    * 一项评估是否需要两或三名安全和合规专业人员完成？例如，是否需要一名高级安全工程师完成评估的技术部分，而 GRC 专业人员完成政策审查？

    * 您的组织是如何结构的？您是否有一个过度设计的服务模型，导致任务在多次往返？

    * 您的团队处理多少项或多少类型的评估？

    * 您是否正在利用培训来增加跨团队技能？

    * 您的组织每年处理多少项评估？

    * 您是否衡量单次评估的成本？


    根据我与独立审计/证明解决方案公司的合作经验，前者的成本在 `$5K` 到 `$15K` 之间，后者在 `$150K` 到 `$350K+` 之间。内部合规部门完成一项评估的平均成本在
    `$450` 到 `$1,000` 之间，取决于复杂性。专业人员的平均时薪和完成评估所需的小时增加了运营成本。将这些数字纳入您团队的价值中。


    传统的任务分段方法——完成安全评估、第三方风险评估、合同审查和安全保证审查的审查——需要具有相似技能的资源。完成任务的增加增加了运营成本。


    我从经验中分享这些想法。曾几何时，我审查预算并注意到评估风险所需的资源数量。我问自己，为什么我们两两或三名资源来确定风险？如果我们在代码层面进行防御，我们也应该在相同的层面上进行风险评估。就在那个时候，我意识到如果整个组织的技术技能能够平衡，我就可以运营一个更有效、更具效益的团队。结果是信息治理委员会运营中的重复减少，创造了价值并节省了成本。


    这是一个流程改进的示例，可以识别运营效率的提高以及为组织增加价值的潜在领域。


    对无缝技术的依赖增加，以及通过数字解决方案确保合规的方法，意味着架构、工程、IT 和合规负责人必须将他们的路线图与这些合规指标对齐。


    这种对齐有助于在组织变得不合规之前更早地发现问题。这些行动增加了价值，并减少了与企业合规风险相关的总成本。


    # 10


    ## 不要让网络供应链安全成为你的薄弱环节


    ### TERRY ROBERTS


    在数字时代，由于大量使用信息和运营技术供应商及服务承包商，供应链风险极大地扩大了所有企业和组织的威胁格局，使得保护其声誉和收入变得复杂得多。今天，我们称之为网络供应链风险管理，或
    C-SCRM——这是一门迫切需要的学科、实践和知识体系，在我们互联的世界中正受到日益增长关注和重视。即使对于顶尖的安全和风险经理来说，C-SCRM 也具有挑战性，更不用说执行团队和董事会了。


    ## C-SCRM 包含什么？


