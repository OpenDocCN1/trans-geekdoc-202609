  trans: '


    *   我的程序对公司的文化、声誉和成本有何影响？他们为什么要关注这些？他们能如何提供帮助？

    *   是否存在优缺点？我能否以一种能让董事会产生共鸣的方式列出它们？

    *   我的信息是否清晰简洁？


    ## 保持直接、干练和简单


    这又不是格底斯堡演说，也不是研究生水平的课程。我最喜欢的引言之一来自马克·吐温（Mark Twain）：“我没有时间写一封短信，所以我只好写了一封长信。”你与董事会相处的时间通常非常短。编写清晰且干练的信息至关重要。我见过许多为高级别董事会准备的五十页简报。书面报告之所以要有执行摘要是有原因的；那是大多数高层人员只会读那部分！你的董事会简报就应该是那个执行摘要。


    立即说明你简报的目的。不要让他们猜。“如果我们不提高公司的安全态势，声誉将面临风险。我们的竞争对手已经投入了先进的安全设备。我们的客户非常脆弱。如果他们的数据被泄露，我们可能承担法律责任。今天数据泄露的平均成本是
    $$$。我们修复计划的成本是 $$。这些是我们的步骤；这是我们的时间表。”给他们高层次、有影响力且数据驱动的信息，他们现在可以用这些信息做出风险决策。


    不要假设他们了解你的领域，也不要试图教他们不需要知道的细节。你会在过程中让他们失去兴趣，而他们也会错失你的信息。我永远记得我必须准备的最具挑战性的提案之一。


    我当时在五角楼担任网络安全职位。我们有机会为一个想要启动的计划获得资金。`CIO` 叫我进他的办公室。我穿过走廊，他坐在会议桌对面面对着我。他解释说，我们有机会获得国防长的支持。“你有一段话的时间来解释这个计划、他为什么要关注，以及费用是多少，而且你不能使用任何一个技术术语，”他说。他让我口述，由他来记录。如果我用技术性的方式解释任何内容——比如像“企业级”、“互操作性”、“自动化”、“高级分析”之类的词汇——他就会用口头警告我。这确实是一个挑战，我今天想起来还会笑。我们成功了，但那并不是一个简单的段落，我收到口头警告的频率比我象中要高。


    我发现类比是极其用的。最近，董事会成员问我，为什么公司缓解所有关键漏洞对他们很重要。为什么 `80%` 不够好呢？我用了一个非常简单的房屋窗户和门的类比。如果你在所有的窗户和门上安装了最先进的锁和监控设备，唯独留下了后门且完全没有任何保护，那么你对保护你的房子并没有做什么。再加上，坏人在到达之前可以扫描你的房屋，确定你所有的窗户和门上都有哪些保护。你这只是给那个坏人提供了一张不被察觉进入你家的路线图。董事会成员立刻就明白了。我不需要解释如果他们不升级特定的
    `OS` 或修补特定的漏洞，坏人会做什么。这并不重要。重要的是坏人可以进进来，而 `80%` 的缓解是不够的。


    ## 直接向董事会汇报：终极案例研究


    在 9/11 之后之后，我被要求建立第一个国防部/情报界（IC）联合组织——统一跨域管理办公室（`UCDMO`）。`UCDMO` 的建立是为了解决整个国防部（包括我们海外的部队和情报部门）之间的跨域信息共享问题。当时既没有整体战略，也没有人领导。我使用了“儿童足球”的类比，每个人都向球跑（是的，我向董事会用了这个类比）。这引起了非常好的共鸣，因为我可以提供一个又一个重复、缺乏战略以及机构未履行职责的例子。


    `UCDMO` 是一个直接向董事会汇报的“自愿”组织。董事会由国家情报局 `CIO` 和国防部 `CIO` 共同主持。每个机构和军种都有一位三星将军担任董事成员。我不仅需要不断说服董事成员为我的组织提供人员，还需要不断提供成功的证据，以确保组织的持续资金。董事会每季度举行一次为期两小时的状态报告会议，每年举行一次评估并决定办公室的延续。我知道不能依靠这些会议来传达我们正在的工作以及我们需要的支持。


    ## 一对一会议的力量


    为了取得成功，我每周或每两周与每位董事成员进行一对一会。我特意了解他们，理解他们的角色和特定的兴趣。我在不到一年内将这个组织从两个人扩大到五十人，并大幅增加了我们的预算。当出现棘手问题时——我们有很多这类问题——我知道该游说谁，谁会提供建议以确保我彻底研究该问题，以及谁会在董事会期间支持我。虽然这些人通常随问题改变而改变，但我无法过度强调一位董事成员能在多大程度上影响董事会的立场，甚至缓解其他董事成员的担忧。我很少对任何成员的立场感到惊讶，这让我能够提前为该立场做好准备。


    在一对一会议期间，有时我的三十分钟时段会被缩减到五分钟。有时这只是走过走廊参加他们的下一场会议。我很快学会了，我的电梯演讲需要包含整个故事。


    '
