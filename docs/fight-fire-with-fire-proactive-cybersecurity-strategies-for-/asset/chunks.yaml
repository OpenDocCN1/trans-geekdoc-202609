- raw: "Earlier in this chapter, I acknowledged that our field has not always kept\
    \ pace with the rapid acceleration of technology, advanced computing, and the\
    \ expanding threat landscape. Staying up to date is even more important as we\
    \ see increased attacks where threat actors are leveraging poor code, misconfiguration,\
    \ or vulnerabilities not identified during patching, change control, or periodic\
    \ reviews. The Information Governance Council and the governance lead have a more\
    \ prominent role now in addressing these concerns in partnership with the head\
    \ of architecture and cyber defense. Statistics show that revised proactive technology-informed\
    \ policies simplify compliant practices, address gaps, and accelerate fast adoption.\n\
    \n## Delivering Value in a Changing Environment\n\nGlobal data privacy regulations\
    \ continue to adjust, which is partly a reflection of changes across the threat\
    \ landscape. It also reflects reduced tolerance for errors or mistakes that originate\
    \ from basic noncompliant practices. An example is seen in recent regulations\
    \ passed in California. Ten months after the California Consumer Privacy Act\n\
    \nThe new regulations along with economic pressures generated by a prolonged pandemic\
    \ provide a unique opportunity for governance, risk, and compliance leaders in\
    \ any organization to adjust strategy and deliver more value.\n\nIn times like\
    \ these, management needs revised policy and clear directives that ensure compliance\
    \ while enabling continued innovation. Even slight adjustments in strategy create\
    \ additional value.\n\nHere are a few concrete examples:\n\n*   Increase and enable\
    \ automation. Put in place industry frameworks (as described later in this chapter)\
    \ in a manner that enables automation to be easily adopted; results make it easier\
    \ to identify policy gaps across the organization and systems.\n\n*   Add compensating\
    \ controls such as analytic-based detection tools designed to alert when processes\
    \ or systems deviate from policy.\n\n*   Accelerate the adoption of policy by\
    \ communicating clear expectations using the same terms your information systems,\
    \ information technology, and product teams use. Leaving the interpretation of\
    \ policy requirements to others creates a delay in adopting and implementing the\
    \ practice.\n\n*   Expand metrics and measures to highlight compliance challenges\
    \ that could be addressed through technology investments.\n\n### Quantify Costs—No,\
    \ Strike That—Quantify Value\n\nSecurity and compliance professionals know how\
    \ to calculate the fully loaded expense of operating a compliance and assurance\
    \ function. However, we should not stop there. Aligning technology and compliance\
    \ metrics and reporting dashboard strategies create an opportunity to convey traditional\
    \ assurance practices in terms of business value and contribution. Compliance-related\
    \ metrics, demonstrating adherence to requirements and regulations, encompass\
    \ several areas. Examples include metrics associated with:\n\n*   Adherence to\
    \ policies and requirements\n\n*   Metrics and indicators that show where the\
    \ organization is falling out of compliance\n\n*   Costs associated with potential\
    \ fines\n\nPerformance measures that demonstrate value to leadership include your\
    \ service's contribution to reducing enterprise risks. Create visibility for leaders\
    \ by integrating operating costs (such as the expense to process the various types\
    \ of assessments and assurance audits) into the technology road map, current compliance\
    \ posture, and risk reduction metrics.\n\nHere are a few concrete examples:\n\n\
    *   Develop a dashboard to track the relationship between system life cycle upgrade\
    \ or decommission projects and the reduction of residual compliance risks (such\
    \ as security exposure, regulatory fines, and compliance-related findings).\n\n\
    *   Calculate the increased transference of risk as connected strategic vendors\
    \ and partners carry cyber liability coverage.\n\nOperational metrics are another\
    \ area where the compliance lead can transform performance and demonstrate value.\
    \ Here are a few questions to review for your organization:\n\n*   Does an assessment\
    \ require two or three security and compliance professionals to complete? For\
    \ example, is a senior security engineer required to complete the technical portion\
    \ of an assessment while a GRC professional completes the policy review?\n\n*\
    \   How is your organization structured? Do you have an overdesigned service model\
    \ where tasks pass multiple times back and forth between team members?\n\n*  \
    \ How many assessment forms or types does your team process?\n\n*   Are you leveraging\
    \ training designed to increase cross-team technical and policy skills?\n\n* \
    \  Is your team training goal designed to reduce the number of resources required\
    \ to complete security assessments?\n\n*   How many assessments is your organization\
    \ processing per year? Do you annually break down the cost per assessment? Do\
    \ you measure how many times an assessment requires multiple resources to process?\n\
    \nIn my experience of working with firms that provide outsourced security assessments\
    \ and independent third-party audit/attestation solutions, costs range from $5K\
    \ to $15K for the former and $150K to $350K+ for the latter. The average cost\
    \ to complete an assessment by an internal compliance department ranges from $450\
    \ to $1,000 per assessment depending upon complexity. Combined average hourly\
    \ wages of professionals and the number of hours needed to complete an assessment\
    \ further increase operating costs. Incorporate these numbers into your team's\
    \ value determination.\n\nThe traditional approach of segmenting tasks—the review\
    \ for completing technical risk assessments, third-party/vendor risk assessments,\
    \ contract reviews, and security assurance reviews—requires resources with similar\
    \ skill sets. Completion of these tasks increases your operating costs.\n\nI share\
