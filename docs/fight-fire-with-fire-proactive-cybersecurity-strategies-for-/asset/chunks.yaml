    \n# 2  \n\nCommunicating with the Board\n\n***MARIANNE BAILEY***\n\nAchieving\
    \ effective communication can be one of the most difficult tasks. People face\
    \ this challenge as they talk past each other often in everyday lives because\
    \ one party assumes the other has the same background, biases, and interests.\
    \ This problem is no different when communicating with boards of directors.\n\n\
    In order to overcome this communication gap, it is critical to understand the\
    \ mission of the board, to speak in their language, and to clearly articulate\
    \ why they should care about whatever it is you are telling them. The communication\
    \ gap is significant because leaders and employees operate in a more tactical\
    \ and— in the case of cybersecurity—a more technical environment all day, every\
    \ day.\n\nBoard members operate in a more strategic and a much broader environment.\
    \ I can't even count the times I've heard technical people venting their frustration\
    \ after a board briefing. “They don't understand our business,” they say. “We\
    \ need more technical board members. They need to spend more time understanding\
    \ what we do.”\n\nAll the blame is put on the board. Meanwhile the board members\
    \ see the employee as unprepared, unable to communicate the issues in a strategic\
    \ manner, and unable to help the board members see the impact. At the end of the\
    \ day, the company is less effective because the employees cannot relay the concerns\
    \ to the board and the board members do not understand the issues and thus cannot\
    \ advise or take action.\n\n## The Board\n\nThe function of the board—and this\
    \ is true for many senior committees—is to evaluate the overall strategy and the\
    \ organization's progression toward that strategy. Their agendas are packed and\
    \ diverse. The board will often be comprised of the chairman of the board, the\
    \ CEO, the CFO, general counsel, and external experts. Topics range from the organization's\
    \ financials, investments, and overall business strategy to HR issues (leadership,\
    \ talent challenges, diversity numbers) and legal and regulatory issues. Chartered\
    \ with overseeing everything from financial success, prospective investments,\
    \ and culture to staffing issues, boards are not often given abundant time to\
    \ focus on one topic. Communication to the board must be presented in a clear,\
    \ crisp, and easily understood format.\n\n## Speak Their Language\n\nThe first\
    \ significant challenge is speaking the same language. Technical people, including\
    \ those in cybersecurity, speak their own unique language. They have a very difficult\
    \ time discussing their programs at a high level with context that boards and\
    \ senior leaders understand.\n\nAs a leader of many technology organizations,\
    \ I experienced this challenge from my first leadership position all the way up\
    \ to my positions as the cybersecurity lead at NSA and the principal director/deputy\
    \ CIO for cybersecurity in the Pentagon. Whether technical staff or leaders were\
    \ briefing me or whether I was preparing staff to brief top boards and committees\
    \ in the Pentagon, Congress, or the White House, I would spend significant time\
    \ pulling pertinent information from a fifty-page briefing. I would rarely see\
    \ a clear and concise presentation. Individuals include far too much information\
    \ and do not articulate their message. I would ask them, “What are you trying\
    \ to tell me, or your senior audience? What do you want from me, or them?” It\
    \ is very important to understand your audience and tailor your message to that\
    \ audience in a way that resonates with their responsibilities.\n\n## Preparing\
    \ for the Board Meeting\n\nDo your homework. Be able to answer these questions:\n\
    \n*   Who are the board members? What are their backgrounds? Are there members\
    \ of the board who will be allies for my program? Is there an opportunity to share\
    \ information with them ahead of the board meeting? If so, take every opportunity\
    \ to meet one-on-one with them to explain your program and your issues. You will\
    \ find that even one or two board members who become advocates will be extremely\
    \ valuable.\n\n*   What are the company's big strategic pushes?\n\n*   Is my position\
    \ in line with my leadership? You never want to oppose your leadership in a board\
    \ meeting. Understand that your leaders have many issues they are working on and\
    \ yours may not currently be the top priority. It is not worth damaging the trust\
    \ relationship, and it demonstrates a lack of understanding of their position."
