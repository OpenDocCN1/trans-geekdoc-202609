    \ was co-chaired by the Director of National Intelligence CIO and the Department\
    \ of Defense CIO. Each agency and service had a three-star general as a board\
    \ member. Not only did I constantly have to convince the individual board members\
    \ to staff my organization, but I also had to continuously provide evidence of\
    \ success and therefore of value for the organization to continue to be funded.\
    \ The board met every quarter for a two-hour status report meeting and annually\
    \ to appraise the success and decide on the continuation of the office. I knew\
    \ I could not rely on these meetings alone to communicate the work we were doing\
    \ and the support we needed.\n\n## The Power of One-on-One Meetings\n\nIn order\
    \ to be successful, I met with every board member individually, weekly or biweekly.\
    \ I made it a point to get to know them and to understand their role and their\
    \ specific interest. I was able to grow this organization from two people to fifty\
    \ in less than a year and expand our budget significantly. When there was a tough\
    \ issue—and we had plenty of them—I knew who to lobby, who would provide advice\
    \ to make sure I thoroughly researched the issue, and who would support me at\
    \ the board meeting. While that individual often changed from issue to issue,\
    \ I cannot overemphasize how much a fellow board member can sway the position\
    \ of the board or even calm concerns of other board members. I rarely was surprised\
    \ by any member's position, and that enabled me to prepare for that position ahead\
    \ of time.\n\nDuring my one-on-one meetings, there were times my thirty-minute\
    \ slot was cut to five. Sometimes it would be a walk down the hall to their next\
    \ meeting. I learned very quickly that my communication, my elevator pitch, or\
    \ my first slide needed to be the whole story. I learned the value of being clear,\
    \ concise, and direct. What did I need from them? Why should they care? How is\
    \ my proposal going to solve the problem? What are the risks? Why is my approach\
    \ the best solution? Why do I need additional resources, and when do I need them?\n\
    \nA few of the board members were technologists, but most of them were not. Explaining\
    \ a technical issue in their language became critical. This included topics like\
    \ timelines, costs, risks, and impact to the broader organization. In my case,\
    \ that meant the entire Department of Defense, the intelligence community, and\
    \ most important the military and civilians who needed the information wherever\
    \ they were in the world and on whatever network they operated. Speak to the board\
    \ in company mission and business terms and explain how your solution advances\
    \ the business.\n\n## Get to Know Your Board\n\nThe time you spend understanding\
    \ the individuals who comprise your board will be time very well spent. If you\
    \ familiarize yourself with their backgrounds and why they were selected as a\
    \ board member, you will develop a presentation that resonates with them. When\
    \ they ask questions, you'll better understand their concerns based on their focus\
    \ and background. Be clear and concise; know the information, but don't present\
    \ every technical detail. Speak their language and state up front why your ask\
    \ is important to the business. Do your homework by socializing your presentation\
    \ internally, ensuring you have leadership support, as well as externally if you\
    \ can obtain individual meetings with board members. If you build knowledgeable\
    \ allies and tailor your conversation to the interests and priorities of your\
    \ board, chances of a successful outcome will greatly improve.\n\n# 3  \n\nBuilding\
    \ a Culture of Security\n\n***SUSAN KOSKI***"
