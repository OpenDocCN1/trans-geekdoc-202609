- raw: "As CISOs, we must become fluent in the language of the business. We must influence\
    \ others to change their mindsets, habits, and approaches to technology and behave\
    \ in ways that maintain security. We need a cultural shift that enables everyone\
    \ to adopt effective, ongoing processes to keep our organizations safe. Security\
    \ must be embedded into vendor selection, employee onboarding, and product development.\
    \ Security awareness training must be continuous to match the cadence of the threats\
    \ we face.\n\nWe need security leaders who understand the value of the latest\
    \ technology, but even more importantly who have the skills to develop relationships\
    \ that bring people together and the discipline to create repeatable processes.\n\
    \n## How Can We Be Effective CISOs?\n\nToday's security leaders face considerable\
    \ stress. The CISO role has a high turnover rate, with an average tenure of just\
    \ twenty-six months. Fundamental changes are needed to empower us to lead effectively,\
    \ attain a better work-life balance, and manage the inevitable stress of our roles.\
    \ The answer is not working longer hours; 95% of CISOs are working an average\
    \ of ten hours more a week than their contracts stipulate.\n\nWe need shortcuts\
    \ to success, like learning from mentors and peers. The challenge, of course,\
    \ is finding the time for that learning. That's why my colleagues and I wrote\
    \ this book: to share our knowledge and, more importantly, our experience, something\
    \ that you will not find in a textbook or on a certification exam. We have come\
    \ together to share our perspectives as security leaders from across industries\
    \ and sectors, offering our best thinking as well as sharing important lessons\
    \ learned. Harnessing this insight and utilizing the strategies in this book can\
    \ help leaders and organizations improve their culture and security posture.\n\
    \n## Who This Book Is For\n\nWith the ongoing evolution in security challenges\
    \ and the pressing need for a cultural shift, this book identifies steps that\
    \ we as leaders need to be thinking about. This book is for anyone working in\
    \ cybersecurity and IT leadership who seeks a better grasp of the continually\
    \ changing nature of security threats and who is interested in effective approaches\
    \ to address them.\n\nWe also hope this book will inspire a more diverse group\
    \ of people to consider a career in cybersecurity leadership. As we discuss in\
    \ [Chapter 5](#c05.xhtml), there are both a skills gap and a diversity gap to\
    \ fill in the world of cybersecurity.\n\nBy the time you finish this book, you\
    \ will be evolving into a next-generation CISO. You will better understand how\
    \ to adopt best practices and processes to encourage your people to make effective,\
    \ safe use of technology. You will know how to serve as a business strategist,\
    \ helping your organization reframe security as a business enabler. You will also\
    \ learn how to improve security 24/7, up and down your supply chain, from the\
    \ edge to the cloud, and from frontline workers up to your board. Finally, you\
    \ will gain strategies to attract and promote the next generation of diverse talent.\n\
    \nLet's get started.\n\n## Note\n\n1.  [1](#f07.xhtml#R_f07-note-0001).  [https://nominetcyber.com/nominet-ciso-stress-report-one-year-on/](https://nominetcyber.com/nominet-ciso-stress-report-one-year-on/)\n\
    \n# PART ONE  \n\nPeople\n\n ![](images/p01uf001.png)\n\nCybersecurity is no longer\
    \ only the domain of I.T. and security teams. From the loading dock to the C-suite,\
    \ everyone must be security minded.\n\nWithin your organization, a well-trained\
    \ staff can be your best line of cyber defense. But people can also be your worst\
    \ enemies. You can buy top-of-the-line security technology and implement best\
    \ practices, but if your people won’t follow good security practices and policies\
    \ or use that technology properly, your organization remains at risk. You must\
    \ also get buy-in from your board of directors to create a culture of security.\n\
    \n## How the CISO Role Is Evolving\n\nWhat’s the most important skill set for\
    \ being a CISO? Current knowledge of the latest threats? Deep understanding of\
    \ cybersecurity technology to mitigate security risks? Familiarity with the latest\
    \ tools, tactics, procedures, and activities of well-funded hacking collectives?\n\
    \nTech knowledge is not the most important characteristic of a CISO today.\n\n\
    Increasingly, CISOs are being elevated to the C-suite and becoming trusted business\
    \ advisors. This requires soft skills, with the ability to communicate in terms\
    \ that everyone understands. The CISO must be a business enabler and a strategic\
