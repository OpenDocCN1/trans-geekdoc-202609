- raw: 'Phishing emails can also be far more sophisticated. Phishers target their
    prey based on their role in an organization, using LinkedIn and other sources
    to find a hook into an individual’s interests and target those most likely to
    have access to the data and systems that the phishers want. They also target executives,
    in a practice known as “whaling,” given the type of information they have access
    to and the likelihood they are less technically savvy.


    A business email compromise (BEC) is a specific type of phishing attack that encourages
    employees to send money or data to a criminal posing as an executive or partner.
    Variations of the impersonation include the CEO asking Finance to wire money to
    a supplier right away, the CEO asking HR for all the W2s for the company, one
    firm asking another to change its wire transfer information, or a title company
    asking a property buyer to send a down payment. In some cases the threat actors
    have actually compromised the sender’s email, but in many others an email is spoofed
    by making hard-to-spot changes in an email address (such as replacing the number
    1 with a lowercase letter l) or saying the email is coming from a personal account.


    ### Ransomware


    Ransomware has dominated the cyberattack landscape for the past few years. Attacks
    on hospitals and first responders are particularly malicious, with the potential
    to impact patient health and safety. Of the more than 2,300 ransomware attacks
    in 2020 targeting educational, healthcare, and public sectors, 560 were aimed
    at the healthcare sector, according to Emsisoft’s latest State of Ransomware


    Criminals no longer seek minor ransoms from small, less sophisticated victims.
    Now they are getting big money from household names and major cities. Ransoms
    started in hundreds to thousands and finally have reached up to the millions.


    According to the Identity Theft Resource Center (ITRC), “The average ransomware
    payouts


    Threat actors—whether criminal or nation-state—are not only encrypting the data
    they ransom so their victims can’t use it, but are also threatening to release
    stolen data publicly as another means to try to extort the money. This “name and
    shame” strategy has become pervasive.


    This is just one way that ransomware actors have attempted to change the market
    dynamics. They realize that if there is confidence that paying a ransom will bring
    relief, they are more likely to get paid.


    Breached companies now sometimes alert customers by sending letters that tell
    them not to worry, that the ransom was paid and their data is safe! This is a
    major change. Even the FBI has grown a bit more flexible about ransom payments,


    Ransomware exploits known vulnerabilities most of the time. While we have long
    talked about advanced persistent threats, “adequate persistent threats” continue
    to work as most attacks still leverage known, patchable vulnerabilities. But at
    the same time, as the threat actors make more money, they grow more sophisticated,
    mimicking the techniques of nation-state attackers.


    As a result, human-operated ransomware attacks are more like advanced persistent
    threats. Once the ransomware is in a system connected to a network, it lurks,
    spreading laterally to other systems and escalating privileges while the criminal
    identifies the “crown jewels” of the victim, their most prized information resource.
    Attackers have been known to look for the victim’s cyber insurance policy so they
    can set the ransom price based on deductibles and coverage. Because ransomware
    has spread across the network and attackers have done reconnaissance, when they
    are ready to strike, the attackers encrypt the network rapidly.


    ## The Insider Threat


    In addition to a long list of outside actors, we are told we must beware the insider
    threat. But what does that really mean? We traditionally think of a disgruntled
    employee seeking revenge (think *Office Space*


    Accidental insiders are those employees who unwittingly cause harm or unauthorized
    access by doing things like clicking on malicious links, not following policies
    and procedures, or being careless.


    One type of accidental insider is the employee who is legitimately trying to do
    their job but who doesn’t want to be slowed down by complicated processes and
    technologies that impede their progress. They seek workarounds to meet their individual
    performance objectives by subverting security controls and in some cases creating
    a shadow IT environment.


    Whether employees buy their own equipment or use a personal credit card to create
    cloud infrastructure, these rogue environments can compromise data, credentials,
    and broader environments. Cloud misconfigurations can easily happen in even the
    best of circumstances, as you may recall from the well-publicized Capital One
    breach.


    Despite the notoriety of that incident, more recently, a misconfigured cloud storage
    bucket exposed the personal details of hundreds of social media influencers.


    As companies focus on customer experience, security often takes a backseat to
    cool and efficient. There is constant tension in IT to meet business requirements
    and reduce risk. Security does not always win. In addition, cloud and SaaS solutions
    are rapidly evolving, and many people do not know how to configure them properly,
    inadvertently exposing data. There are simply not enough skilled personnel with
    knowledge of these tools and how to integrate them into a larger environment.


    Sometimes overworked IT staff take shortcuts: not patching, allowing weak or default
    passwords, and so on. Again, employee experience and system performance sometimes
    takes priority over reducing security risk. With increased work from home, how
    many employees have kids using work computers for school and entertainment? How
    many employees have family members and roommates with access to corporate networks,
    either knowingly or unknowingly? How many overseas contractors had to switch to
    work from home? The attack surface and potential openings for attackers has grown
    with the critical need to maintain business operations in a rapidly changing environment.
    Security is part of a number of tradeoffs in a rapidly changing world.


    Of course, security can also add cost that an organization may or may not be willing
    to pay. Over a decade ago, a colleague and I traveled on behalf of the Department
    of Homeland Security to an oil company in Houston. I sat in their office, stunned
    that they didn’t feel concern or a sense of urgency when we—two senior leaders—traveled
    to their headquarters to tell them that a foreign government had infiltrated their
    network. They couldn’t see why that was a problem warranting their activity or
    engagement; their defenses were poor. Their CIO and CISO hadn’t invested in maintaining
    any logs, so forensics would have been difficult even if they had been interested.
    While not malicious, their decisions not to invest in security or even take a
    breach seriously made the IT and security leaders themselves a threat to their
    organization.


    There are, of course, malicious insiders: employees with a deliberate intent to
    steal information or cause disruption. Usually these insiders seek financial gain,
    but they can also be disgruntled employees. This is why many companies carefully
    track employee activity and access when considering layoffs and even staff reductions
    due to COVID-19; desperate people can do desperate things. Other malicious insiders
    might be unhappy with their job, co-workers, pay, boss, or company direction.
    They can act independently or as an agent for another entity. Had this employee
    been less ethical or less loyal, he could have easily enabled a major breach.


    In some cases, hospitals and health systems have been victims of malicious insiders
    who install Ryuk ransomware.


    ### Combating Insider Threats


    What makes insider threats so hard to combat? Well, it’s complicated.'
