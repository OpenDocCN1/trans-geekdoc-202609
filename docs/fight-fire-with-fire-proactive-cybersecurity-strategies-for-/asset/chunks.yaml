    组织流程需要改变，以将安全开发作为优先事项。整体开发和发布计划必须包含确保安全的任务，并为补丁、修复和代码审查留出时间。客户期望代码的安全，而你需要建立相应的流程，使其成为产品管理的不可或缺的一部分。


    第 8 章 提供了创建有效的安全开发计划的策略。


    ## 合规


    从合规性的角度来看，组织必须应对不断变化的隐私和安全法规及标准构成的“字母汤”。欧盟的 `GDPR` 和加利福尼亚州的 `CCPA` 等法规将隐私问题推向了前沿。任何组织面临的各种法规在很大程度上取决于行业，其中某些行业受到高度监管。例如，医疗保健机构受
    `HIPAA` 的制约，而任何处理信用卡或银行卡交易的组织必须实施 `PCI-DSS`。


    在安全方面，组织可以选择采用来自 `NIST`、`ISO` 或其他的框架。最终，你需要一个框架来衡量并加强你组织的安全态势。框架为基准测试你的安全控制提供了路线图。


    第 9 章 涵盖了合规流程的细节，以及在这个关键领域如何与组织的其他部分协作。


    ## 供应链风险


    除了你自己的组织和员工之外，你还需要从端到端保护你整个企业的流程，这包括你的供应链。毕竟，一个人承担的风险就是所有人共同承担的风险。组织往往受到其供应链多个层级行动的影响。


    过去，组织为某种服务或产品选择供应商——无论是新软件、营销工具、暖通空调（HVAC）系统还是保洁服务。然后，他们只是简单地将产品或服务引入他们的网络，而且往往没有分析潜在的风险。从安全的角度来看，这种方法是不可行的。如果你使用
    `SaaS`，它是由另一公司运行的。如果该软件没有得到妥善的安全保护，你就让你的组织面临风险。如果第三方软件、服务或产品存在漏洞，你只是为自己的网络增加了一个不可预见的（且更难定位的）漏洞。例如，2013
    年的 Target 黑客攻击。


    供应链中任何一点的泄露都可能损害你的安全。安全领导者必须做出反映这一现实的审慎决策。对潜在供应商和供应链伙伴进行安全缺陷和其他问题的审查至关重要。你还必须意识到供应链沿单点故障的风险。底线是：你需要理解并适当审查你的整个供应链。


    第 10 章 涵盖了供应链风险。


    安全不是绝对的，因为没有人拥有无限的资金或资源来进行投资。鉴于你无法将风险降为零，建立有效流程的最佳指导需要衡量你组织的风险容忍度，如下文所述。


    ## 备注


    1. 1. [`krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/`](https://krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/)


    # 6 有效的网络风险管理需要广泛协作


    ***SUZANNE HARTIN AND MARIA S. THOMPSON***


    为什么网络风险管理值得广泛协作？为什么网络风险管理值得在书中占据一章？（注：原文此处存在大量重复句子，翻译已按要求去重）。


    ## 理解你组织的风险偏好


    （注：此处原文同样存在大量重复性问题）。

