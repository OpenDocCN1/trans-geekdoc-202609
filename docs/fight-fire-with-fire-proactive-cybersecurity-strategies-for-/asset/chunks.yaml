    I found out about a security engineer role when a large health insurer was looking
    to build out their consumer internet presence. A friend said I should meet the
    CISO and apply.


    Eight years later, I left that company to take on the security leader role for
    the world''s largest corporate treasury department in a Fortune 100 company.


    Another eight years later (do you see a pattern to my tenure?), a recruiter from
    a large industrial gas company was looking for their first CISO after elevating
