- raw: 'The home environment also had to be updated as an extension of the office.
    For those working on sensitive topics, smart speakers were moved out of the home
    office as a precaution. Home routers became managed by end-user computing groups
    who in an office environment would be responsible only for company-owned technology.
    This required a huge dissemination of knowledge about information security practices
    to all frontline teams.


    ## How Security Products Should Adapt


    In the meantime, your people are clamoring for more technology and more applications
    so they can be more effective in their roles. But many vendors are not embedding
    security into their products—leaving it up to clients to figure out security on
    their own. For example, how do you integrate Box or Microsoft 365 into a software-defined
    wide area network (SD-WAN)? In many cases, the desire for speed and convenience
    is allowed to supersede security.


    To protect their environments using legacy tools, CISOs would have to apply controls
    at every layer that comes to mind: the physical layer, the data link layer, the
    transport layer, the session layer, and the network layer. That approach takes
    a lot of time, is not agile, does not allow people to move freely among cloud
    environments, does not allow people to use a temporary virtual environment, and
    stifles innovation. If you overlook or skip even one layer or step, threat actors
    can find a way to infiltrate and get to the data they are after.


    One clear solution is the principle of least access, applied to human users as
    well as to service accounts and APIs. Dole out privileged accounts sparingly and
    give users, service accounts, and APIs access only to what they need to do their
    jobs or to perform the needed service.


    Similarly, when you allow users inside your network perimeter, allow those users
    access only to your VLAN and no more.


    In addition, the current network architecture is not serving us well:


    *   Instead of people connecting through a private network that routes traffic
    to and from the internet, a better architecture is one with points of presence
    distributed around the world. With that architecture, people, wherever they are,
    can connect to those points of presence, identify themselves, and then receive—with
    technology that''s as close as possible to those points of presence—the security
    services they need. The entire network architecture must change to a distributed
    form.


    *   Instead of a perimeter-based system where data is easily visible and unprotected
    inside the castle, today''s security model encrypts that data and protects it
    within individual, often application-based repositories. Instead of a castle and
    moat, envision armed knights within locked rooms inside that castle.


    *   Instead of connecting to a network or zone, workers connect to a specific
    application for a specific purpose—a segment of a network or zone. The necessary
    network is created at the time of connection. That network understands who each
    individual is, what they want to do, what they have access rights and permission
    to do, and then creates one path to get there.


    In fact, you might have multiple paths created every session. For example, if
    a user connects to a point of presence that also has attached security services,
    there might be one connection that goes over the public internet if the user is
    accessing their personal Gmail account, and that connection might have very little
    security associated with it. Another connection might be to a mission-critical
    application and thus would be routed over a network that has a much higher SLA
    (service-level agreement), much stronger encryption, and a variety of security
    services such as data loss prevention and user behavior analytics associated with
    it. Another connection might be to a third-party SaaS application in which the
    use of the application is being monitored by a CASB (cloud access security broker)
    so the user''s behavior is tracked. SD-WAN technologies are also important.


    ## Future-Proofing: How CISOs Should Adapt


    You don''t know what the next crisis will be, but new disasters are on the horizon.
    The biggest lessons for CISOs from the pandemic include:


    *   Test and test again. Spend time testing your critical infrastructure on threats,
    disaster recovery, and business continuity in various scenarios, including scenarios
    that at first may seem unlikely.


    *   Know your unknowns. Seek out things you don''t know about your environment,
    the unknown unknowns. Find them before they foul you up.


    *   Identify your critical assets, including hardware, software, data, and especially
    critical personnel. Develop plans to mitigate and manage problems with hardware,
    software, and data. Make contingency and succession plans for essential personnel.


    *   Think strategy and security. Think about your work strategy as a company and
    how security will integrate into that strategy, including remote work locations,
    software for teams, communication, and collaboration in the next crisis, whatever
    that crisis may be.


    *   Hire or consult with experts as needed to improve security, safeguard employees''
    health, and more. Keep in mind that mental health matters.


    ## Protecting Data: What, Where, Who, and How


    Eliminating unknown unknowns is critical. To successfully defend your data and
    your organization against these threats, CISOs must adopt today''s mindset of
    zero trust and assume that threats, from both employees and outsiders, are already
    inside the network.


    Protecting data is paramount. But first, CISOs must know what data they have and
    which data needs to be protected.


    But not all data needs equal protection. CISOs also must adopt today''s tools
    and techniques to tag and protect data.


    Take the following steps to protect your data—no matter where it lives—and establish
    security-aware data routing:


    *   Begin by identifying and tagging your data based on the level of security
    required: public, nonpublic, proprietary/IP, or confidential/governed by privacy
    regulations. Pay particular attention to the most valuable targets in your asset
    inventory.


    *   Identify where the data lives: cloud, multi-cloud, and/or on-premises servers.


    *   Establish and limit who has access to each level of data; for example, only
    the HR team needs to know employees'' private data.


    *   Set boundaries on behavior; for example, by limiting employees'' access to
    nonpublic organization data if they are on public Wi-Fi or by defining acceptable
    role-based behavior. Limit behavior/data access that is not within norms.


    Now that you''ve identified, tagged, and established proper routing for your data,
    encrypt it end-to-end. Congratulations: at that point, your data is no longer
    an unknown unknown.


    ## Steps to Security-Driven Networking


    As you begin the transition to security-driven networking, build support from
    corporately funded decision-makers by generating metrics that show security events
    and their root causes, as well as security events that were avoided and why.


    Here are steps to take, depending on the security level you want to attain:


    Basic:


    *   Take stock of what you have.


    *   Even though a perimeter-based system is not effective, you still must define
    and understand your perimeter.


    *   Define where your organization''s data lives and where its data goes.


    *   Classify and tag your data based on how securely the information needs to
    be protected.


    *   Identify all of your cloud environments, what data resides in each, who can
    access each cloud, and for what purpose.


    *   Implement specific strategies to fight phishing and malware.


    *   Establish a core inspection point for all data.


    *   Establish a budget for cyber investment.


    Better:


    *   Add more context and layers to that core inspection point.


    *   Bring in more monitoring.


    *   Adopt the principle of least access.


    *   Add intelligent technologies that integrate security event management.


    *   Establish breach protection.'
