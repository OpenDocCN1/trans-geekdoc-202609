    but not every `CIO` is a strong leader. If a `CISO` reports to a `CIO` who is
    not a strong leader, the `CIO` may look for an excuse to replace the `CISO`. If
    you see this dynamic, it could be time to look for another job or at least consider
    ways to strengthen your partnership with the `CIO` gradually.

    '
  trans: '

    大学毕业后，我在各种 IT 岗位工作了十年——包括管理数据库、提供终端用户服务、拉网线、升级和重装 PC 以及编写简单的脚本——之后，我才开始了我的第一份信息安全工作。


    当一家大型医疗保险公司寻求建立其消费者互联网业务平台时，我发现了安全工程师这个职位。一位朋友建议我应该去见见 `CISO` 并提交申请。


    八年后，我离开了那家公司，在一家财富世界 100 强企业中全球最大的企业财资部门担任安全负责人。


    又过了八年后（你发现我的任职期有什么规律规律吗？），来自一家大型工业气体公司的招聘人员在公司内部提升了该职位后，正在寻找他们的第一位 `CISO`。在与另一家大型工业气体公司合并之前，我已经在该公司工作了六年。


    好了，关于我的职业道路就说得够了——我们来谈谈 CISO 是做什么的。


    近四分之一的 CISO 来自 IT 背景，其中 56% 拥有科学学士学位。在获得研究生学位的人中，18% 学习过 `MBA`。受访的顶尖 CISO 都认为，最关键的两项技能是信息安全和领导力。这
    65 位（仅占 13%！）女性 CISO 的背景。


    ## CISO 的职责


    虽然许多人从 IT 进入信息安全领域，但也有人来自审计、法律、风险、工程或业务职能。每个领域都为风险图景带来了宝贵的视角。无论你来自这些领域的哪一个，只要你不是完全根据自己的经验做决策，你就能对优先考虑事项提供更全面的视角。按照刻板印象，审计背景的人侧重于先前的审计发现和合规性，而业务职能部门可能从业务推动者或成本规避的角度来看待安全性。在制定安全风险计划时，所有这些观点都值得考虑。


    人们预期 CISO 及其领导团队拥有广泛的 IT 经验，以便理解并与 IT 员工交流术语，并做出明智决策。仅拥有深厚的信息安全知识不足以成为一名 `CISO`。强有领导能力和沟通能力更具价值。你必须理解组织的愿景和战略，并创建一个与业务战略对齐的安全风险计划。你被要求采取适当措施，根据系统数据的类型和暴露程度，确保信息资产和技术得到适当保护。在创建安全计划时，韧性至关重要，因为事件不可避免会发生并影响业务。成功的领导者帮助其业务在有限的业务影响下恢复。


    ## CISO 类型


    几天前我正在和几位 CISO 同事发短信，我们开始了一个视频通话，这种场景在 2020 年疫情期间再熟悉不过了。我们在谈论事实：尽管我们领域有很多不同性格的人，但他们都能取得成功。


    根据 [SecurityRoundtable.org](http://securityroundtable.org)，CISO 倾向于分为三类或原型：


    *   技术专家转型的高管

    *   关注企业安全风险的思考者

    *   “连接点”型领导者


    那么哪一种才是“正确”的类型呢？实际上，你是一个技术专家、关注风险的思考者，还是一个对政治和威胁敏锐的“连接点”型领导者，这并不重要。特定类型与组织的契合程度决定了公司、安全组织以及延伸出来的
    `CISO` 是否成功。每种类型都有其自己的优势和方法。


    技术专家转型的高管倾向于与 `CIO` 合作或为其工作，正如今天超过一半的 CISO 都是如此。技术专家的优势在于能够理解技术以及技术如何最好地帮助降低风险。技术专家转型的高管在与业务负责人合作阐述风险时，需要拓宽方法并看向技术之外。


    第二种类型是关注风险的思考者，他们将信息安全与业务战略相结合。这种领导者理解大局、业务及其风险。由于对业务和风险的关注，这些领导者越来越多地向首席风险官 (`CRO`)
    汇报。根据咨询公司 Korn Ferry 的说法，由于监管要求的增加，这种转变在金融服务业常见。


    最后一种类型通常来自政府背景，由于他们的经验和人脉，他们对威胁有非常广泛的见。金融服务和医疗保健机构正在聘用此类 CISO；他们精通监管问题。


    让类型匹配如此具有挑战性的原因是公司往往不知道他们想要 CISO 什么，而 CISO 并不总是清楚想成为什么样的领导。由于 CISO 的职责在公司和行业之间并不相同，通常由
    CISO 来帮助定义角色。


    网络安全高管与组织之间的不兼容会导致职业倦怠并导致 CISO 流失率高昂。根据 Enterprise Strategy Group 的研究，平均 `CISO`
    任期二到四年。


    当业务不确定需要什么时，他们可能会发现当前的或招募的 `CISO` 与文化不合。这种情况在你们审查 CISO 职位描述时变得非常清晰。此类职位描述通常包括如
    `创建防火墙规则` 等技术职责、如 `创建和维护 KPI` 等治理元素，以及两者之间的所有内容。CISO 的职位描述在不同行业以及不同规模和成熟度的组织之间差异。


    根据 `CSO Online` 的说法，在寻找新职位时，要注意一些重要的警示信号。


    例如，在担任公司首位 `CISO` 职位之前要深思熟虑。很多新手 CISO 只坚持了一年，因为管理层的期望过高且要求过快，无论该组织（及其基础设施）存在了多久。


    同时，作为新的 `CISO`，你可能预期会有充足的预算来工作，但管理层可能还没有准备投入你认为他们所需的资金来解决预存在的问题。预见可能的冲突（参见[第 6
    章](#c06.xhtml）了解更多如何相对于组织的风险偏好来确定和设定问题）。


    从积极的一方面来看，成为公司的首位 `CISO` 可以让你能够采取主动，并在获得适当支持的情况下为组织制定并影响安全风险计划。这可能是你职业生涯中担任过的最好的职位！


    汇报结构是另一个问题。今天大多数 CISO 向 `CIO` 汇报，但并不是每个 `CIO` 都是强有领导者。如果 `CISO` 向不是强有领导者的 `CIO`
    汇报，该 `CIO` 可能会寻找替换 `CISO` 的理由。如果你看到这种动态，可能是时候寻找另一份工作了，或者至少考虑逐步加强与 `CIO` 的伙伴关系。

    '
