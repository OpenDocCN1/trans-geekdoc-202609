  trans: "\n\n在企业中构建安全文化意味着什么？很多时候，安全组织往往被视为“不”之口的代名词。鉴于数字经济的发展速度以及企业为了获得竞争优势而采取主动策略，安全必须成为所有解决方案的嵌入部分。安全组织不应只会说“不”，而应该能够在说“是”的同时，详细说明这一“是”的运行条件。如果安全被视为“不”的反对者，那么严重的安全风险可能无法被识别，从而使业务和公司面临更大的风险。安全组织必须演变为业务部门的信赖顾问。\n\
    \n成就的顶峰是，安全部门不再被刻意回避，而是被主动寻求建议。当安全文化根深蒂固时，企业就达到了这一巅峰：当提出新的或变化的倡议时，安全会贯穿于设计、构建和实施的全过程中。缺乏这种嵌入的安全文化，解决方案将在缺乏适当控制的情况下交付，这可能导致数据泄露以及客户和股东的不满。`CISO`的工作——以及每个人的工作——是让业务能够以他们所需的速度驾驶汽车，同时配备刹车、安全气囊和安全带等适当的安全措施，以达到接受的安全水平。\n\
    \n根据安全组织相对于成熟度的不同阶段，这看起来可能是艰巨的。如果通过关系管理、沟通和意识培养来处理，这可以是一段有趣的旅程，公司里的每一个人（而不只是安全部门的人）都将安全视为自己的工作。安全部门必须建立信任并交付赋业务的能力。这些能力既可以是战术性的——维持运营——也可以是在你的安全部门内部创造能力，以便在业务领导者的战略桌上占有一席之地。\n\
    \n作为一名 `CISO`，这是一个赢得支持者心智的绝佳机会，让他们成为安全的倡导者。最终的成功是你的手机响，邮箱里满了业务部门的请求。始终接听这些电话，回答这些邮件并倾听。一旦你获得了听众，确保你维护并留住这些客户，因为赢回他们比赢得他们要困难得多。\n\
    \n这并不容易，但一旦实现，安全将在决策桌上拥有稳定的席位，并被视为有价值的业务顾问。现在，让我们开始旅程吧！\n\n## 旅程的构建模块\n\n文化变革必须与安全计划成熟度的增长同步进行。这很重要，因为随着安全计划成熟度的提高，组织意识也应该随之建立。当实现了成熟性的基础要素后，安全可以从对齐演变为风险容忍，再演变为咨询模式。要演变为咨询模式，必须提供成熟的服务，以便在咨询期间，能够提供与业务目标风险相匹配的风险意识建议。\n\
    \n通往一个拥有业务部门信任、尊重和重视的高性能安全组织，其构建模块是什么？`图 3-1`展示了从建立基础到成为信赖顾问的演变。本章的其余部分描述了安全计划的构建阶段及其与构建安全意识文化的对齐关系。\n\
    \n安全的文化元素包括：\n\n* 领导力与组织支持\n* 沟通\n* 衡量有效性\n* 衡量参与度\n* 关系管理\n\n在`图 3-1`中，这些文化元素以`斜体文本`呈现。\n\
    \n![图 3-1. 安全意识文化的演变](img/c03f001.png)\n\n`图 3-1`。 *安全意识文化的演变* \n\n## 计划与文化基础\n\
    \n为安全计划建立基础至关重要。即使已经有了计划，也要重新审视这些基础领域，以确保基础坚实并包含实现更广泛文化意识所需的元素。\n\n### 领导力支持\n\
    \n执行管理层的支持是获得与企业风险容忍一致的成果并实现目标成熟度的前提。组织会追随领导者，因此这种支持对于激发提供资金以实现所需变化的意愿至关重要。组织的意愿与理解安全组织的感知基调和格调以及它为公司交付的内容密切相关。\n\
    \n### 沟通与意识计划\n\n沟通计划必须与意识计划相结合。安全部门必须传达其当前的态势和计划，并向业务部门寻求意见。该计划应包括在何、何时以及如何沟通安全计划。不仅要考虑安全组织如何向业务提供意识，还要考虑该小组如何获取业务意识，以及参与其中的哪些论坛。\n\
    \n### 净推荐值 (Net Promoter Score)\n\n净推荐值通常用于衡量客户忠诚度。需要理解业务收入产生和非收入产生部门对安全的感知，以建立改变安全团队和整个业务部门意识的基准。安全领导者往往被认为缺乏业务洞察力或同理心。衡量安全组织的感知是构建安全意识文化的第一步之一。\n\
    \n为了建立获取净推荐值的方法，安全团队应该与市场营销、沟通和人力资源部门接触。这些部门可以作为安全基层支持的起点，并成为安全团队的延伸。确保安全部门倾听并采纳这些团队的建议，以便从支持者反对者那里学习。\n\
    \n### 资金审批\n\n对关键人员的资金支持展示了领导力的支持，以构建计划达到所需的成熟度。通常，技术人员并非最好的顾问，因此在招聘过程中必须审慎考虑，寻找沟通能力强的领域专家。这些领导者必须能够理解业务需求、可用解决方案以及所需的解决方案。安全领导者必须擅长用业务语言讲故事。\n\
    \n### 差距评估\n\n评估功能和人员方面的安全能力差距至关重要，因为需要正确的能力并持续交付这些能力。如果计划的构建要素可用，安全团队将无法为业务提供服务。\n\
    \n首先，统计现有的安全能力，并对照行业框架进行衡量。缺少哪些能力？这些能力对支持业务至关重要吗？这些是正确的能力吗？是否有机会通过简化解决方案来实现跨越式的成熟？与其使用多个互不整合的“最佳实践”解决方案，如何迁移到能够无缝协作以交付能力的平台级集成技术栈？制定一个实现这些能力的计划，并在优先级排序时，不仅要考虑风险的降低，还要考虑业务部门所交付和感知到的价值。\n\
    \n### 定义目标成熟度\n\n根据差距评估，获得领导层对风险和公司可接受安全成熟度的共识。一旦达成一致，确保安全计划有办法以对业务有的方式传达成果。\n\
    \n"
