    嵌入在集成开发环境（IDE）中的扫描器可以帮助在流程早期发现错误，理想情况下能为开发者就薄弱的编码实践提供及时反馈。静态应用安全测试（SAST）工具关注代码行，可以帮助验证源代码和第三方库，并定期扫描两者的不安全实践和已知漏洞。动态应用安全测试（DAST）工具在应用程序运行时（通常是
    Web 应用程序和服务）寻找漏洞，而集成应用安全测试（IAST）旨在从更现代的基础设施中结合两者的目标。所有这些工具都需要应用本身和工具本身具备良好的维护才能发挥作用。


    ## 过程至关重要


    成功的实施不仅为开发者提供及时反馈，还很大程度上取决于工具本身的定期调优和质量检查，以防止大量的虚假报告以及由此产生的冷漠。如果不投入精力验证这些扫描的质量，可能会导致投资浪费，并产生更多未被处理的“噪音”，导致潜在的严重问题被忽视并让风险积累。


    ## 预定义价值


    定义使用这些工具的目标也有帮助。每种工具都有局限性，不应仅作为“即点即扫”的解决方案。许多公司发现很难从这些工具中获得价值，因为他们未能投入时间定义每种工具的目标，并配置工具以实现这些目标。SAST
    工具因发现结果过多（虚假报告）而闻名；DAST 工具可能存在覆盖问题，或无法管理应用的复杂性并导致“发现不足”。不应期望任何单一技术都能发现所有重要的内容而不发现任何不重要的内容。


    如果目标是以比人类更快、更广泛的速度发现某些问题区域，或者帮助将某些测试能力转移给经过培训和支持的工程团队，这些工具通过实现测试的规模和速度将非常有用。对于资源非常有限的组织，工具可以在原本没有覆盖的地方提供保障。


    许多赏金报告发现了可以通过更自动化流程发现的常见弱点。跨站脚本和注入漏洞仍然位列 OWASP 前 10 名单是有有原因的。


    在产品生命周期早期使用工具可以发现此类已知漏洞，并向开发者提供反馈，以帮助随着时间的推移减少重复错误。这些模式应该被监控和衡量，并作为反馈循环的一部分，以沟通计划和工具的有效性——稍后会详细介绍。


    ## 底线


    在拥有稳健流程和技能团队的情况下，工具在“设计安全”的进程中具有不可或的地位。你仍然需要富有知识的人才来调优工具、解释发现的结果，当然还有修复它们。


    ## 人


    说到富有知识的人，一切都始于人。有一个例外……


    ### 这并不完全关乎你


    实际上，这大部分并不关乎你。它关乎业务以及他们试图实现的目标，关乎客户他们期望和应得的安全。作为安全专业人员，我们在这里是为了让业务安全地实现他们的目标。如果业务是一辆赛车，那么我们就是刹车；在需要时，我们是维修队——负责修复、诊断问题，并向驾驶员无线，让他们知道何时可以安全踩油门，并告知他们潜在的威胁和风险。当发生严重故障时，我们是应急响应小组。


    现在，在你对刹车类比感到肉扭之前，刹车是让汽车能够安全快速行驶的工具。如果你不信任刹车，你就不敢开快。如果你没有刹车，就会撞车。我们的工作是确保刹车完美运行，以便业务能够以全速行驶。


    （注：原文中该段刹车类比的内容重复了多次，根据“不要重复输出原文”的原则，此处仅保留翻译后的核心含义。）


    '
