    # 应对今日威胁


    今天的威胁已经发生了巨大的演变，攻击者的性质也随之发生了变化。单独黑客、受雇黑客和小型集体仍然存在，而且随着在线材料让几乎任何人都能成为黑客，他们的数量正在不断增加。漏洞在暗网上像商品一样被买卖，任何这些攻击者都能轻易获得。然而，在今天，这些攻击者还加入了来自全球有组织犯罪集团的资金充足的对手，以及来自特定国家、受政府支持的黑客小组。


    你的安全态势必须足够强大，以防止各种外部人员访问你的私人和专有数据、流程和机器。


    遗憾的是，并非所有的恶意对手都位于你的企业之外。不幸的是，某些威胁者拥有对你系统的内部访问权限，包括不满或不符合道德的现任及前员工，他们滥用权限和数据获取个人利益，或仅仅是为了制造麻烦。其他潜在的内部威胁包括供应商、合作伙伴、董事会成员以及其他能够访问你系统和数据的任何人。


    还有其他的内部威胁。我们称他们为“意外内部人员”。你可能称他们为“人”。意外内部人员会无意中使组织暴露风险，因为他们没有经过培训、工作过载或缺乏动力。当这些人在响应钓鱼尝试、使用弱密码或默认密码、共享密码、离开设备未打补丁或未锁定，以及在不安全的
    Wi-Fi 网络上工作时，他们就成了威胁。


    你的组织面临着资金充足的对手，还面临着那些可能只是按错了键的人。你将在第四章中了解今日不断演变的威胁背后的众多参与者。


    ## 解决技能和多样性差距


    我们拥有的网络安全人员数量与需求数量之间的差距正在扩大。根据 `(ISC)² Cybersecurity Workforce Study`，截至 2021
    年，全球范围内需要超过 300 万名网络安全人员。


    解决这一差距需要多管齐下的方法。安全知识需要在内部更广泛地传播。安全与 IT 应该整合，并在 IT 和安全人员之间进行交叉培训。IT 也不应是安全团队的唯一招聘领域：要跨业务部门寻找，识别具有各种类型经验（从风险、财务到客户服务）的潜在候选人，以构建安全人才队伍。


    为了弥补技能差距，我们需要创造一种人们愿意从事安全业务的文化。为了让这个领域更具吸引力（从一线安全人员到领导者），我们需要增加 `CISO` 的可见度和影响力。他们需要被视为高管理层不可或缺的一部分，是业务成功的核心，而不是一个负责清理问题的“网络清洁工”，或在发生泄露时替背锅的人。


    尽管技术技能仍然重要，但领导力、沟通、计划、风险管理和战略等软技能同样至关重要。对于担任 `CISO` 职位、领导安全团队并与董事会沟通的人来说，这些技能尤为关键。


    我们还需要通过招聘更多女性以及各种背景的人员（包括种族、民族、取向和残障状况）使该领域更加多样化。此外，我们需要扩大招聘工作招募退伍军人，他们的背景使他们成为受重视且投入的员工。


    女性终于在网络安全领域取得了一些进展。2013 年，女性占网络安全工作的比例为 11%；现在女性占了网络安全劳动力的 24%。虽然这一改进是一个好消息，但仍需取得更多进展，特别是女性占了整个劳动队伍的一半。


    弥补多样性差距不仅仅是一项让人开心的措施。弥补多样性差距能推动业务成功和变革。为了降低网络风险，我们需要降低群体思维的水平。具有不同背景和经验的团队可以为问题发现新的、创造性的解决方案。女性为领导力、问题解决和安全带来了独特的特质。例如，女性
    `CISOs` 在关键软技能方面的得分高于他们的男性同类，其中在领导力方面高出 46%，在分析能力方面高出 150%。


    最后，我们需要通过创建有效促进安全领域的计划来在该领域内激发热情，包括导师指导、实习以及与从大学到 K–12（基础教育）学校的互动。


    `CISOs` 如果没有知识渊博员工就无法领导。第五章 概述了技能和多样性差距的程度。它为你提供了吸引所需资源的策略，包括提升你组织中人员技能的方法，毕竟他们已经了解了你的业务。


    由于这是书中关于“人”的章节，让我们从你开始，为你提供有关在面对今日威胁时成为一名 `CISO` 意味着什么的背景。


    ## 注释


    1. 1. [`www.isc2.org/Research/Workforce-Study`](https://www.isc2.org/Research/Workforce-Study)


    2. 2. [`www.fortinet.com/resources-campaign/ciso/the-ciso-ascends-from-technologist-to-strategic-business-enabler-2`](https://www.fortinet.com/resources-campaign/ciso/the-ciso-ascends-from-technologist-to-strategic-business-enabler-2)


    3. 3. [`www.fortinet.com/resources-campaign/ciso/the-ciso-ascends-from-technologist-to-strategic-business-enabler-2`](https://www.fortinet.com/resources-campaign/ciso/the-ciso-ascends-from-technologist-to-strategic-business-enabler-2)


    [/content]

