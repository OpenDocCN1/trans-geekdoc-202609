  trans: "\n当 COVID-19 疫情袭来时，我们的工作场所突然转移到了家中。展望未来，随着居家办公成为许多人的新常态，工作场所与个人空间将融合。在安全性较低的家庭网络上的员工正通过视频参加会议，使用协作平台与团队互动，并在云端管理公司数据。从安全的角度来看，这种工作与生活的加速融合——作为领导者，我们早已经关注到了这一点——但现在变得更加令人担忧。\n\
    \n为了解决你面临的所有问题，目前可提供的安全解决方案比以往任何时候都多。但这是一把双刃剑，因为产品的激增和安全解决方案市场更迭迭代的速度对首席信息安全官（CISO）来说也是是一项挑战。\n\
    \n如你所知，简单地将最新的安全技术叠加到你的企业上并不能让你达到目标。你能够从一开始就构建安全性并以涵盖整个企业吗？你应该考虑采用哪些新兴的安全解决方案？应该考虑哪些新领域？什么可以指导这些决策？你需要一种更具全局的方法。\n\
    \n你需要在整个网络中部署正确的技术。你的安全技术必须与强大的架构保持一致，以确保没有漏洞。你的安全平台在需要时应该容纳点解决方案，但也要能够轻松集成并跨越你的所有系统。\n\
    \n为了跟上不断演变和快速移动的威胁，你的安全技术必须自动化。正确的技术还必须是成熟的、供应商支持良好的，并且能够帮助你实现安全目标。为了随企业增长，你的安全必须具有可扩展性。最后，你的安全必须能够开箱即用——否则你的员工会找到绕过或忽略它的方法。\n\
    \n在本书的这一部分，我们涵盖了今天 CISO 特别关注的关键领域，包括云安全、IoT 和边缘安全以及安全驱动网络。本节的最后一章将介绍你最具战略性的目标：实现端到端安全。\n\
    \n## 云安全\n\n虽然从多个业务角度来看，迁移到云的决策显而易见，但在云端工作需要在安全方面投入努力并规划。迁移到云由于选择采用何种云（公有、私有还是混合）而变得更加复杂。这需要对所涉及云的安全特性有理解。\n\
    \n每个云都有变量，特别是在安全和合规性方面。你如何处理云端监控？你还需要确定由谁来维护系统：是你还是托管服务安全提供商？每种方法的优缺点是什么？当安全的最终责任完全落在你肩身上时，你如何使用云供应商提出的责任共担模型？第\
    \ 11 章涵盖了云安全这一重要领域。\n\n## IoT 和边缘安全\n\n物理世界与网络世界之间的边界已经消失。无论是网络还是物理，无论是你的数据、你的销售点系统还是边缘的传感器，整个企业中的一切都是互连的。其中某些技术（特别是\
    \ IoT 和边缘技术）在构建时并未考虑安全性，并可能包含较旧的网络接口，这些接口在没有评估连接风险的情况下就会被激活。你必须查看你所有的技术——从边缘传感器到数据中心，从咖啡壶到你的\
    \ HVAC 系统——确保你没有为网络留下一扇开启的门，甚至是一扇裂开的窗户。\n\n网络与物理世界之间的连接也能帮助你作为防御者。现在你的门、锁和安全摄像头已连接到网络领域，这些连接可以从网络安全的角度为你提供帮助。这种网络与物理的整合让你更清楚地看到你场所和网络内部发生的情况。例如，如果你发现异常的网络活动，并将该活动与安全摄像头显示有人进入你的数据中心的信息关联起来，你就可以判断出你面临的不仅仅是网络问题：你还面临外部入侵者或非工作时间在场的的内部人员。我们在第\
    \ 12 章 中涵盖了融合的网络与物理世界中的安全。\n\n## 安全驱动的网络\n\n鉴于网络对业务每个层面的至关性，安全与网络之间的区别是一个虚假的二元对立。安全策略必须应用于动态网络，包括\
    \ SD-WAN。安全驱动网络的基础思想是将安全与网络无缝地结合在一起。\n\n安全必须构建在网络中。你还必须不断适应变化的环境。在一个零信任正成为标准安全实践的世界里，网络设计必须包含分段信息和过程的方法，指定如何定义用户，并描述你如何处理网络访问控制。从容器到\
    \ API 再到远程访问和 5G，安全策略必须一致地应用于你的整个网络，包括动态边缘。由定义的安全策略治理的安全远程访问应在你的用户所在的任何地方可用。安全驱动网络将在第\
    \ 13 章 中涵盖。\n\n## 实现端到端安全\n\n端到端安全的核心原则是速度、敏捷性、互操作性和持续监控。实现端到端安全需要整合跨越你的整个网络、物理场所以及云端的解决方案。当你有效利用自动化并管理复杂性的平台时，你必须时刻记住端到端安全的目标。你还需要解决符合不断演的安全法规、标准和合规性问题。\n\
    \n最后，当你认为已经实现了端到端安全时，你的工作尚未结束。当你整合新的人员、新的流程和新技术时，你必须将安全放在首位。端到端安全要求从一开始就构建安全性，并确保以实现这一目标的方式整合新技术。第\
    \ 14 章 涵盖了端到端安全。\n\n# 11  \n\n云安全\n\n***FATIMA BOOLANI***\n\n向云端迁移是不可阻挡的，且没有回头路。\n\
    \n远离运行 IT 栈和自建企业软件的“无差异化负担”不仅催生了一大批原生数字创业企业，还促使各种规模的公司对云计算产生狂热的采用。这些计划体现在基于云的前端应用现代化、后端基础设施转型以及软件驱动的业务流程自动化中，满足了现代企业对敏捷、效率和创新日益增长的需求。\n"
