- raw: 'Ultimately, security should be built deeply into a smarter, faster network.
    But that won''t happen in the near term. In the meantime, cybersecurity professionals
    must take responsibility for advancing the implementation of security-driven networking.
    To move forward, we must determine how the network should be smarter and how that
    intelligence should be distributed across different parts of a more secure network.


    In this chapter, we explain how the cloud has changed secure networking, discuss
    why last-generation solutions won''t work, and outline the necessary steps CISOs
    must take to meet today''s cybersecurity challenges and to build true security-driven
    networking.


    ## The Cloud Has Changed Everything About Security


    Over the last twenty years, organizations have moved from experimenting with one
    cloud to adopting multi-cloud to moving a majority of workloads to the cloud.
    In the meantime, people in a variety of professions are increasingly working remotely.
    Even when people are physically in the workplace, they are conducting business
    on personal devices along with or instead of company equipment.


    This evolving work environment has given birth to multiple unknown unknowns. CISOs
    don''t immediately know what operating system or antivirus protection people are
    using on personal devices and whether that protection is up to date. CISOs don''t
    immediately know whether employees are working on public Wi-Fi in a coffee shop.
    CISOs don''t immediately know whether employees are misusing data or even accessing
    information they''re not entitled to see.


    With threats becoming more and more advanced, CISOs must work with all technology
    teams to build security into the target state and know immediately who and what—including
    APIs, service accounts, and bots— is accessing the data they are responsible for
    protecting. Often when an outside server is talking to an enterprise server, that
    outside server may have privileged access by default to access the enterprise
    server. Opportunistic threat actors can discover that privileged service account,
    access the account, and do major damage on the server.


    Outside the organization, the threat landscape has become more pervasive with
    highly motivated, serious threat actors. Malicious nation-states, sophisticated
    criminal organizations, and other opportunists are launching destructive attacks
    and using ransomware, targeted phishing campaigns, and a growing number of other
    techniques.


    The proliferation in the number of different cloud services has also complicated
    security in many ways. We don''t have just one cloud. We have cloud for IaaS (infrastructure
    as a service) like Amazon Web Services, Google Cloud Platform, and Microsoft Azure;
    cloud for PaaS (platform as a service) like the various programming services on
    those three clouds; cloud for SaaS (software as a service) such as Salesforce
    and thousands of other SaaS applications; and then the data center, which in effect
    has become just another destination that a user may want to or must get to and
    that can be protected with the same paradigm as these other cloud data centers.


    In each of these situations, the challenge is not merely connecting to these different
    types of clouds, but also making sure that these clouds are used properly. For
    example, allowing everybody to securely connect to OneDrive or Google Drive is
    one issue, but preventing data leakage caused by inappropriately sharing files
    from those drives is an additional security concern. This is just one example
    of the kind of cloud security capability that is new, is not handled by legacy
    technology, and must be supported by built-in mechanisms.


    ## Last-Generation Security Solutions Are Inadequate


    In this fast-evolving cyber world where many people and organizations are moving
    to the cloud, a perimeter-based, moat-and-castle approach to security no longer
    protects your organization. Network security, endpoint security, and application
    security—all functioning independently without communicating—are failing to protect
    enterprises that rely on these solutions.


    The work environment, the tools used in that environment, and the shifting locations
    of that environment are all changing quickly. The perimeter that was once the
    foundation of cybersecurity? Gone. The work-from-home (WFH) surge has brought
    old problems to light and created new challenges.


    Imagine a user is sitting in a Starbucks trying to access their work services.
    They use single sign-on (SSO) for Microsoft 365, but SaaS applications such as
    Salesforce or Workday not integrated with the same SSO will require a separate
    set of credentials—leading us to question whether we should really call this single
    sign-on to begin with. Further complicating matters, users may access their personal
    accounts such as Gmail or Dropbox. If users urgently need to send a work document
    but can''t manage to sign in properly, they are likely to circumvent security
    and use those services instead as a way to get their work done. It''s easy to
    see how this leads to data leakage.


    The WFH trend is just one way the security landscape has become acutely complex.
    With a legacy approach, either not enough security is available or the security
    is available but poses too much difficulty. Here''s how that has become problematic:


    *   Some organizations seek to boost security via hairpinning. Traffic is routed
    from the user''s location back in through a private network to the data center
    and then back to the internet, preserving protections. But hairpinning causes
    performance problems, complicates the network architecture, and doesn''t solve
    issues such as securing access from remote locations.


    *   Within the perimeter, some organizations are still granting unlimited access
    to users. Once these users gain access under the legacy paradigm, they get access
    not only to a specific application for a specific purpose but also to the whole
    range of the network protected by the firewall. This practice enables large security
    vulnerabilities.


    *   VPNs can provide additional security to remote workers as part of hairpinning
    solutions. But VPNs require the user to do a lot more of the connecting to the
    network, and a single user might need more than one VPN. Also, as we discuss next,
    the service-level agreements for VPNs are not designed to handle the large amount
    of traffic generated by the increase in remote workers.


    During the pandemic-fueled surge in remote work, most networks found they couldn''t
    handle the increased load. VPNs crashed multiple times. People couldn''t do their
    jobs because they couldn''t get onto the network, so workers, and sometimes security
    leaders, came up with workarounds that likely weren''t secure.


    For example, to reduce the load on the remote working infrastructure, some organizations
    found themselves granting exceptions to security policies, sometimes for a specific
    (and relatively long) amount of time such as 100 days. Patch management had to
    be modified to very specific low-load timeframes. Internet gateway technology
    had to be swiftly updated for local routes to reduce traffic.


    Collaboration software, which was once used mostly within the firewall perimeter,
    had to be updated to enable usage, temporarily, without a VPN but with security
    policies enabled. Password syncing also came front and center because end users
    could not enter a physical office to log in to their legacy environments.


    End-user computer support teams had to think and react quickly to the scale of
    laptops being physically sent out and passwords synced and updated en masse. New
    technologies had to be added to the legacy technologies to properly protect the
    “keys to the kingdom.”'
  fmt: '

    Ultimately, security should be built deeply into a smarter, faster network. But
    that won''t happen in the near term. In the meantime, cybersecurity professionals
    must take responsibility for advancing the implementation of security-driven networking.
    To move forward, we must determine how the network should be smarter and how that
    intelligence should be distributed across different parts of a more secure network.


    In this chapter, we explain how the cloud has changed secure networking, discuss
    why last-generation solutions won''t work, and outline the necessary steps CISOs
    must take to meet today''s cybersecurity challenges and to build true security-driven
    networking.


    ## The Cloud Has Changed Everything About Security


    Over the last twenty years, organizations have moved from experimenting with one
    cloud to adopting multi-cloud to moving a majority of workloads to the cloud.
    In the meantime, people in a variety of professions are increasingly working remotely.
    Even when people are physically in the workplace, they are conducting business
    on personal devices along with or instead of company equipment.


    This evolving work environment has given birth to multiple unknown unknowns. CISOs
    don''t immediately know what operating system or antivirus protection people are
    using on personal devices and whether that protection is up to date. CISOs don''t
    immediately know whether employees are working on public Wi-Fi in a coffee shop.
    CISOs don''t immediately know whether employees are misusing data or even accessing
    information they''re not entitled to see.


    With threats becoming more and more advanced, CISOs must work with all technology
    teams to build security into the target state and know immediately who and what—including
    `apis`, service accounts, and bots— is accessing the data they are responsible
    for protecting. Often when an outside server is talking to an enterprise server,
    that outside server may have privileged access by default to access the enterprise
    server. Opportunistic threat actors can discover that privileged service account,
    access the account, and do major damage on the server.


    Outside the organization, the threat landscape has become more pervasive with
    highly motivated, serious threat actors. Malicious nation-states, sophisticated
    criminal organizations, and other opportunists are launching destructive attacks
    and using ransomware, targeted phishing campaigns, and a growing number of other
    techniques.


    The proliferation in the number of different cloud services has also complicated
    security in many ways. We don''t have just one cloud. We have cloud for `IaaS`
    (infrastructure as a service) like `Amazon Web Services`, `Google Cloud Platform`,
    and `Microsoft Azure`; cloud for `PaaS` (platform as a service) like the various
    programming services on those three clouds; cloud for `SaaS` (software as a service)
    such as `Salesforce` and thousands of other `SaaS` applications; and then the
    data center, which in effect has become just another destination that a user may
    want to or must get to and that can be protected with the same paradigm as these
    other cloud data centers.


    In each of these situations, the challenge is not merely connecting to these different
    types of clouds, but also making sure these clouds are used properly. For example,
    allowing everybody to securely connect to `OneDrive` or `Google Drive` is one
    issue, but preventing data leakage caused by inappropriately sharing files from
    those drives is an additional security concern. This is just one example of the
    kind of cloud security capability that is new, is not handled by legacy technology,
    and must be supported by built-in mechanisms.


    ## Last-Generation Security Solutions Are Inadequate


    In this fast-evolving cyber world where many people and organizations are moving
    to the cloud, a perimeter-based, moat-and-castle approach to security no longer
    protects your organization. Network security, endpoint security, and application
    security—all functioning independently without communicating—are failing to protect
    enterprises that rely on these solutions.


    The work environment, the tools used in that environment, and the shifting locations
    of that environment are all changing quickly. The perimeter that was once the
    foundation of cybersecurity? Gone. The work-from-home (`WFH`) surge has brought
    old problems to light and created new challenges.


    Imagine a user is sitting in a Starbucks trying to access their work services.
    They use single sign-on (`SSO`) for `Microsoft 365`, but `SaaS` applications such
    as `Salesforce` or `Workday` not integrated with the same `SSO` will require a
    separate set of credentials—leading us to question whether we should really call
    this single sign-on to begin with. Further complicating matters, users may access
    their personal accounts such as `Gmail` or `Dropbox`. If users urgently need to
    send a work document but can''t manage to sign in properly, they are likely to
    circumvent security and use those services instead as a way to get their work
    done. It''s easy to see how this leads to data leakage.


    The `WFH` trend is just one way the security landscape has become acutely complex.
    With a legacy approach, either not enough security is available or the security
    is available but poses too much difficulty. Here''s how that has become problematic:


    *   Some organizations seek to boost security via hairpinning. Traffic is routed
    from the user''s location back in through a private network to the data center
    and then back to the internet, preserving protections. But hairpinning causes
    performance problems, complicates the network architecture, and doesn''t solve
    issues such as securing access from remote locations.

    *   Within the perimeter, some organizations are still granting unlimited access
    to users. Once these users gain access under the legacy paradigm, they get access
    not only to a specific application for a specific purpose but also to the whole
    range of the network protected by the firewall. This practice enables large security
    vulnerabilities.

    *   `VPNs` can provide additional security to remote workers as part of hairpinning
    solutions. But `VPNs` require the user to do a lot more of the connecting to the
    network, and a single user might need more than one `VPN`. Also, as we discuss
    next, the service-level agreements for `VPNs` are not designed to handle the large
    amount of traffic generated by the increase in remote workers.


    During the pandemic-fueled surge in remote work, most networks found they couldn''t
    handle the increased load. `VPNs` crashed multiple times. People couldn''t do
    their jobs because they couldn''t get onto the network, so workers, and sometimes
    security leaders, came up with workarounds that likely weren''t secure.


    For example, to reduce the load on the remote working infrastructure, some organizations
    found themselves granting exceptions to security policies, sometimes for a specific
    (and relatively long) amount of time such as 100 days. Patch management had to
    be modified to very specific low-load timeframes. Internet gateway technology
    had to be swiftly updated for local routes to reduce traffic.


    Collaboration software, which was once used mostly within the firewall perimeter,
    had to be updated to enable usage, temporarily, without a `VPN` but with security
    policies enabled. Password syncing also came front and center because end users
    could not enter a physical office to log in to their legacy environments.


    End-user computer support teams had to think and react quickly to the scale of
    laptops being physically sent out and passwords synced and updated en masse. New
    technologies had to be added to the legacy technologies to properly protect the
    "keys to the kingdom.”

    '
  trans: '

    最终，安全应该深层次地构建在更智能、更快的网络中。但这在短期内不会发生。在此期间，网络安全专业必须承担起推进安全驱动网络实现的责任。为了向前发展，我们必须确定网络应该如何变得更智能，以及这种智能应该如何分布在更安全网络的不同部分。


    在本章中，我们将解释云如何改变了安全网络，讨论为什么上一代代解决方案将不再奏效，并概述首席信息安全官（CISO）必须采取的必要步骤，以应对如今的网络安全挑战并构建真正的安全驱动网络。


    ## 云改变了安全的所有切方面


    在过去的二十年里，企业已经从尝试单一云转向采用多云，再到将大多数工作负载迁移到云端。与此同时，各种职业的人员越来越多地进行远程工作。即使人们身处办公场所，他们也会使用个人设备或代替公司设备进行业务。


    这种不断演变的工作环境催生了许多“未知的未知”。CISO 无法立即得知人们在个人设备上使用什么操作系统或防病毒防护，以及这些防护是否已更新。CISO 无法立即得知员工是否在咖啡馆的公共
    Wi-Fi 上工作。CISO 无法立即得知员工是否误用数据，甚至访问了他们无权查看的信息。


    随着威胁变得越来越尖端，CISO 必须与所有技术团队合作，将安全构建到目标状态中，并立即知道是谁以及什么（包括 `apis`、服务账户和机器人）正在访问他们负责保护的数据。通常，当外部服务器与企业服务器通信时，该外部服务器可能默认拥有访问企业服务器的特权访问。机会主义的威胁攻击者可能会发现该特权服务账户，访问该账户，并在服务器上造成重大破坏。


    在组织之外，威胁格局变得更加无处不在，出现了动机强烈、严肃的威胁攻击者。恶意国家、复杂的犯罪组织和其他机会主义者正在发动破坏性攻击，并使用勒索软件、针对钓鱼攻击以及日益增加的其他技术。


    不同云服务数量的激增也从许多方面增加了安全复杂性。我们不只有一个云。我们有 `IaaS`（基础设施即服务）云，如 `Amazon Web Services`、`Google
    Cloud Platform` 和 `Microsoft Azure`；用于 `PaaS`（平台即服务）云，如这三个云上的各种编程服务；用于 `SaaS`（软件即服务）云，如
    `Salesforce` 和数千种其他 `SaaS` 应用；还有数据中心，它实际上已经变成了用户可能想要去或必须到达的目的地，并且可以使用与这些其他云数据中心相同的范式进行保护。


    在这些每种情况下的，挑战不仅在于连接到这些不同类型的云，还在于确保这些云被正确使用。例如，允许所有人安全地连接到 `OneDrive` 或 `Google
    Drive` 是一个问题，但防止因不当共享这些驱动器中的文件导致的数据泄露则是另一个安全关注点。这只是这种云安全能力的一个例子，这种能力是新的，遗留技术无法处理，并且必须由内置机制支持。


    ## 上一代安全解决方案不再充分


    在这个快速演变的网络安全世界中，许多个人和组织正在转向云端，基于边界的“护城河与城堡”式安全方法已无法保护你的组织。网络安全、终端安全和应用安全——所有功能独立运行且互不通信——正无法保护依赖这些解决方案的企业。


    工作环境、该环境中使用的工具以及该环境位置的变化都在发生快速变化。曾经作为网络安全基础的边界？消失了。居家办公（`WFH`）的激增使旧问题暴露出来，并创造了新的挑战。


    想象一个用户坐在星巴克，尝试访问他们的工作服务。他们使用单点登录（`SSO`）访问 `Microsoft 365`，但像 `Salesforce` 或 `Workday`
    等未集成相同 `SSO` 的 `SaaS` 应用需要一套独立的凭据——这让我们质疑最初是否真的应该将此称为单点登录。更复杂的问题是，用户可能会访问他们的 `Gmail`
    或 `Dropbox` 等个人账户。如果用户急切需要发送一份工作文档但无法正常登录，他们可能会绕过安全限制，转而使用这些服务来完成工作。很容易看出这如何导致数据泄露。


    `WFH` 趋势只是安全格局变得极其复杂的一种方式。使用遗留方法，要么是提供的安全不足，要么是安全可用但操作太太困难。以下是这种做法如何变成问题的来源：


    *   某些组织试图通过“发回链路”（hairpinning）来增强安全性。流量从用户位置通过私有网络返回到数据中心，然后返回互联网，以保留防护。但发回链路会导致性能问题，使网络架构复杂化，并且无法解决诸如从远程位置访问的安全问题。

    *   在边界内部，某些组织仍在授予用户无限制访问。一旦这些用户在遗留范式下获得访问，他们不仅可以访问用于特定目的的应用程序，还可以访问防火墙保护的整个网络。这种做法导致了巨大的安全漏洞。

    *   `VPNs` 可以作为发回链路解决方案的一部分为远程工作者提供额外的安全。但 `VPNs` 要求用户进行更多网络连接操作，单个用户可能需要多个 `VPN`。此外，正如我们接下来将讨论的，`VPNs`
    的服务水平协议设计用于处理因远程工作者增加而产生的大流量。


    在疫情推动的远程工作激增期间，大多数网络发现它们无法处理增加的负载。`VPNs` 多次崩溃。人们由于无法进入网络而无法工作，因此工作人员（有时甚至是安全负责人）想出了并不安全的权宜之。


    例如，为了减轻远程工作基础设施的负载，某些组织发现自己对安全策略授予了例外，有时是特定的（相对较长的）时长，例如 100 天。补丁管理必须修改为特定的低负载时段。互联网网关技术必须快速更新以进行本地路由，减少流量。


    协作软件曾主要在防火墙边界内使用，现在必须更新，以便在没有 `VPN` 但启用安全策略的情况下临时使用。密码同步也成为了了核心问题，因为终端用户无法进入物理办公室登录他们的遗留环境。


    终端用户支持团队必须快速思考并反应，以应对大量发送笔记本电脑以及批量同步更新密码的规模。新技术必须添加到遗留技术中，以正确保护“核心资产”。

    '
