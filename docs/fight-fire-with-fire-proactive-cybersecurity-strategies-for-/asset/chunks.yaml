    \n# 5  \n\nAddressing the Skills and Diversity Gap\n\n***LISA DONNAN***\n\nWith\
    \ millions more jobs than workers, the demand for both frontline cybersecurity\
    \ workers and leaders is outpacing the supply. Beyond the overall shortage of\
    \ cybersecurity workers, a vast diversity gap encompasses every facet of diversity,\
    \ including race, ethnicity, orientation, and disability status. Most notably\
    \ females, who make up half the population, comprise only about 24% of cybersecurity\
    \ workers.\n\nThis chapter offers guidance to CISOs on ways to bridge the skills\
    \ and diversity gap as well as advice to anyone seeking a job in cybersecurity.\
    \ Moreover, without inclusion as part of the equation, bridging the gap will not\
    \ be as successful or long-term. It is like recruiting for a sports team: one\
    \ part of the task is hiring the diversity, and the other is putting that talent\
    \ on the field. If you hire diverse candidates and then keep them on the bench,\
    \ you have not moved the ball—or the strategy—forward.\n\n## Assessing the Skills\
    \ Gap\n\nThe need for cybersecurity workers is immense.\n\nA majority of CISOs\n\
    \nTo meet the projected demand, the cybersecurity workforce needs to grow by 145%\
    \ globally and 62% in the United States.\n\nIf you're a CISO, that gap represents\
    \ an alarming, compelling trend. If you're interested in working in cybersecurity,\
    \ that gap presents an excellent career opportunity.\n\n## Assessing the Diversity\
    \ Gap\n\nFrom the front lines to the CISO, women are underrepresented and underpaid\
    \ in cybersecurity. Although females represent just over half of the population,\
    \ they comprise a little less than a quarter of security professionals.\n\nThere\
    \ are plenty of contributing factors for this glass ceiling, including a lack\
    \ of female mentors, female role models, and work environments that do not support\
    \ or retain women. In fact, 22% of women reported experiencing discrimination\
    \ at work, compared to 13% of men.\n\nResearch"
