  trans: '


    网络钓鱼邮件可能变得复杂得多。钓鱼者根据目标在组织中的角色来锁定对象，利用 `LinkedIn` 和其他来源找到切入个人兴趣的突破口，并针对那些最有可能访问钓鱼者想要的数据和系统的人。他们还会针对高管，这种做法被称为“大鲸鱼钓鱼”（whaling），考虑到高管所能接触的信息类型，以及他们在技术水平上可能相对较低。


    业务电子邮件欺骗（`BEC`）是一种特定的钓鱼攻击，它鼓励员工向装成高管或合作伙伴的犯罪分子发送资金或数据。这种伪装变体包括：`CEO`要求`Finance`部门立即向供应商汇款、`CEO`向`HR`索要公司所有的
    `W2s`、一家公司要求另一家公司更改电汇信息，或者产权公司要求房产买家发送首付款。在某些情况下，威胁行为者实际上入侵了发送者的邮箱，但在许多其他情况下，他们通过对邮箱地址进行难以微觉的修改（例如将数字
    `1` 替换为小字母 `l`）或声称邮件来自个人账户来伪造邮件。


    ## 勒索软件


    在过去的几年里，勒索软件一直主导网络攻击格局。针对医院和急救人员的攻击特别具有恶意，具有影响患者健康和安全的风险。根据 `Emsisoft` 最新的 `State
    of Ransomware` 报告，在 2020 年针对教育、医疗和公共部门的 2300 多次勒索软件攻击中，有 560 次针对医疗行业。


    犯罪分子不再向规模较小、技术简单的受害者索要小额赎金。现在，他们从知名品牌和各大城市获取巨额资金。赎金金额从数百到数千不等，最终已达到数百万。


    根据 `Identity Theft Resource Center`（`ITRC`）的说法，“平均勒索软件支付金额……


    威胁行为者——无论是犯罪分子还是国家级——不仅加密他们勒索的数据以使受害者无法使用，还威胁公开被盗数据，作为索要资金的另一种手段。这种“点名羞辱”的策略已无处不在。


    这只是勒索攻击者试图改变市场动态的一种方式。他们意识到，如果人们相信支付赎金可以获得解脱，他们就更容易拿到钱。


    被泄露的公司现在有时会通过发送信来提醒客户，告诉他们不要担心，赎金已经支付，他们的数据是安全的！这是一个重大的变化。甚至 `FBI` 在处理赎金支付方面也变得稍微灵活了一些。


    勒索软件大多数时候利用的是已知漏洞。虽然我们长期以来一直在讨论高级持续性威胁（APT），但“足够的持续性威胁”仍在发挥作用，因为大多数攻击仍然利用已知的、可修复的漏洞。但同时，随着威胁行为者赚取的钱越来越多，他们变得越来越复杂，模仿国家级攻击者的技术。


    结果，人工操控的勒索软件攻击更像高级持续性威胁。一旦勒索软件进入连接到网络的系统，它就会潜伏，横向扩散到其他系统并提升权限，同时犯罪分子识别受害者的“皇冠明珠”，即他们最珍贵的信息资源。众攻击者寻找受害者的网络保险单，以便根据免赔额和覆盖范围设定赎金价格。由于勒索软件已遍布整个网络，且攻击者已经完成了侦察，当他们准备出手时，会迅速加密网络。


    ## 内部威胁


    除了长长的外部行为者名单外，我们必须警惕 `内部威胁`。但这到底意味着什么呢？


    意外内部人员是指那些无意中造成伤害的人；许多人不知道如何正确配置他们。意外内部人员的一种类型是那些正合法地尝试工作，但粗心大意点击了恶意链接的员工。


    当然，还有恶意内部人员：存有蓄意窃取信息或造成破坏的员工。通常，这些内部人员寻求财务利益，但他们也可能是心怀不满的员工。其他恶意内部人员可能对自己的工作、同事、薪水、老板或公司方向不满意。他们可以独立行动，也可以作为另一个实体的代理。如果该员工的道德更低或忠诚度更低，他本很容易导致重大泄露。


    在某些情况下，医院和医疗系统一直是安装 `Ryuk` 勒索软件的恶意内部人员的受害者。


    ### 防内部威胁


    是什么让内部威胁如此难以应对？嗯，这很复杂。


    '
