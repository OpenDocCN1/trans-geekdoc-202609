- raw: 'The scarcity of female leaders in cybersecurity exacerbates the gender gap
    because female role models, when they exist, both inspire women to enter the field
    and help women move ahead.


    As for minorities (defined by the US Census Bureau as Black, American Indian,
    Asian, Pacific Islander, Hispanic, or two or more races), they are making inroads,
    but results are mixed, according to (ISC)²''s Innovation Through Inclusion.


    The bad news:


    *   Minorities are less likely to be in cybersecurity leadership positions. Only
    23% of minority cybersecurity professionals hold a role of director or above,
    compared to 30% of their Caucasian peers.


    *   Minorities earned less: $115,000 compared to the overall US cybersecurity
    workforce average of $122,000. Men of color in cybersecurity earn $3,000 less
    than white men.


    *   Women of color fared the worst; they earn an average of $10,000 less than
    white men and $6,000 less than white women.


    *   Compared to other races and ethnicities, Caucasian workers were more likely
    to have received a raise within the last year.


    *   Nearly one-third (32%) of minority cybersecurity professionals reported they
    had experienced discrimination at work.


    ## The Power of Diverse Teams


    Hiring and promoting diversity isn''t just the right thing to do; diverse teams
    drive business success. For example, increases in racial diversity were clearly
    related to enhanced financial performance for innovation-focused banks (Scientific
    American


    Focusing on the gender gap, a global survey


    Addressing the gender gap in cybersecurity alone would have an important impact
    on the US economy. Closing cybersecurity''s gender gap would boost the US economy
    by $30 billion, with an additional $12.7 billion if women earned as much as their
    male colleagues (Forbes Technology Council).


    The improved financial performance makes sense because increased diversity of
    cybersecurity talent equals diverse ways to solve problems. Female CISOs scored
    higher than their male counterparts in both leadership (46%) and analytical skills
    (150%), according to analysis from Fortinet.


    Diverse teams enable innovation and creativity. Not only do people with diverse
    backgrounds bring new information and perspectives, but simply having diverse
    teams in an organization forces other workers to prepare better, to be open to
    alternate viewpoints, and to strive harder to reach consensus.


    Of course, correlation does not equal causation; greater diversity in corporate
    leadership doesn''t automatically translate into more profit, according to McKinsey
    (cited earlier). But the correlation does indicate that when companies commit
    themselves to diverse leadership, they become more successful.


    ## Bridging the Skills and Diversity Gaps


    Actively working to bridge the diversity gap also helps bridge the skills gap
    because in so doing your organization opens the doors to additional cybersecurity
    workers—women and underrepresented people of color—you may not have considered
    before. Instead of hiring for cultural fit, CISOs and those hiring in cybersecurity
    should be more open to candidates who don''t look like them, who have different
    experiences and different backgrounds, and who are outside their circle of friends
    and colleagues.


    Speaking of opening doors, open houses and job fairs are effective ways to get
    good candidates of all varieties into your organization. As you sift through candidates,
    tweak your résumé-evaluating algorithms to allow consideration of applicants who
    do not necessarily check every box on your qualifications list. The added value
    and contributions these diverse candidates bring can make up the difference in
    missing skills. Then, your organization can support these new employees in earning
    any needed certifications and training to close their personal skills gaps.


    Military veterans and their spouses represent another pool of skilled workers
    who are poised to bridge the skills gap. Many veterans are highly trained in technology.
    When asked about their veteran colleagues, more than 40% of respondents to the
    Fortinet skills shortage survey cited their work ethic, their attention to detail,
    and their ability to work in fast-paced, high-stress environments. Respondents
    also praised veterans'' decision-making abilities, discipline, and can-do attitude.
    Ideally, those values will spill over into your entire corporate culture.


    While new hires are important, not all of your cybersecurity workers have to come
    from outside your organization. One way to increase your supply is to recruit
    from within. Leveraging existing staff to make lateral moves to join your security
    team and building on their existing skills and expertise could provide another
    avenue to hiring. This is an excellent way to grow those employees'' skill sets
    while producing cross- and multi-disciplinary teams and creating greater collaboration.
    All cybersecurity workers do not need to be technology-based experts. Human resources,
    marketing, communications, and other functional workers may have the ability to
    contribute by building on their existing skill sets.


    Once cybersecurity professionals are on the job, you want them to stay. But many
    of your fellow cybersecurity leaders as well as the workers on their teams are
    keeping one eye on the exit. More than half of CISOs said senior security leaders
    remain in their jobs for an average of less than three years.


    Improving corporate culture, both overall and specifically for a diverse workforce,
    is critical. The skills gap is a major part of the problem. Overall, cybersecurity
    workers feel overworked. Two-thirds of respondents working in organizations that
    have been impacted by the skills gap say that the shortage of cybersecurity workers
    has resulted in increased workload on the existing staff, according to a 2019
    ISSA/ESG survey.


    To retain talent, it''s critical to cultivate a culture of inclusiveness where
    candidates from diverse backgrounds can not only survive, but thrive. That culture
    isn''t always present today. As stated earlier, both women and underrepresented
    people of color report bias and discrimination in technology jobs. A culture of
    inclusion produces numerous benefits across the organization, including positive
    impacts on employee roles in cybersecurity retention, engagement, and financial
    performance.


    Status, perception, and company politics are also important. Corporate leaders
    often see cybersecurity as a cost center, comparable to the after-hours cleaning
    service, because it doesn''t bring in revenue. That approach is short-sighted
    and is rapidly evolving, thanks to the pressure boards of directors are putting
    on companies'' cybersecurity programs. The rise in litigation against CEOs and
    boards of directors regarding data breaches and failure to implement risk management
    plans has resulted in a media frenzy. Moreover, in 2018 the Securities and Exchange
    Commission provided guidance with strong views regarding the board''s essential
    role in the statement “cybersecurity risks should be disclosed if cybersecurity
    risks are material to a company''s business.”


    Consequently, even though cybersecurity doesn''t bring in revenue, a good cybersecurity
    program saves money: the average cost of a data breach


    Additionally, increasing pay is an important way to attract new talent and retain
    the people you already have. In 2016 the federal government


    Building out your five- to fifteen-year pipeline of workers is similarly important.
    Encourage your company to sponsor hackathons, coding contests, school visits,
    and other programs for middle and high school students, especially girls and underrepresented
    people of color, to encourage interest from students.


    For high school and college students, your organization can sponsor shadowing
    opportunities, apprenticeships, and internships to attract your cybersecurity
    team members over the next five years and possibly your CISO ten years down the
    line.


    ## Advice for Those Starting a Career in Cybersecurity'
