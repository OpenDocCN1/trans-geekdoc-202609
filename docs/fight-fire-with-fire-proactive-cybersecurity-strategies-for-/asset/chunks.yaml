    — Renee Tarun，Fortinet 副首席安全官


    # 关于作者


    ![](img/fbetwuf001.png)


    Renee Tarun 是 Fortinet 的副首席安全官（CISO）。她在美国情报界、国防、执法部门以及全球私营实体拥有二十多年的信息技术和网络安全经验。


    Renee 在 Fortinet 专注于企业安全、合规治理以及产品安全。在加入 Fortinet 之前，她曾担任国家安全局（NSA）网络事务主任特别助理以及
    NSA 网络任务组主管，在此期间她制定了机构战略以及白宫的网络安全政策。


    此外，Renee 曾在国家安全局、国防和美国特勤局担任过多个角色，专注于开发与工程、网络战略、运营、资源配置和关系管理。


    Renee 是乔治·梅森大学 Volgenau 工程学院的董事会成员，并且旨在保护儿童网络安全的书籍《网络安全》（*Cyber Safe*）的合著者。


    # 致谢


    本书是一项协作工作，涉及来自政府和私营部门的许多多元网络领导者和专家。如果没有他们的见解贡献和思想领导力，这一切是不可能的。他们的投入和精力不断突破边界，使我们的网络世界更加安全、更加可靠。


    我要感谢 Fortinet 整个团队在本书创作过程中提供的支持，并为我提供了分享帮助全球技术领导者的见解和知识的机会。


    # 贡献者


    - **Sonia E. Arista**

    - **Marianne Bailey**

    - **Fatima Boolani**

    - **Beth-Anne Bygum**

    - **Laura Deaner**

    - **Lisa Donnan**

    - **Suzanne Hartin**

    - **Susan Koski**

    - **Jenny Menna**

    - **Mel T. Migriño**

    - **Sanju Misra**

    - **Terry Roberts**

    - **Maria S. Thompson**

    - **Anne Marie Zettlemoyer**


    # 引言


    ***RENEE TARUN***


    数字化转型和不断变化的威胁格局显著改变了首席信息安全官（CISO）和安全决策者的角色。


    传统的 CISO 职责（如补丁管理和事件响应）比以往任何时候都关重要，但当今的 CISO 还必须关注供应链风险、无数隐私法规以及 5G 技术。在应对传统和新兴威胁的同时，CISO
    还面临着人才短缺的压力：没有足够的人手工作。


    这些与网络安全交织在一起的挑战正迫使 CISO 采取更全面的方法，来平衡风险、安全和战略性业务支持。


    技术并不是解决我们所面临的安全困境的唯一方法。安全领导者必须处理人员、流程和技术，通过综合运用创造出既能管理风险，又能以当今经济的速度推进业务目标的安全解决方案。


