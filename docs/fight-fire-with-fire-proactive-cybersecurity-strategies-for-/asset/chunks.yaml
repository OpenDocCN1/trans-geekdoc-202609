- raw: 'What does it mean to build a culture of security in a business? All too often,
    the security organization is associated with the voice of “no.” Given the pace
    of the digital economy and the business need to be proactive for competitive advantage,
    security must be an embedded part of all solutions. Instead of saying “no,” a
    security organization must be able to say “yes” while detailing the operating
    conditions that enable that yes. If security is seen as the voice of “no,” then
    serious security risks may not be identified, placing the business and company
    at a greater risk. The security organization must evolve to become a trusted advisor
    to the business.


    The pinnacle of achievement is when, instead of being avoided, the security group
    is actively sought out for advice. Businesses reach this pinnacle when the culture
    of security is so embedded that when new or changing initiatives are presented,
    security is woven in throughout the design, build, and implementation. Without
    this embedded culture of security, solutions will be delivered without the proper
    controls, which can lead to breaches and to customer and shareholder dissatisfaction.
    The CISO''s job—and everyone''s job—is to enable the business to drive their car
    as fast as they need to with the proper safety measures such as brakes, air bags,
    and seatbelts in place to attain an acceptable safety level.


    Depending on where the security organization is relative to maturity, this can
    seem daunting. If approached with relationship management, communication, and
    awareness, it can be a fun journey where everyone at the company, not just those
    in the security group, has security as their job. The security group must build
    trust and deliver business-enabling capabilities. These capabilities can be both
    tactical—keeping the lights on—as well as creating capacity within your security
    group to get a seat at the strategy table with business leaders.


    As a CISO, this is an incredible opportunity to win the hearts and minds of your
    constituents so that they become security advocates. The ultimate success is when
    your phone is ringing and your email is filled with requests from the business.
    Always take those calls, answer those emails, and listen. Once you have the audience,
    make sure that you sustain and keep those customers because winning them back
    is harder than winning them over.


    This will not be easy, but when it is achieved, security has a consistent seat
    at the table and is viewed as a valued business consultant. Now, let''s get started
    on our journey!


    ## The Building Blocks of the Journey


    Cultural change must occur in tandem with the growing maturity of the security
    program. This is important because organizational awareness should build as the
    maturity of the security program increases. As the foundational elements for maturity
    are achieved, security can evolve from alignment to risk tolerance to consultancy.
    To evolve to consultancy, there must be mature services to offer so that during
    the consultancy, risk-aware advice can be offered that is aligned with the risk
    of the business objective.


    What are the building blocks for the journey to a high-performing security organization
    that has the trust, respect, and ear of the business? [Figure 3-1](#c03.xhtml#c03-fig-0001)
    shows the evolution from building a foundation to becoming a trusted advisor.
    The rest of this chapter describes the building stages of the security program
    and their alignment with building a culture of security awareness.


    The cultural elements of security include:


    *   Leadership and organizational support


    *   Communications


    *   Measuring effectiveness


    *   Measuring engagement


    *   Relationship management


    In [Figure 3-1](#c03.xhtml#c03-fig-0001), these cultural elements are in *italic
    text*.


    ![Figure 3-1. The evolution of a culture of security awareness](images/c03f001.png)


    [*Figure 3-1*](#c03.xhtml#R_c03-fig-0001). *The evolution of a culture of security
    awareness*


    ## Program and Cultural Foundation


    Establishing a foundation for the security program is critical. Even if there
    is already a program in place, revisit these foundational areas to ensure the
    foundation is strong and includes needed elements to achieve broader cultural
    awareness.


    ### Leadership Support


    Support from executive management is requisite to obtaining outcomes aligned with
    corporate risk tolerance that achieve the target maturity. Organizations follow
    their leaders, so this support is crucial to enable the willingness to provide
    the funding to achieve required changes. Organizational willingness is very closely
    tied to understanding the perceived tone and tenor of the security organization
    and what it delivers to the company.


    ### Communication and Awareness Plan


    A communication plan must be combined with an awareness plan. Security must communicate
    their current posture and programs and ask for input from the business. This plan
    should include where, when, and how the security program should be communicated.
    Consider not only how the security organization will provide the business awareness
    but also how the group will gain awareness about the business and the forums to
    participate in to do so.


    ### Net Promoter Score


    Net promoter score is commonly used to measure customer loyalty. An understanding
    of the perception of security from revenue and non-revenue-generating parts of
    the business is necessary to establish a baseline of the opportunities to change
    the awareness of both the security team and the entire business. Security leaders
    can often be perceived as lacking business acumen or empathy. Measuring the perception
    of the security organization is one of the first steps in building a culture of
    security awareness.


    To establish a methodology for capturing the net promoter score, security teams
    should engage with the marketing, communications, and human resources departments.
    These groups can serve as a starting point for grassroots support for security
    and become an extension of the security team. Ensure that security listens to
    and embraces the suggestions of these teams in order to learn from both the promoters
    and the detractors.


    ### Funding Approval


    Funding for key personnel demonstrates leadership support to build the program
    to attain the level of needed maturity. Often, technical personnel are not the
    best consultants, so thoughtful consideration must be given in the hiring process
    to find subject matter leaders who are great communicators. These leaders must
    be able to understand the needs of the business, solutions available, and solutions
    needed. Security leaders must excel at storytelling in the language of the business.


    ### Gap Assessment


    Assessing security capabilities for gaps in both functionality and staffing is
    critical because it is necessary to have the right capabilities and consistently
    deliver those capabilities. If the building blocks of the program are not available,
    the security team will not be able to deliver a service to the business to enable
    its safety and security.


    First, take stock of what security capabilities exist and measure them against
    an industry framework. What capabilities are missing? Are they critical to support
    the business? Are these the right capabilities, and are there opportunities to
    streamline solutions to leapfrog in maturity? Instead of multiple best-of-breed
    solutions that do not integrate, how do you migrate to platform-level integrated
    stacks that work together seamlessly to deliver the capability? Build out the
    plan to enable these capabilities and prioritize it based not only on risk reduction
    but also on the value that is delivered—and perceived—by the business.


    ### Target Maturity Defined


    From the gap assessment, attain agreement from leadership on the risks and the
    acceptable security maturity level for your firm. Once in agreement, ensure that
    the security program has ways to convey accomplishments in terms that are meaningful
    to the business.'
  fmt: "\nWhat does it mean to build a culture of security in a business? All too\
    \ often, the security organization is associated with the voice of “no.” Given\
    \ the pace of the digital economy and the business need to be proactive for competitive\
    \ advantage, security must be an embedded part of all solutions. Instead of saying\
    \ “no,” a security organization must be able to say “yes” while detailing the\
    \ operating conditions that enable that yes. If security is seen as the voice\
    \ of “no,” then serious security risks may not be identified, placing the business\
    \ and company at a greater risk. The security organization must evolve to become\
    \ a trusted advisor to the business.\n\nThe pinnacle of achievement is when, instead\
    \ of being avoided, the security group is actively sought out for advice. Businesses\
    \ reach this pinnacle when the culture of security is so embedded that when new\
    \ or changing initiatives are presented, security is woven in throughout the design,\
    \ build, and implementation. Without this embedded culture of security, solutions\
    \ will be delivered without the proper controls, which can lead to breaches and\
    \ to customer and shareholder dissatisfaction. The `CISO`'s job—and everyone's\
    \ job—is to enable the business to drive their car as fast as they need to with\
    \ the proper safety measures such as brakes, air bags, and seatbelts in place\
    \ to attain an acceptable safety level.\n\nDepending on where the security organization\
    \ is relative to maturity, this can seem daunting. If approached with relationship\
    \ management, communication, and awareness, it can be a fun journey where everyone\
    \ at the company, not just those in the security group, has security as their\
    \ job. The security group must build trust and deliver business-enabling capabilities.\
    \ These capabilities can be both tactical—keeping the lights on—as well as creating\
    \ capacity within your security group to get a seat at the strategy table with\
    \ business leaders.\n\nAs a `CISO`, this is an incredible opportunity to win the\
    \ hearts and minds of your constituents so that they become security advocates.\
    \ The ultimate success is when your phone is ringing and your email is filled\
    \ with requests from the business. Always take those calls, answer those emails,\
    \ and listen. Once you have the audience, make sure that you sustain and keep\
    \ those customers because winning them back is harder than winning them over.\n\
