- raw: 'The software involved to communicate with edge points in these sectors, if
    not properly vetted, updated, and protected, opens up the potential for security
    risks, especially if data and commands are transmitted over open internet channels.
    Rapid go-to-market pressures to engineer APIs to promote system integration often
    reduce the amount of security review performed, and proper due diligence, from
    a cyber perspective, is overlooked. Bad actors then have the opportunity to manipulate
    this software through code injection and other techniques to compromise safety,
    steal personal and financial information, or otherwise cause harm and chaos.


    ### Device-Specific Approach Leads to Increased Risk


    As more manufacturers enter the market, they''re creating and defining their own
    edge processing chips and semiconductors, instead of using generic components.
    For example, Apple released its M1 chip in November 2020, and the company is moving
    toward consolidating multiple computing functions into one component. The goal
    is to create a chip optimized with processing specific to the device itself. The
    data doesn''t have to transfer out—to the data center or to the cloud—for computational
    power or rely on other parties for operating systems to enable the software functionality.
    Your phone is a perfect example.


    Although this strategy supports operational optimization of device functions,
    this self-contained, device-specific approach creates variability among processing
    components, which leads to increased complexity, risks, and vulnerabilities. From
    a security management point of view, this level of variability across all the
    computational devices in the enterprise will exacerbate two traditional information
    security challenge areas: patching and supply chain vulnerabilities. Testing and
    patching in highly proprietary or closed systems relies heavily on manufacturers''
    release and remediation schedules (think Microsoft). The added variability among
    components also leads to challenges in visibility and maintenance of these individualized
    subcomponents and, therefore, more cyber risks in the supply chain.


    On the edge, with proximity detonation of exploits, the identification and remediation
    timeline become nil. As the point of processing moves closer to the edge, these
    various standards within operating system–specific processors make it harder for
    cybersecurity professionals to identify indicators of compromise. In many cases,
    unless an operational disruption or other indicator event occurs, cyber events
    poised at data theft or data integrity compromise may never be identified by the
    user or the enterprise.


    ## Moving Toward Solutions: Taking Stock


    Another challenge is knowing and understanding all the technology in play in your
    enterprise. Not only are many companies seeing enormous organic growth of their
    workforce, but mergers and acquisitions in the last several years have also expanded,
    as traditional business models are trying to add high-tech enablement to their
    service portfolio and products.


    Companies need to iteratively take stock in terms of knowing what edge devices,
    software, apps, and code are deployed in their enterprises, including those adopted
    by employees on their own. Most importantly, these information security programs
    must be able to scale and accommodate increasing regulatory controls. The current
    state of international and domestic legislation and industry guidance is woefully
    behind technological innovation and use.


    Finally, a firm understanding of service providers and partners (even those that
    are used tangentially) to help your operations is critical. For example, after
    the SolarWinds breach, the question of the day was: are you using SolarWinds?
    What version, or what modules? Many security leaders did not know and first had
    to check—not only their environments, but their core service partners. That lack
    of initial knowledge delays remediation and poses a greater risk.


    ### Defining What You Have


    One of the most fundamental gaps in many businesses is that they really haven''t
    taken the time to categorize what constitutes their own intellectual property—many
    in the industry refer to this as protecting your crown jewels. The rush to beat
    the competition to market has outweighed management of data integrity controls
    and assurances. For example, in the software development space, go-to-market pressures
    mean teams are coding feverishly to release new software and upgrades to meet
    customer demand. In the process, they take security shortcuts and fail to categorize
    what they''ve created, or they keep building on unstable platforms and old infrastructure,
    accruing enormous technical debt.


    Regardless of the type of business or industry vertical, many organizations also
    have a large pool of unstructured data built up over time, including data acquired
    from third parties—the unstructured data dilemma.


    Although you''d think that a large pool of data would be more likely to yield
    representational insight, algorithmic bias is a real problem as is the chance
    that a large subset of data is missing, or perhaps results are skewed and functionality
    is developed with faulty logic.


    Particularly with companies now reselling customer datasets as part of their revenue
    model, this mining of highly or nonidentified data can pose a big problem and
    skew results. Getting the right data subset to software architects and engineers—and
    ensuring those engineers have the right level of access to certain DevOps environments—is
    critical to ensuring accurate results from AI and ML.


    Without the right access and security protocols, data that is iteratively downloaded
    and uploaded over time could become degraded, contaminated, and vulnerable. This
    danger has become more intense as large volumes of data dilute the visibility
    of any, potentially small, contamination. In this environment, data governance
    is more important than ever.


    Further, as noted earlier, your workers are using their own edge devices—phones,
    tablets, laptops—and often their own apps and software in your enterprise. In
    the distributed workforce scenario, once an employee initiates or introduces the
    use of new software or a new device at the edge, the potential for enterprise
    data leakage, loss, and contamination is significant.


    When that new software or device accesses corporate data that is uncategorized,
    data loss protection tools can''t encrypt or otherwise secure that intellectual
    property—it''s available and potentially exposed to bad actors who know where
    to look. That scenario is the equivalent of putting your personal pictures, your
    tax documents, or perhaps your coveted research into the equivalent of an open
    folder on the internet. *You can''t protect what you don''t know you have*.


    Building in the time and processes to categorize data, software, code, processes,
    and edge devices used in your enterprise will enable your security team to then
    properly employ data loss protection (DLP) and cloud access security brokers (CASBs)
    to secure and protect your enterprise''s intellectual property.


    As a security program implements solutions like CASB and DLP filters within their
    environment, what they are really trying to gain is improved visibility of enterprise
    or corporate data. In some cases, there are clear compliance reasons to do this
    because some subsets of data are protected through federal legislation like HIPAA
    or industry standards like PCI, and identifying and protecting these data assets
    is required.'
