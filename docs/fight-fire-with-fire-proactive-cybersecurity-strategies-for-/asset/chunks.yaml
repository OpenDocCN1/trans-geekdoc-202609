    # 1 从技术专家到战略家


    ***SANJU MISRA***


    如果你问百位信息安全和风险领导者是如何进入这个领域的，我确定你将听到很多的故事。


    我从以前没有考虑过信息安全职业。我当时是一个生物学专业的学生，对计算机在该领域能做什么感兴趣，但对编程并不感兴趣。我通过打论文和期末报告来帮助同学，用的是一台可靠的
    Smith-Corona 打字机。

    '
