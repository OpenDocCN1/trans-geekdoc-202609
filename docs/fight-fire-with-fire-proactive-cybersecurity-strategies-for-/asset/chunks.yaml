    [content]

    # 1 From Technologist to Strategist


    ***SANJU MISRA***


    I am glad that this book is broken into three sections: people, process, and technology.
    There is so much we need to do in each area to have a successful security program.
    I hope to engage you to reflect on your career.


    In this chapter, I will share my experience and observations on making the leap
    from technologist to `CISO`. The `CISO` is a trusted strategist who has a seat
    at the table, both internally, speaking to business leaders about risk and what
    keeps them up at night, as well as externally, speaking to the board of directors.
    In these contexts, it is not important that you display your technical acumen.
    It is assumed you have weighed the technical considerations as part of your viewpoint.
    Rather, your ability to transcend technical explanations and frame issues in terms
    of business risk is what allows you to be heard, to be understood, and to be successful
    in protecting the enterprise at a level appropriate for the risk tolerance of
    the company.


    ## A Path to CISO


    If you asked a hundred information security and risk leaders how they got involved
    in the field, I''m sure you''d hear some interesting stories.


    I never thought about an information security career early on. I was a biology
    major with an interest in what computers could do for the field, but not in programming.
    I helped fellow students with their essays and term papers by typing up their
    final presentations yup, on a trusty Smith-Corona.


    When there was an opening to work part-time in the computer lab, I took it. The
    job made me learn more about how computers work by troubleshooting student questions
    about printing, using spreadsheets, and saving documents.

    '
