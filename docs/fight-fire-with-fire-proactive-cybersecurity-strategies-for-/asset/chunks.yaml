    网络安全领域女性领导者的匮乏加剧了性别差距，因为女性榜样（如果她们存在的话）既能激励女性进入该领域，又能帮助她们向前发展。


    根据 `(ISC)²` 的《包容性创新》（Innovation Through Inclusion），少数族（美国人口调查局定义为黑人、美印第安人、亚洲人、太平洋岛民、西班牙裔或两个或多个种族）正在取得进展，但结果参差不齐。


    ### 坏消息是：


    *   少数族担任网络安全领导职位的可能性较低。只有 23% 的少数族网络安全专业人士担任总监及以上职位，而高加索人同伴的比例为 30%。

    *   少数族收入较低：为 `$115,000`，而美国网络安全从业人员的平均水平为 `$122,000`。网络安全领域的有色人男性收入比白人男性少 `$3,000`。

    *   有色人女性的情况最糟糕；她们的收入平均比白人男性少 `$10,000`，比白人女性少 `$6,000`。

    *   与其他种族和民族相比，高加索工人更有可能在过去一年内获得过加薪。

    *   近三分之一（32%）的少数族网络安全专业人士报告说他们在工作中经历过歧视。


    ## 多元化团队的力量


    招聘和促进多样化不仅是正确的事的事；多元化团队还能推动业务成功。例如，种族多样性的增加与创新型银行财务表现的提升明显相关（科学美国人）。


    ### 关注性别差距的全球调查


    仅解决网络安全领域的性别差距对美国经济就会产生重大影响。缩小网络安全的性别差距将为美国经济带来 `$30 billion` 的增长，如果女性收入能与其男性同事相当，还将额外增加
    `$12.7 billion`（福布斯科技委员会）。


    财务表现的提升是情合理的，因为网络安全人才多样性的增加意味着解决问题方式的多样化。根据 `Fortinet` 的分析，女性 `CISOs` 在领导力（46%）和分析能力（150%）方面的得分均高于其男性同事。


    多元化团队能够激发创新和创造力。不同背景的人不仅带来了新的信息和观点，而且在组织中拥有多元化团队本身就能迫其他员工做好更好的准备，对其他观点保持开放，并更加努力达成共识。


    当然，相关性并不等于因果关系；根据 `McKinsey`（前文引用），企业领导层多样性的提高并不会自动转化为利润。但这种相关性确实表明，当公司致力于多元化领导层时，它们会变得更加成功。


    ## 弥合技能差距与多样性差距


    积极致力于缩小多样性差距也有助于弥合技能差距，因为通过这样做，你的组织为之前可能没有考虑过的额外网络安全人员——女性和代表性不足的有色人士——打开了大门。`CISOs`
    和网络安全领域的招聘人员不要仅仅根据文化匹配度进行招聘，而应该面对那些与他们外不同、具有不同经验和背景、且处于他们朋友同事圈之外的候选人。


    说到打开门，开放日和招聘招聘是吸引各种优秀人才进入你组织的有效方法。在筛选候选人时，调整你的简历评估算法，允许考虑那些并不一定符合你资格列表上每一项要求的申请者。这些多元化候选人带来的额外价值和贡献可以弥补技能的缺失。然后，你的组织可以支持这些新员工获得所需的证书和培训，以弥补他们的个人技能差距。


    建立未来五到十五年的人才储备库也同样重要。鼓励你的公司赞助黑客松、编程比赛、学校访问以及针对初中和高中学生的计划（特别是针对女孩和代表性不足的有色人士），以培养学生的兴趣。


    对于高中和大学生，你的组织可以赞助影子计划机会、学徒制和实习，在未来五年内吸引你的网络安全团队成员，可能在十年后吸引你的 `CISO`。


    ## 给网络安全职业初学者的建议


