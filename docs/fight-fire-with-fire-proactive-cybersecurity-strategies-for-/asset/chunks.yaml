- raw: 'Since usernames and passwords are often a prime target for adversaries and
    are often compromised, organizations need to consider an additional layer of authentication
    such as multi-factor authentication. Once a user is authenticated, role-based
    access control (RBAC) gives users access rights and services based upon their
    specific role within the organization.


    Organizations have more devices than ever connecting to their environments, including
    an influx of business-enabled IoT devices and organizations adopting bring your
    own device (BYOD) policies. Security teams need to have visibility into all these
    devices to see their type, function, and purpose for being on the network. Network
    access control (NAC) technologies can help implement ZTA by enabling security
    teams to discover and classify devices, establish proper access controls, and
    provide continuous monitoring and remediation to threats before they spread to
    the rest of the network.


    The zero-trust model also works for applications. Zero-trust network access (ZTNA)
    creates brokered access to applications for users. It''s a way of controlling
    access to applications regardless of where the user or the application resides.
    Applications can be in data centers or in the cloud, and users can be in the office
    or working remotely.


    Traditional remote access was handled by VPNs that provide unrestricted access
    to the network, based on the premise that once a user or device passes network
    perimeter controls, they are presumed to be trusted. On the contrary, ZTNA takes
    the approach that no user or device can access anything until they prove themselves
    trustworthy. Therefore, organizations should evolve their remote access from VPNs
    to a ZTNA solution. Such solutions can provide a better user experience and provide
    a more granular set of security protections.


    Today''s increasing threats require zero-trust access to be more than a buzzword;
    it must be an integral part of your security architecture. Since locking down
    the network is rarely a viable option, you have to balance security and accessibility
    to be successful. Zero-trust access makes it simpler for CISOs to discover all
    the users and devices accessing the network and to manage their associated security
    risks.


    ## AI-Driven Security Operations


    Humans, even the best security analysts, don''t have the time or ability to sift
    through and comprehend the massive landscape of data and to perform manual detection
    correlation. The vast amount of unaggregated security data makes it hard to see
    what''s happening and prioritize threats.


    The average SOC receives more than 10,000 alerts per day, and the large enterprises
    see more than 150,000 alerts per day. Meanwhile, IT teams are understaffed or
    undertrained (due to the cybersecurity skills gap) and can''t keep up with the
    alerts. Yet these teams ignore or overlook alerts at their peril: a single alert
    may be the difference between detecting and thwarting a major incident and missing
    it entirely. In addition, the need to demonstrate compliance with security and
    privacy standards and laws takes precious time away from threat identification
    and response.


    A platform powered by AI and machine learning can help discern and respond to
    threats in real time. AI and automated tools simplify network management across
    these environments, alert security teams to imminent threats, and process an automatic
    threat response. AI can continuously sift through mountains of data collected
    from devices to identify threats. It can also automatically investigate the influx
    of alerts that traditionally required manual input from security teams, enabling
    teams to be more efficient. AI-powered platforms free security teams to spend
    more time honing strategy, researching advanced threats, and cultivating a cyber-aware
    culture.


    As security teams face a continuously expanding threat landscape and more complex
    environments, throwing more bodies at the problem does not scale. Therefore, organizations
    need to adopt key AI-driven and automated capabilities to facilitate fast and
    effective security operations. This array of technologies includes endpoint security,
    advanced threat protection such as sandboxing and security operations platforms
    such as SOAR, endpoint protection, and extended detection and response (XDR).


    ### Endpoint Security Solutions


    An endpoint is the last line of defense in many ways. It''s your laptop, your
    phone, and your smart device that downloads updates. At enterprise scale, endpoints
    include all such devices, both corporate issued and personal devices used for
    work.


    Endpoint detection and response (EDR) solutions can identify threats in your network
    and then respond to those threats. An EDR solution can analyze the nature of the
    threat and give your IT team information about how the threat was initiated, which
    parts of your network it attacked, the current status, and how to stop the attack.


    EDR solutions target advanced threats that, because they are engineered to get
    past primary defenses, get into your environment. EDR solutions further protect
    your network by containing the threat and preventing it from spreading.


    Of course, it is better to stop threats before they get that far. An endpoint
    protection platform (EPP) targets threats as they enter your network to shut them
    down before they compromise any endpoint on your network. However, it is nearly
    impossible for an EPP to provide 100% protection and keep all threats from penetrating
    your systems. You must be able to do remediation. Therefore, an effective endpoint
    security strategy often includes both EDR and EPP.


    ### Sandboxing


    Sandboxing protects your network and your enterprise by setting up a test area
    or “sandbox” to see if particular code is deemed safe or unsafe. It confines malware
    and malicious code to an area separate from the rest of your network. A malware
    sandbox restricts the actions of an application to this isolated environment.
    Within this safe zone, the sandbox analyzes the behavior of an object. If something
    bad happens, it affects only the sandbox and not the other computers and devices
    on the network. In parallel, any malicious code is quarantined in the sandbox
    so it does not spread to the rest of the enterprise.


    ### Security Orchestration, Automation, and Response (SOAR)


    At a basic level, security operations focuses on looking at various logging, reporting,
    and analytics, often from multiple panes of glass. As organizations mature, they
    require a security architecture that enables the unified collection and analysis
    of data from diverse information sources and multivendor tools, including logs,
    performance metrics, security alerts, and configuration changes. For most organizations,
    this requires security information and event management (SIEM) capabilities to
    collect and analyze data combined with a distributed event correlation engine
    to enable complex event pattern detection. The next phase is automated responses
    through SOAR technologies, which allow separate security components to communicate
    and interoperate.


    SOAR solutions combine three software capabilities: managing threats and vulnerabilities,
    responding to security incidents, and automating security operations. SOAR solutions
    in a security platform allow organizations to collect data about security threats,
    correlate information, and then automatically respond to security events in real
    time without human intervention. SOAR solutions identify threats and implement
    a response strategy. The system is automated, to the extent possible, to make
    it run more efficiently. SOAR solutions empower your team by enriching data with
    context.'
