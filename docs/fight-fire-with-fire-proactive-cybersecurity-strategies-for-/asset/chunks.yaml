- raw: 'It seems simple, but security teams fail at this all the time. We overcomplicate
    and cite rules instead of teaching principles, measuring, and providing feedback
    on performance. We stop short of explaining the “why” and fail to contextualize
    findings or explain threat models in relatable terms. We deploy tools that produce
    too much data or too many false positives for anyone to understand or act on,
    resulting in alert fatigue and apathy. We talk in “what- ifs” to engineering teams
    who are used to working in binary terms—the code works or it doesn''t; the light
    turns on or it doesn''t. What-ifs are met with eye rolls. The reality is, both
    sides need to do something different to get different results.


    We need to become really good teachers, storytellers, and coaches. The latest
    industry ratios are about 100:1 for developers to security engineers—and that''s
    for companies that have invested in the process.


    The bottom line: There will never be enough security engineers to go around. We
    can''t possibly look at everything. We need to multiply our skill sets and mindsets
    across developer populations to scale security knowledge and efforts. This means
    realizing that most in-seat developers are not taught security principles or secure
    coding practices as a core part of the curriculum. It also means that many don''t
    realize or have not been educated in “the art of the possible” when it comes to
    security concerns.


    We often forget that while many of us live and breathe this stuff, most other
    folks do not. The impact of an incident is not usually top of mind until it happens,
    and the resulting interest will wane over time. This is starting to change as
    engineering curriculums evolve; however, chances are that the folks in the seats
    right now could use a hand figuring out what to do. And no, that does not mean
    relying on the annual thirty-minute security compliance training. We can all have
    an eye roll at that.


    ### Secure Code Training—Up Front and Then Some


    I''ve been in eight industries and worked with over twenty organizations either
    in-house or as a consultant. In all of those scenarios, what I remember most—even
    from experiences decades ago—is the orientation and onboarding process. It set
    the tone for the business, set the expectations of work, and fostered close relationships
    with folks who started on the same day as I did. Our shared experience of the
    first day, the “class of” if you will, helped build relationships that persist
    even now—years down the road.


    In one of my past lives, I worked for the government—both as a federal employee
    and as a contractor in high-security organizations. The security briefings on
    those first days were powerful. I remember them, even ten years later. I remember
    the expectations they set, the threats they highlighted, the impact if realized,
    and what my role was in supporting the security mission and also how I might be
    targeted. It was personal, from day one.


    Not all companies put security up front in the orientation process, however. The
    lack of messaging was noticeable to me for obvious reasons, but it''s rarely missed
    by those outside of the security world. It just wasn''t top of mind.


    The orientation process is a unique opportunity to communicate what is important
    to the business, and important for the employee to remember. This is the ideal
    time to train developers in how to code securely, what the security standards
    are, and so on *before* they touch the code.


    A secure coding boot camp (whether for a few days or a week), a program that includes
    interactive mentorship and real-world examples, will pay dividends down the road.
    Got developers in the seat already? Send them too. Many companies have budget
    and expectations for continuous learning for their employees. Some even require
    a number of hours of training a year as part of their performance measurement.
    In a skill-up year, you might be able to negotiate classes for cohorts of existing
    employees to go to the security engineering bootcamps. You could even incorporate
    this into a security champion program where developers are nominated by their
    management to attend—and most importantly, allocated time to do so. This practice
    of nomination, combined with some support from HR, can shift a developer''s reaction
    from “I have to do this” to “I get to do this,” with a developer viewing the designation
    of a security champion be one of prestige and not burden.


    ### Getting Buy-In to Build


    Even when folks know what to do and why, you will still run into the “so-what”
    response. Every team has to compete for time and resources in order to bring their
    new ideas to fruition—building a security-by-design capability is no different.
    As a security leader, you''ll have to sell the merits of your secure development
    program and demonstrate why it''s worthy of immediate and sustained buy-in, time,
    and budget. Here''s where the art of storytelling coupled with all of that relationship
    building kicks in.


    ### Make It Relatable, Make It Important, and Back It with Data


    You might be surprised how many decision-makers get their security news from headlines
    in mainstream media and publications. You might also be surprised how many folks
    believe that their app or their practice could not be a target. “Our app doesn''t
    have any PII or money flowing through it. What''s the risk?” they say. If it touches
    other systems, it could be a valuable soft target for an attacker to leverage
    in order to get to a bigger target.


    “Could this happen to us?” and “What could happen to us?” are questions you want
    to be ready and honored to answer. The art of storytelling in this sense involves
    contextualizing the what-ifs and the experience of others into something that
    is relatable to your environment.


    Security conversations are expanding. Where they used to almost solely focus on
    data breaches, they''ve grown to include questions on more disruptive campaigns
    including ransomware or destructive attacks. With celebrity-level hacks and campaigns
    like the NotPetya destructive attacks (2017), the SolarWinds espionage campaign
    (2020), and the Colonial Pipeline ransomware incident (2021), organizations are
    becoming more aware of how what they develop and the technologies they use can
    be weaponized by attackers to not only compromise their company''s assets, but
    also to affect their customers and the public.


    In the case of NotPetya, for example, a trusted update from a small company''s
    widely used tax software was compromised to infect a particular target in a destructive
    attack. The problem was that this update spread to all users, resulting in over
    $10B in collateral damage to unintended targets, including bringing shipping giant
    Maersk, which accounts for more than 20% of the world''s shipping capacity, to
    a halt for days.


    Using examples from headlines to tell the story of potential impact to your own
    organization and relating those examples to how your company develops products
    is only part of the storytelling process. You''ll want to infuse those stories
    with data that can inform the value of what a security-by-design capability can
    bring and how it can be measured for success. We''ve already talked about the
    cost benefits of finding bugs up front in the development process versus afterwards.
    In general, companies spend more time and money finding and fixing flaws in postproduction
    than in the early development environment. According to IBM''s System Science
    Institute, finding a flaw postproduction is six times more expensive than finding
    it preproduction, and fifteen times more expensive to fix in postproduction than
    in preproduction. NIST estimates that organizations can spend twenty-five times
    more on postproduction flaws.'
