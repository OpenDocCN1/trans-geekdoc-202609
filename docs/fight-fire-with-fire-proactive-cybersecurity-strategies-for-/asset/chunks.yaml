    Earlier in this chapter, I acknowledged that our field has not always kept pace
    with the rapid acceleration of technology, advanced computing, and the expanding
    threat landscape. Staying up to date is even more important as we see increased
    attacks where threat actors are leveraging poor code, misconfiguration, or vulnerabilities
    not identified during patching, change control, or periodic reviews. The Information
    Governance Council and the governance lead have a more prominent role now in addressing
    these concerns in partnership with the head of architecture and cyber defense.
    Statistics show that revised proactive technology-informed policies simplify compliant
    practices, address gaps, and accelerate fast adoption.


    ## Delivering Value in a Changing Environment


    Global data privacy regulations continue to adjust, which is partly a reflection
    of changes across the threat landscape. It also reflects reduced tolerance for
    errors or mistakes that originate from basic noncompliant practices. An example
    is seen in recent regulations passed in California. Ten months after the California
    Consumer Privacy Act.


    The new regulations along with economic pressures generated by a prolonged pandemic
    provide a unique opportunity for governance, risk, and compliance leaders in any
    organization to adjust strategy and deliver more value.


    In times like these, management needs revised policy and clear directives that
    ensure compliance while enabling continued innovation. Even slight adjustments
    in strategy create additional value.


    Here are a few concrete examples:


    * Increase and enable automation. Put in place industry frameworks (as described
    later in this chapter) in a manner that enables automation to be easily adopted;
    results make it easier to identify policy gaps across the organization and systems.

    * Add compensating controls such as analytic-based detection tools designed to
    alert when processes or systems deviate from policy.

    * Accelerate the adoption of policy by communicating clear expectations using
    the same terms your information systems, information technology, and product teams
    use. Leaving the interpretation of policy requirements to others creates a delay
    in adopting and implementing the practice.

    * Expand metrics and measures to highlight compliance challenges that could be
    addressed through technology investments.


    ### Quantify Costs—No, Strike That—Quantify Value


    Security and compliance professionals know how to calculate the fully loaded expense
    of operating a compliance and assurance function. However, we should not stop
    there. Aligning technology and compliance metrics and reporting dashboard strategies
    create an opportunity to convey traditional assurance practices in terms of business
    value and contribution. Compliance-related metrics, demonstrating adherence to
    requirements and regulations, encompass several areas. Examples include metrics
    associated with:


    * Adherence to policies and requirements

    * Metrics and indicators that show where the organization is falling out of compliance

    * Costs associated with potential fines


    Performance measures that demonstrate value to leadership include your service''s
    contribution to reducing enterprise risks. Create visibility for leaders by integrating
    operating costs (such as the expense to process the various types of assessments
    and assurance audits) into the technology road map, current compliance posture,
    and risk reduction metrics.


    Here are a few concrete examples:


    * Develop a dashboard to track the relationship between system life cycle upgrade
    or decommission projects and the reduction of residual compliance risks (such
    as security exposure, regulatory fines, and compliance-related findings).

    * Calculate the increased transference of risk as connected strategic vendors
    and partners carry cyber liability coverage.


    Operational metrics are another area where the compliance lead can transform performance
    and demonstrate value. Here are a few questions to review for your organization:


    * Does an assessment require two or three security and compliance professionals
    to complete? For example, is a senior security engineer required to complete the
    technical portion of an assessment while a GRC professional completes the policy
    review?

    * How is your organization structured? Do you have an overdesigned service model
    where tasks pass multiple times back and forth?

    * How many assessments or types does your team process?

    * Are you leveraging training to increase cross-team skills?

    * How many assessments is your organization processing annually?

    * Do you measure the cost per assessment?


    In my experience working with firms that provide independent audit/attestation
    solutions, costs range from `$5K` to `$15K` for the former and `$150K` to `$350K+`
    for the latter. The average cost to complete an assessment by internal compliance
    department ranges from `$450` to `$1,000` depending upon complexity. The average
    hourly wages of professionals and the number of hours needed to complete an assessment
    further increase operating costs. Incorporate these numbers into your team''s
    value.


    The traditional approach of segmenting tasks—the review for completing security
    assessments, third-party risk assessments, contract reviews, and security assurance
    reviews—requires resources with similar skill sets. Completion increases operating
    costs.


    I share these thoughts from experience. There were times when I reviewed budgets
    and noted the number of resources required to assess risk. I asked myself why
    we require two or three resources to determine risk. If we defend at the level
    of code, we should assess risk at the same level. It was at that point that I
    realized I could operate a more effective and cost-efficient team if the technical
    skills across the organization were balanced. The result was a reduction of duplication
    in Information Governance Council operations, creating value and cost savings.


    This is an example of a process improvement exercise that can identify operational
    efficiency gains and potential areas for adding value to the organization.


    The increased reliance on seamless technology and the approach to ensure compliance
    via digital solutions mean that the heads of architecture, engineering, IT, and
    compliance must also align their road maps to these compliance metrics.


    Such alignment increases early detection of issues before the organization becomes
    noncompliant. These actions create increased value and reduce overall costs associated
    with enterprise compliance risks.


    # 10


    ## Don''t Let Cyber Supply Chain Security Be Your Weakest Link


    ### TERRY ROBERTS


    In the digital age, supply chain risk due to the significant use of information
    and operational technology vendors and service contractors has dramatically expanded
    the threat landscape for all businesses and organizations, making the protection
    of their reputation and revenue far more complex. Today we call this cyber supply
    chain risk management, or C-SCRM—a much-needed discipline, practice, and body
    of knowledge, of ever-increasing focus and emphasis in our interconnected world.
    C-SCRM is challenging for even top security and risk managers not to mention executive
    teams and boards of directors.


    ## What Does C-SCRM Encompass?


    In exploring C-SCRM, let''s start with the NIST definition:

