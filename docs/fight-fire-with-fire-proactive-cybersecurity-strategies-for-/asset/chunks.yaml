    不那么直观的是识别那些随时间有机增长的知识产权。例如，研究数据、`source code`、`client databases`以及`edge devices`中的数据。这些`metadata`的指数指数级增长对管理、`retention`、访问和分发带来了挑战。但在过去几年中，所有市场细分领域相关并购活动的增加，引发了更严峻的挑战，例如所有权的归属，或者更直接的——安全问题。对于组织而言，要追踪其受委托保护的所有数据是极其困难的。


    ## 建立正常功能与行为基准


    长期以来，安全行业一直在从基于特征的类型检测和修复策略，转向与边缘端相关的更具应用性的分析和行为分析。正在受到关注并能够大规模应用的技术，侧重于对对象正常功能状态建立基准，并使用应用分析来确定人员、设备或操作系统的正常行为模式。然后，这些技术会寻找异常或超出范围的行为，并视其为网络犯罪视角下的受损指标。理想的安全技术能够检查行为和上下文的细微差别，以发现即使是微小的异常，向企业发出活动警报，并优化地应用隔离或其他修复策略。


    ## AI 和 ML 可以跟踪边缘安全趋势


    老练的威胁者和网络犯罪分子正积极使用`AI`和`machine learning`。好消息是：这些技术也为防御者提供了新的优势。来自`machine learning`和`AI`的关于新兴且令人担忧的安全趋势的信息以及洞察，可以通过直接同步到现代
    IT 基础设施来加以利用。许多组织专注于行业特定的趋势——即识别在某些市场中具有高被利用概率的威胁。利用`machine-learned insight`来驱动自动修复，是确保低级威胁被阻败的基础，使团队能够专注于更复杂（且对业务有害的）事件的修复。投资于由`AI-`和`ML-`驱动的信息服务吧，这些服务将为您的企业及其边缘节点提供这种涵盖广泛关注和行业特定安全情报的价值聚合。


    ## 识别可接受与不可接受的风险


    正如建议对数据和设备进行分类一样，各个企业必须定义它们如何对风险进行分类。作为安全负责人，你必须确定哪些漏洞是可以接受的，而哪些风险是绝对不可接受的。


    成熟的信息安全计划对什么是明智风险（业务为了实现战略或结果而在短期或长期内选择接受的风险）与可以被机会主义利用、且仅仅源于糟糕的流程、政策或治理的风险具有极高的敏感性。后者应被定义为不可接受风险，并具备所需的治理结构以支持减少这些风险，或者更好，是消除它们。


    `CISOs` 必须超越定义的技术风险；在业务或运营影响的背景下对风险进行分类是关重要的。例如，作为医院的`CISO`，你可能接受服务器无法 24/7 100%
    覆盖`antivirus protection`的风险，但你深知自己无法容忍任何与即将进入手术室并植入患者体内的`edge device`相关的风险。在这种背景下，投资、优先级以及安全风险评估的深度是不言而喻的。


