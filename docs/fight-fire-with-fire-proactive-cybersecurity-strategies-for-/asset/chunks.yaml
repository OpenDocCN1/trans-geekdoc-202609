- raw: "What may be less straightforward is the identification of intellectual property\
    \ that tends to grow organically over time. Examples include research data, source\
    \ code, client databases, and data in edge devices. This proliferation of metadata\
    \ growing exponentially poses challenges regarding management, retention, access,\
    \ and distribution. But in the last several years, increased activity across all\
    \ market segments related to mergers creates even greater challenges such as designation\
    \ of ownership or—more pointedly—security. It is incredibly difficult for organizations\
    \ to keep account of all the data they are chartered to protect.\n\n### Baselining\
    \ Normal Function and Behavior\n\nFor a long time, the security industry has been\
    \ moving away from signature-based type detection and remediation tactics to more\
    \ applied analytics and behavioral analysis as it relates to the edge. Technologies\
    \ gaining traction, and that are able to be applied at scale, focus on baselining\
    \ what an object's normal state of function is and using applied analytics to\
    \ determine how a person, device, or operating system normally acts. Then, those\
    \ technologies look for aberrations or out-of-bounds behavior as indicators of\
    \ compromise from a cybercrime perspective. The ideal security technologies are\
    \ able to examine nuances of behavior and context to find even minor aberrations,\
    \ alert the enterprise to that activity, and optimally apply a quarantine or other\
    \ remediation tactic automatically.\n\n### AI and ML Can Track Security Trends\
    \ on the Edge\n\nSophisticated threat actors and cyber criminals are actively\
    \ using AI and machine learning. The good news: these same technologies also offer\
    \ new advantages for defenders. Information on emerging and troubling security\
    \ trends and insight derived from machine learning and AI can be leveraged by\
    \ being directly synced to modern IT infrastructure. Many organizations are focused\
    \ on industry-specific trending—identifying threats that have a high probability\
    \ of exploit, in certain markets. Leveraging machine-learned insight to drive\
    \ toward auto-remediation is fundamental in ensuring low-level threats are thwarted,\
    \ and teams can focus on remediation for more complex (and business detrimental)\
    \ incidents. Invest in AI- and ML-driven information services that will provide\
    \ your enterprise, and its edge points, with this valuable aggregation of widely\
    \ focused and industry-specific security intelligence.\n\n### Identifying Acceptable\
    \ and Unacceptable Risks\n\nJust as it is recommended to categorize data and devices,\
    \ individual enterprises must define how they categorize risk. As a security leader,\
    \ you have to determine what vulnerabilities you can potentially live with and\
    \ what risks are never acceptable.\n\nMature information security programs are\
    \ hypersensitized to what constitutes smart risk (that which the business chooses\
    \ to accept in the interim or long term to achieve a strategy or outcome) versus\
    \ risks that can be opportunistically exploited and are simply grounded in poor\
    \ process, policy, or governance. The latter should be defined as unacceptable\
    \ risk and have the required governance structure to support reduction of these\
    \ risks or, even better, elimination.\n\nCISOs must look beyond defined technical\
    \ risk; it is imperative to categorize the risk in the context of the business\
    \ or operational implications. For example, as a hospital CISO you may be able\
    \ to accept the risk of your servers not being 100% covered by antivirus protection\
    \ 24/7 but you know you can't tolerate any risk associated with an edge device\
    \ that's about to go into the operating room and be implanted in a patient. In\
    \ this context, investment, prioritization and the depth of a security risk assessment\
    \ is clear.\n\n### Determining Responsibility and Liability for Security\n\nSecuring\
    \ edge devices' data, software, and code up and down your supply chain is a critical\
    \ issue. As evidenced in recent high-profile incidents, a vulnerability in one\
    \ link of a supply chain can be detrimental to the entire supply chain. As a CISO,\
    \ ensure that your program incorporates proper due diligence of partners to determine\
    \ their security practices including programs and policies, as well as technology\
    \ investments in understanding their edge points, data sets, data flows and network\
    \ flows. These practices will impact the integrity and security of the data output\
    \ sold or provided to your enterprise.\n\nCarefully read your agreements with\
    \ SaaS providers to make sure you know who is responsible and liable for a security\
    \ breach, and delineate where the guardianship of data lies at each point in the\
    \ data exchange. You may not be protected for breaches in your cloud apps and\
    \ software. Many SaaS providers, even those with security controls, have stringent\
    \ positions within their contracts that specify that the security controls and\
    \ the parameters lie within the responsibility of the tenant, which is your enterprise,\
    \ and not the provider itself.\n\n## Conclusion\n\nWhen it comes to information\
    \ security, it is widely accepted that market technological advancement and digitalization\
    \ of business is happening at a rate far outpacing tools and strategies for effective\
    \ management. Security leaders recognize that they are not able to rely on legislation,\
    \ certification, and regulatory standards to adequately protect their enterprise\
    \ environments from cyber threats that may severely impact the business. For the\
    \ last several years, the discussion has been on the manner in which cloud computing\
    \ changed the paradigm of processing and storage, but the next decade of computing\
    \ will be focused on device-level and network-edge processing and, in turn, strategies\
    \ of effective protection.\n\nData protection strategies must accommodate visibility\
    \ of the full data life cycle and constantly evolve and leverage advanced AI-\
    \ and ML-based tech to achieve remediation at cyber-relevant speeds. As discussed,\
    \ the advancement of edge-based processing and devices with increased computational\
    \ power is achieving tremendous operational efficiencies in business, municipal\
    \ infrastructure, and even our own domestic lifestyles—but threat detection and\
    \ data security programs must evolve accordingly.\n\n## Notes\n\n1.  [1](#c12.xhtml#R_c12-note-0001). \
    \ [https://www.pwc.com/us/en/library/covid-19/us-remote-work-survey.html](https://www.pwc.com/us/en/library/covid-19/us-remote-work-survey.html)\n\
    \n2.  [2](#c12.xhtml#R_c12-note-0002).  [https://wired.com/2016/03/inside-cunning-unprecedented-hack-ukraines-power-grid/](https://wired.com/2016/03/inside-cunning-unprecedented-hack-ukraines-power-grid/)\n\
    \n3.  [3](#c12.xhtml#R_c12-note-0003).  [https://www.wired.com/story/oldsmar-florida-water-utility-hack/](https://www.wired.com/story/oldsmar-florida-water-utility-hack/)\n\
    \n4.  [4](#c12.xhtml#R_c12-note-0004).  [https://www.wired.com/2014/11/countdown-to-zero-day-stuxnet/](https://www.wired.com/2014/11/countdown-to-zero-day-stuxnet/)\n\
    \n5.  [5](#c12.xhtml#R_c12-note-0005).  [https://www.wired.com/2015/01/german-steel-mill-hack-destruction/](https://www.wired.com/2015/01/german-steel-mill-hack-destruction/)\n\
    \n# 13  \n\nSecurity-Driven Networking\n\n***LAURA DEANER***\n\nThe digital world\
    \ has changed around us as have the threats. But many organizations continue to\
    \ operate with a mindset of legacy protection, believing themselves protected\
    \ by perimeter firewalls. If we define the network only as a way to create the\
    \ fastest routes, we give attackers a huge advantage. Security-driven networking\
    \ is the broad idea that for cybersecurity to work properly, the network must\
    \ be smarter and provide more inherent security."
