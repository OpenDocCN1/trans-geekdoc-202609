    *   开始监控特权账户，并增加相关技术，当用户访问其不需要的数据或行为偏离常态时发出告报。

    *   确定您的网络风险承受能力，并建立对第三方风险的监督机制。

    *   评估您的整体 IT 支出，包括对分散和旧系统及流程的升级。


    ### 最佳实践：


    *   通过将身份归入特定类别来构建零信任。

    *   禁用旧版 VPN 技术，然后根据数字环境中有效的方案对 VPN 技术进行整合/标准化。

    *   启用更多的 SD-WAN 技术。

    *   用统一防火墙替换出站防火墙。

    *   添加单点登录（SSO）、代理服务器和数据泄露防护（DLP）。

    *   创建事件响应剧本（Playbook）。

    *   开始定期的桌面安全演练和渗透测试。

    *   购买网络保险。

    *   与同行相比，基准测试组织的网络安全成熟度。

    *   创建一个能让首席安全官（CISO）通过仪表板中的“单一视图”查看所有动态的环境。


    ## 最佳的安全驱动型网络是什么样子的？


    最佳的安全驱动型网络并非一一切切，也不是你可以从供应商处购买并部署的软件包。您的安全驱动型网络将是针对您的环境身定制的，提供一种基于风险的方法，比您目前的状态更进一步。在这个环境中，您将消除了风险并排除了“已知未知”，要么通过让它们已知，要么通过让它们无关紧要。


    一旦您创建了安全驱动型网络，您的工作并没有结束。这不是一项“设置好就可以不用管”的任务。随着您添加新的应用程序、产品、流程和人员，您必须确保您和您的团队继续整合安全控制。


    您可能已经创建了一个员工可以安全使用公共互联网的环境。他们是否能在星巴克工作取决于您的决定。


    # 14 实现端到端安全


    **RENEE TARUN**


    数字化创新带来了更多机会——也增加了风险。随着安全边界的扩大，数以十亿计的安全边缘应运而生；过去无法访问的许多设备现在已连接，为新一波复杂的威胁打开了大门。即使是中等规模的公司，其生态系统的复杂性也变得难以管理，而多年的网络安全技能人才缺口进一步加剧了这一点。在
    2020 年疫情爆发之前，已有 65% 的组织表示他们缺乏足够的资源。此外，数据和流程还受到全球、国家、地区、当地和行业实体的标准及合规法规的。


    实现端到端安全比以往任何时候都具有挑战性，因为今天的边界已不再易于定义。随着远程办公的爆发、云端的普及以及比以往任何时候更多的连接设备，网络边界已经扩展到了传统数据中心之外。这一切的结果是产生了数以十亿计需要保护的边缘。（我们在第
    12 章中讨论过边缘安全）。


    同时，检查网络流量以检测恶意内容已变得几乎不可能。根据 Google 的数据，现在超过 80% 的流量在传输过程中是加密的。产生这些恶意流量的对手不断寻找机会利用我们基础设施中任何潜在的弱点。同时，攻击正变得越来越复杂和昂贵。如今的组织面临的挑战不仅是处理相当了解的高级威胁，还要应对日益复杂的未知威胁。


    网络威胁攻击者利用更广泛的数字威胁攻击面，发起创新的新威胁以及传统但有效的攻击。数据泄露和勒索软件事件持续增加。根据 Ponemon 研究所的数据，2019
    年数据泄露的平均成本为 390 万美元，没有任何迹象表明攻击正在放缓——恰恰相反。


    坏分子利用 AI 开发漏洞，并以比以往任何时候都快的速度创建全新的零日攻击。网络犯罪组织已投资构建可扩展的平台，使他们能够通过选择恶意软件、漏洞、僵尸网络和垃圾邮件选项来发起威胁活动，并自动完成攻击的交付。


    ## 昨天的解决方案无法解决今天的问题


    许多企业通过增加更多过去有效的方案来应对日益增长的安全威胁：即针对单一问题的安全解决方案。上代解决方案在今天的环境中已不再有效。这些点对解决方案（point
    solutions）已成为复杂网络安全格局的“阿琉斯斯之踵”。根据 Ponemon 研究所的数据，平均企业部署了 47 种不同的安全解决方案。这些解决方案许多独立运行，创建了多个需要操作和维护的孤岛。孤岛系统使得难以关联事件并制定协调的响应。此类系统还创建了潜在的安全漏洞。多个点对解决方案成本高昂，且管理和维护面临挑战。


    这些解决方案每一个都会产生告报，监控和优先排序这些告报简直是场噩梦，更不用说协调了。导致的企业生态系统因为供应商过多、告报过多，以及没有足够的技能人才来实时响应网络威胁而变得日益复杂。寻找能够操作和维护无数工具的专业人士也是一种挑战；当这些专业人才离开组织时，就会产生缺口。


    为了组合一套解决方案，许多企业从点对解决方案转向了比单一解决方案功能更多的套件。套件在理论上向集成迈了一步，但在实践中，它们通常包含一个非常好的解决方案，而其他的平平。因此，此类套件无法提供真正的端到端安全。套件和点对解决方案并没有解决安全问题，反而增加了人工监控、引入新技术的难度，并创建了许多潜在的故障点。它们还为已经人手不足且工作过载的安全和网络团队增加了成本、维护和运营负担。总之，缺乏集成会导致实施延迟、投资回报缓慢以及总拥有成本增加。


    由于由于犯罪企业正使用可扩展的平台发动攻击，组织必须以火力制火。随着企业追求速度和规模，网络安全领导者将寻求超越网络安全点对解决方案和套件，投资于精心设计的完全集成的安全平台。这才是端到端安全的真正含义，是一种有希望应对上述挑战的策略和实施方法。


    虽然每个组织都需要定义一个全面且适应的安全态势来满足其需求，但端到端安全有一些每个组织都应考虑的基础能力。


    端到端安全涵盖三个驱动因素：


    *   对整个威胁向量的广泛视角

    *   自动化

    *   跨网络安全解决方案的全集成


    本章其余部分将探讨关键能力，包括在演进平台时应寻找的关键特征。


    ## 统一威胁情报


    统一威胁情报对于应对今天的威胁至关重要，因为要成功，威胁情报必须超出您的组织，到达整个行业领域之外。您需要在攻击者针对您的企业之前了解他们面临的威胁性质。威胁情报必须是实时的、准确且可操作的。实现端到端安全需要在每个组件中纳入威胁情报，并跨平台进行统一和集成。


