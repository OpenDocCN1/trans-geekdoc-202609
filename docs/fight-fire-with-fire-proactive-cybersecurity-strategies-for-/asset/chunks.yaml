- raw: 'This comprehensive outsourcing, and straddling of public cloud (Amazon AWS,
    Microsoft Azure, Google GCP), private cloud (VMware, IBM, Red Hat), hybrid (physical
    data centers), and cloud productivity applications, has only been accelerated
    by remote work trends. The result is a metastasizing cyberattack surface, amplifying
    organizational risk, complexity, and consequently vulnerabilities.


    ## Complexity, Meet Vulnerability


    Such a decentralized span of control, combined with an increasing desire for IT
    nimbleness, then creates the cybersecurity catch-22 of the cloud-powered organization:
    more agility but more cyber blind spots. Furthermore, the novelty of modern cloud
    apps and infrastructure has also inspired politically, financially, and criminally
    motivated attackers to weaponize new attack vectors and techniques against this
    paradigm.


    Users want efficiency, instant gratification of IT-as-a-service, and democratized
    access to all cloud capabilities to enhance business productivity. Meanwhile IT,
    and not the cloud service providers, are burdened with policing and protecting
    all the resulting data, configurations, applications, and workloads such demands
    unleash, while trying to keep organizations safe across an even greater volume
    and diversity of cyberattack vectors.


    Contending with such unfettered choice (APIs, microservices, containers, serverless
    infrastructure, code repositories, and cloud apps on top), these users often have
    insufficient knowledge or attention to detail in identifying and prioritizing
    cybersecurity posture. This is exemplified by rampant user-driven misconfiguration,
    poor password protocol, loose permission settings, low policy awareness, and a
    lack of stringent organizational oversight. Consider this in the light of understaffed,
    overworked, and under-skilled IT personnel employing manual, human-error prone,
    and legacy approaches ill-suited to surveil and remediate such behavior.


    These dynamics at work are plainly apparent in some of the biggest cloud breaches
    to date—Capital One, Facebook, GoDaddy, Verizon, Docker Hub, WWE, Adobe, Best
    Western, and select federal agencies. Hundreds of millions of records and petabytes
    of data were exposed in these cases directly as a result of server and database
    deployment errors and lax access safeguards, suggesting the principal cause of
    cloud security and related breach incidents remains user negligence and poor cyber
    governance.


    ## More (Vendors & Connectivity) But Not Merrier


    Yet another facet gating the progress toward a cloud cybersecurity “nirvana” is
    the steep protect-and-defend learning curve inherent to working with myriad vendors.
    For example, typical training and implementation documentation guides for just
    one cloud service could be hundreds of pages long, requiring idiosyncratic configurations
    to ensure cybersecurity policies are repeatable and harmonious with pre-existing
    investments and environments.


    Layering in the surge of devices and user types on enterprises'' IT and operational
    technology networks only exacerbates this picture. Vulnerable connected devices
    running unique operating systems and transient users are in tandem increasingly
    traversing diverse on-premises and cloud architectures. This brings a multitude
    of unidentified unknowns, challenging IT to secure what is an unabating proliferation
    of ephemeral resources, assets, and identities.


    With this backdrop, the odds necessarily appear stacked against organizations
    seeking to shield intellectual property from exfiltration by these new, multiplicative
    attack vectors. A stretched-thin, undertrained, and scarce cybersecurity workforce
    must yet again contend with suboptimal awareness of evolving cloud security and
    policies, as well as diminished visibility across all these spheres. The generational
    expertise gap in cloud versus traditional IT only compounds these issues.


    ## More Risk, Same Budget


    Despite the more sophisticated threat landscape and increased risk spawned by
    cloud uptake, cloud cybersecurity spending remains comparatively low. For perspective,
    of the more than $60 billion of spending on commercial cybersecurity tools and
    technologies in 2020, less than 10% was cloud-centric, according to Gartner and
    public company disclosure. Disregarding the delivery method (security through
    the cloud, or security SaaS), this proportion shrinks to less than 5% when solely
    considering solutions dedicated to protecting data and assets in cloud environments
    (security for the cloud). In the context of public cloud spending swelling to
    $400 billion in the next several years from $270 billion today, this shallow level
    of cybersecurity investment is starker still.


    Such a disparity is perhaps owed to reticence around the maturity and potency
    of available solutions, given the embryonic state of the market. Additionally,
    defense strategies involving familiar on-premises techniques reconditioned for
    cloud, and funded by refurbished, conventional cybersecurity categories, could
    also be playing a role. But these revised techniques and solutions are not up
    to the task of keeping pace with the rapid innovation of cloud service providers''
    offerings or coping with the staggering data generation and sprawl in these domains.
    Nor are they proficient in thwarting new and emerging vulnerabilities and threats.


    Such new challenges and higher complexity in turn have inspired the creation of
    the cloud workload protection platforms (CWPP), cloud security posture management
    (CSPM), and cloud workload segmentation categories. While state-of-the-art, we
    anticipate these systems augmenting traditional, well-understood vulnerability
    management, microsegmentation, classic endpoint protection, and systems management
    functionality. Such unification promises both automated and continuous environmental
    visibility, iterative or runtime scanning for vulnerabilities and misconfigurations
    across organizations'' diverse IT footprints, and most importantly the steady
    extension of existing cyber defense skill sets.


    Other cloud security challenges include:


    *   The short-lived nature of cloud resources, making data collection and incident
    investigation difficult. For example, forensic evidence is lost when resources
    are terminated or when workloads are decommissioned.


    *   Multi-cloud usage and portability of cloud resources, decentralizing organizational
    control across specialized teams and vendors.


    *   Manual processes ineffective and incompatible with elastic attack surfaces.


    *   Retrofitted static technologies adding performance drags on workflows and
    cloud systems in their reliance on reboots, scan storms, and invasive signature
    updates.


    Ultimately, overhauling foundational cybersecurity architecture and design carries
    inherent operational disruption and technology efficacy risks that few organizations
    have been bold enough to face. Both cultural (risk aversion, change management
    hurdles) and experiential limitations (skills deficit in an already tight labor
    market for cybersecurity professionals) remain the root causes. In the meantime,
    it is essential that organizations crystallizing adaptive cloud cybersecurity
    programs in response to new realities, ensuring minor operational lapses from
    “learning by doing” within highly intricate, multi-faceted IT systems, do not
    risk disastrous impacts to the broader cybersecurity posture. Sampling the best
    of the capabilities of emerging specialists, reliable incumbents, and service
    providers themselves likely portends the most optimal outcome.


    ## Who Is Ultimately Responsible?


    As corporate IT systems hasten their migration to third-party cloud providers,
    the responsibility for cybersecurity often gets lost in the move. Cloud providers
    have a deliberately limited purview, typically pledging security only for their
    own underlying infrastructure.'
