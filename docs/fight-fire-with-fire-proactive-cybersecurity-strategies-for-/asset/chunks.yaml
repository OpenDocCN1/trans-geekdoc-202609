    \ objects with sensors that send and receive data. \n\n**IOC**\n\n: Indicator\
    \ of compromise; a forensic term that refers to the evidence on a device that\
    \ points to a security breach. \n\n**IP**\n\n: Internet Protocol. \n\n**ISAC**\n\
    \n: Information Sharing and Analysis Center. \n\n**ISAO**\n\n: Information Sharing\
    \ and Analysis Organization. \n\n**ISO**\n\n: An independent, non-governmental\
    \ international organization with a membership of 165 national standards bodies.\
    \ \n\n**IT/OT**\n\n: Information technology/operational technology. \n\n**ITaaS**\n\
    \n: IT as a service; a technology-delivery method that treats information technology\
    \ as a commodity, providing an enterprise with the amount of hardware, software,\
    \ and support that it needs for an agreed-on monthly fee. \n\n**KPI**\n\n: Key\
    \ performance indicator. \n\n**KRI**\n\n: Key risk indicator. \n\n**Legacy**\n\
    \n: Older computers or software still in use. \n\n**Machine learning**\n\n: A\
    \ technique that allows computer systems to learn by using algorithms and statistical\
    \ models to analyze and draw inferences from patterns in data. \n\n**Malware**\n\
    \n: Software designed to interfere with the normal function of a computer. \n\n\
    **MCP**\n\n: Metric control plan. \n\n**ML**\n\n: Machine learning. \n\n**MPLS**\n\
    \n: Multi Protocol Label Switching. \n\n**MTA**\n\n: Message transfer agent. \n\
    \n**NAC**\n\n: Network access control. \n\n**Net promoter score**\n\n: An index\
    \ ranging from −100 to 100 that measures the willingness of customers to recommend\
    \ a company’s products or services to others. \n\n**Network sniffer**\n\n: Software\
    \ that examines data crossing a network in real time. \n\n**NIST**\n\n: National\
    \ Institute of Standards and Technology. \n\n**NOC**\n\n: Network Operations Center.\
    \ \n\n**NSA**\n\n: National Security Agency. \n\n**OKR**\n\n: Objectives and key\
    \ results. \n\n**OpEx**\n\n: Operating expenses. Cloud adoption often moves capital\
    \ expenditures (buy, house, and run the hardware) to operating expenses (subscription\
    \ and/or monthly usage fees). \n\n**OWASP**\n\n: Open Web Application Security\
    \ Project. See [Chapter 8](#c08.xhtml). \n\n**PaaS**\n\n: Platform as a service.\
    \ \n\n**PCI-DSS**\n\n: Payment Card Industry Data Security Standard. \n\n**Pen-test**\n\
    \n: Penetration testing; a simulated cyberattack performed to uncover weaknesses\
    \ in an organization’s security. \n\n**Phishing**\n\n: The fraudulent practice\
    \ of sending links purporting to be from reputable companies to induce individuals\
    \ to reveal personal information or download malware. \n\n**PII**\n\n: Personally\
    \ identifiable information. \n\n**Ransomware**\n\n: A type of malware that requires\
    \ the victim to pay a ransom in order to access files the attacker has encrypted.\
    \ \n\n**Risk appetite**\n\n: The amount and type of risk that an organization\
    \ is prepared to pursue, retain, or take. \n\n**SaaS**\n\n: Software as a service;\
    \ a software distribution model in which a third-party provider hosts applications\
    \ and makes them available to customers over the internet. \n\n**SASE**\n\n: Secure\
    \ access service edge. \n\n**Script kiddie** \n\n: A person who uses existing\
    \ computer scripts or code to hack into computers, lacking the expertise to write\
    \ their own. \n\n**SD-WAN**\n\n: Software-defined wide area network. \n\n**SEG**\n\
    \n: Secure email gateway. \n\n**Shared responsibility model**\n\n: A framework\
    \ that divides responsibilities between a cloud service provider and the organization\
    \ or individual that uses the services of that provider. \n\n**SIEM**\n\n: Security\
    \ information and event management. \n\n**SLA**\n\n: Service-level agreement.\
    \ \n\n**SOAR**\n\n: Secure orchestration automation and response. \n\n**SOC**\n\
    \n: Security operations center. \n\n**SSO**\n\n: Single sign-on. \n\n**STEM**\n\
    \n: A curriculum based on the idea of educating students in four specific disciplines—science,\
    \ technology, engineering, and mathematics—in an interdisciplinary and applied\
    \ approach. \n\n**SWG**\n\n: Secure web gateway. \n\n**SWOT**\n\n: Strengths,\
    \ weaknesses, opportunities, and threats. A SWOT analysis is a technique for assessing\
    \ these four aspects of a given problem or situation. \n\n**Threat actors**\n\n\
    : A person or entity responsible for an event or incident that impacts, or has\
    \ the potential to impact, the safety or security of another entity. \n\n**TLS**\n\
    \n: Transport Layer Security. \n\n**TTP**\n\n: Tactics, techniques, and procedures.\
    \ The patterns that an attacker uses that can be used in threat hunting. \n\n\
    **Unknown unknowns**\n\n: Unexpected or unforeseeable conditions that pose a potentially\
    \ greater risk simply because they cannot be anticipated based on past experience\
    \ or investigation. Known unknowns result from recognized but poorly understood\
    \ phenomena. \n\n**VLAN**\n\n: Virtual local area network. \n\n**VPN**\n\n: Virtual\
    \ private network. \n\n**WFH**\n\n: Work from home. \n\n**XDR**\n\n: Extended\
    \ detection and response. \n\n**XSS**\n\n: Cross-site scripting, a common attack\
    \ on web applications. \n\n**Zero trust**\n\n: A security concept that requires\
    \ all users, even insiders, to be authenticated and authorized before being granted\
    \ access. \n\n**ZTA**\n\n: Zero trust access. \n\n# Resources We Rely On\n\n##\
    \ Relevant Sites for CISOs\n\n(ISC)², [https://www.isc2.org/](https://www.isc2.org/)\n\
    \nCISA (Cyber & Infrastructure Security Agency), [https://www.cisa.gov/](https://www.cisa.gov/)\n\
    \nCyberEdBoard, members-only community for security leaders, [https://ismg.io/brands/cyberedboard/](https://ismg.io/brands/cyberedboard/)\n\
    \nCybersecurity Collaborative, which offers resources for CISOs, [https://www.cyberleadersunite.com/memberships/for-cisos](https://www.cyberleadersunite.com/memberships/for-cisos)\n\
    \nFBI, [https://www.fbi.gov/](https://www.fbi.gov/)\n\nGlobal Cyber Alliance,\
    \ [https://www.globalcyberalliance.org/](https://www.globalcyberalliance.org/)\n\
    \nIEEE, [https://www.ieee.org/](https://www.ieee.org/)\n\nInfraGard, [https://www.infragard.org](https://www.infragard.org)\n\
    \nNational Security Institute at George Mason University, [https://nationalsecurity.gmu.edu/](https://nationalsecurity.gmu.edu/)\n\
    \nNSA, [https://www.nsa.gov/what-we-do/cybersecurity/](https://www.nsa.gov/what-we-do/cybersecurity/)\n\
    \nSANS, [https://www.sans.org/](https://www.sans.org/)\n\nUS Chamber of Commerce,\
    \ [https://www.uschamber.com/national-and-cyber-security](https://www.uschamber.com/national-and-cyber-security)\n\
    \n## Stay Informed of the Latest Threats\n\n### Blogs and Periodicals\n\nBleeping\
    \ Computer, [https://www.bleepingcomputer.com/](https://www.bleepingcomputer.com/)\n\
    \nCIO, [https://www.cio.com/](https://www.cio.com/)\n\nCRN, [http://crn.com](http://crn.com)\n\
    \nCSO, [https://www.csoonline.com/](https://www.csoonline.com/)\n\nCybercrime\
    \ Magazine, [https://cybersecurityventures.com/](https://cybersecurityventures.com/)\n\
    \nDark Reading, [https://www.darkreading.com/](https://www.darkreading.com/)\n\
    \nHackerNews, [https://news.ycombinator.com/](https://news.ycombinator.com/)\n\
    \nKrebs on Security Blog, [https://krebsonsecurity.com/](https://krebsonsecurity.com/)\n\
    \nMotherboard, [https://www.vice.com/en/section/tech](https://www.vice.com/en/section/tech)\n\
    \nNetwork World, [https://www.networkworld.com/](https://www.networkworld.com/)\n\
    \nSchneier on Security, [https://www.schneier.com/](https://www.schneier.com/)\n\
    \nSecurity Week, [https://www.securityweek.com/](https://www.securityweek.com/)\n\
    \nZDNet, [https://www.zdnet.com/topic/security/](https://www.zdnet.com/topic/security/)\n\
    \n### Follow on Twitter\n\nMarcus J. Carey, [https://twitter.com/marcusjcarey](https://twitter.com/marcusjcarey)\n\
    \nCyberleaders, [https://twitter.com/cyberleaders](https://twitter.com/cyberleaders)\n\
