  trans: '


    - 进入并离开同一接口的流量。

    - **HR**: 人力资源。

    - **IaaS**: 基础设施即服务。

    - **IGC**: 信息治理委员会。

    - **Internet of Things (物联网)**: 物理对象与发送和接收数据的传感器的互连。

    - **IOC**: 入侵指标；一种法证术语，指设备上可能指示安全泄露的证据。

    - **IP**: 网协议。

    - **ISAC**: 信息共享与分析中心。

    - **ISAO**: 信息共享与分析组织。

    - **ISO**: 一个独立的、非政府的国际组织，由 165 个国家标准机构组成成员。

    - **IT/OT**: 信息技术/运营技术。

    - **ITaaS**: IT 即服务；一种技术交付方法，将信息技术视为商品，根据约定的月费为企业提供所需的硬件、软件和支持。

    - **KPI**: 关键绩效指标。

    - **KRI**: 关键风险指标。

    - **Legacy (遗留系统)**: 仍在在使用的旧计算机或软件。

    - **Machine learning (机器学习)**: 一种允许计算机系统通过算法和统计模型分析数据中的模式并从中得出推断来学习的技术。

    - **Malware (恶意软件)**: 旨在干扰计算机正常运行的软件。

    - **MCP**: 指标控制计划。

    - **ML**: 机器学习。

    - **MPLS**: 多协议标签交换。

    - **MTA**: 邮件传输代理。

    - **NAC**: 网络访问控制。

    - **Net promoter score (净推荐值)**: 一个范围从 −100 到 100 的指数，用于衡量客户向他人推荐公司产品或服务的意愿。

    - **Network sniffer (网络嗅探器)**: 实时检查跨网络数据的软件。

    - **NIST**: 美国国立标准与技术研究院。

    - **NOC**: 网络运营中心。

    - **NSA**: 美国国家安全局。

    - **OKR**: 目标与关键结果。

    - **OpEx**: 运营支出。采用云服务通常将资本支出（购买、安置和运行硬件）转变为运营支出（订阅和/或每月使用费）。

    - **OWASP**: 开源 Web 应用安全项目。参阅第 8 章。

    - **PaaS**: 平台即服务。

    - **PCI-DSS**: 支付卡行业数据安全标准。

    - **Pen-test (渗透测试)**: 渗透测试；通过执行模拟网络攻击来发现组织安全中的漏洞。

    - **Phishing (网络钓鱼)**: 一种欺骗性行为，通过发送假成来自信誉公司的链接，引导个人泄露个人信息或下载恶意软件。

    - **PII**: 个人身份信息。

    - **Ransomware (勒索软件)**: 一种恶意软件，要求受害者支付赎金以访问攻击者加密的文件。

    - **Risk appetite (风险胃口)**: 组织准备追求、保留或承担的风险数量和类型。

    - **SaaS**: 软件即服务；一种软件分发模型，由第三方供应商托管应用程序并通过互联网向客户提供服务。

    - **SASE**: 安全访问服务边缘。

    - **Script kiddie (脚本小子)**: 使用现有的脚本或代码黑入计算机的人，缺乏编写自己代码的专业知识。

    - **SD-WAN**: 软件定义广域网。

    - **SEG**: 安全电子邮件网关。

    - **Shared responsibility model (责任共担模型)**: 一个划分云提供商和个人之间责任的框架。

    - **SIEM**: 安全信息和事件管理。

    - **SLA**: 服务水平协议。

    - **SOAR**: 安全编排与自动化响应。

    - **SOC**: 安全运营中心。

    - **SSO**: 单点登录。

    - **STEM**: 一种基于以跨学科方法让学生接受特定学科（科学、技术和数学）教育理念的课程。

    - **SWG**: 安全 Web 网关。

    - **SWOT (优劣势分析)**: 优势、劣势、机会和威胁。SWOT 分析是一种评估给定问题或情况的这四个方面的技术。

    - **Threat actors (威胁行为者)**: 负责影响或可能影响另一个实体安全的事件的个人或实体。

    - **TLS**: 传输层安全。

    - **TTP**: 战术、技术和程序。攻击者在威胁狩猎中使用的模式。

    - **Unknown unknowns (未知未知)**: 意料之外或理解不足的现象。

    - **VLAN**: 虚拟局域网。

    - **VPN**: 虚拟专用网络。

    - **WFH**: 居家办公。

    - **XDR**: 扩展检测与响应。

    - **XSS (跨站脚本)**: 对 Web 应用程序的常见攻击。

    - **Zero trust (零信任)**: 一种安全概念，要求所有用户（即使是内部）在获得访问权限之前必须验证。

    - **ZTA**: 零信任访问。


    ## 我们依赖的资源


    ### 针对 CISO 的相关网站

    - **ISC²**: https://www.isc2.org/

    - **CISA (网络与基础设施安全局)**: https://www.cisa.gov/

    - **CyberEdBoard**, 面向安全领导者的专属社区：https://ismg.io/brands/cyberedboard/

    - **Cybersecurity Collaborative**, 为 CISO 提供资源：[链接]

    - **FBI (联邦调查局)**: https://www.fbi.gov/

    - **Global Cyber Alliance (全球网络联盟)**: https://www.globalcyberalliance.org/

    - **IEEE**: https://www.ieee.org/

    - **InfraGard**: https://www.infragard.org

    - **乔治·梅森大学国家安全学院**: https://nationalsecurity.gmu.edu/

    - **NSA (国家安全局)**: https://www.nsa.gov/what-we-do/cybersecurity/

    - **SANS**: https://www.sans.org/

    - **US Chamber of Commerce (美国商会)**: https://www.uschamber.com/national-and-cybersecurity


    ## 了解最新威胁


    ### 博客与期刊

    - **Bleeping Computer**: https://www.bleepingcomputer.com/

    - **CIO**: https://www.cio.com/

    - **CRN**: http://crn.com

    - **CSO**: https://www.csoonline.com/

    - **Cybercrime Magazine**: https://cybersecurityventures.com/

