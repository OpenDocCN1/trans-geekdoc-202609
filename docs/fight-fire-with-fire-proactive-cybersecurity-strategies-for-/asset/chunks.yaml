- raw: "When the COVID-19 pandemic hit, our workplaces abruptly moved into our homes.\
    \ Moving forward, workplaces and personal spaces will merge as work from home\
    \ becomes the new normal for many. Employees on less secure home networks are\
    \ attending meetings by video, using collaboration platforms with their teams,\
    \ and managing company data in the cloud. From a security standpoint, this accelerated\
    \ blending of work and home, which already had been on our radar as leaders, is\
    \ even more concerning.\n\nTo address all of the issues you face, there are more\
    \ security solutions available than ever before. But this is a double-edged sword\
    \ because the proliferation of products and the pace of change in the security\
    \ solutions market is also challenging for CISOs.\n\nAs you know, simply layering\
    \ the latest security technology onto your enterprise won't get you where you\
    \ want to go. Can you build in security from the beginning to encompass the entire\
    \ enterprise? Which emerging security solutions should you consider adopting?\
    \ What new areas should be considered? What can guide those decisions? A more\
    \ holistic approach is required.\n\nYou need the right technology in place throughout\
    \ your network. Your security technology must align with a strong architecture\
    \ to make sure there are no gaps. Your security platform should accommodate point\
    \ solutions when required but also easily integrate into and across all of your\
    \ systems.\n\nTo keep up with evolving and fast-moving threats, your security\
    \ technology must be automated. The right technology also must be mature, well\
    \ supported by the vendor, and capable of helping you achieve the goals of your\
    \ security processes. To grow with your enterprise, your security must be scalable.\
    \ Finally, your security must be easy to use out of the box—or your people will\
    \ find ways to work around or ignore it.\n\nIn this section of the book, we cover\
    \ key areas that merit particular attention from CISOs today, including security\
    \ in the cloud, IoT and edge security, and security-driven networking. The final\
    \ chapter in this section offers a look at your most strategic objective: achieving\
    \ end-to-end security.\n\n## Security in the Cloud\n\nWhile the decision to move\
    \ to the cloud is straightforward from multiple business angles, working in the\
    \ cloud requires additional effort and planning with respect to security. Moving\
    \ to the cloud is further complicated by decisions about which cloud or clouds\
    \ to adopt: public, private, or hybrid. This requires an understanding of the\
    \ security characteristics of the cloud in question.\n\nEach cloud has variables,\
    \ especially regarding security and compliance. How do you handle monitoring in\
    \ the cloud? You also have to determine who maintains the system: you or a managed\
    \ service security provider? What are the advantages and disadvantages of each\
    \ approach? How do you use the shared responsibility model advanced by cloud vendors\
    \ when, ultimately, the responsibility for security rests squarely with you? [Chapter\
    \ 11](#c11.xhtml) covers the important area of security in the cloud.\n\n## IoT\
    \ and Edge Security\n\nThe line between the physical and cyber worlds has disappeared.\
    \ Whether cyber or physical, whether your data, your point-of-sale systems, or\
    \ your sensors on the edge, everything is interconnected across your enterprise.\
    \ Some of this technology, especially IoT and edge technology, was not built with\
    \ security in mind and may include older network interfaces that are activated\
    \ without evaluation of the risk of connecting them. You have to look at all your\
    \ technology—from sensors at the edge to your data center, from your coffee pot\
    \ to your HVAC system—and make sure you haven't created an open door or even a\
    \ cracked window into your network.\n\nThe connections between the cyber and physical\
    \ world also help you as a defender. Now that your doors, your locks, and your\
    \ security cameras are connected in the cyber realm, those connections can help\
    \ you from a cybersecurity perspective. That cyber and physical integration gives\
    \ you a better view of what's going on both on your premises and in your network.\
    \ For example, if you see unusual network activity and correlate that activity\
    \ with information from your security cameras showing someone entering your data\
    \ center, you can determine you have more than a cyber problem: you also have\
    \ either an outside intruder or an insider on premises after hours. We cover security\
    \ in the converging cyber and physical worlds in [Chapter 12](#c12.xhtml).\n\n\
    ## Security-Driven Networking\n\nGiven the critical nature of networks to every\
    \ aspect of the business, the distinction between security and networking is a\
    \ false dichotomy. Security policy must be applied across dynamic networks, including\
    \ SD-WAN. Security-driven networking is based on the idea of bringing security\
    \ and networking together seamlessly.\n\nSecurity must be built into the network.\
    \ You also have to continually adapt to a changing environment. In a world where\
    \ zero trust is becoming standard security practice, network design must include\
    \ ways to segment information and processes, specify how to define users, and\
    \ describe how you handle network access control. From containers to APIs to remote\
    \ access to 5G, security policies must be applied consistently all across your\
    \ network, including dynamic edges. Safe remote access, governed by defined security\
    \ policies, should be available wherever your users are. Security-driven networking\
    \ is covered in [Chapter 13](#c13.xhtml).\n\n## Achieving End-to-End Security\n\
    \nThe core principles of end-to-end security are speed, agility, interoperability,\
    \ and continuous monitoring. Achieving end-to-end security requires integrating\
    \ solutions across your entire network, your physical premises, and in the cloud.\
    \ As you make effective use of platforms that leverage automation and manage complexity,\
    \ you must keep the goal of end-to-end security in mind. You also have to address\
    \ compliance with evolving security regulations, standards, and frameworks.\n\n\
    Finally, when you think you have end-to-end security in place, your work is not\
    \ done. As you integrate new people, new processes, and new technology, you have\
    \ to keep security at the forefront. End-to-end security requires building in\
    \ security from the beginning and ensuring that new technology is integrated in\
    \ a way that continues to achieve this objective. [Chapter 14](#c14.xhtml) covers\
    \ end-to-end security.\n\n# 11  \n\nCybersecurity in the Cloud\n\n***FATIMA BOOLANI***\n\
    \nThe shift to the cloud is unstoppable, and there is no turning back.\n\nThe\
    \ move away from the “undifferentiated heavy lifting” of running IT stacks and\
    \ home-grown enterprise software has not only given rise to a tsunami of born-digital\
    \ startups, but is spurring voracious adoption of cloud computing by companies\
    \ of all sizes and stripes.\n\nManifesting in cloud-based front-office application\
    \ modernization, back-office infrastructure transformation, and software-enabled\
    \ business process automation, these initiatives are satisfying the intensifying\
    \ demands for agility, efficiency, and innovation across the modern enterprise.\
    \ With cloud computing enabling the effective handover of entire technology stacks\
    \ to third parties—from infrastructure to middleware to applications—companies\
    \ have been liberated to focus on doing what they do best, which in almost all\
    \ cases is not procuring, building, administering, and maintaining software and\
    \ IT plumbing systems.\n\nYet against this backdrop, the stakes for organizational\
    \ cyber defense, protection, and response have never been higher. Now, organizations\
    \ face not only existing threats, but also new cyber obstacles that come with\
    \ the brave new world of the cloud, characterized by greater vendor and functional\
    \ fragmentation, as well as increasingly distributed and heterogeneous network\
    \ architectures."
