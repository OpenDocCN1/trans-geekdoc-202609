    如果领导层和团队能够执行合理的职责划分、采用良好的技术并建立健全的策略，NOC 和 SOC 就能良好地合作。但请记住：匆忙会导致风险和遗憾。无论采用何种过渡模型，都必须为知识传递和培训留足够的时间。通常六到十二个月就足够了，可以根据结果进行延长。


    通常在培训之后，NOC 可以承担 SOC 1 级支持和监控。然而，取证是一项专业技能，仍然属于 SOC 领域。同样，SOC 团队可以承担网络监控和初始分检，但对
    `debug logs` 的深度分析可能需要大量时间。请制定为期一年的过渡计划。


    某种程度的融合，或者至少是协作，行业的发展方向。但最好的方法就像在弯曲的山路上行驶：要极度谨慎地行进。协作、合作并缓慢融合。在移动太快之前，先测试道路并保持远瞻。与其面对失败的合并，不如承受一点紧张的压力。


    如果你时刻记住潜在的危险、细节和差异，你就可以缓慢但成功地融合这两个团队，或者建立一个加强协作与合作的新常态。


    # 8


    # 设计安全：向左移文化的策略


    **ANNE MARIE ZETTLEMOYER**


    黑客夏营是每年八月在拉斯维加斯酷热天气中进行的为期一周的活动，超过 1 万名安全专业人士和爱好者聚集在此交流意见、分享想法，并在一系列安全会议（主要是 `BsidesLV`、`DEF
    CON` 和 `Black Hat`）上重新建立联系。这像是一种家族聚会，记忆在这里产生（并被遗忘），想法在这里形成、争论、开发和成熟。


    几年前在这次活动上，我进行了多次关于设计安全的对话——对某些人来说是 `DevSecOps`（安全应该包含在定义中！），对另一些人绝对不是 `DevSecOps`（DevOps
    必须保持纯洁！），以及所有人都在努力“左移”，将安全带到开发过程的开始，而不是在后期补救。这是一种高尚的努力，将“安全”包含在质量定义中，将“可靠”包含在就绪定义中，并在整个产品生命周期内高效有效地做到这一点。无论你是
    DevOps 纯主义者还是 DevSecOps 倡导者，尽管对标签有许多争论，但我们都能同意：我们创造的东西应该是安全的，并且在使用期间一直保持安全。


    显而易见……对吧？


    如果你涉足应用安全或设计安全领域，你会发现，提前对某物进行安全处理的想法往往换来许多人的点头（哦是的，这是一个极极的好主意！），但当开发速度超过了合规性或安全的优先事项时，又会导致更多的摇头（哦等一下，你的意思是现在开始吗？）。


    你可能听过一系列引起共鸣且可以理解的抱怨，例如：


    * “所有这些规则拖慢了我们的速度。”

    * “我们只是想迭代到 MVP 来证明价值。”

    * “但我们已经通过审计了。我们会以后处理那个。”

    * “你们这些安全人员只是在散布恐惧、不确定性和怀疑。没关系的！”


    还有我最喜欢的一句：


    * “它只要能运行就行！”


    到此，我看到安全专业人士经历了种种反应——包括不信、沮丧和怀疑。如果你时刻记住潜在的危险、细节和差异，你就可以缓慢但成功地融合这两个团队，或者建立一个加强协作与合作的新常态。


    ## 什么是安全开发？它包含什么？


    在深入策略之前，让我们先定义一下术语。安全开发包括安全编码和安全实践。正如前面提到的，仅仅关注编写代码是不够的；我们需要将“安全”包含在质量定义中，并在整个产品生命周期内高效有效地做到这一点。


    ## 提前跳到流程和技术——等等，什么？


    我首先要说明，并非所有内容都适用于你开发的所有东西。你如何加固产品以及如何设计安全必须符合你的产品威胁格局和业务的风险承受能力。本章中的策略旨在提供如何处理某些更棘手问题的思路，但并没有一种通用的方法论。


    ### 适用性与规模


    并不是每个产品都需要相同频率或水平的审查，而且“适用用途和规模”的定义会随着时间推移和业务的变化而改变。


    ### 人员发现


    尽管如此，有一些测试和工具的关键组件可以使设计安全对许多人来说更容易更成功。让我们聊聊其中一些组件。


    #### 设计评审和威胁建模


    通常由安全工程师（理想情况下嵌入在产品或开发团队中）完成，这一组件帮助团队思考事情可能如何出错。技术有哪些可能的误用方式？通过开发或连接，业务生态系统中引入了哪些弱点？当定期在跨业务部门执行时，这一过程也有助于安全组织制定需要哪些能力和功能的策略。


    #### 渗透测试和漏洞赏金计划


    这些测试通过模拟攻击者可能如何交互并破坏应用程序、基础设施或系统来发现漏洞。渗透测试应该在生产前进行，并且通常是各种合规标准和法规的要求。漏洞赏金计划是结构化的协议，如何处理和奖励对生产后测试产品的研究人员的负责任漏洞披露。


