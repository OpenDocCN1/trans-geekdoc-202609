    In North Carolina, for example, the state has established programs to support
    local government and schools in their response to cyber incidents. This is only
    one of a myriad of support mechanisms in place. The “big picture” for the state
    is the overall protection of a resident''s data. This data is not only stored
    in state agency systems, but is also housed within local counties, municipalities,
    and schools. In addition, much of the critical infrastructure supporting the state
    resides at the local government level. These are systems that provide critical
    services such as `911`, water, power, and others, often supported with limited
    resources and funding. By establishing a whole-of-state approach, North Carolina
    is able to adopt a team approach and build relationships and partnerships of trust
    and mutual support.


    How can you apply this concept in your organization? The first step is to understand
    the situation and resources at your disposal. The North Carolina Department of
    IT accomplished this by first conducting a strength, weakness, opportunity, and
    threat (`SWOT`) analysis. They identified key stakeholders such as local government
    information technology and cyber professionals who can be assembled to support
    any impacted parties within the state''s government structure. Over time, a solid
    foundation of trust is built, which further enables information sharing. `IOCs`,
    best practices, and other pertinent information can be quickly disseminated statewide
    to ensure all potential targets are protected. Anyone can leverage this same approach
    by networking and building relationships to call on in times of need, strengthening
    the entire ecosystem.


    Information sharing is an important strategy for mitigating today''s threats;
    see [Chapter 4](#c04.xhtml) for more information on this topic.


    ## Reducing Risk Through Cyber Insurance


    Does cyber insurance make sense as a risk reduction strategy? It might not make
    much sense to buy cyber insurance if resources are still lacking for purchasing
    and implementing solutions to support needed security controls. But cyber insurance
    does have a role to play.


    As the rest of this chapter makes clear, we do not recommend that you rely solely
    on cyber insurance. Doing so is reckless and a poor approach to risk management.
    In fact, having cyber insurance does not shift any of the ownership and accountability
    for risk, which remains fully with the organization that purchases the insurance.
    Instead, cyber insurance should be looked at as another tool within an organization''s
    risk toolbox. Cyber insurance offers both the customer and the company a means
    to reduce cost implications from a cyber breach by paying first-party costs associated
    with a breach, such as forensics, victim notification, and credit card monitoring.


    Another potential rationale for purchasing cyber insurance is to gain external
    confirmation that an organization has leveraged a standard approach to implementing
    a security program. Many reputable sellers of cyber insurance require that their
    customers meet, at a minimum, cyber best practices prior to being sold a policy.
    These best practices are aligned to industry frameworks such as the `NIST Cybersecurity
    Framework`.


    If you have a small business, cyber insurance may well be worth the cost. Statistically,
    over 60% of small businesses impacted by cyber incidents fail to recover.


    ## In Closing


    The `CISO` role today requires a strong strategic thinker who can be not only
    a collaborative partner for the business but also a strategic partner to other
    risk organizations. Having strong relationships across the organization and with
    key external consortia enables a stronger risk posture for the entire enterprise.
    Being embedded in the risk oversight and governance processes, armed with an informative
    set of `KRIs` plus understanding of the full universe of potentially impactful
    risks from a broad viewpoint, allows the `CISO` to be a leader in ensuring the
    success of the organization''s objectives.


    ## Notes


    1. [1](#c06.xhtml#R_c06-note-0001). [https://www.cisa.gov/critical-infrastructure-sectors](https://www.cisa.gov/critical-infrastructure-sectors)

    2. [2](#c06.xhtml#R_c06-note-0002). [https://us-cert.cisa.gov/resources/sltt](https://us-cert.cisa.gov/resources/sltt)

    3. [3](#c06.xhtml#R_c06-note-0003). [https://www.infragard.org/](https://www.infragard.org/)

    4. [4](#c06.xhtml#R_c06-note-0004). [https://www.nist.gov/cyberframework](https://www.nist.gov/cyberframework)

    5. [5](#c06.xhtml#R_c06-note-0005). [https://www.vox.com/sponsored/11196054/why-every-small-business-should-care-about-cyber-attacks-in-5-charts](https://www.vox.com/sponsored/11196054/why-every-small-business-should-care-about-cyber-attacks-in-5-charts)


    # 7 Blending NOC and SOC


    ***MEL T. MIGRIÑO***


    When your security team faces a disruptive incident, time is of the essence. Any
    delay in identifying, responding to, and mitigating the problem increases risks
    and leads to still more disruption. These costly delays are more likely in entities
    where the Network Operations Center (`NOC`) and Security Operations Center (`SOC`)
    are completely separate with limited visibility into the other''s world. When
    teams remain siloed, inefficiencies and errors slow effective incident response
    and hamper overall network and security operations.


    As cyber threats continue to increase in number and severity, siloed `NOC` and
    `SOC` teams are a luxury your organization cannot afford. But as we''ll see, the
    solution is not necessarily a quick, complete blending or merger of the two teams.
    Failing to consider all the details of blending or rushing to complete the process
    can create additional problems without necessarily solving the issues at hand.
    A more nuanced answer is required.


    ## The Vision


    Just as firefighters and emergency medical technicians together respond to fires
    and work in tandem to both put out fires and treat victims, integrated `SOC` and
    `NOC` response teams can work together to troubleshoot incidents and keep the
    network both secure and reliable. Key benefits of blending `NOC` and `SOC` include:


    - Faster resolution of incidents: Instead of working independently after an incident
    occurs and sometimes reaching conflicting conclusions as to the root cause, blended
    teams can quickly identify a problem, track the causes, and thoroughly mitigate
    and solve the issue.

    - Reduced system downtime: With teams working effectively and rapidly in tandem,
    security incidents are less likely to develop into prolonged network disruptions.

    - Reduced incident impact: By addressing incidents holistically and collaboratively
    using a playbook defined and practiced in advance, a blended `NOC` and `SOC` shuts
    down incidents faster and thereby reduces their damaging effects.

    - Improved processes: Co-locating or blending teams makes it easier to launch
    an integrated incident investigation.

    - Increased information sharing: Team members who know each other are more likely
    to share information both formally and informally. This information sharing can
    lead to, daily operations, and long-term business success.

    - Better coordination with other relevant teams: A blended team, especially if
    there is a single point person, can more easily coordinate with additional groups
    as needed.

