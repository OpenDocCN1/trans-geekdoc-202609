- raw: 'In an attempt to attach threat actors to their TTPs (tactics, techniques,
    and procedures) and assign attribution, security companies come up with their
    own identifiers. The sometimes silly-sounding collection of proprietary names
    is dizzying. Just a quick lookup of the Fancy Bear group yields this Wikipedia
    description: “Fancy Bear


    You don’t need to remember these funny names because those details aren’t important
    for even the majority of people who work in cybersecurity.


    What is far more important is that you take the time to find out what your organization
    has or does that might be of interest to a variety of types of threat actors and
    how you can help drive your organization toward greater security.


    ### State-Sponsored Attacks


    Nation-states are well-funded, sophisticated, and motivated by political, economic,
    and national security military reasons.


    No one should be surprised that nations use cyberspace for espionage. After all,
    the world has moved online, so donning a disguise and photographing documents
    with a secret camera just doesn’t make sense today. Modern nations have cyber
    intelligence-gathering programs. Israel and the US have some of the best programs—as
    do adversaries Russia, China, Iran, and North Korea.


    Not surprisingly, attackers look for insiders to recruit. In 2015, a nation-state
    actor compromised the Office of Personnel Management


    The recent SolarWinds


    SolarWinds also highlights an attack on a smaller vendor. While a larger firm
    like Microsoft or Amazon might have the resources to defend themselves, even those
    firms would probably struggle to fend off a targeted attack from a nation-state.
    It’s worth considering that organizations would never be expected to defend themselves
    against physical attacks, but are somehow expected to fend off nation-state cyberattacks.


    Nation-states also leverage cyber capabilities to degrade their adversaries’ ability
    to respond in conflict—whether taking down a power facility or sabotaging other
    capabilities like nuclear centrifuges. Of course, nation-states use cyberspace
    for espionage; they are just updating espionage and combat techniques to the times.


    But the goals of nation-state attacks have expanded from traditional national
    security intelligence and counterintelligence collection purposes, or even operational
    preparation of the environment for a time of conflict. We also see cases of personal
    revenge, such as the Iranian government’s 2014 destructive malware attack on the
    Sands Casino


    Nation-states also use sophisticated online psychological operations to drive
    their national security goals, evidenced in Russian election interference using
    social media.


    Nations use cyberattacks for asymmetric projection of power, to show a nonmilitary
    “proportional response” to other nations. Sometimes the target for response is
    a private-sector company. For example, Iran launched distributed denial-of-service
    (DDoS) attacks against US financial institutions in retaliation for sanctions
    by the US government in 2012.


    Nation-states also leverage cyberattacks for economic advantage. China has stolen
    American trade secrets worth billions to help its economy leap forward and to
    give its own businesses an edge in negotiations and research and development.
    Why spend years working on a new formula when you can simply steal one from a
    US company? Why go into a contract negotiation cold when your government can get
    you the competition’s proposal? Retired general Keith Alexander, former director
    of the NSA, has described it as the “greatest transfer of wealth in history.”


    While the US government certainly does its fair share of spying for national security
    reasons, it does not spy to support American businesses. The Department of Homeland
    Security (DHS) has warned industry about Chinese intellectual property theft for
    years, and most recently warned about backdoors in Chinese products.


    In a DHS press release, Acting Secretary Chad Wolfe pointed out that television
    manufacturer TCL receives support from the Chinese Communist Party to compete
    in the global electronics market. “TCL incorporated backdoors into all of its
    TV sets, exposing users to cyber breaches and data exfiltration,” noted Wolfe.


    This is nothing new; China has used these tactics for over a decade and simply
    continues to evolve and expand its TTPs.


    Other nation-states seek financial benefit to fund their initiatives. Heavily
    sanctioned nations like North Korea have turned their army hackers to cybercrime
    to fill the regime’s coffers. North Korea has leveraged attacks on crypto currency
    and financial institutions


    ### Cybercriminals


    Cybercrime isn’t about the stereotypical guy in his parents’ basement; it is a
    sophisticated industry. In nations around the world with limited extradition potential
    and rule of law, criminals hack with impunity and have grown organizations that
    look like a large commercial company, with help desks, training, R&D departments,
    and money-back guarantees. Hacking provides economic opportunity in places where
    it is lacking. Like any successful business, practices and techniques evolved
    with the market landscape.


    When stolen credit card numbers and personal information flooded the dark web,
    driving down prices (supply and demand), cybercriminals ventured into malware
    as a service, business email compromise, sophisticated human-operated ransomware,
    and most recently DDoS for ransom.


    Sometimes threat actors impersonate other known criminal groups. Beginning in
    mid-2020, financial institutions began receiving letters sent to several organizations
    by actors posing as Fancy Bear or Lazarus Group.


    Sometimes lines between nation-states and criminal actors blur. In late 2020,
    it was reported that threat actors behind Maze, Egregor, and Evil Corp are tied
    to the Russian government. Some reports claimed that Maze, Egregor, and Evil Corp
    are all one group operated by people within the Russian intelligence service.
    The US Treasury Department


    Government employees may also work for cybercrime organizations to supplement
    their income. At the end of the day, the organization ultimately directing these
    attacks matters less to businesses than the impact: ransomware attacks cost organizations
    $20 billion in 2020.


    As cybercriminals continue to evolve their tactics, they also grow the pool of
    cybercriminals. By selling malware as a service with training modules, they’ve
    lowered the barrier to entry to becoming a cybercriminal.


    As criminals make more money, they invest in more advanced techniques, leveraging
    AI/ML (artificial intelligence/machine learning) and creating technology platforms
    for delivery.


    ### Hacktivists


    Hacktivists


    ## Key Tactics


    Now that we have walked through the who and the why behind the attacks, we will
    talk a bit about how the attackers succeed.


    ### Phishing


    Social engineering continues to be the most common attack vector. Phishing is
    the fraudulent attempt to obtain personal information from individuals through
    emails purporting to be from reputable companies. Phishing remains king, from
    business email compromise to credential harvesting.


    When phishing emails do not succeed, attackers send texts to get employees to
    click on a link or open a file to enable malware or, frequently in recent years,
    to steal credentials to access an organization’s systems and data.


    Phishers send messages that cast a wide net. They range from “Your email is over
    its size limit” to “Your bank account has been frozen” to “You have a package
    that can’t be delivered.” In the run-up to the 2020 holiday shopping season, the
    operators behind Dridex conducted a blast phishing scam that promised recipients
    a $100 Amazon gift card'
