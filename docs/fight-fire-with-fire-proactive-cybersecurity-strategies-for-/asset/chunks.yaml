    # 2 Communicating with the Board


    MARIANNE BAILEY


    Achieving effective communication can be one of the most difficult tasks. People
    face this challenge as they talk past each other often in everyday lives because
    one party assumes the other has the same background, biases, and interests. This
    problem is no different when communicating with boards of directors.


    In order to overcome this communication gap, it is critical to understand the
    mission of the board, to speak their language, and to clearly articulate why they
    care.


    ## The Board


    The function of the board—and this is true for many—is to evaluate the organization''s
    strategy. The board will often be comprised of the chairman of the board, the
    CEO, the CFO, general counsel, and external experts. Topics range from the organization''s
    financials, investments, and culture to staffing issues, diversity numbers, and
    legal issues. Communication to the board must be presented in a clear, crisp,
    and easily understood format.


    ## Speak Their Language


    The first significant challenge is speaking the same language. Technical people,
    including those in cybersecurity, speak their own unique language. They have a
    difficult time discussing their programs at a high level that boards understand.


    As a leader of many technology organizations, I experienced this challenge from
    my first leadership position all the way up to my positions as the cybersecurity
    lead at `NSA` and deputy `CIO` for cybersecurity in the `Pentagon`. Whether technical
    staff or leaders were briefing me or I was preparing staff to brief top boards
    and committees in the `Pentagon`, `Congress`, or the `White House`, I would spend
    significant time pulling pertinent information from a fifty-page briefing. I would
    rarely see a clear and concise presentation. Individuals include far too much
    information and do not articulate their message. I would ask them, “What are you
    trying to tell me, or your senior audience? What do you want from me, or them?”
    It is very important to understand your audience and tailor your message to that
    audience in a way that resonates with their responsibilities.


    ## Preparing for the Board Meeting


    Do your homework. Be able to answer these questions:


    *   Who are the board members? What are their backgrounds? Are there members of
    the board who will be allies for my program? Is there an opportunity to share
    information with them ahead of the board meeting? If so, take every opportunity
    to meet one-on-one with them to explain your program and your issues. You will
    find that even one or two board members who become advocates will be extremely
    valuable.

    *   What are the company''s big strategic pushes?

    *   Is my position in line with my leadership? You never want to oppose your leadership
    in a board meeting. Understand that your leaders have many issues they are working
    on and yours may not currently be the top priority. It is not worth damaging the
    trust relationship.

    '
