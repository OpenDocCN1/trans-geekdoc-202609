    # 9 From Enforcer to Strategic Partner: The Changing Role of Governance, Risk,
    and Compliance


    **Beth Anne Bygum**


    Tucked in a window seat on a southwest airlines flight, I started my familiar
    weekend route between Phoenix and Burbank. Opening my phone, I continued reading
    *The Pentagon''s Brain*


    This theme comes up again in the Netflix original documentary *The Social Dilemma*.


    The current emphasis on digital transformation and user experience is nothing
    new. Digital experiences are important, but the capabilities must be developed
    with security at the core for the services to be resilient and sustainable, at
    the same time maintaining the trust granted by our users and customers. Without
    this fundamental principle, organizations cannot fulfill their duty to ensure
    the confidentiality and integrity of information, systems, and data. As leaders,
    we perpetuate the problem unless we use methodologies that enforce the ability
    to design and configure security at the very core. We could say this is the perfect
    storm created by the intersection of digital transformation, advanced computing
    platforms, increased connectivity between systems, and the ever-decreasing ability
    to pinpoint weaknesses that may result in a supply chain hack, infrastructure
    compromise, or significant data leakage. Upping the ante is the fact that the
    risk landscape is changing at an aggressive pace; a compliance executive must
    also accurately interpret concerns that undermine the confidentiality and integrity
    of data.


    Compliance professionals and CISOs alike face a shift that originates from these
    direct and indirect drivers. It is reshaping our approach to define governance
    models, assess risk, implement right-size compliance requirements, and communicate
    residual risk to our leaders.


    How can we deliver more value without overusing the bad-actor risk narrative?
    This chapter provides suggestions that may help you shift the governance and compliance
    role from enforcer to strategic enabler at your organization.


    ## Information Governance Council: Oversight That Works


    Compliance governing bodies often have a bad rap. Their work is perceived as overhead,
    processes that delay project timelines and create tasks that require lots of approvals.
    In too many cases the resulting guidance is redundant or, worse, may conflict
    between departments.


    We can change the paradigm.


    As organizations adopt advanced digital solutions and leverage the competitive
    advantage that next-generation computing offers, well-designed governance models
    accelerate innovation, expedite the adoption of new solutions, and can simplify
    the approval process.


    Delays to timelines and the necessity for multiple approvals stem from disparate
    compliance tasks created using a departmental lens rather than an integrated risk
    review process lens. Historically, each compliance or risk team evaluates the
    use of data, regulatory requirements, security concerns, and the impact of technology
    separately from its own perspective.


    Establishing an Information Governance Council offers a way to streamline approvals
    and guidance for new uses of technology and data. This approach seeks to bring
    all the relevant decision-makers into one group, with representation across departments.


    Broad agreement from council members ensures that the organization''s data compliance
    and information strategy contributes directly to corporate strategy. Depending
    upon your organization and industry, the naming convention of these areas may
    vary.


    Compliance leaders should be part of the Information Governance Council. They
    may have titles like head of compliance, chief governance officer (`CGO`), or
    chief risk officer (`CRO`).


    The council naturally includes employees representing the legal, privacy, information
    security, information systems, and technology product teams. It should also include
    representatives from Sourcing and Procurement to gain insight into investment
    road maps and minimize risks prior to purchase and throughout the contract management
    process. Adding such groups enables early detection of changes to the use of licensed
    data, systems, or information.


    Your council''s charter should be designed to:


    *   Streamline the evaluation of risk to your data or compliance posture, offering
    holistic and integrated guidance from the various stakeholders.

    *   Increase clarity about interpretation of requirements.

    *   Expedite approvals along the organization''s integrated set of policies, standards,
    and practices. This creates efficiencies.


    To be effective, the Information Governance Council must make decisions in a way
    that balances the concerns of the stakeholders.

