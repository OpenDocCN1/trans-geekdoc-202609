  trans: '

    建立一个强大的内部威胁计划需要与员工、工会、人力资源和法律顾问之间寻求一种微妙的平衡。你面对的是那些他人认为很熟悉的人，而且他们被赋予了完成工作所需的级别访问权限。


    有时，辨别好行为和坏行为是困难的，因此需要复杂的行为分析。安全团队往往缺乏业务背景，无法理解预期的行为，这使得此类分析变得困难。当然，从 IT 或安全部门内部检测内部人员有时更为困难——他们知道别人在侦查什么，以及如何规避监控。这就是为什么定期审查特权用户的行为至关重要。工具、人员、政策和流程的缺乏使得有效管理内部威胁变得极具挑战性。


    ### 最佳实践

    简单的最佳实践确实可以帮助防止麻烦。限制访问权限；仅为人员提供工作所需的系统和数据访问，这也称为“最小权限原则”。根据他们的工作，这意味着他们*当前*的工作，而不是他们五年前的工作。定期审查访问权限。创建职责分离机制以提供制衡，并对敏感活动（无论是发送大额电转账还是维护加密密钥）要求双重授权。


    ### 监控内容

    你的内部威胁计划应该寻找什么？安全团队应该关注以下行为，无论是有蓄意的恶意，还是仅仅导致公司面临风险的严重违规行为：


    *   未经授权使用 IT 资源和应用程序

    *   员工使用未经授权的云账户存储公司信息

    *   违规使用影子 IT（Shadow IT）

    *   访问、共享或分发个人身份信息（PII）

    *   安装未经批准和许可的软件

    *   未经授权使用受限应用程序，包括网络嗅探和远程桌面工具

    *   未经授权传输数据或使用可移动媒体存储或移动数据

    *   未经授权将业务关键数据复制到云或网络服务

    *   向异常目的地发送或接收文件

    *   使用即时通讯或社交媒体应用程序移动文件

    *   误用、滥用和恶意行为

    *   滥用文件系统管理员权限

    *   禁用或覆盖端点安全产品

    *   使用 `John the Ripper` 和 `Hashcat` 等密码破解工具

    *   访问暗网或与工作无关网站


    ### 缓解与意识

    你可以做什么来尽量减少无意的内部威胁，并帮助所有员工成为解决方案的一部分？创建一个稳健且持续的安全意识培训计划，包括教育和培训，不仅针对新员工或每年一次，而是持续进行。每个人都必须是团队的一部分。


    钓鱼测试是此类计划的价值部分，其难度应随着季节和员工角色的变化而增加和调整。例如，在二月，使用“秘密恋人”（`Secret Admirer`）邮件测试员工，或者发送关于看似来自
    `HR` 的新福利包信息。针对特定部门的业务背景定制钓鱼测试信息。例如，你可能会向总法律顾问员工发送有关免费持续法律教育课程的信息，或根据最新的真实世界攻击邮件，向财务部门发送虚构的业务电子邮件诈骗（BEC）诱饵。


    员工应该知道如何报告看似异常的情况，并知道应该向谁报告。某个员工可能非常敏锐并发现钓鱼邮件；另一位员工可能很匆忙或正在使用移动设备而错过。应该始终鼓励报告，并可能通过勋章或感谢邮件进行强化。在与开发者合作时，解释为什么安全如此重要，即使这会产生摩擦。通过与开发团队建立安全冠军计划（Security
    Champion Program）来获得支持并为共同责任建立知识。从一开始就开始构建安全，总是比事后补救更好，也更便宜。


    ### 组织文化

    同样，创建这些信息需要谨慎。`HR`、法律和企业传播部门在定义如何处理内部威胁方面起着作用。安全团队必须确保不要创造一种让员工感到不受信任的文化，因为在大多数情况下，员工是有好意的。


    要求业务负责人提供背景信息，这样你就可以在不用安全术语的情况下讲述相关的、引人胜的故事。如果机密性、完整性或可用性受到网络攻击，你的客户和业务会发生什么？人们可能会网络事件的新报道变得麻木；让他们感到风险是真实的很重要。人们希望感觉自己是团队的一部分并受到重视。他们希望被视为有价值的贡献者，并且通常对客户和公司使命感到联系。


    人们是你的第一道防线吗，还是他们应该是你的最后一道防线？我们应该期待技术阻止一切吗？虽然最新的安全工具和平台让我们更接近端到端安全（正如[第 14 章](#c14.xhtml）所示），但员工也应该感到自己是安全团队的一部分。对手聪明且不断进化，我们需要全员警戒。我们需要训练员工，在感觉奇怪或看起来不太对劲时保持怀疑，强化“见事说事”（If
    you see something, say something）的格言。这可能是来自 CEO 个人账户要求财务转账的邮件、IT 索要密码信息的电话、要求凭据的奇怪窗口，或在办公室徘徊的陌生人。鼓励人们提问，而不是害怕减慢流程或显得于事无事或偏执。


    员工经常能发现复杂系统未能捕的钓鱼邮件。员工会注意到异常的系统行为或收到的不常查询。他们比中心化的网络安全团队更了解自己的工作、流程和应用程序，应该让他们参与到威胁格局以及恶意攻击者在他们独特的工作环境中可能利用的讨论中。


    员工还可以帮助你理解对手可能感兴趣的“核心资产”。我在 `CIA` 的一个朋友曾说：“如果你对中国感兴趣，中国也对你感兴趣。”如果与业务部门没有伙伴关系，安全团队如何知道有关进入合资企业或投标与中国相关合同的计划呢？考虑建立业务信息安全官（BISO）计划以加强这种联系，并确保安全被构建到新的系统和过程中，并建立安全方面的联系以帮助业务理解新兴威胁和不断演变的风险。


    ## 结论


    当本书出版时，网络威胁格局无疑会发生变化和进化。会有新的恶意软件变体、新的计划和诈骗，以及针对攻击者小组更有响亮的名字。地缘政治将导致国家之间随着利益的变化而相互针对。


    但什么是没变的？坏人将继续利用我们的新工具和技术来获取他们需要的东西并实现目标。网络攻击的回报将促使我们在推进防御的同时不断改进战术、技术和程序（TTP）。与此同时，大多数入侵源于我们的员工落入钓鱼圈，以及对补丁的忽视。


    我们根本没有强迫人们拿出最高水平。如果像俄罗斯这样的国家真的想要访问你特定的公司网络，即使拥有最好的、最贵的商业网络安全计划，你可能也无法阻止。但你可以让自己成为一个更有挑战性的目标，而不是成为最新攻击者“爆发”行动的牺牲品。

    '
