  trans: '


    通过一些研究和内部数据收集，为您的组织转化行业趋势。数据很可能分布在不同的地方，因此利用这些人际关系将有助于确定从何开始。与安全一样，用于实现性能衡量的数据可能被视为事后考虑的问题，而且找到正确的数据可能是困难的。以下是一些更容易找到的指标，可以帮助在转化行业趋势时提供影响规模的参考：


    *   去年发现了多少软件缺陷和安全漏洞？

    *   有多少个缺陷是重复发现的？

    *   是否任何缺陷导致了安全事件、停机或泄露？


    一旦你有了这些数字，就可以帮助描绘通过实施“安全设计”（security-by-design）计划来实现“左移”（shifting left）的潜在收益图景。接下来，你希望包含计划的指标，以衡量计划性能与预期目标的匹配情况。需要注意的是，创建和解释指标本身就是一门学科，需要专业知识。聘请数据科学家来帮助构建你的故事，并用数据支持它，以便你所衡量的内容能够支持你寻求的决策和结果。虽然许多人对“数据驱动决策”这一术语着迷，但在涉及人类的情况下，数据很少单独驱动决策。数据会影响决策；我们的经验和背景起着同样重要的作用。


    数据科学家将帮助你确定数据可以和不能用在哪里，并帮助对基线、频率和预期改进的合理性设定预期。例如，如果你试图通过衡量重复缺陷的减少来展示计划随时间变化的价值，那么你的结果取决于开发周期。换句话说，在每个开发周期之后你只会获得一个数据点，因此报告频率与何时以及有多少数据可用于趋势和分析相对应。如果你有两周一次的冲刺，并并在集成
    `SAST` 工具后衡量每个冲刺的重复缺陷，你需要让足够的冲刺通过，以获得统计上充分的数据来显示随时间推移的影响。你还需要时间让一批人员完成培训周期，以展示培训在整体解决方案中的优势。


    ## 结论


    安全设计（Security by design）涉及跨组织的根本性变革，并要求文化转变，在这种文化中，安全成为质量和就绪定义的不可或缺的一部分。这是对人员、流程和技术的投资，可以产生强大的竞争优势。我们作为安全领导者，如何沟通并制定价值和实施战略，是实现“左移”文化的关键组成部分。与利益相关者合作以了解观点、分享并扩展技能，以及共同创造解决方案，是成功的基础。


    ## 备注


    1. 1。OWASP 前十名 Web 应用程序安全漏洞列表 ([`owasp.org/www-project-top-ten/`](https://owasp.org/www-project-top-ten/))
    已经存在多年。许多相同的漏洞年年地出现。

    2. 2。上市公司向美国证券交易委员会提交的公开报告，可在 [SEC.gov](https://www.sec.gov/) 获取。


    # 第 9 章 从执行者到战略伙伴：治理、风险与合规角色的演变


    **Beth Anne Bygum**


    坐在西南航空航班的靠窗座位上，我开始了我往返于菲尼克斯和伯尔班克之间熟悉的周末路线。打开手机，继续阅读《五角大楼的大脑》（The Pentagon''s Brain*）。


    这个主题在 Netflix 原创纪录片《社交困境》（The Social Dilemma）中再次出现。


    当前对数字化转型和用户体验的强调并不新鲜。数字体验固然重要，但必须以安全为核心开发这些能力，以确保服务的韧性和可持续性，同时维护用户和客户赋予的信任。没有了这一基本原则，组织无法履行确保信息、系统和数据机密性和完整性的职责。作为领导者，除非我们使用能够从核心处强制设计和配置安全的方法，否则我们就会延续这个问题。我们可以说，这是由数字化转型、先进计算平台、系统间连接性增强，以及准确定弱点的能力不断下降（这可能导致供应链攻击、基础设施受损或重大数据泄露）共同交织而成的“完美风暴”。更糟糕的是，风险格局正以激进的速度变化；合规高管还必须准确解释损害数据机密性和完整性的担忧。


    合规专业人员和首席信息安全官（CISO）都面临着源于这些直接和间接驱动因素的转变。它正在重塑我们定义治理模型、评估风险、实施合适的合规要求以及向领导层汇报剩余风险的方法。


    我们如何在不过度使用“坏人风险”叙事的情况下提供更多价值？本章提供的建议可能帮助您将组织中的治理和合规角色从执行者转变为战略性赋能者。


    ## 信息治理委员会：有效的监督


    合规管理机构通常声誉不佳。他们的工作被视为开销，是延误项目时间线的流程，并创建了需要大量审批的任务。在许多情况下，产生的指导是冗余的，更糟糕的是部门之间可能冲突。


    我们可以改变这种范式。


    当组织采用先进的数字化解决方案并利用下一代计算提供的竞争优势时，良好的治理模型可以加速创新、加快新解决方案的采用，并简化审批流程。


    时间线的延误和多次审批的必要性源于使用部门视角创建的碎片合规任务，而不是基于集成风险审查过程视角。历史上，每个合规或风险团队都从自己的角度单独评估数据的使用、监管要求、安全担忧以及技术影响。


    建立信息治理委员会（Information Governance Council）为技术和数据的新用途提供了一种简化审批和指导的方法。这种方法试图将所有相关的决策者聚集到一个小组，并跨部门代表。


    委员会成员的广泛共识确保了组织的数据合规和信息战略直接有助于公司战略。根据您的组织和行业，这些领域的命名规范可能会有所不同。


    合规领导者应该是信息治理委员会的成员。他们的职称可能是合规主管、首席治理官（`CGO`）或首席风险官（`CRO`）。


    委员会自然包含了代表法律、隐私、信息安全、信息系统和技术产品团队的员工。它还应该包括采购和供应部门的代表，以了解投资路线图，并在购买前和整个合同管理过程中最小化风险。增加此类小组能够尽早发现许可数据、系统或信息使用的变化。


    您的委员会章程应设计为：


    *   简化对数据数据或合规状况风险的评估，从各个利益相关者那里提供整体且集成的指导。

    *   提高对要求解释的清晰度。

    *   根据组织整合的政策、标准和实践加速审批。这创造了效率。


    为了确保有效，信息治理委员会的决策方式必须平衡利益相关者的担忧。


    '
