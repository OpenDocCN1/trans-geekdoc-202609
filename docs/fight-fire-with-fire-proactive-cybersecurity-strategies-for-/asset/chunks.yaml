- raw: 'The culture you establish is also important (a topic covered in more detail
    in [Chapter 3](#c03.xhtml)). Systems over-alert, but people rarely do. Often tier
    1 analysts may not want to raise a particular issue for fear of bothering leadership.
    Encourage staff to raise issues early so that you can assess them rather than
    waiting to confirm issues themselves before reporting.


    Especially if the teams remain somewhat separate, create clear, formal communication
    channels between your NOC and SOC teams. But also create environments that enable
    casual sharing of information and insight between the two teams. Perhaps a shared
    kitchen or water cooler.


    ## Working with Executive Leadership


    General counsel, the chief risk officer, CEOs, and CIOs are very concerned about
    risk; improper incident handling can result in court cases. The legal and risk
    teams offer guidance for handling incidents so that the organization can stay
    out of court if possible or be properly prepared if an incident results in legal
    proceedings.


    Proactively, CISOs should consult these groups to ensure that policies and procedures
    stay within legal frameworks. See [Chapter 2](#c02.xhtml) for more information
    on communicating with the board.


    ## Processes for Integrating the NOC and SOC


    Change management is a big piece of blending the NOC and SOC, but, as with any
    initiative, the metrics you choose matter. Instead of volume-based security metrics,
    mature organizations concentrate on impact-based metrics and trends linked to
    certain types of attacks, security gaps, and misconfigured controls.


    Developing best practices will help you blend the NOC and SOC to create a better
    security defense. In addition to best practices, create clear and detailed playbooks
    so teams know what plan of action to follow during a threat event. Make sure you
    have playbooks tailored to each type of incident, as steps vary depending on the
    type of incident you are dealing with.


    Then, supplement your playbooks with one-pagers or cheat sheets that your team
    members can quickly reference. These cheat sheets should include information such
    as which alerts matter, how to respond initially, and when and to whom to escalate
    an issue.


    Assigning responsibilities is another key process. For example, NOC can lead Level
    1 monitoring, but the skills and responsibility for investigating incidents are
    best assumed by the SOC team. Meanwhile, network monitoring is something SOC team
    members can learn, but NOC should lead network troubleshooting because that is
    their domain of expertise.


    Keep in mind, however, that there is no holy grail structure for stronger collaboration
    and cooperation between NOC and SOC. The emerging structure is going to be different
    in every organization.


    ### Tabletop Exercises


    Organizations can better respond to attacks and other cyber incidents when they
    have prepared and rehearsed beforehand. Tabletop exercises are a key way to train
    analysts, rehearse responses to threat events, and promote cohesion among NOC
    and SOC team members.


    Such events should include a variety of stakeholders; you may need people from
    legal, human resources, and corporate communications as well as business owners
    to provide system or scenario context. Look to hold a major daylong tabletop exercise
    once or twice a year and shorter, focused events quarterly if possible.


    ### Incident Review


    Playbooks, cheat sheets, tabletop exercises, and ongoing training are all important,
    but nothing replaces an after-the-fact incident review. In this review, teams
    seek to answer questions such as: Did this threat create an alert? If not, why
    not? If so, why didn''t we respond?


    Organizations can use this information in their incident response plans to better
    train analysts so they can understand why an incident happened. A threat event
    should not be the first time team members see the response protocols. Based on
    the findings, materials and systems can be updated to alert analysts earlier in
    the threat cycle.


    ### Sharing Threat Information with Peers


    The only way to prepare for incidents is to anticipate them. This requires staying
    abreast of the latest threats. Just as attackers share malware and exploits among
    themselves, CISOs also need to be engaged and share threat information with counterparts
    in their industries.


    Stay informed about current threats by asking questions like:


    *   What are the current threat trends?


    *   Is ransomware on the rise in your sector?


    *   If so, what kinds of ransomware?


    *   Does the ransomware exhibit certain behaviors you can track?


    This sharing among your peers at other organizations will help you understand
    what types of attacks are hitting your sector and who the actors are. You can
    make sure you have the right controls to address their tactics, techniques, and
    procedures. By becoming part of a community of interest or other information-sharing
    channel, you can get ahead of activity that could trend and become a nightmare
    for your organization.


    ### Highlighting Critical Issues


    Existing security tools generate too many alerts and voluminous logs. Some solutions
    offer a way to correlate alerts across systems and reduce the number of alerts.
    If we think of the NOC and SOC as frontline workers like firefighters and EMTs,
    alerts should indicate real emergencies or at least the equivalent of a beeping
    smoke detector.


    Right now, at many organizations, a preponderance of false positives makes it
    hard to find real issues. Even when systems alert only on genuine issues, the
    task for analysts is working to find the issues with the most impact. It is not
    even like finding a needle in a haystack; it''s like trying to find a dirty needle
    in a stack of needles. Especially with so-called low and slow attacks becoming
    more prevalent and attacker dwell times rising, significant long-term breaches
    may fail to alert anyone or may appear as minor and easily dismissed alerts.


    ## Technology for Improved Incident Response


    Organizations are awash in data and alerts, partly because of the sheer number
    of security tools in use. Too often, each tool is designed to act independently,
    producing its own logs and alerts and making it difficult to correlate information
    across tools.


    Tier 1 analysts do not have years of experience and may not know which playbook
    or even cheat sheet to reach for. And in trying to prove themselves, they may
    not ask for help. (See most disaster movies for missteps like these.)


    When custom tooling is needed to bridge these gaps, security analysts should be
    consulted throughout the development cycle. Too often, security analysts provide
    requirements for an application they want from engineering, and then engineering
    teams make a judgment call and ignore some of the requirements. The resulting
    product is ineffective and, instead of being deployed, ends up in the land of
    broken toys, which is a waste of everyone''s time.


    Emerging commercial solutions help with some urgent needs for the NOC and SOC.


    One recent category of tools that is important for the NOC and SOC is called secure
    orchestration automation and response (SOAR). A SOAR takes alerts, prioritizes
    them, and contextualizes them with relevant elements of your playbooks so that
    information on critical next steps is provided along with alerts.


    SOARs, like many modern security tools, use AI and machine learning to sift through
    voluminous data, identify patterns that are anomalous, and pull in contextual
    information. SOAR systems use this to present analysts with concrete and relevant
    information in a timely manner so that the analysts can effectively respond to
    incidents.


    This is one of many examples of letting machines do what they do best (sorting
    through large volumes of data) and letting people do what they do best (investigating
    and acting on information). Experienced personnel help tune such systems so that
    they improve and yield better results for analysts running the integrated NOC
    and SOC.


    ## A Smooth but Slow Transition'
  fmt: 'The culture you establish is also important (a topic covered in more detail
    in [Chapter 3](#c03.xhtml)). Systems over-alert, but people rarely do. Often tier
    1 analysts may not want to raise a particular issue for fear of bothering leadership.
    Encourage staff to raise issues early so that you can assess them rather than
    waiting to confirm issues themselves before reporting.


    Especially if the teams remain somewhat separate, create clear, formal communication
    channels between your NOC and SOC teams. But also create environments that enable
    casual sharing of information and insight between the two teams. Perhaps a shared
    kitchen or water cooler.


