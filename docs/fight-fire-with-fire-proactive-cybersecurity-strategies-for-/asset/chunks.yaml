    As CISOs, we must become fluent in the language of the business. We must influence
    others to change their mindsets, habits, and approaches to technology and behave
    in ways that maintain security. We need a cultural shift that enables everyone
    to adopt effective, ongoing processes to keep our organizations safe. Security
    must be embedded into vendor selection, employee onboarding, and product development.
    Security awareness training must be continuous to match the cadence of the threats
    we face.


    We need security leaders who understand the value of the latest technology, but
    even more importantly who have the skills to develop relationships that bring
    people together and the discipline to create repeatable processes.


    ## How Can We Be Effective CISOs?


    Today''s security leaders face considerable stress. The CISO role has a high turnover
    rate, with an average tenure of just twenty-six months. Fundamental changes are
    needed to empower us to lead effectively, attain a better work-life balance, and
    manage the inevitable stress of our roles. The answer is not working longer hours;
    95% of CISOs are working an average of ten hours more a week than their contracts
    stipulate.


    We need shortcuts to success, like learning from mentors and peers. The challenge,
    of course, is finding the time for that learning. That''s why my colleagues and
    I wrote this book: to share our knowledge and, more importantly, our experience,
    something that you will not find in a textbook or on a certification exam. We
    have come together to share our perspectives as security leaders from across industries
    and sectors, offering our best thinking as well as sharing important lessons learned.
    Harnessing this insight and utilizing the strategies in this book can help leaders
    and organizations improve their culture and security posture.


    ## Who This Book Is For


    With the ongoing evolution in security challenges and the pressing need for a
    cultural shift, this book identifies steps that we as leaders need to be thinking
    about. This book is for anyone working in cybersecurity and IT leadership who
    seeks a better grasp of the continually changing nature of security threats and
    who is interested in effective approaches to address them.


    We also hope this book will inspire a more diverse group of people to consider
    a career in cybersecurity leadership. As we discuss in [`Chapter 5](#c05.xhtml),
    there are both a skills gap and a diversity gap to fill in the world of cybersecurity.


    By the time you finish this book, you will be evolving into a next-generation
    CISO. You will better understand how to adopt best practices and processes to
    encourage your people to make effective, safe use of technology. You will know
    how to serve as a business strategist, helping your organization reframe security
    as a business enabler. You will also learn how to improve security 24/7, up and
    down your supply chain, from the edge to the cloud, and from frontline workers
    up to your board. Finally, you will gain strategies to attract and promote the
    next generation of diverse talent.


    Let''s get started.


    ## Note


    1. [`1](#f07.xhtml#R_f07-note-0001). [https://nominetcyber.com/nominet-ciso-stress-report-one-year-on/](https://nominetcyber.com/nominet-ciso-stress-report-one-year-on/)]


    # PART ONE: People


    ![](images/p01uf001.png)


    Cybersecurity is no longer only the domain of I.T. and security teams. From the
    loading dock to the C-suite, everyone must be security minded.


    Within your organization, a well-trained staff can be your best line of cyber
    defense. But people can also be your worst enemies. You can buy top-of-the-line
    security technology and implement best practices, but if your people won’t follow
    good security practices and policies or use that technology properly, your organization
    remains at risk. You must also get buy-in from your board of directors to create
    a culture of security.


    ## How the CISO Role Is Evolving


    What’s the most important skill set for being a CISO? Current knowledge of the
    latest threats? Deep understanding of cybersecurity technology to mitigate security
    risks? Familiarity with the latest tools, tactics, procedures, and activities
    of well-funded hacking collectives?


    Tech knowledge is not the most important characteristic of a CISO today.


    Increasingly, CISOs are being elevated to the C-suite and becoming trusted business
    advisors. This requires soft skills, with the ability to communicate in terms
    that everyone understands. The CISO must be a business enabler and a strategic
    advisor who explains risk in business terms. [`Chapter 1](#c01.xhtml) discusses
    the evolution of this critical role so you can focus your efforts on becoming
    a strong security leader.


    ## Getting the Board on Board


    Corporate boards are becoming more focused on cybersecurity than they have been
    in the past. Board members are beginning to understand that a security threat
    is not just a problem for the security team but a risk to the entire business.


    Inadequate cybersecurity can expose employee and client data and put your organization
    at risk of failing to comply with privacy regulations. Weak security can also
    expose proprietary business information. In factories, weak cybersecurity can
    lead to injuries and even deaths. Poor cybersecurity can lead to lost revenue,
    lost reputation, lawsuits, and fines. When a breach happens in an organization,
    the fallout impacts revenue, operations, shareholders, and the entire business.


    Increasingly, CISOs are requested to brief board members and answer questions
    regarding cybersecurity. If CISOs are fortunate, cybersecurity even helps drive
    board-level business decisions.


    When speaking to the board, CISOs must learn to transition from tech talk to business
    strategy and risk and from troubleshooting tactical problems to looking at the
    big picture. Your team has to give board members the information they need to
    make decisions about cybersecurity and drive company direction, framed in a business
    context. So what should you know about speaking to the board? [`Chapter 2](#c02.xhtml)
    covers this important topic.


    ## Building a Culture of Security


    Security is not a separate aspect of your business. As we’ll see, security must
    be thought of and included in every process. Humans can often be the weakest link
    in cyber defenses. They usually want to do the right thing, but they need to fully
    understand their responsibilities with regard to cybersecurity.


    A comprehensive all-in approach to security is needed across the business to drive
    security into your organizational DNA. It starts with the board but should also
    incorporate key ambassadors across business units to create a culture of security.
    These ambassadors bring specificity to the culture as it applies to each business
    area, offering examples for following good practices and policies.


    Although security is a serious issue, security training doesn’t have to be. Look
    to utilize initiatives that are fun and interactive to engage the workforce: think
    gamification. Rather than an annual approach to security training, awareness should
    be continuous throughout the year.


    As more people work remotely, the need is growing for cybersecurity training that
    addresses multiple work environments. Employees need security awareness training
    to address a number of potential issues that arise both in traditional office
    environments as as in home offices.


    Building a strong security culture has a lasting impact on your organization.
    But your security culture must not stop with your internal processes; it should
    permeate your dealings with customers and business partners. It should be built
    into the products, services, and solutions that you provide to others.


    How can you promote a culture where cybersecurity becomes everyone’s responsibility?
    [`Chapter 3](#c03.xhtml) offers strategies for building a culture of security,
    a culture that will be strengthened by processes in [Part II](#p02.xhtml) and
    technology in [Part III](#p03.xhtml)].

