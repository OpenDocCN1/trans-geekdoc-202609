    \ The overall development and release schedule must include tasks that ensure\
    \ security, building in time for patching, fixes, and code review. Customers expect\
    \ secure code, and you need processes in place to make this an integral part of\
    \ product management.\n\n[Chapter 8](#c08.xhtml) offers strategies for creating\
    \ an effective secure development program.\n\n## Compliance\n\nFrom a compliance\
    \ standpoint, organizations must navigate an alphabet soup of evolving privacy\
    \ and security regulations and standards. Privacy has been brought to the forefront\
    \ by regulations like the EU's GDPR and California's CCPA. The panoply of regulations\
    \ faced by any given organization depends in part on the industry, some of which\
    \ are highly regulated. For example, healthcare organizations are subject to HIPAA,\
    \ while any organization that processes credit or bank card transactions must\
    \ implement PCI-DSS.\n\nFor security, organizations may choose to adopt frameworks\
    \ from NIST, ISO, or others. Ultimately, you need a framework against which to\
    \ measure and strengthen your organization's security posture. Frameworks provide\
    \ a road map for benchmarking your security controls.\n\n[Chapter 9](#c09.xhtml)\
    \ covers the ins and outs of compliance processes and how to collaborate with\
    \ the rest of the organization in this key area.\n\n## Supply Chain Risk\n\nBeyond\
    \ your own organization and employees, you need processes that protect your entire\
    \ enterprise from end to end, which includes your supply chain. After all, a risk\
    \ assumed by one is a risk assumed by all. Organizations are often impacted by\
    \ actions across several levels of their supply chains.\n\nIn the past, organizations\
    \ selected a vendor for a service or a product—whether new software, a marketing\
    \ tool, an HVAC system, or a custodial service. Then, they simply brought the\
    \ product or service into their network, often without analyzing the potential\
    \ risks. From a security standpoint, that approach is a nonstarter. If you're\
    \ using SaaS, it is run by another company. If that software is not secured properly,\
    \ you're putting your organization at risk. If a third-party software, service,\
    \ or product has a vulnerability, you've just added an unforeseen—and harder to\
    \ locate—vulnerability to your own network. For example, the 2013 Target hack\n\
    \nA breach at any point in your supply chain can compromise your security. Security\
    \ leaders must make prudent decisions that reflect this reality. Vetting potential\
    \ vendors and supply chain partners for security weaknesses and other problems\
    \ is critical. You must also be aware of the risks of single points of failure\
    \ along your supply chain. Bottom line: you need to understand and properly vet\
    \ your entire supply chain.\n\n[Chapter 10](#c10.xhtml) covers supply chain risk.\n\
    \nSecurity is not an absolute, because no one has unlimited money or unlimited\
    \ resources to invest. Given that you cannot reduce risk to zero, the best guidance\
    \ for establishing effective processes requires gauging your organization's risk\
    \ tolerance, as described next.\n\n## Note\n\n1.  [1](#p02.xhtml#R_p02-note-0001). \
    \ [https://krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/](https://krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/)\n\
    \n# 6  \n\nEffective Cyber Risk Management Requires Broad Collaboration\n\n***SUZANNE\
    \ HARTIN AND MARIA S. THOMPSON***\n\nWhy does cyber risk management deserve a\
    \ chapter in this book? Isn't that what we've been doing all along? Managing our\
    \ cyber risk? Well, yes and no.\n\nGiven the world we've lived in, our focus has\
    \ been on the right things—patching, managing incidents, ensuring we have the\
    \ right firewall rules, securing our data in the cloud, and so on. But in today's\
    \ world, with the CISO required to be a strategist and business promoter, considerations\
    \ and requirements have grown much more expansive and include questions like:\n\
    \n*   Are we managing our cyber risk to fall within our company's cyber risk appetite?\n\
    \n*   Are we sufficiently considering other risks interwoven with cybersecurity?\n\
    \n*   How do changes in the external environment, such as the plethora of new\
    \ privacy regulations, impact our security programs?\n\n*   Are we even sure we're\
    \ considering all the risks we should?\n\nAnswering these questions accurately\
    \ is vital since the success of the cybersecurity program is critical to achieving\
    \ corporate objectives.\n\n## Understanding Your Organization's Risk Appetite\n\
    \nFirst, let's look at identifying the level of risk your organization is willing\
    \ to take, its risk appetite. The ISO 31000 risk management standard defines risk\
    \ appetite as “the amount and type of risk that an organization is prepared to\
    \ pursue, retain, or take.”\n\nWe all have a personal risk appetite even though\
    \ we may not explicitly acknowledge it. Here are some indications of personal\
    \ risk appetite:\n\n*   We buy insurance or we don't.\n\n*   We exceed the speed\
    \ limit or we don't.\n\n*   We try extreme sports or we don't.\n\nThe same is\
    \ true of companies, many of which have begun to document their risk appetite\
    \ in a risk appetite statement and measure performance against it. Risk appetite\
    \ is generally specified in the context of a company's strategic objectives.\n\
    \nUnderstanding your business is key to composing a risk appetite statement. Consider\
    \ whether your organization is public or private, single-threaded or running a\
    \ multitude of differing business lines, consumer facing or business-to-business.\
    \ These factors all inform the risk appetite of the organization, which is then\
    \ captured in one or more risk appetite statements.\n\nThe complexity of the organization\
    \ will dictate whether there is one overall risk appetite statement or one for\
    \ each department or business unit. For example, in a large public organization,\
    \ you may have various entities that deal with highly sensitive data, requiring\
    \ stringent privacy and security measures such as citizen taxes, safety services,\
    \ or critical infrastructure along with other entities that support museums and\
    \ other recreational facilities. While these entities all form a single citizen-facing\
    \ unit, it would be difficult to argue that they all share the same risk appetite.\n\
    \nLet's look at some simple examples. A broad operational risk appetite statement\
    \ is “We will control our operational activities and exposure to avoid an event\
    \ resulting in a loss to pre-tax operating margin of more than $20 million.” A\
    \ more specific example is “We will control fraud losses to within 10 basis points”\
    \ or, in the case of a recreational facility, “We will control activities in such\
    \ a way as to ensure fewer than four visitor injuries of any kind per year.”\n\
    \nThese examples raise two questions: What happens when you don't have an easy\
    \ metric, such as dollars, against which to craft your risk appetite statement?\
    \ And what happens if you temporarily exceed your appetite for risk? Exceeding\
    \ your threshold is okay if you have established a “risk tolerance” level that\
    \ the company has agreed is temporarily acceptable. However, taking the steps\
    \ required to get back within the appetite is mandatory at that point.\n\nAs to\
    \ the first question, it's often the case in information security that we don't\
    \ have easily calculated, specific metrics to answer the question “Are we operating\
    \ within our organization's cyber risk appetite?” Therefore, most companies wind\
    \ up with a general statement as to their appetite for cyber risk with a limit\
    \ of “low” or “medium.” The catch is then twofold: If the defined risk limit is\
    \ “low,” is that really feasible in today's world? And second, how can you know\
    \ with certainty that you're within your risk appetite without a hard number to\
    \ measure against?\n\n## Measuring Actual Risk Against Risk Appetite"
