    Dino Dai Zovi, [`twitter.com/dinodaizovi`](https://twitter.com/dinodaizovi)


    ### 播客


    Daily Stormcast, [`isc.sans.edu/podcast.html`](https://isc.sans.edu/podcast.html)


    Hacker Valley Studios, [`hackervalleystudio.podbean.com/`](https://hackervalleystudio.podbean.com/)


    Risky.biz, [`risky.biz/`](https://risky.biz/)


    Security Conversations, [`securityconversations.fireside.fm/`](https://securityconversations.fireside.fm/)


    Microsoft 的 Security Unlocked 播客, [`securityunlockedpodcast.com/`](https://securityunlockedpodcast.com/)


    ### 书籍


    George Finney, 《Well Aware: Master The Nine Cybersecurity Habits To Protect Your
    Future》（深知安全：掌握保护未来的九大网络安全习惯），[`wellawaresecurity.com/bookstore-2/`](https://wellawaresecurity.com/bookstore-2/)


    Brian Krebs, 《Spam Nation: The Inside Story of Organized Cybercrime-From Global
    Epidemic to Your Front Door》（垃圾邮件国家：组织化网络犯罪的故事——从全球流行到你的家门口），[`bookshop.org/books/spam-nation-the-inside-story-of-organized-cybercrime-from-global-epidemic-to-your-front-door/9781492603238`](https://bookshop.org/books/spam-nation-the-inside-story-of-organized-cybercrime-from-global-epidemic-to-your-front-door/9781492603238)


    Kevin Mitnick, 《The Art of Deception: Controlling the Human Element of Security》（欺骗术：控制安全中的人为因素），[`www.mitnicksecurity.com/the-art-of-deception`](https://www.mitnicksecurity.com/the-art-of-deception)


    Bruce Schneier, 《Click Here to Kill Everybody: Security and Survival in a Hyper-connected
    World》（点击此处杀死所有人：超连接世界中的安全与生存），[`www.schneier.com/books/click-here/`](https://www.schneier.com/books/click-here/)


    Adam Shostack, 《Threat Modeling: Designing for Security》（威胁建模：为安全设计），[`shostack.org/books/threat-modeling-book`](https://shostack.org/books/threat-modeling-book)


    ### 网络相关书籍列表


    《网络安全经典》（Cybersecurity Canon），由俄亥俄州立大学网络安全与数字信任研究所策定的书籍列表，[`icdt.osu.edu/cybercanon`](https://icdt.osu.edu/cybercanon)


    ## 与业务有效沟通


    ### 书籍


    Joel Garfinkle, 《Getting Ahead》（领先一步），[`garfinkleexecutivecoaching.com/books/getting-ahead`](https://garfinkleexecutivecoaching.com/books/getting-ahead)


    Dan Heath, 《Upstream: The Quest to Solve Problems Before They Happen》（上游：在问题发生前解决问题），[`heathbrothers.com/books/upstream/`](https://heathbrothers.com/books/upstream/)


    Douglas Hubbard 和 Richard Seiersend, 《How to Measure Anything in Cybersecurity
    Risk》（如何衡量网络安全风险中的一切），[`www.howtomeasureanything.com/cybersecurity/`](https://www.howtomeasureanything.com/cybersecurity/)


    Jerry Z. Muller, 《The Tyranny of Metrics》（指标的暴政），[`press.princeton.edu/books/hardcover/9780691174952/the-tyranny-of-metrics`](https://press.princeton.edu/books/hardcover/9780691174952/the-tyranny-of-metrics)


    Alexander Osterwalder 和 Yves Pigneur, 《Business Model Generation: A Handbook for
    Visionaries, Game Changers, and Challengers》（业务模式创新：愿景者、游戏改变者和挑战者的手册），[`bookshop.org/books/business-model-generation-a-handbook-for-visionaries-game-changers-and-challengers/9780470876411`](https://bookshop.org/books/business-model-generation-a-handbook-for-visionaries-game-changers-and-challengers/9780470876411)


    Kerry Patterson, Joseph Grenny, Ron McMillan, 和 Al Switzler, 《Crucial Conversations:
    Tools for Talking When Stakes Are High》（关键对话：高风险情况下的沟通工具），[`bookshop.org/books/crucial-conversations-tools-for-talking-when-stakes-are-high-second-edition-9780071771320/9780071771320`](https://bookshop.org/books/crucial-conversations-tools-for-talking-when-stakes-are-high-second-edition-9780071771320)


    Jack J. Phillips 和 Lynn Schmidt, 《The Leadership Scorecard》（领导力计分卡），[`www.routledge.com/The-Leadership-Scorecard/Phillips-Schmidt/p/book/9780750677646`](https://www.routledge.com/The-Leadership-Scorecard/Phillips-Schmidt/p/book/9780750677646)


    ### 在线资源


    BoardTalk 博客，[`blog.nacdonline.org/`](https://blog.nacdonline.org/)


    《Cyber Risk Oversight Handbook》（网络风险监督手册），[`isalliance.org/isa-publications/cyber-risk-oversight-handbook/`](https://isalliance.org/isa-publications/cyber-risk-oversight-handbook/)


