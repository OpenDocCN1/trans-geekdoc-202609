    # # Human-aligned trading by imitative multi-loss reinforcement learning


    Zhengxin Joseph Ye*, Björn W. Schuller


    *GLAM, Department of Computing, Imperial College London, UK*


    # ## ARTICLE INFO


    +   **Keywords:**

    +   - Algorithmic trading

    +   - Reinforcement learning

    +   - Deep Q network

    +   - Imitation learning

    +   - Human alignment


    # ## ABSTRACT


    Research into algorithmic trading using reinforcement learning has been garnering
    increasing popularity in recent years. While most research work focuses on solving
    a certain modelling problem or data problem with positive results, we believe
    that in an application as critical as financial trading, aligning the machine
    to human behaviours is imperative and should be regarded as the basis of all further
    improvements before machine algorithms are free to go their own innovative ways.
    In this paper, we are proposing a trading model whose design principles are based
    on bringing a machine trading agent close to a human trader. We study areas where
    human alignment is necessary and introduce as a solution a novel multi-loss function
    of the model combining supervised learning, single-step and multi-step Q learning,
    and also inject the paradigm of imitation learning in the training and trading
    processes. We also introduce a realistic backtesting setup and a holding position-aware
    profit calculation scheme under which the machine algorithm conducts intra-day
    trading using minute tick data over a group of U.S. stocks chosen to represent
    different industrial sectors and liquidity levels. Our model’s overall out-performance
    over a group of baseline models as well as our ablation study results justify
    the inclusion of individual model features all of which are introduced to bring
    aspects of the model behaviour more aligned with those of a human trader.


    # ## 1. Introduction


    Over the past decade, improving and optimising financial trading models/systems
    through the prowess of machine learning methodologies has been receiving plenty
    of attention in the Machine Learning and Finance communities, whether it is with
    the help of supervised learning (Chou & Nguyen, 2018; Tsai et al., 2019), unsupervised
    learning (Hu et al., 2018), or Reinforcement Learning (RL). RL is a machine learning
    method that obtains action improvement through continuous interaction with the
    environment. It has drawn much general attention due to its remarkable achievements
    in playing video games (Mnih et al., 2015) and board games (Silver et al., 2016).
    Its advantage is the ability of self-learning, online learning, and continuous
    decision making. Deep Q Networks (DQNs) (Mnih, 2013), an important variant of
    modern RL, have in particular been garnering increasing popularity because their
    intrinsic value-based rewarding mechanism resembles very well the profit searching
    and risk balancing goals of various investment/trading processes. For example,
    DQN was adopted by both (Carapuço, Neves, & Horta, 2018; Jeong & Kim, 2019) with
    the former trading the EUR/USD currency pair and the latter trading four different
    stock indexes. Ning, Lin, and Jaimungal (2021) optimised trade execution by using
    DQN to estimate optimal actions of a trader. While these works employed vanilla
    versions of the model, more complex modelling has also emerged. For instance,
    Carta, Ferreira, et al. (2021) adopted an


    intelligent multi-agent ensemble approach for stock market forecasting, whereas
    (Tsantekidis et al., 2021) used an additional price trailing reward for their
    DQN based model which encouraged the agent to track the future price of a traded
    asset.


    While these works presented good results underpinning the feasibility and extensibility
    of DQN in algorithmic trading, we have noticed that a lot of advancements in building
    such trading algorithms are conceived as ways to tackle either data problems or/and
    model problems. These are legitimate motivations which we would explore more in
    separate research studies. On the other hand though, the question we are asking
    is that, while reinforcement learning’s intrinsic paradigm of trial and error
    could allow the agent to arrive at a good solution on its own achieving a certain
    quantifiable goal thanks to certain excellent model design and ability to discern
    noisy and non-stationary data, could such a goal still differ from how a human
    trader would approach the job (Hussein, Gaber, Elyan, & Jayne, 2017)? Or asking
    differently, how to best align the learnt behaviour to the true human behaviour?


    With these questions in mind, we set out to design a DQN-based trading model with
    a focus on aligning to actual human trading behaviours. We call this model Human-Aligned
    Trading (HAT). As inspired by a key design decision of the world-renowned AlphaGo
    which benefited from a pre-training of 30 million expert actions (Silver et al.,'
  - '[PAGE 1]


    2016), our questions first bring us to Imitation Learning, which refers to a learning
    agent''s acquisition of skills and behaviours by observing a demonstration. Imitation
    learning has its inspiration and basis stemmed in neuroscience and is an important
    part of machine intelligence and human computer interaction (Schaal, 1999). Specifically
    for a DQN-based agent, in order for it to learn a good mapping between state and
    action, it often requires going through hundreds of thousands of steps of learning
    and re-learning, but in critical real domains such as financial trading, the agent
    must learn with real consequences for its actions, which requires that the agent
    has good online performance from the start of trading. Adopting the concept of
    Imitation Learning in this work, we rely on demonstration data to make the greedy
    policy induced by the value function imitate a human trader from the start of
    learning, and then continue improving from its own self-generated data.


    Once pre-trained with expert demonstration data, is there any further guarantee
    that the trading agent would continue to trade like a human trader? We note that
    the process of algorithmic trading can be essentially viewed as a combination
    of continuous interpretation of market conditions and optimal execution of trading
    actions (Deng, Bao, et al., 2017) with the latter being driven by the loss function
    when a DQN-based agent takes the place of a human trader. If we want to regulate
    the algorithm''s trading behaviour, we need to work on the loss function. The
    majority of work in algorithmic trading in the literature uses a single loss function
    on a single-step reward function based on a certain financial metric (Carapuço
    et al., 2018; Li, Zheng, & Zheng, 2019; Wen, Yuan, & Yang, 2021; Xiong et al.,
    2018), such as cumulative return or Sharpe ratio, etc., but we believe a joint
    multi-loss function should be used to capture a variety of different constraints
    and dynamics, similar to the work by Hessel et al. (2018).


    Specifically, we first add to the mix a supervised loss on the trading actions.
    Since demonstration data is potentially covering a narrow part of the state and
    action space, pre-training the DQN in this condition would potentially update
    the network towards local maxima if we only rely on Q-learning to update towards
    the max value of the next state. As proven by Piot, Geist, and Pietquin (2014a,
    2014b), adding supervised loss grounds the values of the unseen actions to reasonable
    values and also makes the action policy induced by the value function imitate
    the demonstrator.


    We know that systematic traders do not blindly follow the market trend despite
    the existence of trend-following techniques (Lemperiere, Deremble, et al., 2014).
    This is the main reason we chose RL over supervised learning so that the agent
    will focus on the magnitude of trading rewards or PnL (Profit and Loss). We want
    to offer the model a longer term view of the market so that it is not merely following
    the direction of each ticking price and not always trying to execute a trade at
    the next immediate opportunity (Tsantekidis et al., 2021). After all, frequently
    changing the trading positions (long or short) will contribute nothing to the
    profits but lead to losses due to the transaction cost and slippage (Deng et al.,
    2017). Therefore, we employ multi-step Q-learning (Sutton, 1988) as a solution
    to provide longer term view at each update, enabling the agent to overcome the
    limitations of working with a single time step. As seen in Hernandez-Garcia and
    Sutton (2018), Hessel et al. (2018), Meng, Gorbet, and Kulic (2021) and Yuan,
    Yu, et al. (2019), multi-step methods have been shown to be more efficient than
    the single-step approach, delivering faster propagation of the reward signal and
    improving learning speed and final performance. Consequently, the additional deployment
    of a multi-step loss component at our model output should produce more sensible
    trade execution behaviour closer to how a human trader would do.


    Prioritised Experience Replay (PER) (Schaul, Quan, Antonoglou, & Silver, 2016)
    is employed so that our learning agent samples important transitions from its
    replay buffer more frequently rather than uniformly sampling from the replay buffer.
    It helps achieve more efficient learning and is another way to better align the
    agent to human behaviour. We also deploy discrete wavelet transformation (DWT)
    (Lin et al., 2014)


    to remove higher frequency noises present in the stock price time series data
    for smoothing purposes prior to feeding them to the Long Short-Term Memory (LSTM)
    component of the model network.


    The proposed model is backtested on real intraday minute tick data for stock trading
    with the model trained to take one of three actions at each time point: buy, sell,
    and hold. Short selling is allowed and bid/ask spreads are considered. We choose
    5 blue chip stocks and 5 small cap stocks from the U.S. markets and run our testing
    through three periods of time, where the overall market movement as represented
    by the movement of the S&P500 index went through a period of uptrend, downtrend,
    or sideways movement. To sign off, we compare the cumulative intraday return of
    our model against a buy-and-hold strategy and a host of baseline models to demonstrate
    that not only we achieve the best trading results, but our algorithm trades more
    sensibly.


    The main contribution of this paper to the literature is a proposal of targeted
    solutions which aim to better align trading behaviours by machine to those of
    a human trader. We approach this applied science problem by seeking answers to
    our own questions in this very topic and later translating such answers to modelling
    features all of which eventually become part of an integrated model. Technologically,
    this is a model that runs on a novel joint loss function combining supervised
    learning, single-step and multi-step Q learning while also injecting the paradigms
    of imitation learning to the training and running process, assisted by components
    such as PER and DWT. We show that each element of the overall architecture serves
    to address a very specific and practical behavioural element in trading that machines
    need to adapt to in order to function more human-like, as seen in Section 3. In
    addition, we also propose in Section 4 a realistic trading and profit calculation
    scheme which considers current stock holding positions as well as a backtesting
    scheme which eliminates unrealistic assumptions commonly seen in the literature
    both of which we hope would become part of a realistic benchmark setup for testing
    machine learning models used in algorithmic trading research.


    # 2. Related work


    # 2.1. Reinforcement learning in trading


    Early work by Moody and Wu (1997) aimed at demonstrating the efficiency of RL
    methodology for training trading systems. The authors created a Recurrent Reinforcement
    Learning (RRL) model and used it to train a trading system by optimising the differential
    Sharpe ratio. Their early studies presented an outperformance of trading systems
    based on the RL paradigm compared to those based on supervised learning techniques
    and inspired a host of subsequent work for algorithmic trading on various kinds
    of assets. Researchers such as Li, Rao, and Shi (2018) recognised RRL was a relatively
    shallow model and chose a deep actor-critic method to trade China''s CSI 300 index
    and observed that their model performed well both in uptrend and downtrend market
    conditions and better than a buy-and-hold strategy.


    A DQN as the chosen model in our research is seen in various research into financial
    trading, such as Double DQN in both cryptocurrency trading (Tran, Pham-Hi, & Bui,
    2023) and electricity trading (Lee, Seon, et al., 2021). Wen et al. (2021) employed
    a DQN, as well as two policy gradient methods, Soft Actor-Critic (SAC), and Proximal
    Policy Optimisation (PPO) to trade equity options. With the help of additional
    loss-control and profit-taking strategies the authors were able to achieve trading
    results better than buy-and-hold with all three models. Tsantekidis et al. (2021)
    used both a DQN and PPO and invented a new reward function to not only try to
    gain maximum investment return but also try to trail the real price level. They
    demonstrated an outperformance by the new reward function over baselines in various
    foreign exchange tradings.'
