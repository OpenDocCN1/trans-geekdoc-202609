    benchmark model closer to our own model. Double Q-learning was shown in Hasselt,
    Guez, and Silver (2016) to have remedied the problem of overestimated action values.
    This benchmark model also shares the same network architecture as other ones.

    - Multi-Step DQN (MSDQN) Multi-step Q-learning (Peng & Williams, 1998) is added
    as an extension to the vanilla DQN. This model again shares the same underlying
    network architecture as other baseline models.

    - DQfD The model of Deep Q-learning from Demonstrations (DQfD) (Hester et al.,
    2018) is the closest model to our design which also features the pre-training
