    ## 5.4 消融研究


    由于 HAT 模型集成了多种建模特征和多种损失组件，我们进行了额外的实验，以了解关键组件的贡献。首先，我们研究了模型在 n 步 Q 损失 ω_n 和交易动作的监督损失
    ω_s 的不同权重下的表现，其中 1 步 Q 损失 ω 设置为 1，如第 3.6 节所述。我们为每个权重参数赋予 0.4、0.8、1.2、1.6 和 2.0
    中的一个值，并执行与第 5.3 节相同的测试流程。我们有意将上限设为 2.0，因为我们不希望任何损失主导其他损失。结果如表 2 所示。我们观察到，与买入并持有策略相比，对
    ω_n 或 ω_s 应用更高的权重始终有助于提高交易性能。较小的 ω_n 和 ω_s 值确实能使结果受益，但我们并未始终观察到这一点。这一结果佐证了我们的设计原则，即希望将两个损失组件都纳入其中，我们在前几节中对此进行了理论化。我们还观察到，将参数设置为
    1.2、1.6 和 2.0 似乎并不会带来实质性的性能差异。我们在图 5 中展示了在分别改变 ω_n 和 ω_s 的值时，两个不同日期交易苹果公司（Apple
    Inc）的实际日内收益。如果我们继续增加这两个权重的值，对组合损失的影响可能会发生变化，但在当前研究中，我们希望专注于呈现一个平衡的、与人类对齐的模型。在我们的最终设计中，这两个参数均采用
    1.2 的值。


    接下来，我们评估 n 步损失中不同 n 值的影响。同样，我们不采用过大的值，而是测试 n ∈ [3, 6, 9, 12, 15]，并通过运行与第 5.3 节相同的测试流程来评估模型的交易收益和收益方差。汇总结果见表
    3。结果似乎表明，选择 9、12 或 15 并没有明显的优劣之分，但它们的表现都优于另外两个较小的值。在最终性能测试中，我们确定使用 n = 12。为了演示，我们在图
    6 中提供了使用这 5 个 n 值中的一个对好市多（Costco）的日内收益示例。尽管有这些发现，我们仍然认为需要一种有原则的方法来选择步长 n，并且在训练过程中动态调整
    n 可能是该过程的一个合适补充，我们将在该主题的下一研究阶段考虑引入这一点。


