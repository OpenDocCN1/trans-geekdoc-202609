    # 5. Experiments, results, and analysis


    In this section, we provide a detailed view on how we construct our environments,
    set up, and conduct the experiments, followed by assumptions and rationales, experimental
    results, and our analyses.


    # 5.1. Data and trading environment


    We choose 10 stocks representative of different industrial sectors and liquidity
    levels for diversity reasons: blue chip stocks of Apple (AAPL), Netflix (NFLX),
    Costco (COST), JPMorgan (JPM), Disney (DIS) as well as small cap stocks of Stitch
    Fix (SFIX), InVitae (NVTA), Novavax (NVAX), Sunrun (RUN), and Digital Turbine
    (APPS). Minute tick data is sourced from the Investors Exchange which is a national
    US stock exchange which provides reliable real historical stock trading data.
    The same data that we have chosen to use is easily obtainable from the exchange
    for benchmarking purposes. 390 min data points are available on each trading day
    for each stock and linear interpolation/extrapolation are employed to fill those
    time points without a price data due to lack of trading activity.


    20-period Bollinger Band oscillator signal. Three manually enhanced signals are
    also used: a moving average trend signal, a moving average golden cross signal,
    and a break out signal, the value of all of which are evaluated not just on the
    current time point t, but over a period of three time points prior to t. Together
    with the normalised and filtered time series data, they form the trading environment
    of our experiments (Ni, Day, Cheng, & Huang, 2022).


    # 5.2. Experimental results and analysis


    To evaluate the performance of our model we have chosen the following baseline
    models for comparison, all of which are run through the exact training and testing
