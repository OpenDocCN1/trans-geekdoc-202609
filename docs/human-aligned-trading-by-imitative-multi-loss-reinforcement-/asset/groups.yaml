    图2：数据在模型架构中的流向。


    交易代理在任意时刻允许执行三种动作之一 a_t ∈ {buy, hold, sell} = {−1,0,1}，并且每次动作交易一股股票。假设在t−1时刻发生了交易动作，则从t−1到t的交易利润如公式(9)所示：profit_t
    = a_{t−1}(p_t − p_{t−1}) − s. (9)


    在T个时间步上的累计交易收益CTR按公式(10)计算：CTR_{T} = ∏_{i=1}^{T} (a_{i−1}(p_i − p_{i−1}) − s)/p_{i−1}
    − 1. (10)


    我们发现，许多类似的研究工作都假设两个时间步之间的交易奖励始终遵循公式(9)或类似形式，而在现实中，这种假设过于简单（Carta et al., 2021;
    Deng et al., 2017; Li et al., 2018; Liu et al., 2020; Tsantekidis et al., 2021）。为了更好地测试我们的模型与人类交易者的一致性，我们设计了一个更符合实际的奖励机制，更重要的是它考虑了当前的持股状态，即多头（持有股票）、空仓或空头（处于卖空状态）。


    我们还尝试使回测设置符合实际。由于交易日是不连续的，我们认为在股票时间序列数据上进行训练/交易时，如果完全忽略不同日期数据之间的时间间隔（这种现象经常见到（Li
    et al., 2019），尤其是在隔夜可能发生市场事件的情况下），那将是不合理的。此外，在收盘后会出现一整天的完整新数据，我们认为这些数据应该在第二天开盘前被纳入。


    我们将每个训练窗口中的数据顺序划分为n个片段。我们选择每个片段的长度与测试窗口的长度相同，在本次实验中为500。我们迭代执行100轮阶段性训练，并选择总片段中前20%的数据作为预训练的专家数据。累计交易收益（以百分比表示）作为我们的性能指标。


    ![](img/5df77e9474116b71217f79f02a02a4ee_5_0.png)


    图3：该图分解了从t-1到t的各类交易情况。r_{t-1:t}是交易代理仅从t-1到t实现的盈亏（PnL）。由于我们只允许交易代理每次持有一股或交易一股，该图的含义如下：（1）当已经持有多头或空头时，买入或卖出信号不会改变持股状态。这对应情况1和7。（2）持有多头时的卖出信号只是处置当前拥有的股票。持有空头时的买入信号则通过从市场买回股票来平仓。这两种情况下，t-1时的交易动作都是相对于t-1之前发生的初始交易价格实现盈亏。这对应情况2和6。（3）空仓时的卖出信号触发卖空动作。这对应情况5。注意，s是买卖价差，视为每笔交易产生的交易成本。


    ## 5. 实验、结果与分析


    在本节中，我们详细介绍了环境的构建、设置和实验过程，随后给出假设与理由、实验结果以及分析。


    ### 5.1. 数据与交易环境


    出于多样性的考虑，我们选择了代表不同行业板块和流动性水平的10只股票：蓝筹股苹果（AAPL）、奈飞（NFLX）、好市多（COST）、摩根大通（JPM）、迪士尼（DIS），以及小盘股Stitch
    Fix（SFIX）、InVitae（NVTA）、Novavax（NVAX）、Sunrun（RUN）和Digital Turbine（APPS）。分钟级逐笔数据来自Investors
    Exchange，这是一个美国全国性证券交易所，提供可靠的真实历史股票交易数据。我们选择使用的相同数据可以方便地从该交易所获取，用于基准测试。每个交易日每只股票有390个分钟数据点；对于因交易活动不足而缺少价格数据的时间点，使用线性插值/外推进行填充。


    20周期布林带震荡指标信号。此外还使用了三种手动增强信号：移动平均趋势信号、移动平均金叉信号和突破信号，这些信号的值不仅在当前时间点t上评估，还会在t之前的三个时间点范围内评估。它们与归一化和滤波后的时间序列数据一起，构成了我们实验的交易环境（Ni,
    Day, Cheng, & Huang, 2022）。


    ### 5.2. 实验结果与分析


    为了评估我们模型的性能，我们选择了以下基线模型进行比较，所有这些模型都经过完全相同的训练和测试窗口。


    - 相同网络的监督学习 由监督学习驱动的交易代理，使用与HAT相同的内部网络，是一个重要的对比基准。它使用图2所示的网络架构，包括输入层和LSTM组件，但只需要一个输出层来产生1步动作上的softmax交叉熵损失。交易完全基于预测的1步买入/卖出/持有动作进行驱动。

    - 原始DQN 第一个RL基线模型是Mnih等人（2015）创建的原始DQN模型，使用普通的经验回放。其内部网络架构与基准监督学习网络相同。

    - 优先化双重DQN（PDDQN）我们将双重Q学习（Hasselt, 2010）和PER（Schaul et al., 2016）作为附加功能应用于原始DQN，使该基准模型更接近我们自己的模型。Hasselt,
    Guez和Silver（2016）已证明双重Q学习能够弥补动作价值过高估计的问题。该基准模型也与其他模型共享相同的网络架构。

    - 多步DQN（MSDQN）将多步Q学习（Peng & Williams, 1998）作为原始DQN的扩展加入。该模型同样与其他基线模型共享相同的底层网络架构。

    - DQfD 演示深度Q学习（DQfD）（Hester et al., 2018）模型是与我们设计最接近的模型，它也具备预训练概念，并使用多步学习和监督损失函数。关键区别在于，DQfD的监督损失仅基于1步动作，并且不像我们那样为1步和n步实例使用单独的PER缓冲区。DQfD与HAT相比也具有不同的联合损失函数配置，所有损失的权重相同。

    - 买入并持有（BnH） 不涉及任何建模，累计交易收益使用历史股票价格数据按公式(10)按日计算，假设在交易日开始时买入一股并持有到收盘。


    ### 5.3. 性能评估


    所有模型使用相同的训练集进行训练，并在十只股票上的三个7天滚动窗口上进行测试。每轮测试执行50次，日内累计交易收益取50次测试的平均值。表1给出了HAT和基准模型/方法在每个7天窗口上的平均日内交易收益汇总。可以看出，HAT在所有基线模型中持续表现更好，无论是在更高的平均收益还是更低的收益方差方面。


