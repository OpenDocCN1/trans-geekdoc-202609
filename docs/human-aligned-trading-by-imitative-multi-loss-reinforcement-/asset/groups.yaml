    | 探索 epsilon | 0.1 |


    以及连续决策能力，其内在的奖励机制与真实交易活动中的利润搜寻过程非常相似。作为一个需要严格监管且可能需要高度人工干预的应用，我们认为机器学习算法进行的金融交易应该与人类交易行为高度一致，然后才能让其走更具创新性的路线。在这项关于算法交易的研究中，我们探讨了有利于实现人类对齐目标的模型和系统构建方面，并提出了一个新模型
    HAT，其各个特征有助于提供实现这种行为对齐的解决方案。HAT 的两个主要特点是采用模仿学习，以及设计了一个结合监督学习、多步和单步 Q 学习的联合损失函数——其中每个组件都旨在弥合机器行为与人类交易者行为之间的特定差距。我们还引入了一个现实的回测/交易流程和一个利润计算方案，用于模型性能测试和消融研究，摒弃了文献中常见的一些不切实际的假设。我们从美国市场选择了五只蓝筹股和五只小盘股，并通过三个为期七天的窗口进行了测试，这些窗口期内，以标准普尔500指数走势为代表的整体股票市场呈现出上涨、横盘或下跌趋势。我们展示了
    HAT 相对于一组基线模型的优越表现。与买入并持有策略相比，在交易蓝筹股时，虽然模型在下跌市场借助卖空通常表现更好，但在股票持续上涨时，其表现往往落后。然而，对于小盘股，无论整体市场状况如何，模型都取得了更好的表现，常常击败买入并持有策略，部分原因是模型被训练为降低交易频率，从而产生更低的总体交易成本。通过实验，我们注意到，尽管模型很复杂，但其性能可能因仅访问最近几天的时间序列数据而受到限制，这是强化学习中常见的问题，因为数据环境是部分可观察的马尔可夫决策过程。未来的研究应进一步丰富数据环境，捕捉更多类型的市场相关数据特征，并在更大的股票池上进行测试。可以使用表示学习方法使我们的模型更具数据感知能力。使机器行为更接近人类行为的工作是一个复杂的话题，不仅因为人类行为本身就是一个复杂的、难以建模的问题。在未来的研究中，我们将考察人类交易行为的更细粒度细分，并旨在通过技术解决方案复制个体人类的思维和行为方式。


