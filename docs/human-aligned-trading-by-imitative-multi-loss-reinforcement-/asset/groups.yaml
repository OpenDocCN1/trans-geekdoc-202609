    # 5.4. Ablation studies


    Since the HAT model is an integration of multiple modelling features and multiple
    loss components, we conduct additional experiments to gain understanding on the
    contribution by key components. First, we look at how the model performs under
    different weightings for the n-step Q loss ω_n and the supervised loss on trading
    actions ω_s with the 1-step Q loss ω being set to 1 as explained in Section 3.6.
    We assign one of 0.4, 0.8, 1.2, 1.6, and 2.0 to each of the weight parameters
    and execute the same testing routines as used in Section 5.3. We make a conscious
    decision of setting an upper limit of 2.0 because we do not want any loss to dominate
    over others. The results are presented in Table 2. We observe that applying a
    higher weighting to either ω_n or ω_s consistently contributes to an improved
    trading performance compared to a buy-and-hold strategy. Small weights of ω_n
    and ω_s do benefit the results but we do not consistently observe this. This result
    corroborates our design principles of wanting to incorporate both loss components
    which we theorise in earlier sections. We also observe that setting the parameters
    to 1.2, 1.6, and 2.0 does not appear to bring along a performance that is materially
    different. We present in Fig. 5 two actual intra-day returns when trading Apple
    Inc over two different days by changing the values of ω_n and ω_s, respectively.
    It is possible that the impact on the combined loss might change if we were to
    continue increasing the value of these two weightings, but, in the current study,
    we want to focus on presenting a balanced human-aligning model. We settle on the
    value of 1.2 for both parameters in our final design.


    Next, we assess the impact of different values of n in the n-step loss. Again,
    without going with out-sized values, we test n ∈ [3, 6, 9, 12, 15] and evaluate
    the model''s trading return and return variance by running the same testing routines
    as used in Section 5.3. The summary results are in Table 3. The result appears
    to show that there is no clear winner choosing one of 9, 12, or 15, but all perform
    better than the other two smaller values. We settled to use n = 12 in our final
    performance testing. We provide an example intra-day returns on Costco using one
    of these 5 values of n in Fig. 6 for demonstration purpose. Despite these findings,
    we believe that a principled way for choosing the step size n is still needed
    and dynamically tuning n during the course of learning may be a suitable addition
    to the process, something we will look into to introduce in the next research
    phase of this topic.


