    ## 基于模仿多损失强化学习的人类对齐交易


    Zhengxin Joseph Ye*, Björn W. Schuller


    *英国伦敦帝国理工学院计算系 GLAM*


    ## 文章信息


    **关键词：**

    - 算法交易

    - 强化学习

    - 深度 Q 网络

    - 模仿学习

    - 人类对齐


    ## 摘要


    近年来，利用强化学习进行算法交易的研究日益受到关注。虽然大多数研究工作侧重于解决某个特定的建模问题或数据问题并取得了积极的成果，但我们认为，在金融交易这样关键的应用中，让机器与人类行为对齐是必不可少的，并且应被视为所有进一步改进的基础，之后机器算法才能自由地走自己的创新之路。在本文中，我们提出了一种交易模型，其设计原则基于使机器交易智能体接近人类交易员。我们研究了需要人类对齐的领域，并提出一种新颖的多损失函数作为解决方案，该函数结合了监督学习、单步和多步
    Q 学习，同时将模仿学习的范式注入训练和交易过程。我们还引入了一个现实的回测设置和一种考虑持仓头寸的利润计算方案，在此方案下，机器算法使用分钟级逐笔数据对一组选自美国股市、代表不同行业板块和流动性水平的股票进行日内交易。我们的模型相对于一组基线模型的整体优异表现以及我们的消融研究结果，证明了各个模型特征加入的合理性，而所有这些特征都是为了使模型行为的各个方面更接近人类交易员的行为。


    ## 1. 引言


    在过去的十年中，借助机器学习方法改进和优化金融交易模型/系统，无论是在监督学习（Chou & Nguyen, 2018; Tsai et al., 2019）、无监督学习（Hu
    et al., 2018）还是强化学习（RL）的帮助下，都受到了机器学习和金融领域的广泛关注。RL 是一种通过与环境持续交互来获得行动改进的机器学习方法。由于其在视频游戏（Mnih
    et al., 2015）和棋盘游戏（Silver et al., 2016）中取得的显著成就，RL 引起了广泛关注。其优势在于能够自主学习、在线学习和进行连续决策。深度
    Q 网络（DQN）（Mnih, 2013）作为现代 RL 的一个重要变体，尤其受到越来越多的关注，因为它内在的基于价值的奖励机制非常类似于各种投资/交易过程中的利润搜寻和风险平衡目标。例如，DQN
    被（Carapuço, Neves, & Horta, 2018; Jeong & Kim, 2019）采用，前者交易欧元/美元货币对，后者交易四种不同的股票指数。Ning,
    Lin, and Jaimungal (2021) 通过使用 DQN 估计交易员的最优行动来优化交易执行。虽然这些工作使用了模型的原始版本，但也出现了更复杂的建模方式。例如，Carta,
    Ferreira, et al. (2021) 采用了一种智能多智能体集成方法进行股票市场预测，而（Tsantekidis et al., 2021）在其基于
    DQN 的模型中使用了额外的价格追踪奖励，鼓励智能体追踪交易资产的未来价格。


    虽然这些工作展示了良好的结果，证明了 DQN 在算法交易中的可行性和可扩展性，但我们注意到，构建此类交易算法的许多进展都被视为解决数据问题和/或模型问题的方法。这些是合理的动机，我们将在单独的研究中进一步探索。但另一方面，我们要问的问题是：虽然强化学习固有的试错范式，凭借出色的模型设计和识别噪声与非平稳数据的能力，可以让智能体自行得出一个良好的解决方案，实现某个可量化的目标，但这样的目标是否仍然可能不同于人类交易员处理工作的方式（Hussein,
    Gaber, Elyan, & Jayne, 2017）？或者换一种问法，如何最好地将习得行为与真实的人类行为对齐？


    带着这些问题，我们着手设计一个基于 DQN 的交易模型，重点关注与真实人类交易行为的对齐。我们将该模型称为人类对齐交易（HAT）。举世闻名的 AlphaGo
    的一个关键设计决策是从 3000 万个专家动作中预训练而受益（Silver et al., 2016），受此启发，我们的问题首先引向了模仿学习，即学习智能体通过观察示范来获取技能和行为。模仿学习的灵感和基础源于神经科学，是机器智能和人机交互的重要组成部分（Schaal,
    1999）。具体而言，对于基于 DQN 的智能体，为了学习状态与动作之间的良好映射，它通常需要经历数十万步的学习和重新学习，但在金融交易等关键的真实领域，智能体必须承担其行为的真实后果进行学习，这就要求智能体从交易一开始就具有良好的在线表现。在这项工作中，我们采用模仿学习的概念，依靠示范数据让价值函数诱导出的贪心策略从学习一开始就模仿人类交易员，然后继续从自身生成的数据中改进。


    一旦用专家示范数据进行了预训练，是否还有任何进一步保证交易智能体会继续像人类交易员那样交易？我们注意到，算法交易的过程本质上可以看作是对市场状况的持续解读和对交易行动的最优执行的结合（Deng,
    Bao, et al., 2017），而后者在基于 DQN 的智能体取代人类交易员时由损失函数驱动。如果我们想要规范算法的交易行为，就需要在损失函数上下功夫。文献中大多数算法交易工作使用基于某种金融指标（Carapuço
    et al., 2018; Li, Zheng, & Zheng, 2019; Wen, Yuan, & Yang, 2021; Xiong et al.,
    2018）如累计收益或夏普比率等的单步奖励函数上的单一损失函数，但我们认为应该使用联合多损失函数来捕捉各种不同的约束和动态变化，类似于 Hessel et
    al. (2018) 的工作。


    具体来说，我们首先在混合损失中加入对交易行动的监督损失。由于示范数据可能只覆盖状态和动作空间的一小部分，在这种条件下预训练 DQN，如果我们只依赖 Q 学习向下一状态的最大值更新，则可能会将网络更新到局部最大值。正如
    Piot, Geist, and Pietquin (2014a, 2014b) 所证明的那样，增加监督损失会将未见过的动作的值锚定到合理值，并使价值函数诱导出的行动策略模仿示范者。


    我们知道，尽管存在趋势跟踪技术（Lemperiere, Deremble, et al., 2014），系统性交易者不会盲目跟随市场趋势。这是我们选择 RL
    而非监督学习的主要原因，这样智能体会专注于交易奖励或盈亏（PnL）的大小。我们希望为模型提供更长远的市场视角，使其不仅跟随每一个跳动价格的方向，也不总是在下一个立即出现的机会时尝试执行交易（Tsantekidis
    et al., 2021）。毕竟，频繁改变交易头寸（做多或做空）不仅对利润毫无贡献，反而会因交易成本和滑点而造成损失（Deng et al., 2017）。因此，我们采用多步
    Q 学习（Sutton, 1988）作为解决方案，在每次更新时提供更长期的视角，使智能体能够克服单时间步工作的局限性。正如 Hernandez-Garcia
    and Sutton (2018)、Hessel et al. (2018)、Meng, Gorbet, and Kulic (2021) 和 Yuan,
    Yu, et al. (2019) 所示，多步方法已被证明比单步方法更高效，能够更快地传播奖励信号，提高学习速度和最终性能。因此，在模型输出端额外部署多步损失组件，应该会产生更明智的交易执行行为，更接近人类交易员的做法。


    我们采用了优先经验回放（PER）（Schaul, Quan, Antonoglou, & Silver, 2016），使我们的学习智能体更频繁地从其回放缓冲区中采样重要的转换，而不是均匀采样。这有助于实现更高效的学习，也是更好地将智能体与人类行为对齐的另一种方式。我们还部署了离散小波变换（DWT）（Lin
    et al., 2014），以在将股票价格时间序列数据输入模型网络的长短期记忆（LSTM）组件之前，去除其中存在的高频噪声，以达到平滑目的。


    所提出的模型在真实的日内分钟逐笔数据上进行了股票交易回测，模型经过训练后在每个时间点采取三种行动之一：买入、卖出和持有。允许卖空，并考虑买卖价差。我们从美国市场选择了
    5 只蓝筹股和 5 只小盘股，并通过三个时间段运行测试，在这些时间段中，以标准普尔 500 指数走势为代表的整体市场行情分别经历了上涨、下跌或横盘整理阶段。最后，我们将模型的累计日内收益与买入并持有策略以及一系列基线模型进行比较，以证明我们不仅取得了最佳交易结果，而且我们的算法交易行为更加合理。


    本文对文献的主要贡献是提出了有针对性的解决方案，旨在使机器的交易行为更好地与人类交易员对齐。我们通过在这个主题上寻求我们自己问题的答案来处理这个应用科学问题，然后将这些答案转化为建模特征，最终全部成为一个集成模型的一部分。从技术上讲，这是一个基于新颖的联合损失函数运行的模型，该函数结合了监督学习、单步和多步
    Q 学习，同时还将模仿学习的范式注入训练和运行过程，并由 PER 和 DWT 等组件辅助。我们展示了整体架构的每个元素如何解决交易中一个非常具体和实际的行为要素，机器需要适应这些要素才能更像人类一样运作，如第
    3 节所示。此外，我们还在第 4 节提出了一个现实的交易和利润计算方案，该方案考虑了当前的股票持仓头寸，以及一种消除文献中常见的非现实假设的回测方案，我们希望这两者都能成为用于测试算法交易研究中机器学习模型的现实基准设置的一部分。


    ## 2. 相关工作


    ### 2.1. 交易中的强化学习


    Moody 和 Wu (1997) 的早期工作旨在证明 RL 方法在训练交易系统方面的有效性。作者创建了一个循环强化学习（RRL）模型，并通过优化微分夏普比率来训练交易系统。他们的早期研究表明，基于
    RL 范式的交易系统优于基于监督学习技术的交易系统，并激发了后续大量针对各类资产的算法交易研究。Li, Rao, and Shi (2018) 等研究者认识到
    RRL 是一个相对较浅的模型，因此选择了一种深度 Actor-Critic 方法来交易中国的沪深 300 指数，并观察到他们的模型在上涨和下跌的市场行情中都表现良好，且优于买入并持有策略。


    在我们的研究中被选为模型的 DQN 在金融交易的各种研究中都有出现，例如在加密货币交易（Tran, Pham-Hi, & Bui, 2023）和电力交易（Lee,
    Seon, et al., 2021）中的 Double DQN。Wen et al. (2021) 使用 DQN 以及两种策略梯度方法，Soft Actor-Critic
    (SAC) 和 Proximal Policy Optimisation (PPO) 来交易股票期权。借助额外的损失控制和止盈策略，作者们使用这三种模型均取得了优于买入并持有的交易结果。Tsantekidis
    et al. (2021) 同时使用了 DQN 和 PPO，并发明了一种新的奖励函数，不仅试图获得最大投资回报，还试图追踪真实价格水平。他们证明了新奖励函数在各种外汇交易中优于基线。


