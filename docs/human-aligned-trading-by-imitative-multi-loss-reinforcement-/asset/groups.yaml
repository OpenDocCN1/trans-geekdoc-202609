    ## 4. 交易设置


    图2给出了高层模型架构和数据流向的概览。经过DWT滤波后，时间序列股票数据输入到一个LSTM网络中。LSTM是一种递归神经网络，能够学习长期依赖关系，而不会遭受梯度消失问题（Hochreiter
    & Schmidhuber, 1997）。虽然可以使用更先进的序列处理模型（如Transformer（Vaswani et al., 2017））替代LSTM，但我们希望将本研究的重点放在强化学习上，但会在后续研究中探讨与Transformer集成的可能性。


    我们在设置中允许卖空，这意味着代理如果选择在价格下跌时卖出借来的股票，则可能获利。每次动作都会以买卖价差s的形式计入交易成本。通过查阅所选股票在相关月份的实时历史逐笔数据，我们选择中间价的平均百分比0.02%作为买价和卖价之间的价差。未包含单独的交易费用，这反映了当前经纪商提供免佣金股票交易服务的新常态。时间序列数据中仅使用中间价。


