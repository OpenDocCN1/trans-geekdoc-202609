    图6. 使用 HAT 模型在2020年2月25日对好市多（Costco）的日内交易收益示例（y轴），在 n 步 Q 值计算中使用了变化的 n 值。x轴表示可交易窗口内的分钟数。测试了五个
    n 值，我们观察到选择 n = 9、12 或 15 时性能相似，且优于 n = 3 或 6。


    ## 表4


    系统中使用的超参数完整列表。


    | 参数 | 值 |

    |---|---|

    | 优先回放指数 alpha | 0.4 |

    | 优先回放重要性采样指数 beta | 0.6 |

    | 优先回放缓冲区大小 | 50,000 |

    | 优先回放常量 epsilon | 0.001 |

    | 折扣因子 | 0.95 |

    | 买卖价差占中间价的百分比 | 0.02% |

    | 回合长度 | 500 |

    | DWT 滤波阈值（lambda） | 0.7 |

    | DWT 模型 | Daubechies |

    | 时间点数/LSTM 网络长度： | 50 |

    | 多步学习中的步数 | 12 |

    | 监督学习损失的权重 | 1.2 |

    | 多步学习损失的权重 | 1.2 |

    | 预训练小批量更新次数 | 100,000 |

