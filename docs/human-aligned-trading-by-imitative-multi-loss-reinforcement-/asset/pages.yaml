  md: '# # Human-aligned trading by imitative multi-loss reinforcement learning


    Zhengxin Joseph Ye*, Björn W. Schuller


    *GLAM, Department of Computing, Imperial College London, UK*


    # ## ARTICLE INFO


    +   **Keywords:**

    +   - Algorithmic trading

    +   - Reinforcement learning

    +   - Deep Q network

    +   - Imitation learning

    +   - Human alignment


    # ## ABSTRACT


    Research into algorithmic trading using reinforcement learning has been garnering
    increasing popularity in recent years. While most research work focuses on solving
    a certain modelling problem or data problem with positive results, we believe
    that in an application as critical as financial trading, aligning the machine
    to human behaviours is imperative and should be regarded as the basis of all further
    improvements before machine algorithms are free to go their own innovative ways.
    In this paper, we are proposing a trading model whose design principles are based
    on bringing a machine trading agent close to a human trader. We study areas where
    human alignment is necessary and introduce as a solution a novel multi-loss function
    of the model combining supervised learning, single-step and multi-step Q learning,
    and also inject the paradigm of imitation learning in the training and trading
    processes. We also introduce a realistic backtesting setup and a holding position-aware
    profit calculation scheme under which the machine algorithm conducts intra-day
    trading using minute tick data over a group of U.S. stocks chosen to represent
    different industrial sectors and liquidity levels. Our model’s overall out-performance
    over a group of baseline models as well as our ablation study results justify
    the inclusion of individual model features all of which are introduced to bring
    aspects of the model behaviour more aligned with those of a human trader.


    # ## 1. Introduction


    Over the past decade, improving and optimising financial trading models/systems
    through the prowess of machine learning methodologies has been receiving plenty
    of attention in the Machine Learning and Finance communities, whether it is with
    the help of supervised learning (Chou & Nguyen, 2018; Tsai et al., 2019), unsupervised
    learning (Hu et al., 2018), or Reinforcement Learning (RL). RL is a machine learning
    method that obtains action improvement through continuous interaction with the
    environment. It has drawn much general attention due to its remarkable achievements
    in playing video games (Mnih et al., 2015) and board games (Silver et al., 2016).
    Its advantage is the ability of self-learning, online learning, and continuous
    decision making. Deep Q Networks (DQNs) (Mnih, 2013), an important variant of
    modern RL, have in particular been garnering increasing popularity because their
    intrinsic value-based rewarding mechanism resembles very well the profit searching
    and risk balancing goals of various investment/trading processes. For example,
    DQN was adopted by both (Carapuço, Neves, & Horta, 2018; Jeong & Kim, 2019) with
    the former trading the EUR/USD currency pair and the latter trading four different
    stock indexes. Ning, Lin, and Jaimungal (2021) optimised trade execution by using
    DQN to estimate optimal actions of a trader. While these works employed vanilla
    versions of the model, more complex modelling has also emerged. For instance,
    Carta, Ferreira, et al. (2021) adopted an


    intelligent multi-agent ensemble approach for stock market forecasting, whereas
    (Tsantekidis et al., 2021) used an additional price trailing reward for their
    DQN based model which encouraged the agent to track the future price of a traded
    asset.


    While these works presented good results underpinning the feasibility and extensibility
    of DQN in algorithmic trading, we have noticed that a lot of advancements in building
    such trading algorithms are conceived as ways to tackle either data problems or/and
    model problems. These are legitimate motivations which we would explore more in
    separate research studies. On the other hand though, the question we are asking
    is that, while reinforcement learning’s intrinsic paradigm of trial and error
    could allow the agent to arrive at a good solution on its own achieving a certain
    quantifiable goal thanks to certain excellent model design and ability to discern
    noisy and non-stationary data, could such a goal still differ from how a human
    trader would approach the job (Hussein, Gaber, Elyan, & Jayne, 2017)? Or asking
    differently, how to best align the learnt behaviour to the true human behaviour?


    With these questions in mind, we set out to design a DQN-based trading model with
    a focus on aligning to actual human trading behaviours. We call this model Human-Aligned
    Trading (HAT). As inspired by a key design decision of the world-renowned AlphaGo
    which benefited from a pre-training of 30 million expert actions (Silver et al.,'
