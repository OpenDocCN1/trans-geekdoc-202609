    as well as continuous decision-making, with its intrinsic rewarding mechanism
    well resembling the profit searching process seen in real trading activities.
    As an application that requires heavy regulation and potentially a high level
    of human intervention, we believe financial trading carried out by machine learning
    algorithms should have a high level of alignment with human trading behaviours
    before they are made to go their more innovative ways. In this research, on algorithmic
    trading, we looked at aspects of model and system building which would benefit
    the objective of human alignment and produced a new model, HAT, whose individual
    features helped offer solutions to achieve such a behavioural alignment.


    The two main features of HAT are the employment of imitation learning as well
    as the design of a joint loss function combining


    supervised learning, multi-step and single step Q learning — each component of
    which is chosen to bridge a specific gap in machine behaviour with that of a human
    trader. We also introduced a realistic backtesting/trading process and a profit
    calculation scheme for model performance testing and ablation studies, rejecting
    some unrealistic assumptions often seen in the literature. We chose five blue
    chip stocks and five small cap stocks from the U.S. markets and ran our testing
    through three seven-day windows where the overall stock market as represented
    by the movement of the S&P500 index had an upward, sideways, or downward trend.
    We demonstrated an outperformance of HAT over a group of baseline models. When
    comparing with a buy-and-hold strategy and trading bluechip stocks, while the
    model generally performed better in down-trending markets with the help of short-selling,
    it often lagged when stocks were continuously trending up. For small cap stocks,
    however, the model achieved better performance of ten beating a buy-and-hold regardless
    of the overall market conditions, partly thanks to the model having been trained
    to trade less frequently incurring less overall trading costs.


    Through our experiments we noticed that despite its sophistication, the model''s
    performance could be constrained by only accessing time series data from the most
    recent days, a problem that is common with RL due to the data environment being
    a partially observable Markov Decision Process. Future research should look to
    further enrich the data environment, capture features of more types of market-related
    data, and run against bigger stock universe. Representation Learning methods could
    be used to make our models more data-aware.


    The work to bring machine behaviours more aligned with those of human''s is a
    complex topic, not least because human behaviour itself is a complex matter and
    hard to model against. In future studies, we will examine more granular segmentation
    of human trading behaviour and aim to replicate the individual human way of thinking
    and behaving through technological solutions.


