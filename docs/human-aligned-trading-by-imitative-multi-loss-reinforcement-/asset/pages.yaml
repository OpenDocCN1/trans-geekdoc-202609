    # 5. Experiments, results, and analysis


    In this section, we provide a detailed view on how we construct our environments,
    set up, and conduct the experiments, followed by assumptions and rationales, experimental
    results, and our analyses.


    # 5.1. Data and trading environment


    We choose 10 stocks representative of different industrial sectors and liquidity
    levels for diversity reasons: blue chip stocks of Apple (AAPL), Netflix (NFLX),
    Costco (COST), JPMorgan (JPM), Disney (DIS) as well as small cap stocks of Stitch
    Fix (SFIX), InVitae (NVTA), Novavax (NVAX), Sunrun (RUN), and Digital Turbine
    (APPS). Minute tick data is sourced from the Investors Exchange which is a national
    US stock exchange which provides reliable real historical stock trading data.
    The same data that we have chosen to use is easily obtainable from the exchange
    for benchmarking purposes. 390 min data points are available on each trading day
    for each stock and linear interpolation/extrapolation are employed to fill those
    time points without a price data due to lack of trading activity.


    20-period Bollinger Band oscillator signal. Three manually enhanced signals are
    also used: a moving average trend signal, a moving average golden cross signal,
    and a break out signal, the value of all of which are evaluated not just on the
    current time point t, but over a period of three time points prior to t. Together
    with the normalised and filtered time series data, they form the trading environment
    of our experiments (Ni, Day, Cheng, & Huang, 2022).


    # 5.2. Experimental results and analysis


    To evaluate the performance of our model we have chosen the following baseline
    models for comparison, all of which are run through the exact training and testing
    windows.


    +   - Supervised Learning with the same network A trading agent driven by supervised
    learning that uses the same internal network in HAT is an important benchmark
    to compare against. It uses the network architecture as presented in Fig. 2 including
    the input layers and an LSTM component, except that only one output layer is required
    to produce softmax cross entropy loss on the 1-step action. Trading is driven
    entirely based on the predicted buy/sell/hold 1-step actions.

    +   - Vanilla DQN The first RL baseline model is a vanilla DQN model as created
    by Mnih et al. (2015) which uses a normal Experience Replay. The internal network
    architecture is made to be the same as the benchmark supervised learning network.

    +   - Prioritised Double DQN (PDDQN) We apply Double Q-learning (Hasselt, 2010)
    and PER (Schaul et al., 2016) as additional features to the vanilla DQN to bring
    this benchmark model closer to our own model. Double Q-learning was shown in Hasselt,
    Guez, and Silver (2016) to have remedied the problem of overestimated action values.
    This benchmark model also shares the same network architecture as other ones.

    +   - Multi-Step DQN (MSDQN) Multi-step Q-learning (Peng & Williams, 1998) is
    added as an extension to the vanilla DQN. This model again shares the same underlying
    network architecture as other baseline models.

    +   - DQfD The model of Deep Q-learning from Demonstrations (DQfD) (Hester et
    al., 2018) is the closest model to our design which also features the pre-training
    concept as well as using multi-step learning and a supervised loss function. The
    key difference is that DQfD''s supervised loss is based on 1-step actions only
    and it is not using separate PER buffers like we do for 1-step and n-step instances.
    DQfD also has a different joint loss function profile compared to HAT and all
    losses are equally weighted.

    +   - Buy-and-Hold (BnH) There is no modelling involved and the cumulative trading
    return is calculated by Eq. (10) on a daily basis using historical stock price
    data assuming that a share is bought at the beginning and held to the end of the
    trading day.


    # 5.3. Performance evaluation


    All models are trained using the same training set and tested over the three 7-day
    rolling windows on each of the ten stocks. Each round of testing exercises are
    carried out 50 times and the daily intraday cumulative trading returns are calculated
    as the average of the 50 test rounds. A summary is provided in Table 1 which presents
    the mean daily intra-day trading returns by HAT and the benchmark models/methods,
    averaged over each 7-day window. It is evident that the HAT consistently performs
    better than all baseline models, both in terms of higher mean returns and lower
    return variances.'
