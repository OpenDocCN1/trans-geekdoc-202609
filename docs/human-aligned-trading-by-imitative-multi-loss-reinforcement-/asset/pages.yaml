    Of the five baseline models, the supervised learning model often produces better
    performance than the rest. This may be because the supervised model follows a
    simpler rule to execute a trading action entirely based on the prediction of stock
    movement over the next minute, whereas RL-based models have the action-taking
    mechanism embedded in the model itself which makes it harder to train. However,
    HAT’s outperformance proves that a well-trained value-based RL trading system
    with sufficient amount of human aligning features should execute more optimal
    actions over time than actions taken purely based on supervised learning outcomes
    for the fact that the Q value represents the reward over an entire trading period
    and not just over the next period. Separately, DQfD’s performance is not far off
    that of supervised learning. After all, it shares a similar modelling paradigm
    as HAT although it places less emphasis on actions multiple steps ahead.


    Table 1 also compares returns by HAT to the buy-and-hold returns over the same
    periods. The finding is particularly interesting. For the five blue chip stocks
    of AAPL, COST, DIS, JPM, and NFLX, HAT outperforms a buy-and-hold in a market
    that is trending down when trading these stocks, but sometimes lags the buy-and-hold
    in an uptrend market. In a sideways-going market, HAT is marginally better.


    In down-trending and up-trending markets, our results may be explainable. When
    the stock price is falling, holding a stock gives negative returns, but the model
    can take advantage of short-selling to deliver a cumulative return that is better
    than buy-and-hold. On the other hand, when the stock price goes through a strong
    upward movement during the day, the model often may match the return of a buy-and-hold,
    but there are times when it cannot do so, because of wrong actions taken to short-sell
    a stock when the price is actually going up. The situation in a sideways-going
    market indicates that, as much as we would have liked the model to deliver superb
    performances, a sophisticated model can ultimately be somewhat constrained by
    the training data set.


