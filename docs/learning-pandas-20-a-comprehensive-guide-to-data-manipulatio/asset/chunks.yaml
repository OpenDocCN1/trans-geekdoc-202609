  fmt: "\n# Using Cython and Numba for Speed\n\nIn data analysis operations, speed\
    \ issues can arise from several factors, including:\n\n- **Looping over large\
    \ datasets**: Iterating over large datasets using Python loops can be slow due\
    \ to the interpreted nature of Python and the overhead associated with loops.\n\
    - **Inefficient implementations**: Using non-vectorized or non-optimized implementations\
    \ for operations on large datasets can lead to slow processing times.\n- **Complex\
    \ calculations**: Performing complex calculations on large datasets can be computationally\
    \ expensive and slow, particularly if the calculations cannot be easily parallelized\
    \ or optimized.\n\n`Cython` and `Numba` are two popular solutions for speeding\
    \ up data analysis operations in Python:\n\n## Cython\n\n`Cython` is a superset\
    \ of Python that allows you to write C extensions for Python in a Python-like\
    \ syntax. It lets you statically type variables and functions, which can lead\
    \ to significant performance improvements when compiled to C. `Cython` is particularly\
    \ useful when you have a performance-critical section of your code that can benefit\
    \ from the speed of C.\n\n## Numba\n\n`Numba` is a Just-In-Time (JIT) compiler\
    \ for Python that translates a subset of Python and NumPy code into machine code\
    \ at runtime. `Numba` enables you to write high-performance functions in Python\
    \ by using decorators to specify that a function should be compiled by `Numba`.\
    \ `Numba` is especially helpful when you have computationally expensive functions\
    \ that cannot be easily vectorized using NumPy or Pandas.\n\n## Install Cython\
    \ and Numba\n\nTo install `Cython` and `Numba`, use `pip`:\n\n```\npip install\
    \ cython numba\n```\n\nNow, let us see how `Cython` and `Numba` can be used to\
    \ speed up the performance of a simple example. Consider the following Python\
    \ function that computes the sum of squares for a range of numbers:\n\n```\ndef\
    \ sum_of_squares(n):\n    total = 0\n    for i in range(n):\n        total +=\
    \ i ** 2\n    return total\n```\n\n## Using Cython to Speed Up Function\n\nFirst,\
    \ you need to load the `Cython` extension in your Jupyter Notebook:\n\n```\n%load_ext\
    \ cython\n```\n\nNext, rewrite the function using `Cython` by adding the `%%cython`\
    \ magic command and specifying the types of the variables:\n\n```\n%%cython\n\
    def cython_sum_of_squares(int n):\n    cdef int total = 0\n    cdef int i\n  \
    \  for i in range(n):\n        total += i ** 2\n    return total\n```\n\n## Using\
    \ Numba to Speed Up Function\n\nImport `Numba` and use the `@jit` decorator to\
    \ indicate that the function should be compiled with `Numba`:\n\n```\nfrom numba\
    \ import jit\n\n@jit(nopython=True)\ndef numba_sum_of_squares(n):\n    total =\
    \ 0\n    for i in range(n):\n        total += i ** 2\n    return total\n```\n\n\
    ## Compare Performance\n\nNow, you can compare the performance of the original\
    \ function, the `Cython`-optimized version, and the `Numba`-optimized version:\n\
    \n```\nimport timeit\n\nn = 10_000\nprint(\"Python function:\")\n%timeit sum_of_squares(n)\n\
    print(\"\\nCython function:\")\n%timeit cython_sum_of_squares(n)\nprint(\"\\nNumba\
    \ function:\")\n%timeit numba_sum_of_squares(n)\n```\n\nYou should see that both\
    \ the `Cython` and `Numba` implementations are significantly faster than the original\
    \ Python function.\n\nIn summary, `Cython` and `Numba` are powerful tools for\
    \ optimizing the performance of your data analysis operations in Python. By using\
    \ these tools, you can significantly speed up your code and improve the efficiency\
    \ of your data processing tasks. Choose between `Cython` and `Numba` based on\
    \ your specific requirements, the nature of the code, and the type of optimizations\
    \ needed.\n"
