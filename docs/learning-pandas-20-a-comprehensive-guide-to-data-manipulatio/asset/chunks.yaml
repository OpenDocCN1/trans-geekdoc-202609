- raw: "Pivoting and Melting DataFrames Pivoting and melting DataFrames in Pandas\
    \ involve reshaping your data by changing its structure without altering the actual\
    \ data. Pivoting transforms the data from a long format to a wide format, while\
    \ melting does the opposite. Pivoting DataFrames using pivot() Method Pivoting\
    \ a DataFrame means reshaping it by setting the index, columns, and values based\
    \ on the existing columns. The pivot() method takes three main arguments: index,\
    \ columns, and values. For example, let us assume that you want to create a pivot\
    \ table to display the average credit score for each geography and gender combination\
    \ in the given dataset: \\# Calculate the average credit score for each combination\
    \ of geography and gender average\\_credit\\_score = data.groupby(\\['Geography',\
    \ 'Gender'\\])\\['CreditScore'\\].mean().reset\\_index() \\# Pivot the DataFrame\
    \ pivot\\_data = average\\_credit\\_score.pivot(index='Geography', columns='Gender',\
    \ values='CreditScore') The resulting pivot\\_data DataFrame will have 'Geography'\
    \ as the index, 'Gender' as the columns, and the average credit score as the values.\
    \ Melting DataFrames using melt() Function Melting a DataFrame means reshaping\
    \ it from a wide format to a long format by moving multiple columns into a single\
    \ column. The melt() function takes three main arguments: id\\_vars, value\\_vars,\
    \ and var\\_name. For example, let us melt the pivot\\_data DataFrame back into\
    \ a long format: melted\\_data = pd.melt(pivot\\_data.reset\\_index(), id\\_vars='Geography',\
    \ value\\_vars=\\['Female', 'Male'\\], var\\_name='Gender', value\\_name='AverageCreditScore')\
    \ The resulting melted\\_data DataFrame will have a long format with 'Geography',\
    \ 'Gender', and 'AverageCreditScore' columns. In summary, pivoting and melting\
    \ DataFrames in Pandas are techniques for reshaping your data without altering\
    \ the actual data. Pivoting involves transforming data from a long format to a\
    \ wide format using the pivot() method, while melting involves transforming data\
    \ from a wide format to a long format using the melt() function. These techniques\
    \ can help you better understand, visualize, and analyze your data by changing\
    \ its structure. \n\nData Transformation Functions: apply(), map(), and applymap()\
    \ Pandas offers data transformation functions, including apply(), map(), and applymap(),\
    \ which provide the ability to apply a customized function to individual elements,\
    \ rows, or columns within a DataFrame or Series. These functions enable data manipulation\
    \ and transformation in a highly adaptable and efficient manner. With these functions,\
    \ data can be transformed and manipulated to meet specific needs. Apply() applies\
    \ a function to each element or row/column of a DataFrame, while map() applies\
    \ a function to each element of a Series. Applymap() applies a function to each\
    \ element of a DataFrame. This range of functions provides a comprehensive toolkit\
    \ to transform and manipulate data. apply() Function The apply() function is used\
    \ to apply a function along an axis of the DataFrame (either rows or columns)\
    \ or to a Series. For example, let us assume that you want to calculate the range\
    \ (max-min) for each numeric column in the data DataFrame: def col\\_range(col):\
    \     return col.max() - col.min() column\\_ranges = data.apply(col\\_range) The\
    \ apply() function can also be used with lambda functions. To achieve the same\
    \ result as above: column\\_ranges = data.apply(lambda col: col.max() - col.min())\
    \ map() Function The map() function is used to apply a function to each element\
    \ of a Series. It's useful when you want to perform element-wise transformations\
    \ on a single column. For example, let us assume that you want to update the 'Geography'\
    \ column in the data DataFrame to have uppercase values: data\\['Geography'\\\
    ] = data\\['Geography'\\].map(lambda x: x.upper()) applymap() Function The applymap()\
    \ function is used to apply a function to each element of a DataFrame. It's useful\
    \ when you want to perform element-wise transformations on multiple columns. For\
    \ example, let us assume that you want to round all numeric columns in the data\
    \ DataFrame to integers: numeric\\_cols = data.select\\_dtypes(include='number').columns\
    \ data\\[numeric\\_cols\\] = data\\[numeric\\_cols\\].applymap(lambda x: round(x))\
    \ In summary, data transformation functions in Pandas like apply(), map(), and\
    \ applymap() allow you to apply a specific function to elements, rows, or columns\
    \ in a DataFrame or Series. The apply() function is used to apply a function along\
    \ an axis of the DataFrame or to a Series, the map() function is used to apply\
    \ a function to each element of a Series, and the applymap() function is used\
    \ to apply a function to each element of a DataFrame. These functions help you\
    \ transform and manipulate data in a flexible and efficient manner. \n\nGrouping\
    \ and Aggregating Data In Pandas, the process of grouping and aggregating data\
    \ involves utilizing the \"groupby()\" function to group data based on one or\
    \ more columns, followed by the application of an aggregation function to the\
    \ grouped data. This technique proves to be useful when analyzing data based on\
    \ specific categories or combinations of categories. Through the \"groupby()\"\
    \ function, it is possible to organize data into groups that have similar values\
    \ and perform mathematical operations on the data within those groups. Grouping\
    \ and aggregating data allows for a better understanding of patterns within the\
    \ dataset and aids in identifying any trends or insights that may not have been\
    \ noticeable otherwise. Let us work through an example using the Customer\\_Churn\\\
    _Modelling.csv dataset. We'll group the data by 'Geography' and 'Gender' and calculate\
    \ the average credit score for each group. Read the data import pandas as pd data\
    \ = pd.read\\_csv(\"https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer\\\
    _Churn\\_Modelling.csv\") Group the data using groupby() grouped\\_data = data.groupby(\\\
    ['Geography', 'Gender'\\]) This creates a groupby object with the data grouped\
    \ by 'Geography' and 'Gender'. You can now apply aggregation functions to the\
    \ grouped data. Aggregate the data using an aggregation function In this example,\
    \ we'll use the mean() function to calculate the average credit score for each\
    \ group: average\\_credit\\_scores = grouped\\_data\\['CreditScore'\\].mean()\
    \ The average\\_credit\\_scores variable now contains a Series with the average\
    \ credit score for each combination of 'Geography' and 'Gender'. You can also\
    \ use the agg() function to apply multiple aggregation functions at once. For\
    \ example, let us calculate the mean, minimum, and maximum credit scores for each\
    \ group: credit\\_score\\_summary = grouped\\_data\\['CreditScore'\\].agg(\\['mean',\
    \ 'min', 'max'\\]) The credit\\_score\\_summary variable now contains a DataFrame\
    \ with the mean, minimum, and maximum credit scores for each combination of 'Geography'\
    \ and 'Gender'. In summary, grouping and aggregating data in Pandas involve using\
    \ the groupby() function to group the data based on one or more columns and then\
    \ applying an aggregation function to the grouped data. This is useful for analyzing\
    \ your data by specific categories or combinations of categories. In the given\
    \ example, we grouped the data by 'Geography' and 'Gender' and calculated the\
    \ average credit score for each group. "
  fmt: "\n# Pivoting and Melting DataFrames\n\nPivoting and melting DataFrames in\
    \ Pandas involve reshaping your data by changing its structure without altering\
    \ the actual data. Pivoting transforms the data from a long format to a wide format,\
    \ while melting does the opposite.\n\n## Pivoting DataFrames using `pivot()` Method\n\
    \nPivoting a DataFrame means reshaping it by setting the index, columns, and values\
    \ based on the existing columns. The `pivot()` method takes three main arguments:\
    \ `index`, `columns`, and `values`.\n\nFor example, let us assume that you want\
    \ to create a pivot table to display the average credit score for each geography\
    \ and gender combination in the given dataset:\n\n```\n# Calculate the average\
    \ credit score for each combination of geography and gender\naverage_credit_score\
    \ = data.groupby(['Geography', 'Gender'])['CreditScore'].mean().reset_index()\n\
    \n# Pivot the DataFrame\npivot_data = average_credit_score.pivot(index='Geography',\
    \ columns='Gender', values='CreditScore')\n```\n\nThe resulting `pivot_data` DataFrame\
    \ will have `Geography` as the index, `Gender` as the columns, and the average\
    \ credit score as the values.\n\n## Melting DataFrames using `melt()` Function\n\
    \nMelting a DataFrame means reshaping it from a wide format to a long format by\
    \ moving multiple columns into a single column. The `melt()` function takes three\
    \ main arguments: `id_vars`, `value_vars`, and `var_name`.\n\nFor example, let\
    \ us melt the `pivot_data` DataFrame back into a long format:\n\n```\nmelted_data\
    \ = pd.melt(pivot_data.reset_index(), id_vars='Geography', value_vars=['Female',\
    \ 'Male'], var_name='Gender', value_name='AverageCreditScore')\n```\n\nThe resulting\
    \ `melted_data` DataFrame will have a long format with `Geography`, `Gender`,\
    \ and `AverageCreditScore` columns.\n\nIn summary, pivoting and melting DataFrames\
    \ in Pandas are techniques for reshaping your data without altering the actual\
    \ data. Pivoting involves transforming data from a long format to a wide format\
    \ using the `pivot()` method, while melting involves transforming data from a\
    \ wide format to a long format using the `melt()` function. These techniques can\
    \ help you better understand, visualize, and analyze your data by changing its\
    \ structure.\n\n# Data Transformation Functions: `apply()`, `map()`, and `applymap()`\n\
    \nPandas offers data transformation functions, including `apply()`, `map()`, and\
    \ `applymap()`, which provide the ability to apply a customized function to individual\
    \ elements, rows, or columns within a DataFrame or Series. These functions enable\
    \ data manipulation and transformation in a highly adaptable and efficient manner.\
    \ With these functions, data can be transformed and manipulated to meet specific\
    \ needs. `apply()` applies a function to each element or row/column of a DataFrame,\
    \ while `map()` applies a function to each element of a Series. `applymap()` applies\
    \ a function to each element of a DataFrame. This range of functions provides\
    \ a comprehensive toolkit to transform and manipulate data.\n\n## `apply()` Function\n\
    \nThe `apply()` function is used to apply a function along an axis of the DataFrame\
    \ (either rows or columns) or to a Series.\n\nFor example, let us assume that\
    \ you want to calculate the range (max-min) for each numeric column in the `data`\
    \ DataFrame:\n\n```\ndef col_range(col):\n    return col.max() - col.min()\n\n\
    column_ranges = data.apply(col_range)\n```\n\nThe `apply()` function can also\
    \ be used with lambda functions. To achieve the same result as above:\n\n```\n\
    column_ranges = data.apply(lambda col: col.max() - col.min())\n```\n\n## `map()`\
    \ Function\n\nThe `map()` function is used to apply a function to each element\
    \ of a Series. It's useful when you want to perform element-wise transformations\
    \ on a single column.\n\nFor example, let us assume that you want to update the\
    \ `Geography` column in the `data` DataFrame to have uppercase values:\n\n```\n\
    data['Geography'] = data['Geography'].map(lambda x: x.upper())\n```\n\n## `applymap()`\
    \ Function\n\nThe `applymap()` function is used to apply a function to each element\
    \ of a DataFrame. It's useful when you want to perform element-wise transformations\
    \ on multiple columns.\n\nFor example, let us assume that you want to round all\
    \ numeric columns in the `data` DataFrame to integers:\n\n```\nnumeric_cols =\
    \ data.select_dtypes(include='number').columns\ndata[numeric_cols] = data[numeric_cols].applymap(lambda\
    \ x: round(x))\n```\n\nIn summary, data transformation functions in Pandas like\
    \ `apply()`, `map()`, and `applymap()` allow you to apply a specific function\
    \ to elements, rows, or columns in a DataFrame or Series. The `apply()` function\
    \ is used to apply a function along an axis of the DataFrame or to a Series, the\
    \ `map()` function is used to apply a function to each element of a Series, and\
    \ the `applymap()` function is used to apply a function to each element of a DataFrame.\
    \ These functions help you transform and manipulate data in a flexible and efficient\
    \ manner.\n\n# Grouping and Aggregating Data\n\nIn Pandas, the process of grouping\
    \ and aggregating data involves utilizing the `groupby()` function to group data\
    \ based on one or more columns, followed by the application of an aggregation\
    \ function to the grouped data. This technique proves to be useful when analyzing\
    \ data based on specific categories or combinations of categories. Through the\
    \ `groupby()` function, it is possible to organize data into groups that have\
    \ similar values and perform mathematical operations on the data within those\
    \ groups. Grouping and aggregating data allows for a better understanding of patterns\
    \ within the dataset and aids in identifying any trends or insights that may not\
    \ have been noticeable otherwise.\n\nLet us work through an example using the\
    \ `Customer_Churn_Modelling.csv` dataset. We'll group the data by `Geography`\
    \ and `Gender` and calculate the average credit score for each group.\n\n## Read\
    \ the data\n\n```\nimport pandas as pd\ndata = pd.read_csv(\"https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv\"\
    )\n```\n\n## Group the data using `groupby()`\n\n```\ngrouped_data = data.groupby(['Geography',\
    \ 'Gender'])\n```\n\nThis creates a `groupby` object with the data grouped by\
    \ `Geography` and `Gender`. You can now apply aggregation functions to the grouped\
    \ data.\n\n## Aggregate the data using an aggregation function\n\nIn this example,\
    \ we'll use the `mean()` function to calculate the average credit score for each\
    \ group:\n\n```\naverage_credit_scores = grouped_data['CreditScore'].mean()\n\
    ```\n\nThe `average_credit_scores` variable now contains a Series with the average\
    \ credit score for each combination of `Geography` and `Gender`.\n\nYou can also\
    \ use the `agg()` function to apply multiple aggregation functions at once. For\
    \ example, let us calculate the mean, minimum, and maximum credit scores for each\
    \ group:\n\n```\ncredit_score_summary = grouped_data['CreditScore'].agg(['mean',\
    \ 'min', 'max'])\n```\n\nThe `credit_score_summary` variable now contains a DataFrame\
    \ with the mean, minimum, and maximum credit scores for each combination of `Geography`\
    \ and `Gender`.\n\nIn summary, grouping and aggregating data in Pandas involve\
    \ using the `groupby()` function to group the data based on one or more columns\
    \ and then applying an aggregation function to the grouped data. This is useful\
    \ for analyzing your data by specific categories or combinations of categories.\
    \ In the given example, we grouped the data by `Geography` and `Gender` and calculated\
    \ the average credit score for each group.\n"
  trans: "\n# 数据透视与熔化\n\n在 Pandas 中，数据透视和熔化涉及通过改变数据结构来重塑数据，而不改变实际数据。透视将数据从长格式转换为宽格式，而熔化则执行相反的操作。\n\
    \n## 使用 `pivot()` 方法透视 DataFrame\n\n透视 DataFrame 意味着根据现有列设置索引、列和值来重塑它。`pivot()`\
    \ 方法接受三个主要参数：`index`、`columns` 和 `values`。\n\n例如，假设你想创建一个透视表，以显示给定数据集中每个地理区域和性别组合的平均信用评分：\n\
    \n```\n# 计算每个地理区域和性别组合的平均信用评分\naverage_credit_score = data.groupby(['Geography',\
    \ 'Gender'])['CreditScore'].mean().reset_index()\n\n# 透视 DataFrame\npivot_data\
    \ = average_credit_score.pivot(index='Geography', columns='Gender', values='CreditScore')\n\
    ```\n\n生成的 `pivot_data` DataFrame 将以 `Geography` 为索引，`Gender` 为列，平均信用评分为值。\n\n\
    ## 使用 `melt()` 函数熔化 DataFrame\n\n熔化 DataFrame 意味着通过将多列移动到单个列中，将其从宽格式重塑为长格式。`melt()`\
    \ 函数接受三个主要参数：`id_vars`、`value_vars` 和 `var_name`。\n\n例如，让我们将 `pivot_data` DataFrame\
    \ 熔化回长格式：\n\n```\nmelted_data = pd.melt(pivot_data.reset_index(), id_vars='Geography',\
    \ value_vars=['Female', 'Male'], var_name='Gender', value_name='AverageCreditScore')\n\
    ```\n\n生成的 `melted_data` DataFrame 将具有长格式，包含 `Geography`、`Gender` 和 `AverageCreditScore`\
    \ 列。\n\n总之，Pandas 中的数据透视和熔化是重塑数据而不改变实际数据的技术。透视涉及使用 `pivot()` 方法将数据从长格式转换为宽格式，而熔化涉及使用\
    \ `melt()` 函数将数据从宽格式转换为长格式。这些技术可以通过改变数据结构，帮助你更好地理解、可视化和分析数据。\n\n# 数据转换函数：`apply()`、`map()`\
    \ 和 `applymap()`\n\nPandas 提供了数据转换函数，包括 `apply()`、`map()` 和 `applymap()`，它们提供了将自定义函数应用于\
    \ DataFrame 或 Series 中的单个元素、行或列的能力。这些函数以高度适应性和高效的方式实现数据操作和转换。利用这些函数，数据可以被转换和操作以满足特定需求。`apply()`\
    \ 将函数应用于 DataFrame 的每个元素或行/列，而 `map()` 将函数应用于 Series 的每个元素。`applymap()` 将函数应用于\
    \ DataFrame 的每个元素。这一系列函数提供了一个全面的工具包来转换和操作数据。\n\n## `apply()` 函数\n\n`apply()` 函数用于沿\
    \ DataFrame 的轴（行或列）或应用于 Series 应用函数。\n\n例如，假设你想计算 `data` DataFrame 中每个数值列的极差（最大值-最小值）：\n\
    \n```\ndef col_range(col):\n    return col.max() - col.min()\n\ncolumn_ranges\
    \ = data.apply(col_range)\n```\n\n`apply()` 函数也可以与 lambda 函数一起使用。要获得与上述相同的结果：\n\
    \n```\ncolumn_ranges = data.apply(lambda col: col.max() - col.min())\n```\n\n\
    ## `map()` 函数\n\n`map()` 函数用于将函数应用于 Series 的每个元素。当你想对单个列执行逐元素转换时，它非常有用。\n\n例如，假设你想将\
    \ `data` DataFrame 中的 `Geography` 列更新为大写值：\n\n```\ndata['Geography'] = data['Geography'].map(lambda\
    \ x: x.upper())\n```\n\n## `applymap()` 函数\n\n`applymap()` 函数用于将函数应用于 DataFrame\
    \ 的每个元素。当你想对多列执行逐元素转换时，它非常有用。\n\n例如，假设你想将 `data` DataFrame 中所有数值列四舍五入为整数：\n\n\
    ```\nnumeric_cols = data.select_dtypes(include='number').columns\ndata[numeric_cols]\
    \ = data[numeric_cols].applymap(lambda x: round(x))\n```\n\n总之，Pandas 中的数据转换函数如\
    \ `apply()`、`map()` 和 `applymap()` 允许你将特定函数应用于 DataFrame 或 Series 中的元素、行或列。`apply()`\
    \ 函数用于沿 DataFrame 的轴或应用于 Series 应用函数，`map()` 函数用于将函数应用于 Series 的每个元素，`applymap()`\
    \ 函数用于将函数应用于 DataFrame 的每个元素。这些函数帮助你以灵活高效的方式转换和操作数据。\n\n# 数据分组与聚合\n\n在 Pandas\
    \ 中，分组和聚合数据的过程涉及使用 `groupby()` 函数根据一个或多个列对数据进行分组，随后对分组后的数据应用聚合函数。当根据特定类别或类别组合分析数据时，此技术非常有用。通过\
    \ `groupby()` 函数，可以将数据组织成具有相似值的组，并对这些组内的数据执行数学运算。分组和聚合数据有助于更好地理解数据集中的模式，并有助于识别原本可能不易察觉的趋势或洞察。\n\
    \n让我们使用 `Customer_Churn_Modelling.csv` 数据集演示一个示例。我们将按 `Geography` 和 `Gender` 对数据进行分组，并计算每组的平均信用评分。\n\
    \n## 读取数据\n\n```\nimport pandas as pd\ndata = pd.read_csv(\"https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv\"\
    )\n```\n\n## 使用 `groupby()` 分组数据\n\n```\ngrouped_data = data.groupby(['Geography',\
    \ 'Gender'])\n```\n\n这将创建一个按 `Geography` 和 `Gender` 分组数据的 `groupby` 对象。现在你可以对分组后的数据应用聚合函数。\n\
    \n## 使用聚合函数聚合数据\n\n在本例中，我们将使用 `mean()` 函数计算每组的平均信用评分：\n\n```\naverage_credit_scores\
    \ = grouped_data['CreditScore'].mean()\n```\n\n`average_credit_scores` 变量现在包含一个\
    \ Series，其中存有每个 `Geography` 和 `Gender` 组合的平均信用评分。\n\n你也可以使用 `agg()` 函数一次性应用多个聚合函数。例如，让我们计算每组的平均、最小和最大信用评分：\n\
    \n```\ncredit_score_summary = grouped_data['CreditScore'].agg(['mean', 'min',\
    \ 'max'])\n```\n\n`credit_score_summary` 变量现在包含一个 DataFrame，其中存有每个 `Geography`\
    \ 和 `Gender` 组合的平均、最小和最大信用评分。\n\n总之，Pandas 中的分组和聚合数据涉及使用 `groupby()` 函数根据一个或多个列对数据进行分组，然后对分组后的数据应用聚合函数。这对于按特定类别或类别组合分析数据非常有用。在给定示例中，我们按\
    \ `Geography` 和 `Gender` 对数据进行分组，并计算了每组的平均信用评分。\n"
