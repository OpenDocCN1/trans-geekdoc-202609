  fmt: "\n# Handling Imbalanced Data\n\nImbalanced data refers to a situation where\
    \ the distribution of classes in the target variable is not equal or significantly\
    \ skewed. In other words, one class has significantly more examples than the other\
    \ classes. Imbalanced data can lead to biased machine learning models, as they\
    \ tend to favor the majority class and perform poorly on the minority class.\n\
    \nTo handle imbalanced data in the `customer_chrn_modelling` database, follow\
    \ these steps:\n\n## Load Dataset and Explore Target Variable\n\n```python\nimport\
    \ pandas as pd\n\nurl = 'https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv'\n\
    df = pd.read_csv(url)\n\n# Assuming 'target_column' is the name of the target\
    \ variable\nprint(df['target_column'].value_counts())\n```\n\n## Identify Imbalanced\
    \ Data\n\nCheck the distribution of classes in the target variable. If there's\
    \ a significant difference between the number of examples in each class, the data\
    \ is imbalanced.\n\nThere are several techniques to handle imbalanced data. Some\
    \ common methods are:\n\n- **Resampling the data**:\n  - **Upsampling the minority\
    \ class**: Increase the number of samples in the minority class by randomly replicating\
    \ them.\n  - **Downsampling the majority class**: Decrease the number of samples\
    \ in the majority class by randomly removing them.\n- **Using synthetic data generation\
    \ methods** like Synthetic Minority Over-sampling Technique (`SMOTE`) or Adaptive\
    \ Synthetic (`ADASYN`) to create new synthetic examples for the minority class.\n\
    - **Using cost-sensitive learning**, where you assign different misclassification\
    \ costs to the majority and minority classes, effectively penalizing the model\
    \ more for misclassifying the minority class.\n- **Ensemble methods** like bagging\
    \ and boosting can also help improve the performance on imbalanced datasets.\n\
    \nThe example below demonstrates how to apply some of these techniques:\n\n```python\n\
    # Import necessary libraries\nfrom sklearn.utils import resample\nfrom imblearn.over_sampling\
    \ import SMOTE\n\n# Separate the majority and minority classes\ndf_majority =\
    \ df[df['target_column'] == 0]\ndf_minority = df[df['target_column'] == 1]\n\n\
    # Upsampling the minority class\ndf_minority_upsampled = resample(df_minority,\
    \ replace=True, n_samples=len(df_majority), random_state=42)\ndf_upsampled = pd.concat([df_majority,\
    \ df_minority_upsampled])\n\n# Downsampling the majority class\ndf_majority_downsampled\
    \ = resample(df_majority, replace=False, n_samples=len(df_minority), random_state=42)\n\
    df_downsampled = pd.concat([df_majority_downsampled, df_minority])\n\n# Using\
    \ SMOTE to generate synthetic samples for the minority class\nX = df.drop('target_column',\
    \ axis=1)\ny = df['target_column']\nsmote = SMOTE(random_state=42)\nX_smote, y_smote\
    \ = smote.fit_resample(X, y)\n```\n\nAfter applying one or more of these techniques,\
    \ you'll have a more balanced dataset that should help improve the performance\
    \ of your machine learning models on the minority class. Note that it's essential\
    \ to experiment with different methods and evaluate the performance of your model\
    \ using appropriate metrics like precision, recall, F1-score, or area under the\
    \ ROC curve, as accuracy can be misleading in the case of imbalanced data.\n\n\
    # Feature Scaling and Normalization\n\nFeature scaling and normalization are preprocessing\
    \ techniques used to standardize the range of independent features or variables\
    \ in a dataset. These techniques are essential because many machine learning algorithms\
    \ are sensitive to the scale of input features. Different features might have\
    \ different units and scales, and without proper scaling, an algorithm might give\
    \ more importance to features with higher magnitudes, which can lead to biased\
    \ or suboptimal model performance.\n\nThe two most common methods of feature scaling\
    \ are normalization (Min-Max scaling) and standardization (Z-score scaling).\n\
    \n## Normalization (Min-Max Scaling)\n\nNormalization scales the features in the\
    \ range of `[0, 1]`. It is calculated using the following formula:\n\n`X_normalized\
    \ = (X - X_min) / (X_max - X_min)`\n\nwhere `X` is the original feature value,\
    \ `X_min` and `X_max` are the minimum and maximum values of the feature, respectively.\n\
    \n## Standardization (Z-score Scaling)\n\nStandardization scales the features\
    \ such that they have a mean of 0 and a standard deviation of 1. It is calculated\
    \ using the following formula:\n\n`X_standardized = (X - mean(X)) / std(X)`\n\n\
    where `X` is the original feature value, `mean(X)` is the mean of the feature,\
    \ and `std(X)` is the standard deviation of the feature.\n\n## Implementing Feature\
    \ Scaling and Normalization\n\nTo implement feature scaling and normalization\
    \ using Python, you can use the Scikit-learn library's preprocessing tools.\n\n\
    ```python\nimport pandas as pd\nfrom sklearn.preprocessing import MinMaxScaler,\
    \ StandardScaler\n\n# Load the dataset\nurl = 'https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv'\n\
    df = pd.read_csv(url)\n\n# List the columns you want to scale\ncolumns_to_scale\
    \ = ['numerical_column1', 'numerical_column2']\n\n# Normalization (Min-Max scaling)\n\
    min_max_scaler = MinMaxScaler()\ndf[columns_to_scale] = min_max_scaler.fit_transform(df[columns_to_scale])\n\
    \n# Standardization (Z-score scaling)\nstandard_scaler = StandardScaler()\ndf[columns_to_scale]\
    \ = standard_scaler.fit_transform(df[columns_to_scale])\n```\n\nRemember to apply\
    \ the same scaling method to both the training and test sets to ensure consistency\
    \ in the data. However, make sure to fit the scaler only on the training data\
    \ and use the same scaler to transform the test data. This avoids data leakage\
    \ from the test set into the training set.\n"
  trans: "\n\n# 处理不平衡数据\n\n不平衡数据是指目标变量中各类别的分布不均等或严重偏斜的情况。换句话说，某一类别的样本数量显著多于其他类别。不平衡数据可能导致机器学习模型产生偏差，因为模型倾向于偏向多数类，导致在少数类上的表现不佳。\n\
    \n要在 `customer_chrn_modelling` 数据库中处理不平衡数据，请遵循以下步骤：\n\n## 加载数据集并探索目标变量\n\n```python\n\
    import pandas as pd\n\nurl = 'https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv'\n\
    df = pd.read_csv(url)\n\n# 假设 'target_column' 是目标变量的名称\nprint(df['target_column'].value_counts())\n\
    ```\n\n## 识别不平衡数据\n\n检查目标变量中各类别的分布。如果各类别的样本数量存在显著差异，则数据不平衡。\n\n有多种技术可用于处理不平衡数据。一些常用方法包括：\n\
    \n- **重采样数据**：\n  - **上采样少数类**：通过随机复制少数类样本来增加其数量。\n  - **下采样多数类**：通过随机移除多数类样本来减少其数量。\n\
    - **使用合成数据生成方法**，如合成少数类过采样技术（`SMOTE`）或自适应合成采样（`ADASYN`），为少数类创建新的合成样本。\n- **使用代价敏感学习**，为多数类和少数类分配不同的误分类代价，实际上是对模型误分类少数类施加更大的惩罚。\n\
    - **集成方法**，如 Bagging 和 Boosting，也有助于提升在不平衡数据集上的性能。\n\n以下示例演示了如何应用其中一些技术：\n\n```python\n\
    # 导入必要的库\nfrom sklearn.utils import resample\nfrom imblearn.over_sampling import\
    \ SMOTE\n\n# 分离多数类和少数类\ndf_majority = df[df['target_column'] == 0]\ndf_minority\
    \ = df[df['target_column'] == 1]\n\n# 上采样少数类\ndf_minority_upsampled = resample(df_minority,\
    \ replace=True, n_samples=len(df_majority), random_state=42)\ndf_upsampled = pd.concat([df_majority,\
    \ df_minority_upsampled])\n\n# 下采样多数类\ndf_majority_downsampled = resample(df_majority,\
    \ replace=False, n_samples=len(df_minority), random_state=42)\ndf_downsampled\
    \ = pd.concat([df_majority_downsampled, df_minority])\n\n# 使用 SMOTE 为少数类生成合成样本\n\
    X = df.drop('target_column', axis=1)\ny = df['target_column']\nsmote = SMOTE(random_state=42)\n\
    X_smote, y_smote = smote.fit_resample(X, y)\n```\n\n应用一种或多种这些技术后，您将获得一个更平衡的数据集，这有助于提高机器学习模型在少数类上的性能。请务必尝试不同的方法，并使用精确率、召回率、F1\
    \ 分数或 ROC 曲线下面积等适当指标评估模型性能，因为在不平衡数据的情况下，准确率可能会产生误导。\n\n# 特征缩放与归一化\n\n特征缩放与归一化是用于标准化数据集中独立特征或变量范围的预处理技术。这些技术至关重要，因为许多机器学习算法对输入特征的尺度敏感。不同特征可能具有不同的单位和尺度，如果没有适当的缩放，算法可能会赋予数值幅度较大的特征更高的重要性，从而导致模型性能产生偏差或不佳。\n\
    \n最常用的两种特征缩放方法是归一化（最小-最大缩放）和标准化（Z-score 缩放）。\n\n## 归一化（最小-最大缩放）\n\n归一化将特征缩放到 `[0,\
    \ 1]` 的范围内。其计算公式如下：\n\n`X_normalized = (X - X_min) / (X_max - X_min)`\n\n其中 `X`\
    \ 为原始特征值，`X_min` 和 `X_max` 分别为该特征的最小值和最大值。\n\n## 标准化（Z-score 缩放）\n\n标准化将特征缩放为均值为\
    \ 0、标准差为 1 的分布。其计算公式如下：\n\n`X_standardized = (X - mean(X)) / std(X)`\n\n其中 `X`\
    \ 为原始特征值，`mean(X)` 为该特征的均值，`std(X)` 为该特征的标准差。\n\n## 实现特征缩放与归一化\n\n要使用 Python 实现特征缩放与归一化，可以使用\
    \ Scikit-learn 库的预处理工具。\n\n```python\nimport pandas as pd\nfrom sklearn.preprocessing\
    \ import MinMaxScaler, StandardScaler\n\n# 加载数据集\nurl = 'https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv'\n\
    df = pd.read_csv(url)\n\n# 列出要缩放的列\ncolumns_to_scale = ['numerical_column1', 'numerical_column2']\n\
    \n# 归一化（最小-最大缩放）\nmin_max_scaler = MinMaxScaler()\ndf[columns_to_scale] = min_max_scaler.fit_transform(df[columns_to_scale])\n\
    \n# 标准化（Z-score 缩放）\nstandard_scaler = StandardScaler()\ndf[columns_to_scale]\
    \ = standard_scaler.fit_transform(df[columns_to_scale])\n```\n\n请记住，对训练集和测试集应用相同的缩放方法以确保数据一致性。但请务必**仅在训练数据上拟合缩放器**，并使用同一个缩放器转换测试数据。这可以避免测试集数据泄露到训练集中。\n\
    \n"
