  fmt: "\n# Data Transformation and Cleaning\n\nEffective data preprocessing involves\
    \ crucial stages of data transformation and cleaning. These processes ensure that\
    \ the collected data is appropriately organized, consistent, and reliable, thereby\
    \ leading to better analysis and decision-making. It is essential to conduct these\
    \ initial steps as they significantly impact the accuracy and quality of the final\
    \ output. Incomplete or erroneous data can lead to incorrect conclusions and negatively\
    \ impact the results.\n\nIn this example, we'll use the `Customer_Churn_Modelling.csv`\
    \ dataset, assuming it's already loaded into a DataFrame called `data`.\n\n##\
    \ Identify and Handle Missing Data\n\nRefer to the previous section on how to\
    \ handle missing data with Pandas. Apply either the `dropna()` or `fillna()` method\
    \ based on your specific requirements.\n\n## Rename Columns (optional)\n\nIf you\
    \ want to rename columns for better readability or consistency, you can use the\
    \ `rename()` method:\n\n```\ndata = data.rename(columns={\n    'NumOfProducts':\
    \ 'Number_of_Products',\n    'HasCrCard': 'Has_Credit_Card',\n    'IsActiveMember':\
    \ 'Is_Active_Member',\n    'EstimatedSalary': 'Estimated_Salary'\n})\n```\n\n\
    ## Convert Data Types\n\nEnsure that the data types of each column are appropriate\
    \ for further analysis. You can check the data types using the `dtypes` attribute:\n\
    \n```\nprint(data.dtypes)\n```\n\nIf you need to change the data type of a column,\
    \ you can use the `astype()` method:\n\n```\ndata['Has_Credit_Card'] = data['Has_Credit_Card'].astype('bool')\n\
    data['Is_Active_Member'] = data['Is_Active_Member'].astype('bool')\n```\n\n##\
    \ Remove Duplicates\n\nCheck for and remove any duplicate rows in the dataset\
    \ using the `duplicated()` and `drop_duplicates()` methods:\n\n```\nduplicates\
    \ = data.duplicated()\nprint(f'Number of duplicate rows: {duplicates.sum()}')\n\
    data = data.drop_duplicates()\n```\n\n## Normalize Numerical Columns\n\nNormalization\
    \ and standardization help scale numerical features to a common range or distribution,\
    \ which can be useful for certain machine learning algorithms.\n\nTo normalize\
    \ a column (scale values between 0 and 1):\n\n```\ndata['CreditScore'] = (data['CreditScore']\
    \ - data['CreditScore'].min()) / (data['CreditScore'].max() - data['CreditScore'].min())\n\
    ```\n\nTo standardize a column (scale values to have a mean of 0 and a standard\
    \ deviation of 1):\n\n```\ndata['Age'] = (data['Age'] - data['Age'].mean()) /\
    \ data['Age'].std()\n```\n\n## Encode Categorical Variables\n\nIf you plan to\
    \ use the data for machine learning, you may need to encode categorical variables\
    \ as numerical values. You can use techniques like one-hot encoding or label encoding.\n\
    \nFor one-hot encoding, use the `get_dummies()` function:\n\n```\ndata = pd.get_dummies(data,\
    \ columns=['Geography', 'Gender'])\n```\n\nFor label encoding, you can use the\
    \ `LabelEncoder` class from scikit-learn:\n\n```\nfrom sklearn.preprocessing import\
    \ LabelEncoder\nencoder = LabelEncoder()\ndata['Surname'] = encoder.fit_transform(data['Surname'])\n\
    ```\n\n## Reorder or Drop Columns\n\nReorder or drop columns as needed for better\
    \ organization or to remove unnecessary features:\n\n```\n# Reorder columns\n\
    data = data[['RowNumber', 'CustomerId', 'Surname', 'CreditScore', 'Age', 'Tenure',\
    \ 'Balance', 'Number_of_Products', 'Has_Credit_Card', 'Is_Active_Member', 'Estimated_Salary',\
    \ 'Geography_France', 'Geography_Germany', 'Geography_Spain', 'Gender_Female',\
    \ 'Gender_Male', 'Exited']]\n\n# Drop unnecessary columns (e.g., 'RowNumber',\
    \ 'CustomerId', 'Surname' might not be relevant for your analysis)\ndata = data.drop(columns=['RowNumber',\
    \ 'CustomerId', 'Surname'])\n```\n\n## Verify the Changes\n\nAfter performing\
    \ data transformation and cleaning, it's essential to verify the changes by inspecting\
    \ the data:\n\n```\nprint(data.head())\nprint(data.dtypes)\nprint(data.describe())\n\
    ```\n\nIn summary, you can use various methods provided by Pandas to perform data\
    \ transformation and cleaning tasks, such as handling missing values, renaming\
    \ columns, converting data types, removing duplicates, normalizing or standardizing\
    \ numerical columns, encoding categorical variables, and reordering or dropping\
    \ columns. These steps help ensure the data is accurate, consistent, and well-structured\
    \ for further analysis or machine learning applications.\n\n# Summary\n\nWe discussed\
    \ reading data from different file formats using Pandas. Pandas can read multiple\
    \ formats like CSV, JSON, Excel, SQL databases, and more. We demonstrated how\
    \ to read data from the `Customer_Churn_Modelling.csv` dataset in JSON and Excel\
    \ (XLS) formats using the `pd.read_json()` and `pd.read_excel()` functions.\n\n\
    Next, we covered writing data to different formats. Pandas can write DataFrames\
    \ to various file formats, including CSV, JSON, Excel, and more. We demonstrated\
    \ how to write the DataFrame containing the `Customer_Churn_Modelling.csv` dataset\
    \ to a JSON and Excel file using the `to_json()` and `to_excel()` methods.\n\n\
    Following that, we discussed database interaction with Pandas. Pandas allows you\
    \ to perform database operations using the `pd.read_sql()` and `to_sql()` functions.\
    \ We demonstrated how to connect to a SQLite database, read data from a table\
    \ into a DataFrame using `pd.read_sql()`, and write data from a DataFrame to a\
    \ table using the `to_sql()` method.\n\nWe then explored connecting web APIs to\
    \ Pandas. By using the `requests` library to fetch real-time data from APIs and\
    \ loading it into a DataFrame, you can manipulate and analyze dynamic data sources.\
    \ We provided an example of fetching data from the JSONPlaceholder API and loading\
    \ it into a DataFrame using the `pd.DataFrame()` constructor.\n\nAfterward, we\
    \ discussed web scraping using Beautiful Soup. By fetching HTML content from a\
    \ website, parsing it with Beautiful Soup, extracting structured data, and loading\
    \ it into a DataFrame, you can work with data from dynamic web content. We provided\
    \ an example of scraping data from a table on the World Coin Index website and\
    \ loading it into a DataFrame.\n\nNext, we explained how to handle missing data\
    \ in Pandas. The `isna()` and `isnull()` methods help identify missing values,\
    \ while the `dropna()` and `fillna()` methods help handle them by either removing\
    \ or filling missing values based on your requirements.\n\nFinally, we covered\
    \ data transformation and cleaning using Pandas. This process involves handling\
    \ missing data, renaming columns, converting data types, removing duplicates,\
    \ normalizing or standardizing numerical columns, encoding categorical variables,\
    \ and reordering or dropping columns. These steps ensure that the data is accurate,\
    \ consistent, and well-structured for further analysis or machine learning applications.\n\
    \nOverall, this chapter has covered various aspects of using Pandas for data manipulation,\
    \ including reading and writing data from different formats, database interaction,\
    \ connecting to web APIs and web scraping, handling missing data, and performing\
    \ data transformation and cleaning.\n\n# Chapter 3: Indexing and Selecting Data\n"
  trans: "\n\n# 数据转换与清洗\n\n有效的数据预处理涉及数据转换和清洗这两个关键阶段。这些过程确保收集到的数据经过适当组织、保持一致且可靠，从而带来更好的分析和决策。进行这些初始步骤至关重要，因为它们会显著影响最终输出的准确性和质量。不完整或错误的数据可能导致错误的结论，并对结果产生负面影响。\n\
    \n在本示例中，我们将使用 `Customer_Churn_Modelling.csv` 数据集，假设它已加载到一个名为 `data` 的 DataFrame\
    \ 中。\n\n## 识别并处理缺失数据\n\n请参阅前一节关于如何使用 Pandas 处理缺失数据的内容。根据您的具体需求，应用 `dropna()` 或\
    \ `fillna()` 方法。\n\n## 重命名列（可选）\n\n如果您想为了更好的可读性或一致性而重命名列，可以使用 `rename()` 方法：\n\
    \n```\ndata = data.rename(columns={\n    'NumOfProducts': 'Number_of_Products',\n\
    \    'HasCrCard': 'Has_Credit_Card',\n    'IsActiveMember': 'Is_Active_Member',\n\
    \    'EstimatedSalary': 'Estimated_Salary'\n})\n```\n\n## 转换数据类型\n\n确保每列的数据类型适合进一步分析。您可以使用\
    \ `dtypes` 属性检查数据类型：\n\n```\nprint(data.dtypes)\n```\n\n如果您需要更改某列的数据类型，可以使用 `astype()`\
    \ 方法：\n\n```\ndata['Has_Credit_Card'] = data['Has_Credit_Card'].astype('bool')\n\
    data['Is_Active_Member'] = data['Is_Active_Member'].astype('bool')\n```\n\n##\
    \ 移除重复项\n\n使用 `duplicated()` 和 `drop_duplicates()` 方法检查并移除数据集中的任何重复行：\n\n```\n\
    duplicates = data.duplicated()\nprint(f'Number of duplicate rows: {duplicates.sum()}')\n\
    data = data.drop_duplicates()\n```\n\n## 归一化数值列\n\n归一化和标准化有助于将数值特征缩放到一个通用的范围或分布，这对某些机器学习算法很有用。\n\
    \n要归一化某列（将值缩放到 0 和 1 之间）：\n\n```\ndata['CreditScore'] = (data['CreditScore'] -\
    \ data['CreditScore'].min()) / (data['CreditScore'].max() - data['CreditScore'].min())\n\
    ```\n\n要标准化某列（将值缩放为均值为 0、标准差为 1）：\n\n```\ndata['Age'] = (data['Age'] - data['Age'].mean())\
    \ / data['Age'].std()\n```\n\n## 编码分类变量\n\n如果您打算将数据用于机器学习，可能需要将分类变量编码为数值。您可以使用独热编码或标签编码等技术。\n\
    \n对于独热编码，使用 `get_dummies()` 函数：\n\n```\ndata = pd.get_dummies(data, columns=['Geography',\
    \ 'Gender'])\n```\n\n对于标签编码，您可以使用 scikit-learn 中的 `LabelEncoder` 类：\n\n```\nfrom\
    \ sklearn.preprocessing import LabelEncoder\nencoder = LabelEncoder()\ndata['Surname']\
    \ = encoder.fit_transform(data['Surname'])\n```\n\n## 重排或删除列\n\n根据需要重排或删除列，以便更好地组织数据或移除不必要的特征：\n\
    \n```\n# 重排列\ndata = data[['RowNumber', 'CustomerId', 'Surname', 'CreditScore',\
    \ 'Age', 'Tenure', 'Balance', 'Number_of_Products', 'Has_Credit_Card', 'Is_Active_Member',\
    \ 'Estimated_Salary', 'Geography_France', 'Geography_Germany', 'Geography_Spain',\
    \ 'Gender_Female', 'Gender_Male', 'Exited']]\n\n# 删除不必要的列（例如 'RowNumber'、'CustomerId'、'Surname'\
    \ 可能与您的分析无关）\ndata = data.drop(columns=['RowNumber', 'CustomerId', 'Surname'])\n\
    ```\n\n## 验证更改\n\n执行数据转换和清洗后，通过检查数据来验证更改至关重要：\n\n```\nprint(data.head())\nprint(data.dtypes)\n\
    print(data.describe())\n```\n\n总之，您可以使用 Pandas 提供的各种方法来执行数据转换和清洗任务，例如处理缺失值、重命名列、转换数据类型、移除重复项、归一化或标准化数值列、编码分类变量，以及重排或删除列。这些步骤有助于确保数据准确、一致且结构良好，以便进行进一步分析或机器学习应用。\n\
    \n# 总结\n\n我们讨论了使用 Pandas 从不同文件格式读取数据。Pandas 可以读取多种格式，如 CSV、JSON、Excel、SQL 数据库等。我们演示了如何使用\
    \ `pd.read_json()` 和 `pd.read_excel()` 函数从 `Customer_Churn_Modelling.csv` 数据集以\
    \ JSON 和 Excel (XLS) 格式读取数据。\n\n接下来，我们介绍了将数据写入不同格式。Pandas 可以将 DataFrame 写入各种文件格式，包括\
    \ CSV、JSON、Excel 等。我们演示了如何使用 `to_json()` 和 `to_excel()` 方法将包含 `Customer_Churn_Modelling.csv`\
    \ 数据集的 DataFrame 写入 JSON 和 Excel 文件。\n\n随后，我们讨论了 Pandas 与数据库的交互。Pandas 允许您使用 `pd.read_sql()`\
    \ 和 `to_sql()` 函数执行数据库操作。我们演示了如何连接到 SQLite 数据库，使用 `pd.read_sql()` 从表中读取数据到 DataFrame，以及使用\
    \ `to_sql()` 方法将数据从 DataFrame 写入表中。\n\n然后，我们探讨了将 Web API 连接到 Pandas。通过使用 `requests`\
    \ 库从 API 获取实时数据并将其加载到 DataFrame 中，您可以操作和分析动态数据源。我们提供了一个从 JSONPlaceholder API 获取数据并使用\
    \ `pd.DataFrame()` 构造函数将其加载到 DataFrame 的示例。\n\n之后，我们讨论了使用 Beautiful Soup 进行网页抓取。通过从网站获取\
    \ HTML 内容，使用 Beautiful Soup 解析，提取结构化数据并将其加载到 DataFrame 中，您可以处理来自动态网页内容的数据。我们提供了一个从\
    \ World Coin Index 网站抓取表格数据并将其加载到 DataFrame 的示例。\n\n接下来，我们解释了如何在 Pandas 中处理缺失数据。`isna()`\
    \ 和 `isnull()` 方法有助于识别缺失值，而 `dropna()` 和 `fillna()` 方法则通过根据您的需求移除或填充缺失值来处理它们。\n\
    \n最后，我们介绍了使用 Pandas 进行数据转换和清洗。此过程包括处理缺失数据、重命名列、转换数据类型、移除重复项、归一化或标准化数值列、编码分类变量，以及重排或删除列。这些步骤确保数据准确、一致且结构良好，以便进行进一步分析或机器学习应用。\n\
    \n总体而言，本章涵盖了使用 Pandas 进行数据操作的各个方面，包括从不同格式读取和写入数据、数据库交互、连接 Web API 和网页抓取、处理缺失数据，以及执行数据转换和清洗。\n\
    \n# 第 3 章：索引与数据选择\n\n"
