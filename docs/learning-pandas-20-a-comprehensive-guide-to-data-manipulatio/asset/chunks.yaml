    \n# Convert existing columns to more efficient data types\ndf['column1'] = df['column1'].astype('int32')\n\
    df['column2'] = df['column2'].astype('category')\n```\n\n## Non-vectorized Operations\n\
    \n### Vectorized Pandas or NumPy operations\n\nWhenever possible, use vectorized\
    \ operations provided by Pandas and NumPy to perform calculations on entire columns\
    \ or DataFrames at once. These operations are optimized and significantly faster\
    \ than looping through rows.\n\n```python\n# Example of vectorized addition\n\
    df['sum_column'] = df['column1'] + df['column2']\n```\n\n### Using `apply()`\n\
    \nIf an operation cannot be easily vectorized, you can use the `apply()` method\
    \ to apply a custom function along a specific axis (rows or columns) of a DataFrame.\n\
