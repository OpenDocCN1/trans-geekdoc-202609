  fmt: '

    # Pandas Version History


    Pandas has a rich history of development, with numerous versions released over
    the years. Each version has introduced new features, performance improvements,
    and bug fixes. Below is a brief overview of the major version history of Pandas
    up to 1.3.x, followed by a detailed description of Pandas 2.0.


    ## Pandas 0.1.x (January 2011)


    The initial release of Pandas provided the foundation for `DataFrame` and `Series`
    data structures, along with basic I/O operations, time series functionality, and
    basic data manipulation capabilities.


    ## Pandas 0.2.x to 0.9.x (2011-2012)


    These versions introduced many new features, such as `MultiIndex`, pivot tables,
    and additional I/O support for various file formats like Excel and HDF5. The library
    underwent substantial improvements in performance, API stability, and documentation.


    ## Pandas 0.10.x to 0.23.x (2013-2018)


    During this period, Pandas continued to expand with new functionalities, including
    support for categorical data, window functions, and enhanced support for missing
    data. There were ongoing performance optimizations and refinements to the existing
    APIs.


    ## Pandas 0.24.x to 1.0.x (2019-2020)


    This phase saw the addition of the extension array interface, nullable integer
    and boolean data types, and improved support for custom data types. Pandas 1.0
    marked a major milestone in terms of API stability and maturity, deprecating older
    and less-used features while refining the library''s core functionality.


    ## Pandas 1.1.x to 1.3.x (2020-2021)


    These releases brought more performance improvements, additional I/O options,
    new string data types, and improved compatibility with other Python libraries
    like `Dask` and `CuPy`. The library''s documentation and testing infrastructure
    also saw significant enhancements.


    ## Pandas 2.0 (2023)


    As a major release, Pandas 2.0 brings significant changes to the library, focusing
    on improving performance, addressing long-standing issues, and providing better
    support for modern data analysis requirements. Some key features and improvements
    in Pandas 2.0 include:


    ### Performance improvements


    Pandas 2.0 features substantial performance improvements, particularly for large
    datasets. The library leverages advancements in array computing, modern hardware
    capabilities, and parallel processing to deliver faster and more efficient data
    manipulation and analysis operations.


    ### Enhanced type system


    The type system in Pandas 2.0 has been refined to provide better support for nullable
    data types, user-defined data types, and extension arrays. This allows users to
    work with a wider range of data types and customize Pandas to better suit their
    specific needs.


    ### New APIs and functionality


    Pandas 2.0 introduces several new APIs and features that make it easier to manipulate
    and analyze data. This includes new methods for working with hierarchical data,
    advanced window functions, and improved support for working with geospatial and
    time series data.


    ### Improved interoperability


    Pandas 2.0 aims to provide better interoperability with other Python libraries
    and tools, making it easier to integrate Pandas into a data science and analytics
    workflow. This includes enhanced compatibility with libraries like `Dask` for
    parallel and distributed computing, as well as better integration with visualization
    libraries like `Matplotlib`, `Seaborn`, and `Plotly`.


    ### Simplified and more consistent API


    With Pandas 2.0, the library''s API has been simplified and made more consistent.
    This makes it easier for users to learn and work with Pandas, and it reduces the
    chances of encountering unexpected behavior.


    ### Modernized codebase


    The Pandas 2.0 codebase has been modernized and refactored to improve maintainability,
    readability, and extensibility. This includes removing deprecated features and
    code, adopting modern Python language features, and embracing best practices for
    software development. As a result, Pandas 2.0 is more robust and easier to contribute
    to for the community of developers.


    ### Enhanced documentation and tutorials


    The documentation and learning resources for Pandas 2.0 have been expanded and
    improved, making it easier for users to learn and understand the library''s features
    and capabilities. The updated documentation includes more examples, clearer explanations,
    and a more intuitive organization of content.


    ### Improved error messages and debugging


    Pandas 2.0 provides more informative error messages and better debugging support,
    helping users quickly identify and resolve issues in their code. This includes
    more descriptive error messages, better tracebacks, and improved support for using
    debuggers like `pdb`.


    ### New deprecation policy


    With the release of Pandas 2.0, the library has adopted a more structured deprecation
    policy, providing users with a clear roadmap for future changes and a more predictable
    upgrade process. This includes more transparent communication of upcoming changes,
    a more gradual deprecation process, and a commitment to maintaining backward compatibility
    for a specified period.


    ### Community-driven development


    The development of Pandas 2.0 has been a collaborative effort, with input and
    contributions from the wider Pandas community. This has resulted in a more diverse
    set of features and improvements, addressing the needs of a broader range of users
    and use cases.


    Pandas 2.0 represents a significant evolution of the library, building on its
    strengths while addressing long-standing limitations and challenges. The result
    is a more powerful, flexible, and user-friendly tool for data manipulation and
    analysis in Python. With its improved performance, enhanced type system, new APIs,
    better interoperability, and modernized codebase, Pandas 2.0 is well-suited to
    tackle the increasingly complex data analysis requirements of today''s data-driven
    world.

    '
  trans: '


    # Pandas 版本历史


    Pandas 拥有丰富的开发历史，多年来发布了众多版本。每个版本都引入了新特性、性能改进和错误修复。以下是截至 1.3.x 版本的 Pandas 主要版本历史简述，随后是
    Pandas 2.0 的详细介绍。


    ## Pandas 0.1.x（2011 年 1 月）


    Pandas 的初始版本为 `DataFrame` 和 `Series` 数据结构奠定了基础，同时提供了基本的 I/O 操作、时间序列功能和基础数据处理能力。


    ## Pandas 0.2.x 至 0.9.x（2011-2012 年）


    这些版本引入了许多新特性，例如 `MultiIndex`、透视表，以及对 Excel 和 HDF5 等多种文件格式的额外 I/O 支持。该库在性能、API
    稳定性和文档方面进行了大幅改进。


    ## Pandas 0.10.x 至 0.23.x（2013-2018 年）


    在此期间，Pandas 持续扩展新功能，包括对分类数据的支持、窗口函数，以及对缺失数据的增强支持。现有 API 经历了持续的性能优化和改进。


    ## Pandas 0.24.x 至 1.0.x（2019-2020 年）


    这一阶段增加了扩展数组接口、可空整数和布尔数据类型，并改进了对自定义数据类型的支持。Pandas 1.0 在 API 稳定性和成熟度方面标志着一个重要里程碑，弃用了旧有和不常用的特性，同时优化了库的核心功能。


    ## Pandas 1.1.x 至 1.3.x（2020-2021 年）


    这些版本带来了更多性能改进、额外的 I/O 选项、新的字符串数据类型，以及与 `Dask` 和 `CuPy` 等其他 Python 库的改进兼容性。库的文档和测试基础设施也得到了显著增强。


    ## Pandas 2.0（2023 年）


    作为一个主要版本，Pandas 2.0 给库带来了重大变革，重点在于提升性能、解决长期存在的问题，并为现代数据分析需求提供更好的支持。Pandas 2.0
    的一些关键特性和改进包括：


    ### 性能改进


    Pandas 2.0 具有显著的性能提升，特别是在处理大型数据集时。该库利用数组计算的进步、现代硬件能力和并行处理，提供更快、更高效的数据操作和分析运算。


    ### 增强的类型系统


    Pandas 2.0 中的类型系统经过优化，为可空数据类型、用户定义数据类型和扩展数组提供了更好的支持。这使用户能够处理更广泛的数据类型，并定制 Pandas
    以更好地满足其特定需求。


    ### 新 API 和功能


    Pandas 2.0 引入了多个新 API 和特性，使数据操作和分析更加容易。这包括用于处理层级数据的新方法、高级窗口函数，以及对地理空间和时间序列数据处理的改进支持。


    ### 改进的互操作性


    Pandas 2.0 旨在提供与其他 Python 库和工具更好的互操作性，使 Pandas 更易于集成到数据科学和分析工作流中。这包括与 `Dask` 等库的增强兼容性（用于并行和分布式计算），以及与
    `Matplotlib`、`Seaborn` 和 `Plotly` 等可视化库的更好集成。


    ### 简化且更一致的 API


    随着 Pandas 2.0 的发布，库的 API 已被简化并变得更加一致。这使得用户更容易学习和使用 Pandas，并减少了遇到意外行为的可能性。


    ### 现代化的代码库


    Pandas 2.0 的代码库已现代化并重构，以提高可维护性、可读性和可扩展性。这包括移除已弃用的特性和代码、采用现代 Python 语言特性，以及拥抱软件开发的最佳实践。因此，Pandas
    2.0 更加健壮，也更易于开发者社区贡献代码。


    ### 增强的文档和教程


    Pandas 2.0 的文档和学习资源得到了扩展和改进，使用户更容易学习和理解库的特性与能力。更新后的文档包含更多示例、更清晰的解释，以及更直观的内容组织。


    ### 改进的错误消息和调试


    Pandas 2.0 提供了更具信息量的错误消息和更好的调试支持，帮助用户快速识别和解决代码中的问题。这包括更具描述性的错误消息、更好的回溯信息，以及对 `pdb`
    等调试器的改进支持。


    ### 新的弃用策略


    随着 Pandas 2.0 的发布，该库采用了更结构化的弃用策略，为用户提供了清晰的未来变更路线图和更可预测的升级流程。这包括对即将发生变更的更透明沟通、更渐进的弃用过程，以及承诺在特定时期内保持向后兼容性。


    ### 社区驱动的开发


    Pandas 2.0 的开发是一项协作工作，汇集了更广泛的 Pandas 社区的意见和贡献。这带来了更多样化的特性和改进，满足了更广泛用户和用例的需求。


    Pandas 2.0 代表了该库的重大演进，它在巩固优势的同时，解决了长期存在的局限性和挑战。其结果是一个更强大、灵活且用户友好的 Python 数据操作和分析工具。凭借改进的性能、增强的类型系统、新
    API、更好的互操作性和现代化的代码库，Pandas 2.0 非常适合应对当今数据驱动世界中日益复杂的数据分析需求。


    '
