    \n最佳实践是尽早删除分析中不需要的任何列或行。这能减少内存使用并加快后续操作。\n\n```python\n# 删除不必要的列\ndf = df.drop(['unnecessary_column1',\
    \ 'unnecessary_column2'], axis=1)\n\n# 基于条件删除不必要的行\ndf = df[df['useful_column']\
    \ > threshold]\n```\n\n### 使用合适的数据类型\n\n读取数据时，Pandas 会自动推断每列的数据类型，这有时会导致内存使用效率低下。你可以通过指定正确的数据类型或将列转换为更高效的类型来减少内存使用。\n\
    \n```python\n# 读取数据时指定数据类型\ndtypes = {'column1': 'int32', 'column2': 'category'}\n\
    df = pd.read_csv('dataset.csv', dtype=dtypes)\n\n# 将现有列转换为更高效的数据类型\ndf['column1']\
    \ = df['column1'].astype('int32')\ndf['column2'] = df['column2'].astype('category')\n\
    ```\n\n## 非向量化操作\n\n### 向量化的 Pandas 或 NumPy 操作\n\n只要可能，请使用 Pandas 和 NumPy 提供的向量化操作一次性对整列或\
    \ DataFrame 执行计算。这些操作经过优化，比遍历行要快得多。\n\n```python\n# 向量化加法示例\ndf['sum_column']\
    \ = df['column1'] + df['column2']\n```\n\n### 使用 `apply()`\n\n如果某操作难以轻松向量化，可以使用\
    \ `apply()` 方法沿 DataFrame 的特定轴（行或列）应用自定义函数。\n\n```python\ndef custom_function(row):\n\
    \    # 对行元素执行计算\n    return result\n\ndf['new_column'] = df.apply(custom_function,\
    \ axis=1)\n```\n\n### 使用 Cython 或 Numba\n\n如果非向量化操作仍存在性能问题，请考虑使用 Cython 或 Numba\
    \ 优化自定义函数。这两种工具均可通过将 Python 代码编译为本机机器码或 C 代码，提供显著的速度提升。\n\n## 低效的操作链\n\n### 使用\
    \ `inplace` 参数\n\n许多 Pandas 方法提供 `inplace` 参数，允许你就地修改 DataFrame 而无需创建新对象。\n\n\
    ```python\ndf.drop(['column1', 'column2'], axis=1, inplace=True)\n```\n\n### 使用\
    \ `query()` 或 `eval()`\n\nPandas 提供 `query()` 和 `eval()` 方法，允许你在单个步骤中执行多个操作，减少创建的中间对象数量。这些方法比链式操作更快且更节省内存。\n\
    \n```python\n# 使用 query() 在一步中筛选并计算新列\ndf = df.query('column1 > 100 and column2\
    \ < 200')\ndf['new_column'] = df['column1'] * df['column2']\n\n# 使用 eval() 在一步中执行多个计算\n\
    df['new_column'] = df.eval('column1 * column2')\n```\n\n## 缓慢的 Groupby 和聚合操作\n\
    \n### 使用 `sort=False`\n\n默认情况下，执行 `groupby()` 操作时 Pandas 会对分组进行排序，这会拖慢过程。你可以通过设置\
    \ `sort=False` 来禁用排序。\n\n```python\ngrouped = df.groupby('column1', sort=False)\n\
    ```\n\n### 使用 `agg()` 方法\n\n你可以使用 `agg()` 方法在一步中执行多个聚合，而不必链接多个聚合操作。\n\n```python\n\
    result = grouped.agg({\n    'column2': ['sum', 'mean'],\n    'column3': ['max',\
    \ 'min']\n})\n```\n\n## 缓慢的读取和写入操作\n\n### 使用 `compression`\n\n读取或写入数据时，可以使用 `compression`\
    \ 参数指定压缩算法，以减小文件大小和 I/O 时间。\n\n```python\ndf = pd.read_csv('compressed_data.csv.gz',\
    \ compression='gzip')\ndf.to_csv('compressed_output.csv.gz', compression='gzip')\n\
    ```\n\n### 二进制格式\n\n除了使用 CSV 等基于文本的格式，还可以考虑使用 Parquet 等二进制格式来读写大型 DataFrame。二进制格式在存储和\
    \ I/O 性能方面更高效。\n\n```python\ndf = pd.read_parquet('data.parquet')\ndf.to_parquet('output.parquet')\n\
    ```\n\n通过采取这些切实可行的步骤，你可以解决 Pandas 中的常见性能问题，并针对大型数据集或复杂操作优化数据分析任务。使用 Pandas 时请牢记这些技巧，以确保代码高效且性能良好。\n\
    \n## 总结\n\n在本章中，我们讨论了 Pandas 2.0 中的内存和计算效率，重点关注了针对数据分析任务优化性能的重要性。我们还探讨了 Dask 作为\
    \ Pandas 并行和分布式计算的解决方案，以及如何在给定的 `customer_chrn_modelling` 数据库上高效执行查询和筛选。接下来，我们了解了向量化操作，这对优化\
    \ Pandas 性能至关重要。这些操作允许你在整个数组或 DataFrame 上执行逐元素计算，而无需显式循环，从而产生更快、更高效的代码。我们还讨论了将这些操作应用到给定数据库的方法。\n\
    \n随后，我们探讨了数据分析过程中可能出现的速度问题，以及 Cython 和 Numba 如何帮助解决这些问题。Cython 和 Numba 均可通过将 Python\
    \ 代码编译为本机机器码或 C 代码来加速性能。我们演示了安装和配置 Cython 与 Numba 的过程，并展示了如何用它们优化一个简单示例。\n\n最后，我们讨论了使用\
    \ Pandas 时可能出现的常见性能问题及其切实可行的解决方法。这些问题包括内存使用、非向量化操作、低效的操作链、缓慢的 groupby 和聚合操作、低效的合并或连接操作，以及缓慢的读取和写入操作。通过采用分块加载数据、使用合适的数据类型、向量化操作、使用\
    \ `inplace` 参数、优化 `merge()` 方法、使用 Dask 以及选择高效文件格式等技术，你可以显著提高使用 Pandas 进行数据分析任务的效率和速度。\n\
    \n# 第 7 章：Pandas 2.0 机器学习\n\n"
