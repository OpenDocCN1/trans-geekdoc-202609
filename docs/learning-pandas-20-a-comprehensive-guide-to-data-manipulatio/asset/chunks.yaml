  fmt: "\n# Feature Engineering with Pandas 2.0\n\nFeature engineering is the process\
    \ of creating new features or transforming existing features in a dataset to improve\
    \ the performance and predictive power of machine learning models. This process\
    \ involves using domain knowledge, statistical techniques, and data analysis to\
    \ extract more information from the raw data and provide meaningful input to machine\
    \ learning algorithms. Effective feature engineering can lead to better model\
    \ performance, reduced complexity, and improved interpretability.\n\n## Advantages\
    \ of Feature Engineering\n\n- **Improved model performance**: Well-engineered\
    \ features can capture important relationships and patterns in the data, making\
    \ it easier for machine learning models to learn and generalize to new, unseen\
    \ data.\n- **Reduced complexity**: By creating features that better represent\
    \ the underlying structure of the data, you can often reduce the complexity of\
    \ the machine learning model, which can lead to faster training times and better\
    \ performance.\n- **Interpretability**: Creating meaningful features can make\
    \ the resulting model more interpretable, which is important in certain applications\
    \ where understanding the model's decision-making process is essential.\n- **Handling\
    \ categorical data**: Machine learning models typically require numerical input.\
    \ Feature engineering techniques such as one-hot encoding or label encoding can\
    \ be used to convert categorical data into numerical values.\n- **Handling missing\
    \ values**: Feature engineering can help in dealing with missing values, either\
    \ by creating new features that capture the missingness pattern or by imputing\
    \ missing values based on the relationships between features.\n- **Dimensionality\
    \ reduction**: Techniques such as Principal Component Analysis (PCA) or other\
    \ feature extraction methods can help reduce the number of features in a dataset,\
    \ alleviating the curse of dimensionality and improving model performance.\n\n\
    ## Role of Pandas in Feature Engineering\n\nPandas is a powerful data manipulation\
    \ library that provides various functions and tools that make it easier to perform\
    \ feature engineering tasks. Some of the key functions and their use cases in\
    \ feature engineering are:\n\n### Creating new features\n\nPandas allows you to\
    \ create new features by applying mathematical operations, combining existing\
    \ features, or using custom functions.\n\n```python\n# Create a new feature by\
    \ applying a mathematical operation to an existing feature\ndf['new_feature']\
    \ = df['existing_feature'] ** 2\n\n# Create a new feature by combining two or\
    \ more existing features\ndf['new_feature'] = df['feature1'] * df['feature2']\n\
    \n# Create a new feature using a custom function\ndef custom_function(x):\n  \
    \  return x * 2\n\ndf['new_feature'] = df['existing_feature'].apply(custom_function)\n\
    ```\n\n### Encoding categorical variables\n\nPandas provides functions like `get_dummies()`\
    \ and `factorize()` to convert categorical data into numerical values using one-hot\
    \ encoding or label encoding.\n\n```python\n# One-hot encoding\ndf = pd.get_dummies(df,\
    \ columns=['categorical_column'])\n\n# Label encoding\ndf['categorical_column'],\
    \ _ = pd.factorize(df['categorical_column'])\n```\n\n### Binning and discretization\n\
    \nYou can use Pandas functions like `cut()` and `qcut()` to discretize continuous\
    \ variables into bins or categories, which can help capture non-linear relationships\
    \ and reduce the impact of outliers.\n\n```python\n# Binning using equal-width\
    \ bins\ndf['binned_column'] = pd.cut(df['continuous_column'], bins=10)\n\n# Binning\
    \ using equal-frequency bins\ndf['binned_column'] = pd.qcut(df['continuous_column'],\
    \ q=10)\n```\n\n### Handling missing values\n\nPandas provides functions like\
    \ `fillna()`, `interpolate()`, and `dropna()` to handle missing values in a dataset\
    \ through various techniques such as filling with a default value, interpolation,\
    \ or dropping rows or columns with missing values.\n\n```python\n# Fill missing\
    \ values with a default value (e.g., the mean of the column)\ndf['column_with_missing_values']\
    \ = df['column_with_missing_values'].fillna(df['column_with_missing_values'].mean())\n\
    \n# Interpolate missing values\ndf.interpolate(method='linear', inplace=True)\n\
    \n# Drop rows with missing values\ndf.dropna(inplace=True)\n\n# Drop columns with\
    \ a high percentage of missing values\ndf.drop('column_with_high_missing_percentage',\
    \ axis=1, inplace=True)\n```\n\n### Feature scaling\n\nPandas can be used in conjunction\
    \ with Scikit-learn's preprocessing tools to scale or normalize features, ensuring\
    \ that all features have the same scale and preventing issues related to the scale\
    \ of the input features.\n\n```python\nfrom sklearn.preprocessing import MinMaxScaler,\
    \ StandardScaler\n\n# Normalization (Min-Max scaling)\nmin_max_scaler = MinMaxScaler()\n\
    df[['numerical_column1', 'numerical_column2']] = min_max_scaler.fit_transform(df[['numerical_column1',\
    \ 'numerical_column2']])\n\n# Standardization (Z-score scaling)\nstandard_scaler\
    \ = StandardScaler()\ndf[['numerical_column1', 'numerical_column2']] = standard_scaler.fit_transform(df[['numerical_column1',\
    \ 'numerical_column2']])\n```\n\n### Feature selection\n\nPandas can be used to\
    \ compute correlation coefficients or other metrics that can help identify and\
    \ remove highly correlated or irrelevant features, which can improve model performance\
    \ and reduce overfitting.\n\n```python\n# Calculate the correlation matrix\ncorr_matrix\
    \ = df.corr()\n\n# Identify highly correlated features\nhighly_correlated_features\
    \ = [column for column in corr_matrix.columns if any(abs(corr_matrix[column])\
    \ > 0.9)]\n\n# Drop highly correlated features\ndf.drop(highly_correlated_features,\
    \ axis=1, inplace=True)\n```\n\nIn summary, Pandas is an essential tool for feature\
    \ engineering in machine learning, providing a wide range of functions and tools\
    \ to create, transform, and manipulate features. By using Pandas effectively,\
    \ you can extract more meaningful information from your data and improve the performance\
    \ of your machine learning models.\n"
  trans: "\n# 使用 Pandas 2.0 进行特征工程\n\n特征工程是指在数据集中创建新特征或转换现有特征，以提高机器学习模型的性能和预测能力的过程。该过程涉及利用领域知识、统计技术和数据分析，从原始数据中提取更多信息，并为机器学习算法提供有意义的输入。有效的特征工程可带来更好的模型性能、降低复杂度并提高可解释性。\n\
    \n## 特征工程的优势\n\n- **提升模型性能**：精心设计的特征能够捕捉数据中的重要关系和模式，使机器学习模型更容易学习并泛化到新的、未见过的数据。\n\
    - **降低复杂度**：通过创建能更好地代表数据底层结构的特征，通常可以降低机器学习模型的复杂度，从而缩短训练时间并提升性能。\n- **可解释性**：创建有意义的特征可以使最终模型更具可解释性，这在理解模型决策过程至关重要的特定应用中非常重要。\n\
    - **处理分类数据**：机器学习模型通常需要数值输入。特征工程技术（如独热编码或标签编码）可用于将分类数据转换为数值。\n- **处理缺失值**：特征工程有助于处理缺失值，既可以通过创建捕捉缺失模式的新特征，也可以基于特征间的关系插补缺失值。\n\
    - **降维**：主成分分析（PCA）或其他特征提取方法等技术有助于减少数据集中的特征数量，缓解维度灾难并提高模型性能。\n\n## Pandas 在特征工程中的作用\n\
    \nPandas 是一个功能强大的数据操作库，提供了各种函数和工具，使特征工程任务更易于执行。以下是特征工程中的一些关键函数及其用例：\n\n### 创建新特征\n\
    \nPandas 允许您通过对现有特征应用数学运算、组合现有特征或使用自定义函数来创建新特征。\n\n```python\n# 通过对现有特征应用数学运算来创建新特征\n\
    df['new_feature'] = df['existing_feature'] ** 2\n\n# 通过组合两个或多个现有特征来创建新特征\ndf['new_feature']\
    \ = df['feature1'] * df['feature2']\n\n# 使用自定义函数创建新特征\ndef custom_function(x):\n\
    \    return x * 2\n\ndf['new_feature'] = df['existing_feature'].apply(custom_function)\n\
    ```\n\n### 编码分类变量\n\nPandas 提供了 `get_dummies()` 和 `factorize()` 等函数，使用独热编码或标签编码将分类数据转换为数值。\n\
    \n```python\n# 独热编码\ndf = pd.get_dummies(df, columns=['categorical_column'])\n\
    \n# 标签编码\ndf['categorical_column'], _ = pd.factorize(df['categorical_column'])\n\
    ```\n\n### 分箱与离散化\n\n您可以使用 Pandas 的 `cut()` 和 `qcut()` 等函数将连续变量离散化为分箱或类别，这有助于捕捉非线性关系并减少异常值的影响。\n\
    \n```python\n# 使用等宽分箱\ndf['binned_column'] = pd.cut(df['continuous_column'], bins=10)\n\
    \n# 使用等频分箱\ndf['binned_column'] = pd.qcut(df['continuous_column'], q=10)\n```\n\
    \n### 处理缺失值\n\nPandas 提供了 `fillna()`、`interpolate()` 和 `dropna()` 等函数，通过填充默认值、插值或删除含缺失值的行或列等多种技术来处理数据集中的缺失值。\n\
    \n```python\n# 用默认值填充缺失值（例如列的平均值）\ndf['column_with_missing_values'] = df['column_with_missing_values'].fillna(df['column_with_missing_values'].mean())\n\
    \n# 插值填充缺失值\ndf.interpolate(method='linear', inplace=True)\n\n# 删除含缺失值的行\ndf.dropna(inplace=True)\n\
    \n# 删除缺失值比例高的列\ndf.drop('column_with_high_missing_percentage', axis=1, inplace=True)\n\
    ```\n\n### 特征缩放\n\nPandas 可结合 Scikit-learn 的预处理工具对特征进行缩放或归一化，确保所有特征具有相同的尺度，防止因输入特征尺度不同而导致的问题。\n\
    \n```python\nfrom sklearn.preprocessing import MinMaxScaler, StandardScaler\n\n\
    # 归一化（最小-最大缩放）\nmin_max_scaler = MinMaxScaler()\ndf[['numerical_column1', 'numerical_column2']]\
    \ = min_max_scaler.fit_transform(df[['numerical_column1', 'numerical_column2']])\n\
    \n# 标准化（Z-score 缩放）\nstandard_scaler = StandardScaler()\ndf[['numerical_column1',\
    \ 'numerical_column2']] = standard_scaler.fit_transform(df[['numerical_column1',\
    \ 'numerical_column2']])\n```\n\n### 特征选择\n\nPandas 可用于计算相关系数或其他指标，以帮助识别并移除高度相关或无关的特征，从而提高模型性能并减少过拟合。\n\
    \n```python\n# 计算相关性矩阵\ncorr_matrix = df.corr()\n\n# 识别高度相关的特征\nhighly_correlated_features\
    \ = [column for column in corr_matrix.columns if any(abs(corr_matrix[column])\
    \ > 0.9)]\n\n# 删除高度相关的特征\ndf.drop(highly_correlated_features, axis=1, inplace=True)\n\
    ```\n\n总之，Pandas 是机器学习特征工程中必不可少的工具，它提供了广泛的函数和工具来创建、转换和操作特征。通过有效使用 Pandas，您可以从数据中提取更有意义的信息，并提升机器学习模型的性能。\n\
    \n"
