  fmt: "\n# Pandas Data Structures\n\nPandas provides two primary data structures\
    \ for data manipulation and analysis: `Series` and `DataFrame`. Both of these\
    \ data structures are built on top of NumPy arrays, which enable efficient and\
    \ high-performance operations. The following is a detailed explanation of `Series`\
    \ and `DataFrame` and how they work.\n\n## Series\n\nA `Series` is a one-dimensional,\
    \ labeled array capable of holding any data type, including integers, floats,\
    \ strings, and Python objects. The basic structure of a `Series` consists of two\
    \ components: data and index.\n\n### Data\n\nThe data in a `Series` is a one-dimensional\
    \ NumPy array that holds the actual data values. The data can be of various types,\
    \ such as integers, floats, or strings.\n\n### Index\n\nThe index is an array-like\
    \ structure that labels each element in the data array. By default, the index\
    \ is a zero-based integer sequence, but you can also provide custom labels for\
    \ the index. This makes it easy to reference and manipulate data elements based\
    \ on their labels.\n\nTo create a `Series`, you can use the `pd.Series()` constructor\
    \ and pass in a list, dictionary, or NumPy array as data. You can also provide\
    \ an optional `index` parameter to specify custom labels for the data elements.\n\
    \n## DataFrame\n\nA `DataFrame` is a two-dimensional, size-mutable, and heterogeneous\
    \ tabular data structure with labeled axes (rows and columns). It can be thought\
    \ of as a collection of `Series` objects, where each column is a `Series`. `DataFrame`s\
    \ are designed to handle a wide variety of data types, making them versatile and\
    \ powerful tools for data manipulation and analysis.\n\nThe basic structure of\
    \ a `DataFrame` consists of three components: data, index, and columns.\n\n###\
    \ Data\n\nThe data in a `DataFrame` is stored as a collection of one or more `Series`\
    \ objects, where each column represents a separate `Series`. The data in each\
    \ `Series` can be of various types, such as integers, floats, or strings.\n\n\
    ### Index\n\nThe index is an array-like structure that labels each row in the\
    \ `DataFrame`. Like the `Series` index, the `DataFrame` index can be a zero-based\
    \ integer sequence or have custom labels.\n\n### Columns\n\nThe columns are an\
    \ array-like structure that labels each column in the `DataFrame`. Column labels\
    \ are used to reference and manipulate specific columns in the `DataFrame`.\n\n\
    To create a `DataFrame`, you can use the `pd.DataFrame()` constructor and pass\
    \ in a variety of data types, such as a dictionary, a list of dictionaries, a\
    \ 2D NumPy array, or even a list of `Series`. You can also provide optional `index`\
    \ and `columns` parameters to specify custom row and column labels.\n\nBoth `Series`\
    \ and `DataFrame` provide a wide range of methods and functionality for data manipulation\
    \ and analysis. These include:\n\n*   **Data selection**: You can select specific\
    \ rows, columns, or elements in a `DataFrame` or `Series` using indexing, slicing,\
    \ and boolean conditions.\n*   **Data cleaning**: You can handle missing data,\
    \ drop unwanted rows or columns, and replace specific values in a `DataFrame`\
    \ or `Series`.\n*   **Data transformation**: You can apply functions to elements\
    \ in a `DataFrame` or `Series`, create new columns, or reshape the data structure.\n\
    *   **Data aggregation and summarization**: You can perform various aggregation\
    \ functions, like `sum`, `mean`, or `count`, on a `DataFrame` or `Series`. You\
    \ can also use the `GroupBy` functionality to group data based on specific criteria\
    \ and perform aggregation operations on each group.\n*   **Sorting and ranking**:\
    \ You can sort a `DataFrame` or `Series` based on index or column values, and\
    \ rank data elements based on specific criteria.\n*   **Time series functionality**:\
    \ You can work with time series data, resample data at different frequencies,\
    \ and perform rolling window calculations on a `DataFrame` or `Series`.\n\nBy\
    \ understanding the structure and functionality of `Series` and `DataFrame`, you\
    \ can effectively manipulate and analyze data in Pandas, allowing you to tackle\
    \ a wide range of data-related tasks.\n\n# Load and Modify Dataset\n\nTo access\
    \ and modify the data from the provided CSV file, follow these step-by-step instructions:\n\
    \n## Download CSV File\n\nFirst, download the `Customer_Churn_Modelling.csv` file\
    \ from the GitHub repository to your local machine. You can do this by visiting\
    \ the following URL in your web browser:\n\n[https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv](https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv)\n\
    \nRight-click on the page and select \"Save As\" to save the file to your desired\
    \ location.\n\n## Load Data\n\nTo load the data from the CSV file, you'll need\
    \ to use the `pd.read_csv()` function in Pandas:\n\n```python\nimport pandas as\
    \ pd\n\n# Replace 'path/to/your/csv' with the actual file path on your local machine\n\
    file_path = 'path/to/your/csv/Customer_Churn_Modelling.csv'\ndata = pd.read_csv(file_path)\n\
    ```\n\n## Inspect the Data\n\nBefore modifying the data, it's essential to understand\
    \ its structure and contents. You can use various Pandas functions to inspect\
    \ the `DataFrame`:\n\n```python\n# Display the first few rows of the DataFrame\n\
    print(data.head())\n\n# Display the shape (number of rows and columns) of the\
    \ DataFrame\nprint(data.shape)\n\n# Display the data types of each column in the\
    \ DataFrame\nprint(data.dtypes)\n\n# Display summary statistics for numerical\
    \ columns\nprint(data.describe())\n```\n\n## Access and Modify Data\n\nNow that\
    \ you have an understanding of the data, you can access and modify it using various\
    \ Pandas functions and methods. The following are some examples:\n\n### Select\
    \ specific columns\n\n```python\n# Select the 'Surname' column\nsurname = data['Surname']\n\
    \n# Select multiple columns, like 'CreditScore' and 'Age'\nselected_columns =\
