- raw: 'Text Data Cleaning and Preprocessing Working with text data is an important
    part of data analysis, as many datasets contain textual information that needs
    to be processed and analyzed. Text data can come in many different forms, such
    as customer reviews, social media posts, or even medical records. In data analysis,
    working with text data involves a number of tasks, including cleaning and preprocessing
    the data, extracting relevant information, and analyzing patterns and trends within
    the data. To accomplish these tasks, data analysts often use specialized tools
    and techniques that are designed specifically for working with text data. One
    of the most powerful tools for working with text data in Python is the Pandas
    library. Pandas provides a number of string methods that are specifically designed
    for working with text data in a DataFrame or Series. These string methods make
    it easy to manipulate and analyze text data, allowing data analysts to quickly
    and easily extract relevant information and gain insights from their data. The
    following are some of the most commonly used string methods in Pandas for working
    with text data: str.contains() The str.contains() method is used to check whether
    a string contains a specified substring and returns a Boolean value. The given
    below is an example of how to use it: import pandas as pd \# create a sample DataFrame
    df = pd.DataFrame({''text'': \[''hello world'', ''python is awesome'', ''data
    science is cool''\]}) \# check whether the ''text'' column contains the substring
    ''cool'' df\[''contains\_cool''\] = df\[''text''\].str.contains(''cool'') \# display
    the updated DataFrame print(df) Output:                    text  contains\_cool
    0           hello world          False 1      python is awesome         False
    2  data science is cool          True As you can see, the str.contains() method
    has added a new column to the DataFrame that indicates whether each row in the
    ''text'' column contains the substring ''cool'' or not. str.startswith() The str.startswith()
    method is used to check whether a string starts with a specified substring and
    returns a Boolean value. The given below is an example of how to use it: import
    pandas as pd \# create a sample DataFrame df = pd.DataFrame({''text'': \[''hello
    world'', ''python is awesome'', ''data science is cool''\]}) \# check whether
    the ''text'' column starts with the substring ''hello'' df\[''starts\_with\_hello''\]
    = df\[''text''\].str.startswith(''hello'') \# display the updated DataFrame print(df)
    Output:                    text  starts\_with\_hello 0           hello world  
                True 1      python is awesome             False 2  data science is
    cool             False As you can see, the str.startswith() method has added a
    new column to the DataFrame that indicates whether each row in the ''text'' column
    starts with the substring ''hello'' or not. str.endswith() The str.endswith()
    method is used to check whether a string ends with a specified substring and returns
    a Boolean value. The given below is an example of how to use it: import pandas
    as pd \# create a sample DataFrame df = pd.DataFrame({''text'': \[''hello world'',
    ''python is awesome'', ''data science is cool''\]}) \# check whether the ''text''
    column ends with the substring ''world'' df\[''ends\_with\_world''\] = df\[''text''\].str.endswith(''world'')
    \# display the updated DataFrame print(df) Output:                    text  ends\_with\_world
    0           hello world             True 1      python is awesome            False
    2  data science is cool            False As you can see, the str.endswith() method
    has added a new column to the DataFrame that indicates whether each row in the
    ''text'' column ends with the substring ''world'' or not. str.split() The str.split()
    method is used to split a string into a list of substrings based on a specified
    separator. The given below demonstrates an example of how to use it: import pandas
    as pd \# create a sample DataFrame df = pd.DataFrame({''text'': \[''hello,world'',
    ''python,is,awesome'', ''data,science,is,cool''\]}) \# split the ''text'' column
    into a list of substrings using a comma as the separator df\[''text\_list''\]
    = df\[''text''\].str.split('','') \# display the updated DataFrame print(df) Output:   
                     text                        text\_list 0            hello,world
                     \[hello, world\] 1      python,is,awesome          \[python,
    As we can see from the previous example, the str.split() method has split the
    ''text'' column into a list of substrings based on the comma separator. The resulting
    list is then stored in a new column called ''text\_list''. str.strip() The str.strip()
    method is used to remove leading and trailing whitespace from a string. The given
    below demonstrates an example of how to use it: import pandas as pd \# create
    a sample DataFrame df = pd.DataFrame({''text'': \[''   hello world   '', ''  python
    is awesome  '', ''  data science is cool  ''\]}) \# remove leading and trailing
    whitespace from the ''text'' column df\[''text\_stripped''\] = df\[''text''\].str.strip()
    \# display the updated DataFrame print(df) Output:                       text
             text\_stripped 0        hello world                   hello world 1  
