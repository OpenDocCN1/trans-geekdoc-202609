- raw: "Merging and Joining DataFrames In Pandas, the process of combining two or\
    \ more DataFrames based on common columns or indexes can be achieved through merging\
    \ and joining. These operations play a critical role in managing multiple related\
    \ datasets, allowing for efficient data analysis and manipulation. By merging\
    \ DataFrames, data can be combined based on shared columns, resulting in a single\
    \ DataFrame that includes all the relevant information. Joining DataFrames, on\
    \ the other hand, enables the combination of two or more DataFrames based on their\
    \ indexes. Both of these techniques can help simplify data management, improve\
    \ data quality, and provide a better understanding of the relationships between\
    \ datasets. Therefore, understanding how to merge and join DataFrames in Pandas\
    \ is an important skill for data analysts and scientists. For illustration purposes,\
    \ let us assume you have another dataset containing customer income data. We'll\
    \ create a small DataFrame called customer\\_income with the same 'CustomerId'\
    \ column as the data DataFrame: import pandas as pd customer\\_income = pd.DataFrame({\
    \     'CustomerId': \\[15745662, 15734523, 15698723\\],     'AnnualIncome': \\\
    [55000, 68000, 45000\\] }) Merging DataFrames using merge() Function The merge()\
    \ function combines DataFrames based on common columns. By default, it performs\
    \ an inner join, which means that only rows with matching values in the common\
    \ column(s) will be included in the result. merged\\_data = pd.merge(data, customer\\\
    _income, on='CustomerId') You can specify the type of join by using the how parameter:\
    \ ●       'left': Use keys from the left DataFrame only ●       'right': Use keys\
    \ from the right DataFrame only ●       'outer': Use keys from both DataFrames\
    \ ●       'inner': Use intersection of keys from both DataFrames (default) For\
    \ example, to perform a left join: merged\\_data\\_left = pd.merge(data, customer\\\
    _income, on='CustomerId', how='left') Joining DataFrames using join() Method The\
    \ join() method is used to combine DataFrames based on their index. By default,\
    \ it performs a left join, which means that it uses the index from the left DataFrame\
    \ and includes all its rows. First, let us set 'CustomerId' as the index for both\
    \ DataFrames: data = data.set\\_index('CustomerId') customer\\_income = customer\\\
    _income.set\\_index('CustomerId') Now, you can join the DataFrames: joined\\_data\
    \ = data.join(customer\\_income) You can also specify the type of join using the\
    \ how parameter, just like with the merge() function. In summary, merging and\
    \ joining DataFrames in Pandas allow you to combine two or more DataFrames based\
    \ on common columns or indexes. The merge() function combines DataFrames based\
    \ on common columns, while the join() method combines DataFrames based on their\
    \ index. These operations are essential when working with multiple related datasets\
    \ and can be adjusted to perform various types of joins (inner, left, right, and\
    \ outer) depending on your requirements. \n\nConcatenating and Appending DataFrames\
    \ In Pandas, merging and adding DataFrames refer to the process of joining two\
    \ or more DataFrames along a specific axis, either horizontally or vertically.\
    \ This technique is beneficial when you have multiple datasets with the same rows\
    \ or columns and want to stack them together. Concatenation and appending are\
    \ two methods of combining data frames in Pandas. Concatenation is used to stack\
    \ DataFrames on top of each other or next to each other, while appending adds\
    \ new rows to an existing DataFrame. Both of these methods can be useful in creating\
    \ a single DataFrame that contains all the necessary information from the original\
    \ datasets. For illustration purposes, let us assume you have two datasets, data1\
    \ and data2, which are subsets of the original data DataFrame: data1 = data.head(10)\
    \ data2 = data.tail(10) Concatenating DataFrames using concat() Function The concat()\
    \ function combines DataFrames along a particular axis. By default, it concatenates\
    \ DataFrames along the rows (axis=0). The given below teaches how to concatenate\
    \ data1 and data2: concatenated\\_data = pd.concat(\\[data1, data2\\]) To concatenate\
    \ DataFrames along the columns, set the axis parameter to 1: concatenated\\_data\\\
    _columns = pd.concat(\\[data1, data2\\], axis=1) Keep in mind that when concatenating\
    \ DataFrames along columns, it's crucial that they have the same index. Otherwise,\
    \ you might end up with missing values in the result. Appending DataFrames using\
    \ append() Method The append() method is a convenient way to combine DataFrames\
    \ along the rows, similar to concatenating along the rows with the concat() function.\
    \ You can append data2 to data1 as follows: appended\\_data = data1.append(data2)\
    \ Note that the append() method does not modify the original DataFrames; it creates\
    \ a new DataFrame containing the combined data. In summary, concatenating and\
    \ appending DataFrames in Pandas allow you to combine two or more DataFrames along\
    \ a particular axis (either rows or columns). The concat() function combines DataFrames\
    \ along a specified axis, while the append() method is a convenient way to combine\
    \ DataFrames along the rows. These operations are useful when you have multiple\
    \ datasets with the same columns or rows and want to stack them together. Sample\
    \ Program on Concatenate and Append Let us create another example using the given\
    \ Customer\\_Churn\\_Modelling.csv dataset. We'll first create two new DataFrames\
    \ with different subsets of the original data and then concatenate and append\
    \ them. Split the original data into two subsets \\# Read the original data data\
    \ = pd.read\\_csv(\"https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer\\\
    _Churn\\_Modelling.csv\") \\# Create subsets of data for customers from France\
    \ and Spain data\\_france = data\\[data\\['Geography'\\] == 'France'\\] data\\\
    _spain = data\\[data\\['Geography'\\] == 'Spain'\\] Concatenate the DataFrames\
    \ \\# Concatenate the DataFrames along the rows (axis=0) concatenated\\_data =\
    \ pd.concat(\\[data\\_france, data\\_spain\\]) Append the DataFrames \\# Append\
    \ 'data\\_spain' to 'data\\_france' appended\\_data = data\\_france.append(data\\\
    _spain) Both concatenated\\_data and appended\\_data will contain rows from the\
    \ original DataFrame, where customers are from France and Spain. Although the\
    \ results of concatenating and appending DataFrames along the rows are the same\
    \ in this example, these techniques can be used in different scenarios depending\
    \ on your requirements. Remember that concat() can be used to combine DataFrames\
    \ along either rows or columns, while append() is specifically for combining DataFrames\
    \ along the rows. "
  fmt: "\n# Merging and Joining DataFrames In Pandas\n\n在 Pandas 中，基于公共列或索引组合两个或多个\
    \ DataFrame 的过程可以通过合并和连接来实现。这些操作在管理多个相关数据集方面起着关键作用，允许进行高效的数据分析和操作。通过合并 DataFrame，可以基于共享列组合数据，从而生成一个包含所有相关信息的单个\
    \ DataFrame。另一方面，连接 DataFrame 则基于其索引实现两个或多个 DataFrame 的组合。这两种技术都有助于简化数据管理、提高数据质量，并更好地理解数据集之间的关系。因此，理解如何在\
    \ Pandas 中合并和连接 DataFrame 是数据分析师和科学家的一项重要技能。\n\n为了演示，假设您有另一个包含客户收入数据的数据集。我们将创建一个名为\
    \ `customer_income` 的小型 DataFrame，它与 `data` DataFrame 具有相同的 `CustomerId` 列：\n\n\
    ```python\nimport pandas as pd\ncustomer_income = pd.DataFrame({\n    'CustomerId':\
    \ [15745662, 15734523, 15698723],\n    'AnnualIncome': [55000, 68000, 45000]\n\
    })\n```\n\n## Merging DataFrames using `merge()` Function\n\n`merge()` 函数基于公共列组合\
    \ DataFrame。默认情况下，它执行内连接，这意味着只有在公共列中具有匹配值的行才会包含在结果中。\n\n```python\nmerged_data\
    \ = pd.merge(data, customer_income, on='CustomerId')\n```\n\n您可以通过使用 `how` 参数指定连接类型：\n\
    \n*   `'left'`：仅使用左侧 DataFrame 的键\n*   `'right'`：仅使用右侧 DataFrame 的键\n*   `'outer'`：使用两个\
    \ DataFrame 的键\n*   `'inner'`：使用两个 DataFrame 键的交集（默认）\n\n例如，执行左连接：\n\n```python\n\
    merged_data_left = pd.merge(data, customer_income, on='CustomerId', how='left')\n\
    ```\n\n## Joining DataFrames using `join()` Method\n\n`join()` 方法用于基于其索引组合 DataFrame。默认情况下，它执行左连接，这意味着它使用左侧\
    \ DataFrame 的索引并包含其所有行。\n\n首先，让我们将 `CustomerId` 设置为两个 DataFrame 的索引：\n\n```python\n\
    data = data.set_index('CustomerId')\ncustomer_income = customer_income.set_index('CustomerId')\n\
    ```\n\n现在，您可以连接 DataFrame：\n\n```python\njoined_data = data.join(customer_income)\n\
    ```\n\n您也可以像使用 `merge()` 函数一样，使用 `how` 参数指定连接类型。\n\n总之，Pandas 中的合并和连接 DataFrame\
    \ 允许您基于公共列或索引组合两个或多个 DataFrame。`merge()` 函数基于公共列组合 DataFrame，而 `join()` 方法基于其索引组合\
    \ DataFrame。在处理多个相关数据集时，这些操作至关重要，并且可以调整为执行各种类型的连接（内连接、左连接、右连接和外连接），具体取决于您的需求。\n\
    \n# Concatenating and Appending DataFrames\n\n在 Pandas 中，合并和添加 DataFrame 是指沿特定轴（水平或垂直）连接两个或多个\
    \ DataFrame 的过程。当您拥有具有相同行或列的多个数据集并希望将它们堆叠在一起时，此技术非常有用。连接和追加是 Pandas 中组合 DataFrame\
    \ 的两种方法。连接用于将 DataFrame 堆叠在彼此之上或并排，而追加则向现有 DataFrame 添加新行。这两种方法在创建包含来自原始数据集所有必要信息的单个\
    \ DataFrame 时都很有用。\n\n为了演示，假设您有两个数据集 `data1` 和 `data2`，它们是原始 `data` DataFrame\
    \ 的子集：\n\n```python\ndata1 = data.head(10)\ndata2 = data.tail(10)\n```\n\n## Concatenating\
    \ DataFrames using `concat()` Function\n\n`concat()` 函数沿特定轴组合 DataFrame。默认情况下，它沿行（`axis=0`）连接\
    \ DataFrame。下面展示如何连接 `data1` 和 `data2`：\n\n```python\nconcatenated_data = pd.concat([data1,\
    \ data2])\n```\n\n要沿列连接 DataFrame，请将 `axis` 参数设置为 1：\n\n```python\nconcatenated_data_columns\
    \ = pd.concat([data1, data2], axis=1)\n```\n\n请记住，当沿列连接 DataFrame 时，它们拥有相同的索引至关重要。否则，结果中可能会出现缺失值。\n\
    \n## Appending DataFrames using `append()` Method\n\n`append()` 方法是沿行组合 DataFrame\
    \ 的一种便捷方式，类似于使用 `concat()` 函数沿行连接。您可以按如下方式将 `data2` 追加到 `data1`：\n\n```python\n\
    appended_data = data1.append(data2)\n```\n\n请注意，`append()` 方法不会修改原始 DataFrame；它会创建一个包含组合数据的新\
    \ DataFrame。\n\n总之，Pandas 中的连接和追加 DataFrame 允许您沿特定轴（行或列）组合两个或多个 DataFrame。`concat()`\
    \ 函数沿指定轴组合 DataFrame，而 `append()` 方法是沿行组合 DataFrame 的一种便捷方式。当您拥有具有相同列或行的多个数据集并希望将它们堆叠在一起时，这些操作非常有用。\n\
    \n## Sample Program on Concatenate and Append\n\n让我们使用给定的 `Customer_Churn_Modelling.csv`\
    \ 数据集创建另一个示例。我们将首先用原始数据的不同子集创建两个新 DataFrame，然后连接和追加它们。\n\n### Split the original\
    \ data into two subsets\n\n```python\n# Read the original data\ndata = pd.read_csv(\"\
    https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv\"\
    )\n\n# Create subsets of data for customers from France and Spain\ndata_france\
    \ = data[data['Geography'] == 'France']\ndata_spain = data[data['Geography'] ==\
    \ 'Spain']\n```\n\n### Concatenate the DataFrames\n\n```python\n# Concatenate\
    \ the DataFrames along the rows (axis=0)\nconcatenated_data = pd.concat([data_france,\
    \ data_spain])\n```\n\n### Append the DataFrames\n\n```python\n# Append 'data_spain'\
    \ to 'data_france'\nappended_data = data_france.append(data_spain)\n```\n\n`concatenated_data`\
    \ 和 `appended_data` 都将包含原始 DataFrame 中来自法国和西班牙的客户的行。尽管在这个例子中连接和追加 DataFrame 沿行的结果相同，但这些技术可以根据您的需求用于不同的场景。请记住，`concat()`\
    \ 可用于沿行或列组合 DataFrame，而 `append()` 专门用于沿行组合 DataFrame。\n"
  trans: "\n# 在 Pandas 中合并和连接 DataFrame\n\n在 Pandas 中，基于公共列或索引组合两个或多个 DataFrame 的过程可以通过合并和连接来实现。这些操作在管理多个相关数据集方面起着关键作用，允许进行高效的数据分析和操作。通过合并\
    \ DataFrame，可以基于共享列组合数据，从而生成一个包含所有相关信息的单个 DataFrame。另一方面，连接 DataFrame 则基于其索引实现两个或多个\
    \ DataFrame 的组合。这两种技术都有助于简化数据管理、提高数据质量，并更好地理解数据集之间的关系。因此，理解如何在 Pandas 中合并和连接 DataFrame\
    \ 是数据分析师和科学家的一项重要技能。\n\n为了演示，假设您有另一个包含客户收入数据的数据集。我们将创建一个名为 `customer_income` 的小型\
    \ DataFrame，它与 `data` DataFrame 具有相同的 `CustomerId` 列：\n\n```python\nimport pandas\
    \ as pd\ncustomer_income = pd.DataFrame({\n    'CustomerId': [15745662, 15734523,\
    \ 15698723],\n    'AnnualIncome': [55000, 68000, 45000]\n})\n```\n\n## 使用 `merge()`\
    \ 函数合并 DataFrame\n\n`merge()` 函数基于公共列组合 DataFrame。默认情况下，它执行内连接，这意味着只有在公共列中具有匹配值的行才会包含在结果中。\n\
    \n```python\nmerged_data = pd.merge(data, customer_income, on='CustomerId')\n\
    ```\n\n您可以通过使用 `how` 参数指定连接类型：\n\n*   `'left'`：仅使用左侧 DataFrame 的键\n*   `'right'`：仅使用右侧\
    \ DataFrame 的键\n*   `'outer'`：使用两个 DataFrame 的键\n*   `'inner'`：使用两个 DataFrame\
    \ 键的交集（默认）\n\n例如，执行左连接：\n\n```python\nmerged_data_left = pd.merge(data, customer_income,\
    \ on='CustomerId', how='left')\n```\n\n## 使用 `join()` 方法连接 DataFrame\n\n`join()`\
    \ 方法用于基于其索引组合 DataFrame。默认情况下，它执行左连接，这意味着它使用左侧 DataFrame 的索引并包含其所有行。\n\n首先，让我们将\
    \ `CustomerId` 设置为两个 DataFrame 的索引：\n\n```python\ndata = data.set_index('CustomerId')\n\
    customer_income = customer_income.set_index('CustomerId')\n```\n\n现在，您可以连接 DataFrame：\n\
    \n```python\njoined_data = data.join(customer_income)\n```\n\n您也可以像使用 `merge()`\
    \ 函数一样，使用 `how` 参数指定连接类型。\n\n总之，Pandas 中的合并和连接 DataFrame 允许您基于公共列或索引组合两个或多个 DataFrame。`merge()`\
    \ 函数基于公共列组合 DataFrame，而 `join()` 方法基于其索引组合 DataFrame。在处理多个相关数据集时，这些操作至关重要，并且可以调整为执行各种类型的连接（内连接、左连接、右连接和外连接），具体取决于您的需求。\n\
    \n# 连接和追加 DataFrame\n\n在 Pandas 中，合并和添加 DataFrame 是指沿特定轴（水平或垂直）连接两个或多个 DataFrame\
    \ 的过程。当您拥有具有相同行或列的多个数据集并希望将它们堆叠在一起时，此技术非常有用。连接和追加是 Pandas 中组合 DataFrame 的两种方法。连接用于将\
    \ DataFrame 堆叠在彼此之上或并排，而追加则向现有 DataFrame 添加新行。这两种方法在创建包含来自原始数据集所有必要信息的单个 DataFrame\
    \ 时都很有用。\n\n为了演示，假设您有两个数据集 `data1` 和 `data2`，它们是原始 `data` DataFrame 的子集：\n\n```python\n\
    data1 = data.head(10)\ndata2 = data.tail(10)\n```\n\n## 使用 `concat()` 函数连接 DataFrame\n\
    \n`concat()` 函数沿特定轴组合 DataFrame。默认情况下，它沿行（`axis=0`）连接 DataFrame。下面展示如何连接 `data1`\
    \ 和 `data2`：\n\n```python\nconcatenated_data = pd.concat([data1, data2])\n```\n\
    \n要沿列连接 DataFrame，请将 `axis` 参数设置为 1：\n\n```python\nconcatenated_data_columns =\
    \ pd.concat([data1, data2], axis=1)\n```\n\n请记住，当沿列连接 DataFrame 时，它们拥有相同的索引至关重要。否则，结果中可能会出现缺失值。\n\
    \n## 使用 `append()` 方法追加 DataFrame\n\n`append()` 方法是沿行组合 DataFrame 的一种便捷方式，类似于使用\
    \ `concat()` 函数沿行连接。您可以按如下方式将 `data2` 追加到 `data1`：\n\n```python\nappended_data\
    \ = data1.append(data2)\n```\n\n请注意，`append()` 方法不会修改原始 DataFrame；它会创建一个包含组合数据的新\
    \ DataFrame。\n\n总之，Pandas 中的连接和追加 DataFrame 允许您沿特定轴（行或列）组合两个或多个 DataFrame。`concat()`\
    \ 函数沿指定轴组合 DataFrame，而 `append()` 方法是沿行组合 DataFrame 的一种便捷方式。当您拥有具有相同列或行的多个数据集并希望将它们堆叠在一起时，这些操作非常有用。\n\
    \n## 连接和追加的示例程序\n\n让我们使用给定的 `Customer_Churn_Modelling.csv` 数据集创建另一个示例。我们将首先用原始数据的不同子集创建两个新\
    \ DataFrame，然后连接和追加它们。\n\n### 将原始数据拆分为两个子集\n\n```python\n# Read the original data\n\
    data = pd.read_csv(\"https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv\"\
    )\n\n# Create subsets of data for customers from France and Spain\ndata_france\
    \ = data[data['Geography'] == 'France']\ndata_spain = data[data['Geography'] ==\
    \ 'Spain']\n```\n\n### 连接 DataFrame\n\n```python\n# Concatenate the DataFrames\
    \ along the rows (axis=0)\nconcatenated_data = pd.concat([data_france, data_spain])\n\
    ```\n\n### 追加 DataFrame\n\n```python\n# Append 'data_spain' to 'data_france'\n\
    appended_data = data_france.append(data_spain)\n```\n\n`concatenated_data` 和 `appended_data`\
    \ 都将包含原始 DataFrame 中来自法国和西班牙的客户的行。尽管在这个例子中连接和追加 DataFrame 沿行的结果相同，但这些技术可以根据您的需求用于不同的场景。请记住，`concat()`\
    \ 可用于沿行或列组合 DataFrame，而 `append()` 专门用于沿行组合 DataFrame。\n\n"
