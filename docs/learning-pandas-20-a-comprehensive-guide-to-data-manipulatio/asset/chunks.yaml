  fmt: "\n# Text Clustering\n\nText clustering, on the other hand, is a technique\
    \ used to group similar documents together based on their content. The goal of\
    \ text clustering is to automatically identify groups of documents that share\
    \ common themes or topics. Text clustering algorithms use unsupervised machine\
    \ learning techniques to group similar documents based on their content. One of\
    \ the most popular algorithms used for text clustering is K-means clustering.\
    \ K-means clustering is an iterative algorithm that groups documents into K clusters\
    \ based on the similarity of their content. The algorithm iteratively assigns\
    \ each document to the closest cluster based on a distance metric such as Euclidean\
    \ distance or cosine similarity. Both topic modeling and text clustering can be\
    \ useful in a variety of applications such as information retrieval, data mining,\
    \ and content analysis. They can be used to identify patterns and trends in large\
    \ collections of text data, classify documents based on their content, and summarize\
    \ the information contained in a large set of documents.\n\n# Text Clustering\
    \ Procedure\n\nThe process of performing text clustering using K-means involves\
    \ several steps:\n\n## Load and preprocess the text data\n\nThe first step is\
    \ to load the text data into a format suitable for analysis. This may involve\
    \ cleaning the text data, removing stop words, stemming or lemmatization, and\
    \ more. The preprocessed text data is typically represented as a collection of\
    \ documents, where each document is a list of words.\n\n## Create a document-term\
    \ matrix\n\nThe next step is to create a document-term matrix, which represents\
    \ the frequency of each term (word) in each document. This matrix is typically\
    \ represented as a sparse matrix to save memory.\n\n## Choose the number of clusters\n\
    \nThe number of clusters in the text data must be determined before applying the\
    \ K-means algorithm. This is often done using domain knowledge or trial and error.\n\
    \n## Train the K-means model\n\nThe K-means model is trained on the document-term\
    \ matrix using an iterative algorithm. The algorithm iteratively assigns each\
    \ document to the closest cluster based on a distance metric such as Euclidean\
    \ distance or cosine similarity. The output of the K-means model is a set of clusters,\
    \ each represented as a centroid vector.\n\n## Evaluate the K-means model\n\n\
    The quality of the K-means model can be evaluated using metrics such as silhouette\
    \ score or inertia. Silhouette score measures how well the instances are clustered\
    \ together, while inertia measures how tightly the instances are clustered.\n\n\
    ## Interpret the clusters\n\nThe final step is to interpret the clusters and assign\
    \ human-readable labels to them based on the most frequent words in each cluster.\
    \ This step may involve manual inspection of the clusters and some domain knowledge.\n\
    \nK-means is a powerful technique for grouping similar documents together based\
    \ on their content and can be used in a variety of applications such as information\
    \ retrieval, data mining, and content analysis.\n\n# Performing Text Clustering\
    \ using K-means\n\nHere's a practical demonstration of how to perform text clustering\
    \ using K-means in Pandas 2.0:\n\n## Load and Preprocess Text Data\n\n```python\n\
    import pandas as pd\nimport string\nfrom nltk.corpus import stopwords\nfrom nltk.stem\
    \ import WordNetLemmatizer\n\n# load the data into a DataFrame\ndf = pd.read_csv('https://raw.githubusercontent.com/kittenpub/database-repository/main/text_clustering_data.csv')\n\
    \n# convert the text to lowercase\ndf['text'] = df['text'].str.lower()\n\n# remove\
    \ punctuation\ndf['text'] = df['text'].apply(lambda x: x.translate(str.maketrans('',\
    \ '', string.punctuation)))\n\n# remove stop words\nstop_words = stopwords.words('english')\n\
    df['text'] = df['text'].apply(lambda x: ' '.join([word for word in x.split() if\
    \ word not in stop_words]))\n\n# lemmatize the text\nlemmatizer = WordNetLemmatizer()\n\
    df['text'] = df['text'].apply(lambda x: ' '.join([lemmatizer.lemmatize(word) for\
    \ word in x.split()]))\n```\n\nIn this step, we load the data into a `DataFrame`\
    \ using the `read_csv()` method from `Pandas`. We then perform several preprocessing\
    \ steps on the `'text'` column of the `DataFrame`. We convert the text to lowercase\
    \ using the `lower()` method. We then remove punctuation using the `translate()`\
    \ method from the `string` module. We remove stop words using the `stopwords`\
    \ corpus from the `nltk` library. Finally, we lemmatize the text using the `WordNetLemmatizer`\
    \ from the `nltk` library.\n\n## Create Document-term Matrix\n\n```python\nfrom\
    \ sklearn.feature_extraction.text import CountVectorizer\n\n# create a CountVectorizer\
    \ object\nvectorizer = CountVectorizer()\n\n# fit the vectorizer on the text data\
    \ to learn the vocabulary\nvectorizer.fit(df['text'])\n\n# transform the text\
    \ data into a document-term matrix\ndoc_term_matrix = vectorizer.transform(df['text'])\n\
    ```\n\nIn this step, we create a `CountVectorizer` object from `Scikit-learn`\
    \ to convert the text data into a document-term matrix. We fit the vectorizer\
    \ on the `'text'` column of the `DataFrame` to learn the vocabulary, and then\
    \ transform the `'text'` column into a document-term matrix using the `transform()`\
    \ method.\n\n## Train the K-means Model\n\n```python\nfrom sklearn.cluster import\
    \ KMeans\n\n# choose the number of clusters\nnum_clusters = 3\n\n# create a K-means\
    \ model\nkmeans_model = KMeans(n_clusters=num_clusters, random_state=42)\n\n#\
    \ fit the K-means model on the document-term matrix\nkmeans_model.fit(doc_term_matrix)\n\
    ```\n\nIn this step, we choose the number of clusters in the text data (in this\
    \ case, 3) and create a K-means model using the `KMeans` class from `Scikit-learn`.\
    \ We fit the K-means model on the document-term matrix using the `fit()` method.\n\
    \n## Interpret the Clusters\n\n```python\n# get the top 10 terms in each cluster\n\
    feature_names = vectorizer.get_feature_names()\nfor i in range(num_clusters):\n\
    \    print(f\"Cluster {i}:\")\n    top_terms = [feature_names[idx] for idx in\
    \ kmeans_model.cluster_centers_[i].argsort()[:-10 - 1:-1]]\n    print(\", \".join(top_terms))\n\
    \    print()\n```\n\nIn this step, we interpret the clusters by printing the top\
    \ 10 terms in each cluster. We use the `get_feature_names()` method from the `CountVectorizer`\
    \ object to get the list of feature names (i.e., words), and then use the `argsort()`\
    \ method and `cluster_centers_` attribute from the trained K-means model to sort\
    \ the terms by their frequencies in each cluster. Finally, we print the top 10\
    \ terms in each cluster.\n\n## Evaluate the K-means Model\n\n```python\nfrom sklearn.metrics\
    \ import silhouette_score\n\n# calculate the silhouette score\nsilhouette_score\
    \ = silhouette_score(doc_term_matrix, kmeans_model.labels_)\nprint(\"Silhouette\
    \ Score:\", silhouette_score)\n```\n\nIn this step, we evaluate the K-means model\
    \ by calculating the silhouette score using the `silhouette_score()` method from\
    \ `Scikit-learn`. The silhouette score measures how well the instances are clustered\
    \ together, and a higher score indicates a better model.\n\nOverall, the above\
    \ steps demonstrate how to perform text clustering using K-means in Pandas 2.0.\
    \ The steps involve loading and preprocessing the text data, creating a document-term\
    \ matrix, training the K-means model, interpreting the clusters, and evaluating\
    \ the model. K-means is a powerful technique for grouping similar documents together\
    \ based on their content and can be used in a variety of applications such as\
    \ information retrieval, data mining, and content analysis.\n"
  trans: "\n# 文本聚类\n\n另一方面，文本聚类是一种根据文档内容将相似文档归为一组的技术。文本聚类的目标是自动识别出共享共同主题或话题的文档组。文本聚类算法使用无监督机器学习技术，根据文档内容对相似文档进行分组。用于文本聚类的最流行算法之一是\
    \ K-means 聚类。K-means 聚类是一种迭代算法，它根据内容的相似性将文档分成 K 个簇。该算法根据距离度量（如欧氏距离或余弦相似度）迭代地将每个文档分配给最近的簇。主题建模和文本聚类在信息检索、数据挖掘和内容分析等多种应用中均很有用。它们可用于识别大量文本数据集中的模式和趋势，根据内容对文档进行分类，并总结大量文档集中包含的信息。\n\
    \n# 文本聚类流程\n\n使用 K-means 执行文本聚类的过程包含以下几个步骤：\n\n## 加载并预处理文本数据\n\n第一步是将文本数据加载为适合分析的格式。这可能涉及清洗文本数据、移除停用词、词干提取或词形还原等。预处理后的文本数据通常表示为文档集合，其中每个文档是一个单词列表。\n\
    \n## 创建文档-词项矩阵\n\n下一步是创建文档-词项矩阵，该矩阵表示每个词项（单词）在每个文档中出现的频率。该矩阵通常表示为稀疏矩阵以节省内存。\n\n\
    ## 选择簇的数量\n\n在应用 K-means 算法之前，必须确定文本数据中的簇的数量。这通常通过领域知识或试错法来完成。\n\n## 训练 K-means\
    \ 模型\n\nK-means 模型使用迭代算法在文档-词项矩阵上进行训练。该算法根据距离度量（如欧氏距离或余弦相似度）迭代地将每个文档分配给最近的簇。K-means\
    \ 模型的输出是一组簇，每个簇表示为一个质心向量。\n\n## 评估 K-means 模型\n\n可以使用轮廓系数或惯性等指标来评估 K-means 模型的质量。轮廓系数衡量实例聚类得有多好，而惯性衡量实例聚类得有多紧密。\n\
    \n## 解读簇\n\n最后一步是解读簇，并根据每个簇中最高频的单词为其分配人类可读的标签。此步骤可能涉及对簇的人工检查和一些领域知识。\n\nK-means\
    \ 是一种基于内容将相似文档归为一组的强大技术，可用于信息检索、数据挖掘和内容分析等多种应用。\n\n# 使用 K-means 执行文本聚类\n\n以下是使用\
    \ Pandas 2.0 执行 K-means 文本聚类的实操演示：\n\n## 加载并预处理文本数据\n\n```python\nimport pandas\
    \ as pd\nimport string\nfrom nltk.corpus import stopwords\nfrom nltk.stem import\
    \ WordNetLemmatizer\n\n# load the data into a DataFrame\ndf = pd.read_csv('https://raw.githubusercontent.com/kittenpub/database-repository/main/text_clustering_data.csv')\n\
    \n# convert the text to lowercase\ndf['text'] = df['text'].str.lower()\n\n# remove\
    \ punctuation\ndf['text'] = df['text'].apply(lambda x: x.translate(str.maketrans('',\
    \ '', string.punctuation)))\n\n# remove stop words\nstop_words = stopwords.words('english')\n\
    df['text'] = df['text'].apply(lambda x: ' '.join([word for word in x.split() if\
    \ word not in stop_words]))\n\n# lemmatize the text\nlemmatizer = WordNetLemmatizer()\n\
    df['text'] = df['text'].apply(lambda x: ' '.join([lemmatizer.lemmatize(word) for\
    \ word in x.split()]))\n```\n\n在此步骤中，我们使用 `Pandas` 的 `read_csv()` 方法将数据加载到 `DataFrame`\
    \ 中。然后我们对 `DataFrame` 的 `'text'` 列执行多个预处理步骤。我们使用 `lower()` 方法将文本转换为小写。然后我们使用 `string`\
    \ 模块的 `translate()` 方法移除标点符号。我们使用 `nltk` 库的 `stopwords` 语料库移除停用词。最后，我们使用 `nltk`\
    \ 库的 `WordNetLemmatizer` 对文本进行词形还原。\n\n## 创建文档-词项矩阵\n\n```python\nfrom sklearn.feature_extraction.text\
    \ import CountVectorizer\n\n# create a CountVectorizer object\nvectorizer = CountVectorizer()\n\
    \n# fit the vectorizer on the text data to learn the vocabulary\nvectorizer.fit(df['text'])\n\
    \n# transform the text data into a document-term matrix\ndoc_term_matrix = vectorizer.transform(df['text'])\n\
    ```\n\n在此步骤中，我们从 `Scikit-learn` 创建一个 `CountVectorizer` 对象，将文本数据转换为文档-词项矩阵。我们在\
    \ `DataFrame` 的 `'text'` 列上拟合向量化器以学习词汇表，然后使用 `transform()` 方法将 `'text'` 列转换为文档-词项矩阵。\n\
    \n## 训练 K-means 模型\n\n```python\nfrom sklearn.cluster import KMeans\n\n# choose\
    \ the number of clusters\nnum_clusters = 3\n\n# create a K-means model\nkmeans_model\
    \ = KMeans(n_clusters=num_clusters, random_state=42)\n\n# fit the K-means model\
    \ on the document-term matrix\nkmeans_model.fit(doc_term_matrix)\n```\n\n在此步骤中，我们选择文本数据中的簇数量（在本例中为\
    \ 3），并使用 `Scikit-learn` 的 `KMeans` 类创建 K-means 模型。我们使用 `fit()` 方法在文档-词项矩阵上拟合 K-means\
    \ 模型。\n\n## 解读簇\n\n```python\n# get the top 10 terms in each cluster\nfeature_names\
    \ = vectorizer.get_feature_names()\nfor i in range(num_clusters):\n    print(f\"\
    Cluster {i}:\")\n    top_terms = [feature_names[idx] for idx in kmeans_model.cluster_centers_[i].argsort()[:-10\
    \ - 1:-1]]\n    print(\", \".join(top_terms))\n    print()\n```\n\n在此步骤中，我们通过打印每个簇中前\
    \ 10 个词项来解读簇。我们使用 `CountVectorizer` 对象的 `get_feature_names()` 方法获取特征名称列表（即单词），然后使用训练好的\
    \ K-means 模型的 `argsort()` 方法和 `cluster_centers_` 属性按各词项在每个簇中的频率对其进行排序。最后，我们打印每个簇中的前\
    \ 10 个词项。\n\n## 评估 K-means 模型\n\n```python\nfrom sklearn.metrics import silhouette_score\n\
    \n# calculate the silhouette score\nsilhouette_score = silhouette_score(doc_term_matrix,\
    \ kmeans_model.labels_)\nprint(\"Silhouette Score:\", silhouette_score)\n```\n\
    \n在此步骤中，我们通过使用 `Scikit-learn` 的 `silhouette_score()` 方法计算轮廓系数来评估 K-means 模型。轮廓系数衡量实例聚类得有多好，分数越高表示模型越好。\n\
    \n总体而言，上述步骤演示了如何在 Pandas 2.0 中使用 K-means 执行文本聚类。步骤包括加载和预处理文本数据、创建文档-词项矩阵、训练 K-means\
    \ 模型、解读簇以及评估模型。K-means 是一种基于内容将相似文档归为一组的强大技术，可用于信息检索、数据挖掘和内容分析等多种应用。\n"
