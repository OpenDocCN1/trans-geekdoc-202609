  trans: "\n\n# 使用 Pandas 2.0 进行数据库交互\n\n数据库交互是指使用编程语言或软件工具连接、查询和管理存储在数据库管理系统 (DBMS)\
    \ 中数据的过程。Pandas 结合其他库，可以与各种数据库进行交互，例如 SQL 数据库（如 SQLite、MySQL、PostgreSQL）和 NoSQL\
    \ 数据库（如 MongoDB），以读取和写入数据。在本示例中，我们将演示如何使用 Pandas 2.0 与 SQLite 数据库进行交互。SQLite 是一种轻量级、无服务器、自包含的\
    \ SQL 数据库引擎，易于设置，且无需单独的服务器进程。\n\n## 安装 sqlite3 包\n\n首先，您需要安装 `sqlite3` 包，它是 Python\
    \ 标准库的一部分，通常已经预装。\n\n```\n!pip install pysqlite3\n```\n\n此代码将使用 `pip` 安装 `sqlite3`\
    \ 包及其依赖项。\n\n## 设置 SQLite 数据库\n\n为了演示，我们将创建一个新的 SQLite 数据库和一张表，用于存储 `Customer_Churn_Modelling`\
    \ 数据。\n\n```\nimport sqlite3\n\n# 连接到 SQLite 数据库（如果不存在，将创建一个名为 'churn.db' 的新文件）\n\
    conn = sqlite3.connect('churn.db')\n\n# 创建一个游标对象以执行 SQL 命令\ncursor = conn.cursor()\n\
    \n# 创建 'customer_churn' 表\ncreate_table_query = '''\nCREATE TABLE IF NOT EXISTS\
    \ customer_churn (\n    RowNumber INTEGER PRIMARY KEY,\n    CustomerId INTEGER,\n\
    \    Surname TEXT,\n    CreditScore INTEGER,\n    Geography TEXT,\n    Gender\
    \ TEXT,\n    Age INTEGER,\n    Tenure INTEGER,\n    Balance REAL,\n    NumOfProducts\
    \ INTEGER,\n    HasCrCard INTEGER,\n    IsActiveMember INTEGER,\n    EstimatedSalary\
    \ REAL,\n    Exited INTEGER\n);\n'''\n\ncursor.execute(create_table_query)\n\n\
    # 提交更改并关闭游标\nconn.commit()\ncursor.close()\n```\n\n## 将数据加载到 SQLite 数据库\n\n现在，我们将\
    \ `Customer_Churn_Modelling` 数据（假设存储在名为 `data` 的 DataFrame 中）插入到 `customer_churn`\
    \ 表中。\n\n```\n# 将 DataFrame 中的数据插入到 SQLite 表中\ndata.to_sql('customer_churn', conn,\
    \ if_exists='replace', index=False)\n```\n\n## 使用 Pandas 查询 SQLite 数据库\n\n您可以使用\
    \ Pandas 在数据库上执行 SQL 查询，并将结果存储在 DataFrame 中。\n\n```\n# 定义 SQL 查询\nsql_query =\
    \ 'SELECT * FROM customer_churn WHERE Exited = 1'\n\n# 执行查询并将结果存储在 DataFrame 中\n\
    churned_customers = pd.read_sql_query(sql_query, conn)\n```\n\n## 执行数据操作与分析\n\n\
    数据加载到 DataFrame 后，您可以使用前文讨论的相同 Pandas 函数和方法来操作和分析数据。\n\n## 将数据写回 SQLite 数据库（可选）\n\
    \n如果您想将修改后的数据写回 SQLite 数据库，可以再次使用 `to_sql()` 方法。\n\n```\n# 假设 'modified_data'\
    \ 是一个包含修改后数据的 DataFrame\nmodified_data.to_sql('customer_churn', conn, if_exists='replace',\
    \ index=False)\n```\n\n## 关闭连接\n\n最后，关闭与 SQLite 数据库的连接。\n\n```\nconn.close()\n\
    ```\n\n总之，Pandas 允许您通过连接数据库、查询数据以及管理数据库中的数据来与数据库进行交互。通过使用其他库（如本例中的 `sqlite3`），您可以执行数据库交互任务，并使用\
    \ Pandas 从数据库读取和写入数据。这种集成使 Pandas 成为涉及数据库的数据操作和分析的强大工具。\n\n# 连接 Web API\n\n通过\
    \ Pandas 利用 Web API 可以获取最新信息，并将其无缝集成到 DataFrame 中，以便进行后续评估和操作。这种与 API 的集成简化了实时访问和处理数据的流程，为分析提供了更高效的方法。在本示例中，我们将演示如何使用\
    \ `requests` 库连接到公共 API 并将数据加载到 Pandas DataFrame 中。\n\n## 安装 HTTP 请求包\n\n首先，您需要安装用于发送\
    \ HTTP 请求的 `requests` 包：\n\n```\npip install requests\n```\n\n## 发起 API 请求并检索数据\n\
    \n在本示例中，我们将使用 JSONPlaceholder 提供的公共 API，它以 JSON 格式返回一组虚拟帖子列表。\n\n```\nimport requests\n\
    \n# 定义 API 端点\napi_url = 'https://jsonplaceholder.typicode.com/posts'\n\n# 向 API\
    \ 发送 HTTP GET 请求\nresponse = requests.get(api_url)\n\n# 检查请求是否成功\nif response.status_code\
    \ == 200:\n    # 解析 JSON 数据\n    json_data = response.json()\nelse:\n    print(f'Error:\
    \ Unable to fetch data from the API (status code: {response.status_code})')\n\
    ```\n\n## 将 JSON 数据加载到 Pandas DataFrame\n\n获取 JSON 数据后，您可以使用 `pd.DataFrame()`\
    \ 构造函数或 `pd.read_json()` 函数将其加载到 DataFrame 中。\n\n```\nimport pandas as pd\n\n\
    # 将 JSON 数据加载到 DataFrame 中\ndata = pd.DataFrame(json_data)\n\n# 或者，您可以使用 'pd.read_json()'\
    \ 函数\n# data = pd.read_json(api_url)\n```\n\n## 执行数据操作与分析\n\n现在数据已加载到 DataFrame\
    \ 中，您可以使用前文讨论的相同 Pandas 函数和方法来操作和分析数据。\n\n请记住，连接不同 API 的过程可能因特定 API 和所需的身份验证方法而异。您可能需要提供\
    \ API 密钥、令牌或使用 OAuth 进行身份验证。请务必查阅 API 文档，了解如何连接和检索数据的详细说明。\n\n总之，您可以使用 `requests`\
    \ 等库连接到 Web API 并检索实时数据，将数据加载到 Pandas DataFrame 中以进行操作和分析。这一功能使 Pandas 成为处理动态数据源和实时应用的强大工具。\n\
    \n"
