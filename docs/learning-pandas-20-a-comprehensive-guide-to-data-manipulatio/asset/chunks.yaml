    \n```python\n# Select the first 10 rows of the DataFrame\nfirst_10_rows = data[:10]\n\
    ```\n\n### Select rows based on conditions\n\n```python\n# Select rows where 'Exited'\
    \ equals 1 (churned customers)\nchurned_customers = data[data['Exited'] == 1]\n\
    ```\n\n### Modify data values\n\n```python\n# Update the 'CreditScore' column\
    \ by adding 10 points to each value\ndata['CreditScore'] = data['CreditScore']\
