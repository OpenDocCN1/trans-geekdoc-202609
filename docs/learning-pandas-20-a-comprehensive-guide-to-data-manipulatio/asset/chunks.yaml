  fmt: "\n# Data Scraping\n\nExtracting structured data from websites is achieved\
    \ through a process known as data scraping. This involves parsing the HTML content\
    \ of a website to gather information. `Beautiful Soup`, a Python library, is a\
    \ commonly used tool for web scraping. With its simple and user-friendly syntax,\
    \ it allows users to quickly and easily navigate and parse HTML and XML documents.\
    \ `Beautiful Soup` can be used to extract various types of data from websites,\
    \ such as text, links, and images. It also offers support for multiple parsers,\
    \ making it compatible with different markup languages. In this example, we'll\
    \ demonstrate how to use `Beautiful Soup` to scrape data from a website and load\
    \ it into a Pandas `DataFrame`.\n\n## Install Beautiful Soup Package\n\nFirst,\
    \ you'll need to install `Beautiful Soup` and the `requests` library:\n\n```\n\
    pip install beautifulsoup4 requests\n```\n\n## Fetch HTML Content from Website\n\
    \nFor this example, we'll scrape data from a simple HTML table available at the\
    \ following URL: <https://www.worldcoinindex.com/>\n\n```\nimport requests\n\n\
    # Define the URL\nurl = 'https://www.worldcoinindex.com/'\n\n# Fetch the HTML\
    \ content\nresponse = requests.get(url)\n\n# Check if the request was successful\n\
    if response.status_code == 200:\n    html_content = response.text\nelse:\n   \
    \ print(f'Error: Unable to fetch data from the website (status code: {response.status_code})')\n\
    ```\n\n## Parse HTML Content using Beautiful Soup\n\nNext, we'll parse the HTML\
    \ content using `Beautiful Soup` to extract the data we need.\n\n```\nfrom bs4\
    \ import BeautifulSoup\n\n# Parse the HTML content\nsoup = BeautifulSoup(html_content,\
    \ 'html.parser')\n\n# Find the table containing the data we want to scrape\ntable\
    \ = soup.find('table', {'class': 'table'})\n```\n\n## Extract Data from HTML Table\n\
    \nNow, we'll extract the data from the HTML table, including the headers and row\
    \ data.\n\n```\n# Extract the headers\nheaders = [header.text for header in table.findAll('th')]\n\
    \n# Extract the rows\nrows = []\nfor row in table.tbody.findAll('tr'):\n    rows.append([col.text\
    \ for col in row.findAll('td')])\n```\n\n## Load Data into Pandas DataFrame\n\n\
    Once we have the headers and rows, we can load the data into a `DataFrame`.\n\n\
    ```\nimport pandas as pd\n\n# Create a DataFrame using the extracted headers and\
    \ rows\ndata = pd.DataFrame(rows, columns=headers)\n```\n\n## Perform Data Manipulation\
    \ and Analysis\n\nNow that the data is loaded into a `DataFrame`, you can use\
    \ the same Pandas functions and methods discussed earlier to manipulate and analyze\
    \ the data. In summary, you can perform web scraping using libraries like `Beautiful\
    \ Soup` and `Requests` to extract structured data from websites. Once you have\
    \ the data, you can load it into a Pandas `DataFrame` for further processing and\
    \ analysis. This capability makes Pandas a powerful tool for working with data\
    \ from various sources, including dynamic web content.\n\n# Handling Missing Data\n\
    \nIn the data cleaning process, it is crucial to address any missing data. Pandas\
    \ offers a range of techniques to identify, evaluate, and manage missing data.\
    \ These methods can help to ensure that the data analysis is accurate and reliable\
    \ by filling in the missing values or removing the incomplete records. In this\
    \ example, we'll assume you have already loaded the `Customer_Churn_Modelling.csv`\
    \ dataset into a `DataFrame` called `data`.\n\n## Identify Missing Data\n\nFirst,\
    \ use the `isna()` or `isnull()` method to detect missing values in the `DataFrame`.\
    \ The `isna()` method returns a `DataFrame` of the same shape with `True` for\
    \ missing values and `False` for non-missing values.\n\n```\nmissing_values =\
    \ data.isna()\n```\n\nYou can use the `sum()` method to count the number of missing\
    \ values per column:\n\n```\nmissing_value_counts = data.isna().sum()\nprint(missing_value_counts)\n\
    ```\n\n## Handle Missing Data\n\nThere are various ways to handle missing data\
    \ in a `DataFrame`, such as dropping or filling missing values. The choice depends\
    \ on the nature of the data and the specific use case.\n\n### Drop missing values\n\
    \nThe `dropna()` method removes rows or columns with missing values from the `DataFrame`.\
    \ By default, it removes any row containing at least one missing value:\n\n```\n\
    data_cleaned = data.dropna()\n```\n\nTo drop columns with missing values instead\
    \ of rows, set the `axis` parameter to `1`:\n\n```\ndata_cleaned = data.dropna(axis=1)\n\
    ```\n\n### Fill missing values\n\nThe `fillna()` method fills missing values with\
    \ a specified value or using a specified method (such as forward fill or backward\
    \ fill).\n\nTo fill missing values with a constant value (e.g., `0`):\n\n```\n\
    data_filled = data.fillna(0)\n```\n\nTo fill missing values with the mean of the\
    \ respective column:\n\n```\ndata_filled = data.fillna(data.mean())\n```\n\nTo\
    \ fill missing values using forward fill (propagate the last valid observation\
    \ forward):\n\n```\ndata_filled = data.fillna(method='ffill')\n```\n\nTo fill\
    \ missing values using backward fill (propagate the next valid observation backward):\n\
    \n```\ndata_filled = data.fillna(method='bfill')\n```\n\n## Verify the Changes\n\
    \nAfter handling the missing data, you can use the `isna().sum()` method again\
    \ to confirm that there are no more missing values in the `DataFrame`:\n\n```\n\
    missing_value_counts_cleaned = data_cleaned.isna().sum()\nprint(missing_value_counts_cleaned)\n\
    ```\n\nIn summary, Pandas provides several methods to handle missing data in `DataFrames`.\
    \ By using methods like `dropna()` and `fillna()`, you can efficiently handle\
    \ missing values based on your specific requirements and the nature of the data.\n"
  trans: "\n\n# 数据抓取\n\n从网站提取结构化数据是通过称为数据抓取的过程实现的。这涉及解析网站的 HTML 内容以收集信息。`Beautiful\
    \ Soup` 是一个 Python 库，是网页抓取常用的工具。凭借其简单且用户友好的语法，它允许用户快速轻松地浏览和解析 HTML 和 XML 文档。`Beautiful\
    \ Soup` 可用于从网站提取各种类型的数据，如文本、链接和图像。它还支持多种解析器，使其兼容不同的标记语言。在本示例中，我们将演示如何使用 `Beautiful\
    \ Soup` 从网站抓取数据并将其加载到 Pandas `DataFrame` 中。\n\n## 安装 Beautiful Soup 包\n\n首先，您需要安装\
    \ `Beautiful Soup` 和 `requests` 库：\n\n```\npip install beautifulsoup4 requests\n\
    ```\n\n## 从网站获取 HTML 内容\n\n在本示例中，我们将从以下 URL 可用的简单 HTML 表格中抓取数据：<https://www.worldcoinindex.com/>\n\
    \n```\nimport requests\n\n# 定义 URL\nurl = 'https://www.worldcoinindex.com/'\n\n\
    # 获取 HTML 内容\nresponse = requests.get(url)\n\n# 检查请求是否成功\nif response.status_code\
    \ == 200:\n    html_content = response.text\nelse:\n    print(f'Error: Unable\
    \ to fetch data from the website (status code: {response.status_code})')\n```\n\
    \n## 使用 Beautiful Soup 解析 HTML 内容\n\n接下来，我们将使用 `Beautiful Soup` 解析 HTML 内容以提取所需数据。\n\
    \n```\nfrom bs4 import BeautifulSoup\n\n# 解析 HTML 内容\nsoup = BeautifulSoup(html_content,\
    \ 'html.parser')\n\n# 查找包含我们要抓取数据的表格\ntable = soup.find('table', {'class': 'table'})\n\
    ```\n\n## 从 HTML 表格中提取数据\n\n现在，我们将从 HTML 表格中提取数据，包括表头和行数据。\n\n```\n# 提取表头\nheaders\
    \ = [header.text for header in table.findAll('th')]\n\n# 提取行\nrows = []\nfor row\
    \ in table.tbody.findAll('tr'):\n    rows.append([col.text for col in row.findAll('td')])\n\
    ```\n\n## 将数据加载到 Pandas DataFrame 中\n\n一旦我们有了表头和行，就可以将数据加载到 `DataFrame` 中。\n\n\
    ```\nimport pandas as pd\n\n# 使用提取的表头和行创建 DataFrame\ndata = pd.DataFrame(rows,\
    \ columns=headers)\n```\n\n## 执行数据操作和分析\n\n现在数据已加载到 `DataFrame` 中，您可以使用前面讨论的相同\
    \ Pandas 函数和方法来操作和分析数据。总之，您可以使用 `Beautiful Soup` 和 `Requests` 等库执行网页抓取，从网站提取结构化数据。一旦获得数据，您可以将其加载到\
    \ Pandas `DataFrame` 中以进行进一步处理和分析。这种能力使 Pandas 成为处理来自各种来源（包括动态网页内容）数据的强大工具。\n\n\
    # 处理缺失数据\n\n在数据清洗过程中，解决任何缺失数据至关重要。Pandas 提供了一系列技术来识别、评估和管理缺失数据。这些方法可以通过填补缺失值或删除不完整记录，帮助确保数据分析的准确性和可靠性。在本示例中，我们将假设您已经将\
    \ `Customer_Churn_Modelling.csv` 数据集加载到一个名为 `data` 的 `DataFrame` 中。\n\n## 识别缺失数据\n\
    \n首先，使用 `isna()` 或 `isnull()` 方法检测 `DataFrame` 中的缺失值。`isna()` 方法返回一个形状相同的 `DataFrame`，缺失值为\
    \ `True`，非缺失值为 `False`。\n\n```\nmissing_values = data.isna()\n```\n\n您可以使用 `sum()`\
    \ 方法计算每列的缺失值数量：\n\n```\nmissing_value_counts = data.isna().sum()\nprint(missing_value_counts)\n\
    ```\n\n## 处理缺失数据\n\n在 `DataFrame` 中处理缺失数据有多种方法，例如删除或填充缺失值。选择取决于数据的性质和具体用例。\n\n\
    ### 删除缺失值\n\n`dropna()` 方法从 `DataFrame` 中删除包含缺失值的行或列。默认情况下，它会删除至少包含一个缺失值的任何行：\n\
    \n```\ndata_cleaned = data.dropna()\n```\n\n要删除包含缺失值的列而不是行，请将 `axis` 参数设置为 `1`：\n\
    \n```\ndata_cleaned = data.dropna(axis=1)\n```\n\n### 填充缺失值\n\n`fillna()` 方法使用指定值或指定方法（如前向填充或后向填充）填充缺失值。\n\
    \n用常量值填充缺失值（例如 `0`）：\n\n```\ndata_filled = data.fillna(0)\n```\n\n用各列的平均值填充缺失值：\n\
    \n```\ndata_filled = data.fillna(data.mean())\n```\n\n使用前向填充填充缺失值（将最后一个有效观测值向前传播）：\n\
    \n```\ndata_filled = data.fillna(method='ffill')\n```\n\n使用后向填充填充缺失值（将下一个有效观测值向后传播）：\n\
    \n```\ndata_filled = data.fillna(method='bfill')\n```\n\n## 验证更改\n\n处理缺失数据后，您可以再次使用\
    \ `isna().sum()` 方法确认 `DataFrame` 中不再有缺失值：\n\n```\nmissing_value_counts_cleaned\
    \ = data_cleaned.isna().sum()\nprint(missing_value_counts_cleaned)\n```\n\n总之，Pandas\
    \ 提供了多种方法来处理 `DataFrame` 中的缺失数据。通过使用 `dropna()` 和 `fillna()` 等方法，您可以根据具体要求和数据性质高效地处理缺失值。\n\
    \n"
