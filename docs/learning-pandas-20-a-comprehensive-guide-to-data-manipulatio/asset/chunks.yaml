  fmt: "\n# Custom Aggregation Functions\n\nPandas provide the flexibility to define\
    \ and utilize custom aggregation functions that can be applied to grouped data.\
    \ This feature comes in handy when the built-in aggregation functions are unable\
    \ to cater to the specific needs of the user, or when the user desires to conduct\
    \ intricate calculations on the data. By defining custom aggregation functions,\
    \ the user can tailor their analysis to suit their requirements and derive meaningful\
    \ insights from their data. This functionality enhances the versatility of Pandas\
    \ and empowers users to leverage the power of Python to manipulate data effectively.\
    \ Whether it's a simple calculation or a complex operation, custom aggregation\
    \ functions enable the user to process their data efficiently and derive maximum\
    \ value from it.\n\nLet us work through an example using the `Customer_Churn_Modelling.csv`\
    \ dataset. We'll group the data by `Geography` and `Gender` and calculate the\
    \ range (max-min) of the credit scores for each group using a custom aggregation\
    \ function.\n\n## Read the data\n\n```python\nimport pandas as pd\ndata = pd.read_csv(\"\
    https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv\"\
    )\n```\n\n## Define the custom aggregation function\n\nIn this example, we'll\
    \ create a function to calculate the range (max-min) of a given Series:\n\n```python\n\
    def credit_score_range(series):\n    return series.max() - series.min()\n```\n\
    \n## Group the data using `groupby()`\n\n```python\ngrouped_data = data.groupby(['Geography',\
    \ 'Gender'])\n```\n\nThis creates a `groupby` object with the data grouped by\
    \ `Geography` and `Gender`. You can now apply your custom aggregation function\
    \ to the grouped data.\n\n## Apply the custom aggregation function\n\nIn this\
    \ example, we'll use the `agg()` function to apply our custom aggregation function\
    \ (`credit_score_range`) to the `CreditScore` column of each group:\n\n```python\n\
    credit_score_ranges = grouped_data['CreditScore'].agg(credit_score_range)\n```\n\
    \nThe `credit_score_ranges` variable now contains a Series with the range of credit\
    \ scores for each combination of `Geography` and `Gender`.\n\nYou can also apply\
    \ multiple aggregation functions at once, including built-in and custom functions.\
    \ For example, let us calculate the mean and range of credit scores for each group:\n\
    \n```python\ncredit_score_summary = grouped_data['CreditScore'].agg(['mean', credit_score_range])\n\
    ```\n\nThe `credit_score_summary` variable now contains a DataFrame with the mean\
    \ and range of credit scores for each combination of `Geography` and `Gender`.\n\
    \nIn summary, custom aggregation functions in Pandas allow you to create your\
    \ own aggregation functions and apply them to grouped data. This is useful when\
    \ built-in aggregation functions don't meet your specific needs, or when you want\
    \ to perform more complex calculations on your data. In the given example, we\
    \ created a custom aggregation function to calculate the range of credit scores\
    \ and applied it to the data grouped by `Geography` and `Gender`.\n\n# Summary\n\
    \nIn this chapter, we discussed various advanced operations and techniques in\
    \ Pandas as below:\n\n- **Grouping and Aggregating Data**: We explained how to\
    \ use the `groupby()` function to group data based on one or more columns and\
    \ apply aggregation functions to the grouped data. We used the `Customer_Churn_Modelling.csv`\
    \ dataset as an example and grouped the data by `Geography` and `Gender` to calculate\
    \ the average credit score for each group.\n- **Custom Aggregation Functions**:\
    \ We taught how to create custom aggregation functions and apply them to grouped\
    \ data. We used the same dataset and created a custom aggregation function to\
    \ calculate the range (max-min) of credit scores for each group based on `Geography`\
    \ and `Gender`.\n- **Data Transformation Functions**: We described the `apply()`,\
    \ `map()`, and `applymap()` functions in Pandas, which allow you to apply specific\
    \ functions to elements, rows, or columns in a DataFrame or Series. We provided\
    \ examples of using these functions on the given dataset for various tasks, such\
    \ as calculating the range of values in numeric columns, updating the `Geography`\
    \ column to uppercase values, and rounding all numeric columns to integers.\n\
    - **Merging and Joining DataFrames**: We explained the concepts of merging and\
    \ joining DataFrames and provided a practical example of how to perform these\
    \ operations on the given dataset.\n- **Concatenating and Appending DataFrames**:\
    \ We explained the concepts of concatenating and appending DataFrames and provided\
    \ practical examples of how to perform these operations on the given dataset.\n\
    - **Pivoting and Melting DataFrames**: We described the concepts of pivoting and\
    \ melting DataFrames and provided practical examples of how to perform these operations\
    \ on the given dataset.\n\nThroughout this chapter, we focused on practical examples\
    \ and step-by-step instructions to help you learn and apply these advanced Pandas\
    \ techniques to the `Customer_Churn_Modelling.csv` dataset.\n\n# Chapter 5: Time\
    \ Series and DateTime Operations\n"
  trans: "\n# 自定义聚合函数\n\nPandas 提供了灵活性，允许定义并使用可应用于分组数据的自定义聚合函数。当内置聚合函数无法满足用户的特定需求，或用户希望对数据进行复杂计算时，此功能非常实用。通过定义自定义聚合函数，用户可以根据自身需求定制分析，从数据中获取有意义的见解。此功能增强了\
    \ Pandas 的通用性，赋予用户利用 Python 高效操作数据的能力。无论是简单计算还是复杂操作，自定义聚合函数都能让用户高效处理数据，最大化其价值。\n\
    \n让我们通过 `Customer_Churn_Modelling.csv` 数据集来演示一个示例。我们将按 `Geography` 和 `Gender`\
    \ 对数据分组，并使用自定义聚合函数计算每组信用评分的极差（最大值-最小值）。\n\n## 读取数据\n\n```python\nimport pandas\
    \ as pd\ndata = pd.read_csv(\"https://raw.githubusercontent.com/kittenpub/database-repository/main/Customer_Churn_Modelling.csv\"\
    )\n```\n\n## 定义自定义聚合函数\n\n在本例中，我们将创建一个函数来计算给定 Series 的极差（最大值-最小值）：\n\n```python\n\
    def credit_score_range(series):\n    return series.max() - series.min()\n```\n\
    \n## 使用 `groupby()` 分组数据\n\n```python\ngrouped_data = data.groupby(['Geography',\
    \ 'Gender'])\n```\n\n这将创建一个按 `Geography` 和 `Gender` 分组的 `groupby` 对象。现在您可以将自定义聚合函数应用于分组数据。\n\
    \n## 应用自定义聚合函数\n\n在本例中，我们将使用 `agg()` 函数将自定义聚合函数 (`credit_score_range`) 应用于每组的\
    \ `CreditScore` 列：\n\n```python\ncredit_score_ranges = grouped_data['CreditScore'].agg(credit_score_range)\n\
    ```\n\n`credit_score_ranges` 变量现在包含一个 Series，其中存储了每种 `Geography` 和 `Gender` 组合下的信用评分极差。\n\
    \n您还可以同时应用多个聚合函数，包括内置函数和自定义函数。例如，让我们计算每组信用评分的平均值和极差：\n\n```python\ncredit_score_summary\
    \ = grouped_data['CreditScore'].agg(['mean', credit_score_range])\n```\n\n`credit_score_summary`\
    \ 变量现在包含一个 DataFrame，其中存储了每种 `Geography` 和 `Gender` 组合下的信用评分平均值和极差。\n\n总之，Pandas\
    \ 中的自定义聚合函数允许您创建自己的聚合函数并将其应用于分组数据。当内置聚合函数无法满足您的特定需求，或您想对数据执行更复杂的计算时，这非常有用。在给定示例中，我们创建了一个自定义聚合函数来计算信用评分的极差，并将其应用于按\
    \ `Geography` 和 `Gender` 分组的数据。\n\n# 总结\n\n在本章中，我们讨论了 Pandas 中的各种高级操作和技术，如下所示：\n\
    \n- **分组与聚合数据**：我们解释了如何使用 `groupby()` 函数根据一列或多列对数据进行分组，并对分组数据应用聚合函数。我们以 `Customer_Churn_Modelling.csv`\
    \ 数据集为例，按 `Geography` 和 `Gender` 对数据分组，计算每组的平均信用评分。\n- **自定义聚合函数**：我们讲授了如何创建自定义聚合函数并将其应用于分组数据。我们使用相同的数据集，创建了一个自定义聚合函数，根据\
    \ `Geography` 和 `Gender` 计算每组信用评分的极差（最大值-最小值）。\n- **数据转换函数**：我们描述了 Pandas 中的 `apply()`、`map()`\
    \ 和 `applymap()` 函数，它们允许您将特定函数应用于 DataFrame 或 Series 中的元素、行或列。我们提供了在给定数据集上使用这些函数执行各种任务的示例，例如计算数值列的值域、将\
    \ `Geography` 列更新为大写值，以及将所有数值列四舍五入为整数。\n- **合并与连接 DataFrame**：我们解释了合并和连接 DataFrame\
    \ 的概念，并提供了在给定数据集上执行这些操作的实际示例。\n- **连接与追加 DataFrame**：我们解释了连接和追加 DataFrame 的概念，并提供了在给定数据集上执行这些操作的实际示例。\n\
    - **数据透视与熔化 DataFrame**：我们描述了数据透视和熔化 DataFrame 的概念，并提供了在给定数据集上执行这些操作的实际示例。\n\n\
    贯穿全章，我们专注于实际示例和分步说明，帮助您学习并将这些高级 Pandas 技术应用于 `Customer_Churn_Modelling.csv` 数据集。\n\
    \n# 第 5 章：时间序列与 DateTime 操作\n"
