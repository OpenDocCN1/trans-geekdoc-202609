    # Basics of Indexing and Selection


    Efficient data analysis and manipulation rely heavily on the ability to access,
    filter, and modify specific data points, rows, or columns within a DataFrame.
    Pandas provides an array of essential tools for performing these fundamental operations,
    such as indexing and selection. These tools not only allow for the quick and easy
    retrieval of specific data, but they also enable data cleaning and transformation
    tasks to be performed with greater accuracy and speed. With Pandas'' robust indexing
    and selection capabilities, data analysts and scientists can efficiently handle
    complex data sets and extract insights that drive informed decision-making.


    In this example, we''ll assume you have already loaded the `Customer_Churn_Modelling.csv`
    dataset into a DataFrame called `data`.


    ## Selecting Columns


    You can select a single column using the column name:


    ```

    credit_scores = data[''CreditScore'']

    ```


    Or multiple columns by providing a list of column names:


    ```

    selected_columns = data[[''CreditScore'', ''Age'', ''Exited'']]

    ```


    ## Selecting Rows by Index


    You can select rows using the `iloc[]` and `loc[]` properties. The `iloc[]` property
    is used for integer-based indexing, while the `loc[]` property is used for label-based
    indexing.


    Using `iloc[]` to select the first row:


    ```

    first_row = data.iloc[0]

    ```


    Using `iloc[]` to select multiple rows:


    ```

    rows_2_to_4 = data.iloc[1:4]

    ```


    Using `loc[]` to select a specific row by index label (assuming the DataFrame
    has a custom index):


    ```

    row_with_label = data.loc[''index_label'']

    ```


    ## Selecting Specific Data Points


    You can combine row and column selections to access specific data points.


    Using `iloc[]` to select the value in the first row and first column:


    ```

    first_value = data.iloc[0, 0]

    ```


    Using `loc[]` to select a value by row and column labels (assuming the DataFrame
    has a custom index):


    ```

    specific_value = data.loc[''index_label'', ''CreditScore'']

    ```


    ## Conditional Selection


    You can use boolean conditions to filter rows based on certain criteria. For example,
    to select rows where `''Exited''` is equal to 1:


    ```

    exited_rows = data[data[''Exited''] == 1]

    ```


    You can also combine multiple conditions using the `&` (and) or `|` (or) operators:


    ```

    exited_and_has_credit_card = data[(data[''Exited''] == 1) & (data[''Has_Credit_Card'']
    == True)]

    ```


    ## Setting Custom Index


    You can set a custom index using the `set_index()` method. For example, to set
    the `''CustomerId''` column as the index:


    ```

    data = data.set_index(''CustomerId'')

    ```


    Remember that this operation creates a new DataFrame with the custom index. If
    you want to modify the existing DataFrame, set the `inplace` parameter to `True`:


    ```

    data.set_index(''CustomerId'', inplace=True)

    ```


    In summary, indexing and selection are fundamental operations in Pandas that allow
    you to access and manipulate specific data points, rows, or columns within a DataFrame.
    By using methods like `iloc[]`, `loc[]`, and conditional selections, you can perform
    various data analysis, cleaning, and transformation tasks efficiently.


    # Multi-Indexing and Hierarchical Indexing


    Hierarchical indexing, also referred to as multi-indexing, is a feature of Pandas
    that facilitates the creation of multiple levels of index in a single DataFrame.
    This functionality is particularly useful when dealing with complex, multi-dimensional
    datasets, as it allows for more organized and natural handling of the data. By
    setting up a hierarchical index, users can easily slice and manipulate subsets
    of data based on specific index levels, allowing for more precise and efficient
    analysis. In addition, hierarchical indexing can help to reduce the need for reshaping
    and restructuring of data, which can save time and effort in the data preparation
    phase of analysis.


    Let us assume you''ve already loaded the `Customer_Churn_Modelling.csv` dataset
    into a DataFrame called `data`. We''ll create a multi-level index based on the
    `''Geography''` and `''Gender''` columns.


    ## Creating Multi-level Index


    You can create a multi-level index using the `set_index()` method and providing
    a list of columns:


    ```

    data_multi = data.set_index([''Geography'', ''Gender''])

    ```


    Now, the DataFrame has a multi-level index based on `''Geography''` and `''Gender''`.
    To view the first few rows of the DataFrame:


    ```

    print(data_multi.head())

    ```


    ## Accessing Data with Multi-level Index


    You can use the `loc[]` property to access data within the multi-level index.
    For example, to access all data for the `''France''` and `''Female''` group:


    ```

    france_female = data_multi.loc[(''France'', ''Female'')]

    ```


    ## Slicing with Multi-level Index


    Using the `slice(None)` function, you can perform slicing operations on a multi-level
    index. For example, to select all rows where `''Geography''` is `''Germany''`:


    ```

    germany_data = data_multi.loc[(slice(''Germany'', ''Germany''), slice(None)),
    :]

    ```


    ## Selecting Data at Specific Level


    You can use the `xs()` method to select data at a specific level. For example,
    to select all data where `''Gender''` is `''Male''`:


    ```

    male_data = data_multi.xs(''Male'', level=''Gender'', axis=0)

    ```


    ## Swapping Levels


    You can swap levels of a multi-level index using the `swaplevel()` method. For
    example, to swap the `''Geography''` and `''Gender''` levels:


    ```

    data_swapped = data_multi.swaplevel(''Geography'', ''Gender'')

    ```


    ## Sorting Multi-level Index


    You can sort the DataFrame based on index levels using the `sort_index()` method.
    To sort the DataFrame by the `''Geography''` and `''Gender''` levels:


    ```

    data_sorted = data_multi.sort_index(level=[''Geography'', ''Gender''])

    ```


    ## Resetting Multi-level Index


    To reset a multi-level index and convert it back to columns, use the `reset_index()`
    method:


    ```

    data_flat = data_multi.reset_index()

    ```


    In summary, multi-indexing or hierarchical indexing in Pandas allows you to have
    multiple index levels within a single DataFrame, providing a more structured and
    intuitive way to handle higher-dimensional data. By creating a multi-level index
    with the `set_index()` method and using various methods like `loc[]`, `xs()`,
    `swaplevel()`, and `sort_index()`, you can efficiently manipulate and access data
    within a multi-level index.

