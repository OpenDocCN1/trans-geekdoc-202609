    # Indexing with Booleans and Conditional Selection


    Indexing with Booleans and Conditional Selection enables filtering of rows in
    a DataFrame based on specific conditions. These techniques are valuable for a
    range of data analysis, cleaning, and transformation tasks. By using Boolean indexing,
    you can select rows of data that satisfy specific criteria, such as selecting
    all rows where a particular column meets a certain condition. Similarly, conditional
    selection allows you to filter data based on more complex criteria, such as selecting
    all rows where multiple columns meet specific conditions. These techniques are
    powerful tools for data manipulation and can be applied in various contexts, such
    as data preprocessing, exploratory data analysis, and machine learning.


    We''ll assume you have already loaded the `Customer_Churn_Modelling.csv` dataset
    into a DataFrame called `data`.


    ## Boolean Indexing


    Boolean indexing involves creating a boolean mask, a Pandas Series with the same
    index as the DataFrame and containing `True` or `False` values based on a condition.
    When this mask is applied to the DataFrame, only the rows with `True` values are
    selected.


    For example, let us create a boolean mask for rows where the `''Exited''` column
    is equal to 1:


    ```

    mask = data[''Exited''] == 1

    ```


    Now, apply the boolean mask to the DataFrame to filter the rows:


    ```

    exited_customers = data[mask]

    ```


    You can also apply the mask directly:


    ```

    exited_customers = data[data[''Exited''] == 1]

    ```


    ## Conditional Selection with Multiple Conditions


    You can use the `&` (and) or `|` (or) operators to combine multiple conditions.


    For example, to select rows where `''Exited''` is equal to 1 and `''Age''` is
    greater than 40:


    ```

    exited_and_age_above_40 = data[(data[''Exited''] == 1) & (data[''Age''] > 40)]

    ```


    Or, to select rows where `''Exited''` is equal to 1 or `''Age''` is greater than
    40:


    ```

    exited_or_age_above_40 = data[(data[''Exited''] == 1) | (data[''Age''] > 40)]

    ```


    ## Using `query()` Method for Conditional Selection


    Another way to perform conditional selection is by using the `query()` method.
    This method allows you to write conditions as a string expression.


    For example, to select rows where `''Exited''` is equal to 1 and `''Age''` is
    greater than 40:


    ```

    exited_and_age_above_40 = data.query("Exited == 1 and Age > 40")

    ```


    In summary, Boolean indexing and conditional selection in Pandas allow you to
    filter rows in a DataFrame based on specific conditions. By creating boolean masks,
    combining multiple conditions with `&` or `|` operators, or using the `query()`
    method, you can perform various data analysis, cleaning, and transformation tasks
    more efficiently.


    # Using `.loc[]`, `.iloc[]`, and `.at[]`


    The `.loc[]`, `.iloc[]`, and `.at[]` properties in Pandas are used for accessing
    and selecting data in DataFrames based on different criteria. They are useful
    for data analysis, cleaning, and transformation tasks.


    Let us assume you have already loaded the `Customer_Churn_Modelling.csv` dataset
    into a DataFrame called `data`.


    ## `.loc[]` Property


    The `.loc[]` property is used for label-based indexing. You can use it to select
    data by row and column labels.


    For example, assuming you have set the `''CustomerId''` column as the index:


    ```

    data = data.set_index(''CustomerId'')

    ```


    To select data for a specific credit score:


    ```

    customer_data = data.loc[15745662, ''CreditScore'']

    ```


    To select multiple rows and columns using the `.loc[]` property, you can pass
    in lists or slices of labels:


    ```

    selected_customers = data.loc[[15745662, 15734523], [''CreditScore'', ''Age'']]

    selected_rows_columns = data.loc[15745662:15734523, ''CreditScore'':''Age'']

    ```


    ## `.iloc[]` Property


    The `.iloc[]` property is used for integer-based (positional) indexing. You can
    use it to select data by row and column positions.


    For example, to select data from the first row and the second column:


    ```

    first_row_second_column = data.iloc[0, 1]

    ```


    To select multiple rows and columns using the `.iloc[]` property, you can pass
    in lists or slices of positions:


    ```

    selected_rows = data.iloc[[0, 1, 2], :]

    selected_columns = data.iloc[:, [0, 1, 2]]

    selected_rows_columns = data.iloc[0:3, 0:3]

    ```


    ## `.at[]` Property


    The `.at[]` property is used for fast label-based indexing of scalar values. It
    is similar to `.loc[]` but is optimized for accessing single data points, making
    it faster for this specific use case.


    For example, to select data for a specific customer ID and column:


    ```

    customer_data = data.at[15745662, ''CreditScore'']

    ```


    Keep in mind that `.at[]` can only be used for accessing single data points and
    not for selecting multiple rows or columns.


    In summary, the `.loc[]`, `.iloc[]`, and `.at[]` properties in Pandas are used
    for accessing and selecting data in DataFrames based on different criteria: label-based
    indexing for `.loc[]` and `.at[]`, and integer-based (positional) indexing for
    `.iloc[]`. By using these properties, you can efficiently perform various data
    analysis, cleaning, and transformation tasks.


    # Slicing and Subsetting Data


    Pandas offers slicing and subsetting techniques that enable users to extract particular
    rows, columns, or data points within a DataFrame based on their positions or index
    labels. These methods are valuable for tasks such as data analysis, cleaning,
    and transformation. By using slicing, one can slice a DataFrame and select the
    desired rows and columns. Subsetting is another technique that involves creating
    a new DataFrame based on a subset of the original data. With these methods, users
    can easily isolate relevant data and perform necessary modifications without affecting.


    Now, let us assume you have already loaded the `Customer_Churn_Modelling.csv`
    dataset into a DataFrame called `data`.


    ## Slicing Rows


    You can slice rows by their positions using the `iloc[]` property with a start
    and end index.


    For example, to select rows from index 5 to 9:


    ```

    subset_rows = data.iloc[5:10]

    ```


    ## Slicing Columns


    You can also slice columns by their positions using the `iloc[]` property.


    For example, to select the first three columns:


    ```

    subset_columns = data.iloc[:, :3]

    ```


    ## Slicing Rows and Columns


    You can combine row and column slicing using the `iloc[]` property.


    For example, to select rows from index 5 to 9 and the first three columns:


    ```

    subset_data = data.iloc[5:10, :3]

    ```


    ## Slicing with `loc[]` Property


    If you want to slice based on index labels instead of positions, you can use the
    `loc[]` property.


    For example, assuming you have set `''CustomerId''` as the index, to select rows
    with index labels 15634602 to 15634606:


    ```

    subset_data_labels = data.loc[15634602:15634606, :]

    ```


    ## Subsetting Data based on Column Names


    You can select specific columns by providing a list of column names.


    For example, to select only the `''CreditScore''`, `''Age''`, and `''Exited''`
    columns:


    ```

    selected_columns = data[[''CreditScore'', ''Age'', ''Exited'']]

    ```


    ## Subsetting Data with Conditions (Boolean Indexing)


    You can use Boolean indexing to select rows based on specific conditions.


    For example, to select rows where `''Exited''` is equal to 1:


    ```

    exited_customers = data[data[''Exited''] == 1]

    ```


    ## Subsetting Data using `query()` Method


    You can use the `query()` method to filter rows based on specific conditions expressed
    as a string.


    For example, to select rows where `''Exited''` is equal to 1 and `''Age''` is
    greater than 40:


    ```

    exited_and_age_above_40 = data.query("Exited == 1 and Age > 40")

    ```


    In summary, slicing and subsetting data in Pandas allow you to select specific
    rows, columns, or data points within a DataFrame based on their positions, index
    labels, or conditions. By using methods like `iloc[]`, `loc[]`, Boolean indexing,
    or the `query()` method, you can perform various data analysis, cleaning, and
    transformation tasks more efficiently.

