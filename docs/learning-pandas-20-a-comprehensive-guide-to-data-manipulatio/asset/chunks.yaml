    \ 'Balance', 'NumOfProducts', 'EstimatedSalary']\ndata[numerical_columns] = data[numerical_columns].applymap(np.round)\n\
    ```\n\nIn summary, you can use indexing and selection techniques in Pandas, such\
    \ as `.at[]`, `.iat[]`, boolean indexing, and the `.apply()` and `.applymap()`\
    \ methods, to modify data in DataFrames. These techniques are useful for various\
    \ data analysis, cleaning, and transformation tasks.\n\n# Advanced Indexing Techniques\n\
    \n## Cross-section (`xs()`) Method\n\nThe `xs()` method allows you to select data\
    \ based on a specific level of a multi-indexed DataFrame. This can be useful when\
    \ you have a DataFrame with hierarchical indexing. Let us create a multi-indexed\
    \ DataFrame with `'Geography'` and `'Gender'` as index levels:\n\n```python\n\
    multi_indexed_data = data.set_index(['Geography', 'Gender'])\n```\n\nNow, you\
    \ can use the `xs()` method to select data for a specific level:\n\n```python\n\
    german_customers = multi_indexed_data.xs('Germany', level='Geography')\n```\n\n\
    ## `where()` Method\n\nThe `where()` method allows you to filter data based on\
    \ conditions while keeping the original shape of the DataFrame. This can be useful\
    \ when you want to preserve the DataFrame structure or visualize the data. For\
    \ example, to keep only rows where `'Exited'` is equal to `1` and replace others\
    \ with `NaN`:\n\n```python\nexited_customers = data.where(data['Exited'] == 1)\n\
    ```\n\n## `mask()` Method\n\nThe `mask()` method works similarly to the `where()`\
    \ method but inverts the condition. Instead of keeping the data points that meet\
    \ the condition, it replaces them with `NaN` or a specified value. For example,\
    \ to replace the `'CreditScore'` values of all customers who exited with `NaN`:\n\
    \n```python\ndata['CreditScore'] = data['CreditScore'].mask(data['Exited'] ==\
    \ 1)\n```\n\n## `isin()` Method\n\nThe `isin()` method allows you to filter data\
