    modernized codebase, improved documentation, enhanced error messages, a structured
    deprecation policy, and a community-driven development process. Next, we delved
    into the primary data structures in Pandas: `Series` and `DataFrame`. We provided
    a detailed explanation of their structure, components, and how they work. We emphasized
    that both `Series` and `DataFrame` offer a wide range of methods and functionality
    for data manipulation and analysis, making them essential tools for data science
    tasks. Lastly, we went through a step-by-step walkthrough on accessing and modifying
    data from a CSV file using Pandas. We demonstrated how to download the file, load
    it using Pandas, inspect its structure and contents, and access and modify the
    data using various functions and methods. We also showed how to save the modified
    `DataFrame` to a new CSV file.


    # Chapter 2: Data Read, Storage, and File Formats


    ## Reading CSV, Excel and JSON Data


    Pandas provides several functions to read data from multiple formats, making it
    a versatile tool for working with different data sources. Some of the popular
    data formats supported by Pandas are CSV, JSON, Excel (XLS and XLSX), SQL, HTML,
    and more. Now, let us assume the `Customer_Churn_Modelling` dataset is available
    in JSON and XLS formats. We will go through step-by-step instructions to read
    the data from these formats.


    ### Download Files in JSON and XLS Formats


    First, you''ll need to have the `Customer_Churn_Modelling` dataset in JSON and
    XLS formats. You can convert the existing CSV file using an online converter or
    use a tool like Microsoft Excel or LibreOffice Calc to save the data in the desired
    format.


    ### Read Data using Pandas


    #### Reading JSON data


    To read data from a JSON file, you can use the `pd.read_json()` function in Pandas:


    ```python

    import pandas as pd

    # Replace ''path/to/your/json'' with the actual file path on your local machine

    json_file_path = ''path/to/your/json/Customer_Churn_Modelling.json''

    data_json = pd.read_json(json_file_path)

    ```


    #### Reading Excel (XLS or XLSX) data


    To read data from an Excel file, you can use the `pd.read_excel()` function in
    Pandas. Note that you''ll need to have the `openpyxl` package installed for reading
    XLSX files and `xlrd` package for reading XLS files.


    ```bash

    # Install openpyxl and xlrd using pip

    pip install openpyxl xlrd

    ```


    ```python

    import pandas as pd

    # Replace ''path/to/your/xls'' with the actual file path on your local machine

    xls_file_path = ''path/to/your/xls/Customer_Churn_Modelling.xls''

    data_xls = pd.read_excel(xls_file_path)

    ```


    ### Inspect the Data


    After loading the data, you can inspect the DataFrames to ensure that the data
    has been read correctly:


    ```python

    # Display the first few rows of the JSON DataFrame

    print(data_json.head())

    # Display the first few rows of the Excel DataFrame

    print(data_xls.head())

    ```


    ### Perform Data Manipulation and Analysis


    Once the data is loaded, you can use the same Pandas functions and methods discussed
    earlier to manipulate and analyze the data, regardless of the original file format.
    In summary, Pandas provides a seamless way to read data from various file formats,
    enabling users to work with different data sources without any hassle. By using
    appropriate functions like `pd.read_json()` and `pd.read_excel()`, you can load
    data from JSON and Excel files into DataFrames and perform data manipulation and
    analysis tasks as needed.


    ## Writing Data to Different Formats


    Pandas allows you to write DataFrames to different file formats easily. In this
    example, we''ll assume you have already loaded the `Customer_Churn_Modelling.csv`
    dataset into a DataFrame called `data`. We''ll now demonstrate how to write the
    data to various formats such as JSON, Excel (XLSX), and HTML.


    ### Write to JSON Format


    To write the DataFrame to a JSON file, you can use the `to_json()` method:


    ```python

    # Replace ''path/to/your/output'' with the actual output file path on your local
    machine

    json_output_path = ''path/to/your/output/Customer_Churn_Modelling_output.json''

    data.to_json(json_output_path)

    ```


    ### Write to Excel (XLSX) Format


    To write the DataFrame to an Excel file, you can use the `to_excel()` method.
    Make sure you have the `openpyxl` package installed to write XLSX files.


    ```bash

    # Install openpyxl using pip

    pip install openpyxl

    ```


    ```python

    # Replace ''path/to/your/output'' with the actual output file path on your local
    machine

    xlsx_output_path = ''path/to/your/output/Customer_Churn_Modelling_output.xlsx''

    data.to_excel(xlsx_output_path, index=False, engine=''openpyxl'')

    ```


    ### Write to HTML Format


    To write the DataFrame to an HTML file, you can use the `to_html()` method:


    ```python

    # Replace ''path/to/your/output'' with the actual output file path on your local
    machine

    html_output_path = ''path/to/your/output/Customer_Churn_Modelling_output.html''

    data.to_html(html_output_path, index=False)

    ```


    These are just a few examples of the output formats supported by Pandas. You can
    also write DataFrames to other formats like Parquet, Stata, and more. To write
    to these formats, you''ll need to use the respective methods like `to_parquet()`,
    `to_stata()`, etc., and have the necessary packages installed. In summary, Pandas
    provides an easy way to write DataFrames to various file formats, making it simple
    to share and store your data. By using the appropriate methods like `to_json()`,
    `to_excel()`, and `to_html()`, you can save the data from a DataFrame to different
    formats as required.

