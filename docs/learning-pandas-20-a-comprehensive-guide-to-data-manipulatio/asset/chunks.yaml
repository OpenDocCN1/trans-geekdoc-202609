    `pd.Timestamp()` 函数来创建 `Timestamp` 对象。


    ```

    import pandas as pd

    timestamp_example = pd.Timestamp(''2023-04-12 12:00:00'')

    print(timestamp_example)

    ```


    ## Period


    `Period` 对象代表一个时间跨度或持续时间，例如一天、一个月或一年。你可以通过将日期或日期时间字符串和频率传递给 `pd.Period()` 函数来创建
    `Period` 对象。


    ```

    period_example = pd.Period(''2023-04'', freq=''M'')

    print(period_example)

    ```


    ## Timedelta


    `Timedelta` 对象代表两个日期或时间之间的差值。它是 Python `datetime.timedelta` 对象在 `Pandas` 中的等价物。你可以通过将持续时间字符串传递给
    `pd.Timedelta()` 函数来创建 `Timedelta` 对象。


    ```

    timedelta_example = pd.Timedelta(''1 day'')

    print(timedelta_example)

    ```


