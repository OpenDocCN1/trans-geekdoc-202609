    \n## HIERARCHICAL CLERING\n\nHierarchical clustering is a unsupervised learning\
    \ algorithm used for clustering. It is of two types:\n\n### Agglomerative\n\n\
    Agglomerative clustering will be discussed. The steps to be followed to apply\
    \ agglomerative clustering are:\n- `STEP-1`: Make each point as a single cluster.\n\
    - `STEP-2`: Take the two closest points and group them.\n- `STEP-3`: Take the\
    \ next closest points and group them.\n- `STEP-4`: Repeat `step-3` until there\
    \ is 1 cluster. \n\nNote: To check the euclidean distance.\n\nThe dendogram diagram\
    \ is drawn to find the optimal number of clusters. ![Screenshot (1163).png](images/00353.jpeg)\n\
    \nThe output after applying the first step is grouping two points: ![Screenshot\
    \ (1164).png](images/00354.jpeg)\n\nGrouping the next nearest points: ![Screenshot\
    \ (1165).png](images/00355.jpeg)\n\nContinue the process of grouping until one\
    \ cluster is obtained ![Screenshot (1166).png](images/00356.jpeg)\n\nThe dissimilarity\
    \ threshold maintains a dissimilarity level. It can be observed that all the clusters\
    \ below the dissimilarity threshold have less than `a`. To consider an optimal\
    \ threshold a vertical line which doesn’t cross any line should be considered.\
    \ The number of clusters can be calculated by counting the number of vertical\
    \ lines.\n\nHierarchical clustering in python: Table 6.2 gives the information\
    \ about the country, age, gender and protein intake of various people.\n\nTable\
