    ## 4.3. SUPPORT VECTOR REGRESSION


    The support vector machine is a famous machine learning algorithm that works for
    both regeression and classification. This algorithm supports both linear and non
    linear data. The SVM algorithm selects a hyperplane which is defined as the line
    that helps us to find continuous values. ![Screenshot (869).png](images/00197.jpeg)From
    the above diagram it is observed that the hyperplane is bounded by two lines on
    either side. These lines are known as boundary lines. These lines create margin
    . Margin is defined as the perpendicular distance between hyperplane and the closest
    points. In order to fit all the data points the SVR algorithm maximises this margin.
    The data points that are nearest to the hyperplane that assists in defining the
    margin are known as support vectors. Therefore, a hyperplane that perfectly divides
    the data into two classes cannot be found, sometimes the constraint of maximising
    the margin should be kept aside and some of the points should be excused for violating
    the margin. The main goal of the SVR algorithm is to have as many support vectors
    as possible with in the boundary lines. The only difference between SVR and linear
    regression is that ,linear regression aims at minimizing the error whereas SVR
    tries to keep it within a threshold.


    ### Math behind support vector regression


    The basic idea in SVR is to minimize the error and maximise the margin. The equation
    of the hyperplane is given as: ![](images/00198.jpeg)![](images/00199.jpeg)

