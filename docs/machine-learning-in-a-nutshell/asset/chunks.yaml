    # 4.1. 线性回归


    线性回归是一种执行回归任务的监督学习机器学习算法。回归模型被广泛用于预测变量与输出之间的关系。线性回归通过根据给定的自变量来预测因变量的值。回归识别了自变量与因变量之间的关系。


    ![Screenshot (757).png](img/00040.jpeg)


    在上述方程中，`Y` 是因变量，`![](img/00041.jpeg)`、`![](img/00042.jpeg)`、`…..` 是自变量。为了根据给定数据获得上述直线，需要绘制自变量与因变量之间的图。线性回归算法通过这些数据点画出几条线，这些线的形式为上述的方程。然后它从中选择一条。


    回归器会计算它所考虑的每条线中，实际值与直线预测值之间差的平方和。然后，回归器将选择平方和最小的那条线。这条线被称为最佳拟合线。


    ### 线性回归背后的数学原理


    考虑一个具有 `n` 个自变量和一个因变量的数据集。给定的数据集如下：![](img/00043.jpeg)


