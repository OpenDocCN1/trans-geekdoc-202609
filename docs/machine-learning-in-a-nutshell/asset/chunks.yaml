    ## 4.4. 决策树回归


    决策树算法是机器学习中最流行且应用最广泛的算法之一。决策树算法既可以用于回归也可以用于分类。该算法被描述为一棵树，其中节点是输入或自变量，分支是机器的决策，而叶节点则被视为输出或因变量值。在回归案例中，`DTA`
    使用最小二法距离来选择特征。给定的数据被划分。这种划分被称为叶节点。创建的划分增加了关于分面同一侧点的信息。如果数据中的某些特定点具有相似性，则对数据进行划分。在划分数据时，点被进行分组，因此
    `DTA` 为数据点增加了值。当需要添加的信息非常非常少时，算法会停止划分过程。与其他回归技术相比，决策树回归易于理解。


    ### 将决策树回归应用于数据集


    考虑任意两个自变量 `X1` 和 `X2` 之间的散点图：![Screenshot (875).png](img/00210.jpeg) 上述散点图的决策树所示：![Screenshot
    (876).png](img/00211.jpeg) 每次划分的因变量值是通过取该特定划分或叶节点中所有因变量值的平均值得到的。当给一个新的输入来预测输出时，会检查该点所属的划分。然后将叶节点中的因变量值赋值给输入。![](img/00212.jpeg)


