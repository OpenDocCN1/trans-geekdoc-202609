    ### 9.2.2. LINEAR DISCRIMINANT ANALYSIS


    The `LDA` is a dimensionality reduction technique whose objective is to project
    the dataset on to a lower dimensional space. `LDA` and `PCA` both aim to reduce
    the dimension of the data set but `PCA` is unsupervised learning and `LDA` is
    supervised learning. That is `PCA` doesn’t check the relation between independent
    variables when dimentionally reducing them but `LDA` understands this relation
    and it projects the feature space onto a small subspace while maintainig the class
    discriminatory information.


    Consider the scatter plot of a data set: ![Screenshot (1231).png](images/00421.jpeg)
    The data is two dimentional, we now project all points to `x1` and make it single
    dimensioned. ![Screenshot (1232).png](images/00422.jpeg)


    The single dimension supressed data set. ![](images/00423.jpeg) But in this method
    we lost information, Therefore what `LDA` does is that it creates a line which
    the relation between the variables is preserved. It also minimises the variance
    and it creates class separation within data. ![](images/00424.jpeg) The new dimension
    created by `LDA` is as follows: ![Screenshot (1305).png](images/00425.jpeg)


