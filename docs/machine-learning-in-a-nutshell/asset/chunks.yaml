    ## 5.2. KNEAREST NEIGHBORS CLASSIFICATION


    This is a classification technique which helps in classifying a new point into
    a category considering the nearest traning set points. Consider a scatter plot
    of some random data: ![Screenshot (938).png](images/00242.jpeg)


    In the scatter plot two different categories are present , one represented by
    blue and the other represented by red. A new point is given for us to predict
    into which category it falls into. ![Screenshot (939).png](images/00243.jpeg)The
    new data point is represented in black. Now `knearest` algorithm is applied to
    the data to categorise it.


    ### Steps to be followed for knearest neighbors:

    - **STEP-1**: Choose the number of `k` neighbors

    - **STEP-2**: Take the `k` nearest neighbors of the new data point, according
    to the `euclidean distance`.

    - **STEP-3**: Among these `k` neighbors, count the number of data points in each
    category.

    - **STEP-4**: Assign the new data point to the category where you counted the
    most neighbors.


    Consider `k=3` for the above scatter plot, three closest points to the new point
    should be selected from the data set. ![Screenshot (940).png](images/00244.jpeg)In
    the three closest points two are red points and one blue point is selected, therefore
    according to the `knearest` algorithm the new data poin belongs to the red category.


