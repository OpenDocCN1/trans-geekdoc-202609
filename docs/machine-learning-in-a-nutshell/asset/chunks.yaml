    ### 9.2.2. 线性判别分析 (LINEAR DISCRIMINANT ANALYSIS)


    `LDA` 是一种降维技术，其目标是将数据集投影到低维空间。`LDA` 和 `PCA` 均旨在减少数据集的维度，但 `PCA` 是无监督学习，而 `LDA`
    是有监督学习。也就是说，`PCA` 在降维时不检查独立变量之间的关系，但 `LDA` 理解这种关系，并将特征空间投影到一个较小的子空间，同时保持类别判别信息。


    考虑数据集的散点图![Screenshot (1231).png](img/00421.jpeg) 数据是二维的，我们现在将所有点投影到 `x1` 并使其变为一维![Screenshot
    (1232).png](img/00422.jpeg)


    单维压缩后的数据集![](img/00423.jpeg)但在这种方法中我们丢失了信息，因此 `LDA` 的做法是创建一条保留变量间关系的直线。它还最小化了方差并在数据内部创建类别分离![images/00424.jpeg)
    `LDA` 创建的新维度如下：![Screenshot (1305).png](img/00425.jpeg)


