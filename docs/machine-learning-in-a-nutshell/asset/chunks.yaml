    ### 4.2 POLYNOMIAL REGRESSION


    In simple linear regression a linear relationship was found between the predictor
    and the output. Consider the following scatter plot for a given dataset. If simple
    linear regression is applied to these data points the output will be a straight
    line which is called the best fitting line. The best fitting line is only good
    for data which are linear those points which can be fitted on to a straight line.
    For the given scatter plot a curve can best fit all the point. Here comes the
    role of polynomial regression. Most of the data obtained is not linear. Therefore,
    polynomial regression gives more close and better results than linear regression.
    Polynomial linear regression is a regression algorithm that models the relationship
    between the dependent variable and the independent variable as nth degree polynomial.
    Where, `b` is the dependent variable `a` is the independent variable are constants.
    With the increase in the degree of the polynomial better outcomes are obtained.

