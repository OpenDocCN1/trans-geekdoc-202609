    (749).png](img/00029.jpeg)第 34 到 38 行代码有助于缩放数据。从 `sklearn` 库中导入了 `Standardscaler`
    函数。定义了一个名为 `sc_x` 的新变量，通过它调用 `standardscaler` 函数。现在将独立变量测试集和训练集拟合到 `standardscaler`
    函数。![Screenshot (750).png](img/00030.jpeg)[点击此处获取上述数据集和 Python 代码。](https://drive.google.com/drive/folders/1BPgKbrxomaeJI0nN8JptMpCeN60J4vzv?usp=sharing)


    ## 3.7. 距离的类型


    机器学习应用于聚类、分类、图像识别和信息检索过程中。选择良好的距离度量起着至关重要的作用。几乎所有的机器学习算法都使用距离度量来评估输入数据模式以预测任何基于数据的决策。有很多不同的距离，下面讨论了其中的三种。


    ### 明可夫斯距离 (Minkowski Distance)

    明可夫斯距离是范向量空间中的一种度量。范向量空间是指了范数的向量空间。假设 `X` 是向量空间，那么 `X` 上的范数是一个实值函数 `||x ||`，它满足以下条件：


    1. **零向量** - 零向量的长度为零。

    2. **标量因子** - 当你将向量乘以一个正数时，向量的方向不会改变，但它的长度会改变。

    3. **三角形不等式** - 如果距离是一个范数，那么两点之间的计算距离将始终是直线。


    使用公式计算距离：![Screenshot (751).png](img/00031.jpeg)明可夫斯距离是一种广距离，通过改变 `p` 的值可以找到两点之间不同的距离。


    ### 曼哈顿距离 (Manhattan Distance)

    当要在网格路径中计算两点之间的距离时，曼哈顿距离派上用场。在曼哈顿距离的情况下，`p` 的值为 1![](img/00032.jpeg)`x` 和 `y`
    之间的距离由其笛卡尔坐标差的绝对和给出。![Screenshot (753).png](img/00033.jpeg)其中 `n`=变量个数![](img/00034.jpeg)且![](img/00035.jpeg)分别是
    `x` 和 `y` 的变量。


    ### 欧几里得距离 (Euclidean Distance)

    这是最常用的距离度量。在欧几里得距离的情况下，`p` 的值为 2。欧几里得距离是任意两点之间简单的直线距离。公式如下：![Screenshot (761).png](img/00036.jpeg)![Screenshot
    (754).png](img/00037.jpeg)


    ## 3.8. 机器学习中的学习类型


    机器被称为从输入给它的以执行某类任务的数据中学习。机器学习分为三类：

    1. 监督学习

    2. 无监督学习

    3. 强化学习


    ### 监督学习

    通过数据集引导或训练模型的学习过程。当数据经过训练时，它开始预测结果。监督机器学习模型处理带标签的数据。


    ### 无监督学习

    在无监督学习中，机器学习模型处理未标记的数据，并通过观察和评估数据中的模式进行学习。它通过创建聚类来自动发现数据中的结构和关系。


    ### 强化学习

    数据集与环境交互并找到最佳结果的能力。它允许数据集通过对自身经验和行动的反馈进行试错，并在交互式环境中进行学习。![Screenshot (755).png](img/00038.jpeg)


    回归基于从数据集中独立变量和因变量之间的关系预测事件结果的统计方法。回归是一种监督学习方法。它是预测建模技术。回归技术广泛应用于金融和投资领域用于未来预测。最近，回归被应用于业务领域。例如，考虑一家服装公司。它必须生产新货。回归获取之前的销售信息，并帮助公司确定应该生产哪种衣服以获得最大利润。因此，回归有助于以最好的方式为企业融资。回归是一种基于假设的算法，假设可以是线性的是非线性的。假设是基于输入中某些隐藏参数和模式的函数。回归模型用于预测真实连续的值。


    回归类型：

    1. 简单线性回归

    2. 多元线性回归

    3. 多项式回归

    4. 支持向量回归

    5. 决策树回归


    ## 6. 随机森林回归


    ![Screenshot (756).png](img/00039.jpeg)


