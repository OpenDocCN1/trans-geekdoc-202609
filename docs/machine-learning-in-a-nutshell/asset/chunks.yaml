    # 随机梯度下降


    在之前的 `gradient descent`（梯度下降）方法中曲线应该是凸的，但成本曲线并不总是凸的。如果对此类函数使用 `gradient descent`
    方法，将只会找到局部最小值。![Screenshot (1189).png](img/00378.jpeg)


    在批量梯度下降中，会运行所有行然后检查成本函数；但在随机梯度下降中，会检查每一行的成本函数，然后将该成本函数作为输入到神经网络中。随机梯度下降有助于以更快速度找到全局最小值。


    # Python 中的人工神经网络


    ![Screenshot (1190).png](img/00379.jpeg)![](img/00380.jpeg)


    ## 代码解释


    前 9 行代码导入了重要的库和数据集。数据集被划分为自变量和因变量。![Screenshot (1192).png](img/00381.jpeg)![Screenshot
    (1193).png](img/00382.jpeg)![](img/00383.jpeg)


    第 13 行到第 20 行代码将分类变量解码为哑变量。![Screenshot (1195).png](img/00384.jpeg)


    第 23 行和第 24 行将数据分为测试集和训练集。使用第 27 行到第 30 行代码对自变量的训练集和测试集进行扩展。![Screenshot (1196).png](img/00385.jpeg)![Screenshot
    (1197).png](img/00386.jpeg)


    在第 35 行导入了 `keras` 库。从 `kiras` 库导入了 `sequential` 包。该包有助于将我们的神经网络初始化为序列或图。随后导入了
    `dense` 包，该包用于创建人工神经网络中的层。


    在第 40 行通过一个名为 `classifier` 的对象初始化人工神经网络。创建了一个 `sequential` 类的对象。在第 40 行，使用 `add`
    方法向神经网络添加第一个隐藏层。


    传递给 `dense` 函数的第一个参数是 `output_dim`，该参数指定了第一个隐藏层中应该存在的节点数量。使用特定数量的节点并没有固定规则。最佳节点数通常通过实验找到。为了获得最佳值，可以取输出和输入节点数量的平均值，或者使用名为参数调优的技术来寻找最佳节点数。它使用了诸如
    K4 交叉验证等技术。它包括创建一个于训练集和测试集之外的集合，称为验证集。基本上在该集合上对模型的不同参数进行实验。因此，通常使用不同的参数测试不同模型的性能。


    `dense` 函数的下一个输入参数是 `init`。这是随机梯度下降的第一步。权重被随机初始化为接近零的小数字。它使用均匀函数进行初始化。下一个输入参数是
    `activation`。在隐藏层中使用的激活函数是整流函数，称为 `relu`。最后一个参数是 `input_dim`，它给出了输入层的节点数。


    在第 46 行代码中向神经网络添加了第二个隐藏层。它与之前的代码行具有相同的参数，但删除了最后一个参数 `input_dim`。第二个隐藏层不需要指定输入层的节点数。


    在第 52 行代码中向网络添加了输出层。输入参数与之前的代码行相同。由于这是输出层，激活函数将是 sigmoid 函数。`input_dim` 的输入将为
    1，因为我们只有一个类别。如果因变量有两个或多个类别，则选择 `softmax` 函数而不是 `sigmoid`。


    下一行代码将输出层添加到人工神经网络中。这行代码完成了网络的构建。编译包括将随机梯度下降应用于神经网络。因此，我们使用 `compile` 方法。第一个输入参数是
    `optimizer`，它是一种用于寻找神经网络中最佳权重集的算法。有许多类型的随机梯度下降过程可以使用，其中 `adam` 是最高效的。第二个参数 `loss`，所使用的损失函数将是对数类的。如果因变量是二分类结果，则损失函数是
    `binary_logarithmic`，否则是 `categorical_cross entropy`。最后一个参数是 `metric`，它是我们选择的评估模型的标准。我们使用准确率（accuracy）标准。它用于提高模型性能。


    在第 55 行将数据集拟合到神经网络。因此，前两个参数是 `x_train` 和 `y_train`。下一个参数是 `batch_size`，它是更新权重之前的观测值数量。最后一个参数是
    `epoch`。Epoch 基本上是指整个训练集通过 ANN 的次数，实际上，训练 ANN 包含通过多个 epoch 执行所有步骤。epoch 和 batch
    size 的输入没有固定规则。


    第 60 行和第 61 行用于预测测试集的输入。![Screenshot (1198).png](img/00387.jpeg)第 65 行提供了混淆矩阵。![Screenshot
    (1199).png](img/00388.jpeg)


    [点击此处获取上述的人工神经网络数据集和 Python 代码](https://drive.google.com/drive/folders/1s25-vyj2iL3HGVItUvLhDpM1XilLHR6s?usp=sharing)


