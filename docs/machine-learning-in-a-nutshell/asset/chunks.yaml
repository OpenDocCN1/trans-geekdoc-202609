    ## 5.2. 最近邻分类 (KNN)


    这是一种分类技术，它有助于通过考虑最近的训练集点将新点归类为一类。考虑一些随机数据的散点图：![Screenshot (938).png](img/00242.jpeg)


    散点图中存在两个不同的类别，一个由蓝色表示，另一个由红色表示。我们得到了一个新点，以预测它属于哪个类别。![Screenshot (939).png](img/00243.jpeg)新数据点用黑色表示。现在应用
    `knearest` 算法对数据进行分类。


    ### 最近邻算法需要遵循的步骤：

    - **步骤-1**：选择邻居数量 `k`

    - **步骤-2**：根据`euclidean distance`（欧距离）选取新数据点的 `k` 个最近邻居。

    - **步骤-3**：在这些 `k` 个邻居中，统计每个类别中数据点的数量。

    - **步骤-4**：将新数据点分配到邻居数量最多的类别。


    对于上述散点图，考虑 `k=3`，应从数据集中选取距离新点最近的三个点。![Screenshot (930).png](img/00244.jpeg)三个最近的点中有两个红色和一个蓝色，因此根据
    `knearest` 算法，新数据属于红色类别。


