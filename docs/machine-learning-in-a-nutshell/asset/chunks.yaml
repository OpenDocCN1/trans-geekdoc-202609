    在当今世界，一切都是自动化的。所有人类活动正在被机器取代。机器学习在自动化过程中起着重要作用。例如，考虑 Facebook 根据用户偏好推荐朋友以及 YouTube
    推荐视频，这些场景都是通过机器学习完成的。这一场景背后的过程是 Facebook 或 YouTube 收集过去的数据并将其输入机器中，机器将整合这些数据以推荐未来的偏好。


    机器学习完全依赖于数据。没有数据，就不可能训练机器学习模型。数据是机器学习最核心的方面，因为它使机器能够学会学习并正常工作。许多机器学习项目尽管拥有最好的算法，但由于缺乏良好的数据集而失败。数据是为分析而收集并以特殊方式格式的事实和数字的集合。数据是任何组织可以拥的最强大、最有价值的工具。数据是原始的、未组织的数字，需要经过处理。经过处理和组织的数据被用于分析任何实时情况。组织整个数据会创建一个数据集，进一步用于分析。当数据被利用到最大潜力时，将对组织的长期成功产生巨大影响。


    机器学习有助于分析和处理数据，并对我们的未来提供预测。机器学习（ML）侧重于分析和解释数据中的模式和结构，以便在没有人类交互的情况下实现学习、推理和决策。机器学习由多个算法组成。通过使用这些算法分析数据，可以使用输入数据生成数据驱动的输出和建议。算法具有进行某些纠正并整合这些信息以改进其进一步决策的能力。机器学习有许多使其变得易于访问的因素，其中之一就是数据处理。机器学习可以是多维的。在机器学习中，工作不断在数据上进行。海量数据被用于训练和测试。这种数据处理和组织使机器学习成为自动化的重要关键。


    ## 数据预处理


    将机器学习算法应用于数据集并不能获得最佳结果。在对数据应用任何机器学习算法之前对其进行处理是最重要的方面。机器学习模型的输出取决于数据处理的良劣程度。数据处理有几个步骤，下将在下方进行详细解释。


    在机器学习处理数据的第一步中，创建数据集起着重要作用。数据集是结构化的数据集合。在收集和组织数据后，必须将数据排列成数据集，以便创建机器学习模型。数据集可能包含按行和列排列的任意数字和字符。在创建最好的机器学习模型时，仅仅收集数据是不够的，数据的分类和标记起着主要作用。这使得数据集足够准确，能够提供真实的愿景。一个数据集由几个变量组成；将机器学习算法应用于数据集，通过影响它的因素来预测变量的值。被预测的值称为因变量，它所依赖的因素称为自变量。


    ![Screenshot (727).png](img/00008.jpeg)


    大多数机器学习算法拥有两种先进行、学习和预测的方法。因此，数据集分为：


    ### 1. 训练数据集

    **训练数据集**：需要通过喂数据来训练机器学习算法。训练数据将帮助算法或机器将数据中的模式连接起来，以给出最佳输出。这些训练数据占据了数据集的大部分。


    ### 2. 测试数据集

    **测试数据集**：测试数据集用于评估已训练的机器学习模型的性能。在训练数据集上检查模型的可靠性。测试数据集基本上用于衡量模型表现的好坏。这里必须注意的最重要点是，绝不能在测试集上进行训练。测试数据集独立于训练数据集，但它与训练具有相同的概率分布。如果使用训练集训练机器学习模型并使用同一集合进行测试，将获得最好的结果，但不是准确的结果。因此，使用测试集对机器进行测试是非常重要的。


    ### 3.1. 库


    在机器学习模型中使用数据集工作时，算法可以在 `Python` 或 `R` 中执行。Python 用于将机器学习算法应用于数据。Python 提供了简洁且易读的代码，使得机器学习中复杂的算法易于访问。Python
    是一致语法、更短开发时间以及灵活性的结合；这使其非常适合任何类型的复杂机器学习模型。它是一个全面的库集，是 `python` 最大的资产。库是一组结构良好且经过充分测试的函数，用于实现最佳性能。


    最重要的库有：


    - `NumPy`：一个非常流行的库，用于基础计算。它被广泛应用于线性代数、傅里叶变换和随机数生成能力。

    - `Pandas`：用于数据分析的最流行的库。它有许多内置函数，如分组、过滤和合并数据。

    - `Matplotlib`：用于创建 2D 图表和图形的 2D 绘图库。

    - `Scikit-Learn`：机器学习库之一，用于监督和无监督学习算法以及数据挖掘。


    ### 3.2. 导入数据集


    在 `python` 中编程时，设置工作目录以确保代码执行非常重要。要设置工作目录，首先选择数据集所在的文件夹，并将 `python` 文件保存在同一个文件夹中。设置工作目录后，导入要应用机器学习算法的数据集。


    ### 3.3. 将数据集划分为独立变量因变量数组


    导入数据集后，将数据集划分为训练集和测试集是重要的。


