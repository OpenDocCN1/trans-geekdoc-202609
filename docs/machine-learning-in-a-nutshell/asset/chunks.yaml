    使用 Python 将朴素贝叶斯（Naive Bayes）分类技术应用于数据。将朴素贝叶斯技术应用于数据的 Python 代码所示：![Screenshot
    (1045).png](img/00304.jpeg)![Screenshot (1046).png](img/00305.jpeg)


    ### 代码解释

    前八行代码导入了所需的库和数据集。数据集被分为自变量数组和因变量数组。导入的数据集为：![Screenshot (1047).png](img/00306.jpeg)


