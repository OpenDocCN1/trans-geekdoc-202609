    # 8.2. 卷积神经网络


    与人类大脑在看到图片时识别物体的方式类似，卷积神经网络的目标是训练计算机算法，以相同的方式识别物体。然而，人脑的分析过程与计算机之间存在巨大差异。对于计算机来说，图像只是另一个数字数组，但对人脑来说并非如此。每个物体都有自己的模式，而计算机正是利用这些模式来识别图像中的物体。


    用简单的话来解释卷积神经网络，就像孩子们接受训练以通过展示图像来区分人和物体一样，计算机也通过展示数百万张同一物体的图像来接受训练，使其识别该物体的能力随着样本的增加而提高。卷积神经网络是深度神经网络的一类，最常应用于视觉成像和图像分类。它在图像视频识别、推荐系统和自然语言处理中有广泛的应用。


    CNN 神经网络一样由具有可学习权重的神经元组成。每个神经元接收多个输入，并根据激活函数进行处理，最后输出结果。但与输入为向量的神经网络不同，这里的输入是多通道的图像。


    ![Screenshot (1200).png](img/00389.jpeg)


    神经网络在特定的分类图像或分类过的图像上进行训练。


    ![Screenshot (1303).png](img/00390.jpeg)


    计算机将任何输入视为数字数组。考虑一张具有 `2*2` 像素的黑白图像，计算机将此图像读取为 `2d array`，其中每个像素的值介于 0 到 255 之间。


    ![Screenshot (1201).png](img/00391.jpeg) 0 代表白色，255 代表黑色。


    ![Screenshot (1202).png](img/00392.jpeg) 计算机将彩色图像读取为 `3D-array`。每个像素被分配三个值，分别代表红、绿、蓝。


    ## 卷积神经网络涉及的步骤：


    ![Screenshot (1203).png](img/00393.jpeg)


    ### 卷积

    卷积是两个函数的组合积分。它展示了一个函数如何修改另一个过程。


    ![Screenshot (1308).png](img/00394.jpeg) 考虑一个输入图像的示例，它被计算机解码为数组。图像与另一个名为 `feature
    detector`（特征检测器）的数组进行卷积，以使图像变小从而提高处理速度。


    ![Screenshot (1205).png](img/00395.jpeg) 从图 8.2.2 可以看出，输入图像与特征检测器卷积时会丢失一些特征。特征图帮助我们消除不需要的特征，这有助于去除多余的数据。会创建多个特征图，通过选择不同的过滤器获得不同的特征图。机器在训练后决定哪些特征是重要的。


    ![Screenshot (1206).png](img/00396.jpeg)


    ### ReLU 层

    特征检测器在应用到输入图像时可能会产生线性，因此使用修正线性整流器（rectifiers）来消除这种线性。


    ![Screenshot (1207).png](img/00397.jpeg)


    ### 池化

    机器根据特征来识别图像。同一物体的所有图像并不是完全相同的。例如，考虑从不同角度、不同焦距拍摄的狗的不同图像*等*。所有这些图像都描绘了同一个物体。机器通过识别耳朵、鼻子、嘴巴*等*等重要特征来识别图像。但这些特征并不总是位于图像的相同部分，因此；机器不应该在乎特征是否倾斜、纹理是否不同、距离近一点或远一点。即使我们的特征有点扭曲，机器也应该足够灵活以检测它们。池化有助于实现这一点。


    ![](img/00398.jpeg)![Screenshot (1208).png](img/00399.jpeg)![Screenshot (1210).png](img/00400.jpeg)


    可以考虑最大池化或平均池化。池化后的特征图输出被称为池化后的特征图。在这个过程中，任何重要的特征都不会丢失，因为我们考虑的是最大像素。图像尺寸缩小了 75%，并且减少了参数数量。池化将帮助模型避免对不信息产生过拟合。


    ### 扁平化

    池化后的下一步是扁平化。在这一步中，特征图将被展平为一列。数字按行提取并合并成一列。执行扁平化是为了以便该层可以作为人工神经网络的输入。


    ![Screenshot (1211).png](img/00401.jpeg)![Screenshot (1212).png](img/00402.jpeg)


    '
- fmt: '

    ## Full connection


    In this step `ANN` is added to the convolutional neural network. The flattened
    layer is given as the input to the artificial neural network after which the information
    is optimized and the machine starts learning the features of each input object.
    In `ANN` fully connected hidden layers are not used but for convolutional neural
    networks it is a must that we use fully connected hidden layers.


    ![Screenshot (1213).png](images/00403.jpeg)


    The predictions are made by the artificial neural network and the errors are returned.
    The weights are chaged after studying the errors and sometimes the feature detectors
    are also changed. The machine starts understanding the important features for
    a dog or a cat from the hidden layers. If the input given to us is a dog then
    certain important features are fired up, the machine then classifies if the input
    is a dog or a cat based on the features that are highlighted.


    ### Convolution Neural Networks in python


    ![Screenshot (1214).png](images/00404.jpeg)![Screenshot (1215).png](images/00405.jpeg)


    From the `keras` library the `sequential` package is imported. This package helps
    in initializing our neutral network, there are two ways in initializing, either
    as a seqence pf layers or as a graph. Since the `CNN` is a seqence of layers,
    `seqencetial package` used to initialise our neutral network. The `conventional
    2D` package is used for the first steps of making the `CNN` that is the convoiotion
    step in which the convolutional layes are added. The images are 2D unlike videos
    which are 3D, so the `convolution 2D` package is used. The `max pooling 2D` package
    helpsin proceeding with the poolimg steps in which the pooling layers are created.
    The `flatten` package helps in converting all the pooled features map created
    through convolution and max pooling into large features vectors which becomes
    the input to the fully connected layers. The `Dense` package is used to add the
    fully connected layers and a classic artifical neutral network.


    In this code line 29 the convolution neural network will be initialized. A new
    object of the `sequential` class is created and this object `classifier` will
    classify images to tell if it is a ‘dog’ or ‘cow’. The 32th code line help in
    adding the first layer of the convolutinal neural network i.e `convolution`. Numerous
    feature detectors are considered to convolute with the input image. A feature
    map is obtained after the convolution. To the object `classifier` the `convolution2D`
    function is added. The inputs for the `convolution2D` are the number of filters,
    number of rows of the feature detector, the number of columns of feature detector
    and the format of the image. Initially consider 32 filters, later on for more
    accuracy 64filters can be considered. All the images don’t have the same size
    therefore using the `lat` parameter in the convolution all the images are converted
    into one single format and therefore 1 fixed size.


    ![Screenshot (1216).png](images/00406.jpeg)


    The negative values from the feature maps should be removed, for this we use the
    activation function. It helps in maintaining the non-linearity of the model. The
    step after convolution is pooling. The 35th code line helps in pooling process.
    The `add` method is used to fit the `classifier` object to the `MaxPooling` function.


    ![Screenshot (1217).png](images/00407.jpeg)


    Now we have to flatten the pooled feature maps. The 42nd code flattens the pooled
    feature maps. The `add` method is used to fit our `classifier` object to the `flatten`
    function. After the flattening process , the output is given to the input of artificial
    neural network. Therefore in the code lines 45th and 46th `dense` function is
    used to initialize the artificial neural network. In the 49th code line the the
    neural network is compiled.


    Building the convolutional neural network is over, Now this neural network should
    be fit to the images. In this step `karas` documentation is used, `karas` is basically
    a image agumentation process which consists of pre-processing the images to prevent
    overfittimg. If the image agumentation is not used the accuracy will be great
    for the training set results but very low for test set. The image agumentation
    will create many batches of the images and apply some random transformation on
    on a random selection of images and eventually many more diverge images will be
    obtained. Therefore image agumentation helps in enrichining the data set without
    adding any new images to the data set. The class that allows in usage of the image
    agumentation is `imagedatagenerator`, this class is imported from the `karas`
    libraey in the 53rd code line. The code lines 56th to 58th rescale all the pixels
    of traning set between 0 and 1. The arguments in the image data generator are
    some random transformation and the values gives to them detail about how much
    we want to apply these random transformations. As this part of code is directly
    taken from `karas documentation` the parameters suggested by `karas` will be taken.
    The 60th code line rescales the pixels of test set images. The code lines from
    62nd to 65th create the data set. The first parameter is where the images are
    extracted from, therefore the working directory should be given. The second parameter
    `target_size` is the size of the images expected in the traning set. The `batch_size`
    is the number of images that will go through the `CNN` after which the weights
    will be changed. The last parameter is the `calss_mode`, there are two classes
    therefore the input for this parameter is binay. The next code lines from 67 to
    70 will create the test set. The last code line 73 to 76 will fit the traning
    set while also testing its performance on the test set. The first parameter is
    the traning set. The second parameter `sample_per_epoch` is the number of images
    that will go through the `CNN` for each round of `epoch` and since the traning
    set contains 40 images the input for this argument is 40. The third parameter
    `nb_epoch` is the number of epochs. The next parameter is the test set. The last
    one is the number of images in the test set. After executing the code, check the
    accuracy of the model. If the accuracy is to improved we will select 64 feature
    maps instead of 32.


    [Click here to obtain the above mentioned dataset and pythoncode for convolutional
    neural networks](https://drive.google.com/drive/folders/1zjdBh6aLehHofMk4xZSjGMqFtAegra?usp=sharing)


    ## Dimensionality reduction


    Dimensionality reduction is a process in which we reduce the number of input independent
    variables that determine the outcome . Consider that in a data set we collected
    the independent variables are numerous, and the dependent variable varies as these
    quantities change. The most important point we have to note here is that the dependence
    of the outcome on all the independent variables is not the same. The outcome may
    dependent on mostly on only two variables and very less on other inputs. In such
    cases if we give all the independent variables as input to our machine, instead
    of obtaining the best results we will get average results. This is because we
    overfed our model with exessive data. The dimensionality reduction techniques
    help us solve this problem by finding the most important independent variables
    or by deriving values that are informative.


    The dimensionality reduction is classified as :


    1. Feature selection

    2. Feature extraction


    ![Screenshot (1218).png](images/00408.jpeg)


    ### 9.1 Feature selection


    This is the process of selecting certain independent variables from many independent
    variables. This can be achieved by many algorithms in which the simplest way is
    to consider different groups of independent variables and find the error. Some
    of the techniques for applying feature selection to our data are: 1. `backward
    elimination` 2. `forward selection` 3. `bidirectional elimination`, `etc.`

