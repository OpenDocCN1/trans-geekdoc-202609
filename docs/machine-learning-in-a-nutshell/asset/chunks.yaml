    ## 4.4. DECISION TREE REGRESSION


    The decision tree algorithm is one of the popular and most extensively used algorithms
    in machine learning. The decision tree algorithm can be fitted to regression as
    well as classification. The algorithm is depicted as a tree in which the nodes
    are the inputs or independent variables, the branches are compared to the decision
    of the machine and the leaf nodes are considered as the output or dependent variable
    values. In the case of regression, the `DTA` uses the least square distance to
    select the features. The data given is split. The split is called a leaf. The
    split created increases the amount of information about the points on the same
    side of the split. The data is split if there are similarities for some particular
    points in the data. While splitting the data the points are being grouped, therefore
    `DTA` adds value to the data points. The algorithm stops the process of splitting
    when there is very less information that is to be added. Unlike other regression
    techniques decision tree regression is simple to understand.


    ### Applying decision tree regression to a data set


    Consider a scatter plot between any two independent variables `X1` and `X2`: ![Screenshot
    (875).png](images/00210.jpeg) The decision tree for the above scatter plot is
    given as: ![Screenshot (876).png](images/00211.jpeg) The values of dependent for
    each split is found by taking the average of all the values of the dependent variable
    in that particular split or leaf. When a new input is given to predict the output,
    the split in which the point fits is checked for. Then the value of dependent
    variable in the leaf is assigned to the input. ![](images/00212.jpeg)


