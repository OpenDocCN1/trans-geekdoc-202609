    Classification is a supervised learning procedure. Regression algorithm is used
    to predict a continuous value, but what if the output is not a continuous value.
    For example, the dependent variable output is only yes or no. Here is where classification
    comes into play. Unlike regression, classification is used to predict category.
    The role of classification is to predict into which category a new observation
    belongs to. Consider a data set that is created by a car company in which the
    inputs are people’s age, salary, and gender, and output is whether the person
    bought the car or not. The company desires to improve its sales. So it decided
    to target the right sector of people who will definitely buy their product. For
    the above problem, the data should be classified into two categories namely “people
    who bought the car” and “people who didn’t buy the car,” so that the company can
    stress the category of people who bought the car. There are many classification
    algorithms, these algorithms which are used to implement the classification technique
    on our data are known as classifiers.


    ### Types of classification techniques:

    1. Logistic regression

    2. K nearest neighbors

    3. Support vector machine

    4. Kernel SVM

    5. Naïve Bayes

    6. Decision tree classification

    7. Random forest classification


