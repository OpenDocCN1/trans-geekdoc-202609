    前三行代码导入了执行所需的所需的库。第 `5th` 到 `7th` 行导入了数据集。导入的数据集分为自变量和因变量。第 `9th` 到 `13th` 行将分类变量转换为虚拟变量。第
    `15th` 行代码避免了虚拟变量陷阱。第 `17th` 到 `18th` 行将数据分为训练集和测试集。第 `20th` 到 `22nd` 行将数据集拟合到线性回归函数并预测测试集的值。第
    `20th` 行代码从 `sklearn` 导入了线性回归函数。现在声明了一个变量 `c`，通过它调用线性回归函数。数据被拟合到该变量。第 `25th` 行预测测试集的值。使用线性回归预测的测试集值为：


    如前所述，构建模型非常重要。可以使用五种方法中的任意一种。代码中使用后向淘汰法（backward elimination）来构建模型。导入了 `statsmodel`
    库，该库包含了后向淘汰算法。`statsmodel` 库考虑了多元线性回归中的常数存在，因此应向独立数组添加一列 1。这是通过第 `27th` 行代码实现的。首先要创建一个新的特征矩阵，这将是我们最优特征矩阵。在第
    `30th` 行代码中定义了一个新变量 `a_opt`。`a_opt` 最初包含所有自变量。将逐个对自变量应用后向淘汰法，移除不重要的自变量。指定了所有列的索引，因为之后每个列都将被删除。在第
    `31st` 行代码中，创建了一个新的回归器，它是 `OLS`（普通最小二乘法）类的对象。第一个参数是 `endog`，输入是因变量数组。第二个参数是 `exog`，输入是已定义的
    `a_opt`。使用 `fit` 函数将 `OLS` 函数拟合到数据上。`summary` 函数将返回一个包含构建模型时所有重要统计指标的表格。第 `32nd`
    行将给出 `p` 的值。在研究每一步的 `p` 值后，决定移除某个自变量。


    观察摘要表可以发现，变量 `x4` 的 `p` 值高于 `0.05`（这是被认为的最优值），因此应该将其移除。在第 `33rd` 行代码考虑 `a_opt`
    数组时，自变量 `x4` 将不再被考虑。再次使用相同的步骤寻找新的 `p` 值。变量 `x1` 的 `p` 值高于 `0.05`。移除该变量并找到新的 `p`
    值。当移除自变量后找到新的 `p` 值时，其他自变量将按时间顺序重新命名。变量 `x2` 也被移除。剩下 `X1` 和常数。它们的 `p` 值为 `0`，这意味着它们具有高度显著性。


    [点击此处获取上述数据集和多元回归的 Python 代码。](https://drive.google.com/drive/folders/1qyP-o2fZ3PDsuOjwnB_pVyFBSQGO1ZiD?usp=sharing)


    ### 4.2 多项式回归


    在简单线性回归中，预测与输出之间存在线性关系。考虑给定数据集的散点图。如果将简单线性回归应用于这些数据点，输出将是一条直线，被称为最佳拟合线。最佳拟合线仅适用于线性数据，即可以拟合到直线上的点。对于给定的散点图，曲线可以完美拟合所有点。这里多项式回归发挥了作用。获得的大部分数据是非线性的。因此多项式回归比线性回归给出更接近、更好的结果。多项式线性回归是一种回归算法，它将因变量与自变量之间的关系建模为
    n 阶多项式。其中，`b` 是因变量，`a` 是自变量常数。随着多项式次数的增加，可以获得更好的结果。

