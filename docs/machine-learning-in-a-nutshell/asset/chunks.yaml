    # 5.7. RANDOM FOREST CLASSIFICATION


    Random forest classification is the extention of decision tree classification.
    The decision tree classification consider decision of only one tree but random
    forest takes the decision of forest of trees. Steps to be followed to apply random
    forest regression to our data:


    - **STEP-1**: Pick a random `k` random points from the traning set.

    - **STEP-2**: Now construct a decision tree to these `k` random points.

    - **STEP-3**: Choose the number you want to build and repeat the steps 1 and 2.

    - **STEP-4**: When a new point is given for prediction then let all trees predict
    the category of output and then assign the point to that category which is predicted
    by most trees.


