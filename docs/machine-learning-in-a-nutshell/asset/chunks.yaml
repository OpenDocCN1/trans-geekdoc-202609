    # 5.5. 朴贝叶斯 (NAÏVE BAYES)


    这是一种用于分类的监督学习算法。该算法之所以得名，是因为即使变量之间并不独立，算法中仍然使用了贝叶斯定理。


    ### 贝叶斯定理

    ![Screenshot (1040).png](img/00280.jpeg)![](img/00281.jpeg)是在 `B` 已经发生的情况下 `A`
    发生的概率。![images/00282.jpeg)是在 `A` 已经发生的情况下 `B` 发生的概率。![images/00283.jpeg)是 `B`
    和 `A` 发生的概率，其中 `A` 和 `B` 是独立事件。考虑薪水与年龄的散点图。蓝色点代表拥有两轮车的人，红色点代表拥有汽车的人。![Screenshot
