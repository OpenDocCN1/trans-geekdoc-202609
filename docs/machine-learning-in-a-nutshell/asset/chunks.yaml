    \ of the data obtained is not linear. Therefore, polynomial regression gives more\
    \ close and better results than linear regression. Polynomial linear regression\
    \ is a regression algorithm that models the relationship between the dependent\
    \ variable and the independent variable as nth degree polynomial. ![Screenshot\
