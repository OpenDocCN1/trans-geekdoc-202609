  trans: '


    ## 全连接


    在这一步中，`ANN`（人工神经网络）被添加到卷积神经网络中。展平层（flattened layer）作为输入给人工神经网络，随后对信息进行优化，机器开始学习每个输入对象的特征。在
    `ANN` 中不使用全连接隐藏层（hidden layers），但对于卷积神经网络来说，使用全连接隐藏层是必须的。


    ![Screenshot (1213).png](img/00403.jpeg)


    预测由人工神经网络完成，并返回误差。在研究误差后，权重会发生变化，有时特征检测器也会被改变。机器开始从隐藏层中理解狗或猫的重要特征。如果给我们的输入是一只狗，那么某些重要特征会被激活，机器会根据高亮的特征对输入是狗还是猫进行分类。


    ### Python 中的卷积神经网络


    ![Screenshot (1214).png](img/00404.jpeg)![Screenshot (1215).png](img/00405.jpeg)


    从 `keras` 库中导入了 `sequential` 包。该包有助于初始化我们的神经网络，初始化有两种方式：要么作为层的序列，要么作为图。由于 `CNN`
    是层的序列，因此使用 `sequential package` 来初始化我们的神经网络。`conventional 2D` 包被用于构建 `CNN` 的第一步，即卷积步骤，在其中添加了卷积层。图像是
    2D 的，不像 3D 的视频，因此使用了 `convolution 2D` 包。`max pooling 2D` 包有助于进行池化步骤，在这些步骤中创建池化层。`flatten`
    包有助于将通过卷积和最大池化创建的所有池化特征图转换为大的特征向量，这些向量将成为全连接层的输入。`Dense` 包用于添加全连接层并构建一个经典的人工神经网络。


    在代码的第 29 行，将初始化卷积神经网络。创建了 `sequential` 类的一个新对象，该对象 `classifier` 将对图像进行分类，以告诉我们它是“狗”还是“牛”。第
    32 行代码有助于添加卷积神经网络的第一层，即 `convolution`。考虑了使用许多特征检测器与输入图像进行卷积。卷积后获得一个特征图。为对象 `classifier`
    添加了 `convolution2D` 函数。`convolution2D` 的输入是过滤器的数量、特征检测器的行数、特征检测器的列数以及图像的格式。最初考虑
    32 个过滤器，之后为了更高的准确性，可以考虑 64 个过滤器。并不是所有图像的大小都相同，因此通过卷积中的 `lat` 参数，所有图像都被转换为单一格式，从而具有
    1 个固定尺寸。


    ![Screenshot (1216).png](img/00406.jpeg)


    应该移除特征图中的负值，为了这一点，我们使用了激活函数。它有助于保持模型的非线性。卷积之后的步骤是池化。第 35 行代码有助于池化过程。使用 `add` 方法将
    `classifier` 对象拟合到 `MaxPooling` 函数。


    ![Screenshot (1217).png](img/00407.jpeg)


    现在我们必须对池化后的特征图进行展平。第 42 行代码展平了池化后的特征图。使用 `add` 方法将我们的 `classifier` 对象拟合到 `flatten`
    函数。在展平过程之后，输出被作为人工神经网络的输入。因此，在代码第 45 行和第 46 行使用 `dense` 函数来初始化人工神经网络。在第 49 行代码中编译了神经网络。


    构建卷积神经网络已经完成。


