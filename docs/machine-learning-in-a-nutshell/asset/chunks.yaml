    # 5.8. 混淆矩阵


    混淆矩阵被称为误差矩阵。它有助于评估机器学习算法的性能。(images/00337.jpeg)


    # 聚类


    聚类是一种无监督机器学习算法。它类似于分类，但在聚类中没有人知道在什么。聚类是为了识别不同的簇。每个簇中的数据点具有共同特征。聚类有助于发现研究数据时可能遗漏的观测值，这些观测值非常有信息。常用的聚类方法有：


    1. `K 均值聚类`

    2. `层次聚类`


    ![](img/0038.jpeg)


    # 6.1. K-MEANS 聚类


    Kmeans 是一种用于聚类的无监督机器学习算法。考虑以下数据的散点图：![Screenshot (1149).png](img/00339.jpeg)应用
    kmeans 后上述数据的散点图：![Screenshot (1150).png](img/00340.jpeg)应用算法后数据被聚类成了三类。


    kmeans 聚类的步骤：


    - **步骤-1**：选择要划分数据的簇数量 `k`。

    - **步骤-2**：随机选择 `k` 个点作为质心。

    - **步骤-3**：将每个数据点分配给最近的质心。

    - **步骤-4**：为每个簇计算并放置新的质心。

    - **步骤-5**：重新分配每个数据点到新的最近的质心。如果发生了重新分配，回到步骤 4，否则停止过程。


    kmeans 中的随机初始化陷阱：考虑以下散点图：![Screenshot (1151).png](img/00341.jpeg)如果在初始步骤选择了三个质心，输出将是：![Screenshot
    (1152).png](img/00342.jpeg)但如果只选择了一个质心，输出将是：![Screenshot (1153).png](img/00343.jpeg)在上述聚类中，我们只得到了一个簇，这种类型的聚类给出了糟糕的输出。如果选择了两个质心：![Screenshot
    (1154).png](img/00344.jpeg)聚类效果良好，但如果有三个质心我们将得到更好的结果。如果选择了四个质心：![Screenshot (1155).png](img/00345.jpeg)数据被划分成了比所需数量更多的簇。因此，选择初始簇的数量是一个关键步骤。错误的选择会影响我们的聚类。为了解决这个问题，我们使用
    `Kmeans++`。


