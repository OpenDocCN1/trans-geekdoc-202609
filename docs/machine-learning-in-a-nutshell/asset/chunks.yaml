    第 11 行和第 12 行代码将自变量数组和因变量数组划分为测试集和训练集![](img/00308.jpeg)


    第 15 行到第 18 行代码对自变量测试集和训练集进行缩放。![Screenshot (1050).png](img/00309.jpeg)


    第 21 行到第 23 行对数据集应用朴素贝叶斯分类。在第 21 行导入了包含朴素贝叶斯算法的库。在下一行代码中定义了一个变量 `classifier`，并通过它调用了
    `gaussianNB` 函数。我们的训练集被拟合到 `classifier` 变量。第 26 行使用 `predict` 函数来预测测试集的结果。![Screenshot
    (1051).png](img/00310.jpeg)


    观察预测值并与真实值进行比较。分类器预测了两个正确值和两个错误值。第 29 和第 30 行提供了混淆矩阵，它将提供正确和错误预测的数量，有助于理解分类器的准确性。![Screenshot
    (1052).png](img/00311.jpeg)


    从混淆矩阵可以推断出分类器给出了两个正确预测和两个错误预测。代码第 37 到 52 行给出了训练集上逻辑回归的图形化表示。![Screenshot (1053).png](img/00312.jpeg)


    蓝点代表未通过考试的人，橙色点代表通过考试的人。由朴素贝叶斯分类技术创建的蓝色区域代表未通过考试的人，橙色区域代表通过考试的人。第 57 行到 69 行给出了测试集上逻辑回归的图形化可视化：![Screenshot
    (1054).png](img/00313.jpeg)从图中可以推断出我们的分类器在错误区域分类了两个点。


