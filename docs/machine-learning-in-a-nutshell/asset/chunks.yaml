    # 深度学习


    深度学习是机器学习的一部分，它模仿人类大脑来执行机器学习的工作。世界增长越来越快，随着人口增加，数据量也不断增加。除非知道数据不重要，否则数据的任何部分都不能忽略。审视大量数据并对其进行组织在人类看来是不可能的，即使这样做，也会消耗大量时间，而且输出并非最优。深度学习有助于理解大型无序数据。起初深度学习并不流行，这是因为当时的可用数据不足且处理速度非常慢。在现代，深度学习正在成为处处的一部分。深度学习基于人工神经网络工作。它利用多层从无组织的数据中提取高层特征。在每一个连续的层中，它都学习改进。它使数据变得更有组织且抽象。这有助于从大量无组织的数据集中获得最佳输出。数据学习用于自动语音识别、图像识别、视觉艺术处理、自然语言识别、药物毒性检测、客户关系管理、军事等。![Screenshot
    (1173).png](img/00363.jpeg)


    ## 7.1. 人工神经网络


    神经网络或连接主义系统是模仿人类大脑的计算系统。神经网络从输入中学习，而不是获取先验指令。例如：在图像识别中，如果给神经网络几张狗的照片，它就会从图像中学习具有耳朵形状、鼻子形状、身体形状、毛等特定特征的动物是狗。`ANN`
    并不知道狗，但它从图像中学习。


    ### 神经元


    深度学习的整个目的是模仿人类大脑。![Screenshot (175).png](img/00364.jpeg) `X1`、`X2` 和 `X3` 代表输入。这些应该被标准化。`W1`、`W2`
    和 `W3` 是权重。这些是重要的部分。神经元获取加权和。![Screenshot (176).png](img/00365.jpeg)


    ### 阈值函数


    获取加权和后，应用激活函数。![Screenshot (177).png](img/00366.jpeg) 以下函数如下：


    ![Screenshot (178).png](img/00367.jpeg) 尽管它有折点，但它很好。


    ![Screenshot (179).png](img/00368.jpeg) 这条曲线没有折点，它是平滑的。


    ![Screenshot (180).png](img/00369.jpeg) 这些是神经网络常用的函数。


    ![Screenshot (181).png](img/00370.jpeg) 在隐藏层应用阈值函数。


    ![Screenshot (182).png](img/00371.jpeg) 在输出层应用 sigmoid 函数。


    ### ANN 如何学习？


    1. `ANN` 学习的一种方式是通过编码。在编码中，神经网络被所有的信息。因此，神经网络不需要做太多工作，因为它已经被提供了自变量。

    2. 将输入连同预期结果给出神经网络，允许其自主学习。神经网络遵循以下步骤进行学习并输出：![Screenshot (183).png](img/00372.jpeg)
    `Y` 是真实输出。`Y*` 是网络预测的输出。


    ## 交叉验证


    绘制真实输出值和网络预测值的图。![Screenshot (184).png](img/00373.jpeg) 现在计算损失函数。


    ![Screenshot (185).png](img/00374.jpeg) `C` 代表神经网络选择的权重的损失函数。


    ![Screenshot (186).png](img/00375.jpeg) 为所有输入的不同权重计算此损失函数。


    ## 梯度下降


    神经网络总是尝试减少损失函数。在这种方法中，考虑不同的权重并计算损失函数。在计算损失函数后，在损失函数和权重之间绘制一张图。![Screenshot (187).png](img/00376.jpeg)
    随着权重的增加，我们陷入了维度灾难。![Screenshot (188).png](img/00377.jpeg)


