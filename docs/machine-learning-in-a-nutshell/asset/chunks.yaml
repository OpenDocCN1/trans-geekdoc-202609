    `kmeans` 的 Python 代码](https://drive.google.com/...)


    ## 层次聚类（Hierarchical）


    层次聚类是一种无监督学习算法。


    聚合聚类（Agglomerative）


    聚合聚类是从每个数据点开始，然后不断将最近的两个聚合并，直到所有的点都形成一个聚。


    - `步骤 1`：每个点都是一个初始聚。

    - `步骤 2`：计算所有点对之间的距离。

    - `步骤 3`：将距离最近的两个聚合并。

    - `步骤 4`：重复上述步骤，直到只有一个聚。


    树图（dendogram）被绘制出来以寻找聚的最优数量。![Screenshot (1163).png](img/00353.jpeg)


