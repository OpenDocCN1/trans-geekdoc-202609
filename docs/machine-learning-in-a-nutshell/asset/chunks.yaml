    \ ‘p’ values are found. When new ‘p’ values are found after removing a independent\
    \ variable then the other independent variables will named from 0 in chronological\
    \ order. ![Screenshot (852).png](images/00164.jpeg)The variable x2 is also removed.\
    \ ![Screenshot (853).png](images/00165.jpeg)X1 and constant are left. The ‘p’\
    \ value for them is ‘0’ that means they are highly significant. \n\n[Click here\
