- fmt: '

    ## 9.2. FEATURE EXTRACTION


    Feature extraction works on the given input data and builds its own values derived
    from the data set. These values are very informative and help us predict better
    outcomes. The techniques used for applying feature extraction to our are: 1. `PCA`
    2. `LDA` 3. `Kernel PCA` 4. `QDA`, etc. We already discussed about backward elimination,
    forward selection, bidirectional elimination in regression topic. In this unit
    we will concentrate on `PCA` and `LDA`.


    ### 9.2.1. PRINCIPAL COMPONENT ANALYSIS


    The main purpose of the `PCA` is to identify and learn about the variables. It
    scrutinizes all the variables and if it finds a strong correlation between them
    then it reduces the dimensionality. `PCA` tries to understand the relation between
    the independent and dependent variables unlike other algorithms we studied until
    now which attempt at predicting the output value. In `PCA` we first find the directions
    of maximum variance in high dimensional data and then it projects it into a small
    dimensional subspace. During the whole process it retains the whole data. Therefore
    `PCA` in simple words can be defined as reducing the dimensions of a `k`-dimensional
    data set to `n`-dimension where `k` is greater than `n`.


    Steps followed in `PCA` algorithm:

    1. The first step is to standardize the data set given to us.

    2. Obtain the eigen vectors or eigen values from correlation matrix or covariance
    matrix.

    3. Arrange the eigen values in descending order and select `n` eigen vectors that
    corresponds to the largest values of eigen vectors. Therefore the new dimension
    of our data is `n`.

    4. Construct the projection matrix `Z` from the `n` selected vectors.

    5. Transform the original data set via `Z` to obtain a `n`-dimensional feature
    subspace `y`.


    `PCA` is vastly being used in noise filtration, visualization, feature extraction,
    stock market predictions, gene analysis, etc. `PCA` in python: Table9.1


