    分类是一种监督学习过程。回归算法用于预测连续值，但如果输出不是连续值怎么办？例如，因变量的输出仅为“是”或“否”。这就是分类大显身手的地方。与回归不同，分类用于预测类别。分类的作用是预测新的观测值属于哪一类别。考虑一个汽车公司创建的数据集，其中输入是人的年龄、薪水性别，输出是该人是否购买了汽车。公司希望提高销售额，因此决定针对肯定会购买其产品的正确人群群体。对于上述问题，数据应该被分为两类，即“买了车的人”和“没买车的人”，这样公司可以重点关注买车的人群类别。有很多分类算法，这些用于在我们的数据上实现分类技术的算法被称为分类器。


    ### 分类技术的类型：

    1. 逻辑回归

    2. K 近邻算法

    3. 支持向量机

    4. 核 SVM

    5. 朴素贝叶斯

    6. 决策树分类

    7. 随机森林分类


    ![Screenshot (922).png](img/00224.jpeg)


    ### 5.1. 逻辑回归

    逻辑回归是一种执行分类过程的监督机器学习算法。尽管我们已经有了线性回归来完成这项工作，但仍然逻辑回归。表 5.1 是一个由汽车公司收集的数据集，它提供了关于人们年薪（单位：万）以及他们是否购买了特定车辆的信息。表
    5.1


    | 薪水 | 购买 |

    | :--- | :--- |

    | 24 | 是 |

    | 12 | 否 |

    | 30 | 是 |

    | 40 | 否 |

    | 35 | 是 |

    | 20 | 是 |

    | 26 | 否 |

    | 31 | 是 |

    | 32 | 是 |

    | 19 | 否 |

    | 16 | 否 |

    | 14 | 否 |

    | 50 | 是 |


    上述数据的散点图如下：![Screenshot (923).png](img/00225.jpeg) 如果对上述散点图应用线性回归，输出如下：![Screenshot
    (924).png](img/00226.jpeg) 蓝线代表线性回归的最拟合线。线性回归告诉我们薪水在 20 万到 35 万之间的人可能购买该产品。这是一个很好的预测，但仔细观察图表，可以观察到橙色和绿色圈出的线条两个部分。线条的绿色部分表示薪水在
    20 万以下的人完全不会购买产品，而橙色部分表示薪水在 35 万以上的人一定会购买产品。这不是一个准确的预测。如果输出以概率的形式给出将更合理，例如：“对于
    30 万的薪水，该人购买产品的概率为 80%。”逻辑回归有助于获得这种输出。上述获得的最拟合线的形式为：`images/0027.jpeg` 现在考虑变量
    `p:images/0028.jpeg` 将 `y` 替换为 `p` 如下：`images/0029.jpeg` 任何薪水的图表都会给我们购买的概率。但我们想要的输出是“是”或“否”，因此我们选择了一条
    50%线，所有概率在 50%及以上的点都将被视为“是”，其他的被视为“否”。`images/0031.jpeg` 黄线代表 50%概率线。逻辑回归用于医学和社会科学领域。它被用于评估疾病的严重程度。根据人的年龄、性别和其他健康状况来评估病情。逻辑回归通过此数据预测一个人是否通过考试。逻辑回归提供了关于学生是否通过的信息。表
