    # 5.8. CONFUSION MATRIX


    The confusion matrix is also known as error matrix. It helps in evaluating the
    performance of a machine learning algorithm.(images/00337.jpeg)


    # CLUSTERING


    Clustering is a non-supervised machine learning algorithm. It is same as classification
    but in clustering nobody has any idea what they are looking for. Clustering is
    done to identify different clusters. The data points in each of the cluster have
    something in common. These clusters cannot be formed by simply studying the data.
    Clustering helps in finding observation that might have been missed while studying
    the data, these observations may be very informative. The popular methods used
    for clustering are:


    1. `K-means clustering`

    2. `Hierarchical clustering`


    ![](images/00338.jpeg)


    # 6.1. K-MEANS CLUSTERING


    K-means algorithm is a unsupervisied machine learning algorithm used for clustering.
    Consider the following scatter plot of a data set: ![Screenshot (1149).png](images/00339.jpeg)
    The scatter plot of the above data after k-means is applied: ![Screenshot (1150).png](images/00340.jpeg)
    The data is clustered into three categories after k-means algorithm is applied
    to the data.


    Steps for k-means clustering :


    - **STEP-1**: Choose the number of clusters `k` into which the data should be
    divided.

    - **STEP-2**: Select at random `k` points, as centroids.

    - **STEP-3**: Assign each data point to the closest centroid.

    - **STEP-4**: Compute and place the new centriod for each cluster.

    - **STEP-5**: Reassign each data point to the new closest centroid. If reassignment
    took place, go to step 4,otherwise stop the process.


    Random initialization trap in k-means: Consider the following scatter plot: ![Screenshot
    (1151).png](images/00341.jpeg) If three centriods are selected in the initial
    step then the output will be: ![Screenshot (1152).png](images/00342.jpeg) But
    if only one centroid is selected then the output will be: ![Screenshot (1153).png](images/00343.jpeg)
    In the above clustering we get only one cluster, this type of clustering gives
    us a bad output. If two centroids are selected: ![Screenshot (1154).png](images/00344.jpeg)
    The clustering is good but with three centroids we would get better results. If
    four centroids are selected: ![Screenshot (1155).png](images/00345.jpeg) The data
    is divided into more number of clusters than required. Therefore selecting the
    number of initial clusters is a crucial step. The wrong selection will affect
    our clustering. To overcome this problem we use `Kmeans++`.

