    In today’s world, everything is automated. All human actions are being replaced
    by machines. Machine learning plays an important role in the process of automation.
    For example, consider, Facebook suggesting friends and Youtube recommending videos,
    based on the user''s preference, this scenario is carried out by machine learning.
    The process behind this scenario is Facebook or Youtube collects the past data
    and feeds it into a machine, which will incorporate the data to recommend future
    preferences.


    Machine Learning entirely depends on data. Without Data, it is impossible to train
    a Machine learning model. Data is the most essential aspect of Machine Learning
    as it enables a machine to learn and work properly. Many machine learning projects
    have failed due to a lack of good data set despite having the best algorithms.
    Data is the collection of facts and figures that are gathered and formatted in
    a special way for analysis. Data is the most powerful and valuable tool any organization
    can have. Data is raw, unorganized figures that need to be processed. The data
    which is processed and organized is used for the analysis of any real-time situations.
    Organizing the whole data creates a dataset that is further used for analysis.
    Data, when used to its maximum potential, will have a prodigious impact on an
    organization''s long term success.


    ML helps in analyzing and processing the data and gives predictions about our
    future. Machine learning (ML) focuses on analyzing and interpreting patterns and
    structures in data to enable learning, reasoning, and decision making outside
    of human interaction. ML comprises of several algorithms. The data is analyzed
    by using these algorithms and can make data-driven outputs and recommendations
    by using the input data. The algorithm has the ability to make some corrections
    and incorporate that information to improve its further decision making. ML has
    many factors to make it accessible, one of them is data handling. Machine Learning
    can be multidimensional. In Machine learning, the work is constantly done on data.
    Huge amount of data is taken for training and testing. This data handling and
    organizing make Machine learning an important key in automation.


    ## DATA PREPROCESSING


    Applying machine learning algorithms to the data sets does not give the best outcomes.
    Processing the data before applying any machine learning algorithm to it is the
    most important aspect. The output of the machine learning model depends on how
    well the data is processed. Data processing has several steps, which are explained
    below in detail.


    In the first step of dealing with data in Machine Learning, creating the data
    sets plays an important role. A data set is a structured collection of data. After
    the collection of data and organizing it, the data has to be arranged into a dataset
    for the creation of machine learning models. Datasets may include any number of
    figures and characters arranged in rows and columns. In creating the best machine
    learning model, gathering the data isn’t just enough, but classifying and labeling
    of data plays a major role. This makes the dataset accurate enough to give a realistic
    vision. A data set consists of several variables; machine learning algorithms
    are applied to a data set to predict the value of variable using factors that
    affect it. The value being predicted is called the dependent variable, and the
    factors it depends on are called independent variables.


    ![Screenshot (727).png](images/00008.jpeg)


    Most Machine learning algorithms possess two ways to precede, learning, and predicting.
    Therefore the data set is divided into:


    ### 1. Training Dataset

    **Training dataset**: The machine learning algorithm needs to be trained by feeding
    it data. Training data will help the algorithm or the machine to connect the patterns
    in the data to give the best output. This training data comprises the majority
    of the dataset.


    ### 2. Testing Dataset

    **Testing Dataset**: The testing dataset is used to evaluate the performance of
    the machine learning model which has already been trained. The reliability of
    the model is checked on the training dataset. The testing dataset is basically
    used for interfacing how well the model performs. The most important point that
    has to be noted here is training should never be done on the testing set. A test
    dataset is independent of the training dataset, but it has the same probability
    distribution as the training set. If the machine learning model is trained with
    a training set and tested with the same set, the best results are obtained, but
    not the accurate one. Thus it is important to test the machine with the test set.


    ### 3.1. LIBRARIES


    When working with datasets in machine learning models, the algorithm can be carried
    out in `Python`, or `R`. Python is employed to apply machine learning algorithms
    to the data. Python offers concise and readable codes that make complex algorithms
    in machine learning easily accessible. Python is the combination of consistent
    syntax, shorter development time, and is flexible; this makes it well suitable
    for any kind of complex machine learning model. It is a comprehensive set of libraries
    that are the greatest asset for `python`. Libraries are a set of well-structured
    and well-tested functions to empower the best.


    The most important libraries are:


    - `NumPy`: A very popular library used for fundamental computations. It is vastly
    applicable for linear algebra, Fourier transform, and random number capabilities.

    - `Pandas`: The most popular library used for data analysis. It has many inbuilt
    functions like grouping, filtering, and combining data.

    - `Matplotlib`: 2D plotting library used for creating 2D graphs and plots.

    - `Scikit-Learn`: One of the most prominent machine learning libraries used for
    supervised and unsupervised learning algorithms and for data mining.


    ### 3.2. IMPORTING THE DATASETS


    While programming in `python`, it is important to set the working directory so
    that the code will execute. To set the working directory, first select the folder
    where the data set is present and save the `python` file in the same folder. After
    setting the working directory, import the data set on which the machine learning
    algorithm is to be applied.


    ### 3.3. DIVIDING DATA SET INTO INDEPENDENT AND DEPENDENT VARIABLE ARRAYS


    After importing the data set, dividing the data set into training and testing
    sets is important.


