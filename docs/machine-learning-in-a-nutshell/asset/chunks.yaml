    # 5.3 支持向量机


    支持向量机（SVM）是一种用于数据分类的监督学习机器学习算法。SVM 背后的数学原理在回归分析中已经见过了了。SVM 仅对线性数据有效，即可以用直线或平面分离的数据。![Screenshot
    (1014).png](img/00255.jpeg)


    支持向量机最近没有被广泛使用。随着模型变得越来越复杂和先进，它的用处有所下降。SVM 对于中等规模的数据非常有用。它们在文本分类中也非常好用。


