    ### Python 中的多元线性回归：


    多元线性回归是简单线性回归的扩展，涉及涉及多个特征或变量来预测输出。执行多元线性回归的步骤与简单线性回归几乎相似。仅理解多元线性回归背后的数学并不会产生最好的结果。对给数据集具备先验知识是非常重要的，而且注意虚拟变量陷阱（dummy
    variable trap）也是重要的。


    #### 虚拟变量陷阱：


    如果模型包含分类数据，它们会被解码为虚拟变量。因此，考虑到分类变量列中有‘n’个不同的名称，一个独立变量列被划分为‘n’列。如果我们将所有这些‘n’列作为输入到我们的模型中，它将无法区分某一列与其他列之间的影响。例如，假设我们有一个输入
    India 和 Australia 的分类变量列。考虑下列：


    | State  |

    | --- |

    | India  |

    | Australia  |

    | India  |

    | India  |

    | Australia  |

    | India  |

    | Australia  |

    | Australia  |


