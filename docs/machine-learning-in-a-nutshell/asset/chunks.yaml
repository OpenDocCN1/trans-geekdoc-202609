    # 5.7. 随机森林分类


    随机森林分类是决策树分类的扩展。决策树分类只考虑单棵树的决策，而随机森林考虑的是整个树森林的决策。将随机森林回归应用于我们的数据的遵循步骤如下：


    - **步骤-1**：从训练集中随机选取 `k` 个随机点。

    - **步骤-2**：现在为这 `k` 个随机点构建一棵决策树。

    - **步骤-3**：选择你想要构建的数量，并重复步骤 1 和步骤 2。

    - **步骤-4**：当给出一个新点进行预测时，让所有树预测输出的类别，然后将该点分配给大多数树所预测的类别。


