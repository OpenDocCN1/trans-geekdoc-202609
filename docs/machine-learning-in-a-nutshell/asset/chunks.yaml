    # Stochastic Gradient Descent


    In the previous method `gradient descent` the curve should be convex, but the
    cost curve cannot be convex. If the `gradient descent` method is used for such
    functions then the local minimum will be found. ![Screenshot (1189).png](images/00378.jpeg)


    In batch gradient descent all the rows are run and then the cost function is checked,
    but in stochastic gradient descent the cost function for each row is checked and
    then this cost function is given as input to neural network. Stochastic gradient
    descent helps in finding the global minimum in a faster way.


    # Artificial Neural Network in Python


    ![Screenshot (1190).png](images/00379.jpeg)![](images/00380.jpeg)


    ## Code Explanation


    The first nine lines of code20 import the important libraries and the data set.
    The data set is divided into independent and dependent variables. ![Screenshot
    (1192).png](images/00381.jpeg)![Screenshot (1193).png](images/00382.jpeg)![](images/00383.jpeg)


    The code lines from 13th to 20th decode the categorical variables into dummy variables.
    ![Screenshot (1195).png](images/00384.jpeg)


    The 23rd and 24th divide the data into test set and training set. The training
    and test sets of independent variables are scaled using the code lines 27th to
    30th . ![Screenshot (1196).png](images/00385.jpeg)![Screenshot (1197).png](images/00386.jpeg)


    In the 35th line the `keras` library is imported. From the `kiras` library the
    `sequential` package is imported. This package helps in initializing our neural
    network either as a sequence or as a graph. Later the `dense` package is imported,
    this package is used to create the layers in the artificial neural network.


    The artificial neural network is initialised in the 40th line through the object
    called `classifier`. An object of the `sequential` class is created. In the 40th
    line the `add` method is used to add the first hidden layer to the neural network.


    The first parameter given to the `dense` function is `output_dim`, this parameter
    specifies the number of nodes that should be present in the first hidden layer.
    There is no thumb rule to use a specific number of nodes. The optimum number of
    nodes are generally found through experimenting. Just to get an optimum value
    the average of the number of nodes in the output and input can be taken or else
    the technique called parameter tuning can be used to find the optimum number of
    nodes. It uses some techniques like K4 cross validation. It consists of creating
    a separate set apart from the traning and the testing set called the validation
    set. Basically different parameters of the model are experimented on thus set.
    So typically the performance of different models is tested with different parameters.


    The next input parameter to the `dense` function is `init`. This is the first
    step of stochastic gradient descent. The weights are randomly initialised with
    small numbers close to zero. It is initialized with a uniform function. The next
    input parameter is `activation`. The activation function that is used in the hidden
    layers is the rectifier function which is calles as `relu`. The last parameter
    is `input_dim` which gives the number of nodes in the input layer.


    In the 46th code line the second hidden layer is added to the neural network.
    It has the same parameters as the before code line except that the last parameter
    `input_dim` is removed. The number of nodes of the input layer need not be specified
    for the second hidden layer.


    In the 52nd code line the output layer is added to the network. The input parameters
    are same as the befor code line. As this is the output layer the activation function
    will be the sigmoid function. The input to `input_dim` will be one because we
    have only one category. If the dependent variable has two or more categories then
    `softmax` fuction is chosen instead of `sigmoid`.


    The next code line adds the output layer to the artificial neural network. This
    code line complies the network. Compiling consists of applying sochastic gradient
    descent to the neural network. Therefore we use the `compile` method. The first
    input parameter is `optimizer`, it is an algorithm used to find the optimal set
    of weights in the neural network. There are many types of sochastic gradient descent
    processes which can be used, `adam` is most efficient among them. The second parameter
    `loss`, the lost function used is going to be of logarithmic class. If the dependent
    variable has a binary outcome then the lost fuction is `binary_logarithmic` or
    else it is `categorical_cross entropy`. The last parameter is `metric`, it is
    the criteria we choose to evaluate the model. We use the accuracy criteria. It
    is used to improve the model performance.


    In the 55th line the data set is fit to the neural network. Therefore the first
    two arguments are `x_train` and `y_train`. The next argument is `batch_size`,
    it is the number of observations after which the weights will be updated. The
    last argument is `epoch`. Epoch is basically around when the whole traning set
    is passed through ANN and in reality training ANN consists of applying all steps
    through many epouchs. There is no rule for the input of epoch and batch size.


    The 60th and 61st lines are used to predict the test set inputs. ![Screenshot
    (1198).png](images/00387.jpeg)The 65th line gives us the confusion matrix. ![Screenshot
    (1199).png](images/00388.jpeg)


    [Click here to obtain the above mentioned dataset and python code for artificial
    neural networks.](https://drive.google.com/drive/folders/1s25-vyj2iL3HGVItUvLhDpM1XilLHR6s?usp=sharing)

