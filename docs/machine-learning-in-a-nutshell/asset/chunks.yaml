    ## 9.2. 特征提取


    特征提取对给定的输入数据进行处理，并从数据构建出自己的值。这些值包含丰富的信息，并帮助我们预测更好的结果。应用于我们数据的特征提取的技术有：1. `PCA`
    2. `LDA` 3. `Kernel PCA` 4. `QDA` 等。我们已经在回归主题中讨论过后向剔除、正向选择和双向消除。在本单元中，我们将重点关注
    `PCA` 和 `LDA`。


    ### 9.2.1. 主成分分析


    `PCA` 的主要目的是识别和学习变量。它检查所有变量，如果发现它们之间存在很强的相关性，就会降低维度。与我们目前学习的尝试预测输出值的算法不同，`PCA`
    试图理解自变量和因变量之间的关系。在 `PCA` 中，我们首先在高维数据找到方差最大的方向，然后将其投影到低维子空间中。在整个过程中，它保留了所有数据。因此，简单来说
    `PCA` 可以定义为将 `k` 维数据集的维度降低到 `n` 维，其中 `k` 大于 `n`。


    `PCA` 算法遵循的步骤：

    1. 第一步是对给提供的数据集进行标准化。

    2. 从相关矩阵或协方差矩阵获取特征向量或特征值。

    3. 将特征值按降序排列，并选择对应于最大值的 `n` 个特征向量。因此，我们数据的新维度为 `n`。

    4. 从选出的 `n` 个向量构建投影矩阵 `Z`。

    5. 通过 `Z` 原始数据集以获得 `n` 维特征子空间 `y`。


    `PCA` 广泛用于噪声过滤、可视化、特征提取、股票预测、基因分析等。Python 中的 `PCA`：表 9.1


