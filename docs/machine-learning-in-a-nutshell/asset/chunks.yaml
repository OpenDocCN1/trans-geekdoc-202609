    ## 4.3. 支持向量回归 (SUPPORT VECTOR REGRESSION)


    支持向量机是一种用于回归和分类的机器学习算法。SVM 选择一个超平面来帮助定义连续值![Screenshot (869).png](img/00197.jpeg)从上图所示，超平面被边界线包围。这些线被称为边界。边界定义为超平面与最近点的垂直距离。为了拟合所有数据点，SVR
    算法最大化该边界。距离超平面的点被称为支持向量。因此，一个完美划分数据的超平面可能无法找到，有时为了最大化边界，某些违反边界的点会被排除。SVR 算法的目标是在阈值范围内保留尽可能多的支持向量。这些线就是边界线。SVR
    与线性回归的区别在于，线性回归旨在最小化误差，而 SVR 试图将其保持在阈值内。


    ### 支持向量回归的数学原理


