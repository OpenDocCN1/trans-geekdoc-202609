    # DEEP LEARNING


    Deep learning is part of machine learning which mimics the human brain to carry
    the work done by machine learning. The world is growing faster, with increasing
    population the amount of data increases. Any part of the data cannot be neglected
    until and unless it is known that the data is not important. Scrutinizing bulk
    data and organizing it is humanly impossible, even if it is done a lot of time
    is consumed and the output is not the best. Deep learning helps in apprehending
    large unordered data. At first deep learning didn’t get popularity, this is because
    back then the data available was not sufficient and the processing rate was very
    low. In the modern times deep learning is becoming a part of everything. Deep
    learning works based on artificial neural networks. It uses mutiple levels to
    extract higher level features from the unorganised data. In each successive level
    it learns to improve the. It makes the data more organised and abstract. This
    helps in incuring the best output from the set of large unorganised data. Data
    learning is used in automatic speech recognistion, image recognition, visual art
    processing, natural language recognition, drug toxicity and detection, customer
    relationhip management, military, etc. ![Screenshot (1173).png](images/00363.jpeg)


    ## 7.1. ARTIFICIAL NEURAL NETWORKS


    Artificial neural networks or connectionist systems are computing systems which
    try to mimic the human brain. The aritificial neural networks learn from the input,
    rather than getting prior instruction. For example: in image recognition if the
    artificial neural network is given several images of dog then it learns from the
    images that the animal with particular features like ear shape, nose shape, body
    shape, fur, etc is a dog. The `ANN` doesn’t know what a dog is but it learns from
    the images.


    ### The Neuron


    The whole purpose of deep learning is to imitate the human brain. ![Screenshot
    (175).png](images/00364.jpeg) `X1`, `X2`, and `X3` represent the input. These
    should be standardized. `W1`, `W2`, and `W3` are the weights. These are the important
    part. The neuron takes the weighted sum. ![Screenshot (176).png](images/00365.jpeg)


    ### Threshold Function


    After getting the weighted sum the activation function is applied. ![Screenshot
    (177).png](images/00366.jpeg) The following functions are as:


    ![Screenshot (178).png](images/00367.jpeg) Even though it has kinks, it is nice.


    ![Screenshot (179).png](images/00368.jpeg) This curve has no kinks, it is smooth.


    ![Screenshot (180).png](images/00369.jpeg) These are the most popular functions
    for neural networks.


    ![Screenshot (181).png](images/00370.jpeg) In the hidden layer the threshold function
    is applied.


    ![Screenshot (182).png](images/00371.jpeg) To the output layer the sigmoid function
    is applied.


    ### How do ANN learn?


    1. One way through which `ANN` learn is coding. In coding the neural networks
    are given all the information. Therefore there is not much work the neural network
    should do because it is already being provided with the independent variables.

    2. The inputs to the neural network are given along with expected outcomes and
    the neural network is allowed to learn on its own. The following steps are followed
    by the neural networks to learn and give the output. ![Screenshot (183).png](images/00372.jpeg)
    `Y` is the real output. `Y*` is the output predicted by the network.


    ## Cross Validation


    The graph representing the real output value and the values predicted by the network
    is drawn. ![Screenshot (184).png](images/00373.jpeg) Now the cost function is
    calculated.


    ![Screenshot (185).png](images/00374.jpeg) `C` represents the cost function for
    the weights the neural network choose.


    ![Screenshot (186).png](images/00375.jpeg) This cost function is calculated for
    all the inputs with different weights and a graph is drawn.


    ## Gradient Descent


    Neural networks always try to decrease the cost function. In this method different
    weights are considered and the cost function is calculated. After the cost function
    is calculated a graph is plotted between cost function and weights. ![Screenshot
    (187).png](images/00376.jpeg) As the weights increase we fall into the curse of
    dimenstionality. ![Screenshot (188).png](images/00377.jpeg)

