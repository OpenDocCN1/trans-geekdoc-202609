    ## 3.7. TYPES OF DISTANCES


    Machine learning is extensively used in clustering, classification, image recognition,
    and information retrieval process. Choosing a good distance metric plays a very
    crucial role. Almost all the machine learning algorithms use a distance metric
    to evaluate the input data pattern to predict any data-based decision. There are
    a number of different distances, three of which are discussed below.


    ### Minkowski Distance

    Minkowski distance is a metric in normed vector space. A Normed vector space is
    a vector space on which a norm is defined. Suppose `X` is a vector space then
    a norm on `X` is a real valued function `||x ||` which satisfies below conditions:


    1. **Zero Vector** - Zero vector will have zero length.

    2. **Scalar Factor** - The direction of vector doesn’t change when you multiply
    it with a positive number though its length will be changed.

    3. **Triangle Inequality** - If distance is a norm then the calculated distance
    between two points will always be a straight line.


    The distance is calculated using the formula: ![Screenshot (751).png](images/00031.jpeg)The
    Minkowski distance is a generalized distance, different distances between two
    points can be found by changing the value of `p`.


    ### Manhattan Distance

    Manhattan distance comes into play when the distance between two points is to
    be calculated in a grid like path. The value of `p` is 1 in the case of Manhattan
    distance. ![](images/00032.jpeg)The distance between `x` and `y` is given as the
    absolute sum of differences between its Cartesian coordinates. ![Screenshot (753).png](images/00033.jpeg)Where
    `n`= number of variables ![](images/00034.jpeg)and![](images/00035.jpeg)are the
    variables of `x` and `y` respectively.


    ### Euclidean Distance

    This is most used metric distance. The value of `p` is 2 in case of euclidean
    distance. The euclidean distance is a simple straight line distance between any
    two points. The formula is given by: ![Screenshot (761).png](images/00036.jpeg)![Screenshot
    (754).png](images/00037.jpeg)


    ## 3.8. TYPES OF LEARNING IN MACHINE LEARNING


    A machine is said to be learning from the data which is fed to it to perform certain
    class of tasks. Machine Learning is sub-categorized into three types:

    1. Supervised learning

    2. Unsupervised learning

    3. Reinforcement learning


    ### Supervised learning

    The process of learning in which the data set guides or trains the model. When
    the data is trained, it starts predicting the outcomes. The supervised machine
    learning model deals with the labeled data.


    ### Unsupervised learning

    In unsupervised learning, the machine learning model deals with unlabeled data
    and it learns through observations and evaluates patterns in the data. It automatically
    finds structures and relationships in data by creating clusters.


    ### Reinforcement learning

    It is the ability of the dataset to interact with the environment and find out
    what is the best outcome. It enables the dataset to learn in an interactive environment
    by the concept of hit and trial using feedbacks from its own experiences and actions.
    ![Screenshot (755).png](images/00038.jpeg)


    Regression is a statistical approach to predict the outcome of an event based
    on the relationship between the independent and dependent variables obtained from
    the dataset. Regression is a supervised machine learning approach. It is a predictive
    modeling technique. Regression techniques are widely used in the field of finance
    and investment for future forecasting. In recent times regression is being used
    in the field of business. For example, consider a firm dealing with garments.
    It has to produce new stock. Regression takes information about the previous sales
    and helps the firm to figure out which variety of clothes it should produce for
    maximum profits. Hence regression helps in financing an enterprise in the best
    possible way. Regression is a machine algorithm based on the hypothesis that can
    be linear and non-linear. The hypothesis is a function based on some hidden parameters
    and patterns in inputs. Regression models are used to predict real and continuous
    values.


    Types of Regression:

    1. Simple Linear Regression

    2. Multiple Linear Regression

    3. Polynomial Regression

    4. Support Vector Regression

    5. Decision Tree Regression


    ## 6. Random Forest Regression


