    ## 随机森林回归


    随机森林是决策树的扩展。随机森林回归使用许多树，而决策树回归只考虑一棵树。![Screenshot (879).png](img/00215.jpeg) 使用
    Python 将随机森林回归应用于给定数据。


    ### 随机森林回归的步骤


    1. 从数据集中随机点。

