    \n[Click here to obtain the above mentioned dataset and pythoncode for convolutional\
    \ neural networks.](https://drive.google.com/drive/folders/1zjdBh6aLehHof8Mk4xZSjGMqFtAegra4?usp=sharing)\
    \ \n\n## DIMENSIONALITY REDUCTION\n\nDimensionality reduction is a process in\
    \ which we reduce the number of input independent variables that determine the\
    \ outcome . Consider that in a data set we collected the independent variables\
    \ are numerous, and the dependent variable varies as these quantities change.\
    \ The most important point we have to note here is that the dependence of the\
    \ outcome on all the independent variables is not the same. The outcome may dependent\
    \ on mostly on only two variables and very less on other inputs. In such cases\
    \ if we give all the independent variables as input to our machine, instead of\
    \ obtaining the best results we will get average results. This is because we overfed\
    \ our model with exessive data. The dimensionality reduction techniques help us\
    \ solve this problem by finding the most important independent variables or by\
    \ deriving values that are informative. \n\nThe dimensionality reduction is classified\
    \ as : \n\n1.  Feature selection \n\n2.  Feature extraction \n\n![Screenshot (1218).png](images/00408.jpeg)\n\
    \n9.1. FEATURE SELECTION: This is the process of selecting certain independent\
    \ variables from many independent variables. This can be achieved by many algorithms\
    \ in which the simplest way is to consider different groups of independent variables\
    \ and find the error. Some of the techniques for applying feature selection to\
    \ our data are: 1.backward elimination 2.forward selection 3.bidirectional elimination,\
    \ *etc.* "
