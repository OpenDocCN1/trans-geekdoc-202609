    ## 5.6 决策树分类

    决策树分类是一种监督学习机器学习算法。在回归单元中已经学习了决策树算法，该算法对于回归和分类是相同的，区别在于回归的输出是数值，而在分类中输出是一个类别，且在分类中我们使用基尼指数（Gini
    index）。基尼指数是数据集中不平等性的衡量。它的值处于 0 到 1 之间。考虑一些随机数据的散点图：![Screenshot (1055).png](img/00314.jpeg)


    现在通过创建划分将数据划分为不同的部分：![Screenshot (1056).png](img/00315.jpeg)


    散点图中创建的划分对应的决策树为：![Screenshot (1057).png](img/00316.jpeg)


