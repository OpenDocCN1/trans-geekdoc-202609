    \ is the optimum value considered, therefore it should be removed. In the 33rd\
    \ code line while considering the ‘a\\_opt’ array x4 independent won’t be considered.\
    \ The same steps are again used to find the new ‘p’ values. ![Screenshot (851).png](images/00163.jpeg)The\
