- fmt: "\n# 8.2. CONVOLUTIONAL NEURAL NETWORKS\n\nIn the similar way where human brains\
    \ identify the objects when a picture is seen, the goal of Convolutional Neural\
    \ network is to train computer algorithms to recognize objects in the same manner.\
    \ However, there exists a huge difference between the analyzing process of human\
    \ brain and a computer. To a computer, an image is just another array of numbers\
    \ but it is not the same for the human brain. Each object has its own pattern\
    \ and that is what the computer will use to identify an object in an image. \n\
    \nTo explain convolutional neural networks in simple terms, just as children get\
    \ trained to understand the difference between people and objects when an image\
    \ is shown, similarly computers are also trained by showing a million images of\
    \ the same object so that their ability to recognize that object increases with\
    \ each sample. A convolutional neural network is a class of deep neural networks\
    \ most commonly applied in visual imagery and image classification. It has wide\
    \ applications in image and video recognition, recommender systems and natural\
    \ language processing. \n\nCNN’s like neural networks are made up of neurons with\
    \ learnable weights. Each neuron receives several inputs and processes it based\
    \ on activation function and responds with an output. But unlike neural networks,\
    \ where the input is a vector, here the input is a multi-channeled image.\n\n\
    ![Screenshot (1200).png](images/00389.jpeg)\n\nThe neural network is trained on\
    \ certain classified images or categorized images.\n\n![Screenshot (1303).png](images/00390.jpeg)\n\
    \nThe computer reads any input as an array of numbers. Consider a black and white\
    \ image with a `2*2` pixels, the computer reads this image as a `2d array` with\
    \ every single one of the pixel having a value between 0 and 255.\n\n![Screenshot\
    \ (1201).png](images/00391.jpeg) 0 represents white and 255 represents black.\n\
    \n![Screenshot (1202).png](images/00392.jpeg) The computer reads a colored image\
    \ as a `3D-array`. Each pixel has three values assigned to it each one of them\
    \ representing red, green and blue.\n\n## Steps involved in convolution neural\
    \ network:\n\n![Screenshot (1203).png](images/00393.jpeg)\n\n### Convolution\n\
    Convolution is a combined integration of two functions. It shows how one function\
    \ modifies another process.\n\n![Screenshot (1308).png](images/00394.jpeg) Consider\
    \ an example of input image which is decoded into an array by the computer. The\
    \ image is convoluted with another array called `feature detector` to make the\
    \ image smaller so as to increase the processing speed.\n\n![Screenshot (1205).png](images/00395.jpeg)\
    \ From Figure 8.2.2, The input image looses some of its features when convoluted\
    \ with a feature detector . The feature map helps us to get rid of the unnecessary\
    \ features , this helps to get rid of unwanted data. Several feature maps are\
    \ created, with different filters selected a diiferent feature map is obtained.\
    \ The machine decides which features are important after training.\n\n![Screenshot\
    \ (1206).png](images/00396.jpeg)\n\n### ReLU layer\nThe feature detectors may\
    \ create linearity when applied to the input image therefore to be careful rectifiers\
    \ are used to remove this linearity.\n\n![Screenshot (1207).png](images/00397.jpeg)\n\
    \n### Pooling\nThe machine recognizes the Image based on the features. All the\
    \ images of the same object are not the identical. For example consider different\
    \ images of a dog shot at different angles, with different focus, *etc.* All these\
    \ images depict the same object. The machine recognizes the image by identifying\
    \ important features such as the ears, nose, mouth, *etc.* But these features\
    \ are not always in the same part of the image so; the machine shouldn’t care\
    \ if the features are tilted, if they are of different texture, if they are bit\
    \ closer or bit farther. Even if our feature is a bit distorted the machine should\
    \ be flexible enough to detect them. Pooling helps in achieving this.\n\n![](images/00398.jpeg)![Screenshot\
    \ (1208).png](images/00399.jpeg)![Screenshot (1210).png](images/00400.jpeg)\n\n\
    Maximum pooling or average pooling can be considered. The output after pooling\
    \ the feature map is known as pooled feature map. Any important features are not\
    \ lost in this process because we are considering the maximum pixels. The size\
    \ of the image is reduced 75% and also reduces the number of parameters. Pooling\
    \ will help the model to not overfit onto the information that is not important.\n\
    \n### Flattening\nThe next step after pooling is flattening. In this step the\
    \ feature map will be flattened into a column. The numbers are taken row by row\
    \ and made into one column. The flattening process is done so that this layer\
    \ can be given as input to the artificial neural network.\n\n![Screenshot (1211).png](images/00401.jpeg)![Screenshot\
    \ (1212).png](images/00402.jpeg)\n"
