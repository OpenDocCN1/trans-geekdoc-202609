  \ mathvariant=\"normal\">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</m:mi><m:mfrac><m:mn>1</m:mn><m:mn>9</m:mn></m:mfrac><m:msub><m:mi>m</m:mi><m:mrow><m:mi>i</m:mi><m:mo>,</m:mo><m:mi>j</m:mi><m:mo>+</m:mo><m:mn>1</m:mn></m:mrow></m:msub><m:mo>+</m:mo><m:mfrac><m:mn>1</m:mn><m:mn>9</m:mn></m:mfrac><m:msub><m:mi>m</m:mi><m:mrow><m:mi>i</m:mi><m:mo>+</m:mo><m:mn>1</m:mn><m:mo>,</m:mo><m:mi>j</m:mi><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:msub><m:mo>+</m:mo><m:mfrac><m:mn>1</m:mn><m:mn>9</m:mn></m:mfrac><m:msub><m:mi>m</m:mi><m:mrow><m:mi>i</m:mi><m:mo>+</m:mo><m:mn>1</m:mn><m:mo>,</m:mo><m:mi>j</m:mi></m:mrow></m:msub><m:mo>+</m:mo><m:mfrac><m:mn>1</m:mn><m:mn>9</m:mn></m:mfrac><m:msub><m:mi>m</m:mi><m:mrow><m:mi>i</m:mi><m:mo>+</m:mo><m:mn>1</m:mn><m:mo>,</m:mo><m:mi>j</m:mi><m:mo>+</m:mo><m:mn>1</m:mn></m:mrow></m:msub></m:mtd></m:mtr></m:mtable></m:math>\n\
  \n这种类型的滤波器称为 *盒式滤波器* 或 *平均滤波器*。卷积后，滤波后的像素形成 Figure 8-2 中所示的图像：\n\n![FIGURE 8-2:\
  \ Convolution with the box filter reduces the amount of noise in the image.](img/9788126592555-fg0802.png)\n\
  \nFIGURE 8-2: 使用盒式滤波器进行卷积可减少图像中的噪声量。\n\n盒式滤波器去除了图像的大量噪声，但也去除了不是噪声的细节。为了改进盒式滤波器，工程师们设计了一种更有效的降噪滤波器，称为\
  \ *高斯滤波器*。滤波器的元素由高斯曲线的值决定。\n\n###### Filters and features\n\n图像滤波不仅仅是添加效果。一个关键的应用涉及在更大的图像中查找图像。考虑\
  \ Figure 8-3 中介绍的 7-x-7 滤波器。\n\n![FIGURE 8-3: The filter’s elements correspond to\
  \ the pixels of the smiley face.](img/9788126592555-fg0803.png)\n\nFIGURE 8-3: 滤波器的元素对应于笑脸的像素。\n\
  \n如果仔细观察滤波器矩阵，你会看到其元素标识了右侧灰度图像的像素值。换句话说，滤波器定义了它自己的小图像——一个笑脸。图像与其自身的点积会产生一个较大的值，因此如果图像包含一个\
  \ 7-x-7 的笑脸，对该图像与此滤波器进行卷积将在笑脸所在的位置产生一个较大的值。\n\n卷积的这一特性使得在更大的图像中定位图像成为可能。例如，一架飞机的图像应该有一个驾驶舱、两个机翼和一个机身。如果为驾驶舱使用一个滤波器，为机翼使用一个，为机身使用一个，则每个滤波器的高卷积值都表明飞机的存在。\n\
  \n这些感兴趣的子图像称为 *特征*，并且应用程序可以通过将图像与适当的滤波器进行卷积来检查特征是否存在于图像中。较高的卷积结果表明该特征存在于图像中。\n\n\
  ###### Feature detection analogy\n\n当谈到图像滤波时，你很容易陷入数学中而忘记发生了什么。所以这里有一个奇怪的类比：想象你有一块放大镜和一张大型人群的高分辨率图像。当你将玻璃在图像上移动时，你可以更清楚地看到人群中的每个人。\n\
  \n假设你在玻璃上雕刻了你的脸。之后，你神奇地施法让玻璃显示一个数字，该数字标识雕刻与玻璃下方图像的匹配程度。最大的数字将出现在玻璃正好位于你脸上的时候。\n\n\
  \n\n\n\n现在假设你手头还有其他放大镜，每个放大镜上都刻有一位家庭成员的图像。如果你检查不同放大镜显示的数字，你就能定位到每位家庭成员，从而在人群中定位到你的家人。\n\
  \n在这个类比中，每个放大镜都是一个滤波器，每幅刻印的图像都是一个特征。将玻璃在图像上移动并读取数字的过程对应于卷积。\n\n###### 设置卷积参数\n\n\
  当你使用卷积对图像进行分类时，并不会直接设置滤波器的元素。相反，你需要提供输入图像及其对应的类别。应用程序的工作是确定哪些滤波器最能支持正确的分类。以这种方式，滤波器类似于第\
  \ 7 章中讨论的神经网络的权重。\n\n即使你不能设置滤波器的元素，你也可以设置滤波器的许多属性，例如其数量和大小。你还可以配置卷积的另外三个方面：\n\n\
  *   `stride`：将滤波器从一个 2-D 点积移动到下一个\n*   `dilation`：通过插入零值元素来扩展滤波器的大小\n*   `padding`：考虑图像边缘附近的像素\n\
  \n这些参数在确定应用程序如何执行卷积方面起着重要作用。以下各节将详细探讨它们。\n\n####### Stride\n\n在每次二维点积之后，卷积过程将滤波器向右移动一个像素。当一行像素的所有点积都计算完毕后，卷积会将滤波器向下移动一个像素并继续计算二维点积。\n\
  \n这是默认行为，但开发人员可以通过设置 *stride*来自定义卷积的执行方式。Stride 决定了滤波器在每次点积后移动多少。要设置 stride，你需要提供两个值：水平像素位移和垂直像素位移。默认\
  \ stride 始终为 `(1, 1)`。\n\n例如，如果你将 stride 设置为 `(2, 3)`，滤波器在每次点积后会向右移动两个像素。在完成一行所有的点积后，滤波器会向下移动三个像素并开始计算进一步的点积。这种增加的\
  \ stride 减少了卷积所需的计算量，但也减少了细节量。在本书中，stride 将始终设置为 `(1, 1)`。\n\n####### Dilation\n\
  \n术语 *dilation* 通常指的是身体某一部分的拉伸或扩张，例如眼睛的瞳孔。在图像处理中，dilation 指的是拉伸滤波器的元素。与 stride 一样，你可以通过提供两个值来指定\
  \ dilation：一个设置水平拉伸，一个设置垂直拉伸。默认值是 `(1, 1)`，表示不应进行拉伸。\n\n随着 dilation 的增加，滤波器的有效大小会增加，但非零元素的数量不会改变。相反，dilation\
  \ 会在滤波器的元素之间插入零。\n\n例如，如果你将 dilation 设置为 `(2, 1)`，卷积将在滤波器中每对水平元素之间插入一个零。这些零元素不会为二维点积贡献任何值。\n\
  \n通过改变 dilation，应用程序可以有效地检测不同大小的特征。有关该主题的深入讨论，我推荐 Fisher Yu 和 Vladlen Koltun 于 2015\
  \ 年发表的论文 *Multi-Scale Context Aggregation by Dilated Convolutions*（ICLR 2016）。\n\
  \n####### Padding\n\n如果滤波器的大小为 `NxN`，卷积将为输入图像中的每个像素计算一个 `NxN` 二维点积。如果一个像素位于图像边缘或靠近边缘，则\
  \ `NxN` 点积应如何计算就不清楚了。\n\n在 TensorFlow 中，开发人员可以以两种方式之一配置边界像素的处理。第一种方法涉及忽略位于图像边缘或附近的像素。忽略这些像素的优点是结果图像中的每个像素都是准确的。缺点是输出图像会小于输入图像。\n\
  \n第二种方法涉及扩展图像并在其原始边界之外插入零。如果像素位于图像边缘，点积将考虑这些零。因此，输出图像将与输入图像大小相同，但输出图像上/附近边缘的像素不会完全准确，因为它们是使用零计算的。\n\
  \n##### 卷积神经网络 (CNNs)\n\n传统的神经网络接收一系列输入值，将每个输入值乘以权重，并将处理后的数据通过一系列层传递。这种方法对于通用数据分析来说是可以的，但对于处理图像和类似的\
  \ 2-D/3-D 数据来说是不够的。图像分类需要卷积，因此，旨在进行图像分类的神经网络被称为卷积神经网络，或 CNN。\n\nCNN 在许多方面类似于常规神经网络，但它们有两个区别特征：\n\
  \n*   CNN 包含使用矩形滤波器执行卷积的卷积层。\n*   CNN 使用池化层来降低输出图像的维度。\n\n在卷积层和池化层完成工作后，CNN 使用全连接层来提供输出。图\
  \ 8-4 说明了最小 CNN 的结构：\n\n![FIGURE 8-4: Convolutional neural networks contain convolution\
  \ layers, pooling layers, and at least one fully connected layer.](img/9788126592555-fg0804.png)\n\
  \nFIGURE 8-4: Convolutional neural networks contain convolution layers, pooling\
  \ layers, and at least one fully connected layer.\n\n该网络有两个卷积层，每个滤波器产生一个输出图像。池化层减小了卷积产生的图像的大小。本节解释这些层实现了什么以及它们如何协同工作。\n\
  \n###### 创建卷积层\n\n在 TensorFlow 应用程序中，图像是一个张量，其中包含图像每个通道的矩阵。通过通道，我指的是构成图像像素的组件。例如，灰度图像有一个通道，因此其张量由一个矩阵组成。RGB\
  \ 图像有三个通道，因此其张量将有三个矩阵。\n\n卷积层接受一批图像，使用一组滤波器执行卷积，并返回包含卷积结果的输出张量。每个输出图像的大小取决于输入图像的大小以及卷积中使用填充的情况。\n\
  \n你可以通过调用 `tf.layers.conv2d` 来创建卷积层。表 8-1 列出了此函数的参数并给出了每个参数的默认值。\n\nTABLE 8-1 Arguments\
  \ of `tf.layers.conv2d`\n\n| **参数** || **默认值** || **描述** |\n| --- | --- | --- |\n\
  | `inputs` || `--` || 包含输入图像的张量 |\n| --- | --- | --- |\n| `filters` || `--` || 要使用的滤波器数量\
  \ |\n| `kernel_size` || `--` || 内核大小（正方形 NxN 的一个值，矩形 MxN 的两个值） |\n| `strides` ||\
  \ `(1, 1)` || 滤波器在 2-D 点积之间应移动的量 |\n| `padding` || `'valid'` || 处理图像边缘附近像素的方法 |\n\
  | `data_format` || `'channels_last'` || 输入张量中元素的顺序 |\n| `dilation_rate` || `(1,\
  \ 1)` || 滤波器应水平/垂直拉伸的程度 |\n| `activation` || `None` || 激活函数 |\n| `use_bias` || `True`\
  \ || 标识层是否使用偏置的布尔值 |\n| `kernel_initializer` || `None` || 滤波器值（权重）的初始化器 |\n\n\n\n\
  \n\n| `bias_ initializer` || `tf.zeros.initializer()` || 层的偏置的初始化器 |\n| `kernel_\
  \ regularizer` || `None` || 过滤器值（权重）的正则化器 |\n| `bias_ regularizer` || `None` ||\
  \ 层的偏置的正则化器 |\n| `activity_ regularizer` || `None` || 层输出的正则化器 |\n| `trainable`\
  \ || `True` || 布尔值，用于标识是否将过滤器的元素添加到图的训练变量中 |\n| `name` || `None` || 层的名称 |\n| `reuse`\
  \ || `False` || 布尔值，用于标识是否重用同名作用域的权重 |\n\n应用程序必须将 `inputs` 设置为其形状取决于 `data_format`\
  \ 参数的张量。如果将 `data_format` 设置为 `channels_last`（默认值），则 `inputs` 张量应具有等于 `[batch_size,\
  \ height, width, channels]` 的形状。如果将 `data_format` 设置为 `channels_first`，则 `inputs`\
  \ 张量应具有等于 `[batch_size, channels, height, width]` 的形状。\n\n`filters` 参数标识卷积层使用的过滤器数量。`kernel_size`\
  \ 参数标识每个过滤器的大小。如果将此参数设置为单个值 N，则每个过滤器的大小将为 NxN。如果将其设置为两个值，例如 `[M, N]`，则每个过滤器的大小将为\
  \ MxN。\n\n之前的 “Setting convolution parameters” 部分讨论了图像过滤器的步幅和扩张特性。在 `tf.layers.conv2d`\
  \ 中，您可以使用 `strides` 和 `dilation_rate` 参数设置这些属性。\n\n`padding` 参数告诉层如何处理图像的边界像素。如果将\
  \ `padding` 设置为 `valid`，层将忽略边界像素并返回比输入图像小的输出图像。如果将 `padding` 设置为 `same`，层将用零填充输入图像并生成与输入图像大小相同的输出图像。\n\
  \n`tf.layers.conv2d` 返回一个张量，其形状取决于输入图像的形状、过滤器数量和 `padding` 参数。例如，如果输入的形状为 `[N, height,\
  \ width, num_channels]` 且 `padding` 设置为 `same`，则输出的形状将为 `[N, height, width, num_filters]`。\n\
  \n通道数不影响输出的形状。在执行卷积时，`tf.layers.conv2d` 将通道合并在一起，因此灰度输入图像和 RGB 输入图像会产生相同大小的输出图像。如果您想执行通道特定的过滤，应使用的函数是\
  \ `tf.nn.depthwise_conv2d`。\n\n如果应用程序将 `padding` 设置为 `valid`，每个输出图像将小于输入图像。大小的减少取决于卷积过滤器的尺寸。例如，如果\
  \ `padding` 为 `valid`，过滤器大小等于 `[X, Y]`，且输入的形状为 `[N, height, width, num_channels]`，则每个输出图像的形状将为\
  \ `[N, height – (Y – 1), width – (X – 1), num_filters]`。\n\n###### Creating pooling\
  \ layers\n\n卷积层为每个过滤器生成一个输出图像，因此具有许多过滤器的 CNN 会生成许多图像。这些图像需要大量内存，因此开发人员通过在卷积层后跟随\
  \ *pooling layers* 来减小图像的大小。\n\n池化层将图像的像素细分为矩形块并用单个像素替换每个块。Figure 8-5 显示了此过程的工作方式。池化操作将\
  \ 9-x-8 矩阵划分为 3-x-2 块并用单个值替换每个块。\n\n![FIGURE 8-5: A pooling layer accepts an input\
  \ image, splits it into blocks, operates on each block, and returns a condensed\
  \ image.](img/9788126592555-fg0805.png)\n\nFIGURE 8-5: 池化层接受输入图像，将其拆分为块，对每个块进行操作，并返回一个压缩的图像。\n\
  \nFigure 8-5 描述了两种池化方法。第一种方法找到输入块中的最大值并将其存储在输出图像中。您可以通过调用 `tf.layers.max_pooling2d`\
  \ 创建执行此操作的池化层。\n\n第二种池化方法计算输入块中像素的平均值并将该值存储在输出图像中。您可以通过调用 `tf.layers.avg_pooling2d`\
  \ 创建使用此方法的池化层。\n\n在 `tf.layers` 包提供的池化函数中，`max_pooling2d` 是最受欢迎的。这种受欢迎是有道理的，因为较高的最大值清楚地表明了过滤器特征在图像中的存在。Table\
  \ 8-2 列出了 `tf.layers.max_pooling2d` 的参数并提供了每个参数的描述。\n\nTABLE 8-2 `tf.layers.max_pooling2d`\
  \ 的参数\n\n| **Parameter** || **Default** || **Description** |\n| --- | --- | ---\
  \ |\n| `inputs` || `--` || 输入 4-D 张量 |\n| --- | --- | --- |\n| `pool_size` || `--`\
  \ || 用于池化的块的大小 |\n| `strides` || `--` || 从一次池化操作到下一次的移动 |\n| `padding` || `'valid'`\
  \ || 填充算法：`valid` 或 `same` |\n| `data_format` || `'channels_last'` || 指定输入图像的形状\
  \ |\n| `name` || `None` || 为层提供名称 |\n\n与 `tf.layers.conv2d` 一样，输入张量的形状取决于 `data_format`。如果\
  \ `data_format` 为 `channels_last`，输入张量的形状应为 `[batch_size, height, width, channels]`。如果\
  \ `data_format` 为 `channels_first`，输入张量的形状应为 `[batch_size, channels, height, width]`。无论\
  \ `data_format` 如何，输入张量中的每个元素都必须是 `tf.float32`。\n\n要设置用于池化的块的高度和宽度，您需要将 `pool_size`\
  \ 分配给两个整数的列表或元组。对于 Figure 8-5 中说明的池化，应用程序将 `pool_size` 设置为 `[3, 2]`。\n\n`strides`\
  \ 标识块从一次池化操作到下一次池化操作移动的像素数。如果水平移动等于垂直移动，您可以将 `strides` 设置为一个整数。如果不是，您可以将 `strides`\
  \ 设置为两个整数的元组或列表，其中第一个设置垂直移动，第二个设置水平移动。对于 Figure 8-5 中说明的池化，应用程序将 `strides` 设置为 `2`。\n\
  \n如果池化操作涉及图像边界附近的点，计算将取决于 `padding` 参数。如果将 `padding` 设置为 `valid`，池化将不考虑边界像素。如果将\
  \ `padding` 设置为 `same`，函数将在池化其值之前用零填充图像。\n\n##### Putting Theory into Practice\n\
  \n一旦您理解了卷积、卷积层和池化层，您就可以准备好检查一些代码了。本节介绍一个对图像进行分类的应用程序。但与对 MNIST 数据集的图像进行分类不同，该应用程序对名为\
  \ CIFAR-10 的数据集中的图像进行分类。\n\n###### Processing CIFAR images\n\n为了测试实用的图像识别应用程序，加拿大高级研究所（CIFAR）提供了\
  \ CIFAR-10 和 CIFAR-100 数据集。与 MNIST 数据集一样，这些数据集包含图像及其分类标签。与 MNIST 图像不同，CIFAR 图像为彩色且大小等于\
  \ 32-x-32 像素。此讨论解释了如何获取 CIFAR-10 数据集并在 TensorFlow 应用程序中访问其内容。\n\n####### The CIFAR-10\
  \ dataset\n\n\n\n\n\nCIFAR-10 和 CIFAR-100 数据集的主站点是 [`www.cs.toronto.edu/~kriz/cifar.html`](http://www.cs.toronto.edu/~kriz/cifar.html)。该站点为下载\
  \ CIFAR-10 数据集提供了三个链接：一个是 Python 版本，一个是 Matlab 版本，还有一个是二进制版本。本节重点介绍 Python 版本，我建议你将其下载到开发系统上。\n\
  \n在继续之前，我建议你将归档文件下载并解压到 `ch8` 目录。解压后的目录中，你会找到一个名为 `cifar-10-batches-py` 的文件夹。该文件夹包含五个包含训练图像的文件（`data_batch_1`\
  \ 到 `data_batch_5`）以及一个包含测试图像的文件（`test_batch`）。\n\n###### 访问 CIFAR-10 图像和标签\n\n\
  CIFAR 使用一种称为 *pickling* 的过程将 CIFAR-10 文件中的数据序列化。要在 Python 中读取数据，应用程序需要导入 `pickle`\
  \ 并使用 CIFAR 文件调用其 `load` 方法。例如，以下代码访问 `data_batch_2` 中的数据：\n\n```\nimport pickle\n\
  with open('cifar-10-batches-py/data_batch_2', 'rb') as imgfile:\n dict = pickle.load(imgfile)\n\
  \ imgfile.close()\n```\n\n结果是一个包含四个键的字典：\n\n* `b'batch_label'`: 批次描述（`b' training\
  \ batch 2 of 5'`）\n* `b'labels'`: 批次图像的 10,000 个标签的列表\n* `b'data'`: 包含批次图像数据的 ndarray\n\
  * `b'filenames'`: 包含图像数据的 10,000 个 PNG 的列表（`b'stealth_fighter_s_001650.png'`）\n\n\
  每个图像标签都以 0 到 9 之间的整数提供。这些值对应于标识相应图像内容的十个类别。这些类别为飞机（0）、汽车（1）、鸟（2）、猫（3）、鹿（4）、狗（5）、青蛙（6）、马（7）、船（8）和卡车（9）。例如，Figure\
  \ 8-6 显示了类别 7 图像的示例。\n\n![FIGURE 8-6: Each CIFAR-10 image contains 1,024 pixels\
  \ (32 x 32). Each pixel stores red, green, and blue components as 8-bit unsigned\
  \ integers.](img/9788126592555-fg0806.png)\n\nFIGURE 8-6: 每个 CIFAR-10 图像包含 1,024\
  \ 个像素（32 x 32）。每个像素将红、绿、蓝分量存储为 8 位无符号整数。\n\n`data` 键提供的 ndarray 包含 8 位无符号整数的 10,000\
  \ x 3,072 元素矩阵。该矩阵包含 10,000 行，每行包含一张 32 x 32 的图像，具有红、绿、蓝分量（32 x 32 x 3 = 3,072）。\n\
  \n###### 在代码中对 CIFAR 图像进行分类\n\n`ch8/cifar_cnn.py` 中的代码演示了如何使用 TensorFlow 加载 CIFAR-10\
  \ 图像并使用卷积神经网络对其进行分类。Listing 8-1 展示了该模块的代码。\n\nLISTING 8-1 对 CIFAR-10 图像进行分类\n\n\
  ```\n#### Set parameters\nimage_size = 32\nnum_channels = 3\nnum_categories = 10\n\
  num_filters = 32\nfilter_size = 5\nnum_epochs = 200\nbatch_size = 10\nnum_batches\
  \ = int(50000/batch_size)\nkeep_prob = 0.6\n\n#### Read CIFAR training data\ntrain_data\
  \ = None\ntrain_labels = None\nfor file_index in range(5):\n train_file = open('cifar-10-batches-py/data_batch_'\
  \ + str(file_index+1), 'rb')\n train_dict = pickle.load(train_file, encoding='latin1')\n\
  \ train_file.close()\n\n if train_data is None:\n train_data = np.array(train_dict['data'],\
  \ float)/255.0\n train_labels = train_dict['labels']\n else:\n train_data = np.concatenate((train_data,\
  \ train_dict['data']), 0)\n train_labels = np.concatenate((train_labels, train_dict['labels']),\
  \ 0)\n\n#### Preprocess training data and labels\ntrain_data = train_data.reshape([-1,\
  \ num_channels, image_size, image_size])\ntrain_data = train_data.transpose([0,\
  \ 2, 3, 1])\ntrain_labels = np.eye(num_categories)[train_labels]\n\n#### Read CIFAR\
  \ test data\ntest_file = open('cifar-10-batches-py/test_batch', 'rb')\ntest_dict\
  \ = pickle.load(test_file, encoding='latin1')\ntest_file.close()\ntest_data = test_dict['data']\n\
  test_labels = test_dict['labels']\n\n#### Preprocess test data and labels\ntest_data\
  \ = test_data.reshape([-1, num_channels, image_size, image_size])\ntest_data = test_data.transpose([0,\
  \ 2, 3, 1])\ntest_labels = np.eye(num_categories)[test_labels]\n\n#### Placeholders\
  \ for CIFAR images\nimg_holder = tf.placeholder(tf.float32, [None, image_size, image_size,\
  \ num_channels])\nlbl_holder = tf.placeholder(tf.float32, [None, num_categories])\n\
  train = tf.placeholder(tf.bool)\n\n#### Create convolution/pooling layers\nconv1\
  \ = tf.layers.conv2d(img_holder, num_filters, filter_size, padding='same', activation=tf.nn.relu)\n\
  drop1 = tf.layers.dropout(conv1, keep_prob, training=train)\npool1 = tf.layers.max_pooling2d(drop1,\
  \ 2, 2)\nconv2 = tf.layers.conv2d(pool1, num_filters, filter_size, padding='same',\
  \ activation=tf.nn.relu)\ndrop2 = tf.layers.dropout(conv2, keep_prob, training=train)\n\
  pool2 = tf.layers.max_pooling2d(drop2, 2, 2)\nconv3 = tf.layers.conv2d(pool2, num_filters,\
  \ filter_size, padding='same', activation=tf.nn.relu)\npool3 = tf.layers.max_pooling2d(conv3,\
  \ 2, 2)\nconv4 = tf.layers.conv2d(pool3, num_filters, filter_size, padding='same',\
  \ activation=tf.nn.relu)\ndrop3 = tf.layers.dropout(conv4, keep_prob, training=train)\n\
  \n#### Flatten input data\nflatten = tf.reshape(drop3, [-1, 512])\n\n#### Create\
  \ connected layers\nwith tf.contrib.framework.arg_scope(\n [tf.contrib.layers.fully_connected],\n\
  \ normalizer_fn=tf.contrib.layers.batch_norm,\n normalizer_params={'is_training':\
  \ train}):\n fc1 = tf.contrib.layers.fully_connected(flatten, 512)\n fc2 = tf.contrib.layers.fully_connected(fc1,\
  \ num_categories, activation_fn=None)\n\n#### Compute loss\nloss = tf.reduce_mean(\n\
  \ tf.nn.softmax_cross_entropy_with_logits(\n logits=fc2, labels=lbl_holder))\n\n\
  #### Create optimizer\nlearning_rate = 0.0005\noptimizer = tf.train.AdamOptimizer(learning_rate).minimize(loss)\n\
  #### Initialize variables\ninit = tf.global_variables_initializer()\n\n#### Launch\
  \ session\nwith tf.Session() as sess:\n sess.run(init)\n\n # Loop over epochs\n\
  \ for epoch in range(num_epochs):\n\n # Loop over batches\n for batch in range(num_batches):\n\
  \ batch_start = random.randint(0, batch_size*(num_batches-1)-1)\n batch_end = batch_start\
  \ + batch_size\n img_batch = train_data[batch_start:batch_end, :]\n lbl_batch =\
  \ train_labels[batch_start:batch_end, :]\n sess.run(optimizer, feed_dict={img_holder:\
  \ img_batch,\n lbl_holder: lbl_batch, train: True})\n\n # Determine success rate\n\
  \ prediction = tf.equal(tf.argmax(fc2, 1), tf.argmax(lbl_holder, 1))\n accuracy\
  \ = tf.reduce_mean(tf.cast(prediction, tf.float32))\n print('Accuracy: ', sess.run(accuracy,\
  \ feed_dict={img_holder: test_data,\n lbl_holder: test_labels, train: False}))\n\
  ```\n\n该应用程序假定用户已下载用于 Python 的 CIFAR-10 数据集。它还假定用户已将归档文件解压到 `ch8` 文件夹中名为 `cifar-10-batches-py`\
  \ 的目录中。\n\n该模块首先加载 CIFAR-10 训练图像和标签。然后执行四个操作：\n\n* 将训练图像连接成一个（50,000 x 3,072）ndarray。将训练标签连接成一个（50,000\
  \ x 1）ndarray。\n* 将图像 ndarray 的元素转换为浮点值。\n* 将图像 ndarray 重塑为 `[50,000, 32, 32, 3]`。最后一个元素标识每个像素的通道数（R、G\
  \ 和 B）。\n* 将标签 ndarray 转换为 one-shot ndarray（50,000 x 10）。\n\n\n\n\n\n这是一本关于 TensorFlow\
  \ 的书，所以应用程序使用 NumPy 而不是 TensorFlow 来预处理数据可能看起来很奇怪。但有一个重要的原因：会话在训练期间无法将张量馈送到占位符中。另一个原因是\
  \ TensorFlow 将张量操作存储在图中，但不存储 NumPy 操作。\n\n为了处理图像数据，应用程序创建了四个卷积层和三个池化层。每个卷积层使用 32\
  \ 个大小为 5 x 5 的滤波器，并且每个都使用 ReLU 作为其激活函数。池化层将它们的块大小设置为 2 x 2，步幅设置为 2。\n\n要理解代码，至关重要的是要理解输入张量的大小如何从一层到另一层发生变化。每个批次包含十张图像，因此每个输入张量的初始大小为\
  \ `[10, 32, 32, 3]`。\n\n* 第一个卷积层有 32 个滤波器，因此输出张量的形状为 `[10, 32, 32, 32]`。\n* 第一个池化层将每个图像维度缩小一半，因此输出张量的形状为\
  \ `[10, 16, 16, 32]`。\n* 第二个卷积层有 32 个滤波器，因此输出张量的形状为 `[10, 16, 16, 32]`。\n* 第二个池化层将每个图像维度缩小一半，因此输出张量的形状为\
  \ `[10, 8, 8, 32]`。\n* 第三个卷积层有 32 个滤波器，因此输出张量的形状为 `[10, 8, 8, 32]`。\n* 第三个池化层将每个图像维度缩小一半，因此输出张量的形状为\
  \ `[10, 4, 4, 32]`。\n* 第四个卷积层有 32 个滤波器，因此输出张量的形状为 `[10, 4, 4, 32]`。\n\n卷积完成后，该模块会展平图像数据并将其传递给两个全连接层。第一个全连接层有\
  \ 512 个节点，并使用 ReLU 作为其激活函数。第二个全连接层有十个节点。\n\n##### 执行图像操作\n\nTensorFlow 提供了许多执行通用图像处理的功能。为了介绍这些功能，我将它们分为五类：\n\
  \n* 图像转换\n* 颜色处理\n* 旋转和镜像\n* 调整大小和裁剪\n* 卷积\n\n以下各节介绍这些函数并演示其用法。示例应用程序展示了如何为图像生成摘要数据并使用\
  \ TensorBoard 可视化它。\n\n###### 转换图像\n\n`tf.image` 包提供了在不同文件格式、颜色配置文件和数据类型之间转换图像的函数。\
  \ Table 8-3 列出了这些函数并提供了每个函数的描述。\n\nTABLE 8-3 图像转换函数\n\n| **Function** || **Description**\
  \ |\n| --- | --- |\n| `decode_bmp(contents,``. channels=None, name=None)` || 将 BMP\
  \ 格式的图像数据转换为张量 |\n| --- | --- |\n| `decode_gif(contents,`` name=None)` || 将 GIF\
  \ 格式的图像数据转换为张量 |\n| `decode_png(contents,`` channels=None, dtype=None,`` name=None)`\
  \ || 将 PNG 格式的图像数据转换为张量 |\n| `decode_jpeg(contents,`` channels=None, ratio=None,``\
  \ fancy_upscaling=None,`` try_recover_truncated=None,`` acceptable_fraction=None,``\
  \ dct_method=None,`` name=None)` || 将 JPEG 格式的图像数据转换为张量 |\n| `decode_image(contents,``\
  \ channels=None, name=None)` || 检测图像数据的格式并将数据转换为张量 |\n| `encode_png(image,`` compression=None,``\
  \ name=None)` || 将包含图像数据的张量转换为 PNG 编码 |\n| `encode_jpeg(image,`` format=None,``\
  \ quality=None,`` progressive=None,`` optimize_size=None,`` chroma_downsampling=None,``\
  \ density_unit=None,`` x_density=None,`` y_density=None,`` xmp_metadata=None,``\
  \ name=None)` || 将包含图像数据的张量转换为 JPEG 编码 |\n| `rgb_to_grayscale(images,`` name=None)`\
  \ || 将一个或多个图像从 RGB 转换为灰度 |\n| `rgb_to_hsv(images,`` name=None)` || 将一个或多个图像从 RGB\
  \ 转换为 HSV |\n| `grayscale_to_rgb(images,`` name=None)` || 将一个或多个图像从灰度转换为 RGB |\n\
  | `hsv_to_rgb(images,`` name=None)` || 将一个或多个图像从 HSV 转换为 RGB |\n| `convert_image_dtype(image,``\
  \ dtype, saturate=False,`` name=None)` || 更改图像张量元素的 数据类型 |\n\n图像张量的形状取决于图像的性质。对于简单的\
  \ 2-D 图像，例如 JPEG 中的图像，张量的形状为 `[height, width, num_channels]`。对于帧序列，例如 GIF 动画中的图像，形状为\
  \ `[num_frames, height, width, num_channels]`。\n\n在 Table 8-3 中，`decode_*` 函数将零维字符串张量转换为合适的图像张量。例如，如果应用程序将数据从\
  \ `smiley.jpg` 加载到名为 `smiley_tensor` 的张量中，`decode_jpeg` 将返回一个解压缩的张量，其形状为 `[height,\
  \ width, num_channels]`。\n\nTensorFlow 应用程序可以读取 BMP、GIF、PNG 和 JPEG 图像，但只能将数据写入 PNG\
  \ 和 JPEG。这些写操作由 `encode_png` 和 `encode_jpeg` 实现。\n\n请记住，TensorFlow 的解码/编码函数不接受文件，而是读取和写入零维字符串张量。TensorFlow\
  \ 提供了多种从文件创建字符串张量的方法，其中一种方法涉及三个步骤：\n\n1. **使用文件名数组调用 `tf.string_input_producer`。**\n\
  2. **通过调用 `tf.WholeFileReader` 创建一个 `WholeFileReader`。**\n3. **使用步骤 1 中的队列调用读者的\
  \ `read` 方法。**\n\n为了演示此过程的工作原理，以下代码从 `smiley.png` 读取数据并将其写入 `smiley.jpg`：\n\n```\n\
  queue = tf.train.string_input_producer(['smiley.png'])\nreader = tf.WholeFileReader()\n\
  _, png_data = reader.read(queue)\nimg_tensor = tf.image.decode_png(png_data)\njpeg_data\
  \ = tf.image.encode_jpeg(img_tensor)\nwith tf.Session() as sess:\n tf.train.start_queue_runners()\n\
  \ jpeg_file = open('smiley.jpeg', 'wb+')\n jpeg_file.write(jpeg_data.eval())\n jpeg_file.close()\n\
  ```\n\nTable 8-3 中的最后一个函数 `convert_image_dtype` 将图像的像素从一种数据类型转换为另一种数据类型。这尤其重要，因为不同的图像处理操作需要不同的数据类型。例如，卷积需要包含浮点元素的张量，而\
  \ PNG 编码需要无符号整数。以下代码将 `img` 的元素转换为单精度浮点值：\n\n```\nimg = tf.image.convert_image_dtype(img,\
  \ tf.float32)\n```\n\n`convert_image_dtype` 假定所有整数值都是非负的，并且所有浮点值都在 0.0 和 1.0 之间。该函数在转换之外还执行缩放，因此它在将\
  \ `tf.float32` 转换为 `tf.uint8` 时将值乘以 256，并在将 `tf.uint8` 转换为 `tf.float32` 时将值除以 256。\n\
  \n###### 颜色处理\n\n`tf.image` 中的第二类函数会改变图像的颜色内容。 Table 8-4 列出了其中九个函数。\n\nTABLE 8-4\
  \ 颜色处理函数\n\n| **Function** || **Description** |\n| --- | --- |\n| `adjust_brightness(image,\
  \ delta)` || 将给定的 delta 添加到图像的像素值 |\n| --- | --- |\n| `adjust_contrast(images,``\
  \ contrast_factor)` || 按给定因子调整对比度 |\n| `adjust_gamma(image,`` gamma=1, gain=1)`\
  \ || 执行伽马校正 |\n| `adjust_hue(image, delta,`` name=None)` || 通过给定的 delta 更改图像的色调内容\
  \ |\n| `adjust_saturation(image,`` saturation_factor, name=None)` || 通过给定值更新图像的饱和度\
  \ |\n| `random_brightness(image,`` max_delta, seed=None)` || 向图像的像素值添加随机值 |\n\n\n\
  \n\n\n| `random_contrast(image, lower, upper, seed=None)` || 通过随机值调整对比度 |\n\n| `random_hue(image,\
  \ max_delta, seed=None)` || 通过随机量改变图像的色相内容 |\n\n| `random_saturation(image, lower,\
  \ upper, seed=None)` || 通过随机值更新图像的饱和度 |\n\n这些函数易于理解。`adjust_xyz` 函数通过特定量更新图像的属性。`random_xyz`\
  \ 函数通过随机量更新图像的属性。\n\n`adjust_contrast` 和 `random_contrast` 改变图像像素相对于均值的偏差。具体来说，如果一个像素的分量等于\
  \ *x* 且平均值为 `x_avg`，调用 `adjust_contrast` 并使用因子 *k* 会以以下方式更新 *x*：\n\n![images](img/eq08006.png)<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:mi>x</m:mi><m:mo>=</m:mo><m:mi>k</m:mrow><m:mrow><m:mo>(</m:mo><m:mrow><m:mi>x</m:mi><m:mo>&#45;</m:mo><m:msub><m:mi>x</m:mi><m:mrow><m:mi>a</m:mi><m:mi>v</m:mi><m:mi>g</m:mi></m:mrow></m:msub></m:mrow><m:mo>)</m:mo></m:mrow><m:mo>+</m:mo><m:msub><m:mi>x</m:mi><m:mrow><m:mi>a</m:mi><m:mi>v</m:mi><m:mi>g</m:mi></m:mrow></m:msub></m:mrow></m:math>\n\
  \n`random_xyz` 函数接受一个或两个随机值的边界。例如，以下代码将 `img` 的对比度随机改变为介于 0.1 和 0.2 之间的因子：\n\n```\
  \ \ntf.image.random_contrast(img, 0.1, 0.2)\n```\n\n`adjust_hue` 和 `random_hue`\
  \ 作用于 RGB 图像。两个函数都将图像的像素转换为浮点值，然后将图像转换为 HSV。然后它们对色相通道添加偏移量，并将图像转换回 RGB 和像素的原始数据类型。\n\
  \n###### 旋转和镜像\n\n`tf.image` 包还提供了旋转和镜像（翻转）图像像素的函数。表 8-5 列出了其中六个函数并提供了每个函数的描述。\n\
  \nTABLE 8-5 旋转和镜像函数\n\n| **Function** || **Description** |\n\n| --- | --- |\n\n\
  | `rot90(image, k=1, name=None)` || 按 90 度的倍数逆时针旋转图像 |\n\n| --- | --- |\n\n| `flip_left_right(image)`\
  \ || 水平镜像图像 |\n\n| `random_flip_left_right(image, seed=None)` || 一半时间水平镜像图像 |\n\n\
  | `flip_up_down(image)` || 垂直镜像图像 |\n\n| `random_flip_up_down(image, seed=None)`\
  \ || 一半时间垂直镜像图像 |\n\n| `transpose_image(image)` || 沿主对角线镜像图像 |\n\n`rot90` 按逆时针方向按\
  \ 90 度的倍数旋转图像。精确的旋转角度等于 `90(k mod 4)`，其中 *`k`* 是 `rot90` 的第二个参数。\n\n了解 `transpose_image`\
  \ 与垂直和水平翻转图像的函数之间的区别很重要。`transpose_image` 沿从左上到右下的对角线翻转图像。\n\n以下代码展示了应用程序如何解码 PNG\
  \ 数据，然后旋转、翻转和转置图像。\n\n```\nimg_tensor = tf.image.decode_png(smiley)\n\n#### Rotate\
  \ CCW by 270 degrees\nrot_tensor = tf.image.rot90(img_tensor, 3)\nrot_png = tf.image.encode_png(rot_tensor)\n\
  \n#### Flip horizontal\nflip_tensor = tf.image.flip_left_right(img_tensor)\nflip_png\
  \ = tf.image.encode_png(flip_tensor)\n\n#### Transpose\ntranspose_tensor = tf.image.transpose_image(img_tensor)\n\
  transpose_png = tf.image.encode_png(transpose_tensor)\n```\n\n图 8-7 说明了示例代码中执行的运算结果。\n\
  \n![FIGURE 8-7: TensorFlow's functions make it possible to rotate, flip, and transpose\
  \ images.](img/9788126592555-fg0807.png)\n\nFIGURE 8-7: TensorFlow 的函数使旋转、翻转和转置图像成为可能。\n\
  \n`random_flip_left_right` 和 `random_flip_up_down` 函数在你希望训练应用程序识别可能已被翻转的图像时很有帮助。这些函数有一半时间翻转其图像，一半时间保持其图像不变。\n\
  \n###### 调整大小和裁剪\n\n应用程序经常需要放大、缩小或裁剪图像的内容。表 8-6 列出了 `tf.image` 执行这些操作的函数。\n\nTABLE\
  \ 8-6 调整大小和裁剪函数\n\n| **Function** || **Description** |\n\n| --- | --- |\n\n| `resize_nearest_neighbor(images,\
  \ size, align_corners=False, name=None)` || 使用最近邻插值调整大小 |\n\n| --- | --- |\n\n|\
  \ `resize_bilinear(images, size align_corners=False, name=None)` || 使用双线性插值调整大小\
  \ |\n\n| `resize_bicubic(images, size align_corners=None, name=None)` || 使用双三次插值调整大小\
  \ |\n\n| `resize_area(images, size, align_corners=False, name=None)` || 使用区域插值调整大小\
  \ |\n\n| `resize_images(images, size, method=ResizeMethod.BILINEAR, align_corners=False)`\
  \ || 使用指定的插值方法调整大小 |\n\n| `central_crop(image, fraction)` || 裁剪输入图像的中心部分 |\n\n|\
  \ `resize_image_with_crop_or_pad( image, target_height, target_width)` || 裁剪或填充图像直到其尺寸等于给定的宽度和高度\
  \ |\n\n| `crop_and_resize(image, boxes, box_ind, crop_size, method=None, extrapolation_value=None,\
  \ name=None)` || 裁剪图像的一部分并将图像调整为给定的尺寸 |\n\n术语 *interpolation* 指在已知数据点范围内插入新数据点的过程。表\
  \ 8-6 中的前四个函数使用插值来调整其输入图像或图像的尺寸。它们各自使用不同的插值方法调整其图像。\n\n`resize_nearest_neighbor`\
  \ 函数使用 *最近邻插值* 调整其图像的尺寸。该函数通过确定哪个像素最接近它并分配该像素的颜色来计算内部点的颜色。如果你调用此函数来放大图像，结果将仅包含原始图像中的颜色。如果你将图像放大\
  \ *n* 倍，其颜色将被重复 *n* 次。\n\n`resize_bilinear` 函数使用 *双线性插值* 调整图像的尺寸。这通过找到其周围像素的线性组合来确定内部点的颜色。这提供了极佳的结果而无需显著的处理，因此它是\
  \ TensorFlow 和许多显卡采用的默认插值方法。\n\n要理解双线性插值，查看一维插值或线性插值会有所帮助。假设 P 是像素 A 和 B 之间线上的一个点。P\
  \ 到 A 中心的距离表示为 t，P 到 B 中心的距离为 1 - t。线性插值使用以下方程设置 P 的颜色：\n\n![images](img/eq08007.png)<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:msub><m:mi>P</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>=</m:mo><m:mi>t</m:mi><m:msub><m:mi>A</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>+</m:mo><m:mrow><m:mo>(</m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:mi>t</m:mi></m:mrow><m:mo>)</m:mo></m:mrow><m:msub><m:mi>B</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub></m:mrow></m:math>\n\
  \n\n\n\n\n当 `t` 等于 1 时，`P` 处的颜色等于 `A` 处的颜色。当 `t` 等于 0 时，`P` 处的颜色等于 `B` 处的颜色。如果 `t\
  \ = 0.5`，所得颜色将等于 `A` 和 `B` 颜色的平均值。插值值形成直线，Figure 8-8 描绘了用于在四个点之间插值的线条。\n\n![FIGURE\
  \ 8-8: Linear interpolation finds internal points by computing the linear combination\
  \ of existing points.](img/9788126592555-fg0808.png)\n\nFIGURE 8-8: 线性插值通过计算现有点的线性组合来找到内部点。\n\
  \n双线性插值与线性插值类似，但计算位于四个像素之间的二维点的值。例如，假设 `P` 被四个像素 `A`、`B`、`C` 和 `D` 包围。定位 `P` 需要两个插值参数，`t[1]`\
  \ 和 `t[2]`。Figure 8-9 描绘了一个点 `P`、其周围的四个像素以及两个插值参数。\n\n![FIGURE 8-9: Bilinear interpolation\
  \ uses two interpolation parameters to locate a point relative to its four surrounding\
  \ points.](img/9788126592555-fg0809.png)\n\nFIGURE 8-9: 双线性插值使用两个插值参数来定位点相对于其四个周围点的位置。\n\
  \n双线性插值通过按插值参数缩放周围像素的颜色来确定内部点的颜色。以下方程显示了双线性插值如何计算点 `P` 的颜色，该点由 `A`、`B`、`C` 和 `D`\
  \ 包围：\n\n![images](img/eq08008.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:msub><m:mi>P</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>=</m:mo><m:msub><m:mi>t</m:mi><m:mn>1</m:mn></m:msub><m:msub><m:mi>t</m:mi><m:mn>2</m:mn></m:msub><m:msub><m:mi>A</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>+</m:mo><m:mrow><m:mo>(</m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:msub><m:mi>t</m:mi><m:mn>1</m:mn></m:msub></m:mrow><m:mo>)</m:mo></m:mrow><m:msub><m:mi>t</m:mi><m:mn>2</m:mn></m:msub><m:msub><m:mi>B</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>+</m:mo><m:msub><m:mi>t</m:mi><m:mn>1</m:mn></m:msub><m:mrow><m:mo>(</m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:msub><m:mi>t</m:mi><m:mn>2</m:mn></m:msub></m:mrow><m:mo>)</m:mo></m:mrow><m:msub><m:mi>C</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub><m:mo>+</m:mo><m:mrow><m:mo>(</m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:msub><m:mi>t</m:mi><m:mn>1</m:mn></m:msub></m:mrow><m:mo>)</m:mo></m:mrow><m:mrow><m:mo>(</m:mo><m:mrow><m:mn>1</m:mn><m:mo>&#45;</m:mo><m:msub><m:mi>t</m:mi><m:mn>2</m:mn></m:msub></m:mrow><m:mo>)</m:mo></m:mrow><m:msub><m:mi>D</m:mi><m:mrow><m:mi>c</m:mi><m:mi>o</m:mi><m:mi>l</m:mi><m:mi>o</m:mi><m:mi>r</m:mi></m:mrow></m:msub></m:mrow></m:math>\n\
  \n`resize_bicubic` 使用双三次插值调整图像大小。双三次插值与双线性插值类似，但不是寻找四个周围像素的线性组合，而是通过涉及 16 个周围点的三次多项式来确定内部点的颜色。双三次插值产生的图像比双线性插值更平滑，但需要显著更多的处理。\n\
  \n`central_crop` 通过缩放原始图像的尺寸来确定裁剪图像的尺寸。例如，如果将 `fraction` 参数设置为 0.25，则裁剪宽度将等于原始宽度的四分之一，裁剪高度将等于原始高度的四分之一。\n\
  \n`resize_image_with_crop_or_pad` 调整图像大小而不使用插值。如果指定的尺寸小于图像，则函数将从图像中心裁剪图像，以便最终图像具有指定的尺寸。如果指定的尺寸大于图像，则函数将用零填充图像。\n\
  \n`crop_and_resize` 可以执行多次裁剪操作。`boxes` 的每一行标识要裁剪的图像的一部分，而 `box_ind` 的每个元素设置输出中裁剪图像的索引。该函数使用双线性插值将每个裁剪图像调整为\
  \ `crop_size`。\n\n###### Convolution\n\n除了创建卷积层之外，TensorFlow 应用程序还可以通过调用 `tf.nn.conv2d`\
  \ 执行简单的卷积：\n\n`tf.nn.conv2d(input, filter, strides, padding, use_cudnn_on_gpu=None,\
  \ data_format='NHWC', name=None)`\n\n`input` 的格式取决于 `data_format` 参数。也就是说，如果应用程序将\
  \ `data_format` 设置为 `NHWC`，则输入张量的形状应为 `[batch, height, width, channels]`。如果 `data_format`\
  \ 设置为 `NCHW`，则张量的形状应为 `[batch, channels, height, width]`。\n\n要执行卷积，应将 `filter` 分配给与\
  \ `input` 形状相同的张量。在执行 2-D 点积时，函数按 `strides` 张量给出的间隔移动滤波器。必须将 `strides` 设置为具有四个元素的\
  \ 1-D 张量。要在每个方向上将点积移动 1，请将 `strides` 设置为 `[1, 1, 1, 1]`。\n\n如果 2-D 点积涉及图像边界上或附近的像素，则计算将取决于\
  \ `padding` 参数。如果将 `padding` 设置为 `VALID`，卷积将不会计算涉及边界像素的点积。如果将 `padding` 设置为 `SAME`，函数将在执行卷积之前用零填充图像。\n\
  \n![tip](img/tip.png)函数 `tf.layers.conv2d` 和 `tf.nn.conv2d` 名称相似但用途明显不同。`tf.layers.conv2d`\
  \ 在 CNN 中创建卷积层，而 `tf.nn.conv2d` 执行单次卷积操作。务必不要将两者混淆。\n\n![technicalstuff](img/technicalstuff.png)除了\
  \ `conv2d` 之外，`tf.nn` 包还提供了一个名为 `conv2d_transpose` 的函数。该函数执行常规卷积，但返回结果图像的转置。\n\n\
  ##### Putting Theory into Practice\n\n`ch8/img_proc.py` 模块中的代码演示了应用程序如何通过使用元素等于\
  \ 1/9 的 3-x-3 滤波器进行卷积来去除图像噪声。除了卷积之外，该模块还执行四项操作：\n\n* 通过调用 `tf.image.adjust_contrast`\
  \ 改变图像的对比度\n* 通过调用 `tf.image.flip_left_right` 水平镜像图像\n* 将数据转换为 PNG 格式并将数据写入 PNG\
  \ 文件\n* 生成用于在 TensorBoard 中查看图像的摘要数据\n\n`ch8/img_proc.py` 模块从 `input_aircraft.png`\
  \ 读取数据并将结果写入 `output_aircraft.png`。Figure 8-10 描绘了输入图像和输出图像。\n\n![FIGURE 8-10: TensorFlow's\
  \ image processing routines make it straightforward to modify an image’s format,\
  \ orientation, and color content.](img/9788126592555-fg0810.png)\n\nFIGURE 8-10:\
  \ TensorFlow 的图像处理例程使修改图像的格式、方向和颜色内容变得简单。\n\nListing 8-2 介绍了使用 TensorFlow 实现模块操作的的代码。\n\
  \nLISTING 8-2 通用图像处理\n\n```\n#### Load and pre-process PNG data\nqueue = tf.train.string_input_producer(['input_aircraft.png'])\n\
  reader = tf.WholeFileReader()\n_, png_data = reader.read(queue)\norig_tensor = tf.image.decode_png(png_data)\n\
  img_tensor = tf.reshape(orig_tensor, [-1, 1, 232, 706])\nimg_tensor = tf.transpose(img_tensor,\
  \ [0, 2, 3, 1])\n```\n\n\n\n\n\n`img_tensor = tf.image.convert_image_dtype(img_tensor,\
  \ tf.float32)`\n\n#### 使用盒式滤波器去除噪声\n\n```\nconv_filter = np.zeros([3, 3, 1, 1])\n\
  conv_filter[0, 0, :, :] = 0.1111\nconv_filter[0, 1, :, :] = 0.1111\nconv_filter[0,\
  \ 2, :, :] = 0.1111\nconv_filter[1, 0, :, :] = 0.1111\nconv_filter[1, 1, :, :] =\
  \ 0.1111\nconv_filter[1, 2, :, :] = 0.1111\nconv_filter[2, 0, :, :] = 0.1111\nconv_filter[2,\
  \ 1, :, :] = 0.1111\nconv_filter[2, 2, :, :] = 0.1111\nimg_tensor = tf.nn.conv2d(img_tensor,\
  \ conv_filter, [1, 1, 1, 1], 'SAME')\n```\n\n#### 提高对比度\n\n```\nimg_tensor = tf.reshape(img_tensor,\
  \ [232, 706, 1])\nimg_tensor = tf.image.adjust_contrast(img_tensor, 0.8)\n```\n\n\
  #### 水平翻转\n\n```\nimg_tensor = tf.image.flip_left_right(img_tensor)\n```\n\n####\
  \ 创建摘要数据和 FileWriter\n\n```\nimg_tensor = tf.reshape(img_tensor, [1, 232, 706, 1])\n\
  img_tensor = tf.image.convert_image_dtype(img_tensor, tf.uint8)\nsummary_op = tf.summary.image('Output',\
  \ img_tensor)\nfile_writer = tf.summary.FileWriter('log')\n```\n\n#### 将结果存储为 PNG\n\
  \n```\nimg_tensor = tf.reshape(img_tensor, [232, 706, 1])\nimg_tensor = tf.image.encode_png(img_tensor)\n\
  with tf.Session() as sess:\n    coord = tf.train.Coordinator()\n    threads = tf.train.start_queue_runners(coord=coord)\n\
  \    \n    # Execute session\n    output_data, summary = sess.run([img_tensor, summary_op])\n\
  \    \n    # Write output PNG data to file\n    output_file = open('output_aircraft.png',\
  \ 'wb+')\n    output_file.write(output_data)\n    output_file.close()\n    \n  \
  \  # Print summary data\n    file_writer.add_summary(summary)\n    file_writer.flush()\n\
  \    \n    # Wait for threads to terminate\n    coord.request_stop()\n    coord.join(threads)\n\
  ```\n\n在查看这段代码时，跟踪图像的形状和数据类型非常重要。在应用程序解码输入图像后，tensor 的形状为 `[232, 706, 1]`，其元素为 8\
  \ 位无符号整数。但在执行卷积之前，应用程序会将 tensor 的形状转换为 `[1, 232, 706, 1]`，并将其元素转换为 32 位浮点值。\n\n\
  在更新图像对比度之前，应用程序会将图像 tensor 的形状转换回 `[232, 706, 1]`。之后，模块会将图像的形状转换为 `[1, 232, 706,\
  \ 1]`，并将其类型转换为 `tf.uint8`，以便模块可以生成摘要数据。最后，应用程序会将 tensor 的形状转换为 `[232, 706, 1]`，以便将其数据编码为\
  \ PNG 格式。\n\n为图像生成摘要数据的过程与为 tensor 生成数据的过程类似。唯一的区别是应用程序需要调用 `tf.summary.image` 而不是\
  \ `tf.summary.scalar` 或 `tf.summary.histogram`。该函数的签名如下所示：\n\n`tf.summary.image(name,\
  \ tensor, max_outputs=3, collections=None, family=None)`\n\n`name` 参数提供了 TensorFlow\
  \ 将与图像关联的标签。该函数通过 `tensor` 参数接受图像数据，且 tensor 的形状必须是 `[batch_size, height, width,\
  \ num_channels]`。\n\n例如，`ch8/img_proc.py` 模块使用以下代码创建了一个生成 `img_tensor` 摘要数据的操作：\n\
  \n`summary_op = tf.summary.image('Output', img_tensor)`\n\n创建此操作后，应用程序在会话中执行它，并使用\
  \ `FileWriter` 将协议缓冲区打印到事件文件。启动后，TensorBoard 将读取此事件文件并显示 `img_tensor` 的图形内容。\n\n\
  #### 第 9 章\n\n#### 使用循环神经网络（RNN）分析序列数据\n\n本章内容\n\n![check](img/check.png)**使用循环神经网络（RNN）分析序列数据**\n\
  \n![check](img/check.png)**使用长短期记忆（LSTM）提高性能**\n\n![check](img/check.png)**使用门控循环单元（GRU）进一步提高性能**\n\
  \n假设你希望一个神经网络预测短语 “My hovercraft is full of…..” 中的下一个词。正如任何 Monty Python 的粉丝（或随意进行网络搜索）会告诉你的那样，显而易见的答案是\
  \ “eels”。但如何训练神经网络得出这个答案呢？\n\n你可以将网络输入互联网上写过的每句话，但仍然存在一个问题。为了做出预测，神经网络需要识别出词语构成了一个\
  \ *有序序列*。也就是说，网络需要理解短语 “My hovercraft is full of” 与 “full is My of hovercraft” 是不同的短语。\n\
  \n本书 第 1 章 至 第 8 章 中讨论的神经网络都无法识别序列。因此，它们无法利用过去的分析来解决未来的问题。例如，CNN 可以对图像进行分类，但不能基于之前的分类对后续图像进行分类。为了弥补这些不足，机器学习研究人员发明了循环神经网络，或\
  \ RNN。\n\n##### 循环神经网络（RNN）\n\n大多数神经网络，例如卷积神经网络，将数据在一个方向上传输：从输入层到输出层。因此，它们被称为 *前馈*\
  \ 网络。与前馈网络不同，循环神经网络，或 RNN，利用了 *反馈*。也就是说，它们将数据从后面的节点发送回网络中的前面节点。\n\n图 9-1 描述了一个简单的\
  \ RNN。整体结构类似于常规网络，但输出节点的结果会被延迟并反馈回输出节点。这种反馈是区分 RNN 与其他神经网络的主要特征。\n\n![FIGURE 9-1:\
  \ A recursive neural network feeds past data back into one or more nodes.](img/9788126592555-fg0901.png)\n\
  \n图 9-1： 递归神经网络将过去的数据反馈回一个或多个节点。\n\nRNN 的另一个重要特征是它们以 *阶段* 执行。例如，如果 RNN 需要解析音频或文本中的词语，它将为每个词语执行一个阶段。随着每个阶段的进行，RNN\
  \ 会接收新的数据进行处理。重要的是要看到训练步骤和阶段之间的区别：一个训练步骤可能需要多个处理阶段。\n\n在 图 9-1 中，网络的阶段由 t 标识。这不是指时钟时间，如\
  \ 1.37 秒，而是指离散时间，从 0 开始，每进行一个新阶段就递增 1。因此，初始输入值表示为 xi，下一组输入表示为 xi，以此类推。\n\nRNN 通过访问延迟值来利用之前的处理阶段。在\
  \ 图 9-1 中，延迟值由 Delay 元素提供。如果当前阶段为 4，则离开 Delay 元素的值将为 y(3)。如果当前阶段为 5，则离开该元素的值将为 y(4)。\n\
  \n正如网络的值随阶段而变化，其相关权重也会变化。例如，如果 图 9-1 中的 RNN 有 N 个阶段，应用程序需要为 y(0) 到 y(N-1) 计算不同的权重集合。如果\
  \ RNN 有许多延迟值，计算每个值的权重可能会显著增加训练所需的时间。\n\n###### RNN 与递归函数\n\n为了更好地理解 RNN 的工作原理，了解它们与递归函数的关系会有所帮助。例如，以下函数使用递归计算\
  \ N 的阶乘：\n\n```\ndef factorial(N):\n    if n == 1:\n        return 1\n    else:\n\
  \        return N * factorial(N-1)\n```\n\n此函数反复调用自身，并在每次调用时提供新的输入值。递归函数可以用循环重写，如以下函数所示：\n\
  \n```\ndef factorial(N):\n    x = 1\n    for i in range(2, N+1):\n        x *= i\n\
  \    return x\n```\n\n\n\n\n\n一个冗长的递归函数需要大量的内存，因为需要将所有数据压入栈中。为了防止溢出，Python 将默认最大递归限制设置为\
  \ 1000。\n\n同样，RNN 的处理需求会随着每个新阶段的增加而增加。正如 Python 设置了最大递归限制一样，每个 RNN 都有一个固定的可处理阶段数。\n\
  \n将递归函数转换为基于循环的函数的过程称为 *展开*。为了更好地可视化 RNN，你可以通过为每个待处理的阶段插入节点来展开它。例如，假设 Figure 9-1\
  \ 中的 RNN 有三个阶段。展开后 RNN 的样子如图 Figure 9-2 所示（为清晰起见已移除权重）。\n\n![FIGURE 9-2: Unrolling\
  \ an RNN makes it easy to visualize its operation.](img/9788126592555-fg0902.png)\n\
  \nFIGURE 9-2: Unrolling an RNN makes it easy to visualize its operation.\n\n如 Figure\
  \ 9-2 所示，`y(2)` 依赖于当前输入（`xi` 的加权和）以及前一阶段的输出。开发者将过去阶段的组合结果称为节点的 *状态*。\n\n简单来说，RNN\
  \ 与普通神经网络的区别在于 RNN 的一个或多个节点具有状态。如果节点具有状态，它就可以将前一阶段的结果应用于当前阶段。这种使用过去结果的能力解释了为什么 RNN\
  \ 在处理语言和其他序列数据时如此受欢迎。\n\n###### Training RNNs\n\n如本章前面 Figure 9-2 所示，展开 RNN 会得到一个前馈网络，该网络在不同阶段接收输入（`xi`、`xi`\
  \ 等）。这种行为意味着 RNN 可以像普通前馈网络一样进行训练。一种流行的训练方法称为时间反向传播（backpropagation through time，BPTT），它将反向传播方法应用于\
  \ RNN。Chapter 7 讨论了反向传播的基本理论。\n\n随着你设计具有更多处理阶段的 RNN，节点数量会急剧增长。因此，RNN 遭受着困扰所有复杂神经网络的两个问题：梯度消失和梯度爆炸。Chapter\
  \ 7 解释了这些问题以及它们如何降低神经网络的性能。\n\n为了弥补 BPTT 的不足，研究人员设计了替代训练方法。截断时间反向传播（Truncated backpropagation\
  \ through time，TBPTT）使用有限数量的阶段进行训练。实时递归学习（Real-time recurrent learning，RTRL）不展开\
  \ RNN，而是使用网络输出和状态相对于其权重的偏导数进行训练。\n\n与其专注于新的训练方法，一些研究人员发明了 RNN 的全新变体。这些变体提供了 RNN\
  \ 的所有优点，但不易受梯度消失和梯度爆炸的影响。最流行的变体是长短期记忆（long short-term memory，LSTM）单元和门控循环单元（gated\
  \ recurrent units，GRUs）。本章讨论这两种变体并演示如何使用它们。\n\n##### Creating RNN Cells\n\n正如普通神经网络由节点组成一样，RNN\
  \ 由 *单元* 组成。在大多数 RNN 文献中，单元是 RNN 的一部分，它接收输入并产生单个输出值。\n\nTensorFlow RNN 的单元没那么简单。根据文档，TensorFlow\
  \ RNN 的“单元是任何具有状态并执行某种操作的实体，该操作接受输入矩阵。此操作产生输出矩阵……”。换句话说，RNN 单元具有状态，对输入矩阵进行操作，并产生输出矩阵。\n\
  \n在 TensorFlow 应用中，构建 RNN 的过程从创建单元开始。具体来说，该过程包括三个步骤：\n\n1. **使用每个单元的单元数创建 RNN 单元类的实例。**\n\
  \n   每个单元类都是 `tf.nn.rnn_cell.RNNCell` 的子类。\n\n2. **调用一个函数，例如 `tf.nn.static_rnn`，该函数基于单元创建\
  \ RNN。**\n\n   此函数接受输入张量的列表并返回 RNN 的输出和状态。\n\n3. **使用步骤 2 的输出计算损失。**\n\n   通过在会话中启动优化器来最小化损失。\n\
  \n`RNNCell` 类在本次讨论中起着核心作用。它不能在代码中实例化，但很重要，因为它是 TensorFlow RNN 单元类的基类，其中包括 `BasicRNNCell`、`BasicLSTMCell`、`LSTMCell`\
  \ 和 `GRUCell`。Figure 9-3 展示了继承自 `RNNCell` 的七个 TensorFlow 类。\n\n![FIGURE 9-3: Each\
  \ subclass of RNNCell represents a different kind of RNN cell.](img/9788126592555-fg0903.png)\n\
  \nFIGURE 9-3: Each subclass of RNNCell represents a different kind of RNN cell.\n\
  \n`RNNCell` 类定义了可通过其实例访问的属性和方法。Table 9-1 列出了 `RNNCell` 的八个属性。\n\nTABLE 9-1 Properties\
  \ of the RNNCell Class\n\n| **Property** || **Description** |\n\n| --- | --- |\n\
  \n| `state_size` || The shape(s) of the cell's state(s) |\n\n| --- | --- |\n\n|\
  \ `output_size` || The shape of the cell’s output |\n\n| `graph` || Graph of operations\
  \ contained in the cell |\n\n| `losses` || Losses to be applied to the cell's processing\
  \ |\n\n| `update` || Tensors used to update the cell’s weights |\n\n| `variables`\
  \ || List of the cell's variables |\n\n| `weights` || List of the cell’s weights\
  \ |\n\n| `scope_name` || Name of the scope containing the variables |\n\n`RNNCell`\
  \ 的状态可以用一个或多个张量表示。因此，应用程序可以将 `state_size` 分配为整数、`TensorShape`、整数元组或 `TensorShape`\
  \ 元组。应用程序必须将 `output_size` 分配为整数或 `TensorShape`。\n\nTable 9-1 中其余属性很直接。`losses`\
  \ 属性标识一个张量或张量列表/元组，标识单元在其处理期间应应用的损失。表中最后三个属性提供了对单元变量和变量作用域的访问。\n\n除了属性外，`RNNCell`\
  \ 类还定义了一组方法，其中大多数自定义单元的行为。Table 9-2 列出了四个特别有用的方法并提供了每个方法的描述。\n\nTABLE 9-2 Methods\
  \ of the RNNCell Class\n\n| **Method** || **Description** |\n\n| --- | --- |\n\n\
  | `add_loss(losses, inputs=None)` || Add loss tensors |\n\n| --- | --- |\n\n| `add_update(updates,\
  \ inputs=None)` || Add updates to the cell's weights |\n\n| `add_variable(name,\
  \ shape, dtype=None,`` initializer=None, regularizer=None,`` trainable=true)` ||\
  \ Adds a new variable to the layer |\n\n| `zero_state(batch_size, dtype)` || Returns\
  \ a zero-filled tensor for initializing the cell's state |\n\n在列出的方法中，`zero_state`\
  \ 特别受欢迎。它创建一个零填充的张量或零填充张量的列表，适用于初始化 RNN 的状态。返回值形状取决于方法 `batch_size` 参数和单元的 `state_size`\
  \ 属性。\n\n###### Creating a basic RNN\n\n`RNNCell` 的最简单子类是 `BasicRNNCell`。其构造函数如下所示：\n\
  \n```\nBasicRNNCell(num_units, activation=tf.nn.tanh, reuse=None)\n```\n\n\n\n\n\
  \n`num_units` 参数设置单元中隐藏单元的数量。该参数决定了 RNN 的学习能力。也就是说，随着单元数量的增加，单元的状态存储大小也会增加。不幸的是，训练时间也会增加。此外，如果将\
  \ `num_units` 设置得过高，就有过拟合的风险。\n\n构造函数的第二个参数设置单元的激活函数。默认情况下，RNN 单元依赖于反正切（`tanh`）来产生其输出。\n\
  \n最后一个参数 `reuse` 指定应用程序是否可以访问单元创建的同名变量。\n\n创建单元实例后，应用程序可以通过调用 `tf.nn` 包中的少数几个函数来构建\
  \ RNN。其中最简单的一个函数是 `static_rnn`：\n\n```\nstatic_rnn(cell, inputs, initial_state=None,\
  \ dtype=None, sequence_length=None, scope=None)\n```\n\n应用程序必须将 `inputs` 指定为输入矩阵的列表。对于列表中的每个输入矩阵，该函数都会创建一个单元来接收和处理该矩阵。输入矩阵中的行数等于应用程序的批大小。在此讨论中，我将该数字称为\
  \ `batch_size`。\n\n默认情况下，`static_rnn` 假定 RNN 的序列长度等于输入矩阵中的列数。应用程序可以通过将 `sequence_length`\
  \ 设置为 `batch_size` 个值的一维张量来自定义此长度。`sequence_length` 的每个值都设置输入矩阵对应行的序列长度。\n\n其名称所示，`initial_state`\
  \ 参数初始化 RNN 的状态。应用程序必须为输入矩阵的每一行提供一个状态值，因此如果单元的 `state_size` 为整数，则应用程序必须将 `initial_state`\
  \ 设置为形状为 [`batch_size`, `state_size`] 的矩阵。如果 `state_size` 为元组，则应用程序必须将 `initial_state`\
  \ 设置为形状为 [`batch_size`, `element_size`] 的张量元组，其中 `element_size` 是 `state_size` 中对应元素的大小。\n\
  \n如果应用程序设置了 `initial_state` 参数，`static_rnn` 将使用状态的元素来确定 RNN 元素的 数据类型。如果应用程序未设置 `initial_state`，则必须使用\
  \ `dtype` 参数指定数据类型。TensorFlow 不为 RNN 的内容设置默认数据类型。\n\n`static_rnn` 返回一个包含两个元素的元组：RNN\
  \ 的输出和最终状态。输出包含 `batch_size` 个元素，最终状态的形状由单元的 `state_size` 决定。\n\n单元数量、状态、输入和输出之间的关系可能令人困惑，因此查看一个基本示例会有帮助。以下代码使用五个单元创建了一个\
  \ `BasicRNNCell`：\n\n```\nnew_cell = tf.nn.rnn_cell.BasicRNNCell(5)\n```\n\n由于 RNN\
  \ 单元有五个单元，单元输出矩阵中的每一行长度都为五。\n\n对于此示例，每个输入矩阵有两行，每行有四个元素。如果应用程序需要提供三个输入矩阵，则可以使用以下代码设置\
  \ RNN 的输入：\n\n```\ninputs = [tf.constant([[1.,2.,3.,4.], [1.,2.,3.,4.]]), tf.constant([[1.,2.,3.,4.],\
  \ [1.,2.,3.,4.]]), tf.constant([[1.,2.,3.,4.], [1.,2.,3.,4.]])]\n```\n\n创建 `new_cell`\
  \ 后，应用程序可以使用以下代码创建新的 RNN 并传递输入矩阵列表。`dtype` 参数指定 RNN 的状态和输出应由浮点值组成：\n\n```\noutput,\
  \ state = tf.nn.static_rnn(new_cell, inputs, dtype=tf.float32)\n```\n\n由于 `inputs`\
  \ 包含三个输入矩阵，新 RNN 的结构包含三个单元。每个单元产生的输出矩阵的行数与输入矩阵相同。Figure 9-4 给出了简单 RNN 的大致外观。\n\n\
  ![FIGURE 9-4: TensorFlow creates one RNN cell for each input matrix. Each cell produces\
  \ one output matrix.](img/9788126592555-fg0904.png)\n\nFIGURE 9-4: TensorFlow creates\
  \ one RNN cell for each input matrix. Each cell produces one output matrix.\n\n\
  在 Figure 9-4 中，`xi` 标识在 `inputs` 参数中提供的输入矩阵，而 `yi` 标识 `static_rnn` 返回的输出矩阵。初始状态进入第一个单元，该单元将其状态传递给第二个单元，第二个单元将其状态传递给第三个单元，第三个单元在\
  \ `static_rnn` 中返回其状态。\n\n`output` 和 `state` 的精确值并不重要，但查看它们的形状是有帮助的。每个 RNN 都产生一个输出矩阵列表，其大小由输入矩阵列表的大小决定。因此，`output`\
  \ 是一个包含三个矩阵的列表。由于每个输入批次包含两行，每个输出矩阵都有两行。每行有五个值，因为单元有五个单元。\n\n单元状态的形状由批大小和单元中的单元数量决定。在此示例单元中，状态的形状为\
  \ `[2, 5]`，因为批大小为二，单元包含五个单元。\n\n###### 使用 RNN 预测文本\n\n因为我是国宝级的，所以我将 H.P. Lovecraft\
  \ 短篇小说 *Herbert West–Reanimator* 的一部分提取到 `ch9/lovecraft.txt` 文件中。`ch9/rnn_lovecraft.py`\
  \ 模块读取此文本并使用 RNN 来预测 H.P. Lovecraft 如何为短语添加单词。我相信我们可以都同意该应用程序对人类文化发展至关重要，而 Listing\
  \ 9-1 展示了代码。\n\nLISTING 9-1 Predicting Text with an RNN\n\n```\n#### Split text\
  \ into words\npython3 = sys.version_info[0] == 3\nwith open('lovecraft.txt', 'r')\
  \ as f:\n input_str = f.read().lower()\n if python3:\n  trans = input_str.maketrans('',\
  \ '', string.punctuation)\n  input_str = input_str.translate(trans)\n else:\n  input_str\
  \ = input_str.decode('utf-8').translate(None, string.punctuation)\n words = input_str.split()\n\
  \ num_words = len(words)\n\n#### Convert words to values\nword_freq = collections.Counter(words).most_common()\n\
  vocab_size = len(word_freq)\nlookup = dict()\nfor word, _ in word_freq:\n lookup[word]\
  \ = len(lookup)\ninput_vals = np.asarray([[lookup[str(word)]] for word in words])\n\
  input_vals = input_vals.reshape(-1,)\n\n#### Set values\ninput_size = 6\nbatch_size\
  \ = 10\nnum_hidden = 600\n\n#### Placeholders\ninput_holder = tf.placeholder(tf.float32,\
  \ [batch_size, input_size])\nlabel_holder = tf.placeholder(tf.float32, [batch_size,\
  \ vocab_size])\n\n#### Reshape input and feed to RNN\ncell = tf.nn.rnn_cell.BasicRNNCell(num_hidden)\n\
  outputs, _ = tf.nn.static_rnn(cell, [input_holder], dtype=tf.float32)\n\n#### Compute\
  \ loss\nweights = tf.Variable(tf.random_normal([num_hidden, vocab_size]))\nbiases\
  \ = tf.Variable(tf.random_normal([vocab_size]))\nmodel = tf.matmul(outputs[-1],\
  \ weights) + biases\nloss = tf.reduce_mean(tf.nn.softmax_cross_entropy_with_logits(logits=model,\
  \ labels=label_holder))\n\n#### Create optimizer and check result\noptimizer = tf.train.AdagradOptimizer(0.1).minimize(loss)\n\
  check = tf.equal(tf.argmax(model, 1), tf.argmax(label_holder, 1))\ncorrect = tf.reduce_sum(tf.cast(check,\
  \ tf.float32))\n\n#### Execute the graph\nstart_time = time.time()\nwith tf.Session()\
  \ as sess:\n sess.run(tf.global_variables_initializer())\n input_block = np.empty([batch_size,\
  \ input_size])\n label_block = np.empty([batch_size, vocab_size])\n\n step = 0\n\
  \ num_correct = 0.\n accuracy = 0.\n while accuracy < 95.:\n  for i in range(batch_size):\n\
  \   offset = np.random.randint(num_words-(input_size+1))\n   input_block[i, :] =\
  \ input_vals[offset:offset+input_size]\n   label_block[i, :] = np.eye(vocab_size)[input_vals[offset+input_size]]\n\
  \  _, corr = sess.run([optimizer, correct],\n```\n\n\n\n\n\n```\nfeed_dict={input_holder:\
  \ input_block, label_holder: label_block})\nnum_correct += corr\naccuracy = 100*num_correct/(1000*batch_size)\n\
  if step % 1000 == 0:\n    print('Step', step, '- Accuracy =', accuracy)\nnum_correct\
  \ = 0\nstep += 1\n```\n\n#### 显示耗时结果\n\n`duration = time.time() - start_time`\n\n\
  `print('Time to reach 95% accuracy: {:.2f} seconds'.format(duration))`\n\n开始时，该模块将\
  \ `lovecraft.txt` 的内容读入一个字符串，将字符串拆分为单词，并为每个单词关联一个数字。单词的数字由其频率决定。也就是说，该模块将最常见的单词关联为\
  \ 0，将第二常见的单词关联为 1，以此类推。\n\n在获得与单词对应的数字数组后，该模块创建了一个具有 600 个隐藏层的 RNN 单元。它使用该 RNN 单元调用\
  \ `tf.nn.static_rnn`，以提供 RNN 的输出值。为了确定损失，该模块将 RNN 的输出乘以权重矩阵并向乘积添加偏置。然后它创建一个 `AdagradOptimizer`\
  \ 来最小化损失。\n\n对于每次训练运行，应用程序构造一个包含十个（`batch_size`）序列的批次，每个序列包含六个（`input_size`）值。因此，RNN\
  \ 只能识别最多六个连续单词之间的依赖关系。对于每个六值序列，期望的标签是第七个值，它代表要预测的期望单词。\n\n该应用程序不执行固定次数的训练运行。相反，它会一直训练，直到预测准确率超过\
  \ 95%。每进行一千次训练运行，应用程序就会打印预测准确率。\n\n###### 创建多层单元\n\n应用程序可以通过将单元按顺序堆叠在一起提高 RNN 的分析能力。这种堆叠过程将一个单元的输出连接到另一个单元的输入。TensorFlow\
  \ 应用程序可以通过创建 `tf.contrib.rnn.MultiRNNCell` 类的实例来堆叠 RNN 单元，其构造函数如下所示：\n\n`MultiRNNCell(cells,\
  \ state_is_tuple=True)`\n\n要创建 `MultiRNNCell`，应用程序需要将第一个参数设置为 `RNNCell` 实例的列表。返回的单元将按顺序包含所列实例。\n\
  \n第二个参数设置单元状态的形式。如果将 `state_is_tuple` 设置为 `True`，单元将以元组形式提供其状态，该元组包含每个组合单元的一个元素。如果将此参数设置为\
  \ `False`，单元将连接各个单元的状态。\n\n例如，以下代码创建了两个 `BasicRNNCell`，然后创建了一个将单元堆叠在一起的 `MultiRNNCell`：\n\
  \n```\nbrc1 = tf.nn.rnn_cell.BasicRNNCell(3)\nbrc2 = tf.nn.rnn_cell.BasicRNNCell(3)\n\
  multi_cell = tf.nn.rnn_cell.MultiRNNCell([brc1, brc2])\n```\n\n因此，`multi_cell` 将\
  \ `brc1` 和 `brc2` 堆叠在一起，将 `brc1` 的输出连接到 `brc2` 的输入。\n\n###### 创建动态 RNN\n\n`static_rnn`\
  \ 函数假定您事先知道输入数据的长度。它要求输入数据以矩阵列表的形式提供，其中每个矩阵的大小为 [`batch_size`, `input_size`]。当应用程序调用\
  \ `static_rnn` 时，TensorFlow 会在当前图中创建整个 RNN 结构。\n\n`dynamic_rnn` 函数在提供输入数据时为您提供更大的灵活性。它告诉\
  \ TensorFlow 动态形成图结构，而不是提前构建它。`dynamic_rnn` 的签名如下所示：\n\n`dynamic_rnn(cell, inputs,\
  \ sequence_length=None, initial_state=None, dtype=None, parallel_iterations=None,\
  \ swap_memory=False, time_major=False, scope=None)`\n\n这些参数中的大多数与 `static_rnn` 相同。主要区别在于应用程序可以将\
  \ `inputs` 设置为不同的形状。此形状取决于批大小、最大序列长度以及函数的 `time_major` 参数。`time_major` 的默认值是 `False`，这意味着应用程序必须将输入分配给大小为\
  \ [`batch_size`, `max_sequence`, …] 的张量或嵌套元组。如果应用程序将 `time_major` 设置为 `True`，则必须将输入分配给大小为\
  \ [`max_sequence`, `batch_size`, …] 的张量或嵌套元组。\n\nTensorFlow 可以并行执行没有时间依赖性的操作。`parallel_iterations`\
  \ 参数控制应同时执行多少个此类操作，默认值是 32。\n\n如果应用程序将 `swap_memory` 设置为 `True`，TensorFlow 将在训练过程中在\
  \ GPU 和 CPU 之间交换张量，从而产生轻微的性能损失。第 11 章 解释了如何在 GPU 上执行 TensorFlow 操作。\n\n与 `static_rnn`\
  \ 一样，`dynamic_rnn` 返回构建的 RNN 的输出和状态。以下代码演示了如何使用 `dynamic_rnn`：\n\n```\nexample_cell\
  \ = tf.nn.rnn_cell.BasicRNNCell(4)\noutput, state = tf.nn.dynamic_rnn(example_cell,\n\
  example_input, dtype=tf.float32)\n```\n\n在我的实验中，`dynamic_rnn` 的性能略优于 `static_rnn`。\n\
  \n##### 长短期记忆 LSTM 单元\n\n随着 RNN 处理更多阶段，其展开网络变得更大，并且更容易受到梯度消失的影响。由于 RNN 有固定数量的阶段，因此它们无法分析具有长期依赖关系的序列。也就是说，如果\
  \ RNN 最多可以处理 N 个阶段，它就不会识别元素 0 和元素 N+1 之间的任何依赖关系。\n\n为了弥补这些不足，Sepp Hochreiter 和 Jürgen\
  \ Schmidhuber 在 1997 年的论文 *Long Short-Term Memory* 中提出了对 RNN 结构的修改。从本质上讲，他们建议通过限制\
  \ RNN 接受数据的时机来减小 RNN 状态的大小。具体来说，LSTM 使用三种类型的限制：\n\n*   限制 RNN 接受输入数据的时机\n*   限制存储在\
  \ RNN 状态中的元素\n*   限制 RNN 产生输出数据的时机\n\nHochreiter 和 Schmidhuber 将他们的新型单元称为 *long\
  \ short-term memory (LSTM) cell*，通常简称为 *LSTM*。由于其限制，LSTM 仅处理和存储其预测所需的数据。\n\nLSTM\
  \ 的一个主要优势是规模。为了处理数据序列，LSTM 所需的节点比可比的 RNN 更少。此外，由于 LSTM 可以阻止存储无关数据，因此其状态可以检查具有长期依赖关系的序列。\n\
  \n为了实现这些限制，Hochreiter 和 Schmidhuber 在 RNN 单元结构中添加了三个门：输入门、遗忘门和输出门。图 9-5 展示了这些门如何控制\
  \ LSTM 单元的连接性。\n\n![FIGURE 9-5: An LSTM reduces the size of an RNN by preventing\
  \ unnecessary data from cluttering the RNN’s state.](img/9788126592555-fg0905.png)\n\
  \nFIGURE 9-5: An LSTM reduces the size of an RNN by preventing unnecessary data\
  \ from cluttering the RNN’s state.\n\n每个门都维护自己的权重和偏置，以确定何时打开和关闭。准确地说，这三个门通过将信号乘以\
  \ sigmoid 函数的结果（![images](img/eq09001.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mi>&#963;</m:mi></m:math>）来工作。对于输入门和输出门，该函数决定允许通过多少信号。对于遗忘门，该函数决定数据是否应存储在单元的状态中（1）或丢弃（0）。\n\
  \n将输入门的状态表示为 i[t]，遗忘门的状态表示为 f[t]，输出门的状态表示为 o[t]，以下方程显示了这些门的工作原理：\n\n\n\n\n\n![images](img/eq09002.png)<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mtable columnalign=\"left\"\
  ><m:mtr><m:mtd><m:msub><m:mi>i</m:mi><m:mi>t</m:mi></m:msub><m:mo>=</m:mo><m:mi>&#963;</m:mi><m:mrow><m:mo>\\\
  [</m:mo><m:mrow><m:msub><m:mi>w</m:mi><m:mi>i</m:mi></m:msub><m:mrow><m:mo>(</m:mo><m:mrow><m:msub><m:mi>x</m:mi><m:mi>i</m:mi></m:msub><m:mo>,</m:mo><m:msub><m:mi>h</m:mi><m:mrow><m:mi>i</m:mi><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:msub></m:mrow><m:mo>)</m:mo></m:mrow><m:mo>+</m:mo><m:msub><m:mi>b</m:mi><m:mi>i</m:mi></m:msub></m:mrow><m:mo>\\\
  ]</m:mo></m:mrow></m:mtd></m:mtr><m:mtr><m:mtd><m:msub><m:mi>f</m:mi><m:mi>t</m:mi></m:msub><m:mo>=</m:mo><m:mi>&#963;</m:mi><m:mrow><m:mo>\\\
  [</m:mo><m:mrow><m:msub><m:mi>w</m:mi><m:mi>f</m:mi></m:msub><m:mrow><m:mo>(</m:mo><m:mrow><m:msub><m:mi>x</m:mi><m:mi>i</m:mi></m:msub><m:mo>,</m:mo><m:msub><m:mi>h</m:mi><m:mrow><m:mi>i</m:mi><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:msub></m:mrow><m:mo>)</m:mo></m:mrow><m:mo>+</m:mo><m:msub><m:mi>b</m:mi><m:mi>f</m:mi></m:msub></m:mrow><m:mo>\\\
  ]</m:mo></m:mrow></m:mtd></m:mtr><m:mtr><m:mtd><m:msub><m:mi>o</m:mi><m:mi>t</m:mi></m:msub><m:mo>=</m:mo><m:mi>&#963;</m:mi><m:mrow><m:mo>\\\
  [</m:mo><m:mrow><m:msub><m:mi>w</m:mi><m:mi>o</m:mi></m:msub><m:mrow><m:mo>(</m:mo><m:mrow><m:msub><m:mi>x</m:mi><m:mi>i</m:mi></m:msub><m:mo>,</m:mo><m:msub><m:mi>h</m:mi><m:mrow><m:mi>i</m:mi><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:msub></m:mrow><m:mo>)</m:mo></m:mrow><m:mo>+</m:mo><m:msub><m:mi>b</m:mi><m:mi>o</m:mi></m:msub></m:mrow><m:mo>\\\
  ]</m:mo></m:mrow></m:mtd></m:mtr></m:mtable></m:math>\n\n请记住，在门内部，底层单元的行为类似于 RNN\
  \ 单元。也就是说，它依赖于 `tanh` 函数（默认情况下）作为其激活函数。\n\n###### 在代码中创建 LSTM\n\n在 TensorFlow 中，创建\
  \ LSTM 的过程与创建普通 RNN 相似：创建单元类的实例并基于该单元形成 RNN。第二步需要使用前面章节 “创建 RNN 单元” 中讨论的相同的 `static_rnn`\
  \ 和 `dynamic_rnn` 函数。\n\n`tf.nn.rnn_cell` 包提供了一些代表 LSTM 单元的类，基本类是 `BasicLSTMCell`\
  \ 和 `LSTMCell`。前者使用起来更简单，但后者提供更多自定义选项。\n\n####### 设置状态\n\n在普通 RNN 中，你可以用大小为 [`batch_size`,\
  \ `state_size`] 的矩阵设置初始状态。但要初始化 LSTM 网络的状态，你需要提供一个包含两个状态矩阵的元组：一个标识单元状态，一个标识隐藏状态。\n\
  \n为了简化初始化，`tf.nn.rnn_cell` 模块提供了一个名为 `LSTMStateTuple` 的类，其构造函数接受两个状态矩阵。用 `batch_sz`\
  \ 表示批大小，用 `state_sz` 表示状态大小，以下代码创建了一个适用于初始化 LSTM 网络状态的 `LSTMStateTuple`：\n\n```\n\
  cstate = tf.placeholder(tf.float32, [batch_sz, state_sz])\nhstate = tf.placeholder(tf.float32,\
  \ [batch_sz, state_sz])\ninit = tf.nn.rnn_cell.LSTMStateTuple(cstate, hstate)\n\
  ```\n\n创建 `LSTMStateTuple` 后，应用程序可以将它赋给 `static_rnn` 和 `dynamic_rnn` 等函数中的 `initial_state`\
  \ 参数。\n\n####### BasicLSTMCell 类\n\n从开发者的角度来看，`BasicLSTMCell` 类几乎与 `BasicRNNCell`\
  \ 相同。像 `BasicRNNCell` 构造函数一样，`BasicLSTMCell` 构造函数接受应为每个单元生成的单元数。完整的构造函数如下所示：\n\n\
  ```\nBasicLSTMCell(num_units, forget_bias=1.0, state_is_tuple=True, activation=tf.nn.tanh,\
  \ reuse=None)\n```\n\n`forget_bias` 参数为遗忘门的输入添加初始偏置。此附加偏置可防止单元在训练开始时忘记信息。\n\n创建\
  \ `BasicLSTMCell` 后，你可以通过调用 `static_rnn` 或 `dynamic_rnn` 基于 LSTM 单元创建 RNN。例如，以下代码从一个具有七个单元的单元创建\
  \ LSTM 网络：\n\n```\nlstm_cell = BasicLSTMCell(7)\noutput, state = tf.nn.dynamic_rnn(lstm_cell,\n\
  lstm_input, dtype=tf.float32)\n```\n\n默认情况下，LSTM 的状态包含元组中的两个矩阵。因此，`static_rnn` 和\
  \ `dynamic_rnn` 返回的状态是包含两个矩阵的元组。\n\n####### LSTMCell 类\n\nLSTM 会丢弃无关数据，因此它们无法衡量输入事件之间的时间间隔。为增加此能力，Felix\
  \ Gers 和 Jürgen Schmidhuber 在 2000 年的论文 *Recurrent Nets that Time and Count* 中提出了对\
  \ LSTM 结构的改进。\n\n此修改涉及在单元的状态与其门之间添加特殊的 *窥视孔连接*。这些连接使门能够在控制信息流时考虑状态数据。\n\n你可以通过创建\
  \ `LSTMCell` 而不是 `BasicLSTMCell` 来启用窥视孔连接。`LSTMCell` 构造函数如下所示\n\n```\nLSTMCell(num_units,\
  \ use_peepholes=False, cell_clip=None, initializer=None, num_proj=None, proj_clip=None,\
  \ num_unit_shards=None, num_proj_shards=None, forget_bias=1.0, state_is_tuple=True,\
  \ activation=None, reuse=None)\n```\n\n`cell_clip` 参数使防止梯度爆炸成为可能。如果将此参数赋值为浮点值，函数将把单元激活函数的输出限制为该值。\n\
  \n为了降低输入数据的维度，你可以乘以一个称为 *投影矩阵* 的矩阵。`num_proj` 参数标识投影输出所需的维度。如果将 `num_proj` 设置为大于\
  \ 0 的值，则可以将 `proj_clip` 设置为限制投影结果到范围 [`–proj_clip`, `proj_clip`] 的浮点值。\n\n######\
  \ 使用 LSTM 进行文本预测\n\n`ch9/lstm_lovecraft.py` 模块中的代码执行与 `ch9/rnn_lovecraft.py` 模块中代码相同的文本预测。唯一的区别是它基于\
  \ `BasicLSTMCell` 而不是 `BasicRNNCell` 创建 RNN。它使用以下代码创建 RNN：\n\n```\ncell = tf.nn.rnn_cell.BasicLSTMCell(num_hidden)\n\
  outputs, _ = tf.nn.static_rnn(cell, [input_holder], dtype=tf.float32)\n```\n\n`ch9/lstm_lovecraft.py`\
  \ 中其余的代码与 `ch9/rnn_lovecraft.py` 中的代码相同。应用程序从 `lovecraft.txt` 读取文本并将六元素序列的批次输入 RNN。它将\
  \ RNN 的输出乘以权重矩阵，对乘积添加偏置，并使用 `AdagradOptimizer` 最小化损失。\n\n正如预期的那样，我的实验支持 LSTM 比普通\
  \ RNN 更高效地处理序列的结论。在我的系统上，RNN 需要平均 35.54 秒才能达到 95% 的准确率，而 LSTM 需要平均 33.48 秒。\n\n\
  ##### 门控循环单元 GRU\n\n2014 年，Kyunghyun Cho、Bart van Merrienboer、Dzmitry Bahdanau 和\
  \ Yoshua Bengio 发表了一篇题为 *On the Properties of Neural Machine Translation: Encoder-Decoder\
  \ Approaches* 的论文。在该论文中，他们提出了一种用于检查变长序列的新型 RNN 变体，称为门控递归卷积网络。如今，开发者将其网络结构称为门控循环单元，或\
  \ GRU。\n\n与 LSTM 一样，GRU 使用门来控制数据流向和流出单元。但这两个单元有三个重要区别：\n\n*   GRU 单元具有隐藏状态 (`h[t]`)，但没有单元状态\
  \ (`C[t]`)。\n*   GRU 单元具有重置门而不是输入门，以及更新门而不是遗忘门。\n*   GRU 单元没有输出门机制。\n\n\n\n\n\n\
  主要区别在于 GRU 有两个门，称为重置门和更新门，而 LSTM 有三个门。GRU 的重置门对应于 LSTM 的输入门，而 GRU 的更新门对应于 LSTM 的遗忘门。GRU\
  \ 不使用门来限制单元的输出。图 9-6 描述了 GRU 单元及其门。\n\n![FIGURE 9-6: GRUs are similar to LSTMs,\
  \ but they have two gates instead of three.](img/9788126592555-fg0906.png)\n\nFIGURE\
  \ 9-6: GRUs are similar to LSTMs, but they have two gates instead of three.\n\n\
  GRU 缺少输出门乍看似乎是表面上的差异，但更简单的结构意味着应用程序可以显著比 LSTM 更快地训练 GRU。\n\n###### 在代码中创建 GRU\n\n\
  基于 GRU 单元创建 RNN 的过程与创建常规 RNN 非常相似。不同之处在于应用程序需要将 RNN 的单元设置为 `tf.nn.rnn_cell.GRUCell`\
  \ 类的实例。该类的构造函数如下所示：\n\n`GRUCell(num_units, activation=None, reuse=None, kernel_initializer=None,\
  \ bias_initializer=None)`\n\n第三个参数名为 `kernel_initializer`；它与 第 8 章 中讨论的图像过滤核无关。`kernel_initializer`\
  \ 设置单元的初始权重，而 `bias_initializer` 设置其偏置。\n\n###### 使用 GRU 预测文本\n\n`ch9/gru_lovecraft.py`\
  \ 中的代码执行与 `ch9/rnn_lovecraft.py` 和 `ch9/lstm_lovecraft.py` 中的代码相同的文本预测。唯一的区别是它使用\
  \ `GRUCell` 创建了一个 RNN，如以下代码所示：\n\n`cell = tf.nn.rnn_cell.GRUCell(num_hidden)`\n\n\
  `outputs, _ = tf.nn.static_rnn(cell, [input_holder], dtype=tf.float32)`\n\n我的实验表明，与\
  \ LSTM 和 vanilla RNN 相比，GRU 在训练方面效率高得多。在我的系统上，GRU 平均需要 29.17 秒达到 95% 的准确率，而 LSTM\
  \ 平均需要 33.48 秒，RNN 平均需要 35.54 秒达到 95% 的准确率。\n\nPart 3\n\n#### 简化并加速 TensorFlow\n\
  \nIN THIS PART …\n\n通过将数据加载到数据集并使用迭代器提取数据来简化您的应用程序。\n\n探索 TensorFlow 的高级 Estimator\
  \ API 以及可用于机器学习的预构建估计器。\n\n通过在多个线程和设备上部署执行来加速您的机器学习。\n\n利用 Google Machine Learning\
  \ Engine 的非凡能力，实现高性能 TensorFlow 执行。\n\n#### Chapter 10\n\n#### 使用数据集和迭代器访问数据\n\n\
  IN THIS CHAPTER\n\n![check](img/check.png)**创建和操作数据集**\n\n![check](img/check.png)**加载和存储\
  \ TFRecord 数据**\n\n![check](img/check.png)**探索四种类型的迭代器**\n\n当你刚开始机器学习时，你最渴望的是你的应用程序收敛到一个解决方案。但随着你在该领域的进步，你越来越关注性能。当训练数据占用数\
  \ GB 或数 TB 内存时，性能尤其重要。\n\n本章和接下来的两章重点介绍提高 TensorFlow 性能的方法——不再有冗长的方程或几何图示。相反，我专注于可用于加速应用程序的功能。两个重要的功能是数据集和迭代器，它们使加载和处理输入数据变得更容易。\n\
  \n##### 数据集\n\n提高应用程序性能的有效方法之一是创建线程。现代处理器具有多个核心，开发人员可以通过将应用程序的工作负载拆分为线程来利用它们。这种多线程在应用程序需要加载大量数据时特别有帮助。\n\
  \n过去，TensorFlow 开发人员通过构造 `QueueRunner` 类的实例来创建线程。但从 1.4 版本开始，TensorFlow 建议使用 `Dataset`\
  \ 而不是 `QueueRunner`。`Dataset` 不仅仅是一个庞大的数据块——它为加载和处理数据提供了一个高性能管道。\n\n通常在 TensorFlow\
  \ 应用程序中，使用数据集的过程包括三个步骤：\n\n1.  **从数据或文件创建数据集。**\n2.  **将数据集拆分为批次并根据需要预处理批次。**\n\
  3.  **在会话中处理数据集的批次。**\n\n你可以通过调用 `Dataset` 类的方法来执行前两个步骤。下面的讨论探讨了这些方法并展示了如何使用它们。\n\
  \n###### 创建数据集\n\n实际上，数据集是训练/测试数据的容器，其元素是应用程序用于向会话提供数据的批次。第 5 章 详细解释了批处理的主题。\n\n\
  你可以从数据、文本文件或二进制文件创建数据集。以下各节介绍这些方法并解释如何在代码中执行它们。\n\n####### 从数据创建数据集\n\n你可以通过调用 表\
  \ 10-1 中列出的五个 `Dataset` 方法之一来从数据创建数据集。所有这些方法都是静态的，因此你需要通过 `tf.data.Dataset` 类调用它们。\n\
  \nTABLE 10-1 Functions That Create Datasets\n\n| **Member** || **Description** |\n\
  \n| --- | --- |\n\n| `range(*args)` || Creates a dataset containing a range of values\
  \ |\n\n| --- | --- |\n\n| `from_tensors(tensors)` || Creates a dataset that combines\
  \ the input tensors into one element |\n\n| `from_tensor_slices(tensors)` || Creates\
  \ a dataset containing one element for each row of the input tensors |\n\n| `from_sparse_tensor_slices(sparse_tensor)`\
  \ || Creates a dataset containing one element for each row of the sparse tensor\
  \ |\n\n| `from_generator(generator, output_types, output_shapes=None)` || Creates\
  \ a dataset from the given generator |\n\n这些方法中最简单的是 `range`，它返回一个包含构成步长分隔值范围的值的数据集。你可以用一个、两个或三个参数调用此方法：\n\
  \n*   `range(a)`: 生成从 0 到 `a` 的范围，不包括 `a`\n*   `range(a, b)`: 生成从 `a` 到 `b` 的范围，不包括\
  \ `b`\n*   `range(a, b, c)`: 生成从 `a` 到 `b` 的范围，不包括 `b`，步长为 `c`\n\n以下代码演示了如何在代码中使用\
  \ `range`：\n\n`ds1 = tf.data.Dataset.range(5) # [1, 2, 3, 4]`\n\n`ds2 = tf.data.Dataset.range(10,\
  \ 13) # [10, 11, 12]`\n\n`ds3 = tf.data.Dataset.range(2, 8, 2) # [2, 4, 6]`\n\n\
  `from_tensors` 和 `from_tensor_slices` 特别有用，因此重要的是不要将它们混淆。`from_tensors` 将输入张量组合在一起并返回一个元素的数据集。以下代码演示了如何使用\
  \ `from_tensors`：\n\n`t = tf.constant([[1, 2], [3, 4]])`\n\n`ds = tf.data.Dataset.from_tensors(t)\
  \ # [[1, 2], [3, 4]]`\n\n相比之下，`from_tensor_slices` 为参数的每一行创建一个单独的元素。以下代码演示了如何使用\
  \ `from_tensor_slices`：\n\n`t = tf.constant([[1, 2], [3, 4]])`\n\n`ds = tf.data.Dataset.from_tensor_slices(t)`\n\
  \n`# [1, 2], [3, 4]`\n\n此代码从输入张量的每一行创建一个元素。因此，`ds` 包含两个元素，每个元素包含两个值。`from_sparse_tensor_slices`\
  \ 与 `from_tensor_slices` 类似，但它返回一个包含稀疏张量每一行一个元素的数据集。\n\n`from_generator` 方法让你可以从生成器函数产生的值创建数据集。在\
  \ Python 中，*生成器函数* 是产生（或 *yield*）一系列值的函数。使用生成器的过程包括以下步骤：\n\n1.  **在生成器函数中，使用 `yield`\
  \ 语句提供一个值。**\n2.  **通过调用函数获得生成器对象。**\n\n\n\n\n\n根据你的 Python 版本，继续执行步骤 3 或步骤 4。\n\
  \n####### 3. 在 Python 2.*x* 中，调用对象的 `next` 方法来调用生成器函数。\n\n####### 4. 在 Python 3.*x*\
  \ 中，使用生成器对象调用内置的 `next` 函数。\n\n例如，以下生成器返回提供最多四个整数：\n\n```\ndef simple_gen():\n i\
  \ = 0\n while i < 4:\n yield(i)\n i += 1\n```\n\n以下代码获取一个生成器对象并调用 `next` 来访问生成器的前三个值：\n\
  \n```\nsimple_iter = simple_gen()\nnext(simple_iter)\nnext(simple_iter)\nnext(simple_iter)\n\
  ```\n\n`from_generator` 方法创建一个数据集，其中包含生成器产生的值的每个值的元素。应用程序必须将该方法的 `generator` 参数设置为生成器函数，并将\
  \ `output_types` 参数设置为标识生成器值类型（类型）的结构。\n\n例如，以下代码从 `simple_gen` 生成器创建数据集：\n\n```\n\
  dset = tf.data.Dataset.from_generator(simple_gen, output_types=tf.int32)\n```\n\n\
  `simple_gen` 返回的生成器对象产生四个值。因此，`from_generator` 返回一个包含四个元素的数据集：每个生成的整数一个。\n\n#######\
  \ 从文本创建数据集\n\n你可以通过创建 `TextLineDataset` 的实例来创建包含文本文件行的数据集，它是 `Dataset` 的子类。类构造函数为\n\
  \n```\nTextLineDataset(filenames, compression_type=None, buffer_size=None)\n```\n\
  \n要调用此构造函数，你需要将 `filenames` 分配给包含一个或多个文件名的张量。默认情况下，构造函数假定文件包含未压缩的文本。但如果你将 `compression_type`\
  \ 设置为 `ZLIB` 或 `GZIP`，构造函数将在访问其数据之前解压缩归档。\n\n`TextLineDataset` 将为输入文件的每一行包含一个字符串元素。例如，如果\
  \ `test1.txt` 有三行而 `test2.txt` 有四行，则以下代码创建包含七个字符串的数据集：\n\n```\nds = TextLineDataset(['test1.txt',\
  \ 'test2.txt'])\n```\n\n在你将字符串读入数据集后，你可以使用 `Iterator` 循环遍历它们。我在章节后面的 “迭代器” 部分解释了\
  \ `Iterator` 是什么。\n\n####### 从二进制文件创建数据集\n\n除了文本文件之外，TensorFlow 还支持从包含 TFRecords\
  \ 的二进制文件创建数据集。TFRecords 在你需要访问大量数据时非常有用，但它们令人困惑且文档不完善。将 TFRecord 数据存储到文件中的整体过程包括三个步骤：\n\
  \n1. **创建一个 `tf.train.Example` 来保存你想要存储的数据。**\n2. **通过调用其 `SerializeToString` 方法将\
  \ `tf.train.Example` 存储为协议缓冲区。**\n3. **创建一个 `tf.python_io.TFRecordWriter` 并使用它将协议缓冲区写入\
  \ TFRecord 文件。**\n\n像数据集一样，`Example` 存储训练和测试数据。与数据集不同，它们以称为 *features* 的键值对存储其数据。每个特征由\
  \ `tf.train.Feature` 表示，你可以通过调用其构造函数并传入包含一个或多个 `Feature` 的 `tf.train.Features` 对象来创建一个\
  \ `Example`。使用这些类可能会令人困惑，所以我尽力澄清：\n\n* 在 `tf.train.Example` 构造函数中，`features` 参数接受一个\
  \ `tf.train.Features` 实例。\n* 在 `tf.train.Features` 构造函数中，`feature` 参数接受一个将名称与 `tf.train.Feature`\
  \ 实例关联的字典。\n* 在 `tf.train.Feature` 构造函数中，`bytes_list` 参数接受一个 `tf.train.BytesList`，`float_list`\
  \ 参数接受一个 `tf.train.FloatList`，而 `int64_list` 参数接受一个 `tf.train.Int64List`。\n\n以下代码创建由三个特征组成的\
  \ `Example`：\n\n```\nfeat_a = tf.train.Feature(bytes_list = tf.train.BytesList(value=[\
  \ b'123' ]));\nfeat_b = tf.train.Feature(float_list = tf.train.FloatList(value=[\
  \ 1.0, 2.0, 3.0 ]));\nfeat_c = tf.train.Feature(int64_list = tf.train.Int64List(value=[\
  \ 2, 3, 4 ]));\ncontainer = tf.train.Features(feature={'a' : feat_a, 'b' : feat_b,\
  \ 'c' : feat_c})\nexample = tf.train.Example(features=container)\n```\n\n`BytesList`、`FloatList`\
  \ 和 `Int64List` 类的构造函数都有一个名为 `value` 的参数。你可以通过将 `value` 分配给适当数据类型的一个数组来设置特征的数据。\n\
  \n在你创建了 `Example` 之后，你可以调用其 `SerializeToString` 方法将其数据存储到协议缓冲区。然后你可以通过访问 `TFRecordWriter`\
  \ 将缓冲区写入 TFRecord 文件。关于此类有三点需要注意：\n\n* 其构造函数接受保存 TFRecord 格式数据的文件的名称和一个可选的压缩方法。\n\
  * 其 `write` 方法接受一个协议缓冲区并将其数据写入构造函数中给出的文件。\n* 当你不再需要写入器时，可以调用其 `close` 方法来关闭文件。\n\
  \n例如，如果你的 `Example` 的名称为 `example`，则以下代码将其数据写入 `example.tfrecord` 文件：\n\n```\nwriter\
  \ = tf.python_io.TFRecordWriter('example.tfrecord')\nwriter.write(example.SerializeToString())\n\
  writer.close()\n```\n\n在你写入一个或多个 TFRecord 文件后，你可以通过执行三个操作将它们的数据加载到数据集中：\n\n1. **创建一个\
  \ `TFRecordDataset`，其中包含 TFRecord 文件中的协议缓冲区。**\n2. **对于每条记录，将其特征解析为将特征名称关联到张量的字典。**\n\
  3. **将张组合并为数据集。**\n\n`TFRecordDataset` 构造函数从一个或多个 TFRecord 文件创建数据集。此构造函数的参数与 `TextLineDataset`\
  \ 的相同：\n\n```\nTFRecordDataset(filenames, compression_type=None, buffer_size=None)\n\
  ```\n\n调用构造函数后，数据集将以每个元素保存一个协议缓冲区。在你访问此数据之前，需要将这些元素中的每一个转换为张量。TensorFlow 通过提供两个函数使其成为可能：\n\
  \n* `parseSingleExample(serialized, features, name=None, example_names=None)`: 将\
  \ `Example` 转换为将特征键匹配到张量的字典\n* `parseExample(serialized, features, name=None, example_names=None)`:\
  \ 将一个或多个 `Example` 转换为将特征键匹配到张量的字典\n\n对于这两个函数，`serialized` 参数接受包含 `Example` 数据的协议缓冲区或缓冲区。`features`\
  \ 参数接受一个将特征名称匹配到 `FixedLenFeature` 或 `VarLenFeature` 实例的字典。实例化的类取决于所需的输出张量。\n\n\
  如果你想将特征的数据加载到密集张量中，你应该将特征的名称与 `FixedLenFeature` 关联。你可以通过调用 `tf.FixedLenFeature`\
  \ 来创建一个新的 `FixedLenFeature`：\n\n```\ntf.FixedLenFeature(shape, dtype, default_value=None)\n\
  ```\n\n`shape` 参数设置输出张量的形状，而 `dtype` 设置张量的数据类型。为了演示这些参数的使用，以下代码从 `example.tfrecord`\
  \ 创建一个 `TFRecordDataset`。然后数据集的 `map` 方法调用一个函数，该函数接收数据集的每个元素。此函数调用 `parseSingleExample`\
  \ 来从名为 `feat` 的特征创建具有五个元素的张量：\n\n```\ndef parse_func(buff):\n features = {'feat':\
  \ tf.FixedLenFeature(shape=[5], dtype=tf.float32)}\n tensor_dict = tf.parse_single_example(buff,\
  \ features)\n return tensor_dict['feat']\n\ndataset = tf.data.TFRecordDataset('example.tfrecord')\n\
  dataset = dataset.map(parse_func)\n```\n\n\n\n\n我将在 “Transforming Datasets” 小节中稍后讨论\
  \ `map` 方法。目前，重要的是要知道 `map` 用包含 `parse_func` 返回值的新 `Dataset` 替换 `dataset`。在此代码中，`parse_func`\
  \ 返回一个包含名为 `feat` 的特征值的张量。\n\n如果一个特征包含大量零，你可以通过将特征的名称与 `VarLenFeature` 关联来将其加载为稀疏向量。你可以通过调用\
  \ `tf.VarLenFeature` 来创建一个新的 `VarLenFeature`：\n\n```\ntf.VarLenFeature(dtype)\n\
  ```\n\n我希望很清楚 TFRecords API 不必要地复杂。我衷心希望 TensorFlow 的未来版本能解决这个问题并简化 TFRecords 的使用。\n\
  \n###### Processing datasets\n\n创建数据集后，你可以通过调用 `Dataset` 类的众多方法来操作其元素。为了介绍这些方法，我将它们分为四类：\n\
  \n* Working with batches\n* Simple operations\n* Transformations\n* Creating `Iterator`s\n\
  \n以下小节介绍前三类中的方法。我将在本章稍后 “Iterators” 小节中探讨 `Iterator`s 的主题。\n\n####### Working with\
  \ batches\n\n如 Chapter 5 中所述，应用程序经常将数据集划分为批次。`Dataset` 类使处理批次变得容易，Table 10-2 列出了执行批处理相关操作的两个方法。\n\
  \nTABLE 10-2 Batch Operations\n\n| **Member** || **Description** |\n| --- | ---\
  \ |\n| `batch(batch_size)` || 将数据集的内容拆分为批次 |\n| --- | --- |\n| `padded_batch(batch_size,\
  \ padded_shapes, padding_values=None)` || 将数据集的内容拆分为批次并使用填充确保每个批次具有期望的形状 |\n\n`batch`\
  \ 将数据集的值划分为大小为 `batch_size` 的批次。以下代码将数据集划分为两个每个包含三个元素的批次。\n\n```\nvals = tf.constant([1,\
  \ 2, 3, 4, 5, 6], dtype=tf.int64)\nds1 = tf.data.Dataset.from_tensor_slices(vals)\n\
  ds2 = ds1.batch(3) # contains [1, 2, 3], [4, 5, 6]\n```\n\n`padded_batch` 方法将数据集的每个元素（批次）填充到\
  \ `padded_shapes` 参数指定的形状。然后方法将元素组合成一个大的元素。\n\n```\nvals = tf.constant([[1., 2.],\
  \ [3., 4.]])\nds1 = tf.data.Dataset.from_tensor_slices(vals)\nds2 = ds1.padded_batch(2,\
  \ padded_shapes=[3] padding_values=1.)\n#### ds2 contains [[1., 2., 1.], [3., 4.,\
  \ 1.]]\n```\n\n此代码为每个批次创建两个元素并将每个批次填充到大小为三。`padded_batch` 将插入的值设为 1.0，因为该方法的 `padding_values`\
  \ 参数。\n\n####### Simple operations\n\n将数据集划分为批次后，你可以通过调用 `Dataset` 类的方法来操作批次。Table\
  \ 10-3 列出了执行简单操作的九个方法。\n\nTABLE 10-3 Simple Dataset Operations\n\n| **Member** ||\
  \ **Description** |\n| --- | --- |\n| `take(count)` || 返回包含前 count 个元素的数据集 |\n|\
  \ --- | --- |\n| `skip(count)` || 返回跳过前 count 个元素的数据集 |\n| `concatenate(dataset)`\
  \ || 将给定数据集追加到数据集 |\n| `repeat(count=None)` || 重复数据集 count 次 |\n| `shuffle(buffer_size,\
  \ seed=None)` || 随机化数据集元素的一个子集的顺序 |\n| `shard(num_shards, index)` || 返回包含数据集元素的一个子集的数据集\
  \ |\n| `list_files(file_pattern)` || 返回包含匹配指定模式的文件名的数据集 |\n| `cache(filename='')`\
  \ || 缓存数据集的元素 |\n| `prefetch(buffer_size)` || 预取数据集中的给定数量的元素 |\n\n前两种方法 `take` 和\
  \ `skip` 是最简单的。它们返回包含其他数据集的部分的数据集。\n\n```\nds1 = tf.data.Dataset.range(1, 8) # [1\
  \ 2 3 4 5 6 7]\nds2 = ds1.take(3) # [1 2 3]\nds3 = ds1.skip(3) # [4 5 6 7]\n```\n\
  \n`concatenate` 方法将一个数据集追加到另一个数据集。`repeat` 将数据集追加到自身。\n\n```\nds1 = tf.data.Dataset.range(1,\
  \ 3) # [1 2]\nds2 = tf.data.Dataset.range(7, 10) # [7 8 9]\nds3 = ds1.concatenate(ds2)\
  \ # [1 2 7 8 9]\nds4 = ds1.repeat(2) # [1 2 1 2]\n```\n\n`shuffle` 通过提取并重新排序现有数据集的元素来创建数据集。`batch_size`\
  \ 参数标识应提取多少个元素。\n\n```\nds1 = tf.data.Dataset.range(1, 8) # [1 2 3 4 5 6 7]\nds2\
  \ = ds1.shuffle(4) # [2 3 6 4]\n```\n\n`shard` 返回包含原始数据集中 1/`num_shards` 元素的数据集。`index`\
  \ 参数指定要返回的子数据集的索引。为了演示这一点，以下代码创建一个包含八个元素（0…7）的数据集并调用 `shard` 以返回大小为四分之一的数据集。\n\n\
  ```\ndset = tf.data.Dataset.range(8)\ndset_shard = dset.shard(4, 2)\n```\n\n作为此代码的结果，`dset_shard`\
  \ 将包含两个元素而不是八个。元素是 \\[2, 6\\]，因为子数据集包含原始数据集中每四个值中的第三个值（`index` = 2）。`list_files`\
  \ 方法从开发者系统上的文件名创建数据集。例如，如果工作目录包含 `a.png` 和 `b.png`，以下代码创建仅包含其名称的数据集：\n\n```\nds1\
  \ = tf.data.Dataset.list_files('./*.png') # ['a.png', 'b.png']\n```\n\n`cache` 方法缓存数据集的元素，以便你可以快速检索它们。在缓存数据集后，你可以通过调用\
  \ `prefetch` 启动操作来检索其元素。此方法接受一个参数来标识要恢复的最大元素数。\n\n####### Transforming datasets\n\
  \nTable 10-4 列出了用于操作数据集的五种高级例程。这些方法使得能够对数据集的元素执行复杂的转换。\n\nTABLE 10-4 Dataset Transformations\n\
  \n| **Member** || **Description** |\n| --- | --- |\n| `filter(predicate)` || 根据谓词过滤数据集\
  \ |\n| --- | --- |\n| `map(map_func, num_threads=None, output_buffer_size=None)`\
  \ || 对数据集的元素应用函数并为每个元素提供新元素 |\n| `flat_map(map_func)` || 对数据集的元素应用函数，为每个元素生成一个数据集，并连接结果\
  \ |\n| `interleave(map_func,``cycle_length, lock_length=1)` || 对数据集的元素应用函数，为每个元素生成一个数据集，并交错结果\
  \ |\n| `zip(datasets)` || 按元素交错数据集 |\n\n`filter`、`flat_map` 和 `map` 的第一个参数是一个接收数据集每个元素的函数。如果你可以用一行代码定义函数，你可以将此参数设为\
  \ *lambda*。lambda 定义由 `lambda` 关键字、一个或多个参数、冒号和返回值组成。例如，以下 lambda 接受两个值并返回它们的和：\n\
  \n```\nlambda x, y: x + y\n```\n\n在 `filter` 方法中，函数返回一个布尔值来确定应保留在数据集中的元素。在以下代码中，数据集仅保留其和超过\
  \ 10.0 的元素：\n\n```\nvals = tf.constant([[2., 3.], [4., 5.], [6., 7.]])\nds1 = tf.data.Dataset.from_tensor_slices(vals)\n\
  ds1 = ds1.filter(lambda x: tf.reduce_sum(x) > 10.0)\n#### ds1 contains [6.0, 7.0]\n\
  ```\n\n\n\n\n\n在 `map` 方法中，函数接收输入数据集的每个元素并生成一个要插入到输出数据集中的元素。在下面的代码中，lambda 将输入数据集的每个元素乘以\
  \ 2 并将结果元素插入到输出数据集中。\n\n```\nvals = tf.constant([[2., 3.], [4., 5.], [6., 7.]])\n\
  ds1 = tf.data.Dataset.from_tensor_slices(vals)\nds2 = ds1.map(lambda x: x*2)\n####\
  \ ds2 contains [[4., 6.], [8., 10.], [12., 14.]]\n```\n\n`flat_map` 与 `map` 类似，但函数返回的不是输出数据集的一个元素，而是整个数据集。`flat_map`\
  \ 将输出数据集连接在一起并返回展平后的结果。\n\n```\nvals = tf.constant([2, 3], dtype=tf.int64)\nds1\
  \ = tf.data.Dataset.from_tensor_slices(vals)\nds2 = ds1.flat_map(lambda x: tf.data.Dataset.range(x))\n\
  #### ds2 contains [0, 1, 0, 1, 2]\n```\n\n与 `flat_map` 一样，`interleave` 中的函数为输入数据集的每个元素返回一个数据集。与\
  \ `flat_map` 不同，它不一定会连接结果数据集。`cycle_length` 参数标识应交错多少个元素。\n\n例如，如果将 `cycle_length`\
  \ 设置为 2，则输出数据集将包含前两个数据集的第一个元素，然后是前两个数据集的下一个两个元素，以此类推。下面的代码展示了 `interleave` 的工作原理。\n\
  \n```\nvals = tf.constant([2, 3, 4], dtype=tf.int64)\nds1 = tf.data.Dataset.from_tensor_slices(vals)\n\
  ds2 = ds1.interleave(lambda x: tf.data.Dataset.range(x), cycle_length=3)\n#### ds2\
  \ contains [0, 0, 0, 1, 1, 1, 2, 2, 3]\n```\n\n此代码向 lambda 提供三个元素并将 `cycle_length`\
  \ 设置为 3。因此，输出数据集包含三个数据集的第一个三个元素，然后是三个数据集的下一个三个元素，以此类推。\n\n`zip` 方法也交错多个数据集，但它不接受函数或\
  \ `cycle_length` 参数。此方法始终取第一个元素的第一个值，然后取第二个元素的第一个值，依此类推。下面的代码演示了如何使用 `zip`。\n\n\
  ```\nds1 = tf.data.Dataset.range(0, 3)\nds2 = tf.data.Dataset.range(10, 13)\nds3\
  \ = tf.data.Dataset.range(20, 23)\nds4 = tf.data.Dataset.zip((ds1, ds2, ds3))\n\
  #### ds4 contains (0, 10, 20), (1, 11, 21), (2, 12, 22)\n```\n\n`zip` 的 `datasets`\
  \ 参数以嵌套结构接受输入数据集。应用程序可以将此设置为元组，但不能设置为列表。\n\n##### Iterators\n\n`Iterator` 允许你遍历一个或多个\
  \ `Dataset` 的元素。TensorFlow 提供了四种类型的迭代器：\n\n*   `One-shot`: 仅遍历一次数据集，不能参数化\n*   `Initializable`:\
  \ 需要特殊初始化，可以参数化\n*   `Reinitializable`: 可以与多个数据集关联，必须在每次迭代前初始化\n*   `Feedable`:\
  \ 可以与多个数据集关联，无需在每次迭代前初始化\n\n###### One-shot iterators\n\n一次性迭代器是四种中最简单的，但它们只能遍历一次数据集的元素。应用程序可以通过调用数据集的\
  \ `make_one_shot_iterator` 方法为数据集创建一个一次性迭代器。\n\n创建迭代器后，你可以通过调用 `get_next` 来访问下一个可用元素。此方法类似于常规\
  \ Python 迭代器的 `next` 方法。为了演示 `get_next` 的用法，下面的代码创建了一个包含一个元素的数据集并调用 `get_next` 打印元素的值：\n\
  \n```\n#### Create the dataset and iterator\ntensor = tf.constant([1, 2, 3])\ndset\
  \ = tf.data.Dataset.from_tensors(tensor)\niterator = dset.make_one_shot_iterator()\n\
  \n#### Access the next element\nnext_elem = iterator.get_next()\n\n#### Print the\
  \ element's value\nwith tf.Session() as sess:\n    print('Element: ', sess.run(next_elem))\n\
  \n#### Output: 'Element: [1 2 3]'\n```\n\n当会话评估由 `get_next` 返回的张量时，该张量取数据集下一个元素的值。为了演示这一点，下面的代码创建了一个包含五个元素的数据集并重复评估由\
  \ `get_next` 返回的张量：\n\n```\n#### Create the dataset and iterator\ndset = tf.data.Dataset.range(5)\n\
  iterator = dset.make_one_shot_iterator()\n\n#### Access the next element\nnext_elem\
  \ = iterator.get_next()\n\n#### Print the values of the elements\nwith tf.Session()\
  \ as sess:\n    for i in range(5):\n        print('Element: ', sess.run(next_elem))\n\
  ```\n\n在此代码中，`Dataset.range` 创建了一个包含五个元素的数据集。迭代器遍历数据集，会话打印每个值。 resulting output\
  \ is as follows：\n\n```\nElement: 0\nElement: 1\nElement: 2\nElement: 3\nElement:\
  \ 4\n```\n\n一次性迭代器只能遍历一次数据集。如果应用程序尝试执行第二次遍历数据集，TensorFlow 将引发 `OutOfRangeError`：End\
  \ of sequence。\n\n###### Initializable iterators\n\n除了从常量张量创建数据集外，你还可以从占位符创建数据集。这类数据集称为\
  \ *parameterized datasets*，它们在应用程序执行将数据馈送到占位符的会话时接收其内容。\n\n一次性迭代器不能遍历参数化数据集，但可初始化迭代器可以。要创建可初始化迭代器并遍历参数化数据集，你需要执行六个步骤：\n\
  \n1.  **通过调用 `from_tensors` 或 `from_tensor_slices` 从占位符创建数据集。**\n2.  **通过调用数据集的\
  \ `make_initializable_iterator` 方法为数据集创建迭代器。**\n3.  **通过调用迭代器的 `get_next` 方法获取下一个元素。**\n\
  4.  **通过在会话中运行其初始化器属性来初始化迭代器。**\n5.  **通过在会话的 run 方法中设置 `feed_dict` 参数将迭代器的占位符与数据关联。**\n\
  6.  **通过在会话中评估 `get_next` 方法的结果来访问迭代器的元素。**\n\n这个过程可能看起来很复杂，但参数化数据集非常有帮助。为了演示如何使用这些数据集，下面的代码从一个保存四个浮点值的占位符创建数据集。然后它使用可初始化迭代器访问数据集：\n\
  \n```\n#### Create a placeholder and parameterized dataset\nholder = tf.placeholder(tf.float32,\
  \ shape=[4])\ndset = tf.data.Dataset.from_tensor_slices(holder)\n\n#### Create the\
  \ iterator and access its first element\niter = dset.make_initializable_iterator()\n\
  next_elem = iter.get_next()\n\nwith tf.Session() as sess:\n\n    # Initialize the\
  \ iterator\n    sess.run(iter.initializer,\n             feed_dict={holder: [0.,\
  \ 1., 2., 3.]})\n    for _ in range(4):\n        print('Element: ', sess.run(next_elem))\n\
  ```\n\n查看此代码时，重要的是要看到第一次调用 `sess.run` 初始化迭代器并通过占位符向参数化数据集馈送值。初始化后，应用程序可以通过 `get_next`\
  \ 返回的值访问迭代器的值。\n\n###### Reinitializable iterators\n\n如果需要将迭代器与多个数据集关联，一次性迭代器和可初始化迭代器是不够的。相反，应用程序可以通过调用\
  \ `Iterator.from_structure` 创建 *reinitializable iterator*：\n\n```\nIterator.from_structure(output_types,\
  \ output_shapes=None, shared_name=None)\n```\n\n可重新初始化迭代器不需要提前知道特定的数据集，但需要知道其元素的类型和形状。应用程序可以通过访问\
  \ `Dataset` 实例的同名属性来设置 `output_types` 和 `output_shapes`。\n\n\n\n\n\n创建可重新初始化的迭代器后，你可以通过为每个数据集创建单独的初始化器，将其与多个不同的数据集关联起来。下面的代码创建了一个具有两个初始化器的迭代器。然后它使用该迭代器遍历两个数据集：\n\
  \n```python\n#### Create datasets with similar shapes\nds1 = tf.data.Dataset.range(8)\n\
  ds2 = tf.data.Dataset.range(3)\n\n#### Create iterator and get first element\niterator\
  \ = tf.data.Iterator.from_structure(\n    ds1.output_types, ds1.output_shapes)\n\
  next_elem = iterator.get_next()\n\n#### Create an initializer for each dataset\n\
  ds1_init = iterator.make_initializer(ds1)\nds2_init = iterator.make_initializer(ds2)\n\
  \n#### Run both initializers in a session\nwith tf.Session() as sess:\n\n    # Associate\
  \ the iterator with the first dataset\n    sess.run(ds1_init)\n    for _ in range(8):\n\
  \        print('Element from ds1: ', sess.run(next_elem))\n\n    # Associate the\
  \ iterator with the second dataset\n    sess.run(ds2_init)\n    for _ in range(3):\n\
  \        print('Element from ds2: ', sess.run(next_elem))\n```\n\n此代码使用 `ds1` 的形状和类型调用\
  \ `from_structure`。然后它将迭代器与 `ds1` 和 `ds2` 关联。`ds1` 和 `ds2` 没有相同的形状，但它们是兼容的，因为它们的形状相似。\n\
  \n###### Feedable iterators\n\n如果你想在不从数据集开头初始化的情况下在迭代器之间切换，可以创建一个可馈送迭代器。使用可馈送迭代器的过程包括六个步骤：\n\
  \n1. **创建一个包含字符串的占位符。**\n2. **使用占位符调用 `Iterator.from_string_handle`。**\n3. **创建多个迭代器以遍历数据集。**\n\
  4. **对于每个迭代器，通过调用 `string_handle` 获取唯一的字符串张量。**\n5. **在会话中计算每个唯一的字符串张量以获得迭代器的唯一字符串。**\n\
  6. **要切换到特定迭代器，请在会话中计算 `get_next` 的结果，并使用 `sess.run` 的 `feed_dict` 参数提供迭代器的字符串。**\n\
  \n下面的代码演示了此过程。它创建了两个数据集，为每个数据集创建一个一次性迭代器，以及一个可馈送迭代器，使其能够在迭代器之间切换。\n\n```python\n\
  #### Create datasets\nds1 = tf.data.Dataset.range(8)\nds2 = tf.data.Dataset.range(10,\
  \ 13)\n\n#### Create an iterator for each dataset\nds1_iterator = ds1.make_one_shot_iterator()\n\
  ds2_iterator = ds2.make_one_shot_iterator()\n\n#### Create a string placeholder\
  \ and a feedable iterator\nholder = tf.placeholder(tf.string, shape=[])\niterator\
  \ = tf.data.Iterator.from_string_handle(\n    holder, ds1.output_types, ds1.output_shapes)\n\
  next_element = iterator.get_next()\n\n#### Obtain a string tensor for each iterator\n\
  ds1_handle = ds1_iterator.string_handle()\nds2_handle = ds2_iterator.string_handle()\n\
  \n#### Create the session\nwith tf.Session() as sess:\n\n    # Obtain a string from\
  \ each iterator\n    ds1_string = sess.run(ds1_handle)\n    ds2_string = sess.run(ds2_handle)\n\
  \n    # Iterate through the first four elements of ds1\n    for _ in range(4):\n\
  \        print('Element from ds1: ', sess.run(next_element, feed_dict={holder: ds1_string}))\n\
  \n    # Iterate through ds2\n    for _ in range(3):\n        print('Element from\
  \ ds2: ', sess.run(next_element, feed_dict={holder: ds2_string}))\n\n    # Iterate\
  \ through the last four elements of ds1\n    for _ in range(4):\n        print('Element\
  \ from ds1: ', sess.run(next_element, feed_dict={holder: ds1_string}))\n```\n\n\
  此代码打印 `ds1` 的前四个元素、`ds2` 的元素以及 `ds1` 的后四个元素。因为迭代器是可馈送的，所以应用程序在第二次迭代之前不需要重新初始化 `ds1`\
  \ 迭代器。\n\n##### Putting Theory into Practice\n\n`ch10/dataset.py` 中的代码演示了如何创建和处理数据集。该模块首先创建\
  \ `Example`，将 `Example` 的数据写入 TFRecord 文件，并将文件的数据加载到 `TFRecordDataset` 中。然后它创建另外两个数据集，使用\
  \ `Dataset` 方法处理它们，并遍历其元素。 Listing 10-1 展示了代码。\n\n###### LISTING 10-1 Creating and\
  \ Processing Datasets\n\n```python\n#### Generator function\ndef generator():\n\
  \    x = 20\n    while x < 28:\n        yield x\n        x += 1\n\n#### Create an\
  \ example containing floats\nint_list = tf.train.Int64List(value=[0, 1, 2, 3])\n\
  feat = tf.train.Feature(int64_list=int_list)\ncontainer = tf.train.Features(feature={'feat'\
  \ : feat})\nexample = tf.train.Example(features=container)\n\n#### Write the example\
  \ to a GZIP file\nopts = tf.python_io.TFRecordOptions(tf.python_io.TFRecordCompressionType.GZIP)\n\
  writer = tf.python_io.TFRecordWriter('ex.tfrecord', opts)\nwriter.write(example.SerializeToString())\n\
  writer.close()\n\n#### Function to parse TFRecords\ndef parse_func(buff):\n    features\
  \ = {'feat': tf.FixedLenFeature(shape=[4], dtype=tf.int64)}\n    tensor_dict = tf.parse_single_example(buff,\
  \ features)\n    return tensor_dict['feat']\n\n#### Create a dataset from TFRecords\n\
  dset1 = tf.data.TFRecordDataset('ex.tfrecord', 'GZIP')\ndset1 = dset1.map(parse_func)\n\
  iter1 = dset1.make_one_shot_iterator()\nnext1 = iter1.get_next()\n\n#### Create\
  \ a parameterized dataset and reinitializable iterator\nholder = tf.placeholder(tf.int64,\
  \ shape=[2])\ndset2 = tf.data.Dataset.from_tensor_slices(holder)\ndset2 = dset2.concatenate(tf.data.Dataset.range(12,\
  \ 14))\n\n#### Create the third dataset\ndset3 = tf.data.Dataset.from_generator(generator,\
  \ output_types=tf.int64)\ndset3 = dset3.filter(lambda x: x < 24)\n\n#### Create\
  \ a reinitializable iterator for the 2nd, 3rd datasets\niter2 = tf.data.Iterator.from_structure(\n\
  \    dset2.output_types, dset2.output_shapes)\nnext2 = iter2.get_next()\n\n####\
  \ Create initializers for the 2nd, 3rd datasets\ndset2_init = iter2.make_initializer(dset2)\n\
  dset3_init = iter2.make_initializer(dset3)\n\n#### Print the content of each dataset\n\
  with tf.Session() as sess:\n\n    # Print the content of the first dataset\n   \
  \ print('Element from dset1: ', sess.run(next1))\n\n    # Print the content of the\
  \ second dataset\n    sess.run(dset2_init, feed_dict={holder: [10, 11]})\n    for\
  \ _ in range(4):\n        print('Element from dset2: ', sess.run(next2))\n\n   \
  \ # Print the content of the third dataset\n    sess.run(dset3_init)\n    for _\
  \ in range(4):\n        print('Element from dset3: ', sess.run(next2))\n```\n\n\
  该模块创建、操作并遍历三个数据集：\n\n* 第一个数据集 `dset1` 接收存储在 TFRecord 文件中的值。它有一个元素，包含四个值：0、1、2、3。\n\
  * 第二个数据集 `dset2` 是参数化的，并在会话执行时通过占位符接收值。它有四个元素，每个元素一个值：10、11、12、13。\n* 第三个数据集 `dset3`\
  \ 从生成器函数接收八个值（20 到 27）。`filter` 方法删除每个值大于 24 的元素，使其剩下四个单值元素：20、21、22、23。\n\n对于第一个数据集，模块将序列化的\
  \ `Example` 写入名为 `ex.tfrecord` 的文件。模块使用 `gzip` 算法压缩文件的内容，下面的代码显示了如何配置 GZIP 压缩的使用：\n\
  \n```python\nopts = tf.python_io.TFRecordOptions(tf.python_io.TFRecordCompressionType.GZIP)\n\
  writer = tf.python_io.TFRecordWriter('ex.tfrecord', opts)\n```\n\n在组装三个数据集之后，模块创建了两个迭代器。第一个迭代器是一个一次性迭代器，在会话运行时显示\
  \ `dset1` 的值。\n\n\n\n\n\n第二个迭代器是一个可重新初始化的迭代器，用于显示 `dset2` 和 `dset3` 中的值。该模块为可重新初始化的迭代器创建了两个初始化器。在会话期间，模块运行这两个初始化器，并使用它们遍历\
  \ `dset2` 和 `dset3` 中的值。\n\n##### Bizarro Datasets\n\n在 第 6 章 中，我解释了如何通过调用 `tf.contrib.learn.python.learn.datasets.mnist`\
  \ 包的 `read_data_sets` 方法来创建一个包含 MNIST 手写样本的 `Dataset`。乍看之下很奇怪，但该 `Dataset` 与本章讨论的\
  \ `Dataset` 类没有任何关系。`tf.contrib.learn.python.learn.datasets` 包定义了自己的 `Dataset` 结构，代码如下：\n\
  \n`Dataset = collections.namedtuple('Dataset', ['data', 'target'])`\n\n我称这个 `Dataset`\
  \ 为 *bizarro dataset*，因为它让我想起了超人丑陋、智力较差的镜像 Bizarro。这个 `Dataset` 没有子类或有趣的处理方法。它只是一个包含两个元素的命名元组：`data`\
  \ 包含数据点，而 `target` 包含数据点的标签。例如，如果一个估计器的任务是将空间中的点分类到类别中，则 `Dataset` 会将其 `data` 元素中存储点的坐标，并将其\
  \ `target` 元素中存储类别 ID。\n\nTensorFlow 提供两个 `Dataset` 结构让我感到恼火，但我必须承认 `tf.contrib.learn.python.learn.datasets`\
  \ 包中的函数使加载和访问数据变得容易。这种简单性解释了为什么 TensorFlow 的许多示例应用程序都依赖于这些函数。表 10-5 列出了创建 bizarro\
  \ datasets 的五个函数，并提供了每个函数的描述。\n\nTABLE 10-5 Creating Bizarro Datasets\n\n| **Member**\
  \ || **Description** |\n| --- | --- |\n| `load_csv_with_header(filename, target_dtype,\
  \ features_dtype, target_column=-1)` || 从包含标题行的 CSV 文件加载数据集 |\n| --- | --- |\n|\
  \ `load_csv_without_header(filename, target_dtype, features_dtype, target_column=-1)`\
  \ || 从不包含标题行的 CSV 文件加载数据集 |\n| `shrink_csv(filename, ratio)` || 从 CSV 文件加载精简后的数据集\
  \ |\n| `load_iris(data_path=None)` || 从训练/测试 CSV 文件加载鸢尾花数据集 |\n| `load_boston(data_path=None)`\
  \ || 从训练/测试 CSV 文件加载波士顿房价数据集 |\n\n为了解释这些方法，我将它们分为两类。第一类函数从逗号分隔值 CSV 文件加载数据。第二类函数从现有的机器学习数据集加载数据：鸢尾花数据集和波士顿数据集。\n\
  \n###### Loading data from CSV files\n\n许多应用程序使用逗号分隔值 CSV 文件导入和导出数据。在 CSV 文件中，每一行提供一个由逗号分隔的值组成的记录。这种格式效率不是特别高，但人类和计算机都可以轻松读取\
  \ CSV 文件。\n\n表中的前三个函数从 CSV 文件加载数据集。`load_csv_with_header` 从包含标题的 CSV 文件加载数据集，而 `load_csv_without_header`\
  \ 从不包含标题的 CSV 文件加载数据集。\n\n`shrink_csv` 的 `ratio` 参数决定 CSV 文件的哪些行应存储在数据集中。如果应用程序将\
  \ `ratio` 设置为 N，`shrink_csv` 将每 N 行存储一行到数据集中。通过更改 `ratio`，应用程序可以选择不同的 CSV 记录组合用于数据集。\n\
  \n这些函数不会从通用 CSV 文件创建数据集。它们期望 CSV 文件以特定方式格式化：\n\n* 如果存在，文件标题应以样本数（包含记录的行数）和特征数（每行字段数）开头。\n\
  * 每条数据行应以对应数据点的期望类别结尾。\n\n例如，以下文本展示了包含鸢尾花数据集训练数据的 CSV 文件的前五行：\n\n```\n30,4,setosa,versicolor,virginica\n\
  5.9,3.0,4.2,1.5,1\n6.9,3.1,5.4,2.1,2\n5.1,3.3,1.7,0.5,0\n6.0,3.4,4.5,1.6,1\n```\n\
  \n根据标题，该文件提供 30 条记录，每条记录有四个字段。每行中的最后一个值标识类别，因此第一个数据点属于类别 1。\n\n在常规 CSV 文件中，标题为记录中的每个字段提供名称。但在此示例中，标题有三个名称，而每条记录在类别之前有四个字段。事实证明，标题名称标识类别名称：`setosa`\
  \ 标识类别 0，`versicolor` 标识类别 1，`virginica` 标识类别 2。\n\n###### Loading the Iris and\
  \ Boston datasets\n\nTensorFlow 网站提供了两个流行的可用于轻松训练和测试机器学习应用程序的数据集。第一个数据集称为鸢尾花数据集，它将花卉的物理特征与三种鸢尾花类型之一关联起来。第二个数据集称为波士顿数据集，它将波士顿房产的特征与房价关联起来。\n\
  \n对于每个数据集，TensorFlow 都提供了两个 CSV 文件：一个包含训练数据，一个包含测试数据。对于鸢尾花数据集，您可以从 [`http://download.tensorflow.org/data/iris_training.csv`](http://download.tensorflow.org/data/iris_training.csv)\
  \ 下载包含训练数据的文件，并从 [`http://download.tensorflow.org/data/iris_test.csv`](http://download.tensorflow.org/data/iris_test.csv)\
  \ 下载测试数据。\n\n将文件下载到系统后，您可以通过调用 `load_iris` 并传入其中一个鸢尾花文件的路径来创建数据集。此函数返回一个 `Dataset`，其\
  \ `data` 集合包含浮点值（花卉特征），其 `target` 集合包含整数（鸢尾花类别）。\n\n波士顿数据集标识了与波士顿地区房屋相关的多个统计数据（来自\
  \ 1978 年），包括人均犯罪率、师生比例以及每户房屋的平均房间数。您可以从 [`https://github.com/tensorflow/tensorflow/blob/master/tensorflow/examples/tutorials/input_fn/boston_train.csv`](https://github.com/tensorflow/tensorflow/blob/master/tensorflow/examples/tutorials/input_fn/boston_train.csv)\
  \ 下载波士顿训练数据，并从 [`https://github.com/tensorflow/tensorflow/blob/master/tensorflow/examples/tutorials/input_fn/boston_test.csv`](https://github.com/tensorflow/tensorflow/blob/master/tensorflow/examples/tutorials/input_fn/boston_test.csv)\
  \ 下载测试数据。\n\n与 MNIST 数据集一样，鸢尾花数据集和波士顿数据集使测试新的机器学习算法变得简单。下一章解释了如何使用鸢尾花数据集和波士顿数据集测试估计器。\n\
  \n#### Chapter 11\n\n#### Using Threads, Devices, and Clusters\n\nIN THIS CHAPTER\n\
  \n![check](img/check.png)**Configuring threads in applications**\n\n![check](img/check.png)**Assigning\
  \ operations to devices**\n\n![check](img/check.png)**Creating distributed applications\
  \ with clusters**\n\n*I feel the need … the need for speed!* 如果你曾对机器学习说过这句话，那么本章就是为你准备的。根据我的经验，你可以使用四种方法加速\
  \ TensorFlow 应用程序：\n\n* 生成多个执行线程\n* 访问高性能设备，如图形处理器单元 GPU\n* 在网络设备集群上执行应用程序\n* 将应用程序部署到云端\n\
  \n本章讨论前三种选项，然后演示如何在集群中执行 TensorFlow 应用程序。第 13 章 解释了如何在云中运行 TensorFlow。\n\n#####\
  \ Executing with Multiple Threads\n\n*thread* 是能够独立于其他线程执行的运算序列。在 TensorFlow 应用程序中，你可以主要以两种方式利用线程：\n\
  \n\n\n\n\n*   **在单独的线程中执行耗时的操作，例如加载和存储数据。** 这种方法可以让你的处理线程在不中断的情况下继续工作。\n\n*   **使用多个线程运行一个会话。**\
  \ 从理论上讲，这种方法会减少处理会话操作所需的时间。\n\n对于第一点，开发者过去会创建 `QueueRunner`，它将要执行的任务存储在单独的线程中。但从\
  \ 1.4 版本开始，TensorFlow 的文档建议改用数据集，这就是为什么 第 10 章 讨论数据集和迭代器，而不是线程、队列运行器和协调器。\n\n要以多线程方式处理数据集，你可以设置\
  \ `Dataset` 的 `map` 方法的 `num_parallel_calls` 参数。例如，如果将此参数设置为 4，TensorFlow 将使用四个线程执行\
  \ `map` 操作。 第 10 章 详细讨论了 `Dataset` 类及其 `map` 方法。\n\n对于第二点，你可以通过设置正确的配置参数来使用多个线程执行会话。你可以在创建会话时或运行会话时设置这些参数。\n\
  \n###### 配置新的会话\n\n第 1 章 到 第 10 章 中的所有示例代码都已在没有任何参数的情况下调用了 `tf.Session`。但你可以通过将\
  \ `tf.Session` 的 `config` 参数设置为 `ConfigProto` 协议缓冲区来配置会话。此缓冲区的字段决定了会话的行为，表 11-1\
  \ 列出了其中的每一个。\n\nTABLE 11-1 ConfigProto 字段\n\n| **Field** || **Type** || **Description**\
  \ |\n\n| --- | --- | --- |\n\n| `device_count` || `map<string, int32>` || 标识会话可以访问的每种类型的设备数量\
  \ |\n\n| --- | --- | --- |\n\n| `intra_op_parallelism_threads` || `int32` || 使用多个线程执行单个操作\
  \ |\n\n| `inter_op_parallelism_threads` || `int32` || 使用多个线程执行单独的操作 |\n\n| `session_inter_op_thread_pool`\
  \ || `ThreadPoolOptionProto` || 配置会话线程池 |\n\n| `placement_period` || `int32` ||\
  \ 确定分配节点到设备的频率 |\n\n| `device_filters` || `string` || 防止命名设备被会话访问 |\n\n| `gpu_options`\
  \ || `GPUOptions` || 配置会话访问的任何 GPU |\n\n| `allow_soft_placement` || `bool` || 确定操作如何分配到\
  \ CPU 和 GPU |\n\n| `graph_options` || `GraphOptions` || 配置会话图(图)的选项 |\n\n| `operation_timeout_in_ms`\
  \ || `int64` || 配置会话阻塞操作的全局超时 |\n\n| `rpc_options` || RPCOptions || 配置会话的分布式运行时\
  \ |\n\n| `cluster_def` || ClusterDef || 列出此会话中使用的 worker |\n\n本节重点介绍配置会话线程的选项。默认情况下，会话为目标处理器上的每个核心执行一个线程。如果你在一台\
  \ Intel Core i5 CPU 上运行 TensorFlow，你的会话最多将使用四个线程，因为该 CPU 有四个核心。\n\n了解 `intra_op_parallelism_threads`\
  \ 和 `inter_op_parallelism_threads` 选项之间的区别很重要。许多 TensorFlow 操作，例如矩阵乘法，可以使用多个线程加速。`intra_op_parallelism_threads`\
  \ 选项决定应生成多少个线程来执行 *单个* 操作。相比之下，如果图中有可以并行运行的操作，`inter_op_parallelism_threads` 选项决定可以生成多少个线程来执行它们。\n\
  \n为了演示如何配置线程，以下代码创建了一个 `ConfigProto`，它将单个操作的最大线程数设置为六个，并行操作的最大线程数设置为八个。然后它使用 `ConfigProto`\
  \ 创建一个会话：\n\n```\nconf = tf.ConfigProto(intra_op_parallelism_threads=6, inter_op_parallelism_threads=8)\n\
  \nwith tf.Session(config=conf) as sess:\n …\n```\n\n默认情况下，会话将从全局线程池访问线程，而不是创建自己的线程。你可以使用\
  \ `use_per_session_threads` 选项更改此行为。如果你将此选项设置为 `True`，会话将创建自己的线程。\n\n如果你希望会话在执行主要计算的同时执行后台任务，你可以通过将\
  \ `session_inter_op_thread_pool` 设置为一个或多个 `ThreadPoolOptionProto` 缓冲区来配置它。每个 `ThreadPoolOptionProto`\
  \ 标识一个单独的线程池。此协议缓冲区有两个字段：\n\n*   `num_threads`: 线程池中的线程数\n\n*   `global_name`: 线程池的字符串标识符\n\
  \n当你希望会话使用特定池中的线程执行时，你可以在 `run` 方法接受的 `RunOptions` 中标识线程池。下一节将全面讨论 `RunOptions`\
  \ 缓冲区。\n\n###### 配置正在运行的会话\n\n就像你可以将 `tf.Session` 的 `config` 参数设置为 `ConfigProto`\
  \ 一样，你可以将会话的 `run` 方法的 `options` 参数设置为 `RunOptions`。`RunOptions` 的字段决定了会话将如何执行，表\
  \ 11-2 列出了这些字段。\n\nTABLE 11-2 RunOptions 字段\n\n| **Field** || **Type** || **Description**\
  \ |\n\n| --- | --- | --- |\n\n| `trace_level` || `TraceLevel` || 确定要执行的跟踪类型 |\n\n\
  | --- | --- | --- |\n\n| `timeout_in_ms` || `int64` || 等待会话操作完成的时间 |\n\n| `inter_op_thread_pool`\
  \ || `int32` || 标识操作要使用的线程池 |\n\n| `output_partition_graphs` || `bool` || 标识会话的分区图是否应提供在元数据中\
  \ |\n\n| `debug_options` || `DebugOptions` || 设置调试会话操作的配置选项 |\n\n如果你将 `Session`\
  \ 配置为使用多个线程池，你可以通过在 `RunOptions` 中设置 `inter_op_thread_pool` 选项来告诉会话从特定池执行线程。例如，如果你将此选项设置为\
  \ 1，会话将在第二个线程池中执行线程。\n\n##### 配置设备\n\n现代处理器可以执行特殊指令，以高速执行数学运算。例如，特殊的乘法指令可以在常规指令乘以一对值所需的时间内乘以四对值。这些特殊指令一次操作多个值，因此被称为\
  \ SIMD（单指令，多数据）指令。\n\n不幸的是，当你使用 pip 等工具安装 TensorFlow 时，你得到的是基础、乏味的安装。此安装可在新旧计算机上运行，但它不会利用\
  \ SIMD 指令，也不会在图形处理器单元（GPU）上执行操作，即使你已安装了兼容的显卡。\n\n如果你希望 TensorFlow 最好地利用你的系统功能，你需要专门为你的系统构建\
  \ TensorFlow。\n\n###### 从源代码构建 TensorFlow\n\n从源代码构建 TensorFlow 需要时间和精力，但如果你执行大量机器学习应用程序，从长远来看，你将节省时间。本节解释了如何为\
  \ Windows、macOS 和 Linux 系统构建 TensorFlow。但了解三个主题很重要：获取 TensorFlow 源代码、Bazel 构建系统和\
  \ GPU 加速。\n\n####### 下载 TensorFlow 源代码\n\n\n\n\n\nTensorFlow 是一个开源项目，你可以在 [`https://github.com/tensorflow/tensorflow`](https://github.com/tensorflow/tensorflow)\
  \ 访问源代码。如果你会使用 git，可以使用以下命令克隆仓库：\n\n```\ngit clone https://github.com/tensorflow/tensorflow.git\n\
  ```\n\n如果你不会使用 git，点击标题为 Clone or download 的绿色按钮。然后选择 Download ZIP 选项下载包含 TensorFlow\
  \ 源代码的 zip 文件。下载完成后解压该 zip 文件。\n\n###### Bazel 和 Java\n\nBazel 是 Google 的一个工具，用于自动化软件构建过程。它通过执行名为\
  \ `BUILD` 的文件中定义的操作来运行。该文件中的指令称为 *rules*，使用 Skylark 编写，Skylark 是 Python 的一个子集。\n\
  \n如果你浏览 TensorFlow 文件层次结构，会看到许多 `BUILD` 文件和 `*.BUILD` 文件。如果你打开 `tensorflow` 目录中的\
  \ `BUILD` 文件，会找到许多配置设置，例如以下内容：\n\n```\nconfig_setting(\n name = \"linux_x86_64\"\
  ,\n values = {\"cpu\": \"k8\"},\n visibility = [\"//visibility:public\"],\n)\n```\n\
  \n每个 `config_setting` 块标识构建 TensorFlow 所支持的平台。\n\n在安装 Bazel 之前，你需要在系统上安装 Java。具体来说，你需要安装\
  \ Java 开发工具包 (JDK) 的 8.*x* 版本。如果你没有此版本，可以在 [`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\
  \ 下载 Windows 和 macOS 的安装程序。\n\n如果你运行的是 Ubuntu 等基于 Debian 的系统，可以使用以下命令安装 OpenJDK\
  \ 8.*x*：\n\n```\nsudo apt-get install openjdk-8-jdk\n```\n\n安装 JDK 8.*x* 后，你就可以准备安装\
  \ Bazel 了。安装 Bazel 的说明取决于你的操作系统。\n\n###### 图形处理器单元 (GPU) 加速\n\n虽然 CPU 设计用于安全、通用计算，但\
  \ GPU 设计用于高速图形渲染，这涉及大量数学运算。对于许多机器学习应用，通过在 GPU 而不是 CPU 上运行操作，可以显著提高性能。\n\n通用 GPU\
  \ (GPGPU) 开发的两种主要语言是 OpenCL 和 CUDA。OpenCL 由多个厂商支持，可以在多种设备上运行，包括 CPU、GPU 和 FPGA。但\
  \ TensorFlow 仅在安装了 ComputeCpp 的系统上支持 OpenCL。你可以从 [`www.codeplay.com/products/computesuite/computecpp`](http://www.codeplay.com/products/computesuite/computecpp)\
  \ 下载 ComputeCpp。\n\n第二种 GPGPU 语言 CUDA 仅在 Nvidia 的 GPU 上运行。要安装 CUDA，请访问 [`https://developer.nvidia.com/cuda-downloads`](https://developer.nvidia.com/cuda-downloads)\
  \ 并点击标识你的操作系统、架构和 OS 版本的按钮。然后下载并启动安装程序，它将引导你完成安装过程。\n\n###### 在 Windows 上准备 TensorFlow\
  \ 构建\n\n在 Windows 上构建 TensorFlow 很困难，因为你需要设置一个支持 Bash 脚本、Python 和 GNU 构建工具（如 `gcc`\
  \ 和 `g++`）的类 UNIX 环境。为了创建此环境，大多数开发者使用 Cygwin 或 MSYS2（Minimal System 2）。在本节中，我将解释如何使用\
  \ MSYS2 在 Windows 上构建 TensorFlow。\n\n要安装 MSYS2，请访问 [`www.msys2.org`](http://www.msys2.org)\
  \ 并选择 32 位 (i686) 或 64 位 (x86\\_64) 可执行文件。下载完成后，启动可执行文件并按照安装说明进行操作。\n\n假设你为 64 位\
  \ Windows 选择了默认选项，MSYS2 会将所有文件放置在名为 `C:\\msys64` 的新目录中。两个文件夹特别重要：\n\n* `C:\\msys64\\\
  mingw64\\bin` 包含 MinGW（Minimalist GNU for Windows）提供的实用程序。安装 MSYS2 时，此文件夹为空。\n*\
  \ `C:\\msys64\\home\\<name>` 是你的主目录。启动 MSYS2 时，它将是你的初始目录。\n\n要安装 TensorFlow，你需要能够在\
  \ GNU 工具链中访问构建工具，如 `gcc`、`g++` 和 `ld`。你可以通过将 MinGW 包下载到 MSYS2 环境中获得这些工具。MSYS2 安装程序称为\
  \ `pacman`，你可以通过启动 MSYS2 并输入以下命令来安装必要的 MinGW 包：\n\n```\npacman -S --needed mingw-w64-x86_64-python3-pip\
  \ base-devel mingw-w64-x86_64-toolchain\n```\n\n此命令会在 `C:\\msys64\\mingw64\\bin`\
  \ 目录中添加许多文件和可执行文件。为了让 MSYS2 知道如何找到这些可执行文件，你需要将此目录添加到系统的 `PATH` 变量中。\n\n如果在 MSYS2\
  \ 命令行上运行 `python --version`，它可能会告诉你你正在使用 Python 2.*x*。此版本有问题，因为 Windows 上的 TensorFlow\
  \ 需要 Python 3.5。为了解决此问题，我建议执行以下四个步骤：\n\n1. **打开 `C:\\msys64\\mingw64\\bin` 目录并将\
  \ `python.exe` 重命名为 `old_python.exe`。**\n2. **在同一目录中，复制 `python3.5.exe` 并将副本重命名为\
  \ `python.exe`。**\n3. **在同一目录中，复制 `pip3.exe` 并将副本重命名为 `pip.exe`。**\n4. **在同一目录中，复制\
  \ `pip3-script.py` 并将副本重命名为 `pip-script.py`。**\n\n要验证一切是否正常运行，请在 MSYS2 中运行 `python\
  \ --version` 并确保默认 Python 版本为 3.*x*。然后使用以下命令安装 TensorFlow 的 Python 依赖项：\n\n```\n\
  pip install six numpy wheel\n```\n\n接下来，你需要安装 Bazel 工具。此过程也需要四个步骤：\n\n1. **如果尚未安装，请为你的系统安装\
  \ Java 开发工具包 (JDK) 8。**\n   你可以从 [`www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)\
  \ 下载安装程序。\n2. **访问** [`http://github.com/bazelbuild/bazel/releases`](http://github.com/bazelbuild/bazel/releases)\
  \ **并点击最新版本的编号。**\n3. **滚动到页面底部并找到适合你的系统的 Windows 可执行文件。**\n4. **下载可执行文件，将其重命名为\
  \ `bazel.exe,` 并将其放置在 `C:\\msys64\\mingw64\\bin` 目录中。**\n\n安装 Bazel 后，将 TensorFlow\
  \ 源代码目录复制到 MSYS2 主目录 (`C:\\msys64\\home\\Part`)。然后在 MSYS2 环境内部，切换到 `tensorflow`\
  \ 目录。现在你就可以开始构建了！\n\n###### 在 macOS 上准备 TensorFlow 构建\n\n在 macOS 系统上构建 TensorFlow\
  \ 之前，你需要安装 Bazel 和 TensorFlow 的依赖项。如果你已经安装了 Java JDK 8.*x*，则可以使用 Homebrew 安装 Bazel。\n\
  \n你可能已经在系统上安装了 Homebrew，但如果没有，可以使用以下命令安装：\n\n```\n/usr/bin/ruby -e \"$(curl -fsSL\
  \ https://raw.githubusercontent.com/Homebrew/install/master/install`)\"\n```\n\n\
  安装 Homebrew 后，可以使用以下命令安装 Bazel：\n\n```\nbrew install bazel\n```\n\n在安装 TensorFlow\
  \ 之前，你需要安装其三个依赖项：NumPy、six 和 wheel。以下命令会安装全部三个：\n\n```\nsudo pip install six numpy\
  \ wheel\n```\n\n如果你希望 TensorFlow 访问系统的 GPU，你需要安装 GNU 的核心实用程序。你可以使用 Homebrew 安装它们：\n\
  \n```\nbrew install coreutils\n```\n\n完成后，你就可以开始配置和构建 TensorFlow 了。\n\n###### 在\
  \ Linux (Ubuntu) 上准备 TensorFlow 构建\n\n在众多 Linux 发行版中，TensorFlow 仅支持 Ubuntu，具体为 14.04\
  \ 及更高版本。如果你已安装 Python 和 Java JDK 8.*x*，在 Ubuntu 上安装 TensorFlow 很简单。\n\n第一步是安装 Bazel\
  \ 构建工具，你可以使用以下命令将 Bazel 的发行版 URI 添加为软件包源：\n\n\n\n\n\n`echo \"deb [arch=amd64] http://storage.googleapis.com/bazel-apt\
  \ stable jdk1.8\" | sudo tee /etc/apt/sources.list.d/bazel.list`\n\n`curl https://bazel.build/bazel-release.pub.gpg\
  \ | sudo apt-key add -`\n\n之后，你可以使用以下命令安装 Bazel：\n\n`sudo apt-get update && sudo\
  \ apt-get install bazel`\n\n在构建 TensorFlow 之前，你需要安装四个依赖包：NumPy、Python-Dev、pip 和\
  \ wheel。如果使用的是 Python 2.*x,* 你可以使用以下命令安装这些依赖：\n\n`sudo apt-get install python-numpy\
  \ python-dev python-pip python-wheel`\n\n如果使用的是 Python 3.*x,* 你可以使用以下命令安装 TensorFlow\
  \ 的依赖：\n\n`sudo apt-get install python3-numpy python3-dev python3-pip python3-wheel`\n\
  \n如果安装成功完成，你就可以开始构建 TensorFlow 了。\n\n###### Building TensorFlow\n\n在将 TensorFlow\
  \ 源代码下载到系统并安装 Bazel 和 TensorFlow 的依赖项后，你就可以开始构建 TensorFlow 了。开始时，切换到包含源代码的目录并输入以下命令：\n\
  \n`./configure`\n\n该命令执行 `configure` 脚本，该脚本会提出一系列问题来配置 TensorFlow 包的特性。在下面的列表中，我介绍了在\
  \ Linux 上安装时遇到的问 题。每个问题后都有一组默认响应，放在方括号中。你可以通过按 Enter 来选择默认响应。\n\n*   **Python location:**\
  \ 包含 Python 解释器的目录\n*   **Python library path:** 包含 Python 库的目录\n*   **jemalloc\
  \ support:** TensorFlow 是否应使用改进的 `jemalloc` 函数而不是 `malloc` 来分配内存。我建议选择 Yes (Y)。\n\
  *   **Google Cloud Platform support:** TensorFlow 是否应为 Google 的云计算服务 Google Cloud\
  \ Platform (GCP) 提供支持。 第 14 章 解释了如何在 GCP 上运行 TensorFlow。\n*   **Hadoop File System\
  \ support:** TensorFlow 是否应支持 Hadoop 文件系统\n*   **Amazon S3 File System support:**\
  \ TensorFlow 是否应为 Amazon 的分布式 S3 文件系统提供支持\n*   **XLA JIT support:** TensorFlow 是否应使用实验性的\
  \ XLA (Accelerated Linear Algebra) 编译器来加速数学运算\n*   **GDR support:** TensorFlow 是否应启用\
  \ CUDA 的高速内存访问，GPUDirect RDMA\n*   **VERBS support:** TensorFlow 是否应通过 VERBS 包启用远程直接内存访问\
  \ (RDMA)\n*   **OpenCL support:** TensorFlow 是否应使用 OpenCL 启用 GPU 计算\n*   **CUDA\
  \ support:** TensorFlow 是否应使用 CUDA 启用 GPU 计算\n*   **MPI support:** TensorFlow 是否应使用消息传递接口\
  \ (MPI) 启用集群计算\n*   **Optimization flags:** 构建 TensorFlow 时使用的优化标志\n\n最后一个选项尤其重要。默认情况下，构建过程将包含标志\
  \ `–march=native`。该标志告诉编译器检查目标 CPU 并确保 TensorFlow 将使用处理器支持的最先进功能。一般来说，我建议保留默认的优化选项。\n\
  \n完成问卷后，脚本会将你的配置选择存储在名为 `.tf_configure.bazelrc` 的文件中。要继续构建，请输入以下命令：\n\n`bazel build\
  \ --config=opt //tensorflow/tools/pip_package:build_pip_package`\n\n该命令在 `bazel-bin/tensorflow/tools/pip_package`\
  \ 目录中创建一个名为 `build_pip_package` 的脚本。要构建 TensorFlow 的安装包，请输入以下命令：\n\n`bazel-bin/tensorflow/tools/pip_package/build_pip_package\
  \ /tmp/tensorflow_pkg`\n\n该命令在你的 `/tmp/tensorflow_pkg` 目录中创建一个 wheel 文件 `(*.whl`)。你可以通过调用\
  \ `pip install` 并使用此 wheel 文件来安装新的 TensorFlow 包。在我的系统上，wheel 文件是 `tensorflow-1.4.0rc1-cp27mu-linux_x86_64.whl`。因此，我可以使用以下命令安装\
  \ TensorFlow：\n\n`sudo pip install /tmp/tensorflow_pkg/tensorflow-1.4.0rc1-cp27mu-linux_x86_64.whl`\n\
  \n`pip install` 完成后，TensorFlow 安装完成。你可以像安装默认 TensorFlow 安装一样访问 `tensorflow` 包及其模块。\n\
  \n###### Assigning operations to devices\n\n如果你已将 TensorFlow 配置为在 GPU 上执行并且已安装适当的\
  \ SDK，TensorFlow 会自动将处理操作分配给 GPU。\n\n例如，TensorFlow 包含两个版本的 `matmul`：一个在 CPU 上执行，一个在\
  \ GPU 上执行。当应用程序执行 `matmul` 时，如果 GPU 可用，TensorFlow 会在 GPU 上执行矩阵乘法。\n\nTensorFlow\
  \ 允许你手动将操作分配给设备，但首先，有助于知道有哪些设备可用。TensorFlow 通过 `tensorflow.python.client` 包中的一个未记录函数\
  \ `list_local_devices` 提供此信息。该函数返回 `DeviceAttribute` 协议缓冲区的列表，并且以下代码调用 `list_local_devices`\
  \ 来打印可用设备的列表：\n\n```\nfrom tensorflow.python.client import device_lib\n\ndevices\
  \ = device_lib.list_local_devices()\n\nfor device in devices:\n    print(device)\n\
  ```\n\n在我的廉价笔记本电脑上，此代码打印以下结果：\n\n```\nname: \"/device:CPU:0\"\ndevice_type: \"CPU\"\
  \nmemory_limit: 268435456\nlocality {}\nincarnation: 2086003163627480003\n```\n\n\
  TensorFlow 识别两种类型的设备：CPU 和 GPU。TensorFlow 为每个设备分配一个名称，并且该名称始终具有相同的格式：\n\n`/job:Part/replica:<replica>/task:<task>/device:<type>:<device_num>`\n\
  \n除非你正在开发分布式应用程序，否则你可以省略 `job`、`replica` 和 `task` 字段，只需使用 `/device:<type>:<device_num>`。这里，`<type>`\
  \ 可以是 `CPU` 或 `GPU`，而 `<device_num>` 标识给定类型中识别的设备的索引。因此，第一个 CPU 是 `/device:CPU:0`，第二个\
  \ GPU 是 `/device:GPU:1`。\n\n如果你有多个给定类型的设备，可以配置会话以限制其可访问的设备数量。`ConfigProto` 缓冲区中的\
  \ `device_count` 参数使其成为可能。例如，以下代码将会话配置为最多使用两个 GPU：\n\n```\nconf = tf.ConfigProto(device_count={'GPU':\
  \ 2})\nwith tf.Session(config=conf) as sess:\n    …\n```\n\n如果你想在特定设备上执行操作，可以使用设备的名称调用\
  \ `tf.device`。此函数返回一个上下文管理器，将上下文中的所有操作分配给给定设备。例如，以下代码指定后续操作应分配给第二个 GPU：\n\n```\n\
  with tf.device('/device:GPU:1'):\n    …\n```\n\n假设你的应用程序正在执行一个会话，你想知道会话正在使用哪些设备。在这种情况下，你可以将\
  \ `log_device_placement` 选项设置为 `True`，在会话的构造函数中。\n\n```\na = tf.constant(1.2, name='a_var')\n\
  b = tf.constant(3.4, name='b_var')\nsum = a + b;\nconf = tf.ConfigProto(log_device_placement=True)\n\
  with tf.Session(config=conf) as sess:\n    print(sess.run(sum))\n```\n\n如果系统只有一个\
  \ CPU，打印的输出将如下所示：\n\n```\n4.6\nDevice mapping: no known devices.\nadd: (Add): /job:localhost/replica:0/task:0/device:CPU:0\n\
  b_var: (Const): /job:localhost/replica:0/task:0/device:CPU:0\na_var: (Const): /job:localhost/replica:0/task:0/device:CPU:0\n\
  ```\n\n###### Configuring GPU usage\n\n\n\n\n\n如果你的 TensorFlow 安装可以访问 GPU 并且 TensorFlow\
  \ 识别到一个兼容的 GPU，那么你的会话会默认将数学运算分配给 GPU。你可以通过设置会话 `ConfigProto` 中的 `gpu_options` 字段来配置\
  \ CPU 如何与 GPU 交互。你必须将 `gpu_options` 分配给一个 `GPUOptions` 缓冲区，表 11-3 列出了其字段。\n\nTABLE\
  \ 11-3 GPUOptions Fields\n\n| **Field** || **Type** || **Description** |\n\n| ---\
  \ | --- | --- |\n\n| `per_process_gpu_memory_fraction` || `double` || Configures\
  \ the fraction of the GPU memory to allocate |\n\n| --- | --- | --- |\n\n| `allocator_type`\
  \ || `string` || Sets the GPU allocation strategy |\n\n| `deferred_deletion_bytes`\
  \ || `int64` || Delays deletion to reduce driver processing |\n\n| `allow_growth`\
  \ || `bool` || Enables/disables pre-allocation of GPU memory |\n\n| `visible_device_list`\
  \ || `string` || Determines how GPU devices are mapped |\n\n| `polling_active_delay_usecs`\
  \ || `int32` || Configures the number of milliseconds that should elapse between\
  \ polling when active |\n\n| `polling_inactive_delay_msecs` || `int32` || Sets the\
  \ number of milliseconds between polling when inactive |\n\n| `force_gpu_compatible`\
  \ || `bool` || Forces tensors to be allocated in GPU's pinned memory |\n\n默认情况下，TensorFlow\
  \ 会为其操作预分配 GPU 的全部内存。但如果你将 `allow_growth` 设置为 `True`，TensorFlow 不会在预先分配任何内存。相反，它只会在必要时分配内存。\n\
  \n如果你将 `per_process_gpu_memory_fraction` 设置为小于 1 的值，TensorFlow 将预分配 GPU 可见内存的该比例。例如，以下代码配置会话使其为其操作预分配\
  \ GPU 内存的 80%：\n\n```\ngpu_opts = tf.GPUOptions( per_process_gpu_memory_fraction=0.8)\n\
  conf = tf.ConfigProto(gpu_options=gpu_opts)\nwith tf.Session(config=conf) as sess:\n\
  \ …\n```\n\n你可以通过减少 CPU 向 GPU 发送的命令数量来提高性能。其中一个频繁的命令涉及删除 GPU 内存中的对象。默认情况下，当对象占用超过数兆字节的存储时，CPU\
  \ 会告诉 GPU 删除对象。你可以通过将 `GPUOptions` 的 `deferred_deletion_bytes` 字段设置为所需的内存大小来自定义此行为。\n\
  \n##### Executing TensorFlow in a Cluster\n\n除了在 GPU 上运行操作外，你还可以编写在多台计算机上执行的分布式应用程序。我第一次遇到这个主题时发现它很难理解，所以我首先将其与一个更熟悉的主题进行比较：网页浏览。\n\
  \n当你浏览网页时，你的浏览器（客户端）向称为 *server* 的远程机器发送请求。准确地说，服务器是远程机器（服务器的主机）上的一个进程，该进程在特定端口监听请求。当你向\
  \ Web 服务器的主机和端口发送请求时，服务器会发送包含网页的响应。一个主机可以执行多个服务器，但每个服务器始终监听来自特定端口的消息。\n\n在分布式 TensorFlow\
  \ 应用程序中，客户端访问多个服务器，这些服务器可能运行在单独的系统或同一系统上。与 Web 服务器一样，每个 TensorFlow 服务器都监听发往特定主机和端口的消息。\n\
  \n每个服务器执行一个称为 *task* 的单一工作单元。相关任务的组形成一个 *job*。与应用程序关联的服务器集合称为 *cluster*。\n\n如果你熟悉这些术语（server、task、job、cluster），你将不会遇到编写分布式\
  \ TensorFlow 应用程序的困难。一般来说，开发过程需要三个步骤：\n\n1. **在 `ClusterSpec` 中定义应用程序的 jobs、tasks\
  \ 和 server 主机/端口。**\n2. **为集群中的每个服务器创建一个 `tf.train.Server`。**\n3. **为每个任务定义操作。**\n\
  \n如果你的集群在多台计算机上执行，你不必为每台计算机重写应用程序。只需编写一次应用程序并向每个系统传递不同的命令行参数即可。或者，你可以使用 Kubernetes\
  \ 等集群管理器来管理集群并自动定义服务器和任务。\n\n###### Creating a ClusterSpec\n\n集群规范定义了应用程序的 jobs\
  \ 和 tasks 并将每个任务与服务器的网络地址关联。集群规范由 `tf.train.ClusterSpec` 的实例表示。类构造函数接受一个参数，该参数可以采用三种形式之一：\n\
  \n* 将作业名称与网络地址列表关联的 dict\n* 将作业名称与将任务编号与网络地址关联的 dict 关联的 dict\n* 现有的 `ClusterDef`\
  \ 协议缓冲区\n\n本讨论侧重于前两种形式。例如，假设你希望你的集群在两个作业中执行任务。第一个作业 `j1` 有一个任务，第二个作业 `j2` 有两个任务。你可以用以下\
  \ `ClusterSpec` 定义你的集群：\n\n```\nspec = tf.train.ClusterSpec({\n 'j1': ['sys1.ex.com:121'],\n\
  \ 'j2': ['sys2.ex.com:122', 'sys3.ex.com:123']})\n```\n\n对于每个网络地址，你需要提供主机名，例如 `sys1.ex.com`，和端口，例如\
  \ `123`。TensorFlow 为 `ClusterSpec` 中的每个网络地址创建一个任务，并根据其在作业列表中的顺序为每个任务分配一个编号。在前面的示例中，TensorFlow\
  \ 将任务 0 分配给 `sys1.ex.com`，将任务 0 分配给 `sys2.ex.com`，并将任务 1 分配给 `sys3.ex.com`。\n\n\
  你可以通过将每个作业名称与将整数与地址关联的 dict 关联来分配自己的任务编号：\n\n```\nspec = tf.train.ClusterSpec({\n\
  \ 'j1': {3: 'sys1.ex.com:121'},\n 'j2': {2: 'sys2.ex.com:122',\n 1: 'sys3.ex.com:123'}})\n\
  ```\n\n为简单起见，本书中的 `ClusterSpec` 允许 TensorFlow 自动设置任务索引。\n\n###### Creating a server\n\
  \n在将应用程序的计算拆分为任务后，你需要创建服务器来执行这些任务。你可以通过调用 `tf.train.Server` 构造函数来创建服务器：\n\n```\n\
  tf.train.Server(server_or_cluster_def, job_name=None, task_index=None, protocol=None,\
  \ config=None, start=True)\n```\n\n你可以将第一个参数设置为 `ServerDef`，它是一个定义服务器运行环境的协议缓冲区。但大多数应用程序将第一个参数分配给\
  \ `ClusterSpec`。为了告诉服务器它打算执行哪个任务，你需要设置 `job_name` 和 `task_index` 参数。例如，以下代码创建了一个服务器来执行名为\
  \ `j2` 的作业的任务 1：\n\n```\nserver = tf.train.Server(spec, job_name='j2', task_index=1)\n\
  ```\n\n构造函数的 `protocol` 参数标识 `Server` 将用于接收任务的通信机制。在撰写本文时，唯一接受的协议是 `grpc`，它标识 gRPC\
  \ 协议。这是 Google 的远程过程调用（RPC）免费实现，你可以通过访问 [`http://grpc.io`](http://grpc.io) 了解有关\
  \ gRPC 的更多信息。\n\n`config` 参数接受一个 `ConfigProto`，用于配置在服务器上运行的所有会话。我在章节开头介绍了 `ConfigProto`\
  \ 及其众多字段，位于 “Configuring a new session” 部分。\n\n`start` 参数标识服务器是否应在创建后立即启动。如果你将此参数设置为\
  \ `True`，服务器将在创建后开始处理任务。如果你将其设置为 `False`，你可以稍后通过调用其 `start` 方法来启动服务器。\n\n######\
  \ Specifying jobs and tasks\n\n在定义集群并创建服务器后，你需要为集群的任务提供代码。你不需要为每个任务编写单独的程序。相反，大多数开发人员编写一个程序并将其代码分区，以便不同部分由不同任务执行。\n\
  \n\n\n\n\n你可以通过调用前面 “将操作分配给设备” 部分中讨论的 `tf.device` 函数，将代码与特定任务关联起来。例如，以下代码仅在 Job\
  \ `j1` 的 Task 0 上执行：\n\n```\nwith tf.device('/job:j1/task:0'):\n  const_a = tf.constant(3.6)\n\
  \  const_b = tf.constant(1.2)\n  total = const_a + const_b\n```\n\n你也可以使用 `if` 语句对代码进行分区：\n\
  \n```\nif job_name == 'j1' and task_num == 0:\n  …\nelif job_name == 'j1' and task_num\
  \ == 1:\n  …\n```\n\n在定义集群时，你可以创建任意数量的 jobs 和 tasks。但许多分布式 TensorFlow 应用只有两个 jobs：\n\
  \n* **参数服务器 (`ps`):** 存储应用程序的变量\n* **工作副本 (`worker`):** 执行应用程序的计算，包括更新变量的处理\n\n\
  你可以用如下代码在集群规范中定义这些 jobs：\n\n```\nspec = tf.train.ClusterSpec({'ps': [..], 'worker':\
  \ [..]})\n```\n\n本节介绍参数服务器和 worker，并展示如何在代码中创建它们。\n\n###### 参数服务器\n\n在分布式应用中，TensorFlow\
  \ 认识到在同一设备上同名的变量代表相同的数据。也就是说，如果 Tasks X 和 Y 都操作名为 `weight_var` 的变量，TensorFlow 就理解它们应该访问同一个\
  \ `weight_var` 变量。这些任务在不同的进程中运行，因此 TensorFlow 会在进程之间复制变量。\n\n*参数服务器*（PS）充当存储、保存和检索变量的中央位置。在许多应用中，PS\
  \ 任务只需声明变量，然后在应用程序完成前阻塞即可。为了演示这一点，以下代码定义了一个参数服务器，它声明了两个变量 `weights` 和 `biases`，然后在应用程序完成前阻塞。\n\
  \n```\nserver = tf.train.Server(cluster, job_name='ps', task_index=0)\nif job_name\
  \ == 'ps':\n  weights = tf.Variable(…)\n  biases = tf.Variable(…)\n  server.join()\n\
  ```\n\n参数服务器声明 `weights` 和 `biases` 之后，其他任务可以访问这些变量并按需更新它们。`join` 方法告诉服务器无限期阻塞。\n\
  \n###### Workers\n\n一般来说，执行计算的任何 job 都被视为 *worker job*。worker job 中的每个任务称为 *worker\
  \ replica* 或简称 *worker*。为了执行其计算，每个 worker 都需要创建并启动一个 session。\n\n这就产生了一个问题：你不能在分布式应用中创建常规\
  \ session。你需要在适当的 server 进程中运行每个 session。要理解如何在 server 中运行 session，你需要熟悉 server\
  \ targets。\n\n正如 Web 服务器使用 HTTP 进行通信一样，TensorFlow 服务器使用 gRPC 进行通信。每个服务器都有一个由其主机和端口决定的\
  \ gRPC 地址。例如，如果你配置一个服务器执行地址为 localhost:123 的任务，则服务器的 gRPC 地址将如下所示：\n\n```\ngrpc://localhost:123\n\
  ```\n\n此 gRPC 地址称为服务器的 *target*。你可以通过 `Server` 实例的 `target` 属性访问此 target。\n\n要创建在服务器内部运行的\
  \ session，你需要将 `tf.Session` 的第一个参数设置为服务器的 target。以下代码创建了一个 `Server`，然后创建了一个连接到它的\
  \ session：\n\n```\nserver = tf.train.Server(spec, job_name='worker', task_index=1)\n\
  with tf.Session(server.target) as sess:\n  …\n```\n\n这里有一个问题：如果分布式应用中的 worker 需要访问相同变量数据，变量如何初始化？参数服务器不能初始化其变量，因为它不运行\
  \ session。但如果每个 worker 单独初始化变量，TensorFlow 就无法在进程之间复制数据。\n\n答案是其中一个 worker 需要处理初始化，而其他\
  \ worker 需要等待初始化完成。处理初始化的 worker 称为 *chief*。你可以通过调用 `tf.train.MonitoredTrainingSession`\
  \ 在 session 中分配 chief 的操作。\n\n####### Workers and monitored sessions\n\n第 5 章 介绍了\
  \ session hooks 的有趣主题，并解释了如何将 hooks 与 `MonitoredSession` 关联。你可以通过调用一个名为 `tf.train.MonitoredTrainingSession`\
  \ 的函数为分布式应用配置 `MonitoredSession`：\n\n```\nMonitoredTrainingSession(master='', is_chief=True,\
  \ checkpoint_dir=None, scaffold=None, hooks=None, chief_only_hooks=None, save_checkpoint_secs=600,\
  \ save_summaries_steps=USE_DEFAULT, save_summaries_secs=USE_DEFAULT, config=None,\
  \ stop_grace_period_secs=120, log_step_count_steps=100)\n```\n\n此函数看起来像一个类构造函数，但它返回一个\
  \ `MonitoredSession`，而不是 `MonitoredTrainingSession`。如果 worker 以 `is_chief` 设置为 `True`\
  \ 调用此函数，`MonitoredSession` 将在启动时执行 session 的初始化。因此，只有 一个 worker（chief）应以 `is_chief`\
  \ 设置为 `True` 调用此函数。当其他 worker 调用此函数时，返回的 `MonitoredSession` 将等待 chief 的 session\
  \ 完成初始化。\n\n第一个参数 `master` 与 `Session` 构造函数中的 `target` 参数具有相同的目的。也就是说，它标识 intended\
  \ 运行 session 的 worker 的 gRPC 位置，例如 `grpc://localhost:123`。\n\n`MonitoredTrainingSession`\
  \ 函数接受通用 session hooks（`hooks`）和 intended 用于 chief session 的 session hooks（`chief_only_hooks`）。此外，该函数接受用于设置检查点和生成摘要数据的参数。通过设置这些参数，你无需创建\
  \ `CheckpointSaverHook` 或 `SummarySaverHook`。\n\n###### 运行一个简单的集群\n\n`ch11/cluster.py`\
  \ 模块中的代码提供了一个分布式 TensorFlow 应用的简单示例。该模块不执行任何机器学习，但演示了一组 worker 任务如何协同努力来更新一个变量。\n\
  \n具体来说，该应用程序创建了四个 worker 并用它们来近似 *π*。这种近似涉及将函数 y = (1 + x²)^(\\-1) 在 x 从 0 到 1 运行时下方矩形的面积相加，并将总和乘以\
  \ 4。在 图 11-1 中，图形将函数下方的面积划分为 30 个区域。\n\n![FIGURE 11-1: An application can approximate\
  \ π by splitting the area under the function into rectangles and adding the areas\
  \ together.](img/9788126592555-fg1101.png)\n\nFIGURE 11-1: An application can approximate\
  \ *π* by splitting the area under the function into rectangles and adding the areas\
  \ together.\n\n`ch11/cluster.py` 模块生成四个 worker 来执行近似。列表 11-1 展示了代码。\n\nLISTING 11-1\
  \ Approximating Pi in a Distributed Application\n\n```\n#### Session hook to print\
  \ output\nclass OutputHook(tf.train.SessionRunHook):\n\n  def before_run(self, run_context):\n\
  \    return tf.train.SessionRunArgs(pi_var)\n\n  def after_run(self, run_context,\
  \ run_values):\n    print('Pi approximation:', run_values.results)\n\n#### Define\
  \ a cluster with two jobs and five tasks\nspec = tf.train.ClusterSpec({'worker':\n\
  \  ['localhost:31415', 'localhost:31416', 'localhost:31417', 'localhost:31418']})\n\
  \n#### Perform task-dependent operations\nflags = tf.flags\nflags.DEFINE_string('task',\
  \ '', '')\nif not flags.FLAGS.task:\n\n  # Launch the worker processes\n  subprocess.Popen('python\
  \ cluster.py --task=0', stderr=subprocess.STDOUT)\n  subprocess.Popen('python cluster.py\
  \ --task=1', stderr=subprocess.STDOUT)\n```\n\n\n\n\n\n```python\nsubprocess.Popen('python\
  \ cluster.py --task=2', stderr=subprocess.STDOUT)\n\nsubprocess.Popen('python cluster.py\
  \ --task=3', stderr=subprocess.STDOUT)\n\n\nelse:\n    N = 10\n    num_workers =\
  \ float(spec.num_tasks('worker') - 1)\n    delta_x = float(1)/float(N * num_workers)\n\
  \    task_index = int(flags.FLAGS.task)\n\n    # Create server\n    server = tf.train.Server(spec,\
  \ job_name='worker', task_index=task_index)\n\n    with tf.device('/job:worker/task:0'):\n\
  \        pi_var = tf.Variable(0., dtype=tf.float32)\n\n    with tf.device('/job:worker/task:1'):\n\
  \        for i in range(N):\n            x_i = delta_x * (i * num_workers + 0.5)\n\
  \            pi_var += 4 * delta_x/(1 + x_i * x_i)\n\n    with tf.device('/job:worker/task:2'):\n\
  \        for i in range(N):\n            x_i = delta_x * (i * num_workers + 1.5)\n\
  \            pi_var += 4 * delta_x/(1 + x_i * x_i)\n\n    with tf.device('/job:worker/task:3'):\n\
  \        for i in range(N):\n            x_i = delta_x * (i * num_workers + 2.5)\n\
  \            pi_var += 4 * delta_x/(1 + x_i * x_i)\n\n    # Launch session\n   \
  \ output_hook = OutputHook()\n    with tf.train.MonitoredTrainingSession(master='grpc://localhost:31415',\n\
  \                                           is_chief=(task_index == 0), chief_only_hooks=[output_hook])\
  \ as sess:\n        sess.run(pi_var)\n```\n\n该模块定义了一个 `ClusterSpec` 并启动了四个进程——每个\
  \ worker 一个。每个 worker 进程接收一个不同的参数来标识其任务编号。worker 使用该任务编号来创建并启动一个服务器，其网络地址由 `ClusterSpec`\
  \ 确定。\n\n该模块调用 `tf.device` 将代码分配给四个 worker。第一个 worker 声明并初始化 `pi_var` 变量。其余 worker\
  \ 通过将函数 y = (1 + x²)^(-1) 下方十个矩形区域的面积相加来更新 `pi_var` 的值。\n\n每个 worker 都调用 `tf.train.MonitoredTrainingSession`\
  \ 并将其目标设置为第一个 worker 的地址。首席 worker 是任务索引为 0 的 worker，并且该 worker 的会话最先执行并初始化应用程序的变量。初始化完成后，其他\
  \ worker 执行会话并更新 `pi_var`。\n\n为了显示输出，该模块将会话与一个 `OutputHook` 关联。此会话钩子在会话执行完成后打印 `pi_var`\
  \ 的值。该模块将会话钩子与函数的 `chief_only_hooks` 参数关联，因此钩子仅适用于首席 worker 的会话。\n\n#### 第 12 章\n\
  \n#### 使用 Estimator 开发应用程序\n\n本章内容\n\n![check](img/check.png) **使用 estimator 执行机器学习算法**\n\
  \n![check](img/check.png) **定义特征和特征列**\n\n![check](img/check.png) **在实践中使用预构建的 estimator**\n\
  \n![check](img/check.png) **使用宽深度学习分析复杂数据集**\n\n从根本上说，使用统计回归进行机器学习的过程与使用神经网络的过程非常相似（参见\
  \ 第 7 章）：加载数据、训练模型并测试结果。不幸的是，在 TensorFlow 中执行统计回归所需的代码与创建神经网络所需的代码大不相同。\n\n为了简化开发和测试，TensorFlow\
  \ 提供了 Estimator 框架。`tf.estimator` 包包含通过一组通用方法分析数据的模块。例如，执行线性回归的 estimator 类（`LinearRegressor`）与执行深度神经网络回归的类（`DNNRegressor`）具有相同的方法。\n\
  \n你可以通过为自己的 estimator 编码来利用这种通用性。也就是说，如果你将自定义机器学习算法打包为 estimator，其他开发者将无需费力即可训练和测试你的应用程序。\n\
  \n##### 介绍 Estimator\n\n`tf.estimator` 包提供了分析数据的各种类，包括 `LinearClassifier` 和 `DNNClassifier`。这些类都扩展了\
  \ `Estimator` 类，其方法使得以算法无关的方式执行机器学习成为可能。\n\n在本书中，我使用术语 *estimator* 指代 `Estimator`\
  \ 类及其子类的实例。一般来说，使用 estimator 的过程包含六个步骤：\n\n1. **将数据加载到数据集。**\n2. **创建特征列，将数据集的字段与名称和数据类型关联。**\n\
  3. **使用特征列创建 estimator 类的实例。**\n4. **使用训练数据训练 estimator。**\n5. **使用测试数据评估 estimator\
  \ 的性能并检查结果。**\n6. **将 estimator 用于实际预测或分类。**\n\n步骤 3 取决于你感兴趣的 estimator 类型。你可以通过调用\
  \ `Estimator` 类的三个基本方法 `train`、`evaluate` 和 `predict` 来执行步骤 4、5 和 6。一旦你理解了这些方法，你就会对\
  \ estimator 有一个扎实的理解。\n\n##### 训练 Estimator\n\n在将数据加载到数据集并创建 estimator 之后，下一步是开始训练。每个\
  \ estimator 都支持 `train` 方法：\n\n`train(input_fn, hooks=None, steps=None, max_steps=None)`\n\
  \n`input_fn` 参数标识一个提供训练数据作为元组的函数。此元组包含两个数据元素：特征和标签。特征标识单个、完整的观测，例如 N 维空间中点的 N 个坐标。标签标识对应特征的类别，例如如果点代表成功则为\
  \ 1，如果点代表失败则为 0。\n\n为了标识特征，`input_fn` 提供一个将字符串与张量关联的字典。每个字符串标识张量中的数据。为演示如何设置 `input_fn`，以下函数提供了三个特征——每个点维度一个。\n\
  \n```python\ndef train_func():\n    features = {\n        'x-coords': tf.constant([[0.1],\
  \ [0.2]]),\n        'y-coords': tf.constant([[0.5], [0.6]]),\n        'z-coords':\
  \ tf.constant([[1.0], [1.1]])\n    }\n    labels = tf.constant([[0], [1]])\n   \
  \ return features, labels\n```\n\n这组特征由两个点组成：(0.1, 0.5, 1.0) 和 (0.2, 0.6, 1.1)。但由于数据的结构方式，代码可能看起来令人困惑。函数不是一次返回一个点，而是将所有\
  \ x 坐标放在第一个特征中，所有 y 坐标放在第二个特征中，所有 z 坐标放在第三个特征中。\n\n`input_fn` 返回的元组的第二部分是包含标签的张量。如果\
  \ estimator 的目的是分类，则标签代表类别。在前面的示例代码中，第一个点的标签为 0，第二个点的标签为 1。\n\n查看这段代码时，你可能会想知道名称\
  \ `x-coords`、`y-coords` 和 `z-coords` 从何而来。当你调用 estimator 的构造函数时，你需要为每个特征提供一个 *特征列*。特征列将名称，例如\
  \ `x-coords`，与特征中提供的数据类型关联。我将在即将到来的 “使用特征列” 部分讨论特征列这一迷人的主题。\n\n默认情况下，estimator 会一直训练直到损失接近于零。但你可以通过设置\
  \ `steps` 参数或 `max_steps` 参数来控制训练步数。区别在于 `steps` 参数是增量的，因此如果你现在想执行 30 步训练，后面再执行\
  \ 20 步训练，你可以先调用 `train` 并将 `steps` 设为 30。稍后，你可以调用 `train` 并将 `steps` 设为 20。\n\n\
  你可以通过将 `hooks` 参数设置为会话钩子的列表来监控训练过程。第 5 章 解释了会话钩子如何使监控会话执行成为可能。\n\n##### 测试 Estimator\n\
  \n\n\n\n\n在你创建并训练好估计器后，应该确保它能正常工作。测试估计器的目的就是 `evaluate` 方法：\n\n```\nevaluate(input_fn,\
  \ steps=None, hooks=None, checkpoint_path=None, name=None)\n```\n\n`evaluate` 的参数与\
  \ `train` 类似。与 `train` 一样，`input_fn` 函数提供一个包含特征和标签的元组。唯一的区别是，这些特征和标签代表测试数据而不是训练数据。\n\
  \n`checkpoint_path` 参数标识方法应存储其输出的目录。如果你将此参数设为 `None`，方法将使用估计器构造函数的 `model_dir` 参数。如果你不设置此参数，方法将把其输出存储在临时目录中。\n\
  \n`evaluate` 以 dict 的形式返回测试结果，其内容取决于估计器的模型。TensorFlow 的文档没有列出此 dict 的任何必需键，但我使用过的每个估计器都提供了以下内容：\n\
  * `accuracy`：正确预测的百分比\n* `loss`：模型预测与实际结果之间的差异\n* `average_loss`：loss 的平均值\n\n除了这些指标外，`evaluate`\
  \ 返回的 dict 还包含全局步长的数值。应用程序可通过 `global_step` 键访问此值。\n\n##### 运行一个估计器\n\n在你训练并测试估计器并且对测试结果满意后，就是展示时间了！你可以通过调用\
  \ `predict` 使用真实世界的数据点执行估计器：\n\n```\npredict(input_fn, predict_keys=None, hooks=None,\
  \ checkpoint_path=None)\n```\n\n与 `train` 和 `evaluate` 一样，`predict` 接受一个函数作为其第一个参数。但与提供包含特征和标签的元组不同，此函数仅返回特征。即，`input_fn`\
  \ 返回一个字典，将字符串（特征列的名称）映射到张量。这些张量包含你真实世界应用的数据点。\n\n`predict` 以 dict 的形式返回估计器的预测，该\
  \ dict 将名称映射到值。如果设置了 `checkpoint_path`，方法将把其输出文件存储在给定目录中。\n\n##### 创建输入函数\n\n`train`、`evaluate`\
  \ 和 `predict` 方法都需要将输入函数作为第一个参数。`tf.estimator.inputs` 中的两个函数简化了编码此输入函数的过程：\n* `numpy_input_fn`：接受\
  \ NumPy 数组并返回一个提供 `features`/`target` 元组的函数\n* `pandas_input_fn`：接受 pandas `DataFrame`\
  \ 并返回一个提供 `features`/`target` 元组的函数\n\n`numpy_input_fn` 的签名如下所示：\n\n```\nnumpy_input_fn(x,\
  \ y=None, batch_size=128, num_epochs=1, shuffle=None, queue_capacity=1000, num_threads=1)\n\
  ```\n\n`x` 参数标识特征，`y` 参数为每个特征提供标签。`shuffle` 参数标识是否应打乱特征和标签。调用此函数时，你必须将 `shuffle`\
  \ 设为 `True` 或 `False`。\n\n你必须将 `x` 和 `y` 参数设为 NumPy 数组，并且可以通过调用 第 10 章 中讨论的 `load_csv_with_header`\
  \ 或 `load_csv_without_header` 函数从 CSV 文件加载这些数组。以下代码将 `load_csv_with_header` 的特征数据传递给\
  \ `numpy_input_fn`：\n\n```\ndataset = tf.contrib.learn.datasets.base.\nload_csv_with_header(filename='example.csv',\
  \ target_dtype=np.int32, features_dtype=np.float32)\n...\ninput_fn = tf.estimator.inputs.numpy_input_fn(\
  \ x={'column': np.array(dataset.data)}, y=np.array(dataset.target), shuffle=True,\
  \ num_epochs=1000)\n```\n\n`num_epochs` 参数对于训练尤其重要，因为它定义了会话将执行的 epoch 数。对于评估和预测，你应将\
  \ `num_epochs` 设为 1。\n\npandas 工具集将数据存储在 `DataFrame` 中。你可以通过调用 `pandas_input_fn`\
  \ 从 `DataFrame` 创建输入函数：\n\n```\npandas_input_fn(x, y=None, batch_size=128, num_epochs=1,\
  \ shuffle=None, queue_capacity=1000, num_threads=1, target_column='target')\n```\n\
  \n此函数的参数几乎与 `numpy_input_fn` 相同。唯一的区别是 `target_column` 参数，它标识包含目标（标签）数据的列。\n\n######\
  \ 配置一个估计器\n\n每个估计器类的构造函数都接受一个名为 `config` 的参数。通过将其设为 `tf.contrib.learn.RunConfig`，你可以配置估计器操作的许多方面，例如何时保存变量和生成摘要数据。\n\
  \n你可以通过调用其构造函数创建 `RunConfig`。表 12-1 列出了构造函数的参数。\n\nTABLE 12-1 RunConfig 构造函数的参数\n\
  \n| **Parameter** || **Default** || **Description** |\n| --- | --- | --- |\n| `master`\
  \ || `None` || Target for running the estimator |\n| --- | --- | --- |\n| `num_cores`\
  \ || `0` || Number of cores to use |\n| `log_device_placement` || `False` || Bool\
  \ that identifiers whether the estimator should print which device(s) it runs on\
  \ |\n| `gpu_memory_fraction` || `1` || Fraction of GPU memory to be used by the\
  \ estimator |\n| `tf_random_seed` || `None` || Random seed for initializers |\n\
  | `save_summary_steps` || `100` || Number of steps to wait before saving summaries\
  \ |\n| `save_checkpoints_secs` || `600` || Number of seconds to wait before saving\
  \ checkpoints |\n| `save_checkpoints_steps` || `--` || Number of steps to wait before\
  \ saving checkpoints |\n| `keep_checkpoint_max` || `5` || Maximum number of checkpoint\
  \ files to store |\n| `keep_checkpoint_every_n_hours` || `10000` || Number of hours\
  \ between each checkpoint to be saved |\n| `log_step_count_steps` || `100` || Number\
  \ of steps between logging of the global step per second |\n| `evaluation_master`\
  \ || `''` || The gRPC target for evaluating the estimator |\n| `model_dir` || `None`\
  \ || Directory to save graph and model parameters |\n| `session_config` || `None`\
  \ || The ConfigProto used to configure the estimator's session |\n\n如 第 11 章 中所述，分布式应用程序依赖\
  \ gRPC 在远程服务器上执行会话。`master` 参数标识估计器的 gRPC 目标，而 `evaluation_master` 参数标识评估目标。如果你不设置这些参数，估计器将在本地运行。如果你将\
  \ `num_cores` 保持为 0，系统将使用目标处理器上的每个核心。\n\n`model_dir` 标识估计器应保存其数据的<|message|>。其他大部分字段指定数据应保存的频率。要指定何时保存检查点数据，你可以设置\
  \ `save_checkpoint_steps` 或 `save_checkpoint_secs`，但不能同时设置两者。\n\n`session_config`\
  \ 参数定义估计器底层会话的属性。要配置会话，你需要将此参数分配给 `ConfigProto` 缓冲区，而 第 11 章 介绍了其字段。\n\n##### 使用特征列\n\
  \n应用程序使用类似于数据库表的结构向估计器提供特征。在数据库表中，每个列标识一个特定字段（`First name`、`Age` 等），并且列中的每个值具有相同的数据类型。每行包含单个记录的所有信息。\n\
  \n在 TensorFlow 应用程序中，特征列的作用与数据库表中的列标题相同。即，它为列的数据提供名称并指示列值的<|message|>。特征列在此讨论中发挥重要作用，因为每个估计器类的构造函数都需要一个或多个特征列。\n\
  \n`tf.feature_column` 包提供了一系列表示特征列的类。它们都扩展了 `_FeatureColumn` 类，而 图 12-1 展示了类层次结构。\n\
  \n\n\n\n\n![图 12-1：TensorFlow 的特征列类决定了列中值的 数据类型。](img/9788126592555-fg1201.png)\n\
  \n图 12-1： TensorFlow 的特征列类决定了列中值的 数据类型。\n\n`_DenseColumn` 标识来自稠密张量的数据，而 `_CategoricalColumn`\
  \ 标识可以以类别形式表达的数据。也就是说，如果一个列需要存储可以表示为枚举类型的值，例如方向（`NORTH`、`SOUTH`、`EAST`、`WEST`），你应该创建一个\
  \ `_CategoricalColumn` 的子类。对于所有其他类型的数据，你应该创建一个 `_DenseColumn` 的子类。\n\n`tf.estimator`\
  \ 包包含 图 12-1 中的类，但创建实例所需的函数位于 `tf.feature_column` 包中。 表 12-2 列出了其中八个函数并描述了函数创建的特征列的内容。\n\
  \nTABLE 12-2 创建特征列的函数\n\n| **Function** || **Column Content** |\n| --- | --- |\n\
  | `numeric_column(key, shape=(1,), default_value=None, dtype=tf.float32, normalizer_fn=None)`\
  \ || 实值和其他数字 |\n| --- | --- |\n| `categorical_column_with_identity(key, num_buckets,\
  \ default_value=None)` || 由唯一整数表示的类别 |\n| `categorical_column_with_hash_bucket(key,\
  \ hash_bucket_size, dtype=tf.string)` || 由哈希整数或字符串表示的类别 |\n| `categorical_column_with_vocabulary_list(key,\
  \ vocabulary_list, dtype=None, default_value=-1, num_oov_buckets=0)` || 通过与字符串或整数关联的整数\
  \ ID 列表访问的类别 |\n| `categorical_column_with_vocabulary_file(key, vocabulary_file,\
  \ vocabulary_size, num_oov_buckets=0, default_value=None, dtype=tf.string)` || 通过将整数\
  \ ID 与字符串或整数关联的文件访问的类别 |\n| `bucketized_column(source_column, boundaries)` || 根据不同范围离散化的数值列的值\
  \ |\n| `indicator_column(categorical_column)` || 将分类列转换为稠密列 |\n| `embedding_column(\
  \ categorical_column, dimension, combiner='mean', initializer=None, ckpt_to_load_from=None,\
  \ tensor_name_in_ckpt=None, max_norm=None, trainable=True)` || 将稀疏分类列转换为稠密列 |\n\n\
  这些函数中的每一个都接受一个 `key` 来标识列的数据。你可以将此键视为数据库表中列的名称。估计器通过 `train`、`evaluate` 和 `predict`\
  \ 的输入函数接收列的数据。如 “Introducing Estimators” 部分所述，函数张量的第一部分是一个字典，它将特征列的名称与张量关联起来。\n\n\
  数值列几乎是 trivially 容易处理的。默认数据类型是 `tf.float32`，默认形状是 `(1)`。因此，以下代码返回一个包含单个浮点值的 `_NumericColumn`：\n\
  \n```\ntemp = numeric_column('temp')\n```\n\n在分类列中，最简单的是 `_IdentityCategoricalColumn`，它可以通过调用\
  \ `categorical_column_with_identity` 创建。此列包含表示类别的整数。`num_buckets` 参数决定类别的数量，因此以下代码创建一个\
  \ `_IdentityCategoricalColumn`，其元素可以取 0 到 11 之间的任意值：\n\n```\nmonth = categorical_column_with_identity('month',\
  \ num_buckets=12)\n```\n\n如果你的应用程序使用字符串标识类别，为每个类别提供唯一的整数可能很不方便。在这种情况下，你可以调用 `categorical_column_with_hash_bucket`，它使用哈希函数为字符串或整数数据生成\
  \ ID 值。以下代码创建了一个具有 195 个类别的 `_HashedCategoricalColumn`：\n\n```\nnation = categorical_column_with_hash_bucket('nation',\
  \ num_buckets=195)\n```\n\n与其使用哈希函数，你可能更简单地列出类别的不同值。然后特征列将为类别确定自己的 ID。你可以通过调用 `categorical_column_with_vocabulary_list`\
  \ 来实现。例如，以下代码创建一个 `_VocabularyListCategoricalColumn`，为 `vocabulary_list` 参数中的七个字符串中的每一个创建一个类别：\n\
  \n```\nday_of_the_week = categorical_column_with_vocabulary_list (key='day', vocabulary_list=('Monday',\
  \ 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'))\n```\n\n\
  `categorical_column_with_vocabulary_file` 函数类似于 `categorical_column_with_vocabulary_list`，但你将词汇表的元素提供在文件中。如果你将字段分配给未定义的值，函数将字段分配给\
  \ `default_value`（如果参数已定义）。如果 `default_value` 未定义并且应用程序将值分配给 `num_oov_buckets`，函数将根据需要创建额外的类别。\n\
  \n如果需要根据范围将数字放入类别中，可以调用 `bucketized_column`。此函数接受一个 `_NumericColumn` 和一个范围的列表/元组。作为示例，以下代码根据温度范围列表对\
  \ `temp_column` 的值进行分类：\n\n```\nboundaries = [-273.15, 0., 100.]\ntemp_state = bucketized_column(temp_column,\
  \ boundaries)\n```\n\n如果 `boundaries` 参数包含 N 个值，`bucketized_column` 将创建 N+1 个值范围。在示例中，第一个范围从负无穷大运行到\
  \ -273.15，第二个范围从 -273.15 运行到 0.0，第三个范围从 0.0 运行到 100.0，第四个范围从 100.0 运行到无穷大。\n\n许多操作，如\
  \ DNN 分析，只能在稠密列中的数据上执行。出于这个原因，TensorFlow 提供了 `indicator_column` 和 `embedding_column`，它们将分类列转换为稠密列。`indicator_column`\
  \ 更简单，并将类别值转换为多热值。例如，如果列的类别值从 0 运行到 3 并且特征的值为 2，`indicator_column` 将此值转换为 \\[0,\
  \ 0, 1, 0\\]。\n\n`embedding_column` 在创建稠密列时为你提供更大的灵活性。如果你的类别 ID 包含多个值，`embedding_column`\
  \ 的 `combiner` 参数决定应如何组合这些值。目前，你可以将其设置为 `mean`、`sqrtn` 和 `sum`。默认的 combiner 是 `mean`，这表明函数通过计算分类值的平均值来计算稠密值。\n\
  \n##### 创建和使用估计器\n\n`tf.estimator` 包提供了六个具体的估计器类，你可以在应用程序中实例化它们：\n\n* `LinearClassifier`：使用线性模型对数据点进行分类\n\
  * `LinearRegressor`：使用线性模型进行预测\n* `DNNClassifier`：使用深度神经网络对数据点进行分类\n* `DNNRegressor`：使用深度神经网络进行预测\n\
  * `DNNLinearCombinedClassifier`：使用线性模型和深度神经网络对数据点进行分类\n* `DNNLinearCombinedRegressor`：使用线性模型和深度神经网络进行预测\n\
  \n每个估计器使用特定方法执行特定类型的任务。回归器进行预测，分类器将数据点放入类别中。一些估计器使用线性建模，一些使用深度神经网络，最后两个估计器同时使用两者。\n\
  \n如果你不确定回归器和分类器之间的区别，请记住来自 第 10 章 的 Iris 和 Boston 数据集。Iris 数据集将物理特征与鸢尾花类型关联，因此涉及此数据集的问题需要分类器。Boston\
  \ 数据集将位置特征与房屋价格关联，因此涉及此数据集的问题需要回归器。\n\n\n\n\n\n我不会详细探讨这六个类中的全部。相反，我专注于三个：`LinearRegressor`、`DNNClassifier`\
  \ 和 `DNNLinearCombinedClassifier`。在每种情况下，我都会解释如何创建和训练估计器，然后使用它来进行预测。\n\n![technicalstuff](img/technicalstuff.png)TensorFlow\
  \ 提供的估计器类远不止我列出的六个。`tf.contrib.learn` 包提供了一些估计器类，包括 `DynamicRnnEstimator`、`LogisticRegressor`\
  \ 和 `SVM`。\n\nEstimator API 使编写自己的估计器变得简单。除了实现 `train`、`evaluate` 和 `predict` 方法之外，你还需要设置估计器的模型以及它用于计算损失的方法。\n\
  \n###### 线性回归器\n\n第 6 章 解释了统计学家如何使用线性回归通过拟合一条线来分析数据趋势。数学上，线性回归将 `mx + b` 设为其模型，并使用均方误差计算损失。训练的目标是确定\
  \ `m` 和 `b` 的哪些值能使直线与观测数据之间的距离最小化。\n\nTensorFlow 的估计器类中最简单的是 `LinearRegressor`，它执行相同的操作。其构造函数如下所示：\n\
  \n`LinearRegressor(feature_columns, model_dir=None, label_dimension=1, weight_column=None,\
  \ optimizer='Ftrl', config=None, partitioner=None)`\n\n唯一必需的参数是 `feature_columns`，它接受一个\
  \ `_FeatureColumn` 列表来标识估计器的数据。`model_dir` 参数告诉估计器应将输出存储在何处，例如事件文件和检查点。如果不设置 `model_dir`，估计器将使用临时目录代替。\n\
  \n估计器的 `train` 函数期望一个返回特征和标签元组的函数。在大多数应用中，标签由单个值组成，例如类别编号。但如果你的估计器需要多值目标，你可以通过设置\
  \ `label_dimension` 参数来配置它。\n\n如果设置 `weight_column` 参数，估计器会创建一个额外的列，为每个特征分配权重。`train`\
  \ 和 `evaluate` 的输入函数必须为此列提供值。估计器将特征的损失乘以此权重，因此权重越高，损失越高，这意味着估计器在优化过程中会采取更大的步长。\n\
  \n如果你查看本书示例代码中 `ch12` 文件夹，你会看到它包含两个名为 `lin_reg.csv` 和 `lin_reg.py` 的文件。第一个文件定义了一系列二维点。其前五行如下所示：\n\
  \n```\n20,1\n0.5,0.25\n1.0,0.2\n1.4,0.25\n0.75,0.5\n```\n\n此标题说明该文件包含 20 个特征，每个特征由单个值组成。每个特征值标识一个点的\
  \ x 坐标，目标标识该点的 y 坐标。图 12-2 以图形方式说明了这些点。虚线是最佳拟合数据的直线，其方程为 `y = 0.76x – 0.22`。\n\n\
  ![FIGURE 12-2: A LinearRegressor finds the slope and y-intercept of the line that\
  \ best fits a set of points.](img/9788126592555-fg1202.png)\n\n图 12-2： `LinearRegressor`\
  \ 找到最适合一组点的直线的斜率和 y 截距。\n\n要分析 `ch12/lin_reg.csv` 中的点，`ch12/lin_reg.py` 代码会创建一个数据集并将其数据馈送给\
  \ `LinearRegressor`。列表 12-1 展示了代码。\n\n列表 12-1 使用估计器进行线性回归\n\n```\n#### Read dataset\
  \ from CSV file\ndataset = tf.contrib.learn.datasets.base.load_csv_with_header(\n\
  \ filename='lin_reg.csv', target_dtype=np.float32,\n features_dtype=np.float32,\
  \ target_column=1)\n\n#### Create feature column containing x-coordinates\ncolumn\
  \ = tf.feature_column.numeric_column('x', shape=[1])\n\n#### Create the LinearRegressor\n\
  lin_reg = tf.estimator.LinearRegressor([column])\n\n#### Train the estimator\ntrain_input\
  \ = tf.estimator.inputs.numpy_input_fn(\n x={'x': np.array(dataset.data)},\n y=np.array(dataset.target),\
  \ shuffle=True, num_epochs=50000)\nlin_reg.train(train_input)\n\n#### Make two predictions\n\
  predict_input = tf.estimator.inputs.numpy_input_fn(\n x={'x': np.array([1.9, 1.4],\
  \ dtype=np.float32)},\n num_epochs=1, shuffle=False)\nresults = lin_reg.predict(predict_input)\n\
  \n#### Display the results\nfor value in results:\n print(value['predictions'])\n\
  ```\n\n由于问题很简单，我决定不评估估计器。相反，该模块直接从 `train` 进入 `predict`。`predict` 方法以生成器形式提供结果，生成\
  \ dict。此代码遍历 dict 并打印与 `predictions` 键关联的值。\n\n`LinearRegressor` 的结果接近预期结果。在 x =\
  \ 1.9 时，y 的正确值为 1.22，估计器产生的结果为 1.20。在 x = 1.4 时，y 的正确值为 0.84，估计器产生的结果为 0.86。\n\n\
  ###### DNN 分类器\n\n`DNNClassifier` 使用深度神经网络将数据点分配到类别。其构造函数与 `LinearRegressor` 非常相似，但包含定义神经网络结构的额外参数：\n\
  \n`DNNClassifier(hidden_units, feature_columns, model_dir=None, n_classes=2, weight_column=None,\
  \ label_vocabulary=None, optimizer='Adagrad', activation_fn=tf.nn.relu, dropout=None,\
  \ input_layer_partitioner=None, config=None)`\n\n`hidden_units` 参数设置神经网络的大小和形状。对于张量的每个元素，构造函数为网络创建一个隐藏层。张量中每个元素的值设置对应隐藏层中的节点数。\n\
  \n例如，如果将 `hidden_units` 设置为 `[16, 32]`，网络将包含两个隐藏层。第一层将包含 16 个节点，第二层将包含 32 个节点。这些节点是全连接的，因此网络将每个节点的输出连接到下一层的每个节点。\n\
  \n`n_classes` 和 `label_vocabulary` 参数告诉分类器有关应用的类别的信息，并且你会在所有分类器中找到这些参数。`n_classes`\
  \ 设置类别数，`label_vocabulary` 为类别提供一组名称。如果设置 `label_vocabulary`，请确保在 `train` 和 `evaluate`\
  \ 的输入函数中使用类别名称。\n\n`ch12/dnn_class.py` 模块演示了如何创建 `DNNClassifier` 并使用它对数据点进行分类。它从\
  \ `mnist_train.tfrecords` 加载 MNIST 训练数据，并从 `mnist_test.tfrecords` 加载测试数据。列表 12-2\
  \ 展示了代码。\n\n列表 12-2 使用 DNN 分类器对 MNIST 图像进行分类\n\n```\n#### Constants\nimage_dim =\
  \ 28\nnum_labels = 10\nbatch_size = 80\nnum_steps = 8000\nhidden_layers = [128,\
  \ 32]\n\n#### Function to parse MNIST TFRecords\ndef parser(record):\n features\
  \ = tf.parse_single_example(record,\n features={\n 'images': tf.FixedLenFeature([],\
  \ tf.string),\n 'labels': tf.FixedLenFeature([], tf.int64),\n })\n image = tf.decode_raw(features['images'],\
  \ tf.uint8)\n image.set_shape([image_dim * image_dim])\n image = tf.cast(image,\
  \ tf.float32) * (1. / 255) - 0.5\n label = features['labels']\n return image, label\n\
  \n#### Create the DNNClassifier\ncolumn = tf.feature_column.numeric_column('pixels',\n\
  \ shape=[image_dim * image_dim])\ndnn_class = tf.estimator.DNNClassifier(hidden_layers,\
  \ [column],\n model_dir='dnn_output', n_classes=num_labels)\n\n#### Train the estimator\n\
  def train_func():\n dataset = tf.data.TFRecordDataset('mnist_train.tfrecords')\n\
  ```\n\n\n\n\n\n```python\ndataset = dataset.map(parser).repeat().batch(batch_size)\n\
  \nimage, label = dataset.make_one_shot_iterator().get_next()\n\nreturn {'pixels':\
  \ image}, label\n\ndnn_class.train(train_func, steps=num_steps)\n```\n\n#### Test\
  \ the estimator\n\n```python\ndef test_func():\n    dataset = tf.data.TFRecordDataset('mnist_test.tfrecords')\n\
  \    dataset = dataset.map(parser).batch(batch_size)\n    image, label = dataset.make_one_shot_iterator().get_next()\n\
  \    return {'pixels': image}, label\n\nmetrics = dnn_class.evaluate(test_func)\n\
  ```\n\n#### Display metrics\n\n```python\nprint('\\nEvaluation metrics:')\nfor key,\
  \ value in metrics.items():\n    print(key, ': ', value)\n```\n\nThis module creates\
  \ a feature column and uses it to construct a `DNNClassifier`. It sets the estimator's\
  \ `hidden_units` parameter to `[128, 32]`, which means the classifier has two hidden\
  \ layers with 128, and 32 hidden units, respectively. It sets the `n_classes` parameter\
  \ to 10 because each MNIST image can fall into one of ten categories. The `label_vocabulary`\
  \ parameter isn't set, so the classifier assumes that the labels will be provided\
  \ as integers from 0 to 9.\n\nAfter training and evaluation, the module prints the\
  \ keys and values of dict returned by `evaluate`. On my system, these results are\
  \ given as follows:\n\n```\nEvaluation metrics:\naccuracy : 0.9595\naverage_loss\
  \ : 0.129958\nloss : 10.3966\nglobal_step : 8000\n```\n\n###### Combined linear-DNN\
  \ classifiers\n\nIf the linear estimators and DNN estimators don’t meet your requirements,\
  \ you can create an estimator that uses both learning methods. TensorFlow provides\
  \ two such estimators: the `DNNLinearCombinedRegressor` and the `DNNLinearCombinedClassifier`.\
  \ This discussion focuses on the `DNNLinearCombinedClassifier`.\n\nBefore proceeding,\
  \ I'd like to clarify some terminology. This estimator’s name includes “Linear,”\
  \ but it doesn’t perform line fitting. Despite its name, a linear classifier relies\
  \ on logistic regression, not linear regression, to do its job. Chapter 6 fearlessly\
  \ explores the topics of linear and logistic regression.\n\nTo determine which category\
  \ a point belongs to, a TensorFlow linear classifier relies on the softmax function.\
  \ If j is one of N categories, this function is given as follows:\n\n![images](img/eq12001.png)<m:math\
  \ xmlns:m=\"http://www.w3.org/1998/Math/MathML\"><m:mrow><m:mi>&#963;</m:mi><m:msub><m:mrow><m:mrow><m:mo>(</m:mo><m:mrow><m:mi>f</m:mi><m:mrow><m:mo>(</m:mo><m:mi>x</m:mi><m:mo>)</m:mo></m:mrow></m:mrow><m:mo>)</m:mo></m:mrow></m:mrow><m:mi>j</m:mi></m:msub><m:mo>=</m:mo><m:mfrac><m:mrow><m:msup><m:mi>e</m:mi><m:mrow><m:mi>f</m:mi><m:msub><m:mrow><m:mrow><m:mo>(</m:mo><m:mi>x</m:mi><m:mo>)</m:mo></m:mrow></m:mrow><m:mi>j</m:mi></m:msub></m:mrow></m:msup></m:mrow><m:mrow><m:mstyle\
  \ displaystyle=\"true\"><m:munderover><m:mo>&#8721;</m:mo><m:mrow><m:mi>i</m:mi><m:mo>=</m:mo><m:mn>0</m:mn></m:mrow><m:mrow><m:mi>N</m:mi><m:mo>&#45;</m:mo><m:mn>1</m:mn></m:mrow></m:munderover><m:mrow><m:msup><m:mi>e</m:mi><m:mrow><m:mi>f</m:mi><m:msub><m:mrow><m:mrow><m:mo>(</m:mo><m:mi>x</m:mi><m:mo>)</m:mo></m:mrow></m:mrow><m:mi>i</m:mi></m:msub></m:mrow></m:msup></m:mrow></m:mstyle></m:mrow></m:mfrac></m:mrow></m:math>\n\
  \nA classifier is linear if `f(x)` is a linear combination of `x`, as in `mx + b`.\
  \ To determine loss, a linear classifier computes cross entropy.\n\nA `DNNLinearCombinedClassifier`\
  \ combines a linear classifier and a DNN classifier. You can create an instance\
  \ of this classifier by calling its constructor:\n\n```python\nDNNLinearCombinedClassifier(model_dir=None,\
  \ linear_feature_columns=None, linear_optimizer='Ftrl', dnn_feature_columns=None,\
  \ dnn_optimizer='Adagrad', dnn_hidden_units=None, dnn_activation_fn=tf.nn.relu,\
  \ dnn_dropout=None, n_classes=2, weight_column=None, label_vocabulary=None, input_layer_partitioner=None,\
  \ config=None)\n```\n\nIt’s important to see that the constructor accepts separate\
  \ feature columns for linear classification (`linear_feature_columns`) and DNN classification\
  \ (`dnn_feature_columns`). This separation indicates that the linear classifier\
  \ and DNN classifier process different features.\n\nGoogle Research has given a\
  \ special name to the process of combining linear classification and DNN classification:\
  \ *wide and deep learning*.\n\n###### Wide and deep learning\n\nThe ultimate goal\
  \ of deep learning is to derive general principles from a body of data. I want my\
  \ stock-picking application to derive general principles that will pick tomorrow's\
  \ stocks based on yesterday’s results. I want my medical application to derive general\
  \ principles that will accurately classify health conditions in new patients based\
  \ on records of existing patients.\n\nBut there’s a problem. In many cases, the\
  \ desire for generality and accuracy conflict. Consider the following generalization:\n\
  \n* Statement 1: Vampires have sharp teeth and usually hunt in the evening.\n* Statement\
  \ 2: Werewolves have sharp teeth and usually hunt in the evening.\n* Generalization:\
  \ All vampires are werewolves.\n\nHumans can look at these statements and immediately\
  \ spot the problem with this reasoning. But deep neural networks can’t. A DNN may\
  \ base its generalizations on trivial features (sharp teeth) instead of important\
  \ features (lycanthropy, aversion to sunlight, and thirst for blood).\n\nTo improve\
  \ on deep learning, Google updated their Google Play recommendation system to augment\
  \ DNN classification with linear classification. To train the linear classifier,\
  \ Google provides input features and *cross products* of input features. A cross\
  \ product determines how features interact by multiplying the features together:\n\
  \n![images](img/eq12002.png)<m:math xmlns:m=\"http://www.w3.org/1998/Math/MathML\"\
  ><m:mrow><m:msub><m:mi>&#981;</m:mi><m:mi>k</m:mi></m:msub><m:mrow><m:mo>(</m:mo><m:mi>x</m:mi><m:mo>)</m:mo></m:mrow><m:mo>=</m:mo><m:mstyle\
  \ displaystyle=\"true\"><m:munderover><m:mo>&#8719;</m:mo><m:mrow><m:mi>i</m:mi><m:mo>=</m:mo><m:mn>1</m:mn></m:mrow><m:mi>d</m:mi></m:munderover><m:mrow><m:msub><m:mi>x</m:mi><m:mi>i</m:mi></m:msub><m:msup><m:mrow></m:mrow><m:mrow><m:msub><m:mi>c</m:mi><m:mrow><m:mi>k</m:mi><m:mi>i</m:mi></m:mrow></m:msub></m:mrow></m:msup></m:mrow></m:mstyle><m:mi\
  \ mathvariant=\"normal\">&#160;&#160;</m:mi><m:msub><m:mi>c</m:mi><m:mrow><m:mi>k</m:mi><m:mi>i</m:mi></m:mrow></m:msub><m:mo>&#8712;</m:mo><m:mrow><m:mo>{</m:mo><m:mrow><m:mn>0</m:mn><m:mo>,</m:mo><m:mrow><m:mn>1</m:mn><m:mo>}</m:mo></m:mrow></m:mrow></m:mrow></m:mrow></m:math>\n\
  \nIn a TensorFlow application, you can combine features into a cross product by\
  \ calling `tf.feature.crossed_column`. In essence, this combines multiple categorical\
  \ columns into a single hashed categorical column. Its signature is given as follows:\n\
  \n```python\ncrossed_column(keys, hash_bucket_size, hash_key=None)\n```\n\nThe first\
  \ parameter, `keys`, accepts one or more categorical columns to be examined together.\
  \ `hash_bucket_size` sets the maximum number of unique values in the new categorical\
  \ column.\n\nCross products may not seem exciting, but linear classifiers can use\
  \ them to arrive at conclusions that DNN classifiers would find difficult to obtain.\
  \ Linear classifiers are particularly effective when problems have many categorical\
  \ features that may or may not interact on one another. For this reason, Google\
  \ Research refers to the use of linear classifiers as *wide learning*. According\
  \ to Heng-Tze Cheng and other Google researchers, “Online experiment results show\
  \ that Wide & Deep significantly increased app acquisitions compared with wide-only\
  \ and deep-only models.”\n\n###### Analyzing census data\n\nWide learning is helpful\
  \ for problems with many categorical features. This requirement makes the usual\
  \ datasets — MNIST, CIFAR, Iris, and Boston — unsuitable for demonstration. For\
  \ this reason, the `ch12/combined.py` module analyzes census data. To be precise,\
  \ the module creates a `DNNLinearCombinedClassifier` that examines data from the\
  \ 1994 Census to determine whether a person will make more or less than $50,000\
  \ per year.\n\n\n\n\n\n我提供的人口普查数据包含两个 CSV 文件：`ch12/adult.data` 包含训练数据，而 `ch12/adult.test`\
  \ 包含测试数据。加州大学欧文分校（UCI）在其网站 [`https://archive.ics.uci.edu/ml/machine-learning-databases/adult`](https://archive.ics.uci.edu/ml/machine-learning-databases/adult)\
  \ 上免费提供这些文件。\n\n###### Census Record Fields\n\n每条人口普查记录提供关于一个人的 14 项统计数据：\n\n* \
  \  `age`: 年龄，以年为单位\n*   `workclass`: 工作状态（Private, Self-emp-not-inc, self-emp-inc,\
  \ Federal-gov, Local-gov, State-gov, Without-pay, Never-worked）\n*   `fnlwgt`: 一个权重值（最终权重），由人口普查局计算\n\
  *   `education`: 最高教育水平（Preschool, 1^(st)\\-4^(th), 5^(th)\\-6^(th), 7^(th)\\-8^(th),\
  \ 9^(th), 10^(th), 11^(th), 12^(th), HS-grad, Some-college, Prof-school, Assoc-acdm,\
  \ Assoc-voc, Bachelors, Masters, Doctorate）\n*   `education-num`: 受教育年限\n*   `marital-status`:\
  \ 婚姻状况（Never-married, Divorced, Separated, Widowed, Married-civ-spouse, Married-AF-spouse,\
  \ Married-spouse-absent）\n*   `occupation`: 工作场所（Tech-support, Craft-repair, Other-service,\
  \ Sales, Exec-managerial, Prof-specialty, Handlers-cleaners, Machine-op-inspct,\
  \ Adm-clerical, Farming-fishing, Transport-moving, Priv-house-serv, Protective-serv,\
  \ Armed-Forces）\n*   `relationship`: 婚姻状况（Wife, Own-child, Husband, Not-in-family,\
  \ Other-relative, Unmarried）\n*   `race`: 自我认同的种族（White, Asian-Pac-Islander, Amer-Indian-Eskimo,\
  \ Other, Black）\n*   `sex`: 性别（Female, Male）\n*   `capital-gain`: 买卖资本资产的利润\n* \
  \  `capital-loss`: 买卖资本资产的损失\n*   `hours-per-week`: 每周工作小时数\n*   `native-country`:\
  \ 原籍国（United-States, Cambodia, England, Puerto-Rico, Canada, Germany, Outlying-US(Guam-USVI-etc),\
  \ India, Japan, Greece, South Korea, China, Cuba, Iran, Honduras, Philippines, Italy,\
  \ Poland, Jamaica, Vietnam, Mexico, Portugal, Ireland, France, Dominican-Republic,\
  \ Laos, Ecuador, Taiwan, Haiti, Columbia, Hungary, Guatemala, Nicaragua, Scotland,\
  \ Thailand, Yugoslavia, El-Salvador, Trinadad&Tobago, Peru, Hong Kong, Holand-Netherlands）\n\
  \n例如，`adult.test` 文件包含以下记录：\n\n`36, Local-gov, 403681, Bachelors, 13, Married-civ-spouse,\
  \ Prof-specialty, Husband, White, Male, 0, 0, 40, United-States, >50K`\n\n最后一列提供分类标签作为字符串。标签\
  \ `>50K` 表示该人年收入超过 $50,000，而 `<=50K` 表示该人年收入小于或等于 $50,000。\n\n###### Loading Data\
  \ with pandas\n\n不幸的是，你无法使用 `load_csv_with_header` 或 `load_csv_without_header` 加载此人口普查数据。相反，我建议使用\
  \ pandas 数据分析库。如果你有 pip 可用，可以使用以下命令安装 pandas：\n\n```\npip install pandas\n```\n\n\
  安装工具集后，你可以通过调用 `read_csv` 读取 CSV 数据。此函数接受相当多的参数，其中七个特别重要：\n\n*   `filepath_or_buffer`:\
  \ 包含 CSV 数据的文件句柄\n*   `header`: 包含列名的行号\n*   `names`: CSV 字段的名称\n*   `dtype`: 列的数据类型或数据类型列表\n\
  *   `engine`: 解析器引擎\n*   `skipinitialspace`: 指定是否忽略分隔符后的空格的布尔值（默认值：`False`）\n* \
  \  `skiprows`: 文件开始后要跳过的行数\n\n`read_csv` 返回一个 `DataFrame`，其中保存了来自 CSV 文件的数据。例如，以下代码获取\
  \ `adult.data` 的句柄并调用 `read_csv` 将其数据读入 `DataFrame`：\n\n```\ncolumns = ['age', 'workclass',\
  \ 'fnlwgt', 'education', 'education_num', 'marital_status', 'occupation', 'relationship',\
  \ 'race', 'gender', 'capital_gain', 'capital_loss', 'hours_per_week', 'native_country',\
  \ 'income_bracket']\ntrain_file = open('adult.data', 'r')\ntrain_frame = pd.read_csv(train_file,\
  \ names=columns, engine='python', skipinitialspace=True, skiprows=1)\n```\n\n创建\
  \ `DataFrame` 后，你可以调用 `pandas_input_fn` 将 `DataFrame` 转换为可传递给估计器的 `train` 或 `evaluate`\
  \ 方法的函数。`ch12/combined.py` 模块演示了应用程序如何使用 pandas 从 CSV 文件读取数据，而 Listing 12-3 展示了代码。\n\
  \n###### Listing 12-3 Analyzing Census Data with Wide and Deep Learning\n\n```\n\
  #### Define column headings\ncolumns = ['age', 'workclass', 'fnlwgt', 'education',\
  \ 'education_num',\n 'marital_status', 'occupation', 'relationship', 'race', 'gender',\n\
  \ 'capital_gain', 'capital_loss', 'hours_per_week', 'native_country',\n 'income_bracket']\n\
  \n#### Create feature columns\nage = tf.feature_column.numeric_column('age')\nworkclass\
  \ = tf.feature_column.categorical_column_with_vocabulary_list(\n 'workclass', ['Private',\
  \ 'Self-emp-not-inc', 'self-emp-inc', 'Federal-gov',\n 'Local-gov', 'State-gov',\
  \ 'Without-pay', 'Never-worked'])\nfnlwgt = tf.feature_column.numeric_column('fnlwgt')\n\
  education = tf.feature_column.categorical_column_with_vocabulary_list(\n 'education',\
  \ […])\neducation_num = tf.feature_column.numeric_column('education_num')\nmarital_status\
  \ = tf.feature_column.categorical_column_with_vocabulary_list(\n 'marital_status',\
  \ ['Never-married', 'Divorced', 'Separated', 'Widowed',\n 'Married-civ-spouse',\
  \ 'Married-AF-spouse', 'Married-spouse-absent'])\noccupation = tf.feature_column.categorical_column_with_vocabulary_list(\n\
  \ 'occupation', […])\nrelationship = tf.feature_column.categorical_column_with_vocabulary_list(\n\
  \ 'relationship', ['Wife', 'Own-child', 'Husband', 'Not-in-family',\n 'Other-relative',\
  \ 'Unmarried'])\nrace = tf.feature_column.categorical_column_with_vocabulary_list(\n\
  \ 'race', ['White', 'Asian-Pac-Islander', 'Amer-Indian-Eskimo', 'Other', 'Black'])\n\
  gender = tf.feature_column.categorical_column_with_vocabulary_list(\n 'gender',\
  \ ['Female', 'Male'])\ncapital_gain = tf.feature_column.numeric_column('capital_gain')\n\
  capital_loss = tf.feature_column.numeric_column('capital_loss')\nhours_per_week\
  \ = tf.feature_column.numeric_column('hours_per_week')\nnative_country = tf.feature_column.categorical_column_with_vocabulary_list(\n\
  \ 'native_country', […])\n\n#### Create groups of columns\nlinear_columns = [\n\
  \ tf.feature_column.crossed_column(\n ['education', 'occupation'], hash_bucket_size=1000),\n\
  \ tf.feature_column.crossed_column(\n ['native_country', 'occupation'], hash_bucket_size=1000),\n\
  \ tf.feature_column.crossed_column(\n ['workclass', 'occupation'], hash_bucket_size=1000)]\n\
  \ndnn_columns = [\n tf.feature_column.indicator_column(workclass),\n tf.feature_column.indicator_column(education),\n\
  \ tf.feature_column.indicator_column(gender),\n tf.feature_column.indicator_column(relationship),\n\
  \ tf.feature_column.indicator_column(native_country),\n tf.feature_column.indicator_column(occupation),\n\
  \ age, education_num, capital_gain, capital_loss,\n hours_per_week, fnlwgt]\n\n\
  #### Create classifier\nclassifier =\ntf.estimator.DNNLinearCombinedClassifier(linear_feature_columns=linear_columns,\n\
  \ dnn_feature_columns=dnn_columns, dnn_hidden_units=[120, 60])\n\n#### Train the\
  \ classifier\ntrain_file = open('adult.data', 'r')\ntrain_frame = pd.read_csv(train_file,\n\
  \ names=columns, engine='python',\n skipinitialspace=True, skiprows=1)\ntrain_labels\
  \ = train_frame['income_bracket'].apply(lambda x: '>50K' in x)\ntrain_fn = tf.estimator.inputs.pandas_input_fn(\n\
  \ x=train_frame, y=train_labels,\n batch_size=100, num_epochs=600,\n shuffle=True)\n\
  classifier.train(train_fn)\n\n#### Test the estimator\ntest_file = open('adult.test',\
  \ 'r')\ntest_frame = pd.read_csv(test_file,\n names=columns, engine='python',\n\
  \ skipinitialspace=True, skiprows=1)\n```\n\n\n\n\n\n`test_labels = test_frame['income_bracket'].apply(lambda\
  \ x: '>50K' in x)`\n\n`test_fn = tf.estimator.inputs.pandas_input_fn(`\n` x=test_frame,\
  \ y=test_labels,`\n` num_epochs=1, shuffle=False)`\n\n`metrics = classifier.evaluate(test_fn)`\n\
  \n`# Display metrics`\n\n`print('\\nEvaluation metrics:')`\n\n`for key, value in\
  \ metrics.items():`\n` print(key, ': ', value)`\n\n在执行此模块之前，您需要在当前目录中放置 `adult.data`\
  \ 和 `adult.test` 文件。您还需要安装 pandas 数据分析包。\n\n该模块首先为人口普查数据中的每个字段创建一个特征列。然后它创建了三个交叉列：一个将\
  \ `education` 和 `occupation` 列组合在一起，一个将 `native_country` 和 `occupation` 列组合在一起，一个将\
  \ `workclass` 和 `occupation` 列组合在一起。\n\n创建交叉列后，该模块创建了一组用于 DNN 分类器的特征列。您不能将分类列馈送到神经网络，因此该模块通过调用\
  \ `tf.feature_column.indicator_column` 将分类列转换为密集列。\n\n接下来，该模块创建了一个 `DNNCombinedLinearClassifier`\
  \ 并为其提供了两组特征列。也就是说，它将交叉列定向到线性分类器，将密集列定向到 DNN。`dnn_hidden_units` 参数将神经网络配置为具有两个隐藏层：一个有\
  \ 120 个节点，一个有 60 个节点。\n\n创建分类器后，该模块调用其 `train` 和 `evaluate` 方法。为了训练分类器，该模块从 `adult.data`\
  \ 读取字段并将 `DataFrame` 转换为数据集。训练过程包括 500 个 epoch，每个训练步骤都在包含 100 个数据点的随机批次上操作。\n\n\
  为了测试分类器，该模块将字段从 `adult.test` 读取到 `DataFrame` 中并将 `DataFrame` 转换为数据集。然后它打印 `evaluate`\
  \ 返回的 dict 中包含的每个指标。在我的系统上，该模块显示以下结果：\n\n`accuracy : 0.802285`\n`accuracy_baseline\
  \ : 0.763774`\n`auc : 0.87448`\n`auc_precision_recall : 0.710498`\n`average_loss\
  \ : 0.511923`\n`label/mean : 0.236226`\n`loss : 65.1142`\n`prediction/mean : 0.336511`\n\
  `global_step : 195360`\n\n在此列表中，`auc` 代表“曲线下面积”。该指标对于分类器很常见，因为它衡量分类器做出成功预测与不成功预测的可能性。\n\
  \n##### 在集群中运行 Estimator\n\n第 11 章 介绍了分布式 TensorFlow 应用程序，其中涉及作业、任务和服务器。您可以在分布式应用程序中运行\
  \ estimator，但您需要告诉 TensorFlow 关于集群以及运行 estimator 的服务器分配的任务。\n\n您可以通过设置描述集群和服务器任务的\
  \ `TF_CONFIG` 变量来提供此信息。具体来说，您需要将 `TF_CONFIG` 设置为包含三个字段的 JSON（JavaScript Object Notation）对象：\n\
  \n* `cluster`: 集群的描述\n* `task`: 节点的任务\n* `job`: 作业的参数\n\n您可以通过提供 `ClusterSpec` 实例的参数来设置第一个字段。如果您已有现有的\
  \ `ClusterSpec`，您可以通过调用其 `as_cluster_def` 方法获得合适的描述。\n\n`task` 字段标识设置了 `TF_CONFIG`\
  \ 的节点分配的任务。此字段本身有三个字段：\n\n* `type`: 任务的类型（`worker`、`master` 或 `ps`）\n* `index`:\
  \ 作业内任务的索引\n* `trial`: 要运行的试验的字符串标识符，以 `'1'` 开头\n\n`TF_CONFIG` 的 `job` 字段描述节点的作业。分布式应用程序通常通过命令行参数接收此信息，因此您可以忽略此字段。以下代码向您展示了如何设置此变量：\n\
  \n```\nTF_CONFIG = {\n 'cluster': {'ps': ['host1:123'],\n 'worker': ['host2:456']},\n\
  \ 'task': {\n 'type': 'worker',\n 'index': 0,\n 'trial': '1'\n }\n}\n```\n\n在这种情况下，集群有两个作业和两个任务。分配给具有此\
  \ `TF_CONFIG` 变量的节点的任务的索引为 `0`，类型为 `worker`。在这种情况下，集群有一个具有任务类型的作业，但这并不总是如此。您可以为作业分配任何名称，但任务的类型必须是\
  \ `worker`、`master` 或 `ps`。\n\n##### 访问实验\n\n为了简化在分布式环境中执行 estimator 的过程，TensorFlow\
  \ 提供了 `Experiment` 类。要在代码中使用 `Experiment`，您需要执行三个步骤：\n\n1. **创建 estimator。**\n2.\
  \ **使用步骤 1 中创建的 estimator 构造 `tf.contrib.learn.Experiment` 的实例。**\n3. **通过调用 `tf.contrib.learn.learn_runner.run`\
  \ 启动实验。**\n\n本讨论介绍了这些步骤并演示了如何使用实验对 MNIST 图像进行分类。第 13 章 介绍了在云中启动实验的应用程序。\n\n######\
  \ 创建实验\n\n每个实验都需要一个 estimator 和训练与评估函数。您可以通过调用其构造函数创建 `tf.contrib.learn.Experiment`，其参数列在\
  \ 表 12-3 中。\n\nTABLE 12-3 Experiment 构造函数的参数\n\n| **Parameter** || **Default** ||\
  \ **Description** |\n| --- | --- | --- |\n| `estimator` || `--` || Estimator to\
  \ be launched by the experiment |\n| --- | --- | --- |\n| `train_input_fn` || `--`\
  \ || Function that returns training features and labels |\n| `eval_input_fn` ||\
  \ `--` || Function that returns evaluation features and labels |\n| `eval_metrics`\
  \ || `None` || Evaluation metrics to monitor |\n| `train_steps` || `None` || Number\
  \ of training steps |\n| `eval_steps` || `None` || Number of evaluation steps |\n\
  | `eval_hooks` || `None` || Session hooks to pass to the estimator |\n| `eval_delay_secs`\
  \ || `120` || Number of seconds to wait before evaluating |\n| `continuous_eval_throttle_secs`\
  \ || `60` || Number of seconds to wait after the start of evaluation before re-evaluating\
  \ |\n| `min_eval_frequency` || `None` || Minimum number of steps between evaluations\
  \ |\n| `delay_workers_by_global_step` || `False` || Bool that specifies whether\
  \ to delay training workers by global step instead of time |\n| `export_strategies`\
  \ || `None` || Export strategies |\n| `train_steps_per_iteration` || `None` || Number\
  \ of training steps in each training-evaluation iteration |\n| `checkpoint_and_export`\
  \ || `False` || Bool that specifies whether to save checkpoints and exports during\
  \ training |\n\n构造函数的最重要的参数是第一个，它标识实验将执行的 estimator。第二和第三个参数标识实验应用于训练和评估 estimator\
  \ 的函数。\n\n`train_steps` 参数标识训练过程中要执行的步骤数。如果您未设置此参数，estimator 的训练将无限期继续。`eval_steps`\
  \ 参数指定测试期间应执行的步骤数。如果您未设置此参数，测试将一直继续，直到有输入数据可用。\n\n###### 实验类的方法\n\n创建 `Experiment`\
  \ 后，您可以访问其方法。表 12-4 列出了这些方法并提供了每个方法的描述。\n\nTABLE 12-4 Experiment 类的方法\n\n| **Method**\
  \ || **Description** |\n| --- | --- |\n| `train(delay_secs=None)` || Train the estimator\
  \ with training data |\n| --- | --- |\n| `evaluate(delay_secs=None, name=None)`\
  \ || Evaluate the estimator with test data |\n| `train_and_evaluate()` || Train\
  \ and evaluate the estimator |\n\n\n\n\n\n| `test()` || 训练、评估并导出一步 |\n| `continuous_eval(delay_secs=None,\
  \ throttle_delay_secs=None, evaluate_checkpoint_only_once=True, continuous_eval_predicate_fn=None,\
  \ name='continuous')` || 持续评估估计器 |\n| `continuous_eval_on_train_data( delay_secs=None,\
  \ throttle_delay_secs=None, continuous_eval_predicate_fn=None, name='continuous_on_train_data')`\
  \ || 使用训练数据持续评估估计器 |\n| `continuous_train_and_eval(*args, **kwargs)` || 交替进行训练和评估\
  \ |\n| `extend_train_hooks(additional_hooks)` || 为训练关联额外的会话钩子 |\n| `reset_export_strategies(new_export_strategies=None)`\
  \ || 关联新的导出策略 |\n| `run_std_server()` || 启动 TensorFlow 服务器并加入服务线程 |\n\n前四种方法使用和理解起来都很直接。`train`\
  \ 方法将无限期继续，除非你在构造函数中设置了 `train_steps` 参数。`evaluate` 将持续测试直到其输入耗尽或达到 `eval_steps`\
  \ 参数为止。在这两种方法中，你可以通过设置 `delay_secs` 参数来指定实验应等待多长时间。\n\n`continuous_eval` 和 `continuous_eval_on_train_data`\
  \ 方法都执行重复评估。你可以通过将 `continuous_eval_predicate_fn` 分配给合适的函数来控制评估是否继续。该函数接收前一次评估的结果并确定是否应继续评估。\n\
  \n`continuous_train_and_eval` 方法为实验性，随时可能更改。这会遍历训练和评估，你可以使用构造函数的 `train_steps_per_iteration`\
  \ 参数设置每次训练的步数。\n\n###### 运行实验\n\n你可以通过调用 `tf.contrib.learn.learn_runner.run` 来训练和/或评估实验。该函数接受四个参数：\n\
  \n* `experiment_fn`: 返回实验的函数\n* `schedule`: 要调用的实验方法\n* `run_config`: 提供配置设置的 `RunConfig`\n\
  * `hparams`: 提供实验额外数据的 `HParams`\n\n要调用此函数，你需要将第一个参数分配给一个接收两个参数的函数：一个 `RunConfig`\
  \ 和一个 `HParams`。该函数必须返回一个 `Experiment`。\n\n每个估计器构造函数都有一个 `config` 参数，可接受 `tf.contrib.learn.RunConfig`\
  \ 实例。`run` 方法的 `run_config` 参数接受相同类型的 `RunConfig`。请记住，`model_dir` 字段告诉实验将其输出存储在何处。\n\
  \n你可以使用 `tf.contrib.training.HParams` 的实例将数据传递给 `experiment_fn` 函数。构造函数接受一个或多个用逗号分隔的键值对。以下代码展示了如何创建\
  \ `HParams` 实例：\n\n```\nhparams = tf.contrib.training.HParams(learning_rate=0.01,\
  \ hidden_units=[10, 20])\n```\n\n`schedul`e 参数标识应调用哪个实验方法。你可以通过设置 `RunConfig` 的\
  \ `model_dir` 字段来控制方法返回值应存储的位置。\n\n###### 将理论付诸实践\n\n`ch12/experiment.py` 模块中的代码演示了如何创建和启动实验。该实验使用类似于\
  \ `ch12/dnn_class.py` 中估计器的 `DNNClassifier` 分析 MNIST 数据。 Listing 12-4 展示了代码。\n\n\
  LISTING 12-4 使用实验对 MNIST 图像进行分类\n\n```\n#### Set parameters\nbatch_size = 80\nimage_dim\
  \ = 28\nhparams = tf.contrib.training.HParams(\n num_labels=10,\n batch_size=80,\n\
  \ num_steps=8000,\n hidden_layers=[128, 32])\n\n#### Function to parse MNIST TFRecords\n\
  def parser(record):\n features = tf.parse_single_example(record,\n features={\n\
  \ 'images': tf.FixedLenFeature([], tf.string),\n 'labels': tf.FixedLenFeature([],\
  \ tf.int64),\n })\n image = tf.decode_raw(features['images'], tf.uint8)\n image.set_shape([image_dim\
  \ * image_dim])\n image = tf.cast(image, tf.float32) * (1. / 255) - 0.5\n label\
  \ = features['labels']\n return image, label\n\n#### Create the DNNClassifier\n\
  def create_estimator(hidden_layers, num_labels, conf):\n column = tf.feature_column.numeric_column('pixels',\n\
  \ shape=[image_dim * image_dim])\n return tf.estimator.DNNClassifier(hidden_layers,\
  \ [column],\n n_classes=num_labels, config=conf)\n\n#### Train the estimator\ndef\
  \ train_func():\n dataset = tf.data.TFRecordDataset('mnist_train.tfrecords')\n dataset\
  \ = dataset.map(parser).repeat().batch(batch_size)\n image, label = dataset.make_one_shot_iterator().get_next()\n\
  \ return {'pixels': image}, label\n\n#### Test the estimator\ndef test_func():\n\
  \ dataset = tf.data.TFRecordDataset('mnist_test.tfrecords')\n dataset = dataset.map(parser).batch(batch_size)\n\
  \ image, label = dataset.make_one_shot_iterator().get_next()\n return {'pixels':\
  \ image}, label\n\n#### Create experiment\ndef create_experiment(conf, params):\n\
  \ return tf.contrib.learn.Experiment(\n estimator=create_estimator(params.hidden_layers,\n\
  \ params.num_labels, conf),\n train_input_fn=train_func,\n eval_input_fn=test_func,\n\
  \ train_steps=params.num_steps)\n\n#### Run experiment\nrun_config = tf.contrib.learn.RunConfig(model_dir='experiment_output')\n\
  tf.contrib.learn.learn_runner.run(\n experiment_fn=create_experiment,\n run_config=run_config,\n\
  \ schedule='train_and_evaluate',\n hparams=hparams\n)\n```\n\n该模块首先创建了一个包含批大小、标签数量、训练步数和隐藏层数量的\
  \ `HParams`。该模块还创建了一个标识实验输出应存储目录的 `RunConfig`。\n\n当模块调用 `tf.contrib.learn.learn_runner.run`\
  \ 时，它提供了 `HParams` 实例、`RunConfig` 实例以及返回 `Experiment` 的函数。该函数使用三个函数调用 `Experiment`\
  \ 构造函数：\n\n* `create_estimator`: 使用实验的配置设置创建 `DNNClassifier`\n* `train_func`: 为\
  \ `DNNClassifier` 提供训练数据和标签\n* `test_func`: 为 `DNNClassifier` 提供测试数据和标签\n\n模块将 `tf.contrib.learn.learn_runner.run`\
  \ 的 `schedule` 参数设置为 `train_and_evaluate`。这会调用实验的 `train_and_evaluate` 函数，该函数训练并测试实验的估计器。\n\
  \n#### 第 13 章\n\n#### 在 Google Cloud Platform (GCP) 上运行应用程序\n\n本章内容\n\n![check](img/check.png)**为\
  \ Google Cloud Platform (GCP) 开发项目**\n\n![check](img/check.png)**使用 GCP 工具**\n\n\
  ![check](img/check.png)**访问 Google Cloud Storage (GCS)**\n\n![check](img/check.png)**在\
  \ GCP 中打包和运行 TensorFlow 应用程序**\n\n在技术世界的成功故事中，没有什么比 Google 的崛起更引人注目的了。自 2004 年首次公开募股以来，Google\
  \ 建立了一个遍布全球的庞大计算架构。每个拥有互联网连接的人都知道如何在 [`google.com`](http://www.google.com) 上搜索信息并在\
  \ [`youtube.com`](http://youtube.com) 上观看媒体。Google 的技术变得如此流行，以至于动词 google 已进入 Merrian-Webster\
  \ 词典。\n\n虽然 Google 的技术在全球闻名，但 Google Compute Platform (GCP) 并没有那么知名。这很遗憾，因为 GCP\
  \ 让像你我这样的开发者能够利用 Google 的庞大资源，其中包括数 TB 的分布式存储和高速处理器集群。\n\n\n\n\n\n我喜欢使用 GCP，因为我的应用程序可以访问\
  \ Google 的技术，其中包括 Google 地图、Gmail、YouTube 和 AdSense。本章重点介绍 Google 的机器学习（ML）引擎，它让你能够在\
  \ Google Cloud Platform 中执行 `TensorFlow` 应用程序。\n\n##### 概述\n\n好消息是，你可以通过将应用程序部署到\
  \ Google 的机器学习（ML）引擎来大幅减少机器学习所需的时间。坏消息是，配置和部署应用程序的过程并不容易。涉及五个步骤：\n\n1. **为 Google\
  \ Cloud Platform（GCP）创建一个项目并将其配置为使用 Cloud Machine Learning API。**\n2. **安装 Cloud\
  \ 软件开发工具包（SDK）。**\n3. **将你的 TensorFlow 应用程序结构化为一个包。**\n4. **将你的包和处理数据上传到 Google\
  \ Cloud Storage。**\n5. **使用 Cloud SDK 执行训练或预测作业。**\n\n在撰写本章时，我假设你从未听说过 GCP。因此，在我解释如何部署应用程序之前，我先介绍\
  \ Cloud 软件开发工具包（SDK）和 Cloud Storage，并解释如何创建一个 GCP 项目。\n\n##### 使用 GCP 项目\n\n如果你想利用\
  \ GCP 的功能，第一步是创建一个项目。该项目充当你开发工作的中央容器，其中包含所有元数据和配置文件。在你执行代码或启动 Web 应用程序之前，需要将文件上传到你的项目。同样，如果你想要访问特殊功能，需要通过项目提出请求。\n\
  \n要构建可访问 ML Engine 的 GCP 项目，你需要执行三个步骤：\n\n1. **在 Google Developer Console 中创建一个项目。**\n\
  2. **为项目启用计费。**\n3. **启用项目以访问机器学习引擎。**\n\n![tip](img/tip.png)本书示例代码中的 `ch13` 目录包含两个文件夹：`cloud_mnist`\
  \ 和 `cluster_mnist`。这些文件夹包含可部署到 ML Engine 的包，但它们不是 GCP 项目。GCP 项目驻留在云中，因此如果你想跟随本章的开发，你需要自行创建和配置一个\
  \ GCP 项目。\n\n###### 创建新项目\n\n任何拥有有效电子邮件地址的人都可以免费创建 GCP 项目而无需任何费用或义务。该过程涉及五个步骤：\n\
  \n1. **访问 Cloud Console，网址为** [`https://console.cloud.google.com`](https://console.cloud.google.com)**。**\n\
  2. **如果这是你第一次访问控制台，请提供联系电子邮件地址和密码。**\n3. **在上方的水平栏中，点击 Select a Project。**\n4. **在\
  \ Select 对话框中，点击右侧的加号按钮。**\n5. **在 New Project 页面中，输入项目名称并点击 Create 按钮。**\n\n在使用\
  \ GCP 时，你需要理解项目名称和 ID 之间的区别。项目的名称由开发者选择，控制台使用它来显示当前项目。\n\n相比之下，项目的 ID 由 GCP 根据项目名称选择，并且在\
  \ GCP 的所有项目中唯一标识该项目。如果你想上传代码或更改项目的配置，你将需要通过其 ID 访问你的项目。因此，了解你的项目的 ID 是一个好主意。\n\n\
  ###### 计费\n\n机器学习是一种强大的功能，但与 TensorFlow 不同，它不是免费的。Google 对机器学习的费用取决于三个因素：操作类型（训练或预测）、持续时间以及你的位置：\n\
  \n* 训练：美国每小时每个训练单元 0.49 美元，欧洲和亚洲 0.54 美元\n* 预测：美国每千次预测 0.10 美元，外加每小时 0.40 美元；欧洲和亚洲每千次预测\
  \ 0.11 美元，外加每小时 0.44 美元\n\nGoogle 在你使用 ML Engine 之后收取费用，而不是预先收取。但你需要在使用引擎之前确定付款方式，你可以通过将项目与计费账户关联来配置此项：\n\
  \n1. **访问 Cloud Console 中的项目页面。**\n2. **打开左上角的菜单（三条水平线）并选择 Billing 选项。**\n3. **点击标题为\
  \ Add billing account 的按钮。**\n4. **输入你的联系信息和计费信息。**\n\n在页面底部，有一个按钮可让你设置自动付款，这将授权\
  \ Google 在使用资源时从账户中提取资金。\n\n###### 访问机器学习引擎\n\n在为你的项目设置计费账户后，你可以访问付费功能，如 ML Engine。要启用此功能，请打开项目页面左上角的菜单并选择\
  \ APIs & Services。这将打开 APIs & Services 页面，该页面标识项目可以访问的功能。\n\n页面左侧显示三个链接：Dashboard、Library\
  \ 和 Credentials。Library 链接打开一个页面，列出项目可用的 API。要启用对 ML Engine 的访问，你需要执行五个步骤：\n\n1.\
  \ **从 APIs & Services 页面，点击左侧的 Library 链接。**\n2. **找到 Machine Learning 组并点击右侧的 View\
  \ All 链接。**\n3. **点击标题为 Google Cloud Machine Learning Engine 的链接。**\n4. **点击页面顶部的\
  \ Enable 链接。**\n5. **等待 GCP 授予对新功能的使用权限。**\n\n执行这些步骤后，你可以通过访问 APIs & Services 仪表板来验证你的项目是否可以访问\
  \ ML Engine。页面的下半部分列出了项目可以访问的不同 API，其中应包括 Google Cloud Storage 和 Google Cloud Machine\
  \ Learning Engine。\n\n##### Cloud 软件开发工具包（SDK）\n\n在你了解如何创建 GCP 项目并将其配置为访问 ML Engine\
  \ 后，你就可以与你的项目进行交互了。Google 通过 Google SDK 使此成为可能。\n\n你可以从 [`http://cloud.google.com/sdk`](http://cloud.google.com/sdk)\
  \ 下载 SDK。点击 Install 按钮会打开一个页面，提供在你的开发系统上下载 SDK 安装程序的说明。我建议安装所有可用的组件。\n\n当你启动安装程序时，它会要求你登录你的账户并授予权限，以便\
  \ SDK 可以访问你的 GCP 账户。它还会要求你选择一个云项目作为 SDK 的默认项目。在你选择后，所有后续的 SDK 命令都将影响默认项目。\n\n安装\
  \ SDK 后，你就可以访问两个命令行实用程序：\n\n* **`gcloud`：** 提供通用项目交互并访问 Google 的 App Engine、Datastore、DNS\
  \ 和 ML Engine\n* **`gsutil`：** 访问 Google Cloud Storage\n\n如果你运行的是 Windows，可以通过 `gcloud.cmd`\
  \ 和 `gsutil.cmd` 访问这些实用程序。如果你运行的是 Linux 或 Mac OS，可以通过 `gcloud` 和 `gsutil` 可执行文件访问它们。\n\
  \n在开始使用 SDK 之前，你应该确保可以从命令行提示符访问 `gcloud` 和 `gsutil`。如果输入 `gcloud version` 且看不到任何版本信息，请将\
  \ `google-cloud-sdk/bin` 文件夹添加到你的 `PATH` 环境变量中。\n\n##### gcloud 实用程序\n\n安装 SDK 后，你可以在命令行上执行\
  \ `gcloud` 命令。所有 `gcloud` 命令具有相同的格式：\n\n`gcloud [optional flags] <group | command>`\n\
  \n例如，你可以通过输入以下命令来检查 `gcloud` 的版本：\n\n`gcloud version`\n\n该命令标识 SDK 的版本及其组件的版本。你可以通过输入以下命令安装最新组件：\n\
  \n`gcloud components update`\n\n在此示例中，`components` 是一个 *组名*，因为它需要额外的命令，例如 `update`。你可以将组视为图形用户界面中的子菜单。相比之下，`version`\
  \ 是一个 *命令名*，因为它不接受进一步的命令。\n\n\n\n\n\n如果输入 `gcloud help`，你会看到 `gcloud` 的组和命令的长列表。`gcloud`\
  \ 的组使得管理 Web 应用、访问数据库以及配置 DNS 设置成为可能。Table 13-1 列出了其中十个组。\n\nTABLE 13-1 gcloud Groups\n\
  \n| **Group** || **Operation** |\n| --- | --- |\n| `app` || 管理 App Engine 部署 |\n\
  | --- | --- |\n| `auth` || 管理 oauth2 凭据 |\n| `components` || 安装、更新和移除 SDK 组件 |\n\
  | `compute` || 访问与 Compute Engine 相关的资源 |\n| `config` || 查看和编辑 SDK 配置 |\n| `domains`\
  \ || 管理与项目关联的域名 |\n| `ml` || 访问机器学习功能 |\n| `ml-engine` || 管理机器学习作业和模型 |\n| `projects`\
  \ || 创建和管理项目访问权限 |\n| `services` || 列出、启用和禁用 API 和服务 |\n\n`ml-engine` 组在本章中扮演核心角色，因为它允许你将\
  \ TensorFlow 应用上传并在云中执行。Figure 13-1 显示了与 `ml-engine` 关联的许多，但并非全部的组和命令。\n\n![FIGURE\
  \ 13-1: Commands in the Cloud SDK have many levels and options.](img/9788126592555-fg1301.png)\n\
  \nFIGURE 13-1: Commands in the Cloud SDK have many levels and options.\n\n要部署和运行云中的应用程序，你需要熟悉\
  \ `gcloud ml-engine` 中 `jobs` 子组的命令。对 ML Engine 而言，作业指的是处理任务，可能为训练或预测。例如，以下命令告诉引擎你希望它启动一个训练作业：\n\
  \n`gcloud ml-engine jobs submit training`\n\n要告诉 GCP 在哪里找到你的代码，你需要在命令后跟随配置标志。其中三个标志特别重要：\n\
  \n*   `--package-path`: 包含训练源代码的本地目录\n*   `--module-name`: 包主模块的名称\n*   `--staging-bucket`:\
  \ 包及其依赖项应存储的 Cloud Storage 存储桶\n\n在解释如何向云提交作业之前，我将在下一节解释 Cloud Storage 的工作原理，以便你设置\
  \ `--staging-bucket` 标志。然后我将解释如何准备应用程序，以便你设置 `--package-path` 标志。\n\n##### Google\
  \ Cloud Storage\n\nGCP 提供了多种在云中存储数据的选项，包括 Datastore、BigTable 和 Spanner。但如果你想存储和访问机器学习数据，你必须使用\
  \ Google Cloud Storage。也就是说，ML Engine 要求你将所有源文件、依赖项和数据上传到 Cloud Storage。\n\n值得庆幸的是，Cloud\
  \ Storage 易于使用。它将数据存储在称为 *buckets* 的容器中，你可以将存储桶视为云中的目录。存储桶中的每个数据项称为 *object*。\n\n\
  ###### Buckets\n\n你计算机上的文件系统将数据存储在文件中，并使用目录组织文件。Cloud Storage 将数据存储在对象中，并将对象收集在存储桶内。存储桶与目录有很多共同点，但有一个主要区别：存储桶不能嵌套。也就是说，你不能像组织目录那样将存储桶组织成层次结构。\n\
  \n在使用存储桶时，你应熟悉以下三点：\n\n*   涉及 Cloud Storage 的所有加载/存储/删除操作必须至少标识一个目标存储桶。\n*   每个存储桶都有一个全局唯一名称、存储类别和地理位置。\n\
  *   一个项目最多每两秒钟只能创建/删除一次存储桶。\n\n最后一点很重要。创建和删除存储桶需要相当长的时间，因此 Google 建议创建少量持久存储桶并根据需要重复使用。\n\
  \n####### Bucket names\n\n当你访问存储桶时，你需要通过其统一资源标识符（URI）来标识它，该标识符以 `gs://` 开头。存储桶的名称必须在所有\
  \ GCP 项目中唯一，而不仅仅是你的项目。因此，将你的项目 ID 添加到存储桶名称前面是个好主意，例如 `gs://myproject3712_tfbook`。\n\
  \nGCP 对存储桶名称设置了以下标准：\n\n*   存储桶的名称必须多于两个字符且少于 64 个。\n*   存储桶名称中的字符仅限于字母、数字、连字符、下划线和点。\n\
  *   存储桶的名称不能以“goog”开头，且不能包含“google”或“google”的拼写错误。\n\n如果你创建的存储桶名称包含点，Cloud Storage\
  \ 会假设你已将存储桶命名为域名，如 [`www.evilrobot.com`](http://www.evilrobot.com)。好消息是，Cloud Storage\
  \ 将域名式存储桶的最大名称长度扩展到 222 个字符。坏消息是你需要说服 Google 你拥有该域名。\n\n####### Storage classes\
  \ and locations\n\n每个存储桶都有一个存储类别，决定其可用性、定价和存储特性。Table 13-2 列出了四种不同的存储类别及其特性。\n\n\
  TABLE 13-2 Storage Classes of Cloud Storage Buckets\n\n| **Storage Class** || **ID**\
  \ || **Description** |\n| --- | --- | --- |\n| Multi-Regional || `multi_regional`\
  \ || 在广阔区域频繁访问的数据（价格：每月每 GB $0.026） |\n| --- | --- | --- |\n| Regional || `regional`\
  \ || 在有限区域频繁访问的数据（价格：每月每 GB $0.02） |\n| Nearline || `nearline` || 每月访问不超过一次的数据（价格：每月每\
  \ GB $0.01） |\n| Coldline || `coldline` || 每年访问不超过一次的数据（价格：每月每 GB $0.007） |\n\n\
  例如，假设你希望存储桶包含将在全球展示的视频。在这种情况下，你可以创建存储桶并将其存储类别设置为 `multi_regional`。你可以将多区域存储桶的位置设置为以下三个值之一：`eu`、`us`\
  \ 和 `asia`。\n\n如果你的数据仅需在特定区域访问，你应将存储桶的存储类别设置为 Regional。你可以将 Regional 存储桶与 13 个不同位置之一关联，Table\
  \ 13-3 列出了全部。\n\nTABLE 13-3 Location Codes of Regional Buckets\n\n| `us-east1` ||\
  \ `us-east4` || `us-central1` || `us-west1` |\n| --- | --- | --- | --- |\n| `asia-east1`\
  \ || `asia-northeast1` || `asia-southeast1` || `asia-south` |\n| `australia-southeast1`\
  \ || `europe-west1` || `europe-west2` || `europe-west3` |\n| `southamerica-east1`\
  \ ||  ||  ||  |\n\nGoogle 支持的区域列表会定期增加。有关存储类别的最新信息，请访问 GCP 文档 [`http://cloud.google.com/storage/docs/storage-classes`](http://cloud.google.com/storage/docs/storage-classes)。有关存储桶位置的最新信息，请访问\
  \ [`http://cloud.google.com/storage/docs/bucket-locations`](http://cloud.google.com/storage/docs/bucket-locations)。\n\
  \n###### Objects and virtual hierarchy\n\nCloud Storage 存储桶中的每条数据都是一个对象。存储桶可能包含无限数量的对象，但每个对象大小必须为\
  \ 5 TB 或更小。\n\n每个对象都有数据和元数据。当你将文件上传到存储桶时，文件的内容成为对象的数据。对象的元数据保存描述对象的名称-值对。\n\n对象名称的标准比存储桶名称的标准宽松得多：\n\
  \n*   对象的名称可以包含任何有效 Unicode 字符序列。\n*   对象的名称不能包含回车或换行字符。\n*   Google 建议不要在对象名称中使用\
  \ #、\\[、\\]、\\* 或 ?，因为 `gsutil` 将这些字符解释为通配符。\n\n\n\n\n\n一个存储桶的名称必须以字母开头和结尾，但对象的名称可以以斜杠（`/`）开头和结尾。因此，你可以通过以斜杠开头对象的名称来构建对象的虚拟层次结构。\n\
  \n例如，假设你创建了一个名为 `gs://dummies-tfbook` 的存储桶。你可以在存储桶中创建一个名为 `gs://dummies-tfbook/data`\
  \ 的对象，并创建另一个名为 `gs://dummies-tfbook/data/images` 的对象。Cloud Storage 不会识别这些对象之间的任何关系，但人类会理解这些对象形成了一个虚拟层次结构。\n\
  \n###### gsutil 实用工具\n\n`gsutil` 实用工具可让你创建、访问和修改存储桶和对象。在很大程度上，`gsutil` 命令的名称和用途与常见的\
  \ `*nix` 命令相同。\n\nTable 13-4 列出了 `gsutil` 的 13 个命令。要了解更详细的讨论，请访问 Google 的文档 [`https://cloud.google.com/storage/docs/gsutil`](https://cloud.google.com/storage/docs/gsutil)。\n\
  \nTABLE 13-4 gsutil 命令\n\n| **Command** || **Description** |\n| --- | --- |\n| `mb\
  \ [-c class] [-l location]``. [-p proj_id] url…` || 创建新的存储桶 |\n| --- | --- |\n|\
  \ `rb [-f] url…` || 删除存储桶 |\n| `cp [OPTION]… src_url dst_url``cp [OPTION]… src_url…\
  \ dst_url``cp [OPTION]… -I dst_url` || 复制文件和对象 |\n| `mv [-p] src_url dst_url``mv\
  \ [-p] src_url… dst_url``mv [-p] -I dst_url` || 移动对象和/或子目录 |\n| `rm [-f] [-r] url…``rm\
  \ [-f] [-r] –I` || 删除对象 |\n| `ls [-a] [-b] [-d] [-l] [-L] [-r] [-p proj_id] url…`\
  \ || 列出存储桶和对象 |\n| `stat url…` || 显示对象状态 |\n| `rewrite -k [-f] [-r] url…``rewrite\
  \ -k [-f] [-r] –I` || 重写对象 |\n| `du url…` || 显示对象大小使用情况 |\n| `cat [-h] url…` ||\
  \ 将对象连接到标准输出 |\n| `compose gs://bucket/obj1``[gs://bucket/obj2 …]``. gs://bucket/composite`\
  \ || 将多个对象连接成一个 |\n| `[-D] config [-a] [-b] [-e] [-f] [-n]``. [-o <file>] [-r] [-s\
  \ <scope] [-w]` || 获取凭据并创建配置文件 |\n| `web set [-m main_page_suffix]``. [-e error_page]\
  \ bucket_url…``. web get bucket_url` || 将一个或多个存储桶与网页关联 |\n\n其中许多命令很简单，但其中一些值得解释。本讨论探讨了\
  \ `mb`、`cp`/`mv`、`ls`/`stat` 和 `cat`/`compose` 命令。\n\n####### 创建存储桶 (mb)\n\n在将数据上传到\
  \ Cloud Storage 之前，你需要创建一个或多个存储桶。需要了解的命令是 `mb`：\n\n```\ngsutil mb [-c class] [-l\
  \ location] [-p project_id] url…\n```\n\n`–c`、`–l` 和 `–p` 标志特别重要：\n\n*   `-c`：存储桶的存储类别：`multi_regional`、`regional`、`nearline`\
  \ 和 `coldline`。 （默认值：`multi_regional` 或 `regional`）。\n*   `-l`：存储桶的多区域位置或区域位置。 （默认值：`us`）。\n\
  *   `-p`：项目的 ID。 （默认值：gsutil 配置文件中的 ID）。\n\n例如，以下命令创建一个名为 `gs://dummies123-tfbook/example`\
  \ 的区域存储桶，并将其与 `us-central1` 区域关联。\n\n```\ngsutil mb -c regional -l us-central1 gs://dummies123-tfbook/example\n\
  ```\n\n####### 复制 (cp) 和移动 (mv)\n\n创建存储桶后，你可以将文件上传到其中，从而向存储桶添加对象。同样，你可以将对象下载到系统作为文件。Google\
  \ 通过 `cp`（复制）和 `mv`（移动）命令使这些操作成为可能。两个命令都将源实体传输到目标，但 `cp` 会保留源实体，而 `mv` 会删除源实体。\n\
  \n了解这些命令的最佳方法是查看一些示例。以下命令将本地文件 `hello.txt` 上传到名为 `gs://newbucket` 的 Cloud Storage\
  \ 存储桶中：\n\n```\ngsutil cp hello.txt gs://newbucket\n```\n\n同样，以下命令将 `hello.txt`\
  \ 从 `gs://newbucket` 移动到开发系统上的当前目录。请注意，`mv` 会从存储桶中删除 `hello.txt`：\n\n```\ngs mv\
  \ gs://newbucket/hello.txt .\n```\n\n`cp` 和 `mv` 接受与 Linux 和 Unix 中的对应命令相同的许多标志。这些标志包括以下内容：\n\
  \n*   `-r`：复制/移动目录及其内容\n*   `-L`：为复制/移动的每个源实体输出日志文件\n*   `-e`：从复制/移动中排除符号链接\n\n\
  例如，以下命令将本地 `mydir` 目录及其内容移动到 `firstbucket`。\n\n```\ngsutil mv -r mydir gs://firstbucket\n\
  ```\n\n此命令将 `mydir` 及其内容从 `firstbucket` 复制到 `secondbucket`：\n\n```\ngsutil cp -re\
  \ gs://firstbucket/mydir gs://secondbucket\n```\n\n由于 `–e` 标志，`gsutil` 不会将 `mydir`\
  \ 中的任何符号链接复制到 `secondbucket`。\n\n####### 读取信息 (ls 和 stat)\n\n`ls` 和 `stat` 命令提供有关\
  \ Cloud Storage 中存储桶和对象的的信息。`ls` 的最简单用法是 `gsutil ls`，它列出与当前 GCP 项目关联的所有存储桶。\n\n\
  `ls` 的一个有趣功能是它识别对象的虚拟层次结构。例如，假设 `gs://mybucket` 包含 `/mydir/a.txt`、`/mydir/b.txt`\
  \ 和 `/newdir/c.txt`。命令 `gsutil ls gs://mybucket` 打印 `/mydir` 和 `/newdir`，但不打印任何底层对象。但如果你设置\
  \ `-r` 标志，存储桶的整个内容将被显示。以下命令演示了这一点：\n\n```\ngsutil ls -r gs://mybucket\n```\n\n另一个有用的标志是\
  \ `-l`，它告诉 `ls` 为每个感兴趣的对象打印详细输出。这些详细信息包括对象大小、创建大小和所有权。`-L` 标志打印更多信息，包括每个感兴趣的对象的\
  \ content type、存储类别和更新时间。\n\n如果你想要有关一个对象的详细信息，`stat` 比 `ls -L` 更有效。例如，以下命令打印 `mybucket/mydir`\
  \ 中 `training.dat` 对象的详细信息：\n\n```\ngsutil stat gs://mybucket/mydir/training.dat\n\
  ```\n\n此命令的退出代码如果对象存在则等于 1，如果不存在则等于 0。`stat` 与 `ls` 之间的一个重要区别是 `stat` 仅提供有关对象的的信息。\n\
  \n####### 串联 (cat 和 compose)\n\n`cat` 将对象的文本定向到标准输出。例如，以下命令打印 `gs://mybucket/a.txt`\
  \ 中包含的文本：\n\n```\ngsutil cat gs://mybucket/a.txt\n```\n\n尽管其名称如此，你不能使用 `cat` 连接对象，但你可以使用\
  \ `compose` 连接对象。也就是说，以下命令将 `gs://mybucket` 中的 `a.txt` 和 `b.txt` 的内容连接起来并将组合结果存储到\
  \ `c.txt` 中：\n\n```\ngsutil compose gs://mybucket/a.txt gs://mybucket/b.txt gs://mybucket/c.txt\n\
  ```\n\n使用 `compose` 时，请记住以下三点：\n\n*   一个项目每秒最多可执行 200 次 `compose` 操作。\n*   一次 `compose`\
  \ 操作最多可组合 32 个实体。\n*   给定对象最多可追加 1,023 次。\n\n![tip](img/tip.png)`compose` 在你必须将非常大的文件上传到\
  \ Cloud Storage 时特别有帮助。无需从一台计算机上传整个文件，你可以从不同的计算机上传文件的各个部分并使用 `compose` 将其组合起来。\n\
  \n##### 部署准备\n\n在提交应用程序进行训练或预测之前，你应该以两种方式准备它：\n\n*   配置应用程序以从 ML Engine 接收命令行参数\n\
  *   将应用程序的文件结构化为一个包\n\n###### 接收参数\n\n当 ML Engine 执行你的应用程序时，它会传递提供有关运行环境的信息的参数。\
  \ Table 13-5 列出了可能的参数。\n\nTABLE 13-5 Machine Learning Arguments\n\n| **Argument**\
  \ || **Operation** |\n| --- | --- |\n| `--job-dir` || 应用程序的数据位置 |\n| --- | --- |\n\
  \n\n\n\n\n| `--train_batch_size` || 训练的批大小 |\n\n| `--train_steps` || 每个训练 epoch\
  \ 的步数 |\n\n| `--eval_batch_size` || 评估的批大小 |\n\n| `--eval_steps` || 在每个检查点运行评估的步数\
  \ |\n\n| `--eval_delay_secs` || 第一次评估前等待的时间 |\n\n| `--min_eval_frequency` || 评估之间训练步数的最小值\
  \ |\n\n`--job-dir` 尤其重要，因为它告诉应用程序应将其输出文件存储在何处。下面的代码演示了如何使用 `ArgumentParser` 访问它：\n\
  \n``` \nif __name__ == '__main__':\n parser = argparse.ArgumentParser()\n parser.add_argument(\n\
  \ '--job-dir',\n help='Checkpoint/output location',\n required=True\n )\n args =\
  \ parser.parse_args()\n```\n\n除了内置参数之外，您还可以提供自己的参数。提交作业时，ML Engine 会将您的参数传递给应用程序。但请记住两点：\n\
  \n* 用户定义的标志必须跟在所有内置标志之后。\n* 两个破折号（`--`）必须将内置标志与用户定义的标志分隔开。\n\n例如，假设您想向应用程序传递两个名为\
  \ `data_dir` 和 `num_epochs` 的参数。执行命令时，您需要在命令末尾设置 `--data_dir` 和 `--num_epochs` 标志，并用\
  \ `--` 将它们与命令的正常标志分隔开。\n\n###### Packaging TensorFlow code\n\n您可以使用命令 `gcloud ml-engine\
  \ jobs submit training` 启动训练操作。执行此操作时，您可以使用 `--package-path` 和 `--module-name` 标志来标识源代码。`--package-path`\
  \ 标志标识包含代码的目录，并且该目录必须满足以下要求：\n\n* 该目录必须包含由 `--module-name` 标识的模块。\n* 父目录必须有一个名为\
  \ `setup.py` 的文件。\n* 父目录下的每个目录都必须有一个名为 `__init__.py` 的文件。此文件通常为空。\n* 开发系统必须安装了 `setuptools`。\n\
  \n最后一点很重要。在上传包之前，ML Engine 使用 `setuptools` 将父目录压缩为 `*.tar.gz` 文件。如果您已安装 `pip`，您可以使用\
  \ `pip install setuptools` 安装 `setuptools`。\n\n####### setup.py\n\n在 Python 包中，`setup.py`\
  \ 包含构建和安装包的说明。如果您希望 ML Engine 安装您的包，`setup.py` 必须执行两个操作：\n\n* 导入 `setuptools.setup`。\n\
  * 调用 `setuptools` 模块的 `setup` 函数。\n\n`setup` 函数接受有关包的大量信息，包括其名称、版本和依赖项。 Table 13-6\
  \ 列出了您可以设置的九个参数。\n\nTABLE 13-6 Parameters of the setup Function\n\n| **Parameter**\
  \ || **描述** |\n\n| --- | --- |\n\n| `name` || 包名 |\n\n| --- | --- |\n\n| `version`\
  \ || 发布版本 |\n\n| `packages` || 依赖包 |\n\n| `install_requires` || 安装包时需要安装的包 |\n\n\
  | `author` || 包作者姓名 |\n\n| `author_email` || 作者的电子邮件地址 |\n\n| `url` || 包的主页 |\n\n\
  | `description` || 包的简短描述 |\n\n| `license` || 包的许可证 |\n\n与其列出包的依赖项，您可以调用 `setuptools`\
  \ 提供的 `find_packages`。 Listing 13-1 展示了 `ch13/cloud_mnist` 文件夹中 `setup.py` 文件的内容：\n\
  \nLISTING 13-1 Setup Script for a Machine Learning Package\n\n```\nfrom setuptools\
  \ import find_packages\nfrom setuptools import setup\n\nREQUIRED_PACKAGES = ['tensorflow>=1.3']\n\
  \nsetup(\n name='trainer',\n version='0.1',\n install_requires=REQUIRED_PACKAGES,\n\
  \ packages=find_packages(),\n include_package_data=True,\n author='Matthew Scarpino'\n\
  \ description='Running MNIST classification in the cloud'\n)\n```\n\n不幸的是，ML Engine\
  \ 并非总是安装最新版本的包。截至本文撰写时，当前的 TensorFlow 版本是 1.4，但 ML Engine 支持的默认版本是 1.2。\n\n您可以通过设置\
  \ `install_requires` 字段来请求特定版本的包。在 Listing 13-1 中，此字段请求 TensorFlow 版本大于或等于 1.3。有关支持版本的更多信息，请访问网站\
  \ [`http://cloud.google.com/ml-engine/docs/runtime-version-list`](http://cloud.google.com/ml-engine/docs/runtime-version-list)。\n\
  \n##### Executing Applications with the Cloud SDK\n\n如果您了解如何使用 Cloud SDK、将数据传输到\
  \ Cloud Storage 以及以包的形式构建应用程序，那么您就可以开始使用 Cloud SDK 启动作业了。\n\nML Engine 支持两种类型的作业：训练和预测。尽管名称如此，训练作业不一定进行训练，预测作业也不一定进行预测。它们之间的区别在于输入的性质。训练作业期望\
  \ Python 包作为输入，而预测作业期望存储为 `SavedModel` 的机器学习模型。 Chapter 5 介绍了 `SavedModel` 以及访问它们的方法。\n\
  \n###### Local execution\n\n本章重点介绍云计算，因此使用 Cloud SDK 在本地启动作业似乎很奇怪。但 ML Engine 既不简单也不免费，因此我建议您在部署到云之前先在本地测试应用程序。执行代码的另一个原因是，您可以在命令行上查看打印的文本，而不必下载并阅读日志。\n\
  \n您可以通过输入以下其中一个命令在开发系统上启动作业：\n\n* `gcloud ml-engine local train`: 在本地运行训练作业\n* `gcloud\
  \ ml-engine local predict`: 在本地运行预测作业\n\n这些命令实现不同的结果并接受不同的配置标志。\n\n####### Running\
  \ a local training job\n\nGCP 训练作业执行 Python 包并在 `--job-dir` 标志指定的目录中生成输出。 Table\
  \ 13-7 列出了 `--job-dir` 以及可为本地训练作业设置的其它标志。\n\nTABLE 13-7 Flags for Local Training\n\
  \n| **Flag** || **描述** |\n\n| --- | --- |\n\n| `--module-name=MODULE_NAME` || 标识要执行的模块\
  \ |\n\n| --- | --- |\n\n| `--package-path=PACKAGE_PATH` || 包含要执行模块的 Python 包的路径\
  \ |\n\n| `--job-dir=JOB_DIR` || 存储训练输出的路径 |\n\n| `--distributed` || 以分布式模式运行代码 |\n\
  \n| `--parameter-server-count=``PARAMETER_SERVER_COUNT` || 要运行的参数服务器数量 |\n\n| `--start-port=START_PORT`\
  \ || 本地集群保留的端口范围的起始位置 |\n\n| `--worker-count=WORKER_COUNT` || 要运行的工作器数量 |\n\n`--package-path`\
  \ 标志标识包的顶级目录。这是包含包的 `setup.py` 文件的目录。`--module-name` 标志标识包内要执行的模块。\n\n如果您想亲自尝试，请将\
  \ `ch12` 目录中的 `mnist_train.tfrecord`s 和 `mnist_test.tfrecords` 文件复制到 `ch13` 目录。然后进入\
  \ `ch13/cloud_mnist` 目录并输入以下命令：\n\n`gcloud ml-engine local train --module-name trainer.task--package-path\
  \ trainer --job-dir output ----data_dir ../images`\n\n\n\n\n\n在此命令中，`--package-path`\
  \ 表示 `trainer` 目录代表一个包，而 `--module-name` 表示该包的模块名称为 `trainer.task`。`--job-dir` 标志告诉应用程序将其结果存储在名为\
  \ `output` 的目录中。\n\n两个破折号（`--`）将 `--job-dir` 与 `--data_dir` 分开。这表示 `--data_dir`\
  \ 及之后的所有标志均由用户定义。\n\n###### 运行本地预测任务\n\n训练完成后，您可以通过执行 `gcloud ml-engine local predict`\
  \ 启动本地预测任务。 表 13-8 列出了您可以设置的各种标志。\n\nTABLE 13-8 本地预测标志\n\n| **Flag** || **Description**\
  \ |\n\n| --- | --- |\n\n| `--model-dir=MODEL_DIR` || 模型的路径 |\n\n| --- | --- |\n\n\
  | `--json-instances=JSON_INSTANCES` || 包含 JSON 格式预测数据的本地文件路径 |\n\n| `--text-instances=TEXT_INSTANCES`\
  \ || 包含纯文本预测数据的本地文件路径 |\n\n您应将 `--model-dir` 标志分配给包含训练操作输出的目录。此外，您需要使用 `--json-instances`\
  \ 或 `--text-instances` 标志来标识预测参数。\n\n##### 部署到云端\n\n如果您已成功在本地启动任务，将应用程序部署到云端不应有任何困难。但请注意两个问题：\n\
  \n*   您需要将训练/评估数据上传到 Cloud Storage。\n*   ML Engine 可能不支持您需要的软件包版本。\n\n在执行 `ch13`\
  \ 目录中的任一应用程序之前，您需要将 `mnist_test.tfrecords` 和 `mnist_train.tfrecords` 文件上传到 Cloud\
  \ Storage 存储桶中。例如，如果您的项目 ID 为 `$(PROJECT_ID)`，您可以使用以下命令在美国中部创建一个名为 `$(PROJECT_ID)_mnist`\
  \ 的存储桶：\n\n```\ngsutil mb -c regional -l us-central1 gs://$(PROJECT_ID)_mnist\n\
  ```\n\n创建存储桶后，您可以使用以下命令将两个 `MNIST` 文件上传到存储桶中：\n\n```\ngsutil cp mnist_test.tfrecords\
  \ mnist_train.tfrecords gs://$(PROJECT_ID)_mnist\n```\n\n命令执行后，最好检查 Cloud Storage\
  \ 是否为这两个文件创建了对象。您可以通过运行命令 `gsutil ls gs://$(PROJECT_ID)_mnist` 来验证这一点。\n\n######\
  \ 运行远程训练任务\n\n上传测试/评估数据后，您可以使用以下命令启动训练任务：\n\n```\ngcloud ml-engine jobs submit training\
  \ $(JOB_ID)\n```\n\n`$(JOB_ID)` 为训练任务提供唯一标识符。启动任务后，您可以使用此 ID 检查任务的状态。\n\n除了标识任务之外，您还需要告诉\
  \ ML Engine 在何处查找您的软件包和输入数据。您还需要告诉引擎应将输出文件存储在何处。您可以通过在命令后跟随标志来提供此信息，而 表 13-9 列出了其中的每一个。\n\
  \nTABLE 13-9 云训练任务标志\n\n| **Flag** || **Description** |\n\n| --- | --- |\n\n| `--module-name=MODULE_NAME`\
  \ || 标识要执行的模块 |\n\n| --- | --- |\n\n| `--package-path=PACKAGE_PATH` || 包含要执行模块的\
  \ Python 软件包的路径 |\n\n| `--job-dir=JOB_DIR` || 存储输出文件的路径 |\n\n| `--staging-bucket=STAGING_BUCKET`\
  \ || 操作期间保存软件包的存储桶 |\n\n| `--region=REGION` || 机器学习任务的区域 |\n\n| `--runtime-version=RUNTIME_VERSION`\
  \ || 任务的 ML Engine 版本 |\n\n| `--stream-logs` || 阻塞直到任务完成并流式传输日志 |\n\n| `--scale-tier=SCALE_TIER`\
  \ || 任务的运行环境 |\n\n| `--config=CONFIG` || 任务配置文件路径 |\n\n`--module-name`、`--package-path`\
  \ 和 `--job-dir` 标志的作用与本地训练任务中同名标志相同。`--staging-bucket` 标志标识保存已部署软件包的存储桶。`--region`\
  \ 标志接受 表 13-3 中列出的区域之一。\n\n默认情况下，已部署的应用程序在 ML Engine 的最新稳定版本上运行。您可以通过设置 `--runtime-version`\
  \ 标志来配置此项。您可以在 `cloud.google.com/ml-engine/docs/runtime-version-list` 获取版本列表。\n\n\
  我更喜欢设置 `--stream-logs` 标志，因为它会强制命令阻塞直到任务完成。随着任务的运行，控制台会打印远程日志中的消息。中止命令（`Ctrl-C`）不会影响远程任务。\n\
  \n默认情况下，上传到 ML Engine 的应用程序只能在单个 CPU 上运行。您可以通过将 `--scale-tier` 标志设置为 表 13-10 中列出的值之一来配置执行环境。\n\
  \nTABLE 13-10 规模层级值\n\n| **Value** || **Description** |\n\n| --- | --- |\n\n| `basic`\
  \ || CPU 上的单个工作器 |\n\n| --- | --- |\n\n| `basic-gpu` || 带有 GPU 的单个工作器 |\n\n| `basic-tpu`\
  \ || 带有 Cloud TPU 的单个工作器实例 |\n\n| `standard-1` || 多个工作器和少数参数服务器 |\n\n| `premium-1`\
  \ || 大量工作器和许多参数服务器 |\n\n| `custom` || 定义集群 |\n\n如果您将 `--scale-tier` 设置为 `basic-gpu`，您可以在\
  \ Nvidia Tesla K80 GPU 上执行代码。该 GPU 具有 4,992 个 CUDA 核心和 24 GB GDDR5 内存。如果您将 `--scale-tier`\
  \ 设置为 `basic-tpu`，您可以在一个或多个 Google 的张量处理单元（`TPUs`）上执行代码。截至本文撰写时，Google 将 TPU 访问限制在其\
  \ Cloud TPU 计划的开发人员，您可以在 [`http://cloud.google.com/tpu`](http://cloud.google.com/tpu)\
  \ 了解有关该计划的更多信息。\n\n如果您将 `--scale-tier` 设置为 `standard-1` 或 `premium-1`，您可以在处理器集群上运行任务。如果您将\
  \ `--scale-tier` 设置为 `custom`，您可以通过将 `--config` 标志分配给配置文件名称来配置集群。\n\n###### 运行远程预测任务\n\
  \n第 5 章 介绍了 `SavedModel`，如果您将 `SavedModel` 上传到 Cloud Storage 存储桶，您可以使用以下命令启动预测任务：\n\
  \n```\ngcloud ml-engine jobs submit prediction $(JOB_ID)\n```\n\n此命令接受指定预测任务应读取输入和写入输出位置的标志。\
  \ 表 13-11 列出了这些标志中的每一个。\n\nTABLE 13-11 云预测任务标志\n\n| **Flag** || **Description**\
  \ |\n\n| --- | --- |\n\n| `--model-dir=MODEL_DIR` || 包含已保存模型的存储桶路径 |\n\n| --- |\
  \ --- |\n\n| `--model=MODEL` || 用于预测的模型名称 |\n\n| `--input-paths=INPUT_PATH, [INPUT_PATH,…]`\
  \ || 用于预测的输入数据路径 |\n\n| `--data-format=DATA_FORMAT` || 输入数据的格式 |\n\n| `--output-path=OUTPUT_PATH`\
  \ || 存储预测结果的路径 |\n\n| `--region=REGION` || 机器学习任务的区域 |\n\n| `--batch-size=BATCH_SIZE`\
  \ || 每批记录数 |\n\n| `--max-worker-count=MAX_WORKER_COUNT` || 用于并行处理的最多工作器数 |\n\n|\
  \ `--runtime-version=RUNTIME_VERSION` || 任务的 ML Engine 版本 |\n\n| `--version=VERSION`\
  \ || 要使用的模型版本 |\n\n当您启动远程预测任务时，您必须使用 `--model` 标识模型名称或使用 `--model-dir` 标识包含模型文件的存储桶。您还需要使用\
  \ `--input-paths` 标识输入文件的位置。\n\nML Engine 接受三种格式的预测输入数据。您可以通过将 `--data-format` 设置为以下值之一来标识您的数据格式：\n\
  \n*   `text`: 每行一个实例的文本文件\n*   `tf-record`: TFRecord 文件\n\n\n\n\n`tf-record-gzip`:\
  \ GZIP 压缩的 TFRecord 文件\n\n最后一个必需的标志是 `--output-path`。它告诉 ML Engine 预测结果应包含在哪个 Cloud\
  \ Storage 存储桶中。\n\n####### 查看作业状态\n\n启动作业后，您可以通过两种方式查看作业的状态。首先，您可以使用 `gcloud` 命令，例如以下命令：\n\
  \n*   `gcloud ml-engine jobs list`：列出与默认项目关联的作业及其状态和创建时间\n*   `gcloud ml-engine\
  \ jobs describe $(JOB_ID) --summarize`：以人类可读格式提供有关特定作业的详细信息\n\n当我想检查作业时，我更喜欢访问 Google\
  \ Cloud Console。如果您点击左上角的菜单栏并向下滚动，您会看到一个名为 ML Engine 的条目。该条目提供两个选项：Jobs 和 Models。\n\
  \n如果您点击 ML Engine ⇒ Jobs 选项，页面会列出与该项目关联的所有作业。如果您点击作业名称，新的页面会提供有关作业执行的详细信息，包括其状态和任何日志消息。\n\
  \n##### 在云中配置集群\n\n默认情况下，GCP 作业在单个 CPU 上执行。但如果您将 `--scale-tier` 设置为 `custom`，您就可以启动作业在处理器集群上执行。您可以通过将\
  \ `--config` 标志跟上配置文件的名称来配置集群及其处理的性质。\n\n您可以使用 YAML（YAML Ain't Markup Language）或\
  \ JSON（JavaScript Object Notation）格式化配置文件。如果配置文件中的设置与命令行标志冲突，作业将使用文件中的设置。Table 13-12\
  \ 列出了配置训练和预测的四个字段。\n\nTABLE 13-12 训练/预测配置字段\n\n| **Field** || **Type** || **Description**\
  \ |\n| --- | --- | --- |\n| `trainingInput` || `TrainingInput` || 创建训练作业的输入参数 |\n\
  | --- | --- | --- |\n| `trainingOutput` || `TrainingOutput` || 当前训练作业的结果 |\n| `predictionInput`\
  \ || `PredictionInput` || 创建预测作业的输入参数 |\n| `predictionOutput` || `PredictionOutput`\
  \ || 当前预测作业的结果 |\n\n配置文件最多可以提供一个输入对象和最多一个输出对象。如果您正在启动训练作业，您可能希望将 `trainingInput`\
  \ 字段设置为 `TrainingInput` 和/或将 `trainingOutput` 字段设置为 `TrainingOutput`。如果您正在启动预测作业，您可能希望将\
  \ `predictionInput` 字段设置为 `PredictionInput` 和/或将 `predictionOutput` 字段设置为 `PredictionOutput`。\n\
  \n###### 设置训练输入\n\n`TrainingInput` 提供有关您想要执行的训练的信息，并配置集群以执行训练作业。Table 13-13 列出了您可以设置的字段。\n\
  \nTABLE 13-13 TrainingInput 字段\n\n| **Field** || **Type** || **Description** |\n\
  | --- | --- | --- |\n| `scaleTier` || `ScaleTier` || 作业的执行平台 |\n| --- | --- | ---\
  \ |\n| `masterType` || `string` || 主节点的机器类型 |\n| `workerType` || `string` || 工作节点的机器类型\
  \ |\n| `parameterServerType` || `string` || 参数服务器的机器类型 |\n| `workerCount` || `string`\
  \ || 集群中的工作节点数量 |\n| `parameterServerCount` || `string` || 集群中的参数服务器数量 |\n| `packageUris`\
  \ || `string` || 应用程序包和依赖项的位置 |\n| `pythonModule` || `string` || 安装包后运行的模块 |\n|\
  \ `args` || `[ string ]` || 传递给模块的命令行参数 |\n| `hyperpameters` || `HyperparameterSpec`\
  \ || 指定训练期间要优化的参数 |\n| `region` || `string` || 运行作业的目标区域 |\n| `jobDir` || `string`\
  \ || 包含训练输出的云存储路径 |\n| `runtimeVersion` || `string` || 用于训练的 Cloud ML Engine 版本\
  \ |\n\n`scaleTier` 字段指定集群所需的执行环境，并且接受与 `--scale-tier` 标志相同的值。`masterType`、`serverType`\
  \ 和 `parameterServerType` 字段更具体，并标识应用于给定角色的虚拟机类型。您可以将每个字段设置为以下十个字符串之一：\n\n*   `standard`：适用于小型到中等数据集的基础配置\n\
  *   `large_model`：适用于具有大型数据集和许多隐藏层的模型的高内存配置\n*   `complex_model_s`：提供比 `standard`\
  \ 配置更大的计算能力\n*   `complex_model_m`：核心数量和内存量是 `complex_model_s` 配置的两倍\n*   `complex_model_l`：核心数量和内存量是\
  \ `complex_model_m` 配置的两倍\n*   `standard_gpu`：类似于 `standard` 配置，但提供对 Nvidia Tesla\
  \ K80 GPU 的访问\n*   `complex_model_m_gpu`：类似于 `standard` 配置，但提供对四块 Nvidia Tesla K80\
  \ GPU 的访问\n*   `complex_model_l_gpu`：类似于 `standard` 配置，但提供对四块 Nvidia Tesla K80 GPU\
  \ 的访问\n*   `standard_p100`：类似于 `standard` 配置，但提供对 Nvidia Tesla P100 GPU 的访问\n* \
  \  `complex_model_m_p100`：类似于 `standard` 配置，但提供对四块 Nvidia Tesla P100 GPU 的访问\n\n\
  您可以通过将 `hyperparameters` 字段设置为 `HyperparameterSpec` 数组来标识训练的特定参数。每个 `HyperparameterSpec`\
  \ 有四个字段：\n\n*   `goal`：优化的性质（`MAXIMIZE` 或 `MINIMIZE`）\n*   `params`：`ParameterSpec`\
  \ 数组，标识训练期间要优化的参数\n*   `maxParallelTrials`：并行执行的训练运行的最大数量\n*   `hyperparameterMetricTag`：优化的标识符。TensorBoard\
  \ 使用此标签来标记优化过程\n\n`HyperparameterSpec` 标识一个或多个训练作业要优化的参数。您可以通过将 `params` 字段设置为 `ParameterSpec`\
  \ 列表来标识感兴趣的参数。每个 `ParameterSpec` 有七个字段：\n\n*   `parameterName`：参数的名称，必须在 `HyperparameterSpec`\
  \ 中的所有参数中唯一\n*   `type`：参数的数据类型，可以是 `INTEGER`、`DOUBLE`、`DISCRETE`、`CATEGORICAL`\
  \ 或 `PARAMETER_TYPE_UNSPECIFIED`\n*   `minValue`：参数的最小值（`INTEGER` 或 `DOUBLE` 参数必需）\n\
  *   `maxValue`：参数的最大值（`INTEGER` 或 `DOUBLE` 参数必需）\n*   `categoricalValues`：标识不同类别的字符串列表（`CATEGORICAL`\
  \ 参数必需）\n*   `discreteValues`：标识参数的不同离散值的数字列表（`DISCRETE` 参数必需）\n*   `scaleType`：应应用的缩放的性质（可以是\
  \ `NONE`、`UNIT_LINEAR_SCALE`、`UNIT_LOG_SCALE` 或 `UNIT_REVERSE_LOG_SCALE`）\n\n`ch13/cluster_mnist`\
  \ 包与 `ch13/cloud_mnist` 包类似。唯一的区别是它使用配置文件来定义自定义集群。Listing 13-2 展示了 `ch13/cluster_mnist/config.yaml`\
  \ 的内容。\n\nLISTING 13-2 自定义集群执行的配置文件\n\n```\ntrainingInput:\n scaleTier: CUSTOM\n\
  \ masterType: standard\n workerType: standard\n parameterServerType: standard\n\
  \ workerCount: 4\n parameterServerCount: 2\n```\n\n此配置文件告诉 ML Engine 使用四个工作节点和两个参数服务器执行作业。它还说明工作节点和参数服务器应在标准系统上执行。\n\
  \n###### 获取训练输出\n\n\n\n\n\n你可以通过将配置文件中的 `trainingOutput` 字段设置为 `TrainingOutput`\
  \ 来配置训练作业如何产生输出。 表 13-14 列出了可能的字段。\n\nTABLE 13-14 TrainingOutput Fields\n\n| **Field**\
  \ || **Type** || **Description** |\n| --- | --- | --- |\n| `completedTrialCount`\
  \ || `string` || 成功完成的超参数试验次数 |\n| --- | --- | --- |\n| `trials` || `[ { HyperParameterOutput\
  \ } ]` || 超参数试验的结果 |\n| `consumedMlUnits` || `number` || 作业执行期间消耗的机器学习引擎单元数 |\n\
  | `isHyperparameterTuningJob` || `boolean` || 作业是否调优了超参数 |\n\n如果将 `TrainingInput`\
  \ 的 `hyperparameters` 字段设置好，你可以在 `TrainingOutput` 的 `trials` 字段中访问结果。这是一个 `HyperparameterOutput`\
  \ 列表，每个 `HyperparameterOutput` 都有四个字段：\n* `trialId`: 标识试验的字符串\n* `hyperparameters`:\
  \ 将参数名称与训练值关联的字典\n* `finalMetric`: 标识试验最终目标指标的 `HyperparameterMetric`\n* `allMetrics`:\
  \ 包含试验所有记录对象指标的 `HyperparameterMetric` 列表\n\nML 引擎以 `HyperparameterMetric` 的形式提供训练指标，每个\
  \ `HyperparmeterMetric` 都有两个字段：`trainingStep` 和 `objectiveValue`。 `trainingStep`\
  \ 字段标识全局训练步骤，`objectiveValue` 标识给定步骤处的目标值。\n\n###### Setting the prediction input\n\
  \n你可以通过将文件的 `predictionInput` 字段设置为 `PredictionInput` 来配置预测作业的输入。 表 13-15 列出了可在\
  \ `PredictionInput` 中设置的字段。\n\nTABLE 13-15 PredictionInput Fields\n\n| **Field**\
  \ || **Type** || **Description** |\n| --- | --- | --- |\n| `dataFormat` || `DataFormat`\
  \ || 数据文件的格式 |\n| --- | --- | --- |\n| `inputPaths` || `[ string ]` || 包含数据文件的云存储桶\
  \ |\n| `outputPath` || `string` || 用于存储输出文件的云存储位置 |\n| `maxWorkerCount` || `string`\
  \ || 用于并行处理的最多工作节点数 |\n| `region` || `string` || 启动预测作业的区域 |\n| `runtimeVersion`\
  \ || `string` || 用于训练的 Cloud ML Engine 版本 |\n| `batchSize` || `string` || 每个批次处理的记录数\
  \ |\n| `modelName` || `string` || 模型的完整名称 |\n| `versionName` || `string` || 用于预测的模型版本\
  \ |\n| `uri` || `string` || 模型的云存储位置 |\n\n要执行预测作业，你需要提供一个 `SavedModel` 和包含输入数据的文件。你可以通过设置前两个字段\
  \ `dataFormat` 和 `inputPaths` 来标识输入数据的格式和位置。要指定数据的格式，你需要将 `dataFormat` 设置为 `TEXT`、`JSON`、`TF_RECORD`、`TF_RECORD_GZIP`\
  \ 或 `DATA_FORMAT_UNSPECIFIED`。\n\n最后三个条目构成一个联合，称为 `model_version`，因此在 `PredictionInput`\
  \ 中只能设置其中一个。你可以通过将 `modelName` 设置为以下格式的字符串来标识你的模型：\n\n```\nprojects/<var>[YOUR_PROJECT]</var>/models/<var>[YOUR_MODEL]</var>\n\
  ```\n\n如果使用 `versionName` 标识你的模型，你需要提供一个略有不同的字符串：\n\n```\nprojects/<var>[YOUR_PROJECT]</var>/models/<var>YOUR_MODEL/versions/<var>[YOUR_VERSION]</var>\n\
  ```\n\n如果云存储桶中只包含一个模型，你只需将 `uri` 字段设置为桶的位置即可。\n\n###### Obtaining the prediction\
  \ output\n\n你可以通过将文件的 `predictionOutput` 字段设置为 `PredictionOutput` 来配置预测作业的输出。 表\
  \ 13-16 列出了可设置的字段。\n\nTABLE 13-16 PredictionOutput Fields\n\n| **Field** || **Type**\
  \ || **Description** |\n| --- | --- | --- |\n| `outputPath` || `string` || 用于存储预测输出的云存储位置\
  \ |\n| --- | --- | --- |\n| `predictionCount` || `string` || 生成的预测数量 |\n| `errorCount`\
  \ || `string` || 产生错误的实例数量 |\n| `nodeHours` || `number` || 预测作业消耗的节点小时数 |\n\n这些字段易于理解和使用。\
  \ `nodeHours` 字段提供了作业使用的节点数与完成作业所需小时数的乘积。\n\n## Part 4\n\n### The Part of Tens\n\
  \nIN THIS PART …\n探索 TensorFlow 框架提供的十个最重要的 Python 类。\n揭示在机器学习应用中训练神经网络时应遵循的有用指南。\n\
  \n#### Chapter 14\n\n#### The Ten Most Important Classes\n\nIN THIS CHAPTER\n![check](img/check.png)**Exploring\
  \ fundamental classes of the TensorFlow API**\n![check](img/check.png)**Storing\
  \ tensors and operations in graphs**\n![check](img/check.png)**Using estimators\
  \ and iterators**\n\nTensorFlow API 庞大，包含数百个包和数千个模块。鉴于其规模，新手可能很难知道应重点研究哪些类。为了解决这种困惑，我挑选了\
  \ TensorFlow 的十个最重要的类，并解释该类实现的功能以及它为何如此重要。\n\n##### Tensor\n\n张量在 TensorFlow 开发中发挥着核心作用，是存储和操作数据的首要对象。优化器只接受包含在张量中的数据，图像处理函数要求图像以张量的形式提供。所有神经网络层，从密集层到\
  \ dropout 层，都接受张量作为输入并返回张量作为输出。\n\n张量充当 N 维数组，其中 N 可以为零或更多。张量的维度数称为张量的 *rank*，每个维度的大小称为张量的\
  \ *shape*。例如，3-x-5 矩阵的形状为 `[3, 5]`，而大小为 200 x 200 的 RGB 图像将由形状为 `[200, 200, 3]`\
  \ 的张量表示。\n\nTensorFlow 提供了数百个用于创建、转换和处理张量的函数（参见 Chapter 3）。你可以通过调用 `tf.constant`\
  \ 创建具有常量值的张量，也可以通过调用 `tf.random_normal` 或 `tf.random_uniform` 创建具有随机值的张量。你可以用 `tf.reshape`\
  \ 重塑张量，并用 `tf.slice` 提取张量的部分。\n\n##### Operation\n\n当 Python 解释器到达对张量进行操作的函数时，它不会立即执行该操作。相反，它会创建\
  \ `Operation` 类的实例来表示该操作。每个 `Operation` 都有一个名为 `inputs` 的属性，包含其输入张量，以及一个名为 `outputs`\
  \ 的属性，包含其输出张量。\n\n每个 `Operation` 都有一个名为 `type` 的属性，通常设置为创建它的函数。例如，如果你调用 `tf.add`，相应的操作将把其\
  \ `type` 设置为 `add`。\n\n其他数学运算包括 `tf.divide`、`tf.round` 和 `tf.sqrt`。TensorFlow 还支持传统的矩阵运算，包括\
  \ `tf.matmul`、`tf.diag` 和 `tf.matrix_solve`。\n\n##### Graph\n\nTensorFlow 为应用程序中的每个张量创建一个\
  \ `Tensor` 实例，为涉及张量的每个操作创建一个 `Operation`。它将这些 `Tensor` 和 `Operation` 存储在称为 `Graph`\
  \ 的数据结构中。一次只能有一个 `Graph` 处于活动状态，你可以通过调用 `as_default` 使新的 `Graph` 处于活动状态。\n\n\n\n\
  \n\n`Graph` 类提供了一系列用于访问图中包含的数据的方法。你可以使用 `get_tensor_by_name` 访问特定的张量，或通过调用 `get_operations`\
  \ 访问图中的所有操作。\n\n每个 `Graph` 将数据存储在一系列称为 `collections` 的容器中。每个集合都可以通过特定的键访问，而 `get_all_collection_keys`\
  \ 提供了所有键的完整列表。例如，图将其全局变量存储在键为 `tf.GraphKeys.GLOBAL_VARIABLES` 的集合中。\n\n##### Session\n\
  \n在你向图添加张量和操作后，可以通过创建并运行会话来执行图的操作。你可以通过调用 `tf.Session` 创建一个会话，然后通过调用其 `run` 方法启动会话。\n\
  \n`run` 方法的第一个参数告诉会话要执行何种处理。如果该参数包含张量，会话将计算每个张量的元素并以 NumPy 数组的形式返回元素。如果该参数包含 `Operation`，会话将执行每个操作并返回适当的结果。\n\
  \n如果 StackOverflow 上的问题可以说明什么，那么 `run` 的 `feed_dict` 会让许多开发者感到困惑。该参数接受一个字典，将值与图中的张量（通常是\
  \ `placeholders`）关联起来。但该字典的值不能是张量。因此，在执行会话之前，使用 NumPy 数组存储和处理输入数据通常是一个好主意。\n\n#####\
  \ Variable\n\n变量在许多方面类似于张量。它们将值存储在 N 维数组中，并且可以使用常规 TensorFlow 操作进行操作。但在训练操作期间，应用程序依赖变量来存储模型的状态。例如，如果一个应用程序由神经网络组成，网络的权重和偏置将作为变量存储。\n\
  \n另一个区别是变量需要与张量不同的[content]\n\n`Graph` 类提供了一系列用于访问图中包含的数据的方法。你可以使用 `get_tensor_by_name`\
  \ 访问特定的张量，或通过调用 `get_operations` 访问图中的所有操作。\n\n每个 `Graph` 将数据存储在一系列称为 `collections`\
  \ 的容器中。每个集合都可以通过特定的键访问，而 `get_all_collection_keys` 提供了所有键的完整列表。例如，图将其全局变量存储在键为 `tf.GraphKeys.GLOBAL_VARIABLES`\
  \ 的集合中。\n\n##### Session\n\n在你向图添加张量和操作后，可以通过创建并运行会话来执行图的操作。你可以通过调用 `tf.Session`\
  \ 创建一个会话，然后通过调用其 `run` 方法启动会话。\n\n`run` 方法的第一个参数告诉会话要执行何种处理。如果该参数包含张量，会话将计算每个张量的元素并以\
  \ NumPy 数组的形式返回元素。如果该参数包含 `Operation`，会话将执行每个操作并返回适当的结果。\n\n如果 StackOverflow 上的问题可以说明什么，那么\
  \ `run` 的 `feed_dict` 会让许多开发者感到困惑。该参数接受一个字典，将值与图中的张量（通常是 `placeholders`）关联起来。但该字典的值不能是张量。因此，在执行会话之前，使用\
  \ NumPy 数组存储和处理输入数据通常是一个好主意。\n\n##### Variable\n\n变量在许多方面类似于张量。它们将值存储在 N 维数组中，并且可以使用常规\
  \ TensorFlow 操作进行操作。但在训练操作期间，应用程序依赖变量来存储模型的状态。例如，如果一个应用程序由神经网络组成，网络的权重和偏置将作为变量存储。\n\
  \n另一个区别是变量需要与张量不同的方法集。例如，在创建 `Variable` 后，你需要通过在会话中运行特殊操作来初始化其值。如果你的应用程序有许多变量，你可以通过调用\
  \ `tf.global_variables_initializer` 获得一个合并的初始化操作。\n\n在低层面上，训练的目标是将应用程序的变量设置为使模型与观测数据一致的值。这些变量至关重要，因此最好使用\
  \ `Saver` 将它们存储到检查点文件中。第 5 章 解释了如何在 TensorFlow 应用程序中创建、初始化和保存变量。\n\n##### Optimizer\n\
  \n应用程序的模型与观测数据之间的差异称为 `loss`。TensorFlow 应用程序使用优化器来降低损失。在代码中，你可以通过实例化 `Optimizer`\
  \ 类的子类来创建优化器。每个优化器都有一个 `minimize` 方法，该方法返回可在会话中执行的操作。\n\nTensorFlow 支持多种不同的优化算法，每种算法都由\
  \ `Optimizer` 的不同子类表示。例如，最简单的优化算法梯度下降法由 `GradientDescentOptimizer` 表示。但最简单的算法很少是最有效的，我建议使用\
  \ `AdamOptimizer` 或 `AdagradOptimizer` 来优化你的应用程序。\n\n##### Estimator\n\n如 第 12 章\
  \ 中所述，估计器极大地简化了开发和部署机器学习算法的过程。当你使用估计器时，你不必担心会话和图。你只需要了解 `Estimator` 类的三个方法：`train`、`evaluate`\
  \ 和 `predict`。\n\n使用估计器的另一个优点是 TensorFlow 提供了许多 `Estimator` 的子类。这些现成的估计器，例如 `LinearRegressor`\
  \ 和 `DNNClassifier`，使训练和测试机器学习变得容易。`DNNLinearCombinedClassifier` 特别有帮助，因为它让你能够利用宽和深学习。\n\
  \n##### Dataset\n\nTensorFlow API 最近的变化之一是将 `tf.contrib.data` 包提升为 `tf.data`。该包提供了至关重要的\
  \ `Dataset` 类，TensorFlow 推荐用于加载和处理数据。该类提供了许多强大的方法用于批处理和转换数据，并且在许多情况下，你可以以多线程方式执行这些操作。\n\
  \n`Dataset` 类也很重要，因为它是 `TextLineDataset` 和 `TFRecordDataset` 的超类。这两个类使从文本文件和 TFRecord\
  \ 文件读取数据变得简单。第 10 章 对这些类及其用法进行了详细讨论。\n\n##### Iterator\n\n`Dataset` 类提供了许多强大的功能，但它不允许你直接访问其数据。要从数据集中提取张量，你需要创建\
  \ `Iterator` 类的实例。\n\nTensorFlow 提供了四种不同的遍历数据集内容的方式。最简单的是一次性迭代器，只能遍历数据集一次。你可以重用可初始化和可重新初始化迭代器，但你需要先运行特殊的初始化操作。可馈送迭代器是最复杂的，但你可以将它们与多个数据集关联，并且在每次迭代之前不需要初始化它们。\n\
  \n##### Saver\n\n训练的目标是确定哪些变量能产生尽可能小的损失。训练可能需要数小时或数天，因此在训练期间和训练后存储变量的值至关重要。TensorFlow\
  \ 通过提供 `Saver` 类使这成为可能。\n\n使用该类很简单。在创建 `Saver` 实例后，你可以调用 `save` 将模型状态存储在编号的检查点文件中。你可以通过调用\
  \ `restore` 方法从检查点文件加载模型的变量。\n\n#### Chapter 15\n\n#### 训练神经网络的十条建议\n\n本章内容\n\n\
  ![check](img/check.png)**预处理数据以确保合适的分析**\n\n![check](img/check.png)**选择神经网络的权重和层**\n\
  \n![check](img/check.png)**选择激活函数以产生可接受的输出**\n\n在大多数软件开发工作中，如果你正确编码，应用程序总会完成其工作。但当你处理神经网络时，情况并非如此。你可以编写完美的代码，但仍然得到糟糕的结果。不管学术界怎么说，神经网络开发并不是一门精确的科学——其中仍然包含很多艺术。\n\
  \n在本章中，我提出了十条建议，可以帮助你提高神经网络的准确性和性能。这些通用规则基于我的经验以及我从其他开发者和研究人员那里学到的东西。但请记住，神经网络永远不是完全可靠的：即使是编码完美的神经网络有时也会失败。\n\
  \n##### 选择一个具有代表性的数据集\n\n这一建议是最简单的，因为它不涉及任何数学或软件开发。关于训练样本，越多越好，但大小不是唯一优先事项。你需要确保你的训练数据集与现实世界相似。此外，如果你的应用程序将样本分类到类别中，你需要确保每个类别都有大量样本。\n\
  \n在图像分类方面，你永远不知道神经网络会关注哪些奇怪的特征。因此，许多开发者会在其输入样本中添加低水平的随机噪声。这种噪声不应模糊图像，但应迫使神经网络关注相关的特征。\n\
  \n##### 标准化你的数据\n\n\n\n\n\n当你测试机器学习应用或将其用于实际预测时，应确保测试数据在统计上与训练数据相似。也就是说，测试/预测数据应具有与训练数据相同的均值和标准差。\n\
  \n如 Chapter 7 中所讨论的，对数据集的均值和标准差进行设定的过程称为标准化。许多应用通过将均值设为 0 并将标准差设为 1 来标准化其数据。在 TensorFlow\
  \ 应用中，你可以通过调用 `tf.nn.moments` 和 `tf.nn.batch_normalization` 来实现这一点。\n\n##### Use\
  \ Proper Weight Initialization\n\n研究人员设计了多种用于初始化神经网络权重的数学方法。其中最流行的方法之一称为 Glorot\
  \ 方法或 Xavier 方法。你可以通过调用 `tf.contrib.layers.xavier_initializer` 在你的应用中使用此方法。\n\n\
  ##### Start with a Small Number of Layers\n\n对于复杂问题，你可能不知道要创建多少个隐藏层。一些开发者认为越大越好，并构建具有许多（超过\
  \ 10 个）隐藏层的神经网络。但这增加了过拟合的可能性，即神经网络专注于特定的训练数据而无法分析通用数据。\n\n为了避免过拟合，最好从小开始。如果准确率不可接受，请增加网络的深度，直到准确率达到合适的数值。除了降低过拟合的可能性外，起步小的方法还能保证比起步大的方法更快的执行速度。\n\
  \n##### Add Dropout Layers\n\n除了密集层之外，我建议你在神经网络中添加 dropout 层。Dropout 层会在将信号作为输出传递之前将其输入的百分比设为\
  \ 0。这通过降低进入 dropout 层的输入的相互依赖性来降低过拟合的可能性。\n\n在 TensorFlow 中，你可以通过调用 `tf.nn.dropout`\
  \ 创建一个 dropout 层。该层接受一个张量，其值标识对应输入应被丢弃的概率。\n\n##### Train with Small, Random Batches\n\
  \n在你预处理数据、初始化权重并确定神经网络的初始结构之后，你就可以开始训练了。与一次性使用整个数据集进行训练不同，你应该将数据拆分为批次。神经网络将在处理每个批次时更新其梯度和权重。\n\
  \n减小批次大小会增加训练时间，但也会降低优化器陷入局部最小值而不是找到全局最小值的可能性。它还降低了分析对样本顺序的依赖性。你可以通过在训练过程中对批次进行洗牌来进一步降低这种依赖性。\n\
  \n##### Normalize Batch Data\n\n即使你对进入神经网络的样本进行了标准化，随着数据从一个隐藏层移动到下一个隐藏层，其均值和方差也会发生变化。因此，开发者会在数据离开每一层后对其进行归一化。\n\
  \n这种归一化涉及将均值设为零并将标准差设为一。但该过程稍微复杂一些，因为你需要近似整个批次的均值和方差。与自己进行数学计算相比，我建议调用 `tf.contrib.layers.batch_norm`。\n\
  \n##### Try Different Optimization Algorithms\n\n你选择的优化器将在决定应用的准确性和性能方面发挥关键作用。在撰写本书时，我在许多在线论坛上搜索了“哪种优化方法最好？”这个问题。但尽管经过数十年的分析，研究人员尚未达成共识。\n\
  \n我个人喜欢从 Adam 和 Adagrad 优化器开始，但如果你没有获得想要的性能和准确性，尝试其他方法是个好主意。在 TensorFlow 应用中，你可以通过创建优化器类的实例，例如\
  \ `tf.train.AdamOptimizer`，调用其 `minimize` 方法，并在会话中运行返回的操作来设置优化方法。\n\n##### Set the\
  \ Right Learning Rate\n\n优化器的学习率决定了优化器在每次训练步骤中如何更新其权重。如果你将学习率设置得过高，优化器会对权重做出剧烈改变，并且可能永远无法收敛到解决方案。如果你将学习率设置得过低，优化器将进展缓慢，并且可能收敛到局部最小值而不是全局最小值。\n\
  \n典型的学习率从 0.0001 到 0.5 不等，但最佳学习率因应用而异。我建议从一个较高的值开始，并反复降低学习率，直到你对应用的准确性和性能感到满意。\n\
  \n##### Check Weights and Gradients\n\n机器学习应用经常失败，因为权重降为零（消失梯度问题）或变得非常大（爆炸梯度问题）。在两种情况下，你可能需要调整网络中的层数和/或每一层的激活函数。\n\
  \n值得庆幸的是，TensorFlow 允许你保存层的权重并使用 TensorBoard 可视化权重。Chapter 4 介绍了 TensorBoard 并解释了如何生成和打印用于可视化的摘要数据。Chapter\
  \ 5 解释了如何使用 TensorBoard 可视化训练结果。\n\n#### About the Author\n\nMatthew Scarpino 几乎\
  \ 20 年来一直是程序员和工程师。除了为图像识别开发神经网络外，他还为国防高级研究计划局（DARPA）设计了模拟人类认知的电路。他目前是 plutocracy.com\
  \ 的首席开发人员，该公司使用机器学习分析金融趋势。\n\nMatthew 于 2018 年成为 Google 认证数据工程师。业余时间，他编程机器人并在 TensorFlow\
