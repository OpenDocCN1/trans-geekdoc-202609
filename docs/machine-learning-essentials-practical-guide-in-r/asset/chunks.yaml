    \ on 5 and 391 DF,  p-value: <2e-16\n```\n\nFor example, it can be seen that being\
    \ from discipline B (applied departments) is significantly associated with an\
    \ average increase of 13473.38 in salary compared to discipline A (theoretical\
    \ departments).\n\n## 6.6 Discussion\n\nIn this chapter we described how categorical\
    \ variables are included in linear regression model. As regression requires numerical\
    \ inputs, categorical variables need to be recoded into a set of binary variables.\n\
    \nWe provide practical examples for the situations where you have categorical\
    \ variables containing two or more levels.\n\nNote that, for categorical variables\
    \ with a large number of levels it might be useful to group together some of the\
    \ levels.\n\nSome categorical variables have levels that are ordered. They can\
    \ be converted to numerical values and used as is. For example, if the professor\
    \ grades (\"AsstProf\", \"AssocProf\" and \"Prof\") have a special meaning, you\
    \ can convert them into numerical values, ordered from low to high, corresponding\
    \ to higher-grade professors.\n\n# 7 Nonlinear Regression\n\n## 7.1 Introduction\n\
    \nIn some cases, the true relationship between the outcome and a predictor variable\
    \ might not be linear.\n\nThere are different solutions extending the linear regression\
    \ model (Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ) for capturing these\
    \ nonlinear effects, including:\n\n*   **Polynomial regression** . This is the\
    \ simple approach to model non-linear relationships. It add polynomial terms or\
    \ quadratic terms (square, cubes, etc) to a regression.\n\n*   **Spline regression**\
    \ . Fits a smooth curve with a series of polynomial segments. The values delimiting\
    \ the spline segments are called **Knots** .\n\n*   **Generalized additive models**\
    \ (GAM). Fits spline models with automated selection of knots.\n\nIn this chapter,\
    \ you'll learn how to compute non-linear regression models and how to compare\
    \ the different models in order to choose the one that fits the best your data.\n\
    \nThe RMSE and the R2 metrics, will be used to compare the different models (see\
    \ Chapter @ref(linear regression)).\n\nRecall that, the RMSE represents the model\
    \ prediction error, that is the average difference the observed outcome values\
    \ and the predicted outcome values. The R2 represents the squared correlation\
    \ between the observed and predicted outcome values. The best model is the model\
    \ with the lowest RMSE and the highest R2.\n\n## 7.2 Loading Required R packages\n\
    \n*   `tidyverse` for easy data manipulation and visualization\n\n*   `caret`\
    \ for easy machine learning workflow\n\n```\n\n```\n\n## 7.3 Preparing the data\n\
    \nWe'll use the `Boston` data set [in `MASS` package], introduced in Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ , for predicting the median house value (`mdev` ), in Boston Suburbs, based\
    \ on the predictor variable `lstat` (percentage of lower status of the population).\n\
    \nWe’ll randomly split the data into training set (80% for building a predictive\
    \ model) and test set (20% for evaluating the model). Make sure to set seed for\
    \ reproducibility.\n\n```\n\n```\n\nFirst, visualize the scatter plot of the `medv`\
    \ vs `lstat` variables as follow:\n\n```\n\n```\n\n![](Image00002.jpg)\n\nThe\
    \ above scatter plot suggests a non-linear relationship between the two variables\n\
    \nIn the following sections, we start by computing linear and non-linear regression\
    \ models. Next, we'll compare the different models in order to choose the best\
    \ one for our data.\n\n## 7.4 Linear regression {linear-reg}\n\nThe standard linear\
    \ regression model equation can be written as `medv = b0 + b1*lstat` .\n\nCompute\
    \ linear regression model:\n\n```\n\n```\n\n```\n##   RMSE    R2\n## 1 6.07 0.535\n\
    ```\n\nVisualize the data:\n\n```\n\n```\n\n![](Image00003.jpg)\n\n## 7.5 Polynomial\
    \ regression\n\nThe polynomial regression adds polynomial or quadratic terms to\
    \ the regression equation as follow:\n\nmedv=b0+b1\\*lstat+b2\\*lstat2medv = b0\
    \ + b1\\*lstat + b2\\*lstat^2\n\nIn R, to create a predictor x^2 you should use\
    \ the function `I()` , as follow: `I(x^2)` . This raise x to the power 2.\n\n\
    The polynomial regression can be computed in R as follow:\n\n```\n\n```\n\nAn\
    \ alternative simple solution is to use this:\n\n```\n\n```\n\n```\n## \n## Call:\n\
    ## lm(formula = medv ~ poly(lstat, 2), data = train.data)\n## \n## Coefficients:\n\
    ##     (Intercept)  poly(lstat, 2)1  poly(lstat, 2)2  \n##            22.7   \
    \        -139.4             57.7\n```\n\nThe output contains two coefficients\
    \ associated with lstat : one for the linear term (lstat^1) and one for the quadratic\
    \ term (lstat^2).\n\nThe following example computes a sixfth-order polynomial\
    \ fit:\n\n```\n\n```\n\n```\n## \n## Call:\n## lm(formula = medv ~ poly(lstat,\
    \ 6), data = train.data)\n## \n## Residuals:\n##    Min     1Q Median     3Q \
    \   Max \n## -14.23  -3.24  -0.74   2.02  26.50 \n## \n## Coefficients:\n##  \
    \               Estimate Std. Error t value Pr(>|t|)    \n## (Intercept)     \
    \  22.739      0.262   86.83  < 2e-16 ***\n## poly(lstat, 6)1 -139.357      5.284\
    \  -26.38  < 2e-16 ***\n## poly(lstat, 6)2   57.728      5.284   10.93  < 2e-16\
    \ ***\n## poly(lstat, 6)3  -25.923      5.284   -4.91  1.4e-06 ***\n## poly(lstat,\
    \ 6)4   21.378      5.284    4.05  6.3e-05 ***\n## poly(lstat, 6)5  -13.817  \
    \    5.284   -2.62   0.0093 ** \n## poly(lstat, 6)6    7.268      5.284    1.38\
    \   0.1697    \n## ---\n## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.'\
    \ 0.1 ' ' 1\n## \n## Residual standard error: 5.28 on 400 degrees of freedom\n\
    ## Multiple R-squared:  0.684,  Adjusted R-squared:  0.679 \n## F-statistic: \
    \ 144 on 6 and 400 DF,  p-value: <2e-16\n```\n\nFrom the output above, it can\
    \ be seen that polynomial terms beyond the fith order are not significant. So,\
    \ just create a fith polynomial regression model as follow:\n\n```\n\n```\n\n\
    ```\n##   RMSE    R2\n## 1 4.96 0.689\n```\n\nVisualize the fith polynomial regression\
    \ line as follow:\n\n```\n\n```\n\n![](Image00004.jpg)\n\n## 7.6 Log transformation\n\
    \nWhen you have a non-linear relationship, you can also try a logarithm transformation\
    \ of the predictor variables:\n\n```\n\n```\n\n```\n##   RMSE    R2\n## 1 5.24\
    \ 0.657\n```\n\nVisualize the data:\n\n```\n\n```\n\n![](Image00005.jpg)\n\n##\
    \ 7.7 Spline regression\n\nPolynomial regression only captures a certain amount\
    \ of curvature in a nonlinear relationship. An alternative, and often superior,\
    \ approach to modeling nonlinear relationships is to use splines (P. Bruce and\
    \ Bruce [2017](#text00039.html#ref-bruce2017) ) ."
