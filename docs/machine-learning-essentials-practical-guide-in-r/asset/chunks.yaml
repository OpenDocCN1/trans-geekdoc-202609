    \ be easily performed using the R package `pROC` .\n\n```\n\n```\n\n![](Image00028.jpg)\n\
    \nThe gray diagonal line represents a classifier no better than random chance.\n\
    \nA highly performant classifier will have an ROC that rises steeply to the top-left\
    \ corner, that is it will correctly identify lots of positives without misclassifying\
    \ lots of negatives as positives.\n\nIn our example, the AUC is 0.85, which is\
    \ close to the maximum ( max = 1). So, our classifier can be considered as very\
    \ good. A classifier that performs no better than chance is expected to have an\
    \ AUC of 0.5 when evaluated on an independent test set not used to train the model.\n\
    \nIf we want a classifier model with a specificity of at least 60%, then the sensitivity\
