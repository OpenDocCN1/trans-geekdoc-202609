- raw: "However, the test data is not always available making the test error very\
    \ difficult to estimate. In this situation, methods such as **cross-validation**\
    \ (Chapter [14](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ) and **bootstrap** (Chapter\
    \ [15](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ) are applied for estimating the test\
    \ error (or the prediction error rate) using training data.\n\n# 14 Cross-validation\n\
    \n## 14.1 Introduction\n\n**Cross-validation** refers to a set of methods for\
    \ measuring the performance of a given predictive model on new test data sets.\n\
    \nThe basic idea, behind cross-validation techniques, consists of dividing the\
    \ data into two sets:\n\n1.  The training set, used to train (i.e. build) the\
    \ model;\n\n2.  and the testing set (or validation set), used to test (i.e. validate)\
    \ the model by estimating the prediction error.\n\nCross-validation is also known\
    \ as a *resampling method* because it involves fitting the same statistical method\
    \ multiple times using different subsets of the data.\n\nIn this chapter, you'll\
    \ learn:\n\n1.  the most commonly used statistical metrics (Chapter [13](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) for measuring the performance of a regression model in predicting the outcome\
    \ of new test data.\n\n2.  The different cross-validation methods for assessing\
    \ model performance. We cover the following approaches: \n\n    *   Validation\
    \ set approach (or data split)\n\n    *   Leave One Out Cross Validation\n\n \
    \   *   k-fold Cross Validation\n\n    *   Repeated k-fold Cross Validation\n\n\
    Each of these methods has their advantages and drawbacks. Use the method that\
    \ best suits your problem. Generally, the (repeated) k-fold cross validation is\
    \ recommended.\n\n3.  Practical examples of R codes for computing cross-validation\
    \ methods.\n\n## 14.2 Loading required R packages\n\n*   `tidyverse` for easy\
    \ data manipulation and visualization  \n\n*   `caret` for easily computing cross-validation\
    \ methods\n\n```\n\n```\n\n## 14.3 Example of data\n\nWe'll use the built-in R\
    \ `swiss` data, introduced in the Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ , for predicting fertility score on the basis of socio-economic indicators.\n\
    \n```\n\n```\n\n## 14.4 Model performance metrics\n\nAfter building a model, we\
    \ are interested in determining the accuracy of this model on predicting the outcome\
    \ for new unseen observations not used to build the model. Put in other words,\
    \ we want to estimate the prediction error.\n\nTo do so, the basic strategy is\
    \ to:\n\n1.  Build the model on a training data set\n\n2.  Apply the model on\
    \ a new test data set to make predictions\n\n3.  Compute the prediction errors\n\
    \nIn Chapter [13](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , we described several statistical\
    \ metrics for quantifying the overall quality of regression models. These include:\n\
    \n*   **R-squared** (R2), representing the squared correlation between the observed\
    \ outcome values and the predicted values by the model. The higher the adjusted\
    \ R2, the better the model.\n\n*   **Root Mean Squared Error** (RMSE), which measures\
    \ the average prediction error made by the model in predicting the outcome for\
    \ an observation. That is, the average difference between the observed known outcome\
    \ values and the values predicted by the model. The lower the RMSE, the better\
    \ the model.\n\n*   **Mean Absolute Error** (MAE), an alternative to the RMSE\
    \ that is less sensitive to outliers. It corresponds to the average absolute difference\
    \ between observed and predicted outcomes. The lower the MAE, the better the model\n\
    \nIn classification setting, the prediction error rate is estimated as the proportion\
    \ of misclassified observations.\n\nR2, RMSE and MAE are used to measure the regression\
    \ model performance during **cross-validation** .\n\nIn the following section,\
    \ we'll explain the basics of cross-validation, and we'll provide practical example\
    \ using mainly the `caret` R package.\n\n## 14.5 Cross-validation methods\n\n\
    Briefly, cross-validation algorithms can be summarized as follow:\n\n1.  Reserve\
    \ a small sample of the data set\n\n2.  Build (or train) the model using the remaining\
    \ part of the data set\n\n3.  Test the effectiveness of the model on the the reserved\
    \ sample of the data set. If the model works well on the test data set, then it's\
    \ good.\n\nThe following sections describe the different cross-validation techniques.\n\
    \n### 14.5.1 The Validation set Approach\n\nThe validation set approach consists\
    \ of randomly splitting the data into two sets: one set is used to train the model\
    \ and the remaining other set sis used to test the model.\n\nThe process works\
    \ as follow:\n\n1.  Build (train) the model on the training data set\n\n2.  Apply\
    \ the model to the test data set to predict the outcome of new unseen observations\n\
    \n3.  Quantify the prediction error as the mean squared difference between the\
    \ observed and the predicted outcome values.\n\nThe example below splits the `swiss`\
    \ data set so that 80% is used for training a linear regression model and 20%\
    \ is used to evaluate the model performance.\n\n```\n\n```\n\n```\n##      R2\
    \ RMSE  MAE\n## 1 0.503 7.79 6.35\n```\n\nWhen comparing two models, the one that\
    \ produces the lowest test sample RMSE is the preferred model.\n\nthe RMSE and\
    \ the MAE are measured in the same scale as the outcome variable. Dividing the\
    \ RMSE by the average value of the outcome variable will give you the prediction\
    \ error rate, which should be as small as possible:\n\n```\n\n```\n\n```\n## [1]\
    \ 0.109\n```\n\nNote that, the validation set method is only useful when you have\
    \ a large data set that can be partitioned. A disadvantage is that we build a\
    \ model on a fraction of the data set only, possibly leaving out some interesting\
    \ information about data, leading to higher bias. Therefore, the test error rate\
    \ can be highly variable, depending on which observations are included in the\
    \ training set and which observations are included in the validation set.\n\n\
    ### 14.5.2 Leave one out cross validation - LOOCV\n\nThis method works as follow:\n\
    \n1.  Leave out one data point and build the model on the rest of the data set\n\
    \n2.  Test the model against the data point that is left out at step 1 and record\
    \ the test error associated with the prediction\n\n3.  Repeat the process for\
    \ all data points\n\n4.  Compute the overall prediction error by taking the average\
    \ of all these test error estimates recorded at step 2.\n\nPractical example in\
    \ R using the `caret` package:\n\n```\n\n```\n\n```\n## Linear Regression \n##\
    \ \n## 47 samples\n##  5 predictor\n## \n## No pre-processing\n## Resampling:\
    \ Leave-One-Out Cross-Validation \n## Summary of sample sizes: 46, 46, 46, 46,\
    \ 46, 46, ... \n## Resampling results:\n## \n##   RMSE  Rsquared  MAE \n##   7.74\
    \  0.613     6.12\n## \n## Tuning parameter 'intercept' was held constant at a\
    \ value of TRUE\n```\n\nThe advantage of the LOOCV method is that we make use\
    \ all data points reducing potential bias.\n\nHowever, the process is repeated\
    \ as many times as there are data points, resulting to a higher execution time\
    \ when n is extremely large.\n\nAdditionally, we test the model performance against\
    \ one data point at each iteration. This might result to higher variation in the\
    \ prediction error, if some data points are outliers. So, we need a good ratio\
    \ of testing data points, a solution provided by the **k-fold cross-validation\
    \ method** .\n\n### 14.5.3 K-fold cross-validation\n\nThe k-fold cross-validation\
    \ method evaluates the model performance on different subset of the training data\
    \ and then calculate the average prediction error rate. The algorithm is as follow:\n\
    \n1.  Randomly split the data set into k-subsets (or k-fold) (for example 5 subsets)\n\
    \n2.  Reserve one subset and train the model on all other subsets\n\n3.  Test\
    \ the model on the reserved subset and record the prediction error\n\n4.  Repeat\
    \ this process until each of the k subsets has served as the test set.\n\n5. \
    \ Compute the average of the k recorded errors. This is called the cross-validation\
    \ error serving as the performance metric for the model.\n\nK-fold cross-validation\
    \ (CV) is a robust method for estimating the accuracy of a model."
