    ```\n\n```\n\n```\n\n## 4.5 Computing linear regression\n\nThe R function `lm()`\
    \ is used to compute linear regression model.\n\n### 4.5.1 Quick start R code\n\
    \n```\n\n```\n\n### 4.5.2 Simple linear regression\n\nThe **simple linear regression**\
    \ is used to predict a continuous outcome variable (y) based on one single predictor\
    \ variable (x).\n\nIn the following example, we'll build a simple linear model\
    \ to predict sales units based on the advertising budget spent on youtube. The\
    \ regression equation can be written as `sales = b0 + b1*youtube` .\n\nThe R function\
    \ `lm()` can be used to determine the beta coefficients of the linear model, as\
    \ follow:\n\n```\n\n```\n\n```\n##             Estimate Std. Error t value Pr(>|t|)\n\
    ## (Intercept)   8.3839    0.62442    13.4 5.22e-28\n## youtube       0.0468 \
    \   0.00301    15.6 7.84e-34\n```\n\nThe output above shows the estimate of the\
    \ regression beta coefficients (column `Estimate` ) and their significance levels\
    \ (column `Pr(>|t|)` . The intercept (`b0` ) is 8.38 and the coefficient of youtube\
    \ variable is 0.046.\n\nThe estimated regression equation can be written as follow:\
    \ `sales = 8.38 + 0.046*youtube` . Using this formula, for each new youtube advertising\
    \ budget, you can predict the number of sale units.\n\nFor example:\n\n*   For\
    \ a youtube advertising budget equal zero, we can expect a sale of 8.38 units.\n\
    \n*   For a youtube advertising budget equal 1000, we can expect a sale of 8.38\
    \ + 0.046\\*1000 = 55 units.\n\nPredictions can be easily made using the R function\
    \ `predict()` . In the following example, we predict sales units for two youtube\
    \ advertising budget: 0 and 1000.\n\n```\n\n```\n\n```\n##     1     2 \n##  8.38\
    \ 55.19\n```\n\n### 4.5.3 Multiple linear regression\n\n**Multiple linear regression**\
    \ is an extension of simple linear regression for predicting an outcome variable\
    \ (y) on the basis of multiple distinct predictor variables (x).\n\nFor example,\
    \ with three predictor variables (x), the prediction of y is expressed by the\
    \ following equation: `y = b0 + b1*x1 + b2*x2 + b3*x3`\n\nThe regression beta\
    \ coefficients measure the association between each predictor variable and the\
    \ outcome. \"b\\_j\" can be interpreted as the average effect on y of a one unit\
    \ increase in \"x\\_j\", holding all other predictors fixed.\n\nIn this section,\
    \ we'll build a multiple regression model to predict sales based on the budget\
    \ invested in three advertising medias: youtube, facebook and newspaper. The formula\
    \ is as follow: `sales = b0 + b1*youtube + b2*facebook + b3*newspaper`\n\nYou\
    \ can compute the multiple regression model coefficients in R as follow:\n\n```\n\
    \n```\n\nNote that, if you have many predictor variables in your data, you can\
    \ simply include all the available variables in the model using `~.` :\n\n```\n\
    \n```\n\n```\n##             Estimate Std. Error t value Pr(>|t|)\n## (Intercept)\
    \  3.39188    0.44062   7.698 1.41e-12\n## youtube      0.04557    0.00159  28.630\
    \ 2.03e-64\n## facebook     0.18694    0.00989  18.905 2.07e-42\n## newspaper\
    \    0.00179    0.00677   0.264 7.92e-01\n```\n\nFrom the output above, the coefficients\
    \ table shows the beta coefficient estimates and their significance levels. Columns\
    \ are:\n\n*   `Estimate` : the intercept (b0) and the beta coefficient estimates\
    \ associated to each predictor variable\n\n*   `Std.Error` : the standard error\
    \ of the coefficient estimates. This represents the accuracy of the coefficients.\
    \ The larger the standard error, the less confident we are about the estimate.\n\
    \n*   `t value` : the t-statistic, which is the coefficient estimate (column 2)\
    \ divided by the standard error of the estimate (column 3)\n\n*   `Pr(>|t|)` :\
    \ The p-value corresponding to the t-statistic. The smaller the p-value, the more\
    \ significant the estimate is.\n\nAs previously described, you can easily make\
    \ predictions using the R function `predict()` :\n\n```\n\n```\n\n```\n##   1\
    \ \n## 283\n```\n\n## 4.6 Interpretation\n\nBefore using a model for predictions,\
    \ you need to assess the statistical significance of the model. This can be easily\
    \ checked by displaying the statistical summary of the model.\n\n### 4.6.1 Model\
    \ summary\n\nDisplay the statistical summary of the model as follow:\n\n```\n\n\
    ```\n\n```\n## \n## Call:\n## lm(formula = sales ~ ., data = train.data)\n## \n\
    ## Residuals:\n##     Min      1Q  Median      3Q     Max \n## -10.412  -1.110\
    \   0.348   1.422   3.499 \n## \n## Coefficients:\n##             Estimate Std.\
    \ Error t value Pr(>|t|)    \n## (Intercept)  3.39188    0.44062    7.70  1.4e-12\
    \ ***\n## youtube      0.04557    0.00159   28.63  < 2e-16 ***\n## facebook  \
    \   0.18694    0.00989   18.90  < 2e-16 ***\n## newspaper    0.00179    0.00677\
    \    0.26     0.79    \n## ---\n## Signif. codes:  0 '***' 0.001 '**' 0.01 '*'\
    \ 0.05 '.' 0.1 ' ' 1\n## \n## Residual standard error: 2.12 on 158 degrees of\
    \ freedom\n## Multiple R-squared:  0.89,   Adjusted R-squared:  0.888 \n## F-statistic:\
    \  427 on 3 and 158 DF,  p-value: <2e-16\n```\n\nThe summary outputs shows 6 components,\
    \ including:\n\n*   **Call** . Shows the function call used to compute the regression\
    \ model."
