    ## Normality of residuals

    The residual errors are assumed to be normally distributed.


    ## Homogeneity of residuals variance

    The residuals are assumed to have a constant variance (`homoscedasticity`)


    ## Independence of residuals error terms


    You should check whether or not these assumptions hold true. Potential problems
    include:


    1. **Non-linearity** of the outcome - predictor relationships


    2. **Heteroscedasticity**: Non-constant variance of error terms.


    3. **Presence of influential values** in the data that can be:


    * Outliers: extreme values in the outcome (`y`) variable

    * High-leverage points: extreme values in the predictors (`x`) variable


    All these assumptions and potential problems can be checked by producing some
    diagnostic plots visualizing the residual errors.


    ## 9.7 Regression diagnostics {reg-diag}


    ### 9.7.1 Diagnostic plots


    Regression diagnostics plots can be created using the R base function `plot()`
    or the `autoplot()` function [ggfortify package], which creates a ggplot2-based
    graphics.


    * Create the diagnostic plots with the R base function:


    ```


    ```

    ![](Image00009.jpg)


    * Create the diagnostic plots using ggfortify:


    ```


    ```

    The diagnostic plots show residuals in four different ways:


    1. **Residuals vs Fitted**. Used to check the linear relationship assumptions.
    A horizontal line, without distinct patterns is an indication for a linear relationship,
    what is good.


    2. **Normal Q-Q**. Used to examine whether the residuals are normally distributed.
    It’s good if residuals points follow the straight dashed line.


    3. **Scale-Location** (or Spread-Location). Used to check the homogeneity of variance
    of the residuals (`homoscedasticity`). Horizontal line with equally spread points
    is a good indication of homoscedasticity. This is not the case in our example,
    where we have a heteroscedasticity problem.


    4. **Residuals vs Leverage**. Used to identify influential cases, that is extreme
    values that might influence the regression results when included or excluded from
    the analysis. This plot will be described further in the next sections.


    The four plots show the top 3 most extreme data points labeled with with the row
    numbers of the data in the data set. They might be potentially problematic. You
    might want to take a close look at them individually to check if there is anything
    special for the subject or if it could be simply data entry errors. We''ll discuss
    about this in the following sections.


    The metrics used to create the above plots are available in the `model.diag.metrics`
    data, described in the previous section.


    ```


    ```

    ```

    ##   index sales youtube .fitted .resid    .hat .cooksd .std.resid

    ## 1     1  26.5   276.1   21.56   4.96 0.00970 0.00794      1.273

    ## 2     2  12.5    53.4   10.98   1.50 0.01217 0.00092      0.387

    ## 3     3  11.2    20.6    9.42   1.74 0.01649 0.00169      0.449

    ## 4     4  22.2   181.8   17.08   5.12 0.00501 0.00434      1.312

    ```


    We''ll use mainly the following columns:


    * `.fitted`: fitted values

    * `.resid`: residual errors

    * `.hat`: hat values, used to detect high-leverage points (or extreme values in
    the predictors `x` variables)

    * `.std.resid`: standardized residuals, which is the residuals divided by their
    standard errors. Used to detect outliers (or extreme values in the outcome `y`
    variable)

    * `.cooksd`: Cook''s distance, used to detect influential values, which can be
    an outlier or a high leverage point


    In the following section, we''ll describe, in details, how to use these graphs
    and metrics to check the regression assumptions and to diagnostic potential problems
    in the model.


    ## 9.8 Linearity of the data


    The linearity assumption can be checked by inspecting the **Residuals vs Fitted**
    plot (1st plot):


    ```


    ```

    ![](Image00010.jpg)


    Ideally, the residual plot will show no fitted pattern. That is, the red line
    should be approximately horizontal at zero. The presence of a pattern may indicate
    a problem with some aspect of the linear model.


    In our example, there is no pattern in the residual plot. This suggests that we
    can assume linear relationship between the predictors and the outcome variables.


    Note that, if the residual plot indicates a non-linear relationship in the data,
    then a simple approach is to use non-linear transformations of the predictors,
    such as `log(x)`, `sqrt(x)` and `x^2`, in the regression model.


    ## 9.9 Homogeneity of variance


    This assumption can be checked by examining the *scale-location plot*, also known
    as the *spread-location plot*.


    ```


    ```

    ![](Image00011.jpg)


    This plot shows if residuals are spread equally along the ranges of predictors.
    It’s good if you see a horizontal line with equally spread points. In our example,
    this is not the case.


    It can be seen that the variability (variances) of the residual points increases
    with the value of the fitted outcome variable, suggesting non-constant variances
    in the residuals errors (or *heteroscedasticity*).


    A possible solution to reduce the heteroscedasticity problem is to use a log or
    square root transformation of the outcome variable (`y`).


    ```


    ```

    ![](Image00012.jpg)


    ## 9.10 Normality of residuals


    The QQ plot of residuals can be used to visually check the normality assumption.
    The normal probability plot of residuals should approximately follow a straight
    line.


    In our example, all the points fall approximately along this reference line, so
    we can assume normality.


    ```


    ```

    ![](Image00013.jpg)


    ## 9.11 Outliers and high levarage points


    **Outliers**:


    An outlier is a point that has an extreme outcome variable value. The presence
    of outliers may affect the interpretation of the model, because it increases the
    RSE.


    Outliers can be identified by examining the *standardized residual* (or *studentized
    residual*), which is the residual divided by its estimated standard error. Standardized
    residuals can be interpreted as the number of standard errors away from the regression
    line.


    Observations whose standardized residuals are greater than 3 in absolute value
    are possible outliers (James et al. [2014](#text00039.html#ref-james2014)).


    **High leverage points**:


    A data point has high leverage, if it has extreme predictor `x` values. This can
    be detected by examining the leverage statistic or the *hat-value*. A value of
    this statistic above `2(p + 1)/n` indicates an observation with high leverage
    (P. Bruce and Bruce [2017](#text00039.html#ref-bruce2017)); where, `p` is the
    number of predictors and `n` is the number of observations.


    Outliers and high leverage points can be identified by inspecting the *Residuals
    vs Leverage* plot:


    ```


    ```

    ![](Image00014.jpg)


    The plot above highlights the top 3 most extreme points (#26, #36 and #179), with
    a standardized residuals below -2. However, there is no outliers that exceed 3
    standard deviations, what is good.


    Additionally, there is no high leverage point in the data. That is, all data points,
    have a leverage statistic below `2(p + 1)/n = 4/200 = 0.02`.


    ## 9.12 Influential values


    An influential value is a value, which inclusion or exclusion can alter the results
    of the regression analysis. Such a value is associated with a large residual.


    Not all outliers (or extreme data points) are influential in linear regression
    analysis.


    Statisticians have developed a metric called *Cook''s distance* to determine the
    influence of a value. This metric defines influence as a combination of leverage
    and residual size.


    A rule of thumb is that an observation has high influence if Cook’s distance exceeds
    `4/(n - p - 1)` (P. Bruce and Bruce [2017](#text00039.html#ref-bruce2017)), where
    `n` is the number of observations and `p` the number of predictor variables.

