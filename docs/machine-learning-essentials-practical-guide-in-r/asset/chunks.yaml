  trans: "\n\n从上面的输出可知，`R2` 为 0.93，意味着观测值与预测结果值高度相关，这非常好。\n\n预测误差 `RMSE` 为 1.58，表示误差率为\
    \ `1.58/mean(test.data$sales) = 1.58/17 = 9.2%`，这也不错。\n\n## 4.8 讨论\n\n本章介绍了线性回归的基础知识，并提供了在\
    \ R 中计算简单线性回归和多元线性回归模型的实际示例。我们还描述了如何评估模型的预测性能。\n\n请注意，线性回归假设结果变量与预测变量之间存在线性关系。这可以通过创建结果变量与预测变量的散点图来轻松检查。\n\
    \n例如，以下 R 代码显示了销售单位与 YouTube 广告预算之间的关系。我们还将添加一条平滑线：\n\n```\n```\n\n![](img/Image00001.jpg)\n\
    \n上图显示了 `sales` 与 `youtube` 变量之间线性递增的关系，这是一件好事。\n\n除了线性假设之外，线性回归方法对数据还做出了许多其他假设（参见第\
    \ 9 章）。您应确保这些假设对您的数据成立。\n\n潜在问题包括：a) 数据中存在有影响的观测值（第 9 章），结果与某些预测变量之间的非线性关系（7）以及预测变量之间存在强相关性（第\
    \ 10 章）。\n\n# 5 多元回归中的交互效应\n\n## 5.1 引言\n\n本章介绍如何计算具有 `interaction effects` 的多元线性回归。\n\
    \n之前，我们已经描述了如何构建多元线性回归模型（第 4 章）来基于多个预测变量 (`x`) 预测连续结果变量 (`y`)。\n\n例如，要根据在 YouTube\
    \ 和 Facebook 上花费的广告预算预测销售额，模型方程为 `sales = b0 + b1*youtube + b2*facebook`，其中 `b0`\
    \ 为截距；`b1` 和 `b2` 分别与预测变量 `youtube` 和 `facebook` 相关的回归系数。\n\n上述方程也称为 *additive\
    \ model*，仅研究预测变量的主效应。它假设给定预测变量与结果之间的关系独立于其他预测变量（James et al. 2014，P. Bruce and\
    \ Bruce (2017)) 。\n\n以我们的示例来看，加性模型假设 YouTube 广告对销售额的影响独立于 Facebook 广告的影响。\n\n\
    这种假设可能不成立。例如，在 Facebook 上花费的广告费用可能会提高 YouTube 广告对销售额的有效性。在营销中，这被称为协同效应，在统计学中被称为交互效应（James\
    \ et al. 2014）。\n\n在本章中，您将学习：\n\n* 具有交互效应的多元线性回归方程\n* 计算与主效应和交互效应相关的回归系数的 R 代码\n\
    * 如何解释交互效应\n\n## 5.2 方程\n\n两个预测变量 (`x1` 和 `x2`) 之间存在交互效应的多元线性回归方程可写为如下形式：\n\n\
    `y = b0 + b1*x1 + b2*x2 + b3*(x1*x2)`\n\n以我们的示例来看，它变为：\n\n`sales = b0 + b1*youtube\
    \ + b2*facebook + b3*(youtube*facebook)`\n\n这也可以写成：\n\n`sales = b0 + (b1 + b3*facebook)*youtube\
    \ + b2*facebook`\n\n或写成：\n\n`sales = b0 + b1*youtube + (b2 +b3*youtube)*facebook`\n\
    \n`b3` 可解释为 Facebook 广告每增加一个单位时 YouTube 广告有效性的增加量（或反之）。\n\n在接下来的章节中，您将学习如何在 R\
    \ 中计算回归系数。\n\n## 5.3 加载所需的 R 包\n\n* `tidyverse` 用于轻松的数据操作和可视化\n* `caret` 用于轻松的机器学习工作流\n\
    \n```\n```\n\n## 5.4 准备数据\n\n我们将使用第 3 章中介绍的 `marketing` 数据集，根据在三种广告媒体 (`youtube`、`facebook`\
    \ 和 `newspaper`) 上花费的金额预测销售单位\n\n我们将随机将数据拆分为训练集（80% 用于构建预测模型）和测试集（20% 用于评估模型）。\n\
