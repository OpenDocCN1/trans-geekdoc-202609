- raw: "Generally, all dimension reduction methods work by first summarizing the original\
    \ predictors into few new variables called principal components (PCs), which are\
    \ then used as predictors to fit the linear regression model. These methods avoid\
    \ multicollinearity between predictors, which a big issue in regression setting\
    \ (see Chapter [10](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\nWhen using the dimension\
    \ reduction methods, it's generally recommended to standardize each predictor\
    \ to make them comparable. Standardization consists of dividing the predictor\
    \ by its standard deviation.\n\nHere, we described two well known regression methods\
    \ based on dimension reduction: **Principal Component Regression** (**PCR** )\
    \ and **Partial Least Squares** (**PLS** ) regression. We also provide practical\
    \ examples in R.\n\n## 20.2 Principal component regression\n\nThe principal component\
    \ regression (PCR) first applies [Principal Component Analysis](http://www.sthda.com/english/articles/31-principal-component-methods-in-r-practical-guide/112-pca-principal-component-analysis-essentials/)\
    \ on the data set to summarize the original predictor variables into few new variables\
    \ also known as principal components (PCs), which are a linear combination of\
    \ the original data.\n\nThese PCs are then used to build the linear regression\
    \ model. The number of principal components, to incorporate in the model, is chosen\
    \ by cross-validation (cv). Note that, PCR is suitable when the data set contains\
    \ highly correlated predictors.\n\n## 20.3 Partial least squares regression\n\n\
    A possible drawback of PCR is that we have no guarantee that the selected principal\
    \ components are associated with the outcome. Here, the selection of the principal\
    \ components to incorporate in the model is not supervised by the outcome variable.\n\
    \nAn alternative to PCR is the **Partial Least Squares** (PLS) regression, which\
    \ identifies new principal components that not only summarizes the original predictors,\
    \ but also that are related to the outcome. These components are then used to\
    \ fit the regression model. So, compared to PCR, PLS uses a dimension reduction\
    \ strategy that is supervised by the outcome.\n\nLike PCR, PLS is convenient for\
    \ data with highly-correlated predictors. The number of PCs used in PLS is generally\
    \ chosen by cross-validation. Predictors and the outcome variables should be generally\
    \ standardized, to make the variables comparable.\n\n## 20.4 Loading required\
    \ R packages\n\n*   `tidyverse` for easy data manipulation and visualization\n\
    \n*   `caret` for easy machine learning workflow\n\n*   `pls` , for computing\
    \ PCR and PLS\n\n```\n\n```\n\n## 20.5 Preparing the data\n\nWe'll use the `Boston`\
    \ data set [in `MASS` package], introduced in Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ , for predicting the median house value (`mdev` ), in Boston Suburbs, based\
    \ on multiple predictor variables.\n\nWe’ll randomly split the data into training\
    \ set (80% for building a predictive model) and test set (20% for evaluating the\
    \ model). Make sure to set seed for reproducibility.\n\n```\n\n```\n\n## 20.6\
    \ Computation\n\nThe R function `train()` [`caret` package] provides an easy workflow\
    \ to compute PCR and PLS by invoking the `pls` package. It has an option named\
    \ `method` , which can take the value `pcr` or `pls` .\n\nAn additional argument\
    \ is `scale = TRUE` for standardizing the variables to make them comparable.\n\
    \n`caret` uses cross-validation to automatically identify the optimal number of\
    \ principal components (`ncomp` ) to be incorporated in the model.\n\nHere, we'll\
    \ test 10 different values of the tuning parameter `ncomp` . This is specified\
    \ using the option `tuneLength` . The optimal number of principal components is\
    \ selected so that the cross-validation error (RMSE) is minimized.\n\n### 20.6.1\
    \ Computing principal component regression\n\n```\n\n```\n\n```\n##   ncomp\n\
    ## 5     5\n```\n\n```\n\n```\n\n```\n## Data:    X dimension: 407 13 \n##  Y\
    \ dimension: 407 1\n## Fit method: svdpc\n## Number of components considered:\
    \ 5\n## TRAINING: % variance explained\n##           1 comps  2 comps  3 comps\
    \  4 comps  5 comps\n## X           47.48    58.40    68.00    74.75    80.94\n\
    ## .outcome    38.10    51.02    64.43    65.24    71.17\n```\n\n```\n\n```\n\n\
    ```\n##   RMSE Rsquare\n## 1 5.18   0.645\n```\n\n![](Image00017.jpg)\n\nThe plot\
    \ shows the prediction error (RMSE, Chapter [13](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) made by the model according to the number of principal components incorporated\
    \ in the model.\n\nOur analysis shows that, choosing five principal components\
    \ (ncomp = 5) gives the smallest prediction error RMSE.\n\nThe `summary()` function\
    \ also provides the percentage of variance explained in the predictors (x) and\
    \ in the outcome (`medv` ) using different numbers of components.\n\nFor example,\
    \ 80.94% of the variation (or information) contained in the predictors are captured\
    \ by 5 principal components (`ncomp = 5` ). Additionally, setting ncomp = 5, captures\
    \ 71% of the information in the outcome variable (`medv` ), which is good.\n\n\
    Taken together, cross-validation identifies ncomp = 5 as the optimal number of\
    \ PCs that minimize the prediction error (RMSE) and explains enough variation\
    \ in the predictors and in the outcome.\n\n### 20.6.2 Computing partial least\
    \ squares\n\nThe R code is just like that of the PCR method.\n\n```\n\n```\n\n\
    ```\n##   ncomp\n## 9     9\n```\n\n```\n\n```\n\n```\n## Data:    X dimension:\
    \ 407 13 \n##  Y dimension: 407 1\n## Fit method: oscorespls\n## Number of components\
    \ considered: 9\n## TRAINING: % variance explained\n##           1 comps  2 comps\
    \  3 comps  4 comps  5 comps  6 comps  7 comps\n## X           46.19    57.32\
    \    64.15    69.76    75.63    78.66    82.85\n## .outcome    50.90    71.84\
    \    73.71    74.71    75.18    75.35    75.42\n##           8 comps  9 comps\n\
    ## X           85.92    90.36\n## .outcome    75.48    75.49\n```\n\n```\n\n```\n\
    \n```\n##   RMSE Rsquare\n## 1 4.99   0.671\n```\n\n![](Image00018.jpg)\n\nThe\
    \ optimal number of principal components included in the PLS model is 9. This\
    \ captures 90% of the variation in the predictors and 75% of the variation in\
    \ the outcome variable (`medv` ).\n\nIn our example, the cross-validation error\
    \ RMSE obtained with the PLS model is lower than the RMSE obtained using the PCR\
    \ method. So, the PLS model is the best model, for explaining our data, compared\
    \ to the PCR model.\n\n## 20.7 Discussion\n\nThis chapter describes principal\
    \ component based regression methods, including principal component regression\
    \ (PCR) and partial least squares regression (PLS). These methods are very useful\
    \ for multivariate data containing correlated predictors.\n\nThe presence of correlation\
    \ in the data allows to summarize the data into few non-redundant components that\
    \ can be used in the regression model.\n\nCompared to ridge regression and lasso\
    \ (Chapter [19](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ), the final PCR and PLS models\
    \ are more difficult to interpret, because they do not perform any kind of variable\
    \ selection or even directly produce regression coefficient estimates.\n\n# 21\
    \ Introduction\n\nPreviously, we have described the regression model (Chapter\
    \ [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ), which is used to predict a quantitative\
    \ or continuous outcome variable based on one or multiple predictor variables.\n\
    \nIn **Classification** , the outcome variable is qualitative (or categorical).\
    \ **Classification** refers to a set of machine learning methods for predicting\
    \ the class (or category) of individuals on the basis of one or multiple predictor\
    \ variables.\n\nIn this part, we'll cover the following topics:\n\n*   Logistic\
    \ regression, for binary classification tasks (Chapter [22](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )\n\n*   Stepwise and penalized logistic regression for variable selections\
    \ (Chapter [23](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) and [24](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )\n\n*   Logistic regression assumptions and diagnostics (Chapter [25](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )"
