    \ 1 ) \"*\"         \" \"         \"*\"       \"*\"      \"*\"\n```\n\nAn asterisk\
    \ specifies that a given variable is included in the corresponding model. For\
    \ example, it can be seen that the best 4-variables model contains Agriculture,\
    \ Education, Catholic, Infant.Mortality (`Fertility ~ Agriculture + Education\
    \ + Catholic + Infant.Mortality` ).\n\nThe regression coefficients of the final\
    \ model (id = 4) can be accessed as follow:\n\n```\n\n```\n\nOr, by computing\
    \ the linear model using only the selected predictors:\n\n```\n\n```\n\n```\n\
    ## \n## Call:\n## lm(formula = Fertility ~ Agriculture + Education + Catholic\
    \ + \n##     Infant.Mortality, data = swiss)\n## \n## Coefficients:\n##      (Intercept)\
    \       Agriculture         Education          Catholic  \n##           62.101\
    \            -0.155            -0.980             0.125  \n## Infant.Mortality\
    \  \n##            1.078\n```\n\n## 18.4 Discussion\n\nThis chapter describes\
    \ stepwise regression methods in order to choose an optimal simple model, without\
    \ compromising the model accuracy.\n\nWe have demonstrated how to use the `leaps`\
    \ R package for computing stepwise regression. Another alternative is the function\
    \ `stepAIC()` available in the MASS package. It has an option called `direction`\
    \ , which can have the following values: \"both\", \"forward\", \"backward\".\n\
    \n```\n\n```\n\nAdditionally, the caret package has method to compute stepwise\
    \ regression using the MASS package (`method = \"lmStepAIC\"` ):\n\n```\n\n```\n\
    \nStepwise regression is very useful for high-dimensional data containing multiple\
    \ predictor variables. Other alternatives are the penalized regression (ridge\
    \ and lasso regression) (Chapter [19](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ) and\
    \ the principal components-based regression methods (PCR and PLS) (Chapter [20](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ).\n\n# 19 Penalized Regression: Ridge, Lasso and Elastic Net\n\n## 19.1 Introduction\n\
    \nThe standard linear model (or the ordinary least squares method) performs poorly\
    \ in a situation, where you have a large multivariate data set containing a number\
    \ of variables superior to the number of samples.\n\nA better alternative is the\
    \ **penalized regression** allowing to create a linear regression model that is\
    \ penalized, for having too many variables in the model, by adding a constraint\
    \ in the equation (James et al. [2014](#text00039.html#ref-james2014) ,P. Bruce\
    \ and Bruce ([2017](#text00039.html#ref-bruce2017) ) ) . This is also known as\
    \ **shrinkage** or **regularization** methods.\n\nThe consequence of imposing\
    \ this penalty, is to reduce (i.e. shrink) the coefficient values towards zero.\
    \ This allows the less contributive variables to have a coefficient close to zero\
    \ or equal zero.\n\nNote that, the shrinkage requires the selection of a tuning\
    \ parameter (lambda) that determines the amount of shrinkage.\n\nIn this chapter\
    \ we'll describe the most commonly used penalized regression methods, including\
    \ **ridge regression** , **lasso regression** and **elastic net regression** .\
    \ We'll also provide practical examples in R.\n\n## 19.2 Shrinkage methods\n\n\
    ### 19.2.1 Ridge regression\n\nRidge regression shrinks the regression coefficients,\
    \ so that variables, with minor contribution to the outcome, have their coefficients\
    \ close to zero.\n\nThe shrinkage of the coefficients is achieved by penalizing\
    \ the regression model with a penalty term called **L2-norm** , which is the sum\
    \ of the squared coefficients.\n\nThe amount of the penalty can be fine-tuned\
    \ using a constant called lambda (λ\\\\lambda). Selecting a good value for λ\\\
    \\lambda is critical.\n\nWhen λ=0\\\\lambda = 0, the penalty term has no effect,\
    \ and ridge regression will produce the classical least square coefficients. However,\
    \ as λ\\\\lambda increases to infinite, the impact of the shrinkage penalty grows,\
    \ and the ridge regression coefficients will get close zero.\n\nNote that, in\
    \ contrast to the ordinary least square regression, ridge regression is highly\
    \ affected by the scale of the predictors. Therefore, it is better to standardize\
    \ (i.e., scale) the predictors before applying the ridge regression (James et\
    \ al. [2014](#text00039.html#ref-james2014) ) , so that all the predictors are\
    \ on the same scale.\n\nThe standardization of a predictor `x` , can be achieved\
    \ using the formula `x' = x / sd(x)` , where sd(x) is the standard deviation of\
    \ x. The consequence of this is that, all standardized predictors will have a\
    \ standard deviation of one allowing the final fit to not depend on the scale\
    \ on which the predictors are measured.\n\nOne important advantage of the ridge\
    \ regression, is that it still performs well, compared to the ordinary least square\
    \ method (Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ), in a situation where\
    \ you have a large multivariate data with the number of predictors (p) larger\
    \ than the number of observations (n).\n\nOne disadvantage of the ridge regression\
    \ is that, it will include all the predictors in the final model, unlike the stepwise\
    \ regression methods (Chapter [18](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ), which\
    \ will generally select models that involve a reduced set of variables.\n\nRidge\
    \ regression shrinks the coefficients towards zero, but it will not set any of\
    \ them exactly to zero. The lasso regression is an alternative that overcomes\
    \ this drawback.\n\n### 19.2.2 Lasso regression\n\nLasso stands for Least Absolute\
    \ Shrinkage and Selection Operator. It shrinks the regression coefficients toward\
    \ zero by penalizing the regression model with a penalty term called **L1-norm**\
    \ , which is the sum of the absolute coefficients.\n\nIn the case of lasso regression,\
    \ the penalty has the effect of forcing some of the coefficient estimates, with\
    \ a minor contribution to the model, to be exactly equal to zero. This means that,\
    \ lasso can be also seen as an alternative to the subset selection methods for\
    \ performing variable selection in order to reduce the complexity of the model.\n\
    \nAs in ridge regression, selecting a good value of λ\\\\lambda for the lasso\
    \ is critical.\n\nOne obvious advantage of lasso regression over ridge regression,\
    \ is that it produces simpler and more interpretable models that incorporate only\
    \ a reduced set of the predictors. However, neither ridge regression nor the lasso\
    \ will universally dominate the other.\n\nGenerally, lasso might perform better\
    \ in a situation where some of the predictors have large coefficients, and the\
    \ remaining predictors have very small coefficients."
