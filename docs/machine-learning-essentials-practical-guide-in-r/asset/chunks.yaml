    \ .\n\n## 2.8 Close your R/RStudio session\n\nEach time you close R/RStudio, you\
    \ will be asked whether you want to save the data from your R session. If you\
    \ decide to save, the data will be available in future R sessions.\n\n# 3 Introduction\n\
    \n**Regression analysis** (or **regression model** ) consists of a set of *machine\
    \ learning* methods that allow us to predict a continuous outcome variable (y)\
    \ based on the value of one or multiple predictor variables (x).\n\nBriefly, the\
    \ goal of regression model is to build a mathematical equation that defines y\
    \ as a function of the x variables. Next, this equation can be used to predict\
    \ the outcome (y) on the basis of new values of the predictor variables (x).\n\
    \n**Linear regression** is the most simple and popular technique for predicting\
    \ a continuous variable. It assumes a linear relationship between the outcome\
    \ and the predictor variables. See Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\nThe linear regression equation can be written as `y = b0 + b*x` , where:\n\
    \n*   b0 is the intercept,\n\n*   b is the regression weight or coefficient associated\
    \ with the predictor variable x.\n\nTechnically, the linear regression coefficients\
    \ are detetermined so that the error in predicting the outcome value is minimized.\
    \ This method of computing the beta coefficients is called the **Ordinary Least\
    \ Squares** method.\n\nWhen you have multiple predictor variables, say x1 and\
    \ x2, the regression equation can be written as `y = b0 + b1*x1 + b2*x2` . In\
    \ some situations, there might be an **interaction effect** between some predictors,\
    \ that is for example, increasing the value of a predictor variable x1 may increase\
    \ the effectiveness of the predictor x2 in explaining the variation in the outcome\
    \ variable. See Chapter [5](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) .\n\nNote also\
    \ that, linear regression models can incorporate both continuous and **categorical\
    \ predictor variables** . See Chapter [6](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\nWhen you build the linear regression model, you need to **diagnostic**\
    \ whether linear model is suitable for your data. See Chapter [9](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\nIn some cases, the relationship between the outcome and the predictor variables\
    \ is not linear. In these situations, you need to build a **non-linear regression**\
    \ , such as *polynomial and spline regression* . See Chapter [7](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\nWhen you have multiple predictors in the regression model, you might want\
    \ to select the best combination of predictor variables to build an optimal predictive\
    \ model. This process called **model selection** , consists of comparing multiple\
    \ models containing different sets of predictors in order to select the best performing\
    \ model that minimize the prediction error. Linear model selection approaches\
    \ include **best subsets regression** (Chapter [17](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) and **stepwise regression** (Chapter [18](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )\n\nIn some situations, such as in genomic fields, you might have a large multivariate\
    \ data set containing some correlated predictors. In this case, the information,\
    \ in the original data set, can be summarized into few new variables (called principal\
    \ components) that are a linear combination of the original variables. This few\
    \ principal components can be used to build a linear model, which might be more\
    \ performant for your data. This approach is know as **principal component-based\
    \ methods** (Chapter [20](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ), which include:\
    \ **principal component regression** and **partial least squares regression**\
    \ .\n\nAn alternative method to simplify a large multivariate model is to use\
    \ **penalized regression** (Chapter [19](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ),\
    \ which penalizes the model for having too many variables. The most well known\
    \ penalized regression include **ridge regression** and the **lasso regression**\
    \ .\n\nYou can apply all these different regression models on your data, compare\
    \ the models and finally select the best approach that explains well your data.\
    \ To do so, you need some statistical metrics to compare the performance of the\
    \ different models in explaining your data and in predicting the outcome of new\
    \ test data.\n\nThe best model is defined as the model that has the lowest prediction\
    \ error. The most popular metrics for comparing regression models, include:"
