    # 36 Unsupervised Learning


    ## 36.1 Introduction


    **Unsupervised learning** refers to a set of statistical techniques for exploring
    and discovering knowledge, from a multivariate data, without building a predictive
    models.


    It makes it possible to visualize the relationship between variables, as well
    as, to identify groups of similar individuals (or observations).


    The most popular unsupervised learning methods, include:


    *   **Principal component methods** , which consist of summarizing and visualizing
    the most important information contained in a multivariate data set.


    *   **Cluster analysis** for identifying groups of observations with similar profile
    according to a specific criteria. These techniques include hierarchical clustering
    and k-means clustering.


    Previously, we have published two books entitled "[Practical Guide To Cluster
    Analysis in R](http://www.sthda.com/english/articles/25-cluster-analysis-in-r-practical-guide/)
    " and "[Practical Guide To Principal Component Methods](http://www.sthda.com/english/articles/31-principal-component-methods-in-r-practical-guide/)
    ". So, this chapter provides just an overview of unsupervised learning techniques
    and practical examples in R for visualizing multivariate data sets.


    ## 36.2 Principal component methods


    Principal component methods allows us to summarize and visualize the most important
    information contained in a multivariate data set.


    The type of principal component methods to use depends on variable types contained
    in the data set. This practical guide will describe the following methods:


    1.  **Principal Component Analysis (PCA)** , which is one of the most popular
    multivariate analysis method. The goal of PCA is to summarize the information
    contained in a continuous (i.e, quantitative) multivariate data by reducing the
    dimensionality of the data without loosing important information.


    2.  **Correspondence Analysis (CA)** , which is an extension of the principal
    component analysis for analyzing a large contingency table formed by two *qualitative
    variables* (or categorical data).


    3.  **Multiple Correspondence Analysis (MCA)** , which is an adaptation of CA
    to a data table containing more than two categorical variables.


    ## 36.3 Loading required R packages


    *   `FactoMineR` for computing principal component methods


    *   `factoextra` for visualizing the output of FactoMineR


