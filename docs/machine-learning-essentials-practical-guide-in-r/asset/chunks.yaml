    \n```\n```\n\n```\n##   nvmax\n## 4     4\n```\n\n这表明最佳模型是具有 `nvmax = 4` 个变量的模型。函数\
    \ `summary()` 会报告每个模型规模的最佳变量集合，直到最佳的 4 变量模型。\n\n```\n```\n\n```\n## Subset selection\
    \ object\n## 5 Variables  (and intercept)\n##                  Forced in Forced\
    \ out\n## Agriculture          FALSE      FALSE\n## Examination          FALSE\
    \      FALSE\n## Education            FALSE      FALSE\n## Catholic          \
    \   FALSE      FALSE\n## Infant.Mortality     FALSE      FALSE\n## 1 subsets of\
    \ each size up to 4\n## Selection Algorithm: backward\n##          Agriculture\
    \ Examination Education Catholic Infant.Mortality\n## 1  ( 1 ) \" \"         \"\
    \ \"         \"*\"       \" \"      \" \"             \n## 2  ( 1 ) \" \"    \
    \     \" \"         \"*\"       \"*\"      \" \"             \n## 3  ( 1 ) \"\
    \ \"         \" \"         \"*\"       \"*\"      \"*\"             \n## 4  (\
    \ 1 ) \"*\"         \" \"         \"*\"       \"*\"      \"*\"\n```\n\n星号指定某个变量被包含在对应的模型中。例如，可以看出最佳的\
    \ 4 变量模型包含 Agriculture、Education、Catholic、Infant.Mortality（`Fertility ~ Agriculture\
    \ + Education + Catholic + Infant.Mortality`）。\n\n最终模型（`id = 4`）的回归系数可以按如下方式访问：\n\
    \n```\n```\n\n或者，通过仅使用所选预测变量计算线性模型：\n\n```\n```\n\n```\n## \n## Call:\n## lm(formula\
    \ = Fertility ~ Agriculture + Education + Catholic + \n##     Infant.Mortality,\
    \ data = swiss)\n## \n## Coefficients:\n##      (Intercept)       Agriculture\
    \         Education          Catholic  \n##           62.101            -0.155\
    \            -0.980             0.125  \n## Infant.Mortality  \n##           \
    \ 1.078\n```\n\n## 18.4 讨论\n\n本章描述了逐步回归方法，以便在不损害模型精度的情况下选择一个最优的简单模型。\n\n我们演示了如何使用\
    \ `leaps` R 包计算逐步回归。另一个替代方案是 MASS 包中提供的函数 `stepAIC()`。它有一个名为 `direction` 的选项，可以具有以下值：\"\
    both\"、\"forward\"、\"backward\"。\n\n```\n```\n\n此外，caret 包有使用 MASS 包计算逐步回归的方法（`method\
    \ = \"lmStepAIC\"`）：\n\n```\n```\n\n逐步回归对于包含多个预测变量的高维数据非常有用。其他替代方案是惩罚回归（岭回归和套索回归）（第\
    \ 19 章）和基于主成分的回归方法（PCR 和 PLS）（第 20 章）。\n\n# 19 惩罚回归：岭回归、套索回归和弹性网络\n\n## 19.1 引言\n\
    \n标准线性模型（或普通最小二乘法）在你拥有一个包含变量数多于样本数的大型多变量数据集的情况下表现不佳。\n\n更好的替代方案是惩罚回归，它允许创建在模型中变量过多时受到惩罚的线性回归模型，通过在方程中添加约束来实现（James\
    \ et al. 2014，P. Bruce and Bruce (2017))。这也被称为收缩或正则化方法。\n\n施加此惩罚的后果是使系数值减小（即收缩）趋向于零。这使得贡献较小的变量的系数接近于零或等于零。\n\
    \n请注意，收缩需要选择一个调优参数（lambda），该参数决定收缩的程度。\n\n在本章中，我们将描述最常用的惩罚回归方法，包括岭回归、套索回归和弹性网络回归。我们还将提供\
    \ R 中的实际示例。\n\n## 19.2 收缩方法\n\n### 19.2.1 岭回归\n\n岭回归收缩回归系数，使得对结果贡献较小的变量的系数接近于零。\n\
    \n系数的收缩是通过对回归模型施加一个称为 L2 范数的惩罚项来实现的，该惩罚项是系数的平方和。\n\n惩罚的程度可以通过一个常数 lambda（`λ\\\
    lambda`）进行微调。选择 `λ\\lambda` 的良好值至关重要。\n\n当 `λ=0\\lambda = 0` 时，惩罚项没有效果，岭回归将产生经典的最小二乘系数。然而，随着\
    \ `λ\\lambda` 增加到无穷大，收缩惩罚的影响增大，岭回归系数将接近于零。\n\n请注意，与普通最小二乘回归相反，岭回归受预测变量尺度的影响很大。因此，在应用岭回归之前最好对预测变量进行标准化（即缩放）（James\
    \ et al. 2014），以便所有预测变量处于同一尺度。\n\n预测变量 `x` 的标准化可以通过公式 `x' = x / sd(x)` 实现，其中 `sd(x)`\
    \ 是 `x` 的标准差。其后果是，所有标准化后的预测变量的标准差都为一，从而使最终拟合不依赖于预测变量的测量尺度。\n\n岭回归的一个重要优点是，与普通最小二乘法（第\
    \ 4 章）相比，在预测变量数（`p`）大于观测数（`n`）的大型多变量数据情况下，它仍然表现良好。\n\n岭回归的一个缺点是，它会将所有预测变量都包含在最终模型中，不像逐步回归方法（第\
    \ 18 章），后者通常会选择涉及较少变量集的模型。\n\n岭回归将系数收缩向零，但不会将任何系数精确地设为零。套索回归是克服这一缺点的替代方法。\n\n\
    ### 19.2.2 套索回归\n\nLasso 代表 Least Absolute Shrinkage and Selection Operator。它通过对回归模型施加一个称为\
    \ L1 范数的惩罚项来收缩回归系数向零，该惩罚项是系数的绝对值之和。\n\n在套索回归的情况下，惩罚的效果是使一些对模型贡献较小的系数估计强制精确等于零。这意味着套索也可以被视为一种替代子集选择方法，用于执行变量选择以减少模型的复杂性。\n\
    \n与岭回归一样，选择套索的 `λ\\lambda` 的良好值至关重要。\n\n套索回归相对于岭回归的一个明显优势是，它产生更简单、更易解释的模型，仅包含一组减少的预测变量。然而，岭回归和套索都不会普遍占优于另一个。\n\
    \n一般来说，套索可能在某些预测变量具有大系数，而剩余预测变量具有非常小系数的情况下表现更好。\n\n"
