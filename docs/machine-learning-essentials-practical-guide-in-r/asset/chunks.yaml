- raw: "Multicollinearity corresponds to a situation where the data contain highly\
    \ correlated predictor variables. Read more in Chapter [10](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\nMulticollinearity is an important issue in regression analysis and should\
    \ be fixed by removing the concerned variables. It can be assessed using the R\
    \ function `vif()` [car package], which computes the variance inflation factors:\n\
    \n```\n\n```\n\n```\n## pregnant  glucose pressure  triceps  insulin     mass\
    \ pedigree      age \n##     1.89     1.38     1.19     1.64     1.38     1.83\
    \     1.03     1.97\n```\n\nAs a rule of thumb, a VIF value that exceeds 5 or\
    \ 10 indicates a problematic amount of collinearity. In our example, there is\
    \ no collinearity: all variables have a value of VIF well below 5.\n\n## 25.6\
    \ Discussion\n\nThis chapter describes the main assumptions of logistic regression\
    \ model and provides examples of R code to diagnostic potential problems in the\
    \ data, including non linearity between the predictor variables and the logit\
    \ of the outcome, the presence of influential observations in the data and multicollinearity\
    \ among predictors.\n\nFixing these potential problems might improve considerably\
    \ the goodness of the model. See also, additional performance metrics to check\
    \ the validity of your model are described in the Chapter [30](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\n# 26 Multinomial Logistic Regression\n\n## 26.1 Introduction\n\nThe **multinomial\
    \ logistic regression** is an extension of the logistic regression (Chapter [22](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) for multiclass classification tasks. It is used when the outcome involves\
    \ more than two classes.\n\nIn this chapter, we'll show you how to compute multinomial\
    \ logistic regression in R.\n\n## 26.2 Loading required R packages\n\n*   `tidyverse`\
    \ for easy data manipulation\n\n*   `caret` for easy predictive modeling\n\n*\
    \   `nnet` for computing multinomial logistic regression\n\n```\n\n```\n\n## 26.3\
    \ Preparing the data\n\nWe'll use the `iris` data set, introduced in Chapter [21](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ , for predicting iris species based on the predictor variables Sepal.Length,\
    \ Sepal.Width, Petal.Length, Petal.Width.\n\nWe start by randomly splitting the\
    \ data into training set (80% for building a predictive model) and test set (20%\
    \ for evaluating the model). Make sure to set seed for reproducibility.\n\n```\n\
    \n```\n\n## 26.4 Computing multinomial logistic regression\n\n```\n\n```\n\nModel\
    \ accuracy:\n\n```\n\n```\n\n```\n## [1] 0.967\n```\n\nOur model is very good\
    \ in predicting the different categories with an accuracy of 97%.\n\n## 26.5 Discussion\n\
    \nThis chapter describes how to compute multinomial logistic regression in R.\
    \ This method is used for multiclass problems. In practice, it is not used very\
    \ often. Discriminant analysis (Chapter [27](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) is more popular for multiple-class classification.\n\n# 27 Discriminant Analysis\n\
    \n## 27.1 Introduction\n\n**Discriminant analysis** is used to predict the probability\
    \ of belonging to a given class (or category) based on one or multiple predictor\
    \ variables. It works with continuous and/or categorical predictor variables.\n\
    \nPreviously, we have described the logistic regression for two-class classification\
    \ problems, that is when the outcome variable has two possible values (0/1, no/yes,\
    \ negative/positive).\n\nCompared to logistic regression, the discriminant analysis\
    \ is more suitable for predicting the category of an observation in the situation\
    \ where the outcome variable contains more than two classes. Additionally, it's\
    \ more stable than the logistic regression for multi-class classification problems.\n\
    \nNote that, both logistic regression and discriminant analysis can be used for\
    \ binary classification tasks.\n\nIn this chapter, you'll learn the most widely\
    \ used discriminant analysis techniques and extensions. Additionally, we'll provide\
    \ R code to perform the different types of analysis.\n\nThe following discriminant\
    \ analysis methods will be described:\n\n*   **Linear discriminant analysis**\
    \ (**LDA** ): Uses linear combinations of predictors to predict the class of a\
    \ given observation. Assumes that the predictor variables (p) are normally distributed\
    \ and the classes have identical variances (for univariate analysis, p = 1) or\
    \ identical covariance matrices (for multivariate analysis, p > 1).\n\n*   **Quadratic\
    \ discriminant analysis** (**QDA** ): More flexible than LDA. Here, there is no\
    \ assumption that the covariance matrix of classes is the same.\n\n*   **Mixture\
    \ discriminant analysis** (**MDA** ): Each class is assumed to be a Gaussian mixture\
    \ of subclasses.\n\n*   **Flexible Discriminant Analysis** (**FDA** ): Non-linear\
    \ combinations of predictors is used such as splines.\n\n*   **Regularized discriminant\
    \ anlysis** (**RDA** ): Regularization (or shrinkage) improves the estimate of\
    \ the covariance matrices in situations where the number of predictors is larger\
    \ than the number of samples in the training data. This leads to an improvement\
    \ of the discriminant analysis.\n\n## 27.2 Loading required R packages\n\n*  \
    \ `tidyverse` for easy data manipulation and visualization\n\n*   `caret` for\
    \ easy machine learning workflow\n\n```\n\n```\n\n## 27.3 Preparing the data\n\
    \nWe'll use the `iris` data set, introduced in Chapter [21](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ , for predicting iris species based on the predictor variables Sepal.Length,\
    \ Sepal.Width, Petal.Length, Petal.Width.\n\nDiscriminant analysis can be affected\
    \ by the scale/unit in which predictor variables are measured. It's generally\
    \ recommended to standardize/normalize continuous predictor before the analysis.\n\
    \n1.  Split the data into training and test set:\n\n```\n\n```\n\n2.  Normalize\
    \ the data. Categorical variables are automatically ignored.\n\n```\n\n```\n\n\
    ## 27.4 Linear discriminant analysis - LDA\n\nThe LDA algorithm starts by finding\
    \ directions that maximize the separation between classes, then use these directions\
    \ to predict the class of individuals. These directions, called linear discriminants,\
    \ are a linear combinations of predictor variables.\n\nLDA assumes that predictors\
    \ are normally distributed (Gaussian distribution) and that the different classes\
    \ have class-specific means and equal variance/covariance.\n\nBefore performing\
    \ LDA, consider:\n\n*   Inspecting the univariate distributions of each variable\
    \ and make sure that they are normally distribute. If not, you can transform them\
    \ using log and root for exponential distributions and Box-Cox for skewed distributions.\n\
    \n*   removing outliers from your data and standardize the variables to make their\
    \ scale comparable.\n\nThe linear discriminant analysis can be easily computed\
    \ using the function `lda()` [MASS package].\n\n**Quick start R code** :\n\n```\n\
    \n```\n\n**Compute LDA** :\n\n```\n\n```\n\n```\n## Call:\n## lda(Species ~ .,\
    \ data = train.transformed)\n## \n## Prior probabilities of groups:\n##     setosa\
    \ versicolor  virginica \n##      0.333      0.333      0.333 \n## \n## Group\
    \ means:\n##            Sepal.Length Sepal.Width Petal.Length Petal.Width\n##\
    \ setosa           -1.012       0.787       -1.293      -1.250\n## versicolor\
    \        0.117      -0.648        0.272       0.154\n## virginica         0.895\
    \      -0.139        1.020       1.095\n## \n## Coefficients of linear discriminants:\n\
    ##                 LD1     LD2\n## Sepal.Length  0.911  0.0318\n## Sepal.Width\
    \   0.648  0.8985\n## Petal.Length -4.082 -2.2272\n## Petal.Width  -2.313  2.6544\n\
    ## \n## Proportion of trace:\n##    LD1    LD2 \n## 0.9905 0.0095\n```\n\nLDA\
    \ determines group means and computes, for each individual, the probability of\
    \ belonging to the different groups. The individual is then affected to the group\
    \ with the highest probability score.\n\nThe `lda()` outputs contain the following\
    \ elements:\n\n*   *Prior probabilities of groups* : the proportion of training\
    \ observations in each group. For example, there are 31% of the training observations\
    \ in the setosa group\n\n*   *Group means* : group center of gravity. Shows the\
    \ mean of each variable in each group."
