    ## 22.4 Preparing the data


    Logistic regression works for a data that contain continuous and/or categorical
    predictor variables.


    Performing the following steps might improve the accuracy of your model


    *   Remove potential outliers


    *   Make sure that the predictor variables are normally distributed. If not, you
    can use log, root, Box-Cox transformation.


    *   Remove highly correlated predictors to minimize overfitting. The presence
    of highly correlated predictors might lead to an unstable model solution.


    Here, we''ll use the `PimaIndiansDiabetes2` [in `mlbench` package], introduced
