    \ package] 轻松计算。\n\n在二分类设置中，你可能需要指定可选参数 `positive`，它是一个字符字符串，对应于“阳性”结果的因子水平（如果对你的数据有意义）。如果只有两个因子水平，默认使用第一个水平作为“阳性”结果。\n\
    \n```\n## Confusion Matrix and Statistics\n## \n##           Reference\n## Prediction\
    \ neg pos\n##        neg  48  11\n##        pos   4  15\n##                  \
    \                       \n##                Accuracy : 0.808         \n##    \
    \              95% CI : (0.703, 0.888)\n##     No Information Rate : 0.667   \
    \      \n##     P-Value [Acc > NIR] : 0.00439       \n##                     \
    \                    \n##                   Kappa : 0.536         \n##  Mcnemar's\
    \ Test P-Value : 0.12134       \n##                                         \n\
    ##             Sensitivity : 0.577         \n##             Specificity : 0.923\
    \         \n##          Pos Pred Value : 0.789         \n##          Neg Pred\
    \ Value : 0.814         \n##              Prevalence : 0.333         \n##    \
