    \ Fertility ~ Education + Catholic + Infant.Mortality\n## <environment: 0x7f86d517a660>\n\
    ```\n\n2.  `get_cv_error()` , to get the cross-validation (CV) error for a given\
    \ model:\n\n```\n\n```\n\nFinally, use the above defined helper functions to compute\
    \ the prediction error of the different best models returned by the `regsubsets()`\
    \ function:\n\n```\n\n```\n\n```\n## [1] 9.42 8.45 7.93 7.68 7.92\n```\n\n```\n\
    \n```\n\n```\n## [1] 4\n```\n\nIt can be seen that the model with 4 variables\
    \ is the best model. It has the lower prediction error. The regression coefficients\
    \ of this model can be extracted as follow:\n\n```\n\n```\n\n```\n##      (Intercept)\
    \      Agriculture        Education         Catholic \n##           62.101   \
    \        -0.155           -0.980            0.125 \n## Infant.Mortality \n## \
    \           1.078\n```\n\n## 17.6 Discussion\n\nThis chapter describes the best\
    \ subsets regression approach for choosing the best linear regression model that\
    \ explains our data.\n\nNote that, this method is computationally expensive and\
    \ becomes unfeasible for a large data set with many variables. A better alternative\
    \ is provided by the **stepwise regression** method. See Chapter [18](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\n# 18 Stepwise Regression\n\n## 18.1 Introduction\n\nThe **stepwise regression**\
    \ (or stepwise selection) consists of iteratively adding and removing predictors,\
    \ in the predictive model, in order to find the subset of variables in the data\
    \ set resulting in the best performing model, that is a model that lowers prediction\
    \ error.\n\nThere are three strategies of stepwise regression (James et al. [2014](#text00039.html#ref-james2014)\
    \ ,P. Bruce and Bruce ([2017](#text00039.html#ref-bruce2017) ) ) :\n\n1.  **Forward\
    \ selection** , which starts with no predictors in the model, iteratively adds\
    \ the most contributive predictors, and stops when the improvement is no longer\
    \ statistically significant.\n\n2.  **Backward selection** (or **backward elimination**\
    \ ), which starts with all predictors in the model (full model), iteratively removes\
    \ the least contributive predictors, and stops when you have a model where all\
    \ predictors are statistically significant.\n\n3.  **Stepwise selection** (or\
    \ sequential replacement), which is a combination of forward and backward selections.\
    \ You start with no predictors, then sequentially add the most contributive predictors\
    \ (like forward selection). After adding each new variable, remove any variables\
    \ that no longer provide an improvement in the model fit (like backward selection).\n\
    \nNote that,\n\n*   forward selection and stepwise selection can be applied in\
    \ the high-dimensional configuration, where the number of samples n is inferior\
    \ to the number of predictors p, such as in genomic fields.\n\n*   Backward selection\
    \ requires that the number of samples n is larger than the number of variables\
    \ p, so that the full model can be fit.\n\nIn this chapter, you'll learn how to\
    \ compute the stepwise regression methods in R.\n\n## 18.2 Loading required R\
    \ packages\n\n*   `tidyverse` for easy data manipulation and visualization\n\n\
    *   `caret` for easy machine learning workflow\n\n*   `leaps` , for computing\
    \ stepwise regression\n\n```\n\n```\n\n## 18.3 Computing stepwise regression\n\
    \nThere are many functions and R packages for computing stepwise regression. These\
    \ include:\n\n*   `stepAIC()` [MASS package], which choose the best model by AIC.\
    \ It has an option named `direction` , which can take the following values: i)\
    \ \"both\" (for stepwise regression, both forward and backward selection); \"\
    backward\" (for backward selection) and \"forward\" (for forward selection). It\
    \ return the best final model.\n\n```\n\n```\n\n*   `regsubsets()` [leaps package],\
    \ which has the tuning parameter `nvmax` specifying the maximal number of predictors\
    \ to incorporate in the model (See Chapter [17](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ). It returns multiple models with different size up to nvmax. You need to compare\
    \ the performance of the different models for choosing the best one. `regsubsets()`\
    \ has the option `method` , which can take the values \"backward\", \"forward\"\
    \ and \"seqrep\" (seqrep = sequential replacement, combination of forward and\
    \ backward selections).\n\n```\n\n```\n\nNote that, the `train()` function [caret\
    \ package] provides an easy workflow to perform stepwise selections using the\
    \ `leaps` and the MASS packages. It has an option named `method` , which can take\
    \ the following values:\n\n*   `\"leapBackward\"` , to fit linear regression with\
    \ **backward selection**\n\n*   `\"leapForward\"` , to fit linear regression with\
    \ **forward selection**\n\n*   `\"leapSeq\"` , to fit linear regression with **stepwise\
    \ selection** .\n\nYou also need to specify the tuning parameter `nvmax` , which\
    \ corresponds to the maximum number of predictors to be incorporated in the model.\n\
    \nFor example, you can vary `nvmax` from 1 to 5. In this case, the function starts\
    \ by searching different best models of different size, up to the best 5-variables\
    \ model. That is, it searches the best 1-variable model, the best 2-variables\
    \ model, ..., the best 5-variables models.\n\nThe following example performs backward\
    \ selection (`method = \"leapBackward\"` ), using the `swiss` data set, to identify\
    \ the best model for predicting Fertility on the basis of socio-economic indicators.\n\
    \nAs the data set contains only 5 predictors, we'll vary `nvmax` from 1 to 5 resulting\
    \ to the identification of the 5 best models with different sizes: the best 1-variable\
    \ model, the best 2-variables model, ..., the best 5-variables model.\n\nWe'll\
    \ use 10-fold cross-validation to estimate the average prediction error (RMSE)\
    \ of each of the 5 models (see Chapter [14](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ). The RMSE statistical metric is used to compare the 5 models and to automatically\
    \ choose the best one, where best is defined as the model that minimize the RMSE.\n\
    \n```\n\n```\n\n```\n##   nvmax RMSE Rsquared  MAE RMSESD RsquaredSD MAESD\n##\
    \ 1     1 9.30    0.408 7.91   1.53      0.390  1.65\n## 2     2 9.08    0.515\
    \ 7.75   1.66      0.247  1.40\n## 3     3 8.07    0.659 6.55   1.84      0.216\
    \  1.57\n## 4     4 7.27    0.732 5.93   2.14      0.236  1.67\n## 5     5 7.38\
    \    0.751 6.03   2.23      0.239  1.64\n```\n\nThe output above shows different\
    \ metrics and their standard deviation for comparing the accuracy of the 5 best\
    \ models. Columns are:"
