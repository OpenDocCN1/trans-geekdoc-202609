  trans: "\n\np 值表示给定预测变量与结果变量之间的关联。例如，顶部的第一个决策节点显示 `glucose` 是与 `diabetes` 关联最强的变量，p\
    \ 值 < 0.001，因此被选为第一个节点。\n\n## 33.7 讨论\n\n本章介绍了如何在 R 中构建分类树和回归树。树提供了一种非常易于解释和向他人说明的可视化工具。\n\
    \n与线性回归模型（第 `4` 章）相比，当结果变量与预测变量之间存在高度非线性和复杂关系时，树模型可能表现得非常出色。\n\n然而，仅从训练数据集中构建一棵单一树可能会导致预测模型性能较差。单棵树不稳定，其结构可能会因训练数据的小幅变化而改变。\n\
    \n例如，给定预测变量的确切分割点以及算法每一步要选择的预测变量在很大程度上取决于训练数据集。使用略有不同的训练数据可能会改变第一个分割变量，并且树的结构可能会完全改变。\n\
    \n其他机器学习算法——包括 *bagging*、*random forest* 和 *boosting*——可用于从单个数据集中构建多个不同的树，从而提高预测性能。但使用这些方法时，单棵树所观察到的可解释性会丧失。注意，以上所有提到的策略都基于\
    \ CART 算法。参见第 `34` 章和 `35` 章。\n\n# 34 Bagging 和 Random Forest\n\n## 34.1 引言\n\n\
    在第 `33` 章中，我们描述了如何为预测建模构建决策树。\n\n标准的决策树模型 CART，即分类与回归树，仅构建一棵单一树，然后用它来预测新观测的结果。这种策略的输出非常不稳定，树结构可能会因训练数据集中微小变化而严重受影响。\n\
    \n与经典 CART 算法相比，有不同的强大替代方案，包括 `bagging`、`Random Forest` 和 `boosting`。\n\n`Bagging`\
    \ 代表 *bootstrap aggregating*。它通过反复使用数据的多个自助采样子集，从单个训练数据集中构建多个不同的决策树模型并对模型进行平均来实现。这里，每棵树都是独立构建的。有关自助采样的更多内容，请阅读第\
    \ `15` 章。\n\n`Random Forest` 算法是使用最广泛和最强大的机器学习技术之一。它是应用于决策树的一种特殊的 bagging。\n\n\
    与标准 CART 模型（第 `33` 章）相比，随机森林提供了一种强有力的改进，即对数据应用 bagging，并在每次分割时对预测变量进行自助采样（James\
    \ et al. `2014`，P. Bruce and Bruce `2017`）。这意味着在树的算法的每个分割步骤中，从预测变量的完整集合中随机抽取 n\
    \ 个预测变量作为分割候选。\n\n随机森林既可用于分类（预测分类变量），也可用于回归（预测连续变量）。\n\n在本章中，我们将描述如何在 R 中计算随机森林算法以构建强大的预测模型。此外，您还将学习如何根据其对模型精度的贡献对预测变量进行重要性排序。\n\
    \n## 34.2 加载所需的 R 包\n\n* `tidyverse` 用于便捷的数据操作和可视化\n* `caret` 用于便捷的机器学习工作流\n*\
    \ `randomForest` 用于计算随机森林算法\n\n```\n```\n\n## 34.3 分类\n\n### 34.3.1 数据集示例\n\n\
    数据集：`PimaIndiansDiabetes2` [在 `mlbench` 包中]，在第 `21` 章中介绍过，用于基于多个临床变量预测患糖尿病的概率。\n\
    \n随机将数据分为训练集（80% 用于构建预测模型）和测试集（20% 用于评估模型）。确保设置种子以保证可重复性。\n\n```\n```\n\n### 34.3.2\
    \ 计算随机森林分类器\n\n我们将使用 `caret` 工作流，该工作流调用 `randomforest()` 函数 [`randomForest` 包]，以自动选择在每次分割时随机抽样的最优数量（`mtry`）的预测变量，并拟合解释我们数据最好的最终随机森林模型。\n\
    \n我们将在函数 `train()` 中使用以下参数：\n\n* `trControl`，用于设置 10 折交叉验证\n\n```\n```\n\n```\n\
    ##   mtry\n## 3    8\n```\n\n```\n```\n\n```\n## \n## Call:\n##  randomForest(x\
    \ = x, y = y, mtry = param$mtry, importance = TRUE) \n##                Type of\
    \ random forest: classification\n##                      Number of trees: 500\n\
    ## No. of variables tried at each split: 8\n## \n##         OOB estimate of  error\
    \ rate: 22%\n## Confusion matrix:\n##     neg pos class.error\n## neg 185  25\
    \       0.119\n## pos  44  60       0.423\n```\n\n```\n```\n\n```\n## [1] neg\
    \ pos neg neg pos neg\n## Levels: neg pos\n```\n\n```\n```\n\n```\n## [1] 0.808\n\
    ```\n\n默认情况下，训练 500 棵树。在每次分割时抽样的最优变量数为 8。\n\n每棵 bagged 树大约使用三分之二的观测值。未用于拟合给定 bagged\
    \ 树的剩余三分之一观测值被称为袋外（out-of-bag, OOB）观测值（James et al. `2014`）。\n\n对于给定的树，袋外（OOB）误差是该树在预测未用于其训练集的数据时的模型误差（P.\
    \ Bruce and Bruce `2017`）。OOB 是估计 bagged 模型的测试误差的一种非常直接的方法，无需进行交叉验证或验证集方法。\n\n\
    在我们的示例中，OBB 估计的误差率为 24%。\n\n在新测试数据上的预测准确率为 79%，效果良好。\n\n### 34.3.3 变量重要性\n\n每个变量的重要性可使用函数\
    \ `importance()` [`randomForest` 包] 打印：\n\n```\n```\n\n```\n##            neg\
    \    pos MeanDecreaseAccuracy MeanDecreaseGini\n## pregnant 11.57  0.318     \
    \           10.36             8.86\n## glucose  38.93 28.437                46.17\
    \            53.30\n## pressure -1.94  0.846                -1.06            \
    \ 8.09\n## triceps   6.19  3.249                 6.85             9.92\n## insulin\
    \   8.65 -2.037                 6.01            12.43\n## mass      7.71  2.299\
    \                 7.57            14.58\n## pedigree  6.57  1.083            \
    \     5.66            14.50\n## age       9.51 12.310                15.75   \
    \         16.76\n```\n\n结果显示：\n\n* `MeanDecreaseAccuracy`，即在排除特定变量的情况下，预测袋外样本结果的模型准确度的平均下降幅度。\n\
    * `MeanDecreaseGini`，即通过该变量进行分割所导致的节点不纯度平均下降幅度。Gini 不纯度指数仅用于分类问题。在回归中，节点不纯度通过训练集\
    \ RSS 衡量。这些度量使用训练集计算得出，其可靠性不如使用袋外数据计算的度量。请参阅第 `33` 章了解节点不纯度度量（Gini 指数和 RSS）。\n\
    \n"
