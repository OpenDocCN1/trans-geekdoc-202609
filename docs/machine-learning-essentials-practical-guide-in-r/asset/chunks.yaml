    \ A less obvious but potentially more important advantage of `k`-fold CV is that\
    \ it often gives more accurate estimates of the test error rate than does LOOCV\
    \ (`James et al. 2014`).\n\nTypical question, is how to choose right value of\
    \ `k`?\n\nLower value of `K` is more biased and hence undesirable. On the other\
    \ hand, higher value of `K` is less biased, but can suffer from large variability.\
    \ It is not hard to see that a smaller value of `k` (say `k = 2`) always takes\
    \ us towards validation set approach, whereas a higher value of `k` (say `k =\
    \ number of data points`) leads us to LOOCV approach.\n\nIn practice, one typically\
    \ performs `k`-fold cross-validation using `k = 5` or `k = 10`, as these values\
    \ have been shown empirically to yield test error rate estimates that suffer neither\
    \ from excessively high bias nor from very high variance.\n\nThe following example\
    \ uses 10-fold cross validation to estimate the prediction error. Make sure to\
    \ set seed for reproducibility.\n\n```\n```\n\n```\n## Linear Regression \n##\
    \ \n## 47 samples\n##  5 predictor\n## \n## No pre-processing\n## Resampling:\
    \ Cross-Validated (10 fold) \n## Summary of sample sizes: 43, 42, 42, 41, 43,\
    \ 41, ... \n## Resampling results:\n## \n##   RMSE  Rsquared  MAE \n##   7.38\
    \  0.751     6.03\n## \n## Tuning parameter 'intercept' was held constant at a\
    \ value of TRUE\n```\n\n### 14.5.4 Repeated K-fold cross-validation\n\nThe process\
    \ of splitting the data into `k`-folds can be repeated a number of times, this\
    \ is called repeated `k`-fold cross validation.\n\nThe final model error is taken\
    \ as the mean error from the number of repeats.\n\nThe following example uses\
    \ 10-fold cross validation with 3 repeats:\n\n```\n```\n\n## 14.6 Discussion\n\
    \nIn this chapter, we described 4 different methods for assessing the performance\
    \ of a model on unseen test data.\n\nThese methods include: validation set approach,\
    \ leave-one-out cross-validation, `k`-fold cross-validation and repeated `k`-fold\
    \ cross-validation.\n\nWe generally recommend the (repeated) `k`-fold cross-validation\
    \ to estimate the prediction error rate. It can be used in regression and classification\
    \ settings.\n\nAnother alternative to cross-validation is the bootstrap resampling\
    \ methods (Chapter 15), which consists of repeatedly and randomly selecting a\
    \ sample of `n` observations from the original data set, and to evaluate the model\
    \ performance on each copy.\n\n# 15 Bootstrap Resampling\n\n## 15.1 Introduction\n\
    \nSimilarly to cross-validation techniques (Chapter 14), the **bootstrap resampling**\
    \ method can be used to measure the accuracy of a predictive model. Additionally,\
    \ it can be used to measure the uncertainty associated with any statistical estimator.\n\
    \nBootstrap resampling consists of repeatedly selecting a sample of `n` observations\
    \ from the original data set, and to evaluate the model on each copy. An average\
    \ standard error is then calculated and the results provide an indication of the\
    \ overall variance of the model performance.\n\nThis chapter describes the basics\
    \ of bootstrapping and provides practical examples in R for computing a model\
    \ prediction error. Additionally, we'll show you how to compute an estimator uncertainty\
    \ using bootstrap techniques.\n\n## 15.2 Loading required R packages\n\n* `tidyverse`\
    \ for easy data manipulation and visualization\n* `caret` for easily computing\
    \ cross-validation methods\n\n```\n```\n\n## 15.3 Example of data\n\nWe'll use\
    \ the built-in R `swiss` data, introduced in the Chapter 3, for predicting fertility\
    \ score on the basis of socio-economic indicators.\n\n```\n```\n\n## 15.4 Bootstrap\
    \ procedure\n\nThe bootstrap method is used to quantify the uncertainty associated\
    \ with a given statistical estimator or with a predictive model.\n\nIt consists\
    \ of randomly selecting a sample of `n` observations from the original data set.\
    \ This subset, called bootstrap data set is then used to evaluate the model.\n\
    \nThis procedure is repeated a large number of times and the standard error of\
    \ the bootstrap estimate is then calculated. The results provide an indication\
    \ of the variance of the models performance.\n\nNote that, the sampling is performed\
    \ with replacement, which means that the same observation can occur more than\
    \ once in the bootstrap data set.\n\n## 15.5 Evaluating a predictive model performance\n\
    \nThe following example uses a bootstrap with 100 resamples to test a linear regression\
    \ model:\n\n```\n```\n\n```\n## Linear Regression \n## \n## 47 samples\n##  5\
    \ predictor\n## \n## No pre-processing\n## Resampling: Bootstrapped (100 reps)\
    \ \n## Summary of sample sizes: 47, 47, 47, 47, 47, 47, ... \n## Resampling results:\n\
    ## \n##   RMSE  Rsquared  MAE \n##   8.13  0.608     6.54\n## \n## Tuning parameter\
    \ 'intercept' was held constant at a value of TRUE\n```\n\nThe output shows the\
    \ average model performance across the 100 resamples.\n\n`RMSE` (Root Mean Squared\
    \ Error) and `MAE`(Mean Absolute Error), represent two different measures of the\
    \ model prediction error. The lower the `RMSE` and the `MAE`, the better the model.\
    \ The `R-squared` represents the proportion of variation in the outcome explained\
    \ by the predictor variables included in the model. The higher the `R-squared`,\
    \ the better the model. Read more on these metrics at Chapter 13.\n\n## 15.6 Quantifying\
    \ an estimator uncertainty and confidence intervals\n\nThe bootstrap approach\
    \ can be used to quantify the uncertainty (or standard error) associated with\
    \ any given statistical estimator.\n\nFor example, you might want to estimate\
    \ the accuracy of the linear regression beta coefficients using bootstrap method.\n\
    \nThe different steps are as follow:\n\n1. Create a simple function, `model_coef()`,\
    \ that takes the `swiss` data set as well as the indices for the observations,\
    \ and returns the regression coefficients.\n2. Apply the function `boot_fun()`\
    \ to the full data set of 47 observations in order to compute the coefficients\n\
    \nWe start by creating a function that returns the regression model coefficients:\n\
    \n```\n```\n\n```\n##      (Intercept)      Agriculture      Examination     \
    \   Education \n##           66.915           -0.172           -0.258        \
    \   -0.871 \n##         Catholic Infant.Mortality \n##            0.104      \
    \      1.077\n```\n\nNext, we use the `boot()` function [boot package] to compute\
    \ the standard errors of 500 bootstrap estimates for the coefficients:\n\n```\n\
    ```\n\n```\n## \n## ORDINARY NONPARAMETRIC BOOTSTRAP\n## \n## \n## Call:\n## boot(data\
    \ = swiss, statistic = model_coef, R = 500)\n## \n## \n## Bootstrap Statistics\
    \ :\n##     original    bias    std. error\n## t1*   66.915  0.686934     12.2030\n\
    ## t2*   -0.172 -0.001180      0.0680\n## t3*   -0.258 -0.009005      0.2735\n\
    ## t4*   -0.871  0.009360      0.2269\n## t5*    0.104  0.000603      0.0323\n\
    ## t6*    1.077 -0.028493      0.4560\n```\n\nIn the output above,\n\n* `original`\
    \ column corresponds to the regression coefficients. The associated standard errors\
    \ are given in the column `std.error`.\n* `t1` corresponds to the intercept, `t2`\
    \ corresponds to `Agriculture` and so on...\n\nFor example, it can be seen that,\
    \ the standard error (SE) of the regression coefficient associated with `Agriculture`\
    \ is 0.06.\n\nNote that, the standard errors measure the variability/accuracy\
    \ of the beta coefficients. It can be used to compute the confidence intervals\
    \ of the coefficients.\n\nFor example, the 95% confidence interval for a given\
    \ coefficient `b` is defined as `b +/- 2*SE(b)`, where:\n\n* the lower limits\
    \ of `b` = `b - 2*SE(b) = -0.172 - (2*0.0680) = -0.308` (for Agriculture variable)\n\
    * the upper limits of `b` = `b + 2*SE(b) = -0.172 + (2*0.0680) = -0.036` (for\
    \ Agriculture variable)\n\nThat is, there is approximately a 95% chance that the\
    \ interval `[-0.308, -0.036]` will contain the true value of the coefficient.\n\
    \n"
