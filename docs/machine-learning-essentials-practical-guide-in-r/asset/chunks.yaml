  trans: "\n\n使用标准的 `lm()` 函数会给出略有不同的标准误差，因为线性模型对数据做了一些假设：\n\n```\n```\n```\n##  \
    \                Estimate Std. Error t value Pr(>|t|)\n## (Intercept)        66.915\
    \    10.7060    6.25 1.91e-07\n## Agriculture        -0.172     0.0703   -2.45\
    \ 1.87e-02\n## Examination        -0.258     0.2539   -1.02 3.15e-01\n## Education\
    \          -0.871     0.1830   -4.76 2.43e-05\n## Catholic            0.104  \
    \   0.0353    2.95 5.19e-03\n## Infant.Mortality    1.077     0.3817    2.82 7.34e-03\n\
    ```\n\n自助法并不依赖线性模型所做的任何假设，因此它很可能比 `summary()` 函数更准确地估计系数的标准误差。\n\n## 15.7 讨论\n\
    \n本章描述了用于评估预测模型准确性的自助重采样方法，以及用于衡量给定统计估计量相关不确定性的方法。\n\n用于评估预测模型性能的自助法的替代方法是交叉验证技术（第\
    \ 14 章）。\n\n# 16 引言\n\n当预测模型中存在许多预测变量时，`model selection` 方法允许自动选择构建最优预测模型的预测变量的最佳组合。\n\
    \n去除不相关的变量会使模型更易解释且更简单。在性能相同的情况下，应始终优先使用更简单的模型而不是更复杂的模型。\n\n此外，在某些情况下，使用模型选择方法至关重要，此时你拥有包含许多预测变量的大型多变量数据集。这在基因组学领域经常出现，其中一个重大挑战在于基因组变量的数量（`p`）通常远大于个体数量（`n`）（即\
    \ `p >> n`）（Bovelstad et al. 2007 ）。\n\n众所周知，当 `p >> n` 时，很容易找到在拟合数据上表现优异但在外部验证中失败的预测因子，从而导致预测规则不佳。此外，最小二乘拟合中可能存在大量变异，导致过拟合，从而对未用于模型训练的未来观测产生较差的预测（James\
    \ et al. 2014 ）。\n\n一种可能的策略是对预测因子的所有可能组合进行测试，然后选择最佳模型。该方法称为 `best subsets regression`（第\
    \ 17 章），计算成本高昂，对于具有大量变量的大型数据集变得不可行。\n\n比最佳子集回归更好的替代方法是使用 `stepwise regression`（第\
    \ 18 章）方法，该方法通过添加和删除预测因子来寻找具有减少变量集的最佳性能模型。\n\n用于高维数据、包含多个预测变量的其他方法包括 `penalized\
    \ regression`（岭回归和套索回归，第 19 章）和 `principal components-based regression methods`（PCR\
    \ 和 PLS，第 20 章）。\n\n在本部分，我们将介绍三种不同类别的方法，用于为大型多变量数据选择最优线性模型。这些包括：\n\n* Best subsets\
    \ selection (Chapter 17 )\n* Stepwise selection (Chapter 18 )\n* Penalized regression\
    \ (or shrinkage methods) (Chapter 19 )\n* Dimension reduction methods (Chapter\
    \ 20 )\n\n# 17 Best Subsets Regression\n\n## 17.1 引言\n\n`best subsets regression`\
    \ 是一种模型选择方法，其包括测试预测变量的所有可能组合，然后根据某些统计标准选择最佳模型。\n\n在本章中，我们将描述如何使用 R 计算最佳子集回归。\n\
    \n## 17.2 加载所需的 R 包\n\n* `tidyverse` 用于轻松的数据操作和可视化\n* `caret` 用于轻松的机器学习工作流\n*\
    \ `leaps` ，用于计算最佳子集回归\n\n```\n```\n\n## 17.3 示例数据\n\n我们将使用内置的 R `swiss` 数据，该数据在第\
    \ 3 章中介绍，用于基于社会经济指标预测生育率分数。\n\n```\n```\n\n## 17.4 计算最佳子集回归\n\nR 函数 `regsubsets()`\
    \ [`leaps` package] 可用于识别不同大小的不同最佳模型。\n\n你需要指定选项 `nvmax` ，它表示要纳入模型的最大预测变量数。例如，如果\
    \ `nvmax = 5` ，函数将返回最多 5 个变量的最佳模型，即返回最佳 1 变量模型、最佳 2 变量模型、...、最佳 5 变量模型。\n\n在我们的示例中，数据中只有\
    \ 5 个预测变量。因此，我们将使用 `nvmax = 5` 。\n\n```\n```\n```\n## Subset selection object\n\
    ## Call: regsubsets.formula(Fertility ~ ., data = swiss, nvmax = 5)\n## 5 Variables\
    \  (and intercept)\n##                  Forced in Forced out\n## Agriculture \
    \         FALSE      FALSE\n## Examination          FALSE      FALSE\n## Education\
    \            FALSE      FALSE\n## Catholic             FALSE      FALSE\n## Infant.Mortality\
    \     FALSE      FALSE\n## 1 subsets of each size up to 5\n## Selection Algorithm:\
    \ exhaustive\n##          Agriculture Examination Education Catholic Infant.Mortality\n\
    ## 1  ( 1 ) \" \"         \" \"         \"*\"       \" \"      \" \"         \
    \    \n## 2  ( 1 ) \" \"         \" \"         \"*\"       \"*\"      \" \"  \
    \           \n## 3  ( 1 ) \" \"         \" \"         \"*\"       \"*\"      \"\
    *\"             \n## 4  ( 1 ) \"*\"         \" \"         \"*\"       \"*\"  \
    \    \"*\"             \n## 5  ( 1 ) \"*\"         \"*\"         \"*\"       \"\
    *\"      \"*\"\n```\n\n函数 `summary()` 报告每个模型大小的最佳变量集。从上面的输出中，星号指定给定变量是否包含在相应模型中。\n\
    \n例如，可以看出最佳 2 变量模型仅包含 Education 和 Catholic 变量（`Fertility ~ Education + Catholic`\
    \ ）。最佳三变量模型为（`Fertility ~ Education + Catholic + Infant.mortality` ），依此类推。\n\n\
    一个自然的问题是：我们最终应该为预测分析选择这些最佳模型中的哪一个？\n\n## 17.5 选择最优模型\n\n要回答这个问题，你需要一些统计指标或策略来比较模型的整体性能并选择最佳模型。你需要估计每个模型的预测误差并选择预测误差较低的模型。\n\
    \n### 17.5.1 模型选择标准：Adjusted R2、Cp 和 BIC\n\n`summary()` 函数返回一些指标 - Adjusted R2、Cp\
    \ 和 BIC（见第 13 章） - 允许我们识别整体最佳模型，其中最佳定义为使调整后 R2 最大化并使预测误差（RSS、cp 和 BIC）最小化的模型。\n\
    \n调整后 R2 表示结果变异中由预测变量值变异解释的比例。调整后 R2 越高，模型越好。\n\n根据每个指标的最佳模型可以按如下方式提取：\n\n```\n\
    ```\n```\n##   Adj.R2 CP BIC\n## 1      5  4   4\n```\n\n模型选择没有单一的正确解决方案，每个标准都会导致略有不同的模型。记住，[\"\
    All models are wrong, some models are useful\"](https://en.wikipedia.org/wiki/All_models_are_wrong)\
    \ 。\n\n这里，调整后 R2 告诉我们最佳模型是包含全部 5 个预测变量的模型。然而，使用 BIC 和 Cp 标准，我们应该选择具有 4 个变量的模型。\n\
    \n"
