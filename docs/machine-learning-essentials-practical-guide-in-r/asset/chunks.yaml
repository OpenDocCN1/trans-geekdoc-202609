    ## 13.6 评估模型质量


    有许多 R 函数和包可用于评估模型质量，包括：


    *   `summary()` [stats package]，返回 `R-squared`、调整后 `R-squared` 和 `RSE`

    *   `AIC()` 和 `BIC()` [stats package]，分别计算 `AIC` 和 `BIC`


    ```

    ```


    *   `rsquare()`、`rmse()` 和 `mae()` [modelr package]，分别计算 `R2`、`RMSE` 和 `MAE`。


    ```

