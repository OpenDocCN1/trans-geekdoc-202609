  trans: "\n\nRidge regression will perform better when the outcome is a function\
    \ of many predictors, all with coefficients of roughly equal size (James et al.\
    \ 2014).\n\nCross-validation methods can be used for identifying which of these\
    \ two techniques is better on a particular data set.\n\n### 19.2.3 Elastic Net\n\
    \nElastic Net produces a regression model that is penalized with both the `L1-norm`\
    \ and `L2-norm`. The consequence of this is to effectively shrink coefficients\
    \ (like in ridge regression) and to set some coefficients to zero (as in LASSO).\n\
    \n## 19.3 Loading required R packages\n\n* `tidyverse` for easy data manipulation\
    \ and visualization\n* `caret` for easy machine learning workflow\n* `glmnet`,\
    \ for computing penalized regression\n\n```\n```\n\n## 19.4 Preparing the data\n\
