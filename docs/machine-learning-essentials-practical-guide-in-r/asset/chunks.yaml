    ## 30.4 Overall classification accuracy


    The overall **classification accuracy** rate corresponds to the proportion of
    observations that have been correctly classified. Determining the raw classification
    accuracy is the first step in assessing the performance of a model.


    Inversely, the **classification error rate** is defined as the proportion of observations
    that have been misclassified. `Error rate = 1 - accuracy`


    The raw classification accuracy and error can be easily computed by comparing
    the observed classes in the test data against the predicted classes by the model:


    ```


