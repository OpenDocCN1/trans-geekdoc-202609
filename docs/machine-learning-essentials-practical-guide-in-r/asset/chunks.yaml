    # 6 Regression with Categorical Variables


    ## 6.1 Introduction


    This chapter describes how to compute **regression with categorical variables**
    .


    **Categorical variables** (also known as *factor* or *qualitative variables* )
    are variables that classify observations into groups. They have a limited number
    of different values, called levels. For example the gender of individuals are
    a categorical variable that can take two levels: Male or Female.


    Regression analysis requires numerical variables. So, when a researcher wishes
    to include a categorical variable in a regression model, supplementary steps are
    required to make the results interpretable.


    In these steps, the categorical variables are recoded into a set of separate binary
    variables. This recoding is called "dummy coding" and leads to the creation of
    a table called *contrast matrix* . This is done automatically by statistical software,
    such as R.


    Here, you''ll learn how to build and interpret a linear regression model with
    categorical predictor variables. We''ll also provide practical examples in R.


    ## 6.2 Loading Required R packages


    *   `tidyverse` for easy data manipulation and visualization


    ```


    ```


    ## 6.3 Example of data set


    We''ll use the `Salaries` data set [`car` package], which contains 2008-09 nine-month
    academic salary for Assistant Professors, Associate Professors and Professors
    in a college in the U.S.


    The data were collected as part of the on-going effort of the college’s administration
    to monitor salary differences between male and female faculty members.


    ```


    ```


    ```

    ##         rank discipline yrs.since.phd yrs.service  sex salary

    ## 313     Prof          A            29          19 Male  94350

    ## 162     Prof          B            26          19 Male 176500

    ## 349 AsstProf          B             4           3 Male  80139

    ```


    ## 6.4 Categorical variables with two levels


    Recall that, the regression equation, for predicting an outcome variable (y) on
    the basis of a predictor variable (x), can be simply written as `y = b0 + b1*x`
    . `b0` and `b1 are the regression beta coefficients, representing the intercept
    and the slope, respectively.


    Suppose that, we wish to investigate differences in salaries between males and
    females.


    Based on the gender variable, we can create a new dummy variable that takes the
    value:


    *   `1` if a person is male


    *   `0` if a person is female


    and use this variable as a predictor in the regression equation, leading to the
    following the model:


    *   `b0 + b1` if person is male


    *   `bo` if person is female


    The coefficients can be interpreted as follow:


    1.  `b0` is the average salary among females,


    2.  `b0 + b1` is the average salary among males,


    3.  and `b1` is the average difference in salary between males and females.


    For simple demonstration purpose, the following example models the salary difference
    between males and females by computing a simple linear regression model on the
    `Salaries` data set [`car` package]. R creates dummy variables automatically:


    ```


    ```


    ```

    ##             Estimate Std. Error t value Pr(>|t|)

    ## (Intercept)   101002       4809   21.00 2.68e-66

    ## sexMale        14088       5065    2.78 5.67e-03

    ```


    From the output above, the average salary for female is estimated to be 101002,
    whereas males are estimated a total of 101002 + 14088 = 115090. The p-value for
    the dummy variable `sexMale` is very significant, suggesting that there is a statistical
    evidence of a difference in average salary between the genders.


    The `contrasts()` function returns the coding that R have used to create the dummy
    variables:


    ```


    ```


    ```

    ##        Male

    ## Female    0

    ## Male      1

    ```


    R has created a sexMale dummy variable that takes on a value of 1 if the sex is
    Male, and 0 otherwise. The decision to code males as 1 and females as 0 (baseline)
    is arbitrary, and has no effect on the regression computation, but does alter
    the interpretation of the coefficients.


    You can use the function `relevel()` to set the baseline category to males as
    follow:


    ```


    ```


    The output of the regression fit becomes:


    ```


    ```


    ```

    ##             Estimate Std. Error t value  Pr(>|t|)

    ## (Intercept)   115090       1587   72.50 2.46e-230

    ## sexFemale     -14088       5065   -2.78  5.67e-03

    ```


    The fact that the coefficient for `sexFemale` in the regression output is negative
    indicates that being a Female is associated with decrease in salary (relative
    to Males).


    Now the estimates for `bo` and `b1` are 115090 and -14088, respectively, leading
    once again to a prediction of average salary of 115090 for males and a prediction
    of 115090 - 14088 = 101002 for females.


    Alternatively, instead of a 0/1 coding scheme, we could create a dummy variable
    -1 (male) / 1 (female) . This results in the model:


    *   `b0 - b1` if person is male


    *   `b0 + b1` if person is female


    So, if the categorical variable is coded as -1 and 1, then if the regression coefficient
    is positive, it is subtracted from the group coded as -1 and added to the group
    coded as 1. If the regression coefficient is negative, then addition and subtraction
    is reversed.


    ## 6.5 Categorical variables with more than two levels


    Generally, a categorical variable with n levels will be transformed into n-1 variables
    each with two levels. These n-1 new variables contain the same information than
    the single variable. This recoding creates a table called **contrast matrix**
    .


    For example `rank` in the `Salaries` data has three levels: "AsstProf", "AssocProf"
    and "Prof". This variable could be dummy coded into two variables, one called
    AssocProf and one Prof:


    *   If rank = AssocProf, then the column AssocProf would be coded with a 1 and
    Prof with a 0.


    *   If rank = Prof, then the column AssocProf would be coded with a 0 and Prof
    would be coded with a 1.


    *   If rank = AsstProf, then both columns "AssocProf" and "Prof" would be coded
    with a 0.


    This dummy coding is automatically performed by R. For demonstration purpose,
    you can use the function `model.matrix()` to create a contrast matrix for a factor
    variable:


    ```


    ```


    ```

    ##   rankAssocProf rankProf

    ## 1             0        1

    ## 2             0        1

    ## 3             0        0

    ## 4             0        1

    ## 5             0        1

    ## 6             1        0

    ```


    When building linear model, there are different ways to encode categorical variables,
    known as contrast coding systems. The default option in R is to use the first
    level of the factor as a reference and interpret the remaining levels relative
    to this level.


    Note that, ANOVA (analyse of variance) is just a special case of linear model
    where the predictors are categorical variables. And, because R understands the
    fact that ANOVA and regression are both examples of linear models, it lets you
    extract the classic ANOVA table from your regression model using the R base `anova()`
    function or the `Anova()` function [in `car` package]. We generally recommend
    the `Anova()` function because it automatically takes care of unbalanced designs.


    The results of predicting salary from using a multiple regression procedure are
    presented below.


    ```


