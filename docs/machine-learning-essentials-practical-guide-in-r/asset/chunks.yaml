    \ set (20% for evaluating the model). Make sure to set seed for reproducibility.\n\
    \n```\n\n```\n\n### 32.4.2 Computing KNN classifier\n\nWe'll use the `caret` package,\
    \ which automatically tests different possible values of k, then chooses the optimal\
    \ k that minimizes the cross-validation (\"cv\") error, and fits the final best\
    \ KNN model that explains the best our data.\n\nAdditionally `caret` can automatically\
    \ preprocess the data in order to normalize the predictor variables.\n\nWe'll\
    \ use the following arguments in the function `train()` :\n\n*   `trControl` ,\
    \ to set up 10-fold cross validation\n\n*   `preProcess` , to normalize the data\n\
    \n*   `tuneLength` , to specify the number of possible k values to evaluate\n\n\
