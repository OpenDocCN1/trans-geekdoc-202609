- raw: "Using the standard `lm()` function gives a slightly different standard errors,\
    \ because the linear model make some assumptions about the data:\n\n```\n\n```\n\
    \n```\n##                  Estimate Std. Error t value Pr(>|t|)\n## (Intercept)\
    \        66.915    10.7060    6.25 1.91e-07\n## Agriculture        -0.172    \
    \ 0.0703   -2.45 1.87e-02\n## Examination        -0.258     0.2539   -1.02 3.15e-01\n\
    ## Education          -0.871     0.1830   -4.76 2.43e-05\n## Catholic        \
    \    0.104     0.0353    2.95 5.19e-03\n## Infant.Mortality    1.077     0.3817\
    \    2.82 7.34e-03\n```\n\nThe bootstrap approach does not rely on any of these\
    \ assumptions made by the linear model, and so it is likely giving a more accurate\
    \ estimate of the coefficients standard errors than is the summary() function.\n\
    \n## 15.7 Discussion\n\nThis chapter describes bootstrap resampling method for\
    \ evaluating a predictive model accuracy, as well as, for measuring the uncertainty\
    \ associated with a given statistical estimator.\n\nAn alternative approach to\
    \ bootstrapping, for evaluating a predictive model performance, is cross-validation\
    \ techniques (Chapter [14](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\n# 16 Introduction\n\
    \nWhen you have many predictor variables in a predictive model, the **model selection**\
    \ methods allow to select automatically the best combination of predictor variables\
    \ for building an optimal predictive model.\n\nRemoving irrelevant variables leads\
    \ a more interpretable and a simpler model. With the same performance, a simpler\
    \ model should be always used in preference to a more complex model.\n\nAdditionally,\
    \ the use of model selection approaches is critical in some situations, where\
    \ you have a large multivariate data sets with many predictor variables. This\
    \ is often the case in genomic area, where a substantial challenge comes from\
    \ the fact that the number of genomic variables (p) is usually much larger than\
    \ the number of individuals (n) (i.e., p >> n) (Bovelstad et al. [2007](#text00039.html#ref-bovelstad2007)\
    \ ) .\n\nIt's well known that, when p >> n, it is easy to find predictors that\
    \ perform excellently on the fitted data, but fail in external validation, leading\
    \ to poor prediction rules. Furthermore, there can be a lot of variability in\
    \ the least squares fit, resulting in overfitting and consequently poor predictions\
    \ on future observations not used in model training (James et al. [2014](#text00039.html#ref-james2014)\
    \ ) .\n\nOne possible strategy consists of testing all possible combination of\
    \ the predictors, and then selecting the best model. This method called **best\
    \ subsets regression** (Chapter [17](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ) is\
    \ computationally expensive and becomes unfeasible for a large data set with many\
    \ variables.\n\nA better alternative to the best subsets regression is to use\
    \ the **stepwise regression** (Chapter [18](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) method, which consists of adding and deleting predictors in order to find\
    \ the best performing model with a reduced set of variables .\n\nOther methods\
    \ for high-dimensional data, containing multiple predictor variables, include\
    \ the **penalized regression** (ridge and lasso regression, Chapter [19](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) and the **principal components-based regression methods** (PCR and PLS, Chapter\
    \ [20](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\nIn this part, we'll cover three\
    \ different categories of approaches to select an optimal linear model for a large\
    \ multivariate data. These include:\n\n*   Best subsets selection (Chapter [17](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )\n\n*   Stepwise selection (Chapter [18](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )\n\n*   Penalized regression (or shrinkage methods) (Chapter [19](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )\n\n*   Dimension reduction methods (Chapter [20](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )\n\n# 17 Best Subsets Regression\n\n## 17.1 Introduction\n\nThe **best subsets\
    \ regression** is a model selection approach that consists of testing all possible\
    \ combination of the predictor variables, and then selecting the best model according\
    \ to some statistical criteria.\n\nIn this chapter, we'll describe how to compute\
    \ best subsets regression using R.\n\n## 17.2 Loading required R packages\n\n\
    *   `tidyverse` for easy data manipulation and visualization\n\n*   `caret` for\
    \ easy machine learning workflow\n\n*   `leaps` , for computing best subsets regression\n\
    \n```\n\n```\n\n## 17.3 Example of data\n\nWe'll use the built-in R `swiss` data,\
    \ introduced in the Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for predicting\
    \ fertility score on the basis of socio-economic indicators.\n\n```\n\n```\n\n\
    ## 17.4 Computing best subsets regression\n\nThe R function `regsubsets()` [`leaps`\
    \ package] can be used to identify different best models of different sizes. \
    \ \n\nYou need to specify the option `nvmax` , which represents the maximum number\
    \ of predictors to incorporate in the model. For example, if `nvmax = 5` , the\
    \ function will return up to the best 5-variables model, that is, it returns the\
    \ best 1-variable model, the best 2-variables model, ..., the best 5-variables\
    \ models.\n\nIn our example, we have only 5 predictor variables in the data. So,\
    \ we'll use `nvmax = 5` .\n\n```\n\n```\n\n```\n## Subset selection object\n##\
    \ Call: regsubsets.formula(Fertility ~ ., data = swiss, nvmax = 5)\n## 5 Variables\
    \  (and intercept)\n##                  Forced in Forced out\n## Agriculture \
    \         FALSE      FALSE\n## Examination          FALSE      FALSE\n## Education\
    \            FALSE      FALSE\n## Catholic             FALSE      FALSE\n## Infant.Mortality\
    \     FALSE      FALSE\n## 1 subsets of each size up to 5\n## Selection Algorithm:\
    \ exhaustive\n##          Agriculture Examination Education Catholic Infant.Mortality\n\
    ## 1  ( 1 ) \" \"         \" \"         \"*\"       \" \"      \" \"         \
    \    \n## 2  ( 1 ) \" \"         \" \"         \"*\"       \"*\"      \" \"  \
    \           \n## 3  ( 1 ) \" \"         \" \"         \"*\"       \"*\"      \"\
    *\"             \n## 4  ( 1 ) \"*\"         \" \"         \"*\"       \"*\"  \
    \    \"*\"             \n## 5  ( 1 ) \"*\"         \"*\"         \"*\"       \"\
    *\"      \"*\"\n```\n\nThe function `summary()` reports the best set of variables\
    \ for each model size. From the output above, an asterisk specifies that a given\
    \ variable is included in the corresponding model.\n\nFor example, it can be seen\
    \ that the best 2-variables model contains only Education and Catholic variables\
    \ (`Fertility ~ Education + Catholic` ). The best three-variable model is (`Fertility\
    \ ~ Education + Catholic + Infant.mortality` ), and so forth.\n\nA natural question\
    \ is: which of these best models should we finally choose for our predictive analytics?\n\
    \n## 17.5 Choosing the optimal model\n\nTo answer to this questions, you need\
    \ some statistical metrics or strategies to compare the overall performance of\
    \ the models and to choose the best one. You need to estimate the prediction error\
    \ of each model and to select the one with the lower prediction error.\n\n###\
    \ 17.5.1 Model selection criteria: Adjusted R2, Cp and BIC\n\nThe `summary()`\
    \ function returns some metrics - Adjusted R2, Cp and BIC (see Chapter [13](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) - allowing us to identify the best overall model, where best is defined as\
    \ the model that maximize the adjusted R2 and minimize the prediction error (RSS,\
    \ cp and BIC).\n\nThe adjusted R2 represents the proportion of variation, in the\
    \ outcome, that are explained by the variation in predictors values. the higher\
    \ the adjusted R2, the better the model.\n\nThe best model, according to each\
    \ of these metrics, can be extracted as follow:\n\n```\n\n```\n\n```\n##   Adj.R2\
    \ CP BIC\n## 1      5  4   4\n```\n\nThere is no single correct solution to model\
    \ selection, each of these criteria will lead to slightly different models. Remember\
    \ that, [\"All models are wrong, some models are useful\"](https://en.wikipedia.org/wiki/All_models_are_wrong)\
    \ .\n\nHere, adjusted R2 tells us that the best model is the one with all the\
    \ 5 predictor variables. However, using the BIC and Cp criteria, we should go\
    \ for the model with 4 variables."
