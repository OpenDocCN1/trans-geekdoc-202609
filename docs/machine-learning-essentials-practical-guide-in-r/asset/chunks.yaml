    \ Discriminant Analysis* (Chapter [27](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\
    \n# 23 Stepwise Logistic Regression\n\n**Stepwise logistic regression** consists\
    \ of automatically selecting a reduced number of predictor variables for building\
    \ the best performing logistic regression model. Read more at Chapter [18](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\nThis chapter describes how to compute the stepwise logistic regression\
    \ in **R** .\n\n## 23.1 Loading required R packages\n\n*   `tidyverse` for easy\
    \ data manipulation and visualization\n\n*   `caret` for easy machine learning\
    \ workflow\n\n```\n\n```\n\n## 23.2 Preparing the data\n\nData set: `PimaIndiansDiabetes2`\
    \ [in `mlbench` package], introduced in Chapter [21](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ , for predicting the probability of being diabetes positive based on multiple\
    \ clinical variables.\n\nWe'll randomly split the data into training set (80%\
    \ for building a predictive model) and test set (20% for evaluating the model).\
    \ Make sure to set seed for reproductibility.\n\n```\n\n```\n\n## 23.3 Computing\
    \ stepwise logistique regression\n\nThe stepwise logistic regression can be easily\
    \ computed using the R function `stepAIC()` available in the MASS package. It\
    \ performs model selection by AIC. It has an option called `direction` , which\
    \ can have the following values: \"both\", \"forward\", \"backward\" (see Chapter\
    \ [18](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\n### 23.3.1 Quick start R code\n\
    \n```\n\n```\n\n### 23.3.2 Full logistic regression model\n\nFull model incorporating\
    \ all predictors:\n\n```\n\n```\n\n```\n## (Intercept)    pregnant     glucose\
    \    pressure     triceps     insulin \n##    -9.50372     0.04571     0.04230\
    \    -0.00700     0.01858    -0.00159 \n##        mass    pedigree         age\
    \ \n##     0.04502     0.96845     0.04256\n```\n\n### 23.3.3 Perform stepwise\
    \ variable selection\n\nSelect the most contributive variables:\n\n```\n\n```\n\
    \n```\n## (Intercept)     glucose        mass    pedigree         age \n##   \
    \  -9.5612      0.0379      0.0523      0.9697      0.0529\n```\n\nThe function\
    \ chose a final model in which one variable has been removed from the original\
    \ full model. Dropped predictor is: `triceps` .\n\n### 23.3.4 Compare the full\
    \ and the stepwise models\n\nHere, we'll compare the performance of the full and\
    \ the stepwise logistic models. The best model is defined as the model that has\
    \ the lowest classification error rate in predicting the class of new test data:\n\
    \nPrediction accuracy of the full logistic regression model:\n\n```\n\n```\n\n\
    ```\n## [1] 0.808\n```\n\nPrediction accuracy of the stepwise logistic regression\
    \ model:\n\n```\n\n```\n\n```\n## [1] 0.795\n```\n\n## 23.4 Discussion\n\nThis\
    \ chapter describes how to perform stepwise logistic regression in R. In our example,\
    \ the stepwise regression have selected a reduced number of predictor variables\
    \ resulting to a final model, which performance was similar to the one of the\
    \ full model.\n\nSo, the stepwise selection reduced the complexity of the model\
    \ without compromising its accuracy. Note that, all things equal, we should always\
    \ choose the simpler model, here the final model returned by the stepwise regression.\n\
    \nAnother alternative to the stepwise method, for model selection, is the penalized\
    \ regression approach (Chapter [24](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ), which\
    \ penalizes the model for having two many variables.\n\n# 24 Penalized Logistic\
    \ Regression\n\n## 24.1 Introduction\n\nWhen you have multiple variables in your\
    \ logistic regression model, it might be useful to find a reduced set of variables\
    \ resulting to an optimal performing model (see Chapter [19](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ).\n\n**Penalized logistic regression** imposes a penalty to the logistic model\
    \ for having too many variables. This results in shrinking the coefficients of\
    \ the less contributive variables toward zero. This is also known as **regularization**\
    \ .\n\nThe most commonly used penalized regression include:\n\n*   **ridge regression**\
    \ : variables with minor contribution have their coefficients close to zero. However,\
    \ all the variables are incorporated in the model. This is useful when all variables\
    \ need to be incorporated in the model according to domain knowledge.\n\n*   **lasso\
    \ regression** : the coefficients of some less contributive variables are forced\
    \ to be exactly zero. Only the most significant variables are kept in the final\
    \ model.\n\n*   **elastic net regression** : the combination of ridge and lasso\
    \ regression. It shrinks some coefficients toward zero (like ridge regression)\
    \ and set some coefficients to exactly zero (like lasso regression)\n\nThis chapter\
    \ describes how to compute penalized logistic regression, such as lasso regression,\
    \ for automatically selecting an optimal model containing the most contributive\
    \ predictor variables.\n\n## 24.2 Loading required R packages\n\n*   `tidyverse`\
    \ for easy data manipulation and visualization\n\n*   `caret` for easy machine\
    \ learning workflow\n\n*   `glmnet` , for computing penalized regression\n\n```\n\
    \n```\n\n## 24.3 Preparing the data\n\nData set: `PimaIndiansDiabetes2` [in `mlbench`\
    \ package], introduced in Chapter [21](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for\
    \ predicting the probability of being diabetes positive based on multiple clinical\
    \ variables.\n\nWe'll randomly split the data into training set (80% for building\
    \ a predictive model) and test set (20% for evaluating the model). Make sure to\
    \ set seed for reproductibility.\n\n```\n\n```\n\n## 24.4 Computing penalized\
    \ logistic regression\n\n### 24.4.1 Additionnal data preparation\n\nThe R function\
    \ `model.matrix()` helps to create the matrix of predictors and also automatically\
    \ converts categorical predictors to appropriate dummy variables, which is required\
    \ for the `glmnet()` function.\n\n```\n\n```\n\n### 24.4.2 R functions\n\nWe'll\
    \ use the R function `glmnet()` [glmnet package] for computing penalized logistic\
    \ regression.\n\nThe simplified format is as follow:\n\n```\n\n```\n\n*   `x`\
    \ : matrix of predictor variables\n\n*   `y` : the response or outcome variable,\
    \ which is a binary variable.\n\n*   `family` : the response type. Use \"binomial\"\
    \ for a binary outcome variable\n\n*   `alpha` : the elasticnet mixing parameter.\
    \ Allowed values include: \n\n    *   \"1\": for lasso regression\n\n    *   \"\
    0\": for ridge regression\n\n    *   a value between 0 and 1 (say 0.3) for elastic\
    \ net regression.\n\n*   `lamba` : a numeric value defining the amount of shrinkage.\
    \ Should be specify by analyst.\n\nIn penalized regression, you need to specify\
    \ a constant `lambda` to adjust the amount of the coefficient shrinkage. The best\
    \ `lambda` for your data, can be defined as the `lambda` that minimize the cross-validation\
    \ prediction error rate. This can be determined automatically using the function\
    \ `cv.glmnet()` .\n\nIn the following R code, we'll show how to compute lasso\
    \ regression by specifying the option `alpha = 1` . You can also try the ridge\
    \ regression, using `alpha = 0` , to see which is better for your data.\n\n###\
    \ 24.4.3 Quick start R code\n\nFit the lasso penalized regression model:\n\n```\n\
    \n```\n\n### 24.4.4 Compute lasso regression\n\n**Find the optimal value of lambda\
    \ that minimizes the cross-validation error** :\n\n```\n\n```\n\n![](Image00020.jpg)\n\
    \nThe plot displays the cross-validation error according to the log of lambda.\
    \ The left dashed vertical line indicates that the log of the optimal value of\
    \ lambda is approximately -5, which is the one that minimizes the prediction error.\
    \ This lambda value will give the most accurate model. The exact value of `lambda`\
    \ can be viewed as follow:\n\n```\n\n```\n\n```\n## [1] 0.00871\n```"
