    \ tree model:\n\n```\n\n```\n\n![](Image00037.jpg)\n\n```\n\n```\n\n## 33.6 Conditionnal\
    \ inference tree\n\nThe conditional inference tree (ctree) uses significance test\
    \ methods to select and split recursively the most related predictor variables\
    \ to the outcome. This can limit overfitting compared to the classical rpart algorithm.\n\
    \nAt each splitting step, the algorithm stops if there is no dependence between\
    \ predictor variables and the outcome variable. Otherwise the variable that is\
    \ the most associated to the outcome is selected for splitting.\n\nThe conditional\
    \ tree can be easily computed using the `caret` workflow, which will invoke the\
    \ function `ctree()` available in the `party` package.\n\n1.  Demo data: `PimaIndiansDiabetes2`\
    \ . First split the data into training (80%) and test set (20%)\n\n```\n\n```\n\
    \n2.  Build conditional trees using the tuning parameters `maxdepth` and `mincriterion`\
