- raw: "Generally, the purpose of regularization is to balance accuracy and simplicity.\
    \ This means, a model with the smallest number of predictors that also gives a\
    \ good accuracy. To this end, the function `cv.glmnet()` finds also the value\
    \ of `lambda` that gives the simplest model but also lies within one standard\
    \ error of the optimal value of `lambda` . This value is called `lambda.1se` .\n\
    \n```\n\n```\n\n```\n## [1] 0.0674\n```\n\nUsing `lambda.min` as the best lambda,\
    \ gives the following regression coefficients:\n\n```\n\n```\n\n```\n## 9 x 1\
    \ sparse Matrix of class \"dgCMatrix\"\n##                     1\n## (Intercept)\
    \ -8.615615\n## pregnant     0.035076\n## glucose      0.036916\n## pressure \
    \    .       \n## triceps      0.016484\n## insulin     -0.000392\n## mass   \
    \      0.030485\n## pedigree     0.785506\n## age          0.036265\n```\n\nFrom\
    \ the output above, only the viable `triceps` has a coefficient exactly equal\
    \ to zero.\n\nUsing `lambda.1se` as the best lambda, gives the following regression\
    \ coefficients:\n\n```\n\n```\n\n```\n## 9 x 1 sparse Matrix of class \"dgCMatrix\"\
    \n##                    1\n## (Intercept) -4.65750\n## pregnant     .      \n\
    ## glucose      0.02628\n## pressure     .      \n## triceps      0.00191\n##\
    \ insulin      .      \n## mass         .      \n## pedigree     .      \n## age\
    \          0.01734\n```\n\nUsing `lambda.1se` , only 5 variables have non-zero\
    \ coefficients. The coefficients of all other variables have been set to zero\
    \ by the lasso algorithm, reducing the complexity of the model.\n\nSetting lambda\
    \ = lambda.1se produces a simpler model compared to lambda.min, but the model\
    \ might be a little bit less accurate than the one obtained with lambda.min.\n\
    \nIn the next sections, we'll compute the final model using `lambda.min` and then\
    \ assess the model accuracy against the test data. We'll also discuss the results\
    \ obtained by fitting the model using `lambda = lambda.1se` .\n\n**Compute the\
    \ final lasso model** :\n\n*   Compute the final model using `lambda.min` :\n\n\
    ```\n\n```\n\n```\n## [1] 0.769\n```\n\n*   Compute the final model using `lambda.1se`\
    \ :\n\n```\n\n```\n\n```\n## [1] 0.705\n```\n\nIn the next sections, we'll compare\
    \ the accuracy obtained with lasso regression against the one obtained using the\
    \ full logistic regression model (including all predictors).\n\n### 24.4.5 Compute\
    \ the full logistic model\n\n```\n\n```\n\n```\n## [1] 0.808\n```\n\n## 24.5 Discussion\n\
    \nThis chapter described how to compute penalized logistic regression model in\
    \ R. Here, we focused on lasso model, but you can also fit the ridge regression\
    \ by using `alpha = 0` in the `glmnet()` function. For elastic net regression,\
    \ you need to choose a value of alpha somewhere between 0 and 1. This can be done\
    \ automatically using the `caret` package. See Chapter [19](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\nOur analysis demonstrated that the lasso regression, using `lambda.min`\
    \ as the best lambda, results to simpler model without compromising much the model\
    \ performance on the test data when compared to the full logistic model.\n\nThe\
    \ model accuracy that we have obtained with `lambda.1se` is a bit less than what\
    \ we got with the more complex model using all predictor variables (n = 8) or\
    \ using `lambda.min` in the lasso regression. Even with `lambda.1se` , the obtained\
    \ accuracy remains good enough in addition to the resulting model simplicity.\n\
    \nThis means that the simpler model obtained with lasso regression does at least\
    \ as good a job fitting the information in the data as the more complicated one.\
    \ According to the bias-variance trade-off, all things equal, simpler model should\
    \ be always preferred because it is less likely to overfit the training data.\n\
    \nFor variable selection, an alternative to the penalized logistic regression\
    \ techniques is the stepwise logistic regression described in the Chapter [23](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\n# 25 Logistic Regression Assumptions and Diagnostics\n\n## 25.1 Introduction\n\
    \nThe **logistic regression** model makes several **assumptions** about the data.\n\
    \nThis chapter describes the major assumptions and provides practical guide, in\
    \ R, to check whether these assumptions hold true for your data, which is essential\
    \ to build a good model.\n\nMake sure you have read the logistic regression essentials\
    \ in Chapter [22](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) .\n\n## 25.2 Logistic regression\
    \ assumptions\n\nThe logistic regression method assumes that:\n\n*   The outcome\
    \ is a binary or dichotomous variable like yes vs no, positive vs negative, 1\
    \ vs 0.  \n\n*   There is a linear relationship between the logit of the outcome\
    \ and each predictor variables. Recall that the logit function is `logit(p) =\
    \ log(p/(1-p))` , where p is the probabilities of the outcome (see Chapter [22](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ).\n\n*   There is no influential values (extreme values or outliers) in the\
    \ continuous predictors\n\n*   There is no high intercorrelations (i.e. multicollinearity)\
    \ among the predictors.\n\nTo improve the accuracy of your model, you should make\
    \ sure that these assumptions hold true for your data. In the following sections,\
    \ we'll describe how to diagnostic potential problems in the data.\n\n## 25.3\
    \ Loading required R packages\n\n*   `tidyverse` for easy data manipulation and\
    \ visualization\n\n*   `broom` : creates a tidy data frame from statistical test\
    \ results\n\n```\n\n```\n\n## 25.4 Building a logistic regression model\n\nWe\
    \ start by computing an example of logistic regression model using the `PimaIndiansDiabetes2`\
    \ [mlbench package], introduced in Chapter [21](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ , for predicting the probability of diabetes test positivity based on clinical\
    \ variables.\n\n```\n\n```\n\n```\n##     4     5     7     9    14    15 \n##\
    \ \"neg\" \"pos\" \"neg\" \"pos\" \"pos\" \"pos\"\n```\n\n## 25.5 Logistic regression\
    \ diagnostics\n\n### 25.5.1 Linearity assumption\n\nHere, we'll check the linear\
    \ relationship between continuous predictor variables and the logit of the outcome.\
    \ This can be done by visually inspecting the scatter plot between each predictor\
    \ and the logit values.\n\n1.  Remove qualitative variables from the original\
    \ data frame and bind the logit values to the data:\n\n```\n\n```\n\n2.  Create\
    \ the scatter plots:\n\n```\n\n```\n\n![](Image00021.jpg)\n\nThe smoothed scatter\
    \ plots show that variables glucose, mass, pregnant, pressure and triceps are\
    \ all quite linearly associated with the diabetes outcome in logit scale.\n\n\
    The variable age and pedigree is not linear and might need some transformations.\
    \ If the scatter plot shows non-linearity, you need other methods to build the\
    \ model such as including 2 or 3-power terms, fractional polynomials and spline\
    \ function (Chapter [7](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\n### 25.5.2 Influential\
    \ values\n\nInfluential values are extreme individual data points that can alter\
    \ the quality of the logistic regression model.\n\nThe most extreme values in\
    \ the data can be examined by visualizing the Cook's distance values. Here we\
    \ label the top 3 largest values:\n\n```\n\n```\n\n![](Image00022.jpg)\n\nNote\
