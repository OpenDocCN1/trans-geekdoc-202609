- raw: "Recall that, the RSS is the sum of the squared difference between the observed\
    \ outcome values and the predicted ones, `RSS = sum((Observeds - Predicteds)^2)`\
    \ . See Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\n\n**In classification\
    \ settings** , the split point is defined so that the population in subpartitions\
    \ are pure as much as possible. Two measures of purity are generally used, including\
    \ the *Gini index* and the *entropy* (or *information gain* ).\n\nFor a given\
    \ subpartition, `Gini = sum(p(1-p))` and `entropy = -1*sum(p*log(p))` , where\
    \ p is the proportion of misclassified observations within the subpartition.\n\
    \nThe sum is computed across the different categories or classes in the outcome\
    \ variable. The Gini index and the entropy varie from 0 (greatest purity) to 1\
    \ (maximum degree of impurity)\n\n### 33.3.3 Making predictions\n\nThe different\
    \ rule sets established in the tree are used to predict the outcome of a new test\
    \ data.\n\nThe following R code predict the species of a new collected iris flower:\n\
    \n```\n\n```\n\n```\n##         1 \n## virginica \n## Levels: setosa versicolor\
    \ virginica\n```\n\nThe new data is predicted to be virginica.\n\n## 33.4 Classification\
    \ trees\n\n### 33.4.1 Example of data set\n\nData set: `PimaIndiansDiabetes2`\
    \ [in `mlbench` package], introduced in Chapter [21](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ , for predicting the probability of being diabetes positive based on multiple\
    \ clinical variables.\n\nWe'll randomly split the data into training set (80%\
    \ for building a predictive model) and test set (20% for evaluating the model).\
    \ Make sure to set seed for reproducibility.\n\n```\n\n```\n\n### 33.4.2 Fully\
    \ grown trees\n\nHere, we'll create a fully grown tree showing all predictor variables\
    \ in the data set.\n\n```\n\n```\n\n![](Image00033.jpg)\n\n```\n\n```\n\n```\n\
    ##  21  25  28  29  32  36 \n## neg pos neg pos pos neg \n## Levels: neg pos\n\
    ```\n\n```\n\n```\n\n```\n## [1] 0.782\n```\n\nThe overall accuracy of our tree\
    \ model is 78%, which is not so bad.\n\nHowever, this full tree including all\
    \ predictor appears to be very complex and can be difficult to interpret in the\
    \ situation where you have a large data sets with multiple predictors.\n\nAdditionally,\
    \ it is easy to see that, a fully grown tree will overfit the training data and\
    \ might lead to poor test set performance.\n\nA strategy to limit this overfitting\
    \ is to prune back the tree resulting to a simpler tree with fewer splits and\
    \ better interpretation at the cost of a little bias (James et al. [2014](#text00039.html#ref-james2014)\
    \ , P. Bruce and Bruce ([2017](#text00039.html#ref-bruce2017) ) ) .\n\n### 33.4.3\
    \ Pruning the tree\n\nBriefly, our goal here is to see if a smaller subtree can\
    \ give us comparable results to the fully grown tree. If yes, we should go for\
    \ the simpler tree because it reduces the likelihood of overfitting.\n\nOne possible\
    \ robust strategy of pruning the tree (or stopping the tree to grow) consists\
    \ of avoiding splitting a partition if the split does not significantly improves\
    \ the overall quality of the model.\n\nIn `rpart` package, this is controlled\
    \ by the *complexity parameter* (cp), which imposes a penalty to the tree for\
    \ having two many splits. The default value is 0.01. The higher the `cp` , the\
    \ smaller the tree.\n\nA too small value of `cp` leads to overfitting and a too\
    \ large cp value will result to a too small tree. Both cases decrease the predictive\
    \ performance of the model.\n\nAn optimal `cp` value can be estimated by testing\
    \ different cp values and using cross-validation approaches to determine the corresponding\
    \ prediction accuracy of the model. The best `cp` is then defined as the one that\
    \ maximize the cross-validation accuracy (Chapter [14](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ).\n\nPruning can be easily performed in the `caret` package workflow, which\
    \ invokes the `rpart` method for automatically testing different possible values\
    \ of `cp` , then choose the optimal `cp` that maximize the cross-validation (\"\
    cv\") accuracy, and fit the final best CART model that explains the best our data.\n\
    \nYou can use the following arguments in the function `train()` [from caret package]:\n\
    \n*   `trControl` , to set up 10-fold cross validation\n\n*   `tuneLength` , to\
    \ specify the number of possible `cp` values to evaluate. Default value is 3,\
    \ here we'll use 10.\n\n```\n\n```\n\n![](Image00034.jpg)\n\n```\n\n```\n\n```\n\
    ##       cp\n## 2 0.0321\n```\n\n```\n\n```\n\n![](Image00035.jpg)\n\n```\n\n\
    ```\n\n```\n## n= 314 \n## \n## node), split, n, loss, yval, (yprob)\n##     \
    \  * denotes terminal node\n## \n##  1) root 314 104 neg (0.6688 0.3312)  \n##\
    \    2) glucose< 128 188  26 neg (0.8617 0.1383) *\n##    3) glucose>=128 126\
    \  48 pos (0.3810 0.6190)  \n##      6) glucose< 166 88  44 neg (0.5000 0.5000)\
    \  \n##       12) age< 23.5 16   1 neg (0.9375 0.0625) *\n##       13) age>=23.5\
    \ 72  29 pos (0.4028 0.5972) *\n##      7) glucose>=166 38   4 pos (0.1053 0.8947)\
    \ *\n```\n\n```\n\n```\n\n```\n## [1] 0.795\n```\n\nFrom the output above, it\
    \ can be seen that the best value for the complexity parameter (cp) is 0.032,\
    \ allowing a simpler tree, easy to interpret, with an overall accuracy of 79%,\
    \ which is comparable to the accuracy (78%) that we have obtained with the full\
    \ tree. The prediction accuracy of the pruned tree is even better compared to\
    \ the full tree.\n\nTaken together, we should go for this simpler model.\n\n##\
    \ 33.5 Regression trees\n\nPreviously, we described how to build a classification\
    \ tree for predicting the group (i.e. class) of observations.  \n\nIn this section,\
