- raw: "The p-value indicates the association between a given predictor variable and\
    \ the outcome variable. For example, the first decision node at the top shows\
    \ that `glucose` is the variable that is most strongly associated with `diabetes`\
    \ with a p value < 0.001, and thus is selected as the first node.\n\n## 33.7 Discussion\n\
    \nThis chapter describes how to build classification and regression tree in R.\
    \ Trees provide a visual tool that are very easy to interpret and to explain to\
    \ people.\n\nTree models might be very performant compared to the linear regression\
    \ model (Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ), when there is a highly\
    \ non-linear and complex relationships between the outcome variable and the predictors.\n\
    \nHowever, building only one single tree from a training data set might results\
    \ to a less performant predictive model. A single tree is unstable and the structure\
    \ might be altered by small changes in the training data.\n\nFor example, the\
    \ exact split point of a given predictor variable and the predictor to be selected\
    \ at each step of the algorithm are strongly dependent on the training data set.\
    \ Using a slightly different training data may alter the first variable to split\
    \ in, and the structure of the tree can be completely modified.\n\nOther machine\
    \ learning algorithms - including *bagging* , *random forest* and *boosting* -\
    \ can be used to build multiple different trees from one single data set leading\
    \ to a better predictive performance. But, with these methods the interpretability\
    \ observed for a single tree is lost. Note that all these above mentioned strategies\
    \ are based on the CART algorithm. See Chapter [34](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ and [35](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) .\n\n# 34 Bagging and Random Forest\n\
    \n## 34.1 Introduction\n\nIn the Chapter [33](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ , we have described how to build decision trees for predictive modeling.\n\n\
    The standard decision tree model, CART for classification and regression trees,\
    \ build only one single tree, which is then used to predict the outcome of new\
    \ observations. The output of this strategy is very unstable and the tree structure\
    \ might be severally affected by a small change in the training data set.\n\n\
    There are different powerful alternatives to the classical CART algorithm, including\
    \ **bagging** , **Random Forest** and **boosting** .\n\n**Bagging** stands for\
    \ *bootstrap aggregating* . It consists of building multiple different decision\
    \ tree models from a single training data set by repeatedly using multiple bootstrapped\
    \ subsets of the data and averaging the models. Here, each tree is build independently\
    \ to the others. Read more on bootstrapping in the Chapter [15](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\n**Random Forest** algorithm, is one of the most commonly used and the most\
    \ powerful machine learning techniques. It is a special type of bagging applied\
    \ to decision trees.\n\nCompared to the standard CART model (Chapter [33](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ), the random forest provides a strong improvement, which consists of applying\
    \ bagging to the data and bootstrap sampling to the predictor variables at each\
    \ split (James et al. [2014](#text00039.html#ref-james2014) , P. Bruce and Bruce\
    \ ([2017](#text00039.html#ref-bruce2017) ) ) . This means that at each splitting\
    \ step of the tree algorithm, a random sample of n predictors is chosen as split\
    \ candidates from the full set of the predictors.\n\nRandom forest can be used\
    \ for both classification (predicting a categorical variable) and regression (predicting\
    \ a continuous variable).\n\nIn this chapter, we'll describe how to compute random\
    \ forest algorithm in R for building a powerful predictive model. Additionally,\
    \ you'll learn how to rank the predictor variable according to their importance\
    \ in contributing to the model accuracy.\n\n## 34.2 Loading required R packages\n\
    \n*   `tidyverse` for easy data manipulation and visualization\n\n*   `caret`\
    \ for easy machine learning workflow\n\n*   `randomForest` for computing random\
    \ forest algorithm\n\n```\n\n```\n\n## 34.3 Classification\n\n### 34.3.1 Example\
    \ of data set\n\nData set: `PimaIndiansDiabetes2` [in `mlbench` package], introduced\
    \ in Chapter [21](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for predicting the probability\
    \ of being diabetes positive based on multiple clinical variables.\n\nRandomly\
    \ split the data into training set (80% for building a predictive model) and test\
    \ set (20% for evaluating the model). Make sure to set seed for reproducibility.\n\
    \n```\n\n```\n\n### 34.3.2 Computing random forest classifier\n\nWe'll use the\
    \ `caret` workflow, which invokes the `randomforest()` function [randomForest\
    \ package], to automatically select the optimal number (`mtry` ) of predictor\
    \ variables randomly sampled as candidates at each split, and fit the final best\
    \ random forest model that explains the best our data.\n\nWe'll use the following\
    \ arguments in the function `train()` :\n\n*   `trControl` , to set up 10-fold\
    \ cross validation\n\n```\n\n```\n\n```\n##   mtry\n## 3    8\n```\n\n```\n\n\
    ```\n\n```\n## \n## Call:\n##  randomForest(x = x, y = y, mtry = param$mtry, importance\
    \ = TRUE) \n##                Type of random forest: classification\n##      \
    \                Number of trees: 500\n## No. of variables tried at each split:\
    \ 8\n## \n##         OOB estimate of  error rate: 22%\n## Confusion matrix:\n\
    ##     neg pos class.error\n## neg 185  25       0.119\n## pos  44  60       0.423\n\
    ```\n\n```\n\n```\n\n```\n## [1] neg pos neg neg pos neg\n## Levels: neg pos\n\
    ```\n\n```\n\n```\n\n```\n## [1] 0.808\n```\n\nBy default, 500 trees are trained.\
    \ The optimal number of variables sampled at each split is 8.\n\nEach bagged tree\
    \ makes use of around two-thirds of the observations. The remaining one-third\
    \ of the observations not used to fit a given bagged tree are referred to as the\
    \ out-of-bag (OOB) observations (James et al. [2014](#text00039.html#ref-james2014)\
    \ ) .\n\nFor a given tree, the out-of-bag (OOB) error is the model error in predicting\
    \ the data left out of the training set for that tree (P. Bruce and Bruce [2017](#text00039.html#ref-bruce2017)\
    \ ) . OOB is a very straightforward way to estimate the test error of a bagged\
    \ model, without the need to perform cross-validation or the validation set approach.\n\
    \nIn our example, the OBB estimate of error rate is 24%.\n\nThe prediction accuracy\
    \ on new test data is 79%, which is good.\n\n### 34.3.3 Variable importance\n\n\
    The importance of each variable can be printed using the function `importance()`\
    \ [randomForest package]:\n\n```\n\n```\n\n```\n##            neg    pos MeanDecreaseAccuracy\
    \ MeanDecreaseGini\n## pregnant 11.57  0.318                10.36            \
    \ 8.86\n## glucose  38.93 28.437                46.17            53.30\n## pressure\
    \ -1.94  0.846                -1.06             8.09\n## triceps   6.19  3.249\
    \                 6.85             9.92\n## insulin   8.65 -2.037            \
    \     6.01            12.43\n## mass      7.71  2.299                 7.57   \
    \         14.58\n## pedigree  6.57  1.083                 5.66            14.50\n\
    ## age       9.51 12.310                15.75            16.76\n```\n\nThe result\
    \ shows:\n\n*   `MeanDecreaseAccuracy` , which is the average decrease of model\
    \ accuracy in predicting the outcome of the out-of-bag samples when a specific\
    \ variable is excluded from the model.\n\n*   `MeanDecreaseGini` , which is the\
    \ average decrease in node impurity that results from splits over that variable.\
    \ The Gini impurity index is only used for classification problem. In the regression\
    \ the node impurity is measured by training set RSS. These measures, calculated\
    \ using the training set, are less reliable than a measure calculated on out-of-bag\
    \ data. See Chapter [33](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) for node impurity\
    \ measures (Gini index and RSS)."
