    ## 13.7 Comparing regression models performance


    Here, we''ll use the function `glance()` to simply compare the overall quality
    of our two models:


    ```


    ```


    ```

    ##   adj.r.squared sigma AIC BIC  p.value

    ## 1         0.671  7.17 326 339 5.59e-10

    ```


    ```


    ```


    ```

    ##   adj.r.squared sigma AIC BIC  p.value

    ## 1         0.671  7.17 325 336 1.72e-10

    ```


    From the output above, it can be seen that:


    1.  The two models have exactly the samed **adjusted R2** (0.67), meaning that
    they are equivalent in explaining the outcome, here fertility score. Additionally,
    they have the same amount of **residual standard error** (RSE or sigma = 7.17).
    However, the model 2 is more simple than model 1 because it incorporates less
    variables. All things equal, the simple model is always better in statistics.


    2.  The AIC and the BIC of the model 2 are lower than those of the model1. In
    model comparison strategies, the model with the lowest AIC and BIC score is preferred.


    3.  Finally, the F-statistic p.value of the model 2 is lower than the one of the
    model 1. This means that the model 2 is statistically more significant compared
    to model 1, which is consistent to the above conclusion.


    Note that, the RMSE and the RSE are measured in the same scale as the outcome
    variable. Dividing the RSE by the average value of the outcome variable will give
    you the prediction error rate, which should be as small as possible:


    ```


    ```


    ```

    ## [1] 0.102

    ```


    In our example the average prediction error rate is 10%.


    ## 13.8 Discussion


    This chapter describes several metrics for assessing the overall performance of
    a regression model.


    The most important metrics are the Adjusted R-square, RMSE, AIC and the BIC. These
    metrics are also used as the basis of model comparison and optimal model selection.


    Note that, these regression metrics are all internal measures, that is they have
    been computed on the same data that was used to build the regression model. They
    tell you how well the model fits to the data in hand, called training data set.


    In general, we do not really care how well the method works on the training data.
    Rather, we are interested in the accuracy of the predictions that we obtain when
    we apply our method to previously unseen test data.'
