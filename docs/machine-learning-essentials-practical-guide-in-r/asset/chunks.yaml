    \ beta0 (`b0` ), plus an error term `e` .\"\n\nWhen you have multiple predictor\
    \ variables, the equation can be written as `y = b0 + b1*x1 + b2*x2 + ... + bn*xn`\
    \ , where:\n\n*   b0 is the intercept,\n\n*   b1, b2, ..., bn are the regression\
    \ weights or coefficients associated with the predictors x1, x2, ..., xn.\n\n\
    *   `e` is the *error term* (also known as the *residual errors* ), the part of\
    \ y that can be explained by the regression model\n\nNote that, b0, b1, b2, ...\
    \ and bn are known as the regression beta coefficients or parameters.\n\nThe figure\
    \ below illustrates a simple linear regression model, where:\n\n*   the best-fit\
    \ regression line is in blue\n\n*   the intercept (b0) and the slope (b1) are\
    \ shown in green\n\n*   the error terms (e) are represented by vertical red lines\n\
    \n![Linear regression](Image00000.jpg)\n\nLinear regression\n\nFrom the scatter\
    \ plot above, it can be seen that not all the data points fall exactly on the\
    \ fitted regression line. Some of the points are above the blue curve and some\
    \ are below it; overall, the residual errors (e) have approximately mean zero.\n\
    \nThe sum of the squares of the residual errors are called the **Residual Sum\
    \ of Squares** or **RSS** .\n\nThe average variation of points around the fitted\
    \ regression line is called the **Residual Standard Error** (**RSE** ). This is\
    \ one the metrics used to evaluate the overall quality of the fitted regression\
    \ model. The lower the RSE, the better it is.\n\nSince the mean error term is\
    \ zero, the outcome variable y can be approximately estimated as follow:\n\n`y\
    \ ~ b0 + b1*x`\n\nMathematically, the beta coefficients (b0 and b1) are determined\
    \ so that the RSS is as minimal as possible. This method of determining the beta\
    \ coefficients is technically called **least squares** regression or **ordinary\
    \ least squares** (OLS) regression.\n\nOnce, the beta coefficients are calculated,\
    \ a t-test is performed to check whether or not these coefficients are significantly\
    \ different from zero. A non-zero beta coefficients means that there is a significant\
    \ relationship between the predictors (x) and the outcome variable (y).\n\n##\
    \ 4.3 Loading Required R packages\n\n*   `tidyverse` for easy data manipulation\
    \ and visualization\n\n*   `caret` for easy machine learning workflow\n\n```\n\
    \n```\n\n## 4.4 Preparing the data\n\nWe'll use the `marketing` data set, introduced\
    \ in the Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for predicting sales\
    \ units on the basis of the amount of money spent in the three advertising medias\
    \ (youtube, facebook and newspaper)\n\nWe’ll randomly split the data into training\
    \ set (80% for building a predictive model) and test set (20% for evaluating the\
    \ model). Make sure to set seed for reproducibility.\n\n```\n\n```\n\n```\n##\
    \     youtube facebook newspaper sales\n## 158     180     1.56      29.2  12.1\n\
