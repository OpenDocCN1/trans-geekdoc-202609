- raw: "*   **Residuals** . Provide a quick view of the distribution of the residuals,\
    \ which by definition have a mean zero. Therefore, the median should not be far\
    \ from zero, and the minimum and maximum should be roughly equal in absolute value.\n\
    \n*   **Coefficients** . Shows the regression beta coefficients and their statistical\
    \ significance. Predictor variables, that are significantly associated to the\
    \ outcome variable, are marked by stars.\n\n*   **Residual standard error** (RSE),\
    \ **R-squared** (R2) and the **F-statistic** are metrics that are used to check\
    \ how well the model fits to our data.\n\nThe first step in interpreting the multiple\
    \ regression analysis is to examine the F-statistic and the associated p-value,\
    \ at the bottom of model summary.\n\nIn our example, it can be seen that p-value\
    \ of the F-statistic is < 2.2e-16, which is highly significant. This means that,\
    \ at least, one of the predictor variables is significantly related to the outcome\
    \ variable.\n\n### 4.6.2 Coefficients significance\n\nTo see which predictor variables\
    \ are significant, you can examine the coefficients table, which shows the estimate\
    \ of regression beta coefficients and the associated t-statistic p-values.\n\n\
    ```\n\n```\n\n```\n##             Estimate Std. Error t value Pr(>|t|)\n## (Intercept)\
    \  3.39188    0.44062   7.698 1.41e-12\n## youtube      0.04557    0.00159  28.630\
    \ 2.03e-64\n## facebook     0.18694    0.00989  18.905 2.07e-42\n## newspaper\
    \    0.00179    0.00677   0.264 7.92e-01\n```\n\nFor a given the predictor, the\
    \ t-statistic evaluates whether or not there is significant association between\
    \ the predictor and the outcome variable, that is whether the beta coefficient\
    \ of the predictor is significantly different from zero.\n\nIt can be seen that,\
    \ changing in youtube and facebook advertising budget are significantly associated\
    \ to changes in sales while changes in newspaper budget is not significantly associated\
    \ with sales.\n\nFor a given predictor variable, the coefficient (b) can be interpreted\
    \ as the average effect on y of a one unit increase in predictor, holding all\
    \ other predictors fixed.\n\nFor example, for a fixed amount of youtube and newspaper\
    \ advertising budget, spending an additional 1 000 dollars on facebook advertising\
    \ leads to an increase in sales by approximately 0.1885\\*1000 = 189 sale units,\
    \ on average.\n\nThe youtube coefficient suggests that for every 1 000 dollars\
    \ increase in youtube advertising budget, holding all other predictors constant,\
    \ we can expect an increase of 0.045\\*1000 = 45 sales units, on average.\n\n\
    We found that newspaper is not significant in the multiple regression model. This\
    \ means that, for a fixed amount of youtube and newspaper advertising budget,\
    \ changes in the newspaper advertising budget will not significantly affect sales\
    \ units.\n\nAs the newspaper variable is not significant, it is possible to remove\
    \ it from the model:\n\n```\n\n```\n\n```\n## \n## Call:\n## lm(formula = sales\
    \ ~ youtube + facebook, data = train.data)\n## \n## Residuals:\n##     Min   \
    \   1Q  Median      3Q     Max \n## -10.481  -1.104   0.349   1.423   3.486 \n\
    ## \n## Coefficients:\n##             Estimate Std. Error t value Pr(>|t|)   \
    \ \n## (Intercept)  3.43446    0.40877     8.4  2.3e-14 ***\n## youtube      0.04558\
    \    0.00159    28.7  < 2e-16 ***\n## facebook     0.18788    0.00920    20.4\
    \  < 2e-16 ***\n## ---\n## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.'\
    \ 0.1 ' ' 1\n## \n## Residual standard error: 2.11 on 159 degrees of freedom\n\
    ## Multiple R-squared:  0.89,   Adjusted R-squared:  0.889 \n## F-statistic: \
    \ 644 on 2 and 159 DF,  p-value: <2e-16\n```\n\nFinally, our model equation can\
    \ be written as follow: `sales = 3.43+ 0.045youtube + 0.187 facebook` .\n\n###\
    \ 4.6.3 Model accuracy\n\nOnce you identified that, at least, one predictor variable\
    \ is significantly associated to the outcome, you should continue the diagnostic\
    \ by checking how well the model fits the data. This process is also referred\
    \ to as the *goodness-of-fit*\n\nThe overall quality of the linear regression\
    \ fit can be assessed using the following three quantities, displayed in the model\
    \ summary:\n\n1.  Residual Standard Error (RSE),\n\n2.  R-squared (R2) and adjusted\
    \ R2,\n\n3.  F-statistic, which has been already described in the previous section\n\
    \n```\n##    rse r.squared f.statistic  p.value\n## 1 2.11      0.89         644\
    \ 5.64e-77\n```\n\n1.  **Residual standard error** (RSE).\n\nThe RSE (or model\
    \ *sigma* ), corresponding to the prediction error, represents roughly the average\
    \ difference between the observed outcome values and the predicted values by the\
    \ model. The lower the RSE the best the model fits to our data.\n\nDividing the\
    \ RSE by the average value of the outcome variable will give you the prediction\
    \ error rate, which should be as small as possible.\n\nIn our example, using only\
    \ youtube and facebook predictor variables, the RSE = 2.11, meaning that the observed\
    \ sales values deviate from the predicted values by approximately 2.11 units in\
    \ average.\n\nThis corresponds to an error rate of 2.11/mean(train.data$sales)\
    \ = 2.11/16.77 = 13%, which is low.\n\n2.  **R-squared and Adjusted R-squared**\
    \ :\n\nThe R-squared (R2) ranges from 0 to 1 and represents the proportion of\
    \ variation in the outcome variable that can be explained by the model predictor\
    \ variables.\n\nFor a simple linear regression, R2 is the square of the Pearson\
    \ correlation coefficient between the outcome and the predictor variables. In\
    \ multiple linear regression, the R2 represents the correlation coefficient between\
    \ the observed outcome values and the predicted values.\n\nThe R2 measures, how\
    \ well the model fits the data. The higher the R2, the better the model. However,\
    \ a problem with the R2, is that, it will always increase when more variables\
    \ are added to the model, even if those variables are only weakly associated with\
    \ the outcome (James et al. [2014](#text00039.html#ref-james2014) ) . A solution\
    \ is to adjust the R2 by taking into account the number of predictor variables.\n\
    \nThe adjustment in the \"Adjusted R Square\" value in the summary output is a\
    \ correction for the number of x variables included in the predictive model.\n\
    \nSo, you should mainly consider the adjusted R-squared, which is a penalized\
    \ R2 for a higher number of predictors.\n\n*   An (adjusted) R2 that is close\
    \ to 1 indicates that a large proportion of the variability in the outcome has\
    \ been explained by the regression model.\n\n*   A number near 0 indicates that\
    \ the regression model did not explain much of the variability in the outcome.\n\
    \nIn our example, the adjusted R2 is 0.88, which is good.\n\n3.  **F-Statistic**\
    \ :\n\nRecall that, the F-statistic gives the overall significance of the model.\
    \ It assess whether at least one predictor variable has a non-zero coefficient.\n\
    \nIn a simple linear regression, this test is not really interesting since it\
    \ just duplicates the information given by the t-test, available in the coefficient\
    \ table.\n\nThe F-statistic becomes more important once we start using multiple\
    \ predictors as in multiple linear regression.\n\nA large F-statistic will corresponds\
    \ to a statistically significant p-value (p < 0.05). In our example, the F-statistic\
    \ equal 644 producing a p-value of 1.46e-42, which is highly significant.\n\n\
    ## 4.7 Making predictions\n\nWe'll make predictions using the test data in order\
    \ to evaluate the performance of our regression model.\n\nThe procedure is as\
    \ follow:\n\n1.  Predict the sales values based on new advertising budgets in\
    \ the test data\n\n2.  Assess the model performance by computing: \n\n    *  \
    \ The prediction error RMSE (Root Mean Squared Error), representing the average\
    \ difference between the observed known outcome values in the test data and the\
    \ predicted outcome values by the model. The lower the RMSE, the better the model.\n\
    \n    *   The R-square (R2), representing the correlation between the observed\
    \ outcome values and the predicted outcome values. The higher the R2, the better\
    \ the model.\n\n```\n\n```\n\n```\n## [1] 1.58\n```\n\n```\n\n```\n\n```\n## [1]\
    \ 0.938\n```"
