  trans: "\n\n**均方根误差**，用于衡量模型预测误差。它对应于结果的观测已知值与模型预测值之间的平均差异。`RMSE` 计算为 `RMSE = mean((observeds\
    \ - predicteds)²) %>% sqrt()`。`RMSE` 越低，模型越好。\n\n**调整后 R 平方**，表示数据中变异（即信息）的比例由模型解释。这对应于模型的整体质量。调整后\
    \ `R2` 越高，模型越好\n\n请注意，以上提到的指标应在未用于训练（即构建）模型的新的测试数据上计算。如果您有一个包含大量记录的大型数据集，可以随机将数据拆分为训练集（用于构建预测模型，80%）和测试集或验证集（用于评估模型性能，20%）。\n\
    \n估计模型性能最稳健且最流行的方法之一是 **k 折交叉验证**。即使在小数据集上也可以应用。k 折交叉验证的工作方式如下：\n\n1. 随机将数据集拆分为\
    \ k 个子集（或 k 折）（例如 5 个子集）\n2. 保留一个子集并在所有其他子集上训练模型\n3. 在保留的子集上测试模型并记录预测误差\n4. 重复此过程，直到\
    \ k 个子集中的每一个都作为测试集使用。\n5. 计算记录的 k 个误差的平均值。这称为交叉验证误差，作为模型的性能指标。\n\n综合起来，最佳模型是交叉验证误差最低、`RMSE`\
    \ 最低的模型。\n\n在本部分中，您将学习回归分析的不同方法，我们将在 **R** 中提供实际示例。以下技术进行了描述：\n\n* 普通最小二乘\n  \
    \  * 简单线性回归\n    * 多元线性回归\n* 模型选择方法：\n    * 最佳子集回归（Chapter 17）\n    * 逐步回归（Chapter\
    \ 18）\n* 基于主成分的方法（Chapter 20）：\n    * 主成分回归（`PCR`）\n    * 偏最小二乘回归（`PLS`）\n* 罚分回归（Chapter\
    \ 19）：\n    * 岭回归\n    * Lasso 回归\n\n## 3.1 数据集示例\n\n我们将使用三个不同的数据集：`marketing`\
    \ [datarium package]、内置 R `swiss` 数据集，以及 `MASS` R 包中的 `Boston` 数据集。\n\n### 3.1.1\
    \ marketing 数据\n\n`marketing` 数据集 [datarium package] 包含三种广告媒体（youtube、facebook\
    \ 和 newspaper）对销售额的影响。它将用于根据在三种广告媒体上花费的金额预测销售单位。\n\n数据是广告预算（以千美元计）以及销售额。广告实验已在不同预算下重复\
    \ 200 次，并记录了观察到的销售额。\n\n首先安装 `datarium` 包：\n\n```\n```\n\n然后，按如下方式加载 `marketing`\
    \ 数据集：\n\n```\n```\n\n```\n##   youtube facebook newspaper sales\n## 1   276.1\
    \     45.4      83.0  26.5\n## 2    53.4     47.2      54.1  12.5\n## 3    20.6\
    \     55.1      83.2  11.2\n```\n\n### 3.1.2 swiss 数据\n\n`swiss` 描述了 1888 年左右观察到的\
    \ 5 个社会经济指标，用于预测 47 个瑞士法语省份的生育率得分。\n\n加载并检查数据：\n\n```\n```\n\n```\n##        \
    \      Fertility Agriculture Examination Education Catholic\n## Courtelary   \
    \     80.2        17.0          15        12     9.96\n## Delemont          83.1\
    \        45.1           6         9    84.84\n## Franches-Mnt      92.5      \
    \  39.7           5         5    93.40\n##              Infant.Mortality\n## Courtelary\
    \               22.2\n## Delemont                 22.2\n## Franches-Mnt      \
    \       20.2\n```\n\n数据包含以下变量：\n\n* Fertility Ig: 常见的标准化生育率衡量指标\n* Agriculture:\
    \ 从事农业职业的男性比例\n* Examination: 在军队考试中获得最高分数的应征者比例\n* Education: 应征者接受小学以外教育的人口比例。\n\
    * Catholic: ‘天主教’（与‘新教’相对）的比例。\n* Infant.Mortality: 活产婴儿中存活不足 1 年的人数。\n\n### 3.1.3\
    \ Boston 数据\n\n`Boston` [in `MASS` package] 将用于预测波士顿郊区的房屋中位价值（`mdev`），使用不同的预测变量：\n\
    \n* `crim`, 城镇人均犯罪率\n* `zn`, 住宅用地中规划为 25,000 平方英尺以上地块的比例\n* `indus`, 城镇非零售商业用地比例\n\
    * `chas`, 查尔斯河虚拟变量（= 1 如果地块临河；0 否则）\n* `nox`, 氮氧化物浓度（每 1000 万份）\n* `rm`, 每栋住宅的平均房间数\n\
    * `age`, 1940 年前建造的自住单位比例\n* `dis`, 到波士顿五个就业中心的加权距离\n* `rad`, 径向高速公路可达性指数\n* `tax`,\
    \ 每 10,000 美元的全值财产税率\n* `ptratio`, 城镇师生比例\n* `black`, 1000(B - 0.63)² 其中 B 是城镇黑人比例\n\
    * `lstat`, 人口中低收入阶层百分比\n* `medv`, 自住房屋中位价值，单位为 1000 美元\n\n加载并检查数据：\n\n```\n```\n\
    \n```\n##      crim zn indus chas   nox   rm  age  dis rad tax ptratio black lstat\n\
    ## 1 0.00632 18  2.31    0 0.538 6.58 65.2 4.09   1 296    15.3   397  4.98\n\
    ## 2 0.02731  0  7.07    0 0.469 6.42 78.9 4.97   2 242    17.8   397  9.14\n\
    ## 3 0.02729  0  7.07    0 0.469 7.18 61.1 4.97   2 242    17.8   393  4.03\n\
    ##   medv\n## 1 24.0\n## 2 21.6\n## 3 34.7\n```\n\n# 4 线性回归\n\n## 4.1 引言\n\n**线性回归**（或\
    \ **线性模型**）用于根据一个或多个预测变量（`x`）预测定量结果变量（`y`）（James et al. 2014, P. Bruce and Bruce\
    \ (2017)）。\n\n目标是构建一个数学公式，将 `y` 定义为 `x` 变量的函数。一旦我们构建了具有统计显著性的模型，就可以使用它根据新的 `x`\
    \ 值预测未来结果。\n\n当您构建回归模型时，需要评估预测模型的性能。换句话说，您需要评估模型在预测未用于构建模型的新的测试数据结果方面的表现如何。\n\n\
    两个常用的指标用于评估预测回归模型的性能：\n\n* **均方根误差**，用于衡量模型预测误差。它对应于结果的观测已知值与模型预测值之间的平均差异。`RMSE`\
    \ 计算为 `RMSE = mean((observeds - predicteds)²) %>% sqrt()`。`RMSE` 越低，模型越好。\n* **R\
    \ 平方**，表示观测已知结果值与模型预测值之间的平方相关性。`R2` 越高，模型越好。\n\n构建预测回归模型的一个简单工作流程如下：\n\n1. 随机将您的数据拆分为训练集（80%）和测试集（20%）\n\
    2. 使用训练集构建回归模型\n3. 使用测试集进行预测并计算模型准确性指标\n\n在本章中，您将学习：\n\n* 线性回归的基础和公式，\n* 如何在 `R`\
    \ 中计算简单和多元回归模型，\n* 如何预测新数据的结果，\n* 如何评估模型的性能\n\n## 4.2 公式\n\n线性回归的数学公式可以写成如下：\n\
    \n`y = b0 + b1*x + e`\n\n"
