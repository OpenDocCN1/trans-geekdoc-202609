- raw: "From the output above, the R2 is 0.93, meaning that the observed and the predicted\
    \ outcome values are highly correlated, which is very good.\n\nThe prediction\
    \ error RMSE is 1.58, representing an error rate of 1.58/mean(test.data$sales)\
    \ = 1.58/17 = 9.2%, which is good.\n\n## 4.8 Discussion\n\nThis chapter describes\
    \ the basics of linear regression and provides practical examples in R for computing\
    \ simple and multiple linear regression models. We also described how to assess\
    \ the performance of the model for predictions.\n\nNote that, linear regression\
    \ assumes a linear relationship between the outcome and the predictor variables.\
    \ This can be easily checked by creating a scatter plot of the outcome variable\
    \ vs the predictor variable.\n\nFor example, the following R code displays sales\
    \ units versus youtube advertising budget. We'll also add a smoothed line:\n\n\
    ```\n\n```\n\n![](Image00001.jpg)\n\nThe graph above shows a linearly increasing\
    \ relationship between the `sales` and the `youtube` variables, which is a good\
    \ thing.\n\nIn addition to the linearity assumptions, the linear regression method\
    \ makes many other assumptions about your data (see Chapter [9](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ). You should make sure that these assumptions hold true for your data.\n\n\
    Potential problems, include: a) the presence of influential observations in the\
    \ data (Chapter [9](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ), non-linearity between\
    \ the outcome and some predictor variables ([7](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) and the presence of strong correlation between predictor variables (Chapter\
    \ [10](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\n# 5 Interaction Effects in Multiple\
    \ Regression\n\n## 5.1 Introduction\n\nThis chapter describes how to compute multiple\
    \ linear regression with **interaction effects** .\n\nPreviously, we have described\
    \ how to build a multiple linear regression model (Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) for predicting a continuous outcome variable (y) based on multiple predictor\
    \ variables (x).\n\nFor example, to predict sales, based on advertising budgets\
    \ spent on youtube and facebook, the model equation is `sales = b0 + b1*youtube\
    \ + b2*facebook` , where, b0 is the intercept; b1 and b2 are the regression coefficients\
    \ associated respectively with the predictor variables youtube and facebook.\n\
    \nThe above equation, also known as *additive model* , investigates only the main\
    \ effects of predictors. It assumes that the relationship between a given predictor\
    \ variable and the outcome is independent of the other predictor variables (James\
    \ et al. [2014](#text00039.html#ref-james2014) ,P. Bruce and Bruce ([2017](#text00039.html#ref-bruce2017)\
    \ ) ) .\n\nConsidering our example, the additive model assumes that, the effect\
    \ on sales of youtube advertising is independent of the effect of facebook advertising.\n\
    \nThis assumption might not be true. For example, spending money on facebook advertising\
    \ may increase the effectiveness of youtube advertising on sales. In marketing,\
    \ this is known as a synergy effect, and in statistics it is referred to as an\
    \ interaction effect (James et al. [2014](#text00039.html#ref-james2014) ) .\n\
    \nIn this chapter, you'll learn:\n\n*   the equation of multiple linear regression\
    \ with interaction\n\n*   R codes for computing the regression coefficients associated\
    \ with the main effects and the interaction effects\n\n*   how to interpret the\
    \ interaction effect\n\n## 5.2 Equation\n\nThe multiple linear regression equation,\
    \ with interaction effects between two predictors (x1 and x2), can be written\
    \ as follow:\n\n`y = b0 + b1*x1 + b2*x2 + b3*(x1*x2)`\n\nConsidering our example,\
    \ it becomes:\n\n`sales = b0 + b1*youtube + b2*facebook + b3*(youtube*facebook)`\n\
    \nThis can be also written as:\n\n`sales = b0 + (b1 + b3*facebook)*youtube + b2*facebook`\n\
    \nor as:\n\n`sales = b0 + b1*youtube + (b2 +b3*youtube)*facebook`\n\n`b3` can\
    \ be interpreted as the increase in the effectiveness of youtube advertising for\
    \ a one unit increase in facebook advertising (or vice-versa).\n\nIn the following\
    \ sections, you will learn how to compute the regression coefficients in R.\n\n\
    ## 5.3 Loading Required R packages\n\n*   `tidyverse` for easy data manipulation\
    \ and visualization\n\n*   `caret` for easy machine learning workflow\n\n```\n\
    \n```\n\n## 5.4 Preparing the data\n\nWe'll use the `marketing` data set, introduced\
    \ in the Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for predicting sales\
    \ units on the basis of the amount of money spent in the three advertising medias\
    \ (youtube, facebook and newspaper)\n\nWe’ll randomly split the data into training\
    \ set (80% for building a predictive model) and test set (20% for evaluating the\
    \ model).\n\n```\n\n```\n\n```\n##     youtube facebook newspaper sales\n## 158\
    \     180     1.56      29.2  12.1\n## 82      288     4.92      44.3  14.8\n\
    ## 175     267     4.08      15.7  13.8\n```\n\n```\n\n```\n\n## 5.5 Computation\n\
    \n### 5.5.1 Additive model\n\nThe standard linear regression model can be computed\
    \ as follow:\n\n```\n\n```\n\n```\n## \n## Call:\n## lm(formula = sales ~ youtube\
    \ + facebook, data = train.data)\n## \n## Residuals:\n##     Min      1Q  Median\
    \      3Q     Max \n## -10.481  -1.104   0.349   1.423   3.486 \n## \n## Coefficients:\n\
    ##             Estimate Std. Error t value Pr(>|t|)    \n## (Intercept)  3.43446\
    \    0.40877     8.4  2.3e-14 ***\n## youtube      0.04558    0.00159    28.7\
    \  < 2e-16 ***\n## facebook     0.18788    0.00920    20.4  < 2e-16 ***\n## ---\n\
    ## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n## \n## Residual\
    \ standard error: 2.11 on 159 degrees of freedom\n## Multiple R-squared:  0.89,\
    \   Adjusted R-squared:  0.889 \n## F-statistic:  644 on 2 and 159 DF,  p-value:\
    \ <2e-16\n```\n\n```\n\n```\n\n```\n## [1] 1.58\n```\n\n```\n\n```\n\n```\n##\
    \ [1] 0.938\n```\n\n### 5.5.2 Interaction effects\n\nIn R, you include interactions\
    \ between variables using the `*` operator:\n\n```\n\n```\n\n```\n## \n## Call:\n\
    ## lm(formula = sales ~ youtube * facebook, data = train.data)\n## \n## Residuals:\n\
    ##    Min     1Q Median     3Q    Max \n## -7.438 -0.482  0.231  0.748  1.860\
    \ \n## \n## Coefficients:\n##                  Estimate Std. Error t value Pr(>|t|)\
    \    \n## (Intercept)      7.90e+00   3.28e-01   24.06   <2e-16 ***\n## youtube\
    \          1.95e-02   1.64e-03   11.90   <2e-16 ***\n## facebook         2.96e-02\
    \   9.83e-03    3.01    0.003 ** \n## youtube:facebook 9.12e-04   4.84e-05   18.86\
    \   <2e-16 ***\n## ---\n## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.'\
    \ 0.1 ' ' 1\n## \n## Residual standard error: 1.18 on 158 degrees of freedom\n\
    ## Multiple R-squared:  0.966,  Adjusted R-squared:  0.966 \n## F-statistic: 1.51e+03\
    \ on 3 and 158 DF,  p-value: <2e-16\n```\n\n```\n\n```\n\n```\n## [1] 0.963\n\
    ```\n\n```\n\n```\n\n```\n## [1] 0.982\n```\n\n## 5.6 Interpretation\n\nIt can\
    \ be seen that all the coefficients, including the interaction term coefficient,\
    \ are statistically significant, suggesting that there is an interaction relationship\
    \ between the two predictor variables (youtube and facebook advertising).\n\n\
    Our model equation looks like this:\n\n`sales = 7.89 + 0.019*youtube + 0.029*facebook\
    \ + 0.0009*youtube*facebook`\n\nWe can interpret this as an increase in youtube\
    \ advertising of 1000 dollars is associated with increased sales of `(b1 + b3*facebook)*1000\
    \ = 19 + 0.9*facebook units` . And an increase in facebook advertising of 1000\
    \ dollars will be associated with an increase in sales of `(b2 + b3*youtube)*1000\
    \ = 28 + 0.9*youtube units` .\n\nNote that, sometimes, it is the case that the\
    \ interaction term is significant but not the main effects. The hierarchical principle\
    \ states that, if we include an interaction in a model, we should also include\
    \ the main effects, even if the p-values associated with their coefficients are\
    \ not significant  (James et al. [2014](#text00039.html#ref-james2014) )  .\n\n\
    ## 5.7 Comparing the additive and the interaction models\n\nThe prediction error\
    \ RMSE of the interaction model is 0.963, which is lower than the prediction error\
    \ of the additive model (1.58)."
