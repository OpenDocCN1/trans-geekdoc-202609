    ##                 predicted.classes

    ## observed.classes neg pos

    ##              neg  48   4

    ##              pos  11  15

    ```


    ```

    ```


    ```

    ##                 predicted.classes

    ## observed.classes   neg   pos

    ##              neg 0.615 0.051

    ##              pos 0.141 0.192

    ```


