    \ contains potential influential observations, the standardized residual error\
    \ can be inspected. Data points with an absolute standardized residuals above\
    \ 3 represent possible outliers and may deserve closer attention.\n\nThe following\
    \ R code computes the standardized residuals (`.std.resid` ) and the Cook's distance\
    \ (`.cooksd` ) using the R function `augment()` [broom package].\n\n```\n\n```\n\
    \nThe data for the top 3 largest values, according to the Cook's distance, can\
    \ be displayed as follow:\n\n```\n\n```\n\nPlot the standardized residuals:\n\n\
    ```\n\n```\n\n![](Image00023.jpg)\n\nFilter potential influential data points\
    \ with `abs(.std.res) > 3` :\n\n```\n\n```\n\nThere is no influential observations\
    \ in our data.\n\nWhen you have outliers in a continuous predictor, potential\
    \ solutions include:\n\n*   Removing the concerned records\n\n*   Transform the\
    \ data into log scale\n\n*   Use non parametric methods\n\n### 25.5.3 Multicollinearity"
