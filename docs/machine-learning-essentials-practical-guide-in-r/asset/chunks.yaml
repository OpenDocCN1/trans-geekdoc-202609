  trans: "\n\n### Residuals\n提供残差分布的快速概览，残差按定义均值为零。因此，中位数不应远离零，且最小值和最大值在绝对值上应大致相等。\n\
    \n### Coefficients\n显示回归贝塔系数及其统计显著性。与结果变量显著相关的预测变量用星号标记。\n\n### Residual standard\
    \ error\n`RSE`、`R-squared` `R2` 和 `F-statistic` 是用于检查模型对数据拟合程度的指标。\n\n解释多元回归分析的第一步是检查模型摘要底部的\
    \ `F-statistic` 及其相关 p 值。\n\n在我们的示例中，可以看到 `F-statistic` 的 p 值为 < 2.2e-16，具有高度显著性。这意味着，至少有一个预测变量与结果变量显著相关。\n\
    \n### 4.6.2 Coefficients significance\n\n要查看哪些预测变量显著，可以检查系数表，其中显示了回归贝塔系数的估计值以及相关的\
    \ t 统计量 p 值。\n\n```\n##             Estimate Std. Error t value Pr(>|t|)\n## (Intercept)\
    \  3.39188    0.44062   7.698 1.41e-12\n## youtube      0.04557    0.00159  28.630\
    \ 2.03e-64\n## facebook     0.18694    0.00989  18.905 2.07e-42\n## newspaper\
    \    0.00179    0.00677   0.264 7.92e-01\n```\n\n对于给定的预测变量，t 统计量评估预测变量与结果变量之间是否存在显著关联，即预测变量的贝塔系数是否显著不同于零。\n\
    \n可以看出，`youtube` 和 `facebook` 广告预算的变化与 `sales` 的变化显著相关，而 `newspaper` 预算的变化与 `sales`\
    \ 无显著关联。\n\n对于给定的预测变量，系数 `b` 可以解释为在所有其他预测变量保持不变的情况下，预测变量增加一个单位对 `y` 的平均影响。\n\n\
    例如，在 `youtube` 和 `newspaper` 广告预算固定时，在 `facebook` 广告上额外花费 1 000 美元，会使 `sales`\
    \ 平均增加约 `0.1885*1000 = 189` 个销售单位。\n\n`youtube` 系数表明，在其他所有预测变量保持不变的情况下，`youtube`\
    \ 广告预算每增加 1 000 美元，我们平均可以预期销售单位增加 `0.045*1000 = 45`。\n\n我们发现 `newspaper` 在多元回归模型中不显著。这意味着，在\
    \ `youtube` 和 `newspaper` 广告预算固定时，`newspaper` 广告预算的变化不会显著影响 `sales` 单位。\n\n由于\
    \ `newspaper` 变量不显著，可以将其从模型中移除：\n\n```\n## \n## Call:\n## lm(formula = sales ~\
    \ youtube + facebook, data = train.data)\n## \n## Residuals:\n##     Min     \
    \ 1Q  Median      3Q     Max \n## -10.481  -1.104   0.349   1.423   3.486 \n##\
    \ \n## Coefficients:\n##             Estimate Std. Error t value Pr(>|t|)    \n\
    ## (Intercept)  3.43446    0.40877     8.4  2.3e-14 ***\n## youtube      0.04558\
    \    0.00159    28.7  < 2e-16 ***\n## facebook     0.18788    0.00920    20.4\
    \  < 2e-16 ***\n## ---\n## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.'\
    \ 0.1 ' ' 1\n## \n## Residual standard error: 2.11 on 159 degrees of freedom\n\
    ## Multiple R-squared:  0.89,   Adjusted R-squared:  0.889 \n## F-statistic: \
    \ 644 on 2 and 159 DF,  p-value: <2e-16\n```\n\n最后，我们的模型方程可以写成如下形式：`sales = 3.43+\
    \ 0.045youtube + 0.187 facebook`。\n\n### 4.6.3 Model accuracy\n\n一旦你确定至少有一个预测变量与结果显著相关，你应继续进行诊断，检查模型对数据的拟合程度。该过程也称为拟合优度。\n\
    \n线性回归拟合的整体质量可通过模型摘要中显示的以下三个量来评估：\n\n1. 残差标准误 `RSE`，\n2. R-squared `R2` 和调整后 `R2`，\n\
    3. `F-statistic`，已在上一节中描述\n\n```\n##    rse r.squared f.statistic  p.value\n##\
    \ 1 2.11      0.89         644 5.64e-77\n```\n\n1. Residual standard error `RSE`.\n\
    \n`RSE` 或模型 sigma，对应预测误差，大致代表观测结果值与模型预测值之间的平均差异。`RSE` 越低，模型对数据的拟合越好。\n\n将 `RSE`\
    \ 除以结果变量的平均值将得到预测误差率，应尽可能小。\n\n在我们的示例中，仅使用 `youtube` 和 `facebook` 预测变量时，`RSE =\
    \ 2.11`，意味着观测到的 `sales` 值与预测值平均偏差约为 2.11 个单位。\n\n这对应于误差率为 `2.11/mean(train.data$sales)\
    \ = 2.11/16.77 = 13%`，较低。\n\n2. R-squared and Adjusted R-squared :\n\nR-squared\
    \ `R2` 范围从 0 到 1，表示模型预测变量可以解释的结果变量变异的比例。\n\n对于简单线性回归，`R2` 是结果与预测变量之间皮尔逊相关系数的平方。在多元线性回归中，`R2`\
    \ 表示观测结果值与预测值之间的相关系数。\n\n`R2` 衡量模型拟合数据的程度。`R2` 越高，模型越好。然而，`R2` 的问题是，当向模型中添加更多变量时，它总会增加，即使这些变量与结果仅弱相关\
    \ `James et al. 2014`。一种解决方案是通过考虑预测变量的数量来调整 `R2`。\n\n摘要输出中“调整后 R 平方”值的调整是对纳入预测模型中的\
    \ x 变量数量的校正。\n\n因此，你应主要考虑调整后 R 平方，它是对预测变量数量较多的惩罚性 `R2`。\n\n* 调整后 `R2` 接近 1 表明回归模型解释了结果变异的大部分比例。\n\
    * 接近 0 的数值表明回归模型没有解释结果变异的多少。\n\n在我们的示例中，调整后 `R2` 为 0.88，效果良好。\n\n3. F-Statistic\
    \ :\n\n请记住，`F-statistic` 给出模型的整体显著性。它评估至少一个预测变量是否具有非零系数。\n\n在简单线性回归中，该检验并不真正有趣，因为它只是重复了系数表中\
    \ t 检验提供的信息。\n\n一旦我们开始使用多个预测变量，如多元线性回归，`F-statistic` 就变得更重要。\n\n较大的 `F-statistic`\
    \ 对应于统计显著的 p 值 `p < 0.05`。在我们的示例中，`F-statistic` 等于 644，产生 p 值为 1.46e-42，具有高度显著性。\n\
    \n## 4.7 Making predictions\n\n我们将使用测试数据进行预测，以评估回归模型的性能。\n\n步骤如下：\n\n1. 基于测试数据中的新广告预算预测\
    \ `sales` 值\n2. 通过计算评估模型性能：\n   * 预测误差 `RMSE` 均方根误差，表示测试数据中观测到的已知结果值与模型预测结果值之间的平均差异。`RMSE`\
    \ 越低，模型越好。\n   * R-square `R2`，表示观测结果值与预测结果值之间的相关性。`R2` 越高，模型越好。\n\n```\n## [1]\
    \ 1.58\n```\n\n```\n## [1] 0.938\n```\n\n"
