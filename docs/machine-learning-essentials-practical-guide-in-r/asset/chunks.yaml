- raw: "The *Residuals vs Leverage* plot can help us to find influential observations\
    \ if any. On this plot, outlying values are generally located at the upper right\
    \ corner or at the lower right corner. Those spots are the places where data points\
    \ can be influential against a regression line.\n\nThe following plots illustrate\
    \ the Cook's distance and the leverage of our model:\n\n```\n\n```\n\n![](Image00015.jpg)\n\
    \nBy default, the top 3 most extreme values are labelled on the Cook's distance\
    \ plot. If you want to label the top 5 extreme values, specify the option `id.n`\
    \ as follow:\n\n```\n\n```\n\nIf you want to look at these top 3 observations\
    \ with the highest Cook’s distance in case you want to assess them further, type\
    \ this R code:\n\n```\n\n```\n\n```\n##   index sales youtube .fitted .resid \
    \  .hat .cooksd .std.resid\n## 1    26  14.4     315    23.4  -9.04 0.0142  0.0389\
    \      -2.33\n## 2    36  15.4     349    25.0  -9.66 0.0191  0.0605      -2.49\n\
    ## 3   179  14.2     332    24.2 -10.06 0.0165  0.0563      -2.59\n```\n\nWhen\
    \ data points have high Cook’s distance scores and are to the upper or lower right\
    \ of the leverage plot, they have leverage meaning they are influential to the\
    \ regression results. The regression results will be altered if we exclude those\
    \ cases.\n\nIn our example, the data don't present any influential points. Cook’s\
    \ distance lines (a red dashed line) are not shown on the Residuals vs Leverage\
    \ plot because all points are well inside of the Cook’s distance lines.\n\nLet's\
    \ show now another example, where the data contain two extremes values with potential\
    \ influence on the regression results:\n\n```\n\n```\n\nCreate the *Residuals\
    \ vs Leverage* plot of the two models:\n\n```\n\n```\n\n![](Image00016.jpg)\n\n\
    On the Residuals vs Leverage plot, look for a data point outside of a dashed line,\
    \ Cook’s distance. When the points are outside of the Cook’s distance, this means\
    \ that they have high Cook’s distance scores. In this case, the values are influential\
    \ to the regression results. The regression results will be altered if we exclude\
    \ those cases.\n\nIn the above example 2, two data points are far beyond the Cook’s\
    \ distance lines. The other residuals appear clustered on the left. The plot identified\
    \ the influential observation as #201 and #202. If you exclude these points from\
    \ the analysis, the slope coefficient changes from 0.06 to 0.04 and R2 from 0.5\
    \ to 0.6. Pretty big impact!\n\n## 9.13 Discussion\n\nThis chapter describes linear\
    \ regression assumptions and shows how to diagnostic potential problems in the\
    \ model.\n\nThe diagnostic is essentially performed by visualizing the residuals.\
    \ Having patterns in residuals is not a stop signal. Your current regression model\
    \ might not be the best way to understand your data.\n\nPotential problems might\
    \ be:\n\n*   A non-linear relationships between the outcome and the predictor\
    \ variables. When facing to this problem, one solution is to include a quadratic\
    \ term, such as polynomial terms or log transformation. See Chapter [7](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\n*   Existence of important variables that you left out from your model.\
    \ Other variables you didn’t include (e.g., age or gender) may play an important\
    \ role in your model and data. See Chapter [11](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\n*   Presence of outliers. If you believe that an outlier has occurred due\
    \ to an error in data collection and entry, then one solution is to simply remove\
    \ the concerned observation.\n\n# 10 Multicollinearity\n\n## 10.1 Introduction\n\
    \nIn multiple regression (Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ), two\
    \ or more predictor variables might be correlated with each other. This situation\
    \ is referred as *collinearity* .\n\nThere is an extreme situation, called **multicollinearity**\
    \ , where collinearity exists between three or more variables even if no pair\
    \ of variables has a particularly high correlation. This means that there is redundancy\
    \ between predictor variables.\n\nIn the presence of multicollinearity, the solution\
    \ of the regression model becomes unstable.\n\nFor a given predictor (p), multicollinearity\
    \ can assessed by computing a score called the **variance inflation factor** (or\
    \ **VIF** ), which measures how much the variance of a regression coefficient\
    \ is inflated due to multicollinearity in the model.\n\nThe smallest possible\
    \ value of VIF is one (absence of multicollinearity). As a rule of thumb, a VIF\
    \ value that exceeds 5 or 10 indicates a problematic amount of collinearity (James\
    \ et al. [2014](#text00039.html#ref-james2014) ) .\n\nWhen faced to multicollinearity,\
    \ the concerned variables should be removed, since the presence of multicollinearity\
    \ implies that the information that this variable provides about the response\
    \ is redundant in the presence of the other variables (James et al. [2014](#text00039.html#ref-james2014)\
    \ ,P. Bruce and Bruce ([2017](#text00039.html#ref-bruce2017) ) ) .\n\nThis chapter\
    \ describes how to detect multicollinearity in a regression model using R.\n\n\
    ## 10.2 Loading Required R packages\n\n*   `tidyverse` for easy data manipulation\
    \ and visualization\n\n*   `caret` for easy machine learning workflow\n\n```\n\
    \n```\n\n## 10.3 Preparing the data\n\nWe'll use the `Boston` data set [in `MASS`\
    \ package], introduced in Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for\
    \ predicting the median house value (`mdev` ), in Boston Suburbs, based on multiple\
    \ predictor variables.\n\nWe’ll randomly split the data into training set (80%\
    \ for building a predictive model) and test set (20% for evaluating the model).\
    \ Make sure to set seed for reproducibility.\n\n```\n\n```\n\n## 10.4 Building\
    \ a regression model\n\nThe following regression model include all predictor variables:\n\
    \n```\n\n```\n\n```\n##   RMSE   R2\n## 1 4.99 0.67\n```\n\n## 10.5 Detecting\
    \ multicollinearity\n\nThe R function `vif()` [car package] can be used to detect\
    \ multicollinearity in a regression model:\n\n```\n\n```\n\n```\n##    crim  \
    \    zn   indus    chas     nox      rm     age     dis     rad \n##    1.87 \
    \   2.36    3.90    1.06    4.47    2.01    3.02    3.96    7.80 \n##     tax\
    \ ptratio   black   lstat \n##    9.16    1.91    1.31    2.97\n```\n\nIn our\
    \ example, the VIF score for the predictor variable `tax` is very high (VIF =\
    \ 9.16). This might be problematic.\n\n## 10.6 Dealing with multicollinearity\n\
    \nIn this section, we'll update our model by removing the the predictor variables\
    \ with high VIF value:\n\n```\n\n```\n\n```\n##   RMSE    R2\n## 1 5.01 0.671\n\
    ```\n\nIt can be seen that removing the `tax` variable does not affect very much\
    \ the model performance metrics.\n\n## 10.7 Discussion\n\nThis chapter describes\
    \ how to detect and deal with multicollinearity in regression models. Multicollinearity\
    \ problems consist of including, in the model, different variables that have a\
    \ similar predictive relationship with the outcome. This can be assessed for each\
    \ predictor by computing the VIF value.\n\nAny variable with a high VIF value\
    \ (above 5 or 10) should be removed from the model. This leads to a simpler model\
    \ without compromising the model accuracy, which is good.\n\nNote that, in a large\
    \ data set presenting multiple correlated predictor variables, you can perform\
    \ principal component regression and partial least square regression strategies.\
    \ See Chapter [20](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) .\n\n# 11 Confounding Variables\n\
    \nA **Confounding variable** is an important variable that should be included\
    \ in the predictive model but you omit it.Naive interpretation of such models\
    \ can lead to invalid conclusions.\n\nFor example, consider that we want to model\
    \ life expentency in different countries based on the GDP per capita, using the\
    \ `gapminder` data set:\n\n```\n\n```\n\nIn this example, it is clear that the\
    \ continent is an important variable: countries in Europe are estimated to have\
    \ a higher life expectancy compared to countries in Africa. Therefore, continent\
    \ is a confounding variable that should be included in the model:\n\n```\n\n```\n\
    \n# 12 Introduction"
