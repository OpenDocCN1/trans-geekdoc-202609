  trans: "\n\n混淆矩阵的对角线元素表示预测正确，而非对角线表示预测错误。因此，正确分类率是对角线上的数值之和除以测试数据中的样本量。在我们的例子中，即为\
    \ `(48 + 15)/78 = 81%`。\n\n表格中的每个单元格都有重要的含义：\n\n![confusion matrix](img/Image00027.gif)\n\
    \nconfusion matrix\n\n*   **真阳性** (`d`)：我们预测个体为糖尿病阳性且他们确实为阳性的情况。\n*   **真阴性**\
    \ (`a`)：我们预测为糖尿病阴性，且个体确实为糖尿病阴性。\n*   **假阳性** (`b`)：我们预测为糖尿病阳性，但个体实际上没有糖尿病。 （也称为\
    \ *I 型错误*。）\n*   **假阴性** (`c`)：我们预测为糖尿病阴性，但他们确实患有糖尿病。 （也称为 *II 型错误*。）\n\n从技术上讲，模型的原始预测准确率定义为\
    \ `(TruePositives + TrueNegatives)/SampleSize`。\n\n## 30.6 精确率、召回率和特异性\n\n除了原始分类准确率之外，还有许多其他指标被广泛用于检验分类模型的性能，包括：\n\
    \n**精确率**，即模型预测为糖尿病阳性的人群中真阳性的比例。这代表了预测阳性结果的准确性。 `Precision = TruePositives/(TruePositives\
    \ + FalsePositives)`。\n\n**灵敏度**（或 **召回率**），即 **真阳性率** (`TPR`) 或在糖尿病阳性人群（class\
    \ = 1）中被识别出的阳性比例。 `Sensitivity = TruePositives/(TruePositives + FalseNegatives)`。\n\
    \n**特异性**，衡量 **真阴性率** (`TNR`)，即在糖尿病阴性人群（class = 0）中被识别出的阴性比例。 `Specificity = TrueNegatives/(TrueNegatives\
    \ + FalseNegatives)`。\n\n**假阳性率** (`FPR`)，表示在健康个体（即糖尿病阴性）中被识别为阳性的比例。这可以被视为误报。\
    \ `FPR` 也可以计算为 `1-specificity`。当阳性较少时，`FPR` 可能很高，导致预测为阳性时更可能为阴性的情况。\n\n**Sensitivy**\
