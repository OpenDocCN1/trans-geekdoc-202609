    \n层次聚类的结果是对象的树状表示，也称为树状图。可以通过在期望的相似性水平处剪切树状图来将观测值细分为组。\n\n*   计算：R 函数：`hclust()`。它以不相似性矩阵作为输入，该矩阵使用函数\
