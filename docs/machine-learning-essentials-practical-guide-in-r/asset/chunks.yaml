    There are many R functions and packages for assessing model quality, including:


    *   `summary()` [stats package], returns the R-squared, adjusted R-squared and
    the RSE


    *   `AIC()` and `BIC()` [stats package], computes the AIC and the BIC, respectively


    ```


    ```


    *   `rsquare()` , `rmse()` and `mae()` [modelr package], computes, respectively,
    the R2, RMSE and the MAE.


