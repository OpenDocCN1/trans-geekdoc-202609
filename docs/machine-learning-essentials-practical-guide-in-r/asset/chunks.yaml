    ## glucose       100.0\n## age            33.5\n## pregnant       19.0\n## mass\
    \           16.2\n## triceps        15.4\n## pedigree       12.8\n## insulin \
    \       11.2\n## pressure        0.0\n```\n\n## 34.4 回归\n\n同样，你可以构建随机森林模型来执行回归，即预测连续变量。\n\
    \n### 34.4.1 数据集示例\n\n我们将使用 `Boston` 数据集 [`in` `MASS` package]，在第 3 章中介绍，用于预测波士顿郊区的房屋中位价值（`mdev`），使用不同的预测变量。\n\
    \n随机将数据拆分为训练集（用于构建预测模型的 80%）和测试集（用于评估模型的 20%）。\n\n\n\n### 34.4.2 计算随机森林回归树\n\n\
    这里预测误差通过 RMSE 衡量，对应于结果的已知观测值与模型预测值之间的平均差异。RMSE 计算为 `RMSE = mean((observeds - predicteds)²)\
    \ %>% sqrt()`。RMSE 越低，模型越好。\n\n\n\n## 34.5 超参数\n\n请注意，随机森林算法有一组超参数，应使用交叉验证进行调优以避免过拟合。\n\
    \n这些包括：\n\n*   `nodesize`: 终端节点的最小大小。分类的默认值是 1，回归的默认值是 5。\n*   `maxnodes`: 森林中树的终端节点最大数量。如果未给出，则树会生长到最大可能程度（受\
    \ `nodesize` 限制）。\n\n忽略这些参数可能会导致在嘈杂的数据集上过拟合（P. Bruce and Bruce 2017）。可以使用交叉验证测试不同的值，以选择最佳值。\n\
    \n超参数可以使用 `caret` 包手动调优。对于给定参数，该方法包括使用参数的不同值拟合许多模型，然后比较这些模型。\n\n以下示例使用 `PimaIndiansDiabetes2`\
    \ 数据集对 `nodesize` 的不同值进行分类测试：\n\n（这将花费 1-2 分钟执行时间）\n\n\n\n```\n## \n## Call:\n\
    ## summary.resamples(object = ., metric = \"Accuracy\")\n## \n## Models: 1, 2,\
    \ 4, 8 \n## Number of resamples: 10 \n## \n## Accuracy \n##    Min. 1st Qu. Median\
    \  Mean 3rd Qu.  Max. NA's\n## 1 0.692   0.750  0.785 0.793   0.840 0.897    0\n\
    ## 2 0.692   0.744  0.808 0.788   0.841 0.850    0\n## 4 0.692   0.744  0.795\
    \ 0.786   0.825 0.846    0\n## 8 0.692   0.750  0.808 0.796   0.841 0.897    0\n\
    ```\n\n可以看出，使用 `nodesize` 值为 2 或 8 会导致中位准确度值最高。\n\n## 34.6 讨论\n\n本章描述了 bagging\
    \ 和随机森林机器学习算法的基础。我们还提供了 R 中用于分类和回归分析的实际示例。\n\n另一种 bagging 和随机森林的替代方法是 boosting（第\
    \ 35 章）。\n\n# 35 Boosting\n\n之前，我们描述了 bagging 和随机森林机器学习算法，用于构建强大的预测模型（第 34 章）。\n\
    \n回想一下，bagging 包括对训练数据集进行多次子集采样，然后构建多个独立的决策树模型，然后对模型进行平均，从而与经典的 CART 模型（第 33 章）相比创建出性能非常好的预测模型。\n\
    \n本章描述了一种称为 **boosting** 的替代方法，与 bagging 方法类似，只是树是顺序生长的：每一棵后续树都是使用之前生长的树的信息生长的，目的是最小化之前模型的误差（James\
    \ et al. 2014）。\n\n例如，给定一个当前的回归树模型，过程如下：\n\n1. 使用模型残差误差作为结果变量拟合决策树。\n2. 将此新决策树调整为收缩参数\
    \ `lambda`，并将其加入拟合函数中以更新残差。`lambda` 是一个很小的正值，通常在 0.01 和 0.001 之间（James et al.\
    \ 2014）。\n\n这种方法会缓慢且逐步地改进拟合模型，从而产生性能非常好的模型。Boosting 有不同的调优参数，包括：\n\n*   树的数量 `B`\n\
    *   收缩参数 `lambda`\n*   每棵树中的分裂数。\n\nBoosting 有不同的变体，包括 *Adaboost*、*gradient boosting*\
    \ 和 *stochastic gradient boosting*。\n\n随机梯度提升，实现了 R 包 *xgboost* 中，是最常用的提升技术，它涉及在每一轮中对观测值和列进行重采样。它提供了最佳性能。`xgboost`\
    \ 代表极端梯度提升。\n\nBoosting 可用于分类和回归问题。\n\n在本章中，我们将描述如何在 R 中计算 boosting。\n\n## 35.1\
    \ 加载所需的 R 包\n\n*   `tidyverse` 用于轻松的数据操作和可视化\n*   `caret` 用于轻松的机器学习工作流\n*   `xgboost`\
    \ 用于计算 boosting 算法\n\n\n\n## 35.2 分类\n\n### 35.2.1 数据集示例\n\n数据集：`PimaIndiansDiabetes2`\
    \ [`in` `mlbench` package]，在第 21 章中介绍，用于基于多个临床变量预测患糖尿病的概率。\n\n随机将数据拆分为训练集（用于构建预测模型的\
    \ 80%）和测试集（用于评估模型的 20%）。确保设置种子以确保可重复性。\n\n\n\n### 35.2.2 提升分类树\n\n我们将使用 `caret`\
    \ 工作流，该工作流调用 `xgboost` 包，以自动调整模型参数值，并拟合解释我们数据最好的最终最佳提升树。\n\n我们将在函数 `train()` 中使用以下参数：\n\
    \n*   `trControl`，用于设置 10 折交叉验证\n\n\n\n```\n##    nrounds max_depth eta gamma\
    \ colsample_bytree min_child_weight subsample\n## 18     150         1 0.3   \
    \  0              0.8                1         1\n```\n\n\n\n```\n\n\n\n```\n\
    ## [1] neg pos neg neg pos neg\n## Levels: neg pos\n```\n\n\n\n```\n\n\n\n```\n\
    ## [1] 0.744\n```\n\n在新的测试数据上的预测准确率为 74%，这是不错的。\n\n有关 boosting 调优参数的更多解释，请在 R\
    \ 中输入 `?xgboost` 查看文档。\n\n### 35.2.3 变量重要性\n\n函数 `varImp()` [`in caret`] 以百分比显示变量的重要性：\n\
    \n\n\n```\n## xgbTree variable importance\n## \n##          Overall\n## glucose\
    \   100.00\n## mass       20.23\n## pregnant   15.83\n## insulin    13.15\n##\
    \ pressure    9.51\n## triceps     8.18\n## pedigree    0.00\n## age         0.00\n\
