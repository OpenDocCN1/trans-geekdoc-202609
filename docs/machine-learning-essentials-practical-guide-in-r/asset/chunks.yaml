    \n# 7 非线性回归\n\n## 7.1 引言\n\n在某些情况下，结果与预测变量之间的真实关系可能不是线性的。\n\n有不同的解决方案扩展线性回归模型（第\
    \ `4` 章）以捕捉这些非线性效应，包括：\n\n*   **多项式回归**。这是对非线性关系建模的简单方法。它向回归中添加多项式项或二次项（平方、立方等）。\n\
    *   **样条回归**。用一系列多项式段拟合一条平滑曲线。分隔样条段的值称为 **Knots**。\n*   **广义可加模型**（GAM）。使用自动选择结点的样条模型。\n\
    \n在本章中，您将学习如何计算非线性回归模型以及如何比较不同的模型以选择最适合您数据的模型。\n\n`RMSE` 和 `R2` 指标将用于比较不同的模型（参见第\
    \ `@ref(linear regression)` 章）。\n\n请记住，`RMSE` 表示模型预测误差，即观察到的结果值与预测的结果值之间的平均差异。`R2`\
    \ 表示观察结果值与预测结果值之间的平方相关性。最佳模型是 `RMSE` 最低且 `R2` 最高的模型。\n\n## 7.2 加载所需的 R 包\n\n*\
    \   `tidyverse` 用于轻松的数据操作和可视化\n*   `caret` 用于轻松的机器学习工作流\n\n```\n\n```\n\n## 7.3\
    \ 准备数据\n\n我们将使用 `Boston` 数据集 [在 `MASS` 包中]，在第 `3` 章中介绍，用于预测波士顿郊区的房屋中位数价值（`mdev`），基于预测变量\
    \ `lstat`（人口中低收入比例）。\n\n我们将随机将数据拆分为训练集（80% 用于构建预测模型）和测试集（20% 用于评估模型）。请确保设置种子以保证可重复性。\n\
    \n```\n\n```\n\n首先，按如下方式可视化 `medv` 与 `lstat` 变量的散点图：\n\n```\n\n```\n\n![](img/Image00002.jpg)\n\
    \n上图散点图表明两个变量之间存在非线性关系\n\n在接下来的章节中，我们首先计算线性和非线性回归模型。接下来，我们将比较不同的模型以选择最适合我们数据的模型。\n\
    \n## 7.4 线性回归 {linear-reg}\n\n标准线性回归模型方程可以写为 `medv = b0 + b1*lstat`。\n\n计算线性回归模型：\n\
    \n```\n\n```\n\n```\n##   RMSE    R2\n## 1 6.07 0.535\n```\n\n可视化数据：\n\n```\n\n\
    ```\n\n![](img/Image00003.jpg)\n\n## 7.5 多项式回归\n\n多项式回归按如下方式向回归方程添加多项式或二次项：\n\n\
    `medv=b0+b1*lstat+b2*lstat2` `medv = b0 + b1*lstat + b2*lstat²`\n\n在 R 中，要创建预测变量\
    \ `x²`，应使用函数 `I()`，如下所示：`I(x²)`。这将 `x` 提高到 2 次方。\n\n多项式回归可以在 R 中按如下方式计算：\n\n```\n\
    \n```\n\n另一种简单的解决方案是使用以下方法：\n\n```\n\n```\n\n```\n## \n## Call:\n## lm(formula\
    \ = medv ~ poly(lstat, 2), data = train.data)\n## \n## Coefficients:\n##     (Intercept)\
    \  poly(lstat, 2)1  poly(lstat, 2)2  \n##            22.7           -139.4   \
    \          57.7\n```\n\n输出包含与 `lstat` 相关的两个系数：一个用于线性项（`lstat¹`），一个用于二次项（`lstat²`）。\n\
    \n以下示例计算六阶多项式拟合：\n\n```\n\n```\n\n```\n## \n## Call:\n## lm(formula = medv ~ poly(lstat,\
    \ 6), data = train.data)\n## \n## Residuals:\n##    Min     1Q Median     3Q \
    \   Max \n## -14.23  -3.24  -0.74   2.02  26.50 \n## \n## Coefficients:\n##  \
    \               Estimate Std. Error t value Pr(>|t|)    \n## (Intercept)     \
    \  22.739      0.262   86.83  < 2e-16 ***\n## poly(lstat, 6)1 -139.357      5.284\
    \  -26.38  < 2e-16 ***\n## poly(lstat, 6)2   57.728      5.284   10.93  < 2e-16\
    \ ***\n## poly(lstat, 6)3  -25.923      5.284   -4.91  1.4e-06 ***\n## poly(lstat,\
    \ 6)4   21.378      5.284    4.05  6.3e-05 ***\n## poly(lstat, 6)5  -13.817  \
    \    5.284   -2.62   0.0093 ** \n## poly(lstat, 6)6    7.268      5.284    1.38\
    \   0.1697    \n## ---\n## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.'\
    \ 0.1 ' ' 1\n## \n## Residual standard error: 5.28 on 400 degrees of freedom\n\
    ## Multiple R-squared:  0.684,  Adjusted R-squared:  0.679 \n## F-statistic: \
    \ 144 on 6 and 400 DF,  p-value: <2e-16\n```\n\n从上面的输出可以看出，超过五阶的多项式项不显著。因此，只需按如下方式创建五阶多项式回归模型：\n\
    \n```\n\n```\n\n```\n##   RMSE    R2\n## 1 4.96 0.689\n```\n\n按如下方式可视化五阶多项式回归线：\n\
    \n```\n\n```\n\n![](img/Image00004.jpg)\n\n## 7.6 对数变换\n\n当您具有非线性关系时，也可以尝试对预测变量进行对数变换：\n\
    \n```\n\n```\n\n```\n##   RMSE    R2\n## 1 5.24 0.657\n```\n\n可视化数据：\n\n```\n\n\
    ```\n\n![](img/Image00005.jpg)\n\n## 7.7 样条回归\n\n多项式回归只能捕捉非线性关系中的一定程度的曲率。一种替代且通常更优的方法来建模非线性关系是使用样条（P.\
    \ Bruce and Bruce 2017）。\n\n"
