    # 29 支持向量机


    ## 29.1 引言


    **支持向量机**（或 **SVM**）是一种用于 *分类* 任务的机器学习技术。简而言之，SVM 通过识别分隔不同组（或类别）数据点的最佳决策边界，然后基于此分离边界预测新观测值的类别来工作。


    根据情况的不同，不同组可能由线性直线或非线性边界线分隔。


    支持向量机方法可以处理线性和非线性类边界。它可用于二类和多类分类问题。


