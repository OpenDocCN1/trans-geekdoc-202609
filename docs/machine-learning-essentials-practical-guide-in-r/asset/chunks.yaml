    ```\n## [1] 0.782\n```\n\n我们树模型的整体准确率为 78%，这还不错。\n\n然而，这个包含所有预测变量的完整树看起来非常复杂，在具有多个预测变量的大型数据集的情况下可能难以解释。\n\
    \n此外，很容易看出，完全生长的树会过拟合训练数据，并可能导致测试集性能不佳。\n\n限制这种过拟合的一种策略是对树进行修剪，从而得到一个更简单、分割更少的树，在解释性更好的同时以少量偏差为代价（James\
    \ et al. 2014，P. Bruce and Bruce (2017)）。\n\n### 33.4.3 修剪树\n\n简而言之，我们的目标是看看一个更小的子树是否能给我们与完全生长的树相当的结果。如果可以，我们应该选择更简单的树，因为它降低了过拟合的可能性。\n\
    \n一种可能的稳健的修剪树（或停止树生长）策略是避免在分割不能显著改善模型整体质量的情况下分割分区。\n\n在 `rpart` 包中，这由 *复杂度参数*（`cp`）控制，它对树拥有过多分割施加惩罚。默认值是\
    \ 0.01。`cp` 越高，树越小。\n\n`cp` 值过小会导致过拟合，而 `cp` 值过大则会导致树过小。这两种情况都会降低模型的预测性能。\n\n\
    最佳 `cp` 值可以通过测试不同的 cp 值并使用交叉验证方法来确定模型的相应预测准确率来估计。最佳 `cp` 然后被定义为使交叉验证准确率最大化的那个（第\
    \ 14 章）。\n\n修剪可以在 `caret` 包的工作流程中轻松执行，该流程调用 `rpart` 方法自动测试 `cp` 的不同可能值，然后选择使交叉验证（\"\
    cv\"）准确率最大化的最佳 `cp`，并拟合解释我们数据最好的最终最佳 CART 模型。\n\n你可以在函数 `train()` [来自 caret 包]\
    \ 中使用以下参数：\n\n* `trControl`，设置 10 折交叉验证\n* `tuneLength`，指定要评估的可能 `cp` 值的数量。默认值是\
    \ 3，这里我们将使用 10。\n\n```\n```\n\n![](img/Image00034.jpg)\n\n```\n```\n\n```\n##\
    \       cp\n## 2 0.0321\n```\n\n```\n```\n\n![](img/Image00035.jpg)\n\n```\n```\n\
    \n```\n## n= 314 \n## \n## node), split, n, loss, yval, (yprob)\n##       * denotes\
    \ terminal node\n## \n##  1) root 314 104 neg (0.6688 0.3312)  \n##    2) glucose<\
    \ 128 188  26 neg (0.8617 0.1383) *\n##    3) glucose>=128 126  48 pos (0.3810\
    \ 0.6190)  \n##      6) glucose< 166 88  44 neg (0.5000 0.5000)  \n##       12)\
    \ age< 23.5 16   1 neg (0.9375 0.0625) *\n##       13) age>=23.5 72  29 pos (0.4028\
    \ 0.5972) *\n##      7) glucose>=166 38   4 pos (0.1053 0.8947) *\n```\n\n```\n\
    ```\n\n```\n## [1] 0.795\n```\n\n从上面的输出可以看出，复杂度参数（`cp`）的最佳值为 0.032，允许一个更简单的树，易于解释，整体准确率为\
    \ 79%，与我们使用完整树获得的准确率（78%）相当。修剪树的预测准确率甚至比完整树更好。\n\n综合来看，我们应该选择这个更简单的模型。\n\n## 33.5\
    \ 回归树\n\n之前，我们描述了如何构建分类树来预测观测值的组（即类别）。\n\n在本节中，我们将描述如何构建用于预测连续变量的树，该方法称为回归分析（第\
    \ 3 章）。\n\nR 代码与我们在前几节中看到的相同。这里也应应用修剪以限制过拟合。\n\n与分类树类似，以下 R 代码使用 `caret` 包构建回归树并预测新的测试数据集的输出。\n\
    \n### 33.5.1 数据集示例\n\n数据集：我们将使用 `Boston` 数据集 [在 `MASS` 包中]，在第 3 章中介绍过，用于预测波士顿郊区的房屋中位价值（`mdev`），使用不同的预测变量。\n\
    \n我们将随机将数据分为训练集（80% 用于构建预测模型）和测试集（20% 用于评估模型）。请确保设置种子以保证可重复性。\n\n```\n```\n\n\
    ### 33.5.2 创建回归树\n\n这里，最佳 `cp` 值是使预测误差 RMSE（均方根误差）最小化的值。\n\n预测误差由 RMSE 衡量，它对应于结果的观测已知值与模型预测值之间的平均差异。RMSE\
    \ 计算为 `RMSE = mean((observeds - predicteds)²) %>% sqrt()`。RMSE 越低，模型越好。\n\n选择最佳\
    \ cp 值：\n\n```\n```\n\n![](img/Image00036.jpg)\n\n绘制最终树模型：\n\n```\n```\n\n![](img/Image00037.jpg)\n\
    \n```\n```\n\n## 33.6 条件推断树\n\n条件推断树（`ctree`）使用显著性检验方法递归选择和分割与结果最相关的预测变量。这与经典的\
    \ `rpart` 算法相比可以限制过拟合。\n\n在每次分割步骤中，如果预测变量与结果变量之间没有依赖关系，算法就会停止。否则，选择与结果关联最强的变量进行分割。\n\
    \n条件树可以使用 `caret` 工作流程轻松计算，该流程将调用 `party` 包中的函数 `ctree()`。\n\n1. 演示数据：`PimaIndiansDiabetes2`。首先将数据分为训练集（80%）和测试集（20%）\n\
    \n```\n```\n\n2. 使用调优参数 `maxdepth` 和 `mincriterion` 构建条件树以控制树的大小。`caret` 包会自动为你的数据选择最佳调优值，但在这里我们将指定\
    \ `maxdepth` 和 `mincriterion`。\n\n以下示例创建了一个分类树：\n\n```\n```\n\n![](img/Image00038.jpg)\n\
    \n```\n```\n\n```\n## [1] 0.744\n```\n\n"
