    # 30 Classification Model Evaluation


    ## 30.1 Introduction


    After building a predictive classification model, you need to **evaluate the performance
    of the model** , that is how good the model is in predicting the outcome of new
    observations test data that have been not used to train the model.


    In other words you need to estimate the model prediction *accuracy* and prediction
    errors using a new test data set. Because we know the actual outcome of observations
    in the test data set, the performance of the predictive model can be assessed
    by comparing the predicted outcome values against the known outcome values.


    This chapter describes the commonly used metrics and methods for assessing the
    performance of predictive classification models, including:


    *   **Average classification accuracy** , representing the proportion of correctly
    classified observations.


    *   **Confusion matrix** , which is 2x2 table showing four parameters, including
    the number of true positives, true negatives, false negatives and false positives.


    *   **Precision, Recall and Specificity** , which are three major performance
    metrics describing a predictive classification model


    *   **ROC curve** , which is a graphical summary of the overall performance of
    the model, showing the proportion of true positives and false positives at all
    possible values of probability cutoff. The **Area Under the Curve** (**AUC** )
    summarizes the overall performance of the classifier.


    We''ll provide practical examples in R to compute these above metrics, as well
    as, to create the ROC plot.


