    # 22 Logistic Regression


    ## 22.1 Introduction


    **Logistic regression** is used to predict the class (or category) of individuals
    based on one or multiple predictor variables (x). It is used to model a binary
    outcome, that is a variable, which can have only two possible values: 0 or 1,
    yes or no, diseased or non-diseased.


    Logistic regression belongs to a family, named *Generalized Linear Model* (*GLM*
    ), developed for extending the linear regression model (Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)
    ) to other situations. Other synonyms are *binary logistic regression* , *binomial
    logistic regression* and *logit model* .


    Logistic regression does not return directly the class of observations. It allows
    us to estimate the probability (p) of class membership. The probability will range
    between 0 and 1. You need to decide the threshold probability at which the category
    flips from one to the other. By default, this is set to `p = 0.5` , but in reality
    it should be settled based on the analysis purpose.


    In this chapter you''ll learn how to:


    *   Define the logistic regression equation and key terms such as log-odds and
    logit


    *   Perform logistic regression in **R** and interpret the results


    *   Make predictions on new test data and evaluate the model accuracy


    ## 22.2 Logistic function


    The standard logistic regression function, for predicting the outcome of an observation
    given a predictor variable (x), is an s-shaped curve defined as `p = exp(y) /
    [1 + exp(y)]` (James et al. [2014](#text00039.html#ref-james2014) ) . This can
    be also simply written as `p = 1/[1 + exp(-y)]` , where:


    *   `y = b0 + b1*x` ,


    *   `exp()` is the exponential and


    *   `p` is the probability of event to occur (1) given `x` . Mathematically, this
    is written as `p(event=1|x) and abbreviated as` p(x)`, so` px = 1/[1 + exp(-(b0
    + b1*x))]`


    By a bit of manipulation, it can be demonstrated that `p/(1-p) = exp(b0 + b1*x)`
    . By taking the logarithm of both sides, the formula becomes a linear combination
    of predictors: `log[p/(1-p)] = b0 + b1*x` .


    When you have multiple predictor variables, the logistic function looks like:
    `log[p/(1-p)] = b0 + b1*x1 + b2*x2 + ... + bn*xn`


    `b0` and `b1` are the regression beta coefficients. A positive `b1` indicates
    that increasing `x` will be associated with increasing `p` . Conversely, a negative
    `b1` indicates that increasing `x` will be associated with decreasing `p` .


    The quantity `log[p/(1-p)]` is called the logarithm of the odd, also known as
    **log-odd** or **logit** .


    The **odds** reflect the likelihood that the event will occur. It can be seen
    as the ratio of "successes" to "non-successes". Technically, odds are the probability
    of an event divided by the probability that the event will not take place (P.
    Bruce and Bruce [2017](#text00039.html#ref-bruce2017) ) . For example, if the
    probability of being diabetes-positive is 0.5, the probability of "won''t be"
    is 1-0.5 = 0.5, and the odds are 1.0.


    Note that, the probability can be calculated from the odds as `p = Odds/(1 + Odds)`
    .


