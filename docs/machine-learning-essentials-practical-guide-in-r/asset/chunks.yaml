  trans: "\n\n多重共线性对应于数据中包含高度相关的预测变量的情况。更多内容请阅读第 10 章。\n\n多重共线性是回归分析中的一个重要问题，应通过剔除相关变量来解决。它可以使用\
    \ R 函数 `vif()` [`car` package] 来评估，该函数计算方差膨胀因子：\n\n```\n```\n\n```\n## pregnant\
    \  glucose pressure  triceps  insulin     mass pedigree      age \n##     1.89\
