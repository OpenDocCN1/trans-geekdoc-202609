    # 29 Support Vector Machine


    ## 29.1 Introduction


    **Support Vector Machine** (or **SVM** ) is a machine learning technique used
    for *classification* tasks. Briefly, SVM works by identifying the optimal decision
    boundary that separates data points from different groups (or classes), and then
    predicts the class of new observations based on this separation boundary.


    Depending on the situations, the different groups might be separable by a linear
    straight line or by a non-linear boundary line.


    Support vector machine methods can handle both linear and non-linear class boundaries.
    It can be used for both two-class and multi-class classification problems.'
