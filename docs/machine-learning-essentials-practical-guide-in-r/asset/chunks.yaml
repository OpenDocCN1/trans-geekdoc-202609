    \ reproducibility.\n\n```\n\n```\n\n### 33.5.2 Create the regression tree\n\n\
    Here, the best `cp` value is the one that minimize the prediction error RMSE (root\
    \ mean squared error).\n\nThe prediction error is measured by the RMSE, which\
