    \n## 2.6 数据操作\n\n在 R 中导入数据后，你可以使用 [`tidyverse` 包](http://r4ds.had.co.nz/transform.html)轻松操作它。\n\
    \n加载 tidyverse 后，你可以使用以下 R 函数：\n\n*   `filter()` : 根据其值挑选行（观测值/样本）。\n*   `distinct()`\
