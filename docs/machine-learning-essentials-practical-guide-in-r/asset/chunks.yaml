    ```


    From the output above, the linear discriminant analysis correctly predicted the
    individual outcome in 81% of the cases. This is by far better than random guessing.
    The misclassification error rate can be calculated as 100 - 81% = 19%.


    In our example, a binary classifier can make two types of errors:


    *   it can incorrectly assign an individual who is diabetes-positive to the diabetes-negative
    category


    *   it can incorrectly assign an individual who is diabetes-negative to the diabetes-positive
    category.


    The proportion of theses two types of errors can be determined by creating a **confusion
    matrix** , which compare the predicted outcome values against the known outcome
    values.


