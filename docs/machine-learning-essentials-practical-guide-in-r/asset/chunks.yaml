    我们将使用内置 R `swiss` 数据，该数据在第 3 章中介绍，用于基于社会经济指标预测生育分数。


    ```

    ```


    ## 13.5 构建回归模型


    我们首先创建两个模型：


    1.  模型 1，包含所有预测变量

    2.  模型 2，包含除变量 Examination 外的所有预测变量


    ```

