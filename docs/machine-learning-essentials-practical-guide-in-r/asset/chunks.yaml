    \n```\n\n```\n\n```\n## [1] 0.769\n```\n\nThe overall prediction accuracy of our\
    \ model is 76.9%, which is good (see Chapter [30](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ for learning key metrics used to evaluate a classification model performance).\n\
    \n## 32.5 KNN for regression\n\nIn this section, we'll describe how to predict\
    \ a continuous variable using KNN.\n\nWe'll use the `Boston` data set [in `MASS`\
    \ package], introduced in Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for\
    \ predicting the median house value (`mdev` ), in Boston Suburbs, using different\
    \ predictor variables.\n\n1.  **Randomly split the data** into training set (80%\
    \ for building a predictive model) and test set (20% for evaluating the model).\
    \ Make sure to set seed for reproducibility.\n\n```\n\n```\n\n2.  **Compute KNN\
    \ using caret** .\n\nThe best k is the one that minimize the prediction error\
    \ RMSE (root mean squared error).\n\nThe RMSE corresponds to the square root of\
    \ the average difference between the observed known outcome values and the predicted\
    \ values, `RMSE = mean((observeds - predicteds)^2) %>% sqrt()` . The lower the\
    \ RMSE, the better the model.\n\n```\n\n```\n\n## 32.6 Discussion\n\nThis chapter\
    \ describes the basics of KNN (k-nearest neighbors) modeling, which is conceptually,\
    \ one of the simpler machine learning method.\n\nIt's recommended to standardize\
    \ the data when performing the KNN analysis. We provided R codes to easily compute\
    \ KNN predictive model and to assess the model performance on test data.\n\nWhen\
    \ fitting the KNN algorithm, the analyst needs to specify the number of neighbors\
    \ (k) to be considered in the KNN algorithm for predicting the outcome of an observation.\
    \ The choice of k considerably impacts the output of KNN. k = 1 corresponds to\
    \ a highly flexible method resulting to a training error rate of 0 (overfitting),\
    \ but the test error rate may be quite high.\n\nYou need to test multiple k-values\
    \ to decide an optimal value for your data. This can be done automatically using\
    \ the `caret` package, which chooses a value of k that minimize the cross-validation\
    \ error [14](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) .\n\n# 33 Decision Tree Models\n\
    \n## 33.1 Introduction\n\nThe **decision tree** method is a powerful and popular\
    \ predictive machine learning technique that is used for both *classification*\
    \ and *regression* . So, it is also known as **Classification and Regression Trees**\
    \ (**CART** ).\n\nNote that the R implementation of the CART algorithm is called\
    \ *RPART* (Recursive Partitioning And Regression Trees) available in a package\
    \ of the same name.\n\nIn this chapter we'll describe the basics of tree models\
    \ and provide R codes to compute classification and regression trees.\n\n## 33.2\
    \ Loading required R packages\n\n*   `tidyverse` for easy data manipulation and\
    \ visualization\n\n*   `caret` for easy machine learning workflow\n\n*   `rpart`\
    \ for computing decision tree models\n\n```\n\n```\n\n## 33.3 Decision tree algorithm\n\
    \n### 33.3.1 Basics and visual representation\n\nThe algorithm of decision tree\
    \ models works by repeatedly partitioning the data into multiple sub-spaces, so\
    \ that the outcomes in each final sub-space is as homogeneous as possible. This\
    \ approach is technically called *recursive partitioning* .\n\nThe produced result\
    \ consists of a set of rules used for predicting the outcome variable, which can\
    \ be either:\n\n*   a continuous variable, for regression trees\n\n*   a categorical\
    \ variable, for classification trees\n\nThe decision rules generated by the CART\
    \ predictive model are generally visualized as a binary tree.\n\nThe following\
    \ example represents a tree model predicting the species of iris flower based\
    \ on the length (in cm) and width of sepal and petal.\n\n```\n\n```\n\n![](Image00032.jpg)\n\
    \nThe plot shows the different possible splitting rules that can be used to effectively\
    \ predict the type of outcome (here, iris species). For example, the top split\
    \ assigns observations having `Petal.length < 2.45` to the left branch, where\
    \ the predicted species are `setosa` .\n\nThe different rules in tree can be printed\
    \ as follow:\n\n```\n\n```\n\n```\n## n= 150 \n## \n## node), split, n, loss,\
    \ yval, (yprob)\n##       * denotes terminal node\n## \n## 1) root 150 100 setosa\
    \ (0.333 0.333 0.333)  \n##   2) Petal.Length< 2.5 50   0 setosa (1.000 0.000\
    \ 0.000) *\n##   3) Petal.Length>=2.5 100  50 versicolor (0.000 0.500 0.500) \
    \ \n##     6) Petal.Width< 1.8 54   5 versicolor (0.000 0.907 0.093) *\n##   \
    \  7) Petal.Width>=1.8 46   1 virginica (0.000 0.022 0.978) *\n```\n\nThese rules\
    \ are produced by repeatedly splitting the predictor variables, starting with\
    \ the variable that has the highest association with the response variable. The\
    \ process continues until some predetermined stopping criteria are met.\n\nThe\
    \ resulting tree is composed of *decision nodes* , *branches* and *leaf nodes*\
    \ . The tree is placed from upside to down, so the *root* is at the top and leaves\
    \ indicating the outcome is put at the bottom.\n\nEach decision node corresponds\
    \ to a single input predictor variable and a split cutoff on that variable. The\
    \ leaf nodes of the tree are the outcome variable which is used to make predictions.\n\
    \nThe tree grows from the top (root), at each node the algorithm decides the best\
    \ split cutoff that results to the greatest purity (or homogeneity) in each subpartition.\n\
    \nThe tree will stop growing by the following three criteria (Zhang [2016](#text00039.html#ref-zhang2016)\
    \ ) :\n\n1.  all leaf nodes are pure with a single class;\n\n2.  a pre-specified\
    \ minimum number of training observations that cannot be assigned to each leaf\
    \ nodes with any splitting methods;\n\n3.  The number of observations in the leaf\
    \ node reaches the pre-specified minimum one.\n\nA fully grown tree will overfit\
    \ the training data and the resulting model might not be performant for predicting\
    \ the outcome of new test data. Techniques, such as **pruning** , are used to\
    \ control this problem.\n\n### 33.3.2 Choosing the trees split points\n\nTechnically,\
    \ **for regression modeling** , the split cutoff is defined so that the residual\
    \ sum of squared error (RSS) is minimized across the training samples that fall\
    \ within the subpartition."
