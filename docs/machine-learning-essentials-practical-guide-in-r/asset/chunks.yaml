    *   回归模型准确性指标（第 13 章）用于衡量回归模型的性能。

    *   交叉验证（第 14 章）和自助重采样（第 15 章）用于在测试数据上验证模型。


    # 13 回归模型准确性指标


    ## 13.1 引言


    在本章中，我们将描述用于衡量回归模型（第 4 章）性能的不同统计回归 `metrics`。


    接下来，我们将提供 R 中的实用示例，用于比较两个模型的性能，以便为我们的数据选择最佳模型。


    ## 13.2 模型性能指标


    在回归模型中，最常见的评估指标包括：


    1.  `R-squared` (`R2`)，即结果变量变异中由预测变量解释的比例。在多元回归模型中，`R2` 对应于观测结果值与模型预测值之间的相关系数的平方。`R-squared`
    越高，模型越好。


    2.  `Root Mean Squared Error` (`RMSE`)，衡量模型在预测观测结果时产生的平均误差。数学上，`RMSE` 是 `mean
    squared error (MSE)` 的平方根，而 `MSE` 是观测实际结果值与模型预测值之间平方差的平均值。因此，`MSE = mean((observeds
    - predicteds)²)` 且 `RMSE = sqrt(MSE)`。`RMSE` 越低，模型越好。


    3.  `Residual Standard Error` (`RSE`)，也称为 `model sigma`，是根据模型中预测变量数量调整后的 `RMSE`
    变体。`RSE` 越低，模型越好。实际上，`RMSE` 与 `RSE` 之间的差异很小，尤其对于大型多变量数据。


    4.  `Mean Absolute Error` (`MAE`)，与 `RMSE` 类似，`MAE` 衡量预测误差。数学上，它是观测值与预测结果之间绝对差值的平均值，`MAE
    = mean(abs(observeds - predicteds))`。`MAE` 对异常值比 `RMSE` 更不敏感。


    上述指标的问题在于，它们对模型中额外变量的纳入很敏感，即使这些变量对解释结果没有显著贡献。换句话说，在模型中加入额外变量总会增加 `R2` 并降低 `RMSE`。因此，我们需要一个更稳健的指标来指导模型选择。


    关于 `R2`，有一个调整版本，称为 `Adjusted R-squared`，它对模型中变量过多进行了调整。


    此外，还有另外四个重要指标 - `AIC`、`AICc`、`BIC` 和 `Mallows Cp` - 常用于模型评估和选择。这些是模型预测误差 `MSE`
    的无偏估计。指标越低，模型越好。


    1.  `AIC` 代表 (`Akaike’s Information Criteria`)，由日本统计学家 Hirotugu Akaike 于 1970
    年开发的指标。`AIC` 的基本思想是对模型中纳入额外变量进行惩罚。它在加入额外项时会增加误差惩罚。`AIC` 越低，模型越好。


    2.  `AICc` 是针对小样本量校正的 `AIC` 版本。


    3.  `BIC`（或 `Bayesian information criteria`）是 `AIC` 的变体，对纳入额外变量的惩罚更强。


    4.  `Mallows Cp`：由 Colin Mallows 开发的 `AIC` 变体。


    通常，最常用的指标，用于衡量回归模型质量和比较模型，是：`Adjusted R2`、`AIC`、`BIC` 和 `Cp`。


    在以下各节中，我们将向你展示如何计算上述提及的指标。


    ## 13.3 加载所需的 R 包


    *   `tidyverse` 用于数据操作和可视化

    *   `modelr` 提供计算回归模型性能指标的辅助函数

    *   `broom` 轻松创建包含模型统计指标的整洁数据框


    ```

    ```


