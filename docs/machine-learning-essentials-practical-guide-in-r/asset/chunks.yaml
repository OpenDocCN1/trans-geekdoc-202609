    \ 来确定，该度量对预测变量测量所采用的尺度非常敏感。因此，通常建议对预测变量进行标准化（即归一化），以使其尺度具有可比性。\n\n以下各节介绍如何为分类和回归设置构建\
    \ k-近邻预测模型。\n\n## 32.3 加载所需的 R 包\n\n*   `tidyverse` 用于轻松的数据操作和可视化\n*   `caret`\
    \ 用于轻松的机器学习工作流\n\n```\n```\n\n## 32.4 分类\n\n### 32.4.1 数据集示例\n\n数据集：`PimaIndiansDiabetes2`\
    \ [在 `mlbench` 包中]，在第 21 章中介绍过，用于基于多个临床变量预测患糖尿病的概率。\n\n我们将随机将数据拆分为训练集（80% 用于构建预测模型）和测试集（20%\
    \ 用于评估模型）。请确保设置种子以保证可重复性。\n\n```\n```\n\n### 32.4.2 计算 KNN 分类器\n\n我们将使用 `caret`\
    \ 包，它会自动测试不同的 k 值，然后选择使交叉验证（\"cv\"）误差最小的最优 k，并拟合最终的最佳 KNN 模型以最好地解释我们的数据。\n\n此外，`caret`\
    \ 还可以自动预处理数据以归一化预测变量。\n\n我们将在函数 `train()` 中使用以下参数：\n\n*   `trControl` ，用于设置 10\
    \ 折交叉验证\n*   `preProcess` ，用于归一化数据\n*   `tuneLength` ，用于指定要评估的可能 k 值数量\n\n```\n\
    ```\n\n![](img/Image00031.jpg)\n\n```\n```\n\n```\n##    k\n## 5 13\n```\n\n```\n\
