- raw: "Ridge regression will perform better when the outcome is a function of many\
    \ predictors, all with coefficients of roughly equal size (James et al. [2014](#text00039.html#ref-james2014)\
    \ ) .\n\nCross-validation methods can be used for identifying which of these two\
    \ techniques is better on a particular data set.\n\n### 19.2.3 Elastic Net\n\n\
    Elastic Net produces a regression model that is penalized with both the **L1-norm**\
    \ and **L2-norm** . The consequence of this is to effectively shrink coefficients\
    \ (like in ridge regression) and to set some coefficients to zero (as in LASSO).\n\
    \n## 19.3 Loading required R packages\n\n*   `tidyverse` for easy data manipulation\
    \ and visualization\n\n*   `caret` for easy machine learning workflow\n\n*   `glmnet`\
    \ , for computing penalized regression\n\n```\n\n```\n\n## 19.4 Preparing the\
    \ data\n\nWe'll use the `Boston` data set [in `MASS` package], introduced in Chapter\
    \ [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for predicting the median house value\
    \ (`mdev` ), in Boston Suburbs, based on multiple predictor variables.\n\nWe’ll\
    \ randomly split the data into training set (80% for building a predictive model)\
    \ and test set (20% for evaluating the model). Make sure to set seed for reproducibility.\n\
    \n```\n\n```\n\n## 19.5 Computing penalized linear regression\n\n### 19.5.1 Additional\
    \ data preparation\n\nYou need to create two objects:\n\n*   `y` for storing the\
    \ outcome variable\n\n*   `x` for holding the predictor variables. This should\
    \ be created using the function `model.matrix()` allowing to automatically transform\
    \ any qualitative variables (if any) into dummy variables (Chapter [6](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ), which is important because glmnet() can only take numerical, quantitative\
    \ inputs. After creating the model matrix, we remove the intercept component at\
    \ index = 1.\n\n```\n\n```\n\n### 19.5.2 R functions\n\nWe'll use the R function\
    \ `glmnet()` [glmnet package] for computing penalized linear regression models.\n\
    \nThe simplified format is as follow:\n\n```\n\n```\n\n*   `x` : matrix of predictor\
    \ variables\n\n*   `y` : the response or outcome variable, which is a binary variable.\n\
    \n*   `alpha` : the elasticnet mixing parameter. Allowed values include: \n\n\
    \    *   \"1\": for lasso regression\n\n    *   \"0\": for ridge regression\n\n\
    \    *   a value between 0 and 1 (say 0.3) for elastic net regression.\n\n*  \
    \ `lamba` : a numeric value defining the amount of shrinkage. Should be specify\
    \ by analyst.\n\nIn penalized regression, you need to specify a constant `lambda`\
    \ to adjust the amount of the coefficient shrinkage. The best `lambda` for your\
    \ data, can be defined as the `lambda` that minimize the cross-validation prediction\
    \ error rate. This can be determined automatically using the function `cv.glmnet()`\
    \ .\n\nIn the following sections, we start by computing ridge, lasso and elastic\
    \ net regression models. Next, we'll compare the different models in order to\
    \ choose the best one for our data.\n\nThe best model is defined as the model\
    \ that has the lowest prediction error, RMSE (Chapter [13](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ).\n\n### 19.5.3 Computing ridge regression\n\n```\n\n```\n\n```\n## [1] 0.758\n\
    ```\n\n```\n\n```\n\n```\n## 14 x 1 sparse Matrix of class \"dgCMatrix\"\n## \
    \                   s0\n## (Intercept)  28.69633\n## crim         -0.07285\n##\
    \ zn            0.03417\n## indus        -0.05745\n## chas          2.49123\n\
    ## nox         -11.09232\n## rm            3.98132\n## age          -0.00314\n\
    ## dis          -1.19296\n## rad           0.14068\n## tax          -0.00610\n\
    ## ptratio      -0.86400\n## black         0.00937\n## lstat        -0.47914\n\
    ```\n\n```\n\n```\n\n```\n##   RMSE Rsquare\n## 1 4.98   0.671\n```\n\nNote that\
    \ by default, the function glmnet() standardizes variables so that their scales\
    \ are comparable. However, the coefficients are always returned on the original\
    \ scale.\n\n### 19.5.4 Computing lasso regression\n\nThe only difference between\
    \ the R code used for ridge regression is that, for lasso regression you need\
    \ to specify the argument `alpha = 1` instead of `alpha = 0` (for ridge regression).\n\
