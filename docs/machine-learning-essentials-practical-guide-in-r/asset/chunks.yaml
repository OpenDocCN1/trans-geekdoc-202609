    \ 算法将所有其他变量的系数设为零，从而降低了模型的复杂度。\n\n将 `lambda = lambda.1se` 设置为模型会比使用 `lambda.min`\
    \ 产生更简单的模型，但该模型的准确性可能比使用 `lambda.min` 获得的模型稍差一些。\n\n在下一节中，我们将使用 `lambda.min` 计算最终模型，然后评估模型在测试数据上的准确性。我们还将讨论使用\
    \ `lambda = lambda.1se` 拟合模型所获得的结果。\n\n### 计算最终的 lasso 模型\n\n* 使用 `lambda.min`\
    \ 计算最终模型：\n\n```\n## [1] 0.769\n```\n\n* 使用 `lambda.1se` 计算最终模型：\n\n```\n## [1]\
    \ 0.705\n```\n\n在下一节中，我们将比较 lasso 回归获得的准确性与使用完整逻辑回归模型（包含所有预测变量）获得的准确性。\n\n####\
    \ 24.4.5 计算完整的逻辑模型\n\n```\n## [1] 0.808\n```\n\n## 24.5 讨论\n\n本章介绍了如何在 R 中计算惩罚逻辑回归模型。在这里，我们专注于\
    \ lasso 模型，但你也可以通过在 `glmnet()` 函数中使用 `alpha = 0` 来拟合岭回归。对于弹性网络回归，你需要在 0 和 1 之间选择一个\
    \ alpha 值。这可以使用 `caret` 包自动完成。参见第 19 章。\n\n我们的分析表明，使用 `lambda.min` 作为最佳 lambda\
    \ 的 lasso 回归，与完整的逻辑模型相比，在测试数据上的模型性能没有受到太大影响的情况下，得到了更简单的模型。\n\n我们使用 `lambda.1se`\
    \ 获得的模型准确性略低于使用所有预测变量（n = 8）的更复杂模型或使用 lasso 回归中的 `lambda.min` 所获得的准确性。即使使用 `lambda.1se`，获得的准确性仍然足够好，同时模型也更简单。\n\
    \n这意味着，使用 lasso 回归获得的更简单模型在拟合数据信息方面至少与更复杂的模型一样好。根据偏差-方差权衡，在其他条件相同的情况下，更简单的模型应始终优先考虑，因为它不太可能过度拟合训练数据。\n\
    \n对于变量选择，惩罚逻辑回归技术的替代方案是第 23 章中描述的逐步逻辑回归。\n\n# 25 Logistic Regression Assumptions\
    \ and Diagnostics\n\n## 25.1 引言\n\n`logistic regression` 模型对数据做出若干 `assumptions`。\n\
    \n本章描述了主要假设，并提供了在 R 中实践指南，以检查这些假设是否对你的数据成立，这对于建立一个良好的模型至关重要。\n\n请确保你已阅读第 22 章中的逻辑回归基础知识。\n\
    \n## 25.2 逻辑回归假设\n\n逻辑回归方法假设：\n\n* 结果是一个二元或二分变量，如是 vs 否，阳性 vs 阴性，1 vs 0。\n* 结果的对数几率与每个预测变量之间存在线性关系。请记住，对数几率函数为\
    \ `logit(p) = log(p/(1-p))`，其中 p 是结果的概率（参见第 22 章）。\n* 连续预测变量中没有有影响的值（极值或异常值）\n\
    * 预测变量之间不存在高度相关性（即多重共线性）。\n\n为了提高模型的准确性，你应确保这些假设对你的数据成立。在以下各节中，我们将描述如何诊断数据中的潜在问题。\n\
    \n## 25.3 加载所需的 R 包\n\n* `tidyverse` 用于轻松的数据操作和可视化\n* `broom`：从统计检验结果创建整洁的数据框\n\
    \n## 25.4 建立逻辑回归模型\n\n我们首先使用 `PimaIndiansDiabetes2` `mlbench` 包计算一个逻辑回归模型的示例，该包在第\
    \ 21 章中介绍，用于基于临床变量预测糖尿病检测阳性的概率。\n\n```\n##     4     5     7     9    14    15\
    \ \n## \"neg\" \"pos\" \"neg\" \"pos\" \"pos\" \"pos\"\n```\n\n## 25.5 逻辑回归诊断\n\
    \n### 25.5.1 线性假设\n\n在这里，我们将检查连续预测变量与结果对数几率之间的线性关系。这可以通过目视检查每个预测变量与对数几率值之间的散点图来完成。\n\
    \n1. 从原始数据框中删除定性变量并将对数几率值绑定到数据：\n\n2. 创建散点图：\n\n![](img/Image00021.jpg)\n\n平滑的散点图显示变量\
    \ `glucose`、`mass`、`pregnant`、`pressure` 和 `triceps` 都与对数几率尺度上的糖尿病结果相当线性相关。\n\n\
    变量 `age` 和 `pedigree` 不是线性的，可能需要一些转换。如果散点图显示非线性，你需要其他方法来建立模型，例如包含 2 或 3 次幂项、分段多项式和样条函数（第\
    \ 7 章）。\n\n### 25.5.2 有影响的值\n\n有影响的值是可能改变逻辑回归模型质量的极端个体数据点。\n\n数据中最极端的值可以通过可视化\
    \ Cook 距离值来检查。在这里我们标记了最大的前 3 个值：\n\n![](img/Image00022.jpg)\n\n请注意，并非所有异常值都是有影响的观测值。为了检查数据是否包含潜在的有影响观测值，可以检查标准化残差误差。绝对标准化残差大于\
    \ 3 的数据点代表可能的异常值，可能值得更密切关注。\n\n以下 R 代码使用 `broom` 包的 `augment()` R 函数计算标准化残差（`.std.resid`）和\
    \ Cook 距离（`.cooksd`）。\n\n根据 Cook 距离，可以按如下方式显示最大的前 3 个值的数据：\n\n绘制标准化残差：\n\n![](img/Image00023.jpg)\n\
    \n筛选具有 `abs(.std.res) > 3` 的潜在有影响数据点：\n\n我们的数据中没有有影响的观测值。\n\n当连续预测变量中存在异常值时，可能的解决方案包括：\n\
    \n* 删除相关记录\n* 将数据转换为对数尺度\n* 使用非参数方法\n\n### 25.5.3 多重共线性\n\n"
