  trans: "\n\n你也可以拟合 *广义加性模型*（第 7 章），当预测变量的线性关系无法假设时。这可以使用 `mgcv` 包完成：\n\n```\n\n\
    Logistic 回归仅限于两类分类问题。有一个扩展，称为 *多项 logistic 回归*，用于多类分类问题（第 26 章）。\n\n请注意，对于多类任务，最流行的方法是\
    \ *线性判别分析*（第 27 章）。\n\n# 23 逐步 Logistic 回归\n\n**逐步 logistic 回归** 包括自动选择较少的预测变量数量来构建性能最佳的\
    \ logistic 回归模型。更多内容请阅读第 18 章。\n\n本章描述如何在 **R** 中计算逐步 logistic 回归。\n\n## 23.1\
    \ 加载所需的 R 包\n\n* `tidyverse` 用于便捷的数据操作和可视化\n* `caret` 用于便捷的机器学习工作流\n\n```\n\n\
    ## 23.2 准备数据\n\n数据集：`PimaIndiansDiabetes2` [在 `mlbench` 包中]，在第 21 章中介绍，用于基于多个临床变量预测患糖尿病的概率。\n\
    \n我们将随机将数据拆分为训练集（80% 用于构建预测模型）和测试集（20% 用于评估模型）。请确保设置种子以保证可重复性。\n\n```\n\n## 23.3\
    \ 计算逐步 logistic 回归\n\n逐步 logistic 回归可以使用 `MASS` 包中提供的 R 函数 `stepAIC()` 轻松计算。它通过\
    \ AIC 进行模型选择。它有一个名为 `direction` 的选项，可以具有以下值：“both”、“forward”、“backward”（参见第 18\
    \ 章）。\n\n### 23.3.1 快速入门 R 代码\n\n```\n\n### 23.3.2 完整 logistic 回归模型\n\n包含所有预测变量的完整模型：\n\
    \n```\n\n```\n## (Intercept)    pregnant     glucose    pressure     triceps \
    \    insulin \n##    -9.50372     0.04571     0.04230    -0.00700     0.01858\
    \    -0.00159 \n##        mass    pedigree         age \n##     0.04502     0.96845\
    \     0.04256\n```\n\n### 23.3.3 执行逐步变量选择\n\n选择最具贡献的变量：\n\n```\n\n```\n## (Intercept)\
    \     glucose        mass    pedigree         age \n##     -9.5612      0.0379\
    \      0.0523      0.9697      0.0529\n```\n\n该函数选择了一个最终模型，其中一个变量已从原始完整模型中移除。被剔除的预测变量是：`triceps`。\n\
    \n### 23.3.4 比较完整模型和逐步模型\n\n在这里，我们将比较完整和逐步 logistic 模型的性能。最佳模型定义为在预测新测试数据的类别时分类错误率最低的模型：\n\
    \n完整 logistic 回归模型的预测准确率：\n\n```\n\n```\n## [1] 0.808\n```\n\n逐步 logistic 回归模型的预测准确率：\n\
    \n```\n\n```\n## [1] 0.795\n```\n\n## 23.4 讨论\n\n本章描述了如何在 R 中执行逐步 logistic 回归。在我们的示例中，逐步回归选择了较少的预测变量数量，得到了一个最终模型，其性能与完整模型相似。\n\
    \n因此，逐步选择降低了模型的复杂性而没有损害其准确性。请注意，在其他条件相同的情况下，我们始终应选择更简单的模型，这里是逐步回归返回的最终模型。\n\n\
    另一种用于模型选择的逐步方法替代方案是惩罚回归方法（第 24 章），它对模型拥有过多变量进行惩罚。\n\n# 24 惩罚 Logistic 回归\n\n##\
    \ 24.1 引言\n\n当你的 logistic 回归模型中有多个变量时，找到一个变量的减少集合以获得最优性能的模型可能是有用的（参见第 19 章）。\n\
    \n**惩罚 logistic 回归** 对 logistic 模型拥有过多变量施加惩罚。这会导致将贡献较小的变量的系数收缩至零。这也称为 **正则化**。\n\
    \n最常用的惩罚回归包括：\n\n* **岭回归**：贡献较小的变量其系数接近于零。然而，所有变量都被纳入模型。这在根据领域知识需要将所有变量纳入模型时很有用。\n\
    * **lasso 回归**：一些贡献较小的变量的系数被强制为恰好为零。仅最显著的变量保留在最终模型中。\n* **弹性网络回归**：岭回归和 lasso\
    \ 回归的组合。它将一些系数收缩至零（像岭回归）并将一些系数设为恰好为零（像 lasso 回归）\n\n本章描述如何计算惩罚 logistic 回归，例如\
    \ lasso 回归，以自动选择包含最具贡献预测变量的最优模型。\n\n## 24.2 加载所需的 R 包\n\n* `tidyverse` 用于便捷的数据操作和可视化\n\
    * `caret` 用于便捷的机器学习工作流\n* `glmnet`，用于计算惩罚回归\n\n```\n\n## 24.3 准备数据\n\n数据集：`PimaIndiansDiabetes2`\
    \ [在 `mlbench` 包中]，在第 21 章中介绍，用于基于多个临床变量预测患糖尿病的概率。\n\n我们将随机将数据拆分为训练集（80% 用于构建预测模型）和测试集（20%\
    \ 用于评估模型）。请确保设置种子以保证可重复性。\n\n```\n\n## 24.4 计算惩罚 logistic 回归\n\n### 24.4.1 额外的数据准备\n\
    \nR 函数 `model.matrix()` 有助于创建预测变量矩阵，并自动将分类预测变量转换为适当的哑变量，这对于 `glmnet()` 函数是必需的。\n\
    \n```\n\n### 24.4.2 R 函数\n\n我们将使用 R 函数 `glmnet()` [glmnet 包] 来计算惩罚 logistic 回归。\n\
    \n简化格式如下：\n\n```\n\n* `x`：预测变量矩阵\n* `y`：响应或结果变量，是一个二元变量。\n* `family`：响应类型。对于二元结果变量使用\
    \ \"binomial\"\n* `alpha`：弹性网络混合参数。允许的值包括：\n  * \"1\"：用于 lasso 回归\n  * \"0\"：用于岭回归\n\
    \  * 0 到 1 之间的值（例如 0.3）用于弹性网络回归。\n* `lamba`：定义收缩量的数值。应由分析师指定。\n\n在惩罚回归中，你需要指定一个常数\
    \ `lambda` 来调整系数收缩的量。数据的最佳 `lambda` 可以定义为使交叉验证预测错误率最小化的 `lambda`。这可以使用函数 `cv.glmnet()`\
    \ 自动确定。\n\n在下面的 R 代码中，我们将展示如何通过指定选项 `alpha = 1` 来计算 lasso 回归。你也可以尝试使用 `alpha =\
    \ 0` 的岭回归，看看哪种更适合你的数据。\n\n### 24.4.3 快速入门 R 代码\n\n拟合 lasso 惩罚回归模型：\n\n```\n\n\
    ### 24.4.4 计算 lasso 回归\n\n**找到使交叉验证误差最小化的 lambda 的最优值**：\n\n```\n\n![](img/Image00020.jpg)\n\
    \n该图显示了交叉验证误差随 lambda 的对数的变化。左侧的虚线垂直线表明 lambda 的对数的最优值约为 -5，这是使预测误差最小化的值。此 lambda\
    \ 值将给出最准确的模型。`lambda` 的精确值可以如下查看：\n\n```\n\n```\n## [1] 0.00871\n```\n\n"
