- raw: "Note that, by default (argument importance = FALSE), randomForest only calculates\
    \ the Gini impurity index. However, computing the model accuracy by variable (argument\
    \ importance = TRUE) requires supplementary computations which might be time consuming\
    \ in the situations, where thousands of models (trees) are being fitted.\n\nVariables\
    \ importance measures can be plotted using the function `varImpPlot()` [randomForest\
    \ package]:\n\n```\n\n```\n\n![](Image00039.jpg)![](Image00040.jpg)\n\nThe results\
    \ show that across all of the trees considered in the random forest, the glucose\
    \ and age variables are the two most important variables.\n\nThe function `varImp()`\
    \ [in caret] displays the importance of variables in percentage:\n\n```\n\n```\n\
    \n```\n## rf variable importance\n## \n##          Importance\n## glucose    \
    \   100.0\n## age            33.5\n## pregnant       19.0\n## mass           16.2\n\
    ## triceps        15.4\n## pedigree       12.8\n## insulin        11.2\n## pressure\
    \        0.0\n```\n\n## 34.4 Regression\n\nSimilarly, you can build a random forest\
    \ model to perform regression, that is to predict a continuous variable.\n\n###\
    \ 34.4.1 Example of data set\n\nWe'll use the `Boston` data set [in `MASS` package],\
    \ introduced in Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for predicting\
    \ the median house value (`mdev` ), in Boston Suburbs, using different predictor\
    \ variables.\n\nRandomly split the data into training set (80% for building a\
    \ predictive model) and test set (20% for evaluating the model).\n\n```\n\n```\n\
    \n### 34.4.2 Computing random forest regression trees\n\nHere the prediction error\
    \ is measured by the RMSE, which corresponds to the average difference between\
    \ the observed known values of the outcome and the predicted value by the model.\
    \ RMSE is computed as `RMSE = mean((observeds - predicteds)^2) %>% sqrt()` . The\
    \ lower the RMSE, the better the model.\n\n```\n\n```\n\n## 34.5 Hyperparameters\n\
    \nNote that, the random forest algorithm has a set of hyperparameters that should\
    \ be tuned using cross-validation to avoid overfitting.\n\nThese include:\n\n\
    *   `nodesize` : Minimum size of terminal nodes. Default value for classification\
    \ is 1 and default for regression is 5.\n\n*   `maxnodes` : Maximum number of\
    \ terminal nodes trees in the forest can have. If not given, trees are grown to\
    \ the maximum possible (subject to limits by nodesize).\n\nIgnoring these parameters\
    \ might lead to overfitting on noisy data set (P. Bruce and Bruce [2017](#text00039.html#ref-bruce2017)\
    \ ) . Cross-validation can be used to test different values, in order to select\
    \ the optimal value.\n\nHyperparameters can be tuned manually using the `caret`\
    \ package. For a given parameter, the approach consists of fitting many models\
    \ with different values of the parameters and then comparing the models.\n\nThe\
    \ following example tests different values of `nodesize` using the `PimaIndiansDiabetes2`\
    \ data set for classification:\n\n(This will take 1-2 minutes execution time)\n\
    \n```\n\n```\n\n```\n## \n## Call:\n## summary.resamples(object = ., metric =\
    \ \"Accuracy\")\n## \n## Models: 1, 2, 4, 8 \n## Number of resamples: 10 \n##\
    \ \n## Accuracy \n##    Min. 1st Qu. Median  Mean 3rd Qu.  Max. NA's\n## 1 0.692\
    \   0.750  0.785 0.793   0.840 0.897    0\n## 2 0.692   0.744  0.808 0.788   0.841\
    \ 0.850    0\n## 4 0.692   0.744  0.795 0.786   0.825 0.846    0\n## 8 0.692 \
    \  0.750  0.808 0.796   0.841 0.897    0\n```\n\nIt can be seen that, using a\
    \ `nodesize` value of 2 or 8 leads to the most median accuracy value.\n\n## 34.6\
    \ Discussion\n\nThis chapter describes the basics of bagging and random forest\
    \ machine learning algorithms. We also provide practical examples in R for classification\
    \ and regression analyses.\n\nAnother alternative to bagging and random forest\
    \ is boosting (Chapter [35](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\n# 35 Boosting\n\
    \nPreviously, we have described bagging and random forest machine learning algorithms\
    \ for building a powerful predictive model (Chapter [34](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ).\n\nRecall that bagging consists of taking multiple subsets of the training\
    \ data set, then building multiple independent decision tree models, and then\
    \ average the models allowing to create a very performant predictive model compared\
    \ to the classical CART model (Chapter [33](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ).\n\nThis chapter describes an alternative method called **boosting** , which\
    \ is similar to the bagging method, except that the trees are grown sequentially:\
    \ each successive tree is grown using information from previously grown trees,\
    \ with the aim to minimize the error of the previous models (James et al. [2014](#text00039.html#ref-james2014)\
    \ ) .\n\nFor example, given a current regression tree model, the procedure is\
    \ as follow:\n\n1.  Fit a decision tree using the model residual errors as the\
    \ outcome variable.\n\n2.  Add this new decision tree, adjusted by a shrinkage\
    \ parameter `lambda` , into the fitted function in order to update the residuals.\
    \ lambda is a small positive value, typically comprised between 0.01 and 0.001\
    \ (James et al. [2014](#text00039.html#ref-james2014) ) .\n\nThis approach results\
    \ in slowly and successively improving the fitted the model resulting a very performant\
    \ model. Boosting has different tuning parameters including:\n\n*   The number\
    \ of trees B\n\n*   The shrinkage parameter lambda\n\n*   The number of splits\
    \ in each tree.\n\nThere are different variants of boosting, including *Adaboost*\
    \ , *gradient boosting* and *stochastic gradient boosting* .\n\nStochastic gradient\
    \ boosting, implemented in the R package *xgboost* , is the most commonly used\
    \ boosting technique, which involves resampling of observations and columns in\
    \ each round. It offers the best performance. xgboost stands for extremely gradient\
    \ boosting.\n\nBoosting can be used for both classification and regression problems.\n\
    \nIn this chapter we'll describe how to compute boosting in R.\n\n## 35.1 Loading\
    \ required R packages\n\n*   `tidyverse` for easy data manipulation and visualization\n\
    \n*   `caret` for easy machine learning workflow\n\n*   `xgboost` for computing\
    \ boosting algorithm\n\n```\n\n```\n\n## 35.2 Classification\n\n### 35.2.1 Example\
    \ of data set\n\nData set: `PimaIndiansDiabetes2` [in `mlbench` package], introduced\
    \ in Chapter [21](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for predicting the probability\
    \ of being diabetes positive based on multiple clinical variables.\n\nRandomly\
    \ split the data into training set (80% for building a predictive model) and test\
    \ set (20% for evaluating the model). Make sure to set seed for reproducibility.\n\
    \n```\n\n```\n\n### 35.2.2 Boosted classification trees\n\nWe'll use the `caret`\
    \ workflow, which invokes the `xgboost` package, to automatically adjust the model\
    \ parameter values, and fit the final best boosted tree that explains the best\
    \ our data.\n\nWe'll use the following arguments in the function `train()` :\n\
    \n*   `trControl` , to set up 10-fold cross validation\n\n```\n\n```\n\n```\n\
    ##    nrounds max_depth eta gamma colsample_bytree min_child_weight subsample\n\
    ## 18     150         1 0.3     0              0.8                1         1\n\
    ```\n\n```\n\n```\n\n```\n## [1] neg pos neg neg pos neg\n## Levels: neg pos\n\
    ```\n\n```\n\n```\n\n```\n## [1] 0.744\n```\n\nThe prediction accuracy on new\
    \ test data is 74%, which is good.\n\nFor more explanation about the boosting\
    \ tuning parameters, type `?xgboost` in R to see the documentation.\n\n### 35.2.3\
    \ Variable importance\n\nThe function `varImp()` [in caret] displays the importance\
    \ of variables in percentage:\n\n```\n\n```\n\n```\n## xgbTree variable importance\n\
    ## \n##          Overall\n## glucose   100.00\n## mass       20.23\n## pregnant\
    \   15.83\n## insulin    13.15\n## pressure    9.51\n## triceps     8.18\n## pedigree\
    \    0.00\n## age         0.00\n```\n\n## 35.3 Regression\n\nSimilarly, you can\
    \ build a random forest model to perform regression, that is to predict a continuous\
    \ variable.\n\n### 35.3.1 Example of data set"
