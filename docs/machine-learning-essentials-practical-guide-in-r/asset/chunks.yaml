    \    0.04230    0.00657   6.439 1.20e-10\n## pressure    -0.00700    0.01291 \
    \ -0.542 5.87e-01\n## triceps      0.01858    0.01861   0.998 3.18e-01\n## insulin\
    \     -0.00159    0.00139  -1.144 2.52e-01\n## mass         0.04502    0.02887\
    \   1.559 1.19e-01\n## pedigree     0.96845    0.46020   2.104 3.53e-02\n## age\
    \          0.04256    0.02158   1.972 4.86e-02\n```\n\nFrom the output above,\
    \ the coefficients table shows the beta coefficient estimates and their significance\
    \ levels. Columns are:\n\n* `Estimate` : the intercept `b0` and the beta coefficient\
    \ estimates associated to each predictor variable\n* `Std.Error` : the standard\
    \ error of the coefficient estimates. This represents the accuracy of the coefficients.\
    \ The larger the standard error, the less confident we are about the estimate.\n\
    * `z value` : the z-statistic, which is the coefficient estimate `column 2` divided\
    \ by the standard error of the estimate `column 3`\n* `Pr(>|z|)` : The p-value\
    \ corresponding to the z-statistic. The smaller the p-value, the more significant\
    \ the estimate is.\n\nNote that, the functions `coef()` and `summary()` can be\
    \ used to extract only the coefficients, as follow:\n\n## 22.6 Interpretation\n\
    \nIt can be seen that only 5 out of the 8 predictors are significantly associated\
    \ to the outcome. These include: `pregnant`, `glucose`, `pressure`, `mass` and\
    \ `pedigree`.\n\nThe coefficient estimate of the variable `glucose` is `b = 0.045`,\
    \ which is positive. This means that an increase in glucose is associated with\
    \ increase in the probability of being diabetes-positive. However the coefficient\
    \ for the variable `pressure` is `b = -0.007`, which is negative. This means that\
    \ an increase in blood pressure will be associated with a decreased probability\
    \ of being diabetes-positive.\n\nAn important concept to understand, for interpreting\
    \ the logistic beta coefficients, is the `odds ratio`. An odds ratio measures\
    \ the association between a predictor variable `x` and the outcome variable `y`.\
    \ It represents the ratio of the odds that an event will occur `event = 1` given\
    \ the presence of the predictor `x` `x = 1`, compared to the odds of the event\
    \ occurring in the absence of that predictor `x = 0`.\n\nFor a given predictor\
    \ `say x1`, the associated beta coefficient `b1` in the logistic regression function\
    \ corresponds to the log of the odds ratio for that predictor.\n\nIf the odds\
    \ ratio is 2, then the odds that the event occurs `event = 1` are two times higher\
    \ when the predictor `x` is present `x = 1` versus `x = 0`.\n\nFor example, the\
    \ regression coefficient for glucose is 0.042. This indicate that one unit increase\
    \ in the glucose concentration will increase the odds of being diabetes-positive\
    \ by `exp(0.042)` 1.04 times.\n\nFrom the logistic regression results, it can\
    \ be noticed that some variables - `triceps`, `insulin` and `age` - are not statistically\
    \ significant. Keeping them in the model may contribute to overfitting. Therefore,\
    \ they should be eliminated. This can be done automatically using statistical\
    \ techniques, including `stepwise regression` and `penalized regression` methods.\
    \ This methods are described in the next section. Briefly, they consist of selecting\
    \ an optimal model with a reduced set of variables, without compromising the model\
    \ curacy.\n\nHere, as we have a small number of predictors `n = 9`, we can select\
    \ manually the most significant:\n\n## 22.7 Making predictions\n\nWe'll make predictions\
    \ using the test data in order to evaluate the performance of our logistic regression\
    \ model.\n\nThe procedure is as follow:\n\n1. Predict the class membership probabilities\
    \ of observations based on predictor variables\n2. Assign the observations to\
    \ the class with highest probability score `i.e above 0.5`\n\nThe R function `predict()`\
    \ can be used to predict the probability of being diabetes-positive, given the\
    \ predictor values.\n\n**Predict the probabilities** of being diabetes-positive:\n\
    \n```\n##     21     25     28     29     32     36 \n## 0.3914 0.6706 0.0501\
    \ 0.5735 0.6444 0.1494\n```\n\nWhich classes do these probabilities refer to?\
    \ In our example, the output is the probability that the diabetes test will be\
    \ positive. We know that these values correspond to the probability of the test\
    \ to be positive, rather than negative, because the `contrasts()` function indicates\
    \ that R has created a dummy variable with a 1 for \"pos\" and \"0\" for neg.\
    \ The probabilities always refer to the class dummy-coded as \"1\".\n\nCheck the\
    \ dummy coding:\n\n```\n##     pos\n## neg   0\n## pos   1\n```\n\n**Predict the\
    \ class of individuals** :\n\nThe following R code categorizes individuals into\
    \ two groups based on their predicted probabilities `p` of being diabetes-positive.\
    \ Individuals, with `p` above 0.5 `random guessing`, are considered as diabetes-positive.\n\
    \n```\n##    21    25    28    29    32    36 \n## \"neg\" \"pos\" \"neg\" \"\
    pos\" \"pos\" \"neg\"\n```\n\n## 22.8 Assessing model accuracy\n\nThe model accuracy\
    \ is measured as the proportion of observations that have been correctly classified.\
    \ Inversely, the classification error is defined as the proportion of observations\
    \ that have been misclassified.\n\nProportion of correctly classified observations:\n\
    \n```\n## [1] NA\n```\n\nThe classification prediction accuracy is about 77%,\
    \ which is good. The misclassification error rate is 23%.\n\nNote that, there\
    \ are several metrics for evaluating the performance of a classification model\
    \ `Chapter 30`.\n\n## 22.9 Discussion\n\nIn this chapter, we have described how\
    \ logistic regression works and we have provided R codes to compute logistic regression.\
    \ Additionally, we demonstrated how to make predictions and to assess the model\
    \ accuracy. Logistic regression model output is very easy to interpret compared\
    \ to other classification methods. Additionally, because of its simplicity it\
    \ is less prone to overfitting than flexible methods such as decision trees.\n\
    \nNote that, many concepts for linear regression hold true for the logistic regression\
    \ modeling. For example, you need to perform some diagnostics `Chapter 25` to\
    \ make sure that the assumptions made by the model are met for your data.\n\n\
    Furthermore, you need to measure how good the model is in predicting the outcome\
    \ of new test data observations. Here, we described how to compute the raw classification\
    \ accuracy, but not that other important performance metric exists `Chapter 30`\n\
    \nIn a situation, where you have many predictors you can select, without compromising\
    \ the prediction accuracy, a minimal list of predictor variables that contribute\
    \ the most to the model using `stepwise regression` `Chapter 23` and `lasso regression`\
    \ techniques `Chapter 24`.\n\nAdditionally, you can add interaction terms in the\
    \ model, or include spline terms.\n\nThe same problems concerning confounding\
    \ and correlated variables apply to logistic regression `see Chapter 11` and `Chapter\
    \ 10`.\n\n"
