    ), you need to evaluate the goodness of the model, that is how well the model
    fits the training data used to build the model and how accurate is the model in
    predicting the outcome for new unseen test observations.


    In this part, you''ll learn techniques for assessing regression model accuracy
    and for validating the performance of the model. We''ll also provide practical
    examples in R.


    The following chapters are covered:


    *   Regression Model Accuracy Metrics (Chapter [13](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)
    ) for measuring the performance of a regression model.


    *   Cross-validation (Chapter [14](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ) and bootstrap
    resampling (Chapter [15](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ) for validating
    the model on a test data.


    # 13 Regression Model Accuracy Metrics


    ## 13.1 Introduction


    In this chapter we''ll describe different statistical regression **metrics** for
    measuring the performance of a regression model (Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)
    ).


    Next, we''ll provide practical examples in R for comparing the performance of
    two models in order to select the best one for our data.


    ## 13.2 Model performance metrics


    In regression model, the most commonly known evaluation metrics include:


    1.  **R-squared** (R2), which is the proportion of variation in the outcome that
    is explained by the predictor variables. In multiple regression models, R2 corresponds
    to the squared correlation between the observed outcome values and the predicted
    values by the model. The Higher the R-squared, the better the model.


    2.  **Root Mean Squared Error** (RMSE), which measures the average error performed
    by the model in predicting the outcome for an observation. Mathematically, the
    RMSE is the square root of the *mean squared error (MSE)* , which is the average
    squared difference between the observed actual outome values and the values predicted
    by the model. So, `MSE = mean((observeds - predicteds)^2)` and `RMSE = sqrt(MSE`
    ). The lower the RMSE, the better the model.


    3.  **Residual Standard Error** (RSE), also known as the *model sigma* , is a
    variant of the RMSE adjusted for the number of predictors in the model. The lower
    the RSE, the better the model. In practice, the difference between RMSE and RSE
    is very small, particularly for large multivariate data.


    4.  **Mean Absolute Error** (MAE), like the RMSE, the MAE measures the prediction
    error. Mathematically, it is the average absolute difference between observed
    and predicted outcomes, `MAE = mean(abs(observeds - predicteds))` . MAE is less
    sensitive to outliers compared to RMSE.


    The problem with the above metrics, is that they are sensible to the inclusion
    of additional variables in the model, even if those variables dont have significant
    contribution in explaining the outcome. Put in other words, including additional
    variables in the model will always increase the R2 and reduce the RMSE. So, we
    need a more robust metric to guide the model choice.


    Concerning R2, there is an adjusted version, called **Adjusted R-squared** , which
    adjusts the R2 for having too many variables in the model.


    Additionally, there are four other important metrics - **AIC** , **AICc** , **BIC**
    and **Mallows Cp** - that are commonly used for model evaluation and selection.
    These are an unbiased estimate of the model prediction error MSE. The lower these
    metrics, he better the model.


    1.  **AIC** stands for (*Akaike’s Information Criteria* ), a metric developped
    by the Japanese Statistician, Hirotugu Akaike, 1970. The basic idea of AIC is
    to penalize the inclusion of additional variables to a model. It adds a penalty
    that increases the error when including additional terms. The lower the AIC, the
    better the model.


    2.  **AICc** is a version of AIC corrected for small sample sizes.


    3.  **BIC** (or *Bayesian information criteria* ) is a variant of AIC with a stronger
    penalty for including additional variables to the model.


    4.  **Mallows Cp** : A variant of AIC developed by Colin Mallows.


    Generally, the most commonly used metrics, for measuring regression model quality
    and for comparing models, are: Adjusted R2, AIC, BIC and Cp.


    In the following sections, we''ll show you how to compute these above mentionned
    metrics.


    ## 13.3 Loading required R packages


    *   `tidyverse` for data manipulation and visualization


    *   `modelr` provides helper functions for computing regression model performance
    metrics


    *   `broom` creates easily a tidy data frame containing the model statistical
    metrics


