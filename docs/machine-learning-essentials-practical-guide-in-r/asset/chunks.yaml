- raw: "*   **Root Mean Squared Error** , which measures the model prediction error.\
    \ It corresponds to the average difference between the observed known values of\
    \ the outcome and the predicted value by the model. RMSE is computed as `RMSE\
    \ = mean((observeds - predicteds)^2) %>% sqrt()` . The lower the RMSE, the better\
    \ the model.\n\n*   **Adjusted R-square** , representing the proportion of variation\
    \ (i.e., information), in your data, explained by the model. This corresponds\
    \ to the overall quality of the model. The higher the adjusted R2, the better\
    \ the model\n\nNote that, the above mentioned metrics should be computed on a\
    \ new test data that has not been used to train (i.e. build) the model. If you\
    \ have a large data set, with many records, you can randomly split the data into\
    \ training set (80% for building the predictive model) and test set or validation\
    \ set (20% for evaluating the model performance).\n\nOne of the most robust and\
    \ popular approach for estimating a model performance is **k-fold cross-validation**\
    \ . It can be applied even on a small data set. k-fold cross-validation works\
    \ as follow:\n\n1.  Randomly split the data set into k-subsets (or k-fold) (for\
    \ example 5 subsets)\n\n2.  Reserve one subset and train the model on all other\
    \ subsets\n\n3.  Test the model on the reserved subset and record the prediction\
    \ error\n\n4.  Repeat this process until each of the k subsets has served as the\
    \ test set.\n\n5.  Compute the average of the k recorded errors. This is called\
    \ the cross-validation error serving as the performance metric for the model.\n\
    \nTaken together, the best model is the model that has the lowest cross-validation\
    \ error, RMSE.\n\nIn this Part, you will learn different methods for regression\
    \ analysis and we'll provide practical example in **R** . The following tehniques\
    \ are described:\n\n*   Ordinary least squares (Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) \n\n    *   Simple linear regression\n\n    *   Multiple linear regression\n\
    \n*   Model selection methods: \n\n    *   Best subsets regression (Chapter [17](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )\n\n    *   Stepwise regression (Chapter [18](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )\n\n*   Principal component-based methods (Chapter [20](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ): \n\n    *   Principal component regression (PCR)\n\n    *   Partial least\
    \ squares regression (PLS)\n\n*   Penalized regression (Chapter [19](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ): \n\n    *   Ridge regression\n\n    *   Lasso regression\n\n## 3.1 Examples\
    \ of data set\n\nWe'll use three different data sets: `marketing` [datarium package],\
    \ the built-in R `swiss` data set, and the `Boston` data set available in the\
    \ `MASS` R package.\n\n### 3.1.1 marketing data\n\nThe `marketing` data set [datarium\
    \ package] contains the impact of three advertising medias (youtube, facebook\
    \ and newspaper) on sales. It will be used for predicting sales units on the basis\
    \ of the amount of money spent in the three advertising medias.\n\nData are the\
