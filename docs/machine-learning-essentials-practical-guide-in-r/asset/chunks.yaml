    ## 27.5 Quadratic discriminant analysis - QDA


    QDA is little bit more flexible than LDA, in the sense that it does not assumes
    the equality of variance/covariance. In other words, for QDA the covariance matrix
    can be different for each class.


    LDA tends to be a better than QDA when you have a small training set.


    In contrast, QDA is recommended if the training set is very large, so that the
    variance of the classifier is not a major issue, or if the assumption of a common
    covariance matrix for the K classes is clearly untenable (James et al. [2014](#text00039.html#ref-james2014)
    ) .


    QDA can be computed using the R function `qda()` [MASS package]


    ```


    ```


    ## 27.6 Mixture discriminant analysis - MDA


    The LDA classifier assumes that each class comes from a single normal (or Gaussian)
    distribution. This is too restrictive.


    For MDA, there are classes, and each class is assumed to be a Gaussian mixture
    of subclasses, where each data point has a probability of belonging to each class.
    Equality of covariance matrix, among classes, is still assumed.


    ```


    ```


    MDA might outperform LDA and QDA is some situations, as illustrated below. In
    this example data, we have 3 main groups of individuals, each having 3 no adjacent
    subgroups. The solid black lines on the plot represent the decision boundaries
    of LDA, QDA and MDA. It can be seen that the MDA classifier have identified correctly
    the subclasses compared to LDA and QDA, which were not good at all in modeling
    this data.


    ![](Image00025.jpg)


    The code for generating the above plots is from [John Ramey](https://www.r-bloggers.com/a-brief-look-at-mixture-discriminant-analysis/)


    ## 27.7 Flexible discriminant analysis - FDA


    FDA is a flexible extension of LDA that uses non-linear combinations of predictors
    such as splines. FDA is useful to model multivariate non-normality or non-linear
    relationships among variables within each group, allowing for a more accurate
    classification.


    ```


    ```


    ## 27.8 Regularized discriminant analysis


    RDA builds a classification rule by regularizing the group covariance matrices
    (Friedman [1989](#text00039.html#ref-friedman1989) ) allowing a more robust model
    against multicollinearity in the data. This might be very useful for a large multivariate
    data set containing highly correlated predictors.


    Regularized discriminant analysis is a kind of a trade-off between LDA and QDA.
    Recall that, in LDA we assume equality of covariance matrix for all of the classes.
    QDA assumes different covariance matrices for all the classes. Regularized discriminant
    analysis is an intermediate between LDA and QDA.


    RDA shrinks the separate covariances of QDA toward a common covariance as in LDA.
    This improves the estimate of the covariance matrices in situations where the
    number of predictors is larger than the number of samples in the training data,
    potentially leading to an improvement of the model accuracy.


    ```


    ```


    ## 27.9 Discussion


    We have described linear discriminant analysis (LDA) and extensions for predicting
    the class of an observations based on multiple predictor variables. Discriminant
    analysis is more suitable to multiclass classification problems compared to the
    logistic regression (Chapter [22](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).


    LDA assumes that the different classes has the same variance or covariance matrix.
    We have described many extensions of LDA in this chapter. The most popular extension
    of LDA is the quadratic discriminant analysis (QDA), which is more flexible than
    LDA in the sens that it does not assume the equality of group covariance matrices.


    LDA tends to be better than QDA for small data set. QDA is recommended for large
    training data set.


    # 28 Naive Bayes Classifier


    ## 28.1 Introduction


    The **Naive Bayes classifier** is a simple and powerful method that can be used
    for binary and multiclass classification problems.


    Naive Bayes classifier predicts the class membership probability of observations
    using Bayes theorem, which is based on conditional probability, that is the probability
    of something to happen, given that something else has already occurred.


    Observations are assigned to the class with the largest probability score.


    In this chapter, you''ll learn how to perform naive Bayes classification in R
    using the `klaR` and `caret` package.


