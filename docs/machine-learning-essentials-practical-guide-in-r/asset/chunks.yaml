    \ called regression analysis (Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ).\n\nThe R code is identical to what we have seen in previous sections. Pruning\
    \ should be also applied here to limit overfiting.\n\nSimilarly to classification\
    \ trees, the following R code uses the `caret` package to build regression trees\
    \ and to predict the output of a new test data set.\n\n### 33.5.1 Example of data\
    \ set\n\nData set: We'll use the `Boston` data set [in `MASS` package], introduced\
    \ in Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) , for predicting the median\
