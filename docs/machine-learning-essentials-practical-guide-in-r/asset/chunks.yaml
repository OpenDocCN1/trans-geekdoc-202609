    \ multiple predictor variables.\n\nWe’ll randomly split the data into training\
    \ set (80% for building a predictive model) and test set (20% for evaluating the\
    \ model). Make sure to set seed for reproducibility.\n\n```\n```\n\n## 19.5 Computing\
    \ penalized linear regression\n\n### 19.5.1 Additional data preparation\n\nYou\
    \ need to create two objects:\n\n* `y` for storing the outcome variable\n* `x`\
    \ for holding the predictor variables. This should be created using the function\
    \ `model.matrix()` allowing to automatically transform any qualitative variables\
    \ (if any) into dummy variables (Chapter 6), which is important because `glmnet()`\
    \ can only take numerical, quantitative inputs. After creating the model matrix,\
    \ we remove the intercept component at index = 1.\n\n```\n```\n\n### 19.5.2 R\
    \ functions\n\nWe'll use the R function `glmnet()` [glmnet package] for computing\
    \ penalized linear regression models.\n\nThe simplified format is as follow:\n\
    \n```\n```\n\n* `x`: matrix of predictor variables\n* `y`: the response or outcome\
    \ variable, which is a binary variable.\n* `alpha`: the elasticnet mixing parameter.\
    \ Allowed values include:\n  * `1`: for lasso regression\n  * `0`: for ridge regression\n\
    \  * a value between 0 and 1 (say 0.3) for elastic net regression.\n* `lamba`:\
    \ a numeric value defining the amount of shrinkage. Should be specify by analyst.\n\
    \nIn penalized regression, you need to specify a constant `lambda` to adjust the\
    \ amount of the coefficient shrinkage. The best `lambda` for your data, can be\
    \ defined as the `lambda` that minimize the cross-validation prediction error\
    \ rate. This can be determined automatically using the function `cv.glmnet()`.\n\
    \nIn the following sections, we start by computing ridge, lasso and elastic net\
    \ regression models. Next, we'll compare the different models in order to choose\
    \ the best one for our data.\n\nThe best model is defined as the model that has\
    \ the lowest prediction error, `RMSE` (Chapter 13).\n\n### 19.5.3 Computing ridge\
    \ regression\n\n```\n```\n\n```\n## [1] 0.758\n```\n\n```\n```\n\n```\n## 14 x\
