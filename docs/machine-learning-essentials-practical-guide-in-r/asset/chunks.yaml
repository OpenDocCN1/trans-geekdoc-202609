    \ .\n\n# 31 Introduction\n\n**Statistical machine learning** refers to a set of\
    \ powerful automated algorithms that are used to predict an outcome variable based\
    \ on multiple predictor variables. The algorithms automatically improve their\
    \ performance through \"learning\" from the data, that is they are data-driven\
    \ and do not seek to impose linear or other overall structure on the data (P.\
    \ Bruce and Bruce [2017](#text00039.html#ref-bruce2017) ) . This means that they\
    \ are non-parametric.\n\nThe different machine learning methods can be used for\
    \ both:\n\n*   **classification** , where the outcome variable is a categorical\
    \ variable, for example positive vs negative\n\n*   and **regression** , where\
    \ the outcome variable is a continuous variable.\n\nIn this part, we'll cover\
    \ the following methods:\n\n*   **K-Nearest Neighbors** , which predict the outcome\
    \ of a new observation x as the average outcome of the k most similar observations\
    \ to x (Chapter [32](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\n*   **Decision\
    \ trees** , which build a set of decision rules describing the relationship between\
    \ predictors and the outcome. These rules are used to predict the outcome of a\
    \ new observations (Chapter [33](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\n* \
    \  **Ensemble learning** , including **bagging** , **random forest** and **boosting**\
    \ . These machine learning algorithm are based on decision trees. They produce\
    \ many tree models from the training data sets, and use the average as the predictive\
    \ model. These results to the top-performing predictive modeling techniques. See\
    \ Chapter [34](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) and [35](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ .\n\n# 32 KNN - k-Nearest Neighbors\n\n## 32.1 Introduction\n\nThe **k-nearest\
    \ neighbors** (**KNN** ) algorithm is a simple *machine learning* method used\
    \ for both classification and regression. The kNN algorithm predicts the outcome\
    \ of a new observation by comparing it to k similar cases in the training data\
    \ set, where k is defined by the analyst.\n\nIn this chapter, we start by describing\
    \ the basics of the KNN algorithm for both classification and regression settings.\
    \ Next, we provide practical example in *R* for preparing the data and computing\
    \ KNN model.\n\nAdditionally, you'll learn how to make predictions and to assess\
    \ the performance of the built model in the predicting the outcome of new test\
    \ observations.\n\n## 32.2 KNN algorithm\n\n*   **KNN algorithm for classification**\
    \ :\n\nTo classify a given new observation (new\\_obs), the k-nearest neighbors\
    \ method starts by identifying the k most similar training observations (i.e.\
    \ neighbors) to our new\\_obs, and then assigns new\\_obs to the class containing\
    \ the majority of its neighbors.\n\n*   **KNN algorithm for regression** :\n\n\
    Similarly, to predict a continuous outcome value for given new observation (new\\\
    _obs), the KNN algorithm computes the average outcome value of the k training\
    \ observations that are the most similar to new\\_obs, and returns this value\
    \ as new\\_obs predicted outcome value.\n\n*   **Similarity measures** :"
