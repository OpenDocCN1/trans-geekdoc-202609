- raw: "Splines provide a way to smoothly interpolate between fixed points, called\
    \ knots. Polynomial regression is computed between knots. In other words, splines\
    \ are series of polynomial segments strung together, joining at knots (P. Bruce\
    \ and Bruce [2017](#text00039.html#ref-bruce2017) ) .\n\nThe R package `splines`\
    \ includes the function `bs` for creating a b-spline term in a regression model.\n\
    \nYou need to specify two parameters: the degree of the polynomial and the location\
    \ of the knots. In our example, we'll place the knots at the lower quartile, the\
    \ median quartile, and the upper quartile:\n\n```\n\n```\n\nWe'll create a model\
    \ using a cubic spline (degree = 3):\n\n```\n\n```\n\n```\n##   RMSE    R2\n##\
    \ 1 4.97 0.688\n```\n\nNote that, the coefficients for a spline term are not interpretable.\n\
    \nVisualize the cubic spline as follow:\n\n```\n\n```\n\n![](Image00006.jpg)\n\
    \n## 7.8 Generalized additive models\n\nOnce you have detected a non-linear relationship\
    \ in your data, the polynomial terms may not be flexible enough to capture the\
    \ relationship, and spline terms require specifying the knots.\n\nGeneralized\
    \ additive models, or GAM, are a technique to automatically fit a spline regression.\
    \ This can be done using the `mgcv` R package:\n\n```\n\n```\n\n```\n##   RMSE\
    \    R2\n## 1 5.02 0.684\n```\n\nThe term `s(lstat)` tells the `gam()` function\
    \ to find the \"best\" knots for a spline term.\n\nVisualize the data:\n\n```\n\
    \n```\n\n![](Image00007.jpg)\n\n## 7.9 Comparing the models\n\nFrom analyzing\
    \ the RMSE and the R2 metrics of the different models, it can be seen that the\
    \ polynomial regression, the spline regression and the generalized additive models\
    \ outperform the linear regression model and the log transformation approaches.\n\
    \n## 7.10 Discussion\n\nThis chapter describes how to compute non-linear regression\
    \ models using R.\n\n# 8 Introduction\n\nAfter building a linear regression model\
    \ (Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ), you need to make some diagnostics\
    \ to detect potential problems in the data.\n\nIn this part, you will learn:\n\
    \n*   Linear regression assumptions and diagnostics (Chapter [9](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ )\n\n*   Potential problems when computing a linear regression model, including:\
    \ \n\n    *   non-linear relationship between the outcome and the predictors (Chapter\
    \ [7](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) )\n\n    *   Multicollinearity (Chapter\
    \ [10](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) )\n\n    *   Confounding variables\
    \ (Chapter [11](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) )\n\n# 9 Regression Assumptions\
    \ and Diagnostics\n\n## 9.1 Introduction\n\nLinear regression (Chapter [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ) makes several assumptions about the data at hand. This chapter describes **regression\
    \ assumptions** and provides built-in plots for **regression diagnostics** in\
    \ R programming language.\n\nAfter performing a regression analysis, you should\
    \ always check if the model works well for the data at hand.\n\nA first step of\
    \ this regression diagnostic is to inspect the significance of the regression\
    \ beta coefficients, as well as, the R2 that tells us how well the linear regression\
    \ model fits to the data. This has been described in the Chapters [4](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ and [14](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) .\n\nIn this current chapter, you\
    \ will learn additional steps to evaluate how well the model fits the data.\n\n\
    For example, the linear regression model makes the assumption that the relationship\
    \ between the predictors (x) and the outcome variable is linear. This might not\
    \ be true. The relationship could be polynomial or logarithmic.\n\nAdditionally,\
    \ the data might contain some influential observations, such as outliers (or extreme\
    \ values), that can affect the result of the regression.\n\nTherefore, you should\
    \ closely diagnostic the regression model that you built in order to detect potential\
    \ problems and to check whether the assumptions made by the linear regression\
    \ model are met or not.\n\nTo do so, we generally examine the distribution of\
    \ **residuals errors** , that can tell you more about your data.\n\nIn this chapter,\n\
    \n*   we start by explaining **residuals errors** and **fitted values** .\n\n\
    *   next, we present linear **regresion assumptions** , as well as, potential\
    \ problems you can face when performing regression analysis.\n\n*   finally, we\
    \ describe some built-in **diagnostic plots** in R for testing the assumptions\
    \ underlying linear regression model.\n\n## 9.2 Loading Required R packages\n\n\
    *   `tidyverse` for easy data manipulation and visualization\n\n*   `broom` :\
    \ creates a tidy data frame from statistical test results\n\n```\n\n```\n\n##\
    \ 9.3 Example of data\n\nWe'll use the data set `marketing` [datarium package],\
    \ introduced in Chapter [3](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) .\n\n```\n\n```\n\
    \n```\n##     youtube facebook newspaper sales\n## 158     180     1.56      29.2\
    \  12.1\n## 82      288     4.92      44.3  14.8\n## 175     267     4.08    \
    \  15.7  13.8\n```\n\n## 9.4 Building a regression model\n\nWe build a model to\
    \ predict sales on the basis of advertising budget spent in youtube medias.\n\n\
    ```\n\n```\n\n```\n## \n## Call:\n## lm(formula = sales ~ youtube, data = marketing)\n\
    ## \n## Coefficients:\n## (Intercept)      youtube  \n##      8.4391       0.0475\n\
    ```\n\nOur regression equation is: `y = 8.43 + 0.07*x` , that is `sales = 8.43\
    \ + 0.047*youtube` .\n\nBefore, describing regression assumptions and regression\
    \ diagnostics, we start by explaining two key concepts in regression analysis:\
    \ Fitted values and residuals errors. These are important for understanding the\
    \ diagnostic plots presented hereafter.\n\n## 9.5 Fitted values and residuals\n\
    \nThe **fitted** (or **predicted** ) values are the y-values that you would expect\
    \ for the given x-values according to the built regression model (or visually,\
    \ the best-fitting straight regression line).\n\nIn our example, for a given youtube\
    \ advertising budget, the fitted (predicted) sales value would be, `sales = 8.44\
    \ + 0.0048*youtube` .\n\nFrom the scatter plot below, it can be seen that not\
    \ all the data points fall exactly on the estimated regression line. This means\
    \ that, for a given youtube advertising budget, the observed (or measured) sale\
    \ values can be different from the predicted sale values. The difference is called\
    \ the **residual errors** , represented by a vertical red lines.\n\n![Linear regression](Image00000.jpg)\n\
    \nLinear regression\n\nIn R, you can easily augment your data to add fitted values\
    \ and residuals by using the function `augment()` [broom package]. Let's call\
    \ the output `model.diag.metrics` because it contains several metrics useful for\
    \ regression diagnostics. We'll describe theme later.\n\n```\n\n```\n\n```\n##\
    \   sales youtube .fitted .se.fit .resid    .hat .sigma  .cooksd .std.resid\n\
    ## 1 26.52   276.1   21.56   0.385  4.955 0.00970   3.90 7.94e-03     1.2733\n\
    ## 2 12.48    53.4   10.98   0.431  1.502 0.01217   3.92 9.20e-04     0.3866\n\
    ## 3 11.16    20.6    9.42   0.502  1.740 0.01649   3.92 1.69e-03     0.4486\n\
    ## 4 22.20   181.8   17.08   0.277  5.119 0.00501   3.90 4.34e-03     1.3123\n\
    ## 5 15.48   217.0   18.75   0.297 -3.273 0.00578   3.91 2.05e-03    -0.8393\n\
    ## 6  8.64    10.4    8.94   0.525 -0.295 0.01805   3.92 5.34e-05    -0.0762\n\
    ```\n\nAmong the table columns, there are:\n\n*   `youtube` : the invested youtube\
    \ advertising budget\n\n*   `sales` : the observed sale values\n\n*   `.fitted`\
    \ : the fitted sale values\n\n*   `.resid` : the residual errors\n\n*   ...\n\n\
    The following R code plots the residuals error (in red color) between observed\
    \ values and the fitted regression line. Each vertical red segments represents\
    \ the residual error between an observed sale value and the corresponding predicted\
    \ (i.e. fitted) value.\n\n```\n\n```\n\n![](Image00008.jpg)\n\nIn order to check\
    \ regression assumptions, we'll examine the distribution of residuals.\n\n## 9.6\
    \ Regression assumptions\n\nLinear regression makes several assumptions about\
    \ the data, such as :\n\n1.  **Linearity of the data** . The relationship between\
    \ the predictor (x) and the outcome (y) is assumed to be linear."
