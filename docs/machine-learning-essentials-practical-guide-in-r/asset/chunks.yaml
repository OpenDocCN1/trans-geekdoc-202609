  trans: "\n\n样条提供了一种在称为结点的固定点之间平滑插值的方法。结点之间计算多项式回归。换句话说，样条是串联在一起的多项式段，在结点处连接（P. Bruce\
    \ 和 Bruce 2017）。\n\nR 包 `splines` 包含函数 `bs` 用于在回归模型中创建 B 样条项。\n\n你需要指定两个参数：多项式的次数和结点的位置。在我们的示例中，我们将结点放置在下四分位数、中位数四分位数和上四分位数：\n\
    \n```\n```\n\n我们将使用三次样条（degree = 3）创建一个模型：\n\n```\n```\n\n```\n##   RMSE    R2\n\
    ## 1 4.97 0.688\n```\n\n请注意，样条项的系数是不可解释的。\n\n按如下方式可视化三次样条：\n\n```\n```\n\n![](img/Image00006.jpg)\n\
    \n## 7.8 广义可加模型\n\n一旦你在数据中检测到非线性关系，多项式项可能不足以捕捉该关系，并且样条项需要指定结点。\n\n广义可加模型，或 GAM，是一种自动拟合样条回归的技术。这可以使用\
    \ `mgcv` R 包完成：\n\n```\n```\n\n```\n##   RMSE    R2\n## 1 5.02 0.684\n```\n\n\
    项 `s(lstat)` 告诉 `gam()` 函数为样条项找到“最佳”结点。\n\n可视化数据：\n\n```\n```\n\n![](img/Image00007.jpg)\n\
    \n## 7.9 比较模型\n\n通过分析不同模型的 RMSE 和 R2 指标，可以看出多项式回归、样条回归和广义可加模型优于线性回归模型和对数变换方法。\n\
    \n## 7.10 讨论\n\n本章描述了如何使用 R 计算非线性回归模型。\n\n# 8 引言\n\n在构建线性回归模型（第 4 章）之后，你需要进行一些诊断以检测数据中的潜在问题。\n\
    \n在本部分，你将学习：\n\n* 线性回归假设和诊断（第 9 章）\n* 计算线性回归模型时可能出现的问题，包括：\n    * 结果与预测变量之间的非线性关系（第\
    \ 7 章）\n    * 多重共线性（第 10 章）\n    * 混杂变量（第 11 章）\n\n# 9 回归假设和诊断\n\n## 9.1 引言\n\n\
    线性回归（第 4 章）对所处理的数据做出若干假设。本章描述 **回归假设** 并提供 R 编程语言中用于 **回归诊断** 的内置图。\n\n执行回归分析后，你应始终检查模型对所处理数据的适用性。\n\
    \n回归诊断的第一步是检查回归贝塔系数的显著性，以及 R2，它告诉我们线性回归模型对数据的拟合程度。这已在第 4 和 14 章中描述。\n\n在本章中，你将学习评估模型拟合数据的良好程度的额外步骤。\n\
    \n例如，线性回归模型假设预测变量（x）与结果变量之间的关系是线性的。这可能不成立。关系可能是多项式或对数。\n\n此外，数据可能包含一些有影响的观测值，例如异常值（或极值），这会影响回归结果。\n\
    \n因此，你应仔细诊断你构建的回归模型以检测潜在问题并检查线性回归模型所做的假设是否满足。\n\n为此，我们通常检查 **残差误差** 的分布，这可以告诉你有关数据的更多信息。\n\
    \n在本章中，\n\n* 我们首先解释 **残差误差** 和 **拟合值**。\n* 接下来，我们介绍线性 **回归假设**，以及在执行回归分析时可能遇到的潜在问题。\n\
    * 最后，我们描述 R 中用于检验线性回归模型潜在假设的一些内置 **诊断图**。\n\n## 9.2 加载所需的 R 包\n\n* `tidyverse`\
    \ 用于轻松的数据操作和可视化\n* `broom`：从统计检验结果创建整洁的数据框\n\n```\n```\n\n## 9.3 示例数据\n\n我们将使用数据集合\
    \ `marketing` [datarium 包]，该集合在第 3 章中介绍。\n\n```\n```\n\n```\n##     youtube facebook\
    \ newspaper sales\n## 158     180     1.56      29.2  12.1\n## 82      288   \
    \  4.92      44.3  14.8\n## 175     267     4.08      15.7  13.8\n```\n\n## 9.4\
    \ 构建回归模型\n\n我们构建一个模型以根据 youtube 媒体支出的广告预算预测销售额。\n\n```\n```\n\n```\n## \n## Call:\n\
    ## lm(formula = sales ~ youtube, data = marketing)\n## \n## Coefficients:\n##\
    \ (Intercept)      youtube  \n##      8.4391       0.0475\n```\n\n我们的回归方程是：`y\
    \ = 8.43 + 0.07*x`，即 `sales = 8.43 + 0.047*youtube`。\n\n在描述回归假设和回归诊断之前，我们首先解释回归分析中的两个关键概念：拟合值和残差误差。这些对于理解此后介绍的诊断图很重要。\n\
    \n## 9.5 拟合值和残差\n\n**拟合**（或 **预测**）值是根据构建的回归模型（或视觉上，最佳拟合的直线回归线）对于给定的 x 值所期望的 y\
    \ 值。\n\n在我们的示例中，对于给定的 youtube 广告预算，拟合（预测）销售额将为，`sales = 8.44 + 0.0048*youtube`。\n\
    \n从下面的散点图可以看出，并非所有数据点都恰好落在估计的回归线上。这意味着，对于给定的 youtube 广告预算，观察到的（或测量的）销售额可能与预测的销售额不同。差异称为\
    \ **残差误差**，由垂直红色线表示。\n\n![Linear regression](img/Image00000.jpg)\n\n线性回归\n\n在\
    \ R 中，你可以使用函数 `augment()` [broom 包] 轻松地增强数据以添加拟合值和残差。让我们将输出称为 `model.diag.metrics`，因为它包含对回归诊断有用的多个指标。我们稍后会描述它们。\n\
    \n```\n```\n\n```\n##   sales youtube .fitted .se.fit .resid    .hat .sigma  .cooksd\
    \ .std.resid\n## 1 26.52   276.1   21.56   0.385  4.955 0.00970   3.90 7.94e-03\
    \     1.2733\n## 2 12.48    53.4   10.98   0.431  1.502 0.01217   3.92 9.20e-04\
    \     0.3866\n## 3 11.16    20.6    9.42   0.502  1.740 0.01649   3.92 1.69e-03\
    \     0.4486\n## 4 22.20   181.8   17.08   0.277  5.119 0.00501   3.90 4.34e-03\
    \     1.3123\n## 5 15.48   217.0   18.75   0.297 -3.273 0.00578   3.91 2.05e-03\
    \    -0.8393\n## 6  8.64    10.4    8.94   0.525 -0.295 0.01805   3.92 5.34e-05\
    \    -0.0762\n```\n\n在表列中，有：\n\n* `youtube`：投入的 youtube 广告预算\n* `sales`：观察到的销售额\n\
    * `.fitted`：拟合销售额\n* `.resid`：残差误差\n* ...\n\n以下 R 代码绘制残差误差（红色）与观察值和拟合回归线之间的差异。每个垂直红色线段代表一个观察销售额与相应预测（即拟合）值之间的残差误差。\n\
    \n```\n```\n\n![](img/Image00008.jpg)\n\n为了检查回归假设，我们将检查残差的分布。\n\n## 9.6 回归假设\n\
