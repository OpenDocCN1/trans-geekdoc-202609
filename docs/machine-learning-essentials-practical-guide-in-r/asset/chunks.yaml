    \ ).\n\n### 17.5.2 K-fold cross-validation\n\nThe **k-fold Cross-validation**\
    \ consists of first dividing the data into k subsets, also known as k-fold, where\
    \ k is generally set to 5 or 10. Each subset (10%) serves successively as test\
    \ data set and the remaining subset (90%) as training data. The average cross-validation\
    \ error is computed as the model prediction error.\n\nThe k-fold cross-validation\
    \ can be easily computed using the function `train()` [`caret` package] (Chapter\
    \ [14](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX) ).\n\nHere, we'll follow the procedure\
