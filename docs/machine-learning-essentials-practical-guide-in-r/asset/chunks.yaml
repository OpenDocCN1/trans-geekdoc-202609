    \n## 32.5 KNN 用于回归\n\n在本节中，我们将介绍如何使用 KNN 预测连续变量。\n\n我们将使用 `Boston` 数据集 [在 `MASS`\
    \ 包中]，在第 3 章中介绍过，用于预测波士顿郊区的房屋中位价值（`mdev`），使用不同的预测变量。\n\n1.  **随机拆分数据** 为训练集（80%\
    \ 用于构建预测模型）和测试集（20% 用于评估模型）。请确保设置种子以保证可重复性。\n\n```\n```\n\n2.  **使用 caret 计算 KNN**\
    \ 。\n\n最佳 k 是使预测误差 RMSE（均方根误差）最小的 k。\n\nRMSE 对应于观测已知结果值与预测值之间平均差异的平方根，`RMSE =\
    \ mean((observeds - predicteds)²) %>% sqrt()` 。RMSE 越低，模型越好。\n\n```\n```\n\n##\
    \ 32.6 讨论\n\n本章介绍了 KNN（k-最近邻）建模的基础知识，从概念上讲，它是较简单的机器学习方法之一。\n\n建议在进行 KNN 分析时对数据进行标准化。我们提供了\
    \ R 代码来轻松计算 KNN 预测模型并评估模型在测试数据上的性能。\n\n在拟合 KNN 算法时，分析人员需要指定在 KNN 算法中用于预测观测结果的邻居数（k）。k\
    \ 的选择会极大地影响 KNN 的输出。k = 1 对应于高度灵活的方法，导致训练误差率为 0（过拟合），但测试误差率可能相当高。\n\n你需要测试多个 k\
    \ 值以确定数据的最优值。这可以使用 `caret` 包自动完成，该包选择使交叉验证误差最小的 k 值 14 。\n\n# 33 决策树模型\n\n## 33.1\
    \ 引言\n\n**决策树** 方法是一种强大且流行的预测机器学习技术，可用于 *分类* 和 *回归* 。因此，它也被称为 **分类与回归树**（**CART**）。\n\
    \n请注意，CART 算法的 R 实现称为 *RPART*（递归划分和回归树），可在同名包中使用。\n\n在本章中，我们将介绍树模型的基础知识，并提供用于计算分类和回归树的\
    \ R 代码。\n\n## 33.2 加载所需的 R 包\n\n*   `tidyverse` 用于轻松的数据操作和可视化\n*   `caret` 用于轻松的机器学习工作流\n\
    *   `rpart` 用于计算决策树模型\n\n```\n```\n\n## 33.3 决策树算法\n\n### 33.3.1 基础和可视化表示\n\n\
    决策树模型算法通过反复将数据划分为多个子空间来工作，使得每个最终子空间中的结果尽可能同质。这种方法在技术上称为 *递归划分* 。\n\n产生的结果是一组用于预测结果变量的规则，结果变量可以是：\n\
    \n*   连续变量，用于回归树\n*   分类变量，用于分类树\n\nCART 预测模型生成的决策规则通常以二叉树的形式可视化。\n\n以下示例表示一个基于萼片和花瓣长度（单位为\
    \ cm）和宽度的鸢尾花物种预测树模型。\n\n```\n```\n\n![](img/Image00032.jpg)\n\n该图显示了可用于有效预测结果类型（此处为鸢尾花物种）的不同可能的分割规则。例如，顶部分割将具有\
    \ `Petal.length < 2.45` 的观测值分配到左分支，其中预测的物种为 `setosa` 。\n\n树中的不同规则可以按如下方式打印：\n\n\
    ```\n```\n\n```\n## n= 150 \n## \n## node), split, n, loss, yval, (yprob)\n##\
    \       * denotes terminal node\n## \n## 1) root 150 100 setosa (0.333 0.333 0.333)\
    \  \n##   2) Petal.Length< 2.5 50   0 setosa (1.000 0.000 0.000) *\n##   3) Petal.Length>=2.5\
    \ 100  50 versicolor (0.000 0.500 0.500)  \n##     6) Petal.Width< 1.8 54   5\
    \ versicolor (0.000 0.907 0.093) *\n##     7) Petal.Width>=1.8 46   1 virginica\
    \ (0.000 0.022 0.978) *\n```\n\n这些规则是通过反复分割预测变量产生的，从与响应变量关联度最高的变量开始。该过程一直持续到满足某些预定的停止标准。\n\
    \n生成的树由 *决策节点* 、 *分支* 和 *叶节点* 组成。树从上到下放置，因此 *根* 在顶部，表示结果的叶节点放在底部。\n\n每个决策节点对应于单个输入预测变量和该变量上的分割阈值。树的叶节点是用于进行预测的结果变量。\n\
    \n树从顶部（根）开始生长，在每个节点处，算法决定最佳分割阈值，从而在每个子分区中获得最大的纯度（或同质性）。\n\n树将根据以下三个标准停止生长（Zhang\
    \ 2016）：\n\n1.  所有叶节点都是纯的，具有单一类别；\n2.  预先指定的最小训练观测数无法通过任何分割方法分配给每个叶节点；\n3.  叶节点中的观测数达到预先指定的最小值。\n\
    \n完全生长的树会过拟合训练数据，所产生的模型可能无法很好地预测新测试数据的结果。诸如 **剪枝** 之类的技术用于控制此问题。\n\n### 33.3.2\
    \ 选择树的分割点\n\n从技术上讲，**对于回归建模** ，分割阈值是这样定义的，使得落在子分区内的训练样本的残差平方和误差（RSS）最小化。\n\n"
