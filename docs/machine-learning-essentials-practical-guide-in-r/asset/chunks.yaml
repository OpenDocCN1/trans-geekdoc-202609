    \   0.671\n```\n\n### 19.5.5 Computing elastic net regession\n\nThe elastic net\
    \ regression can be easily computed using the `caret` workflow, which invokes\
    \ the `glmnet` package.\n\nWe use `caret` to automatically select the best tuning\
    \ parameters `alpha` and `lambda` . The `caret` packages tests a range of possible\
    \ `alpha` and `lambda` values, then selects the best values for lambda and alpha,\
    \ resulting to a final model that is an elastic net model.\n\nHere, we'll test\
    \ the combination of 10 different values for `alpha` and `lambda` . This is specified\
    \ using the option `tuneLength` .\n\nThe best `alpha` and `lambda` values are\
    \ those values that minimize the cross-validation error (Chapter [14](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)\
    \ ).\n\n```\n\n```\n\n```\n##   alpha lambda\n## 6   0.1   0.21\n```\n\n```\n\n\
    ```\n\n```\n## 14 x 1 sparse Matrix of class \"dgCMatrix\"\n##               \
