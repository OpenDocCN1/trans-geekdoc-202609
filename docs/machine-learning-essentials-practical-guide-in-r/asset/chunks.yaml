    \      -0.91214\n## black         0.00946\n## lstat        -0.51770\n```\n\n```\n\
    \n```\n\n```\n##   RMSE Rsquare\n## 1 4.98   0.672\n```\n\n### 19.5.6 Comparing\
    \ the different models\n\nThe different models performance metrics are comparable.\
    \ Using lasso or elastic net regression set the coefficient of the predictor variable\
    \ `age` to zero, leading to a simpler model compared to the ridge regression,\
    \ which include all predictor variables.\n\nAll things equal, we should go for\
    \ the simpler model. In our example, we can choose the lasso or the elastic net\
    \ regression models.\n\nNote that, we can easily compute and compare ridge, lasso\
    \ and elastic net regression using the `caret` workflow.\n\n`caret` will automatically\
    \ choose the best tuning parameter values, compute the final model and evaluate\
    \ the model performance using cross-validation techniques.\n\n### 19.5.7 Using\
    \ caret package\n\n0.  **Setup a grid range of lambda values** :\n\n```\n\n```\n\
    \n1.  **Compute ridge regression** :\n\n```\n\n```\n\n2.  **Compute lasso regression**\
    \ :\n\n```\n\n```\n\n3.  **Elastic net regression** :\n\n```\n\n```\n\n4.  **Comparing\
    \ models performance** :\n\nThe performance of the different models - ridge, lasso\
    \ and elastic net - can be easily compared using `caret` . The best model is defined\
    \ as the one that minimizes the prediction error.\n\n```\n\n```\n\n```\n## \n\
    ## Call:\n## summary.resamples(object = ., metric = \"RMSE\")\n## \n## Models:\
    \ ridge, lasso, elastic \n## Number of resamples: 10 \n## \n## RMSE \n##     \
    \    Min. 1st Qu. Median Mean 3rd Qu. Max. NA's\n## ridge   3.10    3.96   4.38\
    \ 4.73    5.52 7.43    0\n## lasso   3.16    4.03   4.39 4.73    5.51 7.27   \
    \ 0\n## elastic 3.13    4.00   4.37 4.72    5.52 7.32    0\n```\n\nIt can be seen\
    \ that the elastic net model has the lowest median RMSE.\n\n## 19.6 Discussion\n\
    \nIn this chapter we described the most commonly used penalized regression methods,\
    \ including ridge regression, lasso regression and elastic net regression. These\
    \ methods are very useful in a situation, where you have a large multivariate\
    \ data sets.\n\n# 20 Principal Component and Partial Least Squares Regression\n\
    \n## 20.1 Introduction\n\nThis chapter presents regression methods based on dimension\
    \ reduction techniques, which can be very useful when you have a large data set\
    \ with multiple correlated predictor variables."
