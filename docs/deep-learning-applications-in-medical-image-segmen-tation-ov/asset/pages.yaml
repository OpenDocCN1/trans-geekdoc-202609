    The growth model that is best suited to represent myelination progress in the
    pediatric brain is obtained. We examined twelve growth models for this purpose:
    linear, quadratic, logarithmic, exponential, negative exponential, Gompertz, logistic,
    Weibull, Richards, and hyperbolastic models H1–H3. While Figure 4.5 portrays these
    models fitted to the actual MI values, their AIC and BIC metrics are tabulated
    in Table 4.2.'
