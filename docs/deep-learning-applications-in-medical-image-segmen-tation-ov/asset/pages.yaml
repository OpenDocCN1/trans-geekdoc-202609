    SegNet''s decoder stands out for employing the max-pooling indices method during
    pooling to upsample low-resolution input features. Unlike FCN, which utilizes
    a deconvolution algorithm for nonlinear upsampling without learning, SegNet adopts
    a different approach. It utilizes a higher pooling index conveyed by the encoder,
    as depicted in Figure 2.4, which conserves space and yields commendable performance.
    Rather than storing the absolute maximum feature value, max-pooling indices record
    the position of the maximum feature value within the pooling window for each encoder
    map. By using the encoder’s transferred pool indices to upsample the input, a
    decoder produces a sparse feature map. The feature map is then convoluted with
    a trainable filter bank to increase its density. U-Net, in contrast, precedes
    convolution with concatenation by sending the complete feature map from the encoder
    to the decoder.


