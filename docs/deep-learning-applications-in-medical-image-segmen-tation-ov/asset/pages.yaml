    data limitations, enhancing generalization, and reducing training time. CSR-Net''s
    performance is evaluated on the JSRT database, with metrics such as Dice score,
    precision, recall, accuracy, and Jaccard similarity coefficient (JSC) quantitatively
    measured.


    # 7.4.1.3 Dilated Convolution-Based Approaches


    Deeplabv3+ stands as a pivotal architecture, (Chen et al. 2018) offering a robust
    encoder–decoder framework for accurate image analysis. While its predecessor,
    deeplabv3, excelled at capturing multi-scale contextual information but faced
    challenges in accurately delineating object boundaries deeplabv3+ addressed this
    limitation by integrating a decoder module to improve segmentation results, especially
    along object borders and object edges. Building upon this foundation, researchers
    have explored various advancements to further enhance its performance and handle
    specific challenges.


    Singh et al. developed Deep LF-Net, (Singh et al. 2021) an encoder–decoder network
    building upon deeplabv3+, designed to robustly segment lungs in Indian patients
    with diverse abnormalities. The encoder incorporates atrous convolutions and spatial
    pyramid pooling for capturing multi-scale contextual information, while the decoder
    refines segmentation, addressing challenges such as opacities and pleural effusions.
    Post-processing, including area filtering, effectively eliminates false positives.
    Evaluated on an in-house Indian dataset and public datasets (Shenzen, JSRT, and
    MC), Deep LF-Net demonstrated outstanding performance, achieving 99.37% on JSRT,
    99.09% on MC, and 98.31% accuracy on Shenzhen, outperforming existing methods.
    In a recent study by Boudoukhani et al., (Boudoukhani et al. 2023) a unique methodology
    was adopted to address common challenges in lung segmentation such as shape/scale
    variations, device artifacts, false positives, and poor generalizability across
    devices. Attention gates in the encoder filter out noise, focus on relevant lung
    features, and minimize false positives, while residual convolutions in the decoder
    preserve crucial details, leading to sharp, accurate lung boundaries across diverse
    X-ray datasets, boosting the generalizability of this model. Based on EfficientNet-b4
    and ResNet-50 architectures, it outperforms prior models, achieving “Dice coefficient
    of 98.03% and Jaccard index 96.14%” without pre-/post-processing (Figure 7.6).'
