    myelinates rapidly relative to the right hemisphere.


    A comparison with other recent publications reveals diverse results on hemispheric
    myelination. Some works report asymmetric myelin maturation and substantial hemispheric
    differences (left hemisphere myelinates faster), similar to our findings (Deoni
    et al. 2011). Structural asymmetries in WM pathways are also identified (Dubois
    et al. 2009). Whereas other studies perceive region-specific and age-specific
    cortical asymmetry, for example, asymmetry in the occipital lobe at 1 year and
    precentral/lingual gyri in later years (Deoni et al. 2015). Yet other researchers
    recognize no significant differences in hemispheric myelination (Deoni et al.
    2012; Dean et al. 2016). Such a vast variation in the results is due to diversity
    in the age range of pediatric subjects, uneven sampling density, and dissimilarity
    in MRI techniques to study myelination between different methods.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# ### 4.5.4 Preterm Myelination


    Currently, there is a paucity of works that quantify myelination progress in prematurely
    born babies. This can be attributed to the problems in segmenting and modeling
    preterm myelination such as high variability in premature brain development, lack
    of atlases and models for preterm births, and lack of availability of dedicated
    datasets. Thus, it is not practical to fit generic growth models for premature
    myelination, unlike term-born children. We obtain a percentage lag in the myelination
    index for preterm births to gauge their extent and level of myelination relative
    to equivalent-term babies. Our results reveal a myelination lag of 27.97–46.65%.
    A continuous monitoring and analysis of the lag in myelination is necessary to
    determine the age at which the myelination gap between premature and full-term
    babies closes. This will help determine the degree and duration of specialized
    medical care required for preterm neonates and infants.


    # ## 4.6 Conclusion


    The segmentation, visualization, and analysis of the myelinated regions of the
    pediatric brain are important from the clinical and research perspectives as they
    help detect normal brain maturation and growth. However, the study of MWM in pediatric
    subjects (including neonates, early, and late infants) is fraught with many challenges
    such as large variability in normal myelination, lack of uniform myelination in
    all areas, scarcity of specific datasets and myelin atlases, and need for additional
    quantitative MRI techniques. We propose a novel myelin segmentation and visualization
    method based only on clinical T1 and T2 MRI scans. The segmentation approach introduces
    a new weighted localized Tsallis entropy threshold to detect MWM. Using the myelin
    segmentation maps, we put forth a novel MI to quantify the extent of myelination.
    Furthermore, the Gompertz growth model is identified as the model of best fit
    to describe myelin progress in the pediatric brain based on AIC and BIC metrics.
    In addition, we investigate the hemispheric differences in myelination along with
    a close analysis of myelin development in premature babies. The results obtained
    show a clear demarcation in the myelination patterns of the right and left hemispheres,
    with the left hemisphere myelinating rapidly. Besides, we observe a 27.97–46.65%
    lag in the myelination of preterm children. On the whole, our study performs a
    qualitative and quantitative analysis of MWM that will aid clinicians to objectively
    identify various myelin disorders and anomalies such as hypomyelination, retarded
    myelination, and dysmyelination.'
