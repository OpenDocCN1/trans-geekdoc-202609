    \ $x$.\n\n+   - Sigmoid: The sigmoid function guarantees that the output of the\
    \ neural network will always be 0 and 1. This function is applied to each layer\
    \ of the neural network. A sigmoid function is a bounded, differentiable real\
    \ function that defines all the real input values and has a non-negative derivative\
    \ at each point. The sigmoid function is defined as the below equation:\n+   \n\
    +   $f(x) = \\frac{1}{1 + e^{-x}}$\n\n+   - Hyperbolic tangent (TanH): The TanH\
