  md: '# 7.5.1 Chest X-Ray Datasets


    # 7.5.1.1 JSRT ("Japanese Society of Radiological Technology")


    The “Standard Digital Image Database of chest radiographs” with and without lung
    nodules was created by the “Academic Committee of the Japanese Society of Radiological
    Technology” in 1998, (Shiraishi et al. 2000) supported by the Japan Radiological
    Society (JRS) and collaborated with healthcare facilities in the United States
    and Japan. JSRT stands as the most frequently used dataset with renowned usage
    in “nodule detection and lung segmentation research,” comprising “247 posteroanterior
    (PA) chest X-rays” with a “resolution of 2048×2048” pixels. Among these 154 CXR
    images are “with lung nodules” (54 benign and 100 malignant nodules) and “93 without
    nodules.” These CXRs are stored as PNG files with a 12-bit grayscale depth. In
    addition, the database includes patients’ details such as age, gender, diagnosis
    (benign or malignant), X and Y coordinates of nodules, and a basic diagram showing
    nodule location. Regarded as a valuable repository, this dataset has found widespread
    usage in various research studies focusing on the identification of lung nodules
    from chest X-rays. (Kaggle (2020)).


    # 7.5.1.2 Montgomery County (MC) Dataset


    The “Montgomery County (MC)” dataset is a collaborative effort between the “Department
    of Health and Human Services in Montgomery County, Maryland and US National Library
    of Medicine (USNLM).” The Montgomery dataset comprises labeled X-ray images captured
    in a frontal view. This data repository contains “138 posteroanterior (PA) chest
    X-rays” obtained through the tuberculosis (TB) screening program. Among these
    CXRs, 80 CXRs depict normal chest conditions without TB manifestations, while
    58 exhibit indications of TB. The dataset is accompanied by ground truth masks
    corresponding to each X-ray image in the dataset. These masks are binary images
    that provide delineation of lung areas and aid in the identification of specific
    pulmonary regions within the X-ray images. Each CXR in the dataset is accompanied
    by clinical readings stored in text files (.txt), and individual ground truth
    masks are provided for both right and left lungs in the form of .png files. These
    X-ray images maintain high image quality, with a “resolution of 12 bits per pixel
    and a pixel size of 0.0875 mm”. (Kaggle (2018)).


    # 7.5.1.3 Shenzhen Dataset


    The Shenzhen dataset, created collaboratively by “USNLM and Shenzhen No. 3 People’s
    Hospital, Guangdong Medical College, China,” comprises 662 PA chest X-rays. Out
    of these, 326 CXRs depict normal cases, while 336 X-rays show manifestations of
    TB, including some pediatric anteroposterior (AP) X-rays. The dataset contains
    images of different sizes, with widths ranging from 1130 to 3001 pixels'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'and heights from 948 to 3001 pixels. Most images are approximately 3K × 3K
    pixels in size. The CXR images are saved with the file extension “.jpeg” and were
    captured using a “Philips DR Digital Diagnostic System.” Only 566 ground masks
    are provided for these images. These images are notably high-resolution, boasting
    dimensions of 4020 × 4892 or 4892 × 4020 pixels. Each X-ray image within this
    dataset exhibits a grayscale depth of 12 bits, allowing for a comprehensive range
    of 4096 gray-scale levels for enhanced imaging. This repository serves as a precious
    asset for detailed chest imaging research and analysis due to its high-resolution
    images and the availability of corresponding masks for further analysis and identification
    of anatomical features.


    # 7.5.1.4 Indian Dataset


    The Indian dataset includes a total of 7470 medical images, corresponding to these
    images, 3955 detailed radiology reports are utilized for various medical applications
    or studies. The dataset is sourced from various hospitals affiliated with Indiana
    University. These hospitals likely contribute their medical images and associated
    reports to form this comprehensive dataset. These images and reports contribute
    to a comprehensive repository supporting diverse medical applications. Utilizing
    text-mining techniques, the dataset incorporates eight disease labels per image,
    enabling the association of multiple labels with individual images. This diverse
    labeling system facilitates image classification based on pathology, encompassing
    a wide range of medical conditions. The radiographs vary in dimensions from 1024
    to 4248 pixels, both in width and height, initially existing in “Digital Imaging
    and Communications in Medicine (DICOM) format.” Later, these were converted to
    PNG format for enhanced accessibility and standardized usage. Researchers at the
    US National Library of Medicine have used this dataset for distinct studies, such
    as CXR view classification, (Xue et al. 2015) identification of image rotations,
    (Santosh et al. 2015) and detection of foreign objects in these images.


    # 7.5.1.5 National Institutes of Health Chest X-Ray Dataset (NIH)


    The NIH dataset, also referred to as “chest X-ray 14”, (Wang et al. 2017) is a
    significant repository comprising “112,120” CXR images annotated with “disease
    labels from 30,805 unique patients.” These labels were derived using “Natural
    Language Processing (NLP) techniques,” extracting disease classifications from
    the related radiological findings. This dataset encompasses 14 different thorax
    disease categories, along with an additional category indicating “no findings.”
    However, the absence of definitive ground truth masks posed a significant challenge.
    This dataset presents a broad spectrum of pathological conditions. By providing
    access to this dataset, this publication aims to equip scientists with resources
    to enhance algorithmic training for disease identification and diagnosis,'
