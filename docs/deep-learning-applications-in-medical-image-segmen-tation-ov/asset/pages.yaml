    # ### 6.3.2.3 Hemorrhage


    Blood leaking from blood vessels is referred to as hemorrhage. Hemorrhages may
    show up as abnormally red patches on retinal imaging because of blood. Conditions
    such as hypertensive retinopathy and DR are prone to hemorrhages. Hemorrhage patterns,
    sizes, and locations can all give important information for diagnosing and tracking
    these disorders.


    # ### 6.3.2.4 Hard Exudates


    Hard exudates are yellow or white deposits that form in the retina as a result
    of lipid leaking from injured blood vessels. They are frequently linked to disorders
    such as diabetic macular edema. Hard exudates in retinal imaging must be identified
    and monitored in order to determine the severity of retinopathy and guide treatment
    options (Wang et al. 2020).


    # ### 6.3.2.5 Soft Exudates (Cotton-Wool Spots)


    Soft exudates, commonly known as cotton-wool spots, are white or greyish lesions
    in the retina produced by inflammatory material buildup. They are frequently linked
    to disorders such as hypertensive retinopathy and diabetic retinopathy. Soft exudate
    detection is critical for determining the amount of retinal injury and directing
    suitable therapies. Figure 6.1 presents the segmentation of the main structures
    in the context of detecting DR and other retinal conditions.'
