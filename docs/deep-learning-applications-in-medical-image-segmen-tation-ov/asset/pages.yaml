    # 7.4.1.4 Attention-Based Approaches


    Numerous studies adopted the attention mechanism in their segmentation framework
    attention-based models have emerged as powerful tools. Unlike the conventional
    U-Net architecture, these models strategically integrate attention modules within
    both contracting and expanding paths, resulting in capturing essential features
    relevant to the lung region and overall segmentation accuracy. Kim et al. presented
    a self-attention-based deep learning model consisting of “X-attention and Y-attention
    modules” (Kim and Lee 2021). The X-attention module concentrates on local features,
    while the Y-attention module incorporates global context from deeper layers to
    effectively utilize global features. Both attention modules employ channel and
    spatial attention, enhancing the feature extraction process. The attention maps
    derived from these modules are multiplied and utilized in subsequent layers through
    residual learning. The proposed attention modules contribute to accurate pixel-level
    attention information, resulting in smooth segmentation masks with reduced noise.
    To overcome issues faced by previous models in properly segmenting lung areas,
    particularly in the presence of rib cage edges, irregularities, and changes in
    size and shape, researchers have introduced a novel segmentation model named “Attention
    RegSeg (ARSeg)” (Ghali and Akhloufi 2022). This method utilizes an attention mechanism
    to'
  merge: -1
  img_proc: true
