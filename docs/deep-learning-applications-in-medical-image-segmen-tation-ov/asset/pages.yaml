- pgno: 269
  md: 'The efficient operation of machine learning techniques hinges on extracting
    descriptive features. Identifying these features is often challenging, particularly
    in applications related to image understanding, an area still under active research.
    A strategic approach to address this challenge is the development of intelligent
    machines capable of autonomously learning and extracting the requisite features
    for image understanding. The CNN model stands out as an intelligent and successful
    model in this regard, and advancements in various architectures such as U-Net,
    SegNet, and W-Net have enabled the automatic learning and extraction of essential
    features for medical image understanding (Badrinarayanan et al. 2017; Ronneberger
    et al. 2015; Xia and Kulis 2017). Researchers have effectively utilized CNNs in
    various medical image understanding applications, including tumor detection and
    classification into benign and malignant categories (Ovalle et al. 2016). Skin
    lesion detection and identification of anomalies in optical coherence tomography
    images can also be detected using CNN (Kermany et al. 2018; Nasr-Esfahani et al.
    2016). Many researchers have also shown colon cancer detection, blood cancer detection,
    and heart abnormalities (Kiranyaz et al. 2016; Sirinukunwattana et al. 2016).
    Kallenberg et al. (2016) have shown how breast abnormalities are detected using
    CNN. Notably, CNN-based models like CheXNet, employed for classifying 14 different
    chest-related ailments, have demonstrated superior performance compared to the
    average expertise of human practitioners (Philips et al. 2020; Rajpurkar et al.
    2017).


    CNNs have emerged as a predominant force in the realm of COVID-19 detection through
    the analysis of chest X-rays and CT scans. COVID-19, a global pandemic, is rapidly
    spreading across the world. The commonly utilized test for detecting COVID-19
    infection is reverse transcription polymerase chain reaction (RT-PCR). While RT-PCR
    is considered the gold standard for COVID-19 testing, it is a complex, time-consuming,
    and labor-intensive process with limited availability and accuracy. In places
    facing a shortage of RT-PCR kits, chest X-rays could serve as an initial screening
    tool for COVID-19, offering a more accurate diagnosis. DL techniques have been
    employed by many researchers to classify chest infections and distinguish between
    COVID-19 and other ailments. An early model suggested for COVID-19 detection involved
    utilizing a basic pre-trained AlexNet model, which was fine-tuned using chest
    X-ray images. To improve the performance of the models, more training samples
    and better segmenting techniques are required (Hasan et al. 2022). Various factors
    like insufficient details about the study participants, the randomization process,
    and the absence of external validation have led individuals to reconsider the
    use of these diagnostic techniques for this disease (Montazeri et al. 2021).


    In the quest to advance methodologies for medical image segmentation, the significance
    of high-quality datasets cannot be emphasized enough. The challenges'
