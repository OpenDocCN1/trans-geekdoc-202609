- pgno: 117
  md: 'Thus, the model M1 is ER times likely to be the optimal growth model compared
    to M2. Likewise, the Bayesian weights and corresponding ER_BIC are also computed
    as given in equation 4.16 and 4.17:


    ```

    w_{BIC_k} = \frac{e^{-0.5\Delta BIC_k}}{\sum_{m=1}^{12} e^{-0.5\Delta BIC_m}},
    k=1, 2 ... 12 \quad (4.16)

    ER_{BIC} = \frac{w_{BIC_{M1}}}{w_{BIC_{M2}}} \quad (4.17)

    ```


    Therefore, the ER is an essential metric to assess the relative likelihood of
    a model with respect to other models. This enables better decision-making in model
    selection.


    # 4.3.4 Study of Hemispheric Differences in Myelination


    The growth model fitting is expanded to evaluate potential hemispheric differences
    in myelination. There are several changes in the pediatric brain including developmental
    and maturational aspects, such as increase in brain size and cortical folding
    patterns. In this context, it is interesting to investigate the differences in
    myelination progress between the right and left hemispheres of the developing
    brain.


    Primarily, we segment the hemispheres based on the inter-hemispheric fissure (IHF).
    The IHF is a deep groove that separates the right and left hemispheres. However,
    the IHF is not always oriented vertically to the image axis. There is a certain
    degree of rotational and translational offset. To identify the IHF, we propose
    a novel approach based on a pseudo midline (PML). For this, a horizontal projection
    of the extracted brain image (obtained in Section 3.2) is derived and its minimum
    is computed. The PML is designated as an imaginary line passing through this minimum
    point. This line is then rotated in small angular increments of 0.1° over the
    entire image. The rotated PML with zero or near-zero brain crossovers is considered
    the line of IHF. Using this IHF, the brain is split into its right and left hemispheres
    along with the myelinated regions, as shown in Figure 4.2.


    ![](img/b1cb9f9389f496c3199cc2e1e74e4626_117_0.png)


    Figure 4.2 Inter-hemispheric separation: (a) extracted brain image, (b) pseudo
    midline superimposed on the brain, (c) inter-hemispheric fissure superimposed
    on the brain, (d) separated hemispheres, and (e) demarcated MWM.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'After hemispheric separation, the MI values are obtained individually for the
    two hemispheres to study the inherent difference in myelin progress. The optimal
    growth model (obtained in Section 3.3) is fit in two ways:


    +   - Simple model based on combined right and left hemispheric MI values.

    +   - Complex model with two different curves for the right and left hemispheres.


    The statistical F test is utilized to compare the above models and identify the
    model of best fit. The F ratio is calculated(as in equation 4.18:


    $$F \text{ ratio} = \frac{(SS_{\text{simple}} - SS_{\text{complex}})/(\text{dof}_{\text{simple}}
    - \text{dof}_{\text{complex}})}{SS_{\text{complex}}/\text{dof}_{\text{complex}}}
    \quad (4.18)$$


    Here, $SS_{\text{simple}}$ and $SS_{\text{complex}}$ refer to the sum of squares
    values for the two models, whereas $\text{dof}_{\text{simple}}$ and $\text{dof}_{\text{complex}}$
    indicate their degrees of freedom. Subsequently, the $p$ value is derived and
    compared with the significance level ($\alpha = 0.05$), such that:


    +   - If $p < \alpha$, the complex model is the best suited to describe myelination
    progress in the individual hemispheres of the brain.

    +   - If $p \ge \alpha$, the simple model fits significantly better than the proposed
    complex model (Motulsky and Christopoulos 2003).


    # 4.3.5 Study of Myelination in Premature Babies


    As mentioned in Section 3.3, the computation of MI values and growth model fitting
    was done for full-term born babies. Nevertheless, there is considerable variation
    between the myelination patterns between premature and full-term births. This
    is attributed to the lower gestational time of preterm babies in the mother’s
    womb. Usually, term-born babies have a gestational age (GA) of 37–42 weeks, whereas
    premature babies have a much smaller GA and are segregated as follows:


    +   - extremely preterm (GA <28 weeks)

    +   - very preterm (GA: 28–32 weeks)

    +   - moderate/late preterm (GA: 32–37 weeks)


    The problem with premature births is that brain development is not completed at
    birth owing to its reduced intrauterine period. Once born, there are several physiological
    changes and variations in the external environment that affect brain maturation,
    especially WM myelination. Thus, it is essential to study preterm myelin progress
    and its relation to full-term myelination.


    We calculate the MI values for premature babies (MI_preterm). Using the optimal
    growth model for myelination of full-term babies (obtained in Section 3.3), the
    corresponding MI values for term births at equivalent age are computed ($\widehat{\text{MI}}_{\text{term}}$).'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Based on these metrics, the percentage lag in myelination (plagMI) of premature
    babies is given by equation 4.19:


    ```

    plag_MI = \frac{\widehat{MI}_{term} - MI_{preterm}}{\widehat{MI}_{term}} * 100

    (4.19)

    ```


    The advantages of the proposed plagMI index are as follows:


    +   * The metric enables a quantitative assessment of the delay or retardation
    in preterm myelination against full-term births.

    +   * It is useful in longitudinal studies of premature children to demarcate
    the age at which the myelination gap closes.

    +   * Given that preterm myelination is affected by various prenatal and postnatal
    conditions, such as birth complications, congenital anomalies, and environmental
    aspects, it is clinically significant to closely monitor myelin progress and detect
    anomalies early.


    # 4.4 Results


    # 4.4.1 Brain Extraction, Myelin Segmentation, and 3D Visualization


    The primary step in the segmentation of myelin is brain extraction. Figure 4.3
    depicts the various stages involved in MWM segmentation, namely, pre-processing
    and skull stripping, extraction of brain and CSF, and finally segmentation of
    myelinated tissue. The obtained segmentation results are validated against the
    ground truth, that is, reference manual annotation. The major strength of our
    algorithm is its capacity to handle a wide age range (0–2 years) of subjects and
    its ability to segment without using any brain atlases or templates.


    Furthermore, we perform a 3D visualization of myelin progress as shown in Figure
    4.4. This is a salient aspect of myelin study as it enables a holistic overview
    of brain development and myelin maturation across three important pediatric phases,
    namely, neonatal (<28 days), early infancy (1 month to 1 year), and late infancy
    (1 to 2 years) stages.


