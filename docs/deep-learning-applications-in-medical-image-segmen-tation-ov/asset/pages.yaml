    # ## 9.2 Methodology


    The framework of the proposed approach comprises three distinct stages: pre-processing,
    data enhancement, and post-processing. During the pre-processing phase, resampling
    and data generation procedures are carried out. As a result, the image enhancement
    operation boosts the identification rate of subcomponents, while post-processing
    conducts segmentation of the enhanced cell images. Pre-processing operations were
    conducted on three biomedical databases: Acute Lymphoblastic Leukemia International
    Database (ALL-IDB) (ALL-IDB 2024), JTSC (Zheng et al. 2018), and CellaVision (Zheng
    et al. 2018). The image samples from these datasets encompass leucocytes of five
    different types (lymphocytes, monocytes, neutrophils, basophils, and eosinophils),
    featuring varying dimensions that were standardized through resampling to a common
    size. Subsequently, once the resampling process is complete, two distinct appearances
    (Magenta and Saturation) of biological images are generated. These color channels
    contain high luminance information crucial for discriminating cells from background
    textures (Makem and Tiede u 2020).


    The outcomes of pre-processing are directed toward the multilevel decomposition
    and fusion phase, where a significant enhancement in the quality of biological
    data occurs. We have constrained the data improvement process to four distinct
    levels due to the risk of image quality deterioration with further enhancements.
    This operation involves data decomposition and integration strategies. The medical
    observation decomposition is executed using latent low-rank due to its resilience
    to noise and its ability to minimize insufficiently sampled features (Liu and
    Yan 2011). This process, illustrated in Figure 9.2, generates two different components
    (basic and detailed) at each level, with one addressing local features (structural
    properties) and the other encompassing'
