    # ## 7.5.1.6 COVID-19 Radiography Database


    The “COVID-19 Chest X-ray Database” is a vast repository of medical images assembled
    by scholars from the “The University of Dhaka, Qatar University, Doha, and Bangladesh,”
    in collaboration with partners from “Pakistan and Malaysia,” along with medical
    professionals. This dataset has been progressively released in stages, with subsequent
    updates increasing the volume of images across different categories. All the CXR
    images are in PNG format and have a resolution of 299×299 pixels. The dataset
    is continuously evolving, with updates provided in stages. As of the latest information,
    it includes “3616 COVID-19 positive cases,” “10,192 normal images,” “6012 lung
    opacity images,” and “1345 viral pneumonia images.” The commitment is to regularly
    update the database with new radiographs for COVID-19 pneumonia patients. This
    database serves as a great resource for scientists to generate significant scholarly
    contributions toward addressing the COVID-19 pandemic. (Kaggle (2022)).


