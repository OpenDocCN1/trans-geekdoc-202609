    # Figure 2.1 Overview of convolutional neural network.


    The term “translation invariance” describes this critical quality. One of CNN’s
    main benefits is that its filters do not have to be designed by hand. Instead,
    they may be learned automatically by back-propagation training, in which the reverse
    pass employs the convolution operation with spatially inverted filters (Litjens
    et al. 2017; Shi et al. 2021). Stacking CNN’s convolutional layers is a highly
    effective technique. Simple qualities like lines and boundaries are learned by
    the layers closest to the input, whereas more complicated features like shapes
    are learned by the layers farther into the model. CNN is a regularized MLP’s variant.
    The neurons in an MLP are all interconnected with each other. Over-fitting is
    possible due to the fully connected nature of these networks but can be avoided
    by regularization. Weights are typically added to the loss function in traditional
    regularization procedures. CNN, on the other hand, employs a distinct regularization
    method, one that makes use of the hierarchical pattern present in the data to
    reduce connectivity and complexity by assembling more complex patterns out of
    smaller and simpler patterns (Zhou et al. 2021; Kalchbrenner et al. 2014). Traditional
    algorithms’ filters are hand engineered, but CNN can learn them. This independence
    from additional feature engineering knowledge is its major strength. Some of the
    well-known variations of CNN include Alex-Net, Inception, ResNet, VGG, Squeeze-Net,
    and so on.


