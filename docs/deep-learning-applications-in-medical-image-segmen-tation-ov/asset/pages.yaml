    # 2.3.1.7 Multi-organ


    To protect vital organs during radiation planning, organs at risk (OAR) must be
    clearly defined. Before radiation for nasopharyngeal cancer, more than 20 organs
    must be precisely segmented. Since then, deep learning approaches have outperformed
    OAR segmentation due to recent developments in deep learning. Multi-organ segmentation
    is notoriously challenging due to the common occurrence of organ imbalances. The
    U-Net architecture has shown to be highly effective at segmenting medical images,
    making it the de facto standard. The features learned by ordinary convolution
    layers, on the other hand, are not distinguishable. To solve this issue, Wang
    et al. (2019d) suggest a unique architecture known as the densely connected deep
    U-Net (DC UNet). The DC U-Net comprises three components: dense connections, selective
    deconvolution layers incorporating upsampling, and a trans-convolutional filling
    function. To segment OARs in thoracic CT scans, Vesal et al. (2019) designed a
    deep learning framework for the following organs and structures: heart, oesophagus,
    trachea, and aorta. The method suggested employed a U-Net-inspired network'
  merge: -1
