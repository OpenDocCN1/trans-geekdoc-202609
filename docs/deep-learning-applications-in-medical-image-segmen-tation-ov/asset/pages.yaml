    # ## 8.3 Generative Adversarial Networks


    This section presents the core principles of GANs and elucidates various notable
    variations. These variants encompass a spectrum of advancements within the GAN
    framework, incorporating conditional generative adversarial networks (CGANs),
    deep convolutional generative adversarial networks (DCGANs), information generative
    adversarial networks (InfoGANs), auxiliary classifier generative adversarial networks
    (AC-GANs), Wasserstein generative adversarial networks (Wasserstein-GANs), cycle
    generative adversarial networks (CycleGANs), and progressively growing generative
    adversarial networks (ProGANs), among others.


    # ### 8.3.1 Vanilla GAN


    One of the most highly contested subjects within the field of ML is the concept
    of GANs, a generative technique introduced by Goodfellow and his colleagues'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'in 2014 (Goodfellow et al. 2020). The remarkable success of GANs in a range
    of applications such as image processing (Ledig et al. 2017; Kazeminia et al.
    2020), artistic style transfer (Knyaz et al. 2019; Zhang et al. 2019), classification
    (Israel et al. 2017), medical imaging, and image generation (Li et al. 2018; Lin
    et al. 2017) underscores the substantial progress GANs have made in various computer
    vision tasks. GAN models have been proposed in numerous variations across different
    domains over time. In recent years, GANs have emerged as one of the most actively
    researched algorithms in the realm of DL.


    Within GANs, there are two crucial components: the generator and the discriminator.
    These two components can be implemented using any differentiable system that transforms
    data from one space to another, although neural networks are commonly employed
    for this purpose. MLPs were utilized in the generator G and discriminator D of
    the initial GANs. The role of the generator is to create new data samples while
    attempting to mimic the distribution of real-world examples. On the other hand,
    the discriminator typically functions as a binary classifier, aiming to distinguish
    between generated instances and real instances.


    GANs are optimized through a Minimax optimization problem. This optimization process
    converges at a saddle point, which represents the maximum for the discriminator
    and the minimum for the generator. In essence, the goal of GAN optimization is
    to reach Nash equilibrium, at which point the generator accurately captures the
    distribution of real-world examples.


    # 8.3.1.1 GAN Framework


    The GAN framework (as illustrated in Figure 8.1) proves to be quite straightforward
    when both models are neural networks. To grasp the generator distribution, Pg,
    regarding the data, x, a prior is established for input noise variables known
    as Pz(z) (Goodfellow et al. 2020), with z representing the noise variable. The
    generator then functions as a mapping from the noise space to the data space,
    denoted as G(z, θg). This mapping is executed using a neural network with parameters
    θg. On the other hand, another neural network, D(x, θd), is defined, also equipped
    with parameters θd. The output of D(x) provides a singular scalar, representing
    the likelihood that x originates from the real training data rather than being
    a product of the GAN model G. The aim of training the discriminator, D, is to
    enhance its


    ![](img/b1cb9f9389f496c3199cc2e1e74e4626_210_0.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'ability to correctly classify both genuine training data and synthetic instances
    produced by the generator G. Simultaneously, G is trained to minimize the term
    log (1−D(G(z))).


    In the realm of GANs, various objective functions can be applied. The initial
    objective function in GANs involves a minimax game between G and D, which can
    be expressed as follows (Equation 8.1):


    ```

    \frac{Min}{G} \frac{Max}{D} V(D, G) = E_{x \sim p_{data}(x)}[\log D(x)] + E_{z
    \sim p_z(z)}[\log(1 - D(G(z)))] \tag{8.1}

    ```


    log D (x) denotes the cross-entropy between [1 0]^T and [D (x) 1-D (x)]^T log
    (1−D(G(z))) denotes the cross-entropy between [1 0]^T and [D (G (z)) 1−D (G (z))]^T


    The ideal solution for a fixed G is given in Equation 8.2:


    ```

    D^*_G(x) = \frac{p_{data}(x)}{p_{data}(x) + p_g(x)} \tag{8.2}

    ```


    In certain situations, the gradient produced by Equation 8.1 may prove insufficient
    for effective learning by G. Early in the training process, G may generate examples
    that significantly deviate from the training data, leading to D''s confident rejection
    of these initially generated instances. This often results in log (1−D(G(z)))
    becoming saturated. As an alternative, instead of minimizing log (1−D(G(z))),
    G can be trained to maximize log(D(G(z))). Consequently, the generator''s cost
    can be expressed in Equation 8.3:


    ```

    J(G) = E_{z \sim p_z(z)}[-log(D(G(z)))] = E_{x \sim p_g}[-log D(x)] \tag{8.3}

    ```


    # 8.3.2 GAN Variants


    In the following subsection, we will provide an introduction to a noteworthy GAN
    variant.


    # 8.3.2.1 InfoGAN


    The InfoGAN (Chen et al. 2016) introduced a different approach to noise vectors.
    Instead of using a single unstructured noise vector, it proposed decomposing the
    input noise into two distinct components: z, which represents incompressible noise,
    and c, known as the latent code. This latent code is designed to capture the essential
    structured semantic features found in the real data distribution. InfoGAN (Chen
    et al. 2016) seeks to minimize the objective function given in Equation 8.4:


    ```

    \frac{min}{G} \frac{max}{D} V_{info}(D, G) = V(D, G) - \lambda I(c; G(z, c)) \tag{8.4}

    ```


    +   * V(D, G) stands for the original GANs'' objective function


    +   * G(z, c) represents the generated example'
  merge: -1
  img_proc: true
- pgno: 212
