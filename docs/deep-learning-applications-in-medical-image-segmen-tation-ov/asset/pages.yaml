    # 9.3 Result and Discussion


    Medical images often suffer from various types of outliers, leading to inappropriate
    discrimination of cell imaging subcomponents. Additionally, many relevant studies
    have recognized the challenges associated with processing biomedical imaging datasets
    (Jia et al. 2021; Makem and Tiedeu 2020). Some automated approaches, such as pattern-based
    segmentation and boundary cell segmentation, result in under-segmentation and
    over-segmentation of data points due to noisy data clusters. To address this issue,
    we have devised an improvement in our research that focuses on segmenting enhanced
    biological images. The objective of this approach is to mitigate misregistration
    of data points to enable smooth extraction of leucocytic cells.


    The proposed approach is evaluated using three different biological databases:
    the ALL-IDB dataset, CellaVision dataset, and the JTSC database. The ALL-IDB contains
    lymphocytes from acute leukemia patients, with segmented and non-segmented subsets
    available. For evaluation purposes, we utilized the non-segmented samples from
    this subset. The medical samples in this subset vary in dimension, necessitating
    resampling to a common size. The CellaVision and JTSC datasets comprise leukocytes
    of five different types: basophils, eosinophils, monocytes, lymphocytes, and neutrophils.
    These datasets are publicly accessible, and manual annotation files are provided
    for all of them. We adopted a specific ratio (80 : 20) for training and testing
    the model.


    Evaluation metrics: The performance of the model is assessed using various metrics
    (Dice 1945; Muthu and Murali 2021), including the Jaccard Index (J), F1 measure,
    accuracy, precision, recall, and specificity. The Jaccard Index (J) gauges the
    degree of overlap between the model''s results and the annotation file masks,
    ranging from 0 (indicating imperfect segmentation) to 1 (denoting perfect segmentation).
    The F1 measure strikes a balance between precision and recall, with values ranging
    from 0 (signifying an imbalanced harmonic mean) to 1 (representing a balanced
    harmonic mean).


    Accuracy is a metric that computes the overall correctness of the model, where
    perfect accuracy is indicated by a value of 1 and imperfect accuracy by 0. Precision,
    also known as the true positive rate, evaluates the accuracy of true positive
    (TP) predictions relative to the total positive predictions (TP + FP [false positive]),
    with'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'values between 0 and 1. Higher precision values correspond to lower false positive
    rates. Specificity, also referred to as the true negative rate, measures the accuracy
    of true negatives (TN) relative to the total negative predictions (TN + FN [false
    negative]). A higher specificity value suggests a lower false positive rate. Recall,
    or sensitivity, evaluates the correctness of all relevant instances and ranges
    from 0 to 1, with higher values indicating fewer false negatives. It is computed
    by dividing true positives (TP) by the sum of false negatives (FN) and true positives
    (TP).


