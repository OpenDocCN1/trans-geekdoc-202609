    The model was evaluated on combined datasets that are publicly available. CHS-Net
    addresses the scarcity of COVID-19 data. The model, inspired by advanced architectures
    such as U-Net, Google’s Inception, and residual networks, employs a multistage
    approach for the segmentation and extraction of features. CHS-Net achieves a 95%
    accuracy in segmenting the lung mask and the infected region. Recently, the authors
    introduced a novel approach named “Wavelet U-Net++,” (Akila Agnes et al. 2024)
    merging the “U-Net++ architecture with wavelet pooling.” This approach uses Haar
    wavelet transform to downsample the feature maps in the encoder, capturing both
    high- and low-frequency details to improve segmentation accuracy, especially for
    small and irregular nodules. Evaluation conducted on the LIDC-IDRI dataset, consisting
    of 1018 CT images, yielded promising findings, with a mean Dice coefficient of
    0.936 and a mean IoU of 0.878. Furthermore, these advancements underscore the
    ongoing challenges in lung segmentation, necessitating innovative solutions for
    improved diagnostic accuracy (Table 7.1).


    # 7.5 Data Sources and Datasets


    Data plays a vital role in advancing computerized methods, particularly in the
    domain of “CAD” systems. Developing these systems requires substantial sets of
    images as they provide a foundation for training algorithms, testing their effectiveness,
    and comparing the performance of different techniques. However, assembling a sizable
    medical dataset presents challenges due to legal and privacy concerns. Despite
    this, specific research organizations have prepared datasets for both “chest X-rays
    and CT scans,” making them publicly accessible for research purposes. Numerous
    researchers depend on the datasets listed below for their studies, which are fundamental
    for training and evaluating deep learning models.'
