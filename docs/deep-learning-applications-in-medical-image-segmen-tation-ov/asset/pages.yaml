    # ## 6.3.3 Monitoring the Progression of the Disease and Quantitative Analysis


    Techniques for segmenting images based on DL are also essential for quantitative
    analysis and tracking the course of illness. These methods allow automated measurements
    of retinal properties such as macular thickness, vascular caliber, and optic disc
    size by segmenting retinal pictures. These measures may provide insightful information
    about how a disease progresses and how it responds to therapy. There are several
    benefits of being able to use DL-based segmentation for quantitative analysis
    of retinal characteristics. First of all, it lessens the need for labor-intensive
    and prone to human mistakes’ manual measurements. Second,'
