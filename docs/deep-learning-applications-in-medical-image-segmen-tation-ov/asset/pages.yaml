  md: '# # Segmentation and Quantitative Analysis of Myelinated White Matter Tissue
    in Pediatric Brain Magnetic Resonance Images


    Chelli N. Devi¹, Anupama Chandrasekharan², V. K. Sundararaman³, and Zachariah
    C. Alex⁴


    ¹Department of Biomedical Engineering, Kalasalingam Academy of Research and Education,
    Srivilliputhur

    ²Department of Radiology, Sri Ramachandra University, Chennai, India

    ³Independent Consultant, MR Imaging and Former Adjunct Professor, VIT University,
    Vellore, India

    ⁴School of Electronics Engineering, VIT University, Vellore, India


    # ## 4.1 Introduction


    The pediatric brain represents the growing and maturational stage of overall brain
    development. The phase from birth to 2 years is very important in a child’s brain
    growth and is characterized by an increase in brain size, volume, nerve maturation,
    and impulse transmission. Particularly, the stage from birth to the first 28 days
    is called neonatal period, while the duration from 29 days to 1 year is early
    infancy, and the second year of life is called late infancy. These three phases
    are crucial in brain development and are marked by extensive maturation of brain
    tissues.


    The human brain comprises three major tissues: grey matter (GM), white matter
    (WM) and cerebrospinal fluid (CSF) (Devi et al. 2016b). Each component has a distinct
    functional functionality. The GM is composed of several elevations and grooves
    that play a major role in human cognition, sensory perception, and learning. WM
    is located in the interior of the brain and aids nerve impulse transmission. This
    is enabled by the myelin sheaths in the WM that speed up the conduction of nerve
    signals. The CSF surrounds the brain in the cranial cavity and protects the brain
    from injuries and shocks. Although each brain tissue has a unique physiological
    role in brain development, the maturation of WM (especially, its myelination)
    is considered clinically significant.


    Myelination denotes the formation of a protective myelin sheath around the neuronal
    axon. This sheath has many junctions called the nodes of Ranvier that enable faster
    impulse transmission. In fact, this myelination is a unique aspect of'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'higher animals or vertebrates that enables them to recognize and respond faster
    to stimuli. The characteristics of normal human myelination are as follows:


    +   - Myelination begins in the prenatal stage of the baby (i.e. before birth).
    The WM of the brain is not completely myelinated at birth. It progresses during
    the neonatal and infancy stages and continues into the early pediatric phase (Cowan
    2002). Most of the myelination is completed during the initial 2 years of the
    child, making its study in the pediatric brain a clinically relevant area.

    +   - Besides, myelination progresses in a predefined and orderly fashion. To
    understand this, three simple neuroanatomic axioms were laid down: myelin formation
    proceeds from the caudal to rostral, posterior to anterior, and central to peripheral
    areas (Welker and Patton 2012). Nevertheless, there are a few exceptions to this
    general rule.

    +   - In addition, the development of myelin is not uniform across all human beings.
    A certain degree of variation between babies in the myelination process is normal
    and expected (Knaap and Valk 2005).


    Furthermore, the reduced incidence of malformation of myelin results in various
    disorders such as hypomyelination (indicates a lack or deficiency of myelin formation),
    dysmyelination (represents irregular or abnormal myelination), and retarded myelination
    (i.e. delayed myelin deposition) (Knaap and Valk 2005). Thus, it is imperative
    to closely study, monitor, and analyze myelin progress in babies.


    The segmentation and analysis of myelinated WM (MWM) was initially based on manual
    and histological tissue analyses. However, this process is cumbersome and time-intensive.
    The usage of magnetic resonance imaging (MRI) enables the visualization and quantification
    of brain tissues in greater detail (Devi et al. 2016a; Devi et al. 2016c). Several
    qualitative works based on MRI are currently available for the study of MWM in
    the human brain. These involve a mere description of the appearance and progression
    of age-specific myelination (Knaap and Valk 2005; Welker and Patton 2012). The
    quantitative studies on myelination entail various advanced techniques such as
    relaxation time mapping and myelin water fraction (MWF) imaging. For instance,
    Deoni et al. utilized a novel multi-component driven equilibrium single pulse
    observation (mcDESPOT) to map myelin deposition (Deoni et al. 2011). Subsequently,
    they used relaxation time mapping and MWF imaging to evaluate cortical myelination
    in young children (Deoni et al. 2012; Deoni et al. 2015). Likewise, Chonka et
    al. investigated the interdependency between cortical maturation and WM myelin
    formation based on MWF imaging (Chonka et al. 2016). Dean et al. analyzed WM and
    myelin growth in male babies using MWF maps (Dean et al. 2014). In their follow-up
    work, the age of healthy pediatric cases was estimated with quantitative MWF maps
    (Dean et al. 2015) and myelin g-ratio was computed by mcDESPOT and neurite orientation
    dispersion'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'and density imaging (Dean et al. 2016). Recently, Travis et al. coupled diffusion
    MRI and quantitative T1 relaxometry to examine premature and term-birth myelination
    in older children (Travis et al. 2019). Conversely, magnetization prepared rapid
    acquisition gradient echo (MPRAGE) technique was utilized to map relaxation and
    myelination rates in subjects aged between 3 months and 6 years (Kuhne et al.
    2021). The latest works in the literature deploy T1/T2 mapping to quantify myelination
    in young infants (Filimonova et al. 2023) and early adolescents (Dipnall et al.
    2023).


    Despite the availability of many such quantitative studies to map ongoing myelination
    in the pediatric brain, they are fraught with several shortcomings:


    +   Primarily, these works entail additional quantitative scanning techniques
    other than the usual diagnostic scan employed in clinics and hospitals. This increases
    the time, effort, and monetary cost associated with the MRI scan. The longer time
    also makes it difficult to image the young babies who are usually restless and
    uncooperative.


    +   Further, the current studies often focus more on older babies, such as 3-month-olds,
    (Deoni et al. 2011; Deoni et al. 2012; Dean et al. 2014; Dean et al. 2015; Dean
    et al. 2016) 1-year olds, (Deoni et al. 2015) older infants, (Kuhne et al. 2021)
    8-year-olds (Travis et al. 2019), and young adolescents (Dipnall et al. 2023).
    There is a paucity of work dealing with the myelination of neonates and very young
    infants.


    +   Apart from this, various myelination-related challenges make the imaging and
    segmentation of MWM a daunting task (Devi et al. 2014a; Devi et al. 2015). This
    includes the apparent myelination on Magnetic Resonance (MR) images, that is,
    myelination as it appears on T1 and T2 scans. A time delay is observed between
    the visualization of myelin tissue on T1 and T2 scans (MWM is viewed later on
    T2 images). Besides, the age-specific process of myelin deposition necessitates
    numerous atlases and training images for accurately mapping myelination throughout
    early childhood (Barkovich et al. 1988). Moreover, myelin formation is not an
    all-or-none process; the myelination of WM is a slow and gradual phenomenon that
    cannot be fully detected on MR images (Knaap and Valk 2005). Coupled with this,
    there are vast differences in the myelination progress between premature babies
    and full-term births.


    To address the above limitations, we put forth a new and automated method for
    the segmentation, study, and quantitative analysis of MWM in the pediatric brain.
    The contributions of our work are listed below:


    +   1) We propose a novel automated approach for brain extraction and myelin segmentation
    using the weighted localized Tsallis entropy thresholding technique. We also develop
    a unique three-dimensional (3D) model for the visualization of WM myelination.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '+   2) Further, a quantitative “myelin index” (MI) is introduced to measure
    the ratio of WM that is myelinated. To our knowledge, this is the first study
    to objectively quantify the extent of myelination by a reproducible metric based
    on MWM segmentation from T1 to T2 MR images.

    +   3) Growth model fitting is used to analyze the differences in myelination
    between the right and left hemispheres of the brain.

    +   4) The myelination pattern in preterm babies is closely monitored and compared
    with regular-term-born babies.


    This chapter is structured as follows. Section 2 presents an overview of the recent
    publications in myelin segmentation and analysis. While Section 3 elucidates the
    proposed methodology, Section 4 details the results and outcomes of the study.
    Section 5 discusses and compares the findings with state-of-the-art methods. Finally,
    Section 6 summarizes the salient aspects of this research work.


    # 4.2 Literature Review


    # 4.2.1 Segmentation of MWM in the Pediatric Brain


    Although several techniques are available in the literature to segment the pediatric
    brain, (Prastawa et al. 2005; Xue et al. 2007; Weisenfeld and Warfield 2009; Melbourne
    et al. 2012; Gui et al. 2012; Gousias et al. 2013; Anbeek et al. 2013; Egekeher
    et al. 2013; Makropoulos et al. 2014; Wang et al. 2015) only very few approaches
    detect the MWM tissue separately (Prastawa et al. 2005; Weisenfeld and Warfield
    2009; Melbourne et al. 2012; Gui et al. 2012; Anbeek et al. 2013; Egekeher et
    al. 2013). This is attributed to the various difficulties in imaging and segmenting
    myelin tissue along with the pertinent problems of limited dataset availability,
    anatomic differences in the pediatric brain, and variations caused by brain anomalies.
    In this section, we elaborate on the recent methods available for myelin delineation.


    Initially, Prastawa et al. proposed a segmentation technique using probabilistic
    brain templates and graph clustering (Prastawa et al. 2005). The neonatal brain
    was classified into MWM, unmyelinated WM (UWM), GM, and CSF. The approach yielded
    an average Dice ratio of 0.61–0.77 for myelin demarcation. Likewise, Weisenfeld
    and Warfield postulated an algorithm for detecting the cortical and subcortical
    GM, MWM, UWM, and CSF based on T1 and T2 scans (Weisenfeld and Warfield 2009).
    The study entailed spatial atlas priors and tissue prototypes for precise delineation.
    The work achieved a mean Dice coefficient of 0.72 for myelin tissue.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'Similarly, Melbourne et al. implemented an adaptive segmentation with manual
    tissue priors as atlases (Melbourne et al. 2012). The method detected eight tissues,
    namely, MWM, WM, deep and cortical GM, cerebellum, brainstem, CSF, and ventricles
    on the NeoBrainS12 database. The separate segregation of ventricles and myelin
    tissue is an important aspect of this approach. Conversely, Gui et al. put forward
    a completely atlas-free technique for pediatric brain segmentation based on morphology
    and tissue structure (Gui et al. 2012). Both global and tissue-specific classification
    was attained, that is, intracranial cavity, brainstem, cerebellum, right and left
    hemispheres, MWM, UWM, cortical and subcortical GM, and CSF. The algorithm was
    found effective in anomalous cases such as ventriculomegaly.


    Anbeek et al. formulated probabilistic atlas segmentation on a large cohort of
    108 newborn babies (Anbeek et al. 2013). The cortical and central GM, UWM, MWM,
    and CSF in ventricles and extracerebral space, brainstem, and cerebellum were
    identified. However, the study recorded lower accuracy values for MWM delineation
    with an average Dice score of 0.47. Similarly, Egekher et al. entailed multiple
    atlases combined with supervised classification (i.e. k-nearest neighbors and
    Bayes classifier) and extensive post-processing (Egekher et al. 2013). The pediatric
    brain was divided into the cortical GM, UWM, MWM, and basal ganglia and thalami
    (BGT), cerebellum, brainstem, ventricles, and CSF. Despite obtaining mean Dice
    ratios between 0.77 and 0.93 for the other tissues, myelin detection attains a
    low segmentation accuracy of 0.55.


    Recently, Moeskops et al. performed an all-inclusive brain segmentation study
    targeting young children, early adults, and aged people (Moeskops et al. 2015).
    The following tissue classes were demarcated using deep learning networks: MWM,
    UWM, cortical GM, cerebellum, brainstem, and BGT. The salient aspect of the work
    is the use of single-modality images (either T1 or T2). This approach reported
    good performance for MWM with a Dice coefficient of 0.69 and 0.56 on babies at
    30 weeks and 40 weeks, respectively. Alternatively, McAllister utilized synthetic
    MR scans to map the age-dependent increase in GM, WM, CSF, and MWM volumes (McAllister
    et al. 2017). A pediatric database with normal subjects aged between 0.1 and 21.5
    years was created. The analysis revealed a rapid linear increase of MWM in the
    initial 18 months and a subsequent gradual rise during early childhood.


    # 4.2.2 Qualitative and Quantitative Study of Myelination


    Various methods and imaging techniques are available for both qualitative and
    quantitative mapping of the myelination process of the pediatric brain. The most'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'basic of these is the anatomical MR imaging based on T1 and T2 weighted images.
    The myelination cycle is viewed as three different contrasts on the MRI scans
    (Wang et al. 2015):


    +   - neonatal phase (birth – 28 days): inverted tissue contrast compared to adult
    brain, that is, hypointensity of WM on T1 scans and hyperintensity on T2 images);

    +   - isointense stage (around 6 months): marked by poor WM – GM contrast;

    +   - adult-like appearance (more than 1 year): hyperintensity of WM on T1 images
    and hypointensity on T2 scans (similar to the adult brain).


    Apart from this, diffusion MRI and diffusion tensor imaging (DTI) are also utilized
    to assess WM connectivity and maturation. Recently, high angular resolution diffusion
    imaging has been employed to estimate the orientation and distribution of WM tracts
    and fibers (Dubois et al. 2021). Besides, many other quantitative techniques,
    such as magnetization transfer, susceptibility-weighted MRI, and perfusion imaging,
    are entailed to study WM myelination in the pediatric brain.


    Particularly, Travis et al. combined diffusion MRI and quantitative relaxometry
    to analyze WM differences, especially in the corpus callosum (Travis et al. 2019).
    The corpus callosum was divided into four zones based on its location in the brain
    and the growth trajectory of each zone was compared between premature and full-term
    babies. Similarly, Grotheer et al. also integrated diffusion and quantitative
    MRI to validate the various developmental hypotheses of myelination in the child’s
    brain (Grotheer et al. 2022). The results of the work revealed that myelination
    pattern is not uniform and increases in the inferior-superior and anterior–posterior
    directions.


    In contrast, Kuhne et al. utilized MPRAGE and MP2RAGE sequences to evaluate myelination
    in brain anomalies and pathologies (Kuhne et al. 2021). Rapid myelination progress
    was observed in the corpus callosum, while reduced myelin deposition was found
    in cases of hypomyelination and dysmyelination. Thus, a reference model to gauge
    atypical myelin and brain abnormalities was developed. Recently, many researchers
    have involved T1/T2 mapping to obtain specific information on WM myelination.
    The major merit of this technique is the widespread availability of T1 and T2
    images, coupled with their faster acquisition. Dipnall et al. carried out a detailed
    examination of myelination tracts from late childhood to the early adolescent
    stage (Dipnall et al. 2023). They also studied the myelination differences between
    male and female children. The research work concluded that while there was a significant
    change in brain microstructure and WM myelination between childhood and adolescent
    phases, no notable variation was found based on the subject’s sex. Likewise, T1/T2
    mapping was implemented in 94 neonates and infants with normal brain scans by
    Filimonova (Filimonova et al. 2023). The results showed an initial rapid rise
    in WM myelination during'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'the early months, followed by a gradual reduction subsequently. The relationship
    between the baby''s age and the extent of myelination was perceived to be nonlinear
    in this study.


    # 4.3 Methodology


    The proposed methodology is divided into four sections, namely, extraction of
    the brain from pediatric MRI scans along with MWM delineation, computation of
    MI and model fitting, study of myelination differences between the right and left
    brain hemispheres, and analysis of myelination in preterm born babies. The technical
    details of each phase are elucidated below.


    # 4.3.1 Input Datasets


    The sample consists of pediatric brain MR images of 40 babies acquired from the
    Department of Radiology, Sri Ramachandra University, Chennai, India. The babies
    were aged between 1 day and 2 years at the time of scan. Their age distribution
    is as follows:


    +   - 30 babies born preterm (with gestational age between 30 and 33 weeks) and
    scanned at 40 weeks term-corrected age.

    +   - 10 older babies aged 7 weeks, 9.6 weeks, 10 weeks, 2.9 months, 5.5 months,
    10 months, 11 months, 16.3 months, 18.1 months, and 21.5 months.


    The MR parameters used for imaging are presented below:


    +   - Scanner: Signa HDxt MR machine with field strength 1.5 Tesla.

    +   - T1 images: Repetition time (TR) – 500 ms, echo time (TE) – 12 ms, flip angle
    – 75°, voxel size – 0.3516 × 0.3516 × 4 mm³.

    +   - T2 images: TR – 5400 ms, TE – 117.488 ms, flip angle – 90°, voxel size –
    0.3516 × 0.3516 × 4 mm³.


    # 4.3.2 Pediatric Brain Extraction and Myelin Segmentation


    The proposed flow for brain extraction and demarcation of MWM is shown in Figure
    4.1. Primarily, the acquired MR images are pre-processed and skull-stripped. Pre-processing
    is based on contrast-limited adaptive histogram equalization technique. Whereas,
    we propose a new automatic histogram valley-based thresholding approach for skull
    stripping. This involves obtaining the MR scan''s histogram, followed by smoothing
    and removal of spurious peaks. The smoothed histogram houses two peaks; the lower
    peak corresponds to brain tissue, while'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/b1cb9f9389f496c3199cc2e1e74e4626_113_0.png)


    Figure 4.1 Flow chart of the proposed method.


    the higher intensity peak indicates the skull. The valley between these two peaks
    is determined and used as intensity threshold in skull stripping.


    The next stage entails brain extraction. Initially, the CSF is detected by the
    Chan-Vese active contour model (Chan and Vese 2001). Subsequently, the brain is
    identified by a series of two steps, that is, single largest component analysis
    and gray level co-occurrence matrix (GLCM) based approach (Devi et al. 2014b).
    The largest component of the brain is obtained by equation 4.1:


    $I_{brain} = C(\text{argmax } A(i)), \quad 1 \le i \le n$ (4.1)


    where A(i) denotes the area of each component C(i), i = 1, 2 ... n.


    For extracting the total brain volume, the GLCM matrix is computed for each component
    with offset d = 1 and \(\theta = 0^{\circ}\). Using this matrix, the textural
    features are derived. Of these, the inverse difference moment (IDM) is given in
    equation 4.2:


    $IDM = \sum_u \sum_v \frac{1}{1+(u-v)^2} p(u, v)$ (4.2)


    where p(u, v) is the GLCM matrix element at location (u, v). IDM is a measure
    of the component''s homogeneity in the brain image. Based on experimental investigation,
    a homogeneity threshold of 80% is set for total brain extraction.


    Subsequently, the MWM tissue is segmented from the extracted brain. For this,
    a novel weighted localized Tsallis entropy thresholding technique is proposed.
    The traditional Tsallis entropy method entails global threshold. We introduce
    a patch-based local thresholding approach. The brain image is first divided into
    many uniform blocks of equal dimension (in increments of 5 pixels). Tsallis entropy
    threshold is applied to each individual block and the final output is concatenated.
    In addition, a majority voting mechanism is utilized for detecting MWM tissue.
    This ensures that spurious detections and outliers are eliminated from the result
    (Devi et al. 2017).


    To further improve segmentation performance, especially in the peripheral areas,
    we incorporate a new weighting mechanism. The entropy output at each block is
    weighed according to its similarity with the ground truth of myelin segmentation.
    For this, two sets of weights are obtained. While weights w1 are computed from
    all datasets, weights w2 are acquired after age-based segregation of the input
    datasets.


    The total 40 input datasets are randomly split in the ratio 75 : 25 for training
    and testing, respectively. The leave-one-out cross-validation is used for training'
  merge: -1
  img_proc: true
- pgno: 114
  md: '(Wang et al. 2015). Based on this cross-validation, weights w1 are derived
    as follows. For every training dataset d_t(t = 1, 2...29), the corresponding entropy
    result at each block size s is obtained as e_ts(t = 1, 2...29), (s = 5, 10...50).
    Given that the manual reference segmentation for myelin in each dataset d_t is
    denoted by ref_t, the similarity value is represented by equation 4.3:


    simval_{ts} = \frac{2 |e_{ts} \cap ref_t|}{|e_{ts}| + |ref_t|} (4.3)


    Weights w1(s) are calculated based on these similarity values as given in equation
    4.4:


    w_1(s) = \frac{1}{29} \left( \sum_t simval_{ts} \right) (4.4)


    Thus, the final result E is computed based on the individual entropy outcomes
    e_s(s = 5, 10...50) as given in equation 4.5:


    E = \sum_s w_1(s) * e_s (4.5)


    On the other hand, weights w2 are age specific. They are designed to take into
    account the age-based changes in myelination of WM. The input datasets are split
    into two groups, that is, neonates (less than 28 days) and infants (older than
    one month). In each group, the leave-one-out cross-validation approach is used
    in weight calculation as in equations 4.6 and 4.7. Therefore:


    w2_{neonate}(s) = \frac{1}{29} \left( \sum_t simval_{ts} \right), t \in neonates
    (4.6)


    E = \sum_s w2_{neonate}(s) * e_s (4.7)


    Likewise, in older infants, the weights and final MWM segmentation are given by
    equations 4.8 and 4.9:


    w2_{infant}(s) = \frac{1}{9} \left( \sum_t simval_{ts} \right), t \in infants
    (4.8)


    E = \sum_s w2_{infant}(s) * e_s (4.9)


    As the weights w2(s) closely match the specific age range of the input dataset,
    they achieve more accurate delineation of myelin in the pediatric brain.


    # 4.3.3 Myelin Visualization, Computation of Myelin Index, and Growth Model Fitting


    The segmentation of myelinated regions (elucidated in Section 3.2) yields a two-dimensional
    (2D) view of myelination. In addition, we acquire a 3D visualization of myelin
