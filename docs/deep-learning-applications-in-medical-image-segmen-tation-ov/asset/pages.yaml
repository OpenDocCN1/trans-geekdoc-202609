- pgno: 60
  md: '![](img/b1cb9f9389f496c3199cc2e1e74e4626_60_0.png)


    Zhou et al. (2019) presented Model Genesis, a method for segmenting 3D medical
    picture data using a transfer learning algorithm, in 2019. Transfer learning is
    essential when working with medical data, which frequently comes in 3-D formats
    like MRI and CT. To avoid having to train medical images from scratch, it is necessary
    to convert 3D images into 2D images and make the necessary adjustments. As a result
    of this alteration, crucial spatial information is lost, affecting the overall
    performance of the network. To address this issue, the authors of this work introduced
    Models Genesis, a set of models that can learn on their own and require no human
    labeling. The authors of the research used a transfer learning approach to create
    application-specific target architecture. They tested the paradigm on five 3D
    applications that faced classification and segmentation issues. Experiments showed
    that transfer learning from the 2D-ImageNet dataset outperformed natively trained
    models on 3D medical data. The relevance of the suggested framework was demonstrated
    by its consistent superiority in performance to any 2D technique. Furthermore,
    the authors have demonstrated their intent to broaden the concept beyond applications
    to encompass domains and modes of operation.


    # 2.3 Applications of Medical Image Segmentation Models


    Medical image analysis is the key component of the medical system dedicated to
    disease diagnosis. Medical imaging provides both visual and functional representations
    of internal human organs for the purpose of clinical study. The major goal is
    to categorize medical images into various classifications or to emphasize specific
    data within an image. Analyzing medical images is significant because it can help'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'radiologists and clinicians accurately diagnose diseases. Medical imaging is
    also utilized to segment the lesions and organ anatomy.


    # 2.3.1 Segmentation of Anatomical Organs


    Medical images allow for an accurate examination of organ structure. Medical images
    can be more quantitatively analyzed for clinical characteristics relating to form
    and volume, such as brain and heart studies, by segmenting organs and anatomical
    features. Furthermore, it is frequently required as an initial step in Computer-Aided
    Detection/Diagnosis (CAD). Bones, vertebrae, blood arteries, and main organs are
    examples of anatomical structures of the human body. However, because 3D scans
    contain multiple slices, it is challenging for medical experts to extract anatomy
    of interest or lesions from these images, and doing so is a time-consuming operation.
    There are numerous DL approaches available for organ segmentation in medical image
    analysis. A number of bespoke models have been created to directly target segmentation
    tasks. Tables 2.1–2.7 summarize the segmentation procedures of the eye, brain,
    liver, lung, heart, kidney, and multi-organ from the literature.


    # 2.3.1.1 Eye


    The segmentation of retinal blood vessels is a difficult topic in retinal pathology
    research. Oversegmentation or the absence of small, fragile blood arteries is
    still an issue. Deep learning-based techniques for segmenting retinal vessels
    outperform human specialists. The first work to use a deep convolutional neural
    network for the segmentation of retinal blood vessels was by Liskowski and Krawiec
    (2016). Since then, several applications for retinal vascular segmentation have
    primarily used CNNs. A fully residual auto-encoder batch normalization network
    (Pix elBNN) was presented as a quick architecture for retinal vascular segmentation
    by Leopold et al. (2019). U-Net and PixelCNN serve as its foundation. Within FCN,
    it takes advantage of both skip connections and batch normalization. The next
    step was to train, test, and cross-test the model on three different retinal blood
    vessel segmentation datasets: DRIVE (Staal et al. 2004), STARE (Hoover et al.
    2000), and CHASEDB1 (Owen et al. 2009). The execution time and performance in
    the test were satisfactory. Wang et al. (2019a) proposed a new U-Net with two
    encoders, one for spatial information and one for context information, to better
    capture the meaning of the data. The authors created a feature fusion module at
    the intersection of the two roads to merge the various forms of feature representation.
    In addition, the authors leverage channel attention in a skip connection to pick
    a relevant feature map. In addition, the multi-scale prediction module combines
    low-level and high-level prediction for enhanced precision. The suggested DEU-Net
    model was able to attain higher accuracy in retinal vascular segmentation on both
    datasets. Yue et al. (2019) recommended an enhanced'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'U-net structure for vascular segmentation in the retina. Adding a multi-scale
    input layer and dense block to the classic U-net allows it to make use of more
    sophisticated spatial contextual information. The segmentation outcomes have been
    enhanced in particular for thin blood vessels, which are challenging to detect
    due to their low contrast with the surrounding pixels. To increase accuracy, Zhang
    et al. (Zhang and Chung 2018) employed U-Net with residual connection to spot
    blood vessels and implemented an edge-sensing technique to mark the boundary region
    with more information. Retinal blood vessel segmentation was proposed by Jaemin
    et al. (Son et al. 2017) using generative adversarial training. There should be
    less room for error in the segmentation of blood arteries with this procedure.
    Khan et al. (2021) efficiently segment large, medium, and thin vessels across
    a wide range of contrast, position, and size of the optic disc, providing a multi-scale
    kernel based on completely convolutional layers that are extremely lightweight.
    In addition, the multi-scale kernels, reduced application of pooling operations,
    and skip connections are all used by the presented architecture to speed up training.
    In terms of specificity, accuracy, Area Under the Curve (AUC), and sensitivity,
    the testing results demonstrated that the method consistently outperformed the
    control group by a considerable margin. The determination of degenerative retinal
    disorders relies heavily on high-fidelity segmentation of the retina’s macro-
    and microvascular structure, yet this is a challenging task. Segmentation methods
    based on autoencoding encounter difficulties in extracting retinal microvascular
    structure due to consecutive resolution reduction during the encoding phase and
    the incapacity to recover this lost information in the decoding phase. In response
    to this issue, Kamran et al. (Kamran et al. 2021) introduced RV-GAN, an innovative
    multi-scale generative framework tailored for accurate retinal vascular segmentation.
    This proposed architecture enhanced microvessel detection and segmentation through
    the utilization of two generators and two multi-scale autoencoding discriminators.
    When compared to conventional GAN-based segmentation algorithms, the author’s
    unique weighted feature matching loss significantly improves accuracy. The developed
    architecture combines reconstruction with weighted feature matching loss to obtain
    AUC values of 98.87, 99.14, and 98.87 in segmenting retinal vessels from three
    datasets, DRIVE (Staal et al. 2004), STARE (Hoover et al. 2000), and CHASE (Owen
    et al. 2009), respectively. Table 2.1 summarizes various deep learning-based models
    for retinal vessel segmentation.


