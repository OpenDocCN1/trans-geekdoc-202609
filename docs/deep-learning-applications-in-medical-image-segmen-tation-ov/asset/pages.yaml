  md: 'an enhanced U-Net convolutional network. This approach demonstrates precise
    segmentation for various types of lung nodules. The methodology involves lung
    parenchyma segmentation with contour correction using the α-hull algorithm. CT
    slices containing lung nodules undergo preprocessing steps, and an “improved U-Net
    with Batch Normalization” is employed for accurate segmentation. The training
    utilizes patches with corresponding ground truth from the “Lung Image Database
    Consortium and Image Database Resource Initiative (LIDC/IDRI).” The model surpasses
    state-of-the-art algorithms and achieves a Dice score of 0.8623. Meanwhile, the
    authors developed the “Hierarchical Segmentation Network (CHS-Net)” (Punn and
