  md: '# ### 1.2.1 Multimodal Brain Tumor Segmentation Challenge (BraTS) Dataset


    The BraTS dataset is a widely used dataset for brain lesion segmentation that
    has been merged with the Medical Image Computing and Computer-Assisted Intervention
    (MICCAI) conference. The BraTS dataset is a vast compilation of different patients''
    MRI scans of the brain. Different versions of the dataset may include a different
    number of images. However, hundreds of scenarios are frequently included for both
    training and testing. Multiple imaging modalities, including T1-weighted, T2-weighted,
    and contrast-enhanced T1-weighted images, are routinely included in each MRI scan
    in the BraTS collection. These images can be of any size, although they are often
    3D volumes with spatial dimensions of 240 × 240 × 155 voxels or larger. The enhancing
    tumor core, peritumoral edema, and necrotic regions are all annotated in this
    dataset with their true labels. This enables the evaluation and comparison of
    segmentation algorithms on specific tumor components. Different types of cancers
    are present in this dataset, as are a wide range of tumor sizes and forms, as
    well as the need to precisely segment tumors in the presence of other brain structures.
    Several challenges on the Kaggle platform have centered on the BraTS dataset.
    The BraTS 2020 Kaggle Challenge is one noteworthy competition that attempted to
    progress the domain of brain lesion segmentation through deep learning techniques.
    A subset of the BraTS dataset was made available to challenge participants for
    practice and assessment.


    # ### 1.2.2 LIDC-IDRI (Lung Image Database Consortium Image Collection) Dataset


    The LIDC/IDRI database is a well-known dataset for lung lesion segmentation and
    diagnosis. It is a globally accessible online platform designed for developing,
    training, and assessing computer-assisted diagnostic (CAD) techniques aimed at
    the early detection and diagnosis of lung cancer. The 1018 cases in this data
    set represent the combined efforts of eight medical imaging companies and seven
    educational institutions. Images from a clinical thoracic CT scan and the results
    of a two-stage image annotation technique performed by four experienced thoracic
    radiologists are included for each individual in an Extensible Markup Language
    (XML) file. During the initial round of blinded reading, radiologists evaluated
    all CT scans separately and categorized lesions as “nodule > or = 3 mm,” “nodule
    < 3 mm,” or “non-nodule > or = 3 mm.” After the blinded-read phase, each radiologist
    evaluated his or her own mask and the masks of the other three radiologists to
    reach a conclusion. The LIDC/IDRI database contains a total of 2, 44, and 527
    CT scan images. Each CT scan typically consists of a series of axial slices, resulting
    in a 3D volume representation of the lungs. The size of the CT images may vary,
    but they are usually high-resolution axial slices with dimensions of around 512
    × 512 pixels.'
