    leading to the development of advanced surgical planning methods. This interest
    stems from the considerable diversity observed in the morphology of kidney and
    renal tumors. The KiTS19 challenge, or the KiTS challenge 2019, was a contest
    centered on segmenting kidney tumors depicted in contrast-enhanced CT images.


    The challenge aimed to encourage the development of accurate and robust algorithms
    for KiTS. Expertly labeled CT scans of the abdomen taken during the arterial phase
    were included in the data set, which included 300 individuals. 70%, or 210, were
    made available for use as a training set, while the remaining 30%, or 90, were
    saved for use as a test set. Automatic semantic segmentation of kidneys, renal
    tumors, and renal cysts is a hot topic in the medical imaging research community,
    and the KiTS23 challenge in 2023 will place teams against one another to see who
    can develop the most successful system in this area. KiTS23 is the third edition
