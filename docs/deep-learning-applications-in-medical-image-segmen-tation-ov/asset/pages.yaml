    +   • λ serves as a customizable regularization parameter.


    The objective is to maximize I(c; G(z, c)), which enhances the mutual information
    between c and G(z, c), ensuring that c contains as many critical and meaningful
    features from real examples as possible. However, in practice, optimizing I(c;
    G(z, c)) directly is challenging since it necessitates access to the posterior
    distribution P(c|x).


    A viable solution is to establish a lower bound for I(c; G(z, c)) by introducing
    an auxiliary distribution, Q(c|x), to approximate P(c|x). The final objective
    function for InfoGAN (Chen et al. 2016) is then defined as in Equation 8.5:


    $\frac{min}{G} \frac{max}{D} V_{info}(D, G) = V(D, G) - \lambda L_{info}(c; Q)$

    (8.5)


    +   • l_info (c; Q) represents the lower bound for I(c; G(z, c)).


    InfoGAN also features various variants, including causal InfoGAN (Kurutach et
    al. 2018) and semi-supervised InfoGAN (ss-InfoGAN) (Spurr et al. 2017).


    # 8.3.2.2 DCGAN


    DCGAN (Radford et al. 2016) unites GANs with CNNs, a powerful approach to computer
    vision. DCGAN introduces specific constraints on the network architecture of CNN
    to ensure stable training and to leverage learned feature representations for
    image classification. DCGAN enhances the quality of generated images through the
    following three key improvements.


    +   • DCGAN employs strided convolutions for the discriminator and fractional
    strided convolutions for the generator, replacing conventional pooling layers.
    While CNNs are typically used for feature extraction, the CNN structure in DCGAN
    is tasked with generating samples, marking a departure from its usual role in
    feature extraction. Strided and fractional-strided convolutions efficiently transmit
    the majority of information to the subsequent layer, ensuring the completeness
    and clarity of the generated samples.


    +   • DCGAN incorporates the batch normalization algorithm to tackle the problem
    of vanishing gradients. This algorithm resolves issues stemming from poor initializations,
    facilitates the propagation of gradients through each layer, and prevents the
    generator from converging all samples to a single point.


    +   • DCGAN embraces various activation functions, including the Adam optimization
    method, the ReLU activation function, and the leakyReLU activation function. Empirical
    results affirm the strong performance of DCGAN in practical applications, underscoring
    the GAN structure''s ability to generate samples. DCGAN is widely acknowledged
    as the gold standard when compared to other GAN models.'
