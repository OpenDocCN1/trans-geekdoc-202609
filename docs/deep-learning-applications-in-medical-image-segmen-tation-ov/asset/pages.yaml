    # 7.5.2 CT Scan Datasets


    With the advancement of medical imaging technology, CT scan datasets have emerged
    as vital tools for examining lung diseases, offering researchers access to a rich
    repository of medical images and associated clinical data. Some of the commonly
    used CT datasets for lung diseases are the following.


    **LIDC-IDRI:** Armato et al. introduced the LIDC-IDRI dataset in “The Lung Image
    Database Consortium (LIDC) and Image Database Resource Initiative (IDRI): a completed
    reference database of lung nodules on CT scans.” This dataset is a collaborative
    effort by the Lung Tissue Research Consortium, consisting of 1,018 low-dose lung
    CT scans from 1,200 patients. Enhanced with lesion annotations meticulously provided
    by experienced thoracic radiologists, the dataset includes associated characteristics
    such as calcification and malignancy. This resource plays a crucial role in advancing
    research in lung tissue analysis and serves as a valuable reference for studying
    various lung conditions. The CT images in this dataset are in the DICOM format,
    with a total size of 125 GB and a resolution of [65,764]×512×512 voxels for each
    scan, along with its associated metadata file. An average scan has 240 slices,
    with an average slice thickness of 1.73 mm. (Armato et al. 2010).


    **LUNA 16:** The LUNA16 dataset, specialized in lung nodule detection, contains
    888 sets of 3D CT images. Focused on pulmonary nodule segmentation, LUNA16 provides
    a rich resource for the creation and assessment of algorithms targeting the detection
    and characterization of pulmonary nodules.


