    # 2.2 Deep Learning Models for Medical Image Segmentation


    # 2.2.1 Convolutional Neural Network (CNN)


    CNNs are sophisticated neural network architectures designed to analyze two-dimensional
    (2D) images. However, it is applicable to both one-dimensional (1D) and three-dimensional
    (3D) data.


    The core of any CNN system is the convolutional layer. Convolution, like a classic
    neural network, is a linear operation where weights are multiplied by the input.
    The data that is being input is given a linear transformation by having a 2D array
    of weights, also known as a mask or filter, applied to it. The size of this filter
    is less than that of the original data. As shown in Figure 2.1, the filter and
    the patch of the input that is the same as the filter undergo an element-wise
    multiplication to yield a single value. This process is iteratively applied to
    the full input image to produce a feature map, an array of features represented
    in two dimensions. By continuously applying the same filter to the whole image,
    the approach can locate a feature submerged within the image.'
