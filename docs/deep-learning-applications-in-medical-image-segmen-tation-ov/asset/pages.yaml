    # 11.1 Introduction


    Medical imaging has played a significant role in modern healthcare and provides
    extremely useful insights into human anatomy and physiology. There are many techniques
    available, such as X-ray, computed tomography (CT), magnetic resonance imaging
    (MRI), and positron emission tomography (PET), which generate huge amount of data
    for further research in the field of health care. These data are in binary, nominal,
    and image format. So, extracting the relevant information from these data often
    necessitates image acquisition and segmentation. The segmentation is a process
    in which the image is partitioned into distinct regions corresponding to anatomical
    structures or tissues. Traditionally, medical image segmentation relied on manually
    generated techniques that involved trained professionals. However, the techniques
    were prone to the following limitations (Nazir and Kaleem 2023):


    +   - Time-consuming process: The manual segmentation can be a tedious and time-consuming
    task that affects workflow efficiency.

    +   - Subjectivity and inter-observer variability: The manual approaches are vulnerable
    to human error and inconsistencies which may affect the analysis accuracy.

    +   - Limited scalability: The manual methods become unsuitable for large datasets
    or real-time applications.'
