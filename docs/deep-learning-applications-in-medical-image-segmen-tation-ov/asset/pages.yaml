    in segmenting brain structures for neurosurgical planning (Menze et al. 2015).
    Contour-based algorithms have been applied in cardiac imaging for delineating
    myocardial boundaries (Lorenz et al. 2000). These case studies provide insights
    into the strengths and limitations of traditional approaches across different
    medical domains.'
