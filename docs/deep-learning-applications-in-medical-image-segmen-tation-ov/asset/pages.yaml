    # 7.6 Evaluation Metrics


    Evaluation metrics are the quantitative measures used to measure the performance
    of a model or an algorithm. These metrics help in determining how well a model
    performs on a specific task. Their significance lies in facilitating comparisons
    between various algorithms and plays a vital role in ensuring the precision of
    a model in a practical context. The metrics assess the performance of the model
    by comparing the predicted results of the model with those of the ground truth.
    Ground truth means the actual lung segmentation results obtained manually by medical
    experts. Here''s a summary of the commonly used metrics for lung segmentation
    in medical images.


    **True Positive (TP):** When the model predicts something as positive which is
    positive. In the case of lung segmentation, the model correctly identifies the
    image pixels as lung pixels when they are lung pixels.


    **True Negative (TN):** When the model predicts something as negative which is
    negative. In the case of lung segmentation when the system correctly classifies
    image pixels as non-lung pixels that do not belong to the lung region.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'False Positive (FP): When the model predicts something as positive which is
    negative. In the case of lung segmentation when the model classifies image pixels
    as the lung pixels that belong to the non-lung region.


    False Negative (FN): When the model classifies something as negative which is
    positive. In the case of lung segmentation when the model classifies image pixels
    as background pixels that belong to the lung region.


    Here''s a summary of the commonly used metrics for lung segmentation in medical
    images.


    **Accuracy:** Accuracy serves as a pivotal metric for evaluating deep learning
    models, providing insight into their prediction capabilities. It measures the
    ratio of accurate predictions to the total predictions made by the model, determining
    the percentage of image pixels correctly classified as lung or non-lung. This
    computation is achieved through the following formula:


    Accuracy = \frac{TP + TN}{TP + TN + FP + FN}


    **Jaccard Index:** Also known as an overlap measure, it is the measure of similarity
    between ground truth mask and segmented image. It is also called IoU. It is calculated
    using the below formula:


    Jaccard Index = \frac{TP}{TP + FP + FN}


    Its value ranges between 0 and 1, where 0 indicates no overlap or similarity between
    both the predicted image and ground truth image, and 1 signifies perfect overlap,
    that is, both segmented image and ground truth are identical. The higher value
    of the Jaccard Index indicates better similarity and accuracy in the segmentation
    results. The Jaccard Index is considered balanced because it takes both false
    positives and false negatives into account. It penalizes the model for either
    missing or including regions that are not present in the ground truth.


    **Dice coefficient:** The DSC measures the similarity between two sets, typically
    used in tasks such as image segmentation and natural language processing. This
    metric quantifies the overlap between the predicted segmentation and the ground
    truth. Again, higher DSC indicates better segmentation accuracy. It is also known
    as “Sørensen Dice coefficient” calculated as follows:


    DC = \frac{2 \times TP}{2 \times TP + FP + FN}


    **Precision:** Precision is a metric that measures the accuracy of positive predictions
    made by a model. It is calculated as the ratio of TP predictions to the total
    number of instances classified as positive by the model, regardless of whether
    those predictions are correct or incorrect. In the case of lung segmentation,
    it is the number of correctly classified pixels divided by the total number of
    pixels classified as lung pixels. Precision is an important evaluation metric
    when false positive predictions are costly. For example, if a model incorrectly
    classifies healthy tissues as'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'cancerous. High precision means that the errors of incorrectly identifying
    positive values are minimized. Precision gives us the measure of the accuracy
    of positive predictions made by the model. It is calculated as follows:


    Preciaion = \frac{TP}{TP + FP}


    **Recall:** Also known as sensitivity, it is a measure of the ability of the model
    to correctly capture and identify the TPs. In case of lung segmentation, it is
    the probability of correctly classifying the lung pixels from an image. It is
    a useful metric when false negatives are more critical than false positives. It
    is calculated using the below formula:


    Recall = \frac{TP}{TP + FN}


    **Specificity:** In contrast to sensitivity or recall, specificity is the measure
    of the ability of the model to correctly identify the TNs. In the case of lung
    segmentation, it is the probability of correctly classifying a background (or
    a non-lung) pixel. It becomes a useful metric when the cost of false positives
    is high or when there is a focus on the accuracy of negative predictions. This
    metric is derived using the following formula:


    Specificity = \frac{TN}{TN + FN}


    Specificity tells us how accurately a model can make correct negative predictions.
    A higher value of specificity means the model is effective at correctly identifying
    TNs, minimizing the occurrence of false positives. A lower value means that the
    model is incorrectly predicting negative instances as positive, leading to false
    positives.


    **F1-score:** The F1-score is a crucial evaluation metric, offering a balanced
    assessment of a model''s performance by considering both precision and recall.
    By computing the harmonic mean of precision and recall, the F1-score provides
    a symmetric representation of both metrics in a single value. With a maximum value
    of 1 representing perfect precision and recall, and a minimum value of 0 indicating
    either precision or recall being zero, the F1-score serves as a reliable indicator
    of a model''s accuracy and is calculated as follows:


    F1 Score = \frac{2 \times Precsion \times Recall}{Precsion + Recall}


    **Hausdorff distance:** Measures the maximum distance between any two points on
    the predicted and ground truth segmentation boundaries. Lower Hausdorff distance
    indicates better alignment between the segmentations.'
