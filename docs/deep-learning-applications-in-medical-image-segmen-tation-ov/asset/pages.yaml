  md: '# # 7.4.2 Overview of Deep Learning Approaches for Lung Segmentation in CT
    Scans


    Deep learning techniques have recently emerged as powerful tools for LFS in medical
    images, particularly in the context of CT scans. This review focuses on the advancements
    and applications of deep learning-based methods for LFS, emphasizing their significance
    in medical diagnosis.


    Early attempts at lung segmentation relied on conventional techniques such as
    numerical methods, (Abdani et al. 2022) gray-level thresholding, (Zulkifley et
    al. 2022), and shape-based techniques. However, these methods faced limitations
    in handling the complexity of medical images. The emergence of deep learning,
    with CNNs leading the charge, has brought about a transformative impact on the
    domain of medical image segmentation.


    Recent studies have suggested several CNN-based approaches for segmenting lung
    fields, (Stofa et al. 2021) leveraging the capabilities of 2D CNNs, 2.5D CNNs,
    and 3D CNNs. These techniques have shown significant improvements over traditional
    methods, enabling more accurate and efficient segmentation.


    The study presented by Xu et al. proposed a straightforward CNN model for lung
    segmentation, (Xu et al. 2019) using a training dataset generated through a “clustering
    algorithm-based” approach. The k-means clustering algorithm utilized the mean
    and minimum intensities of image patches, effectively dividing CT slices into
    two groups. To ensure accuracy and completeness, the final dataset was generated
    through a multi-step process involving cross-shaped verification for shape consistency,
    volume intersection for overlap removal, connected component analysis for region
    identification, and patch expansion for data augmentation. The network architecture
    consisted of a single convolutional layer with six kernels for extracting features,
    a maximum pooling layer for downsampling, and two fully connected layers used
    for final classification. The model’s performance was rigorously evaluated using
    an eighthfold cross-validation approach on the generated datasets.


    A complementary approach introduced by Lyu et al. developed algorithms for the
    automatic segmentation of lung fields aimed at filtering noise from CT images
    of lungs while preserving lung boundaries. This was achieved by employing a filtering
    approach based on image decomposition, followed by the application of wavelet
    transformation and diverse morphological operations to delineate the lung boundaries
    accurately. The resulting lung outlines underwent correction and smoothing as
    part of a segmentation refinement process, (Liu and Pang 2020) incorporating a
    method for adjusting contours. This comprehensive set of methodologies illustrates
    the diverse strategies employed in the domain of lung segmentation, showcasing
    the efficacy of clustering algorithms, CNN'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'architectures, and image-processing techniques. (Liu and Pang 2020; Xu et al.
    2019).


    An effective approach involves employing a “U-Net architecture with a false-positive”
    (Khanna et al. 2020) strategy illustrating the efficacy of a more advanced network
    for lung segmentation. In another study, (Comelli et al. 2020) the performance
    of “U-Net and E-Net models” was compared, highlighting their effectiveness in
    segmenting parenchyma among patients with pulmonary fibrosis.


    A U-Net architecture featuring separate paths for recovering global context and
    extracting fine details (Ait Skourt et al. 2018) has shown high performance with
    a Dice coefficient of 0.9502. Additionally, (Hu et al. 2020) an integrated approach
    combining supervised and unsupervised machine learning techniques within a Mask
    R-CNN methodology demonstrated quick and accurate segmentation with 97.68% accuracy
    and an average processing time of 11.2 seconds.


    Multi-view convolutional networks have been employed to identify lung nodules,
    (Setio et al. 2016) targeting different nodule types. Combining multiple streams
    of 2D ConvNets with a robust classification approach yielded promising results,
    with an average of 4 False-Positives/Scan and a “detection sensitivity” of 85.4%
    achieved.


    Moving beyond 2D approaches, some researchers focused on training “3D CNNs” for
    the autonomous detection of lung nodules. These networks were trained on volumes
    of interest (VOIs) extracted from datasets such as LIDC, which is a valuable resource
    for detecting “lung nodules.” Researchers also analyzed the performance of 3D
    FCNN to generate score maps for the whole volume in a single iteration, thereby
    showcasing the effectiveness of 3D CNNs, (Negahdar et al. 2018) showcasing the
    efficiency of 3D CNNs. With ongoing advancements, Roy et al. proposed an innovative
    model for the segmentation of lung nodules, (Roy et al. 2019) incorporating a
    complementary fusion of “deep learning and shape-driven level sets.” The method
    utilized “coarse segmentation maps” generated by deep FCNs, facilitating the segmentation
    process with an initial, broad delineation to refine accurate boundary detection.
    Initially, shape-driven evolution of level sets was employed for fine segmentation.
    Moreover, these level sets played a vital role in automatically initializing the
    model, (Thanoon et al. 2023) utilizing seed points derived from the coarse segmentation
    of the deep network. Segmenting lung nodules is a complex task due to variations
    in their shapes, contours, textures, and locations. Some nodules may be connected
    to surrounding tissues, further complicating the determination of their contours.
    The main objective of lung nodule segmentation is to precisely identify the nodule’s
    contour and separate it from the lung region. Despite various approaches employed
    for lung nodule segmentation, challenges persist, particularly in accurately segmenting
    different types of lung nodules. Zhang et al. (Zhang et al. 2021) proposed a robust
    lung nodule segmentation method using'
