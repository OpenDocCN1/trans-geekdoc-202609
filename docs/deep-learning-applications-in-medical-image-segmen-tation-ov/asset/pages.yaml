  md: '# 6


    # Deep Learning-Based Image Segmentation for Early Detection of Diabetic Retinopathy
    and Other Retinal Disorders


    Ankur Biswas<sup>1</sup> and Rita Banik<sup>2</sup>


    <sup>1</sup>Department of Computer Science & Engineering, Tripura Institute of
    Technology, Narsingarh, West Tripura, India

    <sup>2</sup>Department of Electrical Engineering, ICFAI University Tripura, Kamalghat,
    West Tripura, India


    # 6.1 Introduction


    Diabetic retinopathy (DR) and associated retinal illnesses pose important worldwide
    health issues, impacting millions of people and resulting in profound vision impairment
    if not treated (Aziz et al. 2021). The retina is a light-sensitive tissue located
    in the back of the eye that is essential for vision. However, over time, several
    medical disorders might harm the fragile retina, which could endanger vision.
    DR is a prevalent retinal condition that is particularly prevalent in the diabetic
    population. Elevated blood sugar levels linked to the condition may lead to gradual
    alterations in the retina by harming small blood vessels. DR can progress to the
    point of blindness if left untreated. (Aziz et al. 2021) In addition to diabetes,
    there are a number of additional retinal disorders that can arise and affect vision.
    Diabetes-related high blood sugar levels can lead to the blockage, enlargement,
    or leakage of fluid or blood from small blood vessels in the retina. An individual
    is more likely to acquire diabetes the longer they have the disease. Depending
    on the extent of retinal damage, DR can go through many phases. Microaneurysms,
    or tiny vascular bulges, appear in the early stages. As the disease advances,
    more severe retinal abnormalities such as hemorrhages, cotton-wool patches, and
    hard exudates appear. The most advanced form of retinopathy is proliferative retinopathy,
    in which new fragile blood vessels sprout on the retina or optic disc. These aberrant
