    # 8.2 Overview of Image Segmentation Techniques


    The recent medical image segmentation approaches are reviewed in this section.


    # 8.2.1 Traditional Methods for Segmentation of Images


    Traditional approaches for medical image segmentation encompass a range of established
    techniques rooted in classical computer vision and image processing. These methods,
    such as thresholding, edge-based models, region-growing models, and graph-cut
    models, rely on mathematical and algorithmic principles to partition medical images
    into distinct regions or structures.


    Thresholding involves dividing an input image into regions based on a chosen threshold,
    and multiple thresholds can be employed in multi-threshold segmentation (Senthilkumaran
    and Vaithgei 2016). Selecting an appropriate threshold is challenging, as higher
    values may lead to fragmented boundaries and overlook subtle segments. Thresholding
    is sensitive to noise and lacks spatial'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'linkage awareness between different image characteristics. Thresholding has
    been applied in a number of applications, like brain tumor detection from MRI
    images and its combination with other techniques. Wittke et al. (Wittke et al.
    2007) employed classification-based thresholding to produce a binary image from
    histological slide sections of prostate carcinoma. While thresholding is easy
    and fast, finding the optimal threshold automatically can be complex, and iterative
    thresholding may be necessary for noisy images like CT scans or ultrasound images.
    Overall, thresholding is a widely used method but requires careful consideration
    for effective application.


    Edge-based methods rely on edge detection to identify boundaries and object contours.
    Various edge detection operators rely on gradient (derivative) functions, including
    but not limited to Roberts, Prewitt, Sobel, Marr–Hildreth, Laplacian, and Canny
    edge detectors (Song et al. 2017). The Canny edge detector, in particular, is
    highlighted for its optimization involving edge enhancement and tracing. Edge-based
    segmentation addresses challenges like under-segmentation, over-segmentation,
    and false edges. Kattire et al. (Shah (n.d.)) presented a two-stage method wherein
    they initially acquire edge information by considering the magnitude and direction
    of the image gradient, and subsequently generate the edge map based on the texture.
    While edge-based methods are simple, they may perform poorly in the presence of
    noise, and some edge detectors are suitable for X-ray pre-processing.


    In the Region Growing Method, pixels are grouped into homogeneous regions by iteratively
    expanding from seed points. The growth of each region is guided by a similarity
    criterion, often defined as the difference between a pixel’s intensity value and
    the mean intensity of the region. However, region-growing methods often need manual
    seed setting, making them sensitive to noise and resulting in regions with holes.
    Challenges include finding appropriate thresholding values, especially in noisy
    images. Despite their simplicity and ease of implementation, region-growing approaches
    have drawbacks, including the need for manual interaction, sensitivity to initialization,
    high processing time, and the potential for non-connected regions. Tan et al.
    (Tan et al. 2017) suggested an approach for detecting tumors in PET images by
    employing adaptive region growth with a maximum curvature strategy (ARG-MC).


    Graph-cut-based segmentation methods have proven effective for optimal global
    segmentation. These methods transform segmentation into a maximum flow problem
    with polynomial time complexity, treating the image as a graph where nodes represent
    pixels/voxels, including special nodes for the source (S) and sink (t) connected
    by t-edges and other nodes connected by n-edges. Object (O) and background (B)
    seeds are denoted, and the goal is to achieve an optimal cut distinguishing objects
    from the background. Popular algorithms include normalized cuts and minimum cuts.
    The methods, suitable for various image'
