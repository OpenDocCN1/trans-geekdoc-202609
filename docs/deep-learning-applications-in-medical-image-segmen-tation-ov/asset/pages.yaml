    # 5.3.1.5 Softmax Activation


    For classification tasks, the output layer of the CNN often utilizes a softmax
    activation function, which normalizes the output scores across classes into a
    probability distribution. This enables the network to output probabilities indicating
    the likelihood of each class.


    # 5.3.1.6 Loss Function and Optimization


    During the training phase, the neural network is optimized to minimize a loss
    function, which assesses the discrepancy between the predicted outputs and the
    ground truth labels. Commonly used loss functions for classification tasks include'
