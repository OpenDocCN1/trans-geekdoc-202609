- pgno: 115
  md: 'This 3D view offers a complete visualization of myelin development in the baby''s
    brain from birth up to 2 years. Such a qualitative view of myelin progress also
    helps reinforce the neuroanatomic axioms of myelination (Welker and Patton 2012).


    However, the above 3D visualization of myelination provides only a qualitative
    and subjective view. To attain a reliable, objective, and quantitative metric
    for myelin maturation, we propose a novel MI. The MI is obtained as the ratio
    of myelin present to the total brain. This index is age specific and increases
    as the baby grows from the neonatal to infancy and pediatric stages. The MI values
    for normal term-born babies are used in growth model fitting.


    Various growth models are investigated to recognize the model that is best suited
    to represent the myelination of WM in children. Here, MI values are modeled as
    a continuous function of age (t days). It is ensured that the proposed model has
    biologically meaningful parameters that facilitate the interpretation of myelin
    progress with age. We consider the following twelve growth models that satisfy
    the above requirements:


    +   * Basic models: Linear, quadratic, logarithmic, exponential, and negative
    exponential.


    +   * Advanced models: Gompertz, logistic, Weibull, Richards, and three hyperbolastic
    models (Tabatabai et al. 2005).


    Table 4.1 shows the equations for the different growth models. The parameters
    for these models (c₀–c₄) are adapted from Narinc (Narinc et al. 2010). Their biological
    significance is given below:


    +   * c₀ – maximum MI value at 2 years


    +   * c₁ – scale parameter (related to MI value at birth)


    +   * c₂ – growth rate


    +   * c₃ – shape parameter


    +   * c₄ – parameter specific to hyperbolastic models


    The growth models in Table 4.1 are fitted to the MI values. The best-suited model
    is obtained using Akaike information criterion (AIC) and Bayesian information
    criterion (BIC). Mathematically represented by equation 4.10:


    ```

    AIC = n_d ln (RSS / n_d) + 2n_p (4.10)

    ```


    Here, n_d represents the number of data points, RSS signifies the residual sum
    of squares and n_p indicates the number of estimated parameters. Nevertheless,
    this expression is suitable only for large datasets. When the ratio of n_d and
    n_p is less than 40, finite sample correction is done as in equation 4.11 (Wagenmakers
    and Farrell 2004):


    ```

    AIC_corrected = n_d ln (RSS / n_d) + 2n_p + 2n_p(n_p + 1) / (n_d - n_p - 1) (4.11)

    ```'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Table 4.1 Different growth models.


    | Model | Equation |

    | :--- | :--- |

    | Linear | MI(t) = at + b |

    | Quadratic | MI(t) = at^2 + bt + c |

    | Logarithmic | MI(t) = a log t + b |

    | Exponential | MI(t) = c_1 e^{c_2 t} |

    | Negative exponential | MI(t) = c_0 (1 - e^{-c_1 t}) |

    | Gompertz | MI(t) = c_0 e^{-c_1 e^{-c_2 t}} |

    | Logistic | MI(t) = c_0 / (1 + c_1 e^{-c_2 t}) |

    | Weibull | MI(t) = c_0 - c_1 e^{-c_2 t^{c_3}} |

    | Richards | MI(t) = c_0 / (1 + c_1 e^{-c_2 t})^{1/c_3} |

    | Hyperbolastic model H1 | MI(t) = c_0 (1 + c_1 e^{-c_2 t - c_3 arsinh(c_4 t)})
    |

    | Hyperbolastic model H2 | MI(t) = c_0 / (1 + c_1 arsinh (e^{-c_2 t - c_3 t}))
    |

    | Hyperbolastic model H3 | MI(t) = c_0 - c_1 e^{-c_2 t^{c_3} - arsinh(c_4 t)}
    |


    The corrected AIC metric is used in our work and simply denoted by AIC for convenience.
    In addition using equation 4.12,


    ```

    BIC = n_d ln \frac{RSS}{n_d} + n_p ln(n_d) \tag{4.12}

    ```


    Note that AIC and BIC have completely different frameworks with BIC housing a
    higher penalty term when n_d > e^2.


    The optimal growth model is the one that achieves the lowest AIC and BIC metrics.
    For better analysis and interpretation of results, the Akaike and Bayesian weights
    are computed from the Akaike and Bayesian information criteria, respectively.
    For each model, the difference in AIC value is calculated as in equation 4.13:


    ```

    Δ AIC_k = AIC_k - AIC_min, k = 1, 2 ... 12 \tag{4.13}

    ```


    where AIC_min is the lowest AIC value of the twelve models. Further, the Akaike
    weights are represented as given in equation 4.14:


    ```

    w_{AIC_k} = \frac{e^{-0.5 Δ AIC_k}}{\sum_{m=1}^{12} e^{-0.5 Δ AIC_m}} \tag{4.14}

    ```


    Using these weights, the evidence ratio (ER) between models M_1 and M_2 is given
    by equation 4.15:


    ```

    ER_{AIC} = \frac{w_{AIC_{M_1}}}{w_{AIC_{M_2}}} \tag{4.15}

    ```'
  merge: -1
