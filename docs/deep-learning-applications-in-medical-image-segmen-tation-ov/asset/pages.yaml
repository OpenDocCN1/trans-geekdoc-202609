  md: '# 7.3 Overview of Classical Approaches for Lung Segmentation in Chest X-rays


    Traditional methods for LFS typically cover various techniques and approaches,
    which are discussed as follows.


    # 7.3.1 Rule-Based Methods


    Rule-based methods include techniques that rely on predefined rules or criteria
    to delineate and describe the borders and areas corresponding to the lungs. These
    rules are like step-by-step instructions applied in a specific order to accurately
    outline the lungs. The rules consider factors such as where the lungs are located,
    how bright or dark they appear, their texture, and shape, and how they relate
    to other body structures. These methods provide flexibility by allowing the application
    of rules in various sequences allowing adaptation to various situations. (Gados
    and Horvath n.d.) (Figure 7.2).


    Intensity thresholding, edge detection, and knowledge-based rules are techniques
    utilized in rule-based segmentation.


    Intensity thresholding categorizes each pixel into either non-lung or lung regions
    based on a predefined grayscale threshold. The key challenge lies in determining
    an optimal threshold value because a low setting may lead to unclear lung contour
    while a high value might merge or blur the boundary between the lung and non-lung
    regions. Cheng and Goldberg introduced one of the earliest methods in this category,
    (Cheng and Goldberg 1988) employing a distinct gray-level threshold value to individually
    segment the left and right lungs. In contrast, Armato et al. presented a method
    that combines iterative gray-level thresholding, (S. G. Armato et al. 1998) incorporating
    both global and local aspects, with contour smoothing using morphological operations
    and rolling-ball techniques. While iterative thresholding improves segmentation
    precision, it introduces computational overhead. Conversely, static threshold
    values may lead to suboptimal segmentation, especially in images with varying
    contrast.


    ![](img/b1cb9f9389f496c3199cc2e1e74e4626_172_0.png)


    Figure 7.2 Diagrammatic Representation of Rule-Based Lung Segmentation Workflow.
    Source: Mittal et al. (2017) /John Wiley & Sons.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Edge detection-based lung segmentation is used to highlight the edges or contours
    of the lungs, allowing for accurate segmentation. It depends on variations in
    pixel intensity between non-lung lung areas, capitalizing on sharp intensity changes
    near lung edges. Powell et al. originally used derivatives to identify rib cage
    boundaries, (Powell et al. 1988) a method subsequently enhanced by Xu et al. who
    applied the “second-order derivative” for contour identification to capture intricate
    details, (Xu and Doi 1995) albeit with a susceptibility to noise. Duryea et al.
    adopted a “heuristic technique” for edge tracing, (Duryea and Boone 1995) independently
    segmenting both lungs with an average processing duration of 0.84 seconds per
    image across 802 images. Li et al. further addressed challenges such as rib structure
    hindrance and false contours, (Li et al. 2001) achieving lung contours in 0.775
    seconds per image by utilizing the first derivative. In the domain of intensity
    and edge-based segmentation, the challenges associated with deformed anatomical
    structures are addressed by methods incorporating prior understanding of texture,
    lung spatial, and shape characteristics. Luo et al. proposed a comprehensive approach
    that employs knowledge-based characteristics, (Luo et al. 2000) utilizing an object-oriented
    anatomical model, with robust initial contour construction and boundary detection
    using a snake model. Brown et al. also presented a similar method utilizing an
    anatomical model for both normal lung shapes and deformities. (Brown et al. 1998)
    While these approaches contribute to enhancing robustness in lung segmentation,
    they also face challenges in threshold determination, computational efficiency,
    and noise susceptibility in edge-based approaches. The choice of a rule-based
    technique depends on specific requirements and image characteristics.


    # 7.3.2 Deformable Methods


    These are the techniques that can adapt their shape and boundaries to accurately
    follow the complex and potentially irregular contours of the lungs. Unlike fixed
    models that rely on rigid templates or predefined shapes, deformable methods offer
    greater flexibility and can handle challenges like variability in lung shape and
    the presence of overlapped structures. Deformable models fall into two categories:
    “parametric and geometric.” (Figure 7.3).


    ![](img/b1cb9f9389f496c3199cc2e1e74e4626_173_0.png)


    Figure 7.3 Deformable-based lung segmentation process. Source: Mittal et al. (2017)
    /John Wiley & Sons.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# ### 7.3.3 Parametric Methods


    "Active Shape Model (ASM)" and "Active Appearance Model (AAM)", both belonging
    to parametric, use a limited set of parameters for lung segmentation in CXRs.
    These incorporate shape and appearance information to adapt to the variations
    in lung structures and textures.


    In 1995, Cootes et al. introduced the “ASM” (Cootes et al. 1995), which was subsequently
    refined by other researchers. Wu et al. enhanced the performance of the ASM (Wu
    et al. 2015) by introducing weighted components and incorporating additional constraints.
    This modification yielded better accuracy compared to the standard ASM technique.
    The deformable model proposed by Shi et al. integrates shape statistics at both
    “patient-specific and population-based” (Shi et al. 2008) levels through hierarchical
    Principle component Analysis (PCA). The aim was to employ statistical shape modeling
    for reliable lung segmentation across various anatomies, with the inclusion of
    scale-invariant feature transform (SIFT) to enhance accuracy. Iakovidis and Savelonas
    automated landmark extraction for lung segmentation, (Iakovidis and Savelonas
    2009) offering an advantage in initial boundary detection but facing challenges
    in low-contrast images. Dawoud integrated shape information with intensity-based
    thresholding, (Dawoud 2011) demonstrating improved results compared to ASM. However,
    it necessitated the use of images with identical resolution for optimal performance.
    Zhang et al. (Zhang et al. 2014) suggested a comparable approach that combines
    intensity information and shape priors for lung segmentation. Both studies employed
    the JSRT dataset for the training and evaluation of their models. The limitation
    of ASM lies in its exclusive focus on the object’s shape, neglecting factors such
    as texture and color variations. To resolve this, AAM was introduced, extending
    ASM to consider both shape and appearance. While AAM is more powerful, it also
    requires more computational effort. Li et al. (Li et al. 2016) introduced an innovative
    approach that integrates both shape and appearance models to enhance the segmentation
    of lung fields. Their approach incorporated a multi-scale and multi-step-size
    strategy, contributing to improved accuracy. Additionally, Shao et al. proposed
    the AAM method using learning-based landmark detection and a hierarchical framework,
    (Shao et al. 2014) ensuring a thorough and strong segmentation process.


    # ### 7.3.4 Geometric Deformable Models


    Deformable models based on geometry, such as the theory of curve evolution and
    the level set approach, were proposed by Caselles et al. to ensure smooth evolution
    and effective handling of topology changes, (Caselles et al. 1993) providing advantages
    in capturing complex lung shapes, while being independent of parameters. Employing
    the prior shape information, Annangi et al. used an active contour'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'technique for the segmentation task, (Annangi et al. 2010) combining level
    set minimal energy and Otsu thresholding with extracted edge characteristics,
    corners, and region-specific data. This method proficiently addressed challenges
    related to local minima and accomplished the segmentation of lung structures within
    seven seconds per image for both lungs.


    By incorporating graph-cut techniques, Candemir et al. aimed to address challenges
    related to variable lung shapes and high computation time. This method initially
    calculated the average lung shape and determined the boundary using graph-cut
    techniques. Despite encountering challenges in static shape modeling and facing
    high computation time, they proposed a method that employed a multi-class classifier
    approach, (Candemir et al. 2013) achieving segmentation in 8 seconds at a resolution
    of 1024x1024. The approach was further enhanced by incorporating anatomical atlases
    and non-registration, (Candemir et al. 2014) resulting in a faster execution time
    of 20–25 seconds at a resolution of 256x256.


    Overall, deformable methods, including AAMs, active shape models, and geometric
    deformable models, exhibit the potential for precise segmentation of lung structures
    in chest radiography.


    # 7.3.5 Pixel Classifier-Based Segmentation


    From the early 1990s onward, various “Machine learning techniques such as k-nearest
    neighbors (kNNs) and Support vector machines (SVMs)” have been extensively employed
    for LFS. This pixel classifier (PC)-based approaches use grayscale values to assign
    pixels to anatomical structures, ensuring stable performance even in situations
    involving absent or significantly deformed anatomical structures, assuming the
    classifier is adequately trained. Training these classifiers is, however, challenging
    due to difficulties in obtaining diverse and high-quality annotated medical training
    data. PC-based methods are categorized into two groups: one based on shallow learning
    and the other based on deep learning, depending on the process of extracting features,
    which can be either manual or automatic (Figure 7.4).


    ![](img/b1cb9f9389f496c3199cc2e1e74e4626_175_0.png)


    Figure 7.4 Pixel-based lung segmentation process. Source: Mittal et al. (2017)
    /John Wiley & Sons.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 7.3.6 Shallow Learning


    In shallow learning, machine learning methods are employed to extract important
    information. The challenge lies in identifying a fitting class for the extracted
    features. With growing trends in research, (McNitt-Gray et al. 1993) aimed to
    build a segmentation technique using the “pattern classification approach.” Numerous
    classifiers include “linear discriminant, k-nearest neighbor, and feed-forward
    back-propagation neural network (FFBPNN)” to categorize pixels based on local
    texture and gray-level features. Each classifier was trained on a dataset comprising
    17 CXR images and trained classifiers were evaluated on a distinct set of 16 images.
    Although the neural network outperformed KNN and LDA, accurately predicting over
    76% of pixels, limitations existed. Vittitoe et al. addressed these limitations
    by introducing Markov random field modeling (MRFM) to identify lung regions and
    non-lung regions, achieving 94.8%-pixel classification accuracy on a test set
    of 115 CXRs, (Vittitoe et al. 1998) outperforming some previous methods. However,
    the computational expense of MRFM was acknowledged as a drawback. Finally, Shi
    et al. and Jangam et al. in their respective works individually modified the fuzzy
    c-means clustering algorithm for the segmentation of lungs. Shi et al. implemented
    an unsupervised approach using a “Gaussian kernel-based fuzzy C-means,” (Shi et
    al. 2009) achieving 97.8% accuracy on 52 CXRs from the JSRT dataset. On the other
    hand, Jangam et al. proposed an “optimized fuzzy c-means clustering” method, (Jangam
    and Rao 2019) incorporating a level set algorithm and spatial fuzzy clustering
    for segmentation. However, Jangam et al.’s method had a longer computation time
    of 25–30 seconds. Both studies differ in computational efficiency.


    # 7.4 Deep Learning Approaches


    # 7.4.1 Lung Field Segmentation in Chest X-rays


    Accurate lung segmentation is crucial in medical imaging because losing even a
    small part of the lung during the process can have serious consequences. Shallow
    learning methods for segmentation rely on manually defined features, which can
    be tedious and error-prone. In contrast, deep learning automatically extracts
    features from the data, rendering it a robust and efficient approach for lung
    segmentation.


    Deep learning approaches for lung segmentation use advanced neural network architectures
    to automatically discern lung structures in CXR images. These models comprise
    several layers of nonlinear processing, which include the input layer, intermediate
    layers, and output layer. Deep learning offers various computationally efficient
    approaches for the computer vision task of lung segmentation,'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'including convolutional neural networks such as “Fully Convolutional Networks
    (FCNs), dilated convolutions like DeepLab v3 and encoder–decoder-based models
    like UNet” and its variants. These architectures significantly contribute to improving
    segmentation accuracy. Additionally, innovative methods, such as “GANs,” “attention-based
    mechanisms,” and “multistage or hybrid frameworks,” further enhance the segmentation
    process. The networks learn to distinguish between lung and non-lung regions,
    addressing challenges such as variations in anatomy and image quality. Training
    is typically performed on large datasets, allowing the model to generalize to
    diverse cases.


    # 7.4.1.1 CNN-Based Approaches


    In the past few years, with the rise of deep learning techniques, especially “CNNs,”
    the field of artificial intelligence has undergone a remarkable evolution. This
    study emphasizes the effectiveness of CNNs in automating segmentation processes,
    thereby reducing the manual effort and time required. Certainly, CNNs can be employed
    for various applications, including but not limited to image recognition, computer
    vision, natural language processing, and speech recognition. In medical image
    analysis, CNNs prove effective for different organ segmentation, automatically
    extracting features and identifying intricate patterns challenging for human detection.
    Crucially, this capability enhances accurate and efficient lung segmentation,
    vital for diagnosing, treating, and monitoring deadly lung diseases. To address
    challenges such as model overfitting, reducing parameters, and handling imbalanced
    data, Novikov et al. (2018) developed a robust “fully convolutional network (FCN)”
    architecture. The three variants – All-Dropout, incorporating Gaussian dropout
    layers to prevent overfitting; All-Convolutional, which replaced pooling layers
    with convolutional layers for denser feature extraction; and “InvertedNet”, (Novikov
    et al. 2018) utilizing inverted residual blocks and Exponential Linear Units (ELUs)
    for accelerated training – were thoroughly evaluated. The study used the JSRT
    dataset, which comprises 247 chest X-rays. The training time for InvertedNet was
    33 hours, involving 3,140,771 parameters. The study’s findings revealed that InvertedNet
    performed better than others, showing good results in terms of the Jaccard score,
    as proven by the study’s results.


    Furthermore, Adel Sulaiman and colleagues introduced a lung segmentation model
    using deep CNNs. The model incorporates convolutional and concatenate blocks,
    (Sulaiman et al. 2023) with convolutional layers capturing essential features
    and a transpose layer enhancing spatial resolution of feature maps. Performance
    metrics such as accuracy, Intersection over Union (IoU), and Dice coefficient
    were used to evaluate the model’s effectiveness, yielding impressive results.
    Trained with k-fold validation (k = 5), the model achieved 97% accuracy with minimal
    loss.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'The neural network architecture known as encoder–decoder, widely used for image
    segmentation, consists of two essential parts: the encoder and the decoder. The
    encoder, often referred to as the contracting path, utilizes convolutional layers
    to downsample the input image, extracting crucial features and reducing spatial
    dimensions. Conversely, the decoder, known as the expansion path, employs upsampling
    layers to enhance spatial resolution and generate a segmentation mask. U-Net,
    a specialized encoder–decoder network initially created for biomedical image segmentation
    by “Olaf Ronneberger,” (Ronneberger et al. 2015) incorporates skip connections
    and additional convolutional layers to refine segmentation accuracy.


    # 7.4.1.2 U-Net-Based Approaches


    The “U-Net architecture” has significantly influenced medical image segmentation,
    marking a pivotal advancement. Researchers have made remarkable contributions
    to U-Net studies. Here are some contributions made to the U-Net-based model by
    numerous researchers (Figure 7.5).


    In this context, Islam et al. put forward a “U-Net-based deep CNN” for lung segmentation,
    incorporating enhancements such as advanced data augmentation techniques, refined
    skip connections, and modifications to the contracting-expanding pathway. These
    improvements aim to better capture the complexities


    ![](img/b1cb9f9389f496c3199cc2e1e74e4626_178_0.png)


    Figure 7.5 Basic U-Net architecture for medical image segmentation. Source: Ronneberger
    et al. 2015/Springer Nature.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'and variations present in chest X-rays. The model achieves a Dice score of
    98.6% and undergoes evaluation on two benchmark chest X-ray datasets: “Shenzhen
    Hospital (SH) dataset and Montgomery County (MC)” dataset demonstrating the performance
    of U-Net enhancements in advancing medical image segmentation. Deep learning models
    exhibit impressive performance in anatomical structure segmentation, but a high
    number of training parameters is a potential issue. This leads to increased memory
    usage and reduced model generalization, connecting with our earlier U-Net architecture
    discussion. To address this, Yahyatabar et al. introduced “Dense-Unet,” (Yahyatabar
    and Jouvet 2020) an extension of U-Net with dense connectivity. Enhancing information
    flow between layers. The model offers “compact and normal” versions, incorporating
    squeeze-and-excitation (SE) blocks. The study used JSRT and Montgomery datasets,
    achieving Dice and Jaccard scores of 97.6/95.3 and 97.9/95.59, respectively, illustrating
    improved segmentation. Similarly, as in previous studies for automatically segmenting
    lung regions in chest radiographs, Liu et al. proposed an “Improved U-Net” (Liu
    et al. 2022) network that incorporates a pretraining EfficientNet-b4 backbone
    in the encoder, LeakyReLU activation function, and residual block in the decoder
    to efficiently extract lung field features and prevent gradient instability. The
    suggested approach was tested on public CXR datasets, JSRT and MC, as well as
    a private Haut lung segmentation dataset, and it outperformed the traditional
    U-Net model in terms of “Jaccard Index and Dice sensitivity coefficient (DSC).”
    Both studies use data augmentation techniques to overcome the training set’s limited
    size, enhancing generalization to diverse datasets. (Liu et al. 2022; Yahyatabar
    and Jouvet (2020).


    The U-Net architecture has been extensively preferred in recent medical studies;
    however, it exhibited shortcomings, the most prominent being the presence of a
    single dropout function at the final convolution layer, which leads to overfitting
    and poor model generalization. To address these concerns, Arvind et al. proposed
    a refined and relatively lightweight variant of the U-Net model, (Arvind et al.
    2023) incorporating multiple dropouts in both convolution and deconvolution layers
    for improved semantic segmentation of lung images in chest X-rays. Their improvements
    in the architectural components of U-Net, such as batch normalization and fewer
    convolutions, resulted in fewer model parameters and lower model complexity while
    maintaining performance metrics. The study offered improved performance on multiple
    datasets with a generalization accuracy of 93.87%.


    Continuing the discussion on encoder–decoder approaches, the researchers introduced
    the “DED-CNN (dual encoder–decoder CNN)” (Ullah et al. 2023) for precise segmentation
    of multiorgan anatomical structures in chest X-ray images. The model utilizes
    a pretrained VGG19 as an encoder, incorporates a SE block for better representation,
    and employs “Attention Gating Modules (AGMs)” to improve the segmentation of smaller
    regions in the second encoder–decoder.'
