- pgno: 23
  md: '# # 1

    Introduction to Medical Image Segmentation: Overview of Modalities, Benchmark
    Datasets, Data Augmentation Techniques, and Evaluation Metrics


    Aasia Rehman^1 and Suhail Qadir Mir^2


    ^1Department of Computer Science, University of Kashmir, Srinagar, Jammu and Kashmir,
    India

    ^2Department of Informatics and Computer Systems, King Khalid University, Abha,
    Saudi Arabia


    # ## 1.1 Introduction


    Medical image analysis is an essential part of monitoring the clinical progression
    of the disease and how the patient is responding to a certain kind of treatment
    and thus helps in further planning of treatment for patients. Medical imaging
    has sped up the diagnosis and treatment of a number of illnesses. There are generally
    many different kinds of medical imaging modalities that make use of different
    techniques to produce images for various purposes. Figure 1.1 shows the examples
    of different medical images. In today’s clinical practice, imaging modalities
    such as X-ray, computed tomography (CT), magnetic resonance imaging (MRI), and
    US are commonly used. These medical images either examine multiple organs (e.g.
    MRI and CT) or are specific to particular organs (e.g. retinal images, mammograms,
    dermoscopy, and colonoscopy). The volume of data produced from each modality also
    varies (Shen et al. 2017). Each imaging modality offers distinct advantages for
    various applications and diagnostic objectives, as well as limits in revealing
    the internal structure and functions of the many organs of the body. X-ray, CT,
    MRI, US, dermoscopy, colonoscopy, microscopic images, and optical coherence tomography
    (OCT) are just a few examples of the most widely used medical imaging modalities
    that will be discussed in this chapter. In addition to this, we discuss their
    basic principle of working along with their usage.


    # ### 1.1.1 X-Rays


    In the medical field, X-ray imaging is employed to generate detailed images of
    internal anatomical structures, such as bones, aiding in the diagnostic process.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/b1cb9f9389f496c3199cc2e1e74e4626_24_0.png)


    # Figure 1.1 Different kinds of medical imaging modalities.


    X-rays, classified as electromagnetic waves, possess the capability to penetrate
    various solid objects, including the human body. Among the common imaging modalities,
    X-rays are frequently utilized to visualize internal bodily structures. The procedure
    involves directing a focused beam of X-rays toward the specific region of interest
    within the body. Upon traversing through the body, the X-rays are captured by
    a sensitive detector, such as film or a digital sensor. Different tissues within
    the body interact with X-rays differently; softer tissues, like muscles and organs,
    absorb fewer X-rays, resulting in darker shades on the resultant image, while
    denser tissues, like bones, absorb more X-rays, manifesting as white areas on
    the image. A proper amount of radiation must be used, and the body component must
    be at the ideal location relative to the X-ray beam, for a clear image to be produced.
    To get a more accurate depiction of the body''s three-dimensional (3D) structure,
    many pictures of the same location are acquired from different angles and superimposed
    to create a two-dimensional (2D) image. A radiologist, a specialized medical practitioner,
    focuses on analyzing medical images to diagnose various conditions such as fractures,
    cancers, and other ailments by interpreting the visual information depicted in
    the images. An X-ray is electromagnetic radiation that is produced in a glass
    tube that has been evacuated. A cathode and an anode create a voltage gap, which
    propels electrons across the vacuum of the tube and toward the revolving tungsten
    anode. When electrons impact the anode, they generate both X-rays and heat. X-rays
    are exclusively produced when there is a voltage differential applied across the
    cathode and anode, rendering the X-ray tube inert until activated by the medical
    radiation technologist. X-ray, CT, fluoroscopy, and angiography are all types
    of imaging that employ this physical on/off setup. X-rays are commonly employed
    to'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'capture images of bones, primarily to assess for fractures or other abnormalities.
    Additionally, dentists and orthodontists utilize X-rays to obtain detailed views
    of teeth. Moreover, X-rays are instrumental in detecting tumors or abnormalities
    in bones. They are also used to guide surgeons during surgery. X-ray images of
    the breast are obtained during mammography to find and assess anomalies like tumors
    or microcalcifications. As it can spot probable cancer signals before they can
    be felt during a physical examination, it is a crucial tool in the early identification
    and prevention of breast cancer. X-rays are not only utilized for imaging the
    bones but also the chest and lungs to diagnose diseases, including pneumonia,
    lung cancer, and emphysema. In addition to detecting gallstones, kidney stones,
    and intestinal obstruction, X-ray imaging can be used to evaluate abdominal organs
    such as the liver, spleen, and kidneys. Figure 1.11 represents an example of chest
    X-ray. Due to its broad accessibility, speed, and affordability, X-ray imaging
    stands as a widely favored diagnostic method. It is a noninvasive procedure, eliminating
    the need for incisions or injections, thus ensuring a reasonably safe and comfortable
    experience for the patient. Low tissue contrast is one of the drawbacks of X-ray
    imaging. Distinguishing between malignancies and healthy tissue is more difficult
    than with other modalities. X-ray imaging also has the drawback of only providing
    a 2D picture of the body’s 3D structure, which might make it impossible to see
    certain internal structures, especially in inaccessible locations. Some aspects
    of interior structures can be obscured by the lack of depth in the 2D image, making
    it harder to make accurate diagnoses.


    # 1.1.2 Computed Tomography (CT)


    A CT scan, or computerized tomography scan, generates intricate images of the
    body’s internal structures by combining X-rays and computer technology. Unlike
    traditional X-rays, CT scans produce cross-sectional images, offering a different
    perspective of the body. These scans are noninvasive, ensuring a painless experience
    for the patient. By aiming X-rays at the body from various angles and measuring
    the intensity of the X-rays as they move through the body with detectors, CT scans
    can provide high-resolution images of internal anatomy. CT scans use a multi-slice
    detector, a specialized sort of X-ray detector that can gather many images simultaneously
    from different angles to provide detailed cross-sectional views of the body. Spatial
    filtering, which reduces noise and boosts contrast, and multi-energy imaging,
    which employs X-rays of varying energies to record distinct data and enhance contrast,
    are two more methods used in CT scans to improve image quality. CT scans produce
    images that can be viewed in a variety of formats, including cross-sectional slices,
    3D images, and even virtual reality images, thanks to computer processing. Radiologic
    technologists do CT scans, while radiologists, medical specialists with training
    in image interpretation, decipher the'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'results. When using a CT scanner, the patient will lie on a table that will
    be moved into the center of a machine in the shape of a doughnut. The scanner''s
    internal X-ray tube spins to produce a sequence of X-ray beams at varying angles
    as it rounds the patient. The X-ray light creates a pattern of attenuation as
    it goes through the body because it is absorbed at different rates by various
    tissues. An array of detectors positioned opposite the X-ray tube picks up the
    pattern of attenuated X-rays and turns them into electrical impulses. The data
    from these electrical signals is then transferred to a computer, where complex
    algorithms are used to reassemble the information as a 3D image. CT scans are
    employed to enhance the examination of soft tissues and intricate areas of the
    image that may not be clearly defined by traditional X-rays. They are commonly
    employed to visualize and assess blood vessels, internal organs, bones, the brain,
    neck, spine, and chest. CT scans aid medical professionals in various diagnostic
    tasks, including tumor detection, fracture evaluation, and monitoring the impact
    of cancer treatment on patients.


    Figure 1.1a shows an example of a CT scan of the lungs. CT imaging''s high resolution
    is a big benefit since it allows doctors to see anatomical details such as bone
    structure, organ function, and blood vessel structure. This makes it beneficial
    for diagnosing a large variety of illnesses. In addition to its usefulness as
    a diagnostic tool, CT imaging technology is commonly available in settings such
    as hospitals, clinics, and doctors'' offices. In addition, CT imaging is quick
    and efficient, with data typically being made available in a short amount of time.
    Ionizing radiation exposure is a key concern with CT imaging since it can increase
    the risk of cancer and other health issues, especially with repeated scans or
    in pregnant women. CT scanners also represent a large financial commitment, which
    can be out of reach for some hospitals. Because of this, some patients may not
    be able to get their hands on this form of imaging. The advantages and disadvantages
    of CT scans must be weighed carefully, and when possible, other imaging methods
    should be considered.


    # 1.1.3 Medical Resonance Imaging (MRI)


    MRI, or magnetic resonance imaging, shares similarities with CT scans but offers
    superior quality, producing detailed cross-sectional images of body structures.
    Similar to CT scans, MRIs are painless and safe, as magnetic fields and radio
    waves do not pose any adverse effects on patients. MRI utilizes a robust magnetic
    field to align the nuclei of hydrogen atoms within the body, enabling the generation
    of precise images of internal structures. This generates a minute magnetic moment
    that can be exploited to provide accurate representations of the body''s internal
    anatomy. First, a weak radio signal is emitted from the rearranged hydrogen nuclei
    thanks to the use of radiofrequency (RF) pulses. A detector picks up on these
    signals, and after being analyzed by a computer, we get clear pictures of the'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'body''s inner workings. The hydrogen atoms in a patient''s body are rearranged
    when patients enter an MRI machine and are subjected to a powerful magnetic field.
    Then, a weak radio signal is produced by the aligned hydrogen atoms after radio
    waves are delivered through the body. An antenna picks up the radio wave, and
    the information is transmitted to a computer for processing. The data is processed
    by sophisticated algorithms to create a 3D model of the body''s internal anatomy.
    Hydrogen atoms, which are present in every cell in the body, are found in variable
    concentrations depending on the kind of tissue. Axial, sagittal, and coronal pictures
    can be generated in an MRI, giving a full 3D picture of the patient''s anatomy.


    MRIs are employed for observing the inner composition of the brain, spinal cord,
    bones, heart, blood vessels, and various other internal bodily structures. In
    Figure 1.1b–d represent an example of MR T1-weighted, T2-weighted, and Flair,
    respectively. MRI is favored over alternative imaging methods such as X-rays and
    CT scans due to its avoidance of harmful ionizing radiation exposure to patients.
    Soft tissues, including muscles, tendons, and ligaments, can also be seen in exquisite
    detail by these instruments. They can provide images on different planes, providing
    a more comprehensive view of internal structures. In addition to its other benefits,
    MRI''s ability to deliver microscopic resolution without causing any damage or
    discomfort is a major selling point. Nonetheless, MRI scanners are responsive
    to metal; thus, individuals with specific implants, such as pacemakers, are ineligible
    for MRI scans.


    Scanners can be a considerable investment due to their high cost, making them
    out of reach for some establishments. Examination times may also be greater compared
    to those of X-rays or CT scans.


    # 1.1.4 Positron Emission Tomography (PET)


    A PET scan produces a 3D image of the inner body parts. To see and quantify metabolic
    and functional activities taking place inside the body, doctors use PET scans.
    In the medical field, it is frequently employed for the detection, classification,
    and follow-up of a wide range of conditions, including cancer and neurological
    diseases. A PET scan works by looking for radiotracers that release positrons.
    These radiotracers are substances that are injected into the body and emit positrons,
    which are positively charged particles. When a positron meets an electron within
    the body, they mutually annihilate, generating two gamma rays that propagate in
    opposing directions. These gamma rays are identified by the PET scanner and employed
    to construct 3D images depicting the distribution of the radiotracer within the
    body. PET scans are widely used in oncology to assess tumor growth, evaluate treatment
    response, and detect metastases. PET scans serve various purposes, notably in
    generating high-resolution brain images and'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'forecasting cancer progression. They are commonly employed for patients already
    diagnosed with cancer, as PET scans can accurately illustrate the extent of cancer
    spread and evaluate the efficacy of chemotherapy. Additionally, PET scans aid
    in pre-surgical planning for procedures involving the brain or heart. Moreover,
    conditions such as Alzheimer''s disease, epilepsy, and Parkinson''s disease can
    be diagnosed using PET scans, as they provide clear insights into changes in brain
    functionality. In Figure 1.1i–k represent an example of PET scans for normal,
    mild cognitive impairment, and Alzheimer''s disease, respectively. PET scans can
    detect functional and metabolic changes in tissues before structural abnormalities
    become apparent through other imaging techniques. PET scans can offer a thorough
    assessment of the entire body, allowing for the detection of metastatic disease
    or the evaluation of multiple organ systems simultaneously. Unlike other imaging
    techniques, PET scans provide information about the physiological and biochemical
    processes occurring within the body, enabling a better understanding of disease
    mechanisms. PET scans involve the use of radioactive substances, which expose
    the patient to a small amount of ionizing radiation. While the radiation dose
    is generally considered safe, it is still a factor to consider, especially for
    pregnant women and children. It may be difficult to correctly localize tiny lesions
    on PET scans because of their potentially inferior spatial resolution compared
    to other forms of imaging like CT or MRI. PET scans can be more expensive than
    other imaging techniques, mainly due to the production and administration of radiotracers,
    as well as the specialized equipment required for scanning and image analysis.
    PET scanners are not as widely available as other imaging modalities, which can
    limit access to this technology in certain areas. It is important to note that
    PET scans are typically used in conjunction with other imaging modalities to provide
    a more comprehensive evaluation of a patient''s condition. The decision to use
    a PET scan is made by a physician based on the specific clinical scenario and
    the potential benefits outweighing the risks and costs associated with the procedure.


    # 1.1.5 Ultrasound (US) Images


    US, also known as a sonogram, utilizes high-frequency waves to visualize internal
    body structures. In this medical imaging technique, a transducer emits high-frequency
    sound waves and captures the returning echoes from internal structures to create
    images. Some of the sound waves that are transmitted into the body are reflected
    back to the transducer as they cross a line separating various types of tissue.
    The transducer receives these echoes, converts them into electrical signals, and
    transmits them to a computer for analysis, resulting in high-resolution images
    of the body''s internal structures. Depth information is obtained by measuring
    the time delay between the emitted US wave and the'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'reflected wave from each layer of the sample, enabling the creation of 2D-
    or 3D images. US is frequently used to monitor the growth of unborn babies, providing
    real-time imaging. It is typically unsuitable for imaging bones or air-containing
    tissues such as lungs but finds extensive application in abdominal, vascular,
    and thyroid examinations. In abdominal imaging, US is commonly used to examine
    the organs of the digestive system, including the gallbladder, pancreas, spleen,
    and kidneys. As a medical imaging technique, US has a number of benefits. The
    portability of the tools makes it possible to do US imaging procedures anywhere,
    not just at a hospital. Furthermore, employing US offers the benefits of speed
    and radiation-free imaging. As it does not utilize potentially harmful ionizing
    radiation, it is also favored over other imaging methods like X-ray and CT scans.
    The capability to produce real-time images also enables the dynamic evaluation
    of internal structures and functions. US imaging, however, has a number of drawbacks.
    The inability to picture structures under the surface or behind opaque media (such
    as bone or gas) is a major drawback. Aberrations like bone or air echoes can further
    distort images, making it difficult to make out inner structures. US images and
    the precision of the diagnosis may also be affected by the US technician''s level
    of expertise.


    # 1.1.6 Colonoscopy


    Virtual colonoscopy, also referred to as CT colonoscopy, allows medical professionals
    to examine the large intestine for colon or rectal cancer, as well as growths
    called polyps, as demonstrated in a study (Nguyen and Lee 2019). The principle
    behind colonoscopy is the insertion of a colonoscope into the rectum and through
    the colon. The colonoscope is a long, flexible tube equipped with a light source
    and a camera at the tip. It allows the physician to visualize the colon lining
    in real time and detect any abnormalities such as polyps, ulcers, inflammation,
    or tumors. During the procedure, the physician can also perform therapeutic interventions,
    such as polyp removal or tissue biopsies, if necessary. Figure 1.1g represents
    an example of colonoscopy. Colonoscopy is an effective diagnostic tool for identifying
    colorectal cancer, inflammatory bowel disease (e.g. ulcerative colitis and Crohn''s
    disease), and other conditions affecting the colon and rectum. Colonoscopy allows
    for the detection and removal of polyps, which are abnormal growths that may develop
    into cancer over time. Colonoscopy has a high diagnostic accuracy for colorectal
    cancer and other gastrointestinal (GI) conditions, helping to guide appropriate
    treatment plans. A colonoscopy is an invasive procedure that requires the insertion
    of a flexible tube into the rectum and colon, which can cause discomfort or pain
    for the patient. It is important to discuss the risks, benefits, and alternatives
    of colonoscopy with a healthcare professional to make an informed decision about
    the procedure based on individual circumstances and medical history.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# ### 1.1.7 Dermoscopy


    Dermoscopy is a noninvasive imaging technique used to evaluate skin lesions. It
    is also known as dermatoscopy or epiluminescence microscopy. This process entails
    inspecting the skin with a dermoscope, a portable instrument fitted with magnifying
    lenses and illumination. Dermoscopy allows dermatologists to observe skin structures
    and patterns that are not visible to the naked eye, assisting in the identification
    and treatment of various skin conditions, notably melanoma and other forms of
    skin cancer. The principle behind dermoscopy is the use of polarized or non-polarized
    light to illuminate the skin and magnify the surface and subsurface features.
    The dermatoscope eliminates the surface reflection of the skin, allowing for a
    clearer view of the deeper layers. Dermoscopy also utilizes liquid immersion or
    contact dermoscopy, in which a gel or oil is applied to the skin to eliminate
    the air gap between the dermoscope and the skin, further improving image quality.
    Dermoscopy plays a crucial role in the early detection of melanoma, the deadliest
    form of skin cancer. It helps dermatologists assess the morphological characteristics
    of pigmented skin lesions and differentiate between benign and malignant lesions.
    It aids in distinguishing between different types of skin lesions and guiding
    appropriate treatment plans. In Figure 1.1e represents an example of a skin lesion.
    Dermoscopy can be used to monitor changes in skin lesions over time, particularly
    in individuals with a history of skin cancer or atypical moles. It helps identify
    any signs of progression or regression, aiding in the decision-making process
    for further management. Dermoscopy improves the diagnostic accuracy of skin lesions,
    particularly in differentiating between benign and malignant lesions. Dermoscopy
    is a noninvasive procedure that does not require any incisions or tissue sampling.
    It can be performed quickly and easily in an outpatient setting. Dermoscopy can
    reduce the need for unnecessary biopsy of benign lesions, leading to cost savings
    in healthcare resources. The quality and capabilities of the dermoscope used can
    influence the accuracy and reliability of dermoscopic images. High-quality equipment
    with appropriate magnification and lighting is essential for optimal results.


    # ### 1.1.8 Microscopic Images


    Microscopic imaging refers to the use of microscopes to visualize and examine
    objects at a microscopic level. It involves the magnification of objects that
    are too small to be seen with the naked eye, allowing for a detailed examination
    of their structure and features. Science and medicine rely heavily on microscopic
    imaging for a wide range of purposes, including the study, diagnosis, and analysis
    of tiny materials, organisms, and other specimens. The principle behind microscopic
    imaging is based on the interaction of light or electrons'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'with the sample being observed. There are different types of microscopes used
    for imaging, including optical microscopes and electron microscopes. Tissue samples
    are commonly obtained through a biopsy for examination, with small sections of
    the tissue subsequently stained and colored to reveal cellular features. Counterstains
    are employed to enhance the color, visibility, and contrast of the images. Such
    images are commonly utilized in cancer identification, with characteristics such
    as cell size, shape, and distribution typically scrutinized. Figure 1.1f represents
    an example of a microscopic image. Microscopic imaging is crucial in medical diagnostics
    and pathology. It allows for the examination of biopsy samples, the identification
    of cellular abnormalities, and the diagnosis of various diseases and conditions.
    Microscopic imaging techniques, such as optical microscopy, allow for nondestructive
    examination of samples. This means that samples can be observed without altering
    their structure or composition, enabling further analysis or experimentation.
    Advanced microscopic imaging equipment, such as electron microscopes, can be expensive
    to acquire and maintain. Each microscopic imaging technique has its specific limitations
    in terms of resolution, depth of field, and contrast. Choosing the appropriate
    imaging technique for a specific application is important to obtain accurate and
    reliable results.


    # 1.1.9 Optical Coherence Tomography (OCT)


    OCT is a noninvasive imaging method that utilizes light waves to produce detailed
    cross-sectional images of biological tissues. The principle behind OCT is based
    on the interference of light waves. The technique employs low-coherence interferometry,
    where a near-infrared light beam emitted by a light source is divided into two
    paths: a reference arm and a sample arm. The reference arm includes a mirror,
    while the sample arm directs the light toward the tissue under examination. The
    light reflected back from both arms is recombined, and interference occurs between
    the reference and sample beams. The interference pattern is detected and analyzed
    to reconstruct a depth-resolved image of the tissue. Through measuring the time
    delay of reflected light, OCT can ascertain the depth of various tissue layers
    or structures within the sample, which is then utilized to produce a detailed
    cross-sectional image of the tissue. OCT finds widespread application in diagnosing
    and treating various eye conditions such as macular degeneration, diabetic retinopathy,
    glaucoma, and retinal detachment. It provides detailed images of the layers within
    the retina, allowing for early detection and monitoring of eye diseases. Figure
    2.1h represents an example of OCT of an eye. In cardiology, OCT is used to visualize
    and assess coronary arteries. It helps in diagnosing and characterizing coronary
    artery disease, detecting plaque buildup, and guiding interventions such as stent
    placement. OCT provides detailed, high-resolution images of'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'tissue structures, enabling the visualization of fine details and abnormalities.
    It provides real-time imaging, allowing for immediate evaluation and assessment.
    The penetration depth of OCT is limited to a few millimeters, depending on the
    tissue being imaged. This restricts its application in imaging deeper tissues
    or structures. Advanced OCT systems can be expensive, limiting their accessibility
    in certain healthcare settings. However, the technology has become more widely
    available over time.


    # 1.2 Datasets for Segmentation of Medical Images


    Segmentation using deep learning methods requires high-quality and diverse datasets
    for training and evaluation. In this section, we discuss the datasets commonly
    used in the field of segmentation and their characteristics. Researchers can build
    and test their deep learning models with the help of these datasets. The performance
    and generalizability of the created models can be better understood by learning
    more about the qualities and challenges of these datasets. Domain specialists
    oversee the creation and annotation of these datasets. The details of each of
    these datasets are described in the subsections below, and metadata is provided
    in Table 1.1.


