    pooling to enhance the extraction of features. Zhang et al. (2019) presented a
    two-phase framework based on a 3D FCN for segmenting kidney and tumor. To lessen
    class disparity and computation expense, the first step is locating the kidney
    in its preliminary stages and removing the extraneous background. The kidney and
    tumor on the cropped patch are then carefully segmented in the second stage. With
    a Composite Dice of 90.24%, the suggested technique places the fourth-place team
    out of 105 contending teams in the MICCAI 2019 Kidney Tumor Segmentation (KiTS)
    Challenge. To segment kidneys and kidney tumors from CT images, Zhao et al. (2020)
    presented a multi-scale supervised U-Net. Utilizing the KiTS19 dataset, the authors
    devised an architecture to improve the performance of the 3D U-Net by integrating
    deep supervision with exponential loss. Table 2.5 summarizes various deep learning-based
    models for kidney segmentation.


    # 2.3.1.6 Heart


    The heart is a vital organ in our bodies. However, many people''s lives are also
    jeopardized by numerous heart problems. To tackle practical issues in the'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'domain of cardiac medical care, automatic segmentation of the heart region
    must be realized. The complete heart has been segmented using DL-based neural
    networks, according to several studies (Wang and Smedby 2018; Payer et al. 2018).
    Tran et al. (Tran 2016) performed pixel categorization using a fully convolutional
    neural network architecture for an MRI of the heart. Short-axis cardiac MRI has
    never seen such sophisticated semantic segmentation as is possible with the proposed
    FCN architecture. Han et al. (2020) developed a volumetric FCN that is cascaded.
    This method employs a pair of V-Nets in series. The first network pinpoints the
    heart, while the second divides the heart and large vessel structures into smaller
    parts. To aid with heart segmentation from MR images, the authors rebuilt the
    V-Net into a 3D V-Net. Ye et al. (2019) provided a novel deeply supervised 3D
    UNET that improves upon the original network through the use of multi-depth fusion
    to extract context information. The authors took focus loss and extended its use
    to multi-category challenges in the field of picture segmentation. Finally, they
    coupled the focused loss with the dice loss to form the new hybrid loss function.
    The hybrid loss can be used to address the issue of uneven categories. Shen et
    al. (2019) developed a unified architecture that utilizes both deep learning and
    the conventional level set approach to coronary Computed Tomography Angiography
    (CTA) segmentation. The 3D semantic properties of coronary arteries are learned
    utilizing a 3D FCN, which serves as a great jumping-off point for the classical
    level set. Xu et al. (2020) proposed a new type of GAN called a progressive sequential
    causal GAN (PSCGAN).


    This marks the pioneering development of a CA-free Ischemic Heart Disease (IHD)
    technique within cine MR imaging, capable of producing both an image akin to Late
    Gadolinium Enhancement (LGE) and accurately segmenting tissues relevant to diagnosis
    concurrently. To that goal, the PSCGAN has three very useful features:


    +   1) An iterative framework for image synthesis and segmentation training that
    uses a divide-and-conquer strategy and consists of three stages (i.e. a priori
    generation, conditional synthesis, and enhanced segmentation).


    +   2) A sequential causal learning network (SCLN) has been devised, featuring
    a multi-scale, two-stream pathway along with a multi-attention weighting unit.
    This architecture efficiently identifies task-specific dependencies while extracting
    spatial and temporal connections from cine MR images. It also incorporates the
    GAN architecture to use adversarial training to make it easier to understand the
    latent space dependencies of interest in cine MR images during the entire process.


    +   3) Two loss concepts developed for autonomous learning: To mitigate noise
    during synthesis, the authors employ a synthetic regularization loss term that
    makes use of the spare regularization, and in segmentation, the authors employ
    an auxiliary loss term that makes use of the number of pixels for each tissue
    to compensate for discriminating.'
