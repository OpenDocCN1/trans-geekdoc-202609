  md: '# ## 2.2.4 Multi-scale-Based Models


    Multi-scale segmentation designs were made to deal with the fact that there are
    different scales in the areas of interest. By dividing an image into numerous
    homogenous pieces at different scales, multi-scale segmentation schemes can present
    information at multiple scales. These architectures improved high-level segmentation
    by using a mix of local and global variables to label each pixel. In 2018, researchers
    at Arizona State University in the United States suggested U-Net++ to address
    the shortcomings of U-Net, such as its reliance on same-scale feature maps. Dense-Block
    was employed in the architecture to boost the traditional U-Net''s performance,
    as depicted in Figure 2.7. To bridge the gap among features across modules and
    boost gradient flow, this model used convolutions and dense connections on the
    skip-pathway, in contrast to the traditional model (U-Net) (Zhou et al. 2020).
    Additionally, it included the idea of deep supervision, which carries out architecture
    reduction. The proposed design is evaluated on multiple modalities by using four
    distinct medical image datasets: cell nuclei, colon polyps, liver, and lung nodules.
    The results show that U-Net++ outperforms the basic U-Net and Wide U-Net models
    on the basis of the Intersection-over-Union (IoU) measure, even when deep supervision
    was not utilized.


    # ## 2.2.5 Pyramid-Based Models


    To aggregate the context, the PSPNet (Zhao et al. 2017) suggested a pyramid pooling
    module and employed the auxiliary loss, as depicted in Figure 2.8. The significance
    of global scene categories lies in the fact that they provide a hint regarding
    the distribution of the segmentation classes. This data is collected via the pyramid
    pooling module''s extensive use of kernel pooling layers. Resnet is modified with
    dilated convolutions (DCs), and a pyramid pooling module


