  md: 'cross-entropy loss. To minimize the loss function, optimization algorithms
    such as stochastic gradient descent (SGD) or its variants are employed.


    # ## 5.3.1.7 Backpropagation


    The computation of gradients with respect to the network parameters is performed
    using backpropagation, which efficiently propagates errors backward through the
    network. These gradients are then utilized to update the weights of the network
    through the chosen optimization algorithm.


    CNNs achieve state-of-the-art performance on various computer vision tasks by
    learning hierarchical representations of input data through the repeated application
    of convolution, activation, pooling, and fully connected layers. This process
    enables CNNs to capture increasingly complex features and patterns, allowing them
    to excel in tasks such as image classification, object detection, and semantic
    segmentation.


    As the domain of deep learning is continuously evolving, the classical version
    of CNN has gone through a number of modifications and upgrades. Some of the variations
    widely used in medical image segmentation are AlexNet (Chen et al. 2021b; Priya
    and Vasudevan 2024).


    # ## 5.3.2 U-Net


    U-Net is a CNN architecture developed by Ronneberger et al. (2015) as depicted
    in figure 5.4. It is a widely used architecture for biomedical image segmentation
    and semantic segmentation tasks. U-Net is based on the FCN.


    U-Net has an encoder–decoder network architecture in the shape of a U. It has
    four encoder and decoder blocks joined by a bridge. The encoder and decoder networks’
    information flow is completed by the bridge. At every block, the encoder network
    doubles feature channels and cuts spatial dimensions in half, functioning as a
    feature extractor by activating convolutional layers before ReLU. The skip connections
    improve gradient flow and conserve information for improved semantic features,
    and the max-pooling lowers computing costs. By upscaling and concatenating skip
    connection feature maps, the decoder network creates segmentation masks. Convolutions
    and sigmoid activation are then used for pixel-wise classification. The researcher
    found U-Net found a wide range of applications in the domain of brain tumor detection.
    Akter et al. proposed a deep CNN and U-Net for image classification and segmentation
    of brain tumor images and they could achieve accuracy of 90.8% (Akter et al. 2024).
    Cheng et al. proposed a deep network incorporating VGG-19 network in the coding
    stage of U-Net for edge detection in brain tumor images. They also added an edge
    detection module to enhance the'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'performance of the proposed model. The experimental result shows that the proposed
    model could achieve promising results across different standard datasets (Cheng
    et al.).


    In the field of ever-evolving deep learning techniques, U-Net has gained wide
    acceptance in the domain of medical image segmentation.


    # 5.3.3 GoogleNet or Inception


    GoogleNet, also known as Inception-v1, marks a significant development in the
    evolution of CNN architectures, particularly in the realm of image classification
    as shown in figure 5.5. Introduced by researchers at Google in 2014, GoogleNet
    revolutionized deep learning by offering an efficient and scalable solution for
    processing large-scale image datasets.


    At the core of GoogleNet lies the groundbreaking concept of the Inception module,
    which fundamentally altered the way CNNs process information. Unlike traditional
    convolutional layers that utilize fixed-size filters, Inception modules incorporate
    multiple parallel convolutional branches with varying filter sizes. This configuration
    empowers the network to capture features at different spatial scales concurrently,
    heightening its capacity to identify intricate patterns and objects within images.


    A key design principle underpinning GoogleNet is its commitment to computational
    efficiency without compromising performance. To achieve this, GoogleNet incorporates
    dimensionality reduction techniques, such as 1x1 convolutions, prior to applying
    larger convolutions. By diminishing the number of input channels, these convolutions
    alleviate the computational burden while preserving informative content.


    Furthermore, GoogleNet adopts a novel architectural structure that fosters both
    depth and width in the network. Instead of merely stacking layers upon layers,
    the architecture features multiple levels of abstraction, with deeper layers capturing
    more abstract and elevated features. This hierarchical representation empowers
    the network to discern increasingly intricate patterns, resulting in enhanced
    classification accuracy.


    Another noteworthy aspect of GoogleNet is its utilization of global average pooling
    instead of conventional fully connected layers at the conclusion of the network.
    Global average pooling computes the average value of each feature map, significantly
    reducing the number of parameters in the network and mitigating the risk of overfitting.
    This refined solution not only simplifies the model but also fortifies its generalization
    capability.


    GoogleNet has emerged as a trailblazer in the domain of deep learning, providing
    an exemplary instance of innovative architectural design in CNNs. Its exceptional
    performance on standard benchmark datasets has positioned it as'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'a leading model in the field, and its broad range of applications across various
    domains makes it invaluable in healthcare, autonomous vehicles, security, and
    e-commerce. GoogleNet has made significant strides in optimizing computational
    resources, organizing feature representation hierarchically, and implementing
    auxiliary supervision methods. These innovations have positioned it as a fundamental
    building block in the creation of advanced neural network architectures not only
    for image classification but also for other applications.


    # 5.4 Deep Learning Algorithms Employed in the Segmentation of Brain Tumor Images


    Brain tumor segmentation refers to a process in medical image processing where
    algorithms are applied to delineate and identify regions of interest (tumor tissues)
    within brain images, typically acquired through techniques such as MRI or CT.
    Segmentation involves partitioning the brain image into multiple regions or classes,
    such as tumor tissue, healthy tissue, edema, and necrosis. This is important for
    various medical applications, including diagnosis, treatment planning, and monitoring
    of brain tumors. The rising popularity of machine learning and deep learning methods,
    notably CNNs, for brain tumor segmentation stems from their capacity to grasp
    intricate patterns from extensive datasets and their adeptness in processing high-dimensional
    medical images. These algorithms are trained on annotated datasets containing
    manually outlined tumor regions by experts. Subsequently, they can autonomously
    segment tumors in previously unseen images.


    Deepak and Ameer (2019) presented a deep transfer learning approach for classifying
    glioma, meningioma, and pituitary tumors from brain MRI images, achieving a mean
    classification accuracy of 98% and outperforming existing methods. Transfer learning
    proves effective even with limited medical image data, with insights into misclassifications
    provided for further analysis. Cheng et al. (2015) proposed a method for improving
    brain tumor classification in T1-weighted contrast-enhanced MRI images by augmenting
    the tumor region and splitting it into ring-form subregions. This approach significantly
    enhanced classification accuracy compared to traditional methods, demonstrating
    its feasibility and effectiveness for computer-aided diagnosis. Cheng et al. (2016)
    introduced a novel content-based image retrieval (CBIR) for classifying brain
    tumors in T1-weighted contrast-enhanced MRI images, achieving a mean average precision
    of 94.68% by augmenting tumor regions, enabling adaptive spatial division for
    feature extraction, and applying Fisher kernel framework for similarity measurement.
    The new system outperformed related state-of-the-art methods, showcasing its effectiveness
    in supporting clinical decisions through image'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'retrieval in the medical field. Pereira et al. (2016) proposed an automatic
    brain tumor segmentation method using CNNs with small kernels and intensity normalization,
    achieving top performance in the BRATS 2013 Challenge and second place in the
    BRATS 2015 Challenge. The method demonstrated effectiveness in accurately segmenting
    brain tumors from MRI images, offering the potential for improved treatment planning
    and clinical practice. Biratu et al. (2021) provided a comprehensive survey of
    recent advancements in brain tumor segmentation and classification methods, including
    region growth, shallow machine learning, and deep learning techniques. They compared
    their strengths, weaknesses, technical aspects, and performance metrics to offer
    insights into the current state-of-the-art in this field. Cheng et al. (2023)
    introduced EAV-U-Net, a novel system for accurately detecting brain tumor lesion
    regions by incorporating a VGG-19 network structure, attention mechanism module,
    and edge detection module into the U-Net architecture. EAV-U-Net significantly
    improves segmentation performance, particularly in cases with hazy tumor margins,
    achieving impressive results across multiple performance metrics on various standard
    datasets. Priya and Vasudevan (2024) introduced a hybrid model combining AlexNet
    and GRU neural networks for brain tumor classification using MRI data, achieving
    high accuracy, precision, recall rate, and F1-Score, showcasing the potential
    for improved patient outcomes and healthcare environment in brain tumor detection.
    The model demonstrated effectiveness in distinguishing between different types
    of brain tumors, contributing to early detection and characterization of malignancies.


    # 5.5 Deep Learning Models for Retinal Vessel Segmentation


    Retinal vessel segmentation, integral in medical image analysis within ophthalmology,
    involves identifying blood vessels in retinal images for diagnosing conditions
    such as diabetic retinopathy. Accurate segmentation aids in disease detection
    and progression tracking, and facilitates the development of computer-aided diagnosis
    systems, playing a pivotal role in managing ocular pathologies.


    Jiang et al. (2018) presented a supervised method utilizing pretrained fully convolutional
    networks and transfer learning for accurate retinal blood vessel segmentation,
    achieving state-of-the-art accuracy across multiple databases. Additional unsupervised
    post-processing techniques are applied to refine segmentation results, showcasing
    the effectiveness of transfer learning in medical imaging applications. Zhao et
    al. (2020) introduced a retinal vessel segmentation technique employing generative
    adversarial learning with an extensive receptive field. This approach attained
    remarkable segmentation accuracy rates, surpassing'
  merge: -1
  img_proc: true
