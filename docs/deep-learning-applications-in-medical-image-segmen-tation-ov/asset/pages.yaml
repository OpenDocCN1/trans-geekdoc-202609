  md: current leading methods. By effectively capturing both intricate small blood
    vessels and broad, high-level semantic vessel features, the proposed algorithm
    showcases promise in aiding the diagnosis of ophthalmological conditions. Guo
    et al. (2020) introduced a Dense U-Net architecture using inception modules for
    retinal vessel segmentation, incorporating generative adversarial networks (GANs)
    in training for improved performance. Evaluation of the DRIVE dataset demonstrates
    high segmentation accuracy with a Dice rate of 82.15% and AU-ROC and AU-PR values
    of 0.9772 and 0.9058, respectively, indicating effectiveness in automated retinal
    vessel segmentation. Atlı and Gedik (2021) proposed Sine-Net, a novel deep learning
    architecture for retinal blood vessel segmentation, achieving high accuracy and
    robustness. Experimental validation on three publicly available databases (STARE,
    CHASE_DB1, and DRIVE) shows Sine-Net outperforms existing methods in certain metrics,
    demonstrating its potential for clinical applications. Chen et al. (2021a) proposed
    a comprehensive review of deep learning-based retinal blood vessel segmentation,
    emphasizing its importance in diagnosing diseases such as diabetes and hypertension
    to prevent blindness. It surveyed recent publications, identified trends in network
    architectures, outlined challenges, and suggested future research directions to
    advance and enhance models in this domain. Begundez-Arias et al. (2021) introduced
    a deep learning-based method for retinal blood vessel segmentation using a simplified
    U-Net architecture with novel loss function and batch normalization, achieving
    robust and accurate results across diverse fundus image datasets. Evaluation against
    manual segmentations in DRIVE, STARE, and CHASE_Db1 databases demonstrates superior
    performance compared to existing methods, suggesting its potential for integration
    into clinical tools for vascular structure segmentation. Liu et al. (2022) introduced
    an improved U-Net algorithm for retinal vessel segmentation, employing global
    convolutional networks, attention modules, and multi-scale feature extraction
    to accurately delineate vessel boundaries. Evaluation of DRIVE and CHASE_DB1 datasets
    demonstrates superior accuracy, outperforming existing algorithms with an average
    performance enhancement. Abbi et al. (2023) have created LMBiS-Net, a lightweight
    pixel-level CNN with a very small number of learnable parameters (only 0.172 M),
    for the purpose of segmenting retinal capillaries. In order to facilitate information
    flow between the encoder and the decoder, the network includes bidirectional skip
    links in addition to multipath feature extraction blocks. Ilesanmi et al. (2023)
    presented a systematic review of CNN algorithms for retinal fundus image segmentation
    and classification, highlighting their potential to aid early detection and treatment
