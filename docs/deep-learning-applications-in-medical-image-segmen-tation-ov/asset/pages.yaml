    a novel adversarial neural network for segmenting medical images. In contrast
    to the extensive pixel-level labeling needed for image segmentation, the single
    scalar output (real or fake) from a typical GAN discriminator might not provide
    adequate gradient feedback for ensuring network stability. Rather than employing
    a conventional fully connected network for segmentation, the authors devised a
    novel adversarial critic network equipped with a multi-scale loss function. This
    approach compels both the critic and the segmentor to grasp both global and local
    features. This yields segmentation label maps. The authors show that a SegAN architecture
