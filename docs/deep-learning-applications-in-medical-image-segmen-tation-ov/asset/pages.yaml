    # 4.4.4 Myelination in Premature Babies


    The results reported in Sections 4.2 and 4.3 are for normal full-term myelination.
    However, we should closely monitor and analyze preterm myelination to record its
    inherent differences with myelin progress in term-born neonates and infants. We
    have obtained the percentage lag in myelination (plag_MI) index of premature babies
    compared to term births. To our knowledge, this is the first-ever quantitative
    metric to accurately map the delay or retardation in preterm myelination. In our
    study, we measure a plag_MI value between 27.97% and 46.65% in premature children
    relative to their term-equivalent controls. Nevertheless, it should be noted that
    the above plag_MI value holds good for the pediatric subjects considered in this
    work. Extension of the results to an unknown and heterogeneous population can
    be done only after ensuring compatibility with the study population in the following
    aspects: gestational age of the preterm baby at birth, presence of birth complications,
    brain anomalies, congenital malformations, injuries, etc. More information on
    premature myelination and the associated challenges are elucidated in Section
    5.4.


