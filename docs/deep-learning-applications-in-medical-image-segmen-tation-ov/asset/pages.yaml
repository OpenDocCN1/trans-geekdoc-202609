    scenarios with complex structures or varying tissue characteristics (Pham et al.
    2000). Region-based techniques, such as clustering algorithms, may encounter difficulties
    in defining clear boundaries, especially when faced with noisy or overlapping
    structures (Zhang et al. 2019). Contour-based algorithms, though effective in
    certain scenarios, are sensitive to image artifacts and may require intricate
    preprocessing steps (Gonzalez et al. 2008).'
