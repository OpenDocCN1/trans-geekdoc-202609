    # 6.4.1 Dataset Quality and Availability


    The scarcity of extensively annotated datasets for training poses a significant
    obstacle to the successful use of DL-based image segmentation methods. DL models
    are highly dependent on large quantities of high-quality labeled data, which are
    difficult to come by in the medical field, particularly in the case of uncommon
    retinal conditions (Gunduz et al. 2023). The lack of annotated datasets makes
    it more difficult to train reliable and accurate models as they could not fully
    reflect the complexity and diversity of real-world situations. Standardized datasets
    that may be used as benchmarks for comparing and assessing various segmentation
    techniques are required to overcome this difficulty. These datasets need to cover
    a broad spectrum of retinal conditions and include thorough annotations for reliable
    ground truth. The creation of these datasets will promote the development of DL
    methods for picture segmentation and allow for equitable comparisons between various
    strategies.


    # 6.4.2 Explainability and Interpretability of the Model


    CNNs in particular are DL models that are sometimes referred to as “black boxes”
    because of their sophisticated learning processes and complex topologies. In medical
    situations, where physicians must comprehend the logic behind the model’s predictions
    in order to make confident decisions, this lack of interpretability presents difficulties.
    DL models must be transparent and easily interpreted for clinical practice to
    embrace and use them. The development of methods that may shed light on these
    models’ decision-making process is underway. To improve interpretability and foster
    clinician trust, techniques such as saliency maps and attention mechanisms emphasize
    the areas of the picture that provide the most contributions to the model’s predictions.


    # 6.4.3 Complexity of Computation and Necessity for Resources


    Techniques for segmenting images based on DL need a significant amount of computing
    resources, such as strong hardware and effective software. Deep neural network
    training may be computationally demanding, including lengthy processing times
    and significant memory use. Implementing this complexity'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'may be difficult, especially in contexts with limited resources such as real-time
    apps or low-resource healthcare settings. In order to surmount these obstacles,
    scientists are investigating methods for enhancing the computational effectiveness
    of DL models. Included in this are model quantization and compression, which reduce
    the model''s size and processing demands without appreciably compromising accuracy.
    Additionally, DL inference may be made more accessible and useful for real-world
    deployment by enhancing its efficiency via the use of distributed computing and
    specialized accelerators, two developments in hardware technology.


    # 6.4.4 Ethical Issues


    There are significant ethical issues with the use of DL-based image segmentation
    in the medical field (Fernandez-Quilez 2023). Ensuring privacy and data security
    are crucial when handling confidential medical data. Sustaining trust and safeguarding
    patient privacy requires making sure that patient data is anonymized, maintained
    securely, and used only for approved reasons. In addition, any biases in the data
    and algorithms used for picture segmentation must be addressed. Unbalanced datasets
    may introduce biases that cause variations in the segmentation accuracy for various
    demographic groups. In order to prevent the continuation of current healthcare
    inequities, it is imperative that we work toward justice. The correct use of DL
    models in clinical practice is also governed by ethical issues. Healthcare practitioners
    should use caution when interpreting and making decisions based on these models
    since they have limitations and may pose hazards. To guarantee patient safety
    and ethical treatment, openness and unambiguous communication on the models''
    capabilities and limits are crucial.


    Therefore, there are a number of issues and restrictions that need to be resolved
    even if DL-based image segmentation approaches provide notable improvements in
    the field of retinal illnesses. These include the quality and accessibility of
    datasets, the interpretability and explainability of models, the computational
    complexity and resource needs, and ethical issues. Researchers and practitioners
    may improve the efficacy, dependability, and morality of DL-based picture segmentation
    in healthcare by addressing these issues.


