    # 1.3 Augmentation Techniques Used in Medical Image Segmentation


    Developing deep learning methods using medical images has long been an appealing
    avenue of study, aiming to aid clinicians in swift examinations and precise diagnoses.
    However, these methods require extensive datasets encompassing diverse variations
    during training. Unfortunately, medical image availability is often limited due
    to various factors like insufficient patient numbers for certain conditions, reluctance
    from patients to share their images, and shortages of medical equipment. Consequently,
    this scarcity leads to dataset bias, overfitting, and inaccurate outcomes. To
    mitigate these challenges, data augmentation emerges as a common remedy, with
    various techniques applied across different'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'image types in existing literature. Nevertheless, determining the most effective
    augmentation technique for specific image types remains ambiguous due to variations
    in diseases, network architectures, and dataset sizes used in different studies.
    In this section, we will discuss some of the augmentation techniques used in medical
    image segmentation.


    # Rotation


    Rotation-based image augmentations entail rotating an image while preserving its
    initial orientation. This rotation take place within a fresh coordinate system,
    ensuring the retention of the pixels’ relative positions. The rotation may proceed
    either clockwise or counterclockwise around an axis within a range spanning from
    1° to 359°. Nevertheless, with increasing rotation angles, there is a potential
    risk of losing image labels. Consequently, the reliability of this augmentation
    technique hinges on the extent of rotation. While rotation transformations might
    not be ideal for recognizing digits 6 and 9 in digit recognition tasks, they are
    typically deemed safe for medical images.


    # Flipping


    Flipping is a method that produces a mirrored version of an image by reversing
    the positions of its pixels relative to one of the two axes (in the case of 2D
    images). Although it can be performed along either the vertical or the horizontal
    axis, vertical flipping is seldom preferred due to potential inconsistencies in
    the interchange of the top and bottom regions of an image (Nalepa et al. 2019).


    # Translation


    Translation entails moving images along an axis by implementing a translation
    vector. This approach preserves the relative pixel positions, thereby reducing
    positional bias (Shorten and Khoshgoftaar 2019) and preventing models from excessively
    focusing on features in a specific spatial location (Nalepa et al. 2019).


    # Scaling


    Images are subjected to scaling along different axes through the application of
    scaling factors, which might differ or remain uniform across each axis. Specifically,
    scaling modifications can be described as either reducing in size (when the scaling
    factor <1) or enlarging (when the scaling factor >1).


    # Shearing


    This translation moves one edge of an image along either the vertical or the horizontal
    axis, leading to a parallelogram shape. Vertical shear displaces an edge along
    the vertical axis, while horizontal shear shifts an edge along the horizontal
    axis. The extent of shear is dictated by a shear angle.


    # Augmentation Using Intensities


    This augmentation includes modifying contrast or brightness, blurring, standardizing
    intensity, histogram equalization, sharpening, and introducing noise.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Gaussian noise alters intensity values by randomly sampling from a Gaussian
    distribution. Salt-and-pepper noise randomly assigns pixel values to either white
    or black. Uniform noise is incorporated by adjusting pixel values through random
    sampling from a uniform distribution.


    # Random Cropping and Erasing


    Random cropping augmentation entails choosing a small section from the original
    image and resizing it to match the original image''s dimensions. As a result,
    this augmentation technique can also be termed scaling or zooming. Random erasing
    augmentation involves randomly eliminating sections of the image.


    # Color Modification


    Color modification for image augmentation encompasses various techniques. For
    instance, an RGB-colored image is represented as an array, with three color channels
    denoting red, green, and blue intensity levels. This setup allows for altering
    the image’s color while retaining its spatial characteristics. This process, known
    as color space shifting, can be executed across multiple color spaces, as the
    original color channels are combined differently in each space. One approach to
    augmenting an RGB-colored image through color modification involves transforming
    the pixel values within the image’s color channels using filters applied to a
    histogram, thereby creating new images with altered color space attributes. Another
    method involves applying three shifts (integer values) from RGB filters and incorporating
    each shift into a channel within the original image. Additionally, image augmentation
    can involve adjusting hue, saturation, and value components, isolating specific
    color channels (e.g. blue, red, or green), and converting between different color
    spaces. However, converting a color image to grayscale should be done cautiously,
    as this conversion may reduce performance by up to 3% (Chatfield et al. 2014).


    # Generative Models


    Basic data augmentation methods outlined earlier are inadequate when handling
    intricate data such as medical images. Several studies have been conducted to
    propose data augmentation techniques more appropriate for medical applications.
    The overarching objective is to replicate a data distribution that closely resembles
    real-world data, making it challenging, if not impossible, to differentiate between
    newly generated samples and authentic data. Recent advancements in deep generative
    models have rendered them especially appealing for facilitating data augmentation
    tasks. For instance, generative adversarial networks (GANs) (Goodfellow et al.
    2020) have showcased their capacity to produce life-like images, leading to their
    widespread adoption in medical applications (Sandfort et al. 2019; Mahapatra et
    al. 2019). However, GANs also come with their limitations, including issues like
    learning instability, challenges in convergence, and susceptibility to mode collapse
    (Mescheder et al. 2018), wherein the generator generates only a'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'limited set of samples. Variational autoencoders (VAEs) (Kingma and Welling
    2014) represent another category of deep generative models, albeit receiving less
    focus in the realm of data augmentation. VAEs excel in output diversity compared
    to GANs and avoid mode collapse. However, a notable drawback is their tendency
    to often produce blurred and unclear output images, which arises from the regularization
    term incorporated in the loss function. In recent times, a novel category of deep
    generative models known as diffusion models (DMs) (Sohl-Dickstein et al. 2015;
    Ho et al. 2020) has surfaced, showing considerable potential in generating varied
    and lifelike outputs. Despite this promise, DMs are still in the early stages
    of development and have not gained significant traction in medical applications.
    However, they are anticipated to offer a compelling alternative to existing generative
    models. A drawback of DMs is their substantial computational expense and lengthy
    sampling duration. Table 1.2 presents cutting-edge deep learning models centered
