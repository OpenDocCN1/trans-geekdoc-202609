  md: '# 2.2.3 UNet


    Ronneberger et al. (2015) introduced U-Net, a well-known structure for medical
    image segmentation, employing the concept of deconvolution. The sophisticated
    framework of FCN serves as the foundation for this concept. U-Net’s enhanced design
    of skip connections across levels of the network is an additional benefit of the
    network’s expanded depth to 19 layers. It makes several adjustments to avoid having
    to choose between localization and context sensitivity. This trade-off increases
    as larger regions necessitate more pooling layers, which reduces the localization
    precision.


    Small-sized patches, on the other hand, can only see a limited amount of input
    context. There is a pair of paths of encoder and decoder in the suggested framework,
    as depicted in Figure 2.5. The encoder path is structured similarly to CNN. The
    decoder path consists of an upsampling layer, followed by a deconvolution layer.
    U-Net’s primary feature is its ability to make direct connections between


