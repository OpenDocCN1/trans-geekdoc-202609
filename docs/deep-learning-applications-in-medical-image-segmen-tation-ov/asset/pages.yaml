    in medical images is typically spread across numerous neighboring slices (e.g.
    in CT or MRI), correlations in successive slices are often observed. As a result,
    RNNs are able to make use of the sequential information supplied by the input
    slices to determine the contexts that exist between each pair. There are two main
    components of the RNN structure: the RNN, which handles inter-slice information
    extraction, and any CNN model, which handles intra-slice information extraction.
    Among RNNs, LSTM (Long Short-Term Memory) (Hochreiter and Schmidhuber 1997) is
    the most well known. The loss of spatial information that occurs in a normal LSTM
    network’s inputs is problematic for medical image segmentation. The replacement
    of vector multiplication with the convolutional operation makes convolutional
    LSTM (Srivastava et al. 2015) (CLSTM) a promising option. By taking into account
    contextual information across neighboring slices, CLSTM was added to the deep
    CNN output layer in Armato et al. (2011) to improve segmentation. With their strategy,
    the Dice Similarity Coefficient (DSC) increased to 0.8247 from 0.7976 for the
    well-known U-Net topology (Ronneberger et al. 2015).


    # 2.2.7 Attention-Based Models


    The human brain served as the model for the attention processes. The human brain
    does not fully comprehend the vast majority of the data given to the visual and
    auditory cortex, but it does remember the most crucial information. Both processing
    speed and efficiency are enhanced by the procedure. Although the RNN was where
    the attention mechanism first found application, it quickly spread to other areas
    of artificial intelligence, including image localization, speech recognition,
    and machine translation (Bahdanau et al. 2015; Chorowski et al. 2015; Vaswani
    et al. 2017). Researchers had high praise for the recurrent visual attention model
    proposed by Google DeepMind (Mnih et al. 2014). Similarly, the authors of Bahdanau
    et al. (2015) employed attention methods to address natural language processing
    issues. Researchers discovered that attention modules can be used in segmenting
    medical images, which became the primary research issue. The authors of Jin et
    al. (2019) applied an attention method for segmenting medical images. The method
    of attention was used by the authors of Jin et al. (2019) to perform semantic
    segmentation of medical images. It allowed the model to recover lost information.
    Additionally, He et al. (2016) use attention gates inside a deep network to separate
    the digestive tract from Computed Tomography (CT) scans. The process of attention
    helps the network to pick up on the variable shapes and sizes of organs. The CSAU-Net,
    proposed by Li et al. (2019), advocated a vessel'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'extraction technique. Prior to producing outcomes, the model adjusted features
    by integrating a connection loss and an attention weight. In Oktay et al. (2018),
    the authors published an attention U-Net model for segmenting organs from CT images
    under different conditions. The use of Attention Gates allowed attention U-Net
    to outperform the U-Net model with higher accuracy without considerably increasing
    the number of parameters or necessitating post-processing.


    # 2.2.8 Ensemble-Based Models


    The ensemble mechanism is effective in decreasing overfitting through training
    (Maclin 2016). The ensemble module integrates the results of multiple networks
    running in parallel to perform the necessary segmentation (Maclin 2016). The approach
    is based on a concept that incorporates both pre- and post-processing modules
    for images. To enhance the network’s ability to segment the ROI from the input
    image, a pre-processing unit is used, and then the result is refined in a post-processing
    stage. The deep learning community has discovered that ensemble mechanisms often
    outperform more traditional single subnetwork approaches. The training procedure
    benefits from the unique contributions of each subnetwork in the ensemble module
    (Li et al. 2018a). The authors of Kamnitsas et al. (2018), who suggested a network-of-networks
    ensemble to aid in tumor localization, were declared the winners of the BraTs
    2016 competition. Multiple U-shaped models were defined by the authors of Li et
    al. (2018a) to address multiple modalities with MRI data (Han and Ye 2018). Similar
    to this, Feng et al. (2020) suggested two distinct U-Net-inspired algorithms for
    the semantic segmentation of medical images. One method involves orthogonal-wavelet
    frames, whereas the other captures residual signals from a low-resolution path.
    This strategy delivers superior outcomes compared to the traditional U-Net model.


    # 2.2.9 Other Models


    R-CNN variants like Mask R-CNN (He et al. 2017) handle the instance segmentation
    issue, which necessitates simultaneous object identification and segmentation.
    Object identification and segmentation at two distinct levels are the building
    blocks of mask R-CNN models. To train deep generative models, researchers have
    developed the generative adversarial network (GAN) (Goodfellow et al. 2020). As
    shown in Figure 2.10, it is made up of two networks: a generator network that
    finds the distribution of data, and a discriminator network that attempts to tell
    the difference between the genuine distribution of data and the fake data provided
    by the generator. Together, these models learn the data distribution. A conditional
    generative adversarial network (M-GAN) for segmenting retinal vessels was proposed
    by the authors of Park et al. (2020). M-GAN employs layered deep FCN to compensate
    for losses.'
