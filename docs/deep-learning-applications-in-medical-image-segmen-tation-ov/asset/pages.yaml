    # 2.1 Introduction


    The introduction of the back-propagation learning algorithm marked a significant
    advancement in deep neural networks (DNNs). Although initially proposed in the
    1970s, it was not until the mid-1980s that the concept was comprehensively grasped
    and effectively utilized in the field of neural networks. The advancement in understanding
    and utilization of the back-propagation algorithm facilitated the achievement
    of self-directed learning. What sets DNNs apart from previous machine-learning
    approaches is the automated extraction of features. A DNN is a specific type of
    neural network that takes the form of a multilayer perceptron (MLP). There is
    no need for laborious hand-coding of feature extractors because it is trained
    with algorithms that automatically learn abstractions from collections of data.
    The term deep learning implies the inclusion of a large number of processing layers,
    in contrast to shallow learning models that have fewer layers of units. The transition
    from shallow learning to deep learning has enabled the mapping of more intricate
    and nonlinear functions that cannot be efficiently mapped using shallow architectures.
    This development has been aided by an increasing number of inexpensive processing
    units, such as the general-purpose graphics processing unit (GPU), and a large
    volume of training data (big data). The superior abundance of parallel processing
    cores in GPGPUs, despite being less significant than Central Processing Unit (CPUs),
    makes them more suitable for the implementation of DNNs. Aside from the back-propagation
    algorithm and GPU, the growth of data, or "big-data," in the last 20 years has
    also helped machine learning (ML) and deep learning grow and be used more. ML
    will persist in influencing and causing significant changes in various domains,
    including education, finance, governance, healthcare, manufacturing, marketing,
    and other sectors.'
