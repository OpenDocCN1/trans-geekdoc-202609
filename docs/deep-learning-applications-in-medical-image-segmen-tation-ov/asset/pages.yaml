    Chest X-rays are vital for diagnosing lung conditions, including cancer and other
    chest infections. In response, the authors proposed “CSR-Net” (Kumar et al. 2023),
    a fully CNN, integrating “Transfer Learning (TL) with ResNet-101 as a feature
