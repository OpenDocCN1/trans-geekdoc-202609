    # 11.3.1.3 Gradient Descent with Backpropagation


    Gradient descent is an optimization approach for training the CNN model. It iteratively
    modifies the network''s weights and biases to reduce the loss function, as shown
    in Figure 11.1.


    +   • Forward pass: The input data is passed through the network layers, resulting
    in a prediction.

    +   • Loss calculation: The loss function compares the predicted output with the
    ground truth label.

    +   • Backpropagation: The mistake (loss) is propagated backward through the network,
    calculating the gradients (slopes) for each weight and bias.

    +   • Weight update: The gradients are used to adjust the weights and biases in
    a way that minimizes loss.


    # 11.3.2 Common Architectures


    # 11.3.2.1 U-Net


    U-Net is a fully convolutional network (FCN) developed exclusively for medical
    image segmentation. It uses an encoder-decoder architecture with skip connections.


    # 11.3.2.2 Components


    +   • Encoder: Extracts features from the input image through repeated convolutional
    and pooling operations.

    +   • Decoder: Upsamples the extracted features and combines them with corresponding
    features from the encoder path (via skip connections) for precise localization.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '+   - Skip connections: Connect corresponding encoder and decoder layers directly
    to preserve spatial information and aid in precise segmentation of small structures.


    # 11.3.2.3 Convolutional Neural Networks (CNNs)


    CNNs are a type of deep neural network design that work particularly well with
    image data. These are skilled in capturing spatial characteristics and relationships
    within an image. CNNs are a broad category of architectures that use convolutional
    layers to extract features from images. They can be utilized for a variety of
    segmentation tasks. A complete image processing is shown in Figure 11.2.


    The key components are as follows (Gudhe et al. 2023):


    +   - Input layer: Receives the pre-processed image data, typically a 3D tensor
    representing the image width, height, and color channels (e.g. RGB).


    +   - Convolutional layer: Applies filters (kernels) that slide across the input,
    extracting local features like edges, shapes, and textures.


    +   - Pooling layer: Downsampling the feature maps created by the convolutional
    layer reduces data size and processing expense while keeping critical information.
    Maximum and average pooling are two common pooling operations.


    +   - Activation layer: This introduces non-linearity to the network, allowing
    it to learn complex patterns. Popular activation functions include ReLU and sigmoid.


    +   - Fully connected layer: Flattens the output from the previous layers into
    a vector and performs traditional neural network operations for classification
    or regression tasks.


    # 11.3.2.4 Fully Convolutional Network (FCN)


    The FCNs are a type of CNN where all layers depend on convolutional function,
    which enables end-to-end segmentation. The end-to-end segmentation is a cluster
    of pixel-wise selection of images. The participating components of FCN are as
    follows:


    +   - Encoder: Similar to a general CNN encoder, extracting features.


    +   - Upsampling layers: Increase the feature map resolution to match the input
    image size.


    +   - Output layer: Produces a probability map for each pixel belonging to a specific
    class.


    # 11.3.2.5 SegNet


    SegNet is an encoder–decoder architecture similar to U-Net, but utilizes pooling
    indices for upsampling instead of DE convolutions. Table 11.1 contains a detailed
    description of CNN layers. The components of SegNet are as follows:


    +   - Encoder: Similar to U-Net''s encoder, extracting features.'
