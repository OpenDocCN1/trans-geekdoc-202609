  md: '# 8.3.2.3 cGAN


    GAN, as an unsupervised learning technique, derives the probability distribution
    patterns from unannotated datasets and expresses them in a gradual and unconstrained
    manner. Yet, when dealing with intricate or extensive datasets, GAN faces challenges
    in managing the outcomes it generates. To address this issue, a straightforward
    approach is to introduce constraints and establish specific objectives for the
    generator. GANs can be expanded into a conditional model when both the discriminator
    and the generator take extra information y into account. The objective function
    for conditional GANs (Mirza and Osindero 2014) can be compared to that of InfoGAN,
    as seen in Equations (8.5) and (8.6). However, in InfoGAN, the latent code c is
    not known in advance; it is actually discovered during training. Additionally,
    InfoGAN incorporates an extra network, Q, which outputs the conditional variables
    Q(c|x).


    ```

    min_G max_D = E_{x ~ P_{data}(x)}[log(x/y)] + E_{z ~ P_z(z)}[log(1 - D(G(z/y)))]
    (8.6)

    ```


    Building upon the foundation of CGANs, it becomes possible to generate examples
    conditioned on various factors such as class labels, text bounding boxes, and
    key points.


    # 8.3.2.4 ACGAN


    Auxiliary Classifier Generative Adversarial Network (ACGAN) (Odena et al. 2017)
    is an advanced CGAN specialized in image synthesis. By simply providing a class
    label, it can generate an image from scratch. Notably, ACGAN produces images with
    higher resolution compared to earlier methods. The ACGAN''s loss function is divided
    into two parts as given in Equations 8.7 and 8.8:


    ```

    L_G = E[log P(S = real | X_{real})] + E[log P(S = Fake | X_{fake})] (8.7)

    L_C = E[log P(C = c | X_{real})] + E[log P(C = c | X_{fake})] (8.8)

    ```


    In this context, L_G represents the log-likelihood for evaluating the source''s
    authenticity, while L_C corresponds to the log-likelihood for classifying the
    category or class. The training process involves the generator aiming to maximize
    the difference between L_C and L_G, while the discriminator is trained to maximize
    their sum, L_C + L_G.


    AC-GAN achieved a significant milestone as the first GAN variant capable of generating
    recognizable samples for all classes in the ImageNet dataset (Fei-Fei et al. 2010).


    # 8.3.2.5 WGAN


    In reference (Arjovsky et al. 2017), the authors introduced the Wasserstein distance,
    also known as the Earth-Mover (EM) distance, in the context of GANs for quantifying
    the dissimilarity between real and generated samples, as opposed'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'to using the JavaScript (JS) divergence. The Wasserstein distance is defined
    in Equation 8.9:


    ```

    W(p_r, p_g) = inf_{γ ~ Π(p_r, p_g)} E_{(x,y)~γ}[||x - y||] (8.9)

    ```


    where Π(p_r, p_g) represents the set of all possible joint distributions combining
    p_r and p_g, and γ encompasses all conceivable distributions.


    The Wasserstein distance offers several advantages. It can calculate distances
    between distributions even when they do not overlap, possesses excellent smoothing
    characteristics, and mitigates the issue of gradient vanishing to some extent.
    Furthermore, the Wasserstein GAN (WGAN) addresses training instability problems
    and enhances the diversity of generated samples, eliminating the need for intricate
    balancing in the training of the generator (G) and discriminator (D).


