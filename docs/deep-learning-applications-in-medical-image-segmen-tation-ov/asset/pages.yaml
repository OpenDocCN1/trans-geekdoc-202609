    # 8.5 Conclusion


    A review of the GAN-based image segmentation techniques is presented in this paper.
    We briefly present the principles of GAN and several extensions. Regarding the
    generative model G, its parameter updates differ from optimizing data likelihood;
    instead, they involve back propagating gradients from the discriminative model
    D. Additionally, GAN stands apart from traditional probabilistic generation models
    by circumventing the Markov chain learning mechanism. Moreover, GANs directly
    perform sampling and inference, enhancing their efficiency in application and
    broadening their practical use cases.


    We also provide a summary of GAN''s application, specifically in medical image
    segmentation. As a versatile design framework, GAN-based DL models have significantly
    contributed to enhancing the precision of medical image segmentation. The summary
    in this section highlights the primary improvements made in these models along
    two main avenues. First, there is a focus on augmenting or refining the loss function.
    Given GAN''s adaptability, a variety of loss functions can be integrated into
    the GAN model. Consequently, by tailoring diverse loss functions for specific
    tasks, the model''s performance can be notably enhanced. Second, there is an emphasis
    on integrating GAN with other neural networks (Yan et al. (2019); Yang et al.
    (2017); Yang et al. (2020); Yang et al. (2021)). GAN''s generation and discriminative
    models can be parameterized through any differentiable function. This unique learning
    approach enables GAN to more effectively extract'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'semantic segmentation features, thus elevating the segmentation network''s
    performance.


    While GAN''s advancements offer new prospects for medical image segmentation,
    practical implementation faces several limitations. First, research in GAN for
    medical image segmentation leans heavily toward technological aspects, employing
    evaluation metrics typical in computer science. Most studies assessed the model''s
    feasibility rather than its effectiveness in practical clinical settings, lacking
    evaluation against medical standards. Second, GAN, as a generative model, encounters
    issues like non-convergence, training complexity, mode collapse, and mode jump.
    When applying GAN''s trained outcomes to new applications, the model often requires
    transfer learning to sustain performance, diminishing the repeatability in clinical
    contexts. Furthermore, GAN''s interpretability is notably poor – it operates as
    a black-box mapping function, taking random variables as input and generating
    the desired data distribution as output. This lack of interpretability poses a
    significant hurdle to its practical adoption in the medical field. Hence, researchers
    must focus on overcoming GAN''s challenges related to instability, low repeatability,
    and lack of interpretability for its successful integration into medical applications.


    Furthermore, gaining acceptance from clinicians and patients regarding the data
    quality produced by GAN poses a challenge. As highlighted by Mazurowski et al.
    in Zhao et al. (2020), the clinical adoption of artificial intelligence in radiology
    remains a topic of debate. When implementing GAN in clinical settings, the primary
    concern revolves around the potential generation of erroneous information. During
    data generation, GAN might inadvertently create nonexistent disease information
    or overlook existing disease features as irrelevant. Consequently, cautious consideration
    is imperative for employing GAN in clinical practice. Similar to other applications,
    GAN-based implementations necessitate rigorous validation Zhou et al. (2016).
    In the short term, segmentation outcomes derived from GAN-based methods should
    undergo review by seasoned clinicians. Moreover, outcomes relying solely on GAN
    auto-segmentation ought to be limited to controlled experimental ranges. Furthermore,
    akin to other DL techniques, ethical and legal considerations come into play when
    employing GAN in clinical scenarios Zhu and Xie (2016). Despite GAN''s limitations,
    judicious and meticulous use holds the potential to introduce numerous novel possibilities
    for medical image segmentation.


    In summary, GAN holds vast potential in the realm of medical image processing.
    The diverse array of GAN-based methods and their iterations have garnered significant
    interest, notably advancing the application and evolution of DL algorithms in
    this field. Nevertheless, gaining acceptance for these methods among clinicians
    and patients remains a considerable hurdle. Additionally, GAN exhibits limitations,
    including instability, low repeatability, and interpretability challenges.'
