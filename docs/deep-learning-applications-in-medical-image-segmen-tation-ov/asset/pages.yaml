    loss and relieve discomfort (Wang et al. 2019). Therefore, early detection and
    precise diagnosis are crucial for the successful management and avoidance of irreversible
    visual impairment. Conventional approaches to diagnosing retinal problems are
    usually complicated, based on personal assessment, and susceptible to human fallibility.
    In order to overcome these constraints, there is a rising inclination toward investigating
    alternative sophisticated methods of image segmentation to enhance the early detection
    process. With the development of computer vision technology, scientists are investigating
    how to use fundus images and eye scans to identify different retinal illnesses
    using deep learning (DL). DL-based image segmentation has emerged as a viable
    approach to address these problems (Torre et al. 2020; Vij and Arora 2022). Artificial
    neural networks, which can be trained on enormous datasets, are used in DL to
    identify intricate patterns in images. Automating the segmentation procedure enables
    precise and efficient identification of retinal abnormalities (Mateen et al. 2020).
    This suggests that creating automated screening technologies might assist increase
    access to eye care. A common method involves training convolutional neural networks
    (CNNs) trained using extensive datasets of retinal images that have been manually
    rated and categorized by specialists. In order to differentiate scans that show
    no symptoms of diabetic retinopathy, age-related macular degeneration, glaucoma,
    or other disorders, the CNNs directly learn characteristics from pixel data (Alyoubi
    et al. 2020). Certain networks have proven to have accuracy levels similar to
    those of professional graders. DL has potential to identify individuals who require
    thorough eye exams by screening vast populations. It could assist in alleviating
    the global scarcity of resources for eye care by automating preliminary picture
    analysis (Sarki et al. 2020). Before the models can be used autonomously without
    human supervision, however, they still need to undergo thorough validation. To
    increase confidence in these algorithms'' decisions, future research will also
