  md: 'other pathological conditions. Chest radiography is crucial in diagnosing lung
    diseases and heart pathologies, including tuberculosis, pleural effusion atelectasis,
    consolidation, pneumothorax, and hypercardiac inflation. These images are widely
    available, cost-effective, and involve lower doses than alternative imaging methods,
    making them an effective method for widespread screening (Candemir et al. 2018).


    The initial tuberculosis screening system was introduced, leveraging transfer
    learning techniques and deep convolutional neural network (CNN) (Hwang et al.
    2016). Rajaraman and Antani (2020a) introduced a specialized ensemble learning
    approach to identify chest X-ray irregularities. The predictions of these models
    are consolidated through diverse ensemble techniques to minimize prediction variance.
    Class-selective mapping is employed to visually highlight affected regions in
    these images. Loey et al. (2020) introduced a generative adversarial network (GAN)
    with transfer training for the prediction of COVID-19 in chest X-rays. Due to
    the limited data on COVID-19 disease, the GAN network generates additional chest
    X-ray images. The introduction to the CovidGAN technique is dependent on the Auxiliary
    Classifier Generative Adversarial Network, which produces artificial chest X-ray
    images for the COVID-19 classification (Waheed et al. 2020). Rajaraman and Antani
    (2020b) implemented a labeled data augmentation technique to elaborate the dataset
    for training purposes, thereby improving the prediction of COVID-19 in chest X-ray
    images.


    # 10.2.2 Computerized Tomography


    Computed tomography (CT) images are diagnostic medical images generated through
    a technology called CT scanning, commonly known as CT scanning. CT scans constitute
    a form of medical imaging that employs X-rays to create comprehensive cross-sectional
    body images. This technique facilitates the creation of a three-dimensional perspective
    of internal structures, enabling a more comprehensive assessment compared to traditional
    X-ray imaging. The various features of CT images are high spatial resolution,
    contrast enhancement, multiplanar imaging, and dense and soft tissue differentiation.
    These images are highly used for diagnosis and staging, treatment planning, vascular
    imaging, etc.


    In 2016, researchers pioneered the introduction of a deep CNN designed to detect
    three nodule types: solid, semisolid, and ground-glass opacity (Li et al. 2016).
    Balagourouchetty et al. (2019) proposed a liver lesion classification ensemble
    FCNet classifier based on GoogLeNet. The fundamental GoogLeNet architecture underwent
    three modifications to enhance feature extraction. Masood et al. (2020) introduced
    the multidimensional region-based fully convolutional network for detecting and
    classifying lung nodules, achieving an'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'impressive accuracy of 97.91%. Their emphasis was particularly on the detection
    of micronodules (less than 3 mm) in lung nodule identification without compromising
    performance metrics. In 2019, Zhao and Zeng introduced a Deep Learning Architecture
    (DLA) based on supervised MSS U-Net and 3DU-Net for the automatic segmentation
    of kidneys and associated tumors (Zhao and Zeng 2019). Fan et al. (2020) and Li
    et al. (2019) applied DL methods to identify COVID-19 from CT images during COVID-19.


    # 10.2.3 Mammography (MG)


    MG, a specialized medical imaging technique, plays an important role in screening
    and diagnosing breast conditions, with a primary focus on breast cancer detection.
    This procedure utilizes X-rays to generate detailed images of the breast tissue.
    Mammograms are indispensable in the early prognosis of breast cancer and are recommended
    as part of routine screening protocols for women, usually commencing at a specific
    age or based on individual risk factors. The automated classification and early-stage
    detection of masses in mammography continue to be the areas of active research.
    Over the last decade, DLAs have made significant strides in overcoming challenges
    associated with breast cancer detection and classification.


    Fonseca et al. (2015) introduced a method for detecting breast composition using
    a CNN to extract features following the ACR standard. Some researchers suggested
    a CNN model with 12 layers for detecting breast arterial calcifications and assessing
    coronary artery disease (Wang et al. 2017). In another research, a computer-aided
    design (CAD) system employing faster R-CNN, which autonomously classifies lesions
    into benign and malignant in mammogram images, illustrated in Figure 10.3 (Ribli
    et al. 2018).


    A deep CNN trained on more than 1,000,000 mammogram data for the classification
    of breast cancer (Wu et al. 2019). Another deep CNN-based system has been developed
    for detecting AQ lesions, including calcified and soft tissue abnormalities, in
    digital breast tomosynthesis images (Conat et al. 2019). The proposed architecture
    of fuzzy completely connected layer architecture integrates fused fuzzy rules
    along with conventional CNN for semantic BI-RADS scoring (Kang et al. 2020). This
    framework demonstrated superior performance in BI-RADS scoring for both triple
    and multi-class classifications.


    # 10.2.4 Histopathology


    Histopathological images are high-resolution microscopic images capturing tissue
    specimens that undergo processing and staining for examination under a microscope.
    This imagery is integral to pathology, a medical specialty focused'
