    # 10.1.2 Problem


    The research problem involves the development of a computer-aided diagnosing system
    capable of accurately predicting heart diseases for individuals with diverse genetic
    backgrounds. To achieve this, a large amount of heart data from various people''s
    lifestyle and medical history is required. The existing machine learning models
    in this domain are typically trained with small data sets, often representing
    specific populations, such as Asian or European genetic profiles [8–13]. Consequently,
    these models tend to fail when predicting heart diseases for individuals with
    different genetic backgrounds, lifestyles, and medical histories.


    To address the limitations of existing heart disease prediction models, this research
    proposes a novel approach that combines of a Dynamic Learning Scheduling Algorithm
    (DLSA) and a Multilayer Perceptron (MLP) model. The primary objective is to develop
    an accurate and adaptable globalized heart disease prediction system capable of
    predicting heart diseases for individuals with diverse genetic backgrounds, lifestyles,
    and medical histories.


    One of the main challenges in developing this system is the ability to handle
    large heart data sets, which are essential for training a robust model. Existing
    machine learning models in this domain have typically been trained with small
    data sets that primarily represent specific populations, resulting in limited
    effectiveness when applied to individuals with different genetic backgrounds and
    lifestyle factors.


    To overcome this challenge, the proposed research utilizes the Dynamic Learning
    Scheduling Algorithm (DLSA), which mitigates the loss caused by incorporating
    massive training data. By implementing the DLSA, the research aims to optimize
    the process and enhance the performance of the heart disease prediction system
    when trained with large, diverse data sets.


    The MLP model is chosen as the primary model architecture for this research due
    to its ability to learn and generalize from large datasets [14, 15]. The MLP model
    is trained using intricate heart disease Electronic Health Record (EHR) data,
    which includes lifestyle and health information from individuals across Asia,
    Africa, and Europe. By utilizing a diverse dataset that captures variations in
    different regions, the proposed model aims to account for the nuances of demographics
    and lifestyles, ultimately improving the accuracy and reliability of the heart
    disease predictions.


    The research will conduct extensive experiments to evaluate the performance of
    the proposed model. The experiments will involve training the MLP model using
    the DLSA algorithm with the large, diverse dataset. The objective is to demonstrate
    that the developed model provides excellent prediction results for individuals
    from regions worldwide, each characterized by unique heart disease patterns.


    By leveraging a global dataset and considering the complexities of different generic
    backgrounds, lifestyles, and medical histories, the research aims to contribute
    to the development of an accurate and reliable globalized heart disease prediction
    system. Such a system has the potential to detect heart diseases early, facilitating
    timely interventions and potentially reducing the associated mortality rates.'
