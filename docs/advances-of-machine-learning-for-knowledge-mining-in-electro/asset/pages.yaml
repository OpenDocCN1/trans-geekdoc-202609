    1429222012(en) [3] as "information related to an individual''s health, including
    wellness, development, and wellbeing, which may be standalone or integrated from
    multiple sources, managed and controlled by the individual or their representative"


    Managing and storing a growing volume of healthcare data electronically is essential
    for digital transformation [4]. However, the complex and dynamic nature of large
    healthcare datasets poses challenges for storage, and interpretation. Approximately
    80% of EHR data is unstructured (for example, natural language notes, diagnostic
    imaging) [5], making it difficult to extract useful information. The vast amount
    of health data held in fragmented databases cannot'
