    +   1. **True Positives (TP)**: The number of times the model successfully predicted
    the presence of heart disease.

    2. **True Negatives (TN)**: The number of times the model correctly identified
    the absence of cardiac disease known as true negatives.

    3. **False Positives (FP)**: The percentage of times the model misdiagnosed the
    presence of cardiac disease.

    4. **False Negatives (FN)**: The proportion of times the model detected the absence
    of cardiac disease inaccurately.


    # 10.5.1.1 Accuracy


    Accuracy calculates the proportion of all predictions that are entirely correct,
    encompassing both positive and negative predictions. Mathematically, it is expressed
    as:


    ```

    $Accuracy = \frac{(TP+TN)}{(TP+TN+FP)}$

    ```


    # 10.5.1.2 Precision


    Also known as positive predictive value, precision is the proportion of true positive
    predictions out of all positive predictions. It provides insight into the reliability
    of a positive prediction from the model.


    ```

    $Precision = \frac{TP}{(TP+FP)}$

    ```


    # 10.5.1.3 Recall or Sensitivity


    Recall quantifies the model''s capability to detect and correctly classify positive
    instances.


    ```

    $Recall = \frac{TP}{(TP+FN)}$

    ```


    # 10.5.1.4 F1-Score


    The F1-Score is a composite metric that combines both precision and recall into
    a single number. It provides a balance between them and is particularly useful
    in the presence of imbalanced classes.


    ```

    $F1-Score = 2 * \frac{(Precision * Recall)}{(Precision + Recall)}$

    ```


