    # 11.7 CONCLUSION


    Machine learning is the fastest-approaching methodology used at the present time
    to predict the risk of heart failure by the available heart disease data set.
    This data set is free from noise and outlier values and exploratory data analysis
    is not required for this data set. The problem can be applied in a health center
