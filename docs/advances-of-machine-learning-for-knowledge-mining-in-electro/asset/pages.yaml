    # 8.4 MACHINE LEARNING METHODS


    The most common machine learning approaches used in the research were categorized
    as supervised, semi-supervised, weakly-supervised, unsupervised, or foundational
    learning. During our review of the relevant literature, we found that both deep
    learning and related methods were represented in the publications. Most deep learning
    techniques employed supervision, and only one study examined the use of foundational
    learning alongside a deep learning strategy [44]. As a result, we highlight the
    advantages of (i) traditional supervised learning, (ii) deep supervised learning,
    (iii) semi-supervised learning, (iv) weakly-supervised learning, (v) unsupervised
    learning, and (vi) foundational learning in our analysis.'
