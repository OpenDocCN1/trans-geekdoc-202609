    # 11.1 INTRODUCTION


    Heart disease is one of the most prevalent diseases and the primary cause of death
    on a global scale. Heart-related diseases account for approximately 32.5% of all
    deaths worldwide or approximately 17.8 million lives. Frequently, heart disease
    is diagnosed based on the patient''s physical examination, symptoms, and signs
    [2]. Several factors influence the risk of heart disease, including tobacco use,
    cholesterol level, blood pressure, age factor, daily palpitations, body mass index,
    obesity or excess weight, alcohol consumption, family history of the disease,
    high blood pressure, and physical inactivity. Based on medical considerations,
    a greater number of parameters are taken into account. To prevent complications
    in human life and increase the likelihood of adopting a healthy lifestyle, heart
    disease must be detected early. We can predict the likelihood of future cardiac
    disease in a given patient using machine learning classification algorithms by
    analyzing patient data with multiple features [3][4]. The primary purpose of this
    paper is to describe the various learning models used to predict cardiac disease.
    This study compares four classification models and evaluates them with the highest
    ranking using the input data. The IBM cloud environment is utilized for the implementation
    of the machine learning model with the Automatic Artificial Intelligence Watson
    tool, and the comprehensive work describes the correlation between Auto AI and
    the cloud platform.


    # 11.2 MACHINE LEARNING


    Machine learning refers to the techniques involved in coping with massive amounts
    of data in the most intelligent way possible (via the development of algorithms)
    to extract actionable insights [15]. Data is ubiquitous. Information is used for
    analysis or decision-making, such as facts and quantities. Computer data is information
    in a format that a computer can process. Algorithms for machine learning are used
    to intelligently process data to gain a deeper understanding.


