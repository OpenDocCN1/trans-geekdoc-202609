    out of range, this is must. There are different standardization methods in machine
    learning. Standardization scaling and min-max scaling are two common normalization
    methods. The feature value is normalized in the min-max scaling method by shifting
    and rescaling so that their range is between zero and one. The method of calculation
    is outlined in Equation 3.6.


    ```

    Xn=(X-Xmin)/(Xmax-Xmin)

    ```


    where Xn is the normalization value, Xmax is a feature''s highest value, and Xmin
    is a feature''s lowest value. Normalization will have a value of zero if X is
    at its maximum. On the other hand, normalization values will be between zero and
    one if the value of X is neither maximum nor minimum. Normalization is a transformation
    method that helps the model perform better and be more accurate. The standardization
    method is helpful when the feature distribution is deif or is not known precisely.
    To put it another way when the feature distribution of data does not follow a
    Gaussian pattern.


    Standardization scaling, otherwise called Z-score, is a strategy wherein values
    are based on the mean and have a unit standard deviation. It is calculated mathematically
    by dividing the feature value by the standard deviation and subtracting it from
    the mean. Equation 3.7 provides a means of expressing standardization.


    ```

    X''=X-μ/σ

    ```


    The symbol μ is the mean and σ is the standard deviation of the feature values.
    The standardization technique does not limit feature values to a specific range,
    unlike the Min-Max scaling method. KNN, K-means clustering, principal component
    analysis, and other distance-based machine learning algorithms can benefit from
    this strategy. It is utilized when the data are normally distributed and the model
    is based on assumptions. When the feature distribution of the data is precisely
    known or it follows a Gaussian distribution, standardization in the machine learning
    model is helpful. In contrast to normalization, standardization does not have
    a bounding range. As a result, the standardization method will not affect even
    the data''s outliers. In addition, it is useful when employing linear discriminant
    analysis, logistic regression, and linear regression on variable data


