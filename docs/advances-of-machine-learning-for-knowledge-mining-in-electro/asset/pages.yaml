    all included in the metadata connected to patient encounters.


    Clinical Document Metadata: Progress notes, discharge summaries, and lab reports
    are examples of clinical documents included in an EHR that contain metadata that
    characterizes the actual document. Document type, author, creation date, revision
    history, and timestamps are examples of this information.


