    or the output layer, presents the model''s prediction.


    To reduce the discrepancy between the network''s predictions and the actual, an
    MLP must be trained by modifying its weights and biases. This is often accomplished
    by back propagation, an algorithm that determines the gradient of the loss function
    in relation to the network''s variables, and an optimization technique such as
    Stochastic Gradient Descent (SGD). The activation function used in the MLP can
    vary by the layer and task requirements. Common choices include the Rectified
    Linear Unit (ReLU) and the Sigmoid function. For binary classification tasks like
    heart disease prediction, a sigmoid function in the output layer is often used:


    ```

    $$\sigma(x) = \frac{1}{1 + e^{-x}}$ (10.15)

    ```


    The bias in a neural network plays an important role in shifting the activation
    function towards the positive or negative spectrum. It operates in conjunction
    with the weighted inputs and influences the final decision of the neuron.'
