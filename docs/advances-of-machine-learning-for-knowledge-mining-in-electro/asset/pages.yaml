    # 10.5.3 TRAINING EFFICIENCY ANALYSIS


    The performance and accuracy of machine models are influenced by their training
    methods. Evaluating the model''s effectiveness involves assessing the error rate
    during training. A lower error rate indicates a more accurate model, as it reflects
    a smaller discrepancy between predicted and actual outcomes.


    Efficient computational training algorithms are also crucial. Models that can
    process large datasets with fewer iterations are highly advantageous, particularly
    in real-world applications where speed, efficiency, and scalability are paramount.


    This research focuses on analyzing the error rate and computational efficiency
    of the proposed DLSA for heart disease prediction. A comparison is made with the
    widely used back propagation algorithm. By examining these metrics, insights into
    the performance of the DLSA algorithm can be gained. This chapter uses the three
    primary metrics to evaluate its efficacy and accuracy.


    # 10.5.3.1 Mean Absolute Error (MAE)


    This metric reflects the average magnitude of errors in a set of predictions,
    without considering their direction. A smaller MAE value is desirable as it indicates
    a lesser average difference between our model''s predictions and the actual outcomes,
    underlining a superior model. MAE is calculated using the following equation.


    ```

    MAE = \frac{1}{N} \sum |A_i - P_i|

    ```


    (10.22)'
