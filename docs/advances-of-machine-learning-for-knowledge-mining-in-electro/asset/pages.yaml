    contain an input of data sets, a set of nodes [x1, x2, x3, ..., xn]/having weights
    [w1,w2,w3, ..., wn] adjusted to various biases passing through a system containing
    a non-linear activation function to an activation function and a loss function
    that determines the output. This basic model can be trained by suitably adjusting
    the weights and biases as per the requirement to optimize the output based on
    need.


    A regular neural network consists of three distinct layers.


