    # 10.5.4 DISCUSSION


    Heart disease is a leading cause of death worldwide, affecting people of all backgrounds.
    However, existing heart disease prediction systems predominantly focus on specific
    regions or ethnic groups. This approach overlooks the significant variations in
    genetic predispositions, lifestyles, and risk factors among different populations.
    Therefore, there is an urgent need to develop a globalized heart disease prediction
    system that can provide accurate predictions for individuals from diverse backgrounds.


    Developing a globalized heart disease prediction system poses severe challenges.
    Firstly, the lack of representative datasets from different populations hinders
    the development of accurate prediction models. Secondly, existing algorithms,
    such as back propagation, suffer from slow convergence and high computational
    costs when dealing with large and diverse datasets. These limitations call for
    the development of innovative algorithms that overcome these challenges and achieve
    efficient and accurate predictions.


    To address the challenges mentioned above, this research proposes the DLSA as
    an effective algorithm for global heart disease prediction. The DLSA optimizes
    the training process by dynamically adjusting the learning rate during training,
    leading to improved efficiency and convergence speed. The algorithm incorporates
    genetic information to adapt update the learning rate. By combining the DLSA with
    the powerful MLP model, the proposed method aims to capture intricate patterns
    and relationships in heart disease data from diverse populations.


    To achieve heart disease prediction, research utilizes three distinct datasets
    representing different genetic backgrounds and regions. The Replication Data for
    South African Heart Disease Study provides insights into the African genetic background.
    The Cardiovascular Disease Dataset-Mendeley represents the Indian genetic predisposition.
    The Cardiovascular Disease Dataset encompasses data from diverse locations, including
    the United States, the United Kingdom, Switzerland, and Hungary, thereby representing
    the European genetic pool. By incorporating data from these populations, the research
    aims to account for the variations in heart disease patterns observed.


    The proposed DLSA-MLP model was rigorously evaluated and compared with existing
    prediction methods and conventional neural network models. The performance metrics,
    including accuracy, precision, recall, and F1-measure, were utilized to assess
    effectiveness of the models. The results showed the superior performance of the
    proposed method across all three heart disease datasets. The DLSA-MLP model consistently
    outperformed existing methods, achieving higher accuracy, precision, recall, and
    F1-measure values.'
