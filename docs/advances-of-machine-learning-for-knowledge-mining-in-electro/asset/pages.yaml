    # 2.4 INFORMATION EXTRACTION FROM STRUCTURED DATA


    The process of extracting pertinent and usable information from a structured data
    source, such as a database or spreadsheet, is known as information extraction
    from structured data. Although this procedure can be carried out manually, software
    tools and techniques are frequently used to automate it.

    Typical methods for extracting information from structured data include:


    +   * Data parsing.

    * Mining text.

    * Aggregation of data.

    * Filtering data.

    * Data understanding.

    * Analysis or use.

    * Data transformation.

    * Cleaning and validation.


    **Data parsing:** This can be used to extract the name of a customer, residential
    address, contact number, and email address from a database that contains that
    customer''s information.


    **Mining Text:** This is the process of extracting information from unstructured
    data inside a structured data source using Natural Language Processing (NLP) techniques.
    This mining can be used, for instance, to extract common themes and sentiments
    from a collection of consumer comments.


    **Aggregation of Data:** This is the process of merging various data sources into
    a single data source. Data aggregation can be used, for instance, to integrate
    data from various spreadsheets that include consumer information into a single
    database.


    **Filtering Data:** This is the process of choosing particular data points based
    on predetermined standards. Data filtering can be used, for instance, to choose
    sales data for a certain time period or sales data for a certain product from
    a database holding sales data.'
