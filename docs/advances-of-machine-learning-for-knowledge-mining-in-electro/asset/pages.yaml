    When the weighted sum of the inputs is computed at a neuron, it takes the form:


    ```

    $z = \sum(w_i^o x_i) + b \quad (10.16)$

    ```


    where $w_i$ are weights, $x_i$ are the input values, and $b$ is the bias.


    The bias effectively controls how or low the input must be for the neuron to be
    activated. Without the bias, the neuron''s output would simply be a function of
    the input, (namely, zero). This could limit the flexibility of the model. By including
    the bias, we allow the activation function to shift left or right, enabling a
    better fit to the data.

    The bias, like the weights, is updated during the training process using the back
    propagation algorithm. It is adjusted to minimize the loss function, much like
    the weights:


    ```

    $b=b-\eta\nabla L(b) \quad (10.17)$

    ```


    where $b$ represents the bias, $\eta$ is the learning rate, and $\nabla L(b)$
    is the gradient of the loss function with respect to the bias.


    # 10.4.5 TRAINING THE MLP USING PRO DLSA


    In the proposed research, the training of the MLP is conducted using a novel DLSA.
    This method dynamically adjusts the learning rate through the training process
    to optimize the learning efficiency and model performance. The training procedure
    is detailed as follows.

    Firstly, the weights and biases of the network are randomly initialized. An initial
    learning rate ($\eta$) is set, forming the basis for the dynamic learning rate
    adaptation.

    For epoch of training, the algorithm performs several steps on each sample in
    the training data:


    +   - Forward propagation is carried out, wherein the input data is processed
    through the network layers to generate an output. This is performed in line with
    the activation function equations, denoted by 10.1 and 10.2 in the algorithm.

    - The output of the network is compared with the target output, and an error is
    computed using a suitable error function (10.3 or 10.4).

    - This error is not backpropagated through the network. During back propagation,
    the error gradient is calculated according to the specified equations (10.5 and
    10.6).

    - Using this gradient, the weights and biases of the network are updated as per
    equations 10.7 and 10.8. The learning rate at this stage is governed by the current
    value of $\eta$.


    Every ''$s$'' epochs, the learning rate is decayed according to a decay factor
    ''d'', as specified in equation 10.9. This decay mechanism allows the model to
    make large updates at the beginning of the training process when the parameters
    are far from'
