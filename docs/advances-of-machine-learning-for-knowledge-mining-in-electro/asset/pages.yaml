    # 6.2.4 PEARSON CHI-SQUARE TEST AND KERNEL LEAST SQUARE SUPPORT VECTOR TECHNIQUE


    The Pearson Chi-Based Kernel Least Square Support Vector Classifier (PCS-KLSSVC)
    technique is introduced for improving the health data classification accuracy
    and minimizing the space complexity and classification time. Initially, the Pearson
    Chi-squared Hypothesis Test (PCHT) in the proposed technique enhances the performance
    of feature extraction from a database.


    At first, a Pearson chi-square score value is measured for each feature. After
    that, the measured score value is compared with a threshold value. If the score
    value is higher than the threshold value, then the two features are dependent.
    From the two features obtained, one feature is chosen for classification and another
    feature is removed. As the two features are independent, then the two features
    are taken for'
