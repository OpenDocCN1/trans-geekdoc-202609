- pgno: 144
  md: '# Advances of Machine Learning for Knowledge Mining


    In healthcare, AI aids in developing treatments, enhancing diagnosis accuracy,
    and streamlining administrative tasks. In finance, it detects fraud, optimizes
    investment strategies, and improves customer service. Transportation leverages
    AI for autonomous vehicle development and traffic management. In entertainment,
    AI personalizes recommendations and supports content creation.


    While AI has the potential to reshape society, it also raises ethical and societal
    challenges. For example, using AI in decision-making prompts concerns about accountability
    and transparency. Additionally, AI''s impact on employment, along with risks of
    reinforcing biases and discrimination, requires careful consideration.


    # 7.3 MACHINE LEARNING


    Creating models and algorithms that can learn from data without the need for explicit
    programming is known as machine learning. Large datasets are analyzed by these
    algorithms to find trends and connections that can be utilized to inform decisions
    and forecasts. Supervised learning, unsupervised learning, and reinforcement learning
    are the three primary categories of machine learning.


    Supervised learning trains a model on a labeled dataset, where each data point
    has an associated label or outcome. The model learns to make predictions or decisions
    based on input data, with the goal of minimizing the difference between its predictions
    and the actual labels in the training data.


    Unsupervised learning trains on an unlabeled dataset, where there are no known
    outcomes. Here, the model identifies patterns and relationships within the data
    independently, uncovering hidden structures or insights without explicit guidance.


    Reinforcement learning teaches a model to make decisions in an environment where
    it receives feedback in the form of rewards or penalties based on its actions.
    The model learns to take actions that maximize its cumulative reward over time.


    Machine learning has numerous applications across various fields, healthcare,
    finance, transportation, and entertainment. In healthcare, machine learning can
    develop predictive models for disease diagnosis and treatment. In finance, it
    can be applied to detect fraud and optimize investment portfolios. In transportation,
    machine learning is instrumental in developing autonomous vehicles and managing
    traffic flow. In entertainment, it supports personalized recommendations and content
    creation.


    # 7.4 SUPERVISED LEARNING ALGORITHMS


    Supervised learning trains a model using labeled data, where each label represents
    an annotated target or outcome that the model is designed to predict. The main
    goal in supervised learning is to develop a mapping between inputs and their corresponding
    outputs, enabling the model to predict outcomes accurately for new, unseen inputs.
    Supervised learning includes various algorithms, such as:


    **Regression:** To predict continuous output variables like housing prices or
    temperature over time. Common regression algorithms include linear regression
    and logistic regression.'
