    results. They ensure consistency and facilitate interoperability when exchanging
    data between different systems.


    **Controlled Vocabulary:** Semi-structured data often employs controlled vocabularies
    or standardized coding systems to enhance data consistency and facilitate data
    exchange. This can include medical terminologies like SNOMED'
