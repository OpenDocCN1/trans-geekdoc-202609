    # 9.1 INTRODUCTION


    Large volumes of data on a patient''s medical history, including symptoms, test
    results, examination findings, and procedures, are contained in electronic health
    records, or EHRs. Eleven years of interest in patient data analytics from Electronic
    Health Records (EHRs) have been observed in recent years. Data-driven healthcare
    is one of the most promising paths toward healthcare transformation. It aims to
    deliver the best and most customized treatment by efficiently leveraging large
    medical data, which is the collective knowledge gained by treating hundreds of
    millions of patients. The EHR is one of the essential elements required to carry
    out this data-driven healthcare revolution. There are some problems with working
    directly with EHR, including as unfairness, noise, inequality, and temporality.


    It is difficult to accurately extract comprehensive information on disease and
    drug-response phenotypes that are coded in electronic health. EHR-based research
    has shown promise for broad-based phenomenon-wide association studies, made new
    discoveries for diseases and medication response features, quickly supplied cases
    and controls to manage meta-analyses, and successfully established connections.
    Therefore, phenol type or relevant feature extraction from patient EHRs is a crucial
    initial step before any further applications.


    # 9.2 METHODS


    More than 80,000 patients from different hospitals were used in this instance.
    Health data that coded analyses, clinical measurements, and prescriptions for
