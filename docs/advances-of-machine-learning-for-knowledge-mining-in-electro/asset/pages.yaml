    # 2.10 INFORMATION EXTRACTION FROM SEMI ORGANIZED DATA


    The process of locating and extracting pertinent structured information from the
    adaptable and imperfectly structured parts inside a document or dataset is known
    as information extraction from semi-organised data. The main steps in extracting
    information from semi-structured data are given below:


    **Data Preparation:** The semi-organised data has to be pre-processed in order
    to be ready for extraction. This could entail standardizing document layouts,
    reducing superfluous formatting, and transforming the data into a form that is
    acceptable for analysis.


    **Text Analysis:** Natural Language Processing (NLP) methods are used in this
    step to parse the text and find the pertinent data pieces. To analyze the text''s
    linguistic structure, methods like tokenization, sentence segmentation, and part-of-speech
    tagging may be used.


    **Identification of Named Entities:** Named Entity Recognition (NER) is where
    specific entities or names are found in the semi-structured data and extracted
    using NER. This can contain things like people, places, dates, and medical phrases
    as well as actions like operations and prescriptions. To locate and categorize
    these things inside the text, NER systems use pattern recognition, machine learning,
    or rule-based techniques.


    **Extraction of Relationships:** After the entities have been identified, relationships
    and associations between the extracted entities are found using relationship extraction
    techniques. This aids in establishing the dependencies and interactions within
    the data, such as determining the connection between a drug and a particular illness.


    **Mapping or Ontology:** Mapping the extracted items onto standardized terminologies
    or ontologies is frequently done in order to improve the standardization and interoperability
    of the retrieved information. This process guarantees'
