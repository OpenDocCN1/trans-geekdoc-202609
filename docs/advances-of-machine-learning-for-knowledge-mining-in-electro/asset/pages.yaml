  md: '# 8.2 AN OVERVIEW OF THE DEVELOPMENT OF ELECTRONIC HEALTH RECORDS


    The widespread adoption of Electronic Health Records (EHRs) has led to the accumulation
    of more medical data than ever before. An average patient generates approximately
    80 gigabytes of medical data each year, and this number is expected to continue
    growing in the future [15].


    One of the main arguments for implementing digital health records was the belief
    that these systems could more efficiently collect and analyse data, providing
    valuable insights to aid in decision-making. However, the process of adopting
    EHRs has been challenging, with many studies citing it as a cause of physician
    burnout and early retirement, despite the good intentions of all parties and substantial
    funding [15–18].


    Recent advances in Artificial Intelligence (AI), particularly in machine learning
    and natural language processing, are showing great potential to address some of
    the significant issues associated with EHRs, helping to reduce the administrative
    burden on clinicians [19, 20].


    Before exploring how AI is being used to gain insights from patient data and reduce
    the administrative load on clinicians, it is helpful to briefly review Electronic
    Health Records (EHRs) and the foundational concepts behind their implementation.


    Prior to the development of the first medical records system by Lockheed in the
    mid-1960s, all medical records were paper-based and stored in manually organized
    filing systems. Despite the expected benefits, EHR adoption rates were initially
    low; a study showed that only 9% of U.S. hospitals had implemented a basic EHR
    system by 2008. This changed in 2009 when Congress passed the Health Information
    Technology for Economic and Clinical Health Act (HITECH), which offered financial
    incentives to encourage medical practices and hospitals to transition from paper
    to digital records.


    It was clear how beneficial EHR adoption could be. Clinicians no longer needed
    to waste time searching for handwritten notes, as they could access patient information
    electronically from a centralized system [20]. This saved time and enabled effective
    data analysis.


    Despite an estimated $3 billion in government grants to encourage EHR adoption,
    the systems have not been widely accepted. Many used EHRs are built on outdated
    architectures, making them difficult to navigate. A recent study from Stanford
    found that the majority of respondents felt EHRs contributed to physician burnout,
    with 59% of respondents believing that a substantial redesign was needed. Many
    users were dissatisfied with their systems, reporting that they required excessive
    clicks, which frequently crashed, and were challenging to use [21, 22, 23].


    In addition to negatively impacting the quality of care provided to patients,
    physician burnout is estimated to cost the healthcare industry up to $6.3 billion
    annually. Below are some ways in which artificial intelligence is being applied
    to EHRs to alleviate this burden.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Artificial Intelligence and Machine Learning Techniques


    # 8.2.1 Voice Assistants Driven by AI Technology


    One of the most concerning statistics regarding the adoption of Electronic Health
    Record (EHR) systems is that physicians spend an average of six hours per day
    on data entry [22]. This takes away time that could be spent with patients and
    contributes to a burnout rate twice as high as that of the general population.


    Recent advances in Artificial Intelligence (AI), specifically in Natural Language
    Processing (NLP), have led to the development of medical transcription systems
    aimed at addressing this issue [23]. A notable example is Suki, an AI-powered
    voice assistant designed to reduce the administrative workload of clinicians.
    Often referred to as "Alexa for Doctors", Suki allows clinicians to take notes
    during patient exams [24]. These notes are then automatically processed and uploaded
    directly to the EHR in real time. Additionally, the system can respond to voice
    commands, enabling doctors to access information with simple voice queries and
    gain insights at the point of care.


    According to Suki, the digital assistant has reduced the time it takes an average
    doctor to create a note by 76%, from more than 13 minutes to just 3 minutes across
    its user base [28].


    Another company addressing the challenge of time-consuming data entry is Robin
    Healthcare. This company has developed a device that can be set up in the exam
    room, allowing physicians to focus entirely on patient care rather than documentation
    [25–27]. Instead of requiring direct interaction to create voice notes, Robin
    records all audio in the room and uses NLP to filter out non-essential conversation,
    retaining only the relevant medical language [29]. This enables physicians to
    maintain a natural conversation with the patient.


    The successes achieved by solutions like Robin and Suki are not unique. A trial
    at Concord Hospital in Kansas City, the implementation of Nuance’s Dragon One
    speech recognition system reduced the time spent on note-taking by 65% [30]. Such
    significant reductions in the time spent on medical documentation help alleviate
    a considerable portion of the burden placed on healthcare professionals by manual
    data entry, freeing them to exert their expertise more effectively [30, 31].


    # 8.2.2 Support for Clinical Decision Making and Analytical Predictions


    The capacity of Electronic Health Records (EHRs) to facilitate clinical decisionmaking
    and providing critical insights through big data was a primary driver behind their
    widespread adoption. Significant progress has been made in this area, substantial
    work remains to unlock the full potential of patient data. Only 8% of clinicians
    view the main benefit of EHRs as therapeutically significant; most respondents
    in a recent study consider EHRs primarily as information storage tools [32].


    A renewed interest in computerized Clinical Decision Support Systems (CDSS) and
    predictive analytics models have emerged due to advancements in machine learning
    [33]. These systems are designed to support clinicians with complex decision-making'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Advances of Machine Learning for Knowledge Mining


    A recent example of this is Google’s DeepMind, which was applied to EHRs to identify
    patients at high risk of Acute Kidney Injury (AKI), a condition with an in-hospital
    mortality rate exceeding 45%. Research indicates that early recognition of AKI
    is crucial, as timely intervention can benefit up to 30% of cases. AKI is notoriously
    challenging to diagnose [34].


    In collaboration with the U.S. Department of Veterans Affairs (VA), DeepMind utilized
    artificial intelligence on a comprehensive EHR dataset to address this challenge.
    The AI could predict AKI up to 4 hours before traditional clinical methods, achieving
    an accuracy of 90% [35]. This provided healthcare professionals with the critical
    lead time to administer potentially life-saving treatments like dialysis.


    A 2016 study using NLP methods to identify patients at risk for Kawasaki disease,
    a form of vasculitis where early diagnosis is essential for effective treatment,
    achieved similar success. The NLP-based algorithm demonstrated a sensitivity of
    93.6% in identifying individuals at potential risk, outperforming more conventional,
    time-intensive methods.


    Intelligent CDSS systems are increasingly employed to evaluate physician notes
    in real-time, offering evidence-based treatment recommendations at the point of
    care. This is in addition to leveraging EHR data to identify patients at high
    risk for specific conditions.


    Many practitioners initially viewed CDSS as tools, disrupting the natural flow
    of patient care due to poor integration with EHRs and treatment guidelines based
    on general rules. AI-powered tools like Google Health and Micromedex aim to change
    this perception [36].


    Micromedex, seamlessly integrates with hospital EHR systems to provide individualized
    treatment pathways based on a patient’s record. These pathways support physicians
    by referencing possible diagnoses, treatment therapies, and risk factors [37].
    Rachel Cordrey, Director of Inpatient Pharmacy at TidalHealth Peninsula Regional,
    remarked on the tool’s impact: “Using this tool, clinicians can use natural language
    to ask their questions and receive rapid responses on any medication information
    from a trusted, evidence-based database [38]. Integrating an AI platform into
    our EHR system has led to marked improvements in patient care”.


    The goal of AI-powered tools like Micromedex and Google Health is not to replace
    clinicians but to augment their expertise and provide evidence-based treatment
    recommendations, empowering them to make informed clinical decisions.


    # 8.2.3 MATCHING PATIENTS TO CLINICAL TRIALS


    The integration of AI with Electronic Health Records (EHRs) is making a broader
    impact on drug discovery, extending beyond merely providing insights for treatment
    [32–35]. A significant bottleneck in drug development is the selection and recruitment
    of suitable candidates, which contributes considerably to the median cost of a
    clinical trial in the United States, estimated at over $48 million. In a previous
    article, we detailed how the development of a new cancer treatment was delayed
    because the recruitment process alone took years, preventing patients from accessing
    potentially life-saving therapies [38].'
