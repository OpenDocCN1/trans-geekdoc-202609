  md: '# Advances of Machine Learning for Knowledge Mining


    Cloud-based EHR (Electronic Health Records) and locally hosted EHR are two different
    deployment models for healthcare record systems, each with its advantages and
    considerations. Let''s explore the characteristics of each:


    +   1. **Cloud-based EHR:**

    Definition: Cloud-based Electronic Health Record (EHR) systems are accessible
    via web browsers or mobile applications, and they are housed on distant servers.
    Third-party cloud service providers manage the security of data centers where
    the data is kept.

    2. **Locally Hosted EHR:**

    Definition: Locally hosted EHR systems are installed and maintained on the healthcare
    organization''s own servers or data centers. Users access the system within the
    organization''s network.


    # 1.4.1 CLOUD-BASED EHRs


    Platforms for cloud computing offer scalable, on-demand access to IT services.
    Rapid deployment and EHR system launches are made possible by the cloud, which
    also reduces costs and effort. But it''s crucial to fully comprehend the advantages
    and difficulties of using a cloud-based EHR. Common advantages include lower hardware
    and software expenses, lower continuing costs, the option to start small and scale
    up resources as needed, higher levels of IT service availability compared to in-house
    IT services, and a decrease in run-time failures.


    # Advantages:


    **Accessibility:** Healthcare professionals access patient information from any
    internet-connected place, allowing for flexibility and remote work capabilities.

    **Scalability:** Cloud-based systems can easily scale up or down based on the
    organization''s needs, without major infrastructure changes.

    **Automatic Updates:** The cloud provider is responsible for system updates, maintenance,
    and security patches, reducing the burden on the healthcare organization.

    **Data Backup and Recovery:** Strong backup and disaster recovery procedures are
    often implemented by cloud providers to guarantee that data is safeguarded in
    the event of unexpected occurrences.


    # Considerations:


    **Data Security:** As patient data is stored on third-party servers, concerns
    about data security and privacy arise. It''s crucial to select a reputable and
    compliant cloud provider that adheres to healthcare regulations.

    **Internet Dependency:** The system''s availability depends on internet connectivity,
    so any internet outage can disrupt access to patient data.

    **Cost:** While cloud-based EHR systems can save upfront infrastructure costs,
    ongoing subscription fees may add up over time.'
