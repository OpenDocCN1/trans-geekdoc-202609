    # 10.4.3 FEATURE SELECTION USING CORRELATION ANALYSIS


    Feature selection is an integral step in the development of robust and efficient
    machine learning models. By eliminating irrelevant or redundant features, we can
    enhance model interpretability, improve prediction performance, and reduce overfitting.
    In the context of the cardiovascular disease datasets employed in this study,
    we propose a feature selection module rooted in correlation analysis, as detailed
    below.


    Correlation analysis quantifies the degree to which pairs of variables in the
    dataset are related. Here we use the Pearson Correlation Coefficient (PCC), which
    measures the linear association between numerical variables. The value of the
    PCC lies between negative and one, where negative indicates a perfect linear correlation,
    one indicates a perfect positive linear correlation, and zero signifies no linear
    correlation. The PCC is calculated as follows:


    ```

    $PCC(X,Y) = \frac{cov(X,Y)}{\sigma_X * \sigma_Y} \quad (10.14)$

    ```


    Here, $cov(X,Y)$ is the covariance between features $X$ and $Y$, and $\sigma_X$
    and $\sigma_Y$ are the standard deviations of $X$ and $Y$, respectively. A high
    absolute value of the PCC (either positive or negative) signifies a strong linear
    relationship between the two variables. Features that show a high correlation
    with the target variable can be considered for model training, while those that
    exhibit high intercorrelation (collinearity) can lead to redundancy and should
    be addressed appropriately. By calculating all variable pairs, a correlation matrix
    may be generated. This matrix serves as a visualization tool, allowing for the
    easy identification of highly correlated feature pairs. A heatmap can further
    illustrate this, offering a color-coded representation of the correlation values.


    Figures 10.2, 10.3, and 10.4 represent the correlation matrices of the three heart
    disease datasets. These matrices display the correlation values between the variables
    and target class in each dataset, including their correlation with the target
    class. In this research, a correlation threshold of 0.35 has been set. This means
    that variables with a correlation value greater than 0.35 are considered to have
    a significant relationship with the target class. meaning that as the variable
    increases, the likelihood of the target class also increases.'
