    literature [14] [base paper], there are mainly four types of firewalls: packet
    filtering firewalls, application-layer gateways, status inspection firewalls and
    Network Address Translators (NAT).


    The movement of data entering and leaving a network is controlled by a packet
    filtering firewall, a part of the network security system. Each packet, which
    contains user data and control information, is examined by the firewall, and runs
    it through a set of pre-defined rules. If the packet successfully matches the
    rule, the firewall allows it to pass to its intended location. The packets that
    do not match are rejected. By looking at different sets of rules, protocols, ports,
    and addresses, firewalls test based on level of security to provide any of the
    static, dynamic and stateless packet filteringwalls can be used. Compared to firewalls
    that only filter packets, status inspection firewalls are more secure. This process
    application layer data while packet filtering firewalls are able to investigate
    the transaction thoroughly to see what is happening. These firewalls provide more
    benefits, they consume more time and are costly than static packet firewalls [2].
    Another type of firewall is the application layer gateway. It provides one of
    the solutions for protecting apps and the data they contain to enable secure application
    delivery. It acts as a shield that checks the IP web page for any risks before
    forwarding the page to the end user. External network connections are able to
    gain access through the gateway in this form of firewall to avoid infiltration
    from outside of a company''s intranet. This firewall is more secure as intruders
    find it very difficult to gain direct access to the system to retrieve protected
    health information. The negative of this firewall is its complexity and high cost.
    The last type of firewall is the network address translator that maps private
    addresses within a local network to a single public IP address before sending
    the data to the Internet. It hides an organization''s intranet addresses from
