    properties. Following are some typical categories of metadata found in EHRs:


    Patient Metadata: This contains information that is individual to a patient, such
    as contact details, demographics (name, age, gender, and address), and special
    identifiers (medical record number, health insurance number).


    Encounter Metadata: Information regarding the hospital or healthcare facility
    involved, the type of encounter (such as an inpatient visit or a hospital admission),
