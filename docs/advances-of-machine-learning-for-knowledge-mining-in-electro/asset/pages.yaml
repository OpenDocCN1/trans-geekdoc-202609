  md: '# Advances of Machine Learning for Knowledge Mining


    # 10.5.3.2 Mean Squared Error (MSE)


    In contrast to MAE, the MSE quantifies the average of squared discrepancies between
    the predictions and the actual results. A smaller MSE value is indicative of less
    variation in the results, thus favoring the superior prediction accuracy of the
    model. MSE is calculated by using the following equation.


    ```

    $MSE = \frac{1}{N} * \Sigma(A_i - P_i)^2 \quad (10.23)$

    ```


    # 10.5.3.3 Root Squared Error (RMSE)


    RMSE provides a measure of the deviation in the predictions from the observed
    values. It is particularly useful if it is in the same units as the output. A
    lower RMSE implies that our model has a lesser margin of error, signifying more
    precise predictions. RMSE is calculated by using the following equation.


    ```

    $RMSE = sqrt(MSE) \quad (10.24)$

    ```


