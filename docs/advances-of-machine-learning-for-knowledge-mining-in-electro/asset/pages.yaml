    # 3.1.4 Evaluation Metrics


    Different metrics, such as cross-entropy, confusion matrix, AUC-ROC curve, sensitivity,
    specificity, and kappa score, can be used to evaluate the classification models’
    performance.


    # 3.1.5 Cross Entropy Loss


    A classifier’s performance is evaluated using cross-entropy log or loss when its
    likelihood values fall between 0 and 1. The log of a good binary classification
    should be close to zero. If the anticipated value and the actual value are different,
    the log value increases. The model is more accurate when its log loss is lower.
    For binary classification, it is calculated as stated in Equation 3.1.


    > -ylog(p)+(1-y)log(1-p)) (3.1)


    In Equation 3.1, y represents the actual output, and p indicates the predicted
    output.


    # 3.1.6 Confusion Matrix


    The confusion matrix [13] produces a matrix and describes how well the model works.
    It is otherwise called an error matrix. The confusion matrix lists the total number
    of right predictions and wrong predictions. It looks as seen in Table 3.2.


    The number of predictions when the classifier properly classifies the patient
    as having heart disease is known as True Positive (TP) for the heart disease prediction
    issue. True Negative (TN) predictions are those in which the classifier classifies
    a patient as not having heart disease. False Positive (FP) predictions are those
    in which the classifier misclassifies a patient as positive even though they do
    not have cardiac disease. False Negative (FN) predictions are those in the classifier
    misclassifies the patient with heart disease as being negative.


