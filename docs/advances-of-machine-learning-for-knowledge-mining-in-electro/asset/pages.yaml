    # 3.1.3 Classification ALGORITHMS


    In the concept of machine learning, the problems fall under four types. They are
    classification, regression, clustering, and association. Classification and regression
    follow the supervised learning technique. Clustering and association follow the
    unsupervised learning technique. In classification, the model learns from a given
    set of observations and predicts the category or class for new observations after
    the model is trained. It is known as a binary classification problem when the
    problem has two possible solutions. A binary classification problem, [13] for
    instance, determines whether a patient has cancer. There are more than two classes
    or categories in a multiclass classification problem. The identification of the
    kind of cancer is a typical illustration of a problem involving multiple classes.


    Machine learning algorithms are further classified into linear and non-linear
    models. Logistic regression and support vector machines are examples of linear
    models. Some of the non-linear approaches are naïve Bayes, K-Nearest Neighbor,
    decision trees, and random forest algorithms. Depending on learning, the model
    is classified into lazy and non-lazy learners. A lazy learner takes less time
    for training the model and more time for predicting the test dataset. In the case
    of non-lazy learners, more time is taken for training the system and less time
    to predict the outcome of new observations. To handle complex problems, deep learning
    algorithms can be applied.'
