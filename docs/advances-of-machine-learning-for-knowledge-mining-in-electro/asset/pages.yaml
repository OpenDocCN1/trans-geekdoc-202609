    # 1.3.3 SEMI-STRUCTURED DATA IN ELECTRONIC HEALTH RECORDS (EHR)


    Information in Electronic Health Records (EHR) that lies in the middle of structured
    and unstructured data is referred to as semi-structured. It contains elements
    of both structured and unstructured formats, defining varying degrees of flexibility
    in capturing additional information.


    Semi-structured data often manifests in the form of templates or forms that offer
    structured fields for data entry, along with sections that allow free-text or
    narrative descriptions. These templates provide a structured framework for capturing
    specific data elements while allowing healthcare providers the flexibility to
    add optional details or context as needed.


    It''s also important to discuss semi-structured data, which is a structural grey
    area. This kind of data has built-in organizational features, even though it cannot
    be kept in traditional databases. As a result, it is more challenging to parse
    structured data better than unstructured data.


    Non-relational databases, or NoSQL databases, can handle semi-structured data.
    Non-relational databases store data using four flexible, non-tabular models as
    opposed to tabular form. They consist of-


    +   - Document databases.

    - Key-value databases.

    - Wide-column stores.

    - Graph databases.


    Naturally, the complexity of indexing systems in parallel with this increase in
    flexibility. Email is the most relevant example of semi-structured data.


