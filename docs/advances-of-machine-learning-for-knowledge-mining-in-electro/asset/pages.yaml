    in medical facilities, including assisting in lab analysis, expediting sample
    testing, and discussing results with patients during visits (Hsiao et al., 2009).
    By enabling efficient testing, analysis, and retention of information, EMRs can
    reduce unnecessary hospital visits and in early disease detection, improving patient
    services (Anderson & Bowers, 2008). However, like any other information system,
    EMRS function best when users are involved in all phases of development to ensure
    proper understanding and implementation [12]. In developed nations, EMRs have
    been essential for generating accurate results and saving resources (Blaya et
    al., 2010). For successful implementation, organizations need adequate infrastructure,
    computer-literate staff, computers, and strategic methods (Mahmood-Rajput et al.,
    2011).


    Despite the advantages, it''s important to highlight that EMRs also have drawbacks,
    including high initial and ongoing costs and security concerns (Weitzman et al.,
    2012). Some clinicians prefer paper documentation over computer entry, which they
    find time-consuming and disruptive to patient interaction (Mazzini, 2013). However,
    a study indicated that more time spent on EMR data entry allows patients to ask
    more health-related queries, a beneficial effect of the system (McGr et al., 2007).
    The implementation process is challenging, especially if procedures are not rigorously
    followed (Scholl et al., 2011). There has been minimal research on optimal EMR
    system design methodologies.


    General resource limitations limit increased costs, which contribute to resistance
    to EMR technology (Khalifa, 2013). Health informatics, a new branch of information
    science, focuses primarily on the application of data in healthcare (Hoy et al.,
    2012). The World Health Organization (WHO) highlighted several challenges to system
    implementation, including a lack of technical experts and financial constraints
    (Boonstra & Brokhuis, 2010). Involving patients in the EMR system by providing
    access to their health records not only improves healthcare services but also
    reduces the frequency and cost of doctor visits, both in private and public sectors
    (Tang et al., 2006). Particularly in developing nations, the adoption of a computerized
    system provides offers benefits (Williams and Boren, 2008). EMR implementation
    has significantly enhanced the ability to track patients'' medical histories and
    manage those who decline treatment.'
