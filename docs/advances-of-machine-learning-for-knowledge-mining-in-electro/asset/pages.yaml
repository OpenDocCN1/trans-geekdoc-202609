    and eliminating the need for a central authority. The immutability of the ledger
    guarantees that recorded transactions cannot be modified or tampered with without
    network consensus. DLT streamlines operations by reducing redundant record-keeping
    and enables real-time access to a single source of truth, efficiency and trust
    among participants [4].


    **Immutable Records:** Immutable records refer to the concept that once a transaction
    is recorded on a shared ledger, no participant can change or tamper with it. This
    ensures that the transaction history remains transparent and secure. If an error
    is made in a transaction record, a new transaction must be added to reverse the
    error. Both the original transaction and the reversal transaction will be visible
    on the ledger, maintaining the integrity of the records [5].


    **Smart Contracts:** Smart contracts are sets of rules or agreements that are
    stored on a blockchain and automatically executed. They are designed to facilitate
    and automate transactions. Smart contracts can define specific conditions or terms
    that need to be met for a transaction to be executed. For example, they can be
    used to govern bond transfers, specify payment terms for travel insurance, and
    handle various contractual arrangements [5]. The execution of smart contracts
    on a blockchain ensures transparency, accuracy, and security in transactions.


