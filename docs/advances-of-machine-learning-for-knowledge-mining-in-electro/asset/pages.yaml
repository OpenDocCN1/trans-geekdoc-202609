    # 3.1.7 AUC AND ROC


    An important task of machine learning is looking at how well models work. Area
    Under the Curve (AUC) [14] and Receiver Operating Characteristics (ROC) [14] are
    used to evaluate the performance of multi-class classification problems. It is
    a graph curve is plotted using the True Positive Rate (TPR) and False Positive
    Rate (FPR). The ROC is a probability curve, while AUC is a measure of separability.
    It tells how much the model is fit for recognizing classes. The AUC boosts the
    model''s ability to properly identify positive classes as positive and negative
    classes as negative. When the AUC is closer to one, the model has a good degree
    of separability. If the AUC is closer to zero, the model has the worst case of
    separability. It indicates that it reciprocates the outcome. When the AUC is 0.5,
    the model does not have the ability to separate classes.


    For the cancer prediction scenario, when the model predicts all the patients with
    cancer and all the patients without cancer correctly, then AUC is equal to one
