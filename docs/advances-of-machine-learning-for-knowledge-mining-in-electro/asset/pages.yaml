  md: '# Artificial Intelligence and Machine Learning Techniques


    Clinical trials are inherently challenging, requiring participants who meet specific
    criteria, such as age, diagnosis type, and duration of illness. Historically,
    clinical researchers had to conduct labour-intensive and administrative tasks,
    manually searching through EHRs to identify eligible individuals before reaching
    out to them regarding trial participation [37–38].


    AI is revolutionizing this process by analysing patient data, significantly reducing
    the time to find trial participants. Companies like IQVIA and Deep6 use advanced
    analytics to sift through large volumes of data within EHRs. Using Natural Language
    Processing (NLP) and text-mining, these tools automatically identify suitable
    patients by matching trial records to the criteria of clinical trials [41].


    A process that once took months can now be completed in minutes, greatly accelerating
    the rate at which experimental drugs can be approved and made available to patients.


    The length and complexity of adopting EHRs on a wide scale has been ongoing for
    decades [39–41]. Even after the development of the first medical record systems
    over fifty years ago, considerable effort is still needed to alleviate the burden
    on healthcare providers and counter the perception that EHRs are merely data storage
    tools.


    # 8.3 ANALYSIS OF PREVIOUS STUDIES


    EMR system operations have been linked to improved care, reduced costs, and the
    establishment of institutionalized data management systems, resulting in increased
    workforce productivity due to a reduction in clinical errors (Lau et al., 2012).
    Research conducted in the United States highlights that the healthcare system
    is currently addressing various challenges, such as the need to provide exceptional
    patient care while simultaneously reducing costs (Dixon, 2007).


    According to the scholars, to properly discuss a subject, one must first define
    it. Electronic Medical Record (EMR) of a patient is either a program detail or
    the entire record of the patient itself, stored digitally on a computer (Angst
    & Agar, 2009). It serves as the electronic equivalent of the traditional patient
    chart, storing information such as patient demographics, medical history, current
    medical conditions, surgical procedures, progress notes, laboratory data, and
    the like. Modifying the EMR system requires significant financial investments
    in areas such as equipment, maintenance, and support. Although the costs are considerable,
    the benefits are substantial, suggesting positive prospects for the future. Within
    healthcare, electronic records form a foundation that enables the decentralization
    of various tasks (Hillestad et al., 2005).


    Since 1958, EHRs have been examined numerous times (Reid, 2010; Aspect, 2009),
    though they remain incompletely explored (Gram, Side, 2009). The Institute of
    Medicine (IOM) evaluated the performance of EMR systems in alignment with the
    goals of the U.S. Department of Health to improve healthcare services through
    the use of healthcare-specific information technology (Nonprofessional, 2008;
    Simon et al., 2009). According to Simon et al. (2009), The IOM comprises clinical
    professionals and service providers who offer counsel for a better'
