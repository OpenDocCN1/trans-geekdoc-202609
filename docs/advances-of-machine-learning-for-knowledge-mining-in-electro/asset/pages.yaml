  md: '# #7 Predicting Lung Cancer using Supervised Algorithms

    A Machine Learning Approach


    P Privietha


    # 7.1 INTRODUCTION


    One of the leading causes of cancer-related deaths worldwide is lung cancer, if
    it can be predicted earlier, patient outcomes can be improved. Deep learning techniques
    can be particularly effective when applied to medical image analysis, such as
    CT scans, or by examining patient clinical and demographic data. It is helpful
    to predict cancer risk prediction.


    Research indicates encouraging results in using deep learning for lung cancer
    prediction. The Journal of Thoracic Oncology reported high accuracy in lung cancer
    detection from CT scans using a deep learning model. Similarly, research published
    in Nature found that a deep learning accurately assessed lung cancer risk using
    patient data.


    Nevertheless, learning models for lung cancer prediction are still in development
    stages and require extensive validation. Ethical considerations are also crucial,
    such as safeguarding patient privacy and minimizing biases in training data to
    ensure fair and reliable outcomes.


    # 7.2 ARTIFICIAL INTELLIGENCE (AI)


    One of the main goals of Artificial Intelligence (AI) is the development of computer
    programs and systems that can carry out tasks that normally require human intelligence,
    such as speech recognition, visual perception, decision-making, and natural language
    understanding. Computer vision, natural language processing, deep learning, and
    machine learning are examples of AI technologies.


    Machine learning, a subset of AI, enables computers to learn from data patterns
    without explicit programming. Deep learning, an advanced type of machine learning,
    involves training deep neural networks on large datasets to make accurate predictions.
    Natural language processing equips computers to interpret and understand human
    language, while computer vision teaches machines to analyze and understand visual
    data.


    DOI: 10.1201/9781003408376-7'
