    +   2. **Hidden Layer**: This layer accepts the output of its layer as input and
    this layer contains neurons that may be greater than equal to the number of neurons
    in the previous layer. A cross section increment is employed to examine the outcome
    of each layer with the learning heaps of each layer adapted to a couple of recognised
    inclinations, following by an inception capability that causes the association
    to be non-straight.


    +   3. **Output Layer**: The previous layer''s outcome is included in a computed
    capability that uses probability techniques for analysis and produces the output.'
