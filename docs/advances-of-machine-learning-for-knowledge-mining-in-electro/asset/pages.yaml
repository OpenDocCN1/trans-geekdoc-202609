    # 8.4.1 SUPERVISED LEARNING


    About half of the adult studies employed supervised learning models (n=64, 60.4%).
    Supervised methods are trained using labelled data, focusing on (i) features that
    predict the phenotype (for example, marker of billing codes and free-text references
    to the phenotype in a case record) and (ii) "gold standard" phenotype indicators
    (for example, presence or absence). These gold standard markers are annotated
    from self-reviewed case data, and additional markers can be derived from registry
    information, laboratory results, clinical notes, and rule-based algorithms to
    facilitate faster categorization of datasets [44].


    Common approaches for classifying dual phenotypes include decision trees, logistic
    regression, and Support Vector Machines (SVMs). Most learning methods predict
    the phenotype for each instance, unlike rule-based systems, which can complicate
    the detection of phenotypic status thresholds for specific applications [42–44].


    Machine learning techniques are computational methods that identify patterns or
    structures in data without explicit programming. Both supervised and unsupervised
    machine learning rely on "ground truth". In supervised learning, a model learns
    from labelled data in a training dataset and can predict outcomes for new instances.
    The rules often form the classifier or regression algorithms with continuous outcomes.
    Conversely, unsupervised learning involves the model learning from unlabeled data
    to uncover underlying patterns or structures.


    Machine learning is increasingly employed in fields like radiology, cardiology,
    oncology, and ophthalmology to enhance accuracy and facilitate early detection
    of conditions. Many studies used supervised machine learning methods, including
    decision trees, logistic regression, Support Vector Machines (SVMs), gradient
    boosting, Least Absolute Shrinkage and Selection Operator (LASSO), and AdaBoost
    [45].


    Logistic regression can be viewed as an extension of linear regression, as illustrated
    in Figure 8.2b. The data modelled using a linear relationship, enabling predictions
    based on given inputs, as shown in Figure 8.2a. Logistic regression employs a
    non-linear function known as the logistic function, which transforms prediction
    values into binary outcomes based on a threshold. Techniques such LASSO help to
    identify a smaller subset of predictor variables that are most relevant to the
    outcome, enhancing sensitivity and generalizability.


    In classification tasks, Support Vector Machines (SVMs) is another widely used
    machine learning model. It creates a boundary (illustrated in Figure 8.2c) that
    separates the input data into two distinct categories, which can then be used
    to classify new data points [44, 45].


    A crucial supervised learning method is the decision tree, depicted in Figure
    8.2d. This tree has a root node representing the primary decision point based
    on the predictor variable. Each branching node reflects conditions associated
    with specific input variables, enhancing the model''s predictive capability as
    more input variables are added.


    Ensemble methods are commonly used to improve prediction model performance by
    combining multiple machine learning methods. Figure 8.2e illustrates prevalent'
