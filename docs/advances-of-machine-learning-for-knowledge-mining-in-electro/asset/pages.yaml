    # 3.1.9 KAPPA SCORE


    In the field of psychology, the kappa score is a fascinating metric that is used
    to measure the agreement between two human raters (such as psychologists) when
    rating subjects (patients). The evaluators'' high degree of agreement demonstrates
    the reliability of the ratings. A low degree of understanding suggests the evaluations
    of the evaluators are not trusted. The degree of agreement between the two evaluators,
    also known as inter-rater reliability, is measured by the kappa score. Later,
    the kappa score is utilized by the machine-learning community to assess classification
    algorithms. The Kappa statistic ranges from zero to one, with one indicating complete
    agreement.


