    \(\mathbf{O} = \mathbf{W} \cdot \mathbf{F} + \mathbf{b}\) (375)


    where \(\mathbf{W} \in \mathbb{R}^{M \times N}\) is the weight matrix, \(\mathbf{b}
    \in \mathbb{R}^M\) is the bias vector, and \(\mathbf{O} \in \mathbb{R}^M\) is
    the raw output or logit for each of the \(M\) classes. The fully connected layer
    computes a set of logits for the classes based on the learned features from the
    convolutional and pooling layers. To convert the logits into class probabilities,
    a **softmax** function is applied. The softmax function is a generalization of
    the logistic function to multiple classes and transforms the logits into a probability
    distribution. The probability of class \(k\) is given by:


    \( P(y = k \mid \mathbf{O}) = \frac{e^{O_k}}{\sum_{k=1}^M e^{O_k}} \) (376)


    where \(O_k\) is the logit corresponding to class \(k\), and the denominator ensures
    that the sum of probabilities across all classes equals 1. The class label with
    the highest probability is selected as the final prediction:


    \( y = \arg \max_k P(y = k \mid \mathbf{O}) \) (377)


    The prediction is made based on the computed class probabilities, and the network
    aims to minimize the discrepancy between the predicted probabilities and the true
    labels during training. To optimize the network''s parameters, we minimize a **loss
    function** that measures the difference between the predicted probabilities and
    the actual labels. The **cross-entropy loss** is commonly used in classification
    tasks and is defined as:


    \( \mathcal{L} = - \sum_{k=1}^M y_k \log P(y = k \mid \mathbf{O}) \) (378)


    where \(y_k\) is the true label in one-hot encoding, and \(P(y = k \mid \mathbf{O})\)
    is the predicted probability for class \(k\). The goal of training is to minimize
    this loss function, which corresponds to maximizing the likelihood of the correct
    class under the predicted probability distribution.


    The optimization of the network parameters is performed using **gradient descent**
    and its variants, such as stochastic gradient descent (SGD), which iteratively
    updates the parameters based on the gradients of the loss function. The gradients
    are computed using **backpropagation**, a method that applies the chain rule of
    calculus to compute the partial derivatives of the loss with respect to each parameter.
    For a fully connected layer, the gradient of the loss with respect to the weights
    \(\mathbf{W}\) is given by:


    \( \nabla_\mathbf{W} \mathcal{L} = \frac{\partial \mathcal{L}}{\partial \mathbf{O}}
    \cdot \frac{\partial \mathbf{O}}{\partial \mathbf{W}} = \delta \cdot \mathbf{F}^T
    \) (379)


    where \(\delta = \frac{\partial \mathcal{L}}{\partial \mathbf{O}}\) is the error
    term (also known as the delta) for the logits, and \(\mathbf{F}^T\) is the transpose
    of the flattened feature vector. The parameters are updated using the following
    rule:


    \( \mathbf{W} \leftarrow \mathbf{W} - \eta \nabla_\mathbf{W} \mathcal{L} \) (380)


    where \(\eta\) is the learning rate, controlling the step size of the updates.
    This process is repeated for each batch of training data until the network converges
    to a set of parameters that minimize the loss function. Through this complex and
    iterative process, CNNs are able to learn to classify images by automatically
    extracting hierarchical features from raw input data. The combination of convolution,
    activation, pooling, and fully connected layers enables the network to learn increasingly
    abstract and high-level representations of the input image, ultimately achieving
    high accuracy in image classification tasks.'
