    Another key hyperparameter is the weight initialization strategy, which affects
    the scale of activations and gradients throughout the network. For a layer with
    \( n_\text{in} \) inputs, He initialization samples weights from:


    ```

    \( w_{ij} \sim \mathcal{N}\left(0, \frac{2}{n_\text{in}}\right),\) (327)

    ```


    to ensure that the variance of activations remains stable as data propagate through
    layers. The activation function \( g(z) \) also plays a crucial role. The Rectified
    Linear Unit (ReLU), defined as \( g(z) = \max(0, z) \), introduces sparsity and
    mitigates vanishing gradients. However, it suffers from the "dying neuron" problem,
    as its derivative \( g''(z) \) is zero for \( z \le 0 \). The search for optimal
    hyperparameters can be approached using grid search, random search, or more advanced
    methods like Bayesian optimization. In Bayesian optimization, a surrogate model
    \( p(\mathcal{L}_{val}(h)) \), often a Gaussian Process (GP), is constructed to
    approximate the validation loss. The acquisition function \( a(h) \), such as
    Expected Improvement (EI), guides the exploration of \( \mathcal{H} \) by balancing
    exploitation of regions with low predicted loss and exploration of uncertain regions:


    ```

    \( a(h) = \mathbb{E} \left[ \max(0, \mathcal{L}_{val,min} - \mathcal{L}_{val}(h))
    \right],\) (328)

    ```


    where \( \mathcal{L}_{val,min} \) is the best observed validation loss. Hyperparameter
    tuning is computationally intensive due to the high dimensionality of \( \mathcal{H}
    \) and the nested nature of the optimization problem. Early stopping, a widely
    used strategy, halts training when the improvement in validation loss falls below
    a threshold:


    ```

    \(\frac{\mathcal{L}_{val}^{(t+1)} - \mathcal{L}_{val}^{(t)}}{\mathcal{L}_{val}^{(t)}}
    < \epsilon,\) (329)

    ```


    where \( \epsilon > 0 \) is a small constant. Advanced techniques like Hyperband
    leverage multi-fidelity optimization, allocating resources dynamically to promising
    hyperparameter configurations based on partial training evaluations.


    In conclusion, hyperparameter tuning for training neural networks is an exceptionally
    mathematically rigorous process, grounded in nested optimization, gradient-based
    methods, probabilistic modeling, and computational heuristics. Each component,
    from learning rates and regularization to initialization and optimization strategies,
    contributes to the complex interplay that defines neural network performance.


