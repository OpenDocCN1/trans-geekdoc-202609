  md: 'This involves estimating the probability of T given S, with the assumption
    that the translation can be described probabilistically. In the most fundamental
    form of statistical machine translation (SMT), this probability is often modeled
    through a series of translation models that decompose the translation process
    into manageable components. The conditional probability P(T | S) in SMT can be
    factorized using Bayes’ theorem:


    ```

    P(T | S) = \frac{P(S,T)}{P(S)} = \frac{P(T | S)P(S)}{P(S)} \quad \text{(569)}

    ```


    Given this decomposition, the core of early SMT models, such as IBM models, sought
    to model the joint probability P(S, T) over source and target language pairs.
    Specifically, in word-based models like IBM Model 1, the task reduces to estimating
    the probability of translating each word in the source language S to its corresponding
    word in the target language T. The joint probability can be written as:


    ```

    P(S,T) = \prod_{i=1}^{T} \prod_{j=1}^{N} t(s_i | t_j) \quad \text{(570)}

    ```


    where t(si | tj) is the probability of translating word si in the source sentence
    to word tj in the target sentence. The estimation of these probabilities, t(si
    | tj), is typically achieved by analyzing parallel corpora through various techniques
    such as Expectation-Maximization (EM), which allows the unsupervised learning
    of these translation probabilities from large amounts of bilingual text data.
    The EM algorithm iterates between computing the expected alignments of words in
    the source and target languages and refining the model parameters accordingly.
    The word-based translation models, however, do not take into account the structure
    of the language, which often leads to suboptimal translations, especially in languages
    with significantly different syntactic structures. The challenges stem from the
    word order differences and idiomatic expressions that cannot be captured through
    a simple word-to-word mapping. To overcome these limitations, IBM Model 2 introduced
    the concept of word alignments, where an additional hidden variable A is introduced,
    representing a possible alignment between words in the source and target sentences.
    This can be expressed as:


    ```

    P(S,T,A) = \prod_{i=1}^{T} \prod_{j=1}^{N} t(s_i | t_j)a(s_i | t_j) \quad \text{(571)}

    ```


    where a(si | tj) denotes the alignment probability between word si in the source
    language and word tj in the target language. By optimizing these alignment probabilities,
    SMT systems improve the quality of translations by better modeling the relationship
    between the source and target sentences. Estimating a(si | tj), however, requires
    computationally expensive algorithms, which can be handled by methods like EM
    for iterative refinement.


    A more sophisticated approach was introduced with sequence-to-sequence (Seq2Seq)
    models, which significantly improved the translation process by leveraging deep
    learning techniques. The core of Seq2Seq is the encoder-decoder framework, where
    an encoder processes the entire source sentence and encodes it into a context
    vector, and a decoder generates the target sequence. In this approach, the translation
    probability is formulated as:


    ```

    P(T | S) = P(t_1 | S) \prod_{i=2}^{N} P(t_i | t_{<i}, S) \quad \text{(572)}

    ```


    where t<i denotes the previously generated target words, capturing the sequential
    nature of translation. The key advantage of the Seq2Seq model is its ability to
    model entire sentences at once, providing a richer, more flexible representation
    of both the source and target sequences compared to word-based models. The encoder,
    typically implemented using Recurrent Neural Networks (RNNs) or more advanced
    variants such as Long Short-Term Memory (LSTM) or Gated Recurrent Unit'
