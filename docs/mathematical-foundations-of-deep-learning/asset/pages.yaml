  md: 'agent''s decision-making process. The state space $\mathcal{S}$ may be either
    *discrete* or *continuous*. The state transitions are governed by a probability
    distribution $P(s_{t+1}|s_t, a_t)$, which represents the probability of moving
    from state $s_t$ to state $s_{t+1}$ given action $a_t$. These transitions satisfy
    the *Markov property*, meaning the future state depends only on the current state
    and action, not the history of previous states or actions:


    $P(s_{t+1}|s_t, a_t) = P(s_{t+1}|s_t, a_t) \quad \forall s_t, s_{t+1} \in \mathcal{S},
    a_t \in \mathcal{A}.$ (529)


    Additionally, the transition probabilities satisfy the *normalization condition*:


    \(\sum_{s_{t+1} \in \mathcal{S}} P(s_{t+1}|s_t, a_t) = 1 \quad \forall s_t, a_t.\)
    (530)


    The *state distribution* $\rho_t(s_t)$ represents the probability of the agent
    being in state $s_t$ at time $t$. The state distribution evolves over time according
    to the transition probabilities:


    \(\rho_{t+k}(s_{t+k}) = \sum_{s_t \in \mathcal{S}} P(s_{t+k}|s_t, a_t)\rho_t(s_t),\)
    (531)


    where $\rho_t(s_t)$ is the initial distribution at time $t$, and $\rho_{t+k}(s_{t+k})$
    is the distribution at time $t + k$. An action $a_t$ taken at time $t$ by the
    agent in state $s_t$ leads to a transition to state $s_{t+1}$ and results in a
    reward $r_t$. The agent aims to select actions that maximize its long-term reward.
    The *action-value function* $Q(s_t, a_t)$ quantifies the expected cumulative reward
    from taking action $a_t$ in state $s_t$ and following the optimal policy thereafter.
    It is defined as:


    \(Q(s_t, a_t) = \mathbb{E} \left[ \sum_{k=0}^{\infty} \gamma^k r_{t+k} \mid s_t,
    a_t \right].\) (532)


    The optimal action-value function $Q^*(s_t, a_t)$ satisfies the *Bellman Optimality
    Equation*:


    \(Q^*(s_t, a_t) = R(s_t, a_t) + \gamma \sum_{s_{t+1} \in \mathcal{S}} P(s_{t+1}|s_t,
    a_t) \max_{a_{t+1}} Q^*(s_{t+1}, a_{t+1}).\) (533)


    This recursive equation provides the foundation for dynamic programming methods
    such as *value iteration* and *policy iteration*. The optimal policy $\pi^*(s_t)$
    is derived by choosing the action that maximizes the action-value function:


    \(\pi^*(s_t) = \arg \max_{a_t \in \mathcal{A}} Q^*(s_t, a_t).\) (534)


    The *optimal value function* $V^*(s_t)$, representing the expected return from
    state $s_t$ under the optimal policy, is given by:


    \(V^*(s_t) = \max_{a_t \in \mathcal{A}} Q^*(s_t, a_t).\) (535)


    The optimal value function satisfies the Bellman equation:


    \(V^*(s_t) = \max_{a_t \in \mathcal{A}} \left[ R(s_t, a_t) + \gamma \sum_{s_{t+1}
    \in \mathcal{S}} P(s_{t+1}|s_t, a_t) V^*(s_{t+1}) \right].\) (536)


    The *reward* $r_t$ at time $t$ is a scalar value that represents the immediate
    benefit (or cost) the agent receives after taking action $a_t$ in state $s_t$.
    It is a function $R(s_t, a_t)$ mapping state-action pairs to real numbers:


    \(r_t = R(s_t, a_t).\) (537)


    The agent''s objective is to maximize the cumulative reward, which is given by
    the *total return* from time $t$:


    \(G_t = \sum_{k=0}^{\infty} \gamma^k r_{t+k}.\) (538)'
