  md: 'Expanding and isolating linear terms:


    $$df = \text{tr}(\mathbf{H}^T \mathbf{A} \mathbf{X}) + \text{tr}(\mathbf{X}^T
    \mathbf{A} \mathbf{H}). \tag{700}$$


    Using the cyclic property of the trace:


    $$df = \text{tr}(\mathbf{H}^T(\mathbf{A}\mathbf{X} + \mathbf{A}^T\mathbf{X})).
    \tag{701}$$


    Thus, the derivative is:


    $$\frac{\partial f}{\partial \mathbf{X}} = \mathbf{A}\mathbf{X} + \mathbf{A}^T\mathbf{X}.
    \tag{702}$$


    If $\mathbf{A}$ is symmetric ($\mathbf{A}^T = \mathbf{A}$), this simplifies to:


    $$\frac{\partial f}{\partial \mathbf{X}} = 2\mathbf{A}\mathbf{X}. \tag{703}$$


    Regarding the Differentiation of Matrix-Valued Functions. Consider a differentiable
    function $\mathbf{F} : \mathbb{R}^{m \times n} \to \mathbb{R}^{p \times q}$. The
    **Fréchet derivative** $\mathcal{D}_\mathbf{X}\mathbf{F}$ is a **fourth-order
    tensor** satisfying:


    $$d\mathbf{F} = \mathcal{D}_\mathbf{X}\mathbf{F} : d\mathbf{X}. \tag{704}$$


    Regarding the Differentiation of the Matrix Inverse, for $\mathbf{F}(\mathbf{X})
    = \mathbf{X}^{-1}$ we use the identity:


    $$d(\mathbf{X}\mathbf{X}^{-1}) = 0 \Rightarrow d\mathbf{X}\mathbf{X}^{-1} + \mathbf{X}d\mathbf{X}^{-1}
    = 0. \tag{705}$$


    Solving for $d\mathbf{X}^{-1}$:


    $$d\mathbf{X}^{-1} = -\mathbf{X}^{-1}(d\mathbf{X})\mathbf{X}^{-1}. \tag{706}$$


    Thus, the derivative is the **negative bilinear operator**:


    $$\mathcal{D}_\mathbf{X}(\mathbf{X}^{-1}) = -(\mathbf{X}^{-1} \otimes \mathbf{X}^{-1}).
    \tag{707}$$


    where $\otimes$ denotes the Kronecker product. For Differentiation of Tensor-Valued
    Functions. We need to have a differentiable tensor function $\mathcal{F} : \mathbb{R}^{m
    \times n \times p} \to \mathbb{R}^{a \times b \times c}$, the **Fréchet derivative**
    shall be a **higher-order tensor** $\mathcal{D}_\mathcal{X}\mathcal{F}$ satisfying:


    $$d\mathcal{F} = \mathcal{D}_\mathcal{X}\mathcal{F} : d\mathcal{X}. \tag{708}$$


    Let''s do a Differentiation of Tensor Contraction. If $f(\mathcal{X}) = \mathcal{X}
    : \mathcal{A}$, where $\mathcal{X}, \mathcal{A}$ are second-order tensors, then:


    $$\frac{\partial}{\partial \mathcal{X}}(\mathcal{X} : \mathcal{A}) = \mathcal{A}.
    \tag{709}$$


    For a fourth-order tensor $\mathcal{C}$, if $f(\mathcal{X}) = \mathcal{C} : \mathcal{X}$,
    then:


    $$\frac{\partial}{\partial \mathcal{X}}(\mathcal{C} : \mathcal{X}) = \mathcal{C}.
    \tag{710}$$


    Differentiation can be also done in Non-Euclidean Spaces. For a manifold $\mathcal{M}$,
    differentiation is defined via tangent spaces $T_\mathbf{X}\mathcal{M}$, with
    the covariant derivative $\nabla_\mathbf{X}$ satisfying the **Levi-Civita connection**:


    $$\nabla_\mathbf{X}\mathbf{Y} = \lim_{\epsilon \to 0} \frac{\text{Proj}_{T_{\mathbf{X}+\epsilon\mathbf{H}}\mathcal{M}}(\mathbf{Y}(\mathbf{X}
    + \epsilon\mathbf{H})) - \mathbf{Y}(\mathbf{X})}{\epsilon}. \tag{711}$$


    We can do differentiation using Variational Principles also. If $f(\mathbf{X})$
    is an energy functional, the differentiation that follows from **Gateaux derivatives**
    is:


    $$\delta f = \lim_{\epsilon \to 0} \frac{f(\mathbf{X} + \epsilon\mathbf{H}) -
    f(\mathbf{X})}{\epsilon}. \tag{712}$$


    For functionals, differentiation uses **Euler-Lagrange equations**:


    $$\frac{d}{dt} \int_\Omega L(\mathbf{X}, \nabla \mathbf{X}) dV = 0. \tag{713}$$'
