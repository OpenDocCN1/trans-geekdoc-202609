- pgno: 147
  md: 'For example, consider a function of a second-order tensor, $f(\mathbf{T})$,
    where $\mathbf{T}$ is a matrix. The differentiation rule follows similar principles
    as matrix differentiation. The Jacobian is computed for each tensor component
    in the same fashion, based on the partial derivatives with respect to the individual
    tensor components.


    Consider a second-order tensor $\mathbf{T}$, and let''s compute the derivative
    of the Frobenius norm of $\mathbf{T}$:


    \(\|\mathbf{T}\|_F = \sqrt{\sum_{i_1, i_2, \dots, i_k} T_{i_1, \dots, i_k}^2}\)
    (692)


    Differentiating with respect to $T_{i_1, \dots, i_k}$, we get:


    \(\frac{\partial \|\mathbf{T}\|_F}{\partial T_{i_1, \dots, i_k}} = \frac{2 T_{i_1,
    \dots, i_k}}{2 \|\mathbf{T}\|_F} = \frac{T_{i_1, \dots, i_k}}{\|\mathbf{T}\|_F}\)
    (693)


    This is the gradient of the Frobenius norm, where each component $T_{i_1, \dots,
    i_k}$ is normalized by the Frobenius norm. For higher-order tensors, differentiation
    follows the same principles but extends to multi-indexed components. If $\mathbf{T}$
    is a third-order tensor, say $T_{i_1, i_2, i_3}$, the differentiation of $f(\mathbf{T})$
    with respect to any component is given by:


    \(\frac{\partial f(\mathbf{T})}{\partial T_{i_1, i_2, i_3}} = \text{Jacobian of
    } f(\mathbf{T}) \text{ with respect to the multi-index components.}\) (694)


    For the tensor product of two tensors $\mathbf{T}_1$ and $\mathbf{T}_2$, say of
    orders $p$ and $q$, respectively, the product is another tensor of order $p +
    q$. Differentiation of the tensor product $\mathbf{T}_1 \otimes \mathbf{T}_2$
    follows the product rule:


    \(\frac{\partial (\mathbf{T}_1 \otimes \mathbf{T}_2)}{\partial \mathbf{T}_1} =
    \mathbf{T}_2, \quad \frac{\partial (\mathbf{T}_1 \otimes \mathbf{T}_2)}{\partial
    \mathbf{T}_2} = \mathbf{T}_1\) (695)


    This tensor product rule applies for higher-order tensors, where differentiation
    follows tensor contraction rules. The process of differentiating matrices and
    tensors extends the rules of differentiation to multi-dimensional data structures,
    with careful application of chain rules, product rules, and understanding the
    Jacobian of the functions. For matrices, the derivative is a matrix of partial
    derivatives, while for tensors, the derivative is typically expressed as a tensor
    with respect to multi-index components. In higher-order tensor differentiation,
    we apply these principles recursively, accounting for multi-index notation, and
    respecting the tensor contraction rules that define how the components interact.


    We start with the Differentiation of Scalar-Valued Functions with Matrix Arguments.
    Let $f : \mathbb{R}^{m \times n} \to \mathbb{R}$ be a scalar function of a matrix
    $\mathbf{X}$. The differential $df$ of $f$ is defined by:


    \(df = \lim_{\|\mathbf{H}\| \to 0} \frac{f(\mathbf{X} + \mathbf{H}) - f(\mathbf{X})}{\|\mathbf{H}\|}\)
    (696)


    where $\mathbf{H}$ is an infinitesimal perturbation. The total derivative of $f$
    is given by:


    \(df = \text{tr} \left( \left( \frac{\partial f}{\partial \mathbf{X}} \right)^T
    d\mathbf{X} \right).\) (697)


    Definition of the Matrix Gradient: The gradient $\mathbf{D_X}f$ (or Jacobian)
    is the unique matrix satisfying:


    \(df = \text{tr} \left( \mathbf{D_X}^T d\mathbf{X} \right) .\) (698)


    This ensures that differentiation is dual to the Frobenius inner product $\langle
    \mathbf{A}, \mathbf{B} \rangle = \text{tr}(\mathbf{A}^T \mathbf{B})$, giving a
    **Hilbert space structure**. Let''s start with the example of Quadratic Form Differentiation.
    Let $f(\mathbf{X}) = \text{tr}(\mathbf{X}^T \mathbf{A} \mathbf{X})$. Expanding
    in a small perturbation $\mathbf{H}$:


    \(f(\mathbf{X} + \mathbf{H}) = \text{tr}((\mathbf{X} + \mathbf{H})^T \mathbf{A}
    (\mathbf{X} + \mathbf{H})).\) (699)'
