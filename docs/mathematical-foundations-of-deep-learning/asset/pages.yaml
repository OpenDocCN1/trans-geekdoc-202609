  md: 'As \( P \to \infty \), the NTK converges to a deterministic matrix that remains
    nearly constant during training. Substituting the linearized form of \( \mathbf{f}(t)
    \) into the gradient descent update equation gives


    \[ \mathbf{f}(t+1) = \mathbf{f}(t) - \frac{\eta}{N} \Theta (\mathbf{f}(t) - \mathbf{y}),
    \]


    where \( \mathbf{y} \in \mathbb{R}^N \) is the vector of true labels. Defining
    the residual \( \mathbf{r}(t) = \mathbf{f}(t) - \mathbf{y} \), the dynamics of
    training reduce to


    \[ \mathbf{r}(t+1) = \left( I - \frac{\eta}{N} \Theta \right) \mathbf{r}(t). \]


    The eigendecomposition \( \Theta = Q \Lambda Q^\top \), with orthogonal \( Q \)
    and diagonal \( \Lambda = \text{diag}(\lambda_1, \dots, \lambda_N) \), allows
    us to analyze the decay of residuals in the eigenbasis of \( \Theta \):


    \[ \tilde{\mathbf{r}}(t+1) = \left( I - \frac{\eta}{N} \Lambda \right) \tilde{\mathbf{r}}(t),
    \]


    where \( \tilde{\mathbf{r}}(t) = Q^\top \mathbf{r}(t) \). Each component decays
    as


    \[ \tilde{r}_i(t) = \left( 1 - \frac{\eta \lambda_i}{N} \right)^t \tilde{r}_i(0).
    \]


    For small \( \eta \), the training dynamics are approximately continuous, governed
    by


    \[ \frac{d\mathbf{r}(t)}{dt} = -\frac{1}{N} \Theta \mathbf{r}(t), \]


    leading to the solution


    \[ \mathbf{r}(t) = \exp \left( - \frac{\Theta t}{N} \right) \mathbf{r}(0). \]


    The NTK for specific architectures, such as fully connected ReLU networks, can
    be derived using layerwise covariance matrices. Let \( \Sigma^{(l)}(\mathbf{x},
    \mathbf{x}'') \) denote the covariance between pre-activations at layer \( l \).
    The recurrence relation for \( \Sigma^{(l)} \) is


    \[ \Sigma^{(l)}(\mathbf{x}, \mathbf{x}'') = \frac{1}{2\pi} \| \mathbf{z}^{(l-1)}(\mathbf{x})
    \| \| \mathbf{z}^{(l-1)}(\mathbf{x}'') \| (\sin \theta + (\pi - \theta) \cos \theta),
    \]


    where \( \theta = \cos^{-1} \left( \frac{\Sigma^{(l-1)}(\mathbf{x}, \mathbf{x}'')}{\sqrt{\Sigma^{(l-1)}(\mathbf{x},
    \mathbf{x}) \Sigma^{(l-1)}(\mathbf{x}'', \mathbf{x}'')}} \right) \). The NTK,
    a sum over contributions from all layers, quantifies how parameter updates propagate
    through the network.


    In the infinite-width limit, the NTK framework predicts generalization properties,
    as the kernel matrix \( \Theta \) governs both training and test-time behavior.
    The NTK connects neural networks to classical kernel methods, offering a bridge
    between deep learning and well-established theoretical tools in approximation
    theory. This regime’s deterministic and analytical tractability enables precise
    characterizations of network performance, convergence rates, and robustness to
    initialization and learning rate variations.


