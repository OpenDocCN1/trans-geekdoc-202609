    \(\text{UCB}(\mathbf{x}) = \mu(\mathbf{x}) + \kappa\sigma(\mathbf{x}) \quad (357)\)


    where \(\kappa\) is a hyperparameter that controls the trade-off between exploration
    (\(\kappa\) large) and exploitation (\(\kappa\) small). After selecting \(\mathbf{x}_*\),
    the function is evaluated at this point, and the observed value \(y_* = f(\mathbf{x}_*)\)
    is used to update the posterior distribution of the Gaussian Process. This process
    is repeated iteratively, and each new observation refines the model''s understanding
    of the objective function, guiding the search for the optimal \(\mathbf{x}^*\).
    One of the primary advantages of Bayesian Optimization is its ability to efficiently
    optimize expensive-to-evaluate functions by focusing the search on the most promising
    regions of the input space. However, as the number of observations increases,
    the computational complexity of maintaining the Gaussian Process model grows cubically
    with respect to the number of points, due to the need to invert the covariance
    matrix \(\mathbf{K}\). This cubic complexity, \(\mathcal{O}(n^3)\), can be prohibitive
    for large datasets. To mitigate this, techniques such as **sparse Gaussian Processes**
    have been developed, which approximate the full covariance matrix by using a smaller
    set of inducing points, thus reducing the computational cost while maintaining
    the flexibility of the Gaussian Process model.


    In conclusion, Bayesian Optimization represents a mathematically rigorous and
    efficient method for hyperparameter tuning, where a Gaussian Process surrogate
    model is used to approximate the unknown objective function, and an acquisition
    function guides the search for the optimal solution by balancing exploration and
    exploitation. Despite its computational challenges, especially in high-dimensional
    problems, the method is widely applicable in contexts where evaluating the objective
    function is expensive, and it has been shown to outperform traditional optimization
    techniques in many real-world scenarios.


