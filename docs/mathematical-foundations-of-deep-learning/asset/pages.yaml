    layer by layer. At layer \(l\), the output is


    \(\vec{z}^{(l)} = \phi^{(l)}(\vec{W}^{(l)}\vec{z}^{(l-1)} + \vec{b}^{(l)}),\)


    (178)


    where \(\vec{W}^{(l)} \in \mathbb{R}^{n_l \times n_{l-1}}\) is the weight matrix,
    \(\vec{b}^{(l)} \in \mathbb{R}^{n_l}\) is the bias vector, and \(\phi^{(l)}\)
    is the activation function. The network''s output is


    \(\hat{\vec{y}} = \phi^{(L)}(\vec{W}^{(L)}\vec{z}^{(L-1)} + \vec{b}^{(L)}).\)


