    space efficiently, with the goal of finding the global or local optimum of the
    loss function.


    One such search method is **random search**, which is a straightforward yet effective
    approach to exploring the hyperparameter space. Instead of exhaustively searching
    over a grid of values for each hyperparameter (as in grid search), random search
    samples hyperparameters \(\mathbf{h}_t = (h_{t,1}, h_{t,2}, \dots, h_{t,d})\)
    from a predefined distribution for each hyperparameter \(h_i\). For each iteration
    \(t\), the hyperparameters are independently sampled from probability distributions
    \(\mathcal{D}_i\) associated with each hyperparameter \(h_i\), where the probability
    distribution might be continuous or discrete. Specifically, for continuous hyperparameters,
    \(h_{t,i}\) is drawn from a uniform or normal distribution over an interval \(H_i
    = [a_i, b_i]\):


    ```

    \(h_{t,i} \sim \mathcal{U}(a_i, b_i), \quad h_{t,i} \in H_i, \tag{343}\)

    ```


    where \(\mathcal{U}(a_i, b_i)\) denotes the uniform distribution between \(a_i\)
    and \(b_i\). For discrete hyperparameters, \(h_{t,i}\) is sampled from a discrete
    set of values \(H_i = \{h_{i1}, h_{i2}, \dots, h_{iN_i}\}\) with each value equally
    probable:


    ```

    \(h_{t,i} \sim \mathcal{D}_i, \quad h_{t,i} \in \{h_{i1}, h_{i2}, \dots, h_{iN_i}\},
    \tag{344}\)

    ```


    where \(\mathcal{D}_i\) denotes the discrete distribution over the set \(\{h_{i1},
    h_{i2}, \dots, h_{iN_i}\}\). Thus, each hyperparameter is selected independently
    from its corresponding distribution. After selecting a new set of hyperparameters
    \(\mathbf{h}_t\), the model is trained with this configuration, and its performance
    is evaluated by computing the loss function \(L(\mathbf{h}_t)\). The process is
    repeated for \(T\) iterations, generating a sequence of hyperparameter configurations
    \(\mathbf{h}_1, \mathbf{h}_2, \dots, \mathbf{h}_T\), and for each configuration,
    the associated loss function values \(L(\mathbf{h}_1), L(\mathbf{h}_2), \dots,
    L(\mathbf{h}_T)\) are computed. The optimal set of hyperparameters \(\mathbf{h}^*\)
    is then selected as the one that minimizes the loss:


    ```

    \(\mathbf{h}^* = \arg \min_{t \in \{1, 2, \dots, T\}} L(\mathbf{h}_t). \tag{345}\)

    ```


