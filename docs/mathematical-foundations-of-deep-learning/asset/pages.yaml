  md: 'networks, the generator $G$ and the discriminator $D$. These networks are parametrized
    by weights $\theta_G \in \Theta_G$ and $\theta_D \in \Theta_D$, and their interaction
    is mathematically formulated as a two-player zero-sum game. The generator $G :
    \mathbb{R}^d \to \mathbb{R}^n$ maps latent variables $\mathbf{z} \sim p_{\mathbf{z}}(\mathbf{z})$,
    where $p_{\mathbf{z}}$ is a prior probability distribution (commonly uniform or
    Gaussian), to a synthetic data sample $\hat{\mathbf{x}} = G(\mathbf{z})$. The
    discriminator $D : \mathbb{R}^n \to [0, 1]$ assigns a probability score $D(\mathbf{x})$
    indicating whether $\mathbf{x}$ originates from the true data distribution $p_{\text{data}}(\mathbf{x})$
    or the generated distribution $p_g(\mathbf{x})$, implicitly defined as the pushforward
    measure of $p_{\mathbf{z}}$ under $G$, i.e., $p_g = G_{\#}p_{\mathbf{z}}$. The
    optimization problem governing GANs is expressed as


    ```

    \min_G \max_D V(D, G) = \mathbb{E}_{\mathbf{x} \sim p_{\text{data}}}[\log D(\mathbf{x})]
    + \mathbb{E}_{\mathbf{z} \sim p_{\mathbf{z}}}[\log(1 - D(G(\mathbf{z})))], \quad
    (506)

    ```


    where $\mathbb{E}$ denotes the expectation operator. This objective seeks to maximize
    the discriminator''s ability to distinguish between real and generated samples
    while simultaneously minimizing the generator''s ability to produce samples distinguishable
    from real data. For a fixed generator $G$, the optimal discriminator $D^*$ is
    obtained by maximizing $V(D, G)$, yielding


    ```

    D^*(\mathbf{x}) = \frac{p_{\text{data}}(\mathbf{x})}{p_{\text{data}}(\mathbf{x})
    + p_g(\mathbf{x})}. \quad (507)

    ```


    Substituting $D^*$ back into the value function simplifies it to


    ```

    V(D^*, G) = \mathbb{E}_{\mathbf{x} \sim p_{\text{data}}} \left[ \log \frac{p_{\text{data}}(\mathbf{x})}{p_{\text{data}}(\mathbf{x})
    + p_g(\mathbf{x})} \right] + \mathbb{E}_{\mathbf{x} \sim p_g} \left[ \log \frac{p_g(\mathbf{x})}{p_{\text{data}}(\mathbf{x})
    + p_g(\mathbf{x})} \right]. \quad (508)

    ```


    This expression is equivalent to minimizing the Jensen-Shannon (JS) divergence
    between $p_{\text{data}}$ and $p_g$, defined as


    ```

    \text{JS}(p_{\text{data}} \| p_g) = \frac{1}{2} \text{KL}(p_{\text{data}} \| M)
    + \frac{1}{2} \text{KL}(p_g \| M), \quad (509)

    ```


    where $M = \frac{1}{2}(p_{\text{data}} + p_g)$ and $\text{KL}(p \| q) = \int p(\mathbf{x})
    \log \frac{p(\mathbf{x})}{q(\mathbf{x})} d\mathbf{x}$ is the Kullback-Leibler
