    $G$ with respect to their parameters as $\nabla_{\theta_D}$ and $\nabla_{\theta_G}$,
    the updates are given by:


    ```

    \theta_D \leftarrow \theta_D + \eta_D \nabla_{\theta_D} [\mathbb{E}_{x \sim p_{\text{data}}}
    [\log D(x)] + \mathbb{E}_{z \sim p_z} [\log (1 - D(G(z)))]] , \quad (511)

    ```


    and


    ```

    \theta_G \leftarrow \theta_G - \eta_G \nabla_{\theta_G} [\mathbb{E}_{z \sim p_z}
    [\log (1 - D(G(z)))]] . \quad (512)

    ```


    In practice, to address issues of vanishing gradients, an alternative loss function
    for the generator is often used, defined as:


    ```

    -\mathbb{E}_{z \sim p_z} [\log D(G(z))] . \quad (513)

    ```


    This modification ensures stronger gradient signals when the discriminator is
    performing well, effectively improving the generator''s training dynamics. For
    the generator, the gradients in the original formulation are expressed as


    ```

    \nabla_{\theta_G} V(D, G) = -\mathbb{E}_{\mathbf{z} \sim p_{\mathbf{z}}} [\nabla_{\theta_G}
    \log(1 - D(G(\mathbf{z})))], \quad (514)

    ```'
