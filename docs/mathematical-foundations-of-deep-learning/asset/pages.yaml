    The Universal Approximation Theorem guarantees that MLPs with sufficient neurons
    and non-linear activations can approximate any continuous function \(f : \mathbb{R}^n
    \to \mathbb{R}^m\) to arbitrary precision. Formally, for any \(\epsilon > 0\),
    there exists an MLP \(g(\vec{x})\) such that


    \(\|f(\vec{x}) - g(\vec{x})\|_\infty < \epsilon\)


    (180)


    for all \(\vec{x} \in \mathbb{R}^n\). Training an MLP minimizes a loss function
    \(L\) that quantifies the error between predicted outputs \(\hat{\vec{y}}\) and
    ground truth labels \(\vec{y}\). For regression, the mean squared error is


    \(L = \frac{1}{m} \sum_{i=1}^m \|\hat{\vec{y}}_i - \vec{y}_i\|^2,\)


    (181)


    and for classification, the cross-entropy loss is


    \(L = -\frac{1}{m} \sum_{i=1}^m \left[ \vec{y}_i^T \log \hat{\vec{y}}_i + (1 -
    \vec{y}_i)^T \log(1 - \hat{\vec{y}}_i) \right].\)


    (182)


    Optimization uses stochastic gradient descent (SGD), updating parameters \(\Theta
    = \{ \vec{W}^{(l)}, \vec{b}^{(l)} \}_{l=1}^L\) as


    \(\Theta \leftarrow \Theta - \eta \nabla_\Theta L.\)


    (183)


    Gradients are computed via backpropagation:


    \(\frac{\partial L}{\partial \vec{W}^{(l)}} = \delta^{(l)} \vec{z}^{(l-1)T},\)


    (184)


    where \(\delta^{(l)}\) is the error signal at layer \(l\), recursively calculated
    as


    \(\delta^{(l)} = (\vec{W}^{(l+1)T} \delta^{(l+1)}) \circ \phi''^{(l)}(\vec{z}^{(l)}).\)


    (185)


    This recursive structure, combined with chain rule applications, efficiently propagates
    error signals from the output layer back to the input layer.


