    Deep Q-Learning (DQL) is an advanced reinforcement learning (RL) technique where
    the goal is to approximate the optimal action-value function \(Q^*(s, a)\) through
    the use of deep neural networks. In traditional Q-learning, the action-value function
    \(Q(s, a)\) maps a state-action pair to the expected return or cumulative discounted
    reward from that state-action pair, under the assumption of following an optimal
    policy. Formally, the Q-function is defined as:


    ```

    Q(s, a) = \mathbb{E} \left[ \sum_{t=0}^{\infty} \gamma^t r_t \mid s_0 = s, a_0
    = a \right] \tag{541}

    ```


    where \(\gamma \in [0, 1]\) is the discount factor, which determines the weight
    of future rewards relative to immediate rewards, and \(r_t\) is the reward received
    at time step \(t\). The optimal Q-function \(Q^*(s, a)\) satisfies the Bellman
    optimality equation:


    ```

    Q^*(s, a) = \mathbb{E} \left[ r_t + \gamma \max_{a''} Q^*(s_{t+1}, a'') \mid s_0
    = s, a_0 = a \right] \tag{542}

    ```


    where \(s_{t+1}\) is the next state after taking action \(a\) in state \(s\),
    and the maximization term represents the optimal future expected reward. This
    equation represents the recursive structure of the optimal action-value function,
    where each Q-value is updated based on the reward obtained in the current step
    and the maximum future reward expected from the next state. The goal is to learn
    the optimal Q-function through iterative updates, typically using the Temporal
    Difference (TD) method. In Deep Q-Learning, the Q-function is approximated by
    a deep neural network, as directly storing Q-values for every state-action pair
    is computationally infeasible for large state and action spaces. Let the approximated
    Q-function be \(Q_\theta(s, a)\), where \(\theta\) denotes the parameters (weights
    and biases) of the neural network that approximates the action-value function.
    The deep Q-network (DQN) aims to learn \(Q_\theta(s, a)\) such that it closely
    approximates \(Q^*(s, a)\) over time. The update of the Q-function follows the
    TD error principle, where the goal is to minimize the difference between the current
    Q-values and the target Q-values derived from the Bellman equation. The loss function
    for training the DQN is given by:


    ```

    L(\theta) = \mathbb{E}_{(s_t, a_t, r_t, s_{t+1}) \sim \mathcal{D}} \left[ (y_t
    - Q_\theta(s_t, a_t))^2 \right] \tag{543}

    ```


    where \(\mathcal{D}\) denotes the experience replay buffer containing previous
    transitions \((s_t, a_t, r_t, s_{t+1})\). The target \(y_t\) for the Q-values
    is defined as:


    ```

    y_t = r_t + \gamma \max_{a''} Q_{\theta^-}(s_{t+1}, a'') \tag{544}

    ```


    Here, \(\theta^-\) represents the parameters of the target network, which is a
    slowly updated copy of the online network parameters \(\theta\). The target network
    \(Q_{\theta^-}\) is used to generate stable targets for the Q-value updates, and
    its parameters are updated periodically by copying the parameters from the online
    network \(\theta\) after every \(T\) steps. The idea behind this is to stabilize
    the training by preventing rapid changes in the Q-values due to feedback loops
    from the Q-network''s predictions. The update rule for the network parameters
    \(\theta\) follows the gradient descent method and is expressed as:


    ```

    \nabla_\theta L(\theta) = \mathbb{E}_{(s_t, a_t, r_t, s_{t+1}) \sim \mathcal{D}}
    \left[ (y_t - Q_\theta(s_t, a_t)) \nabla_\theta Q_\theta(s_t, a_t) \right] \tag{545}

    ```'
