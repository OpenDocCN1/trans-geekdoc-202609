  md: 'where $a$ is a learnable parameter. Pooling layers are employed in CNNs to
    downsample the spatial dimensions of feature maps, thereby reducing computational
    complexity and the risk of overfitting. Max pooling is defined mathematically
    as


    $P(i, j) = \max_{(m,n)\in\mathcal{R}} S(i + m, j + n), \quad (396)$


    where $\mathcal{R}$ is the pooling region (e.g., $2 \times 2$). Average pooling
    computes the mean value instead:


    $P(i, j) = \frac{1}{|\mathcal{R}|} \sum_{(m,n)\in\mathcal{R}} S(i + m, j + n).
    \quad (397)$


    In medical imaging, CNNs are widely used for image classification tasks such as
    detecting abnormalities (e.g., tumors, fractures, or lesions). Consider a classification
    problem where the input is a mammogram image, and the output is a binary label
    $y \in \{0, 1\}$, indicating benign or malignant. The CNN model outputs a probability
    score $\hat{y}$, computed as


    $\hat{y} = \sigma(z) = \frac{1}{1 + e^{-z}}, \quad (398)$


    where $z$ is the output of the final layer before the sigmoid activation. The
    binary cross-entropy loss function is then used to train the model:


    $\mathcal{L} = -\frac{1}{N} \sum_{i=1}^N [y_i \log(\hat{y}_i) + (1 - y_i) \log(1
    - \hat{y}_i)]. \quad (399)$


    For image segmentation tasks, where the goal is to assign a label to each pixel,
    architectures such as U-Net are commonly used. U-Net employs an encoder-decoder
    structure, where the encoder extracts features through a series of convolutional
    and pooling layers, and the decoder reconstructs the image through upsampling
    and concatenation operations. The objective function for segmentation is often
    the Dice coefficient loss, defined as


    $\mathcal{L}_{\text{Dice}} = 1 - \frac{2 \sum_i p_i g_i}{\sum_i p_i + \sum_i g_i},
    \quad (400)$


    where $p_i$ and $g_i$ are the predicted and ground truth values for pixel $i$,
