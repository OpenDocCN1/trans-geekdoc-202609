  md: '# 13.4 Matrix Calculus


    # 13.4.1 Matrix Differentiation


    Consider a matrix A of size m x n, where A = [a_ij]. For the purposes of differentiation,
    we will focus on functions f(A) that map matrices to scalars or other matrices.
    We aim to compute the derivative of f(A) with respect to A. Let f(A) be a scalar
    function of the matrix A. The derivative of this scalar function with respect
    to A is defined as:


    $$\frac{\partial f(\mathbf{A})}{\partial \mathbf{A}} = \left[ \frac{\partial f(\mathbf{A})}{\partial
    a_{ij}} \right]$$ (685)


    This is a matrix where the (i,j)-th entry is the partial derivative of the scalar
    function with respect to the element a_ij. Let us take an example of Differentiating
    the Frobenius Norm. Consider the Frobenius norm of a matrix A, defined as:


    $$\|\mathbf{A}\|_F = \sqrt{\sum_{i=1}^m \sum_{j=1}^n a_{ij}^2}$$ (686)


    To compute the derivative of \|A\|_F with respect to A, we first apply the chain
    rule:


    $$\frac{\partial \|\mathbf{A}\|_F}{\partial a_{ij}} = \frac{2a_{ij}}{2\|\mathbf{A}\|_F}
    = \frac{a_{ij}}{\|\mathbf{A}\|_F}$$ (687)


    Thus, the gradient of the Frobenius norm is the matrix \frac{\mathbf{A}}{\|\mathbf{A}\|_F}.
    The Matrix Derivatives of Common Functions are as follows:


    +   **Matrix trace**: For a matrix A, the derivative of the trace Tr(A) with respect
    to A is the identity matrix:


    $$\frac{\partial \text{Tr}(\mathbf{A})}{\partial \mathbf{A}} = \mathbf{I}$$ (688)


    +   **Matrix product**: Let A and B be matrices, and consider the product f(A)
    = AB. The derivative of this product with respect to A is:


    $$\frac{\partial (\mathbf{AB})}{\partial \mathbf{A}} = \mathbf{B}^T$$ (689)


    +   **Matrix inverse**: The derivative of the inverse of A with respect to A is:


    $$\frac{\partial (\mathbf{A}^{-1})}{\partial \mathbf{A}} = -\mathbf{A}^{-1} \left(
    \frac{\partial \mathbf{A}}{\partial \mathbf{A}} \right) \mathbf{A}^{-1}$$ (690)


    # 13.4.2 Tensor Differentiation


    A tensor is a multi-dimensional array of components that transform according to
    certain rules under a change of basis. For simplicity, let’s focus on second-order
    tensors (which are matrices in m x n form), but the results can extend to higher-order
    tensors.


    Let T be a tensor, represented by the array of components T_{i_1, i_2, ..., i_k},
    where the indices i_1, i_2, ..., i_k are the dimensions of the tensor. Let f(T)
    be a scalar-valued function that depends on the tensor T. The derivative of this
    function with respect to the tensor components T_{i_1, ..., i_k} is given by:


    $$\frac{\partial f(\mathbf{T})}{\partial T_{i_1, ..., i_k}} = \text{Jacobian of
    } f(\mathbf{T}) \text{ with respect to } T_{i_1, ..., i_k}$$ (691)'
