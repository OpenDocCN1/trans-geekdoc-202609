  md: 'learning algorithms. Ma and Wang (2020) [38] investigated Rademacher complexity
    bounds in deep residual networks. Bartlett and Mendelson (2002) [39] wrote a foundational
    paper on complexity measures, providing fundamental theoretical insights into
    generalization bounds. Dzahini and Wild (2024) [40] in their paper extended Rademacher-based
    complexity to stochastic optimization methods. McDonald and Shalizi (2011) [41]
    showed using sequential Rademacher complexities for I.I.D process how to control
    the generalization error of time series models wherein past values of the outcome
    are used to predict future values.


    Let \((\mathcal{X}, \Sigma, \mathcal{D})\) represent a probability space where
    \(\mathcal{X}\) is a measurable space, \(\Sigma\) is a sigma-algebra, and \(\mathcal{D}\)
    is a probability measure. The function class \(\mathcal{F} \subset L^\infty(\mathcal{X},
    \mathbb{R})\) satisfies:


    \(\sup_{f \in \mathcal{F}} \|f\|_\infty < \infty,\)


    where \(\|f\|_\infty = \text{ess sup}_{x \in \mathcal{X}}|f(x)|\) denotes the
    essential supremum. For rigor, \(\mathcal{F}\) is assumed measurable in the sense
    that for every \(\epsilon > 0\), there exists a countable subset \(\mathcal{F}_\epsilon
    \subseteq \mathcal{F}\) such that:


    \(\sup_{f \in \mathcal{F}} \inf_{g \in \mathcal{F}_\epsilon} \|f - g\|_\infty
    \le \epsilon.\)


    Given \(S = \{x_1, x_2, \dots, x_n\} \sim \mathcal{D}^n\), the empirical measure
    \(\mathbb{P}_n\) is:


    \(\mathbb{P}_n(A) = \frac{1}{n} \sum_{i=1}^n \mathbb{I}_{\{x_i \in A\}}, \quad
    \forall A \in \Sigma.\)


    The integral under \(\mathbb{P}_n\) for \(f \in \mathcal{F}\) approximates the
    population integral under \(\mathcal{D}\):


    \(\mathbb{P}_n[f] = \frac{1}{n} \sum_{i=1}^n f(x_i), \quad \mathcal{D}[f] = \int_{\mathcal{X}}
    f(x) d\mathcal{D}(x).\)


    Let \(\boldsymbol{\sigma} = (\sigma_1, \dots, \sigma_n)\) be independent Rademacher
    random variables:


    \(\mathbb{P}(\sigma_i = +1) = \mathbb{P}(\sigma_i = -1) = \frac{1}{2}, \quad i
    = 1, \dots, n.\)


    These variables are defined on a probability space \((\Omega, \mathcal{A}, \mathbb{P})\)
    independent of the sample \(S\). The Duality and Symmetrization of Empirical Rademacher
    Complexity is also very important. The empirical Rademacher complexity of \(\mathcal{F}\)
    with respect to \(S\) is:


    \(\hat{\mathfrak{R}}_S(\mathcal{F}) = \mathbb{E}_{\boldsymbol{\sigma}} \left[
    \sup_{f \in \mathcal{F}} \frac{1}{n} \sum_{i=1}^n \sigma_i f(x_i) \right],\)


    where \(\mathbb{E}_{\boldsymbol{\sigma}}\) denotes expectation over \(\boldsymbol{\sigma}\).
    The supremum can be interpreted as a functional dual norm in \(L^\infty(\mathcal{X},
    \mathbb{R})\), where \(\mathcal{F}\) is the unit ball. Using the symmetrization
    technique, the Rademacher complexity relates to the deviation of \(\mathbb{P}_n[f]\)
    from \(\mathcal{D}[f]\):



    \(\mathbb{E}_S \sup_{f \in \mathcal{F}} |\mathbb{P}_n[f] - \mathcal{D}[f]| \le
    2 \mathfrak{R}_n(\mathcal{F}),\)


    where:


    \(\mathfrak{R}_n(\mathcal{F}) = \mathbb{E}_S \left[ \hat{\mathfrak{R}}_S(\mathcal{F})
    \right].\)


    This is derived by first symmetrizing the sample and then invoking Jensen''s inequality
    and the independence of \(\boldsymbol{\sigma}\). There are some Complexity Bounds
    that use Covering Numbers and Entropy that need to be discussed. In Metric Entropy,
    we let \(\|\cdot\|_\infty\) be the metric on \(\mathcal{F}\). The covering number
    \(N(\epsilon, \mathcal{F}, \|\cdot\|_\infty)\) satisfies:


    \(N(\epsilon, \mathcal{F}, \|\cdot\|_\infty) = \inf \{m \in \mathbb{N} : \exists
    \{f_1, \dots, f_m\} \subseteq \mathcal{F}, \forall f \in \mathcal{F}, \exists
    i, \|f - f_i\|_\infty \le \epsilon \}.\)'
