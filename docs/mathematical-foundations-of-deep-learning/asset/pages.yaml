  md: 'where $C$ is the number of classes, and $\hat{y}_{i,c} = f(\mathbf{x}_i; \mathbf{W})$
    is the predicted probability that the $i$-th sample belongs to class $c$. The
    gradient of the cross-entropy loss with respect to the predicted probabilities
    $\hat{\mathbf{y}}_i$ is:


    \(\frac{\partial L_{\text{CE}}}{\partial \hat{y}_{i,c}} = \hat{y}_{i,c} - y_{i,c}\)
    (220)


    This gradient facilitates the weight update by adjusting the model''s parameters
    to reduce the difference between the predicted probabilities and the actual class
    labels.


    In neural network training, the optimization process often involves regularization
    techniques to prevent **overfitting**, especially in cases with high-dimensional
    data or deep networks. **L2 regularization** (also known as **Ridge regression**)
    is one common approach, which penalizes large weights by adding a term proportional
    to the squared L2 norm of the weights to the loss function. The regularized loss
    function becomes:


    \(L_{\text{reg}} = L_{\text{MSE}} + \lambda \sum_{j=1}^n W_j^2\) (221)


    where \(\lambda\) is the regularization strength, and \(W_j\) represents the parameters
    of the network. The gradient of the regularized loss with respect to the weights
    is:


    \(\frac{\partial L_{\text{reg}}}{\partial W_j} = \frac{\partial L_{\text{MSE}}}{\partial
    W_j} + 2\lambda W_j\) (222)


    This additional term discourages large values of the weights, reducing the complexity
    of the model and helping it generalize better to unseen data. Another form of
    regularization is **L1 regularization** (or **Lasso regression**), which promotes
    sparsity in the model by adding the L1 norm of the weights to the loss function.
    The L1 regularized loss function is:


    \(L_{\text{reg}} = L_{\text{MSE}} + \lambda \sum_{j=1}^n |W_j|\) (223)


    The gradient of this regularized loss function with respect to the weights is:


    \(\frac{\partial L_{\text{reg}}}{\partial W_j} = \frac{\partial L_{\text{MSE}}}{\partial
    W_j} + \lambda \text{sign}(W_j)\) (224)


    where $\text{sign}(W_j)$ is the sign function, which returns 1 for positive values
    of \(W_j\), -1 for negative values, and 0 for \(W_j = 0\). L1 regularization encourages
    the model to select only a small subset of features by forcing many of the weights
    to exactly zero, thus simplifying the model and promoting interpretability. The
    optimization process for neural networks can be viewed as solving a **non-convex
    optimization problem**, given the highly non-linear activation functions and the
    deep architectures typically used. In this context, **stochastic gradient descent
    (SGD)** is commonly employed to perform the optimization by updating the weights
    based on the gradient computed from a random mini-batch of the data. The update
    rule for SGD can be expressed as:


    \(\mathbf{W} \leftarrow \mathbf{W} - \eta \nabla_{\mathbf{W}} L_{\text{batch}}\)
    (225)


    where \(\nabla_{\mathbf{W}} L_{\text{batch}}\) is the gradient of the loss function
    computed over the mini-batch, and \(\eta\) is the learning rate. Due to the non-convexity
    of the objective function, SGD tends to converge to a **local minimum** or a **saddle
    point**, rather than the global minimum, especially in deep neural networks with
    many layers.


    In summary, the loss function plays a central role in guiding the optimization
    process in neural network training by quantifying the error between the predicted
    and true outputs. Different'
