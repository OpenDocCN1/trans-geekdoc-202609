    || p(\mathbf{z})) \text{ .}\)


    This formulation balances two competing objectives: maximizing the likelihood
    of reconstructing **x** from **z**, and minimizing the divergence between the
    posterior \( q_{\theta_e}(\mathbf{z}|\mathbf{x}) \) and the prior \( p(\mathbf{z})
    \). In order to perform optimization, we need to compute the gradient of the ELBO
    with respect to the parameters \(\theta_e\) and \(\theta_d\). However, since sampling
    from the distribution \( q_{\theta_e}(\mathbf{z}|\mathbf{x}) \) is non-differentiable,
    the **reparameterization trick** is applied. This trick allows us to reparameterize
    the latent variable **z** as:


    \(\mathbf{z} = \mu_{\theta_e}(\mathbf{x}) + \sigma_{\theta_e}(\mathbf{x}) \cdot
    \epsilon \text{ ,}\)


    where \(\epsilon \sim \mathcal{N}(0, I)\) is a standard Gaussian noise vector.
    This enables the backpropagation of gradients through the latent space and allows
    the optimization process to proceed via stochastic gradient descent. In practice,
    the **Monte Carlo method** is used to estimate the expectation in the ELBO. This
    involves drawing \(K\) samples \(\mathbf{z}_k\) from the variational posterior
    \( q_{\theta_e}(\mathbf{z}|\mathbf{x}) \) and approximating the expectation as:


    \(\hat{\mathcal{L}}_{\text{VAE}}(\mathbf{x}) = \frac{1}{K} \sum_{k=1}^K \log p_{\theta_d}(\mathbf{x}|\mathbf{z}_k)
    - \frac{1}{K} \sum_{k=1}^K \log q_{\theta_e}(\mathbf{z}_k|\mathbf{x}) \text{ .}\)


    This approximation allows for efficient optimization, even when the latent space
    is high-dimensional and the exact expectation is computationally prohibitive.
    Thus, the **training process** of a VAE involves the following steps: first, the
    encoder produces a distribution \( q_{\theta_e}(\mathbf{z}|\mathbf{x}) \) for
    each input **x**; then, latent variables **z** are sampled from this distribution;
    finally, the decoder reconstructs the data \(\hat{\mathbf{x}}\) from the latent
    variable **z**. The network is trained to maximize the ELBO, which effectively
    balances the reconstruction loss and the KL divergence term.


