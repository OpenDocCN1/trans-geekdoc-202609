    The Root Mean Squared Propagation (RMSProp) optimizer is a sophisticated variant
    of the gradient descent algorithm that adapts the learning rate for each parameter
    in a non-linear, non-convex optimization problem. The fundamental issue with standard
    gradient descent lies in the constant learning rate \(\eta\), which fails to account
    for the varying magnitudes of the gradients in different directions of the parameter
    space. This lack of adaptation can cause inefficient optimization, where large
    gradients may lead to overshooting and small gradients lead to slow convergence.
    RMSProp addresses this problem by dynamically adjusting the learning rate based
    on the historical gradient magnitudes, offering a more tailored and efficient
    approach. Consider the objective function \(f(\theta)\), where \(\theta \in \mathbb{R}^n\)
    is the vector of parameters that we aim to optimize. Let \(\nabla f(\theta)\)
    denote the gradient of \(f(\theta)\) with respect to \(\theta\), which is a vector
    of partial derivatives:


    ```

    \(\nabla f(\theta) = \left[ \frac{\partial f(\theta)}{\partial \theta_1}, \frac{\partial
    f(\theta)}{\partial \theta_2}, \cdots, \frac{\partial f(\theta)}{\partial \theta_n}
    \right]^T .\) (285)

    ```


    In traditional gradient descent, the update rule for \(\theta\) is:


    ```

    \(\theta_{t+1} = \theta_t - \eta \nabla f(\theta_t),\) (286)

    ```


    where \(\eta\) is the learning rate, a scalar constant. However, this approach
    does not account for the fact that the gradient magnitudes may differ significantly
    along different directions in the parameter space, especially in high-dimensional,
    non-convex functions. The RMSProp optimizer introduces a solution by adapting
    the learning rate for each parameter in proportion to the magnitude of the historical
    gradients. The key modification in RMSProp is the introduction of a running average
    of the squared gradients for each parameter \(\theta_i\), denoted as \(E[g^2]_{i,t}\),
    which captures the cumulative magnitude of the gradients over time. The update
    rule for \(E[g^2]_{i,t}\) is given by the exponential moving average formula:


    ```

    \(E[g^2]_{i,t} = \beta E[g^2]_{i,t-1} + (1 - \beta)g_{i,t}^2,\) (287)

    ```'
