  md: 'The activation function introduces a *non-linearity* into the neuron''s response,
    which is a crucial aspect of neural networks because, without it, the network
    would only be able to perform linear transformations of the input data, limiting
    its ability to approximate complex, real-world functions. The non-linearity introduced
    by $\sigma(z)$ is fundamental because it enables the network to capture intricate
    relationships between the input and output, making neural networks capable of
    solving problems that require hierarchical feature extraction, such as image classification,
    time-series forecasting, and language modeling. The importance of non-linearity
    is most clearly evident when considering the mathematical formulation of a multi-layer
    neural network. For a feed-forward neural network with $L$ layers, the output
    $\hat{y}$ of the network is given by the composition of successive affine transformations
    and activation functions. Let $\mathbf{x}$ denote the input vector, $W_k$ and
    $b_k$ be the weight matrix and bias vector for the $k$-th layer, and $\sigma_k$
    be the activation function for the $k$-th layer. The output of the network is:


    $$\hat{y} = \sigma_L(W_L\sigma_{L-1}(W_{L-1} \cdots \sigma_1(W_1\mathbf{x} + b_1)
    + b_2) + \cdots + b_L). \quad (202)$$


    If $\sigma(z)$ were a linear function, say $\sigma(z) = c \cdot z$ for some constant
    $c$, the composition of such functions would still result in a linear function.
    Specifically, if each $\sigma_k$ were linear, the overall network function would
    simplify to a single linear transformation:


    $$\hat{y} = c_1 \cdot \mathbf{x} + c_2, \quad (203)$$


    where $c_1$ and $c_2$ are constants dependent on the parameters of the network.
    In this case, the network would have no greater expressive power than a simple
    linear regression model, regardless of the number of layers. Thus, the *non-linearity*
    introduced by activation functions allows neural networks to approximate *any
    continuous function*, as guaranteed by the *universal approximation theorem*.
    This theorem states that a feed-forward neural network with at least one hidden
    layer and a sufficiently large number of neurons can approximate any continuous
    function $f(\mathbf{x})$, provided the activation function is non-linear and the
    network has enough capacity.


    Next, consider the mathematical properties that the activation function $\sigma(z)$
    must possess. First, it must be *differentiable* to allow the use of gradient-based
    optimization methods like *backpropagation* for training. Backpropagation relies
    on the *chain rule* of calculus to compute the gradients of the loss function
    $\mathcal{L}$ with respect to the parameters (weights and biases) of the network.
    Suppose $\mathcal{L} = \mathcal{L}(\hat{y}, \mathbf{y})$ is the loss function,
    where $\hat{y}$ is the predicted output of the network and $\mathbf{y}$ is the
    true label. During training, we compute the gradient of $\mathcal{L}$ with respect
    to the weights using the chain rule. Let $a_k = \sigma_k(z_k)$ represent the output
    of the activation function at layer $k$, where $z_k$ is the input to the activation
    function. The gradient of the loss with respect to the weights at layer $k$ is
    given by:


    $$\frac{\partial \mathcal{L}}{\partial W_k} = \frac{\partial \mathcal{L}}{\partial
    a_k} \frac{\partial a_k}{\partial z_k} \frac{\partial z_k}{\partial W_k}. \quad
    (204)$$


    The term $\frac{\partial a_k}{\partial z_k}$ is the *derivative* of the activation
    function, which must exist and be well-defined for gradient-based optimization
    to work effectively. If the activation function is not differentiable, the backpropagation
    algorithm cannot compute the gradients, preventing the training process from proceeding.


    Now consider the specific forms of activation functions commonly used in practice.
    The **sigmoid** activation function is one of the most well-known, defined as:


    $$\sigma(z) = \frac{1}{1 + e^{-z}}. \quad (205)$$


    Its derivative is:


    $$\sigma''(z) = \sigma(z)(1 - \sigma(z)), \quad (206)$$'
