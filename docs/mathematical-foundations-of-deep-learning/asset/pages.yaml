  md: '# 5.2 Feedforward Neural Networks


    Feedforward neural networks (FNNs) are mathematical constructs designed to approximate
    arbitrary mappings \(f : \mathbb{R}^n \rightarrow \mathbb{R}^m\) by composing
    affine transformations and nonlinear activation functions. At their core, these
    networks consist of \(L\) layers, where each layer \(k\) transforms its input
    \(\vec{a}_{k-1} \in \mathbb{R}^{m_{k-1}}\) into an output \(\vec{a}_k \in \mathbb{R}^{m_k}\)
    via the operation


    \(\vec{a}_k = f_k(W_k \vec{a}_{k-1} + \vec{b}_k).\) (186)


    Here, \(W_k \in \mathbb{R}^{m_k \times m_{k-1}}\) represents the weight matrix,
    \(\vec{b}_k \in \mathbb{R}^{m_k}\) is the bias vector, and \(f_k : \mathbb{R}^{m_k}
    \rightarrow \mathbb{R}^{m_k}\) is a component-wise activation function. Formally,
    if we denote the input layer as \(\vec{a}_0 = \vec{x}\), the final output of the
    network, \(\vec{y} \in \mathbb{R}^m\), is given by \(\vec{a}_L = f_L(W_L \vec{a}_{L-1}
    + \vec{b}_L)\). Each transformation in this sequence can be described as \(\vec{z}_k
    = W_k \vec{a}_{k-1} + \vec{b}_k\), followed by the activation \(\vec{a}_k = f_k(\vec{z}_k)\).
    The affine transformation \(\vec{z}_k = W_k \vec{a}_{k-1} + \vec{b}_k\) encapsulates
    the linear combination of inputs with weights \(W_k\) and the addition of biases
    \(\vec{b}_k\). For any two layers \(k\) and \(k+1\), the overall transformation
    can be represented by


    \(\vec{z}_{k+1} = W_{k+1}(W_k \vec{a}_{k-1} + \vec{b}_k) + \vec{b}_{k+1}.\) (187)


    Expanding this, we have


    \(\vec{z}_{k+1} = W_{k+1} W_k \vec{a}_{k-1} + W_{k+1} \vec{b}_k + \vec{b}_{k+1}.\)
    (188)


    Without the nonlinearity introduced by \(f_k\), the network reduces to a single
    affine transformation


    \(\vec{y} = W \vec{x} + \vec{b},\) (189)


    where \(W = W_L W_{L-1} \cdots W_1\) and


    \(\vec{b} = W_L W_{L-1} \cdots W_2 \vec{b}_1 + \cdots + \vec{b}_L.\) (190)


    Thus, the incorporation of nonlinear activation functions is critical, as it enables
    the network to approximate non-linear mappings. Activation functions \(f_k\) are
    applied element-wise to the pre-activation vector \(\vec{z}_k\). The choice of
    activation significantly affects the network''s behavior and training. For example,
    the sigmoid activation \(f(x) = \frac{1}{1+e^{-x}}\) compresses inputs into the
    range \((0, 1)\) and has a derivative given by


    \(f''(x) = f(x)(1 - f(x)).\) (191)


    The hyperbolic tangent activation \(f(x) = \tanh(x) = \frac{e^x - e^{-x}}{e^x
    + e^{-x}}\) maps inputs to \((-1, 1)\) with a derivative


    \(f''(x) = 1 - \tanh^2(x).\) (192)


    The ReLU activation \(f(x) = \max(0, x)\), commonly used in modern networks, has
    a derivative


    \(f''(x) = \begin{cases} 1 & x > 0, \\ 0 & x \le 0. \end{cases}\) (193)


    These derivatives are essential for gradient-based optimization. The objective
    of training a feedforward neural network is to minimize a loss function \(\mathcal{L}\),
    which measures the discrepancy between the predicted outputs \(\vec{y}_i\) and
    the true targets \(\vec{t}_i\) over a dataset \(\{(\vec{x}_i, \vec{t}_i)\}_{i=1}^N\).
    For regression problems, the mean squared error (MSE) is often used, given by


    \(\mathcal{L} = \frac{1}{N} \sum_{i=1}^N \|\vec{y}_i - \vec{t}_i\|^2 = \frac{1}{N}
    \sum_{i=1}^N \sum_{j=1}^m (y_{i,j} - t_{i,j})^2.\) (194)


    In classification tasks, the cross-entropy loss is widely employed, defined as


    \(\mathcal{L} = -\frac{1}{N} \sum_{i=1}^N \sum_{j=1}^m t_{i,j} \log(y_{i,j}),\)
    (195)'
