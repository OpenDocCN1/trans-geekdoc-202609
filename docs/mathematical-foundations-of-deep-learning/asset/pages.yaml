    represents a trade-off between exploiting regions of the input space where the
    objective function is expected to be low and exploring regions where the model''s
    uncertainty is high. Several acquisition functions have been proposed, including
    **Expected Improvement (EI)**, **Probability of Improvement (PI)**, and **Upper
    Confidence Bound (UCB)**. The **Expected Improvement (EI)** acquisition function
    is one of the most widely used and is defined as:


    ```

    \(\text{EI}(\mathbf{x}) = (f_{\text{best}} - \mu(\mathbf{x})) \Phi \left( \frac{f_{\text{best}}
    - \mu(\mathbf{x})}{\sigma(\mathbf{x})} \right) + \sigma(\mathbf{x}) \phi \left(
    \frac{f_{\text{best}} - \mu(\mathbf{x})}{\sigma(\mathbf{x})} \right)\)

    ```


    where $f_{\text{best}}$ is the best observed value of the objective function,
    $\Phi(\cdot)$ and $\phi(\cdot)$ are the cumulative distribution and probability
    density functions of the standard normal distribution, respectively, and $\sigma(\mathbf{x})$
    is the standard deviation at $\mathbf{x}$. The first term measures the potential
    for improvement, weighted by the probability of achieving that improvement, and
    the second term reflects the uncertainty at $\mathbf{x}$, encouraging exploration
    in uncertain regions. The acquisition function is maximized at each iteration
    to select the next point $\mathbf{x}_*$:


    ```

    \(\mathbf{x}_* = \arg \max_{\mathbf{x} \in \mathcal{X}} \text{EI}(\mathbf{x})\)

    ```'
