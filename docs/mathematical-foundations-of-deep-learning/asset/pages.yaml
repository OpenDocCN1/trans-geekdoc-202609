- pgno: 118
  md: '+   - $\mathcal{A}$ is the action space, which represents all possible actions
    the agent can take.

    +   - $P(s''|s,a)$ is the state transition probability, which defines the probability
    of transitioning from state $s$ to state $s''$ under action $a$.

    +   - $r(s,a)$ is the reward function, which defines the immediate reward received
    after taking action $a$ in state $s$.

    +   - \(\gamma \in [0, 1)\) is the discount factor, which determines the importance
    of future rewards.


    The objective in RL is for the agent to learn a policy \(\pi : \mathcal{S} \rightarrow
    \mathcal{A}\) that maximizes its expected _return_ (the cumulative discounted
    reward), which is mathematically expressed as:


    ```

    \(J(\pi) = \mathbb{E}_\pi \left[ \sum_{t=0}^\infty \gamma^t r(s_t, a_t) \right]
    ,\) (550)

    ```


    where $s_t$ denotes the state at time $t$, and $a_t = \pi(s_t)$ is the action
    taken according to the policy $\pi$. The expectation is taken over the agent''s
    interaction with the environment, under the policy $\pi$. The agent seeks to maximize
    this expected return by choosing actions that yield the most reward over time.
    The optimal _value function_ $V^*(s)$ is defined as the maximum expected return
    that can be obtained starting from state $s$, and is governed by the _Bellman
    optimality equation_:


    ```

    \(V^*(s) = \max_a \mathbb{E} \left[ r(s, a) + \gamma V^*(s'') \right] ,\) (551)

    ```


    where $s''$ is the next state, and the expectation is taken with respect to the
    transition dynamics $P(s''|s,a)$. The _action-value function_ $Q^*(s,a)$ represents
    the maximum expected return from taking action $a$ in state $s$, and then following
    the optimal policy. It satisfies the Bellman optimality equation for $Q^*(s,a)$:


    ```

    \(Q^*(s,a) = \mathbb{E} \left[ r(s,a) + \gamma \max_{a''} Q^*(s'',a'') \right]
    ,\) (552)

    ```


    where $a''$ is the next action to be taken, and the expectation is again over
    the state transition probabilities. These Bellman equations form the basis of
    many RL algorithms, which iteratively approximate the value functions to learn
    an optimal policy. To solve these equations, one of the most widely used methods
    is _Q-learning_, an off-policy, model-free RL algorithm. Q-learning iteratively
    updates the action-value function $Q(s,a)$ according to the following rule:


    ```

    \(Q(s_t, a_t) \leftarrow Q(s_t, a_t) + \alpha \left[ r(s_t, a_t) + \gamma \max_{a''}
    Q(s_{t+1}, a'') - Q(s_t, a_t) \right] ,\) (553)

    ```


    where \(\alpha\) is the learning rate that controls the step size of updates,
    and \(\gamma\) is the discount factor. The key idea behind Q-learning is that
    the agent learns the optimal action-value function \(Q^*(s, a)\) without needing
    a model of the environment. The agent improves its action-value estimates over
    time by interacting with the environment and receiving feedback (rewards). The
    iterative nature of this update ensures convergence to the optimal \(Q^*\), under
    the condition that all state-action pairs are visited infinitely often and \(\alpha\)
    is decayed appropriately. _Policy Gradient_ methods, in contrast, directly optimize
    the policy \(\pi_\theta\), which is parameterized by a vector \(\theta\). These
    methods are useful in high-dimensional or continuous action spaces where action-value
    methods may struggle. The objective in policy gradient methods is to maximize
    the expected return, \(J(\pi_\theta)\), which is given by:


    ```

    \(J(\pi_\theta) = \mathbb{E}_{s_t,a_t\sim\pi_\theta} \left[ \sum_{t=0}^\infty
    \gamma^t r(s_t, a_t) \right] .\) (554)

    ```


    The policy is updated using the _gradient ascent_ method, and the gradient of
    the expected return with respect to \(\theta\) is computed as:


    ```

    \(\nabla_\theta J(\pi_\theta) = \mathbb{E}_{s_t,a_t\sim\pi_\theta} \left[ \nabla_\theta
    \log \pi_\theta(a_t|s_t)Q(s_t, a_t) \right] ,\) (555)

    ```'
