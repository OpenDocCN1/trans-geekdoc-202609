    fully connected layers are computed by:


    $$\frac{\partial \mathcal{L}}{\partial \mathbf{W}^{(l)}} = \mathbf{a}^{(l-1)}
    \cdot \frac{\partial \mathcal{L}}{\partial \mathbf{z}^{(l)}}$$ (367)


    Once the gradients are computed, the weights are updated using an optimization
    algorithm like **gradient descent**:


    $$\mathbf{W}^{(l)} \leftarrow \mathbf{W}^{(l)} - \eta \frac{\partial \mathcal{L}}{\partial
    \mathbf{W}^{(l)}}$$ (368)


    where $\eta$ is the learning rate. This optimization ensures that the network''s
    parameters are adjusted in the direction of the negative gradient, minimizing
    the loss function and thereby improving the performance of the CNN. Regularization
    techniques are commonly applied to avoid overfitting. **Dropout**, for instance,
    randomly deactivates a subset of neurons during training, preventing the network
    from becoming too reliant on any specific feature and promoting better generalization.
    The dropout operation at a given layer $l$ with dropout rate $p$ is defined as:


    $$\mathbf{a}^{(l)} \sim \text{Dropout}(\mathbf{a}^{(l)}, p)$$ (369)


    where the activations $\mathbf{a}^{(l)}$ are randomly set to zero with probability
    $p$, and the remaining activations are scaled by $\frac{1}{1-p}$. Another regularization
    technique is **batch normalization**, which normalizes the inputs of each layer
    to have zero mean and unit variance, thus improving training speed and stability.
    Mathematically, batch normalization is defined as:


    $$\hat{x} = \frac{x - \mu_B}{\sigma_B}, \quad \mathbf{y} = \gamma \hat{x} + \beta$$
    (370)'
