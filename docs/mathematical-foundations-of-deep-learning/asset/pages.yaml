    \lambda_i| < 1\), which constrains the learning rate \(\eta\) relative to the
    spectrum of \(H(\theta_0)\). For eigenvalues \(\lambda_i\) with large magnitudes,
    excessively large learning rates \(\eta\) can cause oscillatory or divergent updates.


    In the Neural Tangent Kernel (NTK) regime, the evolution of a neural network during
    training can be approximated by a linearization of the network output around the
    initialization. Let \(f_\theta(x)\) denote the output of the network for input
    \(x\). Linearizing \(f_\theta(x)\) around \(\theta_0\) gives:


    \( f_\theta(x) \approx f_{\theta_0}(x) + \nabla_\theta f_{\theta_0}(x)^\top (\theta
    - \theta_0) . \quad (117) \)


    The NTK, defined as:


    \( K(x, x'') = \nabla_\theta f_{\theta_0}(x)^\top \nabla_\theta f_{\theta_0}(x'')
    , \quad (118) \)


