    # ## 6.1 Backpropagation Algorithm


    Consider a neural network with \( L \) layers, where each layer \( l \) (with
    \( l = 1, 2, \dots, L \)) consists of a weight matrix \( \mathbf{W}^{(l)} \in
    \mathbb{R}^{n_l \times n_{l-1}} \), a bias vector \( \mathbf{b}^{(l)} \in \mathbb{R}^{n_l}
    \), and an activation function \( \sigma^{(l)} \) which is applied element-wise.
    The network takes as input a vector \( x^{(i)} \in \mathbb{R}^{n_0} \) for the
    \( i \)-th training sample, where \( n_0 \) is the number of input features, and
    propagates it through the layers to produce an output \( \hat{y}^{(i)} \in \mathbb{R}^{n_L}
    \), where \( n_L \) is the number of output units. The network parameters (weights
    and biases) \( \theta = \{\mathbf{W}^{(l)}, \mathbf{b}^{(l)}\}_{l=1}^L \) are
    to be optimized to minimize a loss function that captures the error between the
    predicted output \( \hat{y}^{(i)} \) and the true target \( y^{(i)} \) for all
    training examples. For each training sample, we define the loss function \( \mathcal{L}(\hat{y}^{(i)},
    y^{(i)}) \) as the squared error:


    ```

    \(\mathcal{L}(\hat{y}^{(i)}, y^{(i)}) = \frac{1}{2} \|\hat{y}^{(i)} - y^{(i)}\|_2^2,
    \quad (226)\)

    ```


    where \( \| \cdot \|_2 \) represents the Euclidean norm. The total loss \( J(\theta)
    \) for the entire dataset is the average of the individual losses:


    ```

    \(J(\theta) = \frac{1}{N} \sum_{i=1}^N \mathcal{L}(\hat{y}^{(i)}, y^{(i)}), \quad
    (227)\)

    ```


    where \( N \) is the number of training samples. For squared error loss, we can
    write:


    ```

    \(J(\theta) = \frac{1}{2N} \sum_{i=1}^N \|\hat{y}^{(i)} - y^{(i)}\|_2^2. \quad
    (228)\)

    ```'
