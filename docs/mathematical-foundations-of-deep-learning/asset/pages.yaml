    ```

    $$L_{\text{cls}} = -\sum_{i=1}^{N} \sum_{c=1}^{C} y_{i,c} \log(p_{i,c}),$$ (410)

    ```


    where \(y_{i,c}\) is a binary indicator for whether the object at index \(i\)
