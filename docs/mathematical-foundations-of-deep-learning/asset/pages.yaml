    to \(f_\theta(x_i)\). The dynamics can be expressed in matrix form as:


    \(\frac{\partial F(t)}{\partial t} = -\frac{1}{n} \Theta(\theta_0) \nabla_F \mathcal{L}(F),\)
    \tag{130}


    where \(\Theta(\theta_0) \in \mathbb{R}^{n \times n}\) is the NTK matrix evaluated
