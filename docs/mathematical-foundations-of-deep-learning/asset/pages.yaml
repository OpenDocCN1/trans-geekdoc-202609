- pgno: 116
  md: 'where \nabla_\theta Q_\theta(s_t, a_t) is the gradient of the Q-function with
    respect to the parameters \theta, which is computed using backpropagation through
    the neural network. This gradient is used to update the parameters of the Q-network
    to minimize the loss function. In reinforcement learning, the agent must balance
    exploration (trying new actions) and exploitation (selecting actions that maximize
    the reward). This is often handled by using an epsilon-greedy policy, where the
    agent selects a random action with probability \epsilon and the action with the
    highest Q-value with probability 1 - \epsilon. The epsilon value is decayed over
    time to ensure that, as the agent learns, it shifts from exploration to more exploitation.
    The epsilon-greedy action selection rule is given by:


    a_t = \begin{cases} \text{random action}, & \text{with probability } \epsilon
    \\ \arg \max_a Q_\theta(s_t, a), & \text{with probability } 1 - \epsilon \end{cases}
    (546)


    This policy encourages the agent to explore different actions at the beginning
    of training and gradually exploit the learned Q-values as training progresses.
    The decay of \epsilon typically follows an annealing schedule to balance exploration
    and exploitation effectively. A critical component in stabilizing training in
    Deep Q-Learning is the use of experience replay. In standard Q-learning, the updates
    are based on consecutive transitions, which can lead to high correlations between
    consecutive data points. This correlation can slow down learning or even lead
    to instability. Experience replay addresses this issue by storing a buffer of
    past experiences and sampling random mini-batches from this buffer during training.
    This breaks the correlation between consecutive samples and results in more stable
    and efficient updates. Mathematically, the loss function for training the network
    involves random sampling of transitions (s_t, a_t, r_t, s_{t+1}) from the experience
    replay buffer \mathcal{D}, and the update to the Q-values is computed using the
    Bellman error based on the sampled experiences:


    L(\theta) = \mathbb{E}_{(s_t, a_t, r_t, s_{t+1}) \sim \mathcal{D}} \left[ \left(
    r_t + \gamma \max_{a''} Q_{\theta^-}(s_{t+1}, a'') - Q_\theta(s_t, a_t) \right)^2
    \right] (547)


    This method ensures that the Q-values are updated in a way that is less sensitive
    to the order in which experiences are observed, promoting more stable learning
    dynamics.


    Despite its success, the DQL algorithm can still suffer from certain issues such
    as overestimation bias and instability due to the maximization step in the Bellman
    equation. Overestimation bias occurs because the maximization operation \max_{a''}
    Q_{\theta^-}(s_{t+1}, a'') tends to overestimate the true value, as the Q-values
    are updated based on the same Q-network. To address this, Double Q-learning was
    introduced, which uses two separate Q-networks for action selection and value
    estimation, reducing overestimation bias. In Double Q-learning, the target Q-value
    is computed using the following equation:


    y_t = r_t + \gamma Q_{\theta^-} \left( s_{t+1}, \arg \max_{a''} Q_\theta(s_{t+1},
    a'') \right) (548)


    This approach helps to mitigate the overestimation problem by decoupling the action
    selection from the Q-value estimation process. The value of \arg \max is taken
    from the online network Q_\theta, while the Q-value for the next state is estimated
    using the target network Q_{\theta^-}. Another extension to improve the DQL framework
    is Dueling Q-Learning, which decomposes the Q-function into two separate components:
    the state value function V_\theta(s) and the advantage function A_\theta(s, a).
    The Q-function is then expressed as:


    Q_\theta(s, a) = V_\theta(s) + A_\theta(s, a) (549)


    This decomposition allows the agent to learn the value of a state V_\theta(s)
    independently of the specific actions, thus reducing the number of parameters
    needed for learning. This is particularly beneficial in environments where many
    actions have similar expected rewards, as it enables the agent to focus on identifying
    the value of states rather than overfitting to individual actions.'
