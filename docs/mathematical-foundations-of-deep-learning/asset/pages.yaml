  md: 'The gradients for weight and bias updates are then computed as


    $$

    \frac{\partial \mathcal{L}}{\partial W^{(l)}} = \delta^{(l)}(a^{(l-1)})^\top

    $$ (246)


    and


    $$

    \frac{\partial \mathcal{L}}{\partial b^{(l)}} = \delta^{(l)},

    $$ (247)


    respectively. The dynamics of gradient descent are deeply influenced by the curvature
    of the loss surface, encapsulated by the Hessian matrix


    $$

    H(\theta) = \nabla_\theta^2 \mathcal{L}(\theta).

    $$ (248)


    For a small step size \(\eta\), the change in the loss function can be approximated
    as


    $$

    \Delta \mathcal{L} \approx -\eta \| \nabla_\theta \mathcal{L}(\theta) \|^2 + \frac{\eta^2}{2}
    (\nabla_\theta \mathcal{L}(\theta))^\top H(\theta) \nabla_\theta \mathcal{L}(\theta).

    $$ (249)


    This reveals that convergence is determined not only by the gradient magnitude
    but also by the curvature of the loss surface along the gradient direction. The
    eigenvalues \(\lambda_1, \lambda_2, \dots, \lambda_d\) of \(H(\theta)\) dictate
    the local geometry, with large condition numbers \(\kappa = \frac{\lambda_{max}}{\lambda_{min}}\)
    slowing convergence due to ill-conditioning. Stochastic gradient descent (SGD)
    modifies the standard gradient descent by computing updates based on a single
    data sample \((x_i, y_i)\), leading to


    $$

    \theta^{(k+1)} = \theta^{(k)} - \eta \nabla_\theta \ell(\theta; x_i, y_i).

    $$ (250)


    While SGD introduces variance into the updates, this stochasticity helps escape
    saddle points characterized by zero gradient but mixed curvature. To balance computational
    efficiency and stability, mini-batch SGD computes gradients over a randomly selected
    subset \(\mathcal{B} \subset \{1, \dots, N\}\) of size \(|\mathcal{B}|\), yielding


    $$

    \nabla_\theta \mathcal{L}_\mathcal{B}(\theta) = \frac{1}{|\mathcal{B}|} \sum_{i
    \in \mathcal{B}} \nabla_\theta \ell(\theta; x_i, y_i).

    $$ (251)


    Momentum methods enhance convergence by incorporating a memory of past gradients.
    The velocity term


    $$

    v^{(k+1)} = \gamma v^{(k)} + \eta \nabla_\theta \mathcal{L}(\theta)

    $$ (252)


    accumulates gradient information, and the parameter update is


    $$

    \theta^{(k+1)} = \theta^{(k)} - v^{(k+1)}.

    $$ (253)


    Analyzing momentum in the eigenspace of \(H(\theta)\), with \(H = Q \Lambda Q^\top\),
    reveals that the effective step size in each eigendirection is


    $$

    \eta_{\text{eff}, i} = \frac{\eta}{1 - \gamma \lambda_i},

    $$ (254)


    showing that momentum accelerates convergence in low-curvature directions while
    damping oscillations in high-curvature directions. Adaptive gradient methods,
    such as AdaGrad, RMSProp, and Adam, refine learning rates for individual parameters.
    In AdaGrad, the adaptive learning rate is


    $$

    \eta_i^{(k+1)} = \frac{\eta}{\sqrt{G_{ii}^{(k+1)} + \epsilon}},

    $$ (255)


    where


    $$

    G_{ii}^{(k+1)} = G_{ii}^{(k)} + (\nabla_{\theta_i} \mathcal{L}(\theta))^2.

    $$ (256)


    RMSProp modifies this with an exponentially weighted average


    $$

    G_{ii}^{(k+1)} = \beta G_{ii}^{(k)} + (1 - \beta) (\nabla_{\theta_i} \mathcal{L}(\theta))^2.

    $$ (257)'
