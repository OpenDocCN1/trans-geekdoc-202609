  md: 'SGD converges to the optimal solution at a rate of:


    \(\mathbb{E}[f(\mathbf{x}_k) - f(\mathbf{x}^*)] \le \frac{C}{k},\quad (681)\)


    where \(C\) is a constant depending on the step size \(\eta\), the variance of
    the stochastic gradients, and the strong convexity constant \(m\). This slower
    convergence rate is due to the inherent noise in the gradient estimates. Variance
    reduction techniques such as **mini-batch SGD** (using multiple data points per
    iteration) or **Momentum** (accumulating past gradients) are often employed to
    improve convergence speed and stability.


    # 13.3.3 Second-Order Methods


    Second-order methods make use of not just the gradient \(\nabla f(\mathbf{x})\),
    but also the **Hessian matrix** \(\mathbf{H}(\mathbf{x}) = \nabla^2 f(\mathbf{x})\),
    which is the matrix of second-order partial derivatives of the objective function.
    The update rule for second-order methods is:


    \(\mathbf{x}_{k+1} = \mathbf{x}_k - \eta \mathbf{H}^{-1}(\mathbf{x}_k) \nabla
    f(\mathbf{x}_k),\quad (682)\)


    where \(\mathbf{H}^{-1}(\mathbf{x}_k)\) is the inverse of the Hessian matrix.


    Second-order methods typically have faster convergence rates compared to gradient
    descent, particularly when the function \(f\) has well-conditioned curvature.
    However, computing the Hessian is computationally expensive, which limits the
    scalability of these methods. Newton''s method is a widely used second-order optimization
    technique that uses both the gradient and the Hessian. The update rule is given
    by:


    \(\mathbf{x}_{k+1} = \mathbf{x}_k - \eta \mathbf{H}^{-1}(\mathbf{x}_k) \nabla
    f(\mathbf{x}_k).\quad (683)\)


    Newton''s method converges quadratically near the optimal point under the assumption
    that the objective function is twice continuously differentiable and the Hessian
    is positive definite. More formally, if \(\mathbf{x}_k\) is sufficiently close
    to the optimal point \(\mathbf{x}^*\), then the error \(\|\mathbf{x}_k - \mathbf{x}^*\|\)
    decreases quadratically:


    \(\|\mathbf{x}_{k+1} - \mathbf{x}^*\| \le C \|\mathbf{x}_k - \mathbf{x}^*\|^2,\quad
    (684)\)


    where \(C\) is a constant depending on the condition number of the Hessian.


    Since directly computing the Hessian is expensive, quasi-Newton methods aim to
    approximate the inverse Hessian at each iteration. One of the most popular quasi-Newton
    methods is the **Broyden–Fletcher–Goldfarb–Shanno (BFGS)** method, which maintains
    an approximation to the inverse Hessian, updating it at each iteration. The Summary
    of what we discussed above are as follows:


    +   - **Gradient Descent (GD)**: An optimization algorithm that updates the parameter
    vector in the direction opposite to the gradient of the objective function. Convergence
    is guaranteed under convexity assumptions with an appropriately chosen step size.

    +   - **Stochastic Gradient Descent (SGD)**: A variant of GD that uses a random
    subset of the data to estimate the gradient at each iteration. While faster and
    less computationally intensive, its convergence is slower and more noisy, requiring
    variance reduction techniques for efficient training.

    +   - **Second-Order Methods**: These methods use the Hessian (second derivatives
    of the objective function) to accelerate convergence, often exhibiting quadratic
    convergence near the optimum. However, the computational cost of calculating the
    Hessian restricts their practical use. Quasi-Newton methods, such as BFGS, approximate
    the Hessian to improve efficiency.


    Each of these methods has its advantages and trade-offs, with gradient-based methods
    being widely used due to their simplicity and efficiency, and second-order methods
    providing faster convergence but at higher computational costs.'
