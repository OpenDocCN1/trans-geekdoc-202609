    some performance metric of a machine learning model (e.g., accuracy, error, or
    loss) evaluated at specific hyperparameter configurations. The goal of Bayesian
    Optimization is to find the hyperparameter setting $\mathbf{x}^* \in \mathcal{X}$
    that minimizes (or maximizes) the objective function, such that:


    ```

    $$\mathbf{x}^* = \arg \min_{\mathbf{x} \in \mathcal{X}} f(\mathbf{x})$$ (349)

    ```


