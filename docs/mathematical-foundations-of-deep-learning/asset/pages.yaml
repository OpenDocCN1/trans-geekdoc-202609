    $\mu(\mathbf{x}_*)$ provides the model''s best guess for the value of the function
    at $\mathbf{x}_*$, and $\sigma^2(\mathbf{x}_*)$ quantifies the uncertainty associated
    with this estimate.


    In Bayesian Optimization, the central objective is to select the next hyperparameter
    setting $\mathbf{x}_*$ to evaluate in such a way that the number of function evaluations
    is minimized while still making progress toward the global optimum. This is achieved
