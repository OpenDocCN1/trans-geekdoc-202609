- pgno: 84
  md: 'into generating region proposals and classifying these regions. Region Proposal
    Networks (RPNs) are employed to generate candidate regions \( r_1, r_2, \dots,
    r_n \), which are then passed through the network to obtain their feature representations.
    The bounding box refinement and classification for each proposal are then performed
    by a fully connected layer. The loss function for R-CNNs combines both classification
    and bounding box regression losses for each proposal, and the objective is to
    minimize:


    \(\mathcal{L}_{\text{R-CNN}} = \mathcal{L}_{\text{cls}} + \mathcal{L}_{\text{bbbox}}\)
    (388)


    Another popular architecture, YOLO (You Only Look Once), frames object detection
    as a single regression task. The image is divided into a grid of \( S \times S
    \) cells, where each cell predicts the class probabilities and bounding box parameters.
    The output vector for each cell consists of:


    \(\hat{y}_i = (x, y, w, h, c, P_1, P_2, \dots, P_k)\) (389)


    where \( (x, y) \) are the coordinates of the bounding box center, \( w \) and
    \( h \) are the dimensions of the box, \( c \) is the confidence score, and \(
    P_1, P_2, \dots, P_k \) are the class probabilities. The total loss for YOLO combines
    the classification loss, bounding box regression loss, and confidence loss, which
    can be written as:


    \(\mathcal{L}_{\text{YOLO}} = \mathcal{L}_{\text{cls}} + \mathcal{L}_{\text{bbox}}
    + \mathcal{L}_{\text{conf}}\) (390)


    where \( \mathcal{L}_{\text{cls}} \) is the classification loss, \( \mathcal{L}_{\text{bbox}}
    \) is the bounding box regression loss, and \( \mathcal{L}_{\text{conf}} \) is
    the confidence loss, which penalizes predictions with low confidence. This approach
    allows YOLO to make object detection predictions in a single pass through the
    network, enabling faster inference. The Single Shot Multibox Detector (SSD) improves
    on YOLO by generating bounding boxes at multiple feature scales, which allows
    for detecting objects of varying sizes. The loss function for SSD is similar to
    that of YOLO, comprising the classification loss and bounding box localization
    loss, given by:


    \(\mathcal{L}_{\text{SSD}} = \mathcal{L}_{\text{cls}} + \mathcal{L}_{\text{loc}}\)
    (391)


    where \( \mathcal{L}_{\text{cls}} \) is the classification loss, and \( \mathcal{L}_{\text{loc}}
    \) is the smooth \( L_1 \) loss for bounding box regression. This multi-scale
    approach enhances the network''s ability to detect objects at different levels
    of resolution, improving its robustness to objects of different sizes.


    Thus, object detection in CNNs involves a sophisticated architecture of convolution,
    activation, pooling, and multi-stage loss functions that guide the network in
    accurately detecting and localizing objects in an image. The choice of architecture
    and loss function plays a critical role in the performance and efficiency of the
    detection system, with modern architectures like R-CNN, YOLO, and SSD each offering
    distinct advantages depending on the application requirements.


    # 7.3 Real-World Applications


    # 7.3.1 Medical Imaging


    **Literature Review:** Yousif et. al. (2024) [205] applied CNNs for melanoma skin
    cancer detection, integrating a Binary Grey Wolf Optimization (GWO) algorithm
    to enhance feature selection. It demonstrates the effectiveness of deep learning
    in classifying dermatoscopic images and highlights feature extraction techniques
    for accurate classification. Rahman et. al. (2025) [206] gave a systematic review
    that covers CNN-based leukemia detection using medical imaging. The study compares
    different deep learning architectures such as ResNet, VGG, and EfficientNet, providing
    a benchmark for future studies. Joshi and Gowda (2025) [207] introduced an attention-guided
    Graph CNN (VSA-GCNN) for brain tumor segmentation and classification. It leverages
    spatial relationships within MRI scans to improve diagnostic accuracy. The use
    of graph neural networks (GNNs) combined with CNNs is a novel approach in medical
    imaging. Ng et al. (2025) [208] developed a CNN-based cardiac MRI analysis model
    to predict ischemic cardiomyopathy without'
