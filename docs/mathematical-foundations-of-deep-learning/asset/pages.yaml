    An **Autoencoder (AE)** is an unsupervised learning model that attempts to learn
    a compact representation of the input data $\mathbf{x} \in \mathbb{R}^d$ in a
    lower-dimensional latent space. This model consists of two primary components:
    an encoder function $f_{\theta_e}$ and a decoder function $f_{\theta_d}$. The
    encoder $f_{\theta_e} : \mathbb{R}^d \rightarrow \mathbb{R}^l$ maps the input
    data $\mathbf{x}$ to a latent code $\mathbf{z}$, where $l \ll d$, representing
    the compressed information. The decoder $f_{\theta_d} : \mathbb{R}^l \rightarrow
    \mathbb{R}^d$ then reconstructs the input from this latent code, producing an
    approximation $\hat{\mathbf{x}}$. The loss function typically used to train the
    autoencoder is the reconstruction loss, often formulated as the Mean Squared Error
    (MSE):


    $$\mathcal{L}(\mathbf{x}, \hat{\mathbf{x}}) = \|\mathbf{x} - \hat{\mathbf{x}}\|_2^2.$$

    (518)


    The optimization procedure seeks to minimize the reconstruction error over the
    dataset $D$, assuming a distribution $p(\mathbf{x})$ over the input data $\mathbf{x}$.
    The objective is to learn the optimal parameters $\theta_e$ and $\theta_d$, by
    solving the following optimization problem:


    $$\min_{\theta_e, \theta_d} \mathbb{E}_{\mathbf{x} \sim p(\mathbf{x})} \left[
    \|\mathbf{x} - f_{\theta_d}(f_{\theta_e}(\mathbf{x}))\|_2^2 \right] .$$

    (519)


    This formulation drives the encoder-decoder architecture towards learning a latent
    representation that preserves key features of the input data, allowing it to be
    efficiently reconstructed. The solution to this problem is typically pursued via
    **stochastic gradient descent (SGD)**, where gradients of the loss with respect
    to the model parameters are computed and backpropagated through the network. In
    contrast to the deterministic autoencoder, the **Variational Autoencoder (VAE)**
    introduces a probabilistic model to better capture the distribution of the latent
    variables. A VAE models the data generation process using a latent variable $\mathbf{z}
    \in \mathbb{R}^l$, and aims to maximize the likelihood of observing the data $\mathbf{x}$
    by integrating over all possible latent variables. Specifically, we have the joint
    distribution:


    $$p(\mathbf{x}, \mathbf{z}) = p(\mathbf{x}|\mathbf{z})p(\mathbf{z}),$$

    (520)


    where $p(\mathbf{x}|\mathbf{z})$ is the likelihood of the data given the latent
    variables, and $p(\mathbf{z})$ is the prior distribution of the latent variables,
    typically chosen to be a standard Gaussian $\mathcal{N}(\mathbf{z}; \mathbf{0},
    I)$. The prior assumption that $p(\mathbf{z}) = \mathcal{N}(0, I)$ simplifies
    the modeling, as it imposes no particular structure on the latent space, which
    allows for flexible modeling of the data distribution. The encoder in a VAE outputs
    a distribution $q_{\theta_e}(\mathbf{z}|\mathbf{x})$ over the latent variables,
    typically modeled as a multivariate Gaussian with mean $\mu_{\theta_e}(\mathbf{x})$
    and variance $\sigma_{\theta_e}(\mathbf{x})$, i.e. $q_{\theta_e}(\mathbf{z}|\mathbf{x})
