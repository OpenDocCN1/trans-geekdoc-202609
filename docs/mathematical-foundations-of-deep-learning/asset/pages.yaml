    In the context of neural networks, this result establishes the theoretical universality
    of function approximation. A neural network with a single hidden layer approximates
    a function \(f(x_1, x_2, \dots, x_n)\) by representing it as


    \(f(x_1, x_2, \dots, x_n) \approx \sum_{i=1}^{W} a_i \sigma \left( \sum_{j=1}^{n}
    w_{ij} x_j + b_i \right), \tag{77}\)


    where \(W\) is the width of the hidden layer, \(\sigma\) is a nonlinear activation
    function, \(w_{ij}\) are weights, \(b_i\) are biases, and \(a_i\) are output weights.
    The expressive power of such shallow networks depends critically on the width
    \(W\), as the universal approximation theorem ensures that \(W \to \infty\) suffices
    to approximate any continuous function arbitrarily well. However, for a fixed
    approximation error \(\epsilon > 0\), the required width grows exponentially with
    the input dimension \(n\), satisfying a lower bound of


    \(W \ge C \cdot \epsilon^{-n}, \tag{78}\)


    where \(C\) depends on the function''s Lipschitz constant. This exponential dependence,
    sometimes called the "curse of dimensionality," underscores the inefficiency of
    shallow architectures in capturing high-dimensional dependencies.'
