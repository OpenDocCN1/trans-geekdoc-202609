    The mathematical expectation of the loss function with respect to the dropout
    mask $r$ can be written as:


    $$ \mathbb{E}_r[L_{\text{dropout}}(\theta, r)] = \frac{1}{N} \sum_{i=1}^N \mathcal{L}(f_\theta(x_i,
    r), y_i) $$ (304)


    where $f_\theta(x_i, r)$ is the output of the network with the dropout mask $r$.
    Since the dropout mask is random, the loss is an expectation over all possible
    configurations of dropout masks. This randomness induces an implicit *ensemble
    effect*, where the model is trained not just on a single set of parameters $\theta$,
    but effectively on a *distribution* of models, each corresponding to a different
    dropout configuration. The model is, therefore, regularized because the network
    is forced to generalize across these different subnetworks, and overfitting to
    the training data is prevented. One way to gain deeper insight into dropout is
    to consider its connection with *Bayesian inference*. In the context of deep learning,
    dropout can be viewed as an approximation to *Bayesian posterior inference*. In
    Bayesian terms, we seek the posterior distribution of the network''s parameters
    $\theta$, given the data $D$, which can be written as:


    $$ p(\theta|D) = \frac{p(D|\theta)p(\theta)}{p(D)} $$ (305)


    where $p(D|\theta)$ is the likelihood of the data given the parameters, $p(\theta)$
    is the prior distribution over the parameters, and $p(D)$ is the marginal likelihood
    of the data. Dropout approximates this posterior by averaging over the outputs
    of many different subnetworks, each corresponding to a different dropout configuration.
    This interpretation is formalized by observing that each forward pass with a different
    dropout mask corresponds to a different realization of the model, and averaging
    over all dropout masks gives an approximation to the Bayesian posterior. Thus,
    the expected output of the network, given the data $x$, under dropout is:


    $$ \mathbb{E}_r[f_\theta(x)] = \frac{1}{M} \sum_{i=1}^M f_\theta(x, r_i) $$ (306)


    where $r_i$ is a dropout mask drawn from the Bernoulli distribution and $M$ is
    the number of Monte Carlo samples of dropout configurations. This expectation
    can be interpreted as a form of *ensemble averaging*, where each individual forward
    pass corresponds to a different model sampled from the posterior.


    Dropout is also highly effective because it controls the *bias-variance tradeoff*.
    The bias-variance tradeoff is a fundamental concept in statistical learning, where
    increasing model complexity reduces bias but increases variance, and vice versa.
    A highly complex model tends to have low bias but high variance, meaning it fits
    the training data very well but fails to generalize to new data. Regularization
    techniques, such as dropout, seek to reduce variance without increasing bias excessively.
    Dropout achieves this by introducing stochasticity in the learning process. By
    randomly deactivating neurons during training, the model is forced to learn *robust
    features* that do not depend on the presence of specific neurons. In mathematical
    terms, the variance of the model''s output can be expressed as:


