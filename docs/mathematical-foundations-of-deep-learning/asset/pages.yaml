  md: '(GRU) networks, encodes the source sequence $S$ into hidden states. The hidden
    state at time step $t$ is computed recursively, based on the input $x_t$ (the
    source word representation at time step $t$) and the previous hidden state $h_{t-1}$:


    $$h_t = f(h_{t-1}, x_t)$$ (573)


    where $f$ represents the update function, which is often parameterized as a non-linear
    function, such as a sigmoid or tanh. This recursion generates a sequence of hidden
    states $\{h_1, h_2, \dots, h_T\}$, each encoding the relevant information of the
    source sentence. In this model, the decoder generates the target sequence one
    token at a time by conditioning on the previous tokens $t_{<i}$ and the context
    vector $c$, which is typically the last hidden state from the encoder. The conditional
    probability of generating the next target word is given by:


    $$P(t_i \mid t_{<i}, S) = \text{softmax}(W h_t)$$ (574)


    where $W$ is a learned weight matrix, and $h_t$ is the hidden state of the decoder
    at time step $t$. The softmax function converts the output of the network into
    a probability distribution over the vocabulary, and the word with the highest
    probability is chosen as the next target word.


    A significant improvement to Seq2Seq was introduced through the attention mechanism.
    This allows the decoder to dynamically focus on different parts of the source
    sentence during translation, instead of relying on a single fixed-length context
    vector. The attention mechanism computes a set of attention weights $\alpha_{t,i}$
    for each source word, which are used to compute a weighted sum of the encoder''s
    hidden states to form a dynamic context vector $c_t$. The attention weight $\alpha_{t,i}$
    for time step $t$ in the decoder and source word $i$ is calculated as:


    $$

    \alpha_{t,i} = \frac{\exp(e_{t,i})}{\sum_{k=1}^T \exp(e_{t,k})}

    $$ (575)


    where $e_{t,i} = \text{score}(h_t, h_i)$ is a learned scoring function, which
    can be modeled as:


    $$e_{t,i} = \vec{v}^T \tanh(W_1 h_t + W_2 h_i)$$ (576)


    This attention mechanism allows the model to adaptively focus on relevant parts
    of the source sentence while generating each word in the target sentence, thus
    overcoming the limitations of fixed-length context vectors in long sentences.
    Training a machine translation model typically involves optimizing a loss function
    that quantifies the difference between the predicted target sequence and the true
    target sequence. The most common loss function is the negative log-likelihood:


    $$L(\theta) = - \sum_{i=1}^N \log P(t_i \mid t_{<i}, S; \theta)$$ (577)


    where $\theta$ represents the parameters of the model. The parameters of the neural
    network are updated using gradient-based optimization techniques, such as stochastic
    gradient descent (SGD) or Adam, with the gradient of the loss function with respect
    to each parameter being computed via backpropagation. In backpropagation, the
    gradient is computed by recursively applying the chain rule through the layers
    of the network. For a parameter $\theta$, the gradient is given by:


    $$

    \frac{\partial L(\theta)}{\partial \theta} = \frac{\partial L(\theta)}{\partial
    y} \frac{\partial y}{\partial \theta}

    $$ (578)


    where $y$ represents the output of the network, and $\frac{\partial L(\theta)}{\partial
    y}$ is the gradient of the loss with respect to the output. These gradients are
    then propagated backward through the network to update the parameters, thereby
    minimizing the loss function. The quality of a translation is often evaluated'
