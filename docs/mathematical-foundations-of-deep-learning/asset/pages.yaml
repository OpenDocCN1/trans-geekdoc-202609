  md: 'The advantage of depth becomes apparent when we consider deep neural networks,
    which utilize hierarchical representations. A deep network with \( D \) layers
    and width \( W \) per layer constructs a function as a composition of layer-wise
    transformations:


    ```

    \( h^{(k)} = \sigma \left( W^{(k)} h^{(k-1)} + b^{(k)} \right), \quad h^{(0)}
    = x, \quad (79) \)

    ```


    where \( h^{(k)} \) denotes the output of the \( k \)-th layer, \( W^{(k)} \)
    is the weight matrix, \( b^{(k)} \) is the bias vector, and \( \sigma \) is the
    nonlinear activation. The final output of the network is then given by


    ```

    \( f(x) \approx h^{(D)} = \sigma \left( W^{(D)} h^{(D-1)} + b^{(D)} \right). \quad
    (80) \)

    ```


    The depth \( D \) of the network allows it to approximate hierarchical compositions
    of functions. For example, if a target function \( f(x) \) has a compositional
    structure


    ```

    \( f(x) = g_1 \circ g_2 \circ \cdots \circ g_D(x), \quad (81) \)

    ```


    where each \( g_i \) is a simple function, the depth \( D \) directly corresponds
    to the number of nested transformations. This compositional hierarchy enables
    deep networks to approximate functions efficiently, achieving a reduction in the
    required parameter count. The approximation error \( \epsilon \) for a deep network
    decreases polynomially with \( D \), satisfying


    ```

    \( \epsilon \le O \left( \frac{1}{D^2} \right), \quad (82) \)

    ```


    which is exponentially more efficient than the error scaling for shallow networks.
    In light of the Kolmogorov-Arnold theorem, the decomposition


    ```

    \( f(x_1, x_2, \dots, x_n) = \sum_{q=0}^{2n} \Phi_q \left( \sum_{p=1}^n \psi_{pq}(x_p)
    \right) \quad (83) \)

    ```


    demonstrates how deep networks align naturally with the structure of multivariate
    functions. The inner functions \( \psi_{pq} \) capture local dependencies, while
    the outer functions \( \Phi_q \) aggregate these into a global representation.
    This layered decomposition mirrors the depth-based structure of neural networks,
    where each layer learns a specific aspect of the function''s complexity. Finally,
    the parameter count in a deep network with \( D \) layers and width \( W \) per
    layer is given by


    ```

    \( P \le O(D \cdot W^2), \quad (84) \)

    ```


    whereas a shallow network requires


    ```

    \( P \ge O(W^n) \quad (85) \)

    ```


    parameters for the same approximation accuracy. This exponential difference in
    parameter count illustrates the superior efficiency of deep architectures, particularly
    for high-dimensional functions. By leveraging the hierarchical decomposition inherent
    in the Kolmogorov-Arnold theorem, deep networks achieve expressive power that
    scales favorably with both dimension and complexity.


