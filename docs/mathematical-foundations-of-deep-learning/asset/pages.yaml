  md: '# 2 Universal Approximation Theorem: Refined Proof


    The Universal Approximation Theorem (UAT) is a fundamental result in neural network
    theory, stating that a feedforward neural network with a single hidden layer containing
    a finite number of neurons can approximate any continuous function on a compact
    subset of R^n to any desired degree of accuracy, provided that an appropriate
    activation function is used. This theorem has significant implications in machine
    learning, function approximation, and deep learning architectures.


    Literature Review: Hornik et. al. (1989) [57] in their seminal paper rigorously
    proved that multilayer feedforward neural networks with a single hidden layer
    and a sigmoid activation function can approximate any continuous function on a
    compact set. It extends prior results and lays the foundation for the modern understanding
    of UAT. Cybenko (1989) [58] provided one of the first rigorous proofs of the UAT
    using the sigmoid function as the activation function. They demonstrated that
    a single hidden layer network can approximate any continuous function arbitrarily
    well. Barron (1993) [59] extended UAT by quantifying the approximation error and
    analyzing the rate of convergence. This work is crucial for understanding the
    practical efficiency of neural networks. Pinkus (1999) [60] provided a comprehensive
    survey of UAT from the perspective of approximation theory and also discussed
    conditions for approximation with different activation functions and the theoretical
    limits of neural networks. Lu et.al. (2017) [61] investigated how the width of
    neural networks affects their approximation capability, challenging the notion
    that deeper networks are always better. They also provided insights into trade-offs
    between depth and width. Hanin and Sellke (2018) [62] extended UAT to ReLU activation
    functions, showing that deep ReLU networks achieve universal approximation while
    maintaining minimal width constraints. Garcia-Cervera et. al. (2024) [63] extended
    the universal approximation theorem to set-valued functions and its applications
    to Deep Operator Networks (DeepONets), which are useful in control theory and
    PDE modeling. Majee et.al. (2024) [64] explored the universal approximation properties
    of deep neural networks for solving inverse problems using Markov Chain Monte
    Carlo (MCMC) techniques. Toscano et. al. (2024) [65] introduced Kurkova-Kolmogorov-Arnold
    Networks (KKANs), an extension of UAT incorporating Kolmogorov’s superposition
    theorem for improved approximation capabilities. Son (2025) [66] established a
    new framework for operator learning based on the UAT, providing a theoretical
    foundation for backpropagation-free deep networks.


    # 2.1 Approximation Using Convolution Operators


    Let us begin by considering the convolution operator and its role in approximating
    functions in the context of the Universal Approximation Theorem (UAT). Suppose
    \( f : \mathbb{R}^n \rightarrow \mathbb{R} \) is a continuous and bounded function.
    The convolution of \( f \) with a kernel function \( \phi : \mathbb{R}^n \rightarrow
    \mathbb{R} \), denoted as \( f * \phi \), is defined as


    ```

    \( (f * \phi)(x) = \int_{\mathbb{R}^n} f(y)\phi(x - y) \, dy. \quad (56) \)

    ```


    The kernel \( \phi(x) \) is typically chosen to be smooth, compactly supported,
    and normalized such that


    ```

    \( \int_{\mathbb{R}^n} \phi(x) \, dx = 1. \quad (57) \)

    ```


    To approximate \( f \) locally, we introduce a scaling parameter \( \epsilon >
    0 \) and define the scaled kernel \( \phi_\epsilon(x) \) as


    ```

    \( \phi_\epsilon(x) = \epsilon^{-n} \phi\left( \frac{x}{\epsilon} \right). \quad
    (58) \)

    ```


    The factor \( \epsilon^{-n} \) ensures that \( \phi_\epsilon(x) \) remains a probability
    density function, satisfying


    ```

    \( \int_{\mathbb{R}^n} \phi_\epsilon(x) \, dx = \int_{\mathbb{R}^n} \phi(x) \,
    dx = 1. \quad (59) \)

    ```'
