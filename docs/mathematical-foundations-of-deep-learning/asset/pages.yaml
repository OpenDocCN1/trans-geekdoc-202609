    Grid search is a highly structured and exhaustive method for hyperparameter tuning
    in machine learning, where a predetermined grid of hyperparameter values is systematically
    explored. The goal is to identify the set of hyperparameters \(\vec{h} = (h_1,
    h_2, ..., h_p)\) that yields the optimal performance metric for a given machine
    learning model. Let \(p\) represent the total number of hyperparameters to be
    tuned, and for each hyperparameter \(h_i\), let the candidate set be \(\mathcal{H}_i
    = \{h_{i1}, h_{i2}, ..., h_{im_i}\}\), where \(m_i\) is the number of candidate
    values for \(h_i\). The hyperparameter search space is then the Cartesian product
    of all candidate sets:


    \(\mathcal{S} = \mathcal{H}_1 \times \mathcal{H}_2 \times \dots \times \mathcal{H}_p.\)
    (330)


    Thus, the total number of configurations to be evaluated is:


    \(|\mathcal{S}| = \prod_{i=1}^p m_i.\) (331)


    For example, if we have two hyperparameters \(h_1\) and \(h_2\) with 3 possible
    values each, the total number of combinations to explore is 9. This search space
    grows exponentially as the number of hyperparameters increases, posing a significant
    computational challenge. Grid search involves iterating over all configurations
    in \(\mathcal{S}\), evaluating the model’s performance for each configuration.


    Let us define the performance metric \(M(\vec{h}, \mathcal{D}_{train}, \mathcal{D}_{val})\),
    which quantifies the model’s performance for a given hyperparameter configuration
    \(\vec{h}\), where \(\mathcal{D}_{train}\) and \(\mathcal{D}_{val}\) are the training
    and validation datasets, respectively. This metric might represent accuracy, error
    rate, F1-score, or any other relevant criterion, depending on the problem at hand.
    The hyperparameters are then tuned by maximizing or minimizing \(M\) across the
    search space:


    \(\vec{h}^* = \arg \max_{\vec{h} \in \mathcal{S}} M(\vec{h}, \mathcal{D}_{train},
    \mathcal{D}_{val}),\) (332)'
