    # ## 8.1 Key Concepts


    Recurrent Neural Networks (RNNs) are a class of neural architectures specifically
    designed for processing sequential data, leveraging their recursive structure
    to model temporal dependencies. At the core of an RNN lies the concept of a hidden
    state \(\mathbf{h}_t \in \mathbb{R}^m\), which evolves over time as a function
    of the current input \(\mathbf{x}_t \in \mathbb{R}^n\) and the previous hidden
    state \(\mathbf{h}_{t-1}\). This evolution is governed by the recurrence relation:


    \(\mathbf{h}_t = f_h(\mathbf{W}_{xh}\mathbf{x}_t + \mathbf{W}_{hh}\mathbf{h}_{t-1}
    + \mathbf{b}_h) \quad \text{(443)}\)


    where \(\mathbf{W}_{xh} \in \mathbb{R}^{m \times n}\) is the input-to-hidden weight
    matrix, \(\mathbf{W}_{hh} \in \mathbb{R}^{m \times m}\) is the hidden-to-hidden
    weight matrix, \(\mathbf{b}_h \in \mathbb{R}^m\) is the bias vector, and \(f_h\)
    is a non-linear activation function, typically


    \(\tanh(x) = \frac{e^x - e^{-x}}{e^x + e^{-x}} \quad \text{(444)}\)


    or the rectified linear unit \(\text{ReLU}(x) = \max(0, x)\). The recursive nature
    of this update equation ensures that \(\mathbf{h}_t\) inherently encodes information
    about the sequence \(\{\mathbf{x}_1, \mathbf{x}_2, \dots, \mathbf{x}_t\}\), allowing
    the network to maintain a dynamic representation of past inputs. The output \(\mathbf{y}_t
    \in \mathbb{R}^o\) at time \(t\) is computed as:


    \(\mathbf{y}_t = f_y(\mathbf{W}_{hy}\mathbf{h}_t + \mathbf{b}_y) \quad \text{(445)}\)


    where \(\mathbf{W}_{hy} \in \mathbb{R}^{o \times m}\) is the hidden-to-output
    weight matrix, \(\mathbf{b}_y \in \mathbb{R}^o\) is the output bias, and \(f_y\)
    is an activation function such as the softmax function:


    \(f_y(\mathbf{z})_i = \frac{e^{z_i}}{\sum_{j=1}^o e^{z_j}} \quad \text{(446)}\)


    for classification tasks. Expanding the recurrence relation iteratively, the hidden
    state at time \(t\) can be expressed as:


    \(\mathbf{h}_t = f_h(\mathbf{W}_{xh}\mathbf{x}_t + \mathbf{W}_{hh}f_h(\mathbf{W}_{xh}\mathbf{x}_{t-1}
    + \mathbf{W}_{hh}f_h(\dots f_h(\mathbf{W}_{xh}\mathbf{x}_1 + \mathbf{W}_{hh}\mathbf{h}_0
    + \mathbf{b}_h) + \mathbf{b}_h) + \mathbf{b}_h) + \mathbf{b}_h) \quad \text{(447)}\)


    This expansion illustrates the depth of temporal dependency captured by the network
    and highlights the computational challenges of maintaining long-term memory. Specifically,
    the gradient of the loss function \(L\), given by:


    \(L = \sum_{t=1}^T \ell(\mathbf{y}_t, \mathbf{y}_t^{\text{true}}) \quad \text{(448)}\)


    with \(\ell(\mathbf{y}_t, \mathbf{y}_t^{\text{true}})\) representing a task-specific
    loss such as cross-entropy:


    \(\ell(\mathbf{y}_t, \mathbf{y}_t^{\text{true}}) = -\sum_{i=1}^o \mathbf{y}_t^{\text{true}}(i)
    \log \mathbf{y}_t(i) \quad \text{(449)}\)'
