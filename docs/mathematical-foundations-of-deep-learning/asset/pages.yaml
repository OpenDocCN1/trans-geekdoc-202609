    \( u_{k_j} \to u \quad \text{strongly in } L^q(\Omega), \quad (48) \)


    which means that

    \(\|u_{k_j} - u\|_{L^q(\Omega)} \to 0 \quad \text{as } j \to \infty. \quad (49)\)


    To establish this rigorously, we first recall the fact that **bounded sequences
    in** \( W^{1,p}(\Omega) \) **are weakly precompact**. Since \( W^{1,p}(\Omega)
    \) is a **reflexive Banach space** for \( 1 < p < \infty \), the Banach-Alaoglu
    theorem ensures that any bounded sequence \(\{u_k\}\) in \( W^{1,p}(\Omega) \)
    has a subsequence (still denoted by \(\{u_k\}\)) and a function \( u \in W^{1,p}(\Omega)
    \) such that

    \( u_k \rightharpoonup u \quad \text{in } W^{1,p}(\Omega). \quad (50) \)


    This means that for all test functions \(\varphi \in W^{1,p''}(\Omega)\), where
    \( p'' \) is the Hölder conjugate of \( p \) satisfying \( \frac{1}{p} + \frac{1}{p''}
    = 1 \), we have

    \( \int_\Omega u_k \varphi \, dx \to \int_\Omega u \varphi \, dx, \quad \int_\Omega
    \nabla u_k \cdot \nabla \varphi \, dx \to \int_\Omega \nabla u \cdot \nabla \varphi
    \, dx. \quad (51) \)


    However, weak convergence alone does not imply compactness. To obtain strong convergence
    in \( L^q(\Omega) \), we need additional arguments. This is accomplished using
    the **Fréchet-Kolmogorov compactness criterion**, which states that a bounded
    subset of \( L^q(\Omega) \) is compact if and only if it is **tight** and **uniformly
    equicontinuous**. More formally, compactness follows if


    +   1. The sequence \( u_k(x) \) does not oscillate excessively at small scales.


    +   2. The sequence \( u_k(x) \) does not escape to infinity in a way that prevents
    strong convergence.


    To quantify this, we invoke the **Sobolev-Poincaré inequality**, which states
    that for \( p < n \), there exists a constant \( C \) such that

    \( \|u - u_\Omega\|_{L^q(\Omega)} \le C \|\nabla u\|_{L^p(\Omega)}, \quad u_\Omega
    = \frac{1}{|\Omega|} \int_\Omega u(x) \, dx. \quad (52) \)


    Applying this inequality to \( u_k - u \), we obtain

    \( \|u_k - u\|_{L^q(\Omega)} \le C \|\nabla(u_k - u)\|_{L^p(\Omega)}. \quad (53)
    \)


    Since \(\nabla u_k\) is weakly convergent in \( L^p(\Omega) \), we have

    \( \|\nabla u_k - \nabla u\|_{L^p(\Omega)} \to 0. \quad (54) \)


    Thus,

    \( \|u_k - u\|_{L^q(\Omega)} \to 0, \quad (55) \)


    which establishes the **strong convergence** in \( L^q(\Omega) \), completing
    the proof. The key insight is that compactness arises because the gradients of
    \( u_k \) provide control over the oscillations of \( u_k \), ensuring that the
    sequence cannot oscillate indefinitely without converging in norm. The crucial
    role of Sobolev embeddings is to guarantee that even though \( W^{1,p}(\Omega)
    \) does not embed compactly into itself, it does embed compactly into \( L^q(\Omega)
    \) for \( q < \frac{np}{n-p} \). This embedding ensures that weak convergence
    in \( W^{1,p}(\Omega) \) implies strong convergence in \( L^q(\Omega) \), proving
    the theorem.'
