    $$\mathbf{z}^{(l)} = \mathbf{W}^{(l)}\mathbf{a}^{(l-1)} + \mathbf{b}^{(l)}$$ (364)


    where $\mathbf{a}^{(l-1)}$ is the input to the layer, $\mathbf{W}^{(l)}$ is the
    weight matrix, and $\mathbf{b}^{(l)}$ is the bias vector. The output of this linear
    transformation is then passed through a non-linear activation function, such as
    ReLU or softmax for classification tasks. For classification, the **softmax**
    function is often applied to convert the output into a probability distribution:


    $$\mathbf{y}_i = \frac{\exp(z_i)}{\sum_{j=1}^C \exp(z_j)}$$ (365)


    where $C$ is the number of output classes, and $\mathbf{y}_i$ is the probability
    of the $i$-th class. The softmax function ensures that the output probabilities
    sum to 1, providing a valid classification output. The CNN is trained using **backpropagation**,
    which computes the gradients of the loss function $\mathcal{L}$ with respect to
    the network''s parameters (i.e., weights and biases). Backpropagation uses the
    **chain rule** to propagate the error gradients through each layer. The gradients
    with respect to the convolutional filters $\mathbf{K}$ are computed by:


    $$\frac{\partial \mathcal{L}}{\partial \mathbf{K}} = \frac{\partial \mathcal{L}}{\partial
    \mathbf{F}} * \mathbf{I}$$ (366)


