- pgno: 106
  md: '\frac{1}{\sqrt{d_k}} to ensure numerical stability, yielding the raw attention
    scores:


    \[\mathbf{S} = \frac{\mathbf{Q}\mathbf{K}^\top}{\sqrt{d_k}},\]


    where \(\mathbf{S} \in \mathbb{R}^{n \times n}\). These scores are normalized
    using the softmax function, producing the attention weights \(\mathbf{A}\), where


    \[A_{ij} = \frac{\exp(S_{ij})}{\sum_{k=1}^n \exp(S_{ik})},\)


    ensuring \(\sum_{j=1}^n A_{ij} = 1\). The output of the attention mechanism is
    computed as a weighted sum of the values:


    \[\mathbf{Z} = \mathbf{A}\mathbf{V},\)


    where \(\mathbf{Z} \in \mathbb{R}^{n \times d_v}\), with \(d_v\) being the dimensionality
    of the value vectors. This process can be expressed compactly as


    \[\text{Attention}(\mathbf{Q}, \mathbf{K}, \mathbf{V}) = \text{softmax} \left(
    \frac{\mathbf{Q}\mathbf{K}^\top}{\sqrt{d_k}} \right) \mathbf{V}.\)


    Multi-head attention extends this mechanism by splitting \(\mathbf{Q}, \mathbf{K},
    \mathbf{V}\) into \(h\) distinct heads, each operating in its subspace. For the
    \(i\)-th head:


    \[\text{head}_i = \text{Attention}(\mathbf{Q}_i, \mathbf{K}_i, \mathbf{V}_i)\)


    where \(\mathbf{Q}_i = \mathbf{X}\mathbf{W}_i^Q\), \(\mathbf{K}_i = \mathbf{X}\mathbf{W}_i^K\),
    \(\mathbf{V}_i = \mathbf{X}\mathbf{W}_i^V\). The outputs of all heads are concatenated
    and linearly transformed:


    \[\text{MultiHead}(\mathbf{Q}, \mathbf{K}, \mathbf{V}) = \text{Concat}(\text{head}_1,
    \dots, \text{head}_h)\mathbf{W}^O,\)


    where \(\mathbf{W}^O \in \mathbb{R}^{hd_v \times d_{\text{model}}}\). This architecture
    enables the model to capture multiple types of relationships simultaneously. Positional
    encodings are added to the input embeddings \(\mathbf{X}\) to preserve sequence
    order. These encodings \(\mathbf{P} \in \mathbb{R}^{n \times d_{\text{model}}}\)
    are defined as:


    \[P_{(pos, 2i)} = \sin \left( \frac{\text{pos}}{10000^{2i/d_{\text{model}}}} \right),
    \quad P_{(pos, 2i+1)} = \cos \left( \frac{\text{pos}}{10000^{2i/d_{\text{model}}}}
    \right),\)


    ensuring unique representations for each position pos and dimension index \(i\).
    The feedforward network (FFN) applies two dense layers with an intermediate ReLU
    activation:


    \[\text{FFN}(\mathbf{z}) = \max(0, \mathbf{z}\mathbf{W}_1 + \mathbf{b}_1)\mathbf{W}_2
    + \mathbf{b}_2,\)


    where \(\mathbf{W}_1 \in \mathbb{R}^{d_{\text{model}} \times d_{\text{ff}}}\),
    \(\mathbf{W}_2 \in \mathbb{R}^{d_{\text{ff}} \times d_{\text{model}}}\), and \(d_{\text{ff}}
    > d_{\text{model}}\). Residual connections and layer normalization are applied
    throughout to stabilize training, with the output given by


    \[\mathbf{H}_{\text{out}} = \text{LayerNorm}(\mathbf{H}_{\text{in}} + \text{FFN}(\mathbf{H}_{\text{in}})).\)


    Training optimizes the cross-entropy loss over the output distribution:


    \[\mathcal{L} = - \sum_{t=1}^T \log P(y_t \mid y_{<t}, \mathbf{x}),\)


    where \(P(y_t \mid y_{<t}, \mathbf{x})\) is modeled using the softmax over the
    logits \(\mathbf{z}_t \mathbf{W}_{\text{out}} + \mathbf{b}_{\text{out}}\), with
    parameters \(\mathbf{W}_{\text{out}}, \mathbf{b}_{\text{out}}\). The Transformer
    achieves a complexity of \(O(n^2 d_k)\) per attention layer due to the computation
    of \(\mathbf{Q}\mathbf{K}^\top\), yet its parallelization capabilities render
    it more efficient than recurrent networks. This mathematical formalism, coupled
    with innovations like sparse attention and dynamic programming, has solidified
    the Transformer as the cornerstone of modern sequence modeling tasks.'
