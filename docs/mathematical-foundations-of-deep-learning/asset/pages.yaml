  md: 'This activation function helps the network model complex non-linear relationships
    between features and is computationally efficient. The application of ReLU ensures
    that the network can learn complex decision boundaries that are necessary for
    tasks like object detection.


    In CNN-based object detection, the goal is to predict the class of an object and
    localize its position via a bounding box. The bounding box is parametrized by
    four coordinates: \((x, y)\) for the center of the box, and \(w, h\) for the width
    and height. The task can be viewed as a twofold problem: (1) classify the object
    and (2) predict the bounding box that best encodes the object''s spatial position.
    Mathematically, this requires the network to output both class probabilities and
    bounding box coordinates for each object within the image. The classification
    task is typically performed using a softmax function, which converts the network''s
    raw output logits \(z_i\) for each class \(i\) into probabilities \(P(y_i|r)\).
    The softmax function is defined as:


    \(P(y_i|r) = \frac{\exp(z_i)}{\sum_{j=1}^k \exp(z_j)}\) (383)


    where \(k\) is the number of possible classes, \(z_i\) is the raw score for class
    \(i\), and \(P(y_i|r)\) is the probability that the region \(r\) belongs to class
    \(y_i\). This function ensures that the predicted scores are valid probabilities
    that sum to one, which allows the network to make a probabilistic decision regarding
    the class of the object in each region. Simultaneously, the network must also
    predict the four parameters of the bounding box for each object. The network''s
    predicted bounding box parameters are typically denoted as \(\hat{B} = (\hat{x},
    \hat{y}, \hat{w}, \hat{h})\), while the ground truth bounding box is denoted by
    \(B = (x, y, w, h)\). The error between the predicted and true bounding boxes
    is quantified using a loss function, with the smooth \(L_1\) loss being a commonly
    used metric for bounding box regression. The smooth \(L_1\) loss for each parameter
    of the bounding box is defined as:


    \(\mathcal{L}_{\text{bbox}} = \sum_{i=1}^4 \text{SmoothL1}(B_i - \hat{B}_i)\)
    (384)


    The smooth \(L_1\) function is defined as:


    \(\text{SmoothL1}(x) = \begin{cases} 0.5x^2 & \text{if } |x| < 1 \\ |x| - 0.5
    & \text{if } |x| \ge 1 \end{cases}\) (385)


    This loss function is used to reduce the impact of large errors, thereby making
    the training process more robust. The goal is to minimize this loss during the
    training phase to improve the network''s ability to predict both the class and
    the bounding box of objects.


    For training, a combined loss function is used that combines both the classification
    loss and the bounding box regression loss. The total loss function can be written
    as:


    \(\mathcal{L} = \mathcal{L}_{\text{cls}} + \mathcal{L}_{\text{bbox}}\) (386)


    where \(\mathcal{L}_{\text{cls}}\) is the classification loss, typically computed
    using the cross-entropy between the predicted probabilities and the ground truth
    labels. The cross-entropy loss for classification is given by:


    \(\mathcal{L}_{\text{cls}} = -\sum_{i=1}^k y_i \log(\hat{y}_i)\) (387)


    where \(y_i\) is the true label, and \(\hat{y}_i\) is the predicted probability
    for class \(i\). The total objective function for training is therefore a weighted
    sum of the classification and bounding box regression losses, and the network
    is optimized to minimize this combined loss function. Object detection architectures
    like Region-based CNNs (R-CNNs) take a two-stage approach where the task is broken'
