    # 7.4.1 AlexNet


    The **AlexNet Convolutional Neural Network (CNN)** is a deep learning model that
    operates on raw pixel values to perform image classification. Given an input image,
    represented as a 3D tensor \(\mathbf{I}_0 \in \mathbb{R}^{H \times W \times C}\),
    where \(H\) is the height, \(W\) is the width, and \(C\) represents the number
    of input channels (typically \(C = 3\) for RGB images), the network performs a
    series of operations, such as convolutions, activation functions, pooling, and
    fully connected layers, to transform this input into a final output vector \(\mathbf{y}
    \in \mathbb{R}^K\), where \(K\) is the number of output classes. The objective
    of AlexNet is to minimize a loss function that measures the discrepancy between
    the predicted output and the true label, typically using the **cross-entropy loss
    function**.


    At the heart of AlexNet''s architecture are the **convolutional layers**, which
    are designed to learn local patterns in the image by convolving a set of filters
    over the input image. Specifically, the first convolutional layer performs a convolution
    of the input image \(\mathbf{I}_0\) with a set of filters \(\mathbf{W}_1^{(k)}
    \in \mathbb{R}^{F_1 \times F_1 \times C}\), where \(F_1\) is the size of the filter
    and \(C\) is the number of channels in the input. The convolution operation for
    a given filter \(\mathbf{W}_1^{(k)}\) and input image \(\mathbf{I}_0\) at position
    \((i, j)\) is defined as:


    ```

    \(Y_1^{(k)}(i, j) = \sum_{u=1}^{F_1} \sum_{v=1}^{F_1} \sum_{c=1}^{C} W_1^{(k)}(u,
    v, c) \cdot I_0(i + u - 1, j + v - 1, c) + b_1^{(k)}\) (417)

    ```'
