    # 10.1 Key Concepts


    Reinforcement Learning (RL) is a branch of machine learning that deals with agents
    making decisions in an environment to maximize cumulative rewards over time. This
    formalized decision-making process can be described using concepts such as agents,
    states, actions, and rewards, all of which are mathematically formulated within
    the framework of a Markov Decision Process (MDP). The following provides an extremely
    mathematically rigorous discussion of these key concepts. An agent interacts with
    the environment by taking actions based on the current state of the environment.
    The goal of the agent is to maximize the expected cumulative reward over time.
    A policy \(\pi\) is a mapping from states to probability distributions over actions.
    Formally, the policy \(\pi\) can be written as:


    ```

    \pi : \mathcal{S} \rightarrow \mathcal{P}(\mathcal{A}), (526)

    ```


    where \(\mathcal{S}\) is the state space, \(\mathcal{A}\) is the action space,
    and \(\mathcal{P}(\mathcal{A})\) is the set of probability distributions over
    the actions. The policy can be either *deterministic*:


    ```

    \pi(a_t|s_t) = \begin{cases} 1 & \text{if } a_t = \pi(s_t), \\ 0 & \text{otherwise,}
    \end{cases} (527)

    ```


    where \(\pi(s_t)\) is the action chosen in state \(s_t\), or *stochastic*, in
    which case the policy assigns a probability distribution over actions for each
    state \(s_t\). The goal of reinforcement learning is to find an *optimal policy*
    \(\pi^*(s_t)\), which maximizes the expected return (cumulative reward) from any
    initial state. The optimal policy is defined as:


    ```

    \pi^*(s_t) = \arg \max_{\pi} \mathbb{E} \left[ \sum_{k=0}^{\infty} \gamma^k r_{t+k}
    \mid s_t \right], (528)

    ```


    where \(\gamma\) is the *discount factor* that determines the weight of future
    rewards, and \(\mathbb{E}[\cdot]\) represents the expectation under the policy
    \(\pi\). The optimal policy can be derived from the *optimal action-value function*
    \(Q^*(s_t, a_t)\), which we define in the next section. The state \(s_t \in \mathcal{S}\)
    describes the current situation of the agent at time \(t\), encapsulating all
    relevant information that influences the'
