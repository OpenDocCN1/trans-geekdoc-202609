    \[\mathbf{y}_l = \mathcal{F}(\mathbf{x}_l; \mathbf{W}_l)\) (427)


    where $\mathcal{F}$ represents the function learned by the layer, parameterized
    by $\mathbf{W}_l$. In contrast, for ResNet, the output is the sum of the learned
    residual function $\mathcal{F}(\mathbf{x}_l; \mathbf{W}_l)$ and the input $\mathbf{x}_l$
    itself, yielding:


    \[\mathbf{y}_l = \mathcal{F}(\mathbf{x}_l; \mathbf{W}_l) + \mathbf{x}_l\) (428)


    This addition of the identity shortcut connection enables the network to bypass
    layers if needed, facilitating the learning process and addressing the vanishing
    gradient issue. To formalize the optimization problem, we define the residual
    learning objective as the minimization of the loss function $\mathcal{L}$ with
    respect to the parameters $\mathbf{W}_l$:


    \[\mathcal{L} = \sum_{i=1}^N \mathcal{L}_i(\mathbf{y}_i, \mathbf{t}_i)\) (429)


    where $N$ is the number of training samples, $\mathbf{t}_i$ are the target outputs,
    and $\mathcal{L}_i$ is the loss for the $i$-th sample. The training process involves
    adjusting the parameters $\mathbf{W}_l$ via gradient descent, which in turn requires
    the gradients of the loss function with respect to the network parameters. The
    gradient of $\mathcal{L}$ with respect to $\mathbf{W}_l$ can be expressed as:


    \[\frac{\partial \mathcal{L}}{\partial \mathbf{W}_l} = \sum_{i=1}^N \frac{\partial
    \mathcal{L}_i}{\partial \mathbf{y}_i} \cdot \frac{\partial \mathbf{y}_i}{\partial
    \mathbf{W}_l}\) (430)


    Since the residual block adds the input directly to the output, the derivative
    of the output with respect to the weights $\mathbf{W}_l$ is given by:


    \[\frac{\partial \mathbf{y}_l}{\partial \mathbf{W}_l} = \frac{\partial \mathcal{F}(\mathbf{x}_l;
    \mathbf{W}_l)}{\partial \mathbf{W}_l}\) (431)


    Now, let''s explore how this addition of the residual connection directly influences
    the backpropagation process. In a traditional feedforward network, the backpropagated
    gradients for each layer depend solely on the output of the preceding layer. However,
    in a residual network, the gradient flow is enhanced because the identity mapping
    $\mathbf{x}_l$ is directly passed to the subsequent layer. This ensures that the
    gradients will not be lost as the network deepens, a phenomenon that becomes critical
    in very deep networks. The gradient with respect to the loss $\mathcal{L}$ at
    layer $l$ is:


    \[\frac{\partial \mathcal{L}}{\partial \mathbf{x}_l} = \frac{\partial \mathcal{L}}{\partial
    \mathbf{y}_l} \cdot \frac{\partial \mathbf{y}_l}{\partial \mathbf{x}_l}\) (432)


    Since $\mathbf{y}_l = \mathcal{F}(\mathbf{x}_l; \mathbf{W}_l) + \mathbf{x}_l$,
    the derivative of $\mathbf{y}_l$ with respect to $\mathbf{x}_l$ is:


    \[\frac{\partial \mathbf{y}_l}{\partial \mathbf{x}_l} = \mathbf{I} + \frac{\partial
    \mathcal{F}(\mathbf{x}_l; \mathbf{W}_l)}{\partial \mathbf{x}_l}\) (433)


    where $\mathbf{I}$ is the identity matrix. This ensures that the gradient $\frac{\partial
    \mathcal{L}}{\partial \mathbf{x}_l}$ can propagate more easily through the network,
