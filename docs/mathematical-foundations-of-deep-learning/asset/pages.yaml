    a **surrogate model** to approximate it, which allows for strategic decisions
    about which points in the space $\mathcal{X}$ to evaluate. The surrogate model
    is typically represented by a **Gaussian Process (GP)**, which provides both a
    prediction and an uncertainty estimate at any point in $\mathcal{X}$. The GP is
    a non-parametric, probabilistic model that assumes that function values at any
    finite set of points follow a joint Gaussian distribution. Specifically, for a'
