- pgno: 103
  md: 'where $W_y$ is the weight matrix corresponding to the output and $c$ is the
    bias term for the output. The output $y_t$ is then used to compute the predicted
    probability distribution over possible outputs at each time step, typically through
    a softmax function for classification tasks:


    ```

    P(y_t|h_t) = \text{softmax}(W_y h_t + c)

    ```


    In NLP tasks such as language modeling, the objective is to predict the next word
    in a sequence given all previous words. The RNN is trained to estimate the conditional
    probability distribution $P(w_t|w_1, w_2, \dots, w_{t-1})$ of the next word $w_t$
    based on the previous words. The full likelihood of the sequence $w_1, w_2, \dots,
    w_T$ can be written as:


    ```

    P(w_1, w_2, \dots, w_T) = \prod_{t=1}^T P(w_t|w_1, w_2, \dots, w_{t-1})

    ```


    For an RNN, this conditional probability is modeled by recursively updating the
    hidden state and generating a probability distribution for each word. At each
    time step, the probability of the next word is computed as:


    ```

    P(w_t|h_{t-1}) = \text{softmax}(W_y h_t + c)

    ```


    The network is trained by minimizing the negative log-likelihood of the true word
    sequence:


    ```

    \mathcal{L} = - \sum_{t=1}^T \log P(w_t|h_{t-1})

    ```


    This loss function guides the optimization of the weight matrices $W_h, W_x, \text{and
    } W_y$ to maximize the likelihood of the correct word sequences. As the network
    learns from large datasets, it develops the ability to predict words based on
    the context provided by previous words in the sequence. A key extension of RNNs
    in NLP is machine translation, where one sequence of words in one language is
    mapped to another sequence in a target language. This is typically modeled using
    sequence-to-sequence (Seq2Seq) architectures, which consist of two RNNs: the encoder
    and the decoder. The encoder RNN processes the input sequence $x_1, x_2, \dots,
    x_T$, updating its hidden state at each time step:


    ```

    h_t^{\text{enc}} = \sigma(W_h^{\text{enc}} h_{t-1}^{\text{enc}} + W_x^{\text{enc}}
    x_t + b^{\text{enc}})

    ```


    The final hidden state $h_T^{\text{enc}}$ of the encoder is passed to the decoder
    as its initial hidden state. The decoder RNN generates the target sequence $y_1,
    y_2, \dots, y_T$ by updating its hidden state at each time step, using both the
    previous hidden state $h_{t-1}^{\text{dec}}$ and the previous output $y_{t-1}$:


    ```

    h_t^{\text{dec}} = \sigma(W_h^{\text{dec}} h_{t-1}^{\text{dec}} + W_x^{\text{dec}}
    y_{t-1} + b^{\text{dec}})

    ```


    The decoder produces a probability distribution over the target vocabulary at
    each time step:


    ```

    P(y_t|h_t^{\text{dec}}) = \text{softmax}(W_y^{\text{dec}} h_t^{\text{dec}} + c^{\text{dec}})

    ```


    The training of the Seq2Seq model is based on minimizing the cross-entropy loss
    function:


    ```

    \mathcal{L} = - \sum_{t=1}^T \log P(y_t|h_t^{\text{dec}})

    ```


    This ensures that the network learns to map input sequences to output sequences.
    By training on a large corpus of paired sentences, the Seq2Seq model learns to
    translate sentences from one language to another, with the encoder capturing the
    context of the input sentence and the decoder generating the translated sentence.


    RNNs are also effective in sentiment analysis, a task where the goal is to classify
    the sentiment'
