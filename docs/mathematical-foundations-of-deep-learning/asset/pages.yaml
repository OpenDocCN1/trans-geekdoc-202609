    # 11.2 Machine Translation


    Literature Review: Wu et. al. (2020) [245] introduced end-to-end neural machine
    translation (NMT), focusing on sequence-to-sequence models, attention mechanisms,
    and transformer architectures. It explains encoder-decoder frameworks, self-attention,
    and positional encoding, laying the groundwork for modern NMT. Hettiarachchi et.
    al. (2024) [246] presented Amharic-to-English machine translation using transformers.
    It introduces character embeddings and regularization techniques for handling
    low-resource languages, a critical challenge in multilingual NLP. Das and Sahoo
    (2024) [247] discussed word alignment models, a fundamental concept in SMT. It
    explains IBM Model 1-5, HMM alignments, and the role of alignment in phrase-based
    models. It also explores challenges in handling syntactic divergence across languages.
    Oluwatoki et. al. (2024) [248] presented one of the first transformer-based Yoruba-to-English
    MT systems. It highlights how multilingual NLP models struggle with resource-scarce
    languages and proposes Rouge-based evaluation for MT systems. Uçkan and Kurt [249]
    discusses the role of word embeddings (Word2Vec, GloVe, FastText) in MT. It covers
    semantic representation in vector spaces, crucial for context-aware translation
    in NMT. discussed multiword expressions (MWEs) in MT, a major challenge in NLP.
    It covers idiomatic expressions, collocations, and phrasal verbs, showing how
    neural models struggle with multiword disambiguation. Pastor et. al. (2024) [250]
    discussed multiword expressions (MWEs) in MT, a major challenge in NLP. It covers
    idiomatic expressions, collocations, and phrasal verbs, showing how neural models
    struggle with multiword disambiguation. Fernandes (2024) [251] compared open-source
    large language models (LLMs) and NMT systems in translating spatial semantics
    in EN-PT-BR (English Portuguese-Brazilian Portuguese) subtitles. It highlights
    the limitations of both traditional and neural MT in capturing contextual spatial
    meanings. Jozić (2024) [252] evaluated ChatGPT''s translation capabilities against
    specialized MT systems like eTranslation (EU Commission MT model). It shows how
    general-purpose LLMs can rival dedicated NMT systems but struggle with domain-specific
    translations. Yang (2025) [253] introduced error-detection models for NMT output,
    using transformer-based classifiers to detect syntactic and semantic errors in
    machine-generated translations.


    Machine Translation (MT) in Natural Language Processing (NLP) is a highly intricate
    computational task that requires converting text from one language (source language)
    to another (target language) by using statistical, rule-based, and deep learning
    models, often underpinned by probabilistic and neural network-based frameworks.
    The goal is to determine the most probable target sequence $T = \{t_1, t_2, \dots,
    t_N\}$ from the given source sequence $S = \{s_1, s_2, \dots, s_T\}$, by modeling
    the conditional probability $P(T \mid S)$. The optimal translation is typically
    defined by:


    $$T^* = \arg \max_T P(T \mid S) \quad (568)$$'
