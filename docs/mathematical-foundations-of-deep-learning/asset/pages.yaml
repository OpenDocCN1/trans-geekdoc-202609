    augmented by a bias term \(b \in \mathbb{R}\). This can be expressed as


    ```

    \(z = \vec{w}^T \vec{x} + b = \sum_{i=1}^n w_i x_i + b.\) (164)

    ```


    To determine the output, this value is passed through the step activation function,
    defined mathematically as


    ```

    \(\phi(z) = \begin{cases} 1, & z \ge 0, \\ 0, & z < 0. \end{cases}\) (165)

    ```


    Thus, the perceptron''s decision-making process can be expressed as


    ```

    \(y = \phi(\vec{w}^T \vec{x} + b),\) (166)

    ```


    where \(y \in \{0, 1\}\). The equation \(\vec{w}^T \vec{x} + b = 0\) defines a
    hyperplane in \(\mathbb{R}^n\), which acts as the decision boundary. For any input
    \(\vec{x}\), the classification is determined by the sign of \(\vec{w}^T \vec{x}
    + b\), specifically \(y = 1\) if \(\vec{w}^T \vec{x} + b \ge 0\) and \(y = 0\)
    otherwise. Geometrically, this classification corresponds to partitioning the
    input space into two distinct half-spaces. To train the perceptron, a supervised
    learning algorithm adjusts the weights \(\vec{w}\) and the bias \(b\) iteratively
    using labeled training data \(\{(\vec{x}_i, y_i)\}_{i=1}^m\), where \(y_i\) represents
    the ground truth. When the predicted output \(y_{\text{pred}} = \phi(\vec{w}^T
    \vec{x}_i + b)\) differs from \(y_i\), the weight vector and bias are updated
    according to the rule


    ```

    \(\vec{w} \leftarrow \vec{w} + \eta(y_i - y_{\text{pred}})\vec{x}_i,\) (167)

    ```


    and


    ```

    \(b \leftarrow b + \eta(y_i - y_{\text{pred}}),\) (168)

    ```


    where \(\eta > 0\) is the learning rate. Each individual weight \(w_j\) is updated
    as


    ```

    \(w_j \leftarrow w_j + \eta(y_i - y_{\text{pred}})x_{ij}.\) (169)

    ```


    For a linearly separable dataset, the Perceptron Convergence Theorem asserts that
    the algorithm will converge to a solution after a finite number of updates. Specifically,
    the number of updates is bounded by


    ```

    \(\frac{R^2}{\gamma^2},\) (170)

    ```


    where \(R = \max_i \|\vec{x}_i\|\) is the maximum norm of the input vectors, and
    \(\gamma\) is the minimum margin, defined as


    ```

    \(\gamma = \min_i \frac{y_i(\vec{w}^T \vec{x}_i + b)}{\|\vec{w}\|}.\) (171)

    ```


    The limitations of the perceptron, particularly its inability to solve linearly
    inseparable problems such as the XOR problem, necessitate the extension to artificial
    neurons with non-linear activation functions. A popular choice is the sigmoid
    activation function


    ```

    \(\phi(z) = \frac{1}{1 + e^{-z}},\) (172)

    ```


    which maps \(z \in \mathbb{R}\) to the continuous interval \((0, 1)\). The derivative
    of the sigmoid function, essential for gradient-based optimization, is


    ```

    \(\phi''(z) = \phi(z)(1 - \phi(z)).\) (173)

    ```


    Another widely used activation function is the hyperbolic tangent \(\tanh(z)\),
    defined as


    ```

    \(\tanh(z) = \frac{e^z - e^{-z}}{e^z + e^{-z}},\) (174)

    ```'
