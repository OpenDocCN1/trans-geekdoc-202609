    # 6.3.2 L1/L2 Regularization and Overfitting


    L1 and L2 regularization plays a critical role in mitigating overfitting. Overfitting
    occurs when a model fits not only the underlying data distribution but also the
    noise in the data, leading to poor generalization to unseen examples. Overfitting
    is especially prevalent in models with a large number of features, where the model
    becomes overly flexible and may capture spurious correlations between the features
    and the target variable. This often results in a model with high variance, where
    small fluctuations in the data cause significant changes in the model predictions.
    To combat this, regularization techniques are employed, which introduce a penalty
    term into the objective function, discouraging overly complex models that fit
    noise.


    Given a set of \(n\) observations \(\{(\mathbf{x}_i, y_i)\}_{i=1}^n\), where each
