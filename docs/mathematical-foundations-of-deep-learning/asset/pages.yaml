    during training is governed by the gradient flow equation \(\frac{d\theta}{dt}
    = -\nabla_\theta \mathcal{L}(\theta)\), where \(\nabla_\theta \mathcal{L}(\theta)\)
    is the gradient of the loss function with respect to the parameters. To analyze
    the dynamics of the network outputs, we first consider the time derivative of
    \(f_\theta(x)\). Using the chain rule, this is expressed as:


    \(\frac{\partial f_\theta(x)}{\partial t} = \nabla_\theta f_\theta(x)^\top \frac{d\theta}{dt}.\)
    \tag{123}


    Substituting \(\frac{d\theta}{dt} = -\nabla_\theta \mathcal{L}(\theta)\), we have:


    \(\frac{\partial f_\theta(x)}{\partial t} = -\nabla_\theta f_\theta(x)^\top \nabla_\theta
    \mathcal{L}(\theta).\) \tag{124}


    The gradient of the loss function, \(\mathcal{L}(\theta)\), can be expressed explicitly
    in terms of the training data. For a generic loss function over the dataset, this
    takes the form:


    \(\mathcal{L}(\theta) = \frac{1}{n} \sum_{i=1}^n \ell(f_\theta(x_i), y_i),\) \tag{125}


    where \(\ell(f_\theta(x_i), y_i)\) represents the loss for the \(i\)-th data point.
    The gradient of the loss with respect to the parameters is therefore given by:


    \(\nabla_\theta \mathcal{L}(\theta) = \frac{1}{n} \sum_{i=1}^n \nabla_\theta f_\theta(x_i)
    \nabla_{f_\theta(x_i)} \ell(f_\theta(x_i), y_i).\) \tag{126}


    Substituting this back into the time derivative of \(f_\theta(x)\), we obtain:


    \(\frac{\partial f_\theta(x)}{\partial t} = -\frac{1}{n} \sum_{i=1}^n \nabla_\theta
    f_\theta(x)^\top \nabla_\theta f_\theta(x_i) \nabla_{f_\theta(x_i)} \ell(f_\theta(x_i),
    y_i).\) \tag{127}


    To introduce the Neural Tangent Kernel (NTK), we define it as the Gram matrix
    of the Jacobians of the network output with respect to the parameters:


    \(\Theta(x, x''; \theta) = \nabla_\theta f_\theta(x)^\top \nabla_\theta f_\theta(x'').\)
    \tag{128}


    Using this definition, the time evolution of the output becomes:


    \(\frac{\partial f_\theta(x)}{\partial t} = -\frac{1}{n} \sum_{i=1}^n \Theta(x,
    x_i; \theta) \nabla_{f_\theta(x_i)} \ell(f_\theta(x_i), y_i).\) \tag{129}


    In the overparameterized regime, where the number of parameters \(p\) is significantly
    larger than the number of training data points \(n\), it has been empirically
    and theoretically observed that the NTK \(\Theta(x, x''; \theta)\) remains nearly
    constant during training. Specifically, \(\Theta(x, x''; \theta) \approx \Theta(x,
    x''; \theta_0)\), where \(\theta_0\) represents the parameters at initialization.
    This constancy significantly simplifies the analysis of the network''s training
    dynamics. To see this, consider the solution to the differential equation governing
