    # 2.2 Depth vs. Width: Capacity Analysis


    # 2.2.1 Bounding the Expressive Power


    The Kolmogorov-Arnold Superposition Theorem is a foundational result in the mathematical
    analysis of multivariate continuous functions and their decompositions, providing
    a framework that underpins the expressive power of neural networks. It asserts
    that any continuous multivariate function can be expressed as a finite composition
    of continuous univariate functions and addition. It was first conjectured by Andrey
    Kolmogorov in 1956 and later rigorously proved by Vladimir Arnold in 1957. Formally,
    the theorem guarantees that any continuous multivariate function \(f : [0, 1]^n
    \to \mathbb{R}\) can be represented as a finite composition of continuous univariate
    functions \(\Phi_q\) and \(\psi_{pq}\). Specifically, for \(f(x_1, x_2, \dots,
    x_n)\), there exist functions \(\Phi_q : \mathbb{R} \to \mathbb{R}\) and \(\psi_{pq}
    : \mathbb{R} \to \mathbb{R}\), such that


    ```

    \(f(x_1, x_2, \dots, x_n) = \sum_{q=0}^{2n} \Phi_q \left( \sum_{p=1}^n \psi_{pq}(x_p)
    \right),\)

    (74)

    ```


    where the functions \(\psi_{pq}(x_p)\) encode the univariate projections of the
    input variables \(x_p\), and the outer functions \(\Phi_q\) aggregate these projections
    into the final output. This decomposition highlights a fundamental property of
    multivariate continuous functions: their expressiveness can be captured through
    hierarchical compositions of simpler, univariate components.


    <u>Literature Review:</u> There are some Classical References on the Kolmogorov-Arnold
    Superposition Theorem (KST). Kolmogorov (1957) [79] in his Foundational Paper
    on KST established that any continuous function of several variables can be represented
    as a superposition of continuous functions of a single variable and addition.
    This was groundbreaking because it provided a universal function decomposition
    method, independent of inner-product spaces. He proved that there exist functions
    \(\phi_q\) and \(\psi_q\) such that any function \(f(x_1, x_2, \dots, x_n)\) can
    be expressed as:


    ```

    \(f(x_1, \dots, x_n) = \sum_{q=1}^{2n+1} \phi_q \left( \sum_{p=1}^n \psi_{qp}(x_p)
    \right)\)

    (75)

    ```


    where the \(\psi_{qp}\) are univariate functions. Kolmogorov provided a mathematical
    basis for approximation theory and neural networks, influencing modern machine
    learning architectures. Arnold (1963) [80] refined Kolmogorov’s theorem by proving
    that one can restrict the superposition to functions of at most two variables
    instead of one. Arnold’s formulation led to the **Kolmogorov-Arnold representation**:


    ```

    \(f(x_1, \dots, x_n) = \sum_{q=1}^{2n+1} \phi_q \left( x_q + \sum_{p=1}^n \psi_{qp}(x_p)
    \right)\)

    (76)

    ```


    making the theorem more suitable for practical computations. Arnold strengthened
    the expressivity of neural networks, inspiring alternative function representations
    in high-dimensional settings.'
