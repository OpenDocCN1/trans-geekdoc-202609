  md: 'expressed as


    \[\frac{d\theta(t)}{dt} = -\nabla_\theta \mathcal{L}(\theta(t)).\] (98)


    The loss function, typically of the form


    \[\mathcal{L}(\theta) = \frac{1}{2n} \sum_{i=1}^n \|f(x_i; \theta) - y_i\|^2,\]
    (99)


    measures the discrepancy between the network''s predicted outputs $f(x_i; \theta)$
    and the true labels $y_i$. At stationary points of the flow, the condition


    \[\nabla_\theta \mathcal{L}(\theta^*) = 0\) (100)


    holds, indicating that the gradient vanishes. To classify these stationary points,
    the Hessian matrix \(H = \nabla_\theta^2 \mathcal{L}(\theta)\) is examined. For
    eigenvalues \(\{\lambda_i\}\) of \(H\), the nature of the stationary point is
    determined: \(\lambda_i > 0\) for all \(i\) corresponds to a local minimum, \(\lambda_i
    < 0\) for all \(i\) to a local maximum, and mixed signs indicate a saddle point.
    Under gradient flow \(\frac{d\theta(t)}{dt} = -\nabla_\theta \mathcal{L}(\theta(t))\),
    the trajectory converges to critical points:


    \[\lim_{t \to \infty} \|\nabla_\theta \mathcal{L}(\theta(t))\| = 0.\) (101)


    The gradient flow also governs the temporal evolution of the network''s predictions
    \(f(x; \theta(t))\). A Taylor series expansion of \(f(x; \theta)\) about an initial
    parameter \(\theta_0\) gives:


    \[f(x; \theta) = f(x; \theta_0) + J_f(x; \theta_0)(\theta - \theta_0) + \frac{1}{2}(\theta
    - \theta_0)^\top H_f(x; \theta_0)(\theta - \theta_0) + \mathcal{O}(\|\theta -
    \theta_0\|^3),\) (102)


    where \(J_f(x; \theta_0) = \nabla_\theta f(x; \theta_0)\) is the Jacobian and
    \(H_f(x; \theta_0)\) is the Hessian of \(f(x; \theta)\) with respect to \(\theta\).
    In the NTK (neural tangent kernel) regime, higher-order terms are negligible due
    to the large parameterization of the network, and the linear approximation suffices:


    \[f(x; \theta) \approx f(x; \theta_0) + J_f(x; \theta_0)(\theta - \theta_0).\)
    (103)


    Under gradient flow, the time derivative of the network''s predictions is given
    by:


    \[\frac{df(x; \theta(t))}{dt} = J_f(x; \theta(t)) \frac{d\theta(t)}{dt}.\) (104)


    Substituting the parameter dynamics \(\frac{d\theta(t)}{dt} = -\nabla_\theta \mathcal{L}(\theta(t))
    = -\sum_{i=1}^n (f(x_i; \theta(t)) - y_i) J_f(x_i; \theta(t))\), this becomes:


    \[\frac{df(x; \theta(t))}{dt} = -\sum_{i=1}^n J_f(x; \theta(t)) J_f(x_i; \theta(t))^\top
    (f(x_i; \theta(t)) - y_i).\) (105)


    Defining the NTK as \(\mathcal{K}(x, x''; \theta) = J_f(x; \theta) J_f(x''; \theta)^\top\),
    and assuming constancy of the NTK during training (\(\mathcal{K}(x, x''; \theta)
    \approx \mathcal{K}_0(x, x'')\)), the evolution equation simplifies to:


    \[\frac{df(x; \theta(t))}{dt} = -\sum_{i=1}^n \mathcal{K}_0(x, x_i) (f(x_i; \theta(t))
    - y_i).\) (106)


    Rewriting in matrix form, let \(\mathbf{f}(t) = [f(x_1; \theta(t)), \dots, f(x_n;
    \theta(t))]^\top\) and \(\mathbf{y} = [y_1, \dots, y_n]^\top\). The NTK matrix
    \(\mathcal{K}_0 \in \mathbb{R}^{n \times n}\) evaluated at initialization defines
    the system:


    \[\frac{d\mathbf{f}(t)}{dt} = -\mathcal{K}_0 (\mathbf{f}(t) - \mathbf{y}).\) (107)


    The solution to this linear system is:


    \[\mathbf{f}(t) = e^{-\mathcal{K}_0 t} \mathbf{f}(0) + (\mathbf{I} - e^{-\mathcal{K}_0
    t}) \mathbf{y}.\) (108)'
