    \( \hat{f} \) such that \( \| f(\vec{x}) - \hat{f}(\vec{x}) \| < \epsilon \) for
    all \( \vec{x} \in D \). This expressive capability arises because the composition
    of affine transformations and nonlinear activations allows the network to approximate
    highly complex functions by partitioning the input space into regions and assigning
    different functional behaviors to each.


