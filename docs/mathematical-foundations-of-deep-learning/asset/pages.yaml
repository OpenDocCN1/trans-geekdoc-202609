    \log D(\mathbf{x})] + \mathbb{E}_{\mathbf{z} \sim p_{\mathbf{z}}} [\nabla_{\theta_D}
    \log(1 - D(G(\mathbf{z})))]. \quad (510)

    ```


    Training Generative Adversarial Networks (GANs) involves iterative updates to
    the parameters $\theta_D$ of the discriminator and $\theta_G$ of the generator.
