    (325)

    ```


    where \(\lambda > 0\) is the regularization coefficient. The gradient of the regularized
    loss becomes:


    ```

    \(\nabla_\theta \mathcal{L}_{train}^{reg}(\theta; h) = \nabla_\theta \mathcal{L}_{train}(\theta;
