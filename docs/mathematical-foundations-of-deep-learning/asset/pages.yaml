    # 7.4.2 ResNet


    At the heart of the ResNet architecture lies the notion of _residual learning_,
    where instead of learning the direct transformation $\mathbf{y} = f(\mathbf{x};
    \mathbf{W})$, the network learns the residual function $\mathcal{F}(\mathbf{x};
    \mathbf{W})$, i.e., the difference between the input and output. The network output
    $\mathbf{y}$ can therefore be expressed as:

    $$\mathbf{y} = \mathcal{F}(\mathbf{x}; \mathbf{W}) + \mathbf{x}$$ (426)


    This formulation represents the core difference from traditional neural networks
    where the model learns a mapping directly from the input $\mathbf{x}$ to the output
    $\mathbf{y}$. The introduction of the identity shortcut connection $\mathbf{x}$
    introduces a powerful mechanism by which the network can learn the residual, and
    if the optimal residual transformation is the identity function, the network can
    essentially learn $\mathbf{y} = \mathbf{x}$, improving optimization. This reduces
    the challenge of training deeper networks, where deep layers often lead to vanishing
    gradients, because the gradient can propagate directly through these shortcuts,
    bypassing intermediate layers.


    Let’s formalize this residual learning. Let the input to the residual block be
    $\mathbf{x}_l$ and the output'
