    operation is a set of feature maps \( Y_1^{(k)} \in \mathbb{R}^{H'' \times W''}
    \), where the dimensions of the output are \( H'' = H - F_1 + 1 \) and \( W''
    = W - F_1 + 1 \) if no padding is applied. Subsequent to the convolutional operation,
    the output feature maps \( Y_1^{(k)} \) are passed through a **ReLU (Rectified
    Linear Unit)** activation function, which introduces non-linearity into the network.
    The ReLU function is defined as:


    \(\text{ReLU}(z) = \max(0, z)\)


    This function transforms negative values in the feature map \( Y_1^{(k)} \) into
    zero, while leaving positive values unchanged, thus allowing the network to model
    complex, non-linear patterns in the data. The output of the ReLU activation function
    is denoted by \( A_1^{(k)}(i,j) = \text{ReLU}(Y_1^{(k)}(i, j)) \). Following the
    activation function, a **max-pooling** operation is performed to downsample the
    feature maps and reduce their spatial dimensions. Given a pooling window of size
    \( P \times P \), the max-pooling operation computes the maximum value in each
    window, which is mathematically expressed as:


    \( Y_1^{\text{pool}}(i,j) = \max \left( A_1^{(k)} (i'', j'') : (i'', j'') \in
    \text{pooling window} \right) \)


    where \( A_1^{(k)} \) is the feature map after ReLU, and the resulting pooled
    output \( Y_1^{\text{pool}}(i,j) \) has reduced spatial dimensions, typically
    \( H'''' = \frac{H''}{P} \) and \( W'''' = \frac{W''}{P} \). This operation helps
    retain the most important features while discarding irrelevant spatial details,
    which makes the network more robust to small translations in the input image.
    The convolutional and pooling operations are repeated across multiple layers,
    with each layer learning progressively more complex patterns from the input data.
    In the second convolutional layer, for example, we convolve the feature maps from
    the first layer \( A_1^{(k)} \) with a new set of filters \( \mathbf{W}_2^{(k)}
    \in \mathbb{R}^{F_2 \times F_2 \times K_1} \), where \( K_1 \) is the number of
    feature maps produced by the first convolutional layer. The convolution for the
    second layer is expressed as:


    \( Y_2^{(k)}(i,j) = \sum_{u=1}^{F_2} \sum_{v=1}^{F_2} \sum_{c=1}^{K_1} W_2^{(k)}(u,
    v, c) \cdot A_1^{(c)}(i + u - 1, j + v - 1) + b_2^{(k)} \)


    This process is iterated for each subsequent convolutional layer, where each new
    set of filters learns higher-level features, such as edges, textures, and object
    parts. The activation maps produced by each convolutional layer are passed through
    the ReLU activation function, and max-pooling is applied after each convolutional
    layer to reduce the spatial dimensions.


    After the last convolutional layer, the feature maps are **flattened** into a
    1D vector \( \mathbf{a}_f \in \mathbb{R}^N \), where \( N \) is the total number
    of activations across all channels and spatial dimensions. This flattened vector
    is then passed to **fully connected (FC) layers** for classification. Each fully
    connected layer performs a linear transformation, followed by a non-linear activation.
    The output of the \( i \)-th neuron in the fully connected layer is given by:


    \( z_i = \sum_{j=1}^N W_{ij} \cdot a_f(j) + b_i \)


    where \( W_{ij} \) is the weight connecting neuron \( j \) in the previous layer
    to neuron \( i \) in the current layer, and \( b_i \) is the bias term. The output
    of the fully connected layer is a vector of class scores \( \mathbf{z} \in \mathbb{R}^K
