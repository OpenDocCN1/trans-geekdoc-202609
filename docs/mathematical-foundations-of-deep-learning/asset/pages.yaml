  md: 'only $T$ evaluations, and since each evaluation is independent of the others,
    the computational cost grows linearly with $T$, making it more efficient when
    $d$ is large. The probabilistic nature of random search further enhances its efficiency.
    Suppose that only a subset of hyperparameters, say $k$, significantly influences
    the model''s performance. Let $S$ be the subspace of $\mathcal{H}$ consisting
    of hyperparameter configurations that produce low loss values, and let the complementary
    space $\mathcal{H} \setminus S$ correspond to configurations that are unlikely
    to achieve low loss. In this case, the task becomes one of searching within the
    subspace $S$, rather than the entire space $\mathcal{H}$. The random search method
    is well-suited to such problems, as it can probabilistically focus on the relevant
    subspace by drawing hyperparameter values from distributions $\mathcal{D}_i$ that
    prioritize areas of the hyperparameter space with low loss. More formally, the
    probability of selecting a hyperparameter set $\mathbf{h}_t$ from the relevant
    subspace $S$ is given by:


    \(P(\mathbf{h}_t \in S) = \prod_{i=1}^d P(h_{t,i} \in S_i),\quad (347)\)


    where \(S_i\) is the relevant region for the \(i\)-th hyperparameter, and \(P(h_{t,i}
    \in S_i)\) is the probability that the \(i\)-th hyperparameter lies within the
    relevant region. As the number of iterations \(T\) increases, the probability
    that random search selects a hyperparameter set \(\mathbf{h}_t \in S\) increases
    as well, approaching 1 as \(T \to \infty\):


    \(P(\mathbf{h}_t \in S) = 1 - (1 - P_0)^T,\quad (348)\)


    where \(P_0\) is the probability of sampling a hyperparameter set from the relevant
    subspace in one iteration. Thus, random search tends to explore the subspace of
    low-loss configurations, improving the chances of finding an optimal or near-optimal
    configuration as \(T\) increases.


    The exploration behavior of random search contrasts with that of grid search,
    which, despite its systematic nature, may fail to efficiently explore sparsely
    populated regions of the hyperparameter space. When the hyperparameter space is
    high-dimensional, the grid search must evaluate exponentially many configurations,
    regardless of the relevance of the hyperparameters. This leads to inefficiencies
    when only a small fraction of hyperparameters significantly contribute to the
    loss function. Random search, by sampling independently and uniformly across the
    entire space, is not subject to this curse of dimensionality and can more effectively
    locate regions that matter for model performance. Mathematically, random search
    has an additional advantage when the hyperparameters exhibit smooth or continuous
    relationships with the loss function. In this case, random search can probe the
    space probabilistically, discovering gradients of loss that grid search, due to
    its fixed grid structure, may miss. Furthermore, random search is capable of finding
    the optimum even when the loss function is non-convex, provided that the space
    is explored adequately. This becomes particularly relevant in the presence of
    highly irregular loss surfaces, as random search has the potential to escape local
    minima more effectively than grid search, which is constrained by its fixed sampling
    grid.


    In conclusion, random search is a highly efficient and scalable approach for hyperparameter
    optimization in machine learning. By sampling hyperparameters from predefined
    probability distributions and evaluating the associated loss function, random
    search provides a computationally feasible method for high-dimensional hyperparameter
    spaces, outperforming grid search in many cases. Its probabilistic nature allows
    it to focus on relevant regions of the hyperparameter space, making it particularly
    advantageous when only a subset of hyperparameters significantly impacts the model''s
    performance. As the number of iterations \(T\) increases, random search becomes
    more likely to converge to the optimal configuration, making it a powerful tool
    for hyperparameter tuning in complex models.'
