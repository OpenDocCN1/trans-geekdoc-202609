    Reinforcement Learning (RL) is a subfield of machine learning where an agent learns
    to make decisions by interacting with an environment. The goal of the agent is
    to maximize a cumulative reward signal over time by taking actions that affect
    its environment. The RL framework is formally represented by a *Markov Decision
    Process (MDP)*, which is defined by a 5-tuple $(\mathcal{S}, \mathcal{A}, P, r,
    \gamma)$, where:


    +   • $\mathcal{S}$ is the state space, which represents all possible states the
    agent can be in.'
