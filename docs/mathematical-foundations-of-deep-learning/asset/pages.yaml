    = \frac{1}{n} \|\mathbf{X}\theta - \mathbf{y}\|^2\) (309)


    where \(\mathbf{X} \in \mathbb{R}^{n \times p}\) is the design matrix, with rows
    \(\mathbf{x}_i^T\), and \(\mathbf{y} \in \mathbb{R}^n\) is the vector of target
    values. The solution to this problem, without any regularization, is given by
    the ordinary least squares'
