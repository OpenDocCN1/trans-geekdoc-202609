    At each step of backpropagation, the chain rule is applied recursively to propagate
    the error backward through the network, adjusting each weight and bias to minimize
    the total loss. The derivative of the activation function $\sigma^{(l)''}(z^{(l)})$
    is critical, as it dictates how the error is modulated at each layer. Depending
    on the choice of activation function (e.g., ReLU, sigmoid, or tanh), the derivative
    will take different forms, and this choice has a direct impact on the learning
    dynamics and convergence rate of the network. Thus, backpropagation serves as
    the computational backbone of neural network training. By calculating the gradients
    of the loss function with respect to the network parameters through efficient
    error propagation, backpropagation allows the network to adjust its parameters
    iteratively, gradually minimizing the error and improving its performance across
    tasks. This process is mathematically rigorous, utilizing fundamental principles
    of calculus and optimization, ensuring that the neural network learns effectively
    from its training data.


    # 6.2 Gradient Descent Variants


    The training of neural networks using gradient descent and its variants is a mathematically
    intensive process that aims to minimize a differentiable scalar loss function
    $\mathcal{L}(\boldsymbol{\theta})$, where $\boldsymbol{\theta}$ represents the
    parameter vector of the neural network. The loss function is often expressed as


    $$ \mathcal{L}(\boldsymbol{\theta}) = \frac{1}{N} \sum_{i=1}^N \ell(\boldsymbol{\theta};
    \boldsymbol{x}_i, y_i), $$ (240)


    where $(\boldsymbol{x}_i, y_i)$ are the input-output pairs in the training dataset
    of size $N$, and $\ell(\boldsymbol{\theta}; \boldsymbol{x}_i, y_i)$ is the sample-specific
    loss. The minimization problem is solved iteratively, starting from an initial
    guess $\boldsymbol{\theta}^{(0)}$ and updating according to the rule


    $$ \boldsymbol{\theta}^{(k+1)} = \boldsymbol{\theta}^{(k)} - \eta \nabla_{\boldsymbol{\theta}}
    \mathcal{L}(\boldsymbol{\theta}), $$ (241)


    where $\eta > 0$ is the learning rate, and $\nabla_{\boldsymbol{\theta}} \mathcal{L}(\boldsymbol{\theta})$
    is the gradient of the loss with respect to $\boldsymbol{\theta}$. The gradient,
    computed via backpropagation, follows the chain rule and propagates through the
    network''s layers to adjust weights and biases optimally. In a feedforward neural
    network with $L$ layers, the computations proceed as follows. The input to layer
    $l$ is


    $$ \boldsymbol{z}^{(l)} = \boldsymbol{W}^{(l)} \boldsymbol{a}^{(l-1)} + \boldsymbol{b}^{(l)},
    $$ (242)


    where $\boldsymbol{W}^{(l)} \in \mathbb{R}^{n_l \times n_{l-1}}$ and $\boldsymbol{b}^{(l)}
    \in \mathbb{R}^{n_l}$ are the weight matrix and bias vector for the layer, respectively,
    and $\boldsymbol{a}^{(l-1)}$ is the activation vector from the previous layer.
    The output is then


    $$ \boldsymbol{a}^{(l)} = f^{(l)}(\boldsymbol{z}^{(l)}), $$ (243)


    where $f^{(l)}$ is the activation function. Backpropagation begins with the computation
    of the error at the output layer,


    $$ \boldsymbol{\delta}^{(L)} = \frac{\partial \ell}{\partial \boldsymbol{a}^{(L)}}
    \odot f''^{(L)}(\boldsymbol{z}^{(L)}), $$ (244)


    where $f''^{(L)}(\cdot)$ is the derivative of the activation function. For hidden
    layers, the error propagates recursively as


    $$ \boldsymbol{\delta}^{(l)} = (\boldsymbol{W}^{(l+1)})^\top \boldsymbol{\delta}^{(l+1)}
    \odot f''^{(l)}(\boldsymbol{z}^{(l)}). $$ (245)'
