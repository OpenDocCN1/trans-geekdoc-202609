    # ## 7.1 Key Concepts


    A Convolutional Neural Network (CNN) is a deep learning model primarily used for
    analyzing grid-like data, such as images, video, and time-series data with spatial
    or temporal dependencies. The fundamental operation of CNNs is the **convolution**
    operation, which is employed to extract local patterns from the input data. The
    input to a CNN is generally represented as a tensor \(\mathbf{I} \in \mathbb{R}^{H
    \times W \times C}\), where \(H\) is the height, \(W\) is the width, and \(C\)
    is the number of channels (for RGB images, \(C = 3\)).


    At the core of a CNN is the convolutional layer, where the input image \(\mathbf{I}\)
    is convolved with a set of filters or kernels \(\mathbf{K} \in \mathbb{R}^{f_h
    \times f_w \times C}\), where \(f_h\) and \(f_w\) are the height and width of
    the filter, respectively. The filter \(\mathbf{K}\) slides across the input image
    \(\mathbf{I}\), and the result of this convolution is a set of feature maps that
    are indicative of certain local patterns in the image. The element-wise convolution
    at location \((i, j)\) of the feature map is given by:


    \(\mathbf{I} * \mathbf{K} = \sum_{p=1}^{f_h} \sum_{q=1}^{f_w} \sum_{r=1}^{C} \mathbf{I}_{i+p-1,
    j+q-1, r} \cdot \mathbf{K}_{p,q,r}\) (358)


    where \(\mathbf{I}_{i+p-1, j+q-1, r}\) denotes the value of the \(r\)-th channel
    of the input image at position \((i + p - 1, j + q - 1)\), and \(\mathbf{K}_{p,q,r}\)
    is the corresponding filter value at \((p, q, r)\). This operation is done for
    each location \((i, j)\) of the output feature map. The resulting feature map
    \(\mathbf{F}\) has spatial dimensions \(H'' \times W''\), where:


    \(H'' = \left\lfloor \frac{H + 2p - f_h}{s} \right\rfloor + 1, \quad W'' = \left\lfloor
    \frac{W + 2p - f_w}{s} \right\rfloor + 1\) (359)


    where \(p\) is the padding, and \(s\) is the stride of the filter during its sliding
    motion. The convolution operation provides a translation-invariant representation
    of the input image, as each filter detects patterns across the entire image. After
    this convolution, a non-linear activation function, typically the **Rectified
    Linear Unit (ReLU)**, is applied to introduce non-linearity into the network and
    ensure it can model complex patterns. The ReLU activation function operates element-wise
    and is given by:


    \(\text{ReLU}(x) = \max(0, x)\) (360)


    Thus, for each feature map \(\mathbf{F}\), the output after ReLU is:


    \(\mathbf{F}''_{i,j,k} = \max(0, \mathbf{F}_{i,j,k})\) (361)


    This ensures that negative values in the feature map are discarded, which helps
    with the sparse representation of activations, mitigating the vanishing gradient
    problem in deeper layers. In CNNs, pooling operations follow the convolution and
    activation layers. Pooling serves to reduce the spatial dimensions of the feature
    maps, thus decreasing computational complexity and making the representation more
    invariant to translations. **Max pooling**, which is the most common form, selects
    the maximum value within a specified window size \(p_h \times p_w\). Given an
    input feature map \(\mathbf{F} \in \mathbb{R}^{H'' \times W'' \times K}\), max
    pooling operates as follows:


    \(\mathbf{P}_{i,j,k} = \max (\mathbf{F}_{i,j,k}, \mathbf{F}_{i+1,j,k}, \mathbf{F}_{i,j+1,k},
    \mathbf{F}_{i+1,j+1,k})\) (362)'
