  md: 'or in the case of a minimization problem:


    $$

    \vec{h}^* = \arg \min_{\vec{h} \in \mathcal{S}} M(\vec{h}, \mathcal{D}_{train},
    \mathcal{D}_{val}).

    $$ (333)


    For each hyperparameter combination, the model is trained on \(\mathcal{D}_{train}\)
    and evaluated on \(\mathcal{D}_{val}\). The process requires the repeated evaluation
    of the model over all \(|\mathcal{S}|\) configurations, each yielding a performance
    metric. To mitigate overfitting and ensure the reliability of the performance
    metric, cross-validation is frequently used. In \(k\)-fold cross-validation, the
    dataset \(\mathcal{D}_{train}\) is partitioned into \(k\) disjoint subsets \(\mathcal{D}_1,
    \mathcal{D}_2, \dots, \mathcal{D}_k\). The model is trained on \(\mathcal{D}_{train}^{(j)}
    = \bigcup_{i \neq j} \mathcal{D}_i\) and validated on \(\mathcal{D}_j\). For each
    fold \(j\), we compute the performance metric:


    $$

    M_j(\vec{h}) = M(\vec{h}, \mathcal{D}_{train}^{(j)}, \mathcal{D}_j).

    $$ (334)


    The overall cross-validation performance for a hyperparameter configuration \(\vec{h}\)
    is the average of the \(k\) individual fold performances:


    $$

    \overline{M}(\vec{h}) = \frac{1}{k} \sum_{j=1}^k M_j(\vec{h}).

    $$ (335)


    Thus, the grid search with cross-validation aims to find the optimal hyperparameters
    by maximizing or minimizing the average performance across all folds. The computational
    complexity of grid search is a key consideration. If we denote \(C\) as the cost
    of training and evaluating the model for a single configuration, the total cost
    for grid search is:


    $$

    \mathcal{O} \left( \prod_{i=1}^p m_i \cdot k \cdot C \right),

    $$ (336)


    where \(k\) represents the number of folds in cross-validation. This results in
    an exponential increase in the total computation time as the number of hyperparameters
    \(p\) and the number of candidate values \(m_i\) increase. For large search spaces,
    grid search can become computationally expensive, making it infeasible for high-dimensional
    hyperparameter optimization problems. To illustrate with a specific example, consider
    two hyperparameters \(h_1\) and \(h_2\) with the following sets of candidate values:


    $$

    \mathcal{H}_1 = \{0.01, 0.1, 1.0\}, \quad \mathcal{H}_2 = \{0.1, 1.0, 10.0\}.

    $$ (337)


    The search space is:


    $$

    \mathcal{S} = \mathcal{H}_1 \times \mathcal{H}_2 = \{(0.01, 0.1), (0.01, 1.0),
    (0.01, 10.0), (0.1, 0.1), \dots, (1.0, 10.0)\}.

    $$ (338)


    There are 9 configurations to evaluate. For each configuration, assume we perform
    3-fold cross-validation, where the performance metrics for the first fold are:


    $$

    M_1(0.1, 1.0) = 0.85, \quad M_2(0.1, 1.0) = 0.87, \quad M_3(0.1, 1.0) = 0.86,

    $$ (339)


    giving the cross-validation performance:


    $$

    \overline{M}(0.1, 1.0) = \frac{1}{3} \sum_{j=1}^3 M_j(0.1, 1.0) = \frac{1}{3}(0.85
    + 0.87 + 0.86) = 0.86.

    $$ (340)


    This process is repeated for all 9 combinations of \(h_1\) and \(h_2\). Grid search,
    while exhaustive and deterministic, can fail to efficiently explore the hyperparameter
    space, especially when the number of hyperparameters is large. The search is confined
    to a discrete grid and cannot interpolate between points to capture optimal configurations
    that may lie between grid values. Furthermore, because grid search evaluates each
    configuration independently, it can be computationally expensive for high-dimensional
    spaces, as the number of configurations grows exponentially with \(p\) and \(m_i\).'
