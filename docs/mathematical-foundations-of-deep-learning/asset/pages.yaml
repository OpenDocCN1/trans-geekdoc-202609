    Bayesian Optimization (BO) is a powerful, mathematically sophisticated method
    for optimizing complex, black-box objective functions, which is particularly useful
    in the context of hyperparameter tuning in machine learning models. These objective
    functions, denoted as $f : \mathcal{X} \rightarrow \mathbb{R}$, are often expensive
    to evaluate due to factors such as time-consuming training of models or noisy
