    # 13.2.3 Statistical Measures


    Statistical measures summarize the properties of data or a probability distribution.
    Some key statistical measures are the mean, variance, standard deviation, and
    skewness.


    A statistical measure is a function M : S → R that assigns a real-valued quantity
    to an element in a statistical space S, where S can represent a dataset, a probability
    distribution, or a stochastic process. Mathematically, a statistical measure must
    satisfy certain properties such as measurability, invariance under transformation,
    and convergence consistency in order to be well-defined. Statistical measures
    can be broadly classified into:


    +   1. Measures of Central Tendency (e.g., mean, median, mode)

    +   2. Measures of Dispersion (e.g., variance, standard deviation, interquartile
    range)

    +   3. Measures of Shape (e.g., skewness, kurtosis)

    +   4. Measures of Association (e.g., covariance, correlation)

    +   5. Information-Theoretic Measures (e.g., entropy, mutual information)


    Each of these measures provides different insights into the characteristics of
    a dataset or a probability distribution. There are several Measures of Central
    Tendency. Given a probability space (Ω, F, P) and a random variable X : Ω → R,
    the expectation (or mean) is defined as:


    $\mathbb{E}[X] = \int_{\Omega} X(\omega) dP(\omega)$ (646)


    If X is a discrete random variable with probability mass function p(x), then:


    $\mathbb{E}[X] = \sum_{x \in \mathbb{R}} xp(x)$ (647)


    If X is a continuous random variable with probability density function f(x), then:


    $\mathbb{E}[X] = \int_{-\infty}^{\infty} xf(x) dx$ (648)


    The median m of a probability distribution is defined as:


    $P(X \le m) \ge \frac{1}{2}, \quad P(X \ge m) \ge \frac{1}{2}$ (649)


    In terms of the cumulative distribution function F(x), the median m satisfies:


    $F(m) = \frac{1}{2}$ (650)'
