    The Sobolev embedding theorem states that:


    \( W^{k,p}(\mathcal{X}) \hookrightarrow C^m(\mathcal{X}), \tag{39} \)


    if \( k - \frac{d}{p} > m \), ensuring \( f_\theta \in C^\infty(\mathcal{X}) \)
    for smooth activations \( \sigma \). For a function \( u \in L^p(\Omega) \), its
    weak derivative \( D^\alpha u \) satisfies:


    \( \int_\Omega u(x)D^\alpha \phi(x) \, dx = (-1)^{|\alpha|} \int_\Omega v(x)\phi(x)
    \, dx \quad \forall \phi \in C_c^\infty(\Omega), \tag{40} \)


    where \( v \in L^p(\Omega) \) is the weak derivative. This definition extends
    the classical notion of differentiation to functions that may not be pointwise
    differentiable. The Sobolev norm encapsulates both function values and their derivatives:


    \( \|u\|_{W^{k,p}(\Omega)} = \left( \sum_{|\alpha| \leq k} \| D^\alpha u \|_{L^p(\Omega)}^p
    \right)^{1/p}. \tag{41} \)


    Key properties:


    +   • **Semi-norm Dominance**: The \( W^{k,p} \).norm is controlled by the seminorm
    \( |u|_{W^{k,p}} \), ensuring sensitivity to high-order derivatives.


    +   • **Poincaré Inequality**: For \( \Omega \) bounded, \( u - u_\Omega \) satisfies:


    \( \|u - u_\Omega\|_{L^p} \leq C \| Du \|_{L^p}. \tag{42} \)


    Sobolev spaces \( W^{k,p}(\Omega) \) emed into \( L^q(\Omega) \) or \( C^m(\overline{\Omega})
    \), depending on \( k, p, q \), and \( n \). These embeddings govern the smoothness
    and integrability of \( u \) and its derivatives. There are several Advanced Theorems
    on Sobolev Embeddings. They are as follows:


    +   1. **Sobolev Embedding Theorem**: Let \( \Omega \subset \mathbb{R}^n \) be
    a bounded domain with Lipschitz boundary. Then:


    +   • If \( k > n/p \), \( W^{k,p}(\Omega) \hookrightarrow C^{m,\alpha}(\overline{\Omega})
    \) with \( m = \lfloor k - n/p \rfloor \) and \( \alpha = k - n/p - m \).


    +   • If \( k = n/p \), \( W^{k,p}(\Omega) \hookrightarrow L^q(\Omega) \) for
    \( q < \infty \).


    +   • If \( k < n/p \), \( W^{k,p}(\Omega) \hookrightarrow L^q(\Omega) \) where
    \( \frac{1}{q} = \frac{1}{p} - \frac{k}{n} \).


    +   2. **Rellich-Kondrachov Compactness Theorem**: The embedding \( W^{k,p}(\Omega)
    \hookrightarrow L^q(\Omega) \) is compact for \( q < \frac{np}{n-kp} \). Compactness
    follows from:


    +   (a) **Equicontinuity**: \( W^{k,p} \).boundedness ensures uniform control
    over oscillations.


    +   (b) **Rellich''s Selection Principle**: Strong convergence follows from uniform
    estimates and tightness.


    The Proof of Sobolev Embedding starts with the Scaling Analysis.Define \( u_\lambda(x)
    = u(\lambda x) \). Then:


    \( \| u_\lambda \|_{L^p(\Omega)} = \lambda^{-n/p} \| u \|_{L^p(\lambda^{-1} \Omega)}.
    \tag{43} \)


    For derivatives:


    \( \| D^\alpha u_\lambda \|_{L^p(\Omega)} = \lambda^{|\alpha| - n/p} \| D^\alpha
    u \|_{L^p(\lambda^{-1} \Omega)}. \tag{44} \)'
