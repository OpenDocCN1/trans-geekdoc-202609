    flexibility and performance in a wide range of applications.


    # 5.3 Activation Functions


    In the context of **neural networks**, activation functions serve as an essential
    component that enables the network to approximate complex, non-linear mappings.
    When a neural network processes input data, each neuron computes a weighted sum
    of the inputs and then applies an activation function \( \sigma(z) \) to produce
    the output. Mathematically, let the input vector to the neuron be \( \mathbf{x}
    = (x_1, x_2, \dots, x_n) \), and let the weight vector associated with these inputs
    be \( \mathbf{w} = (w_1, w_2, \dots, w_n) \). The corresponding bias term is denoted
    as \( b \). The net input \( z \) to the activation function is then given by:


    \( z = \mathbf{w}^\top \mathbf{x} + b = \sum_{i=1}^n w_i x_i + b \) (200)


    where \( \mathbf{w}^\top \mathbf{x} \) represents the dot product of the weight
    vector and the input vector. The activation function \( \sigma(z) \) is then applied
    to this net input to obtain the output of the neuron \( a \):


    \( a = \sigma(z) = \sigma \left( \sum_{i=1}^n w_i x_i + b \right).\) (201)'
