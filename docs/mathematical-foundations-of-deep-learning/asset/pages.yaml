    ```

    $$\mathcal{R}(f) = \int_{\mathcal{X} \times \mathcal{Y}} \ell(f(x), y) dP(x, y),
    \quad (2)$$

    ```


    where:


    +   - \( f \) belongs to a hypothesis space \(\mathcal{F} \subseteq L^p(\mathcal{X},
    \mu_X)\).

    +   - \( P(x, y) \) is a Borel probability measure over \(\mathcal{X} \times \mathcal{Y}\),
    satisfying \(\int_{\mathcal{X} \times \mathcal{Y}} 1 dP = 1\).


    # 1.1.2 Risk as a Functional


    Literature Review: Wang et. al. (2025) [11] developed a mathematical risk model
    based on functional variational calculus and introduced a loss functional regularization
    framework that minimizes adversarial risk in deep learning models. They also proposed
    a game-theoretic interpretation of functional risk in security settings. Duim
    and Mesquita (2025) [12] extended the inverse reinforcement learning (IRL) framework
    by defining risk as a functional over probability spaces and used Bayesian functional
    priors to model risk-sensitive behavior. They also introduced an iterative regularized
    risk functional minimization approach. Khayat et. al. (2025) [13] established
    functional Sobolev norms to quantify risk in adversarial settings and introduced
    a functional risk decomposition technique using deep neural architectures. They
    also provided an in-depth theoretical framework for risk estimation in adversarially
    perturbed networks. Agrawal (2025) [14] developed a variational framework for
    risk as a loss functional and used adaptive weighting of loss functions to enhance
    generalization in deep learning. He also provided rigorous convergence analysis
    of risk functional minimization. Hailmichael and Ayaleew (2025) [15] used control
    barrier function (CBF) theory to develop risk-aware deep learning models and modeled
    risk as a functional on dynamical systems, optimizing stability and robustness.
    They also introduced a risk-minimizing constrained optimization formulation. Nguyen
    et.al. (2025) [16] developed a functional metric learning approach for risk-sensitive
    deep models and used convex optimization techniques to derive functional risk
    bounds. They also established semi-supervised loss functions for risk-regularized
    learning. Luo et. al. (2025) [17] introduced a geometric interpretation of risk
    functionals in deep learning models and used integral transform techniques to
    approximate risk in real-world vision systems. They also developed a functional
    approach to adversarial robustness.


    The functional \(\mathcal{R} : \mathcal{F} \rightarrow \mathbb{R}_+\) is Fréchet-differentiable
    if:


    ```

    $$\forall f, g \in \mathcal{F}, \quad \mathcal{R}(f + \epsilon g) = \mathcal{R}(f)
    + \epsilon \langle \nabla \mathcal{R}(f), g \rangle + o(\epsilon), \quad (3)$$

    ```


    where \(\langle \cdot, \cdot \rangle\) denotes the inner product in \(L^2(\mathcal{X})\).
    In the field of risk management and decision theory, the concept of a **risk functional**
    is a mathematical formalization that captures how risk is quantified for a given
    outcome or state. A risk functional, denoted as \(\mathcal{R}\), acts as a map
    that takes elements from a given space \(X\) (which represents the possible outcomes
    or states) and returns a real-valued risk measure. This risk measure, \(\mathcal{R}(x)\),
    expresses the degree of risk or the adverse outcome associated with a particular
    element \(x \in X\). The space \(X\) may vary depending on the context—this could
    be a space of random variables, trajectories, or more complex function spaces.
    The risk functional maps \(x\) to \(\mathbb{R}\), i.e., \(\mathcal{R} : X \rightarrow
    \mathbb{R}\), where each \(\mathcal{R}(x)\) reflects the risk associated with
    the specific realization \(x\). One of the most foundational forms of risk functionals
    is based on the'
