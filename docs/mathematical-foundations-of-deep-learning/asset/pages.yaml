    # 3.1.1 Hessian Structure


    The Hessian matrix, \(H(\theta) = \nabla_\theta^2 \mathcal{L}(\theta)\), serves
    as a critical construct in the mathematical framework of optimization, capturing
    the second-order partial derivatives of the loss function \(\mathcal{L}(\theta)\)
    with respect to the parameter vector \(\theta \in \mathbb{R}^d\). Each element
    \(H_{ij} = \frac{\partial^2 \mathcal{L}(\theta)}{\partial \theta_i \partial \theta_j}\)
    reflects the curvature of the loss surface along the \((i, j)\)-direction. The
    symmetry of \(H(\theta)\), guaranteed by the Schwarz theorem under the assumption
    of continuous second partial derivatives, implies \(H_{ij} = H_{ji}\). This property
    ensures that the eigenvalues \(\lambda_1, \lambda_2, \dots, \lambda_d\) of \(H(\theta)\)
    are real and the eigenvectors \(\mathbf{v}_1, \mathbf{v}_2, \dots, \mathbf{v}_d\)
    are orthogonal, satisfying the eigenvalue equation


    \(H(\theta)\mathbf{v}_i = \lambda_i \mathbf{v}_i \quad \text{for all } i. \quad
    (111)\)


    The behavior of the loss function around a specific parameter value \(\theta_0\)
    can be rigorously analyzed using a second-order Taylor expansion. This expansion
    is given by:


    \(\mathcal{L}(\theta) = \mathcal{L}(\theta_0) + (\theta - \theta_0)^\top \nabla_\theta
    \mathcal{L}(\theta_0) + \frac{1}{2}(\theta - \theta_0)^\top H(\theta_0)(\theta
    - \theta_0) + \mathcal{O}(\|\theta - \theta_0\|^3). \quad (112)\)


    Here, the term \((\theta - \theta_0)^\top \nabla_\theta \mathcal{L}(\theta_0)\)
    represents the linear variation of the loss, while the quadratic term \(\frac{1}{2}(\theta
    - \theta_0)^\top H(\theta_0)(\theta - \theta_0)\) describes the curvature effects.
    The eigenvalues of \(H(\theta_0)\) dictate the nature of the critical point \(\theta_0\).
    Specifically, if all \(\lambda_i > 0\), \(\theta_0\) is a local minimum; if all
    \(\lambda_i < 0\), it is a local maximum; and if the eigenvalues have mixed signs,
    \(\theta_0\) is a saddle point. The leading-order approximation to the change
    in the loss function, \(\Delta \mathcal{L} \approx \frac{1}{2} \delta \theta^\top
    H(\theta_0) \delta \theta\), highlights the dependence on the eigenstructure of
    \(H(\theta_0)\). In the context of gradient descent, parameter updates follow
    the iterative scheme:


    \(\theta^{(t+1)} = \theta^{(t)} - \eta \nabla_\theta \mathcal{L}(\theta^{(t)}),
    \quad (113)\)


    where \(\eta\) is the learning rate. Substituting the Taylor expansion of \(\nabla_\theta
    \mathcal{L}(\theta^{(t)})\) around \(\theta_0\) gives:


    \(\theta^{(t+1)} = \theta^{(t)} - \eta \left[ \nabla_\theta \mathcal{L}(\theta_0)
    + H(\theta_0)(\theta^{(t)} - \theta_0) \right]. \quad (114)\)


    To analyze this update rigorously, we project \(\theta^{(t)} - \theta_0\) onto
    the eigenbasis of \(H(\theta_0)\), expressing it as:


    \(\theta^{(t)} - \theta_0 = \sum_{i=1}^d c_i^{(t)} \mathbf{v}_i, \quad (115)\)'
