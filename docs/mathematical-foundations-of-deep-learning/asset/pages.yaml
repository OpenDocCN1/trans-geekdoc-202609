    the data around zero. While the tanh function overcomes some of the vanishing
    gradient issues associated with the sigmoid function, it still suffers from the
    problem for large \(|z|\), where the gradients approach zero. The **Rectified
    Linear Unit (ReLU)** is another commonly used activation function. It is defined
    as:


    \(\text{ReLU}(z) = \max(0, z),\tag{209}\)


    with derivative:


    \(\text{ReLU}''(z) = \begin{cases} 1, & z > 0, \\ 0, & z \le 0. \end{cases}\tag{210}\)


    ReLU is particularly advantageous because it is computationally efficient, as
    it only requires a comparison to zero. Moreover, for positive values of \(z\),
    the derivative is constant and equal to 1, which helps avoid the vanishing gradient
    problem. However, ReLU can suffer from the *dying ReLU problem*, where neurons
    output zero for all inputs if the weights are initialized poorly or if the learning
    rate is too high, leading to inactive neurons that do not contribute to the learning
    process. To address the dying ReLU problem, the **Leaky ReLU** activation function
    is introduced, defined as:


    \(\text{Leaky ReLU}(z) = \begin{cases} z, & z > 0, \\ \alpha z, & z \le 0, \end{cases}\tag{211}\)


    where \(\alpha\) is a small constant, typically chosen to be 0.01. The derivative
    of the Leaky ReLU is:


    \(\text{Leaky ReLU}''(z) = \begin{cases} 1, & z > 0, \\ \alpha, & z \le 0. \end{cases}\tag{212}\)


    Leaky ReLU ensures that neurons do not become entirely inactive by allowing a
    small, non-zero gradient for negative values of \(z\). Finally, for classification
    tasks, particularly when there are multiple classes, the **Softmax** activation
    function is often used in the output layer of the neural network. The Softmax
    function is defined as:


    \(\text{Softmax}(z_i) = \frac{e^{z_i}}{\sum_{j=1}^m e^{z_j}},\tag{213}\)


    where \(z_i\) is the input to the \(i\)-th neuron in the output layer, and the
    denominator ensures that the outputs sum to 1, making them interpretable as probabilities.
    The Softmax function is typically used in multi-class classification problems,
    where the network must predict one class out of several possible categories.


    In summary, activation functions are a vital component of neural networks, enabling
    them to learn intricate patterns in data, allowing for the successful application
    of neural networks to diverse tasks. Different activation functions—such as sigmoid,
    tanh, ReLU, Leaky ReLU, and Softmax—each offer distinct advantages and limitations,
    and their choice significantly impacts the performance and training dynamics of
    the neural network.'
