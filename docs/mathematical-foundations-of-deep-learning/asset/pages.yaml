  md: '# ### 13.1.3 Eigenvalues and Eigenvectors


    **Definition:** For a square matrix $A \in \mathbb{F}^{n \times n}$, an eigenvalue
    $\lambda$ and eigenvector $\mathbf{v} \neq 0$ satisfy:


    ```

    $A\mathbf{v} = \lambda\mathbf{v}$

    (631)

    ```


    **Characteristic Equation:** The eigenvalues are found by solving:


    ```

    $\det(A - \lambda I) = 0$

    (632)

    ```


    which gives an $n$-th degree polynomial in $\lambda$. The set of all solutions
    $\mathbf{v}$ to $(A - \lambda I)\mathbf{v} = 0$ is the eigenspace associated with
    $\lambda$.


    # ### 13.1.4 Singular Value Decomposition (SVD)


    **Definition:** For any $A \in \mathbb{F}^{m \times n}$, the **Singular Value
    Decomposition** (SVD) states:


    ```

    $A = U\Sigma V^T$

    (633)

    ```


    where $U \in \mathbb{F}^{m \times m}$ is orthogonal ($U^T U = I$), $V \in \mathbb{F}^{n
    \times n}$ is orthogonal ($V^T V = I$), $\Sigma$ is an $m \times n$ diagonal matrix:


    ```

    $\Sigma = \begin{bmatrix} \sigma_1 & 0 & \cdots & 0 \\ 0 & \sigma_2 & \cdots &
    0 \\ \vdots & \vdots & \ddots & \vdots \\ 0 & 0 & \cdots & \sigma_r \end{bmatrix}$

    (634)

    ```


    where $\sigma_i$ are the **singular values**, given by:


    ```

    $\sigma_i = \sqrt{\lambda_i}$

    (635)

    ```


    where $\lambda_i$ are the eigenvalues of $A^T A$.


    # ## 13.2 Probability and Statistics


    # ### 13.2.1 Probability Distributions


    A **probability distribution** is a mathematical function that provides the probabilities
    of occurrence of different possible outcomes in an experiment. A random variable
    $X$ can take values from a sample space $S$, and the probability distribution
    describes how the probabilities are distributed over these possible outcomes.


    **Discrete Probability Distributions:** For a discrete random variable $X$, which
    takes values from a countable set, the **probability mass function** (PMF) is
    defined as:


    ```

    $P(X = x_i) = p(x_i), \quad \forall x_i \in S$

    (636)

    ```


    The PMF satisfies the following properties:


    +   * $0 \le p(x_i) \le 1$ for each $x_i \in S$.


    +   * The sum of probabilities across all possible outcomes is 1:


    ```

    $\sum_{x_i \in S} p(x_i) = 1$

    (637)

    ```'
