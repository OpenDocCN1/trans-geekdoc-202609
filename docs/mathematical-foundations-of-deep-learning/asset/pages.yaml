    The training dynamics of the parameters are described by:


    \( \frac{d\theta}{dt} = -\nabla_\theta \mathcal{L}(\theta) , \quad (119) \)


    which, under the NTK approximation, becomes:


    \( \frac{d\theta}{dt} = -K \nabla_\theta \mathcal{L}(\theta) , \quad (120) \)


    where \(K\) is the NTK matrix evaluated at initialization. The evolution of the
    loss function is governed by the eigenvalues of \(K\), which control the rate
    of convergence in different directions.


    The spectral properties of the Hessian play a pivotal role in the generalization
    properties of neural networks. Empirical studies reveal that the eigenvalue spectrum
    of \(H(\theta)\) often exhibits a "bulk-and-spike" structure, with a dense bulk
    of eigenvalues near zero and a few large outliers. The bulk corresponds to flat
    directions in the loss landscape, which contribute to the robustness and generalization
    of the model, while the spikes represent sharp directions associated with overfitting.
    This spectral structure can be analyzed using random matrix theory, where the
    density of eigenvalues \(\rho(\lambda)\) is modeled by distributions such as the
    Marchenko-Pastur law:


    \( \rho(\lambda) = \frac{1}{2\pi\lambda q} \sqrt{(\lambda_+ - \lambda)(\lambda
    - \lambda_-)} , \quad (121) \)


    where \(\lambda_\pm = (1 \pm \sqrt{q})^2\) are the spectral bounds and \(q = \frac{d}{n}\)
    is the ratio of the number of parameters to the number of data points. This rigorous
    analysis links the Hessian structure to both the optimization dynamics and the
    generalization performance of neural networks, providing a comprehensive mathematical
    understanding of the training process. The Hessian \(H(\theta)\) satisfies:


    \( H(\theta) = \nabla_\theta^2 \mathcal{L}(\theta) = \mathbb{E}_{(x,y)} \left[
    \nabla_\theta f_\theta(x) \nabla_\theta f_\theta(x)^\top \right] . \quad (122)
    \)


    For overparameterized networks, \(H(\theta)\) is nearly degenerate, implying the
    existence of flat minima.


