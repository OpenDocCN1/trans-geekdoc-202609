    diagnostic information from non-contrast images, reducing the need for invasive
    procedures. Nguyen et al. (2025) [209] presented a multi-view tumor region-adapted
    synthesis model for mammograms using CNNs. The approach enhances breast cancer
    detection by using 3D spatial feature extraction techniques, improving tumor localization
    and classification. Chen et. al. (2025) [210] explored CNN-based denoising for
    medical images using a penalized least squares (PLS) approach. The study applies
    deep learning for noise reduction in MRI scans, leading to improved clarity in
    low-signal-to-noise ratio (SNR) images. Pradhan et al. (2025) [211] discussed
    CNN-based diabetic retinopathy detection. It introduces an Atrous Residual U-Net
    architecture, enhancing image segmentation performance for early-stage diagnosis
    of retinal diseases. Örenç et al. (2025) [212] evaluated ensemble CNN models for
    adenoid hypertrophy detection in X-ray images. It demonstrates transfer learning
    and feature fusion techniques, which improve CNN-based medical diagnostics. Jiang
    et al. (2025) [213] introduced a cross-modal attention network for MRI image denoising,
    particularly effective when some imaging modalities are missing. It highlights
    cross-domain knowledge transfer using CNNs. Al-Haidri et. al. (2025) [214] developed
    a CNN-based framework for automatic myocardial fibrosis segmentation in cardiac
    MRI scans. It emphasizes quantitative feature extraction techniques that enhance
    precision in cardiac diagnostics.


    Convolutional Neural Networks (CNNs) have become an indispensable tool in the
    field of medical imaging, driven by their ability to automatically learn spatial
    hierarchies of features directly from image data without the need for handcrafted
    feature extraction. The convolutional layers in CNNs are designed to exploit the
    spatial structure of the input data, making them particularly well-suited for
    tasks in medical imaging, where spatial relationships in images often encode critical
    diagnostic information. The fundamental building block of CNNs, the convolution
    operation, is mathematically expressed as


    ```

    $$S(i, j) = \sum_{m=-k}^{k} \sum_{n=-k}^{k} I(i + m, j + n) \cdot K(m, n),\tag{392}$$

    ```


    where S(i, j) represents the value of the output feature map at position (i, j),
    I(i, j) is the input image, K(m, n) is the convolutional kernel (a learnable weight
    matrix), and k denotes the kernel radius (for example, k = 1 for a 3 \times 3
    kernel). This equation fundamentally captures how local patterns, such as edges,
    textures, and more complex features, are extracted by sliding the kernel across
    the image. The convolution operation is performed for each channel of a multi-channel
    input (e.g., RGB images or multi-modal medical images), and the results are summed
    across channels, leading to multi-dimensional feature maps. For a 3D input tensor,
    the convolution extends to include depth:


    ```

    $$S(i, j, d'') = \sum_{d=1}^{D} \sum_{m=-k}^{k} \sum_{n=-k}^{k} I(i + m, j + n,
    d) \cdot K(m, n, d),\tag{393}$$

    ```


    where D is the depth of the input tensor, and d'' is the depth index of the output
    feature map. CNNs incorporate nonlinear activation functions after convolutional
    layers to introduce nonlinearity into the model, allowing it to learn complex
    mappings. A commonly used activation function is the Rectified Linear Unit (ReLU),
    mathematically defined as


    ```

    $$f(x) = \max(0, x).\tag{394}$$

    ```


    This function ensures sparsity in the activations, which is advantageous for computational
    efficiency and generalization. More advanced activation functions, such as parametric
    ReLU (PReLU), extend this concept by allowing learnable parameters for the negative
    slope:


    ```

    $$f(x) = \begin{cases} x & \text{if } x > 0, \\ ax & \text{if } x \le 0, \end{cases}\tag{395}$$

    ```'
