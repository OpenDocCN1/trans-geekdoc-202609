    # ## 3.2 NTK Regime


    The Neural Tangent Kernel (NTK) regime is a fundamental framework for understanding
    the dynamics of gradient descent in highly overparameterized neural networks.
    Consider a neural network \(f(\mathbf{x}; \boldsymbol{\theta})\) parameterized
    by \(\boldsymbol{\theta} \in \mathbb{R}^P\), where \(P\) represents the total
    number of parameters, and \(\mathbf{x} \in \mathbb{R}^d\) is the input vector.
    For a training dataset \(\{(\mathbf{x}_i, y_i)\}_{i=1}^N\), the loss function
    \(L(t)\) at time \(t\) is given by


    $$L(t) = \frac{1}{2N} \sum_{i=1}^N (f(\mathbf{x}_i; \boldsymbol{\theta}(t)) -
    y_i)^2.$$ (135)


    The parameters evolve according to gradient descent as \(\boldsymbol{\theta}(t
    + 1) = \boldsymbol{\theta}(t) - \eta \nabla_{\boldsymbol{\theta}} L(t)\), where
    \(\eta > 0\) is the learning rate. In the NTK regime, we consider the first-order
    Taylor expansion of the network output around the initialization \(\boldsymbol{\theta}_0\):


    $$f(\mathbf{x}; \boldsymbol{\theta}) \approx f(\mathbf{x}; \boldsymbol{\theta}_0)
    + \nabla_{\boldsymbol{\theta}} f(\mathbf{x}; \boldsymbol{\theta}_0)^\top (\boldsymbol{\theta}
    - \boldsymbol{\theta}_0).$$ (136)


    This linear approximation transforms the nonlinear dynamics of \(f\) into a simpler,
    linearized form. To analyze training, we introduce the Jacobian matrix \(J \in
    \mathbb{R}^{N \times P}\), where \(J_{ij} = \frac{\partial f(\mathbf{x}_i; \boldsymbol{\theta}_0)}{\partial
    \theta_j}\). The vector of outputs \(\mathbf{f}(t) \in \mathbb{R}^N\), aggregating
    predictions over the dataset, evolves as


    $$\mathbf{f}(t) = \mathbf{f}(0) + J(\boldsymbol{\theta}(t) - \boldsymbol{\theta}_0).$$
    (137)


    The NTK \(\Theta \in \mathbb{R}^{N \times N}\) is defined as


    $$\Theta_{ij} = \nabla_{\boldsymbol{\theta}} f(\mathbf{x}_i; \boldsymbol{\theta}_0)^\top
    \nabla_{\boldsymbol{\theta}} f(\mathbf{x}_j; \boldsymbol{\theta}_0).$$ (138)'
