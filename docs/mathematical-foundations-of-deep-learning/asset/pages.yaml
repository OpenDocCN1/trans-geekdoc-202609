- pgno: 127
  md: 'In mathematical terms, conversational AI can be seen as a sequence of transformations
    from one set of words or symbols (the input) to another (the output). The first
    mathematical aspect is *language modeling*, which is crucial for predicting the
    likelihood of word sequences. The probability distribution of a sequence of words
    $w_1, w_2, ..., w_n$ is generally computed using the chain rule of probability:


    $P(w_1, w_2, ..., w_n) = \prod_{i=1}^n P(w_i | w_1, w_2, ..., w_{i-1})$ (580)


    where $P(w_i | w_1, w_2, ..., w_{i-1})$ models the conditional probability of
    the word $w_i$ given all the preceding words. This is a central concept in language
    generation tasks. In traditional *n-gram models*, this conditional probability
    is estimated by considering only a fixed number of previous words. The *bigram*
    model, for instance, assumes that the probability of a word depends only on the
    previous word, leading to:


    $P(w_i | w_1, w_2, ..., w_{i-1}) \approx P(w_i | w_{i-1})$ (581)


    However, more advanced conversational AI systems, such as those based on *recurrent
    neural networks (RNNs)*, attempt to model dependencies over much longer sequences.
    RNNs, in particular, process the input sequence $w_1, w_2, ..., w_n$ recursively
    by maintaining a hidden state $h_t$ that captures the context up to time $t$.
    The hidden state is computed by:


    $h_t = \sigma(W_h h_{t-1} + W_x x_t + b)$ (582)


    where $\sigma$ is a non-linear activation function (e.g., *tanh* or *sigmoid*),
    $W_h, W_x$ are weight matrices, and $b$ is a bias term. While RNNs provide a mechanism
    to capture sequential dependencies, they suffer from the *vanishing gradient*
    problem, particularly for long sequences. To address this issue, *Long Short-Term
    Memory (LSTM)* units and *Gated Recurrent Units (GRUs)* were introduced, with
    special gating mechanisms that help mitigate the loss of information over long
    time horizons. These networks introduce memory cells and gates, which regulate
    the flow of information in the network. For instance, the LSTM memory cell is
    governed by the following equations:


    $f_t = \sigma(W_f x_t + U_f h_{t-1} + b_f), \quad i_t = \sigma(W_i x_t + U_i h_{t-1}
    + b_i), \quad o_t = \sigma(W_o x_t + U_o h_{t-1} + b_o)$ (583)

    $c_t = f_t \cdot c_{t-1} + i_t \cdot \tanh(W_c x_t + U_c h_{t-1} + b_c), \quad
    h_t = o_t \cdot \tanh(c_t)$ (584)


    where $f_t, i_t, o_t$ are the forget, input, and output gates, respectively, and
    $c_t$ represents the cell state, which carries information across time steps.
    The LSTM thus enables better capture of long-range dependencies by controlling
    the flow of information in a more structured way. In more recent times, *transformer
    models* have revolutionized conversational AI by replacing the sequential nature
    of RNNs with parallelized self-attention mechanisms. The transformer model uses
    *multi-head self-attention* to weigh the importance of each word in a sequence
    relative to all other words. The self-attention mechanism computes a weighted
    sum of values $V$ based on queries $Q$ and keys $K$, with the attention being
    computed as:


    $\text{Attention}(Q, K, V) = \text{softmax} \left( \frac{QK^T}{\sqrt{d_k}} \right)
    V$ (585)


    where $d_k$ is the dimension of the key vectors. This operation allows the model
    to attend to all parts of the input sequence simultaneously, enabling better handling
    of long-range dependencies and improving computational efficiency by processing
    sequences in parallel. Unlike RNNs, transformers do not process tokens in a fixed
    order but instead utilize positional encoding to inject sequence order information.
    The positional encoding for position $i$ and dimension $2k$ is given by:


    $PE(i, 2k) = \sin \left( \frac{i}{10000^{2k/d}} \right), \quad PE(i, 2k+1) = \cos
    \left( \frac{i}{10000^{2k/d}} \right)$ (586)'
