- pgno: 101
  md: 'the **vanishing gradients problem**. This issue arises when the gradients propagate
    through many time steps, causing them to decay exponentially, especially when
    using activation functions like tanh. As a result, the influence of distant time
    steps diminishes, making it difficult for the network to learn long-term dependencies.
    The mathematical manifestation of this problem is seen in the norm of the Jacobian
    matrices associated with the hidden state updates. If the spectral radius of the
    weight matrices $W_h$ is close to or greater than 1, the gradients can either
    vanish or explode, leading to unstable training dynamics. To mitigate this issue,
    several solutions have been proposed, including the use of Long Short-Term Memory
    (LSTM) networks and Gated Recurrent Units (GRUs), which introduce gating mechanisms
    to better control the flow of information through the network. LSTMs, for example,
    incorporate a memory cell $C_t$, which allows the network to store information
    over long periods of time. The update rules for the LSTM are governed by three
    gates: the forget gate $f_t$, the input gate $i_t$, and the output gate $o_t$,
    which control how much of the previous memory and new information to retain. The
    equations governing the LSTM are:


    ```

    f_t = \sigma(W_f h_{t-1} + U_f x_t + b_f) (465)


    i_t = \sigma(W_i h_{t-1} + U_i x_t + b_i) (466)


    o_t = \sigma(W_o h_{t-1} + U_o x_t + b_o) (467)


    \tilde{C}_t = \tanh(W_C h_{t-1} + U_C x_t + b_C) (468)


    C_t = f_t \cdot C_{t-1} + i_t \cdot \tilde{C}_t (469)


    h_t = o_t \cdot \tanh(C_t) (470)

    ```


    In these equations, the forget gate $f_t$ determines how much of the previous
    memory cell $C_{t-1}$ to retain, the input gate $i_t$ governs how much new information
    to store in the candidate memory cell $\tilde{C}_t$, and the output gate $o_t$
    controls how much of the memory cell should influence the current output. The
    LSTM''s architecture allows for the maintenance of long-term dependencies by selectively
    forgetting or retaining information, effectively alleviating the vanishing gradient
    problem, and enabling the network to learn from longer sequences. The GRU, an
    alternative to the LSTM, simplifies this architecture by combining the forget
    and input gates into a single update gate $z_t$, and introduces a reset gate $r_t$
    to control the influence of the previous hidden state. The GRU''s update rules
    are:


    ```

    z_t = \sigma(W_z h_{t-1} + U_z x_t + b_z) (471)


    r_t = \sigma(W_r h_{t-1} + U_r x_t + b_r) (472)


    \tilde{h}_t = \tanh(W h_{t-1} + U x_t + b) (473)


    h_t = (1 - z_t) \cdot h_{t-1} + z_t \cdot \tilde{h}_t (474)

    ```


    Here, $z_t$ controls the amount of the previous hidden state $h_{t-1}$ to retain,
    and $r_t$ determines how much of the previous hidden state should influence the
    candidate hidden state $\tilde{h}_t$. The GRU''s simplified structure still allows
    it to effectively capture long-range dependencies while being computationally
    more efficient than the LSTM.


    In summary, sequence modeling in RNNs involves a series of recurrent updates to
    the hidden state, driven by both the current input and the previous hidden state,
    and is trained via backpropagation through time. The introduction of specialized
    gating mechanisms in LSTMs and GRUs alleviates issues such as vanishing gradients,
    enabling the networks to learn and maintain long-term dependencies. Through these
    advanced architectures, RNNs can effectively model complex temporal relationships,
    making them powerful tools for tasks such as time-series prediction, natural language
    processing, and sequence generation.'
