    For \(k > n/p\), Fourier decay implies uniform bounds, ensuring \(u \in C^{m,\alpha}\).
    Interpolation spaces bridge \(L^p\) and \(W^{k,p}\), providing finer embeddings.
    Duality: Sobolev embeddings are equivalent to boundedness of adjoint operators
    in \(L^q\). For \(-\Delta u = f\), \(u \in W^{2,p}(\Omega)\) ensures \(u \in C^{0,\alpha}(\overline{\Omega})\)
    if \(p > n/2\). Sobolev spaces govern variational problems in geometry, e.g.,
    minimal surfaces and harmonic maps. On \(\Omega\) with fractal boundaries, trace
    theorems refine Sobolev embeddings.


    # 1.2.4 Rellich-Kondrachov Compactness Theorem


    The **Rellich-Kondrachov Compactness Theorem** is one of the most fundamental
    and deep results in the theory of Sobolev spaces, particularly in the study of
    functional analysis and the theory of partial differential equations. The theorem
    asserts the compactness of certain Sobolev embeddings under appropriate conditions
    on the domain and the function spaces involved. This result is of immense significance
    in mathematical analysis because it provides a rigorous justification for the
    fact that bounded sequences in Sobolev spaces, under certain conditions, have
    strongly convergent subsequences in lower-order normed spaces. In essence, the
    theorem states that while weak convergence in Sobolev spaces is relatively straightforward
    due to the Banach-Alaoglu theorem, strong convergence is not always guaranteed.
    However, under the assumptions of the Rellich-Kondrachov theorem, strong convergence
    in \(L^q(\Omega)\) can indeed be obtained from boundedness in \(W^{1,p}(\Omega)\).
    The compactness property ensured by this theorem is much stronger than mere boundedness
    or weak convergence and plays a crucial role in proving the existence of solutions
    to variational problems by ensuring that minimizing sequences possess convergent
    subsequences in an appropriate function space. The theorem can also be viewed
    as a generalization of the classical **Arzelà–Ascoli theorem**, extending compactness
    results to function spaces that involve derivatives.


    <u>Literature Review</u>: Lassoued (2026) [51] examined function spaces on the
    torus and their lack of compactness, highlighting cases where the classical Rellich-Kondrachov
