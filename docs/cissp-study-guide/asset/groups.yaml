    # 282 第 5 章 领域 4：通信与网络安全


    - EAP-TLS（扩展认证传输层安全）使用 PKI，需要服务器端和客户端证书。EAP-TLS 建立一个安全的 TLS 隧道进行身份验证。由于使用了 PKI，EAP-TLS
    非常安全，但由于同样的原因，它既复杂又昂贵。EAP 的其他主要版本尝试在不需要客户端证书的情况下创建相同的 TLS 隧道。

    - EAP-TTLS（EAP 隧道传输传输层安全）由 RSA-Soft 和 Cisco 开发，它通过取消客户端需求简化了 EAP-TLS，允许使用其他验证方法（如密码）进行客户端身份验证。因此，EAP-TTLS
    比 EAP-TLS 更容易部署，但在省略客户端证书时安全性较低。

    - PEAP（受保护的 EAP）由 Cisco Systems、微软和 RSA Security 开发，它类似于 EAP-TTLS（并可能被视为其竞争对手），也包括了不需要客户端证书。


    # VPN


    虚拟专用网络（VPN）通过互联网等不安全网络来保护数据。其目标是在虚拟上提供类似于 T1 电路所提供的隐私性。VPN 的核心要素涉及安全身份验证、使用 SHA-1
    提供完整性的加密哈希，以及使用 AES 等加密算法提供机密性。


    > 此处讨论的 VPN 协议的加密细节将在第 4 章领域 3：安全架构与工程中详细介绍。


    # SLIP 和 PPP


    SLIP（串口线路协议）是一种链路层协议，通过串行线路和调制解调器等异步连接提供 IP 连性。当 SLIP 在 1988 年首次时，它首次允许通过调制解调器链路路由数据包（此前，调制解调器主要用于非终端访问）。SLIP
    是一个基础协议，不提供内置的机密性、完整性或身份验证。SLIP 已在大部分退出舞台，被 PPP 代替。


    PPP（点对点协议）是一种在很大程度上取代了 SLIP 的链路层协议。PPP 基于 HDLC（前文讨论过），并通过点对链路增加了机密性、完整性和身份验证。PPP
    在异步链路（如调制解调器）中支持同步链路（如 T1）。


    # PPTP 和 L2TP


    PPTP（点对点隧道协议）通过 IP 隧道化 PPP。它由包括微软、3COM 在内的多个供应商组成的联盟开发。PPTP 使用 GRE（通用路由封装）通过 IP
    传输 PPP，并使用 TCP 作为控制通道（使用 TCP 端口 1723）。


    # 安全通信


    L2TP（链路层隧道协议）结合了 PPTP 和 L2F（链路层转发，设计用于隧道化 PPP）。L2TP 侧重于身份验证且不提供机密性：它经常与 IPsec
    使用以提供加密。与 PPTP 不同，L2TP 也可以用于非 IP 网络（如 ATM）。


    # IPsec


    IPv4 没有内置的机密性；需要使用如 TLS 等更高层协议来提供安全性。为了解决第 3 层缺乏安全性的问题，设计了 IPsec（网际协议安全），为 IPv6
    提供通过加密实现的机密性、完整性和身份验证。IPsec 已移植到 IPv4。IPsec 是一套协议簇，主要的包括封装安全协议（ESP）和身份验证头（AH）。它们各自有一个
    IP 协议号：ESP 是协议 50；AH 是协议 51。


    # 备注


    本章描述了 IPsec、SSL 和 TLS 的网络方面：关于这些协议的加密方面，请参见第 4 章领域 3：安全架构与工程。


    # IPsec 架构


    IPsec 有三种架构：主机到网关、网关到网关和主机到主机。主机到网关模式（也称为客户端模式）用于将一个运行 IPsec 客户端软件的系统连接到 IPsec
    网关。网关到网关模式（也称为点对点）连接两个 IPsec 网关，它们形成一个 IPsec 连接，充当共享的可路由网络连接（类似于 T1）。最后，主机到主机模式通过
    IPsec相互连接两个系统（如文件服务器）。许多现代操作系统（如 Windows 10 或 Ubuntu Linux）可以原生运行 IPsec，允许它们形成主机到网关或主机到主机的连接。


    # 隧道模式与传输模式


    IPsec 可以用于隧道模式或传输模式。隧道模式为整个数据包（包括原始 IP 头部）提供机密性（ESP）和/或身份验证（AH）。会添加新的 IP 头部（带有
    IPsec 网关的源和目的地址）。传输模式保护 IP 数据（第 4-7 层），仅留留原始 IP 头部不受保护。两种模式都会添加额外的 IP 头部（AH 头或
    ESP 头部）。图 5.24 显示了隧道模式和传输模式之间的区别。


    | 原始数据包 | IP 头部 | 数据 |

    |---|---|---|---|

    | 传输模式 | IP 头部 | IPsec 头 (s) | 受保护的数据 |

    | 隧道模式 | 新 IP 头部 | IPsec 头 (s) | 受保护的 IP 头部数据 |


    图 5.24

    IPsec 隧道和传输模式。


    # SSL 和 TLS


    安全套接层（SSL）旨在保护 HTTP（超文本传输协议）数据：HTTPS 使用 TCP 端口 443。TLS 1.0 等于 SSL 版本 3.1。TLS 的当前版本是
    1.3。


    尽管 SSL 已弃用，但 TLS 仍然是保护网络流量的标准。DSL 的优势是它允许同时使用 POTS 线路（通常从 DSL 流量中过滤）。通常情况下，站点距离局端（CO）越近，服务越快。


    # 远程访问


    集成业务数字网络（ISDN）在高速宽带普及之前非常常见。ISDN 通过电话线提供多个通道。基本速率接口（BRI）使用两个 64K 通道，而主速率接口（PRI）使用二十三个
    64K 通道。


    # DSL


    数字用户线路（DSL）通过电话线提供高速数据传输。对称 DSL（SDS）提供相等的上传和下载速度。非对称 DSL（ADSL）提供的下载速度快于上传，这对于大多数用户是足够的。极高速
    DSL（VDSL）提供更高的速度，但受限于距离局端更短。


    # ISDN


    # 回拨与主叫显示


    回拨（Callback）是一种调制解调器认证系统。当创建回拨账户时，调制解调器用户会打电话。用户随后通过调制解调器连接并验证。系统挂断并根据预设号码拨回用户。


    主叫显示（Caller ID）方法类似；除了用户名和密码，它要求从正确的电话号码拨打。主叫显示很容易伪造：许多提供商允许用户选择任何想要的主叫 ID。这使得主叫显示成为身份身份验证的形式。


    # 远程桌面控制台访问


    许多用户需要远程访问计算机的控制台。自然，应该使用通过 IPsec VPN、SSH 或 SSL 隧道进行的某种安全连接来确保连接的机密性，特别是当连接来自组织外部时。关于此远程控制台访问层的更多细节，请参考上面的“VPN”。


    远程访问控制台几十一直是常见做法，例如 UNIX 类操作系统上明文且身份验证薄弱的 login 和 rsh 协议，它们分别利用 TCP 端口 513 和 TCP
    端口 514。


