    [content]

    自形成模式是一种没有中心接入点的点对点模式。通过有线网卡（NIC）连接到互联网的计算机可以发布自形成 WLAN 以允许互联网共享。


    最后，监听模式是一种用于嗅探 WLAN 的只读模式。


    ## SSID 和 MAC 地址过滤


    802.11 WLAN 使用服务集标识符（SSID），它作为网络名称。无线客户端在加入 WLAN 之前就知道 SSID，因此 SSID 是一个配置参数。SSID
    通常是广播的；某些 WLAN 被配置为禁用 SSID 广播，作为一种安全特性。依赖 SSID 的机密性是一种糟糕的安全策略：处于监听模式的无线嗅探器可以检测到客户端加入
    WLAN 时所使用的 SSID；即使禁用了 SSID 广播，这一点也是成立的。


    另一种一种常见的 802.11 无线安全预防措施是通过过滤 MAC 地址来限制客户端访问，只允许受信的客户端访问。这提供了有限的安全性。在 802.11 WLAN
    中，MAC 地址是以明文形式暴露的；受信的 MAC 地址可以被嗅探到，攻击者可能会在软件中用受信的 MAC 地址重新配置非受信设备。然后攻击者可以等待受信设备离开（或对该设备发起
    DoS 攻击），并使用受信 MAC 地址加入网络。


