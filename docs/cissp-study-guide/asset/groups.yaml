    by filtering the MAC address, allowing only trusted clients. This provides limited
    security. MAC addresses are exposed in plaintext on 802.11 WLANs; trusted MACs
    can be sniffed, and an attacker may reconfigure a non-trusted device with a trusted
    MAC address in software. Then the attacker can wait for the trusted device to
    leave (or launch a DoS against the device) and join the network with a trusted
    MAC address.


