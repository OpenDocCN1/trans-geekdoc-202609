    自形成模式（Ad hoc mode）是一种没有中心接入点的点对点模式。通过有线网卡（NIC）连接到互联网的计算机可以发布自形成 WLAN 以允许互联网共享。


    最后，监听模式（monitor mode）是一种用于嗅探 WLAN 的只读模式。


    ## SSID 和 MAC 地址过滤


    802.11 WLAN 使用服务集标识符（SSID），它作为网络名称。无线客户端在加入 WLAN 之前就知道 SSID，因此 SSID 是一个配置参数。SSID
    通常是广播的；某些 WLAN 被配置为禁用 SSID 广播，作为一种安全特性。依赖 SSID 的机密性是一种糟糕的安全策略：处于监听模式的无线嗅探器可以检测到客户端加入
    WLAN 时所使用的 SSID；即使禁用了 SSID 广播，这一点也是成立的。


    另一种常见的 802.11 无线安全预防措施是通过过滤 MAC 地址来限制客户端访问，只允许受信的客户端访问。这提供了有限的安全性。在 802.11 WLAN
    中，MAC 地址是以明文形式暴露的；受信的 MAC 地址可以被嗅探到，攻击者可能会在软件中用受信的 MAC 地址重新配置非受信设备。然后攻击者可以等待受信设备离开（或对该设备发起
    DoS 攻击），并使用受信 MAC 地址加入网络。


    ## WEP


    WEP 是等线传输隐私（Wired Equivalent Privacy）协议，是保护 802.11 无线安全的早期尝试（于 1999 年首次通过）。WEP
    已证明极其极其脆弱：新的攻击可以在几分钟内破解任何 WEP 密钥。WEP 实际上几乎没有提供任何完整性或机密性保护。WEP 被认为已经被破解，并且强烈不建议使用。应该使用
    802.11 中的加密算法和/或其他加密方法（如 VPN）来代替 WEP。


    WEP 设计时，加密出口的监管比现在更严格，其设计初衷是为了避免与当时的法律发生冲突。换句话说，WEP 在密码学上被设计为“不强”，事实证明它比预想的还要弱。WEP
    具有 40 位和 104 位的密钥长度，并使用 RC4 密码。WEP 帧没有时间戳，也没有重放保护：攻击者可以通过重放嗅探到的 WEP 帧来注入流量。


    ## 802.11i


    802.11i 是第一个提供合理安全性的 802.11 无线安全标准。802.11i 描述了鲁棒安全网络（RSN），它允许使用插插认证模块。当发现新漏洞时，RSN
    允许更改加密密码。


    RSN 通常被称为 WPA2（Wi-Fi 保护 2），是 802.11i 的完整实现。默认情况下，WPA2 使用 AES 加密来提供机密性，并使用 CCMP（计数模式
    CBC MAC 协议）来创建消息完整性检查（MIC），从而提供完整性。安全性较低的 WPA（不带“2”）是为那些没有能力实现完整 802.11i 标准的接入点设计的，为
    WEP 提供了更好的安全替代方案。WPA 使用 RC4 提供机密性，使用 TKIP 提供完整性。建议使用 WPA2 而非 WPA。


