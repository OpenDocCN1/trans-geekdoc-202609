    桥接器有两个冲突域。图 5.18 所示网络右侧的网络协议分析仪（非正式地称为“嗅探器”）可以嗅探发往或来自计算机 3 和 4 的流量，但不会嗅探计算机 1
    或 2 的流量（除非发往计算机 3 或 4）。


