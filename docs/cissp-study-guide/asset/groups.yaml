    The exam is simpler and more clear-cut than the real world. There are realworld
    exceptions to statements like “A LAN is typically confined to a building or area
    within one.” The exam will be more clear-cut, as this will. If you read examples
    given in this book, and “that’s usually true, but a bit simplistic,” then you
    are correct. Simplicity is by design, to help you pass the exam.


