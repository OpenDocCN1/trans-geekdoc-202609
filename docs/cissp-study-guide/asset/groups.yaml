    virtualization to afford simpler linear scalability to the storage area network.


    # VoIP


    Voice over Internet Protocol (VoIP) carries voice via data networks, a fundamental
    change from analog POTS (Plain Old Telephone Service), which remains in use after
    100 years. VoIP brings the advantages of packet-switched networks, such as lower
    cost and resiliency, to the telephone.


    Recently, many organizations have maintained at least two distinct networks: a
    phone network and a data network, each with associated maintenance costs. The
    reliability of packet-switched data networks has grown as organizations have made
    substantial investments. With the advent of VoIP, many organizations have lowered
    costs by combining voice and data services on packet-switched networks.


    Common VoIP protocols include Real-time Transport Protocol (RTP), which rely upon
    session and signaling protocols including SIP (Session Initiation Protocol, a
    signaling protocol) and H.323. SRTP (Real-time Transport Protocol) may be used
    to provide secure VoIP, including confidentiality, integrity, and security authentication.


    While VoIP can provide cost advantages (especially for new sets, without a large
    voice investment), there are security concerns. If the network goes down, both
    voice and network data go down. Also, there is no true "out of band" channel for
    wired voice. If an attacker has compromised a network, may be able to compromise
    the confidentiality or integrity of the VoIP calls on that network. VoIP protocols,
    such as RTP, provide little or no security by sniffing with a tool like Wireshark
    (a high-quality free network protocol analyzer, as sees https://www.wireshark.org),
    selecting the "Telephony → VoIP Calls" menu, choosing a call and pressing "Player,"
    as shown in Fig. 5.16.


    Organizations that deploy VoIP must ensure reliability by making sufficient investments
    in their data networks, and in staff expertise to support them. In the event of
    network compromise, use other methods such as cell phones for'
