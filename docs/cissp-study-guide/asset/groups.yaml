  md: "\n# Self-Test 289\n\n## Content Distribution Networks\n\nContent Distribution\
    \ Networks (CDN, also called Content Delivery Networks) use a series of distributed\
    \ caching servers to improve performance and lower the latency of downloaded content.\
    \ They automatically determine the servers closest to end users, download content\
    \ from the fastest and closest servers on the Internet. Examples include Akamai,\
    \ Amazon CloudFront, Cloudflare, and Microsoft Azure.\n\nCDNs also increase availability\
    \ and can reduce the effects of denial-of-service attacks: \"While content delivery\
    \ networks solve all ancillary problems such as improving availability and reducing\
    \ bandwidth, the main problem they address is: the amount of time it takes for\
    \ the host server to receive, process, and deliver on request a page resource\
    \ (images, CSS files, etc.). Latency depends largely on how far away the user\
    \ is from the server, and it’s compounded by the number of resources a web page\
    \ contains.\n\nFor example, if all resources are hosted in San Francisco, and\
    \ a user is visiting your page in London, then each request has to make a long\
    \ round trip from London back to SF. If your web page contains 100 objects (which\
    \ is at the low end of normal), your browser has to make 100 individual requests\
    \ to your server in order to retrieve these objects\" [19].\n\n## Summary of Exam\
    \ Objectives\n\nCommunication and Network Security is a large and complex domain,\
    \ requiring broad and sometimes deep understanding of technical issues. Our world\
    \ relies on networks, and those networks must be kept secure. It is important\
    \ to not only understand why we use concepts like packet-switched networks and\
    \ the OSI model, but also how we implement these concepts.\n\nWe have evolved\
    \ from hubs to switches that provide traffic isolation. We have added detective\
    \ devices such as HIDS and NIDS and preventive devices such as HIPS and NIPS.\
    \ We have deployed secure protocols such as TLS and IPsec.\n\nWe have improved\
    \ our network defense-in-depth every step of the way, and increased the confidentiality,\
    \ integrity, and availability of our network data.\n\n## Self-Test\n\n> Note\n\
    Please see the Self-Test Appendix for explanations of all correct and incorrect\
    \ answers.\n\n- 1. Which protocol should be used for an audio streaming server,\
    \ where some less is acceptable?\n  A. IP\n  B. ICMP\n  C. TCP\n  D. UDP\n\n-\
    \ 2. What network technology uses fixed-length cells to carry data?\n  A. 802.11\n\
    \  B. ATM\n  C. Ethernet\n  D. FDDI\n\n- 3. Secure Shell (SSH) servers listen\
    \ on what port and protocol?\n  A. TCP port 20\n  B. TCP port 21\n  C. TCP port\
    \ 22\n  D. TCP port 23\n\n- 4. Which network cable type can transmit the most\
    \ data at the longest distance?\n  A. Coaxial\n  B. Fiber Optic\n  C. Shielded\
    \ Twisted Pair (STP)\n  D. Unshielded Twisted Pair (UTP)\n\n- 5. Which device\
    \ operates at Layer 2 of the OSI model?\n  A. Hub\n  B. Firewall\n  C. Switch\n\
    \  D. Router\n\n- 6. What are the names of the OSI model, in order from bottom\
    \ to top?\n  A. Physical, Data Link, Transport, Network, Session, Presentation,\
    \ Application\n  B. Physical, Network, Data Link, Transport, Session, Presentation,\
    \ Application\n  C. Physical, Data Link, Network, Transport, Session, Presentation,\
    \ Application\n  D. Physical, Data Link, Network, Transport, Presentation, Application\n\
    \n- 7. Which of the following authentication protocols uses a three-way authentication\
    \ handshake?\n  A. CHAP\n  B. EAP\n  C. Kerberos\n  D. PAP\n\n- 8. Restricting\
    \ Bluetooth device discovery relies on the secrecy of what?\n  A. MAC Address\n\
    \  B. Symmetric Key\n  C. Private Key\n  D. Public Key\n\n- 9. Which wireless\
    \ security protocol is also known as the RSN (Robust Network), and implements\
    \ the full 802.11i standard?\n  A. AES\n  B. WEP\n  C. WPA\n  D. WPA2\n\n- 10.\
    \ What is the correct order of TCP/IP encapsulation?\n  A. Data, segments, packets,\
    \ frames, bits\n  B. Data, frames, segments, packets, bits\n  C. Data, frames,\
    \ packets, segments, bits\n  D. Data, packets, segments, frames, bits\n\n- 11.\
    \ Which transmission mode is supported by both HDLC and SDLC?\n  A. Asynchronous\
    \ Balanced Mode (ABM)\n  B. Asynchronous Response Mode (ARM)\n  C. Normal Balanced\
    \ Mode (NBM)\n  D. Normal Response Mode (NRM)\n\n- 12. What is the most secure\
    \ type of EAP?\n  A. EAP-TLS\n  B. EAP-TTL\n  C. LEAP\n  D. PEAP\n\n- 13. What\
    \ WAN Protocol has no error recovery, relying on higher-level protocols to provide\
    \ reliability?\n  A. ATM\n  B. Frame Relay\n  C. SMDS\n  D. X.25\n\n- 14. What\
    \ frequencies are used by ZigBee in the United States?\n  A. 784 MHz and 2.4 MHz\n\
    \  B. 868 MHz and 2.4 MHz\n  C. 915 MHz and 2.4 MHz\n  D. 2.4 MHz\n\n- 15. Access\
    \ an IPv6 network via an IPv4 network is called?\n  A. CIDR\n  B. NAT\n  C. Translation\n\
    \  D. Tunneling\n\n## Self-Test Quick Answer Key\n\n1. D\n2. B\n3. C\n4. B\n5.\
    \ C\n6. C\n7. A\n8. A\n9. D\n10. C\n11. A\n12. A\n13. B\n14. C\n15. D\n\n## References\n\
    \n- [1] Brief History of the Internet. https://www.isoc.org/internet/history/brief-history-internet/\
    \ (Accessed 19 May 2022).\n- [2] Northcott, J. Intrusion Detection, third ed.,\
    \ Boston, MA, 2003.\n- [3] RFC 791—Transmission Protocol, Darpa Internet, Specification.\
    \ https://www.rfc-editor.org/rfc791.txt. (Accessed 19 May 2022).\n- [4] RFC 2460—Internet\
    \ Protocol, Version 6 (IPv6) Specification. https://www.rfc-editor.org/rfc2460.txt.\
    \ (Accessed 19 May 2022).\n- [5] RFC 793—Transmission Control Protocol, Darpa\
    \ Internet, Specification. https://www.rfc-editor.org/rfc793.txt (Accessed 19\
    \ May 2022).\n- [6] RFC 3540—Explicit Congestion Notification (ECN) Signaling\
    \ with Nonces. https://www.rfc-editor.org/rfc3540.txt. (Accessed 19 May 2022).\n\
    - [7] RFC 768—User Datagram Protocol. https://www.rfc-editor.org/rfc768.txt. (Accessed\
    \ 19 May 2022).\n- [8] Smart Grid. https://www.energy.gov/oe/activities/technology-development/grid-enrollment-and-smart-grid.\
    \ (Accessed 19 May 2022).\n- [9] DNP3 Protocol. https://www.dnp.org/Portals/0/AboutUs/DNP3PrimerVersion.pdf.\
    \ (Accessed 19 May 2022).\n- [10] What is SD-WAN? https://www.arubanetworks.com/faq/what-is-sd-wan/\
    \ (Accessed 19 May 2022).\n- [11] What is SDN and when software-defined networking\
    \ is useful. https://www.networkworld.com/article/330913/what-sdn-is-and-where-is-going.html.\
    \ (Accessed 19 May 2022).\n- [12] What is VXLAN? https://www.viper.net/us/en/research-topics/what-is-vxlan.html.\
    \ (Accessed 19 May 2022).\n- [13] ZigBee-Wireless Mesh Networks for Building Automation\
    \ and Control. https://www.nist.gov/publications/zigbee-wireless-mesh-networks-building-automation-and-control.\
    \ (Accessed 19 May 2022).\n- [14] What is LiFi? https://lififi.com/what-is-lififi.\
    \ (Accessed 19 May 2022).\n- [15] 5G Network: Capabilities and Challenges for\
    \ an Evolving Network. https://www.gao.gov/products/ga-21-26sp. (Accessed 19 May\
    \ 2022).\n- [16] Satellite internet latency: What's the big deal? https://www.viasat.com/about/newsroom/blog/satellite-internet-latency-whats-the-big-deal/\
    \ (Accessed 19 May 2022).\n- [17] Cisco Smart Net Total Care Service Data Sheet.\
    \ https://www.cisco.com/c/en/us/products/collateral/cloud-systems-management/smart-net-total-care/datasheet-c78-735459.html.\
    \ (Accessed 19 May 2022).\n- [18] DSL and Cable Modem Networks. https://www.ciscopress.com/articles/article.asp?p=31289.\
    \ (Accessed 19 May 2022).\n- [19] I Already Use a CDN. Why Do I Need Front-End\
    \ Performance Optimization? https://blog.radware.com/applicationdelivery/applicationaccelerationoptimization/2013/08/cdn-front-end-performance-optimization/.\
    \ (Accessed 19 May 2022).\n"
  mdcn: "\n\n# 自测题 289\n\n## 内容分发网络\n\n内容分发网络（CDN，也称为内容交付网络）使用一系列分布式缓存服务器来提高性能并降低下载内容的延迟。它们会自动确定距离终端用户最近的服务器，从互联网上最快且最近的服务器下载内容。示例包括\
    \ Akamai、Amazon CloudFront、Cloudflare 和 Microsoft Azure。\n\nCDN 还可以提高可用性，并减少拒绝服务攻击（DoS）的影响：“虽然内容交付网络解决了如提高可用性和减少带宽在内的所有辅助问题，但它们解决的主要问题是：主机服务器接收、处理并按请求交付页面资源（图像、CSS\
    \ 文件等）所需的时间。延迟在很大程度上取决于用户距离服务器有多远，并且会随着网页所包含的资源数量而加剧。\n\n例如，如果所有资源都托管在旧金山，而用户在伦敦访问您的页面，那么每个请求都必须完成从伦敦返回旧金山的长途往返。如果你的网页包含\
    \ 100 个对象（处于正常范围的低端），你的浏览器必须向你的服务器发送 100 次单独请求来获取这些对象” [19]。\n\n## 考试目标总结\n\n\
    通信与网络安全是一个庞大且复杂的领域，需要对技术问题有广泛且有时深入的理解。我们的世界依赖网络，而这些网络必须保持安全。不仅要理解我们为什么要使用分组交换网络和\
    \ OSI 模型等概念，还要理解我们如何实现这些概念。\n\n我们已经从集线器（hubs）进化到了提供流量隔离的交换机（switches）。我们增加了如 HIDS\
    \ 和 NIDS 等检测设备，以及如 HIPS 和 NIPS 等预防设备。我们部署了如 TLS 和 IPsec 等安全协议。\n\n我们在每一步都改进了网络深度防御，并增加了网络数据的机密性、完整性和可用性。\n\
    \n## 自测题\n\n> 注意\n请参阅自测附录以获取对所有正确和错误答案的解释。\n\n- 1. 对于允许少量丢包的音频流媒体服务器，应该使用哪种协议？\n\
    \  A. IP\n  B. ICMP\n  C. TCP\n  D. UDP\n\n- 2. 哪种网络技术使用固定长度的单元传输数据？\n  A. 802.11\n\
    \  B. ATM\n  C. 以太网 (Ethernet)\n  D. FDDI\n\n- 3. 安全外壳 (SSH) 服务器监听在哪个端口和协议上？\n\
    \  A. TCP 端口 20\n  B. TCP 端口 21\n  C. TCP 端口 22\n  D. TCP 端口 23\n\n- 4. 哪种类型的电缆可以在最远距离传输最多的数据？\n\
    \  A. 同轴电 (Coaxial)\n  B. 光纤 (Fiber Optic)\n  C. 屏蔽双对 (STP)\n  D. 非屏蔽双对 (UTP)\n\
    \n- 5. 哪种设备运行在 OSI 模型的第 2 层？\n  A. 集线器 (Hub)\n  B. 防火墙 (Firewall)\n  C. 交换机 (Switch)\n\
    \  D. 路由器 (Router)\n\n- 6. OSI 模型从底到上的名称是什么？\n  A. 物理层、数据链路层、传输层、网络层、会话层、表示层、应用层\n\
    \  B. 物理层、网络层、数据链路层、传输层、会话层、表示层、应用层\n  C. 物理层、数据链路层、网络层、传输层、会话层、表示层、应用层\n  D.\
    \ 物理层、数据链路层、网络层、传输层、表示层、应用层\n\n- 7. 以下哪种认证协议使用三路认证握手？\n  A. CHAP\n  B. EAP\n \
    \ C. Kerberos\n  D. PAP\n\n- 8. 限制蓝牙设备发现取决于什么的机密性？\n  A. MAC 地址\n  B. 对称密钥\n \
    \ C. 私钥\n  D. 公钥\n\n- 9. 哪种无线安全协议称为 RSN（健壮网络），并实现了完整的 802.11i 标准？\n  A. AES\n\
    \  B. WEP\n  C. WPA\n  D. WPA2\n\n- 10. TCP/IP 封装的正确顺序是什么？\n  A. 数据、分段、数据包、帧、比特\n\
    \  B. 数据、帧、分段、数据包、比特\n  C. 数据、帧、数据包、分段、比特\n  D. 数据、数据包、分段、帧、比特\n\n- 11. HDLC 和\
    \ SDLC 都支持哪种传输模式？\n  A. 异步平衡模式 (ABM)\n  B. 异步响应模式 (ARM)\n  C. 正常平衡模式 (NBM)\n \
    \ D. 正常响应模式 (NRM)\n\n- 12. 最安全的 EAP 类型是什么？\n  A. EAP-TLS\n  B. EAP-TTL\n  C. LEAP\n\
    \  D. PEAP\n\n- 13. 哪种 WAN 协议没有错误恢复，依赖高层协议提供可靠性？\n  A. ATM\n  B. 帧中继继 (Frame Relay)\n\
    \  C. SMDS\n  D. X.25\n\n- 14. ZigBee 使用哪些频率？\n  A. 784 MHz\n  B. 868 MHz\n  C.\
    \ 915 MHz\n  D. 2.4 MHz\n\n- 15. 通过哪种技术可以访问 IPv6？\n  A. CIDR\n  B. NAT\n  C. 隧道\
    \ (Tunneling)\n  D. 6\n\n## 自测题答案\n\n1. D\n2. B\n3. C\n4. B\n5. C\n6. C\n7. C\n\
    8. A\n9. D\n10. D\n11. A\n12. A\n13. B\n14. D\n15. A\n\n## 参考文献\n\n- [1] 互联网的历史。https://www.isoc.org/Portals/0/AboutUs/brief-history-internet/.\n\
    - [2] Northcott, J. 入侵检测，Boston, MA, 2003。\n- [3] RFC 791—网际协议。https://www.rfc-editor.org/rfc791.\n\
    - [4] RFC 2460—IPv6 标准。https://www.rfc-editor.org/rfc2460.\n- [5] RFC 793—传输控制协议。https://www.rfc-editor.org/rfc793.txt.\n\
    - [6] RFC 3540—显式拥塞通知 (ECN) 带有随机号。https://www.rfc-editor.org/rfc3540.txt.\n- [7]\
    \ RFC 768—用户数据报协议。https://www.rfc-editor.org/rfc768.txt.\n- [8] 智能电网。https://www.energy.gov/oe/activities/technology-development/smart-grid.\n\
    - [9] DNP3 协议。https://www.dnp.org/Portals/0/AboutUs/DNP3Version.pdf.\n- [10] 什么是\
    \ SD-WAN？https://www.arubanetworks.com/faq/what-sd-wan/\n- [11] 什么是 SDN 以及软件定义网络的未来。https://www.networkworld.com/article/330913/what-sdn-and-where-going.\n\
    - [12] 什么是 VXLAN？https://www.viper.net/us/en/research-topics/what-is-vxlan.\n\
    - [13] 用于建筑自动化的 ZigBee 网格网络。https://www.nist.gov/publications/zigbee-wireless-mesh-networks-building-automation-control.\n\
    - [14] 什么是 LiFi？https://lififi.com/what-is-lififi.\n- [15] 5G 网络：演进网络的能力与挑战。https://www.gao.gov/products/ga-21-26sp.\n\
    \n"
