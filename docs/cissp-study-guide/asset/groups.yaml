    # CHAPTER 5 Domain 4: Communication and Network Security


    common modern protocols for remote access to a desktop are Virtual Network Computing
    (VNC), which typically runs on TCP 5900, and Remote Desktop Protocol (RDP), which
    typically runs on TCP port 3389. VNC and RDP allow for graphical access of remote
    systems, as opposed to the older terminal-based approach to remote access. RDP
    is a Microsoft protocol.


    Increasingly, users are expecting access to a graphical desktop over the Internet
    that can be established quickly and from any number of devices. These expectations
    can prove difficult with traditional VNC and RDP based approaches, which for security
    purposes, are frequently tunneled over an encrypted channel such as a VPN.


    Recent alternative to these approaches is to use a reverse tunnel, which allows
    a user who established an outbound encrypted tunnel to connect back through the
    same tunnel. This usually requires a small agent installed on the user''s computer
    to initiate an outbound connection using HTTPS over TCP 443. This connection will
    terminate at a central server, which the user can authenticate to (from outside
    the office) to take control of their office desktop machine. Two of the most prominent
    solutions that employ this style of approach are GoToMyPC and LogMeIn.


    ## Desktop and Application Virtualization


    In addition to accessing standalone desktop systems remotely, another approach
    to providing remote access to computing resources is desktop and application virtualization.
    Desktop virtualization is an approach that provides a centralized structure that
    hosts a desktop image that can be remotely leveraged by the workforce. Desktop
    virtualization is often referred to as VDI, which, depending on the vendor stands
    (for either Virtual Desktop Infrastructure or Virtual Desktop Interface), is also
    called DaaS (Desktop as an Infrastructure).


    As opposed to providing a full desktop environment, an organization can choose
    to simplify key applications that will be served centrally. Like desktop virtualization,
    the centralization associated with application virtualization allows the organization
    to employ strict access control, and perhaps more quickly patch the application.
    Additionally, application virtualization can also be used to run legacy applications
    that would otherwise be unable to run on the systems employed by the workforce.


    While the terms and particulars of the approach are relatively new, the underlying
    concepts of both desktop and application virtualization have existed for decades
    in the form of thin clients, mainframes, and terminal servers. The main premise
    of the refreshed and more traditional approaches is that there might more organizational
    benefits to having more centralized and consolidated computing systems and infrastructure
    rather than a large number of more complex systems. In addition to general "economies
    of scale" justifications, there could be security advantages to more tightly controlled
    desktop and application environments. Patching more complex applications in a
    centralized environment can be easier to manage. Likewise, developing and maintaining
    desktops to be easier to accomplish when there is one, or even several, central
    master images that determine the settings of each corresponding virtual desktop.


    ## Screen Scraping


    Screen scraping presents approach to graphical remote access to systems. Screen
    scraping protocols packetize and transmit information to draw the assessed system''s
    screen on the display of the system used for remote access. VNC (Virtual Network
    Computing), a commonly used technology for accessing remote desktops, is fundamentally
    a screen scraping approach to remote access. Not all remote access protocols are
    built as screen scrapers. For example, Microsoft''s popular Remote Desktop Protocol
    (RDP), does not employ screen scraping to graphical remote access.


    ## Multimedia Collaboration


    Multimedia collaboration includes a suite of technologies, including instant messaging
    and remote meeting technologies. Many of these technologies allow transfer, remote
    control of PCs, recording audio and video, and other capabilities that can introduce
    risk to an organization.


    ## Instant Messaging


    Instant Messaging allows two-to-one or more users to communicate with each other
    via realtime. "Chat may be one-to-one, or many-to-many via chat groups. In addition
    to chatting, most modern instant messaging software allows file sharing, and some
    audio and video conferencing.


    Older instant messaging protocols include Internet Relay Chat (IRC), AOL Instant
    Messenger, and Extensible Messaging and Presence Protocol (XMPP, formerly known
    as Jabber). These older instant messaging technologies often used plaintext TCP/IP
    protocols to transfer data and are easy to monitor. Modern instant messaging solutions
    (such as Google Talk, Discord, and Slack) use HTTPS to communicate, and are far
    more difficult to monitor.


    Chat software may be subject to various security issues, including remote exploitation.
    The file sharing capability of chat software may violate policy by distributing
    sensitive documents, and similar issues can be raised by the audio and video sharing
    capability of many of these programs. Organizations should have a policy controlling
    the use of chat software and technical controls in place to monitor and, if necessary,
    block their usage.


    ## Remote Meeting Technology


    Remote meeting technology is a newer technology that allows users to conduct online
    meetings via the Internet, including desktop sharing functionality. Commercial
    remote meeting solutions include Zoom, GoToMeeting by Citrix Systems, and Microsoft
    Live Meeting. These technologies usually include displaying slides on all PCs
    connected to a meeting, sharing documents as spreadsheets, and sometimes sharing
    audio or video. Some solutions allow users to remotely control another connected
    PC.


    Many of these solutions are designed to tunnel through SSL or TLS traffic, which
    can often pass via firewalls and Web proxies. If a site''s remote access policy
    requires an VPN connection using strong authentication to allow remote control
    of an internal PC, these solutions may bypass controls as a requirement for strong
    authentication and violate policy. Usage of remote meeting technologies should
    be understood, controlled, and compliant with all applicable policy.


    ## Securing Third-Party Connectivity


    Many organizations maintain et connections to/from third parties via VPN, leased
    lines, Extranets are commonly used for remote offices, to provide connectivity
    to organizations that partner together, and vendor support. These third-party
    connections represent a significant risk: the third party could become compromised,
    and the attacker or malware could pivot via the extranet connection and attack
    the organization itself. These types of connections require an organization to
    trust party security to a certain degree.


    Extranet connections should always occur via leased lines or encrypted VPN. Access
    Control Lists (ACLs) should strictly control which systems may be reached via
    an extranet connection. From a detective standpoint: enhanced monitoring should
    be blocked by ACL. Strong host-based controls should be deployed to systems reachable
    via extranet connections: patching, hardening, and use of dual-factor authentication,
    etc.


    ## Wireless Application Protocol


    The Wireless Application Protocol (WAP) was designed to provide secure Web services
    to handheld devices such as smartphones. WAP is based on HTML and includes HTML
    (Handheld Device Markup Language). Authentication is provided by Wireless Transport
    Layer Security (WTLS), which is based on TLS.


    A WAP browser is a microbrowser, simpler than a Full Web browser, and requiring
    resources. It connects to a WAP gateway, which is a proxy server designed to translate
    web pages. The microbrowser accesses sites written (or converted to) WML (Wireless
    Markup Language), which is based on XML.


    Note


    WAP is an overloaded acronym, mapping to multiple technologies and protocols.
