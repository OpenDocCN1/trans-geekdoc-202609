    # 250 CHAPTER 5 Domain 4: Communication and Network Security


    SSH version 1 was the original version, which has since been found vulnerable
    to man-in-the-middle attacks. SSH version 2 is the current version of the protocol,
    and is recommended over SSHv1, Telnet, FTP, etc.


    # SMTP, POP, and IMAP


    SMTP is the Simple Mail Transfer Protocol, used to transfer email between servers.
    SMTP servers listen on TCP port 25. POPv3 (Post Office Protocol) and IMAP (Internet
    Access Protocol) are used for client-server access, using TCP ports 110 and 143,
    respectively.


    # DNS


    DNS is the Domain Name System, a distributed hierarchical database that translates
    names to IP addresses, and versa. DNS uses both TCP and UDP: small answers use
    UDP port 53; large answers (such as zone transfers) use TCP port 53. Core DNS
    functions are getbyname() and gethostbyaddr(). Given a name (such as www.syngress.com),
    getbyname returns an IP address, such as 192.0.2.187. Given an address such as
    192.0.2.187, gethostbyaddr returns the name, www.syngress.com.


    Authoritative name servers provide the "authoritative" resolution for names within
    a domain. A recursive name server will resolve names that it does not already
    know. A caching server will temporarily cache names previously resolved.


    # DNS Weaknesses


    DNS uses unreliable UDP protocol for most requests, and native DNS provides no
    authentication. The security of DNS relies on a 16-bit source port and 16-bit
    query ID. Attackers are able to blind gust numbers to easily forge UDP DNS responses.


    A cache poisoning attack is an attempt to trick a DNS server into caching a forged
    response. If bank.example.com is at 192.0.2.193, and evil.example.com is at 198.18.8.17,
    an attacker may try to poison a DNS server''s cache by sending the forged response.
    If the caching DNS server accepts the response, it will return the poisoned response
    for subsequent bank.example.com requests (until the record expires).


    # DNSSEC


    DNSSEC (Domain Name Server Security Extensions) provides authentication and integrity
    to DNS responses via the use of public key encryption. It does not provide confidentiality;
    it acts like a digital signature for DNS responses.


    Building an Internet-scale Public Key Infrastructure is a difficult task, and
    DNSSEC has been solely adopted for this security. Researcher Dan Kaminsky publicized
    an improved DNS poisoning attack in 2008, which has led to renewed calls for wider
    adoption of DNSSEC. https://www.kb.cert/org/vuls/id/800113 for more details on
    the improved cache poisoning attack and defenses.'
