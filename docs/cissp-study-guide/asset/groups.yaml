    # Screen Scraping


    Screen scraping presents approach to graphical remote access to systems. Screen
    scraping protocols packetize and transmit information to draw the assessed system''s
    screen on the display of the system used for remote access. VNC (Virtual Network
    Computing), a commonly used technology for accessing remote desktops, is fundamentally
    a screen scraping approach to remote access. Not all remote access protocols are
    built as screen scrapers. For example, Microsoft''s popular Remote Desktop Protocol
    (RDP), does not employ screen scraping to graphical remote access.


    # Multimedia Collaboration


    Multimedia collaboration includes a suite of technologies, including instant messaging
    and remote meeting technologies. Many of these technologies allow transfer, remote
    control of PCs, recording audio and video, and other capabilities that can introduce
    risk to an organization.


    # Instant Messaging


    Instant Messaging allows two-to-one or more users to communicate with each other
    via realtime."Chat may be one-to-one, or many-to-many via chat groups. In addition
    to chatting, most modern instant messaging software allows file sharing, and some
    audio and video conferencing.


    Older instant messaging protocols include Internet Relay Chat (IRC), AOL Instant
    Messenger, and Extensible Messaging and Presence Protocol (XMPP, formerly known
    as Jabber). These older instant messaging technologies often used plaintext TCP/IP
    protocols to transfer data and are easy to monitor. Modern instant messaging solutions
    (such as Google Talk, Discord, and Slack) use HTTPS to communicate, and are far
    more difficult to monitor.


    Chat software may be subject to various security issues, including remote exploitation.
    The file sharing capability of chat software may violate policy by distributing
    sensitive documents, and similar issues can be raised by the audio and video sharing
    capability of many of these programs. Organizations should have a policy controlling
    the use of chat software and technical controls in place to monitor and, if necessary,
    block their usage.


    # Remote Meeting Technology


    Remote meeting technology is a newer technology that allows users to conduct online
    meetings via the Internet, including desktop sharing functionality. Commercial
    remote meeting solutions include Zoom, GoToMeeting by Citrix Systems, and Microsoft
    Live Meeting. These technologies usually include displaying slides on all PCs
    connected to a meeting, sharing documents as spreadsheets,'
  - '[PAGE 63]


    # CHAPTER 5 Domain 4: Communication and Network Security


    and sometimes sharing audio or video. Some solutions allow users to remotely control
    another connected PC.


    Many of these solutions are designed to tunnel through SSL or TLS traffic, which
    can often pass via firewalls and Web proxies. If a site''s remote access policy
    requires an VPN connection using strong authentication to allow remote control
    of an internal PC, these solutions may bypass controls as a requirement for strong
    authentication and violate policy. Usage of remote meeting technologies should
    be understood, controlled, and compliant with all applicable policy.


    # Securing Third-Party Connectivity


    Many organizations maintain etec connections to/from third parties via VPN, leased
    lines, Extrans are commonly used for remote offices, to provide connectivity to
    organizations that partner together, and vendor support. These third-party connections
    represent a significant risk: the third party could become compromised, and the
    attacker or malware could pivot via the extrac connection and attack the organization
    itself. These types of connections require an organization to trust party security
    to a certain degree.


    Extranet connections should always occur via leased lines or encrypted VPN. Access
    Control Lists (ACLs) should strictly control which systems may be reached via
    an extrac connection. From a detective standpoint: enhanced monitoring should
    be blocked by ACL. Strong host-based controls should be deployed to systems reachable
    via extrac connections: patching, hardening, and use of dual-factor authentication,
    etc.


    # Wireless Application Protocol


    The Wireless Application Protocol (WAP) was designed to provide secure Web services
    to handheld devices such as smartphones. WAP is based on HTML and includes HTML
    (Handheld Device Markup Language). Authentication is provided by Wireless Transport
    Layer Security (WTLS), which is based on TLS.


    A WAP browser is a microbrowser, simpler than a Full Web browser, and requiring
    resources. It connects to a WAP gateway, which is a proxy server designed to translate
    web pages. The microbrowser accesses sites written (or converted to) WML (Wireless
    Markup Language), which is based on XML.


    Note


    WAP is an overloaded acronym, mapping to multiple technologies and protocols.
    It is especially confusing regarding wireless: WAP may stand for Wireless Access
    Point or Wireless Application Protocol. And WPA (Wi-Fi Protected Access) has the
    same letters in different order.


    Do not confuse these wireless protocols and technologies: the exam will be clear
    on which a question may refer to; do not rush through a question and miss the
    context. Also, do confuse 802.11 wireless security standards (including WEP and
    802.11i/WPA2) with handheld device WAP security (WTLS).'
