  - '[PAGE 4]


    # Network Architecture and Design 229


    # Table 5.1 The OSI Model.


    | | |

    |---||

    | 7 | Application |

    | 6 | Presentation |

    | 5 | Session |

    | 4 | Transport |

    | 3 | Network |

    | 2 | Data Link |

    | 1 | Physical |


    The OSI model has seven layers, as shown in Table 5.1. The layers may be listed
    in top-to-bottom or bottom-to-top. Using the latter, they are Physical, Data Link,
    Network, Transport, Session, Presentation, and Application.


    > The OSI model was developed by the International Organization for Standardization
    (ISO), so some sources confusingly call it the ISO model, or even the OSI model.
    The model is formally calledX.200: Information technology—Open Systems Interconnection—Basic
    Reference Model.

    The X.200 recommendation may be downloaded from https://www.itu.int/rec/T-X.200-199407-Icn.
    The term "OSI model" is the most prevalent, so that is the term used in this book.


    # Layer 1—Physical


    The Physical Layer is Layer 1 of the OSI model. Layer 1 describes units of data
    as bits represented by energy (such as light, electricity, or radio waves) and
    the medium used to carry them (such as copper or fiber cables). WLANs have a physical
    layer, even though we cannot physically touch it.

    Cabling standards such as Thinnet, Thicknet, and Unshielded Twisted Pair (UTP)
    exist at layer 1, among others. Layer 1 devices include hubs and repeaters.


    # Layer 2—Data Link


    The Data Link Layer handles access to the physical layer as well as local network
    communication. An Ethernet card and its MAC (Media Access Control) address are
    at Layer 2, as switches and bridges.

    Layer 2 is divided into two sublayers: Media Access Control (MAC) and Logical
    Link Control (LLC). The MAC layer transfers data to and from the physical layer.
    LLC handles LAN communications. MAC touches Layer 1, and LLC touches Layer 3.


    # Layer 3—Network


    The Network Layer describes routing: moving data from one system to another on
    IP. IP addresses and routers exist at Layer 3. Network protocols include IPv4
    and IPv6, among others.'
  - '[PAGE 5]


    # Layer 4—Transport


    The Transport Layer handles packet sequencing, flow control, and error detection.
    TCP and UDP are Layer 4 protocols.


    Layer 4 makes several features available, such as resending or re-sequencing packets.
    Taking advantage of these features is a protocol implementation decision. As we
    see later, TCP takes advantage of these features, at the expense of speed. Many
    of these features are not implemented in UDP, which chooses speed over reliability.


    # Layer 5—Session


    The Session Layer manages sessions, which provide maintenance on connections.
    Mounting a file share via a network requires several maintenance sessions, as
    Remote Procedure Calls (RPCs); these exist at session layer. A good way to remember
    the session layer’s function is “connections between applications.” The Session
    Layer uses simplex, half-duplex, and full-duplex communication.


    > Note

    The transport and session layers are often confused. For example, “maintenance
    of connections” a transport layer or session issue? Packets are sequenced at the
    transport layer, and network file shares are mounted at the session layer: you
    may consider either to be maintenance. Words “maintenance” imply more work than
    packet sequencing or retransmission: it requires “heavy lifting,” like removing
    a network share that has been un-mounted, so session layer is the best answer.


    # Layer 6—Presentation


    The Presentation Layer presents data to the application (and user) in a comprehensive
    way. Presentation Layer includes data conversion, character sets such as ASCII,
    and image formats as GIF (Graphics Interchange Format), JPEG (Joint Photographic
    Experts Group), and TIFF (Tagged Image File Format).


    # Layer 7—Application


    The Application Layer is where you interface with your computer application. Web
    browser, processor, and instant messaging client exist at Layer 7. The protocols
    Telnet and FTP are Application Layer protocols.


    > Note

    Many mnemonics help remember the OSI model. From bottom to top, “Please Do Not
    Sausage Pizza Away” (Physical Data-Link Network Transport Session Presentation
    Application) is a bit silly, but that makes it memorable. Also silly: “Please
    Do Not Sell People Anything.” From top to bottom, “All People See To Need Data
    Processing” is popular.


    # The TCP/IP Model


    The TCP/IP model (Transmission Control Protocol/Internet Protocol) is a popular
    network model created by DARPA in the 1970s (see https://www.internetsociety.org/internet/internet/brief-history-internet/
    for more information). TCP/IP is an informal name (named after the first two protocols
    created); the formal name'
  - '[PAGE 6]


    # Network Architecture and Design 231


    ### Table 5.2 The OSI Model vs. TCP/IP Model.


    | OSI Model | TCP/IP Model |

    |---|-|

    | 7 Application | Application |

    | 6 Presentation | |

    | 5 Session | Host-to-Host Transport |

    | 4 Transport | |

    | 3 Network | Internet |

    | 2 Data Link | Network |

    | 1 Physical | Access |


    is the Internet Protocol Suite. The TCP/IP model is simpler than the OSI model,
    as shown in Table 5.2.

    While TCP and IP receive top billing, TCP/IP is actually a set of protocols including
    UDP (User Datagram Protocol) and ICMP (Internet Control Message Protocol), among
    many others.


    > Note

    The names of the TCP/IP layers are a subject of much debate, with “authoritative”
    sources disagreeing with each other. Confusingly, some use Link Layer in place
    of Network Access Layer, and Network layer in place of Internet Layer. This book
    follows the conventions described in TCP/IP references listed in the exam''s Candidate
    Information Bulletin, such as Cisco/IP Routing Professional Reference (McGraw-Hill)
    by Chris Lewis.


    # ### Network Access Layer


    The Network Access Layer of the TCP/IP model combines Layers 1 (Physical) and
    2 (Data Link) of the OSI model. It describes Layer 1 issues such as energy, bits,
    and the medium used to carry them (copper, fiber, wireless, etc.). It also describes
    Layer 2 issues as converting bits into protocol units such as Ethernet frames,
    MAC (Media Access Control) addresses, and Network Interface Cards (NICs).


    # ### Internet Layer


    The Internet Layer of the TCP/IP model aligns with the Layer 3 (Network) of the
    OSI model. This is where IP addresses and routing live. When data is transmitted
    from a node on one LAN to a node on a different LAN, the Internet Layer is used:
    IPv4, IPv6, ICMP, and routing protocols (among others) are Internet Layer TCP/IP,
    protocols.


    # ### Exam Warning


    Layer 3 of the OSI model is called “Network.” Do not confuse OSI’s Layer 3 with
    the “Network Access” TCP/IP layer, which aligns with Layers 1 and 2 of the OSI
    model.'
  - '[PAGE 7]


    # Host-to-Host Transport Layer


    The Host-to-Host Transport Layer (sometimes called either “Host-to-Host” or, more
    commonly, “Transport” alone; this book will use “Transport”) connects the Internet
    to the Application Layer. It is where applications are addressed on a network,
    via ports. TCP and UDP are the two Transport Layer protocols of TCP/IP.


    # Application Layer


    The TCP/IP Application Layer combines Layers 5 through 7 (Session, Presentation,
    and Application) of the OSI model. Most of these protocols use a client-server
    architecture, where a client (such as ssh) connects to a listening server (called
    a daemon on UNIX systems) as ssh. The clients and servers use either TCP or UDP
    (and sometimes both) as a Transport Layer protocol. TCP/IP Application Layer protocols
    include SSH, Telnet, and FTP, among many others.


    # Encapsulation


    Encapsulation takes information from a higher layer and adds a header to it, treating
    the higher layer information as data. It is often said, “One layer header is another
    layer data” [2]. For example, as the data moves down the stack, application layer
    data is encapsulated in a Layer 4 TCP segment. That TCP segment is encapsulated
    in a Layer 3 IP packet. That IP packet is encapsulated in a Layer 2 Ethernet frame.
    The frame is converted into bits and sent across the local network. Data, segments,
    packets, frames, and bits are examples of Protocol Data Units (PDUs).


    > SPF1 is helpful for remembering PDUs: Segments, Packets, Frames, and Ones


    The reverse of encapsulation is called de-multiplexing (sometimes de-encapsulation).
    As the PDUs move up the stack, frames are converted to Ethernet frames, frames
    are converted to IP packets, packets are converted to TCP segments, and segments
    are converted to application data.


    # Network Access, Internet, and Transport Layer Protocols and Concepts


    TCP/IP is a protocol suite, including (but not limited to): IPv4 and IPv6 at the
    Internet layer; TCP and UDP at the Transport layer; a multitude of higher-level
    protocols, including Telnet, FTP, SSH, and many others. Let us focus on the lower
    layer protocols, spanning from the Network Access to Transport layers. Some protocols,
    such as IP, fit neatly into one layer (Internet). Others, as Address Resolution
    Protocol (ARP), help one layer to another (Network Access to Internet in ARP’s
    case).'
