    This approach has enabled DNP3 to take advantage of Internet technology and permitted
    economical data collection and control between widely separated devices" [9].


    Recent improvements in DNP3 allow for "Secure Authentication," which addresses
    challenges with the original specification that could have allowed, for example,
    spoofing or replay attacks. DNP3 became an IEEE standard in 2010, called IEEE
    1815-2010 (now deprecated). It allowed pre-shared keys only. IEEE 1815-2012 is
    the current standard; it supports Public Key Infrastructure (PKI).


    # Storage Protocols


    Fibre Channel over Ethernet (FCoE) and Internet Computer System Interface (iSCSI)
    are both Storage Area Network (SAN) protocols that provide cost-effective ways
    to leveraging network infrastructure technologies and protocols to interface with
    storage. A Storage Area Network allows block-level access across a network, like
    a directly attached drive. However fibre channel uses the Canadian/UK spelling
    of "fiber," while fiber optic cable uses the American spelling of "fiber."


    FCoE leverages Fibre Channel, which has long been used for storage networking,
    but with the requirements for completely different cabling and hardware. Instead,
    FCoE can be transmitted across Ethernet networks. In FCoE, Fibre Channel''s HBA
    (Host Bus Adapters), which were historically unique cards to interface with storage,
    are combined with the network interface (NIC) for economies of scale. FCoE uses
    Ethernet, but not TCP/IP. Fibre Channel over IP (FIP) encapsulates Fibre Channel
    frames via TCP/IP.


    Like FCoE, iSCSI is a SAN protocol that allows for leveraging network infrastructure
    and protocols to interface with storage. Fibre uses Ethernet for communication
    and can be routed like any IP protocol (the same is for FCIP). By employing protocols
    beyond Layer 2 (Ethernet), iSCSI can be transmitted beyond the local network.
    Thus, iSCSI could allow even for accessing storage that resides across a WAN.
    iSCSI uses Logical Unit Numbers (LUNs) to provide a way of addressing storage
    across the network. LUNs can also be used for basic access control for network
    accessible storage.


