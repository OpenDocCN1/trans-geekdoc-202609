    # 250 CHAPTER 5 Domain 4: Communication and Network Security


    SSH version 1 was the original version, which has since been found vulnerable
    to man-in-the-middle attacks. SSH version 2 is the current version of the protocol,
    and is recommended over SSHv1, Telnet, FTP, etc.


    # SMTP, POP, and IMAP


    SMTP is the Simple Mail Transfer Protocol, used to transfer email between servers.
    SMTP servers listen on TCP port 25. POPv3 (Post Office Protocol) and IMAP (Internet
    Access Protocol) are used for client-server access, using TCP ports 110 and 143,
    respectively.


    # DNS


    DNS is the Domain Name System, a distributed hierarchical database that translates
    names to IP addresses, and vice versa. DNS uses both TCP and UDP: small answers
    use UDP port 53; large answers (such as zone transfers) use TCP port 53. Core
    DNS functions are getbyname() and gethostbyaddr(). Given a name (such as www.syngress.com),
    getbyname returns an IP address, such as 192.0.2.187. Given an address such as
    192.0.2.187, gethostbyaddr returns the name, www.syngress.com.


    Authoritative name servers provide the "authoritative" resolution for names within
    a domain. A recursive name server will resolve names that it does not already
    know. A caching server will temporarily cache names previously resolved.


    # DNS Weaknesses


    DNS uses unreliable UDP protocol for most requests, and native DNS provides no
    authentication. The security of DNS relies on a 16-bit source port and 16-bit
    query ID. Attackers are able to blind guess numbers to easily forge UDP DNS responses.


    A cache poisoning attack is an attempt to trick a DNS server into caching a forged
    response. If bank.example.com is at 192.0.2.193, and evil.example.com is at 198.18.8.17,
    an attacker may try to poison a DNS server''s cache by sending the forged response.
    If the caching DNS server accepts the response, it will return the poisoned response
    for subsequent bank.example.com requests (until the record expires).


    # DNSSEC


    DNSSEC (Domain Name Server Security Extensions) provides authentication and integrity
    to DNS responses via the use of public key encryption. It does not provide confidentiality;
    it acts like a digital signature for DNS responses.


    Building an Internet-scale Public Key Infrastructure is a difficult task, and
    DNSSEC has been solely adopted for this security. Researcher Dan Kaminsky publicized
    an improved DNS poisoning attack in 2008, which has led to renewed calls for wider
    adoption of DNSSEC. https://www.kb.cert/org/vuls/id/800113 for more details on
    the improved cache poisoning attack and defenses.


    # Network Architecture and Design 251


    DoT and DoH

    DNS over TLS (DoT) and DNS over HTTPS (DoH) are two competing standards that transfer
    and encrypt DNS traffic via TLS, DoT uses a dedicated port (TCP port 853), while
    DoH uses HTTPS on TCP port 443. Unlike DNSSEC, both provide confidentiality between
    the client resolver and the DoH server. DoH has won a larger market share, and
    is currently used by default by Firefox in the United States.


    # SNMP


    SNMP is the Simple Network Management Protocol, primarily used to monitor network
    devices. Network monitoring software like MRTG uses SNMP to poll agents on network
    devices, and interface status (up/down), bandwidth utilization, CPU temperature,
    and many more metrics. SNMP agents use UDP port 161.

    SNMPv1 and v2c use read and write community strings to access network devices.
    Devices use default community strings as "public" for read and "private" for write.
    Additionally, these community strings are usually changed infrequently (if at),
    and are typically seen in the clear across a network. An attacker who can sniff
    or guess a community string can access the network device via SNMP. Access to
    a write string allows changes to a device, including shutting down or reconfiguring
    interfaces, among many other options.

    SNMPv3 was designed to provide confidentiality, integrity, and authentication
    to SNMP via use of encryption. While SNMPv2c usage remains highly prevalent, use
    of SNMPv3 is strongly encouraged due to the lack of security in all previous versions.


    # HTTP and HTTPS


    HTTP is the Hypertext Protocol, which is used to transfer encrypted Web-based
    data. HTTPS (Hypertext Transfer Protocol Secure) secures encrypted Web-based data
    via SSL/TLS ("SSL and TLS" section below). HTTP uses TCP port 80 and HTTPS uses
    TCP port 443, HTML (Hypertext Markup Language) is used to display content.


    > Note

    HTTP and HTML are often confused. The difference: you transfer Web data via HTTP
    and view it via HTML.


    # BOOTP and DHCP


    BOOTP is the Bootstrap Protocol, for bootstrapping a network by diskless systems.
    Many system BIOSs now support BOOTP directly, allowing the BIOS to load the operating
    system by a network without a disk. BOOTP startup occurs in two phases: BOOTP
    to determine the IP address and OS image name, and then use TFTP to download the
    operating system.


    # CHAPTER 5 Domain 4: Communication and Network Security


    DHCP (Dynamic Host Configuration Protocol) was designed to replace and improve
    on BOOTP by adding additional features. DHCP allows more configuration options,
    well as assigning IP address leases to systems. DHCP systems can be configured
    to receive IP address leases, DNS servers, and default gateways.


    Both BOOTP and DHCP use the same ports: UDP port 67 for servers and UDP port 68
    for clients.


    # Transmission Media


    Transmission Media is the physical path through which signals travel. Transmission
    media can be categorized as guided or wireless. Guided media include twisted pair,
    coaxial, and fiber optic cables. Wireless media include radio waves, microwaves,
    and infrared.


    Twisted pair cabling consists of two insulated wires twisted together. The twisting
    helps reduce electromagnetic interference (EMI) and crosstalk. There are two types
    of twisted pair: Unshielded Twisted Pair (UTP) and Shielded Twisted Pair (STP).


    Coaxial cable consists of a central conductor surrounded by an insulator, a metallic
    shield, and an outer jacket. It is more resistant to EMI than twisted pair and
    can carry higher bandwidth.


    Fiber optic cable uses light pulses to transmit data through glass or plastic
    fibers. It is immune to EMI and can carry much more data over longer distances
    than copper-based cables.


    Electromagnetic interference (EMI) is the disruption of an electrical circuit
    by an electromagnetic field. It can cause data errors and performance degradation.


    Crosstalk is a type of interference caused by the signal from one wire leaking
    into another. It is common in twisted pair cabling.


    Attenuation is the loss of signal strength as it travels through a medium. To
    compensate for attenuation, repeaters or amplifiers are used.


    # Twisted Pair


    Twisted pair is the most common type of media for LANs. There are two types: Unshielded
    Twisted Pair (UTP) and Shielded Twisted Pair (STP).


    Unshielded Twisted Pair (UTP) consists of pairs of insulated wires twisted together
    without any shielding. It is inexpensive and easy to install but is more susceptible
    to EMI and crosstalk.


    Shielded Twisted Pair (STP) has a metallic shield around each pair to help reduce
    EMI. It is more expensive and complex than UTP.


    Twisted pair cables are categorized by category, which defines their performance
    speed and frequency:

    - Cat 3: Up to 10 Mbps

    - Cat 5: Up to 100 Mbps

    - Cat 5e: Up to 1 Gbps

    - Cat 6: Up to 10 Gbps (over short distances)

    - Cat 6a: Up to 10 Gbps (up to 100 meters)

    - Cat 7: Up to 10 Gbps


    # Coaxial Cable


    Coaxial cable consists of a central conductor surrounded by an insulator, a metallic
    shield, and an outer jacket. The metallic shield protects the signal from EMI.
    Coaxial cable is used for cable TV, broadband internet, and video.


    Two types of coaxial cable are:

    - Thinnet (RG-58): Thinner, used in older Ethernet networks.

    - Thicknet (RG-8): Thicker, used in older backbones.


    # Fiber Optic Cable


    Fiber optic cable uses light pulses to transmit data through glass or plastic
    fibers. It is immune to EMI and can carry much more data over longer distances
    than copper-based cables.


    Two types of fiber optic cable are:

    - Single-mode: Uses a thin core and laser light source to transmit data over long
    distances.

    - Multi-mode: Uses a wider core and LED light source to transmit data over shorter
    distances.


    # Comparison Table


    | Media | Bandwidth | Distance | EMI Resistance | Cost |

    | :--- | :--- | :--- | :--- | :--- |

    | Twisted Pair (UTP) | Low to Medium | Short | Low | Low |

    | Twisted Pair (STP) | Low to Medium | Short | Medium | Medium |

    | Coaxial | Medium | Medium | High | Medium |

    | Fiber Optic | Very High | Very Long | Total | High |

    | Wireless | Medium | Variable | Low | Variable |


