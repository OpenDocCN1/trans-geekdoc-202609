    # Transmission Media


    Transmission Media includes the Layer 1 technologies that transfer bits: network
    cabling and wireless technologies. We will discuss cabling and wireless later
    in this chapter. The simplest part of the OSI model is the part you can touch:
    network cables, at Layer 1. It is important to understand the types of cabling
    that are commonly used, and the benefits and drawbacks of each.


    Fundamental network cabling terms to understand EMI, noise, crosstalk, and attenuation.
    Electromagnetic Interference (EMI) is caused by magnetism created by electricity.
    Any unwanted signal (such as EMI) on a network cable is called noise. Crosstalk
    occurs when a signal crosses from one cable to another. Attenuation is the weakening
    of signal as it travels further from the source.


