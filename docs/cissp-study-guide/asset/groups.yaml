    802.11i 是第一个提供合理安全性的 802.11 无线安全标准。802.11i 描述了鲁棒安全网络（RSN），它允许使用插拔认证模块。RSN 在发现新的新漏洞时，允许更改加密密码。


    RSN 通常被称为 WPA2（Wi-Fi 保护 2），是 802.11i 的完整实现。默认情况下，WPA2 使用 AES 加密来提供机密性，并使用 CCMP（计数模式
    CBC MAC 协议）来创建消息完整性检查（MIC），从而提供完整性。安全性较低的 WPA（不带“2”）是为那些没有能力实现完整 802.11i 标准的接入点设计的，为
    WEP 提供了更好的安全替代方案。WPA 使用 RC4 提供机密性，使用 TKIP 提供完整性。建议使用 WPA2 而非 WPA。


    ## 蓝牙


    蓝牙由 IEEE 标准 802.15.1 定义，是一种个人局域网（PAN）无线技术，工作在许多类型的 802.11 无线设备相同的 2.4 GHz 频率上。蓝牙可用于手机等小型低功耗设备，通过短距离传输数据。蓝牙
    2.1 及更早版本运行在 3 Mbps 或以下；3 版及更高版本提供更快的速度。


    蓝牙有三类设备，总结如下。虽然蓝牙是为短距离网络设计的，但值得注意的是，1 类可以传输至多 100 米：


    - 3 类：10 米以下

    - 2 类：10 米

    - 1 类：100 米


