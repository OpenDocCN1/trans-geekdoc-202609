    # 第 5 章领域 4：通信与网络安全


    远程访问桌面的常用现代协议包括虚拟网络计算（VNC），它通常运行在 TCP 5900 上，以及远程桌面协议（RDP），它通常运行在 TCP 端口 3389
    上。VNC 和 RDP 允许对远程系统进行图形化访问，与传统的基于终端的远程访问方法不同。RDP 是微软的一种协议。


    用户日益期望通过互联网快速地从任何设备建立图形化桌面访问。对于传统的基于 VNC 和 RDP 方法，这些期望可能难以实现，因为出于安全考虑，这些方法通常通过
    VPN 等加密通道进行隧道传输。


    这些方法的近期一种替代方案是使用反向隧道（reverse tunnel），它允许建立出站加密隧道的用户通过同一个隧道连接回来。这通常需要在用户的计算机上安装一个小型代理程序，使用通过
    TCP 443 的 HTTPS发起出站连接。该连接将终止于中央服务器，用户可以对该服务器（从办公室外部）进行验证，以控制其办公室桌面计算机。采用这种方式的两个最著名的解决方案是
    GoToMyPC 和 LogMeIn。


    ## 桌面与应用虚拟化


    除了远程访问独立的桌面系统外，提供计算资源远程访问另一种方法是桌面和应用虚拟化。桌面虚拟化是一种提供中心化结构的方法，该结构托管一个可以供员工远程利用的镜像。桌面虚拟化通常被称为
    VDI，根据厂商的定义（虚拟桌面基础设施 Virtual Desktop Infrastructure 或虚拟桌面接口 Virtual Desktop Interface），它也被称为
    DaaS（桌面即服务 Desktop as Infrastructure）。


    与提供完整的桌面环境相反，组织可以选择将中心化服务的关键应用程序简化。与桌面虚拟化类似，应用虚拟化相关的中心化允许组织实施严格的访问控制，并可能更快速地补补应用程序。此外，应用虚拟化还可以运行遗留应用程序，否则这些程序无法在员工使用的系统上运行。


    虽然该方法的术语和细节相对较新，但桌面和应用虚拟化的底层概念已以瘦端客户端、大型主机和终端服务器的形式存在了数十年。这种更新且更传统的方法的主要前提是，拥有更中心化和整合的计算系统和基础设施，比拥有大量更复杂的系统可能更具组织效益。除了通用的“规模经济”论据外，更紧密控制的桌面和应用环境可能具有安全优势。在中心化环境中修补更复杂的应用程序可能更容易管理。同样，当有一个或多个几个中心主镜像来决定每个相应虚拟桌面的设置时，开发和维护桌面将变得更容易。


    ## 屏幕抓取（Screen Scraping）


    屏幕抓取提供了一种对系统进行图形远程访问的方法。屏幕抓取协议将信息分组并传输，以便将评估系统的屏幕绘制在用于远程访问的系统的显示器上。VNC（虚拟网络计算）是访问远程桌面的常用技术，它本质上是一种屏幕抓取远程访问。并不是所有的远程访问协议都是设计为屏幕抓取。例如，微软流行的远程桌面协议（RDP）并没有采用屏幕抓取进行图形远程访问。


    ## 多媒体协作


    多媒体协作包括一系列技术，包括即时消息和远程会议技术。这些许多技术允许传输、远程控制电脑、录制音频视频以及可能给组织带来风险的能力。


    ## 即时消息


    即时消息允许两个或多个用户通过实时进行相互通信。“聊天”可以是一对一，也可以通过聊天组进行多对多。除了聊天之外，大多数现代即时消息软件还允许文件共享以及某些音频视频会议。


    旧的即时消息协议包括互联网中继聊天（IRC）、AOL 即时消息（AIM）和可扩展消息和存在性协议（XMPP，以前称为 Jabber）。这些旧的即时消息技术通常使用明文
    TCP/IP 协议传输数据，容易被监控。现代即时消息解决方案（如 Google Talk、Discord 和 Slack）使用 HTTPS 进行通信，监控难度大。


    聊天软件可能面临各种安全问题，包括远程利用。聊天软件的文件共享功能可能通过分发敏感文档而违反策略，许多此类程序的音频视频共享功能也可能引发类似的问题。组织应该有一项控制聊天软件使用的策略，并实施相应的技术控制以监控并在必要时阻止其使用。


    ## 远程会议技术


    远程会议技术是一种较新的技术，允许用户通过互联网进行在线会议，包括桌面共享功能。商业远程会议解决方案包括 Zoom、Citrix Systems 下的 GoToMeeting
    和微软 Live Meeting。这些技术通常包括在所有连接到会议的 PC 上显示幻灯片、共享电子表格等文档，有时共享音频或视频。某些解决方案允许用户远程控制另一台连接的
    PC。


    这些解决方案中的许多设计为通过 SSL 或 TLS 流量建立隧道，这些流量通常可以通过防火墙和 Web 代理。如果某个站点的远程访问策略要求使用强身份验证的
    VPN 连接来远程控制内部 PC，这些解决方案可能会因为不需要强身份验证而绕过控制并违反策略。对远程会议技术的使用应该理解、控制并符合所有适用策略。


    ## 保护第三方连接


    许多组织通过 VPN、专线维护与第三方之间的双向连接，由于外网网（Extranets）通常用于远程办公室，为建立伙伴关系的组织提供连接，以及供应商支持。这些第三方连接代表了重大风险：第三方可能被破解，攻击者或恶意软件可以通过外网网连接跳板并攻击组织本身。这些类型的连接要求组织在某种程度上信任第三方的安全性。


    外网网连接应始终通过专线或加密 VPN 进行。访问控制列表（ACL）应严格控制哪些系统可以通过外网网连接访问。从检测的角度来看：增强的监控应被 ACL 阻止。对于可以通过外网网访问的系统，应部署强的主机控制：补丁、加固和使用双因子认证等。


    ## 无线应用协议


    无线应用协议（WAP）旨在为智能手机等手机设备提供安全的 Web 服务。WAP 基于 HTML，并包含 HTML（手持设备标记语言）。认证由无线传输层安全协议（WTLS）提供，它基于
    TLS。


    WAP 浏览器是一种微浏览器，比全功能 Web 浏览器简单，且需要资源。它连接到 WAP 网关，网关是一个翻译网页的代理服务器。微浏览器访问编写（或转换成）WML（无线标记语言）的站点，WML
    基于 XML。


    注意


    WAP 是一个过载的缩写，映射到多种技术和协议。它在无线方面特别容易混淆：WAP 可以代表无线接入点（Wireless Access Point）或无线应用协议（Wireless
    Application Protocol）。而 WPA（Wi-Fi 安全访问）的字母顺序不同。


    不要混淆这些无线协议和技术：考试会明确指出问题指的是哪一个；不要匆忙做而忽略上下文。此外，不要混淆 802.11 无线安全标准（包括 WEP 和 802.11i/WPA2）与手持设备的
    WAP 安全（WTLS）。


