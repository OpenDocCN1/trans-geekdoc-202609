    \ layer protocols carried by Frame Relay, such as TCP/IP can be used to provide\
    \ reliability.\n\nFrame Relay multiplexes logical connections over a single physical\
    \ connection to create Virtual Circuits; this shared bandwidth model is an alternative\
    \ to dedicated circuits as T1, a PVC (Permanent Virtual Circuit) is always connected\
    \ to a real dedicated circuit like T1. A Switched Virtual Circuit (SVC) sets up\
    \ \"call,\" transfers data, and terminates the connection after an idle timeout.\
    \ Frame Relay is addressed locally via Data Connection Identifiers (DLCI), pronounced\
    \ \"delci\".\n\n# X.25\n\nX.25 is an older packet-switched WAN protocol. X.25\
    \ provided a cost-effective way to transmit data over long distances in the 1970s\
    \ through the early 1990s, when the most common option was a direct call via analog\
    \ modem. X.25's popularity has faded as the Internet has become ubiquitous.\n\n\
    The global packet-switched X.25 network is separate from the global IP-based Internet.\
    \ X.25 performs error correction which can add latency on long links. It can carry\
    \ other protocols such as TCP/IP, but since TCP/IP contains its own reliability,\
    \ there is no need to take the extra performance by also providing reliability\
    \ at X.25 layer.\n\n# ATM\n\nAsynchronous Transfer Mode (ATM) is a WAN technology\
    \ that uses fixed length cells. ATM cells are 53 bytes long, with a 5-byte header\
    \ and 48-byte data portion.\n\nATM allows reliable network throughput compared\
    \ to Ethernet. The answer to \"How many Ethernet frames can I send per second\"\
    \ is \"It depends.\" Normal Ethernet"
  mdcn: "\n\n# 254 第 5 章 领域 4：通信与网络安全\n\n![](img/0bbd5f5bd171414c5e2c49247aab35d6_29_0.png)\n\
    \n图 5.13\n\n同轴电。\n来源：https://commons.wikimedia.org/wiki/File:RG-59.jpg，图片由 Arj\
    \ 制作。经 Creative Commons 许可使用。\n\n多模光纤传输器使用多种模式（路径）的光，这会导致光色散。单模光纤使用单根光纤，光线沿光纤中心使用一种模式（路径）进行传输。多模光纤用于短距离传输；单模光纤用于远距离、高速网络。\n\
    \n通过波分复用（WDM），可以在同一根光纤上承载多个信号，其中使用多种光“颜色”通过同一根光纤传输不同的信息通道。当使用 WDM 每一种颜色携带 10 Gb比特数据时，可以实现每秒太比特的组合速度。\n\
    \n# 以太网技术与协议\n\n局域网概念关注第 1-3 层的技术，如网络布线类型、物理和逻辑网络拓扑、以太网等。\n\n# 以太网\n\n以太网是一种主导的局域网络技术，通过帧传输网络数据。它最初使用物理总线拓扑，后来增加了对物理星型拓扑的支持。以太网描述了如帧之类的第\
    \ 1 层问题。以太网是基带的（单通道），因此它必须解决冲突问题，即两个节点尝试同时传输数据。\n\n以太网已从使用“细同轴”或“粗同轴”同轴电缆的 10\
    \ 兆比特总线演变而来。基于星型的物理层使用双绞线电缆，速度范围从 10 兆比特到 1000 兆比特不等。表 5.7 列出了这些类型的摘要。\n\n# 网络架构与设计\
    \ 255\n\n表 5.7 以太网类型。\n\n| 名称 | 类型 | 速度 | 最大距离 |\n| --- | --- | --- | --- |\n\
    | 10Base2 \"细同轴\" | 总线 | 10 兆比特 | 185 米 |\n| 10Base5 \"粗同轴\" | 总线 | 10 兆比特 | 500\
    \ 米 |\n| 10BaseT | 星型 | 10 兆比特 | 100 米 |\n| 100BaseT | 星型 | 100 兆比特 | 100 米 |\n\
    | 1000BaseT | 星型 | 1000 兆比特 | 100 米 |\n\n# CSMA\n\n载波检测多接入（CSMA）设计用于解决冲突。以太网是基带介质，相当于“共享线路”。在电话早期，许多人没有专用的电话线：他们与邻居共享线路。一种使用共享线路的协议出现了：\n\
    \n1. 举起接收器并听线路是否空闲\n2. 如果线路空闲，挂断电话并重试\n3. 如果线路空闲，拨号\n\n以太网的工作方式相同，但有一个状态未被考虑到：两个邻居同时举起接收器并听线路是否在使用。如果什么都没听到，他们的通话就会“冲突”：他们的通话完整性被破坏了。CSMA\
    \ 设计用于解决冲突。\n\n载波检测多接入冲突检测（CSMA/CD）用于立即检测网络内的冲突。它采取以下步骤：\n\n1. 监控网络查看是否空闲\n2.\
    \ 如果线路空闲，等待随机时间\n3. 如果线路空闲，传输\n4. 在传输期间，监控网络\n5. 如果发送了电力，另一个站也必须发送\n   (a) 向所有节点发送信号\n\
    \   (b) 等待随机时间后重传\n\nCSMA/CD 用于可以同时发送和接收的系统，例如有线以太网802.11。CSMA/CA（冲突避免）依赖于接收站的确认：如果没有收到确认，则必须认为发生了冲突并重传。CSMA/CD\
    \ 优于 CSMA/CA，因为冲突检测几乎是瞬间的。\n\n# 31 LAN 物理网络拓扑\n\n物理网络拓扑描述了第 1 层的技术，如总线和环形。多年来，许多技术已经消失，因为星型拓扑占据了主导地位。\n\
    \n# 遗留拓扑\n\n物理总线连接节点。物理环形连接节点，FDDI（光纤分布式数据接口）是一种环形技术。所有这些都被认为是遗留技术：如果你顺着电缆从一个节点到另一个，你会完成。\n\
    \n# 星型\n\n星型拓扑已成为局域网的主导物理拓扑。每个节点直接连接到集线器或交换机，如图 5.14 所示。\n\n![](0bbd5f5bd171414c5e2c49247aab35d6_31_png)\n\
    \n图 5.14 星型拓扑。\n\n# 网络架构与设计 257\n\n星型具有容错性：任何单根电缆断裂或 NIC 故障只会影响一个节点。由于每个节点都连接到一个中心点，相对于总线（一根电缆连接到每个节点），这种成本缺点通常被容错性所抵消。\n\
    \n# 网格\n\n图 5.15 显示了两个网格。左侧的网格是全连接的，右侧的网格是部分连接的：每个节点之间有多个连接。网格具有高可用性，通常用于高可用（HA）服务器集群。左侧所示的四个服务器中的每一个都可以共享负载并在它们之间维护状态。如果网格中的任何服务器宕机，其他仍保持运行。\n\
    \n# WAN 技术与协议\n\nISP 以及其他跨越城市到国家的“长途”网络提供者通常使用广域网技术。我们中的许多人都有配置 Cat5 布线等局域网技术的实战经验；构建\
    \ WAN 的实战经验较少。\n\n# T1, T3, E1, E3\n\n有几种国际电路标准：最流行的是 T 载（美国）和 E 载（欧洲）。T1 是专用的\
    \ 1544 兆比特电路，携带 24 个 DS0（数字信号0）通道（如电路交换电话）。注意术语 DS1（数字信号1）和 T1 经常互换使用。DS1 描述比特流（通过任何介质，如铜线、光纤和无线）；T1\
    \ 是携带 DS1 的电话电路。\n\nT3 是多个 T1 的组合，形成一个 44736 兆比特电路。术语 T3 和 DS3（数字信号3）也互换使用，具有相同的\
    \ T1/DS1 区别。\n\n![](img/0bbd5f5bd171414c5e2c49247aab35d6_32_png)\n\n# 258 第 5\
    \ 章 领域 4：通信与网络安全\n\n如上。E1 是专用的 2.048 兆比特电路，携带 30 个通道，16 个 E1 组成一个 E3，为 32.768\
    \ 兆比特。\n\n> 注意\nT1 和 T3 速度通常分别取值为 1.5 和 45 兆比特。本书将使用这些数字（它们也是考试的简写）。考试范围之外的是电路开销所需的少量带宽。原因是\
    \ 28 个 T1 乘以 1.544 兆比特等于 43.232 兆比特，低于 T3 44.736 兆比特的速度。E1—E3 的计算也是如此。\n\nSONET（同步光纤）通过光纤电传输多个\
    \ T 载电路。SONET 使用物理光纤环形进行冗余。\n\n# 帧继\n\n帧继是一种不提供错误恢复而专注于速度的包交换第 2 层 WAN 协议。帧继携带的高层协议（如\
    \ TCP/IP）可以提供可靠性。\n\n帧继在单个物理连接上复用逻辑连接以创建虚拟电路；PVC（永久虚拟电路）始终连接到像 T1 这样的专用电路。交换虚拟电路（SVC）建立“通话”、传输数据并在空闲超时后终止连接。帧继本地通过数据连接标识符（DLCI）进行，发音为“delci”。\n\
    \n# X.25\n\nX.25 是一种旧的包交换 WAN 协议。X.25 在 20 世纪 70 年代到 90 年代初为距离传输数据提供了一种低成本的方法，当时常用的选项是通过模拟调制解调器直接拨号。随着互联网的普及，X.25\
    \ 的流行已经衰落。\n\n全球包交换 X.25 网络与基于 IP 的全球互联网是分离的。X.25 执行纠错，这会增加链路的延迟。它可以携带其他协议，如 TCP/IP，但由于\
    \ TCP/IP 包含了自身的可靠性，因此没有必要在 X.25 层也提供可靠性。\n\n# ATM\n\n异步传输模式（ATM）是一种使用固定长度单元的 WAN\
    \ 技术。ATM 单元长度为 53 字节，包含 5 字节的头部和 48 字节的数据部分。\n\n与以太网相比，ATM 允许可靠的网络吞吐量。对于“每秒可以发送多少帧以太网”的答案是“取决于情况”。普通以太网\n"
