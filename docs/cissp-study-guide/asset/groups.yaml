    ## TCP 三次握手


    TCP 使用三次握手来建立可靠连接。连接是全双工的，双方相互同步（SYN）并确认（ACK）。这四个个标志位的交换分三个步骤完成：SYN、SYN-ACK、ACK，如图
    3.8 所示。


    客户端选择一个初始序列号设置在第一个 SYN 数据包中。服务器也选择自己的初始序列号，设置在图 5.8 所示的 SYN/ACK 数据包中。双方通过增加对方的序列号来确认对方的号：这就是确认号。双方使用序列号和确认号来检测丢失或乱序的段。


    一旦建立连接，每个段之后通常会跟上 ACK。连接最终将通过 RST（重置或断开连接）或 FIN（优雅地结束连接）结束。


    ## UDP


    UDP 是用户数据agram协议，是 TCP 的更简单、更快的亲戚。UDP 没有握手、会话或可靠性：正由于这个原因，它正式被称为“发送并祈祷”（Send and
    Pray）。与 TCP 默认的 20 字节头部相比，UDP 有更简单、更短的 8 字节头部（如图 5.9）。UDP 头部字段包括源 IP、目的 IP、数据包长度（头部和数据）和一个简单的（可选）校验和。如果使用，校验和为
    UDP 头部和数据提供有限的完整性保护。与不同


