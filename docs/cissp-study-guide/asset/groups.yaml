    ## 静态路由与默认路由


    对于简单的路由需求，静态路由可能就足够了。静态路由是固定的路由条目，例如：“网络 10.0.0.0/8 的路由通过路由器 192.168.2.7；网络 172.168.0.0/12
    的路由通过路由器 192.168.2.8。”大多数 SOHO（小型/家庭/办公室网络）路由器都有一个“默认路由”，将所有外部流量发送到（通常由 ISP 控制）。以下是一个典型的家庭局域网配置示例：


    - 内部网络：192.168.1.0/24

    - 内部防火墙 IP：192.168.1.1

    - 外部网络：192.0.2.0/30

    - 外部防火墙 IP：192.168.1.2

    - 下一跳地址：192.168.1.1


    防火墙具有内部和外部接口，IP 地址分别为 192.168.1.1 和 192.0.2.2。内部（信任）主机通过 DHCP 在 192.168.1.0/24
    子网上接收地址。外部流量被翻译为外部防火墙 IP 192.0.2.2。内部主机的默认路由是 192.168.1.1。默认路由是 192.0.2.1。这是一个由
    ISP 拥有的路由器。


    ## 路由协议


    静态路由适用于冗余有限或没有冗余的简单网络。SOHO 网络具有更复杂的路由需求。图 5.21 中的网络所有站点之间都有冗余路径。如果任何单一链路或站点发生故障，至少有一条备用路径可用。最快的线路是连接办公室
    A 到 B、以及 B 到 C 的 45 Mbps T3 链路。额外的 1.5 Mbps T1 链路连接数据中心到每个办公室。如果最左侧的 T3（数据中心与办公室
    A 之间）发生故障，从数据中心到办公室 A 有多条路径可用：最快的是 T3，然后是 T1。你可以对此网络使用静态路由，优先选择较快的 T3 而不是慢的 T1。问题是：如果
    T3 故障了会怎样？网络工程师喜欢


    路由协议分为两种基本类型：内部网关协议（IGP），如 RIP 和 OSPF，以及外部网关协议（EGP），如 BGP。私有网络使用内网网，而 EGP 用于互联网等公用网络。路由协议支持
    OSI 模型中的第 3 层（网络层）。


    ## 距离矢量路由协议


    使用指标来确定网络中的“最佳”路由。最简单的指标是跳数。在图 5.21 中，从数据中心通过 T3 到每个办公室的跳数为 1。从数据中心到每个办公室还有其他可用路径，例如通往办公室
    B 的 T3，然后是通往 A 的 T1。后者路由是两跳，第二跳是较慢的 T1。任何网络工程师都会倾向于选择从数据中心到办公室 A 的单跳 T3 连接，而不是通过办公室
    B 的双跳绕路。所有的路由协议都会这样做，选择单跳 T3。当您考虑办公室之间的连接时，情况变得更复杂了。流量 应该从办公室 A 路由到 B 吗？最短的跳数是直接的
    T1。但如果链路只有 1.5 Mbps：采取从办公室 A 下到数据中心再回传到 B 的双跳路由，可以获得 45 Mbps 的带宽，但代价是多出了一次跳数。像
    RIP 这样的距离矢量路由协议会选择直接的 T1 连接，并认为 1.5 Mbps 的一跳比 45 Mbps 的两跳“快”。大多数工程师（以及下一节描述的所有链路状态路由）都会持不同意见。距离矢量协议使用跳数等指标，并且容易产生在路由器之间循环的路由环。以下输出是
    Linux traceroute 的路由输出，起始于跳数 16 和 17 之间。nyc 和 bos 核心路由器将不断相互转发数据包，每个包都能实现正确的路由。


    | 主机 | IP | 跳 1 | 跳 2 | 跳 3 |

    | :--- | :--- | :--- | :--- | :--- |

    | pwc-03.inet.example.com | 10.11.37.141 | 165.484 ms | 164.335 ms | 175.928 ms
    |

    | pwc-02.inet.example.com | 10.11.23.9 | 162.291 ms | 172.713 ms | 171.532 ms
    |

    | nyc-01.inet.example.com | 10.11.5.101 | 296.967 ms | 193.454 ms | 199.457 ms
    |

    | bos-01.inet.example.com | 10.11.5.103 | 212.967 ms | 212.383 ms | 189.592 ms
    |

    | nyc-02.inet.example.com | 10.11.5.101 | 210.201 ms | 225.674 ms | 208.124 ms
    |

    | bos-02.inet.example.com | 10.11.5.103 | 189.089 ms | 201.505 ms | 201.659 ms
    |

    | nyc-03.inet.example.com | 10.11.5.103 | 334.19 ms | 320.39 ms | 245.182 ms |

    | bos-02.inet.example.com | 10.11.5.103 | 218.519 ms | 210.519 ms | 246.635 ms
    |


    ## RIP


    RIP（路由信息协议）是一种使用跳数为指标的距离矢量路由协议。收敛意味着网络上的所有路由器对路由状态达成一致。图 5.21 中通过 T3 从办公室 A 到
    B。


    没有故障的网络是“已收敛的”：所有路由器都认为路由可用。然后链路故障了；距离较远的路由器知道某个故障了。路由协议的目标是让收敛尽可能快。在现实世界中，机（如
    Cisco 6500）可以同时包含多个设备：路由器、交换机、防火墙、NIDS。考试可能会给出更清晰的例子：防火墙、专用交换机，或者如果考试引用多功能设备，将会对此明确说明。无论如何，了解如何将这些设备视为不同的概念是有帮助的。


    要说所有链路都了。冗余网络架构需要手动配置。路由协议是答案。路由协议的目标是自动学习网络拓扑并快速学习最佳路由。理想情况下，这应该在工程师睡觉时发生。


    RIP 的最大跳数为 15；16 被认为是“无限”。RIP 增加了对 CIDR 的支持。RIP 丢失了一个计时器以避免“抖动”（路由状态在“故障”和“正常”之间反复变化）。一旦
    RIP 将路由状态更改为“故障”，RIP 将保持该决策 180 秒。希望网络在此期间会完成收敛。如果没有，180 秒后，RIP 可能会更改其状态。


    水平分割意味着路由器不会从学习路由信息的接口再次发送路由信息。这防止了路由环。毒性倒是水平分割的扩展，路由器会将一个不可达的指标（16）发回路由。这加快了链路故障时的收敛速度。


    RIP 用于小型网络，因为其配置简单。然而，对于较大的网络，更倾向于使用 OSPF 等链路状态协议或 BGP 等外部网关协议，因为它们收敛更快且支持复杂的拓扑。


    ## 安全网络设备与协议 275


