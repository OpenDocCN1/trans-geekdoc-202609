    ## The TCP Handshake


    TCP uses a three-way handshake to establish a reliable connection. The connection
    is full duplex, and both synchronize (SYN) and acknowledge (ACK) each other. The
    exchange of these four flags is performed in three steps: SYN, SYN-ACK, ACK, as
    shown in Fig. 3.8.


    The client chooses an initial sequence number, set in the first SYN packet. The
    server also chooses its own initial sequence number, set in the SYN/ACK packet
    shown in Fig. 5.8. Each side acknowledges the other''s sequence number by incrementing
    it: this is the acknowledgement number. The use of sequence and acknowledgement
    numbers both sides to detect missing or out-of-order segments.


    Once a connection is established, ACKs typically follow for each segment. The
    connection will eventually end with a RST (reset or tear down the connection)
    or FIN (gracefully end the connection).


    ## UDP


    UDP is the User Datagram Protocol, a simpler and faster cousin to TCP, UDP has
    no handshake, session, or reliability: it is formally called “Send and Pray” for
    this reason. UDP has a simpler and shorter 8-byte header (shown in Fig. 5.9),
    compared to TCP''s default header size of 20 bytes. UDP header fields include
    source IP, destination IP, packet length (header and data), and a simple (optional)
    checksum. If used, the checksum provides limited integrity to the UDP header and
    data. Unlike


    ![](img/0bbd5f5bd171414c5e2c49247aab35d6_20_0.png)


    FIG. 5.8 TCP three-way handshake.


    ## 246 CHAPTER 5 Domain 4: Communication and Network Security


    | 0 | 7 8 | 15 16 | 23 24 | 31 |

    |---|---|---|---|---|

    | Source | Destination |

    | Port | Port |

    | Length | Checksum |

    | data octets ... | | | |


    FIG. 5.9

    UDP header [7].


    TCP, data usually is transferred immediately, in the first UDP packet. UDP operates
    at Layer 4.


    UDP is commonly used for applications that are “lossy” (can handle packet loss),
    such as streaming audio and video. It is also used for query-response applications,
    such as DNS queries.


    ## ICMP


    ICMP is the Internet Control Protocol, a helper protocol that helps Layer 3 (IP,
    see note). ICMP is used to troubleshoot and report error conditions: Without ICMP
    to help, IP would fail when faced with routing loops, ports, hosts, or networks,
    etc., that are down. ICMP has no concept of ports, as TCP and UDP do, but instead
    uses types and codes. Commonly used ICMP types are echo request and echo reply
    (using ping) and time to leave exceeded in transit (traceroute).


    ## Note


    > "Which protocol runs at layer 4?” is often a subject of fierce debate. We call
    this the “bucket game.” For example, which bucket does ICMP go into: Layer 3 or
    Layer 4? ICMP headers are at Layer 4, just like TCP and UDP, so many will answer
    “Layer 4.” Others argue ICMP is a Layer 3 protocol, since it assists IP (a Layer
    3 protocol), and has no ports.


    This shows how arbitrary the bucket game is: a packet capture shows the ICMP header
    at Layer 4, so many network engineers will want “Layer 4” never agree with a packet.
    The same argument exists for many routing protocols; for example, BGP is used
    to route at Layer 3, but BGP is carried by TCP (IP). This book will clear-cut
    bucket game protocol/layers in the text and tests, but avoid murky examples (just
    as the exam should).


    ## Ping


    Ping (named after sonar used to “ping” submarines) sends an ICMP Echo Request
    to a node and listens for an ICMP Echo Reply. Ping was designed to determine whether
    a node is up or down.


    Ping was a reliable indicator of node''s status on ARPanet or older Internet,
    when firewalls were uncommon (or not exist). Today, ICMP Echo Reply is a fairly
    reliable indicator that a node is up. Attackers use ICMP to map networks, so many
    sites filter type of ICMP such as Echo Request and Echo Reply. An unanswered ping
    (an ICMP Echo Request with no Echo Reply) does not mean host is down, the node
    may be down or Echo Reply may have been filtered at some point.


    ## Traceroute


    The traceroute command uses ICMP Time Exceeded messages to trace a network. As
    discussed, Time to Live is used to avoid routing loops: every time a packet passes
    through a router, the router decrements the TTL field. If the TTL reaches zero,
    the router drops the packet and sends ICMP Time Exceeded message to the original
    sender.


    Traceroute takes advantage of this TTL feature in a clever way. Assume a client
    is four hops away from server: the client sends a packet with a TTL of 4. Router
    A decrements the TTL to 3 and passes the packet to router B. Router B decrements
    the TTL to 0, drops it, and sends ICMP Time Exceeded message to the client. Router
    B is now identified. The client sends a packet with a TTL of 3 to the server.
    Router C decrements the TTL to 0, drops it, and sends ICMP Time Exceeded message
    to the client. Router C is now identified. The process continues until the server
    is reached, as shown in Fig. 5.10, identifying all routers along the route. Most
    traceroute clients (such as UNIX and Cisco) send UDP packets outbound, so the
    protocol does not matter. Windows tracer client sends ICMP packets outbound; Fig.
    5.11 shows Windows tracer output


    ![](img/0bbd5f5bd171414c5e2c49247aab35d6_22_0.png)


    FIG. 5.10 Traceroute.


    ## 248 CHAPTER 5 Domain 4: Communication and Network Security


    ![](img/0bbd5f5bd171414c5e2c49247aab35d6_23_0.png)


    **FIG. 5.11** for route to www.synergy.com. Both client types usually send packets
    for each hop (the "ms" columns in the 5.11 output).


    ## Application Layer TCP/IP Protocols and Concepts


    A multitude of protocols exist at TCP/IP''s Application Layer, which combines
    the Session, Presentation, and Application Layers of the OSI model.


    ## Telnet


    Telnet provides terminal emulation over a network. "Terminal" means text-based
    VT100-style access. Telnet servers listen on TCP port 23. Telnet was the standard
    way to access an interactive command shell over a network for 20 years.


    Telnet is weak because it lacks confidentiality; all data transmitted during a
    session is plaintext, including the username and password used to authenticate
    to the system. Attackers can sniff network traffic to steal authentication credentials
    in this way.


    Telnet also has limited integrity: attackers with access to a network can alter
    data, or seize control of Telnet sessions. Secure Shell (SSH) provides secure
    authentication, confidentiality, and integrity and is a recommended replacement
    for Telnet.


    ## FTP


    FTP is the File Transfer Protocol, used to transfer files to and from servers.
    Like Telnet, FTP has no confidentiality or integrity and should not be used to
    transfer sensitive data over insecure channels.


    ## Network Architecture and Design 249


    ## Note


    When discussing insecure protocols such as Telnet and FTP, statements like “no
    confidentiality” assume that they are used with default settings, with no additional
    hardening or encryption (such as using them via an IPSec VPN tunnel). You may
    mitigate the lack of confidentiality by using Telnet or FTP over an encrypted
    VPN tunnel or using SSH in place, among other options. Also, “no integrity” means
    there is little or no integrity at the application layer: some integrity may be
    provided at a lower layer, such as the transport layer.


    FTP uses two ports: the control connection (where commands are sent) is TCP port
    21; “Active FTP” uses a data connection (where data is transferred) that originates
    from TCP port 20. Here are the two socket pairs (the next two examples use arbitrary
    endpoints):


    - Client:1025 → Server:21 (Control Connection)

    - Server:20 → Client:1026 (Data Connection)


    Notice that the data connection originates from the server, in the opposite direction
    of the control channel. This breaks classic client-server data flow direction.
    Firewalls will block the active FTP connection for this reason, breaking Active
    FTP. Passive FTP addresses this issue by keeping all communication from client
    to server:


    - Client:1025 → Server:21 (Control Connection)

    - Client:1026 → Server:1025 (Data Connection)


    The FTP server tells the client which listening data connection port to connect
    to; the client then makes a second connection. Passive FTP is more likely to pass
    through firewalls cleanly, since it flows in classic client-server direction.


    ## TFTP


    TFTP is the Trivial File Transfer Protocol, which runs on UDP port 69. It provides
    a simpler way to transfer files and is often used for saving router configurations
    or “bootstrapping” (downloading an operating system) via a network by diskless
    workstations.


    TFTP has no authentication or directory structure: files are read and written
    to one directory, called /ftpboot. There is also no confidentiality or integrity.
    Like Telnet and FTP, TFTP is not recommended for transferring sensitive data over
    an insecure channel.


    ## SSH


    SSH was designed as a secure replacement for Telnet, FTP, and the UNIX “R” commands
    (rlogin, rshell, etc.). It provides confidentiality, integrity, and secure authentication,
    among other features. SSH includes SFTP (SSH FTP) and SCP (Secure Copy) for transferring
    files. SSH can also be used to securely tunnel other protocols, such as HTTP.
    SSH servers listen on TCP port 22 by default.

