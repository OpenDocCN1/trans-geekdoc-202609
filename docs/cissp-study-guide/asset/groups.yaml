    # 第 262 页 第5 章 领域 4：通信与网络安全


    ![](img/0bbd5f5bd171414c5e2c49247aab35d6_37_0.png)


    图 5.16


    Wireshark “VoIP 话”。


    带外通信。最后，任何通过不安全网络传输的 VoIP 流量都应该通过 SRTP 或 IPsec 等方法进行加密。永远不要假设 VoIP 流量默认是安全的。


    ## 微隔离 (Micro-segmentation)


    微隔离描述了所有系统（无论是物理还是云）中的过滤过程：“微隔离是在数据中心和云环境中创建区域的方法，以将工作负载相互隔离并对其进行单独安全防护。通过微隔离，系统管理员可以基于零信任方法创建策略，限制工作负载之间的网络流量。组织利用微隔离来减少网络攻击面、改进入侵遏制能力并加强合规性”（https://www.paltonetworks.com/cyberperedia/what-is-microsegmentation）。


    微隔离是零信任（此前在第 4 章领域 3：安全架构与工程中讨论过）的核心概念，并使用了软件定义网络 (SDN)、软件定义广域网 (SD-WAN) 和虚拟扩展局域网
    (VXLAN) 等技术。


    ## 软件定义网络 (Software-Defined Networks)


    通过虚拟化和云服务，存储和计算日益与传统的服务器和磁盘密集型数据中心解耦。软件定义网络 (SDN) 在组织网络处理方法上寻求一种类似的范式转变。一个简单易懂的理解是将
    SDN 视为一种网络虚拟化方法，并将网络与通常用于此目的的硬件解耦。


    软件定义网络 (SDN) 将路由器的控制面与数据面（转发面）分离。控制面负责路由决策，数据面负责通过路由器转发数据（数据包）。在 SDN 中，路由决策是在远程完成，而不是在每个独立的路由器上完成。


    ## 网络架构与设计 263


    SDN 的目标之一是允许微隔离：即灵活且可定制的网络能力。SDN 的一个标志是能够利用廉价的“白盒”网络硬件和开放协议，而非传统的专有硬件、固件和软件来实现灵活性。SDN
    的另一个常见目标是根据基础设施中的实际需求，灵活适应网络能力规则的动态实例化。


    该领域广知的协议是 OpenFlow，它除了其他功能外，允许在中央控制器上指定或更新交换规则。OpenFlow 是一种使用 TLS 加密的 TCP 协议。


    ## 软件定义广域网 (Software-Defined Wide Area Network)


    软件定义广域网 (SD-WAN) 将软件定义网络的概念并扩展到云端。它结合了多种技术，包括 MPLS、蜂窝网络和宽带：软件定义广域网 (SD-WAN) 是一种虚拟广域网，允许企业利用任何组合的传输服务（包括
    MPLS、LTE 和宽带服务）将用户连接到应用程序。SD-WAN 使用集中功能安全且智能地引导流量跨越广域网并直达 SaaS 和 IaaS 商。这提升了应用程序性能并提供了高质量的用户体验，从而提高了业务生产力和敏捷性并降低了
    IT 成本 [10]。


    SD-WAN 可以自动为任何用户或应用程序提供最佳连接，让网络根据集中管理的规则路由流量，无论流量的入口和出口点在哪里，并确保完全安全。例如，如果分支办公室的用户正在使用
    Office365，SD-WAN 可以将其流量直接路由到该应用最近的云数据中心，从而提高用户的网络响应速度并降低业务的带宽成本 [11]。


    ## 虚拟扩展局域网 (Virtual Extensible Local Area Network)


    虚拟局域网 (VXLAN) 将 VLAN（虚拟局域网，在本章稍后讨论）的概念扩展到云端。VLAN 支持 4096 个分段 ID（或 VLAN），而 VXLAN
    支持 1600 万个分段 ID。VXLAN 是一种使用 UDP 封装的协议，通过 VTEP（VXLAN 隧道端点）实现扩展。VXLAN 允许在云环境中创建大规模的分段，解决了传统物理网络限制的问题。


    （此处后续为原文碎片，整理如下：）


