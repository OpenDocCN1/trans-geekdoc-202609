    | 0 | 7 8 | 15 16 | 23 24 | 31 |

    |---|---|---|---|

    | 源 | 目的 |

    | 端口 | 端口 |

    | 长度 | 校验和 |

    | 数据字节 | ... | | |


    图 5.9 UDP 头部 [7]。


    TCP，数据通常立即传输。UDP 运行在第 4 层。


    UDP 通常用于“易丢性”（可以处理数据包丢失）的应用，例如流媒体和视频。它也用于查询-响应应用，例如 DNS 查询。


    ## ICMP


    ICMP 是互联网控制协议，一种辅助第 3 层（IP，见备注）的协议。ICMP 用于诊断和报告错误状况：如果没有 ICMP 的帮助，IP 在遇到路由循环、主机或网络故障将会失败。ICMP
    没有像 TCP 和 UDP 那样的端口概念，而是使用类型和代码。常用的 ICMP 类型是回显请求（echo request）、回显响应（echo reply，使用
    ping）和超时（time to exceeded，使用 traceroute）。


    ## 备注


    “哪个协议运行在第 4 层？”通常是一个激烈争论的话题。我们称之为“猜测游戏”。例如，ICMP 进入第 3 层还是第 4 层？ICMP 头部位于第 4 层，就像
    TCP 和 UDP 一样，因此很多人回答“第 4 层”。其他人认为 ICMP 是第 3 层协议，因为它协助 IP（第 3 层协议），并且没有端口。显示了猜测游戏有多随意：数据包捕获显示
    ICMP 头部在第 4 层，因此许多工程师会认为是“第 4 层”。对于许多协议存在同样的争议；例如，BGP 用于路由到第 3 层，但 BGP 是由 TCP（IP）携带的。这本书是文本和测试中的猜测游戏，但避免了模糊的示例（正如所示）。


    ## Ping


    Ping（源自声呐，用于“探测”海底）向节点发送 ICMP 回显请求并等待 ICMP 回显响应。Ping 设计用于判断节点是开启还是关闭。


    Ping 是 ARPanet 或更早互联网上节点状态的可靠指标。今天，ICMP 回显响应是节点开启的相当可靠指标。攻击者使用 ICMP 映射网络，许多站点过滤
    ICMP 回显请求和回显响应。未响应的 ping（没有回显响应的 ICMP 回显请求）并不意味着节点关闭，可能在某处被过滤了。


    ## Traceroute


    traceroute 命令使用 ICMP 超时消息来跟踪网络。如所述，生存时间（TTL）用于避免路由循环：每当数据包通过路由器时，路由器就会减少 TTL。如果
    TTL 达到零，路由器将丢弃数据包并向发送者发送 ICMP 超时消息。Traceroute 巧妙地利用了 TTL 特性。假设客户端距离服务器四跳：客户端发送
    TTL 为 4 的数据包。路由器 A 将 TTL 减 3，并将数据包传给路由器 B。路由器 B 将 TTL 减 0，丢弃数据包并向客户端发送 ICMP 超时消息。路由器
    B 现在被识别。客户端发送 TTL 为 3 的数据包到服务器。路由器 C 将 TTL 减 0，丢弃数据包并向客户端发送 ICMP 超时消息。路由器 C 现在被识别。过程持续直到到达服务器，如图
    5.10 所示，识别沿线的所有路由器。大多数 traceroute 客户端（如 UNIX 和 Cisco）发送 UDP 数据包，因此协议并不重要。Windows
    tracer 发送 ICMP 数据包；图 5.11 显示 Windows tracer 输出


    ![](img/0bbd5f5bd171414c5e2c49247aab35d6_22_0.png)


    图 5.10 Traceroute。


    ## 248 章 第 5 章 领域 4：通信与网络安全


    ![](171414c5e2c4924723_0.png)


    **图 5.11** 路由到 www.synergy.com。客户端类型通常为每个跳发送数据包（5.11 输出中的列）。


    ## 应用层 TCP/IP 协议与概念


    TCP/IP 的应用层存在大量协议，它结合了 OSI 模型的会话层、表示层应用层。


    ## Telnet


    Telnet 在网络上提供终端仿真。“终端”意味着基于文本的 VT100 访问。Telnet 服务器监听 TCP 端口 23。20 年来，Telnet 是通过网络访问交互式命令
    shell 标准方式。


    Telnet 是脆弱的，因为它缺乏加密性；会话期间传输的所有数据都是明文，包括用于系统验证的用户和密码。攻击者可以通过这种方式嗅探网络流量来窃身份凭据。


    Telnet 也有有限的完整性：访问网络的攻击者可以更改数据或接管 Telnet 会话。安全 Shell（SSH）提供了安全的身份验证、加密完整性，是 Telnet
    的推荐替代方案。


    ## FTP


    FTP 是文件传输协议，用于在服务器之间传输文件。与 Telnet 一样，FTP 没有加密完整性，不应通过不安全的通道传输敏感数据。


    ## 网络架构与设计 249


    ## 备注


    讨论 Telnet 和 FTP 等不安全协议时，“没有加密性”等说法假设它们是以默认设置使用的，没有额外的加固或加密（例如通过 IPSec VPN 隧道使用）。你可以通过在加密的
    VPN 隧道上使用 Telnet 或 FTP 或使用 SSH 等选项来缓解缺乏加密的问题。此外，“没有完整性”意味着应用层几乎没有或没有完整性：在较低层次（如传输层）可能会提供某些完整性。


    FTP 使用两个端口：控制连接（发送命令的地方）是 TCP 端口 21；“主动 FTP”使用源自 TCP 端口 20 的数据连接（传输数据的地方）。以下是两个套接字对（接下来的两个示例使用任意端点）：


    - Client:1025 → Server:21（控制连接）

    - Server:20 → Client（数据连接）


    注意数据连接源自服务器，方向与控制通道相反。这破坏了经典的客户端-服务器数据流方向。防火墙会因为此阻止主动 FTP 连接，导致主动 FTP 。被动 FTP
    通过保持所有通信从客户端到服务器来解决此问题：


    - Client:1025 → Server:21（控制连接）

    - Client:1026 → Server:1025（数据连接）


    FTP 服务器告诉客户端连接到哪个监听的数据端口；客户端随后建立第二个连接。被动 FTP 更有可能顺利通过防火墙，因为它符合经典的客户端-服务器方向。


    ## TFTP


    TFTP 是简易文件传输协议，运行在 UDP 端口 69。它提供了一种更简单的文件传输方法，通常用于保存路由器配置或通过网络无磁盘工作站进行“引导启动”（下载操作系统）。


    TFTP 没有身份验证或目录结构：文件被读取和写入一个名为 /ftpboot 的目录。它也没有加密或完整性。与 Telnet 和 FTP 一样，不建议在不安全的通道上传输敏感数据。


    ## SSH


    SSH 设计为 Telnet、FTP 和 UNIX “R” 命令（rlogin、rshell 等）的安全替代方案。它提供了加密、完整性和安全身份验证等其他功能。SSH
    包含了用于传输文件的 SFTP（SSH FTP）和 SCP（安全拷贝）。SSH 还可以用于安全地隧道化传输其他协议，如 HTTP。SSH 服务器默认监听 TCP
    端口 22。


