    # CHAPTER 5 Domain 4: Communication and Network Security


    Interneting emphasize robustness and survivability, including the capability to
    withstand large portions of the underlying networks” [1].


    Instead of dedicated circuits, data is broken into packets, each sent individually.
    If multiple routes are available between two points on a network, packet switching
    can choose the best route, and fall back to secondary routes in case of failure.
    Packets may take any path (different paths) across a network and are then reassembled
    by the receiving node. Missing packets are retransmitted, and out-of-order packets
    can be re-sequenced.


    Unlike circuit-switched networks, packet-switched networks made unused bandwidth
    available for other connections. This can give packet-switched networks a cost
    advantage over circuit-switched.


    # Quality of Service


    Using unused bandwidth available for other applications presents a challenge:
    what happens when all bandwidth is consumed? Which applications “win” (receive
    required bandwidth?) This is not an issue with circuit-switched networks, which
    applications have exclusive access to dedicated circuits or channels.


    Packet-switched networks use Quality of Service (QoS) to give specific traffic
    over other traffic. For example: QoS is often available to Voice over IP (VoIP)
    traffic (voice via packet-switched data networks), to avoid interruption of phone
    calls. Less time-sensitive traffic, such as SMTP (Simple Mail Transfer Protocol,
    a store-and-forward protocol used to exchange email between servers), receives
    a lower priority. Delays in exchanging emails are less likely to be noticed compared
    to dropped calls.


    # Layered Design


    Network models as OSI and TCP/IP are designed in layers. Each layer performs a
    specific function, and the complexity of that functionality is contained within
    its layer. Changes in one layer do not directly affect another: changing your
    physical network connection from wired to wireless (at Layer 1, as described below)
    has no effect on your Web browser (at Layer 7), for example.


    # Models and Stacks


    A network model is a description of how a network protocol operates, such as the
    OSI Model or TCP/IP Model. A network stack is a network protocol suite programmed
    in software or hardware. For example, the TCP/IP Model describes TCP/IP, and your
    laptop runs the TCP/IP stack.


    # The OSI Model


    The OSI (Open System Interconnection) Reference Model is a layered network model.
    The model is abstract: we do not utilize the OSI model in our systems (most now
    use the TCP/IP model); it is used as a reference point, so “Layer 1” (physical)
    is universally understood, whether you are running Ethernet or ATM, for example.
    “Layer X” in this book refers to the OSI model.'
