  mdcn: "\n\n# OSPF\n\n最短路径优先（Open Shortest First, OSPF）是一种开放的链路状态路由协议。OSPF 路由器会学习其“区域”内的网络拓扑结构（即路由器维护路由的网络部分，对于小型网络通常是整个网络）。OSPF\
    \ 路由器发送事件驱动的更新。如果一个网络收敛了一周，OSPF 路由器将不再发送任何更新。OSPF 的收敛速度远快于 RIP 等距离矢量协议。在图 5.21\
    \ 中，OSPF 会选择从 Office A 到 B 的双跳 T3 路由，而不是单跳 T1 路由。\n\n> 注意\n> 示例强烈倾向于使用私有标准，这就是为什么这里没有讨论像\
    \ Cisco EIGRP 这样的私有路由协议。\n\n# BGP\n\nBGP 是边界网关协议（Border Gateway Protocol），是互联网上使用的路由协议。BGP\
    \ 在自治系统之间路由，自治系统是具有多个 Internet 连接的网络。BGP 具有一些距离矢量属性，但在形式上被视为路径路由协议。\n\n# 调制解调器\
    \ (Modem)\n\nModem 是调制/解调器（Modulator/Demodulator）。它接收二进制数据并将其调制成模拟声音，这种声音可以在设计用于传输人声的电话网络上传输。接收\
    \ Modem 将模拟声音解调回二进制数据。调制解调器是异步设备：它们不随时钟信号运行。\n\n# DTE/CEU 和 DSU\n\nDTE（数据终端设备，Data\
    \ Terminal Equipment）是网络“终端”，意味着任何类型的连接网络的用户机器，如桌面电脑、服务器或实际终端。DCE（数据电路终止设备，Data\
    \ Circuit-Terminating Equipment，或称为数据通信设备）是连接 DTE 的设备，例如路由器。这些术语最用法是 DTE/DCE，它们的含义更为具体：DCE\
    \ 标记了 ISP 网络的终点。它连接到终端设备（DTE），后者是客户的责任。DCE 与 DTE 相交的点称为分界点（demarc）：分界点，即 ISP 责任结束而客户责任开始的地方。\n\
    \n通过 DCE/DTE 传输的电路是同步的（使用时钟信号）。双方必须同步到 DCE 提供的时钟信号。DTE 设备是调制解调器或 CSU/DSU（通道服务单元/数据服务单元）。\n\
    \n# 硬件运行\n\n硬件运行涉及日常运营问题，如冗余电源、维护适当的保修和支持合同。\n\n# 安全通信 279\n\n# 冗余电源\n\n路由器和防火墙等关键设备应配备冗余电源。每个电源应连接到不同的插座，且这些插座也应位于不同的电路。应使用浪涌保护器和\
    \ UPS，并为关键设备提供发电机备份。我们将在第 8 章第 7 域：安全操作中讨论浪涌保护器、UPS 和发电机。\n\n# 保修与支持\n\n所有设备都应在有效的供应商保修范围之内，并有适当的支持合同。支持合同的价格通常根据响应时间和和其他变量确定（响应越快，成本越高）。Cisco\
    \ SmartNet 提供多个级别的覆盖范围：\n\n- 24 × 7：2 小时响应，每天 24 小时，每周 7 天，包括节假日\n- 24 × 7：4 小时响应，每天\
    \ 24 小时，每周 7 天，包括节假日\n- 8 × 5：4 小时响应，基于仓库时间的本地工作时间，每周 5 天，不包括节假日\n- 8 × 7 下一个日历：下个日历交付，基于仓库时间的本地工作时间，每周\
    \ 7 天，包括节假日\n- 8 × 5 下一个工作日：下一个工作日交付，基于仓库时间的本地工作时间，每周 5 天，不包括节假日 [17]\n\n请注意Cisco\
    \ SmartNet 本身是不可测试的；使用上述示例是因为这种分级在行业内非常常见。对于选择哪种级别的支持没有“标准答案”：期望的响应时间可以在风险评估后确定。业务连续性计划指标（如最大允许停机时间，MAD，在第\
    \ 8 章第 7 域：安全操作中讨论）可以决定购买哪种级别。关键设备应在达到支持结束（EoS）之前退役（如第 3 章“资产安全”所述）。请注意，组织可能选择对包括通用\
    \ PC 在内的不那么关键设备进行自保，但在进行自保之前必须进行彻底的风险评估。\n\n# 安全通信\n\n保护传输中的数据是我们面临的最复杂挑战之一。互联网提供了全球通信——但几乎没有内置的机密性、完整性或可用性。为了保护我们的数据，我们必须自己动手；安全通信描述了实现这一目标的方法。\n\
    \n# 身份验证协议与框架\n\n身份验证协议在网络上验证身份声明。良好的安全设计确保即使网络监听者可能嗅探客户端与验证服务器之间的所有数据包，协议仍能保持安全。正如我们很快看到的，PAP\
    \ 未通过这项测试，但 CHAP 和 EAP 通过了测试。\n\n# PAP 和 CHAP\n\nPAP（密码验证协议）是一种非常弱的身份验证协议。它以明文发送用户名和密码。能够嗅探验证过程的攻击者可以通过重放攻击来发动简单的重放攻击。CHAP（挑战握手认证协议）是一种更安全的身份验证协议，它不会暴露明文，且不易受到重放攻击的影响。CHAP\
