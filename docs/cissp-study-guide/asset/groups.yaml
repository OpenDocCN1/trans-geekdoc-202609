    Fiber Optic network cable (simply called “fiber”) uses light to carry information,
    which can carry a tremendous amount of information. Fiber can be used to transmit
    via long distances: past 50 miles, further than any copper cable such as twisted
    pair or coaxial. Fiber’s advantages are speed, distance, and immunity to EMI.
    Disadvantages include cost and complexity.'
