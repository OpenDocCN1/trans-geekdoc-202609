    # Unicast, Multicast, and Broadcast Traffic


    Unicast is one-to-one traffic, such as a client surfing the Web. Multicast is
    one-to-many, and the “many” are preselected. Broadcast is one-to-all on a LAN.

    Multicast traffic uses “Class D” addresses when used over IPv4. Nodes are placed
    into multicast groups. A common multicast is streaming audio or video. Sending
    1000 via unicast would require a large amount of bandwidth, so multicast is used.
    It works like a tree; the initial stream is the root, and each member of the multicast
    group a leaf. One stream is sent from the streaming server, and it branches on
    the network as it reaches with multiple routes for nodes in the multicast group.
    Multicast typically uses UDP.


    # Limited and Directed Broadcast Addresses


    Broadcast traffic is sent to all stations on a LAN. There are two types of IPv4
    broadcast-addresses: limited broadcast and directed broadcast. The limited broadcast
    address is 255.255.255. It is “limited” because it is never forwarded across a
    router, unless across a directed router.


    The directed (also called-directed) broadcast address of the 192.0.2.0/24 network
    is 192.0.2.255 (the host portion of the address is all “1” in binary, or 255).
    It is called “directed” because broadcast to these addresses may be sent from
    remote nodes (it may be “directed”).


    # Layer 2 Broadcast Traffic


    Layer 2 broadcast traffic reaches all nodes in a “broadcast domain.” Devices on
    the same LAN (or VLAN) are in the same broadcast domain. The Ethernet broadcast
    address is MAC address “FF:FF:FF:FF:FF:FF”: traffic sent to that address on an
    Ethernet switch is received by all connected nodes.


    # Promiscuous Network Access


    Accessing unicast traffic on a network segment requires “promiscuous” network
    access. Systems as Network Intrusion Detection Systems (NIDS) require promiscuous
    network access in order to monitor all traffic on a network. Network nodes normally
    only “see” unicast traffic directly to them. Accepting unicast traffic requires
    two things: a network interface card (NIC) configured in promiscuous mode and
    the ability to access other unicast traffic on a network segment.


    Placing a NIC in promiscuous mode normally requires super-user access, such as
    the root user on a UNIX system. Devices such as switches provide traffic isolation,
    so that each host will only receive unicast traffic sent to it (in addition to
    broadcast and multicast traffic). As we will see in a later section, a hub, switch
    span port, or TAP is typically used to provide promiscuous network access.'
