    软件定义网络 (SDN) 允许在 2 层进行隔离。无线局域网 (WLAN) 传输信息。拒绝服务攻击 (DoS) 和可用性。免许可频段。2.4 GHz 频率。管理、主模式和监控模式。接入点。


