    TCP 端口 53。核心 DNS 函数是 `getbyname()` 和 `gethostbyaddr()`。给定一个名称（如 www.syngress.com），`getbyname`
    返回一个 IP 地址，例如 192.0.2.187。给定一个地址（如 192.0.2.187），`gethostbyaddr` 返回名称 www.syngress.com。


    权威域名服务器提供域域内名称的“权威”解析。递归域名服务器会解析它本身不未知的名称。缓存服务器会临时缓存之前解析过的名称。


    # DNS 弱点


    DNS 大多数请求使用不可靠的 UDP 协议，且原生 DNS 不提供身份验证。DNS 的安全性依赖于 16 位源端口和 16 位查询 ID。攻击者能够通过盲猜数字来轻易伪造
    UDP DNS 响应。


    缓存投毒攻击试图欺骗 DNS 服务器缓存伪造的响应。如果 bank.example.com 位于 192.0.2.193，而 evil.example.com
    位于 198.18.8.17，攻击者可能尝试通过发送伪造响应来投毒 DNS 服务器的缓存。如果缓存 DNS 服务器接受了该响应，它将在随后的 bank.example.com
    请求中返回被污染的响应（直到记录过期为止）。


    # DNSSEC


    DNSSEC（域名服务器安全扩展）通过使用公钥加密为 DNS 响应提供身份验证和完整性。它不提供机密性；它像 DNS 响应的数字签名。


    构建互联网规模的公钥基础设施是一项艰巨的任务，DNSSEC 仅为了这种安全性而被采用。研究人员 Dan Kaminsky 在 2008 年公布了一种改进的
    DNS 投毒攻击，这导致人们再次呼吁广泛采用 DNSSEC。有关改进的缓存投毒攻击和防御的更多细节，请访问 https://www.kb.cert/org/vuls/id/800113。


    # 网络架构与设计 251


    DoT 和 DoH

    DNS over TLS (DoT) 和 DNS over HTTPS (DoH) 是两种竞争标准，它们通过 TLS 传输并加密 DNS 流量。DoT 使用专用端口（TCP
    端口 853），而 DoH 使用 TCP 端口 443 上的 HTTPS。与 DNSSEC 不同，两者都为客户端解析器和 DoH 服务器之间提供机密性。DoH
    赢得了更大的市场份额，目前被美国地区的 Firefox 默认使用。


    # SNMP


    SNMP 是简单网络管理协议，主要用于监控网络设备。像 MRTG 这样的网络监控软件使用 SNMP 轮询网络设备上的代理以及接口状态（开启/关闭）、带宽利用率、CPU
    温度等许多指标。SNMP 代理使用 UDP 端口 161。

    SNMPv1 和 v2c 使用读取和写入的团体字符串来访问网络设备。设备使用默认团体字符串作为读取的“public”和写入的“private”。此外，这些团体字符串通常很少更改（如果改的话），并且通常在网络中明文传输。能够嗅探或猜测团体字符串的攻击者可以访问网络设备。

    SNMPv3 设计用于提供机密性、完整性和身份验证。尽管 SNMP2c 仍然非常流行，但由于之前的版本缺乏安全性，强烈建议使用 SNMPv3。


    # HTTP 和 HTTPS


    HTTP 是超文本协议，用于传输数据。HTTPS（安全超文本传输协议）通过 SSL/TLS 加密 Web 数据（见下文 SSL and TLS 部分）。HTTP
    使用 TCP 端口 80，HTTPS 使用 TCP 端口 443，HTML（超标记标记）用于显示内容。


    > 注意

    HTTP 和 HTML 经常被混淆。区别在于：你通过 HTTP 传输 Web 数据，并通过 HTML 查看它。


    # BOOTP 和 DHCP


    BOOTP 是启动引导协议，用于无盘系统引导网络。许多 BIOS 现在直接支持 BOOTP，允许 BIOS 在没有磁盘的情况下网络加载操作系统。BOOTP
    启动分为两个阶段：先通过 BOOTP 确定 IP 地址和 OS 镜像名称，然后使用 TFTP 下载操作系统。


    DHCP（动态主机配置协议）设计用于通过增加功能来取代并改进 BOOTP。DHCP 允许更多的配置选项，以及为系统分配 IP 地址。DHCP 系统可以配置为接收
    IP 地址分配、DNS 服务器和默认网关。


    BOOTP 和 DHCP 使用相同的端口：服务器 UDP 端口 67，客户端 UDP 端口 68。


    # 传输介质


    传输介质是信号传输的物理路径。传输介质可分为引导式或无线。引导式媒体包括双绞线、同轴和光纤。无线媒体包括无线波、微波和红外线。


    电磁干扰 (EMI) 是电磁场对电路的干扰。它会导致数据错误和性能下降。


    串扰是从一根线缆泄漏到另一根线缆的信号干扰。在双绞布线中很常见。


    衰减是信号在介质中传输时的强度损失。为了补偿衰减，会使用中继器或放大器。


    # 双绞线


    双绞线是局域网（LAN）常见的介质类型。有两种：非屏蔽双绞线 (UTP) 和屏蔽双绞线 (STP)。


    非屏蔽双绞线 (UTP) 由没有屏蔽的绝缘线线对组成。它廉价且易于安装，但更容易受到 EMI 和串扰的影响。


    屏蔽双绞线 (STP) 每对周围都有金属屏蔽以减少 EMI。它比 UTP 贵且复杂。


    双绞线按类别分类，类别定义了性能速度和频率：

    - Cat 3：高达 10 Mbps

    - Cat 5：高达 100 Mbps

    - Cat 5e：高达 1 Gbps

    - Cat 6：高达 10 Gbps（短距离）

    - Cat 6a：高达 10 Gbps（100 米内）

    - Cat 7：高达 10 Gbps


    # 同轴电缆


    同轴电缆由绝缘层包围的中心导体、金属屏蔽和外壳组成。金属屏蔽保护信号免受 EMI 影响。同轴电缆用于有线电视、宽带网络和视频。


    同轴电有两种：

    - 细轴 (RG-58)：较细，用于旧的以太网。

    - 粗轴 (RG-8)：较厚，用于旧的骨干网。


    # 光纤


    光纤使用光脉冲通过玻璃或塑料纤维传输数据。它对 EMI 免疫，并且比铜电缆可以在更远距离传输更多数据。


    光纤有两种类型：

    - 单模：使用纤细纤芯和激光光源传输远距离数据。

    - 多模：使用较宽的纤芯和 LED 光源传输短距离数据。


    # 对比表


    | 介质 | 带宽 | 距离 | EMI 抗性 | 成本 |

    | :--- | :--- | :--- | :--- | :--- |

    | 双绞线 (UTP) | 低到中 | 短 | 低 | 低 |

    | 双绞线 (STP) | 低到中 | 短 | 中 | 中 |

    | 同轴 | 中 | 中 | 高 | 中 |

    | 光纤 | 极高 | 极长 | 全 | 高 |

    | 无线 | 中 | 可变 | 低 | 可变 |

    '
