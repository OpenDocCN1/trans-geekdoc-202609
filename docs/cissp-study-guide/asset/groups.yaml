    # Domain 4: Communication and Network Security


    ## 5


    ## Exam objectives in this chapter:


    - Network Architecture and Design

    - Secure Network Devices and Protocols

    - Secure Communications


    ## Unique Terms and Definitions


    - The OSI model—a network model with seven layers: physical, data link, network,
    transport, session, presentation, and application

    - The TCP/IP model—a simpler network model with four layers: network access, Internet,
    transport, and application

    - Packet-switched network—a form of networking where bandwidth is shared and data
    is carried in units packets

    - Switch—a layer 2 device that carries traffic on one LAN, based on MAC addresses

    - Router—a layer 3 device that routes traffic from one LAN to another, based on
    IP addresses

    - Carrier Sense Multiple Access (CSMA)—a method used by Ethernet networks to allow
    shared usage of a baseband (one-channel) network and avoid collisions (multiple
    interfering signals)


    ## Introduction


    Communication and Network Security is fundamental to our modern life. The Internet,
    the World Wide Web, online banking, instant messaging, email, and many other technologies
    rely on network security: our modern world cannot exist without it. Communications
    and Network Security focuses on the confidentiality, integrity, and availability
    of data in motion.


    Communications and Network Security is one of the largest in the Common Body of
    Knowledge and contains more concepts than any other domain. This domain is also
    one of the most technically deep domains, requiring technical edge down to packets,
    segments, frames, and their headers. Understanding this domain is critical to
    ensure success on the exam.


    ## Network Architecture and Design


    Our first section is network architecture and design. We will discuss how networks
    should be designed and the controls they may contain, focusing on deploying defense-in-depth
    strategies, and weighing the cost and complexity of a network control versus the
    benefit provided.


    ## Network Defense-in-Depth


    Communications and Network Security employs defense-in-depth, as we do in all
    8 domains of the Common Body of Knowledge. Any one control may fail, multiple
    controls are always recommended. Before *malware* (malicious software) can reach
    a server, it may be analyzed by: routers, firewalls, intrusion detection systems,
    and host-based protections as antivirus software. Hosts are patched, and users
    have been provided with awareness of malware risks. The failure of any one of
    these controls should not lead to compromise.


    No single concept described in this chapter (or any other) provides sufficient
    defense against possible attacks: these concepts should be used in concert.


    ## Fundamental Network Concepts


    Before we can discuss Communications and Network Security concepts, we need to
    understand the fundamental concepts behind them. Terms like “broadband” are often
    used informally: the exam requires a precise understanding of information security
    terminology.


    ## Simplex, Half-Duplex, and Full-Duplex Communication


    *Simplex* is one-way, like a radio tuned to a music station. *Half-duplex* communication
    sends or receives at one time only (not simultaneously), like a walkie-talkie.
    *Full-duplex* communications send and receive simultaneously, like two people
    having a face-to-face conversation.


    ## Baseband and Broadband


    Baseband networks have one channel and can send only one signal at a time. Ethernet
    networks are baseband; “100baseT” UTP cable means 100 megabit, base and twisted
    pair. Broadband networks have multiple channels and can send multiple signals
    at a time, like cable TV. The “channel” derives from communications like radio.


    ## Analog and Digital


    Analog communications are what our ears hear, a continuous wave of information.
    The original phone networks were analog networks, designed to carry the human
    voice. Digital communications transfer data in bits: ones and zeros. A vinyl record
    is analog; a compact disc is digital.


    ## LANs, WANs, MANs, GANs, and PANs


    LAN is a Local Area Network. A LAN is a comparatively small network, typically
    confined to a building or an area one. A MAN is a Metropolitan Area Network, which
    is typically confined to a city, a zip code, a campus, or office park. A WAN is
    a Wide Area Network, typically covering cities, states, or countries. A GAN is
    a Global Area Network, a global collection of WANs.


    The Global Information Grid (GIG) is the US Department of Defense (DoD) global
    network, one of the largest, the smallest of these private networks in the world.


    At the other end of the spectrum, the smallest of these networks are PANs: Personal
    Area Networks, with a range of 100 meters or less. Low-power wireless technologies
    such as Bluetooth use PANs.


    ## Exam Warning


    The exam is simpler and more clear-cut than the real world. There are real-world
    exceptions to statements like “A LAN is typically confined to a building or area
    within one.” The exam will be more clear-cut, as this will. If you read examples
    given in this book, and “that’s usually true, but a bit simplistic,” then you
    are correct. Simplicity is by design, to help you pass the exam.


    ## Internet, Intranet, and Extranet


    The Internet is a global collection of peered networks running TCP/IP, providing
    best effort service. An Intranet is a privately owned network running TCP/IP,
    such as a company network. An Extranet is a connection between private Intranets,
    such as connections to business partners Internet.


    ## Circuit-Switched and Packet-Switched Networks


    The original voice networks were circuit-switched: a dedicated circuit or channel
    (portion of a circuit) was dedicated to two nodes. Circuit-switched networks can
    provide dedicated bandwidth to point-to-point connections, such as a T1 connecting
    offices.


    One drawback of circuit-switched networks: once a channel is opened, it cannot
    be used by others even if idle. Packet-switched networks, however, break data
    into packets that can be routed independently.


