    # 安全网络设备与协议


    让我们从第 1 层到运行第 7 的应用层代理防火墙查看网络设备。许多此类网络设备（如路由器）都有专用的协议，例如路由协议。


    # 中继器和集线器


    中继器和集线器是第 1 层设备。中继器从一个端口接收比特，并在另一个端口“重复”它们。中继器不理解协议；它只是简单地重复比特。中继器通常用于扩展网络长度。


    集线器是具有两个以上端口的设备。它从一个端口接收比特并在所有端口重复它们。在交换机变得常见且廉价之前，集线器非常普遍。集线器不提供流量隔离或完整性；所有节点通过集线器发送所有流量。这意味着连接到集线器的攻击者可能会通过集线器读取并可能更改流量。集线器还是半双工设备；它们不能同时发送和接收。任何连接到集线器的设备都会协商为半双工模式，这会导致网络拥塞。集线器还有“冲突域”：任何节点都可以与另一个节点发送流量（有关冲突的更多信息，请参见“CSMA
    部分”）。缺乏安全性、半双工模式和大型冲突域的集线器不适用于大多数现代用途。


    # 桥


    桥接器和交换机是第 2 层设备。桥接器有两个端口并将工作段连接在一起。每个段通常有多个节点，桥接器学习两侧节点的 MAC 地址。桥的同一侧两个节点之间的流量不会跨桥转发。从桥的一侧发送到另一侧的发送的流量将跨桥转发。桥接器提供流量隔离，并通过学习连接节点的
    MAC 地址来做出转发决策。


