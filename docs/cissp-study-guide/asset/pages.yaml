- pgno: 24
  md: '# Network Architecture and Design 249


    # Note


    When discussing insecure protocols such as Telnet and FTP, statements like “no
    confidentiality” assume that they are used with default settings, with no additional
    hardening or encryption (such as using them via an IPSec VPN tunnel). You may
    mitigate the lack of confidentiality by using Telnet or FTP over an encrypted
    VPN tunnel or using SSH in place, among other options. Also, “no integrity” means
    there is little or no integrity at the application layer: some integrity may be
    provided at a lower layer, such as the transport layer.


    FTP uses two ports: the control connection (where commands are sent) is TCP port
    21; “Active FTP” uses a data connection (where data is transferred) that originates
    from TCP port 20. Here are the two socket pairs (the next two examples use arbitrary
    endpoints):


    +   - Client:1025 → Server:21 (Control Connection)

    - Server:20 → Client:1026 (Data Connection)


    Notice that the data connection originates from the server, in the opposite direction
    of the control channel. This breaks classic client-server data flow direction.
    Firewalls will block the active FTP connection for this reason, breaking Active
    FTP. Passive FTP addresses this issue by keeping all communication from client
    to server:


    +   - Client:1025 → Server:21 (Control Connection)

    - Client:1026 → Server:1025 (Data Connection)


    The FTP server tells the client which listening data connection port to connect
    to; the client then makes a second connection. Passive FTP is more likely to pass
    through firewalls cleanly, since it flows in classic client-server direction.


    # TFTP

    TFTP is the Trivial File Transfer Protocol, which runs on UDP port 69. It provides
    a simpler way to transfer files and is often used for saving router configurations
    or “bootstrapping” (downloading an operating system) via a network by diskless
    workstations.


    TFTP has no authentication or directory structure: files are read and written
    to one directory, usually called /ftpboot. There is also no confidentiality or
    integrity. Like Telnet and FTP, TFTP is not recommended for transferring sensitive
    data over an insecure channel.


    # SSH

    SSH was designed as a secure replacement for Telnet, FTP, and the UNIX “R” commands
    (rlogin, rshell, etc.). It provides confidentiality, integrity, and secure authentication,
    among other features. SSH includes SFTP (SSH FTP) and SCP (Secure Copy) for transferring
    files. SSH can also be used to securely tunnel other protocols, such as HTTP.
    SSH servers listen on TCP port 22 by default.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 250 CHAPTER 5 Domain 4: Communication and Network Security


    SSH version 1 was the original version, which has since been found vulnerable
    to man-in-the-middle attacks. SSH version 2 is the current version of the protocol,
    and is recommended over SSHv1, Telnet, FTP, etc.


    # SMTP, POP, and IMAP


    SMTP is the Simple Mail Transfer Protocol, used to transfer email between servers.
    SMTP servers listen on TCP port 25. POPv3 (Post Office Protocol) and IMAP (Internet
    Access Protocol) are used for client-server access, using TCP ports 110 and 143,
    respectively.


    # DNS


    DNS is the Domain Name System, a distributed hierarchical database that translates
    names to IP addresses, and versa. DNS uses both TCP and UDP: small answers use
    UDP port 53; large answers (such as zone transfers) use TCP port 53. Core DNS
    functions are getbyname() and gethostbyaddr(). Given a name (such as www.syngress.com),
    getbyname returns an IP address, such as 192.0.2.187. Given an address such as
    192.0.2.187, gethostbyaddr returns the name, www.syngress.com.


    Authoritative name servers provide the "authoritative" resolution for names within
    a domain. A recursive name server will resolve names that it does not already
    know. A caching server will temporarily cache names previously resolved.


    # DNS Weaknesses


    DNS uses unreliable UDP protocol for most requests, and native DNS provides no
    authentication. The security of DNS relies on a 16-bit source port and 16-bit
    query ID. Attackers are able to blind gust numbers to easily forge UDP DNS responses.


    A cache poisoning attack is an attempt to trick a DNS server into caching a forged
    response. If bank.example.com is at 192.0.2.193, and evil.example.com is at 198.18.8.17,
    an attacker may try to poison a DNS server''s cache by sending the forged response.
    If the caching DNS server accepts the response, it will return the poisoned response
    for subsequent bank.example.com requests (until the record expires).


    # DNSSEC


    DNSSEC (Domain Name Server Security Extensions) provides authentication and integrity
    to DNS responses via the use of public key encryption. It does not provide confidentiality;
    it acts like a digital signature for DNS responses.


    Building an Internet-scale Public Key Infrastructure is a difficult task, and
    DNSSEC has been solely adopted for this security. Researcher Dan Kaminsky publicized
    an improved DNS poisoning attack in 2008, which has led to renewed calls for wider
    adoption of DNSSEC. https://www.kb.cert/org/vuls/id/800113 for more details on
    the improved cache poisoning attack and defenses.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Network Architecture and Design 251


    DoT and DoH

    DNS over TLS (DoT) and DNS over HTTPS (DoH) are two competing standards that transfer
    and encrypt DNS traffic via TLS, DoT uses a dedicated port (TCP port 853), while
    DoH uses HTTPS on TCP port 443. Unlike DNSSEC, both provide confidentiality between
    the client resolver and the DoH server. DoH has won a larger market share, and
    is currently used by default by Firefox in the United States.


    # SNMP


    SNMP is the Simple Network Management Protocol, primarily used to monitor network
    devices. Network monitoring software like MRTG uses SNMP to poll agents on network
    devices, and interface status (up/down), bandwidth utilization, CPU temperature,
    and many more metrics. SNMP agents use UDP port 161.

    MPv1 and v2c use read and write community strings to access network devices. Devices
    use default community strings as "public" for read and "private" for write. Additionally,
    these community strings are usually changed infrequently (if at), and are typically
    seen in the clear across a network. An attacker who can sniff or guess a community
    string can access the network device via SNMP. Access to a write string allows
    changes to a device, including shutting down or reconfiguring interfaces, among
    many other options.

    MPv3 was designed to provide confidentiality, integrity, and authentication to
    SNMP via use of encryption. While SNMPv2c usage remains highly prevalent, use
    of SNMPv3 is strongly encouraged due to the lack of security in all previous versions.


    # HTTP and HTTPS


    HTTP is the Hypertext Protocol, which is used to transfer encrypted Web-based
    data. HTTPS (Hypertext Transfer Protocol Secure) secures encrypted Web-based data
    via SSL/TLS ("SSL and TLS" section below). HTTP uses TCP port 80 and HTTPS uses
    TCP port 443, HTML (Hypertext Markup Language) is used to display content.


    > Note

    HTTP and HTML are often confused. The difference: you transfer Web data via HTTP
    and view it via HTML.


    # BOOTP and DHCP


    BOOTP is the Bootstrap Protocol, for bootstrapping a network by diskless systems.
    Many system BIOSs now support BOOTP directly, allowing the BIOS to load the operating
    system by a network without a disk. BOOTP startup occurs in two phases: BOOTP
    to determine the IP address and OS image name, and then use TFTP to download the
    operating system.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# CHAPTER 5 Domain 4: Communication and Network Security


    DHCP (Dynamic Host Configuration Protocol) was designed to replace and improve
    on BOOTP by adding additional features. DHCP allows more configuration options,
    well as assigning IP address leases to systems. DHCP systems can be configured
    to receive IP address leases, DNS servers, and default gateways.


    Both BOOTP and DHCP use the same ports: UDP port 67 for servers and UDP port 68
    for clients.


    # Transmission Media


    Transmission Media includes the Layer 1 technologies that transfer bits: network
    cabling and wireless technologies. We will discuss cabling and wireless later
    in this chapter. The simplest part of the OSI model is the part you can touch:
    network cables, at Layer 1. It is important to understand the types of cabling
    that are commonly used, and the benefits and drawbacks of each.


    Fundamental network cabling terms to understand EMI, noise, crosstalk, and attenuation.
    Electromagnetic Interference (EMI) is caused by magnetism created by electricity.
    Any unwanted signal (such as EMI) on a network cable is called noise. Crosstalk
    occurs when a signal crosses from one cable to another. Attenuation is the weakening
    of signal as it travels further from the source.


    # Twisted Pair Cabling


    Unshielded Twisted Pair (UTP) network cabling, shown in Fig. 5.12, uses pairs
    of wires twisted together. All electricity creates magnetism; taking two wires
    that send electricity in opposite directions (such as sending and receiving) and


