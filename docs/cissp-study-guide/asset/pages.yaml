    # Ethernet Technologies and Protocols


    Local Area Network concepts focus on layer 1–3 technologies such as network cabling
    types, physical and logical network topologies, Ethernet, and others.


    # Ethernet


    Ethernet is a dominant local area networking technology that transmits network
    data via frames. It originally used a physical bus topology, but later added support
    for physical star. Ethernet describes Layer 1 issues such as frames. Ethernet
    is baseband (one channel), so it must address issues such collisions, where two
    nodes attempt to transmit data simultaneously.


    Ethernet has evolved from 10-megabit buses that used "thinnet" or "thicknet" coaxial
    cable. The star-based physical layer uses Twisted Pair cables that range in'
