- pgno: 51
  md: '# CHAPTER 5 Domain 4: Communication and Network Security


    The latter route is two hops, and the second hop is a slower T1. Any network engineer
    would prefer the single-hop T3 connection from the data center to Office A, instead
    of the two-hop detour via Office B to Office A. And all routing protocols would
    do the same, choosing the one-hop T3.


    Things get trickier when you consider connections between the offices. Should
    traffic route from Office A to B? The shortest hop count is the direct T1. But
    if link only has 1.5 megabits: taking the two-hop route from Office A down to
    the data center and back up to Office B offers 45 megabits, at the expense of
    an extra hop.


    A distance vector routing protocol such as RIP would choose the direct T1 connection
    and consider one hop at 1.5 megabits “faster” than two hops at 45 megabits. Most
    Engineers (and all Link state routing protocols, as described in the next section)
    would disagree.


    Distance vector protocols use metrics such as hop count, and are prone to routing
    loops, which packets loop between routers. The following output is a Linux traceroute
    of a route, starting between hops 16 and 17. The nyc and bos core routers will
    keep forwarding the packets back and forth each other, each achieving the correct
    route.


    ```

    14 pwc-03.inet.example.com (10.11.37.141) 165.484 ms 164.335 ms 175.928 ms

    15 pwc-02.inet.example.com (10.11.23.9) 162.291 ms 172.713 ms 171.532 ms

    16 nyc-01.inet.example.com (10.11.5.101) 296.967 ms 193.454 ms 199.457 ms

    17 bos-01.inet.example.com (10.11.5.103) 212.967 ms 212.383 ms 189.592 ms

    18 nyc-02.inet.example.com (10.11.5.101) 210.201 ms 225.674 ms 208.124 ms

    19 bos-02.inet.example.com (10.11.5.103) 189.089 ms 201.505 ms 201.659 ms

    20 nyc-03.inet.example.com (10.11.5.103) 334.19 ms 320.39 ms 245.182 ms

    21 bos-02.inet.example.com (10.11.5.103) 218.519 ms 210.519 ms 246.635 ms

    ```


    # RIP


    RIP (Routing Information Protocol) is a distance vector routing protocol that
    uses hop count as its metric. RIP will route traffic from Office A to Office B
    in Fig. 5.2 via the direct T1, since it is the “closest” route at 1 hop.


    RIP does not have a full view of the network: it can only “see” directly connected
    routers. Convergence is slow. RIP sends updates every 30 seconds, regardless of
    changes. RIP routers that are on a network that is converged for weeks will send
    updates every 30 seconds, around the clock.


    RIP’s maximum hop count is 15; 16 is considered “infinite.” RIP2 added support
    for CIDR. RIP is used by the UNIX command and is the only routing protocol universally
    supported by UNIX.


    RIP uses split horizon to avoid routing loops. In Fig. 5.22, the circuit between
    the NYC and BOS routers has gone down. That moment, the NYC and BOS routers know
    the route is down; but others do not. The network lacks convergence.'
