    NAT can cause problems with applications and protocols that change IP addresses
    or contain IP addresses in upper layers, such as the data layer of TCP/IP, IPsec,
    VoIP, and active FTP are affected protocols.


    # ARP and RARP


    ARP is the Address Resolution Protocol, used to translate Layer 2 MAC addresses
    and Layer 3 IP addresses. ARP resolves IPs to MAC addresses by asking, "Who has
    IP address 192.168.2.140, tell me." An example of an ARP reply is "192.168.2.140
    is at 00:0c:29:69:16".


    arp who has 192.168.2.140 tell 192.168.2.4

    arp reply 192.168.2.140 is-at 00:0c:29:69:16


    > Note

    Protocols such as ARP are trusty; attackers may use this to their advantage in
    hijacking traffic by spoofing ARP requests. Any local system could cause the ARP
    request, including an attacker. This can lead to ARP cache poisoning attacks,
    which victim systems cause ARP entries point to malicious systems. ARP cache poisoning
    is often used in Man-in-the-Middle (MitM) attacks, where an attacker frequently
    poses the ARP entry for a critical system (such as the default gateway), redirecting
    traffic to the attacker''s system.

    Secure networks should hard-coding ARP entries for this reason.


    RARP was used by legacy diskless workstations to determine their IP addresses.

    A node says "Who has MAC address at 00:40:96:29:06:51, tell 00:40:96:29:06:51."


    ARP, Reverse Request is 00:40:96:29:06:51 tell 00:40:96:29:06:51


    In words, RARP asks: "Who am I? Tell me." A RARP server answers with the node''s
    IP address.'
