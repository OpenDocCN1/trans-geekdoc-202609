- pgno: 58
  md: '# Secure Communications 283


    L2TP (Layer 2 Tunneling Protocol) combines PPTP and L2F (Layer 2 Forwarding, designed
    to tunnel PPP). L2TP focuses on authentication and does not provide confidentiality:
    it is frequently used with IPsec to provide encryption. Unlike PPTP, L2TP can
    also be used on non-IP networks, as ATM.


    # IPsec


    IPv4 has no built-in confidentiality; higher-layer protocols as TLS are used to
    provide security. To address this lack of security at Layer 3, IPsec (Internet
    Protocol Security) was designed to provide confidentiality, integrity, and authentication
    via encryption for IPv6. IPsec has been ported to IPv4. IPsec is a suite of protocols;
    the major are Encapsulating Security Protocol (ESP) and Authentication Header
    (AH). Each has an IP protocol number: ESP is protocol 50; AH is protocol 51.


    # Note


    This chapter describes the network aspects of IPsec, SSL, and TLS: see Chapter
    4, Domain 3: Security Architecture and Engineering, for the cryptographic aspects
    of these protocols.


    # IPsec Architectures


    IPsec has three architectures: host-to-gateway, gateway-to-gateway, and host-to-host.
    Host-to-gateway mode (also called client mode) is used to connect one system that
    runs IPsec client software to an IPsec gateway. Gateway-to-gateway (also called
    point-to-point) connects two IPsec gateways, which form an IPsec connection that
    acts as a shared routable network connection, like a T1. Finally, host-to-host
    mode connects two systems (such as file servers) to each other via IPsec. Many
    modern operating systems, such as Windows 10 or Ubuntu Linux, can run IPsec natively,
    allowing them to form host-to-gateway or host-to-connections.


    # Tunnel and Transport Mode


    IPsec can be used in tunnel mode or transport mode. Tunnel mode provides confidentiality
    (ESP) and/or authentication (AH) to the entire packet, including the original
    IP headers. New IP headers are added (with the source and destination addresses
    of the IPsec gateways). Transport mode protects the IP data (layers 4–7), leaving
    only the original IP headers unprotected. Both modes add extra IP headers (an
    AH header or an ESP header). Fig. 5.24 shows the differences between tunnel and
    transport modes.


    | Original Packet | IP Header | Data |

    |---|---|---||

    | Transport Mode | IP Header | IPsec Header (s) | Protected Data |

    | Tunnel Mode | New IP Header | IPsec Header (s) | Protected IP Header Data |


    FIG. 5.24

    IPsec tunnel and transport modes.'
