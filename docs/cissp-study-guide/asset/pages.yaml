- pgno: 31
  md: '# LAN Physical Network Topologies


    Physical Network Topologies describe Layer 1 locally: how the cables are physically
    run. There have been many popular physical topologies over the years; many, many,
    such as the bus and ring, have faded as the star topology has become dominant.


    # Legacy LAN Topologies


    A physical bus connected network nodes in a string. Each node inspected the data
    as it passed along the bus. Ethernet Thinnet and Thicket were bus technologies.
    A physical ring connected network nodes in a ring: if you followed the cable from
    node to node, you would finish where you began. FDDI (Fiber Distributed Data Interface)
    was a LAN ring technology. All are considered legacy LAN technologies that have
    been overtaken by star.


    # Star


    Star topology has become the dominant physical topology for LANs. The star was
    adopted by Ethernet (which originally supported bus only). Each node is connected
    directly to a central device such as a hub or a switch, as shown in Fig. 5.14.


    ![](img/0bbd5f5bd171414c5e2c49247aab35d6_31_0.png)


    FIG. 5.14


    Star topology.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Network Architecture and Design 257


    Stars feature fault tolerance: any single local cable cut or NIC failure affects
    one node. Since each node is wired back to a central point, more cable is required
    as opposed to bus (where one cable run connects to each other). This cost disadvantage
    is usually outweighed by the fault tolerance advantages.


    # Mesh


    A mesh interconnects network nodes to each other. Fig. 5.15 shows two mesh networks.
    The left mesh is fully connected, with four servers interconnected. The right
    mesh is partially connected: each node has multiple connections to the mesh, but
    every node does not connect to every other.


    Meshes have superior availability and are often used for highly available (HA)
    server clusters. Each of the four Web servers shown on the left in Fig.5.15 can
    share the load of Web traffic and maintain state information between each other.
    If any Web server in the mesh goes down, the others remain up to shoulder the
    traffic load.


    # WAN Technologies and Protocols


    ISPs and other “long-haul” network providers, whose networks span from cities
    to countries, often use Wide Area Network technologies. Many of us have hands-on
    experience configuring LAN technologies such as connecting Cat5 network cabling;
    it is less common to have hands-on experience building WANs.


    # T1s, T3s, E1s, E3s


    There are several international circuit standards: the most prevalent are T Carriers
    (United States) and E Carriers (Europe). A T1 is a dedicated 1,544-megabit circuit
    that carries twenty-four 64-bit DS0 (Digital Signal 0) channels (as 24 circuitswitched
    phone calls). Note the terms DS1 (Digital Signal 1) and T1 are often used interchangeably.
    DS1 describes the flow of bits (via any medium, such as copper, fiber, and wireless);
    a T1 is a telephone circuit that carries a DS1.


    A T3 is 28 bundled T1s, forming a 44.736-megabit circuit. The terms T3 and DS3
    (Digital Signal 3) are also used interchangeably, with the same T1/DS1 distinction


