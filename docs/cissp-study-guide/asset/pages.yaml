  md: '# CHAPTER 5 Domain 4: Communication and Network Security


    +   - With traditional Layer 2 networks you are constrained by Layer 2 boundaries
    and forced to create large or geographically stretched Layer 2 domains, VXLAN’s
    functionality allows you to dynamically allocate resources within between data
    centers and enables migration of virtual machines between servers that exist in
    separate Layer 2 domains by tunneling the traffic over Layer 3 networks [12].


    # Wireless Local Area Networks


    Wireless Local Area Networks (WLANs) transmit information via electromagnetic
    waves (such as radio) or light. Historically, wireless data networks have been
    very insecure, often relying on the (perceived) difficulty in attacking the confidentiality
    or integrity of the traffic. This perception is usually misplaced. The most common
    form of wireless data networking is the 802.11 wireless standard, and the first
    802.11 stan-


    # DoS and Availability


    WLANs have no way to ensure availability. An attacker with physical proximity
    can have a variety of Denial-of-Service attacks, including polluting the wireless
    spectrum with noise. If you think of the CIA triad as a three-legged stool, “wireless
    security” is missing a leg. Critical applications that require a reliable network
    should use wired connections.


    # Unlicensed Bands


    A “band” is a small amount of contiguous radio spectrum. Industrial, Scientific,
    and Medical (ISM) bands are set aside for unlicensed use, meaning you do not need
    to acquire a license from an organization such as the Federal Communications Com-
    mission (FCC) to use them. Many wireless devices such as cordless phones, 802.11
    wireless, and Bluetooth use ISM bands. Different countries use different ISM bands:
    two popular ISM bands used internationally are 2.4 and 5 GHz.


    # FHSS, DSSS, and OFDM


    Frequency Hopping Spread Spectrum (FHSS) and Direct Sequence Spread Spectrum (DSSS)
    are two methods for sending traffic via a radio band. Some bands, like the 2.4-GHz
    ISM band, can be quite polluted with interference: Bluetooth, cordless phones,
    some 802.11 wireless, baby monitors, and even microwaves can broadcast or interfere
    with this band. Both DSSS and FHSS are designed to maximize throughput while minimizing
    the effects of interference.


    DSSS uses the entire band at once, “spreading” the signal throughout the band.
    FHSS uses a number of small frequency channels throughout the band and “hops”
    through them in pseudandom order.


    Orthogonal Frequency-Division Multiplexing (OFDM) is a multiplexing method, allowing
    simultaneous transmission using multiple independent wireless frequencies that
    do not interfere with each other.'
