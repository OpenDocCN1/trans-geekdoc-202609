  md: '# Network Architecture and Design 233


    # MAC Addresses


    A Media Access Control (MAC) address is the unique hardware address of an Ethernet
    network interface card (NIC), typically “burned in” at the factory. MAC addresses
    may be changed in software.


    > Note Burn-in MAC addresses should be unique. There are real-world exceptions
    to this, often due to mistakes by NIC manufacturers, but MAC addresses are considered
    unique on the exam.


    Historically, MAC addresses are 48 bits long. They have two halves: the first
    24 bits form the Organizationally Unique Identifier (OUI) and the last 24 bits
    form a serial number (formerly called an extension identifier).


    Organizations that manufacture NICs, such as Cisco, Juniper, HP, IBM, and many
    others, produce 24-bit OUIs from the Institute of Electrical and Electronics Engineers
    (IEEE), Incorporated Registration Authority. A list of registered OUIs is available
    at https://www.ieee.org/products-programs/regauth/.


    Juniper owns 00-05-85, for example. Any NIC with a MAC address begins with 00:05:85
    is a Juniper NIC. Juniper can then assign MAC addresses based on their OUI: the
    first would have MAC address 00:05:85:00:00:00, the second 00:05:85:00:00:02.
    This process continues until the serial numbers for that OUI have been exhausted.
    A new OUI is needed.


    # EUI-64 MAC Addresses


    The IEEE created the EUI-64 (Extended Unique Identifier) standard for 64-bit MAC
    addresses. The OUI is still 24 bits, but the serial number is 40 bits for far
    more MAC addresses, compared with 48-bit addresses. IPv6 autoconfiguration is
    compatible with types of MAC addresses.


    # IPv4


    IPv4 is Internet Protocol version, 4, commonly called “IP.” It is the fundamental
    protocol of the Internet, designed in the 1970s to support packet-switching networking
    for the United States Defense Research Projects Agency (DARPA). IPv4 was used
    for the ARPANET, which later became the Internet.


    IP is a simple protocol, designed to carry data across networks. It is so simple
    that it requires a “helper protocol” called ICMP (see below). IP is connectionless
    and unreliable; it provides “best effort” delivery of packets. If connections
    and reliability are required, they must be provided by a higher-level protocol
    by IP, such as TCP.


    IPv4 uses 32-bit source and destination addresses, usually shown in “dotted quad”
    format, such as “192.168.2.4.” A 32-bit address field allows $2^{32}$, or nearly
    4.3 billion, addresses. A lack of IPv4 addresses in a world where humans (and
    their'
