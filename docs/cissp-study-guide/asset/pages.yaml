    # Secure Network Devices and Protocols


    Let us look at network devices ranging from Layer 1 through Application-Layer
    Proxy firewalls that operate up to Layer 7. Many of these network devices, such
    as routers, have protocols dedicated to their, such as routing protocols.


    # Repeaters and Hubs


    Repeaters and hubs are Layer 1 devices. A repeater receives bits on one port,
    and “repeats” them out the other port. The repeater has no understanding of protocols;
    it simply repeats bits. Repeaters are often used to extend the length of a network.


    A hub is a device with more than two ports. It receives bits on one port and repeats
    them across all ports.

    Hubs were quite common before switches became common and inexpensive.

    Hubs provide no traffic isolation or integrity; all nodes send all traffic by
    the hub. Hub means an attacker connected to a hub may read and potentially alter
    traffic via the hub.

    Hubs are also half-duplex devices; they cannot send and receive simultaneously.
    Any device connected to a hub will negotiate to half-duplex mode, which can cause
    network congestion. Hubs also have “collision domain”: any node may send traffic
    with another (for more information on collisions, see “CSMA section). The lack
    of security, half-duplex mode, and large collision domain hubs are unsuitable
    for most modern purposes.


    # Bridges


    Bridges and switches are Layer 2 devices. A bridge has two ports and connects
    work segments together. Each segment typically has multiple nodes, and the bridge
    learns the MAC addresses of nodes on either side. Traffic between two nodes on
    the same side of the bridge will not be forwarded across the bridge. Traffic sent
    from a node on one side of the bridge to the other side will forward across. The
    bridge provides traffic isolation and makes forwarding decisions by learning the
    MAC addresses of connected nodes.


    In Fig. 5.18, traffic sent from Computer 1 to Computer 2 will not be forward across
    the bridge. Traffic sent from Computer 1 to Computer 3 will be forwarded across
    the bridge.


    A bridge has two collision domains. A network protocol analyzer (informally called
    a “sniffer”) on the right side of the network shown in Fig. 5.18 can sniff traffic'
