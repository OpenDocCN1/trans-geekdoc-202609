    # Micro-segmentation


    Micro-segmentation describes the process of filtering in all systems, whether
    physical or cloud-based:“Micro-segmentation is a method of creating zones in data
    centers and cloud environments to isolate workloads from one another and secure
    them individually. With microsegmentation, system administrators can create policies
    that limit network traffic between workloads on a Zero Trust approach. Organizations
    use micro-segmentation to reduce the network attack surface, improve breach containment
    and strengthen regulatory compliance” (https://www.paltonetworks.com/cyberperedia/what-is-microsegmentation).


    Microsegmentation is a core Zero Trust (previously discussed in Chapter 4, Domain
    3: Security Architecture and Engineering) concept, and uses technologies such
    as Software-Defined Networking (SDN), Software-Defined Wide Area Network (SD-WAN),
    and Virtual Extensible Local Area Network (VXLAN), discussed network.


    # Software-Defined Networks


    Through virtualization and cloud services, storage and compute are increasingly
    decoupled from the traditional server and disk-dense datacenter. Software-Defined
    Networking (SDN) seeks a similar paradigm shift in organizations’ approach to
    networking. A helpful oversimplification can be to think of SDN as an approach
    to virtualize networking and decouple networking from the hardware typically employed
    for this purpose.


    Software-Defined Networking (SDN) separates a router’s control plane from the
    data (forwarding) plane. The control plane makes routing decisions. The data plane
    forwards data (packets) through the router. With SDN routing decisions are made
    remotely, instead of on each individual router.'
