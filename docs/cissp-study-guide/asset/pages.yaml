    ### Table 5.2 The OSI Model vs. TCP/IP Model.


    | OSI Model | TCP/IP Model |

    |---|-|

    | 7 Application | Application |

    | 6 Presentation | |

    | 5 Session | Host-to-Host Transport |

    | 4 Transport | |

    | 3 Network | Internet |

    | 2 Data Link | Network |

    | 1 Physical | Access |


    is the Internet Protocol Suite. The TCP/IP model is simpler than the OSI model,
    as shown in Table 5.2.

    While TCP and IP receive top billing, TCP/IP is actually a set of protocols including
    UDP (User Datagram Protocol) and ICMP (Internet Control Message Protocol), among
    many others.


    > Note

    The names of the TCP/IP layers are a subject of much debate, with “authoritative”
    sources disagreeing with each other. Confusingly, some use Link Layer in place
    of Network Access Layer, and Network layer in place of Internet Layer. This book
    follows the conventions described in TCP/IP references listed in the exam''s Candidate
    Information Bulletin, such as Cisco/IP Routing Professional Reference (McGraw-Hill)
    by Chris Lewis.


    # ### Network Access Layer


    The Network Access Layer of the TCP/IP model combines Layers 1 (Physical) and
    2 (Data Link) of the OSI model. It describes Layer 1 issues such as energy, bits,
    and the medium used to carry them (copper, fiber, wireless, etc.). It also describes
    Layer 2 issues as converting bits into protocol units such as Ethernet frames,
    MAC (Media Access Control) addresses, and Network Interface Cards (NICs).


    # ### Internet Layer


    The Internet Layer of the TCP/IP model aligns with the Layer 3 (Network) of the
    OSI model. This is where IP addresses and routing live. When data is transmitted
    from a node on one LAN to a node on a different LAN, the Internet Layer is used:
    IPv4, IPv6, ICMP, and routing protocols (among others) are Internet Layer TCP/IP,
    protocols.


    # ### Exam Warning


    Layer 3 of the OSI model is called “Network.” Do not confuse OSI’s Layer 3 with
    the “Network Access” TCP/IP layer, which aligns with Layers 1 and 2 of the OSI
    model.'
