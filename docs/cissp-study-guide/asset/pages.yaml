- pgno: 52
  md: '# Secure Network Devices and Protocols 277


    ![](img/0bbd5f5bd171414c5e2c49247aab35d6_52_0.png)


    **FIG. 5.22**

    Sample network with down circuit.


    NYC calls the PWM router “The route between NYC and BOS is down.” On PWM’s other
    interface, the ATL router may claim that the link is up. Split horizon means the
    PWM router will not “argue back”: it will not send a route update via interface
    it learned the route. In our case, the PWM router will not send a NYC → BOS routing
    update to the NYC router. *Poison reverse* is an addition to Split Horizon: instead
    of sending nothing to NYC regarding the NYC → BOS route, with a cost of 16 (infinite).
    NYC will ignore any “infinite” route.


    RIP loses a down timer to avoid “flapping” (repeatedly changing a route’s status
    from “down” to up). Once RIP changes a route’s status to “down,” RIP will “hold”
    to that decision for 180 seconds. In Fig. 5.22, the PWM router will keep the NYC
    → BOS route “down” for 180 seconds. The hope is that the network will have reached
    convergence during that time. If not, after 180 seconds, RIP may change its status.


    RIP is quite limited. Each router has a partial view of the network and updates
    every 30 seconds, regardless of change. Convergence is slow. Hold-down timers,
    Split Horizon, and Poison Reverse are small fixes that do not compensate for RIP’s
    weaknesses. Link State routing protocols such as OSPF are superior.


    # Link State Routing Protocols


    Link state routing factors factor in additional metrics for determining the best
    route, including bandwidth. A link state protocol would see multiple routes from
    Office A to Office B in Fig. 5.21, including the direct T1 link, and the two-hop
    T3 route via the data center. The additional bandwidth (45 via 1.5 megabits) would
    make the two-hop T3 route the winner.'
