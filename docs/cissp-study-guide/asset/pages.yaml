    Twisted pairs are classified by categories according to rated speed. Tighter results
    in more dampening: A Category 6 UTP cable designed for gigabit networking has
    farther twisting than a Category 3 Ethernet cable. Shielded Twisted Pair (STP)
    carries additional metallic shielding around each pair of wires. This makes STP
    cables less susceptible to EMI, but more rigid and more expensive. Table 5.6 summarizes
    the types and speeds of Category cabling.


    Note that Cat 3, Cat 4, and Cat 5 are legacy standards (Cat 1 and Cat 2 were never
    formally standardized). Both Cat 5e and Cat 6 operate at 1000 Mbps (aka 1 Gbps)
    at lengths up to 100 meters, but Cat 6 can operate at 10 Gbps at lengths up to
    55 meters. Cat 6a can operate at 10 Gbps at lengths up to 100 meters, Cat 7 operates
    at 10 Gbps at lengths up to 100 meters, but can operate at 100 Gbps at up to 15
    meters.


    # Coaxial Cabling


    A coaxial network, shown in Fig. 5.13, has an inner core (marked “D”) separated
    by an insulator (marked “C”) from a metallic braid or shield (marked “B”). The
    outer layer is a plastic shield (marked “A”). The insulator prevents the core
    from touching the metallic shield, which would create an electrical shock. Coaxial
    cables are often used for satellite and cable TV service.


    The core and shield used by coaxial cable are thicker and better insulated than
    other types, such as twisted pair. This makes coaxial more resistant to EMI and
    allows higher bandwidth and longer connections compared with twisted pair cable.


    Two types of coaxial cable are Thinnet and Thickened, for Ethernet bus networking.


    # Fiber Optic Network Cable


    Fiber Optic network cable (simply called “fiber”) uses light to carry information,
    which can carry a tremendous amount of information. Fiber can be used to transmit
    via long distances: past 50 miles, further than any copper cable such as twisted
    pair or coaxial. Fiber’s advantages are speed, distance, and immunity to EMI.
    Disadvantages include cost and complexity.'
