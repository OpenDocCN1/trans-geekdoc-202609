    Convergence means that all routers on a network agree on the state of routing.
    A network that has no recent outages is “converged”: all routers see routes as
    available. Then a circuit goes down. The routers closest to the outage know right
    away; routers that are further away will know. The network lacks convergence:
    some believe all circuits are up, while others know one is down. A goal of routing
    protocols is to make convergence as fast as possible.

    Routing protocols come in two basic varieties: Interior Gateway Protocols (IGPs),
    like RIP and OSPF, and Exterior Gateway Protocols (EGPs), like BGP. Private networks
    use Intranets and EGPs are used on public networks like the Internet. Routing
    protocols support Layer 3 (Network) of the OSI model.


    # Distance Vector Routing Protocols


    Metrics are used to determine the “best” route across a network. The simplest
    metric is hop count. In Fig. 5.21, the hop count from the data center to each
    office via T3 is 1. Additional paths are available from the data center to each
    office, such as the T3 to Office B, followed by the T1 to Office A.'
