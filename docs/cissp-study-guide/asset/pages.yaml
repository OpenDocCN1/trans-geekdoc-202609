    # Application Layer TCP/IP Protocols and Concepts


    A multitude of protocols exist at TCP/IP''s Application Layer, which combines
    the Session, Presentation, and Application Layers of the OSI model.


    # Telnet


    Telnet provides terminal emulation over a network. "Terminal" means text-based
    VT100-style terminal access. Telnet servers listen on TCP port 23. Telnet was
    the standard way to access an interactive command shell over a network for 20
    years.


    Telnet is weak because it lacks confidentiality; all data transmitted during a
    session is plaintext, including the username and password used to authenticate
    to the system. Attackers can sniff network traffic to steal authentication credentials
    in this way.


    Telnet also has limited integrity: attackers with access to a network can alter
    data, or seize control of Telnet sessions. Secure Shell (SSH) provides secure
    authentication, confidentiality, and integrity and is a recommended replacement
    for Telnet.


    # FTP


    FTP is the File Transfer Protocol, used to transfer files to and from servers.
    Like Telnet, FTP has no confidentiality or integrity and should not be used to
    transfer sensitive data over insecure channels.'
