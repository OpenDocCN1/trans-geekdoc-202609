  md: '# 284 CHAPTER 5 Domain 4: Communication and Network Security


    # SSL and TLS


    Secure Sockets Layer (SSL) was designed to protect HTTP (Hypertext Transfer Protocol)
    data: HTTPS uses TCP port 443. TLS (Transport Layer Security) 1.0 was equivalent
    to SSL version 3.1. The current version of TLS is 1.3, described in RFC 8446 (https://datatracker.ietf.org/doc/html/rfc8446).


    Though initially Web-focused, SSL or TLS may be used to encrypt many types of
    data and can be used to tunnel other IP protocols to form VPN connections. VPNs
    can be simpler than IPsec equals: IPsec makes fundamental changes to IP networking,
    so installation of IPsec software changes the operating system (which requires
    super-user privileges). SSL client software does not require the operating system.
    Also, Ipsec is difficult to firewall; SSL is simpler.


    # Remote Access


    In an age of telecommuting and the mobile workforce, secure remote access is a
    critical control. This includes connecting mobile users via methods such as DSL
    or Cable Modem, security mechanisms such as callback, and newer concerns such
    as instant messaging and remote meeting technology.


    # ISDN


    Integrated Services Digital Network (ISDN) was an earlier attempt to provide digital
    service via "copper pair," the POTS (Plain Old Telephone Service) prevalent in
    homes and small offices around the world. This is called the "last mile," providing
    high-speed digital service via the (historically copper pair) last mile has been
    a longstanding challenge.


    ISDN devices are called terminals. ISDN Basic Rate Interface (BRI) service provides
    two 64K digital channels (a 16K signaling channel) a PRI (Primary Rate Interface)
    provides twenty-three 64K channels, plus one 16K signaling channel.


    ISDN never found widespread use; it was eclipsed by DSL and cable modems. ISDN
    is commonly used for teleferencing and videoconferencing.


    # DSL


    Digital Subscriber Line (DSL) has a "last mile" solution to ISDN: using copper
    pairs to provide digital service to homes and small offices. DSL has found widespread
    use due to higher speeds compared with ISDN, reaching speeds of 10megabits and
    more.


    Common types of DSL are Symmetric Subscriber Line (DSL, with matching upload and
    download speeds), Asymmetric Digital Subscriber Line (ADSL, featuring faster download
    speeds than upload), and Very High Rate Digital Subscriber Line (VDSL, featuring
    faster asymmetric speeds). Another option is HDSL (High-data-rate DSL), which
    matches DSL speeds using two pairs of copper; DSL is used to provide inexpensive
    T1 service.'
