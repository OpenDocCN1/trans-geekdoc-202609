  md: '# 274 CHAPTER 5 Domain 4: Communication and Network Security


    # Routers


    Routers are Layer 3 devices that route traffic from one LAN to another. IP-based
    routers make decisions based on the source and destination IP addresses.


    > Note

    in the real world, chassis, such as a Cisco 6500, can be many devices at once:
    a router, a switch, a firewall, a NIDS. The exam is likely to give more-clear
    examples: a firewall, a dedicated switch, or if the exam references a multifunction
    device, that will be made clear.

    Regardless, it is helpful to know how to think of these devices as distinct concepts.


    # Static and Default Routes


    For simple routing needs, static routes may suffice. Static routes are fixed routing
    entries, saying “The route for network 10.0.0.0/8 routes via router 192.168.2.7;
    the route for network 172.168.0.0/12 routes via router 192.168.2.8,” most SOHO
    (Small/Home/Office Network) routers have a “default route” that sends all external
    traffic to (typically controlled by the ISP).\ Here is an example of a typical
    home LAN configuration:


    +   - Internal network: 192.168.1.0/24

    - Internal Firewall IP: 192.168.1.1

    - External Network: 192.0.2.0/30

    - External Firewall IP: 192.0.2.2

    - Next hop address: 192.0.2.1


    The firewall has an internal and external interface, with IP addresses of 192.168.1.1
    and 192.0.2.2, respectively. Internal (trusted) hosts receive address addresses
    on the 192.168.1.0/24 subnet via DHCP. External traffic is NAT-translated to the
    external firewall IP of 192.0.2.2. The default route for internal hosts is 192.168.1.1.
    The default route is 192.0.2.1. This is a router owned and controlled by the ISP.


    # Routing Protocols


    Static routes work for simple networks with limited or no redundancy, like SOHO
    networks have more complicated routing needs.


    The network in Fig. 5.21 has redundant paths between all four sites. Should any
    single circuit or site go down, at least one alternate path is available. The
    fastest circuits are 45-megabit T3 that connect Office A to B, and B to C. Additional
    1.5-megabit T1s connect the data center to each office.


    Should the left-most T3 go down, between the data center and Office A, there are
    multiple paths available from the data center to Office A: the fastest is the
    T3 to Office B, and then the T1 to Office A.


    You could use static routes for this network, preferring the faster T3s over the
    slower T1s. The problem: what happens if a T3 goes down? Network engineers like'
