- pgno: 7
  md: '# Host-to-Host Transport Layer


    The Host-to-Host Transport Layer (sometimes called either “Host-to-Host” or, more
    commonly, “Transport” alone; this book will use “Transport”) connects the Internet
    to the Application Layer. It is where applications are addressed on a network,
    via ports. TCP and UDP are the two Transport Layer protocols of TCP/IP.


    # Application Layer


    The TCP/IP Application Layer combines Layers 5 through 7 (Session, Presentation,
    and Application) of the OSI model. Most of these protocols use a client-server
    architecture, where a client (such as ssh) connects to a listening server (called
    a daemon on UNIX systems) as ssh. The clients and servers use either TCP or UDP
    (and sometimes both) as a Transport Layer protocol. TCP/IP Application Layer protocols
    include SSH, Telnet, and FTP, among many others.


    # Encapsulation


    Encapsulation takes information from a higher layer and adds a header to it, treating
    the higher layer information as data. It is often said, “One layer header is another
    layer data” [2]. For example, as the data moves down the stack, application layer
    data is encapsulated in a Layer 4 TCP segment. That TCP segment is encapsulated
    in a Layer 3 IP packet. That IP packet is encapsulated in a Layer 2 Ethernet frame.
    The frame is converted into bits and sent across the local network. Data, segments,
    packets, frames, and bits are examples of Protocol Data Units (PDUs).


    > SPF1 is helpful for remembering PDUs: Segments, Packets, Frames, and Ones


    The reverse of encapsulation is called de-multiplexing (sometimes de-encapsulation).
    As the PDUs move up the stack, frames are converted to Ethernet frames, frames
    are converted to IP packets, packets are converted to TCP segments, and segments
    are converted to application data.


    # Network Access, Internet, and Transport Layer Protocols and Concepts


    TCP/IP is a protocol suite, including (but not limited to): IPv4 and IPv6 at the
    Internet layer; TCP and UDP at the Transport layer; a multitude of higher-level
    protocols, including Telnet, FTP, SSH, and many others. Let us focus on the lower
    layer protocols, spanning from the Network Access to Transport layers. Some protocols,
    such as IP, fit neatly into one layer (Internet). Others, as Address Resolution
    Protocol (ARP), help one layer to another (Network Access to Internet in ARP’s
    case).'
  merge: -1
  img_proc: true
