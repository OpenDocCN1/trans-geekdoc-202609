  md: '# # Domain 4: Communication and Network Security


    # 5


    # ## Exam objectives in this chapter:


    +   - Network Architecture and Design

    - Secure Network Devices and Protocols

    - Secure Communications


    # ## Unique Terms and Definitions


    +   - The OSI model—a network model with seven layers: physical, data link, network,
    transport, session, presentation, and application

    - The TCP/IP model—a simpler network model with four layers: network access, Internet,
    transport, and application

    - Packet-switched network—a form of networking where bandwidth is shared and data
    is carried in units packets

    - Switch—a layer 2 device that carries traffic on one LAN, based on MAC addresses

    - Router—a layer 3 device that routes traffic from one LAN to another, based on
    IP addresses

    - Carrier Sense Multiple Access (CSMA)—a method used by Ethernet networks to allow
    shared usage of a baseband (one-channel) network and avoid collisions (multiple
    interfering signals)


    # ## Introduction


    Communication and Network Security is fundamental to our modern life. The Internet,
    the World Wide Web, online banking, instant messaging email, and many other technologies
    rely on network security: our modern world cannot exist without it. Communications
    and Network Security focuses on the confidentiality, integrity, and availability
    of data in motion.


    Communications and Network Security is one of the largest in the Common Body of
    Knowledge and contains more concepts than any other domain. This domain is also
    one of the most technically deep domains, requiring technical edge down to packets,
    segments, frames, and their headers. Understanding this domain is critical to
    ensure success on the exam.


    225'
