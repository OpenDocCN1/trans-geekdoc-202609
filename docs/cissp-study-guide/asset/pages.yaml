  md: '# Network Architecture and Design 227


    # LANs, WANs, MANs, GANs, and PANs


    LAN is a Local Area Network. A LAN is a comparatively small network, typically
    confined to a building or an area one. A MAN is a Metropolitan Area Network, which
    is typically confined to a city, a zip code, a campus, or office park. A WAN is
    a Wide Area Network, typically covering cities, states, or countries. A GAN is
    a Global Area Network, a global collection of WANs.


    The Global Information Grid (GIG) is the US Department of Defense (DoD) global
    network, one of the largest, the smallest of these private networks in the world.


    At the other end of the spectrum, the smallest of these networks are PANs: Personal
    Area Networks, with a range of 100 meters or less. Low-power wireless technologies
    such as Bluetooth use PANs.


    # Exam Warning


    The exam is simpler and more clear-cut than the real world. There are realworld
    exceptions to statements like “A LAN is typically confined to a building or area
    within one.” The exam will be more clear-cut, as this will. If you read examples
    given in this book, and “that’s usually true, but a bit simplistic,” then you
    are correct. Simplicity is by design, to help you pass the exam.


    # Internet, Intranet, and Extranet


    The Internet is a global collection of peered networks running TCP/IP, providing
    best effort service. An Intranet is a privately owned network running TCP/IP,
    such as a company network. An Extranet is a connection between private Intranets,
    such as connections to business partners Internet.


    # Circuit-Switched and Packet-Switched Networks


    The original voice networks were circuit-switched: a dedicated circuit or channel
    (portion of a circuit) was dedicated to two nodes. Circuit-switched networks can
    provide dedicated bandwidth to point-to-point connections, such as a T1 connecting
    offices.


    One drawback of circuit-switched networks: once a channel or circuit is connected,
    it is dedicated to purpose, even when no data is transferred. Packet-switched
    networks were designed to address this issue, as well as handle network failures
    more robustly.


    The original research on packet-switched networks was conducted in the early 1960s
    on behalf of Defense Advanced Research Projects Agency (DARPA). That research
