    IPv4 Header Fields

    An header in Fig. 5.1, is 20 bytes (with options), and contains a number of fields.
    Key fields are:


    +   * Version: IP version (4 for IPv4)

    * IHL: Length of the IP header

    * Type of Service: originally used to set the precedence of the packet, but now
    used for Differentiated Services (DiffServ), a method for providing Quality of
    Service (QoS)

    * Identification, Flags, Offset: used for IP fragmentation

    * Time To Live: to rooting loops

    * Protocol: embedded protocol (protocol number representing TCP, UDP, etc.)

    * Source and Destination IP addresses

    * Optional: Options and padding


    IP Fragmentation

    If a packet exceeds the Maximum Transmission Unit (MTU) of a network, a router
    along the path it may fragment. Fragmentation breaks a large packet into multiple
    smaller packets. A typical MTU size for an IP packet is 1500 bytes. The IP identification
    field (IPID) is used to reassociate fragmented packets (they will have the same
    IPID). The flags are used to determine if fragmentation is allowed, and whether
    more fragments are coming. The fragment offset gives the data offset the current
    fragment carries: "Copy this data beginning at offset 1480."'
