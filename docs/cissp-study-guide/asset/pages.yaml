  md: 'Ad hoc mode is a peer-to-peer mode with no central access point. A computer
    connected to the Internet via a wired NIC may advertise an ad hoc WLAN to allow
    Internet sharing.


    Finally, monitor mode is a read-only mode for sniffing WLANs.


    # SSID and MAC Address Filtering


    802.11 WLANs use a Service Set Identifier (SSID), which acts as a network name.
    Wireless clients know the SSID before joining WLAN, so the SSID is a configuration
    parameter. SSIDs are normally broadcasted; some WLANs are configured to disable
    SSID broadcasts, as a security feature. Relying on the secrecy of the SSID is
    a poor security strategy: a wireless sniffer in monitor mode can detect the SSID
    used by clients as they join WLANs; this is true if SSID broadcasts are disabled.


    Another common 802.11 wireless security precaution is restricting client access
    by filtering the MAC address, allowing only trusted clients. This provides limited
    security. MAC addresses are exposed in plaintext on 802.11 WLANs; trusted MACs
    can be sniffed, and an attacker may reconfigure a non-trusted device with a trusted
    MAC address in software. Then the attacker can wait for the trusted device to
    leave (or launch a DoS against the device) and join the network with a trusted
    MAC address.


    # WEP


    WEP is the Wired Equivalent Privacy protocol, an early attempt (first ratified
    in 1999) to protect 802.11 wireless security. WEP has proven to be critically
    weak: new attacks can break any WEP key in minutes. WEP effectively provides little
    integrity or confidentiality protection. WEP is considered broken, and it is strongly
    discouraged. The encryption algorithms used in 802.11 and/or other encryption
    methods such as VPN should be used in place of WEP.


    WEP was designed at the time when export of encryption was more regulated than
    it is today and was designed specifically to avoid conflicts with existing laws
    at time. In other words, WEP was designed to be "not strong." cryptographically,
    and it turned out to be even weaker than anticipated. WEP has 40- and 104-bit
    key lengths and uses the RC4 cipher. WEP frames have no timestamp and no replay
    protection: attackers can inject traffic by replaying sniffed WEP frames.


    # 802.11i


    802.11i is the first 802.11 wireless security standard that provides reasonable
    security. 802.11i describes a Robust Security Network (RSN), which allows pluggable
    authentication modules. RSN allows changes to cryptographic ciphers as new vulnerabilities
    are discovered.


    RSN is commonly referred to as WPA2 (Wi-Fi Protected Access 2), a full implementation
    of 802.11i. By default, WPA2 uses AES encryption to provide'
