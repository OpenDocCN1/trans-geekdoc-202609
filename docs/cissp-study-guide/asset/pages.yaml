- pgno: 10
  md: '# Network Architecture and Design 235


    Path MTU uses fragmentation to discover the largest size packet allowed across
    a network. A large packet is sent with the DF (not fragment) flag set. A router
    with a smaller MTU than the packet size will seek to fragment, that it cannot,
    and drop it, sending a "Fragmentation needed" ICMP message. The sending node increases
    smaller packets with the DF flag set, they pass cleanly across the network.


    # IPv6


    IPv6 is the successor to IPv4, featuring larger address space (128-bit addresses
    compared to IPv4''s 32 bits), simpler routing, and simpler address assignment.
    A lack of IPv4 addresses was the primary factor that led to the creation of IPv6.


    IPv6 has become more prevalent since the release of the Microsoft Vista operating
    system, the first Microsoft client system to support IPv6 and it enabled by default.
    All versions through Windows 11 have the same. Other modern operating systems,
    such as OS X, Linux, UNIX, also enable IPv6 by default.


    > Note

    The IPv6 address space is 2^128, which is big: there are over 34 undecillion IPv6
    addresses, which is 340,282,966,920,938,463,463,741,678,211,456. IPv4 has just
    3 billion addresses, which is a 10-digit number in decimal: 4,294,967,296. If
    all 4.3 billion IPv4 addresses weighed 1 kilogram, all IPv6 addresses would weigh
    79,228,162,514,264,337,543kg, as as 13,263 Planet Earths. Another useful comparison:
    if all IPv4 addresses fit into a golf ball, all IPv6 addresses would nearly fill
    the sun.


    The IPv6 header, shown in Fig. 5.2, is larger and simpler than IPv4. Fields include:


    +   - Version: IP version (for IPv6)

    - Traffic Class Flow Label: used for QoS (Quality of Service)

    - Payload Length: length of IPv6 data (not including the IPv6 header)

    - Next header: next embedded protocol header

    - Hop Limit: to end routing loops


    # IPv6 Addresses and Stateless Autoconfiguration


    IPv6 hosts statically autoconfigure unique IPv6 address, omitting the need for
    static addressing or DHCP. IPv6 autoconfiguration (SLAAC) takes the host''s MAC
    address and it configures the IPv6 address. The ifconfig (interface configuration)
    output in Fig. 5.3, shows the MAC address as hardware address (HWAddr) 00:0c:29:feef:1136.


    IPv6 addresses are 128 bits long and use colons instead of dots to delineate sections.
    Sections of zeroes are condensed into two colons ("::"). The "ifcon-fig" in Fig.
    5.3 shows two IPv6 addresses:


    +   - fc01::00:29:feef:1136/64 (Scope:Global)

    - fe80::00:29:feef:1136/64 (Scope:Link)'
