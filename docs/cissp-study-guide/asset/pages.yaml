    \ if the line is in use. Hearing nothing, both dial simultaneously. Their calls\
    \ “collide”: the integrity of theirs is ruined. CSMA is designed to address collisions.\n\
    \nCarrier Sense Multiple Access with Collision Detection (CSMA/CD) is used to\
    \ immediately detect collisions within a network. It takes the following steps:\n\
    \n+   1. Monitor the network to see if it is idle\n2. If the line is not idle,\
    \ wait a random amount of time\n3. If the line is idle, transmit\n4. While transmitting,\
