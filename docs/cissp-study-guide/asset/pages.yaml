- pgno: 22
  md: '# Network Architecture and Design 247


    Ping was a reliable indicator of a node''s status on the ARPanet or older Internet,
    when firewalls were uncommon (or not exist). Today, an ICMP Echo Reply is a fairly
    reliable indicator that a node is up. Attackers use ICMP to map target networks,
    so many sites filter type of ICMP such as Echo Request and Echo Reply.


    An unanswered ping (an ICMP Echo Request with no Echo Reply) does not mean a host
    is down. The node may be down, or the node may be up and the Echo Request or Echo
    Reply may have been filtered at some point.


    # Traceroute


    The traceroute command uses ICMP Time Exceeded messages to trace a network route.
    As discussed IP, the Time to Live is used to avoid routing loops: every time a
    packet passes through a router, the router decrements the TTL field. If the TTL
    reaches zero, the router drops the packet and sends an ICMP Time Exceeded message
    to the original sender.


    Traceroute takes advantage of this TTL feature in a clever way. Assume a client
    is four hops away from a server: the client with a TTL of 1. The router A decrements
    the TTL to 0, drops the packet, and sends an ICMP Time Exceeded message to the
    client. Router B is now identified. The client sends a packet with a TTL of 2
    to the server. Router A decrements the TTL to 1 and passes the packet to router
    B. Router B decrements the TTL to 0, drops it, and sends an ICMP Time Exceeded
    message to the client. Router C is now identified. The process continues until
    the server is reached, as shown in Fig. 5.10, identifying all routers along UNIX
    the route.


    Most traceroute clients (such as UNIX and Cisco) send UDP packets outbound. The
    outbound packets will be dropped, so the protocol does not matter. The Windows
    tracer client sends ICMP packets outbound; Fig. 5.11 shows Windows tracer output


    ![](img/0bbd5f5bd171414c5e2c49247aab35d6_22_0.png)


    FIG. 5.10


    Traceroute.'
