  md: '# Network Architecture and Design 267


    confidentiality, and CCMP (Counter Mode CBC MAC Protocol) to create a Message
    Integrity Check (MIC), which provides integrity. The less secure WPA (without
    the “2”) was designed for access points that lack the power to implement the full
    802.11i standard, providing a better security alternative to WEP. WPA uses RC4
