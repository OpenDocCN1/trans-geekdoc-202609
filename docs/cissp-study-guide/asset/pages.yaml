    # The TCP Handshake


    TCP uses a three-way handshake to establish a reliable connection. The connection
    is full duplex, and both synchronize (SYN) and acknowledge (ACK) each other. The
    exchange of these four flags is performed in three steps: SYN, SYN-ACK, ACK, as
    shown in Fig. 3.8.


    The client chooses an initial sequence number, set in the first SYN packet. The
    server also chooses its own initial sequence number, set in the SYN/ACK packet
    shown in Fig. 5.8. Each side acknowledges the other''s sequence number by incrementing
    it: this is the acknowledgement number. The use of sequence and acknowledgement
    numbers both sides to detect missing or out-of-order segments.


    Once a connection is established, ACKs typically follow for each segment. The
    connection will eventually end with a RST (reset or tear down the connection)
    or FIN (gracefully end the connection).


    # UDP


    UDP is the User Datagram Protocol, a simpler and faster cousin to TCP, UDP has
    no handshake, session, or reliability: it is formally called “Send and Pray” for
    this reason. UDP has a simpler and shorter 8-byte header (shown in Fig. 5.9),
    compared to TCP''s default header size of 20 bytes. UDP header fields include
    source IP, destination IP, packet length (header and data), and a simple (optional)
    checksum. If used, the checksum provides limited integrity to the UDP header and
    data. Unlike


    ![](img/0bbd5f5bd171414c5e2c49247aab35d6_20_0.png)


    FIG. 5.8 TCP three-way handshake.'
