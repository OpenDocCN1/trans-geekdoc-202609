    # MPLS


    Multiprotocol Label Switching MPLS provides a way to forward WAN data via labels,
    via a shared MPLS cloud network. This allows MPLS networks to carry many types
    of network traffic, including ATM, Frame relay, IP, and others. Decisions based
    on labels, such as an IP header), MPLS can carry data and be used to simplify
    WAN routing. If T1s were used, the data center would require T12 circuits (one
    to each office); with MPLS, the data center and each office would require a single
    connection to connect to the MPLS cloud.


    # SDLC and HDLC


    Synchronous Data Link Control (SDLC) is a synchronous Layer 2 protocol that uses
    polling to transmit data. Combined nodes can act as primary or secondary. SDLC
    supports NRM transmission only (below).

    High-Level Data Link Control (HDLC) is the successor to SDLC. HDLC adds error
    correction and flow control, as well as two additional modes (ARM and ABM). The
    three modes of HDLC are:


    +   - Normal Response Mode (NRM)—Secondary nodes can transmit when permission
    by the primary

    - Asynchronous Response Mode (ARM)—Secondary nodes may initiate communication
    with the primary

    - Asynchronous Balanced Mode (ABM)—Combined mode where nodes act as primary or
    secondary, initiating transmissions without receiving permission


    # Converged Protocols


    “Convergence” is a recent network buzzword. It means providing services such as
    industrial controls, storage, and voice (that were delivered via non-IP devices
    and networks) via Ethernet and TCP/IP.


