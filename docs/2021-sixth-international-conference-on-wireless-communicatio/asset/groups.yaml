    ## III. 提议的方法


    总体架构如图 3 所示。最初，用户节点（UN）从蓝牙低功耗锚点（BLE ANs）感知 RSSI 值。我们提出的框架中使用的定位方法是指纹法。图 2 展示了从锚点（ANs）接收的
    RSSI 值存在巨大波动。该提议系统即使面对如此巨大的波动也能简化室内定位，它由两部分组成：离线/训练阶段和在线/执行阶段。在离线阶段，当收集锚点（ANs）的数据并记录位置坐标时，用户节点（UN）将这些参数记录到本地数据库中。在在线阶段，数据首先进行预处理，随后进行增强。增强后的数据集足以输入到不同的分类器中进行比较。选择产生最高准确度得分的方法来估计用户位置或网格。


    ### A. 指纹技术


    所提议的指纹技术将感兴趣区域划分为特定数量的矩形单元。使用标签节点和锚点节点测量每个单元内接收到的信号功率（无线电参数）。在第一阶段（也称为训练阶段），这些接收信号以类似信号强度分布描绘的方式组织成随机地图。训练阶段结束后，实现位置推断，并再次观察接收到的功率测量值，这是后续阶段。然后，将这些功率测量值映射到在训练阶段获得的位置信息。最后，通过利用数据关联技术和估计，将目标对象的位置缩小至其所在的单元。该过程允许指纹技术对物体位置进行离散估计。理论上，这些矩形单元的距离和尺寸可以减小到测量提供连续观察而非离散观察的程度。然而，在这种情况下，两个相邻点之间的信号强度差异将变得远小于典型的室内信号变化，这使得正确点的估计实际上几乎不可能。基于同样的原因，当选择指纹定位位置时，指纹定位位置的粒度与成功定位估计的可能性之间存在显著的权衡，应仔细考量。同样值得一提的是，尽管指纹和场景分析技术可以提供准确的定位估计，但它们对环境变化非常敏感。这完全是因为它们依赖于离线


    ![](img/f0f0eab0b92a20434dec20496d3dcb4f_2_0.png)


    图 1. 实验装置布局


    以及在线测量在不同时间实例 [7]。指纹方法不需要距离计算，并且该方法确保了足够的精度，尽管在过于密集和动态的环境中，精度会降低 [9]。


    ### B. 实验设置


    所提议的室内定位系统在印度金奈的 Novitate Engineering Solutions 的室内环境中进行了测试。在此设置中，四个 BLE 锚点（ANs）被放置在同一平面上，且不被其他结构遮挡。该设置中使用的
    BLE 模块是 Decawave 的 DWM1001。在封闭环境中放置锚点 A、B、C 和 D 的位置可以在图 1 中看到。锚点的放置位置最初是通过三角测量法决定的，但由于噪声和干扰过大而被放弃。后来，通过试错法和物理验证，锚点被放置在图示位置。为确保信号的可靠性，信标广播间隔被设置为
    1 ms，两个相邻信标之间的最小距离为 4 英尺。实验区域（100 平方英尺）被划分为均匀分布的网格点，两个相邻网格之间的距离为 1 英尺。我们利用线跟随机器人收集实验区域内
    16 个网格的数据。另一个 BLE 收发器模块，即用户节点/标签，安装在线跟随机器人上。机器人在静止且位于每个网格中心时，从 4 个锚点收集 RSSI 值。每个节点在每个网格收集的最小值为
    58，最大值为 65。因此，整个无线电地图数据集包含 1180 行数据。


    ### C. 数据预处理和增强


    从前一节的实验设置中，派生出的数据包含 7 列。这些是信号的时间戳、网格的 X 坐标、网格的 Y 坐标以及 4 个锚点节点的 RSSI 值。对于每个


    ![](img/f0f0eab0b92a20434dec20496d3dcb4f_3_0.png)


    ![](img/f0f0eab0b92a20434dec20496d3dcb4f_3_1.png)


    网格，每对唯一的 X 和 Y 坐标，每个锚点节点的 RSSI 值被观察 60 次。为每个网格形成一个新的特征标签，作为分类数据的变量。鉴于该系统是一个低成本系统，每个节点观察到的数据较少，不足以让算法学习和分类数据。因此，提出了一种数据增强技术。首先将每个节点在每个位置的数据隔离。然后为参考数据集定义特定的重复次数
    N。然后使用 Python 函数 sample 将该数字用于从每个节点有放回地随机选择 N 个数据点。这对每个网格上的每个节点都进行了重复。在我们的使用案例中，重复次数设置为
    200，这使得数据集增加了三倍。


    ## IV. 结果


    ### A. 分类器训练


    分类是一种监督学习类型，旨在将给定的数据集分类到各种类别中。在这种情况下，实现分类器以基于 RSSI 值对用户节点的位置进行分类。使用的分类器包括：


    -   **随机森林**：随机森林是一种用于分类的集成方法，通过在训练时设计决策树网络并得出个体树类别的模式来运行。

    -   **XGBoost**：XGBoost 是一种基于决策树的集成算法。它在训练阶段采用梯度提升框架进行学习。

    -   **决策树**：它们是监督机器学习算法的一个实例，可以用两个主要元素（叶子和节点）来解释。节点是基于条件分割数据的地方，叶子是算法的最终决策。

    -   **KNN**：K 近邻是一种监督机器学习算法，根据最近的邻域数据点来分类数据点。

    -   **SVC**：支持向量机算法用于输出和优化超平面，根据特征来表征给定信息。


    在原始数据集和增强数据集上都使用了 Jupyter 笔记本，并将数据集按 75:25 的比例划分为测试集和训练集。使用准确度、错误率、F1 分数、召回率等指标比较了每个分类器的最终结果。


    ### B. 实验结果


    表 I 和表 II 分别显示了每个分类器在原始数据和增强数据上的性能。从表中可以看出，增强数据具有显著优越的准确度值，并且降低了定位错误。错误率显示了被错误分类的数据点的百分比，召回率计算为每个网格输出的加权平均值，F1
    分数推导为每个网格精确率和召回率调和平均值的加权平均值。使用原始数据的模型相对于增强数据集模型显示了令人失望的结果。在使用增强数据集的模型中也没有出现过拟合或欠拟合的迹象，因为训练准确度和测试准确度没有太大差距。从结果推断，使用增强的随机森林算法


