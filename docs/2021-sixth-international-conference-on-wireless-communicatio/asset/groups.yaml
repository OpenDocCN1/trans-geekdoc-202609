    # ## Low-cost BLE based Indoor Localization using RSSI Fingerprinting and Machine
    Learning


    Charu Jain1, Gundepudi V Surya Sashank2, Venkateswaran. N3 and S. Markandan4


    1,3Dept. of ECE Sri Sivasubramanya Nadar College of Engineering Kalavakkam, India

    2Dept. of Mech Engineering Sri Sivasubramanya Nadar College of Engineering Kalavakkam,
    India

    4Dept. of ECE Anand Institute of Higher Technology Kazhipattur, India


    1charu18033@ece.ssn.edu.in, 2gundepudi18047@mech.ssn.edu.in, 3venkateswaran@ssn.edu.in,
    4markandans.ece@aiht.ac.in


    **Abstract**—With the IoT industry undergoing a boom, *Location Based Services*
    (LBSs) are playing an essential role in constructing smart cities. Since LBSs
    are in the process of being ubiquitous, it is essential to find a low-cost and
    low energy solution for localization. Bluetooth Low Energy (BLE) technology for
    indoor localization is a smart choice for giving economical solutions to the industry
    with additional advantages like trouble-free connection to other gadgets. We propose
    an improved **RSSI** (*Received Signal Strength Indicator*) based fingerprinting
    technique in which data is first augmented and then classified using Machine Learning
    algorithms. This indoor localization technique facilitates us to recognize the
    **X-position** of the user node (UN) or tag, which receives signals from the anchor
    nodes (ANs). The fluctuations in the RSSI values were large, because they were
    affected by multipath propagation and other factors in the indoor positioning
    environment. The fingerprinting data was augmented to overcome these drawbacks,
    to decrease the computational cost, to guarantee the precision of the framework
    by increasing the accuracy and also to be equipped for Machine Learning calculation.
    The augmentation strategy was actualized by utilizing accessible RSSI estems at
    one location, where *Random Forest* had the highest test accuracy of 96% surpassing
    all existing methods.


    *Index Terms*—Low-cost, Bluetooth Low Energy, Indoor Localization, Fingerprinting,
    Augmentation, Machine Learning


    # I. INTRODUCTION


    Localization has pulled in a great deal of research effort in the last decade
    due to the increasing use of location-based services (LBS). Wireless fingerprinting
    localization, specifically, has received a fair share of attention from the industry
    due to its high simplicity and compatibility with existing hardware [6]. There
    has been a rising need for indoor location information services in various industries.
    Some examples of implementation of indoor location information services are monitoring
    pedestrian flows at air terminals and stations, positions customers in stores
    and shopping malls and even monitoring the position of medicines in hospitals
    for easy access. The past decade has also bore fruit to some advances such as
    Wi-Fi, RFID and ZigBee. Though advances have been made in the location service
    industry, the localization task for indoor environments is rather complex with
    respect to outdoor cases. This can be attributed to the fact that in the former
    case there exist complex infrastructures and paths. In closed environments, the
    multipath effect assumes a pertinent and negative part. Most wireless signals
    face this sort of interference in structured environments, with numerous reflective
    and attenuating surfaces, such as walls and windows. Consequently, the indoor
    environment positioning demands undeniable levels of quality, which must be ensured
    by efficient exploitation of the hardware, high complexities, and extreme robustness
    [9]. To tackle these issues, fingerprinting method is needed to estimate indoor
    positions that need an estimation algorithm to guarantee accuracy of position.
    This technique is constructed from two phases, online and offline. During the
    offline phase the entire area of interest is split into a rectangular set of grid
    points. From each grid point the RSS is recorded from the Anchor Nodes (ANs) using
    the tag node. These signals are finally stored in a database system called the
    radio map. In the online phase, the cellphone collects the RSS from the ANs and
    sends it to the server to analyze the predefined fingerprint of the offline phase
    with the RSS in the online phase in order to assess the location on the grid map
    [10].


    One such positioning system that can be employed is the BLE positioning system,
    which has become a research focus on account of its low energy consumption, low
    cost, high compatibility, and small sizes of BLE devices [6]. Since, nearly every
    smart device such as laptops, cellphones, tablets and smartwatches are enabled
    with a Bluetooth module there is no necessity of an extra gadget. Due to its simplicity,
    BLE systems depend on RSS based inputs, though there are many ways in which BLE
    can be implemented, such as AoA and ToF [7]. In the actual applications, the distance
    measurement that is dependent on RSSI is positioned by reflection, multipath,
    antenna gain, etc, and large positioning error is caused. In this way, the localization
    method based on fingerprint feature vector is utilized, where the location area
    will be isolated into grids, and the received RSSI values of all Wi-Fi/BLE sources
    in each grid will be gathered. This is followed with all the RSSI values being
    stored in a fingerprint database [6]. This BLE technique utilized 2.4 GHz unlicensed
    frequency (2402 to 2480 MHz) with 40 channels (2 MHz for each channel width).
    Following the experimental setup and the data collection, numerous algorithms
    have been employed for optimizing the accuracy of the framework such as, multilateration
