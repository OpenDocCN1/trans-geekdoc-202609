    # III. PROPOSED METHOD


    The general architecture is depicted in Fig. 3. Initially, the UN senses RSSI
    values from BLE ANs. The positioning method that we use in our proposed framework
    is Fingerprinting. There are huge fluctuations in the RSSI values received from
    the ANs, depicted in Fig. 2. The proposed system, which simplifies indoor localization
    even with such colossal fluctuations, comprises two parts: Offline/Training stage
    and Online/Execution stage. In the Offline phase, when the data of the ANs is
    collected and the location coordinate is also recorded, the UN records these parameters
    to the local database. In the Online phase, the data is initially pre-processed
    which is augmented eventually. The augmented data set is appropriate enough to
    feed it to the different classifiers for comparison. The method which produces
    the highest accuracy scores is chosen to estimate the user position or the grid.


    # A. Fingerprinting technique


    The technique proposed, fingerprinting, divides the area of interest into a specific
    number of rectangular cells. The received signal power radio-signal parameter
    is measured for each cell using a tag node and an anchor node. These received
    signals are then organized as a random map in a similar fashion to a portrayal
    of signal strength distribution during the first phase also known as the training
    phase. Following the training phase the position inference is realized and the
    received power measurements are observed once again and this is the ensuing stage.
    These power measurements are then mapped with the location information that was
    obtained in the training stage. Finally by utilizing data association techniques
    and estimations the position of the target object is narrowed down to the cell
    it is in. This process allows the fingerprinting technique discrete estimations
    of the objects location. Theoretically, the distance and size of these rectangular
    cells can be reduced to the point where measurements provide a continuous observation
    rather than a discrete one. However, in this case, the difference in the signal
    strength between two neighbor points will turn out to be a lot more smaller than
    the typical indoor signal variations which makes the estimation of the correct
    point practically inconceivable. For the same reason, when the fingerprinting
    locations are picked, there is a significant tradeoff between the fingerprinting
    position granularity and the likelihood of successful location estimation which
    should be mulled over. It is likewise worth mentioning that the fingerprinting
    and scene analysis techniques are very susceptible to changes of the environment
    even though they can provide accurate localization estimations. This is solely
    because they rely on offline


