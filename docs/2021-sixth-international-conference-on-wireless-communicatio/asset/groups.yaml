    dataset outperforms the other classifiers with an Accuracy of 0.96, error of 0.04,
    an F1 score of 0.83 and recall of 0.93.


    # V. CONCLUSION


    In this paper, we propose a detailed indoor localization technique wherein the
    augmented fingerprinting technique is used. The RSSI-based fingerprinting database
    is collected from the four ANs with the aid of the UN mounted on a line follower
    robot, which goes around to collect the RSSI values in the area which is divided
    into grids. Because of the compact indoor location affected by multipath propagation
    and interference, huge fluctuations in the RSSI values are observed. To mitigate
    this drawback and to accurately estimate the location of the grids, Machine learning
    classifiers are employed after appropriate augmented data is obtained. Following
    augmentation, the data increases threefold from 1180 to 3200 rows, which increases
    the accuracy of localization from 61% to 96%. Five different Machine Learning
    Classifiers were employed to compare the metrics. Among these, Random forest classifier
    turned out to be the most accurate with 96% accuracy and also the lowest error
    at 0.04. For future work,


    we suggest that the readers devise a method of increasing any minimal fingerprinting
    dataset substantially more, which can be utilized by CNNs for localization.


