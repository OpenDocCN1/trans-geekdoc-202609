  mdcn: "\n## 基于 RSSI 指纹识别和机器学习的低成本 BLE 室内定位\n\nCharu Jain¹, Gundepudi V Surya Sashank²,\
    \ Venkateswaran. N³ and S. Markandan⁴\n\n¹,³ECE 系，印度斯里·西瓦苏布拉曼尼亚·纳达工程学院，Kalavakkam\
    \  \n²机械工程系，印度斯里·西瓦苏布拉曼尼亚·纳达工程学院，Kalavakkam  \n⁴ECE 系，印度安纳德高等技术学院，Kazhipattur\n\
    \n¹charu18033@ece.ssn.edu.in, ²gundepudi18047@mech.ssn.edu.in, ³venkateswaran@ssn.edu.in,\
    \ ⁴markandans.ece@aiht.ac.in\n\n**摘要**——随着物联网（IoT）行业的蓬勃发展，*基于位置的服务*（LBSs）在构建智慧城市中发挥着至关重要的作用。由于\
    \ LBSs 正趋于无处不在，寻找一种低成本、低能耗的定位解决方案至关重要。利用低功耗蓝牙（BLE）技术进行室内定位是向行业提供经济实惠解决方案的明智选择，此外还具有与其他设备连接无忧等优势。我们提出了一种改进的基于\
    \ **RSSI**（*接收信号强度指示器*）的指纹识别技术，该技术首先对数据进行增强，然后使用机器学习算法进行分类。这种室内定位技术使我们能够识别用户节点（UN）或标签的\
    \ **X 位置**，该节点接收来自锚节点（ANs）的信号。RSSI 值的波动较大，因为它们在室内定位环境中受到多径传播及其他因素的影响。为克服这些缺点，降低计算成本，通过提高精度来保证框架的精确性，并使其能够适应机器学习计算，对指纹数据进行了增强。该增强策略通过在单个位置利用可获取的\
    \ RSSI 估算值来实现，其中 *随机森林*（Random Forest）达到了 96% 的最高测试准确率，超越了所有现有方法。\n\n*索引词*——低成本，低功耗蓝牙，室内定位，指纹识别，增强，机器学习\n\
    \n## I. 引言\n\n在过去十年中，由于基于位置的服务（LBS）使用量的增加，定位技术吸引了大量的研究精力。特别是无线指纹定位，由于其高度的简便性和与现有硬件的兼容性，在工业界获得了相当多的关注。各行各业对室内位置信息服务的需求日益增长。室内位置信息服务的一些实施案例包括：监测机场和车站的人流、定位商店和购物中心中的顾客，以及监测医院中药物的位置以便轻松取用。过去十年也结出了一些成果，例如\
    \ Wi-Fi、RFID 和 ZigBee 等技术的进步。尽管位置服务行业取得了进步，但相对于室外环境，室内环境的定位任务相当复杂。这可以归因于室内存在复杂的基础设施和多径传播。在封闭环境中，多径效应起着关键的负面影响。大多数无线信号在结构化环境中会面临这种类型的干扰，这些环境中有许多反射和衰减表面，如墙壁和窗户。因此，室内环境定位要求无可辩驳的质量水平，必须通过高效利用硬件、高复杂性以及极强的鲁棒性来确保\
    \ [9]。为了解决这些问题，需要采用指纹法来估算室内位置，这需要一种估计算法来保证位置的准确性。该技术由在线和离线两个阶段组成。在离线阶段，整个感兴趣区域被划分为矩形网格点集。从每个网格点使用标签节点记录来自锚节点（ANs）的\
    \ RSS。这些信号最终存储在一个称为无线电地图的数据库系统中。在在线阶段，手机收集来自 ANs 的 RSS，并将其发送到服务器，将在线阶段的 RSS 与离线阶段预先定义的指纹进行比较分析，以评估网格地图上的位置\
    \ [10]。\n\n一种可应用的定位系统是 BLE 定位系统，由于其能耗低、成本低、兼容性强以及 BLE 设备尺寸小，已成为研究焦点 [6]。由于几乎每个智能设备（如笔记本电脑、手机、平板电脑和智能手表）都配备了蓝牙模块，因此不需要额外的设备。由于其简单性，BLE\
    \ 系统依赖于基于 RSS 的输入，尽管 BLE 有多种实施方式，如到达角（AoA）和飞行时间（ToF）[7]。在实际应用中，基于 RSSI 的距离测量会受到反射、多径、天线增益等影响，从而产生较大的定位误差。因此，利用基于指纹特征向量的定位方法，其中定位区域被隔离成网格，并收集每个网格中所有\
    \ Wi-Fi/BLE 源接收到的 RSSI 值。随后，所有这些 RSSI 值被存储在指纹数据库中 [6]。此 BLE 技术使用 2.4 GHz 免授权频段（2402\
    \ 至 2480 MHz），包含 40 个通道（每个通道带宽 2 MHz）。在实验设置和数据收集之后，采用了多种算法来优化框架的准确性，例如三边测量法和指纹法。总的来说，目前尚不存在使用\
    \ BLE 技术实现高精度的优化解决方案 [5]。用于预测物体估计位置的技术将影响对该物体真实估计位置的准确性。已有许多算法被用于估算物体的位置。从使用多项式回归作为传播模型的传统方法，到使用\
    \ K 近邻和机器学习。使用传统方法时，接收的 RSS 通过加权求和处理以获得物体的坐标，并使用多项式回归模型获得距离。两者都是基于每个信标 3 个广播信道的\
    \ RSS 信号确定的。然后，将这两种结果通过离群值检测进行滤波以清理输出，将指纹法与多项式回归模型的距离合并为组合距离。此滤波结果通过扩展卡尔曼滤波处理，利用第一个离群值检测后的滤波距离。扩展卡尔曼滤波的结果再次通过离群值检测进行滤波，以去除虚假测量。然后，此结果再次通过扩展卡尔曼滤波处理为估计位置，该位置将与无线电地图进行比较以获取真实位置。这种方法使用基于距离的测量，由于滤波器的原因，误差较大且准确性降低\
    \ [5]。后来，研究人员通过处理指纹数据将其转换为图像数据，并使用该图像数据训练 CNN 来实施 CNN 架构。然而，这种方法需要巨大的数据集和大量的锚节点（ANs）来馈送\
    \ CNN [4]。\n\n本文提出了一种新的基于 RSSI 的指纹识别技术和改进的指纹数据增强技术。当锚节点数量较少且非大规模部署时，强烈推荐此方法。为了即使数据较少也能提供高精度的定位，所使用的基于\
    \ RSSI 的增强技术是鲁棒的、独特的且易于实施的，它仅依赖于在位置每个网格中收集的 RSSI 值来生成增强输出。目标网格中存在的 RSSI 值被任意选择并写入新的输出中。其鲁棒性在于增强输出的模式与目标网格的输入\
    \ RSSI 模式相匹配。下文展示了论文的其余部分组织方式。第二部分描述该研究领域内的先前工作。第三部分描述了利用指纹法的拟议定位技术，以及数据和增强方法的描述。系统模型和实验设置在第四部分中呈现。最后，第五部分得出结论。\n\
    \n## II. 背景\n\n室内定位已经研究了相当长的一段时间。最初，RSSI 无线信号被用作室内定位的参考数据。然而，由于这些信号的无线多径影响，数值存在很大的波动，这些波动导致了较大的距离误差。为了解决高波动和误差问题，Aiguo\
    \ Zhang 等人 [6] 提出了一种基于 RSSI 的指纹特征向量算法。在该算法中，定位区域被划分为矩形网格集。移动设备通过实时 RSSI 特征向量与\
    \ RSSI 指纹数据库特征向量之间的相似性匹配进行定位。由于这高度依赖于位置，还需要进一步的工作。然而，LF（指纹法）由于需要更新指纹数据库这一前提条件而面临劣势。采用了一种称为高斯过程（GP）的非参数建模方法来建模接收信号强度指示器（RSSI）并创建更新的指纹数据库。该方法对训练数据存在的依赖性极少。Perez-Cruz\
    \ 等人 [2,3] 利用 GP 均值中的参数路径损耗模型和灵活的无参数协方差函数，从而可以用较低的指纹工作量实现可靠的估算。作者还解释了其他各种路径损耗模型及其优缺点。此后，由于\
    \ BLE 具有低成本服务、与现有软件的高兼容性以及尺寸小巧等特点而进入视野。Pavel Kriz 等人 [8] 审查并记录了结合 BLE 技术以及基于无线电的室内定位技术的一些基本标准所取得的改进结果。作者执行了一个分布式系统，通过运行\
    \ Android 操作系统的移动设备收集无线电指纹。该系统返回了 2.82 米的高误差，因此需要改进。Ngoc-Son Duong 等人 [11] 提出了一种新的系统——基于\
    \ BLE iBeacon 的室内定位系统，该系统应用了 K 近邻算法。K 近邻（k-NN）是一种机器学习方法，它根据训练数据和具有相同 RSS 值的最近邻数据点来确定用户位置。即便如此，该算法仍存在劣势，因为\
    \ ML 模型的准确性是不确定的。随后，Marco Terán 等人 [9] 实现了基于物联网（IoT）的框架。该框架的设计利用了无线网络技术以及与亚马逊云服务计算服务的连接。遗憾的是，该框架达到的最大准确率仅为\
    \ 75%。Osmah Ali Abdullah 等人 [10] 提出了一种基于对称 Bregman 散度的新框架，该框架在信号空间中整合了 kNN 分类。目标坐标解析为最接近指纹的加权组合，使用\
    \ Jensen-Bregman 散度将平方欧氏距离和马哈诺距离结合在一起，并结合信息论 Jensen-Shannon 散度度量。然而，尽管该技术提供了 90%\
    \ 的准确率，但由于其复杂性高而未受到广泛好评。同样，et al. [4,5] 分别使用回归和 CNN 来估算位置，前者获得了 96.67% 的极高准确率值。当锚节点少于\
    \ 150 个时，无法使用这些技术。Rashmi Sinha 等人 [1] 提出了一种改进的数据增强技术，该技术依赖于 RSSI 值，用于指纹室内定位系统。该技术在实验室模拟中实现了\
    \ 95.26% 的测试准确率，在实时环境中实现了 94.59%。该技术还使用了超过 250 个锚节点。最后，Faeheim Zafari 等人 [7] 提供了各种室内定位方法的详细综述，如到达角（AoA）、飞行时间（ToF）、往返飞行时间（RTOF）、接收信号强度（RSS），基于进步：\n\
    \n"
