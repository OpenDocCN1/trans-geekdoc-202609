    ## 五、结论


    在本文中，我们提出了一种详细的室内定位技术，该技术使用了增强指纹方法。基于 RSSI 的指纹数据库是通过安装在巡线机器人上的 UN 从四个 AN 收集的，该机器人在划分为网格的区域中绕圈收集
