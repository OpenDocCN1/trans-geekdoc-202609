    fingerprinting. All things considered, there are not yet any optimized solutions
    for high accuracy using BLE technology [5]. The techniques employed to predict
    the estimated position of an object will influence the accuracy of the estimated
    real position of the same. There have been many algorithms that have been implemented
    to estimate the position of the object. Starting from traditional methods that
    use polynomial regression as a propagation model to using K-Nearest Neighbours
    and machine learning. With the traditional method, RSS received was processed
    using weighted sum to get the coordinates of the objects and using a polynomial
    regression model to get distance. Both were determined using RSS signals from
    3 advertisement channels of each beacon. Then both results filtered using outlier
    detection to clean the outcome, by combining fingerprinting with polynomial regression
    model distance into combined distance. This filtered result will be handled using
    extended Kalman filtering utilizing filtered distance from first outlier detection.
    Results from extended Kalman filtering will be filtered again using outlier detection
    to remove false measurement. This result is then processed again with extended
    Kalman filtering into an estimated position that will be compared with the radio
    map to get the real position. This method is using distance-based measurement
    which gives high error and reduced accuracy due to the filter [5]. Later, researchers
    have implemented CNN architecture by processing the fingerprinting data into image
    data and using this image data to train the CNNs. This method however requires
    huge datasets and numbers ANs to feed to the CNN [4].


    In this paper a new technique for RSSI based fingerprinting and an improved fingerprinting
    data augmentation technique has been proposed. This method is highly recommended
    when the ANs are minimal and not in large scale. To give highly accurate localization
    even with less data, the employed RSSI-based augmentation technique is utilized,
    which is robust, unique and simple to implement, which is dependent on only RSSI
    values collected at each grid of the location to produce augmented output. The
    RSSI value present at the target grid is arbitrarily selected and written in the
    new output. The robustness lies in the fact that the pattern of augmented output
    matches with the input RSSI pattern of the target grid. The following shows how
    the rest of the paper is organized. Section II describes the previous works done
    in this domain of study. The proposed localization technique utilizing the fingerprinting
    method is described in Section III, along with the description of the data and
    also the augmentation method. System model and the experimental setup are presented
    in Section IV. Finally, Section V concludes the paper.


    the location area is divided into a rectangular set of grids. Mobile devices were
    localized through the similarity matching between the real-time RSSI feature vector
    and RSSI fingerprint database feature vectors. Since this was highly dependent
    on the location, further work was required. LF however faces a disadvantage due
    to the prerequisite of having an updated fingerprint database. A non-parametric
    modelling method called Gaussian Processes (GP) was adopted to model the received
    signal strength indicator (RSSI) and create the updated fingerprint database.
    This method was dependent scarcely on the existence of training data. Perez-Cruz
    et al. [2,3], utilized a parametric pathloss model for the GP mean and a flexible
    non-parametric co-variance function, with which reliable estimates are conceivable
    with low fingerprinting effort. The author also explained various other pathloss
    models and their pros and cons. Hereafter, BLE came into the picture due to its
    low-cost services, high compatibility with existing softwares and small size.
    The improved results of employing BLE technology along with a few fundamental
    standards of a radio-based indoor localization technique were reviewed and documented
    by Pavel Kriz et al. [8]. The author executed a distributed system for collecting
    radio fingerprints by mobile devices with the Android operating system. The system
    returned a high error of 2.82m and hence had to be improved. A new system - BLE
    iBeacon-based indoor localization system that applies k-nearest neighbours algorithm
    was proposed by Ngoc-Son Duong et al. [11]. K-nearest neighbours (k-NN) is an
    ML that decides the user position based on training data and the nearest neighbouring
    data points for the same RSS values. Even so, the algorithm posed a disadvantage
    since the accuracy of the ML model was obscure. Following this the implementation
    of an Internet of Things (IoT)-based framework was achieved by Marco Terán et
    al. [9]. The design of the framework utilizes Wireless Networking Technologies
    along with a connection to Amazon Web Services cloud computing service. Lamentably,
    the maximum accuracy achieved by this framework was 75%. Osmah Ali Abdullah et
    al. [10] presented a new framework based on symmetric Bregman divergence, which
    incorporates kNN classification in signal space. The coordinates of the target
    resolved as a weighted combination of the closest fingerprints using Jensen-Bregman
    divergences, which bound together the squared Euclidean and Mahalanobis distances
    with information-theoretic Jensen-Shannon divergence measures. Yet, this technique
    was not celebrated even though it gave an accuracy of 90% as it had high complexity.
    Likewhise et al.[4,5] use regression and CNNs respectively to estimate the location
    with exceptionally high accuracy values of 96.67% for the former. These techniques
    cannot be used when the anchor nodes are less than 150. Rashmi Sinha et al. [1]
    proposed an improved data augmentation technique dependent on RSSI values for
    fingerprint indoor positioning systems. The technique accomplished a test accuracy
    of 95.26% in the laboratory simulation and 94.59% in a real-time environment.
    This technique also had more than 250 ANs at their disposal. Finally, Faeheim
    Zafari et al. [7] gave a detailed survey of various indoor localization methods
    such as Angle of Arrival (AoA), Time of Flight (ToF), Return Time of Flight (RTOF),
