    ## 2.5. DNA Based Cryptanalysis


    It is one of the most prominent concepts in the field of information and network
    security. It is an interdisciplinary field that demands DNA based parallel computing
    infrastructure. As today most of the modern cryptosystems are broken by the use
    of advanced concepts, the DNA based cryptosystem opens up a new door for ensuring
    information security [4, 5]. DNA based cryptosystem involves complex bimolecular
    computations. These biomolecular computations require biological methods that
