  trans: "\nb. 仅考虑基于英语的密码分析。\n\nc. 它在密码分析过程中不考虑特殊字符。\n\nd. 仅支持 `n <= 3` 的 n-gram。\n\
    \n为了进行更有效的密码分析，必须使用这些机器学习算法。\n\nJayachandiran 提出了一种基于神经网络的新型模型，用于对名为 `Simon cipher`\
    \ 的轻量级加密算法进行密码分析 [8]。\n\n在这种技术中，神经网络将明文与相应的密文结合输入，生成用于加密的密钥。为了完成这项任务，对神经网络进行训练以预测明文-密文对的密钥。这种预测是由神经元计算的近似函数。这种推荐的模型在单轮\
    \ `Simon cipher` [8] 上运行良好。\n\n机器学习算法可以用于密码分析，以从密文中提取密钥。类似地，机器学习算法可以与现有的密码分析技术相结合，以提高发现密码系统弱点的效率。\n\
    \n30 \n\n*Mohammad Sirajuddin and Ande Prasad*\n\n## 2.5. 基于 DNA 的密码分析\n\n它是信息和网络安全领域最著名的概念之一。它是一个需要\
    \ DNA 并行计算基础设施的跨学科领域。由于今天大多数现代密码系统都是通过先进概念被破解的，DNA 密码系统为确保信息安全开辟了新门 [4, 5]。DNA\
    \ 密码系统涉及复杂的双分子计算。这些生物分子计算需要可以通过并行计算实现的生物方法。通过使用这种方案，可以开发出强大的密码系统。根据 Sattar B 等人的研究，可以进行生物计算以产生\
    \ DNA 模型的变体 [4]。这些 DNA 模型可以解决各种 NP 类问题。由于 DNA 模型的并行性，基于 DNA 的密码分析可以在更短时间内分析密码系统。Sattar\
    \ B 等人概述了该领域的挑战，列如下：\n\na. 生物学概念原理从生物环境向数字环境的转换。\n\nb. 支持的密码有限，且未对其他可用密码进行测试。\n\
    \nc. 最小化实现 DNA 计算的成本。\n\nd. 将 DNA 功能从生物环境转换为数字环境非常困难。\n\ne. 可用数据的表示。\n\n随着计算能力的日益增长，即使是先进的加密方案也能被密码分析师轻易破解。事实上，对确保信息安全的创新且强大的算法有着巨大需求。为了在更短时间内确定复杂密码系统的强度和弱点，需要基于\
    \ DNA 的密码分析。这种 DNA 密码分析缺乏强大且可接受的理论和实践贡献，设计高效的 DNA 密码分析方案仍然是一个挑战性问题。\n\n由于 DNA\
    \ 计算具有许多优势（如并行性、需要最小存储、最小功率和长存储时间），它可以服务于密码分析领域。基于 DNA 的加密和密码分析方面必须进行更多的研究 [4,\
    \ 5]。\n\n## 3. 未来的挑战\n\n本节重点介绍了了可用于密码分析的先进技术。\n\n- 量子计算仍处于研究早期阶段。将量子计算应用于量子/后量子密码系统的密码分析中是一项具有挑战性的任务\
    \ [7]。\n- 机器学习技术可用于从密文中确定密钥。尽管如此，该领域仍需更多工作。\n- 如前所述，密码分析中基于 DNA 的计算需要更多研究，并为密码分析提供了新的研究方向。\n\
    \n- 新型优化算法也可用于密码分析。Mohamed Abdel Basset 等人提出了一种新型鲸鱼优化算法，用于 Merkle-Hellman 密码系统的密码分析。\n\
    \n32 \n\n*Mohammad Sirajuddin and Ande Prasad*\n\n## 结论\n\n在本章中，我们解释了密码分析的重要性，并介绍了一些最近的密码分析方案。本章还概述了密码分析领域的未来研究方向，以及如何利用先进和新兴技术来分析复杂的密码系统。\n\
    \n## 参考文献\n\n[1] Shaligram Prajapat, Ramajeevan Thakur, “用于自动挖掘的加密挖掘”, *Elsevier-Computer\
    \ Science*78 (2016).\n\n[2] Mohammad M. Alani, Stephen P., “机器学习在加密中的应用”, *IJACSA*\
    \ 6 (2015).\n\n[3] Shaligram Prajapat, Kajol Maheshwari, Aditi Thakur, Ramajeevan\
    \ Singh, “人工智能视角下的加密挖掘”, *Security*-2017.\n\n[4] Sattar B. Sadkhan, Bassim S.\
    \ Yaseen, “基于 DNA 的密码分析：挑战与未来趋势”, 第二届科学会议 (SCSS), IEEE*-2019.\n\n[5] “安全实践中的 DNA\
    \ 和 DNA 计算：是未来吗?”, *GIAC Paper*.\n\n[6] Riccardo Focardi, Flaminia L. Luccio,\
    \ “经典密码的神经密码分析”, *CEUR-WS*-2243.\n\n[7] Stephen P. Jordan, Yi-Kai Liu, “量子密码分析：Shor,\
    \ Grover 及之后”, *IEEE Computer and Reliable Societies*-2018.\n\n[8] Kowsic Jayachandiran,\
    \ “密码分析的机器学习方法”, RIT 科学报告 2017.\n\n[9] Vikrant Shende, Giridhar S., Meghana Kulkarni,\
    \ “结合数学和暴力破解 RSA 加密数据的快速密码分析”, *ICPCSI*-2017.\n\n[10] Xu Dewu, Chen Wei, “分组密码分析综述”,\
    \ *ICASM*-2010.\n\n[11] Harshali D. Zodpe, Prakash W. Wani, “DES 密码分析算法的设计与实现”,\
    \ 第 12 国际混合智能系统会议 (HIS) IEEE*-2012.\n\n在深入观察网络安全……\n\nISBN: 978-1-53618-165-4\n\
    \n编辑：Ch. Rupa 等\n\n© 2020 Nova Science Publishers, Inc.\n\n## 第 4 章：渗透测试在安全分析中的作用\n\
    \n***Ch. Rupa\\****\n\n计算机科学与工程系，VR Siddhartha 工程学院，维杰亚纳普拉，安得拉拉邦\n\n**摘要**\n\n\
    系统设计开发的一个重要阶段是安全分析。漏洞评估和密码分析是安全分析的一部分。在分析过程中使用了各种工具、技术和方法。这些可以通过考虑某些许可，如安全密钥强度、密文、加密算法、存储保护、实现语言以及其他因素来应用。\n\
    \n作为一部分，分析人员必须使用渗透（PEN）测试来了解用于系统的方案或方法的强度。本章详细介绍了渗透测试的阶段及其功能。本文的主要优点列出了每个阶段的各种工具及其描述。\n\
    \n\\*通讯作者邮箱：rupamtech@gmail.com。\n\n36\n\n*Ch. Rupa*\n\n**关键词**：敏感数据、漏洞评估、Nessus\
    \ 工具、Nmap\n\n**引言**\n"
