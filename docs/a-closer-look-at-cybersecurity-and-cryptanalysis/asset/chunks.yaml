    ## 结果与漏洞分析\n\n`Nessus` 工具用于根据某些属性进行漏洞评估。以下步骤显示了工具的功能。\n\n- `Nessus` 是由 Tenable\
    \ Network Security 开发的网络漏洞扫描器。它在非企业环境中供个人使用免费。\n- 它搜索系统在应用程序、计算机或网络中的弱点。它可以同时识别内部和外部网络扫描。\n\
    \n48\nCh. Rupa\n\n- 内部扫描意味着在特定路由器内部进行扫描。外部扫描意味着涉及特定路由器之外的主机或远程主机。`Nessus` 能够同时对主机主机扫描。\n\
    - 主要优势是 `Nessus` 对哪些服务运行在哪些端口上不做任何假设，并会积极尝试利用已识别的漏洞。\n- `Nessus` 基于客户端-服务器架构。每个会话由客户端控制，测试在服务器端运行。\n\
    - `Nessus` 允许对以下类型的漏洞进行扫描：\n    - 允许远程黑客控制或访问系统上敏感数据的漏洞。\n    - 配置错误（例如，开放的邮件中继、缺少补丁等）。\n\
    \    - 默认密码、一些常用密码以及某些系统账户上的空/无密码。`Nessus` 还可以调用 `Hydra`（一个外部工具）启动字典攻击。\n    -\
    \ 使用畸形数据包对 TCP/IP 栈进行拒绝服务。\n    - PCI DSS 审计的准备。\n\n## 结论\n\n测试应用程序系统、网络或计算机系统需要检查安全漏洞状态。此报告有助于解决已识别的问题，这些问题可能需要保护系统不受入侵者的未经授权活动。测试实践应由设计人员和人员通过渗透测试执行以了解系统的安全状态。它指的是手动或通过某些软件应用程序执行的安全分析。本章讨论了渗透测试在安全分析中的作用，并列出了执行它的各种软件应用程序。\n\
    \n选自：A Closer Look at Cybersecurity …\nISBN：978-1-53618-165-4\n编辑：Ch. Rupa 等\n\
    © 2020 Nova Science Publishers, Inc.\n\n***第 5 章***\n\n# 使用 NESSUS 工具进行漏洞评估\n\n\
    Ch. Rupa\nC.S.E 部门系, V.R Siddhartha Engineering College, Vijayawada, Andhra Pradesh,\
    \ India\n\n### 摘要\n\n有许多技术和工具可以列出远程主机中存在的漏洞。漏洞评估在保障组织网络系统安全方面起着重要作用。`Nessus` 漏洞扫描器是主动扫描领域的领导者，具有高速发现、配置审计、资产分析、敏感数据发现以及我们安全态势漏洞分析等特点。`Nessus`\
    \ 发现端口状态的能力，还能检测特定系统的缺陷并提供修复建议。`Nessus` 可以导入由 `Nmap` 等其他工具生成的扫描结果并相应地执行漏洞扫描。它让高层的网络安全工作变得更容易。\n\
    \n**关键词**：敏感数据，漏洞评估，`Nessus` 工具，`Nmap`\n\n50\nCh. Rupa\n\n## 1. 引言\n\n`Nessus`\
    \ 工具用于根据某些属性进行漏洞评估。以下步骤显示了工具的功能。\n\n- `Nessus` 是由 Tenable Network Security 开发的网络漏洞扫描器。它在非企业环境中供个人使用免费。\n\
    - 它搜索系统在应用程序、计算机或网络中的弱点。它可以识别内部和外部网络扫描。\n- 内部扫描意味着在特定路由器内部进行扫描。外部扫描意味着涉及特定路由器之外的主机或远程主机。`Nessus`\
    \ 能够同时对主机主机扫描。\n- 主要优势是 `Nessus` 对哪些服务运行在哪些端口上不做任何假设，并会积极尝试利用已识别的漏洞。\n- `Nessus`\
    \ 基于客户端-服务器架构。每个会话由客户端控制，测试在服务器端运行。\n\n`Nessus` 允许对以下类型的漏洞进行扫描：\n\n- 允许远程黑客控制或访问系统上敏感数据的漏洞。\n\
    - 配置错误（例如，开放的邮件中继、缺少补丁等）。\n- 默认密码、一些常用密码以及某些系统账户上的空/无密码。`Nessus` 还可以调用 `Hydra`（一个外部工具）启动字典攻击。\n\
    - 使用畸形数据包对 TCP/IP 栈进行拒绝服务。\n- PCI DSS 审计的准备。\n\n![Image 76](img/index-63_1.png)\n\
    ![Image 77](img/index-63_2.png)\n使用漏洞评估\n51\n\n## 2. NESSUS 工具的安装\n\n打开浏览器并搜索\
    \ `Nessus`。打开下方链接 `Nessus` 官方网站 `https://www.tenable.com/products/nessus/select-operating-system`\
