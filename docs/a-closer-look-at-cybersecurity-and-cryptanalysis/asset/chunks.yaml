    \ `Nessus(Home, Professional or Manager)`，由于我们没有激活码，点击高亮的注册此扫描器。\n\n打开一个新标签页用于注册，可以在其中说明所需的\
    \ `Nessus` 账户类型。我们将继续使用 `Nessus` 免费版。点击立即注册。在这一步中，我们必须注册以获取激活码。填写详细信息如名、姓、电子邮件、国家，并勾选同意服务条款框然后点击注册。图\
    \ 5 和图 6 代表了工具的注册过程。\n\n图 5. 注册。\n图 6. `Nessus` 首页。\n\n![Image 82](img/index-66_1.jpg)\n\
