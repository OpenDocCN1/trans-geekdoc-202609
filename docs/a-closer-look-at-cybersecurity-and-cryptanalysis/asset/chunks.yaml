    ### 1.1. Types of Threats


    There are a few threats of Information security as confirmed by [3]


    1. `Malware`: It is a harmful and malicious program that stops the functioning
    of the entire system.


    2. `Botnet`: It is a malware. Today botnets became the biggest security threat.
    A botnet consists of a collection of devices interconnected to launch cybercrime.
    These interconnected devices are controlled by bootmaster. Criminals use botnets
    to launch `DoS` (Denial of Service) attack.

