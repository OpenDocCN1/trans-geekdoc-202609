    system gets loaded with a green signal blinking on it.


    Then all the connected components are initialized. The Flowchart of our proposed
    system is furnished in Figure 2.


    Figure 2. Flowchart.


    *Smart IoT Device for Women Safety* 95


    ## 2.4 Explanation


    **Step 1:** The users who are willing to help women can readily register themselves
    to a website by providing their details. The details are stored in a database.


    **Step 2:** Whenever a woman feels any problem she can just press the force sensor.


    **Step 3:** The input from the force sensor is read into an `AD converter` there
    after the signal is sent.


    **Step 4:** `Raspberry Pi` system gets the registered numbers.


    **Step 5:** `GPS` module gets the current location of victim.


    **Step 6:** Finally `SMS Gateway` sends the location of victim to all registered
    people.


