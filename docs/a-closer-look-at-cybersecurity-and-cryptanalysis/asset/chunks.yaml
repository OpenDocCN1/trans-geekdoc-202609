    # ABSTRACT

    For most of `Cryptographic` algorithms that are developed or being developed at
    present, the prime problem faced is vulnerability. There is not an algorithm or
    a system which can stand without prone to an attack because everything has vulnerabilities
    and glitches. `cryptanalysis` is the considered solution to make the algorithm
    run by finding, reducing the chance of vulnerabilities; on the other hand, it
    is a useful weapon for attackers to attack the system. In this chapter, I would
    like to explain the birth of cryptanalysis and various cryptanalysis techniques.


    **Keywords**: `Cryptography`, `vulnerability`, `glitch`, `cryptanalysis`.


    # INTRODUCTION

    Analysis means detailed examination of elements or structure and `cryptography`
    means the method of protecting information using codes, where `crypt` means hidden
    and `graphy` means writing. Hence, we write codes to hide the information using
    `cryptography`. `cryptanalysis` is the process of finding the hidden meaning present
    in the attained data through a deep examination of the codes.


    Cryptanalysis came into existence and was publicly acknowledged in the year 1990
    by Murphy. He is recognized for his efforts in cryptanalysis of a block cipher
    called `FEAL`. It is developed by Akihiro Shimizu and Shoji Miyaguchi from NTT
    in the year 1987. Initially, `FEAL` cipher stood as an alternative algorithm for
    `DES`.


    Murphy found `FEAL` cipher to be susceptible to various forms of `cryptanalysis`
    and it lead the path to discovering linear and differential cryptanalysis on various
    block ciphers. At present, both block ciphers and stream ciphers like `salsa20`,
    `chacha`, also face cryptanalysis attacks.


    `cryptanalysis` also includes passive attacks on premises/property. Passive attacks
    include eavesdropping on, monitoring of, and transmissions. Passive attacks are
    divided into two types; one is the release of message contents and the other is
    traffic analysis. In both cases the message is unaltered and encrypted; allowing
    for a possible attacker to make out patterns by observing. Cryptanalysis is used
    in informative warfare applications e.g., decoding the ciphertext without the
    use of a key.


    According to Diffie and Hellman “skill in the production of cryptanalysis has
    always been heavy on the side of the professionals, but innovation, particularly
    in the design of new types of cryptographic systems, has come primarily from amateurs”.
    Thus, every system is designed with a bug in it.


    # CRYPTANALYSIS AND VARIOUS ATTACKS

    In the previous section, we have seen what made `Affine cipher` weaker. Let us
    admit it and take a step forward to cryptanalysis the `Affine cipher`.


    ## Table 1. Cryptanalysis of Affine Cipher

    | Key | Value |

    | :--- | :--- |

    | `(x, b)` | Plain text recovered |

    | `(1, 1)` | W O I |

    | `(5, 6)` | N O I R |

    | `(7, 19)` | O T U I |

    | `(15, 20)` | C R Y T |

    | `(11, 19)` | X O D G W |

    | `(1, 1)` | X I F P |


    The number of possible keys for the first key is `12`. And for the second key
    is `26`. So possible keypairs are `12 * 26 = 312`. For a standard computer, the
    key becomes much easy (`Brute force`). If we assume the message we encrypted is
    in language English, then the total number of letters are `26`. In `Affine cipher`,
    the first key must be relatively coprime to `26`. Unfortunately, this makes only
    `12` quantity of numbers available as coprime to `26`. Therefore `312` keypairs
    are not much high range to try for plaintext. If cryptanalyst can discover the
    plaintext by employing `brute` technique then, `Affine cipher` gets blow off.


    Consider the previous example `XOPKS`, the ciphertext of `CRYPT`. We take keypairs
    in the form: `(x, b)`. Here `x` is modular multiplicative inverse of `a`, where
    `a` is one among `26` numbers of `26`. `b` is taken as usual we took in the previous
    section. Cryptanalysis has given in Table 1, which provides you with a better
    understanding. By seeing the above plaintexts, we can simply summarize 3rd try
    gave the desired result, whereas `(7, 19)` keypair gave at its best.


    # METHODS

    There are a bunch of methods explained below demonstrating cryptanalysis techniques
    to attack a designed/developed algorithm using a block cipher, a stream cipher,
    and hashing algorithms.


    ### Ciphertext Only Attack

    In this case, the encrypted message is available to the attacker; he can use this
    encrypted message to study and observe patterns and decode the attained results
    to the original message.

    For example consider a message `ih` is encrypted as `hi`, similarly `eyb` as `bye`.
    Therefore attacker by observing the patterns can definitely can solve the puzzle
    and attack the system.


    ### Known Plaintext Attack

    In this case, attackers know or can guess the original plaintext from ciphertext
    generated by the algorithm which allows him to determine the key.

    For example some systems run on `xor` cipher i.e., plaintext `xor` with key gives
    ciphertext. Therefore if attackers knows the ciphertext, plaintext by `xor` cipher
    he will determine the key.


    ### Chosen Plaintext Attack

    In this case, the attacker is acknowledged with some plaintext. He observes the
    trends in the ciphertext to determine the design of the system, leading way to
    key generation.


    ![Image 4](index-24_1.png)


    For example let us consider the plaintext is `good morning jack, have a good day`
    it is encrypted as `work daily then, your stress reduces`. The plain text has
    repeated good two times similarly the ciphertext repeated work two times thus
    it weakens the system security.


    ### Chosen Ciphertext Attack

    In this case, the attacker will make a deep analysis of the traffic and capture/choose
    some ciphertext for which he plans to decrypt/decipher.

    After observing various chosen-ciphertext, he is able to trace out the key to
    chosen plain text.


    ### Man-in-the-Middle Attack

    In this case, parties who are communicating through a channel think it''s secure
    but the attacker trespasses to a position which is feasible for attack as shown
    in below Figure 1 alice messages can be seen, modified, and damaged by Mallory
    until it reaches bob.

    In this `MITM` attack, the attacker is the middle man but both end parties are
    unaware of this reality and they position him as a key exchange officer between
    themselves. The attacker performs key exchange with each party. MITM attacks mostly
    on public-key cryptography.


    ### Brute Force Attack

    The objective of cryptanalysis is to state that it provides a way way to assess
    the weakness of a cipher. Parameters may vary from cipher; however, it grabs vast
    knowledge to discover vulnerability. Although `Affine cipher` is not fit for today’s
    daily life, it stood at the best grade for the sake of demonstrating cryptanalysis
    like what we discussed in this chapter.


    # CONCLUSION

    Every cipher is vulnerable, but not yet discovered. The objective of cryptanalysis
    is to state that it provides a way to assess the weakness of a cipher. Parameters
    may vary from cipher; however, it grabs vast knowledge to discover vulnerability.
    Although `Affine cipher` is not fit for today’s daily life, it stood at the best
    grade for the sake of demonstrating cryptanalysis like what we discussed in this
    chapter.

