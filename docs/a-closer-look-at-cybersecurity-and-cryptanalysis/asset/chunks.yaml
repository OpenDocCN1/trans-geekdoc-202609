    . INTRODUCTION**\n\nThe concept of Cryptography plays a vital role in ensuring\
    \ secure communication in various domains. Due to the popularity of machine learning\
    \ and deep learning techniques, many researchers are developing security frameworks\
    \ in various domains by incorporating these advanced techniques to ensure secure\
    \ and reliable communication.\n\nCryptanalysis is also having equal importance\
    \ as cryptographic schemes because cryptanalysis is required to test and determine\
    \ the weaknesses of existing cryptographic schemes. The fundamental concept behind\
    \ the cryptanalysis is to determine the decryption process without knowing the\
    \ cryptographic algorithm and key employed for encryption.\n\n**2\\. METHODS**\n\
    \n**2.1. Cryptanalysis of Block Ciphers**\n\nThe design of Block ciphers is a\
    \ well-established research area since its inception. The design of block ciphers\
    \ with adequate security levels against differential and linear cryptanalysis\
    \ is always been a challenging task \\[10\\].\n\nThis section explains the advances\
    \ made in the cryptanalysis of block ciphers. First, we explain Linear, differential\
    \ and integral cryptanalysis schemes.\n\nDifferential analysis is the most prominent\
    \ attack on block ciphers.\n\nThis concept brought into light by Biham and Shamir\
    \ around 1990. The main objective of the differential analysis is to determine\
    \ the key based\n\n *Evolution of Cryptanalysis Techniques* 23\n\non the differences\
    \ between input and output patterns. Variations in the mapping of plaintext to\
    \ ciphertext are used to determine the key. In concise, a fixed differential of\
    \ any plaintext is chosen first and then output the differential of the ciphertext,\
    \ assigning them with different keys according to different probabilities. By\
    \ analyzing the ciphertext, the legitimate key can be determined.\n\nProvable\
    \ security against differential cryptanalysis can be accomplished by finding differential\
    \ probabilities upper bounded by small enough value \\[10\\].\n\nLinear Cryptanalysis\
    \ comes under known plain text attack. It uses the concept of linear approximation\
    \ expression between plaintext, ciphertext and the key. Linear approximation can\
    \ be determined as *ciphertext = f(plaintext,key*) where an attempt is made to\
    \ find a linear approximation of f. It uses a chain of XOR operations between\
    \ plaintext and ciphertext bits which are assumed as a linear relationship between\
    \ plaintext, ciphertext and key bits. It is represented as \U0001D443\\[\U0001D44B\
    \n\n+…. +\n\n+…. +\n\n+…. +\n\n1+\U0001D44B2\n\n\U0001D44B\U0001D441\\]⊕ \U0001D436\
    \\[\U0001D44C1+\U0001D44C2\n\n\U0001D44C\U0001D440\\] = \U0001D43E\\[\U0001D43E\
    1+\U0001D43E2\n\n\U0001D43E\U0001D445\\]\n\nwhere \U0001D44B\n\n,….\n\n,….,\n\n\
    1,\U0001D44B2\n\n\U0001D44B\U0001D441 \U0001D44E\U0001D45F\U0001D452 \U0001D45D\
    \U0001D459\U0001D44E\U0001D456\U0001D45B\U0001D461\U0001D452\U0001D465\U0001D461\
    \ \U0001D44F\U0001D456\U0001D461\U0001D460 \U0001D44E\U0001D45B\U0001D451 \U0001D44C\
    1,\U0001D44C2\n\n\U0001D44C\U0001D440\n\nare\n\nthe\n\nciphertext bits.\n\nMultiple\
    \ approximation cryptanalysis is an advancement of linear cryptanalysis because\
    \ it reduces plaintext pairs that are needed by the ciphertext.\n\nWe refer hybrid\
    \ cryptanalysis as the combination of linear and differential cryptanalysis. The\
    \ fundamental idea is: a. To determine some linear approximation.\n\nb. Produce\
    \ the output differential features pair according to linear approximation making\
    \ the probability of linear expression correlated with existing linear expression\
    \ equal to 1.\n\n24\n\n*Mohammad Sirajuddin and Ande Prasad*\n\nc. Combining the\
    \ linear approximation with differential properties leads to the restoration of\
    \ some key bits.\n\n*Integral Cryptanalysis*\n\nIt is applied to block ciphers\
    \ that employs bijection component. The fundamental principle of this attack is\
    \ to restore the key bits by analyzing the values obtained during several rounds\
    \ of the key transformation \\[10\\].\n\n**2.2. Cryptanalysis of RSA**"
