- raw: "Even today, the cryptographers strive to develop ciphers that encrypt sensitive\
    \ data to furnish privacy for users. The developed ciphers yield an unreadable\
    \ format of data, which we termed it as Ciphertext. This Ciphertext generated\
    \ is most reliable if the cipher used to encrypt is a flawless cipher. To determine\
    \ whether a cipher is vulnerable or not, we use a technique known as cryptanalysis.\
    \ The cause for the birth of numerous ciphers is successful cryptanalysis. The\
    \ cryptanalysis is a process of detailed examination and analysis of a cipher\
    \ from an adversary view. An adversary is the one who attacks the cryptographic\n\
    \n\\* Corresponding Author’s Email: sainadhkarthik7143@gmail.com.\n\n2\n\n*Karthik\
    \ Sainadh Siddabattula*\n\nalgorithm to recover plain text. In this chapter, we\
    \ perform some known cryptanalysis techniques.\n\n**Keywords**: cryptanalysis,\
    \ adversary, cryptology, cryptanalyst **INTRODUCTION**\n\nProtecting information\
    \ systems is the most prominent aspect to be considered. No matter what the information\
    \ is. It might be a name, phone number, password, payment card details; every\
    \ piece of information needs a wrapper that protects it from evil eyes. As we\
    \ already know, cryptology, often called cryptography, achieves the protection\
    \ by sending the plain text into robust ciphers, which performs data encryption,\
    \ resulting in a ciphertext. The additional parameter used to encrypt the plaintext\
    \ is the secret key. This key may vary in size, depending on the algorithm. Some\
