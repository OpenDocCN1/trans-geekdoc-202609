    ### 3. Social Engineering

    It is the change in people’s behavior to indulge in wrong actions with data. The
    types include Phishing, Baiting, Vishing etc.


    - **Phishing**: In this attack, trusted resource is imitated to get personal information
    of people. This attack makes the people to access fake emails or websites where
    they are forced to enter their personal account information. Eg: Attacker sends
    fake emails from the reputed financial organization requesting for banking related
    information (like credit card/debit card).

    - **Baiting**: This attack is launched by relying on the greed/curiosity of the
    people. In this, attacker gives fake offers to the people to get their personal
    and sensitive information. This attack encourages people to download malwares
    by surrendering their personal information.

    - **Vishing**: This attack is launched through `VoIP` (Voice over IP). It involves
    spoofing of legitimate phone numbers that lead the people to believe that the
    call is legitimate and share their information.


    ### 4. Ransomware

    Another class of malware from cryptovirology that terrorizing and manipulating
    public data or suppressing it without their knowledge.


    ### 5. Backdoors

    It allows access to the assets without the user’s knowledge.


    ### 6. Cryptojacking

    As we know that cryptocurrency is a part of digitization where digital currency
    is used for the exchange of goods and services. Cryptojacking is a malicious cryto-mining
    software used by unauthorized people to mine cryptocurrency.


    ### 7. Formjacking

    As we know that in today’s digital work, all payments are made by customers through
    online. As all the bank transactions are digitized, it gives a chance for criminals
    to insert malicious `javascript` code into payment application to seize the customer
    details. This type of attacks are increasing day by day across the globe.


    ## 1.2. Major Domains

    The following are the areas of computer security as shown in Figure 2.


    ![Image 99](index-79_1.png)


    *Digitization with Cyber Security and AI*


    Figure 2. Cyber security domains.


    1. **Network Security**: It protects the network from unauthorized access. Many
    tools are being developed to implement network security framework.

    2. **Cloud Security**: Cloud is used by almost all the organizations whether big
    or large. Since all the important data transfers and storage are done there, it
    must be protected properly. Cloud providers must use new tools to safeguard their
    data.

    3. **Application Security**: Web application security has become the weakest side.
    The web pages are morphed and used in a wrong way. But latest tools that are emerging
    will help the people to guard their pages and other applications from falling
    in wrong hands.

    4. **Infrastructure Security**: Security provided to the pivotal infrastructure
    (like Emergency, defense, commercial sectors etc.).


    ## 1.3. Requirements of Cyber Security

    A few basic requirements of cyber security are:


    a) **People**: Every individual person is responsible for preventing the threats.
    They must be up-to-date with the solutions for all risks.

    b) **Processes**: The processes that are documented must explain duty, management
    and rules. They must be periodically viewed.

    c) **Technology**: The latest technologies are to be installed to minimize the
    number of cyber threats. It is made sure that the installation of this software
    does not bring further threats to the computer or any digital device.


    ## 1.4. Benefits

    Cyber security allows us to deal with the assets correctly and protects them from
    misuse. It provides a bunch of benefits as such in [4].


    - There is always protection for all information and networks.

    - Unauthorized access is highly prohibited.

    - It shields from a varied set of virus, malware virus, malware, worms and others
    that affects the entire system.

    - Minimizes the possibilities of system or network crash due to attacks.


    ## 1.5. Complications

    Cyber security also has some dark sides. The few disadvantages [5] are:


    - It is quite expensive for ordinary people.

    - A proper configuration of network software/hardware is required. An incorrect
    configuration may block the legitimate access.

    - It is essential to periodically keep the software updated.

    - As security threats are infinite more expertise is required to implement security
    policies to ensure the security of assets.


    ## 2. APPLYING AI FOR CYBER SECURITY

    AI is a prominent domain which can be combined with cyber security for implementing
    superior security policies. Many organizations are employing AI based systems
    that analyzes the incoming and outgoing network traffic to assist cybersecurity
    professionals to identify various threats and take necessary actions to resolve
    them. Without AI, the implementation of cybersecurity tools that learn on their
    own by analyzing the things would not be possible.


    To implement this kind of functionality the training datasets must be required.
    Based on this training dataset new automated AI tools can be developed to enhance
    the effectiveness of current cybersecurity schemes [8, 10].


    We explained how AI can be used to protect organization’s assets from various
    cyberattacks [9].


    ### 2.1. AI Based Authentication

    Password is a general way of providing authentication which is very fragile in
    the context of security. Due to this reason, biometric based authentication schemes
    are used widely. But due to advancements in technology attackers can also compromise
    the biometric based security schemes [6].


    For example: a face recognition system cannot able to detect the same face with
    different hairstyles. This type of authentication scheme can be compromised by
    the attacker by getting different images from the social media. By using AI, biometric
    based authentication can be enhanced and get rid of various difficulties that
    exist in traditional schemes. AI can be used to create a sophisticated model of
    the user’s face by identifying key correlations and patterns. Apple claims that,
    with this technology, there’s only one-in-a-million chance of fooling the AI and
    opening the device with another face. The AI based software can also work in different
    circumstances and support the changes like a new hairstyle, wearing a hat or eyeglass
    etc.


    ### 2.2. Phishing Detection Using AI

    It is one of the most widely used cyber-attack that is used by attackers to get
    personal information of legitimate users. AI based system can able to scan phishing
    sources and make faster decisions than the human expert can do. AI based software
    can also be trained to differentiate between fake and legitimate websites [6].


    ### 2.3. AI Based Behavioral Analysis

    AI based behavioral analysis is a promising way of handling cyber attacks. The
    usage of `ML` algorithms can results in a model that can learn and analyze your
    behavior by creating behavioral patterns based on how you use your device. It
    also records and analyzes your way of typing, speed of typing, mouse clicks, surfing,
    scrolling patterns etc. At any time, if AI identifies unusual behavior that doesn’t
    matches your standard patterns, then it can determine that the activities are
    done by unauthorized user [6].


    ### 2.4. AI Based Malware Detection

    Malware detection has been a persistent challenge for cyber security professionals.
    Traditional malware detection schemes are signature-based, also relies on static
    and dynamic analysis. Due to enormous growth in malicious code, there is a huge
    demand for novel malware.

