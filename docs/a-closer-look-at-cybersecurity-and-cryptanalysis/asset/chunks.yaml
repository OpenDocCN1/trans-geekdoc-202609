    **Results and Vulnerability Analysis**


    Nessus tool uses to evaluate vulnerability assessment based on certain attributes.
    The following steps show the functioning of the tool.


     Nessus is a network vulnerability scanner developed by Tenable Network Security.
    It is free of charge for personal use in a non-enterprise environment.


     It searches map systems for weakness in the application, computer or their network.
    It identifies both the internal and external network scans.


    48


    *Ch. Rupa*


     Internal scan means scanning is performed within a particular router. External
    scan means scanning involves the hosts outside the particular router or a remote
    host. Nessus has the capability of multiple scanning of the hosts at the same
    time.


     The main advantage is that Nessus makes no assumptions for what services are
    running on what ports and it actively attempts to exploit identifies vulnerabilities.


     Nessus is based on a client-server architecture. Each session is controlled
    by the client and the test is run on the server-side.


     Nessus allows scans for the following types of vulnerabilities:


     Vulnerabilities that allow a remote hacker to control or access sensitive data
    on a system.


     Misconfiguration (e.g., open mail relay, missing patches, etc.).


     Default passwords, a few common passwords, and blank/absent passwords on some
    system accounts. Nessus can also call Hydra (an external tool) to launch a dictionary
    attack.


     Denials of service against the TCP/IP stack by using malformed packets.


     Preparation for PCI DSS audits.


    **CONCLUSION**


    Testing an application system, network or computer system required to check the
    status of security vulnerabilities. This report helps to resolve identified issues
    that can require protecting the system from unauthorized activities by the intruders.
    A practice of testing should need to perform by the designers and developers through
    Penetration testing to know the security status of the system. It refers to a
    security analysis that can perform either manually or automatically with some
    software applications. This chapter has discussed role of penetration testing
    in security analysis as well as listed various software applications to perform
    it.


