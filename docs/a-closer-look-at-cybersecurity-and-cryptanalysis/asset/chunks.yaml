    ### B. 关联规则

    该策略从海量数据集中查找经常发生的项目集。关联规则挖掘发现了属性之间的联系。Lee 提出了用于识别入侵的关联关系深度挖掘的构想。该系统最初与所谓的市场篮子调查有关，旨在发现杂货店客户购物行为的规律性。


    ### C. 聚类

    一种用于在未标记信息中发现模式的无监督机器学习系统。它用于标记信息并将其分成若干组，每组由非常相似的个体组成。


    来自不同组的个体将相互不同。不同的聚类方法包括基于密度的策略、基于网格的技术、基于模型的技术、划分策略和层次策略。


    ## 1.2. IDS 中的数据挖掘算法

    以下给出了 IDS 中通用执行的最常用的数据挖掘算法。


    #### 1.2.1. 决策树

    著名的机器学习策略。决策树学习使用 `Decision` 作为预测模型，将对某个事体的感知映射到关于该事体的目标价值。


    决策树学习是一种通常用于数据处理的方法。其目标是构建一个模型，以预测受许多数据因素影响的目标变量值。决策树也被用于入侵识别。树通过优化经过高度特征化标准的维护树，为每个选择节点挑选最佳方案。其中一种规则是利用信息来识别尺寸关系。


    **关注点：**

    1. 构建不需要任何空间信息。

    2. 可以处理高维信息。

    3. 表示直观。

    4. 准备好处理数值和离散数据。


    **负担：**

    1. 构建不需要任何空间信息。

    2. 输出特征必须是整数。

    3. 限于单一输出质量。

    4. 决策树算法具有敏感性。

    5. 由数值数据索引生成的树可能是非常复杂的。


    #### 1.2.2. 贝叶斯系统分类器

    贝叶斯系统是一种编码感兴趣因素之间概率连接的策略。贝叶斯系统代表了计算机网络检测和防御攻击的新方法；在 IDS 中使用贝叶斯系统解决了大部分与 IDS 相关的问题。该系统有时用于与数学计划相关的入侵识别。


    **有利情况：**

    1. 朴素贝叶斯分类器简化了计算。

    2. 应用于大型数据库时表现出高准确性和速度。


    **缺点：**

    1. 类条件独立性假设。

    2. 缺乏可用的似然信息。


    #### 1.2.3. K-近邻

    k-最近邻算法 (`k-NN`) 是一种用于分类和回归的非参数策略，根据特征空间中 k 个最近训练示例来预测样本的“质量”或类别成员。它是一种懒学习，能力仅在局部进行估计，所有计算推迟到最后。k-最近邻管理是所有机器学习算法中最好的之一：分类问题通过其邻居的多数投票进行调查，将物体分配给其
    k 个最近邻居中最常见的分类。通常，它被用于与相关的数学计划的入侵检测（异常识别）。


    **关注点：**

    1. 分析上可处理。

    2. 执行简单。

    3. 使用局部信息，可以产生高度自适应的行为。

    4. 易于并行执行。


    **负担：**

    1. 大容量需求。

    2. 对维度灾难非常敏感。

    3. 刻画测试元组的速度缓慢。


    #### 1.2.4. 人工神经网络

    人工神经网络是由生物感官系统驱动的计算模型。神经网络既用于异常入侵发现，也用于恶意入侵检测。对于异常入侵识别，神经网络被建模以发现系统客户的正常特征，并从客户建立的行为中构建具有重要意义的变化。在恶意入侵识别中，神经网络将从系统流中获取信息并学习是否存在入侵示例。用于入侵检测的
    `NN` 以两种不同的方式实现。主要方法是将神经网络部分整合到伙伴级现有或更改的特征框架中。第二种方法将神经网络作为独立的恶意入侵检测框架。


    **关注点：**

    1. 它需要较少正式的数据准备。

    2. 隐式地能够检测障碍和自主因素之间复杂的非线性关系。

    3. 对噪声信息具有高抗性。

    4. 备有多种准备算法。


    **负担：**

    1. “黑箱”性质。

    2. 更大的计算权重。

    3. 容易过拟合。

    4. 它需要很长的准备时间。


    #### 1.2.5. 支持向量机

    支持向量机被认为是入侵识别框架的重要程序。它是一种用于分类分类和回归的机器学习算法执行。一些标准的 `SVMs` (`Support Vector Machines`)
    是数据排序的强大设备，它们通过将二分类分配到高维元素空间中的两个不相交的半空间之一（对于非线性分类）以及问题的主输入空间（对于线性分类）来指示二分类。


    **关注点：**

    1. 高度准确。

    2. 能够显示复杂的非线性分类边界。

    3. 比其他算法更不容易过拟合。


    **不便之处：**

    1. 在大规模任务中，高算法复杂性和所需的二次计算程序具有广泛的内存需求。

    2. 部分的选择很困难。

    3. 准备和测试的速度都中等。


    #### 1.2.6. K-Means 聚类

    `K-Means` 算法是一种详尽的划分聚类算法，通常由于其简单快速而被使用。它使用欧几里德距离作为相似性量。硬聚类意味着数据索引中的项目在任何时刻只能在一个组中。它是一种聚类算法，根据其元素值将元素聚集到
    k 个不相交的组中，目标是相同簇中的元素具有相似的属性，不同簇中的元素具有不同的属性。该算法的领先用于准备可能包含正常和异常流量且无需预标记的数据。


    **关注点：**

    1. 易于实现。

    2. 连接到大型数据集时具有高精度和更快的执行。


    **缺点：**

    1. 创建空簇的概率。

    2. 簇的数量具有先验性。

    3. 有一个全局簇，它工作得不好。不同的初始划分可能导致几个最后的组。

    4. 对于（原始数据中）不同大小和不同厚度的簇效果不佳。


    '
