    ## 结论


    许多技术和工具可以列出远程主机中存在的漏洞。漏洞评估对于保护组织的网络系统起着重要作用。


    Nessus 漏洞扫描器是主动扫描器的全球领导者，具有高速发现、配置审计、资产分析、敏感数据发现以及安全态势漏洞分析等功能。Nessus 具有发现端口状态的能力，还能检测特定系统上的缺陷并提供建议的修复方案。Nessus
    可以导入由 `Nmap` 等其他工具完成的结果并相应地执行漏洞扫描。它使高管理层的网络安全工作变得更容易。


