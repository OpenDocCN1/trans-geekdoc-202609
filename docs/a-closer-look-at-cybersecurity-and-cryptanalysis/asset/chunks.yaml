    ### 3. 社会工程学

    这是通过数据诱导人们做出错误行为的行为。类型包括网络钓鱼、诱饵攻击、语音钓骗等。


    - **网络钓鱼 (Phishing)**：在这种攻击中，模仿受信任的资源来获取个人的信息。这种攻击迫使用户访问虚假的电子邮件或网站，在那里他们被迫输入个人账户信息。例如：攻击者从知名金融机构发送虚假邮件，请求银行相关信息（如信用卡/借记卡）。

    - **诱饵攻击 (Baiting)**：这种攻击利用人类的贪婪或好奇心。在这种情况下，攻击者向人们提供虚假优惠以获取他们的个人和敏感信息。这种攻击鼓励人们通过提交个人信息来下载恶意软件。

    - **语音钓骗 (Vishing)**：这种攻击通过 `VoIP`（IP 语音）发起。它涉及伪造合法电话号码，使人们认为通话是合法的并分享信息。


    ### 4. 勒索软件

    加密病毒学学中的另一类恶意软件，用于恐吓和操纵公共数据，或在用户不知情的情况下进行抑制。


    ### 5. 后门

    它允许在用户不知情的情况下访问资产。


    ### 6. 加密挖矿

    众所周知，加密货币是数字化的一部分，数字货币用于商品服务的交换。加密挖矿是一种恶意加密挖掘软件，被未经授权的人用于挖掘加密货币。


    ### 7. 表单劫 (Formjacking)

    众所周知，在当今的数字化工作中，客户通过在线完成所有支付。由于所有的银行交易都是数字化的，这为犯罪分子提供了机会，在支付应用程序中插入恶意的 `javascript`
    代码以客户详情。这类攻击在全球范围内日益增加。


    ## 1.2. 主要领域

    以下是图 2 所示的计算机安全领域。


    ![Image 99](img/index-79_1.png)


    *网络安全与人工智能的数字化*


    图 2. 网络安全领域。


    1. **网络安全 (Network Security)**：保护网络免受未经授权的访问。正在开发许多工具来实施网络安全框架。

    2. **云安全 (Cloud Security)**：几乎所有大小的组织都使用云。由于所有重要数据的传输和存储都在那里完成，因此必须对其妥善保护。云提供商必须使用新工具来保护其数据。

    3. **应用安全 (Application Security)**：Web 应用安全已成为最薄弱环节。网页被篡改并被错误使用。但新出现的最新工具将帮助人们保护其网页和其他应用程序不落入不法之手。

    4. **基础设施安全 (Infrastructure Security)**：为关键基础设施（如应急、国防、商业部门等）提供的安全。


    ## 1.3. 网络安全需求

    网络安全的一些基本要求是：


    a) **人员 (People)**：每个人都负责防止威胁。他们必须掌握所有风险的最新解决方案。

    b) **流程 (Processes)**：记录在案的流程必须说明职责、管理和规则。必须定期查看。

    c) **技术 (Technology)**：必须安装最新技术以最大限度地减少网络威胁。确保此类软件的安装不会给计算机或任何数字设备带来进一步威胁。


    ## 1.4. 收益

    网络安全允许我们正确处理资产并保护它们免受滥用。它在 [4] 中提供了许多如下收益：


    - 对所有信息和网络始终有保护。

    - 严禁未经授权的访问。

    - 它可以防止各种病毒、恶意病毒、恶意软件、蠕虫等其他影响整个系统的威胁。

    - 最大限度减少因攻击导致系统或网络崩溃的可能性。


    ## 1.5. 复杂性

    网络安全也有一些阴暗面。一些缺点 [5] 包括：


    - 对普通人来说非常昂贵。

    - 需要对网络软件/硬件进行正确配置。错误的配置可能会阻止合法访问。

    - 定期保持软件更新至关重要。

    - 由于安全威胁是无限的，需要更多的专业知识来实施安全策略以确保资产安全。


    ## 2. 将人工智能应用于网络安全

    AI 是一个重要领域，可以与网络安全相结合，以实施卓越的安全策略。许多组织正在采用基于 AI 的系统，这些系统分析入站和出站流量，协助网络安全人员识别各种威胁并采取必要行动解决它们。如果没有
    AI，就无法实现那些通过分析事物进行自我学习的网络安全工具。


    为了实现这种功能，需要训练数据集。基于这些训练数据集，可以开发出新的自动化 AI 工具，以增强当前网络安全方案的有效性 [8, 10]。


    我们解释了如何使用 AI 保护资产免受各种网络攻击的影响 [9]。


    ### 2.1. 基于 AI 的身份验证

    密码是提供身份验证的一种通用方法，在安全方面非常脆弱。由于由于原因，基于生物识别的身份验证方案被广泛使用。但由于技术的进步，攻击者也可以破坏基于生物识别的安全方案
    [6]。


    例如：脸部识别系统无法检测不同发型的同一张脸。这种身份验证方案会被攻击者通过社交媒体获取不同的图片来破解。通过使用 AI，可以增强基于生物识别的认证，并消除传统方案存在的各种困难。AI
    可通过识别关键关联和模式来创建用户面部的复杂模型。苹果声称，有了这项技术，欺骗 AI 并用另一个脸打开设备的概率只有百万分之一。基于 AI 的软件还可以在不同情况下工作，并支持新发型、戴帽子或眼镜等变化。


    ### 2.2. 使用 AI 检测网络钓鱼

    这是攻击者用于获取合法用户信息的一种最常用的网络攻击。基于 AI 的系统能够扫描钓鱼源并做出比人类专家更快的决策。基于 AI 的软件还可以被训练以区分虚假和合法网站
    [6]。


    ### 2.3. 基于 AI 的行为分析

    基于 AI 的行为分析是处理网络攻击的一种很有前景的方法。`ML` 算法的使用可以产生一种模型，根据你使用设备的方式创建行为模式来学习和分析你的行为。它还记录并分析你的打字方式、打字速度、鼠标点击、浏览、滚动模式等。任何时候如果
    AI 识别出与你的标准模式不符的异常行为，就可以判断这些活动是由未经授权的用户进行的。


    ### 2.4. 基于 AI 的恶意软件检测

    恶意软件检测一直是网络安全人员面临的持续挑战。传统的恶意软件检测方案是基于特征的，也依赖静态和动态分析。由于恶意代码量增长，对新型恶意软件有巨大需求。


