    Ch. Rupa 博士目前担任印度 V.R Siddhartha 工程学院计算机科学与工程（C.S.E）部门教授。她拥有超过 15 年的教学和研究经验。她的兴趣领域包括信息安全、区块链技术、基于物联网的应用安全、图像处理、数据分析等。她在许多久誉誉的国家/国际期刊上发表了研究成果，并受邀在
    SCI/SCOPUS 索引的各类国家/国际会议担任主旨演讲员。她还在安全领域申请并发表了许多专利。凭借这些卓越贡献，她荣得了多项国家和国际奖项。


    100


