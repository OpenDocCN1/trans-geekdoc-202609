    A penetration test, also called a pen test, is used to evaluate system security.
    So, the pen test is also referred to as an authorized simulator attack on a system.
    It can help to set a fine web application firewall (`WAF`) policies and patches
    for detected vulnerabilities. In the 1970’s, the Department of Defense used this
    method for demonstrating the vulnerabilities in the system. The main objective
    of the pen test is to identify security vulnerabilities in the network infrastructure
    of an organization. Security is not a single point solution but is a process of
    requirement. Pentest can be done by using various methods such as:


    ### a. External Test

    Its target is visible assets of a company on the Internet (Ex. Website, `DNS`,
    `E-mail`, etc) and it is tested from an external entity (from outside the organizational
    network). Either Internet or Extranet (a private network) is used to perform this
    test.


    ### b. Internal Test

    It’s target is to access an application behind the firewall simulation attack
    by the insider maybe greedy employee, etc and this process is done by the internal
    entity only.


    ### c. Blind Test

    It aims to simulate the real hacker actions and procedures at organization premises
    by prior limited notification to the concerned people at an organization. The
    testing team uses publicly available sources (like `USENET`, `Domain Name Registry`,
    other Internet discussion boards, etc) to gather the organization information
    for doing simulation.


    ![Image 8](index-49_1.jpg)


    *Role of Penetration Testing in Security Analysis* 37


    ### d. Double Blind Test

    It is an extension of the blind test. Test the system as an attacker without provided
    prior to additional information. In this, monitors escalation and response procedures,
    incident identification, etc.


    ### e. Targeted Test

    It involves both the organizational team and the pen test team together. This
    is a valuable and cost-effective exercise.


    ## PEN TEST PHASES


    Pentest phases which can be done by authorized attackers, for reducing exploitation
    of the vulnerabilities in the system by unauthorized attackers through preliminary
    patches, are as shown in Figure 1.


    Figure 1. Penetration Testing Phases.


    38


    *Ch. Rupa*


    The penetration testing process is divided into five stages such as Reconnaissance,
    Scanning, Gaining Access, Maintenance and Reporting.


    - **Reconnaissance** – Define the Scope and goals of a test and gathers the intelligence
    in this phase.

    - **Scanning** – Analyze various target applications how can they respond for
    the Intruder attempts.

    - **Gaining Access / Exploitation** – Try to exploit the uncover vulnerabilities
    for understanding the damage rate by the attackers.

    - **Maintaining Access** – Try to gather more information from the target environment
    by taking persistent steps.

    - **Reporting** – Compiled the test results into a report for organization reference
    purposes which can help to configure their policies and other applications.


    ## METHODS


    ### Reconnaissance


    Footprinting is a part of reconnaissance which can be the blueprint of the organization''s
    security profile. At this phase, the only tester can set up the scope and objectives
    of the test. Gather the target information as much as possible either from internal
    or external sources. Inside sources of the target (ex: organization) which can
    cause to help to collect information are `Internal DNS`, `Dumpster Diving`, `Shoulder
    Surfing`, `Private Websites`, `Eves Dropping`, etc.


    As as the External sources of the target that can be used for gathering the information
    are phone, `Email-Headers`, `Websites`, `Search Engines` (Ex: `Google`), `WHOIS`,
    `Social Networks`, `Customers`, `IPR` (Intellectual Property Rights), etc. This
    gathered information


