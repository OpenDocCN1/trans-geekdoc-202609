    \ systems.\n\n6\\. *Multiple keys usage*: As the password/pin is strongly built-in\
    \ lock, the key also has similar feature; it also locks the system.\n\nUsage of\
    \ multiple keys increases the level of difficulty to attack. Suppose, consider\
    \ a door closed and locked with 10\n\nlocks, it needs 10 keys namely k1, k2, k3,\
    \ …, k10 to open the door. Therefore, the thief should have stolen 10 keys to\
    \ open the door, but it is a herculean task to him.\n\n7\\. *Secure hardware usage*:\
    \ secure hardware means strong built system design, strong procedure architecture.\
    \ Still, research is going on to invent secure hardware and embedded systems.\n\
    \nBatch files operated system is more secure than todays super computers.\n\n\
    18\n\n*Meerjavali Shaik*\n\n**CONCLUSION**\n\nEvolution of quantum computers and\
    \ supercomputers encouraged cryptanalysis for fast processing because these systems\
    \ use less time to predicate the key value.\n\nUsage of algorithms like shor’s\
    \ \\[13\\] will factor large key numbers in polynomial time, it effects breaking\
    \ some generally used forms of asymmetric key encryption.\n\nBy using grovers’s\
    \ \\[14\\] algorithm we can find brute-force key-value quadratically faster in\
    \ a quantum computer. However, this could be countered by doubling the key length.\n\
    \nTo prevent some of these cryptanalysis attacks we can compute a cryptographic\
    \ hash of the key exchange and sign it with digital signature \\[15\\] algorithm\
    \ and send it to the other side, then the receiver verifies the hash with locally\
    \ computed hash to see if both hashes match and the signature came from desired\
    \ other party. If they don't match, it is a masquerade attack.\n\nEven though\
    \ having various effects from cryptanalysis, it is efficient because it helps\
    \ us improve our standard in making new robust algorithms.\n\n**REFERENCES**\n\
    \n\\[1\\]\n\nWagstaff, Samuel S. Jr., Dept. of Maths and Statistics\n\n“*Cryptanalysis\
    \ of number theoretic ciphers*”, version 6, 2019,\n\n[https://doi.org/10.1201/9781315275765.](https://doi.org/10.1201/9781315275765)\n\
    \n\\[2\\]\n\nL. Chen, J. Chen, G. Zhao and S. Wang, “Cryptanalysis and Improvement\
    \ of a Chaos-Based Watermarking Scheme,” in *IEEE*\n\n*Access*, vol. 7, pp. 97549-97565,\
