    and approaches have been used while doing security analysis. These can apply by
    considering certain permits like the strength of security key, ciphertext, encryption
    algorithms, storage protection, implementation languages and like some other factors.


    As a part of this Penetration (PEN) test has to be used by the analyzers to know
    the strength of their approach or method or methodology used for implementing
    the system. In this chapter detailed description presented on Penetration testing
    phases and its functioning. The main strength of this paper is a list of various
    tools under each phase with the description has mentioned.


