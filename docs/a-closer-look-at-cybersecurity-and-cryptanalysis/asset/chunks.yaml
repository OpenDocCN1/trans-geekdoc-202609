    *Ch. Rupa*


    ### Scanning


    The scanning phase analyzes various target applications how they can respond for
    the Intruder attempts. Statistical analysis helps estimate how it will respond.
    Dynamic analysis analyzes the code while running.


    The scanning process initially identifies the state of the host whether it was
    alive (up) or not (down). If the host was in live state then go to ports or services
    scanning. In OSI model, Network Layer as layer 3 has some protocols as `IPv4`,
    `IPv6`, and `ICMP`, as well as Transport Layer as layer 4 has some protocols,
    are `TCP` (S UP Flags) and `UDP` (doesn’t have flags) plays an important role
    in the pen test. With the reference of flags status in `TCP`, can possible to
