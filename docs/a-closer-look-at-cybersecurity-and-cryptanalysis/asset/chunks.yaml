  trans: "\n\n渗透测试，也称为 pen test，用于评估系统安全性。因此，渗透测试也被称为对系统进行的授权模拟攻击。它可以帮助针对检测出的漏洞设置精细的\
    \ Web 应用程序防火墙（`WAF`）策略和补丁。在 20 世纪 70 年，国防部曾使用这种方法演示系统中的漏洞。渗透测试的主要目标是识别组织网络基础设施中的安全漏洞。安全不是单一的解决方案，而是一个需求过程。渗透测试可以通过各种方法进行，例如：\n\
    \n### a. 外部测试\n其目标是公司在互联网上的可见资产（例如：网站、`DNS`、`E-mail` 等），并从外部实体（从组织网络之外）进行测试。使用互联网或外网（私有网络）来执行此测试。\n\
    \n### b. 内部测试\n其目标是通过模拟内部人员（可能是贪婪的员工等）发起的攻击，访问防火墙后的应用程序，此过程仅由内部实体完成。\n\n### c.\
    \ 盲测\n其目的是通过事先向组织的相关人员提供有限的通知，在组织场所模拟真实黑客的行动和程序。测试团队使用公开资源（如 `USENET`、域名注册表、其他互联网讨论板等）来收集组织信息以进行模拟。\n\
    \n![Image 8](img/index-49_1.jpg)\n\n*渗透测试在安全分析中的作用* 37\n\n### d. 双盲测试\n它是盲测的扩展。在不提供额外事先信息的情况下，像攻击者一样对系统进行测试。在此过程中，监控升级和响应程序、事件识别等。\n\
    \n### e. 目标测试\n它涉及组织团队和渗透测试团队共同进行。这是一项非常有价值且成本效益高的活动。\n\n## 渗透测试阶段\n\n授权攻击者可以执行的渗透测试阶段，通过初步补丁来减少未经授权攻击者对系统漏洞的利用，如图\
    \ 1 所示。\n\n图 1。渗透测试阶段。\n\n38\n\n*Ch. Rupa*\n\n渗透测试过程分为五个阶段：侦察、扫描、获取权限、维持和报告。\n\
    \n ** **侦察（Reconnaissance）** – 定义测试的范围和目标，并在阶段收集情报。\n- **扫描（Scanning）** – 分析各种目标应用程序如何响应入侵者的尝试。\n\
    - **获取权限 / 利用（Gaining Access / Exploitation）** – 尝试利用未发现的漏洞以理解攻击者造成的损害。\n- **维持权限（Maintaining\
    \ Access）** – 尝试通过采取持久措施从目标环境中收集更多信息。\n- **报告（Reporting）** – 将测试结果汇成报告，供组织参考，帮助其配置策略和其他应用程序。\n\
    \n## 方法\n\n### 侦察\n\n足迹取样（Footprinting）是侦察的一部分，可以作为组织安全概况的蓝图。在此阶段，只有测试人员可以设定测试的范围和目标。尽可能从内部或外部源收集目标信息。目标的内部源（例如：组织）可以帮助收集信息的来源包括\
    \ `Internal DNS`、`翻垃圾桶（Dumpster Diving）`、`窥视（Shoulder Surfing）`、`私人网站`、`窃听`等。\n\
    \n用于收集信息的目标外部源包括电话、`Email-Headers`、网站、`搜索引擎`（例如：`Google`）、`WHOIS`、社交网络、客户、`IPR`（知识产权）等。这些收集的信息\n\
    \n![Image 9](img/index-51_1.png)\n![Image 10](img/index-51_2.png)\n![Image 11](img/index-51_3.png)\n\
    ![Image 12](img/index-51_4.png)\n![Image 13](img/index-51_5.png)\n![Image 14](img/index-51_6.png)\n\
    ![Image 15](img/index-51_7.png)\n![Image 16](img/index-51_8.png)\n![Image 17](img/index-51_9.png)\n\
    ![Image 18](img/index-51_10.png)\n![Image 19](img/index-51_11.png)\n\n*渗透测试在安全分析中的作用*\
    \ 39\n\n（情报）用于更好地理解未经授权人员如何攻击目标。在该阶段结束时，图 2 显示了使用的工具。\n\n图 2。侦察工具。\n\n| 编号 | 工具\
    \ | 描述 |\n| :--- | :--- | :--- |\n| 1 | `Whois` | 查找信息 |\n| 2 | `nslookup` | 获取\
    \ DNS 记录 |\n| 3 | `nmap` | 调查网络 |\n| 4 | `ping` | 测试源 |\n| 5 | `traceroute` |\
    \ 显示路由 |\n| 6 | `hping` | 测量延迟 |\n| 7 | `Shodan` | 获取在线信息 |\n| 8 | `Netcraft`\
    \ | 搜索网络 |\n| 9 | `社交工程` | 例如：Facebook, Linkedin |\n| 10 | `搜索引擎` | 例如：Google,\
    \ Bing |\n\n*渗透测试在安全分析中的作用* 40\n\n*Ch. Rupa*\n\n### 扫描\n\n扫描阶段分析各种目标应用程序如何响应入侵者的尝试。统计分析有助于估计其响应。动态分析在运行时分析代码。\n\
    \n扫描过程最初识别主机是在线（up）还是离线（down）。如果主机处于活跃状态，进入端口或服务扫描。在 OSI 模型中，网络层（第 3 层）的一些协议 `IPv4`、`IPv6`\
    \ 和 `ICMP`，以及传输层（第 4 层）的一些协议 `TCP`（带有标志）和 `UDP`（无标志）在渗透测试中起着重要作用。通过 `TCP` 标志状态，可以识别目标\
    \ IP 地址和其他操作。因此需要使用加密密码对标志状态进行保护。扫描的一些基本技术\n\n![Image 20](img/index-53_1.png)\n\
    ![Image 21](img/index-53_2.png)\n![Image 22](img/index-53_3.png)\n![Image 23](img/index-53_4.png)\n\
    ![Image 24](img/index-53_5.png)\n![Image 25](img/index-53_6.png)\n![Image 26](img/index-53_7.png)\n\
    ![Image 27](img/index-53_8.png)\n![Image 28](img/index-53_9.png)\n![Image 29](img/index-53_10.png)\n\
    \n*渗透测试在安全分析中的作用* 41\n\n- `Ping 扫描（Ping Sweep）`\n- `子网掩码（Subnet Mask）`\n- `三次握手（3-way\
    \ handshaking）`和\n- `Banner 抓取（Banner Grabbing）`等\n\n此外，高级扫描技术用于强调扫描结果的性能。为了这一点，测试人员可以使用以下技术：\n\
    \n- `匿名代理（Anonymizers）`\n- `代理（Proxies）`\n- `分片（Fragmentation）`\n\n"
