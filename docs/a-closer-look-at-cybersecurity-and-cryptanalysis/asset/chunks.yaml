    women to all the registered people, parents & police. The components present in
    our system are `Raspberry Pi`, `Force Sensor`, `AD Converter`, `GPS`, `Web Application`,
    `SMS Gateway`, and `Database`. The block diagram is shown in Figure 1.


    Figure 1. Block diagram.


    ### 2.2.1 Hardware Components


    #### 2.2.1.1 Raspberry Pi


    Raspberry is a small sized computer that can be connected to a display unit, it
    can be either a computer monitor or projector. It can perform anything that you
    expect from a desktop computer to do.


    #### 2.2.1.2 GPS


    `GPS` [5] is an navigation based system that is used to determine the current
    position of an object in terms of latitude and longitude. There are 24 satellites
    deployed in space which surrounds the earth. This satellite broadcasts the position
    of an object. `GPS` uses a triangulation process to obtain the exact position
    of an object. The `GPS` module is connected to `Raspberry Pi` through `GPIO` pins.


    *Smart IoT Device for Women Safety* 93


    ### 2.2.1.3 Force Sensor


    The `Force Sensor` material resistance varies when any force or stress is applied
    on it. The conductive polymer is responsible for changing the resistance inside
    the material. The `Force sensor` is connected to a digital convertor which in
    turn the digital converter is connected to `Raspberry Pi` `GPIO` pins.


    #### 2.2.1.4 AD Convertor


    Basically the input from the force sensor is an analog signal. So in order to
    convert it into digital signal we use `Analog to Digital converter`. It takes
    `Analog` signal as input from force sensor and sends digital signal as output
    to `Raspberry Pi`.


    ### 2.2.2 Software Components


    #### 2.2.2.1 Web Server


    `UwAmp` is a free web server that can be installed on a local PC.


    `UmAmp` has the following components such as `Apache`, `MySql`, `PHP` and `SQLite`.
    We have to start the server if we want to work. After starting the web server
    we can add any web pages. The local database stores the details of the registered
    people.


    #### 2.2.2.2 SMS Gateway


    `SMS Gateway` is used to dispatch multiple messages to several people from a web
    browser. It can also provide international messaging service gateway with roaming
    facility.


    #### 2.2.2.3 Python


    `Python` programming language is used as an interface between `Raspberry Pi`,
    Sensors and `Database`. `Python` is a flexible programming language with short
    code and it has multiple libraries. The interaction with Sensors and `Raspberry
    Pi` is easy with `python` programming language.


