    现在我们需要计算 `a` 的模逆。


    让我们通过在线资源找到它。


    我们得到 `a` (15) 的模逆是 7。


    解密过程为：


    `7(23-19) mod 26 = 2`

    `7(14-19) mod 26 = 17`

    `7(15-19) mod 26 = 24`

    `7(10-19) mod 26 = 15`

    `7(18-19) mod 26 = 19`


    恢复的明文如下：


    2 17

    24

    15

    19 - 生成的数值


    C R

    Y

    P

    T - 恢复的明文。


