    ## 摘要


    互联网正迫使组织进入一个开放且信任的通信时代。这种同步的开放性带来了大量的漏洞和问题，如资金损失、声誉损害、维护服务、保护隐私和客户信息以及许多其他，迫使每家企业和服务供应商希望采取措施保护其价值数据免受入侵者、黑客和内部人员的侵害。入侵检测系统已成为内容网络的基本需求。


    * 通作者邮箱：`nallagatlaraghavendra@kluniversity.in`.


    ![Image 100](img/index-86_1.png)


    74


    *N. Raghavendra Sai*


    `IDS` 提供两个主要优势：可见性和管理。正是这两种优势的结合使其能够形成并执行企业安全策略，以确保非公开电子网络的安全 [1]。可见性是检查和理解网络特征的活性，而管理对于执行安全策略至关重要。


    **关键词**：`IDS`，可见性，分类


    ## 1. 入侵检测体系


    入侵检测系统用于定位标准防火墙无法识别的所有恶意框架活动。它记录针对应用程序的攻击（例如未经授权的登录和对敏感报告的访问）以及恶意软件（病毒、蠕虫）。IDS
    配置所示。


    图 1. IDS 架构。


    *一种分析方法*


    ## 1.1 用于 IDS 的数据挖掘


    数据挖掘是从海量信息文件中发现奇奇数据的过程。基本上，更准确地说，该术语指的是在一个考虑了估计、人工智能、`AI`、数据库科学和数据恢复等先进技术的系统中
    [2]。在这里，数据处理的某些特定事项可以被添加到一个可识别的干扰结构中：


    * 从告警数据中移除常规开发，以允许对真实攻击进行评估。

    * 识别虚假告警生成器和“糟糕”的传感器标记。

    * 发现发现真实攻击的异常活动。

    * 识别长期、一致的模型（不同的 IP 地址，相同的活动）。


    ### 1.1.1 用于 IDS 的数据挖掘技术


