    如 `mount god`、`Panda` 和 `Patra` 所述的观察结果激活了系统可能的混合化。例如，`Benfer cap` 和 `Taiba`（等同于
    `mount god`）通常认为在检查两个三个障碍时，`NB` 比 `DT` 越来越重要 [13]。他们强调了虚假阴性率的问题，这导致他们采取了偏离标准 `ID`
    和滥用区域的杂杂行动方案，允许特征泄露模块损害了标准开发。


    泰晤士河完成了一个从半半无差异化的说明，在标准模型上建立了一个`自组织映射`（`SOM`），将其作为中心级别的中断标识符。在后续层中，`NB` 将其策略与`吉尔吉斯斯坦货币相关单位`相结合。这种半半结构使得二极管比单独滥用
    `NB` 具有更高的请求率。


    *一种检查性能的分析方法……*


    87


    ### 结论


    本章解释了用于 `IDS` 网络不同分类器性能的分析方法。我们在本章中讨论了 `IDS` 中使用的各种数据挖掘技术和算法。确定了 `Network` 系统必须受到所有类型攻击的保护。文献中可用的用于
    `IDS` 的大多数数据挖掘技术显示出识别特定类攻击的独特倾向，同时在处理其他类攻击时表现良好且具有更高的精确度。


    * 本章介绍了用于 `IDS` 的入侵检测架构和数据挖掘。

    * 许多研究是使用预测模型进行的，如`决策树`、`SVM`、`模糊逻辑`、`贝叶斯网络`、`K-最近邻`、`K-means 聚类`、`遗传算法`，本章介绍了这些模型的优缺点。

    * 在大多数研究中，仅将检测率视为有效评估 `IDS` 的性能指标，这是是不够的。对于高效的 `IDS`，应该有一个两个或多个分类器的混合组合，以获得更好的结果。

    * 大多数 `IDS` 通过几乎预测大多数类样本来生成模型。这导致少数类的错误率高于`多数类样本`。


