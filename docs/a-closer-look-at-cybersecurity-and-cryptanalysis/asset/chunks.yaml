    ## 1. INTRODUCTION


    Today’s era is known as an era of machine and technology. To empower society in
    an efficient and effective way every nation is focusing to achieve digitalization.
    Smart electronic devices have made our life easy and comfortable. Digitization
    is completely dealing with data. In different forms data is shared everywhere.
    Sometimes data is very sensitive and can be misused by anyone. Indeed companies
    and organizations should make sure when the government, military, banking, and
    other organizations work with data, it must be taken well care by using some techniques.
    This is where `Cyber security` plays an important role.


    According to `NIST` (National Institute of Standards and Technology), Cyber Security
    is the protection of assets from unauthorized activities in order to ensure confidentiality,
    integrity, and availability. These three concepts are known as `CIA`.


    The main goal of cyber security mechanisms is to support `CIA` by using the latest
    technologies.


    According to `NIST`, cyber security framework consists of five components as shown
    in Figure 1.


    The number of cybercrimes are vastly increasing. It can also be termed as `Information
    Technology Security`. The main reason behind the cybercrimes is extreme usage
    of technology and the lack of advanced techniques to protect data and the legitimate
    user. In this case,


