    **ABSTRACT**


    There are number of techniques and tools available to list the vulnerabilities
    present in the remote host. Vulnerability assessment plays an important role in
    securing the organizations network system. The Nessus vulnerability scanner is
    the world-leader in active scanners, featuring high-speed discovery, configuration
    auditing, and asset profiling, sensitive data discovery and vulnerability analysis
    of our security posture. Nessus have the capability to discover the state of port
    and also it detects the flaws on particular system with a recommended solution
    to fix it. Nessus can import scan results done by another tools like Nmap etc.
    and perform vulnerability scan accordingly. It makes the top managements work
    easier for network security.


    **Keywords**: sensitive data, vulnerability assessment, Nessus tool, Nmap


    50


    *Ch. Rupa*


    **1\. INTRODUCTION**


    Nessus Tool uses to evaluate vulnerability assement based on certain attributes.
    The following steps show that functioning of the tool.


     Nessus is a network vulnerability scanner developed by Tenable Network Security.
    It is free of charge for personal use in a non-enterprise environment.


     It searches map systems for weakness in application, computer or their network.
    It identifies both internal and external network scan.


     Internal scan means scanning is performed within a particular router. External
    scan means scanning involves the hosts outside the particular router or a remote
    host. Nessus has the capability to multiple scanning of the hosts at a same time.


     The main advantage is that Nessus makes no assumptions for what services are
    running on what ports and it actively attempts to exploit identifies vulnerabilities.


     Nessus is based on client-server architecture. Each session is controlled by
    the client and the test is run on the server side.


    Nessus allows scans for the following types of vulnerabilities:


     Vulnerabilities that allow a remote hacker to control or access sensitive data
    on a system.


     Misconfiguration (e.g., open mail relay, missing patches, etc.).


     Default passwords, a few common passwords, and blank/absent passwords on some
    system accounts. Nessus can also call Hydra (an external tool) to launch a dictionary
    attack.


     Denials of service against the TCP/IP stack by using malformed packets.


     Preparation for PCI DSS audits.


