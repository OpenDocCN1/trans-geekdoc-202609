    RSA 是一种自 1978 年以来一直广泛使用的流行加密系统。它是一种非对称算法，其安全性依赖于大数的因数分解。由于这个原因，RSA 的破解分析需要更长时间，甚至数月或数年。通过使用先进的分布式环境或某些机器学习方案，可以在复杂的时间内完成这种破解分析。Vikrant
    等人 \[9\] 通过在分布式环境中分担破解分析负载，对任意长度的 RSA 算法进行了破解分析。他们证明了使用足够的资源将缩短破解分析时间。在他们的工作中，他们在分布式网络上使用了
    `Quadratic Sieve Factorization Algorithm` 来缩短破解分析时间。在这项工作中，他们使用了 `aglets`，这些 Java
    移动代理，负责以分布式方式寻找给定 `n` 值的因数。这些 aglets 允许通过传递消息进行相互通信。在所提出的框架中，通过 `aglets` 的实际实现以分布式方式执行
    `Quadratic Sieve Algorithm`（`QSA`）。破解分析的过程如图 \[9\] 所示。


    使用单一系统进行 RSA 的破解分析是不现实的。


    在分布式环境中使用移动代理共享因数分解任务


    ![Image 6](img/index-37_1.png)


    *破解分析技术的演进*


    25


    分布式环境将减少破解分析所需的处理时间。


    该系统可以破解任何大小密钥的 RSA。增加系统的数量可以减少破解分析任务的时间。


    图 1. 使用 `QSA` 对 RSA 进行破解分析。


    破解分析结果如下表所示。


    **表 1. 破解分析性能 \[9\]**


    | N 的值 | p | q | 系统数量 | 时间（秒） |

    | :--- | :--- | :--- | :--- | :--- |

    | 1 | 0 | 16843009 | 257 | 65537 |

    | 2 | 0 | 1 | 10 | 803043445985819358 |

    | 2 | 7 | 3 | 5 | 1 | 115 | 123712084919325309380291 |

    | 2 | 74 | 3 | 50 | |


    使用云环境结合机器学习方案将在短时间内实现破解分析任务的自动化。这些先进方案可以用于使加密系统比现有系统更强大。


    26


    *Mohammad Sirajuddin 和 Ande Prasad*


    ## 2.3. 神经破解分析


    如今，神经网络概念在大多数应用中都变得突出。它们不仅被用于数据分析任务，还被应用于破解分析过程中。人工神经网络可以用于自动化破解分析任务。这有助于破解分析人员确定所用加密系统的弱性。


    Riccardo Focardi 等人提出了一种威胁模型来确定经典密码的缺陷 \[6\]。他们通过内省密文的统计结构完成了对这些密码的破解分析。通过提供带有密钥的统计特征，对神经网络进行了训练。在这些数据的帮助下，神经网络可以从给定的密文中预测出密钥。所提出的模型实现了现代密码的自动化破解分析。


    ### i. 凯撒密码的破解分析


    本节解释了如何通过向模型提供密文字母的相对频率来训练神经网络以恢复密钥。在模型模型中，测量密文字符的频率并获取频率直方图。获取的这个直方图是明文直方图的循环位移。据此分析得出，不需要暴力破解法，而是可以训练神经网络来确定频率直方图的相对位移。所遵循的方法由以下步骤表示
    \[6\]。


    a. 考虑使用随机密钥加密的大型英语明文数据集。


    *破解分析技术的演进* 27


    b. 计算密文中每个字母的频率。


    c. 通过将频率作为输入、相应的密钥作为输出对神经网络进行训练。


    d. 在各种独立数据集上对网络进行测试。


    ### ii. 替换密码的神经破解分析


    替换密码涉及将明文中的每个字母替换为另一个。通常，密钥被视为字符的排列。在这种情况下，维护了 `n-grams` 统计数据。从攻击者的角度来看，这一属性是非常重要的，并且它为攻击提供了基础。


    可以使用神经网络来验证替换密码的弱性。Riccardo Focardi 等人使用基于 `n-grams` 的神经网络来内省给定文本与英语文本有多远，从而提供了应用更好替换的可能性，例如交换两个字符
    \[6\]。此外，还需要 `n-grams` 来定义一个评分函数，以指定给定密钥的质量（即给定密钥有多好），并允许通过随机交换寻找更好的密钥。该模型使用了以下步骤。


    a. 考虑一个使用随机密钥加密的英语明文大数据集。


    b. 确定明文和密文中 `n-grams` 的频率。


    c. 通过将频率作为输入、单比特输出对神经网络进行训练：输入为明文时输出为 `1`，输入为密文时输出为 `0`。


    d. 在独立数据集上测试神经网络。


    他们还考虑了一种攻击策略，即选取随机密钥，解密密文并使用神经网络估计获得的明文与英语（以及与目标明文）有多接近。该策略通过交换随机字母来寻找合适的明文。如果神经网络产生了更好的分数，则考虑新密钥，否则再次进行随机交换。


    28


    *Mohammad Sirajuddin 和 Ande Prasad*


    使用优度值（Goodness value）来确定新密钥有多好。通过这种方式，神经网络可以实现破解攻击的部分自动化。


    ## 2.4. 基于 AI 的破解分析


    如今，人工智能（`AI`）是各个领域用于自动化和分析任务的主流技术。在本节中，回顾了一些基于 AI 技术的破解分析方案。研究已通过机器学习算法实现了破解分析任务的自动化。使用机器学习算法不仅可以确定加密系统的弱性，还有助于开发强加密系统以确保高水平的安全性。


    Shaligram Prajapat 等利用 AI 技术阐述了密码挖掘的概念 \[1\] \[3\]。他们解释了一种支持 AI 的加密系统，它可以接收密文并产生相应的明文。该方案适用于破解分析意图从密文中获取明文的情况。Shaligram
    Prajapat 等人提出的 AI 破解分析方案用于替换密码 \[1\] \[3\]。从密文生成明文的问题属于不可解决问题的分类。在推荐的系统中，使用了一个知识库，其中包括语法规则、拼写、元音、辅音等，以及从给定密文中生成可能的意义明文组合的规则。该知识库用于从
    `n-gram=1` 开始按迭代迭代方式执行替换。还采用了模式匹配概念来生成合适的三个单词字母。推荐的破解分析过程如图 2 所示。


    ![Image 7](img/index-41_1.png)


    *破解分析技术的演进*


    29


    图 2. 破解分析的过程。


    在图 2 中，破解分析人员将密文作为输入给出破解分析过程，该过程反过来将密文交给知识库，然后针对给定的密文执行各种程序以获取意义明文。获得的明文是推荐破解方案的输出
    \[1, 3\]。


    ### 局限性：


    a. 仅适用于替换密码和置换密码。


