    thereto of the `Kyrgyzstani money related unit`. This half and half structure
    semiconductor diodes to raised solicitation rates than misuse `NB` alone.


    *An Analytical Approach for Checking the Performance …*


    87


    ### CONCLUSION


    This chapter explains about the analytical Approach for Checking the Performance
    of Different Classifiers in Networks for `IDS`. We have discussed in this chapter
    about various data mining techniques and algorithms used in `IDS`. It is determined
    that the `Network` system has to be secured from all types of attacks. Most of
    the Data mining techniques for `IDS` accessible in the writing demonstrate one
    of a kind inclinations for identifying a specific class of assault with enhanced
    precision while performing respectably for alternate classes of assaults.


    * The Chapter presents the Intrusion Detection Architecture and Data mining used
    in `IDS`.

    * Many research works are carried out using predictive models like `Decision trees`,
    `SVM`, `Fuzzy logic`, `Bayesian Networks`, `K-nearest Neighbour`, `K-means clustering`,
    `genetic algorithms` advantages, and disadvantages are presented in this chapter.
    own* In most researches, the detection rate alone was taken as the performance
    metrics for the effective evaluation of `IDS` which is not enough. For efficient
    `IDS` there should be a hybrid combination of two or more classifiers which gives
    better results.

    * Most of the `IDS` generate a model by almost predicting the majority class.
    This results in a higher error rate for the minority class than the `Majority
    class`.


