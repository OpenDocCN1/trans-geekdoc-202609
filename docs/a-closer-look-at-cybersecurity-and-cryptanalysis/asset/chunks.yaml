    *Role of Penetration Testing in Security Analysis* 39


    (Intelligence) used to a better understanding of how a target attacked by unauthorized
    persons and analyzed the possible ways to exploit the identified vulnerabilities.
    At the end of this phase, Figure 2 shows the tools used.


    Figure 2. Reconnaissance Tools.


    | No | Tool | Description |

