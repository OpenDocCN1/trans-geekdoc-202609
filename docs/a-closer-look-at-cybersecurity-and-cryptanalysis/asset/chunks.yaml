    对任何系统设计的最主要攻击是暴力破解攻击。它也被试错法；主要用于破解密码、ATM 口码（Pins）。


    20 世纪超级计算机的演进对密码的深度分析起了重要作用。表 1 显示了给定密钥长度的攻击时间分段。


    **表 1. 密钥长度与攻击时间 [5]**


    | 密钥长度（位） | 可能生成的密钥数量 | 攻击时间 |

    | :--- | :--- | :--- |

    | 56 | `7.2 * 10⁶` | 20 小时 |

    | 80 | `1.2 * 10²⁴` | 54,800 年 |

    | 128 | `3.4 * 10³⁸` | `1.5 * 10¹⁹` 年 |

    | 256 | `1.15 * 10⁷⁷` | `5.2 * 10⁵⁷` 年 |


    从上表可以得出，随着密钥长度的增加，攻击时间随之增加。


    ### 侧信道攻击

    在这种类型中，攻击之所以可能是因为逆向工程程序。


    当算法运行时，攻击者充当理想的观察者，他们记录每一个细微的信息，例如算法运行的系统细节、所需的时间以及发射的电磁辐射、功耗。


    ![Image 5](img/index-26_1.png)


    `SCA` [19] 成本很低。


    ### 延性攻击

    在延性攻击 [3]期间，密文被转换成这种方式，使其可以解密为另一个明文。攻击者的目标不是确定密钥；他的目标是描述密码系统的失效。即使密钥流是由安全系统产生的，它也可能失效。图
    2 描述了延性攻击。它主要发生在银行密码系统中。


    图 2. 描述延性攻击 [3]。


    ### 生日攻击

    上述讨论的所有攻击都是针对加密算法的，但生日攻击与它们不同，它是针对哈希算法的。


    我们知道没有两个消息具有相同的消息摘要，这是哈希算法的独特属性。生日攻击认为，从两个相似但不同的输入值中可以提取出相似的消息摘要。应该实现强哈希函数来抵抗生日攻击。


    这与生日名字相比是相当合理的，因为例如考虑一个教室，有两个不同学生在同一天出生的概率。


    ### 分治攻击

    在这种情况下，问题被分成更小的部分，以减少计算问题的解决机制。因此，攻击者实施这种方法并分解密文的复杂度。在计算机科学中，分治算法用于优化到更小的部分以获得收益。


    ### 相关性攻击

    相关性攻击 [3, 12] 仅在密文存在缺陷时发生。我们可以通过一些数学解释很容易地识别出 `key`。受到这种攻击的算法是统计偏向加密。


    ### 猜测与确定攻击

    流密码具有密钥流并输入明文，但这种攻击利用了只有少数内部位作为输入到过滤函数的这一。


    因此，只有这些值决定了计算出的密钥流位，因此可以通过消除法、随机化等各种方法猜测密钥值。


    ### 功耗分析

    功耗分析是攻击的形式，攻击者观察加密硬件的功耗。功耗分析有两种：一种是简单功耗分析 [19]，另一种是更先进的差分功耗分析 [19]。功耗分析是侧信道攻击的一个例子。


    ### 某些通用密码分析攻击

    某些加密算法非常复杂，它们包含许多轮逻辑。因此，攻击者关注每个逻辑，并检查轮逻辑后释放的每个测试块，以提取原始密钥长度和密钥值。在某些过滤函数轮逻辑中，只有少数输入流位参与了加密。因此，攻击者利用此为优势获取密钥值并破坏系统。


    ### 建议策略

    为了克服密码分析攻击或对抗攻击，建议采取以下策略：


    1. **混沌加密算法**：在这里，算法天生具有状态，可以在攻击者的脑中制造混乱。有些基于图像加密机制的混沌 [2] 加。

    2. **健壮协议**：大多数攻击发生在传输过程中。

    3. **密钥大小**：增加密钥大小增加了复杂度。

    4. **防止侧信道攻击**：减少侧信道的泄露。

    5. **使用数字签名交换密钥**：密钥交换是密码学中的一个重要因素。

    6. **多密钥使用**：多个密钥的使用增加了攻击难度。

    7. **安全硬件**：安全硬件意味着强设计。


    ### 结论

    量子计算机和超级计算机的演进促进了快速处理的密码分析，因为这些系统使用更短的时间预测密钥值。使用像 `shor’s` [13] 算法可以在多项式时间内对大密钥数进行分解，这会影响通常使用的非对称密钥加密。通过使用
    `grovers’s` [14] 算法，我们可以在量子计算机中以平方倍快的速度找到暴力破解密钥值。然而，可以通过双倍密钥长度来应对。


    为了防止其中一些密码分析攻击，我们可以对密钥交换计算加密哈希，并使用数字签名 [15] 算法对其签名并发送给对方，然后接收方用本地计算的哈希验证哈希，以查看两个哈希是否匹配以及签名是否来自指定的对方。如果不匹配，则就是伪装攻击。


    尽管受到密码分析的各种影响，但它是高效的，因为它帮助我们提高制造新健壮算法的标准。


