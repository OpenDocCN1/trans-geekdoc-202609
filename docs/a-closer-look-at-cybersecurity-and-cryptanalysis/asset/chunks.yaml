    -   以及 [5] 压力开关。每当开关被按下时，当前位置就会发送给紧急联系人。目前设备的缺点是医疗相关的传感器给出的结果不准确。每当女性遇到任何事故时，心率会上升，即使没有问题，位置也会被发送给父母。假设受害者距离警察局和父母很远，他们就无法在规定时间内到达现场。感知到女性受虐待和骚扰的消息后，许多人觉得如果他们在现场，可以轻松地救女孩。因此，我们提出了一个想法，可以由准备好救援女性的人切实确保女性的安全。我们首次开发了一个
    `Raspberry Pi` 系统，它可以向所有注册人员提供受害者的位置。


    ## 2.2 建议的方法论


    我们创建了一个切实确保女性安全的 IoT 设备。如果女性遇到任何问题，她只需按下压力传感器，`Raspberry Pi` 系统就会将女性的当前位置发送


    ![Image 102](img/index-104_1.png)


    92


    *Ch. Padmini, G. Brahma Reddy, K. Chaitanya Sai 等人*


    发送给所有注册人员、父母和警察。我们系统中存在的组件有 `Raspberry Pi`、`Force Sensor`、`AD Converter`、`GPS`、`Web
    Application`、`SMS Gateway` 和 `Database`。框图如图 1 所示。


    图 1。框图。


    ### 2.2.1 硬件组件


    #### 2.2.1.1 Raspberry Pi


    Raspberry 是一种小型计算机，可以连接到显示单元，可以是电脑显示器或投影仪。它可以执行任何你期望台式电脑可以完成的任务。


    #### 2.2.1.2 GPS


    `GPS` [5] 是一种基于导航的系统，用于根据纬度确定对象的当前位置。空间中部署了 24 颗环绕地球的卫星。卫星广播物体的位置。`GPS` 使用三角测量法获取对象的精确位置。`GPS`
    模块通过 `GPIO` 引脚连接到 `Raspberry Pi`。


    *女性安全智能 IoT 设备* 93


    ### 2.2.1.3 压力传感器


    当对 `Force Sensor` 材料施加任何力或应力时，其电阻会变化。导电聚合物负责改变材料内部的电阻。`Force sensor` 连接到一个数字转换器，而数字转换器连接到
    `Raspberry Pi` 的 `GPIO` 引脚。


    #### 2.2.1.4 AD 转换器


    基本上压力传感器的输入是模拟信号。因此，为了将其数字信号，我们使用 `Analog to Digital converter`。它接收来自传感器的 `Analog`
    信号作为输入，并将数字信号输出给 `Raspberry Pi`。


    ### 2.2.2 软件组件


    #### 2.2.2.1 Web 服务器


    `UwAmp` 是可以安装在本地 PC 免费 Web 服务器。


    `UmAmp` 具有以下组件，如 `Apache`、`MySql`、`PHP` 和 `SQLite`。如果我们想工作，必须启动服务器。启动 Web 服务器后我们可以添加任何网页。本地数据库存储注册人员的详情。


    #### 2.2.2.2 SMS 网关


    `SMS Gateway` 用于从网页浏览器向多人发送多条消息。它还可以提供带有漫游功能的国际短信网关。


    #### 2.2.2.3 Python


    `Python` 编程语言用作 `Raspberry Pi`、传感器和 `Database` 之间的接口。`Python` 是一种灵活的编程语言，代码短且拥有多个库。使用
    `python` 编程语言与传感器和 `Raspberry Pi` 的交互非常简单。


    ![Image 103](img/index-106_1.jpg)


    94


    *Ch. Padmini, G. Brahma Reddy, K. Chaitanya Sai 等人*


    ## 2.3 流程


    每当 `Raspberry Pi` 系统连接到电源时，操作系统就会加载，并有绿灯闪烁。


    然后，所有连接的组件都将初始化。我们建议系统的流程图如图 2 所示。


    图 2。流程图。


    *女性安全智能 IoT 设备* 95


    ## 2.4 解释


    **步骤 1：** 愿意帮助女性的用户可以通过提供详情信息在网站上轻松注册。详情信息存储在数据库中。


    **步骤 2：** 每当女性遇到任何问题时，她只需按下压力传感器。


    **步骤 3：** 压力传感器的输入被读入 `AD converter` 中，随后发送信号。


    **步骤 4：** `Raspberry Pi` 系统获取注册的号码。


    **步骤 5：** `GPS` 模块获取受害者的当前位置。


    **步骤 6：** 最后 `SMS Gateway` 将受害者的位置发送给所有注册人员。


    ## 3 结果


    通过使用 `VNC Viewer` 我们可以固定 `Raspberry Pi`。每当 `force sensor` 被激活时，它向 `AD converter`
    发送数字信号，然后通过 `GPS` 发送当前位置。如图 3 所示。


    ![Image 104](img/index-108_1.jpg)


    ![Image 105](img/index-108_2.jpg)


    96


    *Ch. Padmini, G. Brahma Reddy, K. Chaitanya Sai 等人*


    图 3。发送当前位置。


    ### 3.1 SMS 输出


    `Raspberry Pi` 系统获取注册号码；随后将受害者的位置发送给注册人员。发送给注册人员的 `SMS` 如图 4 所示。


    图 4。发送给所有人员。


    ## 结论


    本文主要关注女性安全。我们的主题是确保女性的安全，以便她们随时工作。因此，“女性安全智能 IoT 设备” [4] 用于防止针对女性的威胁。它的工作原理是，当压力传感器被激活时，信号传输到
    `Raspberry Pi`，然后它通过 `sms gateway` 结合 GPS 位置发送警报信息。


    ## 参考文献


    [1] Jesoss A., Nikhila Y., 使用 IoT 的女性安全解决方案 *International Journal of Pure and
    Mathematics,* Volume 11912, 2018.


    [2] Krishna Priyanka S., Tatavarthi Tarun, IoT 用于女性安全 *International Journal of
    Advanced Research in Science and Engineering,* Vol.No.6, special issue(01), September
    2017, BVCNSCS2017.


    [3] Budebhai M., 基于 IoT 的儿童和女性安全 *International Journal of Computer Science and
    Mobile Computing*, vol.7, Issue.8, August 2018.


    [4] Harikiran G. C., 基于物联网的女性安全解决方案发表 *International Conference on Electrical,
    Electronics and Optimization Techniques,* March 2016.


    [5] Deepali, 基于无线和 GPS 的女性儿童安全统一方法 *International Journal of Advanced Research
    in Computer Engineering & Technology,* volume 5, Issue 8, August 2016.


    [6] Kavya, 基于 IoT 的女性安全设备 *International Journal of Innovative Research in Science,
    Engineering and Technology,* volume 7, March 2018.

