    *S. Gopi Krishna, Mohammd Sirajuddin 和 S. Suresh Babu* 数字化中网络安全的重要性。我们还解释了人工智能在开发网络安全方案以保护数字世界免受各种攻击方面所起的作用。


    **关键词**：数字化，攻击，基于 AI 的网络安全


    ## 1. 引言


    今天时代被称为机器和技术的时代。为了以高效有效的方式赋能社会，每个国家都致力于实现数字化。智能电子设备让我们的生活变得简单舒适。数字化完全是处理数据。数据以不同的形式在处处共享。有时数据非常敏感，可能会被任何人滥用。事实上，公司和组织应该确保当政府、军方、银行和其他机构与数据工作时，必须通过某些技术进行良好维护。这就是网络安全发挥重要作用的地方。


    根据 `NIST`（美国国家标准与技术研究院），网络安全是保护资产免受未经授权的活动以确保机密性、完整性和可用性。这三个概念被称为 `CIA`。


    网络安全机制的主要目标是通过最新技术支持 `CIA`。


    根据 `NIST`，网络安全框架由五个部分组成，如图 1 所示。


    网络犯罪的数量大幅增加。它也可以称为信息技术安全。网络犯罪背后的主要原因是技术的过度使用以及缺乏保护数据和合法用户的先进技术。在这种情况下


    ![Image 98](img/index-77_1.png)


    65


    *网络安全与人工智能驱动的数字化*


    网络安全是维护数据资产安全的所需的机制。


    ### 1.1. 威胁类型


    根据 [3] 证实，信息安全有几种威胁


    1. `恶意软件`：它是一种有害的程序，会停止整个系统的运行。


    2. `僵尸网络`：它是一种恶意软件。今天僵尸网络已成为最大的安全威胁。僵尸网络由一组相互连接以发起网络犯罪的设备组成。这些互连的设备由主控控制。犯罪分子利用僵尸网络发起
    `DoS`（拒绝服务）攻击。


