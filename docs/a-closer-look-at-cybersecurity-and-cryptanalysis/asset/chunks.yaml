    # 引言


    遗传计算最初出现在计算科学的领域。从那时起，它们在不同的领域中萌发，并取得了广阔的成果 [7]。如今，研究人员尝试将这种算法与入侵检测系统（IDS）结合。1995
    年，Giordana 和 Nerih 利用遗传算法提出了一种名为 `Regal` 的入侵检测算法。`REGAL` 系统依赖于分布的遗传计算。一种适应一阶逻辑多显示表示描述的学习框架是非常伟大的。学习示例存储在关系型数据库中，表示为关系元组。


    Gonzalez 和 Dasgupta 应用了遗传算法，尽管他们研究的是基于主机的 IDS，而不是基于网络的。他们仅将该算法程序用于元学习步骤，而不是直接在特征集上运行该算法。它使用统计分类器来处理标签向量。使用二位二进制编码方法来识别特定特征的异常情况，范围从正常到异常。Chittur
    使用了结合决策树的遗传算法。决策树用于表示数据。他们使用了高检测率，降低了假阳性率。通过在反馈循环中使用人类输入，降低了假阳性的发生。


    ### 关注点

    1. 它解决了每一个优化问题。

    2. 它解决了具有多个解决方案的问题。

    3. 容易迁移到现有模型中。


    ### 缺点

    1. 没有全局最优解。

    2. 没有恒定的优化响应时间。


    ## 1.3. 模型


    ### 1.3.1 人工神经网络 (ANN)

    人工神经网络（`ANN`）是基于大脑神经结构的相对粗糙的电子模型 [5]。大脑主要从其经验中学习。这自然地证明了，某些超出当前计算机范围和领域的问题确实可以通过小型能效的程序包来解决。这种大脑建模是开发机器解决方案的技术方法。这种新的计算方法在系统过载时，比其常见的对应品提供了更优雅的降级性能。


    图 2. 用于 IDS 的神经网络模型。


    神经系统是假神经元的交叉网络，它使用科学模型或计算模型进行数据准备，并采用关联方法处理计算。神经系统最初不包含空间信息；但它倾向于通过将信息集合映射到先验向量并评估其权重来确定选择，从而将每个信息模型向量映射到相关的输出模型向量。


    ### 1.3.2 支持向量机 (SVM)

    `SVM` 方法将数据转换为特征空间 $F$，该空间有时具有极大的度量。值得注意的是，`SVM` 推归依赖于定向信息的几何属性，而不是信息空间的度量值 [6]。


    ### 1.3.3 多变量自适应回归样条 (MARS)

    样条可以被视为处理复杂、硬弯曲插和不确定能力的创新科学过程。`MARS` 模型可以利用回归模型显示能力，将特征作为指标而非事实重复数据。这种能力转换使得通过将某些区域置零来专门消除变量特定区域成为可能，并使
    `MARS` 专注于记录的特定子区域 [8]。它在发现理想变量变化和相互作用方面表现优异，并且可靠地涵盖了高维数据中的复杂关联。


    ### 1.3.4 贝叶斯思维

    贝叶斯思维在这里被认为是一类方法的通用表达式，这些方法试图通过数学家假设来减少不确定性。


    “贝叶斯推理提供了一种概率方法来处理不确定性。它有助于一种观点：兴趣单位测量在偶然上主导了分布，通过对观测数据侧的这些概率进行思考，也可以做出理想的选择 [9]。”在
    IDS 中存在不同的思维假设执行方式。


    #### 1.3.4.1 贝叶斯系统

    最近，推断框架被用于杂交结构的调用过程中 [10]。推断框架提供了一种额外的不可见方法来处理这种差异化和挑战，由于直接管理调用部分内部框架输出的连接，狮子提议的方法确保了杂交结构具有很高的预警率。他们提出了一种具有基于区域方法的特殊特征识别系统的混合方法：检查字符串长度、字符传输和结构，并识别学习到的标记，其中使用理论组合来选择权威的输出排列。


    该系统在 `DARPA99` 数据集上实现了，经过差异化，是一种简单的基于边缘的方法 [11]。每种技术（`Bayesian` 和 `edge`）都从区域方法获得了模糊输出。在
    100% 准确的情况下，基于边缘的通用方法根据推断器会导致几个假阳性点。


    理解了模糊表示技术，它们获得了改进的区分率。它们共同练习计算机硬件堆栈，因为 IDS 不应该占用过多的优势，否则它会阻止客户及时处理恶意行为。


    在实验中，计算机硬件堆栈保持在较低水平。通过权重测试，计算机硬件堆栈的增加在正常值的百分二之间。


    ### 1.3.5 朴素贝叶斯

    朴素贝叶斯（`NB`）也可以推断框架的增强变，[12]，它们提供了机器学习限制。理论框架有两个特定的缺点，特别是需要关于有关问题的先验数据来观察变化，该过程在计算上是昂贵的。对于过去，如果可行，可以从训练学习中消除变化，这通过
    `NB` 改进。尽管如此，`NB` 承认数据中的每个决策都与每个选择相互独立，这就是为什么在数据干扰中使用应用推断框架而不是 `NB` 的原因。然而，`NB`（作为分类器使用）已被一些研究人员有效地与基于协调器的入侵检测联系起来。


    '
