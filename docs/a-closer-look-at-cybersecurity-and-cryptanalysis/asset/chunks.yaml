    ### ii. Neural Cryptanalysis of substitution cipher


    Substitution cipher involves the substitution of each letter in plaintext with
    another. Typically the key is considered as permutation of characters. In this
    `n-grams` statistics are maintained. This property is important from an attacker’s
    point of view and it gives the foundation for an attack.


    A neural network can be employed to verify the weakness of substitution cipher.
    Riccardo Focardi et al. used a neural network based on `n-grams` to introspect
    how far a given text is from an English one, such that it gives a possibility
    of applying better substitution, e.g., swapping of two characters \[6\]. Also,
    `n-grams` are required to define a score function that specifies the quality of
    a given key i.e., how good a given key is and also permits searching for a better
    one through random swaps. The following steps were used in this model.


    a. Considered a big data set of English plaintexts encrypted using random keys.


    b. Determine the frequencies of `n-grams` of both plaintext and ciphertext.


    c. Train the neural network by providing the frequencies as input and one bit
    of output: `1` when the input is plaintext and `0` when the input is ciphertext.


    d. Test the neural network on independent datasets.


    They also considered an attack strategy that picks a random key, decrypts the
    ciphertext and uses the neural network to estimate how close the obtained plaintext
    is to English and, consequently, to the target plaintext. This strategy swaps
    random letters searching for a suitable plaintext. If the neural network produces
    a better score then the new key is considered, otherwise again random swap is
    performed.


    28


    *Mohammad Sirajuddin and Ande Prasad*


    Goodness value is used to determine how better the new key is. In this way, a
    neural network can automate part of the cryptanalytic attack.


    ## 2.4. AI Based Cryptanalysis


    Today, Artificial Intelligence (`AI`) is the predominant technology used everywhere
    for automation and analysis tasks irrespective of domains. In this section, some
    cryptanalysis schemes based on AI techniques are reviewed. Research has been carried
    out in automating the task of cryptanalysis using machine learning algorithms.
    Usage of machine learning algorithms not only determines the weakness of cryptosystem
    but also assists in the development of strong cryptystems to ensure a high level
    of security.


    Shaligram Prajapat et al., illustrated the concept of cryptic mining by employing
    AI techniques \[1\] \[3\]. They explained AI enabled cryptosystem that accepts
    ciphertext and produces the corresponding plaintext. This scheme is recommended
    in a situation where cryptanalysis intends to obtain plaintext from the ciphertext.
    AI enabled cryptanalysis scheme proposed by Shaligram Prajapat et al. used on
    substitution cipher \[1\], \[3\]. The problem of generating plaintext from ciphertext
    comes under the category of intractable problems. In the recommended system a
    knowledge base is used which comprises of grammar related rules, spellings, vowels,
    consonants, etc., and also the rules for generating possible combinations of meaningful
    plaintext from the given ciphertext. This knowledge base is used to perform substitutions
    in iterations `n-grams` wise starting with `n-gram=1`. A pattern matching concept
    is also employed to generate suitable three word letters. The process of recommended
    cryptanalysis is shown in Figure 2 below.


    ![Image 7](index-41_1.png)


    *Evolution of Cryptanalysis Techniques*


    29


    Figure 2. Process of Cryptanalysis.


    In Figure 2, cryptanalyst gives ciphertext as input to the cryptanalysis process
    which in turn gives ciphertext to the knowledge base and then various procedures
    are executed with respect to the given ciphertext to obtain the meaningful plaintext.
    The obtained plaintext is the output of the recommended cryptanalysis scheme \[1,
    3\].


    ### Limitations:


    a. Works only for substitution and transposition ciphers.

