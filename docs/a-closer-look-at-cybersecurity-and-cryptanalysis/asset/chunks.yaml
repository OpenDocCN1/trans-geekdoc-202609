    **Keywords**: cryptanalysis, DNA computing


    ## 1. INTRODUCTION


    Cryptanalysis is the process of determining the decryption scheme without the
    knowledge of the algorithm and the key used. This chapter brings out a discussion
    on the cryptanalysis of various prominent security algorithms. This chapter also
    describes recent cryptanalysis schemes along with future.


    The concept of cryptography plays a vital role in ensuring secure. Due to the
    popularity of machine learning and deep learning, many researchers are developing
    security.


    ## 2. METHODS


    ### 2.1. Cryptanalysis of Block Ciphers


    The design of block ciphers is a well-established research area since its inception.
    This section explains the advances made in the block ciphers.


    Differential analysis is the most prominent attack on block ciphers. This concept
    brought into light by Biham and Shamir around 1990. The main objective of the
    differential analysis is to determine the key based on the differences between
    input and output patterns. In concise, a fixed differential of any plaintext is
    chosen first and then output the differential of the ciphertext, assigning them
    with different keys. By analyzing the ciphertext, the legitimate key can be determined.


    Provable security against differential cryptanalysis can be accomplished by finding
    differential probabilities upper bounded by small value.


    Linear Cryptanalysis comes under known plain text attack. It uses the concept
    of linear approximation between plaintext, ciphertext and the key. Linear approximation
    can be determined as `ciphertext = f(plaintext,key)` where an attempt is made
    to find a linear approximation of f. It uses a chain of XOR operations between
    plaintext and ciphertext bits which are assumed as a linear relationship between
    plaintext, ciphertext and key bits. It is represented as:


    ```

    P[X+…. ++…. ++…. +1+X2...N] ⊕ C[Y1+Y2...YM] = K[K1+K2...KR]

    ```


    where `X,….,,…., 1,X2...N` are plaintext bits and `Y1,Y2...YM` are the ciphertext
    bits.


    Multiple approximation cryptanalysis is an advancement of linear cryptanalysis
    because it reduces plaintext pairs that are needed by the ciphertext.


    We refer hybrid cryptanalysis as the combination of linear and differential cryptanalysis.
    The fundamental idea is:


    a. To determine some linear approximation.

    b. Produce the output differential features pair according to linear approximation
    making the probability of linear expression correlated with existing linear expression
    equal to 1.

    c. Combining the linear approximation with differential properties leads to the
    restoration of some key bits.


    *Integral Cryptanalysis*


    It is applied to block ciphers that employs bijection component. The fundamental
    principle of this attack is to restore the key bits by analyzing the values obtained
    during several rounds of the key transformation.


