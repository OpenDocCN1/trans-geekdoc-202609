    # 摘要

    对于目前大多数开发或正在开发的 `Cryptographic`（加密）算法而言，面临的首要问题是脆弱性。没有任何一种算法或系统可以在完全不受到攻击的情况下存在，因为一切都存在漏洞和缺陷。`cryptanalysis`（密码分析）被认为是通过发现和减少漏洞出现概率来使算法运行的解决方案；另一方面，它也是攻击者攻击系统的有力武器。在本章中，我将解释密码分析的诞生以及各种密码分析技术。


    **关键词**：`Cryptography`（密码学）、`vulnerability`（漏洞）、`glitch`（故障）、`cryptanalysis`（密码分析）。


    # 引言

    Analysis（分析）意味着对元素或结构的详细检查，`cryptography`（密码学）意味着使用代码保护信息的方法，其中 `crypt` 意味着隐藏
    `graphy` 意味着写作。因此，我们使用 `cryptography` 编写代码来隐藏信息。`cryptanalysis` 是通过对代码进行深度检查，发现获取数据中存在的隐藏含义的过程。


    密码分析于 1990 年由 Murphy 提出并获得公众认可。他在对一种名为 `FEAL` 的分组密码进行密码分析的努力而受到认可。该算法由 NTT 的 Akihiro
    Shimizu 和 Shoji Miyaguchi 于 1987 年开发。最初，`FEAL` 密码作为 `DES` 的替代算法。


    Murphy 发现 `FEAL` 密码容易受到各种形式的 `cryptanalysis` 影响，这为发现针对各种分组密码的线性密码分析和差分密码分析开辟了道路。目前，分组密码和如
    `salsa20`、`chacha` 等流密码也面临着密码分析攻击。


    `cryptanalysis` 还包括对前提条件/属性的被动攻击。被动攻击包括监听、监控和传输。被动攻击分为两类：一种是消息内容的泄露，另一种是流量分析。在这两种情况下，消息未被篡改且是加密的；允许可能的攻击者通过观察识别出模式。密码分析被用于信息战应用，例如在不使用密钥的情况下解码密文。


    根据 Diffie 和 Hellman 的观点，“产生密码分析的技能一直偏向于专业人士，但创新，特别是新类型加密系统的设计，主要来自业余爱好者”。因此，每个系统的设计中都存在一个漏洞。


    # 密码分析与各种攻击

    在上一节中，我们已经看到了什么让 `Affine cipher`（仿射密码）变得更弱。让我们接受这一点并向前一步，对 `Affine cipher` 进行密码分析。


    ## 表 1. 仿射密码的密码分析

    | 密钥 | 值 |

    | :--- | :--- |

    | `(x, b)` | 明文恢复 |

    | `(1, 1)` | W O I |

    | `(5, 6)` | N O I R |

    | `(7, 19)` | O T U I |

    | `(15, 20)` | C R Y T |

    | `(11, 19)` | X O D G W |

    | `(1, 1)` | X I F P |


    第一个密钥可能的密钥数量为 `12`。第二个密钥的数量为 `26`。因此可能的密钥对为 `12 * 26 = 312`。对于标准计算机来说，破解变得非常容易（`Brute
    force` 暴力破解）。如果我们假设我们加密的消息是英语，那么字母总数为 `26`。在 `Affine cipher` 中，第一个密钥必须与 `26` 互质。不幸的是，这使得只有
    `12` 个数字与 `26` 互质。因此，`312` 个密钥对对于尝试明文来说范围并不高。如果密码分析师能通过 `brute`（暴力）技术发现明文，那么 `Affine
    cipher` 就会被破解。


    考虑之前的示例 `XOPKS`，它是 `CRYPT` 的密文。我们取形式为 `(x, b)` 的密钥对。这里 `x` 是……（此处原文不完整）……`b` 是……（此处原文不完整）……密码分析在表
    1 所示……（此处原文不完整）提供了最佳结果。


    # 方法

    下面解释了用于攻击的各种方法，涵盖了分组密码、流密码和哈希算法。


    ### 密文攻击攻击

    在这种情况下，攻击者可以利用加密消息进行……（此处原文不完整）……例如考虑消息 `ih` 被加密为 `hi`，类似于 `eyb`。


    ### 已知明文攻击

    在这种情况下，攻击者知道或可以从密文中猜测原始明文……（此处原文不完整）……因此，如果攻击者知道 `xor` 密码，就可以确定密钥。


    ### 选定明文攻击

    在这种情况下，攻击者通过加密明文来确定……（此处原文不完整）……因此，如果攻击者知道 `xor` 密码，就可以确定密钥。


    ### 选定密文攻击

    在这种情况下，攻击者将对流量进行深度分析并捕获/选择某些密文，他计划对其解密。通过观察选定的密文，他能够追踪到选定的明文密钥。


    ### 中人攻击

    在这种情况下，通过通道通信的双方认为它是安全的，但攻击者入侵了一个可行的攻击的位置，如下图 1 所示，alice 的消息可以被 Mallory 看到、修改和破坏，直到到达
    bob。在 във `MITM` 攻击中，攻击者是中间人，但终端双方都不知道这一现实，他们将其定位为自己之间的密钥交换官。攻击者与双方进行密钥交换。MITM
    攻击主要针对公钥密码学。


    ### 暴力破解攻击

    密码分析的目标是提供一种评估加密脆弱性的方法。……（此处原文不完整）……由于 `xor` 密码，由于参数可能随算法而异，但它提供了大量的知识来发现漏洞。


    # 结论

    所有加密都是脆弱的，只是尚未被发现。密码分析的目标是提供一种评估加密脆弱性的方法。……（此处原文不完整）……它就会被破解。


