    # 伪装


    在该阶段结束时，测试人员可以通过了解开放端口列表和运行服务器信息来理解系统的漏洞，这些信息是进一步利用所需的，如图 3 所示。


    图 3. 侦察状态图。


    表 2 显示了用于端口扫描和漏洞扫描的各种示例活动工具。


    表 2 扫描活动工具


    | 序号 | 活动 | 工具 | 描述 |

    | :--- | :--- | :--- | :--- |

    | 1. | 端口扫描 | `Nmap` | 查找端口是开放还是关闭 |

    | 2. | 端口扫描 | `Zenmap` | 用于了解端口状态的图形界面工具 |

    | 3. | 漏洞 | `Nessus` | 用于调查服务器扫描中的弱性 |

    | 4. | 漏洞 | `Nexpose` | 漏洞扫描器 |

    | 5. | Web 服务器 | `Nikto` | 这是一个开源工具，提供网站的测试扫描报告。它对网站进行约 6000 次测试。 |

    | 6. | Web 应用程序 | `OWASP` | 指开放 Web 应用程序安全项目。这是一个为计算机和基于互联网的应用提供扫描报告的组织。 |

    | 7. | 端口扫描 | `Hping`, `Fin Scan`, `Null Scan`, `Xmas Scan` | TCP/IP 数据包分析器 |


    # 获取访问


    测试人员将尝试通过扫描阶段的报告利用已识别的漏洞。为此，他们可能依赖许多 Web 应用程序攻击，例如 SQL 注入攻击、`XSS`（跨站脚本）攻击、缓冲区溢出攻击、会话劫持等。这些可以为测试人员（作为攻击者）窃取数据以及中断网络和
    DOS 攻击（拒绝服务）等提供支持。例如，2016 年的 Dyn 网络攻击导致中间设备的主要互联网服务不可用。这是一次分布式拒绝服务（`DDOS`）攻击。下一次重大攻击是
    2017 年的 WannaCry 勒索软件攻击，目标是基于 Microsoft Windows 操作系统的计算机。它加密了数据并要求使用加密货币支付以释放用于解密的密钥。


