    The primary attack on any system design is a brute force attack. It is also called
    a trial and error method; it is mostly used to crack the passwords, Atm Pins.


    The evolution of supercomputer in the 20th century plays a major role in the deep
    analysis of secret codes. The table-1 shows the attacking time slabs for a given
    length of the key.


    **Table 1. Length of key vs. attack time [5]**


    | Length of a key in bits | Possible no. of keys can be generated | Attacking
    time |

    | :--- | :--- | :--- |

    | 56 | `7.2 * 10^6` | 20 hours |

    | 80 | `1.2 * 10^24` | 54,800 years |

    | 128 | `3.4 * 10^38` | `1.5 * 10^19` years |

    | 256 | `1.15 * 10^77` | `5.2 * 10^57` years |


    With the increase in the key length, the increase in the attack time can be concluded
    from the above table.


    ### Side-Channel Attack

    In this type, attacks are possible because of reverse engineering procedures.


    Attackers act as an ideal person when the algorithm is working, they make note
    of every minute information like the details of the system in which the algorithms
    run, the time it has taken, and the number of electromagnetic radiations emitted,
    power consumption.


    ![Image 5](index-26_1.png)


    `SCA` [19] are inexpensive.


    ### Malleability Attack

    During malleability [3] attack, the ciphertext is transformed into such a way
    that it can be deciphered into another plaintext. The target of the attacker is
    not determining the key; his target is to describe the failure of the cryptosystem.
    Even though keystream is produced by a secure system, it can also fail. The Figure
    2 below describes the Malleability attack. It mostly occurs in bank cryptosystems.


    Figure 2. Describing the malleability attack [3].


    ### Birthday Attack

    All the attacks discussed above are on encryption algorithms but birthday attack
    is different from them, it is an attack against hashing algorithms.


    We know that no two messages have the same message digest, it is a unique property
    of hashing algorithms. Birthday attacks say similar message digest can be extracted
    from two similar inputs but with not the same inputs. A strong hash function should
    be implemented to resist a birthday attack.


    It is quiet compared to birthday name because for example consider a classroom
    there is a chance of two different students born on same day.


    ### Divide and Conquer Attack

    In this case, the problem is divided into smaller parts to reduce the computation
    problem-solving mechanism. Hence, attackers implement this method and divide ciphertext
    complexity. In computer science, divide and conquer algorithm is used to optimize
    into the smaller parts to obtain the benefits.


    ### Correlation Attack

    Correlation [3, 12] attack occurs only when there is a weakness in the ciphertext.
    We can identify the `key` easily by using some mathematical interpretations. And
    the algorithm which is attacked by this attack is statistically biased encryption.


    ### Guess and Determine Attack

    Stream cipher has key Stream to input plain text but this attack abuses the fact
    that only a few internal bits are given as input to the filtered function.


    Therefore, only these values determine the computed keystream bit, and consequently,
    there is a chance of guessing the key value by various methods like elimination,
    randomization, etc.


    ### Power Analysis Attack

    Power analysis is a form of attack in which the attacker observes the power consumption
    of cryptographic hardware. Power analysis are of two types; one is simple power
    analysis [19] and the other is differential power analysis [19], which is more
    advanced. Power analysis is an example of a side-channel attack.


    ### Some General Cryptanalysis Attacks

    Some cryptographic algorithms are complex, they include many round logics. Therefore,
    the attacker attends to each logic and examines every test block that is released
    after the round logic is to extract the original key length and key value. In
    some filtered function round logics, only a few input stream bits have taken part
    in encryption. Thus, attackers take this as an advantage to obtain the key-value
    and destroy the system.


    ### RECOMMENDED STRATEGY

    To overcome the cryptanalysis attacks or to counter the attacks following strategies
    are suggested.


    1. **Chaotic encryption algorithms**: Here the algorithms are born with a state
    to create confusion in attackers'' minds. Some chaotic [2] encryption based on
    image encryption mechanism.

    2. **Robust protocols**: Most of attacks occur in transmission.

    3. **Key size**: Increasing key size creates complexity.

    4. **Prevention of side-channel attacks**: Reducing release of side-channel.

    5. **Digital signature usage for key exchange**: Key exchange is an important
    factor in cryptography.

    6. **Multiple keys usage**: Usage of multiple keys increases difficulty to attack.

    7. **Secure hardware usage**: Secure hardware means strong design.


    ### CONCLUSION

    Evolution of quantum computers and supercomputers encouraged cryptanalysis for
    fast processing because these systems use less time to predicate the key value.
    Usage of algorithms like `shor’s` [13] will factor large key numbers in polynomial
    time, it effects breaking generally used asymmetric key encryption. By using `grovers’s`
    [14] algorithm we can find brute-force key-value quadratically faster in a quantum
    computer. However, this could be countered by doubling the key length.


    To prevent some of these cryptanalysis attacks we can compute a cryptographic
    hash of the key exchange and sign it with digital signature [15] algorithm and
    send it to the other side, then the receiver verifies the hash with locally computed
    hash to see if both hashes match and the signature came from desired other party.
    If they don''t match, it is masquerade attack.


    Even though having various effects from cryptanalysis, it is efficient because
    it helps us improve our standard in making new robust algorithms.


    **REFERENCES**


    [1] Wagstaff, Samuel S. Jr., Dept. of Maths and Statistics “*Cryptanalysis of
    number theoretic ciphers*”, version 6, 2019, https://doi.org/10.1201/9781315275765.


    [2] L. Chen, J. Chen, G. Zhao and S. Wang, “Cryptanalysis and Improvement of a
    Chaos-Based Watermarking Scheme,” in *IEEE* *Access*, vol. 7, pp. 97549-97565,
    2019.

