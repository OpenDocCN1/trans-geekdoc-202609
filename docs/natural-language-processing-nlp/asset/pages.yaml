  md: "To predict a label from a bag-of-words, we can assign a score to each word\
    \ in the vocabulary, measuring the compatibility with the label. For example,\
    \ for the label FICTION, we might assign a positive score to the word *whale*,\
    \ and a negative score to the word *molybdenum*. These scores are called **weights**,\
    \ and they are arranged in a column vector $\\boldsymbol{\\theta}$.\n\nSuppose\
    \ that you want a multiclass classifier, where $K \\triangleq |\\mathcal{Y}| >\
    \ 2$. For example, you might want to classify news stories about sports, celebrities,\
    \ music, and business. The goal is to predict a label $\\hat{y}$, given the bag\
    \ of words $\\boldsymbol{x}$, using the weights $\\boldsymbol{\\theta}$. For each\
    \ label $y \\in \\mathcal{Y}$, we compute a score $\\Psi(\\boldsymbol{x}, y)$,\
    \ which is a scalar measure of the compatibility between the bag-of-words $\\\
    boldsymbol{x}$ and the label $y$. In a linear bag-of-words classifier, this score\
    \ is the vector inner product between the weights $\\boldsymbol{\\theta}$ and\
    \ the output of a **feature function** $\\boldsymbol{f}(\\boldsymbol{x}, y)$,\
    \ \n\n$$\\Psi(\\boldsymbol{x}, y) = \\boldsymbol{\\theta} \\cdot \\boldsymbol{f}(\\\
    boldsymbol{x}, y) = \\sum_{j} \\theta_j f_j(\\boldsymbol{x}, y). \\tag{2.1}$$\n\
    \nAs the notation suggests, $\\boldsymbol{f}$ is a function of two arguments,\
    \ the word counts $\\boldsymbol{x}$ and the label $y$, and it returns a vector\
    \ output. For example, given arguments $\\boldsymbol{x}$ and $y$, element $j$\
    \ of this feature vector might be,\n\n$$f_j(\\boldsymbol{x}, y) = \\begin{cases}\
    \ x_{\\textit{whale}}, & \\text{if } y = \\text{FICTION} \\\\ 0, & \\text{otherwise}\
    \ \\end{cases} \\tag{2.2}$$\n\nThis function returns the count of the word *whale*\
    \ if the label is FICTION, and it returns zero otherwise. The index $j$ depends\
    \ on the position of *whale* in the vocabulary, and of FICTION in the set of possible\
    \ labels. The corresponding weight $\\theta_j$ then scores the compatibility of\
    \ the word *whale* with the label FICTION.$^{1}$ A positive score means that this\
    \ word makes the label more likely.\n\nThe output of the feature function can\
    \ be formalized as a vector:\n\n$$\\boldsymbol{f}(\\boldsymbol{x}, y = 1) = \\\
    begin{bmatrix} \\boldsymbol{x}; 0; 0; \\dots; 0 \\end{bmatrix} \\tag{2.3}$$ \n\
    $\\underbrace{\\phantom{[0;0;\\dots;0]}}_{(K-1)\\times V}$\n\n$$\\boldsymbol{f}(\\\
    boldsymbol{x}, y = 2) = \\begin{bmatrix} 0; 0; \\dots; 0; \\boldsymbol{x}; 0;\
    \ 0; \\dots; 0 \\end{bmatrix} \\tag{2.4}$$ \n$\\underbrace{\\phantom{[0;0;\\dots;0]}}_{V}$\
    \ $\\underbrace{\\phantom{[0;0;\\dots;0]}}_{(K-2)\\times V}$\n\n$$\\boldsymbol{f}(\\\
    boldsymbol{x}, y = K) = \\begin{bmatrix} 0; 0; \\dots; 0; \\boldsymbol{x} \\end{bmatrix},\
    \ \\tag{2.5}$$ \n$\\underbrace{\\phantom{[0;0;\\dots;0]}}_{(K-1)\\times V}$\n\n\
    where $\\underbrace{[0;0;\\dots;0]}_{(K-1)\\times V}$ is a column vector of $(K-1)\
    \ \\times V$ zeros, and the semicolon indicates vertical concatenation. For each\
    \ of the $K$ possible labels, the feature function returns a\n\n$^{1}$In practice,\
    \ both $\\boldsymbol{f}$ and $\\boldsymbol{\\theta}$ may be implemented as a dictionary\
    \ rather than vectors, so that it is not necessary to explicitly identify $j$.\
    \ In such an implementation, the tuple $(\\textit{whale}, \\text{FICTION})$ acts\
    \ as a key in both dictionaries; the values in $\\boldsymbol{f}$ are feature counts,\
    \ and the values in $\\boldsymbol{\\theta}$ are weights."
