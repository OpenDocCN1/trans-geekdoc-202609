  md: 'a probability **mass** function (pmf) if $X$ is discrete; it is called a probability
    **density** function (pdf) if $X$ is continuous. In either case, the function
    must sum to one, and all values must be non-negative:


    $$\int_{x} \mathrm{p}_X(x) dx = 1 \tag{[A.28]}$$ $$\forall x, \mathrm{p}_X(x)
    \ge 0. \tag{[A.29]}$$


    Probabilities over multiple random variables can written as **joint probabilities**,
    e.g., $\mathrm{p}_{A,B}(a,b)=\Pr(A=a \cap B=b)$. Several properties of event probabilities
    carry over to probability distributions over random variables:


    +   - The **marginal probability distribution** is $\mathrm{p}_A(a)=\sum_b \mathrm{p}_{A,B}(a,b)$.

    +   - The **conditional probability distribution** is $\mathrm{p}_{A|B}(a \mid
    b)=\frac{\mathrm{p}_{A,B}(a,b)}{\mathrm{p}_B(b)}$.

    +   - Random variables $A$ and $B$ are independent iff $\mathrm{p}_{A,B}(a,b)=\mathrm{p}_A(a)\times\mathrm{p}_B(b)$.


    # A.5 Expectations


    Sometimes we want the **expectation** of a function, such as $E[g(x)] = \sum_{x\in\mathcal{X}}
    g(x)\mathrm{p}(x)$. Expectations are easiest to think about in terms of probability
    distributions over discrete events:


    +   - If it is sunny, Lucia will eat three ice creams.

    +   - If it is rainy, she will eat only one ice cream.

    +   - There’s a 80% chance it will be sunny.

    +   - The expected number of ice creams she will eat is $0.8 \times 3 + 0.2 \times
    1 = 2.6$.


    If the random variable $X$ is continuous, the expectation is an integral:


    $$E[g(x)] = \int_{\mathcal{X}} g(x)\mathrm{p}(x)dx \tag{[A.30]}$$


    For example, a fast food restaurant in Quebec has a special offer for cold days:
    they give a 1% discount on poutine for every degree below zero. Assuming a thermometer
    with infinite precision, the expected price would be an integral over all possible
    temperatures,


    $$E[\text{price}(x)] = \int_{\mathcal{X}} \min(1,1+x) \times \text{original-price}
    \times \mathrm{p}(x)dx. \tag{[A.31]}$$'
