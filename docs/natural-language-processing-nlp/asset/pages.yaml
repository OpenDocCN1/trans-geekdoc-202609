- pgno: 58
  md: '# 2.7 *Additional topics in classification


    This section presents some additional topics in classification that are particularly
    relevant for natural language processing, especially for understanding the research
    literature.


    # 2.7.1 Feature selection by regularization


    In logistic regression and large-margin classification, generalization can be
    improved by regularizing the weights towards 0, using the $L_2$ norm. But rather
    than encouraging weights to be small, it might be better for the model to be **sparse**:
    it should assign weights of exactly zero to most features, and only assign non-zero
    weights to features that are clearly necessary. This idea can be formalized by
    the $L_0$ norm, $L_0 = \|\theta\|_0 = \sum_j \delta(\theta_j \neq 0)$, which applies
    a constant penalty for each non-zero weight. This norm can be thought of as a
    form of **feature selection**: optimizing the $L_0$-regularized conditional likelihood
    is equivalent to trading off the log-likelihood against the number of active features.
    Reducing the number of active features is desirable because the resulting model
    will be fast, low-memory, and should generalize well, since irrelevant features
    will be pruned away. Unfortunately, the $L_0$ norm is non-convex and non-differentiable.
    Optimization under $L_0$ regularization is **NP-hard**, meaning that it can be
    solved efficiently only if P=NP (Ge et al., 2011).


    A useful alternative is the $L_1$ norm, which is equal to the sum of the absolute
    values of the weights, $\|\theta\|_1 = \sum_j |\theta_j|$. The $L_1$ norm is convex,
    and can be used as an approximation to $L_0$ (Tibshirani, 1996). Conveniently,
    the $L_1$ norm also performs feature selection, by driving many of the coefficients
    to zero; it is therefore known as a **sparsity inducing regularizer**. The $L_1$
    norm does not have a gradient at $\theta_j = 0$, so we must instead optimize the
    $L_1$-regularized objective using **subgradient** methods. The associated stochastic
    subgradient descent algorithms are only somewhat more complex than conventional
    SGD; Sra et al. (2012) survey approaches for estimation under $L_1$ and other
    regularizers.


    Gao et al. (2007) compare $L_1$ and $L_2$ regularization on a suite of NLP problems,
    finding that $L_1$ regularization generally gives similar accuracy to $L_2$ regularization,
    but that $L_1$ regularization produces models that are between ten and fifty times
    smaller, because more than 90% of the feature weights are set to zero.


    # 2.7.2 Other views of logistic regression


    In binary classification, we can dispense with the feature function, and choose
    $y$ based on the inner product of $\theta \cdot x$. The conditional probability
    $p_{Y|X}$ is obtained by passing this'
