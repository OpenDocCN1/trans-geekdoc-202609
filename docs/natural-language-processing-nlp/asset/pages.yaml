    # 15.4 Evaluating coreference resolution


    The state of coreference evaluation is aggravatingly complex. Early attempts at
    simple evaluation metrics were found to be susceptible to trivial baselines, such
    as placing each mention in its own cluster, or grouping all mentions into a single
    cluster. Following Denis and Baldridge (2009), the CoNLL 2011 shared task on coreference
    (Pradhan et al., 2011) formalized the practice of averaging across three different
    metrics: MUC (Vilain et al., 1995), B-CUBED (Bagga and Baldwin, 1998a), and CEAF
    (Luo, 2005). Reference implementations of these metrics are available from Pradhan
    et al. (2014) at https://github.com/conll/reference-coreference-scorers.


    # Additional resources


    Ng (2010) surveys coreference resolution through 2010. Early work focused exclusively
    on pronoun resolution, with rule-based (Lappin and Leass, 1994) and probabilistic
    methods (Ge et al., 1998). The full coreference resolution problem was popularized
    in a shared task associated with the sixth Message Understanding Conference, which
    included coreference annotations for training and test sets of thirty documents
    each (Grishman and Sundheim, 1996). An influential early paper was the decision
    tree approach of Soon et al. (2001), who introduced mention ranking. A comprehensive
    list of surface features for coreference resolution is offered by Bengtson and
    Roth (2008). Durrett and Klein (2013) improved on prior work by introducing a
    large lexicalized feature set; subsequent work has emphasized neural representations
    of entities and mentions (Wiseman et al., 2015).


