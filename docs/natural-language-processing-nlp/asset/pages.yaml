  md: '# 2.2.3 Estimation


    The parameters of the categorical and multinomial distributions have a simple
    interpretation: they are vectors of expected frequencies for each possible event.
    Based on this interpretation, it is tempting to set the parameters empirically,


    $$\phi_{y,j} = \frac{\text{count}(y,j)}{\sum_{j''=1}^{V} \text{count}(y,j'')}
    = \frac{\sum_{i:y^{(i)}=y} x_j^{(i)}}{\sum_{j''=1}^{V} \sum_{i:y^{(i)}=y} x_{j''}^{(i)}},
    \qquad [2.21]$$


    where count(y, j) refers to the count of word j in documents with label y.


    Equation 2.21 defines the relative frequency estimate for $\phi$. It can be justified
    as a maximum likelihood estimate: the estimate that maximizes the probability
    $\mathrm{p}(\boldsymbol{x}^{(1:N)}, y^{(1:N)}; \boldsymbol{\theta})$. Based on
    the generative model in Algorithm 1, the log-likelihood is,


    $$\mathcal{L}(\boldsymbol{\phi}, \boldsymbol{\mu}) = \sum_{i=1}^{N} \log \mathrm{p}_{\text{mult}}(\boldsymbol{x}^{(i)};
    \phi_{y^{(i)}}) + \log \mathrm{p}_{\text{cat}}(y^{(i)}; \boldsymbol{\mu}), \qquad
    [2.22]$$


    which is now written as a function $\mathcal{L}$ of the parameters $\phi$ and
    $\boldsymbol{\mu}$. Let''s continue to focus on the parameters $\phi$. Since $\mathrm{p}(y)$
    is constant with respect to $\phi$, we can drop it:


    $$\mathcal{L}(\boldsymbol{\phi}) = \sum_{i=1}^{N} \log \mathrm{p}_{\text{mult}}(\boldsymbol{x}^{(i)};
    \phi_{y^{(i)}}) = \sum_{i=1}^{N} \log B(\boldsymbol{x}^{(i)}) + \sum_{j=1}^{V}
    x_j^{(i)} \log \phi_{y^{(i)},j}, \qquad [2.23]$$


    where $B(\boldsymbol{x}^{(i)})$ is constant with respect to $\phi$.


    Maximum-likelihood estimation chooses $\phi$ to maximize the log-likelihood $\mathcal{L}$.
    However, the solution must obey the following constraints:


    $$\sum_{j=1}^{V} \phi_{y,j} = 1 \quad \forall y \qquad [2.24]$$


    These constraints can be incorporated by adding a set of Lagrange multipliers
    to the objective (see Appendix B for more details). To solve for each $\boldsymbol{\theta}_y$,
    we maximize the Lagrangian,


    $$\ell(\phi_y) = \sum_{i:y^{(i)}=y} \sum_{j=1}^{V} x_j^{(i)} \log \phi_{y,j} -
    \lambda\left(\sum_{j=1}^{V} \phi_{y,j} - 1\right). \qquad [2.25]$$


    Differentiating with respect to the parameter $\phi_{y,j}$ yields,


    $$\frac{\partial \ell(\phi_y)}{\partial \phi_{y,j}} = \sum_{i:y^{(i)}=y} x_j^{(i)}
    / \phi_{y,j} - \lambda. \qquad [2.26]$$'
