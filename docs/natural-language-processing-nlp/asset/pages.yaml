    # Example: Hidden Markov models


    Hidden Markov models (chapter 7) can be viewed as weighted finite state transducers,
    and they can be constructed by transduction. Recall that a hidden Markov model
    defines a joint probability over words and tags, p(w, y), which can be computed
    as a path through a trellis structure. This trellis is itself a weighted finite
    state acceptor, with edges between all adjacent nodes $q_{m-1,i} \rightarrow q_{m,j}$
    on input $Y_m = j$. The edge weights are log-probabilities,


    $\delta(q_{m-1,i}, Y_m = j, q_{m,j}) = \log p(w_m, Y_m = j \mid Y_{m-i} = j)$
    [9.20]

    $= \log p(w_m \mid Y_m = j) + \log \Pr(Y_m = j \mid Y_{m-1} = i).$ [9.21]


    Because there is only one possible transition for each tag $Y_m$, this WFSA is
    deterministic. The score for any tag sequence $\{y_m\}_{m=1}^M$ is the sum of
    these log-probabilities, corresponding to the total log probability $\log p(w,
    y)$. Furthermore, the trellis can be constructed by the composition of simpler
    FSTs.


    +   - First, construct a “transition” transducer to represent a bigram probability
    model over tag sequences, $T_T$. This transducer is almost identical to the $n$-gram
    language model acceptor in § 9.1.3: there is one state for each tag, and the edge
    weights equal to the transition log-probabilities, $\delta(q_i, j, q_j) = \log
    \Pr(Y_m = j \mid Y_{m-1} = i)$. Note that $T_T$ is a transducer, with identical
    input and output at each arc; this makes it possible to compose $T_T$ with other
    transducers.

    +   - Next, construct an “emission” transducer to represent the probability of
    words given tags, $T_E$. This transducer has only a single state, with arcs for
    each word/tag pair, $\delta(q_0, i, j, q_0) = \log \Pr(W_m = j \mid Y_m = i)$.
    The input vocabulary is the set of all tags, and the output vocabulary is the
    set of all words.

    +   - The composition $T_E \circ T_T$ is a finite state transducer with one state
    per tag, as shown in Figure 9.8. Each state has $V \times K$ outgoing edges, representing
    transitions to each of the $K$ other states, with outputs for each of the $V$
    words in the vocabulary. The weights for these edges are equal to, $\delta(q_i,
    Y_m = j, w_m, q_j) = \log p(w_m, Y_m = j \mid Y_{m-1} = i).$ [9.22]

    +   - The trellis is a structure with $M \times K$ nodes, for each of the $M$
    words to be tagged and each of the $K$ tags in the tagset. It can be built by
    composition of $(T_E \circ T_T)$ against an unweighted chain FSA $M_A(w)$ that
    is specially constructed to accept only a given input $w_1, w_2, \dots, w_M$,
    shown in Figure 9.9. The trellis for input $w$ is built from the composition $M_A(w)
    \circ (T_E \circ T_T)$. Composing with the unweighted $M_A(w)$ does not affect
    the edge weights from $(T_E \circ T_T)$, but it selects the subset of paths that
    generate the word sequence $w$.'
