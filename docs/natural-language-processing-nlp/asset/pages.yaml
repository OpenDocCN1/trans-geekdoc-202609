    But aside from these few recursive productions, the noun phrase fragment of the
    Penn Treebank grammar is relatively flat, containing a large of number of productions
    that go from NP directly to a sequence of parts-of-speech. If noun phrases had
    more internal structure, the grammar would need fewer rules, which, as we will
