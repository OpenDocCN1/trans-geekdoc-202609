    Like sequence labeling, context-free parsing is a form of structure prediction.
    As a result, WCFGs can be learned using the same set of algorithms: generative
    probabilistic models, structured perceptron, maximum conditional likelihood, and
    maximum margin learning. In all cases, learning requires a treebank, which is
    a dataset of sentences labeled with context-free parses. Parsing research was
    catalyzed by the Penn Treebank (Marcus et al., 1993), the first large-scale dataset
    of this type (see § 9.2.2). Phrase structure treebanks exist for roughly two dozen
    other languages, with coverage mainly restricted to European and East Asian languages,
    plus Arabic and Urdu.


    # 10.4.1 Probabilistic context-free grammars


    Probabilistic context-free grammars are similar to hidden Markov models, in that
    they are generative models of text. In this case, the parameters of interest correspond
    to probabilities of productions, conditional on the left-hand side. As with hidden
    Markov models, these parameters can be estimated by relative frequency:


    ```

    ψ(X → α) = log p(X → α)                     [10.19]


    p̂(X → α) = count(X → α) / count(X).          [10.20]

    ```


    For example, the probability of the production NP → Det NN is the corpus count
    of this production, divided by the count of the non-terminal NP. This estimator
    applies to terminal productions as well: the probability of NN → whale is the
    count of how often whale appears in the corpus as generated from an NN tag, divided
    by the total count of the NN tag. Even with the largest treebanks — currently
    on the order of one million tokens — it is difficult to accurately compute probabilities
    of even moderately rare events, such as NN → whale. Therefore, smoothing is critical
    for making PCFGs effective.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# 10.4.2 Feature-based parsing


    The scores for each production can be computed as an inner product of weights
    and features,


    ψ(X → α, (i, j, k)) = θ · f(X, α, (i, j, k), w), [10.21]


    where the feature vector f is a function of the left-hand side X, the right-hand
    side α, the anchor indices (i, j, k), and the input w.


    The basic feature f(X, α, (i, j, k)) = {(X, α)} encodes only the identity of the
    production itself. This gives rise to a discriminatively-trained model with the
    same expressiveness as a PCFG. Features on anchored productions can include the
    words that border the span wi, wj+1, the word at the split point wk+1, the presence
    of a verb or noun in the left child span wi+1:k, and so on (Durrett and Klein,
    2015). Scores on anchored productions can be incorporated into CKY parsing without
    any modification to the algorithm, because it is still possible to compute each
    element of the table t[i, j, X] recursively from its immediate children.


    Other features can be obtained by grouping elements on either the left-hand or
    right-hand side: for example it can be particularly beneficial to compute additional
    features by clustering terminal symbols, with features corresponding to groups
    of words with similar syntactic properties. The clustering can be obtained from
    unlabeled datasets that are much larger than any treebank, improving coverage.
    Such methods are described in chapter 14.


    Feature-based parsing models can be estimated using the usual array of discriminative
    learning techniques. For example, a structure perceptron update can be computed
    as (Carreras et al., 2008),


    f(τ, w^(i)) = Σ_{(X→α,(i,j,k))∈τ} f(X, α, (i, j, k), w^(i)) [10.22]

    τ̂ = argmax_{τ∈T(w)} θ · f(τ, w^(i)) [10.23]

    θ ← f(τ^(i), w^(i)) − f(τ̂, w^(i)). [10.24]


    A margin-based objective can be optimized by selecting τ̂ through cost-augmented
    decoding (§ 2.4.2), enforcing a margin of Δ(τ̂, τ) between the hypothesis and
    the reference parse, where Δ is a non-negative cost function, such as the Hamming
    loss (Stern et al., 2017). It is also possible to train feature-based parsing
    models by conditional log-likelihood, as described in the next section.'
  merge: -1
  img_proc: true
