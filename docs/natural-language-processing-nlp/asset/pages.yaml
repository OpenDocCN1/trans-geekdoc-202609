    # 18.3 Neural machine translation


    Neural network models for machine translation are based on the **encoder-decoder**
    architecture (Cho et al., 2014). The encoder network converts the source language
    sentence into a vector or matrix representation; the decoder network then converts
    the encoding into a sentence in the target language.


    $$z = \text{ENCODE}(\boldsymbol{w}^{(s)})\tag{18.24}$$  $$\boldsymbol{w}^{(t)}
    \mid \boldsymbol{w}^{(s)} \sim \text{DECODE}(\boldsymbol{z}),\tag{18.25}$$


    where the second line means that the function DECODE(z) defines the conditional
    probability p(\boldsymbol{w}^{(t)} \mid \boldsymbol{w}^{(s)}).


    The decoder is typically a recurrent neural network, which generates the target
    language sentence one word at a time, while recurrently updating a hidden state.
    The encoder and decoder networks are trained end-to-end from parallel sentences.
    If the output layer of the decoder is a logistic function, then the entire architecture
    can be trained to maximize the conditional log-likelihood,


    $$\log p(\boldsymbol{w}^{(t)} \mid \boldsymbol{w}^{(s)}) = \sum_{m=1}^{M^{(t)}}
    p(w_m^{(t)} \mid w_{1:m-1}^{(t)}, z)\tag{18.26}$$  $$p(w_m^{(t)} \mid w_{1:m-1}^{(t)},
