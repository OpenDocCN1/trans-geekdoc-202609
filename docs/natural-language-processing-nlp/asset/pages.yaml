  md: 'The projection matrix U can be learned in a number of different ways, but many
    approaches focus on compressing and reconstructing the base features (Ando and
    Zhang, 2005). For example, we can define a set of **pivot features**, which are
    typically chosen because they appear in both domains: in the case of review documents,
    pivot features might include evaluative adjectives like *outstanding* and *disappointing*
    (Blitzer et al., 2007). For each pivot feature *j*, we define an auxiliary problem
    of predicting whether the feature is present in each example, using the remaining
    base features. Let \(\phi_j\) denote the weights of this classifier, and thus
    horizontally concatenate the weights for each of the \(N_p\) pivot features into
    a matrix \(\Phi = [\phi_1, \phi_2, \ldots, \phi_{N_p}]\).


    We then perform truncated singular value decomposition on \(\Phi\), as described
    in § 5.2.1, obtaining \(\Phi \approx USV^\top\). The rows of the matrix U summarize
    information about each base feature: indeed, the truncated singular value decomposition
    identifies a low-dimension basis for the weight matrix \(\Phi\), which in turn
    links base features to pivot features. Suppose that a base feature *reliable*
    occurs only in the target domain of appliance reviews. Nonetheless, it will have
    a positive weight towards some pivot features (e.g., *outstanding*, *recommended*),
    and a negative weight towards others (e.g., *worthless*, *unpleasant*). A base
    feature such as *watchable* might have the same associations with the pivot features,
    and therefore, \(u_{\text{reliable}} \approx u_{\text{watchable}}\). The matrix
    U can thus project the base features into a space in which this information is
    shared.


    # Non-linear projection


    Non-linear transformations of the base features can be accomplished by implementing
    the transformation function as a deep neural network, which is trained from an
    auxiliary objective.


    **Denoising objectives** One possibility is to train a projection function to
    reconstruct a corrupted version of the original input. The original input can
    be corrupted in various ways: by the addition of random noise (Glorot et al.,
    2011; Chen et al., 2012), or by the deletion of features (Chen et al., 2012; Yang
    and Eisenstein, 2015). Denoising objectives share many properties of the linear
    projection method described above: they enable the projection function to be trained
    on large amounts of unlabeled data from the target domain, and allow information
    to be shared across the feature space, thereby reducing sensitivity to rare and
    domain-specific features.


    **Adversarial objectives** The ultimate goal is for the transformed representations
    \(g(x^{(i)})\) to be domain-general. This can be made an explicit optimization
    criterion by computing the similarity of transformed instances both within and
    between domains (Tzeng et al., 2015), or by formulating an auxiliary classification
    task, in which the domain itself is treated as a label (Ganin et al., 2016). This
    setting is **adversarial**, because we want'
