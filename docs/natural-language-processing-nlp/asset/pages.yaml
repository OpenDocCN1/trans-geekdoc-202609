- pgno: 12
  md: '# Preface


    The goal of this text is focus on a core subset of the natural language processing,
    unified by the concepts of learning and search. A remarkable number of problems
    in natural language processing can be solved by a compact set of methods:


    **Search.** Viterbi, CKY, minimum spanning tree, shift-reduce, integer linear
    programming, beam search.


    **Learning.** Maximum-likelihood estimation, logistic regression, perceptron,
    expectation-maximization, matrix factorization, backpropagation.


    This text explains how these methods work, and how they can be applied to a wide
    range of tasks: document classification, word sense disambiguation, part-of-speech
    tagging, named entity recognition, parsing, coreference resolution, relation extraction,
    discourse analysis, language modeling, and machine translation.


    # Background


    Because natural language processing draws on many different intellectual traditions,
    almost everyone who approaches it feels underprepared in one way or another. Here
    is a summary of what is expected, and where you can learn more:


    **Mathematics and machine learning.** The text assumes a background in multivariate
    calculus and linear algebra: vectors, matrices, derivatives, and partial derivatives.
    You should also be familiar with probability and statistics. A review of basic
    probability is found in Appendix A, and a minimal review of numerical optimization
    is found in Appendix B. For linear algebra, the online course and textbook from
    Strang (2016) provide an excellent review. Deisenroth et al. (2018) are currently
    preparing a textbook on *Mathematics for Machine Learning*, a draft can be found
    online.¹ For an introduction to probabilistic modeling and estimation, see James
    et al. (2013); for


    ¹https://mml-book.github.io/'
