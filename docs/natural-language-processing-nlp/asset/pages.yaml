    The line we will take a glass is the word-for-word gloss of the French sentence;
    the translation we’ll have a drink is shown on the third line. Such examples are
    difficult for word-to-word translation models, since they require translating
    prendre to have and verre to drink. These translations are only correct in the
    context of these specific phrases.


    Phrase-based translation generalizes on word-based models by building translation
    tables and alignments between multiword spans. (These “phrases” are not necessarily
    syntactic constituents like the noun phrases and verb phrases described in chapters
    9 and 10.) The generalization from word-based translation is surprisingly straightforward:
    the translation tables can now condition on multi-word units, and can assign probabilities
    to multi-word units; alignments are mappings from spans to spans, ((i,j),(k,ℓ)),
    so that


    p(w^(s) | w^(t),A) = ∏_{((i,j),(k,ℓ))∈A} P_{w^(s)|w^(t)}({w^(s)_{i+1},w^(s)_{i+2},…,w^(s)_j}
    | {w^(t)_{k+1},w^(t)_{k+2},…,w^(t)_ℓ}). [18.21]


    The phrase alignment ((i,j),(k,ℓ)) indicates that the span w^(s)_{i+1:j} is the
    translation of the span w^(t)_{k+1:ℓ}. An example phrasal alignment is shown in
    Figure 18.4. Note that the alignment set A is required to cover all of the tokens
    in the source, just as in word-based translation. The probability model p_{w^(s)|w^(t)}
    must now include translations for all phrase pairs, which can be learned from
    expectation-maximization just as in word-based statistical machine translation.'
