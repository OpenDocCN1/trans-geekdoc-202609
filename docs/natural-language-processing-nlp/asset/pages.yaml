- pgno: 19
  md: 'natural language processing is focused on the design and analysis of computational
    algorithms and representations for processing natural human language. The goal
    of natural language processing is to provide new computational capabilities around
    human language: for example, extracting information from texts, translating between
    languages, answering questions, holding a conversation, taking instructions, and
    so on. Fundamental linguistic insights may be crucial for accomplishing these
    tasks, but success is ultimately measured by whether and how well the job gets
    done.


    # Machine Learning


    Contemporary approaches to natural language processing rely heavily on machine
    learning, which makes it possible to build complex computer programs from examples.
    Machine learning provides an array of general techniques for tasks like converting
    a sequence of discrete tokens in one vocabulary to a sequence of discrete tokens
    in another vocabulary — a generalization of what one might informally call “translation.”
    Much of today’s natural language processing research can be thought of as applied
    machine learning. However, natural language processing has characteristics that
    distinguish it from many of machine learning’s other application domains.


    +   - Unlike images or audio, text data is fundamentally discrete, with meaning
    created by combinatorial arrangements of symbolic units. This is particularly
    consequential for applications in which text is the output, such as translation
    and summarization, because it is not possible to gradually approach an optimal
    solution.

    +   - Although the set of words is discrete, new words are always being created.
    Furthermore, the distribution over words (and other linguistic elements) resembles
    that of a power law (Zipf, 1949): there will be a few words that are very frequent,
    and a long tail of words that are rare. A consequence is that natural language
    processing algorithms must be especially robust to observations that do not occur
    in the training data.

    +   - Language is compositional: units such as words can combine to create phrases,
    which can combine by the very same principles to create larger phrases. For example,
    a noun phrase can be created by combining a smaller noun phrase with a prepositional
    phrase, as in the whiteness of the whale. The prepositional phrase is created
    by combining a preposition (in this case, of) with another noun phrase (the whale).
    In this way, it is possible to create arbitrarily long phrases, such as,


    (1.1) …huge globular pieces of the whale of the bigness of a human head.²


    The meaning of such a phrase must be analyzed in accord with the underlying hierarchical
    structure. In this case, huge globular pieces of the whale acts as a single noun


    ¹Throughout the text, boldface will be used to indicate keywords that appear in
    the index.


    ²Throughout the text, this notation will be used to introduce linguistic examples.'
