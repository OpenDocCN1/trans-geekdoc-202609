    What strings does M1 accept? The start state is q0, and we have to get to q1,
    since this is the only final state. Any number of a symbols can be consumed in
    q0, but a b symbol is required to transition to q1. Once there, any number of
    b symbols can be consumed, but an a symbol cannot. So the regular expression corresponding
    to the language defined by M1 is a*b b*.


    # Computational properties of finite state acceptors


    The key computational question for finite state acceptors is: how fast can we
    determine whether a string is accepted? For deterministic FSAs, this computation
    can be performed by Dijkstra’s algorithm, with time complexity O(V log V + E),
    where V is the number of vertices in the FSA, and E is the number of edges (Cormen
    et al., 2009). Non-deterministic FSAs (NFSAs) can include multiple transitions
    from a given symbol and state. Any NSFA can be converted into a deterministic
    FSA, but the resulting automaton may have a number of states that is exponential
    in the number of size of the original NFSA (Mohri et al., 2002).


    # 9.1.2 Morphology as a regular language


    Many words have internal structure, such as prefixes and suffixes that shape their
    meaning. The study of word-internal structure is the domain of morphology, of
    which there are two main types:


    +   - **Derivational morphology** describes the use of affixes to convert a word
    from one grammatical category to another (e.g., from the noun grace to the adjective
    graceful), or to change the meaning of the word (e.g., from grace to disgrace).

    +   - **Inflectional morphology** describes the addition of details such as gender,
    number, person, and tense (e.g., the -ed suffix for past tense in English).


    Morphology is a rich topic in linguistics, deserving of a course in its own right.¹
    The focus here will be on the use of finite state automata for morphological analysis.
    The


    ¹A good starting point would be a chapter from a linguistics textbook (e.g., Akmajian
    et al., 2010; Bender, 2013). A key simplification in this chapter is the focus
    on affixes at the sole method of derivation and inflection. English makes use
    of affixes, but also incorporates apophony, such as the inflection of foot to
    feet. Semitic languages like Arabic and Hebrew feature a template-based system
    of morphology, in which roots are triples of consonants (e.g., ktb), and words
    are created by adding vowels: kataba (Arabic: he wrote), kutub (books), maktab
    (desk). For more detail on morphology, see texts from Haspelmath and Sims (2013)
    and Lieber (2015).'
