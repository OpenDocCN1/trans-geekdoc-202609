  md: 'the classifier design, and test set accuracy will diverge from accuracy on
    truly unseen data. Because annotated data is expensive, this ideal can be hard
    to follow in practice, and many test sets have been used for decades. But in some
    high-impact applications like machine translation and information extraction,
    new test sets are released every year.


    When only a small amount of labeled data is available, the test set accuracy can
    be unreliable. K-fold cross-validation is one way to cope with this scenario:
    the labeled data is divided into K folds, and each fold acts as the test set,
    while training on the other folds. The test set accuracies are then aggregated.
    In the extreme, each fold is a single data point; this is called leave-one-out
    cross-validation. To perform hyperparameter tuning in the context of cross-validation,
    another fold can be used for grid search. It is important not to repeatedly evaluate
    the cross-validated accuracy while making design decisions about the classifier,
    or you will overstate the accuracy on truly unseen data.


    # 2.3 Discriminative learning


    Naïve Bayes is easy to work with: the weights can be estimated in closed form,
    and the probabilistic interpretation makes it relatively easy to extend. However,
    the assumption that features are independent can seriously limit its accuracy.
    Thus far, we have defined the feature function f(x, y) so that it corresponds
    to bag-of-words features: one feature per word in the vocabulary. In natural language,
    bag-of-words features violate the assumption of conditional independence — for
    example, the probability that a document will contain the word naïve is surely
    higher given that it also contains the word Bayes — but this violation is relatively
    mild.


    However, good performance on text classification often requires features that
    are richer than the bag-of-words:


    +   - To better handle out-of-vocabulary terms, we want features that apply to
    multiple words, such as prefixes and suffixes (e.g., anti-, un-, -ing) and capitalization.

    +   - We also want n-gram features that apply to multi-word units: bigrams (e.g.,
    not good, not bad), trigrams (e.g., not so bad, lacking any decency, never before
    imagined), and beyond.


    These features flagrantly violate the Naïve Bayes independence assumption. Consider
    what happens if we add a prefix feature. Under the Naïve Bayes assumption, the
    joint probability of a word and its prefix are computed with the following approximation:12


    Pr(word = unfit, prefix = un- | y) ≈ Pr(prefix = un- | y) × Pr(word = unfit |
    y).


    12 The notation Pr(·) refers to the probability of an event, and p(·) refers to
    the probability density or mass for a random variable (see Appendix A).'
