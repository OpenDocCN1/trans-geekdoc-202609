  md: 'Sentence summarization is closely related to **sentence compression**, in which
    the summary is produced by deleting words or phrases from the original (Clarke
    and Lapata, 2008). But as shown in (19.2b), a sentence summary can also introduce
    new words, such as *against*, which replaces the phrase *for combatting*.


    Sentence summarization can be treated as a machine translation problem, using
    the attentional encoder-decoder translation model discussed in § 18.3.1 (Rush
    et al., 2015). The longer sentence is encoded into a sequence of vectors, one
    for each token. The decoder then computes attention over these vectors when updating
    its own recurrent state. As with data-to-text generation, it can be useful to
    augment the encoder-decoder model with the ability to copy words directly from
    the source. Rush et al. (2015) train this model by building four million sentence
    pairs from news articles. In each pair, the longer sentence is the first sentence
    of the article, and the summary is the article headline. Sentence summarization
    can also be trained in a semi-supervised fashion, using a probabilistic formulation
    of the encoder-decoder model called a **variational autoencoder** (Miao and Blunsom,
    2016, also see § 14.8.2).


    When summarizing longer documents, an additional concern is that the summary not
    be repetitive: each part of the summary should cover new ground. This can be addressed
    by maintaining a vector of the sum total of all attention values thus far, $t_m
    = \sum_{n=1}^m \alpha_n$. This total can be used as an additional input to the
    computation of the attention weights, $\alpha_{m\to n} \propto \exp\left( \boldsymbol{v}_\alpha
    \cdot \tanh\big(\Theta_\alpha [h_m^{(t)}; h_n^{(s)}; t_m]\big) \right), \quad
    [19.11]$


    which enables the model to learn to prefer parts of the source which have not
    been attended to yet (Tu et al., 2016). To further encourage diversity in the
    generated summary, See et al. (2017) introduce a **coverage loss** to the objective
    function, $\ell_m = \sum_{n=1}^{M^{(s)}} \min(\alpha_{m\to n}, t_{m\to n}). \quad
    [19.12]$


    This loss will be low if $\boldsymbol{\alpha}_m$ assigns little attention to words
    that already have large values in $t_m$. Coverage loss is similar to the concept
    of **marginal relevance**, in which the reward for adding new content is proportional
    to the extent to which it increases the overall amount of information conveyed
    by the summary (Carbonell and Goldstein, 1998).


    # 19.2.2 Sentence fusion for multi-document summarization


    In **multi-document summarization**, the goal is to produce a summary that covers
    the content of several documents (McKeown et al., 2002). One approach to this
    challenging problem is to identify sentences across multiple documents that relate
    to a single theme, and then to fuse them into a single sentence (Barzilay and
    McKeown, 2005). As an example, consider the following two sentences (McKeown et
    al., 2010):'
