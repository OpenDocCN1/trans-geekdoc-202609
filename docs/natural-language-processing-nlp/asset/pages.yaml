  md: '# Chapter 4


    # Linguistic applications of

    classification


    Having covered several techniques for classification, this chapter shifts the
    focus from mathematics to linguistic applications. Later in the chapter, we will
    consider the design decisions involved in text classification, as well as best
    practices for evaluation.


    # 4.1  Sentiment and opinion analysis


    A popular application of text classification is to automatically determine the
    **sentiment** or **opinion polarity** of documents such as product reviews and
    social media posts. For example, marketers are interested to know how people respond
    to advertisements, services, and products (Hu and Liu, 2004); social scientists
    are interested in how emotions are affected by phenomena such as the weather (Hannak
    et al., 2012), and how both opinions and emotions spread over social networks
    (Coviello et al., 2014; Miller et al., 2011). In the field of **digital humanities**,
    literary scholars track plot structures through the flow of sentiment across a
    novel (Jockers, 2015).¹


    Sentiment analysis can be framed as a direct application of document classification,
    assuming reliable labels can be obtained. In the simplest case, sentiment analysis
    is a two or three-class problem, with sentiments of POSITIVE, NEGATIVE, and possibly
    NEUTRAL. Such annotations could be annotated by hand, or obtained automatically
    through a variety of means:


    +   - Tweets containing happy emotions can be marked as positive, sad emotions
    as negative (Read, 2005; Pak and Paroubek, 2010).


    ¹Comprehensive surveys on sentiment analysis and related problems are offered
    by Pang and Lee (2008) and Liu (2015).'
  merge: -1
