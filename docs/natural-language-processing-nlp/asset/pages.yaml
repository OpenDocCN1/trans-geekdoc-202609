    As with the move from regular to context-free languages, mildly context-sensitive
    languages can also be motivated by expedience. While finite sequences of cross-serial
    dependencies can in principle be handled in a context-free grammar, it is often
    more convenient to use a mildly context-sensitive formalism like tree-adjoining
    grammar (TAG) and combinatory categorical grammar (CCG). TAG-inspired parsers
    have been shown to be particularly effective in parsing the Penn Treebank (Collins,
    1997; Carreras et al., 2008), and CCG plays a leading role in current research
    on semantic parsing (Zettlemoyer and Collins, 2005). These two formalisms are
    weakly equivalent: any language that can be specified in TAG can also be specified
    in CCG, and vice versa (Joshi et al., 1991). The remainder of the chapter gives
    a brief overview of CCG, but you are encouraged to consult Joshi and Schabes (1997)
    and Steedman and Baldridge (2011) for more detail on TAG and CCG respectively.


    # 9.3.2 Combinatory categorical grammar


    In combinatory categorical grammar, structural analyses are built up through a
    small set of generic combinatorial operations, which apply to immediately adjacent
    sub-structures. These operations act on the categories of the sub-structures,
    producing a new structure with a new category. The basic categories include S
    (sentence), NP (noun phrase), VP (verb phrase) and N (noun). The goal is to label
    the entire span of text as a sentence, S.


    Complex categories, or types, are constructed from the basic categories, parentheses,
    and forward and backward slashes: for example, S/NP is a complex type, indicating
    a sentence that is lacking a noun phrase to its right; S\NP is a sentence lacking
    a noun phrase to its left. Complex types act as functions, and the most basic
    combinatorial operations are function application to either the right or left
    neighbor. For example, the type of a verb phrase, such as eats, would be S\NP.
    Applying this function to a subject noun phrase to its left results in an analysis
    of Abigail eats as category S, indicating a successful parse.


    Transitive verbs must first be applied to the direct object, which in English
    appears to the right of the verb, before the subject, which appears on the left.
    They therefore have the more complex type (S\NP)/NP. Similarly, the application
    of a determiner to the noun at'
