  md: '![](img/ba66a8f6f22adeb28512d560b999a231_214_0.png)


    Figure 9.3: Minimization of the finite state acceptor shown in Figure 9.2.


    > "Though many things are possible in morphology, some are more possible than
    others."


    But finite state acceptors give no way to express preferences among technically
    valid choices.


    Weighted finite state acceptors (WFSAs) are generalizations of FSAs, in which
    each accepting path is assigned a score, computed from the transitions, the initial
    state, and the final state. Formally, a weighted finite state acceptor M = (Q,
    Σ, λ, ρ, δ) consists of:


    +   - a finite set of states Q = {q0, q1, ..., qn};

    +   - a finite alphabet Σ of input symbols;

    +   - an initial weight function, λ : Q → ℝ;

    +   - a final weight function ρ : Q → ℝ;

    +   - a transition function δ : Q × Σ × Q → ℝ.


    WFSAs depart from the FSA formalism in three ways: every state can be an initial
    state, with score λ(q); every state can be an accepting state, with score ρ(q);
    transitions are possible between any pair of states on any input, with a score
    δ(qi, ω, qj). Nonetheless, FSAs can be viewed as a special case: for any FSA M
    we can build an equivalent WFSA by setting λ(q) = ∞ for all q ≠ q0, ρ(q) = ∞ for
    all q ∉ F, and δ(qi, ω, qj) = ∞ for all transitions {(q1, ω) → q2} that are not
    permitted by the transition function of M.


    The total score for any path π = t1, t2, ..., tN is equal to the sum of these
    scores,


    d(π) = λ(from-state(t1)) + Σ_{n}^{N} δ(tn) + ρ(to-state(tN)). [9.5]


    A shortest-path algorithm is used to find the minimum-cost path through a WFSA
    for string ω, with time complexity O(E + V log V), where E is the number of edges
    and V is the number of vertices (Cormen et al., 2009).²


    ²Shortest-path algorithms find the path with the minimum cost. In many cases,
    the path weights are log'
