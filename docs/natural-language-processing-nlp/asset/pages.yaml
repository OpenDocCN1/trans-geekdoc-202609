    a human head*. The interpretation would be different if instead, *huge globular
    pieces* were conjoined with the prepositional phrase *of the whale of the bigness
    of a human head* — implying a disappointingly small whale. Even though text appears
    as a sequence, machine learning methods must account for its implicit recursive
    structure.


    # Artificial Intelligence


    The goal of artificial intelligence is to build software and robots with the same
    range of abilities as humans (Russell and Norvig, 2009). Natural language processing
    is relevant to this goal in several ways. On the most basic level, the capacity
    for language is one of the central features of human intelligence, and is therefore
    a prerequisite for artificial intelligence.³ Second, much of artificial intelligence
    research is dedicated to the development of systems that can reason from premises
    to a conclusion, but such algorithms are only as good as what they know (Dreyfus,
    1992). Natural language processing is a potential solution to the “knowledge bottleneck”,
    by acquiring knowledge from texts, and perhaps also from conversations. This idea
    goes all the way back to Turing’s 1949 paper *Computing Machinery and Intelligence*,
    which proposed the **Turing test** for determining whether artificial intelligence
    had been achieved (Turing, 2009).


    Conversely, reasoning is sometimes essential for basic tasks of language processing,
    such as resolving a pronoun. **Winograd schemas** are examples in which a single
    word changes the likely referent of a pronoun, in a way that seems to require
    knowledge and reasoning to decode (Levesque et al., 2011). For example,


    (1.2) The trophy doesn’t fit into the brown suitcase because **it** is too [small/large].


    When the final word is *small*, then the pronoun *it* refers to the suitcase;
    when the final word is *large*, then *it* refers to the trophy. Solving this example
    requires spatial reasoning; other schemas require reasoning about actions and
    their effects, emotions and intentions, and social conventions.


    Such examples demonstrate that natural language understanding cannot be achieved
    in isolation from knowledge and reasoning. Yet the history of artificial intelligence
    has been one of increasing specialization: with the growing volume of research
    in subdisciplines such as natural language processing, machine learning, and computer
    vision, it is


    ³This view is shared by some, but not all, prominent researchers in artificial
    intelligence. Michael Jordan, a specialist in machine learning, has said that
    if he had a billion dollars to spend on any large research project, he would spend
    it on natural language processing (https://www.reddit.com/r/MachineLearning/comments/2fxi6v/ama_michael_i_jordan/).
    On the other hand, in a public discussion about the future of artificial intelligence
    in February 2018, computer vision researcher Yann Lecun argued that despite its
    many practical applications, language is perhaps “number 300” in the priority
    list for artificial intelligence research, and that it would be a great achievement
    if AI could attain the capabilities of an orangutan, which do not include language
    (http://www.abigalsee.com/2018/02/21/deep-learning-structure-and-innate-priors.html).'
