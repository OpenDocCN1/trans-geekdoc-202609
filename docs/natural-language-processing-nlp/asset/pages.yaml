    approach is to augment neural translation with an attention mechanism. The idea
    of neural attention was described in § 17.5, but its application to translation
    bears further discussion. In general, attention can be thought of as using a query
    to select from a memory of key-value pairs. However, the query, keys, and values
    are all vectors, and the entire


