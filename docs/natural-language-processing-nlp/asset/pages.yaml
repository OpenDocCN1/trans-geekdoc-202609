- pgno: 396
  md: '# Chapter 16


    # Discourse


    Applications of natural language processing often concern multi-sentence documents:
    from paragraph-long restaurant reviews, to 500-word newspaper articles, to 500-page
    novels. Yet most of the methods that we have discussed thus far are concerned
    with individual sentences. This chapter discusses theories and methods for handling
    multi-sentence linguistic phenomena, known collectively as **discourse**. There
    are diverse characterizations of discourse structure, and no single structure
    is ideal for every computational application. This chapter covers some of the
    most well studied discourse representations, while highlighting computational
    models for identifying and exploiting these structures.


    # 16.1 Segments


    A document or conversation can be viewed as a sequence of **segments**, each of
    which is **cohesive** in its content and/or function. In Wikipedia biographies,
    these segments often pertain to various aspects to the subject’s life: early years,
    major events, impact on others, and so on. This segmentation is organized around
    **topics**. Alternatively, scientific research articles are often organized by
    **functional themes**: the introduction, a survey of previous research, experimental
    setup, and results.


    Written texts often mark segments with section headers and related formatting
    devices. However, such formatting may be too coarse-grained to support applications
    such as the retrieval of specific passages of text that are relevant to a query
    (Hearst, 1997). Unformatted speech transcripts, such as meetings and lectures,
    are also an application scenario for segmentation (Carletta, 2007; Glass et al.,
    2007; Janin et al., 2003).'
  merge: -1
