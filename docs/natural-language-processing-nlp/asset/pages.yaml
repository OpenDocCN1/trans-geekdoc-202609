  md: '```

    **Algorithm 5** Generalized gradient descent. The function Batcher partitions
    the training set into $B$ batches such that each instance appears in exactly one
    batch. In gradient descent, $B = 1$; in stochastic gradient descent, $B = N$;
    in minibatch stochastic gradient descent, $1 < B < N$.


    1: **procedure** Gradient-Descent($x^{(1:N)}, y^{(1:N)}, L, \eta^{(1...\infty)},
    \text{Batcher}, T_{\max}$)

    2: &nbsp;&nbsp;&nbsp;&nbsp;$\theta \leftarrow 0$

    3: &nbsp;&nbsp;&nbsp;&nbsp;$t \leftarrow 0$

    4: &nbsp;&nbsp;&nbsp;&nbsp;**repeat**

    5: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$(b^{(1)}, b^{(2)}, \ldots,
    b^{(B)}) \leftarrow \text{Batcher}(N)$

    6: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;**for** $n \in \{1, 2, \ldots,
    B\}$ **do**

    7: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$t
    \leftarrow t + 1$

    8: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;$\theta^{(t)}
    \leftarrow \theta^{(t-1)} - \eta^{(t)}\nabla_{\theta}L(\theta^{(t-1)}; x^{(b_1^{(n)},
    b_2^{(n)}, \ldots)}, y^{(b_1^{(n)}, b_2^{(n)}, \ldots)})$

    9: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;**if**
    Converged$(\theta^{(1,2,\ldots,t)})$ **then**

    10: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;**return**
    $\theta^{(t)}$

    11: &nbsp;&nbsp;&nbsp;&nbsp;**until** $t \geq T_{\max}$

    12: &nbsp;&nbsp;&nbsp;&nbsp;**return** $\theta^{(t)}$

    ```


    scent, it returns $N$ batches with one instance each. In mini-batch settings,
    the batcher returns $B$ minibatches, $1 < B < N$.


    There are many other techniques for online learning, and research in this area
    is ongoing (Bottou et al., 2016). Some algorithms use an adaptive learning rate,
    which can be different for every feature (Duchi et al., 2011). Features that occur
    frequently are likely to be updated frequently, so it is best to use a small learning
    rate; rare features will be updated infrequently, so it is better to take larger
    steps. The **AdaGrad** (adaptive gradient) algorithm achieves this behavior by
    storing the sum of the squares of the gradients for each feature, and rescaling
    the learning rate by its inverse:


    $$g_t = \nabla_{\theta} L(\theta^{(t)}; x^{(i)}, y^{(i)})$$  [2.73]


    $$\theta_j^{(t+1)} \leftarrow \theta_j^{(t)} - \frac{\eta^{(t)}}{\sqrt{\sum_{t''=1}^{t}
    g_{t'',j}^{2}}}g_{t,j}$$  [2.74]


    where $j$ iterates over features in $f(x, y)$.


    In most cases, the number of active features for any instance is much smaller
    than the number of weights. If so, the computation cost of online optimization
    will be dominated by the update from the regularization term, $\lambda\theta$.
    The solution is to be “lazy”, updating each $\theta_j$ only as it is used. To
    implement lazy updating, store an additional parameter $\tau_j$, which is the
    iteration at which $\theta_j$ was last updated. If $\theta_j$ is needed at time
    $t$, the $t - \tau$ regularization updates can be performed all at once. This
    strategy is described in detail by Kummerfeld et al. (2015).'
