    |

    | Porter stemmer | the | william | sister | are | leav | thi | tenni | centr |

    | Lancaster stemmer | the | william | sist | ar | leav | thi | ten | cent |

    | WordNet lemmatizer | The | Williams | sister | are | leaving | this | tennis
    | centre |


