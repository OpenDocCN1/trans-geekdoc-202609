  md: '![](img/ba66a8f6f22adeb28512d560b999a231_155_0.png)


    Figure 6.2: The long short-term memory (LSTM) architecture. Gates are shown in
    boxes with dotted edges. In an LSTM language model, each $\boldsymbol{h}_m$ would
    be used to predict the next word $w_{m+1}$.


    The gates are functions of the input and previous hidden state. They are computed
    from elementwise sigmoid activations, $\sigma(x) = (1 + \exp(-x))^{-1}$, ensuring
    that their values will be in the range $[0, 1]$. They can therefore be viewed
    as soft, differentiable logic gates. The LSTM architecture is shown in Figure
    6.2, and the complete update equations are:


    $\boldsymbol{f}_{m+1} = \sigma(\boldsymbol{\Theta}^{(h \to f)} \boldsymbol{h}_m
    + \boldsymbol{\Theta}^{(x \to f)} \boldsymbol{x}_{m+1} + \boldsymbol{b}_f)$    forget
    gate    [6.35]

    $\boldsymbol{i}_{m+1} = \sigma(\boldsymbol{\Theta}^{(h \to i)} \boldsymbol{h}_m
    + \boldsymbol{\Theta}^{(x \to i)} \boldsymbol{x}_{m+1} + \boldsymbol{b}_i)$    input
    gate    [6.36]

    $\tilde{\boldsymbol{c}}_{m+1} = \tanh(\boldsymbol{\Theta}^{(h \to c)} \boldsymbol{h}_m
    + \boldsymbol{\Theta}^{(w \to c)} \boldsymbol{x}_{m+1})$    update candidate    [6.37]

    $\boldsymbol{c}_{m+1} = \boldsymbol{f}_{m+1} \odot \boldsymbol{c}_m + \boldsymbol{i}_{m+1}
    \odot \tilde{\boldsymbol{c}}_{m+1}$    memory cell update    [6.38]

    $\boldsymbol{o}_{m+1} = \sigma(\boldsymbol{\Theta}^{(h \to o)} \boldsymbol{h}_m
    + \boldsymbol{\Theta}^{(x \to o)} \boldsymbol{x}_{m+1} + \boldsymbol{b}_o)$    output
    gate    [6.39]

    $\boldsymbol{h}_{m+1} = \boldsymbol{o}_{m+1} \odot \tanh(\boldsymbol{c}_{m+1})$    output.    [6.40]


    The operator $\odot$ is an elementwise (Hadamard) product. Each gate is controlled
    by a vector of weights, which parametrize the previous hidden state (e.g., $\boldsymbol{\Theta}^{(h
    \to f)}$) and the current input (e.g., $\boldsymbol{\Theta}^{(x \to f)}$), plus
    a vector offset (e.g., $\boldsymbol{b}_f$). The overall operation can be informally
    summarized as $(\boldsymbol{h}_m, \boldsymbol{c}_m) = \text{LSTM}(\boldsymbol{x}_m,
    (\boldsymbol{h}_{m-1}, \boldsymbol{c}_{m-1}))$, with $(\boldsymbol{h}_m, \boldsymbol{c}_m)$
    representing the LSTM state after reading token $m$.


    The LSTM outperforms standard recurrent neural networks across a wide range of
    problems. It was first used for language modeling by Sundermeyer et al. (2012),
    but can be applied more generally: the vector $\boldsymbol{h}_m$ can be treated
    as a complete representation of'
