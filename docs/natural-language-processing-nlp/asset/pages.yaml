  md: 'where we write \(i|\beta\) to indicate that \(i\) is the leftmost item in the
    input buffer, and \(\sigma|i\) to indicate the result of pushing \(i\) on to stack
    \(\sigma\).


    +   - **ARC-LEFT:** create a new left-facing arc of type \(r\) between the item
    on the top of the stack and the first item in the input buffer. The head of this
    arc is \(j\), which remains at the front of the input buffer. The arc \(j \xrightarrow{r}
    i\) is added to \(A\). Formally,


    \[(\sigma|i, j|\beta, A) \Rightarrow (\sigma, j|\beta, A \oplus j \xrightarrow{r}
    i), \qquad [11.19]\]


    where \(r\) is the label of the dependency arc, and \(\oplus\) concatenates the
    new arc \(j \xrightarrow{r} i\) to the list \(A\).


    +   - **ARC-RIGHT:** creates a new right-facing arc of type \(r\) between the
    item on the top of the stack and the first item in the input buffer. The head
    of this arc is \(i\), which is “popped” from the stack and pushed to the front
    of the input buffer. The arc \(i \xrightarrow{r} j\) is added to \(A\). Formally,


    \[(\sigma|i, j|\beta, A) \Rightarrow (\sigma, i|\beta, A \oplus i \xrightarrow{r}
    j), \qquad [11.20]\]


    where again \(r\) is the label of the dependency arc.


    Each action has preconditions. The SHIFT action can be performed only when the
    buffer has at least one element. The ARC-LEFT action cannot be performed when
    the root node ROOT is on top of the stack, since this node must be the root of
    the entire tree. The ARC-LEFT and ARC-RIGHT remove the modifier words from the
    stack (in the case of ARC-LEFT) and from the buffer (in the case of ARC-RIGHT),
    so it is impossible for any word to have more than one parent. Furthermore, the
    end state can only be reached when every word is removed from the buffer and stack,
    so the set of arcs is guaranteed to constitute a spanning tree. An example arc-standard
    derivation is shown in Table 11.2.


    # Arc-eager dependency parsing


    In the arc-standard transition system, a word is completely removed from the parse
    once it has been made the modifier in a dependency arc. At this time, any dependents
    of this word must have already been identified. Right-branching structures are
    common in English (and many other languages), with words often modified by units
    such as prepositional phrases to their right. In the arc-standard system, this
    means that we must first shift all the units of the input onto the stack, and
    then work backwards, creating a series of arcs, as occurs in Table 11.2. Note
    that the decision to shift *bagels* onto the stack guarantees that the prepositional
    phrase *with lox* will attach to the noun phrase, and that this decision must
    be made before the prepositional phrase is itself parsed. This has been argued
    to be cognitively implausible (Abney and Johnson, 1991); from a computational
    perspective, it means that a parser may need to look several steps ahead to make
    the correct decision.'
  merge: -1
  img_proc: true
