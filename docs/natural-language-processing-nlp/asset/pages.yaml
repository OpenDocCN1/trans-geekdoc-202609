  md: '+   (19.3)

    +     a. Palin actually turned against the bridge project only after it became
    a national symbol of wasteful spending.

    +     b. Ms. Palin supported the bridge project while running for governor, and
    abandoned it after it became a national scandal.


    An *intersection* preserves only the content that is present in both sentences:


    (19.4) Palin turned against the bridge project after it became a national scandal.


    A *union* includes information from both sentences:


    (19.5) Ms. Palin supported the bridge project while running for governor, but
    turned against it when it became a national scandal and a symbol of wasteful spending.


    Dependency parsing is often used as a technique for sentence fusion. After parsing
    each sentence, the resulting dependency trees can be aggregated into a lattice
    (Barzilay and McKeown, 2005) or a graph structure (Filippova and Strube, 2008),
    in which identical or closely related words (e.g., *Palin, bridge, national*)
    are fused into a single node. The resulting graph can then be pruned back to a
    tree by solving an **integer linear program** (see § 13.2.2),


    max_y  Σ_{i,j,r} ψ(i →^r j, w; θ) × y_{i,j,r}   [19.13]

    s.t.  y ∈ C,   [19.14]


    where the variable y_{i,j,r} ∈ {0,1} indicates whether there is an edge from i
    to j of type r, the score of this edge is ψ(i →^r j, w; θ), and C is a set of
    constraints, which ensures that y forms a valid dependency graph. As usual, w
    is the list of words in the graph, and θ is a vector of parameters. The score
    ψ(i →^r j, w; θ) reflects the “importance” of the modifier j to the overall meaning:
    in intersective fusion, this score indicates the extent to which the content in
    this edge is expressed in all sentences; in union fusion, the score indicates
    whether the content in the edge is expressed in any sentence. The constraint set
    C can impose additional linguistic constraints: for example, ensuring that coordinated
    nouns are sufficiently similar. The resulting tree must then be **linearized**
    into a sentence. Linearization is like the inverse of dependency parsing: instead
    of parsing from a sequence of tokens into a tree, we must convert the tree back
    into a sequence of tokens. This is typically done by generating a set of candidate
    linearizations, and choosing the one with the highest score under a language model
    (Langkilde and Knight, 1998; Song et al., 2016).


    # 19.3 Dialogue


    **Dialogue systems** are capable of conversing with a human interlocutor, often
    to perform some task (Grosz, 1979), but sometimes just to chat (Weizenbaum, 1966).
    While re-'
