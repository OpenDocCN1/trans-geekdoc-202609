  md: 'learning. For example, in a task like search, it may be useful to identify
    each word’s **stem**, so that a system can more easily generalize across related
    terms such as *whale*, *whales*, *whalers*, and *whaling*. (This issue is relatively
    benign in English, as compared to the many other languages which include much
    more elaborate systems of prefixed and suffixes.) Such features could be obtained
    from a hand-crafted resource, like a dictionary that maps each word to a single
    root form. Alternatively, features can be obtained from the output of a general-purpose
    language processing system, such as a parser or part-of-speech tagger, which may
    itself be built on supervised machine learning.


    Another synthesis of learning and knowledge is in model structure: building machine
    learning models whose architectures are inspired by linguistic theories. For example,
    the organization of sentences is often described as **compositional**, with meaning
    of larger units gradually constructed from the meaning of their smaller constituents.
    This idea can be built into the architecture of a deep neural network, which is
    then trained using contemporary deep learning techniques (Dyer et al., 2016).


    The debate about the relative importance of machine learning and linguistic knowledge
    sometimes becomes heated. No machine learning specialist likes to be told that
    their engineering methodology is unscientific alchemy;⁵ nor does a linguist want
    to hear that the search for general linguistic principles and structures has been
    made irrelevant by big data. Yet there is clearly room for both types of research:
    we need to know how far we can go with end-to-end learning alone, while at the
    same time, we continue the search for linguistic representations that generalize
    across applications, scenarios, and languages. For more on the history of this
    debate, see Church (2011); for an optimistic view of the potential symbiosis between
    computational linguistics and deep learning, see Manning (2015).


    # 1.2.2 Search and learning


    Many natural language processing problems can be written mathematically in the
    form of optimization,⁶


    ŷ = argmax_{y∈𝒴(x)} Ψ(x, y; θ), [1.1]


    where,


    +   - *x* is the input, which is an element of a set *𝒳*;

    +   - *y* is the output, which is an element of a set *𝒴(x)*;


    ⁵ Ali Rahimi argued that much of deep learning research was similar to “alchemy”
    in a presentation at the 2017 conference on Neural Information Processing Systems.
    He was advocating for more learning theory, not more linguistics.


    ⁶ Throughout this text, equations will be numbered by square brackets, and linguistic
    examples will be numbered by parentheses.'
