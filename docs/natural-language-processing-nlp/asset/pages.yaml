- pgno: 338
  md: '# 13.3.1 **AMR Parsing**


    Abstract Meaning Representation is not a labeling of the original text — unlike
    PropBank semantic role labeling, and most of the other tagging and parsing tasks
    that we have encountered thus far. The AMR for a given sentence may include multiple
    concepts for single words in the sentence: as we have seen, the sentence *Asha
    likes algebra* contains both person and name concepts for the word *Asha*. Conversely,
    words in the sentence may not appear in the AMR: in *Boyang made a tour of campus*,
    the **light verb make** would not appear in the AMR, which would instead be rooted
    on the predicate *tour*. As a result, AMR is difficult to parse, and even evaluating
    AMR parsing involves considerable algorithmic complexity (Cai and Yates, 2013).


    A further complexity is that AMR labeled datasets do not explicitly show the **alignment**
    between the AMR annotation and the words in the sentence. For example, the link
    between the word *wants* and the concept *want-01* is not annotated. To acquire
    training data for learning-based parsers, it is therefore necessary to first perform
    an alignment between the training sentences and their AMR parses. Flanigan et
    al. (2014) introduce a rule-based parser, which links text to concepts through
    a series of increasingly high-recall steps.


    As with dependency parsing, AMR can be parsed by graph-based methods that explore
    the space of graph structures, or by incremental transition-based algorithms.
    One approach to graph-based AMR parsing is to first group adjacent tokens into
    local substructures, and then to search the space of graphs over these substructures
    (Flanigan et al., 2014). The identification of concept subgraphs can be formulated
    as a sequence labeling problem, and the subsequent graph search can be solved
    using integer linear programming (§ 13.2.2). Various transition-based parsing
    algorithms have been proposed. Wang et al. (2015) construct an AMR graph by incrementally
    modifying the *syntactic* dependency graph. At each step, the parser performs
    an action: for example, adding an AMR relation label to the current dependency
    edge, swapping the direction of a syntactic dependency edge, or cutting an edge
    and reattaching the orphaned subtree to a new parent.


    # Additional resources


    Practical semantic role labeling was first made possible by the PropBank annotations
    on the Penn Treebank (Palmer et al., 2005). Abend and Rappoport (2017) survey
    several semantic representation schemes, including semantic role labeling and
    AMR. Other linguistic features of AMR are summarized in the original paper (Banarescu
    et al., 2013) and the tutorial slides by Schneider et al. (2015). Recent shared
    tasks have undertaken semantic dependency parsing, in which the goal is to identify
    semantic relationships between pairs of words (Oepen et al., 2014); see Ivanova
    et al. (2012) for an overview of connections between syntactic and semantic dependencies.'
  merge: -1
