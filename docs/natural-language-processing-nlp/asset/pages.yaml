    \ which are adpositions that appear before their complement. (An exception is\
    \ *ago*, as in, *we met three days ago*). Postpositions are used in other languages,\
    \ such as Japanese and Turkish.\n\n+   - **Auxiliary verbs** (AUX) are a closed\
    \ class of verbs that add information such as tense, aspect, person, and number.\n\
