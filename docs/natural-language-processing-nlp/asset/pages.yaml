  md: 'As in the categorical distribution, the parameter φ_j can be interpreted as
    a probability: specifically, the probability that any given token in the document
    is the word j. The multinomial distribution involves a product over words, with
    each term in the product equal to the probability φ_j, exponentiated by the count
    x_j. Words that have zero count play no role in this product, because φ_j^0 =
    1. The term B(x) is called the **multinomial coefficient**. It doesn’t depend
    on φ, and can usually be ignored. Can you see why we need this term at all?⁹


    The notation p(x | y; φ) indicates the conditional probability of word counts
    x given label y, with parameter φ, which is equal to p_mult(x; φ_y). By specifying
    the multinomial distribution, we describe the **multinomial Naïve Bayes** classifier.
    Why “naïve”? Because the multinomial distribution treats each word token independently,
    conditioned on the class: the probability mass function factorizes across the
    counts.¹⁰


    # 2.2.1 Types and tokens


    A slight modification to the generative model of Naïve Bayes is shown in Algorithm
    2. Instead of generating a vector of counts of types, x, this model generates
    a sequence of tokens, w = (w₁, w₂, …, w_M). The distinction between types and
    tokens is critical: x_j ∈ {0, 1, 2, …, M} is the count of word type j in the vocabulary,
    e.g., the number of times the word cannibal appears; w_m ∈ V is the identity of
    token m in the document, e.g. w_m = cannibal.


    The probability of the sequence w is a product of categorical probabilities. Algorithm
    2 makes a conditional independence assumption: each token w_m^(i) is independent
    of all other tokens w_{n≠m}^(i), conditioned on the label y^(i). This is identical
    to the “naïve” independence assumption implied by the multinomial distribution,
    and as a result, the optimal parameters for this model are identical to those
    in multinomial Naïve Bayes. For any instance, the probability assigned by this
    model is proportional to the probability under multinomial Naïve Bayes. The constant
    of proportionality is the multinomial coefficient B(x). Because B(x) ≥ 1, the
    probability for a vector of counts x is at least as large as the probability for
    a list of words w that induces the same counts: there can be many word sequences
    that correspond to a single vector of counts. For example, man bites dog and dog
    bites man correspond to an identical count vector, {bites : 1, dog : 1, man :
    1}, and B(x) is equal to the total number of possible word orderings for count
    vector x.


    ⁹Technically, a multinomial distribution requires a second parameter, the total
    number of word counts in x. In the bag-of-words representation is equal to the
    number of words in the document. However, this parameter is irrelevant for classification.


    ¹⁰You can plug in any probability distribution to the generative story and it
    will still be Naïve Bayes, as long as you are making the “naïve” assumption that
    the features are conditionally independent, given the label. For example, a multivariate
    Gaussian with diagonal covariance is naïve in exactly the same sense.'
