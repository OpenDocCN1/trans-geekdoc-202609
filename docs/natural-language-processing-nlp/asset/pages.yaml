  md: '**Beam search**  **Beam search** is a general technique for avoiding search
    errors when exhaustive search is impossible; it was first discussed in § 11.3.1.
    Beam search can be seen as a variant of the incremental decoding algorithm sketched
    in Equation 18.50, but at each step *m*, a set of *K* different hypotheses are
    kept on the beam. For each hypothesis *k* ∈ {1, 2, …, *K*}, we compute both the
    current score \(\sum_{m=1}^{M^{(t)}} \psi(w_k^{(t)}; w_{k,m-1}^{(t)}, z)\) as
    well as the current hidden state \(h_k^{(t)}\). At each step in the beam search,
    the *K* top-scoring children of each hypothesis currently on the beam are “expanded”,
    and the beam is updated. For a detailed description of beam search for RNN decoding,
    see Graves (2012).


    **Learning and search**  Conventionally, the learning algorithm is trained to
    predict the right token in the translation, conditioned on the translation history
    being correct. But if decoding must be approximate, then we might do better by
    modifying the learning algorithm to be robust to errors in the translation history.
    **Scheduled sampling** does this by training on histories that sometimes come
    from the ground truth, and sometimes come from the model’s own output (Bengio
    et al., 2015).¹⁰ As training proceeds, the training wheels come off: we increase
    the fraction of tokens that come from the model rather than the ground truth.
    Another approach is to train on an objective that relates directly to beam search
    performance (Wiseman et al., 2016). **Reinforcement learning** has also been applied
    to decoding of RNN-based translation models, making it possible to directly optimize
    translation metrics such as BLEU (Ranzato et al., 2016).


    # ## 18.5  Training towards the evaluation metric


    In likelihood-based training, the objective is the maximize the probability of
    a parallel corpus. However, translations are not evaluated in terms of likelihood:
    metrics like BLEU consider only the correctness of a single output translation,
    and not the range of probabilities that the model assigns. It might therefore
    be better to train translation models to achieve the highest BLEU score possible
    — to the extent that we believe BLEU measures translation quality. Unfortunately,
    BLEU and related metrics are not friendly for optimization: they are discontinuous,
    non-differentiable functions of the parameters of the translation model.


