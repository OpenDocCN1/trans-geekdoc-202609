  md: 'privacy. In these cases, one solution is to publicly release **stand-off annotations**,
    which contain links to document identifiers. The documents themselves can be released
    under the terms of a licensing agreement, which can impose conditions on how the
    data is used. It is important to think through the potential consequences of releasing
    data: people may make personal data publicly available without realizing that
    it could be redistributed in a dataset and publicized far beyond their expectations
    (boyd and Crawford, 2012).


    # Measuring inter-annotator agreement


    To measure the replicability of annotations, a standard practice is to compute
    the extent to which annotators agree with each other. If the annotators frequently
    disagree, this casts doubt on either their reliability or on the annotation system
    itself. For classification, one can compute the frequency with which the annotators
    agree; for rating scales, one can compute the average distance between ratings.
    These raw agreement statistics must then be compared with the rate of agreement
    by chance — the expected level of agreement that would be obtained between two
    annotators who ignored the data.


    **Cohen’s Kappa** is widely used for quantifying the agreement on discrete labeling
    tasks (Cohen, 1960; Carletta, 1996),¹¹


    $$\kappa = \frac{\text{agreement} - E[\text{agreement}]}{1 - E[\text{agreement}]}.$$
    [4.11]


    The numerator is the difference between the observed agreement and the chance
    agreement, and the denominator is the difference between perfect agreement and
    chance agreement. Thus, $\kappa = 1$ when the annotators agree in every case,
    and $\kappa = 0$ when the annotators agree only as often as would happen by chance.
    Various heuristic scales have been proposed for determining when $\kappa$ indicates
    “moderate”, “good”, or “substantial” agreement; for reference, Lee and Narayanan
    (2005) report $\kappa \approx 0.45 - 0.47$ for annotations of emotions in spoken
    dialogues, which they describe as “moderate agreement”; Stolcke et al. (2000)
    report $\kappa = 0.8$ for annotations of **dialogue acts**, which are labels for
    the purpose of each turn in a conversation.


    When there are two annotators, the expected chance agreement is computed as,


    $$E[\text{agreement}] = \sum_k \hat{\Pr}(Y = k)^2,$$ [4.12]


    where $k$ is a sum over labels, and $\hat{\Pr}(Y = k)$ is the empirical probability
    of label $k$ across all annotations. The formula is derived from the expected
    number of agreements if the annotations were randomly shuffled. Thus, in a binary
    labeling task, if one label is applied to 90% of instances, chance agreement is
    $.9^2 + .1^2 = .82$.


    ¹¹ For other types of annotations, Krippendorff’s alpha is a popular choice (Hayes
    and Krippendorff, 2007; Artstein and Poesio, 2008).'
  merge: -1
