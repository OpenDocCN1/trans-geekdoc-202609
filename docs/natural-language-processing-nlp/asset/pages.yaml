  md: "# Algorithm 9 Generative process for the Naïve Bayes classifier with hidden\
    \ components\n\n```\nfor Instance i ∈ {1, 2, …, N} do:\n    Draw the label y^(i)\
    \ ~ Categorical(μ);\n    Draw the component z^(i) ~ Categorical(β_{y^(i)});\n\
    \    Draw the word counts x^(i) | y^(i), z^(i) ~ Multinomial(φ_{z^(i)}).\n```\n\
    \nThe left sum is identical to the objective in Naïve Bayes; the right sum is\
    \ the marginal log-likelihood for expectation-maximization clustering, from Equation\
    \ 5.5. We can construct a lower bound on this log-likelihood by introducing distributions\
    \ q^(j) for all j ∈ {N_ℓ + 1, …, N_ℓ + N_u}. The E-step updates these distributions;\
    \ the M-step updates the parameters φ and μ, using the expected counts from the\
    \ unlabeled data and the observed counts from the labeled data.\n\nA critical\
    \ issue in semi-supervised learning is how to balance the impact of the labeled\
    \ and unlabeled data on the classifier weights, especially when the unlabeled\
    \ data is much larger than the labeled dataset. The risk is that the unlabeled\
    \ data will dominate, causing the parameters to drift towards a “natural clustering”\
    \ of the instances — which may not correspond to a good classifier for the labeled\
    \ data. One solution is to heuristically reweight the two components of Equation\
    \ 5.26, tuning the weight of the two components on a heldout development set (Nigam\
    \ et al., 2000).\n\n# 5.2.3 Multi-component modeling\n\nAs a final application,\
    \ let’s return to fully supervised classification. A classic dataset for text\
    \ classification is 20 newsgroups, which contains posts to a set of online forums,\
    \ called newsgroups. One of the newsgroups is comp.sys.mac.hardware, which discusses\
    \ Apple computing hardware. Suppose that within this newsgroup there are two kinds\
    \ of posts: reviews of new hardware, and question-answer posts about hardware\
    \ problems. The language in these components of the mac.hardware class might have\
    \ little in common; if so, it would be better to model these components separately,\
    \ rather than treating their union as a single class. However, the component responsible\
    \ for each instance is not directly observed.\n\nRecall that Naïve Bayes is based\
    \ on a generative process, which provides a stochastic explanation for the observed\
    \ data. In Naïve Bayes, each label is drawn from a categorical distribution with\
    \ parameter μ, and each vector of word counts is drawn from a multinomial distribution\
    \ with parameter φ_y. For multi-component modeling, we envision a slightly different\
    \ generative process, incorporating both the observed label y^(i) and the latent\
    \ component z^(i). This generative process is shown in Algorithm 9. A new parameter\
    \ β_{y^(i)} defines the distribution of components, conditioned on the label y^(i).\
    \ The component, and not the class label, then parametrizes the distribution over\
    \ words."
  merge: -1
