  md: "# **Algorithm 16** Latent variable perceptron\n\n```\n1: **procedure** LATENT\
    \ VARIABLE PERCEPTRON(\\(w^{(1:N)}, y^{(1:N)}\\))\n2: &nbsp;&nbsp;&nbsp;&nbsp;\\\
    (\\theta \\leftarrow 0\\)\n3: &nbsp;&nbsp;&nbsp;&nbsp;**repeat**\n4: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Select\
    \ an instance \\(i\\)\n5: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\\(z^{(i)}\
    \ \\leftarrow \\underset{z}{\\operatorname{argmax}}\\; \\theta \\cdot f(w^{(i)},\
    \ z, y^{(i)})\\)\n6: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\\(\\hat{y},\
    \ \\hat{z} \\leftarrow \\underset{y',z'}{\\operatorname{argmax}}\\; \\theta \\\
    cdot f(w^{(i)}, z', y')\\)\n7: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\\\
    (\\theta \\leftarrow \\theta + f(w^{(i)}, z^{(i)}, y^{(i)}) - f(w^{(i)}, \\hat{z},\
    \ \\hat{y})\\)\n8: &nbsp;&nbsp;&nbsp;&nbsp;**until** tired\n9: &nbsp;&nbsp;&nbsp;&nbsp;**return**\
    \ \\(\\theta\\)\n```\n\nand general algorithm for learning with missing data.\
    \ The algorithm is shown in its most basic form in Algorithm 16, but the usual\
    \ tricks such as averaging and margin loss can be applied (Yu and Joachims, 2009).\
    \ Aside from semantic parsing, the latent variable perceptron has been used in\
    \ tasks such as machine translation (Liang et al., 2006) and named entity recognition\
    \ (Sun et al., 2009). In **latent conditional random fields**, we use the full\
    \ expectations rather than maximizing over the hidden variable. This model has\
    \ also been employed in a range of problems beyond semantic parsing, including\
    \ parse reranking (Koo and Collins, 2005) and gesture recognition (Quattoni et\
    \ al., 2007).\n\n# ### 12.4.3 &nbsp; Learning from denotations\n\nLogical forms\
    \ are easier to obtain than complete derivations, but the annotation of logical\
    \ forms still requires considerable expertise. However, it is relatively easy\
    \ to obtain denotations for many natural language sentences. For example, in the\
    \ geography domain, the denotation of a question would be its answer (Clarke et\
    \ al., 2010; Liang et al., 2013):\n\n> **Text**: *What states border Georgia?*\n\
    > \n> **Logical form**: \\(\\lambda x.\\mathrm{STATE}(x) \\land \\mathrm{BORDER}(x,\
    \ \\mathrm{GEORGIA})\\)\n> \n> **Denotation**: \\(\\{\\text{Alabama, Florida,\
    \ North Carolina, South Carolina, Tennessee}\\}\\)\n\nSimilarly, in a robotic\
    \ control setting, the denotation of a command would be an action or sequence\
    \ of actions (Artzi and Zettlemoyer, 2013). In both cases, the idea is to reward\
    \ the semantic parser for choosing an analysis whose denotation is correct: the\
    \ right answer to the question, or the right action.\n\nLearning from logical\
    \ forms was made possible by summing or maxing over derivations. This idea can\
    \ be carried one step further, summing or maxing over all logical forms with the\
    \ correct denotation. Let \\(v_i(y) \\in \\{0,1\\}\\) be a **validation function**,\
    \ which assigns a"
