    = p̃(w_k^(t)|w^(s)) / q(w_k^(t);w^(s)). The effect of this weighting is to correct
    for any mismatch between the proposal distribution q and the true distribution
    p̃. The risk can then be approximated as,


    $$\boldsymbol{w}_k^{(t)} \sim q(\boldsymbol{w}^{(s)}) \tag{18.59}$$ $$\omega_k
    = \frac{\tilde{p}(\boldsymbol{w}_k^{(t)} \mid \boldsymbol{w}^{(s)})}{q(\boldsymbol{w}_k^{(t)};
    \boldsymbol{w}^{(s)})} \tag{18.60}$$ $$\tilde{R}(\boldsymbol{\theta}) \approx
    \frac{1}{\sum_{k=1}^{K} \omega_k} \sum_{k=1}^{K} \omega_k \times \Delta(\boldsymbol{w}_k^{(t)},
    \boldsymbol{w}^{(t)}). \tag{18.61}$$


    Importance sampling will generally give a more accurate approximation than uniform
    sampling. The only formal requirement is that the proposal assigns non-zero probability
    to every w^(t) ∈ Y(w^(s)). For more on importance sampling and related methods,
    see Robert and Casella (2013).


    # Additional resources


    A complete textbook on machine translation is available from Koehn (2009). While
    this book precedes recent work on neural translation, a more recent draft chapter
    on neural translation models is also available (Koehn, 2017). Neubig (2017) provides
    a comprehensive tutorial on neural machine translation, starting from first principles.
    The course notes from Cho (2015) are also useful. Several neural machine translation
    libraries are available: LAMTRAM is an implementation of neural machine translation
    in DYNET (Neubig et al., 2017); OPENNMT (Klein et al., 2017) and FAIRSEQ are available
    in PYTORCH;'
