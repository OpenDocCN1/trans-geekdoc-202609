  md: 'q0 and reads symbol a, it stays in q0. Figure 9.1 provides a graphical representation
    of M1. Because each pair of initial state and symbol has at most one resulting
    state, M1 is deterministic: each string ω induces at most one accepting path.
    Note that there are no transitions for the symbol a in state q1; if a is encountered
