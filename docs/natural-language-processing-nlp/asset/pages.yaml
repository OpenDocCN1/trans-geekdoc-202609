    Consider the following FSA, M₁.


    Σ = {a, b}  [9.1]

    Q = {q₀, q₁}  [9.2]

    F = {q₁}  [9.3]

    δ = {(q₀, a) → q₀, (q₀, b) → q₁, (q₁, b) → q₁}.  [9.4]


    This FSA defines a language over an alphabet of two symbols, a and b. The transition
    function δ is written as a set of arcs: (q₀, a) → q₀ says that if the machine
