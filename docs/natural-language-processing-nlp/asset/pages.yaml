    # 8.5 Code switching


    Multilingual speakers and writers do not restrict themselves to a single language.
    **Code switching** is the phenomenon of switching between languages in speech
    and text (Auer, 2013; Poplack, 1980). Written code switching has become more common
    in online social media, as in the following extract from the website of Canadian
    President Justin Trudeau:⁷


    > (8.21) *Although everything written on this site est disponible en anglais*

    >     is available in English

    >     *and in French, my personal videos seront bilinguals*

    >             will be bilingual


    Accurately analyzing such texts requires first determining which languages are
    being used. Furthermore, quantitative analysis of code switching can provide insights
    on the languages themselves and their relative social positions.


    Code switching can be viewed as a sequence labeling problem, where the goal is
    to label each token as a candidate switch point. In the example above, the words
    *est, and,* and *seront* would be labeled as switch points. Solorio and Liu (2008)
    detect English-Spanish switch points using a supervised classifier, with features
    that include the word, its part-of-speech in each language (according to a supervised
    part-of-speech tagger), and the probabilities of the word and part-of-speech in
    each language. Nguyen and Dogruöz (2013) apply a conditional random field to the
    problem of detecting code switching between Turkish and Dutch.


    Code switching is a special case of the more general problem of word level language
    identification, which Barman et al. (2014) address in the context of trilingual
    code switching between Bengali, English, and Hindi. They further observe an even
    more challenging phenomenon: intra-word code switching, such as the use of English
    suffixes with Bengali roots. They therefore mark each token as either (1) belonging
    to one of the three languages; (2) a mix of multiple languages; (3) “universal”
    (e.g., symbols, numbers, emoticons); or (4) undefined.


    ⁷As quoted in http://blogues.lapresse.ca/lagace/2008/09/08/justin-trudeau-really-parfait-bilingue/,
    accessed August 21, 2017.'
