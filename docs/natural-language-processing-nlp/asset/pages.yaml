  md: '# Sentences


    The most common production rule for sentences is,


    S → NP VP

    [9.28]


    which accounts for simple sentences like *Abigail ate the kimchi* — as we will
    see, the direct object *the kimchi* is part of the verb phrase. But there are
    more complex forms of sentences as well:


    S → ADVP NP VP                Unfortunately Abigail ate the kimchi.        [9.29]

    S → S Cc S                    Abigail ate the kimchi and Max had a burger.    [9.30]

    S → VP                        Eat the kimchi.                               [9.31]


    where ADVP is an adverbial phrase (e.g., *unfortunately, very unfortunately*)
    and Cc is a coordinating conjunction (e.g., *and, but*).⁸


    # Noun phrases


    Noun phrases refer to entities, real or imaginary, physical or abstract: *Asha,
    the steamed dumpling, parts and labor, nobody, the whiteness of the whale, and
    the rise of revolutionary syndicalism in the early twentieth century.* Noun phrase
    productions include “bare” nouns, which may optionally follow determiners, as
    well as pronouns:


    NP → NN | NNS | NNP | PRP                [9.32]

    NP → DET NN | DET NNS | DET NNP          [9.33]


    The tags NN, NNS, and NNP refer to singular, plural, and proper nouns; PRP refers
    to personal pronouns, and DET refers to determiners. The grammar also contains
    terminal productions from each of these tags, e.g., PRP → I | you | we | …


    Noun phrases may be modified by adjectival phrases (ADJP; e.g., *the small Russian
    dog*) and numbers (CD; e.g., *the five pastries*), each of which may optionally
    follow a determiner:


    NP → ADJP NN | ADJP NNS | DET ADJP NN | DET ADJP NNS        [9.34]

    NP → CD NNS | DET CD NNS | …                               [9.35]


    Some noun phrases include multiple nouns, such as *the liberation movement* and
    *an antelope horn*, necessitating additional productions:


    NP → NN NN | NN NNS | DET NN NN | …        [9.36]


    ⁸Notice that the grammar does not include the recursive production S → ADVP S.
    It may be helpful to think about why this production would cause the grammar to
    overgenerate.'
