  md: '| Text datasets |  |

    |---|---|

    | \(w_m\) | word token at position \(m\) |

    | \(N\) | number of training instances |

    | \(M\) | length of a sequence (of words or tags) |

    | \(V\) | number of words in vocabulary |

    | \(y^{(i)}\) | the true label for instance \(i\) |

    | \(\hat{y}\) | a predicted label |

    | \(\mathcal{Y}\) | the set of all possible labels |

    | \(K\) | number of possible labels \(K = |\mathcal{Y}|\) |

    | □ | the start token |

    | ■ | the stop token |

    | \(\mathbf{y}^{(i)}\) | a structured label for instance \(i\), such as a tag
    sequence |

    | \(\mathcal{Y}(w)\) | the set of possible labelings for the word sequence \(w\)
    |

    | ◇ | the start tag |

    | ◆ | the stop tag |


    | Probabilities |  |

    |---|---|

    | \(\Pr(A)\) | probability of event \(A\) |

    | \(\Pr(A \mid B)\) | probability of event \(A\), conditioned on event \(B\) |

    | \(p_B(b)\) | the marginal probability of random variable \(B\) taking value
    \(b\); written \(p(b)\) when the choice of random variable is clear from context
    |

    | \(p_{B\mid A}(b \mid a)\) | the probability of random variable \(B\) taking
    value \(b\), conditioned on \(A\) taking value \(a\); written \(p(b \mid a)\)
    when clear from context |

    | \(A \sim p\) | the random variable \(A\) is distributed according to distribution
    \(p\). For example, \(X \sim \mathcal{N}(0,1)\) states that the random variable
    \(X\) is drawn from a normal distribution with zero mean and unit variance. |

    | \(A \mid B \sim p\) | conditioned on the random variable \(B\), \(A\) is distributed
    according to \(p\). |


    | Machine learning |  |

    |---|---|

    | \(\Psi(x^{(i)}, y)\) | the score for assigning label \(y\) to instance \(i\)
    |

    | \(f(x^{(i)}, y)\) | the feature vector for instance \(i\) with label \(y\) |

    | \(\theta\) | a (column) vector of weights |

    | \(\ell^{(i)}\) | loss on an individual instance \(i\) |

    | \(L\) | objective function for an entire dataset |

    | \(\mathcal{L}\) | log-likelihood of a dataset |

    | \(\lambda\) | the amount of regularization |'
