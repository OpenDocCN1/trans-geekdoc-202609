    from Voll and Taboada (2007). Positive and negative sentiment words are underlined,
    indicating RST’s potential utility in document-level sentiment analysis.


    # RST Relations


    Rhetorical structure theory features a large inventory of discourse relations,
    which are divided into two high-level groups: subject matter relations, and presentational
    relations. Presentational relations are organized around the intended beliefs
    of the reader. For example, in (16.8), the second discourse unit provides evidence
    intended to increase the reader’s belief in the proposition expressed by the first
    discourse unit, that LaShawn loves animals. In contrast, subject-matter relations
    are meant to communicate additional facts about the propositions contained in
    the discourse units that they relate:


    (16.10) [the debt plan was rushed to completion]ₙ

    [in order to be announced at the meeting]ₛ⁸


    In this example, the satellite describes a world state that is realized by the
    action described in the nucleus. This relationship is about the world, and not
    about the author’s communicative intentions.


    # Example


    Figure 16.5 depicts an RST analysis of a paragraph from a movie review. Asymmetric
    (subordinating) relations are depicted with an arrow from the satellite to the
    nucleus; symmetric (coordinating) relations are depicted with lines. The elementary
    discourse units 1F and 1G are combined into a larger discourse unit with the symmetric
    Conjunction relation. The resulting discourse unit is then the satellite in a
    Justify relation with 1E.


    ⁸from the RST Treebank (Carlson et al., 2002)'
