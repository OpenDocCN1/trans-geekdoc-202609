  md: '# 2.2 Naïve Bayes


    The joint probability of a bag of words x and its true label y is written p(x,
    y). Suppose we have a dataset of N labeled instances, {(x^(i), y^(i))}_{i=1}^N,
    which we assume are independent and identically distributed (IID) (see § A.3).
    Then the joint probability of the entire dataset, written p(x^(1:N), y^(1:N)),
    is equal to ∏_{i=1}^N p_{X,Y}(x^(i), y^(i)).⁴


    What does this have to do with classification? One approach to classification
    is to set the weights θ so as to maximize the joint probability of a training
    set of labeled documents. This is known as maximum likelihood estimation:


    θ̂ = argmax_θ p(x^(1:N), y^(1:N); θ) [2.8]

    θ̂ = argmax_θ ∏_{i=1}^N p(x^(i), y^(i); θ) [2.9]

    θ̂ = argmax_θ Σ_{i=1}^N log p(x^(i), y^(i); θ). [2.10]


    The notation p(x^(i), y^(i); θ) indicates that θ is a parameter of the probability
    function. The product of probabilities can be replaced by a sum of log-probabilities
    because the log function is monotonically increasing over positive arguments,
    and so the same θ will maximize both the probability and its logarithm. Working
    with logarithms is desirable because of numerical stability: on a large dataset,
    multiplying many probabilities can underflow to zero.⁵


    The probability p(x^(i), y^(i); θ) is defined through a generative model — an
    idealized random process that has generated the observed data.⁶ Algorithm 1 describes
    the generative model underlying the Naïve Bayes classifier, with parameters θ
    = {μ, φ}.


    +   - The first line of this generative model encodes the assumption that the
    instances are mutually independent: neither the label nor the text of document
    i affects the label or text of document j.⁷ Furthermore, the instances are identically
    distributed: the


    ⁴The notation p_{X,Y}(x^(i), y^(i)) indicates the joint probability that random
    variables X and Y take the specific values x^(i) and y^(i) respectively. The subscript
    will often be omitted when it is clear from context. For a review of random variables,
    see Appendix A.


    ⁵Throughout this text, you may assume all logarithms and exponents are base 2,
    unless otherwise indicated. Any reasonable base will yield an identical classifier,
    and base 2 is most convenient for working out examples by hand.


    ⁶Generative models will be used throughout this text. They explicitly define the
    assumptions underlying the form of a probability distribution over observed and
    latent variables. For a readable introduction to generative models in statistics,
    see Blei (2014).


    ⁷Can you think of any cases in which this assumption is too strong?'
  merge: -1
