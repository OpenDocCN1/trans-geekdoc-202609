  md: '# Algorithm 13 The CKY algorithm for parsing a sequence w ∈ Σ* in a context-free
    grammar G = (N, Σ, R, S), with non-terminals N, production rules R, and start
    symbol S. The grammar is assumed to be in Chomsky normal form (§ 9.2.1). The function
    PICKFROM(b[i, j, X]) selects an element of the set b[i, j, X] arbitrarily. All
    values of t and b are initialized to ∅.


    ```

    1: procedure CKY(w, G = (N, Σ, R, S))

    2:   for m ∈ {1 ... M} do

    3:     t[m − 1, m] ← {X : (X → w_m) ∈ R}

    4:   for ℓ ∈ {2, 3, ..., M} do                      ▷ Iterate over constituent
    lengths

    5:     for m ∈ {0, 1, ..., M − ℓ} do                ▷ Iterate over left endpoints

    6:       for k ∈ {m + 1, m + 2, ..., m + ℓ − 1} do  ▷ Iterate over split points

    7:         for (X → Y Z) ∈ R do                    ▷ Iterate over rules

    8:           if Y ∈ t[m, k] ∧ Z ∈ t[k, m + ℓ] then

    9:             t[m, m + ℓ] ← t[m, m + ℓ] ∪ X       ▷ Add non-terminal to table

    10:            b[m, m + ℓ, X] ← b[m, m + ℓ, X] ∪ (Y, Z, k)   ▷ Add back-pointers

    11:  if S ∈ t[0, M] then

    12:    return TRACEBACK(S, 0, M, b)

    13:  else

    14:    return ∅

    15: procedure TRACEBACK(X, i, j, b)

    16:   if j = i + 1 then

    17:     return X

    18:  else

    19:    (Y, Z, k) ← PICKFROM(b[i, j, X])

    20:    return X → (TRACEBACK(Y, i, k, b), TRACEBACK(Z, k, j, b))

    ```


    +   - Productions with more than two elements on the right-hand side can be **binarized**
    by creating additional non-terminals, as described in § 9.2.1. For example, the
    production VP → V NP NP (for ditransitive verbs) can be converted to VP → VP_ditrans/NP
    NP, by adding the non-terminal VP_ditrans/NP and the production VP_ditrans/NP
    → V NP.

    +   - What about unary productions like VP → V? While such productions are not
    a part of Chomsky Normal Form — and can therefore be eliminated in preprocessing
    the grammar — in practice, a more typical solution is to modify the CKY algorithm.
    The algorithm makes a second pass on each diagonal in the table, augmenting each
    cell t[i, j] with all possible unary productions capable of generating each item
    already in the cell: formally, t[i, j] is extended to its **unary closure**. Suppose
    the example grammar in Table 10.1 were extended to include the production VP →
    V, enabling sentences with intransitive verb phrases, like we eat. Then the cell
    t[1, 2] — corresponding to the word eat — would first include the set {V}, and
    would be augmented to the set {V, VP} during this second pass.'
