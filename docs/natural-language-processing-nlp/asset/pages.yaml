  md: '# 7.3 The Viterbi algorithm


    By decomposing the scoring function into a sum of local parts, it is possible
    to rewrite the tagging problem as follows:


    $$\hat{\boldsymbol{y}} = \underset{\boldsymbol{y}\in\mathcal{Y}(\boldsymbol{w})}{\operatorname{argmax}}\,\Psi(\boldsymbol{w},\boldsymbol{y})\tag{7.13}$$
    $$= \underset{\boldsymbol{y}_{1:M}}{\operatorname{argmax}}\,\sum_{m=1}^{M+1}\psi(\boldsymbol{w},y_m,y_{m-1},m)\tag{7.14}$$
    $$= \underset{\boldsymbol{y}_{1:M}}{\operatorname{argmax}}\,\sum_{m=1}^{M+1}s_m(y_m,y_{m-1}),\tag{7.15}$$


    where the final line simplifies the notation with the shorthand,


    $$s_m(y_m,y_{m-1}) \triangleq \psi(\boldsymbol{w}_{1:M},y_m,y_{m-1},m).\tag{7.16}$$


    This inference problem can be solved efficiently using **dynamic programming**,
    an algorithmic technique for reusing work in recurrent computations. We begin
    by solving an auxiliary problem: rather than finding the best tag sequence, we
    compute the score of the best tag sequence,


    $$\max_{\boldsymbol{y}_{1:M}}\Psi(\boldsymbol{w},\boldsymbol{y}_{1:M}) = \max_{\boldsymbol{y}_{1:M}}\sum_{m=1}^{M+1}s_m(y_m,y_{m-1}).\tag{7.17}$$


    This score involves a maximization over all tag sequences of length $M$, written
    $\max_{\boldsymbol{y}_{1:M}}$. This maximization can be broken into two pieces,


    $$\max_{\boldsymbol{y}_{1:M}}\Psi(\boldsymbol{w},\boldsymbol{y}_{1:M}) = \max_{y_M}\max_{\boldsymbol{y}_{1:M-1}}\sum_{m=1}^{M+1}s_m(y_m,y_{m-1}).\tag{7.18}$$


    Within the sum, only the final term $s_{M+1}(\blacklozenge,y_M)$ depends on $y_M$,
    so we can pull this term out of the second maximization,


    $$\max_{\boldsymbol{y}_{1:M}}\Psi(\boldsymbol{w},\boldsymbol{y}_{1:M}) = \left(\max_{y_M}s_{M+1}(\blacklozenge,y_M)\right)
    + \left(\max_{\boldsymbol{y}_{1:M-1}}\sum_{m=1}^{M}s_m(y_m,y_{m-1})\right).\tag{7.19}$$


    The second term in Equation 7.19 has the same form as our original problem, with
    $M$ replaced by $M-1$. This indicates that the problem can be reformulated as
    a recurrence. We do this by defining an auxiliary variable called the Viterbi
    variable $v_m(k)$, representing'
