    The origin of the Naïve Bayes independence assumption is the learning objective,
    p(x^(1:N), y^(1:N)), which requires modeling the probability of the observed text.
    In classification problems, we are always given x, and are only interested in
    predicting the label y. In this setting, modeling the probability of the text
    x seems like a difficult and unnecessary task. Discriminative learning algorithms
    avoid this task, and focus directly on the problem of predicting y.


    # 2.3.1 Perceptron


    In Naïve Bayes, the weights can be interpreted as parameters of a probabilistic
    model. But this model requires an independence assumption that usually does not
    hold, and limits our choice of features. Why not forget about probability and
    learn the weights in an error-driven way? The perceptron algorithm, shown in Algorithm
    3, is one way to do this.


    The algorithm is simple: if you make a mistake, increase the weights for features
    that are active with the correct label y^(i), and decrease the weights for features
    that are active with the guessed label ŷ. Perceptron is an online learning algorithm,
    since the classifier weights change after every example. This is different from
    Naïve Bayes, which is a batch learning algorithm: it computes statistics over
    the entire dataset, and then sets the weights in a single operation. Algorithm
    3 is vague about when this online learning procedure terminates. We will return
    to this issue shortly.


    The perceptron algorithm may seem like an unprincipled heuristic: Naïve Bayes
    has a solid foundation in probability, but the perceptron is just adding and subtracting
    constants from the weights every time there is a mistake. Will this really work?
    In fact, there is some nice theory for the perceptron, based on the concept of
