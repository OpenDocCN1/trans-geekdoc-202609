  md: "is how to estimate the weights on these features. § 2.3 presented three main\
    \ types of discriminative classifiers: perceptron, support vector machine, and\
    \ logistic regression. Each of these classifiers has a structured equivalent,\
    \ enabling it to be trained from labeled sequences rather than individual tokens.\n\
    \n# ### 7.5.1 Structured perceptron\n\nThe perceptron classifier is trained by\
    \ increasing the weights for features that are associated with the correct label,\
    \ and decreasing the weights for features that are associated with incorrectly\
    \ predicted labels:\n\n$$\\hat{y} = \\arg\\max_{y\\in\\mathcal{Y}} \\theta \\\
    cdot f(x,y)$$  \n[7.60]\n\n$$\\theta^{(t+1)} \\leftarrow \\theta^{(t)} + f(x,y)\
    \ - f(x,\\hat{y}).$$  \n[7.61]\n\nWe can apply exactly the same update in the\
    \ case of structure prediction,\n\n$$\\hat{y} = \\arg\\max_{y\\in\\mathcal{Y}(w)}\
    \ \\theta \\cdot f(w,y)$$  \n[7.62]\n\n$$\\theta^{(t+1)} \\leftarrow \\theta^{(t)}\
    \ + f(w,y) - f(w,\\hat{y}).$$  \n[7.63]\n\nThis learning algorithm is called **structured\
    \ perceptron**, because it learns to predict the structured output $y$. The only\
    \ difference is that instead of computing $\\hat{y}$ by enumerating the entire\
    \ set $\\mathcal{Y}$, the Viterbi algorithm is used to efficiently search the\
    \ set of possible taggings, $\\mathcal{Y}^M$. Structured perceptron can be applied\
    \ to other structured outputs as long as efficient inference is possible. As in\
    \ perceptron classification, weight averaging is crucial to get good performance\
    \ (see § 2.3.2).\n\n**Example**  For the example *they can fish*, suppose that\
    \ the reference tag sequence is $y^{(i)} = \\mathrm{N\\ V\\ V}$, but the tagger\
    \ incorrectly returns the tag sequence $\\hat{y} = \\mathrm{N\\ V\\ N}$. Assuming\
    \ a model with features for emissions $(w_m,y_m)$ and transitions $(y_{m-1},y_m)$,\
    \ the corresponding structured perceptron update is:\n\n$$\\theta_{(\\mathrm{fish},\\\
    mathrm{V})} \\leftarrow \\theta_{(\\mathrm{fish},\\mathrm{V})}+1, \\qquad \\theta_{(\\\
    mathrm{fish},\\mathrm{N})} \\leftarrow \\theta_{(\\mathrm{fish},\\mathrm{N})}-1$$\
    \  \n[7.64]\n\n$$\\theta_{(\\mathrm{V},\\mathrm{V})} \\leftarrow \\theta_{(\\\
    mathrm{V},\\mathrm{V})}+1, \\qquad \\theta_{(\\mathrm{V},\\mathrm{N})} \\leftarrow\
    \ \\theta_{(\\mathrm{V},\\mathrm{N})}-1$$  \n[7.65]\n\n$$\\theta_{(\\mathrm{V},\\\
    blacklozenge)} \\leftarrow \\theta_{(\\mathrm{V},\\blacklozenge)}+1, \\qquad \\\
    theta_{(\\mathrm{N},\\blacklozenge)} \\leftarrow \\theta_{(\\mathrm{N},\\blacklozenge)}-1$$\
    \  \n[7.66]\n\n# ### 7.5.2 Structured support vector machines\n\nLarge-margin\
    \ classifiers such as the support vector machine improve on the perceptron by\
    \ pushing the classification boundary away from the training instances. The same\
    \ idea can"
