    Figure 3.4: A convolutional neural network for text classification


    A simple filter might compute a weighted average over nearby words,


    $$\mathbf{C}^{(k)} = \begin{bmatrix} 0.5 & 1 & 0.5 \\ 0.5 & 1 & 0.5 \\ \dots &
    \dots & \dots \\ 0.5 & 1 & 0.5 \end{bmatrix}, \qquad [3.54]$$


    thereby representing trigram units like *not so unpleasant*. In **one-dimensional
    convolution**, each filter matrix $\mathbf{C}^{(k)}$ is constrained to have non-zero
    values only at row $k$ (Kalchbrenner et al., 2014). This means that each dimension
    of the word embedding is processed by a separate filter, and it implies that $K_f
    = K_e$.


    To deal with the beginning and end of the input, the base matrix $\mathbf{X}^{(0)}$
    may be padded with $h$ column vectors of zeros at the beginning and end; this
    is known as **wide convolution**. If padding is not applied, then the output from
    each layer will be $h - 1$ units smaller than the input; this is known as **narrow
    convolution**. The filter matrices need not have identical filter widths, so more
    generally we could write $h_k$ to indicate to width of filter $\mathbf{C}^{(k)}$.
    As suggested by the notation $\mathbf{X}^{(0)}$, multiple layers of convolution
    may be applied, so that $\mathbf{X}^{(d)}$ is the input to $\mathbf{X}^{(d+1)}$.


    After $D$ convolutional layers, we obtain a matrix representation of the document
    $\mathbf{X}^{(D)} \in \mathbb{R}^{K_z \times M}$. If the instances have variable
    lengths, it is necessary to aggregate over all $M$ word positions to obtain a
    fixed-length representation. This can be done by a **pooling** operation,'
