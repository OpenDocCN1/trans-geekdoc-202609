    In context-free grammars, each phrase type is a non-terminal, and each constituent
    is the substring that the non-terminal yields. Grammar design involves choosing
    the right set of non-terminals. Fine-grained non-terminals make it possible to
    represent more fine-grained linguistic phenomena. For example, by distinguishing
    singular and plural noun phrases, it is possible to have a grammar of English
    that generates only sentences that obey subject-verb agreement. However, enforcing
    subject-verb agreement is considerably more complicated in languages like Spanish,
    where the verb must agree in both person and number with subject. In general,
    grammar designers must trade off between overgeneration — a grammar that permits
    ungrammatical sentences — and undergeneration — a grammar that fails to generate
    grammatical sentences. Furthermore, if the grammar is to support manual annotation
    of syntactic structure, it must be simple enough to annotate efficiently.


    # 9.2.3 A phrase-structure grammar for English


    To better understand how phrase-structure grammar works, let’s consider the specific
    case of the Penn Treebank grammar of English. The main phrase categories in the
    Penn Treebank (PTB) are based on the main part-of-speech classes: noun phrase
    (NP), verb phrase (VP), prepositional phrase (PP), adjectival phrase (ADJP), and
    adverbial phrase (ADVP). The top-level category is S, which conveniently stands
    in for both “sentence” and the “start” symbol. Complement clauses (e.g., I take
    the good old fashioned ground that the whale is a fish) are represented by the
    non-terminal SBAR. The terminal symbols in the grammar are individual words, which
    are generated from unary productions from part-of-speech tags (the PTB tagset
    is described in § 8.1).


    This section describes some of the most common productions from the major phrase-level
    categories, explaining how to generate individual tag sequences. The production
    rules are approached in a “theory-driven” manner: first the syntactic properties
    of each phrase type are described, and then some of the necessary production rules
    are listed. But it is important to keep in mind that the Penn Treebank was produced
    in a “data-driven” manner. After the set of non-terminals was specified, annotators
    were free to analyze each sentence in whatever way seemed most linguistically
    accurate, subject to some high-level guidelines. The grammar of the Penn Treebank
    is simply the set of productions that were required to analyze the several million
    words of the corpus. By design, the grammar overgenerates — it does not exclude
    ungrammatical sentences. Furthermore, while the productions shown here cover some
    of the most common cases, they are only a small fraction of the several thousand
    different types of productions in the Penn Treebank.'
