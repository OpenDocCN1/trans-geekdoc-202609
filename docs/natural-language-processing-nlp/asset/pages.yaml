  md: '# Chapter 19


    # Text generation


    In many of the most interesting problems in natural language processing, language
    is the output. The previous chapter described the specific case of machine translation,
    but there are many other applications, from summarization of research articles,
    to automated journalism, to dialogue systems. This chapter emphasizes three main
    scenarios: data-to-text, in which text is generated to explain or describe a structured
    record or unstructured perceptual input; text-to-text, which typically involves
    fusing information from multiple linguistic sources into a single coherent summary;
    and dialogue, in which text is generated as part of an interactive conversation
    with one or more human participants.


    # 19.1 Data-to-text generation


    In data-to-text generation, the input ranges from structured records, such as
    the description of an weather forecast (as shown in Figure 19.1), to unstructured
    perceptual data, such as a raw image or video; the output may be a single sentence,
    such as an image caption, or a multi-paragraph argument. Despite this diversity
    of conditions, all data-to-text systems share some of the same challenges (Reiter
    and Dale, 2000):


    +   - determining what parts of the data to describe;

    +   - planning a presentation of this information;

    +   - lexicalizing the data into words and phrases;

    +   - organizing words and phrases into well-formed sentences and paragraphs.


    The earlier stages of this process are sometimes called content selection and
    text planning; the later stages are often called surface realization.


    Early systems for data-to-text generation were modular, with separate software
    components for each task. Artificial intelligence planning algorithms can be applied
    to both'
