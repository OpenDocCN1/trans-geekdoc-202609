- pgno: 190
  md: 'Each recurrence that we have seen so far is a special case of this generalized
    Viterbi recurrence:


    +   - In the max-product Viterbi recurrence over probabilities, the ⊕ operation
    corresponds to maximization, and the ⊗ operation corresponds to multiplication.

    +   - In the forward recurrence over probabilities, the ⊕ operation corresponds
    to addition, and the ⊗ operation corresponds to multiplication.

    +   - In the max-product Viterbi recurrence over log-probabilities, the ⊕ operation
    corresponds to maximization, and the ⊗ operation corresponds to addition.¹²

    +   - In the forward recurrence over log-probabilities, the ⊕ operation corresponds
    to log-addition, a ⊕ b = log(e^a + e^b). The ⊗ operation corresponds to addition.


    The mathematical abstraction offered by semiring notation can be applied to the
    software implementations of these algorithms, yielding concise and modular implementations.
    For example, in the OpenFST library, generic operations are parametrized by the
    choice of semiring (Allauzen et al., 2007).


    # Exercises


    +   1. Extend the example in § 7.3.1 to the sentence they can can fish, meaning
    that “they can put fish into cans.” Build the trellis for this example using the
    weights in Table 7.1, and identify the best-scoring tag sequence. If the scores
    for noun and verb are tied, then you may assume that the backpointer always goes
    to noun.

    +   2. Using the tagset 𝒴 = {N, V}, and the feature set f(w_m, y_m, y_{m−1}, m)
    = {(w_m, y_m), (y_m, y_{m−1})}, show that there is no set of weights that give
    the correct tagging for both they can fish (N V V) and they can can fish (N V
    V N).

    +   3. Work out what happens if you train a structured perceptron on the two examples
    mentioned in the previous problem, using the transition and emission features
    (y_m, y_{m−1}) and (y_m, w_m). Initialize all weights at 0, and assume that the
    Viterbi algorithm always chooses N when the scores for the two tags are tied,
    so that the initial prediction for they can fish is N N N.

    +   4. Consider the garden path sentence, The old man the boat. Given word-tag
    and tag-tag features, what inequality in the weights must hold for the correct
    tag sequence to outscore the garden path tag sequence for this example?


    ¹²This is sometimes called the tropical semiring, in honor of the Brazilian mathematician
    Imre Simon.'
  merge: -1
