  md: 'of the topping (PEACHES). In a **partially observable Markov decision process
    (POMDP)**, the system receives an *observation* o, which is probabilistically
    conditioned on the state, p(o | s). It must therefore maintain a distribution
    of beliefs about which state it is in, with q_t(s) indicating the degree of belief
    that the dialogue is in state s at time t. The POMDP formulation can help to make
    dialogue systems more robust to errors, particularly in the context of spoken
    language dialogues, where the speech itself may be misrecognized (Roy et al.,
    2000; Williams and Young, 2007). However, finding the optimal policy in a POMDP
    is computationally intractable, requiring additional approximations.


    # 19.3.3 Neural chatbots


    It’s easier to talk when you don’t need to get anything done. **Chatbots** are
    systems that parry the user’s input with a response that keeps the conversation
    going. They can be built from the encoder-decoder architecture discussed in §
    18.3 and § 19.1.2: the encoder converts the user’s input into a vector, and the
    decoder produces a sequence of words as a response. For example, Shang et al.
    (2015) apply the attentional encoder-decoder translation model, training on a
    dataset of posts and responses from the Chinese microblogging platform Sina Weibo.⁵
    This approach is capable of generating replies that relate thematically to the
    input, as shown in the following examples (translated from Chinese by Shang et
    al., 2015).


    +   (19.8) a. A: High fever attacks me every New Year’s day.

    +       B: Get well soon and stay healthy!

    +     b. A: I gain one more year. Grateful to my group, so happy.

    +       B: Getting old now. Time has no mercy.


    While encoder-decoder models can generate responses that make sense in the context
    of the immediately preceding turn, they struggle to maintain coherence over longer
    conversations. One solution is to model the dialogue context recurrently. This
    creates a **hierarchical recurrent network**, including both word-level and turn-level
    recurrences. The turn-level hidden state is then used as additional context in
    the decoder (Serban et al., 2016).


    An open question is how to integrate the encoder-decoder architecture into task-oriented
    dialogue systems. Neural chatbots can be trained end-to-end: the user’s turn is
    analyzed by the encoder, and the system output is generated by the decoder. This
    architecture can be trained by log-likelihood using backpropagation (e.g., Sordoni
    et al., 2015; Serban et al., 2016), or by more elaborate objectives, using reinforcement
    learning (Li et al., 2016). In contrast, the task-oriented dialogue systems described
