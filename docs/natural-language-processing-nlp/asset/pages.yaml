  md: 'where *f* is an elementwise activation function, such as σ or ReLU, and ℓ⁽ⁱ⁾
    is the loss at instance *i*. The parameters Θ⁽ˣ→ᶻ⁾, Θ⁽ᶻ→ʸ⁾, and **b** can be estimated
    using online gradient-based optimization. The simplest such algorithm is stochastic
    gradient descent, which was discussed in § 2.6. Each parameter is updated by the
    gradient of the loss,


    $$\begin{aligned}

    \mathbf{b} &\leftarrow \mathbf{b}-\eta^{(t)}\nabla_{\mathbf{b}}\ell^{(i)} \tag{3.24}\\

    \theta_k^{(z\to y)} &\leftarrow \theta_k^{(z\to y)}-\eta^{(t)}\nabla_{\theta_k^{(z\to
    y)}}\ell^{(i)} \tag{3.25}\\

    \theta_n^{(x\to z)} &\leftarrow \theta_n^{(x\to z)}-\eta^{(t)}\nabla_{\theta_n^{(x\to
    z)}}\ell^{(i)}. \tag{3.26}

    \end{aligned}$$


    where η⁽ᵗ⁾ is the learning rate on iteration *t*, ℓ⁽ⁱ⁾ is the loss on instance
    (or minibatch) *i*, and θₙ⁽ˣ→ᶻ⁾ is column *n* of the matrix Θ⁽ˣ→ᶻ⁾, and θₖ⁽ᶻ→ʸ⁾
    is column *k* of Θ⁽ᶻ→ʸ⁾.


    The gradients of the negative log-likelihood on **b** and θₖ⁽ᶻ→ʸ⁾ are similar
    to the gradients in logistic regression. For θₖ⁽ᶻ→ʸ⁾, the gradient is,


    $$\nabla_{\theta_k^{(z\to y)}}\ell^{(i)}=\left[\frac{\partial\ell^{(i)}}{\partial\theta_{k,1}^{(z\to
    y)}},\frac{\partial\ell^{(i)}}{\partial\theta_{k,2}^{(z\to y)}},\ldots,\frac{\partial\ell^{(i)}}{\partial\theta_{k,K_y}^{(z\to
    y)}}\right]^\mathsf{T} \tag{3.27}$$


    $$\begin{aligned}

    \frac{\partial\ell^{(i)}}{\partial\theta_{k,j}^{(z\to y)}}

    &=-\frac{\partial}{\partial\theta_{k,j}^{(z\to y)}}\left(\theta_{y^{(i)}}^{(z\to
    y)}\cdot\mathbf{z}-\log\sum_{y\in\mathcal{Y}}\exp\theta_y^{(z\to y)}\cdot\mathbf{z}\right)
    \tag{3.28}\\

    &=\left(\Pr(y=j\mid\mathbf{z};\mathbf{\Theta}^{(z\to y)},\mathbf{b})-\delta\left(j=y^{(i)}\right)\right)z_k,
    \tag{3.29}

    \end{aligned}$$


    where δ(*j* = *y*⁽ⁱ⁾) is a function that returns one when *j* = *y*⁽ⁱ⁾, and zero
    otherwise. The gradient ∇ᵦℓ⁽ⁱ⁾ is similar to Equation 3.29.


    The gradients on the input layer weights Θ⁽ˣ→ᶻ⁾ are obtained by the chain rule
    of differentiation:


    $$\begin{aligned}

    \frac{\partial\ell^{(i)}}{\partial\theta_{n,k}^{(x\to z)}}

    &=\frac{\partial\ell^{(i)}}{\partial z_k}\frac{\partial z_k}{\partial\theta_{n,k}^{(x\to
    z)}} \tag{3.30}\\

    &=\frac{\partial\ell^{(i)}}{\partial z_k}\frac{\partial f\left(\theta_k^{(x\to
    z)}\cdot\mathbf{x}\right)}{\partial\theta_{n,k}^{(x\to z)}} \tag{3.31}\\

    &=\frac{\partial\ell^{(i)}}{\partial z_k}\times f''\left(\theta_k^{(x\to z)}\cdot\mathbf{x}\right)\times
    x_n, \tag{3.32}

    \end{aligned}$$


    where *f′*(θₖ⁽ˣ→ᶻ⁾ · **x**) is the derivative of the activation function *f*,
    applied at the input'
