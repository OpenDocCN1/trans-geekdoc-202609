  md: '# 17.2.2 Relation extraction as a classification task


    Relation extraction can be formulated as a classification problem,


    $$\hat{r}_{(i,j),(m,n)} = \arg\max_{r \in \mathcal{R}} \Psi(r, (i,j), (m,n), \boldsymbol{w}),
    \tag{17.11}$$


    where $r \in \mathcal{R}$ is a relation type (possibly NIL), $\boldsymbol{w}_{i+1:j}$
    is the span of the first argument, and $\boldsymbol{w}_{m+1:n}$ is the span of
    the second argument. The argument $\boldsymbol{w}_{m+1:n}$ may appear before or
    after $\boldsymbol{w}_{i+1:j}$ in the text, or they may overlap; we stipulate
    only that $\boldsymbol{w}_{i+1:j}$ is the first argument of the relation. We now
    consider three alternatives for computing the scoring function.


    # Feature-based classification


    In a feature-based classifier, the scoring function is defined as,


    $$\Psi(r, (i,j), (m,n), \boldsymbol{w}) = \boldsymbol{\theta} \cdot \boldsymbol{f}(r,
    (i,j), (m,n), \boldsymbol{w}), \tag{17.12}$$


    with $\boldsymbol{\theta}$ representing a vector of weights, and $\boldsymbol{f}(\cdot)$
    a vector of features. The pattern-based methods described in § 17.2.1 suggest
    several features:


    +   - Local features of $\boldsymbol{w}_{i+1:j}$ and $\boldsymbol{w}_{m+1:n}$,
    including: the strings themselves; whether they are recognized as entities, and
    if so, which type; whether the strings are present in a **gazetteer** of entity
    names; each string’s syntactic head (§ 9.2.2).

    +   - Features of the span between the two arguments, $\boldsymbol{w}_{j+1:m}$
    or $\boldsymbol{w}_{n+1:i}$ (depending on which argument appears first): the length
    of the span; the specific words that appear in the span, either as a literal sequence
    or a bag-of-words; the wordnet synsets (§ 4.2) that appear in the span between
    the arguments.

    +   - Features of the syntactic relationship between the two arguments, typically
