    # Grammar equivalence and Chomsky Normal Form


    A single context-free language can be expressed by more than one context-free
    grammar. For example, the following two grammars both define the language aⁿbⁿ
    for n > 0.


    ```

    S → aSb | ab

    S → aSb | aabb | ab

    ```


    Two grammars are weakly equivalent if they generate the same strings. Two grammars
    are strongly equivalent if they generate the same strings via the same derivations.
    The grammars above are only weakly equivalent.


