  md: 'β(i, j, X) is the score of having a phrase of type X covering the span (i +
    1 : j), joint with the exterior context w_{1:i} and w_{j+1:M}. In a PCFG, this
    corresponds to the log probability log p((X, i + 1, j), w_{1:i}, w_{j+1:M}). Each
    outside variable is computed by the recurrence,


    exp β(i, j, X) ≐ Σ_{(Y→X Z)} Σ_{k=j+1}^{M} exp[ψ(Y → X Z, (i, k, j)) + α(j, k,
    Z) + β(i, k, Y)] [10.27]

    + Σ_{(Y→Z X)} Σ_{k=0}^{i-1} exp[ψ(Y → Z X, (k, i, j)) + α(k, i, Z) + β(k, j, Y)]
    . [10.28]


    The first line of Equation 10.28 is the score under the condition that X is a
    left child of its parent, which spans w_{i+1:k}, with k > j; the second line is
    the score under the condition that X is a right child of its parent Y, which spans
    w_{k+1:j}, with k < i. The two cases are shown in Figure 10.3. In each case, we
    sum over all possible productions with X on the right-hand side. The parent Y
    is bounded on one side by either i or j, depending on whether X is a left or right
    child of Y; we must sum over all possible values for the other boundary. The initial
    conditions for the outside recurrence are β(0, M, S) = 0 and β(0, M, X ≠ S) =
    −∞.


    The marginal probability of a non-terminal X over span w_{i+1:j} is written p(X
    ~ w_{i+1:j} | w). This probability can be computed from the inside and outside
    scores,


    p(X ~ w_{i+1:j} | w) = p(X ~ w_{i+1:j}, w) / p(w) [10.29]

    = p(w_{i+1:j} | X) × p(X, w_{1:i}, w_{j+1:M}) / p(w) [10.30]

    = exp(α(i, j, X) + β(i, j, X)) / exp α(0, M, S) . [10.31]


    Marginal probabilities of individual productions can be computed similarly (see
    exercise 2). These marginal probabilities can be used for training a conditional
    random field parser, and also for the task of unsupervised grammar induction,
    in which a PCFG is estimated from a dataset of unlabeled text (Lari and Young,
    1990; Pereira and Schabes, 1992).'
  merge: -1
