  md: '![](img/ba66a8f6f22adeb28512d560b999a231_226_0.png)


    Figure 9.11: A context-free grammar for arithmetic expressions


    +   - a finite set of **non-terminals** $N$;

    +   - a finite alphabet $\Sigma$ of **terminal symbols**;

    +   - a set of **production rules** $R$, each of the form $A \to \beta$, where
    $A \in N$ and $\beta \in (\Sigma \cup N)^*$;

    +   - a designated start symbol $S$.


    In the production rule $A \to \beta$, the left-hand side (LHS) $A$ must be a non-terminal;
    the right-hand side (RHS) can be a sequence of terminals or non-terminals, $\{n,\sigma\}^*$,
    $n \in N, \sigma \in \Sigma$. A non-terminal can appear on the left-hand side
    of many production rules. A non-terminal can appear on both the left-hand side
    and the right-hand side; this is a **recursive production**, and is analogous
    to self-loops in finite state automata. The name “context-free” is based on the
    property that the production rule depends only on the LHS, and not on its ancestors
    or neighbors; this is analogous to Markov property of finite state automata, in
    which the behavior at each step depends only on the current state, and not on
    the path by which that state was reached.


    A derivation $\tau$ is a sequence of steps from the start symbol $S$ to a surface
    string $w \in \Sigma^*$, which is the **yield** of the derivation. A string $w$
    is in a context-free language if there is some derivation from $S$ yielding $w$.
    **Parsing** is the problem of finding a derivation for a string in a grammar.
    Algorithms for parsing are described in chapter 10.


    Like regular expressions, context-free grammars define the language but not the
    computation necessary to recognize it. The context-free analogues to finite state
    acceptors are **pushdown automata**, a theoretical model of computation in which
    input symbols can be pushed onto a stack with potentially infinite depth. For
    more details, see Sipser (2012).


    # Example


    Figure 9.11 shows a context-free grammar for arithmetic expressions such as $1+2\div3-4$.
    In this grammar, the terminal symbols include the digits $\{1,\ 2,\ \ldots,\ 9\}$
    and the operators $\{+, -, \times, \div\}$. The rules include the $\mid$ symbol,
    a notational convenience that makes it possible to specify multiple right-hand
    sides on a single line: the statement $A \to x\mid y$'
