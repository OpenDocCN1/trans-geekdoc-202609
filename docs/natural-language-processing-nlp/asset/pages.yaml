    in this text are part of this consensus.


    # Computer Science


    The discrete and recursive nature of natural language invites the application
    of theoretical ideas from computer science. Linguists such as Chomsky and Montague
    have shown how formal language theory can help to explain the syntax and semantics
    of natural language. Theoretical models such as finite-state and pushdown automata
    are the basis for many practical natural language processing systems. Algorithms
    for searching the combinatorial space of analyses of natural language utterances
    can be analyzed in terms of their computational complexity, and theoretically
    motivated approximations can sometimes be applied.


    The study of computer systems is also relevant to natural language processing.
    Large datasets of unlabeled text can be processed more quickly by parallelization
    techniques like MapReduce (Dean and Ghemawat, 2008; Lin and Dyer, 2010); high-volume
    data sources such as social media can be summarized efficiently by approximate
    streaming and sketching techniques (Goyal et al., 2009). When deep neural networks
    are implemented in production systems, it is possible to eke out speed gains using
    techniques such as reduced-precision arithmetic (Wu et al., 2016). Many classical
    natural language processing algorithms are not naturally suited to graphics processing
    unit (GPU) parallelization, suggesting directions for further research at the
    intersection of natural language processing and computing hardware (Yi et al.,
    2011).


    # Speech Processing


    Natural language is often communicated in spoken form, and speech recognition
    is the task of converting an audio signal to text. From one perspective, this
    is a signal processing problem, which might be viewed as a preprocessing step
    before natural language processing can be applied. However, context plays a critical
    role in speech recognition by human listeners: knowledge of the surrounding words
    influences perception and helps to correct for noise (Miller et al., 1951). For
    this reason, speech recognition is often integrated with text analysis, particularly
    with statistical language models, which quantify the probability of a sequence
    of text (see chapter 6). Beyond speech recognition, the broader field of speech
    processing includes the study of speech-based dialogue systems, which are briefly
    discussed in chapter 19. Historically, speech processing has often been pursued
    in electrical engineering departments, while natural language processing'
