  md: '![](img/ba66a8f6f22adeb28512d560b999a231_113_0.png)


    Figure 5.1: Counts of words from two different context groups


    bank, the immediate context might typically include words from one of the following
    two groups:


    +   1. financial, deposits, credit, lending, capital, markets, regulated, reserve,
    liquid, assets

    +   2. land, water, geography, stream, river, flow, deposits, discharge, channel,
    ecology


    Now consider a scatterplot, in which each point is a document containing the word
    bank. The location of the document on the x-axis is the count of words in group
    1, and the location on the y-axis is the count for group 2. In such a plot, shown
    in Figure 5.1, two “blobs” might emerge, and these blobs correspond to the different
    senses of bank.


    Here’s a related scenario, from a different problem. Suppose you download thousands
    of news articles, and make a scatterplot, where each point corresponds to a document:
    the x-axis is the frequency of the group of words (hurricane, winds, storm); the
    y-axis is the frequency of the group (election, voters, vote). This time, three
    blobs might emerge: one for documents that are largely about a hurricane, another
    for documents largely about a election, and a third for documents about neither
    topic.


    These clumps represent the underlying structure of the data. But the two-dimensional
    scatter plots are based on groupings of context words, and in real scenarios these
    word lists are unknown. Unsupervised learning applies the same basic idea, but
    in a high-dimensional space with one dimension for every context word. This space
    can’t be directly visualized, but the goal is the same: try to identify the underlying
    structure of the observed data, such that there are a few clusters of points,
    each of which is internally coherent. Clustering algorithms are capable of finding
    such structure automatically.


