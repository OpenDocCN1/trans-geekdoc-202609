  md: '# 1.2 Three themes in natural language processing


    Natural language processing covers a diverse range of tasks, methods, and linguistic
    phenomena. But despite the apparent incommensurability between, say, the summarization
    of scientific articles (§ 16.3.4) and the identification of suffix patterns in
    Spanish verbs (§ 9.1.4), some general themes emerge. The remainder of the introduction
    focuses on these themes, which will recur in various forms through the text. Each
    theme can be expressed as an opposition between two extreme viewpoints on how
    to process natural language. The methods discussed in the text can usually be
    placed somewhere on the continuum between these two extremes.


    # 1.2.1 Learning and knowledge


    A recurring topic of debate is the relative importance of machine learning and
    linguistic knowledge. On one extreme, advocates of “natural language processing
    from scratch” (Collobert et al., 2011) propose to use machine learning to train
    end-to-end systems that transmute raw text into any desired output structure:
    e.g., a summary, database, or translation. On the other extreme, the core work
    of natural language processing is sometimes taken to be transforming text into
    a stack of general-purpose linguistic structures: from subword units called morphèmes,
    to word-level parts-of-speech, to tree-structured representations of grammar,
    and beyond, to logic-based representations of meaning. In theory, these general-purpose
    structures should then be able to support any desired application.


    The end-to-end approach has been buoyed by recent results in computer vision and
    speech recognition, in which advances in machine learning have swept away expert-engineered
    representations based on the fundamentals of optics and phonology (Krizhevsky
    et al., 2012; Graves and Jaitly, 2014). But while machine learning is an element
    of nearly every contemporary approach to natural language processing, linguistic
    representations such as syntax trees have not yet gone the way of the visual edge
    detector or the auditory triphone. Linguists have argued for the existence of
    a “language faculty” in all human beings, which encodes a set of abstractions
    specially designed to facilitate the understanding and production of language.
    The argument for the existence of such a language faculty is based on the observation
    that children learn language faster and from fewer examples than would be possible
    if language was learned from experience alone.⁴ From a practical standpoint, linguistic
    structure seems to be particularly important in scenarios where training data
    is limited.


    There are a number of ways in which knowledge and learning can be combined in
    natural language processing. Many supervised learning systems make use of carefully
    engineered features, which transform the data into a representation that can facilitate


    ⁴The Language Instinct (Pinker, 2003) articulates these arguments in an engaging
    and popular style. For arguments against the innateness of language, see Elman
    et al. (1998).'
