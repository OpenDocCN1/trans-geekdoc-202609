  md: '# Hierarchical discourse parsing


    The goal of discourse parsing is to recover a hierarchical structural analysis
    from a document text, such as the analysis in Figure 16.5. For now, let’s assume
    a segmentation of the document into elementary discourse units (EDUs); segmentation
    algorithms are discussed below. After segmentation, discourse parsing can be viewed
    as a combination of two components: the discourse relation classification techniques
    discussed in § 16.3.1, and algorithms for phrase-structure parsing, such as chart
    parsing and shift-reduce, which were discussed in chapter 10.


    Both chart parsing and shift-reduce require encoding composite discourse units,
    either in a discrete feature vector or a dense neural representation.⁹ Some discourse
    parsers rely on the strong compositionality criterion (Marcu, 1996), which states
    the assumption that a composite discourse unit can be represented by its nucleus.
    This criterion is used in feature-based discourse parsing to determine the feature
    vector for a composite discourse unit (Hernault et al., 2010); it is used in neural
    approaches to setting the vector encoding for a composite discourse unit equal
    to the encoding of its nucleus (Ji and Eisenstein, 2014). An alternative neural
    approach is to learn a composition function over the components of a composite
    discourse unit (Li et al., 2014), using a recursive neural network (see § 14.8.3).


    # Bottom-up discourse parsing


    Assume a segmentation of the text into N elementary discourse units with base
    representations {z^(i)}^N_{i=1}, and assume a composition function COMPOSE (z^(i),
    z^(j), ℓ), which maps two encodings and a discourse relation ℓ into a new encoding.
    The composition function can follow the strong compositionality criterion and
    simply select the encoding of the nucleus, or it can do something more complex.
    We also need a scoring function Ψ(z^(i,k), z^(k,j), ℓ), which computes a scalar
    score for the (binarized) discourse relation ℓ with left child covering the span
    i + 1 : k, and the right child covering the span k + 1 : j. Given these components,
    we can construct vector representations for each span, and this is the basic idea
    underlying compositional vector grammars (Socher et al., 2013).


    These same components can also be used in bottom-up parsing, in a manner that
    is similar to the CKY algorithm for weighted context-free grammars (see § 10.1):
    compute the score and best analysis for each possible span of increasing lengths,
