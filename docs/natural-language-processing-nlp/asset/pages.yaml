  md: '![](img/ba66a8f6f22adeb28512d560b999a231_351_0.png)


    (a) Continuous bag-of-words (CBOW)


    ![](img/ba66a8f6f22adeb28512d560b999a231_351_1.png)


    (b) Skipgram


    Figure 14.3: The CBOW and skipgram variants of WORD2VEC. The parameter U is the
    matrix of word embeddings, and each v_m is the context embedding for word w_m.


    the words at the beginning of the algorithm. For more details on the algorithm,
    see Liang (2005).


    # 14.5 Neural word embeddings


    Neural word embeddings combine aspects of the previous two methods: like latent
    semantic analysis, they are a continuous vector representation; like Brown clusters,
    they are trained from a likelihood-based objective. Let the vector u_i represent
    the K-dimensional embedding for word i, and let v_j represent the K-dimensional
    embedding for context j. The inner product u_i · v_j represents the compatibility
    between word i and context j. By incorporating this inner product into an approximation
    to the log-likelihood of a corpus, it is possible to estimate both parameters
    by backpropagation. WORD2VEC (Mikolov et al., 2013) includes two such approximations:
    continuous bag-of-words (CBOW) and skipgrams.


    # 14.5.1 Continuous bag-of-words (CBOW)


    In recurrent neural network language models, each word w_m is conditioned on a
    recurrently-updated state vector, which is based on word representations going
    all the way back to the beginning of the text. The continuous bag-of-words (CBOW)
    model is a simplification: the local context is computed as an average of embeddings
    for words in the immediate neighborhood m − h, m − h + 1, …, m + h − 1, m + h,


    $$\overline{v}_m = \frac{1}{2h} \sum_{n=1}^{h} v_{w_{m+n}} + v_{w_{m-n}}. \tag{14.14}$$


    Thus, CBOW is a bag-of-words model, because the order of the context words does
    not matter; it is continuous, because rather than conditioning on the words themselves,
    we condition on a continuous vector constructed from the word embeddings. The
    parameter h determines the neighborhood size, which Mikolov et al. (2013) set
    to h = 4.'
