  md: '# Chapter 2


    # Linear text classification


    We begin with the problem of **text classification**: given a text document, assign
    it a discrete label $y \in \mathcal{Y}$, where $\mathcal{Y}$ is the set of possible
    labels. Text classification has many applications, from spam filtering to the
    analysis of electronic health records. This chapter describes some of the most
    well known and effective algorithms for text classification, from a mathematical
    perspective that should help you understand what they do and why they work. Text
    classification is also a building block in more elaborate natural language processing
    tasks. For readers without a background in machine learning or statistics, the
    material in this chapter will take more time to digest than most of the subsequent
    chapters. But this investment will pay off as the mathematical principles behind
    these basic classification algorithms reappear in other contexts throughout the
    book.


    # 2.1 The bag of words


    To perform text classification, the first question is how to represent each document,
    or instance. A common approach is to use a column vector of word counts, e.g.,
    $x = [0,1,1,0,0,2,0,1,13,0 \dots]^\top$, where $x_j$ is the count of word $j$.
    The length of $x$ is $V \triangleq |\mathcal{V}|$, where $\mathcal{V}$ is the
    set of possible words in the vocabulary. In linear classification, the classification
    decision is based on a weighted sum of individual feature counts, such as word
    counts.


    The object $x$ is a vector, but it is often called a **bag of words**, because
    it includes only information about the count of each word, and not the order in
    which the words appear. With the bag of words representation, we are ignoring
    grammar, sentence boundaries, paragraphs — everything but the words. Yet the bag
    of words model is surprisingly effective for text classification. If you see the
    word *whale* in a document, is it fiction or non-fiction? What if you see the
    word *molybdenum*? For many labeling problems, individual words can be strong
    predictors.'
