- pgno: 64
  md: '# Chapter 3


    # Nonlinear classification


    Linear classification may seem like all we need for natural language processing.
    The bag-of-words representation is inherently high dimensional, and the number
    of features is often larger than the number of labeled training instances. This
    means that it is usually possible to find a linear classifier that perfectly fits
    the training data, or even to fit any arbitrary labeling of the training instances!
    Moving to nonlinear classification may therefore only increase the risk of overfitting.
    Furthermore, for many tasks, **lexical features** (words) are meaningful in isolation,
    and can offer independent evidence about the instance label — unlike computer
    vision, where individual pixels are rarely informative, and must be evaluated
    holistically to make sense of an image. For these reasons, natural language processing
    has historically focused on linear classification.


    But in recent years, nonlinear classifiers have swept through natural language
    processing, and are now the default approach for many tasks (Manning, 2015). There
    are at least three reasons for this change.


    +   - There have been rapid advances in **deep learning**, a family of nonlinear
    methods that learn complex functions of the input through multiple layers of computation
    (Goodfellow et al., 2016).

    +   - Deep learning facilitates the incorporation of **word embeddings**, which
    are dense vector representations of words. Word embeddings can be learned from
    large amounts of unlabeled data, and enable generalization to words that do not
    appear in the annotated training data (word embeddings are discussed in detail
    in chapter 14).

    +   - While CPU speeds have plateaued, there have been rapid advances in specialized
    hardware called graphics processing units (GPUs), which have become faster, cheaper,
    and easier to program. Many deep learning models can be implemented efficiently
    on GPUs, offering substantial performance improvements over CPU-based computing.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'This chapter focuses on **neural networks**, which are the dominant approach
    for non-linear classification in natural language processing today.¹ Historically,
    a few other non-linear learning methods have been applied to language data.


    +   - **Kernel methods** are generalizations of the **nearest-neighbor** classification
    rule, which classifies each instance by the label of the most similar example
    in the training set. The application of the **kernel support vector machine**
    to information extraction is described in chapter 17.

    +   - **Decision trees** classify instances by checking a set of conditions. Scaling
    decision trees to bag-of-words inputs is difficult, but decision trees have been
    successful in problems such as coreference resolution (chapter 15), where more
    compact feature sets can be constructed (Soon et al., 2001).

    +   - **Boosting** and related **ensemble methods** work by combining the predictions
    of several “weak” classifiers, each of which may consider only a small subset
    of features. Boosting has been successfully applied to text classification (Schapire
    and Singer, 2000) and syntactic analysis (Abney et al., 1999), and remains one
    of the most successful methods on machine learning competition sites such as Kaggle
    (Chen and Guestrin, 2016).


    Hastie et al. (2009) provide an excellent overview of these techniques.


    # 3.1 Feedforward neural networks


    Consider the problem of building a classifier for movie reviews. The goal is to
    predict a label *y* ∈ {GOOD, BAD, OKAY} from a representation of the text of each
    document, *x*. But what makes a good movie? The story, acting, cinematography,
    editing, soundtrack, and so on. Now suppose the training set contains labels for
    each of these additional features, *z* = [*z*₁, *z*₂, …, *z*ₖ₍z₎]ᵀ. With a training
    set of such information, we could build a two-step classifier:


    +   1. **Use the text *x* to predict the features *z***. Specifically, train a
    logistic regression classifier to compute p(*z*ₖ | *x*), for each *k* ∈ {1, 2,
    …, *K*₍z₎}.

    +   2. **Use the features *z* to predict the label *y***. Again, train a logistic
    regression classifier to compute p(*y* | *z*). On test data, *z* is unknown, so
    we will use the probabilities p(*z* | *x*) from the first layer as the features.


    This setup is shown in Figure 3.1, which describes the proposed classifier in
    a **computation graph**: the text features *x* are connected to the middle layer
    *z*, which is connected to the label *y*.


    ¹I will use “deep learning” and “neural networks” interchangeably.'
