  md: '# (8.2) Teacher Strikes Idle Children


    can also be explained in terms of parts of speech: in the interpretation that
    was likely intended, *strikes* is a noun and *idle* is a verb; in the alternative
    explanation, *strikes* is a verb and *idle* is an adjective.


    Part-of-speech tagging is often taken as a early step in a natural language processing
    pipeline. Indeed, parts-of-speech provide features that can be useful for many
    of the tasks that we will encounter later, such as parsing (chapter 10), coreference
    resolution (chapter 15), and relation extraction (chapter 17).


    # 8.1.1 Parts-of-Speech


    The **Universal Dependencies** project (UD) is an effort to create syntactically-annotated
    corpora across many languages, using a single annotation standard (Nivre et al.,
    2016). As part of this effort, they have designed a part-of-speech **tagset**,
    which is meant to capture word classes across as many languages as possible.¹
    This section describes that inventory, giving rough definitions for each of tags,
    along with supporting examples.


    Part-of-speech tags are **morphosyntactic**, rather than semantic, categories.
    This means that they describe words in terms of how they pattern together and
    how they are internally constructed (e.g., what suffixes and prefixes they include).
    For example, you may think of a noun as referring to objects or concepts, and
    verbs as referring to actions or events. But events can also be nouns:


    (8.3) … the **howling** of the **shrieking** storm.


    Here *howling* and *shrieking* are events, but grammatically they act as a noun
    and adjective respectively.


    # The Universal Dependency part-of-speech tagset


