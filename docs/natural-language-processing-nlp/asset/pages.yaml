  md: 'discourse unit is computed from its arguments and from a parameter corresponding
    to the discourse relation (Ji and Smith, 2017).


    Shallow, non-hierarchical discourse relations have also been applied to document
    classification. One approach is to impose a set of constraints on the analyses
    of individual discourse units, so that adjacent units have the same polarity when
    they are connected by a discourse relation indicating agreement, and opposite
    polarity when connected by a contrastive discourse relation, indicating disagreement
    (Somasundaran et al., 2009; Zirn et al., 2011). Yang and Cardie (2014) apply explicitly-marked
    relations from the Penn Discourse Treebank to the problem of sentence-level sentiment
    polarity classification (see § 4.1). They impose the following soft constraints:


    +   - When a CONTRAST relation appears at the beginning of a sentence, the sentence
    should have the opposite sentiment polarity as its predecessor.

    +   - When an EXPANSION or CONTINGENCY appears at the beginning of a sentence,
    it should have the same polarity as its predecessor.

    +   - When a CONTRAST relation appears within a sentence, the sentence should
    have neutral polarity, since it is likely to express both sentiments.


    These discourse-driven constraints are shown to improve performance on two datasets
    of product reviews.


    # Coherence


    Just as grammaticality is the property shared by well-structured sentences, coherence
    is the property shared by well-structured discourses. One application of discourse
    processing is to measure (and maximize) the coherence of computer-generated texts
    like translations and summaries (Kibble and Power, 2004). Coherence assessment
    is also used to evaluate human-generated texts, such as student essays (e.g.,
    Miltsakaki and Kukich, 2004; Burstein et al., 2013).


    Coherence subsumes a range of phenomena, many of which have been highlighted earlier
    in this chapter: e.g., that adjacent sentences should be lexically cohesive (Foltz
    et al., 1998; Ji et al., 2015; Li and Jurafsky, 2017), and that entity references
    should follow the principles of centering theory (Barzilay and Lapata, 2008; Nguyen
    and Joty, 2017). Discourse relations also bear on the coherence of a text in a
    variety of ways:


    +   - Hierarchical discourse relations tend to have a “canonical ordering” of
    the nucleus and satellite (Mann and Thompson, 1988): for example, in the ELABORATION
    relation from rhetorical structure theory, the nucleus always comes first, while
    in the JUSTIFICATION relation, the satellite tends to be first (Marcu, 1997b).'
