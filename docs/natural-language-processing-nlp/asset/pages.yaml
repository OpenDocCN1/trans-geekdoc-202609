    # 18.3.1 Neural attention


    The sequence-to-sequence model discussed in the previous section was a radical
    departure from statistical machine translation, in which each word or phrase in
    the target language is conditioned on a single word or phrase in the source language.
    Both approaches have advantages. Statistical translation leverages the idea of
    compositionality — translations of large units should be based on the translations
    of their component parts — and this seems crucial if we are to scale translation
    to longer units of text. But the translation of each word or phrase often depends
    on the larger context, and encoder-decoder models capture this context at the
    sentence level.


