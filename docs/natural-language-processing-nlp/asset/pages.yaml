  md: '# **Algorithm 1** Generative process for the Naïve Bayes classification model


    +   - for Instance \(i \in \{1,2,\ldots,N\}\) do:

    +     - Draw the label \(y^{(i)} \sim \mathrm{Categorical}(\mu)\);

    +     - Draw the word counts \(x^{(i)} \mid y^{(i)} \sim \mathrm{Multinomial}(\phi_{y^{(i)}})\).


    distributions over the label \(y^{(i)}\) and the text \(x^{(i)}\) (conditioned
    on \(y^{(i)}\)) are the same for all instances \(i\). In other words, we make
    the assumption that every document has the same distribution over labels, and
    that each document’s distribution over words depends only on the label, and not
    on anything else about the document. We also assume that the documents don’t affect
    each other: if the word *whale* appears in document \(i = 7\), that does not make
    it any more or less likely that it will appear again in document \(i = 8\).


    +   - The second line of the generative model states that the random variable
    \(y^{(i)}\) is drawn from a categorical distribution with parameter \(\mu\). Categorical
    distributions are like weighted dice: the column vector \(\mu = [\mu_1; \mu_2;
    \ldots; \mu_K]\) gives the probabilities of each label, so that the probability
    of drawing label \(y\) is equal to \(\mu_y\). For example, if \(\mathcal{Y} =
    \{\text{POSITIVE}, \text{NEGATIVE}, \text{NEUTRAL}\}\), we might have \(\mu =
    [0.1; 0.7; 0.2]\). We require \(\sum_{y \in \mathcal{Y}} \mu_y = 1\) and \(\mu_y
    \geq 0,\ \forall y \in \mathcal{Y}\): each label’s probability is non-negative,
    and the sum of these probabilities is equal to one.⁸


    +   - The third line describes how the bag-of-words counts \(x^{(i)}\) are generated.
    By writing \(x^{(i)} \mid y^{(i)}\), this line indicates that the word counts
    are conditioned on the label, so that the joint probability is factored using
    the chain rule,


    \[\mathrm{p}_{X,Y}(x^{(i)}, y^{(i)}) = \mathrm{p}_{X\mid Y}(x^{(i)} \mid y^{(i)})
    \times \mathrm{p}_{Y}(y^{(i)}). \tag{2.11}\]


    The specific distribution \(\mathrm{p}_{X\mid Y}\) is the **multinomial**, which
    is a probability distribution over vectors of non-negative counts. The probability
    mass function for this distribution is:


