- pgno: 26
  md: 'When a model is capable of making subtle linguistic distinctions, it is said
    to be *expressive*. Expressiveness is often traded off against efficiency of search
    and learning. For example, a word-to-word translation model makes search and learning
    easy, but it is not expressive enough to distinguish good translations from bad
    ones. Many of the most important problems in natural language processing seem
    to require expressive models, in which the complexity of search grows exponentially
    with the size of the input. In these models, exact search is usually impossible.
    Intractability threatens the neat modular decomposition between search and learning:
    if search requires a set of heuristic approximations, then it may be advantageous
    to learn a model that performs well under these specific heuristics. This has
    motivated some researchers to take a more integrated approach to search and learning,
    as briefly mentioned in chapters 11 and 15.


    # 1.2.3 Relational, compositional, and distributional perspectives


    Any element of language — a word, a phrase, a sentence, or even a sound — can
    be described from at least three perspectives. Consider the word *journalist*.
    A *journalist* is a subcategory of a *profession*, and an *anchorwoman* is a subcategory
    of *journalist*; furthermore, a *journalist* performs *journalism*, which is often,
    but not always, a subcategory of *writing*. This relational perspective on meaning
    is the basis for semantic **ontologies** such as **WordNet** (Fellbaum, 2010),
    which enumerate the relations that hold between words and other elementary semantic
    units. The power of the relational perspective is illustrated by the following
    example:


    (1.3) Umashanthi interviewed Ana. She works for the college newspaper.


    Who works for the college newspaper? The word *journalist*, while not stated in
    the example, implicitly links the *interview* to the *newspaper*, making *Umashanthi*
    the most likely referent for the pronoun. (A general discussion of how to resolve
    pronouns is found in chapter 15.)


    Yet despite the inferential power of the relational perspective, it is not easy
    to formalize computationally. Exactly which elements are to be related? Are *journalists*
    and *reporters* distinct, or should we group them into a single unit? Is the kind
    of *interview* performed by a journalist the same as the kind that one undergoes
    when applying for a job? Ontology designers face many such thorny questions, and
    the project of ontology design hearkens back to Borges’ (1993) *Celestial Emporium
    of Benevolent Knowledge*, which divides animals into:


    +   - (a) belonging to the emperor; (b) embalmed; (c) tame; (d) suckling pigs;
    (e) sirens; (f) fabulous; (g) stray dogs; (h) included in the present classification;
    (i) frenzied; (j) innumerable; (k) drawn with a very fine camelhair brush; (l)
    etcetera; (m) having just broken the water pitcher; (n) that from a long way off
    resemble flies.'
