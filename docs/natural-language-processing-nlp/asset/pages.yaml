    # 17.2.1 Pattern-based relation extraction


    Early work on relation extraction focused on hand-crafted patterns (Hearst, 1992).
    For example, the appositive Starbuck, a native of Nantucket signals the relation
    ENTITY-ORIGIN between Starbuck and Nantucket. This pattern can be written as,


    PERSON , a native of LOCATION ⇒ ENTITY-ORIGIN(PERSON, LOCATION). [17.10]


    This pattern will be “triggered” whenever the literal string , a native of occurs
    between an entity of type PERSON and an entity of type LOCATION. Such patterns
    can be generalized beyond literal matches using techniques such as lemmatization,
    which would enable the words (buy, buys, buying) to trigger the same patterns
    (see § 4.3.1). A more aggressive strategy would be to group all words in a WordNet
    synset (§ 4.2), so that, e.g., buy and purchase trigger the same patterns.


    Relation extraction patterns can be implemented in finite-state automata (§ 9.1).
    If the named entity recognizer is also a finite-state machine, then the systems
    can be combined by finite-state transduction (Hobbs et al., 1997). This makes
    it possible to propagate uncertainty through the finite-state cascade, and disambiguate
    from higher-level context. For example, suppose the entity recognizer cannot decide
    whether Starbuck refers to either a PERSON or a LOCATION; in the composed transducer,
    the relation extractor would be free to select the PERSON annotation when it appears
    in the context of an appropriate pattern.'
