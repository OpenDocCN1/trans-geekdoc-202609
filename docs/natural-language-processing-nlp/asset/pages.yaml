    # Text normalization


    After splitting the text into tokens, the next question is which tokens are really
    distinct. Is it necessary to distinguish great, Great, and GREAT? Sentence-initial
    capitalization may be irrelevant to the classification task. Going further, the
    complete elimination of case distinctions will result in a smaller vocabulary,
    and thus smaller feature vectors. However, case distinctions might be relevant
    in some situations: for example, apple is a delicious pie filling, while Apple
    is a company that specializes in proprietary dongles and power adapters.


    For Roman script, case conversion can be performed using unicode string libraries.
    Many scripts do not have case distinctions (e.g., the Devanagari script used for
    South Asian languages, the Thai alphabet, and Japanese kana), and case conversion
    for all scripts may not be available in every programming environment. (Unicode
    support is an important distinction between Python’s versions 2 and 3, and is
    a good reason for migrating to Python 3 if you have not already done so. Compare
    the output of the code "\à l\''hôtel".upper() in the two language versions.)


    Case conversion is a type of text normalization, which refers to string transformations
    that remove distinctions that are irrelevant to downstream applications (Sproat
    et al., 2001). Other forms of normalization include the standardization of numbers
    (e.g., 1,000 to 1000) and dates (e.g., August 11, 2015 to 2015/11/08). Depending
    on the application, it may even be worthwhile to convert all numbers and dates
    to special tokens, !NUM and !DATE. In social media, there are additional orthographic
    phenomena that may be normalized, such as expressive lengthening, e.g., cooooool
    (Aw et al., 2006; Yang and Eisenstein, 2013). Similarly, historical texts feature
    spelling variations that may need to be normalized to a contemporary standard
    form (Baron and Rayson, 2008).


    A more extreme form of normalization is to eliminate inflectional affixes, such
    as the -ed and -s suffixes in English. On this view, whale, whales, and whaling
    all refer to the same underlying concept, so they should be grouped into a single
    feature. A stemmer is a program for eliminating affixes, usually by applying a
    series of regular expression substitutions. Character-based stemming algorithms
    are necessarily approximate, as shown in Figure 4.2: the Lancaster stemmer incorrectly
    identifies -ers as an inflectional suffix of'
