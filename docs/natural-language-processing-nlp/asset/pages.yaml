  md: '| Tokenizer | Output tokens |

    |---|---|

    | **Whitespace** | Isn’t · Ahab, · Ahab? · ;) |

    | **Treebank** | Is · n’t · Ahab · , · Ahab · ? · ; · ) |

    | **Tweet** | Isn’t · Ahab · , · Ahab · ? · ;) |

    | **TokTok (Dehdari, 2014)** | Isn · ’ · t · Ahab · , · Ahab · ? · ; · ) |


    Figure 4.1: The output of four NLTK tokenizers, applied to the string *Isn’t Ahab,
    Ahab? ;)*


    # Tokenization


    The first subtask for constructing a bag-of-words vector is **tokenization**:
    converting the text from a sequence of characters to a sequence of **word!tokens**.
    A simple approach is to define a subset of characters as whitespace, and then
    split the text on these tokens. However, whitespace-based tokenization is not
    ideal: we may want to split conjunctions like *isn’t* and hyphenated phrases like
    *prize-winning* and *half-asleep*, and we likely want to separate words from commas
    and periods that immediately follow them. At the same time, it would be better
    not to split abbreviations like *U.S.* and *Ph.D.* In languages with Roman scripts,
    tokenization is typically performed using regular expressions, with modules designed
    to handle each of these cases. For example, the NLTK package includes a number
    of tokenizers (Loper and Bird, 2002); the outputs of four of the better-known
    tokenizers are shown in Figure 4.1. Social media researchers have found that emoticons
    and other forms of orthographic variation pose new challenges for tokenization,
    leading to the development of special purpose tokenizers to handle these phenomena
    (O’Connor et al., 2010).


    Tokenization is a language-specific problem, and each language poses unique challenges.
    For example, Chinese does not include spaces between words, nor any other consistent
    orthographic markers of word boundaries. A “greedy” approach is to scan the input
    for character substrings that are in a predefined lexicon. However, Xue et al.
    (2003) notes that this can be ambiguous, since many character sequences could
    be segmented in multiple ways. Instead, he trains a classifier to determine whether
    each Chinese character, or **hanzi**, is a word boundary. More advanced sequence
    labeling methods for word segmentation are discussed in § 8.4. Similar problems
    can occur in languages with alphabetic scripts, such as German, which does not
    include whitespace in compound nouns, yielding examples such as *Freundschaftsbezeigungen*
    (demonstration of friendship) and *Dilettantenaufdringlichkeiten* (the importunities
    of dilettantes). As Twain (1997) argues, “*These things are not words, they are
    alphabetic processions.*” Social media raises similar problems for English and
    other languages, with hashtags such as *#TrueLoveInFourWords* requiring decomposition
    for analysis (Brun and Roux, 2014).'
