  md: '# 15.1.2 Proper Nouns


    If a proper noun is used as a referring expression, it often corefers with another
    proper noun, so that the coreference problem is simply to determine whether the
    two names match. Subsequent proper noun references often use a shortened form,
    as in the running example (Figure 15.1):


    (15.12) Apple Inc Chief Executive [Tim Cook] has jetted into China ... [Cook]
    is on his first business trip to the country ...


    A typical solution for proper noun coreference is to match the syntactic head
    words of the reference with the referent. In § 10.5.2, we saw that the head word
    of a phrase can be identified by applying head percolation rules to the phrasal
    parse tree; alternatively, the head can be identified as the root of the dependency
    subtree covering the name. For sequences of proper nouns, the head word will be
    the final token.


    There are a number of caveats to the practice of matching head words of proper
    nouns.


    +   - In the European tradition, family names tend to be more specific than given
    names, and family names usually come last. However, other traditions have other
    practices: for example, in Chinese names, the family name typically comes first;
    in Japanese, honorifics come after the name, as in Nobu-San (Mr. Nobu).

    +   - In organization names, the head word is often not the most informative,
    as in Georgia Tech and Virginia Tech. Similarly, Lebanon does not refer to the
    same entity as Southern Lebanon, necessitating special rules for the specific
    case of geographical modifiers (Lee et al., 2011).

    +   - Proper nouns can be nested, as in [the CEO of [Microsoft]], resulting in
    head word match without coreference.


    Despite these difficulties, proper nouns are the easiest category of references
    to resolve (Stoyanov et al., 2009). In machine learning systems, one solution
    is to include a range of matching features, including exact match, head match,
    and string inclusion. In addition to matching features, competitive systems (e.g.,
    Bengtson and Roth, 2008) include large lists, or gazetteers, of acronyms (e.g,
    the National Basketball Association/NBA), demonyms (e.g., the Israelis/Israel),
    and other aliases (e.g., the Georgia Institute of Technology/Georgia Tech).


    # 15.1.3 Nominals


    In coreference resolution, noun phrases that are neither pronouns nor proper nouns
    are referred to as nominals. In the running example (Figure 15.1), nominal references
    include: the firm (Apple Inc); the firm''s biggest growth market (China); and
    the country (China).'
  merge: -1
