  md: "```\n**Algorithm 7** Bootstrap sampling for classifier evaluation. The original\
    \ test set is \\(\\{x^{(1:N)}, y^{(1:N)}\\}\\), the metric is \\(\\delta(\\cdot)\\\
    ), and the number of samples is \\(M\\).\n\n**procedure** BOOTSTRAP-SAMPLE(\\\
    (x^{(1:N)}, y^{(1:N)}, \\delta(\\cdot), M\\))\n\n    **for** \\(t \\in \\{1,2,\\\
    ldots,M\\}\\) **do**\n        **for** \\(i \\in \\{1,2,\\ldots,N\\}\\) **do**\n\
    \            \\(j \\sim \\operatorname{UniformInteger}(1,N)\\)\n            \\\
    (\\tilde{x}^{(i)} \\leftarrow x^{(j)}\\)\n            \\(\\tilde{y}^{(i)} \\leftarrow\
    \ y^{(j)}\\)\n        \\(d^{(t)} \\leftarrow \\delta(\\tilde{x}^{(1:N)}, \\tilde{y}^{(1:N)})\\\
    )\n    **return** \\(\\{d^{(t)}\\}_{t=1}^{M}\\)\n```\n\nAs the number of bootstrap\
    \ samples goes to infinity, \\(M \\to \\infty\\), the bootstrap estimate is increasingly\
    \ accurate. A typical choice for \\(M\\) is \\(10^4\\) or \\(10^5\\); larger numbers\
    \ of samples are necessary for smaller \\(p\\)-values. One way to validate your\
    \ choice of \\(M\\) is to run the test multiple times, and ensure that the \\\
    (p\\)-values are similar; if not, increase \\(M\\) by an order of magnitude. This\
    \ is a heuristic measure of the **variance** of the test, which can decrease with\
    \ the square root \\(\\sqrt{M}\\) (Robert and Casella, 2013).\n\n# 4.4.4 *Multiple\
    \ comparisons\n\nSometimes it is necessary to perform multiple hypothesis tests,\
    \ such as when comparing the performance of several classifiers on multiple datasets.\
    \ Suppose you have five datasets, and you compare four versions of your classifier\
    \ against a baseline system, for a total of 20 comparisons. Even if none of your\
    \ classifiers is better than the baseline, there will be some chance variation\
    \ in the results, and in expectation you will get one statistically significant\
    \ improvement at \\(p = 0.05 = \\frac{1}{20}\\). It is therefore necessary to\
    \ adjust the \\(p\\)-values when reporting the results of multiple comparisons.\n\
    \nOne approach is to require a threshold of \\(\\frac{\\alpha}{m}\\) to report\
    \ a \\(p\\) value of \\(p < \\alpha\\) when performing \\(m\\) tests. This is\
    \ known as the **Bonferroni correction**, and it limits the overall probability\
    \ of incorrectly rejecting the null hypothesis at \\(\\alpha\\). Another approach\
    \ is to bound the **false discovery rate** (FDR), which is the fraction of null\
    \ hypothesis rejections that are incorrect. Benjamini and Hochberg (1995) propose\
    \ a \\(p\\)-value correction that bounds the fraction of false discoveries at\
    \ \\(\\alpha\\): sort the \\(p\\)-values of each individual test in ascending\
    \ order, and set the significance threshold equal to largest \\(k\\) such that\
    \ \\(p_k \\leq \\frac{k}{m}\\alpha\\). If \\(k > 1\\), the FDR adjustment is more\
    \ permissive than the Bonferroni correction."
