  md: '# Appendix B


    # Numerical optimization


    Unconstrained numerical optimization involves solving problems of the form,


    $$\min_{x \in \mathbb{R}^D} f(x),$$ [B.1]


    where $x \in \mathbb{R}^D$ is a vector of $D$ real numbers.


    Differentiation is fundamental to numerical optimization. Suppose that at some
    $x^*$, every partial derivative of $f$ is equal to 0: formally, $\left.\frac{\partial
    f}{\partial x_i}\right|_{x^*} = 0$. Then $x^*$ is said to be a **critical point**
    of $f$. If $f$ is a **convex** function (defined in § 2.4), then the value of
    $f(x^*)$ is equal to the global minimum of $f$ iff $x^*$ is a critical point of
    $f$.


    As an example, consider the convex function $f(x) = (x-2)^2+3$, shown in Figure
    B.1a. The derivative is $\frac{\partial f}{\partial x} = 2x-4$. A unique minimum
    can be obtained by setting the derivative equal to zero and solving for $x$, obtaining
    $x^* = 2$. Now consider the multivariate convex function $f(x) = \frac{1}{2}\|x
    - [2,1]^\top\|^2$, where $\|x\|^2$ is the squared Euclidean norm. The partial


    ![](img/ba66a8f6f22adeb28512d560b999a231_502_0.png)


    ![](img/ba66a8f6f22adeb28512d560b999a231_502_1.png)


    (a) The function $f(x) = (x - 2)^2 + 3$


    (b) The function $f(x) = |x| - 2\cos(x)$


