    # 9.1.1 Finite state acceptors


    A regular expression defines a regular language, but does not give an algorithm
    for determining whether a string is in the language that it defines. Finite state
    automata are theoretical models of computation on regular languages, which involve
    transitions between a finite number of states. The most basic type of finite state
    automaton is the finite state acceptor (FSA), which describes the computation
    involved in testing if a string is a member of a language. Formally, a finite
    state acceptor is a tuple M = (Q, Σ, q₀, F, δ), consisting of:


    +   - a finite alphabet Σ of input symbols;

    +   - a finite set of states Q = {q₀, q₁, ..., qₘ};

    +   - a start state q₀ ∈ Q;

    +   - a set of final states F ⊆ Q;

    +   - a transition function δ : Q × (Σ ∪ {ε}) → 2^Q. The transition function maps
    from a state and an input symbol (or empty string ε) to a set of possible resulting
    states.


    A path in M is a sequence of transitions, π = t₁, t₂, ..., t_N, where each t_i
    traverses an arc in the transition function δ. The finite state acceptor M accepts
    a string ω if there is an accepting path, in which the initial transition t₁ begins
    at the start state q₀, the final transition t_N terminates in a final state in
    Q, and the entire input ω is consumed.


