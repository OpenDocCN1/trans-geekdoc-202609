    # 18.2.1 Statistical translation modeling


    The simplest decomposition of the translation model is word-to-word: each word
    in the source should be aligned to a word in the translation. This approach presupposes
    an alignment $\mathcal{A}(\boldsymbol{w}^{(s)}, \boldsymbol{w}^{(t)})$, which
    contains a list of pairs of source and target tokens. For example, given $\boldsymbol{w}^{(s)}
    = A$ Vinay le gusta Python and $\boldsymbol{w}^{(t)} = Vinay$ likes Python, one
    possible word-to-word alignment is,


    $\mathcal{A}(\boldsymbol{w}^{(s)}, \boldsymbol{w}^{(t)}) = \{(A, \varnothing),
    (Vinay, Vinay), (le, likes), (gusta, likes), (Python,Python)\}.$ [18.7]


    This alignment is shown in Figure 18.3. Another, less promising, alignment is:


    $\mathcal{A}(\boldsymbol{w}^{(s)}, \boldsymbol{w}^{(t)}) = \{(A, Vinay), (Vinay,
    likes), (le, Python), (gusta, \varnothing), (Python, \varnothing)\}.$ [18.8]


    Each alignment contains exactly one tuple for each word in the source, which serves
    to explain how the source word could be translated from the target, as required
    by the translation probability $\mathrm{p}_{S|T}$. If no appropriate word in the
    target can be identified for a source word, it is aligned to $\varnothing$ — as
    is the case for the Spanish function word $a$ in the example, which glosses to
    the English word to. Words in the target can align with multiple words in the
    source, so that the target word likes can align to both le and gusta in the source.


