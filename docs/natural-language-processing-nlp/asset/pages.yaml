  md: 'The zero-one loss is zero if the instance is correctly classified, and one
    otherwise. The sum of zero-one losses is proportional to the error rate of the
    classifier on the training data. Since a low error rate is often the ultimate
    goal of classification, this may seem ideal. But the zero-one loss has several
    problems. One is that it is **non-convex**,¹⁴ which means that there is no guarantee
    that gradient-based optimization will be effective. A more serious problem is
    that the derivatives are useless: the partial derivative with respect to any parameter
    is zero everywhere, except at the points where **θ**·**f**(x⁽ⁱ⁾, y) = **θ**·**f**(x⁽ⁱ⁾,
    ŷ) for some ŷ. At those points, the loss is discontinuous, and the derivative
    is undefined.


    The perceptron optimizes a loss function that has better properties for learning:


    ℓ_PERCEPTRON(θ; x⁽ⁱ⁾, y⁽ⁱ⁾) = max_{y∈𝒴} θ·f(x⁽ⁱ⁾, y) − θ·f(x⁽ⁱ⁾, y⁽ⁱ⁾),  [2.41]


    When ŷ = y⁽ⁱ⁾, the loss is zero; otherwise, it increases linearly with the gap
    between the score for the predicted label ŷ and the score for the true label y⁽ⁱ⁾.
    Plotting this loss against the input max_{y∈𝒴} θ·f(x⁽ⁱ⁾, y) − θ·f(x⁽ⁱ⁾, y⁽ⁱ⁾)
    gives a hinge shape, motivating the name **hinge loss**.


    To see why this is the loss function optimized by the perceptron, take the derivative
    with respect to θ,


    ∂/∂θ ℓ_PERCEPTRON(θ; x⁽ⁱ⁾, y⁽ⁱ⁾) = f(x⁽ⁱ⁾, ŷ) − f(x⁽ⁱ⁾, y⁽ⁱ⁾).  [2.42]


    At each instance, the perceptron algorithm takes a step of magnitude one in the
    opposite direction of this **gradient**, ∇_θ ℓ_PERCEPTRON = ∂/∂θ ℓ_PERCEPTRON(θ;
    x⁽ⁱ⁾, y⁽ⁱ⁾). As we will see in § 2.6, this is an example of the optimization algorithm
    **stochastic gradient descent**, applied to the objective in Equation 2.41.


    # *Breaking ties with subgradient descent* ¹⁵


    Careful readers will notice the tacit assumption that there is a unique ŷ that
    maximizes θ·f(x⁽ⁱ⁾, y). What if there are two or more labels that maximize this
    function? Consider binary classification: if the maximizer is y⁽ⁱ⁾, then the gradient
    is zero, and so is the perceptron update; if the maximizer is ŷ ≠ y⁽ⁱ⁾, then the
    update is the difference f(x⁽ⁱ⁾, y⁽ⁱ⁾) − f(x⁽ⁱ⁾, ŷ). The underlying issue is that
    the perceptron loss is not **smooth**, because the first derivative has a discontinuity
    at the hinge point, where the score for the true label y⁽ⁱ⁾ is equal to the score
    for some other label ŷ. At this point, there is no unique gradient; rather, there
    is a set of **subgradients**. A vector v is


    ¹⁴ A function f is **convex** iff α f(x_i)+(1−α) f(x_j) ≥ f(α x_i+(1−α) x_j),
    for all α ∈ [0,1] and for all x_i and x_j on the domain of the function. In words,
    any weighted average of the output of f applied to any two points is larger than
