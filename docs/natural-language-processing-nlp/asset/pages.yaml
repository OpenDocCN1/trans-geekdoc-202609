    Literary translation is especially challenging, even for expert human translators.
    Messud (2014) describes some of these issues in her review of an English translation
    of *L’étranger*, the 1942 French novel by Albert Camus.¹¹ She compares the new
    translation by Sandra Smith against earlier translations by Stuart Gilbert and
    Matthew Ward, focusing on the difficulties presented by a single word in the first
    sentence:


    > > Then, too, Smith has reconsidered the book’s famous opening. Camus’s original
    is deceptively simple: “*Aujourd’hui, maman est morte.*” Gilbert influenced generations
    by offering us “Mother died today”—inscribing in Meursault [the narrator] from
    the outset a formality that could be construed as heartlessness. But *maman*,
    after all, is intimate and affectionate, a child’s name for his mother. Matthew
    Ward concluded that it was essentially untranslatable (“mom” or “mummy” being
    not quite apt), and left it in the original French: “Maman died today.” There
    is a clear logic in this choice; but as Smith has explained, in an interview in
    *The Guardian*, *maman* “didn’t really tell the reader anything about the connotation.”
    She, instead, has translated the sentence as “My mother died today.”


    I chose “My mother” because I thought about how someone would tell another person
    that his mother had died. Meursault is speaking to the reader directly. “My mother
    died today” seemed to me the way it would work, and also implied the closeness
    of “maman” you get in the French.


    Elsewhere in the book, she has translated *maman* as “mama”—again, striving to
    come as close as possible to an actual, colloquial word that will carry the same
    connotations as *maman* does in French.


    The passage is a reminder that while the quality of machine translation has improved
    dramatically in recent years, expert human translations draw on considerations
    that are beyond the ken of any contemporary computational approach.


