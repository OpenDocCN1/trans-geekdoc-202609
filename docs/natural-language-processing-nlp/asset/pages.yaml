  md: "(2014) induce vector representations for morphemes, which they build into a\
    \ log-bilinear language model; Bhatia et al. (2016) incorporate morpheme vectors\
    \ into an LSTM.\n\n# Additional resources\n\nA variety of neural network architectures\
    \ have been applied to language modeling. Notable earlier non-recurrent architectures\
    \ include the neural probabilistic language model (Bengio et al., 2003) and the\
    \ log-bilinear language model (Mnih and Hinton, 2007). Much more detail on these\
    \ models can be found in the text by Goodfellow et al. (2016).\n\n# Exercises\n\
    \n+   1. Prove that n-gram language models give valid probabilities if the n-gram\
    \ probabilities are valid. Specifically, assume that,\n+   \n+   $$\\sum_{w_m}^{V}\
    \ p(w_m \\mid w_{m-1}, w_{m-2}, \\dots, w_{m-n+1}) = 1 \\tag{6.43}$$\n+   \n+\
    \   for all contexts $(w_{m-1}, w_{m-2}, \\dots, w_{m-n+1})$. Prove that $\\sum_w\
    \ p_n(w) = 1$ for all $w \\in \\mathcal{V}^*$, where $p_n$ is the probability\
    \ under an $n$-gram language model. Your proof should proceed by induction. You\
    \ should handle the start-of-string case $p(w_1 \\mid \\underbrace{\\square,\\\
    dots,\\square}_{n-1})$, but you need not handle the end-of-string token.\n+  \
    \ \n+   2. First, show that RNN language models are valid using a similar proof\
    \ technique to the one in the previous problem.\n+   \n+   Next, let $p_r(w)$\
    \ indicate the probability of $w$ under RNN $r$. An ensemble of RNN language models\
    \ computes the probability,\n+   \n+   $$p(w) = \\frac{1}{R} \\sum_{r=1}^{R} p_r(w).\
    \ \\tag{6.44}$$\n+   \n+   Does an ensemble of RNN language models compute a valid\
    \ probability?\n+   \n+   3. Consider a unigram language model over a vocabulary\
    \ of size $V$. Suppose that a word appears $m$ times in a corpus with $M$ tokens\
    \ in total. With Lidstone smoothing of $\\alpha$, for what values of $m$ is the\
    \ smoothed probability greater than the unsmoothed probability?\n+   \n+   4.\
    \ Consider a simple language in which each token is drawn from the vocabulary\
    \ $\\mathcal{V}$ with probability $\\frac{1}{V}$, independent of all other tokens."
