- pgno: 406
  md: '# 16.3.2 Hierarchical discourse relations


    In sentence parsing, adjacent phrases combine into larger constituents, ultimately
    producing a single constituent for the entire sentence. The resulting tree structure
    enables structured analysis of the sentence, with subtrees that represent syntactically
    coherent chunks of meaning. Rhetorical Structure Theory (RST) extends this style
    of hierarchical analysis to the discourse level (Mann and Thompson, 1988).


    The basic element of RST is the discourse unit, which refers to a contiguous span
    of text. Elementary discourse units (EDUs) are the atomic elements in this framework,
    and are typically (but not always) clauses.⁵ Each discourse relation combines
    two or more adjacent discourse units into a larger, composite discourse unit;
    this process ultimately unites the entire text into a tree-like structure.⁶


    **Nuclearity** In many discourse relations, one argument is primary. For example:


    (16.8) [LaShawn loves animals]ₙ

    [She has nine dogs and one pig]ₛ


    In this example, the second sentence provides EVIDENCE for the point made in the
    first sentence. The first sentence is thus the nucleus of the discourse relation,
    and the second sentence is the satellite. The notion of nuclearity is similar
    to the head-modifier structure of dependency parsing (see § 11.1.1). However,
    in RST, some relations have multiple nuclei. For example, the arguments of the
    CONTRAST relation are equally important:


    (16.9) [The clash of ideologies survives this treatment]ₙ

    [but the nuance and richness of Gorky’s individual characters have vanished in
    the scuffle]ₙ⁷


    Relations that have multiple nuclei are called coordinating; relations with a
    single nucleus are called subordinating. Subordinating relations are constrained
    to have only two arguments, while coordinating relations (such as CONJUNCTION)
    may have more than two.


    ⁵Details of discourse segmentation can be found in the RST annotation manual (Carlson
    and Marcu, 2001).


    ⁶While RST analyses are typically trees, this should not be taken as a strong
    theoretical commitment to the principle that all coherent discourses have a tree
    structure. Taboada and Mann (2006) write:


    > It is simply the case that trees are convenient, easy to represent, and easy
    to understand. There is, on the other hand, no theoretical reason to assume that
    trees are the only possible representation of discourse structure and of coherence
    relations.


    The appropriateness of tree structures to discourse has been challenged, e.g.,
    by Wolf and Gibson (2005), who propose a more general graph-structured representation.


    ⁷from the RST Treebank (Carlson et al., 2002)'
  merge: -1
  img_proc: true
