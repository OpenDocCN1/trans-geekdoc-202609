  md: 'A comparison of these probabilities would successfully resolve this case (Hindle
    and Rooth, 1993). Other cases, such as the example *we eat sushi with chopsticks*,
    require considering the object of the preposition: consider the alternative *we
    eat sushi with soy sauce*. With sufficient labeled data, some instances of attachment
    ambiguity can be solved by supervised classification (Ratnaparkhi et al., 1994).


    However, there are inherent limitations to local solutions. While toy examples
    may have just a few ambiguities to resolve, realistic sentences have thousands
    or millions of possible parses. Furthermore, attachment decisions are interdependent,
    as shown in the garden path example:


    (10.2) Cats scratch people with claws with knives.


    We may want to attach *with claws* to *scratch*, as would be correct in the shorter
    sentence in *cats scratch people with claws*. But this leaves nowhere to attach
    *with knives*. The correct interpretation can be identified only be considering
    the attachment decisions jointly. The huge number of potential parses may seem
    to make exhaustive search impossible. But as with sequence labeling, locality
    assumptions make it possible to search this space efficiently.


    # 10.3 Weighted Context-Free Grammars


    Let us define a derivation $\tau$ as a set of **anchored productions**,


    $\tau = \{X \to \alpha, (i, j, k)\}, \quad [10.3]$


    with $X$ corresponding to the left-hand side non-terminal and $\alpha$ corresponding
    to the right-hand side. For grammars in Chomsky normal formal, $\alpha$ is either
    a pair of non-terminals or a terminal symbol. The indices $i, j, k$ anchor the
    production in the input, with $X$ deriving the span $\boldsymbol{w}_{i+1:j}$.
    For binary productions, $\boldsymbol{w}_{i+1:k}$ indicates the span of the left
    child, and $\boldsymbol{w}_{k+1:j}$ indicates the span of the right child; for
    unary productions, $k$ is ignored. For an input $\boldsymbol{w}$, the optimal
    parse is,


    $\hat{\tau} = \arg\max_{\tau \in \mathcal{T}(\boldsymbol{w})} \Psi(\tau), \quad
    [10.4]$


    where $\mathcal{T}(\boldsymbol{w})$ is the set of derivations that yield the input
    $\boldsymbol{w}$.


    Define a scoring function $\Psi$ that decomposes across anchored productions,


    $\Psi(\tau) = \sum_{(X \to \alpha, (i, j, k)) \in \tau} \psi(X \to \alpha, (i,
    j, k)). \quad [10.5]$


    This is a locality assumption, akin to the assumption in Viterbi sequence labeling.
    In this case, the assumption states that the overall score is a sum over scores
    of productions,'
