    5:     N ← N + 1

    6:     if ψ(y, x^(i)) + 1 > ψ(y^(i), x^(i)) then ▷ check for margin violation

    7:       r ← ⌈|Y(x^(i))|/N⌉ ▷ compute approximate rank

    8:       return L_rank(r) × (ψ(y, x^(i)) + 1 − ψ(y^(i), x^(i)))

    9:   until N ≥ |Y(x^(i))| − 1 ▷ no violation found

    10:  return 0 ▷ return zero loss

    ```


    not just the top-scoring prediction. Usunier et al. (2009) define a general ranking
    error function,


    L_rank(k) = Σ_{j=1}^k α_j,  with α_1 ≥ α_2 ≥ … ≥ 0,  [17.6]


    where k is equal to the number of labels ranked higher than the correct label
    y^(i). This function defines a class of ranking errors: if α_j = 1 for all j,
    then the ranking error is equal to the rank of the correct entity; if α_1 = 1
    and α_{j>1} = 0, then the ranking error is one whenever the correct entity is
    not ranked first; if α_j decreases smoothly with j, as in α_j = 1/j, then the
    error is between these two extremes.


    This ranking error can be integrated into a margin objective. Remember that large
    margin classification requires not only the correct label, but also that the correct
    label outscores other labels by a substantial margin. A similar principle applies
    to ranking: we want a high rank for the correct entity, and we want it to be separated
    from other entities by a substantial margin. We therefore define the margin-augmented
    rank,


    r(y^(i), x^(i)) ≜ Σ_{y∈Y(x^(i))\y^(i)} δ(1 + ψ(y, x^(i)) ≥ ψ(y^(i), x^(i))),  [17.7]


    where δ(·) is a delta function, and Y(x^(i)) \ y^(i) is the set of all entity
    candidates minus the true entity y^(i). The margin-augmented rank is the rank
    of the true entity, after augmenting every other candidate with a margin of one,
    under the current scoring function ψ. (The context c is omitted for clarity, and
    can be considered part of x.)


