  md: 'where \(\mathcal{L}_y\) is the lexicon for label \(y\). Compared to the machine
    learning classifiers discussed in the previous chapters, lexicon-based classification
    may seem primitive. However, supervised machine learning relies on large annotated
    datasets, which are time-consuming and expensive to produce. If the goal is to
    distinguish two or more categories in a new domain, it may be simpler to start
    by writing down a list of words for each category.


    An early lexicon was the *General Inquirer* (Stone, 1966). Today, popular sentiment
    lexicons include SENTIWORDNET (Esuli and Sebastiani, 2006) and an evolving set
    of lexicons from Liu (2015). For emotions and more fine-grained analysis, *Linguistic
    Inquiry and Word Count* (LIWC) provides a set of lexicons (Tausczik and Pennebaker,
    2010). The MPQA lexicon indicates the polarity (positive or negative) of 8221
    terms, as well as whether they are strongly or weakly subjective (Wiebe et al.,
    2005). A comprehensive comparison of sentiment lexicons is offered by Ribeiro
    et al. (2016). Given an initial **seed lexicon**, it is possible to automatically
    expand the lexicon by looking for words that frequently co-occur with words in
    the seed set (Hatzivassiloglou and McKeown, 1997; Qiu et al., 2011).


    # 4.2  Word sense disambiguation


    Consider the the following headlines:


    +   (4.3)

    +      a. Iraqi head seeks arms

    +      b. Prostitutes appeal to Pope

    +      c. Drunk gets nine years in violin case²


    These headlines are ambiguous because they contain words that have multiple meanings,
    or **senses**. Word sense disambiguation is the problem of identifying the intended
    sense of each word token in a document. Word sense disambiguation is part of a
    larger field of research called **lexical semantics**, which is concerned with
    meanings of the words.


    At a basic level, the problem of word sense disambiguation is to identify the
    correct sense for each word token in a document. Part-of-speech ambiguity (e.g.,
    noun versus verb) is usually considered to be a different problem, to be solved
    at an earlier stage. From a linguistic perspective, senses are not properties
    of words, but of **lemmas**, which are canonical forms that stand in for a set
    of inflected words. For example, *arm*/N is a lemma that includes the inflected
    form *arms*/N — the /N indicates that it we are referring to the noun, and not
    its **homonym** *arm*/V, which is another lemma that includes the inflected verbs
    (*arm*/V, *arms*/V, *armed*/V, *arming*/V). Therefore, word sense disambiguation
    requires first identifying the correct part-of-speech and lemma for each token,


    ²These examples, and many more, can be found at http://www.ling.upenn.edu/~beatrice/humor/headlines.html'
