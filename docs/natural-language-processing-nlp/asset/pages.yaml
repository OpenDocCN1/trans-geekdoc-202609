  md: '# 18.2.4 *Syntax-based translation


    The Vauquois Pyramid (Figure 18.1) suggests that translation might be easier if
    we take a higher-level view. One possibility is to incorporate the syntactic structure
    of the source, the target, or both. This is particularly promising for language
    pairs that consistent syntactic differences. For example, English adjectives almost
    always precede the nouns that they modify, while in Romance languages such as
    French and Spanish, the adjective often follows the noun: thus, *angry fish* would
    translate to *pez (fish) enojado (angry)* in Spanish. In word-to-word translation,
    these reorderings cause the alignment model to be overly permissive. It is not
    that the order of *any* pair of English words can be reversed when translating
    into Spanish, but only adjectives and nouns within a noun phrase. Similar issues
    arise when translating between verb-final languages such as Japanese (in which
    verbs usually follow the subject and object), verb-initial languages like Tagalog
    and classical Arabic, and verb-medial languages such as English.


    An elegant solution is to link parsing and translation in a **synchronous context-free
    grammar** (SCFG; Chiang, 2007).³ An SCFG is a set of productions of the form $X
    \rightarrow (\alpha, \beta, \sim)$, where $X$ is a non-terminal, $\alpha$ and
    $\beta$ are sequences of terminals or non-terminals, and $\sim$ is a one-to-one
    alignment of items in $\alpha$ with items in $\beta$. English-Spanish adjective-noun
    ordering can be handled by a set of synchronous productions, e.g.,


    NP → (DET₁ NN₂ JJ₃, DET₁ JJ₃ NN₂), [18.22]


    with subscripts indicating the alignment between the Spanish (left) and English
    (right) parts of the right-hand side. Terminal productions yield translation pairs,


    JJ → (enojado₁, angry₁). [18.23]


    A synchronous derivation begins with the start symbol S, and derives a pair of
    sequences of terminal symbols.


    Given an SCFG in which each production yields at most two symbols in each language
    (Chomsky Normal Form; see § 9.2.1), a sentence can be parsed using only the CKY
    algorithm (chapter 10). The resulting derivation also includes productions in
    the other language, all the way down to the surface form. Therefore, SCFGs make
    translation very similar to parsing. In a weighted SCFG, the log probability $\log
    P_{S|T}$ can be computed from the sum of the log-probabilities of the productions.
    However, combining SCFGs with a target language model is computationally expensive,
    necessitating approximate search algorithms (Huang and Chiang, 2007).


    Synchronous context-free grammars are an example of **tree-to-tree translation**,
    because they model the syntactic structure of both the target and source language.
    In **string-to-tree translation**, string elements are translated into constituent
    tree fragments, which


    ³Earlier approaches to syntactic machine translation includes syntax-driven transduction
    (Lewis II and Stearns, 1968) and stochastic inversion transduction grammars (Wu,
    1997).'
