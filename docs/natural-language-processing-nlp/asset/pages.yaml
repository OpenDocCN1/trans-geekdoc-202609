  md: 'Given a dataset $\mathcal{D} = \{(\boldsymbol{x}^{(i)}, y^{(i)})\}_{i=1}^N$,
    the weights $\boldsymbol{\theta}$ are estimated by **maximum conditional likelihood**,


    $$\log p(\boldsymbol{y}^{(1:N)} \mid \boldsymbol{x}^{(1:N)}; \boldsymbol{\theta})
    = \sum_{i=1}^N \log p(y^{(i)} \mid \boldsymbol{x}^{(i)}; \boldsymbol{\theta})
    \tag{2.57}$$ $$= \sum_{i=1}^N \boldsymbol{\theta} \cdot \boldsymbol{f}(\boldsymbol{x}^{(i)},
    y^{(i)}) - \log \sum_{y'' \in \mathcal{Y}} \exp\left(\boldsymbol{\theta} \cdot
    \boldsymbol{f}(\boldsymbol{x}^{(i)}, y'')\right). \tag{2.58}$$


    The final line is obtained by plugging in Equation 2.56 and taking the logarithm.
    16 Inside the sum, we have the (additive inverse of the) logistic loss,


    $$\ell_{\text{LogReg}}(\boldsymbol{\theta}; \boldsymbol{x}^{(i)}, y^{(i)}) = -\boldsymbol{\theta}
    \cdot \boldsymbol{f}(\boldsymbol{x}^{(i)}, y^{(i)}) + \log \sum_{y'' \in \mathcal{Y}}
    \exp(\boldsymbol{\theta} \cdot \boldsymbol{f}(\boldsymbol{x}^{(i)}, y'')) \tag{2.59}$$


    The logistic loss is shown in Figure 2.2 on page 31. A key difference from the
    zero-one and hinge losses is that logistic loss is never zero. This means that
    the objective function can always be improved by assigning higher confidence to
    the correct label.


    # 2.5.1 Regularization


    As with the support vector machine, better generalization can be obtained by penalizing
    the norm of $\boldsymbol{\theta}$. This is done by adding a multiple of the squared
    norm $\frac{\lambda}{2}\|\boldsymbol{\theta}\|_2^2$ to the minimization objective.
    This is called $L_2$ regularization, because $\|\boldsymbol{\theta}\|_2^2$ is
    the squared $L_2$ norm of the vector $\boldsymbol{\theta}$. Regularization forces
    the estimator to trade off performance on the training data against the norm of
    the weights, and this can help to prevent overfitting. Consider what would happen
    to the unregularized weight for a base feature $j$ that is active in only one
    instance $\boldsymbol{x}^{(i)}$: the conditional log-likelihood could always be
    improved by increasing the weight for this feature, so that $\boldsymbol{\theta}_{(j,
    y^{(i)})} \to \infty$ and $\boldsymbol{\theta}_{(j, y \neq y^{(i)})} \to -\infty$,
    where $(j, y)$ is the index of feature associated with $x_j^{(i)}$ and label $y$
    in $\boldsymbol{f}(\boldsymbol{x}^{(i)}, y)$.


    In § 2.2.4 (footnote 11), we saw that smoothing the probabilities of a Naïve Bayes
    classifier can be justified as a form of maximum a posteriori estimation, in which
    the parameters of the classifier are themselves random variables, drawn from a
    **prior distribution**. The same justification applies to $L_2$ regularization.
    In this case, the prior is a zero-mean Gaussian on each term of $\boldsymbol{\theta}$.
    The log-likelihood under a zero-mean Gaussian is,


    $$\log N(\theta_j; 0, \sigma^2) \propto - \frac{1}{2\sigma^2} \theta_j^2, \tag{2.60}$$


    so that the regularization weight $\lambda$ is equal to the inverse variance of
    the prior, $\lambda = \frac{1}{\sigma^2}$.


    16 The log-sum-exp term is a common pattern in machine learning. It is numerically
    unstable, because it will underflow if the inner product is small, and overflow
    if the inner product is large. Scientific computing libraries usually contain
    special functions for computing logsumexp, but with some thought, you should be
    able to see how to create an implementation that is numerically stable.'
