    # 18.2 Statistical machine translation


    The previous section introduced adequacy and fluency as the two main criteria
    for machine translation. A natural modeling approach is to represent them with
    separate scores,


    Ψ(w^(s), w^(t)) ≡ Ψ_A(w^(s), w^(t)) + Ψ_F(w^(t)). [18.3]


    The fluency score Ψ_F need not even consider the source sentence; it only judges
    w^(t) on whether it is fluent in the target language. This decomposition is advantageous
    because it makes it possible to estimate the two scoring functions on separate
    data. While the adequacy model must be estimated from aligned sentences — which
    are relatively expensive and rare — the fluency model can be estimated from monolingual
    text in the target language. Large monolingual corpora are now available in many
    languages, thanks to resources such as Wikipedia.


    An elegant justification of the decomposition in Equation 18.3 is provided by
    the noisy channel model, in which each scoring function is a log probability:


    Ψ_A(w^(s), w^(t)) ≡ log p_{S|T}(w^(s) | w^(t)) [18.4]

    Ψ_F(w^(t)) ≡ log p_T(w^(t)) [18.5]

    Ψ(w^(s), w^(t)) = log p_{S|T}(w^(s) | w^(t)) + log p_T(w^(t)) = log p_{S,T}(w^(s),
    w^(t)). [18.6]


    By setting the scoring functions equal to the logarithms of the prior and likelihood,
    their sum is equal to log p_{S,T}, which is the logarithm of the joint probability
    of the source and target. The sentence ŵ^(t) that maximizes this joint probability
    is also the maximizer of the conditional probability p_{T|S}, making it the most
    likely target language sentence, conditioned on the source.


    The noisy channel model can be justified by a generative story. The target text
    is originally generated from a probability model p_T. It is then encoded in a
    “noisy channel” p_{S|T}, which converts it to a string in the source language.
    In decoding, we apply Bayes’ rule to recover the string w^(t) that is maximally
    likely under the conditional probability p_{T|S}. Under this interpretation, the
    target probability p_T is just a language model, and can be estimated using any
    of the techniques from chapter 6. The only remaining learning problem is to estimate
    the translation model p_{S|T}.'
