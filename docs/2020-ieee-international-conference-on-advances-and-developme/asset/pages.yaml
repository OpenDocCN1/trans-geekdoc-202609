    association rule mining [10], is also carried out.


    # III. METHODOLOGY


    Machine Learning technique is categorized into 3 types i.e. ''Supervised Learning'',
    ''Unsupervised Learning'' and ''Reinforcement Learning''. ''Supervised Learning''
    is the Machine Learning type where the response variable is already labelled in
    the dataset. This data is partitioned into two sets ''Training'' and ''Testing''.
    Here ''Training'' with incorporated response variables is used to train the model.
    The model is then used to predict response variables in the ''Testing'' set where
    the response variables are not labelled. The predicted response variables are
    scrutinized to ensure the accuracy. Supervised Machine Algorithms are employed
    for both ''Classification'' and ''Regression''. Four Supervised Machine Learning
    Algorithms utilised in this work are delineated:


    # B. Random Forest


    Random Forest [12], is an ensemble Supervised Machine Learning Technique. It is
    utilised for both ''Regression'' and ''Classification''. In Ensemble, manifold
    models are generated in turn spawn multiple classifiers to solve the complex problems.
    This is one of the best classification algorithms available. In this, high number
    of individual decision trees are produced, where each tree represents a certain
    ''class''. Here the classifier that receives the greatest number of votes is elected
    to be the final result. This is also known as weak learners'' techniques, as all
    the individual results work together to spawn good result.


