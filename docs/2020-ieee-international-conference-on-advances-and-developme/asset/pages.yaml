    # A. Support Vector Machine


    Support Vector Machine [11], is the finest nonseparable Supervised ML algorithm.
    SVM classifies the classes with the help of hyperplane. Here hyperplane is a flat
    subspace with (n-1) dimension in ''n'' dimensional space. For a point d-1 in a
    line d-2 and a plane d-3 is used as hyperplane to divide the space into 2 parts.
    SVM picks the hyperplane that maximizes the margin around the hyperplane. For
    this, it is also known as ''Maximum Classifier''. Here ''Support Vectors'' are
    the types of data that lie near the hyperplane. Support Vectors determine which
    hyperplane to choose, the decisions in SVM are determined by Support Vectors.
    Any changes in the position of Support Vectors change the boundaries respectively.
    SVM is robust to outliers in the detection of outliers. For a nonseparable classification,
    SVM transforms the data to the higher dimensional space and determines the higher
    dimensional Support Vector Classifier to efficiently classify the observations.


    The authors in this work have classified the customers for a bank using the supervised
    machine learning algorithms [7]. The researchers have implemented the classification
    algorithms like ''Naive Bayes'', ''K-Nearest Neighbour'' and Support Vector Machine.
    After implementing these Machine Learning, the classifier that Naive Bayes provides
    the best results and Support Vector Machine offers the worst result. The paper
    also presents a future scenario of using hybrid approaches with high accuracy
    and low error rates.


    In the proposed work [8], authentication of the bank notes is done by using Supervised
