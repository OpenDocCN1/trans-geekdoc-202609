    # 基于机器学习技术通过购买行为识别潜在买家


    Shivam Sharma

    计算机科学与工程系

    ASET, 阿提大学马哈普拉什邦

    印度格瓦尔

    shi982@gmail.com


    Dr. Hemant Kumar Somi*

    计算机科学与工程系

    ASET, 阿提大学马哈普拉什邦

    印度格瓦尔

    *hemantkumar@gmail.com


    摘要—— 人工智能（AI）是一项迷人的技术，随着它将在多个维度的数据上运行。人工智能通过捕捉客户来模拟人类智能。机器学习是人工智能的实现。机器学习（ML）是一种从自身先验经验中学习的自解释机制。机器不需要显式提示即可进行学习。如今，公司可以探索和分析客户数据。客户的数据模式和趋势对公司具有巨大的价值。通过在客户身上应用人工智能技术，对所提议的工作进行分类。作者实施了多种机器学习算法，如支持向量机（SVM）、随机森林、逻辑回归、K-近邻算法，根据客户是否购买了产品进行分类，并对这些机器学习算法的分类准确率进行了比较。本文指出，随机森林的分类效果优于其他算法。


    这些技术足以处理现实世界的问题而无需人工协助。机器学习算法在模式识别等关键算法中起着重要作用。公司在查看特定页面、提及光标或点击链接时会管理客户数据。这些数据通过人工智能技术进行分析，以探索隐藏的购买行为。机器学习、深度学习等人工智能技术为全球大量公司识别潜在客户提供了保障。


    关键词—— 机器学习、监督学习、支持向量机、随机森林、混淆矩阵、客户分类、潜在买家、购买者。


    ## I. 引言


    在数据驱动的时代，客户数据已成为一种产生潜力聚落的资源。所有主要公司正在向数据驱动型公司转型。公司可以探索所有可能的维度来检索客户产生的数据。一旦数据经过分析，就会被预处理并转换为标准格式。公司可以通过应用多种技术处理数据，以理解客户洞察。这些洞察反映了客户的行为。对这些购买模式的分析允许公司根据产品对客户进行分类。数据挖掘技术
    [1]；关联规则学习 [2][3] 以及人工智能旨在生成智能且复杂的解决问题的机器。这些人工智能提供的机器是足够的。


    本文提出了对特定移动网络市场客户的预测 [5]。本文实现了用于客户预测的神经网络模型。数据收集自在线零售商店。该模型的实现是为了向他人隐藏隐藏的趋势和模式。本文探讨了建模在购买行为中的应用，并声称了对数据的判别以及市场特征选择对市场的影响。


    ## II. 相关工作


    本文利用机器学习技术 [6] 对潜在客户进行分类。分类是基于零售超级市场记录的购买行为进行的。作者实施了如“逻辑回归”、“决策树”、“随机森林”和“多层感知器”等机器学习算法进行分类。该工作声称，多层感知器提供了最高的准确率。其他算法提供了与多层感知器相似的准确率。


    ### A. 支持向量机


    支持向量机 [11] 是最优秀的非线性可监督机器学习算法。SVM 通过超平面对类别进行分类。在这里，超平面是“n”维空间中具有 (n-1) 维度的平坦子空间。对于线
    d 中的点 d-1，线 d-2 和平面 d-3 用作超平面将空间划分为两部分。SVM 选择使超平面周围间隔最大化的超平面。因此，它被称为“最大分类器”。在这里，“支持向量”是位于超平线附近的数据类型。支持向量决定了选择哪种超平面，SVM
    中的决策由支持向量决定。支持向量位置的任何变化都会相应地改变边界。SVM 在检测离群值时对异常具有鲁棒性。对于非线性分类，SVM 将数据转换到高维空间，并确定高维支持向量分类器以有效分类观测值。


    作者在这项工作中使用监督机器学习算法 [7] 为银行客户进行了分类。研究人员实施了如“朴素贝叶斯”、“K-近邻”和支持向量机等分类算法。在实施这些机器学习算法后，朴素贝叶斯提供的分类器结果最佳结果，而支持向量机提供的结果最差。本文还展示了使用高准确率和低错误率的混合方法的未来场景。


    在所提工作 [8] 中，使用监督机器学习分类对银行券进行鉴别。该工作利用了两种机器学习算法，即反向传播神经网络（BNN）和支持向量机（SVM）。作者声称 BNN
    优于 SVM 分类器。还实现了 ROC 和用于衡量模型性能的不同指标。


    除了上述文献，为了理解购买模式和市场分析，还进行了一些相关分析 [9] 和多目标关联规则挖掘 [10] 的其他工作。


    ## III. 方法论


    机器学习技术分为三类，即“监督学习”、“无监督学习”和“强化学习”。“监督学习”是机器学习的一种类型，其中响应变量在数据集中已经标记。这些数据被分为两个集合：“训练集”和“测试集”。在这里，包含响应变量的“训练集”用于训练模型。然后使用该模型预测“测试集”中的响应变量，而测试中的响应变量没有标记。对预测的响应变量进行审查以确保准确性。监督机器学习算法同时用于“分类”和“回归”。本文中使用的四种监督机器学习算法如下：


    ### B. 随机森林


    随机森林 [12] 是一种集成监督机器学习技术。它被同时用于“回归”和“分类”。在集成中，会生成多个模型，进而产生多个分类器来解决复杂问题。这是可用最佳分类算法之一。在这里，会产生大量的个体决策树，每棵树代表一个特定的“类别”。在这里，获得票数最多的分类器被选为最终结果。这也被称为弱学习者技术，因为所有个体结果共同工作以产生良好的结果。


    ### C. 逻辑回归 (LR) [13]， 当响应数据是二分时时适用。它是一种用于分类的算法。逻辑回归方法寻找分类因变量的概率。由于线性回归无法应用，它会产生响应大于“1”（即
    p(x)>1）和小于“0”（即）


