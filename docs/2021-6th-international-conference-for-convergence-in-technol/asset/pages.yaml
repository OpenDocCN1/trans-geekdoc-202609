  md: '# Real-Time Weed Detection using Machine Learning and Stereo-Vision


    Siddhan Babu, Kimaya Desai, Manish Dshiva, Reena Sonaskar, Sneha Weakey

    Department of Electronics and Telecommunication, Sardar Patel Institute of Technology

    Mumbai, India


    *siddhan.badhan@sp.ac.in, kimaya.desai@sp.ac.in, manish.dshiva@sp.ac.in, reena_kumbhare@sp.ac.in,
    sneha_weakey@sp.ac.in*


    **Abstract—** weeds are a problem as they compete with desirable crops and use
    water, nutrients, and space. Some weeds get entangled in machinery and prevent
    efficient harvesting. Hence weed removal systems are necessary. Development of
    a successful weed removal system involves correct identification of weed vegetation.
    The paper proposes a weed detection system that identifies weeds in crops using
    stereo-vision for 3D structure reconstruction and 3D point cloud. The machine
    learning model is trained on two manually created datasets of cucumber and onion.
    Convolutional Neural Networks (CNN) and ResNet-50 algorithms are used for identification.
    Results show ResNet-50 outperforms others with accuracy of 84.6% for the cucumber
    dataset and 90% for the onion dataset.


    **Index**** Weed Detection, accuracy, Machine Learning, Stereo-Vision


    # I. INTRODUCTION


    Weeds cause a loss of over $10 billion in India per year. As ICAR Unlike the visible
    impact of diseases and insects, the impact of weeds goes unnoticed. Manual weeding
    holds a major position of weed control in India. The increasing cost of labour
    and labour-intensive nature leads farmers to seek new options that could reduce
    the labour and cost. The rising demand for food drives crop demand; such scarcity
    of grain and the land for crops decreases; such a situation emerges.


    Existing systems use image processing based approaches. One of weed detection
    methods uses morphological features to identify weeds in lawns. The assumption
    considered is that the grass contains a group of edges while weeds do not which
    may result in some bias in prediction. False weed detection rate is higher in
    this method, also requiring higher processing time considering the morphological
    computations involved.


    Image processing is used to identify weeds in a ragi plan. It uses a threshold-based
    approach to create a region to spray the herbicide. The difference in color or
    shape of weeds is the deciding factor. One of the shortcomings in this approach
    is the dependency on lighting for correct results.


    learning algorithms support Support Vector Machine (SVM), Convolutional Neural
    Network (CNN) and Artificial Neural Network (ANN). The algorithms are used for
    training the model for detecting weeds in different crops containing types of
    weeds [3]. Soil mapping is performed to find the region of interest. Features
    are considered while differentiating between weeds and crops. With SVM and ANN,
    there are similarities in shape features and crops. We propose a method for weeds
    and crop detection using effective use of multi-stereo techniques like Clustering
    for Multi-View Stereo (CVMS) for automatic leaf phenotyping [4]. This method is
    shown to have errors while calculating length, width and leaf inclination angles.
    With larger leaves make plants, the proposed is not reliable enough. A check technique
    that is based on the identification of weeds and crops by using 3D point map also
    exists [5]. It uses the intention of motion along with the change to recover the
    3D local map and fusing it into the world-map. The system has a height as major
    differentiating factor between weed and crop. Drift may cause errors in detecting
    weeds. Existing systems use Depth maps to identify crops of the same height.


    Considering the drawbacks in the existing methodologies, the proposed method uses
    deep learning based models for detecting weeds in two different environments with
    cucumber and onion with varying weed types. Our parameters include system accuracy,'
