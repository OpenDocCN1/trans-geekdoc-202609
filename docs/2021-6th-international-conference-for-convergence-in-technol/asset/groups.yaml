    # 基于机器学习和立体视觉的实时杂草检测


    Siddhan Babu, Kimaya Desai, Manish Shiva, Reena Sonaskar, Sneha Weakey

    电子与电信工程系，Sardar Patel 理工学院

    印度，孟买


    *siddhan.badhan@sp.ac.in, kimaya.desai@sp.ac.in, manish.dshiva@sp.ac.in, reena_kumbhare@sp.ac.in,
    sneha_weakey@sp.ac.in*


    **摘要—**杂草是一个问题，因为它们与理想作物竞争并消耗水、养分和空间。某些杂草会缠绕机械设备，防止高效收割。因此，必要的除草系统。开发成功的除草系统涉及对杂草植物进行准确识别。本文提出的杂草检测系统，利用立体视觉进行
    3D 结构重建和 3D 点云来识别作物中的杂草。机器学习模型在两个手动创建的黄瓜和洋葱数据集上进行训练。使用卷积神经网络（CNN）和 ResNet-50算法进行识别。结果显示，ResNet-50
    优于其他算法，在黄瓜数据集上的准确率为 84.6%，在洋葱数据集上的准确率为 90%。


    **索引** 杂草检测，准确率，机器学习，立体视觉


    # I. 引言


    杂草每年给印度带来超过 100 亿美元的损失。与疾病和害虫的肉可见影响不同，杂草的影响往往不被注意到。手动除草在印度的杂草控制中占据主要地位。劳动成本的增加和劳动密集型的性质导致农民寻求能够减少劳动和成本的新选择。对食物的需求增长驱动了作物需求；粮食和作物土地的日益稀缺；这种情况随之出现。


    现有系统使用基于图像处理的方法。一种杂草检测方法使用形态学特征来识别草坪中的杂草。考虑的假设是草地包含一组边缘，而杂草没有，这可能导致预测中的某些偏差。这种方法的误报杂草检测率较高，而且考虑到涉及的形态计算，还需要更长的处理时间。


    图像处理被用于识别谷子植物地中的杂草。它使用基于阈值的方法创建一个喷洒除草剂的区域。杂草颜色或形状的差异是决定因素。这种方法的缺点之一是对光照正确结果的依赖。


    学习算法支持向量机（SVM）、卷积神经网络（CNN）和人工神经网络（ANN）。这些算法用于训练模型，以检测含有不同类型杂草的各种作物 [3]。进行土壤制图以找到感兴趣区域。在区分杂草和作物时考虑了特征。使用
    SVM 和 ANN 时，形状特征和作物之间存在相似性。我们提出了一种利用有效使用多立体技术（如用于叶片表型的聚类）进行杂草和作物检测的方法 [4]。显示该方法在计算长度、宽度和叶片倾斜角时存在误差。随着植物叶片变大，所提方法不够可靠。还存在一种基于使用
    3D 点图识别杂草和作物的检查技术 [5]。它利用运动意图结合变化来恢复 3D 局部地图并将其融合到世界地图中。该系统将高度作为杂草和作物之间主要的的差异化因素。漂移可能会导致杂草检测误差。现有系统使用深度图来识别相同高度的作物。


    考虑到现有方法的缺点，所提方法使用基于深度学习的模型，在黄瓜和洋葱两种不同环境中检测具有不同类型的杂草。我们的参数包括系统准确率、计算时间，当从视频数据中提取的帧在卷积神经网络和
    RESNET-50 上建模时将进行讨论。为了重建环境，使用运动恢复结构（Structure from Motion）技术对视频数据进行 3D 重建。


    # 使用 OpenCV 从视频中提取帧


    - 使用尺度不变特征变换 (SIFT) 算法对帧进行特征匹配


    # II. 方法论


    - 使用运动恢复结构 (SFM) 技巧对植物进行稀疏重建

    - 从作物田拍摄视频

    - 使用多视图立体算法对植物进行稠密重建

    - 使用 OpenCV 提取帧


    图 2. 植物 3D 重建的流程图


