    ## VII. 结论


    本文阐述了我们在植物实时杂草检测方面的工作。现有的利用图像处理技术的杂草检测机制尚未给出高效结果。该系统实现了植物 3D 重建和作物的实时杂草检测。3D 环境的重建使用了特征匹配（Feature
    matching）和运动恢复（Structure from Motion）技术。如 CNN（卷积神经网络）和 ResNet50 等机器学习模型在利用作物拍摄的视频手动创建的三个数据集上进行了训练。发现
    ResNet-50 的准确率达到 90%。检测方法的整体性能得到了提高并实现了实时化。


    由于印度拥有庞大的农业部门，可以广泛扩展各种类型的作物，并在系统中尽可能包含更多作物，使其适用于所有类型的作物。该系统可以部署在云端以进行更快的处理和实时杂草检测，使其在实际田间场景中更易部署。


