    [algorithm 11] is used for feature extraction. Detection and description of features
    is done using the SIFT algorithm. The detected and extracted frames are further
    used for feature matching where the same features/points are matched in two consecutive
    images.

    The second step performed using the VisualSFM software is the generation of 3D
    Point Cloud. This is done using Structure from Motion (SFM) technique which helps
    in getting 3D Point Cloud using the 2 dimensional images of a single camera and
    the Red, Green, Blue (RGB) and the Depth values of image. This helps in getting
    a single 3D image from a series of 2D images with all the characteristics of each
    point in the image. Sparse reconstruction is achieved through the output. Feature
    Matching is used for creation of a Dataset used for training a machine learning
    classifier of plants and crops. The third step performed in VisualSFM is making
    the reconstruction denser. This is done using the Multi-View Stereo algorithm
    using the Clustering views for Multi-View Stereo (CMVS), Patch-based Multi-View
    Stereo (PMVS) algorithm [12]. CMVS decomposes the input images into clusters of
    medium size. PMVS takes images and its parameters as input and reconstructs a
    3D structure of the rigid structure which makes the reconstruction denser.


    Real-time weed detection on video


    Fig. 1. Flow process of the system


    The first step of the proposed system is the reconstruction of 3D model of crops
    from the video and the second step is the detection and classification of weeds
    and crops. The 3D reconstruction and the weed detection are performed on the actual
    video from the crop field containing crops and weeds. The working of the system
    can be improved in future. The 3D reconstruction is done using by frame extraction,
    feature matching, sparse and dense reconstruction. After 3D reconstruction is
    performed, the next step is detecting the weeds in the crops. The weed detection
    mainly consists of Data acquisition, Pre-processing, Image segmentation, Training
    model, Testing the model and real-time detection in crops.


    # III. 3D RECONSTRUCTION OF PLANTS


    Flow of reconstruction is shown in Figure 2. A video is taken using a camera with
    360 degree of view. The video is further processed using OpenCV for extraction
