    # VII. CONCLUSION


    This paper delineates our work on Real-time weed detection in plants. The existing
    weed detection mechanisms using image processing techniques have, and not give
    efficient results. The system designed 3D Reconstruction of the plants and real-time
    weed detection in crops. Reconstruction of a 3D environment is using Feature matching
    and Structure from Motion techniques. Machine learning models like CNN (Convolutional
    Neural Network) and ResNet50 are trained on 3 different datasets manually created
    using the video taken from the crops. The accuracy with ResNet-50 is found to
    be 90%. The overall performance of detection methods is improved and made real-time.


    As India has a vast agricultural sector and various types of crops can be widely
    extended including as many crops in the system as possible and making it suitable
    for all types of crops. The system can be deployed on the cloud for faster processing
    and real-time weed detection and making it easier to deploy in a practical field
    scenario. This system can find practical applications in the existing weed detection
    and methods used.


