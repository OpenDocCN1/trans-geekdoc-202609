    [Figure 13-20:](#c13.xhtml#figureanchor13-20) Find the `when I receive game over`
    script.


    Add a new `train new machine learning model` block to the end of the `when I receive
    game over` script, as shown in [Figure 13-21](#c13.xhtml#figure13-21).


    ![Figure 13-21: Train a new ML model after every game.](image_fi/500563c13/f13021.png)


    [Figure 13-21:](#c13.xhtml#figureanchor13-21) Train a new ML model after every
    game.


    Now, at the end of every game, the winner’s moves will be added to the training
    buckets, and you’ll use that updated set of training examples to train a new ML
    model. This means that your ML model should get a little smarter, and a little
    better, after every game you play.


    ### Train Your Model


    It’s time to play!


    1. Click the full-screen icon and then the Green Flag in the controls at the top
    right of the screen. Play *one* game of Tic Tac Toe, as shown in [Figure 13-22](#c13.xhtml#figure13-22).


    ![Figure 13-22: Play a game of Tic Tac Toe.](image_fi/500563c13/f13022.png)


    [Figure 13-22:](#c13.xhtml#figureanchor13-22) Play a game of Tic Tac Toe.


    2. After the game, click `Back to project` and then `Train`. You should see all
    of the moves made by the winning player, as shown in [Figure 13-23](#c13.xhtml#figure13-23).


    ![Figure 13-23: Compare the training data with the game in Figure 13-22.](image_fi/500563c13/f13023.png)


    [Figure 13-23:](#c13.xhtml#figureanchor13-23) Compare the training data with the
    game in 13-22.


    3. Now that you have an ML model, it’s time to update the Scratch game so that
    the computer can use the model to decide where to make its moves. Scroll through
    Code Area to find the `define use learning model` script, as shown in [Figure
    13-24](#c13.xhtml#figure13-24).


    ![Figure 13-24: Find the define use learning model script.](image_fi/500563c13/f13024.png)


    [Figure 13-24:](#c13.xhtml#figureanchor13-24) Find the `define use learning model`
    script. Update the script as shown in [Figure 13-25](#c13.xhtml#figure13-25) so
    that it uses your ML model to recognize the best move for the computer to make.


    ![Figure 13-25: Add the recognise numbers (label) block to the script.](image_fi/500563c13/f13025.png)


    [Figure 13-25:](#c13.xhtml#figureanchor13-25) Add the `recognise numbers (label)`
    block to the script.


    4. Drag the orange blocks into the `recognise numbers (label)` block, as shown
    in [Figure 13-26](#c13.xhtml#figure13-26). As before, these are ready for you
    in the template underneath where they should go. This code block will give the
    game board’s current state to the ML model so that the model can use that information
    to recognize the best move. Make sure that you add all nine blocks, for all nine
    spaces on the game board, and work from left to right. Also be sure that the block
    names match up. For example, `current state top-middle` goes into the `TopMiddle`
    space.


    ![Figure 13-26: Make sure that you match the block names correctly.](image_fi/500563c13/f13026.png)


    [Figure 13-26:](#c13.xhtml#figureanchor13-26) Make sure that you match the block
    names correctly.


    ### Test Your Game


    It’s time to test your project! Because you’ve coded your project to learn as
    you play, you should see the computer get better at the game over time. But how
    can you verify if that actually happens? One way is to play a lot of games, keep
    a count of the number of times the computer wins, and plot whether the number
    increases with the amount of training you gave the ML model.


    I played 300 games of Tic Tac Toe and counted the number of matches that I won,
    lost, and tied. I plotted the results in the bar chart shown in [Figure 13-27](#c13.xhtml#figure13-27).
    Each column represents 10 games of Tic Tac Toe. Green represents games that I
    won. Orange represents games that ended in a tie. Red represents games won by
    the ML system.


    The bar on the far left represents the first 10 games that I played. I won all
    10 of them. The next bar represents the next 10 games that I played. I won all
    10 of those, too. The bar on the far right represents the last 10 games that I
    played. I won 2 games, tied 4 games, and lost 4 games.


    ![Figure 13-27: The results from Tic Tac Toe games that I played](image_fi/500563c13/f13027.png)


    [Figure 13-27:](#c13.xhtml#figureanchor13-27) The results from Tic Tac Toe games
    that I played.


    My first 10 games were very easy to win. The computer made foolish moves, and
    I didn’t have to try hard to win. By my last 10 games, however, it was harder
    to win. I had to concentrate and not make a single mistake to win a game. Although
    my feelings can’t be shown on the graph, it *felt* to me like the computer was
    getting better as I played.


    Every ML project will go a little differently, so try training your own model
    and measuring how your project learns and improves. Hopefully you’ll see that
    the more training examples you collect, the better your ML model performs. But
    you’ll almost certainly see some variation in that, as I did.


    ## Review and Improve Your Project


    You created an ML system that learns to play Tic Tac Toe by competing against
    you. The biggest challenge with training the system yourself is the time it takes
    to play hundreds of training games. Are there more efficient ways to get more
    training examples? One common way is to get more people to help. Imagine if, instead
    of playing the 300 games myself, I had saved my Scratch project and gave the project
    file to 30 friends and asked them to play 10 games each. Dividing the work would
    have made training much easier, as playing only 10 games would be very quick for
    each person.


    Now imagine if I could get 300 people to help, or 3,000!


    Hopefully you can see the benefits of spreading the work of training an ML model
    across a large number of people. This is sometimes described as *crowdsourcing*.
    There are some challenges with that, too, like being able to find a large group
    of people, coordinating them, explaining what you want to all of them, making
    sure they all do what you want and don’t train your ML model to do things you
    don’t want, and so on. But even so, using many people for training is still the
    best option for a lot of complicated projects.


    ## What You Learned

