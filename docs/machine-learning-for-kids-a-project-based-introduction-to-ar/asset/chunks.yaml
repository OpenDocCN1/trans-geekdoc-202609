  trans: "\n\n为了训练计算机识别你两种动物的不同图片，你需要收集大量这些动物的图像，并使用它们来训练机器学习（ML）模型。\n\n1. 创建一个新的\
    \ `ML` 项目，将其命名为 `Animal sorter`（动物分类器），并设置为学习识别图像。\n\n2. 点击 `Train`（训练），如图 3-2\
    \ 所示。\n    ![图 3-2: 训练是 ML 项目的第一阶段。](img/f03002.png)\n    图 3-2： 训练是 ML 项目的第一阶段。\n\
    \n3. 点击 `Add new label`（添加新标签）（参见图 3-3）。然后输入你第一种动物的名称。\n    ![图 3-3: 点击 `Add new\
    \ label` 以创建一个新的训练示例桶。](img/f03003.png)\n    图 3-3： 点击 `Add new label` 以创建一个新的训练示例桶。\n\
    \n4. 在网页浏览器中打开第二个窗口（通常通过选择 `File`▶`New Window`），并将你的两个窗口并排排列，如图 3-4 所示。在第二个窗口中，搜索第一种动物的照片。在我的案例中，我搜索了牛的照片。\n\
    \    ![图 3-4: 并排排列你的两个浏览器窗口。](img/f03004.png)\n    图 3-4： 并排排列你的两个浏览器窗口。\n\n6.\
    \ 从搜索窗口拖动一张照片，并将其掉入你第一种动物的训练桶中。你应该会在训练桶中看到该照片的缩略图，如图 3-5 所示。如果你没看到，请尝试再次拖放照片。\n\
    \    ![图 3-5: 将牛的照片拖入我的训练桶](img/f03005.png)\n    图 3-5： 将牛的照片拖入我的训练桶\n\n6. 重复步骤\
    \ 5，直到你拥有了该动物的至少 10 张不同的照片，如图 3-6 所示。\n    ![图 3-6: 我用于识别牛的照片的训练数据](img/f03006.png)\n\
    \    图 3-6： 我用于识别牛的照片的训练数据\n\n7. 重复步骤 3 到 6，直到你每种动物都至少有 10 张不同的照片，如图 3-7 所示。\n\
    \    ![图 3-7: 我农场主题项目的训练数据](img/f03007.png)\n    图 3-7： 我农场主题项目的训练数据\n\n8. 点击屏幕左角的\
    \ `Back to project`（返回项目）。\n\n9. 点击 `Learn & Test`（学习与测试）（参见图 3-8）。\n    ![图 3-8:\
    \ Learn & Test 是 ML 项目的第二阶段。](img/f03008.png)\n    图 3-8： Learn & Test 是 ML 项目的第二阶段。\n\
    \n10. 点击 `Train new machine learning model`（训练新的机器学习模型）（参见图 3-9）。\n    ![图 3-9:\
    \ 点击 `Train new machine learning model` 开始训练。](img/f03009.png)\n    图 3-9： 点击\
    \ `Train new machine learning model` 开始训练。\n\n计算机将使用你收集的示例来学习每个动物照片的共同点。这可能需要几分钟，但在等待期间，你可以在第二个浏览器窗口中继续后续步骤。\n\
