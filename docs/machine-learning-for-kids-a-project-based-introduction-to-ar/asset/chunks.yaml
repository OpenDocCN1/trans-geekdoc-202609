- raw: "    [Figure 9-6:](#c09.xhtml#figureanchor9-6) Train is the first phase of\
    \ an ML project.\n\n3.  Click **Add new label**, as shown in [Figure 9-7](#c09.xhtml#figure9-7).\
    \ Then enter `Duck`.\n\n    ![Figure 9-7: Create a training bucket for examples\
    \ of duck pictures.](image_fi/500563c09/f09007.png)\n\n    [Figure 9-7:](#c09.xhtml#figureanchor9-7)\
    \ Create a training bucket for examples of duck pictures.\n\n4.  Click **Add new\
    \ label** again and name this bucket `Not the Duck`, as shown in [Figure 9-8](#c09.xhtml#figure9-8).\
    \ (The underscores will be added automatically.)\n\n    This bucket will be used\
    \ to store *negative training examples*, which are examples of things that *aren’t*\
    \ what you want the computer to learn to recognize.\n\n    ![Figure 9-8: Create\
    \ a training bucket for examples of pictures not of the duck.](image_fi/500563c09/f09008.png)\n\
    \n    [Figure 9-8:](#c09.xhtml#figureanchor9-8) Create a training bucket for examples\
    \ of pictures not of the duck.\n\n5.  Click **Back to project** in the top-left\
    \ corner of the screen.\n\n6.  Click **Make**.\n\n7.  Click **Scratch 3**, as\
    \ shown in [Figure 9-9](#c09.xhtml#figure9-9).\n\n    ![Figure 9-9: Click Scratch\
    \ 3.](image_fi/500563c09/f09009.png)\n\n    [Figure 9-9:](#c09.xhtml#figureanchor9-9)\
    \ Click **Scratch 3**.\n\n    You’ll see a warning that you don’t have an ML model\
    \ yet. That’s fine, as you’ll be using Scratch to collect the training examples.\n\
    \n8.  Click **straight into Scratch**, as shown in [Figure 9-10](#c09.xhtml#figure9-10).\
    \ \n\n    ![Figure 9-10: Open Scratch without an ML model by clicking straight\
    \ into Scratch.](image_fi/500563c09/f09010.png)\n\n    [Figure 9-10:](#c09.xhtml#figureanchor9-10)\
    \ Open Scratch without an ML model by clicking **straight into Scratch**.\n\n\
    9.  Click **Project templates** in the top menu. Then click **Find the duck**\
    \ in the list of templates displayed.\n\n    The project has 12 sprites arranged\
    \ on the Stage into a 3×4 grid of tiles. The sprites are hidden when you first\
    \ load the template, but they’re named as shown in [Figure 9-11](#c09.xhtml#figure9-11).\n\
    \n    ![Figure 9-11: The sprites in the Find the duck template.](image_fi/500563c09/f09011.png)\n\
    \n    [Figure 9-11:](#c09.xhtml#figureanchor9-11) The sprites in the Find the\
    \ duck template.\n\n10.  Click the **0,0** sprite in the sprites list at the bottom\
    \ right. At the top left of the Code Area, under the yellow TRAINING comment,\
    \ find the `store training data example of the duck` and the `store training data\
    \ example of NOT the duck` blocks, as shown in [Figure 9-12](#c09.xhtml#figure9-12).\n\
    \n     ![Figure 9-12: Find the script blocks for the 0,0 sprite.](image_fi/500563c09/f09012.png)\n\
    \n     [Figure 9-12:](#c09.xhtml#figureanchor9-12) Find the script blocks for\
    \ the **0,0** sprite.\n\n11.  Click the **Find the duck** group in the Toolbox\
    \ on the left, and add an `add training data` block to both of the scripts. Then,\
    \ from the **Images** group, drag a `backdrop image` block into both `add training\
    \ data` blocks, as shown in [Figure 9-13](#c09.xhtml#figure9-13).\n\n     Set\
    \ the first script to add the backdrop to the Duck training bucket, and the second\
    \ script to add the backdrop to the Not the Duck training bucket.\n\n     ![Figure\
    \ 9-13: Add training examples to the two training buckets.](image_fi/500563c09/f09013.png)\n\
    \n     [Figure 9-13:](#c09.xhtml#figureanchor9-13) Add training examples to the\
    \ two training buckets.\n\n12.  Repeat step 11 for all 12 sprites (see [Figure\
    \ 9-14](#c09.xhtml#figure9-14)). Once you’ve done that, any of the tiles you click\
    \ can be used to add an example to your training data.\n\n     ![Figure 9-14:\
    \ Add the script blocks to all 12 sprites.](image_fi/500563c09/f09014.png)\n\n\
    \     [Figure 9-14:](#c09.xhtml#figureanchor9-14) Add the script blocks to all\
    \ 12 sprites.\n\n13.  It’s time to collect your training examples! Click the Green\
    \ Flag to start. When the project asks if you want to Train or Test, click **Train**.\n\
    \n     Click **OK** when you’re asked to click the duck, and then click the tile\
    \ with the duck in it. The tile you click will be added to your Duck training\
    \ bucket, as shown in [Figure 9-15](#c09.xhtml#figure9-15).\n\n14.  Click **OK**\
    \ when you’re asked to click a tile that doesn’t have the duck in it. Make sure\
    \ to click a tile that doesn’t show *any* part of the duck. \n\n     ![Figure\
    \ 9-15: Adding an example of the duck to the training data](image_fi/500563c09/f09015.png)\n\
    \n     [Figure 9-15:](#c09.xhtml#figureanchor9-15) Adding an example of the duck\
    \ to the training data\n\n15.  On the Machine Learning for Kids site, click **Back\
    \ to project** and then click **Train** to make sure that everything is working.\
    \ You should see both of the tiles you clicked, as shown in [Figure 9-16](#c09.xhtml#figure9-16).\
    \ Check that they’re in the correct buckets.\n\n     ![Figure 9-16: Training examples\
    \ should show up in the correct buckets back in the Train phase.](image_fi/500563c09/f09016.png)\n\
    \n     [Figure 9-16:](#c09.xhtml#figureanchor9-16) Training examples should show\
    \ up in the correct buckets back in the Train phase.\n\n16.  Repeat steps 13 through\
    \ 15 in Scratch until you’ve got 10 examples in each bucket, as shown in [Figure\
    \ 9-17](#c09.xhtml#figure9-17).\n\n     Here are two tips for your **Not the Duck**\
    \ training examples:\n\n     *   Make sure you don’t click the same character\
    \ every time for your **Not the Duck** bucket. You don’t want that to become a\
    \ training set for recognizing the parrot, for example. The best way to make a\
    \ good **Not the Duck** training set is to click an even mix of the other characters.\n\
    \n     *   Second, try to include some tiles with no characters at all. You want\
    \ the computer to learn that empty tiles are also *not the duck*.\n\n     ![Figure\
    \ 9-17: Training data for finding the duck](image_fi/500563c09/f09017.png)\n\n\
    \     [Figure 9-17:](#c09.xhtml#figureanchor9-17) *Training data for finding the\
    \ duck*\n\n17.  Click **Back to project** and then **Learn & Test**. Click **Train\
    \ new machine learning model**, as shown in [Figure 9-18](#c09.xhtml#figure9-18).\n\
    \n     Wait for the model to finish training. This might take a few minutes.\n\
    \n     ![Figure 9-18: Train an ML model using the examples that you collected.](image_fi/500563c09/f09018.png)\n\
    \n     [Figure 9-18:](#c09.xhtml#figureanchor9-18) Train an ML model using the\
    \ examples that you collected.\n\n### Prepare Your Project\n\nNext, you need to\
    \ modify your Scratch project to finish the test scripts.\n\n1.  Click the **0,0**\
    \ sprite in the sprites list at the bottom right and find the `when I receive\
    \ test-0,0` script in the Code Area. It’s to the right of the scripts you worked\
    \ on before, as shown in [Figure 9-19](#c09.xhtml#figure9-19).\n\n    ![Figure\
    \ 9-19: Find the test script in the 0,0 sprite.](image_fi/500563c09/f09019.png)\n\
    \n    [Figure 9-19:](#c09.xhtml#figureanchor9-19) Find the test script in the\
    \ **0,0** sprite.\n\n2.  In the `when I receive test-0,0` script, drag in a `recognise\
    \ image (label)` block from the **Find the duck** group and update it as shown\
    \ in [Figure 9-20](#c09.xhtml#figure9-20).\n\n    This script will use your ML\
    \ model to test whether the bottom-left tile contains the duck and display the\
    \ message “Is the duck here?” if it does.\n\n    ![Figure 9-20: Update the test\
    \ script to use your ML model.](image_fi/500563c09/f09020.png)\n\n    [Figure\
    \ 9-20:](#c09.xhtml#figureanchor9-20) Update the test script to use your ML model.\n\
    \n3.  Repeat step 2 for all 12 sprites (see [Figure 9-21](#c09.xhtml#figure9-21)).\
    \ Once you’ve done this, your ML model can check all of the tiles to look for\
    \ the duck.\n\n    ![Figure 9-21: Add the test blocks to all 12 sprites.](image_fi/500563c09/f09021.png)\n\
    \n    [Figure 9-21:](#c09.xhtml#figureanchor9-21) Add the test blocks to all 12\
    \ sprites.\n\n### Test Your Project\n\nIt’s time to test your ML model!\n\n1.\
    \  Click the Green Flag and then click **Test** in the Scratch project on the\
    \ Stage.\n\n    Your project will use your ML model to test every tile and highlight\
    \ any it recognizes as the duck, as shown in [Figure 9-22](#c09.xhtml#figure9-22)."
