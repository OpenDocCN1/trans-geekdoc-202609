- raw: 'Try typing a variety of sentences that describe the movies that you enjoy
    and see what your project recommends. Avoid using words or phrases that you put
    in the original training buckets to see if your ML model has learned to recognize
    new sentences.


    ### Introduce Bias


    Click **Back to project** and then **Train** to return to the Train phase.


    Now choose a fourth movie that is a bit similar to one of your first three. For
    my project, I chose *Frankenstein*, a horror film that’s a little similar to *Nosferatu*.


    Click **Add new label** to add a new training bucket for your fourth film.


    Delete a few of the training examples from the first film (*Nosferatu* in my case)
    and add them to your new film (*Frankenstein* for me) instead.


    You should end up with something like [Figure 15-12](#c15.xhtml#figure15-12).


    ![Figure 15-12: Move a few of the examples to the new film.](image_fi/500563c15/f15012.png)


    [Figure 15-12:](#c15.xhtml#figureanchor15-12) Move a few of the examples to the
    new film.


    Add another 12 examples to your new movie. You should end up with something like
    [Figure 15-13](#c15.xhtml#figure15-13).


    ![Figure 15-13: Training examples for the new movie](image_fi/500563c15/f15013.png)


    [Figure 15-13:](#c15.xhtml#figureanchor15-13) Training examples for the new movie


    Click **Back to project** and then **Learn & Test**. Train a new ML model with
    the updated training examples.


    When the training is finished, click **Back to project** and **Make** and then
    open **Scratch 3** again.


    Click **File**▶**Load from your computer** to open the Scratch project that you
    saved before. Update it to add your new movie. This will mean adding a costume
    with the poster for your new movie and updating the script with a fourth `if`
    block to recognize and recommend your new movie, as shown in [Figure 15-14](#c15.xhtml#figure15-14).


    ![Figure 15-14: Update your project to add the fourth movie.](image_fi/500563c15/f15014.png)


    [Figure 15-14:](#c15.xhtml#figureanchor15-14) Update your project to add the fourth
    movie.


    ### Test Your Biased Project


    Try testing your project again. You should find that it has a preference for the
    new fourth movie, particularly over the one that’s similar to it.


    For my project, that means if I mention anything about scary films, getting my
    heart racing or my adrenaline pumping, or monsters, my ML model will always recommend
    *Frankenstein* now—not *Nosferatu* as it did before. It isn’t balanced between
    sometimes recommending one and sometimes the other. It seems to have a preference,
    or a bias, toward *Frankenstein*. In fact, it’s difficult to get it to recommend
    *Nosferatu* at all unless I type a sentence exactly like one of my training examples.


    Experiment with your project to see how it performs. Every ML model behaves a
    little differently, so try to get a feel for how the one you’ve trained is working.


    ## Review Your Project


    We talked in Chapter 8 about ways to measure the performance of an ML model, such
    as *precision* and *recall*. If you calculate some of these values before and
    after you intentionally bias your ML model, you can measure how bias impacts your
    project.


    When you think you’ve identified the way your ML model is behaving, the next step
    is to understand why. Look at [Figure 15-13](#c15.xhtml#figure15-13) again. Why
    is my ML model recommending *Frankenstein* more often?


    When you collect training examples, you’re asking the computer to identify patterns
    in those examples, which it uses to learn to recognize new samples in the future.
    The number of examples you put in each bucket is one area where the computer looks
    for patterns. By putting many more examples in the *Frankenstein* training bucket,
    I influenced the ML model in a way that went beyond the individual training examples.


    Say you’re teaching a child to recommend movies. Imagine you tell them 5 times
    that they should recommend Movie A, and 1,000 times you tell them that they should
    recommend Movie B. What impact would that have on their expectations? If you tell
    them over and over again that the right answer is Movie B, they’ll probably learn
    that the movie they should recommend is almost always Movie B.


    This is similar to the way ML systems behave. The computer looks for patterns
    in all of your training examples in many, many ways. Your training tells it which
    of those ways it should trust more than others. If the training examples tell
    it over and over again that the patterns, techniques, and processes that tend
    to result in the answer Movie B are correct, it learns to trust those patterns,
    techniques, and processes. If the training examples tell it over and over again
    that the patterns, techniques, and processes that result in the answer Movie A
    are wrong, it learns not to trust them.


    Even if it identifies patterns, techniques, and processes that result in the answer
    Movie A in the future, your training examples have trained it not to trust them
    and to prefer instead those that suggest Movie B.


    As you have seen, the amount of training data in each bucket is an important factor
    in creating ML systems. An imbalance in the number of training examples in the
    different buckets can result in what we call a *biased* system.


    ## The Case for Bias


    In most of the projects in this book so far, we’ve tried to keep the number of
    training examples in each bucket roughly the same. This is a common principle
    in many ML projects in an attempt to minimize bias.


    But while bias is an important factor to keep in mind, it’s not necessarily always
    a bad thing.


    Say you’re training a computer to recognize the difference between three possible
    outcomes: X, Y, and Z. Imagine that X and Y are very common; they are almost always
    the right answer. Outcome Z is possible, but it’s very, very rare. Even though
    Z hardly ever happens, you want to train the computer to be able to recognize
    it when it does.


    A balanced set of training examples, with the same number of examples for X, Y,
    and Z, might not be appropriate here. Having more training examples for X and
    Y, and fewer for Z, might train the ML model that X and Y are more likely, and
    in this case that’s correct. Outcomes X and Y *are*  more common, and Z is rare.
    Such a system would still be biased, but the bias reflects the statistical likelihood
    of the different outcomes, and so it might actually be appropriate and helpful.


    ## AI and Ethics


    Throughout this chapter, we’ve seen that the training you provide to an ML system
    will strongly influence the answers that it gives. What do you think this means
    for the responsibilities of the people who create AI systems? Do you think AI
    developers have an ethical responsibility to balance their training data or to
    avoid creating biased systems?


    Does intention make a difference? If someone accidentally develops a biased system,
    is this more or less ethical than someone who wanted to influence the output of
    their system and intentionally skewed their training data?


    Does money make a difference? In other words, if the producer of my fourth movie
    paid me lots of money to make my movie recommendation app prefer their movie over
    their competitors’ movies, would this be more or less ethical than me making a
    biased app that wouldn’t personally benefit me?


    Does the subject make a difference? In other words, do you think that a biased
    AI movie recommendation app is less of an ethical concern than an AI app that
    makes medical treatment recommendations to doctors?'
