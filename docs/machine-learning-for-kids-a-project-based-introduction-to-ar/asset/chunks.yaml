    \ project.\n\n   For my project, I used tabloid and broadsheet.\n\n   ![Figure\
    \ 8-3: Create training buckets for the two groups to compare.](image_fi/500563c08/f08003.png)\n\
    \n   [Figure 8-3:](#c08.xhtml#figureanchor8-3) Create training buckets for the\
    \ two groups to compare.\n4. Find and copy an example of your first group. This\
    \ will depend on what you’re doing your project on. It could be a newspaper headline\
    \ if you’re doing a project on headlines. It could be the first paragraph of an\
    \ article if you’re comparing the way that different newspapers write articles\
    \ about the same topic.\n\n   For my project, I copied headlines from a website\
    \ that has the front page for national newspapers in the UK.\n5. Click **Add example**\
    \ in each of your training buckets, as shown in [Figure 8-4](#c08.xhtml#figure8-4),\
    \ and paste in the examples that you found.\n\n   ![Figure 8-4: First training\
    \ example for the project](image_fi/500563c08/f08004.png)\n\n   [Figure 8-4:](#c08.xhtml#figureanchor8-4)\
    \ First training example for the project\n6. Repeat steps 4 and 5 until you’ve\
    \ got at least 20 examples in each training bucket, as shown in [Figure 8-5](#c08.xhtml#figure8-5).\n\
    7. Click **Back to project** in the top-left corner of the screen.\n\n   ![Figure\
    \ 8-5: Training data for the project](image_fi/500563c08/f08005.png)\n\n   [Figure\
    \ 8-5:](#c08.xhtml#figureanchor8-5) Training data for the project\n8. Click **Learn\
    \ & Test**, as shown in [Figure 8-6](#c08.xhtml#figure8-6).\n\n   ![Figure 8-6:\
    \ Learn & Test is the second phase of an ML project.](image_fi/500563c08/f08006.png)\n\
    \n   [Figure 8-6:](#c08.xhtml#figureanchor8-6) Learn & Test is the second phase\
    \ of an ML project.\n9. Click **Train new machine learning model**, as shown in\
    \ [Figure 8-7](#c08.xhtml#figure8-7).\n\n   ![Figure 8-7: Click Train new machine\
    \ learning model to start the training.](image_fi/500563c08/f08007.png)\n\n  \
    \ [Figure 8-7:](#c08.xhtml#figureanchor8-7) Click Train new machine learning model\
    \ to start the training.\n"
  trans: "\n\n例如，你可以以同样的方式训练一个 ML 模型来识别正式写作与口语化写作之间的差异——通过训练它识别人们选择的词汇和使用的用词中的模式。\n\
    \n不同的报纸和新闻网站使用不同的词汇和短语来描述同一个故事。在本章中，你将通过创建一个可以识别标题来自何种报纸的 ML 模型，训练计算机识别媒体中语言用法（参见图\
    \ 8-1）。\n\n![图 8-1: 识别报纸标题](img/f08001.png)\n\n图 8-1： 识别报纸标题\n\n让我们开始吧！\n\n##\
    \ 构建你的项目\n\n这个项目的目的是观察计算机是否能学习报纸使用语言的方式。对于本章中的截图，我训练了一个 ML 模型来识别来自 `tabloids`（带有八卦故事和大量照片的小型报纸）的标题与\
    \ `broadsheets`（带有更严肃文章的传统大尺寸报纸）标题的对比。\n\n你也可以做相同的主题，或者设计自己的项目。如果你选择设计自己的项目，你应该选择*一个*特征来训练计算机进行识别。你有很多可以调查的内容。例如，你可以基于以下内容开展项目：\n\
    \n1. 英国报纸（对比美国报纸）：美国报纸使用的语言方式与英国报纸不同吗？\n2. 夏季标题（与冬季标题对比）：不同季节的头条版标题编写方式不同吗？\n\
    3. 国家报纸（对比地方报纸）：国家报纸的标题与你所在当地报纸的标题编写方式不同吗？\n4. 周末标题（对比工作日标题）：报纸在工作日和学校日使用的语言与周末不同吗？\n\
    5. 来自两份不同报纸的文章：如果你挑选两份特定的报纸，你能训练计算机识别出其中一份的文章的文章吗？\n6. 1950 年代的标题（与现在的标题对比）：现在标题的编写方式与过去不同吗？\n\
    \n你需要一些你想要训练 ML 模型识别的类型报纸文章或标题的示例。有很多网站可以用来寻找示例。以下是一些建议：\n\n1. `https://www.thepaperboy.com/`\n\
    2. `https://www.ukpressonline.co.uk/`\n3. `https://www.time.com/vault/`\n\n思考你认为哪些对比是有有趣的，然后看看是否能找到足够的示例以便于进行。\n\
    \n你需要两组数据来训练 ML 模型：\n\n* 你想要模型识别的类型报纸文章/标题示例\n* *不具备*该特征的报纸文章/标题示例\n\n尝试在第二组数据中只改变一个特征。例如，`headlines\
    \ from UK tabloids in the 1970s`（1970 年代英国小报的标题）这一类别有三个变量：国家（英国）、报纸类型（小报）和时间段（1970\
    \ 年代）。你会在第二组中放入什么呢？\n\n你可以向其中填充 1970 年代美国小报的标题示例，这样计算机就能学会识别 1970 年代英国和美国小报标题之间的差异。或者，你也可以向其中填充今天英国小报的标题示例，这样计算机就能学会识别\
    \ 1970 年代与现在英国小报标题之间的差异。\n\n你*不应该*做的是，例如使用当前美国大报的标题。那会改变所有三个变量，使得模型难以识别出一致的模式。\n\
    \n另一个例子，如果你想训练计算机识别 `Daily Times` 文章的编写方式，在第二组中你可以包含来自同一天不同报纸的文章。更好的是，你可以尝试选择关于相同主题的文章。这样你的\
    \ ML 模型学习的就不是识别文章的主题，而是 `Daily Times` 描述相同主题时的模式。\n\n为了训练我的 ML 模型识别小报标题，我将小报标题示例与大报标题进行了对比。以下是我保持不变的因素：\n\
    \n* 我使用了*相同时期*的报纸：2015 年 3 月至 2015 年 4 月。\n* 我使用了每份报纸的*相同板块*：首页字号最大的标题。\n* 我使用了*相同类型*的报纸：国家级工作日报。\n\
    * 我使用了*相同国家*的报纸：英国。\n\n### 训练你的模型\n\n1. 创建一个新的 ML 项目，命名为 `Newspapers`，并设置为学习识别你偏好语言的文本。\n\
    2. 点击 **Train**，如图 8-2 所示。\n\n   ![图 8-2: Train 是 ML 项目的第一阶段。](img/f08002.png)\n\
    \n   图 8-2： Train 是 ML 项目的第一阶段。\n3. 点击 **Add label**，如图 8-3 所示，为你想要对比的两个组数据创建训练桶（buckets）。\n\
    \n   对于我的项目，我使用了小报和大报。\n\n   ![图 8-3：创建对比的两个组](img/f08003.png)\n\n   图 8-3： 创建对比的两个组。\n\
    4. 找到你第一组的示例。这取决于你正在做的项目。如果你在做标题，那就是标题；如果你在对比不同报纸的文章写法，那就是文章的第一段。\n\n   对于我的项目，我从国家报网站网站复制了首页。\n\
    5. 在每个训练桶中点击 **Add example**，如图 8-4 所示，并粘贴你找到的示例。\n\n   对于我的项目，我使用了英国国家报网站。\n\n\
    \   ![图 8-4: 训练示例](img/f08004.png)\n\n   图 8-4： 训练示例\n6. 重复步骤 4 和步骤 5，直到每个训练桶中至少有\
    \ 20 个示例，如图 8-5 所示。\n7. 点击屏幕左角的 **Back to project**。\n\n   ![图 8-5: 训练数据](img/f08005.png)\n\
    \n   图 8-5： 训练数据\n8. 点击 **Learn & Test**，如图 8-6 所示。\n\n   ![图 8-6: Learn & Test\
    \ 是 ML 项目的第二阶段。](img/f08006.png)\n\n   图 8-6： Learn & Test 是 ML 项目的第二阶段。\n9. 点击\
    \ **Train new machine learning model**，如图 8-7 所示。\n\n   ![图 8-7: 点击训练机器学习模型以开始训练。](img/f08007.png)\n\
    \n   图 8-7： 点击训练机器学习模型以开始训练。\n\n"
