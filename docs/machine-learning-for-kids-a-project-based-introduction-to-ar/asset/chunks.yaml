    \    [Figure 8-14:](#c08.xhtml#figureanchor8-14) Second sprite for the Newspapers\
    \ project.\n13. On the `Code` tab, click `Variables` in the Toolbox and then click\
    \ `Make a List`. Fill this list with at least 10 examples of headlines/articles\
    \ that should go in the bottom half of the backdrop.\n    - As before, make sure\
    \ `for all sprites` is selected and name your list to match your second group.\n\
    \    - For my project, I created a list named `broadsheet headlines` and filled\
    \ it with 10 examples of broadsheet headlines, as shown in [Figure 8-15](#c08.xhtml#figure8-15).\n\
    \    - When you’ve typed your test headlines into the list, uncheck the list in\
    \ the Toolbox to hide the list from the Stage.\n14. Create a variable to count\
    \ these headlines by clicking your second newspaper sprite, clicking `Variables`\
    \ in the Toolbox, and clicking `Make a Variable`. Name the variable after your\
    \ second group.\n    - For my project, I created a variable called `my broadsheet\
    \ variable`, as shown in [Figure 8-15](#c08.xhtml#figure8-15).\n    ![Figure 8-15:\
    \ Preparing the data for the second group of newspapers.](image_fi/500563c08/f0815.png)\n\
    \    [Figure 8-15:](#c08.xhtml#figureanchor8-15) Preparing the data for the second\
