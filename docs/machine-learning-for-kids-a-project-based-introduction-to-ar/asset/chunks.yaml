- raw: "Table 8-1 shows the results of my ML model arranged in a confusion matrix.\n\
    \nTable 8-1: Arranging Results in a Confusion Matrix\n\n| **True positive** Headline\
    \ was from a tabloid.  \n\nML model thought it was from a tabloid.  \n\n(Correct)\
    \ || **False positive** Headline was not from a tabloid.  \n\nML model thought\
    \ it was from a tabloid.  \n\n(Incorrect) |\n\n| --- | --- |\n\n| **False negative**\
    \ Headline was from a tabloid.  \n\nML model thought it was not from a tabloid.\
    \  \n\n(Incorrect) || **True negative** Headline was not from a tabloid.  \n\n\
    ML model thought it was not from a tabloid.  \n\n(Correct) |\n\nIt’s a useful\
    \ way to describe the performance of an ML model that tells us more than accuracy\
    \ can by itself.\n\nIf my ML model thought everything was from a broadsheet newspaper,\
    \ the confusion matrix would look like [Figure 8-28](#c08.xhtml#figure8-28).\n\
    \n![Figure 8-28: Example of a confusion matrix](image_fi/500563c08/f08028.png)\n\
    \n[Figure 8-28:](#c08.xhtml#figureanchor8-28) Example of a confusion matrix\n\n\
    ### Measuring Performance: Precision and Recall\n\nAnother way that we describe\
    \ the performance of ML models is using *precision* and *recall*.\n\nPrecision\
    \ is calculated as `true positive / (true positive + false positive)`.\n\nRecall\
    \ is calculated as `true positive / (true positive + false negative)`.\n\nYou\
    \ can update your script to include the calculations shown in [Figure 8-29](#c08.xhtml#figure8-29).\
    \ Add them to the end of the `when I start as a clone` script for the second sprite,\
    \ after the `say` block.\n\n![Figure 8-29: Calculating precision and recall in\
    \ Scratch](image_fi/500563c08/f08029.png)\n\n[Figure 8-29:](#c08.xhtml#figureanchor8-29)\
    \ Calculating precision and recall in Scratch\n\nI added this calculation to the\
    \ script for my ML model. [Figure 8-30](#c08.xhtml#figure8-30) shows the results\
    \ I got.\n\n![Figure 8-30: Displaying precision and recall in Scratch](image_fi/500563c08/f08030.png)\n\
    \n[Figure 8-30:](#c08.xhtml#figureanchor8-30) Displaying precision and recall\
    \ in Scratch\n\nThe precision score means that when my ML model thinks something\
    \ is a tabloid headline, it is right 78 percent of the time.\n\nThe recall score\
    \ means that it found 70 percent of the tabloid headlines in the test set.\n\n\
    The accuracy score means that 75 percent of the answers the ML model gave were\
    \ correct.\n\nPrecision, recall, and accuracy all help to give a good description\
    \ of an ML model’s performance.\n\nFor example, [Figure 8-31](#c08.xhtml#figure8-31)\
    \ shows results from two different ML models that both have an accuracy score\
    \ of 50 percent. The other scores help to describe the differences in the way\
    \ the models are working.\n\n![Figure 8-31: Different ML models with 50 percent\
    \ accuracy](image_fi/500563c08/f08031.png)\n\n[Figure 8-31:](#c08.xhtml#figureanchor8-31)\
    \ Different ML models with 50 percent accuracy\n\nIn comparison to the way we\
    \ tested your project in the last chapter, which was by manually entering test\
    \ values and getting a feel for how many times the model is correct, using measurement\
    \ values is a more consistent and effective way to describe the performance of\
    \ ML models. We’ll look at another use of performance measurements for image recognition\
    \ projects in the next chapter.\n\n### Improving Your ML Model\n\nTry adding another\
    \ 10 examples to each of your two training buckets from the Train phase and use\
    \ them to train a new ML model from the Learn & Test phase.\n\nRerun your Scratch\
    \ script once the new ML model has finished training.\n\nWhat does the increased\
    \ number of training examples do to your precision, recall, and accuracy scores?\n\
    \n## What You Learned\n\nYou’ve seen from all of your own projects that ML isn’t\
    \ perfect and can make mistakes. ML doesn’t need to be perfect to be useful, however.\
    \ ML systems make up for their mistakes by working so quickly, analyzing massive\
    \ amounts of text that would take a lifetime for a person to read. Even if it\
    \ makes mistakes 10 percent of the time, an ML system can still be useful at finding\
    \ things that need attention. But it’s important to know how many mistakes an\
    \ ML system is making to measure how well it is performing.\n\nIn this chapter,\
    \ you learned that there are many ways of testing ML systems and measuring how\
    \ well they’re performing, which can help us decide how to use the results they\
    \ give us.\n\nIn the next chapter, you’ll learn about solving more complex problems\
    \ by breaking them up into separate pieces for an ML model to recognize, and you’ll\
    \ use a confusion matrix again to see how well this works.\n\n![](image_fi/book_art/chapterart.png)\n\
    \n# 9  \n\nFinding an Object in a Picture\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)n\
    \ earlier chapters, you learned that you can train an ML system so that if you\
    \ give it a picture, it can recognize the object in that picture. That’s useful\
    \ when the whole picture is of something that you’re interested in, as it was\
    \ when you made the Rock, Paper, Scissors game in Chapter 4. For that game, your\
    \ hand filled the photo. But sometimes we want the computer to learn to find something\
    \ that’s only a small part of a much bigger picture. In this chapter, you’ll see\
    \ how to break up a complex job into separate simpler parts and then use ML for\
    \ each part.\n\nFor example, imagine that you want to use ML to find where the\
    \ tree is in [Figure 9-1](#c09.xhtml#figure9-1).\n\n![Figure 9-1: Where is the\
    \ tree?](image_fi/500563c09/f09001.png)\n\n[Figure 9-1:](#c09.xhtml#figureanchor9-1)\
    \ Where is the tree?\n\nThe basic idea is that you train an ML model to recognize\
    \ pictures of trees, in the same way that you trained it to recognize pictures\
    \ of certain animals in Chapter 3. Then, you chop up this new photo into smaller\
    \ pieces and use that ML model to check which piece looks like a picture of a\
    \ tree.\n\nFor example, the top-left piece of [Figure 9-1](#c09.xhtml#figure9-1)\
    \ is shown in [Figure 9-2](#c09.xhtml#figure9-2). The ML model wouldn’t recognize\
    \ this picture as a tree, so we can say that the tree isn’t in the top left of\
    \ the picture.\n\n![Figure 9-2: Top left of Figure 9-1](image_fi/500563c09/f09002.png)\n\
    \n[Figure 9-2:](#c09.xhtml#figureanchor9-2) Top left of [Figure 9-1](#c09.xhtml#figure9-1)\n\
    \nOr, we could try the bottom-right piece shown in [Figure 9-3](#c09.xhtml#figure9-3).\
    \ The ML model wouldn’t recognize this picture as a tree either, so we can say\
    \ that the tree isn’t in the bottom right of the picture.\n\n![Figure 9-3: Bottom\
    \ right of Figure 9-1](image_fi/500563c09/f09003.png)\n\n[Figure 9-3:](#c09.xhtml#figureanchor9-3)\
    \ Bottom right of [Figure 9-1](#c09.xhtml#figure9-1)\n\nWe keep going until we\
    \ try testing a picture like [Figure 9-4](#c09.xhtml#figure9-4). When we get a\
    \ piece that the ML model has high confidence looks like a picture of a tree,\
    \ we know that we’ve found the location of the tree.\n\n![Figure 9-4: Bottom left\
    \ of Figure 9-1](image_fi/500563c09/f09004.png)\n\n[Figure 9-4:](#c09.xhtml#figureanchor9-4)\
    \ Bottom left of [Figure 9-1](#c09.xhtml#figure9-1)\n\nA good way to think of\
    \ it is that you’re breaking the picture up into tiles and testing each tile separately.\
    \ In this chapter, you’ll see for yourself how this method works as you train\
    \ an ML model to find where something is in randomly generated scenes.\n\n## Build\
    \ Your Project\n\nFor this chapter, we’ll use a Scratch project that chooses a\
    \ random backdrop and then randomly distributes a dozen sprites around the Stage.\
    \ One of the sprites is a duck. The aim of this project is to find the duck only\
    \ by looking at the Stage, without cheating by using the coordinates of the sprite\
    \ (see [Figure 9-5](#c09.xhtml#figure9-5)).\n\n![Figure 9-5: The objective of\
    \ this project is to find the duck.](image_fi/500563c09/f09005.png)\n\n[Figure\
    \ 9-5:](#c09.xhtml#figureanchor9-5) The objective of this project is to find the\
    \ duck.\n\n### Train Your Model\n\n1.  Create a new ML project, name it `Find\
    \ the duck`, and set it to learn to recognize images. \n\n2.  Click **Train**,\
    \ as shown in [Figure 9-6](#c09.xhtml#figure9-6). \n\n    ![Figure 9-6: Train\
    \ is the first phase of an ML project.](image_fi/500563c09/f09006.png)"
