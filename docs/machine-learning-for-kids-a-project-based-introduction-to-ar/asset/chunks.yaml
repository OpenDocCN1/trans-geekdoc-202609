- raw: "6.  Repeat step 5 until you have at least 10 examples of works of that genre,\
    \ as shown in [Figure 5-6](#c05.xhtml#figure5-6).\n\n    ![Figure 5-6: Training\
    \ examples of action movie posters](image_fi/500563c05/f05006.png)\n\n    [Figure\
    \ 5-6:](#c05.xhtml#figureanchor5-6) Training examples of action movie posters\n\
    \n7.  Repeat steps 3 through 6 for all of the genres that you want your model\
    \ to be able to recognize, as shown in [Figure 5-7](#c05.xhtml#figure5-7).\n\n\
    \    Try to collect a similar number of examples for each genre. In other words,\
    \ avoid having lots of examples in one bucket but hardly any in another bucket.\n\
    \n    ![Figure 5-7: Training examples for recognizing different types of movie\
    \ posters](image_fi/500563c05/f05007.png)\n\n    [Figure 5-7:](#c05.xhtml#figureanchor5-7)\
    \ Training examples for recognizing different types of movie posters\n\n8.  Click\
    \ **Back to project** in the top-left corner of the screen.\n\n9.  Click **Learn\
    \ & Test**, as shown in [Figure 5-8](#c05.xhtml#figure5-8).\n\n    ![Figure 5-8:\
    \ Learn & Test is the second phase of an ML project.](image_fi/500563c05/f05008.png)\n\
    \n    [Figure 5-8:](#c05.xhtml#figureanchor5-8) Learn & Test is the second phase\
    \ of an ML project.\n\n10.  Click **Train new machine learning model**, as shown\
    \ in [Figure 5-9](#c05.xhtml#figure5-9). \n\n     ![Figure 5-9: Click Train new\
    \ machine learning model to start the training process.](image_fi/500563c05/f05009.png)\n\
    \n     [Figure 5-9:](#c05.xhtml#figureanchor5-9) Click **Train new machine learning\
    \ model** to start the training process.\n\nThe computer will use the examples\
    \ that you’ve collected to look for patterns in the covers or posters from different\
    \ genres. Training the model may take a few minutes, depending on how many examples\
    \ you’ve collected, but you can move on to the next step of the project in your\
    \ second web browser window while you wait.\n\n### Prepare Your Model\n\nYou need\
    \ to test whether your ML model is able to recognize a genre from a picture it\
    \ hasn’t seen before. To test the model, you’ll save some new pictures that you\
    \ haven’t used for training and then create a script in Scratch to test your model\
    \ with them.\n\n1.  Search for more pictures of each genre you’ve chosen and save\
    \ them to your computer. To save the photos, right-click the image and select\
    \ **Save Picture** or **Save Image As**, as shown in [Figure 5-10](#c05.xhtml#figure5-10).\
    \ x\n\n    ![Figure 5-10: Saving test photos to your computer](image_fi/500563c05/f05010.png)\n\
    \n    [Figure 5-10:](#c05.xhtml#figureanchor5-10) Saving test photos to your computer\n\
    \n    Save these test photos in a folder on your computer, as shown in [Figure\
    \ 5-11](#c05.xhtml#figure5-11). The more pictures you save, the more you can use\
    \ to test your ML model.\n\n    ![Figure 5-11: Preparing test photos](image_fi/500563c05/f05011.png)\n\
    \n    [Figure 5-11:](#c05.xhtml#figureanchor5-11) Preparing test photos\n\n2.\
    \  Click **Back to project** in the top-left corner of the screen.\n\n3.  Click\
    \ **Make**, as shown in [Figure 5-12](#c05.xhtml#figure5-12).\n\n    ![Figure\
    \ 5-12: Make is the third phase of an ML project.](image_fi/500563c05/f05012.png)\n\
    \n    [Figure 5-12:](#c05.xhtml#figureanchor5-12) Make is the third phase of an\
    \ ML project.\n\n4.  Click **Scratch 3**, and then click **Open in Scratch 3**\
    \ to open a new window with Scratch.\n\n5.  Click the cat sprite (**Sprite1**)\
    \ in the sprites pane at the bottom right of the screen. Then, click the **Costumes**\
    \ tab at the top left.\n\n6.  Move your mouse pointer over the Choose a Costume\
    \ icon in the bottom-left corner. Click **Upload Costume** and find the folder\
    \ on your computer where you saved your downloaded test pictures.\n\n7.  Select\
    \ all of the test photos you saved in step 1 to upload them all at once as costumes\
    \ for the cat sprite. \n\n8.  Change the name of the cat sprite from **Sprite1**\
    \ by entering `test images` in the Sprite text box, shown in [Figure 5-13](#c05.xhtml#figure5-13).\
    \ \n\n    ![Figure 5-13: Create a sprite to hold the test images.](image_fi/500563c05/f05013.png)\n\
    \n    [Figure 5-13:](#c05.xhtml#figureanchor5-13) Create a sprite to hold the\
    \ test images.\n\n9.  You’ll need some button sprites for your Scratch project.\
    \ Move your mouse pointer over the Choose a Sprite icon in the bottom-right corner.\n\
    \n    To draw your own buttons, click **Paint** to access the drawing and coloring\
    \ tools. Don’t worry if you make a mistake while painting—just click the blue\
    \ undo arrow next to the costume name.\n\n    If you don’t like drawing, click\
    \ **Choose a Sprite** and choose one from the Scratch Sprites Library, as shown\
    \ in [Figure 5-14](#c05.xhtml#figure5-14).\n\n    Make one button for each of\
    \ your genres.\n\n    ![Figure 5-14: Access the Sprites Library by clicking Choose\
    \ a Sprite.](image_fi/500563c05/f05014.png)\n\n    [Figure 5-14:](#c05.xhtml#figureanchor5-14)\
    \ Access the Sprites Library by clicking **Choose a Sprite**.\n\n10.  Rename your\
    \ button sprites to match the genres, as shown in [Figure 5-15](#c05.xhtml#figure5-15).\
    \ I named my three buttons action, family, and drama.\n\n     ![Figure 5-15: Create\
    \ buttons for each genre.](image_fi/500563c05/f05015.png)\n\n     [Figure 5-15:](#c05.xhtml#figureanchor5-15)\
    \ Create buttons for each genre.\n\n11.  Click the **Costumes** tab and select\
    \ the Text tool (which looks like a T) to add labels to the buttons. Use the Fill\
    \ tool to choose the label color. Make your labels match the names of the genres,\
    \ as shown in [Figure 5-16](#c05.xhtml#figure5-16).\n\n12.  Next, you’ll create\
    \ three variables. Click the **Code** tab, click **Variables** in the Toolbox,\
    \ and then click **Make a Variable**, as shown in [Figure 5-17](#c05.xhtml#figure5-17).\n\
    \n     ![Figure 5-16: I’ve used the Text and Fill tools to add white labels to\
    \ each of the buttons.](image_fi/500563c05/f05016.png)\n\n     [Figure 5-16:](#c05.xhtml#figureanchor5-16)\
    \ I’ve used the Text and Fill tools to add white labels to each of the buttons.\n\
    \n     Two of the variables count how many times you agree or disagree with the\
    \ computer’s decision. Name the first variable `agree` and the second variable\
    \ `disagree`.\n\n     The third variable stores the computer’s choice for the\
    \ genre of the most recent picture. Name this variable `computer`.\n\n     ![Figure\
    \ 5-17: Click Make a Variable to create the project’s three variables.](image_fi/500563c05/f05017.png)\n\
    \n     [Figure 5-17:](#c05.xhtml#figureanchor5-17) Click **Make a Variable** to\
    \ create the project’s three variables.\n\n13.  Make sure the checkboxes next\
    \ to the `agree` and `disagree` variables are checked. This displays them on the\
    \ Stage so you can see the score while you test your project. Uncheck the box\
    \ next to the **computer** variable.\n\n14.  Click the **test images** sprite\
    \ (the sprite with your test pictures as costumes).\n\n15.  Copy the scripts shown\
