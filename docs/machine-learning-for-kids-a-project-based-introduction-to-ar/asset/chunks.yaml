- raw: "In this chapter, you learned that Tic Tac Toe, or Noughts and Crosses, has\
    \ been used to help people understand ML for decades. You trained an ML model\
    \ to recognize numbers and built a Tic Tac Toe board with numbered cells representing\
    \ each move. This project was based on the 1960 work of British AI researcher\
    \ Donald Michie, who used matchboxes and glass beads in his MENACE project. Each\
    \ matchbox represented a possible state of the game board, similar to the examples\
    \ that you collected in your training data. The number of beads in the matchboxes\
    \ was like the number of times an example shows up in one of the training buckets.\n\
    \nYou also saw the importance of having lots of training examples to improve your\
    \ ML model’s performance over time. Because the training set is updated with the\
    \ winner’s moves after each game, the model gradually gets better and more difficult\
    \ to beat. You learned that it can be useful to crowdsource, or share the work\
    \ of training the model across a large group of people, to save yourself some\
    \ time and effort.\n\nIn the next chapter, you’ll start to learn about how ML\
    \ projects can go wrong.\n\n![](image_fi/book_art/chapterart.png)\n\n# 14  \n\n\
    Confusing the Computer\n\n![Alphabet-U](image_fi/book_art/Alphabet-U.png)ntil\
    \ now, we’ve been focused on the great things that we can do using ML, and on\
    \ the ways that it is being used well in real-world applications. But, as you’ve\
    \ seen throughout this book, ML systems are not perfect or all-knowing. Their\
    \ behavior is determined by the training that we give them. The way that we train\
    \ our ML systems will affect the responses that they give, and not always in a\
    \ positive way. In this chapter, we’ll look at one of the most common challenges\
    \ in creating AI systems: *bias*.\n\nThe project in this chapter is based on an\
    \ old story, sometimes described as the *Russian Tank problem*, that is often\
    \ told to AI students. It’s probably not true, but it illustrates the impact of\
    \ bias in ML training sets.\n\nHere’s one example of how the story is told:\n\n\
    > Once upon a time, the US Army decided to use ML to recognize tanks hiding behind\
    \ trees in the woods. Researchers trained an ML model using photos of woods without\
    \ tanks, and photos of the same woods with tanks hiding behind trees.\n\n> \n\n\
    > The model seemed to do well with the researchers’ pictures, but when the US\
    \ Army tested their system, it didn’t do any better than random guesses.\n\n>\
    \ \n\n> It turned out that in the researchers’ training data, the photos of camouflaged\
    \ tanks had been taken on a cloudy day, while photos of the plain forest had been\
    \ taken on a sunny day. The ML model had learned to recognize cloudy days from\
    \ sunny days, instead of recognizing camouflaged tanks.\n\nHere’s another version:\n\
    \n> Once upon a time, the US Army tried training a computer to recognize the difference\
    \ between Russian and American tanks. Researchers trained an ML model using photos\
    \ they took of American tanks and spy photos they collected of Russian tanks.\n\
    \n> \n\n> The model seemed to do well with the researchers’ pictures, but when\
    \ the US Army tested their system, the ML model didn’t do any better than random\
    \ guesses.\n\n> \n\n> It turned out that the researchers’ photos of American tanks\
    \ were large, high resolution, and high quality. But the long-distance spy photos\
    \ they were able to get of Russian tanks were all blurry, low resolution, and\
    \ grainy.\n\n> \n\n> The ML model had learned to recognize the difference between\
    \ grainy photos and high-quality photos, instead of between Russian and American\
    \ tanks.\n\nAs another example, when researchers at Stanford University were developing\
    \ an ML system to recognize skin cancers from photos, they accidentally created\
    \ an ML model that recognized rulers, because medical photographs of skin cancers\
    \ normally include a ruler to show the size of the lesion or tumor.\n\nThe point\
    \ is that, due to unintentional bias, ML systems can learn to spot patterns that\
    \ their creators might not have been aware of or that weren’t intended to be treated\
    \ as patterns.\n\nIn this chapter, you’ll train an image classifier to recognize\
    \ pictures of objects, but you’ll introduce bias to make it get things wrong.\
    \ We’ll see firsthand what sorts of problems can cause an ML model to make mistakes,\
    \ and then we’ll talk about how we can avoid these problems and fix the model.\n\
    \n## Build Your Project\n\nChoose two objects that you want to train the computer\
    \ to recognize photographs of. Pick things that are obviously different. Don’t\
    \ choose anything too personal, as you’ll need to upload the photos to the internet\
    \ to do the project.\n\nFor my screenshots, I chose a lemon and a grapefruit that\
    \ I found in my kitchen. You can choose anything you like, though.\n\nPut the\
    \ first object down somewhere and take 10 similar-looking photographs of it. You\
    \ don’t need the photos to be high resolution. Small photos (under 800 pixels\
    \ in width) will work best.\n\nI put my grapefruit down on a wooden floor in a\
    \ dark room, and took the photos shown in [Figure 14-1](#c14.xhtml#figure14-1).\n\
    \n![Figure 14-1: Photos of my first object, a grapefruit](image_fi/500563c14/f14001.png)\n\
    \n[Figure 14-1:](#c14.xhtml#figureanchor14-1) Photos of my first object, a grapefruit\n\
    \nPut the second object down somewhere different and take 10 photographs of it.\n\
    \nI put my lemon down on a cream-colored carpet in a bright, light room and took\
    \ the photos shown in [Figure 14-2](#c14.xhtml#figure14-2).\n\n![Figure 14-2:\
    \ Photos of my second object, a lemon](image_fi/500563c14/f14002.png)\n\n[Figure\
    \ 14-2:](#c14.xhtml#figureanchor14-2) Photos of my second object, a lemon\n\n\
    Don’t make the object too large in the photos. Try to keep the object in the same\
    \ position in each photo, as shown in Figures [14-1](#c14.xhtml#figure14-1) and\
    \ [14-2](#c14.xhtml#figure14-2).\n\nThe aim is to make all 10 photographs very\
    \ similar *within each set*, but to make everything—the object, the background,\
    \ the lighting—different *between the two sets*. For example, if your photos of\
    \ the first object are on a dark background, take your photos of the second object\
    \ on a light background. But all  the photos of the first object should be on\
    \ the dark background, and all of the photos of the second object should be on\
    \ the light background.\n\nHere are some other ideas for how you could make your\
    \ two sets of photographs different.\n\n| **If your photos of the first object\
    \ are all…** || **Take all the photos of the second object…** |\n\n| --- | ---\
    \ |\n\n| on a *dark* background || on a *light* background |\n\n| --- | --- |\n\
    \n| on *tiles* || on *grass* |\n\n| *brightly lit* || *somewhere dark* |\n\n|\
    \ *clear*, *crisp*, and *focused* || *fuzzy* and *blurry* |\n\n| *outdoors* with\
    \ a garden in the background || *indoors* with the same room in the background\
    \ |\n\nHave another look at my photos. The photos in [Figure 14-1](#c14.xhtml#figure14-1)\
    \ have in common dark lighting, the dark brown surface, and the wooden pattern\
    \ background. The photos in [Figure 14-2](#c14.xhtml#figure14-2) have in common\
    \ bright lighting, the cream surface, and the speckled carpet background.\n\n\
    You don’t have to copy my photos exactly. Be creative!\n\nOnce you’ve taken your\
    \ 20 photos, you need to put them online somewhere to make them available for\
    \ training. Choose any photo hosting web service that will let you upload photos\
    \ to the internet for no charge. (If you already have an account with a photo\
    \ sharing service, you might want to create a new one for this project, as your\
    \ 20 similar photos of a couple of random household objects are probably not very\
    \ interesting to share!)\n\nThe most important thing is to upload your photos\
    \ somewhere they can be accessed without a login so that your ML system can access\
    \ them and learn from them.\n\n### Train Your Model\n\n1.  Go to *[https://machinelearningforkids.co.uk/](https://machinelearningforkids.co.uk/)*.\
    \ Create a new ML project, name it `Confuse the computer`, and set it to learn\
    \ to recognize images. \n\n2.  Click **Train**, as shown in [Figure 14-3](#c14.xhtml#figure14-3)."
