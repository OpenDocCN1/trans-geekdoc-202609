  trans: '


    表 8-1 展示了以混淆矩阵排列的我的 ML 模型结果。


    #### 表 8-1：在混淆矩阵中排列结果


    | **真正例（True positive）** 标题来自小报纸。ML 模型认为它来自小报纸。（正确） | **假正例（False positive）**
    标题不是来自小报纸。ML 模型认为它来自小报纸。（错误） |

    | --- | --- |

    | **假负例（False negative）** 标题来自小报纸。ML 模型认为它不是来自小报纸。（错误） | **真负例（True negative）**
    标题不是来自小报纸。ML 模型认为它不是来自小报纸。（正确） |


    这是描述 ML 模型性能的一种有用方法，它告诉我们的信息比单纯的准确率要多。


    如果我的 ML 模型认为所有内容都来自大报，那么混淆矩阵看起来就会像图 8-28。


    ![图 8-28：混淆矩阵示例](img/f08028.png)


    图 8-28： 混淆矩阵示例


    ### 衡量性能：精确率和召回率


    另一种描述 ML 模型性能的方法是使用 `precision`（精确率）和 `recall`（召回率）。


    精确率的计算公式为 `true positive / (true positive + false positive)`。


    召回率的计算公式为 `true positive / (true positive + false negative)`。


    你可以更新脚本以包含图 8-29 所示的计算。将它们添加到第二个角色的 `when I start as a clone` 脚本末尾，`say` 模块之后。


    ![图 8-29：在 Scratch 中计算精确率和召回率](img/f08029.png)


    图 8-29： 在 Scratch 中计算精确率和召回率


    我将此计算添加到了我的 ML 模型脚本中。图 8-30 显示了我得到的结果。


    ![图 8-30：在 Scratch 中显示精确率和召回率](img/f08030.png)


    图 8-30： 在 Scratch 中显示精确率和召回率


    精确率得分意味着，当我的 ML 模型认为某个内容是小报标题时，它的正确概率为 78%。


    召回率得分意味着它找到了测试集中 70% 的小报标题。


    准确率得分意味着 ML 模型给出的答案中有 75% 是正确的。


    精确率、召回率和准确率都有助于对 ML 模型的性能提供良好的描述。


    例如，图 8-31 展示了两个不同 ML 模型的结果，它们的准确率均为 50%。其他得分有助于描述模型工作方式的差异。


    ![图 8-31：准确率均为 50% 的不同 ML 模型](img/f08031.png)


    图 8-31： 准确率均为 50% 的不同 ML 模型


    与我们上一章中测试你的项目的方式（即通过手动输入测试值并直感受模型正确的次数）相比，使用测量值是描述 ML 模型性能的一种更一致、更有效的方法。我们将在下一章中查看性能测量在图像识别项目中的另一个用途。


    ### 改进你的 ML 模型


    尝试从“训练（Train）”阶段的你的两个训练桶（buckets）中每个再添加 10 个示例，并使用它们从“学习与测试（Learn & Test）”阶段训练一个新的
    ML 模型。


    在新的 ML 模型训练完成后，重新运行你的 Scratch 脚本。


    训练示例数量的增加对你的精确率、召回率和准确率得分产生了什么影响？


    ## 你学到了什么


    从你所有的项目中看到，ML 并不是完美的，并且会出错。然而，ML 并不需要完美就能有用。ML 系统通过极速运行、分析海量文本来弥补其错误，而这些文本可能需要一生才能处理完。


    '
