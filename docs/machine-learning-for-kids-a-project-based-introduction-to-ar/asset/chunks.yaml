- raw: "![Alphabet-A](image_fi/book_art/Alphabet-A.png)I and ML have exciting potential\
    \ for the future of computer games, such as computer game characters that learn\
    \ to understand your words and actions. There are already games where characters\
    \ behave like the chatbots you learned about in the last chapter. However, the\
    \ opportunity for truly intelligent games that adapt as they are played is enormous.\n\
    \nIn this chapter, we’ll look at the reverse situation: not how AI can contribute\
    \ to game development, but how games have been used in AI development.\n\nGames\
    \ provide a simulation environment with a well-defined goal, a way to collect\
    \ training examples, and a way to measure effectiveness, which makes them a great\
    \ platform for the research and development of computer systems that can learn.\n\
    \n*Pac-Man* (and *Ms. Pac-Man*) is an example of a classic computer game that\
    \ has regularly been used in AI research. The *Ms. Pac-Man AI competition*, where\
    \ academics submit ML systems that compete to see which is best at playing the\
    \ game, has been held multiple times since 2007 and is still used as a task for\
    \ AI students and researchers today.\n\nIn this chapter, you’ll try training an\
    \ ML system to play a simplified version of *Pac-Man*, where the objective is\
    \ to navigate a character through a maze while avoiding a monster (see [Figure\
    \ 12-1](#c12.xhtml#figure12-1)).\n\nLet’s get started!\n\n![Figure 12-1: A simple\
    \ video game we can train an ML system to play](image_fi/500563c12/f12001.png)\n\
    \n[Figure 12-1:](#c12.xhtml#figureanchor12-1) A simple video game we can train\
    \ an ML system to play\n\n## Build Your Project\n\nBefore we start, try the game\
    \ for yourself so you understand what we’ll be training the computer to do. First,\
    \ go to [https://machinelearningforkids.co.uk/scratch3/](https://machinelearningforkids.co.uk/scratch3/)\
    \ and click **Project templates** in the top menu bar, as shown in [Figure 12-2](#c12.xhtml#figure12-2).\n\
    \n![Figure 12-2: Access the game from the Project templates menu.](image_fi/500563c12/f12002.png)\n\
    \n[Figure 12-2:](#c12.xhtml#figureanchor12-2) Access the game from the **Project\
    \ templates** menu.\n\nClick the **Avoid the monster** game as shown in [Figure\
    \ 12-3](#c12.xhtml#figure12-3).\n\n![Figure 12-3: Click Avoid the monster in the\
    \ list of project templates.](image_fi/500563c12/f12003.png)\n\n[Figure 12-3:](#c12.xhtml#figureanchor12-3)\
    \ Click **Avoid the monster** in the list of project templates.\n\nIn this game,\
    \ you play as the character *nano*, which starts off in the bottom-left corner\
    \ of the Stage. Your objective is to avoid the monster, which starts off in the\
    \ top-right corner of the Stage, for as long as you can.\n\nYou control nano using\
    \ the arrow keys to change direction. Nano can only follow the grid, so you can\
    \ only move up, down, left, and right. You can’t move diagonally.\n\nWhen you’re\
    \ not pressing an arrow key, nano will just continue in whatever direction you\
    \ last pressed.\n\nNano can’t move faster than the monster. The game’s code uses\
    \ a timer so that both nano and the monster can make only one move per second.\n\
    \nThere are two walls in the way. Neither nano nor the monster is allowed to go\
    \ through the walls.\n\nGive the game a try. Click the full-screen icon in the\
    \ controls at the top right and then click the Green Flag.\n\nHow long can you\
    \ avoid the monster?\n\n### Describe the State of the Game\n\nThe game board can\
    \ be represented as a graph, as shown in [Figure 12-4](#c12.xhtml#figure12-4).\n\
    \n![Figure 12-4: Think of the game board as a graph with x- and y-axes.](image_fi/500563c12/f12004.png)\n\
    \n[Figure 12-4:](#c12.xhtml#figureanchor12-4) Think of the game board as a graph\
    \ with x- and y-axes.\n\nUsing this graph, you can describe the locations of nano\
    \ and the monster as a pair of coordinates. For example, in [Figure 12-4](#c12.xhtml#figure12-4)\
    \ the monster is at *x* = 7 and *y* = 3.\n\nWe’ll use this representation of the\
    \ game to describe it to the computer.\n\nWe want to give the computer four numbers\
    \ so that it can decide to move nano up, down, left, or right to avoid the monster.\n\
    \nFor example, if we input the coordinates shown in [Figure 12-5](#c12.xhtml#figure12-5),\
    \ the computer could decide to move nano up.\n\n![Figure 12-5: Nano is at x =\
    \ 5, y = 5, and the monster is at x = 7, y = 3.](image_fi/500563c12/f12005.png)\n\
    \n[Figure 12-5:](#c12.xhtml#figureanchor12-5) Nano is at *x* = 5, *y* = 5, and\
    \ the monster is at *x* = 7, *y* = 3.\n\nYour objective for this project is to\
    \ train an ML model to decide on the best direction to avoid the monster.\n\n\
    ### Train Your Model\n\nTo train the computer to play the game, you need to collect\
    \ examples of the game being played. The best way to do this is to play the game\
    \ yourself and use your playing to train the computer.\n\nThe first step is to\
    \ prepare the training buckets where you’ll store examples of the moves you make.\n\
    \n1.  Go to *[https://machinelearningforkids.co.uk/](https://machinelearningforkids.co.uk/)*.\
    \ Create a new ML project, name it `Avoid the monster`, and set it to learn to\
    \ recognize numbers. \n\n2.  Click **Add a value**, type `nano x` for the value\
    \ name, and set **Type of value** to **number**. Click **Add another value** and\
    \ then add three more values named `nano y`, `monster x`, and `monster y`, as\
    \ shown in [Figure 12-6](#c12.xhtml#figure12-6). Once you’ve added all four values,\
    \ click **Create**.\n\n    These values will store the coordinates of the two\
    \ characters on the graph.\n\n    ![Figure 12-6: Prepare the values for the Avoid\
    \ the monster project.](image_fi/500563c12/f12006.png)\n\n    [Figure 12-6:](#c12.xhtml#figureanchor12-6)\
    \ Prepare the values for the Avoid the monster project.\n\n3.  Click **Train**,\
    \ as shown in [Figure 12-7](#c12.xhtml#figure12-7).\n\n    ![Figure 12-7: Click\
    \ Train to prepare your training buckets.](image_fi/500563c12/f12007.png)\n\n\
    \    [Figure 12-7:](#c12.xhtml#figureanchor12-7) Click **Train** to prepare your\
    \ training buckets.\n\n4.  Click **Add new label**, as shown in [Figure 12-8](#c12.xhtml#figure12-8),\
    \ and create four training buckets for the four directions nano can move. Call\
    \ them `go left`, `go right`, `go up`, and `go down`. (The underscores will be\
    \ added automatically.) \n\n    ![Figure 12-8: Prepare four training buckets for\
    \ the four directions nano can move.](image_fi/500563c12/f12008.png)\n\n    [Figure\
    \ 12-8:](#c12.xhtml#figureanchor12-8) Prepare four training buckets for the four\
    \ directions nano can move.\n\n    For example, imagine nano is at coordinates\
    \ *x* = 2, *y* = 3 and the monster is at the coordinates *x* = 6, *y* = 7 while\
    \ you’re playing the game. If you pressed the right arrow to move nano to the\
    \ right, that set of numbers would be added to the go\\_right training bucket,\
    \ as shown in [Figure 12-9](#c12.xhtml#figure12-9).\n\n    ![Figure 12-9: Moves\
    \ that you make while playing the game will be added to the training buckets.](image_fi/500563c12/f12009.png)\n\
    \n    [Figure 12-9:](#c12.xhtml#figureanchor12-9) Moves that you make while playing\
    \ the game will be added to the training buckets.\n\n    The next step is to collect\
    \ lots and lots of examples that we can use to train an ML model. We’ll collect\
    \ training examples by playing the game.\n\n5.  Click **Back to project** and\
    \ then click **Make**, as shown in [Figure 12-10](#c12.xhtml#figure12-10).\n\n\
    \    ![Figure 12-10: Click Make to use your project in Scratch.](image_fi/500563c12/f12010.png)\n\
    \n    [Figure 12-10:](#c12.xhtml#figureanchor12-10) Click **Make** to use your\
    \ project in Scratch.\n\n6.  Click **Scratch 3**, as shown in [Figure 12-11](#c12.xhtml#figure12-11).\n\
    \n    ![Figure 12-11: Click Scratch 3 to go back to Scratch.](image_fi/500563c12/f12011.png)\n\
    \n    [Figure 12-11:](#c12.xhtml#figureanchor12-11) Click **Scratch 3** to go\
    \ back to Scratch.\n\n7.  Click **straight into Scratch**, as shown in [Figure\
    \ 12-12](#c12.xhtml#figure12-12). \n\n8.  Click **Project templates** in the top\
    \ menu bar.\n\n9.  Click **Avoid the monster** to open the template again, this\
    \ time with blocks from your ML project. "
