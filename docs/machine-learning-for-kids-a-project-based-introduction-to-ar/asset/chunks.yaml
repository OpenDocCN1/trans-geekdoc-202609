    这已经足够赢得比赛。`Deep Blue` 并不比卡斯帕罗夫聪明，但它能够遵循更多的指令，并能比他更快地测试更多可能的走法。


    2011 年，一台名为 `Watson` 的计算机在美国电视问答节目《 Jeopardy!》中击败了冠军肯·詹宁斯和布拉德·鲁特。`Watson` 也是一个
    AI 项目，它展示了未来计算机系统学习和理解人类使用语言方式的潜力。


    与 `Deep Blue` 不同，`Watson` 是一个 `ML` 系统。它通过对自 20 世纪 60 年代以来每一集《Jeopardy!》的问题进行训练，以及通过与人类对手进行多次练习赛，学习如何玩这个游戏节目。


    今天人们仍然构建像 `Deep Blue` 这样的 AI 系统，因为遵循人类编写的逐步指令的简单 AI 系统仍然有用。然而，`ML` 可用于构建执行更复杂、更高级工作的
    AI 系统。


    ## 神经网络与深度学习


    神经网络和深度学习如图 1-2


    # 2 介绍少的机器学习


    ![Alphabet-I](img/Alphabet-I.png)在本书中，你将使用一个名为 `Machine Learning for Kids` 的免费教育工具构建
    `ML` 项目。本章将介绍该工具如何工作、你将如何在每个项目中使用它，以及你的父母或老师如何为你进行设置。


    你可以在 [`MachineLearningForKids.co.uk/`](https://MachineLearningForKids.co.uk/)
    找到 `Machine Learning for Kids`。这个网址很长，所以第一次访问时保存书签是个好主意。


    主页如图 2-1


    图 2-1: Machine Learning for Kids 首页


    ## 登录


    书中每个项目的第一步都是进入 `Machine Learning for Kids` 网站并登录。


    点击顶部菜单栏中的 `Log In`。你将看到图 2-2


    图 2-2: Machine Learning for Kids 登录页面


    你在这里有两个选择：


    1. **登录 (Log in)**：如果你的父母或老师已经为你创建了免费账户，点击 `Log in` 并输入你的用户名和密码。登录允许你保存项目并在稍后返回。

    2. **立即尝试 (Try it now)**：如果你还没有账户，点击 `Try it now`。你仍然可以进行项目，但只能持续四小时。这足够完成书中的任何项目了，但你无法在稍后返回。


    关于父母或老师为你创建免费账户的 `Sign up` 按钮将在第 14 页的“创建账户”中解释。


    ## 创建新的 ML 项目


    登录后，你将被带到项目列表，如图 2-3


    图 2-3: 空项目列表


    要创建一个新新项目，请遵循以下步骤：


    1. 点击 `Add a new project`（参见图 2-3）。

    2. 在 `Project Name` 框中输入项目名称，如图 2-4）。


    你可以通过点击相应的蓝色按钮切换到每个阶段。项目说明会告诉你何时该进入下一个阶段。


    ![图 2-7: ML 项目阶段](img/f02007.png)


    图 2-7: ML 项目阶段


    ### 训练 (Train)


    在训练阶段，你收集你想让计算机学习的示例。


    你为要训练计算机识别的每个类别创建一个桶。每个桶都有灰色边框，如图 2-8


    图 2-8: 训练阶段


    接下来，你用示例填充这些桶。对于文本项目，这意味着收集属于每个类别的写作示例。在图 2-8 中，这些桶包含了 *something* 和 *something_else*
    类别的文本示例。（在实际项目中，对于 *kind* 文本类别，你可能会添加赞美之示例，而对于 *mean* 文本类别，你可能会添加侮辱。）对于图像项目，你将用说明类别的图片示例填充桶。对于声音项目，你将收集符合类别的录音示例。


    每个桶右下角的数字是一个实用的计数器，显示你目前为止收集了多少个示例。

