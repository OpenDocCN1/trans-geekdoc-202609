- raw: "To train the computer to recognize different pictures of your two animals,\
    \ you’ll need to collect lots of images of those animals and use them to train\
    \ an ML model.\n\n1.  Create a new ML project, enter `Animal sorter` as its name,\
    \ and set it to learn to recognize images. \n\n2.  Click **Train**, as shown in\
    \ [Figure 3-2](#c03.xhtml#figure3-2). \n\n    ![Figure 3-2: Train is the first\
    \ phase of an ML project.](image_fi/500563c03/f03002.png)\n\n    [Figure 3-2:](#c03.xhtml#figureanchor3-2)\
    \ Train is the first phase of an ML project.\n\n3.  Click **Add new label** (see\
    \ [Figure 3-3](#c03.xhtml#figure3-3)). Then enter the name of your first type\
    \ of animal.\n\n    ![Figure 3-3: Click Add new label to create a new bucket of\
    \ training examples.](image_fi/500563c03/f03003.png)\n\n    [Figure 3-3:](#c03.xhtml#figureanchor3-3)\
    \ Click **Add new label** to create a new bucket of training examples.\n\n4. \
    \ Open a second window in your web browser (usually by selecting **File**▶**New\
    \ Window**) and arrange your two windows side by side, as shown in [Figure 3-4](#c03.xhtml#figure3-4).\
    \ In the second window, search for photos of the first type of animal. In my case,\
    \ I’ve searched for photos of cows. \n\n    ![Figure 3-4: Arrange your two web\
    \ browser windows side by side.](image_fi/500563c03/f03004.png)\n\n    [Figure\
    \ 3-4:](#c03.xhtml#figureanchor3-4) Arrange your two web browser windows side\
    \ by side.\n\n5.  Drag a photo from the search window and drop it into the training\
    \ bucket for your first type of animal. You should see a thumbnail version of\
    \ the photo in your training bucket, as shown in [Figure 3-5](#c03.xhtml#figure3-5).\
    \ If you don’t see it, try dragging and dropping the photo again.\n\n    ![Figure\
    \ 3-5: Dropping photos of cows into my training bucket](image_fi/500563c03/f03005.png)\n\
    \n    [Figure 3-5:](#c03.xhtml#figureanchor3-5) Dropping photos of cows into my\
    \ training bucket\n\n6.  Repeat step 5 until you have at least 10 different photos\
    \ of that animal, as shown in [Figure 3-6](#c03.xhtml#figure3-6).\n\n    ![Figure\
    \ 3-6: My training data for recognizing photos of cows](image_fi/500563c03/f03006.png)\n\
    \n    [Figure 3-6:](#c03.xhtml#figureanchor3-6) My training data for recognizing\
    \ photos of cows\n\n7.  Repeat steps 3 through 6 until you have at least 10 different\
    \ photos for each type of animal, as shown in [Figure 3-7](#c03.xhtml#figure3-7).\n\
    \n    ![Figure 3-7: Training data for my farm-themed project](image_fi/500563c03/f03007.png)\n\
    \n    [Figure 3-7:](#c03.xhtml#figureanchor3-7) Training data for my farm-themed\
    \ project\n\n8.  Click **Back to project** in the top-left corner of the screen.\n\
    \n9.  Click **Learn & Test** (see [Figure 3-8](#c03.xhtml#figure3-8)).\n\n   \
    \ ![Figure 3-8: Learn & Test is the second phase of an ML project.](image_fi/500563c03/f03008.png)\n\
    \n    [Figure 3-8:](#c03.xhtml#figureanchor3-8) Learn & Test is the second phase\
    \ of an ML project.\n\n10.  Click **Train new machine learning model** (see [Figure\
    \ 3-9](#c03.xhtml#figure3-9)).\n\n     ![Figure 3-9: Click Train new machine learning\
    \ model to start the training.](image_fi/500563c03/f03009.png)\n\n     [Figure\
    \ 3-9:](#c03.xhtml#figureanchor3-9) Click **Train new machine learning model**\
    \ to start the training.\n\n     The computer will use the examples you’ve collected\
    \ to learn what the photos of each animal have in common. This can take a few\
    \ minutes, but you can continue to the next step in your second web browser window\
    \ while you wait.\n\n### Prepare Your Project\n\nTo test your ML model, you’ll\
    \ need some new photos that you haven’t used for training. The computer will use\
    \ what it learns from your training examples to try to recognize your two animals\
    \ in these new photos. Then you’ll build a project in Scratch that tests how well\
    \ your model performs.\n\n1.  Search for more photos of the animals you’ve chosen,\
    \ and save them to your computer. To save a photo, right-click it and select **Save\
    \ Picture** or **Save Image As**, as shown in [Figure 3-10](#c03.xhtml#figure3-10).\n\
    \n    ![Figure 3-10: Saving test photos to the computer](image_fi/500563c03/f03010.png)\n\
    \n    [Figure 3-10:](#c03.xhtml#figureanchor3-10) Saving test photos to the computer\n\
    \n2.  Aim for at least five test photos of each type of animal that you chose,\
    \ as shown in [Figure 3-11](#c03.xhtml#figure3-11). \n\n    ![Figure 3-11: My\
    \ folder for cow and sheep test photos](image_fi/500563c03/f03011.png)\n\n   \
    \ [Figure 3-11:](#c03.xhtml#figureanchor3-11) My folder for cow and sheep test\
    \ photos\n\n3.  Click **Back to project** in the top-left corner of the screen.\n\
    \n4.  Click **Make** (see [Figure 3-12](#c03.xhtml#figure3-12)).\n\n    ![Figure\
    \ 3-12: Make is the third phase of an ML project.](image_fi/500563c03/f03012.png)\n\
    \n    [Figure 3-12:](#c03.xhtml#figureanchor3-12) Make is the third phase of an\
    \ ML project.\n\n5.  Click **Scratch 3**, and then click **Open in Scratch 3**\
    \ to open a new window with Scratch.\n\n    You should see new blocks representing\
    \ your ML model in the Toolbox, as shown in [Figure 3-13](#c03.xhtml#figure3-13).\n\
    \n    ![Figure 3-13: New blocks for your ML project will automatically be added\
    \ to the Scratch Toolbox.](image_fi/500563c03/f03013.png)\n\n    [Figure 3-13:](#c03.xhtml#figureanchor3-13)\
    \ New blocks for your ML project will automatically be added to the Scratch Toolbox.\n\
    \n6.  Create a backdrop for your project.\n\n    In the bottom-right corner of\
    \ the Scratch window, move your mouse pointer over the Choose a Backdrop icon,\
    \ shown in [Figure 3-14](#c03.xhtml#figure3-14).\n\n    ![Figure 3-14: My farm\
    \ background for sorting cows and sheep into two groups](image_fi/500563c03/f03014.png)\n\
    \n    [Figure 3-14:](#c03.xhtml#figureanchor3-14) My farm background for sorting\
    \ cows and sheep into two groups\n\n    You have a few options here. If you don’t\
    \ like drawing, you can click **Choose a Backdrop** to pick a default background,\
    \ or click **Upload Backdrop** to use a picture from the internet. To design your\
    \ own background for your animals, click **Paint** and use the drawing and coloring\
    \ tools in the *paint editor* to the left of the Code canvas.\n\n    No matter\
    \ which option you choose, be sure to add clearly labeled sections to your backdrop\
    \ for each type of animal.\n\n    I chose farm animals, so I drew a farm scene\
    \ with signs labeled Cows and Sheep. You can draw something that fits with the\
    \ animals you chose. For example, if you chose dogs and cats, you could draw a\
    \ pet shop. If you chose lions and elephants, you could draw a zoo.\n\n7.  Click\
    \ the cat sprite, and then in the bottom-left corner of the screen, move your\
    \ mouse pointer over the Choose a Costume icon. Click **Upload Costume**, as shown\
    \ in [Figure 3-15](#c03.xhtml#figure3-15).\n\n8.  Select all of the test photos\
    \ you saved in step 2 to upload all of them at once.\n\n    ![Figure 3-15: Click\
    \ Upload Costume to add your test photos. You can delete the cat costumes from\
    \ the costume pane on the left.](image_fi/500563c03/f03015.png)\n\n    [Figure\
    \ 3-15:](#c03.xhtml#figureanchor3-15) Click **Upload Costume** to add your test\
    \ photos. You can delete the cat costumes from the costume pane on the left.\n\
    \n9.  If you missed any of your test photos, click **Upload Costume** again and\
    \ repeat until you’ve uploaded all of the test photos from step 2.\n\n    We won’t\
    \ need the Scratch cat costumes, so you can delete them. In the *costume pane*\
    \ on the far left (see [Figure 3-15](#c03.xhtml#figure3-15)), click the costume\
    \ and then click the trash can in its top-right corner to delete it.\n\n    Make\
    \ sure that you upload costumes for the same single sprite, as shown in [Figure\
    \ 3-16](#c03.xhtml#figure3-16). Don’t upload each photo as a new sprite.\n\n \
    \   ![Figure 3-16: Upload additional costumes to the same sprite.](image_fi/500563c03/f03016.png)\n\
    \n    [Figure 3-16:](#c03.xhtml#figureanchor3-16) Upload additional costumes to\
    \ the *same* sprite.\n\n10.  Click the **Code** tab and copy the scripts shown\
    \ in [Figure 3-17](#c03.xhtml#figure3-17).\n\n     ![Figure 3-17: Example code\
    \ for sorting photos of animals](image_fi/500563c03/f03017.png)"
