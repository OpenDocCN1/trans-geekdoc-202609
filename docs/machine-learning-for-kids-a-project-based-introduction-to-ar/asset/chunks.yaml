- raw: "Try opening your *training* version of the Scratch project and add more training\
    \ examples by playing the game for a little longer. Then, go back to the Learn\
    \ & Test phase and train a new ML model using your extra training examples. Finally,\
    \ open your *testing* version of the Scratch project and watch the new ML model\
    \ play the game.\n\nDid the extra training help?\n\nTry doing this a few times\
    \ to see how the amount of training affects how well your ML model plays.\n\n\
    The type of ML model you’ve trained in this project is called a *decision tree\
    \ classifier*, because the way the model makes decisions about its next moves\
    \ can be drawn as a sort of tree, as shown in [Figure 12-25](#c12.xhtml#figure12-25).\
    \ To see a diagram of your ML model, in the Learn & Test phase, click **Describe\
    \ your model!** next to the Test button.\n\n![Figure 12-25: A decision tree](image_fi/500563c12/f12025.png)\n\
    \n[Figure 12-25:](#c12.xhtml#figureanchor12-25) A decision tree\n\nThe decision\
    \ tree diagram can help you understand how your ML model is making *predictions*\
    \ about the outcome of each move.\n\nEach box on the tree describes a test; for\
    \ example, monster x < 3 means “is the x-coordinate of the monster less than 3?”\
    \ If the test is true, the tree follows the left-hand arrow. If the test is not\
    \ true, the tree follows the right-hand arrow.\n\nThe ML model starts at the top\
    \ of the tree and follows the arrows identified by the tests until it reaches\
    \ the bottom of the tree.\n\nTo see an example of the decision process, enter\
    \ some coordinates for nano and the monster into the boxes to the right of your\
    \ decision tree, and click **Test**. The diagram will highlight the way your ML\
    \ model made a prediction for those coordinates. When there are no more arrows\
    \ to follow and it reaches the bottom of the tree, you’ll find the final prediction,\
    \ as shown in [Figure 12-26](#c12.xhtml#figure12-26).\n\n ![Figure 12-26: Highlighting\
    \ the coordinates used to make a prediction about the outcome of a move](image_fi/500563c12/f12026.png)\n\
    \n[Figure 12-26:](#c12.xhtml#figureanchor12-26) Highlighting the coordinates used\
    \ to make a prediction about the outcome of a move\n\nTest your model with a few\
    \ different sets of coordinates to understand how it has learned to make predictions.\n\
    \n## What You Learned\n\nIn this chapter, you learned that ML models can be trained\
    \ to recognize patterns in sets of numbers. You used a decision tree classifier\
    \ to train a model to play a simplified version of the game *Pac-Man*, using sets\
    \ of x- and y-coordinates to make decisions about its next moves based on their\
    \ predicted outcome.\n\nA decision tree is not the only way to train an ML model\
    \ to make predictions based on numbers, but it’s a popular choice because it’s\
    \ very quick to train and one of the easiest techniques to understand. In previous\
    \ chapters, you’ve been using neural networks, which can be more powerful but\
    \ are more complicated and harder to understand.\n\nYou’ve seen that, as with\
    \ other ML models you’ve trained before, the model’s performance improves as you\
    \ collect more training examples. In the next chapter, you’ll learn more about\
    \ the difference the amount of training data makes on ML projects.\n\n![](image_fi/book_art/chapterart.png)\n\
    \n# 13  \n\nTic Tac Toe\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)n the\
