  trans: "\n\n如果你能弄清楚你的机器学习（ML）模型何时会出错，你就可以收集更多示例并将其添加到你的训练桶中。例如，如果 ML 模型的置信度非常低怎么办？或者，如果有人不断以略微不同的方式给出类似的命令呢？这可能意味着\
    \ ML 模型没有正确识别命令或没有按照人的意图操作，而这对你的训练是非常有用的反馈。如果用户点击了“我不满意”的拇指差按钮呢？如果他们最终按了按钮来执行某项操作呢？如果他们听起来变得越来越烦躁呢？\n\
    \n有很多方法可以推断某些事情运行不佳。每当这种情况发生时，你都可以收集一个示例并将其添加到其中一个训练桶中，这样更新的 ML 模型下次就能运行得好一点。\n\
    \n我们使用所有这些技术（从大量人员中收集训练示例、获取用户反馈等）来帮助我们构建能够理解你意图的计算机和设备。\n\n## 你学到的知识\n\n在这一章中，我们查看了机器学习如何用于识别文本含义，以及它如何被用于构建能够理解我们意图并执行我们指令的计算机系统。\n\
    \n在你的项目中，你使用了与 Amazon 的 Alexa、Google Home、Microsoft 的 Cortana 和 Apple 的 Siri 等`智能助手`\
    \ 相同的 ML 技术。`自然语言接口`让我们能够使用英语等语言告诉设备我们想让它们做什么，而不仅仅是通过点击屏幕或按钮。\n\n当你询问智能手机现在几点，或者设置闹钟或计时器，或者播放你喜欢的歌曲时，计算机需要对该命令进行分类。它需要获取你选择的那系列单词并识别它们的意图。\n\
    \n智能手机和智能助手的制造者通过列出一个类别列表（他们认为用户可能给出的所有命令）来训练 ML 模型以识别用户命令的含义。然后对于每个命令，他们收集了大量某人如何给出该命令的示例。\n\
    \n在这个项目和现实世界中，该过程如下：\n\n1. 预测你可能会给出的命令。\n2. 收集这些命令的示例。\n3. 使用这些示例训练 ML 模型。\n4.\
    \ 编写脚本或代码，规定计算机在识别每个命令时应执行的操作。\n\n要创建一个真正的智能助手，你需要对数千个命令重复这些步骤，而不仅仅是四个。而且你每个命令都需要数千甚至上万个示例。\n\
    \n在下一章中，你将利用这种能力构建可以回答问题的程序。\n\n![](img/chapterart.png)\n\n# 11 聊天机器人\n\n![Alphabet-I](img/Alphabet-I.png)\
    \ 在上一章中，我们讨论了`意图分类`：构建能够识别文本含义（意图）的 ML 系统。我们讨论了意图分类的一种常见用途，即构建能够理解我们告诉它们的内容并执行我们命令的智能助手。\n\
    \n在这一这一章中，我们将查看理解文本含义的 ML 模型如何用于构建`问答（QA）系统`。问答系统识别并回答我们的问题，从一组文档中自动发现答案。\n\n\
    与返回网页列表的搜索引擎不同，问答系统为特定问题返回特定的答案。这更具挑战性，因为它需要对问题以及可能包含答案的网页或文档的含义有深入理解。例如，对于像“克利夫兰总统的妻子是谁？”这样的问题，正确答案是“弗朗西斯·福尔瑟（Frances\
    \ Folsom）”，而不是包含美国总统传记的文档列表。\n\n多年来，QA 一直是人工智能研究的一个目标和活跃领域。例如，美国国家标准与技术研究院（NIST）自\
    \ 1999 年以来每年举办 QA 竞赛，大学和公司在此竞争，看谁的计算机系统可以正确回答最多的问题。\n\n也许广为人的是 IBM 的问答计算机系统 Watson，正如第\
    \ 1 章提到的，它参加了美国电视问答节目《危险竞答》（Jeopardy!）的比赛，并击败了两位冠军。《危险竞答》以对广泛的话题提出复杂且有时棘手的问题而闻名，因此对计算机来说是一个特别挑战性的测试。\n\
    \n由于许多原因，模仿人类对话的程序`聊天机器人`对计算机来说比问答系统的任务简单。首先，聊天机器人通常是为了回答关于单个较小且特定主题的问题，而问答系统试图回答关于任何主题的问题。\n\
    \n此外，聊天机器人的回答通常是预先准备好的。简单的聊天机器人通常不需要自己找到答案。复杂的聊天机器人可能有更详细的脚本，允许后续或澄清问题，但通用原理是相同的。\n\
    \n聊天机器人变得越来越常见。它们通常被用于客户服务，公司需要回答公众对其产品和服务的问题。常见问题可以得到快速高效的回答，而更复杂的问题会快速重定向到人工客服代表。\n\
    \n你可以在许多网站和手机应用程序上找到聊天机器人和虚拟助手——订购披萨、推荐服装和时尚配件、回答天气问题、管理你的银行账户、安排会议和预约、寻找餐厅并预订位置、提供帮助你管理健康状况的建议等等。\n\
    \n在这个项目中，你将创建自己的聊天机器人，并训练它回答关于你选择的主题的问题（如图 11-1 所示）。我们将遵循这一过程：\n\n1. 预测用户可能会问的问题。\n\
    2. 收集提问每个问题的示例。\n3. 使用这些示例训练 ML 模型。\n4. 准备计算机在识别每个问题时应给出的答案。\n\n![图 11-1：聊天机器人使用\
    \ ML 回答我们的问题。](img/f11001.png)\n\n图 11-1： 聊天机器人使用 ML 回答我们的问题。\n\n让我们开始吧！\n\n 构建你的项目\n\
    \n决定你想让聊天机器人回答关于什么主题的问题。可以是你喜欢的任何主题，但如果你想不出，这里有一些建议可以帮助：\n\n* 你喜欢的书\n* 你最喜欢的电视节目\n\
    * 你喜欢的运动队\n* 你最喜欢的演员、作者或音乐人\n* 宇宙、行星和太阳系\n* 恐龙\n* 一段历史时期，例如古罗马或维京时代\n\n对于本章中的截图，我制作了一个回答关于月的问题的机器人。\n\
    \n### 准备你的角色\n\n访问 `https://machinelearningforkids.co.uk/scratch3/` 进入 Scratch，为你的问答聊天机器人添加背景和角色。\n\
    \n确保你创建的场景与你的主题匹配。例如，如果你正在制作一个回答罗马帝国问题的聊天机器人，你可以画一个在战场上的罗马军团。\n\n对于我关于月的聊天机器人，我画了一个太空主题的背景，如图\
    \ 11-2 所示。\n\n![图 11-2：为你的角色自定义背景。](img/f11002.png)\n\n图 11-2： 为你的角色自定义背景。\n\n\
    对于我的聊天机器人角色，我制作了一个月亮精灵，并添加了卡通眼睛和嘴巴，如图 11-3 所示。\n\n![图 11-3：为你的角色自定义角色。](img/f11003.png)\n\
    \n图 11-3： 为你的角色自定义角色。\n\n"
