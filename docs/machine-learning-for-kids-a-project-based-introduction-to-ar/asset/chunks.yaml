    ## Chapter 2, Introducing Machine Learning for Kids


    Here you’ll learn all about the tool you’ll be using in the rest of the book to
    build your own ML projects.


    The rest of the book covers different things that ML systems can be trained to
    recognize.


    ## Chapter 3, Sorting Animal Pictures


    In this chapter, you’ll learn about image recognition. You’ll train the computer
    to recognize objects in a photo and then have it automatically sort pictures of
    animals.


    ## Chapter 4, Playing Rock, Paper, Scissors Against Your Computer


    In this project, you’ll use a webcam to train an ML system to recognize different
    hand shapes so you can play Rock, Paper, Scissors against your computer!


    ## Chapter 5, Recognizing Movie Posters


    You’ll learn how computers can be trained to recognize artistic styles, not just
    objects, in pictures. After training a computer to judge a book by its cover,
    you’ll find out whether computers can learn to be creative.


    ## Chapter 6, Mail Sorting


    This chapter explains how computers can learn to recognize writing. Then you’ll
    build a simple system that uses handwriting recognition to sort envelopes.


    ## Chapter 7, Insulting a Computer


    In this chapter, you’ll learn how computers can be trained to recognize tone in
    writing. You’ll train a computer game character to recognize and react to your
    compliments and insults.


    ## Chapter 8, Recognizing Language in Newspapers


    Here you’ll train a computer to recognize different styles of writing to predict
    which newspaper an article probably came from. We’ll also discuss ways of measuring
    how good an ML system is.


    ## Chapter 9, Finding an Object in a Picture


    This chapter builds on earlier projects and covers how to train a computer to
    find a smaller object in a picture. We’ll talk about some of the ways that this
    technique is used in real-world applications like processing satellite images
    and training self-driving cars.


    ## Chapter 10, Smart Assistants


    In this chapter, you’ll see how computers can be trained to recognize the meaning
    of text, and how this technology is used to program smart assistants. You’ll make
    a simple assistant that can understand your commands to turn different things
    on and off.


    ## Chapter 11, Chatbots


    Here you’ll learn about chatbots, and how computers that are able to recognize
    the meaning of text can be used to build question answering systems.


    ## Chapter 12, Avoiding the Monster


    This chapter explains how computer games have been used to develop AI technologies.
    You’ll train an ML system to play a simplified version of `Pac-Man`.


    ## Chapter 13, Tic Tac Toe


    Here you’ll see another example of computer games and AI, by re-creating a version
    of a famous AI research project to train a computer to play Tic Tac Toe.


    ## Chapter 14, Confusing the Computer


    You’ll see firsthand how ML projects most commonly go wrong, by creating your
    own confused AI system that makes mistakes. You’ll learn about the problems this
    causes, and steps we can take to avoid it.


    ## Chapter 15, Biasing the Computer


    In this chapter, you’ll learn about how some people intentionally influence the
    answers that their ML projects give and some of the AI ethics issues this raises.


    ## Afterword


    The book ends with a look ahead to what the future of AI might hold.


    ![](image_fi/book_art/chapterart.png)


    # 1 What Is Artificial Intelligence?


    ![Alphabet-I](image_fi/book_art/Alphabet-I.png)


    In this book, we’ll be exploring different aspects of AI by building projects
    based on real-world uses of ML. Before we get started, though, it will be useful
    to go over some background information on the tools and technologies we’ll be
    working with.


    In the introduction, you met the Scratch programming language and learned what
    each section of the Scratch interface does. This chapter will explain a few basic
    programming terms and concepts that we’ll use in the rest of the book.


    ## Coding


    Coding is how we tell machines what we want them to do. We often use code to control
    computers, but we also use it to control small devices like mobile phones, household
    appliances like washing machines, and huge machines like cars and airplanes.


    To write code, we first have to understand the task that we want the machine to
    do, and then we break that task down into a series of steps. The steps need to
    be specific and detailed enough for the machine to follow.


    Some programming languages, like Scratch, try to explain coding with colored blocks
    that represent those steps. You snap blocks together to describe the sequence
    of steps the machine should take, as shown in [Figure 1-1](#c01.xhtml#figure1-1).


    ![Figure 1-1: Scratch explains coding using colored blocks that snap together.](image_fi/500563c01/f01001.png)


    [Figure 1-1:](#c01.xhtml#figureanchor1-1) Scratch explains coding using colored
    blocks that snap together.


    Describing tasks as a series of steps for a machine to follow has been the job
    of `software developers` for decades. We have more expressive programming languages
    now that make it easier to describe steps than it was in the past, but the basic
    idea is still the same.


    However, while coding is useful, these days our machines are so complicated that
    it’s no longer enough. For example, a new car has over 100 million lines of code
    to accomplish all of its different tasks. That’s like having to write 100 million
    steps!


    Some tasks that we want machines to do are so complicated that it would take way
    too long to write step-by-step instructions for them—and sometimes we don''t even
    know how to describe.


    For these sorts of tasks, we use ML.


    ## Machine Learning


    ML is useful for tasks with steps that would take too long to write or are too
    complex to describe. Instead of describing a task’s exact steps to a machine,
    we can use ML to show the machine examples of the task over and again until it
    learns how to perform.


    Imagine getting someone to kick a ball. You could give them exact step-by-step
    instructions: how high to lift their leg, how fast to move their leg, what to
    do with their arms, and so on. Giving them step-by-step instructions is the coding
    approach.


    Instead, you could show the person lots of examples of people kicking different
    kinds of balls and let them learn that way. Collecting and showing examples of
    the task—known as `training`—is the ML approach.


    Throughout this book, you’ll see lots of examples of how ML systems are trained,
    how they behave, and how they are used.


    ## Artificial Intelligence


    People sometimes confuse ML with AI. Some of the most interesting AI systems have
    been built using ML, but it isn’t the only way to build an AI system. The relationship
    between the two is illustrated in [Figure 1-2](#c01.xhtml#figure1-2).


    ![Figure 1-2: The relationship between ML and AI](image_fi/500563c01/f01002.png)


    `Artificial intelligence` is a general term used to describe projects where a
    machine is doing something that would normally require human intelligence. It
    doesn’t say anything about *how* you get the machine to do that thing, and there
    are lots of different techniques you can use. ML is just one way to make an AI
    project (just like neural networks, which we’ll discuss shortly, are just one
    kind of ML). Let’s look at an example to better understand the difference.


    In 1997, a computer called Deep Blue beat the world champion Garry Kasparov at
    a game of chess. Deep Blue was an AI project, and many described it as a landmark
    in AI development.


    But it wasn’t an ML system. Deep Blue didn’t learn how to play chess or how to
    win; it was programmed. People coded the system with the rules of the game, and
    more importantly, the strategies for winning. The computer just followed the instructions
    that it was given, step by step.

