- raw: "[Figure 13-5:](#c13.xhtml#figureanchor13-5) Game board representation defined\
    \ in the Scratch project template\n\nWe also need to describe the positions of\
    \ the noughts and crosses on the board. We’ll want to be able to learn from whoever\
    \ wins (whether it’s noughts or crosses who wins a game), so to keep things clear,\
    \ we’ll use *player* to describe the winning moves and *opponent* to describe\
    \ the losing moves.\n\nFor example, imagine that the board looked like [Figure\
    \ 13-6](#c13.xhtml#figure13-6) early in a game that cross (X) ended up winning.\n\
    \n![Figure 13-6: An example game board state](image_fi/500563c13/f13006.png)\n\
    \n[Figure 13-6:](#c13.xhtml#figureanchor13-6) An example game board state\n\n\
    We can describe this board as follows:\n\n| Top left || Opponent |\n\n| --- |\
    \ --- |\n\n| Top middle || Player |\n\n| Top right || Opponent |\n\n| Middle left\
    \ || Empty |\n\n| Middle middle || Empty |\n\n| Middle right || Empty |\n\n| Bottom\
    \ left || Empty |\n\n| Bottom middle || Empty |\n\n| Bottom right || Empty |\n\
    \nWe want to train an ML model so that, given the state of a board like this,\
    \ it can choose where to make the next move. To be able to do that, we’ll need\
    \ training examples of decisions that led to a win. Each example will need to\
    \ include:\n\n*   What the board looked like before a move\n\n*   What move was\
    \ made\n\nTraining examples will be recorded only for moves made by the player\
    \ that won that game. If you (cross) win the game, you want to train the model\
    \ with the cross (X) moves. If the computer (nought) wins the game, you want to\
    \ train it with the nought (O) moves.\n\n### Prepare Your Game\n\nAs with the\
    \ *Pac-Man*–style game in the last chapter, the best way to collect training examples\
    \ isn’t by typing them, but by playing the game yourself.\n\nThe first step is\
    \ to prepare the training buckets where you’ll store examples of the moves you\
    \ make. You will need nine training buckets: one for each possible choice available\
    \ at any point in the game.\n\n1.  Go to *https://machinelearningforkids.co.uk/*.\
    \ Create a new ML project, name it `Tic Tac Toe`, and set it to learn to recognize\
    \ numbers. \n\n2.  Click **Add a value**, type `TopLeft` for the value name, and\
    \ set **Type of value** to **multiple-choice**. Under **Choices**, add three choices:\
    \ `EMPTY`, `PLAYER`, and `OPPONENT`. Then click **Add another value** and add\
    \ eight more multiple-choice values with the same three choices:\n\n    1.  `TopMiddle`\n\
    \n    2.  `TopRight`\n\n    3.  `MiddleLeft`\n\n    4.  `MiddleMiddle`\n\n   \
    \ 5.  `MiddleRight`\n\n    6.  `BottomLeft`\n\n    7.  `BottomMiddle`\n\n    8.\
    \  `BottomRight`\n\n    Make sure that you spell the choices *exactly* the same\
    \ for all nine values so that the computer will know that the choices available\
    \ are the same for every space on the game board. If you make a typing mistake,\
    \ click the red X beside the choice to delete it, and then add it again.\n\n \
    \   When you’ve finished, your screen should look like [Figure 13-7](#c13.xhtml#figure13-7).\n\
    \n    ![Figure 13-7: Preparing the project](image_fi/500563c13/f13007.png)\n\n\
    \    [Figure 13-7:](#c13.xhtml#figureanchor13-7) Preparing the project\n\n3. \
    \ Click **Create**.\n\n4.  Click **Train**, as shown in [Figure 13-8](#c13.xhtml#figure13-8).\n\
    \n    ![Figure 13-8: Click Train to prepare the training buckets.](image_fi/500563c13/f13008.png)\n\
    \n    [Figure 13-8:](#c13.xhtml#figureanchor13-8) Click **Train** to prepare the\
    \ training buckets.\n\n5.  Click **Add new label**, as shown in [Figure 13-9](#c13.xhtml#figure13-9),\
    \ and create nine training buckets to represent the nine cells on the game board.\
    \ Call them `top left`, `top middle`, `top right`, `middle left`, `middle middle`,\
    \ `middle right`, `bottom left`, `bottom middle`, and `bottom right`. (The underscores\
    \ will be added automatically.)\n\n    ![Figure 13-9: Training buckets for Tic\
    \ Tac Toe](image_fi/500563c13/f13009.png)\n\n    [Figure 13-9:](#c13.xhtml#figureanchor13-9)\
    \ Training buckets for Tic Tac Toe\n\n    These buckets are where your training\
    \ examples will be stored. For example, look back at the state of the game board\
    \ shown in [Figure 13-6](#c13.xhtml#figure13-6). If the player’s next move (X)\
    \ went in the middle\\_middle cell, the board’s state would be recorded in the\
    \ training data as shown in [Figure 13-10](#c13.xhtml#figure13-10).\n\n    ![Figure\
    \ 13-10: A training example for Tic Tac Toe](image_fi/500563c13/f13010.png)\n\n\
    \    [Figure 13-10:](#c13.xhtml#figureanchor13-10) A training example for Tic\
    \ Tac Toe\n\n    The next step is to collect lots and lots of examples to train\
    \ an ML model.\n\n6.  Click **Back to project** in the top-left corner of the\
    \ screen.\n\n7.  Click **Make**.\n\n8.  Click **Scratch 3** and then click **straight\
    \ into Scratch**, as shown in [Figure 13-11](#c13.xhtml#figure13-11).\n\n    ![Figure\
    \ 13-11: Click straight into Scratch, even though we don’t have an ML model yet.](image_fi/500563c13/f13011.png)\n\
    \n    [Figure 13-11:](#c13.xhtml#figureanchor13-11) Click **straight into Scratch**,\
    \ even though we don’t have an ML model yet.\n\n9.  Open the **Noughts and Crosses**\
    \ project template again.\n\n    The code is the same as when you opened this\
    \ template before, but now you have extra blocks for your project in the Toolbox.\n\
    \n10.  Click the **Stage** backdrop at the bottom right of the screen. In the\
    \ Code Area, find the `setup model labels` script shown in [Figure 13-12](#c13.xhtml#figure13-12).\
    \ This script sets up constants that are used throughout the project.\n\n    \
    \ ![Figure 13-12: Find the setup model labels script.](image_fi/500563c13/f13012.png)\n\
    \n     [Figure 13-12:](#c13.xhtml#figureanchor13-12) Find the `setup model labels`\
    \ script.\n\n11.  In the Toolbox, click **Tic Tac Toe** and drag the blocks with\
    \ the names of your training buckets into the `setup model labels` script as shown\
    \ in [Figure 13-13](#c13.xhtml#figure13-13). Make sure the positions match; for\
    \ example, drag `top_left` into the `set top_left to` block.\n\n     ![Figure\
    \ 13-13: Populate the script with the training bucket names from your project.](image_fi/500563c13/f13013.png)\n\
    \n     [Figure 13-13:](#c13.xhtml#figureanchor13-13) Populate the script with\
    \ the training bucket names from your project.\n\n12.  Scroll in the Code Area\
    \ to find the `define``add cross moves to training data` and `define``add nought\
    \ moves to training data` script blocks, as shown in [Figure 13-14](#c13.xhtml#figure13-14).\
    \ \n\n     ![Figure 13-14: Find the custom define blocks.](image_fi/500563c13/f13014.png)\n\
    \n     [Figure 13-14:](#c13.xhtml#figureanchor13-14) Find the custom `define`\
    \ blocks.\n\n13.  From the **Tic Tac Toe** group in the Toolbox, drag an `add\
    \ training data` block into both of the `define` scripts, as shown in [Figure\
    \ 13-15](#c13.xhtml#figure13-15).\n\n     ![Figure 13-15: Add training data to\
    \ both of the define scripts.](image_fi/500563c13/f13015.png)\n\n     [Figure\
    \ 13-15:](#c13.xhtml#figureanchor13-15) Add training data to both of the `define`\
    \ scripts.\n\n14.  Update the `add training data` blocks as shown in [Figure 13-16](#c13.xhtml#figure13-16).\
    \ The orange blocks you need are ready for you in the project template, immediately\
    \ below where they need to go. *Starting from the left*,  drag each block into\
    \ the space above it*.*\n\n     ![Figure 13-16: Populate the training data blocks.](image_fi/500563c13/f13016.png)\n\
    \n     [Figure 13-16:](#c13.xhtml#figureanchor13-16) Populate the training data\
    \ blocks.\n\n     Double-check the scripts. The moves from the history cross lists\
    \ should appear in the `add cross moves to training data` script, as shown in\
    \ [Figure 13-17](#c13.xhtml#figure13-17).\n\n     ![Figure 13-17: Check that you’ve\
    \ matched the cross blocks with the cross script.](image_fi/500563c13/f13017.png)\n\
    \n     [Figure 13-17:](#c13.xhtml#figureanchor13-17) Check that you’ve matched\
    \ the cross blocks with the cross script.\n\n     Likewise, the moves from the\
    \ history nought lists should be used in the `add nought moves to training data`\
    \ script."
  fmt: "\n[Figure 13-5:](#c13.xhtml#figureanchor13-5) Game board representation defined\
    \ in the Scratch project template\n\nWe also need to describe the positions of\
    \ the noughts and crosses on the board. We’ll want to be able to learn from whoever\
    \ wins (whether it’s noughts or crosses who wins a game), so to keep things clear,\
    \ we’ll use `player` to describe the winning moves and `opponent` to describe\
    \ the losing moves.\n\nFor example, imagine that the board looked like [Figure\
    \ 13-6](#c13.xhtml#figure13-6) early in a game that cross (X) ended up winning.\n\
    \n![Figure 13-6: An example game board state](image_fi/500563c13/f13006.png)\n\
    \n[Figure 13-6:](#c13.xhtml#figureanchor13-6) An example game board state\n\n\
    We can describe this board as follows:\n\n| Top left || Opponent |\n| --- | ---\
    \ |\n| Top middle || Player |\n| Top right || Opponent |\n| Middle left || Empty\
    \ |\n| Middle middle || Empty |\n| Middle right || Empty |\n| Bottom left || Empty\
    \ |\n| Bottom middle || Empty |\n| Bottom right || Empty |\n\nWe want to train\
    \ an ML model so that, given the state of a board like this, it can choose where\
    \ to make the next move. To be able to do that, we’ll need training examples of\
    \ decisions that led to a win. Each example will need to include:\n\n* What the\
    \ board looked like before a move\n* What move was made\n\nTraining examples will\
    \ be recorded only for moves made by the player that won that game. If you (cross)\
    \ win the game, you want to train the model with the cross (X) moves. If the computer\
    \ (nought) wins the game, you want to train it with the nought (O) moves.\n\n\
    ### Prepare Your Game\n\nAs with the `Pac-Man`-style game in the last chapter,\
    \ the best way to collect training examples isn’t by typing them, but by playing\
    \ the game yourself.\n\nThe first step is to prepare the training buckets where\
    \ you’ll store examples of the moves you make. You will need nine training buckets:\
    \ one for each possible choice available at any point in the game.\n\n1. Go to\
    \ `https://machinelearningforkids.co.uk/`. Create a new ML project, name it `Tic\
    \ Tac Toe`, and set it to learn to recognize numbers.\n\n2. Click **Add a value**,\
    \ type `TopLeft` for the value name, and set **Type of value** to **multiple-choice**.\
    \ Under **Choices**, add three choices: `EMPTY`, `PLAYER`, and `OPPONENT`. Then\
    \ click **Add another value** and add eight more multiple-choice values with the\
    \ same three choices:\n    * `TopMiddle`\n    * `TopRight`\n    * `MiddleLeft`\n\
    \    * `MiddleMiddle`\n    * `MiddleRight`\n    * `BottomLeft`\n    * `BottomMiddle`\n\
    \    * `BottomRight`\n\n   Make sure that you spell the choices exactly the same\
    \ for all nine values so that the computer will know that the choices available\
    \ are the same for every space on the game board. If you make a typing mistake,\
    \ click the red X beside the choice to delete it, and then add it again.\n\n \
    \  When you’ve finished, your screen should look like [Figure 13-7](#c13.xhtml#figure13-7).\n\
    \n   ![Figure 13-7: Preparing the project](image_fi/500563c13/f13007.png)\n\n\
    \   [Figure 13-7:](#c13.xhtml#figureanchor13-7) Preparing the project\n\n3. Click\
    \ **Create**.\n\n4. Click **Train**, as shown in [Figure 13-8](#c13.xhtml#figure13-8).\n\
    \n   ![Figure 13-8: Click Train to prepare the training buckets.](image_fi/500563c13/f13008.png)\n\
    \n   [Figure 13-8:](#c13.xhtml#figureanchor13-8) Click **Train** to prepare the\
    \ training buckets.\n\n5. Click **Add new label**, as shown in [Figure 13-9](#c13.xhtml#figure13-9),\
    \ and create nine training buckets to represent the nine cells on the game board.\
    \ Call them `top left`, `top middle`, `top right`, `middle left`, `middle middle`,\
    \ `middle right`, `bottom left`, `bottom middle`, and `bottom right`. (The underscores\
    \ will be added automatically.)\n\n   ![Figure 13-9: Training buckets for Tic\
    \ Tac Toe](image_fi/500563c13/f13009.png)\n\n   [Figure 13-9:](#c13.xhtml#figureanchor13-9)\
    \ Training buckets for Tic Tac Toe\n\n   These buckets are where your training\
    \ examples will be stored. For example, look back at the state of the game board\
    \ shown in [Figure 13-6](#c13.xhtml#figure13-6). If the player’s next move (X)\
    \ went in the `middle_middle` cell, the board’s state would be recorded in the\
    \ training data as shown in [Figure 13-10](#c13.xhtml#figure13-10).\n\n   ![Figure\
    \ 13-10: A training example for Tic Tac Toe](image_fi/500563c13/f13010.png)\n\n\
    \   [Figure 13-10:](#c13.xhtml#figureanchor13-10) A training example for Tic Tac\
    \ Toe\n\n   The next step is to collect lots and lots of examples to train an\
    \ ML model.\n\n6. Click **Back to project** in the top-left corner of the screen.\n\
    \n7. Click **Make**.\n\n8. Click **Scratch 3** and then click **straight into\
    \ Scratch**, as shown in [Figure 13-11](#c13.xhtml#figure13-11).\n\n   ![Figure\
    \ 13-11: Click straight into Scratch, even though we don’t have an ML model yet.](image_fi/500563c13/f13011.png)\n\
    \n   [Figure 13-11:](#c13.xhtml#figureanchor13-11) Click **straight into Scratch**,\
    \ even though we don’t have an ML model yet.\n\n9. Click **Noughts and Crosses**.\n\
    \n10. Click the **Stage**. In the Code Area, find the `setup` script shown in\
    \ [Figure 13-12](#c13.xhtml#figure13-12). This script is used throughout the project.\n\
    \n    ![Figure 13-12: The setup script](image_fi/500563c13/f13012.png)\n\n   \
    \ [Figure 13-12:](#c13.xhtml#figureanchor13-12) Find the `setup` script.\n\n11.\
    \ In the Toolbox, click **Tic Tac Toe** and drag the names of your buckets into\
    \ the `setup` script shown in [Figure 13-13](#c13.xhtml#figure13-13). Make sure\
    \ the positions match; for example, drag `top_left` into the `set top_left to`\
    \ block.\n\n    ![Figure 13-13: Filling the setup script](image_fi/500563c13/f13013.png)\n\
    \n    [Figure 13-13:](#c13.xhtml#figureanchor13-13) Filling the `setup` script.\n\
    \n12. Scroll in the Code Area to find `add cross moves to training data` and `add\
    \ nought moves to training data` blocks, as shown in [Figure 13-14](#c13.xhtml#figure13-14).\n\
    \n    ![Figure 13-14: The define blocks](image_fi/500563c13/f13014.png)\n\n  \
    \  [Figure 13-14:](#c13.xhtml#figureanchor13-14) Find the `define` blocks.\n\n\
    13. From the **Tic Tac Toe** group, drag an `add training data` block into both\
    \ of the `define` scripts, as shown in [Figure 13-15](#c13.xhtml#figure13-15).\n\
    \n    ![Figure 13-15: Adding data blocks](image_fi/500563c13/f13015.png)\n\n \
    \   [Figure 13-15:](#c13.xhtml#figureanchor13-15) Adding `training data` blocks.\n\
    \n14. Update the `add training data` blocks as shown in [Figure 13-16](#c13.xhtml#figure13-16).\
    \ The orange blocks you need are ready for you in the project template, immediately\
    \ below where they need to go. *Starting from the left, drag each block into the\
    \ space above it.*\n\n    ![Figure 13-16: Updating the blocks](image_fi/500563c13/f13016.png)\n\
    \n    [Figure 13-16:](#c13.xhtml#figureanchor13-16) Updating the `add training\
    \ data` blocks.\n\n15. Double-check the scripts. The moves from the history cross\
    \ lists should appear in the `add cross moves to training data` script, as shown\
    \ in [Figure 13-17](#c13.xhtml#figure13-17).\n\n    ![Figure 13-17: Final check\
    \ of scripts](image_fi/500563c13/f13017.png)\n\n    [Figure 13-17:](#c13.xhtml#figureanchor13-17)\
    \ Final check of scripts.\n\n    Likewise, the moves from the history nought lists\
    \ should be used in the `add nought moves to training data` script.\n"
  trans: "\n\n图 13-5: 在 Scratch 项目模板中定义的游戏盘表示\n\n我们还需要描述棋盘上“圈”（O）和“叉”（X）的位置。我们希望从获胜者那里学习（无论\
    \ O 还是 X 赢了比赛），为了保持清晰，我们将使用 `player` 来描述获胜移动，使用 `opponent` 来描述失败移动。\n\n例如，想象一下游戏早期棋盘状态如\
    \ 图 13-6 所示，交叉 (X) 最终赢了比赛。\n\n![图 13-6: 示例游戏盘状态](img/f13006.png)\n\n图 13-6: 示例游戏盘状态\n\
    \n我们可以这样描述这个棋盘：\n\n| 左上角 || 对手 |\n| --- | --- |\n| 中上 || 玩家 |\n| 右上 || 对手 |\n\
    | 左左 || 空 |\n| 正中 || 空 |\n| 右右 || 空 |\n| 左下 || 空 |\n| 中下 || 空 |\n| 右下 || 空 |\n\
    \n我们想训练一个机器学习模型，以便在给定这样的棋盘状态时，它能选择下一步下棋的位置。为了做到这一点，我们需要通往胜利的决策训练示例。每个示例都将包含：\n\
    \n* 移动之前的棋盘样子\n* 做了什么移动\n\n训练示例将仅记录获胜比赛的玩家所做的移动。如果你（交叉 X）赢了比赛，你就用交叉 (X) 的移动来训练模型。如果电脑（圈\
    \ O）赢了比赛，你就用圈 (O) 的移动来训练它。\n\n### 准备你的游戏\n\n与上一章的 `Pac-Man`风格游戏一样，收集训练示例的最佳方法不是手动输入，而是亲自玩游戏。\n\
    \n第一步是准备训练桶，用于存储你所做移动的示例。你需要九个训练桶：对应游戏中任何一点的可用选择中的每一个。\n\n1. 访问 `https://machinelearningforkids.co.uk/`。创建一个新的机器学习项目，命名为\
    \ `Tic Tac Toe`，并设置为学习识别数字。\n\n2. 点击 **Add a value**，为值名称输入 `TopLeft`，并将 **Type\
    \ of value** 设置为 **multiple-choice**。在 **Choices** 下，添加三个选项：`EMPTY`、`PLAYER` 和\
    \ `OPPONENT`。然后点击 **Add another value** 并添加另外八个多选题值，使用相同的三个选项：\n    * `TopMiddle`\n\
    \    * `TopRight`\n    * `MiddleLeft`\n    * `MiddleMiddle`\n    * `MiddleRight`\n\
    \    * `BottomLeft`\n    * `BottomMiddle`\n    * `BottomRight`\n\n   确保所有九个值的选项拼写完全一致，这样计算机就会知道游戏盘上每个格子的可用选择是相同的。如果你拼写错误，点击选项旁边的红色\
    \ X 删除它，然后重新添加。\n\n   完成后，你的屏幕应该看起来像 图 13-7 所示。\n\n   ![图 13-7: 准备项目](img/f13007.png)\n\
    \n   图 13-7: 准备项目\n\n3. 点击 **Create**。\n\n4. 点击 **Train**，如 图 13-8 所示。\n\n   ![图\
    \ 13-8: 点击 Train 准备训练桶。](img/f13008.png)\n\n   图 13-8: 点击 **Train** 准备训练桶。\n\n\
    5. 点击 **Add new label**，如 图 13-9 所示，并创建九个训练桶来代表游戏盘上的九个单元。将它们命名为 `top left`、`top\
    \ middle`、`top right`、`middle left`、`middle middle`、`middle right`、`bottom left`、`bottom\
    \ middle` 和 `bottom right`。（下划线会自动添加。）\n\n   ![图 13-9: 井棋的训练桶](img/f13009.png)\n\
    \n   图 13-9: 井棋的训练桶\n\n   这些桶是存储训练示例的地方。例如，回看 图 13-6 所示的棋盘状态。如果玩家的下一步 (X) 落在 `middle_middle`\
    \ 单元格，棋盘状态将记录在训练数据中，如 图 13-10 所示。\n\n   ![图 13-10: 井棋的训练示例](img/f13010.png)\n\n\
    \   图 13-10: 井棋的训练示例\n\n   下一步是收集大量示例来训练模型。\n\n6. 点击项目左角的 **Back**。\n\n7. 点击 **Noughts**。\n\
    \n8. 点击 **Scratch**，如 图 13-11 所示。\n\n   ![图 13-11: 点击 Scratch，尽管我们还没有模型。](img/f13011.png)\n\
    \n   图 13-11: 点击 **Scratch**，尽管我们还没有模型。\n\n9. 点击 **Stage**。\n\n10. 在代码区找到 `setup`\
    \ 脚本，如 图 13-12 所示。\n\n    ![图 13-12: setup 脚本](img/f13012.png)\n\n    图 13-12:\
    \ setup 脚本\n\n11. 在工具箱中点击 **Tic Tac Toe**，并将训练桶名称拖入 `setup` 脚本中，如 图 13-13 所示。\n\
    \n    ![图 13-13: setup 脚本](img/f13013.png)\n\n    图 13-13: setup 脚本\n\n12. 在代码区找到\
    \ `add cross moves to training data` 和 `add nought moves to training data` ，如\
    \ 图 13-14 所示。\n\n    ![图 13-14: define 块](img/f13014.png)\n\n    图 13-14: define\
    \ 块\n\n13. 从 **Tic Tac Toe** 分组将一个 `add training data` 块拖入两个 `define` 脚本中，如 图\
    \ 13-15 所示。\n\n    ![图 13-15: 添加数据块](img/f13015.png)\n\n    图 13-15: 添加数据块\n\n\
    14. 更新 `add training data` 块，如 图 13-16 所示。你需要的橙色块已经在项目模板中准备就绪，就位置在它们需要所在的位置正下方。*从左侧开始，将每个块拖到它上方的空间。*\n\
    \n    ![图 13-16: 更新 `add training data` 块](img/f13016.png)\n\n    图 13-16: 更新\
    \ `add training data` 块\n\n15. 双重检查脚本。历史交叉列表中的移动应该出现在 `add cross moves to training\
    \ data` 脚本中，如 图 13-17 所示。\n\n    ![图 13-17: 检查脚本](img/f13017.png)\n\n    图 13-17:\
    \ 检查脚本\n\n    同样，历史圈列表中的移动应该被用于 `add nought moves to training data` 脚本。\n\n"
