- raw: "Click the Green Flag icon to watch your ML model at work.\n\nThe conveyor\
    \ belt at the top of the screen will begin running, and the letters with the postcodes\
    \ you’ve written will start to scroll by, as shown in [Figure 6-23](#c06.xhtml#figure6-23).\n\
    \n![Figure 6-23: A test envelope on the conveyor belt](image_fi/500563c06/f06023.png)\n\
    \n[Figure 6-23:](#c06.xhtml#figureanchor6-23) A test envelope on the conveyor\
    \ belt\n\nThe envelope will zoom in while your ML model tries to recognize what\
    \ you’ve written.\n\nOnce it has classified your picture, the script will send\
    \ the envelope to the corresponding mail sack, as shown in [Figure 6-24](#c06.xhtml#figure6-24).\n\
    \n![Figure 6-24: Test results for recognizing a postcode](image_fi/500563c06/f06024.png)\n\
    \n[Figure 6-24:](#c06.xhtml#figureanchor6-24) Test results for recognizing a postcode\n\
    \n## Review and Improve Your Project\n\nYou’ve trained an ML model to recognize\
    \ handwriting on an envelope, and you’ve created a project in Scratch that uses\
    \ OCR to automatically sort letters!\n\nHow could you improve your project?\n\n\
    Try getting someone else to test your project. Can it recognize their handwriting?\
    \ If the model makes a lot of mistakes with their handwriting, ask them to add\
    \ some examples to your training buckets in the Train phase. (Make sure that you\
    \ train a new ML model in the Learn & Test phase so that the computer can learn\
    \ from both of your examples.)\n\nThe wider the variety of examples you use to\
    \ train the computer, the better the ML model should be at recognizing different\
    \ handwriting styles.\n\nWhat else could you do to improve your project?\n\n##\
    \ What You Learned\n\nSorting mail is a common use of *optical character recognition*.\
    \ Large sorting offices around the world use OCR systems to recognize and sort\
    \ letters in a fraction of a second. Your project just recognized a postcode,\
    \ but real-world multiline optical character readers can recognize several lines\
    \ of an address. The basic idea is very similar, and it helps make large-scale\
    \ mail sorting efficient and practical.\n\nAll of your projects so far have used\
    \ images, but computers can be trained to recognize many different types of data.\
    \ In the next chapter, you’ll train an ML model to recognize text!\n\n![](image_fi/book_art/chapterart.png)\n\
    \n# 7  \n\nInsulting a Computer\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)n\
    \ this chapter, we’ll look at how computers can be trained to recognize different\
    \ tones and emotion in written text, a technique known as *sentiment analysis*.\n\
    \nImagine you need to write a few sentences to say that you are going to the zoo\
    \ tomorrow.\n\nThink about what you might write if you’re super happy and excited\
    \ about going. You love the zoo, and you can’t wait to go. What sorts of words\
    \ would you use? Would your excitement affect the way you write the sentences?\n\
    \nNow think of what you might write if you’re angry about having to go. You hate\
    \ zoos, there are other things that you’d rather be doing tomorrow, and you’re\
    \ annoyed that someone is making you go. How might that show up in your writing?\
    \ Would your annoyance make you use different sorts of words than you would if\
    \ you were happy about going? Would you phrase your sentences differently?\n\n\
    Both of these paragraphs would have the same basic meaning (that you are going\
    \ to the zoo tomorrow), but their tone and sentiment would be different. Computers\
    \ can be trained to recognize the patterns in how we write when we’re annoyed\
    \ compared with how we write when we’re happy. With enough examples of text demonstrating\
    \ different emotions and sentiment, you can train an ML model to identify the\
    \ emotion or tone in a new piece of writing based on patterns in vocabulary and\
    \ grammar that the computer learns to recognize.\n\nML systems that are trained\
    \ to recognize sentiment and emotion in text can be used to understand how people\
    \ feel about things. For example, businesses use sentiment analysis to find out\
    \ what people think about their products or services by pointing their ML model\
    \ at millions of blogs, forums, newsgroups, and social media posts—far more than\
    \ they could ever read themselves. Sentiment analysis tells them how much of that\
    \ feedback seems positive and how much seems negative, and what the most common\
    \ complaints and criticisms are.\n\nSentiment analysis isn’t just applied to massive\
    \ amounts of text across the whole internet, though. Companies will often use\
    \ it to help sort and prioritize customer support letters and emails, replying\
    \ first to the letters and emails that sound the angriest or most annoyed.\n\n\
    Similarly, companies use sentiment analysis on their own internal discussions\
    \ as a way of estimating how happy their employees are and if there are any issues\
    \ or concerns that need attention.\n\nIn this chapter, you’ll train an ML model\
    \ to recognize the sentiment expressed by two different types of text: compliments\
    \ and insults.\n\n## Build Your Project\n\nIn this project, you’ll create a character\
    \ that reacts to a message you type (see [Figure 7-1](#c07.xhtml#figure7-1)).\
    \ If you give the character a compliment, it will look happy. If you insult it,\
    \ it will look sad.\n\n![Figure 7-1: Recognizing compliments and insults](image_fi/500563c07/f07001.png)\n\
    \n[Figure 7-1:](#c07.xhtml#figureanchor7-1) Recognizing compliments and insults\n\
    \n### Prepare Your Game\n\nFirst, start by designing your character. For my screenshots,\
    \ I drew a simple face. You can draw anything you like, as long as you can tell\
    \ if it is happy or sad. You could make an animal, a robot, an alien, or anything\
    \ else you can think of.\n\n1.  Go to [https://machinelearningforkids.co.uk/scratch3/](https://machinelearningforkids.co.uk/scratch3/)\
    \ to start a new Scratch project.\n\n2.  Click the **Costumes** tab, as shown\
    \ in [Figure 7-2](#c07.xhtml#figure7-2).\n\n    ![Figure 7-2: Designing a character\
    \ in the Costumes tab](image_fi/500563c07/f07002.png)\n\n    [Figure 7-2:](#c07.xhtml#figureanchor7-2)\
    \ Designing a character in the Costumes tab\n\n3.  Move your mouse pointer over\
    \ the cat face icon at the bottom left of the screen to see the choices for adding\
    \ a costume, as shown in [Figure 7-3](#c07.xhtml#figure7-3).\n\n    ![Figure 7-3:\
    \ Adding a new costume](image_fi/500563c07/f07003.png)\n\n    [Figure 7-3:](#c07.xhtml#figureanchor7-3)\
    \ Adding a new costume\n\n    If you’d like to draw your own character, click\
    \ **Paint**. For my screenshots, I drew a simple green alien character by drawing\
    \ a few colored circles and adding some hair (see [Figure 7-4](#c07.xhtml#figure7-4)).\n\
    \n    If you’d prefer not to draw the character yourself, you have a few other\
    \ options. If your computer has a webcam and you want to use a photo of your face,\
    \ click **Camera**. Or, to use a picture you’ve saved on the computer (such as\
    \ one you downloaded from the internet), click **Upload Costume**. To pick a costume\
    \ from the Scratch Costume Library instead, click **Choose a Costume**.\n\n  \
    \  No matter which choice you make, you should see the character on the canvas\
    \ after this step.\n\n    ![Figure 7-4: Drawing your character](image_fi/500563c07/f07004.png)\n\
    \n    [Figure 7-4:](#c07.xhtml#figureanchor7-4) Drawing your character\n\n4. \
    \ Right-click the character costume in the costume pane and click **duplicate**,\
    \ as shown in [Figure 7-5](#c07.xhtml#figure7-5). You’ll need three copies of\
    \ it.\n\n    ![Figure 7-5: Duplicating a costume](image_fi/500563c07/f07005.png)\n\
    \n    [Figure 7-5:](#c07.xhtml#figureanchor7-5) Duplicating a costume\n\n5.  Rename\
    \ each copy of the character by clicking it in the costume pane and then typing\
    \ the new name in the **Costume** text box above the canvas, as shown in [Figure\
    \ 7-6](#c07.xhtml#figure7-6). Name them `waiting`, `feeling happy`, and `feeling\
    \ sad`.\n\n    ![Figure 7-6: Renaming your character costumes](image_fi/500563c07/f07006.png)\n\
    \n    [Figure 7-6:](#c07.xhtml#figureanchor7-6) Renaming your character costumes\n\
    \n6.  Click each character costume in the costume pane and draw an expression\
    \ that matches its name, as shown in [Figure 7-7](#c07.xhtml#figure7-7)."
