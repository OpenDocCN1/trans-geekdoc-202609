- raw: "**Chapter 2, Introducing Machine Learning for Kids**\n\nHere you’ll learn\
    \ all about the tool you’ll be using in the rest of the book to build your own\
    \ ML projects.\n\nThe rest of the book covers different things that ML systems\
    \ can be trained to recognize.\n\n**Chapter 3, Sorting Animal Pictures**\n\nIn\
    \ this chapter, you’ll learn about image recognition. You’ll train the computer\
    \ to recognize objects in a photo and then have it automatically sort pictures\
    \ of animals.\n\n**Chapter 4, Playing Rock, Paper, Scissors Against Your Computer**\n\
    \nIn this project, you’ll use a webcam to train an ML system to recognize different\
    \ hand shapes so you can play Rock, Paper, Scissors against your computer!\n\n\
    **Chapter 5, Recognizing Movie Posters**\n\nYou’ll learn how computers can be\
    \ trained to recognize artistic styles, not just objects, in pictures. After training\
    \ a computer to judge a book by its cover, you’ll find out whether computers can\
    \ learn to be creative.\n\n**Chapter 6, Mail Sorting**\n\nThis chapter explains\
    \ how computers can learn to recognize writing. Then you’ll build a simple system\
    \ that uses handwriting recognition to sort envelopes.\n\n**Chapter 7, Insulting\
    \ a Computer**\n\nIn this chapter, you’ll learn how computers can be trained to\
    \ recognize tone in writing. You’ll train a computer game character to recognize\
    \ and react to your compliments and insults.\n\n**Chapter 8, Recognizing Language\
    \ in Newspapers**\n\nHere you’ll train a computer to recognize different styles\
    \ of writing to predict which newspaper an article probably came from. We’ll also\
    \ discuss ways of measuring how good an ML system is.\n\n**Chapter 9, Finding\
    \ an Object in a Picture**\n\nThis chapter builds on earlier projects and covers\
    \ how to train a computer to find a smaller object in a picture. We’ll talk about\
    \ some of the ways that this technique is used in real-world applications like\
    \ processing satellite images and training self-driving cars.\n\n**Chapter 10,\
    \ Smart Assistants**\n\nIn this chapter, you’ll see how computers can be trained\
    \ to recognize the meaning of text, and how this technology is used to program\
    \ smart assistants. You’ll make a simple assistant that can understand your commands\
    \ to turn different things on and off.\n\n**Chapter 11, Chatbots**\n\nHere you’ll\
    \ learn about chatbots, and how computers that are able to recognize the meaning\
    \ of text can be used to build question answering systems.\n\n**Chapter 12, Avoiding\
    \ the Monster**\n\nThis chapter explains how computer games have been used to\
    \ develop AI technologies. You’ll train an ML system to play a simplified version\
    \ of *Pac-Man*.\n\n**Chapter 13, Tic Tac Toe**\n\nHere you’ll see another example\
    \ of computer games and AI, by re-creating a version of a famous AI research project\
    \ to train a computer to play Tic Tac Toe.\n\n**Chapter 14, Confusing the Computer**\n\
    \nYou’ll see firsthand how ML projects most commonly go wrong, by creating your\
    \ own confused AI system that makes mistakes. You’ll learn about the problems\
    \ this causes, and steps we can take to avoid it.\n\n**Chapter 15, Biasing the\
    \ Computer**\n\nIn this chapter, you’ll learn about how some people intentionally\
    \ influence the answers that their ML projects give and some of the AI ethics\
    \ issues this raises.\n\n**Afterword**\n\nThe book ends with a look ahead to what\
    \ the future of AI might hold.\n\n![](image_fi/book_art/chapterart.png)\n\n# 1\
    \  \n\nWhat Is Artificial Intelligence?\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)n\
    \ this book, we’ll be exploring different aspects of AI by building projects based\
    \ on real-world uses of ML. Before we get started, though, it will be useful to\
    \ go over some background information on the tools and technologies we’ll be working\
    \ with.\n\nIn the introduction, you met the Scratch programming language and learned\
    \ what each section of the Scratch interface does. This chapter will explain a\
    \ few basic programming terms and concepts that we’ll use in the rest of the book.\n\
    \n## Coding\n\nCoding is how we tell machines what we want them to do. We often\
    \ use code to control computers, but we also use it to control small devices like\
    \ mobile phones, household appliances like washing machines, and huge machines\
    \ like cars and airplanes.\n\nTo write code, we first have to understand the task\
    \ that we want the machine to do, and then we break that task down into a series\
    \ of steps. The steps need to be specific and detailed enough for the machine\
    \ to follow.\n\nSome programming languages, like Scratch, try to explain coding\
    \ with colored blocks that represent those steps. You snap blocks together to\
    \ describe the sequence of steps the machine should take, as shown in [Figure\
    \ 1-1](#c01.xhtml#figure1-1).\n\n![Figure 1-1: Scratch explains coding using colored\
    \ blocks that snap together.](image_fi/500563c01/f01001.png)\n\n[Figure 1-1:](#c01.xhtml#figureanchor1-1)\
    \ Scratch explains coding using colored blocks that snap together.\n\nDescribing\
    \ tasks as a series of steps for a machine to follow has been the job of *software\
    \ developers* for decades. We have more expressive programming languages now that\
    \ make it easier to describe steps than it was in the past, but the basic idea\
    \ is still the same.\n\nHowever, while coding is useful, these days our machines\
    \ are so complicated that it’s no longer enough. For example, a new car has over\
    \ 100 million lines of code to accomplish all of its different tasks. That’s like\
    \ having to write 100 million steps!\n\nSome tasks that we want machines to do\
    \ are so complicated that it would take way too long to write step-by-step instructions\
    \ for them—and sometimes we don’t even know how to describe the steps.\n\nFor\
    \ these sorts of tasks, we use ML.\n\n## Machine Learning\n\nML is useful for\
    \ tasks with steps that would take too long to write or that are too complex to\
    \ describe. Instead of describing a task’s exact steps to a machine, we can use\
    \ ML to show the machine examples of the task over and over again until it learns\
    \ how to perform that task.\n\nImagine getting someone to kick a ball. You could\
    \ give them exact step-by-step instructions: how high to lift their leg, how fast\
    \ to move their leg, what to do with their arms, and so on. Giving them step-by-step\
    \ instructions is the coding approach.\n\nInstead, you could show the person lots\
    \ of examples of people kicking different kinds of balls and let them learn that\
    \ way. Collecting and showing examples of the task to perform—known as *training*—is\
    \ the ML approach.\n\nThroughout this book, you’ll see lots of examples of how\
    \ ML systems are trained, how they behave, and how they are used.\n\n## Artificial\
    \ Intelligence\n\nPeople sometimes confuse ML with AI. Some of the most interesting\
    \ AI systems have been built using ML, but it isn’t the only way to build an AI\
    \ system. The relationship between the two is illustrated in [Figure 1-2](#c01.xhtml#figure1-2).\n\
    \n![Figure 1-2: The relationship between ML and AI](image_fi/500563c01/f01002.png)\n\
    \n[Figure 1-2:](#c01.xhtml#figureanchor1-2) The relationship between ML and AI\n\
    \n*Artificial intelligence* is a general term used to describe projects where\
    \ a machine is doing something that would normally require human intelligence.\
    \ It doesn’t say anything about *how* you get the machine to do that thing, and\
    \ there are lots of different techniques you can use. ML is just one way to make\
    \ an AI project (just like neural networks, which we’ll discuss shortly, are just\
    \ one kind of ML). Let’s look at an example to better understand the difference.\n\
    \nIn 1997, a computer called Deep Blue beat the world champion Garry Kasparov\
    \ at a game of chess. Deep Blue was an AI project, and many described it as a\
    \ landmark in AI development.\n\nBut it wasn’t an ML system. Deep Blue didn’t\
    \ learn how to play chess or how to win; it was programmed. People coded the system\
    \ with the rules of the game, and more importantly, the strategies for winning.\
    \ The computer just followed the instructions that it was given, step by step."
