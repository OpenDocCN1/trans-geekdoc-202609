    这些脚本与你在第 9 步中为第一个报纸角色创建的脚本相似。


    这段代码将遍历你第二个列表中的示例。对于每个示例，它都会创建一个角色，如果你的 ML 模型识别出某个示例属于第二组，代码将将其移动到屏幕的下半部分。否则，代码将示例移动到屏幕上半部分。


    注意不要使用来自第一个角色的列表或变量。我的第一个脚本是关于小报标题的，而这第二个脚本是关于大报标题的。


    注意，此脚本中的坐标也必须不同，这样这次正确的匹配才能进入屏幕的下半部分。


    16. 再次点击绿色旗帜并观察你的脚本运行。


    和之前一样，即使 ML 模型没有正确识别所有内容也没关系。你可以在图 8-17 中看到我的 ML 模型表现如何。


    你的 ML 模型表现如何？


    ![图 8-17: 报纸项目第二次测试的结果](img/f08017.png)


    图 8-17: 报纸项目第二次测试的结果


    ## 检查并改进你的项目


    你训练了一个 ML 模型来识别媒体中的语言用法！你还使用 Scratch 制作了一个简单的测试，以可视化方式展示你的 ML 模型有多有效。


    如果我的 ML 模型表现完美，它本会将所有的红色报纸移动到上半部分，并将所有的蓝色报纸移动到下半部分。


    它并没有这样做。


    正确识别 100% 的标题是不可能的，因为我只给模型提供了少量的训练数据。如果有更多的训练示例，我预计结果会所提高，但即使如此，ML 系统也很少表现完美。


    但它到底有多呢？


    有很多方法可以描述 ML 系统的性能。


    ### 衡量性能：准确率


    我们用来描述 ML 模型性能的的一种衡量标准是 `accuracy`（准确率），或者计算 ML 模型回答正确的数量。


    创建一个选择 `for all sprites`（适用于所有角色）的新变量，并命名为 `correct`。


    修改你第一个角色的脚本（即图 8-12 中应该位于上半部分的报纸角色），使其与图 8-18 中的脚本一致。


    注意，你需要移除脚本中的最后一个 `if` 块，并将其替换为 `if...else` 块。


    现在修改第二个角色的脚本（即图 8-16 中应该位于下半部分的报纸角色），使其与图 8-19 中的脚本一致。


    ![图 8-18: 修改第一个测试脚本（来自图 8-12）以统计正确答案的数量](img/f08018.png)


    图 8-18: 修改第一个测试脚本（来自图 8-12）以统计正确答案的数量。


    注意，你还需要将此脚本中的最后一个 `if` 块替换为 `if...else` 块。


    ![图 8-19: 修改第二个测试脚本（来自图 8-16）以统计正确答案的数量](img/f08019.png)


    图 8-19: 修改第二个测试脚本（来自图 8-16）以统计正确答案的数量。


    通过这些更新后的脚本，你的 Scratch 项目将计算 ML 模型的准确率并在测试结束时显示结果。公式为：


    ```

    correct answers / ( (number of tabloid headlines) + (number of broadsheet headlines)
    )

    ```


    如图 8-20 所示。


    ![图 8-20: 计算准确率（Scratch 将列表中的项目数量称为列表的长度)](img/f08020.png)


    图 8-20: 计算准确率（Scratch 将列表中的项目数量称为列表的 `length`）


    换句话说，准确率是 ML 模型正确分类标题的百分比。


    我的 ML 模型的准确率如图 8-21 所示。它与你的项目相比如何？


    ![图 8-21: 显示准确率](img/f08021.png)


    图 8-21: 显示准确率


    ### 衡量性能：混淆矩阵


    准确率是一个很有用的标准，可能是最为人知的。但它往往是不够的，因此它不是真实 ML 系统的唯一标准。


    你能想到准确率的任何问题吗？准确率是一个很有用的标准，可能是最为人知的。但它往往是不够的，因此它不是真实 ML 系统的唯一标准。


    `confusion matrix`（混淆矩阵）是一个通过对比预测类别与实际类别来描述分类模型性能的表格。


    准确率是一个很有用的标准，可能是最为人知的。但它往往是不够的，因此它不是真实 ML 系统的唯一标准。


