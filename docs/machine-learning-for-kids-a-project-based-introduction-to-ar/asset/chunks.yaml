    These scripts are similar to those you created for the first newspaper sprite
    in step 9.


    This code will go through the examples in your second list. For each one, it will
    create a sprite, and if your ML model recognizes an example as being in the second
    group, the code will move it to the bottom half of the screen. Otherwise, the
    code will move the example to the top half.


    Be careful not to use the list or variable from your first sprite. My first script
    was about the tabloid headlines, and this second script is about the broadsheet
    headlines.


    Notice that the coordinates also have to be different in this script so that correct
    matches go to the bottom half of the screen this time.


    16. Click the Green Flag again and watch your scripts run.


    As before, it’s okay if your ML model doesn’t get everything right. You can see
    how my ML model did in [Figure 8-17](#c08.xhtml#figure8-17).


    How did your ML model perform?


    ![Figure 8-17: Results for the second test of the Newspapers project](image_fi/500563c08/f08017.png)


    [Figure 8-17:](#c08.xhtml#figureanchor8-17) Results for the second test of the
    Newspapers project


    ## Review and Improve Your Project


    You’ve trained an ML model to recognize the use of language in the media! You
    also used Scratch to make a simple test to visualize how effective your ML model
    is.


    If my ML model had performed perfectly, it would have moved all of the red newspapers
    to the top half and moved all of the blue newspapers to the bottom half.


    It didn’t.


    Recognizing 100 percent of the headlines correctly was unlikely, as I gave my
    model only a small amount of training. With more training examples I would expect
    the results to improve, but even then, ML systems rarely perform perfectly.


    But how good was it?


    There are many ways that we can describe the performance of an ML system.


    ### Measuring Performance: Accuracy


    One measure we use to describe how well an ML model performs is `accuracy`, or
    counting the number of things that the ML model answers correctly.


    Create a new variable with `for all sprites` selected and call it `correct`.


    Change your scripts for the first sprite (the one in [Figure 8-12](#c08.xhtml#figure8-12)
    for newspapers that should go in the top half) to match the scripts in [Figure
    8-18](#c08.xhtml#figure8-18).


    Notice that you’ll need to remove the last `if` block in the script to replace
    it with an `if...else` block.


    Now change the scripts for the second sprite (the one in [Figure 8-16](#c08.xhtml#figure8-16)
    for newspapers that should go in the bottom half) to match the scripts in [Figure
    8-19](#c08.xhtml#figure8-19).


    ![Figure 8-18: Modify the first test script (from Figure 8-12) to count the number
    of correct answers.](image_fi/500563c08/f08018.png)


    [Figure 8-18:](#c08.xhtml#figureanchor8-18) Modify the first test script (from
    [Figure 8-12](#c08.xhtml#figure8-12)) to count the number of correct answers.


    Notice that you’ll also need to replace the last `if` block in this script with
    an `if...else` block.


    ![Figure 8-19: Modify the second test script (from Figure 8-16) to count the number
    of correct answers.](image_fi/500563c08/f08019.png)


    [Figure 8-19:](#c08.xhtml#figureanchor8-19) Modify the second test script (from
    [Figure 8-16](#c08.xhtml#figure8-16)) to count the number of correct answers.


    With these updated scripts, your Scratch project will compute the accuracy of
    your ML model and display the result at the end of the test. The formula is:


    ```

    correct answers / ( (number of tabloid headlines) + (number of broadsheet headlines)
    )

    ```


    as shown in [Figure 8-20](#c08.xhtml#figure8-20).


    ![Figure 8-20: Computing accuracy (Scratch refers to the number of items in a
    list as the length of the list)](image_fi/500563c08/f08020.png)


    [Figure 8-20:](#c08.xhtml#figureanchor8-20) Computing accuracy (Scratch refers
    to the number of items in a list as the `length` of the list)


    In other words, the accuracy is the percentage of how many headlines the ML model
    classified correctly.


    The accuracy for my ML model is shown in [Figure 8-21](#c08.xhtml#figure8-21).
    How does it compare to your project?


    ![Figure 8-21: Displaying accuracy](image_fi/500563c08/f08021.png)


    [Figure 8-21:](#c08.xhtml#figureanchor8-21) Displaying accuracy


    ### Measuring Performance: Confusion Matrix


    Accuracy is a useful measure, and possibly the most well-known one. But it’s often
    not enough, so it’s not the only measure for real-world ML systems.


    Can you think of any problems with accuracy? Accuracy is a useful measure, and
