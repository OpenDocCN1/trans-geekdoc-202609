    For this project, the best way to be sure of that is to take lots of photos of
    your two objects with different places, backgrounds, lighting, sizes, angles,
    and orientations. Change everything that you can think of between the training
    examples, so that the only thing they have in common is the object itself.


    For example, [Figure 14-18](#c14.xhtml#figure14-18) shows a much better set of
    training images for my grapefruit.


    ![Figure 14-18: A better way to train the ML model](image_fi/500563c14/f14018.png)


    [Figure 14-18:](#c14.xhtml#figureanchor14-18) A better way to train the ML model


    Varying the training images’ backgrounds, lighting, and level of focus is a good
    start toward training the ML model to identify only the grapefruit itself as the
    common factor among the images.


    We could make the training even better still. For example, these training images
    all have the grapefruit in the same position and at the same size. That’s fine
    if I can guarantee that objects in my test photos will be at the same size and
    position when I test the model. But for a truly flexible model, I could also add
    photos where the grapefruit is at different sizes and positions.


    Try improving your training examples for your two objects and training a new ML
    model.


    If you vary the training examples, does the model pass your test?


    ## What You Learned


    In this chapter, you’ve learned how important it is to have variation in your
    training sets. Whether it’s a military project that accidentally recognizes the
    weather instead of camouflaged tanks, a university research project inventing
    a ruler detector instead of a skin cancer classifier, or simply a system that
    can’t tell a grapefruit from a lemon, you’ve seen the impact of having `unintentional
    bias` in the datasets used to train an ML model.


    In the next chapter, you’ll see the risks of introducing `intentional bias` in
    ML projects.


    ![](image_fi/book_art/chapterart.png)


    # 15 Biasing the Computer


    ![Alphabet-I](image_fi/book_art/Alphabet-I.png)n the last chapter, you saw how
    it’s possible to accidentally train an ML system in a way that causes it to give
    the wrong answer, by introducing `bias` into your training examples.


    In this chapter, you’ll see how bias is sometimes introduced intentionally to
    influence the answers that an ML system gives. You’ll create an app that recommends
    movies to people based on the sort of films that they like. But you’ll train your
    model in a way that lets you affect the recommendations.


    ## Build Your Project


    Choose three movies to begin building the movie library that your recommendation
    app will have to choose from.


    I want my recommendation app to help people find classic movies, so I chose three
    films from the 1920s, as shown in [Figure 15-1](#c15.xhtml#figure15-1), but you
    can choose newer movies for your project.


    ![Figure 15-1: The movies I chose to start my project](image_fi/500563c15/f15001.png)


    [Figure 15-1:](#c15.xhtml#figureanchor15-1) The movies I chose to start my project


    Choose three very films that different sorts of people might enjoy. I chose the
    science-fiction film `Metropolis`, the comedy movie `The Gold Rush`, and the horror
    film `Nosferatu`.


    ### Train Your Model


    1. Go to `https://machinelearningforkids.co.uk/`. Create a new ML project, name
    it `Bias`, and set it to learn to recognize text in your preferred language.

    2. Click `Train`, as shown in [Figure 15-2](#c15.xhtml#figure15-2).

    ![Figure 15-2: Train is the first phase of an ML project.](image_fi/500563c15/f15002.png)

    [Figure 15-2:](#c15.xhtml#figureanchor15-2) Train is the first phase of an ML
    project.

    3. Click `Add new label`, as shown in [Figure 15-3](#c15.xhtml#figure15-3), to
    add a training bucket for each of your three movies.

    ![Figure 15-3: Create a training bucket for each movie.](image_fi/500563c15/f15003.png)

    [Figure 15-3:](#c15.xhtml#figureanchor15-3) Create a training bucket for each
    movie.

    4. Click `Add example`, as shown in [Figure 15-4](#c15.xhtml#figure15-4), in the
    first of your movie buckets. Type something you think someone would like your
    first movie might say. For example, my first movie, `Metropolis`, is a sci-fi
    film set in the future, so I typed `I love futuristic films`.

    ![Figure 15-4: Add an example of someone who likes the first movie would say.](image_fi/500563c15/f15004.png)

    [Figure 15-4:](#c15.xhtml#figureanchor15-4) Add an example of someone who likes
    the first movie would say.

    5. Click `Add`.

    6. Repeat steps 4 and 5 until you’ve got five examples for each movie, as shown
    in [Figure 15-5](#c15.xhtml#figure15-5).

    ![Figure 15-5: Add five examples for each movie.](image_fi/500563c15/f15005.png)

    [Figure 15-5:](#c15.xhtml#figureanchor15-5) Add five examples for each movie.

    7. Click `Back to project` in the top-left corner of the screen.

    8. Click `Learn & Test`.

    9. Click `Train new learning model`, as shown in [Figure 15-6](#c15.xhtml#figure15-6).
    It will take a minute for the computer to learn from your examples and create
    a new ML model, but you can continue to the next step while you’re waiting.

    ![Figure 15-6: Create an ML model.](image_fi/500563c15/f15006.png)

    [Figure 15-6:](#c15.xhtml#figureanchor15-6) Create an ML model.


    ### Prepare Your Project


    Now that you have an ML model, it’s time to create the recommendations app that
    will use it.


    1. Click `Back to project` in the top-left corner of the screen.

    2. Click `Make`.

    3. Click `Scratch 3`, and then click `Open in Scratch 3` to open a new window
    with Scratch.

    4. Click the `Costumes` tab, move your mouse pointer over the `Choose Costume`
    icon (the cat face) at the bottom left, and then click `Upload Costume` to upload
    a poster of your movie, as shown in [Figure 15-7](#c15.xhtml#figure15-7).

    ![Figure 15-7: Upload a costume.](image_fi/500563c15/f15007.png)

    [Figure 15-7:](#c15.xhtml#figureanchor15-7) Upload a costume.

    5. Upload a poster for the first of your movies, as shown in [Figure 15-8](#c15.xhtml#figure15-8).

    ![Figure 15-8: Create a costume to represent your first movie.](image_fi/500563c15/f15008.png)

    [Figure 15-8:](#c15.xhtml#figureanchor15-8) Create a costume to represent your
    first movie.

    6. Repeat steps 4 and 5 to add the posters for all three of your movies as costumes
    for the same sprite so that it looks like [Figure 15-9](#c15.xhtml#figure15-9).
    Name each costume to match its film title.

    ![Figure 15-9: Create a costume for each movie.](image_fi/500563c15/f15009.png)

    [Figure 15-9:](#c15.xhtml#figureanchor15-9) Create a costume for each movie.

    7. Click the `Code` tab and copy the script shown in [Figure 15-10](#c15.xhtml#figure15-10).
    You’ll need to update it to use the names of your three movies. This script will
    ask someone what sort of movies they like and then use your ML model to make a
    recommendation from the three movies in your library.

    ![Figure 15-10: Create this script.](image_fi/500563c15/f15010.png)

    [Figure 15-10:](#c15.xhtml#figureanchor15-10) Create this script.

    8. Design your project to look how you think a movie recommendation app should
    look. You can use the paint editor (Chapter 3), take photos with a webcam (Chapter
    4), upload a picture you’ve saved to the computer (Chapter 5), or choose a premade
    design from the Scratch libraries (Chapter 5) to update the backdrop and sprite.
    Be creative! [Figure 15-11](#c15.xhtml#figure15-11) shows my app.

    ![Figure 15-11: Design your movie recommendation app.](image_fi/500563c15/f15011.png)

    [Figure 15-11:](#c15.xhtml#figureanchor15-11) Design your movie recommendation
    app.

    9. Click `File`▶`Save to your computer` to save your project.


    ### Test Your Project


    Click the Green Flag and test your project.

