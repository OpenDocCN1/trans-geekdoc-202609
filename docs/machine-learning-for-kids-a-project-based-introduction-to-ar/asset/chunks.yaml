    ![Alphabet-A](image_fi/book_art/Alphabet-A.png)I and ML have exciting potential
    for the future of computer games, such as computer game characters that learn
    to understand your words and actions. There are already games where characters
    behave like the chatbots you learned about in the last chapter. However, the opportunity
    for truly intelligent games that adapt as they are played is enormous.


    In this chapter, we’ll look at the reverse situation: not how AI can contribute
    to game development, but how games have been used in AI development.


    Games provide a simulation environment with a well-defined goal, a way to collect
    training examples, and a way to measure effectiveness, which makes them a great
    platform for the research and development of computer systems that can learn.


    `Pac-Man` (and `Ms. Pac-Man`) is an example of a classic computer game that has
    regularly been used in AI research. The `Ms. Pac-Man AI competition`, where academics
    submit ML systems that compete to see which is best at playing the game, has been
    held multiple times since 2007 and is still used as a task for AI students and
    researchers today.


    In this chapter, you’ll try training an ML system to play a simplified version
    of `Pac-Man`, where the objective is to navigate a character through a maze while
    avoiding a monster (see [Figure 12-1](#c12.xhtml#figure12-1)).


    Let’s get started!


    ![Figure 12-1: A simple video game we can train an ML system to play](image_fi/500563c12/f12001.png)


    [Figure 12-1:](#c12.xhtml#figureanchor12-1) A simple video game we can train an
    ML system to play


    ## Build Your Project


    Before we start, try the game for yourself so you understand what we’ll be training
    the computer to do. First, go to [https://machinelearningforkids.co.uk/scratch3/](https://machinelearningforkids.co.uk/scratch3/)
    and click `Project templates` in the top menu bar, as shown in [Figure 12-2](#c12.xhtml#figure12-2).


    ![Figure 12-2: Access the game from the Project templates menu.](image_fi/500563c12/f12002.png)


    [Figure 12-2:](#c12.xhtml#figureanchor12-2) Access the game from the `Project
    templates` menu.


    Click the `Avoid the monster` game as shown in [Figure 12-3](#c12.xhtml#figure12-3).


    ![Figure 12-3: Click Avoid the monster in the list of project templates.](image_fi/500563c12/f12003.png)


    [Figure 12-3:](#c12.xhtml#figureanchor12-3) Click `Avoid the monster` in the list
    of project templates.


    In this game, you play as the character `nano`, which starts off in the bottom-left
    corner of the Stage. Your objective is to avoid the monster, which starts off
    in the top-right corner of the Stage, for as long as you can.


    You control `nano` using the arrow keys to change direction. `nano` can only follow
    the grid, so you can only move up, down, left, and right. You can’t move diagonally.


    When you’re not pressing an arrow key, `nano` will just continue in whatever direction
    you last pressed.


    `nano` can’t move faster than the monster. The game’s code uses a timer so that
    both `nano` and the monster can make only one move per second.


    There are two walls in the way. Neither `nano` nor the monster is allowed to go
    through the walls.


    Give the game a try. Click the full-screen icon in the controls at the top right
    and then click the Green Flag.


    How long can you avoid the monster?


    ### Describe the State of the Game


    The game board can be represented as a graph, as shown in [Figure 12-4](#c12.xhtml#figure12-4).


    ![Figure 12-4: Think of the game board as a graph with x- and y-axes.](image_fi/500563c12/f12004.png)


    [Figure 12-4:](#c12.xhtml#figureanchor12-4) Think of the game board as a graph
    with x- and y-axes.


    Using this graph, you can describe the locations of `nano` and the monster as
    a pair of coordinates. For example, in [Figure 12-4](#c12.xhtml#figure12-4) the
    monster is at `x` = 7 and `y` = 3.


    We’ll use this representation of the game to describe it to the computer.


    We want to give the computer four numbers so that it can decide to move `nano`
    up, down, left, or right to avoid the monster.


    For example, if we input the coordinates shown in [Figure 12-5](#c12.xhtml#figure12-5),
    the computer could decide to move `nano` up.


    ![Figure 12-5: Nano is at x = 5, y = 5, and the monster is at x = 7, y = 3.](image_fi/500563c12/f12005.png)


    [Figure 12-5:](#c12.xhtml#figureanchor12-5) Nano is at `x` = 5, `y` = 5, and the
    monster is at `x` = 7, `y` = 3.


    ## Train Your Model


    To train the computer, we need to give it examples of how to play. The first step
    is to collect these examples by playing the game ourselves.


    1.  Go to [https://machinelearningforkids.co.uk/scratch3/](https://machinelearningforkids.co.uk/scratch3/)
    and open the `Avoid the monster` game.

    2.  Click the `Train` button.

    3.  Play the game several times, using the arrow keys to move `nano`. Try to avoid
    the monster for as long as possible. The game will record the coordinates of `nano`
    and the monster, and the move you made.

    4.  Once you have collected enough examples (around 50-100), click the `Train`
    button again.

    5.  Wait for the computer to finish training. The computer will use the examples
    you provided to create a model.


    Now we are ready to test the model and see how well it performs.


    1.  Click the `Test` button.

    2.  The game will now move `nano` automatically based on the model.

    3.  Watch how `nano` tries to avoid the monster. If `nano` isn''t performing well,
    you might need to collect more examples and train the model again.

    '
  trans: '


    ![Alphabet-A](img/Alphabet-A.png)AI 和机器学习（ML）对计算机游戏的未来具有巨大的潜力，例如能够学习理解你的言语和动作的游戏角色。目前已经有一些游戏中的角色行为就像你在上一节中学到的聊天机器人。然而，开发能够在游戏过程中不断自我适应的真正智能的游戏，其机会是巨大的。


    在本章中，我们将观察相反的情况：不是 AI 如何助力游戏开发，而是游戏是如何被用于 AI 开发的。


    游戏提供了一个具有明确目标的模拟环境、收集训练示例的方法以及衡量有效性的方法，这使其成为研究和开发学习型计算机系统的绝佳平台。


    `Pac-Man`（以及 `Pac-Man`）是一个经典计算机游戏的示例，它被经常用于 AI 研究。`Ms. Pac-Man AI competition`
    让学者提交 ML 系统进行竞争，看谁最擅玩这个游戏，该比赛自 2007 年以来已举办多次，今天仍被用作 AI 学生和研究人员的任务。


    在本章中，你将尝试训练一个 ML 系统来玩简化版的 `Pac-Man`，其目标是引导角色穿过迷宫同时避开怪物（参见图 12-1）。


    让我们开始吧！


    ![图 12-1: 我们可以训练 ML 系统来玩的一个简单视频游戏](img/f12001.png)


    图 12-1: 一个我们可以训练 ML 系统来玩的简单视频游戏


    ## 构建你的项目


    在我们开始之前，请亲自尝试玩一下这个游戏，以便你理解我们将训练计算机做什么。首先，访问 [`machinelearningforkids.co.uk/scratch3/`](https://machinelearningforkids.co.uk/scratch3/)
    并点击顶部菜单栏中的 `Project templates`（项目模板），如图 12-2


    图 12-2: 从 `Project templates` 菜单访问游戏。


    点击如图 12-3 所示的 `Avoid the monster`（避开怪物）游戏。


    ![图 12-3: 在 project templates 列表中点击 Avoid the monster。](img/f12003.png)


    图 12-3: 在项目模板列表中点击 `Avoid the monster`。


    在这个游戏中，你扮演角色 `nano`，它起始于舞台（Stage）的左下角。你的目标是尽可能长时间避开怪物，怪物起始于舞台的右上角。


    你使用方向键来控制 `nano` 并改变方向。`nano` 只能沿着网格移动，所以你只能向上、下、向左和向右。你不能对角线移动。


    当你没有按下方向键时，`nano` 将继续向你上次按下的方向移动。


    `nano` 的移动速度不会比怪物。游戏代码使用了计时器，使得 `nano` 和怪物每秒都只能移动一次。


    路径上有两堵墙。`nano` 和怪物都不被允许穿过墙。


    尝试一下这个游戏。点击右上角控制中的全屏图标，然后点击绿色旗帜（Green Flag）。


    你能避开怪物多久？


    ### 描述游戏状态


    游戏板可以表示为一个图，如图 12-4 所示。


    ![图 12-4: 将游戏板看作具有 x 轴和 y 轴的图](img/f12004.png)


    图 12-4: 将游戏板看作具有 x 轴和 y 轴的图。


    使用这个图，你可以用坐标对来描述 `nano` 和怪物的位置。例如，在图 12-4 中，怪物位于 `x` = 7，`y` = 3。


    我们将使用这种游戏的表示方法来向计算机描述它。


    我们想给计算机提供四个数字，以便它可以决定让 `nano` 向上、下、左或右移动以避开怪物。


    如果我们输入图 12-5 所示的坐标，计算机可以决定让 `nano` 向上。


    ![图 12-5: Nano 位于 x = 5, y = 5，怪物位于 x = 7, y = 3。](img/f12005.png)


    图 12-5: Nano 位于 `x` = 5，`y` = 5，怪物位于 `x` = 7，`y` = 3。


    ## 训练你的模型


    为了训练计算机，我们需要给它提供游戏的示例。第一步是通过自己玩游戏来收集这些示例。


    1.  访问 [`machinelearningforkids.co.uk/scratch3/`](https://machinelearningforkids.co.uk/scratch3/)
    并打开 `Avoid the monster` 游戏。

    2.  点击 `Train`（训练）按钮。

    3.  多次玩游戏，使用方向键移动 `nano`。尝试尽可能长时间地避开怪物。游戏会记录 `nano` 和怪物的坐标，以及你做的动作。

    4.  一旦你收集了足够的示例（大约 50-100 个），再次点击 `Train` 按钮。

    5.  等待计算机完成训练。计算机将使用你提供的示例来创建一个模型。


    现在我们准备好测试该模型并看看它的性能如何了。


    1.  点击 `Test`（测试）按钮。

    2.  现在游戏将根据模型自动移动 `nano`。

    3.  观察 `nano` 如何尝试避开怪物。如果 `nano` 的表现不好，你可能需要收集更多的示例并重新训练模型。


    '
