- raw: 'Imagine an ML recommendation app that recommends which medicines should be
    prescribed to patients. Each training bucket is a type of medicine, and the training
    examples it contains are medical records of patients for whom that medicine was
    the best treatment. Systems like this are in use today. ML systems can learn to
    recognize patterns in massive numbers of detailed medical records and combine
    this with evidence extracted from equally massive amounts of medical research
    and literature. It’s still early days for this sort of medical AI assistant application,
    but usage is going to increase significantly in the next few years.


    Now that you’ve seen for yourself how easy it is for such a system to be influenced
    to prefer one answer over another, does this affect your opinion of how such systems
    are used? In theory, it’s possible that the manufacturer of one drug could reward
    the developers of a medical AI application for biasing their ML model to prefer
    that drug over drugs from other manufacturers.


    We are increasingly relying on ML systems to make important decisions that affect
    people’s lives. It’s not just in healthcare, either. ML systems make financial
    recommendations that banks and loan companies use to determine whether someone
    should be offered insurance, whether they can get a loan, or what interest rate
    they should be charged. ML systems will soon be driving the cars and trucks on
    our roads. And there are many more examples.


    Forcing companies to be transparent and disclose how their ML systems are trained
    might be one way to protect against ethical problems. But you’ve seen how much
    effort is involved in preparing training data. Companies invest a lot of time
    and money in the training data they collect to make their ML systems better than
    those of their competitors, so many prefer to keep their training data secret.
    How would you balance these ethics issues with the commercial interests of companies?


    Do you think protections are needed over how AI systems are trained or applied?
    If so, should AI ethics policies be developed by individual companies or by the
    government?


    This chapter is ending with more questions than answers, and this reflects the
    current state of ethics in AI. ML systems have the potential to improve all of
    our lives by training computers to do things that we couldn’t do otherwise. However,
    as a society, we need to address a number of questions about how comfortable we
    are applying this technology.


    ## What You Learned


    In this final project, you built on your knowledge of bias from Chapter 14 and
    created an ML model for a movie recommendation app that preferred one result over
    the others. You saw that having an imbalance in the number of examples used to
    train an ML model is another way to intentionally introduce bias into a system.
    You also learned that bias isn’t necessarily bad—and in some cases may even be
    appropriate—but it’s important to be aware of the ethical issues surrounding it,
    especially as AI systems become more common.


    ![](image_fi/book_art/chapterart.png)


    # Afterword


    ![Alphabet-F](image_fi/book_art/Alphabet-F.png)or a lot of people, AI brings to
    mind visions of robots and science fiction. Hopefully you’ve learned from the
    projects in this book that AI is already here, and it is all around us.


    Understanding how ML systems are created gives you a better understanding of how
    the world around you works. That understanding provides insight into how companies
    know what you’re thinking and recommend products you might like. And it helps
    you recognize that when you’re asked to rate something, or prove you’re a human,
    or tag a face in a photo, you’re probably training someone’s ML system.


    ## The Future


    If our lives are all going to be impacted by ML systems in the future, we might
    have an opinion on how they are trained and applied.


    For example, what applications are appropriate for ML systems, and what decisions
    should be left to humans?


    Should machines make decisions involving your healthcare? Or how law enforcement
    behaves? Or who can get a credit card or a mortgage?


    Who should be responsible for collecting the training data used to create the
    most important ML systems? And who should be checking how training is done? How
    should ML systems be tested, and should you be able to see the results of those
    tests for the ML systems you use?


    The fundamentals that you’ve learned in this book—such as the impact of the amount
    and balance of training data on ML models, the measures we use to describe an
    ML model’s performance, and the sorts of things that can go wrong—are all useful
    to get you thinking about these important questions.


    They’re also an essential starting point if you choose to study ML further and
    learn about how different ML systems are implemented. I hope that this book has
    encouraged you to explore more.


    ## Next Steps


    If you’d like to learn more, one option is to build your own ML project. Many
    of the AI projects created by companies around the world are built using online
    ML services provided “in the cloud,” just as you’ve been doing so far. With these
    services, you provide the training data, the cloud service creates an ML model
    using it, and then you test the model to make sure it does the job that you need.
    You can continue using Scratch if you want, or progress to using a text-based
    programming language like Python.


    Alternatively, if you’d like to understand more about how ML works, you can switch
    from using ML models that are built and hosted on the cloud to building and running
    your own ML models. This gives you more control over the behavior of your ML systems
    and also helps you learn how they work internally. You’ll need to start using
    a text-based programming language, such as Python, but if you’re willing to do
    that, there’s a wide variety of free ML technology frameworks available to get
    you started. TensorFlow is one of the most widely used, and there are free tutorials
    on the TensorFlow website ([https://www.tensorflow.org/](https://www.tensorflow.org/))
    that will help you build your first ML model.


    I hope that this book is only the start of your ML journey. Whether you use what
    you’ve learned about ML to create your own AI projects and applications, to build
    ML models yourself, or to understand a little more about how the online services
    you use every day work, I wish you luck with your next steps.'
