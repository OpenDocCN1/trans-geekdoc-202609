    # About the Author


    Dale Lane is a senior developer for IBM with a background in artificial intelligence
    and machine learning. He has worked on a wide variety of AI projects for IBM clients
    and spent several years as a developer of IBM’s AI platform Watson.


    # About the Technical Reviewer


    Maya Posch is a software and hardware developer with a focus on C++, Ada, and
    VHDL. She works as a freelance developer in addition to writing fiction and nonfiction
    works.


    # Acknowledgments


    I’ve had a huge amount of help to make this book happen, so I owe a lot of thanks
    to the staff at No Starch Press, including my publisher, Bill Pollock; my editor,
    Barbara Yien; my production editor and copyeditor, Rachel Monaghan; my developmental
    editors, Patrick DiJusto and Athabasca Witschi; and my technical reviewer, Maya
    Posch.


    I am very grateful to the Lifelong Kindergarten Group at the MIT Media Lab for
    inventing Scratch, having the foresight to include a mechanism for extending it
    with new blocks, and generously making it all available (including the source
    code) free of charge. They make it possible for projects like Machine Learning
    for Kids to be built.


    Finally, I’d like to thank John Keble CofE Primary School in Hursley for allowing
    me to develop and test the projects in this book with their students.


    # Foreword


    When my dad was a child, growing up in Illinois after the turn of the century—not
    *this* century, mind you, but the *previous* one—radio was getting started, the
    zipper had just been invented, Charlie Chaplin was all the rage, Lindberg had
    not yet crossed the Atlantic, the *Titanic* sunk, the Model T was released, and
    most of the world was still being governed by various monarchies or vast, sprawling
    empires. When I was a child, growing up in the Great Plains of Texas, we had just
    landed humans on the moon, computers were huge, expensive beasts, the internet
    had not yet been invented, plastic was starting to become widespread, and talking
    to someone on the other side of the world was prohibitively expensive for all
    but a few. I spent many a lazy summer afternoon making gunpowder in my bedroom
    (sorry, Mom!), launching model rockets, and dreaming about going to the stars.
    I built my first computer from scratch when I was 12, and when I say “from scratch,”
    I mean literally from individual transistors, diodes, resistors, and I read this
    remarkable robot called Shakey by the good folks at Stanford Research Institute,
    and I sat mesmerized in the movie *2001: A Space Odyssey*. I knew then and there
    that I wanted to build computers that would take people to the stars.


    The even more remarkable thing is, owing to the fact that computers have gotten
    so inexpensive and their computational power so vast, almost anyone can learn
    how to use computers to build things that are limited only by our imagination.
    This is where *computational thinking* comes in, a way of approaching the world
    in terms of abstractions and algorithms that make it possible to turn our imagination
    into systems that run on our computers.


    Right now, the world is a very different place than what my father and I experienced.
    In some ways it’s better, in others it is not, but one thing that has not changed
    is our ability to dream and to work to make those dreams become reality. Today,
    you can gain access to the world’s knowledge using a device you can hold in your
    hand. It’s possible to talk—and see—someone on the other side of the world, or
    even in space, in real time. Cars are now electric, and some of them drive themselves.
    Not only have we gone to the moon, but Mars is now populated entirely by robots,
    and we have sent spacecraft beyond our solar system. Thanks to computers, we can
    produce more for less, we make art that augments and even transcends reality,
    we have extended our bodies and our minds, and we study the cosmos in ways far
    and broader than we’d imagined.


    To build a program that does your finances, or controls the heating in your house,
    or calculates the trajectory of a rocket flung into space, you’ll think mostly
    in terms of symbols. But, if you want to build a car that drives itself, a robot
    that interacts safely with humans, or a video game that gives challenging virtual
    opponents, you’ll need to use a different way of working with computers, and that
    is where artificial intelligence and machine learning come into play. From the
    time of Alan Turing—one of the pioneers of computing—computer scientists have
    tried to make computers that reason and learn and behave as humans, and recent
    advances in machine learning have made it possible for us today to build such
    things.


    In this book, you’ll learn the fundamentals of AI and ML, enough so that you’ll
    build your own games and cognitive assistants, as well as programs that can discern
    language and images. As a child, my dad would have seen what you’ll do here as
    utter magic, but as you’ll discover, it’s not really magic, it’s just software,
    and mastering the computer to do all these things is well within your ability.

