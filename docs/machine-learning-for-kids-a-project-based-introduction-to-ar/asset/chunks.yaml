    \ in [Figure 4-8](#c04.xhtml#figure4-8). \n\n    ![Figure 4-8: Click Train new\
    \ machine learning model to start training a model.](image_fi/500563c04/f04008.png)\n\
    \n    [Figure 4-8:](#c04.xhtml#figureanchor4-8) Click **Train new machine learning\
    \ model** to start training a model.\n\nThe example photos you’ve taken will be\
    \ used to train an ML model. The computer will learn what the photos in each bucket\
    \ have in common to be able to recognize different hand shapes. This process can\
    \ take a few minutes, but you can move on to the next section to start getting\
    \ your game ready while you wait.\n\n### Prepare Your Game\n\nYou’ll make a script\
    \ in Scratch that uses your ML model to play Rock, Paper, Scissors against you.\
    \ The script will use your webcam to take a picture of your hand, and your model\
    \ will recognize the shape that your hand is making.\n\n1.  Click **Back to project**\
    \ in the top-left corner.\n\n2.  Click **Make**.\n\n3.  Click **Scratch 3**, and\
    \ then click **Open in Scratch 3** to open a new window with Scratch.\n\n    You\
    \ should see new blocks representing your ML model in the Toolbox, as shown in\
    \ [Figure 4-9](#c04.xhtml#figure4-9).\n\n4.  At the top of the Scratch window,\
    \ click **Project templates** as shown in [Figure 4-9](#c04.xhtml#figure4-9).\n\
    \n    This lets you access a variety of sample and starter projects, which should\
    \ save you time.\n\n    ![Figure 4-9: Opening Project templates from the top menu](image_fi/500563c04/f04009.png)\n\
    \n    [Figure 4-9:](#c04.xhtml#figureanchor4-9) Opening Project templates from\
    \ the top menu\n\n5.  Click **Rock Paper Scissors** in the list of project templates.\
    \ (You can enter the name in the search field or click **Images projects** to\
    \ find it more quickly.)\n\n    This template gives you most of a working Rock,\
    \ Paper, Scissors game in Scratch. The following steps will show you how to add\
    \ ML to the Scratch project, but before you start, try reading the code to understand\
    \ how it works.\n\n6.  Click the **you** sprite and then find the `when Green\
    \ Flag clicked` and `when I receive new-move` scripts, as shown in [Figure 4-10](#c04.xhtml#figure4-10).\
    \ \n\n    ![Figure 4-10: Find the scripts to modify in the you sprite.](image_fi/500563c04/f04010.png)\n\
    \n    [Figure 4-10:](#c04.xhtml#figureanchor4-10) Find the scripts to modify in\
    \ the **you** sprite.\n\n7.  Drag the blocks representing your **Rock, Paper,\
    \ Scissors** ML training buckets into the `when Green Flag clicked` script, as\
    \ shown in [Figure 4-11](#c04.xhtml#figure4-11).\n\n    ![Figure 4-11: Update\
    \ the when Green Flag clicked script with the blocks for your project.](image_fi/500563c04/f04011.png)\n\
    \n    [Figure 4-11:](#c04.xhtml#figureanchor4-11) Update the `when Green Flag\
    \ clicked` script with the blocks for your project.\n\n8.  Drag a `recognize image\
    \ (label)` block into the `when I receive new-move` script, and then drag the\
    \ `costume image` block into that block, as shown in [Figure 4-12](#c04.xhtml#figure4-12).\n\
    \n    ![Figure 4-12: Update the when I receive new-move script with the blocks\
    \ for your project.](image_fi/500563c04/f04012.png)\n\n    [Figure 4-12:](#c04.xhtml#figureanchor4-12)\
    \ Update the `when I receive new-move` script with the blocks for your project.\n\
    \n### Test Your Game\n\nIt’s time to try out your project!\n\nClick the Green\
    \ Flag icon to start playing Rock, Paper, Scissors against the computer.\n\nHold\
    \ your hand up to your webcam in the shape of a rock, paper, or scissors and press\
    \ P on the keyboard to take a photo.\n\nThe computer will make a random choice\
    \ from rock, paper, and scissors, and will display a cartoon to represent its\
    \ move. It will use your ML model to recognize your move based on your hand shape,\
    \ and then show a message saying who won (see [Figure 4-13](#c04.xhtml#figure4-13)).\n\
    \n ![Figure 4-13: Playing Rock, Paper, Scissors](image_fi/500563c04/f04013.png)\n\
    \n[Figure 4-13:](#c04.xhtml#figureanchor4-13) Playing Rock, Paper, Scissors\n\n\
    ## Review and Improve Your Project\n\nYou’ve trained an ML model to recognize\
    \ pictures of three different hand shapes! Try experimenting with it to see what\
    \ makes it work well and what makes it make mistakes.\n\nRemember that the ML\
    \ model isn’t starting from an understanding of the Rock, Paper, Scissors game\
    \ or the meaning of your different hand shapes. It can only learn from the patterns\
    \ in the example photos that you’ve taken.\n\nImagine you took all of the rock\
    \ training example photos with your hand very, very close to the webcam so that\
    \ your hand looks huge, and that you took all of the scissors training example\
    \ photos with your hand very, very far away from the webcam so that your hand\
    \ looks tiny. A computer could assume that this size pattern was significant and\
    \ learn that large hands mean “rock” and small hands mean “scissors.” That means\
    \ that it could recognize a photo of any large hand making any hand shape as “rock.”\n\
    \nNow imagine you took all the rock training example photos with your hand coming\
    \ in from the left, and all of the paper training example photos with your hand\
    \ coming in from the right, as shown in [Figure 4-14](#c04.xhtml#figure4-14).\
    \ A computer could assume this direction pattern was significant, and learn that\
    \ a hand facing to the right means “rock,” and a hand facing to the left means\
    \ “paper.” That means it could recognize a photo of any hand shape facing to the\
    \ right as “rock.”\n\n ![Figure 4-14: Computers can learn from unexpected patterns\
    \ in the training data.](image_fi/500563c04/f04014.png)\n\n[Figure 4-14:](#c04.xhtml#figureanchor4-14)\
    \ Computers can learn from unexpected patterns in the training data.\n\nWe only\
    \ use the labels on the training buckets to make it easier for us to organize\
    \ our projects. The computer doesn’t take the labels into account when it looks\
    \ for patterns in the training examples. If you hid the labels and asked a friend\
    \ to guess what the photos in each set in [Figure 4-14](#c04.xhtml#figure4-14)\
    \ have in common, they might say, “Those hands are all pointing to the right,\
    \ and those hands are all pointing to the left.” ML models work in a similar way,\
    \ so they might learn to recognize misleading patterns.\n\nThe background of the\
    \ photo can have a similar impact. I helped a student once who accidentally discovered\
    \ this when creating this project. His face was included in all of the rock and\
    \ paper training photos, but both his face and a classmate were included in all\
    \ of the scissors training photos.\n\nWhen he tested his project in Scratch, it\
    \ seemed to do a good job of recognizing his hand shapes, until I came to stand\
    \ next to him and watch. When I stood next to him, no matter the hand shape he\
    \ made, his project almost always thought that he was showing scissors.\n\nAlthough\
    \ he hadn’t realized it at first, he had trained his ML model to recognize the\
    \ difference between photos with one or two people in them. It had learned to\
    \ recognize photos with two people as “scissors.”"
