    \ simple chatbot\n\n    This script will ask you to type in a question and then\
    \ use the ML model you’ve trained to recognize what you asked.\n\n    Your script\
    \ should differ from mine, as mine has the questions about the moon that I trained\
    \ my ML model with. Be sure to use your question types instead.\n\n    You’ll\
    \ also need to put the answers to the questions on your topic here. If you don’t\
    \ know them, now’s the time to do some research to find the answers your chatbot\
    \ should give!\n\n5. Click `File`▶`Save to your computer` to save your project.\n\
    \n### Test Your Project\n\nClick the Green Flag and try asking your chatbot a\
    \ question. Does it give you the right answer?\n\n## Review and Improve Your Project\n\
    \nYou’ve created a simple chatbot that can recognize and answer the most common\
    \ questions about a topic of your choice. Well done!\n\nWhat could you do to improve\
    \ your chatbot?\n\n### Responding and Recording When Users Report Mistakes\n"
  trans: "\n如果你不想画图，可以点击`Choose a Backdrop`选择背景）或`Choose a Sprite`选择角色）来选择预设选项。或者，你可以点击`Upload\
    \ a Sprite`上传角色）或`Upload a Backdrop`上传背景）来使用你从网上保存的图片。例如，如果你正在为你喜欢的乐队创建一个聊天机器人，可以使用他们的照片。如果你正在为某个学校或公司创建一个聊天机器人，可以使用它的标志。\n\
    \n一旦创建了聊天机器人场景，请确保保存你的 Scratch 项目，因为你之后会需要它。如果你不知道如何操作，请阅读引言部分 xxiv 页的“保存你的工作”章节。\n\
    \n### 训练你的模型\n\n1. 创建一个新的 ML 项目，将其命名为 `Chatbot`，并将其设置为学习识别你所在语言的文本。\n\n2. 点击`Train`，如图\
    \ 11-4 所示。\n\n    ![图 11-4：训练是 ML 项目的第一阶段。](img/f11004.png)\n\n    图 11-4：训练是\
    \ ML 项目的第一阶段。\n\n3. 想想人们可能会针对你选择的主题提出的最常见的问题。\n\n    对于我的主题——月球，我猜人们会问月球有多大。\n\
    \n    选好第一个问题后，点击`Add new label`，如图 11-5 所示，并输入一个或两个代表该问题的词。例如，我使用 `size` 作为我的训练分类桶标签。\n\
    \n    ![图 11-5：创建一个桶来代表你第一个问题的示例。](img/f11005.png)\n\n    图 11-5：创建一个桶来代表你第一个问题的示例。\n\
    \n4. 点击`Add example`并输入一种提问该问题的方式，如图 11-6 所示。\n\n    ![图 11-6：添加以不同方式询问第一个问题的示例。](img/f11006.png)\n\
    \n    图 11-6：添加以不同方式询问第一个问题的示例。\n\n    思考不同的人在提问时可能会使用不同的措辞。你现在不需要担心答案。\n\n  \
    \  尽可能输入你想你想到的所有提问该问题的方式，确保你至少有五个示例。这些示例将用于训练 ML 模型，以识别有人是否在问这个问题。\n\n    如果你的聊天机器人看起来像你所提问的主题（比如我的卡通月球在回答关于月球的问题），那么你可以包含一些针对角色的示例问题，例如“你有多大？”。\n\
    \n5. 想想更多关于你主题的问题类型。再次点击`Add new label`为每种类型的问题创建一个训练桶，并点击`Add example`添加提问该问题的示例。与之前一样，每种类型的问题至少需要五个示例。\n\
    \n对于我的项目，我从四类问题开始，每个类型有五个示例（参见图 11-7）。你的项目将取决于你的主题以及你能想出的问题数量。\n\n    ![图 11-7：写出人们可能提出的不同类型问题的示例。](img/f11007.png)\n\
    \n    图 11-7：写出人们可能提出的不同类型问题的示例。\n\n    对于你的主题，你是在猜测哪些是最常见的问题，并想象人们提问题的不同方式。现实世界的\
    \ ML 项目通常从实际客户或用户那里收集这些示例，这样计算机就能学习人们实际上在问什么问题以及如何问。例如，一家训练虚拟助手回答电视设置问题的商店会记录客户过去拨打电话询问的问题。或者，一家训练虚拟助手回答储蓄账户问题的银行会记录客户在银行网站的聊天窗口中输入的问题。这两家公司都可以使用这些真实人物表述真实问题的示例来训练他们的\
    \ ML 模型。\n\n    我们在第 3 章中看到，当使用与项目所需相似的数据进行训练时，ML 模型会给出更好的答案。你学到，如果你想让 ML 模型识别不同动物的照片，你应该用照片来训练它；如果你想让它识别卡通，你就应该用卡通来训练它。\n\
    \n    文本 ML 模型的工作原理类似。当我们用真实人物提问的方式来训练它们时，它们会给出更好的答案。对于现实世界的 ML 项目，这最好的方法是找到现有的示例，而不是像我们为这个项目这样做那样编。\n\
    \n6. 点击屏幕左上角的`Back to project`。\n\n7. 点击`Learn & Test`，如图 11-8 所示。\n\n    ![图\
    \ 11-8：Learn & Test 是 ML 项目的第二阶段。](img/f11008_new.png)\n\n    图 11-8：Learn & Test\
    \ 是 ML 项目的第二阶段。\n\n8. 点击`Train new model`，如图 11-9 所示。\n\n### 准备你的项目\n\n现在你已经有了角色和\
    \ ML 模型，是时候将它们结合起来创建你的聊天机器人了。\n\n1. 点击屏幕左上角的`Back to project`。\n\n2. 点击`Make`，如图\
    \ 11-10 所示。\n\n    ![图 11-10：Make 是 ML 项目的第三阶段。](img/f11010.png)\n\n    图 11-10：Make\
    \ 是 ML 项目的第三阶段。\n\n### 点击`Scratch 3`，然后点击`Open in Scratch 3`。Scratch 将打开一组用于你项目的积块。\n\
    \n3. 点击`File`▶`Load from computer`，如图 11-11 所示，打开你之前保存的聊天机器人场景的项目。\n\n    ![图\
    \ 11-11：打开你之前创建的项目。](img/f11011.png)\n\n    图 11-11：打开你之前创建的项目。\n\n4. 复制图 11-12\
    \ 所示的脚本。\n\n    ![图 11-12：创建简单聊天机器人的脚本](img/f11012.png)\n\n    图 11-12：创建简单聊天机器人的脚本\n\
    \n    此脚本将要求你输入一个问题，然后使用你训练的 ML 模型来识别你问了什么。\n\n    你的脚本应该和我的不同，因为我的包含了我训练 ML 模型时关于月球的问题。确保使用你的问题类型。\n\
    \n    你还需要在这里放入关于你主题问题的答案。如果你不知道，现在是时候研究以找到聊天机器人应该给出的答案了！\n\n5. 点击`File`▶`Save\
    \ to your computer`保存你的项目。\n\n### 测试你的项目\n\n点击绿旗并尝试询问你的聊天机器人一个问题。它给出了正确的答案吗？\n"
