- raw: "AI systems cannot correctly understand everything, so you could improve your\
    \ ML project by training it to handle mistakes. A good way to handle mistakes\
    \ is to train your ML model to recognize when someone complains about the results\
    \ it gives.\n\nGo back to the Train phase and add a new training bucket called\
    \ `mistake`. Fill it with examples of how someone might complain that the ML model\
    \ got something wrong, as shown in [Figure 11-13](#c11.xhtml#figure11-13).\n\n\
    For example, you might add `That's not what I meant` to the mistake bucket.\n\n\
    ![Figure 11-13: Collect examples of how a user might complain about a mistake\
    \ the model makes.](image_fi/500563c11/f11013.png)\n\n[Figure 11-13:](#c11.xhtml#figureanchor11-13)\
    \ Collect examples of how a user might complain about a mistake the model makes.\n\
    \nOnce you’ve added at least five examples, you’ll need to return to the Learn\
    \ & Test phase to train a new ML model.\n\nWhen your chatbot recognizes that someone\
    \ complains, the simplest response it can give is to apologize to them. Update\
    \ your script as shown in [Figure 11-14](#c11.xhtml#figure11-14).\n\n ![Figure\
    \ 11-14: Update your script so that it apologizes if the user complains.](image_fi/500563c11/f11014_new.png)\n\
    \n[Figure 11-14:](#c11.xhtml#figureanchor11-14) Update your script so that it\
    \ apologizes if the user complains.\n\nYou can make your project even better by\
    \ keeping a record of the mistakes. For example, I created a new list called mistakes\
    \ (to do this, click **Variables** in the Toolbox, click **Make a List**, and\
    \ enter the name `mistakes`) and updated the script as shown in [Figure 11-15](#c11.xhtml#figure11-15)\
    \ so that if someone complains about the answer they get, their question is added\
    \ to the list.\n\n![Figure 11-15: Keep a record of questions that the chatbot\
    \ gets wrong.](image_fi/500563c11/f11015.png)\n\n[Figure 11-15:](#c11.xhtml#figureanchor11-15)\
    \ Keep a record of questions that the chatbot gets wrong.\n\nWhen I asked, “Who\
    \ was the first man on the moon?” my model told me how far the moon is from the\
    \ Earth. Then, when I replied with, “No, that isn’t what I asked for,” my question\
    \ about the first man on the moon was added to the mistakes list.\n\nTracking\
    \ mistakes is a common technique used to improve real-world ML projects. The list\
    \ of mistakes is used as a collection of examples to train the next version of\
    \ the ML model.\n\nWhat else could you do to improve your chatbot?\n\n### Recognizing\
    \ When a User Isn’t Happy\n\nYour chatbot users might not always tell you when\
    \ your ML system gets something wrong. So are there other ways that you can tell\
    \ when it makes mistakes?\n\nIn Chapter 7, you learned about training an ML model\
    \ to recognize tone and emotion in writing. You could combine that technique with\
    \ this project to make your chatbot recognize when users are getting angry or\
    \ annoyed.\n\nTrain two ML models: one to recognize the meaning of questions (as\
    \ you’ve just done) and the other to recognize emotion (such as “annoyed” and\
    \ “not annoyed,” similar to your project in Chapter 7). If the second ML model\
    \ has a high degree of confidence that the user sounds annoyed, your chatbot should\
    \ apologize instead of trying to answer the question again.\n\nDetecting the user’s\
    \ tone, and apologizing when necessary, is a common technique used for chatbots\
    \ that communicate with members of the public, such as for customer service. People\
    \ can get annoyed if some technology consistently misunderstands them. If systems\
    \ can recognize when things are going badly and apologize, the customer may be\
    \ happier. In such cases, these systems will also commonly call for a human customer\
    \ service representative or manager to join the conversation and help.\n\nIs there\
    \ anything else you could do to improve your project?\n\n### Answering Only When\
    \ the ML Model Is Confident\n\nRecognizing when the user is annoyed is a good\
    \ thing. But it’s often better to avoid annoying the user in the first place!\
    \ You can use the confidence score to prevent your chatbot from giving wrong answers.\n\
    \nYou learned in Chapter 7 that the confidence score is a percentage returned\
    \ by an ML model that shows how confident the model is that it has correctly recognized\
    \ whatever it’s been trained on.\n\nIn this project, if the confidence score is\
    \ low, it means the ML model isn’t sure that it understood the question. You could\
    \ modify your chatbot code as shown in [Figure 11-16](#c11.xhtml#figure11-16)\
    \ so that if the model doesn’t understand the question, the chatbot apologizes\
    \ rather than simply guessing the answer, and the question gets added to the list\
    \ of examples to train the model with in the future.\n\n![Figure 11-16: Handle\
    \ low confidence scores by recording the questions to use in future training.](image_fi/500563c11/f11016.png)\n\
    \n[Figure 11-16:](#c11.xhtml#figureanchor11-16) Handle low confidence scores by\
    \ recording the questions to use in future training.\n\n## ML and Ethics\n\nThese\
    \ suggestions for improving your project are based on common real-world approaches\
    \ to ML projects. As you’ve seen, collecting training data takes a lot of time\
    \ and effort. To save time, some companies using ML collect just enough training\
    \ examples to make an ML model basically work, and then allow their customers\
    \ to start using it (sometimes describing it as a*beta* to explain why it still\
    \ gets some things wrong). Then they collect poor experiences their customers\
    \ have with their ML model so that they can improve their training data. This\
    \ might mean collecting examples of customer questions that the ML model had a\
    \ low confidence score in, or where the customer reported that the answer was\
    \ unhelpful. The company then reviews these customer questions and sorts them\
    \ into the right training buckets.\n\nCompanies say they do this because it means\
    \ their ML model will do a better job of answering questions in the future. The\
    \ more representative they make the training examples they use, the better answers\
    \ their system can give. But sometimes this surprises people who don’t realize\
    \ that questions they ask their smart devices can be recorded by the device’s\
    \ manufacturer. Try searching the web for news stories about the maker of your\
    \ favorite smart device listening to what people ask the device. How many articles\
    \ can you find? What do you think of these reactions?\n\nWhat do you think this\
    \ means for the responsibilities of the people who create ML systems? Do you think\
    \ it’s ethical for ML developers to collect training examples from their customers\
    \ or users? Do you think they should tell users that this is happening? And how\
    \ would you explain it to users who might not realize what training examples are,\
    \ or why they’re so important for training ML systems?\n\n## What You Learned\n\
    \nIn this chapter, you learned that ML models can be trained to understand and\
    \ respond to questions people ask. You learned the differences between question\
    \ answering (QA) systems and their simpler counterpart, chatbots. You then designed\
    \ a custom chatbot and trained an ML model to recognize the most common questions\
    \ about a topic of your choosing. You saw a few different ways you could extend\
    \ your chatbot to improve its performance and accuracy, such as by tracking mistakes,\
    \ responding appropriately to customers’ feedback and tone, and using the confidence\
    \ score to decide when a question should be directed to a person (for example,\
    \ in a customer service setting). Finally, you learned about some of the ethical\
    \ questions to consider when training ML models with feedback from real people.\n\
    \nIn the next chapter, we’ll switch gears and train an ML model for the first\
    \ time to recognize numbers in a simplified version of the video game *Pac-Man*.\n\
    \n![](image_fi/book_art/chapterart.png)\n\n# 12  \n\nAvoiding the Monster"
