    \n    [Figure 14-3:](#c14.xhtml#figureanchor14-3) Click **Train** to prepare your\
    \ training buckets.\n\n3.  Click **Add new label** and create two training buckets,\
    \ as shown in [Figure 14-4](#c14.xhtml#figure14-4). Name them after the two objects\
    \ that you have chosen. (The name you choose won’t have any effect on the training,\
    \ but it’s useful for you.) I named mine grapefruit and lemon.\n\n    ![Figure\
    \ 14-4: Prepare two training buckets for your objects.](image_fi/500563c14/f14004.png)\n\
    \n    [Figure 14-4:](#c14.xhtml#figureanchor14-4) Prepare two training buckets\
    \ for your objects.\n\n4.  Add the training images to your training buckets. To\
    \ do so, arrange two browser windows side by side, as shown in [Figure 14-5](#c14.xhtml#figure14-5).\
    \ One should have your training buckets, and the other should have the photo sharing\
    \ website with your photographs.\n\n    Drag the images from the photo sharing\
    \ site and drop them into the appropriate training bucket.\n\n    ![Figure 14-5:\
    \ Arrange two browser windows side by side and drag the photos into your training\
    \ buckets.](image_fi/500563c14/f14005.png)\n\n    [Figure 14-5:](#c14.xhtml#figureanchor14-5)\
    \ Arrange two browser windows side by side and drag the photos into your training\
    \ buckets.\n\n5.  Repeat step 4 until you’ve got all 20 photos in your training\
    \ buckets, as shown in [Figure 14-6](#c14.xhtml#figure14-6).\n\n    ![Figure 14-6:\
    \ Drag all of your photos into the training buckets.](image_fi/500563c14/f14006.png)\n\
    \n    [Figure 14-6:](#c14.xhtml#figureanchor14-6) Drag all of your photos into\
    \ the training buckets.\n\n6.  Click **Back to project** in the top-left corner\
    \ of the screen.\n\n7.  Click **Learn & Test**.\n\n8.  Click **Train new machine\
    \ learning model**, as shown in [Figure 14-7](#c14.xhtml#figure14-7).\n\n![Figure\
    \ 14-7: Start training an ML model.](image_fi/500563c14/f14007.png)\n\n[Figure\
    \ 14-7:](#c14.xhtml#figureanchor14-7) Start training an ML model.\n\nIt will take\
    \ a few minutes for your ML model to train. While you’re waiting, continue to\
    \ the next step to prepare your project.\n\n### Prepare Your Project\n\nTake another\
    \ photograph of each of your two objects, *but this time, switch the backgrounds*.\n\
    \nIn other words, take a photo of the first object where you took the photos of\
    \ the second object before. Take a photo of the second object where you took the\
    \ photos of the first object before.\n\nFor me, that meant taking a photo of the\
    \ lemon on a dark wooden floor, and a photo of the grapefruit on a brightly lit\
    \ cream carpet. Compare the test photos I took in [Figure 14-8](#c14.xhtml#figure14-8)\
    \ with the training photos in Figures [14-1](#c14.xhtml#figure14-1) and [14-2](#c14.xhtml#figure14-2).\n\
    \n![Figure 14-8: Swap the backgrounds for your test photos.](image_fi/500563c14/f14008.png)\n\
    \n[Figure 14-8:](#c14.xhtml#figureanchor14-8) Swap the backgrounds for your test\
    \ photos.\n\nYou don’t need to upload these photos anywhere. You just need access\
    \ to them on your computer to be able to use them for testing.\n\n1.  Click **Back\
    \ to project** and then click **Make**, as shown in [Figure 14-9](#c14.xhtml#figure14-9).\n\
    \n    ![Figure 14-9: Time to make your test!](image_fi/500563c14/f14009.png)\n\
    \n    [Figure 14-9:](#c14.xhtml#figureanchor14-9) Time to make your test!\n\n\
    2.  Click **Scratch 3**, as shown in [Figure 14-10](#c14.xhtml#figure14-10).\n\
    \n    ![Figure 14-10: Click Scratch 3 to test your model.](image_fi/500563c14/f14010.png)\n\
    \n    [Figure 14-10:](#c14.xhtml#figureanchor14-10) Click **Scratch 3** to test\
    \ your model.\n\n3.  Click **Open in Scratch 3**.\n\n4.  Move your mouse pointer\
    \ over the Choose a Sprite icon (the cat face) in the bottom-right corner. Click\
    \ **Upload Sprite** as shown in [Figure 14-11](#c14.xhtml#figure14-11). Upload\
    \ one of your two new test photos.\n\n    ![Figure 14-11: Upload a new sprite.](image_fi/500563c14/f14011.png)\n\
    \n    [Figure 14-11:](#c14.xhtml#figureanchor14-11) Upload a new sprite.\n\n5.\
    \  Copy the script shown in [Figure 14-12](#c14.xhtml#figure14-12). This script\
    \ tries to recognize the sprite costume image and displays what your ML model\
    \ recognizes the photo as. \n\n    ![Figure 14-12: Write a short test script.](image_fi/500563c14/f14012.png)\n\
    \n    [Figure 14-12:](#c14.xhtml#figureanchor14-12) Write a short test script.\n\
    \n6.  Click **Upload Sprite** again to upload your second test photograph. Create\
    \ the same script as before for your second sprite, as shown in [Figure 14-13](#c14.xhtml#figure14-13).\n\
    \n![Figure 14-13: Upload a second sprite and add another test script.](image_fi/500563c14/f14013.png)\n\
    \n[Figure 14-13:](#c14.xhtml#figureanchor14-13) Upload a second sprite and add\
    \ another test script.\n\n### Test Your Project\n\nIt’s time to run your test!\
    \ Your scripts should classify both of your new test photos and display what your\
    \ ML model recognized them as. Click the Green Flag to test your ML model.\n\n\
    My results are shown in [Figure 14-14](#c14.xhtml#figure14-14).\n\nAs you may\
    \ have expected, your ML model probably gave the wrong answer.\n\n ![Figure 14-14:\
    \ Test results for my ML model](image_fi/500563c14/f14014.png)\n\n[Figure 14-14:](#c14.xhtml#figureanchor14-14)\
    \ Test results for my ML model\n\nI trained an ML model with state-of-the-art\
    \ advanced technology, but it couldn’t tell the difference between a lemon and\
    \ a grapefruit—something that a person can do easily.\n\nWhy do you think it went\
    \ so wrong?\n\n## Review and Fix Your Project\n\nThere are several reasons why\
    \ my ML model gave the wrong answer.\n\nThink about the area taken up in the photos.\
    \ The object made up about 5 percent of the overall area of my photos. About 95\
    \ percent of each photo was the background, as shown in [Figure 14-15](#c14.xhtml#figure14-15).\n\
    \n![Figure 14-15: Most of my photos were background.](image_fi/500563c14/f14015.png)\n\
    \n[Figure 14-15:](#c14.xhtml#figureanchor14-15) Most of my photos were background.\n\
    \nWhen you collect training examples to create an ML model, you’re asking the\
    \ computer to identify what those examples have in common so that it can recognize\
    \ when it’s given something with similar characteristics in the future.\n\nWhen\
    \ I tested my model with the photo of a lemon, 95 percent of the photo was very,\
    \ very similar to 95 percent of all of the training photos of grapefruits in [Figure\
    \ 14-1](#c14.xhtml#figure14-1). There was nothing in the way that we trained the\
    \ ML model to make it clear that the part we were interested in was just that\
    \ 5 percent of the photo in the middle, not the rest.\n\nWhen you look at the\
    \ training photos and the test photos side by side, you can see why the model\
    \ made the choice it did.\n\n![Figure 14-16: Compare the test and training photos\
    \ to understand why the ML model was wrong.](image_fi/500563c14/f14016.png)\n\n\
    [Figure 14-16:](#c14.xhtml#figureanchor14-16) Compare the test and training photos\
    \ to understand why the ML model was wrong.\n\nTaking the photos as a whole, the\
    \ largest part of my test photo (on the right of [Figure 14-16](#c14.xhtml#figure14-16))\
    \ is very similar to the largest part of every training photo I had labeled as\
    \ “grapefruit.”\n\nML systems are designed to identify and recognize patterns\
    \ in the examples you give them—but *these won’t necessarily be the patterns that\
    \ you intended or that you would’ve recognized*.\n\nCan you think of a way to\
    \ fix your project?\n\nThere are several things you could do. For example, if\
    \ your object made up a much more significant proportion of the overall image,\
    \ as shown in [Figure 14-17](#c14.xhtml#figure14-17), that might help.\n\n ![Figure\
    \ 14-17: Try making your object larger in the photos.](image_fi/500563c14/f14017.png)\n\
    \n[Figure 14-17:](#c14.xhtml#figureanchor14-17) Try making your object larger\
    \ in the photos.\n\nBut this solution would be useful only for projects where\
    \ you could be sure that all test images would show a similarly large object."
