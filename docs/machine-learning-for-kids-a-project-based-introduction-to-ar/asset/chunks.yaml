    You also saw the importance of having lots of training examples to improve your
    ML model’s performance over time. Because the training set is updated with the
    winner’s moves after each game, the model gradually gets better and more difficult
    to beat. You learned that it can be useful to crowdsource, or share the work of
    training the model across a large group of people, to save yourself some time
    and effort.


    In the next chapter, you’ll start to learn about how ML projects can go wrong.


    ![](image_fi/book_art/chapterart.png)


    # 14 Confusing the Computer


    ![Alphabet-U](image_fi/book_art/Alphabet-U.png)ntil now, we’ve been focused on
    the great things that we can do using ML, and on the ways that it is being used
    well in real-world applications. But, as you’ve seen throughout this book, ML
    systems are not perfect or all-knowing. Their behavior is determined by the training
    that we give them. The way that we train our ML systems will affect the responses
    that they give, and not always in a positive way. In this chapter, we’ll look
    at one of the most common challenges in creating AI systems: `bias`.


    The project in this chapter is based on an old story, sometimes described as the
    `Russian Tank problem`, that is often told to AI students. It’s probably not true,
    but it illustrates the impact of bias in ML training sets.


    Here’s one example of how the story is told:


    > Once upon a time, the US Army decided to use ML to recognize tanks hiding behind
    trees in the woods. Researchers trained an ML model using photos of woods without
    tanks, and photos of the same woods with tanks hiding behind trees.


    > The model seemed to do well with the researchers’ pictures, but when the US
    Army tested their system, it didn’t do any better than random guesses.


    > It turned out that in the researchers’ training data, the photos of camouflaged
    tanks had been taken on a cloudy day, while photos of the plain forest had been
    taken on a sunny day. The ML model had learned to recognize cloudy days from sunny
    days, instead of recognizing camouflaged tanks.


    Here’s another version:


    > Once upon a time, the US Army tried training a computer to recognize the difference
    between Russian and American tanks. Researchers trained an ML model using photos
    they took of American tanks and spy photos they collected of Russian tanks.


    > The model seemed to do well with the researchers’ pictures, but when the US
    Army tested their system, the ML model didn’t do any better than random guesses.


    > It turned out that the researchers’ photos of American tanks were large, high
    resolution, and high quality. But the long-distance spy photos they were able
    to get were grainy.


    > The ML model had learned to recognize high-quality photos from grainy photos,
    instead of recognizing Russian and American tanks.


    The point is that, if the training data is biased, the ML model will be biased
    too. In this chapter, we’ll look at how bias can enter ML systems and how we can
    avoid it.

    '
  trans: '

    在本章中，你已经了解到井字棋（Tic Tac Toe，或 Noughts and Crosses）几十年来一直帮助人们理解机器学习（ML）。你训练了一个机器学习模型来识别数字，并构建了一个带有编号单元的井字棋盘，每个单元代表每一步移动。这个项目基于英国人工智能研究人员唐纳德·米奇（Donald
    Michie）在 1960 年的工作，他在 MENACE 项目中使用了火柴盒和玻璃珠。每个火柴盒代表游戏棋盘的一种可能状态，类似于你在训练数据中收集的示例。火柴盒中玻璃珠的数量就像一个示例在某个训练桶中出现的次数。


    你还看到了大量的训练示例对于随着时间推移提高机器学习模型性能的重要性。由于训练集在每局游戏后都会根据胜者的移动进行更新，模型会逐渐变得更好，并且更难战胜。你还了解到，通过众包（或将模型训练的工作分享给大量人员）可能有助于节省自己的时间和精力。


    在下一章中，你将开始学习机器学习项目可能会出现问题。


    ![](img/chapterart.png)


    # 14 误导计算机


    ![Alphabet-U](img/Alphabet-U.png)到目前为止，我们一直关注利用机器学习可以做的伟大事情，以及它在现实应用中被良好使用。但正如你在整本书中所看到的，机器学习系统并不是完美的，也不是无所不知的。它们的行为取决于我们给它们的训练。我们训练机器学习系统的方式会影响它们给出的响应，而且并不总是以积极的方式。在本章中，我们将研究创建人工智能系统面临的最常见挑战之一：`bias`（偏差）。


    本章的项目基于一个老故事，有时被称为`俄罗斯坦克问题`，这个故事经常被讲给 AI 专业学生听。它可能不是真的，但它说明了偏差在机器学习训练集中的影响。


    以下是该故事的一种讲述方式：


    > 从以前，美军决定使用机器学习来识别躲在森林树木后的坦克。研究人员使用不含坦克的森林照片，以及在同一片森林中树木后隐藏坦克的照片来训练了一个机器学习模型。


    > 该模型在研究人员提供的照片上表现良好，但当美军测试他们的系统时，它的表现并不比随机猜测好。


    > 结果证明，在研究人员的训练数据中，伪装坦克的照片是在阴天拍摄的，而普通森林的照片是在晴天拍摄的。机器学习模型学会了如何从晴天照片中识别阴天，而不是识别伪装坦克。


    这是另一个版本：


    > 从以前，美军曾尝试训练一台计算机来识别俄罗斯坦克和美国坦克之间的区别。研究人员使用他们拍摄的美国坦克照片和收集的俄罗斯坦克间谍照片来训练了一个机器学习模型。


    > 该模型在研究人员提供的照片上表现良好，但当美军测试他们的系统时，机器学习模型的表现并不比随机猜测好。


    > 结果证明，研究人员拍摄的美国坦克照片是大尺寸、高分辨率和高质量的。但他们获取的远距离间谍照片是有颗粒感的（grainy）。


    > 机器学习模型学会了如何从有颗粒感的照片中识别高质量照片，而不是识别俄罗斯坦克和美国坦克。


    点在于，如果训练数据是有偏差的，机器学习模型也会是有偏差的。在本章中，我们将研究偏差是如何进入机器学习系统的，以及我们如何避免它。


