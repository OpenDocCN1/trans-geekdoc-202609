    \ for the second newspaper sprite.\n    ![Figure 8-16: First test for the Newspapers\
    \ project.](image_fi/500563c08/f0816.png)\n    [Figure 8-16:](#c08.xhtml#figureanchor8-16)\
    \ First test for the Newspapers project.\n"
  trans: "\n\n-   使用的词汇类型是否存在模式？例如，某一组是否使用了更简单的语言或更短的单词？某一组是否使用了更多感性的词汇？\n\n尝试猜想，你的\
    \ ML 模型可能会从你提供的训练示例中学习到什么种类的模式。\n\n### 准备你的项目\n\n在你目前为止完成的项目中，你已经通过尝试运行来测试了你的\
    \ ML 模型。在本章中，你将看到现实世界中正式测试 ML 项目的几种方法。\n\n1. 点击屏幕左上角的 `Back to project`（返回项目）。\n\
    2. 点击 `Make`（制作）。\n3. 点击 `Scratch 3`，然后点击 `Open in Scratch 3` 打开一个带有 Scratch 的新窗口。\n\
    4. 从角色列表中删除 `Sprite1` 猫咪角色，因为你不需要它。点击它右上角的垃圾桶图标。现在 `Costumes`（造型）标签应该被 `Backdrops`（背景）标签取代。\n\
    5. 点击 `Backdrops` 标签，并绘制一个背景，将你的 Scratch 项目分为两部分，如图图 8-8 所示。\n   - 上半部分将用于匹配你训练\
    \ ML 模型识别内容的报纸。\n   - 下半部分将用于不匹配你训练 ML 模型识别内容的报纸。\n   - 为每个部分选择一种颜色。我在上半部分使用了红色，在下半部分使用了蓝色。\n\
    \   - 在两部分之间画一条线以划分空间。\n   - 你最终得到的应该像图 8-8 所示。\n6. 通过将鼠标指针悬停在屏幕右下角的 `Choose a\
    \ Sprite`（选择角色）图标（猫脸）上来添加一个角色。此角色将代表你的 ML 模型应该识别的报纸标题，因此在画布上方 `Costume` 文本字段和右下角的\
    \ `Sprite` 文本字段中为它起一个合适的名称。\n   - 要画你自己的报纸，选择 `Paint`（画画）。\n   - 要上传保存到电脑上的报纸图片，点击\
    \ `Upload Sprite`（上传角色）。\n   ![图 8-8：为“报纸”项目准备背景。](img/f0808.png)\n   图 8-8： 为“报纸”项目准备背景。\n\
    7. 点击 `Costumes` 标签，并使用绘画工具为报纸上，使其与背景的上半部分匹配。\n   - 对于我的项目，我画了一个红色的报纸角色来代表小报的标题，并将其命名为\
    \ `tabloid`，如图图 8-9 所示。\n   ![图 8-9：画第一个报纸角色。](img/f009.png)\n   图 8-9： 画第一个报纸角色。\n\
    8. 点击 `Code`（代码）标签，在工具箱中点击 `Variables`（变量），然后点击 `Make a List`（创建列表），如图图 8-10 所示。\n\
    \   - 确保选择了 `for all sprites`（适用于所有角色），并根据你训练 ML 模型识别的内容为列表命名。\n   - 对于我的项目，我创建了一个名为\
    \ `tabloid headlines` 的列表。\n   ![图 8-10：为第一组标题创建列表。](img/f0810.png)\n   图 8-10：\
    \ 为第一组标题创建列表。\n9. 在列表中输入至少 10 个示例，如图图 8-11 所示。\n   - 点击列表左下角的加号按钮添加新行。\n   - 你可以拖动右下角的等号使列表变宽，这可以让你更容易看到你正在输入的内容。\n\
    \   - 你输入此列表的文本应该是报纸标题或文章的示例，符合你训练 ML 模型识别的内容。\n   - 重要的是，这些必须是你没有在训练示例中使用过的新标题。这些应该是应该是计算机以前没见过的标题，这样你才能正确测试它是否能够识别新标题，而不仅仅是记住它们。\n\
    \   - 当你完成在列表中输入测试标题后，取消勾选工具箱中的列表，以从舞台上隐藏它。\n   ![图 8-11：第一组的测试示例。](img/f0811.png)\n\
    \   图 8-11： 第一组的测试示例。\n10. 点击 `Code` 标签并复制图 8-12 所示的脚本。\n    将 `tabloid` 模块替换为你项目中训练计算机识别的任何标签。\n\
    \    ![图 8-12：“报纸”项目的第一段代码脚本。](img/f0812.png)\n    图 8-12： “报纸”项目的第一段代码脚本。\n \
    \   - 此脚本将遍历我的每个 `tabloid headlines`，如果 ML 模型将其识别为小报标题，它将该标题移动到屏幕的上半部分。否则，它将标题移动到屏幕的下半部分。\n\
    \    - 你在第 3 章做过类似的事情，当时根据 ML 模型识别角色的外观对动物角色进行排序。这一次，你根据 ML 模型识别你列表中的某些文本对角色进行排序。\n\
    11. 点击 `Green Flag`（绿色旗帜）并观察你的脚本运行。\n    - 你的 ML 模型表现如何？它可能会错一些答案，但希望它能答对大部分。你可以从图\
    \ 8-13 中看到我的 ML 模型的性能。\n    ![图 8-13：“报纸”项目的第一次测试。](img/f0813.png)\n    图 8-13：\
    \ “报纸”项目的第一次测试。\n    - 但你无法从这组报纸中判断我的 ML 模型是否能够区分小报标题和其他标题。\n12. 按照第 6 步的说明创建一个角色，这次代表应该放在背景下半部分的标题/文章。\n\
    \    - 将角色涂成与你为屏幕下半部分选择的颜色相同，并命名为你训练模型识别的内容。\n    - 对于我的项目，我画了一个蓝色的报纸角色来代表宽报标题，并将其命名为\
    \ `broadsheet`，如图图 8-14 所示。\n    ![图 8-14：“报纸”项目的第二个角色。](img/f0814.png)\n    图\
    \ 8-14： “报纸”项目的第二个角色。\n13. 在 `Code` 标签上，在工具箱中点击 `Variables` 然后点击 `Make a List`。在此列表中填充\
    \ 10 个应该放在背景下半部分的示例。\n    - 像之前一样，确保选择了 `for all sprites` 并根据你的第二组为列表命名。\n   \
    \ - 对于我的项目，我创建了一个名为 `broadsheet headlines` 的列表，并在其中填充了 10 个宽报标题示例，如图图 8-15 所示。\n\
    \    - 当你在列表中输入测试标题后，取消勾选工具箱中的列表，以从舞台上隐藏列表。\n14. 通过点击第二个角色，在工具箱中点击 `Variables`\
    \ 并点击 `Make a Variable` 来计算这些标题。为你的第二组命名变量。\n    - 对于我的项目，我创建了一个名为 `my broadsheet\
    \ variable` 的变量，如图图 8-15 所示。\n    ![图 8-15：为第二组报纸准备数据。](img/f0815.png)\n    图\
    \ 8-15： 为第二组报纸准备数据。\n15. 为第二个报纸角色复制图 8-16 所示的脚本。\n    ![图 8-16：“报纸”项目的第一次测试。](img/f0816.png)\n\
    \    图 8-16： “报纸”项目的第一次测试。\n\n"
