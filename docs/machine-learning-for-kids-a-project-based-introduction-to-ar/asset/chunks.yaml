    ### Training a model


    How long this process takes depends on the type of project and the number of examples
    you’ve collected. Image projects take longer than text (it’s much harder for computers
    to understand images than text). The more examples you have, the longer training
    will take. And sometimes the ML server will be busy and take a little longer.


    The training process might take 30 seconds, or it might take a few minutes. Please
    be patient! There’s a quiz at the bottom of the page while you wait. If you haven’t
