  trans: "\n\n图 9-6 训练是 ML 项目的第一阶段。\n\n3. 点击 `Add new label`（添加新标签），如图图 9-7\n\n  \
    \ 图 9-7 为鸭子图片示例创建训练桶。\n\n4. 再次点击`Add new label`并将此桶命名为 `Not the Duck`（不是鸭子），如图图\
    \ 9-8\n\n   图 9-8 为非鸭子图片示例创建训练桶。\n\n5. 点击屏幕左上角的`Back to project`（返回项目）。\n\n6.\
    \ 点击`Make`（制作）。\n\n7. 点击`Scratch 3`，如图图 9-9\n\n   图 9-9 点击 `Scratch 3`。\n\n  \
    \ 你会看到一个警告，提示你还没有 ML 模型。没关系，因为你将使用 Scratch 来收集训练示例。\n\n8. 点击`straight into Scratch`（直接进入\
    \ Scratch），如图图 9-10\n\n   图 9-10 点击 `straight into Scratch` 在不带 ML 模型的情况下打开 Scratch。\n\
    \n9. 点击顶部菜单中的`Project templates`（项目模板）。然后从显示的模板列表中点击`Find the duck`（寻找鸭子）。\n\n\
    \   该项目有 12 个角色在舞台（Stage）上排列成 3×4 的网格。当你第一次加载模板时，这些角色是隐藏的，但它们的名称如图图 9-11\n\n \
    \  图 9-11 Find the duck 模板中的角色。\n\n10. 点击右下角角色列表中的 `0,0` 角色。在代码区（Code Area）左上方，黄色黄色的\
    \ TRAINING 注释下方，找到 `store training data example of the duck` 和 `store training\
    \ data example of NOT the duck` 块，如图图 9-12\n\n    图 9-12 寻找 `0,0` 角色的脚本块。\n\n\
    11. 点击左侧工具箱（Toolbox）中的`Find the duck` 组，向两个脚本都添加`add training data` 块。然后，从`Images`\
    \ 组将`backdrop image` 块拖入两个 `add training data` 块中，如图图 9-13\n\n    图 9-13 向两个训练桶添加训练示例。\n\
    \n12. 对所有 12 个角色重复步骤 11（参见图 9-14）。一旦完成，你点击的任何磁格都可以用于向你的训练数据添加示例。\n\n    ![图 9-14：为所有\
    \ 12 个角色添加脚本块。](img/f09014.png)\n\n    图 9-14 为所有 12 个角色添加脚本块。\n\n13. 是时候收集你的训练示例了！点击绿旗开始。当项目询问你是想\
    \ Train（训练）还是 Test（测试）时，点击`Train`。\n\n    当被要求点击鸭子时，点击`OK`，然后点击带有鸭子的磁格。你点击的磁格将被添加到你的\
    \ Duck 训练桶中，如图图 9-15\n\n    图 9-15 向训练数据添加鸭子示例\n\n15. 在 Machine Learning for Kids\
    \ 网站上，点击`Back to project`（返回项目），然后点击`Train`（训练）以确保一切运行正常。你应该能看到你点击的两个磁格，如图图 9-16\n\
    \n    图 9-16 训练阶段的训练示例。\n\n16. 重复步骤 13-15，直到你的每个桶中都有 10 个示例，如图图 9-17 所示。\n\n \
    \   这里有几个训练技巧：\n    - 确保不要点击 `Not the Duck` 桶。\n    - 第二，尝试包含所有没有鸭子的磁格。\n\n  \
    \  ![图 9-17：鸭子训练数据。](img/f09017.png)\n\n    图 9-17 子训练数据\n\n17. 点击`Back to project`（返回项目），然后点击`Train\
    \ & Test`（训练与测试）。训练模型，如图图 9-18 所示。这可能需要几分钟。\n\n    ![图 9-18：使用示例训练模型。](img/f09018.png)\n\
    \n    图 9-18 使用示例训练模型\n\n### 准备你的项目\n\n接下来，你需要修改 Scratch 项目以完成测试。\n\n1. 点击右下角角色列表中的\
    \ `0,0` 角色，在代码区找到`when receive test-0` 脚本。它在你之前过的脚本右侧，如图图 9-19 所示。\n\n   ![图 9-19：0,0\
    \ 角色的测试脚本。](img/f09019.png)\n\n   图 9-19 0,0 角色的测试脚本。\n\n2. 在`when receive test-0`\
    \ 脚本中，从`Find the duck` 组拖入一个`recognise image (label)`（识别图像（标签）））块，并如图图 9-20 所示进行更新。\n\
    \n   此脚本将使用你的 ML 模型来测试左下角的磁格是否包含鸭子，如果是，则显示消息“在这里吗？”\n\n   ![图 9-20：使用模型更新测试脚本。](img/f09020.png)\n\
    \n   图 9-20 使用模型更新测试脚本\n\n3. 对所有 12 个角色重复步骤 2（参见图 9-21）。一旦完成，你的 ML 模型就可以就可以检查所有的磁格来寻找鸭子了。\n\
    \n   ![图 9-21：为所有 12 个角色添加测试块。](img/f09021.png)\n\n   图 9-21 为所有 12 个角色添加测试块\n\
    \n### 测试你的项目\n\n是时候测试你的 ML 模型了！\n\n1. 点击绿旗，然后在舞台上的 Scratch 项目上点击`Test`（测试）。\n\n\
    \   你的项目将使用你的 ML 模型测试每个磁格，并高亮任何它识别为鸭子的磁格，如图图 9-22 所示。\n\n"
