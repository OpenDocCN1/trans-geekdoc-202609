- raw: "18.  Click the next genre button sprite and copy the same scripts from step\
    \ 17, as shown in [Figure 5-21](#c05.xhtml#figure5-21). As before, match the genre\
    \ to the label on the button. For my project, the second button was for family\
    \ movies.\n\n     ![Figure 5-21: Code for the second genre button](image_fi/500563c05/f05021.png)\n\
    \n     [Figure 5-21:](#c05.xhtml#figureanchor5-21) Code for the second genre button\n\
    \n19.  Repeat step 17 until all of your genre buttons have a copy of the script,\
    \ as shown in [Figure 5-22](#c05.xhtml#figure5-22).\n\n     ![Figure 5-22: Every\
    \ genre button needs a copy of the script.](image_fi/500563c05/f05022.png)\n\n\
    \     [Figure 5-22:](#c05.xhtml#figureanchor5-22) Every genre button needs a copy\
    \ of the script.\n\nNow it’s time to test your ML project!\n\n### Test Your Model\n\
    \nTry to find someone else to test your ML project, since it’s better for the\
    \ person testing the project to not have seen the test pictures that you downloaded.\n\
    \nOnce they click the Green Flag, Scratch will show them each test picture and\
    \ ask them to decide what genre they think the work of art is. Your Scratch code\
    \ will keep a count of how many times they agree with your ML model and how many\
    \ times they disagree, as shown in [Figure 5-23](#c05.xhtml#figure5-23).\n\n![Figure\
    \ 5-23: Testing your ML model](image_fi/500563c05/f05023.png)\n\n[Figure 5-23:](#c05.xhtml#figureanchor5-23)\
    \ Testing your ML model\n\nAsk whoever tests your project to use *only* the picture\
    \ to decide what to click, even if they recognize the work of art and know something\
    \ about it already.\n\n## Review and Improve Your Project\n\nIn this project,\
    \ you trained an ML model to recognize the visual styles that are commonly found\
    \ in images from different genres.\n\nIf your ML model performed badly, with a\
    \ lot more disagrees than agrees, try adding more examples to your training buckets\
    \ in the Train phase and then training a new ML model with them in the Learn &\
    \ Test phase. In general, the more training examples an ML model has to learn\
    \ from, the better the results.\n\n## What You Learned\n\nIn this chapter, you\
    \ trained another ML model to recognize pictures. In the previous two chapters,\
    \ you trained image recognition systems to recognize objects in a picture. This\
    \ time, you used one to recognize the style, not the subject, of a picture.\n\n\
    You also saw that one way we commonly measure the effectiveness of an ML system\
    \ is to compare the answers that it gives to test questions with the answers people\
    \ give.\n\nIn the next chapter, you’ll learn about another useful image recognition\
    \ application: handwriting recognition.\n\n![](image_fi/book_art/chapterart.png)\n\
    \n# 6  \n\nMail Sorting\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)n the\
    \ last few chapters, you’ve been training a computer to recognize images. There\
    \ are lots of useful jobs that computers can help us do if they know how to see.\
    \ One such job, *optical character recognition* *(OCR)*, is when a computer is\
    \ able to recognize a picture of a letter or number after it has seen lots of\
    \ examples of that character.\n\nA computer trained to do OCR can read the printed\
    \ words in newspapers and books.\n\nWhen combined with a text-to-speech system\
    \ that can read the recognized words out loud, OCR is used to help visually impaired\
    \ people read text that they might not be able to see for themselves.\n\nHistorians,\
    \ librarians, and archivists use OCR to study historical books and printed documents.\
    \ ML makes it possible to search through publications going back hundreds of years,\
    \ because OCR can recognize the words.\n\nOn our roads, OCR systems recognize\
    \ letters and numbers on license plates. *Automatic number plate recognition*\
    \ *(ANPR)* is used to keep traffic flowing by enabling fast and efficient tolls\
    \ and to improve road safety by recognizing when a car is driving too fast as\
    \ it passes a checkpoint.\n\nBusinesses use OCR to help process forms and documents.\
    \ If you fill in a form or write a check, an ML system will often use OCR to automatically\
    \ recognize what you’ve written.\n\nIf you’ve traveled abroad, you may have used\
    \ translation apps. You can point a smartphone at a sign or menu in a foreign\
    \ language and have the phone translate that into your own language. OCR is used\
    \ to recognize the words and letters in the picture.\n\nOne common use of OCR\
    \ is to help sort mail, which is what we’ll do in this chapter. You’ll train a\
    \ computer to recognize handwriting and see how OCR can be used to quickly sort\
    \ letters. You’ll create a mail sorting office in Scratch that can automatically\
    \ sort letters by recognizing the postcode written on the envelope (see [Figure\
    \ 6-1](#c06.xhtml#figure6-1)).\n\nLet’s get started!\n\n![Figure 6-1: Sorting\
    \ letters by recognizing the postcode](image_fi/500563c06/f06001.png)\n\n[Figure\
    \ 6-1:](#c06.xhtml#figureanchor6-1) Sorting letters by recognizing the postcode\n\
    \n## Build Your Project\n\nFirst, choose three big cities that you want your sorting\
    \ office to be able to recognize letters for.\n\nFor my screenshots, I chose three\
    \ cities in the UK: Edinburgh, Oxford, and Southampton.\n\nNext, you need to choose\
    \ some codes that can be used to identify those cities. In the UK, where I live,\
    \ these are called *postcodes*. (In the United States, they’re known as ZIP codes.)\
    \ To make this project quicker, I used the first couple of letters of each postcode.\n\
    \nFor my project, I used:\n\n*   EH as the postcode for Edinburgh addresses\n\n\
    *   OX as the postcode for Oxford addresses\n\n*   SO as the postcode for Southampton\
    \ addresses\n\nIf you’re in the United States, instead of the ZIP code, you can\
    \ use the postal abbreviation for the state where your cities are located. For\
    \ example, you could use TX to represent Dallas addresses, or MA to represent\
    \ Boston addresses.\n\nChoose *three* cities with *three different short codes*\
    \ to represent them.\n\n### Train Your Model\n\nTo train the computer to recognize\
    \ the postcodes you’ve chosen, you’ll draw examples of those codes and use them\
    \ to train an ML model.\n\n1.  Create a new ML project, name it `Sorting office`,\
    \ and set it to learn to recognize images. \n\n2.  Click **Train**, as shown in\
    \ [Figure 6-2](#c06.xhtml#figure6-2). \n\n    ![Figure 6-2: Train is the first\
    \ phase of an ML project.](image_fi/500563c06/f06002.png)\n\n    [Figure 6-2:](#c06.xhtml#figureanchor6-2)\
    \ Train is the first phase of an ML project.\n\n3.  Click **Add new label**, as\
    \ shown in [Figure 6-3](#c06.xhtml#figure6-3). Then enter the name of your first\
    \ city.\n\n    ![Figure 6-3: Click Add new label to create training buckets for\
    \ your cities.](image_fi/500563c06/f06003.png)\n\n    [Figure 6-3:](#c06.xhtml#figureanchor6-3)\
    \ Click **Add new label** to create training buckets for your cities.\n\n4.  Click\
    \ **draw** at the bottom of your city training bucket, as shown in [Figure 6-4](#c06.xhtml#figure6-4).\n\
    \n    In the window that opens, draw in the box to write the code you want to\
    \ train the computer to recognize for this city.\n\n    When you’ve finished writing,\
    \ click **Add**.\n\n    ![Figure 6-4: Click draw to add new examples.](image_fi/500563c06/f06004.png)\n\
    \n    [Figure 6-4:](#c06.xhtml#figureanchor6-4) Click **draw** to add new examples.\n\
    \n5.  Repeat step 4 until you have at least 10 examples of the handwritten code\
    \ for your first city, as shown in [Figure 6-5](#c06.xhtml#figure6-5).\n\n   \
    \ ![Figure 6-5: Training examples for recognizing the postcode for Edinburgh](image_fi/500563c06/f06005.png)\n\
    \n    [Figure 6-5:](#c06.xhtml#figureanchor6-5) Training examples for recognizing\
    \ the postcode for Edinburgh\n\n6.  Repeat steps 3 through 5 for the next two\
    \ cities, until you have at least 10 examples of each city’s postcode, as shown\
    \ in [Figure 6-6](#c06.xhtml#figure6-6).\n\n    ![Figure 6-6: Training examples\
    \ for postcodes for all three cities](image_fi/500563c06/f06006.png)\n\n    [Figure\
    \ 6-6:](#c06.xhtml#figureanchor6-6) Training examples for postcodes for all three\
    \ cities\n\n7.  Click **Back to project** in the top-left corner of the screen.\n\
    \n8.  Click **Learn & Test**, as shown in [Figure 6-7](#c06.xhtml#figure6-7)."
