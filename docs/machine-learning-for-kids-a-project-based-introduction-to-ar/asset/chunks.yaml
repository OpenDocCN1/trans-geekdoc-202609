    \ in the `compliments` bucket, as shown in [Figure 7-12](#c07.xhtml#figure7-12),\
    \ and type the best compliment you can think of.\n\n   Repeat this step to add\
    \ at least five examples of compliments that will make your character happy. These\
    \ are the examples your ML model will use to learn what a compliment like, so\
    \ try to think of a wide variety.\n\n   ![Figure 7-12: Training examples for compliments](image_fi/500563c07/f07012.png)\n\
    \n   [Figure 7-12:](#c07.xhtml#figureanchor7-12) Training examples for compliments\n\
    \n5. Click `Add example` in the `insults` bucket, as shown in [Figure 7-13](#c07.xhtml#figure7-13),\
    \ and type the meanest, cruelest insult that can think of.\n\n   Repeat this step\
    \ to add at least five examples of insults that will make your character sad.\
    \ Again, these are the examples your ML model will use to learn what an insult\
    \ like, so try to come with several variations.\n\n   ![Figure 7-13: Training\
    \ examples for recognizing insults](image_fi/500563c07/f07013.png)\n\n   [Figure\
    \ 7-13:](#c07.xhtml#figureanchor7-13) Training examples for recognizing insults\n\
    \n6. Click `Back to project` in the top-left corner of the screen.\n\n7. Click\
    \ `Learn & Test`.\n\n8. Click `Train new learning model`, as shown in [Figure\
    \ 7-14](#c07.xhtml#figure7-14).\n\n   ![Figure 7-14: Training a new ML model](image_fi/500563c07/f07014.png)\n\
    \n   [Figure 7-14:](#c07.xhtml#figureanchor7-14) Training a new ML model\n\n \
    \  The computer will use the examples you’ve just created to learn how to recognize\
    \ compliments and insults.\n\n   To so, it will look for patterns in the examples\
    \ you’ve written. It will learn from both the words you chose and the way you\
    \ phrased the sentences. Then, it will use these patterns to recognize the meaning\
    \ of messages we’ll send to it in the next steps.\n\n   Training the model might\
    \ take a minute, but you’ll notice that it’s much quicker than the image classifiers\
    \ you have been training in the previous chapters. Learning to recognize patterns\
    \ in text is much easier for computers than learning to recognize patterns in\
    \ images.\n\n9. Test your ML model by typing a compliment or insult into the `Test`\
    \ box, as shown in [Figure 7-15](#c07.xhtml#figure7-15).\n\n   It’s important\
    \ that you test it with examples you have not included in the training buckets.\
    \ You’re testing how well the computer can recognize new examples that it’s never\
    \ seen before, not how well it remembers the examples you’ve already given it.\n\
    \n   If your model gets things wrong, go back to the `Train` phase and add more\
    \ examples. Then, come back to the `Learn & Test` phase and train a new ML model.\n\
    \n   Keep going until you’re happy with how the computer performs. In the next\
    \ chapter, you’ll learn better ways to test ML models, but for now, simply trying\
    \ out the model a few times is a good start.\n\n   ![Figure 7-15: Testing is an\
    \ important part of ML.](image_fi/500563c07/f07015.png)\n\n   [Figure 7-15:](#c07.xhtml#figureanchor7-15)\
    \ Testing is an important part of ML.\n\n## Code Your Game with ML\n\nNow that\
    \ you have an ML model that can recognize compliments and insults, you’ll modify\
    \ your earlier project to use your ML model instead of the rules you used before.\n\
    \n1. Click `Back to project` in the top-left corner of the screen.\n\n2. Click\
    \ `Make`, as shown in [Figure 7-16](#c07.xhtml#figure7-16).\n\n   ![Figure 7-16:\
    \ Once you’re happy with your ML model, it’s time to make something with it!](image_fi/500563c07/f07016.png)\n\
    \n   [Figure 7-16:](#c07.xhtml#figureanchor7-16) Once you’re happy with your ML\
    \ model, it’s time to make something with it!\n\n3. Click `Scratch 3`, and then\
    \ click `Open in Scratch 3` to open a new window with Scratch.\n\n   You should\
    \ see new blocks representing your ML model in the `Toolbox`, as shown in [Figure\
    \ 7-17](#c07.xhtml#figure7-17).\n\n   ![Figure 7-17: Scratch will open with a\
    \ new set of blocks for your project.](image_fi/500563c07/f07017.png)\n\n   [Figure\
    \ 7-17:](#c07.xhtml#figureanchor7-17) Scratch will open with a new set of blocks\
    \ for your project.\n\n4. Open your saved project by clicking `File`▶`Load from\
    \ your computer`, as shown in [Figure 7-18](#c07.xhtml#figure7-18).\n\n   ![Figure\
    \ 7-18: Open the rules-based project you worked on earlier.](image_fi/500563c07/f07018.png)\n\
    \n   [Figure 7-18:](#c07.xhtml#figureanchor7-18) Open the rules-based project\
    \ you worked on earlier.\n"
  trans: "\n`feeling happy` 服装看起来应该是高兴的。如果是一张脸，你可以让它微笑。如果是一只动物，你可以改变它尾巴或耳朵的位置。或者，你也可以画这个角色举着一个牌子，上面写着它现在的感受。\n\
    \n`feeling sad` 服装看起来应该是难过的。如果是一张脸，你可以画上一个下嘴角或泪水。\n\n`waiting` 服装将在角色等待你对它说话时使用，因此它既不高兴也不难过。\n\
    \n![图 7-7: 为不同的角色服装添加表情](img/f07007.png)\n\n图 7-7: 为不同的角色服装添加表情\n\n7. 点击 `File`▶`Save\
    \ to your computer` 保存你的 Scratch 项目。\n\n## 在不使用 ML 的情况下编写你的游戏\n\n先尝试在不使用 ML 的情况下编写这个\
    \ AI 项目，通过观察 ML 带来的差异会很有帮助。但如果你更想直接开始使用 ML，也可以跳过这部分。\n\n1. 点击 `Code` 标签页，如 图 7-8\
    \ 所示。\n\n   ![图 7-8: Code 标签页](img/f07008.png)\n\n   图 7-8: Code 标签页\n\n2. 复制\
    \ 图 7-9 所示的脚本。\n\n   ![图 7-9: 不使用 ML 编写项目](img/f07009.png)\n\n   图 7-9: 不使用 ML\
    \ 编写项目\n\n3. 使用 `File`▶`Save to your computer` 保存你的项目。\n\n4. 点击绿旗图标测试你的项目。你的角色会要求你对它说些。输入\
    \ `I like you` 或 `You are nice`，你的角色就会看起来很高兴。如果你输入其他内容，你的角色就会看起来很难过。\n\n   现在输入\
    \ `You are lovely`。为什么你的角色看起来并不高兴？\n\n   你需要对代码做什么修改，才能让将“I like you”、“You are\
    \ nice” *以及*“You are lovely”都视为赞美？\n\n   你认为你能写出一个脚本，包含每种可能的*表达每种可能的赞美和辱骂的方式*吗？\n\
    \n   在第一章中，我说过 ML 不是创建 AI 系统的唯一方法。在这里，你使用基于规则的方法创建了一个 AI 程序。你可以看到为什么，虽然这种基于规则的技术仍然被用于一些非常简单的\
    \ AI 项目，但对于更复杂的项目，ML 是首选的方法。接下来我们将用那种方式训练我们的项目，在章节的稍后部分，我们将看到 ML 代码与基于规则代码的表现对比。\n\
    \n## 训练你的模型\n\n为了训练计算机识别赞美和辱骂，你将收集这两者的示例并使用它们来训练 ML 模型。\n\n1. 创建一个新的 ML 项目，命名为\
    \ `Make me happy`，并将其设置为学习识别你语言中的文本。\n\n2. 点击 `Train`，如 图 7-10 所示。\n\n   ![图 7-10:\
    \ Train 是 ML 项目的第一阶段。](img/f07010.png)\n\n   图 7-10: Train 是 ML 项目的第一阶段。\n\n3.\
    \ 点击 `Add new label`，如 图 7-11 所示。将这个训练桶命名为 `compliments`。然后，创建第二个训练桶并命名为 `insults`。\n\
    \n   ![图 7-11: 使用 new label 准备两个训练桶。](img/f07011.png)\n\n   图 7-11: 使用 Add new\
    \ label 准备两个训练桶。\n\n4. 在 `compliments` 桶中点击 `Add example`，如 图 7-12 所示，并输入你想到的最好的赞美。\n\
    \n   重复此步骤以添加至少五个能让你的角色感到开的赞美示例。这些是你的 ML 模型将用来学习什么是赞美的示例，所以尽量尽量多样化。\n\n   ![图\
    \ 7-12: 赞美的训练示例](img/f07012.png)\n\n   图 7-12: 赞美的训练示例\n\n5. 在 `insults` 桶中点击\
    \ `Add example`，如 图 7-13 所示，并输入你想到的最刻薄、最残忍的辱骂。\n\n   重复此步骤以添加至少五个会让你的角色感到难过的辱骂示例。同样，这些是你的\
    \ ML 模型用来学习什么是辱骂的示例，所以请尝试几种变体。\n\n   ![图 7-13: 识别辱骂的训练示例](img/f07013.png)\n\n\
    \   图 7-13: 识别辱骂的训练示例\n\n6. 点击屏幕左上角的 `Back to project`。\n\n7. 点击 `Learn & Test`。\n\
    \n8. 点击 `Train new learning model`，如 图 7-14 所示。\n\n   ![图 7-14: 训练一个新的 ML 模型](img/f07014.png)\n\
    \n   图 7-14: 训练一个新的 ML 模型\n\n   计算机将使用这些示例来识别赞美和辱骂。\n\n   它将使用你提供的句子来学习这些含义。然后，它将使用你提供的示例来识别这些信息。\n\
    \n9. 如 图 7-15 所示，在输入框中输入赞美或辱骂来测试你的 ML 模型。\n\n   通过输入它从未见过的示例来测试它。\n\n   如果你的模型出错了，返回\
    \ `Train` 阶段添加更多示例。\n\n   返回 `Learn & Test` 阶段。我们将后续章节学习更好的测试方法，但现在简单测试几次模型是一个很好的开始。\n\
    \n   ![图 7-15: 测试是重要的。](img/f07015.png)\n\n   图 7-15: 测试是重要的。\n\n## 使用 ML 编写你的游戏\n\
    \n现在你有了一个可以识别赞美和辱骂的 ML 模型，你将修改之前的项目以使用 ML 模型代替之前使用的规则。\n\n1. 点击屏幕左上角的 `Back to\
    \ project`。\n\n2. 点击 `Make`，如 图 7-16 所示。\n\n   ![图 7-16: 如果你对 ML 模型满意，是时候为它做点什么了](img/f07016.png)\n\
    \n   图 7-16: 如果你对 ML 模型满意，是时候为它做点什么了\n\n3. 点击 `Scratch 3`，然后点击 `Open in Scratch\
    \ 3` 打开一个新的 Scratch 窗口。\n\n   你应该会在 `Toolbox` 中看到代表你 ML 模型的新区块，如 图 7-17 所示。\n\n\
    \   ![图 7-17: Scratch 将打开一组新的功能块](img/f07017.png)\n\n   图 7-17: Scratch 将打开一组新的功能块\n\
    \n4. 点击 `File`▶`Load from your computer` 加载你保存的项目，如 图 7-18 所示。\n\n   ![图 7-18:\
    \ 加载你之前处理过的项目](img/f07018.png)\n\n   图 7-18: 加载你之前处理过的项目\n"
