    \ 2-10](#c02.xhtml#figure2-10).\n\n ![Figure 2-10: Making an ML project](image_fi/500563c02/f02010.png)\n\
    \n[Figure 2-10:](#c02.xhtml#figureanchor2-10) Making an ML project\n\nNow you’re\
    \ ready to get started with the projects in this book! But remember, if you want\
    \ to use the Log in option (instead of Try it now) so that you can save your projects,\
    \ you’ll need to ask an adult to create an account for you. Let’s go over that\
    \ now.\n\n## Creating an Account\n\nCreating an account is free and only has to\
    \ be done once. There are 10 steps, and signing up can take up to 10 minutes.\
    \ This section covers the instructions your parent, teacher, or coding club leader\
    \ needs to follow.\n\n1.  Click **Sign up** (shown in [Figure 2-2](#c02.xhtml#figure2-2)).\n\
    \n2.  Click the button confirming that you are a parent, teacher, or coding club\
    \ leader.\n\n3.  Click **Sign up** under “Create an unmanaged class account.”\
    \ This means that you will be in charge of your account and are setting it up\
    \ yourself.\n\n4.  Fill in the form shown in [Figure 2-11](#c02.xhtml#figure2-11).\
    \ Choose a username and enter an email address where you can be contacted. You\
    \ can optionally also describe how you’re planning to use the site. \n\n    ![Figure\
    \ 2-11: Creating a parent/teacher account](image_fi/500563c02/f02011.png)\n\n\
    \    [Figure 2-11:](#c02.xhtml#figureanchor2-11) Creating a parent/teacher account\n\
    \n5.  You’ll be sent an email to verify your email address. Click the link in\
    \ that email before continuing to the next step.\n\n6.  Once you log in with your\
    \ parent/teacher account, you’ll have access to the Administration page shown\
    \ in [Figure 2-12](#c02.xhtml#figure2-12). Click **Teacher** in the top menu bar\
    \ to go to the Administration page.\n\n    ![Figure 2-12: Parent/teacher screen](image_fi/500563c02/f02012.png)\n\
    \n    [Figure 2-12:](#c02.xhtml#figureanchor2-12) Parent/teacher screen\n\n7.\
    \  Click **Restrictions** to review the default restrictions for your account.\
    \ Some of them can be altered to your preferences.\n\n8.  Click **API Keys** to\
    \ enter the codes from IBM Cloud that will provide the ML technology for your\
    \ projects. You’ll need one API key for Watson Assistant.\n\n    To create these\
    \ codes, you’ll need to create a free account on IBM Cloud. There is no charge\
    \ for the Watson Assistant key codes.\n\n    The IBM Cloud site can be a little\
    \ daunting if you’re not used to websites aimed at software developers. The step-by-step\
    \ guide at [https://machinelearningforkids.co.uk/apikeys-guide/](https://machinelearningforkids.co.uk/apikeys-guide/)\
    \ explains exactly what to do.\n\n9.  Click **Students** to create a username\
    \ for the student who will be doing the projects in this book. If multiple students\
    \ will be building these projects, you can create multiple usernames.\n\n    There’s\
    \ no need to use real names or provide any contact information for students.\n\
    \n    User accounts for students are simpler than those for teachers. Students\
    \ don’t have to worry about API keys from IBM or any other technical details.\n\
    \n    If they forget their password, you can reset it for them from the Students\
    \ page.\n\n10.  Click **Supervision** to see a list of projects that students\
    \ have created.\n\n     It’s unlikely that you’ll hit the limit for the API keys\
    \ you’ve added unless many students are working through the book at the same time.\
    \ If that happens, you’ll be able to see which projects are using the API keys\
    \ here.\n\n## What You Learned\n\nMachine Learning for Kids is the free tool you’ll\
    \ be using for the projects in this book. The tool guides you through the main\
    \ phases of an ML project. The project instructions will tell you exactly what\
    \ to do at each phase and when you should move on to the next phase or return\
    \ to a previous one.\n\nIf you want to be able to save your projects, you’ll need\
    \ an adult to create an account for you. Creating an account is a little complicated\
    \ and can take 10 minutes or so, but the process is free, only has to be done\
    \ once, and is explained in detail online.\n\n![](image_fi/book_art/chapterart.png)\n\
    \n# 3  \n\nSorting Animal Pictures\n\n![Alphabet-W](image_fi/book_art/Alphabet-W.png)e\
    \ all love pictures. We take over a trillion digital photos every year, and that\
    \ doesn’t even include other types of pictures that we make, like drawings and\
    \ paintings.\n\nUsing computers to sort pictures and help us find the ones we\
    \ need is called *image recognition*. To create an image recognition system, we\
    \ collect lots of pictures of the same subject. Then we use those pictures to\
    \ train an ML *model*, which identifies what those pictures have in common and\
    \ uses that to recognize new pictures.\n\nFor example, if we want to train a computer\
    \ to recognize photos of kittens, we collect lots of photos of kittens. ML systems\
    \ use these photos to learn the shapes, patterns, and colors that often show up\
    \ in kitten photos. The model can then recognize whether a photo has a kitten\
    \ in it.\n\nPeople use image recognition every day. Online photo-sharing tools\
    \ use it to help sort the photos that we upload. Websites use it to describe the\
    \ contents of photos to help people with visual disabilities know what’s in photos\
    \ even if they can’t see them. Social media websites use it to recognize the faces\
    \ of our friends and family in the photos we post. Companies use it to track when\
    \ their logos or products are included in photos posted online so they know when\
    \ they’re being talked about on social media. More importantly, doctors use it\
    \ to help them recognize medical conditions in patients’ scans and photos. Doctors\
    \ need to remember many different symptoms and signs of illness, so image recognition\
    \ systems can help them by identifying things like skin tumors in photographs\
    \ or cancer in a microscopic picture of a cell.\n\nIn this chapter, you’ll make\
    \ your own image recognition system by training an ML model to recognize and automatically\
    \ sort photos of animals. Let’s get started!\n\n## Build Your Project\n\nFirst,\
    \ choose two types of animals that you want the computer to recognize. For this\
    \ chapter, I chose cows and sheep to make a farm-themed Scratch project (see [Figure\
    \ 3-1](#c03.xhtml#figure3-1)). You can choose any two animals you’d like, as long\
    \ as you can easily find lots of photos of them.\n\n ![Figure 3-1: Sorting photos\
    \ of animals into groups](image_fi/500563c03/f03001.png)\n\n[Figure 3-1:](#c03.xhtml#figureanchor3-1)\
    \ Sorting photos of animals into groups\n\n### Train Your Model"
