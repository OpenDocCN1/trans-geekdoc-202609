    \ more examples to add to your training buckets. For example, what if the ML model\
    \ has a very low confidence score? Or what if someone keeps giving a similar command\
    \ in slightly different ways? That probably means that the ML model isn’t recognizing\
    \ the commands correctly or doing what the person wants, and that’s helpful feedback\
    \ for your training. What if the person clicks a thumbs-down “I’m not happy” button?\
    \ What if they end up pressing a button to do something? What if they sound more\
    \ and more annoyed?\n\nThere are lots of ways to guess that something hasn’t worked\
    \ well. And every time that happens, that’s an example you could collect and add\
    \ to one of your training buckets so a newer ML model can work a little better\
    \ next time.\n\nWe use all these sorts of techniques (collecting training examples\
    \ from large numbers of people, getting feedback from users, and many more) to\
    \ help us build computers and devices that can understand what you mean.\n\n##\
    \ What You Learned\n\nIn this chapter, we’ve looked at how ML is used to recognize\
    \ the meaning of text, and how it can be used to build computer systems that can\
    \ understand what we mean and do what we ask.\n\nIn your project, you used the\
    \ same type of ML technology that enables *smart assistants* like Amazon’s Alexa,\
    \ Google Home, Microsoft’s Cortana, and Apple’s Siri. *Natural language interfaces*\
    \ let us tell our devices what we want them to do by using languages like English,\
    \ instead of only by pressing screens or buttons.\n\nWhen you ask a smartphone\
    \ what the time is, or to set an alarm or a timer, or to play your favorite song,\
    \ the computer needs to classify that command. It needs to take that series of\
    \ words that you chose and recognize their intent.\n\nThe makers of smartphones\
    \ and smart assistants trained an ML model to recognize the meaning of user commands\
    \ by working out a list of categories—all of the possible commands they thought\
    \ users might want to give. And then for each one, they collected lots and lots\
    \ of examples of how someone might give that command.\n\nIn both this project\
    \ and the real world, the process works like this:\n\n1.  Predict commands that\
    \ you might give.\n\n2.  Collect examples of each of those commands.\n\n3.  Use\
    \ those examples to train an ML model.\n\n4.  Script or code what you want the\
    \ computer to do when it recognizes each command.\n\nTo create a real smart assistant,\
    \ you’d have to repeat these steps for thousands of commands, not just four. And\
    \ you would need thousands, or tens of thousands, of examples for each command.\n\
    \nIn the next chapter, you’ll use this capability to build programs that can answer\
    \ questions.\n\n![](image_fi/book_art/chapterart.png)\n\n# 11  \n\nChatbots\n\n\
    ![Alphabet-I](image_fi/book_art/Alphabet-I.png)n the last chapter, we talked about\
    \ *intent classification*: building ML systems that can recognize the meaning\
    \ (the intention) of text. We talked about one common use of intent classification,\
    \ which is to build smart assistants that can understand what we’re telling them\
    \ and carry out our commands.\n\nIn this chapter, we’ll look at how ML models\
    \ that understand the meaning of text can be used to build *question answering\
    \ (QA)* *systems*. QA systems recognize and respond to our questions, discovering\
    \ the answers automatically from a set of documents.\n\nUnlike search engines,\
    \ which return a list of web pages, QA systems return a specific answer to a specific\
    \ question. This is more challenging, as it requires a deep understanding of both\
    \ the question and the meaning of the web pages or documents that may contain\
    \ the answers. For example, the correct answer to a question like “Who was President\
    \ Cleveland’s wife?” is “Frances Folsom,” not a list of documents that include\
    \ biographies of US presidents.\n\nQA has been a goal and active area of AI research\
    \ for many years. For example, the US National Institute of Standards and Technology\
    \ (NIST) has run a QA competition every year since 1999, where universities and\
    \ companies compete to see which of their computer systems can answer the most\
