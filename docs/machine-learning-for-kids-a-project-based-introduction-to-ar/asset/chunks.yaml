- raw: "5.  If you created the rules-based script earlier, update it to match [Figure\
    \ 7-19](#c07.xhtml#figure7-19). If you skipped the rules-based approach to the\
    \ project, create the whole script shown in [Figure 7-19](#c07.xhtml#figure7-19).\n\
    \n    ![Figure 7-19: Coding the project using ML](image_fi/500563c07/f07019.png)\n\
    \n    [Figure 7-19:](#c07.xhtml#figureanchor7-19) Coding the project using ML\n\
    \n    In this script, your character will ask you to say something to it. The\
    \ script uses your ML model to recognize whether the message you type is a compliment\
    \ or an insult. It will display one of the costumes you’ve drawn based on what\
    \ it’s recognized, making it look like your character is reacting to whether you’re\
    \ complimenting or insulting it!\n\n    If you coded this project earlier without\
    \ ML, compare this script with the previous one. Can you see how ML makes it easier\
    \ to create a project that can react to a wider variety of possible messages?\n\
    \n### Test Your Game\n\nIt’s time to test your project. Click the Green Flag and\
    \ try typing a few messages. Even if you type something you didn’t use for training,\
    \ hopefully the character will correctly react to your message. If it doesn’t,\
    \ you can always go back to the Train phase to add more examples and then train\
    \ a new ML model.\n\nYou’ve successfully created a character that has learned\
    \ to recognize and react to compliments and insults you give it!\n\n## Review\
    \ and Improve Your Project\n\nLet’s look at a few ways you could improve this\
    \ project.\n\n### Using Speech Input Instead of Typing\n\nWhat about changing\
    \ your project so that you can say your compliments and insults aloud instead\
    \ of typing them?\n\nYou’ll need a microphone on your computer to be able to use\
    \ speech input, and you’ll need to add the Speech to Text extension from the Scratch\
    \ Extensions Library. To access the Extensions Library, click the Add Extension\
    \ icon (it looks like two blocks with a plus sign, +) at the bottom of the Toolbox.\
    \ This library contains additional blocks you can use in your projects.\n\nFind\
    \ and click the **Speech to Text** extension to add those blocks to your Toolbox,\
    \ and then update your script to look like [Figure 7-20](#c07.xhtml#figure7-20).\n\
    \n ![Figure 7-20: The Make me happy project using speech recognition](image_fi/500563c07/f07020.png)\n\
    \n[Figure 7-20:](#c07.xhtml#figureanchor7-20) The Make me happy project using\
    \ speech recognition\n\n*Speech recognition* is another application of ML. For\
    \ this improvement, you aren’t training the speech ML model yourself, you’re using\
    \ a model that someone else has trained for you. But the basic principle behind\
    \ how the speech blocks were created is similar to how you created the typed examples\
    \ of compliments and insults.\n\nWhat else could you do to improve your project?\n\
    \n### Recognizing Speech That Isn’t a Compliment or Insult\n\nType `What is the\
    \ time?` to your character. It might think that this question is a compliment\
    \ and look happy. Or it might identify it as an insult and look sad.\n\nNeither\
    \ of those reactions is really the right thing to do. You could update your code\
    \ so that it doesn’t react at all when it gets messages that aren’t a compliment\
    \ or an insult.\n\nWhen you tested your ML model in the Learn & Test phase, you\
    \ may have noticed the confidence score showing how confident the computer is\
    \ that it has recognized the message.\n\nTry typing `What is the time?` again\
    \ now, as shown in [Figure 7-21](#c07.xhtml#figure7-21).\n\n ![Figure 7-21: Testing\
    \ the confidence in classifying “What is the time?”](image_fi/500563c07/f07021.png)\n\
    \n[Figure 7-21:](#c07.xhtml#figureanchor7-21) Testing the confidence in classifying\
    \ “What is the time?”\n\nYou should see that this message gets a very low confidence\
    \ score. This is the ML model’s way of telling you that it didn’t recognize the\
    \ text. It’s saying that in all of the training examples you’ve given it, it hasn’t\
    \ seen anything like that before, so it wasn’t able to recognize whether the message\
    \ was a compliment or insult.\n\nMy ML model had a confidence score of 0 in its\
    \ classifying of “What is the time?” Your ML model might have scored a bit higher,\
    \ depending on how you trained it. For example, if you included a lot of questions\
    \ like “What is wrong with you?” in your insults bucket, your ML model might have\
    \ 10 percent confidence that “What is the time?” is an insult, just because it\
    \ is a question. That would still be useful information, as it’s telling you that\
    \ there’s a 90 percent chance that the message isn’t an insult. It’s saying that\
    \ the message had some similarities to patterns that it recognizes from the insults\
    \ it learned from, but that it isn’t able to *confidently* identify the message\
    \ as an insult.\n\nExperiment with different test sentences that aren’t compliments\
    \ or insults to see what sort of confidence scores you get. Compare these with\
    \ the confidence scores you get when you test your ML model on messages that really\
    \ are compliments and insults.\n\nWhat sort of confidence score does your ML model\
    \ give when it correctly recognizes an actual compliment or insult?\n\nYou can\
    \ use the confidence score in your Scratch project, as shown in [Figure 7-22](#c07.xhtml#figure7-22).\n\
    \n![Figure 7-22: Using confidence scores in your code](image_fi/500563c07/f07022.png)\n\
    \n[Figure 7-22:](#c07.xhtml#figureanchor7-22) Using confidence scores in your\
    \ code\n\nThis script will make the character react only if the ML model is at\
    \ least 70 percent confident that it has recognized the message you give it. Otherwise,\
    \ the script will ignore the message.\n\nYou’ll need to change the `70` to a percentage\
    \ that works for your ML model, based on your own testing.\n\nIs there anything\
    \ else you could do to improve your project?\n\n### Learning from Mistakes\n\n\
    When someone is using an ML system, they’ll often know if the computer has made\
    \ a mistake. One way to improve your ML project is to let it learn from those\
    \ mistakes.\n\nGive the user a way to tell the project if the ML model makes a\
    \ mistake. It could be a button to click, or a text box where they type “yes”\
    \ or “no” in response to being asked, “Did I get that right?”\n\nThe script shown\
    \ in [Figure 7-23](#c07.xhtml#figure7-23) will ask if the ML model is correct.\
    \ If you type “no,” the text the computer didn’t recognize correctly will be added\
    \ to the training examples. After every five new training examples, a new ML model\
    \ is trained.\n\n ![Figure 7-23: An example of learning from mistakes](image_fi/500563c07/f07023.png)\n\
    \n[Figure 7-23:](#c07.xhtml#figureanchor7-23) An example of learning from mistakes\n\
    \nTraining your model to learn from mistakes will make it smarter the longer you\
    \ use it. Think of how you’d like to tell your character when it has misunderstood\
    \ you, and use a script like this so it can learn from your feedback.\n\n## What\
    \ You Learned\n\nIn this chapter, you learned about *sentiment analysis*, the\
    \ use of ML to recognize the tone and emotion in text. You learned how businesses\
    \ and organizations use sentiment analysis to get valuable insight and feedback\
    \ from customers on the internet, prioritize customer service responses, and measure\
    \ employee satisfaction.\n\nYou discovered that ML is a much better approach to\
    \ building AI systems for complex projects than a simple rules-based method. You\
    \ also learned how confidence scores can tell you how sure an ML model is of the\
    \ predictions it’s making, and saw how you could improve your ML models by helping\
    \ them learn from their mistakes.\n\nIn the next chapter, you’ll use an approach\
    \ similar to sentiment analysis to train a model to recognize different styles\
    \ of writing.\n\n![](image_fi/book_art/chapterart.png)\n\n# 8  \n\nRecognizing\
    \ Language in Newspapers\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)n the\
    \ last chapter, you saw that computers can be trained to recognize different characteristics\
    \ of writing. For that project, you trained an ML model to recognize compliments\
    \ and insults. Computers can also learn to recognize lots of other styles of writing\
    \ as well."
