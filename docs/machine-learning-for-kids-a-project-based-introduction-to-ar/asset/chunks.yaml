  trans: '


    尝试输入各种描述你喜欢的电影的句子，看看你的项目推荐了什么。避免使用你在原始训练桶（buckets）中放入过的单词或短语，以观察你的 ML 模型是否学会了识别新的句子。


    ### 引入偏差


    点击 `Back to project` 然后点击 `Train` 回到 `Train` 阶段。


    现在选择一部与你前三部电影有点相似的第四部电影。对于我的项目，我选择了《兰肯斯坦》（Frankenstein），这是一部与《诺斯费拉图》（Nosferatu）有点相似的恐怖电影。


    点击 `Add new label` 为你的第四部电影添加一个新的训练桶。


    从第一部电影（在我这里是《诺斯费拉图》）中删除几个训练示例，并将它们添加到你的新电影（我对我来说是《兰肯斯坦》）中。


    你最终的结果应该类似于图 15-12。


    ![图 15-12：将一些示例移动到新电影。](img/f15012.png)


    图 15-12： 将一些示例移动到新电影。


    为你的新电影再添加 12 个示例。你最终的结果应该类似于图 15-13。


    ![图 15-13：新电影的训练示例](img/f15013.png)


    图 15-13： 新电影的训练示例


    点击 `Back to project` 然后点击 `Learn & Test`。使用更新后的训练示例训练一个新的 ML 模型。


    当训练完成后，点击 `Back to project` 然后点击 `Make`，再次再次打开 `Scratch 3`。


    点击 `File`▶`Load from your computer` 打开你之前保存的 Scratch 项目。更新它以添加你的新电影。这意味着要添加一个带有新电影海报的造型，并更新脚本以添加第四个
    `if` 块来识别并推荐你的新电影，如图图 15-14 所示。


    ![图 15-14：更新你的项目以添加第四部电影。](img/f15014.png)


    图 15-14： 更新你的项目以添加第四部电影。


    ### 测试你有偏差的项目


    再次测试你的项目。你会发现它对第四部电影有偏好，特别是相对于与它相似的那部电影。


    对于我的项目，这意味着如果我提到任何关于恐怖电影、心跳加速、肾上腺素飙升或怪物的内容，我的 ML 模型现在将总是推荐《兰肯斯坦》，而不是像以前那样推荐《诺斯费拉图》。它在有时推荐一个和有时推荐另一个之间并没有平衡。它似乎对《兰肯斯坦》有一种偏好，或偏差。事实上，要让它推荐《诺斯费拉图》非常困难。


    ### 审查你的项目


    在本书为止的大多数项目中，我们都尝试保持每个桶中的示例数量大致相同。这是为了尽量减少偏差的一种常用原则。但虽然偏差是一个需要考虑的重要因素，但它并不一定是坏事。


    假设你正在训练一台计算机来识别三种可能的结果：X、Y 和 Z。想象 X 和 Y 非常常见；它们几乎总是正确答案。结果 Z 是可能的，但非常罕见。尽管 Z 很少发生，你仍希望训练计算机在它发生时能够识别出它。


    一个平衡的训练示例集（X、Y 和 Z 的示例数量相同）在这里可能并不合适。为 X 和 Y 拥有更多的训练示例，而为 Z 拥有较少的示例，可能会训练 ML 模型认为
    X 和 Y 更有可能，而在这种情况下这是正确的。结果 X 和 Y 更常见，而 Z 是稀有的。这样的系统仍然是有偏差，但这种偏差反映了不同结果的统计概率，因此它实际上可能是合适且有用的。


    ### AI 与伦理


    在整个章节中，我们看到你为 ML 系统提供的训练将强烈地影响它给出的答案。你认为这对创建 AI 系统的人的责任意味着什么？你认为 AI 开发者是否有伦理责任去平衡他们的训练数据或避免有偏差的系统？


    意图重要吗？如果有人不小心开发了一个有偏差的系统，这与那些想要影响系统输出并刻意歪曲训练数据的人相比，是更符合伦理吗？


    钱重要吗？换句话说，如果我第四部电影的制作人付我钱，让我的电影推荐应用偏好他们的电影而不是竞争对手的电影，这和我制作一个对我个人没有好处的有偏差的应用相比，是更符合伦理吗？


    主题重要吗？换句话说，你认为一个有偏差的 AI 电影推荐应用是否比一个向医生提供治疗建议的 AI 应用更令人伦理关注？


    '
