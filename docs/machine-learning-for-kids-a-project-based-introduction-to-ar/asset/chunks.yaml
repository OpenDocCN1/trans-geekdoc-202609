- raw: "    *   Are there patterns in the types of words that are used? For example,\
    \ does one group use simpler language or shorter words? Does one group use more\
    \ emotional words?\n\n    Try to guess what sorts of patterns that your ML model\
    \ might be learning from the training examples you’ve given it.\n\n### Prepare\
    \ Your Project\n\nIn the projects that you’ve made so far, you’ve tested your\
    \ ML models by trying them out. In this chapter, you’ll see a few of the ways\
    \ that ML projects are formally tested in the real world.\n\n1.  Click **Back\
    \ to project** in the top-left corner of the screen.\n\n2.  Click **Make**.\n\n\
    3.  Click **Scratch 3**, and then click **Open in Scratch 3** to open a new window\
    \ with Scratch.\n\n4.  Delete the **Sprite1** cat sprite from the sprites list,\
    \ as you won’t need it. Click the trash can icon in its top-right corner. The\
    \ Costumes tab should now be replaced by the Backdrops tab.\n\n5.  Click the **Backdrops**\
    \ tab and draw a background that divides your Scratch project into two halves,\
    \ as shown in [Figure 8-8](#c08.xhtml#figure8-8).\n\n    The *top half* will be\
    \ for newspapers that *match* what you’ve trained the ML model to recognize.\n\
    \n    The *bottom half* will be for newspapers that *don’t match* what you’ve\
    \ trained the ML model to recognize.\n\n    Choose a color for each half. I used\
    \ red for the top half, and blue for the bottom half.\n\n    Draw a line between\
    \ the two halves to divide the space.\n\n    You should end up with something\
    \ like [Figure 8-8](#c08.xhtml#figure8-8).\n\n6.  Add a sprite by moving your\
    \ mouse pointer over the Choose a Sprite icon (the cat face) at the bottom right\
    \ of the screen. This sprite will represent the newspaper headlines that your\
    \ ML model should recognize, so give it a suitable name in both the **Costume**\
    \ text field above the canvas and in the **Sprite** text field at the bottom right.\n\
    \n    To draw your own newspaper, select **Paint**.\n\n    To upload a picture\
    \ of a newspaper you’ve saved to the computer, click **Upload Sprite**.\n\n  \
    \  ![Figure 8-8: Prepare the backdrop for the Newspapers project.](image_fi/500563c08/f08008.png)\n\
    \n    [Figure 8-8:](#c08.xhtml#figureanchor8-8) Prepare the backdrop for the Newspapers\
    \ project.\n\n7.  Click the **Costumes** tab and use the paint tools to color\
    \ the newspaper to match the top half of the backdrop.\n\n    For my project,\
    \ I drew a red newspaper sprite to represent headlines from tabloids and gave\
    \ it the name tabloid, as shown in [Figure 8-9](#c08.xhtml#figure8-9).\n\n   \
    \ ![Figure 8-9: Draw the first newspaper sprite.](image_fi/500563c08/f08009.png)\n\
    \n    [Figure 8-9:](#c08.xhtml#figureanchor8-9) Draw the first newspaper sprite.\n\
    \n8.  Click the **Code** tab, click **Variables** in the Toolbox, and then click\
    \ **Make a List**, as shown in [Figure 8-10](#c08.xhtml#figure8-10).\n\n    Make\
    \ sure **for all sprites** is selected, and name your list after what you’ve trained\
    \ your ML model to recognize.\n\n    For my project, I created a list called tabloid\
    \ headlines.\n\n    ![Figure 8-10: Create a list for the first set of headlines.](image_fi/500563c08/f08010.png)\n\
    \n    [Figure 8-10:](#c08.xhtml#figureanchor8-10) Create a list for the first\
    \ set of headlines.\n\n9.  Type at least 10 examples into the list, as shown in\
    \ [Figure 8-11](#c08.xhtml#figure8-11). Click the plus button in the bottom-left\
    \ corner of the list to add a new line. You can drag the equal sign in the bottom-right\
    \ corner to make the list wider, which can make it easier to see what you are\
    \ typing.\n\n    The text you type into this list should be examples of newspaper\
    \ headlines or articles that fit what you’ve trained the ML model to recognize.\n\
    \n    It’s important that these are new headlines that you haven’t already used\
    \ in the training examples. These should be headlines that the computer hasn’t\
    \ seen before so that you can properly test if it can recognize new headlines,\
    \ not simply remember them.\n\n    When you’ve finished typing your test headlines\
    \ into the list, uncheck the list in the Toolbox to hide it from the Stage.\n\n\
    \    ![Figure 8-11: Test examples for the first group](image_fi/500563c08/f08011.png)\n\
    \n    [Figure 8-11:](#c08.xhtml#figureanchor8-11) Test examples for the first\
    \ group\n\n10.  Click the **Code** tab and copy the scripts shown in [Figure 8-12](#c08.xhtml#figure8-12).\n\
    \n     Replace the tabloid block with the label for whatever you’ve trained the\
    \ computer to recognize in your project.\n\n     ![Figure 8-12: First code scripts\
    \ for the Newspapers project](image_fi/500563c08/f08012.png)\n\n     [Figure 8-12:](#c08.xhtml#figureanchor8-12)\
    \ First code scripts for the Newspapers project\n\n     This script will go through\
    \ each of my tabloid headlines, and if the ML model recognizes it as a tabloid\
    \ headline, it will move that headline to the top half of the screen. Otherwise,\
    \ it will move the headline to the bottom half of the screen.\n\n     You did\
    \ something similar in Chapter 3 when you sorted animal sprites based on an ML\
    \ model recognizing what the sprite looked like. This time, you’re sorting sprites\
    \ based on the ML model recognizing some text in your list.\n\n11.  Click the\
    \ Green Flag and watch your script run.\n\n     How did your ML model do? It will\
    \ probably get some answers wrong, but hopefully it will get most right. You can\
    \ see how my ML model performed in [Figure 8-13](#c08.xhtml#figure8-13).\n\n \
    \    ![Figure 8-13: First test for the Newspapers project](image_fi/500563c08/f08013.png)\n\
    \n     [Figure 8-13:](#c08.xhtml#figureanchor8-13) First test for the Newspapers\
    \ project\n\n     But you can’t tell just from this grouping of newspaper sprites\
    \ if my ML model is able to distinguish tabloid headlines from broadsheet headlines.\
    \ Maybe it recognizes almost anything as tabloid headlines. I need to add some\
    \ examples of broadsheet headlines to my list to know if my model would recognize\
    \ them as well.\n\n12.  Follow the instructions from step 6 to create a new sprite,\
    \ this time representing headlines/articles that should go in the *bottom half*\
    \ of the backdrop you created. Color the sprite to match the color you chose for\
    \ the bottom half of the screen when you drew the backdrop, and give the sprite\
    \ and costume a name that fits what you’re training the model to recognize.\n\n\
    \     For my project, I drew a blue newspaper sprite to represent broadsheet headlines\
    \ and named it broadsheet, as shown in [Figure 8-14](#c08.xhtml#figure8-14).\n\
    \n     ![Figure 8-14: Second sprite for the Newspapers project](image_fi/500563c08/f08014.png)\n\
    \n     [Figure 8-14:](#c08.xhtml#figureanchor8-14) Second sprite for the Newspapers\
    \ project\n\n13.  On the **Code** tab, click **Variables** in the Toolbox and\
    \ then click **Make a List**. Fill this list with at least 10 examples of headlines/articles\
    \ that should go in the bottom half of the backdrop.\n\n     As before, make sure\
    \ **for all sprites** is selected and name the list to match your second group.\n\
    \n     For my project, I created a list named broadsheet headlines and filled\
    \ it with 10 examples of broadsheet headlines, as shown in [Figure 8-15](#c08.xhtml#figure8-15).\n\
    \n     When you’ve typed your test headlines into the list, uncheck the list in\
    \ the Toolbox to hide the list in the Stage.\n\n14.  Create a variable to count\
    \ these headlines by clicking your second newspaper sprite, clicking **Variables**\
    \ in the Toolbox, and clicking **Make a Variable**. Name the variable after your\
    \ second group.\n\n     For my project, I created a variable called my broadsheet\
    \ variable, as shown in [Figure 8-15](#c08.xhtml#figure8-15).\n\n     ![Figure\
    \ 8-15: Preparing the data for the second group of newspapers](image_fi/500563c08/f08015.png)\n\
    \n     [Figure 8-15:](#c08.xhtml#figureanchor8-15) Preparing the data for the\
    \ second group of newspapers\n\n15.  Copy the scripts shown in [Figure 8-16](#c08.xhtml#figure8-16)\
    \ for the second newspaper sprite.\n\n     ![Figure 8-16: Second test for the\
    \ Newspapers project](image_fi/500563c08/f08016.png)\n\n     [Figure 8-16:](#c08.xhtml#figureanchor8-16)\
    \ Second test for the Newspapers project"
