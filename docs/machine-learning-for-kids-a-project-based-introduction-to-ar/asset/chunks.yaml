- raw: "If you don’t want any of these misleading patterns to affect your ML model,\
    \ it helps to include *variety* in your training examples. Your project will work\
    \ best when your training photos include a lot of very different photos of the\
    \ same subject. When taking rock training photos, make a rock shape from every\
    \ different angle and direction that you can. Take some photos that are close\
    \ up and large, and some that are farther away and small. If you can take photos\
    \ with different backgrounds, even better. If the only thing that your rock training\
    \ examples have in common is a fist hand shape, that will be the pattern the computer\
    \ learns to recognize.\n\nWe’ll learn more about how to confuse ML models in Chapter\
    \ 14, but for now remember: *if the pictures in each training bucket have only\
    \ one thing in common with each other, then that’s the only pattern that the ML\
    \ model will learn to recognize*.\n\n## What You Learned\n\nIn this chapter, you’ve\
    \ trained another ML model to recognize pictures. In Chapter 3, you used this\
    \ to do a job: sorting photos. This time you used it to play a game of Rock, Paper,\
    \ Scissors against your computer by having it recognize your hand shape. Both\
    \ of these projects demonstrate *image recognition* and are good examples of how\
    \ it is used every day.\n\nYou’ve learned that the basic approach for training\
    \ computers in image recognition is to collect example photos, and you’ve learned\
    \ the important lesson of avoiding misleading patterns in your training data to\
    \ improve your results.\n\nComputers can learn to recognize more than just what’s\
    \ in a picture, however, so in the next chapter you’ll see some other patterns\
    \ that ML models can learn.\n\n![](image_fi/book_art/chapterart.png)\n\n# 5  \n\
    \nRecognizing Movie Posters\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)n\
    \ the last two chapters, you collected training images to create an ML system\
    \ that could identify pictures of a certain object by learning to recognize the\
    \ colors, shapes, and patterns that the training images had in common.\n\nIn this\
    \ chapter, you’ll use the same technique to train a model to recognize the style\
    \ of a picture rather than its subject. For example, if you collect examples of\
    \ watercolor paintings in one training bucket, and examples of pen drawings in\
    \ another training bucket, you can train an ML model to recognize whether a picture\
    \ is a watercolor or a pen drawing.\n\nThe most common example of how this technique\
    \ is used in real life is in search engines. Image search engines can recognize\
    \ the visual style of images, allowing you to filter image search results by type\
    \ (clip art, line drawings, photos, and so on). These search engines use an ML\
    \ model that has been trained with a lot of examples of pictures of different\
    \ styles to be able to recognize the type of each search result.\n\nSome people\
    \ use ML systems to create entirely new pictures. This involves training a computer\
    \ to recognize the patterns found in works of art of a certain style, and then\
    \ letting the computer use what it has learned to generate new works of art in\
    \ that style. In 2018, an AI system created a painting that was auctioned as a\
    \ work of art for over $400,000.\n\nThis sort of project is called *computational\
    \ creativity* and has been used to create all sorts of things. AI systems have\
    \ composed new pieces of music and even invented recipes and meals.\n\nIn this\
    \ chapter, you’ll train an ML model that can recognize the genre of a work of\
    \ art based only on a picture of it.\n\nThink about what posters for certain movie\
    \ genres have in common. For example, thriller movie posters often have dark colors\
    \ and large letters. Romance movie posters often have light colors and flowery\
    \ letters. Science-fiction movie posters often have spaceships, stars, planets,\
    \ and a black background.\n\nWe all learn these patterns, often without realizing\
    \ it, so that we can recognize a movie’s genre just from seeing its poster (see\
    \ [Figure 5-1](#c05.xhtml#figure5-1)).\n\nIn this project, you’ll train the computer\
    \ to recognize what works of art in a particular genre have in common. For example,\
    \ do posters for action movies have anything in common? The box art for racing\
    \ video games? The cover art for rap albums? You’ll see whether a computer can\
    \ learn to recognize these patterns so that it can identify the genre of a work\
    \ of art, such as a book, based just on a picture of its cover or poster.\n\n\
    \ ![Figure 5-1: ML models can learn to recognize movie genres.](image_fi/500563c05/f05001.png)\n\
    \n[Figure 5-1:](#c05.xhtml#figureanchor5-1) ML models can learn to recognize movie\
    \ genres.\n\nLet’s get started!\n\n## Build Your Project\n\nChoose a type of art\
    \ that can be grouped by genre and is represented by a graphical cover or poster.\n\
    \nFor example, you could choose:\n\n*   Books, which are represented by book coversBooks,\
    \ which are represented by book coversBooks, which are represented by book coversBooks,\
    \ which are represented by book coversBooks, which are represented by book coversBooks,\
    \ which are represented by book covers\n\n*   Movies, which are represented by\
    \ movie posters\n\n*   Video games, which are represented by box art\n\n*   Music\
    \ albums, which are represented by album covers\n\nYou’ll need to collect pictures\
    \ of your chosen works of art to be the training examples for this project. Look\
    \ for websites that group books, movies, games, or albums by genre. If you’ve\
    \ chosen books, the website for a bookstore or library is a useful source of training\
    \ examples. If you’ve chosen music albums or video games, retailer websites are\
    \ good places to try.\n\nNext, choose a few genres that you want to train the\
    \ computer to be able to recognize. Training the computer will be easier if you\
    \ choose genres that are very obviously different. For example, it’s easier to\
    \ recognize the difference between the posters for action movies and romance movies\
    \ than it is to recognize the difference between posters for action movies and\
    \ adventure movies.\n\nFor the screenshots in this project, I trained an ML model\
    \ to recognize three genres of movies—action, family, and drama—based on their\
    \ movie posters.\n\nOnce you’ve chosen your type of art and genres, you can start\
    \ training your model.\n\n### Train Your Model\n\n1.  Create a new ML project,\
    \ name it `Judge a book by its cover`, and set it to learn to recognize images.\
    \ \n\n2.  Click **Train**, as shown in [Figure 5-2](#c05.xhtml#figure5-2).\n\n\
    \    ![Figure 5-2: Train is the first phase of an ML project.](image_fi/500563c05/f05002.png)\n\
    \n    [Figure 5-2:](#c05.xhtml#figureanchor5-2) Train is the first phase of an\
    \ ML project.\n\n3.  Click **Add new label**, as shown in [Figure 5-3](#c05.xhtml#figure5-3),\
    \ and enter the name of your first genre. \n\n    ![Figure 5-3: Click Add new\
    \ label to create training buckets for your genres.](image_fi/500563c05/f05003.png)\n\
    \n    [Figure 5-3:](#c05.xhtml#figureanchor5-3) Click **Add new label** to create\
    \ training buckets for your genres.\n\n4.  Open a second window in your web browser\
    \ (usually by selecting **File**▶**New Window**) and arrange your two windows\
    \ side by side, as shown in [Figure 5-4](#c05.xhtml#figure5-4). In your second\
    \ window, search for pictures that match your first genre.\n\n    ![Figure 5-4:\
    \ Arrange your two web browser windows side by side.](image_fi/500563c05/f05004.png)\n\
    \n    [Figure 5-4:](#c05.xhtml#figureanchor5-4) Arrange your two web browser windows\
    \ side by side.\n\n5.  Drag a picture (of the book cover, movie poster, game box,\
    \ or album cover) for your first genre and drop it in the training bucket in your\
    \ project.\n\n    You should see a thumbnail version of the picture in your training\
    \ bucket, as shown in [Figure 5-5](#c05.xhtml#figure5-5). If you don’t, try dragging\
    \ and dropping the picture again.\n\n    ![Figure 5-5: My first training example\
    \ for recognizing action movies](image_fi/500563c05/f05005.png)\n\n    [Figure\
    \ 5-5:](#c05.xhtml#figureanchor5-5) My first training example for recognizing\
    \ action movies"
  fmt: "\nIf you don’t want any of these misleading patterns to affect your ML model,\
    \ it helps to include `variety` in your training examples. Your project will work\
    \ best when your training photos include a lot of very different photos of the\
    \ same subject. When taking rock training photos, make a rock shape from every\
    \ different angle and direction that you can. Take some photos that are close\
    \ up and large, and some that are farther away and small. If you can take photos\
    \ with different backgrounds, even better. If the only thing that your rock training\
    \ examples have in common is a fist hand shape, that will be the pattern the computer\
    \ learns to recognize.\n\nWe’ll learn more about how to confuse ML models in Chapter\
    \ 14, but for now remember: `if the pictures in each training bucket have only\
    \ one thing in common with each other, then that’s the only pattern that the ML\
    \ model will learn to recognize`. \n\n## What You Learned\n\nIn this chapter,\
    \ you’ve trained another ML model to recognize pictures. In Chapter 3, you used\
    \ this to do a job: sorting photos. This time you used it to play a game of Rock,\
    \ Paper, Scissors against your computer by having it recognize your hand shape.\
    \ Both of these projects demonstrate `image recognition` and are good examples\
    \ of how it is used every day.\n\nYou’ve learned that the basic approach for training\
    \ computers in image recognition is to collect example photos, and you’ve learned\
    \ the important lesson of avoiding misleading patterns in your training data to\
    \ improve your results.\n\nComputers can learn to recognize more than just what’s\
    \ in a picture, however, so in the next chapter you’ll see some other patterns\
    \ that ML models can learn.\n\n![](image_fi/book_art/chapterart.png)\n\n# 5 Recognizing\
    \ Movie Posters\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png) In the last\
    \ two chapters, you collected training images to create an ML system that could\
    \ identify pictures of a certain object by learning to recognize the colors, shapes,\
    \ and patterns that the training images had in common.\n\nIn this chapter, you’ll\
    \ use the same technique to train a model to recognize the style of a picture\
    \ rather than its subject. For example, if you collect examples of watercolor\
    \ paintings in one training bucket, and examples of pen drawings in another training\
    \ bucket, you can train an ML model to recognize whether a picture is a watercolor\
    \ or a pen drawing.\n\nThe most common example of how this technique is used in\
    \ real life is in search engines. Image search engines can recognize the visual\
    \ style of images, allowing you to filter image search results by type (clip art,\
    \ line drawings, photos, and so on). These search engines use an ML model that\
    \ has been trained with a lot of examples of pictures of different styles to be\
    \ able to recognize the type of each search result.\n\nSome people use ML systems\
    \ to create entirely new pictures. This involves training a computer to recognize\
    \ the patterns found in works of art of a certain style, and then letting the\
    \ computer use what it has learned to generate new works of art in that style.\
    \ In 2018, an AI system created a painting that was auctioned as a work of art\
    \ for over $400,000.\n\nThis sort of project is called `computational creativity`\
    \ and has been used to create all sorts of things. AI systems have composed new\
    \ pieces of music and even invented recipes and meals.\n\nIn this chapter, you’ll\
    \ train an ML model that can recognize the genre of a work of art based only on\
    \ a picture of it.\n\nThink about what posters for certain movie genres have in\
    \ common. For example, thriller movie posters often have dark colors and large\
    \ letters. Romance movie posters often have light colors and flowery letters.\
    \ Science-fiction movie posters often have spaceships, stars, planets, and a black\
    \ background.\n\nWe all learn these patterns, often without realizing it, so that\
    \ we can recognize a movie’s genre just from seeing its poster (see [Figure 5-1](#c05.xhtml#figure5-1)).\n\
    \nIn this project, you’ll train the computer to recognize what works of art in\
    \ a particular genre have in common. For example, do posters for action movies\
    \ have anything in common? The box art for racing video games? The cover art for\
    \ rap albums? You’ll see whether a computer can learn to recognize these patterns\
    \ so that it can identify the genre of a work of art, such as a book, based just\
    \ on a picture of its cover or poster.\n\n ![Figure 5-1: ML models can learn to\
    \ recognize movie genres.](image_fi/500563c05/f05001.png)\n\n[Figure 5-1:](#c05.xhtml#figureanchor5-1)\
    \ ML models can learn to recognize movie genres.\n\nLet’s get started!\n\n## Build\
    \ Your Project\n\nChoose a type of art that can be grouped by genre and is represented\
    \ by a graphical cover or poster.\n\nFor example, you could choose:\n\n*   Books,\
    \ which are represented by book covers\n*   Movies, which are represented by movie\
    \ posters\n*   Video games, which are represented by box art\n*   Music albums,\
    \ which are represented by album covers\n\nYou’ll need to collect pictures of\
    \ your chosen works of art to be the training examples for this project. Look\
    \ for websites that group books, movies, games, or albums by genre. If you’ve\
    \ chosen books, the website for a bookstore or library is a useful source of training\
    \ examples. If you’ve chosen music albums or video games, retailer websites are\
    \ good places to try.\n\nNext, choose a few genres that you want to train the\
    \ computer to be able to recognize. Training the computer will be easier if you\
    \ choose genres that are obviously different. For example, it’s easier to recognize\
    \ the difference between posters for action movies than it is to recognize the\
    \ difference between adventure movies.\n\nFor the screenshots in this project,\
    \ I trained an ML model to recognize three genres—action, family, and drama—based\
    \ on their movie posters.\n\nOnce you’ve chosen your type of art and genres, you\
    \ can start your model.\n\n### Train Your Model\n\n1.  Create a new ML project,\
    \ name it `Judge a book by its cover`, and set it to recognize images. \n\n2.\
    \  Click **Train**, as shown in [Figure 5-2](#c05.xhtml#figure5-2).\n\n    ![Figure\
    \ 5-2: Train is the first phase of an ML project.](image_fi/500563c05/f05002.png)\n\
    \n    [Figure 5-2:](#c05.xhtml#figureanchor5-2) Train is the first phase of an\
    \ ML project.\n\n3.  Click **Add new label**, as shown in [Figure 5-3](#c05.xhtml#figure5-3),\
    \ and enter the name of your first genre.\n\n    ![Figure 5-3: Add new label to\
    \ create training buckets for your genres.](image_fi/500563c05/f05003.png)\n\n\
    \    [Figure 5-3:](#c05.xhtml#figureanchor5-3) Add new label to create training\
    \ buckets for your genres.\n\n4.  Open a second window in your web browser (usually\
    \ by selecting **File**▶**New Window**) and arrange your two windows side by side,\
    \ as shown in [Figure 5-4](#c05.xhtml#figure5-4). In your second window, search\
    \ for pictures that match your first genre.\n\n    ![Figure 5-4: Arrange your\
    \ two web windows side by side.](image_fi/500563c05/f05004.png)\n\n    [Figure\
    \ 5-4:](#c05.xhtml#figureanchor5-4) Arrange your two web windows side by side.\n\
    \n5.  Drag a picture (of the book cover, movie poster, game box, or album cover)\
    \ for your first genre and drop it in the training bucket in your project.\n\n\
    \    You should see a thumbnail version of the picture in your training bucket,\
    \ as shown in [Figure 5-5](#c05.xhtml#figure5-5). If you don’t, try dragging and\
    \ dropping the picture again.\n\n    ![Figure 5-5: My first training example for\
    \ recognizing action genres](image_fi/500563c05/f05005.png)\n\n    [Figure 5-5:](#c05.xhtml#figureanchor5-5)\
    \ My first training example for recognizing action genres.\n"
  trans: "\n\n如果你不希望这些误导性模式影响你的 ML 模型，那么在训练示例中包含`variety`（多样性）会有帮助。当你的训练照片包含许多张同一主题的不同照片时，你的项目效果最好。在拍摄石头训练照片时，尽可能从你可以看到的每一个不同角度和方向拍摄石头的形状。拍一些近景且较大的照片，再拍一些远处且较小的照片。如果你能拍摄不同背景的照片，效果更好。如果你的石头训练示例唯一的共同点是拳头形状，那么计算机将学习并识别的模式就是这种模式。\n\
    \n我们将在第 14 章中学习更多如何混淆 ML 模型，但现在请记住：`如果每个训练桶中的图片彼此之间只有一个共同点，那么这就是 ML 模型将要学习并识别的唯一模式`。\
    \ \n\n## 你学到了什么\n\n在本章中，你又训练了另一个 ML 模型来识别图片。在第 3 章中，你用它完成了一项任务：分类照片。这一次你用它通过让电脑识别你的手势，来和电脑玩剪剪刀石头布游戏。这两个项目都展示了`image\
    \ recognition`（图像识别），并且是其日常应用的良好示例。\n\n你已经学习了图像识别中训练计算机的基本方法是收集示例照片，并且你学习了在训练数据中避免误导性模式的重要技巧，以提高你的结果。\n\
    \n然而，计算机可以学习识别不仅是图片的内容，因此在下一章中，你将看到 ML 模型可以学习的其他一些模式。\n\n![](img/chapterart.png)\n\
    \n# 5 识别电影海报\n\n![Alphabet-I](img/Alphabet-I.png) 在过去的两个章节中，你收集了训练图像来创建一个 ML 系统，该系统通过学习识别训练图像共同的颜色、形状和模式，来识别特定对象的图片。\n\
    \n在本章中，你将使用相同的技术训练一个模型来识别图片的风格，而不是它的主体。例如，如果你在一个训练桶中收集水画的示例，在另一个训练桶中收集钢笔画的示例，你就可以训练一个\
    \ ML 模型来识别一张图片是水画还是钢笔画。\n\n这种技术在现实生活中最常见的例子是用于搜索引擎。图像搜索引擎可以识别图片的视觉风格，允许你按类型（剪贴画、线条画、照片等）过滤图像搜索结果。这些搜索引擎使用一个通过大量不同风格的图片示例训练的\
    \ ML 模型，以便识别每个搜索结果的类型。\n\n有些人使用 ML 系统来创建完全全新的图片。这涉及训练计算机来识别特定风格艺术作品中的模式，然后让计算机使用它学到的知识来生成该风格的新艺术作品。2018\
    \ 年，一个 AI 系统创作了一幅画，并作为艺术品以超过 400,000 美元的价格拍卖。\n\n这类项目被称为`computational creativity`（计算创意），已用于创建各种事物。AI\
    \ 系统已经创作了新的乐曲，甚至发明了食谱和菜。\n\n在本章中，你将训练一个 ML 模型，仅根据其图片就能识别艺术作品的类型。\n\n想想某些特定类型电影的海报有什么共同点。例如，惊悚电影海报通常有深色调和大字母。浪漫爱情电影海报通常有浅色调和花纹字母。科幻电影海报通常有飞船、星星、行星和黑色背景。\n\
    \n我们都会学习这些模式，而且往往在没有察觉的情况下，以便我们通过看海报就能识别电影的类型（参见图 5-1）。\n\n在这个项目中，你将训练计算机来识别特定类型艺术作品的共同点。例如，动作电影的海报有共同点吗？赛车视频游戏的盒装设计呢？说唱专辑的封面呢？你将看到计算机是否可以学习识别这些模式，以便它仅根据封面或海报的图片就能识别艺术作品（如书籍）的类型。\n\
    \n ![图 5-1：ML 模型可以识别电影类型](img/f05001.png)\n\n图 5-1： ML 模型可以学习并识别电影类型。\n\n让我们开始吧！\n\
    \n## 构建你的项目\n\n选择一种可以按类型分组并由图形封面或海报表示的艺术类型。\n\n例如，你可以选择：\n\n*   书籍，以书封表示\n*  \
    \ 电影，以电影海报表示\n*   视频游戏，以盒装设计表示\n*   音乐专辑，以专辑封面表示\n\n你需要收集你选择的艺术作品的图片作为该项目的训练示例。寻找按类型对书籍、电影、游戏或专辑进行分组的网站。如果你选择了书籍，书店或图书馆网站是训练示例的有用来源。如果你选择了音乐专辑或视频游戏，零售商网站是很好的尝试场所。\n\
    \n接下来，选择几个你想要训练计算机能够识别的类型。如果你选择明显不同的类型，训练计算机将变得更容易。例如，识别动作电影海报之间的差异比识别冒险电影海报之间的差异要容易。\n\
    \n对于此项目中的截图，我训练了一个 ML 模型来识别三个类型——动作、家庭和剧情——基于它们的海报。\n\n一旦你选择了艺术类型和类型，就可以开始你的模型。\n\
    \n### 训练你的模型\n\n1.  创建一个新的 ML 项目，将其命名为`Judge a book by its cover`，设置为识别图像。\n\n\
    2.  点击 **Train**，如图 5-2 所示。\n\n    ![图 5-2：这是 ML 项目的第一阶段](img/f05002.png)\n\n\
    \    图 5-2： 这是 ML 项目的第一阶段。\n\n3.  点击 **Add new label**，如图 5-3 所示，并输入第一个类型的名称。\n\
    \n    ![图 5-3：为你的类型创建训练桶](img/f05003.png)\n\n    图 5-3： 为你的类型创建训练桶。\n\n4.  在网络浏览器中打开第二个窗口（通常通过选择\
    \ **File**▶**New Window**），并将两个窗口并排排列，如图 5-4 所示。在第二个窗口中，搜索与你第一个类型的图片。\n\n    ![图\
    \ 5-4：将两个窗口并排排列](img/f05004.png)\n\n    图 5-4： 将两个窗口并排排列。\n\n5.  拖入一张第一个类型的图片（书封、电影海报、游戏盒或专辑封面），并将其丢入项目中的训练桶中。\n\
    \n    你应该会在训练桶中看到该图片的缩略图，如图 5-5 所示。如果没有，请尝试再次拖放图片。\n\n    ![图 5-5：我识别动作类型的第一个训练示例](img/f05005.png)\n\
    \n    图 5-5： 我识别动作类型的第一个训练示例。\n\n"
