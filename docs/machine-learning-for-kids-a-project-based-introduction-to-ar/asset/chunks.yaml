    \ and understand the way that humans use language.\n\nUnlike `Deep Blue`, `Watson`\
    \ was an ML system. It learned how to play the game show by being trained with\
    \ the questions from every *Jeopardy!* episode going back to the 1960s, as well\
    \ as by playing lots of practice matches against human competitors.\n\nPeople\
    \ still build AI systems like `Deep Blue` today, because simple AI systems that\
    \ follow step-by-step instructions written by people can still be useful. However,\
    \ `ML` can be used to build AI systems that do more complex and sophisticated\
    \ jobs.\n\n## Neural Networks and Deep Learning\n\nNeural networks and deep learning,\
    \ shown in [Figure 1-2](#c01.xhtml#figure1-2), are two types of `ML`. You won’t\
    \ learn about them in detail in this book, but since they’re often mentioned in\
    \ articles about AI, let’s talk about how they relate to AI.\n\nNeural networks\
    \ are a popular and very powerful technique for building `ML` systems. They have\
    \ proven effective at some very complex problems. Their structure is loosely based\
    \ on the structure of animal brains, with the different parts of the `ML` system,\
    \ called *neurons*, arranged in layers that are connected together.\n\nDeep learning\
    \ is a method for working with a neural network with a large number of layers,\
    \ and it’s one of the most effective techniques for building AI systems today.\n\
    \nRather than describing specific `ML` approaches like these, this book will focus\
    \ on `ML` in general. You’ll learn about how `ML` systems typically behave, how\
    \ they are trained and what issues can arise, and how they are used in the real\
    \ world. After reading this book, you’ll have the foundation you need to explore\
    \ more specific applications of `ML` like neural networks and deep learning if\
    \ you’re interested in doing so.\n\n## What You Learned\n\n`ML` means training\
    \ a computer to do a task by collecting examples of that task being performed.\
    \ It is a popular way of building AI projects because it enables us to train the\
    \ computer on more complicated tasks than we could describe with written step-by-step\
    \ instructions.\n\n![](image_fi/book_art/chapterart.png)\n\n# 2 Introducing Machine\
    \ Learning for Kids\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)n this book,\
    \ you’ll be building `ML` projects using a free educational tool called `Machine\
    \ Learning for Kids`. This chapter will introduce how the tool works, how you’ll\
    \ use it for each project, and how your parent or teacher can set it up for you.\n\
    \nYou can find `Machine Learning for Kids` at [https://MachineLearningForKids.co.uk/](https://MachineLearningForKids.co.uk/).\
    \ It’s a long web address to type, so it’s a good idea to save a bookmark the\
    \ first time you visit.\n\nThe home page is shown in [Figure 2-1](#c02.xhtml#figure2-1).\
    \ (As with all websites, the design will change slightly over time, so it might\
    \ look a little different than what’s shown here.)\n\n![Figure 2-1: Machine Learning\
    \ for Kids home page](image_fi/500563c02/f02001.png)\n\n[Figure 2-1:](#c02.xhtml#figureanchor2-1)\
    \ Machine Learning for Kids home page\n\n## Logging In\n\nThe first step for every\
    \ project in this book is to go to the `Machine Learning for Kids` site and log\
    \ in.\n\nClick `Log In` in the top menu bar. You’ll see the login screen shown\
    \ in [Figure 2-2](#c02.xhtml#figure2-2).\n\n![Figure 2-2: Machine Learning for\
    \ Kids login page](image_fi/500563c02/f02002.png)\n\n[Figure 2-2:](#c02.xhtml#figureanchor2-2)\
    \ Machine Learning for Kids login page\n\nYou have two choices here:\n\n1. **Log\
    \ in**: If your parent or teacher has already created a free account for you,\
    \ click `Log in` and enter your username and password. Logging in allows you to\
    \ save your projects and come back to them later.\n2. **Try it now**: If you don’t\
    \ have an account yet, click `Try it now`. You’ll still be able to work on a project,\
    \ but only for four hours. That’s long enough to complete any of the projects\
    \ in this book, but you won’t be able to come back to them later.\n\nThe `Sign\
    \ up` button, where your parent or teacher creates a free account for you, is\
    \ explained in “Creating an Account” on page 14.\n\n## Creating a New ML Project\n\
    \nOnce you’ve logged in, you’ll be taken to a list of your projects, shown in\
    \ [Figure 2-3](#c02.xhtml#figure2-3). You can get back to this list at any time\
    \ by clicking `Projects` in the top menu bar.\n\n![Figure 2-3: An empty projects\
    \ list](image_fi/500563c02/f02003.png)\n\n[Figure 2-3:](#c02.xhtml#figureanchor2-3)\
    \ An empty projects list\n\nTo create a new project, follow these steps:\n\n1.\
    \ Click `Add a new project` (see [Figure 2-3](#c02.xhtml#figure2-3)).\n2. Type\
    \ a name for your project in the `Project Name` box, shown in [Figure 2-4](#c02.xhtml#figure2-4).\
    \ Each chapter in the book will suggest a name for the project.\n3. Click `Recognising`,\
    \ shown in [Figure 2-4](#c02.xhtml#figure2-4). You should see a drop-down list\
    \ of different types of `ML` (for example, text or images) you want to teach the\
    \ computer to recognize. \n4. Click `Create`.\n5. You’ll be taken back to your\
    \ projects list, shown in [Figure 2-6](#c02.xhtml#figure2-6). Click the name of\
    \ the project you’ve created to get started.\n\n## Phases of an ML Project\n\n\
    There are three main phases to each project: Train, Learn & Test, and Make (see\
    \ [Figure 2-7](#c02.xhtml#figure2-7)).\n\nYou can switch to each phase by clicking\
    \ its blue button. The project instructions will tell you when it’s time to move\
    \ on to each phase.\n\n![Figure 2-7: Phases of an ML project](image_fi/500563c02/f02007.png)\n\
    \n[Figure 2-7:](#c02.xhtml#figureanchor2-7) Phases of an ML project\n\n### Train\n\
    \nIn the Train phase, you collect examples of what you want the computer to learn.\n\
    \nYou’ll create a bucket for each subcategory you’re training the computer to\
    \ recognize. Each bucket has a gray border, as shown in [Figure 2-8](#c02.xhtml#figure2-8).\n\
    \n![Figure 2-8: The Train phase](image_fi/500563c02/f02008.png)\n\n[Figure 2-8:](#c02.xhtml#figureanchor2-8)\
    \ The Train phase\n\nNext, you’ll fill those buckets with examples. For text projects,\
    \ that means collecting examples of writing that fall into each subcategory. In\
    \ [Figure 2-8](#c02.xhtml#figure2-8), the buckets include text examples of the\
    \ subcategories *something* and *something_else*. (In a real project, for the\
    \ text subcategory *kind*, you might add examples of compliments, while for the\
    \ text subcategory *mean*, you might add insults.) For image projects, you’ll\
    \ fill the buckets with examples of pictures that illustrate the subcategory.\
    \ For sound projects, you’ll collect examples of sound recordings that fit the\
    \ subcategory.\n\nThe number at the bottom right of each bucket is a handy counter\
    \ showing you how many examples you’ve collected so far.\n\nIf you’ve added an\
    \ example to a bucket by accident and want to get rid of it, move your mouse pointer\
    \ over it and click the red X.\n"
