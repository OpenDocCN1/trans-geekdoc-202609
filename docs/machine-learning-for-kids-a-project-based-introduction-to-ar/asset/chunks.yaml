    # 图表


    - 240. 图 13-1：唐纳德·米奇（Donald Michie）机器可学习井字交叉引擎，或 MENACE（来源：Matthew Scroggs, https://commons.wikimedia.org/wiki/File:Mscroggs-MENACE-cropped.jpg）

    - 241. 图 13-2：井字棋是机器学习研究的绝佳游戏。

    - 242. 图 13-3：从顶部菜单访问项目模板。

    - 243. 图 13-4：表示游戏板的一种方法是对单元格进行编号。

    - 244. 图 13-5：在 Scratch 项目模板中定义的游戏板表示

    - 245. 图 13-6：一个游戏板状态示例

    - 246. 图 13-7：准备项目

    - 247. 图 13-8：点击 `Train` 准备训练桶。

    - 248. 图 13-9：用于井字棋的训练桶

    - 249. 图 13-10：井字棋的训练示例

    - 250. 图 13-11：尽管我们还没有机器学习模型，也请点击 `straight into Scratch`。

    - 251. 图 13-12：找到 `setup model labels` 脚本。

    - 252. 图 13-13：用项目中的训练桶名称填充脚本。

    - 253. 图 13-14：找到自定义的 `define` 块。

    - 254. 图 13-15：向两个 `define` 脚本添加训练数据。

    - 255. 图 13-16：填充训练数据块。

    - 256. 图 13-17：检查是否已将交叉块与交叉脚本匹配。

    - 257. 图 13-18：检查你是否正确匹配了游戏板空间的名称。

    - 258. 图 13-19：确保你填满了所有的空间。

    - 259. 图 13-20：找到 `when I receive game over` 脚本。

    - 260. 图 13-21：每局游戏后训练一个新的机器学习模型。

    - 261. 图 13-22：玩一局井字棋。

    - 262. 图 13-23：将训练数据与图 13-22 中的游戏进行比较。

    - 263. 图 13-24：找到 `define use machine model` 脚本。

    - 264. 图 13-25：向脚本中添加 `recognise numbers(label)` 块。

    - 265. 图 13-26：确保你正确匹配了块名称。

    - 266. 图 13-27：我玩过的井字游戏的结果

    - 267. 图 14-1：我的第一个物体——柚子的照片

    - 268. 图 14-2：我的第二个物体——柠檬的照片

    - 269. 图 14-3：点击 `Train` 准备你的训练桶

    - 270. 图 14-4：为你的物体准备两个训练桶

    - 271. 图 14-5：将两个窗口并列排列并将照片拖入你的训练桶

    - 272. 图 14-6：将所有照片拖入训练桶

    - 273. 图 14-7：开始训练模型

    - 274. 图 14-8：更换测试照片的背景

    - 275. 图 14-9：测试时间！

    - 276. 图 14-10：点击 `Scratch 3` 测试你的模型

    - 277. 图 14-11：上传一个新角色（sprite）

    - 278. 图 14-12：编写一个短测试脚本

    - 279. 图 14-13：上传第二个角色并添加另一个脚本

    - 280. 图 14-14：我的模型测试结果

    - 281. 图 14-15：大部分照片都是背景

    - 282. 图 14-16：对比测试和训练照片以理解为什么模型错误

    - 283. 图 14-17：尝试在照片中放大物体

    - 284. 图 14-18：训练模型的更好方法

    - 285. 图 15-1：我选择的项目电影

    - 286. 图 15-2：机器学习项目的第一阶段

    - 287. 图 15-3：为每个电影创建一个训练桶

    - 288. 图 15-4：喜欢第一部电影的人会说的示例

    - 289. 图 15-5：为每个电影添加五个示例

    - 290. 图 15-6：创建一个机器学习模型

    - 291. 图 15-7：上传一个角色

    - 292. 图 15-8：创建一个代表你第一部电影的角色

    - 293. 图 15-9：为每个电影创建一个角色

    - 294. 图 15-10：创建此脚本

    - 295. 图 15-11：设计你的电影推荐应用

    - 296. 图 15-12：将一些示例移动到新电影

    - 297. 图 15-13：新电影的训练示例

    - 298. 图 15-14：更新你的项目添加第四部电影


