    \ Click Project templates in the top menu.](image_fi/500563c06/f06012.png)\n\n\
    \    [Figure 6-12:](#c06.xhtml#figureanchor6-12) Click **Project templates** in\
    \ the top menu.\n\n5.  Click the **Sorting Office** template, as shown in [Figure\
    \ 6-13](#c06.xhtml#figure6-13).\n\n    ![Figure 6-13: The Sorting Office project\
