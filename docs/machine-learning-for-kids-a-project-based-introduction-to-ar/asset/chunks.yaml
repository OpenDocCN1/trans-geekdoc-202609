    \ 12-15: Find the define nano-decision script.](image_fi/500563c12/f12015.png)\n\
    \n     [Figure 12-15:](#c12.xhtml#figureanchor12-15) Find the `define nano-decision`\
    \ script.\n\n13.  From the **Avoid the monster** group in the Toolbox, drag a\
    \ new `add training data` block to the script, as shown in [Figure 12-16](#c12.xhtml#figure12-16).\
    \ This block will add every move that you make while playing the game to your\
