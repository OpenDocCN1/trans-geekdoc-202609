- raw: "For this project, the best way to be sure of that is to take lots of photos\
    \ of your two objects with different places, backgrounds, lighting, sizes, angles,\
    \ and orientations. Change everything that you can think of between the training\
    \ examples, so that the only thing they have in common is the object itself.\n\
    \nFor example, [Figure 14-18](#c14.xhtml#figure14-18) shows a much better set\
    \ of training images for my grapefruit.\n\n![Figure 14-18: A better way to train\
