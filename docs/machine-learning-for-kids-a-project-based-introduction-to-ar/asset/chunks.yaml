    \ becoming very common. They’re often used for customer service, where companies\
    \ need to answer questions from the public about their products and services.\
    \ Frequently asked questions can be quickly and efficiently answered, with more\
    \ complex questions quickly redirected to human customer service representatives.\n\
    \nYou can find chatbots and virtual assistants on many websites and phone apps—taking\
    \ your pizza order, recommending clothing and fashion accessories, answering questions\
