    ![图 12-12：即使你还没有机器学习模型，也可以直接进入 Scratch。](img/f12012.png)


    图 12-12： 即使你还没有机器学习模型，也可以直接进入 Scratch。


    10. 点击屏幕右下角的 `Stage`（舞台）背景。在代码区找到第一个 `When Green Flag clicked`（点击绿旗时）脚本，如图 12-13
    所示。


    ![图 12-13：在代码区找到第一个较短的绿旗脚本。](img/f12013.png)


    图 12-13： 在代码区找到第一个较短的绿旗脚本。


    11. 在工具箱中点击 `Avoid the monster`（避开怪物），并将带有你的训练桶名称的区块拖入脚本中，如图 12-14 所示。确保方向匹配；例如，将
    `go_left` 拖入 `set left to` 区块。


    ![图 12-14：将你的项目标签添加到脚本。](img/f12014.png)


    图 12-14： 将你的项目标签添加到脚本。


    12. 向下滚动代码区，找到 `define nano-decision` 脚本，如图 12-15 所示。


    ![图 12-15：找到 define nano-decision 脚本。](img/f12015.png)


    图 12-15： 找到 `define nano-decision` 脚本。


    13. 从工具箱中的 `Avoid the monster` 组拖出一个新的 `add training data` 区块到脚本中，如图 12-16 所示。该区块会将你在玩游戏时的每一个移动添加到你的训练示例中。


    点击工具箱中的 `Variables`（变量），并将如图 12-16 所示的区块拖入 `add training data` 区块。对于每一次移动，你的角色和怪物的坐标将与你所做的决策一起添加到训练示例中。


    ![图 12-16：更新 define nano-decision 脚本。](img/f12016.png)


    图 12-16： 更新 `define nano-decision` 脚本。


    14. 现在你需要保存项目，以便以后回来。首先，在顶部菜单栏的 `Scratch Project` 框中输入 `Avoid the monster TRAINING`，如图
    12-17 所示。这告诉你该版本的项目是你玩游戏以训练机器学习模型的地方。


    然后点击 `File`（文件）▶`Save to your computer`（保存电脑）。


    ![图 12-17：在保存此版本之前更新项目名称。](img/f12017.png)


    图 12-17： 在保存此版本之前更新项目名称。


    15. 开始玩游戏！


    在屏幕右上角的控件中，点击全屏图标，然后点击绿旗开始游戏。像以前一样使用方向键控制 nano 角色。


    尽可能长时间避开怪物。你玩得越好，机器学习模型学得越好。


    当你觉得玩得足够久时，点击红色的停止标志。


    如果你如果你回到训练（Train）阶段，就可以看到你所做的移动，如图 12-18 所示。你可能需要刷新页面才能看到最新的示例。


    ![图 12-18：你在玩游戏时的移动应该显示在你的训练桶中。](img/f12018.png)


    图 12-18： 你在玩游戏时的移动应该显示在你的训练桶中。


    16. 再玩几次，直到你认为已经收集了 nano 可能遇到的所有情况。


    17. 现在是使用你收集的示例来训练机器学习模型了。点击 `Back to project`（返回项目），然后点击 `Learn & Test`（学习与测试），如图
    12-13 所示。

