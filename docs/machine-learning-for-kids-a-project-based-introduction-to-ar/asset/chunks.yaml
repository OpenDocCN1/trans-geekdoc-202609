    这本书令我感到欣喜的地方在于它具有极强的实用性，因为它引导你构建与现代计算机科学密切相关的 AI 系统。此外，这本书并没有避开困难的部分：在学习过程中，你将学习到在使用机器学习（ML）时的偏见和其他伦理问题——当你读完这本书并继续你的工作时，这些问题将变得越来越重要。


    我真希望我成长的时候能有这样一本书。但那时这种书是不可能存在的，因为这里介绍的大部分概念还没有被发明。所以，这是给你的挑战：在学习了 AI 和 ML 之后，你将发明什么目前还没有做过的东西？


    —Grady Booch


    IBM Fellow 士，IBM 研究中心软件工程首席科学家


    ![](img/chapterart.png)


    # 引言


    ![Alphabet-A](img/Alphabet-A.png)人工智能（AI）和机器学习（ML）系统影响着我们每一个人。我们大多数人每天都在使用 AI
    系统。它们影响着我们阅读和听到的的新闻；公司和政府做出的决策；以及我们选择购买、观看和听的内容。它们甚至会影响我们获得的工作和居住的地方。


    学习 AI 技术的极佳方法是尝试制作使用这些技术的工具，这正是本书将帮助你做的。构建自己的 AI 项目将帮助你理解这些技术的行为以及它们的能力。它也是对使用
    AI 所涉及风险的绝佳介绍，因为你将亲眼看到事情是如何出错的。


    根据 AI 在现实世界中的用途来创建自己的项目，也能让你大开眼界，了解 AI 系统究竟是如何影响我们每一个人的。当你学习日常 AI 应用是如何创建时，你可能会发现自己开始注意到周围的
    AI 系统和应用程序。这让你对我们周围世界的运作方式有更深入的洞察。


    新闻中经常讨论 AI 系统，但如果你对涉及的技术没有基础性的理解，可能很难思考这些故事意味着什么。书中的项目将使你能够关注并参与关于 AI 系统如何被使用、控制和监管的讨论。


    最后，书中的项目旨在好玩！机器学习是一个迷人的技术领域，它让我们能够创造出其他无法实现的东西。我希望你将享受构建你以前不知道如何构建的东西，并在过程中学习新的技术和工具。


    ## Scratch


    书中的每一章都通过引导你在教育编程平台 `Scratch` 中完成一个实践项目，介绍关于 ML 应用或使用的新概念。如果你在学校或编程俱乐部中使用过 Scratch，你可能已经熟悉它了。


    书中的 Scratch 项目都通过详细的逐步说明进行解释，所以即使你不是使用 Scratch 的专家，也不用担心。然而，如果你从未用过 Scratch，可能会发现访问
    Scratch 网站尝试一下很有用（[`scratch.mit.edu/`](https://scratch.mit.edu/)）。


    在我们开始之前，让我们来看几个要点，并介绍贯穿本书的 Scratch 术语。


    ### 在 Scratch 界面中操作


    Scratch 界面的主要部分在图 1 中标记。


    ![图 1：Scratch 3 界面](img/f00001.png)


    图 1： Scratch 3 界面


    1. `menu`（菜单）包含保存项目到文件或从文件加载项目的选项。它还包含指向项目模板库的链接，这是一组帮助节省时间的启动项目。

    2. `Toolbox`（工具箱）是一个色块面板，供你在程序中使用。

    3. `CodeArea`（代码区）是你在 Code（代码）标签页激活时创建程序的地方。将积块从 Toolbox 拖到 Code Area 上来创建你的项目。当
    Backdrops（背景）或 Costumes（造型）标签页激活时，此区域包含绘图和绘画工具，被称为 `canvas`（画布）。

    4. `controls`（控制按钮）允许你在想尝试时运行程序。绿色旗帜开始运行代码，停止标志停止它。最右侧带有四个箭头的按钮在全屏模式下运行你的程序。

    5. `Stage`（舞台）是你准备程序视觉部分的地方。你可以在这里移动项目中不同的组件。

    6. `Sprites`（角色）是执行项目中执行动作的物体。每个角色都有自己的外观（称为 `costume` 造型），并在 Code Area 中有它们自己的代码。

    7. `Backdrops`（背景）是你项目的背景。你可以绘制自己的背景，也可以从预制选项库中选择。


    ### 在 Scratch 中进行编码


    你通过从 Toolbox 拖动积块到 Code Area 来创建程序——这在 Scratch 中被称为 `script`（脚本）。当你将积块移动彼此靠近时，它们会吸在一起。


    #### 颜色匹配


    Scratch 积块按类别颜色编码。例如，`Motion blocks`（移动积块），即你用于移动角色的积块是蓝色的。要访问它们，请点击 Toolbox 中标记为
    Motion 的蓝色圆圈。


    当你为本书中的项目复制代码时，这种颜色编码将帮助你更容易地找到所需的积块。如果项目需要黄色积块，点击黄色的 Events（事件）圆圈，直接进入 Toolbox
    中的 Events 积块并选择你需要的那个。


    #### 创建自定义积块


    粉色积块是自定义积块。它们允许你将一个长脚本拆分成更小的部分，使其更容易阅读。


    要创建自定义积块，点击 Toolbox 中 My Blocks（我的积块）部分中的 `Make a Block`（添加积块），如图 2


    等待，在 `define` 积块下。


    #### 复制


    如果你正在创建一个具有相似部分的长脚本，你可以复制（duplicate）这些部分以节省时间。


    右键点击你想复制的代码部分并选择 `duplicate`。这个提示对于其中的几个项目非常有用。


    ### 保存你的工作


    在 Scratch 中创建脚本时，定期保存工作是重要的，因为 Scratch 不会为你完成这一点。


    要保存项目，点击菜单栏中的 `File`▶`Save to your computer`（保存到计算机），如图 4 所示。这将下载文件到电脑。妥善保存此文件——它是你创建的项目副本。


    ![图 4：Scratch 中的 File 菜单让你保存项目以便以后工作。](img/f00004.png)


    要再次打开此项目，点击 `File`▶`Load from your computer`（从计算机加载）并选择你保存的文件。


    ## 儿童机器学习


    书中的项目使用了 *Machine Learning for Kids*，这是一个免费的在线工具，它扩展了 Scratch 以添加你将使用的 ML 能力。如果你以前没用过这个工具不要担心。第
    2 章将涵盖你开始使用它所需的一切。


    ## 接下来是什么


    本书的结构如下：


    **第 1 章，什么是人工智能？**


    你将学习更多关于 AI 和 ML 的知识，以及为什么我们在项目中使用 ML 而不是传统的编程。


