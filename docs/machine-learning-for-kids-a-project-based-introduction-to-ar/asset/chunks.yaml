    ![图 9-22: 测试你的 ML 模型](img/f09022.png)


    图 9-22: 测试你的 ML 模型


    2. 尝试几次，看看你的模型做正确的概率有多大。在大场景中寻找一个小图像是一项复杂的工作，因此只用 10 个训练示例，它可能会犯几次错。


    3. 点击绿色旗帜（Green Flag）并像之前一样点击 `Train`，为每个桶添加 10 个训练示例。你可以在 `Train` 阶段检查你的新训练示例，如图
    9-23 所示。


    点击 `Back to project` 然后点击 `Learn & Test`，使用你更大的训练示例集训练新的 ML 模型。


    ![图 9-23: 尝试使用每组 20 个示例训练新的 ML 模型。](img/f09023.png)


    图 9-23: 尝试使用每组 20 个示例训练新的 ML 模型。


    4. 像以前一样再次测试。你的新 ML 模型寻找鸭子的能力变得更好了吗？


    ## 审查并改进你的项目


    你如何描述 ML 模型的表现如何？


    在第 8 章中，你学习了可以记录计算机判断正确和错误的次数：


    1. 真阳性（True positive）：计算机认为包含鸭子的瓷砖，且确实包含。

    2. 假阳性（False positive）：计算机认为包含鸭子的瓷砖，但实际上没有。

    3. 真阴性（True negative）：计算机认为不包含鸭子的瓷砖，且确实不包含。

    4. 假阴性（False negative）：计算机认为不包含鸭子的瓷砖，但实际上包含了。


    你可以使用这个计数绘制混淆矩阵，并计算 ML 模型的准确率（accuracy）、召回率（recall）和精确率（precision）。


    例如，查看图 9-24 中的测试图像。


    ![图 9-24: 一个测试图像，右下角的两个瓷砖被识别为匹配](img/f09024.png)


    图 9-24: 一个测试图像，右下角的两个瓷砖被识别为匹配


    鸭子出现在面板右下角的四个瓷砖中。我的 ML 模型识别出了其中两个。漏掉了两个。所以，我的混淆矩阵看起来像这样：


    | 真阳性 | 2 | 假阳性 | 0 |

    | :--- | :--- | :--- | :--- |

    | 假阴性 | 2 | 真阴性 | 8 |


    这个混淆矩阵告诉我：


    1. 精确率：100%（每当我的 ML 模型认为看到了鸭子时，那里确实有一个鸭子。）

    2. 召回率：50%（我的 ML 模型找到了包含鸭子的瓷砖的一半。）

    3. 准确率：83%（我的 ML 模型在 12 个总答案中给出了 10 个正确答案。）


    你需要更大的样本量，包括几种不同的背景，才能真正信任这些数字。


    我运行了五次测试，总体结果如下：


    | 真阳性 | 9 | 假阳性 | 0 |

    | :--- | :--- | :--- | :--- |

    | 假阴性 | 6 | 真阴性 | 45 |


    1. 精确率：100%

    2. 召回率：60%

    3. 准确率：90%


    这些数字为我们提供了一种更有意义的方式来描述 ML 模型的性能。


    我的模型仅用少量示例进行训练，看起来非常精确（当它识别出鸭子时，它总是正确的）。然而，它有时会漏掉东西。


    我们将这种有时会漏掉东西的精确模型描述为*精确率优于召回率 (favoring precision over recall)*。对于不产生错误识别同样重要的项目，这是一种很好的方法。


    对于不漏掉任何东西更重要、且允许偶尔出错的项目，你的目标是以*召回率优于精确率 (favors recall over precision)*的方式来训练
    ML 模型。


    你的项目表现如何？


    ## 复杂图像识别系统的现实应用


    你可能以前训练过类似的图像识别 ML 模型。你是否曾被网站要求通过点击图 9-25 所示的交通标志来证明你是人类？或者自行车？或者出租车？


    ![图 9-25: 帮助训练 ML 模型](img/f09025.png)


    图 9-25: 帮助训练 ML 模型


    希望你能够看到这种被称为 *CAPTCHA* 的图像识别应用将是为识别街道不同物品的图像识别系统收集大量训练示例的绝佳方法。你认为这对于自动驾驶汽车的发展有用吗？


    这里的基本思想在章节引言中描述。如果我们想在大图中寻找某个小物体，我们将图片切成较小的瓷砖，并使用训练识别它的 ML 模型单独测试每个瓷砖。


