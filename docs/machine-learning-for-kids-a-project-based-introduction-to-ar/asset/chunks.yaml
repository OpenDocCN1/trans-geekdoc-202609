    # 关于作者


    Dale Lane 是 IBM 的高级开发人员，拥有人工智能和机器学习背景。他曾为 IBM 客户开发过各种 AI 项目，并在 IBM 的 AI  Watson
    担任多年开发者。


    # 关于技术审核员


    Maya Posch 是一位软硬件开发人员，专注于 C++、Ada 和 VHDL。除了编写小说和非虚构作品外，她还担任自由开发人员工作。


    # 致谢


    这本书的出版得到了巨大的帮助，因此非常感谢 No Starch Press 的员工，包括我的出版商 Bill Pollock；我的编辑 Barbara Yien；我的制作编辑和文字编辑
    Rachel Monaghan；我的开发编辑 Patrick DiJusto 和 Athabasca Witschi；以及我的技术审核员 Maya Posch。


    非常感谢 MIT Media Lab 的“终身幼儿园”小组发明了 Scratch，他们富有远见地包含了一个通过新区块进行扩展的机制，并慷慨地免费提供所有内容（包括源代码）。他们让像《儿童机器学习》这样的项目成为可能。


    最后，我要感谢 Hursley 的 John Keble CofE 小学，允许我与他们的学生一起开发和测试书中的项目。


    # 前言


    当我父亲小时候，在世纪交替之后的伊利诺伊州长大——注意，不是*这个*世纪，而是*上一个*世纪——无线电刚刚起步，拉链刚刚发明，查理·卓林风靡一时，林德堡尚未飞越大西洋，《泰坦尼克号》沉没，T
    型车上市，世界上大部分地区仍由各种君主制或庞大的帝国统治。当我小时候，在德克萨斯州的大平原上长大时，我们刚刚让人类登上月球，电脑还是巨大且昂贵的巨兽，互联网尚未发明，塑料开始普及，除了极少数人之外，与世界另一端的人通话贵得令人望而却步。我在许多无闲的夏天下午在卧室里制作火药（对不起，妈妈！），发射模型火箭，梦想着去星辰。12
    岁时，我从零开始构建了自己的第一台电脑，当我说“从零开始”时，字面意思是从一个个晶体管、二极管、电阻开始的。我读了由斯坦福研究所的仁们编写的那个名为 Shakey
    的奇机器人，并在电影《2001 太空漫游》中入神。从那时起我就知道，我想建造带领人们通往星辰的电脑。


    更了不起的是，由于电脑变得如此廉价且计算能力如此强大，几乎任何人都可以学习如何使用电脑来构建东西，其限制仅是我们的想象力。这就是*计算思维*大显用场的地方，通过抽象和算法来理解世界的方法，它让我们将想象转化为在电脑上运行的系统成为可能。


    现在，这个世界和我父亲所经历的时代大然不同。在某些方面它更好，在另一些方面不是，但有一点没有改变，那就是我们梦想并努力让梦想变成现实的能力。今天，你可以使用手持设备获取世界的知识。你可以实时与世界另一端甚至是在太空中的人交谈并通话。汽车现在是电驱动的，其中一些还可以自动驾驶。我们不仅去过月球，而且火星现在完全由机器人居住，我们还向太阳系之外发送了太空器。多亏了电脑，我们能更少的投入产更多，我们创作了增强甚至超越现实的艺术，我们扩展了自己的身体和思想，并以比我们想象中得多、更广泛的方式研究宇宙。


    要编写一个处理财务、控制家里加热或计算发射到太空的火箭轨迹的程序，你主要通过符号来思考。但如果你想建造一辆自动驾驶的汽车、一个与人类安全交互的机器人或一个提供挑战性虚拟对手的视频游戏，你需要使用不同的操作电脑的方法，这就是人工智能和机器学习发挥作用的地方。从艾兰·图灵——计算领域的先驱之一时代起，计算机科学家一直试图让电脑像人类一样推理、学习和行为，而最近机器学习的进展使我们今天能够建造这样的东西。


    在书中，你将学习 AI 和 ML 的基础知识，足以让你构建自己的游戏和认知助手，以及能够识别语言和图像的程序。小时候，我父亲会认为你在这里所做的一切完全是魔法，但正如你将发现的，这并不是真正的魔法，它只是软件，而精通电脑完成这些事情完全在你的能力范围内。

