  trans: "\nAI 系统无法正确理解所有内容，因此你可以通过训练它来处理错误，改进你的机器学习（ML）项目。处理错误的好方法是训练你的 ML 模型识别何时有人对其给出的结果表示不满。\n\
    \n回到 `Train` 阶段，添加一个名为 `mistake` 的新训练桶（training bucket）。在其中填充一些用户可能抱怨 ML 模型犯了错误的具体示例，如图\
    \ 11-13 所示。\n\n例如，你可以在错误桶中添加 `That's not what I meant`（那不是我的意思）。\n\n![图 11-13:\
    \ 收集用户可能对模型犯错误的抱怨示例。](img/f11013.png)\n\n图 11-13： 收集用户可能对模型犯错误的抱怨示例。\n\n一旦你添加了至少五个示例，就需要返回\
    \ `Learn & Test` 阶段来训练一个新的 ML 模型。\n\n当你的聊天机器人识别出有人抱怨时，它能给出的简单响应就是向他们道歉。如图 11-14\
    \ 所示更新你的脚本。\n\n ![图 11-14: 更新你的脚本，以便在用户抱怨时进行道歉。](img/f11014_new.png)\n\n图 11-14：\
    \ 更新你的脚本，以便在用户抱怨时进行道歉。\n\n你可以通过记录错误让你的项目变得更好。例如，我创建了一个名为 `mistakes` 的新列表（要此操作，点击工具箱中的\
    \ `Variables`，点击 `Make a List` 并输入名称 `mistakes`），并如图 11-15 所示更新脚本，这样如果对得到的答案表示不满，他们的问题就会添加到列表中。\n\
    \n![图 11-15: 记录聊天机器人回答错误的问题。](img/f11015.png)\n\n图 11-15： 记录聊天机器人回答错误的问题。\n\n\
    当我问“谁第一个上月球的人？”时，我的模型告诉我月球离地球有多远。然后，当我回答“不，这不是我问的”时，我关于第一个上月球的人的问题被添加到 `mistakes`\
    \ 列表中。\n\n跟踪错误是改进现实 ML 项目常用技术。错误列表被用作示例集合，用于训练下一个版本的 ML 模型\n\n你还可以做什么来改进你的聊天机器人？\n\
    \n### 识别用户何时不满意\n\n聊天机器人用户并不总会在你的 ML 系统出错时告诉你。那么，是否还有其他方法可以判断它何时犯了错？\n\n在第 7 章中，你学习了训练\
    \ ML 模型来识别写作中的语气和情感。你可以将该技术与此项目结合，让你的聊天机器人识别用户何时变得愤怒或烦躁。\n\n训练两个 ML 模型：一个识别问题的含义（就像你刚刚做的那样），另一个识别情感（例如“烦躁”和“不烦躁”，类似于你在第\
    \ 7 章中的项目）。如果第二个 ML 模型对用户听起来很烦躁具有很高的置信度，你的聊天机器人应该道歉，而不是尝试再次回答问题。\n\n检测用户的语气并在必要时道歉，是与公众成员交流的聊天机器人（如客服）常用的技术。如果某些技术持续误解他们，人们会感到烦躁。如果系统能够识别情况不妙并道歉，客户可能会更开心。在这种情况下，这些系统通常还会要求人工客服代表或经理加入对话并提供帮助。\n\
    \n你还能做些什么来改进你的项目吗？\n\n### 仅在 ML 模型有信心时回答\n\n识别用户何时烦躁是一件好事。但更好的做法是从从就避免烦扰用户！你可以使用置信度分数来防止聊天机器人给出错误答案。\n\
    \n你在第 7 章中了解到，置信度分数是 ML 模型返回的百分比，显示了模型对其正确识别所训练过的任何内容有多大的信心。\n\n在这个项目中，如果置信度较低，意味着\
    \ ML 模型不确定自己是否理解了问题。你可以如图 11-16 所示修改聊天机器人代码，如果模型不理解问题，聊天机器人将道歉而不是简单地猜测答案，并且该问题会被添加到示例列表中，以便未来训练模型。\n\
    \n![图 11-16: 通过记录问题用于未来训练来处理低置信度分数。](img/f11016.png)\n\n图 11-16： 通过记录问题用于未来训练来处理低置信度分数。\n\
    \n## ML 与伦理\n\n这些改进项目的建议基于现实世界 ML 项目常用方法。正如你所看到的，收集训练数据需要大量精力。为了节省时间，一些使用 ML 的公司收集足够的训练示例使\
    \ ML 模型基本运行，然后允许客户开始使用（有时将其描述为 *beta* 版本以解释为什么仍然会出错）。然后，他们收集客户对 ML 模型的糟糕体验，以便改进他们的训练数据。这可能意味着收集\
    \ ML 模型置信度较低的问题示例，或者客户反馈答案没有帮助的情况。公司随后审核这些客户问题，并将它们分类到正确的训练桶中。\n\n公司说他们这样做是因为这意味着\
    \ ML 模型在未来回答问题时会做得更好。他们使用的训练示例越具有代表性，系统提供的答案就越好。但有时这会让人们感到惊讶，他们没有意识到向智能设备提出的问题会被制造商记录。尝试在网上搜索关于你喜喜欢的智能设备制造商监听人们提问的新闻报道。你能找到多少篇文章？你如何看待这些反应？\n\
    \n你认为这对于创建 ML 系统的人意味着什么？你认为 ML 开发人员从客户或用户那里收集训练示例符合伦理的吗？你认为他们应该告知用户正在发生这种情况？你会如何向可能不知道什么是训练示例或不知道为什么它们对训练\
    \ ML 系统如此重要的用户解释这一点？\n"
