    如果你想删除整个存储桶（bucket），包括其中所有的训练示例，请将鼠标悬停在存储桶的右上角并点击红色 X。请务必确认操作，因为一旦删除，存储桶将无法找回！


    ## 学习与测试


    一旦你收集了足够的示例，就可以使用它们进行训练了。下一章将介绍更多关于模型的内容。要开始训练过程，点击 `Train new learning model`（参见图
    2-9）。


    ![图 2-9：训练模型](img/f0209.png)


    图 2-9：训练模型


    ### 训练模型


    此过程所需的时间取决于项目类型以及你收集的示例数量。图像项目比文本项目耗时（计算机理解图像比理解文本困难得多）。示例越多，训练所需的时间就越长。有时 ML
    服务器可能会忙碌，需要更长的时间。


    训练过程可能需要 30 秒，也可能需要几分钟。请耐心等待！在等待期间，页面底部有一个测验。如果你收集的示例不够，将看不到 `Train new learning
    model` 按钮。返回训练阶段添加更多示例。


    ## 制作


    一旦你有了 ML 模型，就可以用它制作东西。你可以构建不同类型的项目，但书中的所有项目都使用 Scratch。如[图 2-10 所示，点击 `Scratch`。


    ![图 2-10：制作 ML 项目](img/f0210.png)


    图 2-10：制作 ML 项目


    现在你可以开始书中的项目了！但请记住，如果你想使用 `Log` 选项（而不是 Try now）以便保存项目，你需要请求成人为你创建一个账户。让我们现在来看一下。


    ## 创建账户


    创建账户是免费的，且只需操作一次。共有 10 个步骤，注册可能需要花费 10 分钟。本节介绍了你的家长、老师或编程领队需要遵循的说明。


    1. 点击 `Sign up`（如[图 2-2 所示）。

    2. 点击按钮确认你是家长、老师或编程领队。

    3. 点击“Create an unmanaged account”下的 `Sign up`。这意味着你将负责自己的账户并自己进行设置。

    4. 填写如图 2-11 所示的表。选择一个用户名并输入一个可以联系你的电子邮件地址。你还可以描述你计划如何使用该网站。


    ![图 2-11：创建家长/老师账户](img/f0211.png)


    图 2-11：创建家长/老师账户


    5. 你将收到一封邮件来验证你的邮箱地址。在继续下一步之前，请点击邮件中的链接。

    6. 使用你的家长/老师账户登录后，你就可以访问[图 2-12 所示的管理页面了。点击顶部菜单栏中的 `Teacher` 进入管理页面。


    ![图 2-12：家长/老师界面](img/f0212.png)


    [图 2-12：家长/老师界面


    7. 点击 `Restrictions` 查看你账户的默认限制。某些限制可以根据你的喜好进行更改。

    8. 点击 `API Keys` 输入来自 IBM Cloud 的代码，这些代码将为你的项目提供 ML 技术。你需要一个 Watson Assistant
    的密钥。要创建这些代码，你需要在 IBM Cloud 上创建一个免费账户。Watson Assistant 密钥是免费的。如果你不熟悉面向软件开发者的网站，IBM
    Cloud 网站可能会有些令畏。`https://machinelearningforkids.co.uk/apikeys-guide/` 上的逐步指南详细解释了具体该做什么。

    9. 点击 `Students` 为完成书中项目的学生创建一个用户名。如果有多个学生构建这些项目，你可以创建多个用户名。不需要使用真实姓名或为学生提供任何联系信息。学生的账户比老师的账户简单。学生不需要担心
    IBM 的 API 密钥或其他任何技术细节。如果他们忘记了密码，你可以在 `Students` 页面为他们重置。

    10. 点击 `Supervision` 查看学生创建的项目列表。除非有许多学生同时学习这本书，否则不太可能达到你添加的 API 密钥限制。如果发生这种情况，你可以在这里看到哪些项目正在使用这些
    API 密钥。


    ## 你学到了什么


    Machine Learning for Kids 是你在书中项目中将使用的免费工具。该工具将引导你完成主要阶段。


    '
