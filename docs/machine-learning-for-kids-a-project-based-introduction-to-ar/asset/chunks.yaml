    ## 第 2 章，青少年机器学习入门


    在这里，你将学习在书其余部分中将使用的工具，用于构建你自己的机器学习项目。


    书的其余部分将涵盖机器学习系统可以被训练用来识别的不同内容。


    ## 第 3 章，对动物图片分类


    在本章中，你将学习图像识别。你将训练计算机识别照片中的物体，然后让它自动对动物照片进行分类。


    ## 第 4 章，与电脑玩剪刀石头布


    在这个项目中，你将使用摄像头训练一个机器学习系统来识别不同的手势，这样你就可以和电脑玩剪刀石头布了！


    ## 第 5 章，识别电影海报


    你将学习如何训练计算机识别图片中的艺术风格，而不仅仅是物体。在训练计算机“通过外表判断书籍”之后，你将发现计算机是否能够学会创造。


    ## 第 6 章，邮件分类


    本章解释了计算机如何学习识别文字。然后你将构建一个简单的系统，使用手写识别对信封进行分类。


    ## 第 7 章，取笑计算机


    在本章中，你将学习如何训练计算机识别文字中的语气。你将训练一个电脑游戏角色来识别并回应你的赞美和讽。


    ## 第 8 章，识别报纸中的语言


    在这里，你将训练计算机识别不同的写作风格，以预测文章可能源自哪份报纸。我们还将讨论衡量机器学习系统优劣的方法。


    ## 第 9 章，在图片中寻找物体


    本章在之前的项目基础上，涵盖了如何训练计算机在图片中寻找较小的物体。我们将讨论这种技术在现实世界应用中的某些方式，例如处理卫星图像和训练自动驾驶汽车。


    ## 第 10 章，智能助手


    在本章中，你将看到如何训练计算机识别文本的含义，以及这项技术如何用于编写智能助手。你将制作一个简单的助手，它可以理解你的指令来开启或关闭不同的设备。


    ## 第 11 章，聊天机器人


    在这里你将学习聊天机器人，以及能够识别文本含义的计算机如何用于构建问答系统。


    ## 第 12 章，躲避怪物


    本章解释了电脑游戏如何被用于 AI 技术。你将训练一个机器学习系统来玩简化版的 `Pac-Man`（吃豆人）。


    ## 第 13 章，井字棋


    在这里你将看到电脑游戏与 AI 的另一个例子，通过重新创建一个著名的 AI 研究项目版本，训练计算机玩井字棋。


    ## 第 14 章，困扰计算机


    你将通过创建一个自己会犯错误的困惑 AI 系统，来亲眼观察机器学习项目最常见的出错方式。你将学习这些错误引起的问题，以及我们可以采取的避免这些错误的步骤。


    ## 第 15 章，偏见计算机


    在本章中，你将学习某些人如何刻意影响他们的机器学习项目给出的答案，以及这引发的一些 AI 伦理问题。


    ## 后记


    本书以展望 AI 的未来可能含有的变化作为结束。


    ![](img/chapterart.png)


    # 1 什么是人工智能？


    ![Alphabet-I](img/Alphabet-I.png)


    在书中，我们将通过基于机器学习的实际用途构建项目，来探索 AI 的不同方面。在我们开始之前，回顾一下我们将要使用的工具和技术的一些背景信息将很有用。


    在引言中，你认识了 Scratch 编程语言，并学习了 Scratch 界面每个部分的功能。本章将解释我们在书中其余部分将使用的几个基础编程术语和概念。


    ## 编码


    编码是我们告诉机器想要让它们做什么。我们经常使用代码来控制计算机，但也用它来控制手机、洗衣机等家用电器以及汽车和飞机等大型机器。


    要编写代码，我们首先必须理解想要让机器执行的任务，然后将该任务分解为一系列步骤。这些步骤需要足够具体和详细，以便机器遵循。


    某些编程语言（如 Scratch）尝试用代表这些步骤的彩色块来解释编码。你将色块拼接在一起，描述机器应该采取的步骤顺序，如图 1-1 所示。


    ![图 1-1: Scratch 使用拼接在一起的彩色块解释编码。](img/f01001.png)


    图 1-1： Scratch 使用拼接在一起的彩色块解释编码。


    将任务描述为机器遵循的一系列步骤几十年来一直是`software developers`（软件开发者）的工作。我们现在拥有更具表现力的编程语言，描述步骤变得比过去更容易，但基本思想仍然是一样的。


    然而，尽管编码很有用，但如今我们的机器如此复杂，仅仅有它已经不够了。例如，一辆新车有 1 亿行代码来完成所有不同的任务。这就像要编写 1 亿个步骤一样！


    我们想要机器执行的一些任务非常复杂，以至于为它们编写逐步的指令将花费太长时间——而且有时我们甚至不知道如何描述它们。


    对于这类任务，我们使用 ML。


    ## 机器学习


    对于那些步骤编写时间太长或描述得过于复杂的任务，机器学习非常有用。与其向机器描述任务的精确步骤，我们可以使用机器学习反复向机器展示该任务的示例，直到它学会如何执行。


    想象让某人踢球。你可以给他们精确的逐步指令：腿抬得多高、腿移动得多快、手臂怎么做等等。给他们逐步指令是“编码”的方法。


    相反，你可以向那人展示许多人踢不同球的示例，让他们通过这种方式学习。收集并展示任务的示例——被称为 `training`（训练）——是机器学习的方法。


    在整本书中，你将看到许多关于机器学习系统如何被训练、如何运行以及如何被使用的示例。


    ## 人工智能


    人们有时会混淆 ML 和 AI。一些有趣的 AI 系统是使用机器学习构建的，但它并不是构建 AI 系统的唯一方法。两者之间的关系如图 1-2](#c01.xhtml#figure1-2)
    所示。


    ![图 1-2: ML 与 AI 的关系](img/f01002.png)


    `Artificial intelligence`（人工智能）是一个通用术语，用于描述机器正在某些通常需要人类智能才能完成的事情。它并没有说明你*如何*让机器做那件事，而且你有许多种不同的技术可以使用。ML
    只是制作 AI 项目的一种方法（就像我们很快会讨论的神经网络只是机器学习的一种类型）。让我们来看一个例子来更好地理解区别。


    1997 年，一台名为 Deep Blue（深蓝）的计算机在象棋比赛中击败了世界冠军加里·卡斯帕罗夫。深蓝是一个 AI 项目，许多人将其描述为 AI 发展的里程碑。


    但它并不是机器学习系统。深蓝并没有学习如何下象棋或如何获胜；它是被程序好的。人们用游戏规则编写了系统，更重要的是编写了获胜策略。计算机只是按照给它的指令一步一步地执行。


    '
