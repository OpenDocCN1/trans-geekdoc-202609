  trans: '


    ![图 6-7: 学习与测试是机器学习项目的第二阶段。](img/f06007.png)

    图 6-7: 学习与测试是机器学习项目的的第二阶段。


    9. 点击`Train new machine learning model`（训练新的机器学习模型），如图 6-8 所示。


    计算机将使用你编写的示例来学习识别不同城市的代码。由于你所有的示例都是用同一支“笔”和同一种颜色绘制的，计算机在识别这类编写的代码时可能效果最好。


    训练过程可能需要几分钟时间。


    ![图 6-8: 训练一个新的机器学习模型来识别邮政编码。](img/f06008.png)

    图 6-8: 训练一个新的机器学习模型来识别邮政编码。


    10. 是时候测试你的机器学习模型了！在之前的项目中，你通过直接进入 Scratch 并查看计算机识别和分类你从互联网下载或用网络摄像头拍摄的照片的效果如何来完成的。这一次，我们将先在这里测试模型，在进入
    Scratch 之前确保我们对它满意。


    点击`Test by drawing`（通过绘制测试）来测试你的机器学习模型，如图 6-9 所示。尝试为你的城市编写代码，看看计算机识别你所写内容的能力有多好。


    ![图 6-9: 测试是机器学习项目的重要部分。](img/f06009.png)

    图 6-9: 测试是机器学习项目的重要部分。


    如果你没有看到`Test by drawing`按钮，说明你的机器学习模型尚未完成训练。你可能需要再等待一或两分钟。


    如果你对机器学习模型识别邮政编码的效果不满意，可以回到 Train（训练）阶段并添加更多示例。通常，你使用的训练示例越多，你的机器学习模型表现就越好。记住再次点击`Train
    new machine learning model`以使用新示例更新你的机器学习模型。


    ### 准备你的项目


    现在你将通过在 Scratch 中创建一个使用你的 OCR 系统对信封进行虚拟邮件分类办公室来进一步测试你的机器学习模型。


    1. 点击屏幕左上角的`Back to project`（返回项目）。


    2. 点击`Make`，如图 6-10 所示。


    ![图 6-10: Make 是机器学习项目的第三阶段。](img/f06010.png)

    图 6-10: 制作是机器学习项目的第三阶段。


    3. 点击`Scratch 3`，然后点击`Open in Scratch 3`打开一个带有 Scratch 的新窗口。你应该能在工具箱中看到一个新区域，如图
    6-11 所示，其中包含来自你的“Sorting Office”（分拣中心）项目的模块。


    ![图 6-11: 带有你的机器学习模型模块的 Scratch 3](img/f06011.png)

    图 6-11: 带有你的机器学习模型模块的 Scratch 3


    4. 在 Scratch 窗口顶部，点击`Project templates`（项目模板），如图 6-12 所示。


    这让你能够访问示例项目和启动代码，帮助你节省时间。


    ![图 6-12: 在顶部菜单点击 Project templates。](img/f06012.png)

    图 6-12: 在顶部菜单点击`Project templates`。


    5. 点击`Sorting Office`分拣中心）模板，如图 6-13 所示。


    ![图 6-13: Sorting Office 项目模板](img/f06013.png)

    图 6-13: Sorting Office 项目模板


    6. 点击`Stage`（舞台）背景，如图 6-14 所示。


    ![图 6-14: 点击 Sorting Office 项目的 Stage 背景。](img/f06014.png)

    图 6-14: 点击 Sorting Office 项目的`Stage`背景。


    7. 点击`Backdrops`（背景）标签页，如图 6-15 所示。


    8. 使用`Text`（文本）工具编辑邮件袋上的标签。编辑三个袋子，使它们的标签与你选择的城市名称匹配。如果放不下，请调整。


    ![图 6-15: 邮件袋上的标签。](img/f06015.png)

    *(注：此处原文未提供图 6-15 的文字描述，根据上下文推断)*


    9. 为你的城市编写代码，看看计算机识别你所写内容的能力有多好。


    10. 是时候测试你的机器学习模型了！


