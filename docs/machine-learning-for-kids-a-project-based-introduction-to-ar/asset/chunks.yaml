- raw: "    ![Figure 9-22: Testing your ML model](image_fi/500563c09/f09022.png)\n\
    \n    [Figure 9-22:](#c09.xhtml#figureanchor9-22) Testing your ML model\n\n2.\
    \  Try it a few times and see how often your model gets it right. Finding a small\
    \ image inside of a large scene is a complex job, so with only 10 training examples,\
    \ it will probably make a few mistakes.\n\n3.  Add another 10 training examples\
    \ to each bucket by clicking the Green Flag and clicking **Train** as you did\
    \ earlier. You can check your new training examples back in the Train phase, as\
    \ shown in [Figure 9-23](#c09.xhtml#figure9-23).\n\n    Click **Back to project**\
    \ and then **Learn & Test** to train a new ML model with your larger set of training\
    \ examples.\n\n    ![Figure 9-23: Try training a new ML model using 20 examples\
    \ of each group.](image_fi/500563c09/f09023.png)\n\n    [Figure 9-23:](#c09.xhtml#figureanchor9-23)\
    \ Try training a new ML model using 20 examples of each group.\n\n4.  Test again\
    \ as you did before. Is your new ML model better at finding the duck?\n\n## Review\
    \ and Improve Your Project\n\nHow can you describe how well the ML model is doing?\n\
    \nIn Chapter 8, you learned that you can keep a count of the number of times the\
    \ computer gets things right and wrong:\n\n1.  True positive  Tiles the computer\
    \ thought included the duck, and did\n\n2.  False positive  Tiles the computer\
    \ thought included the duck, but didn’t\n\n3.  True negative  Tiles the computer\
    \ thought didn’t include the duck, and didn’t\n\n4.  False negative  Tiles the\
    \ computer thought didn’t include the duck, but did\n\nYou can use this count\
    \ to draw up a confusion matrix and calculate the accuracy, recall, and precision\
    \ of your ML model.\n\nFor example, look at the test image in [Figure 9-24](#c09.xhtml#figure9-24).\n\
    \n![Figure 9-24: A test image with the two bottom-right tiles recognized as a\
    \ match](image_fi/500563c09/f09024.png)\n\n[Figure 9-24:](#c09.xhtml#figureanchor9-24)\
    \ A test image with the two bottom-right tiles recognized as a match\n\nThe duck\
    \ was present in the four tiles in the bottom right of the board. Two of them\
    \ were recognized by my ML model. Two were missed. So, my confusion matrix looks\
    \ like this:\n\n| **True positives**  \n\n2 || **False positives**  \n\n0 |\n\n\
    | --- | --- |\n\n| **False negatives**  \n\n2 || **True negatives**  \n\n8 |\n\
    \nThis confusion matrix gives me:\n\n1.  Precision: 100%\n\n    (Every time my\
    \ ML model thought it saw a duck, there was a duck there.)\n\n2.  Recall: 50%\n\
    \n    (My ML model found half of the tiles that contained a duck.)\n\n3.  Accuracy:\
    \ 83%\n\n    (My ML model gave 10 correct answers out of 12 total answers.)\n\n\
    You need a larger sample size, including several different backgrounds, to really\
    \ trust these numbers.\n\nI ran this test five times, and my overall results were\
    \ as follows:\n\n| **True positives**  \n\n9 || **False positives**  \n\n0 |\n\
    \n| --- | --- |\n\n| **False negatives**  \n\n6 || **True negatives**  \n\n45\
    \ |\n\n1.  Precision: 100%\n\n2.  Recall: 60%\n\n3.  Accuracy: 90%\n\nThese numbers\
    \ give us a more meaningful way of describing the performance of the ML model.\n\
    \nMy model, which was trained with only a small number of examples, seems to be\
    \ very precise (when it recognizes a duck, it is always correct). However, it\
    \ misses things sometimes.\n\nWe describe a precise model that sometimes misses\
    \ things as *favoring precision over recall*. This is a good approach for projects\
    \ where it is important not to falsely recognize things.\n\nFor projects where\
    \ it is more important to not miss anything, and where it is okay to make the\
    \ occasional mistake, you would aim to train ML models in a way that *favors recall\
    \ over precision* instead.\n\nHow is your project performing?\n\n## Real-World\
    \ Applications for Complex Image Recognition Systems\n\nYou might have trained\
    \ an image recognition ML model like this before. Have you ever been asked by\
    \ a website to prove that you’re a human by clicking pictures of street signs\
    \ as in [Figure 9-25](#c09.xhtml#figure9-25)? Or bicycles? Or taxis?\n\n ![Figure\
    \ 9-25: Helping to train an ML model](image_fi/500563c09/f09025.png)\n\n[Figure\
    \ 9-25:](#c09.xhtml#figureanchor9-25) Helping to train an ML model\n\nHopefully\
    \ you can see how this kind of image recognition application, known as a *CAPTCHA*,\
    \ would be a great way to collect a large number of training examples for an image\
    \ recognition system that can find different things on the street. Do you think\
    \ this would be useful in the development of self-driving cars?\n\nThe basic idea\
    \ here is described in the chapter’s introduction. If we want to find something\
    \ small in a larger picture, we chop the picture up into smaller tiles and test\
    \ each tile individually with an ML model trained to recognize pictures of that\
    \ object.\n\nYou probably have a feel for the sorts of challenges of this technique\
    \ from training it yourself. For example, one of the biggest problems is deciding\
    \ what size tiles to use. Remember the example of finding the tree in [Figure\
    \ 9-1](#c09.xhtml#figure9-1)?\n\nIf you make your tiles too small, you might only\
    \ ever see a small section of the object you’re trying to find and never recognize\
    \ it. For example, your ML model might not recognize [Figure 9-26](#c09.xhtml#figure9-26)\
    \ as a tree.\n\n ![Figure 9-26: A tile that includes only part of the tree](image_fi/500563c09/f09026.png)\n\
    \n[Figure 9-26:](#c09.xhtml#figureanchor9-26) A tile that includes only part of\
    \ the tree\n\nOn the other hand, if you make your tiles too big, as in [Figure\
    \ 9-27](#c09.xhtml#figure9-27), you still have the problem of there being too\
    \ much in the picture that *isn’t* the tree, which will challenge an ML model\
    \ trained to recognize pictures of trees.\n\n![Figure 9-27: A tile that is too\
    \ large to focus on the tree](image_fi/500563c09/f09027.png)\n\n[Figure 9-27:](#c09.xhtml#figureanchor9-27)\
    \ A tile that is too large to focus on the tree\n\nIf you know the likely size\
    \ of the object you’re looking for in the picture, you can make a sensible estimate\
    \ for the right tile size to use. Some systems even ask users to specify the tile\
    \ size to use.\n\nIf neither of these solutions is an option, you can try a wide\
    \ variety of tile sizes and use the result that gives your model the highest confidence,\
    \ as shown in [Figure 9-28](#c09.xhtml#figure9-28).\n\nEven if you get the grid\
    \ size right, the object you’re looking for won’t always fit neatly in the middle\
    \ of a tile (as you probably noticed with the duck).\n\n ![Figure 9-28: Try a\
    \ variety of tile sizes if you have no way to know the best size.](image_fi/500563c09/f09028.png)\n\
    \n[Figure 9-28:](#c09.xhtml#figureanchor9-28) Try a variety of tile sizes if you\
    \ have no way to know the best size.\n\nTo improve your chance of finding a tile\
    \ with the object you want in the middle, you also need to try different starting\
    \ positions.\n\nSystems that use a combination of these techniques can be very\
    \ effective. For example, in 2015, during a state of emergency caused by a drought\
    \ in California, an ML model was used to find lawns, swimming pools, and other\
    \ features that affect water usage.\n\nCutting the satellite images for the whole\
    \ state into tiles, just as you’ve done in your project, meant each tile could\
    \ be individually classified. The main difference was that the California ML model\
    \ was trained to recognize not just one thing, but several different things, that\
    \ impact water usage. (You saw in Chapter 3 how you can train an ML model to recognize\
    \ pictures of different objects.) Combining image recognition with a map meant\
    \ California officials could quickly understand the impact of water usage across\
    \ the state.\n\nCalifornia is a huge state, and to manually perform such a census\
    \ or survey would have taken a long time. ML was a fast and efficient way to come\
    \ up with a useful estimate, and in times of emergency, speed and efficiency are\
    \ very important."
