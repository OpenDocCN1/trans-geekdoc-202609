- raw: "If you’d prefer not to draw, you can click Choose a Backdrop or Choose a Sprite\
    \ to select a premade option. Or, you can click Upload a Sprite or Upload a Backdrop\
    \ to use pictures you’ve saved from the internet. For example, if you’re making\
    \ a chatbot about your favorite band, you could use a photo of them. If you’re\
    \ making a chatbot about a school or company, you could use its logo.\n\nOnce\
    \ you’ve created your chatbot scene, make sure you save your Scratch project,\
    \ as you’ll need it later. If you’re not sure how to do that, read the section\
    \ “Saving Your Work” on page xxiv in the introduction.\n\n### Train Your Model\n\
    \n1.  Create a new ML project, name it `Chatbot`, and set it to learn to recognize\
    \ text in your preferred language. \n\n2.  Click **Train**, as shown in [Figure\
    \ 11-4](#c11.xhtml#figure11-4). \n\n    ![Figure 11-4: Train is the first phase\
    \ of an ML project.](image_fi/500563c11/f11004.png)\n\n    [Figure 11-4:](#c11.xhtml#figureanchor11-4)\
    \ Train is the first phase of an ML project.\n\n3.  Think of the most common question\
    \ people might ask about your chosen topic.\n\n    For my topic, the moon, I’m\
    \ guessing that people will ask how big the moon is.\n\n    When you’ve chosen\
    \ your first question, click **Add new label**, as shown in [Figure 11-5](#c11.xhtml#figure11-5),\
    \ and type in a word or two that represents that question. For example, I used\
    \ size for my training bucket label.\n\n    ![Figure 11-5: Create a bucket to\
    \ represent examples of your first question.](image_fi/500563c11/f11005.png)\n\
    \n    [Figure 11-5:](#c11.xhtml#figureanchor11-5) Create a bucket to represent\
    \ examples of your first question.\n\n4.  Click **Add example** and enter a way\
    \ to ask that question, as shown in [Figure 11-6](#c11.xhtml#figure11-6). \n\n\
    \    ![Figure 11-6: Add examples of different ways to ask the first question.](image_fi/500563c11/f11006.png)\n\
    \n    [Figure 11-6:](#c11.xhtml#figureanchor11-6) Add examples of different ways\
    \ to ask the first question.\n\n    Think of how different people might phrase\
    \ the question when they ask it. You don’t need to worry about the answer for\
    \ now.\n\n    Type in as many ways of asking this question as you can think of,\
    \ making sure you have at least five examples. These examples will be used to\
    \ train an ML model to recognize when someone is asking this question.\n\n   \
    \ If your chatbot looks like the topic you’re asking questions about (like my\
    \ cartoon moon answering questions about the moon), then you could include some\
    \ example questions directed to the character, such as “How big are you?”.\n\n\
    5.  Think of more types of questions about your topic. Click **Add new label**\
    \ again to create a training bucket for each type of question, and **Add example**\
    \ to add examples of how to ask that question. As before, you need at least five\
    \ examples for each type of question.\n\n    For my project, I started with four\
    \ types of questions, with five examples for each (see [Figure 11-7](#c11.xhtml#figure11-7)).\
    \ Your project will vary depending on your topic and the number of questions you\
    \ can think of for it.\n\n    ![Figure 11-7: Write examples of the different types\
    \ of questions someone could ask.](image_fi/500563c11/f11007.png)\n\n    [Figure\
    \ 11-7:](#c11.xhtml#figureanchor11-7) Write examples of the different types of\
    \ questions someone could ask.\n\n    For your topic, you’re guessing what the\
    \ most common questions are and imagining the different ways that people might\
    \ ask them. Real-world ML projects often collect these examples from actual customers\
    \ or users so that the computer can learn what questions are really being asked,\
    \ and how. For example, a shop training a virtual assistant to answer questions\
    \ about setting up televisions will keep a record of questions that customers\
    \ have called to ask in the past. Or a bank training a virtual assistant to answer\
    \ questions about savings accounts will keep a record of questions customers have\
    \ typed into chat windows on the bank’s website. Both businesses can use these\
    \ examples of real questions phrased by real people to train their ML models.\n\
    \n    We saw in Chapter 3 that ML models give better answers when trained with\
    \ data that is similar to what the project will need to do. You learned that if\
    \ you want an ML model to recognize photos of different animals, you should train\
    \ it with photos, and if you want it to recognize cartoons, you should train it\
    \ with cartoons.\n\n    Text ML models work in a similar way. When we train them\
    \ with questions phrased in the way that real people ask questions, they’ll give\
    \ better answers. The best way to do this for real-world ML projects is to find\
    \ existing examples rather than making them up like we’re doing for this project.\n\
    \n6.  Click **Back to project** in the top-left corner of the screen.\n\n7.  Click\
    \ **Learn & Test**, as shown in [Figure 11-8](#c11.xhtml#figure11-8).\n\n    ![Figure\
    \ 11-8: Learn & Test is the second phase of an ML project.](image_fi/500563c11/f11008_new.png)\n\
    \n    [Figure 11-8:](#c11.xhtml#figureanchor11-8) Learn & Test is the second phase\
    \ of an ML project.\n\n8.  Click **Train new machine learning model**, as shown\
    \ in [Figure 11-9](#c11.xhtml#figure11-9).\n\n    The computer will use the examples\
    \ you’ve written to learn how to recognize questions that people ask about your\
    \ topic. This process might take a minute or so. The computer is using this time\
    \ to learn what the questions in each training bucket have in common, such as\
    \ the words you used, the way you phrased the questions, how short or long the\
    \ questions are, and much more.\n\n![Figure 11-9: Train an ML model using the\
    \ examples that you’ve written.](image_fi/500563c11/f11009.png)\n\n[Figure 11-9:](#c11.xhtml#figureanchor11-9)\
    \ Train an ML model using the examples that you’ve written.\n\n### Prepare Your\
    \ Project\n\nNow that you have a character and an ML model, it’s time to combine\
    \ them to create your chatbot.\n\n1.  Click **Back to project** in the top-left\
    \ corner of the screen.\n\n2.  Click **Make**, as shown in [Figure 11-10](#c11.xhtml#figure11-10).\n\
    \n    ![Figure 11-10: Make is the third phase of an ML project.](image_fi/500563c11/f11010.png)\n\
    \n    [Figure 11-10:](#c11.xhtml#figureanchor11-10) Make is the third phase of\
    \ an ML project.\n\n3.  Click **Scratch 3**, and then click **Open in Scratch\
    \ 3**. Scratch will open with a new set of blocks for your Chatbot ML project.\n\
    \n4.  Click **File**▶ **Load from your computer**,  as shown in [Figure 11-11](#c11.xhtml#figure11-11),\
    \ to open the project you saved earlier with your chatbot scene.\n\n    ![Figure\
    \ 11-11: Open the project with the scene you created before.](image_fi/500563c11/f11011.png)\n\
    \n    [Figure 11-11:](#c11.xhtml#figureanchor11-11) Open the project with the\
    \ scene you created before.\n\n5.  Copy the script shown in [Figure 11-12](#c11.xhtml#figure11-12).\n\
    \n    ![Figure 11-12: Sample script to create a simple chatbot](image_fi/500563c11/f11012.png)\n\
    \n    [Figure 11-12:](#c11.xhtml#figureanchor11-12) Sample script to create a\
    \ simple chatbot\n\n    This script will ask you to type in a question and then\
    \ use the ML model you’ve trained to recognize what you asked.\n\n    Your script\
    \ should differ from mine, as mine has the questions about the moon that I trained\
    \ my ML model with. Be sure to use your question types instead.\n\n    You’ll\
    \ also need to put the answers to the questions on your topic here. If you don’t\
    \ know them, now’s the time to do some research to find the answers your chatbot\
    \ should give!\n\n6.  Click **File**▶**Save to your computer** to save your project.\n\
    \n### Test Your Project\n\nClick the Green Flag and try asking your chatbot a\
    \ question. Does it give you the right answer?\n\n## Review and Improve Your Project\n\
    \nYou’ve created a simple chatbot that can recognize and answer the most common\
    \ questions about a topic of your choice. Well done!\n\nWhat could you do to improve\
    \ your chatbot?\n\n### Responding and Recording When Users Report Mistakes"
