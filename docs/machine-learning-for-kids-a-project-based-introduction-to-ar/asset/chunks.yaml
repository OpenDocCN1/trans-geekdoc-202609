    ![Figure 3-17:](#c03.xhtml#figureanchor3-17) Example code for sorting photos of
    animals


    This code will go through each of your test photo costumes and use your ML model
    to recognize the animal and move it to the correct section.


    1. The `go to x: 10 y: -145` block 1 sets the starting position for each photo.
    This script will start each photo at the bottom middle of the screen. Adjust these
    coordinates to a starting position that fits with your backdrop.

    2. The `recognise image` block 2 uses your ML model to recognize the photo.

    3. The `glide to x: pick random -200 to -50 y: pick random 50 to 150` block 3
    moves the photo to a random position in the top left of the screen. Adjust these
    coordinates to the location on your backdrop where you want the photos of your
    first type of animal to go.

    4. `The glide to x: pick random 70 to 210 y: pick random 50 to 150` block 4 moves
    the photo to a random position in the top right of the screen. Adjust these coordinates
    to the location on your backdrop where you want the photos of your second type
    of animal to go.

    5. The number in `if my variable is < 14`5 refers to how many test photos you
    have. Set this value to the number of test costumes you saved in step 2 and uploaded
    in step 8. I have 14 costumes in my test sprite, so my script goes through 14
    test photos.


    ### Test Your Model


    To test the model you’ve created, click the Green Flag in the top-left corner,
    as shown in [Figure 3-18](#c03.xhtml#figure3-18). Your model will sort your test
    photos into two groups of animals.


    Count how many photos your model moves to the correct side. That’s a simple way
    to measure how good your project is at sorting photos of your two animals.


    ![Figure 3-18: Recognizing photos and sorting them into groups](image_fi/500563c03/f03018.png)


    ![Figure 3-18:](#c03.xhtml#figureanchor3-18) Recognizing photos and sorting them
    into groups


    If your model is getting a lot wrong, you can try to improve it using more training
    examples. Go back to the Train phase and drag in more photos of each of your animals.
    Then go back to the Learn & Test phase and train the new, improved ML model. Run
    your Scratch script again to see if the new model sorts more of your test photos
    correctly.


    ## Review and Improve Your Project


    You’ve successfully trained an ML model to recognize photos of animals! This project
    isn’t based on rules. You haven’t described how different animals look or given
    the computer specific instructions on how to recognize them. Instead, you’ve used
    ML to train the computer to do it. This approach is known as `supervised learning`
    because you supervised the process by preparing sets of training examples for
    the computer to use.


    As long as your test photos are similar to your training photos, your model should
    work. However, if you test your model with pictures that differ somehow from your
    training photos, you’ll probably get different results.


    For example, I tried replacing the costumes in my Scratch project with cartoon
    illustrations of cows and sheep instead of photographs. Then I ran my code again
    by clicking the Green Flag. As you can see in [Figure 3-19](#c03.xhtml#figure3-19),
    my new model got a lot wrong.


    ![Figure 3-19: ML models get a lot wrong if the test inputs aren’t similar to
    the training inputs.](image_fi/500563c03/f03019.png)


    ![Figure 3-19:](#c03.xhtml#figureanchor3-19) ML models get a lot wrong if the
    test inputs aren’t similar to the training inputs.


    I got these results because the patterns my model learned to recognize from the
    training photos weren’t useful to help it recognize cartoon drawings. If you want
    a computer to be able to recognize photographs *and* cartoons, you need to train
    it with both.


    Go back to the Train phase and create a new set of training examples that includes
    both photographs and cartoons, as shown in [Figure 3-20](#c03.xhtml#figure3-20).
    I collected 10 example photos and 10 example cartoons in each bucket.


    ![Figure 3-20: Training a computer to recognize both photos and cartoons](image_fi/500563c03/f03020.png)


    ![Figure 3-20:](#c03.xhtml#figureanchor3-20) Training a computer to recognize
    both photos and cartoons


    Then go back to the Learn & Test phase and train a new ML model using your new
    set of training examples. This new set should teach the computer to identify patterns
    in photographs and cartoons so it can recognize both. [Figure 3-21](#c03.xhtml#figure3-21)
    shows how much better my updated ML model performed.


    ![Figure 3-21: Testing with a mixture of photographs and drawings](image_fi/500563c03/f03021.png)


    ![Figure 3-21:](#c03.xhtml#figureanchor3-21) Testing with a mixture of photographs
    and drawings


    As you can see, the more similar the test images are to the training images that
    the computer learns from, the better ML models perform.


    What other changes could you make to improve your model?


    ## What You Learned


    In this chapter, you used ML to create an image recognition system capable of
    recognizing and sorting pictures of animals. You learned some of the key principles
    in ML projects, such as improving your results by increasing the number of training
    images and making sure they’re similar to the images you want the computer to
    recognize.


    You also learned that we can measure how well an image recognition system performs
    by trying it out with test pictures and counting how many it identifies correctly.
    You tried this yourself by creating a project in Scratch to test how well your
    ML model sorted a group of animal photos.


    In the next chapter, you’ll train another image recognition system and use it
    to make a game. You’ll also learn about some of the ways that ML projects can
    go wrong.


    ![](image_fi/book_art/chapterart.png)


    # 4 Playing Rock, Paper, Scissors Against Your Computer


    ![Alphabet-I](image_fi/book_art/Alphabet-I.png)


    Chapter 3, you used ML to create an image recognition system that can sort photos
    of animals. You learned that we create image recognition systems by collecting
    examples of pictures that we want the computer to learn how to recognize.


    In this chapter, you’ll train an ML model to recognize the different hand shapes
    that you make in the game Rock, Paper, Scissors (see [Figure 4-1](#c04.xhtml#figure4-1))
    and then program the computer to play against you.


    ![Figure 4-1: Playing Rock, Paper, Scissors](image_fi/500563c04/f04001.png)


    ![Figure 4-1:](#c04.xhtml#figureanchor4-1) Playing Rock, Paper, Scissors


    Let’s get started!


    ## Build Your Project


    For this project, you’ll be taking photos of your hand, so you’ll need a webcam.


    ### Train Your Model


    1. Create a new ML project, name it `Rock Paper Scissors`, and set it to learn
    how to recognize images.

    2. Click **Train**, as shown in [Figure 4-2](#c04.xhtml#figure4-2).


    ![Figure 4-2: Train is the first phase of an ML project.](image_fi/500563c04/f04002.png)


    ![Figure 4-2:](#c04.xhtml#figureanchor4-2) Train is the first phase of an ML project.

    3. Click **Add new label** to create a training bucket and enter the name `Rock`.
    Then create two more training buckets named `Paper` and `Scissors`, as shown in
    [Figure 4-3](#c04.xhtml#figure4-3).


    ![Figure 4-3: Click Add new label to create your training buckets.](image_fi/500563c04/f04003.png)


    ![Figure 4-3:](#c04.xhtml#figureanchor4-3) Click **Add new label** to create your
    training buckets.

    4. Click `webcam` in the `Rock` bucket and make a fist in front of your webcam,
    as shown in [Figure 4-4](#c04.xhtml#figure4-4).


    ![Figure 4-4: Take your first training photo using the webcam.](image_fi/500563c04/f04004.png)


    ![Figure 4-4:](#c04.xhtml#figureanchor4-4) Take your first training photo using
    the webcam.

    5. When you’re ready, click **Add** (see [Figure 4-4](#c04.xhtml#figure4-4)).
    A photo of your fist should be added to the Rock bucket, as shown in [Figure 4-5](#c04.xhtml#figure4-5).


    ![Figure 4-5: A thumbnail of your photo is shown in the training bucket.](image_fi/500563c04/f04005.png)

