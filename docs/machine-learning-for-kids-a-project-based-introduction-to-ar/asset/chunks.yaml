    18. Click the next genre button sprite and copy the same scripts from step 17,
    as shown in [Figure 5-21](#c05.xhtml#figure5-21). As before, match the genre to
    the label on the button. For my project, the second button was for family movies.


    ![Figure 5-21: Code for the second genre button](image_fi/500563c05/f05021.png)


    [Figure 5-21:](#c05.xhtml#figureanchor5-21) Code for the second genre button


    19. Repeat step 17 until all of your genre buttons have a copy of the script,
    as shown in [Figure 5-22](#c05.xhtml#figure5-22).


    ![Figure 5-22: Every genre button needs a copy of the script.](image_fi/500563c05/f05022.png)


    [Figure 5-22:](#c05.xhtml#figureanchor5-22) Every genre button needs a copy of
    the script.


    Now it’s time to test your ML project!


    ### Test Your Model


    Try to find someone else to test your ML project, since it’s better for the person
    testing the project to not have seen the test pictures that you downloaded.


    Once they click the Green Flag, Scratch will show them each test picture and ask
    them to decide what genre they think the work of art is. Your Scratch code will
    keep a count of how many times they agree with your ML model and how many times
    they disagree, as shown in [Figure 5-23](#c05.xhtml#figure5-23).


    ![Figure 5-23: Testing your ML model](image_fi/500563c05/f05023.png)


    [Figure 5-23:](#c05.xhtml#figureanchor5-23) Testing your ML model


    Ask whoever tests your project to use `only` the picture to decide what to click,
    even if they recognize the work of art and know something about it already.


    ## Review and Improve Your Project


    In this project, you trained an ML model to recognize the visual styles that are
    commonly found in images from different genres.


    If your ML model performed badly, with a lot more disagrees than agrees, try adding
    more examples to your training buckets in the Train phase and then training a
    new ML model with them in the Learn & Test phase. In general, the more training
    examples an ML model has to learn from, the better the results.


    ## What You Learned


    In this chapter, you trained another ML model to recognize pictures. In the previous
    two chapters, you trained image recognition systems to recognize objects in a
    picture. This time, you used one to recognize the style, not the subject, of a
    picture.


    You also saw that one way we commonly measure the effectiveness of an ML system
    is to compare the answers that it gives to test questions with the answers people
    give.


    In the next chapter, you’ll learn about another useful image recognition application:
    handwriting recognition.


    ![](image_fi/book_art/chapterart.png)


    # 6 Mail Sorting


    ![Alphabet-I](image_fi/book_art/Alphabet-I.png) In the last few chapters, you’ve
    been training a computer to recognize images. There are lots of useful jobs that
    computers can help us do if they know how to see. One such job, *optical character
    recognition* (`OCR*), is when a computer is able to recognize a picture of a letter
    or number after it has seen lots of examples of that character.


    A computer trained to do `OCR` can read the printed words in newspapers and books.


    When combined with a text-to-speech system that can read the recognized words
    out loud, `OCR` is used to help visually impaired people read text that they might
    not be able to see for themselves.


    Historians, librarians, and archivists use `OCR` to study historical books and
    printed documents. ML makes it possible to search through publications going back
    hundreds of years, because `OCR` can recognize the words.


    On our roads, `OCR` systems recognize letters and numbers on license plates. *Automatic
    number plate recognition* (`ANPR*) is used to keep traffic flowing by enabling
    fast and efficient tolls and to improve road safety by recognizing when a car
    is driving too fast as it passes a checkpoint.


    Businesses use `OCR` to help process forms and documents. If you fill in a form
    or write a check, an ML system will often use `OCR` to automatically recognize
    what you’ve written.


    If you’ve traveled abroad, you may have used translation apps. You can point a
    smartphone at a sign or menu in a foreign language and have the phone translate
    that into your own language. `OCR` is used to recognize the words and letters
    in the picture.


    One common use of `OCR` is to help sort mail, which is what we’ll do in this chapter.
    You’ll train a computer to recognize handwriting and see how `OCR` can be used
    to quickly sort letters. You’ll create a mail sorting office in Scratch that can
    automatically sort letters by recognizing the postcode written on the envelope
    (see [Figure 6-1](#c06.xhtml#figure6-1)).


    Let’s get started!


    ![Figure 6-1: Sorting letters by recognizing the postcode](image_fi/500563c06/f06001.png)


    [Figure 6-1:](#c06.xhtml#figureanchor6-1) Sorting letters by recognizing the postcode


    ## Build Your Project


    First, choose three big cities that you want your sorting office to be able to
    recognize letters for.


    For my screenshots, I chose three cities: Edinburgh, Oxford, and Southampton.
    Next, you need to choose some codes for these cities.


    ### Train Your Model


    1.  Create a new ML project in Scratch, name it `Sorting office`.

    2.  Click **Train**, as shown in [Figure 6-2](#c06.xhtml#figure6-2).


    ![Figure 6-2: The Train button](image_fi/500563c06/f06002.png)


    [Figure 6-2:](#c06.xhtml#figureanchor6-2) The Train button


    3.  Click **Add label**, as shown in [Figure 6-3](#c06.xhtml#figure6-3). Enter
    the name of your first city.


    ![Figure 6-3: The Add label button](image_fi/500563c06/f06003.png)


    [Figure 6-3:](#c06.xhtml#figureanchor6-3) The Add label button


    4.  Click **draw**, as shown in [Figure 6-4](#c06.xhtml#figure6-4).


    ![Figure 6-4: The draw button](image_fi/500563c06/f06004.png)


    [Figure 6-4:](#c06.xhtml#figureanchor6-4) The draw button


    5.  In the window that opens, draw in the code you want to train the computer
    to recognize for this city. When you’ve finished, click **Add**.


    6.  Repeat step 4 until you have at least 10 examples of the handwritten code
    for your first city, as shown in [Figure 6-5](#c06.xhtml#figure6-5).


    ![Figure 6-5: Training examples for the postcode for Edinburgh](image_fi/500563c06/f06005.png)


    [Figure 6-5:](#c06.xhtml#figureanchor6-5) Training examples for the postcode for
    Edinburgh


    7.  Repeat steps 3 through 5 for the next two cities, until you have at least
    10 examples of each city’s postcode, as shown in [Figure 6-6](#c06.xhtml#figure6-6).


    ![Figure 6-6: Training examples for postcodes for all three cities](image_fi/500563c06/f06006.png)


    [Figure 6-6:](#c06.xhtml#figureanchor6-6) Training examples for postcodes for
    all three cities


    8.  Click **Back to project** in the top-left corner of the screen.


    9.  Click **Learn & Test**, as shown in [Figure 6-7](#c06.xhtml#figure6-7).


    ![Figure 6-7: The Learn & Test button](image_fi/500563c06/f06007.png)


    [Figure 6-7:](#c06.xhtml#figureanchor6-7) The Learn & Test button

