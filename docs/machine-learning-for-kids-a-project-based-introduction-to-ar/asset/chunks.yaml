    \     ![Figure 12-16: Update the define nano-decision script.](image_fi/500563c12/f12016.png)\n\
    \n     [Figure 12-16:](#c12.xhtml#figureanchor12-16) Update the `define nano-decision`\
    \ script.\n\n14.  Now you need to save your project so that you can return to\
    \ it later. First, in the **Scratch Project** text box in the top menu bar, type\
    \ `Avoid the monster TRAINING` as shown in [Figure 12-17](#c12.xhtml#figure12-17).\
    \ This tells you that this version of the project is where you play the game to\
    \ train your ML model.\n\n     Then click **File**▶**Save to your computer**.\n\
    \n     ![Figure 12-17: Update the project name before saving this version.](image_fi/500563c12/f12017.png)\n\
    \n     [Figure 12-17:](#c12.xhtml#figureanchor12-17) Update the project name before\
    \ saving this version.\n\n15.  Play the game!\n\n     In the controls at the top\
    \ right of the screen, click the full-screen icon and then click the Green Flag\
    \ to start the game. Use the arrow keys to control the nano character like you\
    \ did before.\n\n     Do your best to avoid the monster for as long as possible.\
    \ The better you play, the better the ML model can learn.\n\n     When you think\
    \ you’ve played for long enough, click the red Stop Sign.\n\n     You can see\
    \ the moves that you’ve made if you go back to the Train phase, as shown in [Figure\
    \ 12-18](#c12.xhtml#figure12-18). You may need to refresh the page to see the\
    \ latest examples.\n\n     ![Figure 12-18: Moves that you made while playing should\
    \ be displayed in your training buckets.](image_fi/500563c12/f12018.png)\n\n \
    \    [Figure 12-18:](#c12.xhtml#figureanchor12-18) Moves that you made while playing\
    \ should be displayed in your training buckets.\n\n16.  Play a few more games\
    \ until you think you’ve collected examples of all the situations nano could get\
    \ into.\n\n17.  It’s time to train an ML model using the examples you’ve collected.\
    \ Click **Back to project** and then click **Learn & Test**, as shown in [Figure\
    \ 12-19](#c12.xhtml#figure12-19). \n\n     ![Figure 12-19: Click Learn & Test\
    \ to train a model using the moves you’ve collected.](image_fi/500563c12/f12019.png)\n\
    \n     [Figure 12-19:](#c12.xhtml#figureanchor12-19) Click **Learn & Test** to\
    \ train a model using the moves you’ve collected.\n\n18.  Click **Train new machine\
    \ learning model**, as shown in [Figure 12-20](#c12.xhtml#figure12-20).\n\n![Figure\
    \ 12-20: Train a new ML model using your playing moves.](image_fi/500563c12/f12020.png)\n\
    \n[Figure 12-20:](#c12.xhtml#figureanchor12-20) Train a new ML model using your\
    \ playing moves.\n\n### Test Your Game\n\nYou’ve trained an ML model to play the\
    \ game! The best way to test your model is to let the ML model take control of\
    \ the nano character and see how long it can avoid the monster for.\n\nWe’ll need\
    \ to modify our Scratch project so that it can be controlled by the ML model,\
    \ not the arrow keys.\n\n1.  Find the `when arrow key pressed` scripts in the\
    \ Code Area. There are four of them, as shown in [Figure 12-21](#c12.xhtml#figure12-21):\
    \ `when left arrow key pressed`, `when right arrow key pressed`, `when up arrow\
    \ key pressed`, and `when down arrow key pressed`.\n\n    Delete the scripts either\
    \ by clicking each block and pressing the delete key or by right-clicking each\
    \ block and choosing **Delete Block**. Be sure to delete every block in all four\
    \ scripts so that you can’t take control of the character with any arrow key.\n\
    \n    ![Figure 12-21: Delete the four when arrow key pressed scripts so you can\
    \ no longer control nano.](image_fi/500563c12/f12021.png)\n\n    [Figure 12-21:](#c12.xhtml#figureanchor12-21)\
    \ Delete the four `when arrow key pressed` scripts so you can no longer control\
    \ nano.\n\n2.  Find the `define nano-decision` block that you updated before.\
    \ Using blocks from the **Variables** and **Avoid the monster** groups in the\
    \ Toolbox, update the script again so that it looks like [Figure 12-22](#c12.xhtml#figure12-22).\n\
    \n    Instead of learning from your arrow keys, now you want the computer to make\
    \ decisions using your ML model.\n\n    ![Figure 12-22: Update the define nano-decision\
    \ script so that your ML model is controlling the game.](image_fi/500563c12/f12022.png)\n\
    \n    [Figure 12-22:](#c12.xhtml#figureanchor12-22) Update the `define nano-decision`\
    \ script so that your ML model is controlling the game.\n\n3.  Find the longer\
    \ `when Green Flag clicked` script and remove the `wait 1 second` block.\n\n \
    \   This will make the game run a little quicker so that you don’t have to wait\
    \ for each move. The updated script will look like [Figure 12-23](#c12.xhtml#figure12-23).\
    \ (The arrow shows where the block was before I removed it.)\n\n    ![Figure 12-23:\
    \ Remove the wait 1 second block.](image_fi/500563c12/f12023.png)\n\n    [Figure\
    \ 12-23:](#c12.xhtml#figureanchor12-23) Remove the `wait 1 second` block.\n\n\
    4.  Now you need to save your project again so that you can return to it later.\
    \ This time, enter the name `Avoid the monster``TESTING` in the text box so you’ll\
    \ know that this version of the project is where you let the ML model play. Then,\
    \ click **File**▶**Save to your computer**.\n\n5.  Click the full-screen icon\
    \ and then click the Green Flag.\n\n    Watch your ML model try to keep nano safe\
    \ from the monster ([Figure 12-24](#c12.xhtml#figure12-24))!\n\n ![Figure 12-24:\
    \ Your ML project in action](image_fi/500563c12/f12024.png)\n\n[Figure 12-24:](#c12.xhtml#figureanchor12-24)\
    \ Your ML project in action\n\n## Review and Improve Your Project\n\nHow did your\
    \ ML model do?\n\nThe longer it managed to avoid the monster, the better it did.\
    \ If you’ve done really well, it’ll be able to avoid the monster forever. Because\
    \ the monster moves at the same speed as nano, as long as your ML model doesn’t\
    \ make any mistakes, it’s possible for nano to always stay ahead of the monster.\n\
    \nWhat difference does the amount of training make?"
