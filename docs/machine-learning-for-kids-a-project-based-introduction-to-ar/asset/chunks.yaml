- raw: "For example, you can train an ML model to recognize the differences between\
    \ formal writing and casual writing in the same way—by training it to recognize\
    \ patterns in the words that people choose and the phrasing they use.\n\nDifferent\
    \ newspapers and news websites use words and phrases in different ways to describe\
    \ the same stories. In this chapter, you’ll train a computer to recognize the\
    \ way that language is used in media by creating an ML model that can identify\
    \ the type of newspaper a headline has come from (see [Figure 8-1](#c08.xhtml#figure8-1)).\n\
    \n![Figure 8-1: Recognizing headlines from newspapers](image_fi/500563c08/f08001.png)\n\
    \n[Figure 8-1:](#c08.xhtml#figureanchor8-1) Recognizing headlines from newspapers\n\
    \nLet’s get started!\n\n## Build Your Project\n\nThe aim of this project is to\
    \ see whether a computer can learn to recognize the way that newspapers use language.\
    \ For the screenshots in this chapter, I trained an ML model to recognize headlines\
    \ from *tabloids* (smaller newspapers with gossip stories and lots of photos)\
    \ compared to *broadsheets* (traditional, full-size newspapers with more serious\
    \ articles).\n\nYou can do the same topic as well, or you can design your own\
    \ project. If you choose to design your own project, you should choose *one* characteristic\
    \ to train the computer to recognize. There are lots of things that you could\
    \ investigate. For example, you could base your project on the following:\n\n\
    1.  UK newspapers (versus US newspapers)  Do American newspapers use language\
    \ differently than British newspapers?\n\n2.  Headlines in the summer (compared\
    \ with winter headlines)  Are the front-page headlines written differently at\
    \ different times of year?\n\n3.  National newspapers (versus local newspapers)  Are\
    \ the headlines in national papers written differently than the headlines in your\
    \ local paper?\n\n4.  Weekend headlines (versus weekday headlines)  Do newspapers\
    \ use language differently on work and school days than on the weekend?\n\n5.\
    \  Articles from two different newspapers   If you pick two specific newspapers,\
    \ can you train the computer to recognize an article from one of them?\n\n6. \
    \ Headlines from the 1950s (compared with headlines today)  Are headlines written\
    \ differently today from how they used to be?\n\nYou’ll need examples of the types\
    \ of newspaper articles or headlines that you want to train the ML model to recognize.\
    \ There are lots of websites you can use to find examples. Here are a few suggestions:\n\
    \n1.  [https://www.thepaperboy.com/](https://www.thepaperboy.com/)\n\n2.  [https://www.ukpressonline.co.uk/](https://www.ukpressonline.co.uk/)\n\
    \n3.  [https://www.time.com/vault/](https://www.time.com/vault/)\n\nThink about\
    \ what comparison you would find interesting and then see if you can find enough\
    \ examples to make it easy to do.\n\nYou’ll need two groups to train the ML model:\n\
    \n*   Examples of the type of newspaper article/headline that you want the model\
    \ to recognize\n\n*   Examples of newspaper articles/headlines that *don’t* have\
    \ that characteristic\n\nTry to change only one characteristic in the second group.\
    \ For example, the category *headlines from UK tabloids in the 1970s* has three\
    \ variables: country (UK), newspaper type (tabloids), and time period (1970s).\
    \ What would you put in the second group?\n\nYou could fill it with examples of\
    \ headlines from US tabloids in the 1970s, so the computer learns to recognize\
    \ the difference between 1970s UK and US tabloid headlines. Or, you could fill\
    \ it with examples of headlines from UK tabloids from today, so the computer learns\
    \ to recognize the difference between UK tabloid headlines from the 1970s and\
    \ now.\n\nWhat you should *not* do is use, for example, headlines from current\
    \ US broadsheets. That would change all three variables, which would make it harder\
    \ for the model to recognize a consistent pattern.\n\nAs another example, if you\
    \ want to train the computer to recognize the way that articles are written in\
    \ the *Daily Times*, in the second group you could include articles from different\
    \ newspapers from the same day. Even better, you could try to pick articles about\
    \ the same subject. Then your ML model won’t be learning to recognize the article\
    \ subject, but rather the patterns in the way the *Daily Times* describes the\
    \ same subjects.\n\nTo train my ML model to recognize headlines from tabloids,\
    \ I compared examples of tabloid headlines with headlines from broadsheet newspapers.\
    \ Here’s what I kept the same:\n\n*   I used newspapers from the *same time period*:\
    \ March 2015 through April 2015.\n\n*   I used the *same section* of each newspaper:\
    \ the headline in the biggest text on the front page.\n\n*   I used the *same\
    \ type* of newspapers: national, weekday newspapers.\n\n*   I used newspapers\
    \ from the *same country*: the UK.\n\n### Train Your Model\n\n1.  Create a new\
    \ ML project, name it `Newspapers`, and set it to learn to recognize text in your\
    \ preferred language. \n\n2.  Click **Train**, as shown in [Figure 8-2](#c08.xhtml#figure8-2).\n\
    \n    ![Figure 8-2: Train is the first phase of an ML project.](image_fi/500563c08/f08002.png)\n\
    \n    [Figure 8-2:](#c08.xhtml#figureanchor8-2) Train is the first phase of an\
    \ ML project.\n\n3.  Click **Add new label**, as shown in [Figure 8-3](#c08.xhtml#figure8-3),\
    \ to create training buckets for the two groups that you want to compare in your\
    \ project.\n\n    For my project, I used tabloid and broadsheet.\n\n    ![Figure\
    \ 8-3: Create training buckets for the two groups to compare.](image_fi/500563c08/f08003.png)\n\
    \n    [Figure 8-3:](#c08.xhtml#figureanchor8-3) Create training buckets for the\
    \ two groups to compare.\n\n4.  Find and copy an example of your first group.\
    \ This will depend on what you’re doing your project on. It could be a newspaper\
    \ headline if you’re doing a project on headlines. It could be the first paragraph\
    \ of an article if you’re comparing the way that different newspapers write articles\
    \ about the same topic.\n\n    For my project, I copied headlines from a website\
    \ that has the front page for national newspapers in the UK.\n\n5.  Click **Add\
    \ example** in each of your training buckets, as shown in [Figure 8-4](#c08.xhtml#figure8-4),\
    \ and paste in the examples that you found.\n\n    ![Figure 8-4: First training\
    \ example for the Newspapers project](image_fi/500563c08/f08004.png)\n\n    [Figure\
    \ 8-4:](#c08.xhtml#figureanchor8-4) First training example for the Newspapers\
    \ project\n\n6.  Repeat steps 4 and 5 until you’ve got at least 20 examples in\
    \ each training bucket, as shown in [Figure 8-5](#c08.xhtml#figure8-5).\n\n7.\
    \  Click **Back to project** in the top-left corner of the screen.\n\n    ![Figure\
    \ 8-5: Training data for the Newspapers project](image_fi/500563c08/f08005.png)\n\
    \n    [Figure 8-5:](#c08.xhtml#figureanchor8-5) Training data for the Newspapers\
    \ project\n\n8.  Click **Learn & Test**, as shown in [Figure 8-6](#c08.xhtml#figure8-6).\n\
    \n    ![Figure 8-6: Learn & Test is the second phase of an ML project.](image_fi/500563c08/f08006.png)\n\
    \n    [Figure 8-6:](#c08.xhtml#figureanchor8-6) Learn & Test is the second phase\
    \ of an ML project.\n\n9.  Click **Train new machine learning model**, as shown\
    \ in [Figure 8-7](#c08.xhtml#figure8-7).\n\n    ![Figure 8-7: Click Train new\
    \ machine learning model to start the training.](image_fi/500563c08/f08007.png)\n\
    \n    [Figure 8-7:](#c08.xhtml#figureanchor8-7) Click **Train new machine learning\
    \ model** to start the training.\n\n    The computer might take a minute to learn\
    \ from the examples that you’ve collected. While you wait, consider these questions:\n\
    \n    *   Did you spot any patterns between your two groups of examples while\
    \ you were copying them into your training buckets?\n\n    *   Are there particular\
    \ topics or subjects that are covered more often in one group than the other?\n\
    \n    *   Are there particular words, terms, or phrases that are used more in\
    \ one group than in the other group?\n\n    *   Are there differences in the way\
    \ sentences are structured? Does one group have longer sentences than the other?\
    \ Does one use capital letters more often?"
