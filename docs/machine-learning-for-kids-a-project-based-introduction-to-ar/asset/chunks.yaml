  trans: '


    想象一个机器学习（ML）推荐应用，它会向患者推荐应该开具什么药物。每个训练桶代表一种药物，其中包含的训练示例是那些将该药物作为最佳治疗方案的患者医疗记录。这样的系统今天已经在使用了。机器学习系统可以学习识别海量详细医疗记录中的模式，并将其与从同样海量的医学研究和文献中提取的证据相结合。对于这种医疗
    AI 助手应用，目前还处于早期阶段，但使用量在未来几年内将显著增加。


    既然你已经亲眼看到这样的系统是容易受到影响而偏向某个答案而非另一个，这是否会影响你对此类系统使用方式的看法？从理论上讲，药物制造商可能会奖励医疗 AI 应用的开发者，使其机器学习模型产生偏差，从而倾向于选择自己的药物而非其他制造商的药物。


    我们正日益依赖机器学习系统来做出影响生活的的重要决策。这不仅限于医疗领域。机器学习系统还会提供财务建议，银行和贷款公司利用这些建议来决定是否为某人提供保险、是否可以获得贷款，应该收取多少利率。机器学习系统很快将驱动我们道路上的汽车和卡车。还有很多例子。


    迫使公司保持透明并披露其机器学习系统是如何训练的，可能是防止伦理问题的一种方法。但你已经看到准备训练数据投入了多少精力。公司在收集的训练数据上投入了大量金钱，以使其机器学习系统优于竞争对手，因此许多公司倾向于对训练数据保密。你将如何平衡这些伦理问题与公司的商业利益？


    你认为对 AI 系统的训练或应用需要保护吗？如果是的话，AI 伦理政策应该由个人公司制定还是由政府制定？


    本章以提出的问题多于答案结束，这反映了当前 AI 伦理的现状。机器学习系统有潜力通过训练计算机完成我们原本无法完成的工作，从而改善我们所有人的生活。然而，作为一个社会，我们需要解决许多关于我们对应用这项技术的接受程度如何的问题。


    ## 你学到了什么


    在最后一个项目中，你基于在第 14 章中学的关于偏差的知识，为一个电影推荐应用创建了一个机器学习模型，该模型偏好某一个结果而非其他结果。你看到，用于训练机器学习模型的示例数量不平衡是向系统中有意引入偏差的另一种方法。你还学到偏差并不一定是坏的——在某些情况下甚至是恰当的——但意识到围绕周围的伦理问题很重要，特别是当
    AI 系统变得越来越普遍时。


    ![](img/chapterart.png)


    # 后记


    ![Alphabet-F](img/Alphabet-F.png) 或者说对很多人来说，AI 会让人联想到机器人和科幻愿景。希望你已经从书中的项目中学到，AI
    已经到来，而且它无处不在。


    理解机器学习系统是如何创建的，能让你更好地理解周围的世界是如何运作的。这种理解能让你洞察公司如何知道你在想什么并推荐你可能喜欢的产品。它帮助你意识到，当你被要求对某物进行评分、证明你是人类、或为照片中的人脸标记标签时，你可能正在训练某人的机器学习系统。


    ## 未来


    如果我们的生活在未来都受到机器学习系统的影响，我们可能会对它们如何训练和应用有自己的看法。


    例如，哪些应用适用于机器学习系统，而哪些决策应该留给人类？


    机器是否应该做出涉及你医疗健康的决策？或者执法部门如何行为？或者谁可以获得信用卡或抵押贷款？


    谁应该负责收集创建最重要的机器学习系统所使用的训练数据？谁应该检查训练是如何进行的？机器学习系统应该如何测试，你是否应该能够看到你所使用的机器学习系统的那些测试结果？


    你在书中中学的基础知识——例如训练数据量和平衡对机器学习模型的影响、我们描述机器学习模型性能的指标，以及可能出现的各种问题——对于你开始思考这些重要问题非常有帮助。


    如果你选择进一步学习机器学习并了解不同的机器学习系统是如何实现的，这些知识也是必不可少的起点。我希望这本书鼓励了你继续探索。


    ## 下一步


    如果你想学习更多，一种选择是构建你自己的机器学习项目。全球许多 AI 项目都是使用“云端”在线机器学习服务构建的，正如你目前所做的那样。通过这些服务，你提供训练数据，云服务利用数据创建机器学习模型，然后你测试该模型以确保它完成了你需要的工作。如果你愿意，可以继续使用
    `Scratch`，或者转向使用基于文本的编程语言。


    或者，如果你想更多地了解机器学习的原理，你可以从使用云端构建和托管的机器学习模型转向构建和运行自己的机器学习模型。这让你对机器学习系统的行为有更多控制权，并帮助你理解它们的内部工作原理。你需要开始使用如
    `Python` 等基于文本的编程语言，但只要你愿意这样做，就有许多免费的机器学习技术框架供你开始。`TensorFlow` 是最广泛使用的框架之一，`TensorFlow`
    （[`www.tensorflow.org/`](https://www.tensorflow.org/)）上有免费教程，可以帮助你构建第一个机器学习模型。


    我希望这本书只是你机器学习之旅的起点。无论你是将书中中学到的机器学习知识用于创建自己的 AI 项目和应用程序、自己构建机器学习模型，还是更深入地了解每天使用的在线服务的运作方式，我都祝你在下一步行动中顺利。


    '
