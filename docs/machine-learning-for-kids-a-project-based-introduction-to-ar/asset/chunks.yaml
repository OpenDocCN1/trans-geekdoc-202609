  trans: '


    尝试打开你 `training` 版本的 Scratch 项目，通过多玩一会儿游戏来添加更多的训练用例。然后，回到“学习与测试”（Learn & Test）阶段，使用你额外的训练用例训练一个新的
    ML 模型。最后，打开你 `testing` 版本的 Scratch 项目，观察这个新的 ML 模型是如何玩游戏的。


    额外的训练训练有帮助吗？


    尝试这样做几次，看看训练量如何影响你的 ML 模型玩游戏的表现。


    你在这个项目中训练的 ML 模型类型被称为 `decision tree classifier`（决策树分类器），因为模型对下一步动作做出决策的方式可以被画成某种树的形式，如图图
    12-25


    图 12-25： 一决策树


    决策树图表可以帮助你理解 ML 模型是如何对每一步的结果做出 `predictions`（预测）的。


    树上的每个框都描述了一个测试；例如，`monster x < 3` 意味着“怪物的 x 坐标是否小于 3？”如果测试为真，树就会向左侧箭头移动。如果测试为假，树就会向右侧箭头移动。


    ML 模型从树的顶部开始，沿着测试识别的箭头移动，直到到达树的底部。


    要查看决策过程的示例，在决策树右侧的框中为 `nano` 和怪物输入一些坐标，然后点击 `Test`（测试）。图表将高亮你的 ML 模型对这些坐标做出预测的方式。当没有更多箭头可以遵循且到达树的底部时，你就会找到最终的预测，如图图
    12-26 所示。


    ![图 12-26：高亮用于对动作结果做出预测的坐标](img/f12026.png)


    图 12-26: 高亮用于对动作结果做出预测的坐标


    用几组不同的坐标测试你的模型，理解它是如何学会做出预测的。


    ## 你学到的知识


    在本章中，你学习了 ML 模型可以被训练以识别数字集的模式。你使用 `decision tree classifier` 训练了一个模型来玩简化版的游戏 `Pac-Man`（吃人蛇），使用
    `x` 和 `y` 坐标根据其预测的结果对下一步动作做出决策。


    决策树不是训练 ML 模型根据数字做出预测的唯一方法，但它是一个受欢迎的选择，因为训练速度非常快，而且是最容易理解的技术之一。在之前的章节中，你一直在使用神经网络，它可能更强大，但更复杂且更难理解。


    你已经看到，和你之前训练的其他 ML 模型一样，随着你收集更多的训练用例，模型的性能就会提高。在下一章中，你将学习更多关于训练数据量对 ML 项目的影响。


    ![](img/chapterart.png)


    # 13 井字棋


    ![Alphabet-I](img/Alphabet-I.png)在上一章中，你看到了像 `Pac-Man` 这样的电脑游戏如何被用于 ML 开发。井字棋（也称为
    Noughts and Crosses 或 Xs and Os）被用于帮助人们学习 ML 的更久。


    例如，英国 AI 研究人员唐纳德·米奇（Donald Michie）在 1960 年设计了 `MENACE`，即“Machine Educable Noughts
    and Crosses Engine”（机器教育交叉棋引擎），参见图 13-1


    图 13-1: 唐纳德·米奇设计的机器教育交叉棋引擎 MENACE 的重现（来源：Matthew Scroggs, [`commons.wikimedia.org/wiki/File:Mscroggs-MENACE-cropped.jpg`](https://commons.wikimedia.org/wiki/File:Mscroggs-MENACE-cropped.jpg)）然而，井字棋并非唯一驱动
    AI 开发的游戏。象棋是另一个很好的例子。在第一章中，我提到了 `Deep Blue`（深蓝），这台击败象棋大师加里·卡斯帕罗夫的 IBM 电脑。这是几十年来构建可以下棋电脑之后。早在
    20 世纪 50 年代，数学家艾兰·图灵（Alan Turing）写了一篇名为《应用于游戏的数字计算机》的论文，他在其中问道：“能否制造机器下棋，并通过逐局比赛来提高它的水平，从而从经验中获益呢？”


    近年来，AI 社区转向了更复杂的游戏，如围棋 `Go`。由于围棋中潜在移动和策略的数量巨大，依靠像 `Deep Blue` 那种电脑（检查所有可能的未来移动和位置）的“暴力破解”方法是不可能的。Google
    DeepMind 的电脑 `AlphaGo` 在 2016 年取得了里程碑式的进展，击败了围棋世界冠军世石。


    创建神经网络的工具变得越来越容易使用，我们的电脑也变得更快更强大，超越了 AI 学生和研究者的领域。如果你搜索“Super Mario neural network”，你会发现许多训练
    ML 模型示例和教程。


    在本章中，尽管如此，我们将坚持基础。我们将 ML 引入到井字棋中。


    ## 构建你的项目


    你可能知道如何玩井字棋，但让我们快速尝试一下。


    访问 [`machinelearningids.co.uk/scratch3/`](https://machinelearningids.co.uk/scratch3/)
    并点击菜单中的 `Project`（项目），如图图 13-3](#c13.xhtml#figure13-3）所示。


    在模板列表中，点击 `Noughts and Crosses`（井字棋）。模板加载了一个简单的井字棋游戏。点击 `Green Flag`（绿色旗帜）尝试一下。


    你正在放置交叉（X），而电脑正在放置圆（O）。电脑的策略并不聪明，但你将在本章让它变得智能。


    ![图 13-3：从菜单访问项目模板](img/f13003.png)


    图 13-3: 从菜单访问项目模板。


    尝试找出电脑正在遵循的规则。电脑下一步移动的逻辑都在代码区域（Code Area）中，因此你可以查看那里的脚本来判断你是否正确。


    表示棋盘的方法有很多，但我们我们使用一种非常简单的方法：将棋盘上的每个单元格编号为 1 到 9，如图图 13-4


    图 13-4: 表示棋盘的一种方法。


    单元格在 Scratch 项目模板中也用数字表示，正如你在图 13-5 中所示。


