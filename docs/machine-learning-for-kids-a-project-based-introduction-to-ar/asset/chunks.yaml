    \ and beat two champions. *Jeopardy!* is known for asking complex and sometimes\
    \ tricky questions on a huge variety of topics, and therefore is a particularly\
    \ challenging test for a computer.\n\n*Chatbots*, programs that imitate human\
    \ conversation, are a simpler task for computers than QA systems, for many reasons.\
