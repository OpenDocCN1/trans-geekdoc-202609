    \ shown in the training bucket.\n\n6.  Repeat steps 4 and 5 using the webcam button\
    \ for the Paper and Scissors training buckets. Keep going until you have 10 photos\
    \ of a fist in the Rock bucket, 10 photos of a flat hand in the Paper bucket,\
    \ and 10 photos of two fingers in the Scissors bucket, as shown in [Figure 4-6](#c04.xhtml#figure4-6).\n\
    \n    ![Figure 4-6: Training images for Rock, Paper, Scissors](image_fi/500563c04/f04006.png)\n\
    \n    [Figure 4-6:](#c04.xhtml#figureanchor4-6) Training images for Rock, Paper,\
    \ Scissors\n\n7.  Click **Back to project** in the top-left corner of the screen.\n\
    \n8.  Click **Learn & Test**, as shown in [Figure 4-7](#c04.xhtml#figure4-7).\n\
    \n    ![Figure 4-7: Learn & Test is the second phase of an ML project.](image_fi/500563c04/f04007.png)\n\
    \n    [Figure 4-7:](#c04.xhtml#figureanchor4-7) Learn & Test is the second phase\
