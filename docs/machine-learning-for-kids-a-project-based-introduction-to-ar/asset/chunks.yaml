    What delights me about this book is that it’s wonderfully pragmatic, for it guides
    you in building AI systems that are very much relevant to contemporary computer
    science. Furthermore, the book doesn’t shy away from the hard parts: along the
    way, you’ll learn about biases and other ethical issues in using ML—issues that,
    as you progress in your work beyond this book, will become more and more important.


    I wish I had a book like this when I was growing up. But then, such a book could
    not have existed, for most of the ideas presented here simply had not yet been
    invented. So, here’s my challenge to you: after learning about AI and ML, what
    will you invent that no one has yet done?


    —Grady Booch


    IBM Fellow and Chief Scientist for Software Engineering, IBM Research


    ![](image_fi/book_art/chapterart.png)


    # Introduction


    ![Alphabet-A](image_fi/book_art/Alphabet-A.png)rtificial intelligence (AI) and
    machine learning (ML) systems impact all of us. Most of us use AI systems every
    day. They influence the news we read and hear; the decisions that companies and
    governments make; and what we choose to buy, watch, and listen to. They can even
    influence the jobs we get and where we live.


    A great way to learn about AI technologies is to try making things that use them,
    and that’s what this book will help you do. Building your own AI projects will
    help you to understand how these technologies behave and what they’re capable
    of. It’s also a fantastic introduction to the risks involved in using AI, as you’ll
    see for yourself how things can go wrong.


    Making your own projects based on how AI is used in the real world can also open
    your eyes to exactly how AI systems impact all of us. As you learn how everyday
    AI applications are created, you’ll probably find that you start noticing AI systems
    and applications all around you. This gives you better insight into how the world
    around us works.


    AI systems are often discussed on the news, but it can be difficult to think about
    what these stories mean if you don’t have a basic understanding of the technologies
    involved. The projects in this book will prepare you to follow and engage in discussions
    of how AI systems are used, controlled, and regulated.


    Finally, the projects in the book are meant to be fun! ML is a fascinating field
    of technology that makes it possible to create things that we couldn’t otherwise.
    I hope you’ll enjoy building something you didn’t know how to build before and
    learning new techniques and tools in the process.


    ## Scratch


    Each chapter in this book introduces a new idea about the application or use of
    ML by walking you through a hands-on project in the educational coding platform
    `Scratch`. If you’ve used Scratch in school or in a coding club, you might already
    be familiar with it.


    The Scratch projects in this book are all explained with detailed step-by-step
    instructions, so don’t worry if you aren’t an expert at using Scratch. However,
    if you’ve never used Scratch before, you might find it useful to visit the Scratch
    website to try it out ([https://scratch.mit.edu/](https://scratch.mit.edu/)).


    Before we get started, let’s go over a few pointers and introduce the Scratch
    terminology that will be used throughout the book.


    ### Working in the Scratch Interface


    The main sections of the Scratch interface are labeled in [Figure 1](#f05.xhtml#figure-1).


    ![Figure 1: Scratch 3 interface](image_fi/500563c00/f00001.png)


    [Figure 1:](#f05.xhtml#figureanchor-1) Scratch 3 interface


    1. The `menu` contains the options for saving your project to or loading it from
    a file. It also includes a link to the Project templates library, which is a set
    of starter projects to help save you time.

    2. The `Toolbox` is a palette of blocks available for you to use in your program.

    3. The `CodeArea` is where you create your programs when the Code tab is active.
    Drag blocks from the Toolbox onto the Code Area to create your projects. When
    the Backdrops or Costumes tab is active, this area contains drawing and painting
    tools and is known as the `canvas`.

    4. The `controls` allow you to run your program when you want to try it out. The
    Green Flag starts your code running, and the Stop Sign stops it. The rightmost
    button with four arrows runs your program in full-screen mode.

    5. The `Stage` is where you prepare the visual part of your program. You’ll move
    the different components of your project around in here.

    6. `Sprites` are the objects that perform the actions in your project. Each sprite
    has its own look (called a `costume`) and will have its own code in the Code Area.

    7. `Backdrops` are the backgrounds for your project. You can draw your own or
    choose from a library of premade options.


    ### Coding in Scratch


    You create your program—known as a `script` in Scratch—by dragging blocks from
    the Toolbox to the Code Area. When you move the blocks close to each other, they
    snap together.


    #### Matching Colors


    Scratch blocks are color coded by category. For example, `Motion blocks`, the
    blocks you use to move your sprite, are blue. To access them, you click the blue
    circle labeled Motion in the Toolbox.


    When you’re copying code for this book’s projects, this color coding will help
    you find the blocks you need more easily. If the project requires a yellow block,
    click the yellow Events circle to go directly to the Events blocks in the Toolbox
    and select the one you need.


    #### Creating Custom Blocks


    Pink blocks are custom blocks. They let you split up a long script into smaller
    pieces to make it easier to read.


    To create a custom block, click `Make a Block` in the My Blocks section of the
    Toolbox as shown in [Figure 2](#f05.xhtml#figure-2).


    Give your new custom block a name and then click `OK`. This will create a new
    custom block that you can use the same way as any other Scratch block.


    ![Figure 2: Click Make a Block to create your custom blocks.](image_fi/500563c00/f00002.png)


    Wait, under the `define` block.


    #### Duplicating


    If you’re creating a long code script with similar sections, you can `duplicate`
    those sections to save yourself time.


    Right-click the section of the code you want to copy and choose `duplicate`. This
    tip will be very useful for several of the projects.


    ### Saving Your Work


    It’s important to save your work regularly when you’re creating a script in Scratch,
    as Scratch doesn’t do this for you.


    To save your project, click `File`▶`Save to your computer` in the menu bar as
    shown in [Figure 4](#f05.xhtml#figure-4). This will download a file to the computer.
    Keep this file safe—it’s your copy of the project you’ve created.


    ![Figure 4: The File menu in Scratch lets you save your projects to work on later.](image_fi/500563c00/f00004.png)


    To open this project again, click `File`▶`Load from your computer` and choose
    the file you’ve saved.


    ## Machine Learning for Kids


    The projects in this book use *Machine Learning for Kids*, a free online tool
    that extends Scratch to add the ML capabilities you’ll be using. Don’t worry if
    you haven’t used this tool before. Chapter 2 will cover everything you need to
    know to get started with it.


    ## What’s Next?


    The book is organized as follows:


    **Chapter 1, What Is Artificial Intelligence?**


    You’ll learn more about AI and ML, and why we use ML instead of traditional programming
    for our projects.

