  trans: "\n\n18. 点击下一个类型按钮精灵，并从步骤 17 复制相同的脚本，如 图 5-21 所示。与之前一样，将类型与按钮上的标签相匹配。对于我的项目，第二个按钮是家庭电影的。\n\
    \n![图 5-21: 第二个类型按钮的代码](img/f05021.png)\n\n图 5-21: 第二个类型按钮的代码\n\n19. 重复步骤 17，直到你所有的类型按钮都拥有一份脚本副本，如\
    \ 图 5-22 所示。\n\n![图 5-22: 每个类型按钮都需要一个脚本副本。](img/f05022.png)\n\n图 5-22: 每个类型按钮都需要一个脚本副本。\n\
    \n现在是时候测试你的 ML 项目了！\n\n### 测试你的模型\n\n尝试找其他人来测试你的 ML 项目，因为让测试项目的人最好没有见过你下载的测试图片。\n\
    \n一旦他们点击绿色旗帜，Scratch 就会向他们展示每张测试图片，并让他们决定他们认为这件艺术品属于什么类型。你的 Scratch 代码将记录他们同意你的\
    \ ML 模型的次数以及不同意见的次数，如 图 5-23 所示。\n\n![图 5-23: 测试你的 ML 模型](img/f05023.png)\n\n\
    图 5-23: 测试你的 ML 模型\n\n让测试你项目的人`仅`根据图片来决定点击什么，即使他们已经认出了这件艺术品并对它已经有了了解。\n\n## 回顾并改进你的项目\n\
    \n在这个项目中，你训练了一个 ML 模型来识别来自不同类型图像中常见的视觉风格。\n\n如果你的 ML 模型表现不佳，不同意的次数远多于同意的，尝试在训练（Train）阶段向你的训练桶中添加更多示例，然后在学习与测试（Learn\
    \ & Test）阶段用它们训练新的 ML 模型。通常情况下，ML 模型学习的训练示例越多，结果就越好。\n\n## 你学到的\n\n在本章中，你训练了另一个\
    \ ML 模型来识别图片。在之前的两个章节中，你训练了图像识别系统来识别图片中的物体。这一次，你使用它来识别图片的风格，而不是主体。\n\n你还看到，我们衡量\
    \ ML 系统有效性的一种常用方法是将它对测试题给出的答案与人们给出的答案进行比较。\n\n在下一章中，你将学习另一个实用的图像识别应用：手写体识别。\n\n\
    ![](img/chapterart.png)\n\n# 6 邮件分类\n\n![字母](img/Alphabet-I.png) 在过去的几个章节中，你一直在训练计算机识别图像。如果计算机知道如何观察，它们就能帮助我们完成很多有用的工作。其中一种工作是*光学字符识别*（`OCR`），即当计算机在看到许多该字符的示例后，能够识别字母或数字的图片。\n\
    \n经过 `OCR` 训练的计算机可以阅读报纸和书籍中的印刷文字。\n\n当 `OCR` 与可以大声读出识别单词的文本转语音系统结合时，它可以帮助视障人士阅读他们可能无法自己看到的文本。\n\
    \n历史学家、图书馆管理员和档案保管使用 `OCR` 来研究历史书籍和印刷文档。ML 使得搜索数百年前的出版物成为可能，因为 `OCR` 可以识别单词。\n\
    \n在我们的道路上，`OCR` 系统识别车牌上的字母和数字。*自动车牌识别*（`ANPR`）用于通过实现快速高效的过站收费保持交通顺畅，并通过识别车辆在通过检查站时行驶是否过快来提高道路安全。\n\
    \n企业使用 `OCR` 来帮助处理表单和文档。如果你填写表单或撰写支票，ML 系统通常会使用 `OCR` 自动识别你写的内容。\n\n如果你去过国外，你可能用过翻译应用。你可以将智能手机指向外语的标牌或菜单，让手机将其翻译成你自己的语言。`OCR`\
    \ 用于识别图片中的单词和字母。\n\n`OCR` 的一个常见用途是帮助分类邮件，这就是我们在本章中要做的。你将训练计算机识别手写体，并查看 `OCR` 如何用于快速分类信件。你将在\
    \ Scratch 中创建一个邮件分类办公室，可以通过识别写在信封上的邮政编码来自动分类信件。让我们开始吧！\n\n![图 6-1: 邮政编码](img/f06001.png)\n\
    \n图 6-1: \n\n## 构建你的项目\n\n首先，选择你想让分类办公室识别的三个城市。对于我的项目，我选择了爱丁堡、牛津和南安普顿。\n\n###\
    \ 训练你的模型\n\n1. 在 Scratch 中创建一个新项目，命名为 `Sorting office`。\n2. 点击 **Train**（训练），如\
    \ 图 6-2 所示。\n\n![图 6-2: 训练按钮](img/f06002.png)\n\n图 6-2: 训练按钮\n\n3. 点击 **Add label**（添加标签），如\
    \ 图 6-3 所示。输入第一个城市的名称。\n\n![图 6-3: 添加标签](img/f06003.png)\n\n图 6-3: 添加标签\n\n4.\
    \ 点击 **draw**（绘制），如 图 6-4 所示。\n\n![图 6-4: 绘制按钮](img/f06004.png)\n\n图 6-4: 绘制按钮\n\
    \n5. 在打开的窗口中，画出你想让计算机识别该城市的代码。完成后，点击 **Add**（添加）。\n6. 重复步骤 4，直到你的第一个城市有至少 10 个手写代码示例，如\
    \ 图 6-5 所示。\n\n![图 6-5: 爱丁堡的邮政编码](img/f06005.png)\n\n图 6-5: 爱丁堡的邮政编码\n\n7. 重复步骤\
    \ 3 到 5，处理另外两个城市，直到每个城市都有至少 10 个邮政编码示例，如 图 6-6 所示。\n\n![图 6-6: 三个城市的邮政编码示例](img/f06006.png)\n\
    \n图 6-6: 三个城市的邮政编码示例\n\n8. 点击屏幕左上角的 **Back to project**（返回项目）。\n9. 点击 **Learn\
    \ & Test**（学习与测试），如 图 6-7 所示。\n\n![图 6-7: 学习与测试按钮](img/f06007.png)\n\n图 6-7: 学习与测试按钮\n\
    \n"
