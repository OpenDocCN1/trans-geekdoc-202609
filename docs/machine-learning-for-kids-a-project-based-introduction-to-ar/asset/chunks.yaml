    Now you’re ready to get started with the projects in this book! But remember,
    if you want to use the `Log` option (instead of Try now) so that you can save
    your projects, you’ll need to ask an adult to create an account for you. Let’s
    go over that now.


    ## Creating an Account


    Creating an account is free and only has to be done once. There are 10 steps,
    and signing up can take up to 10 minutes. This section covers the instructions
    your parent, teacher, or coding leader needs to follow.


    1. Click `Sign up` (shown in [Figure 2-2](#c02.xhtml#figure2-2)).

    2. Click the button confirming that you are a parent, teacher, or coding leader.

    3. Click `Sign up` under “Create an unmanaged account.” This means that you will
    be in charge of your account and are setting it up yourself.

    4. Fill in the form shown in [Figure 2-11](#c02.xhtml#figure2-11). Choose a username
    and enter an email address where you can be contacted. You can also describe how
    you’re planning to use the site.


    ![Figure 2-11: Creating a parent/teacher account](image_fi/500563c02/f0211.png)


    [Figure 2-11: Creating a parent/teacher account


    5. You’ll be sent an email to verify your email address. Click the link in that
    email before continuing to the next step.

    6. Once you log in with your parent/teacher account, you’ll have access to the
    Administration page shown in [Figure 2-12](#c02.xhtml#figure2-12). Click `Teacher`
    in the top menu bar to go to the Administration page.


    ![Figure 2-12: Parent/teacher screen](image_fi/500563c02/f0212.png)


    [Figure 2-12: Parent/teacher screen


    7. Click `Restrictions` to review the default restrictions for your account. Some
    of them can be altered to your preferences.

    8. Click `API Keys` to enter the codes from IBM Cloud that will provide the ML
    technology for your projects. You’ll need one API key for Watson Assistant. To
    create these codes, you’ll need to create a free account on IBM Cloud. There is
    no charge for the Watson Assistant key codes. The IBM Cloud site can be a little
    daunting if you’re not used to websites aimed at software developers. The step-by-step
    guide at `https://machinelearningforkids.co.uk/apikeys-guide/` explains exactly
    what to do.

    9. Click `Students` to create a username for the student who will be doing the
    projects in this book. If multiple students will be building these projects, you
    can create multiple usernames. There’s no need to use real names or provide any
    contact information for students. User accounts for students are simpler than
    those for teachers. Students don’t have to worry about API keys from IBM or any
    other technical details. If they forget their password, you can reset it for them
    from the `Students` page.

    10. Click `Supervision` to see a list of projects that students have created.
    It’s unlikely that you’ll hit the limit for the API keys you’ve added unless many
    students are working through the book at the same time. If that happens, you’ll
    be able to see which projects are using the API keys here.


    ## What You Learned


    Machine Learning for Kids is the free tool you’ll be using for the projects in
    this book. The tool guides you through the main phases.

