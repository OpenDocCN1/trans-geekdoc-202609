- raw: "    The `feeling happy` costume should look happy. If it’s a face, you could\
    \ make it smile. If it’s an animal, you could change the position of its tail\
    \ or ears. Or you could just draw the character holding up a sign that says how\
    \ it feels.\n\n    The `feeling sad` costume should look sad. If it’s a face,\
    \ you could draw a frown or tears.\n\n    The `waiting` costume will be used while\
    \ your character is waiting for you to say something to it, so it should be neither\
    \ happy nor sad.\n\n    ![Figure 7-7: Adding expressions to the different character\
    \ costumes](image_fi/500563c07/f07007.png)\n\n    [Figure 7-7:](#c07.xhtml#figureanchor7-7)\
    \ Adding expressions to the different character costumes\n\n7.  Save your Scratch\
    \ project by clicking **File**▶**Save to your computer**.\n\n### Code Your Game\
    \ Without ML\n\nIt’s useful to see the difference ML makes by trying to code this\
    \ AI project without it first. But you can skip this part if you’d rather go straight\
    \ to using ML.\n\n1.  Click the **Code** tab, as shown in [Figure 7-8](#c07.xhtml#figure7-8).\
    \ \n\n    ![Figure 7-8: The Code tab](image_fi/500563c07/f07008.png)\n\n    [Figure\
    \ 7-8:](#c07.xhtml#figureanchor7-8) The Code tab\n\n2.  Copy the script shown\
    \ in [Figure 7-9](#c07.xhtml#figure7-9).\n\n    ![Figure 7-9: Coding the project\
    \ without ML](image_fi/500563c07/f07009.png)\n\n    [Figure 7-9:](#c07.xhtml#figureanchor7-9)\
    \ Coding the project without ML\n\n3.  Save your project, using **File**▶**Save\
    \ to your computer**.\n\n4.  Test your project by clicking the Green Flag icon.\
    \ Your character will ask you to say something to it. Type `I like you` or `You\
    \ are nice`, and your character will look happy. If you type anything else, your\
    \ character will look sad.\n\n    Now type `You are lovely`. Why doesn’t your\
    \ character look happy?\n\n    What would you need to change about your code so\
    \ it would recognize “I like you” and “You are nice” *and* “You are lovely” as\
    \ compliments?\n\n    Do you think you can write a script that includes *every\
    \ possible way* of phrasing every possible compliment and insult?\n\nIn Chapter\
    \ 1, I said that ML is not the only way to create an AI system. Here you’ve created\
    \ an AI program using a *rules-based* approach. You can see why, although rules-based\
    \ techniques like this are still used for some very simple AI projects, ML is\
    \ the preferred approach for more complicated projects. We’ll train our project\
    \ that way next, and later in the chapter we’ll see how the ML code performs compared\
    \ to the rules-based code.\n\n### Train Your Model\n\nTo train the computer to\
    \ recognize compliments and insults, you’ll collect examples of both and use them\
    \ to train an ML model.\n\n1.  Create a new ML project, name it `Make me happy`,\
    \ and set it to learn to recognize text in your preferred language. \n\n2.  Click\
    \ **Train**, as shown in [Figure 7-10](#c07.xhtml#figure7-10).\n\n    ![Figure\
    \ 7-10: Train is the first phase of an ML project.](image_fi/500563c07/f07010.png)\n\
    \n    [Figure 7-10:](#c07.xhtml#figureanchor7-10) Train is the first phase of\
    \ an ML project.\n\n3.  Click **Add new label**, as shown in [Figure 7-11](#c07.xhtml#figure7-11).\
    \ Name this training bucket `compliments`. Then, create a second training bucket\
    \ and name it `insults`.\n\n    ![Figure 7-11: Prepare two training buckets using\
    \ Add new label.](image_fi/500563c07/f07011.png)\n\n    [Figure 7-11:](#c07.xhtml#figureanchor7-11)\
    \ Prepare two training buckets using **Add new label**.\n\n4.  Click **Add example**\
    \ in the **compliments** bucket, as shown in [Figure 7-12](#c07.xhtml#figure7-12),\
    \ and type the best compliment that you can think of.\n\n    Repeat this step\
    \ to add at least five examples of compliments that will make your character happy.\
    \ These are the examples your ML model will use to learn what a compliment looks\
    \ like, so try to think of a wide variety.\n\n    ![Figure 7-12: Training examples\
    \ for recognizing compliments](image_fi/500563c07/f07012.png)\n\n    [Figure 7-12:](#c07.xhtml#figureanchor7-12)\
    \ Training examples for recognizing compliments\n\n5.  Click **Add example** in\
    \ the **insults** bucket, as shown in [Figure 7-13](#c07.xhtml#figure7-13), and\
    \ type the meanest, cruelest insult that you can think of.\n\n    Repeat this\
    \ step to add at least *five* examples of insults that will make your character\
    \ sad. Again, these are the examples that your ML model will use to learn what\
    \ an insult looks like, so try to come up with several variations.\n\n    ![Figure\
    \ 7-13: Training examples for recognizing insults](image_fi/500563c07/f07013.png)\n\
    \n    [Figure 7-13:](#c07.xhtml#figureanchor7-13) Training examples for recognizing\
    \ insults\n\n6.  Click **Back to project** in the top-left corner of the screen.\n\
    \n7.  Click **Learn & Test**.\n\n8.  Click **Train new machine learning model**,\
    \ as shown in [Figure 7-14](#c07.xhtml#figure7-14).\n\n    ![Figure 7-14: Training\
    \ a new ML model](image_fi/500563c07/f07014.png)\n\n    [Figure 7-14:](#c07.xhtml#figureanchor7-14)\
    \ Training a new ML model\n\n    The computer will use the examples you’ve just\
    \ created to learn how to recognize compliments and insults.\n\n    To do so,\
    \ it will look for patterns in the examples you’ve written. It will learn from\
    \ both the words you chose and the way you phrased the sentences. Then, it will\
    \ use these patterns to recognize the meaning of messages we’ll send to it in\
    \ the next steps.\n\n    Training the model might take a minute, but you’ll notice\
    \ that it’s much quicker than the image classifiers that you have been training\
    \ in the previous chapters. Learning to recognize patterns in text is much easier\
    \ for computers than learning to recognize patterns in images.\n\n9.  Test your\
    \ ML model by typing a compliment or insult into the **Test** box, as shown in\
    \ [Figure 7-15](#c07.xhtml#figure7-15).\n\n    It’s important that you test it\
    \ with examples you have not included in the training buckets. You’re testing\
    \ how well the computer can recognize new examples that it’s never seen before,\
    \ not how well it remembers the examples you’ve already given it.\n\n    If your\
    \ model gets things wrong, go back to the Train phase and add more examples. Then,\
    \ come back to the Learn & Test phase and train a new ML model.\n\n    Keep going\
    \ until you’re happy with how the computer performs. In the next chapter, you’ll\
    \ learn better ways to test ML models, but for now, simply trying out the model\
    \ a few times is a good start.\n\n    ![Figure 7-15: Testing is an important part\
    \ of ML.](image_fi/500563c07/f07015.png)\n\n    [Figure 7-15:](#c07.xhtml#figureanchor7-15)\
    \ Testing is an important part of ML.\n\n### Code Your Game with ML\n\nNow that\
    \ you have an ML model that can recognize compliments and insults, you’ll modify\
    \ your earlier project to use your ML model instead of the rules you used before.\n\
    \n1.  Click **Back to project** in the top-left corner of the screen.\n\n2.  Click\
    \ **Make**, as shown in [Figure 7-16](#c07.xhtml#figure7-16).\n\n    ![Figure\
    \ 7-16: Once you’re happy with your ML model, it’s time to make something with\
    \ it!](image_fi/500563c07/f07016.png)\n\n    [Figure 7-16:](#c07.xhtml#figureanchor7-16)\
    \ Once you’re happy with your ML model, it’s time to make something with it!\n\
    \n3.  Click **Scratch 3**, and then click **Open in Scratch 3** to open a new\
    \ window with Scratch.\n\n    You should see new blocks representing your ML model\
    \ in the Toolbox, as shown in [Figure 7-17](#c07.xhtml#figure7-17).\n\n    ![Figure\
    \ 7-17: Scratch will open with a new set of blocks for your project.](image_fi/500563c07/f07017.png)\n\
    \n    [Figure 7-17:](#c07.xhtml#figureanchor7-17) Scratch will open with a new\
    \ set of blocks for your project.\n\n4.  Open your saved project by clicking **File**▶**Load\
    \ from your computer**, as shown in [Figure 7-18](#c07.xhtml#figure7-18).\n\n\
    \    ![Figure 7-18: Open the rules-based project you worked on earlier.](image_fi/500563c07/f07018.png)\n\
    \n    [Figure 7-18:](#c07.xhtml#figureanchor7-18) Open the rules-based project\
    \ you worked on earlier."
