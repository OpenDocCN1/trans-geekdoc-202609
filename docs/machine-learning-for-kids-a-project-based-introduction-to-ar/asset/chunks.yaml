- raw: "     The names for the spaces on the game board should also match. For example,\
    \ the `top-middle` move goes into the `TopMiddle` space, as shown in [Figure 13-18](#c13.xhtml#figure13-18).\n\
    \n     ![Figure 13-18: Check that you’ve matched the names for the game board\
    \ spaces.](image_fi/500563c13/f13018.png)\n\n     [Figure 13-18:](#c13.xhtml#figureanchor13-18)\
    \ Check that you’ve matched the names for the game board spaces.\n\n     Make\
    \ sure you fill all of the spaces in the blocks. You’ll need to scroll to the\
    \ right to do this, as you can see in [Figure 13-19](#c13.xhtml#figure13-19).\n\
    \n     ![Figure 13-19: Make sure you fill in all of the spaces.](image_fi/500563c13/f13019.png)\n\
    \n     [Figure 13-19:](#c13.xhtml#figureanchor13-19) Make sure you fill in all\
    \ of the spaces.\n\n15.  Now find the `when I receive game over` script, as shown\
    \ in [Figure 13-20](#c13.xhtml#figure13-20). This script runs at the end of each\
    \ game and is responsible for calling the `add moves to training data` scripts\
    \ you’ve just set up.\n\n     ![Figure 13-20: Find the when I receivegame over\
    \ script.](image_fi/500563c13/f13020.png)\n\n     [Figure 13-20:](#c13.xhtml#figureanchor13-20)\
    \ Find the `when I receive``game over` script.\n\n     Add a new `train new machine\
    \ learning model` block to the end of the `when I receive game over` script, as\
    \ shown in [Figure 13-21](#c13.xhtml#figure13-21).\n\n     ![Figure 13-21: Train\
    \ a new ML model after every game.](image_fi/500563c13/f13021.png)\n\n     [Figure\
    \ 13-21:](#c13.xhtml#figureanchor13-21) Train a new ML model after every game.\n\
    \nNow, at the end of every game, the winner’s moves will be added to the training\
    \ buckets, and you’ll use that updated set of training examples to train a new\
    \ ML model. This means that your ML model should get a little smarter, and a little\
    \ better, after every game you play.\n\n### Train Your Model\n\nIt’s time to play!\n\
    \n1.  Click the full-screen icon and then the Green Flag in the controls at the\
    \ top right of the screen. Play *one* game of Tic Tac Toe, as shown in [Figure\
    \ 13-22](#c13.xhtml#figure13-22).\n\n    ![Figure 13-22: Play a game of Tic Tac\
    \ Toe.](image_fi/500563c13/f13022.png)\n\n    [Figure 13-22:](#c13.xhtml#figureanchor13-22)\
    \ Play a game of Tic Tac Toe.\n\n2.  After the game, click **Back to project**\
    \ and then **Train**. You should see all of the moves made by the winning player,\
    \ as shown in [Figure 13-23](#c13.xhtml#figure13-23). \n\n    ![Figure 13-23:\
    \ Compare the training data with the game in Figure 13-22.](image_fi/500563c13/f13023.png)\n\
    \n    [Figure 13-23:](#c13.xhtml#figureanchor13-23) Compare the training data\
    \ with the game in [Figure 13-22](#c13.xhtml#figure13-22).\n\n3.  Now that you\
    \ have an ML model, it’s time to update the Scratch game so that the computer\
    \ can use the model to decide where to make its moves. Scroll through the Code\
    \ Area to find the `define``use machine learning model` script, as shown in [Figure\
    \ 13-24](#c13.xhtml#figure13-24).\n\n    ![Figure 13-24: Find the define use machine\
    \ learning model script.](image_fi/500563c13/f13024.png)\n\n    [Figure 13-24:](#c13.xhtml#figureanchor13-24)\
    \ Find the `define use machine learning model` script.\n\n    Update the script\
    \ as shown in [Figure 13-25](#c13.xhtml#figure13-25) so that it uses your ML model\
    \ to recognize the best move for the computer to make.\n\n    ![Figure 13-25:\
    \ Add the recognise numbers(label) block to the script.](image_fi/500563c13/f13025.png)\n\
    \n    [Figure 13-25:](#c13.xhtml#figureanchor13-25) Add the `recognise numbers``(label)`\
    \ block to the script.\n\n4.  Drag the orange blocks into the `recognise numbers``(label)`\
    \ block, as shown in [Figure 13-26](#c13.xhtml#figure13-26). As before, these\
    \ are ready for you in the template immediately underneath where they should go.\
    \ This code block will give the game board’s current state to the ML model so\
    \ that the model can use that information to recognize the best next move.\n\n\
    \    Make sure that you add all nine blocks, for all nine spaces on the game board,\
    \ and work from left to right. Also be sure that the block names match up. For\
    \ example, `current state top-middle` goes into the `TopMiddle` space.\n\n![Figure\
    \ 13-26: Make sure that you match the block names correctly.](image_fi/500563c13/f13026.png)\n\
    \n[Figure 13-26:](#c13.xhtml#figureanchor13-26) Make sure that you match the block\
    \ names correctly.\n\n### Test Your Game\n\nIt’s time to test your project!\n\n\
    Because you’ve coded your project to learn as you play, you should see the computer\
    \ get better at the game over time. But how can you verify if that actually happens?\n\
    \nOne way is to play a lot of games, keep a count of the number of times the computer\
    \ wins, and plot whether the number increases with the amount of training you\
    \ gave the ML model.\n\nI played 300 games of Tic Tac Toe and counted the number\
    \ of matches that I won, lost, and tied. I plotted the results in the bar chart\
    \ shown in [Figure 13-27](#c13.xhtml#figure13-27). Each column represents 10 games\
    \ of Tic Tac Toe. Green represents games that I won. Orange represents games that\
    \ ended in a tie. Red represents games won by the ML system.\n\nThe bar on the\
    \ far left represents the first 10 games that I played. I won all 10 of them.\n\
    \nThe next bar represents the next 10 games that I played. I won all 10 of those,\
    \ too.\n\nThe bar on the far right represents the last 10 games that I played.\
    \ I won 2 games, tied 4 games, and lost 4 games.\n\n![Figure 13-27: The results\
    \ from Tic Tac Toe games that I played](image_fi/500563c13/f13027.png)\n\n[Figure\
    \ 13-27:](#c13.xhtml#figureanchor13-27) The results from Tic Tac Toe games that\
    \ I played\n\nMy first 10 games were very easy to win. The computer made foolish\
    \ moves, and I didn’t have to try hard to win. By my last 10 games, however, it\
    \ was harder to win. I had to concentrate and not make a single mistake to win\
    \ a game. Although my feelings can’t be shown on the graph, it *felt* to me like\
    \ the computer was getting better as I played.\n\nEvery ML project will go a little\
    \ differently, so try training your own model and measuring how your project learns\
    \ and improves. Hopefully you’ll see that the more training examples you collect,\
    \ the better your ML model performs. But you’ll almost certainly see some variation\
    \ in that, as I did.\n\n## Review and Improve Your Project\n\nYou created an ML\
    \ system that learns to play Tic Tac Toe by competing against you. The biggest\
    \ challenge with training the system yourself is the time it takes to play hundreds\
    \ of training games. Are there more efficient ways to get more training examples?\n\
    \nOne common way is to get more people to help. Imagine if, instead of playing\
    \ the 300 games myself, I had saved my Scratch project and gave the project file\
    \ to 30 friends and asked them to play 10 games each. Dividing the work would\
    \ have made training much easier, as playing only 10 games would be very quick\
    \ for each person.\n\nNow imagine if I could get 300 people to help, or 3,000!\n\
    \nHopefully you can see the benefits of spreading the work of training an ML model\
    \ across a large number of people. This is sometimes described as *crowdsourcing*.\
    \ There are some challenges with that, too, like being able to find a large group\
    \ of people, coordinating them, explaining what you want to all of them, making\
    \ sure they all do what you want and don’t train your ML model to do things you\
    \ don’t want, and so on. But even so, using many people for training is still\
    \ the best option for a lot of complicated projects.\n\n## What You Learned"
