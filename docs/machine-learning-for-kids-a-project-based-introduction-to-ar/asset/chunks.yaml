    on to Scratch.


    Test your ML model by clicking `Test by drawing`, as shown in [Figure 6-9](#c06.xhtml#figure6-9).
    Try writing codes for your cities and see how good the computer is at recognizing
    what you write.


    ![Figure 6-9: Testing is an important part of ML projects.](image_fi/500563c06/f06009.png)

    [Figure 6-9:](#c06.xhtml#figureanchor6-9) Testing is an important part of ML projects.


    If you don’t see the Test by drawing button, your ML model hasn’t finished training
    yet. You may need to wait for another minute or two.


    If you’re not happy with how well your ML model recognizes the postcodes, you
    can go back to the Train phase and add more examples. In general, the more training
    examples you use, the better your ML model will perform. Remember to click `Train
    new machine learning model` again to update your ML model with the new examples.


    ### Prepare Your Project


    Now you’ll test your ML model further by creating a virtual mail sorting office
    in Scratch that uses your OCR system to sort envelopes.


    1. Click `Back to project` in the top-left corner of the screen.


    2. Click `Make`, as shown in [Figure 6-10](#c06.xhtml#figure6-10).


    ![Figure 6-10: Make is the third phase of an ML project.](image_fi/500563c06/f06010.png)

    [Figure 6-10:](#c06.xhtml#figureanchor6-10) Make is the third phase of an ML project.


    3. Click `Scratch 3`, and then click `Open in Scratch 3` to open a new window
    with Scratch. You should see a new section in the Toolbox, as shown in [Figure
    6-11](#c06.xhtml#figure6-11), containing blocks from your Sorting Office project.


    ![Figure 6-11: Scratch 3 with your ML model blocks](image_fi/500563c06/f06011.png)

    [Figure 6-11:](#c06.xhtml#figureanchor6-11) Scratch 3 with your ML model blocks


    4. In the top of the Scratch window, click `Project templates`, as shown in [Figure
    6-12](#c06.xhtml#figure6-12).


    This lets you access sample projects and starter code to help save you time.


    ![Figure 6-12: Click Project templates in the top menu.](image_fi/500563c06/f06012.png)

    [Figure 6-12:](#c06.xhtml#figureanchor6-12) Click `Project templates` in the top
    menu.


    5. Click the `Sorting Office` template, as shown in [Figure 6-13](#c06.xhtml#figure6-13).


    ![Figure 6-13: The Sorting Office project template](image_fi/500563c06/f06013.png)

    [Figure 6-13:](#c06.xhtml#figureanchor6-13) The Sorting Office project template


    6. Click the `Stage` backdrop, as shown in [Figure 6-14](#c06.xhtml#figure6-14).


    ![Figure 6-14: Click the Stage backdrop for the Sorting Office project.](image_fi/500563c06/f06014.png)

    [Figure 6-14:](#c06.xhtml#figureanchor6-14) Click the `Stage` backdrop for the
    Sorting Office project.


    7. Click the `Backdrops` tab, as shown in [Figure 6-15](#c06.xhtml#figure6-15).


    8. Use the `Text` tool to edit the labels on the mail sacks. Edit all three sacks
    so that their labels match the names of the cities you chose. If can’t fit the
    city’s whole name you can just use the `postcode`.


    ![Figure 6-15: Edit the sack labels to match the cities.](image_fi/500563c06/f06015.png)

    [Figure 6-15:](#c06.xhtml#figureanchor6-15) Edit the sack labels to match the
    cities.


    9. Click the `postcode` sprite and then click the `Costumes` tab, as shown in
    [Figure 6-16](#c06.xhtml#figure6-16).


    ![Figure 6-16: You’ll find the postcode sprite in the sprites list.](image_fi/500563c06/f06016.
    (Wait, original text had duplicate steps, let''s re-align))


    10. Use the `Paintbrush` tool to write the letters for one of your cities onto
    the canvas. You’ll get the best results if you match the line style to the training
    examples you wrote before, so set `Fill` to black and the line width to about
    `20`, as shown in [Figure 6-17](#c06.xhtml#figure6-17).


    ![Figure 6-17: Set the paint tools to match your training examples.](image_fi/500563c06/f06017.png)

    [Figure 6-17:](#c06.xhtml#figureanchor6-17) Set the paint tools to match your
    training examples.


    11. When you’ve finished, click the `Paint` button in the bottom-left corner to
    add a new costume, as shown in [Figure 6-18](#c06.xhtml#figure6-18).


    ![Figure 6-18: Click the Paint button to add new costumes to the postcode sprite.](image_fi/500563c06/f06018.png)

    [Figure 6-18:](#c06.xhtml#figureanchor6-18) Click the `Paint` button to add new
    costumes to the postcode sprite.


    12. Repeat steps 10 and 11 until you have several costumes in the `postcode` sprite.
    Draw each city’s code multiple times, as shown in [Figure 6-19](#c06.xhtml#figure6-19).
    Don’t worry if you make a mistake while drawing—just click the blue undo arrow
    next to the costume.


    ![Figure 6-19: Draw several test costumes in the postcode sprite.](image_fi/500563c06/f06019.png)

    [Figure 6-19:](#c06.xhtml#figureanchor6-19) Draw several test costumes in the
    postcode sprite.


    13. Click the `Code` tab and find the `when Green Flag clicked` script, as shown
    in [Figure 6-20](#c06.xhtml#figure6-20). You might need to scroll around to find
    this script. It should be in the top left of the `Code Area`.


    ![Figure 6-20: Find the when Green Flag clicked script in the postcode sprite.](image_fi/500563c06/f06020.png)

    [Figure 6-20:](#c06.xhtml#figureanchor6-20) Find the `when Green Flag clicked`
    script in the postcode sprite.


    1. Drag the blocks with the names of your cities into the `when Green Flag clicked`
    script, as shown in [Figure 6-21](#c06.xhtml#figure6-21). There’s more than one
    `when Green Flag clicked` script in the `Code Area`, so scroll around until you
    find the one that looks like the script in [Figure 6-21]. It’s important that
    you match the order with the names you wrote on the mail sacks on the backdrop.
    The left sack is `destination1`. The middle sack is `destination2`. The right
    sack is `destination3`.


    ![Figure 6-21: Identify the names of your cities for the project.](image_fi/500563c06/f06021.png)

    [Figure 6-21:](#c06.xhtml#figureanchor6-21) Identify the names of your cities
    for the project.


    2. Find the `recognise postcode` script in the `Code Area`. It should be immediately
    beneath the `when Green Flag clicked` script from the previous step, still on
    the `postcode` sprite.


    3. Drag the `recognise image (label)` block into the `recognise postcode` script,
    and then drag the `costume image` block into the `recognise image (label)` block,
    as shown in [Figure 6-22](#c06.xhtml#figure6-22).


    ![Figure 6-22: Script for recognizing the postcode on an envelope](image_fi/500563c06/f06022.png)

    [Figure 6-22:](#c06.xhtml#figureanchor6-22) Script for recognizing the postcode
    on an envelope.


    ### Test Your Project


    It’s time to try sorting some letters!

