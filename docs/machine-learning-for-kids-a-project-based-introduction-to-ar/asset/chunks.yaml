    ## Review and Improve Your Project


    How can you describe how well the ML model is doing?


    In Chapter 8, you learned that you can keep a count of the number of times the
    computer gets things right and wrong:


    1. True positive: Tiles the computer thought included the duck, and did

    2. False positive: Tiles the computer thought included the duck, but didn’t

    3. True negative: Tiles the computer thought didn’t include the duck, and didn’t

    4. False negative: Tiles the computer thought didn’t include the duck, but did


    You can use this count to draw up a confusion matrix and calculate the accuracy,
    recall, and precision of your ML model.


    For example, look at the test image in [Figure 9-24](#c09.xhtml#figure9-24).


    ![Figure 9-24: A test image with the two bottom-right tiles recognized as a match](image_fi/500563c09/f09024.png)


    [Figure 9-24:](#c09.xhtml#figureanchor9-24) A test image with the two bottom-right
    tiles recognized as a match


    The duck was present in the four tiles in the bottom right of the board. Two of
    them were recognized by my ML model. Two were missed. So, my confusion matrix
    looks like this:


    | True positives | 2 | False positives | 0 |

    | :--- | :--- | :--- | :--- |

    | False negatives | 2 | True negatives | 8 |


    This confusion matrix gives me:


    1. Precision: 100% (Every time my ML model thought it saw a duck, there was a
    duck there.)

    2. Recall: 50% (My ML model found half of the tiles that contained a duck.)

    3. Accuracy: 83% (My ML model gave 10 correct answers out of 12 total answers.)


    You need a larger sample size, including several different backgrounds, to really
    trust these numbers.


    I ran this test five times, and my overall results were as follows:


    | True positives | 9 | False positives | 0 |

    | :--- | :--- | :--- | :--- |

    | False negatives | 6 | True negatives | 45 |


    1. Precision: 100%

    2. Recall: 60%

    3. Accuracy: 90%


    These numbers give us a more meaningful way of describing the performance of the
    ML model.


    My model, which was trained with only a small number of examples, seems to be
    very precise (when it recognizes a duck, it is always correct). However, it misses
    things sometimes.


    We describe a precise model that sometimes misses things as *favoring precision
    over recall*. This is a good approach for projects where it is important not to
    falsely recognize things.


    For projects where it is more important to not miss anything, and where it is
    okay to make the occasional mistake, you would aim to train ML models in a way
    that *favors recall over precision* instead.


    How is your project performing?


    ## Real-World Applications for Complex Image Recognition Systems


    You might have trained an image recognition ML model like this before. Have you
    ever been asked by a website to prove that you’re a human by clicking pictures
    of street signs as in [Figure 9-25](#c09.xhtml#figure9-25)? Or bicycles? Or taxis?


    ![Figure 9-25: Helping to train an ML model](image_fi/500563c09/f09025.png)


    [Figure 9-25:](#c09.xhtml#figureanchor9-25) Helping to train an ML model


    Hopefully you can see how this kind of image recognition application, known as
    a *CAPTCHA*, would be a great way to collect a large number of training examples
    for an image recognition system that can find different things on the street.
    Do you think this would be useful in the development of self-driving cars?


    The basic idea here is described in the chapter’s introduction. If we want to
    find something small in a larger picture, we chop the picture up into smaller
    tiles and test each tile individually with an ML model trained to recognize it.

