    ![Figure 3-17:](img/#c03.xhtml#figureanchor3-17) 动物照片排序的示例代码


    这段代码将遍历你的每一个测试照片造型，并使用你的 ML 模型识别动物并将其移动到正确的区域。


    1. `go to x: 10 y: -145` 模块 1 设置了每张照片的起始位置。此脚本将让每张照片从屏幕底部中间开始。调整这些坐标，以符合你背景的起始位置。

    2. `recognise image` 模块 2 使用你的 ML 模型来识别照片。

    3. `glide to x: pick random -200 to -50 y: pick random 50 to 150` 模块 3 将照片移动到屏幕左上角的随机位置。调整这些坐标，直到你背景上你希望放置第一类动物照片的位置。

    4. `The glide to x: pick random 70 to 210 y: pick random 50 to 150` 模块 4 将照片移动到屏幕右上角的随机位置。调整这些坐标，直到你背景上你希望放置第二类动物照片的位置。

    5. `if my variable is < 14` 5 中的数字指的是你有多少张测试照片。将此值设置为你在第 2 步保存并在第 8 步上传的测试造型数量。我的测试精灵有
    14 个造型，因此我的脚本会处理 14 张测试照片。


    ### 测试你的模型


    要测试你创建的模型，点击左上角的绿色旗帜，如 图 3-18 所示。你的模型将你的测试照片分为两组动物。


    数一数你的模型移动到正确侧的照片数量。这是衡量你的项目排序两类动物照片好坏的简单方法。


    ![Figure 3-18: 识别照片并将其分组](img/f03018.png)


    ![Figure 3-18:](img/#c03.xhtml#figureanchor3-18) 识别照片并将其分组


    如果你的模型犯错率很高，你可以尝试使用更多的训练示例来改进它。回到“训练（Train）”阶段，拖入更多每类动物的照片。然后回到“学习与测试（Learn &
    Test）”阶段，训练新的、经过改进的 ML 模型。再次运行你的 Scratch 脚本，看看新模型是否能更准确地排序你的测试照片。


    ## 回顾并改进你的项目


    你已经成功训练了一个 ML 模型来识别动物照片！这个项目不是基于规则的。你没有描述不同动物看起来什么样，也没有给计算机关于如何识别它们的特定指令。相反，你利用了
    ML 来训练计算机完成这项任务。这种方法被称为 `supervised learning`（监督学习），因为你通过为计算机准备训练训练示例集来监督了整个过程。


    只要你的测试照片与训练照片相似，你的模型就应该有效。然而，如果你用与训练照片有所不同的图片来测试模型，你可能会得到不同的结果。


    例如，我尝试将 Scratch 项目中的造型替换为牛和羊的卡通插画，而不是照片。然后我再次点击绿色旗帜运行我的代码。如 图 3-19 所示，我的新模型犯了很多错。


    ![Figure 3-19: 如果测试输入与训练输入不相似，ML 模型会犯很多错。](img/f03019.png)


    ![Figure 3-19:](img/#c03.xhtml#figureanchor3-19) 如果测试输入与训练输入不相似，ML 模型会犯很多错。


    我得到这些结果是因为我的模型从训练照片中学到的识别的模式对于帮助它识别卡通画没有用。如果你让计算机能够识别照片*并且*卡通，你需要同时用这两者对它进行训练。


    回到“训练（Train）”阶段，创建一个包含照片和卡通的新型训练示例集，如 图 3-20 所示。我在每个桶中收集了 10 张示例照片和 10 张示例卡通。


    ![Figure 3-20: 训练计算机识别照片和卡通](img/f03020.png)


    ![Figure 3-20:](img/#c03.xhtml#figureanchor3-20) 训练计算机识别照片和卡通


    然后回到“学习与测试（Learn & Test）”阶段，使用你新的训练示例集训练一个新的 ML 模型。这组新示例应该教计算机识别照片和卡通中的模式，以便它可以识别这两者。图
    3-21 显示了我更新后的 ML 模型表现好了多少。


    ![Figure 3-21: 使用照片和画的混合进行测试](img/f03021.png)


    ![Figure 3-21:](img/#c03.xhtml#figureanchor3-21) 使用照片和画的混合进行测试


    如你所示，测试图像与计算机学习的训练图像越相似，ML 模型的性能越好。


    你还可以对项目做哪些其他更改？


    ## 你学到了


    在本章中，你使用了 ML 创建了一个可以排序照片的系统。你通过计算模型移动到正确侧的照片数量来了解如何衡量效果。你学会了测试输入与训练输入之间的相似性如何影响模型性能。你学会了通过增加训练示例（例如同时包含照片和卡通）来改进模型。你还学习了
    `supervised learning`（监督学习）的概念。


