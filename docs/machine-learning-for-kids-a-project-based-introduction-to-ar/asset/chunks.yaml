    \ just because it is a question. That would still be be useful information, as\
    \ it’s telling you that there’s a `90` percent chance that the message isn’t an\
    \ insult. It’s saying that the message had some similarities to patterns that\
    \ it recognizes from the insults it learned from, but that it isn’t able to confidently\
    \ identify the message as an insult.\n\nExperiment with different test sentences\
    \ that aren’t compliments or insults to see what sort of confidence scores you\
    \ get. Compare these with the confidence scores you get when you test your ML\
    \ model on messages that really are compliments and insults.\n\nWhat sort of confidence\
    \ score does your ML model give when it correctly recognizes an actual compliment\
    \ or insult?\n\nYou can use the confidence score in your Scratch project, as shown\
    \ in [Figure 7-22](#c07.xhtml#figure7-22).\n\n![Figure 7-22: Using the confidence\
    \ score in your code](image_fi/500563c07/f07022.png)\n\n[Figure 7-22:](#c07.xhtml#figureanchor7-22)\
    \ Using the confidence score in your code\n\nThis script will make the character\
    \ react only if the ML model is at least `70` percent confident that it has recognized\
    \ the message. Otherwise, the script will ignore the message.\n\nYou’ll need to\
    \ change `70` to a percentage that works for your ML model, based on your testing.\n\
    \n### Learning from Mistakes\n\nWhen someone is using an ML system, they’ll often\
    \ know if the has made a mistake. One way to improve your ML project is to let\
    \ it learn from those mistakes.\n\nGive the user a way to tell the project if\
    \ it makes a mistake. It could be a button to click, or a text box where they\
    \ type “yes” or “no” in response to being asked, “Did I get that right?”\n\nThe\
    \ script shown in [Figure 7-23](#c07.xhtml#figure7-23) will ask if the ML model\
    \ is correct. If you type “no,” the text the computer didn’t recognize correctly\
    \ will be added to the training examples. After five new training examples, a\
    \ new ML model is trained.\n\n ![Figure 7-23: Learning from mistakes](image_fi/500563c07/f07023.png)\n\
    \n[Figure 7-23:](#c07.xhtml#figureanchor7-23) Learning from mistakes\n\n## What\
    \ You Learned\n\nIn this chapter, you learned about *sentiment analysis*, the\
    \ use of ML to recognize the tone and emotion in text. You learned how businesses\
    \ and organizations use sentiment analysis to get valuable insight and feedback\
    \ from customers, prioritize customer service responses, and measure employee\
    \ satisfaction.\n\nYou discovered that ML is a much better approach to building\
    \ AI systems for complex projects than a simple rules-based method. You also learned\
    \ how confidence scores can tell you how sure an ML model is of the predictions\
    \ it’s making, and saw how you could improve your ML models by helping them learn\
    \ from their mistakes.\n\nIn the next chapter, you’ll use an approach similar\
    \ to sentiment analysis to train a model to recognize different styles of writing.\n\
    \n# 8 Recognizing Language in Newspapers\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)n\
    \ the last chapter, you saw that computers can be trained to recognize different\
    \ characteristics of writing. For that project, you trained an ML model to recognize\
    \ compliments and insults. Computers can also learn to recognize lots of other\
    \ styles of writing as well.\n"
  trans: "\n\n## 5. 如果你之前创建了基于规则的脚本，请将其更新以匹配图 7-19。如果你在项目项目中跳过了基于规则的方法，请创建图 7-19 中所示的完整脚本。\n\
    \n![图 7-19：使用 ML 编写项目](img/f07019.png)\n\n图 7-19： 使用 ML 编写项目\n\n在这个脚本中，你的角色会要求你对它说些什么。该脚本使用你的\
    \ ML 模型来识别你输入的消息是赞美还是侮辱。它将根据识别结果显示你绘制的画装之一，这使其看起来就像你的角色正在对你是在赞美还是侮辱它做出反应！\n\n\
    如果你之前在没有使用 ML 的情况下编写过这个项目，请将此脚本与上一个进行比较。你能看到 ML 是如何让创建一个能够对更多可能的消息做出反应的项目变得更简单的吗？\n\
    \n### 测试你的游戏\n\n是时候测试你的项目了。点击绿色旗帜并尝试输入一些消息。即使你输入了没有在训练时使用的内容，希望角色也能正确地对你的消息做出反应。如果没有反应，你可以随时返回“训练阶段”（Train\
    \ phase）添加更多示例，然后训练新的 ML 模型。\n\n你已经成功创建了一个学会识别并对你给它的赞美和侮辱做出的角色！\n\n## 审查并改进你的项目\n\
    \n让我们来看看你可以改进此项目的几种方法。\n\n### 使用语音输入代替输入\n\n将你的项目改为通过大声说出你的赞美和侮辱而不是输入会怎么样？\n\n\
    你需要电脑上有一个麦克风才能使用语音输入，并且你需要从 Scratch 扩展库中添加“语音转文本”（Speech to Text）扩展。要访问扩展库，点击工具箱底部的“添加扩展”图标（看起来像两个带有加号\
    \ `+` 的积木）。该库包含了你可以在项目中使用的额外积木。\n\n找到并点击`Speech to Text` 扩展将这些积木添加到你的工具箱，然后更新你的脚本使其看起来像图\
    \ 7-20。\n\n ![图 7-20：使用语音识别的“让我开心”项目](img/f07020.png)\n\n图 7-20： 使用语音识别的“让我开心”项目\n\
    \n语音识别是 ML 的另一个应用。对于这项改进，你不需要自己训练语音 ML 模型，而是使用别人已经为你训练好的模型。但创建语音积木背后的基本原理与你创建输入的赞美和侮辱示例是相似的。\n\
    \n你还可以做些什么来改进你的项目？\n\n### 识别不是赞美或侮辱的语音\n\n向你的角色输入`现在几点了？`。它可能会认为这个问题是赞美并看起来很开心。或者它可能会将其识别为侮辱并看起来很难过。\n\
    \n这两种反应都不是正确的做法。你可以更新代码，使其在收到既不是赞美也不是侮辱的消息时完全不做出反应。\n\n当你在“学习与测试阶段”（Learn & Test\
    \ phase）测试你的 ML 模型时，你可能注意到置信度评分（confidence score）显示了计算机对其已识别消息的把握程度。\n\n现在再次尝试输入`现在几点了？`，如图\
    \ 7-21 所示。\n\n ![图 7-21：测试分类“现在几点了？”的置信度](img/f07021.png)\n\n图 7-21： 测试分类“现在几点了？”的置信度\n\
    \n你会发现这条消息的置信度评分非常低。这是 ML 模型告诉你它没有识别出这段文本的方式。它表示在你给它的所有训练示例中，它从未见过类似的内容，因此无法识别该消息是赞美还是侮辱。\n\
    \n我的 ML 模型在分类“现在几点了？”时的置信度得分为 `0`。你的 ML 模型得分可能会高一点，取决于你是如何训练它的。例如，如果你在侮辱桶中包含了许多诸如“你你怎么了？”的问题，那么你的\
    \ ML 模型可能对“现在几点了？”是侮辱有 `10`% 的置信度，仅仅是因为它是一个问题。这仍然是有用的信息，因为它告诉你有 `90`% 的几率该消息不是侮辱。它表示该消息与它从学过的侮辱中识别出的模式有一些相似之处，但它无法有信心地识别出该消息为侮辱。\n\
    \n尝试不同的不是赞美或侮辱的测试句子，看看你会得到什么种的置信度评分。将这些与你在对确实是赞美和侮辱的消息进行 ML 模型测试时所得到的置信度评分进行比较。\n\
    \n当你的 ML 模型正确识别出真正的赞美或侮辱时，它给出什么种的置信度评分？\n\n你可以像图 7-22 所示，在你的 Scratch 项目中使用置信度评分。\n\
    \n![图 7-22：使用 _ 图 7-22：在代码中使用置信度评分](img/f07022.png)\n\n图 7-22： 在代码中使用置信度评分\n\n\
    该脚本只有在 ML 模型对识别出消息至少有 `70`% 的信心时，才会让角色做出反应。否则，脚本将忽略该消息。\n\n你需要将 `70` 改为适用于你的 ML\
    \ 模型的百分比。\n\n### 从错误中学习\n\n当有人使用 ML 系统时，他们通常知道自己犯了错误。改进你的 ML 项目的一种方法是让它从这些错误中学习。\n\
    \n给用户一种方法来告诉项目它犯了错误。可以是按钮，也可以是一个文本框，让他们在回答“我得对了吗？”时输入“是”或“否”。\n\n图 7-23 所示的脚本将询问是否正确。如果你输入“否”，未正确识别的文本将被添加到示例中。在五个新示例之后，将训练一个新的\
    \ ML 模型。\n\n ![图 7-23：从错误中学习](img/f07023.png)\n\n图 7-23： 从错误中学习\n\n## 你学到的知识\n\
    \n在本章中，你学习了*情感分析*，即使用 ML 识别文本中的语气和情感。你学习了企业和组织如何利用情感分析从客户那里获得贵的见解和反馈、优先处理响应以及衡量员工满意度。\n\
    \n你发现，对于复杂的项目，使用 ML 构建 AI 系统的方法比简单的基于规则的方法好得多。你还学习了置信度评分如何告诉你 ML 模型对其预测有多确定，并看到了如何通过帮助它们从错误中学习来改进你的\
    \ ML 模型。\n\n在下一章中，你将使用类似于情感分析的方法训练模型识别不同的写作风格。\n\n# 8 识别报纸语言\n\n在上一章中，你看到计算机可以被训练识别写作的不同特征。对于那个项目，你训练了一个\
    \ ML 模型来识别赞美和侮辱。计算机也可以学习许多其他写作风格。\n"
