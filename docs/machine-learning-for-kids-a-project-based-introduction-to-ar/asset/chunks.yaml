    If you can figure out when your ML model gets something wrong, you can collect
    more examples to add to your training buckets. For example, what if the ML model
    has a very low confidence score? Or what if someone keeps giving a similar command
    in slightly different ways? That probably means that the ML model isn’t recognizing
    the commands correctly or doing what the person wants, and that’s helpful feedback
    for your training. What if the person clicks a thumbs-down “I’m not happy” button?
    What if they end up pressing a button to do something? What if they sound more
    and more annoyed?


    There are lots of ways to guess that something hasn’t worked well. And every time
    that happens, that’s an example you could collect and add to one of your training
    buckets so a newer ML model can work a little better next time.


    We use all these sorts of techniques (collecting training examples from large
    numbers of people, getting feedback from users, and many more) to help us build
    computers and devices that can understand what you mean.


    ## What You Learned


    In this chapter, we’ve looked at how ML is used to recognize the meaning of text,
    and how it can be used to build computer systems that can understand what we mean
    and do what we ask.


    In your project, you used the same type of ML technology that enables `smart assistants`
    like Amazon’s Alexa, Google Home, Microsoft’s Cortana, and Apple’s Siri. `Natural
    language interfaces` let us tell our devices what we want them to do by using
    languages like English, instead of only by pressing screens or buttons.


    When you ask a smartphone what the time is, or to set an alarm or a timer, or
    to play your favorite song, the computer needs to classify that command. It needs
    to take that series of words that you chose and recognize their intent.


    The makers of smartphones and smart assistants trained an ML model to recognize
    the meaning of user commands by working out a list of categories—all of the possible
    commands they thought users might want to give. And then for each one, they collected
    lots and lots examples of how someone might give that command.


    In both this project and the real world, the process works like this:


    1. Predict commands that you might give.

    2. Collect examples of each of those commands.

    3. Use those examples to train an ML model.

    4. Script or code what you want the computer to do when it recognizes each command.


    To create a real smart assistant, you’d have to repeat these steps for thousands
    of commands, not just four. And you would need thousands, or tens of thousands,
    of examples for each command.


    In the next chapter, you’ll use this capability to build programs that can answer
    questions.


    ![](image_fi/book_art/chapterart.png)


    # 11 Chatbots


    ![Alphabet-I](image_fi/book_art/Alphabet-I.png) In the last chapter, we talked
    about `intent classification`: building ML systems that can recognize the meaning
    (the intention) of text. We talked about one common use of intent classification,
    which is to build smart assistants that can understand what we’re telling them
    and carry out our commands.


    In this chapter, we’ll look at how ML models that understand the meaning of text
    can be used to build `question answering (QA) systems`. QA systems recognize and
    respond to our questions, discovering the answers automatically from a set of
    documents.


    Unlike search engines, which return a list of web pages, QA systems return a specific
    answer to a specific question. This is more challenging, as it requires a deep
    understanding of both the question and the meaning of the web pages or documents
    that may contain the answers. For example, the correct answer to a question like
    “Who was President Cleveland’s wife?” is “Frances Folsom,” not a list of documents
    that include biographies of US presidents.


    QA has been a goal and active area of AI research for many years. For example,
    the US National Institute of Standards and Technology (NIST) has run a QA competition
    every year since 1999, where universities and companies compete to see which of
    their computer systems can answer the most questions correctly.


    Perhaps better known is the IBM QA computer system Watson, which, as mentioned
    in Chapter 1, competed on the US television quiz show `Jeopardy!` and beat two
    champions. `Jeopardy!` is known for asking complex and sometimes tricky questions
    on a huge variety of topics, and therefore is a particularly challenging test
    for a computer.


    `Chatbots`, programs that imitate human conversation, are a simpler task for computers
    than QA systems, for many reasons. First, a chatbot is generally created to answer
    questions about a single fairly small and specific topic, whereas QA systems attempt
    to answer questions on any topic.


    In addition, chatbot responses are often prepared in advance. Simple chatbots
    usually aren’t expected to be able to find the answer for themselves. Complex
    chatbots may have more detailed scripts that allow for follow-up or clarifying
    questions, but the general principle is the same.


    Chatbots are becoming very common. They’re often used for customer service, where
    companies need to answer questions from the public about their products and services.
    Frequently asked questions can be quickly and efficiently answered, with more
    complex questions quickly redirected to human customer service representatives.


    You can find chatbots and virtual assistants on many websites and phone apps—taking
    your pizza order, recommending clothing and fashion accessories, answering questions
    about the weather, managing your bank account, arranging meetings and appointments,
    finding a restaurant and booking a table, offering advice to help you manage a
    medical condition, and much more.


    In this project, you’ll create your own chatbot and train it to answer questions
    on a topic of your choice (as shown in [Figure 11-1](#c11.xhtml#figure11-1)).
    We’ll follow this process:


    1. Predict questions that users might ask.

    2. Collect examples of how to ask each of those questions.

    3. Use those examples to train an ML model.

    4. Prepare the answer the computer should give when it recognizes each question.


    ![Figure 11-1: Chatbots use ML to answer our questions.](image_fi/500563c11/f11001.png)


    [Figure 11-1:](#c11.xhtml#figureanchor11-1) Chatbots use ML to answer our questions.


    Let’s get started!


    ## Build Your Project


    Decide what you’d like your chatbot to answer questions about. This can be any
    topic you like, but here are a few suggestions to help if you can’t think of one:


    * Your favorite book

    * Your favorite TV show

    * Your favorite sports team

    * Your favorite actor, author, or music artist

    * Space, planets, and the solar system

    * Dinosaurs

    * A period of history, such as ancient Rome or the Viking Age


    For the screenshots in this chapter, I made a chatbot that answers questions about
    the moon.


    ### Prepare Your Character


    Go to Scratch at `https://machinelearningforkids.co.uk/scratch3/` and add a backdrop
    and a character for your QA chatbot.


    Make sure the scene you create matches your topic. For example, if you’re making
    a chatbot to answer questions about the Roman Empire, you could draw a Roman centurion
    in a battlefield.


    For my chatbot about the moon, I drew a space-themed backdrop, as shown in [Figure
    11-2](#c11.xhtml#figure11-2).


    ![Figure 11-2: Create a custom backdrop for your chatbot character.](image_fi/500563c11/f11002.png)


