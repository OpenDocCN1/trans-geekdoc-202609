    \ else you can think of.\n\n1.  Go to [https://machinelearningforkids.co.uk/scratch3/](https://machinelearningforkids.co.uk/scratch3/)\
    \ to start a new Scratch project.\n\n2.  Click the `Costumes` tab, as shown in\
    \ [Figure 7-2](#c07.xhtml#figure7-2).\n\n    ![Figure 7-2: Designing a character\
    \ in the Costumes tab](image_fi/500563c07/f07002.png)\n\n    [Figure 7-2:](#c07.xhtml#figureanchor7-2)\
    \ Designing a character in the Costumes tab\n\n3.  Move your mouse pointer over\
    \ the cat face icon at the bottom left of the screen to see the choices for adding\
    \ a costume, as shown in [Figure 7-3](#c07.xhtml#figure7-3).\n\n    ![Figure 7-3:\
    \ Adding a new costume](image_fi/500563c07/f07003.png)\n\n    [Figure 7-3:](#c07.xhtml#figureanchor7-3)\
    \ Adding a new costume\n\n    If you’d like to draw your own character, click\
    \ `Paint`. For my screenshots, I drew a simple green character by drawing a few\
    \ circles and adding hair (see [Figure 7-4](#c07.xhtml#figure7-4)).\n\n    If\
    \ you’d prefer not to draw the character yourself, you have a few other options.\
    \ If your computer has a webcam and you want to use a photo of your face, click\
    \ `Camera`. Or, to use a picture you’ve saved on the computer, click `Upload Costume`.\
    \ To pick a costume from the Scratch Library instead, click `Choose a Costume`.\n\
    \n    No matter which choice you make, you should see the character on the canvas\
    \ after this step.\n\n    ![Figure 7-4: Drawing your character](image_fi/500563c07/f07004.png)\n\
    \n    [Figure 7-4:](#c07.xhtml#figureanchor7-4) Drawing your character\n\n4. \
    \ Right-click the character costume in the costume pane and click `duplicate`,\
    \ as shown in [Figure 7-5](#c07.xhtml#figure7-5). You’ll need three copies of\
    \ it.\n\n    ![Figure 7-5: Duplicating a costume](image_fi/500563c07/f07005.png)\n\
    \n    [Figure 7-5:](#c07.xhtml#figureanchor7-5) Duplicating a costume\n\n5.  Rename\
    \ each copy of the character by clicking it in the costume pane and then typing\
    \ the new name in the `Costume` text box above the canvas, as shown in [Figure\
    \ 7-6](#c07.xhtml#figure7-6). Name them `waiting`, `feeling happy`, and `feeling\
    \ sad`.\n\n    ![Figure 7-6: Renaming your character costumes](image_fi/500563c07/f07006.png)\n\
    \n    [Figure 7-6:](#c07.xhtml#figureanchor7-6) Renaming your character costumes\n\
    \n6.  Click each character costume in the costume pane and draw an expression\
    \ that matches its name, as shown in [Figure 7-7](#c07.xhtml#figure7-7).\n"
  trans: "\n\n点击绿色旗帜图标查看你的 ML 模型工作情况。\n\n屏幕顶部的传送带将开始运行，带有你写的邮政编码的字母将开始滚动，如图 6-23 所示。\n\
    \n![图 6-23: 传送带上的测试信封](img/f06023.png)\n\n图 6-23: 传送带上的测试信封\n\n当你的 ML 模型尝试识别你写的内容时，信封会放大。\n\
    \n一旦它分类了你的图片，脚本就会将信封发送到相应的邮件袋，如图 6-24 所示。\n\n![图 6-24: 识别邮政编码的测试结果](img/f06024.png)\n\
    \n图 6-24: 识别邮政编码的测试结果\n\n## 复习并改进你的项目\n\n你已经训练了一个 ML 模型来识别信封上的手写，并在 Scratch 中创建了一个使用\
    \ OCR 自动分类字母的项目！\n\n你可以如何改进你的项目呢？\n\n尝试让别人测试你的项目。它能识别他们的手写体吗？如果模型在识别他们的手写体时有很多错误，请让他们在“训练”（Train）阶段向你的训练桶中添加一些示例。（确保你在“学习与测试”（Learn\
    \ & Test）阶段训练新的 ML 模型，这样计算机就可以从你们两个示例中学习。）\n\n用于训练计算机的示例越多样化，ML 模型识别不同手写风格的能力就越强。\n\
    \n你还可以做什么来改进你的项目？\n\n## 你学到了什么\n\n邮件分类是`光学字符识别`的一个常见用途。世界各地的大型分拣中心使用 OCR 系统在几秒内识别并分类邮件。你的项目刚刚识别了一个邮政编码，但现实世界的多行光学字符识别器可以识别几行地址。基本原理非常相似，它有助于大规模邮件分类变得高效且实用。\n\
    \n到目前为止的所有项目都使用了图像，但计算机可以被训练来识别许多不同类型的数据。在下一章中，你将训练一个 ML 模型来识别文本！\n\n![](img/chapterart.png)\n\
    \n# 7 评价计算机\n\n![Alphabet-I](img/Alphabet-I.png) 在这一章中，我们将学习如何训练计算机来识别写文本中的不同语气和情感，这种技术被称为`情感分析`。\n\
    \n想象你正在写几句话来说明你明天要去动物园。\n\n想想如果你对去那里感到超级开心和兴奋，你会写什么。你喜欢动物园，迫不及待想去。你会使用哪些词？你的兴奋情绪会影响你写句子的方式吗？\n\
    \n现在想想如果你对必须去那里园感到愤怒，你会写什么。你讨厌动物园，明天有其他更想做的事，而且你对有人迫你过去感到不耐。这种情绪会如何体现在你的写作中？你的不耐烦会让你使用与开心时完全不同的词汇吗？你会用不同的方式组织句子吗？\n\
    \n这两个段文字的基本含义相同（即你明天要去动物园），但它们的语气和情感是不同的。计算机可以被训练来识别我们在不烦时与开心时写作方式的模式。通过足够的展示不同情感和情绪的文本示例，你可以训练一个\
    \ ML 模型，根据计算机学习识别的词汇和语法模式，识别新文章中的情感或语气。\n\n用于识别文本中情感和情绪的 ML 系统可以用于理解人们对事物的感受。例如，企业通过将\
    \ ML 模型作用于数百万个博客、论坛、新闻组和社交媒体帖子，来了解人们对其产品或服务的看法——这远超他们自己能阅读的量。情感分析告诉他们这些反馈中有多少是正面的，有多少是负面的，以及最常见的投诉和批评是什么。\n\
    \n不过，情感分析不仅适用于整个互联网的海量文本。公司经常利用它来帮助分类和优先处理客户支持信和电子邮件，优先回复听起来最愤怒或最不耐烦的信和邮件。\n\n\
    同样，公司会在自己的内部讨论中使用情感分析，以评估员工的满意程度，以及是否存在需要关注的问题或担忧。\n\n在本章中，你将训练一个 ML 模型来识别两种不同类型文本表达的情感：赞美和侮辱。\n\
    \n## 构建你的项目\n\n在这个项目中，你将创建一个对你输入的消息做出反应的角色（见图 7-1）。如果你给角色一个赞美，它会看起来很开心。如果你侮辱它，它会看起来很难过。\n\
    \n![图 7-1: 识别赞美和侮辱](img/f07001.png)\n\n图 7-1: 识别赞美和侮辱\n\n### 准备你的游戏\n\n首先，从设计你的角色开始。在我的截图，我画了一个简单的脸。你可以画任何你喜欢的，只要能看出它是开心还是难过即可。你可以做一个动物、机器人、外星人或你想到的任何东西。\n\
    \n1.  访问 [`machinelearningforkids.co.uk/scratch3/`](https://machinelearningforkids.co.uk/scratch3/)\
    \ 开始一个新的 Scratch 项目。\n\n2.  点击`Costumes`（造型）标签，如图 7-2 所示。\n\n    ![图 7-2: 在造型标签页中设计角色](img/f07002.png)\n\
    \n    图 7-2: 在造型标签页中设计角色\n\n3.  将鼠标指针悬停在屏幕左下角的猫脸图标上，查看添加造型的选项，如图 7-3 所示。\n\n \
    \   ![图 7-3: 添加新造型](img/f07003.png)\n\n    图 7-3: 添加新造型\n\n    如果你想自己画角色，点击`Paint`（画）。在我的截图中，我通过画几个圆画了一个简单的绿色角色（见图\
    \ 7-4）。\n\n    如果你不想自己画角色，还有其他选项。如果你的电脑有摄像头且你想使用照片，点击`Camera`（摄像头）。或者，使用计算机上保存的图片，点击`Upload\
    \ Costume`（上传造型）。如果想从 Scratch 库中选择，点击`Choose a Costume`（选择造型）。\n\n    无论你选择哪种，在此步之后你应该能在画布上看到该角色。\n\
    \n    ![图 7-4: 绘制角色](img/f07004.png)\n\n    图 7-4: 绘制角色\n\n4.  在造型面板中右键点击角色造型并点击`duplicate`（复制），如图\
    \ 7-5 所示。你需要三个副本。\n\n    ![图 7-5: 复制造型](img/f07005.png)\n\n    图 7-5: 复制造型\n\n\
    5.  通过点击造型面板中的副本并在画布上方的`Costume`（造型）文本框中输入新名称来重命名每个副本，如图 7-6 所示。将它们命名为`waiting`、`feeling\
    \ happy`和`feeling sad`。\n\n    ![图 7-6: 重命名你的角色](img/f07006.png)\n\n    图 7-6:\
    \ 重命名你的角色\n\n6.  点击造型面板中的每个角色造型，并画出与其名称匹配的表情，如图 7-7 所示。\n\n"
