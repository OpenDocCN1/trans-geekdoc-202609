- raw: "5.  Click **Add example** in the **fan\\_off** bucket, as shown in [Figure\
    \ 10-7](#c10.xhtml#figure10-7).\n\n    This time, type as many examples as you\
    \ can think of for asking someone to turn off the fan. You need at least five\
    \ examples. These are the examples your ML model will use to learn what a “fan\
    \ off” command looks like.\n\n    Try to include some examples that don’t include\
    \ the words *fan* or *off*.\n\n    ![Figure 10-7: Collecting examples of how to\
    \ ask for the fan to be turned off](image_fi/500563c10/f10007.png)\n\n    [Figure\
    \ 10-7:](#c10.xhtml#figureanchor10-7) Collecting examples of how to ask for the\
    \ fan to be turned off\n\n6.  Repeat this process for the last two buckets, until\
    \ you have at least five examples for all four commands, as shown in [Figure 10-8](#c10.xhtml#figure10-8).\
    \ \n\n    ![Figure 10-8: Training data for the smart assistant project](image_fi/500563c10/f10008.png)\n\
    \n    [Figure 10-8:](#c10.xhtml#figureanchor10-8) Training data for the smart\
    \ assistant project\n\n7.  Click **Back to project** in the top-left corner of\
    \ the screen.\n\n8.  Click **Learn & Test**.\n\n9.  Click **Train new machine\
    \ learning model**, as shown in [Figure 10-9](#c10.xhtml#figure10-9).\n\n    The\
    \ computer will use the examples you’ve written to learn how to recognize your\
    \ four commands. This might take a minute.\n\n    ![Figure 10-9: Train an ML model\
    \ for your smart assistant.](image_fi/500563c10/f10009.png)\n\n    [Figure 10-9:](#c10.xhtml#figureanchor10-9)\
    \ Train an ML model for your smart assistant.\n\n10.  After training an ML model,\
    \ we test it to see how good it is at recognizing new commands. Type a command\
    \ into the **Test** box, as shown in [Figure 10-10](#c10.xhtml#figure10-10).\n\
    \n![Figure 10-10: Testing your ML model](image_fi/500563c10/f10010.png)\n\n[Figure\
    \ 10-10:](#c10.xhtml#figureanchor10-10) Testing your ML model\n\nIf the model\
    \ makes mistakes, you can go back to the Train phase and add more examples of\
    \ the commands that it keeps getting wrong. This is like a teacher using a student’s\
    \ poor exam result to figure out which subjects they need to review with the student\
    \ to help improve the student’s understanding.\n\nOnce you’ve added more examples,\
    \ go back to the Learn & Test phase and train a new ML model. Then test it again\
    \ to see if the computer is any better at recognizing commands.\n\n### Code Your\
    \ Project with ML\n\nNow that you have an ML model that is able to recognize your\
    \ commands, you can re-create the earlier project to use ML instead of the rules\
    \ you used before.\n\n1.  Click **Back to project** in the top-left corner of\
    \ the screen.\n\n2.  Click **Make**.\n\n3.  Click **Scratch 3**, and then click\
    \ **Open in Scratch 3** to open a new window in Scratch.\n\n    You should see\
    \ a new set of blocks for your ML project in the Toolbox, as shown in [Figure\
    \ 10-11](#c10.xhtml#figure10-11).\n\n    ![Figure 10-11: Your ML project will\
    \ be added to the Scratch Toolbox.](image_fi/500563c10/f10011.png)\n\n    [Figure\
    \ 10-11:](#c10.xhtml#figureanchor10-11) Your ML project will be added to the Scratch\
    \ Toolbox.\n\n4.  Click **Project templates** in the top menu bar and choose the\
    \ **Smart Classroom** template.\n\n5.  Copy the script shown in [Figure 10-12](#c10.xhtml#figure10-12).\n\
    \n    When you give this script commands, it will use your ML model to recognize\
    \ the command and carry out the instruction.\n\n![Figure 10-12: ML approach for\
    \ a smart assistant](image_fi/500563c10/f10012.png)\n\n[Figure 10-12:](#c10.xhtml#figureanchor10-12)\
    \ ML approach for a smart assistant\n\n### Test Your Project\n\nTest your project\
    \ by clicking the Green Flag and entering a variety of commands, phrased in lots\
    \ of different ways. See how your smart assistant performs now compared to the\
    \ version that didn’t use ML.\n\n## Review and Improve Your Project\n\nYou’ve\
    \ created your own smart assistant: a virtual version of Amazon’s Alexa or Apple’s\
    \ Siri that can understand and carry out your commands! What could you do to improve\
    \ the way that it behaves?\n\n### Using Your Model’s Confidence Score\n\nBack\
    \ in the Learn & Test phase, you should have noticed the confidence score displayed\
    \ when you tested your model. That tells you how confident the computer is that\
    \ it has recognized a command.\n\nGo back to the Learn & Test phase now and try\
    \ typing something that doesn’t fit into one of the four commands that the computer\
    \ has learned to recognize.\n\nFor example, you could try “What is the capital\
    \ city of France?” as shown in [Figure 10-13](#c10.xhtml#figure10-13).\n\n![Figure\
    \ 10-13: Testing your smart assistant](image_fi/500563c10/f10013.png)\n\n[Figure\
    \ 10-13:](#c10.xhtml#figureanchor10-13) Testing your smart assistant\n\nMy ML\
    \ model recognized it as “lamp on,” but it had 0 percent confidence in that classification.\
    \ That was the ML model’s way of telling me that it hadn’t recognized the command.\n\
    \n“What is the capital city of France?” doesn’t look like any of the examples\
    \ I’ve given the ML model. The question doesn’t match the patterns it has identified\
    \ in the examples I used to train it. This means it can’t confidently recognize\
    \ the question as one of the four commands it’s been trained to recognize.\n\n\
    Your ML model might have a higher confidence than 0, but it should still be a\
    \ relatively low number. (If not, try adding more examples to train your ML model\
    \ with.)\n\nExperiment with other questions and commands that don’t have anything\
    \ to do with a fan or lamp. Compare the confidence scores your ML model gives\
    \ with those it displays when it recognizes actual fan on, fan off, lamp on, and\
    \ lamp off commands. What kinds of confidence scores does your ML model give when\
    \ it’s correctly recognized something?\n\nOnce you have a feel for how the confidence\
    \ scores work for your ML model, you can use that in your Scratch project. Update\
    \ your script to look like [Figure 10-14](#c10.xhtml#figure10-14).\n\nNow, if\
    \ the model isn’t at least 80 percent confident that it has understood the command\
    \ correctly, it will display a “sorry” response for 2 seconds and not carry out\
    \ the action.\n\nYou’ll need to change the `80` value in this script to a percentage\
    \ that matches the behavior of your own ML model.\n\nWhat else could you do to\
    \ improve your project?\n\n ![Figure 10-14: Using confidence scores in your ML\
    \ project](image_fi/500563c10/f10014.png)\n\n[Figure 10-14:](#c10.xhtml#figureanchor10-14)\
    \ Using confidence scores in your ML project\n\n### Using Speech Input Instead\
    \ of Typing\n\nYou could modify your project to be more like real-world smart\
    \ assistants by using voice input instead of typing.\n\nIn the Toolbox, click\
    \ the Extensions Library icon (it looks like two blocks and a plus sign), add\
    \ the **Speech to Text** extension, and update your script as shown in [Figure\
    \ 10-5](#c10.xhtml#figure10-5).\n\n ![Figure 10-15: Adding speech recognition\
    \ to your smart assistant](image_fi/500563c10/f10015.png)\n\n[Figure 10-15:](#c10.xhtml#figureanchor10-15)\
    \ Adding speech recognition to your smart assistant\n\nWhat else could you do\
    \ to improve your project?\n\n### Collecting Training Data\n\nML is often used\
    \ for recognizing text because it’s quicker than having to write rules. But training\
    \ a model properly requires lots and lots of examples. To build these systems\
    \ in the real world, we’d need more efficient ways of collecting examples than\
    \ simply typing them all yourself like you’ve done so far. For example, instead\
    \ of asking one person to write 100 examples, it might be better to ask 100 people\
    \ to write one example each. Or 1,000 people. Or 10,000 people."
