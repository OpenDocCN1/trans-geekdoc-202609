- raw: "     These scripts are similar to those you created for the first newspaper\
    \ sprite in step 9.\n\n     This code will go through the examples in your second\
    \ list. For each one, it will create a sprite, and if your ML model recognizes\
    \ an example as being in the second group, the code will move it to the bottom\
    \ half of the screen. Otherwise, the code will move the example to the top half.\n\
    \n     Be careful not to use the list or variable from your first sprite. My first\
    \ script was about the tabloid headlines, and this second script is about the\
    \ broadsheet headlines.\n\n     Notice that the coordinates also have to be different\
    \ in this script so that correct matches go to the bottom half of the screen this\
    \ time.\n\n16.  Click the Green Flag again and watch your scripts run.\n\n   \
    \  As before, it’s okay if your ML model doesn’t get everything right. You can\
    \ see how my ML model did in [Figure 8-17](#c08.xhtml#figure8-17).\n\n     How\
    \ did your ML model perform?\n\n     ![Figure 8-17: Results for the second test\
    \ of the Newspapers project](image_fi/500563c08/f08017.png)\n\n     [Figure 8-17:](#c08.xhtml#figureanchor8-17)\
    \ Results for the second test of the Newspapers project\n\n## Review and Improve\
    \ Your Project\n\nYou’ve trained an ML model to recognize the use of language\
    \ in the media! You also used Scratch to make a simple test to visualize how effective\
    \ your ML model is.\n\nIf my ML model had performed perfectly, it would have moved\
    \ all of the red newspapers to the top half and moved all of the blue newspapers\
    \ to the bottom half.\n\nIt didn’t.\n\nRecognizing 100 percent of the headlines\
    \ correctly was unlikely, as I gave my model only a small amount of training.\
    \ With more training examples I would expect the results to improve, but even\
    \ then, ML systems rarely perform perfectly.\n\nBut how good was it?\n\nThere\
    \ are many ways that we can describe the performance of an ML system.\n\n### Measuring\
    \ Performance: Accuracy\n\nOne measure we use to describe how well an ML model\
    \ performs is *accuracy*, or counting the number of things that the ML model answers\
    \ correctly.\n\nCreate a new variable with **for all sprites** selected and call\
    \ it `correct`.\n\nChange your scripts for the first sprite (the one in [Figure\
    \ 8-12](#c08.xhtml#figure8-12) for newspapers that should go in the top half)\
    \ to match the scripts in [Figure 8-18](#c08.xhtml#figure8-18).\n\nNotice that\
    \ you’ll need to remove the last `if` block in the script to replace it with an\
    \ `if...else` block.\n\nNow change the scripts for the second sprite (the one\
    \ in [Figure 8-16](#c08.xhtml#figure8-16) for newspapers that should go in the\
    \ bottom half) to match the scripts in [Figure 8-19](#c08.xhtml#figure8-19).\n\
    \n ![Figure 8-18: Modify the first test script (from Figure 8-12) to count the\
    \ number of correct answers.](image_fi/500563c08/f08018.png)\n\n[Figure 8-18:](#c08.xhtml#figureanchor8-18)\
    \ Modify the first test script (from [Figure 8-12](#c08.xhtml#figure8-12)) to\
    \ count the number of correct answers.\n\nNotice that you’ll also need to replace\
    \ the last `if` block in this script with an `if...else` block.\n\n![Figure 8-19:\
    \ Modify the second test script (from Figure 8-16) to count the number of correct\
    \ answers.](image_fi/500563c08/f08019.png)\n\n[Figure 8-19:](#c08.xhtml#figureanchor8-19)\
    \ Modify the second test script (from [Figure 8-16](#c08.xhtml#figure8-16)) to\
    \ count the number of correct answers.\n\nWith these updated scripts, your Scratch\
    \ project will compute the accuracy of your ML model and display the result at\
    \ the end of the test. The formula is:\n\n```\ncorrect answers / ( (number of\
    \ tabloid headlines) + (number of broadsheet headlines) ) \n```\n\nas shown in\
    \ [Figure 8-20](#c08.xhtml#figure8-20).\n\n![Figure 8-20: Computing accuracy (Scratch\
    \ refers to the number of items in a list as the length of the list)](image_fi/500563c08/f08020.png)\n\
    \n[Figure 8-20:](#c08.xhtml#figureanchor8-20) Computing accuracy (Scratch refers\
    \ to the number of items in a list as the *length* of the list)\n\nIn other words,\
    \ the accuracy is the percentage of how many headlines the ML model classified\
    \ correctly.\n\nThe accuracy for my ML model is shown in [Figure 8-21](#c08.xhtml#figure8-21).\
    \ How does it compare to your project?\n\n![Figure 8-21: Displaying accuracy](image_fi/500563c08/f08021.png)\n\
    \n[Figure 8-21:](#c08.xhtml#figureanchor8-21) Displaying accuracy\n\n### Measuring\
    \ Performance: Confusion Matrix\n\nAccuracy is a useful measure, and possibly\
    \ the most well-known one. But it’s often not enough, so it’s normally not the\
    \ only measure used for real-world ML systems.\n\nCan you think of any problems\
    \ with accuracy?\n\nWhat if my ML model thought that everything was a headline\
    \ from a broadsheet newspaper, as in [Figure 8-22](#c08.xhtml#figure8-22)?\n\n\
    ![Figure 8-22: Classifying every headline as broadsheet](image_fi/500563c08/f08022.png)\n\
    \n[Figure 8-22:](#c08.xhtml#figureanchor8-22) Classifying every headline as broadsheet\n\
    \nThe accuracy would be 50 percent, as the model would put all 10 broadsheet newspapers\
    \ in the right place but all 10 tabloid newspapers in the wrong place.\n\nBut\
    \ “50 percent accuracy” isn’t a good description of a system that gives the same\
    \ answer to any question. We need a better way to describe our ML model’s performance,\
    \ one that avoids this sort of misleading result.\n\nA *confusion matrix*is a\
    \ tool where you count the number of things that the ML model gets correct and\
    \ the number of things that it gets wrong and then arrange those results in a\
    \ table. Let’s look at an example.\n\nCreate four more variables with **for all\
    \ sprites** selected and name them `true positive`, `true negative`, `false positive`,\
    \ and `false negative`. Make sure the checkboxes for all four variables are selected\
    \ in the Toolbox as shown in [Figure 8-23](#c08.xhtml#figure8-23).\n\n![Figure\
    \ 8-23: Preparing variables for a confusion matrix](image_fi/500563c08/f08023.png)\n\
    \n[Figure 8-23:](#c08.xhtml#figureanchor8-23) Preparing variables for a confusion\
    \ matrix\n\nArrange the variables on the Stage as shown in [Figure 8-24](#c08.xhtml#figure8-24).\n\
    \n![Figure 8-24: Creating a confusion matrix in Scratch](image_fi/500563c08/f08024.png)\n\
    \n[Figure 8-24:](#c08.xhtml#figureanchor8-24) Creating a confusion matrix in Scratch\n\
    \nChange your scripts for the first sprite (the one in [Figure 8-18](#c08.xhtml#figure8-18)\
    \ for newspapers that should go in the top half) to match the scripts in [Figure\
    \ 8-25](#c08.xhtml#figure8-25).\n\nIt’s a bit long, but take your time and compare\
    \ it carefully to make sure you copy it correctly. As before, I’ve added comments\
    \ to highlight the changes.\n\nWe’re increasing the counters for **true positive**\
    \ and **false negative**, and changing the **x** values for the glide blocks so\
    \ that tabloid newspapers stay on the left side of the screen.\n\n![Figure 8-25:\
    \ Modify the first script (from Figure 8-18) to calculate the confusion matrix\
    \ values.](image_fi/500563c08/f08025.png)\n\n[Figure 8-25:](#c08.xhtml#figureanchor8-25)\
    \ Modify the first script (from [Figure 8-18](#c08.xhtml#figure8-18)) to calculate\
    \ the confusion matrix values.\n\nChange your scripts for the second sprite (the\
    \ one in [Figure 8-19](#c08.xhtml#figure8-19) for newspapers that should go in\
    \ the bottom half) to match the scripts in [Figure 8-26](#c08.xhtml#figure8-26).\n\
    \nWe’re increasing the counters for **true negative** and **false positive**,\
    \ and changing the **x** values for the glide blocks so that broadsheet newspapers\
    \ stay on the right side of the screen.\n\n ![Figure 8-26: Modify the second script\
    \ (from Figure 8-19) to calculate the confusion matrix values.](image_fi/500563c08/f08026.png)\n\
    \n[Figure 8-26:](#c08.xhtml#figureanchor8-26) Modify the second script (from [Figure\
    \ 8-19](#c08.xhtml#figure8-19)) to calculate the confusion matrix values.\n\n\
    Click the Green Flag to test your ML model again. My results are shown in [Figure\
    \ 8-27](#c08.xhtml#figure8-27).\n\n![Figure 8-27: Displaying a confusion matrix\
    \ in Scratch](image_fi/500563c08/f08027.png)\n\n[Figure 8-27:](#c08.xhtml#figureanchor8-27)\
    \ Displaying a confusion matrix in Scratch"
