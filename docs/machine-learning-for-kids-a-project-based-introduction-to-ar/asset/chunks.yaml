- raw: "ML image recognition techniques are also regularly used in businesses. For\
    \ example, drones can take high-resolution photos while flying over buildings,\
    \ roofs, bridges, solar panels, pipes, and much more. These photos are then chopped\
    \ into tiles and tested by an ML model trained to recognize signs of damage or\
    \ poor maintenance and repair. Automated image recognition systems based on the\
    \ same principles as this chapter’s project are used in a variety of fields, such\
    \ as civil engineering (for inspecting bridges and buildings), agriculture (for\
    \ recognizing healthy or diseased plants and crops), or even public safety (such\
    \ as in Australia, where ML is used in lifesaver drones that can recognize sharks\
    \ from the air).\n\n## What You Learned\n\nIn this chapter, you trained an ML\
    \ model to recognize objects that are part of a larger scene. This is the most\
    \ complicated project you’ve done so far, but hopefully you now have a good understanding\
    \ of how complex image recognition systems are built. You learned some of the\
    \ challenges of training such systems, like knowing how to break up the complex\
    \ task into simpler tasks (such as by choosing the correct tile size), and you\
    \ got some tips for solving them. You also saw some real-world applications for\
    \ these kinds of complex ML systems and examples of the fields where they’re used.\n\
    \nIn the next chapter, we’ll look at another common use of ML: smart assistants.\n\
    \n![](image_fi/book_art/chapterart.png)\n\n# 10  \n\nSmart Assistants\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)n\
    \ this chapter, we’ll look at a common household use of ML: smart assistants like\
    \ Siri, Alexa, or Google Home that can do simple jobs for you when you ask, like\
    \ set an alarm, start a timer, or play some music.\n\nSmart assistants are ML\
    \ systems trained to recognize the meaning of text. You’ve seen that you can train\
    \ a computer so that when you give it some writing, the computer can recognize\
    \ what you’re trying to say. And if a computer can understand what you mean, it\
    \ can understand what you’re asking it to do.\n\nTo create a program that categorizes\
    \ text based on recognizing the text’s intention (*intent classification*), we\
    \ collect a large number of examples of each type of command that we want it to\
    \ recognize and then use ML to train a model.\n\nFrom the projects you’ve done\
    \ so far, you’re already familiar with the *classification* part of intent classification.\
    \ For example, messages can be classified as compliments or insults, and news­paper\
    \ headlines can be classified as tabloids or broadsheets. The computer knows about\
    \ some categories of writing, and when you give it some text, it tries to *classify*\
    \ that text, or work out which category that text should go into. The *intent*\
    \ part is because we’re using the ability to classify the text to recognize its\
    \ intention.\n\nIntent classification is useful for building computer systems\
    \ that we can interact with in a natural way. For example, a computer could recognize\
    \ that when you say, “Turn on the light,” the intention is for a light to be switched\
    \ on. This is described as a *natural language interface*. In other words, instead\
    \ of needing to press a switch to turn the light on, you’re using *natural language*—a\
    \ language that has evolved naturally in humans, not one designed for computers—to\
    \ communicate that intent.\n\nThe computer learns from the patterns in the examples\
    \ we give it—patterns in the words we choose, the way we phrase commands, how\
    \ we combine words for certain types of commands, and when we use commands that\
    \ are short versus longer, just to name a few.\n\nIn this chapter, you’ll make\
    \ a virtual smart assistant that can recognize your commands and carry out your\
    \ instructions (see [Figure 10-1](#c10.xhtml#figure10-1)).\n\n ![Figure 10-1:\
    \ Making a smart assistant in Scratch](image_fi/500563c10/f10001.png)\n\n[Figure\
    \ 10-1:](#c10.xhtml#figureanchor10-1) Making a smart assistant in Scratch\n\n\
    Let’s get started!\n\n## Build Your Project\n\nTo start with, you’ll train the\
    \ ML model to recognize commands to turn two devices—a fan and a lamp—on or off.\n\
    \n### Code Your Project Without ML\n\nAs we saw in Chapter 7, it’s useful to see\
    \ the difference that ML makes by trying to code an AI project without it first.\
    \ You can skip this step if you feel you have a good grasp of the difference between\
    \ a rule-based approach and ML and would rather go straight to using ML.\n\n1.\
    \  Go to Scratch at [https://machinelearningforkids.co.uk/scratch3/](https://machinelearningforkids.co.uk/scratch3/).\n\
    \n2.  Click **Project templates** at the top of the screen, as shown in [Figure\
    \ 10-2](#c10.xhtml#figure10-2). \n\n    ![Figure 10-2: Project templates include\
    \ starter projects to save you time.](image_fi/500563c10/f10002.png)\n\n    [Figure\
    \ 10-2:](#c10.xhtml#figureanchor10-2) Project templates include starter projects\
    \ to save you time.\n\n3.  Click the **Smart Classroom** template.\n\n4.  Copy\
    \ the script shown in [Figure 10-3](#c10.xhtml#figure10-3).\n\n    ![Figure 10-3:\
    \ Coding a smart assistant using rules](image_fi/500563c10/f10003.png)\n\n   \
    \ [Figure 10-3:](#c10.xhtml#figureanchor10-3) Coding a smart assistant using rules\n\
    \n    This script asks you to enter a command. If you type `Turn``on` (or `off`)\
    \ `the``fan` (or `lamp`), Scratch will play the corresponding animation. Let’s\
    \ try it out.\n\n5.  Test your project by clicking the Green Flag. Type the command\
    \ `Turn on the fan` and check that the fan really does start spinning.\n\n   \
    \ What happens if you spell something wrong? What happens if you change the wording\
    \ (for example, “Turn on the fan please”)? What happens if you don’t mention the\
    \ word *fan* (for example, “I’m very hot, we need some air in here!”)?\n\n   \
    \ Why don’t these work?\n\n    Do you think it’s possible to write a script that\
    \ would work with any phrasing of these four commands?\n\nThink back to the definition\
    \ in Chapter 1, where I said ML is not the only way to create AI systems. Here\
    \ you’ve created an AI project using a rules-based approach instead of ML. By\
    \ trying other techniques like this one and seeing where they fall short, you\
    \ can better understand why ML is preferred for so many projects.\n\n### Train\
    \ Your Model\n\n1.  Create a new ML project, name it `Smart Classroom`, and set\
    \ it to learn to recognize text in your preferred language. \n\n2.  Click **Train**,\
    \ as shown in [Figure 10-4](#c10.xhtml#figure10-4).\n\n    ![Figure 10-4: The\
    \ first phase is to collect training examples.](image_fi/500563c10/f10004.png)\n\
    \n    [Figure 10-4:](#c10.xhtml#figureanchor10-4) The first phase is to collect\
    \ training examples.\n\n3.  Click **Add new label**, as shown in [Figure 10-5](#c10.xhtml#figure10-5),\
    \ and create a training bucket called `fan on`. Repeat this step to create three\
    \ more training buckets named `fan off`, `lamp on`, and `lamp off`. (The underscores\
    \ will be added automatically.)\n\n    ![Figure 10-5: Create training buckets\
    \ for the commands to recognize.](image_fi/500563c10/f10005.png)\n\n    [Figure\
    \ 10-5:](#c10.xhtml#figureanchor10-5) Create training buckets for the commands\
    \ to recognize.\n\n4.  Click **Add example** in the **fan\\_on** bucket and type\
    \ an example of how you would ask someone to turn on the fan, as shown in [Figure\
    \ 10-6](#c10.xhtml#figure10-6).\n\n    ![Figure 10-6: Collecting examples of how\
    \ to ask for the fan to be turned on](image_fi/500563c10/f10006.png)\n\n    [Figure\
    \ 10-6:](#c10.xhtml#figureanchor10-6) Collecting examples of how to ask for the\
    \ fan to be turned on\n\n    It can be short (for example, “fan on please”) or\
    \ long (“Could you turn the fan on for me now, please?”).\n\n    It can be polite\
    \ (“Would you please switch on the fan?”) or less polite (“Turn the fan on now”).\n\
    \n    It can include the words *fan* and *on* (“Can you turn on the fan?”) or\
    \ neither (“It’s too hot in here. Can we get some air in here, please?”).\n\n\
    \    Type as many as you can think of, as shown in [Figure 10-6](#c10.xhtml#figure10-6).\
    \ You need at least five examples, but I’ve given you six already, so that should\
    \ be easy!"
  fmt: "\nML image recognition techniques are also regularly used in businesses. For\
    \ example, drones can take high-resolution photos while flying over buildings,\
    \ roofs, bridges, solar panels, pipes, and much more. These photos are then chopped\
    \ into tiles and tested by an ML model trained to recognize signs of damage or\
    \ poor maintenance and repair. Automated image recognition systems based on the\
    \ same principles as this chapter’s project are used in a variety of fields, such\
    \ as civil engineering (for inspecting bridges and buildings), agriculture (for\
    \ recognizing healthy or diseased plants and crops), or even public safety (such\
    \ as in Australia, where ML is used in lifesaver drones that can recognize sharks\
    \ from the air).\n\n## What You Learned\n\nIn this chapter, you trained an ML\
    \ model to recognize objects that are part of a larger scene. This is the most\
    \ complicated project you’ve done so far, but hopefully you now have a good understanding\
    \ of how complex image recognition systems are built. You learned some of the\
    \ challenges of training such systems, like knowing how to break up the complex\
    \ task into simpler tasks (such as by choosing the correct tile size), and you\
    \ got some tips for solving them. You also saw some real-world applications for\
    \ these kinds of complex ML systems and examples of the fields where they’re used.\n\
    \nIn the next chapter, we’ll look at another common use of ML: smart assistants.\n\
    \n![](image_fi/book_art/chapterart.png)\n\n# 10 Smart Assistants\n\n![Alphabet-I](image_fi/book_art/Alphabet-I.png)\
    \ In this chapter, we’ll look at a common household use of ML: smart assistants\
    \ like Siri, Alexa, or Google Home that can do simple jobs for you when you ask,\
    \ like set an alarm, start a timer, or play some music.\n\nSmart assistants are\
    \ ML systems trained to recognize the meaning of text. You’ve seen that you can\
    \ train a computer so that when you give it some writing, the computer can recognize\
    \ what you’re trying to say. And if a computer can understand what you mean, it\
    \ can understand what you’re asking it to do.\n\nTo create a program that categorizes\
    \ text based on recognizing the text’s intention (`intent classification`), we\
    \ collect a large number of examples of each type of command that we want it to\
    \ recognize and then use ML to train a model.\n\nFrom the projects you’ve done\
    \ so far, you’re already familiar with the `classification` part of intent classification.\
    \ For example, messages can be classified as compliments or insults, and newspaper\
    \ headlines can be classified as tabloids or broadsheets. The computer knows about\
    \ some categories of writing, and when you give it some text, it tries to `classify`\
    \ that text, or work out which category that text should go into. The `intent`\
    \ part is because we’re using the ability to classify the text to recognize its\
    \ intention.\n\nIntent classification is useful for building computer systems\
    \ that we can interact with in a natural way. For example, a computer could recognize\
    \ that when you say, “Turn on the light,” the intention is for a light to be switched\
    \ on. This is described as a `natural language interface`. In other words, instead\
    \ of needing to press a switch to turn the light on, you’re using `natural language`—a\
    \ language that has evolved naturally in humans, not one designed for computers—to\
    \ communicate that intent.\n\nThe computer learns from the patterns in the examples\
    \ we give it—patterns in the words we choose, the way we phrase commands, how\
    \ we combine words for certain commands, and when we use commands that are short\
    \ versus longer, to name a few. In this chapter, you’ll make a virtual smart assistant\
    \ that can recognize your commands and carry out your instructions (see [Figure\
    \ 10-1](#c10.xhtml#figure10-1)).\n\n![Figure 10-1: Making a smart assistant](image_fi/500563c10/f10001.png)\n\
    [Figure 10-1](#c10.xhtml#figure10-1) Making a smart assistant in Scratch\n\n##\
    \ Build Your Project\n\nTo start with, you’ll train the ML model to recognize\
    \ commands to turn two devices—a fan and a lamp—on or off.\n\n### Code Your Project\
    \ Without ML\n\nAs we saw in Chapter 7, it’s useful to see the difference that\
    \ ML makes by trying to code an AI project without it. You can skip this step\
    \ if you have a good grasp of the difference between rule-based approach and ML\
    \ and would rather go straight to ML.\n\n1. Go to Scratch at `https://machinelearningforkids.co.uk/scratch3/`.\n\
    2. Click **Project templates** at the top of the screen, as shown in [Figure 10-2](#c10.xhtml#figure10-2).\n\
    \   ![Figure 10-2: Project templates include starter projects to save you time.](image_fi/500563c10/f10002.png)\n\
    \   [Figure 10-2](#c10.xhtml#figure10-2) Project templates include starter projects\
    \ to save you time.\n3. Click the **Smart Classroom** template.\n4. Copy the script\
    \ shown in [Figure 10-3](#c10.xhtml#figure10-3).\n   ![Figure 10-3: Coding a smart\
    \ assistant using rules](image_fi/500563c10/f10003.png)\n   [Figure 10-3](#c10.xhtml#figure10-3)\
    \ Coding a smart assistant using rules\n\nThis script asks you to enter a command.\
    \ If you type `on` (or `off`) `the fan` (or `lamp`), Scratch will play the corresponding\
    \ animation. Let’s try it out.\n5. Test your project by clicking the **Green Flag**.\
    \ Type the command `Turn on the fan` and check that the fan really does start.\n\
    \   What happens if you spell something wrong? What happens if you change the\
    \ wording (for example, “Turn on the fan please”)? What happens if you don’t mention\
    \ the word `fan` (for example, “I’m very hot, we need some air in here!”)?\n \
    \  Why don’t these work?\n   Do you think it’s possible to write a script that\
    \ would work with any phrasing of these commands?\n\nThink back to the definition\
    \ in Chapter 1, where I said ML is not the only way to create AI systems. Here\
    \ you’ve created an AI project using a rules-based approach instead of ML. By\
    \ trying other techniques like this one and seeing where they fall short, you\
    \ can better understand why ML is preferred for many projects.\n\n### Train Your\
    \ Model\n\n1. Create a new ML project, name it `Smart Classroom`, and set it to\
    \ learn to recognize text in your preferred language.\n2. Click **Train**, as\
    \ shown in [Figure 10-4](#c10.xhtml#figure10-4).\n   ![Figure 10-4: The first\
    \ phase is to collect training examples.](image_fi/500563c10/f10004.png)\n   [Figure\
    \ 10-4](#c10.xhtml#figure10-4) The first phase is to collect training examples.\n\
    3. Click **Add new label**, as shown in [Figure 10-5](#c10.xhtml#figure10-5),\
    \ and create a training bucket called `fan on`. Repeat this step to create three\
    \ more training buckets named `fan off`, `lamp on`, and `lamp off`. (The underscores\
    \ will be added automatically.)\n   ![Figure 10-5: Create training buckets for\
    \ the commands to recognize.](image_fi/500563c10/f10005.png)\n   [Figure 10-5](#c10.xhtml#figure10-5)\
    \ Create training buckets for the commands to recognize.\n4. Click **Add example**\
    \ in the `fan_on` bucket and type an example of how you would ask someone to turn\
    \ on the fan, as shown in [Figure 10-6](#c10.xhtml#figure10-6).\n   ![Figure 10-6:\
    \ Collecting examples of how to ask for the fan to be turned on](image_fi/500563c10/f10006.png)\n\
    \   [Figure 10-6](#c10.xhtml#figure10-6) Collecting examples of how to ask for\
    \ the fan to be turned on.\n   It can be short (for example, “fan on please”)\
    \ or long (“Could you turn the fan on for me now, please?”).\n   It can be polite\
    \ (“Would you please switch on the fan?”) or less polite (“Turn the fan on now”).\n\
    \   It can include the words `fan` and `on` (“Can you turn on the fan?”) or neither\
    \ (“It’s too hot in here. Can we get some air in here, please?”).\n\n   Type as\
    \ many as you can think of, as shown in [Figure 10-6](#c10.xhtml#figure10-6).\
    \ You need at least five examples, but I’ve given you six already, so that should\
    \ be easy!\n"
  trans: "\nML 图像识别技术也经常用于商业领域。例如，无人机可以在飞越建筑、屋顶、桥梁、太阳能电池板、管道等时拍摄高分辨率照片。这些照片随后会被切割成小块，并由训练过的\
    \ ML 模型进行测试，该模型用于识别损坏、维护不当或需要维修的迹象。与本章项目原理相同的自动化图像识别系统用于许多领域，例如土木工程（检查桥梁和建筑）、农业（识别健康或生病的植物和作物），甚至是公共安全（例如在澳大利亚，ML\
    \ 被用于救生无人机，这些机器可以从空中识别鲨鱼）。\n\n## 你学到了什么\n\n在本章中，你训练了一个 ML 模型来识别作为大场景一部分的对象。这是你目前为止做的最复杂的项目，但希望你现在已经很好地了复杂的图像识别系统是如何构建的。你学习了训练此类系统面临的一些挑战，例如如何将复杂任务分解为更简单的任务（如选择正确的瓦片大小），并获得了一些解决这些问题的提示。你还看到了这类复杂\
    \ ML 系统的真实应用以及它们被使用的领域示例。\n\n在下一章中，我们将介绍 ML 的另一个常见用途：智能助手。\n\n![](img/chapterart.png)\n\
    \n# 10 智能助手\n\n![Alphabet-I](img/Alphabet-I.png) 在这一章中，我们将介绍 ML 的一种家居用途：像 Siri、Alexa\
    \ 或 Google Home 这样的智能助手，当你要求时它们可以为你完成简单的工作，如设置闹钟、启动计时器或播放音乐。\n\n智能助手是训练用于识别文本含义的\
    \ ML 系统。你已经看到，你可以训练计算机，使得当你给它一些文字内容时，计算机可以识别出你想表达什么。如果计算机能理解你的意思，它就能理解你要求它做什么。\n\
    \n为了创建一个根据识别文本意图（意图分类，`intent classification`）对文本进行分类的程序，我们收集想要它识别的每种命令的大量示例，然后使用\
    \ ML 来训练模型。\n\n从你目前为止完成的项目来看，你已经熟悉意图分类中的“分类”（`classification`）部分。例如，消息可以被归类为赞美或侮辱，报纸标题可以被归类为通俗杂志或大报纸。计算机了解某些写作类别，当你给它一些文本时，它会尝试\
    \ `classify`（分类）该文本，或者确定该文本属于哪个类别。“意图”（`intent`）部分是因为我们正在利用分类文本的能力来识别它的意图。\n\n\
    意图分类对于构建我们可以以自然方式交互的计算机系统非常有用。例如，计算机可以识别出当你说“开灯”时，意图是打开灯。这被描述为自然语言界面（`natural\
    \ language interface`）。换句话说，你不需要按下开关来开灯，而是使用自然语言（`natural language`）——一种在人类中自然演化的语言，而不是为计算机设计的语言——来表达这一意图。\n\
    \n计算机从我们提供的示例模式中学习——例如我们选择词汇的模式、表述命令的方式、为特定命令组合单词的方式，以及何时使用短命令与何时使用长命令等。在本章中，你将创建一个虚拟智能助手，它可以识别你的命令并执行你的指令（参见图\
    \ 10-1）。\n\n![Figure 10-1: 制作智能助手](img/f10001.png)\n图 10-1 在 Scratch 中制作智能助手\n\
    \n## 制作你的项目\n\n首先，你将训练 ML 模型来识别开启或关闭两个设备（风扇和灯）的命令。\n\n### 不使用 ML 编写你的项目\n\n正如我们在第\
    \ 7 章中看到的，通过尝试在不使用 ML 的情况下编写 AI 项目，观察 ML 带来的差异是有用的。如果你已经很好掌握了基于规则的方法与 ML 之间的区别，并且愿意直接学习\
    \ ML，可以跳过这一步。\n\n1. 访问 `https://machinelearningforkids.co.uk/scratch3/` 上的 Scratch。\n\
    2. 点击屏幕顶部的 **Project templates**（项目模板），如图 10-2 所示。\n   ![Figure 10-2: 项目模板包含启动项目，以帮助你节省时间。](img/f10002.png)\n\
    \   图 10-2 项目模板包含启动项目，以帮助你节省时间。\n3. 点击 **Smart Classroom** 模板。\n4. 复制图 10-3 所示的脚本。\n\
    \   ![Figure 10-3: 使用规则编写智能助手](img/f10003.png)\n   图 10-3 使用规则编写智能助手\n\n此脚本要求你输入一个命令。如果你输入\
    \ `on`（或 `off`）`the fan`（或 `lamp`，即风扇或灯），Scratch 将播放相应的动画。让我们试一试。\n5. 点击 **Green\
    \ Flag**（绿色旗帜）测试你的项目。输入命令 `Turn on the fan` 并检查风扇是否真的开始运行了。\n   如果你拼写错了某个单词会发生什么？如果你改变了措辞（例如，“Turn\
    \ on the fan please”）会发生什么？如果你没有提到 `fan` 这个词（例如，“I’m very hot, we need some air\
    \ in here!”）会发生什么？\n   为什么这些不起作用？\n   你认为可能写出一个适用于这些命令的任何措辞的脚本吗？\n\n回想一下第 1 章中的定义，在那里我说过\
    \ ML 不是创建 AI 系统的唯一方法。在这里，你使用基于规则的方法而不是 ML 创建了一个 AI 项目。通过尝试其他此类技术并观察它们的局限性，你可以更好地理解为什么许多项目更倾向于使用\
    \ ML。\n\n### 训练你的模型\n\n1. 创建一个新的 ML 项目，命名为 `Smart Classroom`，并将其设置为学习识别你偏好语言的文本。\n\
    2. 点击 **Train**（训练），如图 10-4 所示。\n   ![Figure 10-4: 第一阶段是收集训练示例。](img/f10004.png)\n\
    \   图 10-4 第一阶段是收集训练示例。\n3. 点击 **Add label**（添加标签），如图 10-5 所示，并创建一个名为 `fan on`\
    \ 的训练桶。重复此步骤创建三个训练桶 `fan off`、`lamp on` 和 `lamp off`。（会自动添加下划线）。\n   ![Figure\
    \ 10-5: 用于识别命令的训练桶](img/f10005.png)\n   图 10-5 用于识别命令的训练桶。\n4. 在 `fan_on` 桶中点击\
    \ **Add example**（添加示例），并输入你如何要求他人开启风扇的示例，如图 10-6 所示。\n   ![Figure 10-6: 收集开启风扇的示例](img/f10006.png)\n\
    \   图 10-6 收集开启风扇的示例。\n   示例可以是短的（例如，“fan on please”）也可以是长的（“Could you turn the\
    \ fan on for me now, please?”）。\n   示例可以是礼貌的（“Would you please switch on the fan?”）也可以是不礼貌的（“Turn\
    \ the fan on now”）。\n   示例可以包含 `fan` 和 `on`（“Can you turn on the fan?”）也可以包含（“It’s\
    \ too hot in here. Can we get some air in here, please?”）。\n\n   尽可能多地输入你想到的示例，如图\
    \ 10-6 所示。你需要至少五个示例，但我已经给了你六个，所以这应该很简单！\n"
