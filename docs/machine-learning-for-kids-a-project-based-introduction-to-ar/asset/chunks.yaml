    Try opening your `training` version of the Scratch project and add more training
    examples by playing the game for a little longer. Then, go back to the Learn &
    Test phase and train a new ML model using your extra training examples. Finally,
    open your `testing` version of the Scratch project and watch the new ML model
    play the game.


    Did the extra training help?


    Try doing this a few times to see how the amount of training affects how well
    your ML model plays.


    The type of ML model you’ve trained in this project is called a `decision tree
    classifier`, because the way the model makes decisions about its next moves can
    be drawn as a sort of tree, as shown in [Figure 12-25](#c12.xhtml#figure12-25).
    To see a diagram of your ML model, in the Learn & Test phase, click `Describe
    your model!` next to the Test button.


    ![Figure 12-25: A decision tree](image_fi/500563c12/f12025.png)


    [Figure 12-25:](#c12.xhtml#figureanchor12-25) A decision tree


    The decision tree diagram can help you understand how your ML model is making
    `predictions` about the outcome of each move.


    Each box on the tree describes a test; for example, `monster x < 3` means “is
    the x-coordinate of the monster less than 3?” If the test is true, the tree follows
    the left-hand arrow. If the test is not true, the tree follows the right-hand
    arrow.


    The ML model starts at the top of the tree and follows the arrows identified by
    the tests until it reaches the bottom of the tree.


    To see an example of the decision process, enter some coordinates for `nano` and
    the monster into the boxes to the right of your decision tree, and click `Test`.
    The diagram will highlight the way your ML model made a prediction for those coordinates.
    When there are no more arrows to follow and it reaches the bottom of the tree,
    you’ll find the final prediction, as shown in [Figure 12-26](#c12.xhtml#figure12-26).


    ![Figure 12-26: Highlighting the coordinates used to make a prediction about the
    outcome of a move](image_fi/500563c12/f12026.png)


    [Figure 12-26:](#c12.xhtml#figureanchor12-26) Highlighting the coordinates used
    to make a prediction about the outcome of a move


    Test your model with a few different sets of coordinates to understand how it
    has learned to make predictions.


    ## What You Learned


    In this chapter, you learned that ML models can be trained to recognize patterns
    in sets of numbers. You used a `decision tree classifier` to train a model to
    play a simplified version of the game `Pac-Man`, using sets of `x` and `y`-coordinates
    to make decisions about its next moves based on their predicted outcome.


    A decision tree is not the only way to train an ML model to make predictions based
    on numbers, but it’s a popular choice because it’s very quick to train and one
    of the easiest techniques to understand. In previous chapters, you’ve been using
    neural networks, which can be more powerful but are more complicated and harder
    to understand.


    You’ve seen that, as with other ML models you’ve trained before, the model’s performance
    improves as you collect more training examples. In the next chapter, you’ll learn
    more about the difference the amount of training data makes on ML projects.


    ![](image_fi/book_art/chapterart.png)


    # 13 Tic Tac Toe


    ![Alphabet-I](image_fi/book_art/Alphabet-I.png)in the last chapter, you saw how
    computer games like `Pac-Man` have been used in ML development. Tic Tac Toe (also
    known as Noughts and Crosses, or Xs and Os) has been used to help people learn
    about ML for even longer.


    For example, Donald Michie, a British AI researcher, designed `MENACE`, the `Machine
    Educable Noughts and Crosses Engine`, in 1960 (see [Figure 13-1](#c13.xhtml#figure13-1)).
    It was one of the first programs that was able to learn how to play Tic Tac Toe
    perfectly. MENACE was demonstrated using matchboxes and colored glass beads, and
    it is a good reminder that many of the principles behind ML have been developed
    over many decades.


    ![Figure 13-1: A re-creation of Donald Michie’s Machine Educable Noughts and Crosses
    Engine, or MENACE (source: Matthew Scroggs, https://commons.wikimedia.org/wiki/File:Mscroggs-MENACE-cropped.jpg)](image_fi/500563c13/f13001.png)


    [Figure 13-1:](#c13.xhtml#figureanchor13-1) A re-creation of Donald Michie’s Machine
    Educable Noughts and Crosses Engine, or MENACE (source: Matthew Scroggs, [https://commons.wikimedia.org/wiki/File:Mscroggs-MENACE-cropped.jpg](https://commons.wikimedia.org/wiki/File:Mscroggs-MENACE-cropped.jpg))
    Tic Tac Toe is not the only game that has been used to drive AI development, however.
    Chess is another good example. In Chapter 1, I mentioned `Deep Blue`, the IBM
    computer that beat the chess grandmaster Garry Kasparov. This followed decades
    of work to build computers that could play chess. As early as the 1950s, mathematician
    Alan Turing wrote a paper called “Digital Computers Applied to Games” in which
    he asked, “Could one make a machine to play chess, and to improve its play, game
    by game, profiting from its experience?”


    In more recent years, the AI community has turned its attention to more complex
    games, like the board game `Go`. Because of the huge number of potential moves
    and strategies in `Go`, it’s impossible to rely on the “brute-force” approach
    of computers like `Deep Blue` (which examine all possible future moves and positions).
    Google DeepMind’s computer `AlphaGo` achieved a milestone in AI research in 2016,
    when it defeated `Go` world champion Lee Sedol.


    The tools for creating neural networks are getting easier to use, and our computers
    are becoming faster and more powerful, moving beyond the realms of AI students
    and researchers. If you do a web search for “Super Mario neural network,” you’ll
    find dozens of examples and tutorials of training ML models to play games like
    `Super Mario World`.


    In this chapter, though, we’ll stick to the basics. We’ll be building a simplified
    version of Donald Michie’s `MENACE` design in Scratch and training an ML model
    to play Tic Tac Toe.


    ## Build Your Project


    You probably know how to play Tic Tac Toe, but let’s quickly try it out in Scratch
    so we can plan how to introduce ML into.


    Go to [https://machinelearningforkids.co.uk/scratch3/](https://machinelearningforkids.co.uk/scratch3/)
    and click `Project templates` in the top menu, as shown in [Figure 13-3](#c13.xhtml#figure13-3).


    In the list of templates, click `Noughts and Crosses`. The template loads a simple
    Tic Tac Toe game in Scratch. Click the `Green Flag` to give it a try.


    You’re placing crosses (X) and the computer is placing nought (O). The computer
    strategy isn’t very clever, but you’ll be making it more intelligent in this chapter.


    ![Figure 13-3: Access the project templates from the top menu.](image_fi/500563c13/f13003.png)


    [Figure 13-3:](#c13.xhtml#figureanchor13-3) Access the project templates from
    the top menu.


    Try to figure out the rules that the computer is following. The logic for where
    the computer moves next is all in the Code Area, so you can review the scripts
    there to see if you’re right.


    There are many ways to represent the game board, but to start with we’ll use a
    very simple approach: numbering each of the cells on the board from 1 to 9, as
    shown in [Figure 13-4](#c13.xhtml#figure13-4).


    ![Figure 13-4: One approach to representing the game board is to number the cells.](image_fi/500563c13/f13004.png)


    [Figure 13-4:](#c13.xhtml#figureanchor13-4) One approach to representing the game
    board is to number the cells.


    The cells are also represented with numbers in the Scratch project template, as
    you can see in [Figure 13-5](#c13.xhtml#figure13-5).


    ![Figure 13-5: Game board representation defined in the Scratch project template](image_fi/500563c13/f13005.png)

