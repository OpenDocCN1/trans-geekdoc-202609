    incorporated into Big Blue’s cloud services (Kouzinouopoulos, 2018). App developers
    using GE’s Predix PaaS platform can use Ericsson’s Blockchain Data Integrity service
    to get completely auditable, compliant, and reliable data.


    # Use Case: Smart Healthcare


    In smart healthcare analyzing and storing this data in a safe manner is a major
    challenge. Hospitals, patients, physicians, and medical supply stores should all
    have secure access to this information. The secure transmission of these data
    is crucial because it impacts important decisions such as the preparation of future
    hospital facilities, recommending physicians, and assessing symptoms of various
    diseases or health problems (Bertino et al., 2015). Traditional access control
    policies are insufficiently secure to allow highly confidential patient information
    to be exchanged from one party to another. Furthermore, most people do not tell
    their physicians about their medical background. Patient history is required in
    the event of a medical emergency, but they are not accessible due to poor record
    management. While smart healthcare has the potential to solve many of the industry’s
    major problems, there are some obstacles to overcome. These problems can be solved
    with the help of blockchain technology. Indeed, the distributed ledger between
    different users such as patients, physicians, medical shops, and insurance providers
    can transform smart healthcare. Despite ongoing academic studies (Saha et al.,
    2019; Ellouze et al., 2020; Narikimilli et al., 2020; Noshina et al., 2020; Tandon
    et al., 2020) and a high level of interest from the industry, BCT-based healthcare
    data management systems have yet to be implemented.'
