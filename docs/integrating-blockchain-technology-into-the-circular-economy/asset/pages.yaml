    advances to reach consensus among experts who often most of them have limited
    time. There were three Delphi iterations in total. The degree of consensus is
    typically defined before the analysis and is determined by the study’s goals and
    implications for practice (Hasson et al., 2000; Keeney et al., 2006). In this
    study, we set a threshold level of 70% consensus.


    # e-Delphi round 2


    The Round 1 responses were emailed to the panelists in the second Delphi iteration
    so that they could revisit their responses and adjust or strengthen their Round
    1 responses (Zheng et al., 2018). In the second round, each email address received
    the list of responses from round one. On a scale of one to nine, each panelist
    was asked to rate the item’s significance. On a 9-point scale, scores 1-3 suggest
    that panelists believe the item is not significant, 4-6 indicate equivocality
    and 7-9 indicate that the item is significant. If all ratings fall under one of
    these ranges, there is absolute consensus; if ranks fall within each of the scale
    categories, there is a broad concept of agreement. Points for which 70% of panelists
    did not score within the scale of 7-9 were omitted after analysis. The panelists
    were then given the results for round three.'
