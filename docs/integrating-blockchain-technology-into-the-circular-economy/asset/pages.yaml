  md: '# # Advances in Industrial Ecology (AIE) Book Series


    Editor-in-Chief: Syed Abdul Rehman Khan, Xuzhou University of Technology, China


    # ## MISSION


    The Advances in Industrial Ecology (AIE) Book Series examines current, state-of-the-art
    studies in the areas of Industrial ecology and Circular economy. Industrial ecology
    is a rapidly growing field that systematically examines local, regional, and global
    materials along with energy uses and flows in products, processes, industrial
    sectors and economies. It focuses on the potential role of industry in reducing
    environmental burdens throughout the product life cycle from the extraction of
    raw materials, to the production of goods, to the use of those goods and to the
    management of the resulting wastes. Industrial ecology is ecological in that it
    (1) places human activity -- industry in the very broadest sense -- in the larger
    context of the biophysical environment from which we obtain resources and into
    which we place our wastes, and (2) looks to the natural world for models of highly
    efficient use of resources, energy, and byproducts. By selectively applying these
    models, the environmental performance of industry can be improved. Industrial
    ecology sees corporate entities as key players in the protection of the environment,
    particularly where technological innovation is an avenue for environmental improvement.
    As repositories of technological expertise in our society, corporations provide
    crucial leverage in attacking environmental problems through product and process
    design.


    The Advances in Industrial Ecology (AIE) Book Series encompasses empirical, analytical,
    theoretical, reviews, communications, and conceptual research, and comprehensive
    reviews of relevant research case studies of effective applications in the areas
    of Industrial ecology and circular economy. It provides a practical and comprehensive
    forum for exchanging scientific knowledge and ideas which bridge the technological
    advancement and sustainable practices with industrial ecological management. The
    goal of this series is to bring together the expertise of professionals who are
    working in the field of industrial ecology and sustainability across the globe.


    # ## COVERAGE


    +   * Blockchain and Circular Economy Practices

    +   * Environmental Science

    +   * Green Practices

    +   * Environmental Input-Output Analysis (EEIOA)

    +   * Sustainability

    +   * Urban Metabolism

    +   * Material Flow Analysis (MFA)

    +   * Life Cycle Assessment (LCA)

    +   * Industrial Symbiosis

    +   * Pollution


