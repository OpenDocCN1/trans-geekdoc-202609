  md: '# Chapter 2


    # How to Improve Organizational Performance Using Big Data in the Hotels


    Subhodeep Mukherjee

    https://orcid.org/0000-0002-6863-4881

    GITAM University (Deemed), India


    Manish Mohan Baral

    https://orcid.org/0000-0002-9620-1872

    GITAM University (Deemed), India


    Venkataiah Chittipaka

    https://orcid.org/0000-0002-7804-0796

    Indira Gandhi National Open University (IGNOU), Delhi, India


    # ABSTRACT


    Big data is a collection of huge amounts of data for extracting information from
    data. This helps the firms know the hidden knowledge in the data. This research
    aims to study the adoption of big data in the hotels of India, and it is helping
    in improving performance. For this study, a technological-organizational-environmental
    (TOE) framework is used. The factors are identified from the literature review.
    A questionnaire is prepared for survey-based research in the hotel industry. Exploratory
    factor analysis and structural equation modeling are used for analysis. Three
    models are developed for the study. The entire proposed hypothesis for the study
    was accepted.


    DOI: 10.4018/978-1-7998-7642-7.ch002'
