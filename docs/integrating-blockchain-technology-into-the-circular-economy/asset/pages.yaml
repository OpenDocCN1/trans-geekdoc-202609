  img_proc: true
- pgno: 161
  md: '# e-Delphi round 3


    In round 3, panelists used the same 9-point measure to rate the components, however
    this time with an awareness of the group’s ratings. As a result, participants
    may focus on their score and make adjustments in light of the group’s score while
    remaining anonymous to the rest of the panel. Each round had seen a decline in
    the number of participants, with the last round having just 16 responses. Round
    3 results were evaluated in the same way as round 2 results were, and a final
    number of points was settled upon. This list was then divided into major themes.


    # FINDINGS AND DISCUSSION


    This section of the chapter presents the findings of the study particularly on
    how blockchain acts as enablement of industry 4.0. Based on the findings of the
    modified e-Delphi panel, the author presents and discusses several ways on how
    BCT can impact industry 4.0, emerging issues. The aspects were BCT acts as enablement
    which was identified as of very high significance by 70% of the expert panel were:
    1) Trackability with Smart Contracts, 2) End to end visibility 3) Quality 4.0,
    4) Intellectual Property (IP) Protection, 5) Product safety, 6) Fraud prevention,
    7) Data & Communication Security and 8) Neighborhood Microgrid.


    # Trackability with Smart contract


    Smart contracts are simply computer code that can perform complex functions automatically
    and operate with a basic “if x then y” logic (Cuccuru, 2017; Lauslahti et al.,
    2017; Brownsword, 2019). For instance, a smart contract can be coded so that when
    it gets the data verifying that a shipment of cargo has been delivered by the
    buyer, the data is checked for authenticity, and the smart contract immediately
    transfers payment that has been held in escrow. Compared with traditional contracts
    where human confirmation is required for the operation of a contract, to review
    the terms of service and determine the next steps by the signed agreement. With
    smart contracts, information is shared reliably, and safely across complex supply
    chains. Smart contracts offer unalterable, persistent digital records of items,
    components, and goods, fostering transaction openness between all participants
    (Hewa et al., 2020). By using smart contracts, the transaction is marked with
    a special tag which is beneficial due to (1) lack of trust among members beneficial
    (2) the supply chain includes several parties with their different IT systems,
    or (3) new party can be inducted into the chain.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Smart contracts minimize payment delay, mitigate billing and payment inconsistencies,
    and connect processes to real-world physical experiences. Since smart contracts
    are stored on a single, distributed ledger, anybody with the proper authorization
    can access them. This implies that all participants in the supply chain will see
    all smart contracts at any time (Li, 2019). They can also see the contract’s conditions,
    as well as how near it is to being met with the contract’s records.


    It’s worth remembering that smart contracts aren’t just digital copies of paper
    contracts; they’re pieces of code. They’re established as “if-then” conditions
    in programmatic coding, thus, if one condition happened, another happens. Depending
    on the contract and the number of parties involved, these conditions may require
    one or more steps. Aside from offering a method to increase transaction performance,
    advocates of smart contracts promote its potential to remove non-enforced terms
    in conventional contracts. For example, if two parties agree to procedural code
    language in a contract but find that implementing one element of the contract
    is economically unviable or impractical, they can simply exclude the phrase in
    a smart contract.


    # Use Case: Logistics 4.0


    Numerous operations in the logistics industry, such as agreement terms, fraud
    prevention, records management, transactions, cash flow, and more, can be simplified
    and secured by smart contracts (Casado-Vara et al., 2019). Smart contracts can
    track deliveries from the start to the end of their journey — as they exit the
    factory and find their way to the customer (Tsiulun et al., 2020). The blockchain
    stores all of the details about its journeys, and when the terms are met, smart
    contracts are executed. Trucking companies are now attempting to invest in good
    tracking technology, but the security of these systems is doubtful. Furthermore,
    since these technologies lack a secure authentication mechanism, cybercriminals
    or bad actors can still access the network’s data. The blockchain can radically
    offer the solution in these situations. Blockchain can verify all of the driver
    records for every new carrier, much as it can validate a used vehicle. Many companies
    are increasingly concerned with data being tampered with, duplicated, or even
    full of inaccuracies on their load boards. This can contribute to a distorted
    portrayal of customer needs. with the BCT for logistics tracking feature, importers
    can directly update the blockchain with timestamps. There is no risk of mistake
    or replication since all of the data in the blockchain is checked.


    # End to End Visibility


    Within complex supply chains, industries may use BCT to share data instantly,
    efficiently, and safely. Blockchain can provide an unchangeable, persistent digital
    record of items, pieces, and goods, fostering end-to-end visibility and providing
    all'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'parties with a single source of reality (Jabbar et al., 2020). Transactions
    can have a unique tag added to them in the blockchain records. These real-time
    activity logs can be used by manufacturers to monitor the movement of source parts
    and finished products. All orders, sales, and inventory can be tracked by all
    parties, allowing them to stay on top of things. Consider the effect that complete
    supply chain visibility would have on businesses. They''ll be able to see where
    parts were sourced, who was involved in the manufacturing process, and how the
    product went from one end of the supply chain to the other. This provides complete
    accountability for industries and aids in the strengthening of corporate relationships.


    # Use Case: Aircraft Industry


    A completely operational commercial plane needs millions of small and large parts,
    many of which come from different sources. As a result, knowing the history of
    each component of the aircraft is crucial. Despite developments in sensor technology,
    IoT, data analytics, and cloud computing, there is still a lack of real-time access
    to details such as components, settings, and service schedules. In reality, obtaining
    comprehensive, real-time details of an airliner, let alone an entire fleet is
    incredibly difficult. And there''s the blockchain. By balancing openness and security
    on a distributed ledger, it has the potential to resolve this. Not only can blockchain
    trace the origin of various parts, but it also has the potential to record the
    setup of a plane for any flight during its long operational life by providing
    a snapshot of all the pieces and processes. BCT keeps the capacity of creating
    a digital record for each component mounted in a plane and updating it after each
    service or inspection. Tail numbers, part positions on planes, suppliers, part
    admissibility, the name of each mechanic who worked with the part, and the service
    location are all examples of data that could be captured


    # Quality control


    Quality 4.0 is the extension of the fourth industrial revolution to the field
    of quality (Brandenburger et al., 2021). The central principle of Quality 4.0
    is to integrate quality management practices with evolving Industry 4.0 capabilities
    to help industries achieve operational excellence. The rapid, efficient aggregation
    of data from different sources, which enables informed and efficient decision-making,
    is a major aspect of Quality 4.0 (Zonneshain et al., 2020). Furthermore, automatic
    assessment reduces the possibility of human error in interpreting the data. Non-contact
    inspection automation also allows for the processing of even larger volumes of
    data for more in-depth research. With BCT, blockchain provides immutable records
    of quality checks and manufacturing process details, in addition to assisting
    clients in tracking'
