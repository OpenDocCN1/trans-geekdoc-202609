- pgno: 10
  md: 'Industry 4.0 (also known as smart manufacturing or industrial internet of things
    [IIoT]) refers to a major change in the way products are manufactured and delivered,
    with a focus on industrial automation and the flexible factory backed with several
    technologies that include the internet of things (IoT), cyber-physical systems,
    and artificial intelligence. Industry 4.0 gave birth to a new age of smart manufacturing,
    automated supply chain, and personalized goods and services. Meanwhile, the rise
    in the application of blockchain technology (BCT) in different sectors propels
    the Industry 4.0 model to extend its scope. This chapter discusses the impact
    of BCT as the enabler of Industry 4.0. The modified e-Delphi methodology aimed
    at gathering the opinions of recognized experts was used. The findings present
    the potential that BCT brings using a case along with emerging issues. Emerging
    issues such as BCT security, interoperability, smart contract issues, digital
    twin issues, and ethical issues are discussed, and solutions are proposed.


    # Chapter 10


    # Supply Chain Management Professional Use Technologies (SM) During the Pandemic
    to Accomplish Tasks ....................................165


    Muhammad Tanveer, Prince Sultan University, Saudi Arabia

    Abdul-Rahim Ahmad, Karachi School of Business and Leadership,

    Pakistan


    Syndrome-coronavirus-2 (SARS-CoV-2), commonly referred to as the COVID-19 pandemic,
    has caused people to spend more time online. The pandemic has spurred growth in
    the use of social media technologies. Organizations now train employees to use
    digital media to coordinate work and connect to fulfill the requirement of supply
    chain management (SCM). The study aims to produce effective discussion regarding
    the importance of SCM and technologies and how it can assist in the recent times
    of COVID-19 regarding job performance. Research predicts the new ways of business
    conducted and how communication and coordination, knowledge exchange, training,
    and development are helpful in carrying out effective job productivity at the
    workplace of SCM. The authors analyzed responses of more than 294 SCM employee
    who reported on “go-to” technologies and social media tools to remote office practices.
    The research employed quantitative methodology (i.e., emailed questionnaires)
    and found that social media has become an important tool for conducting business
    operations due to social distancing and isolation.


    # Chapter 11


    # Big Data Analytics: Applications and Barriers in Supply Chain....................184


    Arsalan Zahid Pirrani, Federal Urdu University of Arts, Science, and Technology,
    Pakistan

    Amjad Ali, Hamdard University, Pakistan

    Adeel Shah, University of Kuala Lumpur, Malaysia'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'As the magnitude of accessible data grows, a multitude of business intelligence
    (BI) tools have emerged, all of which may be together referred to as big data
    analytics (BDA). BDA in supply chain management-related activities is essential
    because it can manage global, complex, tempestuous, and dynamic value chains.
    The powerful influence of big data (BD) capabilities on supply chain (SC) and
    overall company performance is attracting operations management researchers, who
    see them as having a significant impact on supply chain and company performance.
    This chapter discussed the importance of big data analytics and connected it with
    its significance in the supply chain context. The authors demonstrated how big
    data analytics (BDA) is a critical success element for an organization in the
    global and dynamic market. This chapter also highlights some of the barriers and
    challenges in implementing big data analytics in the supply chain.


