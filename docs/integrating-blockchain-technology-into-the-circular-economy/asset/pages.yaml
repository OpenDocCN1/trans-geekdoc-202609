  md: '# Chapter 11


    # Big Data Analytics:

    Applications and Barriers in Supply Chain


    Arsalan Zahid Pirrani

    Federal Urdu University of Arts, Science, and Technology, Pakistan


    Amjad Ali

    https://orcid.org/0000-0003-1686-0016

    Hamdard University, Pakistan


    Adeel Shah

    https://orcid.org/0000-0001-8477-5310

    University of Kuala Lumpur, Malaysia


    # ABSTRACT


    As the magnitude of accessible data grows, a multitude of business intelligence
    (BI) tools have emerged, all of which may be together referred to as big data
    analytics (BDA). BDA in supply chain management-related activities is essential
    because it can manage global, complex, tempestuous, and dynamic value chains.
    The powerful influence of big data (BD) capabilities on supply chain (SC) and
    overall company performance is attracting operations management researchers, who
    see them as having a significant impact on supply chain and company performance.
    This chapter discussed the importance of big data analytics and connected it with
    its significance in the supply chain context. The authors demonstrated how big
    data analytics (BDA) is a critical success element for an organization in the
    global and dynamic market. This chapter also highlights some of the barriers and
    challenges in implementing big data analytics in the supply chain.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 1. INTRODUCTION


    In the twenty-first century, data flowed at a breakneck speed. The rapid proliferation
    of data over the last two decades has led to the birth of Big Data (Addo-tenkorang
    and Helo, 2016). The flood of digital technology further substantiates the rise
    of big data. As technology becomes accessible, citizens worldwide become increasingly
    accustomed to the sensors, communication tools, actuators, and data processors
    that come with it (Raj et al., 2019; Tiwari et al., 2018). Furthermore, according
    to a 2011 study by the International Data Corporation, the globe has already created
    one zettabyte of data. Rising numbers have been accelerating; the total amount
    of data had increased to 7ZB in 2014 (Shayaa et al., 2018) and reached more than
    50 ZB of data in 2020. Textual data accounts for at least half of that, as produced
    by social media platforms like Facebook, Twitter, and mobile instant messaging
    applications like WhatsApp and Telegram. Big data growth estimates as per the
    recent Statista platform project that in 2025, data will reach the colossal figure
    of 180 zettabytes, which is 1.3 trillion terabyte growth over 2020. This surge
    in data volume is attributable to the growing demand for remote learning, working,
    and entertainment due to the rise in popularity of telecommuting, working remotely
    and taking leisure time online during the COVID-19 lockdown times (Novikov, 2020).


    In addition to this, millions of network sensors are embedded in smartphones,
    smart energy meters, cars, and industrial equipment in the physical environment.
    Advancements in digital sensors and communication technologies have fuelled the
    Internet of Things (IoT) (Saleem et al., 2019). According to IDC, 127 new devices
    are constantly joining the internet every second throughout the world. Over the
    next fifteen years, the developed connected devices will have generated about
    five quintillion bytes of data per day, equal over 79.4 Zettabytes of data. The
    primary functions of IoT devices depend on the intended use of the devices and
    the kinds of data the devices are designed to gather. Companies use the Internet
    of Things (IoT) to regulate their operations better and increase their market
    reach by adding sensors and security systems.


    As businesses increasingly demand better decision-making processes to succeed,
    data becomes essential to help drive such improvements. While all companies can
    take advantage of information system infrastructure expenditures, not all can
    transform those investments into better results (Chavez et al., 2017). The ability
    to leverage big data is regarded as one of its advantages since it may be unique
    and challenging to reproduce in the near to intermediate-term. Once industries
    have used big data to expand their market shares, some experts believe that exploiting
    and harnessing big data is the forthcoming “blue ocean” in terms of overall business
    performance (Ali et al., 2020). The literature has reported that digital transformation
    and technological breakthroughs continue to be the leading drivers of rising Big
    Data investment.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Businesses must continuously innovate to be relevant in the marketplace, especially
    with so much competition in every field (Shafiq et al., 2019). Industry specialists
    require the proper amount of data to make informed judgments, and Big Data analytics
    give just that. These judgments can help a company advance by properly recognizing
    a market trend that could increase revenue. Global expenditure on Big Data was
    already over $180 billion at the end of 2019, and it is expected to rise at a
    growth rate of 13.2 percent between 2020 and 2022 (Business Wire). According to
    reports, IT expenditures, hardware purchases, and business services might be the
    areas where the most money is spent on Big Data analytics.


    # 2. BIG DATA COMPATABILITY


    Every aspect of the global economy is infused with large volumes of data (Manyika
    et al., 2011). Companies utilize data to their advantage in various settings,
    from retail outlets to commercial airplanes. The term “five V’s of data” is often
    used to characterize the many facets of the subject of big data (Wamba et al.,
    2015). Big data is described as high-volume (big scale), high-velocity (moving/streaming),
    and high-variety (e.g., numerical, text, and video). Besides, big data also entails
    information assets that necessitate cost-effective, creative information processing
    for improved insight and decision making (Chae et al., 2013; Wright et al., 2019).
    However, with the evolution of the big data concept, two additional V’s has been
    added to this definition of big data. One of the V’s is called “value,” which
    addresses the requirement to produce economic value. The other is ‘Veracity,’
    which refers to the quality of information rather than the amount (Wamba et al.,
    2015). The usage of big data is a developing phenomenon that reflects the growing
    importance of data in terms of volume, variety, velocity, value, and veracity
    (the “5Vs”). The methodologies, algorithms, applications, and systems used to
    uncover, extract, store, examine, and report meaningful information helps the
    firm to make an optimized and calculated decision. Big data analytics has lately
    ascended to great attention because of the increased capacity to gather vast volumes
    of data and apply more sophisticated analytical tools to enormous data sets. The
    ability to collect large (and varied) data as well as use sophisticated analytical
    approaches to such data allows them to manage immensely complicated choices that
    were formerly reliant (primarily or exclusively) on human cognition and hunches
    (Chen et al., 2015).


    Predictive data analytics, natural language processing, data mining, and machine
    learning algorithms are tools used in various scenarios, all to extract critical
    insights and produce meaningful conclusions (Ertemel, 2015; Rao et al., 2019).
    However, there is ambiguity in the definition of data analytics throughout the
    literature. Data analytics, big data analytics, supply chain, and predictive analytics
    are often used in'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'tandem. The concept covers organizational capabilities, including data collection,
    storage, and processing, allowing organizations to get valuable insights that
    enhance their competitive position.


    # 3. SUPPLY CHAIN ANALYTICS


    In recent years, supply chains have become increasingly complicated, multi-tiered,
    and globally dispersed (Pirani et al., 2020). Nonetheless, the need to cut costs
    without jeopardizing other competitive considerations like providing excellent
    customer service and high-quality products and services is growing (Wilhelm et
    al., 2016). Additionally, ICT advancements, such as Web 2.0 and the internet of
    things (IoT), have vastly expanded the volume of global data (Wang et al., 2016).
    As a result, businesses have been looking for new and improved technology and
    innovative solutions to help them overcome the challenges. Data-driven information
    technologies that allow for collecting and analyzing large amounts of data using
    advanced techniques like data mining, artificial intelligence, and machine learning
    provide an analytical approach that can yield new intuitions for improving supply
    chain efficiency (Gunasekaran et al., 2017). This can lead to an analytical capacity
    for the company when it is implemented correctly and paired with adequately educated
    personnel. Supply chain analytics is a technology-based capability that creates
    new possibilities and opportunities by extracting critical value from massive
    amounts of supply chain data (Ramanathan et al., 2017). Supply chain analytics,
    in particular, may help a company make better and more effective decisions and
    increase supply chain efficiency, resulting in more excellent financial performance
    (Wamba et al., 2020). Supply chain performance has even been said to be revolutionized
    by big data. When it comes to supply chains, businesses are using big data to
    learn about their products, suppliers, and consumers, as well as market prospects.
    The objective is to build supply networks driven by data. The supply chain that
    is gone through data is better able to organize, analyze, and analyze data all
    along the supply chain, enabling them to optimize supply chain design and gain
    superior competitive advantage (Chavez et al., 2017).


    As a result, many companies invest or plan to invest in data processing information
    technologies and analytics capabilities. It has been reported that international
    purchases of technology and analytics-related solutions by the banking and manufacturing
    sectors exceeded $150 billion in 2017, representing a 12.5% increase from the
    last year (Shirer and Goepfert, 2018). In the supply chain context, many opportunities
    are open to companies interested in developing BDA tools and using BDA procedures
    in supply chains due to the emerging tools and methods. Manufacturing supply chains,
    controlling and reducing risks, refining operational'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'procedures, bringing new goods to the market, performing market assessments
    for specific products — all of these BDA-assisted processes may improve and contribute
    to a business’s overall success (Moktadir et al., 2018)


    # 4. TYPES OF BIG DATA ANALYTICS CAPABILITY


    # 4.1 Descriptive analytics


    Descriptive analytics allows information to be incorporated into helpful reporting
    formats and used to answer questions like “what happened?” (Mortenson et al.,
    2015). The descriptive analytics community focuses on finding what has happened
    in the past. Historical data is beneficial when it comes to identifying patterns.
    This data may have been collected through supply chain planning tools and other
    sources that offer information to companies, distributors, and consumers. With
    data analytics, patterns may be detected and possible causes for change speculatively
    proposed. Experts may then use this knowledge and data in these visualizations
    and reports to understand and predict changes and develop connections to improve
    business results (Tiwari et al., 2018). The descriptive analysis uses conventional
    analysis, which keeps the level of complexity manageable. The interpretation,
    reporting, and data management process takes time and needs competent leaders
    to understand the facts thoroughly before making an informed choice.


    # 4.2 Predictive analytics


    While descriptive analytics just examines current facts, predictive analytics
    further develops this kind of analysis and uses data mining to detect connections
    and correlations that had not before been seen. Predictive analytics has been
    offered in the supply chain, often referred to as supply chain predictive analytics.
    Supply chain predictive analytics uses diverse techniques to aid supply chain
    design and sustainability. The primary tool it uses is the combination of pre-and
    future coordination of business applications and associated costs and quality
    of service (Jeble et al., 2018). A previous analysis of historical data patterns
    is used to determining the variations that may happen in the future, and a prediction
    is made from these past trends. With this method, the causes for unknown actions
    and occurrences are determined with precise forecasts of the future to discover
    the data gaps. Even mathematical methods like regression are unable to anticipate
    future events correctly. In predictive analytics, businesses may identify and
    forecast future trends of commercial transactions, including the behaviors of
    customers and buyers, and devise a plan to deal with these trends (Hofmann and
    Rutschmann, 2018). We can'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'anticipate customer demand, track down missing supplies, and keep track of
    daily company operations using these techniques. Some research studies have utilized
    predictive analysis to anticipate demand and inventory levels, evaluate suppliers
    and predict risks in supply chain management (Soleimani et al., 2014). However,
    a more comprehensive set of abilities is required for predictive analysis than
    descriptive analysis (Sanders, 2016). Approaches like predictive modeling, such
    as linear regression, may start with and allow for further experimentation. Although
    being better equipped to reduce statistical biases, Rigorous analytics have shown
    to be more accurate; nevertheless, greater care must be taken to avoid such prejudices
    (Wang et al., 2016).


    # 4.3 Prescriptive analytics


    Descriptive and predictive analysis, together with optimization models, are a
    part of prescriptive analysis methods. It concentrates on the process of describing
    and predicting, and proposing solutions utilizing optimization models (Lepenioti
    et al., 2020; Souza, 2014). It has been evident from the literature that prescriptive
    supply chain solutions are most frequently implemented at the operational and
    strategic levels (Hahn and Packowski, 2015). Although undoubtedly applicable to
    all aspects of a business, Prescriptive analytics promises optimizing distribution
    network operation. Companies have used predictive analytics to pursue operation
    manufacturing, supply chain management, and other business functions. Pre-emptive
    forecasting techniques have helped to reliably and pre-emptively forecast future
    amounts to avoid excess prediction error at the beginning of the supply chain
    (Hassani and Silva, 2015).


    Moreover, in contemporary times, optimization techniques are more effective in
    ensuring complex supply chains can deliver products at a higher level of specification
    (Osaba et al., 2018). For instance, machine learning and operational research
    to improve inventory choices led to greater productivity (Priore et al., 2019).
    Also, using optimization tools, the transportation companies tracked the length
    of time and cost for last-mile delivery to calculate the optimal path.


    # 5. APPLICATION OF BIG DATA IN OPERATIONS MANAGEMENT


    Big data applications in operations and supply chain management have already demonstrated
    their promise in the literature (e.g., Akter et al., 2016; Dubey et al., 2019).
    It assumes that the availability of timely and actionable data from the supply
    chain will enable businesses to detect and address defects and rework, which,
    in turn, would contribute to lower product development time, improved customer
    responsiveness, and improved efficiency. The preceding and succeeding justification'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'illustrate the necessity of a data-driven supply chain for manufacturing-related
    operational capability improvements.


    # ## 5.1 Big Data and Strategic Sourcing


    Technologists and specialists working in a supply chain setting face constant
    data streams used to reorganize and analyze supply chain operations and better
    support supply chain performance (Hazen et al., 2018). The sheer quantity of data
    created by manufacturing may be found via various channels, including sensing
    systems and industrial processes. Analytical activities like processing and mapping
    large volumes of data for performance analysis, or continuous monitoring of methods
    and devices, may be facilitated by big data. Because the market is primed for
    growth, an organization must have the readiness and anticipatory capability for
    future advances. Manufacturers must use big data and analytic methods to increase
    their manufacturing and operational capabilities. For instance, the firm can use
    this in the sourcing stage (Lamba and Singh, 2017). Even with such a wide range
    of selection and evaluation tools, the process of finding a qualified and appropriate
    supplier for the supply chain is challenging.


    Furthermore, having access to data from multiple functional areas of an organization
    and diverse supply chain partners is crucial to finding improvements in supply
    chain effectiveness and efficiency (Sanders, 2016). The information must be shared
    across all supply chain partners to use the data to its most significant possible
    benefit. Both inside and outside the organization, and used to build a process
    perspective that brings all of the organization’s supply chain partners together
    in a single unified process view. Within the firm, dissemination of the information
    across the organization would allow the functions in the internal chain to visualize
    discrepancies in the supply chain and track the tactical and operational performance
    swiftly (Chavez et al., 2017). Information may be provided outside the company
    along the supply chain to link partners and provide end-to-end access to supply
    chain data.


    For instance, manufacturers in the supply chain can utilize their data combined
    with customers and suppliers. The data relating to raw material, delivery, promotion,
    and inventory enhances accuracy in demand forecasting and supply planning. This
    data-driven approach in the supply chain enables a company to form strategic alliances
    with supply chain partners and collaborate more effectively. Furthermore, it also
    facilitates firms in the supply chain to exploit unique and precise methods in
    attaining superior business and operational performance (Talwar et al., 2021).
    Besides, it includes joint product development initiatives based on market insight,
    collaborative planning, forecasting replenishment, and applying the lean methodology
    to achieve operational excellence (Waller and Fawcett, 2013).'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 5.2 Big Data Analytics and Sustainable Supply Chain


    Business professionals widely accept socially and environmentally sustainable
    company practices (Shrivastava and Guimarães-Costa, 2017). Despite many attempts
    by non-governmental organizations (NGOs) to react to outside forces such as governmental
    policy, consumer demand, and internal pressures such as a leader’s expectations,
    the underlying facts are still up for dispute. Supply networks are becoming more
    concerned about sustainability. As a result, successfully addressing the mounting
    social and environmental needs is a huge issue for companies. Supply chain decision-making
    is complex when many entities or environmental problems are at play, especially
    when choices are made throughout the supply chain or are reliant on ecological
    systems. In figuring out the environmental effect of their supply chains, companies
    may not have all the relevant information. As a result, most organizations are
    forced to use resources sparingly because of a lack of data and knowledge about
    the environmental challenges they confront, how ecological concerns interact,
    and the implications of these relationships. Scholars have argued that strengthening
    openness and collaboration among supply chain partners may help them join efforts
    to accomplish shared sustainability objectives (Bag et al., 2020).


    It is believed that the massive amount of data generated by big data will have
    significant implications for environmental studies. For instance, Pirelli, the
    fifth-biggest tire manufacturing organization globally with the assistance of
    SAP, a German software firm, used big real-time data to address inventory problems.
    Real-time big data provide Pirelli with the ability to manage its inventory, ensuring
    tires don’t end up in landfills or contributing to greenhouse emissions in the
    environment (Dubey et al., 2019). The literature also reported the application
    of big data analytics in green product development. Bag et al. (2020) that green
    product development operations may be planned and executed effectively using Big
    Data Analytics management capabilities. BDA provides many avenues for green goods
    to be developed and marketed to customers across the world. Green product performance
    in the field may be predicted using predictive analytics. Accurate forecasting
    will aid in establishing the appropriate marketing and operational strategies,
    which will also enable companies to manage their supply chain expenses better.
    BDA technologies would allow organizations to use a proactive approach and capitalize
    on opportunities before their rivals. The studies mentioned above confirmed that
    data analytics might help support the company’s aim of advancing social and environmental
    sustainability.


    # 5.3 Big Data Analytics and Supply Chain Resilience


    In 2011, Japan had a catastrophe of unprecedented proportions, resulting in several
    international companies, such as Honda and Sony, halting production'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'due to a shortage of critical resources (Pettit et al., 2013; Revilla et al.,
    2017). It has been evident from the literature that business process improvements
    and the implementation of supply chain resilience with the use of big data would
    assist in minimizing the risks of interruptions in the supply chain and therefore
    increase overall performance (Gunasekaran et al., 2017). It is important to note
    that building data analytics capabilities also necessitates supply chain visibility.
    According to Srinivasan and Swink (2018), organizations that can create and implement
    data analytics systems are better situated to cultivate and increase demand and
    supply chain visibility. Mubarik et al. (2021) claim that in Industry 4.0 era,
    supply chain visibility is a desirable skill, and supply chain disruptions may
    be mitigated as a result. Because visibility is essential to supporting analytics,
    we contend that those organizations that spend in building analytics capacity
    will also invest in visibility. Similar contentions were made by Srinivasan and
    Swink (2018) that visibility and analytical skills are both valuable and complimentary.
    The extant literature offers a significant amount of empirical evidence showing
    that increased supply network visibility capacity is likely to decrease both the
    likelihood and the effect of supply chain interruption. The visibility in the
    supply chain improves supply chain resilience as well: a supply chain risk procedure
    requires full awareness of all supply chain vulnerabilities. Because of this,
    managers will need data technology that helps them detect potential risks or causes
    of interruption to assist them in creating business continuity strategies. Hence,
    firms that consider all of these factors may end up being more resilient, competitive,
    and responsive.


    # 6. BARRIERS IN IMPLEMENTING BIG DATA ANALYTICS


    While it is feasible to do analyses on large amounts of data, many impediments
    hinder the big data project initiatives in the organization. The idea of BDA is
    fresh and has the potential to propel the digital business into the future. There
    is still a high proportion of grey literature (i.e., unpublished or obscure sources)
    in current research. More recently, however, contributions in academic journals
    have begun to emerge. Nevertheless, the body of scholarly research examining the
    problems, obstacles, and barriers connected with BDA and BDA’s implementation
    seems to be lacking. The following discussion covers barriers to implementing
    BDA in manufacturing organizations.


    # 6.1 Organizational barriers


    In terms of organizational barriers, culture, especially organizational culture,
    greatly influences an organization’s strategy, structure, and procedures. Design
    and'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'structure are developed depending on how top management views and understands
    corporate values and norms. Consequently, many big data challenges may stem from
    company culture rather than data or technology because of these factors. An organization
    may be aware of the strategic potential of big data as it doesn’t fully comprehend
    how big data might enhance its operations, and as a result, sees little value
    in adopting big data projects (Kache and Seuring, 2017). The literature has dramatically
    emphasized building a data-driven culture, identified as a significant difficulty
    when implementing big data strategy. A data-driven culture is one in which people
    make decisions using data insights (Maroufkhani et al., 2020). The absence of
    data-driven culture is one of the main reasons, so many big data initiatives fail.
    Many executives depend on intuition or previous experiences in place of facts-based
    and data-driven decisions. Managers’ conduct may influence how everyone else in
    the company approaches decisions.


    Furthermore, Industry 4.0 will need an abundance of data across companies and
    industries. For the bulk of the businesses, limitations on resources threaten
    their success: this occurs because top managers of companies are often reluctant
    to embrace technology solutions. Furthermore, implementing any technical solutions
    is a strategic choice. It is hard to build a digital strategy to successfully
    deploy such technologies if senior management is reluctant to approve them (Cubic,
    2020).


    However, the deployment of any technological solution demands an effective change
    management strategy. It has been witnessed that technology has affected change
    over the past decade in many significant ways. The change process was often seen
    as transactional and straightforward, but now, it is seen as complicated, multifaceted,
    open-ended, and long-term (Raj et al., 2019). In other words, it has transformed
    into a revolutionary concept, making it more challenging to implement effectively.
    Entrepreneurs, technologists, and organizational experts anticipate that open-ended
    systems will be more complicated than ever, and effective change management will
    be critical for companies to deploy any technological solutions in the organization
    successfully.


    # 6.2 Data related barriers


    Data-driven choices are already becoming the norm for companies, but processing
    data is still problematic for the most vulnerable regions. Without access to information,
    these sectors are losing out on making clear choices for their company (Seddon
    et al., 2017). Industries have many data-related challenges that interfere with
    their ability to make data-related choices. Difficulty in handling data arises
    because of the intricacy of the data. In addition to this, data privacy and security
    have captured industrialist’s and manufacturer’s attention since it is an essential
    issue for their'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'businesses, and trade plans might be jeopardized if private data was compromised
    (Alharthi et al., 2017).


    Furthermore, the emergence of colossal IoT networks has necessitated increased
    security and privacy concerns. Data security concerns, like those at the enterprise
    level, need special attention from an SC perspective, as businesses frequently
    rely on data from external firms. As a result, data and information security are
    the significant SC problem (Mohammadzadeh et al., 2018). Data security threats
    might make it difficult for participating organizations to implement BDA. They
    are hesitant to share data with chain entities because they are anxious about
    losing control of sensitive information. Failure to successfully satisfy these
    concerns puts everything on the line, which, when that happens, may potentially
    result in extensive damages, work stoppage, or even loss of life. At the same
    time, to maintain the security of the gathered data, the confidentiality of the
    service and the whole IoT system must be ensured. A significant challenge is the
    variety of IoT devices and the environment in which they operate.


    # 6.3 Technology related barriers


    A significant part of successfully implementing big data analytics involves appropriate
    technological infrastructure (Yasmin et al., 2020). However, a considerable investment
    in software and technology is required to analyze hundreds of millions of records
    in real-time, which is needed for big data analytics (Shafiq et al., 2019; Yu
    et al., 2017). It seems that most of the current solutions were not specifically
    developed to satisfy the data analytics needs that are rising. Integrated systems,
    including a wide range of computer hardware via the internet, including cloud-based
    solutions, are predicted to be useful for large data sets. When much data is handled,
    technologies often fail for technical and economic reasons (Alharthi et al., 2017).
    For example, it would take 750 days to process one petabyte of data if all 1,000
    processing nodes were linked through a cloud (one petabyte equals one million
    gigabytes). If this system were built, it would cost more than $6 (Alharthi et
    al., 2017). Even yet, businesses may not benefit from heterogeneous and cloud
    computing when managing significant data processing bottlenecks because of big
    data. For that matter, firms located in developing countries tend to contract
    out third-party infrastructure and collaborate on IT services as they build their
    businesses. Many companies begin by implementing these technologies inside their
    existing IT infrastructure, and then they add more as the need and funding dictate
    (Raj et al., 2019; Tabesh et al., 2019).


    Additionally, as 4.0 evolves, every channel member will be integrated. Digital
    infrastructure, therefore, is an essential element in the development of industry
    4.0. As technological developments become more critical in the current age, businesses'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'today are increasingly cooperating in infrastructure development instead of
    fighting for it.


    # 6.4 Economic related barriers


    In manufacturing, the use of BDA is made possible through capital investments.
    It has been stated that most businesses suffer financial issues when it comes
    to capital due to their restricted resources (Gawankar et al., 2020). Between
    20% and 50% of their profits are devoted to investment (Mohanty et al., 2013).
    Although so far, the connection between corporate investment in BDA and effectiveness
    in implementing BDA has not been fully shown, it is believed that investments
    act as a source of fuel for deploying big data analytics in the organization (Mikalec
    et al., 2019). Research suggests that businesses intending to adopt big data analytics
    successfully would have to increase their capital expenditures by 50% in the next
    five years. Firms need to re-engineer their current strategy and spend substantially
    to accomplish those objectives. In addition, Kache and Seuring (2017) argue that
    considerable investment is required both at the corporate and supply chain levels
    to execute the strategy above. However, Breunig et al. (2016) viewed that most
    companies are reticent to make investments in technology, as this requires massive
    investment.


    # 6.5 Workforce related barriers


    To get the full benefits of BDA, a firm must first grasp the knowledge and comprehension
    of the concepts involved. Also, workers’ expertise and competence in using the
    tools come into play in making the adoption successful (Tabesh et al., 2019).
    As for workers, it has been shown that although most of the workers are functional
    and successful in their regular job, they have trouble incorporating change when
    it comes to new technology. Employees’ critical analytical skills are fundamental
    to determining how any manufacturing company implements BDA (Alharthi et al.,
    2017). In addition, companies cannot possibly reap the full benefits from using
    data analytics technologies unless they have appropriately qualified and highly
    skilled personnel to oversee data analytics technologies (Long et al., 2016).
    Adopting big data analytics in businesses doesn’t often stem from a lack of knowledge
    but rather how employees perform. In some cases, workers will not alter how they
    operate to take advantage of big data analytics. Workers find new technology and
    procedures frustrating, especially if they see them disruptive to their current
    workflow.'
