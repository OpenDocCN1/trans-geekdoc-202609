  md: '# 2.1 Principles of Blockchain Technology


    # 2.1.1 Block structure


    The database structure has been transformed by blockchain technology. Data is
    divided into different blocks using this technology, and each block is linked
    to the preceding block’s back using specific information supplied in a sequential
    order. Data in its entirety. These data are preserved in electronic records indefinitely,
    and the files that store them are known as blocks. During the block creation phase,
    the block will keep track of transaction data, and the block’s primary body will
    be a collection of transaction data. The blockchain’s structure is separated into
    two sections: the header and the body. The block header’s purpose is to provide
    a connection to the previous block. This section is responsible for ensuring the
    blockchain database’s integrity. The block body stores all of the confirmed records
    of value exchanges that took place during the block’s construction. The block
    structure has two key features: the first ensures the database’s integrity, and
    the second ensures that the data cannot be tampered with. (McBee & Wilcox, 2020)


    # 2.1.2 Distributed structure


    The next step is to consider recording and storage after you’ve solved the data
    problem with blocks and chains. Data is stored in one single location in most
    systems nowadays. Blockchain technology, on the other hand, allows each node involved
    in a data transaction to capture and save all of the information.(Sultana et al.,
    2020) The main idea is to create a comprehensive set of protocol mechanisms that
    will allow all nodes in the network to check the data’s validity while recording
    it.Only when all nodes in the network agree that the data is correct are data
    records written to the block.In terms of data storage, the blockchain creates
    a distributed network in which all data in the database is saved and updated in
    real-time by all nodes participating in the record. As a result, even if certain
    nodes are broken or hacked, the data records and information updates in the database
    as a whole will not be affected. Accounting duties are dispersed with distributed
    accounting, and they are documented by all network participants. It also spreads
    every transaction throughout all nodes in the network, giving data information
    a high fault tolerance rate as long as it isn’t distributed throughout the entire
    network. The database system can keep running even if all of the nodes crash at
    the same time. (McBee & Wilcox, 2020)'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 2.1.3 Asymmetric encryption


    An asymmetric encryption technique is used in the blockchain encryption system’s
    principle. In the encryption and decryption procedure, this algorithm often uses
    public and private keys, which are asymmetric passwords. Both of these forms of
    encryption are available. Only the other comparable key can be decrypted after
    one of the keys has been encrypted. If the public key is used to encrypt data
    information, the data information must be decrypted using the corresponding private
    key, and if the private key is used to encrypt data information, the data information
    must be decrypted using just the corresponding public key. (Sultana et al., 2020)
    The public key can be made public, whereas the private key belongs to a single
    person and is not accessible to others. As a result, when utilising the blockchain
    to process data, users must maintain the private key secret in order to avoid
    data leakage owing to the private key’s publication. Multi-private key encryption
    technology has been derived from actual application requirements in the present
    blockchain system to satisfy more flexible and sophisticated scenarios such as
    multi-signature. (McBee & Wilcox, 2020)


    # 2.2 Characteristics of Blockchain Technology


    Blockchain technology has only been around for a few years. However, its exceptional
    characteristics are the cause for its quick development of influence: a high level
    of openness and sharing, decentralised high security, transparent transactions
    with privacy protection, anti-tampering, dishonesty, and traceability (Bhambhwani
    et al., 2020) (1) A high level of transparency and sharing Anyone who wants to
    join the blockchain system can set up a participating node on their device and
    become a block on the blockchain. You can receive the complete chain Copy of the
    information as long as you follow the chain’s integrity contract and related rules.
    You can enjoy the information of the complete chain that fits your identity as
    long as you become a block on the chain. Because of its high level of openness
    and sharing, blockchain technology has a wide range of applications. (Viriyasitavat
    & Hoonsopon, 2019) (2) Decentralization’s strong security. A network or system
    structure is used to put up a node with the highest authority (also known as an
    administrator), producing a privileged central location. This phenomenon has been
    completely bypassed thanks to blockchain technology. Special restrictions ensure
    that nodes and digital signatures created on the chain are secure. Nodes that
    do not adhere to the chain’s rules cannot participate in it or finish transactions.
    The blockchain eliminates possible node privileges and ensures the security of
    transactions between nodes based on fairness by removing the central node. (Bhambhwani
    et al., 2020) (3) Transparent transactions protected by privacy. The functioning
    rules of the blockchain are apparent'
