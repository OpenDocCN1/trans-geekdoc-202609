    # 2 THE PRINCIPLE AND CHARACTERISTICS OF BLOCKCHAIN TECHNOLOGY


    Blockchain technology is essentially Internet database technology used to construct
    Internet databases and is based on the Internet. Defined, the database functions
    as a ledger, and accounting behavior refers to the process of saving and reporting
    data in the database. (Bhambhwani et al., 2020) The goal of blockchain technology
    is to find accounting objects and keep the ones that are most efficient in terms
    of accounting. Also, convey the data from the ledger to other system objects.
    As a result, blockchain technology can also be referred to as a distributed ledger
    because it is a technical means of publishing data in a database to every node
    of the entire network. Blockchain technology is based on the Internet and allows
    for the creation of particular computer-based applications. (Zhao et al., 2016)
    Distributed data storage, peer-to-peer transmission, consensus mechanisms, and
    encryption algorithms, among other things, are all included in the blockchain
    technology application—data storage and transfer, as well as data exchange and
    security. As a result, decentralization, openness and transparency, and joint
    involvement are technological properties of blockchain technology. (Viriyasitavat
    & Hoonsopon, 2019) This method of database maintenance is a distributed system
    that is tough to adapt from a data standpoint. The database also comprises a distributed
    record of data, in addition to the distributed storage of data. As a result, blockchain
    is not a single technology. It combines several technical tools and provides some
    technological benefits and features in technical applications. (Sultana et al.,
    2020)'
  merge: -1
  img_proc: true
