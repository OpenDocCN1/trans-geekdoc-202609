- pgno: 168
  md: '# Energy


    To fulfill consumer energy needs, a way must be discovered to better link people
    with renewable energy sources. Energy blockchain start-ups are creating a new
    ecosystem where people can be linked in interconnected microgrids using the BCT,
    share their consumption data, and manage local renewable energy between them based
    on prices and individual interests. The majority of pilots on the energy sector
    are in the initial stages, especially in the field of peer-to-peer energy trading,
    whereby small-scale producers can sell excess generation directly to other customers.
    In effect, blockchain allows industries and companies to determine energy consumption
    and generation more effectively, as well as detect network irregularities, which
    can increase response time in the event of a breakdown or outage. Authentication
    of renewables from source of origin or keeping track of emissions are two other
    potential uses. Many people are thinking of using it as a grid management solution
    that can monitor power flow and highlight grid irregularities.


    # Use case: microgrid


    the first “blockchain microgrids” are systems that use an integrated blockchain
    to exchange neighborhood power generated by rooftop solar (Lai et al. 2021). The
    use of blockchain technology allows for the purchasing and sale of renewable energy
    produced by neighborhood microgrids (Choudhry et al., 2019). Smart contracts based
    on Ethereum can instantly allocate surplus power produced by solar panels. In
    the distributed energy space, blockchain is being used to create a slew of fresh
    concepts and solutions. For all types of transactions and ledgers, blockchain
    has certain inherent advantages. Since microgrids and smart grids would be highly
    transactive, providing an efficient, well-validated, and safe ledger of these
    transactions would be extremely beneficial. However, while blockchain may make
