  md: 'selection. This level of logistics is often managed by companies and is not
    common to outsource.


    **Logistic service providers.** The logistics service provider can be defined
    as “an external provider who manages, controls, and carries out logistics services
    on behalf of a firm” (Hertz and Alfredsson 2003).


    Logistics service providers are categorized with various nomenclatures in the
    literature concerning the level of services they provide to companies. However,
    the common and popular categorization based on services provided by logistics
    service providers falls within six families. These are called 1PL, 2PL, 3PL, 3PL+/LLP,
    4PL, and 5PL. The detail of each family is provided in brief:


    +   - 1PL- First-party logistics is the term used for companies that have in-sourced
    logistics. The companies have all logistics assets and carry out all logistics
    operations.


    +   - 2PL-Asset-based logistics companies, perform the traditional logistics operations
    such as transportation, material handling, and warehousing.


    +   - 3PL-Third party logistics has progressed from 2PL as logistics service providers
    started to incorporate the traditional logistics operations that were provided
    separately earlier. 3PL logistics providers can also offer value-added operations
    such as inventory management, packaging, assembly, and labeling. In 3PL, the relationship
    between the company and the logistics provider is often defined as a logistics
    association or strategic alliance that is a close relationship between the outsourcing
    company and a logistics provider subjected to a long-term contract (Skjoett-Larsen
    2000). 3PL performs the transportation of customer products, or outsource transport
    to third-party carriers.


    +   - 3PL+, or Lead Logistics Provider (LLP), is similar to the 4PL as both families
    provide the same logistics services. The difference is in having assets as a 3PL+
    provides services with mixed-assets i.e. it performs logistic services by using
    both own and other logistics providers’ assets.


    +   - 4PL or Fourth Party Logistics is developed based on 3PL. 4PL are different
    from aforementioned logistics providers in a way that they only provide business
    services and don’t own any physical assets such as warehouses, trucks, etc. 4PL
    combines resources of various service providers, plan and operate complex operations.
    4PL is more about the supervision and management of logistics services to provide
    an effective and efficient logistics system to the company (Alt and Schmid 2000;
    Delfmann et al. 2002).


    +   - 5PL is a new notion of logistics provider established to work for the e-commerce
