  md: '# RESEARCH FINDINGS


    **QualitativeStudy and Findings.** During the first phase of research, existing
    problems faced by the D-company and employees are studied. Based on the qualitative
    study, the following problems are identified.


    +   1. The transportation cost is not timely provided by the logistics provider.

    +   2. There exist discrepancies in the records and responsibilities of employees.

    +   3. The logistics provider does not update product tracking to both the client
    as well as the company.


    **Transportation cost:** The logistic provider is bounded to timely inform transportation
    costs to the company so that they could be included in the product invoice. However,
    the study shows that the lack of this practice is creating issues and double effort
    is being applied in client communication. In addition, sometimes double invoices
    are being generated. In some sections, this delay is more than a week.


    **Discrepancies:** The study has also revealed other important issues, which are
    discrepancies in transaction records, communication and, knowledge of Operating
    Procedures (OP) between the company and logistics provider. The study also found
    a lack of overview of transportation management by the logistics provider.


    **Tracking information:** The study also found that if a consignment is not sent
    by a standard courier (such as TCS, M&P, FedEx, etc.); the logistic provider doesn’t
    generally provide tracking information to the company as well as the client. This
    issue often causes the customers to contact the company to get tracking information,
    which is the job of the logistics provider, for which the one is being paid. This
    causes the company employees to put extra effort and work double more often.


    **Cost analysis.** The cost analysis is performed to check whether it is economically
    suitable to outsource transportation or not. The cost analysis is performed via
    important cost factors such as implementation cost, transaction cost, personnel
    cost and tariff cost. Each cost factor is obtained separately for insourcing and
    outsourcing. The option with overall high score is preferred and recommended.
    It is worth mentioning that cost analysis score doesn’t reflect the expenses for
