    # Construct validity


    A significant logical idea to assess the validity of a measure to develop a CV.
    CV is the degree to which a test quantifies the idea or develop that it is expected
    to quantify. CV is generally tried by estimating the relationship in appraisals
    got from a few scales. There is no cut-off that characterizes CV (DeVellis, 2003).


    The primary goal of the current study is to analyze structural components, CV
    which includes investigation of interior connections among things or subscales
    speaking to a specific measure, utilizing such factual examinations as correlation,
    exploratory and confirmatory factor analysis, and reliability analysis.


    # Convergent validity


    It is measured by using average variance extracted (AVE). As per Fornell and Larcker
    (1981), AVE should be greater than 0.5 for the convergent validity. Hence, table
    2 represents AVE values for the TF constructs, table 3 represents AVE values for
    the OF constructs and table 4 represents AVE values for the EF constructs. All
    the values are greater than 0.5 which satisfies convergent validity for all the
    constructs.


