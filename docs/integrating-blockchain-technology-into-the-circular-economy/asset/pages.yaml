    # # BLOCKCHAIN TECHNOLOGY AND INDUSTRY 4.0


    # ## Blockchain technology


    The blockchain platform was first conceived in the financial sector in 2009 when
    it was referred to as a peer-to-peer electronic cash system [9]. It began as the
    basis for a completely distributed crypto-currency unit (bitcoin), but currently,
    it is spreading into other fields, including healthcare, banking, agriculture,
    as well as e-commerce. Although concepts for the blockchain were circulating in
    computer science spheres for some time, it was Satoshi Nakamoto, the anonymous
    founder of Bitcoin, who presented the blockchain as we recognize it in the white
    paper for BTC (Xu _et al._, 2019).


    The bitcoin network, also known as blockchain 1.0, launched the 1st generation
    of the technology in 2009. The formation of the first cryptocurrencies occurred
    during this generation. The concept revolved around payment and how it could be
    used to produce cryptocurrency (Casino _et al._, 2019). Blockchain technology
    has been dubbed the “internet of money” since its ability to allow the peer-to-peer
    transaction without depending on the oversight or approval of an intermediary
    such as a state or financial regulator.


    In 2010, smart contracts and financial services for different purposes were implemented
    as the second stage of BCT (Singh _et al._, 2020). Smart contracts were perhaps
    the most significant breakthrough in the second generation brought on by Ethereum
    (Figure 1). This era introduced blockchain architecture using the Ethereum and
    Hyperledger systems. In simple terms, Ethereum suggests that BCT can be used to
    make digital asset management possible without demanding platform ownership. For
    the very first time, Ethereum offers a solution to the internet’s “centralization”
    (which has assisted companies like Google and Facebook) by essentially incorporating
    BCT in their platform.'
