    # RECOMMENDATIONS


    As a recommendation, more measured and narrow attention in terms of app usage
    will ensure that everybody stays connected and focused solely on important activities.
    We also urge business practitioners working remotely not to forget to celebrate
    quality work, particularly when complete. Meanwhile, upon consideration of the
    peer-to-peer relationship, the top priority will be to ensure everyone’s health.
    It becomes quick and easy to lose interest in each other’s safety and welfare
    when we do not see each other every day. Therefore, it is recommended that SCM
    arrange personal five-minute video chats to link with remote workers and screen
    to make sure they can manage the office tasks well and not find any ambiguity
    or roadblocks to deliver the required results. This recommendation has brought
    the positive impact of digital media to the forefront, rather than just web browsing
    or watching videos on YouTube and TikTok.


    # LIMITATIONS


    The importance of social media platforms cannot be denied during the COVID19 era
    of using social media to get the job done remotely. The scope of the following
