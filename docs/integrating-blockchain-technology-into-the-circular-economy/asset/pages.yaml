    # Development of hypothesis


    Technological, Organizational, and Environmental (TOE) was at first presented
    by Tornatzky et al. (1990) to comprehend huge elements affecting latest innovation
    reception in associations. Any technological innovation''s adoption can be expected
    from three different perspectives: technology, environmental, and organization,
    according to this structure (Pal et al., 2021b). TOE is a well-known theory that
    has been extensively applied in various firm-level advanced innovation adoption
    (Baker, 2011). TOE framework had been used in many earlier studies of technology
    adoption (Abed, 2020; Alsetoohy et al., 2019; Clohessy et al., 2019; Cruz-Jesus
    et al., 2019; Ergado et al., 2021; Fosso Wamba et al., 2020; Hiran & Henten, 2020;
    Mahakittikun et al., 2020; Narmetta & Krishnan, 2020; Ngah et al., 2017; Priyadarshinee,
    Raut, Jha, & Gardas, 2017; Priyadarshinee, Raut, Jha, & Kamble, 2017; Ramaswamy,
    2015; Senyo et al., 2016; Skafi et al., 2020; Wong et al., 2020). As described
    by the TOE, technological factors are a company''s on-site and off-site technologies
    involving equipment and processes (Mukherjee et al., 2021b). The characteristics,
    resources, and attributes of an organization are contained in the organizational
    standpoint, while the operational domain and structure are included in the environmental
    perspective (Tornatzky et al., 1990).


    # Technological Factors (TF)


    Complexity (COMP): It means a technology is viewed as quite hard to access and
    utilize is referred to as complexity (Rogers, 2003). It is thought that the higher
    the degree of complexity, the more difficult it is to use any given advancement
    (Verma, 2017). The element looks at how difficult it is to use BD and its related
    techniques. When users decide to implement a technology, they will be worried
    about how difficult it will be to use (Shin, 2016). Since BD is heavily reliant
    on technology for analyzing huge amount of information, it is anticipated that
    its high intricacy will hamper its adoption (Mukherjee & Chittipaka, 2021b).

    **H1**: COMP will have an impact on the adoption of BD.'
