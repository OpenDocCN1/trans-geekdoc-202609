  md: '# RESULTS AND DISCUSSION


    The findings indicate that I4.0 has a beneficial influence on the IGSCP. 1% increase
    in I4.0 resulting in a 0.436 percent improvement in IGSCP. Khan & Qianli (2017)
    have explained that developing countries are still a long way from reaping the
    benefits of GSCM. The commitment of top management to environmental concerns stifles
    companies’ efforts to implement green practices. I4.0 effectively manage the IGSCP
    through real-time data capabilities, integration, and automation and makes the
    environmental audits system more transparent for administrative authority. According
    to Sony (2019), industry 4.0 enables the circulation and distribution of content
    and facilitates the more effective implementation of GSCM activities. Moreover,
    the researcher also suggested companies to utilize I4.0 technologies in producing
    and designing activities. As, it aids in greening all SC activities, especially
    green manufacturing, and green product design. Chiarini et al. (2020) conducted
    a study to analyze the effect of I4.0 on manufacturing strategies in Italian manufacturing
    firms and found that I4.0 enables IGSCP (i.e., green manufacturing). Additionally,
    the researchers also addressed the effect of I4.0 on different GSCM activities,
    using various technologies such as cloud infrastructure (Talatappeh & Lakzi, 2019),
    large data analytics (Yu et al., 2020), and blockchain technology (Kouhizadeh
    & Sarkis, 2020; Khan et al. 2021; khan e al., 2021a). These researchers have affirmed
    that I4.0 facilitates various GSCM practices.


    Table 1. Standardized parameter estimates for structural model


    | Hypothesis | Paths | Standardized estimate | P-value | Results |

    |---|---|---|---|---|

    | H1 | 14.0 —> IGSCP | 0.436** | 0.000 | Supported |

    | H2 | IGSCP —> En. P | 0.215* | 0.021 | Supported |

    | H3 | IGSCP —> Ec. P | 0.643* | 0.047 | Supported |


    Note: ** and * indicate significance at 1% and 5% respectively.

    industry 4.0 (I4.0), internal green supply chain practices (IGSCP), environmental
    performance (En. P) performance, economic performance (Ec.P)


    Whereas the IGSCP has a positive and significant relation with the Ec.P and En.P
    of the organization. Adopting IGSCP improves financial efficiency by 0.643 percent
    and En.P by 0.215 percent. The results of this study is inline with the research
    work of Scur & Barbosa (2017) in which the researcher analyzed the relationship
    between GSCM and firm success in Brazilian home appliance industry and asserted
    that green supply chain practices have a beneficial effect on Ec.P. Moreover,
    Khan and Yu (2020) conducted a study to analyze the impact of GSCM practices on
    sustainability performances in Pakistani’s manufacturing firms and affirmed that
    GSCM practices'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'have a positive and significant effect on Ec.P and En.P. The researchers also
    discussed that green buying, value source mapping, sustainable architecture, biofuel
    usage in logistics activities, and recycling both contribute to improving commodity
    consistency and lowering costs. IGSCP assists firms in improving their Ec.P and
    En.P and process consistency (Baines et al., 2012; Govindan et al., 2015).


    # CONCLUSION AND PRACTICAL IMPLICATIONS


    The contribution of this study is to explore the role of I4.0 in fostering IGSCP
    to boost operational productivity. The cross-sectional data of 185 respondents
    were gathered using a closed-ended questionnaire survey from manufacturing firms
    in Pakistan. CB-SEM technique is used to evaluate the proposed paradigm of I4.0,
    IGSCP, and the organization’s Ec.P and En.P. The model satisfies both internal
    consistency and convergent and discriminant validity. The results show that I4.0
    has a sizable effect on IGSCP. Moreover, IGSCP have a significant impact on organization’s
    En.P and Ec.P.


    The current research provides the following implications. For instance, the findings
    implicate that the adoption of I4.0 could strengthen the IGSCP, and playing a
    pivotal role in achieving sustainable development goals. Particularly, blockchain
    technology facilitates green supply chain activities such as recycling, green
    design, and green manufacturing. Through implementing I4.0 technologies, businesses
    can maintain an open and safe transaction mechanism. It can also assist them in
    increasing their productivity, lower their costs by resource regeneration, contribute
    to societal, fiscal, and environmental sustainability. Supply chain operations
    are susceptible to a lack of reliability, stability, and accuracy, the use of
    I4.0 will resolve these vulnerability. Thus, it is recommended to firms and authorities
    to promote I4.0 technologies in implementing IGSCP to achieve sustainability.


    Finally, following are the limitation of this study: Firstly, the current study
    only focused on IGSCP. Future researchers can test their model by including both
    internal and external GSCM practices. Second, this study is limited to manufacturing
    firms in Pakistan. It is recommended to test the same model in other sectors and
    economies to provide more in depth understanding regarding this model. Third,
    CB-SEM is employed in the current study. Future researchers can employ mathematical
    modeling. Moreover, future researchers can also test the mediating role of IGSCP
    between I4.0 and economic and environmental performance. Lastly, future studies
    can also check the effect of advanced digital technologies on different HR aspects.
    As the adoption of digital technologies help in making HR processes paperless,
    subsequently having less effect on the environment.'
