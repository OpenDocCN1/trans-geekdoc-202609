  md: '# Chapter 1

    Industry 4.0, Internal Green Supply Chain Practices, and the Firm’s Sustainable
    Performance: Evidence From Emerging Economies


    Muhammad Umar

    Universiti Malaysia Terengganu,

    Malaysia


    Mohd Yusoff Yusliza

    Universiti Malaysia Terengganu,

    Malaysia


    Khalid Farooq

    Universiti Malaysia Terengganu,

    Malaysia


    Hafiz Muhammad Zia-ul Haq

    Universiti Malaysia Terengganu,

    Malaysia


    # ABSTRACT


    The aim of the current study is to investigathe the effect of Industry 4.0 on
    internal green supply chain management practices (IGSCP) in the context of emerging
    economies. The cross-sectional data were collected from 185 manufacturing firms
    of Pakistan using a questionnaire, which was analyzed through structural equation
    modelling. In the current era, with the advent of Industry 4.0 technologies, there
    is emphasis on technology in every field. Organizations must acknowledge Industry
    4.0 innovative contributions towards IGSCP and broaden their understanding as
    the literature on Industry 4.0 is still lacking and needs empirical investigation.
    The results indicated that Industry 4.0 has a positive and significant effect
    on IGSCPs. Moreover, the results also demonstrated that IGSCP practices have a
    positive nexus with economic and environmental performance. This research presents
    valuable insight for policymakers, manufacturers, and managers interested in promoting
    GSCM practices for improved economic and environmental sustainability.


    DOI: 10.4018/978-1-7998-7642-7.ch001'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# INTRODUCTION


    The creation and implementation of emerging technologies have emerged as one of
    the most widely discussed subjects in both scholarly and professional circles
    in the modern age of Industry 4.0 (I4.0) (Li et al., 2020). The word “digital
    technology” denotes the number of paradigm and various smart and creative technologies
    that enable networking, collaboration, and automation in I4.0 era (Ivanov et al.,
    2019). I4.0 consists of big data analytics, internet of things (IOT), as well
    as emerging platforms such as blockchain technology and cloud computing (Khan
    et al., 2021; Umar et al., 2021; Khan et al., 2021a). These advanced technologies
    set businesses toward data-based techniques for gathering data through the product
    development cycle, encompassing everything from material to production in a digitally-driven
    manufacturing environment (Tao et al., 2018) and enhancing the vertical and horizontal
    integration (Frank et al., 2019).


    Digital technologies present a combination of threats and opportunities for the
    long-term development of manufacturing sectors. Through the profound mixing of
    intelligent technologies in the automotive industry, a well-organized and digital
    system for product development has emerged which helped out to increase customer
    services and manufacturing efficiency (Neuhofer et al., 2015), and allows successful
    energy redistribution and leverage total capacity (Dubey et al., 2019). In addition,
    emerging technologies can broaden the competitive complexities of corporate economies
    while also putting economic and ecological strains on manufacturers (Kiel et al.,
    2020). Researchers have stated that the effect of emerging technology on sustainable
    efficiency in terms of financial and ecological performance require more attention
    (Li et al., 2020).


    I4.0 is changing the business model rapidly (Bai et al., 2020). Due to crucial
    environmental sustainability aspects in organization performance, scholars focus
    on elaborating sustainability with I4.0 (Li et al., 2020). I4.0 can encourage
    green initiatiatives in supply chain operations and ensure transparency in product
    flow, including the product’s extraction source, whether an environmentally sound
    resource or a renewable green resource, and the quality of the material used (Umar
    et al., 2021). Research on I4.0 with environmental sustainability is still in
    its early stages. Few recent studies have shed light on the intersection of I4.0
    technologies along with eco-friendly performance. For instance, Jabbour et al.
    (2017) also discourse the role of big data analytics and explained that this technology
    facilitates the implementation of circular economy practices. The processes through
    which I4.0 and environmental sustainability in manufacturing firms coexist are
    still unknown.


    Moreover, the evaluation of I4.0 in the SC is an essential aspect for scholars
    (Dalenogare et al., 2018). The insufficient ecological balances of traditional
    production systems are well-known. Conventional manufacturing processes and'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'technologies are responsible for inefficient utilization of resources, global
    warming, environmental damage, and pollution (Bai et al., 2020). I4.0 is altering
    the business models of manufacturing companies. Various emergent communication,
    and intelligence technologies can support manufacturing flexibility, efficiency,
    and productivity (Umar et al., 2021). Overall, accurate rigorous assessment techniques
    and decision support frameworks may aid manufacturing companies in successfully
    implementing and comprehending I4.0 technologies, particularly when making the
    broad economic and environmental implications. These vast implications include
    raising the competitiveness advantage for corporations and countries, along with
    ecological performance (Bai et al., 2020).


    Green supply chain practices (GSCP) aims to help companies in eliminating polluted
    waste and to conserve biodiversity (Khan & Yu 2020; Umar et al., 2021a). Businesses
    can save resources and reduce their environmental footprint by improving their
    energy consumption (Abbasi and Nilsson 2016). According to Badi & Murtagh (2019)
    and Khan et al. (2020c), production organizations integrate environment friendly
    practices in the SC because these practices help firms in sustaining the environmental
    performance and enable firms to achieve competitively, and improve profit margins
    in today’s economic climate. Martel & Klibi (2016) stated Internal Environmental
    Management (IEM) as a critical aspect of GSCM practices, which instills organizations
    toward sustainability dimensions. IEM reflects senior management’s appreciation
    of environmental issues and their approach to green policy implementation (Chin
    et al., 2015). Prior research has discussed the vital role of Iot (Ben-Daya et
    al., 2019; Awan et al., 2021), blockchain (Khan et al., 2021; Khan et al., 2021a);
    big data analytics (Liu et al., 2020) in SC. However, few studies have empirically
    explored how I4.0 influences IGSCP. Keeping in view the above discussion following
    are the key objectives of this study.


    +   - To analyze the impact of industry 4.0 on internal green supply chain practices
    in manufacturing firms of Pakistan.

    +   - To determine the effect of internal green supply chain practices on economic
    and environmental performance.


    The study is organized as follows: Section 2 covers the literature review and
    develops the research hypotheses. Section 3 explains the research methodology.
    Section 4 provides results and discussion in the light of existing body of knowledge.
    In contrast, the last section provides valuable insights for managers and practitioners,
    which could help them strengthen their strategies.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# LITERATURE REVIEW AND HYPOTHESES DEVELOPMENT


    # Industry 4.0 and Internal GSCM Practices


    I4.0 reflects technological revolution that relies on recent mobile technologies
    and service-oriented approaches (Jabbour et al., 2018). I4.0 concepts involve
    horizontal and vertical process convergence enabled by real-time data exchange,
    as well as through agile production process to facilitate customization (Jabbour
    et al., 2018; Thoben et al., 2017). Fundamental elements of I4.0 are the internet
    of things, additive manufacturing, cloud computing (Kang et al., 2016), cyber-physical
    architectures (Drah & Horch, 2014), and blockchain (Khan et al., 2021; Khan et
    al., 2021a).


    I4.0 have the potential to influence the manufacturing process, for instance,
    items could be designed with a unique electronic identity that allows the product’s
    life cycle to be traced (Jabbour et al., 2018). This facilitates the gathering
    of user data, which can help businesses better identify consumer trends, increase
    product customization, and optimize product support aspects such as repair and
    update services (Sharma et al., 2021). Additionally, by using real-time information,
    interactions between machinery, computers, and supply chain tiers allow rapid
    adjustment of output and purchasing order targets (in response to consumer needs
    or maintenance requirements), the monitoring and management of production lines,
    the tracking of deliveries, and the optimization of logistics paths (Ikram & Siddiqui,
    2019).


    GSCP is described as removing or minimizing total externalities from forward and
    reverse operations of supply chain (Rao & Holt, 2005; Zhu et al., 2008). GSCM
    entails incorporating sustainability standards into the supply chain (SC) process,
    intending to mitigate or remove solid waste, lower emissions, conserve resources
    during the product’s life cycle (Chin et al., 2015). The GSCP integrates internal
    and external sustainable activities, including eco-design, green sourcing, internal
    environmental protection, reverse logistics, collaboration with supply chain partners,
    and investment recovery (Zhu et al., 2008). Several scholars asserted that the
    effective introduction of GSCP involves an initial commitment to green supply
    chain activities within the organization (Feng et al., 2018; Rao & Holt, 2005).
    This study uses eco-friendly auditing techniques, green manufacturing, green design,
    and internal environmental management to evaluate IGSCP. I4.0 enables real-time
    monitoring and optimization of all company activities. Real-time production status
    monitoring avoids duplication, conserve resources, and improves efficiency. Thus
    I4.0 technologies are affecting IGSCP by real-time forecasting and self-optimization.


    Based on the above discussion, we develop the following hypothesis: H1: Industry
    4.0 has a positive impact on IGSCP.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Internal GSCM Practices and Environmental Performance


    Through implementation of GSCM activities, the detrimental effect of company processes
    on the ecosystem can be mitigated (Song et al., 2018). Geffen & Rothenberg (2000)
    discovered that adopting ecological design is a critical first move toward greening
    an organization''s whole SC processes. It has been analyzed in Chinese companies
    that a positive correlation exists between green practices and environmental success
    (Hartmann et al., 2015). IGSCP is critical for any organization as it improves
    and enhances ecological performance (Melnyk et al., 2003) by promoting a green
    culture that values resource management and emissions reduction. Businesses incorporate
    sustainability policies into their practices to reduce the environmental footprint
    of their activities. Organizations can hostilely pursue IGSCP initiatives such
    as green labeling, auditing and environmental compliance, internal environmental
    evaluations, and ISO 14001 certification to gain a competitive edge, improve brand
    value, maximize customer satisfaction, and increase management effectiveness (Yu
    et al., 2019; Zhu & Sarkis, 2004).


    H2: IGSCP has a positive effect on environmental performance.


    # Internal GSCM Practices and Economic Performance


    IGSCP allow the elimination of waste from SC processes, resulting in improved
    profitability (Sinha & Anand, 2017). According to Khan et al. (2017), there is
    a connection between long-term business plans and operating efficiency. Their
    findings indicated that environment friendly policies positively correlate with
    a company''s economic well-being. Businesses are incorporating environmentally
    sustainable activities into their processes to increase their profitability (Khan
    and Yu 2020). Lin et al. (2013) stated that eco-friendly products can draw consumers
    willingness to pay an extra amount. Zailani et al. (2012) emphasized on adopting
    GSCM practices for socioeconomic and environmental protection and explained a
    positive relationship between GSCM practices and firm performance.


    Previous research also indicated a favourable association between GSCM practices
    and profitability (Correia et al., 2017; Danish et al., 2019; Khan et al., 2017;
    Umar et al., 2021). Nonetheless, we discovered several contradictory findings
    in many studies. Furthermore, Khan and Yu (2020) conducted a survey on Pakistani''s
    manufacturing firms to assess the effects of green practices on economic efficiency.
    Their results indicated that green practices have a beneficial influence on firm
    financial performance. Thus, on the basis of above discussion, we postulate the
    hypothesis as: H2: IGSCP have a positive effect on firm economic performance'
