  md: '# # 1. INTRODUCTION


    The curiosity with Block chain in the financial industry has resulted in an endless
    number of meetings among Block chain and fintech pioneers. Everyone is investigating
    into several alternatives for this technology. In his key Manor House lecture
    in June 2016, Imprint Carney, the Bank of Britain''s Lead Representative, acknowledged
    the concept. (Carney, 2016), and In June 2016, the Central Bank introduced block
    chain innovation defenders to agents from 90 national banks. (Blade, 2016). Currently,
    block chain innovation seems to have a strong trend. In this section, we discuss
    the financial world''s method can lead in Block chain innovation, the attributes
    of the technology that are being acclaimed as ground-breaking, and the benefits
    that the financial sector seeks to attain by implementing it.


    Since 2015, the financial industry has been captivated with Block chain, resulting
    in the development of RE3CV, a consortium of 70 financial banks. The Linux Foundation,
    in collaboration with IBM and Digital Asset Holding, has recently launched program
    called Hyper Ledger to develop standard Block Chain technologies. Block chain
    technologies are also being explored by the Bank of England in partnership with
    the Big Four (Accounting Firms). All of the world''s largest financial and technology
    institutions (public and private) have collaborated to recognize the potential
    benefits of block chain in the future. Numerous books promoting the transformational
    implications of block chain have emerged from the anticipation but also prospect
    of this technology. The majority of stakeholders are strong believers in block
    chain gains, with only a small number of detractors.


    # ## 1.1 Block chain technology


    The block chain seems to have a set of characteristics which thus make it essential
    for modern financial institutions. The following are the main features that are
    deemed building blocks of modern finance;


    +   1. Immutability

    +   2. Trustlessness

    +   3. Transparency

    +   4. Resilience


    All of the aforementioned characteristics get one commonality: reliability. In
    this section, the scholars explore all these attributes thoroughly to see how
    it might assist in the development of cost - effective global financial framework.'
