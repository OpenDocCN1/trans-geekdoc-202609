  md: '# Preface


    Writing this book provides up-to-date text at a reasonable cost. The scope of
    Blockchain Technology (BCT) has continued to grow in business operations with
    a rapid speed, which is reflected in the content of this book. The book has included
    core aspects of BCT and the application of BCT in business operations.


    # ORGANIZATION OF THE BOOK


    There are 11 chapters in the book. A brief description of each of the chapters
    follows:

    Chapter 1 investigates the effect of Industry 4.0 on internal GSCM practices in
    the context of emerging economies. The cross-sectional data were collected from
    185 manufacturing firms of Pakistan using a questionnaire analyzed through structural
    equation modeling. With the advent of industry 4.0 technologies in the current
    era, there is an emphasis on technology in every field. Organizations must acknowledge
    Industry 4.0 innovative contribution towards Internal GSCP (IGSCP) and broaden
    their understanding of the literature on Industry 4.0 still lacks empirical investigation.

    Chapter 2 studies the adoption of Big Data in the hotels of India, and it is helping
    in improving its performance. For this study, a technological-organizational-environmental
    (TOE) framework is being used. The factors are being identified from the literature
    review. A questionnaire is being prepared for survey-based research in the hotel
    industry. Exploratory factor analysis and structural equation modeling is being
    used for analysis. Three models are being developed for the study.

    Chapter 3 describes the impact of blockchain on existing and novel business prototypes
    while managing operational risk. Consequently, researchers pinpoint five similarities
    that improve our understanding of how Blockchain technology affects the current
    financial structure and creates new business models. This research suggested using
    these findings to ascertain different designs initiated by blockchain and how
    firms can revolutionize their business model. Though there are many favorable
    uses of this new technology, inquiry and established procedures are still embryonic,
    and this means it will take some time before blockchain impacts are felt on a
    larger scale.'
