  md: '# INTRODUCTION


    Outsourcing is the tactical usage of external resources to carry out activities
    that are generally performed by in-house resources (Elmuti 2003). Outsourcing
    is different from collaboration or partnerships in a way that the flow of resources
    is unidirectional, from the provider to the user (Katsanis 2007). In the last
    few decades, an increasing trend has been witnessed in outsourcing among many
    multinational national organizations (Zachariaisz 2010). It is gradually becoming
    common practice for organizations to outsource some of their jobs to concentrate
    on their core or primary professional activities. Firms are outsourcing everything
    from logistics management to entire functions such as human resources (Katsanis
    2007).


    Logistics is comprised of two discrete but joined operations; material management
    and product distribution. Material management includes all operations related
    to the parts’ production and finished product, whereas product distribution refers
    to the steps involved in providing these parts and finished products to the consumer.
    The later operation involves the transportation and warehousing of products (Rodrigue
    2014). Transportation management refers to the aspect of logistics, which deals
    with the physical distribution of goods or products to the customer. It involves
    the observation of the operation and the communication with carriers, which accomplish
    the transportation of the goods or products from the warehouses, and additionally
    selection of carriers according to different locations. Many organizations have
    started to uptake the concept of transport management outsourcing, but some organizations
    are in doubt after undertaking the path of outsourcing transport operations. This
    is because due to some market factors such as competitiveness, increased cost,
    and uncertainty present in Pakistan''s economy.


    The paper aims to evaluate the outsourcing of transportation management of an
    online shopping company, which we will name D-Company due to company confidentiality.
    The D-Company is making significant progress in the online shopping domain of
    the Pakistani market and provides a variety of products ranging from groceries
    to toys, furniture, electronics items, etc. to customers'' doorstep. When the
    company was established, the company was not able to run its transport department;
    therefore transportation management is outsourced from the beginning. Later on,
    with an increase of customers and their demands, the company opened offices in
    all districts of Pakistan but the outsourcing decision remained unchanged. However,
    the logistic provider further assigned transportation operations to different
