- pgno: 212
  md: '# 7. CONCLUSION


    The growing level of consumer preferences, the increasing prevalence of technological
    innovations, and the implementation of the digital transformation continually
    escalate the degree of dynamism and complexity in the supply chain. Effective
    decision-making in uncertain circumstances is needed to manage these dynamics.
    Big data analytics is a relevant issue in a variety of disciplines, including
    SCM. Applying appropriate analytic methods in this area provides many possibilities
    for growth; thus, growing information demands, many SCM applications (BDA included)
    offer great potential. This chapter provides a broad introduction to the fundamental
    ideas and modern big data analytics methods within the supply chain. There are
    various BDA uses at different supply chain stages and many consequences across
    the supply chain. BDA technology applications have contributed to many supply
    chain improvements. Firms increasingly use BDA tools in developed nations to increase
    company performance, cut manufacturing time, and avoid incurring risks.


    Moreover, BDA may be effective in helping to build and enhance a reactive and
    reliable SC. SC’s colossal complexity requires an excellent information management
    strategy and a system like BDA. To carry out this goal, however, companies must
    build skills to use BDA effectively. BDA implementation is a necessity if a company
    wants to get supply chain performance using technology. However, the implementation
    of BDA in manufacturing supply chains presents difficulties for manufacturers.
    One of the significant challenges for the supply chain in the modern age is having
    adequate analytic skills. To realize this, a multidisciplinary approach that integrates
    SC entities is required, along with the ability to share and retrieve essential
    data across the SC. The five V’s of big data enable supply chain managers to make
    better decisions as real-time data is available for decision-making. The tools
    now available due to the technology are allowing companies to increase their operational
    and financial performance. Due to operating efficiencies, the overall cost of
    business operations has been reduced. Big data as a technology satisfies customer
    satisfaction and enhances its overall experience as companies now know their customers
    better.


