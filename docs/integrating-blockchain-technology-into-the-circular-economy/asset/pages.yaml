    # Industry 4.0


    Industry 4.0 also known as smart manufacturing or Industrial IoT (IIoT), is the
    current state which encompasses the 4th industrial revolution that employs the
    Internet of Things (IoT) as well as other technologies to digitally boost manufacturing
    lines and transform them into “smart” lines (Thames et al., 2017). In industry
    4.0, improved performance in the manufacturing process is optimized through real-time
    huge data analysis which results in almost real-time autonomous decision making.


    In the 3rd industrial revolution, companies started to integrate Information and
    Communication Technologies (ICTs) in their industry through the advancement of
    industrial computers, workstations, sensors, automation, and the Internet in'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'manufacturing plants. Unlike past revolutions, the primary idea of Industry
    4.0 is not fueled by a particular technology. Industry 4.0 features the interconnection
    of multiple technologies present in the industrial world, allowing for data collection,
    analysis of big industrial data, and making the right decisions based on the information
    collected from the industrial processes.


    # Cyber-Physical System (CPS)


    Cyber-physical system (CPS) is a crucial component in the application of Industry
    4.0. CPS refers to an Industry 4.0-enabled manufacturing system that allows real-time
    information collection, analysis, and visibility in all aspects of the manufacturing
    process. With CPS, means of production becomes networked and able to ‘share information,’
    allowing for new production processes, value creation, and real-time adjustments
    (Dafflon & Moalla, 2021). CPS offers integration of various systems of diverse
    natures with the primary goal of controlling a physical process and adapting to
    new circumstances in real-time through feedback (Mosterman & Zander, 2016. Equipped
    with computing capability, control modules, sensors, and actuators, CPS can be
    IP address-assigned entity that self-monitor, generate information about its activity,
    and communicate with other related entities or even the outside world.


    CPS allows both computational and communication technologies to be integrated
    into a wide range of physical structures. CPS is centered on a large computational
    capacity and certain characteristics that grant freedom to make decisions based
    on the integration of disruptive technology and acquired data from the surrounding
    in which it is incorporated. As a result, extreme integration between the physical
    and digital worlds is feasible, for example, sensors or machinery can send data
    to the CPS, which then takes action based on its database of information. Besides
    that, CPS is the potential for breaking down the industrial hierarchical levels,
    facilitating the so-called horizontal and vertical integration of the industrial
    world, allowing any computer at any industrial scale to communicate and interoperate
    with just another device from every other place. With this, data from different
    industrial processes can be integrated and used by any other party in the industrial
    chain.


    # RESEARCH METHODOLOGY


    The modified e-Delphi method was used in this study (Meshkat et al., 2014). The
    Delphi method is an iterative process that employs a series of data collection
    and analysis techniques in response to expert decisions at regular intervals (Donohoe
    et al., 2012). The Delphi method is a method for gaining individual consensus
    on issues where there is little to no conclusive proof and where consensus is
    relevant. The'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'traditional Delphi method intends to elicit group opinion through an anonymized,
    multi-level group interaction, with several rounds monitored by a mediator to
    find agreement (Zheng et al., 2018). The anonymity factor prevents issues arising
    from influential experts, community influence, and status, which are often more
    noticeable in the hierarchy of professionals.


    The electronic Delphi (e-Delphi) technique utilize online tools. Researchers may
    use this approach to develop expert consensus using the World Wide Web’s tools
    for simplicity, ease of use, and intensity of the discussion. The internet research
    tools used in this analysis were Google Drive and Gmail. The number of “rounds”
    or iterations is generally decided upon at the start of the analysis and varies
    from 2 to 4. As shown in Figure 3, there were 3 rounds of information and consensus
    building in this study.


