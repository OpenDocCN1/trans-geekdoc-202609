    # DISCUSSION


    The proposed model is based on TOE frameworks, consisting of three technological,
    organizational, and environmental constructs. The aftereffects of this investigation
    are partially upheld by related writing (Park et al., 2015; Verma et al., 2017).
    BD had been adopted in many industries to improve the firm performance and to
    achieve organizational excellence (Al-Dmour et al., 2021; Aversa et al., 2021;
    Diniz et al., 2018; Ghasemaghaei, 2021; Nasrollahi et al., 2020; Park et al.,
    2015b; Shahbaz et al., 2019; Verma, 2017; Verma et al., 2018; Yadegaridehkordi
    et al., 2018, 2020).


    Technological Factors (TF): TF helps identify the technological factors that can
    impact the adoption of any technological innovations. The Cronbach’s alpha and
    composite reliability values for the construct TF were above 0.7, which is the
    recommended level (Nunnally 1978; Hair et al. 2010) for the four factors. The
    KMO value of the construct is 0.808, which is also above the recommended level
    of 0.6 (Hair et al. 2010), which allows the data for factor analysis. The total
    variance explained was 67.931%, and in the rotated component matrix, the variables
    were grouped under four groups. Only the loadings which are above .|.40| are considered
    in this research because those are considered to be typically high and hence are
    more significant (Hair et al. 2010).


