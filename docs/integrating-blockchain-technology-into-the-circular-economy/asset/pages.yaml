  md: '# Chapter 7


    # Pitfalls and Challenges

    of Blockchain in Supply

    Chain and Logistics


    Asad Ullah

    Middle East College, Oman


    Asad Ullah

    Middle East College, Oman


    Shahid Imran

    Middle East College, Oman


    # ABSTRACT


    The potential impact of block chain on supply chain management has been explored
    by many authors, and indeed, many articles in the popular press extol the benefits
    of blockchain in supply chain management. In simple terms, blockchain is a distributed
    ledger system, or a record book, except that it is not maintained by a single
    person but by anyone who is interested in keeping the records. Since blockchain
    is a new and revolutionary concept in technology, more techies are interested
    in it. However, it also has certain disadvantages. The purpose of this study is
    to explain the challenges and pitfalls of blockchain in supply chain and logistics.
    Using a systematic literature review method, this chapter identifies 31 publications
    that discuss the challenges and pitfalls associated with blockchain in supply
    chain and logistics.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 1.0 INTRODUCTION


    Block chain is a decentralized, distributed database that maintains a continuously
    growing list of secure data records. It first emerged in the context of Bitcoin,
    where it serves as a decentralized, distributed digital ledger recording all Bitcoin
    transactions. Bitcoin is a currency that is controlled by the network of users
    instead of by centralized banks. The following quote from Jay (2017), expresses
    the concept of block chain in a simple description:


    > "Imagine a piece of paper with a name printed on it, and that name rights a
    person to a pot of wealth. You place it in a room with 50 doors, each of which
    has a lock. However, someone could break one of the locks and change the name
    on the sheet of paper. This is the same as a centralized database. Block chain,
    on the other hand, will duplicate that paper 50 times and put it in 50 different
    room. In this setting, if someone wants to break the system and change the name
    on the papers needs to break [at least 25] rooms at the same time."


    Thus, the data saved in a block chain cannot be deleted or edited by unauthorized
    individuals given that several copies are maintained in a decentralized network,
    which is a key distinction as compared with a regular centralized network. In
    a centralized database, there is always the risk of fraud or external hacker attacks,
    whereas in a block chain, unless an attacker manages to take control of the majority
    of the network, the network will work consistently. Blockchain is visualized as
    a system to reduce the probability of fraudelent transactions significantly by
    virtue of distributed maintenance of transactions and capturing of provenance
    data on every transaction agent and event executing an updated or modified transaction
    (Khairuddin, 2019; Siddiqui et al., 2020; Sigwart et al., 2020). Block chain supports
    secured trading on the Internet by capturing the identity and provenance data
    during each transactional event. It facilitates backward traceability of trust
    mechanisms and authorizations used by certifying authorities in executing each
    step forward historically till the current state of a contract visible to the
    interested parties. Simply stated, secure trading on the Internet through controlled
    trust establishment and verification is feasible. This attribute facilitates removal
    of mediating third-parties ensuring security of a contract (Benning, 2016). Tian
    (2016) states: “Since the whole system is running transparently, the system is
    absolutely open source and there is no need for trust among every single node
    because a single node cannot cheat all other nodes on the block chain”.


    Block chain is also known as the “Internet of Value”, and its proponents believe
    it has the potential to disrupt nearly every business (Tapscott and Tapscott,
    2016). While block chain is being used in a variety of industries, such as fine
    art, luxury goods,'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'pharmaceuticals, medical devices, and jewelry, for anti-counterfeiting and
    tracking, as well as import/export, real estate, and design and architecture for
    record-keeping, many recent researchers believe that block chain has the potential
    to revolutionize supply chain management (Esmaeilian et al., 2020; Copigneaux
    et al., 2020). One may consider that adopting Bitcoin''s block chain design can
    eliminate the necessity for banks in the supply chain at least in theory. This
    may allow anyone to trade directly through the Internet. One could trade directly
    with unknown persons while being anonymous via the block chain. With this view
    in mind, block chain is being heralded as the next big thing in supply chain circles.
    The $40 trillion global supply chain sector might become an intriguing future
    use case for block chain (Parker, 2016). The challenges of adopting block chain
    in supply chains are the topic of this research (which we call block chain-enabled
    supply chain).


    # 1.1 Preliminaries


    Several authors have looked into the possible impact of block chain on supply
    chain management, and numerous pieces in the popular press extol the benefits
    of block chain in the short term. Jeremy Wilson, vice-chairman of Barclays Corporate
    Banking, for example, believes that block chain can cut supply chain paper work
    significantly. He brings up the first ever block chain-based trade financing agreement.
    The time it takes from the time the letter of credit is issued to the time it
    is approved is normally between seven and ten days, which might be achievable
    in as less as four hours using block chain ledgers (Lehmacher, 2017). Import,
    export, and port documentation all have the potential to reduce lead times in
    global supply chains. According to Hofmann et al., (2018), employing block chain
    in supply chain finance could speed up operations and reduce total financing expenses.
    For example, blockchain might make payment insurance simpler by minimizing the
    need for letters of credit and so lowering transaction fees, enhancing speed and
    transparency, and so on. Some specific products are reasonably easy to identify,
    while certain products are very difficult to identify and reproduce. In these
    cases, proving provenance of things being exchanged is critical where block chain
    can capture and provide transparent, secure, non-editable, and non-deletable provenance
    data that can benefit all stakeholders in the supply chain (Khairuddin, 2019;
    Siddiqui et al., 2020; Sigwart et al., 2020).


    While the potential for these impacts and applications to lower costs and speed
    up supply chain chores should not be overlooked, they are far from revolutionary
    improvements to present supply chain operations (Alkhudary, Brusset, Fenies, 2020;
    Allen et al., 2019; Veisi, 2019). However, much of the discussion of block chain''s
    impact on supply chain management is more forward-looking, concentrating on hypothetical
    future supply chains rather than how block chain might impact supply chains today.
    In their book, Block chain Revolution, Tapscott and Tapscott'
