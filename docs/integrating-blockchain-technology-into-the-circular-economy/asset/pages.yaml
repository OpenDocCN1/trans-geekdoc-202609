    better development space for new logistics enterprises, resulting in a self-circulation
    of the logistics industry. Outward development options are severely limited, making
    it difficult for small and medium-sized logistics firms to stand apart. As a result,
    applying blockchain technology to the logistics industry can help the industry
    improve its current state, provide small and medium-sized logistics companies
    and new logistics companies with good corporate development advantages, and expand'
