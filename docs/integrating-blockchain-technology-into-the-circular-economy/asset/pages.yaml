    # 1.2 Methodology


    This section presents a description of the research process followed in this research
    and how the data was collected to identify papers relevant for this study. As
    the first step the research questions addressed by this study are:

    RQ1. What are the key concepts of blockchain technology?

    RQ2. What are the possible applications of blockchain technology for Supply chain
    and logistics?

    RQ3. What are the challenges in using blockchain technology in Supply chain and
    Logistics?


    The followed steps were followed to define the inclusion/exclusion criteria:


    +   1. Exclusion of papers having availability of only abstracts;

    +   2. Considering only papers written in English language;

    +   3. Including papers published for WTO and UN;

    +   4. Papers published in reputed journals and master and PHD published theses
    on websites of global universities;


    For the next step, data collection, the keywords used were defined as: Block Chain;
    Technology; Pitfalls; Challenges; Supply Chain and Logistics. They were used to
    run semantic searches in online journals databases and scholarly databases and
    also Google Scholar. The keywords should be found in the paper title, paper keywords
    and/or paper abstracts. Then the papers were read to assess their relevance and
    contribution to the present study, and as a final step the discussion of the findings
    for the future work.


    # 2.0 LITERATURE REVIEW


    # 2.1 What is Block chain?


    Bitcoin’s underlying technology, the original concept of blockchain, is a type
    of Distributed Ledger Technology defined as a “distributed, shared, encrypted
    database that acts as an irreversible and incorruptible store of information”
    (Wright, 2015). It is constantly growing by adding new blocks to the chain every
    10 minutes. It is done by data miners to keep track of the most recent transactions.
    The blockchain'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'contains all blocks in chronological sequence. When a data miner joins the
    Bitcoin network, a copy of the updated blockchain is automatically downloaded
    to each node. The blockchain contains all information about all transactions that
    have ever been completed (Swan, 2015). The information of transactional exchanges
    and bitcoin ownership once committed in the bitcoin blockchain became permanent
    records impossible to edit or delete. The network and database of blockchain is
    safe and easy to use. The bitcoin blockchain can create transactions based on
    mathematically specified and mechanically enforced criteria (DTCC, 2016). The
    important point is that because of its many elements, including technological,
    operational, legal, and regulatory, blockchain does not have a single definition.
    As blockchain can permit both instant and long-term economic transactions, and
    more intricate financial contracts, one way to grasp it is to compare it to the
    new application layer for Internet protocols. It can be used as a layer for asset,
    currency, and financial contract transactions. Furthermore, block chain could
    be used to manage a registry and inventory system for recording, tracking, monitoring,
    and transacting all assets. As a result, Block chain can be applied to any type
    of asset, including finance, economics, and money (Swan, 2015).


    # 2.2 Technical concepts


    To comprehend the implications of the various architectures in terms of regulation,
    security, performance, and privacy, it is necessary to explore the technical ideas
    of blockchain. There are several distinct blockchain-based technologies that have
    been developed to solve various problems. As a result, different blockchain-type
    technologies are more or less available for particular needs (Kakavand et al.,
    2016). Blockchain is a tamper- and revision-proof digital platform that stores
    the whole history of all transactions between block users across the network.
    Blockchain is also a database for digital currency transactions, such as those
    on the Bitcoin and Ethereum networks.


    Cryptographic algorithms check all transactions between users or counter-parties,
    which are subsequently bundled into blocks and added to the Block chain (Copigneaux
    et al., 2020; Ganne, 2018; Kakavand et al., 2016). As the information in blocks
    is stored on several nodes and is linked together, no one can change it. Every
    node in the Bitcoin network has its own copy of the Block chain, which is synchronized
    with other nodes using a peer-to-peer protocol. This reveals the futility of a
    central authority and, as a result, participants lose faith in the integrity of
    any one entity. Without the use of third parties, block chain allows diverse transactions
    to be processed and secure consensus to be reached. According to Drescher (2017),
    Kakavand et al. (2016), and Swan (2015), the following are the fundamental technical
    concepts of block chain technology.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '+   (a) Node: A peer, also known as a node, is a computer that maintains the
    “blocks” using the standard blockchain software.


    +   (b) Network: The blockchain network connects all nodes, allowing them to receive
    and send transactions. It is the system of all nodes running the common blockchain
    software cooperating to communicate with one another.


    +   (c) Smart contracts: These are contracts transformed into codes maintained
    and stored by the parties signing the contracts. They comprise the following steps:

    +   i. Transaction submission: When users send transactions to the network, they
    are sent to the nearest accessible nodes. The transactions are then replicated
    to the other nodes.

    +   ii. Validation of transactions: The Block chain network’s nodes cryptographically
    validate all transactions using exchange of keys. Invalid transactions are rejected.

    +   iii. Formation of a block: It is a collection of transactions gathered by
    nodes into a single bundle. Blocks must be formed according to a set of rules
    in order to be valid. They must not be larger than a certain number of bytes,
    they should include a certain number of transactions, and should relate to the
    most recent valid block.

    +   iv. Formation of the blockchain as a type of digital ledger: It is a series
    of blocks ordered according to a defined system. The new blocks added are connected
    to the most recent valid blockchain.

    +   v. Consensus generation: It’s a consensus reached by all nodes in the blockchain.
    Multiple processes collaborate with one another to enable distributed system operation.
    Because faults can arise anywhere in such systems, consensus techniques are used.


    +   (d) Hash function: It is a function that identifies a data block based on
    its unique digital fingerprint. It’s a one-way function that converts a variable-size
    input to a fixed-size output termed hash. A cryptographic hash function has the
    following properties:

    +   i. It is easy to get the hash given the input;

    +   ii. It is impossible to generate the original input given the hash, and

    +    iii. It is practically impossible for two comparable inputs to have the same
    result in a so-called “collision.”

    +    iv. Cryptographic hash SHA256 is an example of a hash function.


    # 2.3 Permission-Driven and Permission-less Block Chains


    Anyone can access a distributed ledger, like the Bitcoin, and connect with anyone
    else to buy or sell Bitcoins (Drescher, 2017; Swan, 2015). Further, anyone can
    read or write to such ledgers as long as they are entering a transactional agreement.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'All agreements and Bitcoin exchanges are executed anonymously. Hence, Bitcoin
    block chains are essentially permission-less. Nonetheless, there are a variety
    of situations in which the transacting parties may like to keep all transaction
    details secret, such as several financial transactions, the exchange of medical
    records, or the conveyance of commodities (Kakavand et al., 2016). Such block
    chains are essentially permission-driven. Given their suitability and relevance
    for a wide range of business applications, permission-driven or private block
    chains will likely be in high demand in the future. The use of private block chains
    allows for the determination of any network participant’s access rights and accessibility
    while keeping their information private (Swan, 2015). New members are invited
    to join the network by the existing members. There are several types of invitations
    driven by algorithms, such as unanimous agreement, single user invitations, and
    core group acceptance of a pre-determined set of parameters (Kakavand *et al.*,
    2016).


    # 2.3 Metrics


    As block chain technology advances a range of new database systems and distributed
    protocols have emerged. All of these technologies are relevant to a wide range
    of sectors, necessitating standardization (Copigneaux *et al.*, 2020). The fundamental
    goal of standardized technology development should be to improve block chains
    by addressing their scalability and throughput capacity, as well as ensuring their
    security, performance, and durability. Various forms of distributed ledger technology
    with differing degrees of decentralization cover these domains (Crosby *et al.*,
    2016). A block chain node keeps track of the network’s present and historical
    status. On both a qualitative and quantitative level, the metrics described below
    can be used to evaluate the performance of the block chain architecture (Drescher,
    2017; Kakavand *et al.*, 2016; Swan, 2015):


    +   (a) Submission throughput: The maximum number of transaction submissions per
    second that each node and the entire network can handle is called submission throughput.


    +   (b) Validation Throughput (Maximum/Average): This is the parameter that determines
    the network’s maximum/average transaction processing speed.


    +   (c) Validation of Transactions on the Average Latency: It is the average time
    taken for a transaction to be validated from the time it is submitted. This metric
    measures how long users have to wait for their transactions to be validated and
    placed in a block. It’s crucial to note that each block chain’s block confirmation
    and definition of validation may differ.


    +   (d) Latency Volatility: It is a term used to describe how volatile a blockchain
    system is.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '(e) Security: A threat model is needed to evaluate the security system since
    it may specify the types and breadth of adversaries and attacks on the system.
    In any Block chain application, such threat models could be distinct. The following
    analyses are necessary for the security evaluation:


    +   i. Transaction and block immutability

    +   ii. Resistance to transaction censorship

    +   iii. Resistant to Denial of Service

    +   iv. Users and oracles must have faith in one other.

    +   v. Services for protocol governance and node membership


    (f) Confidentiality: It refers to a node’s capacity to keep the contents of a
    transaction and the identity of the participants in the transaction hidden from
    other nodes.


    (g) Fees for transactions: Users must pay a fee to the network in order to perform
    transactions or execute smart contracts. These fees cover the cost of maintaining
    the block chain as well as providing protection from malicious computational processes.


    (h) Hardware:


    +   i. Memory/storage: It is the total amount of memory/storage required per node.

    +   ii. Processor: This refers to the amount of computing power needed to validate
    transactions and blocks.

    +   iii. Network utilization: This is the usage of network resources over time;

    +   iv. Network growth: The hardware requirements of each node will increase as
    the network grows enabling additional requirements for throughput, bandwidth,
    latency, and storage;


    (i) Scalability:


    +   i. Number of nodes: increase in number of nodes requires auto scalability
    of resources;

    +   ii. Transaction volume: when the number of transactions submitted per second
    increases, the system’s performance changes;

    +   iii. Number of users: when the number of active users making transactions
    grows, the system’s performance changes;

    +   iv. Geographic dispersion: when the geographic dispersion of nodes increases,
    system performance changes;


    (j) Validation process: This is a crucial component to consider when determining
    the network’s performance because complex validation processes will require dedicated
    authority and certifying nodes or entire clouds;


    (k) Complexity: It is a measure of the difficulty of developing, maintaining,
    and operating the blockchain infrastructure.'
