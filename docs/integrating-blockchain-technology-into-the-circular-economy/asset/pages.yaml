- pgno: 169
  md: '# EMERGING ISSUES


    Although the industry faces some of the issues such as supply chain management
    and automotive safety concerns, new challenges are evolving as the technology
    is advancing and to support industry 4.0. In this section, the author presents
    the emerging issues that arouse in employing blockchain technology in industry
    4.0. This section discusses emerging issues that have been identified as a result
    of the research conducted for this chapter.


    # Issues in Smart contract


    Since smart contracts and distributed ledgers are still in their early growth
    stage, there are several challenges to consider in addition to the benefits. First
    is the issue of compatibility. Industries should determine if their current technology
    is compatible with the technology needed to implement a smart contract. For instance,
    is freight forwarders’ existing shipment tracking equipment capable of digitally
    interacting with the smart contract code without human intervention? Or does it
    necessitate any human involvement? Moreover, computer coding is used to create
    smart contracts. This is specialized expertise that few companies would have on
    staff. Hence, industries need to hire programmers to code and manage smart contracts
    compared to traditional contracts where only attorneys were hired.


    Additionally, there are some restrictions on what a smart contract can do. Smart
    contracts are often referred to as “unalterable.” That is, when the smart contract
    has been incorporated into the distribution ledger, what’s been coded cannot be
    modified. As a result, if the parties change their minds at a later time, the
    smart contract cannot be changed to reflect the new conditions. As previously
    mentioned, the code operates on an “if y, then x” basis. As a consequence, if
    the parties’ agreement allows for a price change to be resolved at a future date,
    this cannot be coded into the smart contract. The smart contract will be unable
    to carry out an instruction such as “if y, then the parties will agree on a price
    variation collectively.”


    # BCT interoperability


    The resurgence of interest in blockchains has sparked a slew of research and development
    projects. As a result, today’s blockchain ecosystem is extremely diverse, with
    users having access to a variety of incompatible BCTs. Since interoperability
    between BCTs is rarely planned in current protocols and standards, functions such
    as transmitting tokens from one party to another or triggering and implementing
    smart contracts are limited to a single blockchain (Schulte et al., 2019).'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'When developing a blockchain, developers often neglect standards to achieve
    more flexibility, but this often led to interoperability and communication issues.
    Various blockchain networks with various criteria such as consensus models, smart
    contract features, and transaction mechanisms are the most emerging challenge
    to interoperability (Ermyas et al., 2019). Making two separate blockchains interoperable,
    that is, allowing one to send data from one blockchain to another, may be of interest.
    A few standardization projects are underway to resolve this issue. For instance,
    IBM and Microsoft are relying on an existing GS1 standard to establish an interoperable
    blockchain (Bajwa et al., 2019). In certain cases, such as “atomic exchanges”
    and hash-locking, the problem of interoperability is addressed by using game theory
    (Dai et al., 2020).


    # BCT-Based Digital Twin


    Using their education, experience, and skills in data science, statistics and
    mathematics, computer algorithms, and other fields, tech experts begin creating
    groundbreaking BCT-based digital twins. Via actionable insights generated by digital
    twins, future product models are initiated, and production process is continually
    studied and refined. By building a digital twin on the blockchain, all details
    about a physical product can be stored in an immutable manner. Digital twins help
    industries by improving their production and productivity, but they also raise
    ethical, legal, and social concerns. Consider a situation in which hundreds of
    robots and people collaborate, each with their own digital twin. What happens
    if the industrial robot collapses and has to be substituted? Will the replaced
    digital twin be able to learn from the experience of the former robot? If human
    workers will quit, pass away, or simply switch careers. What would occur to the
    digital twin in such a situation? Will such a digital twin continue to be the
    industry’s asset? Is it possible for the industry to train new employees using
    their digital twin?


    # Industrial robots and Connected Autonomous Vehicle (CAVs)


    Since BCT enables automated industrial robots and vehicles to communicate with
    other parties via smart contracts, blockchain is significant in this field. As
    a result, blockchain-based robots and vehicles will work together and transact
    business with one another and with third parties in a fully autonomous manner.
    There have been concerns regarding the potential for connected vehicles to be
    hacked. This challenge could be resolved by employing BCT. BCT provides natural
    protection which makes it virtually impossible for malicious actors to hack because
    it is not easy to access or modify data in a block after it has been stored and
    a degree of encryption is applied to each transaction. This encryption, though,
    isn’t without disadvantages.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'Since processing time is a major bottleneck in practical uses, careful consideration
    is needed. To synchronize data copies that are shared by multiple AVs, the Blockchain
    algorithm necessitates a significant CPU processing power and resources. However,
    CAVs lack the computing power to manage such a challenging computing task, hence
    reducing throughput and increasing latency in the CAV system. Due to BCT complexity,
    it is still argued whether it will be effective or not in an environment where
    autonomous cars need to communicate with networks in microseconds.


    Business transactions legally are to be performed among physical persons or legal
    entities such as companies or organizations. CAV are neither natural beings nor
    legal entities in the eyes of the law which pose a new challenge.


    # Ethical and Legal Issues


    The ethical implications of BTC have yet to be identified, unlike other fields
    of tech ethics. Building the area of blockchain ethics is challenging. People,
    businesses, and devices are all considering using blockchain to store their digital
    identities. The underlying transparency and immutability of blockchain is a truly
    distinctive value proposition. However, when it comes to handling confidential
    identity data, these very strengths can be disadvantageous. There are some legal
    issues to consider. For instance, is it appropriate to give the general public
    access to classified information? What if this information leads to people being
    victimized? Is it possible for data miners or validators to exploit the information?
    Furthermore, some countries forbid the collection of confidential data outside
    of their borders. Blockchain is a global ecosystem of participants from all over
    the world. How do we guarantee that the knowledge does not cross a particular
    jurisdiction? People may request that businesses remove their personal information
    under data privacy laws. How will Blockchain-based businesses react to this request?
    While smart contracts automate processes, they are written by humans. When humans
    are involved, the mechanism is contaminated with prejudice. The challenge is,
    how do we infuse ethics with anti-bias characteristics and lead to an ethical
    blockchain?


    Another thing to note is how the parties will be able to rewrite the smart contract
    if the law changes and made the commitments coded illegal. Smart contracts can
    pose issues about their lawfulness, validity, and governing law status. Besides
    that, smart contracts can effectively remove some legal options, such as the right
    to halt the execution of contract agreements or cancel the contract.


    # Security issues


    Storing the same data through several systems protects the data from attacks.
    There is no single point of failure for blockchains, and they cannot be modified
    by a single'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'device. However, on the other hand, hackers now have many likely targets. How
    do we keep these systems secure all over the world? State-of-the-art encryption
    techniques can be used to encrypt the data stored. To access any instance of a
    blockchain and modify them together at the same time, lots and lots of computational
    power will be needed and more than 51% hashrate. Nevertheless, post-quantum cryptography
    and other futuristic approaches can be used. To avoid a 51 percent attack, hashrate
    should be increased, and the Proof-of-Work (PoW) consensus process should be avoided.


    Another security issue is Cryptojacking. Cryptojackers are people who want to
    take advantage of the benefits of cryptocurrency mining without having to incur
    the high costs of hardware or huge energy bills. Cryptojacking codes, unlike other
    forms of malware, do not harm machines or the data of their targets. They do,
    nevertheless, take computer processing power. Industries with a large number of
    cryptojacked systems can incur significant expenses of customer support and IT
    effort wasted tracing down performance problems and replacing hardware or systems
    in the hopes of resolving the problem.


    # CONCLUSION


    Blockchain’s implementation and usage have long outgrown its original intent as
    the foundation of the world’s first decentralized cryptocurrency. Other industries
    have recognized the importance of a trustless, decentralized ledger with historical
    immutability, and are looking to adopt the key principles to their current business
    processes. Existing major technology firms are investing in this technology, and
    numerous attempts are being made to build publicly open-sourced platforms. These
    activities demonstrate the promise of blockchain technology and its convergence
    with Industry 4.0.


    Even though both Industry 4.0 and Blockchain technology has strong prospective
    future, both trends are still too immature to be applied on a wide scale in a
    real-world setting. In a progressively commoditized and global environment, manufacturers
    and technology professionals must collaborate to find out how blockchain can rejuvenate
    factories. A new way of rate over the Delphi rounds is a shortcoming. This is
    believed to be due to respondents losing interest as they are asked to rate the
    very same issues several times. Despite the decrease in response rates, the final
    results revealed a variety of aspects where consensus was reached.'
