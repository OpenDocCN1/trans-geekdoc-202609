- pgno: 180
  md: '**Cyber-Physical System:** CPS monitors physical components with computer-based
    algorithms connected to internet, using a mixture of computers, sensory sensors,
    embedded cognitive computing, and multiple communications mechanisms.

    **Digital Twin:** A digital versions of physical objects.

    **Industry 4.0:** The use of new smart technology to advance automation of conventional
    manufacturing and industrial practices.

    **Logistics 4.0:** A term coined to describe the application of Industry 4.0 technologies
    in logistics domain.

    **Microgrid:** A decentralized network of electricity generating units that is
    usually connected to and synchronous with the conventional wide-area synchronous
    grid, but that can also detach to “island mode” and run independently.

    **Quality 4.0:** Under the framework of Industry 4.0, a concept that refers to
    the future of quality and organization performance.

    **Smart Contract:** A code that runs on the blockchain network and defines certain
    criteria that all parties must enforce.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Chapter 10


    # Supply Chain Management Professional Use Technologies (SM) During the Pandemic
    to Accomplish Tasks


    Muhammad Tanveer

    Prince Sultan University, Saudi Arabia


    Abdul-Rahim Ahmad

    Karachi School of Business and Leadership, Pakistan


    # ABSTRACT


    Syndrome-coronavirus-2 (SARS-CoV-2), commonly referred to as the COVID-19 pandemic,
    has caused people to spend more time online. The pandemic has spurred growth in
    the use of social media technologies. Organizations now train employees to use
    digital media to coordinate work and connect to fulfill the requirement of supply
    chain management (SCM). The study aims to produce effective discussion regarding
    the importance of SCM and technologies and how it can assist in the recent times
    of COVID-19 regarding job performance. Research predicts the new ways of business
    conducted and how communication and coordination, knowledge exchange, training,
    and development are helpful in carrying out effective job productivity at the
    workplace of SCM. The authors analyzed responses of more than 294 SCM employee
    who reported on “go-to” technologies and social media tools to remote office practices.
    The research employed quantitative methodology (i.e., emailed questionnaires)
    and found that social media has become an important tool for conducting business
    operations due to social distancing and isolation.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# INTRODUCTION


    Our paper fills a gap in know-how and research by presenting a study of managerial
    practices during COVID-19 quarantine. Usually, SCM, SCM, and directors give instructions
    face-to-face, share expectations, and identify the path forward on workplace tasks.
    COVID-19 has reached out over the globe that adversely impacted the corporate
    sector. There are many confirmed cases for each nation, yet the pandemic is unevenly
    dispersed because most economies are consistent at various phases of confronting
    the disease. The world has engaged in the process of adjusting to the new world
    of digital marketing (Khan et al., 2021; Junusi, 2020). Consider Singapore and
    Hong Kong, which have just observed a renaissance and will undertake new endeavors
    in the face of COVID-19.


    At the same time, Western European economies have seen variable measures of neighborhood
    pandemics, either on the rise or decrease. Every nation has suffered greatly during
    the crisis; each must consider how to restart their economy and determine the
    best path to recovery. The use of social media is recognized as crucial in influencing
    business operations globally. Moreover, the role of digital marketing (social
    media) that includes communication and coordination that enhances job engagement
    and performance is recognized as new normal for businesses around the world (Arif
    et al., 2009). Numerous countries have appointed advisory and health task forces
    and appointed well-being ambassadors who quickly develop stopgap health measures
    and crisis management plans through knowledge sharing and exchange. Numerous territories
    of the planet see a sensational ascent in COVID-19 occurrences. Economies like
    Russia and Turkey are seeing an acceleration in current periods. India, however,
    has had a tremendous spike in the number of mishaps until the start of April,
    and its global response has only narrowed through territorial isolation (Tanveer
    et al., 2021). The study aims to produce effective discussion regarding the importance
    of social media and how it can assist in the recent times of Covid-19 regarding
    job performance. Research predicts the new ways of business conducted and how
    communication and coordination, knowledge exchange, training, and development
    are helpful in carryout effective job productivity at the (Tanveer et al., 2020).


    The COVID-19 outbreak and its infection fallout have become a social tragedy broadly
    influencing the lives of billions of individuals. No end to the crisis appears
    to be in sight. Loss of human lives and administration of organizations have evidenced
    the pandemic. Foremost, work-from-home (online) or remotely has not been (Tanveer
    et al., 2020). CEOs and business partners alike have adopted various job performance
    approaches to support their organizations through mediums like strong coordination
    and teamwork (Hwang et al., 2020). These new norms and values have been communicated
    for job performance, various indicators contribute to the'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'development of productivity, and their significance has changed the landscape
    of businesses (Hwang et al., 2020). At the same time, workplaces have been transformed
    by physical isolation, transportation limits, goods procurement, organizational
    and public policies governing social distance, usage of personal protective equipment
    (PPE), as well as peak operation and practices of hospitals and long-term recovery
    and care facilities. The pandemic has stressed organizations and ruined businesses
    whose knowledge-exchange practices and disease prevention methods have lagged
    behind the steep curve of the outbreak (Kniffin et al., 2020; Tanveer et al.,
    2021). Self-isolation can be most difficult in busy urban areas, for example,
    and contact tracing in places such as Germany and the US, and touch tracking applications
    and automated devices used in places such as China, might not be suitable elsewhere.


    The dependencies of these initiatives are another struggle for nations and organizations—for
    instance, considerations of their reliability and observances, such as physical
    distancing steps, influence whether other methods can be applied (Kniffin et al.,
    2020; Stanford, 2020). The study focused on the consequences that Covid-19 has
    impacted on the development of job performance that can be directed to shape discussion
    that outlines social media usage and importance that can be evaluated through
    perceived usefulness (Harris, 2020). Moreover, organizations and public actors
    have seen learning consortia and coalitions taking shape over recent months, with
    numerous actors—including states, retailers, educational experts, infrastructure
    companies, and network operators—working to leverage new channels as a potential
    response to the problem” [8]. Due to the spread of COVID-19, people in organizations
    often work from home to stay safe, increasing their productivity of employment
    (Kassim, 2020). Due to the lockdown, SCM and SCM use social media to communicate
    with remote workers (Nabbout, 2020).


    As stated in previous studies, the Pakistani Government has banned external visits
    and travel to the workplace due to the outbreak. Office closures and travel bans
    were motivated by the desire to keep workers safe (Haq et al., 2020). As a result,
    Pakistani companies required employees to work from home (Tanveer, 2020). The
    ICT sector is still making progress on the software and telecom side. People contact
    each other via different networks. However, the telecom sector is always operational.
    Similarly, the internet has assumed more central importance for business operations
    in the COVID era. Remote workers are supposed to be available on chats and assume
    and fulfill assignments over the phone and the internet, making it feasible to
    work from home (Bodewits, 2020). So, it is more important for these two sectors
    to share, work on the entire demand, and remain operative. By comparison, performance
    in the education sector may increase, in keeping with other organizations (Chaturvedi,
    2020). but, due to COVID- 19, social media channels will be called upon to boost
    employee motivation and capacity through perceived usefulness to fulfill workplace
    tasks (Abueish, 2020).'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'However, at the same time, mass media platforms have experienced a bit of a
    dive with individuals all over the world observing virtual isolating, yet only
    in nationwide shutdown has there been a large concomitant increase in companies’
    investment efforts and time on social media (e.g., accessing articles, building
    knowledge repositories, and utilizing Facebook and Twitter). There have been multiple
    channels on social media helping to connect people that increase communication
    and coordination from the outset of the pandemic; however, the current scenario
    has increased the use of these social media platforms (Al-Thaqafi, 2020). As people
    are spending more time online, organizations that used to work in company offices
    have trained employees through training and development to use digital media to
    coordinate and connect to each other while working from home (Tanveer & Karim,
    2018). The need for new and creative ideas and availability to meet virtually
    during office hours has further spurred growth by effective techniques and tools
    fostering high yield achievements in job performance [Tanveer & Hassan, 2020].
