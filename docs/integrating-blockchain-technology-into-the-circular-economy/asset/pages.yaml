    # # RESEARCH METHODOLOGY


    Secondary and primary sources collected data. Secondary sources include a literature
    review and other reports, and the primary data source has a collection of data
    through a structured questionnaire. The reliability test of the questionnaire
    was also done. The target populations are employees working in the hotels of India.
    As SEM has been utilized in this analysis, 200 and above sample size is considered
    adequate (Hair et al., 2010; Kline, 2011). Hence, the questionnaires are sent
    to 650 respondents individually, but we only got 326 filled responses. The simple
    random sampling method has been generalized more appropriately and allows the
    presence of various Indian hotels (Hair et al., 2010).


    To avoid common method bias, the research team has taken few basic precautions
    during the pre-data collection stage. At the beginning of the questionnaire, a
    note was mentioned that indicated the survey is intended for academic research
    and confidentiality of data will be maintained (Mukherjee et al., 2021c). In the
    gathered dataset, the first cleansing was finished by case screening, trailed
    by factor screening so clarification can be given for variations in the information.
    Information cleaning measure it had been reasoned that missing information had
    been extremely sparse, and in this way, they were not viewed as a principal supporter
    of any predisposition (Baral et al., 2021). No cases were therefore removed. However,
    after the data is collected, the research team applied Harman’s single factor
    test. EFA was performed, and the results show that first factor explains maximum
    variance 31.108% for TF, 20.944% for OF, and 29.985% for EF, all are below the
    recommended value of 50% (Podsakoff et al., 2003).


    SEM and EFA method were utilized for data analysis (Baral & Verma, 2021). The
    data analysis was done in four stages: analysis of demographics, validity and
    reliability test, exploratory factor analysis (EFA), and confirmatory factor analysis
    (CFA) (Roy & Giduturi, 2019). EFA was done to check total variance explained to'
