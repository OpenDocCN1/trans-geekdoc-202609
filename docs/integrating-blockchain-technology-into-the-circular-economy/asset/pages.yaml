    business ensures the validity, security, privacy, transparency, and traceability
    of logistics information records, as well as other data recording benefits. It
    can also verify that both parties to the transaction are trustworthy and accountable.
    The system is critical for the logistics industry’s continued expansion and technological
    advancement. The following are some of the most significant blockchain application
    benefits in the logistics business. (Wu & Duan, 2019)


