    # 2.4 Applications of Blockchain for Supply Chain and Logistics


    Supply chain in modern industries are complex networks interconnecting several
    echelons following multipath links from the raw materials suppliers at the extreme
    upstream end to the customers at the extreme downstream end (Christopher, 2016).
    Given the dynamism of supplies and demands, it is getting increasingly difficult
    to trace events within the supply chain networks. Further, lack of transparency
    within the supply chain can affect backward traceability of the products or services.
    Accountability of illegal activities in a supply chain, such as supplies of counterfeit
    products, is very difficult to establish. Blockchain solution can serve as an
    insurer of transparency and security for fixing the transparency and traceability
    problems of supply chains (Copigneaux et al., 2020; Esmaeilian et al., 2020).
    Registering products manufactured and in transit on the digital ledger of a blockchain
    customized for supply chain can help in ensuring provenance, traceability, and
    tracking.


    Several efforts were made to use blockchain for improving Supply Chain Management
    (Dickson, 2016). Some of the successful case studies are reviewed as the following:


    Walmart: Walmart is a U.S. retail giant that presented a pilot program of leverage
    distributed ledger technology to trace the origin of pork in China and its production
    within the U.S. (Ramamurthy, 2016). It was one a pilot test project of blockchain
    technology outside the financial sector. This technology was tested to eliminate
    transaction errors and missed deadlines with a goal to make the supply chain network
    more efficient (Prisco, 2016).


    Ever ledger: Ever ledger is a startup business aiming to scale down risks and
    frauds for retail banks and open marketplaces. They used blockchain technology,
    machine vision, smart contracts and other emerging technologies (Dickson, 2016).
    Their platform runs on global digital ledger that provides ability to trace goods
    throughout all the echelons of a supply chain. Records in block chain contain
    defining characteristics, history, ownership, and provenance data of products
    registered. Ever ledger has built a hybrid technical model using private and public
    blockchains deployed on cloud computing.


    Provenance: Provenance is a London-based company that aimed to make their supply
    chain more transparent by deploying block chains. They focused on product performance,
    product originality, and environmental impact of the products by tracing provenance
    data from the origin points (Allison, 2016). Further, Provenance'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'used block chains for eliminating worker exploitation and forced labor practices
    (Dickson, 2016).


    Maersk: Today, 90% of products in global trade are transported by the shipping
    industry (Lieber, 2017). However, the supply chain is slowed by the complexity
    and sheer volume of point-to-point communication across a loosely coupled web
    of land transportation providers, freight forwarders, customs brokers, governments,
    ports and ocean carriers. Processing documents and knowledge for a container shipment
    is estimated to cost quite twice the expenses from the particular physical transportation.
    IBM and Maersk have addressed this problem on a “distributed permission platform”
    accessible to the supply chain managers designed for exchanging data on events
    and manage document exchange workflows. Currently, it has been enabled as trade
    blockchains in selected trading lanes (Armonk, 2017). In a test by Maersk, one
    container of flowers was shipped from Kenya to the port of Rotterdam with end-to-end
    provenance data capturing managed through exchange of documents at every major
    event (Lieber, 2017).


    Transparency and accountability are the main selling points of blockchain application
    in supply chains. Sharing information between all parties within the supply chain
    can improve the relationships between them and make them more efficient. These
    are several blockchain features influencing improvement of transparency and accountability
    in the logistics industry (Copigneaux et al., 2020; Esmaeilian et al., 2020; Ganne,
    2018):


    +   (a) Opens access to information concerning the activities within the supply
    chain.

    +   (b) Provides customers with the power to gauge the merchandise, service, supplier,
    carrier etc. before making a choice;

    +   (c) Provides customers with the knowledge they need concerning product origins
    and freight route;

    +   (d) Reduces risk in reference to fraud or counterfeit goods;

    +   (e) Enables monitoring, tracking and tracing transports;

    +   (f) Simplifies exchange of products and payment systems;

    +   (g) High security, traceability, and immutability of products’ data;

    +   (h) A transparent, distributed, decentralized, and secured architecture for
    multi-party trust and integrity in the supply chain;

    +   (i) Automation of contracts execution, supply chain processes linked with
    the contract, and delivery and payments;

    +   (j) Risk mitigation and compliances assurance for all the contracting parties;


    In block chain system, all information concerning shipping processes are digitalised,
    which enables all participants to urge the relevant data at any moment (Bodkhe
    et al., 2020; Sigwart et al., 2020). Consequently, this reduces risks and'
