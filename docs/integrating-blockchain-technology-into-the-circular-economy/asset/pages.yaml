    # RESEARCH METHODOLOGY


    To carry out the research study, the SCM of businesses were contacted over the
    phone via Skype and WhatsApp. The research methodology used both quantitative
    and qualitative methods to analyze and interpret the data. Following the literature
    review, data collection was carried out by using social media, voice and text
    messages, and survey questionnaires. The survey tool was designed 1) to apprehend
    the use of daily apps for official collaboration; 2) to determine ways in which
    social media helps organizational SCM conduct business, set tasks, and “get the
    job done”; and 3) to calibrate the performance (i.e., ease of access, efficiency)
    and rate of usage of different social media applications.


    The data collection instrument used for the study was a survey questionnaire.
    A survey questionnaire was designed in order to collect primary quantitative data
    from the research participants. On the other hand, the qualitative data collected
    for analysis in this study was secondary, so that no need for a primary data collection
    instrument arose. The survey questionnaire designed to collect primary quantitative
    data from the research participants aimed first to collect demographic information
    of the participants, followed by collecting data for the variables involved in
    this study using a Likert scale. Open-ended questions and leading/loaded questions
    were avoided.


    Survey participants were asked certain questions to correlate to the problem statement,
    and the survey questionnaires were emailed to >300 participants. However,'
