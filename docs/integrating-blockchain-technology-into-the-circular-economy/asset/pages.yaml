    The next section presents a review.


    # 2.5 Challenges in Using Blockchain for Logistics and Supply Chain


    There needs to be a right balance of cost versus benefits in using blockchain
    technology for supply chain management. The technology is complex and requires
    specialized knowledge and resources (Copigneaux et al., 2020; Ganne, 2018). Further,
    blockchain has not yet been standardized as a system across the global trading
    borders. The current trading processes may require significant modifications in
    adopting blockchain technologies. The top challenges in using blockchain for supply
    chain and logistics are the following:


    Trade dimensions: International trading occurs as per a defined construct globally.
    There are unique characteristics of trading prevailing in several trading zones
    agreed among the countries. The participating nations will need to discuss the
    changes in trading systems and processes for adopting blockchain technologies.
    There needs to be verification if blockchain is the only option or there are other
    ways possible under the evolving Industry 4.0 paradigm. The current documentation
    exchange for international trading is already very complex. Adding the complexity
    of blockchains may require establishing of feasibility and a possible roadmap.


    Technical dimension: The “reliability with anonymity” feature of blockchains may
    appear to be a novel innovation, but will require a paradigm shift in the way
    authentication, authorization, and accounting systems are functioning in the current
    trading systems. There may be threat perceptions in operating permission-'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'less blockchains whereby permission-driven blockchains may be perceived as
    too expensive to operate. Countries may end up splitting, customizing, and privatizing
    blockchains for meeting their specific interests, which may defeat the claimed
    advantages of running the blockchain.


    Privacy and trust dimension: The blockchains offer transparency and trust as a
    significant benefit. However, the privacy laws of countries (such as general data
    protection regulation of the European Union) may not accept anonymity. Under privacy
    laws, the personal data of the contracting parties need to be protected from the
    possibilities of misuse. Provenance capture may not be acceptable as per the EU
    GDPR because the process may automate capturing of several privacy-related records
    in an uncontrollable manner.


    Adoption of blockchain dimension: The participating countries in trading groups
    will need to cross several barriers to adopt blockchain as an infrastructure for
    trading and supply chain operations. The participating countries need to be setup
    digital infrastructures encompassing trading systems of multiple countries. There
    needs to be a willingness to replace the existing documentation system by the
    blockchain-driven framework in fully electronic format. Standardized electronic
    documentation formats needs to be established among the trading partners. Systems
    for interoperability for smooth and secured exchange of documents and records
    with traceable authorizations need to be established. Overall, a significant willingness
    to change is needed for adopting the digitalization technologies (Internet of
    Things and its framework of sensory and actuation systems) and digitization technologies
    (digital communications and cloud computing systems). An ecosystem of trust and
    integrity needs to be formed among the participating nations in a trading domain.
    There may be several economic, political, and social barriers in adopting digitalization
    and digitization technologies for adopting blockchains in logistics and supply
    chains. The machine to machine communications involving Internet of Things will
    need standardized operating protocols, device designs, hardware and software standardization,
    authorization and accounting, and communication protocols.


    # 3.0 CONCLUSION


    Blockchain has emerged as a novel technology framework taking the concepts of
    Bitcoin and Ethereum networks. The system of validation and high security record
    keeping has attracted significant interest of researchers in the recent past.
    Its ability to form and record reliable contracts in distributed ledger maintaining
    high accountability and transparency while maintaining anonymity has evolved new
    application domains. One of the application domains recognized is logistics and
    supply chain management. This domain has been reviewed in this research. The'
