  md: 'The 3rd generation is predominantly concerned with real-time services on public
    ledgers and distributed databases (Casino et al., 2019). At this level, Industry
    4.0-based technologies are seamlessly incorporated. A range of emerging technologies
    is integrated with machinery and BCT. In this generation, scalability is one of
    the most significant challenges that blockchain faces (Singh et al., 2020; Pawa
    et al., 2021; Dennis & Disso, 2019). Although many newer cryptocurrencies claim
    to be able to handle more transactions in a second, one of the most important
    features a third-generation blockchain would need to provide is a reliable scaling
    solution – whether that means changing the features of the blockchain itself or
    using a ‘second-layer solution to handle more transactions.


    Even though blockchain technology is still in its infancy, it has made considerable
    progress in the last five years (Pilkington, 2016; Gamage et al., 2020). BCT makes
    transaction tracking and processing much more open and stable. In BCT, any time
    a service transaction is completed, a new block of data is recorded on the blockchain,
    which will remain there indefinitely and be visible to all parties. The details
    in the BCT are extensively encrypted to prevent tampering with the transactions.


