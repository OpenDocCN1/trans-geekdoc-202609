    # CONCLUSION, LIMITATIONS, AND RECOMMENDATIONS


    There appears to be a universal sense that everyday life seems like a thing of
    the past only after a short time of emotional and social distancing in the COVID-19
    era. Computer-mediated activities put the outer environment inside, too, as well
    as supplying remote users with a glimpse of what events are like beyond their
    personal space. Meanwhile, Google, Skype, WhatsApp, and many other applications’
    usage has increased dramatically more than double in recent months. The people
    might joke that it took a pandemic for such mechanisms to ever really take off.
    For marketers, apps and web platforms have become among the most coveted aspects
    of homegrown content and remote work-life projects. Today’s business SCM consent
    to function and work remotely because of the constraint of living safely in COVID-19
    times while granted assurances that an individual has the right resources to execute
    tasks related to the position. Hence, the following study was conducted that does
    emergence of COVID-19 has affected job performance. Today’s desktops and laptops
    link securely from home to the corporate network. The top apps identified for
