    a follow-up letter is communicated to the experts who approved the invitation
    to participate, along with the necessary research forms. The method for selecting
    panelists in this study is tabulated in Table 1. 31 experts were approached and
    invited to participate in the study using the table 1 procedure (between November
    2020 and January 2021). Those who wanted to take part in the study were asked
    to provide an email address to which all research correspondence would be used.'
