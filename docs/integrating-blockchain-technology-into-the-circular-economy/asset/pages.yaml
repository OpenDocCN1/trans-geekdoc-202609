    # 3. INVENTORY MANAGEMENT


    IR 4.0 is an essential part of inventory management, where everything is digitalized
    on the intelligent system. Products are getting smart, and customers are demanding
    a product that gives them great satisfaction. Manufacturing and services are parallel,
    thus managing the visible supply chain process that is decentralized during inventory
    management. Digitalization is the essence of industry 4.0, with fast progress
    concerning technology, product optimization, and inventory management to a new
    level. It has transformed inventory systems and optimized them to a new level
    that benefits the industry.


    IR has transformed industries into digitalization, a blend of the physical and
    digital realm. IR 4.0 is a technology fusion that helps to integrate cyber, machines,
    and humans domains. It includes the Internet of things (IoT), artificial intelligence,
    autonomous vehicles, robotics, quantum computing, and material science. It is
    enabled by intelligent digitization that connects and integrates the new digital
    world. Inventory is directly related to cash flow and appears to be indifferent
    from visible/invisible form. The manufacturing process includes visual form (raw
    material, work-in-process inventory management, and finished good inventory management)
    and invisible form (memory card capacity, memory, and bandwidth). In IR 4.0, inventory
    management has different stages. Each stage is conducted in a digitized form to
    improve customer satisfaction while managing inventory and operations effectively,
    reducing costs in a supply chain process (see figure 2). However, it is promising
    to hold stock in some stages. It contains product depreciation and cash retention
    to optimize inventory at the downstream level while upholding minimum inventory
    to maintain supply and demand.'
