    when they acquire the food product and when they send it on to the next individual
    in the chain. Food is tracked from the farm, through cleaning and processing facilities,
    to the factory, and finally to the supermarket, using BCT (Orzechowski, 2019).


    Treum is a BCT-based supply chain business that, in collaboration with the World
