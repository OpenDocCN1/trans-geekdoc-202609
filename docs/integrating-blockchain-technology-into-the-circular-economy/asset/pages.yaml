  md: '# # Research methodology


    The study selected manufacturing firms that operate in the most polluting industries
    and have adopted green initiatives. To accomplish the study’s goals, it was essential
    to focus exclusively on manufacturers that follow GSCP. Each organization’s supply
    chain manager was consulted by telephone to determine if and to what degree green
    standards were being applied.


    The survey provoked responses from production, operational and supply chain managers
    working in manufacturing companies of Pakistan. The data was gathered during winter
    of 2020 through a questionnaire. In the first round, only 123 questionnaires were
    returned out of 140. In the second round, only 76 questionnaires were returned
    out of 100. A total of 199 completed questionnaires were received, 14 forms were
    eliminated because of not properly filled, while 185 forms were used in CB-SEM
    to test the hypotheses.


    We developed survey questionnaires to evaluate our study model. All measurements
    are derived from existing literature and adapted for use in the sense of GSCP
    activities. Following the creation of the survey products, we interviewed different
    managers from manufacturing companies to solicit input on these items. To ensure
    the validity, we performed a pilot study with 6 supply chain and 8 producion and
    plant managers in the manufacturing sector, utilizing an updated sample. We completed
    the survey after considering all of the respondents’ suggestions and input. The
    questions were designed to elicit a range of responses ranging from 1 strongly
    disagree to 7 strongly agree.


