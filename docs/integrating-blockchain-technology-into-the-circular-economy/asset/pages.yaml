  md: 'increases the delivery quality. Moreover, it allows organizations to decrease
    the quantity of waste, spoilage and defects. Using Internet of Things with machine
    to machine communications allows direct monitoring and control of supply chain
    processes and transactions captured from the machines, equipment, and robots involved
    in conducting the transactions


    Block chain is beneficial for logistics by enabling synchronized audit trails
    between partners and optimizing them during a real time. It increases trust across
    the supply chain, consequently simplifying the choice making process at every
