  md: 'Compatibility (COMPA): “The degree to which an idea is viewed as compatible
    with the current principles, past experiences, and needs of potential adopters”
    is how compatibility is described (Rogers, 2003). As a result, BD. adoption must
    be well-aligned with current IT tools and specifications. According to Shin, 2016,
    inventions compatible with existing technology and norms are adopted faster than
    those that are not. The importance of usability in innovation adoption has been
    recorded in numerous studies (Cruz-Jesus et al., 2019; Haryanto et al., 2020;
    Mahakitikun et al., 2020; Ngah et al., 2017; Pateli et al., 2020).


    +   **H2: COMPA will have an impact on the adoption of BD.**


    Relative Advantage (RA): “The degree to which an invention is considered as better
    than the concept it supersedes” is how comparative advantage is described (Sun
    et al., 2018). It is evaluated based on increased marketing opportunities, increased
    competition, and additional services offered to clients (Yadegaridehkordi et al.,
    2020). As per Park et al., 2015, there is no requirement for associations to execute
    and utilize BD without first deciding its advantages and relative benefits.


    +   **H3: RA will have an impact on the adoption BD.**


    Cost (C): The cost of BD. adoption is described as “the cost incurred by a company
    to maintain BD use and future scalability” (Sun et al., 2018). Organizations who
    want to use BD. technology must make a significant investment in both hardware
    and software. Other challenges of BD. adoption include the expense of assigning
    new workers and educating current employees (Verma, 2017).


    +   **H4: C will have an impact on the adoption BD.**


