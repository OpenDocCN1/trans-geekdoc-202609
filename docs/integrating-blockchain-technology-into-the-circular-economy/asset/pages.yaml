    # CONCLUSION


    The current study aims to determine the effect of BD on the organizational performance
    of hotels. For this study, a structured literature review is being performed to
    identify the factors. TOE framework was recognized for this study, which comprises
    technological factors, organizational factors, and environmental factors. A questionnaire
    was being prepared for survey-based research in the hotel industry. The target
    population'
