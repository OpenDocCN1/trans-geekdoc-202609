  img_proc: true
- pgno: 62
  md: '# 1.1.1 Immutability


    Nothing can be changed once it has been recorded because block chain functionality
    is irreversible. Financial transactions are executed immediately even without
    the possibility of human error. However, in conventional financial practices,
    the immutability component loses its attractiveness since there are faults and
    malfunctions that must be rectified. Accenture (Financial Consulting Firm) has
    intended to trademark “Editable Block chain” while keeping practical restrictions
    in mind, which has caused controversy from defenders of Public Block chain.


    # 1.1.2 Trustlessness


    Block chain technology reduces need for a third party to authorize financial transactions,
    making the system self-sufficient and entirely autonomous of external factors.
    Consequently, the peer-to-peer process eliminates intermediaries, making the ledger
    self-sufficient. This concept appeals the researchers because trustworthiness
    should be at the core of all financial systems. The block chain technology would
    be seen as a solution to the contemporary financial difficulties since it eliminates
    the uncertainties of counterparty. But don’t forget that it’s the component of
    ‘Trust’ that will ultimately lead developers and users to switch from a third
    party to a block chain.


    # 1.1.3 Transparency


    Traditional Block chains, such as Ethereum and Bitcoin, make the ledger accessible
    to all network users, making it entirely transparent. It allows multiple parties
    to monitor the ledger in real time, placed strategically to make better decisions.
    Simultaneous access lends credibility to this system. Uncertainty is fully eliminated
    when transactions are settled instantly. Some promoters of block chains argue
    that if they had been in place at the time of the financial crisis in 2007, it
    could have been mitigated. Regulators would have been notified of the current
    situation in real time and may have taken appropriate action, halting the tide
    of solvency and financial disaster.


    # 1.1.4 Resilience


    Following the financial crisis of 2009, there was an immediate need for a financial
    system overhaul. Slight glitches in a system can lead in a worldwide financial
    collapse. In recent years, the financial system’s cyber security has been hacked,
    placing multinational corporations, countries, and even SWIFT in threat (Society
    for'
