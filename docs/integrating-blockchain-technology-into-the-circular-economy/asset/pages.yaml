    # PRELIMINARIES


    Logistics service levels. Logistics services and transportation management of
    a company have different levels that depend on its structure and operations. (Fadile
    et al. 2018) has reviewed a variety of literature available on outsourcing decisions
    of logistics service levels. Their research has suggested three levels of logistic
    services:


    +   - Level 1- Basic logistics: Basic logistic services are transportation and
    warehousing. Activities at this level are outsourced to a large degree in companies;

    +   - Level 2- Value-added logistics: Value-added logistics services are re-labeling
    and re-packaging, or customization of the final product. For example, Olives are
    imported in Pakistan and packed with different labels in various packaging and
    then transported.

    +   - Level 3- Advanced logistics: Advanced logistic services include inventory
