  md: '# About the Contributors


    **Syed Abdul Rehman Khan** is a professor of Supply Chain and Logistics Management.
    Dr. Khan achieved his CSCP—Certified Supply Chain Professional certificate from
    the U.S.A. and completed his postdoctoral fellowship from Tsinghua University.
    Since 2020, Dr. Khan has been affiliated with Xuzhou University of Technology.
    He has more than nine years’ core experience in supply chain and logistics at
    industrial and academic levels. Prof. Khan has attended several international
    conferences and has been invited as a keynote speaker in different countries.
    He has published 100+ scientific research papers in different well-renowned international
    journals and conferences. Also, Dr. Khan has achieved several research projects
    and scientific innovation awards.


    ***


    **Abdul-Rahim Ahmad** is an award-winning academician and an active researcher
    of global repute working at the Department of Decision Sciences, Karachi School
    of Business Leadership, where he is involved in leading-edge interdisciplinary
    teaching, research, curricula development, and academic service. He is also an
    adjunct professor at the department of Systems Design Engineering, University
