  md: '# Glossary


    +   **Blockchain:** Blockchain is a distributed, decentralized ledger that makes
    tracking transactions and monitoring assets in a value chain much easier.


    +   **Cyber-Physical System:** CPS monitors physical components with computer-based
    algorithms connected to internet, using a mixture of computers, sensory sensors,
    embedded cognitive computing, and multiple communications mechanisms.


    +   **Digital Twin:** A digital versions of physical objects.


    +   **Industry 4.0:** The use of new smart technology to advance automation of
    conventional manufacturing and industrial practices.


    +   **Logistics 4.0:** A term coined to describe the application of Industry 4.0
    technologies in logistics domain.


    +   **Microgrid:** A decentralized network of electricity generating units that
    is usually connected to and synchronous with the conventional wide-area synchronous
    grid, but that can also detach to “island mode” and run independently.


    +   **Quality 4.0:** Under the framework of Industry 4.0, a concept that refers
    to the future of quality and organization performance.


    +   **Smart Contract:** A code that runs on the blockchain network and defines
    certain criteria that all parties must enforce.'
