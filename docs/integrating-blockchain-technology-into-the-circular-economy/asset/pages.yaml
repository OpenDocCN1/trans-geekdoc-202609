    # LITERATURE REVIEW


    A significant amount of research has been done on decision-making for outsourcing.
    A detailed literature review in this regard has been performed by (Perunović 2007),
    in which authors deduced that the outsourcing process starts with cost analysis,
    which is the basis of Transaction Cost Economics (TCE) and Agency Theory (Gottschalk
    and Solli-Sæther 2006). However, with an increase in outsourcing practice, the
    paradigm also shifted to the resource stage, where Resource-based view (RBV) theory
    is also being considered in outsourcing (El Mokrini et al. 2016). (Hsiao et al.
    2010) also acknowledged TCE and RBV as the two main methodologies additionally
    suggested Supply Chain Management Theory. More recently, (Fadile et al. 2018)
    have surmised that TCE and RBV are the theories widely conferred in the literature.
    Most of the researchers are agreed that there are three major theories of outsourcing
    i.e.


    +   (i) Transaction Cost Economics (TCE),

    +   (ii) The resource-based view (RBV)

    +   (iii) Agency Theory


    The TCE is one of the fundamental theories in management sciences about outsourcing.
    Any organization’s growth and sustainability highly depend on identifying the
    cheaper way to perform different operations either in-house or to external agents
    as outsourcing (Hong et al. 2010). The cost to perform these outsourcing activities
    is called transactional cost. The TCE theory has been greatly influenced by (Ouchi
    and Williamsson 1977), which further elaborated three dimensions of TCE as (i)
    asset specificity, (ii) uncertainty, and (iii) frequency (Eccles and Williamson
    1987). Asset specificity is a significant element for TCE in logistics management
    (Hong et al. 2010). Asset specificity narrates the fact that the management of
    product distribution, at times require special handling which is normally due
    to unique or non-standard products or market it is aimed for. Since the company
    has heavily invested in its product, they face the risk of opportunistic behavior
    by the logistics providers in this regard (Dickmann and Tyson 2005). This situation
    has been stated by various researchers in the field of logistics management (Lamminmaki
    2005; Spraakman and Davidson 1998; Verbeke and Kano 2010; De Vita and Tekaya 2015)


    The second important element of TCE is uncertainty, which is further categorized
    as environmental uncertainty and behavioral uncertainty. Environmental uncertainty'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'is associated with an exchange between a company and logistics provider and
    includes demand, supply, and technology uncertainty (Huo et al. 2018). Behavioral
    uncertainty is associated with performance verification (Heide and Rindfleisch
    1997). The effect of behavioral uncertainty on transaction costs is mainly due
    to negotiation, monitoring, and executing arrangements (Schoenherr 2010), which
    eventually vary the bargaining transaction costs and enforcement transaction costs,
    which are two of the three main transaction cost categories.


    The third element of TCE is transaction frequency. The higher the transaction
    frequency of a certain product, the more the company should seek a hierarchical
    governance form (Eccles and Williamson 1987). However, research findings of the
    significant effect of transaction frequency on transaction costs are rare (Heide
    and Rindfleisch 1997).


    The RBV theory is about the consideration of resources own by the company for
    outsourcing decision-making. The RBV theory is concerned about the resources,
    proficiencies, and abilities of a company as compared to TCE theory where all
    focus is on the transaction. Thus RBV is rather used as an instrument to validate
    outsourcing decisions, which is also perceived by many researchers in decision-making
    theory (Duncan 1998; Espino-Rodríguez and Padrón-Robaina 2006; Goles 2003). The
    RBV theory negates Porter’s hypotheses that product and market positions decide
    sustainable competitive advantages. (Espino-Rodriguez and Padrón-Robaina 2006).
    On the contrary, it suggests that disparity in the possession of resources and
    competencies between companies decides the sustainable competitive advantages,
    which also affects the performances over time (Wernerfelt 1984). The RBV theory
    supports the company to decide in using in-house resources or outsourcing thus
    encourages the company to explore market resources for outsourcing rather than
    involving the company in other domains (Silverman 1999). However, this theory
    works in cases when tangible or intangible resources are specific and unconventional.
    Unconventional resources are valuable, rare, unique, and non-substantial, which
    also define the company’s performance (Duschek 2004).


    The agency theory is different from the aforementioned theories in a way, it applies
    to resolve issues of already outsources products or services. Thus, it is not
    used to decide to outsource, rather it is used to manage or reconsider outsourcing
    decisions (Geis 2007; Logan 2000). The agency theory is used to solve the various
    problems in Agency Relationship. The Agency Relationship is defined as the association
    in which a company or the principal hires another entity or an Agent to perform
    the work assigned to the company. This relationship is also developed in outsourcing
    as the outsourcing company is the principal and the contractor is the Agent. The
    agency relationship affects outsourcing as it improves the outsourcing by improving
    contracts.'
