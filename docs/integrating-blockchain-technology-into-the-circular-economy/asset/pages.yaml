    center and the patient will track the prescription’s validity.


    # Use Case 2: Food Safety


    From time-to-time people have been getting sick from infected lettuce or other
    products. When this happens, supermarkets and other retailers do as we would expect:
    they remove the product from the shelf to be safe. Walmart, on the other hand,
