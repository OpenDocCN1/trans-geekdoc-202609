    # DISCUSSION


    In Pakistan, like many other countries, the situation of COVID-19 is unruly and
    dangerous, as seen when the Pakistani Government announced a complete lockdown
    of major commercial and residential areas and ordered a national work-from-home
    policy (voluntary or involuntary). The problem statement that spurred our research
    study was whether business SCM’ productivity would remain the same if they worked
    from home. It seems that the use of apps like IMO, WhatsApp, and Skype smooth
    the transition to working from home and facilitate business SCM’ ability to assign
    new tasks to their team members and schedule remote meetings. In the IT and Telecom
    sector, digital devices are of much importance. Our study manifests how social
    media platforms have influenced the performance during the COVID-19 situation
    and work-from-home policy. Similarly, software engineers manage tasks through
    project management software and get ready for meetings'
