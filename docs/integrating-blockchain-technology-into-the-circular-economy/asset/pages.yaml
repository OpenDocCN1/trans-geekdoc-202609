  md: '# RESEARCH METHODOLOGY


    **Research objectives.** The objective of this research is to evaluate and determine
    the best solution regarding the outsourcing of transportation management. The
    research is divided into two parts. The first part is to understand the current
    problems and situations about transportation management. Secondly, perform the
    cost analysis to determine whether outsourcing is the best solution or not concerning
    the economic point of view. No hypotheses are formed and tested, and the findings
    are only relevant to outsourcing of transportation management.


    **Research questions.** To address the research objectives, and to find the optimal
    usage of transportation management, it is essential to plan the research. In this
    regard some research questions have been formulated, which are given below:


    **Research question 1 (RQ1):** What problems are experienced by the D-company
    employees due to transportation management?


    **Research question 2 (RQ2):** What is the Cost analysis of transportation management
    with outsourcing and insourcing?


    **Research question 3 (RQ3):** Based on RQ1-RQ2, what would be the best options
    for the company regarding in- or outsourcing its transport management?


    **Research approach.** This research is a mixed type and combination of qualitative
    and quantitative methods. The research approach is divided into two main areas.
    The first area focuses on existing problems faced by the D-company and employees,
    whereas the second area is concerned about cost analysis.


    In the first part of this research, the literature study was conducted to get
    insights into outsourcing theories. In this part, a qualitative approach has been
    applied to identify the existing problems in D-company, and problems faced by
    the employees due to transportation management. The data was collected through
    interviews, company documents, communication, and complaints record, and reports
    regarding transportation management.


    In the second part of the research, cost analysis is performed based on statistical
    and numerical data. The data was collected from company internal records, data
    transactions; logistics service providers’ transaction logs, and communication
    records.


    **Data collection.** The data collection was performed by interviews, observations,
    and the company’s internal data, records, and documents. The data collected used
    for both qualitative and quantitative research methods.'
