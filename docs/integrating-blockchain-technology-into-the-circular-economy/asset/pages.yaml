    # Use Case I: Pharmaceutical Industry


    To maintain quality management and regulatory enforcement over the transportation
    of medical goods, the pharmaceutical industry employs a number of complex and
    stringent environmental control mechanisms (e.g., temperature and humidity). Quality
    assurance in the supply chain is possible with blockchain, such as binding medications
