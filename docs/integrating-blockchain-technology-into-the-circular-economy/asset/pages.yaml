- pgno: 166
  md: '# Fraud prevention


    The manufacturing sector is the most susceptible to fraud. Since supply chains
    are complicated and typically include a large number of people and moving parts,
    there are many opportunities for fraud to occur and go unnoticed (Jabbar et al.,
    2020). Goods may be counterfeited to the point that they are indistinguishable
    from the real thing. Inventory fraud is one illustration of a pervasive problem
    that undermines consumer and distributor trust in producers.


    Manufacturing entrepreneurs can suffer significant financial losses as a result
    of ineffective regulation, improper record-keeping systems, and other weaknesses
    in the industry’s architecture. Besides that, the manufacturing industry is vulnerable
    not just to inventory, vendor, and procurement fraud, but also cyber threats,
    shady middlemen, and billing schemes (Chhetri et al., 2018). For example, with
    BCT, if a buyer has questions about a gold seller’s credibility and origins, he
    or she may check the data collected, which contains information archived from
    the time the mineral was mined until the last supplier, ensuring its validity
    and the sellers’ integrity. Similarly, it could be used to ensure the consistency
    of a product, such as in the case of a high-priced product buyer who wants to
    ensure not just the sellers’ authenticity, but also the authenticity of every
    particular raw material used to produce the product.


    # Use Case: Anti-Money Laundering


    Digital exchanges and financial institutions all over the world are currently
    designing mechanisms to improve enforcement and enforce higher standards of regulation
    in their systems to comply with know you the customer (KYC) and new AML (Anti-Money
    Laundering) standards, as the old ones have been criticized as inadequate (Haffke
    et al., 2020; Frick, 2019). The global financial model is changing, partly as
    a result of creativity and partly as a result of necessity. The previous AML guidelines
    and policies are inadequate, leading to poor management and low enforcement, placing
    customers at risk of fraud. To conform to KYC regulations, a distributed ledger
    could minimize errors through automation, avoid duplication, and create a database
    of all checks performed for each client.


    # Data and Communication Security


    BCT enables parties to have full control over data and privacy without depending
    on a single point of control, making it incredibly cost-effective and productive.
    This presents the potential to use blockchain to build a safe and trustworthy,
    management and sharing system, which will speed up the data-sharing process. For
    a hacker to tamper with the data in the blockchain, the hacker will have to delete
    the data'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'stored on every user’s device in the global network. Thousands of computers
    may be involved, everyone holding a copy of all or most of the data. Undamaged
    machines, also known as “nodes,” will keep operating to check and keep track of
    all the data on the network unless the hacker could take the whole network down
    at that point (which is almost unfeasible).


    Enforcing blockchain technology will also decentralize the domain name system
    (DNS), disseminating its contents across a vast number of nodes and making hacking
    nearly impossible. Domain editing privileges would be given only to those who
