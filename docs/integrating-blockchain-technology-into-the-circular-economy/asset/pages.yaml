    can make it easier for organizations to deal with the challenges and complexities
    that come with new technologies, resulting in a faster adoption rate (Yadegaridehkordi
    et al., 2018).


    +   **H5: SM will have an impact on the adoption of BD.**


    Organizational Resources (ORE): “The degree to which a firm’s technology, human,
