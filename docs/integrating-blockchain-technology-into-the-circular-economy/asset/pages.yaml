    # Chapter 5


    # Industrial Revolution 4.0 and Supply Chain Management ............................82


    Adeel Shah, University of Kuala Lumpur, Malaysia

    Aisha Ismail, Business School, Karachi University, Pakistan


    Innovation is taking place rapidly, which is changing the demand level. Diversifying
    the supply chain with changing demand patterns is another challenge to meet. Industrial
    Revolution (IR) 4.0 is the new way to effectively manage the supply chain process
    with the updated conventional business model. The technology enhances the traditional
    business model and improves distance relations among companies and customers through
    well managed distribution channels, creates high-level customer satisfaction,
    and provides timely information in each stage of the supply chain process. Innovative
    technology allows companies to make more profit by saving time and making an additional
    product to meet specific demands cost-effectively. It is also reducing human efforts,
    which will be taking place by robotics soon. The industrial revolution is the
    new beginning of an environment where the supply chain will be managed by intelligent
    technology, improving the overall process of value chains.


    # Chapter 6


    # Outsourcing Transportation Management: A Case Study of an Online Shopping Company
    ............................93


    Fahim Ul Amin, Chang’an University, China

    Dong Qianli, Chang’an University, China

    Wasim Ul Amin, North China Electric Power University, China

    Iram Zulfiqar, North China Electric Power University, China

    Shamsa Kanwal, North China Electric Power University, China


    Transport management has significant importance in every organization. This chapter
    aims to evaluate the outsourcing decision of transportation management of an online
    shopping company. Recently, the company has witnessed significant growth in its
    operations, and it became inevitable to decide whether it continues outsourcing
    transportation management or go for insourcing as various problems are experienced
    due to outsourcing. The company has many logistics operations that include inbound
    receiving, warehousing, and outbound distribution. All the operations are considered
    and studied to understand the problem and objectives of outsourcing. In this chapter,
    a literature review regarding outsourcing transportation management is provided.
    Afterward, a research methodology is proposed and'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'is performed to check the feasibility concerning financial resources. Based
    on the cost analysis, it is decided to discontinue outsourcing transportation
    management. Some recommendations are also proposed for insourcing transportation
    management.


    # Chapter 7


    # Pitfalls and Challenges of Blockchain in Supply Chain and Logistics ....................108


    Asad Ullah, Middle East College, Oman

    Asad Ullah, Middle East College, Oman

    Shahid Imran, Middle East College, Oman


    The potential impact of block chain on supply chain management has been explored
    by many authors, and indeed, many articles in the popular press extol the benefits
    of blockchain in supply chain management. In simple terms, blockchain is a distributed
    ledger system, or a record book, except that it is not maintained by a single
    person but by anyone who is interested in keeping the records. Since blockchain
    is a new and revolutionary concept in technology, more techies are interested
    in it. However, it also has certain disadvantages. The purpose of this study is
    to explain the challenges and pitfalls of blockchain in supply chain and logistics.
    Using a systematic literature review method, this chapter identifies 31 publications
    that discuss the challenges and pitfalls associated with blockchain in supply
    chain and logistics.


    # Chapter 8


    # Supply Chain and Logistics Operations Management Under the Era of Advanced Technology
    ....................126


    Muhammad Tanveer, Prince Sultan University, Saudi Arabia


    Implementation and adoption of new technologies are gaining the result of smooth
    supply chain and logistics operations. Internet of things (IoT) artificial intelligence,
    including data mining, intensified in all fields of life, particularly in supply
    chain management and operations. Blockchain technology has the capability to reform
    the supply chain and logistics operations management. Blockchain provides digital
    database solutions for all transactions across supply chain and operations management.
    Radio frequency identification device (RFID) is also helping technology transmit
    electromagnetic waves to radio-compatible integrated circuits to look after and
    manage the entire supply chain and logistics operations management. The Fourth
    Industry Revolution 4.0 refers to the automation, interconnectivity, machine learning,
    and real-time data that help supply chain and logistics operations management
    in the 21st century.


    # Chapter 9


    # Blockchain Technology as Enablement of Industry 4.0 ....................137'
