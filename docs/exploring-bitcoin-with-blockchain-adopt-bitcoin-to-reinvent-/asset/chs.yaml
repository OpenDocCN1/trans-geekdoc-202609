  \ = '635221037fadaea6edf196bf70af16cefb2bd3c830e54c0a6e9a00bf7806b241933547f72102fcb1c7507db15576ab35cd7c9b1ea570141a8b81c9938dae0320392b0f7034d052ae670169b27521037fadaea6edf196bf70af16cefb2bd3c830e54c0a6e9a00bf7806b241933547f7ac68'\n\
  \    input0['hash_type'] = SIGHASH_ALL\n```\n\n\n\n\n`txn['inputs'].append(input0)`\n\
  \n`txn['out_count'] = 2`\n\n`txn['outputs'] = []`\n\n`output0 = {}`\n\n`output0['satoshis']\
  \ = 10*(10**8)`\n\n`output0['script_type'] = 'P2PKH'`\n\n`output0['address'] = 'mxzmMmVycLDgAA48VtHDeh389eDAwiJqwQ'`\n\
  \n`txn['outputs'].append(output0)`\n\n`output1 = {}`\n\n`output1['satoshis'] = 399999*(10**4)`\n\
  \n`output1['script_type'] = 'P2PKH'`\n\n`output1['address'] = 'miSFmBeKXf5Wp7Luj46XTu3Yh57nAwhZAo'`\n\
  \n`txn['outputs'].append(output1)`\n\n`txn['locktime'] = 0 # block height`\n\n`return\
  \ txn`\n\n**程序 11.8：** 用于为 True 条件创建交易的方法\n\n对于赎回脚本，我们需要像普通多重签名脚本那样提供 Alice 和 Bob\
  \ 的公钥。在这里，我们还需要向脚本提供 `OP_1` 或 True。\n\n因此，包含赎回脚本的 `scriptSig` 如下所示：\n\n```\n#OP_0\n\
  #<Alice 的签名>\n#<Bob 的签名>\n#OP_1 (True)\n#IF\n### OP_2 <Alice 的公钥> <Bob 的公钥> OP_2\
  \ CHECKMULTISIG\n#ELSE\n### 105 CHECKSEQUENCEVERIFY DROP\n### <Alice 的公钥> CHECKSIG\n\
  #ENDIF\n```\n\n我们在方法 `createSignedInput` 中进一步添加以下条件，以处理上述条件脚本的 `script_type` `P2SH_Condition`：\n\
  \n```\nelif txn_input['script_type'] == 'P2SH_Condition':\n    scriptSig_b = createScriptSigForCond(signgrp,\n\
  \                                         script_b,\n                          \
  \               txn_input['condition'])\n```\n\n我们还为自定义条件创建 `scriptSig`，如下所示：\n\n\
  ```\nOP_FALSE = 0x00\nOP_TRUE = 0x51\n#########################\n#True Case\n#OP_0\n\
  #<Alice 的签名>\n#<Bob 的签名>\n#OP_TRUE (True)\n#########################\n#False Case\n\
  #<Alice 的签名>\n#OP_FALSE (False)\n#########################\n#需根据用例进行自定义\ndef createScriptSigForCond(signgrp:\
  \ list,\n                           script_b: bytes,\n                         \
  \  cond: bool):\n    if cond:\n        scriptSig_b = bytes([OP_0])\n        for\
  \ sign_b in signgrp:\n            scriptSig_b += getWithPushdata(sign_b)\n     \
  \   scriptSig_b += bytes([OP_TRUE])\n        scriptSig_b += getWithPushdata(script_b)\n\
  \    else:\n        scriptSig_b = encodePushdata(len(signgrp[0])) + signgrp[0]\n\
  \        scriptSig_b += bytes([OP_FALSE])\n        scriptSig_b += encodePushdata(len(script_b))\
  \ + script_b\n    return scriptSig_b\n```\n\n**程序 11.9：** 用于条件处理的 ScriptSig\n\n\
  执行代码后，我们得到以下签名的原始交易：\n\n![](img/Figure-11.26.jpg)\n\n**图 11.26：** 具有相对锁定时间的支付交易十六进制代码的创建\n\
  \n我们解码前面的脚本，得到以下解码后的脚本：\n\n![](img/Figure-11.27.jpg)\n\n**图 11.27：** 具有相对锁定的支付交易中的\
  \ ScriptSig\n\n我们发布刚刚创建的交易，如下所示：\n\n![](img/Figure-11.28.jpg)\n\n**图 11.28：** 具有相对锁定时间的支付交易已发布\n\
  \n这展示了脚本在正常条件下如何工作。在发生争议的情况下，将执行 `OP_ELSE` 条件，我们需要将交易保留在内存池中，直到满足 `OP_CHECKSEQUENCEVERIFY`\
  \ 条件。如果我们在到期时间之前发布交易，它将被拒绝。为此，我们需要额外将 sequence 设置为大于 105。\n\n因此，我们修改交易结构如下：\n\n\
  ```\n#带条件的 2-of-2 多重签名\ndef createTransactionStruct():\n    txn = {}\n    txn['version']\
  \ = 2\n    txn['input_count'] = 1\n    txn['inputs'] = []\n    input0 = {}\n   \
  \ input0['prevtxn'] = \\\n    '624d92839eb89104d0909df89f95785cb8bb77f0fec66c6c40cf3ad2804a3966'\n\
  \    input0['prevtxnindex'] = 0\n    input0['script_type'] = 'P2SH_Condition'\n\
