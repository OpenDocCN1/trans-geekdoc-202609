  \n你学习了如何在合约中实现条件支付。条件判断是合约的重要组成部分，通过学习这一点，我们可以思考更复杂的智能合约。\n\n### 涉及托管的支付\n\n如果双方都不可信，我们需要一个受信任的第三方来解决争议。这类似于去中心化交易所，买家和卖家进行交易，当卖家收到付款时，释放比特币。\n\
  \n下面的流程图显示了整个支付过程中涉及的步骤和条件：\n\n![](img/Figure-11.32.jpg)\n\n**图 11.32：** 涉及托管支付的流程图\n\
  \n对于编程实现，我们只需要使用 2-of-3 多重签名，而不是带有相对超时的 2-of-2 多重签名，这正是我们在上一小节讨论的内容。\n\n因此，新的赎回脚本将如下所示：\n\
  \n```\n#IF\n### OP_2 <Alice 的公钥><Bob 的公钥><托管方的公钥> OP_3 OP_CHECKMULTISIG\n#ELSE\n\
  ### 105 CHECKSEQUENCEVERIFY DROP\n### <Alice 的公钥> CHECKSIG\n#ENDIF\n```\n\n我们将把这个作为练习留给读者。\n\
  \n### 涉及秘密标识符的支付\n\n考虑这样一种情况：一名秘密特工在敌方领土上执行任务。需要向他们转移一些物品以便执行任务。如果他们收到包裹，任务就执行；否则任务中止。为了执行任务，他们需要获得报酬。因此，只有当他们收到包裹时，才能申领付款。\n\
  \n在这种情况下，需要创建一个带有相对锁定时间的合约，在成功条件下，特工需要揭示秘密。\n\n以下是该合约的赎回脚本：\n\n```\n#IF\n### OP_SHA256\
  \ <secret_hash> OP_EQUALVERIFY\n### <特工的公钥> CHECKSIG\n#ELSE\n### 105 CHECKSEQUENCEVERIFY\
  \ DROP\n### <机构的公钥> CHECKSIG\n#ENDIF\n```\n\n以下是操作码及其十六进制值：\n\n`OP_2 = 0x52`\n\n\
  `OP_IF = 0x63`\n\n`OP_ELSE = 0x67`\n\n`OP_ENDIF = 0x68`\n\n`OP_CHECKSEQUENCEVERIFY\
  \ = 0xb2`\n\n`OP_EQUALVERIFY = 0x88`\n\n`OP_DROP = 0x75`\n\n`OP_SHA256 = 0xa8`\n\
  \n`OP_CHECKSIG = 0xac`\n\n**程序 11.11：** 用于带秘密支付的赎回脚本的操作码\n\n以下是生成赎回脚本的代码：\n\n```\n\
  def createRedeemScriptWithSecretHash(pubkey_agency: str, pubkey_agent: str, secret_h:\
  \ bytes):\n    redeem_script_b = bytes([OP_IF, OP_SHA256])\n    redeem_script_b\
  \ += createVarInt(len(secret_h)) + secret_h\n    redeem_script_b += bytes([OP_EQUALVERIFY])\n\
  \    pubkey_b = bytes.fromhex(pubkey_agent)\n    redeem_script_b += createVarInt(len(pubkey_b))\
  \ + pubkey_b\n    redeem_script_b += bytes([OP_CHECKSIG])\n    redeem_script_b +=\
  \ bytes([OP_ELSE, 0x01,\n                              105, # after 105 blocks\n\
  \                              OP_CHECKSEQUENCEVERIFY, OP_DROP])\n    pubkey_b =\
  \ bytes.fromhex(pubkey_agency)\n    redeem_script_b += createVarInt(len(pubkey_b))\
  \ + pubkey_b\n```\n\n\n\n\n\n### 程序 11.12：创建带有密钥支付赎回脚本的方法\n\n```python\nredeem_script_b\
