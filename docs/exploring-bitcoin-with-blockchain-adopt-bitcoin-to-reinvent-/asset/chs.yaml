  \n`df.to_csv('out.csv', index=False)`\n\n**程序 6.13：** 遍历比特币区块链的程序\n\n我们按如下方式调用前面的程序：\n\
  \n```\nif __name__ == '__main__':\n    traverseBlockChain()\n```\n\n我们得到 `out.csv`，其中包含以下前几行数据的一部分：\n\
  \n![](img/Figure-6.24.jpg)\n\n**图 6.24：** 显示前几个遍历到的区块信息\n\n这完成了区块链部分。你了解了区块链的结构，这些区块是如何存储的，以及如何读取、遍历和解析这些区块以获取区块头和前区块头字段。\n\
  \n##### 交易\n\n当一方向另一方支付比特币时，发送方创建一笔交易并将其发布到比特币网络。我们在 *第 5 章，白皮书* 中详细讨论了这一点。\n\n\
  在本节中，我们将了解交易是如何存储的、它们的格式、如何验证它们以及其他相关信息。\n\n交易在交易计数之后依次存储在区块中。区块有其自身的变长整数格式。这不同于我们在上一节学到的\
  \ LevelDB 变长整数格式。这稍微简单一些。前缀指示整数的长度。\n\n![](img/Figure-6.25.jpg)\n\n**图 6.25：** LevelDB\
  \ 索引值结构使用的变长整数格式\n\n在前面的子主题 ***使用区块索引进行区块遍历*** 中，我们使用了一个名为 `getTransactionCount`\
  \ 的方法。\n\n要调用 `getTransactionCount`，我们传入带有区块哈希的修剪后区块字节。以下是调用代码：\n\n```\nblk_h =\
  \ '00e0ff376a2079af63073c47184cd091819d506f12cb6b68887c040000000000000000001036e0b1059b1ec79cb36897ccf8bc5aef4c7996897b83754ab590bb2774bc2726c0475fea0710178ffaf153fda4090100000000010100000000000000000000'\n\
  blk_b = bytes.fromhex(blk_h)\nblk_m = mmap.mmap(-1, len(blk_b) + 1)\nblk_m.write(blk_b)\n\
  blk_m.seek(80)\ntx_count = getTransactionCount(blk_m)\nprint('Transaction Count\
  \ = %d' % tx_count)\n```\n\n运行此代码，我们得到以下结果：\n\n![](img/Figure-6.26.jpg)\n\n**图 6.26：**\
  \ 显示前面程序中区块的交易计数\n\n在交易列表中，第一笔交易是币基交易。这是一笔特殊的交易，因为它是由矿工创建的，用于向自己支付区块奖励和从区块中交易收集的交易费。这笔交易还向币供应量中增加了比特币。该交易没有输入\
  \ txout。\n\n该交易的结构如下：\n\n![](img/Figure-6.27.jpg)\n\n**图 6.27：** 币基交易结构\n\n以下程序解析币基交易：\n\
  \n```\nimport mmap\nimport json\n\ndef getVarInt(blk_m: mmap):\n    b_cnt_d = {'fd':\
  \ 2, 'fe': 4, 'ff': 8}\n    prefix = int.from_bytes(blk_m.read(1), byteorder='little')\n\
  \    if prefix < 0xFD:\n        return prefix\n    else:\n        b_cnt = b_cnt_d['%x'\
  \ % prefix]\n        size = int.from_bytes(blk_m.read(b_cnt), byteorder='little')\n\
  \        return size\n\ndef getCoinbaseTransactionInfo(blk_m: mmap):\n    tx = {}\n\
  \    tx['version'] = blk_m.read(4)[::-1].hex()\n    tx['inp_cnt'] = getVarInt(blk_m)\n\
  \    inp_l = []\n    for i in range(tx['inp_cnt']):\n        inp = {}\n        inp['prev_tx_hash']\
  \ = blk_m.read(32)[::-1].hex()\n        inp['prev_tx_out_index'] = int.from_bytes(blk_m.read(4),\
  \ byteorder='little')\n        inp['bytes_coinbase_data'] = getVarInt(blk_m)\n \
  \       pos = blk_m.tell()\n        inp['bytes_height'] = getVarInt(blk_m)\n   \
  \     inp['height'] = int.from_bytes(blk_m.read(inp['bytes_height']), byteorder='little')\n\
  \        size = blk_m.tell() - pos\n        coinbase_arb_data_size = inp['bytes_coinbase_data']\
  \ - size\n        inp['coinbase_arb_data'] = blk_m.read(coinbase_arb_data_size).hex()\n\
  \        inp['sequence'] = int.from_bytes(blk_m.read(4), byteorder='little')\n \
  \       inp_l.append(inp)\n    tx['inputs'] = inp_l\n    tx['out_cnt'] = getVarInt(blk_m)\n\
  \    out_l = []\n    for i in range(tx['out_cnt']):\n        out = {}\n        out['satoshis']\
  \ = int.from_bytes(blk_m.read(8), byteorder='little')\n        out['bytes_scriptpubkey']\
  \ = getVarInt(blk_m)\n        out['scriptpubkey'] = blk_m.read(out['bytes_scriptpubkey']).hex()\n\
  \        out_l.append(out)\n    tx['outs'] = out_l\n    tx['locktime'] = int.from_bytes(blk_m.read(4),\
  \ byteorder='little')\n    return tx\n```\n\n**程序 6.14：** 从区块字节获取交易结构的程序\n\n要获取交易信息，我们使用修剪后的区块字节，创建一个内存映射文件对象，并将该对象作为参数传递给\
  \ `getCoinbaseTransactionInfo`。以下是调用代码：\n\n```\nif __name__ == '__main__':\n   \
  \ # 区块哈希为 000000000000000004ec466ce4732fe6f1ed1cddc2ed4b328fff5224276e3f6f 的修剪后区块\n\
  \    blk_b = bytes.fromhex('')\n\
  \    blk_m = mmap.mmap(-1, len(blk_b) + 1)\n    blk_m.write(blk_b)\n    blk_m.seek(0)\n\
  \    blkhdr = blk_m.read(80)\n    blk_size = getVarInt(blk_m)\n    tx = getCoinbaseTransactionInfo(blk_m)\n\
  \    print(json.dumps(tx, indent=4))\n```\n\n运行代码后，我们得到以下交易结构：\n\n![](img/Figure-6.28.jpg)\n\
  \n**图 6.28：** 显示使用程序获得的币基交易结构\n\n正如我们所见，交易的版本是 1。截至今天，比特币网络同时允许版本 1 和版本 2。如果交易脚本中使用了\
  \ BIP-68 功能，则必须使用版本 2；否则，两个版本没有区别。\n\n该交易有 1 个输入和 1 个输出。因为它是币基交易，所以没有输入交易，输入包含的交易哈希为零，索引为\
  \ `0xffffffff`。这表明这是一笔币基交易。\n\n接下来是 `coinbase_data` 的大小。自区块版本 2 起，这包含区块高度。\n\n币基交易中的\
  \ `coinbase_arb_data` 字段是一个任意字节序列，可以是矿工想放入的任何内容。有时，矿工会添加一条消息以表示对某些改进的支持。如果我们将十六进制代码转换为字节，可以看到隐藏的消息：\n\
  \n![](img/Figure-6.29.jpg)\n\n**图 6.29：** 显示币基任意数据上的内容\n\n我们可以看到消息 `BW Support 8M\
  \ fisher jinxin /BW Pool/`。该区块由 BW Pool 挖出，他们支持 8 MB 的区块大小。\n\n在输出中，前 8 字节是矿工支付给其比特币地址的比特币数量。该值以聪（satoshi）表示，这是比特币中最小的面额单位：\n\
  \n1 比特币 = 10⁸ 聪\n\n1 比特币 = 10⁶ μ₿\n\n1 比特币 = 10³ m₿\n\n因此，输出中所有 `satoshis` 的总价值等于区块奖励加上通过打包区块中的交易收集的交易费之和。\n\
  \n\n\n\n### UTXO\n\n向比特币地址的支付是通过一个称为 `scriptPubKey` 的脚本完成的。我们将在后续章节中了解比特币交易所使用的脚本。\n\
  \n其他交易如下图所示：\n\n![](img/Figure-6.30.jpg)\n\n**图 6.30：** 区块中其他交易的结构\n\nLocktime（锁定时间）将交易锁定至指定的时间或区块高度。这意味着交易将留在内存池中，而不会被包含在区块链中。指定的时间是过往时间中位数，而非区块时间。建议设置此字段。要使用\
  \ locktime，输入中的至少一个 Sequence（序列）字段不应等于 `0xffffffff`。\n\n输入包含前一笔交易的哈希值，也称为交易 ID，以及其未花费的输出，从中取值以支付输出。交易哈希是通过应用两次\
  \ SHA256 获得的，因此长度为 32 字节。`ScriptSig` 是包含签名的脚本，用于证明前一笔交易输出中持有的比特币属于创建本笔交易输入的人。\n\n\
  以下代码解析区块中的其他交易：\n\n```python\ndef getTransactionInfo(blk_m: mmap):\n    tx = {}\n\
  \    tx['version'] = blk_m.read(4)[::-1].hex()\n    tx['inp_cnt'] = getVarInt(blk_m)\n\
  \    inp_l = []\n    for i in range(tx['inp_cnt']):\n        inp = {}\n        inp['prev_tx_hash']\
  \ = blk_m.read(32)[::-1].hex()\n        inp['prev_tx_out_index'] = int.from_bytes(blk_m.read(4),\
  \ byteorder='little')\n        inp['bytes_scriptsig'] = getVarInt(blk_m)\n     \
  \   inp['scriptsig'] = blk_m.read(inp['bytes_scriptsig']).hex()\n        inp['sequence']\
  \ = int.from_bytes(blk_m.read(4), byteorder='little')\n        inp_l.append(inp)\n\
  \    tx['inputs'] = inp_l\n    tx['out_cnt'] = getVarInt(blk_m)\n    out_l = []\n\
  \    for i in range(tx['out_cnt']):\n        out = {}\n        out['satoshis'] =\
  \ int.from_bytes(blk_m.read(8), byteorder='little')\n        out['bytes_scriptpubkey']\
  \ = getVarInt(blk_m)\n        out['scriptpubkey'] = blk_m.read(out['bytes_scriptpubkey']).hex()\n\
  \        out_l.append(out)\n    tx['outs'] = out_l\n    tx['locktime'] = int.from_bytes(blk_m.read(4),\
  \ byteorder='little')\n    return tx\n```\n\n**程序 6.15：** 解析交易的程序\n\n要调用该方法，我们需要提供\
  \ `bblock` 字节的 `getTransactionInfo` 内存映射。以下是调用该方法的代码：\n\n```python\nif __name__\
  \ == '__main__':\n    # trimmed block for block hash 000000000000000082ccf8f1557c5d40b21edabb18d2d691cfbf87118bac7254\n\
  \    blk_b = bytes.fromhex('020000007ef055e1674d2e6551dba41cd214debbee34ae ')\n\
  \    blk_m = mmap.mmap(-1, len(blk_b) + 1)\n    blk_m.write(blk_b)\n    blk_m.seek(80)\n\
  \    tx_cnt = getVarInt(blk_m)\n    coinbase_tx = getCoinbaseTransactionInfo(blk_m)\n\
  \    tx = getTransactionInfo(blk_m)\n    print('Transaction:')\n    print(json.dumps(tx,\
  \ indent=4))\n```\n\n这将输出 Coinbase 交易之后的第一笔交易的以下内容：\n\n![](img/Figure-6.31.jpg)\n\
  \n**图 6.31：** 显示交易结构\n\n要计算交易哈希，我们需要获取交易字节，并通过应用两次 SHA256 并反转字节顺序进行哈希。以下方法从交易字节计算交易哈希：\n\
  \n```python\ndef getTransactionHash(start: int, end: int, blk_b: bytes):\n    b\
  \ = blk_b[start: end]\n    h1 = hashlib.sha256(b).digest()\n    h2 = hashlib.sha256(h1).digest()\n\
  \    tx_hash = h2[::-1].hex()\n    return tx_hash\n```\n\n**程序 6.16：** 从交易字节获取交易\
  \ ID 的程序\n\n以下代码调用该方法：\n\n```python\nif __name__ == '__main__':\n    # trimmed block\
  \ for block hash 000000000000000082ccf8f1557c5d40b21edabb18d2d691cfbf87118bac7254\n\
  \    blk_b = bytes.fromhex('020000007ef055e1674d2e6551dba41cd214debbee34ae ')\n\
  \    blk_m = mmap.mmap(-1, len(blk_b) + 1)\n    blk_m.write(blk_b)\n    blk_m.seek(80)\n\
  \    tx_cnt = getVarInt(blk_m)\n    coinbase_tx = getCoinbaseTransactionInfo(blk_m)\n\
  \    stb = blk_m.tell()\n    tx = getTransactionInfo(blk_m)\n    endb = blk_m.tell()\n\
  \    tx_hash = getTransactionHash(stb, endb, blk_b)\n    print('Transaction Hash\
  \ = %s' % tx_hash)\n```\n\n这给出了以下结果：\n\n![](img/Figure-6.32.jpg)\n\n**图 6.32：**\
  \ 显示使用程序从交易字节获得的交易哈希\n\n我们可以使用以下代码在 `txindex` 中搜索此交易：\n\n```python\ntxindex_db_g\
  \ = plyvel.DB(os.getenv('TX_INDEX_DB'), compression=None)\nBLOCK_HEADER_SIZE = 80\n\
  \ndef getTransactionIndex(tx_hash: bytes, txindex_db):\n    key = b't' + tx_hash\n\
  \    value = txindex_db.get(key)\n    jsonobj = {}\n    jsonobj['n_file'], pos =\
  \ b128_varint_decode(value)\n    jsonobj['block_offset'], pos = b128_varint_decode(value,\
  \ pos)\n    jsonobj['file_offset'], pos = b128_varint_decode(value, pos)\n    print(jsonobj)\n\
  \    return jsonobj\n\ndef findTransaction(tx_hash: bytes, txindex_db):\n    jsonobj\
  \ = getTransactionIndex(tx_hash, txindex_db)\n    print('Transaction Index:')\n\
  \    print(json.dumps(jsonobj, indent=4))\n    block_filepath = os.path.join(blocks_path_g,\
  \ 'blk%05d.dat' % jsonobj['n_file'])\n    with open(block_filepath, 'r+b') as blk_f:\n\
  \        blk_m = mmap.mmap(blk_f.fileno(), 0) # map whole file\n        blk_m.seek(jsonobj['block_offset']\
  \ + BLOCK_HEADER_SIZE + jsonobj['file_offset'])\n        tx = getTransactionInfo(blk_m)\n\
  \        blk_m.close()\n    return tx\n```\n\n**程序 6.17：** 使用数据库中的交易索引查找交易的程序\n\n\
  `findTransaction` 方法采用小端格式的交易哈希和链状态数据库来查询索引。以下是示例代码：\n\n```python\nif __name__ ==\
  \ '__main__':\n    tx_hash = bytes.fromhex('7301b595279ece985f0c415e420e425451fcf7f684fcce087ba14d10ffec1121')[::-1]\n\
  \    tx = findTransaction(tx_hash, txindex_db_g)\n    print(\"Transaction Info:\\\
  n\", json.dumps(tx, indent = 4))\n```\n\n运行此代码将给出关于交易在区块文件中位置的以下信息，以及一部分已解析的交易：\n\
