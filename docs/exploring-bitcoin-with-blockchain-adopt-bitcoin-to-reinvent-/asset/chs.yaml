  \ str):\n    pkh = base58checkDecode(address)\n    return pkh\n\ndef encodePushdata(length:\
  \ int):\n    if length <= 0x4b:\n        return bytes([length])\n    if length <=\
  \ 0xff:\n        return bytes([OP_PUSHDATA1, length])\n    if length <= 0xffff:\n\
  \        return bytes([OP_PUSHDATA2]) + struct.pack('<H', length)\n    if length\
  \ <= 0xffffffff:\n        return bytes([OP_PUSHDATA4]) + struct.pack('<L', length)\n\
  \ndef getScriptTypeFromAddress(address: str):\n    if address[0] in ['m', 'n'] or\
  \ address[0] == '1':\n        return \"P2PKH\"\n    elif address[0] == '2' or address[0]\
  \ == '3':\n        return \"P2SH\"\n```\n\n**Figure 10.16:** 构建交易所需的实用方法\n\n以下是创建交易时方法使用的操作码：\n\
