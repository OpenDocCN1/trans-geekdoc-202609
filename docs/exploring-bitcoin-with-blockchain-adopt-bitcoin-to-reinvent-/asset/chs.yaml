  \    index_b = bytes(4)\n    privkey_b = bytes.fromhex('%066x' % privkey)\n    raw_xprv\
  \ = depth_b + fingerprint_p_b + index_b + chaincode_b + privkey_b\n    xprv = base58checkEncode(version_b,\
  \ raw_xprv)\n    return xprv\n\ndef getMasterXPub(chaincode_b: bytes, pubkey: str):\n\
  \    version_b = bytes.fromhex(TPUB_VERSION)\n    depth_b = b'\\x00'\n    fingerprint_p_b\
  \ = bytes(4)\n    index_b = bytes(4)\n    pubkey_b = bytes.fromhex(pubkey)\n   \
  \ raw_xpub = depth_b + fingerprint_p_b + index_b + chaincode_b + pubkey_b\n    xpub\
  \ = base58checkEncode(version_b, raw_xpub)\n    return xpub\n```\n\n**程序 9.17：**\
  \ 派生主 XPrv 和主 XPub 的程序\n\n我们按如下方式调用该方法：\n\n```python\nxprv = getMasterXPrv(chaincode,\
  \ privkey)\nprint('xprv=%s' % xprv)\npubkey_b = privkeyHex2pubkey(privkey_s, True)\n\
  xpub = getMasterXPub(chaincode, pubkey_b.hex())\nprint('xprv=%s' % xpub)\n```\n\n\
  我们得到以下主 xpub 和 xprv：\n\n![](img/Figure-9.26.jpg)\n\n**图 9.26：** 显示主密钥的 xprv 和 xpub\n\
  \n在以下代码中，我们为给定的深度和索引生成 xprv 和 xpub：\n\n```python\ndef getXPrv(p_pubkey: str,\n \
  \           chaincode_b: bytes,\n            privkey: int,\n            depth: int,\n\
  \            index: int):\n    version_b = bytes.fromhex(TPRV_VERSION)\n    p_pubkey_b\
  \ = bytes.fromhex(p_pubkey)\n    privkey_b = bytes.fromhex('%066x' % privkey)\n\
  \    depth_b = bytes([depth])\n    p_fingerprint_b = hash160(p_pubkey_b)[0:4]\n\
  \    index_b = struct.pack('>L', index)\n    raw_xprv = depth_b + p_fingerprint_b\
  \ + index_b + chaincode_b + privkey_b\n    xprv = base58checkEncode(version_b, raw_xprv)\n\
  \    return xprv\n\ndef getXPub(p_pubkey: str,\n            chaincode_b: bytes,\n\
  \            pubkey: str,\n            depth: int,\n            index: int):\n \
  \   version_b = bytes.fromhex(TPUB_VERSION)\n    p_pubkey_b = bytes.fromhex(p_pubkey)\n\
  \    pubkey_b = bytes.fromhex(pubkey)\n    depth_b = bytes([depth])\n    p_fingerprint_b\
  \ = hash160(p_pubkey_b)[0:4]\n    index_b = struct.pack('>L', index)\n    raw_xpub\
  \ = depth_b + p_fingerprint_b + index_b + chaincode_b + pubkey_b\n    xpub = base58checkEncode(version_b,\
  \ raw_xpub)\n    return xpub\n```\n\n**程序 9.18：** 为给定深度和索引生成 XPub 和 XPrv 的程序\n\n\
