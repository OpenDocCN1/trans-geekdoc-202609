  \n`flog.close()`\n\n我们得到以下通信日志：\n\n![](img/Figure-7.12.jpg)\n\n**图 7.12：** 比特币连接建立期间消息交换的通信日志\n\
  \n在本子主题中，你学习了如何建立比特币连接。\n\n### 与非活跃对等节点断开连接\n\nTCP/IP 连接可能在对等节点不知情的情况下变为非活跃状态。为了断开非活跃连接，节点发送\
  \ `ping` 并期望收到 `pong` 作为响应。`ping` 消息包含一个 8 字节的 nonce（随机数）。在响应的 `pong` 消息中，接收节点将发回作为\
  \ `ping` 消息一部分接收到的相同 nonce 消息。\n\n以下方法解析 `ping` 消息并用 `pong` 消息进行响应：\n\n```\ndef\
  \ parsePingPongPayload(payload_m: mmap, payloadlen = 0):\n    payload = {}\n   \
  \ payload['nonce'] = int.from_bytes(payload_m.read(8), byteorder='little')\n   \
  \ return payload\n\ndef createPongPayload(nonce: int):\n    nonce_b = struct.pack('<Q',\
  \ nonce)\n    return nonce_b\n\ndef sendPongMessage(s: socket, recvmsg: dict):\n\
  \    # send pong message\n    sndcmd = 'pong'\n    nonce = recvmsg['payload']['nonce']\n\
  \    payload = createPongPayload(nonce)\n    sndmsg = createMessage(sndcmd, payload)\n\
  \    s.send(sndmsg)\n    print('==> cmd = %s, msg = %s' % (sndcmd, sndmsg.hex()),\
  \ file=flog)\n```\n\n**程序 7.9：** 发送 ping 和接收 pong 消息的程序\n\n如果对等节点用不同的 nonce 响应或不响应，则我们可以安全地假设它处于非活跃状态，并可以断开连接。\n\
  \n### 节点发现\n\n正如你所了解的，平均有近 10,000 个活跃节点，因此在网络中分发负载非常重要。近 95% 的全节点运行 Bitcoin Core，它有一些硬编码的\
  \ DNS 种子。如果这些节点仅依赖来自 DNS 种子的地址，那么这些地址可能会过载。这将阻碍比特币网络的去中心化特性，影响性能，并容易遭受**拒绝服务攻击**。\n\
  \n为了寻找新的对等节点，我们有以下时序图：\n\n![](img/Figure-7.13.jpg)\n\n**图 7.13：** 显示从对等节点接收节点地址步骤的时序图\n\
  \n与 `verack` 一样，`getaddr` 没有载荷。以下是 `addr` 消息的载荷结构：\n\n![](img/Figure-7.14.jpg)\n\
  \n**图 7.14：** addr 的载荷结构\n\n现在，我们将尝试从对等节点获取 `addr` 消息。为了获取 `addr` 消息，我们需要处理更多消息，因为对等节点可能会发送这些消息。此外，我们将发送较低的版本以避免收到\
  \ `sendcmpct` 请求。我们将使用版本 `70013`。以下是发送 `getaddr` 并接收 `addr` 的程序：\n\n```\ndef parseAddrPayload(payload_m:\
  \ mmap, payloadlen = 0):\n    payload = {}\n    payload['count'] = getVarInt(payload_m)\n\
  \    payload['addrs'] = []\n    for i in range(payload['count']):\n        addr\
  \ = {}\n        addr['timestamp'] = int.from_bytes(payload_m.read(4), byteorder='little')\n\
  \        addr['addr'] = parseIPAddress(payload_m)\n        payload['addrs'].append(addr)\n\
  \    return payload\n\ndef sendrecvHandler(s: socket, version: int):\n    if establishConnection(s,\
  \ version) == False:\n        print('Establish connection failed', file=flog)\n\
