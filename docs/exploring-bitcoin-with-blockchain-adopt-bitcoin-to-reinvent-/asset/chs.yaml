  \ 1![](img/Bitcoin.jpg) 30425 美元的市价，这相当于 4.75 美元。\n\n### 新标准脚本\n\n隔离见证引入了四个新的标准脚本。这些脚本在\
  \ BIP 143 中定义，可在以下 URL 找到：\n\n[`github.com/bitcoin/bips/blob/master/bip-0143.mediawiki`](https://github.com/bitcoin/bips/blob/master/bip-0143.mediawiki)\n\
  \n在下一节中，我们将了解这些脚本中的每一个，并构建程序以在主网区块链上验证交易。\n\n### 原生 SegWit 交易脚本\n\n除了保护资金转账免受交易延展性攻击外，SegWit\
  \ 交易还通过降低交易手续费提供了直接的经济利益。\n\n原生 SegWit 交易如下所示：\n\n`Previous scriptPubKey: <1-byte\
  \ witness version> <2-40 bytes witness program>`\n\n`ScriptSig: (empty)`\n\n`Witness\
  \ Data: <witness data>`\n\n我们可以看到，`previous scriptPubKey` 由两部分组成：见证版本和见证程序。这意味着每个见证版本可以有不同的程序。这是一种可扩展的结构，允许未来的增强。在本章中，我们讨论的是\
  \ Segwit 增强的第一个版本中引入的脚本。下一个版本用于 Taproot 和 Schnorr 签名。\n\n##### 原生 P2WPKH\n\n顾名思义，P2WPKH\
  \ 是 P2PKH 脚本的 SegWit 替代方案，我们已经在 *第 10 章，创建和验证交易* 中介绍过。\n\nP2WPKH 交易如下：\n\n`Previous\
  \ scriptPubKey: 0 <20-byte-PublicKeyHash>`\n\n`ScriptSig: (empty)`\n\n`Witness data:`\n\
  \n`<Signature>`\n\n`<PublicKey>`\n\n我们可以看到，见证数据与 P2PKH 中的 `scriptSig` 相同。因此，我们只需对脚本执行进行微小修改。我们需要执行以下操作：\n\
  \n1.  将 `previous scriptPubKey` 转换为 P2PKH 标准脚本。\n2.  在处理 `previous scriptPubKey`\
  \ 之前，将见证数据添加到栈中。\n\n我们修改了 *第 10 章，创建和验证交易* 中 P2SH 使用的程序，以执行这一确切活动，从而包含 P2WPKH 交易的验证。\n\
  \n我们通过以下步骤修改 `verifyScript` 以包含 P2WPKH 的检查。\n\n1.  如果 `scriptsig_b` 为空字符串，则添加对应所需输入索引的所有见证数据元素：\n\
  \n```\nif scriptsig_b == b'':\n    # native segwit\n    print('native segwit')\n\
  \    witness_l = getWitnessList(tx, inp_index)\n    pushWitnessData(witness_l)\n\
  else:\n    execScript(scriptsig_b, inp_index, tx)\n```\n\n2.  将 `Previous scriptPubKey`\
  \ 转换为标准 P2PKH 脚本：\n\n```\nif isP2WPKH(prev_scriptpubkey_b) == True:\n    print('P2WPKH')\n\
  \    # convert 0 <20-byte PKH> to OP_DUP OP_HASH160 <PKH> OP_EQUALVERIFY\n    prev_scriptpubkey_b\
  \ = bytes([0x76, 0xa9, 0x14]) + prev_scriptpubkey_b[2:] + bytes([0x88, 0xac])\n\
  \    is_segwit = True\n```\n\n以下是前面更改中使用的所有方法的定义：\n\n```\ndef pushWitnessData(witness_l:\
  \ list):\n    for data in witness_l:\n        st.append(bytes.fromhex(data['witness']))\n\
  \ndef getWitnessList(tx: dict, inp_index: int):\n    return tx['inputs'][inp_index]['witnesses']\n\
  \ndef isP2WPKH(prev_scriptpubkey_b: bytes):\n    #0014<20 bytes>\n    if len(prev_scriptpubkey_b)\
  \ == 22 and prev_scriptpubkey_b[0:2] == b'\\x00\\x14':\n        return True\n  \
  \  return False\n```\n\n**程序 12.6：** 验证 P2WPKH 脚本的程序更新\n\n以下是调用 `verifyScript` 以验证\
