  **Figure 9.25:** 扩展公钥推导的示意图\n\n对于主扩展公钥和扩展私钥，深度为零，父指纹为 4 字节的零。\n\n### 主扩展公钥和私钥\n\n\
  主密钥是所有密钥的根，知道其 `xpub` 密钥将允许生成所有后续密钥。你永远不应该有任何理由为根生成 `xpub` 或 `xprv`。然而，在本节中，你将学习生成\
  \ `xpub` 和 `xprv`。\n\n以下代码准备主 `xpub` 和 `xprv`：\n\n\n\n\n### 扩展公钥和私钥\n\n如果我们拥有根密钥的密钥和链码，就可以为密钥派生层级中的特定深度和索引生成\
