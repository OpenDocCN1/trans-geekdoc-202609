  _\\_\\_ 提出了智能合约的构想。\n    3.  比特币使用 \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 非对称加密。\n\
  \    4.  \\_\\_\\_\\_\\_\\_\\_\\_\\_ 是第一家在其国库中持有比特币的上市公司。\n    5.  1 MB 区块大小限制由\
  \ \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_ 设定。\n5.  判断题：\n    1.  比特币区块易于验证但极难挖掘。\n    2.\
  \  比特币不是最安全的网络。\n    3.  比特币是一种货币，而非资产。\n\n## 第 3 章：理解比特币网络\n\n在上一章中，您了解了促成比特币诞生的技术发展。您还了解了比特币白皮书发布以来发生的事件，并尝试理解对比特币的需求、它解决的问题，以及解决该问题如何改变世界。\n\
  \n当我们从钱包向他人的地址支付比特币时，会创建一笔交易并广播到比特币网络。该交易进入内存池，矿工挖掘一个包含该交易的区块。为了实现这一过程，比特币网络需要相互通信，并在网络上发布这些交易和区块。比特币网络在实现网络去中心化方面发挥着重要作用。\n\
  \n在本章中，我们将首先了解构成比特币网络的不同类型的节点。我们将理解为什么需要不同类型的节点以及它们如何相互交互。然后我们将了解比特币共识网络、其构建模块，以及共识网络的每个组件为何必需。\n\
  \n### 结构\n\n本章将涵盖以下主题：\n\n*   比特币物理网络拓扑\n    *   挖矿节点\n        *   矿池挖矿\n      \
  \  *   独自挖矿\n    *   全节点\n    *   简化支付验证 (SPV)\n*   比特币共识网络\n    *   交易\n    * \
  \  区块链\n    *   共识规则\n    *   工作量证明 (PoW)\n    *   验证节点\n    *   内存池\n    *   密码学\n\
  \    *   Gossip 协议\n*   比特币网络安全\n\n### 目标\n\n本章的目标是让读者对比特币网络有一个高层级的理解。这将帮助您理解比特币的核心概念（如去中心化和抗审查性）是如何融入其设计中的。此外，它将帮助您在后续章节中更直观地掌握内容，我们将在后续章节中深入探讨技术并进行编程。\n\
  \n它还将帮助您了解当您进行支付时后台可能发生的事情，以及交易是如何被包含在区块链中的。\n\n### 比特币物理网络拓扑\n\n比特币网络由相互交互以发送和接收交易及区块的节点组成。节点可以随时加入或离开比特币网络。\n\
  \n交易类似于账本条目，包含资金来源、资金接收方和转账金额。这些交易由矿工添加到区块中，并广播给其他节点。\n\n下图展示了比特币网络拓扑：\n\n![](img/Figure-3.1.jpg)\n\
  \n**图 3.1：** 比特币网络拓扑\n\n在上图中，矿工创建区块并将其转发给其他节点。独自挖矿的矿工也会接收区块，因为它也是一个全节点。全节点负责验证交易和区块并将其转发。SPV\
  \ 节点是依赖全节点获取必要信息的轻量级节点。\n\n矿池挖矿节点连接到矿池服务器。矿池挖矿节点从服务器接收任务，并根据接收到的任务尝试挖掘区块。如果成功，矿池矿工将区块发送给服务器。矿池服务器也从其他节点接收区块和交易，这就是为什么从矿池挖矿节点指向矿池服务器有一个箭头的原因。除此之外，比特币网络是点对点且非层级化的。\n\
  \n##### 挖矿节点\n\n挖矿节点竞争解决加密难题，率先解开难题的节点能够构建一个包含选定交易的区块。当交易被包含在区块中时，即获得确认。因此，挖矿是交易确认的行为。\n\
  \n利用算力解决加密难题以确认交易被称为**工作量证明**。\n\n矿工可以选择独自挖矿或加入矿池。\n\n下图展示了挖矿设备：\n\n![](img/Figure-3.2.jpg)\n\
  \n**图 3.2：** 运行中的挖矿设备\n\n### 矿池挖矿\n\n如今，只有加入矿池挖矿才有利可图。在这种情况下，矿工加入矿池以协作完成挖矿工作。矿池中的每个矿工都尝试解决加密难题，矿池知晓矿工贡献的算力。矿工解决加密难题，矿池获得区块奖励。然后矿池根据矿工对算力的贡献比例，将区块奖励分配给池中所有矿工。解开难题的矿工不会获得任何特殊优势。这种设置对所有矿工都有利，因为解开难题基于由算力贡献决定的概率。矿工不直接与网络交互；相反，他们由矿池服务器分配任务。\n\
  \n### 独自挖矿\n\n比特币的算力需求已变得极高，几乎不可能单独挖掘区块。然而，这有一个好处。目前，少数矿池掌握了网络几乎所有的算力。只需几个矿池联手，比特币网络就会面临\
  \ 51% 攻击。如果大多数节点是独自挖矿者，这是不可能的。因此，通过独自挖矿，我们可以使挖矿更加去中心化。\n\n### 全节点\n\n全节点是保存区块链副本并验证其接收到的所有交易和区块的验证节点。它们还将区块和交易转发给其他节点。\n\
  \n### 简化支付验证 (SPV)\n\nSPV 节点是轻量级节点，这意味着它们不维护完整的区块链，且在没有全节点帮助的情况下无法验证区块。SPV 需要极少的磁盘空间，可设置在嵌入式设备上或在内存中运行，使其维护和携带成本更低。\n\
  \n### 比特币共识网络\n\n\n\n\nBitcoin 共识网络基于工作量证明（Proof-of-Work，PoW）共识机制。交易通过节点的帮助，使用 Gossip\
  \ 协议在网络上创建和发布。验证节点或全节点验证接收到的交易，然后将其添加到其内存池中。矿工利用其算力解决加密谜题，以创建包含其想要打包交易的区块。该区块与前一个区块链接。创建的区块即为工作量证明，区块链形成区块链。矿工随后使用\
  \ Gossip 协议将新创建的区块发布到 Bitcoin 网络。验证节点接收区块，根据共识规则进行验证，并再次使用 Gossip 协议将其转发给连接的节点。所有这些活动都使用了密码学。\n\
  \n以下是 Bitcoin 共识网络的示意图：\n\n![](img/Figure-3.3.jpg)\n\n**Figure 3.3:** Bitcoin 共识网络\n\
  \nBitcoin 共识网络的关键组件如下：\n\n*   交易\n*   区块链\n*   共识规则\n*   工作量证明\n*   验证节点\n*   内存池\n\
  *   密码学\n*   Gossip 协议\n\n这些将在以下章节中解释。\n\n##### 交易\n\n交易是支出的单条记录。它包含三个要素：\n\n* \
  \  资金来源\n*   资金接收方\n*   每个接收方收到的金额\n\n以下是交易的示意图：\n\n![](img/Figure-3.4.jpg)\n\n\
  **Figure 3.4:** Bitcoin 交易资金来源与支付\n\n### 区块链\n\n区块链是记录交易的不可变区块序列。区块链也按时间顺序排列。每个区块链接到其前一个区块。链的末端是最近的区块。\n\
  \n以下是基于所学内容的区块链结构示意图：\n\n![](img/Figure-3.5.jpg)\n\n**Figure 3.5:** 区块链的结构\n\n###\
  \ 共识规则\n\nBitcoin 网络像网络协议一样，对区块和交易有约定俗成的规则。这些规则旨在通过工作量证明共识机制由矿工来保护。\n\n### 工作量证明\n\
  \n工作量证明或 PoW 是一种机制，旨在通过强制攻击者消耗算力来防止拒绝服务攻击。这使得拒绝服务攻击对攻击者而言不可行。Bitcoin 使用工作量证明使双重支付变得非常困难且成本高昂。\n\
  \n可以通过以下类比来理解：\n\n在古代，有房屋、神庙、水井等，它们很容易复制，但也有纪念碑、堡垒等，它们是独一无二的。埃及金字塔、中国长城、印度埃洛拉石窟的凯拉萨神庙等纪念碑，是数百年来仍然非常难以复制的最伟大纪念碑之一。它们的共同点是建造难度大。这种难度使它们在几个世纪中保持了独特性。建筑结构本身就是为建造它们而付出的艰苦劳动的证据。工作的证据称为工作量证明。\n\
  \n下图展示了两个著名的纪念碑：\n\n![](img/Figure-3.6.jpg)\n\n**Figure 3.6:** 独特且著名的纪念碑\n\n每个矿工竞争算力以解决加密谜题，并将交易区块作为区块链中的下一个区块创建出来。在创建一定数量的区块后，加密谜题的难度会调整，以增加或减少解决加密谜题的平均时间。因此，挖矿设备制造公司也在其成本效益方面进行竞争。挖矿领域的这种博弈保持了网络的安全，并保护其免受双重支付攻击。\n\
  \n> **这是一种机制，其中一方需要向验证者证明其已执行了所需的工作（或算力），以便被允许执行某些任务。**\n\n随着区块深入链中，修改任意区块的难度呈指数级增加。尽管矿工们在竞争创建区块，但他们同意共识规则的条款。这就是为什么它被称为*工作量证明*共识机制。许多加密货币和区块链技术使用其他形式的共识机制，例如*权益证明、权威证明、实用拜占庭容错*等。\n\
  \n挖矿可以定义为*工作量证明的实践*。\n\n我们知道矿工会加入并形成矿池。少数矿池控制了大部分网络算力。如果排名前两到三位的矿工联合，他们可以胜过其余矿工。\n\
  \n2014 年 7 月，`Ghash.io` 达到了超过半数的网络算力，但后来同意永远不会超过 50% 的算力。重要的是要理解为什么从那以后我们从未出现过这种情况，以及为什么任何矿工都会同意不接管网络。\n\
  \n挖矿还为网络增加了价值，这意味着尽管矿工可以联合并阻止来自特定国家或交易所的交易，但他们不会做任何会被注意到并影响其收入来源——网络的事情。\n\n###\
  \ 验证节点\n\nBitcoin 并不完全依赖挖矿节点来防止双重支付；相反，它还有验证节点来验证接收到的所有交易和区块。验证节点也称为全节点，这些节点进一步广播交易和区块。\n\
  \n### 内存池\n\n内存池是未确认交易的内存存储。矿工从内存池中挑选交易，只有有效交易才存储在内存池中。交易可能因长时间未被打包进区块链而过期。内存池中的交易未被确认，并可能因竞争条件而变为无效。\n\
  \n### 密码学\n\n密码学是 Bitcoin 的核心。它用于工作量证明、交易、区块链和验证。\n\n以下是密码学在 Bitcoin 网络中的用途：\n\n\
  *   挖矿节点需要解决加密谜题以创建交易区块。\n*   每个区块使用密码学保护所有交易免遭篡改。\n*   每个区块使用加密哈希保护区块链免遭篡改。\n*\
  \   交易使用密码学从来源解锁资金并将其锁定供接收方领取。\n\n### Gossip 协议\n\nBitcoin 交易和区块需要快速到达几乎所有节点。Bitcoin\
  \ 节点始终监听连接的节点，并让它们知道其拥有的 Bitcoin 区块链中的区块。当节点接收到区块或交易时，它根据共识规则进行验证，然后将其发送给需要它的节点。Gossip\
  \ 协议是使用包含命令和有效载荷的消息在节点间通信的方法。\n\n以下是 Gossip 协议在消息广播中的示意图：\n\n![](img/Figure-3.7.jpg)\n\
  \n**Figure 3.7:** 消息广播中 Gossip 协议的简单表示\n\n### Bitcoin 网络安全\n\n保护网络安全不仅是数学或密码学问题，也是博弈论问题。Bitcoin\
  \ 网络由密码学和博弈论共同保护。因此，有许多因素共同作用以保护网络安全：\n\n*   挖矿使得修改区块变得困难，且随着区块深入区块链，难度呈指数级增加。\n\
  *   挖矿难度增加了网络的价值。其价值不仅体现在算力上，还体现在成本和时间上。\n*   挖矿设备公司在其设备的成本效益方面进行竞争。\n\n\n\n\n*\
  \ 验证节点监视网络，确保网络按预期运行。\n* 许多区块浏览器网站和独立爱好者也在以不同方式观察网络。他们持续监控节点、区块链和内存池。\n\n### 结论\n\
  \n在本章中，您了解了比特币网络的网络拓扑。您学习了比特币网络中存在的不同类型节点及其角色和必要性。随后，您理解了比特币共识机制的工作原理，以及构成比特币共识网络的不同组件。我们还涵盖了这些组件中的每一个，使我们能在不深入研究其实际运作的情况下，对比特币网络的结构和功能有一个公平的理解。\n\
  \n在下一章中，您将了解比特币在现实世界中的使用方式，并学习不同国家关于比特币使用的监管规定。\n\n### 重点回顾\n\n* 挖矿是工作量证明的实际运作。\n\
  * 比特币网络由矿池服务器、矿池矿工节点、独矿工、全节点和 SPV 节点组成。\n* 矿池矿工节点不直接与比特币网络交互；相反，它们依赖矿池服务器获取任务。\n\
  * 独自挖矿解决加密谜题的机会微乎其微。\n* 全节点也称为验证节点，因为它们根据共识规则验证区块和交易。\n* Gossip 协议（闲聊协议）是节点间使用包含命令和载荷的消息进行通信的方法。\n\
  \n### 问题\n\n1. 区块验证与区块确认有何不同？哪个节点负责区块验证，哪个节点负责区块确认？\n2. 前四大矿池是哪些？它们目前占网络算力的份额是多少？\n\
  3. 如果您打算购买比特币挖矿设备，您会关注哪些参数？如何判断哪种设备更适合您？\n4. 如果矿工无法将内存池中收到的所有交易容纳进下一个区块，它将依据什么标准选择交易加入下一个区块？\n\
  5. 填空：\n    1. 比特币网络是一个 __________ 网络，这意味着没有服务器和客户端，也没有层级之分。\n    2. 在矿池挖矿中，__________\
  \ 解决加密谜题，__________ 连接比特币网络以获取区块。\n    3. SPV 需要 __________ 节点来验证传入的区块。\n6. 判断正误：\n\
  \    1. 挖矿节点不需要内存池。\n    2. 节点可以随时加入和离开比特币网络。\n    3. 每个全节点都维护一份区块链副本。\n\n### 第\
  \ 4 章\n\n# 现实世界中的比特币\n\n在上一章中，您了解了比特币网络结构和共识网络的基础知识。这让我们对比特币网络的工作原理和结构有了基本认识。\n\n\
  在本章中，您将了解不同的人和组织如何使用比特币。您将学习我们与网络交互的多种方式。您将学习交易者、投资者、企业和数字游民如何使用比特币。此外，您还将了解不同类型的交易所，以及一些关于比特币监管的知识。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 不同类型的交易所\n* 比特币用例\n    * 比特币交易\n    * 比特币投资与储蓄\n\
  \        * 在线商家接受比特币\n        * 实体店接受比特币\n        * 以比特币支付或接收工资\n        * 使用比特币支付费用和旅行\n\
  \        * 比特币用于汇款\n        * 比特币用于社会公益\n        * 挖掘比特币\n* 比特币与加密货币监管\n\n### 目标\n\
  \n本章的主要目标是让读者对比特币如何融入现实世界以及如何使用它有一个公平的认识。我们将从不同视角审视比特币生态系统。虽然本书面向技术受众，但我们认为解决方案始终是为受众构建的。因此，了解受众的需求有助于构建正确的解决方案。此外，这有助于拓宽我们对比特币技术的视角。\n\
  \n由于上一章侧重于网络的结构和工作原理，而本章将侧重于比特币与现实世界的联系，读完本章后，您将对比特币网络和货币/资产拥有内在和外在的双重视角。\n\n###\
  \ 不同类型的交易所\n\n加密货币交易所允许将加密货币兑换为其他加密货币或法定货币。加密货币交易所可根据不同因素以多种方式分类。\n\n根据加密货币的托管情况，交易所还可分为：\n\
  \n* **托管型交易所**：在钱包中持有比特币的交易所\n* **非托管型交易所**：不在钱包中持有比特币的交易所\n\n在交易所，卖方需要找到买方来出售他们的加密货币。这可以通过使用交易所作为平台的托管方式完成，也可以对用户隐藏这一过程，由交易所负责在买卖双方之间转移加密货币。这些类型的交易所可分类如下：\n\
  \n* **点对点交易所**：在点对点交易所中，交易所充当托管角色。在卖方收到款项之前，交易所将待售加密货币保管在托管账户中。一旦卖方确认已收到期望的款项，交易所将加密货币释放到买方账户。否则，可能会进入争议解决流程，交易所会雇佣人员单独处理争议。买方或卖方发布价格，另一方浏览并根据价格、偏好、评价和推荐选择合适的交易对手。`Paxful`\
  \ 和 `LocalBitcoins` 是点对点交易所的例子。\n* **零售交易所**：零售交易所是最常见的交易所形式。它们允许买方出价（`bid`）其愿为加密货币支付的最高价，同时允许卖方报价（`ask`）其愿接受的最低价。其余事宜由交易所管理。这些交易所属于托管型，并在买卖价差中维持利润空间以应对市场波动。`Zebpay`、`WazirX`、`Unocoin`、`Coinbase`\
  \ 和 `Kraken` 是零售交易所的一些例子。\n* **即时兑换器**：这些交易所具有固定的买卖价格，无需托管。这使得它们易于实现，且运营相对简单。`InstaBitco.in`、`Changelly`\
  \ 和 `ShapeShift` 是即时交易所的例子。\n    * **比特币 ATM**：这些是能将现金兑换为比特币，或在收到比特币后出钞的即时兑换器。\n\
  \n零售交易所在赋予加密货币价值方面发挥着重要作用。这些交易所也是最适合交易者的，因为它们提供实时图表和用于开发交易应用的 API。另一方面，点对点交易所提供一定的隐私性，并允许现金支付。\n\
  \n交易所还可分类如下：\n\n* **中心化交易所**：中心化交易所由公司或组织托管和管理，它们获取利润、提供客户服务，并在争议发生时解决纠纷。\n* **去中心化交易所\
  \ (DEX)**：去中心化交易所是非托管的点对点交易所。这些也是非托管型交易所。它们作为**去中心化自治组织**或**DAO**启动，由于其去中心化的性质，这些交易所提供抗审查能力。它们不需要\
  \ KYC 或 AML。`Bisq` 是点对点交易所的一个例子。\n\n\n\n\n### 比特币用例\n\n在本主题中，您将了解交易者、投资者、旅行者、自由职业者和矿工与比特币网络交互的不同方式。\n\
  \n#### 比特币交易\n\n本主题不涉及交易建议；相反，您将了解交易者如何进行比特币交易。\n\n交易的目标是从交易工具的波动性中赚钱。这需要对加密货币的当前和历史价格走势进行大量分析，并从经济和政治事件及状况等真实事件中收集指标。\n\
  \n因此，交易者需要执行以下操作：\n\n*   分析历史和当前的价格走势。\n*   根据价格或其他事件，把握货币、稳定币和其他加密货币之间资金流动的时机。\n\
  *   存入和提取资金。\n\n因此，交易者需要提供以下功能的交易所：\n\n*   多种加密货币\n*   稳定货币，以及加密货币与 EUR、USD、YEN\
  \ 或 GBP 等稳定货币之间的便捷兑换\n*   能够下买单和卖单\n*   托管钱包\n\n用于买入、卖出、下买单和卖单的 Web API 可能会很有用。\n\
  \n因此，非托管交易所或 P2P 交易所对交易者没有帮助。交易者需要一个托管交易所，为他们提供下买单和卖单的能力。对交易 API 的支持非常有用，因为它可以集成到交易者的应用程序中，这些应用程序可以从交易所获取必要数据，以决定买单和卖单的目标价格，或将货币兑换为其他加密货币、稳定货币或稳定加密货币。\n\
  \n以下是比特币的历史价格图表：\n\n![](img/Figure-4.1.jpg)\n\n**图 4.1：** 比特币历史价格图表\n\n#### 比特币投资与储蓄\n\
  \n投资者关注长期收益，而储蓄者将比特币视为价值存储，这对他们的子孙后代可能很有用。投资者和储蓄者不关注短期价格波动。对他们而言，安全性是更大的顾虑，微小的价格差异并不重要。\n\
  \n投资者或储蓄者需要以下条件：\n\n*   在安全的保险库或钱包中持有比特币\n*   私钥掌握在自己手中\n*   投资者可能还希望设定一个未来的卖出目标价格\n\
  \n因此，投资者或交易者将从可靠安全的交易所购买比特币，并将其转移到自己的硬件钱包中。当他们需要卖出时，可以将所需的比特币再次转移到交易所并卖出。\n\n下面是投资者买卖比特币的示意图：\n\
  \n![](img/Figure-4.2.jpg)\n\n**图 4.2：** 投资者在零售交易所买卖比特币\n\n#### 在线商家接受比特币\n\n作为商家接受比特币很简单：只需在您的网站上放置一个比特币地址及其二维码。这种方法的问题在于，您将不知道是谁付款以及付了多少，且不建议在一个地址上接受所有付款。\n\
  \n有许多支付处理器可以集成到您的网站中，例如 Coinbase Commerce、coingate、btcpay、bitpay 等。或者，如果您正在创建网站，可以使用\
  \ Shopify 或 WooCommerce 来构建网站，它们提供与许多流行支付处理器集成的选项。\n\n下面是集成了加密货币支付的在线网站示意图：\n\n\
  ![](img/Figure-4.3.jpg)\n\n**图 4.3：** 网站与第三方支付处理器集成\n\nBTCPay 是一个开源、自托管的支付处理器，可以与一些流行的硬件钱包集成。使用集成了硬件钱包的自托管开源支付处理器有诸多好处。我们可能需要使用固定的比特币地址，或者可能需要使用中心化支付处理器提供的钱包服务。在线钱包面临被黑客攻击的风险。\n\
  \n另一方面，中心化支付处理器方便且通常更便宜，因为自托管服务器需要云托管。此外，BTCPay 仅支持比特币支付，这对在线商店来说限制很大。\n\n下面是自托管支付处理器与硬件钱包集成的示意图：\n\
  \n![](img/Figure-4.4.jpg)\n\n**图 4.4：** 网站与自托管支付处理器集成\n\n与供应商、服务提供商和客户有频繁交易的大品牌和聚合公司，可以在闪电网络上建立支付通道。这将允许他们降低单笔交易的成本。\n\
  \n##### 闪电网络\n\n闪电网络是比特币网络之上的第二层解决方案。在闪电网络中，会在发送方和接收方之间创建一个通道，并在其中锁定比特币。\n\n![](img/Figure-4.5.jpg)\n\
  \n**图 4.5：** 闪电通道的创建\n\n然后，只要通道中有余额，发送方就可以进行发送。\n\n![](img/Figure-4.6.jpg)\n\n**图\
  \ 4.6：** 使用通道进行支付\n\n发送方或接收方可以随时关闭通道。关闭通道时，所有先前交易的累积结果会被记录到比特币区块链上，此时必须支付网络费用。\n\
  \n![](img/Figure-4.7.jpg)\n\n**图 4.7：** 关闭通道并将最终余额发布到区块链\n\n在关闭通道前，该通道上发生的交易越多，每笔交易的有效费用就越低。这降低了有效网络费用，使小额交易变得可行。\n\
  \n#### 实体店接受比特币\n\n由于交易费用已大幅上涨，比特币不再适合买咖啡。在撰写本书时，平均交易费用为 15 美元。它仍然适合购买价格较高的商品。\n\
  \n由于用比特币付款的人很少，最好的方法是放置比特币地址的二维码，并每天更换。\n\n或者，像 Samourai Wallet 这样的比特币钱包支持称为 PayNyms\
  \ 的可重复使用支付代码，可用于接收付款。这只能作为一种替代方案，因为大多数钱包不支持 PayNyms。\n\n下面是实体店使用 PayNyms 接收比特币付款的示意图：\n\
  \n![](img/Figure-4.8.jpg)\n\n**图 4.8：** 在零售店使用支持 PayNym 的移动钱包\n\n#### 以比特币支付或接收工资\n\
  \n世界上有许多人以加密货币形式获得报酬。他们大多是独立承包商或自由职业者，不受地点限制，只需一个互联网连接和一台笔记本电脑即可工作。他们可以从硬件设备生成比特币地址，并将款项接收到自己的钱包中。\n\
  \n这非常适合一对一付款，但对于拥有十几名员工的公司来说却很困难。此外，并非所有员工都对同一种货币感兴趣。每位员工可能需要不同类型的货币，如当地法币、比特币、以太坊或\
  \ XRP。\n\nBitwage 是一款可以解决此问题的应用程序。它允许雇主以最适合他们的货币支付，而员工可以以他们需要的任何货币接收款项。下面是雇主与员工之间工资支付分配的示意图：\n\
  \n![](img/Figure-4.9.jpg)\n\n**图 4.9：** 雇主使用 BitWage 向全球分布式团队支付工资\n\nBitwage 还允许您将发送到银行的常规付款转换为加密货币。\n\
  \n#### 使用比特币支付费用和旅行\n\n比特币价格呈指数级上涨，许多人获得了巨额利润。此外，还有不受地点限制的合同工，他们以比特币或其他加密货币形式获得报酬。\n\
  \n以比特币形式获得报酬或因投资比特币而获得巨额利润的人，可能会利用他们的比特币环游世界。\n\n\n\n\n\n由于比特币不适合小额支付，比特币持有者可以购买礼品卡，以便在商店、酒店使用或购买机票。像\
  \ `Bitrefill`、`eGifter`、`Gyft` 等礼品卡提供商提供比特币到礼品卡的便捷兑换。有些提供商甚至支持闪电网络，通过创建通道，可以有效降低比特币网络手续费。\n\
  \n下图演示了使用比特币购买礼品卡并消费的过程：\n\n![](img/Figure-4.10.jpg)\n\n**图 4.10：** 用比特币购买礼品卡并在购物中使用\n\
  \n#### 比特币用于汇款\n\n比特币也被用于跨境汇款。汇款是指外籍工人、居民及有海外联系的公民为资助其海外家庭而进行的非商业性资金转移。比特币允许直接将资金转入接收方的钱包，该钱包可以是硬件钱包、移动钱包或托管交易所的钱包。存在专门针对汇款设计的服务，如\
  \ `BitPesa`。在 `BitPesa` 中，发送方发送比特币，接收方将在其银行账户或移动钱包中收到法币。\n\n下图演示了 BitPesa 汇款网络：\n\
  \n![](img/Figure-4.11.jpg)\n\n**图 4.11：** BitPesa 帮助非洲移民汇款回家\n\n#### 比特币用于社会公益\n\
  \n社会服务组织需要在银行系统覆盖有限的地区，与相关人群打交道。很多时候，这些地方处于战区、极权统治或军事管制之下。因此，法律和金融体系并不利于那些需要受保护的人。所以，社会服务组织必须绕过现有体系，利用自身资源。比特币因其抗审查特性，在这些情况下提供了帮助。许多知名的全球社会服务组织支持加密货币支付。联合国儿童基金会（UNICEF）就是其中之一；它已推出加密货币基金，以接收加密货币捐赠。\n\
  \n#### 比特币挖矿\n\n比特币挖矿是获取比特币的方式之一。它对价格非常敏感，因此即使使用最高效的设备，利用普通电力连接进行比特币挖矿在财务上也是不可行的。要使比特币挖矿盈利，电力成本需要极低，或者是原本会被浪费的多余电力。\n\
  \n比特币挖矿还会产生大量热量和噪音。如果热量被用于供暖或烧水，可能会进一步提高其财务可行性。在寒冷国家，一些人利用比特币挖矿为家庭供暖，并为温室植被提供热量。\n\
  \n因此，降低比特币挖矿成本的常见方法如下：\n\n*   使用无需电池储能的太阳能电池板、风力涡轮机等廉价能源。\n*   油井利用废气作为挖矿能源。\n*\
  \   发电厂产生的多余能源。\n*   利用产生的热量。\n    *   作为燃气热水器加热水\n    *   供暖房屋\n    *   为温室农场供热\n\
  *   选择最高效的比特币挖矿设备。\n*   加入矿池。\n\n随着盈利能力随时间下降，比特币挖矿还要求定期升级挖矿设备。\n\n#### 比特币与加密货币监管\n\
  \n我们在上一主题讨论的所有用例均受特定国家法律约束。在将比特币用于任何活动前，请了解您所在国家的法律。\n\n请记住，加密货币很少被允许作为法定货币。因此，即使在比特币使用合法的国家，将其作为法定货币使用也是非法的。法定货币可定义如下：\n\
  \n> 法定货币是指可用于偿还债务等清偿金融纠纷的任何事物。\n\n加密货币监管大致可分为：\n\n*   **宽松型**：加密货币监管完善的国家，个人可进行交易、购买商品、挖矿和接收支付。\n\
  *   **限制型**：对加密货币特定活动予以限制的国家。许多国家不允许加密货币与本地货币相互兑换。可能对商品买卖或支付有限制。也可能限制企业从事加密货币业务。或者，银行可能不被允许推出加密货币相关金融工具。\n\
  *   **争议型**：加密货币处于无监管状态的国家。\n*   **禁止型**：一些国家全面禁止加密货币交易。一些国家甚至将其定为可处罚的犯罪。\n\n许多国家正计划监管加密货币，因此目前不监管的国家未来可能会实施监管。这是一个动态变化的领域。\n\
  \n下图展示了各国当前的监管状况：\n\n![](img/Figure-4.12.jpg)\n\n**图 4.12：** 国际比特币监管\n\n请注意，本书上市时，上述信息可能已过时。\n\
  \n在印度，加密货币监管目前尚不明确。2018 年 4 月，印度储备银行（该国央行）发布通告，禁止银行从事加密货币业务。这导致任何使用注册银行账户从交易所购买加密货币的人的银行账户被冻结。这使得加密货币交易变得困难，许多企业和交易所破产或关门歇业。尽管如此，比特币在印度从未被禁止；因此，一些交易所通过提供点对点交易平台，利用法律漏洞继续运营。\n\
  \n2020 年 3 月，印度最高法院（该国最高法院）推翻了印度储备银行的通告，允许使用银行账户进行加密货币交易。从事加密货币交易的人一直需要为利润缴税，尽管适用哪些税法条款尚不明确。\n\
  \n在 2022 年联合预算案中，印度财政部长就加密货币税收提供了指导。尽管加密货币现在受到监管，但仍不被视为合法。而且，加密货币交易仍然困难。\n\n许多发达国家如美国、欧盟国家和日本已建立完善的监管框架，保护投资者和企业家。\n\
  \n### 结论\n\n在本章中，您了解了我们与比特币及比特币网络交互的方式。您首先了解了不同类型的交易所、其特点及为用户提供的益处，随后我们探讨了交易者、投资者、自由职业者、旅行者和矿工如何与比特币网络交互。我们还建议了不同人群使用比特币的实用方式。然后，我们尝试对国际监管进行分类，并审视了印度的监管现状。\n\
  \n这标志着以用户视角聚焦比特币生态系统的章节结束。我们已在第一章涵盖比特币概述。读完本章后，您将对比特币、比特币网络和比特币生态系统有一个基础而广泛的理解。\n\
  \n在下一章中，我们将通读比特币白皮书，帮助您详细理解它。\n\n### 重点回顾\n\n*   点对点交易所基于托管模式运作，交易所充当第三方。\n*   零售交易所允许买家对其可支付的加密货币最高价进行\
  \ `bid`（出价），允许卖家对其可接受的加密货币最低价进行 `ask`（要价）。\n*   零售交易所通过 `bid`（出价）和 `ask`（要价）尝试发现加密货币的价值。这有助于加密货币形成其价值。\n\
  *   比特币 ATM 是处理现金交易的即时交易所。\n\n\n\n\n*   去中心化交易所（DEX）是非托管的点对点交易所。\n*   交易者通过交易标的的波动性获利。\n\
  *   投资者通过持有加密货币寻求长期收益。\n*   储蓄者将加密货币视为价值存储手段。\n*   加密货币支付处理器可集成到网站中，以启用加密货币支付功能。\n\
  *   闪电网络允许双方在累积交易被添加到区块链之前，进行多笔链下交易。\n*   PayNyms 是可公开分享的可重复使用支付代码，可生成唯一的未使用地址。\n\
  *   礼品卡是利用比特币进行零售购物的最简便方式。\n*   比特币矿工需要廉价的能源来源，并利用产生的热量。\n*   比特币矿工需要始终用市场上最高效的设备更新其设备。\n\
  *   法定货币是指可用于偿还金融债务的任何事物。\n\n### 问题\n\n1.  零售交易所与点对点交易所有何不同？\n2.  “Not your keys,\
  \ not your bitcoin”（私钥不在你手中，比特币就不属于你）这句话是什么意思？\n3.  随机选择 10 个国家，并根据这些国家加密货币的法律地位对其进行分类。\n\
  4.  调查并了解 BitPesa 为何在非洲如此成功。\n5.  将下列项目匹配：\n    1.  汇款\n    2.  薪资\n    3.  即时兑换商\n\
  \    4.  商家\n    与：\n    1.  BtcPay\n    2.  BitWage\n    3.  ATM\n    4.  BitPesa\n\
  6.  判断正误：\n    1.  托管交易所不为比特币钱包提供针对黑客攻击的保险。\n    2.  价值存储意味着金融工具中的价值是安全的。\n    3.\
  \  如果一个国家不监管加密货币，则无需缴纳税款。\n\n### 第 5 章\n\n# 白皮书\n\n*中本聪* 发布了题为 “*Bitcoin: A Peer-to-Peer\
  \ Electronic Cash System*”（比特币：一种点对点的电子现金系统）的比特币白皮书。该文档可在 **[`bitcoin.org/bitcoin.pdf`](https://bitcoin.org/bitcoin.pdf)**\
  \ 获取。比特币和大多数加密货币均基于此白皮书。深入理解白皮书对于理解后续章节的内容至关重要。本章重点讲解白皮书的内容。\n\n该白皮书不受任何版权保护，因为论文的创作者是匿名的，且从未对该论文主张过版权。因此，任何人都可以轻松复制或引用该论文。比特币白皮书也存储在区块链中，可随时从中检索。除此之外，还有多个其他网站提供该白皮书。甚至在以下爱沙尼亚政府网站上也能找到：\n\
  \n**[`www.e-resident.gov.ee/bitcoin-whitepaper/`](https://www.e-resident.gov.ee/bitcoin-whitepaper/)**\n\
  \n以及以下美国政府网站：\n\n**[`www.ussc.gov/sites/default/files/pdf/training/annual-national-training-seminar/2018/Emerging_Tech_Bitcoin_Crypto.pdf`](https://www.ussc.gov/sites/default/files/pdf/training/annual-national-training-seminar/2018/Emerging_Tech_Bitcoin_Crypto.pdf)**\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   白皮书的摘要部分\n*   白皮书的引言部分\n*   白皮书的交易部分\n*   白皮书的时间戳服务器部分\n\
  *   白皮书的工作量证明部分\n*   白皮书的网络部分\n*   白皮书的激励部分\n*   白皮书的回收磁盘空间部分\n*   白皮书的简化支付验证部分\n\
  *   白皮书的价值拆分与合并部分\n*   白皮书的隐私部分\n*   白皮书的计算部分\n*   白皮书的结论部分\n\n### 目标\n\n本章的主要目标是帮助读者深入理解比特币白皮书。\n\
  \n### 白皮书的摘要部分\n\n![](img/Figure-5.1.jpg)\n\n**图 5.1：** 白皮书的摘要部分\n\n比特币是一种完全点对点的电子现金。过去曾有过几次密码学尝试提供电子现金系统。这些实现是中心化的，且其中一些已经失败。这些实现需要第三方来防止双重支付问题。比特币不需要第三方，因为它使用了一条不可变的区块链，其中每个区块包含一个交易列表、一个确认交易完整性的哈希值以及一个时间戳。区块链通过基于哈希的工作量证明来维持不可变性。\n\
  \n比特币是一个协作系统，其中节点要么遵守共识规则，要么合作攻击网络。协作系统形成一个 CPU 算力池，向现有链上添加区块。最长链拥有最大的 CPU 算力，因此被视为实际的区块链，而另一条链则被丢弃。该机制假设最大的\
  \ CPU 算力掌握在诚实节点手中。如果整个网络被攻破，该假设将失效。在后续章节中，我们将解释为何这不再是一个问题。\n\n比特币网络维护着真相的轨迹（区块链），因此允许任何节点随意离开或加入网络。加入的节点在入网时同步其本地链。如果节点离线一段时间，也需要同步其本地链。如果我们观察白皮书，会发现它非常容易理解和实现。因此，出现了数千种加密货币，大多采用了几乎原始的设计。\n\
  \n### 白皮书的引言部分\n\n![](img/Figure-5.2.jpg)\n\n**图 5.2：** 白皮书的引言部分\n\n引言部分解释了当前存在的可信第三方的弊端。可信第三方主要是协助解决争议的大型金融机构。很多时候，这些争议会导致交易撤销、诉讼和损失。对于高价值交易，或服务和付款可撤销的交易，这些额外成本对它们有利，因为无法撤销交易可能导致巨额损失。另一方面，对于小额交易，或服务和付款不可撤销的交易，这些成本是不必要的。这两类交易通常由同一支付处理商服务。这些支付处理商必须承担的损失由两类交易共同分担，因此成本影响到两类交易。简而言之，拥有可信第三方的成本是普遍存在的。\n\
  \n点对点现金系统旨在消除对可信第三方的需求，从而消除交易撤销的可能性。仍可实施托管机制来保护买家。该机制可以将类似于现金交易的小额不可撤销交易，与需要调解的大额交易分开，并可由可信第三方提供单独的托管机制，而不影响网络本身的成本。\n\
  \n### 白皮书的交易部分\n\n![](img/Figure-5.3.jpg)\n\n**图 5.3：** 白皮书的交易部分\n\n交易部分将交易解释为一串数字签名的轨迹，引领比特币在各方之间流转。要理解这一点，我们需要了解哈希和数字签名等术语。\n\
  \n#### 哈希\n\n\n\n\n#### 哈希\n\n哈希是一种不可逆的过程，它为大量文本生成固定字节的输出。该固定字节输出称为哈希码。哈希具有某些特性，使其在诸如将数据随机分布到存储桶中的应用中非常有用。它在安全地存储和传输密码方面也很有用。它还用于网络握手中发送挑战码。哈希码输出是确定性的，这意味着相同的文本将始终生成相同的哈希码。这些代码经过高度随机化，因此无法通过暴力破解或其他更复杂的攻击来确定。\n\
  \n![](img/Figure-5.4.jpg)\n\n**图 5.4：** 哈希算法不可逆性的示意图\n\n#### 数字签名\n\n数字签名类似于物理签名，因为它们确保文档的完整性，同时也确保文档由签署人签署（真实性）。数字签名使用“公钥和私钥加密”。文档由发送方的私钥签名。这将创建一个作为代码的签名，并将其与文档一起保存，供他人验证。\n\
  \n##### 数字签名过程\n\n![](img/Figure-5.5.jpg)\n\n**图 5.5：** 数字签名过程示意图\n\n签名通过使用发送方的公钥进行验证。验证算法使用文档内容、签名和发送方的公钥进行验证。\n\
  \n##### 签名验证过程\n\n![](img/Figure-5.6.jpg)\n\n**图 5.6：** 数字签名验证过程示意图\n\n比特币中的一笔交易包含两个部分：输入和输出。输入交易携带关于前一笔交易的信息，以及发送方的签名及其用于验证的公钥。输出包含要转移的比特币信息以及接收方的公钥。只有接收方知道私钥，因此可以解锁锁定在前一笔交易中的比特币并将其发送给下一个接收方。这创建了一个所有权链。为了理解这一点，让我们看看\
  \ Alice 如何支付 Bob。\n\n![](img/Figure-5.7.jpg)\n\n**图 5.7：** 交易创建与广播示意图\n\nAlice 想要支付\
  \ Bob。为此，Alice 查找她的未花费交易。她通过用她的私钥对前一笔未花费交易的哈希进行签名来创建一个交易输入。这释放了锁定在前一笔交易中的比特币。她现在通过添加一条给\
  \ Bob 的消息以及 Bob 的公钥来创建一个交易输出。为了让 Bob 支付给 Dave，他需要做同样的事情：选取他之前的未花费交易，对其进行哈希处理，并用他的私钥签名以释放锁定的比特币。然后他需要创建一条给\
  \ Dave 的消息以及 Dave 的公钥。为了使这些交易被视为有效，这些交易以及承载价值的所有前序交易记录都需要由比特币网络中的大多数节点进行验证。\n\n\
  比特币网络由维护所有前序交易已验证副本的节点组成。当执行一笔新交易时，它会在网络上广播，所有参与节点根据已接收的所有现有未花费交易验证其有效性。这种机制不留任何遗漏相关交易的机会，避免了因错误或故意而导致的双重支付。\n\
  \n### 白皮书中的时间戳服务器部分\n\n![](img/Figure-5.8.jpg)\n\n**图 5.8：** 白皮书中的时间戳服务器部分\n\n时间戳服务器是创建交易区块并为区块加上时间戳的节点。创建区块后，时间戳服务器广泛发布区块哈希。每个区块还包含前一个区块头的区块哈希。由于新创建的区块包含前一个区块头的区块哈希，而该区块头包含前一个区块创建的时间戳，因此新区块的时间戳不可能早于所包含的区块哈希的时间戳。因此，这种方法在区块链上强制要求按时间顺序排列。因此，无需依赖外部来源来强制保证时间戳的准确性。\n\
  \n![](img/Figure-5.9.jpg)\n\n**图 5.9：** 带有时间戳的区块结构\n\n在上图中，我们可以看到第 `N+1` 个区块包含第\
  \ `N` 个区块的哈希。由于第 `N` 个区块哈希包含时间戳，因此第 `N+1` 个区块的时间戳必定是在第 `N` 个区块的时间戳之后创建的。这确保了：\n\n\
  *第 `N+1` 个区块时间戳 > 第 `N` 个区块时间戳*\n\n因此，它在区块链上强制要求按时间顺序排列。\n\n### 白皮书中的工作量证明部分\n\n\
  ![](img/Figure-5.10.jpg)\n\n**图 5.10：** 白皮书中的工作量证明部分\n\n比特币使用工作量证明机制来确保区块链的完整性。工作量证明算法要求消耗\
  \ CPU 资源（工作）以创建一个区块。任何想要修改现有交易的攻击者都需要重做工作，创建包含该交易的区块，并重做后续区块的工作。这里的思路是，一个不合作的节点需要在\
  \ CPU 算力方面与合作节点竞争完成的工作量。**中本聪** 建议了一种简单的工作量证明机制，涉及计算区块哈希中前导零的个数。其逻辑如下：\n\n- 获得“0…..”二进制哈希值的概率是\
  \ 1/2。\n- 获得“00….”二进制哈希值的概率是 1/4。\n- 获得“000…”二进制哈希值的概率是 1/8。\n\n达到该二进制哈希值所需的 CPU\
  \ 算力与概率成反比，即：\n\n*`工作量 ≈ 1/概率`*\n\n**中本聪** 还建议根据区块生成的速度调整所需工作量，从而维持区块创建时间。\n\n因此，区块现在的结构如下图所示：\n\
  \n![](img/Figure-5.11.jpg)\n\n**图 5.11：** 带有 Nonce、时间戳和前一个区块哈希的区块结构\n\n在这里，目标工作量证明要求时间戳服务器使用所需数量的\
  \ CPU 工作来创建一个区块。这是通过计算创建每个区块所需时间的移动平均值来计算的，如果区块创建时间变短或变长，则增加或减少该值。以下公式展示了目标工作量的计算方法：\n\
  \n- `D[n]`：高度为 n 的区块的目标工作量证明\n- `T[n]`：第 `n` 个区块的时间戳\n- `ΔT`：创建区块的预期时间\n\n![](img/c05eq-1.jpg)\n\
  \n以下流程图展示了时间戳服务器如何为区块创建找到正确的 Nonce：\n\n![](img/Figure-5.12.jpg)\n\n**图 5.12：** 通过寻找所需\
  \ Nonce 来挖掘区块的过程\n\n时间戳服务器增加 Nonce 并计算区块哈希。如果区块哈希达到所需工作量，则将区块发布到比特币网络；否则，时间戳服务器继续增加\
  \ Nonce，直到达到所需工作量，或有其他节点发布了具有正确 Nonce 的区块。\n\n### 白皮书中的网络部分\n\n![](img/Figure-5.13.jpg)\n\
  \n**图 5.13：** 白皮书中的网络部分\n\n此处使用的“节点”一词与前几节中使用的“时间戳服务器”相同。现在，我们不使用“节点”一词来描述创建区块的节点；相反，我们称它们为挖矿节点。\n\
  \n\n\n\n每个节点连接多个节点，而这些节点又连接其他几个节点。这构成了一个节点网络。每个节点都尝试为区块链中即将创建的下一个区块寻找 `nonce`。当创建一笔新交易（如\
  \ `Alice pays Bob`）时，它会被发送给其对等节点。每个接收节点检查交易是否有效，以及是否试图创建非法交易或花费已花费的交易。随后将其发送给它们的对等节点，以此类推；这会广播到整个网络。每个接收节点将交易添加到区块中，并竞争寻找\
  \ `nonce`。率先找到 `nonce` 的节点创建区块并将其发送给其对等节点。所有接收节点验证区块时间戳、交易、`nonce` 以及下一个目标工作量证明。接收节点随后将其转发给其对等节点，以此类推；这会被广播。收到区块后，每个节点开始着手寻找下一个\
  \ `nonce`。这就是该过程持续进行的方式。\n\n下图展示了区块和交易如何传播：\n\n![](img/Figure-5.14.jpg)\n\n**图 5.14：**\
  \ 比特币网络上的交易传播\n\n一次 `ping` 到达地球最长距离大约需要 200ms。区块广播涉及每跳的验证；因此，要覆盖 95% 的网络，传播延迟可能长达一分钟。由于这个原因，多个节点可以在不知道已存在有效区块的情况下创建有效区块。这在区块链上产生了分叉。根据位置不同，节点可能会为同一区块高度选择不同的有效区块。由于没有节点能知道该采纳哪个区块、拒绝哪个区块，它们需要开始在最先收到的区块上工作，但也要保存其他有效区块。现在，有多组节点在为不同的链计算\
  \ `nonce`，因此它们可能会继续在各自的链上创建下一个区块。为了解决分叉问题，节点必须继续这一过程，直到其中一条竞争链比其他链更长。节点随后将接受最长链作为正确链，并丢弃其他链。由于寻找\
  \ `nonce` 所需时间明显高于区块传播延迟，竞争下一个区块的节点不会很多。\n\n下面是链分叉的示意图：\n\n![](img/Figure-5.15.jpg)\n\
  \n**图 5.15：** 由于几乎同时挖掘区块导致的区块分叉示意图\n\n如果由于某种原因，节点未收到区块却收到了新区块，该节点可以向其对等节点请求缺失的区块。既然未收到区块不是问题，区块也不需要到达所有节点。\n\
  \n![](img/Figure-5.16.jpg)\n\n**图 5.16：** 节点向对等节点请求缺失区块\n\n### 白皮书激励章节\n\n![](img/Figure-5.17.jpg)\n\
  \n**图 5.17：** 白皮书激励章节\n\n本章节解释了节点创建区块和支持比特币网络的激励。成功创建区块的节点以两种方式获得激励：\n\n*   每个新创建的区块向成功找到\
  \ `Nonce` 的节点奖励比特币。\n*   此外，交易中输入值减去输出值也会加到创建区块的节点收集的区块奖励中。\n\n节点使用 CPU 算力尝试寻找 `nonce`，这会导致能耗。由于许多节点将竞争寻找\
  \ `nonce`，此过程大多会导致失败尝试。此过程中使用的能量成本需要在节点成功时收回。节点还需要获得收入以作为盈利业务运营，因为这对节点所有者来说是一项业务。区块奖励确保节点有足够的激励继续寻找\
  \ `nonce`。\n\n如果一组节点决定不与网络合作，进行双重支付或更改区块/交易接受规则，或以某种方式攻击网络，那么这些节点将形成自己的网络。提供更好激励且节点遵守规则的网络将为发布交易提供更高的价值。因此，奖励将具有更高的信用价值。这将鼓励节点合作并支持网络，而不是攻击它。\n\
  \n节点可以自由选择包含或排除交易，或不与网络合作。通过包含奖励，交易创建者鼓励节点将交易包含在区块中。随着越来越多的交易被包含在区块中，交易奖励将成为挖矿节点收入的主要驱动力，因此对区块奖励的需求将减弱。网络实施了一种机制来随时间减少区块奖励。\n\
  \n下图说明了交易奖励：\n\n![](img/Figure-5.18.jpg)\n\n**图 5.18：** 交易奖励支付示意图\n\n此外，区块奖励是铸造比特币的唯一来源。这导致了预定义的通胀。\n\
  \n下图是过去和未来比特币通胀的绘制：\n\n![](img/Figure-5.19.jpg)\n\n**图 5.19：** 过去和未来的比特币通胀\n\n###\
  \ 白皮书回收磁盘空间章节\n\n![](img/Figure-5.20.jpg)\n\n**图 5.20：** 白皮书回收磁盘空间章节\n\n本章节解释了如何压缩区块链中存储的区块，从而回收磁盘空间。`Merkle\
  \ Tree` 是一种从交易列表派生代码（称为 `Merkle Root`）的方法。该代码确认区块中包含的交易的完整性。`Merkle Root` 作为区块头的一部分，也确保工作量证明保护其免遭篡改。\n\
  \n更新后的区块头如下：\n\n![](img/Figure-5.21.jpg)\n\n**图 5.21：** 比特币区块结构示意图\n\n我们可以看到，由于交易未用于区块哈希的计算，如果没有\
  \ `Merkle Root`，其完整性就无法得到保护。\n\n`Merkle Root` 的计算可以从下图理解：\n\n![](img/Figure-5.22.jpg)\n\
  \n**图 5.22：** `Merkle Tree Root` 计算\n\n在上图中，首先计算每笔交易的哈希值。然后，递归地将成对的哈希值连接并哈希以获得上一层级的哈希值。如果无法成对，则将哈希值与自身连接。\n\
  \n每个节点在通过网络接收区块时进行验证并将其存储在磁盘上。当磁盘上保存了足够多的区块，且节点确信由于分叉较旧的区块不会改变时，节点可以从较旧的区块中移除已发送的交易，仅保留区块头和未花费交易。这样，节点可以节省大量磁盘空间。\n\
  \n### 白皮书简化支付验证章节\n\n![](img/Figure-5.23.jpg)\n\n**图 5.23：** 白皮书简化支付验证章节\n\n本章节解释了不维护完整区块的节点如何仍能验证接收到的区块。实现简化支付验证的节点仅为最长链保留区块头，这意味着没有竞争链，且最长链已被找到。该节点寻求其网络中维护完整区块链的其他节点帮助来验证区块。\n\
  \n它使用一种称为 `Merkle Proof` 的技术，解释如下：\n\n![](img/Figure-5.24.jpg)\n\n**图 5.24：** `Merkle\
  \ Proof` 示意图\n\n`SPV` 节点向全节点请求与 `T4` 相关的哈希值。全节点发送验证 `Merkle Root` 所需的哈希值。由于 `H34`\
  \ 可从 `H3` 和 `H4` 推导，`H1234` 可从 `H34` 和 `H12` 推导。`H12345555` 可从 `H1234` 和 `H5555`\
  \ 推导。通过提供 `H3`、`H4`、`H12` 和 `H5555` 以及 `Merkle Root` `H12345555`，`SPV` 节点可以验证带有\
  \ `Merkle Root` `H12345555` 的区块中 `T4` 的存在性。\n\n![](img/Figure-5.25.jpg)\n\n**图 5.25：**\
  \ `SPV` 节点与全节点之间的通信\n\n\n\n然而，攻击者可以组建一个网络，由于 SPV 节点依赖全节点进行验证，它可能不知道正在与之通信的节点是否是欺诈性的。因此，它可能会持续接收伪造的交易。如果节点在网络上发现无效区块时广播警报，则可以处理此类攻击。\n\
  \n### 白皮书“组合与拆分价值”章节\n\n![](img/Figure-5.26.jpg)\n\n**图 5.26：** 白皮书“组合与拆分价值”章节\n\
  \n本章节解释了比特币交易中组合与拆分价值的概念，而不是为每个比特币或比特币的一小部分设置一笔交易。如果爱丽丝需要支付鲍勃，她需要使用支付给她的、组合价值大于或等于她需要支付给鲍勃金额的未花费交易，并将剩余（找零）价值支付回给自己。\n\
  \n如果未花费交易大于所需金额，则该交易将被拆分为待支付金额和剩余找零。如果未花费交易较小，则需要将多笔交易的价值组合起来，使输入价值大于或等于所需金额。如果输入价值与所需金额相同，则输出仅为一笔交易，即支付给鲍勃的金额。然而，如果输入价值较大，则爱丽丝需要将找零支付给自己。如果输出小于输入，则剩余价值将支付给挖矿节点，正如我们在前几节中所学。这可以从*图\
  \ 5.18*中理解。\n\n### 白皮书“隐私”章节\n\n![](img/Figure-5.27.jpg)\n\n**图 5.27：** 白皮书“隐私”章节\n\
  \n本章节解释了即使所有交易都被广播，如何在比特币网络中实现隐私。用户可以通过这种方式保持其公钥匿名。尽管交易是公开的，但没有人会知道交易属于谁。然而，由于找零需要发送回交易所有者，因此可以推导出其价值和交易详情。为了解决这个问题，交易所有者可以将找零发送到一个不同的公钥。这意味着每次都需要使用一个新的密钥对。然而，如果所有者的身份在现有交易中的某一笔中被揭露，交易历史仍然可能揭示所有者的交易链。\n\
  \n以下是改进交易隐私方法的示意图：\n\n![](img/Figure-5.28.jpg)\n\n**图 5.28：** 改进交易中发送方隐私的方法\n\n\
  ### 白皮书“计算”章节\n\n![](img/Figure-5.29.jpg)\n\n**图 5.29：** 白皮书“计算”章节\n\n本章节解释了攻击者或攻击者群体试图比诚实节点挖出更多区块时的条件。如果攻击者设法拥有更多的\
  \ CPU 算力并能挖出更多区块，攻击者将成为网络的一部分，这意味着它将不得不依赖诚实节点来接受这些区块。\n\n因此：\n\n1.  攻击者无法更改区块奖励，因此无法增加比特币供应量。\n\
  2.  攻击者无法更改他人支付交易的内容，因为它无法对这些交易进行签名。\n3.  攻击者无法阻止诚实节点广播交易。\n\n然而，攻击者可以更改自己的交易，通过不打包交易来进行审查，或撤销最近已打包的一笔交易。\n\
  \n现在，考虑一种攻击者可能持有也可能不持有大多数 CPU 算力并试图攻击网络的情况。这种情况类似于**赌徒破产问题**，解决方案是通过使用**二项随机游走**推导得出的。\n\
  \n攻击者想要更改深度为 `z-1` 处的交易，因此它将从深度 `z` 开始。如果它们能在诚实节点之前挖出一个区块，差距将减少到 `z-1`，但如果诚实节点挖出了区块，差距将增加到\
  \ `z+1`。我们试图找到攻击者能够创建最长链的概率。\n\n在赌徒破产问题中，赌徒与对手竞争，试图赢取对手的所有财富。这是一个迭代博弈游戏，双方在每次下注中要么赢\
  \ 1 美元，要么输 1 美元。最后，一方会失去所有财富。\n\n首先，看看赌徒破产问题。\n\n*   `q`：赌徒赢得单次下注的概率\n*   `p`：赌徒输掉单次下注的概率\n\
  *   `i`：赌徒的初始财富\n*   `p = 1 - q`\n*   `0 < i < N`\n\n![](img/Figure-5.30.jpg)\n\n\
  **图 5.30：** 赌徒破产问题示意图\n\n赌徒赢得游戏的概率可以计算为下注后以下概率之和：\n\n*   如果赌徒以概率 `q` 赢得下注，则新的游戏获胜概率为\
  \ 。\n*   如果赌徒以概率 `p` 输掉下注，则新的游戏获胜概率为 。\n\n使用全概率公式，即 。\n\n赌徒赢得游戏的概率是赢得当前下注后赢得游戏的概率与输掉当前下注后赢得游戏的概率之和。这可以表示如下：\n\
  \n![](img/107.jpg)\n\n![](img/c05eq-4.jpg)\n\n在获胜情况下，`P[N] = 1` 且 `i = N - 1`\n\n\
  ![](img/c05eq-5.jpg)\n\n现在，考虑比特币挖矿的情况，攻击者可以永远挖掘区块以击败诚实节点。这是一个有区别的赌徒破产问题。攻击者拥有无限的资金和无限的时间，要想获胜，攻击者需要通过比诚实节点添加更多区块来创建更长的链。一开始，攻击者想要能够修改深度为\
  \ `z-1` 处的交易，所以它从深度 `z` 开始。\n\n下图解释了这一点：\n\n![](img/Figure-5.31.jpg)\n\n**图 5.31：**\
  \ 攻击者成功挖掘更长链的示意图\n\n考虑到，\n\n*   `p`：诚实节点找到下一个区块的概率\n*   `q`：攻击者找到下一个区块的概率\n*   `z`：攻击者必须比诚实节点多添加的区块数\n\
  *   `i`：攻击者可以输给诚实节点的额外区块数\n*   `q[z]`：攻击者最终击败诚实节点的概率\n*   所以，`N = i + z`\n*   这里，`i`\
  \ → `∞`，因为赌徒开始时拥有无限资源。\n\n![](img/c05eq-6.jpg)\n\n![](img/c05eq-7.jpg)\n\n这就是我们如何得出白皮书本章节中给出的方程。\n\
  \n假设攻击者找到区块的概率低于诚实节点，即攻击者追上来的机会呈指数级下降。\n\n现在，我们更进一步，试图确定如果商家等待 `z` 个确认，攻击者能够双重支付的概率。中本聪认为每个时间段内获胜事件数量的概率分布为**泊松分布**，原因如下：\n\
  \n*   在每个时间间隔内，挖矿事件可以发生任意次数。\n*   每个事件独立发生，不影响其他事件的概率。\n*   事件的平均速率是恒定的，因为我们知道出块时间是恒定的，而挖矿区块的概率与\
  \ CPU 算力比率成正比，因此也是恒定的。\n*   两个事件在完全相同的时间发生是不可能的，因为节点根据到达时间判断，如果确实发生了，它们会等待直到找到最长链。因此，两个事件在同一时间发生很少见，即使发生，也可以安全地视为不同事件。\n\
  \n考虑到，\n\n*   `T`：平均出块时间\n*   `z`：认为交易已花费所需的区块链深度\n*   `P[p]`：诚实节点每 `T` 分钟挖出一个区块的概率\n\
  *   `P[q]`：攻击者节点每 `T` 分钟挖出一个区块的概率\n*   `p`：诚实节点每 `T` 分钟挖出的区块数\n*   `q`：攻击者每 `T`\
  \ 分钟挖出的区块数\n*   `T[z]`：挖掘 `z` 个区块的平均时间间隔\n*   `T[z] = T * z`\n\n\n\n量 `p` 和 `q`\
  \ 分别是在时间间隔 `T` 内挖出一个区块的概率的倒数。\n\n因此，\n\n![](img/c05eq-8.jpg)\n\n攻击者可以在 `T` 分钟内挖出\
  \ `q` 个区块，所以它可以挖出：\n\n![](img/c05eq-9.jpg)\n\n区间内发生 `k` 次成功的概率由泊松密度函数给出：\n\n![](img/111.jpg)\n\
  \n作为一个更一般的情况，我们想知道如果在当前区间内未成功，商家接受未来某个区块中修改过的交易时，攻击成功的总体概率。基本上，即使攻击者在一个区间内有 `k`\
  \ 次成功，它仍然可以在未来实现 `z-k` 个区块，并在一个区间内修改未来的区块。\n\n这可以通过全概率公式来求解，即 `P(A)= ∑[n]P(A|B[n]\
  \ )P(B[n])`。\n\n`P[s]`：成功的总概率\n\n![](img/c05eq-10.jpg)![](img/c05eq-11.jpg)\n\n\
  这是中本聪用来编写代码并证明概率呈指数级下降的方程。\n\n从该方程可以推导出，如果攻击者不控制大多数算力，攻击者成功挖出 `z` 个区块的概率会随着 `z`\
  \ 值的增加而呈指数级下降。因此，在确认交易前等待几个区块非常重要。\n\n建议商家只有在交易达到区块链深度 6 后才确认付款。\n\n### 白皮书结论部分\n\
  \n![](img/Figure-5.32.jpg)\n\n**图 5.32：** 白皮书结论部分\n\n本节解释了本文取得的成果，可列举如下：\n\n*  \
  \ 一个防止双重支付且不需要受信任第三方的点对点支付系统。\n*   数字签名提供交易的所有权。\n*   如果诚实节点控制大多数 CPU 算力，则工作量证明使得攻击者修改区块链中足够多的区块以导致双重支付变得不切实际。\n\
  *   节点独立工作，仅需极少的协调。节点可以独立离开和加入网络。它们确实需要通信，但其状态不依赖于其他节点，也不需要路由等。\n*   节点无需透露身份。\n\
  *   节点用 CPU 算力投票，从而竞争 CPU 算力来挖掘区块。成功的节点获得激励以支持网络。\n*   共识规则通过大多数人的支持和参与来强制执行。\n\n\
  ### 结论\n\n在本章中，你详细了解了白皮书的内容。你还通过推导了解了白皮书中使用的计算方法。\n\n在下一章中，你将通过编写实际程序来解析比特币软件存储在文件系统中的区块和索引，从而理解区块链中区块的结构。你还将通过编程再次深入了解挖矿。\n\
  \n### 要点回顾\n\n*   比特币网络不需要任何中介即可在双方之间发送比特币。\n*   区块链是每个节点维护的真相账本。\n*   受信任的第三方会在所有交易中包含成本，即使交易不需要争议解决。\n\
  *   比特币交易可以选择将受信任的第三方作为托管实现，而非强制规则。\n*   交易是数字签名的轨迹，将支付金额链接到前一笔交易，最终追溯到挖出的币。\n*\
  \   哈希运算是不可逆的。\n*   数字签名确保文档的完整性和真实性。\n*   交易一旦创建就会广播到比特币网络。\n*   区块链中的每个区块都按时间顺序排列。\n\
  *   `nonce` 是矿工找到的随机值，使其处于目标工作量证明范围内，从而被接受。\n*   比特币通过调整目标工作量证明来维持出块时间。\n*   新区块发布到网络。\n\
  *   如果两个区块几乎同时被挖出，区块链的一个分支中将出现多条竞争链。\n*   竞争分支中较长的链被接受，另一条被拒绝。\n*   找到所需 `nonce`\
  \ 的矿工将获得区块奖励。\n*   此外，矿工还从区块中包含的交易中收取交易费。\n*   矿工有动机保护网络而不是攻击它。\n*   比特币通胀是预先确定的。\n\
  *   一旦收到足够多的新区块，节点可以通过移除包含的交易来修剪较旧的区块。\n*   简化支付验证（SPV）节点仅保留最长链的区块头及所需的交易。\n*  \
  \ SPV 节点借助全节点，使用默克尔证明来验证区块和交易。\n*   比特币付款人可以合并其未使用的比特币交易输出，或拆分其之前的未花费输出。\n*   通过永不重复使用地址，可以增强隐私。\n\
  *   已包含在区块链中的交易被恶意矿工成功逆转的概率，随着区块深度的增加而呈指数级下降。\n\n### 问题\n\n*   节点如何知道它错过了一个区块？它如何获取丢失的区块？\n\
  *   为什么交易通常只有一个或两个输出？\n*   是什么使区块链不可篡改？（勾选正确答案）\n    *   默克尔根\n    *   数字签名\n  \
  \  *   工作量证明\n    *   区块链副本\n*   判断正误\n    *   区块头哈希值越大，工作量证明越大。\n    *   SPV 区块验证的成功取决于其对等节点的诚实度。\n\
  *   比特币是由 \\_\\_\\_\\_\\_\\_\\_ 创建的。\n*   为什么将比特币找零发送回同一个公钥会降低隐私？\n*   在赌徒破产问题中：Ria\
  \ 最初有 i = $2，赢一注的概率 p = 0.7。\n    *   Ria 赢得总财富 N = $6 的概率是多少？\n    *   Ria 变得无限富有的概率是多少？\n\
  *   攻击者拥有整个网络 20% 的算力。一家在线商店要求比特币交易达到区块链深度 6 后才发货。\n    *   攻击者在此期间挖出 3 个区块的概率是多少？\n\
  \    *   攻击者能够在确认时间内挖出 3 个区块并在之后挖出额外区块从而生成最长链的概率是多少？\n\n### 第 6 章\n\n# 区块链、交易与挖矿\n\
  \n在上一章中，我们尝试详细理解比特币白皮书的内容。比特币白皮书发布于 2008 年 10 月 31 日。它提供了一种可以像现金一样运作的互联网货币的概念设计。正如我们所见，该设计相当详细，但未提供区块奖励、出块时间或交易消息、哈希、签名算法等具体细节。白皮书更像是加密货币设计的模板。因此，我们称之为比特币白皮书的论文，理想情况下应称为加密货币白皮书。\n\
  \n在本章中，我们将分析比特币协议的实现。我们将使用的比特币软件是用相当复杂的 C++ 编写的。对于试图理解比特币的普通程序员来说，阅读和理解比特币软件代码是一项艰巨的任务。即使对于非常优秀的\
  \ C++ 程序员，理解比特币程序也是一项非常困难的任务。在当今的互联网时代，浏览网站和博客可以简化这项任务。而 Python 在尝试理解和验证我们的学习成果时非常有用。本章的目的是通过编码来学习，而不是试图构建最高效的解决方案。\n\
  \n\n\n在深入了解 Bitcoin 协议的实际实现之前，我们需要安装软件，并使区块链和索引与网络同步。\n\n### 结构\n\n本章将涵盖以下主题：\n\n\
  *   **Bitcoin 软件**\n    *   Bitcoin Core 安装\n        *   运行 Bitcoin Core 服务端\n \
  \       *   Bitcoin Core 客户端\n        *   在 Python 中查询索引\n*   **区块链**\n    *   创世区块\n\
  \    *   区块和索引\n    *   区块头\n        *   区块版本\n        *   前一个区块哈希\n        *  \
  \ 时间戳\n        *   Merkle 根\n        *   Bits 和 Nonce\n    *   序列化区块\n        *\
  \   魔数\n        *   区块文件\n        *   使用区块索引遍历区块\n*   **交易**\n    *   UTXO\n*  \
  \ **挖矿**\n    *   挖矿盈利能力\n        *   区块奖励\n        *   交易费\n        *   Coinbase\
  \ 交易金额验证\n        *   挖矿成本\n    *   内存池\n\n### 目标\n\n本章旨在帮助您理解 Bitcoin 区块链的结构、Bitcoin\
  \ 软件如何存储和组织区块链、区块和交易如何被索引、内存池数据的结构，以及如何使用它们和 UTXO 进行挖矿。\n\n本章使用 Python 编程来理解 Bitcoin\
  \ 区块链、区块文件、索引、UTXO 和挖矿。\n\n### Bitcoin 软件\n\n主要有三款软件提供全验证功能：Armory、Bitcoin Core\
  \ 和 Bitcoin Knots。其中，`Bitcoin Core` 是使用最广泛、更新最及时的软件。中本聪创建了该软件，此后由 Bitcoin Core 团队维护。它也被称为\
  \ Satoshi 客户端。据估计，多达 95% 的全节点运行该软件。因此，我们将使用它进行开发和学习。\n\n### Bitcoin Core 安装\n\n\
  `Bitcoin Core` 的安装说明可在以下网址找到：\n\n**[`bitcoin.org/en/full-node`](https://bitcoin.org/en/full-node)**\n\
  \n页面左侧提供了 Linux、Mac OS 和 Windows 的安装说明。此外，`Bitcoin Core` 还可以通过 Snap Store 在 Linux\
  \ 上安装，也可以在 Docker 上安装。始终使用正版软件非常重要，因为如果您使用该软件生成私钥或接收比特币，这些私钥将为攻击者或攻击软件所知，并被用来窃取受私钥保护的比特币。从正规网站下载软件并在多个无关网站验证哈希值是保障安全的最佳方式。\n\
  \n### 运行 Bitcoin Core 服务端\n\n`Bitcoin Core` 服务端可以通过 GUI 或命令行运行。对于 GUI 版本，我们可以运行\
  \ `bitcoin-qt –daemon`；对于命令行，我们可以运行 `bitcoind`。我们将使用命令行来运行守护进程和客户端。同步所有区块及所有索引可能需要一天或更长时间。更大的内存、更好的网络和更快的磁盘可以加快下载和索引生成速度。\n\
