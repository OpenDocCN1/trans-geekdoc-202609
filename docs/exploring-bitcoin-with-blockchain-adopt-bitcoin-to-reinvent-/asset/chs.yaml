  \ Mining Profitability of Test Miner in Bangalore\n\nThe equipment cost is nearly\
  \ ₹9,00,000/-.\n\nIf the mining reward remains constant, it will take 3 years to\
  \ break even on the equipment cost. This looks like a reasonable return, but considering\
  \ the mining hashrate may double during this period, monthly mining returns could\
  \ drop to between 0 and ₹5,000, becoming negligible, at which point you would need\
  \ to buy another device, which may cost more and consume more power. Hence, you\
  \ may never break even. On the positive side, Bitcoin prices may rise within 3 years,\
  \ keeping mining profitable.\n\nThis makes mining a risky proposition unless you\
  \ have subsidized electricity, cheap power, or power from waste fuel or energy.\n\
  \nHence, large miners are mostly located in countries where electricity is subsidized.\
  \ Also, many power generation companies and fossil fuel companies are mining Bitcoin\
  \ to utilize their excess power and fuel. Natural gas and oil drilling companies\
  \ use flare gas for Bitcoin mining, which is particularly beneficial for the environment\
  \ because methane is a much more potent greenhouse gas than carbon dioxide.\n\n\
  Wind and solar have better fuel efficiency than non-renewables, except for natural\
  \ gas and nuclear. Also, off-grid power saves energy waste in transmission, further\
  \ improving mining profitability. This makes off-grid renewables the preferred energy\
  \ source for non-subsidized mining.\n\nFor governments subsidizing Bitcoin mining\
  \ electricity, it is costly because it creates almost no jobs, so governments tend\
  \ to crack down on such facilities, as seen in China and Iran.\n\nTherefore, contrary\
  \ to contemporary views, we learn that Bitcoin mining is beneficial for the environment\
  \ because:\n\n*   Miners tend to use off-grid renewables as a power source.\n* \
  \  Waste fuel composed of the most potent greenhouse gas is used for Bitcoin mining\
  \ and converted into a less potent greenhouse gas—carbon dioxide.\n*   Bitcoin mining\
  \ discourages governments from subsidizing electricity for mining companies.\n\n\
  ### Threats to Individuals and the Network\n\nSo far in this chapter, you have learned\
  \ about design limitations and how the Bitcoin developer community strives to overcome\
  \ them. You also learned that the high energy consumption of Bitcoin mining is not\
  \ a major problem for the environment.\n\nBitcoin, as a decentralized peer-to-peer\
  \ open value transfer network, is both a target of interest for attackers and perceived\
  \ as a threat to the existing global monetary system. Therefore, the Bitcoin network\
  \ and Bitcoin investors may have to deal with various attacks, such as those from\
  \ governments, central banks, malicious hackers, fraudsters, or theft.\n\nHowever,\
  \ threats do not always arise from various types of attacks; they can also stem\
  \ from risks and potential vulnerabilities that currently exist or may arise in\
  \ the future.\n\n### Threats from Governments\n\nAs seen in *Chapter 4 Bitcoin in\
  \ the Real World* under the topic \"Bitcoin and Cryptocurrency Regulation,\" in\
  \ most countries of the world, cryptocurrency laws are unclear or non-existent.\
  \ This gives authorities quasi-judicial powers to deal with cryptocurrencies, sometimes\
  \ involving threats and corruption. Sometimes taxes are due, but tax clauses are\
  \ unclear. This is a problem in India and many other countries. This affects exchanges,\
  \ traders, investors, and merchants, leading to inflated prices for cryptocurrencies\
  \ and related services, and the risk of investment or business loss.\n\nThere is\
  \ also a lack of legal protection, which is sometimes abused by miscreants through\
  \ extortion and fraud.\n\nBanning Bitcoin transactions is a potential risk, and\
  \ some countries have indeed taken this route, meaning anyone dealing in cryptocurrencies\
  \ would be punished. However, very few countries have done so.\n\n\n\n\n### 来自央行的威胁\n\
  \n大多数国家，无论发达还是发展中，都没有完全可兑换的货币，它们将强势货币视为一种威胁。人们担心央行将失去控制，其货币可能变得疲软并贬值。这是一个合理的担忧，主要是因为一个国家财政政策的薄弱。还存在一种风险，即央行可能无法知晓资金被用于非法活动。因此，作为一种预防措施，所有金融机构都严格执行\
  \ KYC（了解你的客户）和 AML（反洗钱）规范。\n\n加密货币流通性很强，很容易通过监管漏洞。这就是为什么央行对其广泛使用持警惕态度。在许多国家，我们看到了存在银行禁令，在一些国家，大型机构也不被允许从事加密货币交易。另一方面，在一些国家，某些与加密货币相关的活动被禁止。\n\
  \n正如我们所了解的，与大多数其他加密货币不同，比特币并非真正的优秀投机工具，而更像是一种类似黄金的资产。像黄金一样，比特币不应被视为对全球货币体系的威胁，央行应认识到洗钱风险源于缺乏监管，因此每个国家都需要更多的监管，而不是更少。\n\
  \n### 恶意黑客\n\n黑客可能以多种方式攻击个人、交易所和网络。黑客攻击可能是窃取、抢劫或利用协议弱点。窃取可能通过尝试暴力破解安全性或基于知识的攻击来实现，也可能通过社会工程学等其他方式实现。抢劫也可能涉及社会工程学和勒索软件。\n\
  \n### 比特币盗窃\n\n比特币盗窃可能因比特币钱包使用的加密算法存在弱点而发生。盗窃也可能通过恶意软件、间谍软件或社会工程学等其他方式发生。\n\n####\
  \ 利用加密弱点\n\n比特币使用的哈希和 ECDSA 算法相当安全，但由于加密算法中熵、盐或其他参数的选择，仍然存在一些风险。\n\n##### 暴力攻击\n\
  \n比特币中使用的 256 位 ECDSA 加密具有与 3072 位 RSA 加密相同的安全强度。仅靠暴力破解比特币使用的 256 位 ECDSA 加密需要数十亿年。几十年后，我们仍有可能找到破解加密的方法。届时，比特币将需要转向新算法。\n\
  \n##### 低熵攻击\n\n比特币使用的签名算法非常安全，即使是最先进的计算机在数百万年内也无法破解。然而，私钥的安全性取决于用于生成私钥的随机生成器的熵。如果使用低熵系统生成私钥，则私钥可能被暴力猜测。\n\
  \n##### 碰撞攻击\n\nSHA256 被认为具有抗碰撞性，这意味着几乎不可能生成两个具有相同哈希值的消息。因此，比特币免受此类攻击。\n\n#####\
  \ 预计算哈希或彩虹表\n\n层级确定性钱包使用 PBKDF2-HMAC-SHA512 算法生成私钥和公钥。该算法需要大量迭代来生成安全密钥，并且必须配合盐值使用，否则生成的密钥容易受到预计算哈希攻击。此外，迭代次数或轮数至少应为\
  \ 2048，但预期为 10,000 甚至更高。利用高算力，可以推导出低轮数生成的密钥，从而窃取钱包中的所有比特币。\n\n#### 恶意软件\n\n恶意软件是一种旨在窃取信息或破坏计算机或网络的恶意程序。恶意软件可通过\
  \ `spyware`（间谍软件）或 `trojan`（特洛伊木马）窃取信息。恶意软件可通过某种形式的 `social engineering`（社会工程学）安装，后者利用紧迫感、贪婪和恐惧诱使你点击链接或从邮件或网页中的链接下载。恶意软件也可通过外观逼真的假网站安装。这类恶意软件称为\
  \ `trojan`（特洛伊木马）。\n\n一种称为 `spyware`（间谍软件）的恶意软件随后会在用户不知情的情况下安装在计算机中，并能读取文件、收集网站信息和读取键盘按键。\n\
  \n#### 勒索软件\n\n勒索软件是一种新型黑客攻击，攻击者通过恶意软件获得系统访问权限后，加密系统上的文件。随后，攻击者索要比特币作为赎金，以换取文件解密。\n\
  \n勒索软件抢夺比特币采取以下步骤：\n\n![](img/Figure-8.18.jpg)\n\n**图 8.18：** 攻击者实施勒索软件攻击所采取的步骤\n\
  \n### 丢失私钥或种子短语\n\n丢失私钥和钱包种子非常普遍，据估计，20% 的比特币已丢失且永远无法找回。比特币诞生初期价值极低或无价值，人们不太重视私钥，因此丢失比特币很容易。即使比特币后来成为有价值的钱包，软件也不易用，丢失私钥仍然很容易。\n\
  \n随着层级确定性钱包的出现，管理私钥变得更容易，但人们仍会忘记种子保存在何处，从而永远失去比特币。由于硬件钱包已相当普及，丢失比特币的情况已大幅减少。尽管如此，人们仍因粗心大意、自然灾害或其他此类情况而丢失比特币。\n\
  \n### 因漏洞导致的威胁\n\n比特币网络因设计和持续的技术改进确实存在某些风险。\n\n##### 交易延展性\n\n交易延展性将在 *第 12 章，隔离见证*\
  \ 中详细讨论，因此此处不再赘述。\n\n### 粉尘攻击\n\n粉尘攻击用于解除用户匿名性。攻击者向大量目标地址发送粉尘交易或极低价值交易。随后，攻击者追踪资金流向以确定哪些地址属于同一钱包，进而尝试解除该钱包所属用户的匿名性。这需要对与粉尘交易相关的交易进行复杂分析。一旦发现用户身份，攻击者会对目标用户实施网络钓鱼或恶意软件攻击。\n\
  \n可通过下图理解此过程：\n\n![](img/Figure-8.19.jpg)\n\n**图 8.19：** 攻击者实施粉尘攻击所采取的步骤\n\n粉尘攻击也可能用于其他目的；例如，洗钱者可向大量接收者发送粉尘交易，使此类交易难以追踪。\n\
  \n为防止粉尘攻击，钱包不应接受小额交易。比特币节点不转发网络手续费低于中继费的交易，许多节点的中继费为 5000 聪。这数额相当高，因此中继费本身应能起到威慑粉尘攻击的作用。\n\
  \n### 内存池洪水攻击\n\n内存池洪水攻击是一种 DoS 攻击，攻击者用低价值未确认交易填满节点的内存池。此类攻击曾在比特币网络上发生，导致网络手续费上涨。\n\
  \n此类攻击首次报道于 2015 年 7 月，2017 年 5 月、8 月和 11 月又在比特币网络上发生。据推测，这些攻击旨在影响比特币开发者、矿工和交易所对更大区块规模的支持。\n\
  \n\n\n\nBitcoin 节点通过配置交易广播到网络所需的最低中继费用来避免此类攻击。在 Bitcoin Core 中，该值默认设置为 5000 satoshi。目前，其价值接近\
  \ 2 美元，这仍然是一个足以阻止攻击者的显著金额。此外，与 2017 年不同，由于比特币价格上涨，现在的交易费用高得多，因此此类攻击已不再可能。\n\n###\
  \ 自私挖矿\n\n自私挖矿是一种恶意挖矿攻击，场景为只有少数矿工拥有高算力，但没有任何一个矿工拥有超过 50% 的全网算力。在此攻击中，自私矿工通过给竞争矿工造成损失，从而获得更大的算力份额。\n\
  \n挖矿算力份额是指矿工找到区块的平均概率。因为是平均概率，概率较低的矿工有时找到区块的速度会比平均情况更快。自私矿工利用这一点给其他矿工造成损失。\n\n考虑有三个矿工的场景：\n\
  \n- Alice：40%\n- Bob：25%\n- Carol：35%\n\n假设 Carol 是自私矿工。当 Carol 找到一个区块时，她不会立即发布，而是保留一段时间并尝试寻找另一个区块。\n\
  \n如果 Carol 运气好，又找到了一个区块，那么她会等待其他矿工发布区块，同时继续尝试寻找下一个区块。如果在此期间 Bob 或 Alice 发布了一个区块，Carol\
  \ 就会发布她手中的两个区块。因为 Carol 的链更长，Bob 或 Alice 发布的另一个区块会被拒绝。这给其他矿工造成的损失大于 Carol 扣留区块所付出的代价。\n\
  \n如果 Carol 找到三个区块，她会等待其他矿工发布两个区块。如果 Carol 找到四个区块，她会等待其他矿工发布三个区块。\n\n另一方面，如果 Carol\
  \ 运气不好，Alice 或 Bob 在 Carol 之前发布了区块，Carol 会立即发布她扣留的区块，并不传播竞争区块。因此，即使 Alice 或 Bob\
  \ 先发布了区块，某些节点仍会先收到 Carol 的区块，并将另一个区块视为竞争链。在这种情况下，哪条链获胜取决于概率以及 Carol 在区块传播延迟方面的优势。即使\
  \ Carol 获胜的机会很小，只要她的算力占全网算力份额的 33% 以上，作为自私矿工，她仍能增加挖到区块的有效概率。\n\n我们可以看到，自私挖矿并不会降低挖掘新区块的成本。事实上，它增加了挖掘区块的成本，即使对\
  \ Carol 也是如此。因为它给竞争矿工造成了更大的成本，Carol 才获得了优势。\n\n这可能导致多种后果：\n\n1.  竞争矿工将关闭亏损的挖矿设备，从而增加\
  \ Carol 的全网份额。\n2.  竞争节点将加入 Carol 并与她一起挖矿，使她获得超过 51% 的全网算力份额。\n3.  竞争节点破产并完全停止运营，导致矿池矿工转向其他剩余矿工，这可能使\
  \ Carol 拥有超过 51% 的算力。\n4.  竞争节点升级其亏损设备，这将花费巨资，但最终其他矿工将保持盈利并继续运营。\n\n以下是自私挖矿场景的流程图：\n\
  \n![](img/Figure-8.20.jpg)\n\n**Figure 8.20:** 矿工执行自私挖矿攻击所采取步骤的流程图\n\n很容易识别矿工是否参与了自私挖矿，因为与没有自私矿工的正常情况相比，自私挖矿增加了竞争链存在的可能性。\n\
  \n自私挖矿给自私矿工带来优势，但矿工不愿实施它的原因有多个：\n\n*   自私挖矿很容易被识别，这将影响比特币网络声誉，进而影响比特币的长期价值。\n* \
  \  挖矿具有极高的投入成本，且大多数时候利润微薄。因此，矿工需要着眼长远，不愿从事任何影响比特币价值的行为。\n*   挖矿由矿池进行，依赖于矿池矿工。矿池的不良声誉可能导致矿池矿工转向其他矿池，最终导致矿池失去算力。\n\
  \n比特币网络在过去很大程度上避免了此类攻击，尽管可能发生过一两起此类事件。\n\n比特币开发者社区一直在推动采用 FIBRE 协议以减少区块传播延迟。如果 FIBRE\
  \ 被广泛使用，矿工将极难通过自私挖矿攻击网络。\n\n### BGP 劫持攻击\n\nBGP 代表 **Border Gateway Protocol**（边界网关协议）。它是一种网关协议，用于在自治系统（AS）之间交换可达性信息。AS\
  \ 类似于由 ISP（互联网服务提供商）创建的网络。\n\nBGP 劫持可通过多种方式用于攻击比特币网络。之所以可能发动此类攻击，是因为比特币挖矿高度中心化，只有少数矿池控制着大部分全网算力。此外，比特币网络消息未加密，因此攻击者可以对其进行修改。\n\
  \n通过劫持 AS 中的 BGP 服务器，攻击者可以延迟、修改甚至丢弃比特币网络消息。这可用于执行多种类型的攻击。\n\n#### 网络分区攻击\n\n网络分区是指以一种方式断开节点连接，从而创建不相交的网络。\n\
  \n如果攻击者控制了负责发送 BGP 路由消息的 ISP 服务器，就可以有效地将网络分区为两个不相交的网络。\n\n由于分区攻击，矿池可能会在不知情的情况下开始在不同的链上工作。这将表现为\
  \ DoS 攻击，因为矿池间的算力份额会发生变化，并会被世界迅速知晓。\n\n然而，在问题解决之前，攻击者可以在两个网络中广播两笔使用相同 UTXO 的不同交易，从而执行双花攻击。如果问题在收到六个确认之前未解决，那么两个零售商都会接受付款，本质上实现了双花。当网络分区消除时，累积工作量证明更大的链会被接受，另一条链会被拒绝。其交易被拒绝的商家将遭受损失。\n\
  \n这可以通过以下插图理解：\n\n![](img/Figure-8.21.jpg)\n\n**Figure 8.21:** BGP 劫持攻击导致的网络分区示意图\n\
  \n如果你是商家，监控矿池间的算力分布是明智的。\n\n#### 延迟攻击\n\n分区攻击的一个变体是延迟攻击。在此类攻击中，攻击者不创建不相交网络，而是将一组\
  \ AS 的消息延迟发送到另一组 AS，本质上给予某些 AS 相对于其他 AS 的优势。\n\n在此攻击中，攻击者让受害者不知晓最新区块。如果受害者是商家，商家将不知道攻击者已经完成了支出，从而成功实施双花。如果受害者是矿工，矿工将在一条过时的链上工作，浪费算力导致损失。\n\
  \n如果你是商家，那么通过运行在不同 AS（如云平台或知名网站提供的 Web API）上的应用程序监控最新区块是明智的。\n\n### 0 确认攻击\n\n\n\
  \n零确认攻击可以在商家不等待交易确认的情况下执行。要执行此攻击，攻击者利用相同的 UTXO 创建两笔不同的交易：一笔用于支付商家，另一笔用于将价值转移到不同的地址。攻击者仅将支付给商家的交易发布到商家的节点，同时将另一笔交易发布到其他节点。\n\
  \n商家节点接受首先收到的交易（即支付给商家的交易），并拒绝另一笔。如果另一笔交易被打包进区块，则包含支付给商家的交易将被拒绝，商家将损失这笔付款。\n\n攻击者可以连接到多个远程节点以发布另一笔交易，从而提高成功的概率。\n\
  \n以下是攻击的示意图：\n\n![](img/Figure-8.22.jpg)\n\n**图 8.22：** 攻击者执行零确认攻击所采取的步骤\n\n要执行此攻击，攻击者需要知道商家的节点地址并连接到它。如果商家不使用\
  \ Tor 网络隐藏其 IP 地址，则此攻击会变得更容易。攻击者可以通过 ping 商家的网站来找出其 IP 地址。或者，如果是提供 Wi-Fi 的实体店，攻击者可以通过公共网络找到\
  \ IP 地址。可能还有其他方法来查找 IP 地址，例如使用钓鱼攻击。\n\n### 隐藏算力\n\n在 第 6 章，区块链、交易和挖矿 的 **Coinbase\
  \ 交易** 主题下，你了解到矿工会在挖出的区块中添加指纹。此指纹可用于确定每个矿池的相对算力贡献。由于我们可以计算网络总算力，因此可以利用此信息计算每个矿池的算力。\n\
  \n然而，之所以会发生这种情况，是因为矿工会在成功挖出区块时告诉我们。如果他们不这样做，就可以轻松地在无人知晓的情况下增加其算力贡献，除了其矿池矿工（他们很少关心这一点）之外。矿池矿工甚至不会尝试去了解他们究竟是在挖比特币、比特币现金还是比特币\
  \ SV。\n\n### 黑名单地址\n\n据在挖矿打击前的估计，中国矿工贡献了比特币网络总算力的近三分之二。因此，比特币网络容易受到中国政治决策的影响。例如，中国可以将属于特定实体（如企业、机构或个人）的比特币地址列入黑名单。\n\
  \n需要澄清的是，此攻击并非针对中国，因为如果另一个国家或一组国家的挖矿算力高于网络总算力的 50%，那么这些国家也可以将属于特定实体的地址列入黑名单。\n\n\
  由于中国的算力超过 50%，它可以忽略任何包含来自或发往特定实体交易的区块，并且总能挖出更长的链。因此，其他矿工也必须遵守中国的执法，否则他们将在挖出的区块上亏损，并很快破产。\n\
  \n拥有高网络算力的国家还可以利用自私挖矿技术，实施黑名单攻击的一种变体，即即使算力低于 50% 也能强制执行黑名单。\n\n我们最近看到一位矿工接受了 **外国资产控制办公室**\
  \ (**OFAC**) 合规规范。OFAC 是美国的金融情报和执法机构。因此，该矿工曾一度将不合规的交易列入黑名单，但后来同意不再强制执行 OFAC 规范。\n\
  \n### 重放攻击\n\n当比特币网络发生硬分叉并创建一种新型加密货币时，这种新币类似于从头创建的新币，只是它与父加密货币共享相同的历史。让一种新加密货币背负一个毫无用处的历史是不必要的负担。然而，其好处是新货币可以拥有与原币相似的名称，使其看起来熟悉且易于识别。\n\
  \n以下是硬分叉的示意图：\n\n![](img/Figure-8.23.jpg)\n\n**图 8.23：** 硬分叉示意图\n\n如果新加密货币保持与父加密货币相同的寻址方案，则无需引导用户，因为父加密货币的用户自动成为新加密货币的用户。此外，他们的\
  \ UTXO 在两条链上均有效。\n\n然而，这会带来问题，因为人们可能会错误地将币发送到另一条链上的接收方，从而导致付款丢失。\n\n此外，如果交易格式或地址方案未更改，则在一个网络上有效的交易在另一个网络上也将有效。这些有效交易可以在不同网络中重放，导致币被窃取。这被称为\
  \ **重放攻击**。\n\n当硬分叉发生时，许多用户意识到他们在新分叉网络中拥有额外的币。他们转移或出售这些币以快速获利，但攻击者可以在原始的高价值网络上重放此交易，由于该交易在原始网络上的价值高得多，攻击者获得的价值也更大。\n\
  \n这可以从以下示意图中理解：\n\n![](img/Figure-8.24.jpg)\n\n**图 8.24：** Bob 执行重放攻击\n\n依我们来看，一种加密货币如果不实施新的寻址方案和交易格式，是不道德的。\n\
  \n### 空块挖矿\n\n比特币共识规则不阻止矿工挖掘空块。这意味着在寻找正确 nonce 的竞争中，矿工可以只挖掘空块，从而比其他矿工具有优势，因为其他矿工将使用额外的处理能力来选择、添加交易到区块中，并计算收集到的总网络费用。\n\
  \n下图显示了交易费占区块奖励的百分比：\n\n![](img/Figure-8.25.jpg)\n\n**图 8.25：** 交易费占区块奖励的百分比\n\n\
  在最近的区块奖励更新后，每个区块的奖励为 6.25 ![](img/Bitcoin.jpg)，每个区块收集的网络费用近 0.7 ![](img/Bitcoin.jpg)，这笔金额相当可观，没有矿工愿意损失这笔钱。\n\
  \n下图显示了每年挖掘的空块数量：\n\n![](img/Figure-8.26.jpg)\n\n**图 8.26：** 每年挖掘的空块数量\n\n我们还需要意识到，多年来挖矿变得更具竞争力，这意味着矿工必须花费大量资金购买最高效的设备。因此，挖掘空块不符合矿工的利益。因此，正如我们在前面的图表中所见，空块的数量多年来已有所减少。\n\
  \n### 比特币挖矿中心化\n\n我们知道矿工会加入并组成矿池。少数矿池控制着大部分网络算力。\n\n下图显示了各矿池之间的算力分布：\n\n![](img/Figure-8.27.jpg)\n\
  \n**图 8.27：** 各矿池的算力分布\n\n在本书撰写时，前 4 大矿池分别是 F2Pool、AntPool、Poolin 和 BTC.com。\n\n\
  预期挖矿应随着时间的推移变得更加去中心化。事实上，在过去 2-3 年中，它已经变得更加去中心化。这可能发生的原因有两个：\n\n\n\n\n### 挖矿去中心化因素\n\
  \n*   矿池大多位于电力受补贴的寒冷地区。这会影响当地居民。随着挖矿能源需求的增加，这将阻碍政府继续补贴电力，并鼓励矿工转向离网能源。这将使矿工能够迁移到阳光更充足、风力更强，或拥有天然气/油田废弃能源的地点。\n\
  \n*   芯片微型化使得生产更高效的微处理器成为可能，从而提升了 ASIC 矿机的能效。由于 ASIC 矿机技术曾迭代迅速，靠近芯片制造中心的矿工相较于远离制造中心的矿工具有优势，因为运输会增加成本和时间。随着芯片微型化逼近物理极限，能效提升放缓，这种优势正在迅速消失。这将使其他地区的矿工能够与中国矿工竞争，从而进一步实现算力的去中心化。\n\
  \n### 51% 攻击\n\n51% 攻击是指某矿工拥有超过全网一半算力的攻击。在此条件下，该矿工可以执行以下操作：\n\n*   通过重新挖掘已出块的区块，从区块链中的区块里移除一笔交易。\n\
  *   通过不打包发送或接收特定黑名单地址（属于特定企业、机构或个人）比特币的交易，对个人进行审查。\n*   修改其自身的近期交易。\n\n如果排名前四的矿工联手，其合并算力将超过\
  \ 50%，他们可以击败其他矿工并发动 51% 攻击。\n\n2014 年 7 月，Ghash.io 曾拥有超过全网一半的算力，但后来同意永不超过 50% 算力。理解为何此后从未出现此类场景，以及为何任何矿工都会同意不接管网络，这至关重要。\n\
  \n挖矿也为网络增值，这意味着尽管矿工可以联合起来屏蔽特定国家或交易所的交易，但他们不会做任何会被察觉并影响网络的事情，因为网络是他们的收入来源。\n\n###\
  \ 女巫攻击\n\n在女巫攻击中，攻击者创建大量节点。受害节点将仅连接到攻击者节点。攻击者节点不向目标节点转发交易和区块，实际上将其与网络隔离。攻击者可以向目标节点发送其自行创建的、包含攻击者希望该节点接收的交易的区块。由于目标节点仅从攻击节点获取区块，它会认为该交易有效，即使该交易在实际网络中已被花费。\n\
  \n为避免女巫攻击，Bitcoin Core 客户端在每个 `/16` 地址段中仅建立一条连接，这意味着攻击节点需要广泛分布在多个 `/16` 地址段中，且仍能隔离目标节点，这几乎不可能，因为那将要求攻击者接管整个比特币网络。\n\
  \n### 拒绝服务攻击\n\n拒绝服务攻击或 DoS 攻击是指攻击者向目标发送大量数据，使其忙于处理而无法提供正常服务。\n\n比特币节点在处理拒绝服务攻击方面非常健壮，但这并不意味着\
  \ DoS 攻击不会发生在比特币节点上。如果恶意节点试图淹没某节点，该节点会直接将那些连接列入黑名单并关闭。发送有效消息进行淹没成本高昂，而无效消息会被迅速拒绝。此外，节点通过限制交易大小、中继费和区块大小来防范此类攻击。\n\
  \n以下是节点避免被 DoS 消息淹没的一些方式：\n\n*   大于 100 Kbytes 的交易被视为非标准交易。\n*   区块大小限制为 1MB vsize（虚拟大小）。\n\
  *   节点不接受或转发网络手续费低于节点设定的中继费的交易。\n*   节点不转发双花交易。\n*   节点不转发孤儿交易。即没有已知未花费交易输出（UTXO）的交易。\n\
  *   节点限制孤儿交易的数量。\n*   节点忽略大体积的孤儿交易。\n*   节点不转发孤儿区块，即没有已知前一个区块的区块。\n*   节点不转发已被见过或转发过的区块。\n\
  *   默认禁止行为不当的 IP 地址 24 小时。\n*   为每个连接节点维护 DoS 评分，若节点多次行为不当则断开连接。\n*   节点对签名缓存中可容纳的签名数量设有上限。\n\
  *   限制脚本大小。\n*   限制 `OP_CHECKMULTISIG` 操作中的密钥数量。\n*   限制交易中每个值的大小。\n*   内存中仅存储 UTXO（未花费交易输出）。\n\
  *   限制交易输入可请求的签名检查次数。\n\n更多详细信息，请参阅：\n\n[`en.bitcoin.it/wiki/Weaknesses#Denial_of_Service_.28DoS.29_attacks`](https://en.bitcoin.it/wiki/Weaknesses#Denial_of_Service_.28DoS.29_attacks)\n\
  \n### 量子计算攻击\n\n量子计算机利用电子态的叠加和电子的纠缠来执行经典计算机无法完成的复杂操作。然而，量子计算机并非通用计算机，仅适用于特定类型的运算。\n\
  \n与传统计算机不同，量子计算机使用量子比特而非比特。比特只能是 0 或 1，而量子比特可以同时处于 0 和 1 状态。因此，一个量子比特有 2 个叠加态，N\
  \ 个量子比特将有 2 的 N 次方个叠加态。这使得 N 量子比特的量子计算机相当于 2^N 比特的经典计算机。一台 500 量子比特的量子计算机相当于 2⁵⁰⁰\
  \ 比特的经典计算机，其状态数超过了整个宇宙中原子的总数。\n\n然而，这里有个关键点：当我们试图测量量子态时，叠加态会消失，量子比特变回普通比特。这被称为**量子退相干**。因此，任何量子计算最终都必须产生非叠加的比特。这使得量子计算机难以编程，要求从逻辑门到编程语言彻底重新设计计算方式。此外，它仅适用于需要极高并行度但输出结果相对简短的计算。\n\
  \n攻击者可用于针对比特币的算法如下：\n\n*   ショア算法，据估计需要近 2500 个量子比特才能破解比特币使用的 256 位 ECDSA 算法。\n*\
  \   格罗弗算法可指数级加速比特币挖矿。\n\n比特币使用的 SHA-256 哈希算法对量子计算机是安全的。\n\n2020 年 12 月，中国研究人员实现了\
  \ 76 量子比特系统。量子计算机仍面临诸多问题。量子计算机面临的最大问题是量子退相干，这会导致错误和相干性（叠加态）的丧失。\n\n量子退相干可能由任何环境因素引起，如热涨落、辐射和磁场。这使得量子比特非常不稳定，叠加态可能在毫秒级甚至更短时间内消失。研究人员试图通过创建极低温、极低辐射和极低磁场的环境来延长退相干时间。我们尚未成功实现这一点，因此截至目前，无论量子比特数量多少，量子计算机都无法执行任何深度运算，这使它们在实际应用中几乎毫无用处。\n\
  \n由噪声引起的量子错误可通过量子纠错来解决。\n\n\n\n\n\n未来随着我们更善于控制这些环境因素，这种情况可能会发生改变。然而，我们不知道量子计算机何时或是否会对非对称密码学构成威胁。\n\
  \n如果我们能构建出具有数千个量子比特的显著可靠的量子计算机，足以破解比特币所用的 256 位 `ECDSA`，那么这只会影响存放在已知公钥地址中的比特币。正如您在前几章所学，建议不要重复使用地址。如果我们不重复使用地址，黑客就无法利用量子计算来窃取比特币。\n\
  \n如果量子计算机能破解比特币公钥，那么比特币可以迁移到抗量子算法，如 Lamport 签名。\n\n另一方面，`Grover 算法` 只能加速 Nonce 搜索，并给使用量子计算机的矿工带来优势。然而，与其他挖矿设备一样，它将与其他进行挖矿的量子计算机竞争。这种情况类似于\
  \ `ASIC` 矿机引入挖矿优势时的情形。这不会影响网络；相反，随着时间的推移，它会提高网络的安全性。\n\n### 隐藏漏洞、漏洞利用和重组\n\n比特币核心软件、共识规则等中始终可能存在未被发现的漏洞，攻击者可能会利用这些漏洞。这可能是一个通胀漏洞，允许攻击者向自己支付额外的比特币，从而导致比特币供应量增加。它可能会无限期地锁定未花费的交易。它可能影响矿工或用户。\n\
  \n如果漏洞被利用，则需要立即或在几个区块内识别出来。一旦确定漏洞并进行修复，可能需要比特币社区计划比特币区块链重组。区块链重组意味着说服矿工升级比特币软件，使被利用区块及其后的区块失效，并重新开始挖矿。\n\
  \n当一个区块被挖出时，矿工不能立即移动新铸造的比特币。矿工需要等待 100 个区块后才能移动它。这为开发者提供了时间来修复漏洞并说服矿工在 100 个区块被挖出前（大约\
  \ 16 小时 40 分钟）进行重组。在此期间被确认的交易将需要等待再次确认。也有可能之前已确认的交易在被大多数节点的内存池丢弃前无法再次确认。这将对比特币网络的信誉产生负面影响。\n\
  \n### 欺诈和抢劫\n\n比特币非常有价值，因此吸引了罪犯。像黄金一样，比特币有时会在枪口下被抢劫。\n\n比特币也可能通过社会工程学手段被骗子窃取，例如利用奖励、紧迫感和恐惧，或通过虚假服务。欺诈可能类似于银行欺诈，即通过\
  \ `OTP` 获取加密货币交易所的访问权限。骗子可能会要求您填写详细信息并窃取您的 `PIN` 码或钱包种子。骗子也可能要求您将币转入您的钱包以换取服务。\n\
  \n### 结论\n\n在本章中，您了解了比特币设计的局限性、这些局限性为何必要，以及为解决这些局限性正在进行的开发工作。您还了解了比特币持有者和网络可能遭受攻击的不同方式、商家、矿工和比特币持有者减轻大多数风险的不同方法，以及为何某些风险并非真正的风险，因为这些攻击要么过于困难，要么对攻击者而言在经济上不可行。\n\
  \n我们讨论了比特币中心化既不利于网络安全，又有利于让比特币挖矿社区接受改进提案。我们还看到了比特币能源使用如何有益于环境。\n\n在下一章中，您将了解比特币地址格式，并理解如何生成私钥、公钥和地址。您还将了解如何创建您的比特币钱包，以及如何保护钱包免受黑客攻击。\n\
  \n### 要点回顾\n\n*   区块链验证时间是导致比特币区块大小限制在 1MB 到 4 MB 之间的最重要原因。\n*   通过使用 `Taproot`、签名聚合和\
  \ `Schnorr 签名`，用单个公钥和签名替换多个签名和复杂脚本，我们可以在一个区块中容纳更多交易并获得更好的隐私。\n*   `闪电网络` 是一种第二层支付协议。\n\
  *   `闪电网络` 提供隐私，因为单个交易不记录在比特币区块链上。\n*   `闪电网络` 提供扩展性，因为对等方之间可以进行无限数量的交易。\n*   比特币挖矿通过鼓励使用离网可再生能源和利用废弃能源，有助于降低碳足迹。\n\
  *   比特币挖矿难度每 2016 个区块调整一次。\n*   挖矿池中心化容易受到自然灾害、停电、政府打压或 `DDoS` 攻击的影响，导致网络算力下降。\n\
  *   算力突然下降会导致出块时间增加和网络费用飙升。\n*   缺乏法律保护助长了比特币领域的欺诈和非法活动。\n*   大多数央行不鼓励使用比特币和其他加密货币，以保护本国货币免受资本外逃影响。\n\
  *   高熵随机数生成器有助于生成能抵御暴力破解攻击的私钥。\n*   `SHA256` 具有抗碰撞性。\n*   `盐值` 可防范彩虹表攻击。\n*   低轮数\
  \ `PBKDF2-HMAC-SHA512` 算法容易受到暴力破解攻击。\n*   `分层确定性钱包` 结合 12 到 24 个单词的助记码，简化了私钥的保管。\n\
  *   `木马` 是一种将自己伪装成合法软件的恶意软件。\n*   `间谍软件` 是一种在受害者不知情的情况下安装、窃取信息并发送给攻击者的恶意软件。\n* \
  \  `社会工程学` 是利用心理操纵来收集私人信息的手段。\n*   交易延展性漏洞影响非 `SegWit` 交易。\n*   `BIP62` 解决了大多数交易延展性问题。\n\
  *   比特币节点默认对所有接收到的交易强制执行最低交易费，以接受和转发它们。这笔费用称为 `中继费`。\n*   `中继费` 保护地址免受粉尘攻击。\n* \
  \  为防范粉尘攻击，钱包不应接受极小额的交易。\n*   在内存池洪水攻击中，攻击者发布大量小额交易，从而增加网络费用。\n*   即使是 `中继费` 也不便宜，因此内存池洪水攻击已变得不可行。\n\
  *   在 `自私挖矿` 中，恶意矿池通过给竞争矿池施加成本，从而控制更大的网络算力份额。\n*   `自私挖矿` 易于识别，因为它会导致竞争链更频繁地出现。\n\
  *   `FIBRE` 代表快速互联网比特币中继引擎。\n*   `FIBRE` 是一种协议设计，在管理良好的网络帮助下，可将传播延迟降低至接近物理极限。\n\
  *   `FIBRE` 将传播延迟降低到 1 秒以下，这给恶意矿池利用 `自私挖矿` 攻击网络留下的空间极小。\n*   挖矿池中心化也容易受到利用 `BGP\
  \ 劫持` 的网络分区和延迟攻击。\n*   未确认交易，即使是 `SegWit` 交易，也容易受到双花攻击。\n*   始终运行全节点并通过 `Tor` 路由连接。\n\
  *   矿工在新挖出的区块的 `Coinbase 交易` 中添加指纹，这有助于网络了解每个矿工的挖矿算力。\n*   如果矿工不添加其指纹，它可以隐藏其真实算力，并可能以超过\
  \ 51% 的算力进行挖矿。\n\n\n\n\n\n#### 比特币网络风险\n\n*   由于比特币挖矿在地理上分布不均，政府很容易根据其政治议程强制执行地址黑名单。\n\
  *   比特币共识上的硬分叉可能导致投资者遭遇重放攻击，攻击者试图从新增的币种中获利。\n*   硬分叉币与母币拥有相同的地址和交易格式，这是重放攻击存在的原因。\n\
  *   如果前四大矿池联手，它们就可以对网络发动 `51%` 攻击。\n*   `51%` 攻击者可以强迫网络将地址列入黑名单，或对其控制的交易进行双重支付。\n\
  *   在女巫攻击中，攻击者通过启动大量节点，使受害者的整个网络视角被遮蔽（eclipsed）。\n*   比特币核心客户端在 `/16` 地址范围内仅建立一条连接，以防止女巫攻击。\n\
  *   在拒绝服务攻击中，攻击者向受害者发送海量数据，导致受害者无法提供预期服务。\n*   量子计算机利用电子态叠加和电子纠缠执行复杂的可逆操作，这是经典计算机无法做到的。\n\
  *   量子计算机极易受到微小环境干扰的影响，导致波函数坍塌，这种现象称为量子退相干。\n*   量子计算机理论上可以利用几千个量子比特破解比特币使用的 `256-bit\
  \ ECDSA` 算法。\n*   量子计算机可以使用 `Grover 算法` 加速比特币挖矿中的 Nonce 搜索。\n*   矿工需要等待 `100` 个区块才能使用新铸造的币，这为开发者提供了数小时的窗口期来修复漏洞并重组区块链。\n\
  \n### 问题\n\n1.  解释区块大小如何影响初始区块下载（IBD）。\n2.  比特币挖矿的去中心化将如何保障比特币网络的安全？\n3.  解释零售商为防范双重支付攻击应采取的所有必要预防措施。\n\
  4.  解释矿工为防范各类攻击并提高盈利能力应采取的所有必要预防措施。\n5.  解释比特币用户为防范各类攻击应采取的所有必要预防措施。\n6.  解释隐私为何重要，以及比特币用户保护隐私的不同方式。\n\
  7.  **判断题：**\n    1.  隔离见证交易可防范 `0-confirmation` 攻击。\n    2.  比特币具有同质性，因为它可以被来自不同来源的等量比特币所替代。\n\
  \    3.  CoinJoin 优于混币服务，因为混币服务可能窃取你的币。\n    4.  `SHA256` 能抵御量子计算攻击。\n    5.  `Grover\
  \ 算法` 将终结比特币挖矿，比特币将需要更换挖矿算法。\n8.  **填空题：**\n    1.  在 `DoS` 攻击中，攻击者向节点发送大量消息，导致节点无法为其他合法节点提供服务。\n\
  \    2.  在 `交易泛洪` 攻击中，攻击者向比特币网络发送大量交易消息，从而推高交易费用。\n    3.  攻击者可通过劫持 `BGP 路由`（或 `IP\
  \ 前缀`）来分割比特币网络。\n    4.  当硬分叉币使用相同的 `地址` 格式和 `交易` 方案时，会发生重放攻击。\n    5.  通过 `自私`\
  \ 挖矿，算力超过 `25%` 的矿池可以控制更大比例的网络算力。\n    6.  交易 `延展性` 通过 `SegWit` 见证增强得以解决。\n\n##\
  \ 第 9 章：钱包与地址\n\n在上一章中，我们将比特币视为一种网络协议进行了探讨，分析了使其成为伟大技术创新的优势，以及对其长期生存构成风险的局限性和条件。\n\
  \n在本章中，你将学习如何访问你的比特币，将其发送到单个或多个地址，以及在各方之间执行智能协议。\n\n要访问你的比特币，你需要一个软件程序，它能生成用于接收比特币的地址，并能对交易进行签名以便将其转移给接收方。这个软件程序称为\
  \ **钱包**。本章重点介绍私钥、公钥、地址和钱包。我们将在下一章详细介绍交易和交易签名。交易签名也是钱包功能的重要组成部分。因此，钱包具有三项基本功能：\n\
  \n*   它提供你持有的比特币的信息。\n*   它提供用于接收比特币的地址。\n*   它协助对交易进行签名，以便将其发布到网络上。\n\n钱包可以通过多种方式分类。以下是基于使用介质的钱包类型：\n\
  \n*   **移动钱包：** 安装在手机上。知名的有 `Electrum`、`Mycelium`、`Samourai` 等。\n*   **桌面钱包：** 安装在台式机上。知名的有\
  \ `Bitcoin Core`、`Armory`、`Electrum` 等。\n*   **硬件钱包：** 这是独立的硬件设备，专注于安全性，被认为能提供更好的安全保障。两家公司主要主导该市场：`Ledger\
  \ Nano` 和 `Trezor`。\n\n除上述钱包类型外，大多数交易所也提供钱包服务。\n\n钱包也可以基于密钥分类如下：\n\n*   **确定性钱包：**\
  \ 这些钱包允许用户使用种子确定性地生成密钥。这些钱包无需存储密钥，因此免受黑客攻击，也避免了丢失密钥的风险。\n*   **非确定性钱包：** 这些钱包存储密钥集合。这些也被称为\
  \ **Just a Bunch of Keys (JBOK，仅仅是一堆密钥)**。\n\n钱包还可分为热钱包和冷钱包：\n\n*   **冷钱包** 离线存储私钥，交易签名在离线环境下进行，这使其非常安全。硬件钱包是冷钱包的例子。\n\
  *   **热钱包** 加密私钥但将其保持在线。这些钱包也在线签名交易。大多数移动和桌面钱包是在线钱包。`Bitcoin Core` 提供在线钱包。\n\n在本章中，我们将构建一个确定性钱包。在下一章中，你将学习如何使用钱包进行离线交易签名。\n\
  \n> **⚠️ 警告：** 切勿使用本书中出现的任何私钥或助记词。你的比特币将被盗。\n\n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*  \
  \ 助记词\n*   私钥、公钥和地址的格式与生成\n    *   私钥\n    *   公钥\n    *   地址\n*   分层确定性 (HD) 钱包\n\
  \    *   主密钥生成\n    *   密钥派生\n        *   父私钥 -> 子私钥\n        *   父公钥 -> 子公钥\n \
  \       *   子私钥 -> 父私钥（钱包私钥泄露）\n        *   派生强化子密钥\n    *   扩展密钥\n        *   主扩展公钥和私钥\n\
  \        *   扩展公钥和私钥\n    *   密钥派生路径\n\n### 目标\n\n本章的目标是帮助你从功能和实现两个层面理解钱包、公钥、私钥和比特币地址。\n\
  \n我们将讨论钱包的功能。此外，你将了解对钱包进行分类的不同方式，并学会创建自己的分层确定性钱包及生成其种子。你还将了解与钱包相关的安全知识。\n\n本章还涵盖私钥、公钥和地址的格式，你将学会如何生成它们。\n\
  \n### 助记词\n\n\n\n\n要创建确定性钱包，首先需要学习如何生成随机种子。该种子将帮助你生成私钥和公钥对。你选择的随机数决定了私钥抵抗暴力破解或基于知识攻击的安全程度。一个好的随机数是真正随机的，这意味着它不遵循攻击者可确定的模式。此外，最好是分布良好的，这意味着如果我们在有限域内持续生成，经过足够长的时间后，有限域分布非常均匀，没有大块的密集区域，也不是完全均匀的。因此，随机数需要同时防范暴力攻击和涉及推断模式的智能攻击。这需要选择正确的随机性来源，也称为**熵源**。这主要从硬件来源收集，如风扇噪音或鼠标移动。我们也可以使用背景噪音作为熵源。\n\
  \n我们将使用 BIP 39 实现一个生成随机种子的程序。\n\n链接：[`github.com/bitcoin/bips/blob/master/bip-0039.mediawiki`](https://github.com/bitcoin/bips/blob/master/bip-0039.mediawiki)\n\
  \n该文档描述了生成种子的方法，种子由 12/18/24 个常用英语单词组成。这组单词不仅仅是纯随机序列；它还包含校验和，因此不能在不遵循 BIP 中描述的方法的情况下随机生成。\n\
  \n共有 2048 个助记词用于生成种子，相当于 11 位。完整的助记词列表可在以下链接找到：[`github.com/bitcoin/bips/blob/master/bip-0039/english.txt`](https://github.com/bitcoin/bips/blob/master/bip-0039/english.txt)。\n\
  \n如果我们准备 12 个单词的助记码，需要 11\\*12 位，即 132 位。\n\n132 位由 128 位随机数和 4 位校验和组成。\n\n我们将随机数中的位称为熵位。下图展示了获取\
  \ 12 个单词助记种子的过程：\n\n![](img/Figure-9.1.jpg)\n\n**图 9.1：** 从熵生成助记码的示意图\n\n使用以下公式计算所需位数：\n\
  \n*熵位数 = 助记词数量 \\* 32 / 3*\n\n**checksum_bit_count** 的公式如下：\n\n*校验和位数 = 助记词数量 /\
  \ 3*\n\n以下代码用于获取 **checksum_bit_count** 和 **entropy_bit_count**：\n\n```python\n\
  def getChecksumBitCount(mnemonic_length: int):\n    if (mnemonic_length % 3) !=\
  \ 0:\n        raise ValueError('Invalid Mnemonic code length')\n    checksum_bit_count\
  \ = mnemonic_length // 3\n    return checksum_bit_count\n\ndef getEntropyBitCount(mnemonic_length:\
  \ int):\n    if (mnemonic_length % 3) != 0:\n        raise ValueError('Invalid Mnemonic\
  \ code length')\n    entropy_bit_count = (mnemonic_length * 32) // 3\n    return\
  \ entropy_bit_count\n```\n\n**程序 9.1：** 从助记种子长度获取校验和位数和熵位数的程序\n\n以下代码用于生成熵位：\n\n\
  ```python\ndef getRandomNumberBits(bit_count: int):\n    r = random.SystemRandom().randrange(0,\
  \ 1 << 32)\n    r_b = r.to_bytes((r.bit_length() + 7) // 8, 'big')\n    h = hashlib.sha256()\n\
  \    h.update(r_b)\n    h_b = h.digest()\n    byte_count = bit_count // 8\n    rand_num_b\
  \ = h_b[0:byte_count]\n    return rand_num_b\n```\n\n**程序 9.2：** 生成随机数的程序\n\n之后，我们将校验和位追加到随机数位。以下是生成位的代码：\n\
  \n```python\ndef getMSBChecksumBits(checksum: int, checksum_bit_count: int):\n \
  \   msb_checksum = checksum >> (256 - checksum_bit_count)\n    return msb_checksum\n\
  \ndef getEntropyWithChecksum(random_number: int,\n                           msb_checksum:\
  \ int,\n                           checksum_bit_count: int):\n    shifted_random_number\
  \ = random_number << checksum_bit_count\n    entropy_check_i = shifted_random_number\
  \ | msb_checksum\n    return entropy_check_i\n\ndef convertIntToBytes(num: int,\
  \ bit_count: int):\n    size_bytes = math.ceil(bit_count / 8)\n    num_s = ('%x'\
  \ % num).zfill(size_bytes * 2)\n    num_b = bytes.fromhex(num_s)\n    return num_b\n\
  \ndef getChecksum(b: bytes):\n    return int.from_bytes(hashlib.sha256(b).digest(),\
  \ byteorder='big')\n\ndef getEntropyCheckBits(mnemonic_length: int):\n    entropy_bit_count\
  \ = getEntropyBitCount(mnemonic_length)\n    random_number_b = getRandomNumberBits(entropy_bit_count)\n\
  \    checksum_bit_count = getChecksumBitCount(mnemonic_length)\n    checksum = getChecksum(random_number_b)\n\
  \    msb_checksum = getMSBChecksumBits(checksum, checksum_bit_count)\n    random_number\
  \ = int.from_bytes(random_number_b, byteorder='big')\n    entropy_check_i = getEntropyWithChecksum(random_number,\
  \ msb_checksum, checksum_bit_count)\n    bit_count = entropy_bit_count + checksum_bit_count\n\
  \    entropy_check_b = convertIntToBytes(entropy_check_i, bit_count)\n    return\
  \ entropy_check_b\n```\n\n**程序 9.3：** 获取附加校验和的熵位的程序\n\n之后，我们需要使用这些位从 2048 个助记词列表中选择单词。这通过将\
  \ **entropy_check_bits** 分解为 11 位列表来实现。以下是实现此功能的代码：\n\n```python\ndef getMnemonicWordList():\n\
  \    word_list = []\n    with open('mnemonic_word_list_english.txt', 'rt') as word_file:\n\
  \        word_list = word_file.read().splitlines()\n    return word_list\n\ndef\
  \ entropyCheckBits2List(entropy_check_b: bytes, size: int):\n    selector_int =\
  \ int.from_bytes(entropy_check_b, byteorder='big')\n    selector_list = []\n   \
  \ while size >= 11:\n        selector_list.append(selector_int & 0x07FF)\n     \
  \   selector_int = selector_int >> 11\n        size -= 11\n    return selector_list[::-1]\n\
  \ndef getMnemonicWordCodeString(mnemonic_length: int):\n    entropy_bit_count =\
  \ getEntropyBitCount(mnemonic_length)\n    checksum_bit_count = getChecksumBitCount(mnemonic_length)\n\
  \    entropy_check_bit_count = entropy_bit_count + checksum_bit_count\n    entropy_check_b\
  \ = getEntropyCheckBits(mnemonic_length)\n    selector_list = entropyCheckBits2List(entropy_check_b,\n\
  \                                          entropy_check_bit_count)\n    mnemonic_word_list\
  \ = getMnemonicWordList()\n    word_key_list = []\n    for selector in selector_list:\n\
  \        word = mnemonic_word_list[selector]\n        word_key_list.append(word)\n\
  \    return word_key_list\n```\n\n**程序 9.4：** 以列表形式生成助记词代码的程序\n\n在本小节中，你学习了如何生成助记种子。你可以用它生成\
  \ 12、18 或 24 个单词的助记种子。这里存在权衡：24 个单词的种子提供更高的安全性，但比 12 个或 18 个单词的代码更难记忆。在下一节中，我们将讨论比特币使用的私钥、公钥和地址格式。\n\
  \n### 私钥、公钥和地址的格式与生成\n\n在本小节中，你将了解私钥和地址的格式，并学习如何生成它们。\n\n##### 私钥\n\n私钥可以是几乎任何 256\
  \ 位的值。其范围在 `0x1` 到 `0xFFFF FFFF FFFF FFFF FFFF FFFF FFFF FFFE BAAE DCE6 AF48 A03B\
  \ BFD2 5E8C D036 4140` 之间。\n\n私钥以**钱包导入格式 (WIF)** 表示。这是一种带有前缀和校验和的 Base58 格式。\n\n\
  Base58 方案定义在以下文档中：\n\n[`tools.ietf.org/id/draft-msporny-base58-01.html`](https://tools.ietf.org/id/draft-msporny-base58-01.html)\n\
  \n公钥可以是压缩或未压缩的。压缩和未压缩公钥会导致不同的地址，因此私钥必须携带其生成的公钥是压缩还是未压缩的信息。要生成私钥的 WIF 格式，我们需要在 WIF\
  \ 格式中包含币种、网络和压缩信息，以便生成的地址属于特定网络且是确定性的。\n\n以下是前缀信息：\n\n![](img/296.jpg)\n\n**表 9.1：**\
  \ 私钥前缀\n\n如前表所示，regtest 使用与 testnet 相同的私钥前缀。\n\n\n\n\n### WIF 格式生成与公钥推导\n\n####\
  \ 生成压缩公钥的 WIF 格式\n\n要为压缩公钥生成 WIF 格式，我们在生成的私钥后添加 `b'\\x01'` 作为后缀。\n\n#### Base58\
  \ 编码\n\nBase58 编码字符串由以下字符组成：\n\n`123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz`\n\
  \n顾名思义，共有 58 个字符。要获取编码字符串，我们将数字迭代除以 58 及后续商，在每一步将余数转换为 Base58 字符，并连接编码字符以获得最终编码字符串。\n\
  \n下图展示了为测试网获取 WIF 编码私钥的逻辑：\n\n![](img/Figure-9.2.jpg)\n\n**图 9.2：** WIF 编码方法示意图\n\
  \n以下程序将数字编码为 Base58 字符串：\n\n```python\ng_alphabet = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'\n\
  g_base_count = len(g_alphabet)\n\ndef hash256(bstr: bytes):\n    return hashlib.sha256(hashlib.sha256(bstr).digest()).digest()\n\
  \ndef base58_encode(num: int):\n    encode = ''\n    if (num < 0):\n        return\
  \ ''\n    while (num >= g_base_count):\n        mod = num % g_base_count\n     \
  \   encode = g_alphabet[mod] + encode\n        num = num // g_base_count\n    if\
  \ (num >= 0):\n        encode = g_alphabet[num] + encode\n    return encode\n```\n\
  \n**程序 9.5：** 将数字编码为 Base58 字符串的程序\n\n以下程序在 Base58 编码前给数字附加四字节校验和，以生成 Base58Check\
  \ 编码：\n\n```python\ndef base58checkEncode(prefix: bytes, b: bytes):\n    with_prefix\
  \ = prefix + b\n    with_checksum = with_prefix + hash256(with_prefix)[0:4]\n  \
  \  val = int.from_bytes(with_checksum, byteorder='big')\n    encode = base58_encode(val)\n\
  \    if prefix == b'\\x00':\n        encoded_prefix = base58_encode(0)\n       \
  \ encode = encoded_prefix + encode\n    return encode\n```\n\n**程序 9.6：** 将数字编码为\
  \ Base58Check 编码的程序\n\n以下程序将私钥十六进制代码转换为 WIF 格式。它接收私钥的十六进制代码和一个布尔值（指示该密钥是否用于生成压缩公钥）：\n\
  \n```python\nPRIVKEY_PREFIX_MAINNET = 0x80\nWIF_PREFIX_MAINNET_COMPRESSED = ['L',\
  \ 'K']\nWIF_PREFIX_MAINNET_UNCOMPRESSED = ['5']\nPRIVKEY_PREFIX_TESTNET = 0xEF\n\
  WIF_PREFIX_TESTNET_COMPRESSED = ['c']\nWIF_PREFIX_TESTNET_UNCOMPRESSED = ['9']\n\
  \ndef encodeWifPrivkey(privkey: int, for_compressed_pubkey: bool):\n    prefix_b\
  \ = bytes.fromhex('%02x' % PRIVKEY_PREFIX_TESTNET)\n    privkey_b = bytes.fromhex('%064x'\
  \ % privkey)\n    if for_compressed_pubkey == True:\n        privkey_b = privkey_b\
  \ + b'\\x01'\n    wif_encoded = base58checkEncode(prefix_b, privkey_b)\n    return\
  \ wif_encoded\n```\n\n**程序 9.7：** 生成 WIF 编码私钥的方法\n\n我们按如下方式为压缩公钥调用此方法：\n\n```python\n\
  if __name__ == '__main__':\n    h = 0x1f4b9c36e4f466464de890a341eba483eb3ed95932d797b0841afa1d8d83c420\n\
  \    wif = encodeWifPrivkey(h, True)\n    print(wif)\n```\n\n我们得到以下结果：\n\n![](img/Figure-9.3.jpg)\n\
  \n**图 9.3：** 压缩公钥生成的 WIF 编码私钥\n\n我们按如下方式为非压缩公钥调用它：\n\n```python\nif __name__ ==\
  \ '__main__':\n    h = 0x1f4b9c36e4f466464de890a341eba483eb3ed95932d797b0841afa1d8d83c420\n\
  \    wif = encodeWifPrivkey(h, False)\n    print(wif)\n```\n\n我们得到以下结果：\n\n![](img/Figure-9.4.jpg)\n\
  \n**图 9.4：** 非压缩公钥生成的 WIF 编码私钥\n\n##### 公钥\n\n私钥通常以 WIF 编码表示。我们使用 WIF 编码的私钥来生成公钥和地址。要从\
  \ WIF 编码的私钥生成公钥，我们需要将私钥转换回十六进制代码。之所以使用 WIF 编码字符串而不是十六进制代码，是因为尺寸原因。私钥呈现为 64 位十六进制代码或\
  \ 53 字符字符串。因此，使用 WIF 编码意味着少输入 11 位数字。\n\n首先，我们解码 WIF 字符串，除了获得十六进制编码的私钥外，还能得知它是用于测试网还是主网，以及用于压缩公钥还是非压缩公钥。以下是解码\
  \ WIF 字符串的代码：\n\n```python\ndef base58_decode(s: str):\n    decoded = 0\n    multi\
  \ = 1\n    s = s[::-1]\n    for char in s:\n        decoded += multi * g_alphabet.index(char)\n\
  \        multi = multi * g_base_count\n    return decoded\n\ndef base58checkDecode(s:\
  \ str):\n    with_checksum_int = base58_decode(s)\n    with_checksum_b = bytes.fromhex('%x'\
  \ % with_checksum_int)\n    decode_b = with_checksum_b[1:-4]\n    return decode_b\n\
  \ndef base58checkVerify(wif: str):\n    decoded_wif = base58_decode(wif)\n    wif_str\
  \ = '%02x' % decoded_wif\n    if len(wif_str) % 2 == 1:\n        wif_str = '0' +\
  \ wif_str\n    postfix = bytes.fromhex(wif_str)[-4:]\n    wif_without_postfix =\
  \ bytes.fromhex(wif_str)[0:-4]\n    h = hash256(wif_without_postfix)[0:4]\n    if\
  \ h == postfix:\n        return True\n    return False\n\ndef getNetworkNCompression(wif_prefix:\
  \ str):\n    if wif_prefix in WIF_PREFIX_MAINNET_COMPRESSED:\n        return 'mainnet',\
  \ True\n    elif wif_prefix in WIF_PREFIX_MAINNET_UNCOMPRESSED:\n        return\
  \ 'mainnet', False\n    elif wif_prefix in WIF_PREFIX_TESTNET_COMPRESSED:\n    \
  \    return 'testnet', True\n    elif wif_prefix in WIF_PREFIX_TESTNET_UNCOMPRESSED:\n\
  \        return 'testnet', False\n\ndef privkeyWif2Hex(privkey_wif: str):\n    assert\
  \ base58checkVerify(privkey_wif)\n    wif_prefix = privkey_wif[0:1]\n    network,\
  \ compress = getNetworkNCompression(wif_prefix)\n    privkey_b = base58checkDecode(privkey_wif)\n\
  \    privkey_i = int.from_bytes(privkey_b, byteorder='big')\n    if compress ==\
  \ True:\n        privkey_s = '%066x' % privkey_i\n    else:\n        privkey_s =\
  \ '%064x' % privkey_i\n    return privkey_s, network, compress\n```\n\n**程序 9.8：**\
  \ 将私钥编码为 WIF 编码方案的程序\n\n比特币私钥公钥密码学基于**椭圆曲线数字签名算法 (ECDSA)**。**椭圆曲线数字签名算法**使用**椭圆曲线密码学**。顾名思义，椭圆曲线是以下方程的几何表示：\n\
  \n*y² = x³ + ax + b*\n\n椭圆曲线密码学基于有限域上的椭圆曲线，也称为**伽罗瓦域**。伽罗瓦域可以是素数域或二进制域。比特币使用一种称为\
  \ `secp256k1` 的有限素数域上的特定椭圆曲线。以下是 `secp256k1` 的方程：\n\n*y² = x³ + ax + b*\n\n其中：\n\
  \np = 2²⁵⁶ - 2³² - 2⁹ - 2⁸ - 2⁷ - 2⁶ - 2⁴ - 1\n\np = 0xfffffffffffffffffffffffffffffffffffffffffffffffffffffffefffffc2f\n\
  \n还有一个称为**生成点**的变量，其值为：\n\n`G = (79BE667E F9DCBBAC 55A06295 CE870B07 029BFCDB 2DCE28D9\
  \ 59F2815B 16F81798, 483ADA77 26A3C465 5DA4FBFC 0E1108A8 FD17B448 A6855419 9C47D08F\
  \ FB10D4B8)`\n\n我们使用 Python 中的 `ecdsa` 包从私钥十六进制代码生成公钥。WIF 私钥解码后，我们使用 `ecdsa` 包。`ecdsa`\
  \ 包使用签名密钥表示私钥，使用验证密钥表示公钥。\n\n以下是我们在中使用的 `ecdsa` 包：\n\n![](img/Figure-9.5.jpg)\n\n\
  **图 9.5：** 已安装 `ecdsa` 包的 pip3 信息\n\n我们还使用 `cryptotools` 包进行 `secp256k1` 相关操作。以下程序将\
  \ WIF 编码的私钥转换为公钥：\n\n```python\nfrom ecdsa import SigningKey, SECP256k1\n\ndef compressPubkey(pubkey:\
  \ bytes):\n    x_b = pubkey[1:33]\n    y_b = pubkey[33:65]\n    if (y_b[31] & 0x01)\
  \ == 0: # even\n        compressed_pubkey = b'\\x02' + x_b\n    else:\n        compressed_pubkey\
  \ = b'\\x03' + x_b\n    return compressed_pubkey\n\ndef privkeyHex2pubkey(privkey_s:\
  \ str, compress: bool):\n    if compress == True:\n        privkey_s = privkey_s[0:64]\n\
  \    privkey_b = bytes.fromhex(privkey_s)\n    sk = SigningKey.from_string(privkey_b,\
  \ curve=SECP256k1)\n    vk = sk.get_verifying_key()\n    pubkey_b = b'\\x04' + vk.to_string()\n\
  \    if compress == True:\n        pubkey_b = compressPubkey(pubkey_b)\n    return\
  \ pubkey_b\n\ndef privkeyWif2pubkey(privkey: str):\n    privkey_s, network, compress\
  \ = privkeyWif2Hex(privkey)\n    pubkey = privkeyHex2pubkey(privkey_s, compress)\n\
  \    return pubkey\n```\n\n\n\n\n\n#### 程序 9.9：从 WIF 编码的私钥获取公钥的程序\n\n在前面的代码中，`b'\\\
  x04'` 是非压缩公钥中的前缀，而 `b'\\x02'` 和 `b'\\x03'` 用作压缩公钥的前缀。\n\n我们通过执行以下代码来调用前面的程序：\n\n\
  ```\nif __name__ == '__main__':\n    privkey_wif = 'cNdY2QGfetwijtrqzCK5tAoc78NtGkQJ8smYVaugDW6puLXJvLZG'\n\
  \    print('privkey(WIF) = ', privkey_wif)\n    privkey_s, network, compress = privkeyWif2Hex(privkey_wif)\n\
  \    pubkey_b = privkeyWif2pubkey(privkey_wif)\n    print('pubkey = %s' % pubkey_b.hex())\n\
  \    print('-----------------------------------------------------------')\n    privkey_wif\
  \ = '91phZVP8Q5yMLEZbD41vfnGYWwEZuxbjQ5huSxiPUkkTiQw8SL2'\n    print('privkey(WIF)\
  \ = ', privkey_wif)\n    privkey_s, network, compress = privkeyWif2Hex(privkey_wif)\n\
  \    pubkey_b = privkeyWif2pubkey(privkey_wif)\n    print('pubkey = %s' % pubkey_b.hex())\n\
  ```\n\n我们得到以下公钥：\n\n![](img/Figure-9.6.jpg)\n\n**图 9.6：** 显示从 WIF 编码私钥生成的公钥\n\n\
  ### 地址\n\n当商家或交易者要求以其服务或产品换取比特币时，他们会提供自己的比特币地址。我们将请求的比特币转账到他们的地址，并将剩余的找零保存到另一个地址。在本小节中，我们将理解并从公钥生成地址。\n\
  \n下图展示了公钥哈希地址是如何生成的：\n\n![](img/Figure-9.7.jpg)\n\n**图 9.7：** 地址生成机制示意图\n\n公钥到地址的转换是一个两步过程。在第一步中，我们计算公钥的哈希值，即\
  \ `PKH`（**public-key-hash**，公钥哈希）。在第二步中，我们使用 `base58check` 算法对 `PKH` 进行编码。使用校验和的一个重要好处是，几乎不可能在输入错误的情况下仍生成有效地址。这是比特币的一项重要安全特性。助记码也使用\
  \ `base58check` 算法，提供相同的好处。错误的顺序、错误的单词或重复的单词几乎永远不会导致资金损失。\n\n使用 `hash160` 和地址代替公钥可提供增强的安全性。如果未来量子计算机能够从公钥推导出私钥，那么对公钥进行哈希处理仍将是安全的。因此，除非我们暴露了公钥，否则我们的比特币仍将是安全的。这很重要，因为公钥-私钥加密的失效将导致互联网上几乎所有事物陷入混乱。\n\
  \n也可以使用脚本代替公钥。在这种情况下，前图中的公钥将被脚本替换。公钥地址称为 **Pay-to-Public-Key-Hash**（**P2PKH**，支付给公钥哈希）地址，脚本地址称为\
  \ **Pay-to-Script-Hash**（**P2SH**，支付给脚本哈希）地址。\n\n下表列出了与网络和地址类型相关的版本前缀：\n\n![](img/306.jpg)\n\
  \n**表 9.2：** 地址前缀表\n\n在前面的表中，我们可以看到 `testnet` 和 `regtest` 使用相同的版本前缀。\n\n以下程序将公钥转换为地址：\n\
  \n```\nPKH_MAINNET_PREFIX = 0x00\nSH_MAINNET_PREFIX = 0x05\nPKH_TESTNET_PREFIX =\
  \ 0x6F\nSH_TESTNET_PREFIX = 0xC4\nPKH_REGTEST_PREFIX = 0x6F\nSH_REGTEST_PREFIX =\
  \ 0xC4\n\ndef hash160(secret: bytes):\n    secrethash = hashlib.sha256(secret).digest()\n\
  \    h = hashlib.new('ripemd160')\n    h.update(secrethash)\n    secret_hash160\
  \ = h.digest()\n    return secret_hash160\n\ndef pkh2address(pkh: bytes):\n    prefix\
  \ = PKH_TESTNET_PREFIX\n    address = base58checkEncode(bytes.fromhex('%02x' % prefix),\
  \ pkh)\n    return address\n\ndef sh2address(sh: bytes):\n    prefix = SH_TESTNET_PREFIX\n\
  \    address = base58checkEncode(bytes.fromhex('%02x' % prefix), pkh)\n    return\
  \ address\n\ndef pubkey2address(pubkey: bytes):\n    pkh = hash160(pubkey)\n   \
  \ address = pkh2address(pkh)\n    return address\n```\n\n**程序 9.10：** 将公钥转换为地址的程序\n\
  \n我们使用以下程序调用前面的方法，以从压缩和非压缩公钥获取地址：\n\n```\nif __name__ == '__main__':\n    pubkey\
  \ = '0240bb63da114aa89f4d2cf35d695d3e52e6add7a4bae06f190d947bef5c62b5e0'\n    pubkey_b\
  \ = bytes.fromhex(pubkey)\n    print('Compressed PubKey = ', pubkey_b.hex())\n \
  \   address = pubkey2address(pubkey_b)\n    print('Address = ', address)\n    print('-----------------------------------------------')\n\
  \    pubkey = '0440bb63da114aa89f4d2cf35d695d3e52e6add7a4bae06f190d947bef5c62b5e0e99601851593a9e54e2059a25d76512698acf60089935dedc015f1bb2bc81eda'\n\
  \    pubkey_b = bytes.fromhex(pubkey)\n    print('Uncompressed PubKey = ', pubkey_b.hex())\n\
  \    address = pubkey2address(pubkey_b)\n    print('Address = ', address)\n```\n\
  \n我们得到以下结果：\n\n![](img/Figure-9.8.jpg)\n\n**图 9.8：** 显示从公钥生成的地址\n\n### 分层确定性（HD）钱包\n\
  \n在早期版本中，钱包是存储在文件中的私钥-公钥对集合。该文件需要多次备份并保存在多个安全位置。这很麻烦，且在早期导致许多人丢失币。然而，这有一个优势：由于这些密钥不是从单一种子生成的，意外泄露秘密不会导致派生地址中的所有币丢失。这些是非确定性钱包。\n\
  \n替代方案是确定性钱包，它使用单一种子和索引生成。分层确定性钱包需要一个表示密钥层级位置的字符串，而不是索引值。这允许从单一种子生成大量密钥。此外，它通过在层级中选择不同的层级位置，提供了一种为不同目的对地址进行分组的方法。\n\
  \n分层确定性钱包使用 12 个、18 个或 24 个单词的助记码，这使得种子更容易记忆，同时提供与任何复杂密码相似的安全性。记忆和输入 12 个单词更容易。如果钱包需要每次都输入它们，或者你不想写在纸上，这很有用。24\
  \ 个单词的代码更安全，在大多数情况下推荐使用。\n\n使用 BIP32 中定义的确定性钱包，可以更轻松地在需要时生成私钥和公钥对，或仅生成公钥。这消除了钱包实体形式的需求。因此，当我们旅行、消费或交易时，可以根据需要生成地址和私钥。仍然存在意外泄露助记码并损失所有积蓄的风险，但如果我们始终在离线状态下生成密钥或地址，几乎可以消除这种风险。有一种称为硬件钱包的专用设备正是这样做的，因此被认为是存储比特币的最佳方式。\n\
  \n下图说明了使用 BIP32 规范的助记码词表为分层确定性钱包生成密钥的过程：\n\n![](img/Figure-9.9.jpg)\n\n**图 9.9：**\
  \ 使用助记码词表生成密钥的示意图\n\n\n\n\nBIP32 规范使用 `pbkdf2-hmac` 算法生成私钥。`pbkdf2` 代表 **Password-Based\
  \ Key Derivation Function 2**（基于密码的密钥派生函数 2）。`pbkdf2` 需要哈希算法作为输入。我们使用 `SHA512` 作为\
  \ `pbkdf2` 所需的哈希算法。此外，`pbkdf2` 是一个迭代的密钥派生过程；迭代次数越高，派生出的密钥对暴力破解攻击越安全，但次数越高生成时间也越长。如果我们一次性生成足够多的私钥-公钥对，以免反复运行程序，则可以使用更高的迭代次数。Bitcoin\
  \ Core 就是这样做的，首次运行时生成 100 个私钥、公钥和地址。一旦生成密钥和地址，钱包文件对用户而言就像是一个 JBOK。建议迭代次数应超过 10,000。Bitcoin\
  \ Core 使用 25,000 次迭代，但也有相当流行的钱包仅使用 2048 次迭代，这可能意味着如果我们不想创建 JBOK 钱包文件并希望高效使用，2048\
  \ 次也是可以接受的。我们将使用 10,000 次来平衡时间和安全性。\n\n下图展示了种子的生成过程：\n\n![](img/Figure-9.10.jpg)\n\
  \n**Figure 9.10:** 从助记词列表生成种子的机制示意图\n\n要在 Python 代码中实现此功能，我们需要 `hmac` 和 `pbkdf2`\
  \ 包。我们使用来自以下源代码的 `pbkdf2` 源码：\n\n**[`github.com/sfstpala/python3-pbkdf2`](https://github.com/sfstpala/python3-pbkdf2)**\n\
  \n我们还需要用于 `secp256k1` 椭圆曲线加密的以下包：\n\n![](img/Figure-9.11.jpg)\n\n**Figure 9.11:**\
  \ 已安装 `cryptotools` 包的 `pip3` 包信息\n\n以下代码从助记词列表生成种子：\n\n```\nimport pbkdf2\nimport\
  \ hashlib\nimport hmac\nimport struct\nfrom cryptotools.ECDSA.secp256k1 import PublicKey,\
  \ \\\n    PrivateKey, Point, G as secp256k1_G, \\\n    N as secp256k1_n, CURVE\n\
  \niterations_g = 10000\ndklen_g = 64 # derived key length\n\ndef genSeedFromStr(password:\
  \ str, salt: str):\n    password_b = password.encode('utf-8')\n    salt_b = salt.encode('utf-8')\n\
  \    seed = pbkdf2.pbkdf2(hashlib.sha512, password_b, salt_b, iterations_g, dklen_g)\n\
  \    return seed\n```\n\n**Program 9.11:** 从助记词列表和盐字符串生成种子的程序\n\n我们将助记词列表和口令传递给种子生成方法，如下所示：\n\
  \n```\nif __name__ == '__main__':\n    mnemonic_code_l = ['moral', 'submit', 'comfort',\
  \ 'cupboard', 'organ',\n                       'expand', 'home', 'bid', 'dawn',\
  \ 'ozone', 'omit', 'helmet']\n    mnemonic_code = ' '.join(mnemonic_code_l)\n  \
  \  print('Mnemonic Code = ', mnemonic_code)\n    seed = genSeedFromStr(mnemonic_code,\
  \ 'mnemonic' + 'mycomplexpasscode')\n    print('seed = %s' % seed.hex())\n```\n\n\
  结果我们得到一个 512 位的种子：\n\n![](img/Figure-9.12.jpg)\n\n**Figure 9.12:** 显示程序生成的种子和助记词\n\
  \n一旦使用 `pbkdf2` 从助记词派生出种子，我们就使用该密钥生成主密钥对，然后进一步生成子密钥对。我们使用 HMAC 代码生成这些密钥。HMAC 代表\
  \ **Hash-based Message Authentication Code**（基于哈希的消息认证码）。\n\n### HMAC：基于哈希的消息认证码\n\
  \n下图演示了基于哈希的消息认证：\n\n![](img/Figure-9.13.jpg)\n\n**Figure 9.13:** 基于 HMAC 的认证机制示意图\n\
  \nBob 与 Alice 共享密钥，因此只有 Bob 和 Alice 知道该密钥。Bob 需要向 Alice 发送消息 (m)。他使用 `HMAC-SHA512`\
  \ 哈希算法生成哈希值 (h)，并将其连同消息一起发送给 Alice。当 Alice 收到消息时，她使用相同的 `HMAC-SHA512` 算法再次生成哈希值。如果计算出的哈希值与接收到的哈希值相同，她就能确信消息未被篡改。\n\
  \n我们使用 `HMAC-SHA512` 算法生成主密钥对及后续的子密钥对。\n\n### 主密钥生成\n\n下图演示了主私钥生成和主链码生成，这将用于在密钥对层级的下一层生成子密钥：\n\
  \n![](img/Figure-9.14.jpg)\n\n**Figure 9.14:** 从种子字节生成主密钥地址的示意图\n\n程序如下：\n\n```\n\
  def genMasterKeys(seed: bytes):\n    h = hmac.new(bytes(\"Bitcoin seed\", 'utf-8'),\n\
  \                 seed,\n                 hashlib.sha512).digest()\n    private_key\
  \ = int.from_bytes((h[0:32]), byteorder='big')\n    chaincode = h[32:64]\n    return\
  \ private_key, chaincode\n```\n\n**Program 9.12:** 生成主私钥和链码对的程序\n\n我们按如下方式调用此方法：\n\
  \n```\nprivkey, chaincode = genMasterKeys(seed)\nprivkey_s = '%064x' % privkey\n\
  print('master privkey = %s' % privkey_s)\nprint('master chaincode = %s' % chaincode.hex())\n\
  ```\n\n这将生成以下主私钥和链码：\n\n![](img/Figure-9.15.jpg)\n\n**Figure 9.15:** 显示程序生成的主私钥和主链码\n\
  \n##### 密钥派生\n\n#### 父私钥 -> 子私钥\n\n树中每个位置的密钥对都可以生成子密钥对。对于第一层子密钥，我们有以下子私钥派生机制：\n\n\
  ![](img/Figure-9.16.jpg)\n\n**Figure 9.16:** 子私钥派生机制示意图\n\n要派生子私钥和子链码，我们需要父私钥、父公钥、父链码以及要派生的子密钥索引。此方法用于派生索引从\
  \ 0 到 2³¹ - 1 的子密钥。\n\n以下代码实现了子密钥派生过程：\n\n```\ndef finiteFieldAddition(a: int, b:\
  \ int, modulo: int):\n    return (a + b) % modulo\n\ndef genNormalChildPrivKey(privkey:\
  \ int, chaincode: bytes, index: int):\n    privkey_s = '%064x' % privkey\n    pubkey_b\
  \ = privkeyHex2pubkey(privkey_s, True)\n    index_b = struct.pack('>L', index)\n\
  \    h = hmac.new(chaincode, pubkey_b + index_b, hashlib.sha512).digest()\n    h256\
  \ = int.from_bytes(h[0:32], byteorder='big')\n    child_privkey = finiteFieldAddition(h256,\
  \ privkey, secp256k1_n)\n    child_chaincode = h[32:64]\n    return child_privkey,\
  \ child_chaincode\n```\n\n**Program 9.13:** 从父私钥和链码生成子私钥和链码的程序\n\n前面的代码运行方式如下：\n\
  \n```\nchild_privkey_i, child_chaincode = genNormalChildPrivKey(privkey, chaincode,\
  \ 1)\nchild_privkey_wif = encodeWifPrivkey(child_privkey_i, True)\nprint(\"child\
  \ privkey = %s\" % child_privkey_wif)\nprint(\"child chaincode = %s\" % child_chaincode.hex())\n\
  ```\n\n它给出以下结果：\n\n![](img/Figure-9.17.jpg)\n\n**Figure 9.17:** 显示程序生成的子私钥和子链码\n\
  \n#### 父公钥 -> 子公钥\n\nBIP32 如此有用的重要原因之一是，我们可以在不知道父私钥的情况下派生子公钥和地址。这可以防止意外暴露私钥；因此，也保护了所有后续子代的私钥。\n\
  \n这基于以下逻辑：\n\n* `P[p]`：父私钥\n* `U[p]`：父公钥\n* `P[C]`：子私钥\n* `U[C]`：子公钥\n* `H[0-31]`：从父链码、公钥和子索引获取的\
  \ `hmac(sha512)` 哈希的 32 个最高有效位 (MSB)\n* `G`：有限域椭圆曲线中的生成点\n\n正如我们在子私钥派生中所学：\n\n⇒\
  \ `P[P] + H[0-31] = P[C]` (1)\n\n两边同时乘以生成点 G：\n\n`P[P] G + H[0-31] G = P[C].G`\n\
  \n在椭圆曲线加密中，公钥派生如下：\n\n⇒ `U[x] = P[x].G` (2)\n\n由 (1)、(2) 得 ⇒ `U[P] + H[0-31] .G\
  \ = U[C]`\n\n\n\nG 是有限域中 x、y 坐标上的向量。将 G 与标量哈希相乘需要椭圆曲线有限域点乘法，而 和 的相加需要椭圆曲线有限域点加法。此外，如果我们使用的公钥是压缩的，则需要使用椭圆曲线密码学的解压算法。\n\
  \n下图对此进行了说明：\n\n![](img/Figure-9.18.jpg)\n\n**Figure 9.18:** 从父公钥和链码推导子公钥的示意图\n\n\
  以下 Python 实现从父公钥生成子公钥：\n\n```\nG_p = Point(secp256k1_G[0], secp256k1_G[1])\n\ndef\
  \ compressPubkey(pubkey_b: bytes):\n    pubkey_P = PublicKey.decode(pubkey_b)\n\
  \    pubkey_b = PublicKey.encode(pubkey_P, compressed=True)\n    return pubkey_b\n\
  \ndef genNormalChildPubKey(pubkey_b: bytes, chaincode: bytes, index: int):\n   \
  \ index_b = struct.pack('>L', index)\n    h = hmac.new(chaincode, pubkey_b + index_b,\
  \ hashlib.sha512).digest()\n    h256 = int.from_bytes(h[0:32], byteorder='big')\n\
  \    h256G = CURVE.point_mul(G_p, h256)\n    pubkey_b = compressPubkey(pubkey_b)\n\
  \    pubkey_point = Point.from_compact(pubkey_b[1:])\n    child_pubkey_point = h256G\
  \ + pubkey_point\n    child_pubkey_b = PublicKey.encode(child_pubkey_point, compressed=True)\n\
  \    child_chaincode = h[32:64]\n    return child_pubkey_b, child_chaincode\n```\n\
  \n**Program 9.14:** 从父公钥和链码推导子公钥和链码的程序\n\n我们按如下方式调用上述代码：\n\n```\npubkey_b = privkeyHex2pubkey(privkey_s,\
  \ True)\nchild_pubkey_b, child_chaincode = genNormalChildPubKey(pubkey_b,\n    chaincode,\
  \ 1)\nprint(\"child pubkey key = %s\" % child_pubkey_b.hex())\nprint(\"child chaincode\
  \ = %s\" % child_chaincode.hex())\n```\n\n这将给出以下结果：\n\n![](img/Figure-9.19.jpg)\n\
  \n**Figure 9.19:** 显示生成的子公钥和链码\n\n我们可以看到，使用私钥推导出的子链码与使用公钥推导出的链码相同。\n\n### 子私钥 ->\
  \ 父私钥（钱包私钥泄露）\n\n使用 xpub 时存在风险。如果我们意外地将子私钥暴露给拥有父级 xpub 访问权限的攻击者，他们可以找到钱包中的所有私钥并窃取所有存储的比特币。\n\
  \n以下方程解释了发生这种情况的原因：\n\n*P[p] + H[0-31] = P[C]*\n\n⇒ *P[C] - H[0-31] = P[P]*\n\n\
  这表明，通过了解子私钥的 HMAC-SHA256 哈希和私钥，我们可以得到父私钥。既然我们得到了父私钥，就可以通过相同的机制得到父级的父私钥。此外，一旦父私钥已知，我们就可以推导出其所有子私钥。这意味着仅丢失一个私钥和相应的父级\
  \ xpub，就会导致整个钱包被掏空。\n\n下图说明了暴露的阶段：\n\n![](img/Figure-9.20.jpg)\n\n**Figure 9.20:**\
  \ 攻击者使用单个私钥推导所有私钥的示意图\n\n当有人拿到你的私钥时，他们可以从中推导出越来越多的私钥，最终到达主密钥并推导出所有密钥，就像我们用私钥推导所做的那样。\n\
  \n以下程序从子私钥推导父私钥：\n\n```\ndef genNormalParentPrivKey(child_privkey_i: int,\n    pubkey_b:\
  \ bytes,\n    chaincode: bytes,\n    index: int):\n    index_b = struct.pack('>L',\
  \ index)\n    h = hmac.new(chaincode, pubkey_b + index_b, hashlib.sha512).digest()\n\
  \    h256 = int.from_bytes(h[0:32], byteorder='big')\n    privkey = finiteFieldAddition(-h256,\
  \ child_privkey_i, secp256k1_n)\n    return privkey\n```\n\n**Program 9.15:** 从子私钥推导父私钥的程序\n\
  \n我们按如下方式调用上述代码：\n\n```\np_privkey_i = genNormalParentPrivKey(child_privkey_i,\n\
  \    pubkey_b, chaincode, 1)\np_privkey_wif = encodeWifPrivkey(p_privkey_i, True)\n\
  print('parent privkey = %064x' % p_privkey_i)\n```\n\n这将给出以下结果：\n\n![](img/Figure-9.21.jpg)\n\
  \n**Figure 9.21:** 显示使用子私钥、公钥和链码获得的父私钥\n\n我们可以看到，这里推导出的主私钥与我们从种子获得的相同。\n\n### 硬化子密钥推导\n\
  \n在前几节中，你学习了普通密钥推导，也了解到一个容易犯的错误会导致丢失钱包中存储的所有比特币。为了避免这种情况，BIP32 还建议对子密钥推导算法进行一种称为硬化推导的修改。\n\
  \n下图说明了硬化推导的过程：\n\n![](img/Figure-9.22.jpg)\n\n**Figure 9.22:** 从硬化父私钥推导子私钥的示意图\n\
  \n我们在这里看到，在硬化推导中，父私钥后附加字节 `0x00` 来使用，而不是父公钥。硬化推导的子索引范围是从 `2³¹` 到 `2³²-1`：\n\n```\n\
  def genHardenedChildPrivKey(privkey: int, chaincode: bytes, index: int):\n    index_b\
  \ = struct.pack('>L', index)\n    privkey_b = bytes.fromhex('%064x' % privkey)\n\
  \    h = hmac.new(chaincode, b'\\x00' + privkey_b + index_b, hashlib.sha512).digest()\n\
  \    h256 = int.from_bytes(h[0:32], byteorder='big')\n    child_privkey = finiteFieldAddition(h256,\
  \ privkey, secp256k1_n)\n    child_chaincode = h[32:64]\n    return child_privkey,\
  \ child_chaincode\n```\n\n**Program 9.16:** 从硬化父私钥推导子私钥的程序\n\n我们按如下方式调用上述代码：\n\n\
  ```\nindex = ((1<<31) + 1) # 2³¹ + 1\nchild_privkey_i, child_chaincode = genHardenedChildPrivKey(privkey,\
  \ chaincode, index)\nchild_privkey_wif = encodeWifPrivkey(child_privkey_i, True)\n\
  print(\"child privkey = %s\" % child_privkey_wif)\nprint(\"child chaincode = %s\"\
  \ % child_chaincode.hex())\n```\n\n我们得到以下结果：\n\n![](img/Figure-9.23.jpg)\n\n**Figure\
  \ 9.23:** 显示硬化子私钥和链码\n\n与普通推导不同，子硬化密钥推导不支持 xpub 或扩展公钥。因此，要监视子地址，我们不能使用 xpub；相反，我们需要离线生成公钥和地址，然后将它们传递给在线钱包进行监视。与普通推导相比，这稍微不太方便，但由于安全性高得多，因此建议优于普通推导。在下一节中，我们将看到如何结合两者以在安全性和便利性之间获得更好的权衡。\n\
  \n##### 扩展密钥\n\nBIP32 还描述了主网的 `xpub` 和 `xprv` 以及测试网的 `tpub` 和 `tprv`。钱包使用它们来生成子密钥和地址。`xpub`\
  \ 和 `tpub` 用于仅生成公钥，而 `xprv` 和 `tprv` 用于生成私钥。生成的 `xpub` 或 `tpub` 可以提供给钱包以监视生成的地址，而无需暴露私钥或种子。生成的\
  \ `xprv` 或 `tprv` 可以提供给钱包以生成私钥。这使得 HD 钱包使用方便，这也是 BIP32 规范被几乎所有钱包软件（如 Bitcoin Core、Electrum\
  \ 以及 Nano 或 Trezor 等硬件钱包）采用的原因。\n\n下图展示了 `xprv` 推导：\n\n![](img/Figure-9.24.jpg)\n\
