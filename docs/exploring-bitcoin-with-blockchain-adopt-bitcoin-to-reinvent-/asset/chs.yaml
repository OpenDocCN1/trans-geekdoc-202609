  \    return preimage_b\n```\n\n**Program 10.17:** 准备签名预镜像\n\n我们通过使用私钥对签名预镜像进行签名来生成签名。签名后附加\
  \ `hash_type`。\n\n代码如下：\n\n```python\nfrom ecdsa import SigningKey, SECP256k1\n\
  from ecdsa.util import sigencode_der_canonize\n\ndef signMessage(preimage_b: bytes,\n\
  \                privkey_wif: str,\n                hash_type: int):\n    hash_preimage\
  \ = hash256(preimage_b)\n    privkey_s, network, compress = privkeyWif2Hex(privkey_wif)\n\
  \    if privkey_s.__len__() % 2 == 1:\n        privkey_s = \"0{}\".format(privkey_s)\n\
  \    if compress == True:\n        print('compress is true')\n        privkey_b\
  \ = bytes.fromhex(privkey_s)[:-1]\n    else:\n        privkey_b = bytes.fromhex(privkey_s)\n\
  \    sk = SigningKey.from_string(privkey_b, curve=SECP256k1)\n    sig_b = sk.sign_digest(hash_preimage,\n\
  \                           sigencode=sigencode_der_canonize) \\\n        + bytes([hash_type])\n\
  \    return sig_b\n```\n\n**Program 10.18:** 签名消息的方法\n\n在前面的代码中，我们调用了 `ecdsa` 包中的以下方法：\n\
  \n```python\nsk.sign_digest(hash_preimage,\n               sigencode=sigencode_der_canonize)\n\
  ```\n\n此方法使用预镜像的哈希值和私钥生成签名。我们知道生成的签名由 R 和 S 组成。由于比特币使用椭圆曲线算法 `SECP256k1`，该算法关于 X\
  \ 轴对称，因此可以使用 -S 获得相同的签名。这意味着同一个私钥和消息存在两个有效签名。由于签名是交易的一部分，这会导致两个交易 ID 代表同一笔交易，这是一个安全问题，也称为**交易延展性**。交易延展性还有其他发生方式。为避免此问题，我们使用\
  \ S 和 -S 中较小的一个。这就是我们向该方法传递 `sigencode_der_canonize` 参数的原因，它仅生成**低 S 值**。\n\n正如我们所见，`ScriptSig`\
  \ 具有以下结构：\n\n\n\n* **P2PKH:** `<Signature> <Public Key>`\n* **P2SH:** `OP_0 <Signature\
  \ 1><Signature 2> … <Signature N> <Redeem Script>`\n\n我们为每个资金交易输出创建 `scriptSig`：\n\
  \n```\ndef getSignaturesAndExecScripts(txn_struct: dict):\n    signgrp_l = []\n\
  \    script_l = []\n    for inp_index in range(txn_struct['input_count']):\n   \
  \     inp = txn_struct['inputs'][inp_index]\n        script_b = getExecutionScript(txn_struct,\
  \ inp_index)\n        preimage_b = createSignaturePreimage(txn_struct, script_b,\
  \ inp_index)\n        inp = txn_struct['inputs'][inp_index]\n        signgrp = []\n\
  \        for privkey in inp['privkeys']:\n            hashtype = inp['hash_type']\n\
  \            sign_b = signMessage(preimage_b, privkey, hashtype)\n            signgrp.append(sign_b)\n\
  \        signgrp_l.append(signgrp)\n        script_l.append(script_b)\n    return\
  \ txn_struct, signgrp_l, script_l\n```\n\n**程序 10.19：** 准备签名列表和脚本的方法\n\n我们使用 `scriptSig`\
  \ 列表和交易结构来准备所需的交易，如下所示：\n\n```\ndef getWithPushdata(data_b: bytes):\n    pushdata_b\
  \ = encodePushdata(len(data_b))\n    return pushdata_b + data_b\n\ndef createScriptSigForMultiSig(signgrp:\
  \ list, script_b: bytes):\n    scriptSig_b = bytes([OP_0])\n    for sign_b in signgrp:\n\
