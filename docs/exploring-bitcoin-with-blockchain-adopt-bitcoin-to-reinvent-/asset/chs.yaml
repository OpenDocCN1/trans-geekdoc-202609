  \ 12.14：** 执行 Python 程序显示 P2WSH 脚本有效\n\n### 封装的 SegWit 脚本\n\n上一小节解释的原生 SegWit 脚本也可以封装在\
  \ P2SH 中。这使得迁移到较新格式更加容易，因为封装的 SegWit 脚本仍然适用于尚未升级到 SegWit 的交易所。由于 SegWit 解决了长期存在的问题，比特币开发社区有意向比特币用户提供一种机制，以便在交易所完成迁移之前就能进行迁移。\n\
  \n如果我们想将比特币转移到 SegWit 钱包，那么由于封装的 SegWit 地址是 P2SH 地址，当前交易所在转账比特币时不会有任何问题。相反，如果我们尝试发送到原生\
  \ SegWit 地址，当前交易所将无法理解新的地址格式，因此交易将无法进行。\n\n#### 封装的 P2WPKH 或 P2SH-P2WPKH\n\nP2SH-P2WPKH\
  \ 交易具有以下脚本：\n\n`Previous scriptPubKey: OP_HASH160 <20-byte Redeem-Script-Hash> OP_EQUAL`\n\
  \n`ScriptSig: 0 <20-byte-PublicKeyHash>`\n\n`Witness:`\n\n`<Signature>`\n\n`<PublicKey>`\n\
  \n`Redeem Script: scriptSig`\n\n我们修改 `verifyScript` 以包含对封装 P2WPKH 的检查，如下所示：\n\n\
  ```\nif checkWrappedP2WPKH(st) == True:\n    prev_scriptpubkey_b = st[-1]\n    st.pop()\n\
  \    witness_l = getWitnessList(tx, inp_index)\n    pushWitnessData(witness_l)\n\
  \    print(‘P2SH_P2WPKH’)\n```\n\n此 `checkWrappedP2WPKH` 实现如下：\n\n```\ndef checkWrappedP2WPKH(st):\n\
  \    script_b = st[-1]\n    if script_b[:2] == b’\\x00\\x14’ and len(script_b) ==\
  \ 22:\n        return True\n    else:\n        return False\n```\n\n**程序 12.8：**\
  \ 检查脚本是否为 P2SH\\_P2WPKH 的方法\n\n我们使用包含 P2SH-P2WPKH 脚本的交易调用更新后的方法，如下所示：\n\n```\n#txid\
