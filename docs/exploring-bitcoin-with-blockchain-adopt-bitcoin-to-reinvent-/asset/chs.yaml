  \n![Figure 7.40](img/Figure-7.40.jpg)\n\n\n\n\n\n**图 7.40：** 对等节点响应最近的区块头列表，而非 getheaders\
  \ 请求中的内容\n\n对等节点响应了 `headers` 消息，且不包含计数为零的任何 `headers`。\n\n接下来，我们等待对等节点发送 `cmpctblock`\
  \ 消息。与此同时，我们收到了包含交易的 `inv` 消息。以下是我们收到的截断后的 `cmpctblock` 消息：\n\n![](img/Figure-7.41.jpg)\n\
