  \ Bitcoin 脚本语言、其特性及其执行过程。您学习了脚本语言如何用于交易验证。您了解了 Bitcoin 使用的不同脚本类型，并理解了 Bitcoin 脚本的原理和机制。此外，您还学习了如何创建交易并将其发布到\
  \ Bitcoin 网络。本章涉及相当多的编码工作。\n\n在下一章中，您将学习并创建智能合约和其他有用的交易。\n\n### 要点回顾\n\n*   Bitcoin\
  \ 交易通过包含哈希值的锁定脚本进行保护，如果我们想使用该交易为新创建的交易提供资金，则需要提供相应的脚本或公钥。\n*   要创建新交易，我们还需要根据脚本类型和哈希类型的要求，通过对消息进行签名来提供签名。\n\
  *   Bitcoin 脚本语言基于**逆波兰表示法**（*Reverse Polish Notation*）。\n*   当节点接收到新创建的交易时，它需要根据共识规则进行验证，并需要验证用于解锁\
  \ `scriptPubKey` 锁定资金的 `scriptSig`。\n*   对于 P2PKH 脚本，`scriptSig` 首先执行，然后使用相同的堆栈执行来自前一个交易输出的\
  \ `scriptPubKey`。结果位于堆栈顶部。\n*   对于 P2SH 脚本，在第一遍中执行 `scriptSig`，然后执行 `scriptPubKey`。在第三遍中，签名首先被压入堆栈，然后执行赎回脚本。\n\
  *   新创建的交易可以通过使用 Bitcoin Core 命令 `sendrawtransaction` 发布到 Bitcoin 网络。\n*   如果您不想维护全节点，仍然可以使用\
  \ SPV 软件发布新创建的交易。此外，还有几个在线网站可以推送新交易。\n*   在发送交易之前，我们可以使用 Bitcoin Core 命令 `decoderawtransaction`\
  \ 对其进行解码，从而允许我们手动验证创建的交易。\n*   我们还可以通过使用 Bitcoin Core 命令 `testmempoolaccept` 来检查创建的交易是否有效。\n\
  *   P2PKH 和 P2SH 脚本在锁定的资金被用于交易之前会隐藏公钥。\n*   脚本语言提供了大量可用于编写复杂智能合约的操作码，但 P2SH 将这些复杂性对发送方隐藏。\n\
