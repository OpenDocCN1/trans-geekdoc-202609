  _\\_\\_\\_\\_ 处拥有输出。\n\n### 第 12 章\n\n##### 隔离见证\n\n到目前为止，你已经了解了比特币及其构建模块、白皮书、网络协议、网络消息传递、数据库索引、交易创建、交易脚本和智能合约。这涵盖了比特币功能和实现的各个方面。\n\
  \n在本节中，我们将探讨一些使比特币更加有趣的高级主题。\n\n我们将从隔离见证开始本章，也称为 *SegWit*。隔离见证是比特币历史上最大的增强之一，也是唯一一个在一定程度上修改了比特币白皮书、解决了长期存在的交易延展性错误、增加了中本聪限制为\
  \ 1MB 的区块容量、改变了矿工计算网络费用的方式、并改变了增强功能传统接受方式的增强，开启了功能激活的新视角。所有这些都发生在一个增强中，因此需要专门用一章来介绍。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   理解隔离见证\n    *   交易延展性\n    *   隔离见证\n       \
  \ *   用户激活软分叉 (UASF)\n        *   交易结构\n            *   Coinbase 交易\n          \
  \  *   其他交易\n        *   隔离见证作为扩容解决方案\n        *   交易费用计算\n*   新标准脚本\n    *   原生\
  \ SegWit 交易脚本\n        *   原生 P2WPKH\n        *   原生 P2WSH\n    *   封装 SegWit 脚本\n\
  \        *   封装 P2WPKH 或 P2SH-P2WPKH\n        *   封装 P2WSH 或 P2SH-P2WSH\n*   签名验证\n\
  *   地址格式和生成\n\n### 目标\n\n在本章中，你将了解隔离见证增强、为什么需要它、它解决了什么问题、它的特性是什么、如何识别 SegWit 交易、如何验证和创建\
  \ SegWit 引入的脚本类型，以及如何计算 SegWit 交易的网络费用。\n\n我们将深入探讨该增强的各个方面，通过理解错误是如何解决的、如何对原始白皮书进行更改、理解涵盖每种脚本类型的\
  \ BIP 增强提案的详细内容，以及使用它们验证和创建交易。\n\n### 理解隔离见证\n\n隔离见证的引入主要是为了修复多个 *交易延展性* 错误。在本节中，你将了解\
  \ *交易延展性* 错误是如何让比特币网络脆弱了数年，以及交易所不得不采取何种权宜之计来避免因这些错误引发的问题。\n\n##### 交易延展性\n\n交易延展性是指同一笔交易可以拥有不同的交易\
  \ ID 的场景，这反过来意味着代表同一笔交易的两个不同交易。\n\n\n\n因此，即使交易由同一人签名，也无法依赖未确认的交易。例如，某人可能只是修改内存池中的交易并发布它，这可能会被挖掘。这意味着即使是你自己的交易，也无法将未确认的交易串联起来。\n\
  \n钱包也可能在等待一个不同的交易 ID，却收到了另一个交易 ID，因此它会忽略该交易。这会导致钱包认为它正在处理另一笔交易，因此即使交易已确认，它也可能将你的交易视为未确认。黑客可能利用这一点误导钱包或交易所。\n\
  \n交易延展性漏洞可由签名者（第一方）使用，也可由接收或知晓交易并对其进行修改的第二方或第三方使用。\n\n比特币网络初期存在以下交易延展性问题。\n\n* \
  \  **第二方或第三方利用的延展性漏洞：**\n    *   在比特币使用的椭圆曲线加密中，`(R, S)` 和 `(R, -S)` 都是曲线上的有效点。在\
  \ `SegWit` 增强之前，这是通过取两个有效 `S` 值中较小的一个来处理的。\n    *   早期，非 `DER` 编码的签名是有效的。这些被设为非法，并强制执行\
  \ `DER` 格式。\n    *   签名前的前导零。\n    *   几种不改变脚本预期有效性的脚本相关修改也是延展性的来源。例如，操作码 `OP_0`\
  \ 将零字节压入栈，即什么都不做，因此插入 `OP_0` 不会改变脚本行为。\n\n*   **第一方利用的延展性漏洞：**\n    *   签名消息时，签名者需要生成一个随机数。该随机数会导致不同但有效的签名。`RFC6979`\
  \ 通过指定确定性数字签名生成过程解决了此问题。然而，这无法验证，因此仍会导致延展性。\n\n通过引入对脚本和签名格式强制执行的规则，可以解决第二方和第三方的延展性问题，但这无法解决签名者自身滥用延展性漏洞欺骗钱包或交易所的问题。`BIP-62`\
  \ 试图解决由第二方或第三方滥用延展性引起的交易延展性问题，但其实现相当复杂，因为它试图解决太多问题。\n\n> **提示：** 如果你通过 `SegWit`\
  \ 前的交易发送比特币，则需注意任何人都可以更改你的交易 ID。此外，你不应串联未确认的交易。\n\n尽管 `BIP-62` 解决了大多数问题，但它并不完美，因此无法串联未确认的交易。这意味着如果修改后的父交易被接受，依赖交易可能会变得无效。\n\
  \n下图展示了交易延展性如何影响依赖的未确认交易：\n\n![](img/Figure-12.1.jpg)\n\n**图 12.1：** 交易延展性对未确认交易的影响\n\
  \n以下序列解释了这如何发生：\n\n1.  Alice 创建交易 `TxA`，支付给 Bob。\n2.  Alice 告诉 Bob 她已付款，交易 ID 为\
  \ `TxA`。\n3.  攻击者在收到 `TxA` 后立即创建交易 `TxA'` 并将其发布到比特币网络。\n4.  Alice 创建交易 `TxB`，从 `TxA`\
  \ 的找零中支付给 Carol。\n5.  `TxA'` 被添加到比特币区块链。\n6.  Bob 从未收到 `TxA` 的确认，认为其失败。\n7.  同样，Carol\
  \ 从未收到付款，因为 `TxA'` 不是 `TxB` 的输入。\n8.  Alice 再次支付 Bob 和 Carol，却不知她给 Bob 的交易已成功。\n\
  9.  Bob 收到了双重付款，Alice 现在需要追回，前提是 Bob 同意。\n\n2014 年，世界最大的交易所被黑客攻击，人们损失了巨额资金。据认为攻击者利用交易延展性攻破了该交易所。然而，我们知道这些事情是如何以及为何发生的，因此交易所和钱包软件知晓这些问题，并已采取措施避免陷入陷阱。\n\
  \n交易延展性最终通过隔离见证增强的实施得以解决。\n\n##### 隔离见证\n\n隔离见证是长期存在的交易延展性问题的解决方案。它将签名移出交易 ID 计算，解决了所有形式的交易延展性问题。\n\
  \n下图展示了 `SegWit` 如何改变白皮书设计：\n\n![](img/Figure-12.2.jpg)\n\n**图 12.2：** 展示白皮书差异的\
  \ SegWit 交易图\n\n在上图中，可以看到 `SegWit` 交易的签名不再是交易的一部分。它作为扩展随交易一起发送。\n\n`SegWit` 允许在交易未确认时将其串联，我们可以依赖交易\
  \ ID。这使得两个人可以发送离线交易，前提是双方都签署了支付合同。因此，闪电网络成为可能，这改变了全球支付的方式。我们将在下一章进一步讨论这一点。\n\n规划\
  \ `SegWit` 时，`1MB` 区块限制显现为可扩展性问题，因为区块达到上限，内存池变满，网络费用飙升。\n\n由于 `SegWit` 是软分叉，旧节点忽略\
  \ `SegWit` 交易中的签名，因此它们不计入 `1MB` 区块计算。这使得所需的区块大小增加能够纳入增强中。`SegWit` 交易的区块大小增加也降低了这些交易的手续费。\n\
  \n在升级节点的修改后区块大小计算中，交易中与 `SegWit` 相关的字节被视为四分之一字节。此外，`SegWit` 引入了新的标准 `scriptPubKey`，进一步减少了交易中的字节需求。这两点使\
  \ `SegWit` 交易更具经济性。\n\n`SegWit` 激活影响了我们对比特币价值、网络和增强的看法。曾存在一种观点认为重大增强应通过硬分叉进行，且对增强的投票应基于算力。\n\
  \n由于 `SegWit` 激活是一项重大变更，它影响了生态系统中的每个人，每个人都必须做出选择，许多人试图拖延。`SegWit` 激活遵循 `BIP 9`，于\
  \ 2016 年 11 月 15 日进入*启动* 阶段。因此，超时时间设定为开始日期后 1 年，在此之前需要达成共识；否则，激活将标记为失败。\n\n到 2017\
  \ 年 8 月，绝大多数节点已准备好支持 `SegWit`，但矿工间未达成共识。比特币开发者社区将其视为经济多数与算力多数之间的错位。随着矿池的兴起，算力多数不代表经济多数，因为少数矿池拥有大部分算力，这在用户对新增强的支持中显而易见。为了让其他利益相关者在决策中发挥作用，我们需要改变增强激活的方式。这导致了称为**用户激活软分叉**（**UASF**）的新激活机制。\n\
  \n### 用户激活软分叉 (UASF)\n\n用户激活软分叉是由经济多数而非矿工的算力多数强制执行的激活规则。经济多数代表全节点的意愿。\n\n创建 `BIP\
  \ 148` 是为了在算力多数不激活隔离见证相关的 `BIP`（即 `BIP 141`、`BIP 143` 和 `BIP 147`）时强制部署 `SegWit`。\n\
  \n### 交易结构\n\n\n\n##### 隔离见证\n\n隔离见证将签名移出交易 ID 计算，从而修改了交易结构。您已经了解到，区块中所含交易的完整性是通过将\
  \ Merkle 根添加到区块头来验证的。Merkle 根是按顺序使用区块中所有交易的交易 ID 计算得出的。由于隔离见证将签名移出了交易 ID 计算，Merkle\
  \ 根也不再验证区块中签名的完整性。但如果这对攻击者没有帮助，因为它无法更改交易 ID，我们为什么要关心呢？答案是攻击者可以将其用作拒绝服务攻击。攻击者可以获取一个有效区块，创建数百万个有效区块，并将它们广播到网络上。这将导致比特币网络无法验证交易和区块，从而瘫痪整个网络。\n\
  \n比特币区块在 coinbase 交易的输出之一中包含隔离见证 Merkle 根或见证根。这确保了所有交易完整内容（包括签名）的完整性。隔离见证 Merkle\
  \ root 是整个交易的 Merkle 根，这与区块头中的 Merkle 根不同，后者使用所有交易的交易 ID 来计算 Merkle 根。\n\n我们将首先了解普通交易\
  \ ID 的结构，然后计算 `wtxid`，并利用它来获取见证根。\n\n#### Coinbase 交易\n\n下图显示了包含与 SegWit 相关的附加信息的\
  \ coinbase 交易：\n\n![](img/Figure-12.3.jpg)\n\n**图 12.3：** Coinbase 交易结构\n\n在上图中，有几点需要记住：\n\
  \n*   见证数量 = 输入数量\n*   SegWit 标记为 `0x00`\n*   对于 SegWit 交易，SegWit 标志设置为 `0x01`\n\
  *   输入数量 = 1\n*   承诺哈希 = `hash256` (`见证根哈希` || `见证保留值`)\n*   见证根哈希是见证交易 ID 的 Merkle\
  \ 根，或完整交易的 `hash256`\n*   见证保留值是 coinbase 交易中的 32 字节见证。由于 coinbase 交易中没有真实的输入，见证保留值可以是任意值。由于任何人都可以查看见证中的值，因此可以验证承诺哈希。\n\
  \n**交易 ID** (`txid`) 通过对交易的以下部分进行 `hash256` 运算来计算：\n\n`txid = hash256([版本][输入计数][输入][输出计数][输出]\
  \ [锁定时间])`\n\n见证交易 ID (`wtxid`) 通过对完整交易进行 `hash256` 运算来计算，如下所示：\n\n`wtxid = hash256([版本][segwit\
  \ 标记][segwit 标志][输入计数][输入] [输出计数][输出][见证数据][锁定时间])`\n\n以下程序解析近期区块中的 coinbase 交易：\n\
  \n```\ndef getCoinbaseTransactionInfo(txn_m: mmap):\n    tx = {}\n    startloc =\
  \ txn_m.tell()\n    tx['version'] = txn_m.read(4)[::-1].hex()\n    tx['inp_cnt']\
  \ = getVarInt(txn_m)\n    tx['is_segwit'] = False\n    if tx['inp_cnt'] == 0:\n\
  \        # check segwit flag\n        tx['is_segwit'] = (int.from_bytes(txn_m.read(1),\
  \ byteorder='little') == 1)\n    if tx['is_segwit'] == True:\n        tx['inp_cnt']\
  \ = getVarInt(txn_m)\n    inp_l = []\n    for i in range(tx['inp_cnt']):\n     \
  \   inp = {}\n        inp['prev_tx_hash'] = txn_m.read(32)[::-1].hex()\n       \
  \ inp['prev_tx_out_index'] = txn_m.read(4)[::-1].hex()\n        inp['bytes_coinbase_data']\
  \ = getVarInt(txn_m)\n        pos = txn_m.tell()\n        inp['bytes_height'] =\
  \ getVarInt(txn_m)\n        inp['height'] = int.from_bytes(txn_m.read(inp['bytes_height']),\
  \ byteorder='little')\n        size = txn_m.tell() - pos\n        coinbase_arb_data_size\
  \ = inp['bytes_coinbase_data'] - size\n        inp['coinbase_arb_data'] = txn_m.read(coinbase_arb_data_size).hex()\n\
  \        inp['sequence'] = txn_m.read(4)[::-1].hex()\n        inp_l.append(inp)\n\
