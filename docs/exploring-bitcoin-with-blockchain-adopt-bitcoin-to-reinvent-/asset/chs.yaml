  ```\n\n这将给我们以下脚本：\n\n![](img/Figure-6.35.jpg)\n\n**图 6.35：** 显示通过解压脚本数据获得的 scriptPubKey\n\
  \n这结束了关于交易的本节内容。在本节中，我们主要关注数据库中的交易格式和交易索引。脚本内容将留待后续章节介绍。\n\n##### 挖矿\n\n挖矿是寻找 Nonce\
  \ 并创建区块的过程。我们在前面的章节和节中学到了一些知识，这些知识将有助于理解挖矿过程。\n\n挖矿涉及以下内容：\n\n*   消耗能量以寻找 Nonce，这是创建数值低于目标阈值的区块哈希所必需的。\n\
  *   了解区块奖励。\n*   从内存池中选择交易，以在区块大小限制内最大化交易奖励。\n*   使用区块奖励、交易手续费、区块高度和用于将奖励支付给自己地址的\
  \ `scriptPubKey` 创建 Coinbase 交易。\n*   寻找 Merkle 根。\n*   寻找下一个区块的目标阈值。\n*   准备并支持软分叉。\n\
  *   创建区块头中的其他字段。\n\n在本节中，我们将调查上述每一项。\n\n##### 挖矿盈利能力\n\n要计算挖矿盈利能力，我们需要了解使用流行挖矿设备寻找\
  \ Nonce 所需的能量，以及每笔交易中获得的区块奖励和总交易手续费是多少。\n\n### 区块奖励\n\n区块奖励是创建比特币的机制。区块奖励随时间减少。比特币网络创建时，每个区块的区块奖励为\
  \ 50![](img/Bitcoin.jpg)。目前为 6.25![](img/Bitcoin.jpg)。每 210,000 个区块，区块奖励减半。这减少了新铸造比特币的供应量。\n\
  \n以下程序给出指定区块高度的区块奖励：\n\n```\ndef getBlockReward(block_height):\n    halving_count\
  \ = block_height // 210000\n    block_reward = 50 / (2 ** halving_count)\n    return\
  \ block_reward\n```\n\n**程序 6.22：** 获取给定区块高度区块奖励的程序\n\n我们为给定的区块高度调用此方法，如下所示：\n\n\
  ```\nif __name__ == '__main__':\n    block_reward = getBlockReward(645675)\n   \
  \ print(block_reward)\n```\n\n这给我们以下结果：\n\n![](img/Figure-6.36.jpg)\n\n**图 6.36：**\
  \ 显示通过运行前面程序获得的区块奖励\n\n这意味着高度为 `645675` 的区块的区块奖励为 `6.25₿`。\n\n### 交易手续费\n\n我们可以通过以下公式计算交易的手续费：\n\
  \n*f : 交易手续费*\n\n*i[n]: 第 n 个输入*\n\n*o[n]: 第 n 个输出*\n\n*f = ∑[n]i[n] - ∑[n]o[n]\
  \ (1)*\n\n要编写计算交易手续费的程序，我们需要在 txindex 中查找上一笔交易。节点总是根据存储在链状态数据库中或内存池中的先前未花费交易输出来验证交易。区块中的所有交易都已经过验证。节点只需根据区块中包含的交易列表验证区块头和\
  \ Merkle 根哈希。由于我们试图查找已验证并确认的交易的先前交易输出，因此我们需要 txindex 来查找交易。\n\n以下方法返回交易输出中锁定的比特币价值：\n\
  \n```\ndef getTransactionOutAmount(tx_hash: bytes, out_index: int, txindex_db):\n\
  \    tx = findTransaction(tx_hash, txindex_db)\n    return tx['outs'][out_index]['satoshis']\n\
  ```\n\n**程序 6.23：** 从 txindex 获取 UTXO 金额的程序\n\n该方法调用 *程序 6.17* 中定义的 `findTransaction`。\n\
  \n以下方法使用前面方法中的交易输入锁定值，并返回与该交易关联的交易手续费：\n\n```\ndef getTransactionFee(tx: dict):\n\
  \    inp_val = 0\n    for inp in tx['inputs']:\n        prev_tx_hash = bytes.fromhex(inp['prev_tx_hash'])[::-1]\n\
  \        inp_val += getTransactionOutAmount(prev_tx_hash, inp['prev_tx_out_index'],\
  \ txindex_db_g)\n    out_val = 0\n    for out in tx['outs']:\n        out_val +=\
  \ out['satoshis']\n    tx_fee = inp_val - out_val\n    return tx_fee\n```\n\n**程序\
  \ 6.24：** 获取矿工从给定交易中收取的交易手续费的程序\n\n现在，我们可以将区块中交易列表收集的所有交易手续费相加。以下是计算区块矿工收取的手续费奖励的程序：\n\
  \n```\ndef getBlockFeeReward(block_hash: bytes, block_db):\n```\n\n\n\n`block_index\
  \ = getBlockIndex(block_hash, block_db)`\n\n`if ‘data_pos’ in block_index:`\n\n\
  `block_filepath = os.path.join(blocks_path_g, ‘blk%05d.dat’ % block_index[‘n_file’])`\n\
  \n`start = block_index[‘data_pos’]`\n\n`elif ‘undo_pos’ in block_index:`\n\n`block_filepath\
  \ = os.path.join(blocks_path_g, ‘rev%05d.dat’ % block_index[‘n_file’])`\n\n`start\
  \ = block_index[‘undo_pos’]`\n\n`with open(block_filepath, ‘r+b’) as block_f:`\n\
  \n`blk_m = mmap.mmap(block_f.fileno(), 0)`\n\n`blk_m.seek(start + BLOCK_HEADER_SIZE)`\n\
  \n`tx_cnt = getVarInt(blk_m)`\n\n`print(tx_cnt)`\n\n`coinbase_tx = getCoinbaseTransactionInfo(blk_m)`\n\
  \n`print(coinbase_tx)`\n\n`fee_reward = 0`\n\n`for i in range(1, tx_cnt):`\n\n`\
  \ print(i)`\n\n` start = blk_m.tell()`\n\n` tx = getTransactionInfo(blk_m)`\n\n\
  ` end = blk_m.tell()`\n\n` tx_fee = getTransactionFee(tx)`\n\n ` print(tx_fee)`\n\
  \n ` fee_reward += tx_fee`\n\n`return fee_reward`\n\n**程序 6.25：** 用于计算矿工挖掘区块所收集交易费用的程序\n\
  \n在前面的代码中，`getCoinbaseTransactionInfo` 和 `getTransactionInfo` 分别定义在*程序 6.14* 和 *程序\
  \ 6.15* 中。\n\n我们通过执行以下代码来调用该方法：\n\n```\nif __name__ == ‘__main__’:\n    block_hash_b\
  \ = bytes.fromhex('000000000000000004ec466ce4732fe6f1ed1cddc2ed4b328fff5224276e3f6f')[::-1]\n\
  \    total_tx_fee = getBlockFeeReward(block_hash_b, block_db_g)\n    print('Fee\
  \ Reward = %d' % total_tx_fee)\n```\n\n运行代码后，我们得到以下结果：\n\n![](img/Figure-6.37.jpg)\n\
  \n**图 6.37：** 显示矿工挖掘给定区块所收集的交易费用\n\n我们使用的区块哈希是高度为 `400000` 的区块，其挖矿奖励为 `2500000000`\
  \ 聪。\n\n#### Coinbase 交易金额验证\n\n利用区块奖励和交易费用之和，我们可以验证矿工收集的比特币总额是否正确，以及他们是否没有多付给自己。Coinbase\
  \ 交易输出的聪数之和告诉我们矿工付给自己的金额。以下是矿工付给自己的总奖励：\n\n![](img/Figure-6.38.jpg)\n\n**图 6.38：**\
  \ 显示支付给矿工的 Coinbase 交易输出价值\n\n我们可以看到，矿工付给自己 `2533349423 聪`，这等于我们计算出的区块奖励和费用奖励之和。\n\
  \n#### 挖矿成本\n\n矿工通过不断尝试新值来寻找 Nonce，这需要大量的 CPU 处理，因此也消耗大量能源。挖矿设备还会产生大量噪音和热量，矿工需要对其进行管理。高能耗设备还需要足够的电力负载、消防安全和维护。此外，随着历史上对挖矿的兴趣增加和更好的挖矿设备生产出来，挖矿盈利能力已经下降。根据设备消耗的电费和挖出的比特币，旧设备有可能开始亏损，因此升级设备可能成为一种必要。\n\
  \n因此，任何进入挖矿领域的人都必须确保电费低廉，并且除了在维护和安全方面的支出外，还应将利润的很大一部分用于挖矿设备的升级和扩展。\n\n要计算电费，我们需要了解寻找所需\
  \ Nonce 所需的网络算力。寻找 Nonce 所需的网络算力是寻找 Nonce 难度的结果，因此它取决于区块哈希低于目标阈值的概率。由于哈希生成随机的 256\
  \ 位代码，因此有 $2^{256}$ 种可能的结果。\n\nNonce 小于 1 的可能值只有 0，所以找到它的概率是 $1/2^{256}$。\n\nNonce\
  \ 小于 2 的可能值是 0 和 1，所以找到它们的概率是 $2/2^{256}$。\n\n这给我们得出：\n\n*p：找到 Nonce 的概率*\n\n*T：目标阈值*\n\
  \n*p = T / 2^{256}* (1)\n\n挖矿设备以极快的速度尝试寻找哈希值。\n\n1 TH/s 的算率是每秒 $10^{12}$ 次哈希。以下计算得出比特币网络的算率：\n\
  \n*t[b]：出块时间（秒）*\n\n*H[network]：网络算率*\n\n由 *(1)* 式 $\\Rightarrow$ *所需尝试次数 = H[network]\
  \ \\times t[b] = 2^{256} / T*\n\n$\\Rightarrow$ *H[network] = 2^{256} / (T \\times\
  \ t[b])*\n\n使用前面的公式，我们可以找到当前的网络算率：\n\n高度为 `645675` 的区块的目标阈值为\n\n`T = 0x1007ea0000000000000000000000000000000000000000`\n\
  \n`H[network] = 2^{256} / (600 \\times T) = 125,686,927,612,715,270,144`\n\n正如我们所见，该值为每秒\
  \ 125 亿亿次哈希 (exa-hashes per second)。这随时间呈指数级增长。下图显示了网络算率随时间上升的图表：\n\n![](img/Figure-6.39.jpg)\n\
  \n**图 6.39：** 多年来比特币网络算率的变化\n\n尽管网络算率呈指数级增长，但也有过短暂的算率下降时期。这发生在矿工开始亏损并被迫停止挖矿的时候。这是比特币挖矿与商品开采之间的一个关键区别。比特币的挖矿成本具有相当大的弹性，并根据挖矿盈利能力进行调整，而在常规开采中，利润下降不会导致开采成本下降。此外，商品矿工需要持续开采，因为关闭矿山并重新开采成本高昂，有时甚至很困难。因此，常规商品开采始终面临这样的风险：如果找不到更便宜的储备，则必须放弃开采或价格必须上涨。因此，价格上涨会导致供应增加。相比之下，在比特币中，通胀由算法固定，因此挖矿盈利能力和网络算率不会导致比特币产量发生变化。这使得比特币通胀免受禁令或限制等外部影响。\n\
  \n挖矿设备成本高达数千美元。算力最高的设备已超过 100 万亿次哈希每秒 (TH/s)。对于使用 100 TH/s 设备的矿工来说，要挖出一个区块，他们将需要：\n\
  \n![](img/c06eq-1.jpg)\n\n正如我们所见，即使是 100 TH/s 也不足以单独挖出一个区块。出于这个原因，挖矿几乎从不单独进行。要将挖矿作为一项业务进行，矿工需要加入矿池。矿池通过集体尝试寻找\
  \ Nonce 来运作。每个参与者贡献他们的 CPU 算力给矿池以寻找 Nonce。矿池中谁成功找到 Nonce 并不重要。矿池使用该 Nonce 打包区块，然后根据参与者贡献的挖矿算力比例与所有参与者分享利润。这是一个非常民主的制度，但它使挖矿更加中心化。由于只有找到\
  \ Nonce 时才会分享利润，每个矿工都倾向于加入累积算力最高的矿池，因为这增加了找到 Nonce 的概率和更频繁地分享利润。因此，比特币网络上有一些大型矿池，如果它们联手主导共识规则，那么开发者和其他利益相关者可能会失去话语权，网络将被少数玩家接管。\n\
  \n在本书撰写时，以下是几个主要的矿池：\n\n*   Foundry USA\n*   AntPool\n*   F2Pool (原文为 Fool，此处按已知矿池名称修正)\n\
  *   Poolin\n*   Binance Pool\n*   VIABLE\n*   BTC.com\n*   SlushPool\n\n比特币挖矿使用\
  \ ASIC 矿机，专门设计用于以极快的速度执行 SHA256 运算。选择合适的矿机取决于多个因素，如投入成本、功耗、产生的热量和噪音量、效率、电力来源以及回本时间。\n\
  \n新矿机可能能效更高，但可能花费巨资，这会推迟回本时间。廉价或免费的电力来源可以使低效设备更具经济性。\n\n此外，可以使用以下两种流行的矿池挖矿协议进行挖矿：\n\
  \n*   Stratum\n*   Stratum V2\n\n\n\n### Stratum V2\n\n顾名思义，Stratum V2 是 Stratum\
  \ 协议的更新版本。这些是开放协议，广泛用于矿池挖矿。Stratum V2 的效率比版本 1 高两到三倍。版本 2 还赋予了单个矿工更好的控制权，体现在区块模板的定制化方面，这可以允许矿工单独决定他们打算支持或不支持的增强功能。\n\
  \n#### 常用矿池挖矿软件\n\n*   Nice Hash\n*   Better Hash\n*   Cuddle Miner\n\n上述每款软件都有优缺点，选择取决于个人需求。\n\
  \n#### 矿池签名\n\n大多数矿池在创建区块时，会将其签名留在 Coinbase 交易的任意数据中。利用这些签名，我们可以计算出每个矿池挖出的区块所占的百分比。\n\
  \n#### 计算挖矿盈利能力\n\n利用电费成本，我们可以计算挖矿设备的平均月利润。\n\n首先，我们需要定义矿机算力、电费支出和比特币当前售价：\n\n```\n\
  MINER_HASH_RATE = 96 * 10**12\nMINER_POWER_WATT = 2832\nelectricity_rates = {\"\
  rate_slabs\": [{\"min\": 1, \"max\": 30, \"unit_price\": 4}, {\"min\": 31, \"max\"\
  : 100, \"unit_price\": 5.45}, {\"min\": 101, \"max\": 200, \"unit_price\": 7}, {\"\
  min\": 201, \"unit_price\": 8.05}]}\nCURRENT_SELL_PRICE = 3070000\n\ndef getPriceFromUnit(unit:\
  \ float):\n    rate_slabs = electricity_rates['rate_slabs']\n    price = 0\n   \
  \ for slab in rate_slabs:\n        if slab['min'] > unit:\n            continue\n\
  \        elif ('max' in slab and slab['max']) > unit or 'max' not in slab:\n   \
  \         price += (unit - slab['min']) * slab['unit_price']\n        else:\n  \
  \          price += (slab['max'] - slab['min']) * slab['unit_price']\n    return\
  \ price\n```\n\n**程序 6.26：** 定义矿机算力、电费支出和比特币价格的程序\n\n我们还需要计算网络算力：\n\n```\ndef getTargetThreshold(bits:\
  \ bytes):\n    shift = bits[3]\n    value = int.from_bytes(bits[0:3], byteorder='little')\n\
  \    target_threshold = value * 2 ** (8 * (shift - 3))\n    return target_threshold\n\
  \ndef getNetworkHashRate(target_threshold: int):\n    network_hashrate = (1<<256)/(600*target_threshold)\n\
  \    return network_hashrate\n```\n\n**程序 6.27：** 计算网络算力的程序\n\n利用挖矿设备的算力，我们可以得到矿工在\
  \ 10 分钟内挖出的区块数量：\n\n```\ndef getBlockMiningRatePer10Min(hashrate: int, target_threshold:\
  \ int):\n    network_hashrate = getNetworkHashRate(target_threshold)\n    block_mining_rate\
  \ = hashrate/network_hashrate\n    return block_mining_rate\n```\n\n**程序 6.28：**\
  \ 计算每 10 分钟挖出的区块数量的程序\n\n由于我们知道每个区块产生的比特币数量，我们可以计算 10 分钟内挖出的比特币：\n\n```\ndef getBitcoinMiningRate(hashrate:\
  \ int, bits: bytes, blk_reward: int):\n    tgt_threshold = getTargetThreshold(bits)\n\
  \    block_mining_rate = getBlockMiningRatePer10Min(hashrate, tgt_threshold)\n \
  \   bitcoin_mining_rate = block_mining_rate * blk_reward\n    return bitcoin_mining_rate\n\
  ```\n\n**程序 6.29：** 计算单台挖矿设备每 10 分钟挖出的比特币的程序\n\n这可用于计算一个月内挖出的比特币：\n\n```\ndef getBitcoinMinedPerMonth(hashrate:\
  \ int, bits: bytes, blk_reward: int):\n    btc_mined_per_month = getBitcoinMiningRate(hashrate,\
  \ bits, blk_reward) * 6 * 24 * 30\n    return btc_mined_per_month\n```\n\n**程序 6.30：**\
  \ 使用挖矿设备计算每月挖出的比特币的程序\n\n现在，要计算挖矿开支，我们需要知道矿机的功耗（瓦特）：\n\n```\ndef getUnitFromPower(power:\
  \ float):\n    unit = power * 24 * 30 / 1000\n    return unit\n\ndef getMiningPowerExpense(power:\
  \ float):\n    unit = getUnitFromPower(power)\n    expense = getPriceFromUnit(unit)\n\
  \    return expense\n```\n\n**程序 6.31：** 计算电力开支的程序\n\n利用一个月内挖出的比特币数量和挖矿开支，我们可以得到矿工一个月的利润：\n\
  \n```\ndef miningReturn(power: float, hashrate: int, bits: bytes, blk_reward: int):\n\
  \    expense = getMiningPowerExpense(power)\n    btc_mined_per_month = getBitcoinMinedPerMonth(hashrate,\
  \ bits, blk_reward)\n    revenue = btc_mined_per_month * CURRENT_SELL_PRICE\n  \
  \  profit = revenue - expense\n    return profit\n```\n\n**程序 6.32：** 计算单个矿工月度挖矿利润的程序\n\
  \n以下是调用 `miningReturn()` 方法以获取挖矿利润的代码：\n\n```\ndef getBlockHeaderBytes(blk_hash:\
