  _\\_\\_\\_，P2PKH 的全称是 \\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_。\n\n### 第 10 章\n\n# 创建和验证交易\n\
  \n在上一章中，你学习了钱包、私钥、公钥和地址，并理解了如何生成它们。你学会了创建分层确定性钱包，并理解了 HD 钱包如何简化私钥、公钥和地址的生成，以及如何帮助我们保护钱包安全并简化隐私管理。\n\
  \n比特币存在的最根本原因是转移和存储价值。这意味着当你向另一个人支付比特币时，比特币必须从你的钱包转移到对方的钱包。如果你不将比特币从你的钱包转移到另一个人的钱包，它就必须按你的意愿留在你的钱包中。此外，当对方收到比特币时，他们应该能够将其中一部分发送给另一个人，或者在发送时添加额外的比特币。\n\
  \n我们通过创建交易并将其发布到网络来转移比特币。即使我们创建交易是为了支付给对方，该交易不仅我们知晓，网络上的所有人都知道。这就像付款后大声喊出来，让所有人都知道交易已完成。因此，网络上的每个人都是交易的见证者。\n\
  \n在本章中，我们的重点将是交易。我们将解析区块中的真实交易，了解其格式和脚本语言，并验证签名。然后我们将构建自己的交易并将其发布到网络。我们还将研究常见的交易类型及其安全保护方式。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   比特币交易脚本\n    *   操作码\n    *   签名验证\n        *\
  \   哈希类型 – `SIGHASH_ALL`\n        *   哈希类型 – `SIGHASH_NONE`、`SIGHASH_SINGLE`、`SIGHASH_ANYONECANPAY`\n\
  \        *   标准比特币脚本 – P2PK\n        *   标准比特币脚本 – P2PKH\n            ![](img/ent.jpg)准备签名预镜像\n\
  \        *   标准比特币脚本 – P2MS\n        *   标准比特币脚本 – P2SH\n\n*   构建交易\n    *   构建\
  \ P2PKH 交易\n    *   构建 P2SH 交易\n\n### 目标\n\n本章的目标是帮助读者学会验证和创建交易。在本章中，你将了解区块链用于为交易提供资金并保护目标地址资金安全的脚本语言。你还将了解节点如何验证交易。然后你将学会创建交易并将其发布到比特币网络。\n\
  \n你将了解比特币脚本是如何执行的，也将了解最常用的脚本，并在交易验证和交易创建两方面详细理解它们。\n\n### 比特币交易脚本\n\n比特币交易包含两个部分：输入和输出。输入包含解锁脚本，称为\
  \ `scriptSig`；输出包含锁定脚本，称为 `scriptPubKey`。脚本 `scriptSig` 通常包含解锁先前被锁定交易所需的签名，以及用于验证签名的公钥或脚本。脚本\
  \ `scriptPubKey` 基于一种名为 *P2PK* 或 *Pay-2-Pubkey* 的早期脚本命名。现在，*P2PK* 脚本不再推荐使用，极少被采用。因此，`scriptPubKey`\
  \ 现在是一个用词不当的名称。目前，*P2PKH*、*P2SH*、*P2SH-P2WPKH* 和 *P2SH-P2WSH* 是最常用的脚本。这里的 *W* 代表见证，它作为隔离见证增强的一部分被引入。我们有单独的章节详细介绍它，因此本章不涵盖隔离见证。\n\
  \n要验证交易的脚本部分，首先执行 `scriptSig`，然后按顺序执行 `scriptPubKey`。脚本语言是一种基于栈的逆波兰语言。语言语义类似于逆波兰表示法。\n\
  \n### 逆波兰表示法\n\n逆波兰表示法也称为*后缀表示法*。以下是一个逆波兰表示法的示例：\n\n`7 + 9` 的逆波兰表示法为 `7 9 +`\n\n\
  求解时，`7` 和 `9` 入栈，`+` 是执行操作的运算符：\n\n![](img/Figure-10.1.jpg)\n\n**图 10.1：** 逆波兰表示法操作执行\n\
  \n当我们创建新交易时，我们利用 UTXO 为交易提供资金。新交易的输入包含释放 UTXO 中 `scriptPubKey` 锁定资金所需的解锁脚本。一旦两个脚本都执行完毕，栈顶将留下一个布尔值，表示脚本最终是否成功。这些脚本的执行方式就像逆波兰表示法一样。\n\
  \n### 操作码\n\n脚本由数据和操作符组成。这些操作符具有定义的操作码。操作符具有定义的功能。数据前面带有 `pushdata` 操作符，表示后续数据的字节数。\n\
  \n以下是部分操作码：\n\n| **助记符** | **十六进制** |\n| --- | --- |\n| OP_DUP | 0x76 |\n| OP_HASH160\
  \ | 0xa9 |\n| OP_EQUALVERIFY | 0x88 |\n| OP_EQUAL | 0x87 |\n| OP_CHECKSIG | 0xac\
  \ |\n| Pushdata 字节长度 | 0x01-0x4b |\n| OP_PUSHDATA1 | 0x4c |\n| OP_PUSHDATA2 | 0x4d\
  \ |\n| OP_PUSHDATA4 | 0x4e |\n\n**表 10.1：** 操作码\n\n完整的操作码列表可在以下网址找到：\n\n[`en.bitcoin.it/wiki/Script`](https://en.bitcoin.it/wiki/Script)\n\
  \n十六进制值 `0x01` 到 `0x4b` 表示数据的大小。`OP_PUSHDATA1` 表示数据大小占后续 1 字节，`OP_PUSHDATA2` 表示数据大小占后续\
  \ 2 字节，`OP_PUSHDATA4` 表示数据大小占后续 4 字节。以下是 `pushdata` 和数据的示意图：\n\n![](img/Figure-10.2.jpg)\n\
  \n**图 10.2：** Pushdata 大小编码\n\n\n\n我们使用前面的表将脚本十六进制代码转换为可读脚本：\n\n```\nop_d = {'76':\
  \ 'OP_DUP', 'a9': 'OP_HASH160', '88': 'OP_EQUALVERIFY', '87': 'OP_EQUAL', 'ac':\
  \ 'OP_CHECKSIG', 'ae': 'OP_CHECKMULTISIG', '00': 'OP_0', '51': 'OP_1', '52': 'OP_2',\
  \ '53': 'OP_3', '54': 'OP_4', '55': 'OP_5', '56': 'OP_6', '57': 'OP_7', '58': 'OP_8',\
  \ '59': 'OP_9', '5a': 'OP_10', '5b': 'OP_11', '5c': 'OP_12', '5d': 'OP_13', '5e':\
  \ 'OP_14', '5f': 'OP_15', '60': 'OP_16', '6a': 'OP_RETURN', '4c': 'OP_PUSHDATA1',\
  \ '4d': 'OP_PUSHDATA2', '4e': 'OP_PUSHDATA4'}\n```\n\n`OP_PUSHDATA1 = 0x4c`\n\n\
  `OP_PUSHDATA2 = 0x4d`\n\n`OP_PUSHDATA4 = 0x4e`\n\n`g_pushdata = range(0x01, 0x4c)`\n\
  \n```\ndef prepare_readable_script(script_b: bytes):\n    script_len = len(script_b)\n\
  \    script_sl = []\n    i = 0\n    while i < script_len:\n        if script_b[i]\
  \ in g_pushdata:\n            script_sl.append(script_b[i: i + 1].hex())\n     \
  \       script_sl.append(script_b[i+1: i+script_b[i]+1].hex())\n            i +=\
  \ 1 + script_b[i]\n        elif script_b[i] == OP_PUSHDATA1:\n            script_sl.append(op_d[script_b[i:i+1].hex()])\n\
  \            datasize_b = script_b[i + 1: i + 2]\n            script_sl.append(datasize_b.hex())\n\
  \            datasize = int.from_bytes(datasize_b, byteorder='little')\n       \
  \     script_sl.append(script_b[i + 2: i + 2 + datasize].hex())\n            i +=\
  \ 2 + datasize\n        elif script_b[i] == OP_PUSHDATA2:\n            script_sl.append(op_d[script_b[i:i+1].hex()])\n\
  \            datasize_b = script_b[i + 1: i + 3]\n            script_sl.append(datasize_b.hex())\n\
  \            datasize = int.from_bytes(datasize_b, byteorder='little')\n       \
  \     script_sl.append(script_b[i + 3: i + 3 + datasize].hex())\n            i +=\
  \ 3 + datasize\n        elif script_b[i] == OP_PUSHDATA4:\n            script_sl.append(op_d[script_b[i:i+1].hex()])\n\
  \            datasize_b = script_b[i + 1: i + 5]\n            script_sl.append(datasize_b.hex())\n\
  \            datasize = int.from_bytes(datasize_b, byteorder='little')\n       \
  \     script_sl.append(script_b[i + 5: i + 5 + datasize].hex())\n            i +=\
  \ 5 + data_size\n        else:\n            op_s = op_d[script_b[i:i+1].hex()]\n\
  \            script_sl.append(op_s)\n            i += 1\n    script_str = ' '.join(script_sl)\n\
  \    return script_str\n```\n\n**程序 10.1：** 十六进制代码转可读脚本\n\n在前面的程序中，脚本的第一个字节代表脚本的字节大小。我们选取了一些操作码并将其与对应的十六进制代码映射。\n\
  \n我们通过调用前面的方法将十六进制代码转换为可读脚本，如下所示：\n\n```\nif __name__ == '__main__':\n    data_s\
  \ = '76a91461cf5af7bb84348df3fd695672e53c7d5b3f3db988ac'\n    print('pushdata: ',\
  \ data_s)\n    script_b = bytes.fromhex(data_s)\n    print('Decoded Script: ', prepare_readable_script(script_b))\n\
  \    print('====================================================')\n    data_s =\
  \ '6a4c500029282c0002c5164b82ab2b42044dbe2b8573c969cc10d9e0bd03646ccf1e7497c4bf69678a7b6a99ce4f8dda595a2ed353f27c6195bdfd0528ff229f2619002759d5b9d236d1458d1ad7e7640b5948'\n\
  \    print('PUSHDATA1: ', data_s)\n    script_b = bytes.fromhex(data_s)\n    print('Decoded\
  \ Script: ', prepare_readable_script(script_b))\n    print('====================================================')\n\
  \    data_s = ''\n\
  \    print('PUSHDATA2: ', data_s)\n    script_b = bytes.fromhex(data_s)\n    print('Decoded\
  \ Script: ', prepare_readable_script(script_b))\n```\n\n这将给我们以下结果：\n\n![](img/Figure-10.3.jpg)\n\
  \n**图 10.3：** 显示程序解析的脚本\n\n##### 签名验证\n\n当节点收到一笔交易时，它需要根据共识规则对其进行验证，这包括根据锁定脚本（即\
  \ P2PKH 或 P2PSH，或任何其他类型的脚本）验证签名和公钥。你已在*第 5 章，白皮书*的*数字签名*一节中学习过签名验证。你已经了解到，对于签名验证，我们需要给定签名的两个输入：公钥和消息。在这种情况下，消息由版本、输入计数、输入、锁定时间、哈希类型、输出计数和输出组成。\n\
  \n这里，`sighash type`（哈希类型）指示由新交易签名的消息结构。\n\n以下是可以使用的哈希类型：\n\n| **SIGHASH 类型** | **十六进制代码**\
  \ | **含义** |\n| --- | --- | --- |\n| `SIGHASH_ALL` | 0x01 | 对所有输入和输出签名 |\n| `SIGHASH_NONE`\
  \ | 0x02 | 对所有输入签名，不对输出签名 |\n| `SIGHASH_SINGLE` | 0x03 | 对所有输入和单个输出签名 |\n| `SIGHASH_ALL|SIGHASH_ANYONECANPAY`\
  \ | 0x81 | 对一个输入和所有输出签名 |\n| `SIGHASH_NONE|SIGHASH_ANYONECANPAY` | 0x82 | 对一个输入签名，不对输出签名\
  \ |\n| `SIGHASH_SINGLE|SIGHASH_ANYONECANPAY` | 0x83 | 对一个输入和一个输出签名 |\n\n**表 10.2：**\
  \ 哈希类型\n\n以下是上述每种哈希类型的描述：\n\n*   `SIGHASH_ALL`：对所有输出签名是为了确保没有人篡改输出并窃取比特币。因此，每笔交易至少需要有一个输入使用\
  \ `SIGHASH_ALL` 签名。\n*   `SIGHASH_NONE`：这主要与 `SIGHASH_ANYONECANPAY` 一起使用，但如果所有输入都是已知的，不使用\
  \ `SIGHASH_ANYONECANPAY` 而单独使用此哈希类型也是有效的。\n*   `SIGHASH_SINGLE`：这主要与 `SIGHASH_ANYONECANPAY`\
  \ 一起使用。类似于 `SIGHASH_NONE`，此哈希类型也可以在不使用 `SIGHASH_ANYONECANPAY` 的情况下使用。\n*   `SIGHASH_ALL|SIGHASH_ANYONECANPAY`：如果每个人都为特定目的出资（例如共同从礼品店购买礼物），这很有用。在这种情况下，每个人都知道资金去向及数量，也知道自己需要贡献多少。\n\
  *   `SIGHASH_NONE|SIGHASH_ANYONECANPAY`：当协调人为特定目的收集资金时，这很有用。收集者知道资金需要去向何处，因此他们在创建签名时会用私钥对所有输入和输出签名，而其他人不知道资金将如何使用，所以他们将使用\
  \ `SIGHASH_NONE|SIGHASH_ANYONECANPAY` 签名。\n*   `SIGHASH_SINGLE|SIGHASH_ANYONECANPAY`：这适用于合并独立交易的场景，其中每笔交易有一个输入和一个输出。需要有一个输入对所有输出签名。这里最大的问题是输出金额通常是固定的，因此超出的价值需要作为找零支付。只有当输入和输出匹配，或者输入小于输出时，这才有用。如果输入小于输出，我们可以称该交易为部分交易。在这种情况下，每个人制作一笔部分交易，收集者添加剩余比特币以完成交易。例如，如果付款由另一个实体补贴，最终由该实体对所有输出签名来完成交易，则可以使用这种方式。\n\
  \n#### 哈希类型 – SIGHASH_ALL\n\n下图展示了如何为 `SIGHASH_ALL` 在 `scriptSig` 中创建签名：\n\n![](img/Figure-10.4.jpg)\n\
  \n**图 10.4：** SIGHASH_ALL 的交易创建\n\n\n\n上图展示了如何使用消息和私钥创建签名。对于 `SIGHASH_ALL`，我们通过获取新交易的所有元素来创建消息。然后我们将\
  \ `scriptSig` 和 `scriptSig` 长度替换为正在执行的脚本，对于 P2PKH 而言，即待签名输入索引的前一个 `scriptPubKey`\
  \ 和 `scriptPubKey` 长度。对于其他输入，`scriptSig` 长度被替换为零，因为这些输入未被签名。对于 P2SH 脚本，`scriptSig`\
  \ 及其长度被替换为赎回脚本及其长度。在消息末尾，我们添加 sighash 类型。\n\n#### 哈希类型 – SIGHASH_NONE、SIGHASH_SINGLE、SIGHASH_ANYONECANPAY\n\
  \n下图展示了其他 sighash 类型待签名消息的结构：\n\n![](img/Figure-10.5.jpg)\n\n**图 10.5：** 除 SIGHASH_ALL\
  \ 之外的 sighash 类型的签名预映像\n\n对于 `SIGHASH_ANYONECANPAY`，只有被签名的输入是待签名消息的一部分，其他输入不包含在内。对于\
  \ `SIGHASH_NONE`，不包含任何输出；对于 `SIGHASH_SINGLE`，仅包含一个输出。我们可以观察到，在 `SIGHASH_SINGLE`\
  \ 的情况下，输出索引与正在被签名的输入相对应。这意味着，如果签名输入 0，则包含输出 0 并排除输出 1。如果签名输入 1，则包含输出 1 并排除输出 0。如果被排除的输出不是消息的最后一个输出，则我们需要通过保留\
  \ `0xFFFFFFFFFFFFFFFF` 和 `0x00`（如图所示）来将被排除的输出作为占位符保留。在 `SIGHASH_NONE` 和 `SIGHASH_SINGLE`\
  \ 中，未被签名的输入的序列号被替换为 `0x00000000`。\n\n#### 标准比特币脚本 - P2PK\n\n不推荐使用 P2PK。P2PK 代表 **Pay-2-Public-Key（付款至公钥）**。\n\
  \n在此脚本中，`scriptSig` 为：\n\n` <签名>`\n\n而 `scriptPubKey` 为：\n\n` <公钥> OP_CHECKSIG`\n\
  \n其执行过程简单：首先执行 `scriptSig`，将签名压入栈中；然后执行 `scriptPubKey`，将公钥压入栈中，接着 `OP_CHECKSIG`\
  \ 通过弹出签名和公钥进行验证，并将结果压回栈中。\n\n该脚本有几个缺点：\n\n*   压缩公钥长 32 字节，而 P2PKH 脚本使用的哈希长 20 字节，其十六进制表示为\
  \ 40 个字符，输入起来容易得多。使用 base58check 编码从 20 字节生成的地址长 34 个字符。\n\n*   如果量子计算机能利用一种称为 Shor\
  \ 算法的量子技术，预计它们将能从公钥推导出私钥。为了让比特币在未来保持安全，我们不应在仍持有比特币的网络上暴露公钥。通过使用公钥哈希，我们拥有了多层安全机制来保护资金。\n\
  \n由于不推荐使用此脚本，因此深入了解它已无意义。\n\n#### 标准比特币脚本 – P2PKH\n\nP2PKH 是最广泛使用的比特币脚本。P2PKH 代表\
  \ **Pay-2-Public-Key-Hash（付款至公钥哈希）**。在该脚本中，发送方使用公钥哈希锁定交易输出，要求接收方在需要使用交易输出中锁定的资金时提供公钥。该哈希长\
  \ 20 字节，比 32 字节的压缩公钥更短。它生成一个 34 字符长的地址，其中包含校验和。这使得输入更容易，且由于包含校验和，不可能意外输入错误的地址。\n\
  \nP2PKH 中的 `scriptSig` 为：\n\n` <签名> <公钥哈希>`\n\n而 `scriptPubKey` 为：\n\n` OP_DUP OP_HASH160\
  \ <20 字节公钥哈希> OP_EQUALVERIFY OP_CHECKSIG`\n\n由于 `<签名>` 和 `<公钥哈希>` 均为数据，两者均入栈。`scriptSig`\
  \ 执行完毕后，执行 `scriptPubKey`。\n\n下图展示了 P2PKH 的执行过程：\n\n![](img/Figure-10.6.jpg)\n\n\
  **图 10.6：** P2PKH 的执行\n\n#### 准备签名预映像\n\n所有消息末尾均包含 sighash 类型。消息签名完成后，sighash 类型会被追加到签名中，以帮助验证节点在验证前重建消息。\n\
  \n现在，我们准备验证一个真实的交易脚本。我们选取以下交易 ID：\n\n`83eeaecaf531e5239ffc3ba7ff583c696f7dbe3610f0d672d41e0b9443632c82`\n\
  \n由于该交易在比特币区块链上，我们通过在 Bitcoin Core CLI 中调用 `getrawtransaction` 来获取原始交易，如下所示：\n\n\
  ![](img/Figure-10.7.jpg)\n\n**图 10.7：** 显示用于获取交易字节的 Bitcoin Core CLI 命令\n\n这将给我们以下原始交易：\n\
  \n![](img/Figure-10.8.jpg)\n\n**图 10.8：** 显示交易 ID 的十六进制数据\n\n我们可以使用交易并通过 *第 6 章，区块链、交易与挖矿*\
  \ 中 *Transactions* 主题下 *Other transaction* 子主题的 *Program 6.15* 中编写的 `getTransactionInfo`\
  \ 方法对其进行解析，以获取 `scriptSig`。\n\n这将给我们以下信息：\n\n`Transaction = {‘version’: ‘00000001’,\
  \ ‘inp_cnt’: 2, ‘inputs’: [{‘prev_tx_hash’: ‘15b91bcf8b2b9ea46d0daab60aaa2e99b15a5fb37d9d4568d4c060e515e13130’,\
  \ ‘prev_tx_out_index’: ‘00000001’, ‘bytes_scriptsig’: 106, ‘scriptsig’: ‘47304402205535a9ac25844514828bff3580120d5add488e09b7a6e62018fc265aabf95fe302200b66d4eb23fc348b31d58729b479ae73db9dfc467edf38f8dfd927c48cb46b5801210219fbee4b9cc12188598f244ff0ee352b124cbf9046180a1b25e020c0258f9d64’,\
  \ ‘sequence’: ‘ffffffff’}, {‘prev_tx_hash’: ‘840ac7a55498c6746b9d7460a348f79e2f35db4a9696bef762d975e7e1deeff2’,\
  \ ‘prev_tx_out_index’: ‘0000000c’, ‘bytes_scriptsig’: 106, ‘scriptsig’: ‘47304402203a28d10c786907fcb71c7bf69c507d58884ea9af2e7fa3b413d4e2867eca601502205fb253d82e4daa2672842ec031584ea7a215774422aa7de3cf8928c240e2faa60121030be5aa6d5de8c6dd89d6ac4d0e2a112caf5b12801349ab30fbdf2b205f0b94b8’,\
  \ ‘sequence’: ‘ffffffff’}], ‘out_cnt’: 2, ‘outs’: [{‘satoshis’: 69302, ‘bytes_scriptpubkey’:\
  \ 25, ‘scriptpubkey’: ‘76a914f133f0339987cd84b6017517de2a93f009728d7e88ac’}, {‘satoshis’:\
  \ 12900349, ‘bytes_scriptpubkey’: 25, ‘scriptpubkey’: ‘76a91406c3bc40cde01312e2b24f8d2c23e68ea7d572f888ac’}],\
  \ ‘locktime’: 0}`\n\n以下程序进一步解析 `scriptSig` 以获取签名、 `sighash` 类型和公钥：\n\n```\nOP_PUSHDATA1\
  \ = 0x4c\n\nOP_PUSHDATA2 = 0x4d\n\nOP_PUSHDATA4 = 0x4e\n\nSIGHASH_ALL = 0x01\n\n\
  SIGHASH_NONE = 0x02\n\nSIGHASH_SINGLE = 0x03\n\nSIGHASH_ANYONECANPAY = 0x80\n\n\
  def getHashTypeInWords(hashtype: int):\n    hashtype_s = \"\"\n    if hashtype &\
  \ SIGHASH_SINGLE == 0x03:\n        hashtype_s = \"SIGHASH_SINGLE\"\n    elif hashtype\
  \ & SIGHASH_NONE == 0x02:\n        hashtype_s = \"SIGHASH_NONE\"\n    elif hashtype\
  \ & SIGHASH_ALL == 0x01:\n        hashtype_s = \"SIGHASH_ALL\"\n    if hashtype\
  \ & SIGHASH_ANYONECANPAY == 0x80:\n        hashtype_s = hashtype_s + \"|\" + \"\
  SIGHASH_ANYONECANPAY\"\n    return hashtype_s\n\ndef decodePushdata(script_m: mmap):\n\
  \    length = int.from_bytes(script_m.read(1), byteorder='little')\n    if length\
  \ == OP_PUSHDATA1:\n        length = int.from_bytes(script_m.read(1), byteorder='little')\n\
  \    elif length == OP_PUSHDATA2:\n        length = int.from_bytes(script_m.read(2),\
  \ byteorder='little')\n    elif length == OP_PUSHDATA4:\n        length = int.from_bytes(script_m.read(4),\
  \ byteorder='little')\n    return length\n\ndef parseScriptSig(script_m: mmap):\n\
  \    scriptsig = {}\n    scriptsig['bytes_sig'] = decodePushdata(script_m)\n   \
  \ scriptsig['sig'] = script_m.read(scriptsig['bytes_sig'] - 1).hex()\n    scriptsig['hash_type']\
  \ = int.from_bytes(script_m.read(1), byteorder='little')\n    scriptsig['hash_type_name']\
  \ = getHashTypeInWords(scriptsig['hash_type'])\n    scriptsig['bytes_pubkey'] =\
  \ decodePushdata(script_m)\n    scriptsig['pubkey'] = script_m.read(scriptsig['bytes_pubkey']).hex()\n\
  \    return scriptsig\n```\n\n**程序 10.2：** Scriptsig 解析器\n\n我们按如下方式调用上述方法：\n\n\n\
  \n\n`script_b = bytes.fromhex(‘47304402203a28d10c786907fcb71c7bf69c507d58884ea9af2e7fa3b413d4e2867eca601502205fb253d82e4daa2672842ec031584ea7a215774422aa7de3cf8928c240e2faa60121030be5aa6d5de8c6dd89d6ac4d0e2a112caf5b12801349ab30fbdf2b205f0b94b8’)`\n\
  \n`script_m = mmap.mmap(-1, len(script_b) + 1)`\n\n`script_m.write(script_b)`\n\n\
  `script_m.seek(0)`\n\n`scriptsig = parseScriptSig(script_m)`\n\n`print(json.dumps(scriptsig,\
  \ indent=4))`\n\n这将给出以下结果：\n\n![](img/Figure-10.9.jpg)\n\n**图 10.9：** 显示运行 `parseScriptSig`\
  \ 程序输出的 JSON\n\n我们将使用前面的信息来验证交易。我们首先实现脚本操作。然后，我们将列表用作堆栈，并使用 pop 和 append 操作：\n\n\
  ```\nst = []\n\ndef opHash160():\n    v = st.pop()\n    h = hash160(v)\n    st.append(h)\n\
  \ndef opDup():\n    v = st.pop()\n    st.append(v)\n    st.append(v)\n\ndef opEqualVerify():\n\
  \    v1 = st.pop()\n    v2 = st.pop()\n    if v1 == v2:\n        return True\n \
  \   else:\n        return False\n\ng_pushdata = range(0x01, 0x4f)\n\ndef pushdata(d:\
  \ bytes):\n    st.append(d)\n\ndef opCheckSig(script_b: bytes, inp_index: int, tx:\
  \ dict):\n    pubkey_b = st.pop()\n    sig_b = st.pop()\n    v = sigcheck(sig_b,\
  \ pubkey_b, script_b, inp_index, tx)\n    st.append(v)\n```\n\n**程序 10.3：** P2PKH\
  \ 的比特币脚本操作\n\n`OP_CheckSig` 操作使用堆栈上的签名和公钥来验证交易消息。为了创建签名预像，我们获取交易字节，并通过执行脚本将需要验证的输入签名进行替换。这在\
  \ *图 10.4* 和 *10.5* 中展示。这就是我们将脚本字节和输入索引作为其参数传递的原因。\n\n我们使用以下方法调用脚本操作符，该方法读取脚本字节直到整个脚本执行完毕：\n\
  \n```\ndef execScript(script_b: bytes, inp_index: int, tx: dict):\n    l = len(script_b)\n\
  \    script_m = bytes2Mmap(script_b)\n    while script_m.tell() < l:\n        v\
  \ = script_m.read(1)\n        b = int.from_bytes(v, byteorder='little')\n      \
  \  if b in g_pushdata:\n            script_m.seek(-1, 1)\n            b = decodePushdata(script_m)\n\
  \            d = script_m.read(b)\n            pushdata(d)\n        elif v == b'\\\
  x76':\n            opDup()\n        elif v == b'\\xa9':\n            opHash160()\n\
  \        elif v == b'\\x88':\n            opEqualVerify()\n        elif v == b'\\\
  xac':\n            opCheckSig(script_b, inp_index, tx)\n```\n\n**程序 10.4：** P2PKH\
  \ 脚本执行\n\n`opCheckSig` 方法调用 `sigcheck` 方法，后者使用 `ecdsa` 包执行签名验证。为了理解签名验证，我们需要了解比特币交易使用的签名格式。\n\
  \n我们使用创建的消息和私钥来验证签名。交易中获得的签名采用 *DER 编码*。**DER** 代表 **Distinguished Encoding Rules**（可区分编码规则）。以下是\
  \ DER 编码的结构：\n\n![](img/Figure-10.10.jpg)\n\n**图 10.10：** DER 编码\n\n以下是 DER 编码各组成部分的描述：\n\
  \n*   `0x30` 字节：表示复合结构\n*   数据大小：此字节后跟随数据的大小\n*   `0x02`：表示整数\n*   R 值大小：R 的大小可能包含\
  \ `0x00` 前缀\n*   R：这可能包含 `0x00` 前缀\n*   S 值大小：S 的大小可能包含 `0x00` 前缀\n*   S：这可能包含 `0x00`\
  \ 前缀\n\n我们使用的 `ecdsa` 包要求签名是 *R* 和 *S* 的拼接。\n\n以下代码返回拼接的 *R* 和 *S*：\n\n```\ndef\
  \ getRandSFromSig(sig_b: bytes):\n    sig_m = bytes2Mmap(sig_b)\n    struct = sig_m.read(1)\n\
  \    size = sig_m.read(1)\n    rheader = sig_m.read(1)\n    rsize_b = sig_m.read(1)\n\
  \    rsize = int.from_bytes(rsize_b, byteorder='little')\n    if rsize == 33:\n\
  \        sig_m.read(1)\n        r = sig_m.read(32)\n    sheader = sig_m.read(1)\n\
  \    ssize_b = sig_m.read(1)\n    ssize = int.from_bytes(ssize_b, byteorder='little')\n\
  \    if ssize == 33:\n        sig_m.read(1)\n        s = sig_m.read(32)\n    return\
  \ r + s\n```\n\n**程序 10.5：** 获取拼接的 R 和 S 字节\n\n我们需要构建签名预像，以便使用输入索引和当前正在执行的脚本来验证签名。以下代码实现了这一点：\n\
  \n```\ndef bytes2Mmap(b: bytes):\n    m = mmap.mmap(-1, len(b) + 1)\n    m.write(b)\n\
  \    m.seek(0)\n    return m\n\n#### 此方法返回变长整数的值以及变长整数字节\ndef setVarInt(n: int):\n\
  \    if n < 0xfd:\n        n_h = '%02x' % n\n    elif n > 0xfd and n < 0xffff:\n\
  \        n_h = 'fd%04x' % n\n    elif n > 0xffff and n < 0xFFFFFFFF:\n        n_h\
  \ = 'fe%08x' % n\n    else:\n        n_h = 'ff%016x' % n\n    return bytes.fromhex(n_h)\n\
  \ndef createMsgInputsForSig(tx: dict, script_b: bytes,\n                       \
  \   inp_index: int,\n                          sighash_type: int,\n            \
  \              inp_cnt: int):\n    msg_b = b''\n    for i in range(inp_cnt):\n \
  \       tx_inp = tx['inputs'][i]\n        inp_b = bytes.fromhex(tx_inp['prev_tx_hash'])[::-1]\n\
  \        inp_b += struct.pack('<L', tx_inp['prev_tx_out_index'])\n        if i ==\
  \ inp_index:\n            inp_b += bytes.fromhex('%02x' % len(script_b))\n     \
  \       inp_b += script_b\n            inp_b += struct.pack('<L', tx_inp['sequence'])\
  \ # sequence\n        else:\n            inp_b += bytes(1)\n            inp_b +=\
  \ struct.pack('<L', tx_inp['sequence']) # sequence\n        msg_b += inp_b\n   \
  \ return msg_b\n\ndef createMsgOutsForSig(tx: dict, inp_index: int, sighash_type:\
  \ int):\n    msg_b = b''\n    msg_b += setVarInt(tx['out_cnt'])\n    for o in range(tx['out_cnt']):\n\
  \        tx_out = tx['outs'][o]\n        msg_b += struct.pack('<Q', tx_out['satoshis'])\n\
  \        msg_b += setVarInt(tx_out['bytes_scriptpubkey'])\n        msg_b += bytes.fromhex(tx_out['scriptpubkey'])\n\
  \    return msg_b\n\ndef createMsgForSig(tx: dict, script_b: bytes, inp_index: int,\
  \ sighash_type: int):\n    msg_b = bytes.fromhex(tx['version'])[::-1]\n    inp_cnt\
  \ = tx['inp_cnt']\n    msg_b += setVarInt(inp_cnt)\n    msg_b += createMsgInputsForSig(tx,\
  \ script_b, inp_index, sighash_type, inp_cnt)\n    msg_b += createMsgOutsForSig(tx,\
  \ inp_index, sighash_type)\n    msg_b += struct.pack('<L', tx['locktime'])\n   \
  \ msg_b += struct.pack('<L', sighash_type)\n    return msg_b\n```\n\n**程序 10.6：**\
  \ 创建签名预像\n\n我们使用调用前面方法生成的消息，并使用公钥来验证签名。我们编写了以下方法，用于验证给定输入索引处的交易签名：\n\n```\nfrom\
  \ cryptotools.ECDSA.secp256k1 import PublicKey\n\ndef uncompressPubkey(pubkey_b:\
  \ bytes):\n    pubkey_P = PublicKey.decode(pubkey_b)\n    pubkey_b = PublicKey.encode(pubkey_P,\
  \ compressed=False)\n    return pubkey_b\n\ndef sigcheck(sig_b: bytes, pubkey_b:\
  \ bytes, script_b: bytes, inp_index: int, tx: dict):\n    sighash_type = sig_b[-1]\n\
  \    msg_b = createMsgForSig(tx, script_b, inp_index, sighash_type)\n    msg_h =\
  \ hashlib.sha256(msg_b).digest()\n    prefix = pubkey_b[0:1]\n    if prefix == b\"\
  \\x02\" or prefix == b\"\\x03\":\n        fullpubkey_b = uncompressPubkey(pubkey_b)[1:]\n\
  \    elif prefix == b\"\\x04\":\n        fullpubkey_b = pubkey_b[1:]\n    rs_b =\
  \ getRandSFromSig(sig_b)\n    vk = ecdsa.VerifyingKey.from_string(fullpubkey_b,\
  \ curve=ecdsa.SECP256k1)\n    try:\n        if vk.verify(rs_b, msg_h, hashlib.sha256)\
  \ == True:\n            print(\"Signature is Valid\")\n            return b'\\x01'\n\
  \        else:\n            print(\"Signature is not Valid\")\n            return\
  \ b'\\x00'\n    except ecdsa.keys.BadSignatureError:\n        print(\"Signature\
  \ is not Valid\")\n        return b'\\x00'\n```\n\n**程序 10.7：** 签名验证方法\n\n我们可以使用前面的程序来验证与\
  \ P2PKH 地址相关的交易签名。以下是验证 P2PKH 脚本所需的方法：\n\n```\ndef getScriptSig(tx: dict, inp_index:\
  \ int):\n    return bytes.fromhex(tx['inputs'][inp_index]['scriptsig'])\n\ndef getPrevScriptPubKey(tx:\
  \ dict, inp_index: int):\n    prevtx_rb = bytes.fromhex(tx['inputs'][inp_index]['prev_tx_hash'])[::-1]\n\
  \    prevtx_outindex = tx['inputs'][inp_index]['prev_tx_out_index']\n    prevtx\
  \ = findTransaction(prevtx_rb, txindex_db_g)\n    prevScriptPubkey = prevtx['outs'][prevtx_outindex]['scriptpubkey']\n\
  \    prevScriptPubkey_b = bytes.fromhex(prevScriptPubkey)\n    return prevScriptPubkey_b\n\
  \ndef verifyScript(tx: dict, inp_index: int):\n    scriptsig_b = getScriptSig(tx,\
  \ inp_index)\n    execScript(scriptsig_b, inp_index, tx)\n```\n\n\n\n\n\n#### 标准比特币脚本——P2MS\n\
  \nP2MS 代表 **Pay-2-Multisig**。该脚本允许使用多重签名来访问锁定的比特币。\n\n脚本如下所示：\n\n**ScriptPubKey:**\
  \ `OP_n <Public Key 1><Public Key 2>…<Public Key m>OP_m<Multisig>`\n\n**ScriptSig:**\
  \ `OP_0 <Signature 1><Signature 2>… <Signature n>`\n\n在 2-of-3 多重签名中，需要三个签名中的两个才能索取由\
  \ `scriptPubKey` 锁定的资金。\n\n这意味着在创建交易时，我们需要在脚本中包含多个公钥。这有以下缺点：\n\n1. 交易将比普通 P2PKH\
  \ 脚本消耗更多字节，因此发送方必须支付更高的交易费。\n2. 发送方需要通过获取多个公钥来构建复杂脚本，即使只是发送给单个接收者。这给发送方带来了额外负担。\n\
  3. 如果量子计算机能够利用 Shor 算法破解私钥-公钥加密体制，公钥可能不再安全。\n\n2012 年，P2SH 作为软分叉被引入，解决了上述缺点，因此我们不再深入探讨该脚本。\n\
  \n#### 标准比特币脚本——P2SH\n\nP2SH 代表 **Pay-2-Script-Hash**。顾名思义，哈希中嵌入了一个脚本，必须满足该脚本才能进行支付。这主要用于允许使用多重签名来访问比特币。它于\
  \ 2012 年作为软分叉引入。\n\nP2SH 脚本用脚本哈希替换了多重签名脚本，因此发送方无需为矿工打包交易支付额外费用。\n\n对于 P2SH，`scriptSig`\
  \ 为：\n\n```\n<Signatures> <Redeem Scripts>\n```\n\n而 `scriptPubKey` 为：\n\n```\n\
  OP_HASH160 <20-byte Redeem Script hash> OP_EQUAL\n```\n\n2-of-3 多重签名的赎回脚本如下：\n\n\
  ```\n<2><Public Key 1><Public Key 2><Public Key 3><3><Multisig>\n```\n\n在 P2SH 中，需要执行两个脚本，即\
  \ `scriptPubKey` 和赎回脚本，以及给定的签名列表。这是一种特殊脚本，执行方式略有不同。在这种情况下，会维护堆栈的副本，一旦 `scriptPubKey`\
  \ 执行完毕，赎回脚本开始执行。\n\n由于 P2SH 脚本中的 `scriptPubKey` 包含脚本的 20 字节哈希，我们可以将复杂脚本隐藏在哈希中。发送方不需要知道索取资金的规则；他们只会看到一个普通的地址来转账。这极大地简化了流程，同时为索取锁定的比特币施加了复杂的规则。这些复杂规则作为各方之间的合约运作。这些合约催生了智能合约，我们将在下一章详细了解。\n\
  \n下图解释了 P2SH 的执行过程：\n\n![](img/Figure-10.11.jpg)\n\n**Figure 10.11:** P2SH execution\n\
  \n要编写验证 P2SH 交易输出签名的程序，我们需要能够识别 P2SH，因为它涉及三个连续的脚本执行。以下是三个执行脚本：\n\n*   `OP_0 <signature\
  \ 1> <signature 2> … <signature m> <Redeem Script>`\n*   `OP_HASH160 <Redeem Script\
  \ Hash> OP_EQUAL`\n*   赎回脚本：`OP_m <Public Key 1> <Public Key 2> … <Public Key n>\
  \ OP_n OP_MULTISIG`\n\n对于 P2SH，签名预像保持不变，因此我们扩展了上一节 P2PKH 所涵盖的程序，以包含赎回脚本处理，并增加对 `OP_CHECKMULTISIG`\
  \ 的处理。\n\n```\ng_pushnumber = range(0x51, 0x61) # excludes 0x61\n\ndef opEqual():\n\
  \    v1 = st.pop()\n    v2 = st.pop()\n    if v1 == v2:\n        st.append(b'\\\
  x01')\n    else:\n        st.append(b'\\x00')\n\ndef opNum(b: int):\n    num = b\
  \ - 0x50\n    st.append(bytes([num]))\n\ndef opCheckMultisig(script_b: bytes, inp_index:\
  \ int, tx: dict):\n    pubkey_cnt = int.from_bytes(st.pop(), byteorder='little')\n\
  \    pubkey_l = [st.pop() for i in range(pubkey_cnt)][::-1]\n    sig_cnt = int.from_bytes(st.pop(),\
  \ byteorder='little')\n    sig_l = [st.pop() for i in range(sig_cnt)][::-1]\n  \
  \  sig_index = 0\n    for pubkey_b in pubkey_l:\n        v = sigcheck(sig_l[sig_index],\
  \ pubkey_b, script_b, inp_index, tx)\n        if v == b'\\x01':\n            sig_index\
  \ += 1\n        if sig_index == sig_cnt:\n            break\n    # convert True/False\
  \ to b'\\x01' or b'\\x00'\n    b = bytes([int(sig_index == sig_cnt and v == b'\\\
  x01')])\n    st.append(b)\n```\n\n**Program 10.9:** Bitcoin script operations for\
  \ P2SH\n\n以下程序用于识别是否正在执行 P2SH 脚本。此方法在 `scriptSig` 执行后调用：\n\n```\ndef checkWrappedMultisig(st):\n\
  \    script_b = st[-1]\n    val = script_b[-2]\n    if bytes([script_b[-1]]) ==\
  \ b'\\xae' and val in g_pushnumber:\n        return True\n    else:\n        return\
  \ False\n```\n\n**Program 10.10:** Identify P2SH script\n\n以下是处理额外操作码的更新后的 `execScript`\
  \ 方法：\n\n```\ndef execScript(script_b: bytes, inp_index: int, tx: dict):\n    l\
  \ = len(script_b)\n    script_m = bytes2Mmap(script_b)\n    while script_m.tell()\
  \ < l:\n        v = script_m.read(1)\n        b = int.from_bytes(v, byteorder='little')\n\
  \        if b == 0x00:\n            pass\n        elif b < 0x4f:\n            script_m.seek(-1,\
  \ 1)\n            b = decodePushdata(script_m)\n            d = script_m.read(b)\n\
  \            pushdata(d)\n        elif v == b'\\x76':\n            opDup()\n   \
  \     elif v == b'\\xa9':\n            opHash160()\n        elif b in g_pushnumber:\n\
  \            opNum(b)\n        elif v == b'\\x87':\n            opEqual()\n    \
  \    elif v == b'\\x88':\n            opEqualVerify()\n        elif v == b'\\xac':\n\
  \            opCheckSig(script_b, inp_index, tx)\n        elif v == b'\\xae':\n\
  \            opCheckMultisig(script_b, inp_index, tx)\n```\n\n**Program 10.11:**\
  \ P2SH script execution\n\n以下方法执行 P2SH 脚本验证：\n\n```\ndef verifyScript(tx: dict,\
  \ inp_index: int):\n    isP2SH = False\n    scriptsig_b = getScriptSig(tx, inp_index)\n\
  \    execScript(scriptsig_b, inp_index, tx)\n    prev_scriptpubkey_b = getPrevScriptPubKey(tx,\
  \ inp_index)\n    if checkWrappedMultisig(st) == True:\n        redeemscript_b =\
  \ st[-1]\n        isP2SH = True\n    execScript(prev_scriptpubkey_b, inp_index,\
  \ tx)\n    status = st.pop()\n    if status == b'\\x01':\n        print('1st Script\
  \ succeeded')\n    elif status == b'\\x01':\n        print('1st Script Failed')\n\
  \    else:\n        print('1st Invalid state')\n    if isP2SH == True:\n       \
  \ execScript(redeemscript_b, inp_index, tx)\n        status = st.pop()\n       \
  \ if status == b'\\x01':\n            print('2nd Script succeeded')\n        elif\
  \ status == b'\\x01':\n            print('2nd Script Failed')\n        else:\n \
  \           print('2nd Invalid state')\n```\n\n**Program 10.12:** P2SH verification\
  \ method\n\n我们按如下方式调用上述方法来验证交易 scriptSig：\n\n```\nif __name__ == '__main__':\n \
  \   txid_s = '8b3e54e345d0b3e9278a27f1ab2aa2566aba8cbe7cf44b9aa1836c9d0fcc2625'\n\
  \    inp_index = 0\n    txid_b = bytes.fromhex(txid_s)[::-1]\n    tx = findTransaction(txid_b,\
  \ txindex_db_g)\n    verifyScript(tx, inp_index)\n```\n\n既然你已经了解了交易如何验证，我们现在将创建交易，并将\
  \ `regtest` 比特币从一个地址转移到另一个地址。\n\n### 构建交易\n\n\n\n\n我们正尝试在本小节中创建一笔交易。要构建交易，我们需要从之前的交易为其提供资金。由于我们不想使用真实的比特币，且希望能轻松挖掘区块，因此我们使用\
  \ `regtest` 环境。我们使用的交易输出必须是未花费的。如果交易已确认，我们可以在 `chainstate database`（链状态数据库）中找到该交易。如果资金交易未确认，它将位于内存池中。我们使用来自链状态数据库的资金交易，而不查看内存池。我们已经定义了从链状态数据库检索\
  \ UTXO 的方法。以下方法用于获取未花费输出信息：\n\n`getUnspentTransactions`\n\n我们可以查看第 6 章“区块链、交易与挖矿”下\
  \ **UTXO** 小节中的 **Program 6.20** 来了解该方法的实现。我们使用此方法获取 P2PKH 交易的 `scriptPubKey`。\n\
  \n以下程序返回创建 P2SH 交易以及为 P2SH 和 P2PKH 签名预镜像所需的执行脚本。在以下程序中，第一个参数是交易结构，它是一个包含构建所需交易所需信息的\
  \ `dict`。以下方法稍后将用于从交易结构中给定脚本的十六进制字符串获取字节：\n\n```python\ndef getExecutionScript(txn_struct:\
  \ dict, inp_index: int):\n    inp = txn_struct['inputs'][inp_index]\n    script_type\
  \ = inp['script_type']\n    if script_type[:4] == 'P2SH':\n        script_b = bytes.fromhex(inp['redeem_script'])\n\
  \    elif script_type == 'P2PKH':\n        script_b = bytes.fromhex(inp['script_pubkey'])\n\
  \    return script_b\n```\n\n**Program 10.13:** 获取用于在预镜像中替换签名的执行脚本\n\n我们在上述方法中获得的脚本字节是\
  \ `createSignaturePreimage` 方法的输入。\n\n在以下方法中，我们将从给定地址生成字节格式的脚本。我们已经在前面的章节中查看了 P2PKH\
  \ 和 P2SH 的结构，当时我们讨论了 P2PKH 和 P2SH 脚本：\n\n```python\ndef getScriptPubkeyP2PKH(address:\
  \ str):\n    pkh_b = address2PubkeyHash(address)\n    pkhSize_b = encodePushdata(len(pkh_b))\n\
  \    scriptPubkey_b = bytes([OP_DUP, OP_HASH160]) \\\n        + pkhSize_b + pkh_b\
  \ \\\n        + bytes([OP_EQUALVERIFY]) \\\n        + bytes([OP_CHECKSIG])\n   \
  \ return scriptPubkey_b\n\ndef getScriptPubkeyP2SH(address: str):\n    sh_b = address2PubkeyHash(address)\n\
  \    shSize_b = encodePushdata(len(sh_b))\n    scriptPubkey_b = bytes([OP_HASH160])\
  \ \\\n        + shSize_b \\\n        + sh_b \\\n        + bytes([OP_EQUAL])\n  \
  \  return scriptPubkey_b\n\ndef getScriptPubkeyFromAddress(address: str):\n    pkh_b\
  \ = address2PubkeyHash(address)\n    pkhSize_b = encodePushdata(len(pkh_b))\n  \
  \  script_type = getScriptTypeFromAddress(address)\n    if script_type == 'P2PKH':\n\
  \        scriptPubkey_b = getScriptPubkeyP2PKH(address)\n    elif script_type ==\
  \ 'P2SH':\n        scriptPubkey_b = getScriptPubkeyP2SH(address)\n    return scriptPubkey_b\n\
  ```\n\n**Program 10.14:** 从地址准备 Script Pubkey\n\n以下方法根据 `locktime` 字段生成交易输入的序列字节：\n\
  \n```python\ndef getSequence(txn_struct: dict):\n    if txn_struct['locktime'] >\
  \ 0:\n        sequence_b = bytes([0xfe, 0xff, 0xff, 0xff])\n    else:\n        sequence_b\
