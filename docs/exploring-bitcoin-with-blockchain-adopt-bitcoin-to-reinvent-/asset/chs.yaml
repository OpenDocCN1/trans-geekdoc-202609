  \n        *   自私挖矿\n\n        *   BGP 劫持攻击\n\n            ![](img/ent.jpg) 网络分区攻击\n\
  \n            ![](img/ent.jpg) 延迟攻击\n\n        *   0 确认攻击\n\n        *   隐藏算力\n\n\
  \        *   黑名单地址\n\n        *   重放攻击\n\n        *   空块挖矿\n\n        *   比特币挖矿中心化\n\
  \n            ![](img/ent.jpg) 51% 攻击\n\n        *   女巫攻击\n\n        *   拒绝服务攻击\n\
  \n        *   量子计算攻击\n\n        *   隐藏的 Bug、Bug 利用与重组\n\n    *   欺诈与抢劫\n\n### 目标\n\
  \n本章的主要目标是让读者能够从技术和非技术的角度质疑比特币的合法性、必要性和价值。\n\n此外，了解技术的攻击向量可以帮助您更好地做好准备并采取预防措施，以减轻其对您的影响。\n\
  \n因此，我们将尝试在本章中回答以下问题：\n\n*   为什么比特币没有非常大的区块大小？\n*   为什么比特币没有更短的出块时间？\n*   比特币真的需要消耗这么多能源吗？这对环境有何影响？\n\
  *   比特币网络有哪些不同的攻击方式？这些攻击向量有多严重？\n*   技术是否存在未来风险？\n*   除了技术漏洞，还有哪些其他漏洞？\n\n#####\
  \ 设计局限\n\n比特币区块每 10 分钟挖出一个，且每个区块对于 SegWit 前版本限制为 1MB 大小，对于 SegWit 版本限制为 1MB 的 v-size（虚拟大小）。这导致了较低的交易速率。以下是历史每秒交易数量图表：\n\
  \n![](img/Figure-8.1.jpg)\n\n**图 8.1：** 平均每秒交易数\n\n我们可以看到，比特币交易速率达到了每秒 18 笔交易。即使区块全是\
  \ SegWit 交易，也只能达到平均每秒 25 笔交易。相比之下，Visa 平均每秒处理 2,000 笔交易。这意味着比特币不适合在全球范围内进行小额支付。要与\
  \ Visa 竞争，比特币需要当前区块大小的 100 倍，或者需要在 10 秒内生成一个区块。\n\n比特币在提供隐私方面也不是很好。由于所有交易都在区块链上，且大多数比特币买卖通过在监管下运作的交易所进行，几乎所有交易都可以通过大数据分析关联起来。\n\
  \n### 区块大小局限\n\n增加区块大小或减少出块时间对网络和区块链大小有相似的影响。将区块大小增加 10 倍或将出块时间减少 10 倍，会因区块传播导致网络流量以相似幅度增加，并导致区块链大小以相似幅度上升。\n\
  \n### 对交易验证的影响\n\n挖矿节点竞争解决加密谜题以挖出区块。当一个区块被挖出时，它会被发布到网络上。区块需要快速到达所有节点。如果在区块传播期间，另一个节点解开了加密谜题并发布了其区块，节点之间就会对比特币区块链的下一个区块产生分歧。于是形成两条竞争链，它们竞争证明自己是正确的链。累积\
  \ `PoW`（工作量证明）较高的链被视为更长链并被接受，而另一条链则被丢弃。\n\n正如您所想象的，如果区块传播不够快，可能会形成多条竞争链，且随着传播延迟的增加，解决正确链所需的时间可能呈指数级增长。\n\
  \n以下是自 2015 年以来的区块传播延迟图表。由于部分数据缺失，图表中存在一些空白：\n\n![](img/Figure-8.2.jpg)\n\n**图 8.2：**\
  \ 区块到达 90% 节点所需时间的 30 天滚动平均值\n\n如您所见，区块传播延迟从 2015 年的 15 秒降低到了 2018 年的 2 秒。自 2016\
  \ 年以来，P2P 比特币网络协议消息引入了多项增强。这可能是传播延迟迅速降低的原因。\n\n在接受交易前等待 6 个确认是标准做法。这是因为如果因同时挖出区块而产生竞争条件，通常会在第六个确认前得到解决。\n\
  \n\n\n\n如果竞争条件是由区块同时挖掘引起的，但在接下来的六个区块内未得到解决，则会影响已确认交易的整体置信度。\n\n因此，区块大小是传播延迟和比特币网络置信度的重要因素。\n\
  \n### FIBRE：快速互联网比特币中继引擎\n\n**快速互联网比特币中继引擎**（`FIBRE`）是一种旨在将比特币区块以接近连接物理极限的延迟传递给连接节点的协议。它依赖于一个管理良好的网络来实现预期结果。\n\
  \n有了 `FIBRE`，出现两条竞争链的可能性要小得多。这使得自私挖矿变得困难，并使网络更加公平。\n\n### 对区块链大小的影响\n\n正如您通过改进 Gossip\
  \ 协议所了解到的，我们可以大大减少传播延迟，从而允许区块大小增加。然而，区块链大小是增加区块大小的另一个重要障碍。目前，比特币区块链已达 400GB，在过去一年中增加了近\
  \ 60GB。\n\n下图展示了区块链大小随年份增长的情况：\n\n![](img/Figure-8.3.jpg)\n\n**图 8.3：** 区块链大小随年份的变化\n\
  \n如果包含所有索引，该数字高达 390GB。如果交易数量进一步增加，我们每年可能会看到高达 100GB 的增量。这是一个显著的数字，使得运行全节点的成本目前略高。对大多数比特币爱好者而言，运行全节点意味着放弃\
  \ 400GB 的磁盘空间，且每年可能增加 100GB。两年内将达到 500GB 的备用存储，再过几年将达到 1TB。为了让大学生或爱好者能够维护全节点，磁盘存储成本必须下降，且笔记本电脑标配\
  \ 1TB 以上存储需成为常态。\n\n下图显示了区块链大小每 365 天的累积情况：\n\n![](img/Figure-8.4.jpg)\n\n**图 8.4：**\
  \ 区块链大小变化率（365 天滚动求和）\n\n作为替代方案，`Bitcoin Core` 提供了修剪区块链并将其限制在更小尺寸的选项。`Bitcoin Core`\
  \ 维护未花费交易和区块的索引，因此修剪节点仍可验证交易和区块，仍被视为全节点。但是，它无法重建已修剪的区块，也无法满足对等节点的区块请求。由于每个区块都包含对旧区块的引用，只要维护了最近的区块，且有足够多的节点维护完整区块链，这并不是问题。\n\
  \n修剪节点有几个优势。修剪节点仅需 288 个区块即可创建，大小不超过 1GB。因此，使用修剪节点，我们可以在嵌入式设备上运行全节点。\n\n然而，这仍无助于增加区块大小，因为区块链验证需要数天才能完成。因此，磁盘上的区块链大小不是增加区块大小的主要限制因素；相反，区块链验证时间本身才是阻止我们增加区块大小的主要因素。\n\
  \n目前，由于验证时间，下载完整区块链需要 1 到 7 天。\n\n为了减少区块链验证时间，我们要么需要等待性能更好的计算机来缩短验证时间，要么需要找到更高效的区块验证算法。\n\
  \n### 区块时间限制\n\n区块时间调整每 2016 个区块发生一次，基于网络算力。网络算力分布不均，会受到环境灾害和政府管控的影响。\n\n下图是基于 2016\
  \ 个区块滚动平均的平均出块时间：\n\n![](img/Figure-8.5.jpg)\n\n**图 8.5：** 平均出块时间（2016 个区块滚动平均）\n\
  \n过去发生的几起事件导致算力下降：\n\n- 2020 年 8 月，中国的暴雨导致算力下降 15%。\n- 2021 年 6 月，中国强制禁止加密货币挖矿，导致网络算力下降\
  \ 50% 以上。我们可以在上图中看到相应的出块时间上升了 15 分钟以上。\n\n算力下降会导致出块时间增加，从而在交易被打包进区块前有更多交易进入内存池。由于更多交易竞争上链，交易费上涨。然而，此问题会在下一次难度调整后消失，难度调整每\
  \ 2016 个区块（约 2 周）发生一次。算力下降会延长出块时间，因此 2016 个区块可能需要 2 周以上。\n\n下图说明了随着出块时间增加，等待打包进区块的交易数量如何增长：\n\
  \n![](img/Figure-8.6.jpg)\n\n**图 8.6：** 内存池大小对出块时间的依赖性\n\n这是一个持续 2 周以上的不便中断。解决此问题的一种方案是通过计算\
  \ 2016 个区块的滚动平均，在每个区块调整难度。\n\n然而，出于安全考虑，比特币未实施此方案。由于少数矿池控制了几乎所有的比特币网络算力，针对这些大型矿工的复杂\
  \ DDoS 攻击可能会降低网络算力，给攻击者提供破坏网络的窗口期。为了更大的安全利益，这种不便是必要的代价。\n\n### 隐私限制\n\n比特币不是隐私币。它不支持零知识证明等隐私协议。因此，我们需要认识到比特币会在区块链、我们购买比特币的交易所以及我们使用比特币的在线商家/网站中留下信息痕迹。然而，比特币确实提供了通过\
  \ `CoinJoin` 或混币服务、直接从个人购买等方式隐藏身份的方法。\n\n### 隐私与扩容解决方案\n\n在前面的小节中，您了解到我们不希望区块大小上升的主要原因是初始区块下载验证时间。目前有不少发展可能有助于比特币扩容并提升其隐私性。\n\
  \n犯罪分子可以入侵交易所和商家的数据，并将其与区块链信息关联，从而获取个人洞察。极权政府也可以从交易所和商家获取信息，最终利用这些信息针对信息泄露的个人。因此，比特币有时被认为是**伪匿名**的。\n\
  \n比特币确实提供了隐藏身份的方法。以下是几种使身份隐藏的方式：\n\n1.  隐藏信息的最简单方法是永远不重复使用地址。\n2.  像 `Samourai Wallet`\
  \ 和 `Wasabi Wallet` 这样的钱包提供 `CoinJoin` 的变体，使交易具有可替代性。\n3.  个人也可以直接从另一个人或矿工那里发送或接收交易。\n\
  \n这些是保持隐私的一些方式。取决于个人如何管理其隐私，在政治压力下，个人可能被迫使其交易更加私密和隐蔽。因此，比特币也被认为是**抗审查**的。\n\n以下是已在使用或正在开发中的不同隐私和扩容解决方案：\n\
  \n![](img/254.jpg)\n\n**表 8.1：** 不同解决方案对比特币网络和交易的隐私性及可扩展性的影响\n\n### 改进硬件\n\n芯片技术的进步和微型化可以减少验证区块的时间，缩短初始区块下载时间。我们有可能开发出采用\
  \ 2nm 工艺、改进的 RISC 架构和其他硬件设计元素的微处理器，从而产生性能更强的硬件，在更短时间内验证区块链。\n\n### Utreexo 累加器\n\
  \n\n\n\n### Utreexo\n\nUtreexo 通过改变 UTXO 索引的结构，改进了交易和区块验证。该功能仍在开发中，并已显示出令人期待的结果。如果成功，它将通过减少初始区块下载（IBD）时的区块链验证时间，从而允许增加区块大小。\n\
  \n### 签名聚合\n\n比特币正在经历许多变革，但要将增强功能纳入共识规则却相当困难。增强功能很重要，因为它能使技术面向未来。同时，与共识规则相关的增强功能是不可逆的，如果引入了错误的增强功能，网络将付出极高的代价。此外，共识规则需要向后兼容，因此每项变更都需要作为软分叉引入，这使得共识规则随着每次增强而变得更加复杂。\n\
  \n比特币将拥有一种名为 `Schnorr signature`（施诺尔签名）的新签名方案。与 `ECDSA` 不同，`Schnorr signatures`\
  \ 具有线性，这意味着 `Signatures`（签名）可以聚合成一个新的 `Signature` 而不影响其大小。\n\n这可以理解如下：\n\n![](img/Figure-8.7.jpg)\n\
  \n**图 8.7：** 使用 Schnorr 签名进行签名聚合\n\n众所周知，签名在交易中占据相当大的空间，因此我们可以通过在多签输入中聚合多个签名来减小交易的有效大小。这将有助于在一个区块中容纳更多交易，从而提高比特币的交易速率。\n\
  \n此外，由于签名聚合允许将多个签名和公钥聚合为单个签名和公钥，因此很难知道资金是由单个人还是一群人持有。这在不损害交易可验证性的前提下，使得比特币消费者的追踪变得困难。\n\
  \n### MAST：默克尔化抽象语法树\n\n在 `P2SH` 交易中，我们可以嵌入带有条件和子条件的复杂脚本。当交易被花费时，多重条件嵌套的仅一部分会被执行。花费者必须揭示脚本以使用被锁定的资金。这具有不必要的高成本，且不利于隐私。\n\
  \n为了理解条件和子条件，脚本可以表示为抽象语法树。这种表示法通常被编译器用于编译编程语言。例如，我们常用的脚本是 `2-3-multisig`（2/3 多签）。以爱丽丝、鲍勃和卡罗尔之间的\
  \ `2-3-multisig` 为例，我们可以将其表示为以下条件语句：\n\n`(Alice AND Bob) OR (Bob AND Carol) OR (Carol\
  \ AND Alice)`\n\n以下是爱丽丝、鲍勃和卡罗尔之间 `2-of-3-multisig` 的抽象语法树表示：\n\n![](img/Figure-8.8.jpg)\n\
  \n**图 8.8：** 2/3 多签的抽象语法树\n\n`MAST` 使用默克尔树来表示比特币脚本。默克尔树是抽象语法树的一种修改，其中条件的每一侧通过连接双方的哈希值来连接。这以一种方式分离了每个条件，使得交易花费者只需揭示默克尔证明所需的条件，而将其他条件隐藏起来。因此，这类似于\
  \ *第 5 章，白皮书* 中 **简化支付验证** 部分解释的默克尔证明。`MAST` 是一个在比特币交易中没有直接用例的概念。不存在 `Pay-2-Script-Merkle-Root`\
  \ 这种东西。它只是一个理解 `MAST` 的概念，但 `MAST` 确实用于 `Taproot` 中，因此理解这一点很重要。\n\n因此，在一个假设的 `P2SMR`\
  \ 交易中，将发生以下情况：\n\n![](img/Figure-8.9.jpg)\n\n**图 8.9：** 基于 MAST 的假设 P2SMR 交易\n\n\
  由于只揭示了脚本的一部分，它减少了交易中使用的字节数，有助于扩容，并提高了隐私，因为它不揭示完整的脚本。\n\n### Taproot\n\n`Taproot`\
  \ 走得更远。它将整个脚本或脚本的大部分隐藏在公钥签名对之下。因此，我们可以拥有一个包含多个条件和参与方的复杂脚本，并将其隐藏在该地址之下。这减小了交易大小，复杂脚本仅占用\
  \ `P2PKH` 交易的空间，或为脚本哈希稍多占用一些空间。并且交易将脚本的所有细节隐藏在公钥和签名中，使得观察者无法判断它是单签、多签还是复杂的智能合约。因此，它也非常有利于隐私。\n\
  \n以下是资金交易的示意图：\n\n![](img/Figure-8.10.jpg)\n\n**图 8.10：** Taproot 的资金交易\n\n要花费 `P2TR\
  \ UTXO`，我们可以使用私钥对交易进行签名，或者调整公钥（只有爱丽丝和鲍勃知道），或者我们需要提供所需的哈希值（如默克尔证明）以及签名。\n\n因此，使用\
  \ `P2TR UTXO` 可以创建两种可能的交易：\n\n1.  当爱丽丝和鲍勃签署交易时，在这种情况下，由于他们创建了一个调整后的公钥，他们也可以创建聚合签名。示意图如下：\n\
  \n    ![](img/Figure-8.11.jpg)\n\n    **图 8.11：** 使用主条件的 Taproot 花费交易\n\n2.  当鲍勃和卡罗尔或卡罗尔和爱丽丝签署交易时，由于他们没有创建调整后的公钥，他们需要提供哈希值（如默克尔证明）以允许验证。示意图如下：\n\
  \n    ![](img/Figure-8.12.jpg)\n\n    **图 8.12：** 用于其他条件的 Taproot 花费交易\n\n#####\
  \ 闪电网络\n\n区块大小的任何增强或变更，对每秒交易数（TPS）的增加只能产生有限的影响。即使我们能将区块大小增加 10 倍，每秒交易数也只能达到 200\
  \ 到 250 笔，这仍远小于信用卡。据记录，`Visa` 每秒可处理 65,000 笔交易。\n\n`Lightning Network`（闪电网络）是比特币区块链上的第\
  \ 2 层协议。我们已经在 第 4 章 *比特币在现实世界中* 和 *在线商家接受比特币* 主题中介绍了 `Lightning Network`。\n\n`Lightning\
  \ Network` 允许交易在链下发生。由于它是通过涉及几跳路由的个人之间进行的，因此每秒可发生的交易数量没有限制。这增强了比特币完成大量交易的能力，并能与\
  \ `MasterCard` 和 `Visa Card` 竞争。\n\n由于双方之间可以发生任意数量的交易而无需记录在区块链上，只有最终交易被记录，这提高了双方之间支付的隐私性。\n\
  \n`Schnorr Signature` 将通过将双方的签名集成到单个签名中，进一步降低创建和关闭 `Lightning Network` 通道的成本。我们甚至可以拥有多方通道，因为我们现在可以聚合签名。\n\
  \n### CoinJoin\n\n`CoinJoin` 是一种通过以难以知晓哪些输出从哪个 UTXO 接收币的方式将多笔交易连接在一起，使比特币具有同质性的方法。实现这一点有多种方式。\n\
  \n一种方法是划分输入中的价值并连接输出中的价值，使输出价值相匹配。这样，就很难将输入与输出匹配起来。\n\n例如，以下是三笔所需的交易：\n\n![](img/Figure-8.13.jpg)\n\
  \n**图 8.13：** 要加入 CoinJoin 的交易\n\n为了进行 `CoinJoin`，我们尝试将所有三笔交易合并为一笔交易，使得难以知晓哪些 UTXO\
  \ 流向了哪个接收者。这消除了比特币的身份标识，使其类似于现金。\n\n以下是 `CoinJoin` 交易的示例：\n\n![](img/Figure-8.14.jpg)\n\
  \n**图 8.14：** CoinJoin 示例\n\n\n\n\nIn the previous example, it is not possible to\
  \ know which addresses belong to Bob, Dave, and Kirsten, nor who is paying whom\
  \ in which output.\n\n### Tumbler Services\n\nTumbler services are provided by anonymous\
  \ exchanges and are untraceable because they mostly use the TOR network. They charge\
  \ a fee for the mixing transaction. Tumbler services receive bitcoins from the sender\
  \ and forward them to the receiver, but in the intermediate process, they mix these\
  \ bitcoins with other transactions or their own transactions and move them between\
  \ multiple addresses. This makes tracing impossible.\n\nThis can be understood from\
  \ the figure below:\n\n![](img/Figure-8.15.jpg)\n\n**Figure 8.15:** Tumbler Service\
  \ Example\n\nIn the figure above, it is not possible to know if Alice is paying\
  \ Bob, or Carol is paying Dave, or John is paying Kirsten, because all transactions\
  \ are completely mixed, separated, and uncorrelated.\n\nUnlike CoinJoin offered\
  \ by some popular wallets, Tumbler services are not offered by any known entity.\
  \ This is the nature of their operation. Hence, such services carry a risk because\
  \ they may steal your coins.\n\n### Bitcoin Mining Energy Consumption\n\nBitcoin\
  \ has a bad reputation for its high energy consumption, which is indeed true, as\
  \ shown in the figure below:\n\n![](img/Figure-8.16.jpg)\n\n**Figure 8.16:** Bitcoin\
  \ Mining Energy Consumption Compared to Top Countries by Electricity Usage\n\nThe\
  \ figure above shows the top 50 countries by energy consumption. Bitcoin currently\
  \ ranks 24th, with energy consumption close to Poland—a developed, wealthy European\
  \ country.\n\nIn comparison, global energy consumption is 23,000 TWh, while Bitcoin's\
  \ energy consumption is only 154 TWh, less than 1.0%. Bitcoin energy consumption\
  \ correlates with currency growth. As interest in Bitcoin grows, the energy consumption\
  \ of the Bitcoin network will increase accordingly.\n\nWe will perform some calculations\
  \ to understand why the situation is not as bad as it looks.\n\nTo avoid promoting\
  \ mining equipment, we will not disclose the name of the mining equipment used as\
  \ a reference.\n\nAssume I am using a mining device at a location in Bangalore city,\
  \ with current electricity rates as follows:\n\n![](img/262.jpg)\n\n**Table 8.2:**\
  \ Bangalore City Electricity Rates\n\nWe use the same procedure as in the \"Mining\
  \ Cost\" topic in *Chapter 6 Blockchain, Transactions, and Mining*.\n\nWe adopt\
  \ a miner with a hash rate of 90 TH/s and power consumption of 3050W, defined as\
  \ follows:\n\n```\ndef getMinerHashRate():\n    return 100 * 10**12\n\ndef getMinerPowerWatt():\n\
  \    return 3050\n```\n\nWe define the unit price as follows:\n\n```\nelectricity_rates\
  \ = {\"rate_slabs\": [{\"min\": 1, \"max\": 30, \"unit_price\": 4}, {\"min\": 31,\
  \ \"max\": 100, \"unit_price\": 5.45}, {\"min\": 101, \"max\": 200, \"unit_price\"\
  : 7}, {\"min\": 201, \"unit_price\": 8.05}]}\n```\n\nIf the current Bitcoin price\
  \ is ₹28,05,753, defined as follows:\n\n```\ndef getCurrentSellPrice():\n    return\
