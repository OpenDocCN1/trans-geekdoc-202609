  \ = b''\n    sndmsg = createMessage(sndcmd, payload)\n    s.send(sndmsg)\n    print('==>\
  \ cmd = %s, msg = %s' % (sndcmd, sndmsg.hex()), file=flog)\n    while True:\n  \
  \      recvmsg = recvMsg(s)\n        if recvmsg['command'] == 'addr':\n        \
  \    break\n        elif recvmsg['command'] == 'ping':\n            # send pong\
