  \ 单方面关闭\n\n            ![](img/ent.jpg) 撤销交易关闭\n\n    *   双向双资金通道\n\n        * \
  \  通道创建\n\n        *   涉及中介的链下支付\n\n*   通道监控\n\n    *   `Watchtower`（瞭望塔）\n\n  \
  \      *   惩罚交易的缺点\n\n*   路由机制和考量\n\n    *   `Trampoline nodes`（蹦床节点）\n\n    * \
  \  通道管理\n\n        *   循环再平衡\n\n        *   拼接\n\n        *   `Lightning Loop` 或潜艇互换\n\
  \n    *   `Multi-Part Payments` 或 `MPP`（多路支付）\n\n*   最终用户体验\n\n    *   `闪电钱包`\n\n\
  \    *   `闪电发票`\n\n    *   `LNURL`\n\n    *   商家集成\n\n    *   社交媒体集成\n\n    *  \
  \ 交易所采用\n\n*   其他加密货币\n\n    *   跨链原子交换\n\n*   网络拓扑\n\n### 目标\n\n在本章中，我们将重点学习 `闪电网络`\
  \ 并略微涉及其内部原理。`闪电网络` 协议规范被定义为 `BOLT` 规范。每个 `BOLT` 规范定义特定的网络抽象层。\n\n`比特币` 网络通过提供脚本操作码来为\
  \ `闪电网络` 做贡献，这就像计算机微处理器为高级语言编译器提供机器指令一样。因此，`闪电网络` 可以在不需要基础层变更的情况下增加复杂性。\n\n因此，`闪电网络`\
  \ 的发展非常动态，协议正在快速演进，允许改进和扩展用例。这需要更快的软件开发和测试周期，这与 `比特币` 的开发方式不同。\n\n由于 `闪电网络` 是一个相当广泛且动态的话题，当读者阅读本章时，规范中可能已经发生了不少变化。我们将尝试在本章的限度内涵盖尽可能多的内容。\n\
  \n### 闪电网络的简化工作原理\n\n我们在 第 4 章，比特币在现实世界中 的 `闪电网络` 高亮部分中讨论了 `闪电网络`。\n\n以下是您在 第 4\
  \ 章，比特币在现实世界中 中学到内容的总结：\n\n*   双方通过锁定他们的比特币来创建通道。\n\n*   如果通道其一方的当前余额仍有资金，任何一方都可以向另一方发送比特币。\n\
  \n*   双方之间的支付是点对点的，不涉及 `比特币` 网络。\n\n*   任何一方可以随时通过在 `比特币` 网络上广播最终的累积交易来关闭通道。\n\n\
  这是两方之间 `闪电` 支付的最简单视图。由于 `闪电网络` 是一个复杂的协议，它远不止简单的点对点支付。这一次，我们将更深入地探讨协议的工作原理。\n\n###\
  \ 已连接对等节点之间的支付\n\n如果 `Amazon` 作为买家或卖家有闪电支付选项，我们可以打开一个通道，并继续与 `Amazon` 进行交易，直到通道中没有余额。\n\
  \n例如，`Alice` 通过在她一方存入 0.001 ![](img/Bitcoin.jpg) 与奶商 `Bob` 创建了一个通道。在这种情况下，`Alice`\
  \ 使用 `UTXO` 为一笔向 2-of-2 多签合约付款的交易提供资金。这笔交易需要支付网络费用，并通过被包含在 `比特币` 区块链中来确认。\n\n以下是通道创建的示意图：\n\
  \n![](img/Figure-13.1.jpg)\n\n**图 13.1：** 通道创建\n\n在此，`Alice` 每天从 `Bob` 那里买牛奶，并在每天买牛奶时付款给他。\n\
  \n\n\n\n考虑到她支付 `0.0001`![](img/Bitcoin.jpg)持续 5 天，并与 Bob 共同同意关闭通道。\n\n下图展示了三天的中间交易：\n\
  \n![](img/Figure-13.2.jpg)\n\n**图 13.2：** 每次发送的离线交易\n\n每笔新交易都需要使前一笔交易失效，以便 Alice\
  \ 无法发布它来欺骗 Bob。Alice 发送给 Bob 的所有中间交易均未被发布。\n\nAlice 和 Bob 共同同意，并在 5 天后发布交易。\n\n\
  以下是关闭通道的已发布交易：\n\n![](img/Figure-13.3.jpg)\n\n**图 13.3：** 发布在链上的交易\n\n该图示不包含交易费，交易费也会随输出一同支付。在实际关闭通道时，Alice\
  \ 和 Bob 会就他们希望支付的网络费用进行协作，然后发布作为所有先前交易累积总和的交易。\n\n### 通过多个通道进行支付\n\n在现实场景中，每个节点将只有少数通道，因此它将仅连接到其他少数节点。随着网络增长，将会有数十亿个节点。因此，为了让任何人连接到其他人，将会有类似于互联网的路由机制。\n\
  \n这意味着将会有中介节点来促进节点之间的支付。此外，源节点和目标节点之间将存在多条路径，协议需要在选择路由路径时做出明智的决策。提供更好连接性、延迟和资金的节点将受到路由算法的青睐，因此节点将尝试通过收取路由费来激励这项服务。\n\
  \n为了实现这一点，闪电网络中的节点可以通过中间节点进行支付，中间节点可以收取费用。\n\n假设 Alice 想要支付 Carol，但她与 Carol 没有直接通道。然而，Alice\
  \ 可以支付 Bob，而 Bob 可以支付 Carol。我们还需要确保 Bob 无法窃取资金。\n\n这只有在 Alice 和 Bob 之间建立合同的情况下才行得通，该合同规定\
  \ Bob 只有在能证明他已支付 Carol 时才能赎回比特币。这意味着 Bob 先支付 Carol，然后向 Alice 证明他已支付。\n\n为了实现这一点，Carol\
  \ 创建一个秘密，Bob 和 Alice 都知道它的哈希值。Alice 和 Bob 之间的合同要求提供该秘密，Bob 在支付给 Carol 后获得该秘密。只有当\
  \ Carol 揭示秘密时，她才能赎回她收到的比特币。这种机制确保没有人能欺骗对方。\n\n以下是通过 Bob 从 Alice 向 Carol 路由支付的示意图：\n\
  \n![](img/Figure-13.4.jpg)\n\n**图 13.4：** 通过中介进行支付\n\n### Bolt 规范\n\n闪电网络要求节点通过消息进行通信。它们需要设置条件来管理故障和攻击、相互发现并保持匿名，还要传递收据。\n\
  \n由于闪电网络是开放且去中心化的，软件实现需要规范。Bolt 是闪电网络软件遵循的一组规范，以便使用一种闪电网络软件的节点能够与运行不同闪电网络软件的节点进行交互。\n\
  \nBolt 代表**闪电技术基础**（Basis of Lightning Technology）。\n\n以下是活跃的 Bolt 规范列表：\n\n| **Bolt\
  \ 规范编号** | **信息** |\n| --- | --- |\n| Bolt 1 | 基础层 |\n| Bolt 2 | 通道管理的对等协议 |\n|\
  \ Bolt 3 | 比特币交易和脚本格式 |\n| Bolt 4 | 洋葱路由协议 |\n| Bolt 5 | 链上交易处理建议 |\n| Bolt 7 |\
  \ P2P 节点和通道发现 |\n| Bolt 8 | 加密和认证传输 |\n| Bolt 9 | 分配的功能标志 |\n| Bolt 10 | DNS 引导和辅助节点定位\
  \ |\n| Bolt 11 | 闪电支付的发票协议 |\n\n**表 13.1：** Bolt 规范\n\nBolt 6 已被移除并由 Bolt 7 取代。\n\
  \n### 闪电网络中涉及的合同\n\n在上一节中，您了解了闪电网络的基本工作原理。现在，我们将查看实际合同以及处理不同情况的方式。\n\n### 已连接对等节点之间的离线支付\n\
  \n首先，我们将查看在已连接对等节点之间的单个通道上发生支付的情况。我们将查看创建通道所涉及的实际合同、离线交易的结构，以及关闭通道并将资金在链上结算的不同方式。\n\
  \n我们还将了解在创建通道和关闭通道时如何支付费用，以及每笔链下交易如何考虑这一点。我们还将了解协议如何通过合同处理作弊行为。\n\n### 通道创建\n\n\
  Alice 是 Bob 的客户，想要与 Bob 创建通道，以便她可以继续支付 Bob 并支付极少的费用。由于 Alice 是客户，她是付款方，而 Bob 始终是收款方。通道的创建方式是只有\
  \ Alice 在通道的她这一侧拥有余额。\n\n一旦创建通道并发生中间链下交易，任何人都应该能够单方面关闭通道。关闭通道需要支付网络费用，因此在打开通道时，需要协商网络费用。\n\
  \n节点通过交换定义的消息格式进行通信。消息格式定义在 `Bolt 2` 规范中。这促进了网络费用协商、通道建立等。\n\n合同价值定义为通道中锁定的资金与网络费用之和。锁定在通道中的资金总额仅用于从\
  \ Alice 向 Bob 转移价值。\n\n以下是合同价值及其组成的示意图：\n\n![](img/Figure-13.5.jpg)\n\n**图 13.5：**\
  \ 合同价值组成\n\n最初，锁定在通道中的资金完全在 Alice 这一方，因为她为 Alice 和 Bob 之间的 `2-of-2-multisig`（2/2\
  \ 多重签名）合同提供了资金。这表示如下：\n\n![](img/Figure-13.6.jpg)\n\n**图 13.6：** 支付通道\n\n以下是进入比特币区块链的资金交易：\n\
  \n![](img/Figure-13.7.jpg)\n\n**图 13.7：** 资金交易\n\n#### 即时或 Turbo 通道\n\n在闪电网络中，预期完全注资的通道将在链下交易发生前上链。然而，通道大多在支付时打开，等待半小时可能会导致糟糕的客户体验。\n\
  \n我们看到，当交易延展性漏洞通过隔离见证软分叉修复后，未确认交易变得相当可靠。仍然存在 0 确认攻击的风险，攻击者可以同时发布两笔交易。由于大多数通道不在单个通道上持有大量价值，依赖未确认通道是在安全性和客户体验之间的一种公平权衡。\n\
  \n不等待资金交易确认有一个重要优势。可以支付较低的网络费用。仅等待几小时确认就能显著降低费用。\n\n### 离线交易\n\n一旦资金被锁定在 `2-of-2-multisig`\
  \ 合同中，如果通道 Alice 这一方有余额，Alice 就可以支付 Bob。\n\n然而，Alice 可能会发布一笔给她更大价值的旧交易。为了保护 Bob\
  \ 不被 Alice 欺骗，在进行下一笔交易之前，所有旧交易都需要被设为无效。\n\n\n\n为了使最新交易失效，Alice 需要在进行下一笔交易前向 Bob\
  \ 提供撤销密钥。撤销密钥赋予 Bob 在 Alice 索取资金之前，认领通道中锁定的所有资金的权力。为防止 Alice 拿走她的份额，新合约规定在特定时长过去之前，不允许\
  \ Alice 取走她的资金份额。\n\n以下是前两笔承诺交易，包括初始承诺交易的撤销：\n\n![](img/Figure-13.8.jpg)\n\n**Figure\
  \ 13.8:** 承诺交易与撤销密钥共享\n\n此处我们仅保护 Bob 免受 Alice 欺诈，因为 Alice 不会被 Bob 欺诈。如果 Alice 和\
  \ Bob 拥有双向支付通道，则会有针对 Bob 和 Alice 的不同承诺交易，且撤销密钥也会双向共享。\n\n在承诺交易中，我们可以观察到：如果 Alice\
  \ 试图欺诈 Bob，Bob 可以使用撤销密钥立即认领 Alice 份额的资金。\n\n### 通道关闭\n\n关闭通道有三种方式：\n\n1.  通道可由双方协商一致关闭。这样可以重新协商费用。\n\
  2.  通道可单方面关闭。这意味着任意一方均可发布其最后一笔交易。\n3.  一方可通过发布交易的旧状态来欺骗另一方。\n\nBolt 2 规范也详细说明了通道的关闭。\n\
  \n#### 协商一致关闭\n\n在协商一致关闭的情况下，Alice 和 Bob 发送协议消息以决定费用，然后重新创建并签署最后一笔交易。Alice 和 Bob\
  \ 随后在 Bitcoin 区块链上发布该交易。与单方面关闭不同，协商一致的关闭交易没有相对时间锁，因此 Alice 通过支付较低费用即可立即获得资金。\n\n\
  以下是协商一致的最终交易示意图：\n\n![](img/Figure-13.9.jpg)\n\n**Figure 13.9:** 协商一致的通道关闭\n\n####\
  \ 单方面关闭\n\n在单方面关闭的情况下，发布最后一笔交易，Bob 可以立即取走他的资金，而 Alice 必须等待相对时间锁过期。\n\n以下是单方面关闭的示意图：\n\
  \n![](img/Figure-13.10.jpg)\n\n**Figure 13.10:** 单方面通道关闭\n\n在这种情况下，撤销密钥从未共享。因此，Bob\
  \ 无法取出资金，但 Alice 必须等待相对时间锁过期才能认领她的份额。\n\n#### 已撤销交易关闭\n\n如果 Alice 发布一笔已被撤销的旧交易，Bob\
  \ 可以创建一笔交易来认领 Alice 的所有资金。\n\n以下是 Alice 发布的交易：\n\n![](img/Figure-13.11.jpg)\n\n\
  **Figure 13.11:** Alice 发布的已撤销交易\n\n随后 Bob 使用他的撤销密钥创建另一笔交易来惩罚 Alice。这笔交易称为 **justice\
  \ transaction**。以下是示意图：\n\n![](img/Figure-13.12.jpg)\n\n**Figure 13.12:** Bob 发布的惩罚交易\n\
  \n如果 Bob 丢失了撤销密钥，则在 1 天后，Alice 可以将锁定的资金转移到她的地址。以下是示意图：\n\n![](img/Figure-13.13.jpg)\n\
  \n**Figure 13.13:** 1 天后 Alice 将资金转移到她的地址\n\n### 双向双资助通道\n\n前几节讨论的情况仅涉及单向支付。很多时候，对等节点之间的支付是双向的。在这种情况下，新通道使用\
  \ Alice 和 Bob 双方的资金创建。\n\n### 通道创建\n\n以下是双向资助通道的示意图：\n\n![](img/Figure-13.14.jpg)\n\
  \n**Figure 13.14:** 双向资助通道的资助交易\n\n在这种情况下，在 Alice 和 Bob 之间进行支付时，双方各自创建一笔交易并发送给对方，为撤销交易，双方均将撤销密钥传递给对方。无论谁支付给谁，这都会在每个实例发生。\n\
  \n通过以下示意图可以理解这一点：\n\n![](img/Figure-13.15.jpg)\n\n**Figure 13.15:** 承诺交易与撤销序列\n\n\
  在上述交易中，Alice 需要向 Bob 发送 10 m![](img/Bitcoin.jpg) 以购买咖啡。由于 Bob 是上一笔交易的接收方，Alice 拥有的资金将多于\
  \ Bob。因此 Alice 可通过发布上一笔交易来欺诈 Bob。为避免被欺诈风险，Bob 需要从 Alice 处获得一笔针对咖啡的签名交易，只有在那之后，他才能撤销他之前的交易并签署\
  \ Alice 的交易。\n\n这使得 Alice 和 Bob 能够拥有由双方资助的双向通道。通道关闭方式与前一节所学相同。\n\n### 涉及中介的离线支付\n\
  \n在这种情况下，Alice 想要支付 Carol 10mB，但她只与 Bob 有通道，而 Bob 与 Carol 有通道。Bob 收取费用通过其节点转发交易，Alice\
  \ 需要向 Bob 支付此费用，因为是她在支付 Carol。在 Lightning Network 支付中，预期由发送方支付费用。\n\nBob 使用 Lightning\
  \ Network 协议消息通知 Alice 她需要支付的费用。\n\n正如我们在之前的主题中所学，Carol 需要生成一个秘密并给出其秘密的哈希值。Carol\
  \ 只需与 Alice 分享秘密的哈希值，当 Alice 和 Bob 创建合约时，Bob 便能知晓该哈希值，并可用它与 Carol 或另一个中介创建合约。\n\n\
  当 Carol 向 Bob 揭示秘密时，Carol 可以认领她的资金。这使得 Bob 知晓该秘密，他将其揭示给 Alice 以认领他的资金。由于 Bob 只能在\
  \ Carol 向他揭示秘密后才能向 Alice 揭示秘密，Bob 和 Carol 之间交易的超时时间必须少于 Alice 和 Bob 之间的交易。\n\n为实现这一点，离线交易具有\
  \ **Hash Time Locked Contract (HTLC)**。HTLC 是一类要求满足哈希条件或时间条件的合约；否则锁定的资金将被没收。HTLC\
  \ 是离线交易中的额外输出。\n\n以下是通道两端持有的交易示意图：\n\n![](img/Figure-13.16.jpg)\n\n**Figure 13.16:**\
  \ 通过中介进行离线交易的合约交换\n\n在上述交易中，我们可以看到在 HTLC 输出中，如果秘密未被揭示且撤销密钥未被使用，则在挖出 1,000 个区块后 14\
  \ 天，Alice 可以在与 Bob 的通道中取回资金；在挖出 1,000 个区块后 13 天，Bob 可以在与 Carol 的通道中取回资金。\n\nHTLC\
  \ 是一个单独的输出，因此会增加交易成本且多承载少量价值。这意味着发布该交易时，HTLC 的 UTXO 价值可能使其不太实用。为避免最终交易中出现 HTLC，在\
  \ Bob 从 Carol 处获得秘密并验证后，会创建一笔新交易，通过移除 HTLC 输出并将其与接收方输出合并。\n\n以下是秘密和哈希共享的序列图：\n\n\
  ![](img/Figure-13.17.jpg)\n\n**Figure 13.17:** 通过中介支付的序列图\n\n在以下示意图中，是 Carol 与 Bob\
  \ 共享秘密后的新修改交易：\n\n![](img/Figure-13.18.jpg)\n\n**Figure 13.18:** Bob 知晓秘密后移除 HTLC\
  \ 输出\n\n之后，Bob 与 Alice 共享秘密，双方同意从交易中移除 HTLC。\n\n![](img/Figure-13.19.jpg)\n\n**Figure\
  \ 13.19:** Alice 知晓秘密后移除 HTLC 输出\n\n我们可以看到，上述更新后的交易消除了对交易结算的需求。\n\n### 通道监控\n\n\n\
  \n闪电网络有一个缺点：节点需要一直在线以监控其通道；否则，对等节点将有机会违约通道。这是因为如果发生通道违约而受影响的对等节点处于离线状态，它将不会知道违约已经发生，攻击者将成功窃取资金。然而，如果通道违约的受害者在线，它就会知道违约已发生，并会通过发布所需的惩罚交易（justice\
  \ transaction）来惩罚攻击者。\n\n但在现实场景中，节点可能会因多种原因离线，如飓风、互联网连接中断、火灾或电路短路，或者仅仅是因为误关闭了电源。\n\
  \n为了避免这种情况，闪电节点可以支付能够监控其通道的节点。这些监控节点被称为**监视塔**。\n\n#### 监视塔\n\n监视塔是一个闪电网络节点，它为其客户维护通道状态，并在客户离线时针对通道违约发布惩罚交易或正义交易。\n\
  \n监视塔应始终保持在线并持续监控区块链。每当其客户进行新交易或共享撤销密钥时，监视塔的客户都需要更新监视塔。\n\n借助以下时序图可以理解监视塔的工作原理：\n\
  \n![](img/Figure-13.20.jpg)\n\n**图 13.20：** 监视塔的运作\n\n在上述时序图中，我们可以看到监视塔的客户让监视塔服务器随时了解其所有通道的状态变化。因此，一旦发生通道违约，监视塔就会发布正义交易，客户便可以申领惩罚交易。\n\
  \n### 正义交易的缺点\n\n正如你所了解的，闪电网络提供了一种机制，通过发布非最新交易来惩罚试图违约通道的节点。这种惩罚机制称为 **LN-penalty**，通过发布正义交易来实现。这听起来是个好主意，但在现实中，大多数受到惩罚的节点并非在作弊。大多数违约发生的原因是节点未维护最新交易。\n\
  \n因节点失误而惩罚它是不合理的，因此正在研究一种不同的机制，称为 **Eltoo**。Eltoo 可能是闪电网络未来的增强方案。它将依赖一种名为 `SIGHASH_ANYPREVOUT`\
  \ 的新哈希类型。在 `SIGHASH_ANYPREVOUT` 被添加到比特币脚本之前，Eltoo 无法实现。比特币拥有非常严格的增强机制，大多数利益相关者需要就新增强达成一致，尤其是其庞大的开发者社区，这意味着如果\
  \ `SIGHASH_ANYPREVOUT` 存在不可接受的风险，它可能永远不会被接受。或者可能有其他增强方案解决此问题。在此之前，我们不得不接受这一缺点，并采取足够的预防措施以避免资金损失。\n\
  \n### 路由机制与考量\n\n当 Alice 想要支付 Dave 时，她需要找到一条通往 Dave 的路由，使得路由中每个通道的支付方都有足够的资金，以确保支付成功。这被称为**源路由**。当\
  \ Alice 的节点尝试寻找通往 Dave 的路由时，它会查看通道容量，即通道中锁定的总价值。有时通道容量足够高，但通道的发送端没有足够的资金；这可能导致处理失败。\n\
  \n需要收集这些信息，以便下次出现类似支付需求时避开该通道。此外，可以根据过去的违约情况对节点和通道进行评级。\n\n寻找通往目标接收者的路由时，需要考虑以下因素：\n\
  \n*   通道容量足够高\n*   因支付方资金不足导致的过往失败\n*   节点过往的通道违约记录\n*   节点转发支付请求收取的费用\n\n### 蹦床节点\n\
  \n节点面临的挑战之一是找到一条既便宜又在每个通道都拥有足够容量的路由。这需要持续更新网络拓扑。在网络规模不大时这没问题，但随着我们看到采用率的快速上升，这正成为一个问题。\n\
  \n蹦床节点是闪电网络中的特殊节点，其唯一职责是通过频繁更新来维护当前的网络拓扑。因此，节点只需维护部分网络拓扑以连接到蹦床节点或所有附近的节点。\n\n一个蹦床节点维护关于闪电网络中所有节点的信息，并可能依赖其他蹦床节点将路由扩展到其子网之外。这样，无需任何节点维护关于整个网络的信息。\n\
  \n蹦床节点允许非托管移动钱包在全球范围内即时发送闪电支付，而无需大量内存和处理能力。\n\n使用蹦床节点进行支付路由如下图所示：\n\n![](img/Figure-13.21.jpg)\n\
  \n**图 13.21：** 发送节点借助蹦床节点寻找通往接收节点的路由\n\n### 通道管理\n\n通道可以仅为服务对等节点间的请求而创建，且大多对网络其余部分隐藏。这些被称为**私有通道**。另一方面，通道也可以是公开的，可供其他节点用于与网络其余部分建立路由连接。\n\
  \n对于公共通道，重要的是双端资金保持平衡，以免因支付方资金不足而导致路由失败。这需要主动的通道管理和与对等节点的协作。有多种方法可以实现这一点。\n\n####\
  \ 循环再平衡\n\n再平衡通道的一种方法是从我们的另一个通道向自己支付。\n\n借助以下插图可以理解这一点：\n\n![](img/Figure-13.22.jpg)\n\
  \n**图 13.22：** 循环再平衡机制\n\n循环再平衡成本低廉，因为只发生链下交易，但它要求至少有一个通道在另一侧拥有充足资金。\n\n#### 拼接\n\
  \n循环再平衡是首选的再平衡方法，但对商家没用，因为商家可能只收款不付款，因此可能没有任何通道可将资金移至其他通道。\n\n拼接允许在无需关闭或重新打开通道的情况下更改通道容量。拼接要求在接受所有传入支付请求的同时修改资金交易。这使得实现起来相当复杂。\n\
  \n拼接入是指增加通道容量。以下是拼接入的要点：\n\n![](img/Figure-13.23.jpg)\n\n**图 13.23：** 拼接入要点\n\n\
  拼接出是指减少通道容量。以下插图是拼接出的要点：\n\n![](img/Figure-13.24.jpg)\n\n**图 13.24：** 拼接出要点\n\n\
  这只是拼接入和拼接出的简化表示。实际上，实现将更加复杂。\n\n#### 闪电环路或潜艇互换\n\n潜艇互换，也称为闪电环路，是另一种通过将资金移入和移出通道来管理通道的方式。闪电环路基于这样一个原则：HTLC\
  \ 既可在链上也可在链下工作，因此互换提供商可以帮助以无信任方式在链下和链上之间移动资金。\n\n闪电环路是商家在无需拼接复杂性的情况下将资金移至通道另一侧的另一种方式。\n\
  \n要将资金移出通道，节点通过通道经多跳将资金发送给互换提供商，后者将资金链上发回给节点，实际上将资金从链上移除。\n\n借助以下插图可以理解这一点：\n\n\n\
  \n\n![](img/Figure-13.25.jpg)\n\n**图 13.25：** 使用潜艇互换将资金从通道移动到链上\n\n同样的方法可用于通过互换提供商从链上添加资金，只需按相反方向执行上述过程即可。\n\
  \n下面是使用 Lightning Loop 将资金从链上移动到通道我的一侧的示意图：\n\n![](img/Figure-13.26.jpg)\n\n**图\
  \ 13.26：** 使用潜艇互换将资金从链上移动到通道\n\n### 多路支付或 MPP\n\n闪电网络不适合通过通道网络转移大额价值。这是因为要通过通道网络转移价值，只能选择发送方一侧有足够余额的通道，而大容量通道很少见。因此，如果需要转移大额价值，很难在发送方和接收方之间构建路由。为了克服这个问题，闪电网络软件有时会将价值拆分到多个通道上，并为每个拆分的价值寻找单独的路由。这被称为**多路支付**。\n\
  \n通过下面的插图可以理解这一点：\n\n![](img/Figure-13.27.jpg)\n\n**图 13.27：** 多路支付\n\n在上图中，Alice\
  \ 想要向 Bob 发送 100 m![](img/Bitcoin.jpg)，但没有可用的路由来转移它。为了实现这一点，Alice 将金额拆分为 20 m![](img/Bitcoin.jpg)、30\
  \ m![](img/Bitcoin.jpg) 和 50 m![](img/Bitcoin.jpg)，然后通过不同的路由发送。这样，Bob 就可以在无需进行链上交易的情况下离线接收\
  \ 100 m![](img/Bitcoin.jpg)。\n\n##### 最终用户体验\n\n当我们使用闪电网络支付服务时，我们需要创建一个通道，只要通道的收款方一侧有余额，我们就可以向对等方支付任意多次。\n\
  \n为了发送或接收付款，我们需要在我们的节点和网络中的其他几个节点之间建立通道。这需要通道管理，可能涉及以下活动：\n\n*   创建一个通道，资金在我们这边、对等方那边，或两边都有。\n\
  *   创建零确认通道（turbo channels），或等待 3-6 个确认后再接受或发送付款。\n*   主动平衡通道，以便既能发送也能接收付款。\n* \
  \  保持网络拓扑最新，或使用蹦床节点来寻找最佳路由。\n*   使用瞭望塔服务以防止被对等方欺骗。\n*   协作或单方面关闭通道，并监控比特币区块链上的通道关闭/违约事件。\n\
  \n这看起来可能很吓人，但许多闪电网络钱包在内部处理所有这些事务，用户体验是无缝的。\n\n### 闪电钱包\n\n闪电钱包是比特币钱包，也能开启和管理通道。钱包可能会通过允许用户分配资金和管理通道来赋予用户更多控制权，也可能对用户隐藏所有复杂性，使体验无缝衔接。钱包可能是托管型的，资金由钱包控制，用户只需登录并批准交易。另一方面，在非托管钱包中，创建钱包的种子和密钥掌握在用户手中。\n\
  \n由于闪电钱包正在创建和管理通道，它们也被称为**闪电节点**。\n\n以下是一些流行的闪电钱包：\n\n*Zap 钱包、Muun 钱包、BlueWallet、Breez\
  \ 钱包、Wallet of Satoshi、Bitcoin Lightning Wallet (BLW)、Éclair Mobile 等。*\n\n### 闪电发票\n\
  \n你已经了解到，当 Alice 从 Bob 那里购买咖啡时，Bob 会生成一个秘密哈希，以便 Alice 进行支付。为了实现这一点，Bolt 11 解释了 Bob\
  \ 需要与 Alice 共享的消息结构，这被称为闪电发票。\n\n在这里，我们从商户应用程序生成了一个闪电发票，并使用一个开源应用程序对其进行了解码。以下是该应用程序的屏幕截图：\n\
  \n![](img/Figure-13.28.jpg)\n\n**图 13.28：** 闪电发票信息\n\n我们可以看到它包含的所有信息，这将帮助 Alice\
  \ 创建一笔交易，并通过一个通道发送，付款将通过该通道路由并到达 Bob。\n\n请求的字符串只是 Bob 与 Alice 分享的二维码。所以 Alice 去\
  \ Bob 的咖啡店。Bob 通过在手机钱包中显示二维码来请求付款。Alice 用她的手机钱包扫描二维码并进行支付。这在一分钟内就完成了。\n\n以下是闪电网络支付的示意图：\n\
  \n![](img/Figure-13.29.jpg)\n\n**图 13.29：** 闪电网络支付\n\n### LNURL\n\nLNURL 是建立在闪电网络之上的第三层。它更进一步，允许你使用闪电网络创建通道、发送和接收付款，甚至将其用于网站身份验证。\n\
  \nLNURL 支付链接可重复使用，因此不需要在每次购买时重新扫描发票。LNURL 涉及一个服务器，当扫描二维码时，扫描应用程序会联系 LNURL 服务器以执行所需的服务。这样，发票的发送无需用户交互即可发生。\n\
  \n这使得闪电网络不仅可用于支付，还可用于身份验证。LNURL 用于实现一些其他服务，具体请参阅以下 URL：\n\n[`github.com/fiatjaf/lnurl-rfc`](https://github.com/fiatjaf/lnurl-rfc)\n\
  \nLNURL Auth 就是由 LNURL 启用的一项服务，它允许你使用闪电钱包登录网站。\n\n我们将使用以下网站来演示 LNURL Auth：\n\n[`lightninglogin.live/login`](https://lightninglogin.live/login)\n\
  \n以下是 LNURL：\n\n![](img/Figure-13.30.jpg)\n\n**图 13.30：** 用于登录网站的 LNURL Auth\n\n\
  这解码为以下内容：\n\n`lightNING:LNURL1DP68GURN8GHJ7MRFVA58GMNFDENKCMM8D9HZUMRFWEJJ7MR0VA5KU0MTXY7N2WTRX4JNYENXVVMXZVTZV43RWCN9XPSKVDECXY6NWEPHXG6KVCNYXEJRXWRPXVUNSVFK893K2CF5XENRXVNRVEJKVCFSVVURYDPCXCN8GCT884KX7EMFDCSMESJ7`\n\
  \n我们使用一个在线应用程序对其进行解码，获得了以下 URL：\n\n[`lightninglogin.live/login?k1=59c5e2ffc6a1beb7be0af78157d725fbd6d38a398169cea46f32cfefa0c82486&tag=login`](https://lightninglogin.live/login?k1=59c5e2ffc6a1beb7be0af78157d725fbd6d38a398169cea46f32cfefa0c82486&tag=login)\n\
  \n支持 LNURL 身份验证服务的钱包将能够与 LNURL 服务器协调以进行身份验证并登录服务器。简单扫描二维码即可让用户登录网站，他们将不需要任何传统的登录方式。\n\
  \n### 商户集成\n\n闪电网络钱包允许任何实体店只需安装一个移动钱包即可接受付款。对于在线业务，BTCPay 服务器提供了闪电钱包与在线支付网页的轻松集成。BTCPay\
  \ 是一个开源项目。还有其他的，如 WooCommerce 或 CoinGate，也提供闪电网络集成。\n\n### 社交媒体集成\n\nTwitter 最近与\
  \ Strike 钱包集成。截至目前，任何拥有 Strike 钱包的人都可以通过闪电网络通道接收比特币，任何拥有闪电钱包的人都可以发送比特币。这意味着人们可以在全球范围内协作并因服务获得报酬。此外，社会服务组织可以直接联系在暴政政权下工作的人们，通过直接向他们支付比特币来提供帮助。\n\
  \nTelegram 也有闪电网络机器人 `LNTXBOT`，可用于支付或请求付款。\n\n### 交易所采用\n\n一些交易所迅速采用了闪电网络。印度交易所\
  \ Zebpay 就是其中之一。全球有许多交易所也支持使用闪电网络将比特币与其他货币或加密货币进行兑换。一些流行的交易所包括 Bitfinex、Strike、OKEx、CashApp、Paxful\
  \ 等。\n\n\n\n\n\n### 其他加密货币\n\n闪电网络需要某些增强功能，例如隔离见证，以克服交易延展性风险等问题。许多加密货币使用的代码库和脚本语言与比特币几乎相同。在比特币网络上启用闪电网络的增强功能，也可能在许多其他加密货币上启用闪电网络。\n\
  \n截至目前，莱特币是唯一另一个在其网络上启用了闪电网络的加密货币。其他一些加密货币已表示出兴趣，但迄今为止尚无一家添加了闪电网络所需的支持。\n\n### 跨链原子交换\n\
  \n你已经了解了如何使用 HTLC 通过潜艇互换将链下余额与链上余额进行交换。同样，HTLC 也可用于与另一种加密货币执行跨链交换。莱特币创始人 Charlie\
  \ Lee 于 2017 年 9 月 16 日通过莱特币演示了这一点。YouTube 上有一个 2 分钟的演示视频，标题为 `Lightning Cross-Blockchain\
  \ Swap Between Bitcoin and Litecoin`：\n\n**https://www.youtube.com/watch?v=cBVcgzEuJ7Q**\n\
  \n### 网络拓扑\n\n闪电网络仍在不断发展，网络结构未来可能会发生变化。然而，整体网络似乎正试图模仿邮政网络，即个人连接到钱包提供商，钱包与更大的跳点维护通道，而更大的跳点则连接到其他几个类似的跳点以简化转发。\n\
  \n作为最终用户，我们永远不需要关闭与钱包的通道。如果我们收发资金，该通道可以持续很长一段时间；因此，总体支付的费用微乎其微。\n\n以下是闪电网络拓扑的示意图：\n\
  \n![](img/Figure-13.31.jpg)\n\n**图 13.31：** 闪电网络拓扑\n\n在上图中，我们可以看到有数千个节点通过通道相连。这些是公共通道，因此可以被发现并用于更新拓扑。\n\
  \n### 结语\n\n在本章中，你学习了闪电网络协议，这是比特币的二层协议。你了解了比特币的基础脚本语言如何使可靠的即时交易成为可能，并理解了闪电网络拥有其开放规范和消息系统，以允许不同的软件实现相互通信。\n\
  \n你还了解了有助于路由支付或通道再平衡的节点，以及为闪电网络构建并在其上构建的生态系统。\n\n本书到此结束。本书的目的是通过让读者了解比特币协议、网络、区块链、交易、增强功能等内部细节，帮助建立比特币开发者社区。进入比特币开发社区的开发者越多，比特币将变得越安全、越完善，这让我们对更加去中心化的未来充满希望。\n\
  \n### 要点回顾\n\n*   闪电网络是二层协议，并使用比特币交易脚本。\n*   它允许比特币的即时离线支付。\n*   要使用闪电网络执行离线交易，需在发送方和接收方之间创建一个通道。\n\
  *   如果发送方一端的通道有足够资金，则可执行离线交易。\n*   通道可以单方面关闭，也可以协作关闭。\n*   通道违约是指攻击者通过发布旧交易来关闭通道。\n\
  *   通道违约的受害者通过发布惩罚交易来惩罚攻击者，该交易包含攻击者提供的撤销密钥，用于将攻击者的资金支付给受害者自己。\n*   单向通道在创建时仅在发送方一端有资金。\n\
  *   双向通道在通道两端都锁定了资金。\n*   通道是通过在 2-of-2 多重签名中锁定资金来创建的。\n*   两个没有直接通道的个人之间可以通过在一系列通道中跨多个节点路由支付来进行支付。\n\
  *   源路由是指发送方与节点通信以构建网络拓扑，从而找到通往目标的最佳路由。\n*   蹦床节点帮助发送方找到最佳路由。\n*   蹦床节点维护更新的网络拓扑，发送方只需要部分拓扑信息。\n\
  *   节点需要始终保持在线；否则，对等节点可能会发布旧交易，离线节点将损失资金。\n*   瞭望塔节点可以通过持续监控链上情况，在需要时发布惩罚交易来为节点提供服务。\n\
  *   节点可以连接到瞭望塔服务器，并定期向其更新通道状态和惩罚交易。\n*   循环再平衡是一种方法，节点可以通过将资金移动到其另一侧资金充足的通道来平衡通道。\n\
  *   潜艇互换或闪电环路节点有助于将链上资金移动到通道末端的节点，或反之亦然。\n*   拼接允许你在不使通道下线的情况下动态增加或减少通道容量。\n*  \
  \ 增加通道容量称为拼接入，减少容量称为拼接出。\n*   多路支付允许发送方通过将金额拆分为较小的值并通过不同的通道和路由发送，从而在闪电网络上发送大额交易。\n\
  *   闪电发票由商家或接收方生成，可以是二维码的形式。发送方使用它来进行支付。\n*   LNURL 是三层协议。\n*   LNURL 提供了一种使用单个二维码重复支付的方式。\n\
  *   使用 LNURL，可以执行各种其他任务，如身份验证和创建通道。\n\n### 问题\n\n1.  解释单向通道和双向通道之间消息交换的区别。\n2. \
  \ 为什么公共路由节点保持通道平衡很重要？\n3.  与源路由相比，使用蹦床节点有什么好处？\n4.  解释使用 MPP 的好处。\n5.  填空：\n   \
  \ 1.  通道容量可以通过称为 `splice-in` 的通道管理技术来增加。\n    2.  闪电网络可以通过使用 LNURL `auth` 对网站进行身份验证。\n\
  \    3.  闪电网络已演示在比特币节点和莱特币节点之间执行 `cross-chain atomic swap`（跨链原子交换）价值转移。\n6.  判断正误：\n\
  \    1.  LNURL 是三层协议，因为它拥有自己的消息协议，有助于建立和执行闪电网络操作。\n    2.  循环再平衡是最适合商家的通道平衡方法，因为他们大多总是收款。\n\
  \    3.  闪电通道没有风险，因此可以开设大容量通道。\n    4.  闪电网络的可用性取决于节点互联的程度，这取决于其普及度。\n7.  列出托管钱包和非托管钱包的清单。\n\
  8.  安装闪电网络钱包，进行一笔支付，并尝试猜测后台发生的步骤。\n\n### 索引\n\n### 符号\n\n*   51% 攻击 255\n\n### A\n\
