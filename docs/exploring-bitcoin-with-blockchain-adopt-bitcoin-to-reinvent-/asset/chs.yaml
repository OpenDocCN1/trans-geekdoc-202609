  \n然后她按如下方式发布交易：\n\n![](img/Figure-11.55.jpg)\n\n**图 11.55：** 计划的组交易发布成功\n\n通过这些协作交易，你学习了多个个体如何协作形成一个汇总的交易。\n\
  \n### 结论\n\n在本章中，你了解了我们可以使用交易和脚本的不同方式。你还学习了如何为数字资产加时间戳，以及如何锁定交易直到达到某个区块高度或时间。在本章后续部分，你学习了如何确保支付安全，这可以引导构建点对点交易。此外，你还学习了如何向交易做出贡献，并将贡献的交易汇总成最终交易。\n\
  \n在下一章中，你将了解一个重要的软分叉：隔离见证。\n\n### 要点回顾\n\n*   数字资产或数字财产是财产的数字表示形式。\n*   数字财产是唯一的，并且在任何时间点都与所有者的比特币地址相关联。\n\
  *   数字财产可以具有市场价值，并可以被出售、拍卖或抵押。\n*   `OP_RETURN` 操作码用于在交易中存储数据。\n*   `OP_RETURN`\
  \ 操作码不可花费，且仅与该交易相关联。\n*   交易可以被锁定，直到过往时间中位数小于锁定时间，或直到达到区块高度。\n*   交易也可以根据相对于资金交易的相对锁定时间进行锁定，以区块高度或过往时间中位数为单位。\n\
  *   相对锁定时间是一种软分叉，用于脚本中。\n*   相对锁定时间修改了 `nSequence` 字段的演变方式。\n*   智能合约是以可执行程序形式编写的两方或多方之间的合约。\n\
  *   比特币智能合约存在一定的局限性，无法实现其他一些智能合约平台能做的所有事情。\n*   比特币智能合约提供了足够的灵活性，有助于克服其大部分局限性。\n\
