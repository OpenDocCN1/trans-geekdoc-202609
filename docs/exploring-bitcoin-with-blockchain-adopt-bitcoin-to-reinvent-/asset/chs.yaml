- "## 区块链探索比特币：采用比特币重塑业务扩展，降低交易成本与防欺诈指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n### 献给\n\n*我挚爱的妻子 **Rati** 和女儿 **Aruvyaa***\n\n### 作者简介\n\n我是\
  \ **Vizeet Srivastava**。我在产品开发生命周期的所有阶段拥有超过 20 年的经验。我拥有广泛的技术经验，涵盖电信、数据通信、Windows\
  \ 设备驱动程序，而在过去十年里，我专注于大数据和云平台技术。\n\n我的职责是架构和设计解决方案，并与团队合作将解决方案落地。作为一名数据工程师，我曾处理多渠道异构数据源以执行复杂事件处理、创建状态机、流控制并构建图关系。作为一名云工程师，我曾从事云迁移自动化、数据摄取自动化、清洗、转换及转换后数据的消费工作。\n\
  \n我是认证的 Hyperledger 开发者和顾问。\n\n目前，我是塞尔维亚 HyperVerse Global Consulting 公司的所有者，为客户提供与大数据和云平台相关的软件咨询服务。\n\
  \n### 审阅者简介\n\n**Priyank Jani** 拥有 7 年以上的区块链经验和 14 年以上的软件行业经验。目前他在 Icertis 担任区块链架构师。Priyank\
  \ 认为区块链不仅是一项技术，更是一种理念，旨在改变、改进、维持并创造新机会。出于对区块链的热情，Priyank 创立了一个名为 “LetsBlockchain”\
  \ 的社区，帮助企业和个人采用区块链技术。他是政府区块链协会成员并负责浦那分会。\n\n### 致谢\n\n有几个人我要感谢，感谢他们在本书写作过程中给予我的持续支持。首先，我要感谢我的妻子和女儿，感谢她们持续的支持、鼓励以及在我的自学旅程中做出的牺牲，没有她们我永远无法完成这本书。\n\
  \n我感激中本聪，他给了我们希望，让目前金融体系忽视的 10 亿多人实现金融普惠。我还感激 Andreas Antonopoulos，他的著作《精通比特币：编程开放区块链》及其\
  \ YouTube 视频启发了我，让我获得了比特币的技术视角。我同时也感激 Vijay Boyapati 和 Michael J Saylor，他们的著作《看涨比特币的理由》让我获得了比特币的金融视角。\n\
  \n我感激所有直接或间接帮助我获取学习比特币所需材料的每一个人——没有他们的贡献，我无法学习比特币并完成这本书。\n\n我衷心感谢 Priyank Jani 先生和\
  \ Samanyu Chopra 对本书进行的善意技术审查。\n\n我的感激也献给 BPB Publications 的团队，感谢他们给予我足够长的时间来完成这本书，因为比特币区块链是加密货币和区块链技术领域的核心，需要大量研究来呈现细节、生态系统中其他组件的联系以及对读者的益处，同时避免书籍过于庞大。\n\
  \n### 前言\n\n本书循序渐进、层层深入地带领读者探索比特币的技术层面，使毫无比特币基础的读者或具备中级知识的读者均能受益。本书更侧重于概念和基础的解释，而非编程。虽然编程比特币是本书的重要组成部分，但超过一半的章节不包含任何程序，而是专注于解释。本书使用\
  \ Python 程序、简洁的语言、示例、图表和插图来解释每个小节和章节。\n\n本书面向具备一般编程技能且有兴趣了解比特币基础知识的人群。需要具备基本的 Python\
  \ 编程知识。本书采用简单的过程式编程，任何具备一般编程基础的人都能理解，即使只有少量 Python 经验也无妨。\n\n本书编写时考虑到了大学生和高校的需求。书中包含问题和编程作业。它适合零基础、初学者以及具备中级比特币知识的人士。\n\
  \n重要的是要意识到，投资比特币伴随着风险，且常被归咎为财务损失的原因。本书不提供任何财务建议，也不旨在影响读者的财务决策。它纯粹是一本技术书籍，仅面向对比特币技术层面感兴趣的读者。话虽如此，本书确实从技术里程碑的角度为比特币确立了地位，并阐述了其在我们未来的重要性。\n\
  \n本书旨在通过让大众轻松获取比特币内部知识来壮大比特币开发者社区。这就是本书专注于理论并使用 Python 编写简单过程式程序的原因。本书中的程序仅为学习目的而创建，未经详尽测试，因此不适用于使用真实比特币进行支付的生产环境。\n\
  \n本书在程序中使用了私钥和种子短语。这些私钥和种子短语不应在任何钱包中使用，也不应用于发送和接收真实比特币，否则它们会被盗取。\n\n当本书的读者开始运用书中解释的概念，并能采纳\
  \ Taproot 等新概念，形成自己对比特币增强功能和特性的观点，或开始为比特币生态系统做出贡献时，本书的目标就达成了。\n\n*本书共包含 13 章，章节分为以下四个部分：*\n\
  \n\n\n\n## 简介\n简介将是第一部分，包含四章。将重点让读者熟悉比特币。将涵盖区块链生态系统、其他加密货币和区块链项目、比特币的定义、需求与必要性、拓扑与共识机制概述以及用例。\n\
  ### 第 1 章\n将让读者一窥比特币所处的生态系统，并向读者介绍其他加密货币和区块链项目以及整体比特币生态系统。\n### 第 2 章\n将了解促成比特币网络诞生的技术增强，以及比特币问世以来发生的重大事件。还将解释比特币的含义和目的、它可能对未来产生的影响，以及为什么学习比特币仍然很重要。\n\
  ### 第 3 章\n将了解比特币的网络拓扑，并理解比特币共识网络。比特币网络拓扑将包括节点类型及其交互。比特币共识网络将包括其组件、它们的交互，以及如何从高层视角将比特币支付视为交易创建、交易签名、传播，最后纳入区块链。\n\
  ### 第 4 章\n将了解个人和组织使用比特币以及与比特币网络交互的不同方式。\n### 比特币共识网络\n比特币共识网络将是第二部分，包含四章。将重点通过解释比特币白皮书、验证区块链中的区块、构建和验证交易、理解挖矿过程，以及详细了解比特币的优势和劣势，来理解比特币工作量证明共识机制的基础知识。\n\
  ### 第 5 章\n将逐节详细理解比特币白皮书。\n### 第 6 章\n将分析比特币区块链、区块和交易结构，了解 Bitcoin Core 软件使用的不同索引，深入了解挖矿，并尝试构建一个独立矿工。\n\
  ### 第 7 章\n将深入探讨节点间通信。将包括建立比特币网络、发现节点、广播交易和区块，以及学习区块链的下载与同步。\n### 第 8 章\n将了解比特币的局限性、漏洞和潜在威胁。将理解扩展性和隐私局限性是在设计和实现过程中引入的，且是必要的，以及克服它们的不同方法。将了解比特币网络可能遭受攻击或未来可能变得脆弱的不同方式，以及如何缓解这些问题，或者为何它们可能不构成问题。还将了解其他形式的攻击或错误，这些可能导致个人丢失比特币。\n\
  ## 编程比特币\n编程比特币将是第三部分，包含三章。将深入探讨比特币脚本的细节，并利用它们构建更复杂的用例，包括智能合约。还将深入探讨用于接收和访问比特币的钱包。\n\
  ### 第 9 章\n将学习访问和保护比特币。将学习从用于在将交易发送到网络前对其签名的随机数生成私钥。将学习生成用于接收比特币的公钥和地址。还将学习创建确定性钱包，这将有助于简化比特币的接收、发送和保护。\n\
  ### 第 10 章\n将深入探讨交易验证与创建。将学习解析交易，并了解用于在交易中锁定和解锁比特币的脚本语言。将创建标准交易并将其发布到网络上。\n### 第\
  \ 11 章\n将理解如何使用脚本创建各种有用的用例，这些用例可用于构建更复杂的智能合约。\n## 扩展比特币\n扩展比特币将是本书的第四部分，也是最后一部分，包含两章。前一章将重点关注隔离见证增强，而后一章则专注于闪电网络，这是添加到比特币区块链上的第二层协议。两章都将提供扩展比特币的不同方法。每章都将深入解释主题，且不局限于扩展性。闪电网络将不包含编程内容。\n\
  ### 第 12 章\n将理解隔离见证增强。将理解该增强的不同优势。还将学习解析隔离见证交易。\n### 第 13 章\n将理解闪电网络，即添加到比特币协议的第二层。将在一定程度上理解闪电网络通道管理和智能合约。还将理解通道监控、路由机制以及闪电网络的用户体验。\n\
