  \ `plyvel` 包来探索这些值。\n\n### 区块链\n\n区块链是区块的序列，每个区块是交易的集合。区块链包含自 Bitcoin 网络诞生以来发生的所有交易。\n\
  \n### 创世区块\n\n创世区块定义如下：\n\n> 任何区块链中的第一个区块称为创世区块。\n\n2009 年 1 月 3 日，Bitcoin 网络诞生。中本聪挖掘区块持续了几个月。当时还有其他几位开发者也在挖掘区块，但\
  \ Bitcoin 区块链中的第一个区块与众不同。它不是挖出来的，而是硬编码在 Bitcoin 软件中。区块链通过前一个区块哈希向回遍历，最终到达该区块，这意味着我们可以通过修改该区块来创建一条不同的链，从而诞生一种新币。该区块携带一条特殊消息，向世界证明\
  \ Bitcoin 存在的合理性。\n\n以下是创世区块的十六进制代码：\n\n![](img/Figure-6.3.jpg)\n\n**图 6.3：** 显示创世区块的十六进制转储\n\
  \n该十六进制代码以字节转储形式打印时，输出如下：\n\n![](img/Figure-6.4.jpg)\n\n**图 6.4：** 显示创世区块哈希转储的二进制形式\n\
  \n我们可以看到带有日期和来源的消息：\n\n![](img/Figure-6.5.jpg)\n\n**图 6.5：** 显示存储在创世区块中的消息\n\n2009\
  \ 年 1 月 3 日，伦敦《泰晤士报》刊登了一则头版新闻，标题为“Chancellor on brink of second bailout for banks”（财政大臣濒临第二次拯救银行）。该消息是中本聪试图为\
  \ Bitcoin 的推出提供理由。它向世界指出，当前的金融体系没有坚实的基础；它需要干预来维持，而这些干预是为了使某些企业（如大银行）受益的操纵行为，但没有来自银行家或政府的干预能为普通民众提供救济，许多人也因\
  \ 2008 年的大萧条而失业。中本聪设想 Bitcoin 作为一种替代方案，因为它提供了一个无干预的货币体系，由一组规则驱动，这组规则不能被一群人的意志所修改。\n\
  \n### 区块和索引\n\n`Bitcoin Core` 守护进程在运行时，会在默认目录 `~/.bitcoin` 下创建多个目录和文件。以下是文件和目录及其功能的列表：\n\
  \n![](img/124.jpg)\n\n**表 6.2：** Bitcoin Core 使用的文件和目录列表及其功能\n\n区块链相当庞大，这使得维护索引以提高新区块和交易验证效率以及共识规则要求的某些其他操作的效率变得必要。\n\
  \n### 区块头\n\nBitcoin 区块平均每 10 分钟生成一个。以下是区块头结构：\n\n![](img/Figure-6.6.jpg)\n\n**图\
  \ 6.6：** 区块头结构\n\n撰写本文时，区块高度为 `726556`。`bitcoin-cli` 通过以下命令给出最新验证的区块高度：\n\n![](img/Figure-6.7.jpg)\n\
  \n**图 6.7：** Bitcoin 区块链中的当前区块高度\n\n我们可以使用区块高度信息来获取区块哈希：\n\n![](img/Figure-6.8.jpg)\n\
  \n**图 6.8：** 从区块高度获取区块哈希\n\n\n\n由于我们知道区块头长度为 80 字节，因此可以使用区块哈希获取区块头。以下是通过读取区块内容的前\
  \ 80 字节获得的区块头：\n\n![](img/Figure-6.9.jpg)\n\n**图 6.9：** 使用 Bitcoin Core CLI 从区块哈希获取的区块头内容\n\
  \n如果我们对区块头的内容应用两次 sha256 算法进行哈希运算，就能得到区块哈希。以下程序演示了这一过程：\n\n```python\nimport hashlib\n\
  \nblk_b = bytes.fromhex('040020200a377a6ce7bfbd5efdbe087801fbef9a8a7b6815c3eb08000000000000000000ead1c751f9b4fedd1ff1ab37f7dccec13fc4cdfd6df4406fdd72cd44655fd2fa9389286273370a1739264fbc')\n\
  \nh1 = hashlib.sha256(blk_b).digest()\n\nh2 = hashlib.sha256(h1).digest()\n\nprint(h2[::-1].hex())\n\
