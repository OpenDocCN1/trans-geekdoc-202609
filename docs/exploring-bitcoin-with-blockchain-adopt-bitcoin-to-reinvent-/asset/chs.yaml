  \ 显示为该设备在班加罗尔挖矿计算出的当前月度挖矿利润\n\n### 内存池\n\n在比特币网络上广播的交易由每个节点验证，并存储在内存中的一种称为内存池的数据结构中。为了创建区块，矿工从内存池中选择交易。交易数量需要保持在一个限制内，使得区块大小不超过\
  \ 1MB 的区块大小限制。因此，矿工会从内存池中选择能给他们带来最大收益的交易。\n\n我们需要使用以下比特币客户端 API 来访问内存池数据：\n\n![](img/Figure-6.41.jpg)\n\
  \n**图 6.41：** 显示内存池交易列表的一部分\n\n以下是 API `getrawmempool` 的部分输出：\n\n![](img/Figure-6.42.jpg)\n\
  \n**图 6.42：** 显示单笔内存池交易的详细信息\n\n在这里，我们想要编写一个程序来选择内存池交易，以最大化矿工的手续费奖励。为了实现这一点，我们需要选择每字节聪\
  \ (satoshi/byte) 手续费最高的交易，因为我们只有 1 MB 的有限空间，如果一笔交易占用更多字节，它就需要支付更多费用才能被塞进有限的区块大小中。有时，交易输入本身就在内存池中。我们不能将依赖于仍在内存池中的比特币的交易添加到区块中。因此，我们需要确保如果一笔交易被添加到区块中，则其所有祖先交易（如果在内存池中）也被添加到该区块中。\n\
  \n在内存池 JSON 中，`ancestorcount` 包含当前交易本身，`descendantcount` 也是如此。此外，`depends` 是祖先列表，`spentby`\
  \ 是后代列表。\n\n为了编写一个选择交易以最大化收益的程序，我们可以使用以下算法：\n\n1.  通过包含其祖先交易的金额和字节数，计算内存池中所有交易的聪/字节\
  \ (satoshi/byte) 费率。\n2.  按聪/字节费率降序排序。\n3.  如果总大小超过 1MB，则排除该交易，并排除已包含在 1MB 内的交易的祖先交易。\n\
  4.  将祖先交易添加到列表中。\n\n以下程序列出了为矿工提供最高每字节比特币收益且总大小小于 1MB 的交易哈希：\n\n#### 导入所需包\n\n我们需要导入以下包：\n\
  \n```\nfrom bitcoinrpc.authproxy import AuthServiceProxy, JSONRPCException\nimport\
  \ json\nimport pandas as pd\nfrom pandas import DataFrame\n```\n\n\n\n\n### 比特币挖矿实现\n\
  \n#### 导入\n\n```python\nimport numpy as np\nimport copy\nimport hashlib\n```\n\n\
  #### 1. 从内存池获取交易并计算聪/字节\n\n```python\ndef findAllDependentTx(mempool: dict, k: str):\n\
  \    tx_l = [k]\n    vsize = mempool[k]['vsize']\n    fee = mempool[k]['fees']['base']\n\
  \    if len(mempool[k]['depends']) == 0:\n        return tx_l, vsize, fee\n    for\
  \ dependent in mempool[k]['depends']:\n        dep_tx_l, dep_vsize, dep_fee = findAllDependentTx(mempool,\
  \ dependent)\n        tx_l.extend(dep_tx_l)\n        vsize += dep_vsize\n      \
  \  fee += dep_fee\n    return tx_l, vsize, fee\n\ndef getMempoolTxList():\n    mempool\
  \ = rpc_connection.getrawmempool(True)\n    tx_l = []\n    for k, v in mempool.items():\n\
  \        dep_l, vsize, fee = findAllDependentTx(mempool, k)\n        dep_l.remove(k)\
  \  # remove itself from list of dependents\n        sats_per_byte = fee * 10**8\
  \ / vsize\n        tx_l.append({'txid': k, 'sats_per_byte': sats_per_byte, 'vsize':\
  \ vsize, 'depends': dep_l})\n    return tx_l, mempool\n```\n\n**程序 6.33：** 获取包含\
  \ vsize 和聪/字节的交易列表的程序\n\n#### 2. 按聪/字节对交易排序（降序）\n\n```python\ndef getSortedDF(tx_l:\
  \ list):\n    df = pd.DataFrame(tx_l)\n    df = df.sort_values(by=['sats_per_byte'],\
  \ ascending=False)\n    df = df.reset_index(drop=True)\n    return df\n```\n\n**程序\
  \ 6.34：** 基于聪/字节对交易列表进行排序的程序\n\n#### 3. 修剪超过 1MB 的交易并排除祖先交易\n\n```python\ndef pruneDF(df):\n\
  \    vsize = 0\n    mb = 1 << 20\n    inc_l = []\n    for index, row in df.iterrows():\n\
  \        if row['vsize'] + vsize > mb:\n            df.drop(index, inplace=True)\n\
  \        else:\n            if row['txid'] in inc_l:\n                df.drop(index,\
  \ inplace=True)\n                continue\n            inc_l.extend(row['depends'])\n\
  \            vsize += row['vsize']\n    return df, inc_l\n```\n\n**程序 6.35：** 基于聪/字节和\
  \ vsize 从列表中移除交易的程序\n\n#### 4. 将祖先交易添加到包含列表\n\n```python\ndef updateWithDepends(df,\
  \ depend_l: list, mempool):\n    tx_l = []\n    for dep in depend_l:\n        vsize\
  \ = mempool[dep]['vsize']\n        fee = mempool[dep]['fees']['base']\n        sats_per_byte\
  \ = fee * 10**8 / vsize\n        tx_l.append({'txid': dep,\n                   \
  \  'sats_per_byte': sats_per_byte,\n                     'vsize': vsize,\n     \
  \                'depends': []})  # ignore dependents\n    df2 = pd.DataFrame(tx_l)\n\
  \    df = df.append(df2, ignore_index=True)\n    return df\n```\n\n**程序 6.36：**\
  \ 将依赖交易添加到列表的程序\n\n#### 5. 主方法：获取新区块的最终交易列表\n\n```python\ndef getMempoolTx():\n\
  \    tx_l, mempool = getMempoolTxList()\n    df = getSortedDF(tx_l)\n    df, depend_l\
  \ = pruneDF(df)\n    df = updateWithDepends(df, depend_l, mempool)\n    final_tx_l\
  \ = df['txid'].tolist()\n    sum_vsize = 0\n    for tx in final_tx_l:\n        sum_vsize\
  \ += mempool[tx]['vsize']\n    print('sum_vsize = ', sum_vsize)\n    print('tx count\
  \ = ', len(final_tx_l))\n    return final_tx_l\n```\n\n**程序 6.37：** 获取要包含在新区块中的最终交易列表的程序\n\
  \n#### 6. 获取原始交易内容\n\n```python\ndef getRawTransaction(txid: str):\n    rawtx =\
  \ rpc_connection.getrawtransaction(txid)\n    return rawtx\n```\n\n**程序 6.38：**\
  \ 从交易 ID 获取原始交易的程序\n\n#### 7. 用于挖矿的区块头构建\n\n##### 版本\n\n```python\ndef getVersionBytes(supported_softfork_bits:\
  \ int):\n    version = 0x20000000 | supported_softfork_bits\n    v_bytes = bytes.fromhex(hex(version))[::-1]\n\
  \    return v_bytes\n```\n\n**程序 6.39：** 使用支持的软分叉位获取版本字节的程序\n\n##### 时间\n\n```python\n\
  def getTimeBytes():\n    t = int(time.time())\n    time_b = t.to_bytes(4, 'little')\n\
  \    return time_b\n```\n\n**程序 6.40：** 获取用于区块字段的时间字节的程序\n\n##### Bits（目标阈值计算）\n\
  \n目标阈值每 2016 个区块调整一次。数学公式为：\n\n![](img/c06eq-2.jpg)\n\n```python\ndef calculateNextTargetThreshold():\n\
  \    block_hash = rpc_connection.getblockhash(height)\n    block = rpc_connection.getblock(block_hash,\
  \ 0)\n    blkhdr = getBlockHeader(bytes.fromhex(block))\n    bits = bytes.fromhex(blkhdr['bits'])[::-1]\n\
  \    tt_old = getTargetThreshold(bits)\n    block_hash_2015 = rpc_connection.getblockhash(height\
  \ - 2015)\n    block_2015 = rpc_connection.getblock(block_hash_2015, 0)\n    blkhdr_2015\
  \ = getBlockHeader(bytes.fromhex(block_2015))\n    delta_t = blkhdr['time'] - blkhdr_2015['time']\n\
  \    tt_new = tt_old * delta_t // (2016 * 600)\n    return tt_new\n```\n\n**程序 6.41：**\
  \ 计算下一个目标阈值的程序\n\n##### 将目标阈值转换为 Bits（紧凑格式）\n\n转换遵循以下逻辑：\n1. 将目标阈值转换为字节（基数 256）。\n\
  2. 如果最高有效位 > `0x7F`，则在前面加上 `b'\\x00'`。\n3. 第一个字节 = 字节长度。\n4. 接下来的 3 个字节 = 数字的最高三个有效字节。\n\
  \n![](img/Figure-6.43.jpg)\n\n**图 6.43：** 目标阈值转换为 bits 的示意图\n\n```python\ndef targetThreshold2bits(tt:\
  \ int):\n    tt_b = tt.to_bytes((tt.bit_length() + 7) // 8, 'big')\n    print(tt_b.hex())\n\
  \    prepend = b'\\x00' if tt_b[0] > 0x7f else b''\n    tt_b = prepend + tt_b\n\
  \    b1 = bytes([len(tt_b)])\n    tt_b = tt_b + bytes(2)\n    tt_b = tt_b[0:3]\n\
  \    bits = b1 + tt_b\n    return bits\n```\n\n**程序 6.42：** 将目标阈值转换为 bits 的程序\n\n\
  ##### 根据区块高度获取 Bits\n\n```python\ndef getBits():\n    if height % 2016 != 0:\n \
  \       block_hash = rpc_connection.getblockhash(height)\n        block = rpc_connection.getblock(block_hash,\
  \ 0)\n        blkhdr = getBlockHeader(bytes.fromhex(block))\n        return bytes.fromhex(blkhdr['bits'])[::-1]\n\
  \    tt = calculateNextTargetThreshold()\n    bits = targetThreshold2bits(tt)\n\
  \    return bits\n```\n\n**程序 6.43：** 如果下一个区块高度是 2016 的倍数则返回目标阈值的程序\n\n### 结论\n\n\
  在本章中，我们从设置比特币软件和区块链同步开始。您学习了如何使用 Bitcoin Core CLI 和 Python RPC 客户端。您还研究了区块和索引的结构。您学习了如何从索引查询数据。我们编写了简短的程序来理解区块文件的结构，您还了解了内存池中的内容、其作用以及它如何被用于挖掘区块。\n\
  \n\n\n\n### 比特币具有变革性\n\n比特币具有变革性，因为它消除了任何交易中对中介的需求。因此，我们拥有一种表现得像现金一样的加密货币。这是许多密码学专家几十年来追求的目标。我们大多数人都知道这令人望而生畏。感觉我们仿佛在钻研火箭科学。但正如我们在本章中所见，这种想法只是一种心理障碍。比特币协议惊人地简单。本章是深入编程的第一章。我们仅使用了比特币软件客户端、区块文件、索引以及一点协议基础知识来增强您对比特币协议现有实现的理解。我们将某些重要主题（如交易脚本和隔离见证）留待后续章节讨论。\n\
  \n了解这样一项影响深远的技术可以轻松掌握，让我们对自己的能力建立了信心。它让我们相信自己能够理解事物。它消除了对专家的依赖，让我们能在自己内心找到专家。它从根本上改变了我们看待世界的方式。\n\
  \n在下一章中，您将了解比特币协议消息传递。您将理解比特币节点如何发现其他节点、与其连接、同步区块链，以及广播区块和交易。\n\n### 要点回顾\n\n* \
  \  `Bitcoin Core` 是由 Bitcoin Core 团队维护的最流行的比特币软件，最初由中本聪创建。\n*   区块平均每 10 分钟挖出一个。\n\
  *   比特币区块链中的每个区块都包含前一个区块的区块头哈希值。这使得区块链更像一个栈。\n*   区块头包含默克尔根哈希，它与工作量证明算法一起，保障了区块中所含交易的完整性。\n\
  *   工作量证明还保护其他区块头字段的完整性，如时间、版本、前一个区块哈希和目标阈值。\n*   区块版本表明矿工对协议升级（也称为软分叉）的支持和就绪状态。此类软分叉也称为矿工发起软分叉。\n\
  *   如果某项升级对比特币的未来至关重要，比特币开发者社区可以发起 `BIP 148` 并强制矿工转向软分叉。\n*   区块头哈希值应小于根据区块头中 bits\
  \ 字段计算出的目标阈值。\n*   目标阈值仅在区块链中每 2016 个区块调整一次。\n*   新目标阈值通过获取前 2016 个区块的出块时间来修改现有目标阈值进行计算，以使接下来的\
  \ 2016 个区块平均在 10 分钟内被挖出。\n*   区块存储在区块文件中，与区块文件和区块相关的信息存储在区块索引中。\n*   链状态数据库存储未花费交易输出\
  \ (UTXO)。\n*   区块索引和 UTXO 索引都有助于快速验证区块。\n*   还有一个称为交易索引或 `txindex` 的索引，比特币软件不使用它。它是可选的，存储与区块中存储的交易相关的索引。\n\
  *   挖矿是寻找 nonce 的过程，使得新创建的区块头哈希值小于目标阈值。\n*   比特币挖矿是一个昂贵的过程，就像商品开采中矿工需要投资勘探一样，在比特币挖矿中，矿工需要持续投资设备以保持生存能力。\n\
  *   独自挖矿仅适用于正在学习比特币的开发者，或希望通过将其算力贡献给整个网络算力来减少挖矿中心化的人。\n*   以盈利为目的的挖矿只能在矿池中进行。矿工会加入少数几个知名矿池之一。\n\
  *   矿池利用矿工的联合算力寻找 nonce。一旦找到 nonce，矿池会根据矿工的算力贡献向其支付报酬。\n\n### 问题\n\n1.  计算当前的比特币供应量。此外，计算当前比特币供应量占最大供应量的百分比。\n\
  2.  找出下一次比特币减半（区块奖励变为当前奖励的一半）的预计年份、月份和日期。\n3.  创建一张比特币挖矿设备、其成本和月利润的表格。\n4.  创建一张每个区块平均年度交易数量的表格。\n\
  5.  完成留下的未完成的独自挖矿程序。\n6.  判断正误：\n    1.  软分叉是不向后兼容的升级，这就是为什么矿工需要投票支持它。\n    2. \
  \ 即使比特币价格持续下跌，网络算力在长期来看也只能上升。\n    3.  内存池在内存中存储未确认的交易。\n7.  填空：\n    1.  经过 ______\
  \ 个区块后，矿工可以使用锁定在 Coinbase 交易中的比特币。\n    2.  交易数量 2,597 的压缩形式是 __________。\n    3.\
  \  0.25 BTC 的压缩形式是 ______。\n    4.  Bits 值 `0x1715a35c` 意味着目标阈值为 ______________。\n\
  \    5.  区块大小限制是 __________ MB。\n\n## 第 7 章：节点通信\n\n在上一章中，您了解了存储在节点中的数据结构及其验证、创建和版本控制方法。在本章中，我们将探究节点之间的通信。\n\
  \n比特币网络是一个点对点网络，没有主节点或服务器，也没有从节点或客户端。为了建立通信，会建立一个基于服务器-客户端模型的 TCP 连接。一旦连接建立，节点发起连接还是接受连接请求没有任何区别。TCP\
  \ 连接建立后，需要建立比特币网络连接。比特币网络是一个非常民主的网络，节点可以选择它们的对等节点。该决定取决于对等节点将提供的版本或服务。一旦双方达成一致，连接即建立，随后它们可以交换信息。\n\
  \n在几乎任何时候，都有近 10,000 个已知的活跃节点，这足以让大多数节点找到并选择多个合适的对等节点。\n\n作为一个开放的点对点网络，每个节点依赖其对等节点获取有关其他可用对等节点的信息，以便也能与它们连接。它还需要广播交易和区块，并帮助它们在网络中传播。此外，它需要使自己与网络保持同步，这意味着用最新的区块更新区块链，并用最新的交易更新内存池。它还需要验证交易和区块，并帮助\
  \ SPV 验证交易。\n\n在本章中，您将了解比特币网络拓扑、网络节点，以及这些节点如何相互通信的详细信息。\n\n### 结构\n\n本章将涵盖以下主题：\n\
  \n*   比特币网络拓扑\n*   节点引导\n*   网络消息传递\n    *   消息格式\n    *   建立连接\n    *   与非活跃对等节点断开连接\n\
  \    *   节点发现\n    *   接收完整区块链\n    *   同步区块链\n    *   交易广播\n    *   区块广播\n    \
  \    *   非请求区块推送\n        *   直接区块头公告\n        *   紧凑区块公告\n            *   高带宽紧凑区块公告\n\
  \            *   低带宽紧凑区块公告\n\n### 目标\n\n本章的目标是帮助您了解比特币网络，包括网络拓扑和节点通信，以及协议消息的演进过程。\n\
  \n\n\n\n### 比特币网络拓扑\n\n比特币网络允许运行不同版本代码的节点进行通信，并寻找接受其版本以及所提供或请求服务的对等节点。例如，一个节点可能是\
  \ SPV 节点，可能只需要与全节点通信。全节点可能对与 SPV 节点的连接不感兴趣，因此可能会断开连接。下图展示了节点的分布情况。我们可以看到，大多数节点位于美国和德国。\n\
  \n![](img/Figure-7.1.jpg)\n\n**图 7.1：** 全球节点分布示意图\n\n比特币节点通过 TCP 握手与其对等节点建立连接。它可以拥有\
  \ IPv4 或 IPv6 IP 地址。节点甚至可以通过 Tor 网络与其对等节点连接，Tor 是一个匿名网络，可保护节点免受监视和追踪。如果我们在系统的 9050\
  \ 端口运行 Tor，则我们的节点可以使用以下命令行选项通过 Tor 网络进行连接或接受连接：\n\n`-proxy=127.0.0.1:9050`\n\n下图显示了基于连接类型和地址类型的比特币网络连接分布：\n\
  \n![](img/Figure-7.2.jpg)\n\n**图 7.2：** 基于连接类型和地址类型显示节点分布的图表\n\n网络中有不同种类的节点，其中一些如下所示：\n\
  \n*   拥有完整区块链的全节点，也称为**归档节点**。\n*   验证所有区块但不维护完整区块链的全节点。它仍然是全节点，因为根据定义，全节点验证完整区块链，而该节点确实如此。这些也称为**修剪节点**。\n\
  *   SPV 节点仅维护包含所需交易的区块头链。它需要与全节点通信，后者可帮助其验证区块，但由于它不自行验证区块，因此也不转发交易。\n*   不与 SPV\
  \ 节点通信的全节点。\n*   仅接受区块而不接受交易的全节点。\n\n因此，节点之间存在相当多的变体。此外，它们可能运行不同版本的软件。可能存在攻击者节点或一组攻击者节点，网络或目标节点需要识别并将其列入黑名单。\n\
  \n### 节点引导\n\n正如你所了解的，比特币没有中心化服务器，因此寻找可连接的节点是一个挑战。为解决此问题，比特币核心硬编码了 DNS 种子节点地址。这些被称为**种子服务器**。这些服务器提供一份地址列表，这些地址可能处于活跃状态，也可能不活跃。我们需要迭代地查找可连接的活跃地址。种子服务器将来可能会更新。\n\
  \n以下是硬编码的 DNS 种子：\n\n![](img/187.jpg)\n\n**表 7.1：** 硬编码 DNS 种子列表\n\n我们将使用以下包从 DNS\
  \ 种子节点获取地址：\n\n![](img/Figure-7.3.jpg)\n\n**图 7.3：** 用于与 DNS 服务器通信的 Python 包\n\n\
  以下程序从 DNS 种子生成地址：\n\n```\nimport dns.name\nimport dns.message\nimport dns.query\n\
  import dns.flags\nimport ipaddress\n\ndef getNodeAddresses(dnsseed: str):\n    dest\
  \ = '8.8.8.8'\n    rdclass = 65535\n    domain = dns.name.from_text(dnsseed)\n \
  \   if not domain.is_absolute():\n        domain = domain.concatenate(dns.name.root)\n\
  \    request = dns.message.make_query(\n        domain,\n        dns.rdatatype.A,\n\
  \        dns.rdataclass.IN)\n    request.flags |= dns.flags.RD|dns.flags.RA|dns.flags.AD\n\
  \    request.find_rrset(request.additional, dns.name.root, rdclass, dns.rdatatype.OPT,\
  \ create=True, force_unique=True)\n    responseudp = dns.query.udp(request, dest)\n\
  \    rrset = responseudp.answer\n    rrset_l = []\n    for rrset_val in rrset:\n\
  \        rrset_l.extend(str(rrset_val).split(\"\\n\"))\n    ipaddr_l = []\n    for\
  \ rrset_s in rrset_l:\n        ipaddr_l.append(rrset_s.split(\" \")[4])\n    return\
  \ ipaddr_l\n\ndef getTestnetPeers():\n    port = 18333\n    dns_seeds = [\n    \
  \    \"testnet-seed.bitcoin.jonasschnelli.ch\",\n        \"seed.tbtc.petertodd.org\"\
  ,\n        \"seed.testnet.bitcoin.sprovoost.nl\",\n        \"testnet-seed.bluematt.me\"\
  \n    ]\n    ipaddr_l = []\n    for seed in dns_seeds:\n        ipaddr_l.extend(getNodeAddresses(seed))\n\
  \    peers = []\n    for ipaddr in ipaddr_l:\n        peers.append((ipaddr, port))\n\
  \    return peers\n```\n\n**程序 7.1：** 从 DNS 种子获取地址列表的程序\n\n我们按如下方式调用前面的方法，以获取前五个地址和端口号的列表：\n\
  \n```\nif __name__ == '__main__':\n    peers = getTestnetPeers()\n    for index\
  \ in range(5):\n        print(peers[index])\n```\n\n这将给出以下前五个 IP 地址和端口号：\n\n![](img/Figure-7.4.jpg)\n\
  \n**图 7.4：** 使用 DNS 种子生成的部分 IP 地址和端口号列表\n\n比特币核心源代码中也有硬编码的 IP 地址，仅在政府封锁了与已知 DNS\
  \ 种子的连接时，才作为最后的手段使用。这些地址位于以下文件中：\n\n`chainparamsseeds.h`\n\n比特币核心还维护 `peers.dat`\
  \ 文件，该文件维护其连接的活跃地址及连接时间。这有助于在连接中断后重新连接到节点。比特币核心守护进程还有一个 `addnode` 命令选项，用于指定用于连接的对等节点。该对等节点与其他对等节点享受同等待遇。\n\
  \n此信息特定于比特币核心。除了利用比特币节点引导方法外，我们还可以连接来自其他网站的地址，例如 `https://bitnodes.io/api/v1/snapshots/latest`。\n\
  \n以下代码从此 URL 获取节点列表：\n\n```\nimport requests\nimport socket\nfrom urllib.parse import\
  \ urlparse\n\ndef isValidIPv6Addr(addr: str):\n    try:\n        socket.inet_pton(socket.AF_INET6,\
  \ addr)\n    except socket.error:\n        return False\n    return True\n\ndef\
  \ parseNodeInfo(ip_port: str, nodeinfo: dict):\n    node = {}\n    node['selected']\
  \ = False\n    node['port'] = int(ip_port.split(':')[-1])\n    val = ip_port.rsplit(':',\
  \ 1)[0]\n    parsed = urlparse('//{}'.format(val))\n    addr = parsed.hostname\n\
  \    if isValidIPv6Addr(addr) == False:\n        return node\n    node['selected']\
  \ = True\n    node['ipaddr'] = addr\n    node['type'] = nodeinfo[11]\n    node['time']\
  \ = nodeinfo[2]\n    return node\n\ndef getMainnetPeers():\n    url = 'https://bitnodes.io/api/v1/snapshots/latest/'\n\
  \    headers = {'Accept': 'application/json'}\n    r = requests.get(url=url, headers=headers)\n\
  \    jsonobj = r.json()\n    peers = []\n    for k, v in jsonobj['nodes'].items():\n\
  \        node = parseNodeInfo(k, v)\n        if node['selected'] == True:\n    \
  \        peers.append(node)\n    return peers\n```\n\n**程序 7.2：** 使用外部 URL 获取节点列表的程序\n\
  \n我们按如下方式调用上述方法以获取对等节点：\n\n```\nif __name__ == '__main__':\n    peers = getMainnetPeers()\n\
  \    for peer in peers:\n        print('%s\\t\\t\\t%d' % (peer['ipaddr'], peer['port']))\n\
  ```\n\n这将给出以下前五个对等节点：\n\n![](img/Figure-7.5.jpg)\n\n**图 7.5：** 从外部网站获得的对等节点 IP 地址和端口号列表\n\
  \n##### 网络消息传递\n\n\n\n\n### 比特币网络消息传递\n\n比特币网络节点之间进行通信的原因多种多样，例如了解其他对等节点、确保连接仍处于活动状态、帮助其他节点与自身同步、请求缺失的区块，或广播新接收到的区块或交易。在本主题中，您将详细了解消息传递及其格式，并通过编写客户端来对其进行编程实现。\n\
  \n#### 消息格式\n\n网络上交换的消息包含消息头和载荷，载荷取决于命令类型。\n\n以下是消息格式：\n\n![](img/Figure-7.6.jpg)\n\
  \n**图 7.6：** 协议消息格式示意图\n\n以下是消息格式中各字段的解释：\n\n*   **Magic（魔数）** 与我们在 ***第 6 章、区块链、交易与挖矿***\
  \ 的区块结构中学到的相同，我们可以在 表 6.3 中查看其数值。\n*   **Command（命令）** 是以全零填充（即 `b'\\0'`）的 ASCII\
  \ 码形式发送的命令。\n*   **Length（长度）** 是载荷的长度。\n*   **Checksum（校验和）** 是载荷的校验和。\n*   **Payload（载荷）**\
  \ 是发送命令的参数。\n\n以下是创建此消息的方法：\n\n```\ndef createMessage(command, payload):\n    magic\
  \ = 0x0709110B\n    checksum = hashlib.sha256(hashlib.sha256(payload).digest()).digest()[0:4]\n\
  \    magic_b = struct.pack('<L', magic)\n    cmd_b = struct.pack('<12s', command.encode('ascii'))\n\
  \    payload_len_b = struct.pack('<L', len(payload))\n    checksum_b = struct.pack('<4s',\
  \ checksum)\n    msg = magic_b + cmd_b + payload_len_b + checksum + payload\n  \
  \  return msg\n```\n\n**程序 7.3：** 创建协议消息的方法\n\n#### 建立连接\n\n比特币通过首先交换版本信息，然后确认接受来建立连接。在确认版本之前，节点需要发送自己的版本。因此，网络握手过程如下所示：\n\
  \n![](img/Figure-7.7.jpg)\n\n**图 7.7：** 建立比特币连接的消息传输序列示意图\n\n以下是 `version`（版本）消息载荷结构：\n\
  \n![](img/Figure-7.8.jpg)\n\n**图 7.8：** 版本消息载荷结构\n\n以下是 `version` 消息各字段的解释：\n\n\
  *   `Version` 是主机上运行的协议版本。\n*   **Service（服务）** 是发送节点支持的服务。以下是服务代码列表：\n\n| **字节代码**\
  \ | **提供的服务** | **描述** |\n| --- | --- | --- |\n| 1 | NODE_NETWORK | 全节点 |\n| 2 |\
  \ NODE_GETUTXO | BIP 0064：支持 getutxos 和 utxos |\n| 4 | NODE_BLOOM | BIP 0111：支持布隆过滤器\
  \ |\n| 8 | NODE_WITNESS | BIP 0144：支持隔离见证 |\n| 1024 | NODE_NETWORK_LIMITED | BIP\
  \ 0159：修剪节点 |\n\n**表 7.2：** Version 消息所需的服务代码列表\n\n*   **Timestamp（时间戳）** 是载荷的 Unix\
  \ 纪元时间。\n*   **Addr Recv（接收方地址）** 是接收连接节点的地址。因此，发送 `version` 载荷的节点将拥有其正在连接的对等节点的地址和端口。Services\
  \ 字段通常设为全零。\n*   **Addr from（发送方地址）** 是发起连接节点的地址。因此，发送 `version` 载荷的节点将拥有自己的地址和端口。它还包括发送方提供的服务。\n\
  *   **Nonce（随机数）** 是一个随机数字，用于识别我们是否连接到了我们自己。\n*   **User Agent（用户代理）** 用于标识节点上运行的软件。它在\
  \ BIP-0014 中定义。\n*   **Start Height（起始高度）** 是节点区块链上的当前区块高度。\n*   **Relay（中继）** 是一个可选的布尔值，由\
  \ SPV 设置为 false，以指示该节点将不参与消息中继。这意味着它不希望对等节点通告带有 MSG_BLOCK 的 `inv` 消息。这可以防止节点被 `inv`\
  \ 消息淹没。这在 BIP 0037 中定义。\n\n以下是撰写时节点版本的分布情况：\n\n![](img/Figure-7.9.jpg)\n\n**图 7.9：**\
  \ 显示比特币网络上节点版本分布的图表\n\n以下是比特币网络中用户代理的分布情况：\n\n![](img/Figure-7.10.jpg)\n\n**图 7.10：**\
  \ 显示比特币网络中用户代理分布的柱状图\n\n以下是创建 `version` 载荷的程序：\n\n```\nfrom bitcoinrpc.authproxy\
  \ import AuthServiceProxy, JSONRPCException\nimport struct\nimport random\n\nrpc_connection\
  \ = AuthServiceProxy(\"http://%s:%s@127.0.0.1:18332\" % ('test', 'test'))\n\ndef\
  \ setVarInt(n: int):\n    if n < 0xfd:\n        n_h = '%02x' % n\n    elif n > 0xfd\
  \ and n < 0xffff:\n        n_h = 'fd%04x' % n\n    elif n > 0xffff and n < 0xFFFFFFFF:\n\
  \        n_h = 'fe%08x' % n\n    else:\n        n_h = 'ff%016x' % n\n    return\
  \ bytes.fromhex(n_h)\n\ndef getLastBlockHeight():\n    height = rpc_connection.getblockcount()\n\
  \    return height\n\ndef createUserAgent():\n    sub_version = \"/MyTestAgent:0.0.1/\"\
  \n    sub_version_b = sub_version.encode()\n    len_b = setVarInt(len(sub_version_b))\n\
  \    return len_b + sub_version_b\n\ndef createRecvIPAddress(ip, port):\n    service_b\
  \ = struct.pack('<Q', 1)\n    ip_b = socket.inet_aton(ip)\n    ipv4_to_ipv6 = bytearray.fromhex(\"\
  00000000000000000000ffff\") + ip_b\n    ipv6addr_b = struct.pack('>16s', ipv4_to_ipv6)\n\
  \    port_b = struct.pack('>H', port)\n    addr_b = service_b + ipv6addr_b + port_b\n\
  \    return(addr_b)\n\ndef createTransIPAddress():\n    service_b = struct.pack('<Q',\
  \ 1)\n    ip_b = socket.inet_aton(\"0.0.0.0\")\n    ipv4_to_ipv6 = bytearray.fromhex(\"\
  000000000000000000000000\") + ip_b\n    ipv6addr_b = struct.pack('>16s', ipv4_to_ipv6)\n\
  \    port_b = struct.pack('>H', 0)\n    addr_b = service_b + ipv6addr_b + port_b\n\
  \    return(addr_b)\n\ndef createVersionPayload(s: socket, version: int):\n    version_b\
  \ = struct.pack('<L', version)\n    services_b = struct.pack('<Q', 1)\n    timestamp_b\
  \ = struct.pack('<Q', int(time.time()))\n    myip, myport = s.getsockname()\n  \
  \  addr_recv_b = struct.pack('<26s', createRecvIPAddress(myip, myport))\n    addr_trans_b\
  \ = struct.pack('<26s', createTransIPAddress())\n    nonce_b = struct.pack('<Q',\
  \ random.getrandbits(64))\n    user_agent = createUserAgent()\n    user_agent_b\
  \ = struct.pack('<%ds' % len(user_agent), user_agent)\n    start_height_b = struct.pack('<L',\
  \ getLastBlockHeight())\n    payload = version_b \\\n        + services_b \\\n \
  \       + timestamp_b \\\n        + addr_recv_b \\\n        + addr_trans_b \\\n\
  \        + nonce_b \\\n        + user_agent_b \\\n        + start_height_b\n   \
  \ return payload\n```\n\n**程序 7.4：** 创建 Version 消息载荷的程序\n\n为了创建消息载荷，我们使用 Python\
  \ 的 `struct.pack`。以下是符号及其含义：\n\n| **符号** | **含义** |\n| --- | --- |\n| `<` | 小端序\
  \ |\n| `>` | 大端序 |\n| `B` | 1 字节无符号整数 |\n| `H` | 2 字节无符号整数 |\n| `L` | 4 字节无符号整数\
  \ |\n| `Q` | 8 字节无符号整数 |\n| `xs` | 大小为 x 的字节数组 |\n\n**表 7.3：** Python struct pack\
  \ 符号及其含义列表\n\n您可以查看 Python 文档以获取更多详情：\n\n[`docs.python.org/3.8/library/struct.html`](https://docs.python.org/3.8/library/struct.html)\n\
  \nIP 地址和端口采用大端序，而消息的其余部分采用小端序格式。当我们打包 ASCII 字符串时，它会将其转换为字节数组并用零进行填充。\n\n我们按如下方式调用上述方法：\n\
  \n```\nif __name__ == '__main__':\n    peers = getTestnetPeers()\n    p = random.choice(peers)\n\
  \    s = None\n    peerinfo = {}\n    print(\"Trying to connect to \", p)\n    s\
  \ = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n    err = s.connect(p)\n\
  \    print('TCP Connection Established')\n    payload = createVersionPayload(s,\
  \ 70015)\n    print('Version payload: ', payload.hex())\n    s.close()\n```\n\n\
  这将创建以下十六进制字符串形式的载荷：\n\n![](img/Figure-7.11.jpg)\n\n**图 7.11：** 显示由 CreateVersionPayload\
  \ 程序创建的版本载荷\n\n当我们接收到 `version` 消息时，我们会执行以下操作：\n\n\n\n\n#### 1. 接收消息头、验证魔数和校验和、识别命令\n\
  \n我们首先接收消息头，验证魔数和校验和，并识别命令：\n\n```python\nflog = open('communication.log', 'wt+')\n\
  \ndef calculateChecksum(b: bytes):\n    checksum = hashlib.sha256(hashlib.sha256(b).digest()).digest()[0:4]\n\
  \    return checksum\n\ndef checkMessage(msghdr: dict, payload_b: bytes):\n    if\
  \ msghdr['magic'] == '0709110b':\n        print('Magic check passed', file=flog)\n\
  \    else:\n        print('Magic check failed', file=flog)\n        print('magic\
  \ = %s' % msghdr['magic'], file=flog)\n        raise Exception('Invalid Magic',\
  \ file=flog)\n    checksum_calc = calculateChecksum(payload_b)\n    if msghdr['checksum']\
  \ == checksum_calc:\n        print('checksum check passed', file=flog)\n    else:\n\
  \        print('checksum check failed', file=flog)\n        print('payload = %s'\
  \ % payload_b.hex(), file=flog)\n        print('expected checksum = %s' % msghdr['checksum'].hex(),\
  \ file=flog)\n        print('received checksum = %s' % checksum_calc.hex(), file=flog)\n\
  \        raise Exception('Invalid Checksum')\n\ndef parseMsgHdr(msghdr_b: bytes):\n\
  \    msghdr = {}\n    msghdr['magic'] = msghdr_b[0:4][::-1].hex()\n    msghdr['command']\
  \ = msghdr_b[4:16].decode(\"ascii\").strip('\\0')\n    msghdr['length'] = int.from_bytes(msghdr_b[16:20],\
  \ byteorder='little')\n    msghdr['checksum'] = msghdr_b[20:24]\n    return msghdr\n\
  ```\n\n**程序 7.5：** 用于解析消息头的程序\n\n我们可以看到，程序校验和仅包含双重 SHA256 哈希的前 4 字节；为了获取命令，我们需要去除它。\n\
  \n#### 2. 接收消息并调用 `version` 载荷解析器\n\n接下来，我们再次从套接字接收消息，并调用 `version` 载荷的解析器。为此，我们按名称调用方法。我们将为后续程序不需要的方法创建虚拟方法：\n\
  \n```python\nMSGHDR_SIZE = 24\n\nCMD_FN_MAP = {\n    'version': parseVersionPayload,\n\
  \    'addr': parseAddrPayload,\n    'filterload': parseFilterLoadPayload,\n    'filteradd':\
  \ parseFilterAddPayload,\n    'merkleblock': parseMerkleBlockPayload,\n    'ping':\
  \ parsePingPongPayload,\n    'pong': parsePingPongPayload,\n    'feefilter': parseFeeFilterPayload,\n\
  \    'inv': parseInvPayload,\n    'getdata': parseInvPayload,\n    'notfound': parseInvPayload,\n\
  \    'tx': parseTxPayload,\n    'block': parseBlockPayload,\n    'getblocks': parseGetBlocksGetHeadersPayload,\n\
  \    'getheaders': parseGetBlocksGetHeadersPayload,\n    'headers': parseHeadersPayload,\n\
  \    'reject': parseRejectPayload,\n    'sendcmpct': parseSendCompactPayload,\n\
  \    'cmpctblock': parseCompactBlockPayload,\n    'getblocktxn': parseGetBlockTxnPayload,\n\
  \    'blocktxn': parseBlockTxnPayload\n}\n\ndef recvAll(s: socket, payloadlen: int):\n\
  \    payload_b = b''\n    length = payloadlen\n    while True:\n        recvd_b\
  \ = s.recv(length)\n        payload_b += recvd_b\n        if len(payload_b) == payloadlen:\n\
  \            break\n        length = payloadlen - len(payload_b)\n    return payload_b\n\
  \ndef recvMsg(s: socket):\n    msghdr_b = s.recv(MSGHDR_SIZE)\n    msg = parseMsgHdr(msghdr_b)\n\
  \    payloadlen = msg['length']\n    payload_b = recvAll(s, payloadlen)\n    checkMessage(msg,\
  \ payload_b)\n    payload_m = mmap.mmap(-1, payloadlen + 1)\n    payload_m.write(payload_b)\n\
  \    payload_m.seek(0)\n    msg['payload'] = {}\n    if payloadlen > 0:\n      \
  \  msg['payload'] = CMD_FN_MAP[msg['command']](payload_m, payloadlen)\n    print('<==\
  \ msg = %s' % msg, file=flog)\n    return msg\n```\n\n**程序 7.6：** 用于根据命令接收和处理消息的程序\n\
  \n#### 3. 解析 `version` 载荷\n\n以下代码解析 `version` 载荷：\n\n```python\nimport ipaddress\n\
  import datetime\n\ndef parseIPAddress(ip_m: mmap):\n    addr = {}\n    addr['service']\
  \ = int.from_bytes(ip_m.read(8), byteorder='little')\n    parseServices(addr['service'])\n\
  \    ip = ip_m.read(16)\n    if ip[0:12].hex() == \"00000000000000000000ffff\":\n\
  \        addr['version'] = 'IPv4'\n        addr['address'] = str(ipaddress.IPv4Address(ip[12:16]))\n\
  \    else:\n        addr['version'] = 'IPv6'\n        addr['address'] = str(ipaddress.IPv6Address(ip[0:16]))\n\
  \    addr['port'] = int.from_bytes(ip_m.read(2), byteorder='big')\n    return addr\n\
  \ndef parseServices(services: int):\n    service_l = []\n    if services == 0x00:\n\
  \        service_l.append('Unnamed')\n    if services & 0x01 == 0x01:\n        service_l.append('NODE_NETWORK')\n\
  \    if services & 0x02:\n        service_l.append('NODE_GETUTXO')\n    if services\
  \ & 0x04:\n        service_l.append('NODE_BLOOM')\n    if services & 0x08:\n   \
  \     service_l.append('NODE_WITNESS')\n    if services & 1024:\n        service_l.append('NODE_NETWORK_LIMITED')\n\
  \    print('Services: %d implies: %s' % (services, service_l), file=flog)\n\ndef\
  \ parseVersionPayload(payload_m: mmap, payloadlen: int):\n    payload = {}\n   \
  \ start = payload_m.tell()\n    payload['version'] = int.from_bytes(payload_m.read(4),\
  \ byteorder='little')\n    payload['services'] = int.from_bytes(payload_m.read(8),\
  \ byteorder='little')\n    parseServices(payload['services'])\n    payload['timestamp']\
  \ = int.from_bytes(payload_m.read(8), byteorder='little')\n    payload['dt'] = datetime.datetime.fromtimestamp(payload['timestamp']).strftime('%Y-%m-%d\
  \ %H:%M:%S')\n    payload['addr_recv'] = parseIPAddress(payload_m)\n    payload['addr_trans']\
  \ = parseIPAddress(payload_m)\n    payload['nonce'] = int.from_bytes(payload_m.read(8),\
  \ byteorder='little')\n    payload['user_agent_size'] = getVarInt(payload_m)\n \
  \   payload['user_agent'] = payload_m.read(payload['user_agent_size'])\n    payload['block_height']\
  \ = int.from_bytes(payload_m.read(4), byteorder='little')\n    if payload_m.tell()\
  \ - start != payloadlen:\n        payload['relay'] = int.from_bytes(payload_m.read(1),\
  \ byteorder='little')\n    return payload\n```\n\n**程序 7.7：** 用于解析 version 载荷的程序\n\
  \n比特币网络消息使用的变长整数格式与我们在 *第 6 章，区块链、交易与挖矿, 图 6.25* 中讨论的相同。\n\n`verack` 消息没有载荷。它是对接收到的\
  \ `version` 的确认。\n\n一旦发送并接收了 `version` 消息，且发送并接收了 `verack` 消息，我们就认为连接已建立，准备好发送和接收其他类型的消息。\n\
  \n以下是建立比特币连接的代码：\n\n```python\ndef sendVersionMessage(s: socket, version: int):\n\
  \    sndcmd = 'version'\n    payload = createVersionPayload(s, version)\n    sndmsg\
  \ = createMessage(sndcmd, payload)\n    s.send(sndmsg)\n    print('==> cmd = %s,\
  \ msg = %s' % (sndcmd, sndmsg.hex()), file=flog)\n    return True\n\ndef waitForVersion(s:\
  \ socket):\n    recvmsg = recvMsg(s)\n    vers_recvd = False\n    if recvmsg['command']\
  \ != 'version':\n        print('Invalid Response')\n        return False\n    services\
  \ = recvmsg['payload']['services']\n    if services & 1 == 0x00:\n        print('Peer\
  \ is not full node')\n        return False\n    return True\n\ndef sendVerackMessage(s:\
  \ socket):\n    sndcmd = 'verack'\n    payload = b''\n    sndmsg = createMessage(sndcmd,\
  \ payload)\n    s.send(sndmsg)\n    print('==> cmd = %s, msg = %s' % (sndcmd, sndmsg.hex()),\
  \ file=flog)\n    return True\n\ndef waitForVerack(s: socket):\n    recvmsg = recvMsg(s)\n\
  \    verack_recvd = False\n    if recvmsg['command'] != 'verack':\n        return\
  \ False\n    return True\n\ndef establishConnection(s: socket, version: int):\n\
  \    vers_sent = sendVersionMessage(s, version)\n    vers_recvd = waitForVersion(s)\n\
  \    if vers_recvd == False:\n        return False\n    verack_sent = sendVerackMessage(s)\n\
  \    verack_recvd = waitForVerack(s)\n    if vers_sent and vers_recvd and verack_sent\
  \ and verack_recvd:\n        print('Connection is established', file=flog)\n   \
  \     return True\n    return False\n```\n\n**程序 7.8：** 用于建立比特币连接的程序\n\n我们使用以下程序调用上述方法：\n\
  \n```python\nif __name__ == '__main__':\n    peers = getTestnetPeers()\n```\n\n\n\
