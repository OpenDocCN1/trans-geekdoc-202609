  \ Chain 等。我们忽略了率先开创智能合约的网络，即 Bitcoin。Bitcoin 是最安全的加密货币网络。由于智能合约和数字资产可能非常有价值，如果在技术上可行，在\
  \ Bitcoin 网络上保护它们可能是最佳选择。\n\n在本章中，我们将更深入地探讨脚本，并使用 Bitcoin 脚本语言为一些有用的智能合约构建用例。我们还将实现一些不是当事人之间合约但有助于解决实际需求的用例。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   脚本操作码\n*   数字资产\n    *   文档时间戳\n*   时间锁定交易\n\
  \    *   时间锁定支付\n    *   具有相对锁定时间的支付\n*   智能合约\n    *   支付中的信任问题解决方案\n        *\
