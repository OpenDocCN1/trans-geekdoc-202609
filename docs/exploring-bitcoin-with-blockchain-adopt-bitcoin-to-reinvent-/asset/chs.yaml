  \ stophash)\n            sndmsg = createMessage(sndcmd, payload)\n            s.send(sndmsg)\n\
  \            print('==> cmd = %s, msg = %s' % (sndcmd, sndmsg.hex()), file=flog)\n\
  \    if recvmsg['command'] == 'addr':\n        print('Received Addr', file=flog)\n\
