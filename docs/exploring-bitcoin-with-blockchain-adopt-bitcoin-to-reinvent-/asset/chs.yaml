  \n![](img/Figure-11.13.jpg)\n\n**图 11.13：** 获取中位时间\n\n此时间戳大于 1624196667：\n\n![](img/Figure-11.14.jpg)\n\
  \n**图 11.14：** 中位时间与日期的对比\n\n我们再次尝试发布交易：\n\n![](img/Figure-11.15.jpg)\n\n**图 11.15：**\
  \ 现在发布交易成功\n\n我们可以看到，在最新区块的中位时间戳不小于或等于锁定时间之前，该交易无效。\n\n#### 相对锁定时间的支付\n\n交易中的 `nLockTime`\
  \ 字段设置为静态区块高度或静态纪元时间。如果新创建的交易需要等待相对于依赖区块的区块计数或时间戳的时间或区块计数，则我们使用 `OP_CHECKSEQUENCEVERIFY`。\n\
  \n相对锁定时间合约是通过将 `OP_CHECKSEQUENCEVERIFY` 操作码作为脚本来实现的，因此我们使用带有赎回脚本的 P2SH。该操作码要求为相应的交易输入设置序列号。\n\
  \n相对锁定时间是一个软分叉，要求交易的版本号设置为 2。它还导致了 `nSequence` 评估方式的变化。\n\n软分叉之前：\n\n*   如果 `nSequence`\
  \ 为 `0xFFFFFFFE`，表示设置了 `nLockTime`。\n*   如果 `nSequence` 为 `0xFFFFFFFF`，表示未设置 `nLockTime`。\n\
  \n下图显示了软分叉后 `nSequence` 的评估方式：\n\n![](img/Figure-11.16.jpg)\n\n**图 11.16：** nSequence\
  \ 评估示意图\n\n以下是需要根据其设置序列值的条件：\n\n*   如果 `nSequence` > `0xEFFFFFFF`，则未定义，因此交易可以包含在任何区块中。\n\
  *   如果 `nSequence` <= `0xEFFFFFFF`，则第 22 位决定第 0-15 位表示区块高度还是时间戳。\n    *   如果第 22\
  \ 位被设置，则第 0-15 位表示区块高度。\n    *   如果第 22 位未被设置，则第 0-15 位表示中位时间。\n\n这在以下代码中实现：\n\n\
  ```\ndef getSequence(txn_struct: dict, i: int):\n    inp = txn_struct['inputs'][i]\n\
  \    if 'sequence_type' in inp:\n        if inp['sequence_type'] == 'time':\n  \
  \          sequence = inp['sequence'] | (1 << 22)\n        else:\n            sequence\
  \ = inp['sequence']\n        sequence_b = struct.pack('<L', sequence)\n    else:\n\
  \        if txn_struct['locktime'] > 0:\n            # sequence\n            sequence_b\
  \ = bytes([0xfe, 0xff, 0xff, 0xff])\n        else:\n            # sequence\n   \
  \         sequence_b = bytes([0xff, 0xff, 0xff, 0xff])\n    return sequence_b\n\
  ```\n\n**程序 11.3：** 计算 nSequence 的方法\n\n为了用相对锁定时间实现一个简单的用例，在我们的用例中，新创建的交易只能在资金交易确认后的\
  \ 105 个区块之后被挖掘。\n\n这是该交易的赎回脚本：\n\n```\n### 105 OP_CHECKSEQUENCEVERIFY OP_DROP\n\
  ### <Alice pubkey> CHECKSIG\n```\n\n这是该交易所需的操作码：\n\n`OP_CHECKSEQUENCEVERIFY = 0xb2`\n\
  \n`OP_DROP = 0x75`\n\n`OP_CHECKSIG = 0xac`\n\n以下代码用于生成赎回脚本十六进制代码：\n\n```\ndef createRedeemScript(pubkey_alice:\
  \ str):\n    redeem_script_b = bytes([0x01,\n        105, # after 105 blocks\n \
  \       OP_CHECKSEQUENCEVERIFY, OP_DROP])\n    pubkey_b = bytes.fromhex(pubkey_alice)\n\
  \    redeem_script_b += createVarInt(len(pubkey_b)) + pubkey_b\n    redeem_script_b\
  \ += bytes([OP_CHECKSIG])\n    return redeem_script_b\n```\n\n**程序 11.4：** 创建相对锁定时间赎回脚本的方法\n\
  \n我们按如下方式调用前述方法：\n\n```\nif __name__ == '__main__':\n    pubkey_alice = '037fadaea6edf196bf70af16cefb2bd3c830e54c0a6e9a00bf7806b241933547f7'\n\
  \    redeem_script_b = createRedeemScript(pubkey_alice)\n    print('redeem script\
  \ = %s' % redeem_script_b.hex())\n    sh = hash160(redeem_script_b)\n    address\
  \ = sh2address(sh)\n    print('P2SH address = %s' % address)\n```\n\n我们执行它并得到以下结果：\n\
  \n![](img/Figure-11.17.jpg)\n\n**图 11.17：** 生成相对时间锁的赎回脚本\n\n我们生成一个区块以支付给前述赎回脚本指示的合约，然后获取交易\
  \ ID：\n\n![](img/Figure-11.18.jpg)\n\n**图 11.18：** 相对时间锁资金交易的交易 ID\n\n我们现在使用以下代码创建一个新交易：\n\
  \n```\ndef createTransactionStruct():\n    txn = {}\n    txn['version'] = 2\n  \
  \  txn['input_count'] = 1\n    txn['inputs'] = []\n    input0 = {}\n    input0['prevtxn']\
  \ = \\\n        'e6a31b5c7e39a31bb12c68055c1dd6dcb6554d1546a8621e889f1026e10264c8'\n\
  \    input0['prevtxnindex'] = 0\n    input0['script_type'] = 'P2SH_RelativeTimeLock'\n\
  \    input0['privkeys'] = \\\n        ['L26JcHRhqEQv8V9DaAmE4bdszwqXS7tHznGYJPp7fxEoEQxxBPcQ']\n\
  \    input0['redeem_script'] = '0169b27521037fadaea6edf196bf70af16cefb2bd3c830e54c0a6e9a00bf7806b241933547f7ac'\n\
  \    input0['hash_type'] = SIGHASH_ALL\n    input0['sequence'] = 105\n    input0['sequence_type']\
  \ = 'block'\n    txn['inputs'].append(input0)\n    txn['out_count'] = 2\n    txn['outputs']\
  \ = []\n    output0 = {}\n    output0['satoshis'] = 10*(10**8)\n    output0['script_type']\
  \ = 'P2PKH'\n    output0['address'] = 'mxzmMmVycLDgAA48VtHDeh389eDAwiJqwQ'\n   \
  \ txn['outputs'].append(output0)\n    output1 = {}\n    output1['satoshis'] = 399999*(10**4)\n\
  \    output1['script_type'] = 'P2PKH'\n    output1['address'] = 'miSFmBeKXf5Wp7Luj46XTu3Yh57nAwhZAo'\n\
  \    txn['outputs'].append(output1)\n    txn['locktime'] = 0\n    return txn\n```\n\
  \n**程序 11.5：** 创建相对锁定时间交易的方法\n\n为了领取上一笔交易中的锁定资金，我们提供 `scriptSig`，它由所需的签名和赎回脚本组成。这是\
  \ `scriptSig` 的代码：\n\n```\ndef createScriptSigForRelTimeLock(signgrp: list, script_b:\
  \ bytes):\n    scriptSig_b = getWithPushdata(signgrp[0])\n    scriptSig_b += getWithPushdata(script_b)\n\
  \    return scriptSig_b\n```\n\n**程序 11.6：** 创建相对锁定时间 scriptSig 的方法\n\n在 *第 10 章，创建和验证交易*\
  \ 的 **“构建交易”** 主题下，我们定义了方法 `createSignedInput`。我们向该方法添加以下行以处理 *relative-timelock*\
  \ 脚本类型：\n\n```\nelif txn_input['script_type'] == 'P2SH_RelativeTimeLock':\n    scriptSig_b\
  \ = createScriptSigForRelTimeLock(signgrp, script_b)\n```\n\n我们执行代码并得到已签名的原始交易：\n\
  \n![](img/Figure-11.19.jpg)\n\n**图 11.19：** 创建相对时间锁交易的十六进制代码\n\n如果我们在挖出 105 个区块之前发布前述交易，会得到以下错误：\n\
  \n![](img/Figure-11.20.jpg)\n\n**图 11.20：** 在达到所需区块高度前发布相对时间锁交易\n\n\n\n一旦我们在输入交易之后挖出了\
  \ 105 个区块，就可以发布前一笔交易：\n\n![](img/Figure-11.21.jpg)\n\n**图 11.21：** 在达到所需区块高度后发布相对时间锁交易\n\
  \n##### 智能合约\n\n*智能合约* 是两方或多方之间的一种合约，以可执行计算机程序的形式编写。它仅在合约允许执行时才会执行，执行时遵循合约中定义的条件。\n\
  \n比特币提供了一种基于逆波兰表示法的原始脚本语言。该脚本不是图灵完备的，这意味着它无法解决所有计算问题。由于智能合约是以程序形式建模的合约，它们可能会变得更加复杂，包含循环和状态变量，而比特币脚本不允许这些。\n\
  \n它拥有大量可用于创建各种智能合约的操作码。即使有大量操作码，并非所有事情都能通过脚本完成。\n\n此外，比特币交易本身也对脚本施加了限制。而且由于比特币交易费是基于每\
  \ vByte 计算且相对较高，复杂且庞大的赎回脚本会使智能合约在经济上不可行。\n\n以下是比特币上智能合约的一些局限性：\n\n*   在一笔交易中，智能合约只能影响单个输入。\n\
  \    *   智能合约只能从一个具有固定价值的 UTXO 为交易提供资金。\n    *   交易输出无法根据智能合约进行修改。\n    *   输出脚本是标准的，只能是标准脚本之一，例如\
  \ `P2SH`、`P2PKH`、`OP_RETURN`、`P2PK` 或 `P2MS` 以及标准隔离见证脚本，我们将在下一章介绍。\n*   比特币脚本不是图灵完备语言，并且没有选项：\n\
  \    *   进行非确定性操作，如循环\n    *   作为状态机运行并根据其状态执行操作。\n*   比特币脚本局限于它提供的操作码。\n*   比特币上的脚本编写成本高昂，智能合约的复杂性也取决于其经济可行性。\n\
  \n### 支付中信任问题的解决方案\n\n我们知道，简单的支付方式是将比特币转账给接收方的地址。这可以通过手机钱包扫描二维码完成。这非常适合小额支付，但随着比特币价格上涨导致交易费增加，为低价商品付款在经济上已不可行。\n\
  \n对于大额支付，我们需要提高支付的安全性。我们将在以下子主题中逐个解决问题，从而提高支付的安全性。\n\n### 简单多重签名支付\n\n买方和卖方之间的 2-of-2\
  \ 多重签名是一种在受信任方需要依赖非受信任实体提供的服务时保障支付安全的方式。例如，考虑一家信誉良好的企业需要从一家不受监管的小供应商处获取服务。\n\n在这种情况下，企业将资金锁定在一个\
  \ 2-of-2 多重签名地址中，仅在收到小供应商的服务后才完成支付。锁定的资金充当企业和供应商之间的智能合约。这让小供应商确信他们会得到付款，因为大企业无法把钱拿回去。\n\
  \n### 使用相对时间锁改进支付\n\n上述支付用例的问题在于小供应商延迟提供所需服务。他们知道资金被锁定了，所以对自己的工作可能会有点马虎。\n\n为了解决这个问题，必须有一种方式让企业能够撤销支付。然而，企业不应能随意撤销支付。这可以通过相对时间锁来实现，让双方都知道比特币被锁定了，但有一个时间限制。如果供应商在规定时间内未完成服务，支付将被撤销。\n\
  \n通过下图可以理解该用例。这里，Alice 代表受信任的企业，Bob 代表一家不受信任的小供应商：\n\n![](img/Figure-11.22.jpg)\n\
  \n**图 11.22：** 使用相对时间锁改进支付\n\n为了实现这一点，我们使用带有以下赎回脚本的 P2SH 交易：\n\n```\n#IF\n### OP_2\
  \ <Alice 的公钥> <Bob 的公钥> OP_2 CHECKMULTISIG\n#ELSE\n### 105 CHECKSEQUENCEVERIFY DROP\n\
  ### <Alice 的公钥> CHECKSIG\n#ENDIF\n```\n\n在正常情况下（即无争议时），双方签名交易以支付给 Bob。如果发生争议，Alice\
  \ 等待超时，然后创建一笔由她自己的私钥签名的交易，将锁定金额转回她的地址。\n\n需要记住的一点是，一旦条件有效，它将永远有效。因此，如果 Alice 想给\
  \ Bob 额外的时间，她仍然可以这样做。\n\n创建赎回脚本所需的操作码如下：\n\n*   `OP_2 = 0x52`\n*   `OP_IF = 0x63`\n\
  *   `OP_ELSE = 0x67`\n*   `OP_ENDIF = 0x68`\n*   `OP_CHECKSEQUENCEVERIFY = 0xb2`\n\
  *   `OP_DROP = 0x75`\n*   `OP_CHECKMULTISIG = 0xae`\n*   `OP_CHECKSIG = 0xac`\n\n\
  赎回脚本用于生成合约地址，合约金额锁定在该地址。以下代码用于生成赎回脚本：\n\n```\ndef createRedeemScript2_2_seqcheck(pubkey_l:\
  \ list):\n    redeem_script_b = bytes([OP_IF, OP_2])\n    for pubkey in pubkey_l:\
  \ # Alice + Bob\n        pubkey_b = bytes.fromhex(pubkey)\n        redeem_script_b\
  \ += createVarInt(len(pubkey_b)) + pubkey_b\n    redeem_script_b += bytes([OP_2,\
  \ OP_CHECKMULTISIG])\n    redeem_script_b += bytes([OP_ELSE, 0x01,\n        105,\
  \ # 105 个区块后\n        OP_CHECKSEQUENCEVERIFY, OP_DROP])\n    pubkey_b = bytes.fromhex(pubkey_l[0])\
  \ # Alice 公钥\n    redeem_script_b += createVarInt(len(pubkey_b)) + pubkey_b\n  \
  \  redeem_script_b += bytes([OP_CHECKSIG, OP_ENDIF])\n    return redeem_script_b\n\
  ```\n\n**程序 11.7：** 带有相对时间锁的支付赎回脚本\n\n我们使用以下脚本调用该方法：\n\n```\nif __name__ == '__main__':\n\
  \    pubkey_l = ['037fadaea6edf196bf70af16cefb2bd3c830e54c0a6e9a00bf7806b241933547f7',\
  \ '02fcb1c7507db15576ab35cd7c9b1ea570141a8b81c9938dae0320392b0f7034d0']\n    redeem_script_b\
  \ = createRedeemScript2_2_seqcheck(pubkey_l)\n    print('redeem script = %s' % redeem_script_b.hex())\n\
  \    sh = hash160(redeem_script_b)\n    address = sh2address(sh)\n    print('P2SH\
  \ address = %s' % address)\n```\n\n调用该方法后，我们得到以下赎回脚本和地址：\n\n![](img/Figure-11.23.jpg)\n\
  \n**图 11.23：** 生成带有相对时间锁的支付赎回脚本\n\n我们生成一个区块以支付给该地址：\n\n![](img/Figure-11.24.jpg)\n\
  \n**图 11.24：** 生成支付赎回脚本的区块\n\n我们从区块哈希获取交易 ID：\n\n![](img/Figure-11.25.jpg)\n\n**图\
  \ 11.25：** 从生成的区块获取交易 ID\n\n我们再生成 100 个区块，以便这笔交易可用于支付。正如你所学，该合约有两种可能的结果。\n\n此外，`OP_CHECKSEQUENCEVERIFY`\
  \ 是一个软分叉，要求交易版本等于或大于 2。因此，在以下交易结构中，我们将使用版本 2：\n\n```\ndef createTransactionStruct():\n\
