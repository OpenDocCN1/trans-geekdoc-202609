  \ 从区块头字节获取区块头结构的程序\n\n我们按如下方式调用该方法：\n\n```python\nblkhdr = bytes.fromhex(\"040020200a377a6ce7bfbd5efdbe087801fbef9a8a7b6815c3eb08000000000000000000ead1c751f9b4fedd1ff1ab37f7dccec13fc4cdfd6df4406fdd72cd44655fd2fa9389286273370a1739264fbc\"\
  )\n\njsonobj = getBlockHeader(blkhdr)\n\nprint(json.dumps(jsonobj, indent = 4))\n\
  ```\n\n这将给出以下结果：\n\n![](img/Figure-6.11.jpg)\n\n**图 6.11：** 显示执行程序后得到的区块头结构\n\n\
  我们可以利用收集的信息进行进一步分析。\n\n#### 区块版本\n\n`version` 字段指示矿工对某项增强功能的支持。在比特币中，影响区块或交易验证共识规则且向后兼容（不导致链分裂）的协议增强被称为软分叉。比特币区块共识机制已从\
  \ `IsSuperMajority()` 或 ISM 变更为版本位。\n\n版本 1 到 4 称为 `IsSuperMajority()` 软分叉。在此共识系统中，若连续\
  \ 1,000 个区块中有 950 个激活了新版本，则该新版本生效。一旦激活发生，旧版本的区块将被拒绝。\n\n随着隔离见证的引入，比特币网络升级到了使用版本位的新共识机制。该机制在比特币改进提案\
  \ BIP-9 中提出。所有比特币改进提案的列表可在 [`github.com/bitcoin/bips`](https://github.com/bitcoin/bips)\
  \ 找到。版本位允许多个软分叉等待接受并最终部署。\n\n在此机制中，软分叉经历一个工作流。以下流程图展示了软分叉的生命周期。（来源 [`github.com/bitcoin/bips/blob/master/bip-0009.mediawiki`](https://github.com/bitcoin/bips/blob/master/bip-0009.mediawiki)）\n\
  \n![](img/Figure-6.12.jpg)\n\n**图 6.12：** 图片取自 BIP 9，展示软分叉工作流\n\n当开发者提出软分叉时，会在开发者论坛进行辩论并起草为\
  \ BIP。随着 BIP 实现的定义完成并准备好部署，软分叉进入“已定义”状态。此后，支持升级的矿工为升级做好准备。准备就绪的矿工通过设置相应的版本位来发出信号。此时，软分叉达到“已启动”状态，并需要在未来\
  \ 1 年内，在最近 2016 个区块中达到 95% 的支持率。如果软分叉在 1 年内未达到 95% 的接受度，则被视为失败并撤回，这意味着支持它的区块将被拒绝。如果软分叉达到\
  \ 95% 的接受度，则进入 `locked_in`（锁定）状态，并在 2016 个区块后成为规则。\n\n如果某项增强很重要但矿工社区未达成共识，开发者社区可以通过启用\
  \ BIP148 在特定区块强制执行变更。\n\n版本位设置了 `0x20000000`，任何其他被设置的位表示对某个软分叉提案的就绪状态。如果 Alice 提出升级且\
  \ 0x1 位代表她的软分叉，则支持并准备好升级的矿工会创建版本为 `0x20000001` 的区块。如果 Bob 也提出升级且 `0x4` 位代表他的软分叉，则矿工可以通过设置\
  \ 0x4 位（即 `0x20000100`）进行投票。如果矿工同时为两项升级投票，他们将设置两个位，因此版本将为 `0x20000101`。\n\n####\
  \ 前一个区块哈希\n\n在前面的程序中，我们获得了一个区块头结构，其中一字段为前一个区块哈希。我们可以通过查询 Bitcoin Core 软件，使用减 1 的区块高度来获取相同的区块哈希，如下所示：\n\
  \n![](img/Figure-6.13.jpg)\n\n**图 6.13：** 显示通过区块头和区块高度获得的前一个区块哈希并进行比较\n\n#### 时间戳\n\
  \n使用 time，我们可以通过以下 bash shell 命令获取区块的时间戳：\n\n![](img/Figure-6.14.jpg)\n\n**图 6.14：**\
  \ 显示从区块头 time 字段获得的日期时间\n\n#### 默克尔根\n\n要计算默克尔根，我们需要区块中的交易列表。我们通过以下 CLI 命令从区块结构中获取交易列表：\n\
  \n![](img/Figure-6.15.jpg)\n\n**图 6.15：** Bitcoin Core CLI 命令显示的区块结构\n\n正如您在 *第\
  \ 5 章，白皮书, 图 5.22* 中所学，默克尔根的哈希是通过反复哈希并连接连续的交易对来计算的。以下 Python 程序执行相同操作：\n\n```python\n\
  def hashOfJoinedStr(a:str, b:str):\n    # Reverse inputs before and after hashing\
  \ due to big-endian / little-endian nonsense\n    a1 = bytes.fromhex(a)[::-1]\n\
  \    b1 = bytes.fromhex(b)[::-1]\n    h = hashlib.sha256(hashlib.sha256(a1 + b1).digest()).digest()\n\
  \    return h\n\ndef buildMerkleRoot(hash_list: list):\n    if len(hash_list) <\
  \ 2:\n        return hash_list[0]\n    new_hash_list = []\n    # Process pairs.\
  \ For odd length, the last is skipped\n    for i in range(0, len(hash_list) - 1,\
  \ 2):\n        new_hash_list.append(hashOfJoinedStr(hash_list[i], hash_list[i +\
  \ 1])[::-1].hex())\n    # odd, hash last item twice\n    if len(hash_list) % 2 ==\
  \ 1:\n        new_hash_list.append(hashOfJoinedStr(hash_list[-1], hash_list[-1])[::-1].hex())\n\
  \    return buildMerkleRoot(new_hash_list)\n```\n\n**程序 6.3：** 从交易哈希构建默克尔根的程序\n\n\
  我们在代码中包含以下行以向 Bitcoin Core 服务器发起 RPC 调用：\n\n```python\nfrom bitcoinrpc.authproxy\
  \ import AuthServiceProxy, JSONRPCException\n\nrpc_connection = AuthServiceProxy(\"\
  http://%s:%s@127.0.0.1:8332\" % (<username>, <password>))\n```\n\n我们按如下方式调用上述方法：\n\
  \n```python\nif __name__ == '__main__':\n    block_hash = rpc_connection.getblockhash(715735)\n\
  \    block = rpc_connection.getblock(block_hash)\n    print('Merkle Root from RPC\
  \ call\\t = %s' % block['merkleroot'])\n    hash_merkle_root = buildMerkleRoot(block['tx'])\n\
  \    print('Calculated Merkle Root\\t = %s' % hash_merkle_root)\n```\n\n这将给出以下结果：\n\
  \n![](img/Figure-6.16.jpg)\n\n**图 6.16：** 程序执行显示计算出的默克尔根值与头部中的值相等\n\n#### Bits 和\
  \ Nonce\n\n\n\n\n#### Bits 字段解析\n\n下一个需要理解的字段是 **Bits**。Bits 是 **Target Threshold**（目标阈值）的压缩表示形式。区块哈希必须小于\
  \ Target Threshold，该区块才会被接受为有效区块。\n\n以下是解压缩公式：\n\n* `b[1] b[2] b[3] b[4]`：Bits 的四个字节\n\
  * Target Threshold `T = b[2] b[3] b[4] * 256^(b[1] - 3)`\n\n让我们验证一下高度为 `715735`\
  \ 的下一个区块，其区块哈希是否小于目标阈值。\n\n* `h`：Block Hash（区块哈希）\n* `T`：Target Threshold（目标阈值）\n\
  \n```text\nh = 0000000000000000004db407202aff54e9ace0efb72588bb73a2beebb248c28\n\
  b[1] b[2] b[3] b[4] = 170b98ab\nb[1] = 0x17, b[2] = 0x0b, b[3] = 0x98, b[4] = 0xab\n\
  T = 0x0b98ab * 256^(0x17 - 0x03)\n  ⇒ T = 0x0b98ab * 256^(0x14)\n```\n\n区块有效的条件是\
  \ `T` > `h`。\n\n以下程序将 Bits 转换为 Target Threshold：\n\n```python\ndef getTargetThreshold(bits:\
  \ bytes):\n    shift = bits[3]\n    value = int.from_bytes(bits[0:3], byteorder='little')\n\
  \    target_threshold = value * 2 ** (8 * (shift - 3))\n    return target_threshold\n\
  ```\n\n**Program 6.4:** 将区块头中的 Bits 转换为 Target Threshold 的程序\n\n以下代码调用该方法并验证区块哈希是否具有所需的工作量证明：\n\
  \n```python\nbits = bytes.fromhex(\"170b98ab\")[::-1]\ntarget_threshold = getTargetThreshold(bits)\n\
  print('Target Threshold = %x' % target_threshold)\nblock_hash = 0x00000000000000000004db407202aff54e9ace0efb72588bb73a2beebb248c28\n\
  print('Block Hash = %x' % block_hash)\nprint('Valid' if target_threshold > block_hash\
  \ else 'Invalid')\n```\n\n运行结果如下：\n\n![](img/Figure-6.17.jpg)\n\n**Figure 6.17:**\
  \ 显示从区块头中的 Bits 计算得出的 Target Threshold 值\n\n##### 序列化区块\n\n比特币序列化区块包含除区块头和交易之外的字段。这些字段包括：\n\
  \n*   **Magic Number**（魔数）\n*   **Block Size**（区块大小）\n\n以下是序列化区块的示意图：\n\n![](img/Figure-6.18.jpg)\n\
  \n**Figure 6.18:** 展示序列化区块的结构\n\n##### Magic Number\n\n区块哈希是区块头的哈希值。Magic Number\
  \ 是网络的标识符。如果一个节点连接到同一个对等节点以服务于多个不同的币种网络，区块魔数可以充当标识符，该节点将不必为多个网络验证区块共识规则，从而提高效率。\n\
  \n用于转账比特币的公共比特币网络也称为 `mainnet`。此外还有用于测试的 `testnet` 和 `regtest` 网络。这些网络中的每一个都定义了各自的魔数和不同的端口号以连接对等节点。\n\
  \n![](img/133.jpg)\n\n**Table 6.3:** 显示不同比特币网络分配的魔数和 TCP 端口\n\n##### Block File\n\
  \nBitcoin Core 以区块文件的形式在目录中存储区块链，每个区块文件以二进制格式包含多个区块。区块文件的表示如下：\n\n![](img/Figure-6.19.jpg)\n\
  \n**Figure 6.19:** 区块文件结构示意图\n\n我们可以利用序列化区块中的区块大小来解析区块文件中的所有区块。这有助于跳过两个区块之间可能存在的垃圾字符。区块文件总是以序列化区块的开头开始，因此我们知道前\
  \ 4 个字节代表魔数。从区块索引中，我们可以获取区块文件的区块数量。\n\n为了使用键从 LevelDB 索引中访问值，我们需要了解它们的结构。正如我们所了解的，LevelDB\
  \ 是一个在文件系统中存储数据的二进制键值数据库。Bitcoin 利用 LevelDB 存储多个值，有时也存储多个键。为了存储可变长度的键和值，Bitcoin\
  \ 使用了一种可变长度整数格式编码。在这种编码中，如果一个字节的最高有效位被设置，则下一个字节也包含在内。\n\n编码过程为：将 7 位存储在字节数组中，从数字中移除，然后减\
  \ 1。重复此过程直到该位变为零。除最后一个字节外，所有字节的最高有效位均被设置。\n\n![](img/Figure-6.20.jpg)\n\n**Figure\
  \ 6.20:** 展示 b128 varint 编码机制的示意图\n\n以下是编码器的实现：\n\n```python\ndef b128_varint_encode(n:\
  \ int):\n    l = 0\n    b = []\n    while True:\n        # Take 7 bits and set MSB\
  \ if not last byte\n        b.append((n & 0x7F) | (0x80 if l != 0 else 0x00))\n\
  \        if n <= 0x7F:\n            break\n        n = (n >> 7) - 1\n        l +=\
  \ 1\n    return bytes(bytearray(b[::-1]))\n```\n\n**Program 6.5:** 将数字编码为 b128 varint\
  \ 的程序\n\n以下代码解码可变长度整数：\n\n```python\ndef b128_varint_decode(b: bytes, pos=0):\n\
  \    n = 0\n    while True:\n        data = b[pos]\n        pos += 1\n        #\
  \ unset MSB bit\n        n = (n << 7) | (data & 0x7f)\n        if data & 0x80 ==\
  \ 0:\n            return (n, pos)\n        n += 1\n```\n\n**Program 6.6:** 将 b128\
  \ varint 解码为整数的程序\n\n运行上述代码，我们得到以下编码和解码的整数对：\n\n![](img/136.jpg)\n![](img/137.jpg)\n\
  \n**Table 6.4:** b128 varint 编码数字示例\n\n为了解析区块文件中的区块，我们需要从区块索引获取区块文件信息。区块文件索引包含以下信息：\n\
  \n*   `count`：存储在区块文件中的区块数量\n*   `filesize`：区块文件大小（字节）\n*   `undofilesize`：撤销文件大小（字节）\n\
  *   `lowest`：包含从此区块高度开始的区块\n*   `highest`：包含至此区块高度的区块\n*   `lowest_timestamp`：包含从此区块时间戳开始的区块\n\
  *   `highest_timestamp`：包含至此区块时间戳的区块\n\n以下代码从区块索引获取区块文件信息：\n\n```python\nblock_db_g\
  \ = plyvel.DB(os.getenv('BLOCK_INDEX_DB'), compression=None)\nblocks_path_g = os.getenv('BLOCKS_PATH')\n\
  \ndef getBlockFileIndex(n_file: int, block_db):\n    key = b'f' + (n_file).to_bytes(4,\
  \ byteorder='little')\n    value = block_db.get(key)\n    jsonobj = {}\n    jsonobj['count'],\
  \ pos = b128_varint_decode(value)\n    jsonobj['filesize'], pos = b128_varint_decode(value,\
  \ pos)\n    jsonobj['undofilesize'], pos = b128_varint_decode(value, pos)\n    jsonobj['lowest'],\
  \ pos = b128_varint_decode(value, pos)\n    jsonobj['highest'], pos = b128_varint_decode(value,\
  \ pos)\n    jsonobj['lowest_timestamp'], pos = b128_varint_decode(value, pos)\n\
  \    jsonobj['highest_timestamp'], pos = b128_varint_decode(value, pos)\n    return\
  \ jsonobj\n```\n\n**Program 6.7:** 查询 Block DB 以获取区块文件索引的程序\n\n我们使用以下参数调用此方法：\n\n\
  ```python\nblk_index = getBlockFileIndex(138, block_db_g)\n```\n\n在执行上述程序之前，我们需要设置以下环境变量：\n\
  \n*   `BITCOIN_HOME`：Bitcoin 工作目录的路径。\n*   `BLOCK_INDEX_DB`：默认为 `$BITCOIN_HOME/blocks/index`\n\
  *   `BLOCKS_PATH`：默认为 `$BITCOIN_HOME/blocks/`\n*   `CHAINSTATE_DB`：默认为 `$BITCOIN_HOME/chainstate`\n\
  *   `TX_INDEX_DB`：默认为 `$BITCOIN_HOME/indexes/txindex`\n\n运行结果如下：\n\n![](img/Figure-6.21.jpg)\n\
  \n**Figure 6.21:** 显示通过运行程序获得的区块文件索引结构\n\n现在，利用上述信息，我们编写了以下代码来解析区块文件：\n\n```python\n\
  def parseSerialisedBlock(block_f):\n    serialized_blk = {}\n    serialized_blk['magic_num']\
  \ = block_f.read(4)[::-1].hex()\n    serialized_blk['blk_size'] = int.from_bytes(block_f.read(4),\
  \ byteorder='little')\n    serialized_blk['version'] = block_f.read(4)[::-1].hex()\n\
  \    prev_blkhash_b = block_f.read(32)\n    serialized_blk['prev_blkhash'] = prev_blkhash_b[::-1].hex()\n\
  \    serialized_blk['merkle_root_hash'] = block_f.read(32)[::-1].hex()\n    serialized_blk['time']\
  \ = int.from_bytes(block_f.read(4), byteorder='little')\n    serialized_blk['bits']\
  \ = block_f.read(4)[::-1].hex()\n    serialized_blk['nonce'] = block_f.read(4)[::-1].hex()\n\
  \    return serialized_blk\n```\n\n**Program 6.8:** 获取包含魔数和区块大小的区块头的程序\n\n\n\n\n\
  我们遍历区块文件，使用从前面的方法获得的区块信息查找文件中的所有区块：\n\n```python\nif __name__ == '__main__':\n \
  \   n_file = 138\n    block_filepath = os.path.join(blocks_path_g, 'blk%05d.dat'\
  \ % n_file)\n    block_f = open(block_filepath, 'rb')\n    blk_index = getBlockFileIndex(n_file,\
  \ block_db_g)\n    print(blk_index)\n    for i in range(blk_index['count']):\n \
  \       # moves file pointer to the end of block header\n        serialized_blk\
  \ = parseSerialisedBlock(block_f)\n        next_blk_loc = block_f.tell() - 80 +\
  \ serialized_blk['blk_size']\n        block_f.seek(next_blk_loc)\n        print('serialized_blk\
  \ = %s' % serialized_blk)\n```\n\n以下是区块文件中前两个区块的信息：\n\n![](img/Figure-6.22.jpg)\n\
  \n**图 6.22：** 显示区块文件中的前两个区块及该文件的其他信息\n\n这种解析方法在为索引重新扫描区块时很有用。\n\n### 使用区块索引进行区块遍历\n\
  \nLevelDB 索引在多方面都很有帮助。它们有助于更快地验证区块和交易。我们可以用它们来遍历区块链，这在需要解析固定数量的区块时（例如软分叉部署）非常有用。在其他情况下，使用区块文件编号和区块文件索引遍历区块链是一种更高效的方法。\n\
  \n下图显示了区块遍历的步骤：\n\n![](img/Figure-6.23.jpg)\n\n**图 6.23：** 使用 LevelDB 索引遍历区块文件的方法示意\n\
  \n我们需要记住一点：区块文件中的区块并不总是按顺序排列的，这意味着我们始终需要使用区块头中的前一个区块哈希来获取前一个区块的位置。\n\nChainstate\
  \ 数据库是经过编码的，这与其他数据库不同。这是因为过去 chainstate 数据库中的字符序列曾触发杀毒软件。在这种编码方法中，每个字节都与 `obfuscate-key`\
  \ 中的字节进行异或运算。`obfuscate key` 存储在 chainstate 数据库中，键为 `b'\\x0e\\x00'`。\n\n以下代码将混淆键应用于所有字节并返回解码后的\
  \ chainstate 值：\n\n```python\ndef getObfuscationKey(chainstate_db):\n    value =\
  \ chainstate_db.get(b'\\x0e\\x00' + b'obfuscate_key')\n    print('obfuscation key\
  \ = %s' % value)\n    obfuscation_key = value[1:]\n    return obfuscation_key\n\n\
  def applyObfuscationKey(data: bytes, chainstate_db):\n    obfuscation_key = getObfuscationKey(chainstate_db)\n\
  \    new_val = bytes(data[index] ^ obfuscation_key[index % len(obfuscation_key)]\
  \ for index in range(len(data)))\n    return new_val\n```\n\n**程序 6.9：** 使用混淆键解码\
  \ Chainstate LevelDB 的程序\n\n现在，我们有足够的理解来遍历区块链。让我们看看如何做到这一点：\n\n**步骤 1：** 从 chainstate\
  \ 数据库查询最后一个区块哈希。\n\n**步骤 2：** 在区块索引数据库中查询区块哈希以获取区块索引。\n\n**步骤 3：** 区块索引包含区块位置的信息。利用该信息，我们读取正确的区块文件或撤销文件，并从偏移位置读取数据以获取区块数据。\n\
  \n**步骤 4：** 从区块数据中，我们获取前一个区块的区块哈希，然后重复步骤 2-4。\n\n以下是从区块索引数据库获得的区块索引信息：\n\n*   `version`：客户端的版本号（不是区块版本）。\n\
  *   `height`：区块高度。\n*   `status`：指示其包含的数据类型。可能是 `BLOCK_HAVE_DATA` 或 `BLOCK_HAVE_UNDO`，指示它是正向修补还是反向修补\
  \ chainstate 数据。\n*   `txcount`：区块中的交易数量。\n*   `n_file`：包含该区块的区块文件编号。\n*   `data_pos`：数据区块的字节位置。\n\
  *   `undo_pos`：撤销区块的字节位置。\n*   `header`：区块头内容。\n\n在上述信息中，我们遇到了通过撤销区块进行反向修补的情况。要理解这一点，我们需要知道比特币区块链中的区块可能会竞争下一个位置。这是因为矿工可能几乎在同一时间挖出一个区块，随后其中一个区块会被接受，因为竞争链中的一条会变得更长。当这种情况发生时，撤销区块被用来反向修补\
  \ chainstate 索引。\n\n以下是使用 LevelDB 索引遍历区块链的代码：\n\n1.  获取 LevelDB 数据库：\n\n    ```python\n\
  \    block_db_g = plyvel.DB(os.getenv('BLOCK_INDEX_DB'), compression=None)\n   \
  \ chainstate_db_g = plyvel.DB(os.getenv('CHAINSTATE_DB'), compression=None)\n  \
  \  ```\n\n2.  从 chainstate 数据库获取最后一个区块哈希：\n\n    ```python\n    def getRecentBlockHash(chainstate_db):\n\
  \        key = b'B'\n        block_hash_b = chainstate_db.get(key)\n        block_hash_b\
  \ = applyObfuscationKey(block_hash_b, chainstate_db)\n        return block_hash_b\n\
  \    ```\n\n    **程序 6.10：** 从 Chainstate DB 获取最近区块的程序\n\n3.  从区块索引数据库获取区块索引：\n\n\
  \    ```python\n    BLOCK_HAVE_DATA = 8\n    BLOCK_HAVE_UNDO = 16\n\n    def getBlockIndex(block_hash_b:\
  \ bytes, block_db):\n        key = b'b' + block_hash_b\n        value = block_db.get(key)\n\
  \        jsonobj = {}\n        jsonobj['version'], pos = b128_varint_decode(value)\n\
