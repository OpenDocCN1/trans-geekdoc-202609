  \ 执行 Python 程序显示 P2SH_P2WSH 脚本有效\n\n我们了解到，通过对 P2PKH/P2SH 交易验证程序进行简单修改，我们也可以验证隔离见证交易。我们仍然没有学习如何为签名验证创建正确的消息，因此我们将在下一个主题中探讨这一点。\n\
  \n##### 签名验证\n\n在本节中，我们将理解 BIP 143 以创建正确的签名预映像。所有具有相同 sighash 类型的隔离见证交易都具有相同的签名预映像创建方法。\n\
  \n签名预映像具有以下结构：\n\n![](img/Figure-12.17.jpg)\n\n**图 12.17：** 隔离见证交易的签名预映像结构\n\n预映像的每个部分定义如下：\n\
  \n考虑到，\n\n*   **TxIDprev**：上一笔交易的 TxID\n*   **TxOutIndexprev**：输入中上一笔交易的输出索引\n*\
  \   **output**：交易的输出\n*   **‖**：拼接\n*   **Hash256**：双重 SHA256 哈希\n\n对于 sighash 类型\
  \ `SIGHASH_ALL`，我们有签名预映像每个部分的以下定义：\n\n*   `hashPrevouts = Hash256(‖(TxID_prev∥ TxOutIndex[prev]\
  \ ))`\n*   `hashSequence = Hash256(‖(nSequence))`\n*   `outpoint = TxID[prev] TxOutIndex[prev]`\n\
  *   `scriptCode = 正在执行的脚本`\n*   `hashOutputs = Hash256(‖(output))`\n\n我们利用这些信息修改\
  \ 第 10 章，创建和验证交易 中编写的 P2SH 交易验证方法，以包含隔离见证交易。具体操作如下：\n\n```\ndef setVarInt(n: int):\n\
  \    if n < 0xfd:\n        n_h = '%02x' % n\n    elif n > 0xfd and n < 0xffff:\n\
  \        n_h = 'fd%04x' % n\n    elif n > 0xffff and n < 0xFFFFFFFF:\n        n_h\
  \ = 'fe%08x' % n\n    else:\n        n_h = 'ff%016x' % n\n    return bytes.fromhex(n_h)\n\
  \ndef getAmountFromPrevout(prev_tx_hash_b: bytes, prev_tx_out_index_b: bytes):\n\
  \    prevtx = findTransaction(prev_tx_hash_b, txindex_db_g)\n    prevtx_outindex\
  \ = int.from_bytes(prev_tx_out_index_b, byteorder='little')\n    prevAmount = prevtx['outs'][prevtx_outindex]['satoshis']\n\
  \    amount_b = struct.pack(\"<Q\", prevAmount)\n    return amount_b\n\ndef createMsgForSigForSegwit(tx:\
  \ dict, script_b: bytes, inp_index: int, sighash_type: int):\n    version_b = bytes.fromhex(tx['version'])[::-1]\n\
  \    inp_cnt = tx['inp_cnt']\n    prevouts_b = b''\n    sequences_b = b''\n    for\
  \ i in range(inp_cnt):\n        tx_inp = tx['inputs'][i]\n        prev_tx_hash_b\
  \ = bytes.fromhex(tx_inp['prev_tx_hash'])[::-1]\n        prev_tx_out_index_b = struct.pack('<L',\
  \ tx_inp['prev_tx_out_index'])\n        sequences_b += struct.pack('<L', tx_inp['sequence'])\n\
  \        prevouts_b += prev_tx_hash_b + prev_tx_out_index_b\n        if i == inp_index:\n\
  \            outpoint_b = prev_tx_hash_b + prev_tx_out_index_b\n            print('script\
  \ = ', script_b.hex())\n            scriptCode_b = bytes.fromhex('%x' % len(script_b))\
  \ + script_b\n            amount_b = getAmountFromPrevout(prev_tx_hash_b, prev_tx_out_index_b)\n\
  \            sequence_b = struct.pack('<L', tx_inp['sequence'])\n    out_cnt = tx['out_cnt']\n\
  \    outputs_b = b''\n    for o in range(out_cnt):\n        tx_out = tx['outs'][o]\n\
  \        satoshis_b = struct.pack('<Q', tx_out['satoshis'])\n        bytes_scriptpubkey_b\
  \ = setVarInt(tx_out['bytes_scriptpubkey'])\n        scriptpubkey_b = bytes.fromhex(tx_out['scriptpubkey'])\n\
  \        outputs_b += satoshis_b + bytes_scriptpubkey_b + scriptpubkey_b\n    locktime_b\
  \ = struct.pack('<L', tx['locktime'])\n    hashPrevouts_b = hash256(prevouts_b)\n\
  \    hashSequence_b = hash256(sequences_b)\n    hashOutputs_b = hash256(outputs_b)\n\
  \    hashType_b = struct.pack('<L', sighash_type)\n    msg_b = version_b + hashPrevouts_b\
  \ + hashSequence_b + outpoint_b + scriptCode_b + amount_b + sequence_b + hashOutputs_b\
  \ + locktime_b + hashType_b\n    return msg_b\n```\n\n**程序 12.11：** 为隔离见证交易创建签名预映像\n\
  \n如果交易具有隔离见证，则从以下 `sigcheck` 方法调用该方法：\n\n```\ndef uncompressPubkey(pubkey_b: bytes):\n\
  \    pubkey_P = PublicKey.decode(pubkey_b)\n    pubkey_b = PublicKey.encode(pubkey_P,\
  \ compressed=False)\n    return pubkey_b\n\ndef sigcheck(sig_b: bytes, pubkey_b:\
  \ bytes,\n             script_b: bytes, inp_index: int, tx: dict):\n    sighash_type\
  \ = sig_b[-1]\n    if tx['is_segwit'] == True:\n        msg_b = createMsgForSigForSegwit(tx,\
  \ script_b, inp_index, sighash_type)\n    else:\n        msg_b = createMsgForSig(tx,\
  \ script_b, inp_index, sighash_type)\n    print('sig = %s' % sig_b.hex())\n    print('pubkey\
  \ = %s' % pubkey_b.hex())\n    print('msg = %s' % msg_b.hex())\n    msg_h = hashlib.sha256(msg_b).digest()\n\
  \    print('msg_h = %s' % msg_h.hex())\n    prefix = pubkey_b[0:1]\n    if prefix\
  \ == b\"\\x02\" or prefix == b\"\\x03\":\n        fullpubkey_b = uncompressPubkey(pubkey_b)[1:]\n\
  \    elif prefix == b\"\\x04\":\n        fullpubkey_b = pubkey_b[1:]\n    rs_b =\
  \ getRandSFromSig(sig_b)\n    print('rs = %s' % rs_b.hex())\n    vk = ecdsa.VerifyingKey.from_string(fullpubkey_b,\
  \ curve=ecdsa.SECP256k1)\n    if vk.verify(rs_b, msg_h, hashlib.sha256) == True:\n\
  \        print(\"Signature is Valid\")\n        return b'\\x01'\n    else:\n   \
  \     print(\"Signature is not Valid\")\n        return b'\\x00'\n```\n\n**程序 12.12：**\
  \ 验证隔离见证交易中的签名\n\n对于其他 sighash 类型，我们使用以下数学表达式：\n\n*   **对于 sighash 类型 SIGHASH_NONE：**\n\
  \    *   `hashPrevouts = Hash256(‖(TxID[prev] TxOutIndex[prev] ))`\n    *   `hashSequence\
  \ = 32 字节的零值`\n    *   `hashOutputs = 32 字节的零值`\n*   **对于 sighash 类型 SIGHASH_SINGLE：**\n\
  \    *   `hashPrevouts = Hash256(‖(TxID[prev] TxOutIndex[prev] ))`\n    *   `hashSequence\
  \ = 32 字节的零值`\n    *   `hashOutputs = Hash256(output[inputindex] )`\n*   **对于 sighash\
  \ 类型 SIGHASH_ALL|SIGHASH_ANYONECANPAY：**\n    *   `hashPrevouts = 32 字节的零值`\n  \
  \  *   `hashSequence = 32 字节的零值`\n    *   `hashOutputs = Hash256(‖(output))`\n*\
  \   **对于 sighash 类型 SIGHASH_NONE|SIGHASH_ANYONECANPAY：**\n    *   `hashPrevouts\
  \ = 32 字节的零值`\n    *   `hashSequence = 32 字节的零值`\n    *   `hashOutputs = 32 字节的零值`\n\
  *   **对于 sighash 类型 SIGHASH_SINGLE|SIGHASH_ANYONECANPAY：**\n    *   `hashPrevouts\
  \ = 32 字节的零值`\n    *   `hashSequence = 32 字节的零值`\n    *   `hashOutputs = Hash256(output[inputindex]\
  \ )`\n\n正如我们已经学会为 `SIGHASH_ALL` 创建签名预映像，我们可以同样使用上述信息为其他 sighash 类型构建预映像。\n\n###\
  \ 地址格式与生成\n\n隔离见证引入了一种基于 bech32 算法的更短地址格式。BIP 173 提供了比特币隔离见证寻址中使用的 bech32 格式的信息。以下是\
  \ bech32 相对于非隔离见证交易中使用的 base58check 算法的几个优势：\n\n*   Base58 在二维码中需要大量空间，因为它无法使用*字母数字模式*。\n\
  *   Base58 中的大小写混合使得可靠地记录、在手机键盘上输入或大声朗读变得不便。\n*   双重 SHA256 校验和速度慢且没有错误检测保证。\n\n\
  \n\n\n大多数关于错误检测码的研究仅适用于字符集大小为素数幂的情况，而 58 不是。\n\nBase58 解码既复杂又相对缓慢。\n\nbech32 字符串最长\
  \ 90 个字符，由以下部分组成：\n\n*   **人类可读部分** 用于向读者传达数据类型或其他任何相关信息。此部分必须包含 1-83 个 US-ASCII\
  \ 字符，每个字符的值在 `[33-126]` 范围内。特定应用可能会进一步限制 HRP 的有效性。\n*   **分隔符** 始终为 `1`。如果 `1` 允许出现在人类可读部分中，则字符串中的最后一个\
  \ `1` 为分隔符。\n*   **数据部分** 至少 6 个字符长，仅由字母数字字符组成，不包括 `1`、`b`、`i` 和 `o`。\n\n我们将使用以下\
  \ Python 库进行 bech32 编码和解码：\n\n![](img/Figure-12.18.jpg)\n\n**图 12.18：** 新 Segwit\
  \ 地址所需的 PIP 包\n\n正如我们所了解的，在原生 SegWit 交易中，`previous scriptPubKey` 具有以下格式：\n\n`<1-byte\
  \ witness version> <2-40 bytes witness program>`\n\n当前版本为 0，对于 P2WPKH，见证程序为 20 字节；对于\
  \ P2WSH，见证程序为 32 字节。\n\n以下是我们在前面章节中讨论的原生 P2WPKH 交易示例中的 previous scriptPubkey：\n\n\
  `Previous scriptPubkey: 0x0014122bf8b77dceee01c0fa1f2b36d155fea2a5b016`\n\n`=> witness\
  \ version = 0x00`\n\n`=> witness program size = 0x14 = 20-bytes`\n\n`=> witness\
  \ program = 0x122bf8b77dceee01c0fa1f2b36d155fea2a5b016`\n\n以下程序对见证程序进行编码并打印地址：\n\
  \n```\nimport bech32\n\nwitprog = bytes.fromhex('122bf8b77dceee01c0fa1f2b36d155fea2a5b016')\n\
  witver = 0x00\nhrp = 'bc'\naddress = bech32.encode(hrp, witver, witprog)\nprint(address)\n\
  ```\n\n**程序 12.13：** 为原生 SegWit 地址生成 bech32 地址\n\n在上述程序中，`hrp` 代表 **human-readable-part**。以下是对应网络的\
  \ HRP 代码：\n\n| **HRP codes** | **Network** |\n| --- | --- |\n| bc | Mainnet |\n\
  | tb | Testnet |\n| tb | Regtest |\n\n**表 12.1：** 比特币网络的 HRP 代码\n\n运行程序后，我们得到以下地址：\n\
  \n![](img/Figure-12.19.jpg)\n\n**图 12.19：** 从私钥生成的 bech32 地址\n\n我们可以通过使用 Bitcoin\
  \ Core 客户端在区块链中查看对应的交易来检查地址是否正确。以下是 `txid 6f7184d3b59adf06290686c6e4f7b7aeb0e7c869f05ca04d10a4b1636277fc40`\
  \ 的输出索引 1：\n\n![](img/Figure-12.20.jpg)\n\n**图 12.20：** 显示交易输出中的 bech32 地址\n\n现在，我们将为原生\
  \ P2WSH 执行相同操作。我们使用前面章节示例中使用的 P2WSH 交易，其中：\n\n`Previous scriptPubkey = 0020d0862d6e40d240ea1711f6d897f5e7b07e974a593704077edffb7b67fd34b091`\n\
  \n因此，\n\n`witness version = 0x00`\n\n`=> witness program size = 0x20 = 32-bytes`\n\
  \n`=> witness program =`\n\n`0xd0862d6e40d240ea1711f6d897f5e7b07e974a593704077edffb7b67fd34b091`\n\
  \n这是获取对应 P2WSH 的 bech32 地址的程序：\n\n```\nwitprog = bytes.fromhex('d0862d6e40d240ea1711f6d897f5e7b07e974a593704077edffb7b67fd34b091')\n\
  witver = 0x00\nhrp = 'bc'\naddress = bech32.encode(hrp, witver, witprog)\nprint(address)\n\
  ```\n\n这将给我们以下地址：\n\n![](img/Figure-12.21.jpg)\n\n**图 12.21：** 从私钥生成的 bech32 地址\n\
  \n在上述程序中，我们查看的是 `txid` 索引 0 处的前一个 `txid`：\n\n`dffe1dc8f36cbc39c0f40b090912c5a00da13e3534f97aec0ef5bfe552019897`\n\
  \n通过使用 Bitcoin Core 客户端查看前一个 `txid` 的 `outindex`，我们得到以下 previous scriptPubkey 和对应地址：\n\
  \n![](img/Figure-12.22.jpg)\n\n**图 12.22：** 显示交易输出中的 bech32 地址\n\n以下是解密 bech32 地址的代码：\n\
  \n```\nwitver, witprog_l = bech32.decode(address[:2], address)\nwitprog_b = bytes(witprog_l)\n\
  scriptpubkey_b = bytes([witver]) + bytes([len(witprog_b)]) + witprog_b\nprint('scriptpubkey\
  \ = ', scriptpubkey_b.hex())\n```\n\n**程序 12.14：** 解码 bech32 地址以获取 scriptpubkey\n\
  \n使用它来解码以下执行中 P2WPKH 的 bech32 地址：\n\n![](img/Figure-12.23.jpg)\n\n**图 12.23：** 解码\
  \ bech32 地址以获取 scriptpubkey\n\n并使用它来解码以下执行中 P2WSH 的 bech32 地址：\n\n![](img/Figure-12.24.jpg)\n\
  \n**图 12.24：** 解码 bech32 地址以获取 scriptpubkey\n\n这标志着本章的结束，我们很可能已经涵盖了隔离见证增强的所有方面。\n\
  \n### 结论\n\n在本章中，您了解了隔离见证增强。您学习了它为何重要以及它对整个比特币的影响。此外，您还了解了随此增强发生的几项变更，例如我们改变了查看网络增强的方式。本章涵盖了新的地址编码算法，并教您如何编码和解码地址。您学习了验证\
  \ SegWit 引入的新标准交易脚本，了解了交易结构，并验证了它们及签名。\n\n在下一章中，我们将介绍闪电网络，它既是比特币的一部分，又是一个独立的发展。它是一个第二层协议，可以提供比特币设计上所缺乏的速度。这是可扩展性方面的一项重要发展。\n\
  \n### 要点回顾\n\n*   比特币最初存在多个交易延展性漏洞。\n*   BIP62 是解决交易延展性问题的原始变通方案，实现起来很繁琐。\n*   交易延展性使得未确认交易即使对交易签名者也是不可靠的。\n\
  *   隔离见证通过将签名移出交易 ID 计算解决了所有交易延展性问题。不参与交易 ID 计算的部分称为见证数据。\n*   隔离见证作为软分叉实施。\n* \
  \  SegWit 激活遵循 BIP 9。\n*   创建了 BIP 148，以便在算力多数不激活与隔离见证相关的 BIP（即 BIP 141、BIP 143\
  \ 和 BIP 147）时强制部署 SegWit。这是首次使用 **用户激活软分叉** (**UASF**) 来强制功能激活。\n*   UASF 是由经济多数而非算力多数强制执行的激活规则。\n\
  *   隔离见证 Merkle 根是通过获取区块中所有交易的完整交易哈希、在哈希前添加 32 字节零并计算 Merkle 根来得出的。\n*   计算出的隔离见证\
  \ Merkle 根哈希与 witness-reserve-value（由矿工在币基交易的第一个输入中提供）拼接后的哈希决定了 commitment-hash，它位于币基交易的输出之一中。\n\
  *   SegWit 允许区块大于 1 MB，因为见证数据中的字节按其大小的四分之一计算。因此，比特币软件改变了计算字节的方式。在这种计算中，大小保持在 1 MB\
  \ 以内，即使实际大小可能超过 1 MB。\n*   使用隔离见证创建交易可减少所需的网络费用。\n*   SegWit 引入了四种新的标准脚本：P2WPKH、P2WSH、P2SH-P2WPKH\
  \ 和 P2SH-P2WSH。\n*   原生 SegWit 脚本哈希和公钥哈希使用 bech32 编码。\n*   SegWit 地址具有可扩展的方案，包含版本，当前版本为\
  \ 0。\n*   SegWit 交易签名使用与非 SegWit 交易不同的消息格式生成。此消息格式定义在 BIP143 中。\n\n### 问题\n\n\n\n\
  \n1. 计算包含 1 个输入和 1 个输出的 P2PKH、P2SH-P2WPKH 和 P2WPKH 交易的近似 vsize。对比它们并确定使用 SegWit\
  \ 交易节省的百分比。\n\n2. 计算包含 1 个输入和 1 个输出的 2-2 多签 P2SH、P2SH-P2WSH 和 P2WSH 交易的近似 vsize。对比它们并确定使用\
  \ SegWit 交易节省的百分比。\n\n3. 编写程序以创建交易：\n\n    1. 编写一个程序来创建 P2WPKH 交易。\n\n    2. 编写一个程序来创建\
  \ P2WSH 交易。\n\n    3. 编写一个程序来创建 P2SH-P2WPKH 交易。\n\n    4. 编写一个程序来创建 P2SH-P2WSH 交易。\n\
  \n4. 填空：\n\n    1. BIP ______ 包含强制执行与 SegWit 相关的 BIP 的 UASF 细节。\n\n    2. 在 SegWit\
  \ 之前，BIP ________ 为交易延展性漏洞提供了一种变通方法。\n\n    3. 交易延展性漏洞的根源在于，对于一笔交易，______________\
  \ 可以不同但仍然有效。\n\n5. 判断正误：\n\n    1. SegWit 软分叉激活后，非 SegWit 交易变得无效并被网络拒绝。\n\n    2.\
  \ BIP 148 在比特币网络上取代了 BIP 9 激活方式。\n\n    3. Bech32 编码生成字母数字字符，意味着大写或小写字母和/或数字。\n\n\
  ### 第 13 章\n\n##### 闪电网络\n\n在上一章中，您了解了一项名为 `隔离见证` 的重要增强功能。该增强功能通过将签名移出交易 ID 计算，消除了交易延展性的可能性。这一改进通过增强安全性，帮助了交易所和钱包。\n\
  \n该增强功能还开启了安全链下交易的可能性，从而促成了 `闪电网络` 等第二层协议的发展。\n\n在本章中，我们将介绍最成功的第二层协议，称为 `闪电网络`。`闪电网络`\
  \ 基于通过添加双方资金来创建通道并执行链下交易。这最初是由 `中本聪` 本人构想的。后来在 2015 年，`Thaddeus Dryja` 和 `Joseph\
  \ Poon` 在一篇题为 **比特币闪电网络** 的论文中首次提出了该概念。该论文可在以下网址公开获取：\n\n[`lightning.network/lightning-network-paper.pdf`](https://lightning.network/lightning-network-paper.pdf)\n\
  \n在 `SegWit` 于 2017 年 10 月激活几个月后，`Lightning Labs` 于 2018 年 3 月推出了 `闪电网络` 的测试版。\n\
  \n`闪电网络` 通过在 `闪电` 节点通道上路由支付来工作。网络越广泛，用户体验越好。因此，其增长呈抛物线状，开始缓慢，现在迅速。为了帮助技术发展，一位化名的\
  \ Twitter 用户于 2019 年 1 月发起了 `闪电火炬`。它基于奥运会接力赛的概念。它相当成功，持续了 4 个月，但除此之外，全球范围内的采用仍然缓慢。\n\
  \n情况在 2021 年发生了变化，这得益于 `Bitcoin Beach`（一个冲浪社区）两年多的工作，以及 `Jack Mallers` 在 `萨尔瓦多`\
  \ 推出 `闪电网络` 钱包 `strike`。此后，在 `萨尔瓦多` 总统 `Nayib Bukele` 的支持下，`比特币` 获得了法定货币地位。此外，政府推出了\
  \ `闪电网络` 钱包 `Chivo`，覆盖了 `萨尔瓦多` 全国一百多万人。从那时起，`闪电网络` 的采用迅速增长。\n\n2021 年，`Twitter`\
  \ 也集成了 `闪电` 支付。\n\n`闪电网络` 是构建基于 `比特币` 的循环经济的关键要素。在本章中，您将了解是什么让 `闪电网络` 如此特别。\n\n\
