  \n11. 判断正误：\n\n     1.  **区块链** 不需要让交易关联价值。\n     2.  **比特币脚本语言** 不支持 **智能合约**。\n\
  \     3.  **硬件钱包** 包含加密货币，丢失它们意味着丢失所有存储的货币。\n\n## 第 2 章：比特币概述\n\n在上一章中，您对 **比特币**\
  \ 和 **区块链** 生态系统有了基本的了解。您还学习了技术领域中常用的基本术语。\n\n在本章中，您将了解是什么促成了 **比特币** 的发展，发生了哪些发展，以及成功与失败的经历。然后，我们将探究过去\
  \ 13 年发生了什么，即重要的里程碑有哪些，哪些重要成就帮助 **比特币** 变得流行，以及哪些事件阻碍了 **比特币** 的采用。\n\n随后，您将了解什么是\
  \ **比特币**，它解决了什么问题，如何解决该问题，以及解决该问题的影响规模。我们将进而理解为什么理解 **比特币** 很重要，以及了解它如何帮助我们。\n\n\
  您还将了解赋予 **比特币** 价值的特性。\n\n### 结构\n\n在本章中，我们将讨论以下主题：\n\n*   学习 **比特币** 的理由\n*   通往\
  \ **比特币** 的发展历程\n*   **比特币** 的崛起\n*   定义 **比特币**\n    *   拜占庭将军问题\n    *   **比特币**\
  \ 作为拜占庭将军问题的解决方案\n    *   **比特币** 作为数字资产的特性\n\n### 目标\n\n本章的主要目标是为学习 **比特币** 建立理由。我们希望读者在后续章节深入技术细节之前，能充分理解\
  \ **比特币** 作为一个概念。\n\n为了让读者充分理解 **比特币**，他们需要了解其成长历程和成就。因此，在本章中，我们将学习 **比特币** 的历史以及促成\
  \ **比特币** 发展的技术。我们还将理解 **比特币** 的价值主张。\n\n读完本章后，读者将知道为什么学习 **比特币** 很重要。\n\n### 学习比特币的理由\n\
  \n现在，我们对 **DLT** 生态系统在 13 年间变得多么庞大有了很好的认识。因此，可能会产生一个问题：“如果 **分布式账本技术** 已经发展到如此地步，为什么我们还要学习一项过时的技术？”\n\
  \n尽管存在如此多的加密货币，**比特币** 在某些方面仍处于领先地位，例如：\n\n*   **比特币** 网络是最安全的网络，因为挖矿算力为其安全性做出了贡献。\n\
  *   与所有其他加密货币甚至代币相比，**比特币** 拥有最高的市场占有率。\n*   由于 **比特币** 没有已知的创建者，它可以被认为比任何其他加密货币或代币项目都更加去中心化。\n\
  *   **比特币** 的改进流程相当严格，这意味着只有当大多数利益相关者完全确信某项功能时，改进才会被接受。这意味着只有符合 **比特币** 特性的最佳功能才会被采纳。\n\
  *   **比特币** 网络是受监控最多的加密货币网络，这充当了早期预警系统，可在灾难性事件发生前检测异常。\n*   **比特币** 网络拥有加密货币领域最大的开发者基础之一，仅次于\
  \ **以太坊**。\n*   **比特币** 作为最古老的加密货币，相较于其他加密货币具有优势。它经历了各种攻击，如技术、社会和政治层面的攻击。因此，它在全球领袖中建立了声誉，并成为对冲基金经理、顶级上市公司、政府等最广泛接受的加密货币之一。\n\
  \n现在可能已经清楚，**比特币** 并未过时且发展良好，但我们仍需了解为什么学习 **比特币** 很重要。\n\n\n\nAs mentioned earlier,\
  \ Bitcoin is the oldest cryptocurrency, and therefore its code has been adopted\
  \ by most cryptocurrencies. Bitcoin is the foundation of most other cryptocurrencies\
  \ and blockchains. This means it can help you understand the internal workings of\
  \ other cryptocurrencies and blockchain technologies. This may help you understand\
  \ Ethereum, Hyperledger, or other popular technologies, providing better opportunities\
  \ for software engineers and entrepreneurs.\n\nUnderstanding Bitcoin's internals\
  \ also helps secure your cryptocurrency investments; understanding its long-term\
  \ value encourages you to hold long-term and avoid panic buying and selling.\n\n\
  ### The Road to Bitcoin\n\nSatoshi Nakamoto is a genius, but he/she was not the\
  \ first person to create or conceive of a cryptocurrency. He built a cryptocurrency\
  \ superior to earlier implementations and attracted the right talent to develop\
  \ it together. Bitcoin is the culmination of all developments in the world of cryptography.\n\
  \nThe following is a timeline of progress in the field of cryptography, along with\
  \ the centralized and decentralized currency experiments that occurred along the\
  \ way:\n\n![](img/Figure-2.1.jpg)\n\n**Figure 2.1:** Cryptographic development history\
  \ leading to Bitcoin\n\nIn November 1976, `Whitefield Diffie` and `Martin E. Hellman`\
  \ published a paper titled *New Directions in Cryptography*. The paper proposed\
  \ a method involving two keys: one for encrypting messages, which is public and\
  \ can be shared with others; the other for decrypting messages, which is private\
  \ and kept secure by the key owner. The paper also introduced the concept of digital\
  \ signatures. It stated that, just like a physical signature, a digital signature\
  \ would be attached to a document, creatable by the signature owner, and verifiable\
  \ by anyone for content and signatory.\n\nThis concept later led to the first implementation\
  \ proposed in 1978, in a paper titled *A Method for Obtaining Digital Signatures\
  \ and Public-Key Cryptosystems*, authored by `R.L. Rivest`, `A. Shamir`, and `L.\
  \ Adleman`. Today, RSA and other asymmetric public-key encryption algorithms are\
  \ widely used for transmitting secrets and securing internet connections via SSL.\n\
  \nIn 1980, `Ralph C. Merkle` published a paper titled *Protocols for Public Key\
  \ Cryptosystems*. This paper is important because it proposed a method for verifying\
  \ the integrity of individual elements in a message through iterative hashing, which\
  \ you will learn about later. This is known as the `Merkle Tree root`. It helps\
  \ the Bitcoin blockchain by ensuring the integrity of transactions within a block.\n\
  \nIn 1982, `David Chaum` published a paper titled *Blind Signatures for Untraceable\
  \ Payments*. This paper attempted to solve privacy issues related to digital payments.\
  \ `David Chaum` foresaw the dangers of digital payments, while today we know financial\
  \ privacy is crucial. He launched the first cryptocurrency, DigiCash, in 1989, which\
  \ was quite successful at the time. However, it failed due to a lack of decentralization.\n\
  \nIn 1985, `Victor S. Miller` published a paper titled *Use of Elliptic Curves in\
  \ Cryptography*, explaining how elliptic curves over finite fields could be used\
  \ for public-key cryptography. Bitcoin uses digital signatures combined with elliptic\
  \ curve cryptography.\n\nNotably, the Bitcoin whitepaper cites 8 references, 3 of\
  \ which are papers written by `W.S. Stornetta`. Starting in 1991, he wrote several\
  \ papers on digital timestamping without involving a central timestamp authority.\
  \ `W.S. Stornetta`, `D. Bayer`, and `S. Haber` created the first blockchain in this\
  \ process (not called blockchain at the time). They created a series of immutable\
  \ records linked to each other, forming a linear hash chain.\n\nIn 1994, `Nick Szabo`\
  \ proposed the idea of smart contracts. In 1998, he proposed a concept for a decentralized\
  \ cryptocurrency called Bit-gold. It never went live but laid the foundation for\
  \ cryptocurrencies, leading to Bitcoin's development. In 2002, he wrote a draft\
  \ paper *A Formal Language for Analyzing Contracts*, describing a language for smart\
  \ contracts.\n\n1998 was an interesting year. PayPal launched (providing an alternative\
  \ payment system still popular today), Bit gold was conceptualized, and `Wei Dai`\
  \ proposed the idea of b-Money that year, envisioning Proof of Work and Proof of\
  \ Stake. Proof of Work is used by Bitcoin and many other cryptocurrencies as a consensus\
  \ algorithm, while Proof of Stake is used by Cardano and will be adopted by Ethereum\
  \ in the future.\n\nMany digital currencies were launched in the late 1990s and\
  \ early 2000s, but all failed. There were internet currencies, and game currencies\
  \ used inside games. Second-life had a currency purchasable with real money; you\
  \ could earn money in the game and exchange it back for real money.\n\nIn 2002,\
  \ `Adam Back` published the paper *Hashcash - A Denial of Service Counter-Measure*.\
  \ This paper is cited in the *Bitcoin Whitepaper*. The paper provided a mechanism\
  \ to make systemic abuse of internet resources expensive. One application was email\
  \ spam. It uses CPU power to prevent spam or similar abuse on internet resources.\n\
  \nIn 2004, `Hal Finney` released the code for `RPOW - Reusable Proofs of Work`.\
  \ This was likely the final piece of the puzzle Satoshi Nakamoto needed to create\
  \ Bitcoin. Early Proof of Work could be used to generate tokens for a single transaction.\
  \ RPOW allowed the token recipient to regenerate a new token, send it to the next\
  \ person, and so on. Thus, tokens generated by Proof of Work circulated like money.\
  \ RPOW uses Hashcash as the Proof of Work token. The recipient of a Hashcash token\
  \ generates an RSA-signed token (called an RPOW token) in exchange for the Hashcash\
  \ token, sends it to the next recipient, and repeats the process for further circulation.\n\
  \nNotably, since the 1980s, many digital currencies or digital payment methods have\
  \ been launched, but apart from a few game currencies, only PayPal survived. Many\
  \ companies tried to replicate the PayPal model but all failed. The most successful\
  \ of the failed attempts was e-gold. Anyone could create an account and exchange\
  \ gold and silver for e-gold.\n\nWhen Satoshi Nakamoto wrote the Bitcoin whitepaper,\
  \ all the elements needed to build Bitcoin already existed. Even if Satoshi hadn't\
  \ done it, the first working cryptocurrency would have emerged. Satoshi is a genius,\
  \ but not a superhero. His whitepaper is very accessible, which attracted many people.\
  \ Partly because all the complexity had been solved by equally smart people in earlier\
  \ work.\n\nSatoshi Nakamoto should be credited not only for creating the first cryptocurrency\
  \ (which would have happened anyway) but for designing it with the right mindset,\
  \ allowing it to dominate the cryptocurrency market (by market cap) 13 years later,\
  \ and likely for years to come.\n\nUltimately, Satoshi Nakamoto may have grasped\
  \ everything happening in cryptography and the fate of everyone who launched a currency\
  \ or payment system. He was smart enough to create a truly decentralized and censorship-resistant\
  \ system while hiding his own identity.\n\n### The Rise of Bitcoin\n\n\n\n\n###\
  \ 比特币历史与基础\n\n#### 比特币的起源\n\n2008 年 10 月 31 日，*中本聪*在 metzdowd.com 的密码学邮件列表上发布了题为《比特币：一种点对点的电子现金系统》的比特币白皮书。2009\
  \ 年 1 月 9 日，中本聪在*SourceForge*上发布了比特币代码，并通过挖掘第二个及后续区块启动了网络。第一个区块并非通过挖掘产生，因为它被硬编码在代码本身中；任何区块链的第一个区块被称为**创世区块**。中本聪与密码学领域的不少智者合作，包括*哈尔·芬尼、亚当·贝克、加文·安德烈森*。中本聪与哈尔·芬尼密切合作，首笔交易于\
  \ 1 月 12 日在他们之间发生。\n\n#### 早期里程碑\n\n比特币被注意到的速度令人惊叹。10 月 5 日，全球首个比特币交易所上线，$1 可购买\
  \ 1309.03 BTC。2010 年 5 月 22 日，两个披萨以 10000 ![](img/Bitcoin.jpg)的价格售出。这一天被铭记为**比特币披萨日**。\n\
  \n#### 网络事故\n\n比特币网络从未停止工作的说法是不正确的。这种情况发生过两次。\n\n1.  **通胀漏洞**：第一次，发现了一个通胀漏洞（允许增加加密货币供应量的漏洞），但在修复之前，有人利用它生成了比特币。该问题在数小时内得到解决，使这些额外的比特币失效。\n\
  2.  **网络分叉（2013 年 3 月）**：第二次发生在 2013 年 3 月，一次比特币软件升级导致了网络分叉。随着矿池和节点所有者积极切回旧版本，问题很快得到解决。\n\
  \n#### 挖矿演变\n\n最初，任何人都可以轻松在个人电脑或笔记本上挖掘比特币。由于当时矿工很少，挖出一个区块不需要太多时间。然而，随着更多人开始挖矿，挖出一个区块所需时间变得很长。\n\
  \n2010 年 11 月 27 日，**Slushpool**推出了首个矿池，矿工们联合挖掘区块，一旦挖出，奖励将根据贡献在矿工间分配。后来，矿池成为挖掘区块唯一可行的方式，少数矿池几乎完全接管了网络的算力。即便在今天，情况依然如此。\n\
  \n2014 年 7 月，一个矿池曾短暂拥有超过网络 50%的算力。该矿池并未尝试发动**51%算力攻击**，但意识到这可能影响网络的整体公信力，并承诺永不超过总算力的\
  \ 40%。\n\n#### 替代币与早期生态\n\n**Namecoin**是比特币之后推出的首个加密货币。同年，**Litecoin**也推出了，至今仍保持流行。\n\
  \n2013 年，当**ASIC 矿机**面世时，算力要求变得过高，导致小规模玩家难以挖矿。当时，许多矿工转而挖掘 Namecoin、Litecoin 及其他币种。\n\
  \n2011 年 5 月，**Bitpay**成为首个允许商家接受比特币支付的支付处理商。\n\n#### 监管与基础设施\n\n2013 年 3 月 28 日，美国首个加密货币监管措施出台。**FinCEN**发布了相关法规。\n\
  \n2013 年 10 月 29 日，全球首台比特币 ATM 在加拿大温哥华上线。\n\n#### 重大交易所黑客事件\n\n比特币交易所有着被黑客攻击的历史，许多人因此损失了比特币。然而，对比特币价格和信心影响最大的事件发生在\
  \ 2014 年 2 月**MtGox**被黑客攻击时。它当时是最大的比特币交易所。\n\n#### 硬分叉与扩容辩论\n\n2014 年 6 月 10 日，*Mike\
  \ Hearn*创建了**BIP 64**。12 月，他发布了导致首次硬分叉并创建**Bitcoin XT**的软件。\n\n2010 年，中本聪悄悄引入了**1MB**的区块大小限制。由于每\
  \ 10 分钟生成一个区块，1MB 的区块大小限制成为比特币扩容的主要瓶颈。在 1MB 限制下，比特币每秒最多只能处理**7 笔交易**。早在 2011 年，就有开发者提议提高此限制。\n\
  \n2015 年，**BIP 100**和**BIP 101**被提出以提升该限制。许多比特币硬分叉都与提高此限制有关。通过**隔离见证**软分叉，该限制得以提升。\n\
  \n#### 炒作周期与机构采用\n\n比特币经历了多次价格暴涨暴跌的炒作周期。炒作周期分别出现在 2011 年、2013 年（两次）和 2017 年。这些周期为比特币带来了媒体曝光，并有助于提升采用率。\n\
  \n2020 年 8 月，**MicroStrategy**成为首家将比特币纳入国库储备的上市公司。这赋予了比特币作为价值存储的合法性。\n\n以下是自比特币白皮书发布以来事件时间线和成就的示意图：\n\
  \n![](img/Figure-2.2.jpg)\n\n**图 2.2：** 比特币白皮书发布以来的时间线与里程碑\n\n---\n\n### 定义比特币\n\
  \n比特币不是单一事物，而是两个，其定义如下：\n\n> **比特币是一种无需许可、可验证、点对点、供给无弹性且可演进的资产。**\n>\n> 以及\n>\n\
  > **一种去中心化网络，旨在在无中介的不安全环境中创建、存储和传输比特币。**\n\n比特币的设计也旨在实现扩容，并在其之上和侧面拥有层级。与任何现有网络相比，比特币拥有最高的累积工作量证明。在未来的应用中，资产、货币和代币将能够保障自身安全，并从比特币获得部分价值背书。凭借其设计、开源、去中心化特性、价值及累积工作量证明，它也许终将成为互联网的重要组成部分。未来，比特币可能具有如下定义：\n\
  \n> **互联网中的信任层。**\n\n---\n\n### 拜占庭将军问题\n\n比特币网络使用**工作量证明**共识机制来生成比特币，并使用脚本、密码学和工作量证明将其从后续接收者处转移。\n\
  \n比特币的工作量证明共识机制试图在敌对环境中建立共识，攻击者可能会合谋攻击网络，通过包含或排除包含交易信息的消息来获利。这正是本书标语的由来：\n\n> **在无信任环境中建立信任**\n\
  \n这本质上是对 1982 年*Leslie Lamport、Robert Shostak 和 Marshall Pease*发表的论文《拜占庭将军问题》的一种解决方案。这是一个重要的博弈论问题，问题条件如下：\n\
  \n1.  拜占庭军队计划进攻一座城市。\n2.  拜占庭军队有若干师，每师由一名将军指挥。这些将军驻扎在距城市各处的位置。\n3.  任两位将军无法直接通信，需依赖信差传递消息。\n\
  4.  为攻下城市，他们需就进攻计划达成共识。这需要大量通信往来。\n5.  问题在于他们中可能有叛徒，会通过散布虚假信息破坏计划。\n6.  协同进攻将带来胜利。\n\
  7.  非协同进攻将导致失败。\n\n以下是拜占庭将军问题获胜与失败条件的图示：\n\n![](img/Figure-2.3.jpg)\n\n**图 2.3：**\
  \ 拜占庭将军问题示意图\n\n在比特币中，大多数参与节点根据既定共识规则，就交易消息、其顺序及与先前接受消息的链接达成一致。每个节点在此扮演将军的角色。与拜占庭将军问题不同，目标是保护网络。若网络遭破坏，攻击者（叛徒）可实施双重支付、排除或包含消息、更改消息顺序。这将影响网络的信用价值。\n\
  \n现在，我们理解了比特币共识机制如何本质上解决拜占庭将军问题。\n\n同一拜占庭将军问题可被视为具有以下特征，以用于需要协作的类似问题：\n\n1.  如果大多数在合作，任意数量的将军都可以是叛徒。这使其成为一个民主系统。\n\
  \n\n\n\n\n## 2. 每位将军为使计划成功可能扮演不同的角色。这可以达成一致。\n\n## 3. 无需领导者即可达成共识。\n\n这对现实世界有深远影响，因为在大多数需要达成协议的事务中，都需要一个中心化的可信权威。因此，其影响远不止于支付领域。\n\
  \n举个例子，如果我们想建立一个网约车聚合网络，将会有乘客、司机、车主和车辆本身。这四方都需要通过共识规则达成协议，这些规则以智能合约的形式编写，内容如下：\n\
  \n1. 司机将通过最省时的路线将乘客送达指定地点，\n2. 车辆由车主维护，司机在需要时添加燃料，\n3. 乘客在到达目的地后向车主付款，以及\n4. 司机从车主处领取月薪。\n\
  \n尽管司机、乘客、车主和车辆之间有明确的区别，但一旦确立了协议规则，每一方在等级上都是平等的。每笔交易的记录保存在一串不可变的记录序列中，确保易于审计。无需中心化权威来领导该平台。\n\
  \n下图展示了一个网约车聚合网络：\n\n![](img/Figure-2.4.jpg)\n\n**图 2.4：** 去中心化网约车聚合网络\n\n### 比特币作为拜占庭将军问题的解决方案\n\
  \n为了解决这个问题，比特币需要：\n\n* 按发生顺序在一串不可变的记录序列中维护所有交易。\n* 确保交易在不可变性、顺序以及任何共识规则或合约方面易于验证。\n\
  * 能够解决可能出现的竞态条件，即两条记录同时生成的情况。\n* 快速传播消息，以免前述竞态条件导致确认时间变长。\n\n这就是比特币具有以下特征的原因：\n\n\
  * **工作量证明** 通过在创建区块时附加成本，使交易具有不可变性。\n* **区块链** 由包含交易的区块组成，每个区块都知道前一个区块，且每个区块按时间顺序排列。\n\
  * 比特币 **工作量证明算法** 使得区块 **易于验证** 但极难创建。这确保了交易传播得足够快，以便当区块达到六个确认深度时，由两个遥远节点同时创建区块导致的竞态条件已得到解决。\n\
  * 每笔交易通过 **密码学** 和脚本与前一笔交易关联，强制执行顺序、共识规则和合约。\n* **验证节点** 或 **全节点** 就像观察比特币矿工比赛的观察员。它们不通过创建区块并使用\
  \ **工作量证明算法** 将交易添加到区块中来确认交易。相反，它们验证所有共识规则、智能合约条款、区块的时间顺序、比特币从发送方到接收方的发送，以及来自前一笔交易的比特币资金来源。\n\
  \n### 比特币作为数字资产的属性\n\n比特币网络需要收取费用，以便为挖矿成本提供资金，因为挖矿是保障网络安全的 **工作量证明**。中本聪设计了一种巧妙的方式来实现这一点：\n\
  \n* 当矿工解开挖掘区块所需的加密谜题时，他会获得新铸造的比特币作为报酬。每挖出 210,000 个区块（约 4 年），该奖励减半一次。\n* 随着网络变得更有价值，矿工将收取费用以将交易打包进区块。\n\
  \n这确保了比特币供应完全缺乏弹性，即其供应量是预先确定的。比特币供应量也以指数级速度减少，这意味着当它变得流行时，供应将不足。\n\n区块奖励从创世时的 50\
  \ ![](img/Bitcoin.jpg) 减少到本书撰写时的 6.25 ![](img/Bitcoin.jpg)，而网络手续费从最初的零显著上升。这使得比特币对投机的吸引力降低。\n\
  \n比特币也具有高度可分性，**聪** 是最小面额，其价值如下：\n\n![](img/53.jpg)\n\n比特币不需要中介，这使其成为实物现金的数字等价物。\n\
  \n比特币既不是隐私币，也不会泄露你的身份。比特币的隐私特性可以理解如下：\n\n* 比特币不将个人与身份关联；相反，比特币附着于地址。\n* 比特币可以从交易所、矿工或个人处直接购买。这使得比特币难以追踪。\n\
  * 比特币可以从交易所购买。大多数交易所遵循 **KYC** 规范，因此将身份与地址关联。当我们从交易所转出比特币时，交易所知晓接收地址。\n* 比特币区块链上的所有交易都是透明的，包含前一笔交易、支付地址、资金来源地址和接收地址的金额等信息。这样，每笔交易都有历史记录，可能留下发送方或接收方身份的线索。\n\
  * 有一些技术可以使身份识别变得非常困难。\n\n总体而言，比特币隐私是一件非常个人化的事情。因此，当政府监管比特币并激励其使用时，比特币地址变得更透明、更易追踪；但当政府惩罚其用户时，比特币地址变得不透明、更难追踪。这使比特币具有抗审查性。\n\
  \n比特币存在于网络上，钱包仅持有其私钥。这使比特币具有位置独立性，因此可以轻松在全球两端的人们之间转移。\n\n比特币价值在交易所决定。由于比特币易于转移到世界任何地方，其在各货币中的价值几乎相同。在某些情况下，当政府对加密货币实施限制或对本地货币实施外汇管制时，比特币价值可能比国际价值略高。\n\
  \n比特币是网络上与地址关联的一个数字。如果地址与罪犯或黑客关联，交易所可能会屏蔽此类地址，这可能影响该比特币在下一笔交易中的价值。但在后续交易中，如果它与其他比特币混合，则变得与其他硬币无法区分。由于比特币几乎从不被区分，这使它们具有相当好的同质性。\n\
  \n所有有效的比特币交易要么在 **内存池** 中（位于比特币网络上每个全节点的内存中），要么在区块链中。这些由节点验证。任何人都可以通过运行节点或查看热门网站之一来查看交易。\n\
  \n这赋予了比特币以下属性：\n\n* 稀缺\n* 可分割\n* 抗审查\n* 易于转移\n* 同质\n* 可验证\n\n此外，这使比特币：\n\n* 不太适合投机\n\
  * 更适合持有或储蓄\n\n### 结论\n\n在本章中，我们回顾了密码学发展史上通向比特币诞生的历程。然后，我们梳理了从白皮书发布至本书撰写期间的时间线。\n\
  \n随后，我们定义了比特币及其解决的博弈论问题——拜占庭将军问题。你了解了它如何解决该博弈论问题，以及该问题的解决方案如何改变组织的基本结构。然后我们利用这些知识列举了比特币的基本特征。\n\
  \n在下一章中，你将了解比特币网络的结构。我们将把网络的每个部分与本章学到的比特币基本原理联系起来。\n\n### 重点回顾\n\n\n\n\n加密技术的进步在比特币诞生前近\
  \ 30 年就已开始，为其发展奠定了基础。\n\n*   `DigiCash` 是 1989 年推出的第一个已知的可行加密货币。\n*   `W.S. Stornetta`、`D.\
  \ Bayer` 和 `S. Haber` 创建了第一个区块链。\n*   `Wei Dai` 提出了 `b-Money` 的构想，将工作量证明和权益证明的概念具体化。\n\
  *   工作量证明通过在创建交易时附加成本，使交易具有不可篡改性。\n\n### 问题\n\n1.  解释为什么比特币更适合储蓄，而不太适合投机。\n2.  解释以下每个属性及其与比特币货币的关系：\n\
  \    1.  稀缺性\n    2.  可分割性\n    3.  抗审查性\n    4.  易于转移\n    5.  同质性\n    6.  可验证性\n\
