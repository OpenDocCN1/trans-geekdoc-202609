  \n## 第一章 简介\n\n本书撰写之时，比特币已上线运行 13 年有余。这十年间风云变幻！比特币是首个纯去中心化货币，无需任何受信任的第三方中介交易，使其成为实物现金的数字等价物。如今，存在数千种加密货币，许多都有不同的价值主张。不仅是加密货币，整个生态系统持续演进，不断带来新创新。\n\
  \n本章将试图窥探围绕加密货币和区块链技术的生态系统的规模。您将了解不同种类的加密货币以及构成该生态系统的各个部分。\n\n### 结构\n\n本章将讨论以下主题：\n\
  \n*   加密货币与区块链生态系统\n    *   分布式账本技术（`DLT`）\n    *   加密货币及其价值主张\n        *   智能合约与代币平台\n\
  \        *   支付、价值存储与替代金融\n        *   隐私\n        *   预言机与多链连接器\n        *   稳定币\n\
  \    *   区块链生态系统\n        *   交换媒介与价值存储\n        *   私有链与公有链\n        *   许可链与无许可链\n\
  \        *   合规、记录保存与审计\n        *   代币\n        *   去中心化应用\n        *   同质化与非同质化代币\n\
  \        *   去中心化金融\n    *   比特币生态系统\n        *   比特币教育、培训与在线帮助资料\n        *   节点与钱包\n\
  \    *   挖矿与矿池\n        *   支付\n        *   交易所\n\n### 目标\n\n本章的主要目标是提供区块链和比特币生态系统的概览，帮助读者理解该领域正在发生的创新规模。\n\
  \n读完本章后，您将对区块链技术和加密货币服务的不同目的有一定了解。\n\n### 加密货币与区块链生态系统\n\n让我们通过数字来了解生态系统的规模和大小。\n\
  \n目前存在 9000 多种加密货币。所有加密货币的总市值达 1.8 万亿美元。基于各种加密货币编写的代币有数十万个。有 500 多家交易所可供买卖加密货币。全球运行着\
  \ 1 万多台加密货币 ATM。有数万个与加密货币和区块链相关的工作岗位。全球用户超过 1 亿。这现已成为一个蓬勃发展的行业。\n\n比特币创建之初，它是唯一的加密货币。随着更多加密货币和其他技术的出现，我们开始将它们分类为不同的类别，随后这些类别不断壮大。\n\
  \n加密货币作为交易的分布式账本运作。交易是资金方与接收方之间加密货币转移的记录。后来，我们构建了其他存储资产转移信息和各方间自我执行协议的分布式账本。这些分布式账本系统依赖于区块链。随后，一些基于其他方法的创新想法出现了。\n\
  \n#### 分布式账本技术（`DLT`）\n\n比特币使用区块链，它是区块的链表，其中每个区块由不可变的交易列表或智能合约组成。类似于账本，它是一本记录簿。它在网络中与他人共享。`DLT`\
  \ 是一个统称，区块链属于其范畴。`DLT` 代表 **分布式账本技术**（`Distributed Ledger Technology`，`DLT`）；它可分为基于区块链的实现和非基于区块链的实现。少数加密货币使用其他方法存储记录；例如，`IOTA`\
  \ 使用 **有向无环图**（`Directed Acyclic Graph`，`DAG`）。`Hashgraph` 是另一种用于分布式记录保存的技术。这些也被称为\
  \ `DLT`。\n\n当企业开始介入该概念时，它们创建了具有访问控制且旨在防火墙后保存记录安全的区块链实现和平台。这些区块链实现是为组织内部或组织联盟之间使用而创建的，称为私有链。联盟的私有链实现提供由多条链组成的联邦架构。\n\
  \n以下是上述描述的示意图：\n\n![](img/Figure-1.1.jpg)\n\n**图 1.1：** 分布式账本技术分类\n\n#### 加密货币及其价值主张\n\
  \n比特币被设计为一种供应有限且受控的货币。在经济学中，通货膨胀率是商品和服务价格随时间上涨的速率。在比特币术语中，通货膨胀是新比特币被挖掘、铸造或创建的速率。通货膨胀由算法控制，大约每\
  \ 4 年减半一次。不同加密货币有不同的通货膨胀规则。\n\n比特币最初设计用于点对点支付。最初，转账比特币无需向矿工支付费用，因为任何人都可以在笔记本电脑上铸造比特币。庞大的供应量、低价值、零交易费和全球化存在使比特币成为良好的支付媒介。然而，随着时间的推移，比特币价值上涨、网络费用增加、供应量开始减少，这使其成为极佳的增值资产。它仍被用作交换媒介，全球许多商家接受它。\n\
  \n以下是以特定品质著称的顶级加密货币和代币项目：\n\n![](img/28.jpg)![](img/29.jpg)\n\n**表 1.1：** 顶级加密货币/代币与其特定品质的映射\n\
  \n#### 智能合约与代币平台\n\n智能合约是编码在区块链中并使用编程语言编写的自我执行协议。\n\n比特币提供一种简单的编程语言，可用于编写智能合约。该脚本语言非常原始，无法为构建复杂的现实世界合约提供可行平台。为解决此问题，`Vitalik\
  \ Buterin` 创建了名为 `Ethereum` 的加密货币，支持图灵完备的 `Solidity` 语言编写合约。该语言使开发者创建代币的速度远快于创建加密货币。这导致了通过代币销售筹集资金的\
  \ **首次代币发行**（`Initial Coin Offering`，`ICO`）、证券型代币、实用型代币、**去中心化金融**（`Decentralized\
  \ Finance`，`DeFi`）以及最近的 **非同质化代币**（`non-fungible tokens`，`NFT`）。这吸引了大量关注区块链技术以解决现实问题。\n\
  \n然而，`RSK` 是比特币的第 2 层解决方案，提供类似 `Ethereum` 的智能合约能力。像 `Ethereum` 一样，`RSK` 允许使用 `Solidity`\
  \ 编写智能合约。\n\n#### 支付、价值存储与替代金融\n\n\n\n\n### 比特币挖矿与交易费用\n\n随着比特币变得有价值，且在 2013 年左右个人电脑和笔记本电脑挖矿开始变得困难，首批\
  \ ASIC 硬件投入市场，导致网络费用上涨。显而易见，如果网络费用持续增加，比特币作为购买咖啡等低价值商品的支付工具将不再可行。比特币开发社区在是否应增加区块大小以降低交易费用，还是保持不变以免比特币网络在安全性上妥协的问题上产生了分歧。\n\
  \n### 抗 ASIC 算法\n\n另一种选择是，以太坊、莱特币和其他一些加密货币采用了抗 ASIC 挖矿算法。其思路是使用需要内存而非更快处理速度的算法，因为\
  \ ASIC 硬件擅长解决 CPU 密集型问题，却不擅长处理内存硬问题。\n\n### 比特币现金\n\n比特币现金是比特币的硬分叉之一，其创建的主要目的是通过增加区块大小来降低交易费用。\n\
  \n### 面向支付的替代加密货币\n\n其他加密货币（如莱特币和狗狗币）提供更短的确认时间，使其更适合类现金支付。\n\n### XRP\n\nXRP 是一种可在全球范围内提供近实时支付的加密货币。其主要目标是为金融机构提供一种交换媒介。它声称能提供类似\
  \ SWIFT 的支付处理能力。\n\n### 隐私\n\n比特币交易记录在区块链上，任何人都可以查看。当我们从交易所购买比特币时，需要向交易所提供 KYC（了解你的客户）信息。交易所知晓你的交易，且所有相关交易也都在区块链上。交易所可能会将这些信息泄露给罪犯、黑客、外国政府、广告商等。交易所还可以关联区块链上的其他交易，导致你失去财务隐私。虽然有一些方法可以让比特币交易更私密，但这些方法不如以隐私为设计目标的加密货币效果好。门罗币、达世币、Zcash\
  \ 和 Zcoin 就是一些专门以隐私为设计目标的加密货币。\n\n### 预言机与多链连接器\n\n智能合约强制执行协议，但这些协议基于现实世界的信息，而这些信息并不存在于区块链上。这些信息由被称为\
  \ `Oracle`（预言机）的实体提供。这些实体大多是中心化的第三方。Polkadot 和 Chainlink 提供了去中心化机制来提供外部现实世界信息。Polkadot\
  \ 和 Chainlink 可以在多条区块链之间建立接口，允许它们交换信息。这催生了该领域有趣的项目。这些概念仍在成熟中，我们未来可能会看到该领域更多进展。\n\
  \n### 稳定币\n\n稳定币是一种与另一种资产（如美元、欧元或比特币、黄金等实物资产）价值挂钩的加密货币。\n\n加密货币在交易所买卖，兑换成法定货币。这会产生交易所收取的费用。对于想利用加密货币市场波动获利但觉得手续费高昂的交易者，他们可以将加密资产暂时存入稳定币，在需要买入加密货币时再使用。\n\
  \n此外，世界上大多数人无法接触美元、欧元等被认为更稳定的货币。他们可以购买与这些货币挂钩的稳定币。\n\n### 区块链生态系统\n\n区块链生态系统由加密货币、私有和公有区块链、交易所以及建立在其之上或与其相关的其他服务组成。\n\
  \n以下是区块链生态系统的广泛概览。请记住，区块链生态系统非常庞大，并非所有内容都能在此展示：\n\n![](img/Figure-1.2.jpg)\n\n**图\
  \ 1.2：** 区块链生态系统\n\n### 交换媒介与价值存储\n\n我们了解到，加密货币的创建是为了满足特定需求。所有加密货币都需要开发者；它们需要交易所。作为交换媒介而流行的加密货币需要支付处理器、钱包以及接受它们的商家。\n\
  \n作为价值存储而流行的加密货币需要极其安全的长期存储方法，因此需要保险库和硬件钱包。需要资产管理人提供托管服务，也需要 ETF（交易所交易基金），以便非技术投资者能依赖金融机构保障资金安全。\n\
  \n### 私有与公有区块链\n\n私有区块链（如 `Hyperledger Fabric`）的创建旨在提供组织数据的不可篡改性和访问控制，且可由审计员验证。`Hyperledger\
  \ Fabric` 等私有区块链技术还提供联邦结构，每个组织可以使用 `Hyperledger Fabric` 创建独立的区块链，并可跨链传输数据和代码。这使得具有共同利益的组织联盟能够聚集在一起，共享数据以改善供应链、透明度和可审计性。这还为联盟提供了一种访问控制机制，赋予特定实体特定权利。\n\
  \n### 许可型与无许可型区块链\n\n许可型区块链实现是为组织内部使用或组织联盟之间创建的。只有指定或预定义的实体可以参与。就像办公室内网，只有指定方可以使用，公众无法使用。\n\
  \n另一方面，无许可型区块链加入或与区块链交互不需要任何许可。任何拥有互联网接入的人都可以开始使用它。\n\n### 合规、记录保存与审计\n\n金融机构已使用私有区块链存储客户的\
  \ KYC/AML（反洗钱）数据。由于区块链不可篡改，它们提供便捷的审计，有助于满足合规要求。私有区块链也被用于记录保存，如医疗记录。\n\n### 代币\n\n\
  公有区块链（如以太坊，它简化了使用易于开发语言编写智能合约的过程）支持代币开发、分布式应用开发、数字资产交易与估值以及供应链管理。代币的开发促成了**首次代币发行\
  \ (ICO)** 和**证券型代币发行 (STO)**，二者被用于为初创公司筹集资金。实用代币有助于将优惠券或门票数字化。\n\n### 去中心化应用\n\n\
  分布式应用或 DApps 是构建在去中心化网络上的应用，它们利用智能合约和 UI 表现得像任何托管应用一样。DApps 用于构建有助于建立平台和市场的应用。这些市场和平台作为去中心化组织运作。DApps\
  \ 还可以提供抗审查性和隐私。\n\n### 同质化与非同质化代币\n\n同质化代币类似于货币。如果代币是同质化的，它与其他同类代币无法区分。所有加密货币都是同质化的。有时游戏中有某些普遍限量且对所有等级玩家价值均等的物品；这些也可视为同质化。\n\
  \nNFT 代表 `non-fungible tokens`（非同质化代币）。非同质化代币与同质化代币相反，其价值取决于环境和个人偏好，就像电影院座位的价格可能因座位位置而异。它们适用于艺术品、短片、音乐等资产的数字化，或数字艺术品和收藏品等数字资产。\n\
  \n### 去中心化金融\n\n\n\n\n\n### 去中心化金融 (DeFi)\n\n去中心化金融或 **DeFi** 是使用智能合约在区块链上创建的金融合约。智能合约可用于借贷、保险、交易和衍生品市场等。去中心化金融也可能涉及用于结算或抵押的数字资产或货币。\n\
  \n### 比特币生态系统\n\n随着加密货币和区块链实现的发展，比特币生态系统也在演变。许多服务已构建完成，旨在改善用户和开发者体验。有些服务专为比特币设计，也有为加密货币、代币和区块链构建的服务，这些反过来又使比特币受益。\n\
  \n下图展示了比特币生态系统：\n\n![](img/Figure-1.3.jpg)\n\n**图 1.3：** 比特币生态系统的构建模块\n\n### 比特币教育、培训和在线帮助材料\n\
  \n有多个网站提供学习材料、区块链信息、价格信息、矿池、趋势等。MOOC 提供商提供多门关于比特币的在线课程。甚至像 MIT 这样的知名学府也提供比特币在线课程。培训机构和个人也会举办课堂课程。还有网站提供测试平台，包含转换器、计算器和验证工具。此外，Git\
  \ 上还提供许多用 Python、Node.js、Golang 等编写的实用库。YouTube 上也有许多视频讲解比特币区块链的各个方面。除此之外，还可以在 Stack\
  \ Exchange 上提问技术问题，并可能获得核心开发者的回复。\n\n### 节点和钱包\n\n有许多比特币节点软件可用，有些提供全节点功能，而其他则提供\
  \ SPV 节点。比特币通过称为钱包的软件进行访问。交易所和支付处理商提供在线钱包，也有硬件钱包、桌面钱包、移动钱包和轻钱包。\n\n### 挖矿和矿池\n\n\
  当矿工解决数学问题并创建下一个区块时，他们会获得比特币奖励。矿工竞争解决难题。公司也竞争构建挖矿设备，以更低的成本提供更好的算力。随着更多矿工进入市场，挖矿设备公司制造出更高效的设备，比特币网络会调整难题的难度。这会降低旧设备的回报，使其过时。\n\
  \n随着比特币价格呈指数级上涨，挖矿难度也大幅增加。因此，即使拥有数百台世界上最好的设备，任何人独自解决难题的机会也微乎其微。这是挖矿的现状。解决方法是，任何打算通过挖矿赚钱的人都必须加入矿池。有几个矿池在区块被挖出后，根据矿工的贡献向其支付报酬。\n\
  \n### 支付\n\n比特币钱包可以接收或发送比特币给其他比特币钱包。可以使用与钱包关联的比特币发送到另一个比特币地址，该地址将与接收者的钱包关联。建议接收比特币时始终使用新地址。对于支付来说，这是一件过于复杂的事情。因此，比特币提供了一种安全且私密的转账方式，称为\
  \ **PayNyms**。\n\n还有像 BitPay 这样的支付网关，Coinbase 等交易所也提供支付网关，允许为商业用途（如购物）轻松转账比特币。像\
  \ PayPal 这样的支付网关允许客户向钱包充值比特币，并以美元或其他货币向商家付款。\n\n如果支付足够的网络费（可能是几美元），比特币交易平均需要 10\
  \ 分钟才能获得确认。确认意味着交易被打包进区块。由于网络费高昂，买咖啡不划算。为解决此问题，比特币拥有一个称为 **Lightning Network** 的二层网络，允许商家与客户创建通道。如果在此通道上进行足够多的交易，有效网络费会降低到足以使交易可行的程度。闪电网络交易也是即时的。\n\
  \n##### 交易所\n\n正是交易所赋予了比特币货币价值。交易所是购买、交易和出售加密货币的场所。交易中有买家，他们希望以特定报价买入比特币，也有卖家以特定价格竞价出售比特币。中心化交易所利用报价和竞价使价格上下波动，以发现比特币的合理价格。交易所也承担风险，因为价格可能剧烈波动，导致其亏损。因此，中心化交易所根据市场波动收取点差费，但并非所有交易所都如此。点对点交易量不足以追踪加密货币价值，因此它们为买卖双方提供直接交易的平台，并收取固定佣金。\n\
  \n交易所还可分类如下：\n\n*   **Custodial exchange**（托管交易所）：持有用户比特币钱包的交易所\n*   **Non-custodial\
  \ exchange**（非托管交易所）：不持有用户比特币钱包的交易所\n\n### 结语\n\n本章开头我们探讨了与比特币、区块链和 DLT 相关的发展。这让我们对生态系统的构成、发展进程及其对我们生活的影响有了很好的了解。\n\
  \n下一章你将了解帮助中本聪构建比特币的历史，以及它是如何成长的。你还将理解比特币的定义、它解决的博弈论问题，以及解决该问题在未来的影响。此外，我们还将介绍比特币的基本属性。\n\
  \n### 要点回顾\n\n*   比特币创建时，它是唯一的加密货币。\n*   **Satoshi Nakamoto** 是化名，于 2008 年 10 月\
  \ 31 日发布比特币白皮书，发布代码，并于 2009 年 1 月 3 日部署网络。他活跃至 2010 年 12 月。其身份至今未知。\n*   比特币拥有原始脚本语言，足以编写智能合约。\n\
  *   **DLT** 是去中心化账本技术，包括区块链、Hashgraph、有向无环图等。\n*   私有链在组织内部运行。\n*   公有链是开放网络，世界上任何人都可以与之交互。\n\
  *   许可链实现是为组织内部或组织联盟之间的内部使用而创建的。\n*   无许可链加入或交互不需要任何许可。\n*   加密货币可根据其价值主张分类。\n*\
  \   少数加密货币提供图灵完备的脚本或编程语言支持，使编写智能合约和构建代币更容易。\n*   同质化代币类似货币。如果代币是同质化的，它与其他同类代币无法区分。\n\
  *   **NFTs** 是非同质化代币。非同质化代币与同质化代币相反，意味着其价值取决于环境和个人偏好。\n*   去中心化金融或 **DeFi** 是使用智能合约在区块链上创建的金融合约。\n\
  *   **Stablecoin**（稳定币）是一种与另一种资产（如美元、欧元、比特币或黄金等实物资产）挂钩的加密货币。\n\n\n\n\n### 分布式应用与加密货币概念\n\
  \n*   分布式应用或 **DApps** 是构建在去中心化网络上的应用程序，该网络使用 **智能合约** 和用户界面，使其表现得像任何托管应用程序一样。\n\
  *   **托管交易所** 在其钱包中持有比特币。\n*   **非托管交易所** 不持有比特币；这些交易所的用户直接从交易所外部由他们持有的钱包发送和接收比特币。\n\
  *   适合小额购买的 **加密货币** 归类为货币或 **交换媒介**。\n*   具有高交易成本，且建立了用户信心，认为其安全、可靠并能长期保值的 **加密货币**\
  \ 可被视为 **价值存储**。\n*   **智能合约** 是编码在区块链中并使用编程语言编写的自我强制执行协议。\n*   **首次代币发行 (ICO)**\
  \ 类似于 **IPO** 用于融资，但使用基于 **以太坊** 等加密货币创建的代币。这被处于加密货币和区块链领域、提供产品和服务的初创公司所采用。\n* \
  \  **证券型代币发行 (STO)** 类似于 **ICO** 的公开发行，但在交易所作为数字证券出售，具有法律约束力，因此成为投资者的更好选择。\n*  \
  \ **实用代币** 由公司以优惠券或门票的形式发放，供应有限。这些优惠券稍后可兑换，或门票可用于音乐会入场。\n*   **交易所** 是加密货币获得价值的市场。\n\
  *   **钱包** 包含一组可以接收加密货币的地址。**钱包** 也可以访问这些加密货币，以便将它们发送到其他地址和钱包。\n*   **全节点** 是验证所有区块和交易的程序。\n\
  *   **挖矿节点** 通过使用算力与其他 **挖矿节点** 竞争解决加密难题。\n*   解决加密难题的 **挖矿节点** 会创建一个区块，将来自 **内存池**\
  \ 的交易打包其中，矿工将获得比特币作为区块奖励。\n*   **矿工** 加入 **矿池** 以合作而非竞争的方式解决加密难题。每位矿工根据其贡献的算力比例，获得相应份额的挖出加密货币作为报酬。\n\
  \n### 问题\n\n1.  **DApp** 与托管应用有何不同？\n2.  **ICO** 有哪些缺陷导致其作为融资工具失败，而 **STO** 如何解决这些问题？\n\
  3.  为什么 **比特币** 挖矿消耗大量能源？\n4.  **账本** 一词与 **区块链** 有何关联？\n5.  **Layer 2（第二层）** 与\
  \ **侧链** 有何区别？\n6.  什么是 **图灵完备语言**？\n7.  请各举五个同质化和非同质化商品的例子。\n8.  请给出 **实用代币** 的五个应用场景。\n\
  9.  将 **区块链** 最重要的特性与列出的应用进行匹配：\n\n    **特性：**\n\n    1.  **不可篡改性**\n    2.  **智能合约**\n\
  \    3.  **去中心化**\n    4.  **共识**\n    5.  **账本**\n    6.  **时间顺序**\n\n    **应用：**\n\
  \n    1.  记录保存、审计\n    2.  交易、支付\n    3.  市场\n    4.  时间戳\n    5.  协议\n    6.  投票\n\
