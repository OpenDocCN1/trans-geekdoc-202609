  \    bits_b = bytes.fromhex(jsonobj['bits'])[::-1]\n    mining_return = miningReturn(MINER_POWER_WATT,\
  \ MINER_HASH_RATE, bits_b, blk_reward)\n    print(\"Mining Return Per Month = %s\"\
