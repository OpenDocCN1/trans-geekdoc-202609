  \n##### 原生 P2WSH\n\nP2WSH 是 P2SH 的 SegWit 替代方案。P2WSH 交易如下：\n\n`Previous scriptPubKey:\
  \ 0 <32-byte Redeem-Script-Hash>`\n\n`ScriptSig: (empty)`\n\n`Witness:`\n\n`<Signature\
  \ 1>`\n\n`<Signature 2>`\n\n`...`\n\n`<redeemScript>`\n\n这里，P2SH-P2WSH 使用 hash256\
  \ 哈希算法。因此，我们将 `previous scriptPubKey` 转换为以下脚本：\n\n`OP_SHA256 <32-byte-redeemScriptHash>\
  \ OP_EQUAL`\n\n我们修改 `verifyScript` 以包含 P2WSH 的检查：\n\n```\nif isP2WSH(prev_scriptpubkey_b)\
  \ == True:\n    print('P2WSH')\n    prev_scriptpubkey_b = bytes([0xa8, 0x20]) +\
  \ prev_scriptpubkey_b[2:] + bytes([0x87])\n```\n\n以下是 `isP2WSH` 的实现：\n\n```\ndef\
  \ isP2WSH(prev_scriptpubkey_b: bytes):\n    #0020<32 bytes>\n    if len(prev_scriptpubkey_b)\
  \ == 34 and prev_scriptpubkey_b[0:2] == b'\\x00\\x20':\n        return True\n  \
  \  return False\n```\n\n我们还需要处理 OP_SHA256。我们需要向 `execScript` 方法添加检查，如下所示：\n\n```\n\
  def opSha256():\n    v = st.pop()\n    h = hashlib.sha256(v).digest()\n    st.append(h)\n\
  \ndef execScript(script_b: bytes, inp_index: int, tx: dict):\n    l = len(script_b)\n\
  \    script_m = bytes2Mmap(script_b)\n    while script_m.tell() < l:\n        v\
  \ = script_m.read(1)\n        b = int.from_bytes(v, byteorder='big')\n        if\
  \ b in g_pushdata:\n            script_m.seek(-1, 1)\n            b = decodePushdata(script_m)\n\
  \            d = script_m.read(b)\n            pushdata(d)\n        elif v == b'\\\
  x76':\n            opDup()\n        elif v == b'\\xa8':\n            opSha256()\n\
  \        elif v == b'\\xa9':\n            opHash160()\n        elif b in g_pushnumber:\n\
  \            opNum(b)\n        elif v == b'\\x87':\n            opEqual()\n    \
  \    elif v == b'\\x88':\n            opEqualVerify()\n        elif v == b'\\xac':\n\
  \            opCheckSig(script_b, inp_index, tx)\n        elif v == b'\\xae':\n\
  \            opCheckMultisig(script_b, inp_index, tx)\n```\n\n**程序 12.7：** 验证 P2WSH\
