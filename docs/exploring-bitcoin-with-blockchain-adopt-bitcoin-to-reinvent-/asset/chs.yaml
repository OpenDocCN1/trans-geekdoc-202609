  \n### 补贴用例\n\n此用例解决了一个人或组织部分资助或补贴另一个人的付款需求。\n\n在这种情况下，我们使用 `SIGHASH_SINGLE|SIGHASH_ANYONECANPAY`，因为个人只知道一个输入和一个输出。\n\
  \n在这种情况下，接受补贴的个人只需为服务或产品支付折扣价。然而，商家或服务提供商收到全额付款，因为剩余金额由资助人或组织添加。\n\n此用例的益处有限，因为它不适用于以下条件：\n\
  \n*   个人需要来自多个地址的资金\n*   个人需要从单个地址向多个收款人付款\n\n如果有不止一个人获得补贴，那么每个获得补贴的人也会获得一个索引，该索引与最终交易输出的索引相关，他们的交易将被添加到该输出中。\n\
