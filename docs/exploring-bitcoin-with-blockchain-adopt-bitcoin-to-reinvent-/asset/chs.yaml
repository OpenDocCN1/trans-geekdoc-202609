  \ scriptPubkey_b\n    preimage_b += struct.pack('<L', txn_struct['locktime'])\n\
  \    preimage_b += struct.pack('<L', hashtype)\n    return preimage_b\n```\n\n以下是在积累了前面用例中使用的所有条件后更新的\
