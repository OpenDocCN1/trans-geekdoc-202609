  \n### 慈善用例\n\n在慈善场景中，人们向组织捐款，然后组织使用这些资金及其储备金来开展社会服务活动。这些资金也用于支付正式员工的工资。\n\n在这种情况下，我们使用\
  \ `SIGHASH_NONE|SIGHASH_ANYONECANPAY`，因为捐赠者不知道资金将用在何处，因此他们无法对输出进行签名。\n\n在此用例中，捐赠个人将创建一笔不含输出的交易并将其发送给慈善信托。该交易将包含签名。然后，慈善信托将从其储备金中添加额外资金并支付给供应商，供应商将向组织的贫困儿童提供食物、衣物等。\n\
