  \ 列表：\n\n![](img/Figure-7.48.jpg)\n\n**图 7.48：** 发送给对等节点的 getblocktxn 请求，附带缺失短 ID\
  \ 索引列表\n\n随后，对等节点响应一个 `blocktxn` 消息，仅包含所需的交易：\n\n![](img/Figure-7.49.jpg)\n\n**图\
  \ 7.49：** 对等节点发送包含请求交易列表的 blocktxn 消息\n\n至此，本章内容结束。\n\n### 结论\n\n在本章中，您首先了解了比特币网络拓扑，并得知节点运行不同的版本，可能属于不同类型，如归档节点、修剪节点或\
  \ SPV 节点。您还了解了节点如何发现要连接的对等节点地址，以及节点首次连接对等节点时如何获取所有区块，以及如何获取所有竞争性区块链分支。接着，您学习了节点如何向所有其余节点广播交易和区块消息。我们未涵盖\
  \ SPV 节点为接收所需交易和验证区块而进行的网络通信。我们也未涵盖隔离见证交易。\n\n在下一章中，您将了解技术的局限性、其对自然的影响以及因设计而存在的潜在风险和漏洞。我们将彻底审视它们，并判断它们是真实存在、风险较高，还是仅仅是迷思。\n\
  \n### 要点回顾\n\n*   比特币是一个点对点网络，需要 TCP 连接或 Tor 网络来连接到对等节点。\n*   比特币网络是非层级的，这意味着所有节点地位平等，没有主节点或服务器。会有\
  \ TCP 服务器，但没有比特币网络服务器。\n*   节点可以随时连接和断开，并可以选择需要连接的节点。\n*   节点需要一组初始地址，或者我们需要提供初始地址，以便它们能够与对等节点建立初始连接。\n\
  *   `Version` 消息是每个节点发送的第一条消息。如果节点对收到的 `version` 消息中的信息满意，它会响应 `verack`。\n*   一旦交换了\
  \ `version` 和 `verack` 消息，连接即视为已建立。在此之前，节点不会接收任何其他消息。\n*   节点可以随时向对等节点发送 `ping`\
  \ 消息，以了解对等节点是否仍保持连接。\n*   节点应减少对硬编码 DNS 种子的依赖，方法是本地存储活跃地址并向其对等节点请求新地址。\n*   节点首次启动时，会获取直到\
  \ 24 小时前区块的所有区块头列表。收到这些后，它需要从所有连接的节点获取区块头，以获得所有竞争链。\n*   一旦节点的区块链与所有对等节点同步，它就准备好接收新区块和交易。\n\
  \n### 问题\n\n1.  我们如何判断对等节点发送的是比特币区块还是其他网络的区块？\n2.  为什么节点需要从多个对等节点接收最近的区块？\n3.  初始区块下载\
  \ (IBD) 方法与区块链同步有何不同？\n\n\n\n\n4. 您认为我们何时应该使用修剪节点而不是归档节点？\n\n5. 节点何时发送 `sendheaders`\
  \ 和 `sendcmpct` 消息？\n\n6. 编程问题：\n\n    1. 编写一个程序，连接多个对等节点，并将一个对等节点的地址发送给另一个。\n\n\
  \    2. 编写一个程序以接收多个 TCP 连接并限制活动连接数。\n\n    3. 编写一个程序将区块中继给其他已连接节点。\n\n    4. 使用\
  \ Bitcoin Core 钱包创建一笔原始交易，并使用您自己的程序将其广播。\n\n7. 判断题：\n\n    1. 节点有必要向发送对等节点响应 `cmpctblock`\
  \ 消息。\n\n    2. 交易 `inv` 消息需要节点区块链与对等节点区块链同步。\n\n    3. 在初始区块下载期间，我们向多个对等节点发送 `getdata`\
  \ 请求以提高下载性能。\n\n8. 填空题：\n\n    1. 在高带宽紧凑区块广播中，节点在收到区块后发送 __________ 消息，而不是 __________\
  \ 消息。\n\n    2. `inv` 消息不再用于广播 _________。\n\n    3. 非请求区块推送方法仅由 _________ 节点用于发布\
  \ _________。\n\n### 第 8 章\n\n# 技术局限、威胁与漏洞\n\n在上一章中，您学习了节点间通信的技术细节。这有助于您理解交易和区块如何在网络中传播、节点如何寻找对等节点，以及节点如何决定与哪些节点建立连接。\n\
  \n既然您已深入了解比特币协议，便可以从技术角度理解其局限性和漏洞。\n\n在本章中，我们将学习比特币的设计和实现如何给其使用带来局限。我们将理解这些局限为何重要，以及它们如何赋予比特币其特性。我们还将了解比特币网络可能被攻破的不同方式，以及为何它依然安全、短期内不太可能遭受攻击。此外，我们将讨论那些目前看似安全，但未来可能成为潜在安全风险的漏洞。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   设计局限\n\n    *   区块大小局限\n\n        *   对交易验证的影响\n\
