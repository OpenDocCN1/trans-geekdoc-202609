  \ byteorder='little')\n    return payload\n\nmempool_l_g = []\n\ndef parseInvPayload(payload_m:\
  \ mmap, payloadlen = 0):\n    MSG_TX = 1\n```\n\n\n\n\n### 程序 7.11：向对等节点发起 IBD 请求并接收区块的程序\n\
