  \ 少于 2,000 个，我们也可以向其他对等节点发送 `getheaders` 请求。通过向其他对等节点发送 `getheaders` 请求，我们可以推测出最佳区块链，并保留不同链中的区块以便能够撤销区块。\n\
  \n如果区块链落后超过 24 小时，IBD 方法也可用于同步区块。\n\n### 同步区块链\n\n如果我们的节点落后不足 24 小时，我们必须考虑到可能存在竞争链的情况。在这种情况下，我们需要从不同的对等节点获取区块，并保留竞争链中的区块，以便在另一条链变长时撤销它们。我们使用与上一子主题中相同的方法来获取区块，唯一的区别在于我们是从多个对等节点获取区块。我们的节点还需要决定将哪条链视为最佳链，通常首选较长的链。\n\
  \n### 交易广播\n\n正如我们所知，要花费作为 UTXO 可用的未花费输出，我们需要创建一笔交易并将其发送给对等节点。我们也可能从对等节点接收交易，并可能需要将其转发给其他对等节点。在本子主题中，我们将了解节点如何接收交易。\n\
  \n下图显示了获取交易所涉及的步骤：\n\n![](img/Figure-7.23.jpg)\n\n**图 7.23：** 显示交易广播所涉及步骤的序列图\n\n\
  当节点接收到一笔交易时，它会向其对等节点发送一条 `inv` 消息。对等节点检查它之前是否见过该交易。如果没有，它会带上 `MSG_TX` 选项和 `txid`\
  \ 回复 `getdata` 请求。发送过 `inv` 消息的节点会用实际的原始交易进行响应。\n\n`inv` 与 `getdata` 具有相同的载荷结构。`tx`\
  \ 消息具有与我们在 *第 6 章，区块链、交易与挖矿, 图 6.30* 中讨论的比特币交易相同的消息结构。\n\n以下代码处理带有 `MSG_TX` 选项的\
  \ `inv` 消息：\n\n```\ndef createGetDataTxPayload(payload: dict):\n    MSG_TX = 1\n\
  \    data_b = b''\n    count = 0\n    for i in range(payload['count']):\n      \
  \  # we only request data for tx\n        if payload['inventory'][i]['type'] ==\
  \ MSG_TX:\n            type_b = struct.pack('<L', payload['inventory'][i]['type'])\n\
  \            hash_b = bytes.fromhex(payload['inventory'][i]['hash'])[::-1]\n   \
  \         data_b += type_b + hash_b\n            count += 1\n    count_b = setVarInt(count)\n\
  \    payload_b = count_b + data_b\n    return count, payload_b\n\ndef waitForInvMessage(s:\
  \ socket):\n    while True:\n        recvmsg = recvMsg(s)\n        if recvmsg['command']\
  \ == 'inv':\n            break\n        elif recvmsg['command'] == 'ping':\n   \
  \         sendPongMessage(s, recvmsg)\n    print('Received INV', file=flog)\n  \
  \  return recvmsg\n\ndef waitForTxMsg(s: socket):\n    while True:\n        recvmsg\
  \ = recvMsg(s)\n        if recvmsg['command'] == 'tx':\n            break\n    \
  \    elif recvmsg['command'] == 'ping':\n            sendPongMessage(s, recvmsg)\n\
  \ndef sendGetDataMessageWithTx(s: socket, recvmsg: dict):\n    sndcmd = 'getdata'\n\
  \    count, payload = createGetDataTxPayload(recvmsg['payload'])\n    sndmsg = createMessage(sndcmd,\
  \ payload)\n    s.send(sndmsg)\n    print('==> cmd = %s, msg = %s' % (sndcmd, sndmsg.hex()),\
  \ file=flog)\n    return count\n\ndef waitAndHandleInvTxnMessage(s: socket):\n \
  \   recvmsg = waitForInvMessage(s)\n    count = sendGetDataMessageWithTx(s, recvmsg)\n\
  \    for i in range(count):\n        waitForTxMsg(s)\n\ndef sendrecvHeadersData(s:\
  \ socket):\n    waitAndHandleInvTxnMessage(s)\n\ndef sendrecvHandler(s: socket,\
  \ version: int):\n    if establishConnection(s, version) == False:\n        print('Establish\
  \ connection failed', file=flog)\n        return\n    sendrecvHeadersData(s)\n```\n\
  \n**程序 7.12：** 用于接收和处理交易 `inv` 消息的程序\n\n以下是通信日志，显示了接收到的 `inv` 消息以及针对两笔交易发送的带请求的\
  \ `getdata` 消息：\n\n![](img/Figure-7.24.jpg)\n\n**图 7.24：** 从对等节点接收到的 inv 消息及作为响应向对等节点发出的\
  \ getdata 请求\n\n我们按请求接收到了两笔交易：\n\n![](img/Figure-7.25.jpg)\n\n**图 7.25：** 作为对 getdata\
  \ 请求的响应从对等节点接收到的包含交易的 tx 消息\n\n我们的节点可以通过首先发送一条包含已接收交易 ID 的 `inv` 消息，将接收到的交易发送给其他已连接的节点。此过程将持续到所有活跃节点都接收到该交易。\n\
  \n在本子主题中，你学习了交易如何在比特币网络上广播。\n\n### 区块广播\n\n区块也需要尽快在网络上传播，以便即使是最远的节点也能在合理的时间内收到它，从而不会产生过多或过长的竞争分支。在我们能够接收最新区块之前，我们需要将我们的节点与已连接的对等节点同步，以便对等节点知道我们的节点没有滞后，并且我们的节点将能够验证最近接收到的区块。\n\
  \n一旦区块链同步完成，我们就准备好从对等节点接收实时更新了。\n\n以下是广播区块的不同方法：\n\n*   成功挖出新区块的矿工只需通过 `block` 消息广播该新区块。这称为\
  \ **非请求区块推送**。\n\n*   对于普通节点，有三种接收新区块的方法。这些方法称为 **直接区块头公告**。这可以通过 `sendheaders`\
  \ 方法或 `sendcmpct` 消息启用。`sendheaders` 方法是传统的直接区块头公告方法，自版本 70012 起可用，而 `sendcmpct`\
  \ 方法是在版本 70014 中引入的。以下要点对它们进行了解释：\n\n    *   节点在连接建立后立即发送 `sendheaders`。这向对等节点表明，每当它接收到新区块时，可以发送\
  \ `headers`。基于 `headers`，我们可以请求 `getdata`。作为对 `getdata` 的响应，对等节点发送区块。\n\n    * \
  \  通过请求紧凑区块可以进一步降低中继延迟。`sendcmpct` 消息可以在连接建立后立即发送。有两种方法：\n\n        *   **高带宽中继：**\
  \ 每当对等节点接收到一个区块，它就发送 `cmpctblock`。它包含一个区块头和一个短 ID 列表。我们根据短 ID 在 `mempool` 中查找交易\
  \ ID 列表并重建区块。如果 `mempool` 中缺少交易，我们通过发送 `getblocktxn` 仅请求那些缺失的交易。对等节点则用包含这些交易的 `blocktxn`\
  \ 消息进行响应。\n\n        *   **低带宽中继：** 每当对等节点接收到一个区块，它就发送一条 `headers` 消息。我们发送一条带有 `MSG_CMPCT_BLOCK`\
  \ 类型的 `getdata` 消息作为响应。对等节点响应 `cmpctblock`，后续处理类似于 **高带宽中继**。\n\n### 非请求区块推送\n\n\
  下图显示了成功挖出区块的矿工进行的 **非请求区块推送**。矿工不需要先发送 `headers` 消息，因为它知道对等节点不会有该区块。它也不需要将其节点与对等节点同步，因为只有在知晓链上前一个节点的情况下才能挖出区块。\n\
  \n![](img/Figure-7.26.jpg)\n\n**图 7.26：** 矿工使用非请求区块推送向对等节点广播新生成区块的示意图\n\n我们可以看到，在图中，矿工只是将新挖出的区块直接推送给所有已连接的对等节点。矿工不需要任何其他通信。\n\
  \n### 直接区块头公告\n\n下图显示了直接区块头公告（传统版）：\n\n![](img/Figure-7.27.jpg)\n\n**图 7.27：** 直接区块头公告（传统版）所涉及步骤的序列图\n\
  \n\n\n建立连接后，我们会立即向对等节点发送 `sendheaders` 消息，告知对等节点：我们期望接收 `headers` 消息而非 `inv` 消息，以获取最近接收到的新区块。在对等节点能够广播新区块之前，我们需要让它知晓我们持有的区块列表。为此，我们需要在\
  \ `getheaders` 请求中发送一份按逆序排列的区块哈希列表，从最近接收的区块开始，以创世区块结束。这与我们在上一小节学到的内容相同。作为响应，对等节点会发送区块链中所有缺失的区块。如果对等节点没有新区块，则会发送一个计数为零的\
  \ `headers` 消息作为响应。\n\n一旦对等节点知晓我们持有的区块链，并与对等节点拥有所有同步的区块，我们就可以从对等节点接收新区块。请注意，我们的最佳区块链可能与对等节点的最佳区块链不同，因此我们需要从不同的对等节点接收区块。\n\
  \n在以下代码片段中，连接已建立，现在我们正在发送和处理接收新区块所需的请求：\n\n```\ndef sendSendHeadersMessage(s: socket):\n\
  \    sndcmd = 'sendheaders'\n    payload = b''\n    sndmsg = createMessage(sndcmd,\
  \ payload)\n    s.send(sndmsg)\n    print('==> cmd = %s, msg = %s' % (sndcmd, sndmsg.hex()),\
  \ file=flog)\n\ndef createHeadersPayloadNoHeaders():\n    cnt_b = setVarInt(0)\n\
  \    headers_b = b''\n    payload = cnt_b + headers_b\n    return payload\n\ndef\
  \ createHeadersPayload(hashes, stophash):\n    b_cnt_d = {'fd': 2, 'fe': 4, 'ff':\
  \ 8}\n    found = False\n    for blk_hash in hashes:\n        try:\n           \
  \ blk = rpc_connection.getblock(blk_hash)\n            found = True\n          \
  \  break\n        except Exception as e:\n            continue\n    if found ==\
  \ True:\n        txcnt = 0\n        txcnt_b = setVarInt(txcnt)\n        headers_b\
  \ = b''\n        count = 0\n        while True:\n            # returns block hex\n\
  \            print('block_hash = %s' % blk_hash, file=flog)\n            blk = rpc_connection.getblock(blk_hash,\
  \ False)\n            blk_b = bytes.fromhex(blk)\n            blkhdr_b = blk_b[:80]\n\
  \            headers_b += blkhdr_b + txcnt_b\n            blk = rpc_connection.getblock(blk_hash)\n\
  \            count += 1\n            if count == 2000 or 'nextblockhash' not in\
  \ blk or stophash == blk_hash:\n                print(count, file=flog)\n      \
  \          print(stophash, file=flog)\n                break\n            blk_hash\
  \ = blk['nextblockhash']\n        cnt_b = setVarInt(count)\n        payload = cnt_b\
  \ + headers_b\n    else:\n        cnt_b = setVarInt(0)\n        headers_b = b''\n\
  \        payload = cnt_b + headers_b\n    return payload\n\ndef waitForHeaders(s:\
  \ socket):\n    while True:\n        recvmsg = recvMsg(s)\n        if recvmsg['command']\
  \ == 'headers':\n            break\n        elif recvmsg['command'] == 'ping':\n\
  \            sendPongMessage(s, recvmsg)\n        elif recvmsg['command'] == 'getheaders':\n\
  \            sendHeadersMessage(s)\n    return recvmsg\n\ndef waitAndHandleHeaderResponse(s:\
  \ socket):\n    recvmsg = waitForHeaders(s)\n    count = recvmsg['payload']['count']\n\
  \    for i in range(0, count, 16):\n        lindex = i + 16 if i + 16 < count else\
  \ count\n        blk_l = recvmsg['payload']['headers'][i:lindex]\n        sendGetDataMessage(s,\
  \ lindex - i, blk_l)\n        for j in range(i, lindex):\n            waitForBlock(s)\n\
  \ndef getBlockHashListFromCoreClient():\n    blkhash_l = []\n    height = getLastBlockHeight()\n\
  \    for i in range(31, -1, -1):\n        d = {}\n        d['blkhash'] = rpc_connection.getblockhash(height\
  \ - i)\n        blkhash_l.append(d)\n    return blkhash_l\n\ndef sendrecvHeadersData(s:\
  \ socket, version: int):\n    sendSendHeadersMessage(s)\n    blkhash_l = getBlockHashListFromCoreClient()\n\
  \    sendAndHandleGetHeaders(s, blkhash_l, version)\n    waitAndHandleHeaderResponse(s)\n\
  \ndef sendrecvHandler(s: socket, version: int):\n    if establishConnection(s, version)\
  \ == False:\n        print('Establish connection failed', file=flog)\n        return\n\
  \    sendrecvHeadersData(s, version)\n```\n\n**程序 7.13：** 使用直接头部通告（传统方式）接收区块的程序\n\
  \n这为我们节点与对等节点之间的消息交换提供了以下序列。\n\n首先，我们向对等节点发送 `sendheaders`，表明我们期望接收 `headers` 消息而非\
  \ `inv` 来获取区块：\n\n![](img/Figure-7.28.jpg)\n\n**图 7.28：** 发送给对等节点的 `getheaders`\
  \ 消息，表明我们的节点接受直接头部通告\n\n随后，我们通过发送包含最佳链近期区块列表的 `getheaders` 消息来同步区块链：\n\n![](img/Figure-7.29.jpg)\n\
  \n**图 7.29：** 为与对等节点同步而发起的 `getheaders` 请求\n\n由于对等节点没有任何近期区块，它响应了以下空的 `headers`\
  \ 消息：\n\n![](img/Figure-7.30.jpg)\n\n**图 7.30：** 对等节点响应包含头部列表的 `headers` 消息\n\n\
  对等节点发送空的 `headers` 响应，因为它没有任何新区块。\n\n此后，我们等待对等节点在接收到新区块时将其发送给我们：\n\n![](img/Figure-7.31.jpg)\n\
  \n**图 7.31：** 对等节点在接收到新区块后向我们的节点发送头部列表\n\n如果我们还没有该区块，我们会请求对等节点发送缺失的区块。这是通过向对等节点发送\
  \ `getblock` 消息（携带我们在 `headers` 消息中收到的区块头哈希）来完成的。\n\n![](img/Figure-7.32.jpg)\n\n\
  **图 7.32：** 我们的节点向对等节点发送 `getdata` 请求以获取区块\n\n对等节点在 `block` 消息中响应原始区块。以下是截断的 `block`\
  \ 消息：\n\n![](img/Figure-7.33.jpg)\n\n**图 7.33：** 对等节点响应包含完整区块的 `block` 消息\n\n在本小节中，您了解了原始直接头部通告方法的工作原理。在下一小节中，您将了解广播最近接收区块的改进方法。\n\
  \n### 紧凑区块通告\n\n我们知道区块是交易的集合。构成区块的大多数交易几乎已被所有对等节点接收。因此，如果我们能随区块头一起发送压缩的交易列表，就无需发送完整区块。这就是紧凑区块通告的核心思想。因此，自版本\
  \ 70014 起，直接头部广播已被 `cmpctblock` 取代，现在使用两种方法：\n\n1.  **高带宽通信：** 此方法通常仅为少数对等节点启用，因为它需要更多处理。\n\
  2.  **低带宽通信：** 此方法为其他对等节点启用。\n\n建立连接后，我们会立即向对等节点发送 `sendheaders` 消息，告知对等节点：我们期望接收\
  \ `headers` 消息而非 `inv` 消息以获取新入站区块。然后，我们发送 `sendcmpct` 消息，告知对等节点：对于隔离见证和非隔离见证交易，我们期望接收\
  \ `headers` 或 `cmpctblock` 消息。\n\n以下是 `sendcmpct` 载荷的结构：\n\n![](img/Figure-7.34.jpg)\n\
  \n**图 7.34：** `sendcmpct` 消息的结构\n\n在 `sendcmpct` 消息中，有两个字段：\n\n**Announce** 是一个单字节布尔值。值\
  \ **0** 表示支持低带宽中继，值 **1** 表示支持高带宽中继。\n\n**Version** 是一个 8 字节字段；目前它可以具有以下值之一：\n\n\
  *   值 1，表示支持 `wtxid`，即隔离见证中的见证交易 ID。\n*   值 0，表示支持具有交易 ID 的其他交易。\n\n我们将在即将到来的章节中介绍隔离见证交易。\n\
  \n下一小节将介绍这些中继方法中的每一种。\n\n### 高带宽紧凑区块通告\n\n以下是活动图中的消息交换序列：\n\n![](img/Figure-7.35.jpg)\n\
  \n**图 7.35：** 高带宽中继紧凑区块通告的序列图\n\n\n\n\n### 接收和处理紧凑区块消息\n\n收到针对隔离见证和非隔离见证交易的 `sendcmpct`\
  \ 请求后，我们发送一个包含近期区块和创世区块列表的 `getheaders` 请求，并与对等节点同步我们的节点，这与我们在 **同步区块** 小节中所做的一样。\n\
  \n一旦对等节点知晓我们拥有其认为的最佳区块链中的所有区块，我们就可以准备好从对等节点接收新区块。请注意，我们的最佳区块链可能与对等节点的最佳区块链不同，因为我们将从多个对等节点接收区块。最佳区块链是指累积工作量证明最高的链。这可以通过将链中每个区块记录的难度相加来计算。难度调整仅在每\
  \ 2016 个区块发生一次，因此累积工作量证明最高的链通常是区块更多的链。\n\n当对等节点收到一个新区块时，它会发送一个包含该区块中所有交易的压缩或短 ID\
  \ 的 `cmpctblock` 消息。为了解析和生成短 ID，我们需要安装以下 Python 包：\n\n![Figure 7.36: pip package\
  \ to generate and parse short IDs](img/Figure-7.36.jpg)\n\n**Figure 7.36:** 用于生成和解析短\
  \ ID 的 pip 包\n\n`cmpctblock`、`getblocktxn` 和 `blocktxn` 消息的结构如下：\n\n![Figure 7.37:\
  \ Payload structure of cmpctblock, getblocktxn and blocktxn](img/Figure-7.37.jpg)\n\
  \n**Figure 7.37:** cmpctblock、getblocktxn 和 blocktxn 的载荷结构\n\n这些消息载荷的详细信息如下：\n\n\
