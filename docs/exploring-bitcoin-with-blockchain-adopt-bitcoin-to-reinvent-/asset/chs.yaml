  \ 从对等节点接收 addr 的通信日志\n\n### 接收完整区块链\n\n当我们安装比特币软件并首次连接到网络时，它会同步区块链中所有现有的区块。它告诉其对等节点其区块高度为零，并请求对等节点提供区块。这称为**初始区块下载\
  \ (IBD)**。自 Bitcoin Core 0.10.0 版本以来，我们使用一种称为**区块头优先**的 IBD 方法。\n\n下图显示了涉及的步骤：\n\
  \n![](img/Figure-7.16.jpg)\n\n**图 7.16：** 显示 IBD 涉及步骤的时序图\n\n新节点最初只有创世区块。它在 `getheaders`\
  \ 请求中发送该区块的哈希值。对等节点用包含区块头哈希列表的 `headers` 消息进行响应。Bitcoin Core 发送最多 2,000 个区块哈希的列表。收到区块哈希后，节点验证区块哈希，然后用其接收到的部分区块头哈希向其对等节点发送\
  \ `getdata` 请求。由于节点连接了多个对等节点，它可以向所有对等节点请求不同组的区块哈希。被请求的对等节点逐个响应所有区块。一旦节点收到请求的区块，它可以再次用接收到的区块哈希列表发起\
  \ `getdata` 请求。此过程持续进行，直到节点接收所有区块，且节点的区块链与网络完全同步。\n\n以下是 `getheaders`、`headers`\
  \ 和 `getdata` 消息的结构：\n\n![](img/Figure-7.17.jpg)\n\n**图 7.17：** getheaders 和 getdata\
  \ 的载荷结构\n\n`block` 的结构与我们在*第 6 章，区块链、交易和挖矿*中讨论的*图 6.6*相同。\n\n在以下代码中，我们仅发送两个 `getheaders`\
  \ 请求：第一个仅包含创世区块哈希，下一个包含 32 个已接收区块的哈希。这意味着我们预期接收两组 2000 个区块。我们针对每个 `headers` 响应发起多个\
  \ `getdata` 请求。在以下代码中，每个 `getdata` 请求包含 16 个区块头哈希。\n\n```\ndef getGenesisBlockHash():\n\
