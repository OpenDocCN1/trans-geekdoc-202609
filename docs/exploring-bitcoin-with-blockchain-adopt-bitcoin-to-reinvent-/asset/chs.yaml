  \ 消息，仅包含其在 `getblocktxn` 消息中收到的缺失交易。以下是从对等节点收到的截断后的 `blocktxn` 消息：\n\n![](img/Figure-7.43.jpg)\n\
  \n**图 7.43：** 对等节点响应包含缺失交易的 blocktxn 消息\n\n### 低带宽紧凑区块通告\n\n以下是主机与其对等节点之间消息交换的序列，以活动图的形式呈现：\n\
  \n![](img/Figure-7.44.jpg)\n\n**图 7.44：** 低带宽中继紧凑区块通告的序列图\n\n在低带宽紧凑区块通告方法中，我们在 `sendcmpct`\
  \ 消息中将 announce 设置为 0，并为隔离见证和非隔离见证交易都发送 `sendcmpct` 消息。区块链同步完成后，我们等待来自对等节点的 `headers`\
  \ 消息。作为对 `headers` 消息的响应，我们发送一个带有 `MSG_CMPCT_BLOCK` 作为响应类型的 `getdata` 消息。\n\n以下代码实现了此功能：\n\
  \n```\ndef sendSendCompactMessage(s: socket):\n    # send sendcmpct message for\
  \ Segwit\n    sndcmd = 'sendcmpct'\n    payload = createSendCompactPayload(0, 2)\n\
  \    sndmsg = createMessage(sndcmd, payload)\n    s.send(sndmsg)\n    print('==>\
  \ cmd = %s, msg = %s' % (sndcmd, sndmsg.hex()), file=flog)\n\n    # send sendcmpct\
  \ message for others\n    sndcmd = 'sendcmpct'\n    payload = createSendCompactPayload(0,\
  \ 1)\n    sndmsg = createMessage(sndcmd, payload)\n    s.send(sndmsg)\n    print('==>\
  \ cmd = %s, msg = %s' % (sndcmd, sndmsg.hex()), file=flog)\n\ndef createGetDataPayloadCMPCTBlock(hash_l:\
  \ list):\n    MSG_CMPCT_BLOCK = 4\n    count = len(hash_l)\n    hash_count_b = setVarInt(count)\n\
  \    hashes_b = b''\n    for i in range(count):\n        type_b = struct.pack('<L',\
  \ MSG_CMPCT_BLOCK)\n        hashes_b += type_b + bytes.fromhex(hash_l[i]['blkhash'])[::-1]\n\
  \    payload_b = hash_count_b + hashes_b\n    return payload_b\n\ndef sendGetDataMessage(s:\
  \ socket, recvmsg: dict):\n    sndcmd = 'getdata'\n    blk_l = recvmsg['payload']['headers']\n\
  \    payload = createGetDataPayloadCMPCTBlock(blk_l)\n    sndmsg = createMessage(sndcmd,\
  \ payload)\n    s.send(sndmsg)\n    print('==> cmd = %s, msg = %s' % (sndcmd, sndmsg.hex()),\
  \ file=flog)\n\ndef waitAndHandleHeaderResponse(s: socket):\n    recvmsg = waitForHeaders(s)\n\
  \    sendGetDataMessage(s, recvmsg)\n    recvmsg = waitForCmpctBlock(s)\n    shortIDs_index_l\
  \ = findMissingShortIDs(recvmsg['payload'])\n    if len(shortIDs_index_l) > 0:\n\
  \        sendGetBlockTxn(s, recvmsg, shortIDs_index_l)\n        waitForBlockTxn(s)\n\
  \ndef sendrecvHandler(s: socket, version: int):\n    if establishConnection(s, version)\
