  \ = 1\ntxn['outputs'] = []\noutput0 = {}\noutput0['satoshis'] = 14999990000\noutput0['script_type']\
  \ = 'P2PKH'\noutput0['address'] = 'msV23rBcHAtQWSkWV9ph91DV65VduWi1Vt'\ntxn['outputs'].append(output0)\n\
  txn['locktime'] = 0\nreturn txn\n```\n\n**程序 11.27：** 在计划的组交易中定义组合交易结构的方法\n\nCarol\
