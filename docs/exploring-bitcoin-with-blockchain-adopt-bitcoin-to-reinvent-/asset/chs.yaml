  \n### 群体内的计划性捐助\n\n与补贴或慈善不同，在这种情况下，参与者是为已知目的捐助的，比如为老师买礼物。每个人为买礼物贡献自己的一份或公平份额，并且每个人都知道他们是如何付款的。\n\
  \n在这种情况下，我们使用 `SIGHASH_ALL | SIGHASH_ANYONECANPAY`，因为捐助者知道资金将用在何处，因此对输出进行签名。\n\n\
  在这种情况下，一个人将创建一个包含所有输入和输出的原始交易消息，供每个人签名，然后发布最终的签名交易。\n\n这可以从下图理解：\n\n![](img/Figure-11.51.jpg)\n\
