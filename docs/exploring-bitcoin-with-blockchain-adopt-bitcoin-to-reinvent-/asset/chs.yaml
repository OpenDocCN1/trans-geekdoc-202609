  \n#### 隔离见证作为扩容方案\n\n隔离见证增强功能最终也允许区块大小超过 1 MB。它改变了我们计算交易字节大小的方式，现在称为权重。以权重计算的新区块大小限制为\
  \ 4MB。实际最大区块大小并非真正的 4MB；它要小得多。它介于 2 到 3 MB 之间。以下是我们计算权重的方法：\n\n`weight = (4 * sizeof\
  \ ([版本][输入计数][输入][输出计数][输出] [锁定时间])) + sizeof ([segwit 标记][segwit 标志] [见证数据])`\n\
  \n矿工致力于利润最大化。对他们而言，每个字节都至关重要，他们会选择最终导致累积网络费用最大化的交易。当矿工看到 SegWit 交易时，他们知道权重才是关键，因此他们会寻找每单位权重支付比特币最多的交易。\n\
  \n我们利用交易结构图以及关于 `txid`、`wtxid` 和 `weight` 的知识，编写一个程序来解析 SegWit 交易并计算这些值：\n\n```\n\
