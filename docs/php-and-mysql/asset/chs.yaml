  \n## 30.3 其他方案\n\n尽管 `GD` 2 是 `PHP` 中的标准图形库，但它绝不是唯一的解决方案。我们在这里简要介绍其他几个。\n\n### 30.3.1\
  \ ImageMagick\n\nImageMagick ([www.imagemagick.org](http://www.imagemagick.org))\
  \ 是最著名的图像处理库之一。它也经常与 `PHP` 一起使用。如果你在过滤器和图像处理领域更多功能，使用 `ImageMagick` 是有意义的。`ImageMagick`\
  \ 还提供了非常好的转换机制。\n\n`PHP` 中有一个用于连接 `ImageMagick` 的 `PECL` 包，可以在 [`s-prs.co/v602285`](http://s-prs.co/v602285)。文档可以在\
  \ [`s-prs.co/v602286`](http://s-prs.co/v602286)找到。Windows 的二进制文件可以在 `ImageMagick`\
  \ 官方网站获取。当前要求是 `PHP` 5.4.0 或更高（这很容易）以及 `ImageMagick` 6.5.3 或更高版本。\n\n### 注意\n\n\
  许多主机已经安装了 `ImageMagick` 或 `GraphicsMagick`（见下一节）。如果你需要高级的图像处理，请注意此点。\n\n### 30.3.2\
  \ GraphicsMagick\n\n`GraphicsMagick` 是最初基于 `ImageMagick` 的变体。这里也提供一个 `PECL` 包，它基于\
  \ `GraphicsMagick` API 访问 `GraphicsMagick` 安装（[`s-prs.co/v602287`](http://s-prs.co/v602287)）。\n\
  \n当前要求是 `PECL` 包版本 2.0.5、`PHP` 7.0.1 或更高以及 `GraphicsMagick` 1.3.17 或更高版本，但 `PECL`\
  \ 扩展仍作为分支 1.1 适用于 `PHP` 5。你可以在 [`s-prs.co/v602244`](http://s-prs.co/v602244) 找到文档。\n\
  \n### 30.3.3 NetPBM\n\n`NetPBM` 也值得关注。该库起源于 `Perl`，现在 SourceForge ([`s-prs.co/v602288`](http://s-prs.co/v602288))\
  \ 上找到。该库的优势之一是其格式转换的功能。\n\n# 31 使用 PHP 处理 PDF\n\n`PDF` 文档在网上用于较长的文档、合同、发票等。本章将向如何使用\
  \ `PHP` 创建和编辑 `PDF` 文档。\n\n通过便携文档格式 (`PDF`)，`Adobe` 创建了一个里程碑。该格式被认为是跨平台的，并且在不同平台上的看起来是相同的。这种成功是如何实现的？`PDF`\
  \ 最初是 `Adobe` 联合创始人 `John Warnock` 的一个项目。`Adobe` 希望找到一种能够实现其无纸化办公室愿景的格式。开发者们查看了\
  \ `Adobe` 已经拥的东西：`PostScript` 和 `Illustrator`，它们是兼容并且已经运行在 Mac 和 Windows 上。`PDF`\
  \ 随后被开发为改进的 `PostScript` 版本。自 1992 年第一个版本发布以来，发生了很多变化：`PDF` 现在支持数字权限管理，143，可以插入注释，并且文档可以搜索。查看\
  \ `PDF` 文件的 `Acrobat Reader` 现在已适用于移动设备。现在还有大量用于创建和显示 `PDFs` 的免费工具。这就是使用 `PDF` 的足够理由。特别是对于发票等文件，`PDF`\
  \ 也是被认为具有合理法律约束力的格式。现在，当然你可以从 `Adobe` 购买 `Acrobat`，使用另一个工具，结果都是静态的 `PDF`。但作为一名 Web\
  \ 开发者，你知道静态是不好的；一切都必须是动态的。要在服务器端生成 `PDF` 文档，你可以查找 `PDF` 规范 ([www.adobe.com/devnet/pdf_reference.html](http://www.adobe.com/devnet/pdf_reference.html))\
  \ 并自己编写输出。然而，`PHP` 提供了几个生成 PDF 文件的库——多不。。在大多数情况下，它们的工作方式相似，主要在于功能和许可证。一段时间以来，`pdfLib`\
  \ 直接作为扩展随 `PHP` 提供，但从 PHP 5.3 以后，它被外包给了 `PECL`。此外，名为 `Lite` 的开源版本已在 2011 年停止。一个非常知名且经过验证的免费替代方案是\
  \ `FPDF`。`TCPDF` 使用得更加频繁。该扩展在结合 `HTML2PDF` 时特别常见，并被许多开源 CMS 使用。我们还将简要介绍一个来自 `PECL`\
  \ 世界的扩展 `Haru`。我们将详细介绍 `TCPDF` 和 `FPDF`，以及带有示例的 `Haru`。然而，还有许多其他替代方案。这里值得进行一些研究。\n\
  \n## 31.1 准备\n\n安装是使用 PDF 最重要的准备工作。然而，拥有 `PDF` 文档结构的基础知识并没有坏。如果你已经查看了格式，你会发现处理各种库变得更容易。\n\
  \n### 31.1.1 TCPDF\n\n`TCPDF` 的官方首页是 [`tcpdf.org`](https://tcpdf.org)。然而，所有相关信息可以在\
  \ GitHub 项目页找到 [`s-prs.co/v602245`](http://s-prs.co/v602245)。\n\n### 注意\n\nGitHub\
  \ 项目页还指出 `TCPDF` 团队正在开发新版本的 `PDF` 库。你可以在 [`s-prs.co/v602246`](http://s-prs.co/v602246)\
  \ 找到该项目。\n\n在这里使用已版本的 `TCPDF`，它是 `HTML2PDF` ([`htmlpdf/default`](https://htmlpdf/default))\
  \ 的基础。该包对于生成个性化的 PDF 非常实用——例如，用于电子商务的账单。你可以轻松地使用 `Composer` 安装两个包。关于设置 `Composer`\
  \ 本身的通用信息可以在 第 38 章 找到。\n\n对于我们的示例，我们将安装 `HTML2PDF`，`TCPDF` 已经在那里了。要这样做，更改到你的目录并在控制台提示符中获取相应的包：\n\
  \n```\ncomposer require spipu/html2pdf\n```\n\n封装到 vendor 子目录。当然，如果你不需要 `HTML2PDF`，命令如下：\n\
  \n```\ncomposer require tecnickcom/tcpdf\n```\n\n### 31.1.2 FPDF\n\n从 [www.fpdf.org](http://www.fpdf.org)\
  \ 下载 `PHP` 库然后在脚本中使用它。不需要安装。\n\n### 31.1.3 Haru\n\n`Haru` 是一个基于 `Haru Free PDF`\
  \ 库的扩展。它活跃多年开发良好；然而，它目前被忽视并且不再更新。你可以在 [`s-prs.co/v602289`](http://s-prs.co/v602289)\
  \ 找到 `PECL` 包。\n\n## 31.2 TCPDF\n\n\n\n\nTCPDF 库是一个非常经典的库。它目前被许多开源系统使用，从如 Joomla!\
  \ 和 TYPO3 等内容管理系统到如 Moodle 等学习管理系统。它的优势在于对 PDF 规范极其全面的覆盖，以及对 UTF-8 的完整支持。此外，尽管年代较久，该库仍然完全面向面向对象的。\n\
  \n### 31.2.1 基础\n\n要使用 TCPDF 创建 PDF 文档，你必须先加载库本身：\n\n```\nrequire __DIR__.'/vendor/autoload.php';\
  \ \nuse Com\\Tecnick\\Pdf;  \n```\n\nTCPDF 的核心对象是 `TCPDF(orientation, unit, format,\
  \ Unicode, encoding, cache)` 类的实例：\n\n```\n$pdf = new TCPDF('P', 'mm', 'A4', true,\
  \ 'UTF-8', false);  \n```\n\n在这里，文档使用了一些中心值初始化：\n\n* `Orientation`（方向）决定文档是以纵向（`P`\
  \ 代表纵向）还是横向（`L` 代表横向）创建。\n* `Unit`（单位）代表元素定位、字体大小等的中心测量单位。标准选项是 `mm`（毫米）或 `pt`（磅）。\n\
  * `Format`（格式）是 PDF 页面的标准尺寸。通常，你可以针对单个页面更改此设置以及方向。\n* `Unicode`（Unicode 编码）决定是否使用\
  \ Unicode；它是一个布尔值。\n* `Encoding`（编码）定义编码。标准是 `UTF-8`。\n* `Cache`（缓存）指定在创建过程中是否将\
  \ PDF 缓存在硬盘上（`true`）。默认值为 `false`，因为这样性能更好。\n\n#### 注意事项\n\nTCPDF 库在内部还使用了全局常量进行页面设置，你可以相应地进行设置。示例包括：`PDF_PAGE_ORIENTATION`\
  \ 用于设置纵向或横向的页面方向，`PDF_UNIT` 用于所使用的测量单位，以及 `PDF_PAGE_FORMAT` 用于页面尺寸。\n\n接下来，定义文档的元数据。这可以通过例如\
  \ `SetTitle()` 方法来完成。还有其他 PDF 属性，如作者、关键词等：\n\n```\n$pdf->SetTitle('TCPDF Output');\
  \  \n```\n\n然后你需要决定是使用标准的 PDF 页眉、更改或扩展它，还是将其跳过。我们在这里采取简单的方法，将其跳过：\n\n```\n$pdf->setPrintHeader(false);\
  \ \n$pdf->setPrintFooter(false);  \n```\n\n接下来的设置控制页面间距和分页。对于页面间距，使用文档选择的单位来定义左侧、顶部和右侧的间距。在我们的示例中，我们在这里选择了\
  \ `0`——即没有外边距——以便在绘图时精确控制一切。\n\n`SetAutoPageBreak()` 设置指定如果内容超出当前页面，是否应该自动开始一个新的\
  \ PDF 页面。默认情况下这是合理的：\n\n```\n$pdf->SetMargins(0, 0, 0); \n$pdf->SetAutoPageBreak(true,\
  \ 0);  \n```\n\n我们正逐渐接近内容部分。然而，仍然有一些设置需要完成。通过 `SetFont()`，你决定在什么字体下使用什么字体。`AddPage()`\
  \ 还会添加第一个 PDF 页面：\n\n```\n$pdf->SetFont('Helvetica', '', 48); \n$pdf->AddPage();\
  \  \n```\n\n实际的输出通过 `Write(line height, text, link, padding, alignment)` 完成。最后的参数需要解释：只有当你想要指定链接目标时才需要\
  \ `Link`；`Fill` 期望值 `0` 表示透明，`1` 表示填充。填充颜色必须提前使用单独的 `SetFillColor()` 方法设置。（关于此的更多信息请见\
  \ Section 31.2.2。最后最后对齐是一个字符串，允许左对齐（`L`）、右对齐（`R`）、居中（`C`）或两端对齐（`J`）选项：\n\n```\n\
  $output = 'Your statement!'; \n$pdf->Write(0, $output, '', 0, 'C');  \n```\n\n使用\
  \ `Ln()` 方法，你现在可以插入新行，以便后续内容出现在下一行。由于我们这里只输出了一行，所以并不一定需要这个。\n\n现在我们基本上已经准备好了一切，只需在最后输出生成的\
  \ PDF 文档。使用 `I`，如果可能，输出将通过浏览器插件直接在浏览器中进行；`D` 尝试在浏览器中强制下载；使用 `F` 则将其保存为服务器上的文件。如果文件由你或用户从浏览器保存，则名称是必要的。方法决定了\
  \ TCPDF 如何交付 PDF。\n\n```\n$pdf->Output('output.pdf', 'I');  \n```\n\n接下来的列表显示了整个脚本的概述；Figure\
  \ 31.1 显示了输出。\n\n```\nrequire __DIR__.'/vendor/autoload.php'; \nuse Com\\Tecnick\\\
  Pdf;\n\n$pdf = new TCPDF('P', 'mm', 'A4', true, 'UTF-8', false);\n\n$pdf->SetTitle('TCPDF\
  \ Output'); \n$pdf->setPrintHeader(false); \n$pdf->setPrintFooter(false);\n\n$pdf->SetMargins(0,\
  \ 0, 0); \n$pdf->SetAutoPageBreak(true, 0);\n\n$pdf->SetFont('Helvetica', '', 48);\n\
  $pdf->AddPage();\n\n$output = 'Your statement!'; \n$pdf->Write(0, $output, '', 0,\
  \ 'C');\n\n$pdf->Output('output.pdf', 'I');  \n```\n\n**Listing 31.1** 使用 TCPDF\
  \ 的第一个文档 (\"tcpdf_basics.php\")\n\n![The First Document](img/img-f31.1.html) \n\n\
  **Figure 31.1** 第一个文档\n\n### 31.2.2 单元格\n\n到为止，你使用了 `Write()` 函数逐行输出文本。还有将文本放置在所谓的单元格中的选项。最简单的方法是\
  \ `Cell(Width, Height, Text, Border, PositionAfter, Alignment, Fill)`。让我们仔细观察这些值，它们也适用于元素：\n\
  \n* `Width` 使用文档选择的单位指定宽度。如果是 `0`，单元格扩展到右边缘或右边缘的距离。\n* `Height` 指定单元格的高度。如果指定为 `0`，则适应文本高度。\n\
  * `Text` 是实际内容。\n* `Frame` 指定是否显示边框（值 `1`）或不显示（值 `0`）。或者，可以在此处输入字符串值来显示四边的边框（`L`\
  \ 代表左侧、`T` 代表顶部、`R` 代表右侧、`B` 代表底部）。你可以使用单独的 `SetStyle()` 方法控制边框的外观。\n* `PositionAfter`\
  \ 控制下一个元素在文档流中的插入位置。此技术术语是光标，通过此选项设置。它可以位于元素的右侧（默认值 `0`）、在下一行继续（值 `1`）、或者在当前元素下方继续（值\
  \ `2`）。\n* `Alignment` 控制单元格内的文本对齐，值为 `L` 左对齐（默认）、`C` 居中和 `R` 右对齐。\n* `Filling`\
  \ 指定是否为填充（值 `1`）或否（默认值 `0`）。你使用 `SetFillColor()` 控制填充颜色本身。该方法接受 RGB 颜色值作为参数。以下示例创建一个蓝色填充：\n\
  \n```\n$pdf->SetFillColor(0, 0, 255);\n```\n\n* `Link` 可包含链接 URL。\n* `Scaling` 控制单元格中文本的水平缩放。默认情况下，缩放被禁用（默认值\
  \ `0`）。因此该参数也控制字母之间的间距。例如，值 `2` 默认将字母缩放以适应整个单元格宽度。\n\n#### 注意事项\n\n`MultiCell()`\
  \ 方法也创建单元格，但具有动态文本换行功能。你可以在 Section 31.2.4 中看到此方法的用法。以下示例创建一个带有蓝色背景和大型文本的单元格；Figure\
  \ 31.2 显示了输出。\n\n\n\n\n\n```php\nrequire __DIR__.'/vendor/autoload.php'; \nuse Com\\\
  Tecnick\\Pdf;\n\n$pdf = new TCPDF('P', 'mm', 'A4', true, 'UTF-8', false);\n\n$pdf->SetTitle('TCPDF\
  \ Output');\n\n$pdf->setPrintHeader(false); \n$pdf->setPrintFooter(false);\n\n$pdf->SetMargins(0,\
  \ 0, 0); \n$pdf->SetAutoPageBreak(true, 0);\n\n$pdf->SetFont('Helvetica', '', 48);\
  \ \n$pdf->AddPage();\n\n$output = 'Your statement!';\n\n$pdf->SetFillColor(0, 0,\
  \ 255); \n$pdf->Cell(0, 50, $output, 1, 0, 'C', 1, '', 0);\n\n$pdf->Output('output.pdf',\
  \ 'I');  \n```\n\n列表 31.2. 简单的文本框 (\"tcpdf_draw.php\")\n\n![带有背景颜色的文本框](img/img-f31.2.html)\n\
  \n图 31.2. 带有背景颜色的文本框\n\n### 31.2.3 线与点\n\nPDF 这种格式也具有创建矢量图形以及使用点和样式绘制形状和线条的能力。我们将创建一个包含自绘房屋的简单示例。它由一个矩形（我们使用\
  \ `Rect()` 方法创建它）和一个三角形（我们使用 `Polygon()` 方法绘制它）组成。\n\n### 注意\n\nTCPDF 支持一系列其他形状，例如使用\
  \ `Circle()` 绘制圆形，使用 `Line()` 绘制线条，甚至使用 `Curve()` 绘制贝塞尔曲线。在这里非常值得进行一些实验。\n\n在接下来的示例中，我们首先为屋顶创建了中心点——即三角形的顶点。第三个坐标也形成了矩形的左上角：\n\
  \n```php\n$a1 = [105, 60]; \n$a2 = [200, 140]; \n$a3 = [10, 140];  \n```\n\n接下来是一个带有数组的中心变量。该数组反过来包含了线条样式的索引-值组合。这些包括线条的粗细（`width`）、末端和连接处的格式（`cap`\
  \ 和 `join`）、线条的虚线设置（`dash` 和用于虚线起始的 `phase`），最后同样重要的是，作为带有 RGB 值的数组的颜色：\n\n```php\n\
  $line = array('width' => 0.8, 'cap' => 'butt', 'join' => 'bevel', \n'dash' => '10,5,15,5',\
  \ 'phase' => 5, 'color' => array(0, 0, 255));  \n```\n\n最后的准备是创建一个用于填充的颜色：\n\n```php\n\
  $color = array(200, 200, 200);  \n```\n\n然后就是绘图的时间了。我们使用 `Polygon(PointsArray, Rendering,\
  \ Line, FillColor, Closed)` 方法从三角形开始。最重要的参数是包含点的数组。后面是渲染样式，其中 `DF` 代表绘制（draw）和填充（fill）。对于线条，你可以通过逐渐设置从\
  \ 0 开始的索引，为每个单独的多边形段定义独立的样式。使用 `all` 索引，可以一次性定义所有多边形段的样式。下一个参数定义为数组的填充颜色，这里使用的最后一个参数确保多边形是闭合的（值为\
  \ true）：\n\n```php\n$pdf->Polygon([$a1[0], $a1[1], $a2[0], $a2[1], $a3[0], $a3[1]],\
  \ \n'DF', ['all' => $line], $color, true);  \n```\n\n房屋的子结构使用 `Rect(x, y, width,\
  \ height, rendering, line, fill color)` 方法创建。你将在这里识别出在 `Polygon()` 中使用过的参数：\n\n\
  ```php\n$pdf->Rect($a3[0], $a3[1], $a2[0] - $a3[0], 80, 'DF',\n['L'=>$line, 'R'=>$line,\
  \ 'B'=>$line], $color);  \n```\n\n接下来的列表显示了示例的中间部分，图 31.3 显示了输出。\n\n```php\n//Title:\
  \ \n$output = 'Draw'; \n$pdf->SetFillColor(0, 0, 255); \n$pdf->Cell(0, 50, $output,\
  \ 1, 0, 'C', 1 );\n\n$a1 = [105, 60]; \n$a2 = [200, 140]; \n$a3 = [10, 140];\n\n\
  $line = array('width' => 0.8, 'cap' => 'butt', 'join' => 'bevel', \n'dash' => '10,5,15,5',\
  \ 'phase' => 5, 'color' => array(0, 0, 255)); \n$color = array(200, 200, 200);\n\
  \n//roof \n$pdf->polygon([$a1[0], $a1[1], $a2[0], $a2[1], $a3[0], $a3[1]], 'DF',\
  \ ['all' => $line], $color, true);\n\n//House \n$pdf->Rect($a3[0], $a3[1], $a2[0]\
  \ - $a3[0], 80, 'DF', ['L'=>$line, 'R'=>$line, 'B'=>$line], $color);\n\n$pdf->Output('output.pdf',\
  \ 'I');  \n```\n\n列表 31.3. 多边形和矩形（节选 \"tcpdf_draw.php\"）\n\n![一个简单的房子](img/img-f31.3.html)\n\
