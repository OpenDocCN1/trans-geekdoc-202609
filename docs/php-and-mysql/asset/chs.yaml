  \ 40.1.2 新功能\n\nPHP 经常被指责在某些领域增长得非常“有机”，包括不一致的 API。为了在将来避免这种指责，PHP 项目定义了一个在添加新功能之前必须遵循的流程。整个过程被称为意见征求（Request\
  \ for Comments, `RFC`），可以在 `https://wiki.php.net/rfc`（概述；参见图 40.7）和 `https://wiki.php.net/rfc/howto`（逐步步骤）。本质上，该流程如下：\n\
  \n1. 为 PHP 构一个新的、有用的功能。\n2. 向 `internals@php.net` 发送邮件并描述你的想法。\n3. 如果没有被拒绝，则制定一个\
  \ `RFC`（通常是一个想法加上一个实现方案）并将其公开供讨论。\n4. 在讨论以及（必要时）进行一些调整后，将对你的 `RFC` 进行投票。\n5. 如果成功，你的代码将被添加到\
  \ PHP 中。\n\n#### 扩展阅读\n\nChristopher Jones 在 `http://s-prs.co/2258` 制定了一份相当详细的 `RFC`\
  \ 指南，比官方页面还要深入。Ben Ramsey 成功地通过了 `RFC` 并在幻灯片中描述了该过程，你可以在 `http://s-prs.co/2259`\
  \ 查看。\n\n![处于不同阶段的当前 RFC（协调等）](img/img-f40.7.html)\n\n**图 40.7** 处于不同阶段的当前 RFC（协调等）\n\
  \n### 40.2 更多选项\n\n然而，PHP 项目提供了多种在没有知识的情况下贡献的方法。`php.net/get-involved` 上的 `Get Involved`\
  \ 页面列出了方法：\n\n1. 你可以使用 PHP 运行测试套件。出现错误了吗？它们已经在错误跟踪器中报告了吗？\n2. 如果测试出现错误，是测试本身的问题，还是\
  \ PHP 确实存在错误？这种分析以及可能对测试（或 PHP）的修复非常有用。PHP 质量保证团队在 `php.net/write-test.php` 提供了关于编写测试的进一步信息。\n\
  3. 在错误跟踪器中提交漏洞（我们在本章中已经提到几次）。\n4. 扩展或翻译。\n\n我们想提到第五个我们非常关心的选项。PHP 基金会是由来自 PHP 环境的几家公司和个人创立的，旨在让开源项目更加稳定，特别是由于了\
  \ Zend 的参与，尤其是微软（它在其他方面长期支持 PHP 版本）的参与。该组织不仅促进 PHP，还支持 14 兼职开发者。如果你或你的公司从 PHP 中受益，回馈一些什么不是个坏主意吗？请访问项目网站\
  \ `https://php.foundation`（参见图 40.8）。无论你如何参与 PHP，即使你使用它：这是让项目变得更大、更成功的唯一方式。非常感谢！\n\
