  \n**图 31.5** HTML 输出被转换为 PDF\n\n## 31.3 FPDF\n\nFPDF 中的第一个 \"F\" 代表 free（免费）。这也是该库的真正动力——因为坦率地说，大多数网络项目都是商业性的。即使是爱好网站通常也有一一两个横幅，因此符合非商业的定义。然而，特别是较小的网站会不愿在\
  \ PDF 上花钱。这就是我们需要仔细研究 FPDF 的原因。\n\n### 注意\n在 [www.fpdf.org](http://www.fpdf.org)，你不仅可以找到\
  \ FPDF 本身，还能找到一份实用的手册。\n\n### 31.3.1 基础\n\n由于 FPDF 基于 PHP，你只需要集成相应的类即可。该操作是面向对象的且非常简单。你通过\
  \ `FPDF` 对象定义 PDF 文档，并指定格式作为参数：\n\n```php\n$pdf = new FPDF(\"P\", \"pt\", \"A5\"\
  );\n```\n\n然后继续使用该对象的方法：\n\n```php\n$pdf->AddPage();\n$pdf->SetFont(\"Helvetica\"\
  , \"\", 48);\n$pdf->Cell(20,10, \"Your statement!\");\n```\n\n最后，使用 `Output()` 方法输出所有内容。列表\
  \ 31.6 显示了完整的示例，你可以在 图 31.6 中看到其输出。\n\n```php\n<?php\ndefine(\"FPDF_FONPATH\", \"\
  font/\");\nrequire \"fpdf/fpdf.php\";\n\n$pdf=new FPDF(\"P\", \"pt\", \"A5\");\n\
  $pdf->AddPage();\n$pdf->SetFont(\"Helvetica\", \"\", 48);\n$pdf->Cell(20,10, \"\
  Your statement!\");\n$daten = $pdf->Output();\nheader(\"Content-type:application/pdf\"\
  );\nheader(\"Content-disposition:inline;filename=output.pdf\");\nprint $daten;\n\
  ?>\n```\n\n**列表 31.6** 使用 FPDF 的第一个文档 (`fpdf_basics.php`)\n\n![第一个文档](img/klein31_006.png)([img-f31.6.html](http://img-f31.6.html))\n\
  \n**图 31.6** 第一个文档\n\n### 注意\nFPDF 有一些特殊功能。例如，与大多数图形程序一样，默认点位于左上角。你也可以非常灵活地选择单位。\n\
  \n### 31.3.2 绘制\n\n使用 FPDF 绘图也非常简单。以下列表中的两行代码就足够创建一个背景填充矩形（请参见 图 31.7）。\n\n```php\n\
  $pdf->SetFillColor(51, 0, 255);\n$pdf->Rect(0, 0, 421, 70, \"F\");\n```\n\n**列表\
  \ 31.7** 绘制矩形（节自 \"fpdf_draw.php\"）\n\n在这里，第一步中设置填充颜色也很重要，因为它将用于后续操作。在第二步中，根据坐标、宽度和高度创建矩形。\n\
  \n### 注意\n你可以在 FPDF 网站找到许多其他绘图任务的有用示例和脚本：[www.fpdf.org/en/script/index.php](http://www.fpdf.org/en/script/index.php)。\n\
  \n![带有 FPDF 的背景矩形](img/klein31_007.png)([img-f31.7.html](http://img-f31.7.html))\n\
  \n**图 31.7** 带有 FPDF 的背景矩形\n\n## 31.4 结论\n\n生成 PDF 文档可能非常复杂，因为你需要手动绘制元素和对象。但基础知识是简单的，且在不同的库之间是类似的。因此，偏好哪种库取决于个人口味。在开源库中，我们主要使用\
  \ `TCPDF`，因为它连接到 `HTML2PDF`，这种选项使得快速创建输出变得非常容易\n\n# 第七部分 管理与安全\n\n## 32 安全\n\n据称，十个网站中有九个存在安全漏洞。本章帮助你尽可能避免安全漏洞。\n\
  \n一种观点认为，Web 应用程序最大的不确定因素是操作系统或 Web 服务器软件（或服务器端技术）。遗憾的是，这是错误的。Web 服务器和操作系统由其制造商维护，安全漏洞会被修复——有时快，有时较慢。新版本的服务器技术（特别是\
  \ `PHP`）也会定期发布。例如，在 `PHP 8.3.0` 发布大约四周后，发布了修复漏洞的版本 `8.3.1`，随后在大约四周后又发布了 `8.3.2`。\n\
  \n主要问题既不在管理员也不在软件提供者。问题通常在于 Web 应用程序背后的开发团队。同样的错误总是在发生，而大多数错误不需要费太大精力就可以避免。\n\n\
  PHP 的安全主题可以写满半本书，因此我们在这里只涵盖最核心的几点。但请放心：如果你遵循本章中的建议，你的网站将更加安全，并对大多数攻击产生免疫。然而，并没有所谓的“完全安全的网站”。请不断检查你的代码并分析服务器的日志文件，以了解敌人的攻击方法。\n\
  \n首先，访问开放 Web 应用安全项目（OWASP）的网页是值得的。该项目背后是一群处理网络安全问题的志愿者。OWASP 以其定期发布的网站十大常见安全漏洞列表而闻名（即大约每三到四年发布一次；请参见\
  \ 图 32.1）。\n\n你可以在 [`owasp.org/Top10`](https://owasp.org/Top10) 查看此列表。2021 年列表（截至\
  \ 2025 年初仍是最新版本，但同年晚些时候发布后续版本的计划已经在进行）包含以下内容：\n\n1. 访问控制不足\n2. 密码学错误\n3. 注入和跨站脚本\
  \ (XSS)\n4. 不安全的设计\n5. 安全配置\n6. 使用过时或不安全的组件\n7. 身份识别和验证不足\n8. 软件和数据完整性不足\n9. 日志和监控不足\n\
  10. 服务器端请求伪造 (SSRF)\n\n\n\n\n我们稍后将转向列表中更有趣的点，但列表本身已经包含了丰富的信息。列表中的几乎所有点都主要与疏忽的编程有关。无论管理员对服务器的加固有多好，通过疏忽的编程都可能毁掉整个概念。服务器的配置可能使得外部人员没有任何权限，但如果攻击者接管了一个网站呢？Web\
  \ 应用可能有足够的权限将服务器用于阴险的目的是。因此，请仔细地编写程序，预想最坏的情况——并继续读下去！\n\n## 32.1 用户输入\n\n几乎所有的安全漏洞都与这样一个事实有关：信息从外部传输到\
  \ Web 应用，这极大地干扰了它。这可以通过非常简单的方式实现。想象你创建了一个内容管理系统，通过该系统为用户提供了编辑文章的机会：\n\n```\n<a href=\"\
  edit.php?id=23\">编辑文章 #23</a> \n<a href=\"edit.php?id=24\">编辑文章 #24</a> \n<a href=\"\
  edit.php?id=27\">编辑文章 #27</a>  \n```\n\n在示例中，当前用户创建了文章 23、24 和 27，并获得了编辑这些特定文章的链接。但当用户访问\
  \ `edit.php?id=25` 页面时会发生什么呢？在一个安全的系统中，系统会检查用户是否有权限这样做。然而，在太多的系统中，这种检查并没有发生。在本书研究的一项测试期间，网络上的两个示例特别引起了我的注意：\n\
  \n- 使用这种技术，可以“作弊”进入一个实际上已经售罄的活动。注册网站的运营者认为，简单不显示售罄活动的注册链接是足够安全的。然而，该链接在其他页面上以 `registration.php?id=<event\
  \ number>` 的形式存在。\n- 在一次专业会议上，一个来自（友好的）PHP 开发者的演示提案可以被轻微修改。在这里，同样可以通过 URL 中的参数进行访问。\n\
  \n如果不回顾过去的一段黑暗篇章，PHP 和安全的话题就无法被完全涵盖。正如我们在第 13 章中提到的，像 `$_GET` 和 `$_POST` 这样的全局数组在很久以前就被引入了。曾经非常流行的\
  \ `register_globals`——一个将 HTTP 数据转换为全局变量的功能——在某个次要版本中 `php.ini` 中被自动设置为 `Off`（并在之后完全删除——这是一个好主意！）。但为什么呢？下面的代码列表提供了一个说明性示例。\n\
  \n```php\n<?php\n  if (isset($_POST[\"user\"]) && \n      isset($_POST[\"password\"\
  ]) && \n      $_POST[\"user\"] == \"Christian\" && \n      $_POST[\"password\"]\
  \ == \"*secret*\") {\n    $loggedIn = true;\n  }\n\n  if ($loggedIn) {\n    echo\
  \ \"Here is the secret info ...\";\n  }\n?> \n```\n\n```html\n<html\n<head>\n  <title>Login</title>\n\
  </head>\n<body \n<form method=\"post\" action=\"\">\n  Username: <input type=\"\
  text\" name=\"user\" /><br />\n  Password: <input type=\"password\" name=\"password\"\
  \ /><br />\n  <input type=\"submit\" value=\"Login\" />\n</form>\n</body>\n</html>\
  \  \n```\n\n**代码列表 32.1** 一个糟糕的登录页面（\"login.php\"）\n\n该页面检查指定的用户名和密码，如果它们匹配则显示相应的消息（如你所见，示例被大程度上简化了）。但如果你仔细观察，你会发现代码中一个严重的设计错误。程序员假设\
  \ `$loggedIn` 变量没有被初始化，因此其值为 `false`。但如果 `register_globals` 被设置为 `On`，那么它就会被绕过。该页面检查指定的用户名和密码，如果它们匹配则显示相应的消息（如你所见，示例被大程度上简化了）。但如果你仔细观察，你会发现代码中一个严重的设计错误。程序员假设\
