  \ 作为 CGI：通用网关接口（Common Gateway Interface）是让 Web 服务器上启用服务器端编程最早的方法之一。在早期，CGI 几乎是\
  \ Perl 的代名词。PHP 可以作为 `CGI` 模块在几乎任何 Web 服务器上执行。FastCGI（`fastcgi.com` 网站已失效，但在 [`fastcgi-archives.github.io`](https://fastcgi-archives.github.io)\
  \ 有存档备份）是 `CGI` 的扩展，提供了更好的性能，且现在已几乎获得全球的接受。这是首选的变体，尤其是在 Windows 环境下。\n\n![将 PHP\
  \ 集成到 Web 服务器至关重要](img/img-f2.1.html) \n\n**图 2.1**    将 PHP 集成到 Web 服务器至关重要\n\n\
  `SAPI` 和 `CGI` 两种变体都提供了 PHP。你可以从官方首页 [www.php.net](http://www.php.net) 获取 PHP。PHP\
  \ 以源码形式提供。当然，这必须先进行编译。这在 Linux 中是常见做法，但大多数 Linux 发行版也提供现成的软件包（如 `RPM` 或 `DEB` 文件）。对于\
  \ Windows，还有二进制文件——即编译后的版本——你可以更方便地安装它们。\n\n### 注意\n由于即使是版本号的微小变化通常也包含安全更新，你应该定期更新你的测试系统。然而，你（自己的或租用的）Web\
  \ 服务器上的版本号是决定性的。顺便说一下，每次版本更改，你都应该先查看最重要的更改，即所谓的变更日志（changelog）。有时函数的行为会发生变化，你需要在脚本中进行调整，或者\
  \ `php.ini` 配置文件中添加新的安全设置。\n\n自动安装程序也促进了 PHP 的传播。在 Windows 上，它们作为包含 `Apache` 和 `MySQL`\
  \ 或 `MariaDB` 的包提供；对于 Linux，提供了各种版本的 `RPM` 或 `DEB` 软件包。安装程序非常实用，这就是为什么我们将介绍其中一些。不过，手动安装也没有坏。你的优势是可以更方便、更快速地更新\
  \ PHP。\n\n### 2.1.1 PHP 的结构\n在接下来的章节中阅读更多关于在不同操作系统上安装 PHP 的信息之前，仔细观察 PHP 的结构是非常重要的。\n\
  \nPHP 的起点是 `SAPI` 或 `CGI` 模块。所有的设置都存储在 `php.ini` 文件中。这个文本文件是重要设置的关键点。配置文件中的设置也称为指令（directive）。\n\
  \n### 注意\nPHP 是一种脚本语言，也可以在控制台中运行。此控制台版本包含在安装包中，称为命令行界面（`CLI`）版本。你可以在 [www.php.net/manual/features.commandline.php](http://www.php.net/manual/features.commandline.php)\
  \ 了解更多信息。\n\n当 PHP 以模块形式安装时，Web 服务器加载时 PHP 会调用 `php.ini` 文件。使用 `CGI` 版本或控制台版本，`php.ini`\
  \ 会在每次调用时被包含。在 Linux 下，它默认位于 `/usr/local/lib` 目录。然而，你应该在编译 PHP 时通过以下设置来更改此位置：\n\n\
  ```\n--with-config-file-path=/etc\n```\n\n`etc` 文件夹是 Linux 下配置文件的标准文件夹，因此通常是最佳选择。你必须重命名\
  \ PHP 提供的 `php.ini` 模板文件之一（`php.ini-development` 和 `php.ini-production`）为 `php.ini`\
  \ 并将其移动到该文件夹以便使用。\n\n在 Windows 下，PHP 也提供了两个 `php.ini` 模板文件。其中一个必须被重命名为 `php.ini`。默认情况下，`php.ini`\
  \ 位于 PHP 程序目录（对我们来说是 `C:\\php`）。如果存在多个 `php.ini`，优先使用哪一个取决于 PHP 自身的搜索序列。这在 Windows\
  \ 中的顺序如下：\n\n*   仅适用于 `Apache` 2 及更高版本：`httpd.conf` 中 `PHPIniDir` 指令指定的目录\n*   注册表项路径：`HKEY_LOCAL_MACHINE\\\
  SOFTWARE\\PHP\\IniFilePath`\n*   环境变量或系统变量 `PHPRC`\n*   `PHP-CLI` 目录或 Web 服务器 `SAPI`\
  \ 模块的目录（仅在 `Apache` 下可正常工作）\n*   Windows 目录 (`C:\\Windows`)——尽管不建议，因为该目录通常不应由用户写入，但你确实会经常更改\
  \ `php.ini`\n\n### 注意\n`php.ini` 中的设置可以在 [www.php.net/manual/ini.php](http://www.php.net/manual/ini.php)\
  \ 找到。但在本书中，有一个专门的章节介绍 `php.ini`（第 34 章）。\n\n### 2.1.2 Windows\n提供现成的 Windows 版本\
  \ PHP 是 PHP 早期成功因素之一。当然，主机主要使用 `Linux` 和 `Apache` 作为它们的 Web 服务器，但大多数爱好者和专业开发者在家里电脑上仍使用\
  \ Windows。同时，使用如 `XAMPP` 等现成包进行安装是一个稳健且流行的替代方案。你也会在本章节中找到手动安装说明。\n\n### 注意\n本书的原始版本基于\
  \ PHP 8.3。PHP 8.4 在编写本书的后期已发布，但重点仍是 8.3。\n\n#### Web 服务器\nWindows 下可以使用多种 Web 服务器。最重要的包括：\n\
  \n*   Internet Information Services (`IIS`) 是微软提供的“专业” Web 服务器。它随大多数 Windows 版本一起。\n\
  \n    ![IIS 已安装](img/img-f2.2.html) \n\n    **图 2.2**   IIS 已安装\n\n    你可以在 Windows\
  \ 10/11 的“启用或关闭 Windows 功能”中检查是否已安装。如果 IIS 缺失，点击它。双击打开更多选项。在“开发功能”下，确保已安装 `ISAPI`\
  \ 和 `CGI`。\n\n*   Windows 版 `Apache` 是市场领导者的 Windows 端口。最新版本属于 2.x 分支。两个版本的二进制文件可以在\
  \ [`httpd.apache.org`](https://httpd.apache.org) 以及 PHP 项目推荐的 [`www.apache lounge.com/download`](https://www.apache\
  \ lounge.com/download) 获取。\n\n如果你安装了 Web 服务器，通常可以通过 `http://localhost/` 或 `http://127.0.0.1/`\
  \ 本地访问。本书中的所有 PHP 示例都位于 `php` 子文件夹中。相应的 URL 如下：\n\n```\nhttp://localhost/php/\n\
  ```\n\n如果你为 Web 服务器使用了非默认端口 80，则必须也指定端口：\n\n```\nhttp://localhost:8080/php/\n```\n\
  \n#### 安装软件包\n由于 `Apache`、`PHP` 和 `MySQL`（或者是 `MariaDB`）经常一起使用，某些项目提供了自动安装程序。一个很大的好处是你可以卸载整个安装包。然而，某些软件包落后于较新的\
  \ PHP 版本，特别是对于 PHP 8.3（尽管在编写这些文字到你阅读它们之间可能发生了很多变化）。以下是我们认为目前可用的三个安装包：\n\n\n\n\n\n\
  *   XAMPP 无疑是最广著名的项目（[`www.apachefriends.org/index.html`](https://www.apachefriends.org/index.html)）。它的巨大优势是支持\
  \ Linux、Windows 和 macOS。安装包不仅包含所有的扩展，还包含一个开箱即用的 PEAR。11 它的更新也非常频繁。你也可以在 [`sourceforge.net/projects/xampp/files`](http://sourceforge.net/projects/xampp/files)\
  \ 找到旧版本。不过，XAMPP 的配置对于生产运行并不理想，因此它主要作为本地开发平台。尽管如此，该项目尚未更新 PHP 8.3 版本（参见图 2.3）。顺便提一下，XAMPP\
  \ 安装的是 MariaDB 而不是 MySQL，这在最初对功能没有显著影响。\n\n*   EasyPHP Devserver ([[www.easyphp.org](http://www.easyphp.org))\
  \ 适用于开发和生产运行。通过此包，PHP 版本非常容易配置，还可以安装额外的包。（在出版时，当前版本 17.0 仅包含 PHP 7；然而，PHP 8.3 可以作为额外的组件安装。）\n\
  \n*   源自法国的项目 WampServer ([[`www.wampserver.com/en`](https://www.wampserver.com/en))\
  \ 也非常有名名。（在出版时，它已经支持 PHP 8.3。）\n\n    ![XAMPP 尚未支持 PHP 8.3（撰写时）](img/img-f2.3.html)\n\
  \n    **图 2.3** XAMPP 尚未支持 PHP 8.3（撰写时）\n\n#### 注意事项\n\n如果例如，IIS（或其他 Web 服务器）已经在\
  \ 80 端口运行，而你又使用一个也将将 Apache 设置为 80 端口的自动安装程序，就会出现问题。在这种情况下，你必须停止另一个 Web 服务器或将 Apache\
  \ 设置为不同的端口。对于 Apache，这可以在 `httpd.conf` 配置文件中完成，你可以在 `conf` 文件夹中找到它。\n\n### 手动安装\n\
  \n现在我们来介绍手动安装。然而，如果你想对使用软件包的安装进行更改，本节的基本原理和步骤同样适用。这里的划分是基于 Web 服务器的。\n\n对于生产系统——即连接到互联网并在那里执行任务的\
  \ Web 服务器——在 90% 的情况下，手动安装是唯一合适的方法。在处理 `php.ini` 中的配置设置时，你需要极其小心。大多数安装程序或安装包自带的\
  \ `php.ini` 的设置对于生产系统来说过于宽松了。\n\n#### IIS\n\n以下安装描述基于一个尚未安装 PHP 的系统。这里显示的变体基于 PHP\
  \ 在线官方文档中的新描述，因为它提供了最好且最快的更新性。在这里，PHP 仅集中保留在一个文件夹中，而在之前的安装中，`php.ini` 文件最终总是位于 Windows\
  \ 目录，而其他扩展也必须复制到那里，或者（不建议）复制到 `System32`。\n\n#### 注意事项\n\n对于配合 IIS，建议 CGI 变体使用非线程安全\
  \ (NTS) 版本的 PHP。通常，出于性能考虑，几乎只使用 FastCGI 版本。\n\n要安装 PHP，请遵循以下步骤：\n\n1.  下载包含 PHP\
  \ 8.3 Windows 二进制文件的 ZIP 文件。你可以在 [`windows.php.net/download`](http://windows.php.net/download)\
  \ 找到 Windows 下载。你必须使用非线程安全版本，并决定是在 `x86` 还是 `x64` 系统上运行。你还需要 Visual Studio 2019\
  \ Visual C++ Redistributable 包（或 PHP 8.4 的 Visual Studio 2022 Visual C++ Redistributable）来运行\
  \ PHP——下载页面上有一个小且容易被忽略的提示。你可以在 [`s-prs.co/v602204`](http://s-prs.co/v602204) 找到它，在那里你必须选择你要安装\
  \ PHP 的处理器架构（32 位或 64 位）。\n\n2.  为 PHP 创建新文件夹。我们在此假设默认路径是 `C:\\php`。\n\n3.  将 ZIP\
  \ 文件的内容解压到此文件夹。注意：ZIP 不再自动包含 `php` 文件夹！这就是为什么我们在上一步中创建了它。\n\n4.  这里是简要清单：PHP 的 CGI\
  \ 版本被称为 `php-cgi.exe`，而不是 `php.exe`。后者 `php.exe` 是控制台版本，默认就在 PHP 的主文件夹中。SAPI 文件是\
  \ `php8.dll`。然而，如前所述，它不再建议用于 IIS。如前文所述，`php.ini` 文件仅在标准包中可用，并以两个模板的形式存在：`php.ini-development`\
  \ 和 `php.ini-production`。前者更多为测试系统设计，后者用于生产系统。然而，你通常需要自己进行更改。\n\n5.  将提供的两个 `php.ini`\
  \ 模板文件之一重命名为 `php.ini`。\n\n6.  在下一步中，你应该让 Windows 明确 `php-cgi.exe` PHP 模块和 `php.ini`\
  \ 位于 PHP 主目录（此处为 `C:\\php`）。虽然这并不是绝对必要的，但它通常会让控制更容易，特别是在结合扩展时。此步骤需要设置一个新的环境变量：\n\
  \n    *   通过控制面板 • 系统 • 系统和安全 • 高级系统设置切换环境变量。\n    *   编辑环境变量 • 系统变量下的 `Path` 条目。\n\
  \    *   添加 PHP 目录——例如 `C:\\php`。\n    *   为 `php.ini` 创建一个新的系统变量。此变量必须全局适用于具有用户管理的\
  \ Windows 操作系统，而不仅仅是当前用户。\n    *   环境变量命名为 `PHPRC`，目录为 `php.ini` 所在的目录——例如 `C:\\\
  php`（参见图 2.4）。\n    *   最后，保存或确认你的更改并重启操作系统。\n\n    ![额外的路径确保 PHP 模块被找到](img/img-f2.4.html)\n\
  \n    **图 2.4** 额外的路径确保 PHP 模块被找到\n\n7.  现在通过 `inetmgr.exe` 启动 IIS 管理控制台。\n\n8.\
  \  点击“处理程序映射”(Handler Mappings)。\n\n9.  然后在右侧选择“添加模块映射”(Add Module Mapping)。\n\n\
  10. 在图 2.5 显示的对话框中，输入 `*.php`——或你想要链接 PHP 的其他文件扩展名——作为请求路径 (Request Path)。\n\n \
  \   ![作为 CGI 的 PHP 设置](img/img-f2.5.html)\n\n    **图 2.5** 作为 CGI 的 PHP 设置\n\n11.\
  \ 选择 `FastCgiModule` 作为模块 (Module)。\n\n12. 可执行文件是 `php-cgi.exe` CGI 文件。\n\n13. 向\
  \ `php.ini` 中添加以下配置设置（并替换任何现有的且不同的设置）。最后一个设置特别重要，因为否则默认值 1 将阻止 PHP CGI 模块被直接调用，导致\
  \ IIS 出现错误：\n\n    ```\n    fastcgi.impersonate = 1\n    fastcgi.logging = 0\n \
  \   cgi.fix_pathinfo = 1\n    cgi.force_redirect = 0\n    ```\n\n#### 注意事项\n\n一个常见的错误来源是\
  \ CGI 尚未设置。你必须通过安装程序下的“启用或关闭 Windows 功能”来检查此处。\n\n要执行此操作，前往“应用程序开发功能”（参见图 2.6），如果有疑问，请在此处安装\
  \ CGI。可能还需要为 CGI 角色授予适用于应用程序开发的适当权限。\n\n    ![安装 CGI 支持](img/img-f2.6.html)\n\n\
  \    **图 2.6** 安装 CGI 支持\n\n在 [`www.php.net/install.windows`](https://www.php.net/install.windows)，你将在在线手册中找到\
  \ Windows 下配置 PHP 的更多设置选项，以及关于 PHP 和 IIS 组合的信息。\n\n### 版本切换\n\n\n\n\n一些开发者想要或需要同时在系统中使用不同的\
  \ PHP 版本。使用像 XAMPP 这样的安装包可以很方便地快速切换。然而，在手动安装时，也有一些技巧可以让生活变得更轻松：\n\n1. 你为 `C:\\php`\
  \ 文件夹创建环境变量。\n2. `php.ini` 也位于该处。两个 PHP 版本中的一个位于此文件夹中，给另一个起一个略不同的名称，例如 `C:\\php8.4`。\n\
  3. 现在更改变得非常简单：你只需要重命名这两个文件夹。例如，`C:\\php` 变会变成 `C:\\php8.3`。\n4. 然后将 `C:\\php8.4`\
  \ 重命名为 `C:\\php`。\n\n就是这样。相应版本的 `.ini` 文件始终被用作 `php.ini`。扩展程序也会自动复制。这使得管理两个或多个版本变得非常容易。\n\
  \n## Apache 2.x\n\n使用 Apache 2.x 安装非常简单。你可以在这里找到 PHP 8.x 和 Apache 2.4 的说明，不支持旧版本的\
  \ Apache。PHP 以 SAPI 模块（也称为处理器）的形式安装。\n\n1. 对于 Windows 二进制文件，选择 `Thread Safe` 版本以及与安装的\
  \ Web 服务器匹配的 `x86` 或 `x64` 版本。不要忘记从 [`s-prs.co/v602260`](http://s-prs.co/v602260)\
  \ 下载 Visual Studio 2019 的 Visual C++ 运行库。\n\n##### Note\n如果版本不匹配，安装将在此处失败。\n\n2.\
  \ 将二进制文件解压到目录 `C:\\php` 中。\n3. 将提供的两个 `php.ini` 版本之一重命名为 `php.ini`。\n4. 随后在 Apache\
  \ 配置文件 `httpd.conf` 中进行配置。你可以在标准安装的 `C:\\Apache24\\conf\\httpd.conf` 下找到它。对于 SAPI\
  \ 模块，内容如下：\n\n```\nLoadModule php_module \"C:/php/php8apache2_4.dll\"\nAddType application/x-httpd-php\
  \ .php\nPHPIniDir \"C:/php\"  \n```\n\n##### Note\n对于其他版本，你当然应该调整 `dll` 的版本号。如果不存在名为\
  \ `php8apache2_4.dll` 的文件，你可能下载了专用于 IIS 的非线程安全 PHP 分发版。请选择线程安全版本。\n\n5. 然后启动 Apache，例如通过命令行提示符：\n\
  \n```\nhttpd.exe -k start  \n```\n\n### Test Installation\n\n要测试安装情况，请切换到文本编辑器创建一个新的\
  \ PHP 文件。将此 PHP 文件以 `phpinfo.php` 或任何其他名称保存到 Web 服务器的根目录下（IIS 默认在 `C:\\inetpub\\\
  wwwroot`，Apache 则在程序目录下的 `htdocs` 中，例如：`C:\\Apache24\\htdocs`）。\n\n在此文件中仅写下三行代码：\n\
  \n```\n<?php\n  phpinfo();\n?>  \n```\n\n第一行和最后一行是 PHP 代码的边界符，它们告诉 PHP 解释器从何需要执行操作。`phpinfo()`\
  \ 函数实际上是关键的。它会生成一份关于 PHP 安装和所有已安装扩展的自报告（参见图 2.7）。\n\n![PHP 8 安装的 \"phpinfo()\" 输出（此处为\
  \ IIS 中的 FastCGI）](img/img-f2.7.html) \n\n**图 2.7** PHP 8 安装的 \"phpinfo()\" 输出（此处为\
  \ IIS 中的 FastCGI）\n\n要立即测试此项，可以在 Web 服务器上调用你刚刚创建的 PHP 文件。在情况下，需要访问地址 `http://localhost/phpinfo.php`。这允许你检查\
  \ PHP 的基本功能及其与 Web 服务器的集成情况。如果某些功能无法运行，`php.exe` 的控制台输出可能会提供额外信息（参见图 2.8）。以下命令显示版本号：\n\
  \n```\nphp -v  \n```\n\n![控制台上的 PHP](img/img-f2.8.html) \n\n**图 2.8** 控制台上的 PHP\n\
  \n##### Note\n在生产系统中，带有 `phpinfo()` 的文件不应从外部访问，因为它包含了入侵者可能使用的系统信息。\n\n## Compile\
  \ Yourself\n\n若要在 Windows 上自行运行 PHP，你需要来自微软的 Visual Studio。在这里我们将描述 PHP 8.3 的操作程序，它需要\
  \ 2019 版本的 Visual Studio。PHP 8.4 使用 Visual Studio 2022。\n\n微软在 [`s-prs.co/v602261`](http://s-prs.co/v602261)\
  \ 提供了所谓的社区版开发环境。这对大多数用户是免费的，[[ 12 ]](footnotes.html#ftn-fn02_05)，并且可以使用它进行编译。在安装期间，你只需要确保安装了\
  \ PHP 所的编译器（默认是不安装的）。选择自定义设置并激活“编程语言 • C++”下的复选框。\n\n（注：原文后半部分存在大量重复和乱码，已根据核心逻辑进行清理处理）\n\
  \n\n\n\n接下来，我们需要 PHP 本质的源代码。你可以从项目的 Git 仓库克隆它（我们将在稍后完成操作），也可以从 [`php.net/downloads.php`](http://php.net/downloads.php)\
  \ 下载相应的压缩包并将其解压到 `C:\\php-sdk\\phpmaster\\vs16\\x64\\php-src` 文件夹中：\n\n```\ngit\
  \ clone https://github.com/php/php-src.git  \n```\n\n（如有必要，如果你需要 32 位版本，请再次将 `x64`\
  \ 替换为 `x86。）\n\n我们还没有达到目标，因为仍然缺少所有所需的库。这些库以前可以在 PHP 网站上以 7z 压缩包的形式下载，但现在获取你所需的内容更加方便：`phpsdk_deps.bat`\
  \ 脚本会自动获取所需的包。在源码所在的文件夹中运行它。我们使用的是 PHP 的 master 分支，你也可以指定任何其他分支：[ 13 ]](footnotes.html#ftn-fn02_06)\n\
  \n```\ncd php-src \nphpsdk_deps.bat --update --branch master  \n```\n\n这些是相当多的下载和复制步骤。但得益于现成的批处理文件，一切应该都能无错误运行。现在是时候开始正经工作了！\n\
  \n首先运行 `buildconf` 脚本。这会创建一个配置脚本，PHP 能够根据该脚本进行编译。在下一步中，调用 `configure` 并指定（以及其他）你想要创建的扩展。在\
  \ [`s-prs.co/v602262`](http://s-prs.co/v602262)有一个完整的列表，但对于首次测试，以下调用就足够了：\n\n```\n\
  configure --disable-all --enable-cli  \n```\n\n最后，开始实际的编译过程：\n\n```\nnmake  \n```\n\
  \n这将需要一些时间（请参见 图 2.11）。不过，最后你将获得一个二进制版本的 PHP。如果你还使用了 `--enable-debug` 选项，结果将位于 `Debug_TS`\
  \ 文件夹中；否则，它将在 `Release_TS` 中。\n\n#### 注意事项\n\n你可以从 图 2.12 所示的输出可以看到 PHP 使用的版本是 8.4.0-dev。这怎么可能的，因为这本书是关于\
  \ PHP 8.3 的（并且在发布后不久就定稿了）？\n\n答案很简单：在 PHP 8.3 发布后，PHP 团队名义上已经开始下一个大版本 PHP 8.4 的工作。因为我们直接从\
  \ Git 获取了源代码，所以我们拥有最新版本，因此也拥有 8.4。由于 PHP 8.4 已经发布，你可能会看到版本 8.5.0-dev。但不要太兴奋：至少在出版时，这些版本几乎是相同的。\n\
  \n然而，如果你想编译特定的 PHP 版本，请如之前解释过的，在调用 `phpsdk_deps.bat` 时指定特定的分支。\n\n![PHP Is Compiled\
  \ ...](img/img-f2.11.html) \n\n**图 2.11** PHP 正在编译 ...\n\n![... and It Works!](img/img-f2.12.html)\
  \ \n\n**图 2.12** ... 并且运行正常！\n\n### 扩展\n\n扩展在 Windows 下安装在 `php.ini` 中。首先，扩展目录是相关的。你通过\
  \ `extension_dir` 指令来设置它。在 PHP 中，你会在 `ext` 目录中找到扩展：\n\n```\nextension_dir = \"ext\"\
  \n```\n\n许多扩展未包含在标准包中，而是在自己的 PECL 包中。`PECL` 是用 C 编写的扩展的官方目录（参见 [`pecl.net`](http://pecl.net)）。\n\
  \n如果你正确输入了扩展目录，只需要注册扩展即可。从那时起，这一直按照以下模式进行：\n\n```\nextension=php_name.dll\n```\n\
  \n从 PHP 7.3 开始，还有一种短格式，可以省略 PHP 和 `.dll`。此的优点是，这部分配置因此独立于操作系统：\n\n```\nextension=name\n\
  ```\n\n安装包提供的大多数扩展已经录入 `php.ini` 中（参见 图 2.13）。然而，它们仍然被分号注释掉了：\n\n```\n;extension=exif\n\
  ```\n\n只需删除该行前面的分号即可使扩展生效。如果你重启 Web 服务器（当用作 CGI 模块时，只需重新调用），你将通过 `phpinfo()` 看到新扩展已注册。\n\
  \n![The Extensions in the \"php.ini\" File](img/img-f2.13.html)\n\n**图 13** \"php.ini\"\
  \ 文件中的扩展\n\n### 刷新\n\n最后，剩下的就是保持系统安全。为了这一点，最重要的事情之一就是定期使用 Windows Update（参见 图 2.14）。\n\
  \n![Windows Update and Components](img/img-f2.14.html)\n\n**图 14** Windows 更新与组件\n\
  \n\n\n\n\n我们正在讨论的是替代性包管理器 `Homebrew` ([`brew.sh`](https://brew.sh))。必须先安装它：\n\n\
  ```\n/bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"\
  \  \n```\n\n随后即可使用 `brew` 命令行工具（以及其他工具）。如果你的系统中还没有最新更新的 Apache Web 服务器，可以使用 `Homebrew`\
  \ 对其进行后期配置：\n\n```\nbrew install httpd \nbrew services start httpd  \n```\n\n然后继续安装你选择的脚本语言。以下指令可以成功安装\
  \ PHP 8.3（请参见 图 2.17 和 图 2.18），未来的版本也应该同样的方式运行：\n\n```\nbrew install php@8.3  \n\
  ```\n\n![通过 Homebrew 在 macOS 上安装 PHP](img/img-f2.17.html)\n\n**图 2.17** 通过 Homebrew\
  \ 在 macOS 上安装 PHP\n\n![安装成功](img/img-f2.18.html)\n\n**图 2.18** 安装成功\n\n#### 注意事项\n\
  \n在较新版本的 macOS 中，将 PHP 集成到提供的 Apache Web 服务器中已不再那么简单了。例如，扩展在执行之前必须经过特殊的签名。一种常用的方法是禁用捆绑的版本，并再次通过\
  \ Homebrew 安装最新版本的 Apache 发布。关于此点以及在 macOS 下如何处理多个并行 PHP 版本的详细信息，可以在 [`s-prs.co/v602208`](http://s-prs.co/v602208)\
  \ 找到。\n\n#### 注意事项\n\n`Homebrew` 运行非常好，但它可能会占用大量内存，因为组件是在目标系统上编译的。仍然为旧版 macOS 版本维护的替代方案是\
  \ MacPorts 项目 ([`macports.org`](https://macports.org))。在安装基础包后，以下命令可以在系统上设置 PHP：\n\
  \n```\nsudo port install php \n```\n\n即使 macOS 的市场份额相对较小（桌面端约 20%），这并不意味着没有安全漏洞，也不意味着没有想要利用漏洞的人。因此，同样的规则适用于这里：尽早且频繁地更新。macOS\
  \ 的默认配置为定期自动启动系统更新（参见 图 2.19）。你不一定需要更改此设置。\n\n![macOS 下已安装程序的更新以及 macOS 自身](img/img-f2.19.html)\n\
  \n**图 2.19** macOS 下已安装程序的更新以及 macOS 自身\n\n## 2.1.4 Linux\n\n在 Linux 下，[[ 14 ]](footnotes.html#ftn-fn02_07)\
  \ 预构建的包不像 Windows 的 PHP 安装程序那样重要。经典的“手动安装”是让 PHP 运行并包含你所有需要的扩展的最方法。因此，安装过程遇到的异常和问题要少得多。一旦你内化了基本原理，每次的运行方式都是样的。我们在这里使用\
  \ `Apache` 和 `nginx` 作为 Web 服务器。\n\n### 发行版\n\n大多数 Linux 发行版已经包含了 `Apache`，在大多数情况下也支持\
  \ PHP。例如，在某些（旧的）Ubuntu 版本中，你会在包管理中找到安装选项。你只需要在运行级别编辑器（runlevel editor）中激活 Web 服务器即可即可。\n\
  \n在较新的发行版和版本中，最好使用命令行：\n\n```\nsudo apt-get update \nsudo apt-get upgrade \nsudo\
  \ apt-get install apache2 php libapache2-mod-php  \n```\n\n前两个命令更新包管理器的软件列表和已安装包，最后你安装\
  \ `Apache`、`PHP` 以及用于 `Apache 2` 的 PHP 模块。\n\n这些自动化机制的问题在于 Linux 发行版的更新频率低于 PHP。结果是，版本有时会（稍微）落；例如，在出版时，最新的长期支持\
  \ (LTS) Ubuntu 版本仅提供 PHP 8.1。你对编译设置的控制也较少，但它们绝对可以作为基础。\n\n### 提示\n\n如果 Ubuntu 运行慢，Ondřej\
  \ Surý 可以提供帮助。他可靠且及时地发布受支持 PHP 版本的包。如果你激活了他的仓库，你将尽早访问新版本：\n\n```\nsudo add-apt-repository\
  \ ppa:ondrej/php \nsudo apt update\n```\n\n另一个流行的 Web 服务器（现在的市场份额甚至比 `Apache` 更高）是\
  \ `nginx`。你也可以像前所述的那样为该服务器安装 PHP 支持。出版时的起点是上一个框中提到的 Ondřej Surý 仓库。如果你还没有安装，请先安装\
  \ `nginx`：\n\n```\nsudo apt-get install nginx\n```\n\n接下来，不要使用“普通”的 PHP 包，而要使用 `FPM`\
  \ 包。这里的 `FPM` 代表 `FastCGI Process Manager`，它提供像 Web 服务器一样优的性能：\n\n```\nsudo apt-get\
  \ install php8.3 \n```\n\n微调在 `/etc/nginx/sites-enabled/default` 中完成，其中：\n\n```\n\
  location ~ \\.php {\n    fastcgi_pass unix:/run/php/php8.3-fpm.sock;\n    include\
  \ fastcgi_params;\n}\n```\n\n最后，在 `/var/www/html` 中创建一个 `phpinfo.php`，其中：\n\n```php\n\
  <?php\n  phpinfo();\n?>\n```\n\n现在重启服务器 `systemctl restart nginx`，之后 `http://localhost/phpinfo.php`\
  \ 应该显示如 图 2.20 所示。\n\n### 提示\n\n`FPM` 包也可以很容易集成到 `Apache` 中。通过 `apt-get` 安装 `php8.3-fpm`\
  \ 后，需要以下命令：\n\n```\na2enmod proxy_fcgi\n```\n\n### 安装包\n\n对于 Linux，就像 Windows 一样，可以使用\
  \ XAMPP 安装包。安装非常简单：\n\n1.  从 [`www.apachefriends.org/download.html`](https://www.apachefriends.org/download.html)\
  \ 下载包。\n2.  运行安装程序。这是一个 `.run` 文件。它需要执行权限，其余会自动运行。更改文件名以适应你的系统：\n\n    ```\n   \
  \ chmod 755 xampp-linux-64-8.12-0-installer.run\n    sudo ./xampp-linux-64-8.12-0-installer.run\n\
  \    ```\n\n    图 2.21 显示了安装程序。\n\n    ![Linux 下 XAMPP 安装程序](img/img-f2.21.html)\n\
  \n    **图 2.21** Linux 下 XAMPP 安装程序\n\n3.  安装后启动：\n\n    ```\n    /opt/lampp/lampp\
  \ start\n    ```\n\n    `XAMPP` 默认安装在 `/opt` 目录下。\n\n\n\n\n如果你安装了 PHP 未包含的扩展，你还需要相应的库文件。你可以在本书的相应章节中找到这些库。\n\
  \n如果所有内容都已就绪，按照以下步骤将引导你实现目标：\n\n1.  下载 PHP 8.3.x 的源码。我们假设使用 `tar.gz` 格式。\n\n2. \
  \ 解压源码。注意，文件名会随着版本号而变化！在此情况下，目录 `/usr/local/src/lamp` 可以根据需要定义，只要当前用户对该目录有写权限即可：\n\
  \n    ```\n    tar xvfz php-8.3.2.tar.gz -C /usr/local/src/lamp/  \n    ```\n\n\
  3.  进入该目录：\n\n    ```\n    cd /usr/local/src/lamp/php-8.3.2/  \n    ```\n\n    你可能需要调整目录和\
  \ PHP 版本。\n\n4.  现在是“最困难”的一步：配置。在这里，你可以指定所有想要配置 PHP 的选项。同时配置所有你想要使用的扩展。要包含 Apache，请使用\
  \ `--with-apxs2=[file]`，其中 `file` 指定 `apxs` Apache 工具的路径。它通常位于 Apache 安装的 `bin`\
  \ 目录或 `/usr/bin` 中（通过 `which apxs` 命令可以显示路径）。否则，PHP 将仅生成为 CGI 模块：\n\n    ```\n \
  \   ./configure --with-apxs2=/Path/bin/apxs --with-mysqli  \n    ```\n\n    你可以在\
  \ 图 2.22 中看到所需的结果。\n\n    ![配置运行通过——这是一个好兆头！](img/img-f2.22.html)\n\n    **图 2.22**\
  \ 配置运行通过——这是一个好迹头！\n\n5.  然后编译 PHP（参见 图 2.24）：\n\n    ```\n    make  \n    make\
  \ install\n    ```\n\n    ##### 注意\n\n    你可以使用 `./configure --help` 显示所有选项列表。扩展所需的必要设置可以在本书每个章节的开头找到。在线文档在\
  \ [`s-prs.co/v602265`](http://s-prs.co/v602265) 中包含摘要。\n\n你的你的系统中可能缺少某些库。例如，PHP\
  \ 使用 `libxml2`，但仅有它是不够的；你还需要 `libxml2-dev` 包。如果缺少某些，`configure` 工具将带有（通常是有意义的）错误信息退出（参见\
  \ 图 2.23，该图来自一个已存在 `libxml2` 但没有 `libxml2-dev` 的系统；还缺少 `pkg-config` 包）。`sqlite3`\
  \ 的开发者包通常默认不可用，根据发行版通常被称为 `sqlite-devel` 或 `libsqlite3-dev`。如果 `configure` 抱怨缺少\
  \ `zlib` 包，那么 `libzip-dev` 通常会有帮助。\n\n    ![这里仍然缺少东西……](img/img-f2.23.html)\n\n\
  \    **图 2.23** 这里仍然缺少东西……\n\n    ![\"make\" 准备编译（这需要一些时间）](img/img-f2.24.html)\n\
  \n    **图 2.24** \"make\" 准备编译（这需要一些时间）\n\n    ##### 注意\n\n    对于 `make install`（参见\
  \ 图 2.25），通常你需要管理员权限（除非你在 `--prefix` 中指定了当前用户具有写权限的目标目录）。例如，使用 `sudo make install`。\n\
  \n    ![\"make install\" 执行最终安装（比 \"make\" 快得多）](img/img-f2.25.html)\n\n    **图\
  \ 2.25** \"make install\" 执行最终安装（比 \"make\" 快得多）\n\n    简单回顾：在编译期间，会生成一个 Apache\
  \ 模块——如果你设置了它。你现在必须在 Apache 中配置此 Apache 模块。\n\n    将两个建议的 `php.ini` 文件之一拷贝到 `/usr/local/lib`\
  \ 并将其重命名为 `php.ini`。或者，在配置 PHP 时，你应该指定 `--with-config-file-path=/etc/` 指令。\n\n \
  \   现在你必须在 Apache 中注册 PHP。要实现这一点，请将以下行添加到 `httpd.conf`（在某些系统上，也可以是 `apache2.conf`）：\n\
  \n    ```\n    AddHandler php-script .php\n    ```\n\n    你也可以对 PHP 文件使用任何其他扩展名。只需连续编写多个后缀即可：\n\
  \n    ```\n    AddHandler php-script .php8 .php  \n    ```\n\n    你还应该检查模块是否已经加载。`http.conf`\
  \ 中必须存在此行：\n\n    ```\n    LoadModule php_module modules/libphp.so\n    ```\n\n\
  \    现在重启 Apache 或首次启动它——使用如下：\n\n    ```\n    apachectl start\n    ```\n\n    停止\
  \ Apache 或重启它：\n\n    ```\n    apachectl stop\n    apachectl restart\n    ```\n\n\
  \    查看状态：\n\n    ```\n    apachectl status\n    ```\n\n    现在，你可以在浏览器中运行 PHP 脚本了。创建一个名为\
  \ `info.php` 的文件，内容如下：\n\n    ```php\n    <?php\n    phpinfo();\n    ?>\n    ```\n\
  \n    在浏览器中访问 `http://localhost/info.php`。你应该能看到 PHP 的配置信息。\n\n    完成后，请删除此文件以确保安全：\n\
  \n    ```\n    rm /var/www/html/info.php\n    ```\n\n    恭喜，你已经成功地在 Apache 上运行了\
  \ PHP！\n\n    译文：\n\n[content]\n    现在，你可以在浏览器中运行 PHP 脚本了。创建一个名为 `info.php` 的文件，内容如下：\n\
