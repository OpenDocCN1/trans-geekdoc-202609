  \n**图 19.17** 编辑表单已预填充内容\n\n就此结束了：你现在已经能够使用 MySQL 和 PHP 创建复杂的数据库应用程序了。如果你对其他数据库也感兴趣，请继续阅读：正如接下来的章节所示，PHP\
  \ 还有许多其他可用。\n\n## 19.4 设置\n\n在 `php.ini` 配置文件（`mysqli` 部分），`mysqli` 扩展设置了表 19.2\
