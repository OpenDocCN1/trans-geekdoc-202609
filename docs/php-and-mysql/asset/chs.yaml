  \ 格式的最终译文）**\n\n[content]\n*   `array_keys(Array, Value, Exactly)` 返回数组的所有键，并返回一个数值数组。如果你指定了一个值，则只返回具有该值的键。`Exact`\
  \ 也是可选的，决定是否也检查数据类型。\n*   `array_values(Array)` 返回数组的值。生成的数组具有数值索引。原有的关联索引将丢失。\n\
  \n### 8.5.2 排序 (Sort)\n\n对于数组的排序，既有实用的函数，也有那些十年才用一次的函数。我们在这里不作过多区分，将重要的以及一些不那么重要的函数都包含在内。\n\
  \n首先，这里有一些应用范围非常有限且仅允许少量设置的函数：\n\n*   `array_flip(Array)` 交换数组的索引和值，并返回此数组作为返回值。如果有多个相同的值，只有最后一个值会被保留，并接收其键作为值。\n\
  *   `array_reverse(Array, Preserve)` 反转数组的顺序。可选的第二个参数决定是否保留键（`true`）。其默认值为 `false`。\n\
  *   `array_rand(Array, number)` 返回数组元素的随机索引。如果你指定了数字，将得到一个包含多个随机索引的数组。\n*   `shuffle(Array)`\
  \ 随机改变数组元素的顺序。返回值为布尔值，告知操作是否成功。\n\n现在来看具有更多设置选项的排序函数。`sort()` 及其函数命名都非常逻辑化：\n\n\
  *   根词是 `sort`。\n*   如果它前面有一个 `r`，则进行反序排序。\n*   如果最开头有一个 `a`，则进行排序，但保留索引和值的赋值。\n\
  *   如果开头有一个 `k`，则按索引对数据排序。在这里索引/值的赋值也会被保留。所有其他排序函数都按值排序。\n*   对于所有其他函数，索引/值的赋值都会发生变化。\n\
  *   `u` 表示该函数期望一个排序函数作为参数。\n*   `nat` 意味着尝试进行自然排序（就像人类做的那样）。例如，数字 `1`、`2` 和 `3`\
  \ 会排在 `10`、`20` 和 `30` 之前。这使用了 Martin Pool 的算法（参见 [`s-prs.co/v602269`](http://s-prs.co/v602269)）。\n\
  \n考虑以下简单示例。`sort()` 函数按值排序（因为没有指定键 `k`），并且它改变了索引/值的赋值。`sort` 函数与所有其他函数一样——会改变原始数组。图\
  \ 8.20 显示了结果。\n\n```php\n<?php \n  $days = array(\"Saturday\", \"Sunday\", \"Monday\"\
  , \"Tuesday\"); \n  sort($days); \n  print_r($days); \n?>  \n```\n\n**列表 8.19**\
  \ \"sort()\" (\"sort.php\")\n\n![字母序排序](img/img-f8.20.html)\n\n**图 8.20** 字母序排序\n\
  \n### 8.6 超全局数组 (Superglobal Arrays)\n\n超全局数组实际上非常容易描述。它们是包含重要信息的（关联）数组。例如，`$_SERVER`\
  \ 包含 HTTP Header、路径等；`$_POST` 和 `$_GET` 包含从表单发送的数据；而 `$_SESSION` 包含会话信息。\n\n\n\n\
  \nMozilla/5.0 (Windows; U; Windows NT 5.1; de-DE; rv:1.4) Gecko/20030619 Netscape/7.1\
  \ (ax)\n\n* Konqueror 4.9 (Linux)\n  * Mozilla/5.0 (X11; Linux) KHTML/4.9.1 (like\
  \ Gecko) Konqueror/4.9\n* Internet Explorer 5.23 (macOS)\n  * Mozilla/4.0 (compatible;\
  \ MSIE 5.23; Mac\\_PowerPC)\n\n这些信息可以作为切换器的依据。你还可以在 `$_SERVER` 中找到其他有用的变量，例如 `PHP_SELF`，它包含当前\
  \ PHP 脚本的 URL。\n\n还有其他的环境变量。然而，其中某些非常依赖于所使用的操作系统和 Web 服务器。为了演示这一点，下面的短脚本输出了 `$_SERVER`\
  \ 和 `$_ENV` 的内容（参见图 8.22）。\n\n```\n<<h1>Server variables</h1>\n<table><tr><th>Name</th><th>Value</th></tr>\n\
  ```\n\n**列表 8.21**\n```php\n<?php\n  ksort($_SERVER);\n  foreach ($_SERVER as $name\
  \ => $value) {\n    if (is_array($value)) {\n      printf(\"<tr><td%s</td><td%s</td></tr>\"\
  , \n        $name, implode(\" \", $value));\n    } else {\n      printf(\"<tr><td%s</td><td%s</td></tr>\"\
  , \n        $name, $value);\n    }\n  }\n?> \n```\n\n```\n</table>\n<h1>Environment\
  \ variables</h1>\n<table><tr><th>Name</th><th>Value</th></tr> \n```\n\n**列表 8.21（续）**\n\
  ```php\n<?php\n  ksort($_ENV);\n  foreach ($_ENV as $name => $value) {\n    if (is_array($value))\
  \ {\n      printf(\"<tr><td%s</td><td%s</td></tr>\", \n        $name, implode(\"\
  \ \", $value));\n    } else {\n      printf(\"<tr><td%s</td><td%s</td></tr>\", \n\
  \        $name, $value);\n    }\n  }\n?> \n```\n\n```\n</table>  \n```\n\n系统差异导致的后果是显而易见的：如果你查询一个奇特的环境变量（根据经验，即不以\
  \ `HTTP_` 或 `PHP_` 开头的变量），那么你也应该在其他操作系统上测试代码。否则，如果你移动了服务器，可能会面临令人不快的惊喜。但在更熟悉的环境变量中也存在差异；例如，`HTTP_UA_CPU`\
  \ 和 `HTTP_UA_OS` 环境变量是 Internet Explorer 的特性，因此仅适用于内网使用。\n\n剩下的唯一问题是 `$_SERVER`\
  \ 和 `$_ENV` 之间的区别。在理论上，`$_SERVER` 包含与 HTTP 请求和响应相关的变量，而 `$_ENV` 包含 PHP 运行所在的系统环境变量。但在实践中，这种情况仅出现在\
  \ Linux 上；在 Windows 上，这两者经常混杂在一起（正如我们所见）。取决于 `php.ini` 中的配置，某些超全局变量可能无法访问，例如在生产环境中不建议使用\
  \ `$_ENV`。作为一个提示，通常使用 `$_SERVER`。\n\n![Windows 下使用 Apache 服务器的服务器和环境变量输出](img/img-f8.22.html)\n\
  \n**图 8.22** 在 Windows 下使用 Apache 服务器的服务器和环境变量输出\n\n#### 注意事项\n在 [`php.net/reserved.variables`](http://php.net/reserved.variables)，你将找到支持的变量列表。\n\
  \n# 9 数学和日期函数\n\n数学计算和日期值处理在编程训练课程和书籍中通常被归为一类——就像它们在这里一样——或者至少相隔不远。为什么呢？因为两者都是不受欢迎的边要任务。\n\
  \n你多久需要一次数学计算或日期？频率可能比你想象的要高得多。例如，在生成图形时，数学至关重要。如果没有三角函数，复杂的图形会变得非常不愉快。日期值在网页上遇到得更加频繁：无论是由\
  \ PHP 自动生成的新闻条目的当前日期，还是计算到圣诞节还有多少天数的计数器。\n\n在 PHP 存在的海量函数中，也有许多用于数学计算和处理日期值的函数。在在线文档的函数引用中，甚至有专门的数学函数部分和日期函数部分。我们不想向你背诵所有的函数；相反，我们将挑选出最有趣的函数，并在实战中观察它们。\n\
  \n## 9.1 数学\n\n“坐下，拿出你们的练习本，到黑板前来做数学题！”这是许多人与数学联系在一起的内容或类似的话。我们保证，这里不会那么糟糕！你将在下面的章节中找到最重要的主题。挑选出你需要的。\n\
  \n### 9.1.1 基础\n\n对于基础算术运算，PHP——像大多数编程和脚本语言一样——提供了算术运算符（参见第 5 章）。然后可以使用一些数学函数进行复杂的计算。例如，`sqrt(number)`\
  \ 计算平方根，`pow(base, exponent)` 计算幂。\n\n```php\n<?php\n  $a = 2;\n  $b = 3;\n  echo\
  \ sqrt($a);\n```\n**列表 9.1** 幂 `pow.php` 你已经计算过幂吗？\n\n#### 注意事项\n作为替代方案，`div()`\
  \ 可以在第 5 章了解更多。它的第一个参数是被除数，第二个是除数。\n\n```php\n<?php\n  $a = 8;\n  $b = 2;\n  echo\
  \ div($a, $b);\n?>\n```\n**列表 9.2** 除法 `int.php` 如果除数为 0，将抛出致命错误 `DivisionByZero`。\n\
  \n```php\n<?php\nfunction add($numbers) {\n  $sum = 0;\n  foreach ($numbers as $number)\
  \ {\n    $sum += $number;\n  }\n  return $sum;\n}\n  echo add(2, 10);\n```\n**列表\
  \ 9.3** 自定义函数 `custom_function.php` 结果是 10。\n\n### 9.1.2 常数\n\n某些数学常量被频繁使用，很难计算，因此\
  \ PHP 提供了一些我们在表 9.1 中列出的预定义常量。\n\n| 常数 | 说明 | 数值 |\n| :--- | :--- | :--- |\n| `M_PI`\
  \ | 3.1415926535897932384 | π（pronounced pi）指定直径与周长的比例。 |\n| `M_PI_2` | 1.5707963267948966192\
  \ | 周长除以 2 |\n| `M_PI_4` | 0.78539816339744830962 | 周长除以 4 |\n| `M_1_PI` | 0.31830988618379067154\
  \ | π 的倒数：1/π |\n| `M_2_PI` | 0.63661977236758134308 | π 的倒数的倍：2/π |\n| `M_E` |\
  \ 2.7182818284590452354 | 欧数 e |\n| `M_LOG2E` | 1.4426950408889634074 | 以 2 为底的\
  \ e 数 |\n| `M_LOG10E` | 0.43429448190325182765 | 以 10 为底的 e 数 |\n| `M_LN2` | 0.69314718055994530942\
  \ | 2 的自然对数 |\n| `M_LN10` | 2.30258509299404568402 | 10 的自然对数 |\n| `M_SQRT2` | 1.41421356237309504880\
  \ | 2 的平方根 |\n| `M_SQRT1_2` | 0.70710678118654752440 | 2 的平方根的倒数：1/sqrt(2) |\n|\
  \ `M_2_SQRTPI` | 1.12837916709551257390 | 2 除以 π 的平方根：2/sqrt(π) |\n\n**表 9.1** PHP\
  \ 中的数学常量\n\n#### 注意事项\n此表和在线文档给出这些数字的精度并不是 PHP 提供的精度。PHP 4 默认仅提供 11 位，PHP 5 以及 PHP\
  \ 7 及更高版本使用 13 位。\n\n\n\n\n\n### 9.1.3 数字转换\n\n人类通常使用基于 10 个数字的十进制系统进行计算。然而，数字也可以用其他数字系统表示。最重要的如下：\n\
  \n* 十进制\n  在这个系统中，数字的范围从 0 到 15。两位数用字母表示：从 A 代表 10 到 F 代表 15。\n* 二进制\n  该系统只使用 0\
  \ 和 1。如果为 1，则存在相应的数字；如果为 0，则表示不存在。数字从右到左读取。右侧的第一个数字代表 1，左边的代表 2，再右边的代表 4，再左边的代表\
  \ 8，依此类推。因此，二进制的 `101` 转换为十进制的 `5`。\n* 八进制\n  该数字系统基于数字 8。八进制数也从右到左读取。要将其转换为十进制数，将右侧的数字乘以\
  \ 1，左边的数字乘以 8，相邻的数字乘以 64，再相邻的数字乘以 512，依此类推。因此，八进制的 `143` 转换为十进制的 `99`。\n\n### 注意\n\
  从 PHP 8.1 开始，八进制数的表示法有一项创新。它们现在像以前一样以 0 开头，但后面跟一个小写的 o：\n\n```\n$octal = 0o143;\
  \ \n```\n\n手动从十进制系统手动转换到这三个系统会变得不必要的复杂。PHP 通过三个转换函数来帮助你：\n\n* `dechex(number)`\n\
  * `decbin(number)`\n* `decoct(number)`\n\n### 注意\n转换函数返回字符串作为结果。PHP 中没有十六进制、二进制和八进制数的数据类型。反向转换函数也使用字符串作为参数。\n\
  \n还有三个用于反向路径的函数。名称始终遵循相同的约定：进行转换的数字系统在前面：\n\n* `hexdec(String)`\n* `bindec(String)`\n\
  * `octdec(String)`\n\n以下示例显示了一个简单的形式（参见图 9.1），你可以用它将十进制数转换为其他三个数字系统。\n\n```php\n\
  <?php\n  if (isset($_POST[\"send\"])) {\n    $decimal = $_POST[\"decimal\"];\n \
  \   $hexa = dechex($decimal);\n    $binary = decbin($decimal);\n    $octal = decoct($decimal);\n\
  \  }\n?> \n```\n\n```html\n<html\n<head>\n  <title>转换器</title>\n</head>\n<body>\n\
  \  <form method=\"POST\">\n    <input type=\"text\" name=\"decimal\" value=\"<?=isset($decimal)?$decimal:''?>\"\
  \ /> \n十进制数<br /><br />\n    <input type=\"text\" name=\"hexa\" value=\"<?=isset($hexa)?$hexa:''?>\"\
  \ /> \n十六进制表示法<br />\n    <input type=\"text\" name=\"binary\" value=\"<?=isset($binary)?$binary:''?>\"\
  \ /> \n二进制表示法<br />\n    <input type=\"text\" name=\"octal\" value=\"<?=isset($octal)?$octal:''?>\"\
  \ /> \n八进制表示法<br />\n    <input type=\"submit\" name=\"send\" value=\"Convert\"\
  \ /> </form>\n</body>\n</html>  \n```\n\n列表 9.4 数字系统转换 (\"convert_numbers.php\"\
  )\n\n图 9.1 从十进制到其他系统的简单转换器\n\n如果你想进行更灵活的转换，可以使用 `base_convert(number, source system,\
  \ target system)`。在这里输入以字符串形式输入的待转换数字。对于源系统，基数遵循当前数字——所以十进制为 10，二进制为 2，十六进制为 16，八进制为\
  \ 8。对于目标系统，输入要转换到的系统的基数。两个系统的最大数字都是 36，因为它涵盖了从 0 到 9 的所有数字和来自 Z 的字母。\n\n以下示例将二进制数转换为十六进制数。\n\
  \n```php\n<?php \n  $a = \"1101\"; \n  echo base_convert($a, 2, 16); \n?>\n```\n\
  \n列表 9.5 转换所有数字系统 (\"base_convert.php\")\n\n### 9.1.4 随机数\n\n如果你想玩命运，随机数在编程中始终起着作用。许多电脑游戏依靠惊喜元素而生存，但随机性在严肃的应用中也有意义。例如，随机生成的密码、随机选择的颜色或随机生成的横幅。\n\
  \nPHP 中的随机函数在旧版本中有点困惑，并且经常变化。从 8.2 版本开始，终于使用了一个新类。这就是为什么我们要花一点时间来看传统的改进型随机函数。\n\n\
  #### `rand()` 函数\n通过 `rand(Minimal, Maximal)`，你可以得到一个在最小和最大限制之间的整数随机值。\n\n```\n\
  rand(1, 6)\n```\n因此是 1 到 6 之间的随机数，且只有整数！\n\n### 注意\n通过 `srand(base value)` 函数，你可以为随机数设置一个基值。基值可以是当前日期，例如。\n\
  \n如果你省略了 `rand()` 中的限制，你将得到 0 到系统限制之间的随机数。参见图 9.2。\n\n```php\n<?php\n  echo \"随机数：\"\
  \ . rand(); \n?>\n```\n\n列表 9.6 `rand()` 和 `getmax()` (\"randmax.php\")\n\n图 9.2\
  \ 随机值和最大值\n\n#### `mt_...`\n`mt_rand(Min, Max)` 是 `rand()` 的更新对应品。mt 代表 Mersenne\
  \ Twister（梅森旋转算法），一种产生更好随机数的已知算法。\n\n### 注意\n对于 `mt_srand(base value)`，你可以为随机数设置基值。`srand()`\
  \ 在 PHP 7.1 之后是 `mt_rand()` 的别名。还有一个方法返回上限：`mt_getrandmax()`。\n\n#### `Randomizer`\
  \ 类\n从 PHP 8.2 开始，终于有了一个面向对象的选项：`Randomizer` 类。这个名字在逻辑上是合理的，但很长。功能上，有很多可能性，例如：\n\
  \n* `getInt(Min, Max)` 返回一个整数。Min 和 Max 分别指定下限和上限。\n* `getFloat(Min, Max)` 返回一个浮点数。它从\
  \ PHP 8.3 开始。\n* `getBytes(length)` 返回指定长度的随机字节。\n* `shuffleArray(Array)` 随机洗牌数组。\n\
  * `pickArrayKeys(Array, Number)` 随机选择数量指定的数组元素。\n\n在以下示例中，`Randomizer` 类掷 1 到 6\
  \ 之间的整数。\n\n```php\n<?php\n  $random = new Random\\Randomizer();\n\n  for($i = 0;\
  \ $i < 100; $i++) { \n    echo $random->getInt(1, 6) . \"<br />\"; \n  }\n?>  \n\
  ```\n\n列表 9.7 \"random\" 对象生成随机数 (\"random.php\")\n\n### 9.1.5 最大、最小和舍入\n\n有时数字需要先进行修剪，或者需要从多个数字中选择正确的。PHP\
  \ 中也提供了用于重要数学任务的现有函数。\n\n#### 最大和最小\n`max(Parameter1, Parameter2 ...)` 和 `min(parameter1,\
  \ parameter2 ...)` 函数确定任意数量参数中的最大值或最小值。考虑以下示例；你可以在图 9.3 中看到结果。\n\n```php\n<?php\
  \ \n  $a = 10; \n  $b = 5; \n  $c = 7; \n  echo \"最大值：\" . max($a, $b, $c) . \"\
  <br />\"; \n  echo \"最小值：\" . min($a, $b, $c); \n?>  \n```\n\n列表 9.8 确定最大值和最小值 (\"\
  maximal_minimal.php\")\n\n\n\n\n# 模块说明文档\n\n## 1. 概述\n进入 `/path/to/xxx` 目录，找到 `xxx.json`。\n\
  \n在表达式 `cvar = avar + bvar` 中，加法运算符（`+`）将 `avar` 与 `bvar` 相加，得到它们的和 `cvar`。\n\n\
  ## 2. 方法使用\n在 `List.of(arg0, arg1, arg2)` 中，`List` 接口的工厂方法 `of()` 接受一系列的元素，返回包含它们的只读列表。\n\
  \n之后我们这样调用 `cmd` 命令：`cmd arg0 arg1 arg2`。\n\n## 3. 代码示例\n```javascript\nif (condVar\
  \ > someVal) {\n    console.log(\"xxx\")\n}\n```\n\n\n\n\n各个日期元素之间的斜杠仅仅是由 `date()`\
  \ 输出的。如果你想输出实际上对应于日期元素的符号之一，你必须使用反斜杠（`\\\\`）对其进行转义，这也称为转义字符。但要小心，以下格式\n\n```php\n\
  $today = date(\"\\D\\a\\t\\e: d.m.Y\");  \n```\n\n只会输出 `Da : 27.12.2024`，因为 `\\\
  t` 在字符串中是制表符，而 `\\e` 是转义字符。你必须改用这种方法：\n\n```php\n$today = date(\"\\D\\a\\\\t\\\\\
  e: d.m.Y\");  \n```\n\n因此，`date()` 不适用于较长的文本。在这里，你可以使用 `DateTime`、多次调用 `date()`，或者\
  \ `getdate()` 的关联数组。\n\n`[表 9.2]` 提供了所有可用符号的列表以及相应的解释。\n\n| 图标 | 示例 |  |\n| ---\
  \ | --- | --- |\n| a | am, pm | 上午和下午，在完整的拉丁语中，为 ante meridiem 和 post meridiem。\
  \ |\n| A | AM, PM | 大写的 AM 和 PM。 |\n| B | 045 | 斯沃奇国际时间，一天由从 000 到 999 的 1,000 个节拍组成。0.0.0\
  \ 是斯沃奇瑞士总部的午夜。这个时间系统的目的（除了营销之外）是为聊天、预约等创建一个标准化的时间系统。 |\n| c | 2025-02-21T23:08:28+01:00\
  \ | ISO 8601 日期。 |\n| d | 09 | 月中的某一天。始终是两位。单数字日期前的导零会自动添加。 |\n| D | Wed | 三字母英语缩写形式的星期。\
  \ |\n| e | Europe/Berlin | 当前时区的名称。 |\n| F | January, July | 英语月份。 |\n| g | 5 |\
  \ 12 小时制格式的时间的小时。因此午夜是 12 点。上午和下午的区别通过 am 和 pm（符号 a 和 A）来区分。它前面没有零。 |\n| G | 5,\
  \ 15 | 24 小时制格式的时间的小时。因此午夜是 24 点。单数字小时前面不加零。 |\n| h | 05 | 与 g 类似，但单数字小时会自动前导零。\
  \ |\n| H | 05, 23 | 与 G 类似，但单数字小时会自动前导零。 |\n| i | 05, 43 | 时间的分钟，单数字分钟前有导零。 |\n\
  | I | true, false | 如果日期处于夏令时则返回 true，否则返回 false。 |\n| j | 9 | 不带导零的月中的某一天。 |\n\
  | l | Monday | 英语星期。 |\n| L | true, false | 如果年份是闰年则返回 true，否则返回 false。 |\n| m |\
  \ 08 | 数字形式的月份，单数字月份前有零。 |\n| M | Mar | 月份名称的三字母英语缩写。 |\n| n | 8 | 不带导零的数字月份。 |\n\
  | N | 7 | 数字形式的 ISO 8601 星期（从 1 = 周一到 7 = 周日）。 |\n| o | 2025 | ISO 8601 年份（类似于 Y，但年份更改不是与\
  \ 01.01 关联，而是与格式规格的周关联）。 |\n| O | +0100 | 与格林尼治标准时间 (GMT) 的小时时间差。例如，德国在夏令时的时差为 +0100\
  \ 或 +0200。 |\n| P | +01:00 | 与 GMT 的时间差（与 O 类似，但在小时和分钟之间有冒号）。 |\n| r | Fri, 11 Jul\
  \ 2025 16:06:07+0100 | 符合 IETF RFC 2822 标准的特殊格式日期（`www.ietf.org/rfc2822`）。 |\n|\
  \ s | 09, 45 | 时间的秒，前面有零。 |\n| S | st, nd, rd, th | 月中日的英语后缀（由 j 输出）。 |\n| t | 28,\
  \ 29, 30, 31 | 指定月份的天数。 |\n| T | Western European Time | 当前时区。 |\n| u | 0000 | 毫秒；`date()`\
  \ 始终返回 0000，但 `DateTime::format()` 返回实际的毫秒，因为 `date()` 只与整数进行计算。 |\n| U | 108946808\
  \ | 自 Unix 纪（1970 年 1 月 1 日 00:00:00 GMT）以来的秒数。时间戳。 |\n| w | 3 | 从 0（周日）到 6（周六）的星期。\
  \ |\n| W | 33 | 年中的周。与 w 不同，周从周一开始（符合 ISO 标准）。 |\n| Y | 2024 | 四位数字年份。 |\n| y |\
  \ 24 | 两位数字年份。 |\n| z | 01 | 不带导零的一年中的一天。 |\n| Z | UTC | UTC 偏移。 |\n\n\n\n\n\n`microtime()`\
  \ 函数也返回当前时间的时间戳，但自 Unix 时间以来的微秒数。这种计量单位在其他编程语言中也可以找到。但在 PHP 中，秒级时间戳是标准。\n\n使用 `DateTime`，你可以通过\
  \ `getTimestamp()` 方法获取时间戳。与 `time()` 和 `microtime()` 不同，它也适用于任何日期值。然而，返回的仍然是秒，而不是微秒。图\
  \ 9.11 显示了相应的结果。\n\n```php\n<?php \n  $date = new DateTime(); \n  echo $date->getTimestamp();\n\
  \n  echo '<br />'; echo \n  microtime();\n\n  echo '<br />'; \n  echo time(); \n\
  ?>  \n```\n\n**代码列表 9.16** 创建时间戳 (\"timestamp.php\")\n\n转换为时间戳的另一种选项是 `mktime(hour,\
  \ minute, second, month, day, year, daylight saving time)` 函数，它将日期转换为 Unix 时间戳。该函数接受时间以及日期作为参数。最后一个参数指定当前是否为夏令时（值为\
  \ 1）或冬令时（值为 0）。默认值为 -1；这意味着 PHP 会尝试自行判断是夏令时还是冬令时。参数的顺序是强制性的。如果你省略了末尾参数，将使用系统的当前日期。\n\
  \n![不同方法的时间戳](img/img-f9.11.html) \n\n**图 9.11** 不同方法的时间戳\n\n你也可以为 `getdate()` 和\
  \ `date()` 指定任何日期。你只需将此日期作为函数的最后一个参数写入。在下面的示例中，指定了一个日期，然后使用 `date()` 读取该日期的星期几。\n\
  \n```php\n<?php \n  $timestamp = mktime(0, 0, 0, 4, 18, 1978); \n  $weekday = date(\"\
  l\", $timestamp); \n  echo \"The birthday was a \" . $weekday; \n?>  \n```\n\n**代码列表\
  \ 9.17** 创建时间戳 (\"any\\_date.php\")\n\n#### 注意事项\n\n负数日期值在某些 Windows 系统和某些 Linux\
  \ 系统上不起作用。这意味着你只能将 1970 年 1 月 1 日之后的日期表示为时间戳。更早的日期必须作为字符串处理。以下日期将导致错误：\n\n```php\n\
  $timestamp = mktime(0, 0, 0, 11, 2, 1907); \n```\n\n另一个限制是 1901 年 12 月 13 日 20:45:54\
  \ GMT。在这一天，PHP 用于存储该值的负 32 位整数已溢出，因此无法设置更早的日期。顺便提到，这也适用于未来：2038 年 1 月 19 日 03:14:07\
  \ GMT 是那里的限制。然而，这些限制在 64 位系统上并不适用。\n\n### 字符串格式的数据\n\n你经常以字符串形式读取日期或将其组合成字符串。这主要发生在你从用户输入的表单项创建日期时。这也有几种方法。你已经知道其中一种：将字符串传递给\
  \ `DateTime`。但是，还有一个专门的 `createFromFormat()` 方法。通过这个静态方法，你可以从一个指定了格式的字符串创建一个 `DateTime`\
  \ 对象。格式的参数与 `date()` 的参数大部分相同（参见表 9.2）。\n\n下面的示例从英文字符串创建一个日期；你可以在 图 9.12 中看到对应的输出。\n\
  \n```php\n<?php \n  $date = DateTime::createFromFormat('F d Y', 'July 18 2014');\
  \ \n  echo $date->format('m/d/Y') . '<br />'; \n  echo $date->getTimestamp() . \"\
  <br />\"; \n  $weekday = $date->format('l'); \n  echo \"The birthday was a \" .\
  \ $weekday . \".\"; \n?>  \n```\n\n**代码列表 9.18** 使用 \"createFromFormat()\" 的 \"\
  DateTime\" (\"datetime\\_createFromFormat.php\")\n\n![格式化日期、时间戳和日期的部分](img/img-f9.12.html)\
  \ \n\n**图 9.12** 格式化日期、时间戳和日期的部分\n\n#### 注意事项\n\n另一个类似且有时非常有用的函数是 `date_parse_from_format()`。它允许指定格式，并将包含日期的字符串作为第二个值。这会变成一个包含日期组件的关联数组。\n\
  \n另一种选项是辅助函数 `strtotime(date, reference)`，它能自动将英文格式的日期转换为时间戳。可选，你可以指定一个时间戳作为参考时间。这会补充任何缺失的信息。\n\
  \n现在的问题是哪些数据被正确转换了。考虑下面的简单测试脚本，你可以在 图 9.13 中看到它的输出。\n\n```php\n<?php \n  $date =\
  \ \"July 18 2014\"; \n  $timestamp = strtotime($date); \n  echo $timestamp; \n?>\n\
  ```\n\n**代码列表 9.19** \"strtotime()\" (\"strtotime.php\")\n\n![不同方法的时间戳](img/img-f9.13.html)\
  \ \n\n**图 9.13** 不同方法的时间戳\n\n\n\n\n如果你使用 `strftime()` 格式化日期，也可以通过特殊的本地时间设置来实现。`setlocale(category,\
  \ local setting)` 函数用于为特定类别设置一个或多个本地设置。该类别可以是小数点分隔符（`LC_NUMERIC`）、所有内容（`LC_ALL`）或时间（`LC_TIME`）。作为本地设置，例如，为德语区域输入\
  \ `de_DE`。你可以用逗号分隔多个条目，或者将它们封装成一个数组。下面的示例输出了德语的月份（参见图 9.14），其中本地设置用逗号隔开。\n\n```php\n\
  <?php \n  setlocale(LC_TIME, \"de_DE\", \"de\", \"ge\"); \n  echo strftime(\"In\
  \ month %B\"); \n?>  \n```\n\n**列表 9.21** \"setlocale()\" (\"setlocale.php\")\n\n\
  ![使用 \"setlocale()\" 显示的德语月份 – 使用已弃用的函数 strftime()](img/img-f9.14.html)\n\n**图 9.14**\
  \ 使用 \"setlocale()\" 显示的德语月份 – 使用已弃用的函数 strftime()\n\n### 注意\n\n通过 `date_default_timezone_get()`，你可以读取默认时区，并使用\
  \ `date_default_timezone_set()` 设置它。\n\n### \"idate()\"\n\n`idate(format, timestamp)`\
  \ 函数返回日期的一个元素。因此，你只能为 `format` 指定一个缩写。该缩写是 `date()` 列表中的一个。然而，`idate()` 只使用那些返回整数的缩写。这正是\
  \ `idate()` 的特殊之处——因此在 `date()` 前面有一个 `i`（代表 integer 整数）：\n\n```\necho idate(\"\
  m\");  \n```\n\n就像 `date()` 一样，你可以在 `idate()` 中使用时间戳，也可以省略它。\n\n### GMT\n\nGMT 代表格林威治标准时间（Greenwich\
  \ Mean Time）。其他时区的日期始终总是带有时间差的。因此，某些日期函数专门用于在没有时间偏移的情况下与 GMT 工作。如果你想手动处理时间差，这些函数就非常重要。以下是可用的函数：\n\
  \n- `gmmktime()` 生成一个时间戳。\n- `gmdate()` 返回日期并允许使用格式字符串。\n- `gmstrftime()` 使用来自 C\
  \ 语言的格式字符串进行格式化。\n\n这些函数的参数和结果与不受 GMT 的原始函数相同。\n\n### 9.2.6 倒计时：使用日期进行计算\n\n尝试计算两个日期之间经过了多少时间。好吧，从元旦到除夕太简单了——但只要跨度超过几年，你就必须包含闰年，否则一旦跨度细化到秒，我们的数学小脑就失效了。\n\
  \n为了能够通过 PHP 对数据进行计算，你需要一个基准。这个基准是 `1970.1.1` `00:00:00` 的时间戳。你可以用它简单地从一个日期减去或向另一个日期加上日期。结果始终是秒数差。然后你可以将这些秒转换为任何所需的单位。\n\
  \n下面的示例显示了一个表单，它从用户输入的日期中减去当前日期。然后以整天为单位显示结果。你可以在图 9.15 和图 9.16 中看到表单和结果。\n\n```php\n\
  <?php\n  if (isset($_POST[\"submit\"])) {\n    $date1 = strtotime($_POST[\"input\"\
  ]);\n    $date2 = time();\n    $result = $date1 - $date2;\n    if ($result > 0)\
  \ {\n      echo \"Still \" . floor($result / (60 * 24)) . \" days \";\n      echo\
  \ \"until \" . date('m/d/Y', $date1);\n    } else {\n      echo \"你的日期不在未来！\";\n\
  \    }\n  }\n?>\n```\n\n```html\n<html>\n<head>\n  <title>最后的倒计时</title>\n</head>\n\
  <body>\n  <form method=\"POST\">\n    <input type=\"text\" name=\"input\" />\n \
  \   <input type=\"submit\" name=\"submit\" value=\"还有多久?\" />\n  </form>\n</body>\n\
  </html>\n```\n\n**列表 9.22** 简单的倒计时 (\"countdown.php\")\n\n![距离 2028 年 3 月 2 日还有多久？](img/img-f9.15.html)\n\
  \n**图 9.15** 距离 2028 年 3 月 2 日还有多久？\n\n![还有几天……](img/img-f9.16.html)\n\n**图 9.16**\
  \ 还有几天……\n\n这是最简单的的倒计时示例。当然，你应该先添加检查用户输入的日期格式是否正确的函数。\n\n### 提示\n\n在实践中，在单独的元素中查询日、月、年被证明很有用。如果它们都经过指定，将是最安全的。然后你只需要处理天。例如，你可以使用\
  \ `date()`。\n\n如果你想让日期更加色彩丰富，可以使用图片创建倒计时。你只需要 0 到 9 的数字图片。最好对这些数字进行智能命名——例如，从 `0.gif`\
  \ 到 `9.gif`——然后根据数字插入相应的图片。下面的示例显示了倒计时中必要的更改：\n\n```php\nif ($result > 0) {\n  $days\
  \ = str_split(floor($result / (60 * 24)));\n  echo \"Still \";\n  for ($i = 0; $i\
  \ < count($days); $i++) {\n    echo \"<img src='\" . $days[$i] . \".gif' />\";\n\
  \  }\n  echo \"until \" . date('m/d/Y', $date1);\n} else {\n    echo \"你的日期不在未来！\"\
  ;\n}\n```\n\n**列表 9.23** 带图形的倒计时 (\"countdown_images.php\" 节选)\n\n计算结果被拆分成一个数组。然后\
  \ `for` 循环遍历数组并为每个位置输出对应数字的图片（参见图 9.17）。数字来自包含单个数字的数组。\n\n![带图片的显示](img/img-f9.17.html)\n\
  \n**图 9.17** 带图片的显示\n\n### 提示\n\n倒计的连续动画是客户端技术的任务，如 JavaScript。为什么？对于像 PHP 这样的服务端语言，倒计时每次更新都需要再次传输数据。\n\
  \n另一种实现倒计时的方法是使用 `DateTime` 对象，配合 `diff(DateTime, Absolute)` 方法。首先你必须将日期值转换为 `DateTime`\
  \ 对象，然后将第一个作为第二个对象的参数使用。\n\n第二个参数是可选的。如果设置为 true，即使比较的日期在过去，返回值也是正数。\n\n`diff()`\
  \ 的结果是一个 `DateInterval` 对象。它包含了两个日期之间的差值属性：`y` 代表年、`m` 代表月、`d` 代表天、`h` 代表小时、`i`\
  \ 代表分钟、`s` 代表秒。\n\n在我们的情况下，我们想要总天数而不是通过年份计算。这里有一个独立的 `days` 属性用于此处，但只有当 `DateInterval`\
  \ 是通过 `diff()` 方法创建时才有效。\n\n要检查倒计时日期是否在未来，你可以比较两个 `DateTime` 对象。经典的比较参数如 `==`、`<`\
  \ 和 `>` 可用于此。\n\n```php\n<?php \n  if(isset($_POST[\"Submit\"])) { \n    $date1\
  \ = new DateTime($_POST[\"input\"]); \n    $date2 = new DateTime(); \n    $diff\
  \ = $date2->diff($date1); \n    if ($date1 > $date2) { \n      echo \"还有 \" . $diff->days\
  \ . \" 天 \"; \n      echo \"until \" . $date1->format('m/d/Y'); \n    } else { \n\
  \      echo \"你的日期不在未来！\"; \n     }  \n  } \n?>  \n```\n\n**列表 9.24** 使用 \"DateTime\"\
  \ 的倒计时 (\"countdown_datetime.php\" 节选)\n\n### 提示\n\n除了 `diff()`，`DateTime` 还提供了\
  \ `add()` 和 `sub()` 方法，用于日期增加或减去天、月、年等。`modify()` 也允许指定字符串值，如 `+2 days`。\n\n\n\n\
  \n\nPHP 中的正则表达式最初源于 Perl 编程语言。在实践中，它们主要用于字符串的验证和搜索，而这些是简单的相等检查无法实现的。因此，在学习基础知识和函数概述之后，你还会发现一些应用示例，例如邮政编码、电话号码和链接的过滤。\n\
  \n### 注意\n在 PHP 中，长期存在第二类型的正则表达式（RegEx）：POSIX。这种类型源于 Unix 命令行中的正则表达式。它们曾配合 `ereg_*`\
  \ 函数使用，但从 PHP 5.3 起这些函数已不再被推荐使用，并在 PHP 7 中被删除了。\n\n## 10.1 基础\n\n如所述，正则表达式是可用于识别区域或整个字符串的模式。这些模式遵循某些规则，并使用元字符来表示特定的模式。我们在这里介绍模式和元字符的基础知识。\n\
  \n### 注意\n本章主要展示 PHP 函数，只能为正则表达式奠定基础。有关更多信息，我们推荐阅读 Jeffrey E. F. Friedl 写的《Mastering\
  \ Regular Expressions》（O'Reilly, 2006）。\n\n这里总结了最重要的信息：\n\n- 数字和字母对应其自身。\n  ```\n\
  \  a\n  ```\n  因此期望将 `a` 作为组件。\n- 某些字符在正则表达式中具有特殊含义。这些包括以下元字符：\n  ```\n  |[]{}()^$*+.?\
  \  \n  ```\n- 元字符使用反斜杠 (`\\\\`) 进行转义。\n  ```\n  \\\\\n  ```\n  因此使反斜杠失效。这意味着在字符串的这一点恰好有一个反斜杠。\n\
  - `^` 代表模式的开头；`$` 表示模式的结尾。\n- `\\b` 在到达单词的开头或结尾时返回真。`\\B` 是它的对立面，在不是单词边界时返回真。\n\
  - 字符组——即多个字符的选择——可以组合在方括号（`[]`）中。\n  ```\n  [ADZ]\n  ```\n  如果存在字母 A、D 或 Z，则识别该模式。你也可以指定范围——例如，：\n\
  \  ```\n  [a-z]\n  ```\n  表示所有小写字母，或者\n  ```\n  [a-zA-Z0-9]\n  ```\n  表示所有大小写字母和数字。\n\
  - 点 `.` 代表任何字符。\n- 字符类代表特定的字符类型：`\\w` 代表所有 ASCII 字符（w 来自 word），`\\d` 代表所有数字（d 来自\
  \ digit），`\\s` 代表空白字符，包括制表符和空格。\n- 你也可以排除字符类。要这样做，只需用大写字母代替小写字母。例如，`\\W` 排除所有 ASCII\
  \ 字符但允许数字；`\\D` 排除数字；`\\S` 排除空白。\n- 如果你想排除某些字符，在方括号内写入 `^`：\n  ```\n  [^ADZ]\n \
  \ ```\n  排除 A、D 和 Z。\n- 花括号（`{}` 定义字符出现的次数。\n  ```\n  \\d{5}\n  ```\n  表示出现五个数字。如果对整个字符串进行限制，如下：\n\
  \  ```\n  ^\\d{5}$\n  ```\n  这已经是检查最小美国邮政编码的正则表达式了。然而，你也可以在大括号中指定最小和最大出现次数：\n  ```\n\
  \  \\w{2,4}\n  ```\n  例如，对于许多类型的顶级域名，在两次到四次之间（尽管现在也有更长的顶级域名）。如果你省略最小/最大值中的一个，则意味着“至少”或“最多”。\n\
  \  ```\n  \\d{,8}\n  ```\n  代表最多八个数字。这里的通用规则是表达式是贪婪的，这意味着如果可用，这里总是选择最大值。\n- 频率还有一些简写形式：\n\
  \  - `?` 代表零次或一次出现（对应于 `{0,1}`）。\n  - `+` 代表一次或多次出现（对应于 `{1,}`）。\n  - `\\*` 代表任意（对应于\
  \ `{0,}`）。\n- 括号总结元素。当你有多个备选方案时，它们非常有用。用竖线（`|`）分隔替代方案：\n  ```\n  (com|org)|\\w{4}\n\
  \  ```\n  前面的检查对于 com、org 以及任何四个字母的组合均返回真。\n- 括号中的内容可以在输出的其他点被回溯。要这样做，请使用 `\\number`，其中数字代表括号的位置。第一个括号是\
  \ `\\1`，第二个是 `\\2`，依此类推。\n\n# 10.2 正则表达式函数 \n\n本节提供了 PHP 中正则表达式各种函数和可能性的概述。\n\n\
  ### 10.2.1 \"preg_match()\"\n\n检查正则表达式的最简单方法是使用 `preg_match(RegEx, String)` 函数。第一个参数是正则表达式；第二个参数是要应用于它的字符串。\n\
  \n如果正则表达式匹配（即在字符串中找到），该函数返回 1，否则返回 0。\n\n### 注意\nfalse 是一个布尔值，只有在 `preg_match()`\
  \ 函数的 `preg_match()` 中才会返回（注：此处原文似乎有重复错误，已按原意翻译）。\n\n\n\n\n`preg_match()` 只能找到搜索字符串的第一次出现。更灵活的选项是\
  \ `preg_match_all()`。你可以在 图 10.3 中查看它的输出。\n\n```php\n<?php\n  $text = \"Hello all!\"\
  ;\n  $reg = \"/ll/\";\n  preg_match_all($reg, $text, $parts, PREG_OFFSET_CAPTURE);\n\
  \  print_r($parts);\n?>  \n```\n\n**列表 10.3**    \"preg_match_all()\" (\"preg_match_all.php\"\
  )\n\n![\"preg_match_all()\" 找到两个匹配处](img/img-f10.3.html) \n\n**图 10.3**     \"preg_match_all()\"\
  \ 找到两个匹配处\n\n然而，`preg_match_all(RegEx, String, Variable, Mode)` 的模式还有其他值：`PREG_PATTERN_ORDER`\
  \ 和 `PREG_SET_ORDER`。你可以通过连续编写模式并用 `|` 分隔将两者与 `PREG_OFFSET_CAPTURE` 结合。如果缺失指定，默认为\
  \ `PREG_PATTERN_ORDER`。找到的模式以数组形式存储在 `variable` 的第一个元素（索引 0）中。在第二个及后续元素中，指定了由括号划分的模式部分的位置。\n\
  \n这里有一个小示例来说明这一点：\n\n```php\n$text = \"Otto\";\n$reg = \"/(Ot|ot)|(to|tO)/\";\n\
  preg_match_all($reg, $text, $parts, PREG_PATTERN_ORDER);  \n```\n\n这返回 `Ot` 和 `to`\
  \ 作为所有模式检查的结果。每个独立区域都提供一个结果（参见 图 10.4）。\n\n![各个组件](img/img-f10.4.html) \n\n**图 10.4**   \
  \  各个组件\n\n另一方面，`PREG_SET_ORDER` 对结果进行排序，使得第一个数组元素对应第一个括号的结果，第二个对应第二个括号的结果，以此此类推（参见\
  \ 图 10.5）。\n\n```php\n<?php\n  $text = \"Otto\";\n  $reg = \"/(Ot|ot)|(to|tO)/\"\
  ;\n  preg_match_all($reg, $text, $teile,PREG_SET_ORDER);\n  print_r($parts);\n?>\
  \  \n```\n\n**列表 10.4**     \"preg_match_all()\" 的选项 (\"preg_match_all_opt.php\"\
  )\n\n![各个组件的两个结果](img/img-f10.5.html) \n\n**图 10.5**     各个组件的两个结果\n\n### 10.2.2\
