  \n\n\n\n\n数据——以及数据库——也可以快速删除。例如，Tobias 可能对数据库中的昵号（或其中一个条目）不满意（或感到羞耻），想要删除该条目。这可以通过\
  \ `DELETE FROM <table name>` 实现。如果你只执行此命令，你将删除所有数据。因此，在这里使用 `WHERE` 子句来限制要删除的结果集是非常重要的：\n\
