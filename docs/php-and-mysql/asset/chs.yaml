  ### 10.3.3 过滤链接\n\n在分析文本文档（如 XML 或 HTML 格式的文档）时，正则表达式非常有用。一个常见的例子是过滤链接。\n\n####\
  \ 注意事项\n\n在第 35 章中，你将找到一个不需要正则表达式的过滤链接示例，但它的效果并不理想。\n\n我们现在向你展示一个带有正则表达式的脚本。该正则表达式过滤掉链接。由于链接目标和名称周围都放置了圆括号，你也可以单独访问它们，如图\
  \ 10.8 所示。\n\n```php\n<?php\n  $html = '<html><body><a id=\"test\" href=\"rheinwerk-publishing.com\"\
  \ target=\"top\">Rheinwerk Publishing</a><br /><a href=\"../newdoc.html\">NewDoc</a></body></html>';\n\
  \  $reg = \"/<\\s*a[^h]*[^r]*[^e]*[^f]*href=\\\"([^\\\"]+)\\\"[^>]*>([^<]*)<\\/a>/\"\
  ;\n  if (preg_match_all($reg, $html, $parts)) {\n    print_r($parts);\n  }\n?>\n\
  ```\n\n**列表 10.6** 从 HTML 文档中过滤链接（\"links.php\"）\n\n![数组包含所有结果，然后单独包含各个结果](img/img-f10.8.html)\
  \ \n\n**图 10.8** 数组包含所有结果，然后单独包含各个结果\n\n### 提示\n\n如果你也想过滤带有大写字母的链接，只需在分隔符末尾添加一个\
  \ `i`：\n\n```php\n$reg = \"/<\\s*a[^h]*[^r]*[^e]*[^f]*href=\\\"([^\\\"]+)\\\"[^>]*>([^<]*)<\\\
  /a>/i\"; \n```\n\n# 11 面向对象编程\n\n面向对象编程是现代软件开发的核心。PHP 为此提供了必要的工具。\n\n面向对象（面向对象编程\
  \ [OOP] 的核心）最重要的优势如下：\n\n* 模块化——即划分为更小的代码模块\n* 灵活性——即易于访问拆分后的模块\n\n最晚在第 4 到第 6 章之后，你将熟悉过程化编程。循环和分支判断决定了执行顺序；函数存储功能并可以被调用。OOP\
  \ 打破了这种线性、有时僵化的概念，并将功能分布到逻辑单元中：类和对象。你可以在第 11.2 节中学习这些基础知识。在此之前，我们将先简要介绍一下 PHP 面向对象的历史。\n\
  \n## 11.1 PHP 面向对象历史\n\n与 Java 和 ASP.NET 不同，PHP 并不是面向对象的先驱之一，但这种可能性至少在 PHP 5 时代得到了巨大的增长。今天，在面向对象方面，PHP\
  \ 与所有其他 Web 编程语言并驾。\n\n在 PHP 4 项目中，面向对象的使用仍然相对较少。原因之一是模块化才缓慢获得接受。通常，一个 Web 项目不需要大量的代码来让\
  \ OOP 发挥特别大的优势。另一方面，PHP 4 的面向对象能力非常有限。\n\nPHP 5 几乎完全改变了面向对象的概念。其主要原因是作为 PHP 语言核心的\
  \ Zend Engine II。PHP 5 面向对象的成功是极其响亮的：今天，没有任何已知的 PHP 的开源项目可以脱离它。随着时间的推移和 PHP 5 的各个版本，增加了许多新功能，包括后期静态绑定（第\
  \ 11.3.6 节）、新的错误级别（第 11.4.1 节）以及第 11.5 节中描述的错误级别。\n\n最后，在 PHP 7 中，底层的 PHP 引擎被完全重构，性能大幅提升——但面向对象保持与\
  \ PHP 5 相同。新功能包括匿名类（第 11.3.8 节）。在较新的 PHP 7 版本中，已经并持续添加了详细的改进（参见第 1 章）。\n\nPHP 8\
  \ 的主要特点是代码更清晰、更严谨。后者的目的是避免 bug 并编写更好的代码。以下是最重要功能的概述：\n\n* 面向对象的方法采用了 PHP 8 的新功能，参见第\
  \ 1 章。\n* 命名参数允许访问方法参数。\n* 联合类型扩展了对方法参数或返回值的类型定义。\n* PHP 8 允许在列表末尾使用逗号，作为一种细微的语法改进。\n\
  * 新引入的构造函数属性提升在创建属性时节省了大量代码量。\n* 通过所谓的属性（Attributes），PHP 8 引入了原生元数据，你可以通过反射 API\
  \ 访问它们。\n* static 现在被允许作为返回类型。\n* 在 PHP 8 中，对同名私有方法的继承不再进行不必要的检查。\n* WeakMap 是 PHP\
  \ 7.4 引入的一种用于“弱”引的标准类。其背后的想法是使对象引用可用，但在对象被删除时不会保留。基本上，它是一种对象缓存（更多信息请参见 [`wiki.php.net/rfc/weak_maps`](https://wiki.php.net/rfc/weak_maps)）。\n\
  * PHP 8 自动为使用 `__toString()` 的类添加了新的 _Stringable 接口（[`wiki.php.net/rfc/stringable`](https://wiki.php.net/rfc/stringable)）。\n\
  * PHP 8.1 增加了将属性声明为 readonly 的选项。在 PHP 8.2 中，readonly 也变成了类级别的选项。\n* 从 PHP 8.1 开始，对象也可以用作静态变量、参数的默认值以及全局常量和属性参数。\n\
  * 在 PHP 8.1 中，动态设置属性被归为废用。然而，通过设置 `#[AllowDynamicProperties]` 属性可以专门为类允许它们。\n* 从\
  \ PHP 8.1 开始，类中的常量也可以标记为 final。\n* 起 PHP 8.3，常量也可以带有数据类型。\n* 在 PHP 8.3 中，`#[Override]`\
  \ 属性允许你标记一个正如其名重写了另一个的方法。\n\n## 11.2 类与对象：基本概念\n\n\n\n\n正如其名所示，对象是面向对象编程的核心。最好将对象看作是真实的东西。例如，你桌子面上或桌子下的电脑就是一个对象。现在，一台计算机无法在编程语言中被完全描述。即使是计算机的三维模型，也不包含它的所有方面。例如，风扇特有的嗡嗡声就缺失了。\n\
  \n然而，面向对象编程并不是为了精确的描述，而是为了使用相应对象的某些方面。一个对象由多个属性组成。例如，计算机的一个属性可以是所使用的 `CPU`。对象还拥有方法。与函数类似，方法包含功能。它为对象提供这种功能。例如，计算机可以有一个\
  \ `start()` 方法。通过圆括号，你已经可以看到属性和方法之间的区别了。\n\n但这一切与“类（class）”这个术语有什么关系呢？一个 `class`\
  \ 定义了对象的结构。结构指的是对象的属性和方法。这意味着一个计算机 `class` 为所有单独的计算机定义属性和方法。然而，属性还没有值。`class` 只规定了结构。一个特定的计算机，例如你自己的个人电脑，那么就是一个对象（参见图\
  \ 11.1）。\n\n对象是 `class` 的实例。可以说实例“属于”该 `class`，并且对象必须相应地实例化。当然，可以从一个 `class` 实例化任意数量的对象。这是面向对象编程灵活性的一部分。\n\
  \n![类与对象之间的关系](img/img-f11.1.html)\n\n**图 11.1** 类与对象的关系\n\n## 11.2.1 PHP 中的类与对象\n\
  \n到目前为止，这些都是理论。现在让我们来看一点代码，这样你对面向对象就会有一个更好的直。。以下代码创建了一个 `class`，这个类有一个 `CPU` 属性和一个\
  \ `start()` 方法：\n\n```php\nclass Computer {\n  public $CPU = \"The CPU\";\n  public\
  \ function start() {\n    echo \"Computer started\";\n  }\n}\n```\n\n表示类的 `class`\
  \ 关键字是至关重要的。属性通过 `public` 关键字定义并被赋予了一个值。在此语境下，`public` 意味着该属性可以从类外部访问。你可以为每个对象调整这个值。方法的定义方式与函数完全相同。\n\
  \n你现在必须创建（或实例化）该类的对象才能对其操作。这涉及到 `new` 关键字：\n\n```php\n$MyComputer = new Computer();\n\
  ```\n\n新对象被赋值给变量。语法如下：\n\n```php\n$Object = new Class();\n```\n\n要访问方法或属性，PHP 使用以下方法的语法：\n\
  \n```php\n$Object->Method();\n```\n\n以及用于属性的语法：\n\n```php\n$Object->Property;\n\
  ```\n\n然后这样调用 `Computer` 类的 `start()` 方法：\n\n```php\n$MyComputer->start();\n```\n\
  \n![方法返回输出](img/img-f11.2.html)\n\n**图 11.2** 方法返回输出\n\n### 注意\n\nPHP 使用了一种有点不寻常的语法，使用减号加上大于号——即箭头\
  \ (`->`）。相反，基于 C 的语言通常使用点符号语法来调用方法：\n\n```\nObject.method()\n```\n\n以及用于属性的：\n\n\
  ```\nObject.property\n```\n\n然而，转换并不复杂。在这方面，作为一个新手，你也应该能够很好地处理 PHP 语法。\n\n### 11.2.2\
  \ 属性\n\n属性可以被读取和更改。以下脚本读取一个属性然后输出它。\n\n```php\n<?php\n  class Computer {\n    public\
  \ $CPU = \"The CPU\";\n    public function start() {\n      echo \"Computer started\"\
  ;\n    }\n  }\n  $obj = new Computer();\n  echo $obj->CPU;\n?>\n```\n\n**列表 11.1**\
  \ 读取属性 (\"properties.php\")\n\n属性可以被读取和更改。\n\n### 注意\n\n`public` 关键字定义了属性。为了以完全面向对象的方式工作，不应该直接访问如图\
  \ 11.1 所示的 `private` 属性。使用赋值运算符 `=` 来更改属性。以下示例为属性属性赋值了一个新值，然后显示更改后的值。\n\n```php\n\
  <?php\n  class Computer {\n    public $CPU = \"The CPU\";\n    public function start()\
  \ {\n      echo \"Computer started\";\n    }\n  }\n  $obj = new Computer();\n  echo\
  \ $obj->CPU;\n  $obj->CPU = \"New CPU\";\n  echo $obj->CPU;\n?>\n```\n\n**列表 11.2**\
  \ 更改属性 (\"properties.php\")\n\n输出结果因此是 `New CPU`。\n\n![属性的值](img/img-f11.3.html)\n\
  \n**图 11.2** 属性的值\n\n### 11.2.3 方法\n\n方法包含功能。正如已经所示，访问与属性非常相似。然而，你可以通过方法做更多。\n\n\
  ### 参数\n\n方法可以接受参数（参见图 11.3）。这种方式与函数相同。\n\n```php\n<?php\n  class Computer {\n \
  \   public function shutdown($seconds) {\n      echo \"Computer will shut down in\
  \ $seconds seconds\";\n    }\n  }\n  $MyComputer = new Computer();\n  $MyComputer->shutdown(12);\n\
  ?>\n```\n\n**列表 11.3** 传递方法 (\"methods.php\")\n\n![带参数的消息](img/img-f11.4.html)\n\
  \n**图 11.3** 带参数的消息\n\n正如函数一样，你也可以为参数分配默认值。考虑以下简单的示例。\n\n```php\n<?php\n  class\
  \ Computer {\n    function shutdown($seconds = 20) {\n      echo \"Computer will\
  \ shut down in $seconds seconds\";\n    }\n  }\n  $MyComputer = new Computer();\n\
  \  $MyComputer->shutdown();\n?>\n```\n\n**列表 11.4** 带默认值的方法 (\"methods.php\")\n\n\
  方法现在输出计算机将在 20 秒后关闭。参数默认按值传递。对象是唯一的例外：它们按引用传递。要将其他参数作为引用传递，请在参数名前使用取 符号 (`&`)。\n\
  \n```php\n<?php\n  class Computer {\n    public function shutdown(&$seconds) {\n\
  \      echo \"Computer will shut down in $seconds seconds\";\n    }\n  }\n\n  $duration\
  \ = 12;\n  $MyComputer = new Computer();\n  $MyComputer->shutdown($duration);\n\
  ?>\n```\n\n**列表 11.5** 引用方法的参数 (\"methods.php\")\n\n### 返回\n\n与函数的相似性系列并没有此停止。方法可以使用\
  \ `return` 返回一个值，就像函数一样。图 11.5 显示了以下示例的结果。\n\n```php\n<?php\n  class Computer {\n\
  \    public function start($medium) {\n      return \"The computer starts from $medium\"\
  ;\n    }\n  }\n  $MyComputer = new Computer();\n  echo $MyComputer->start(\"a stick\"\
  );\n?>\n```\n\n**列表 11.6** 带返回值的方法 (\"methods.php\")\n\n\n\n\n![只有在值返回后才会进行输出](img/img-f11.5.html)\
  \ \n\n**图 11.5** 只有在值返回后才会进行输出\n\n### 提示\n当然，之前为函数提到的其他其他细节也适用于这里。例如，如果你需要多个返回值，可以使用数组来实现这一点。\n\
  \n### \"$this\": 属性和方法的访问\n到目前为止，方法似乎只出现在对象内部且不进行交互。然而，当方法与其他属性和方法进行交互时，它才真正发挥出作用。如果你想在方法内部调用同一个对象的属性或方法，你需要该对象的引用。但是，由于从一个类可以创建不同的对象，你无法预先知道对象的名称。对于这种情况，有一个\
  \ `$this` 关键字，它提供了对当前对象的引用。\n\n通过\n\n```\n$this->Property  \n```\n\n或者\n\n```\n\
  $this->method()\n```\n\n你可以访问类的其他属性和方法。在接下来的这个简单实用示例中，该方法返回一个字符串，其中包含了 `CPU` 属性的值（参见图\
  \ 11.6）。\n\n```php\n<?php\n  class Computer {\n    public $CPU = \"The CPU\";\n\
  \    public function getCPU() {\n      return \"The computer is equipped with a\
  \ $this->CPU CPU.\";\n    }\n  }\n  $MyComputer = new Computer();\n  $MyComputer->CPU\
  \ = \"4 GHZ\";\n  echo $MyComputer->getCPU();\n?>  \n```\n\n**列表 11.7** \"$this\"\
  \ 的使用 (\"methods_this.php\")\n\n![使用 \"$this\" 的方法输出包含了该属性](img/img-f11.6.html)\
  \ \n\n**图 11.6** 使用 \"$this\" 的方法输出包含了该属性\n\n### 提示\n使用以 `get` 开头的方法来读取属性是面向对象编程中的常见程序。对应的通常是以\
  \ `set` 开头的方法，用于设置属性的值。\n\n### 重载\nPHP 不支持经典的函数重载。这意味着你不能创建多个具有不同参数的方法。然而，可以模拟重载。对于参数的数量，你可以通过默认值来实现重载，或者使用读取灵活数量参数的函数。78\n\
  \n不过，你可以使用类型识别函数并配合分支语句来过滤不同的数据类型。下面的小示例检查秒数是否指定为数字。如果是，脚本将追加一个带有单位的字符串。\n\n```php\n\
  class Computer {\n  public function shutdown($seconds) {\n    if (is_integer($seconds))\
  \ {\n      $seconds = $seconds .\" seconds\";\n    }\n    echo \"Computer is shutting\
  \ down in $seconds\";\n  }\n }  \n```\n\n**列表 11.8** 使用不同数据类型的重载 (\"objects_overload.php\"\
  )\n\n这种重载方法的优点在于，无论是以下这种调用：\n\n```php\n$MyComputer = new Computer();\n$MyComputer->shutdown(12);\
  \  \n```\n\n还是带有单位的调用：\n\n```php\n$MyComputer = new Computer();\n$MyComputer->shutdown(\"\
  12 seconds\");  \n```\n\n都会产生相同的输出，如图 11.7 所示。\n\n![也附带单位](img/img-f11.7.html) \n\
  \n**图 11.7** 也附带单位\n\n### 提示\n你当然可以像这里这样模拟重载。这有时非常实用。然而，大量必要的分支语句并不一定优雅。因此，你应该谨慎地使用这个工具。\n\
  \n### 11.2.4 继承\n到目前为止，你只看到了一个孤立的类。但在实践中，类层次结构会迅速出现。这意味着一个类获取了另一个更高层次类的属性和方法。这个过程被称为继承。\n\
  \n考虑一个简单的例子：`Computer` 类适用于所有电脑。然而，特殊的电脑如笔记本电脑或台式电脑可以拥有自己的属性和方法。例如，笔记本电脑仍然拥有集成显示器。另一方面，台式电脑可以（更容易地）拆卸。\n\
  \n这种类层次结构也可以在 PHP 编程中表示。`extends` 关键字用于此目的。79 理论上的用法如下：\n\n```php\nclass Name extends\
  \ OtherClass {\n  private $Property;\n  public function Method() {\n    instructions;\n\
  \  }\n }  \n```\n\n新类继承自已有的类。这意味着它吸收了该类所有的属性和方法，然后定义它自己的。\n\n考虑下面的这个小示例。\n\n```php\n\
  <?php\n  class Computer {\n    public $CPU = \"The CPU\";\n    public function start()\
  \ {\n      return \"Computer is started.\";\n    }\n  }\n  class Laptop extends\
  \ Computer {\n    public $Display = \"15 inch\";\n  }\n  $MyLaptop = new Laptop();\n\
  \  $MyLaptop->CPU = \"2.5 GHZ\";\n  echo \"CPU: $MyLaptop->CPU<br/>\";\n  echo \"\
  Display: $MyLaptop->Display\";\n?>  ```\n\n**列表 11.9** 使用 \"extends\" 的继承\n\n在示例中，`Laptop`\
  \ 类继承了 `Computer` 类。它继承了 `CPU` 属性和 `start()` 方法，但随后定义了自己的 `Display` 属性。\n\n![脚本输出了类类和父类](img/img-f11.8.html)\
  \ \n\n**图 11.8** 脚本输出了类类和父类\n\n### 覆盖\n通过继承，你可以覆盖父类的属性和方法。要做到这一点，只需创建一个与其对应项同名的属性或方法。在接下来的示例中，`CPU`\
  \ 属性和 `start()` 方法都被重写了；图 11.9 显示了结果。\n\n```php\n<?php\n  class Computer {\n   \
  \ public $CPU = \"The CPU\";\n    public function start() {\n      return \"Computer\
  \ is started.\";\n    }\n  }\n  class Laptop extends Computer {\n    public $CPU\
  \ = \"2, GHZ\";\n    public function start() {\n      return \"Laptop is started.\"\
  ;\n    }\n  }\n  $MyLaptop = new Laptop();\n  echo \"CPU: $MyLaptop->CPU<br/>\"\
  ;\n  echo $MyLaptop->start();\n?>  ```\n\n**列表 11.10** 覆盖属性和方法 (\"inheritance_overwrite.php\"\
  )\n\n### 间接访问方法\n如果你想从方法访问超类的方法，你需要该类的引用。你可以实例化一个对象或使用冒号语法直接访问类，但那样你将始终需要类的名称。更聪明的替代方案是使用\
  \ `parent` 关键字。这允许你访问父类，无论其名称为何。\n\n```php\n<?php\n  class Computer {\n    public\
  \ $CPU = \"The CPU\";\n    public function start() {\n      return \"Computer is\
  \ started.\";\n    }\n  }\n  class Laptop extends Computer {\n    public function\
  \ start() {\n      return \"Laptop: \" . parent::start();\n    }\n  }\n  $MyLaptop\
  \ = new Laptop();\n  echo $MyLaptop->start();\n?>  ```\n\n**列表 11.11** 通过 \"parent\"\
  \ 访问 (\"inheritance_parent.php\")\n\n![输出也是基于父类方法的](img/img-f11.10.html) \n\n**图\
  \ 11.10** 输出也是基于父类方法的\n\n### 注意\n在这种情况下，使用 `$this` 关键字引用类的属性是不可通的，因为 `$this` 总是引用当前对象。然而，通过直接链接到类方法，并没有对象。\n\
  \n### 11.3 高级\n你现在已经掌握了面向对象的基础知识。现在是时候深入了解细节了。这包含了某些方法，以及接口和抽象类。\n\n### 11.3.1 克隆对象\n\
  \n\n\n\n\nPHP 以引的方式传递对象。这在 PHP 4 中最初是不不同的，当时对象被视为值。\n\n#### 注意事项\n你可以在书籍的材料中找到一个测试示例（参见前言）。它被称为\
  \ `objects_values.php`。\n\n但我们如何将对象作为值传递给函数呢？要做到这一点，你需要克隆（clone）对象。`clone` 关键字用于为此。在这种情况下，会创建一个原始实例的副本并将其传递给函数。你可以在图\
  \ 11.11 中看到结果。\n\n```php\n<?php\n  class Computer {\n    public $CPU = \"The CPU\"\
  ;\n    public function start() {\n      echo \"Computer is started.\";\n    }\n\
  \  }\n  function change($Object) {\n    $Object->CPU = \"4 GHZ\";\n    echo \"In\
  \ the function: $Object->CPU<br />\";\n  }\n  $MyComputer = new Computer();\n  change(clone\
  \ $MyComputer);\n  echo \"Outside the function: $MyComputer->CPU\";\n?>  \n```\n\
  \n**列表 11.12**     \"clone\" 命令 (\"clone.php\")\n\n然而，克隆不仅用于将对象作为值传递；它还可以根据需要复制对象实例。\n\
  \n![在函数内部，克隆对象的值生效；在外部，原始值有效](img/img-f11.11.html) \n\n**图 11.11**     在函数内部，克隆对象的值生效；在外部，原始值有效\n\
  \n### 11.3.2 构造函数\n构造函数是在类对象被创建时执行的方法。`__construct()` 方法用于此类。它可以接受实例化对象时所需的任何参数。\n\
  \n在接的示例中，对象传递了字符串 `4 GHZ`。然后将其赋值给 `CPU` 属性。构造方法随后输出一段文本。最后，输出 `CPU` 的值。\n\n```php\n\
  <?php\n  class Computer {\n    public $CPU = \"The CPU\";\n    public function __construct($value)\
  \ {\n      $this->CPU = $value;\n      echo \"Object instantiated<br />\";\n   \
  \ }\n  }\n  $MyComputer = new Computer(\"4 GHZ\");\n  echo $MyComputer->CPU;\n?>\
  \  \n```\n\n**列表 11.13**     \"__construct()\" (\"constructor.php\")\n\n该列表产生了以下输出：\n\
  \n```\nObject instantiated\n4 GHZ  \n```\n\n#### 属性提升（Property Promotion）\n在 PHP\
  \ 8 中，构造函数有了一种带有属性定义的的简写形式：即所谓的属性提升（property promotion）。其原理简单：你可以直接在构造函数中定义属性，即使是公开属性。\n\
  \n使用这种表示法，上一节的列表减少了两个行。将这三行：\n\n```php\npublic $CPU = \"The CPU\";\npublic function\
  \ __construct($value) {\n  $this->CPU = $value;  \n```\n\n变成了一行：\n\n```php\npublic\
  \ function __construct(public $CPU = \"The CPU\") {  \n```\n\n需要注意的是`$CPU` 属性的访问方式与在构造函数外部定义的属性完全相同：\n\
  \n```php\necho $MyComputer->CPU;  \n```\n\n接下来的列表提供了完整的示例。\n\n```php\n<?php\n  class\
  \ Computer {\n    public function __construct(public $CPU = \"The CPU\") {\n   \
  \   echo \"Object instantiated<br />\";\n    }\n  }\n  $MyComputer = new Computer(\"\
  4 GHZ\");\n  echo $MyComputer->CPU;\n?>  \n```\n\n**列表 11.14**     在构造函数中定义属性 (\"\
  constructor_property_promotion.php\")\n\n这对于单个属性来说并不特别，但如果你必须为类定义许多初始属性，你将获得巨大的清晰度。\n\
  \n### 11.3.3 析构函数\n`__destruct()` 析构方法在对象销毁时总是被使用。它也会做出反应，例如当对象通过 `unset(object)`\
  \ 销毁时（参见图 11.12）。\n\n```php\n<?php\n  class Computer {\n    public $CPU = \"The\
  \ CPU\";\n    public function __destruct() { echo \"Destructor active\"; }\n  }\n\
  \  $MyComputer = new Computer();\n  unset($MyComputer);\n  echo \"$MyComputer->CPU<br\
  \ />\";\n?>  \n```\n\n**列表 11.15**     \"__destruct()\" (\"objects_destructor.php\"\
  )\n\n![析构函数输出其信息；\"CPU\" 已销毁](img/img-f11.12.html) \n\n**图 11.12**     析构函数输出其信息；\"\
  CPU\" 已销毁\n\n### 11.3.4 私有的、保护的等\n`private`、`public`、`static` 和 `protected` 关键字在面向对象编程中起着重要作用。它们用于控制对对象的访问。\n\
  \n#### \"private\" 和 \"public\"\n在 PHP 中，你可以将属性标记为 `private` 或 `public`。从 PHP 7.1\
  \ 开始，它们被允许访问。在接的示例中，属性被标记为 `private`。\n\n```php\nclass Computer {\n  private $CPU\
  \ =\n```\n\n**列表 11.16**     \"private\" (\"private.php\")\n\n![访问私有属性会导致错误](img/img-f11.13.html)\
  \ \n\n**图 11.13**     访问私有属性会导致错误\n\n在这种情况下，脚本会导致如图 11.14 所示所示的错误。如果你注释掉直接访问的行，脚本即可正常工作。\n\
  \n```php\n// $MyComputer->CPU;\n```\n\n**图 11.14**     脚本正常工作\n\n私有也可以用于方法。考虑图 11.15\
  \ 中的示例。\n\n```php\n<?php\n  class Computer {\n    private function format() {\n\
  \      return \"Hard disk\";\n    }\n    function start() {\n      return \"Computer\
  \ started .$this->format();\n    }\n  }\n  $MyComputer = new Computer();\n  echo\
  \ $MyComputer->start();\n?>  \n```\n\n**列表 11.17**     \"private\" (\"private_method.php\"\
  )\n\n![通过公共方法读取私有方法的输出](img/img-f11.15.html) \n\n**图 11.15**     通过公共方法读取私有方法的输出\n\
  \n#### 注意事项\n默认情况下，每个属性或方法都是公共的。然而，你也应该使用 `public` 关键字将属性标记为公开：\n\n```php\nclass\
  \ Computer {\n  public $CPU = \"The CPU\";\n}\n```\n\n在面向对象编程中，你应该始终将属性标记为 `private`，并通过标记为公共的方法进行访问。这种属性的封装是良好编程风格的一部分，有助于维护脚本。通常用于读取属性的方法命名规范为\
  \ `getProperty()`，用于设置的为 `setProperty(Value)`。\n\n#### \"static\"\n标记为 `static`\
  \ 的属性和方法是静态的，因为它们通过类名在类外部访问。你不需要对象。接的列表及其在图 11.16 中的输出展示了一个简单的示例。\n\n```php\n<?php\n\
  \  class Computer {\n    static $CPU = \"The CPU\";\n    static function start()\
  \ {\n      return \"Computer is started\";\n    }\n  }\n  echo Computer::$CPU .\"\
  <br />\";\n  echo Computer::start();\n?>  \n```\n\n**列表 11.18**     静态属性和方法 (\"\
  static.php\")\n\n![访问静态属性和方法](img/img-f11.16.html) \n\n**图 11.16**     访问静态属性和方法\n\
  \n\n\n\n在标记为 `static` 的方法中，无法使用 `$this`，因为没有对象的引用。然而，`self` 可以作为延迟静态绑定（late static\
  \ binding）的一部分。有关延迟静态定的更多信息，请参见第 11.3.6 节。\n\n## \"protected\"\n\n如果你使用 `private`，则属性或方法仅适用于定义它的类。`protected`\
  \ 具有与 `private` 相同的外部保护效果，但此类属性或方法也适用于类层次结构中的所有类。\n\n```php\n<?php\n  class Computer\
  \ {\n    protected $CPU = \"3 GHZ Mobile\";\n  }\n  class Laptop extends Computer\
  \ {\n    public function getCPU() {\n      return \"The following CPU is on board:\
  \ \" .$this->CPU;\n    }\n  }\n  $MyLaptop = new Laptop();\n  echo $MyLaptop->getCPU();\n\
  ?>  \n```\n\n**列表 11.19** \"protected\" 的用法 (\"protected.php\")\n\n![读取来自上层类的 CPU](img/img-f11.17.html)\n\
  \n**图 11.17** 读取来自上层类的 CPU\n\n在前面的示例中，带有 `protected` 标记的属性定义在父类中。反过来这样做也行吗？让我们检查一下：\n\
  \n```php\nclass Computer {\n  public function getCPU() {\n    return \"The following\
  \ CPU is on board: \" . $this->CPU;\n  }\n}\nclass Laptop extends Computer {\n \
  \ protected $CPU = \"3 GHZ Mobile\";\n}  \n```\n\n答案是：可以。`protected` 为整个类层次结构释放了属性或方法——即对于父类和所有继承类。\n\
  \n#### 注意事项\n\n 方法的 `protected` 与其在属性上的用法类似。你只需要在方法前编写该关键字即可：\n\n```php\nprotected\
  \ function innerCalculation() {\n  Instructions;\n} \n```\n\n## \"final\"\n\n标记为\
  \ `final` 的方法不能在子类中被重写。因此，以下代码示例会导致错误，如图 11.18 所示。\n\n```php\n<?php\n  class Computer\
  \ {\n    final function start() {\n      return \"Computer is started\";\n    }\n\
  \  }\n  class Laptop extends Computer {\n    public function start() {\n      return\
  \ \"Laptop is started\";\n    }\n  }\n  $MyLaptop = new Laptop();\n  echo $MyLaptop->start();\n\
  ?>  \n```\n\n**列表 11.20** \"final\" (\"final.php\")\n\n![最终的 \"start()\" 方法不能被重写](img/img-f11.18.html)\n\
  \n**图 11.18** 最终的 \"start()\" 方法不能被重写\n\n#### 注意事项\n\n在 PHP 8 中，这被清理了一些：如果继承类有一个与继承类方法同名的私有方法，且该方法被标记为\
  \ `final`，则仍然会抛出致命错误。在后台，PHP 不必要地执行了继承检查，尽管继承类中的该方法是私有的。在 PHP 8 中，出于性能和整洁考虑，这种行为已被移除。\n\
  \n你也可以使用 `final` 来标识整个类。在这种情况下，你将无法继承自这些类（参见图 11.19）。\n\n```php\nfinal class Computer\
  \ {\n  public function start() {\n    return \"Computer is started\";\n  }\n}\n\
  class Laptop extends Computer {\n  public function start() {\n      return \"Laptop\
  \ is started\";\n  }\n }  \n```\n\n**列表 11.21** 最终类（节选自 \"final_class.php\"）\n\n\
  ![尝试访问最终类时的错误](img/img-f11.19.html)\n\n**图 11.19** 尝试访问最终类时的错误\n\n#### 注意事项\n\n\
  没有 `final` 属性。因此，以下构造会导致图 11.20 所示所示错误信息，该信息说明 `final` 只能为方法定义：\n\n```php\nclass\
  \ Computer {\nfinal $CPU = \"The CPU\";\n} \n```\n\n![\"属性的 \"final\"失败](img/img-f11.20.html)\n\
  \n**图 11.20** 属性的 \"final\"失败\n\n## \"readonly\"\n\n从 PHP 8.1 开始，有一个新的 `readonly`\
  \ 属性。这允许将属性为只读不可写：\n\n```php\nprivate readonly string $sek;  \n```\n\n在这种情况下，只有一种方法可以给属性赋值，即构造函数，因为如果没有值，该属性将毫无意义：\n\
  \n```php\nprivate readonly string $sek;  \n```\n\n\n\n\n`class()` 静态方法在 `start()`\
  \ 方法中被调用。通过 `__CLASS__` 可以返回当前上下文环境中的类名。该方法在 `Laptop` 类中也存在。然而，`self::` 直接访问调用发生时的类。顺便提一下，对上层类的调用可以通过\
  \ `parent` 实现。\n\n```php\n<?php\n  class Computer {\n    public static function\
  \ class() {\n      return ______;\n    }\n    public static function start() {\n\
  \      return self::class() .\" is started.\";\n    }\n  }\n  class Laptop extends\
  \ Computer {\n    public static function class() {\n      return __CLASS__;\n  \
  \  }\n  }\n  echo Laptop::start();\n?>  \n```\n\n**Listing 11.26** 使用 \"self\" 的静态继承\
  \ (\"self.php\")\n\n因此，这里的输出是：\n\n```\nComputer is started.  \n```\n\n后期静态定义了一个新关键字：`static`。现在，该关键字本身并不是新的；它在这里仅用于明确静态绑定。在继承场景中，它并不指代当前类，而是包含关于正在调用哪个类的运行时信息——在本例中，即\
  \ `Laptop` 类。运行时信息也是该过程被称为后期静态绑定的原因。\n\n考虑以下稍作修改的示例。\n\n```php\n<?php\n  class Computer\
  \ {\n    public static function class() {\n      return __CLASS__;\n    }\n    public\
  \ static function start() {\n      return static::class() .\" is started.\";\n \
  \   }\n  }\n  class Laptop extends Computer {\n    public static function class()\
  \ {\n      return __CLASS__;\n    }\n  }\n  echo Laptop::start();\n?>  \n```\n\n\
  **Listing 11.27** 使用 \"static\" 的静态继承 (\"staticbinding.php\")\n\n这里的输出是：\n\n```\n\
  Laptop is started.  \n```\n\n## \"static\" 作为返回值\n\n在 PHP 8 中，方法（或函数）也可以包含一个静态类作为返回值。这意味着\
  \ `static` 也是一种类型声明。\n\n它只需在方法中指定为类型声明即可：\n\n```php\npublic static function class()\
  \ : static {\n  return new static();\n}  \n```\n\n为了确保静态方法实际上返回的是一个静态类，这里使用了 `static()`\
  \ 函数。\n\n### 释\n\n`static` 也可以作为联合类型（参见第 6 章）与其他类型或 null 结合——例如，`?static` 或 `static|array`。\n\
  \n下面的列表显示了完整的脚本。\n\n```php\n<?php\n  class Computer {\n    public static function\
  \ class() : static {\n      return new static();\n    }\n    public static function\
  \ start() : string {\n      return get_class(static::class()) .\" is started.\"\
  ;\n    }\n  }\n  class Laptop extends Computer {\n    public static function class()\
  \ : static {\n      return new static();\n    }\n  }\n  echo Laptop::start();\n\
  ?>  \n```\n\n**Listing 11.28** 使用 \"static\" 的返回类型 (\"static_return.php\")\n\n输出返回了被调用类的名称以及附加的字符串：\n\
  \n```\nLaptop is started.  \n```\n\n## 11.3.7 抽象类\n\n抽象类和方法与接口非常相似。在这里，抽象方法没有在抽象类中实现，而只是被指定。抽象类本身不能被实例化。方法只在在使用抽象类的类中实现。\n\
  \n```php\n<?php\n  abstract class Computer {\n    abstract function start();\n \
  \ }\n  class Laptop extends Computer {\n    public function start() {\n       return\
  \ \"Laptop is started\";\n    }\n  }\n  $MyLaptop = new Laptop();\n  echo $MyLaptop->start();\n\
  ?>  \n```\n\n**Listing 11.29** 抽象类 (\"abstract.php\")\n\n因此，前面的脚本输出以下内容：\n\n```\n\
  Laptop is started  \n```\n\n然而，与接口不同，抽象类不能实现标记为 `abstract` 的方法，这些方法随后会被继承它的可实例化类所使用。\n\
  \n即使使用抽象类，抽象方法的参数也必须与实现方法的参数相同。\n\n```php\nabstract class Computer {\n  abstract\
  \ function start();\n}\nclass Laptop extends Computer {\n  public function start($sek)\
  \ {\n     return \"Laptop is started $sek\";\n  }\n}\n```\n\n**Listing 11.30** 带参数的抽象类\
  \ (\"abstract.php\")\n\n## 11.3.8 匿名类\n\n匿名类是 PHP 的一个新功能，用于你不需要类名的情景。匿名类直接通过 `new\
  \ class` 定义。下面的示例展示了带参数的匿名类的简单用法。\n\n它通过 `$class` 变量调用，该变量存储了匿名类的对象。\n\n```php\n\
  <?php\n  $class = new class {\n      public function shutdown($seconds) {\n    \
  \    echo \"Computer shut down in $seconds\";\n      }\n  };\n  $class->shutdown(10);\n\
  ?>  \n```\n\n**Listing 11.31** 简单匿名类\n\n匿名类可以做得更多。它可以通过构造函数接受参数，可以继承自其他类，可以实现接口。下面的示例展示了继承和参数。\n\
  \n```php\n<?php\n  class Computer {\n    protected $display;\n  }\n  $class = new\
  \ class('15 inch') extends Computer {\n    public function __construct($display)\
  \ {\n      $this->display = $display;\n    }\n    public function getDisplay() {\n\
  \      return 'The display has ' $this->display;\n    }\n  };\n  echo $class->getDisplay();\n\
  ?>  \n```\n\n**Listing 11.32** 带继承和参数的匿名类 (\"anonymous_inheritance.php\")\n\n##\
  \ 11.3.9 常量\n\n常量在第 4 章 中应该熟悉。在 PHP 中，类内部也有常量。你使用 `const` 关键字定义这些常量，并通过双冒号（`::`）访问它们。这在类内部外部都可以实现。\n\
  \n```php\n<?php\n  class Computer {\n  const sec = \"15 seconds\";\n    public function\
  \ start() {\n      return \"Computer starts in \" . Computer::sec;\n    }\n  }\n\
  \  $MyComputer = new Computer();\n  echo $MyComputer->start() .\"<br />\";\n  echo\
  \ \"And again in \" . Computer::sec;\n?>  \n```\n\n**Listing 11.33** 类中的常量 (\"constants.php\"\
  )\n\n\n\n\n# 图 11.24 类的内部与外部常量访问\n\n## 常量的可见性与类型\n\n常量也可以具有 public（公共）、private（私有）等可见性。从\
  \ PHP 8.3 开始，还可以使用数据类型对常量进行类型标注。\n\n在接下来的示例中，常量被定义为公共且类型为字符串。\n\n```php\n<?php\n\
  \  class Computer {\n  public const string sec = \"15 seconds\";\n    public function\
  \ start() {\n      return \"Computer starts in \" . Computer::sec;\n    }\n  }\n\
  \  $MyComputer = new Computer();\n  echo $MyComputer->start() .\"<br />\";\n  echo\
  \ \"And again in \" . Computer::sec;\n?>  \n```\n\n**列表 11.34 常量的可见性与类型 (\"constants\\\
  _typed.php\")**\n\n输出结果与上一节的内容对应。\n\n### 注意\n从 PHP 8.1 开始，还可以使用 `final` 来提供常量。\n\
  \n## 11.3.10 重载 (Overloaded)\n\n方法重载意味着该方法接收的参数比指定的要多，或者接收具有不同数据类型的参数。这意味着传递了方法无法预知的值。重载是一种极其实用的编程技术，因为一个方法可以处理多种通常需要多个方法才能处理的不同情况。\n\
  \n我们在这里简要总结一下重载的技术。这些是函数的已知选项：\n\n* 参数的默认值\n* 使用 `...` 运算符（参见图 11.25）\n\n```php\n\
  <?php\n      class Computer {\n        public function drives(...$drives) {\n  \
  \        echo \"Drives:<br />\";\n          foreach ($drives as $drive) {\n    \
  \        echo $drive .\"<br />\";\n          }\n        }\n      }\n      $MyComputer\
  \ = new Computer();\n      $MyComputer->drives(\"C\", \"D\");\n      $MyComputer->drives(\"\
  C\", \"D\", \"E\");\n?>  \n```\n**列表 11.35 使用运算符的重载 (\"overload\\_functions.php\"\
  )**\n\n* 使用函数读取运算符——这同样适用于方法。\n\n```php\n<?php\n  class Computer {\n        public\
  \ function drives() {\n          $drives = func_get_args();\n          echo \"Drives:<br\
  \ />\";\n          foreach ($drives as $drive) {\n            echo $drive .\"<br\
  \ />\";\n          }\n        }\n      }\n      $MyComputer = new Computer();\n\
  \      $MyComputer->drives(\"C\", \"D\");\n      $MyComputer->drives(\"C\", \"D\"\
  , \"E\");\n?>  \n```\n**列表 11.36 使用函数的重载 (\"overload\\_functions\\_func\\_get\\\
  _args.php\")**\n\n![函数对不同数量参数的响应](img/img-f11.25.html) \n\n**图 11.25 函数对不同数量参数的响应**\n\
  \n### 注意\nPHP 不支持使用同名的多个方法进行重载，而许多人知道在其他面向对象的语言中如何操作。以下脚本在 Java 或 C# 中可以（类似地）工作，但在\
  \ PHP 中它会返回错误，如图 11.26 所示：\n\n```php\nclass Computer {\n  public function drives($a,\
  \ $b) {\n    return \"The computer has the drives: $a and $b<br />\";\n  }\n  public\
  \ function drives($a, $b, $c) {\n    return \"The computer has the drives: $a, $b\
  \ and $c<br />\";\n  }\n} \n```\n\n![在 PHP 中不支持使用同名方法进行重载！](img/img-f11.26.html)\
  \ \n\n**图 11.26 在 PHP 中不支持使用同名方法进行重载！**\n\n除了这些选项外，PHP 中还有一些预定义方法可以简化重载。你可以在后续章节中阅读更多相关信息。\n\
  \n## __call()\n\n`__call(name, parameter)` 方法会拦截所有在类内部未定义的方法（参见图 11.27）。它接收两个参数：被调用方法的名称以及其以数组形式接收的参数。\n\
  \n```php\n<?php\n  class Computer {\n    public function __call($name, $parameter)\
  \ {\n      echo \"Drives:<br />\";\n      foreach ($parameter as $element) {\n \
  \       echo $element .\"<br />\";\n      }\n    }\n  }\n  $MyComputer = new Computer();\n\
  \  $MyComputer->drives(\"A\", \"B\");\n  $MyComputer->drives(\"C\", \"D\", \"E\"\
  );\n?>  \n```\n**列表 11.37 \"__call()\" (\"call.php\")**\n\n![使用 \"__call()\" 进行重载](img/img-f11.27.html)\
  \ \n\n**图 11.27 使用 \"__call()\" 进行重载**\n\n`__call()` 的一个缺点是它会拦截所有未的方法（参见图 11.28）。这里有一个示例：\n\
  \n```php\n<?php\n  class Computer {\n    public function __call($name, $parameter)\
  \ {\n      echo \"Drives:<br />\";\n      foreach ($parameter as $element) {\n \
  \       echo $element .\"<br />\";\n      }\n    }\n  }\n  $MyComputer = new Computer();\n\
  \  $MyComputer->drives(\"A\", \"B\");\n  $MyComputer->drives(\"C\", \"D\", \"E\"\
  );\n?>  \n```\n**列表 11.38 \"__call()\" 的未定义方法**\n\n![未定义的方法](img/img-f11.28.html)\
  \ \n\n**图 11.28 未定义的方法**\n\n这种方法是不实用的，如果你只想拦截一个方法。这种是一个示例所示：\n\n```php\n<?php\n\
  \  class Computer {\n    public function __call($name, $parameter) {\n      echo\
  \ \"Drives:<br />\";\n      foreach ($parameter as $element) {\n        echo $element\
  \ .\"<br />\";\n      }\n    }\n  }\n  $MyComputer = new Computer();\n  $MyComputer->drives(\"\
  A\", \"B\");\n      $MyComputer->drives(\"C\", \"D\", \"E\");\n?>  \n```\n**列表 11.38\
  \ \"__call()\" 的未定义方法**\n\n这种方法是不实用的，如果你只想拦截一个方法。这种是一个示例所示：你必须以某种优雅的方式检查方法名称，图 11.29\
  \ 显示了结果。\n\n```php\n<?php\n  class Computer {\n    public function __call($name,\
  \ $parameter) {\n      if ($name == \"drives\") {\n        echo \"Drives:<br />\"\
  ;\n        foreach ($parameter as $element) {\n          echo $element .\"<br />\"\
  ;\n        }\n      }\n    }\n  }\n  $MyComputer = new Computer();\n  $MyComputer->drives(\"\
  A\", \"B\");\n  $MyComputer->drives(\"C\", \"D\", \"E\");\n?>  \n```\n**列表 11.39\
  \ \"__call()\" 方法检查 (\"case.php\")**\n\n![检查方法名称](img/img-f11.29.html) \n\n**图 11.29\
  \ 方法检查名称**\n\n## __get()\n\n`__get(name)` 是 `__call()` 的对应方法，但针对属性。它接收所有读取但类中未提供或由于可见性问题无法访问的属性名称。\n\
  \n```php\n<?php\n  class Computer {\n    //$CPU = \"The CPU\";\n    public function\
  \ __get($property) {\n      echo(\"$property is not set\");\n    }\n  }\n  $MyComputer\
  \ = new Computer();\n  echo $MyComputer->CPU;\n?>  \n```\n**列表 11.40 \"__get()\"\
  \ (\"get.php\")**\n\n![\"CPU\"属性未设置](img/img-f11.30.html) \n\n**图 11.30 \"CPU\"\
  \ 属性未设置**\n\n### 提示\n在实践中，你主要需要此方法来拦截产生错误信息的属性调用。\n\n## __set()\n\n`__set(name,\
  \ value)` 接收未定义属性的名称和要设置属性的值作为参数。你当然可以因为属性未提供而指示值无法指定——但它也可以用于简单的设置属性并赋予其值。在这种情况下，类本身需要\
  \ `DynamicProperties` 特性。否则，动态创建属性将被废弃。这背后的原因是，如果没有良好的文档说明，动态创建属性会导致代码理解上的困难。\n\n\
  ```php\n<?php\n  #[\\DynamicProperties] class Computer {\n    public function __get($property)\
  \ {\n      echo(\"$property is not set\");\n    }\n    public function __set($property,\
  \ $value) { \n      $this->$property = $value; }\n  }\n  $MyComputer = new Computer();\n\
  \  $MyComputer->CPU = \"4 GHZ\";\n  echo $MyComputer->CPU;\n?>  \n```\n**列表 11.41\
  \ \"__set()\" (\"set.php\")**\n\n![动态设置属性](img/img-f11.31.html) \n\n**图 11.31 动态设置属性**\n\
  \n\n\n\n\nTrait（特性）的目的是提供一种可以在不直接定义自己的类或类层次结构的情况下进行重用的方法。Trait 的定义方式与类相似，使用 `trait`\
  \ 关键字。在其中定义了函数和（在实践中较少见的）属性：\n\n```php\ntrait Converter {\n  private function mb2gb($mb)\
  \ {\n    $gb = $mb / 1024;\n   return $gb;\n  }\n }  \n```\n\n然后，可以使用 `use` 关键字在类中使用该\
  \ trait：\n\n```php\nclass Computer {\n  use Converter;\n}  \n```\n\n##### Note\n\
  \n你也可以在类中使用多个 trait。要做到这一点，只需在在 `use` 关键字后面写以逗号分隔的列表列出它们即可。\n\n根据方法的可见性，该方法可以在类内部或外部被访问。以下列表包含了完整的代码，图\
  \ 11.32 显示了输出结果。\n\n```php\n<?php\ntrait Converter {\n  private function mb2gb($mb)\
  \ {\n    $gb = $mb / 1024;\n   return $gb;\n  }\n}\nclass Computer {\n  use Converter;\n\
  \  public $RAM = \"1024\";\n  public function ramcheck() {\n    $gb = $this->mb2gb($this->RAM);\n\
  \    return \"Computer has \" . $gb .' GB RAM';\n  }\n}\nclass Laptop extends Computer\
  \ {\n  public $RAM = \"4096\";\n}\n$MyLaptop = new Laptop();\necho $MyLaptop->ramcheck();\n\
  ?>  \n```\n\n**列表 11.42** Trait 的使用 (\"traits.php\")\n\n![Trait 的方法提供了适当的转换](img/img-f11.32.html)\n\
  \n**图 11.32** Trait 的方法提供了适当的转换\n\n##### Note\n\n如果你在类结构中定义了多个同名方法，覆盖顺序如下：优先级始终赋予给直接在相应类中定义的方法。其次是类中使用的\
  \ trait。在这一排名的最后是来自自类类的方法。\n\nTrait 中的方法可以使用得非常灵活，其名称和可见性都可以更改。如果类中的多个 trait 或方法之间可能发生名称冲突，则这一点尤为必要。\n\
  \n要更改名称和可见性，在 `use` 语句后的大括号中放置两个关键字；如果两个 trait 有相同的方法，则由 `insteadof` 决定使用哪个 trait。`as`\
  \ 允许你为方法指定别名（一个不同的名称）并更改可见性——或仅执行其中一种操作。\n\n以下示例展示了两个具有相同 `mb2gb()` 方法 trait。在 `Computer`\
  \ 类中，随后指定使用 `converter` trait 中的方法来处理相同的方法。此外，将可见性提高到 `protected`，以便在继承类 `Laptop`\
  \ 中使用该方法。我们将 `Helpers` trait 中的同名方法设置为公开访问，并分配了 `convertRam()` 别名。图 11.32 显示了输出结果。\n\
  \n```php\n<?php\n  trait Converter {\n    private function mb2gb($mb) {\n      $gb\
  \ = $mb / 1024;\n      return $gb;\n    }\n  }\n  trait Helpers {\n    private function\
  \ mb2gb($mb) {\n      $gb = $mb / 1024;\n      return $gb;\n    }\n  }\n  class\
  \ Computer {\n    use Converter, Helpers {\n      Converter::mb2gb insteadof Helpers;\n\
  \      Converter::mb2gb as protected;\n      Helpers::mb2gb as convertRam;\n   \
  \ }\n    public $RAM = \"1024\";\n  }\n  class Laptop extends Computer {\n    public\
  \ $RAM = \"4096\";\n    public function ramcheck() {\n      $gb = $this->mb2gb($this->RAM);\n\
  \      return \"Computer has \" . $gb .' RAM';\n    }\n  }\n  $MyLaptop = new Laptop();\n\
  \  echo $MyLaptop->ramcheck() . '<br />';\n  echo $MyLaptop->convertRam('2048');\n\
  ?>  \n```\n\n**列表 11.43** 具有相同方法的 trait (\"traits_methods.php\")\n\n![由两个 trait\
  \ 方法控制输出](img/img-f11.33.html)\n\n**图 11.33** 由两个 trait 方法控制输出\n\n## 有帮助且有用的信息\n\
  \n本节包含了一些可以处理复杂需求的小巧有用工具。你还会发现扩展、迭代器和 PHP 标准库 (SPL)。\n\n### 11.4.1 错误级别\n\nPHP 的一个有用选项是设置错误拦截。然而，重要的是错误级别（基本错误类型）在\
  \ PHP 中发生了变化。\n\n在 PHP 5.0 中，有一个新的错误级别 `E_STRICT`。但它最初并没有包含在 `E_ALL` 中。在 PHP 5.4\
  \ 中它被“集成”到 `E_ALL` 中，因此也会抛出该级别的错误。在 PHP 7 中，`E_STRICT` 被完全移除，相应的错误被分到了其他错误级别。`E_ALL`\
  \ 已经一直是标准。\n\n以下示例也显示了随时间的变化。在 PHP 5.3 中，添加了一个错误级别：`E_DEPRECATED`。它主要用于支持现代化。OOP\
  \ 中不再正式建议输出的方法是 `call_user_method()`。像所有错误级别一样，`E_DEPRECATED` 可以在 `php.ini` 级别或脚本级别创建。以下示例使用\
  \ PHP 5.3 的 `error_reporting()` 函数将错误级别设置为最大。\n\n```php\n<?php\n    error_reporting(E_ALL\
  \ | E_STRICT);\n  class Computer {\n    public function shutdown($seconds) {\n \
  \     echo \"Computer will shut down in $seconds seconds\";\n    }\n  }\n\n  $duration\
  \ = 12;\n  $MyComputer = new Computer();\n\n  call_user_method(\"shutdown\", $MyComputer,\
  \ $duration);\n?>  \n```\n\n**列表 11.44** PHP 5.3 的错误级别 (\"php53_error_level.php\"\
  )\n\n在 PHP 5.3 中，`call_user_method()` 调用被称为 `E_DEPRECATED` 并作为相应的错误输出（参见图 11.34）。由于\
  \ PHP 7，这种赋值不再存在。因此在这里发生了“正常”错误——致命错误——因为相应的过时方法已不再可用。\n\n![PHP 5.3（顶部）和 PHP 7（底部）的“call_user_method()`\
  \ 方法](img/img-f11.34.html)\n\n**图 11.34** PHP 5.3（顶部）和 PHP 7（底部）的“call_user_method()`\
  \ 方法\n\n##### Tip\n\n要不分版本获取最高错误级别，可以使用 `error_reporting(-1)`。-1 参数接收所有错误级别。从 PHP\
  \ 5.4 开始，`E_ALL` 的行为相同；即未来的错误级别也会自动考虑在内。\n\n任何发生的错误都可以通过 `set_error_handler(function\
  \ name, error)` 轻松拦截。该函数的第一个参数指定处理器的函数名。处理器随后接收数字形式错误类型、错误字符串、错误文件以及发生错误的行。第二个参数是可选的，允许你指定要拦截的错误级别——例如\
  \ `E_WARNING`。在以下列表中，你捕获了所有的 `E_WARNING` 错误并让其他错误通过。图 11.35 显示了一个结果。\n\n```php\n\
  <?php\n  function error_handler($errno, $errstr, $errfile, $errline) {\n    switch\
  \ ($errno) {\n      case E_WARNING:\n        echo \"WARNING: [$errno] $errstr<br\
  \ />\";\n        break;\n      default:\n        echo \"No E_WARNING error\";\n\
  \        break;\n    }\n    return true;\n  }\nset_error_handler(\"error_handler\"\
  , E_WARNING);\n\n  class Computer {\n\n  }\n  $MyComputer = new Computer();\n  $MyComputer->display;\n\
  ?>  \n```\n\n**列表 11.45** 捕获错误 (\"error_level_catch.php\")\n\n![捕获错误](img/img-f11.35.html)\n\
  \n**图 11.35** 捕获错误\n\n##### Note\n\n使用 `set_error_handler()` 无法捕捉致命错误、核心错误和解析错误。\n\
  \n### 11.4.2 \"spl_autoload_register()\"\n\n`spl_autoload_register(function)` 注册一个函数，该函数对所有无法直接使用的类的调用做出响应。你可以据此做出反应。\n\
  \n\n\n\n\n```php\n<?php\n  function autoloader($class)  {\n    echo \"The class\
  \ $class does not exist!\";\n  }\n  spl_autoload_register('autoloader');\n  $MyComputer\
  \ = new Computer();\n?>  \n```\n\n**列表 11.46** `spl_autoload_register()` (`spl_autoload_register.php`)\n\
  \n注意：PHP 解释器也会抛出一个错误，你只能通过非常严格（通常是过于严格的）的错误管理来抑制该错误。然而，在 `spl_autoload_register()`\
