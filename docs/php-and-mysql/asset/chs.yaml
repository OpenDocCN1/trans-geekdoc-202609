  \ 7.11** 悲伤的残留：'The' 消失了\n\n### 注意\n`strchr(String, search string)` 是 `strstr()`\
  \ 的别名。`strrchr(String, search string)` 的工作方式与这两个相同，但搜索从字符串的末尾开始。你可能怀疑，但 `strrstr()`\
  \ 并不存在。\n\n### 注意\n名称中的 `i` 再次表示可以识别 `stristr(String, search string)` 不区分大小写的变体。与其他某些\
  \ `i` 函数不同，它已经存在于 PHP 4（甚至 PHP 3）中。\n\n### 出现频率\n`substr_count(string, search string,\
  \ position, length)` 函数统计搜索字符串在字符串中出现的次数。`position` 参数指定搜索开始的位置，`length` 决定了执行搜索的字符长度。\n\
  \n```php\n<?php \n  $a = \"Jippieeehjey\"; \n  echo substr_count($a, \"e\"); \n\
  ?>  \n```\n\n**列表 7.19** \"substr_count()\" (\"substr_count.php\")\n\n前面的脚本报告了 `e`\
  \ 在较长字符串出现了四次。\n\n### 查找所有位置\nPHP 的内置函数通常很有帮助，但并非总是如此。例如，如果你想保存数组中某个搜索字符串出现的所有位置，你必须手动操作。以下脚本实现了这一点。\n\
  \n```php\n<?php \n  $a = \"Jippieeehjey\"; \n  $positions = array(); \n  $i = 0;\n\
  \  $position = strpos($a, \"e\"); \n  while ($position != false) { \n    $positions[$i]\
  \ = $position;\n    $position = strpos($a, \"e\", $position + 1); \n    $i++; \n\
  \  } \n  print_r($positions); \n?>  \n```\n\n**列表 7.20** 在数组中保存所有位置 (\"search_all.php\"\
  )\n\n### 提示\n如果你经常需要此功能，只需编写你自己的函数并创建一个包含该函数的 PHP 文件。然后你就可以将其集成到新文件中。图 7.12 显示了结果。\n\
  \n![包含所有位置的数组](img/img-f7.12.html) \n\n**图 7.12** 包含所有位置的数组\n\n### 搜索多个字符\n`strpk(String,\
  \ characters)` 允许你搜索多个字符。这些字符以字符串的形式一个接一个地指定。一旦找到其中一个字符，就会返回直到结尾的整个字符串（参见图 7.13）。以下脚本搜索\
  \ `x`、`b` 和句号。\n\n```php\n<?php \n  $a = \"The blue riders.\"; \n  echo strpk($a,\
  \ \"xb.\"); \n?>  \n```\n\n**列表 7.21** \"strpk()\" (\"strpk.php\")\n\n![首先找到 \"\
  b\"，然后显示它](img/img-f7.13.html) \n\n**图 7.13** 首先找到 \"b\"，然后显示它\n\n### 字符串中的字符串字符串：最快解决方案\n\
  在处理字符串时，最常见的情况之一就是你只是想确定某个字符字符串是否包含在另一个字符串中。为了这个目的，PHP 8 提供了三个新函数。当然，这个目标也可以通过 `strpos()`、`strstr()`\
  \ 和 `substr()` 实现——而且在旧版本的 PHP 中必须这样做。但最快的方法是使用 `str_contains()`、`str_starts_with()`\
  \ 和 `str_ends_with()`。`str_contains(String, search string)` 返回搜索字符串是否在字符串中。以下是其简单示例。\n\
  \n```php\n$a = \"The blue riders.\";\nstr_contains($a, \"blue\");\n```\n\n**列表 7.22**\
  \ \"str_contains()\" (\"str_contains.php\")\n\n`str_starts_with(String, search string)`\
  \ 返回字符串是否以搜索字符串开头。\n\n```php\n$a = \"The blue riders.\";\nstr_starts_with($a, \"\
  The\");\n```\n\n`str_ends_with(String, search string)` 同样工作，返回字符串是否以搜索字符串结尾。\n\n\
  ```php\n$a = \"The blue riders.\";\nstr_ends_with($a, \".\");\n```\n\n**列表 7.23**\
  \ \"str_starts_with()\" 和 \"str_ends_with()\" (\"str_starts_with.php\")\n\n### 注意\n\
  如果搜索字符串比字符串长，它将始终返回 `false`。这同样适用于字符串替换。\n\n### 7.5 替换\n`str_replace(search string,\
  \ replacement, string)` 函数是使用正则表达式进行替换的替代方案。它有许多优势：它是基于比较的，且易于记住。\n\n### 替换位置\n\
  `substr_replace(String, replacement, start position, length)` 函数的工作方式等同于上述两个函数，只是它替换的是指定的范围而不是切割。`length`\
  \ 是可选的，且可以使用负值。以下脚本将红色替换为蓝色。\n\n```php\n<?php \n  $a = \"The red riders.\"; \n \
  \ echo substr_replace($a, \"blue\", 4, 3); \n?>  \n```\n\n**列表 7.24** \"substr_replace()\"\
  \ (\"substr_replace.php\")\n\n### 搜索与替换\n`str_replace(search string, replacement,\
  \ string)` 函数是搜索和替换的“轻量级”方案。由于基于二进制比较，性能很好。第一个参数包含搜索字符串，第二个包含替换内容，第三个是执行替换的字符串。\n\
  \n```php\n<?php \n  $a = \"Jippieeehjey\"; \n  echo str_replace(\"e\", \"i\", $a);\
  \ \n?>  \n```\n\n**列表 7.25** \"str_replace()\" (\"str_replace.php\")\n\n### 注意\n\
  注意 PHP 中字符串函数的参数顺序并不统一。在这里，例如，关注的字符串在末尾。在上面的代码中，所有的 e 都被替换成了 i。\n\n### 提示\n快速搜索和替换非常适用于代码中的占位符，例如。除了简单的字符串，`str_replace()`\
  \ 的三个参数都支持数组。在列表 7.26 和图 7.14 中，你可以看到一个示例。\n\n```php\n<?php \n  $a = \"Jippieeehjey\"\
  ; \n  $b = \"Holadrioe\"; \n  $result = str_replace(array(\"e\", \"o\"), array(\"\
  i\", \"ö\"), array($a, $b)); \n  print_r($result); \n?>  \n```\n\n**列表 7.26** 使用数组的\
  \ \"str_replace()\" (\"str_replace_array.php\")\n\n![通配符替换](img/img-f7.14.html)\
  \ \n\n**图 7.14** 通配符替换\n\n### 注意\n`str_ireplace(search string, replacement, string)`\
  \ 是 `str_replace()` 不区分大小写的变体，构造上完全相同。\n\n#### 替换多个字符\n\n\n\n\n\n`strtr(String,\
  \ From, In)` 函数的工作原理类似于 `strpbrk()`。它会在字符串（`From`）中搜索指定的字符，并将它们替换为第二个字符串（`In`）中的字符。请考虑下面的简单的示例。\n\
  \n```php\n<?php \n  $a = \"Jippieeejey\"; \n  echo strtr($a, \"ei\", \"ie\"); \n\
  ?>  \n```\n\n**列表 7.27** 使用中的 \"strtr()\" (\"strtr.php\")\n\n在这里，Jippieeejey 变成了\
  \ Jeppeiiijiy。\n\n##### Note\n\n如果 `From` 字符串和 `In` 字符串中的字符数量不一致，则一侧多出的字符会被忽略。\n\
  \n`strtr(String, Array)` 有另一种语法形式，可以使用关联数组。在这种情况下，相应数组元素的索引是 `From`，而值是 `In`。因此，以下脚本的效果与\
  \ 列表 7.27 相同，但使用的是关联数组。\n\n```php\n<?php \n  $a = \"Jippieeejey\"; \n  echo strtr($a,\
  \ array(\"e\"=>\"i\", \"i\"=>\"e\")); \n?>  \n```\n\n**列表 7.28** 使用关联数组的 \"strtr()\"\
  \ (\"strtr_asso.php\")\n\n## 7.6 特殊字符、HTML 以及类似项\n\n无论你是在处理 HTML、数据库查询还是文件，你总是会遇到特殊字符。PHP\
  \ 已经为最重要的应用领域提供了现成的函数。\n\n### 7.6.1 数据库的转义\n\n对于数据库查询，你必须对某些字符进行转义。这是通过反斜杠（`\\\\\
  `）实现的。`addslashes(String)` 函数在单引号、双引号、反斜杠和空值之前插入反斜杠。当你将字符串作为值写入数据库时，通常会使用此函数，以确保上述的字符不会被\
  \ SQL 解释为语法的一部分。然而，PHP 中的大多数数据库接口都有它们自己的转义函数。这些函数通常比 `addslashes()` 更好。\n\n要撤销 `addslashes(String)`，请使用\
  \ `stripslashes(String)`。下面的简单示例同时使用了两者。\n\n```php\n<?php \n  $a = 'Caesar said:\
  \ \"I came, I saw, I conquered!\"'; \n  $a = addslashes($a); \n  echo \"With backslash:\
  \ \" . $a; \n  $a = stripslashes($a); \n  echo \"<br />Without: \" . $a; \n?>  \n\
  ```\n\n**列表 7.29** 使用反斜杠转义 (\"addslashes.php\")\n\n比 `addslashes()` 稍微灵活一点的是 `addcslashes(string,\
  \ character)` 函数。它会在字符串 `character` 参数中指定的所有字符前添加反斜杠。\n\n```\naddcslashes($a, '\"\
  n')\n```\n\n因此在双引号和 `n` 之前放置了反斜杠（参见 图 7.15）。\n\n**图 7.15** 上方反斜杠，下方没有\n\n##### Note\n\
  \n反向转换通过 `stripcslashes(String)` 完成。然而，像 `\\n` 这样的特殊字符会被忽略。这意味着如果你使用 `addcslashes($a,\
  \ 'n')`，在反向转换后，源代码中仍然会有换行符而不是所有的 `n`。如果你想避免这种效果，请使用 `stripslashes()`。它会移除所有的反斜杠。\n\
  \n### 7.6.2 正则表达式的转义\n\n与 SQL 类似，正则表达式使用它们自己的特殊字符，因此在字符串中应对它们进行转义。`quotemeta(String)`\
  \ 函数负责此工作。`quotemeta()` 会对以下字符进行转义：\n\n```\n. + ? ^ $ [ ] ( )\n```\n\n考虑以下示例。\n\n\
  ```php\n<?php \n  $a = \"test $ characters\"; \n  echo quotemeta($a); \n?>  \n```\n\
  \n**列表 7.30** \"quotemeta()\" (\"quotemeta.php\")\n\n**图 7.16** 已转义字符\n\n##### Tip\n\
  \n要反向转换，只需使用 `stripslashes()`。\n\n### 7.6.3 HTML\n\nHTML 是一种特殊的语言。根据定义，HTML 不识别任何字符。特殊字符可以使用\
  \ `htmlentities()` 进行转换。\n\n#### 特殊字符\n\n所有特殊字符都可以通过 `htmlentities()` 进行转换。在下面的列表中，我们对比了转换前后的结果。\n\
  \n```php\n<?php \n  $a = 'Ä, ö, ü'; \n  echo \"Without conversion: \" . $a . \"\
  <br />\";\n  echo \"With conversion: \" . htmlentities($a); \n?>  \n```\n\n**列表\
  \ 7.31** 转换后的 HTML (\"html.php\")\n\n如果你正在开发表单，你应该始终过滤输入。`htmlentities(string, quotation\
  \ marks, character set)` 提供两个可选参数。对于引号，你可以设置它们的处理方式：\n\n*   `ENT_QUOTES`：转换所有引号。\n\
  *   `ENT_NOQUOTES`：保留所有引号。\n*   `ENT_COMPAT`：仅转换双引号。这是默认值。\n\n第三个参数允许使用指定的字符集进行转换。其他值可以在表\
  \ 7.1 中找到。\n\n| 字符集 | 别名 | 描述 |\n| --- | --- | --- |\n| ISO-8859-1 | ISO8859-1 |\
  \ 西欧语言，Latin-1 |\n| ISO-8859-15 | ISO8859-9 | 西欧语言，Latin-9；欧元符号、法语变音、斯堪的纳维亚字母 |\n\
  | UTF-8 | | 八字节 Unicode |\n| cp866 | ibm866, 866 | 西里语字符集 |\n| cp1251 | Windows-1251,\
  \ win-1251, 1251 | Windows 西里语字符集 |\n| cp1252 | Windows-1252, 1252 | Windows 西欧字符集\
  \ |\n| KOI8-R | koi8-ru, koi8r | 俄罗斯 |\n| BIG5 | 950 | 繁体中文（台湾） |\n| BIG5-HKSCS\
  \ | | 带有香港扩展的繁体中文 |\n| GB2312 | 936 | 简体中文 |\n| Shift_JIS | SJIS, 932 | 日语 |\n|\
  \ EUC-JP | EUCJP | 日语 |\n\n**表 7.1** 字符集\n\n`htmlspecialchars()` 的工作原理与 `htmlentities()`\
  \ 完全相同，但它不会转换所有的 HTML 特殊字符。以下字符会被转换：\n\n```\n< > ' \" &\n```\n\n为什么要使用这个？\n\n####\
  \ 将特殊字符转换回 HTML\n\n现在是反过来的操作：将 HTML 特殊字符转换回普通字符串。对于此，PHP 提供了 `html_entity_decode(String,\
  \ quotation marks, character set)` 函数。它使用的参数与 `htmlentities()` 相同。\n\n\n\n\n\n```php\n\
  <?php \n  $a = \"&lt;p&gt;Text in paragraph with&lt;br /&gt; line break&lt;/p&gt;\"\
  ; \n  echo html_entity_decode($a); \n?>  \n```\n\n**列表 7.32** \"`html_entity_decode()`\"\
  \ (`html_entity_decode.php`)\n\n### 转换表\n\n使用 `htmlentities()` 或 `htmlspecialchars()`\
  \ 进行的转换基于 PHP 存储的一张表。你可以通过 `get_html_translation_table(version, quotes)` 函数来读取此表以查看发生了什么。\n\
  \n这两个参数是可选的。如果你省略 `version`，则会返回 `htmlspecialchars()` 的条目（这将对应值 `0`）；如果你输入 `1`，则会返回（长得多的）`htmlentities()`\
  \ 列表（参见图 7.18）。\n\n![\"htmlentities()\" 的列表（左）和 \"htmlspecialchars()\" 的列表（右）](img/img-f7.18.html)\n\
  \n**图 7.18** \"htmlentities()\" 的列表（左）和 \"htmlspecialchars()\" 的列表（右）\n\n### 注意\n\
  \n我们在这里使用 `htmlentities()` 对返回的键和值进行了转义，以便它们在浏览器中原样显示。\n\n返回格式是一个关联数组。键是原始值；值是转换的目标。对于第三参数\
  \ `quotation_marks`，请从三个已知的选项中选择（参见上文关于转换特殊字符的章节）。\n\n```php\n<?php \n  $table =\
  \ get_html_translation_table(); \n  foreach ($table as $key => $value) { \n    echo\
  \ htmlentities($key) . \" becomes \" . htmlentities($value) .  \n\"<br />\"; \n\
  \  } \n?>  \n```\n\n**列表 7.33** \"`get_html_translation_table()`\" (`html_table.php`)\n\
  \n### 移除标签\n\n`strip_tags(String, Protected)` 函数可以从字符串中剥离 PHP 和 HTML 标签，而不进行替换。在\
  \ `Protected` 字符串中，依次输入你想在替换前保留的标签。注意：标签不能是 XHTML 标记，且只可能是起始标签！相反，字母的大小写没有区别。\n\n\
  在接下来的示例中，段落（`<p>` 和 `</p>`）被删除了，但换行符（`<br />`）被保留了：\n\n```php\n$a = \"<p>Text in\
  \ paragraph with<br /> line break</p>\"; \necho strip_tags($a, \"<BR>\");  \n```\n\
  \n### 7.6.4 URLs\n\nURL——即网络地址允许附加信息。这些信息位于文件名和问号之后。然而，这种信息有特定的格式.[ 63]。要创建这种格式，请使用\
  \ `urlencode(String)`。要将 URL 转换回原始格式，请使用 `urldecode(URL)`。图 7.19 显示了一个示例。\n\n```php\n\
  <?php \n  $rheinwerk = \"http://www.rheinwerk-verlag.de/index.php?\"; \n  $anhang\
  \ = \"Index 1=Value 1&Index 2=Value 2\"; \n  echo $rheinwerk . urlencode($anhang);\
  \ \n?>  \n```\n\n**列表 7.34** \"`urlencode()`\" (`urls.php`)\n\n![附件具有兼容 URL 的格式](img/img-f7.19.html)\n\
  \n**图 7.19** 附件具有兼容 URL 的格式\n\n### 提示\n\n在实践中，如果你想将较长的字符串（如用户输入）附加 URL，就需要此功能。\n\
  \n### 拆解 URL\n\n如果你需要 URL 的各个部分——域名、主机名等——可以使用 `parse_url(URL)`。你只需将 `URL` 作为字符串传递，即可接收到一个包含其包含的所有组件的关联数组。\n\
  \n```php\n<?php \n  $url = \"http://www.rheinwerk-verlag.de/index.php?Index+1%3DValue+1%26Index+2%3DValue+2\"\
  ; \n  $items = parse_url($url); \n  print_r($items); \n?>  \n```\n\n**列表 7.35**\
  \ \"`parse_url()`\" (`parse_url.php`)\n\n![包含各个部分的 URL 数组](img/img-f7.20.html)\n\
  \n**图 7.20** 包含各个部分的 URL 数组\n\n## 7.7 比较\n\n你已经了解了第 5 章 中的简单字符串比较。通过精确相等和精确不相等，你甚至可以检查数据类型。\n\
  \n```\n4 === \"4\"\n```\n\n因此结果为 `false`。\n\nPHP 的字符串函数现在提供了几个超出这种基础检查的比较。\n\n###\
  \ 7.7.1 比较函数\n\n`strcmp(String1, String2)` 和 `strcasecmp(String1, String2)` 函数用于对两个字符串进行比较。唯一的区别是\
  \ `strcasecmp()` 不区分大小写。与比较运算符不同，这些函数返回哪个字符串较大的结果。如果 `String1` 较小，则返回小于 `0`；如果两个字符串相同，结果为\
  \ `0`；如果 `String1` 较大，则结果大于 `0`。\n\n还有一个比较函数：`substr_compare(String1, String2, Start,\
  \ Length, Case-sensitive)`。强制参数是两个字符串和起始位置。布尔参数也是可选的（默认为 `true`）。\n\n### 7.7.2 相似性与差异\n\
  \n量化相似性或差异在你想判断作者是否抄袭时非常有用。\n\n#### 相似性\n\n`similar_text(String1, String2)` 函数计算两个字符串之间的相似性。可选指定一个变量（作为引用）作为第三参数。该函数会将比较结果写入该变量。它指示了有多少字母被识别为相同。\n\
  \n```php\n<?php \n  $a = \"PHP is powerful\"; \n  $b = \"All power to!\"; \n  $e;\
  \ \n  echo \"Value: \" . similar_text($a, $b) . \"<br />\"; \n  echo \"Percent:\
  \ \" . $e; \n?>  \n```\n\n**列表 7.36** \"`similar_text()`\" (php)\n\n示例中的两个字符串相似性为\
  \ 37.5%。\n\n#### 差异\n\n`levenshtein(String1, String2)` 的工作方式与 `similar_text()` 类似。在这里同样是比较两个字符串——这次根据\
  \ Levenshtein 算法——并返回距离（即字符串之间的差异）。然而，字符串最多只能 255 个字符。\n\n### 7.7.3 发音\n\n如果人在文本字段中写一个值，拼写可能是错误的。这对程序员来说很糟糕，因为他必须考虑许多拼写错误。然而，拼写错误是因为人们按照说话的方式写作。这里\
  \ PHP 通过 `soundex(String)` 函数提供了一个很好的解决方案，它比较两个字符串以查看它们听起来是否相似或相同.[ 64]。\n\n如果需要输入\
  \ Good morning，普通的字符串比较会返回 Got morning 不相同。相反，`soundex()` 为两者返回相同的键。\n\n```php\n\
  <?php \n  $a = \"Good morning\"; \n  $b = \"Got morning\"; \n  echo $a . \": \"\
  \ . soundex($a) . \"<br />\"; \n  echo $b . \": \" . soundex($b); \n?>  \n```\n\n\
  **列表 7.37** \"`soundex()`\" (`soundex.php`)\n\n\n\n\n计算机以字节（bytes）存储数据。一个字节的数值在\
  \ 0 到 255 之间。ASCII 字符编码表示该值范围内的字母和字符。这意味着如果一个字节有一个数值，就可以使用数值代码来确定哪个字符与之匹配。虽然 ASCII\
  \ 是一个旧的字符集，而 UTF-8 字符集现在越来越多地用于浏览器和 HTML 文档，但你仍然仍然需要字符或字母的 ASCII 编码。PHP 提供了两个函数来实现此功能：\n\
  \n* `chr(ASCII)` 将 ASCII 编码转换为相应的字符。\n* `ord(character)` 返回对应字符的 ASCII 编码。\n\n```\n\
  <?php \n  echo \"Character: \" . chr(65) . \"<br />\"; \n  echo \"ASCII: \" . ord(\"\
  A\"); \n?>  \n```\n\n**列表 7.38**           \"chr()\" 和 \"ord()\" (\"chr_ord.php\"\
  )\n\n### 7.8.2 Unicode 代码点\n\n代码点（codepoint）是字符集中的一个值。因此，Unicode 代码点是 Unicode 字符集中的一个值。这些值通常以十六进制形式表示，从\
  \ 0 到 10FFFF（见图 7.22）。通过 `\\u`，PHP 现在提供了一种此类值转换为相应的 UTF-8 字符并输出的方法。\n\n![Windows\
  \ 字符表也显示十六进制代码](img/img-f7.22.html) \n\n**图 7.22**         The Windows 字符表也显示十六进制代码\n\
  \n```\n$result = \"\\u{00ae}\"; \necho $result;  \n```\n\n**列表 7.39**     使用 \"\\\
  u\" 进行 Unicode 转换 (\"unicode_codepoint.php\")\n\n### 7.8.3 加密\n\n对于加密或哈希（hashing），PHP\
  \ 提供了适用于不同加密技术的函数：\n\n* `md5(String)` 为字符串计算 MD5 哈希值，这是一个长度为 32 位的十六进制数字。\n* `md5_file(filename)`\
  \ 根据文件名计算 MD5 哈希值。\n\n### 注意\n\n这两个函数的第二个参数都是布尔值，决定返回的是数字（false，默认值）还是长度为 16 字符的二进制数据（true）。\n\
  \n* `sha1(String)` 和 `sha1_file(filename)` 的工作原理类似于 `md5()` 和 `md5_file()`，只是它们使用的是美国安全哈希算法\
  \ 1 进行加密。\n* `crypt(String, Salt)` 生成字符串的 DES 加密。根据系统的不同使用不同的算法。然而，这始终是单向加密；无法解密。你可以指定一个盐（salt）作为可选参数。\n\
  * 与 `crypt()` 哈希值类似且与之兼容的是 `password_hash(password, algorithm, options)`。它可以用于实现密码哈希。默认情况下使用\
  \ `bcrypt`；自 PHP 7.2 起，`Argon2` 也是一个选项，自 PHP 7.3 起有了 `Argonid`。在关联数组的选项中，可以指定你自己的盐，但取决于加密方法，建议使用函数本身生成的随机值。\n\
  \n* `hash(Algorithm, String)` 允许使用定义的算法计算哈希值。例如，可以用它计算 `sha256`。只需将算法作为字符串输入。顺便提到，这里也可以\
  \ `md5`。\n\n### 提示\n\n你可以通过 `mcrypt` 库 (http://s-prs.co/v60228) 获取更多更安全且可自定义的加密。\n\
  \n#### 应用：唯一 ID\n\n你需要一个唯一的 ID，例如如果你想创建自己的会话管理来识别你的用户，或者唯一标识任何其他元素。一个最好且最短的建议来自一位前开发者：\n\
  \n```\n$uid = md5(uniqid(microtime(), 1));\n```\n\n`uniqid()` 函数使用当前日期计算 ID。然后从此创建\
  \ MD5 哈希。如果你还想排除另一个服务器产生相同 ID 的可能性，可以将当前进程的唯一 ID 包含在字符串中：\n\n```\n$uid = substr($uid,\
  \ 0, 16) . getmypid() . substr($uid, 16);\n```\n\n以下列表显示了完整的脚本（另见图 7.23](#07_008.html#f7.23)）：\n\
  \n```\n<?php \n  $uid = md5(uniqid(microtime(), 1));\n  $uid = substr($uid, 0, 16)\
  \ . getmypid() . substr($uid, 16); \n  echo $uid; \n?>\n```\n\n**列表 7.40**         \
  \ A 唯一 ID (\"uniqueid.php\")\n\n![唯一 ID](img/img-f7.23.html) \n\n**图 7.23**         \
  \ The 唯一 ID\n\n### 7.8.4 反转\n\n`strrev(String)` 反转字符串（见图 7.24](#07_008.html#f7.24)）。该函数很少被使用，但有时很有实用价值。\n\
  \n```php\n<?php \n  $a = \"PHP is great\"; \n  echo strrev($a) \n?>\n```\n\n**列表\
  \ 7.41**          \"strrev()\" (\"strrev.php\")\n\n![反转的字符串](img/img-f7.24.html)\
  \ \n\n**图 7.24**        An 反转的字符串\n\n### 7.8.5 多字节字符串函数\n\n如果你正在开发一个多语言应用程序，你可能需要多字节字符串函数。这些函数在功能和内容上与标准字符串函数基本相同。因此，你不会在这里找到任何单独的解释。然而，它们的特殊之处在于，它们可以处理无法完全存储在\
  \ 8 位字节中的字符——即超出 UTF-8 标准的字符。\n\n### 提示\n\n关于可能的编码的概述可以在 http://s-prs.co/v60228\
  \ 找到。对于 `mbstring`，这些函数在一个名为 `mbstring` 的扩展中。在 Linux 下使用以下开关编译 PHP 以启用它们：\n\n```\n\
  --enable-mbstring\n```\n\n在 Windows 下，在 `php.ini` 中启用扩展：\n\n```\nextension=mbstring\n\
  ```\n\n在旧版本的 PHP 中，你可以使用 `phpinfo()` 检查设置是否成功（见图 7.25](#07_008.html#f7.25)）。大多数安装包也包含了\
  \ `mbstring`。\n\n![mbstring 已安装](img/img-f7.25.html) \n\n**图 7.25**          mbstring\
  \ 已安装\n\n在最新的 PHP 版本中，`mbstring` 一直持续开发。特别是 PHP 7.3 在性能改进方面取得了重要进展。在许多 PHP 扩展中，现在抛出的致命错误减少了，但可捕获的错误增加了。\n\
  \n# 8 数组\n\n数组是任何编程语言中一种非常重要的数据类型。数组存储多个数据值，然后你可以再次访问它们。\n\n在 PHP 中，数组非常灵活，因为它可以包含任何数据类型，甚至是不同的数据类型。这种现象的原因是\
  \ PHP 没有显式启用严格类型。\n\n### 注意\n\n其他编程语言限制数组为一种数据类型（包括向量数组）。对此有相应的结构，例如。\n\n数组在 PHP\
  \ 自身中也很常见。例如，用于存储表单元素的全局变量 `$_POST` 和 `$_GET` 也是数组。\n\n## 8.1 基础知识\n\n数组可以存储任意数量的数据。数据在数组中一个一个排列。索引标识数据。数组的索引从\
  \ 0 开始，所以第一个元素的索引是 0，第二个索引是 1，第三个索引是 2。\n\n### 8.1.1 创建数组\n\n你使用 `array()` 函数创建数组。你也可以创建一个空数组，即没有元素的数组：\n\
  \n\n\n\n\n```php\n$days = array();\n```\n\n现在 `$days` 变量是一个数组了。如果你想立即向数组中填充元素，请将它们写在圆括号中并用逗号分隔：\n\
  \n```php\n$days = array(\"Monday\", \"Tuesday\", \"Wednesday\");  \n```\n\n### 注意\n\
  \n如前所述，也可以混合不同的数据类型：\n\n```php\n$mix = array(2, \"Text\", true); \n```\n\n要查看数组的内容，你可以使用\
  \ `print_r()` 或 `var_dump()` 函数（参见图 8.1）。\n\n```php\nprint_r($days);  \n```\n\n\
  ![数组](img/img-f8.1.html) \n\n**图 8.1** 数组\n\n然而，还有其他创建数组的方法。你也可以简单地为变量分配一个索引。这总是通过方括号（`[]`）完成的：\n\
  \n```php\n$days[0] = \"Monday\";  \n```\n\n这与许多其他语言不同。在 PHP 中，你不需要单独定义数组。你可以简单地将任何变量转换为数组。\n\
  \n### 注意\n\n如果变量已经有了数据类型，则自动转换为数组的操作将不起。这里有一个例子：在以下脚本中，`$days` 已经是一个值为 Saturday\
  \ 的字符串。如果你现在用方括号访问索引 `0`，旧变量的第一个字符将被 `M` 替换。因此，输出为 Maturday（参见图 8.2），如果你不用 `@` 抑制它，PHP\
  \ 将抛出一个错误消息。\n\n```php\n<?php \n  $days = \"Saturday\"; \n  @$days[0]= \"Monday\"\
  ; \n  print_r($days); \n?> \n```\n\n**列表 8.1** 变量已存在 (\"array_direct.php\")\n\n\
  ![\"\"Saturday\" 变为 \"Maturday\"](img/img-f8.2.html) \n\n**图 8.2** \"Saturday\"\
  \ 变为 \"Maturday\"\n\n### 8.1.2 添加和修改元素\n\n处理数组最重要的一点是方括号语法。这允许你访问数组的任何索引。步骤始终是相同的：\n\
  \n```php\n$name[Index]  \n```\n\n如果你想赋值值，请使用赋值运算符（`=`）：\n\n```php\n$name[Index]\
  \ = Value;  \n```\n\n看一个简单的示例。在以下脚本中（其输出可以在图 8.3 中看到），首先在末尾添加了一个新元素，然后将第三个元素 Moday\
  \ 修正为 Monday。\n\n```php\n<?php \n  $days = array(\"Saturday\", \"Sunday\", \"Moday\"\
  , \"Tuesday\"); \n  $days[4] = \"Wednesday\"; \n  $days[2] = \"Monday\"; \n  print_r($days);\
  \ \n?>  \n```\n\n**列表 8.2** 修改和添加元素 (\"array_change.php\")\n\n![更改后的数组](img/img-f8.3.html)\
  \ \n\n**图 8.3** 修改后的数组\n\n### 提示\n\n如果你在赋值时没有指定索引，则元素将添加到数组末尾并分配最大的数值索引：\n\n```php\n\
  $name[] = value; \n```\n\n### 8.1.3 删除元素\n\n要删除元素，请使用 `unset()`。然而，你也可以用它移除整个数组，如图\
  \ 8.4 所示：\n\n```php\n<?php \n  $days = array(\"Saturday\", \"Sunday\", \"Monday\"\
  , \"Tuesday\"); \n  unset($days[0]); \n  print_r($days); \n  unset($days); \n  print_r($days);\
  \ \n?>  \n```\n\n**列表 8.3** \"unset()\" (\"unset.php\")\n\n![第一个元素消失，然后是整个数组消失](img/img-f8.4.html)\
  \ \n\n**图 8.4** 第一个元素消失，然后是整个数组\n\n### 8.1.4 关联数组\n\n关联数组是索引由字符串或描述性名称组成的数组。这里有一个简单的例子：\n\
  \n```php\n$stockprices = array(\"IBW\" => 232, \"Miemens\" => 34, \"Rheinwerk\"\
  \ => 340);\n```\n\n使用 `=>` 将索引分配给名称。注意：这很容易与对象编程中的 `->` 运算符混淆！\n\n### 注意\n\n在内部，PHP\
  \ 中的所有数组都是关联的。这意味着数值索引仅被赋予特殊的角色。通过方括号（参见图 8.5），你也可以使用自己的名称：\n\n```php\n$stockprices\
  \ = array(\"IBW\" => 232, \"Miemens\" => 34, \"Rheinwerk\" => 340);\n$stockprices[\"\
  Forsche\"] = 5;\nprint_r($stockprices);\n```\n\n![关联数组](img/img-f8.5.html) \n\n\
  **图 8.5** 关联数组\n\n### 8.1.5 JSON 简写\n\n在 PHP 中，数组的另一种基于 JavaScript 对象 (JSON) 的表示法。在这里你只需使用方括号创建数组：\n\
  \n```php\n$days = [\"Monday\", \"Tuesday\", \"Wednesday\"];\n```\n\n这使得代码非常短。关联数组的创建方式：\n\
  \n```php\n$stockprices = [\"IBW\" => 232, \"Miemens\" => 34, \"Rheinwerk\" => 340];\n\
  ```\n\n效果与其他表示法相同。\n\n### 8.1.6 多维数组\n\n多维数组仅仅是嵌套数组。你可以直接将一个数组插入另一个数组：\n\n```php\n\
  $stockprices = [\"IBW\" => array(\"1.1.2020\" => 232, \"1.1.2025\" => 254), \"Miemens\"\
  \ => 34];\n```\n\n或者你可以先将数组保存到变量：\n\n```php\n$w_stockprice = [\"IBW\" => array(\"\
  1.1.2020\" => 232, \"1.1.2025\" => 254), \"Miemens\" => 34];\n```\n\n要访问关联数组的元素，可以使用方括号语法：\n\
  \n```php\n$stockprices[\"IBW\"][\"1.1.2020\"]\n```\n\n例如，最后一行访问了 2020 年 1 月 1 日\
  \ IBW 的价格。该值输出 232。多维数组通过某些函数遍历，例如 `array_recursive()`。在这种情况下，递归意味着子数组及其元素也会被遍历。\n\
  \n## 8.2 数组与循环\n\n可以使用方括号访问数组的单个元素。但在实践中，常见的任务是遍历数组。这种遍历通常通过循环实现。不过可以使用一些替代函数。\n\
  \n在进入解决方案之前，对 PHP 中的数组有一些思考。正如你已经看到的，具有数值索引的数组实际上是关联的。在内部，索引和值按照它们添加到数组的顺序存储。我们将在输出序列处理这个问题。\n\
  \n### 8.2.1 \"for\"\n\n`for` 循环按索引顺序遍历数值数组。为了做到这一点，必须使用 `count()` 函数来确定数组包含多少元素。然后遵循其路径（参见图\
  \ 8.6）。\n\n```php\n<?php \n  $days = array(\"Saturday\", \"Sunday\", \"Monday\"\
  , \"Tuesday\"); \n  for ($i = 0; $i < count($days); $i++) { \n    print $days[$i]\
  \ . \"<br />\"; \n  } \n?>  \n```\n\n**列表 8.4** 数组的 \"for\" 循环 (\"array_for.php\"\
  )\n\n`for` 循环运行良好，但适用于两个条件：\n\n*   数组没有关联索引，只有数值索引。\n*   数组没有间隙；即索引数字之间没有缺失的索引。例如，下面的数组按照之前的模式读取时会产生警告，并且不再输出\
  \ Tuesday，因为 `count()` 的结果为 4 而最后一个元素没有索引 3：\n\n```php\n$days = array(\"Saturday\"\
  , \"Sunday\", \"Monday\", 4=>\"Tuesday\");\n```\n\n`foreach` 更适合不满足这些条件的情况。\n\n\
  ![元素按索引顺序输出](img/img-f8.6.html) \n\n**图 8.6** 元素按索引顺序输出\n\n### 8.2.2 \"foreach\"\
  \n\n使用 `foreach` 循环，你可以遍历数组的所有元素，无论它们是数值索引还是关联索引。下面的循环一个接一个地输出数组的所有元素，如图 8.7 所示：\n\
  \n```php\n<?php \n  $days = array(\"Saturday\", \"Sunday\", \"Monday\", \"Tuesday\"\
  ); \n  foreach ($days as $day) { \n    print $day . \"<br />\"; \n  } \n?>  \n```\n\
  \n\n\n\n\n# 列表 8.5 使用 \"foreach\" 遍历数组 (\"array_foreach.php\")\n\n![数组元素被输出](img/img-f8.7.html)\n\
  \n**图 8.7** 数组元素被输出\n\n### 注意\n默认情况下，值是以拷贝的形式提供的；这意味着字符串不能被修改。然而，如果你想更改值，也可以通过 `&`\
  \ 符号作为引用传递它：\n\n```php\nforeach ($day as &$day) { \n$day = \"<p>\" . $day . \"</p>\"\
  ; \n} \n```\n\n但如果你插入元素的顺序与数值顺序不同会怎样？考虑下面的示例，在例例中，周一在周日之前定义，尽管周日的索引较小。\n\n```php\n\
  <?php \n  $days = array(); \n  $days[0] = \"Saturday\"; \n  $days[2] = \"Monday\"\
  ; \n  $days[1] = \"Sunday\"; \n  $days[3] = \"Tuesday\"; \n\n  foreach ($days as\
  \ $day) { \n    print $day . \"<br />\"; \n  } \n?>  \n```\n\n# 列表 8.6 输入序列中的 \"\
  foreach\" (\"array_foreach_sequence.php\")\n\n在图 8.8 中，你可以看到输入顺序对 `foreach` 是具有决定性的。由于周一是在周日之前插入数组的，因此它也被先输出。\n\
  \n![输入顺序非常重要](img/img-f8.8.html)\n\n**图 8.8** 输入顺序非常重要\n\n### 注意\n在没有关联索引的情况下，可以使用\
  \ `for` 循环来解决问题。然而，PHP 还提供了许多其他排序函数。\n\n对于 PHP 的关联数组，你可能不仅想要获取值，还想要该值的索引。在这里，`foreach`\
  \ 也提供了优秀的服务，如图 8.9 所示。\n\n```php\n<?php \n  $stockprices = array(\"IBW\" => 232,\
  \ \"Miemens\" => 34, \"Rheinwerk\" => 340); \n  foreach ($stockprices as $index\
  \ => $stockprice) { \n    print \"The company \" . $index . \" \"; \n    print \"\
  has the stock price: \" . $stockprice . \"<br />\"; \n  } \n?>  \n```\n\n# 列表 8.7\
  \ 使用 foreach 读取索引 (\"array_foreach_index.php\")\n\n![索引也可以输出](img/img-f8.9.html)\n\
  \n**图 8.9** 索引也可以输出\n\n### 注意\n从 PHP 7.1 开始，你还可以在 `foreach` 循环中使用 JSON 表示法的数组。下面的示例显示了不包含对象的\
  \ JSON 数组。\n\n```php\n<?php\n  $stockprices = [\n     [\"IBW\", 232],\n     [\"\
  Miemens\", 34],\n     [\"Rheinwerk\", 340]\n  ];\n  foreach ($stockprices as [$index,\
  \ $stockprice]) { \n    print \"The company \" . $index . \" \";\n    print \"has\
  \ the stock price: \" . $stockprice . \"<br />\"; \n  } \n?>\n```\n\n# 列表 8.8 使用\
  \ JSON 法的 \"foreach\" (\"array_foreach_abbreviation.php\")\n\n## 8.2.3 迭代函数\n除了循环之外，PHP\
  \ 还提供了许多你可以用于遍历数组的函数。这背后的概念是指向数组当前元素的一种指针。\n\n例如，使用 `current(Array)` 函数可以获取当前元素。而使用\
  \ `next(Array)`，指针会移动一个元素并让你获取该元素。如果没有元素，你将接收到 `false`。下面的简单示例遍历了数组的所有元素（参见图 8.10）。\n\
  \n```php\n<?php\n  $stockprices = array(\"IBW\" => 232, \"Miemens\" => 34, \"Rheinwerk\"\
  \ => 340); \n  print current($stockprices) . \"<br />\"; \n  while (next($stockprices))\
  \ { \n    print current($stockprices) . \"<br />\"; \n  } \n?>  \n```\n\n# 列表 8.9\
  \ \"current()\" 和 \"next()\" (\"current_next.php\")\n\n![所有股票价格](img/img-f8.10.html)\n\
  \n**图 8.10** 所有股票价格\n\n### 注意\n注意：显示的方法在数组的其中一个值为 `false` 或 `0` 时会失效！在这种情况下，即使数组未完全遍历，`while`\
  \ 循环也会终止。然而，如果你检查绝对不等相等，至少可以过滤出值 `0`：\n\n```php\nwhile (next($rates) !== false)\
  \ { ... }\n```\n\n除了这两个函数外，还有其他几个用于迭代的函数：\n\n*   `pos(Array)` 是 `current()` 的同义词。\n\
  *   `prev(Array)` 返回当前元素之前的数组元素。如果如果没有更多元素，则返回 `false`。\n*   `reset(Array)` 将指针置回第一个元素。如果数组为空，该函数返回\
  \ `false`。\n*   `end(Array)` 将指针设置为最后一个元素。如果数组为空，该函数返回 `false`。\n*   `each(Array)`\
  \ 的工作类似于 `next()`，不同在于它以数组的形式返回键和值。然而，从 PHP 7.2 起不再建议使用该函数，并在 PHP 8 中已移除。\n*   `key(Array)`\
  \ 返回数组中当前指针位置的元素的索引。\n*   `array_walk(Array, Function, Parameter)` 自动遍历数组并为每个元素调用一个函数。该函数接收相应元素的值和索引作为参数。可选，你还可以传递第三个参数。使用\
  \ `array_walk()` 时，你不应该更改数组。输出是元素的输入顺序。所有的迭代函数都是如此。`array_walk_recursive()` 的工作方式与\
  \ `array_walk()` 相同，不同在于它还能处理多维数组。下面的示例显示了图 8.11 中 `array_walk()` 的用法。\n\n```php\n\
  <?php\n  $stockprices = array(\"IBW\" => 232, \"Miemens\" => 34, \"Rheinwerk\" =>\
  \ 340);\n  \n  function output($stockprices, $index, $text) {\n    if ($index !=\
  \ \"Miemens\") {\n      print $text . $index . \": \";\n      print $stockprices\
  \ . \"<br />\";\n    }\n  }\n  array_walk($stockprices, \"output\", \"stock price\
  \ from: \");\n?>  \n```\n\n# 列表 8.10 \"array_walk()\" (\"array_walk.php\")\n\n![函数返回两个值](img/img-f8.11.html)\n\
  \n**图 8.11** 函数返回两个值\n\n*   `array_map(function, array ...)` 为数组的每个元素调用函数，并返回一个包含通过函数处理后的数组元素的数组。\n\
  \n## 8.3 检查\n假设你对函数的返回值并不了解，但你怀疑它通常是一个数组并需要从中获取一些信息。PHP 提供了一些有趣的函数。\n\n你已经了解了 `count(Array)`。该函数计算数组中元素的数量。如果你在第二个参数中指定\
  \ `COUNT_RECURSIVE` 或 `1`，则会对所有元素进行递归计数。这意味着 `count(Array, Mode)` 还会计算嵌套数组。假设有数组：\n\
  \n```php\n$ibw_stockprices = array(\"1.1.2015\" => 232, \"1.1.2020\" => 254); \n\
  $stockprices = array(\"IBW\" => $ibw_stockprices);  \n```\n\n如果你现在不带模式计算所有元素，例如：\n\
  \n```php\nprint count($stockprices);  \n```\n\n那么你会得到 1。然而，如果你递归工作，使用：\n\n```php\n\
  print count($stockprices, 1);  \n```\n\n那么 `count()` 也会计算子数组的元素并返回 3。\n\n现在来看其他有趣的检查函数：\n\
  \n*   `sizeof()` 是 `count()` 的同义词。\n*   `isset(Array)` 确定数组是否定义。`isset()` 对于空数组也返回\
  \ true。\n*   `empty(Array)` 检查数组是否为空（true）或是否有元素（false）。如果数组不存在，则 `empty()` 返回 true。\n\
  *   `is_array(Array)` 检查某物是否为数组。如果数组不存在，`is_array()` 将返回警告。因此，你必须将此函数与 `isset()`\
  \ 结合使用。\n\n\n\n\n\n*   `in_array(Search element, Array, Strict)` 检查一个值是否存在于数组中。`Search\
  \ element` 可以是任何数据类型，包括另一个数组（从 PHP 4.2.0 开始）。如果可选参数 `Strict` 设置为 `true`，则 `Search\
  \ element` 与查找项的数据类型必须匹配。注意：`in_array()` 是两个不以数组开头、而是以搜索元素开头的数组函数之一![\\[  68�\\\
  ]](footnotes.html#ftn-fn08_02)\n\n### 注意\n\n该函数的适用规则与比较运算符的规则相同。在进行字符串比较时，字符的 ASCII\
  \ 位置是决定性的；也就是说，它会区分大写和小写。当使用 `Strict` 时，它是对绝对相等或不相等的检查。\n\n## 8.4 转换\n\n在数组辅助函数的庞大宇宙中，我们首先向你展示用于转换、分割和合并数组的最重要的函数。你还将学习如何将变量转换为数组，反之亦然。\n\
  \n### 注意\n\n大多数数组辅助函数也可以或或容易地通过普通数组函数来实现。然而，几乎没有人想去完成这项工作。\n\n### 8.4.1 添加和删除\n\n\
  你可以将数组想象成栈。第一个创建的元素是栈中的第一个元素；最后一个添加的元素是最后一个。\n\n让我们看看 PHP 为此提供的四个函数：\n\n*   `array_pop(Array)`\
  \ 移除数组的最后一个元素并返回它。如果没有元素，该函数返回零。\n\n*   `array_push(Array, Value, Value ...)` 将一个或或多个值添加到数组的末尾。你会自动获得最高的索引。数组的大小根据指定的元素数量而增加。返回元素的总数。\n\
  \n*   `array_shift(Array)` 移除数组的第一个元素并更改所有其他元素的数值索引（关联索引不受影响）。在接下来的示例中，周六消失了，周日的索引变为\
  \ 0：\n\n```php\n$days = array(\"Saturday\", \"Sunday\", \"Monday\", \"Tuesday\"\
  );\narray_shift($days);  \n```\n\n该函数返回被移除的元素，如果数组为空则返回零。\n\n*   `array_unshift(Array,\
  \ Value, Value ...)` 将新值添加到数组的开头，并返回数组之后的元素数量。\n\n### 8.4.2 删除和替换\n\n`array_slice(array,\
  \ start_index, length)` 函数从数值数组中读取元素并将其作为数组返回。它从 `start_index` 开始，你可以可选地指定 `length`——即从起始索引开始切片的元素数量。如果你省略了\
  \ `length`，则切取到数组末尾的所有元素。因此，下面的示例返回一个包含两个元素的新数组（参见图 8.12）。\n\n```php\n<?php \n \
  \ $days = array(\"Saturday\", \"Sunday\", \"Monday\", \"Tuesday\"); \n  $new = array_slice($days,\
  \ 1, 2); \n  print_r($new); \n?>  \n```\n\n**列表 8.11** \"array_slice()\" (\"array_slice.php\"\
  )\n\n![新数组：原数组不改变！](img/img-f8.12.html) \n\n**图 8.12** 新数组：原数组不改变！\n\n### 注意\n\n\
  你也可以为 `start_index` 指定一个负值。在这种情况下，计数从数组末尾开始。下面这一行只从数组中切出周一：\n\n```\n$new = array_slice($tage,\
  \ -2, 1); \n```\n\n然而，如果 `length` 为负值，则切片将在从数组末尾开始计算的位置处停止。\n\n对于关联数组，`array_slice(Array,\
  \ Length)` 只有两个参数：数组和 `length`（即从数组中切片的元素数量）。元素从数组开头被移除并放置在新数组中。原数组在这里也没有改变。图 8.13\
  \ 显示了以下指令的结果：\n\n```php\n$stockprices = array(\"IBW\" => 232, \"Miemens\" => 34,\
  \ \"Rheinwerk\" => 340); \n$new = array_slice($stockprices, 2); \nprint_r($new);\
  \  \n```\n\n![只有最后一个元素被添加到新数组中](img/img-f8.13.html) \n\n**图 8.13** 只有最后一个元素被添加到新数组中\n\
  \n### 提示\n\n`array_slice()` 通常会调整所有的数值索引。你也可以保护键。为了做到这一点，请将第四参数指定为 `true`：\n\n```php\n\
  $new = array_slice($days, 1, 2, true); \n```\n\n图 8.14 显示了结果。\n\n![两个值保留了它们的索引](img/img-f8.14.html)\
  \ \n\n**图 8.14** 两个值保留了它们的索引`array_slice(Array, length, replacement)` 工作与其对应项类似，但插入了\
  \ `replacement` 元素。注意原数组发生了变化。`array_slice(Array, start_index, length, offset)`\
  \ 可以使用负值。`array_splice(Array, start_index, length, replacement)` 从数组中间开始。如果你使用 `replacement`，它将被插入到原数组中。考虑以下示例：\n\
  \n```php\n$days = array(\"Saturday\", \"Sunday\", \"Monday\", \"Tuesday\");\narray_splice($days,\
  \ 1, 2, \"Wednesday\", \"Thursday\");\nprint_r($days);\n```\n\n`array_splice()`\
  \ 函数替换了从数组中间插入的元素。\n\n**列表 8.11** \"array_splice()\" (\"array_splice.php\")\n\n\
  ![原数组已经改变](img/img-f8.15.html) \n\n**图 8.15** 原数组已经改变\n\n### 8.4.3 连接\n\n要连接一个或多个数组，请使用\
  \ `array_merge(Array1, Array2 ...)`。你只需依次指定数组。它们将如图 8.16 所示：\n\n```php\n<?php \n\
  \  $days = array(\"Saturday\", \"Sunday\", \"Monday\", \"Tuesday\"); \n  $stockprices\
  \ = array(\"IBW\" => 232, \"Miemens\" => 34, \"Rheinwerk\" => 340); \n  $new = array_merge($days,\
  \ $stockprices); \n  print_r($new); \n?>  \n```\n\n**列表 8.12** \"array_merge()\"\
  \ (\"array_merge.php\")\n\n![数组合并在一起](img/img-f8.16.html) \n\n**图 8.16** 数组合并在一起\n\
  \n连接根据以下规则：\n\n*   相同的关联索引意味着后添加的元素将覆盖之前的元素——例如：\n\n```php\n$stockprices = array(\"\
  IBW\" => 232, \"Miemens\" => 34, \"Rheinwerk\" => 340);\n$stockprices2 = array(\"\
  IBW\" => 33, \"Foyota\" => 45);\n$new = array_merge($stockprices, $stockprices2);\n\
  ```\n\nIBW 在两个数组中都存在。IBW 在 `$new` 中仅出现一次，值为 33。\n\n*   相同的数值索引会导致索引号的调整，但两个元素都会保留——例如：\n\
  \n```php\n$days = array(\"Saturday\", \"Sunday\", \"Monday\", \"Tuesday\");\n$days2\
  \ = array(\"Wednesday\", \"Thursday\", \"Friday\");\n$new = array_merge($days, $days2);\n\
  ```\n\n数组 `$new` 包含了所有日子。周三的索引为 4，周四为 5，依此类推。\n\n*   数值索引总是会被重新编号的。这意味着即使只指定了一个数组，元素也会按照输入顺序重新编号。如果你只是想合并数组而不重新编号，你也可以使用\
  \ `+` 来添加它们。\n\n除了 `array_merge()` 之外，PHP 中还有两个有趣的函数：\n\n*   `array_merge_recursive(Array1,\
  \ Array2 ...)` 用于合并多维数组。该函数会遍历所有数组并将它们合并在一起。\n\n\n\n\n\n* `array_combine(keys, values)`\
  \ 将两个数组合并为一个关联数组。第一个数组包含所有的键，第二个数组包含关联的值。\n\n#### 注意事项\n\n你将在每个工作文件中找到一个示例。文件的命名方式与方法相同——即\
  \ `array_merge_recursive.php` 和 `array_combine.php`。\n\n* 与 `array_combine()` 非常相似的是\
  \ `list(Variable1, Variable2 ...)` 语言结构。它将数组的各个单独值赋值给多个变量。\n\n```php\n<?php\n  $stockprices\
  \ = array(232, 34, 340);\n  list($IBW, $Miemens, $Rheinwerk) = $stockprices;\n \
  \ print \"The price of Miemens is: \" . $Miemens;\n?>\n```\n\n**列表 8.14** \"list()\"\
  \ (\"list.php\")\n\n### 提示\n\n你也可以省略 `list()` 中不需要的值。此时它看起来像这样：\n\n```php\nlist(,\
  \ $Miemens,) = $stockprices; \n```\n\n对于数据库输出等内容，你还可以在循环中使用 `list()`：\n\n```php\n\
  while(list($x, $y) = sqlite_fetch_array($query)) { ... } \n```\n\n#### 注意事项\n\n\
  PHP 7 对 `list()` 有一项更改：赋值的顺序现在按照变量声明的顺序进行。\n\n### 8.4.4 变量与数组\n\n如果你想从数组元素生成变量，或将变量转换为数组，可以手动完成，但自动过程更方便。`extract(Asso_Array)`\
  \ 函数将关联数组的所有元素转换为变量。索引变成变量名，值变成变量值。考虑以下这个简单的示例；图 8.17 显示了结果。\n\n```php\n<?php \n\
  \  $stockprices = array(\"IBW\" => 232, \"Miemens\" => 34, \"Rheinwerk\" => 340);\
  \ \n  extract($stockprices); \n  print \"The course of Miemens is: \" . $Miemens;\
  \ \n?> \n```\n\n**列表 8.15** \"extract()\" (\"extract.php\")\n\n![变量的工作](img/img-f8.17.html)]\
  \ \n\n**图 8.17** 变量的工作\n\n#### 注意事项\n\n出于安全考虑，你不应该仅仅对之前通过 `$_GET` 或 `$_POST` 超全局数组获取的用户输入执行此操作。\n\
  \n默认情况下，`extract(Array, Mode, Prefix)` 会覆盖同名的现有变量。然而，你可以选择性地一种模式来处理现有变量。模式有许多常量可用，如表\
  \ 1.1 所示。第三个参数也是可选的，允许你为变量名添加前缀。这允许你清晰地识别新生成的变量，从而完全避免冲突。模式决定了是否使用前缀。\n\n| 模式 |\
  \ 说明 |\n| --- | --- |\n| EXTR_OVERWRITE | 始终覆盖现有变量（默认设置）。 |\n| EXTR_SKIP | 始终保留现有变量。\
  \ |\n| EXTR_PREFIX_SAME | 如果两个变量匹配，则数组中的新变量接收前缀（第三个参数）。 |\n| EXTR_PREFIX_ALL | 为所有变量提供前缀。\
  \ |\n| EXTR_PREFIX_INVALID | 为索引为无效变量名的变量添加前缀。这包括数字索引。 |\n| EXTR_IF_EXISTS | 仅在变量已存在时设置变量。旧的会被覆盖。\
  \ |\n| EXTR_PREFIX_IF_EXISTS | 仅在变量已存在时设置变量。然而，为新变量使用前缀。保留旧的。 |\n| EXTR_REFS | 以引用提取变量。这意味着它们仍然指向数组。`extract($stockprices,\
  \ EXTR_REFS); $stockprices[\"Miemens\"] = 45;` |\n\n**表 8.1** \"extract()\" 模式\n\
  \n`compact(Variable, Variable ...)` 函数是 `extract()` 的对应项。该函数可以包含任意数量的字符串形式的变量名。变量名也可以在一个或多个数组中。会对这些变量名进行检查，判断变量是否存在。然后将其存储在关联数组中。\n\
  \n除了此函数外，还有其他自动创建数组的函数：\n\n* `array_fill(start_index, number, value)` 从 `start_index`\
  \ 开始填充数组，填充 `number` 指定指定数量的元素。它们都接收第三个参数作为值。\n\n* `range(Min, Max, Step)` 创建一个从\
  \ `Min` 到 `Max` 值的数组。`Min` 和 `Max` 也可以交换。第三个参数定义中间步长。\n\n### 8.4.5 解引用\n\n解引用意味着你可以直接访问数组中的单个元素。如果数组是刚刚创建的，这一点也适用：\n\
  \n```php\necho ['Monday', 'Tuesday', 'Wednesday'][0]; \n```\n\n在这种情况下，直接返回第一个元素（在此处是\
  \ Monday）。这种形式的解引用从 PHP 5.5 起存在。从 PHP 5.4 开始，你可以直接访问返回数组的函数。要做到这一点，只需添加方括号即可。图 8.18\
  \ 显示了结果。\n\n```php\n<?php \nfunction add($start, $end, $step = 1) {\n  $result =\
  \ array();\n  for ($i = $start; $i < $end; $i += $step) {\n    $result[] = $i;\n\
  \  }\n  return $result;\n}\necho add(2, 10)[2]; \n?>\n```\n\n**列表 8.16** 直接访问 (\"\
  array_dereferencing.php\")\n\n### 8.4.6 转换为参数\n\n带有点的 `(...)` 运算符用于函数中接收多个参数。相反，它也可以用于将数组解析为多个参数。只需在数组前面写该运算符即可。\n\
  \n```php\n<?php\nfunction add($a, $b, $c) {\n  return $a + $b + $c;\n}\n$parameter\
  \ = [1, 2, 3];\n$result = add(...$parameter);\necho $result;\n?>\n```\n\n**列表 8.17**\
  \ 数组 (\"array_unpack.php\")\n\n上述脚本的结果为 6。\n\n#### 注意事项\n\n运算符只能用于调用结束。然而，你可以显式指定任何参数。\n\
  \n从 PHP 8.1 开始，数组运算符 `...` 也可以用于数组。下面的示例解析了两个数组并将它们合并为一。\n\n```php\n<?php\n$stockprices1\
  \ = array(\"IBW\" => 232, \"Miemens\" => 34, \"Rheinwerk\" => 340);\n$stockprices2\
  \ = array(\"Rheinwerk\" => 500, \"Forsche\" => 84);\n\n$all_stockprices = [...$stockprices1,\
  \ ...$stockprices2];\nprint_r($all_stockprices);\n?>\n```\n\n**列表 8.18** 使用 … 运算符传递数组\
  \ (\"array_unpack_string.php\")\n\n![在结果数组中，如果键相同则使用最后一个键](img/img-f8.19.html)]\
  \ \n\n**图 8.19** 在结果数组中，如果键相同则使用最后一个键\n\n### 提示\n\n功能上，示例以及参数的工作方式与 `array_merge()`\
  \ 数组函数对应。\n\n## 8.5 搜索与排序\n\n本节总结了过滤数组元素或以某种方式重新排列元素顺序的函数。\n\n### 8.5.1 搜索\n\n有一些有趣的搜索函数。我们在这里介绍了最重要的几个：\n\
  \n*   `array_key_exists(Index, Array)` 函数确定索引是否存在于数组中，并返回一个真值作为结果。\n\n*   `array_search(Value,\
  \ Array, Exactly)` 在数组中搜索值并返回键或多个键。如果有多个，它返回一个数组。如果可选的 `Exactly` 选项设置为 true，则搜索也将包含数据类型。注意：与\
  \ `in_array()` 相似，搜索项放置在数组之前！\n\n\n\n*   `array_keys(Array, Value, Exactly)` 返回数组的所有键，并返回一个数值数组。如果你指定了一个值，则只返回具有该值的键。`Exact`\
  \ 也是可选的，决定是否也检查数据类型。\n*   `array_values(Array)` 返回数组的值。生成的数组具有数值索引。原有的关联索引将丢失。\n\
  \n### 8.5.2 排序 (Sort)\n\n对于数组的排序，既有实用的函数，也有那些十年才用一次的函数。我们在这里不作过多区分，将重要的以及一些不那么重要的函数都包含在内。\n\
  \n首先，这里有一些应用范围非常有限且仅允许少量设置的函数：\n\n*   `array_flip(Array)` 交换数组的索引和值，并返回此数组作为返回值。如果有多个相同的值，只有最后一个值会被保留，并接收其键作为值。\n\
  *   `array_reverse(Array, Preserve)` 反转数组的顺序。可选的第二个参数决定是否保留键（`true`）。其默认值为 `false`。\n\
  *   `array_rand(Array, number)` 返回数组元素的随机索引。如果你指定了数字，将得到一个包含多个随机索引的数组。\n*   `shuffle(Array)`\
  \ 随机改变数组元素的顺序。返回值为布尔值，告知操作是否成功。\n\n现在来看具有更多设置选项的排序函数。`sort()` 及其类似的函数命名都非常逻辑化：\n\
  \n*   根词是 `sort`。\n*   如果它前面有一个 `r`，则进行反序排序。\n*   如果最开头有一个 `a`，则进行排序，但保留索引和值的赋值。\n\
  *   如果开头有一个 `k`，则按索引对数据排序。在这里索引/值的赋值也会被保留。所有其他排序函数都按值排序。\n*   对于所有其他函数，索引/值的赋值都会发生变化。\n\
  *   `u` 表示该函数期望一个排序函数作为参数。\n*   `nat` 意味着尝试进行自然排序（就像人类做的那样）。例如，数字 `1`、`2` 和 `3`\
  \ 会排在 `10`、`20` 和 `30` 之前。这使用了 Martin Pool 的算法（参见 [`s-prs.co/v602269`](http://s-prs.co/v602269)）。\n\
  \n考虑以下简单示例。`sort()` 函数按值排序（因为没有指定键键 `k`），并且它改变了索引/值的赋值。`sort` 函数与所有其他函数一样——会改变原始数组。图\
  \ 8.20 显示了结果。\n\n```php\n<?php \n  $days = array(\"Saturday\", \"Sunday\", \"Monday\"\
  , \"Tuesday\"); \n  sort($days); \n  print_r($days); \n?>  \n```\n\n**列表 8.19**\
  \ \"sort()\" (\"sort.php\")\n\n![字母序排序](img/img-f8.20.html)\n\n**图 8.20** 字母序排序\n\
  \n### 8.6 超全局数组 (Superglobal Arrays)\n\n超全局数组实际上非常容易描述。它们是包含重要信息的（关联）数组。例如，`$_SERVER`\
  \ 包含 HTTP Header、路径等；`$_POST` 和 `$_GET` 包含从表单发送的数据；而 `$_SESSION` 包含会话信息。\n\n超全局数组实际上非常容易描述。它们是包含重要信息的（关联）数组。例如，`$_SERVER`\
