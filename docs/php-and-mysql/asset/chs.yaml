  \ \n\n**图 35.9**     QCachegrind 中的性能分析数据\n\nXdebug 正在不断开发；该软件作者还经常就该主题进行演讲，可以在\
  \ [`s-prs.co/v602254`](http://s-prs.co/v602254) 找到。\n\n### 提示\n\nKCachegrind 包还包含一个可以将数据转换为\
  \ ASCII 格式的 Perl 脚本。你也可以使用其他软件进行进一步处理。\n\n## 35.3 解决\n\n那么 `debugger.php` 文件中的错误在哪里？图\
  \ 35.4 已经显示了一个很好的提示：在第三行中，变量 `$start` 没有取布尔值 `false`（如第 2、4 和 6 行所示），而是整数值 0。这已经解决了谜团：`strpos()`\
  \ 中的字符计数从 0 开始。因此，如果一行以 `http://` 开头，那么 `strpos($line, \"http://\")` 的返回值为 0。但作为布尔术语，0\
  \ 对应于 `false`。因此 `if (0)` 等同于 `if (false)`，所以没有执行 `if` 分支。\n\n```php\n<?php\n  $url\
  \ = [];\n  $file = fopen(\"text.txt\", \"r\");\n  while (!feof($file)) {\n    $line\
  \ = fgets($file, 1024);\n    if (strpos($line, \"http://\") !== false) {\n     \
  \ $start = strpos($line, \"http://\");\n      $end1 = strpos($line, \" \", $start+1);\n\
  \      $end2 = strpos($line, \")\", $start+1);\n      if ($end1 === false && $end2\
  \ === false) {\n        $end = strlen($line);\n      } elseif ($end1 === false)\
  \ {\n        $end = $end2;\n      } elseif ($end2 === false) {\n        $end = $end1;\n\
  \      } else {\n        $end = min($end1, $end2);\n      }\n      $url[] = substr($line,\
  \ $start, $end - $start); \n    }\n  }\n  fclose($file);\n  echo implode(\"<br />\"\
  , $url);\n?>\n```\n\n![代码列表 35.4](img/img-f35.4.html) \n\n**代码列表 35.4**     修正版本\n\
  \n``` \n```\n\n\n\n\n安装 PHPUnit 有两种方法。一方面，你可以使用 `Composer` 包管理器，我们将在第 38 章中对其进行详细讨论。一旦在系统中安装了\
  \ `Composer`，它会执行以下指令进行安装（见图 36.1）：\n\n```\ncomposer require --dev phpunit/phpunit\
  \  \n```\n\n![通过 Composer 安装 PHPUnit](img/img-f36.1.html) \n\n**图 36.1** 通过 Composer\
  \ 安装 PHPUnit\n\n### 注意\n\n对于最新版本的 PHPUnit，你需要 `mbstring` PHP 扩展，你可以像往常一样通过 `php.ini`\
  \ 文件对其进行安装。\n\n或者，你也可以从 PHPUnit 下载 `PHAR` 软件包。某个特定主版本号下最新次要版本的 URL 为 `https://phar.phpunit.de/phpunit-X.phar`，其中\
  \ `X` 的值为 `10` 等。在这里，我们假设你随后将此存档保存为 `phpunit.phar`。你可以在 [`phar.phpunit.de`](https://phar.phpunit.de)\
  \ 找到所有发布。将 `PHAR` 文件设为可执行，然后按照图 36.2 所示调用它。\n\n![执行 PHPUnit 的 PHAR 包](img/img-f36.2.html)\
  \ \n\n**图 36.2** 执行 PHPUnit 的 PHAR 包\n\n## 36.3 使用 PHPUnit 进行测试\n\n一旦安装了框架，就是时候实现它了。在测试代码之前，我们必须先编写代码[[\
  \ 151 ]](footnotes.html#ftn-fn36_01)。在字符串中搜索 URL 的功能在列表 36.1 中被描述，并已转换为类（这使得调用变得稍微容易了一些）。如果找到了\
  \ URL，静态方法 `UrlFinder::find()` 将会返回它；否则，将抛出 `InvalidArgumentException` 类型的异常。\n\n\
  ```php\n<?php\nclass UrlFinder {\n  public static function find($line) {\n    if\
  \ (($start = strpos($line, \"http://\")) !== false) {\n      $end1 = strpos($line,\
  \ \")\", $start+1);\n      $end2 = strpos($line, \" \", $start+1);\n      if ($end1\
  \ === false && $end2 === false) {\n        $end = strlen($line);\n      } elseif\
  \ ($end1 === false) {\n        $end = $end2;\n      } elseif ($end2 === false) {\n\
  \        $end = $end1;\n      } else {\n        $end = min($end1, $end2);\n    \
  \  }\n      return substr($line, $start, $end - $start); \n    } else {\n      throw\
  \ new InvalidArgumentException(\"No URL found\");\n    }\n  }\n}\n?>  \n```\n\n\
  **列表 36.1** 带有 URL 解析器的类 (\"UrlFinder.php\")\n\n为了为此项编写编写测试，我们需要创建一个包含测试用例的特殊测试类。在这个类中——派自\
  \ PHPUnit 的 `TestCase` 类——特定的方法执行测试。这些测试方法每一个都以 `test` 开头（这是 PHPUnit 识别它们的方式）。\n\
  \n在这些方法中，应用了所谓的准备-执行-断言（Arrange-Act-Assert, AAA）模式——本质上：\n1. 测试的准备\n2. 执行待测试的功能\n\
  3. 确认正确的结果\n\n第三点“确认”通常被称为断言（assertion）。测试检查返回值是否为预期值。PHPUnit 对应的辅助方法也以 `assert`\
  \ 开头。这里有一个测试方法的示例，用于检查输入是否实际上确定了正确的 URL：\n\n```php\npublic function testFindbetween()\
  \ \n{ \n  $this->assertEquals(\n    'http://php.net/',\n    UrlFinder::find('http://php.net/\
  \ is the homepage of the project'))\n }\n```\n\n在抛出异常的情况下，显然无法与 `assertEquals()`\
  \ 进行比较，因为异常不是返回值。相反，我们必须确定是否抛出了某种类型的异常。PHPUnit 为此提供了另一个辅助方法：`expectException()`。它看起来像这样：\n\
  \n```php\n$this->expectException(InvalidArgumentException::class); \nUrlFinder::find('no\
  \ URL');\n```\n\n列表 36.2 显示了完整测试的概述。\n\n```php\n<?php\n  use PHPUnit\\Framework\\\
  TestCase;\n  require \"UrlFinder.php\";\n\n  class UrlFinderTest extends TestCase\
  \ {\n    public function testUrl() {\n        $this->expectException(InvalidArgumentException::class);\n\
  \        UrlFinder::find('no URL');\n    }\n\n    public function testFindbetween()\
  \ {\n      $this->assertEquals(\n        'http://php.net/',\n        UrlFinder::find('http://php.net/\
  \ is the homepage of the project'));\n    }\n  }\n```\n\n\n\n\n在本章中，我们将跳过介绍性的解释，直接进入应用示例。原因在于：PHP\
  \ Apache 函数的唯一共同点是它们仅适用于作为 Apache 模块版本的 PHP。然而，这些函数中的每一个都实现了特定的目的，应用示例也正源于此。\n\n\
  ### 37.2.1 关于 Apache 的信息\n\n首先，可以使用 PHP 本身找到有关 Apache 安装的信息。这对于某些主机可能很有用，例如这些主机向客户提供的有关\
  \ Web 服务器配置的信息较少。\n\n这里有两个函数特别别有意思：\n\n- `apache_get_modules()` 以关联数组的形式返回所有已安装的\
  \ Apache 模块列表。\n- `apache_get_version()` 确定所使用的 Apache 版本。\n\n考虑以下示例列表。输出见图 37.2。\n\
  \n```html\n<html> \n<head> \n  <title>Apache Info</title> \n</head> \n<<body> \n\
  <b>You are using Apache  \n```\n\n```php\n<?php \n  echo apache_get_version(); \n\
  ?>  \n```\n\n```html\n with the following modules:</b> \n<pre>  \n```\n\n```php\n\
  <?php \n  print_r(apache_get_modules()); \n?>  \n```\n\n```html\n</pre> \n</body>\
  \ \n</html>  \n```\n\n**列表 37.1** 关于 Apache 安装的信息（\"info.php\"）\n\n![所有已安装的 Apache\
  \ 模块](img/img-f37.2.html)\n\n**图 37.2** 所有已安装的 Apache 模块\n\n### 37.2.2 读取 HTTP 头部\n\
  \n`_SERVER` 超全局数组包含了许多环境变量和服务器变量，但并非全部。这无法完全访问 HTTP 头部。然而，如果 PHP 集成在 Web 服务器中，那么脚本语言就足够接近\
  \ HTTP 请求和响应的“核心”，从而可以完全访问。\n\nPHP 提供了 `apache_request_headers()` 和 `apache_response_headers()`\
  \ 函数，可以用它们以关联数组的形式确定请求和响应的 HTTP 头部（参见列表 37.2）。在图 37.3 中显示的那个头部是由 PHP 生成的；所有其他头部都是\
  \ PHP 完成工作后由 Apache 生成的。\n\n```html\n<html> \n<head> \n  <title>HTTP Headers</title>\
  \ \n</head> \n<body> \n<h1>Request</h1> \n<pre>  \n```\n\n```php\n<?php \n  print_r(apache_request_headers());\
  \ \n?>  \n```\n\n```html\n</pre> \n<h1>Response</h1> \n<pre>  \n```\n\n```php\n\
  <?php \n  print_r(apache_response_headers()); \n?>  \n```\n\n```html\n</pre> \n\
  </body> \n</html>  \n```\n\n**列表 37.2** 输出 HTTP 头部（\"header.php\"）\n\n![所有头部概览](img/img-f37.3.html)\n\
  \n**图 37.3** 所有头部概览\n\n### 37.2.3 URI 信息\n\nWeb 浏览器请求 URL 或 URI。然而，还有所谓的“部分请求”，其中仅确定有关资源的基本信息——例如\
  \ MIME 类型、缓存行为等。如果 PHP 是作为 Apache 模块安装的，脚本语言可以在同一服务器上找到关于文件的这些信息。除其他外，这使得将虚拟文件名\
  \ `/folder/file.php` 转换为实际的物理文件名 `/home/httpd/docs/file.php`成为可能。`apache_lookup_uri()`\
  \ 确定这些信息并将其作为关联数组返回（参见图 37.4）。\n\n```php\n<?php\n  $file = \"\";\n  if (isset($_GET[\"\
  file\"]) && is_string($_GET[\"file\"])) {\n    $file = $_GET[\"file\"];\n  }\n?>\n\
  ```\n\n```html\n<html>\n<head>\n  <title>URI Info</title>\n</head>\n<body> \n```\n\
  \n```php\n<?php\n  if ($file !== \"\") {\n?>\n```\n\n```html\n<h1>Information about\
  \ <?php\n  echo htmlspecialchars($file);\n?></</h1>\n<pre> \n```\n\n```php\n<?php\n\
  \  print_r(apache_lookup_uri($file));\n?> \n```\n\n```html\n</pre> \n```\n\n```php\n\
  <?php\n  }\n?>\n```\n\n```html\n<form method=\"get\" action=\"\">\n  URI: <input\
  \ type=\"text\" name=\"file\" value=\"<?php\n    echo htmlspecialchars($file);\n\
  \  ?>\"/>\n  <input type=\"submit\" value=\"Get info\" />\n</form>\n</body>\n</html>\
  \  \n```\n```\n\n**列表 37.3** 关于一个 URI 的信息（\"uri.php\"）\n\n![URI 信息概览](img/img-f37.4.html)\n\
  \n**图 37.4** URI 信息概览\n\n### 37.2.4 集成其他技术\n\n如果需要集成其他脚本，PHP 通常使用以下结构之一：`include`、`include_once`、`require`\
  \ 或 `require_once`。然而，如果以这种方式包含的文件不包含任何 PHP 或 HTML，则会失败。在一个日益异构的世界中，很有可能尽管主网站运行在\
  \ PHP 下，但它的部分内容仍然用 Perl 或其他技术实现。\n\n此时，列表 37.4 提供了一个非常简单的示例。假设你“继承”了一个 Perl 网站，但想将其转换为\
  \ PHP。然而，有一个脚本你无法在 PHP 中重新构建，因此想继续使用它。\n\n```perl\n#!/usr/local/bin/perl\n## \n\
  ## Output environment variables \n## \nprint \"Content-type: text/html\\n\\n\";\
  \ \nforeach $value (sort(keys(%ENV))) \n{ \n    $value = $ENV{$value}; #Get environment\
  \ variable \n    $value =~ s|\\n|g; #Make visible \n    $value =~ s/\"|g; #escape\
  \ quotation marks \n    print \"${value}\\<br />\\n\"; \n}\n```\n\n**列表 37.4** \
  \ Perl 示例（\"environment.pl\"）\n\nPerl 专家一眼就能看出列表 37.4 中的代码：它是 Apache Web 服务器提供的\
  \ `printenv.pl` 脚本的稍微修改版本。该脚本除了输出环境变量外无所事事。此代码应该在 PHP 脚本中调用。当然，你可以使用 `fopen()` 执行脚本并输出返回值。然而，让\
  \ Apache 这样做性能更高。Apache 支持通过以下指令通过虚拟路径包含文件：\n\n```html\n<!--include virtual=\"/cgi-bin/environment\"\
  />\n\n```\n\n遗憾，PHP 无法处理这种情况。但不要绝望：只要 PHP 是作为 Apache 模块安装的，就可以用 PHP 模拟这种行为。列表 37.5\
  \ 显示了完整的示例，假设 Perl 脚本位于 `/cgi-bin/environment.pl` 且 Perl 安装正确。\n\n```html\n<html>\
  \ \n<head> \n  <title>Environment Variables</title> \n</head> \n<body> \n<h1>Perl\
  \ provides the following information:</h1> \n<pre>  \n```\n\n```php\n<?php \n  virtual(\"\
  /cgi-bin/environment.pl\"); \n?>  \n```\n\n```html\n</body> \n</html>  \n```\n\n\
  **列表 37.5** 通过 PHP 调用 Perl 脚本（\"virtual.php\"）\n\n### 37.2.5 终止 Apache 进程\n\n作为最后一个示例，这里有一个高级应用程序的建议。如果你有一个非常消耗资源的脚本，在使用\
  \ Apache 时，最好之后终止 Apache 进程以便尽快释放宝贵的资源。幸运的一点是你也可以用 PHP 实现这一点。调用 `apache_child_terminate()`\
  \ 函数会终止当前的 Apache 子进程。别担心：这不会终止 Apache 本身，而只是许多进程中的一个。\n\n### 注意\n\n此指令仅在 `php.ini`\
  \ 中将 `child_terminate` 关设置为 `On` 时可用。\n\n# 38 Composer\n\nPHP 功能强大，但如果没有外部库，它通常没有用处。Composer\
  \ 软件包和依赖管理器使得使用变得简单。\n\n\n\n\n在使用用 PHP 编写的库时，一个常见的问题是：我该如何安装它们？通常情况下，这过去意味着寻找并阅读文档，然后希望该库也能适用于本地系统。然而，对于大多数软件来说，这已经是过去式了，因为\
  \ `Composer` 自 2012 年起就存在了。这是一个由 Nils Adermann 和 Jordi Boggiano（以及许多其他开源爱好者）开发的程序，它也可以用于解决依赖关系。它可以通过命令行安装许多\
  \ PHP 库，包括任何其他需要的包。本章将向你介绍基础知识。\n\n## 38.1 安装 Composer\n\nComposer 的首页地址为 [`getcomposer.org`](https://getcomposer.org)（参见图\
  \ 38.1）。除了通用文档外，还有安装说明。具体步骤取决于操作系统。\n\n在带有 `curl` 的系统上（即默认情况下除 Windows 以外的所有系统）上，运行以下命令即可在系统上安装该管理器：\n\
  \n```\ncurl -sS https://getcomposer.org/installer | php  \n```\n\n当然，也可以从指定的 URL\
  \ (https://getcomposer.org/installer) 手动下载数据并让 PHP 执行它 (`php -f name-of-downloaded-file`)。原则上，安装程序会以\
  \ PHAR 格式下载 `Composer`[[ 152 ]](footnotes.html#ftn-fn38_01) 并创建一个名为 `composer` 的可执行脚本，可用于运行包管理器。\n\
  \n![Composer 首页](img/img-f38.1.html)\n\n**图 38.1** Composer 首页\n\n这种方法在 Windows\
  \ 下也是可行的，但更加简单：在 [`getcomposer.org/Composer-Setup.exe`](https://getcomposer.org/Composer-Setup.exe)\
  \ 有一个 Windows 安装程序，它会加载最新版本的 `Composer` 并自动设置 `PATH` 环境变量，以便你可以直接从命令行提示符调用 `composer`。安装程序会检查一些\
  \ PHP 设置，包括是否安装了 OpenSSL 扩展，这通过 HTTPS 下载数据是必要的。如果没有安装，根据需要会自动调整 `php.ini`（参见图 38.2）。对于交付状态下的\
  \ PHP 安装，目前的设置如下：\n\n```\nextension=openssl\nextension=mbstring  \n```\n\n因此，在安装过程中，你还会被要求指定要使用的\
  \ PHP 安装位置（如果系统上有多个并行版本，这一点非常重要）。\n\n如果你在安装后可以在终端中运行 `composer`，无论什么种操作系统，都说明全局安装成功了（参见图\
  \ 38.3）。如果不是，请使用本地变体。要这样做，请搜索 `composer.phar` 文件并尝试以下调用：\n\n```\nphp composer.phar\
  \  \n```\n\n![Composer 的 Windows 安装程序](img/img-f38.2.html)\n\n**图 38.2** Composer\
  \ 的 Windows 安装程序\n\n![Composer 安装成功。](img/img-f38.3.html)\n\n**图 38.3** Composer\
  \ 安装成功。\n\n## 38.2 通过 Composer 安装包\n\n这可能是使用 `Composer` 安装包最快的方法：\n\n```\ncomposer\
  \ require \"aws/sdk-php\"\n```\n\n这会安装适用于 Amazon 云平台的 PHP SDK 的最新版本。这里是一些更具体的示例：\n\
  \n* `aws/sdk-php=3.0.0`: 精确版本 3.0.0\n* `aws/sdk-php=~3.0`: 至少版本 3.0.0，小于 3.1.0 的版本\n\
  * `aws/sdk-php>=3.0.0`: 至少版本 3.0.0\n* `aws/sdk-php>3.0.0`: 比 3.0.0 高的版本\n* `aws/sdk-php<=3.0.0`:\
  \ 最多版本 3.0.0\n* `aws/sdk-php<3.0.0`: 小于 3.0.0 的版本\n* `aws/sdk-php³.0.0`: 至少版本 3.0.0，小于\
  \ 4.0.0（因为 API 可能会变化；推荐用于依赖项）\n\n可能版本的完整列表可以在在线手册 [`s-prs.co/v60256`](http://s-prs.co/v60256)\
  \ 中找到。但回到安装：AWS SDK 使用几个组件。`Composer` 知晓这一点并会自动安装它们。图 38.4 显示了设置过程：在下载 SDK 之前会下载其他组件。\n\
  \n![通过 Composer 安装 AWS SDK—包括依赖项！](img/img-f38.4.html)\n\n**图 38.4** 通过 Composer\
  \ 安装 AWS SDK——包括依赖项！\n\n通过这种方式，你可以手动在系统上设置和安装组件。当然，如果可以将需要哪些外部库和包的信息存储在内部会更好。显然，如果可以将需要哪些外部库和包的信息存储在内部会更好。这可以通过一个\
  \ `composer.json` 文件来实现。它包含了所需的包并使用 JSON 格式，例如：\n\n```json\n{\n    \"require\":\
  \ {\n        \"aws/sdk-php\": \"³.27\"\n    }\n}\n```\n\n所有可能的版本可以在在线手册 [`s-prs.co/v60256`](http://s-prs.co/v60256)\
