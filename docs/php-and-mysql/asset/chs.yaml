  \n**图 19.10** 最后插入过程的 ID\n\n### 事务\n\n虽然起初需要了一段时间，但 MySQL 已经支持事务一段时间了。[[ 113 ]](footnotes.html#ft113)（注：原文存在重复，我将保持核心逻辑）。\n\
