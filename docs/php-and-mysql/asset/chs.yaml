  \ \n\n**图 19.14** 插入后，出现编辑链接\n\n### 19.3.3 输出数据\n\n对于数据的输出，我们有许多读取结果列表的函数供选择；我们选择了`mysqli_fetch_object()`。一个特殊之处是日期的输出，它是通过几个步骤完成的。MySQL\
