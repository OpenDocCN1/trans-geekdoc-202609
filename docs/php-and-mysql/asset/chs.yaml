  database\" => \":memory:\",\n  ]\n);  \n```\n\n正如你所见，后台使用的驱动（顺便提一下，它是负责与数据库进行实际通信的\
  \ `Zend_Db_Adapter_Pdo_Sqlite`）并没有显式指定。\n\n`vendor/laminas/laminas-db/src/Adapter/Adapter.php`\
  \ 文件解释了其工作原理。以下是代码节录：\n\n```\n$driverName = strtolower($parameters['driver']);\n\
  switch ($driverName) {\n    case 'mysqli':\n        $driver = new Driver\\Mysqli\\\
  Mysqli($parameters, null, null, $options);\n        break;\n    // ... \n    case\
  \ 'pdo':\n    default:\n        if ($driverName == 'pdo' || strpos($driverName,\
  \ 'pdo') === 0) {\n            $driver = new Driver\\Pdo\\Pdo($parameters);\n  \
  \      }\n}  \n```\n\n因此，`Driver\\Pdo\\Pdo` 驱动的创建时，我们的代码并没有显式请求甚至不知道该类的存在。严格来说，这并不是一个工厂，因为没有使用工厂方法，但其原理是显而易见的（且具有可比性）。\n\
