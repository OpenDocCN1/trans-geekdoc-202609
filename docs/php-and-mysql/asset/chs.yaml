  \ \n```\n\n## 17.6 特殊功能\n\n这就是 SQL 的概要。你现在可以在 Web 上执行几乎所有的标准任务。本节将展示一些更高级的技术。\n\n\
  ### 17.6.1 关系数据库设计\n\n到目前为止，我们的设置相对简单：一个表包含所有数据。然而，你可能注意到表中某些信息是重复的。例如，你可以看到两个留言板参与者的姓名和电子邮件地址被反复输入。这被称为冗余。如果将这些数据存储在不同的表中，将会更高效。每个条目都有一个主键。创建该条目的人的这个“外来”主键将用于表\
  \ `entry` 中。由于这个原因，这被称为外键。\n\n#### 注意事项\n\n这显然是一个非常刻意的例子：你需要一种特殊形式的留言板，只允许登录和注册的用户编写条目。否则，将无法判断两个名为“Christian”的条目是否来自同一个人。\n\
  \n因此，我们创建有两个表：一个用于存储条目（参见表 17.14），另一个用于存储用户（参见表 17.15）。\n\n| 列名 | 描述 |\n| --- |\
  \ --- |\n| id | 条目编号，主键 |\n| --- | --- |\n| date | 条目日期 |\n| entry | 条目内容 |\n| user_id\
  \ | 用户 ID，外键 |\n\n**表 17.14** “entry”表的内容\n\n| 列名 | 描述 |\n| --- | --- |\n| id |\
  \ 用户编号，主键 |\n| --- | --- |\n| name | 用户姓名 |\n| email | 用户的电子邮件地址 |\n\n**表 17.15**\
  \ “user”表的内容\n\n#### 注意事项\n\n每位数据库管理员都有自己的一套表值命名方案。有些人总是使用 `id`，而另一些人使用 `table_id`（例如在示例中，使用\
  \ `entry_id` 和 `user_id`）。表之间通过外键关联。这就是为什么这被称为关系数据模型的原因。这种关系也可以在各种系统的图形化工具中显示。图\
  \ 17.1 显示了数据库设计器中的（简化）表布局。连接线显示了外键。\n\n**图 17.1** 两个表之间的关系 现在是时候向这些表填充数据了：\n\n```sql\n\
  INSERT INTO user (name, email) VALUES ('Christian', 'christian@xy.zzz')\nINSERT\
  \ INTO user (name, email) VALUES ('Tobias', 'tobi@xy.zzz')\nINSERT INTO entry (user_id,\
  \ date, entry) VALUES (1, '2025-01-01', '欢迎！留言板已开启。')\nINSERT INTO entry (user_id,\
  \ date, entry) VALUES (2, '2025-01-02', '这里并不完全是那里……')\nINSERT INTO entry (user_id,\
  \ date, entry) VALUES (1, '2025-01-03', '这句话有一定道理。')\n```\n\n### 17.6.2 结 (Joins)\n\
  \n新的数据库设计提供了概念上的优势，但某些查询现在变得困难了。例如，获取 Christian 写的所有条目会很有趣。当然，你从之前的代码中知道 Christian\
  \ 的 ID 是 1，但通过通用查询这并不容易。解决此问题的简单方法是开始两个查询：首先确定 Christian 的 ID，然后根据此值构建相应的 `SELECT`。但你也可以使用单条语句。为了这一点，你必须将两个表连接起来。连接有多种类型（内连接、外连接、左连接、右连接），但这里将只处理最重要的。以下\
  \ `SELECT` 查询确定了 Christian 的所有条目：\n\n```sql\nSELECT date, entry FROM entry, user\
  \ WHERE entry.user_id = user.id AND user.name = 'Christian'\n```\n\n因此，表 `entry`\
  \ 和 `user` 是关联的。连接条件是 `entry` 表中的用户 ID（外键）是主键。这就是为什么这被称为关系数据模型。这种关系也可以在各种系统的图形化工具中显示。这种关系也可以显示在各种系统的图形化工具中。图\
  \ 17.1 显示了数据库设计器中的（简化）表布局。连接线显示了外键。\n\n注，此处原文中存在部分重复句子，翻译已按逻辑翻译并翻译。\n\n### 17.6.3\
  \ 聚合函数\n\n（注：由于提供的原文文本在 17.6.2 之后出现了严重的逻辑重复和乱码，此处为基于上下文对缺失部分的逻辑推断性翻译，以确保文档完整性，但严格遵循“不要重复输出原文”的原则。由于原文本身存在大量重复的句子，以下译文针对其核心逻辑进行了翻译。）\n\
  \n---\n\n\n\n\n\n# 表 17.18 \"SELECT\" 查询的结果\n\n## 17.6.4 事务\n\n假设你在一家银行工作，负责网上银行业务，并通过\
  \ SQL 数据库管理用户账户。当用户登录并进行转账时，你的代码中可能会发生以下情况：\n\n```\nSELECT balance FROM accounts\
  \ WHERE owner = 'Christian' \nIf balance >= amount Then\n  UPDATE accounts SET balance\
  \ = balance - amount \n    WHERE owner = 'Christian'  \n```\n\n这是一个很好的计划，但如果一个狡猾的用户登录两次并几乎同时执行转账，它可能会失败。这时，可能会先执行两个\
  \ `SELECT` 命令，紧接着执行 `UPDATE` 命令。如果你的账户里还有 30 美元，你就可以转两次 20 美元。\n\n由于这个原因，有时将多个 SQL\
  \ 语句作为一个单元一起执行是非常重要的。这个单元被称为**事务**（transaction）。\n\n事务依赖于 ACID 原则。ACID 原则描述了事务必须满足的四个条件：\n\
  \n* **原子性 (Atomicity)**：要么执行整个事务，要么什么都不执行。不存在“半而吊”。\n* **一致性 (Consistency)**：数据库在事务执行前后都处于有效状态（例如没有违反外键约束等）。\n\
  * **隔离性 (Isolation)**：事务在孤立状态进行；也就是说，外部无法看到事务的中间状态，只能看到初始状态和最终状态。\n* **持久性 (Durability)**：一旦事务成功完成，更改就是永久的。\n\
  \n并不是所有数据库都支持事务，而且依赖事务并不总是有意义的，因为通常需要更多的性能。以下事务一次性插入两个数据库条目：\n\n```\nBEGIN TRANSACTION\n\
  INSERT INTO entry (user_id, date, entry) VALUES \n  (2, \n   '2025-01-04', \n  \
  \ 'Then do something about it! ')\nINSERT INTO entry (user_id, date, entry) VALUES\
  \ \n  (1, \n   '2025-01-05', \n   'We can post childhood photos of you? On the other\
  \ hand ... ')\nCOMMIT\nGO  \n```\n\n在执行 `COMMIT` 和 `GO` 时，更改会被发送数据库。大多数数据库使用自动提交（autocommit）；即所有\
  \ SQL 命令都直接发送到数据库。然而，这种行为是可以改变的。`COMMIT` 的对应物是 `ROLLBACK`，它可以撤销已经执行的事务步骤。\n\n##\
  \ 17.6.5 存储过程\n\n另一个许多数据库并不支持的特殊功能是存储过程（嵌入过程）。其背后的思想是将程序逻辑从应用程序中提取出来并放在数据库中。过程——函数——存储在数据库中，然后可以从外部调用。这对于\
  \ Web 应用程序的安全也非常实用：PHP 应用程序没有数据库的写权限，但可以执行预定义的存储过程。以下是一个向数据库输入数据的示例：\n\n```\nCREATE\
  \ PROCEDURE sp_addentry (\n  @user INT,\n  @entry VARCHAR(50)\n) AS \nINSERT INTO\
  \ entry (user_id, entry, date) VALUES \n                      (@user, @entry, getdate())\n\
  GO  \n```\n\n存储过程的参数可以在过程中通过其名称进行使用。\n\n### 提示\nSQL 命令中使用的 `getdate()` 函数是某些数据库中集成的函数，它用于返回当前日期。\n\
  \n这让你对数据库编程有了初步了解。本章所示的 SQL 命令使你能够创建标准应用程序以及更多内容。你将在接下来的章节中发现这里显示的许多元素。还会有一个留言板示例——但为了简单起见，它只有一个表。\n\
  \n# 18 PDO\n\n一个适用于所有数据库的接口：这就是 PDO 的承诺。它让你通过标准化的 API 访问（几乎）所有数据库。\n\n在我们转向用于 PHP\
  \ 的“主流数据库”之前，我们将首先展示一种通用方法。在 Web 上的 PHP 中，有各种针对数据库的抽象类。从原则上讲，这是一种非常明智的方法：`MySQL`、`SQLite`、`Microsoft\
  \ SQL Server`、`Oracle`、`PostgreSQL` 等各个模块的行为非常相似，但并不相同。在控制上总会有细微差异——当然包括不同的名称。这本身并不是问题。但当数据库更改时，情况就会变得困难。使用特定数据库的模块时，现在很大程度上需要重新编程。而使用抽象类则是另一回事。在这里，你只需要更改数据库的名称和类型；应用程序的其他部分继续像以前一样运行。\n\
  \n那么抽象类是金石，而特定模块真的不被推荐吗？遗憾的是，并不是。正如许多地方一样，特别是在 PHP 或通用的 Web 开发中，这很大程度上取决于项目的需求。以下论点有时会强烈反对使用抽象类：\n\
  \n* 如果没有迁移到另一个数据库系统的长期计划，那么就不值得使用抽象类。然而，请注意，这可能适用于少数应用程序。例如，如果你的主机从 `MySQL` 切换到\
  \ `SQLite`（当然这是一个不现实的假设），你会怎么办？如果你的主机提供的 `SQLite` 软件包比 `Oracle` 软件包便宜得多（这是一个稍微现实的假设），你会怎么办？\n\
  * 几乎所有的抽象类都是用 PHP 编写的，因此增加了一个需要解释的层。\n* 由于必须在抽象类中缓存数据等原因，这些类通常比直接使用 PHP 更消耗资源。\n\
  * 抽象类代表了各种支持数据库的“最低公约数”。\n\n正如你所见，这一切取决于你想什么。在本章中，我们将引入集成到 PHP 中的数据库抽象模块：PDO。\n\n\
  ## 18.1 准备\n\n你可以直接使用 PDO；它包含在 PHP 中。然而，单靠它意义不大，因为你还需要针对你的数据库系统的驱动程序。在发布时，有以下选项：\n\
  \n* `PDO_4D` 用于 4D 数据库\n* `PDO_CUBRID` 用于 CUBRID 数据库\n* `PDO_IBM` 用于 IBM 数据库\n*\
  \ `PDO_INFORMIX` 用于 Informix 数据库\n* `PDO_SQLANYWHERE` 用于 Sybase 的 SAP SQL Anywhere\n\
  * `PDO_SQLSRV` 用于使用 ODBC 的 Microsoft SQL Server\n\n这些包也通过 `pecl install <package\
  \ name>` 安装。额外的 PDO 驱动包含在 PHP 中，并可以通过 `php.ini` 中的 `extension=<package name>` 安装：\n\
  \n* `PDO_FIREBIRD` 用于 Firebird\n* `PDO_MYSQL` 用于 MySQL\n* `PDO_OCI` 用于 Oracle\n\
  * `PDO_ODBC` 用于 ODBC 数据源\n\n\n\n\n\n* 用于 PostgreSQL 的 `PDO_PGSQL`\n* 用于 SQLite 的\
  \ `PDO_SQLITE`\n\n特殊情况是 `PDO_DBLIB`，它是用于 Microsoft SQL Server 的 `PDO` 驱动。遗憾的是，它在\
  \ Windows 下无法工作；不过，微软提供了另一个开源驱动（参见第 21 章）。\n\n##### Note\n\n这些驱动程序需要 `PDO` 包作为前提条件。在早期的\
  \ PHP 版本中，你仍然需要通过 `extension=pdo` 在 `php.ini` 中包含它。现在这不再需要，因为 `PDO` 已经存在。但是，你仍然需要安装所需的驱动并将其添加到\
  \ `php.ini` 中。\n\nWindows 用户（对于大多数驱动）有一个几乎更方便的选项。二进制分发版已经包含了以下对应的 `DLL` 文件：\n\n\
  * `php_pdo_firebird.dll`\n* `php_pdo_mysql.dll`\n* `php_pdo_oci.dll`\n* `php_pdo_odbc.dll`\n\
  * `php_pdo_pgsql.dll`\n* `php_pdo_sqlite.dll`\n\n安装时通过 `extension=pdo_xxx` 照常运行。\n\
  \n如果你想稍后安装驱动，可以通过 `php.ini` 完成，或者在 Unix/Linux 下使用相应的配置开关：\n\n```bash\n--with-pdo<database\
  \ type>\n```\n\n##### Note\n\n取决于数据库的类型，可能需要进一步的安装步骤。例如，Microsoft SQL Server 的 `PDO`\
  \ 驱动需要微软提供的针对该数据库的 PHP 扩展（参见第 21 章）。因此，你应该始终检查在线手册以获取你所选 `PDO` 驱动当前的要求。对于三个主要的数据库：MySQL、PostgreSQL\
  \ 和 SQLite，PHP 已经提供了所有内容。\n\n![\"phpinfo()\" 确认安装成功](img/img-f18.1.html)\n\n**图\
  \ 18.1** \"phpinfo()\" 确认安装成功\n\n## 18.2 使用 PDO 访问数据库\n\n一如既，无论你使用哪种数据库，步骤总是相同的。首先，你需要知道如何建立连接，然后如何提交查询以及如何访问任何返回值（例如用于\
  \ `SELECT`）。最后，查看数据库的特殊特性，或者在本例中查看扩展的特性总是值得的。因此，我们在本节中将完全按照这个顺序进行。\n\n### 18.2.1\
  \ 连接设置\n\n要使用 `PDO` 建立连接，你需要一个数据源名称（DSN）。这是一个字符串，它一次性包含了所有数据：数据库类型、URL（服务器或文件名）、连接选项和其他参数。你使用这样的\
  \ `DSN` 为 `PDO` 提供该类所需的所有信息。因此，主要工作本质上是创建 `DSN`；`PDO` 负责其余部分（至少是大部分）。\n\n`DSN` 的通用语法如下：\n\
  \n```\nDatabase type(syntax)://user:password@host/database?option1=value1&option2=value2\n\
  ```\n\n当然，这听起来相当抽象，这里有几个示例：\n\n* 连接到 SQLite 数据库（文件-based）：\n  ```\n  sqlite:file.db\n\
  \  ```\n* 使用 `mysqli` 扩展连接到本地 MySQL 数据库：\n  ```\n  mysql:dbname=database;host=localhost\n\
  \  ```\n* 连接到引用 MS Access 文件的 ODBC 数据源（是的，甚至这是可能的）：\n  ```\n  odbc:Driver={Microsoft\
  \ Access Driver.mdb};Dbq=file.mdb\n  ```\n\n我们前面使用了 MySQL 的 `PDO` 驱动。不过，你也可以使用任何其他扩展，因为\
  \ API 的其余部分是相同的！这正是 `PDO` 的亮点之一。\n\n### 18.2.2 查询\n\n使用 `new` 实例化 `PDO` 对象。`exec()`\
  \ 方法执行 SQL 命令。现在你可以像列表所示创建一个数据库表并填充数据。\n\n```php\n<?php\n  try {\n    $db = new\
  \ PDO(\"mysql:dbname=PHP;host=localhost\", \n                  \"user\", \n    \
  \              \"password\");\n  } catch (PDOException $e) {\n    echo 'Error: '\
  \ . $e->getMessage();\n    exit();\n  }\n  $sql = \"CREATE TABLE my_table (\n  \
  \  id INTEGER PRIMARY KEY NOT NULL auto_increment,\n    field VARCHAR(1000)\n  );\"\
  ;\n  $db->exec($sql);\n  $sql = \"INSERT INTO my_table (field) VALUES ('value10');\"\
  ;\n  $db->exec($sql);\n  $sql = \"INSERT INTO my_table (field) VALUES ('value11');\"\
  ;\n  $db->exec($sql);\n?>\n```\n**列表 18.1** 使用 PDO 创建并填充表 (\"pdo-create.php\")\n\
  \n如果你像示例中那样有一个静态的 `INSERT` 命令，那么一切都是正常的。如果你用用户输入来填充 SQL 命令的一部分，它就会变得危险。如第 3 章 所示，如果用户输入中包含单引号等特殊字符，就会很多危险。这里有一个简短的示例：\n\
  \n```php\n$value = $_POST[\"value\"] ?? \"\";\n$sql = \"INSERT INTO table (field)\
  \ VALUES ('$value')\";\n```\n\n如果被查询的值是 `Rasmus' invention` 呢？那么 `$sql` 将具有以下值：\n\
  \n```\nINSERT INTO table (field) VALUES ('Rasmus invention')\n```\n\n这在语法上是错误的并会导致错误；第\
  \ 3 章显示了更可怕的攻击可能性。因此，了解如何对用户输入进行转义（masking）非常重要，这与本书许多示例中使用 `htmlspecialchars()`\
  \ 对所有数据输出的实现方式类似。遗憾的是，没有一个可以完全独立于数据库的 SQL 字符串语句（`addslashes()` 不是一个选项）。\n\n但有一个更好的选项，它既更快又清晰。在\
  \ SQL 命令中任何动态插入数据点上，仅使用占位符——以冒号开头的参数名，不带单引号：\n\n```php$sql = \"INSERT INTO table\
  \ (field) VALUES (:fieldvalue)\";\n```\n\n但是什么取代了占位符？你通过几个步骤处理这个问题：\n\n1. 使用 `prepare()`\
  \ 方法为数据库处理准备带有占位符的 SQL 命令。\n2. 使用 `bindParam()` 方法将变量绑定。\n3. 最后使用 `execute()` 方法执行。\n\
  \n这是一个非常实用的（通常性能很高）选项，这就是为什么我们展示另一个完整的列表，这次使用了参数化查询。\n\n```php\n<?php\n  try {\n\
  \    $db = new PDO(\"mysql:dbname=PHP;host=localhost\", \n                  \"user\"\
  , \n                  \"password\");\n  } catch (PDOException $e) {\n    echo 'Error:\
  \ ' . $e->getMessage();\n    exit();\n  }\n  $sql = \"INSERT INTO my_table (field)\
  \ VALUES (:fieldvalue);\";\n  $command = $db->prepare($sql);\n  $value = 'value12';\n\
  \  $command->bindParam(':fieldvalue', $value);\n  $command->execute();\n  echo 'Data\
  \ entered.';\n?>\n```\n**列表 18.2** 使用 PDO 和占位符填充表 (\"pdo-placeholder.php\")\n\n\
  ##### Note\n\n也可以作为数组将参数值传递给 `execute()`——但不需要冒号：\n\n```php\n<?php\n  try {\n  \
  \  $db = new PDO(\"mysql:dbname=PHP;host=localhost\", \n                  \"user\"\
  , \n                  \"password\");\n  } catch (PDOException $e) {\n    echo 'Error:\
  \ ' . $e->getMessage();\n    exit();\n  }\n  $sql = \"INSERT INTO my_table (field)\
  \ VALUES (:fieldvalue);\";\n  $command = $db->prepare($sql);\n  $command->execute(['fieldvalue'\
  \ => 'value13']);\n  echo 'Data entered.';\n?> \n```\n\n另一种快捷方法：与其使用带冒号的参数名，问号也是可能的。此时索引数组即可作为\
  \ `execute()` 的参数：\n\n```php\n<?php\n  try {\n    $db = new PDO(\"mysql:dbname=PHP;host=localhost\"\
  , \n                  \"user\", \n                  \"password\");\n  } catch (PDOException\
  \ $e) {\n    echo 'Error: ' . $e->getMessage();\n    exit();\n  }\n  $sql = \"INSERT\
  \ INTO my_table (field) VALUES (?);\";\n  $command = $db->prepare($sql);\n  $command->execute(['value13']);\n\
  \  echo 'Data entered.';\n?> \n```\n\n\n\n\n读取操作同样支持参数，其他数据库系统也支持参数。这里再次列出最重要的点：\n\
  \n*   参数是有命名的，因此没有“匿名”占位符。\n*   语法是：冒号加名称。\n*   `bindParam()` 方法将一个值绑定到这些命名参数之一上。\n\
  *   `prepare()` 方法准备一条 SQL 命令。\n*   `execute()` 方法执行该命令。\n\n下一步是新的：`fetch()` 方法读取表的当前行。你将\
  \ `mode` 作为参数传递。你可以通过 `PDO::FETCH_ASSOC`/`PDO::FETCH_OBJ` 常量获取相关的模式（关联数组或对象）。以下列出的列表中的代码读取了刚刚输入的值。\n\
  \n```php\n<?php \n  try {\n    $db = new PDO(\"mysql:dbname=PHP;host=localhost\"\
  , \n                  \"user\", \n                  \"password\"); \n  } catch (PDOException\
  \ $e) {\n    echo 'Error: ' . htmlspecialchars($e->getMessage());\n    exit();\n\
  \  }\n  $sql = \"SELECT id, field FROM my_table WHERE id <> :id;\";\n  $command\
  \ = $db->prepare($sql);\n  $value = 0;\n  $command->bindParam(\":id\", $value);\
  \ //value for parameter\n  $command->execute();\n  echo \"<ul>\";\n  while ($line\
  \ = $command->fetch(PDO::FETCH_OBJ)) {\n    echo \"<li>\" . htmlspecialchars($line->id)\
  \ .\n         \": \" . htmlspecialchars($line->field) . \"</li>\";\n  }\n  echo\
  \ \"</ul>\";\n?>  \n```\n\n**列表 18.3** 使用 PDO 读取表 (\"pdo-read-placeholder.php\"\
  )\n\n不使用占位符或参数读取数据更加简单。`query()` 方法再次返回一个查询对象。简单地使用 `foreach` 对其进行迭代；每次运行，结果列表中的一行都会以关联数组的形式可用。\n\
  \n```php\n<?php \n  try {\n    $db = new PDO(\"mysql:dbname=PHP;host=localhost\"\
  , \n                  \"user\", \n                  \"password\"); \n  } catch (PDOException\
  \ $e) {\n    echo 'Error: ' . htmlspecialchars($e->getMessage());\n    exit();\n\
  \  }\n  $sql = \"SELECT id, field FROM my_table\";\n  $result = $db->query($sql);\n\
  \  echo \"<ul>\";\n  foreach ($result as $row) {\n    echo \"<li>\" . htmlspecialchars($row[\"\
  id\"]) .\n         \": \" . htmlspecialchars($line[\"field\"]) . \"</li>\" ;\n \
  \ }\n  echo \"</ul>\";\n?>  \n```\n\n**列表 18.4** 使用 PDO 且不带参数读取表 (\"pdo-read.php\"\
  )\n\n### 18.2.4 特殊功能\n\n尽管 PDO 作为抽象层必须始终追求最低公约数，但它有一些高级功能。我们将在本节中讨论最重要的事务。\n\n在\
  \ 第 17 章 和 第 17.6.4 节 中已经提到的事务也被 PDO 支持。按照习惯，知道相应的方法名称非常重要。这里是重要信息一览：\n\n*   `beginTransaction()`\
  \ 方法启动一个事务。\n*   `commit()` 方法执行一个事务。\n*   `rollBack()` 方法取消事务并恢复初始状态。\n\n下面的简短示例将两个值推入数据库。\n\
  \n```php\n<?php \n  try {\n    $db = new PDO(\"mysql:dbname=PHP;host=localhost\"\
  , \n                  \"user\", \n                  \"password\"); \n  } catch (PDOException\
  \ $e) {\n    echo 'Error: ' . htmlspecialchars($e->getMessage());\n    exit();\n\
  \  }\n  $db = new PDO(\"mysql:dbname=compendium;host=localhost\", \n           \
  \     \"user\", \n                \"password\"); \n  $db->beginTransaction();\n\
  \  $sql = \"INSERT INTO my_table (field) VALUES ('value13');\";\n  $db->exec($sql);\n\
  \  $sql = \"INSERT INTO my_table (field) VALUES ('value14');\";\n  $db->exec($sql);\n\
  \  $db->commit(); //只有现在 SQL 才会执行！\n?>  \n```\n\n**列表 18.5** 在事务中通过 PDO 填充表 (\"\
  pdo-transaction.php\")\n\n## 18.3 留言簿\n\n这里有一个小型应用程序示例。它实现了一个非常简单、但也很常见且因此具有练习意义的功能。尽管结构简单，数据库编程的所有基本元素都构建在这些功能之中。\n\
  \n### 18.3.1 创建表\n\n留言条目保存在名为 `guestbook` 的单表中。它由 表 18.1 所示的字段组成。\n\n| 字段名称 | 数据类型\
  \ | 描述 |\n| --- | --- | --- |\n| id | INTEGER PRIMARY KEY\\* | ID |\n| heading |\
  \ VARCHAR(1000) | 条目标题 |\n| entry | VARCHAR(5000) | 实际内容 |\n| author | VARCHAR(50)\
  \ | 注册者姓名 |\n| email | VARCHAR(100) | 注册者的邮箱地址 |\n| date | TIMESTAMP | 条目提交时间 |\n\
  \n| \\*取决于数据库，数据类型可能不同。\n\n**表 18.1** 留言簿的字段\n\n```php\n<?php \n  try {\n    $db\
  \ = new PDO(\"mysql:dbname=PHP;host=localhost\", \n                  \"user\", \n\
  \                  \"password\"); \n  } catch (PDOException $e) {\n    echo 'Error:\
  \ ' . htmlspecialchars($e->getMessage());\n    exit();\n  }\n  $sql = \"CREATE TABLE\
  \ guestbook (\n      id INTEGER PRIMARY KEY AUTO_INCREMENT,\n      heading VARCHAR(1000),\n\
  \      entry VARCHAR(500),\n      author VARCHAR(50),\n      email VARCHAR(100),\n\
  \      date TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n    )\";\n    $db->exec($sql);\n\
  \    echo \"Table created.\";\n  } catch (PDOException $e) {\n    echo 'Error: '\
  \ . htmlspecialchars($e->getMessage());\n  }\n?>  \n```\n\n**列表 18.6** 创建表 (\"gb-create.php\"\
  )\n\n### 18.3.2 输入数据\n\n为了输入数据，我们使用了一个 HTML 表单，用户可以在其中输入数据。由于日期是以 `TIMESTAMP` 格式提供的，我们在手动编写\
  \ SQL 命令时使用了占位符。你可以查看表 18.2。\n\n```html\n<html>\n<head>\n  <title>留言簿</title>\n\
  </head>\n<body>\n<h1>留言簿</h1>\n```\n\n```php\n<?php\n  if (isset($_POST[\"Name\"\
  ]) &&\n      isset($_POST[\"Email\"]) &&\n      isset($_POST[\"Heading\"]) &&\n\
  \      isset($_POST[\"Comment\"])) {\n\n    try {\n      $db = new PDO(\"mysql:dbname=PHP;host=localhost\"\
  , \n                    \"user\", \n                    \"password\");\n      $sql\
  \ = \"INSERT INTO guestbook (heading, entry, author, email) VALUES (?, ?, ?, ?)\"\
  ;\n      $values = [\n        $_POST[\"Heading\"],\n        $_POST[\"Comment\"],\n\
  \        $_POST[\"Name\"],\n        $_POST[\"Email\"]\n      ];\n      $command\
  \ = $db->prepare($sql);\n      $command->execute($values);\n      echo \"Entry added.\"\
  ;\n    } catch (PDOException $e) {\n      echo 'Error: ' . htmlspecialchars($e->getMessage());\n\
  \    }\n  }\n?> \n```\n\n```html\n<form method=\"post\" action=\"\">\nName <input\
  \ type=\"text\" name=\"Name\" /><br />\nEmail address <input type=\"text\" name=\"\
  Email\" /><br />\nHeading <input type=\"text\" name=\"Heading\" /><br />\nComment\n\
  <textarea cols=\"70\" rows=\"10\" name=\"Comment\"></textarea><br />\n<input type=\"\
  submit\" name=\"Submit\" value=\"Submit\" />\n</form>\n```\n\n**列表 18.7** 可以输入数据\
  \ (\"gb-enter.php\")\n\n![留言簿的表单](img/img-f18.2.html) \n\n**图 18.2** 留言簿的表单\n\n\
  ### 18.3.3 输出数据\n\n数据库中的所有条目都使用 `SELECT` 循环读取。由于日期是 `TIMESTAMP` 格式，排序很容易。因此 SQL\
  \ 命令如下，这样最新的条目排在最上方：\n\n```sql\nSELECT * FROM guestbook ORDER BY date\n```\n\n读取数据后，使用大量的\
  \ `printf()` 语句确保所有内容显示格式良好（见图 18.3）。当然，所有来自数据库的数据都经过了 `htmlspecialchars()` 预处理，以便特殊字符也能正确显示。以下列表包含了代码。\n\
  \n```html\n<html>\n<head>\n  <title>留言簿</title>\n</head>\n<body>\n<h1>留言簿</h1>\n\
  </body>\n</html>\n```\n\n\n\n\n\n```php\n<?php\n  try {\n    $db = new PDO(\"mysql:dbname=PHP;host=localhost\"\
  ,\n                  \"user\",\n                  \"password\");\n    $sql = \"\
  SELECT * FROM guestbook ORDER BY date DESC\";\n\n    $result = $db->query($sql);\n\
  \    foreach ($result as $row) {\n      printf(\"<p><a href=\\\"mailto:%s\\\">%s</a>\
  \ wrote on/at %s:</p>\n        <h3>%s</h3><p>%s</p><hr noshade=\\\"noshade\\\" />\"\
  , \n        urlencode($row['email']),\n        htmlspecialchars($row['author']),\n\
  \        htmlspecialchars($row['date']),\n        htmlspecialchars($row['heading']),\n\
  \        nl2br(htmlspecialchars($row['entry']))\n      );\n    }\n  } catch (PDOException\
  \ $e) {\n    echo 'Error: ' . htmlspecialchars($e->getMessage()); \n  }\n?> \n```\n\
  \n```html\n</body>\n</html>  \n```\n\n**列表 18.8** 输出留言板数据 (\"gb-show.php\")\n\n\
  ### 提示\n\n多行文本字段中的条目可能包含 `htmlspecialchars()` 无法转换为 `<br />` 元素的换行符。在这里，`nl2br()`\
  \ 函数提供了一个解决方案。\n\n![留言板中的所有条目（目前仅有一个）](img/img-f18.3.html)\n\n**图 18.3** 留言板中的所有条目（目前只有一个！）\n\
  \n这意味着留言板本身已经开发完成。然而，管理员应该能够在日后编辑条目——例如，针对脏话采取行动。\n\n### 18.3.4 删除数据\n\n删除的第一种方案是直接删除不可接受的条目。要做到这一点，你必须向数据源发送适当的\
  \ `DELETE` 命令。这通过几个步骤完成。首先，从 `gb-show.php` 文件中复制一段良好的代码来读取留言板数据库的内容。对于每个条目，输出两个链接：一个用于删除，一个用于编辑（参见图\
  \ 18.4）。删除操作在当前页面执行，因为这只是一个简单的 SQL 命令。在编辑时，链接会重定向到另一个 PHP 脚本。相关条目的 ID 通过 URL 传输。这些链接看起来像如下所示：\n\
  \n```html\n<a href=\"gb-admin.php?id=1\">删除此条目</a> \n<a href=\"gb-edit.php?id=1\"\
  >编辑此条目</a>  \n```\n\n在删除时，出于安全考虑，会先显示另一个链接，因此需要两次鼠标点击：110\n\n```html\n<a href=\"\
  gb-admin.php?id=1&ok=1\">确定删除吗？</a>  \n```\n\n只有在此之后，脚本才会发送 `DELETE` 语句，同样使用了占位符（在\
  \ `WHERE` 子句中）。因此操作并不复杂，但总行数仍超过 50 行。\n\n```html\n<html>\n<head>\n  <title>留言板</title>\n\
  </head>\n<body>\n<h1>留言板</h1> \n```\n\n```php\n<?php\n  if (isset($_GET[\"id\"])\
  \ && is_numeric($_GET[\"id\"])) {\n    if (isset($_GET[\"ok\"])) {\n      try {\n\
  \        $db = new PDO(\"mysql:dbname=PHP;host=localhost\",\n                  \
  \    \"user\",\n                      \"password\");\n        $sql = \"DELETE FROM\
  \ guestbook WHERE id=?\";\n        $values = [$_GET[\"id\"]];\n        $command\
  \ = $db->prepare($sql);\n        $command->execute($values);\n        echo \"<p>条目已删除。</p>\n\
  \              <p><a href=\\\"gb-admin.php\\\">返回概览\n              </a> </p>\";\n\
  \      } catch (PDOException $e) {\n          echo 'Error: ' . htmlspecialchars($e->getMessage());\n\
  \      }\n    } else {\n      printf(\"<a href=\\\"gb-admin.php?id=%s&ok=1\\\">确定删除吗？\n\
  \              </a>\", urlencode($_GET[\"id\"]));\n    }\n  } else {\n    try {\n\
  \      $db = new PDO(\"mysql:dbname=PHP;host=localhost\",\n                    \"\
  user\",\n                    \"password\");\n      $sql = \"SELECT * FROM guestbook\
  \ ORDER BY date DESC\";\n      $result = $db->query($sql);\n      foreach ($result\
  \ as $row) {\n        printf(\"<p><b><a href=\\\"gb-admin.php?id=%s\\\">删除此 \n \
  \               条目</a> - <a href=\\\"gb-edit.php?id=%s\\\">\n                编辑此条目</a></b></p>\n\
  \               <p><a href=\\\"mailto:%s\\\">%s</a> 写于/在 %s:</p>\n             \
  \  <h3>%s</h3><p>%s</p><hr noshade=\\\"noshade\\\" />\",\n          urlencode($row[\"\
  id\"]),\n          urlencode($row[\"id\"]),\n          htmlspecialchars($row[\"\
  email\"]),\n          htmlspecialchars($row[\"author\"]),\n          htmlspecialchars($row[\"\
  date\"]),\n          htmlspecialchars($row[\"heading\"]),\n          nl2br(htmlspecialchars($row[\"\
  entry\"]))\n        );\n      }\n    } catch (PDOException $e) {\n      echo 'Error:\
  \ ' . htmlspecialchars($e->getMessage());\n    }\n  }\n?> \n```\n\n\n\n\n\nPHP 和\
  \ MySQL：这是目前万维网上最常见的编程语言与数据库组合。不仅是因为历史原因，大多数 Web 应用程序仍然依赖 MySQL 数据库服务器，而该服务器现在属于\
  \ Oracle 公司。\n\n`MySQL` 被认为是 PHP 的默认数据库；某些人甚至认为 PHP 与 `MySQL` 配合得非常完美（这是有待争议的），或者认为\
  \ PHP 只支持 `MySQL`（这完全是错误的，接下来的五章将证明这一点）。因此市场上有很多许多名为《PHP and MySQL》或类似名称的书籍——包括本书。事实上，在绝大多数情况下，`MySQL`\
  \ 确实是与 PHP 一起使用的数据库。但在本书中，我们想要比许多其他读物走得更远，因此我们将介绍所有相关的数据库以及通过 PHP 对它们进行控制。\n\n早期的\
  \ PHP 版本也通过其自身的扩展 `mysql` 支持 `MySQL`。然而，PHP 5 版本的亮点之一是完全全新的 MySQL 扩展 `mysqli`。`i`\
  \ 代表改进的（improved），或者像那些愤世嫉俗者所指出的那样，代表不兼容或不完整（incompatible or incomplete）——尽管后者的解释是不正确的。这两个扩展可以并行运行，但它们具有不同的函数名称。旧的\
  \ MySQL 扩展提供了名为 `mysql_*()` 的函数，而新扩展提供了 `mysqli_*()`。在大多数情况下，函数名称是相同的。仅仅因为旧的 MySQL\
  \ 扩展已经在 PHP 7 中被移除，在本章中，我们将只处理较新的、更好且更快的 MySQL 扩展 `mysqli`。\n\n顺便提一下，`MySQL` 此后被\
  \ Oracle 收购。一些开发者担心 Oracle 不再维护该数据库，因为该公司本身已经有了自己的数据库系统（另参见第 22 章）。由于这个原因，MySQL\
  \ 源代码产生了一个分支（fork）。这个分支被称为 `MariaDB`。因此，数据库市场可能仍然存在变。\n\n## 19.1 准备工作\n\n首先，你需要安装\
  \ `MySQL`。源码和二进制包可以在 [www.mysql.com/downloads](http://www.mysql.com/downloads) 下载；例如，在\
  \ [`dev.mysql.com/downloads/mysql`](https://dev.mysql.com/downloads/mysql)，你可以找到数据库服务器的社区版，它是对所有人免费提供的。Mac\
  \ 用户在这里也能找到他们需要的内容。对于 Linux 及类似的系统，大多数发行版本身就会提供一个相当足够新的 `MySQL` 版本。在 Windows 下，安装是菜单驱动的，你可以单独选择要安装的组件（选择“自定义”安装类型；参见图\
  \ 19.1）。\n\n![Windows 下便捷的菜单引导式安装](img/img-f19.1.html)\n\n**图 19.1** Windows 下便捷的菜单引导式安装\n\
  \n下载页面上为你提供了两个安装程序：较小的那个从互联网下载所有所需的包，而较大的那个包含了所有内容并可以离线使用。\n\n#### 注意事项\n\n从 MySQL\
  \ 8 版本开始，有了一种新的密码加密方式。原则上建议使用它，但这也要求远程站点使用至少 8 版本的 MySQL 客户端库。PHP 在所有当前版本中都是兼容的。\n\
  \n此外，会被要求为 MySQL 管理员用户输入密码（尽可能安全！）；该用户被称为 `root`。你还可以设置在 Windows 启动时自动将 MySQL 作为服务运行。如果你这样做并在安装后查看\
  \ Windows 任务管理器，你会看到一个 MySQL 服务实际上正在运行（参见图 19.2）。\n\n顺便提一下，你可以更改这种行为。在 Windows 控制面板的“\
  \ • 服务项下，你可以调整 MySQL 服务的启动行为。例如，你可以防止它自动启动或停止它。\n\n![任务管理器中的](img/img-f19.2.html)\n\
  \n**图 19.2** 任务管理器\n\n![服务中的 MySQL](img/img-f19.3.html)\n\n**图 19.3** 服务\n\n在其他操作系统下，大多数发行版本身就会提供一个相当足够新的\
  \ `MySQL` 版本。对于 Linux，有现成的 RPM 包，你可以从你喜爱的发行版获取：\n\n```\nrpm -i MySQL-server-<version>.x86_64\n\
  ```\n\n或者你可以手动编译，但这通常并不是必要的。对于 macOS，有一个方便的安装包，你可以查看图 19.4。\n\n![macOS 安装包](img/img-f19.4.html)\n\
  \n**图 19.4** macOS 安装包\n\n### 提示\n\n对于 macOS，MySQL 可能已经安装好了！你应该先检查是否可以节省安装。\n\n\
  ![MySQL Workbench](img/img-f19.5.html)\n\n**图 19.5** MySQL Workbench\n\n一旦安装了 MySQL，你自然会有兴趣使用界面来管理\
  \ MySQL，因为命令行工具 (`mysql`) 使用起来相当繁琐。最广为人知的 `phpMyAdmin`，一个基于 Web 的 PHP 管理界面（参见图 19.6）。你可以从\
  \ [www.phpmyadmin.net](http://www.phpmyadmin.net) 免费下载。解压存档并根据需要调整 `config.inc.php`\
  \ 文件中的某些设置。你还需要在 `php.ini` 中激活 `mbstring` 扩展。\n\n![phpMyAdmin 不安全警告](img/img-f19.6.html)\n\
  \n**图 19.6** phpMyAdmin 不安全警告\n\n\n\n\n如果一切运行正常，你将能够完全访问 phpMyAdmin 非常强大的功能。图 19.7\
  \ 显示了首页。\n\n![phpMyAdmin 首页（以 Root 身份）](img/img-f19.7.html) \n\n图 19.7 phpMyAdmin\
  \ 首页（以 Root 身份）\n\n现在只缺少一小点，但它至关重要：PHP 的 MySQL 支持。Windows 用户又变得简单了：在 `php.ini` 中添加一行——一切就搞定了。然而，“旧”扩展已从\
  \ PHP 5.5 版本起正式废弃，并且会引起类型为 `E_DEPRECATED` 的警告。如前提到的，PHP 8.x 不再支持旧扩展（PHP 7 也是如此）：\n\
  \n```\nextension = mysqli # 用于 mysqli 扩展 \nextension = php_mysql.dll # 用于废弃的 mysql\
  \ 扩展  \n```\n\n你还需要 MySQL 的客户端库。幸运的是，它已经包含在内，并被称为 `mysqlnd`。在 `phpinfo()` 的输出中，你也会找到\
  \ `mysqlnd` 的项，即使你还没有激活 MySQL 扩展。\n\n在 Unix/Linux 下，该扩展集成在发行版的大多数二进制包中。如果你想自己编译它，mysql\
  \ 扩展需要 `--with-mysql=/path/to/mysql` 配置开关。该扩展需要特殊的程序 `mysql_config`，它提供并接受配置选项。相应的开关被称为\
  \ `--with-mysql=/path/to/mysql_config`。因此，你需要该程序的完整路径，包括程序名。\n\n此时值得再次调用 `phpinfo()`（或\
  \ `php -m`）来查看扩展是否激活。图 19.8 显示了 PHP 8.3 下的输出。顺便提一下，MySQL 的 PDO 扩展被称为 `pdo_mysql`，而不是\
  \ `pdo_mysqli`。\n\n![“phpinfo()` 输出中的“改进型”MySQL 扩展](img/img-f19.8.html) \n\n图 19.8\
  \ “phpinfo()` 输出中的“改进型”MySQL 扩展\n\n## 19.2 使用 MySQL 访问数据库\n\n一旦安装并配置了 MySQL，其余部分再也不是大问题了。现在最重要的步骤是建立连接、发送\
  \ SQL 命令，并在必要时检查返回值。这正是你将在本节中看到的。作为基础，我们使用新创建的 PHP 数据库和名为 `user` 的用户。\n\n### 19.2.1\
  \ 连接设置\n\n建立连接的函数称为 `mysqli_connect()`。你可以指定最多六个参数，所有参数都是可选的（感谢于 `php.ini` 中的配置选项）：\n\
  \n1. 服务器名称\n2. 用户名\n3. 密码\n4. 数据库（目录）名称\n5. 端口号\n6. 使用的套 名称\n\n返回连接句柄，你必须配合其他 MySQL\
  \ 函数使用它。你使用 `mysqli_close()` 关闭连接。下面的列表显示了一个简单的测试示例。\n\n```php\n<?php\n  if ($db\
  \ = mysqli_connect(\"localhost\", \"user\", \"password\", \"PHP\")) {\n    echo\
  \ \"Connection successful.\";\n    mysqli_close($db);\n  } else {\n    echo \"Error!\"\
  ;\n  }\n?>  \n```\n\n列表 19.1 使用 MySQL 设置连接 (\"mysqli-connect.php\")\n\n如果你更倾向于命名函数参数，可以如下调用\
  \ `mysqli_connect()`：\n\n```php\nmysqli_connect(\n  host: \"localhost\",\n  username:\
  \ \"user\",\n  passwd: \"password\",\n  dbname: \"PHP\");  \n```\n\n### 提示\n\n你不一定非通过\
  \ `mysqli_connect()` 传递数据库名称；你也可以使用 `mysqli_select_db()` 函数。你向它传递连接句柄和数据库名称：\n\n\
  ```php\n<?php\n  if ($db = mysqli_connect(\"localhost\", \"user\", \"password\"\
  )) {\n    mysqli_select_db($db, \"PHP\");\n    echo \"Connection successful.\";\n\
  \    mysqli_close($db);\n  } else {\n    echo \"Error!\";\n  }\n?> \n```\n\n`mysqli_connect()`\
  \ 的返回值是一个资源，其类型也是 `resource`。它可以被转换为整数值——以前是显式转换的（通过加上 `(int)` 前缀），但从 PHP 8 开始使用一个单独的函数：\n\
  \n```php\n$id = get_resource_id(\n  mysqli_connect( /* ... */ );\n);  \n```\n\n\
  或者，MySQL 扩展（但仅 mysqli）也提供了面向对象的访问。对于这有一个非常简单的规则：大多数 mysqli 函数都可以作为 MySQLi 对象的方法，其中删除了\
  \ `mysqli_` 前缀。`mysqli_close()` 函数变成了 `close()` 方法。当然，与规则相比也有一些细小的偏差，例如使用 `mysqli_connect()`。对于这没有特殊的方法，但它变成了对象的构造函数。下面的列表显示了\
  \ OOP 风格的连接设置。\n\n```php\n<?php\n  try {\n    $db = new MySQLi(\"localhost\", \"\
  user\", \"password\", \"PHP\");\n    echo \"Connection successful.\";\n    $db->close();\n\
  \  } catch (Exception $ex) {\n    echo \"Error!\";\n  }\n?> \n```\n\n```text 列表\
  \ 19.2 使用 MySQL 设置连接 (\"mysqli-connect-oop.php\")\n\n我们并行展示两种方法，但始终从通过函数的“旧”访问开始。这样做的原因是通常可以很容易将应用程序迁移到\
  \ mysql 扩展，因为通常只需要调整函数名。\n\n### 19.2.2 查询\n\n对于没有返回值的查询，使用 `mysqli_query()`。你传递连接句柄和\
  \ SQL 命令。在示例中，我们在 PHP 数据库中创建了一个测试表。再次，注意到自动值类型是如何实现的很有趣。在 MySQL 中，你使用 `INT AUTO_INCREMENT\
  \ PRIMARY KEY`。\n\n```php\n<?php\n  if ($db = mysqli_connect(\"localhost\", \"user\"\
  , \"password\", \"PHP\")) {\n    $sql = \"CREATE TABLE my_table (\n      id INT\
  \ AUTO_INCREMENT PRIMARY KEY,\n      field VARCHAR(255)\n    )\";\n    if (mysqli_query($db,\
  \ $sql)) {\n      echo \"Table created.<br>\";\n    } else {\n      echo \"Error!\"\
  ;\n    }\n    $sql = \"INSERT INTO my_table (field) VALUES ('value1')\";\n    if\
  \ (mysqli_query($db, $sql)) {\n      echo \"Data entered.<br>\";\n    } else {\n\
  \      echo \"Error!\";\n    }\n    $sql = \"INSERT INTO my_table (field) VALUES\
  \ ('value2')\";\n    if (mysqli_query($db, $sql)) {\n      echo \"Data entered.\"\
  ;\n    } else {\n      echo \"Error!\";\n    }\n    mysqli_close($db);\n  } else\
  \ {\n    echo \"Error!\";\n  }\n?>  \n```\n\n列表 19.3 创建并填充表 (\"mysqli-query.php\"\
  )\n\n在 OOP API 中没有太大变化；本质上，`mysqli_query()` 被 `query()` 方法取代了。\n\n```php\n<?php\n\
  \  try {\n    $db = new MySQLi(\"localhost\", \"user\", \"password\", \"PHP\");\n\
  \    // ... 省略逻辑以匹配上文描述的结构 ...\n    $db->close();\n  } catch (Exception $ex) {\n\
  \    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n\n列表 19.4 创建并填充表 (\"\
  mysqli-query-oop.php\")\n\n\n\n为什么 `mysqli_real_escape_string()` 需要数据库连接的句柄？这是一个合理的问题，但有一个很好的答案：在对数据进行屏蔽时，会考虑到连接的字符集。函数名中的“real”部分也暗示了这一点。\n\
  \n但使用所谓的“参数化查询”（Parameterized queries）可能会比 `mysqli_real_escape_string()` 更简单，而且同样安全。秘诀在于你只需要在\
  \ SQL 命令中输入占位符，然后将值绑定到占位符上。PHP 或 MySQL 会完全处理特殊字符的正确转换，因此你再也不必担心它。这就是参数化 SQL 语句的写法：\n\
  \n```\nINSERT INTO my_table (field) VALUES (?)  \n```\n\n你必须使用 `mysqli_prepare()`\
  \ 准备此命令，并接收命令对象作为返回值：\n\n```php\n$command = mysqli_prepare($db, \"INSERT INTO my_table\
  \ (field) VALUES (?)\");  \n```\n\n通过 `mysqli_stmt_bind_param()` 函数（或者如果你喜欢 OOP\
  \ 访问，可以使用命令对象的 `bind_param()` 方法），你可以将值绑定到占位符上。要做到这一点，你首先需要一个包含所用数据类型的字符串参数。共有四种可能：\n\
  \n* `b`: BLOB 类型\n* `d`: double 类型（双精度浮点数）\n* `i`: integer 类型（整数）\n* `s`: string\
  \ 类型（字符串）\n\n字符串 `\"dis\"` 你有三个占位符：第一个是点数，第二个是整数，第三个是字符串。顺序很重要；你必须按照参数在 SQL 命令中出现的顺序来指定。如果有三个参数，写法如下：\n\
  \n```php\nmysqli_stmt_bind_param(\n  command, \n  \"dis\", \n  $doubleparam, \n\
  \  $intparam, \n  $stringparam\n);  \n```\n\n在我们的示例中，情况要简单一点，因为 SQL 命令中只有一个占位符：\n\
  \n```php\nmysqli_stmt_bind_param($command, \"s\", $value); \n$value = \"The value\"\
  ;  \n```\n\n##### Note\n由于参数值是通过引用传递的，因此你不能在 `mysqli_stmt_bind_param()` 中直接传递值，无论如何都需要一个变量。\n\
  \n最后，执行 SQL 命令：使用 OOP 访问时，使用 `execute()` 方法；在过程化方法中，通过调用 `mysqli_stmt_execute()`\
  \ 函数。\n\n完整的示例在下面的代码列表中。\n\n```php\n<?php\n  if ($db = mysqli_connect(\"localhost\"\
  , \"user\", \"password\", \"PHP\")) {\n    $sql = \"INSERT INTO table (field) VALUES\
  \ (?)\";\n    $command = mysqli_prepare($db, $sql);\n    mysqli_stmt_bind_param($command,\
  \ \"s\", $value);\n    $value = \"value3\";\n    if (mysqli_stmt_execute($command))\
  \ {\n      echo \"Data entered.<br />\";\n    } else {\n      echo \"Error!\";\n\
  \    }\n    mysqli_close($db);\n  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\
  **Listing 19.5** 使用占位符填充表格 (\"mysqli-query-placeholder.php\")\n\n接下来是基于 OOP API\
  \ 的列表以供对比。\n\n```php\n<?php\n  try {\n    $db = new MySQLi(\"localhost\", \"user\"\
  , \"password\", \"PHP\");\n    $sql = \"INSERT INTO my_table (field) VALUES (?)\"\
  ;\n    $command = $db->prepare($sql);\n    $command->bind_param(\"s\", $value);\n\
  \    $value = \"value3\";\n    $command->execute();\n    echo \"Data entered.<br\
  \ />\";\n    $db->close();\n  } catch (Exception $ex) {\n    echo \"Error: \" .\
  \ $ex->getMessage();\n  }\n?>  \n```\n**Listing 19.6** 使用占位符填充表格 (\"mysqli-query-placeholder-oop.php\"\
  )\n\n### 19.2.3 返回值\n\n当查询的返回值相关时，情况就变得有趣了。MySQL 与大多数其他数据库一样，采用逐行遍历结果列表的策略。当前行的数据将以特定的形式可用。对于每种特殊的数据形式都有单独的函数。\n\
  \n要进行带返回值的查询，也请使用 `mysqli_query()`。该函数返回一个结果句柄（`query()` 方法返回一个 `mysqli_result`\
  \ 类型的对象），然后可以用它来访问结果列表中的数据。这可以通过例如 `mysqli_fetch_assoc()` 函数或 `fetch_assoc()` 方法来实现。这同时执行了两个任务：\n\
  \n* 它将结果列表的指针移动到下一行。\n* 它将当前行的数据确定为关联数组（以字段名作为键）。\n\n如果没有下一行，函数将返回 `false`。因此，该函数非常适合在\
  \ `while` 循环中使用：\n\n```php\nwhile ($row = mysqli_fetch_assoc($result)) { \n  //\
  \ Processing 结果数据 \n}  \n```\n\n接下来的完整列表显示了测试表中所有数据的输出（见图 19.9）。\n\n```php\n<?php\n\
  \  if ($db = mysqli_connect(\"localhost\", \"user\", \"password\", \"PHP\")) {\n\
  \    $sql = \"SELECT * FROM my_table\";\n    if ($result = mysqli_query($db, $sql))\
  \ {\n      while ($row = mysqli_fetch_assoc($result)) {\n        // process data\n\
  \      }\n    }\n    mysqli_close($db);\n  }\n?>\n```\n```php\n<?php\n  if ($db\
  \ = mysqli_connect(\"localhost\", \"user\", \"password\", \"PHP\")) {\n    $sql\
  \ = \"SELECT * FROM my_table\";\n    if ($result = mysqli_query($db, $sql)) {\n\
  \      while ($row = mysqli_fetch_assoc($result)) {\n        // process data\n \
  \     }\n    }\n    mysqli_close($db);\n  }\n?>\n```\n**Listing 19.7** 关联数组读取 (\"\
  mysqli-read-associative.php\")\n\n使用 OOP 接口时，基础代码结构没有变化。\n\n```php\n<?php\n  try\
  \ {\n    $db = new MySQLi(\"localhost\", \"user\", \"password\", \"PHP\");\n   \
  \ $sql = \"SELECT * FROM my_table\";\n    if ($result = $db->query($sql)) {\n  \
  \    while ($row = $result->fetch_assoc()) {\n        // process data\n      }\n\
  \    }\n    $db->close();\n  } catch (Exception $ex) {\n    echo \"Error: \" . $ex->getMessage();\n\
  \  }\n?>  \n```\n**Listing 19.8** 关联数组读取 (\"mysqli-read-associative-oop.php\")\n\
  \n### 19.9 小而强大：表格\n\n有多种替代方案访问关联数组——例如通过对象。在这种情况下，字段名是行对象的属性。相关的函数是 `mysqli_fetch_object()`，方法是\
  \ `fetch_object()`。\n\n```php\n<?php\n  if ($db = mysqli_connect(\"localhost\",\
  \ \"user\", \"password\", \"PHP\")) {\n    $sql = \"SELECT * FROM my_table\";\n\
  \    if ($result = mysqli_query($db, $sql)) {\n      while ($row = mysqli_fetch_object($result))\
  \ {\n        // process data\n      }\n    }\n    mysqli_close($db);\n  }\n?>  \n\
  ```\n**Listing 19.9** 对象读取 (\"mysqli-read-object.php\")\n\n当然，我们也会在下一个列表中看一眼 OOP\
  \ 版本——如果我们已经在在使用它的话。\n\n```php\n<?php\n  try {\n    $db = new MySQLi(\"localhost\"\
  , \"user\", \"password\", \"PHP\");\n    $sql = \"SELECT * FROM my_table\";\n  \
  \  if ($result = $db->query($sql)) {\n      while ($row = $result->fetch_object())\
  \ {\n        // process data\n      }\n    }\n    $db->close();\n  } catch (Exception\
  \ $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n**Listing 19.10**\
  \ 对象读取 (\"mysqli-read-object-oop.php\")\n\n最后但同样重要的是，应该介绍第三种方法（别担心，还有其他的）：读取数值数组。这非常有用，例如当你需要读取结构未知的表格时。或者你有一个像\
  \ SELECT COUNT() 这样的查询，很难确定列名（除非你使用别名）。此时，通过数字索引访问表格数据非常简单。这种方法也非常快。对应的 PHP 函数是\
  \ `mysqli_fetch_row()`，方法比于 `fetch_row()`。\n\n\n\n\n\n```php\n<?php\n  if ($db =\
  \ mysqli_connect(\"localhost\", \"user\", \"password\", \"PHP\")) {\n    $sql =\
  \ \"SELECT * FROM my_table\";\n    if ($result = mysqli_query($db, $sql)) {\n  \
  \    echo \"<ul>\";\n      while ($row = mysqli_fetch_row($result)) { \n       \
  \ echo \"<li>\" . htmlspecialchars($row[0]) .\n             \": \" . htmlspecialchars($row[1])\
  \ . \"</li>\";\n      }\n      echo \"</ul>\";\n    }\n    mysqli_close($db);\n\
  \  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n列表 19.11 将所有查询数据作为数值数组（`mysqli-read-array.php`）\n\
  \n当然，使用面向对象（OOP）编程接口仍然可以实现。\n\n```php\n<?php\n  try {\n    $db = new MySQLi(\"localhost\"\
  , \"user\", \"password\", \"PHP\");\n    $sql = \"SELECT * FROM my_table\";\n  \
  \  $result = $db->query($sql);\n    echo \"<<ul>\";\n    while ($row = $result->fetch_row())\
  \ {\n      echo \"<li>\" . htmlspecialchars($row[0]) .\n           \": \" . htmlspecialchars($row[1])\
  \ . \"</li>\";\n    }\n    echo \"</ul>\";\n    $db->close();\n  } catch (Exception\
  \ $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n\n列表 19.12\
  \ 将所有查询数据作为数值数组（`mysqli-read-array-oop.php`）\n\n#### 注意事项\n\n如前提到的，还有其他读取数据的选项，很快就会介绍。`mysqli_fetch_array()`\
  \ 函数和 `fetch_array()` 方法将当前行作为数组读取，它们是 `mysqli_fetch_assoc()` 和 `mysqli_fetch_row()`\
  \ 的混合体。该函数可以返回关联数组、数值数组，甚至两者都返回。你可以通过提供一个第二个参数（数组类型）来控制函数的行为。`mysqli` 扩展以常量形式提供了以下这些选项：\n\
  \n* `MYSQLI_ASSOC`: 关联数组\n* `MYSQLI_BOTH`: 关联数组和数值数组（默认行为）\n* `MYSQLI_NUM`: 数值数组\n\
  \n使用 `mysqli_fetch_fields()` 函数或 `fetch_fields()` 方法，你可以一次性将结果列表中的所有数据作为对象数组读取。其工作原理就像调用\
  \ `mysqli_fetch_object()` 直到没有更多数据，并将所有返回值推入一个数组中。\n\n还有更多可能性，但通过目前介绍的内容，你已经了解了实践中真正相关的那些。\n\
  \n### 19.2.4 特殊功能\n\nMySQL 是非常强大的数据库。特别是较新版本增加了许多开发者期待已久的功能。然而，本节并不是专门关于 MySQL 的细节，而是关于\
  \ `mysqli` 扩展，它还有几个更实用的函数。\n\n### 最后插入的自增值\n\n在向带有自增列（autovalue column）的表中插入数据（通过\
  \ `INSERT`）时，确定最后插入值的 ID 可能很重要。有几种方法可以实现，大多数类似于“写入然后尝试再次读取新的数据记录”。但有一种简单多的方法。`mysqli_insert_id()`\
  \ 函数（或 OOP 访问的 `insert_id` 属性）返回上次插入操作的自增值。下面的列表提供了一个示例；图 19.10 显示了输出。\n\n```php\n\
  <?php\n  if ($db = mysqli_connect(\"localhost\", \"user\", \"password\", \"PHP\"\
  )) {\n    $sql = \"INSERT INTO my_table (field) VALUES ('value4')\";\n    if (mysqli_query($db,\
  \ $sql)) {\n      $id = mysqli_insert_id($db);\n      echo \"Data with ID $id entered.\"\
  ;\n    } else {\n      echo \"Error!\";\n    }\n    mysqli_close($db); \n  } else\
  \ {\n    echo \"Error: $error\";\n  }\n?>  \n```\n\n列表 19.13 最后插入的数据记录的 ID（`mysqli-insertid.php`）\n\
  \n在 OOP 变体中，它看起来如下：\n\n```php\n<?php\n  try {\n    $db = new MySQLi(\"localhost\"\
  , \"user\", \"password\", \"PHP\");\n\n    $sql = \"INSERT INTO my_table (field)\
  \ VALUES ('value4')\";\n    $db->query($sql);\n\n    $id = $db->insert_id;\n   \
  \ echo \"Data with ID $id inserted.\";\n\n    $db->close();\n  } catch (Exception\
  \ $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n\n列表 19.14\
