  \ 13.2 使用 PHP 的表单\n\n许多人，尤其是微软的员工，都会自问：PHP 是如何获得如此惊人的市场份额的？这无疑有很多原因，但其中一个被经常提到：在开始，处理表单数据特别容易。\n\
  \n本书的作者还写了几本关于网络出版的更通用书籍，并在早期版本中引入了 Perl。以下是其中一本 2004 年书籍的节录，是一个用于访问并输出表单数据的 Perl\
  \ 脚本：\n\n```perl\n#!/usr/bin/perl \nprint \"Content-type: text/html\\n\\n\"; \n\
  if ($ENV{\"REQUEST_METHOD\"} eq \"POST\") { \n  read(STDIN, $data, $ENV{\"CONTENT_LENGTH\"\
  }); \n} else { \n  $data = $ENV{\"QUERY_STRING\"}; \n} \n@pairs = split(\"&\", $data);\
  \ \nforeach $pairs (@pairs) { \n  $pairs =~ tr/+/ /; \n  $pairs =~ s/%(..)/pack(\"\
  C\", hex($1))/eg; \n   ($name, $value) = split(\"=\", $pairs); \n  $form{$name}\
  \ = $value; \n} \nforeach $name (keys($form)) \n{ \n  print \"<b>$name: </b>$form{$name}<br\
  \ />\\n\"; \n}  \n```\n\n与原始代码相比，代码已经有所缩短。这个列表的问题在于，如果没有 Perl 知识，并不很难理解它。PHP 曾被视为\
  \ Perl 的竞争对手，特别是在早期，并且拥有一个强大的优势：它要简单得多。如今，Perl 在网络领域早已被 PHP 甩在身后。\n\n尽管如此，我们在此仍想为\
  \ Perl 辩护。我们过去经常使用它，特别是在以前。由于其强大的文本处理能力，Perl 通常被称为创造互联网的语言。\n\n以下通过简单地发送相应的表单（或在\
  \ URL 后附加数据），在 PHP 脚本中创建变量。\n\n```php\n<?php\n  echo \"Salutation: $Salutation<br>\"\
  ;\n  echo \"First name: $FirstName<br>\";\n  echo \"Last name: $LastName<br>\";\n\
  \  echo \"Email: $Email<br>\";\n  echo \"Promo code: $Promo<br>\";\n  echo \"Number\
  \ of tickets: $Number<br>\";\n  echo \"Section: $Section<br>\";\n  echo \"Comments:\
  \ $Comments<br>\";\n  echo \"Terms: $Terms<br>\";\n?>\n```\n\n通过简单地发送相应的表单（或在 URL\
  \ 后附加数据），在 PHP 脚本中创建变量。\n\n通过简单地发送相应的表单（或在 URL 后附加数据），在 PHP 脚本中创建变量。\n\n通过简单地发送相应的表单（或在\
  \ URL 后附加数据），在 PHP 脚本中创建变量。\n\n通过简单地发送相应的表单（或在 URL 后附加数据），在 PHP 脚本中创建变量。在下一步，我们将学习如何安全地处理这些数据。\n\
  \n\n\n\n\n因此，在经过长时间且充满争议的讨论后（PHP 发明者 Lerdorf 站在“维持现状”的一派），PHP 开发者决定进行一项更改：引入了一个配置选项来防止访问由表单数据生成的全局变量。这一功能在\
  \ PHP 5.5 中已被完全移除，幸运的是，不安全的短访问方式（为了满足记录者的需求；该选项名为 `register_globals`）已经不再可能实现。\n\
  \n在本书中，我们当然使用了另一种同样可靠有效的方法。我们依赖于包含表单数据的特殊可用数组。\n\n### 全局变量 vs. 超全局变量\n\n我们所讨论的数组被称为超全局数组（superglobal\
  \ arrays）。这到底是怎么回事？在早期的 PHP 版本中，已经存在了存储表单数据的数组：\n\n* `$HTTP_POST_VARS`\n* `$HTTP_GET_VARS`\n\
  * `$HTTP_COOKIE_VARS`\n* `$HTTP_SERVER_VARS`\n* `$HTTP_POST_FILES`\n\n这些数组是全局的，但仅限于主程序中。在函数内部，你必须使用\
  \ `global` 关键字手动将这些数组获取到全局上下文中：\n\n```\nfunction AnyFunction() { \n  global $HTTP_POST_VARS;\
  \ \n} \n```\n\n然而，超全局数组更进一步：它们在函数内部也是全局的——也就是说，是超全局的。因此，你在此不需要使用 `global`。\n\n不过，我们在书中未使用\
  \ `$HTTP_*VARS` 数组的主要原因不同：与全局表单数据（`$fieldname`）一样，这种模式从 PHP 5.5 起已不再可用。甚至在此之前，该功能也可以禁用；`php.ini`\
  \ 中的设置名为 `register_long_arrays`。\n\n### 13.2.2 HTTP 方法\n\n但当表单提交时到底发生了什么？在 `<form>`\
  \ HTML 元素中，`method` 属性至关重要。你在此处指定如何发送表单数据，通过 GET 或 POST 实现：\n\n* `method=\"get\"\
  `\n  表单数据将以简单的键值对的形式附加到 URL 中：\n  `http://server/script.php?Fieldname1=Fieldvalue1&Fieldname2=Fieldvalue2`\n\
  \  每个键值对由表单字段的名称（name 属性）、一个等号以及字段中的值组成。各个键值对之间用连符号（`&`）符号分隔。\n\n* `method=\"post\"\
  `\n  数据被转换回键值对，但它们是在 HTTP 请求体中发送的，且不会出现在地址栏中。\n\n### 注意\n\n如果未为 `method` 指定值，浏览器将自动使用\
  \ GET。\n\n#### POST vs. GET\n\n自然会产生一个问题：GET 还是 POST 更好？我们将列出这两种方式的一些优点和隐含缺点。\n\n\
  对于 GET：\n* 目标页面可以保存为书签/收藏。\n* 由于数据是可见的，有时调试更容易。\n* 目标页面可以被搜索引擎抓取（只要 URL 中的参数不是过多）。\n\
  \nPOST 的优点不言自明：\n* 表单数据不会出现在地址栏中。\n* 表单数据不会显示在历史记录中。\n* Web 服务器对 GET 有长度限制，但对 POST\
  \ 没有。\n* POST 请求不会保留在缓存中。\n* POST 通常用于发送数据。\n* `$_SERVER['PHP_SELF']` 变量包含当前脚本的路径。\n\
  * `$_SERVER['PHP_SELF']` 用于 `<form>` 标签的 `action` 属性中。\n\n\n\n\n访问文本字段的值非常简单：文本字段的值位于\
  \ `$_GET[\"Field\"]` 或 `$_POST[\"Field\"]` 中。文本字段一个特别棒的特性是，即使字段中没有输入任何内容，`$_GET[\"\
  Field\"]` 或 `$_POST[\"Field\"]` 总是被设置，因此可以省去 `isset()` 检查（前提是在其他地方已经检查过表单是否已提交）。尽管如此，进行检查仍然是一个良好的习惯。许多攻击者一直在寻找错误信息（因为这些信息会泄露很多内容——即使它们只提供了\
  \ PHP 文件的绝对路径），并且喜欢向脚本发送特制的（或空的）表单以查看会发生什么。产生错误信息的另一种方法是操控 HTTP 请求。通过这种方式，攻击者可以确保\
  \ `$_GET[\"Field\"]` 或 `$_POST[\"Field\"]` 是一个数组，而 `htmlspecialchars()` 无法应用于数组。这里也有简单的解决办法：首先使用\
  \ `is_string()` 检查字符字符串是否存在。\n\n### 注意\n大多数语义表单字段——例如 `<input type=\"email\">`、`<input\
  \ type=\"url\">` 等——行为与文本字段相似；即有一个字段名称和一个关联的值。\n\n列表 13.3 显示了输出文本字段内容的代码（另参见图 13.4）。对于文本和密码字段，这很简单，但多行文本字段有一个特殊功能：文本内部可以换行。这些可以使用\
  \ PHP 函数 `nl2br()` 正确转换。\n\n### 注意\n在使用 `nl2br()` 转换时，必须先使用 `htmlspecialchars()`，然后再将换行符替换为\
  \ `<br />`。原因是如果你反过来操作，你会先得到 `<br />`，然后由于 `htmlspecialchars()` 会得到字符 `&lt;br /&gt;`，这显然不是你想要的。\n\
  \n```html\n<body>\n<h1>Form Data</h1> \n```\n\n```php\n<?php\n  $Firstname = (isset($_POST[\"\
  FirstName\"]) && is_string($_POST[\"FirstName\"])) ? \n$_POST[\"FirstName\"] : \"\
  \";\n  $Lastname = (isset($_POST[\"LastName\"]) && is_string($_POST[\"LastName\"\
  ])) ? \n$_POST[\"LastName\"] : \"\";\n  $Email = (isset($_POST[\"Email\"]) && is_string($_POST[\"\
  Email\"])) ? \n$_POST[\"Email\"] : \"\";\n  $Promo = (isset($_POST[\"Promo\"]) &&\
  \ is_string($_POST[\"Promo\"])) ? \n$_POST[\"Promo\"] : \"\";\n  $Comments = (isset($_POST[\"\
  Comments\"]) && is_string($_POST[\"Comments\"])) ? \n$_POST[\"Comments\"] : \"\"\
  ;\n  $Firstname = htmlspecialchars($Firstname);\n  $Lastname = htmlspecialchars($Lastname);\n\
  \  $Email = htmlspecialchars($Email);\n  $Promo = htmlspecialchars($Promo);\n  $Comments\
  \ = nl2br(htmlspecialchars($Comments));\n  echo \"<b>First name:</b> $Firstname<br\
  \ />\";\n  echo \"<b>Last name:</b> $Lastname<br />\";\n  echo \"<b>Email:</b> $Email<br\
  \ />\";\n  echo \"<b>Promo:</b> $Promo<br />\";\n  echo \"<b>Comments:</b> $Comments<br\
