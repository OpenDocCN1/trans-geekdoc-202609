  ![安装成功完成](img/img-f2.28.html) \n\n**图 2.28** 安装成功完成\n\n要安装新包，请在命令提示符/控制台中使用 `pear`\
  \ 命令。不带任何选项输入命令可以查看所有可能的输入。如果你想立即尝试，只需安装一个包即可。为此，请进入命令提示符，然后进入 PHP 目录 —— 例如，`C:\\\
  php`。然后输入以下行：\n\n```\npear install XML_SVG  \n```\n\n这将安装 `XML_SVG` PEAR 包（请参见图\
  \ 2.29）。\n\n![安装过程顺利](img/img-f2.29.html) \n\n**图 2.29** 安装过程顺利\n\n`pear` 命令非常强大。只需在命令提示符中输入它而无需添加任何后缀。你将收到一个所有选项的列表。我们在这里简要介绍其中一些选项：\n\
  \n*   PEAR 安装使用所谓的“通道”（channels）来分发内容。在安装后，使用 `pear channel-update pear.php.net`\
  \ 获取当前的 PEAR 通道。通过通道，其他库也可以使用 PEAR 安装程序。\n*   如果你想安装一个尚未达到 Final（最终）状态的 PEAR 包，可以将状态指定为一个开关。最常用的开关是\
  \ `-alpha` 和 `-beta`。\n*   使用 `--alldeps` 开关（请参见图 2.30），你可以下载所有依赖包。`onlyreqdeps`\
  \ 只下载必要的包：\n\n```\npear install --alldeps HTML_CSS \n```\n\n![依赖包也已安装，但对（仍）不稳定或过旧的包显示了一些警告](img/img-f2.30.html)\
  \ \n\n**图 2.30** 依赖包也已安装，但对（仍）不稳定或过旧的包显示了一些警告\n\n*   你可以使用 PEAR 命令更新现有包并搜索特定的包。只需在命令提示符中输入\
  \ `pear`，然后跟 `upgrade package name`。要进行搜索，使用 `pear search` 然后加上搜索词。\n\n这些解释特别是为了提供通用的理解，并解释为什么在\
  \ Linux 安装等情况下提到了 PEAR。然而，对于书中的其他内容，并不是都是都需要 PEAR（在第 32 章 中有一个小例外）。\n\n### 注意\n\n\
  PEAR 曾经有过第二次身，称为 PEAR2。它依赖于一个名为 `Pyrus` 的新 PEAR 安装程序。然而，这项工作现在完全停止，首页也已关闭。\n\n##\
  \ 2.2.2 无安装的 PEAR 包\n\nPEAR 包是 PHP 文件，因此并不一定安装。你也可以将相应的包直接放在 Web 服务器的目录中，并仅通过 `require_once\
  \ \"path/package\"` 包含它们。所需的步骤可以在 PEAR 手册 ([`s-prs.co/v602209`](http://s-prs.co/v602209))\
  \ 中找到。\n\n### 注意\n\n在 [`s-prs.co/v602209`](http://s-prs.co/v602209) 中，你会找到这些步骤。\n\
  \n\n\n\n\n代理服务器是互联网上的一台计算机，所有的网络流量都通过它运行（前提是你已经设置了服务器）。然而，你不需要（无法）通过此中间节点查询你的本地\
  \ Web 服务器。因此，请查看你的代理设置，并在必要关闭用于本地连接的中间计算机。通常情况下，操作系统的全局代理设置是一个很好的基础，但根据浏览器的不同，那里也有相应的选项：\n\
  \n*   在 Safari 中，你可以通过偏好设置 • 高级 • 代理服务器 • 更改设置访问系统配置（参见图 3.4）。\n*   Firefox 用户请前往工具\
  \ • 设置 • 网络设置 • 设置（参见图 3.5）。\n*   在 Chrome 中，前往设置 • 系统 • 打开您计算机的代理设置。\n\n    ![针对本地地址不使用代理服务器](img/img-f3.4.html)\
  \ \n    **图 3.4** 本地地址不使用代理服务器\n\n    ![在 Firefox 中部分禁用也有效](img/img-f3.5.html) \n\
  \    **图 3.5** 在 Firefox 中部分禁用也有效\n\n### 3.1.4 无法初始化模块\n\n如果在调用 CLI 时、错误日志中、甚至电脑的弹出窗口中出现“模块无法初始化”的消息，那么\
  \ PHP 的某个扩展之一存在问题。解决方案通常就在那里：例如，在图 3.6 中，你会看到一条关于模块选项不匹配的提示。这有时是因为编译选项不同（例如，debug\
  \ yes/no），但大多数是因为 PHP 版本不同。\n\n一个 PHP 扩展通常适用于多个 PHP 次要版本，因为 PHP 语言核心部分没有发生重大变化。然而，一旦发生这种情况，PHP\
  \ 就会报错。如果你安装了较新版本的 PHP 但没有重新编译某些扩展，或者在运行二进制发行版时没有用新模块版本覆盖旧版本，经常发生此错误。还要检查其他目录（如\
  \ Windows 的 Windows 和系统目录），查看是否存在旧版本。\n\n    ![API 版本不正确表示模块过旧](img/img-f3.6.html)\
  \ \n    **图 3.6** API 版本不正确表示模块过旧\n\n### 3.1.5 找不到模块\n\nPHP 解释器在第一次调用时可能会返回无法加载模块的错误消息，但你之前在\
  \ `php.ini` 的 `extensions` 下注释掉了或输入了该模块。在这里，你必须顺序检查以下内容：\n\n*   模块或扩展是否存在于 `ext`\
  \ 文件夹中？问题可能是，例如，该模块仅包含在单独提供的 PECL 包中。\n*   `php.ini` 中的扩展路径是否设置正确（使用指令 `extension_dir`）？图\
  \ 3.7 显示了找不到某个扩展（顺便说，是控制数据库的那个，你将在第 22 章中学习）的消息。然而，你知道文件确实存在。那么有两种可能：\n    *   PHP\
  \ 解释器或 Web 服务器没有该扩展的访问权限。\n    *   扩展具有依赖项，例如额外的库。\n\n    ![找不到（或无法加载）模块](img/img-f3.7.html)\
  \ \n    **图 3.7** 找不到（或无法加载）模块\n\n在例中，情况是第二点：PHP 的库需要 Oracle 的客户端库才能运行。如果你使用的是 Windows，可以使用像\
  \ File Monitor 或来自 [www.sysinternals.com](http://www.sysinternals.com) 现已有的 Process\
  \ Monitor（它已被微软收购，但仍然免费）这样的程序为这些其他访问问题提供非常有用的服务，因为它显示了进程当前正在访问哪些文件。\n\n\n\n\n最常见的错误信息是内部服务器错误或\
  \ HTTP 错误代码 500（参见图 3.13），这意味着在脚本执行期间发生了错误，但错误文本未传输到网络浏览器。在这里唯一的帮助是查看系统错误日志——例如，Apache\
  \ 的 `error.log` 文件。\n\n![并不具体的含义：内部服务器错误](img/img-f3.13.html) \n\n**图 3.13** 并不具体的含义：内部服务器错误\n\
  \n### 3.1.10 缺少 VCRUNTIME140.DLL\n\n在 Windows 下，还有一个棘手的错误在等着你：系统提示缺少 `vcruntime140.dll`\
  \ 文件（请参见图 3.14）。事实上，在 [`windows.php.net/download`](http://windows.php.net/download)\
  \ 的下载页面，左侧有一个非常小的注释（需要向下滚动才能看到），说明你需要安装适用于 Visual Studio 2015 到 2022 的 Visual C++\
  \ 可发行组件。PHP 8.x 是使用 Visual Studio 2019 或 2022 编译器（取决于版本号）生成的。如果你没有该发行包，可以从微软 [`s-prs.co/v602210`](http://s-prs.co/v602210)\
  \ 获取。\n\n安装 32 位还是 64 位版本取决于你使用的是什么版本的 Windows，而是取决于你安装的是哪个版本的 PHP：如果你使用的是 32 位的\
  \ PHP，即使安装了 64 位的 Windows，也需要 32 位的发行包。\n\n对于早期的 PHP 版本，安装发行包也是必要的。然而，该错误在那里并没有发生得那么频繁，可能是因为其他软件已经安装了该发行包。\n\
  \n![Windows 用户可能需要从微软安装额外的程序包](img/img-f3.14.html) \n\n**图 3.14** Windows 用户可能需要从微软安装额外的程序包\n\
  \n### 3.1.11 浏览器中出现空白页\n\n如果 PHP 脚本在浏览器中没有产生任何输出，最可能是发生了错误，但服务器没有将此错误消息传递给客户端。在这种情况下，有几种方法可以发现原因：\n\
  \n*   在 `php.ini` 中，使用 `display_errors = On` 来确保错误消息传递到浏览器。这只建议在开发服务器上使用，因为详细的错误信息对“普通”用户没有意义。\n\
  *   通过在 `php.ini` 中指定 `log_errors = On` 在服务器上记录错误，然后定期检查日志文件。`error_log` 显示了这些文件的位置。\n\
  *   你也可以在操作系统的错误日志中找到你寻找的内容——例如，在 Windows 事件查看器中。\n*   如果你无法控制代码所在的服务器，请询问你的主机服务商是否以及如何访问日志文件。\n\
  *   使用浏览器开发者工具检查服务器是否发送了错误的 HTTP 状态码。\n\n### 3.1.12 扩展未出现在 phpinfo() 中\n\n如果扩展无法加载，浏览器中并不总会有错误消息。此时你会在操作系统的错误日志中找到更多信息，但直接从命令行运行\
  \ PHP 通常更快。\n\n图 3.15 显示了 `php.ini` 加载了 Oracle 扩展的系统上的结果，但由于缺少软件要求（Oracle Instant\
  \ Client，用于与数据库通信的客户端库）而失败了。“未找到”这一信息并不完全准确，但它指示了问题所在并解释了为什么 PHP 扩展没有出现在 `phpinfo()`\
  \ 的输出中。\n\n![错误消息立即显示在控制台中](img/img-f3.15.html) \n\n**图 3.15** 错误消息立即显示在控制台中\n\n\
  ## 3.2 额外资源\n\nPHP 有许多帮助来源。在 [php.net/support.php](http://php.net/support.php)，你将找到所有可能的来源的概述，包括在线手册\
  \ ([php.net/manual](http://php.net/manual)) 和若干邮件列表 ([php.net/mailing-lists.php](http://php.net/mailing-lists.php))。在后一个\
  \ URL 中，你甚至可以注册参与邮件列表（参见图 3.16）。你会收到一封带有订阅确认链接的确认邮件。然后你将在邮件列表中被激活（一种垃圾邮件保护措施）。\n\
  \n（注：此处原文存在大量重复句子，已按要求忽略）\n\n\n\n这种最后的形式在实践中一直并不常见，因为它涉及到大量的输入工作。这就是为什么它在 `PHP 7`\
  \ 中也被废弃了。\n\n所有类型的共同点是，它们都是 PHP 语句块。你可以在 HTML 页面中插入任意数量的 PHP 块。\n\n### 注意\n如果在 PHP\
  \ 页面中没有找到任何 PHP 语句，那么 PHP 解释器将直接输出 HTML 代码。\n\n### 4.1.1 注释\n注释是源代码中的文本，不会被 PHP\
  \ 解释器执行。在实践中，注释被用于解释代码部分或提供其他信息。PHP 使用的注释语法你可能已经从 JavaScript 或其他语言中了解过了：\n\n```php\n\
  // Comment  \n```\n\n这表示单行注释。`//` 之后的所有字符都会被注释掉。\n\n```\n# Comment  \n```\n\n这同样表示单行注释。\n\
  \n```\n/* Multiline \ncomment */  \n```\n\n这会注释掉 `/*` 和 `*/` 之间的块，该块可能跨越多行。\n\n\
  ### 注意\n在实践中，通常使用在起始注释字符旁边有两个星号的变体：`/** ... */`。这些基本上是普通的 PHP 注释，但它们为 `phpDocumentor`\
  \ ([`phpdoc.org`](https://phpdoc.org)) 进行了特殊标记。通过 `phpDocumentor`，你可以创建自动转换为 API\
  \ 文档的注释。\n\n### 提示\n以意义且易于理解的方式注释你的代码。想想那个必须继续维护该代码的可怜同事，或者想想你自己。几年之后，你会忘记这个脚本原本是做什么的。无论哪种情况，良好的注释都会让人感到高兴！\n\
  \n### 4.1.2 指令\nPHP 语句块中所有未被注释的字符共同组成了 解释器执行的 PHP 代码。PHP 中每行包含语句的行必须以分号结束：\n\n```php\n\
  <?php\n  echo \"Text\";\n?>  \n```\n\n例如，前面的语句输出一段文本。\n\n### 注意\n指令还包含了“表达式”（expression）这一术语。在\
  \ PHP 中，所有具有值的内容都是表达式。因此，大多数语句也是表达式。然而，这个定义相当学术化，对你的实际工作很少相关。\n\n### 4.1.3 外部文件\n\
  代码与内容的分离并不是 PHP 的原始意图之一，但可以通过外部文件来实现。[ 21 ]](footnotes.html#ftn-fn04_05) 外部文件在其他方面也很实用，它们还允许将常用的代码段外包。\n\
  \n要包含外部文件，请使用 `include()` 和 `require()`。这两个在错误处理的功能上有所不同。例如，如果未找到外部文件，`include()`\
  \ 只产生警告（`E_WARNING`），而 `require()` 则返回错误（`E_ERROR`）。这对于错误处理以及 `php.ini` 中的错误容忍配置设置特别为重要。[\
  \ 22 ]](footnotes.html#ftn-fn04_06)\n\n一个简单的示例说明了这两个语句是如何工作的。外部文件包含一个带有 `echo` 语句的输出：\n\
  \n```php\n<?php\n   echo \"External PHP File!\";\n?>  \n```\n\n**列表 4.1** 外部文件包含一个带有\
  \ `echo` 语句的输出：\n\n```php\n<?php\n   echo \"External PHP File!\";\n?>  \n```\n\n\
  ### 注意\n外部文件包含一个带有 `echo` 语句的输出：\n\n```php\n<?php\n   echo \"External PHP File!\"\
  ;\n?>  \n```\n\n### 提示\n外部文件包含一个带有 `echo` 语句的输出：\n\n```php\n<?php\n   echo \"External\
  \ PHP File!\";\n?>  \n```\n\n\n\n这两个陈述的区别在于，`echo` 仅仅输出传递过的内容，而 `print` 则返回一个返回值。\n\
  \n这个返回值可以写入变量（第 4.3 节）并被保存。如果输出成功，该值为 1。\n\n```php\n<?php\n  $t = print \"Output\"\
  ;\n  echo $t;\n?>  \n```\n**列表 4.3** \"print\" 的返回值（\"print.php\"）\n\n列表 4.3 打印了行：\n\
  \n```\nOutput\n```\n\n在实践中，返回值很少被使用。\n\n### 4.2.1 摘要\n\n如果你直接在 PHP 块的开始处输入一个等号，代码会更短：\n\
  \n```php\n<?=\"Short edition\"?>  \n```\n\n### 提示\n\n在 PHP 5.3 版本之前，必须将 `short_open_tags`\
  \ 设置为 `on` 才能使用短标签形式。从 5.4 版本开始，即使禁用了 `short_open_tags`，也可以使用 `<?=`。\n\n### 4.2.2\
  \ 引号\n\n由于输出是在引号中的，问题在于字符串中的引号是如何处理的。PHP 允许使用单引号和双引号来界定输出（或字符字符串）。\n\n因此，你可以写成\n\
  \n```php\necho \"Output\";\n```\n\n或者\n\n```php\necho 'Output';\n```\n\n若要使用双引号或单引号，你必须使用另一种类型的引号来界定输出：\n\
  \n```php\necho 'He said: \"I think, therefore I am!\"';\n```\n\n你可以在 图 4.2 中看到相应的输出。\n\
  \n![输出中的引号](img/img-f4.2.html)\n**图 4.2** 输出中的引号\n\n如果你想在字符串中使用单引号和双引号，必须使用反斜杠对相应的引号进行进行转义：\n\
  \n```php\necho 'McDonald\\'s eater: \"I love nothing!\"';\n```\n\n你可以在 第 4.3.4 节\
  \ 中阅读更多关于转义的知识。\n\n## 4.3 变量\n\n变量存储一个值。这个值在脚本过程中可以被改变，因此它是可变的，并为变量提供了名称。\n\n在 PHP\
  \ 中，所有变量都以美元符号（`$`）开头。与其他编程语言不同，PHP 不需要在使用变量第一次出现时对其声明。但当然，你必须给变量分配一个值。这可以通过等号（`=`），即所谓的赋值运算符来实现。因此，下面的代码将内容为\
  \ \"value\" 的字符字符串赋值给变量 `text`：\n\n```php\n$text = \"Value\";\n```\n\n### 4.3.1\
  \ 数据类型\n\n字符串始终写在引号中。然而，字符串并不是变量可以接受唯一的数据类型。PHP 区分区分以下数据类型：\n\n- `Integers`（`integer`\
  \ 和 `int`）是整数：\n```php\n$number = 8;\n```\n- `Double` 是浮点数的数据类型。Double 也包含整数：\n\
  ```php\n$comma = 8.4;\n```\n- `Real` 是 double 的另一个名称。\n- `Boolean`（`boolean` 或 `bool`）代表真值。Boolean\
  \ 只有 `true` 或 `false` 两个值。真值例如是条件检查的结果：\n```php\n$true = true;\n```\n- `object`\
  \ 代表 PHP 中的一个对象。你可以在 第 11 章 中找到更多相关信息。\n- `Arrays` 可以存储多个值，并且对编程非常重要。你可以在 第 8 章\
  \ 中阅读更多关于数组的知识。\n- `resource` 是 PHP 内部使用的数据类型，例如用于存储对源的访问。\n- `NULL` 不代表一个值，它本身就是一个数据类型。\n\
  \n在大多数情况下，你不需要担心数据类型，因为 PHP 会自动确定变量值的数据类型并在改变时对其进行转换。然而，自动类型转换并不总是按照预期或想要工作。因此，接下来的两个章节将展示如何确定变量的类型，然后如何更改它。\n\
  \n### 提示\n\n如果你想快速开始学习 PHP，只需跳过这些章节，等以后在应用程序中需要时再阅读即可。\n\n#### 确定数据类型\n\n通过 `gettype()`\
  \ 函数，你可以找到变量的数据类型。数据类型以长形式返回——例如，`boolean` 而不是 `bool`（参见 图 4.3）。\n\n```php\n$a =\
  \ \"Text\";\necho gettype($a);\n```\n**列表 4.4** 确定数据类型（\"datatype\"）\n\n### 注意\n\
  \n除了通用的 `gettype()` 函数，还有许多特定的测试函数（如 图 4.3 所示）：`is_bool()` 测试布尔值，`is_string()` 测试字符串，`is_numeric()`\
  \ 测试是否为数字，以此类推。返回的是布尔值：\n\n![输出中的引号](img/img-f4.2.html)\n**图 4.3** 输出中的引号\n\n####\
  \ 类型转换\n\n通常情况下，你不需要担心类型转换。PHP 使用 `.` 运算符来连接字符串，因此在 PHP 中是正确的：\n\n```php\n$a = \"\
  3\";\n$b = 5;\n$erg = $a . $b;\necho $erg;\n```\n**列表 4.5** 自动类型转换（\"typeconversion_auto\"\
  ）\n\n因此结果如下：\n\n```\n35\n```\n\n如果你确实需要类型转换，可以在 PHP 中使用类型强制转换：\n\n```php\n<?php\n\
  \  $a = \"true\";\n  $b = (bool) $a;\n  echo $b;\n?>\n```\n**列表 4.6** 使用 PHP 进行类型转换（\"\
  typeconversion\"）\n\n上述脚本的输出是真值 1：\n\n```\n1\n```\n\n作为替代，你可以使用 `settype()` 函数：\n\
  \n```php\n<?php\n  $a = \"true\";\n  $b = settype($a, \"boolean\");\n  echo $b;\n\
  ?>\n```\n**列表 4.7** settype()（\"settype\"）\n\n### 4.3.3 变量变量\n\n变量变量的概念是这样的：你给变量赋值一个字符串。你现在可以将这个变量作为另一个变量的名称。这创建了一个变量，其名称是第一个变量的字符串，其值是第二个变量的值（参见\
  \ 图 4.4）。\n\n\n\n\n\n```php\n<?php\n  $a = \"text\";\n  $$a = \"Text for output\"\
  ;\n  echo $text;\n?>  \n```\n\n**列表 4.8** 变量名作为变量 (\"variable\\_variables.php\"\
  )\n\n![变量被使用正确](img/img-f4.4.html) \n\n**图 4.4** 变量使用正确\n\n### 注意\n\n如果你想动态生成变量名，组合变量名将特别有用。\n\
  \n### 4.3.4 输出变量\n\n在目前为止的示例中，变量的值通常使用 `echo`（或者使用 `print`）输出。这可以没有任何问题地工作：\n\n\
  ```\n$text = \"Hello PHP 8\"; \necho $text;  \n```\n\n因此，这些行显示了以下内容：\n\n```\nHello\
  \ PHP 8  \n```\n\n然而，你也可以在字符字符串中输出变量：\n\n```\n$text = \"Hello\"; \necho \"$text\
  \ PHP 8\";  \n```\n\n这两行也产生了以下输出：\n\n```\nHello PHP 8  \n```\n\n但是，这只有在你使用双引号时才有效。如果使用单引号，变量将不会被包含（参见\
  \ 图 4.5）：\n\n```php\n$a = \"Hello\"; \necho '$a PHP 8';  \n```\n\n![由于使用了单引号，变量名为输出](img/img-f4.5.html)\n\
  \n**图 4.5** 由于使用了单引号，变量名被输出\n\n双引号和单引号之间的区别在变量变量时并不重要，对于转义序列也是如此。在转义序列中，字符使用反斜杠\
  \ (\\) 进行转义，或者转义序列产生某种特定效果。双引号和单引号在转义序列上的区别非常简单：\n\n- 对于单引号，你只能转义单引号以及在必要时转义反斜杠，正如你所看到的：\n\
  \  ```\n  echo 'McDonalds\\'I love!';\n  ```\n  如果你使用不同的转义序列，它将不会被执行而是直接输出。\n- 使用双引号时，你可以直接使用单引号，转义双引号，并使用一些转义序列：\n\
  \  ```php\n  $version = \"PHP 8\";\n  echo \"The variable has value:$version\";\n\
  \  ```\n  如果你看这个示例的输出，你会发现 `\\n` 没有被输出。这是因为 `\\n` 只在源代码中创建换行，而在 HTML 中不是。如果你在网络浏览器中查看源代码，你会识别出换行符：\n\
  \n  ```\n  The variable has value PHP 8\n  ```\n\n| 转义序列 | 说明 |\n| --- | --- |\n\
  | `\\\\` | 输出反斜杠。如果你只在它之后输出字符串，也可以达到相同的效果。 |\n| `\"` | 双引号。 |\n| `$` | 美元符号。 |\n\
  | `\\n` | 换行（ASCII 10），但在 HTML 中不是。你需要 `<br />` 标签来实现。 |\n| `\\r` | 回车（ASCII 13）。\
  \ |\n| `\\t` | 制表符（ASCII 9）。 |\n| `\\u` | 十进制形式的任何 Unicode 字符 (UTF-8)。 |\n| `\\\
  000` | 一到三位数字表示八进制表示法的数字。然后输出对应的字符。 |\n| `\\x00` | 一个 `x` 和一两个数字组成十六进制表示法的数字。八进制：八进制系统的基数是\
  \ 8。所有数字从 0 到 7。转换如下：`245` 变为 `2 × 6 + 4 × 8 + 5`，结果为 `165`。十六进制：十六进制系统以 16 为基础编写数字，这就是为什么有\
  \ 16 个字符——即从 0 到 9 以及字母 A 到 F。你这样转换一个两个位的十六进制数：将第一位乘以 16，并将第二位加到结果中。十六进制数常用于 HTML\
  \ 中的颜色表示。 |\n\n**表 4.1** 双引号的转义序列\n\n### 4.3.5 有用且有助于的信息\n\n本节包含了一些你在处理 PHP 时并不一定需要的信息，但对于高级任务很有用。\n\
  \n### \"isset()\"\n\n`isset(Variable)` 辅助函数检查变量是否存在。它返回一个布尔值作为结果。由于简单输出这个布尔值并不十分有趣，我们将稍微提前，展示一个将在下一章中更详细讨论的分类情况。\n\
  \n下面列表中的脚本检查变量是否存在。如果存在，则输出它；否则出现另一条消息。\n\n```php\n<?php\n  $test = \"Text variable\"\
  ;\n  if (isset($test)) {\n    echo $test;\n  } else {\n    echo \"Variable not set\"\
  ;\n  } \n?>  \n```\n\n**列表 4.9** \"isset()\" (\"isset.php\")\n\n在前面的示例中，变量被设置了，因此输出了。但如果你根本没有给变量赋值会怎样？\n\
  \n```php\n$test;\nif (isset($test)) {\n  echo $test;\n} else {\n  echo \"Variable\
  \ not set\";\n}\n```\n\n在这种情况下，备用文本变量未设置。\n\n### 注意\n\n如果变量的值为 `NULL`（无值），`isset()`\
  \ 也会返回假值。\n\n#### \"empty()\"\n\n`empty()` 执行与 `isset()` 相似的测试。`empty(Variable)`\
  \ 检查变量是否为空（参见 图 4.6` 的区别。\n\n```php\n<?php\n  $test = \"\";\n  if (empty($test))\
  \ {\n    echo \"Variable is empty\";\n  } else {\n    echo $test;\n  } \n?>  \n\
  ```\n\n**列表 4.10** \"empty()\" (\"empty.php\")\n\n![由于字符串为空，这里 \"empty()\" 返回字符串为\
  \ \"true\"](img/img-f4.6.html) \n\n**图 4.6** 这里 \"empty()\" 返回字符串为 \"true\"\n\n\
  ### 注意\n\n在 PHP 文档中，你会发现一个关于各种测试函数的相当有趣的比较表（[`www.php.net/manual/en/book.testing.php`](http://www.php.net/manual/en/book.testing.php)）。\n\
  \n`is_null(Variable)` 函数也是辅助函数之一。它测试变量是否为 `NULL`（无值）。\n\n```php\n<?php\n  $test\
  \ = null;\n  if (is_null($test)) {\n    echo \"Variable is NULL\";\n  } else {\n\
  \    echo \"Variable is not NULL, but\" . $test;\n  }\n?>  \n```\n\n**列表 4.11**\
  \ \"is\\_null()\" (\"is\\_null.php\")\n\n在前面的示例中，变量是空的，因此输出了以下：\n\n```\nVariable\
  \ is NULL\n```\n\n### 注意\n\nPHP 函数的拼写是不一致的。`isset()` 是连写的，而 `is_null()` 使用了下划线。这有历史原因：这些函数在某个时候就是这样命名的，为了保持脚本的向下兼容性，无法重命名。\n\
  \n#### \"unset()\"\n\n`unset(Variable)` 语言结构删除一个变量。你需要这个函数，例如当你想在主内存中释放空间时。\n\n\
  ```php\n<?php\n  $test = \"One variable.\";\n  echo $test;\n  unset($test);\n  echo\
  \ $test;\n?>  \n```\n\n**列表 4.12** \"unset()\" (\"unset.php\")\n\n#### 引用\n\n通常一个变量只有一个值。变量的值由\
  \ PHP 解释器存储在主内存中。然而，你也可以让多个变量引用同一个值。这通过和符号 (`&`) 来实现。它的工作原理如下：你创建一个变量，然后使用和符号将该变量的引用赋值给另一个变量。\n\
  \n\n\n\n```php\n<?php\n  $a = \"A variable\";\n  $b = &$a;\n  $a = \"Changed variable\"\
  ;\n  echo $b; \n?>  \n```\n\n**Listing 4.13** 变量引用 (`\"variable_reference.php\"\
  `)\n\n如果你更改了原始变量——在前面的示例中为 `$a`——那么带有引用的变量（在本例中为 `$b`）也会接收新值（参见图 4.8）。顺提一下，等号和 am&\
  \ 符号之间也可以有空格，或者将 am& 符号直接放在 `$a` 变量前面。\n\n![更改后的值输出为包含其引用的 \"$b\"](img/img-f4.8.html)\
  \ \n\n**图 4.8** 更改后的值输出为包含其引用的 \"$b\"\n\n### 4.3.6 预定义变量\n\n像 PHP 这样的语言不仅仅由语言核心组成。PHP\
  \ 周围有一个巨大的环境：HTML 表单、Cookie（即浏览器中的小型文本文件）以及更多。PHP 为这个环境提供了预定义变量，你将在本书的过程中了解它们。以下是选取：\n\
  \n* `$_GET` 包含通过表单的 `GET` 方法附加到 URL 的值。\n* `$_POST` 包含通过 `POST` 从表单发送的值。\n* `$_COOKIE`\
  \ 包含有关 Cookie 的信息。更多内容见第 12 章。\n* `$_REQUEST` 包含上述列出的三个变量的信息。你可以在第 12 章和第 13 章中阅读更多内容。\n\
  * `$_SESSION` 提供会话变量的数据。你可以在第 15 章中了解更多信息。\n* `$_SERVER` 包含关于 PHP 安装和 Web 服务器的信息。\n\
  * `$_ENV` 提供关于 PHP 运行环境的信息。\n* `$_FILES` 包含关于上传文件的数据。你可以在第 25 章找到相关信息。\n* `$GLOBALS`\
  \ 包含所有全局变量。你可以在第 6 章、第 6.1.2 节中了解更多。\n\n### 笔记\n\n这些预定义变量也被称为超全局数组，因为它们在 PHP 中随处可用。它们从\
  \ PHP 4.1.0 版本开始可用。在此之前，这些数组已经存在，但名称不同，且始终以 `$HTTP_` 开头——例如 `$HTTP_GET_VARS`。你可以在引用的章节中学习更多关于超全局数组。你将在第\
  \ 13 章中了解最重要的几个。\n\n## 4.4 常量\n\n常量与变量不同，始终具有相同的值，并在开始时定义一次。在 PHP 中，你使用 `const`\
  \ 关键字定义它，或者（较少见）使用 `define()` 函数：\n\n```\nconst constant = \"value\";\ndefine(\"\
  Constant\", \"Value\");  \n```\n\n可以使用其名称随时访问常量：\n\n```\necho constant;  \n```\n\
  \n这会输出它的值——在本例中，为字符串值。\n\n或者，你可以使用 `constant(Name)` 函数访问常量：\n\n```php\necho constant(\"\
  constant\");  \n```\n\n如果常量名仅作为引用传递，则使用此函数——例如存储在变量中或作为函数的参数：\n\n```php\n$Name =\
  \ \"Constant\";\nconstant($Name);\n```\n\n### 笔记\n\n与变量不同，常量没有 `$` 符号。此外，全局定义的常量应用于整个脚本。\n\
  \n# 5 编程\n\n不洗脸、长发的程序员的刻板印象当然是个传说……尽管如此，编程需要热情。它并不会阻止你去上厕所，但确实需要一些时间。\n\n在本章中，你将学习\
  \ PHP 的语法、最重要的语言结构以及基础知识。\n\n## 5.1 运算符\n\n运算符的主要任务是将数据连接在一起。被连接的数据被称为操作数。运算符可以处理一个、两个或三个操作数。最常见的情况是两个操作数。操作数可以是变量或字面量。以下是字面量的示例：\n\
  \n```\n   1       +       2\nOperand Operand\n```\n\n以及变量的：\n\n```\n   $a      +\
  \       $b\nOperand Operand\n```\n\n### 5.1.1 算术运算符\n\n加、减、乘、除：这些你在数学课上学过的算术操作。在\
  \ PHP 中非常容易使用。\n\n```php\n<?php\n  $a = 7;\n  $b = 3;\n  $result = $a + $b;\n  echo\
  \ $result;\n?>\n```\n\n\n\n根据这些行代码，变量 `$result` 的值为 16。第二个操作数总是指数；也就是说，此计算对应于 2⁴。\n\
  \n如往常地，它也可以用短形式表示：\n\n```php\n$result = 2; \n$result **= 4;  \n```\n\n## 连接字符串\n\
  \n在许多编程语言中，加号不仅用于连接数字，还用于连接字符串（参见图 5.1）。在 PHP 中情况并非如此。相反，使用了点（`.`）：\n\n```php\n\
  <?php\n  $a = \"Everything new \";\n  $b = \"May makes.\";\n\n  $result = $a . $b;\n\
  \  echo $result;\n?>  \n```\n\n**列表 5.2**     拼接字符串 (\"string\\_concatenation.php\"\
  )\n\n![两个字符串已连接](img/img-f5.1.html) \n\n**图 5.1**     两个字符串已连接\n\n### 注意\n\n连接字符串也称为拼接（concatenation）。字符串提供了许多其他可能性。你可以在第\
  \ 7 章中阅读更多内容。\n\n链接字符串的运算符也可以结合赋值运算符以短形式形式使用：\n\n```php\n$result = \"Everything\
  \ new \"; \n$result .= \"May makes\";\n```\n\n变量 `$result` 被赋予了值 \"Everything new\"\
  。\n\n## 5.1.2 比较运算符\n\n如果你使用 PHP 工作，经常会遇到需要比较两个值的情况。例如，在表单的完整性检查中，比较是否输入了某个值。\n\n\
  比较运算符负责比较。它们相互比较两个操作数：\n\n```\n   7        >       3\n操作数      运算符\n```\n\n结果是一个真尔值（Boolean）——即真或假。比较\
  \ `7 > 3` 的结果为真，因为 `7` 大于 `3`。PHP 以数字形式返回真尔值，在这种情况下 `true` 为 `1`；`false` 为 `0`。\n\
  \n### 注意\n\n如果你用 `echo` 输出比较运算符的结果，例如，输出 `true` 为 `1`，但 `false` 为 `0`。你可能已经熟悉大多数比较运算符了。表\
  \ 5.3 提供了概述。\n\n| 运算符 | 示例 | 描述 |\n| --- | --- | --- |\n| `>` | `$result = 7 > 3\
  \ //true` | 大于 |\n| `<` | `$result = 7 < 3 //false` | 小于 |\n| `>=` | `$result =\
  \ 3 >= 3 //true` | 大于等于 |\n| `<=` | `$result = 3 <= 3 //true` | 小于等于 |\n| `==` |\
  \ `$result = 7 == 3 //false` | 等于 |\n| `!=` | `$result = 7 != 3 //true` | 不等于 |\n\
  | `<>` | `$result = 7 <> 3 //true` | 不等于 |\n\n**表 5.3**   比较运算符\n\n### 注意\n\n最常见的错误之一是使用单等号而不是双等号进行相等性检查。这种错误很难检测，因为例如在\
  \ `if` 语句中，单等号被解释为赋值。这意味着 PHP 不会抛出错误而是将右部分赋值给左部分。这意味着 `if` 语句中的条件始终成立，除非结果为假。你可以在工作文件中找到赋值的例子。\n\
  \n## 精确相等与不相等\n\n如果你使用比较运算符进行相等和不相等判断（`==` 变为 `===`，`!=` 变为 `!==`），那么它们就变成了精确相等和精确不相等。\n\
  \n```\n$a = 3;\n$b = \"3\";\n$result = $a === $b;\n```\n\n$result 的值是多少？因为变量 `$a`\
  \ 是数字而 `$b` 是字符串，结果为假。如果你选择了简单相等而不是精确相等：\n\n```\n$result = $a == $b;\n```\n\n结果将为真。\n\
  \n## 比较字符串\n\n如果你想比较两个字符串，这是可能的，但充满了问题。字符串比较的基础是相应字符的 ASCII 码。这为最重要的字符和字母定义了一个数字（参见图\
  \ 5.2）。字母从 ASCII 码的 65 位置开始。然而，你不需要背下整个 ASCII 表就能预测字符串比较的结果。一些经验法则会有帮助：\n\n*   小写字母总是大大写字母，因为它们的\
  \ ASCII 码更高。\n*   大写字母按字母顺序从 65 到 90。\n*   小写字母按字母顺序从 97 到 121。\n*   字符串的字母从左到右比较。\n\
  \n几个例子说明了这些规则：\n\n```php\n$a = \"a\";\n$b = \"b\";\n$result = $a < $b;\n```\n\n\
  ![字符的 ASCII 表（参见 www.asciitable.com)](img/img-f5.2.html) \n\n**图 5.2**    字符的 ASCII\
  \ 表（参见 [www.asciitable.com](https://www.asciitable.com））\n\n通过这些行，变量 `$result` 接收到真值，因为小写的\
  \ `a` 的 ASCII 码比小写的 `b` 小。下一个例子结果为假：\n\n```php\n$a = \"a\";\n$b = \"B\";\n$result\
  \ = $a < $b;\n```\n\n原因是：大写的 `B` 的 ASCII 值比所有小写字母（包括小写的 `a`）都小。对于较长的字符串，PHP 从左到右比较：\n\
  \n```php\n$a = \"abzzz\";\n$b = \"acaaa\";\n$result = $a < $b;\n```\n\n在这个例子中，结果为真。解释器看到第一个数字相同，检查第二个，并注意到那里小写的\
  \ `b` 比 `c` 小。之后的数字不再起作用。\n\n如果两个字符字符串长度不同，比较仍然从左到右进行：因此 `Z` 大于 `A`。如果两个字符串中的字符相同，较长的字符串总是更大的：\n\
  \n```php\n$a = \"abc\";\n$b = \"abcde\";\n$result = $a < $b;\n```\n\n在这种情况下，`$b`\
  \ 大于 `$a`，因此结果为真。\n\n\n\n\n![现在字符串的比较不区分大小写](img/img-f5.3.html)\n\n**图 5.3** 现在字符串的比较不区分大小写\n\
  \n在实践中，这个简单的技巧通常与数组结合使用。PHP 了自己的一个名为 `sort()` 的函数来对数组进行排序：\n\n```\n$collection =\
  \ array(\"Monet\", \"Chagal\", \"Dali\", \"Manet\"); \nsort($collection);  \n```\n\
  \n如果你输出排序数组的第一个和最后一个元素，Chagal 和 Monet 的输出是正确的：\n\n```\necho \"$collection[0] and\
  \ $collection[3]\";\n```\n\n然而，只要数组中的元素一个以小字母开头，使用 `sort()` 就会失败（参见图 5.4）。\n\n![字母顺序不正确](img/img-f5.4.html)\n\
  \n**图 5.4** 字母顺序不正确\n\n作为解决方案，我们将正确排序的技巧与 `usort(Array, sort function)` 函数结合，它允许\
  \ `sort function` 比较数组的两个元素并根据比较结果返回 0（相等，参见图 5.5;\n\nusort($collection, \"sortFunction\"\
  );\n\nfunction sortFunction($a, $b) {\n  $a_low = strtolower($a);\n  $b_low = strtolower($b);\n\
  \  \n  if ($a_low == $b_low) {\n    return 0;\n  } elseif ($a_low > $b_low) {\n\
  \    return 1;\n  } else {\n    return -1;\n  }\n}\necho \"$collection[0] und $collection[3]\"\
  ;\n?>\n```\n\n**列表 5.4** 使用函数排序 (\"sort_function.php\")\n\n![即使有小字母，字母排序也是有效的](img/img-f5.5.html)\n\
  \n**图 5.5** 即使有小字母，字母排序也是有效的\n\n### 船形运算符\n\n船运算符不仅执行大于或小于简单的比较，还根据第一个操作数是小于（-1）、等于（0）还是大于（1）第二个返回结果。它优雅的名字来源于它的形状，因为船运算符看起来有点像船：`<=>`。这是\
  \ PHP 7 中的一个新功能。\n\n下面的列表提供了一个简单的示例（参见图 5.6）。\n\n```\n$a = 3; \n$b = 7; \n$result\
  \ = $a <=> $b; \necho $result;  \n```\n\n**列表 5.5** 船形运算符 (\"spaceship.php\")\n\n\
  ![\"-1\" 表示第一个操作数小于第二个](img/5.6) \n\n**图 5.6** \"-1\" 表示第一个操作数小于第二个\n\n### 5.1.3\
  \ 逻辑运算符\n\n使用比较运算符返回一个布尔值。重点在于一个。如果你想组合多个比较或多个布尔值，就需要逻辑运算符。\n\n对于两个布尔值，它看起来像这样：\n\
  \n```\ntrue     false\n操作数 运算符\n```\n\n在这种情况下，使用了逻辑与 `&&`。只有当两个操作数都为真时才返回 true。这就是为什么上一行返回\
  \ false。如果你使用两个比较，可以使用这样的逻辑运算符：\n\n```\n$result = 7 > 3 && 2 < 4;\n```\n\n这一行返回\
  \ true true，因为两个比较相应返回 true。\n\n**注意**\n你也可以组合多个逻辑操作。然而，我们建议使用括号来保持清晰度。表 5.4 提供了逻辑运算符的概述。\n\
  \n| 运算符 | 示例 | 描述 |\n| --- | --- | --- |\n| `&&` | `7 > 3 && 2 < 4; //true` | 逻辑与。当两个操作数都为\
  \ true 时，返回 true。 |\n| `||` | `7 > 3 || 2 < 4; //true` | 逻辑或。当一个或两个操作数为 true 时，返回\
  \ true。 |\n| `xor` | `7 > 3 xor 2 < 4; //false` | 逻辑异或。当两个操作数都不为真或都为真时，返回 false。\
  \ |\n| `!` | `!false; //true` | 否定。反转布尔值。True 变为 false，false 变为 true。 |\n\n**表 5.4**\
  \ 逻辑运算符 PHP 中有两种逻辑与和逻辑或的变体：一种使用符号，另一种使用字母。唯一的区别是使用符号的版本优先级更高（第 5.1.6 节）。\n\n####\
  \ 短路求值\n\n短路求值是为了提高性能设计的 PHP 编程概念。如果逻辑运算符的比较对于第一个操作数来说已经满足或失败，则不再检查第二个操作数。在下面的示例中，第一个比较已经返回了\
  \ false：\n\n```\n7 < 3 && 2 < 4;\n```\n\n在实践中，PHP 的这种行为通常对你的编程没有影响。函数调用是一个例外。如果你想确保在任何情况下都调用这两个函数，在这里执行简单的比较是有意义的。\n\
  \n### 5.1.4 二进制数和位运算符\n\n位运算符很少使用。它们被用于直接在位（bit）级别上工作。然而，在你详细介绍这些运算符之前，你将学习位操作的基础。位运算符被用于直接在位级别上工作。然而，在你详细介绍这些运算符之前，你将学习位操作的基础。位运算符被用于直接在位级别上工作。然而，在你详细介绍这些运算符之前，你将学习位操作的基础。位运算符被用于直接在位级别上工作。二进制表示法。位运算符被用于直接在位级别上工作。然而，在你详细介绍这些运算符之前，你将学习位操作的基础。二进制表示。这些数字是二进制表示。这些数字相加得到整数。\n\
