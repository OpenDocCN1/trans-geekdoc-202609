  #### 注意事项\n\n位移运算符是最经常使用的位运算符之一，因为它为对 2 的幂进行除法和乘法提供了简单的选项。\n\n所有二进制运算符都可以用赋值运算符的短形式表示。以下代码将变量\
  \ `$a` 的值从 10 变为 40：\n\n```\n$a = 10; \n$a <<= 2;  \n```\n\n### 创建二进制模式\n\n用纸笔将整数转换为二进制表示并不简单。因此，在\
  \ PHP 中编写一个小型转换器是有意义的（请参见图 5.7）。这里描述的转换器旨在将 0 到 255 (2⁸) 的数字转换为八位二进制表示。\n\n####\
  \ 注意事项\n\n如果你是 PHP 初学者，尚未熟悉这里使用的许多选项。你将在本章中了解编程结构，并学习如何在第 13 章 中使用表单。\n\n表单输入数字转换包含三个重要元素：\n\
  \n*   循环遍历从 7 到 0 的二进制数八位。计数器 `$i` 在后续语句中既用于访问数组也用于计算：\n\n    ```\n    for ($i =\
  \ 7; $i >= 0; $i--) {\n      //statements\n     }  \n    ```\n\n*   在循环内部，使用位与（AND）来检查数字在该位置上是否为\
  \ 1。计数器的二次幂对应相应的位置——第一次运行时 2⁷ = 128，第二次是 2⁶ = 64，依此类推。如果相应位置上为 1，则在数组中设置为 1，否则设为\
  \ 0：\n\n    ```\n    if ($number & pow(2, $i)) {\n      $binaryNumbers[$i] = 1;\n\
  \    } else {\n      $binaryNumbers[$i] = 0;\n    }  \n    ```\n\n*   最后，使用 `join()`\
  \ 将带有数据值的数组转换为字符串：\n\n    ```\n    $binary = join(\"\", $binaryNumbers);  \n   \
  \ ```\n\n完整的脚本打印在以下代码列表中。\n\n```php\n<?php\n  $number = \"\";\n  $binary = \"\"\
  ;\n  if (isset($_GET[\"Send\"]) && $_GET[\"Send\"] == \"Convert\") {\n    $number\
  \ = $_GET[\"input\"];\n    $binaryNumbers = array();\n\n    for ($i = 7; $i >= 0;\
  \ $i--) {\n      if ($number & pow(2, $i)) {\n        $binaryNumbers[$i] = 1;\n\
  \      } else {\n        $binaryNumbers[$i] = 0;\n      }\n    }\n    $binary =\
  \ join(\"\", $binaryNumbers);\n  }\n\n?>\n                    <html>\n  <head>\n\
  \    <title>Bin&auml;r</title>\n  </head>\n  <body><body>\n    <form>\n      <input\
  \ type=\"text\" name=\"input\" value=\"<?=$number ?>\" />\n      <input type=\"\
  text\" name=\"output\" value=\"<?=$binary ?>\" />\n      <input type=\"text\" name=\"\
  Send\" value=\"Convert\" />\n    </form>\n  </</body>>\n</</html>  \n```\n\n**列表\
