  # 20 SQLite\n\n如果基于文件的数据库可以满足，那么 SQLite 是一个令人惊讶的高性能选项——特别是在读取数据时（写入时并不多，这是显而易见的）。\n\
  \n让我们从历史回顾开始：PHP 5 最显著的特征之一是对 SQLite 数据库的支持。当公开 PHP 5 将提供这一新功能时，出现了声称 MySQL 已经死亡或将被\
  \ PHP 抛弃的声音。这显然并非如此。\n\n简而言之：SQLite 并不是 MySQL 的替代品，而是某些情况下的替代方案。PHP 以支持大量数据库而闻名；SQLite\
  \ 实际上是一个 C 库，可以在 `www.sqlite.org` 获取，并已集成到 PHP 中。SQLite 的最大优势是它基于文件的数据库，因此不需要运行后台的守护进程；你只需操作文件系统。这简化了应用程序的部署。SQLite\
  \ 的最大优势也是它的劣势：在写入时，整个数据库会被锁定，这比 MySQL 或 Microsoft SQL Server 等数据库慢得多。SQLite 是一个很好的选择，例如对于大量读取操作且写入操作少的门户。如果需要分析用户行为并存储在数据库中（跟踪），可能有更好的替代方案。\n\
  \n## 20.1 准备\n\nSQLite 的安装非常简单。该库已集成在 PHP 中，调用 `phpinfo()` 可以显示库的信息（见图 20.1）。如果你想移除它，需要在编译时使用\
  \ `--without-sqlite3` 选项。\n\n![phpinfo() 显示安装成功](img/img-f20.1.html)\n\n**图 20.1**\
  \ phpinfo() 显示安装成功\n\n你也可以从命令行按钮中看出它使用的是 SQLite 3 版本——简称 SQLite3。更准确地说，该数据库版本从 PHP\
  \ 5.3 开始受到支持。这对 Windows 用户意味着，他们需要在 `php.ini` 中加载 `php_sqlite3.dll` 扩展：\n\n```\n\
  extension=sqlite3\n```\n\n`php_sqlite.dll` DLL 以前曾使用，但在当前的发行版本中已不再可用。\n\n不需要其他操作。不需要启动服务器进程；你只需要对所需的数据库文件具有读写权限。你还需要文件所在目录的这些权限，因为\
  \ SQLite 可能会创建临时文件。\n\n### 注意\n\n如果你在数据库中存储敏感数据，应该遵循以下三个原则：\n\n1. 尽可能将数据库放在无法通过\
  \ HTTP 访问的目录，仅通过 PHP 脚本访问。这可以防止下载。或者，你可以配置 Web 服务器禁止下载某些扩展名的文件（如 `.db`）。\n\n2. 如果可行，至少为数据库想一个想象性的名称——例如\
  \ `xlbrmf.db`。`database.db`、`file.db` 或 `creditcarddetails.db` 文件很容易被擅长猜文件名的数据窃贼发现。然而，我们恳请你：也要遵循第一点中的建议。\n\
  \n3. 拦截 PHP 错误信息。这些信息可能包含数据库文件名。\n\n\n\n\n对于 SQLite，必要的步骤按顺序解释如下：建立连接、发送查询以及分析返回值。事务等特殊功能也未被遗漏。\n\
  \n首先是好消息（同时也是坏消息）：在内部，SQLite 数据库中的所有数据都被处理为**字符串**（strings）。因此，SQLite 会多或少地自动执行类型转换。然而，这使得处理起来变得稍微容易了一些。\n\
  \n### 注意：是函数还是方法？\n\n在 PHP 中，对于大多数数据库类型，访问数据库有两种方法。你要么使用函数（如 PHP 4 中已经那样），并将数据库句柄作为第一个参数传递（该句柄是在建立连接时接收的），要么使用\
  \ OOP 语法。\n\nSQLite 也是如此——直到包括 PHP 5.2 在内的所有版本。从 5.3 版本以及上述对 SQLite3 的更改开始，只存在基于\
  \ OOP 的编程接口。\n\n### 20.2.1 连接设置\n\n建立 SQLite 数据库的连接相对简单。你不需要任何复杂的连接参数，只需要一个文件名：当然，是数据库文件名。\n\
  \n作为第二个参数，你可以（可选地）指定打开数据库的模式或模式。可能的三个值（并可以使用位运算符进行组合）：\n\n*   `SQLITE3_OPEN_READONLY`:\
  \ 以只读方式打开\n*   `SQLITE3_OPEN_READWRITE`: 以读写方式打开（默认行为）\n*   `SQLITE3_OPEN_CREATE`:\
  \ 如果数据库文件不存在则创建数据库文件（也是标准行为）\n\n第三个参数包含一个可选的数据库加密密钥。你必须向其构造函数传递所有内容的对象被称为 `SQLite3()`。你再次通过实例的\
  \ `close()` 方法关闭连接。\n\n```php\n<?php\n  try {\n    $db = new SQLite3(\"file.db\"\
  );\n    echo \"Connection successful.\";\n    $db->close();\n  } catch (Exception\
  \ $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n**列表 20.1**\
  \ 使用 SQLite 建立连接 (\"sqlite-connect.php\")\n\n### 提示\n\n除了文件名外，你还可以指定 `:memory:`，在这种情况下，数据库将在内存中创建。遗憾的是，它将在脚本结束后再次消失。这通常仅用于临时表（保存中间结果）或测试目的。\n\
  \n### 20.2.2 查询\n\n向 SQLite 数据库发送查询有两种两种方法：\n\n*   `exec()`：用于没有返回值的查询\n*   `query()`：用于有返回值的查询\n\
  \n如果你喜欢简单方便，你可能想想要使用 `query()`，因为它也适用于不返回值的查询（此时函数的返回值将不包含任何相关数据）。然而，对于没有返回值的查询（例如\
  \ `CREATE TABLE` 或 `INSERT`），使用 `exec()` 执行无返回值的查询会更好。只需将 SQL 命令作为参数传递即可。\n\n下面的列表创建了一个测试表（在上一章中介绍过）并为其填充了一些数据。\n\
  \n```php\n<?php\n  try {\n    $db = new SQLite3(\"file.db\");\n    $sql = \"CREATE\
  \ TABLE my_table (\n      id INTEGER PRIMARY KEY, \n      field VARCHAR(1000) \n\
  \    )\";\n    if ($db->exec($sql)) {\n      echo \"Table created.<br />\";\n  \
  \  } else {\n      echo \"Error!\";\n    }\n    $sql = \"INSERT INTO my_table (field)\
  \ VALUES ('Value1')\";\n    if ($db->exec($sql)) {\n      echo \"Data entered.<br\
  \ />\";\n    } else {\n      echo \"Error!\";\n    }\n    $sql = \"INSERT INTO my_table\
  \ (field) VALUES ('value2')\";\n    if ($db->exec($sql)) {\n      echo \"Data entered.\"\
  ;\n    } else {\n      echo \"Error!\";\n    }\n    $db->close();\n  } catch (Exception\
  \ $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n**列表 20.2**\
  \ 无返回值的查询 (\"sqlite-query.php\")\n\n### 提示\n\n你可以使用 `INTEGER PRIMARY KEY` 数据类型在\
  \ SQLite 中创建自动递增值（autovalue）。对于数据库中的新条目，该字段的值会自动增加 1，而无需你对此进行任何操作。\n\n#### 注意：错误处理\n\
  \nSQLite 下的错误处理如下。`errorCode()` 方法返回上一个错误的代码。通过 `lastErrorMsg()`，你可以将代码转换为可读的消息。遗憾的是，错误代码不能被删除，这在连续查询时可能会成为问题。\n\
  \n在此也请记住，在 SQL 中使用来自用户的数据之前，应该始终对其进行检查和转换。SQLite 模块提供了 `escapeString()` 方法，它可以将字符串中的危险字符（如单引号）转换为\
  \ SQL 中无害的字符：\n\n```php\n$value = $_POST[\"value\"] ?? \"\";\n$value = $db->escapeString($value);\
  \ \n$sql = \"INSERT INTO my_table (field) VALUES ('$value')\";  \n```\n例如，“Rasmus'\
  \ invention\" 变成 \"Rasmus'' invention\"，这不会在 SQL 语句中导致任何危险。\n\n或者，SQLite 中有参数化查询（parameterized\
  \ queries），因此不必一定手动担心特殊字符。这种方法的核心是将命令和数据相互分离。出于这个原因，有三个必要的步骤：\n\n1.  使用 `prepare()`\
  \ 方法创建类型为 `SQLite3Stmt` 的对象。作为参数传递一个 SQL 语句，并在其中使用由冒号引导占位符。\n2.  `SQLite3Stmt` 对象提供\
  \ `bindValue()` 方法将值到占位符。\n3.  `execute()` 方法执行查询。\n\n列表 20.3 本质上与 20.2 相同的功能，但使用了预处理语句（在第一个查询中）。\n\
  \n```php\n<?php\n  try {\n    $db = new SQLite3(\"file.db\");\n    $sql = \"CREATE\
  \ TABLE my_table (\n      id INTEGER PRIMARY KEY, \n      field VARCHAR(1000) \n\
  \    )\";\n    if ($db->exec($sql)) {\n      echo \"Table created.<br />\";\n  \
  \  } else {\n      echo \"Error!\";\n    }\n    $sql = \"INSERT INTO my_table (field)\
  \ VALUES (:value)\";\n    if ($stmt = $db->prepare($sql)) {\n      $stmt->bindValue(\"\
  :value\", \"value1\");\n      $stmt->execute();\n    } else {\n      echo \"Error!\"\
  ;\n    }\n    $sql = \"INSERT INTO my_table (field) VALUES (:value)\";\n    if ($stmt\
  \ = $db->prepare($sql)) {\n      $stmt->bindValue(\":value\", \"value2\");\n   \
  \   $stmt->execute();\n    } else {\n      echo \"Error!\";\n    }\n    $db->close();\
  \ \n  } catch (Exception $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n\
  ?>  \n```\n**列表 20.3** 无返回值的查询，但使用预处理语句 (\"sqlite-query-prepared.php\")\n\n####\
  \ 注意：另一种绑定值\n\n或者，你可以使用 `bindParam()` 方法将值绑定到 SQL 查询。然而，你不能向此方法分配标量值，如列表 20.3 所示。相反，你需要一个可以引用的变量：\n\
  \n```php\n$sql = \"INSERT INTO my_table (field) VALUES (:value)\"; \n$stmt = $db->prepare($sql);\n\
  $w = \"value3\"; $stmt->bindParam(\":value\", $w); \n$stmt->execute(); \n```\n\n\
  ### 20.2.3 返回值\n\n正如，当查询的返回值相关时使用 `query()`。通过 `query()` 的返回值——类型为 `SQLite3Result`——你可以访问结果列表的各个值。你可以使用关联数组或索引数组访问它们；这些都由\
  \ `fetchArray()` 方法处理。传递以下三个常量之一作为参数：\n\n*   `SQLITE3_ASSOC`: 关联数组（列名作为键）\n*   `SQLITE3_NUM`:\
  \ 索引数组（列编号作为键）\n*   `SQLITE3_BOTH`: 两种类型的数组（默认行为）\n\n下面的示例显示了关联访问；输出如图 20.2 所示。\n\
  \n\n\n\n```php\n<?php\n  try {\n    $db = new SQLite3(\"file.db\");\n    $sql =\
  \ \"SELECT * FROM my_table\";\n    $result = $db->query($sql);\n    echo \"<ul>\"\
  ;\n    while ($row = $result->fetchArray()) { \n      echo \"<li>\" . htmlspecialchars($row[\"\
  id\"]) .\n           \": \" . htmlspecialchars($row[\"field\"]) . \"</li>\" ;\n\
  \    }\n    echo \"</ul>\";\n    $db->close();\n  } catch (Exception $ex) {\n  \
  \  echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n\n**列表 20.4** 以关联数组读取数据\
  \ (\"sqlite-read-associative.php\")\n\n![小型数据库中的所有条目](img/img-f20.2.html) \n\n**图\
  \ 20.2** 微数据库中的所有条目\n\n现代 PHP 版本的粉丝（希望大家都是如此！）可能会认为这样做很好，但 PHP 提供了迭代器（iterators）的概念。如果\
  \ PHP 的 SQLite 库开发者集成了迭代器，那不是太好了吗？恭喜你！开发者们确实考虑到了这一点，你可以像下面的列表所示，使用 `foreach()` 遍历结果列表。\n\
  \n```php\n<?php\n  try {\n    $db = new SQLite3(\"file.db\");\n    $sql = \"SELECT\
  \ * FROM my_table\";\n    $result = $db->query($sql);\n    echo \"<ul>\";\n    foreach\
  \ ($result as $row) { \n      echo \"<li>\" . htmlspecialchars($row[\"id\"]) .\n\
  \           \": \" . htmlspecialchars($row[\"field\"]) . \"</li>\" ;\n    }\n  \
  \  echo \"</ul>\";\n  } catch (Exception $ex) {\n    echo \"Error: \" . $ex->getMessage();\n\
  \  }\n?>  \n```\n\n**列表 20.5** 通过迭代器读取数据 (\"sqlite-read-iterator.php\")\n\n最后，我们还想指出一种可以带来额外性能提升的查询变体。我们讨论的是只有单一返回值的\
  \ `SELECT` 查询（或者你只对结果中第一列的值感兴趣）。\n\nPHP 为这两种情况都有一个特殊的方法：`querySingle()` 向数据库发送查询并返回第一列的值，或者（以数组形式）返回完整的第一行。\n\
  \n如果你在示例表上使用 `\"SELECT \\* FROM my_table\"` 执行 `querySingle()`，你将收到第一列的值——即 `id`\
  \ 列。如果你只对结果列表中的第一条记录感兴趣并想完整地获取它，你必须将 `true` 作为第二个参数。\n\n在这两种情况下，你都不再需要调用 `fetchArray()`\
  \ 了；你可以直接获得结果。下面的列表展示了一个示例。\n\n```php\n<?php\n  try {\n    $db = new SQLite3(\"\
  file.db\");\n    $sql = \"SELECT field FROM my_table\";\n    $result = $db->querySingle($sql,\
  \ true);\n    echo \"<ul>\";\n    foreach ($result as $element) { \n      echo \"\
  <li>\" . htmlspecialchars($element) . \"</li>\";\n    }\n    echo \"</ul>\";\n \
  \   $db->close();\n  } catch (Exception $ex) {\n    echo \"Error: \" . $ex->getMessage();\n\
  \  }\n?>  \n```\n\n**列表 20.6** 读取单列 (\"sqlite-read-single-query.php\")\n\n如果你使用\
  \ SQL 的聚合函数（如 `COUNT(* )`），`querySingle()` 方法将特别方便。这样你可以直接获得结果，而无需先处理数组。\n\n```php\n\
  <?php\n  try {\n    $db = new SQLite3(\"file.db\");\n    $sql = \"SELECT DISTINCT\
  \ COUNT(field) FROM my_table\";\n    $result = $db->querySingle($sql);\n    echo\
  \ \"数据库中有 $result 个不同的元素。\";\n    $db->close($db);\n  } catch (Exception $ex) {\n\
  \    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n\n**列表 20.7** 聚合函数的使用\
  \ (\"sqlite-read-count.php\")\n\n### 注意：在 SQLite 中计数\n\n了解上一次查询影响了多少行（`UPDATE` 更改的行数，`DELETE`\
  \ 删除的行数）通常是有趣的。这可以通过 `changes()` 方法来实现。然而，你仍然可以使用 `exec()` 向数据库发送 `UPDATE` 和 `DELETE`\
  \ 查询，因为 `changes()` 是实例的方法：\n\n```php\n$db->changes() \n```\n\n### 20.2.4 特性\n\n\
  尽管 SQLite 是一个相当小的数据库——C 库包含 200,000 行代码（包括注释），并不多——但它提供了一些实用的额外功能，此处将介绍。\n\n####\
  \ 自动 ID\n\nSQLite `INTEGER PRIMARY KEY` 类型是自动的。这意味着如果你向表中插入一个元素，它会自动接收一个新的 ID。然而，要确定这个\
  \ ID 是困难的——因为有些库甚至不提供该功能。\n\n（注：原文此处存在大量重复的占位性文本，译文已根据逻辑进行冗余处理，保留核心逻辑说明）\n\n```php\n\
  <?php\n  try {\n    $db = new SQLite3(\"file.db\");\n    $sql = \"INSERT INTO my_table\
  \ (field) VALUES ('value')\";\n    if ($db->exec($sql)) {\n      $id = $db->lastRowID();\n\
  \      echo \"数据 ID $id\";\n    } else {\n      echo \"Error!\";\n    }\n    $db->close();\n\
  \  } catch (Exception $ex) { \n    echo \"Error: \" . $ex->getMessage();\n  }\n\
  ?>  \n```\n\n**列表 20.8** 最后插入集合的 ID (\"sqlite-rowid.php\")\n\n![新数据库条目的 ID 为 3](img/img-f20.3.html)\
  \ \n\n**图 20.3** 新数据库条目的 ID 为 3\n\n#### 嵌入 PHP 代码\n\n由于 SQLite 是嵌入在 PHP 中的，很快就产生了让两者之间建立更紧密连接的想法。为此设计了条条路径，但只保留了一个。\n\
  \n早期的 PHP 版本增强了嵌入的 SQLite，使得 `php()` 函数可以在每个 SQL 命令中使用。它将 PHP 函数名（带单引号）作为第一个参数，将列名（不带单引号）作为第二个参数：\n\
  \n```sql\nSELECT php('toupper', field) FROM table\n```\n\n当前的 PHP/SQLite 版本不再支持这种方式，这就是为什么之前的列表没有文件名的签名。然而，第二种变体在今天仍然有效。这包括自己编写一个\
  \ PHP 函数并在 SQLite 中使用它。这通过几个步骤完成：\n\n\n\n\n\n1. 第一次，创建你自己的辅助函数。在这里你可以看到一个构造的示例，它首先将文本转换为大写字母，然后进行\
  \ HTML 编码，并添加了粗体和斜体的格式指令：\n\n```php\nfunction sqlite_textart($s) {\n  return \"\
  <b><i>\" .\n         htmlspecialchars(strtoupper($s)) .\n             \"</i></b>\"\
  ;\n}  \n```\n\n2. 通过调用 `createFunction()` 将此函数注册到 SQLite。参数是 SQL 中的函数名称以及你自己的函数名称（或匿名函数）：\n\
  \n```php\n$db->createFunction(\"texteffect\", \"sqlite_textart\");  \n```\n\n3.\
  \ 在 SQL 命令中使用新名称调用该新函数：\n\n```php\n$sql = \"SELECT texteffect(field) FROM table\"\
  ;  \n```\n\n代码列表 20.9 显示了一个完整的示例；你可以在图 20.4 中查看输出。\n\n```php\n<?php\n  function\
  \ sqlite_textart($s) {\n    return \"<b><i>\" .\n           htmlspecialchars(strtoupper($s))\
  \ .\n           \"</i></b>\";\n  }\n  try {\n    $db = new SQLite3(\"file.db\");\n\
  \    $db->createFunction(\"texteffect\", \"sqlite_textart\");\n    $sql = \"SELECT\
  \ id, texteffect(field) FROM my_table\";\n    $result = $db->query($sql);\n    echo\
  \ \"<ul>\";\n    while ($row = $result->fetchArray()) { \n      echo \"<li>\" .\
  \ $row[0] .\": \" . $row[1] . \"</li>\";\n    }\n    echo \"</ul>\";\n    $db->close();\n\
  \  } catch (Exception $ex) { \n    echo \"Error: \" . $ex->getMessage();\n  }\n\
  ?>  \n```\n\n**代码列表 20.9** SQLite 中的自定义函数 (\"sqlite-read-php.php\")\n\n![数据库中的值已转换](img/img-f20.4.html)\
  \ \n\n**图 20.4** 数据库中的值已转换\n\n### 提示\n\n此过程更改了列名（在示例中，从 `field` 变为 `texteffect (field)`），这就是为什么在代码列表\
  \ 20.9 中通过数值索引访问字段值的原因。\n\n### 20.2.5 旧代码的迁移\n\n之前的介绍展示了需要 SQLite 版本 3 或更高版本的 API。然而，在实践中，仍然存在基于旧\
  \ SQLite 版本的代码。在某些情况下，人们甚至尝试为较新的 PHP 版本编译旧的 SQLite 扩展，以保持应用程序的可执行。当然，唯一明智的方法是迁移到新\
  \ API。\n\n作为一个快速的临时解决方案，这些代码的作者在 GitHub 上发布了一个小小的辅助库（[`github.com/wenz/sqlite-shim`](https://github.com/wenz/sqlite-shim)）：`sqlite-shim`（参见图\
  \ 20.5）。该辅助库实现了许多“旧的”SQLite2 函数，并在后台执行相应的 SQLite3 方法。\n\n在这里你可以看到该库的一个典型摘录：\n\n\
  ```php\nif (!function_exists('sqlite_open')) {\n  function sqlite_open($filename,\
  \ $mode = 0666)\n  {\n    $handle = new \\SQLite3($filename);\n    return $handle;\n\
  \  }\n}  \n```\n\n因此，如果 `sqlite_open()` 函数不存在（如果有旧的 SQLite 扩展则会存在），它会被定义，但在后台使用\
  \ `SQLite3` 类。\n\n![sqlite-shim 的 GitHub 页面](img/img-f20.5.html) \n\n**图 20.5**\
  \ sqlite-shim 的 GitHub 页面\n\n移植 `sqlite_fetch_all()` 函数（它用于确定查询结果的所有数据记录）要费力一些；SQLite3\
  \ 中没有这样的功能。因此，我们必须手动完成这一点：\n\n```php\nif (!function_exists('sqlite_fetch_all'))\
  \ {\n  function sqlite_fetch_all($result, $mode = SQLITE_BOTH)\n  {\n    $rows =\
  \ array();\n    while ($row = $result->fetchArray($mode)) {\n      array_push($rows,\
  \ $row);\n    }\n    return $rows;\n  }\n}  \n```\n\n`SQLITE_BOTH` 常数自然只存在于旧的 SQLite\
  \ 扩展中，这就是为什么我们必须单独定义它（以及其他常量）：\n\n```php\nif (!defined('SQLITE_BOTH')) { \n  define('SQLITE_BOTH',\
  \ SQLITE3_BOTH); \n}  \n```\n\n其他 SQLite 功能在 `sqlite-shim` 中也遵循类似的原理。如果你需要移植旧代码，希望这个库会让你的工作变得更简单。\n\
  \n## 20.3 应用示例\n\n在学习了所有理论之后，让我们重新回顾之前章节中流行的实际应用：留言板。各个文件已直接针对留言板进行了适配。\n\n### 20.3.1\
  \ 创建表\n\n要创建表，你使用 `SQLite3` 构造函数。\n\n```php\n<html>\n<head>\n  <title>Guestbook</title>\n\
  </head>\n<body>\n<h1>Guestbook</h1>\n```\n\n```php\n<?php\n  try {\n    $db = new\
  \ SQLite3(\"file.db\");\n    $sql = \"CREATE TABLE guestbook (\n      id INTEGER\
  \ PRIMARY KEY,\n      heading VARCHAR(100),\n      entry VARCHAR(500),\n      author\
  \ VARCHAR(50),\n      date TIMESTAMP\n    )\";\n    if ($db->exec($sql)) {\n   \
  \   echo \"Table created.\";\n    } else {\n      echo \"Error!\";\n    }\n  } catch\
  \ (Exception $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n\
  **代码列表 20.10** 创建表 (\"gb-create.php\")\n\n### 20.3.2 输入数据\n\n向数据库插入留言条时，应先使用 `escapeString()`\
  \ 进行处理。或者你也可以预处理语句。\n\n```php\n<?php\n  if (isset($_POST[\"Name\"]) && isset($_POST[\"\
  Email\"]) && isset($_POST[\"Heading\"]) && isset($_POST[\"Comment\"])) {\n    try\
  \ {\n      $db = new SQLite3(\"file.db\");\n      $sql = vsprintf(\"INSERT INTO\
  \ guestbook (\n        heading,\n        entry,\n        author,\n        email,\n\
  \        date) VALUES ('%s', '%s', '%s', '%s', '%s')\",\n        [\n          $db->escapeString($_POST[\"\
  Heading\"]),\n          $db->escapeString($_POST[\"Comment\"]),\n          $db->escapeString($_POST[\"\
  Name\"]),\n          $db->escapeString($_POST[\"Email\"]),\n          time()\n \
  \       ]\n      );\n      if ($db->exec($sql)) {\n        $id = $db->lastInsertRowID();\n\
  \        echo \"Entry added. <a href=\\\"gb-edit.php?id=$id\\\">Edit</a>\";\n  \
  \    } else {\n        echo \"Error!\";\n      }\n    } catch (Exception $ex) {\n\
  \      echo \"Error: \" . $ex->getMessage();\n    }\n  }\n?> \n```\n\n```html\n\
  <form method=\"post\" action=\"\">\nName <input type=\"text\" name=\"Name\" /><br\
  \ />\nEmail address <input type=\"text\" name=\"Email\" /><br />\nHeading <input\
  \ type=\"text\" name=\"Heading\" /><br />\nComment\n<textarea cols=\"70\" rows=\"\
  10\" name=\"Comment\"></textarea><br />\n<input type=\"submit\" name=\"Submit\"\
  \ value=\"Submit\" />\n</form>\n```\n**代码列表 20.11** 输入数据 (\"gb-enter.php\")\n\n\
  ### 20.3.3 输出数据\n\n要输出数据，调用 `SELECT * FROM guestbook ORDER BY date DESC` 以优先获取最新的留言（参见图\
  \ 20.6）。\n\n![留言板正在填满](img/img-f20.6.html) \n\n**图 20.6** 留言板正在填满\n\n在下面的代码列表中，我们使用\
  \ `fetchArray()`逐行读取。\n\n```php\n<?php\n  $db = new SQLite3(\"file.db\");\n  $sql\
  \ = \"SELECT * FROM guestbook ORDER BY date DESC\";\n  $result = $db->query($sql);\n\
  \  echo \"<ul>\";\n  while ($row = $result->fetchArray(SQLITE_ASSOC)) {\n    echo\
  \ \"<li>\" . $row[\"heading\"] . \": \" . $row[\"entry\"] . \"</li>\";\n  }\n  echo\
  \ \"</ul>\";\n  $db->close();\n?>\n```\n\n\n\n\n\n```php\n<?php\n  try {\n    $db\
  \ = new SQLite3(\"guestbook.db\");\n    $sql = \"SELECT * FROM guestbook ORDER BY\
  \ date DESC\";\n    $result = $db->query($sql);\n    while ($row = $result->fetchArray())\
  \ {\n      printf(\"<p><a href=\\\"mailto:%s\\\">%s</a> wrote on/at %s:</p>\n  \
  \      <h3>%s</h3><p>%s</p><hr noshade=\\\"noshade\\\" />\", \n        urlencode($row[\"\
  email\"]),\n        htmlspecialchars($row[\"author\"]),\n        htmlspecialchars(date(\"\
  Y-m-d, H:i\", intval($row[\"date\"]))),\n        htmlspecialchars($row[\"heading\"\
  ]),\n        nl2br(htmlspecialchars($row[\"entry\"]))\n      );\n    }\n    $db->close();\n\
  \  } catch (Exception $ex) { \n    echo \"Error: \" . $ex->getMessage();\n  }\n\
  ?> \n```\n\n```html\n</body>\n</html>  \n```\n\n**列表 20.12** 输出留言板数据 (\"gb-show.php\"\
  )\n\n### 20.3.4 删除数据\n\n若要进行删除，第一次点击会调整链接（从 `gb-admin.php?id=<ID>` 变为 `gb-admin.php?id=<ID>&ok=1`），第二次点击将向数据库发送一个\
  \ `DELETE` 命令。同样，重要的是使用 `SQLite3::escapeString()` 方法对要删除的条目的 `ID` 进行预处理，以确保万无一失。\n\
  \n```html\n<<html>\n<head>\n  <title>Guestbook</title>\n</head>\n<body>\n<h1>Guestbook</h1>\
  \ \n```\n\n```php\n<?php\n  if (isset($_GET[\"id\"]) && is_numeric($_GET[\"id\"\
  ])) {\n    if (isset($_GET[\"ok\"])) {\n      try {\n        $db = new SQLite3(\"\
  guestbook.db\");\n        $id = $db->escapeString($_GET[\"id\"]);\n        $sql\
  \ = \"DELETE FROM guestbook WHERE id='$id'\";\n        if ($db->exec($sql)) {\n\
  \          echo \"<p>Entry deleted.</p>\n                <p><a href=\\\"gb-admin.php\\\
  \">Back to overview\n                      </a></p>\";\n        } else {\n     \
  \     echo \"Error!\";\n        }\n        $db->close();\n      } catch (Exception\
  \ $ex) { \n        echo \"Error: \" . $ex->getMessage();\n      }\n    } else {\n\
  \      printf(\"<a href=\\\"gb-admin.php?id=%s&ok=1\\\">Really delete?\n       \
  \     </a>\", urlencode($_GET[\"id\"]));\n    }\n  } else {\n    try {\n      $db\
  \ = new SQLite3(\"guestbook.db\");\n      $sql = \"SELECT * FROM guestbook ORDER\
  \ BY date DESC\";\n      $result = $db->query($sql);\n      while ($row = $result->fetchArray())\
  \ {\n        printf(\"<p><b<a href=\\\"gb-admin.php?id=%s\\\">Delete this entry\
  \ </a>\n                - <a href=\\\"gb-edit.php?id=%s\\\">Edit this entry</a></b></p>\n\
  \          <p><a href=\\\"mailto:%s\\\">%s</a> wrote on/at %s:</p>\n          <h3>%s</h3><p>%s</p><hr\
  \ noshade=\\\"noshade\\\" />\", \n          urlencode($row[\"id\"]),\n         \
  \ urlencode($row[\"id\"]),\n          htmlspecialchars($row[\"email\"]),\n     \
  \     htmlspecialchars($row[\"author\"]),\n          htmlspecialchars(date(\"Y-m-d,\
  \ H:i\", intval($row[\"date\"]))),\n          htmlspecialchars($row[\"heading\"\
  ]),\n          nl2br(htmlspecialchars($row[\"entry\"]))\n        );\n      }\n \
  \     $db->close();\n    } catch (Exception $ex) { \n      echo \"Error: \" . $ex->getMessage();\n\
  \    }\n  }\n?> \n```\n\n```html\n</body>\n</html>  \n```\n\n**列表 20.13** 显示包含删除选项的所有数据\
  \ (\"gb-admin.php\")\n\n### 20.3.5 编辑数据\n\n“最高准则”始终是管理条目的编辑。通过 URL 中的 `ID`，从数据库中读取数据并在表单字段中预填充这些内容。当表单提交时，将根据这些数据生成一个\
  \ `UPDATE` SQL 语句。\n\n```html\n<<html>\n<head>\n  <title>Guestbook</title>\n</head>\n\
  <body>\n<h1>Guestbook</h1> \n```\n\n```php\n<?php\n  $Name = \"\";\n  $Email = \"\
  \";\n  $Heading = \"\";\n  $Comment = \"\";\n  if (isset($_GET[\"id\"]) &&\n   \
  \   is_numeric($_GET[\"id\"])) {\n    try {\n      $db = new SQLite3(\"guestbook.db\"\
  );\n      if (isset($_POST[\"Name\"]) &&\n          isset($_POST[\"Email\"]) &&\n\
  \          isset($_POST[\"Heading\"]) &&\n          isset($_POST[\"Comment\"]))\
  \ {\n        $sql = vsprintf(\n          \"UPDATE guestbook SET \n          heading\
  \ = '%s', \n          entry = '%s',\n          author = '%s',\n          email =\
  \ '%s'\n          WHERE id='%s'\",\n          [\n            $db->escapeString($_POST[\"\
  Heading\"]), \n            $db->escapeString($_POST[\"Comment\"]), \n          \
  \  $db->escapeString($_POST[\"Name\"]), \n            $db->escapeString($_POST[\"\
  Email\"]),\n            $db->escapeString($_POST[\"id\"]),\n          ]\n      \
  \  );\n        if ($db->exec($sql)) {\n          echo \"<p>Entry deleted.</p>\n\
  \                <p><a href=\\\"gb-admin.php\\\">Back to overview\n            \
  \          </a></p>\";\n        } else {\n          echo \"Error!\";\n        }\n\
  \      } else {\n        $sql = sprintf(\"SELECT * FROM guestbook WHERE id='%s'\"\
  , $db->escapeString($_GET[\"id\"]));\n        $result = $db->query($sql);\n    \
  \    if ($row = $result->fetchArray()) {\n          $Name = $row[\"author\"];\n\
  \          $Email = $row[\"email\"];\n          $Heading = $row[\"heading\"];\n\
  \          $Comment = $row[\"entry\"];\n        }\n        $db->close();\n    }\
  \ catch (Exception $ex) { \n      echo \"Error: \" . $ex->getMessage();\n    }\n\
  \  }\n?> \n```\n<form method=\"post\" action=\"\">\nName <input type=\"text\" name=\"\
  Name\" value=\"<?php\n  echo htmlspecialchars($Name);\n?> /><br />\nEmail address\
  \ <input type=\"text\" name=\"Email\" value=\"<?php\n  echo htmlspecialchars($Email);\n\
  ?> /><br />\nHeading <input type=\"text\" name=\"Heading\" value=\"<?php\n  echo\
  \ htmlspecialchars($Heading);\n?> /><br />\nComment\n<textarea cols=\"70\" rows=\"\
  10\" name=\"Comment\"><?php\n  echo htmlspecialchars($Comment);\n?></textarea><br\
  \ />\n<input type=\"submit\" name=\"Submit\" value=\"Update\" />\n</form>\n</body>\n\
  </html>  \n```\n\n**列表 20.14** 编辑留言板条目 (\"gb-edit.php\")\n\n留言板已经完成了。你现在只需要对管理页面进行安全保护，就可以继续后续工作了。\n\
  \n# 21 Microsoft SQL Server\n\n微软长期以来一直致力于开源，最近这种努力力度加大了。微软的数据库管理系统 SQL Server 尚未开源（但也许在未来的某个时刻）。尽管如此，你仍然可以使用\
  \ PHP 访问它。\n\n\n\n\nMicrosoft SQL Server Developer Edition 是一个免费版本，可能不能用于生产系统，但在开发和测试中无限制使用。或者，你也可以使用另一个免费版本：Microsoft\
  \ SQL Server Express Edition。这是一个已用于生产环境的 MSSQL 版本，但在功能上有所精简。例如，它缺少了所有的图形化管理工具（除非你知道从哪里获取替代方案，将在后文讨论），并且限制了同时连接的数量，最大数据库大小也是如此。尽管如此，SQL\
  \ Server Express Edition 对于仅用于测试而言（而且是免费的）是一个非常有趣的产品，它也是中小型网站的潜在替代方案。你现在可以在 [`s-prs.co/v602225`](http://s-prs.co/v602225)\
  \ 下载 2022 版本。\n\n顺带提到，即使是 SQL Server 图形化管理工具（Management Studio；参见图 21.1）也提供一个精简免费版，可以与\
  \ SQL Server Express Edition 完美配合：SQL Server Management Studio Express。该产品名称非常长，通常被缩写为几乎难以记忆的\
  \ SSMSE。然而，不带 Express 字样的“大版”管理工具现在也免费提供。因此，其缩写为 SSMS。你可以从上述下载页面将 SSMS 作为独立工具下载。不过，接下来的解释也适用于旧版本的\
  \ SQL Server；我们已经对 2012 到 2022 年的版本进行了测试。\n\n![SQL Server Management Studio](img/img-f21.1.html)\
  \ \n\n**图 21.1** SQL Server Management Studio\n\n一旦安装了数据库服务器，通往 PHP 的桥梁就建立了。如果你在系统上使用旧版本的\
  \ PHP 并查看 `php.ini`，将会出现以下具有诱惑力的条目：\n\n```\nextension=php_mssql.dll  \n```\n\n然而，这是旧的、不再维护（且不再被当前\
  \ MSSQL 版本支持）用于控制数据库的 PHP 扩展。我们无法在这里继续下去了。我们必须寻求帮助——来自微软官方本身。\n\n## 21.2 用于 PHP\
  \ 的 Microsoft SQL Server \n\n多年来，微软在 PHP 大会议上非常活跃，推广来自雷德蒙的 Web 服务器 (IIS)、数据库 (SQL\
  \ Server) 和云技术 (Azure) 等。公司的立场显然有些微妙，因为它还生产 ASP.NET，这是 PHP 的主要竞争对手之一。\n\n然而，微软对\
  \ PHP 开发的许多贡献非常受社区欢迎。这些包括显著改进的 Windows 构建。用于 PHP 的 Microsoft SQL Server Driver 并不是\
  \ PHP 核心本身，但它仍然是一个令人兴奋的扩展。这是微软 way 用于操作其自身 SQL Server 的 PHP 扩展。令人惊叹的是，该扩展不仅运行在 Windows\
  \ 上，还运行在 macOS 和 Linux 上！该扩展的源代码已一段时间发布在 GitHub 上：[`github.com/Microsoft/msphpsql`](https://github.com/Microsoft/msphpsql)。\n\
  \n在本节中，我们将简要地向你展示当前 5.12.0 版本的驱动程序的工作原理。它支持从 8.1 到 8.3 的 PHP 版本。你可以在 [`github.com/Microsoft/msphpsql/releases`](https://github.com/Microsoft/msphpsql/releases)\
  \ 下载这些以及更旧（可能还有更新！）版本的扩展，它们稍显隐藏在 Assets 下（参见图 21.2）。\n\n![Download the Extension\
  \ for SQL Server on GitHub](img/img-f21.2.html) \n\n**图 21.2** 在 GitHub 上下载 SQL\
  \ Server 扩展\n\n在接下来的示例中，我们使用 Windows 包。该归包包含适用于 32 位 (x86) 和 64 位 (x64) PHP 版本的扩展。以下是\
  \ PHP 8.3 的文件：\n\n* `php_pdo_sqlsrv_83_nts_x86.dll`\n* `php_pdo_sqlsrv_83_nts_x64.dll`\n\
  \n### 21.2.1 连接设置\n\n下面的列表显示了一个建立与服务器连接的简单示例。\n\n```php\n<?php\n  if ($db = sqlsrv_connect(\"\
  (local)\\\\SQLEXPRESS\")) {\n    echo \"Connection successful.\";\n  } else {\n\
  \    echo \"Error!\";\n  }\n?>  \n```\n**列表 21.1** 使用 Microsoft 驱动程序的连接 (\"sqlsrv-connect.php\"\
  )\n\n### 提示\n\n与之前的章节一样，为了清晰起见，我们省略了“正式”的错误处理。例如，`sqlsrv_errors()` 函数返回所有的错误信息。\n\
  \n### 21.2.2 查询\n\n要向 SQL 服务器数据库发送查询，请使用 `sqlsrv_query()` 函数。需要两个参数：数据库连接（由 `sqlsrv_connect()`\
  \ 返回）和 SQL 命令。你可以在下面的列表中看到示例。\n\n```php\n<?php\n  if ($db = sqlsrv_connect(\n  \
  \  \"(local)\\\\SQLEXPRESS\",\n    [\"Database\" => \"PHP\"])) {\n    $sql = \"\
  CREATE TABLE my_table (\n      id INT IDENTITY NOT NULL, \n      field VARCHAR(255)\n\
  \    )\";\n    if (sqlsrv_query($db, $sql)) {\n      echo \"Table created.<br />\"\
  ;\n    } else {\n      echo \"Error!\";\n    }\n    $sql = \"INSERT INTO my_table\
  \ (field) VALUES ('Value1')\";\n    if (sqlsrv_query($db, $sql)) {\n      echo \"\
  Data entered.<br />\";\n    } else {\n      echo \"Error!\";\n    }\n    $sql =\
  \ \"INSERT INTO my_table (field) VALUES ('Value2')\";\n    if (sqlsrv_query($db,\
  \ $sql)) {\n      echo \"Data entered.\";\n    } else {\n      echo \"Error!\";\n\
  \      die(print_r( sqlsrv_errors(), true));\n    }\n    sqlsrv_close($db);\n  }\
  \ else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n\n\n\n\n# 列表 21.2 使用 Microsoft\
  \ 驱动创建并填充表格 (\"sqlsrv-query.php\")\n\n### 21.2.3 返回值\n\n在读取返回值时，再次使用了 `while` 循环，它遍历数据库函数的返回结果。该函数在\
  \ `sqlsrv` 扩展中被称为 `sqlsrv_fetch_array()`。这产生了后续列表所示代码。\n\n```php\n<?php\n  if ($db\
  \ = sqlsrv_connect(\n    \"(local)\\\\SQLEXPRESS\", \n    [\"Database\" => \"PHP\"\
  ])) {\n    $sql = \"SELECT * FROM my_table\";\n    if ($result = sqlsrv_query($db,\
  \ $sql)) {\n      echo \"<ul>\";\n      while ($row = sqlsrv_fetch_array($result))\
  \ { \n        echo \"<li>\" . htmlspecialchars($row[\"id\"]) .\n             \"\
  : \" . htmlspecialchars($row[\"field\"]) . \"</li>\" ;\n      }\n      echo \"</ul>\"\
  ;\n    }\n    sqlsrv_close($db);\n  } else {\n    echo \"Error!\";\n  }\n?>  \n\
  ```\n\n# 列表 21.3 使用 Microsoft 驱动将所有查询数据作为关联数组 (\"sqlsrv-read.php\")\n\n使用对象进行读取非常相似，但函数名从\
  \ `sqlsrv_fetch_array()` 变为 `sqlsrv_fetch_object()`，访问方式从 `$row[\"column\"]` 变为\
  \ `$row->column`。\n\n```php\n<?php\n  if ($db = sqlsrv_connect(\n    \"(local)\\\
  \\SQLEXPRESS\", \n    [\"Database\" => \"PHP\"])) {\n    $sql = \"SELECT * FROM\
  \ my_table\";\n    if ($result = sqlsrv_query($db, $sql)) {\n      echo \"<ul>\"\
  ;\n      while ($row = sqlsrv_fetch_object($result)) { \n        echo \"<li>\" .\
  \ htmlspecialchars($row->id) .\n             \": \" . htmlspecialchars($row->field)\
  \ . \"</li>\";\n      }\n      echo \"</ul>\";\n    }\n    sqlsrv_close($db);\n\
  \  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n# 列表 21.4 将所有查询数据作为对象 (\"sqlsrv-read-object.php\"\
  )\n\n### 替代获取方法\n\n还有另一种读取数据的方法，`sqlsrv_fetch()`，它从结果列表中读取一条数据记录，但最初并不提供返回值。然而，你随后可以使用\
  \ `sqlsrv_get_field()` 通过数字访问数据集中的单个列，如下所示：\n\n```php\nwhile (sqlsrv_fetch($result))\
  \ { \n    echo \"<li>\" . htmlspecialchars(sqlsrv_get_field($result, 0)) .\n   \
  \    \": \" . htmlspecialchars(sqlsrv_get_field($result, 1)) . \"</li>\"; \n} \n\
  ```\n\n### 21.2.4 特殊功能\n\n除了之前显示的“经典”用例外，`sqlsrv` 扩展还提供了许多高级功能，其中最重要的将在前面介绍，每个功能都带有一个简短的代码示例。\n\
  \n### 预编译语句\n\n当然，`sqlsrv` 扩展也提供参数化查询。为此，你必须先创建一个命令对象。在 SQL 代码中使用问号作为占位符：\n\n```sql\n\
  $sql = \"INSERT INTO my_table (field) VALUES (?)\";  \n```\n\n通过 `sqlsrv_prepare()`，你创建命令对象。你以数组的形式传递占位符的值，即使你像示例那样只使用一个占位符。注意，数组中的值必须作为引用传递，否则你将收到警告：\n\
  \n```php\n$value = \"123\"; \n$stmt = sqlsrv_prepare($db, $sql, [&$value]);  \n\
  ```\n\n在最后一步，执行该命令：\n\n```php\nsqlsrv_execute($stmt);\n```\n\n以下列表显示使用 HTML 表单向数据库添加相关值。\n\
  \n```php\n<?php\n  if ($db = sqlsrv_connect(\n    \"(local)\\\\SQLEXPRESS\", \n\
  \    [\"Database\" => \"PHP\"])) {\n    $sql = \"INSERT INTO my_table (field) VALUES\
  \ (?)\";\n    if (isset($_POST['value'])) {\n      $stmt = sqlsrv_prepare($db, $sql,\
  \ [&$POST['value']]);\n      if (sqlsrv_execute($stmt)) {\n        echo \"Data inserted.\"\
  ;\n      } else {\n        echo \"Error!\";\n      }\n    }\n    sqlsrv_close($db);\n\
  \  } else {\n    echo \"Error!\";\n  }\n?> \n```\n\n<form method=\"post\">\n  <input\
  \ type=\"text\" name=\"value\" />\n  <input type=\"submit\" value=\"Enter\" />\n\
  </form>\n\n# 21.5 使用驱动程序进行参数化查询 (\"sqlsrv-parameter.php\")\n\n### 最后插入值\n\n由于 MSSQL\
  \ 提供了 `IDENTITY`，自然可以如何确定最后插入的值。这在应用程序中很常见，通过 `SELECT @@IDENTITY` 来实现。以下示例显示了最后插入值：\n\
  \n```php\n<?php\n  if ($db = sqlsrv_connect(\n    \"(local)\\\\SQLEXPRESS\", \n\
  \    [\"Database\" => \"PHP\"])) {\n    $sql = \"SELECT @@IDENTITY AS \"id\";\n\
  \    if ($result = sqlsrv_query($db, $sql)) {\n      while ($row = sqlsrv_fetch_array($result))\
  \ {\n        echo \"Last value: \" . $row[\"id\"];\n      }\n    }\n    sqlsrv_close($db);\n\
  \  } else {\n    echo \"Error!\";\n  }\n?> \n```\n\n# 21.6 读取自动值 (\"sqlsrv-read-autovalue.php\"\
  )\n\n### 关于结果的信息\n\n在 SQL 语句之后，可以使用辅助函数获取有关结果的信息。例如，`sqlsrv_rows_affected()` 返回\
  \ `UPDATE`、`DELETE` 或 `INSERT` 影响的行数。`sqlsrv_num_rows()` 返回结果集的行数。\n\n### 存储过程\n\
  \n通过存储过程（某些人称为嵌入过程），可以在数据库内部封装多个查询。这避免了开发中的许多麻烦。以下示例显示了存储过程：\n\n```sql\nCREATE PROCEDURE\
  \ pr_insert ( \n  @value VARCHAR(50) \n) \nAS \nINSERT INTO my_table (field) VALUES\
  \ (@value) \nSELECT @@IDENTITY\n```\n\n你可以使用工具创建此存储过程，也可以像下面所示通过 PHP 脚本来插入：\n\n\
  ```php\n<?php\n  if ($db = sqlsrv_connect(\n    \"(local)\\\\SQLEXPRESS\", \n  \
  \  [\"Database\" => \"PHP\"])) {\n    $sql = \"CREATE PROCEDURE pr_insert (\n  \
  \            @value VARCHAR(50)\n            ) AS\n            INSERT INTO my_table\
  \ (field) VALUES (@value)\n            SELECT @@IDENTITY\n            GO\";\n  \
  \  if (sqlsrv_query($db, $sql)) {\n      echo \"Stored procedure created.\";\n \
  \   } else {\n      echo \"Error!\";\n    }\n    sqlsrv_close($db);\n  } else {\n\
  \    echo \"Error!\";\n  }\n?> \n```\n\n# 列表 21.7 创建存储过程 (\"sqlsrv-sp-create.php\"\
  )\n\n要执行存储过程，在 SQL 代码中使用 `EXEC` 或 `CALL` 执行它，如下完整的列表所示：\n\n```php\n<?php\n  if ($db\
  \ = sqlsrv_connect(\n    \"(local)\\\\SQLEXPRESS\", \n    [\"Database\" => \"PHP\"\
  ])) {\n    $sql = \"{call pr_insert(?)}\";\n    $value = \"value4\";\n    $parameter\
  \ = [\n      [$value, SQLSRV_PARAM_IN]\n    ];\n    if ($result = sqlsrv_query($db,\
  \ $sql, $parameter)) {\n      echo \"Stored procedure called.\";\n    } else {\n\
  \      echo \"Error!\";\n    }\n    sqlsrv_close($db);\n  } else {\n    echo \"\
  Error!\";\n  }\n?>  \n```\n\n# 列表 21.8 ... 和调用 (\"sqlsrv-sp-call.php\")\n\n\n\n\n\
  \nPHP 的 SQL Server 驱动 API 自然比之前介绍的要广泛得多。这里有一些更有用的函数：\n\n- `sqlsrv_has_rows()`\n\
  \  确定结果列表是否包含任何数据\n- `sqlsrv_num_rows()`\n  结果列表中的行数\n- `sqlsrv_server_info()`\n\
  \  关于数据库的信息（以关联数组形式表示，包含版本号等）\n\n微软的驱动程序具有潜力，因为它正在被活跃地开发，这与 `mssql` 扩展不同。然而，问题在于它最终是否会成为\
  \ PHP 的官方部分，还是在代码已开源的情况下，继续保持作为微软的专有“产品”。\n\n## 21.3 应用程序示例\n\n本章以强制性的留言板示例结束。我们在之前的几个章节中给出的建议同样适用于这里：正确地设置权限，并在必要时调整\
  \ `sqlsrv_connect()` 的参数。\n\n### 21.3.1 创建表\n\n要创建表，最好的方法是使用 `sqlsrv_query()` 直接将关联语句发送数据库。或者，你也可以使用管理\
  \ Studio（Management Studio）或类似的工具。\n\n```php\n<?php\n  if ($db = sqlsrv_connect(\n\
  \    \"(local)\\\\SQLEXPRESS\", \n    [\"Database\" => \"PHP\"])) {\n    $sql =\
  \ \"CREATE TABLE guestbook (\n      id INT IDENTITY NOT NULL, \n      heading VARCHAR(1000),\
  \ \n      entry VARCHAR(5000),\n      author VARCHAR(50),\n      email VARCHAR(100),\n\
  \      date DATETIME,\n      PRIMARY KEY (id)\n    )\";\n    if (sqlsrv_query($db,\
  \ $sql)) {\n      echo \"Table created.<br />\";\n    } else {\n      echo \"Error!\"\
  ;\n    }\n    sqlsrv_close($db);\n  } else {\n    echo \"Error!\";\n  }\n?>  \n\
  ```\n\n**列表 21.9** 创建表 (\"gb-create.php\")\n\n### 21.3.2 输入数据\n\n要向数据库输入数据，请创建一个预处理语句以防止\
  \ SQL 注入。通过 `SELECT @@IDENTITY`，可以确定并输出插入过程中的自动增量值。\n\n以下列表显示了手动插入的代码。\n\n```html\n\
  <html>\n<head>\n  <title>Guestbook</title>\n</head>\n<body>\n<h1>Guestbook</h1>\
  \ \n```\n\n```php\n<?php\n  if (isset($_POST[\"Name\"]) &&\n      isset($_POST[\"\
  Email\"]) &&\n      isset($_POST[\"Heading\"]) &&\n      isset($_POST[\"Comment\"\
  ])) {\n    if ($db = sqlsrv_connect(\n      \"(local)\\\\SQLEXPRESS\", \n      [\"\
  Database\" => \"PHP\"])) {\n      $sql = \"INSERT INTO guestbook \n        (heading,\
  \ \n         entry,\n         author,\n         email,\n         date) \n      \
  \  VALUES (?, ?, ?, ?, ?)\";\n      $date = date(\"Y-m-d H:i\");\n      $parameter\
  \ = [\n        &$_POST[\"Heading\"], \n        &$_POST[\"Comment\"], \n        &$_POST[\"\
  Name\"], \n        &$_POST[\"Email\"], \n        $date,\n        ];\n      if ($command\
  \ = sqlsrv_prepare($db, $sql, $parameter)) {\n        if (sqlsrv_execute($command))\
  \ {\n          $result = sqlsrv_query($db, \"SELECT @@IDENTITY\");\n          sqlsrv_fetch($result);\n\
  \          $id = sqlsrv_get_field($result, 0);\n          echo \"Entry added. \n\
  \               <a href=\\\"gb-edit.php?id=$id\\\">Edit</a\";\n        } else {\n\
  \          echo \"Error!\";\n        }\n      } else {\n        echo \"Error!\"\
  ;\n      }\n      sqlsrv_close($db);\n    } else {\n      echo \"Error!\";\n   \
  \ }\n  }\n?> \n```\n\n```html\n<form method=\"post\" action=\"\">\nName <input type=\"\
  text\" name=\"Name\" /><br />\nEmail address <input type=\"text\" name=\"Email\"\
  \ /><br />\nHeading <input type=\"text\" name=\"Heading\" /><br />\nComment<textarea\
  \ cols=\"70\" rows=\"10\" name=\"Comment\"></textarea><br />\n<input type=\"submit\"\
  \ name=\"Submit\" value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\n**列表 21.10**\
  \ 可以输入数据 (\"gb-enter.php\")\n\n### 21.3.3 输出数据\n\n要输出数据，你可以使用 `sqlsrv_fetch` 函数之一。我们在这里使用了对象变体，但你如何操作完全取决于个人喜好。\n\
  \n```html\n<html>\n<head>\n  <title>Guestbook</title>\n</head>\n<body>\n<h1>Guestbook</h1>\
  \ \n```\n\n```php\n<?php\n    if ($db = sqlsrv_connect(\n      \"(local)\\\\SQLEXPRESS\"\
  , \n      [\"Database\" => \"PHP\"])) {\n    $sql = \"SELECT * FROM guestbook ORDER\
  \ BY date DESC\";\n    $result = sqlsrv_query($db, $sql);\n    while ($row = sqlsrv_fetch_object($result))\
  \ {\n      printf(\"<p><a href=\\\"mailto:%s\\\">%s</a> wrote on/at %s:</p>\n  \
  \      <h3>%s</h3><p>%s</p><hr>\",\n        $row->email,\n        $row->author,\n\
  \        $row->date->format(\"Y-m-d H:i\"),\n        $row->heading,\n        $row->entry\n\
  \      );\n    }\n    sqlsrv_close($db);\n  } else {\n    echo \"Error!\";\n  }\n\
  ?> \n```\n\n\n\n\n\n```php\n<?php\n  $Name = \"\";\n  $Email = \"\";\n  $Heading\
  \ = \"\";\n  $Comment = \"\";\n  if (isset($_GET[\"id\"]) &&\n      is_numeric($_GET[\"\
  id\"])) {\n    if ($db = sqlsrv_connect(\n      \"(local)\\\\SQLEXPRESS\", \n  \
  \    [\"Database\" => \"PHP\"])) {\n      if (isset($_POST[\"Name\"]) &&\n     \
  \     isset($_POST[\"Email\"]) &&\n          isset($_POST[\"Heading\"]) &&\n   \
  \       isset($_POST[\"Comment\"])) {\n        $sql = \"UPDATE guestbook SET \n\
  \          heading = ?, \n          entry = ?,\n          author = ?,\n        \
  \  email = ?\n          WHERE id = ?\";\n        $parameter = [\n            $_POST[\"\
  Heading\"], \n            $_POST[\"Comment\"], \n            $_POST[\"Name\"], \n\
  \            $_POST[\"Email\"], \n            $_GET[\"id\"] \n          ];\n   \
  \     if ($command = sqlsrv_prepare($db, $sql, $parameter) &&\n            sqlsrv_execute($command))\
  \ {\n          echo \"<p>Entry changed.</p>\n                <p><a href=\\\"gb-admin.php\\\
  \">Back to overview</a></p>\";\n        } else {\n          echo \"Error!\";\n \
  \       }\n      }\n      $sql = sprintf(\"SELECT * FROM guestbook WHERE id=%s\"\
  , \n        intval($_GET[\"id\"]));\n      $result = sqlsrv_query($db, $sql);\n\
  \      if ($row = sqlsrv_fetch_object($result)) {\n        $Name = $row->author;\n\
  \        $Email = $row->email;\n        $Heading = $row->heading;\n        $Comment\
  \ = $row->entry;\n      }\n      sqlsrv_close($db);\n    } else {\n      echo \"\
  Error!\";\n    }\n  }\n?> \n```\n\n```html\n<form method=\"post\" action=\"\">\n\
