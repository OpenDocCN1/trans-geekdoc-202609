  \n\n\n\n\n\n\n## 39.2 编译\n\n\n\n\n\n\n\n\n第二个原因是，我们选择了一个与其他许多书籍略有不同的概念，因为基于大量的培训课程、会议演讲以及我们在众多客户项目中所积累的经验，我们认为\
  \ `PHP` 这个主题需要以一种特殊的方式来呈现。许多测试者的积极反馈鼓励了我们，使我们希望自己想出了一个连贯且合乎逻辑的概念。\n\n\n书中的所有代码列表都可以在书籍网页上下载。要访问这些内容，请先访问\
  \ [www.rheinwerk-computing.com/6022](http://www.rheinwerk-computing.com/6022)。然后，向下滚动到“产品补充材料”（Product\
  \ Supplements）框并点击“补充材料列表”（Supplements List）。你将看到可以下载的文件以及文件内容的简要描述。点击“下载”（Download）按钮开始下载。根据文件的大小（以及您的互联网连接速度），下载可能需要一些时间。\n\
  \n\n本书的每一章都处理一个可以使用 `PHP` 解决且将会解决的特定技术或问题。在每一章的开头，我们介绍了必要的安装步骤。这意味着你不需要翻遍全书来寻找特定任务的安装步骤；相反，这些步骤始终包含在相应的章节中。唯一的例外是\
  \ `PHP` 的通用安装，你可以在单独的章节中找到（具体来说，是 第 2 章）。\n\n然后是理论部分：你将学习 `PHP` 在章节主题上提供的所有内容。然而，我们并不局限于解释某事在理论上如何运作；我们总是用代码示例来支持这些内容。我们并不是“随机”编写代码，而是对示例进行了多次测试。这意味着，尽管我们无法完全避免可能出现的错误，但我们测试了每一个代码列表。\n\
  \n理论之后通常是实践——本书也不例外。我们相信，简单、清晰的示例非常适合解释问题，但经常会产生一个问题：这些内容是否真的可以在实践中性？因此，在许多章节中，有了一个“应用示例”（Application\
  \ Examples）部分，在其中我们展示了一个或多个稍微复杂一点的应用，这些应用比之前的代码片段具有更高的实践价值。当然，我们不想在这些章节中做得过头，仍然专注于核心内容。所以，不要期望复杂的复杂的\
  \ CSS 样式或过量的 HTML；这本书主要是关于 `PHP` 的。\n\n`PHP` 有着非常优秀的在线手册。你可以在 [www.php.net/manual](http://www.php.net/manual)\
  \ 找到多种语言版本，包括英语。有一个特别聪明的快捷方法：如果你对 `PHP` 编程命令有疑问，只需在浏览器中调用地址 http://php.net/<PHP\
  \ 术语> 即可。在大多数情况下，你将被自动重定向到相应的手册页面，通常甚至是手册的英文版。例如，在第 2 章中，你将学习到名为 `phpinfo()` 的内容。图\
  \ 1 显示了在输入 [`php.net/phpinfo`](http://php.net/phpinfo) 时在浏览器中出现的页面——即你所需的信息。\n\n\
  `PHP` 在线手册也提供 HTML 格式的下载。当前版本也通过 [www.php.net/download-docs.php](http://www.php.net/download-docs.php)\
  \ 以 CHM 格式（Windows 帮助格式）提供，在其他操作系统上也存在相应的显示程序。手册和在线版一样提供多种语言版本（参见图 2）。然而，通常只有英文版是完整且最新的。\n\
  \n![短链接，但包含大量信息](img/img-f0.1.html)\n\n**图 1** 短链接，但包含大量信息\n\n![Windows 帮助格式的 PHP\
  \ 手册](img/img-f0.2.html)\n\n**图 2** Windows 帮助格式的 PHP 手册\n\n章节结构的介绍就是这么多，它在全书中保持一致。提到一致性，你会注意到书中大部分插图都是在\
  \ Windows 操作系统创建的。然而，这并不意味着作者是微软的信徒，也不意味着脚本只在一个操作系统平台上使用过。相反，这与本书的制作过程有关：出版者的模板针对\
  \ Windows 进行了优化，因此我们也在 Windows 中创建了大部分插图。不过，我们使用了几个 Linux 和 Mac 系统以便在这些系统中测试代码，并发现和记录这些系统的特殊功能，特别是在安装部分。如果某些内容实际上只在一种操作系统下运行，我们会予以注明。\n\
  \n另一点重要点：我们等到 `PHP 8.3` 正式发布后才完成这本书，所以你不会在书中找到任何过时的 beta 代码。书中示例的最后测试甚至是在 `PHP 8.3.4`\
  \ 下运行的。这种耐心在之前的多个版本中得到了回报，因为细节在小版本更新中会不断变化。\n\n\n本书分为七部分，每部分处理一个特定的主题领域：\n\n*  \
  \ 第一部分 描述了使用 `PHP` 的必要准备工作。你将学习 `PHP` 是什么以及如何安装它。后者曾是一个主要障碍，这就是为什么我们详细介绍了针对 Linux、macOS\
  \ 和 Windows 的安装。\n*   第二部分 包含了对 `PHP` 的完整介绍。当然，还涵盖了更高级的话以及 `PHP 8.x` 的新功能。你将拥有解决特定任务的必要知识。\n\
  *   第三部分 处理了职业 `PHP` 程序员日常生活中基础 Web 技术，这些技术是核心所在。你将学习如何处理表单、使用 Session 和 Cookie\
  \ 以及通过 `PHP` 发送邮件。\n*   第四部分 展示了数据库——不仅经常与 `PHP` 联系的 `MySQL`，还有一系列其他数据库系统，包括 `SQLite`、`SQL\
  \ Server`、`PostgreSQL`、`Oracle` 和 `MongoDB`。\n*   第五部分 解释了 `PHP` 如何与外界通信。这可以通过文件、HTTP、FTP\
  \ 或 Web 服务实现。我们还展示了与 JavaScript 和 WebSocket 的交互。\n*   第六部分 演示了如何使用 `PHP` 处理各种数据格式：JSON\
  \ 和 XML 文件、图形甚至是 PDF 文档。\n*   第七部分 处理了在后台进行的管理和安全相关主题。你将了解不当编程如何容易给 `PHP` 网站带来安全漏洞，以及你可以采取哪些措施。你还将学习更多关于用户验证和\
  \ `PHP` 配置。\n*   第八部分 处理更高级的主题，如调试 `PHP` 代码和自动化测试。我们还介绍了 `PHP` 包管理的事实标准。最后，你将学习如何自己扩展\
  \ `PHP`。你可以通过编写自己的 `PHP` 扩展或修正 `PHP` 中的错误来实现。\n\n\n`PHP 7` 于 2015 年底发布，这是一个里程碑：自\
  \ 2004 年发布 `PHP 5` 以来第一个新的“大版本”号（!；版本 6 被跳过了）。然而，从纯功能角度来看，并没有太大变化。主要新特性包括 64 位支持和性能的显著提升——在某些情况下提升了\
  \ 100%！这些改进是免费提供的。\n\n\n\n\n\n在随后的 `7.1` 到 `7.4` 版本中，仍然有许多创新。PHP 已经存在了 20 多年，尽管该语言非常成熟，但总会有可以改进或发生根本性变化的领域。向后兼容是一项巨大的资产，但那些多年来一直明确认为不是好主意的语法结构正在逐渐被移除。\n\
  \n现在 PHP 每年发布一个新版本，而且发布时间非常准时。2020 年 11 月发布的 `PHP 8.0` 是一次特别发布。它不仅是五年来第一个大版本号更新，还标志着许多方面的转折点。除了性能的提升和许多新功能外，还有许多大小不一的内部变化。在\
  \ `PHP 8.0` 出版后不久出版的本书的上一个版本中，我们还删除了许多旧习惯，并更新、删除或添加了大量的代码示例。从那以后，PHP 每年都会发布新的子版本——`PHP\
  \ 8.3.0` 已于 2023 年 11 月 23 日发布。\n\n在 PHP `8.1` 到 `8.3` 版本中，有很多许多令人兴奋的新功能和一些变化——这足以让我们对本书进行彻底修订。除了细微的变化外，书的基本结构没有太大变化，但每一章都经过了处理，并且所有内容都是最新的。除其他外，我们还展示了\
  \ Windows 下 PHP 的当前构建系统，使用了用于生成 PDF 的当前库，展示了 PHP 所有相关的新语言特性，使用了最新的库与六个数据库进行通信，还对\
  \ PHP 应用程序的调试和单元测试进行了简要介绍。我们坚信，巨大的努力付出了回报，你手里拿着是一部成熟、经过验证且与时俱进的著作。\n\n即使在内部，关于某些现代语言特性也存在着争议性的讨论。例如，在\
  \ PHP 中，已经有一段时间可以为变量指定固定类型。我们详细地展示了这些选项，但我们决定不在所有的代码示例中全面使用这些特性。我们每天都能看到有些开发者喜欢这些编程选项，而另一些人则忽略了它们。此外，所有章节都涉及\
  \ PHP 的特殊功能。我们不希望让书中每章的核心概念分心，以便让内容更易理解和消化。\n\n还有向后兼容性的问题，我们不想完全忽视它。诚然，我们发现 `PHP\
  \ 8.3` 的一些新功能非常实用，以至于它们也出现在几个示例中，但我们总是指出这一点，以便回溯到旧版本的 PHP 成为可能。\n\n说到示例，你可以在 `http://www.rheinwerk-computing.com/6022`\
  \ 的产品附录部分找到书中的所有代码列表。\n\n`PHP 8.4` 在本书英文版的翻译过程中发布。我们在文中多次提到了它，但本书使用的主要版本是 `PHP 8.3`。我们进行了几次抽检测试，并在\
  \ `PHP 8.4` 下也运行了许多代码示例。\n\n正因为这本书如此详尽并且在许多地方进行了更新，所以我们依赖于你的支持。请告诉我们你对内容有什么看法，可能遗漏了什么（尽管提供了\
  \ 1000 多页内容，我们仍无法包含所有想包含的内容），以及在新版中哪些地方应该有所不同。如果你对某个代码列表有任何问题，或对书有任何疑问，请联系我们。或者访问\
  \ Arrabiata Solutions GmbH 代理的网站（`www.arrabiata.de`），我们该公司的共同所有之一。作为数字代理机构，我们自然也在这里提供\
  \ PHP 开发服务。\n\n本书的这个版本还提供了一种怀旧的回顾：25 多年前，其中作者之一与当时新成立的 Galileo Press 出版社签署了 1 号出版合同。这无疑是一个风险。\n\
  \n\n在 PHP 的漫长旅程中，`8` 版本持续遵循着改进。如果你想快速上手 PHP 及其新特性，请查看本章。在 `7` 版本中，性能优化是一个问题。我们开始介绍\
  \ PHP。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n*   每个文档都由一个 URL\
  \ 标识。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n*   引入了全新的 `match` 语言结构，作为 `switch` 分支更简单的替代方案。更多请参见\
  \ 第 5 章。\n\n\n\nPHP 8 也对内部类型进行了清理，并且许多核心函数也进行了修订：\n\n\n\n\n\n\n\n\n\n- 从 PHP 7.1\
  \ 开始，PHP 允许为常量定义可见性。\n- 从 PHP 7.1 开始，类中的常量也可以标记为 `final`。\n- 错误处理的趋势也更加简洁：`Heredoc`\
  \ 和 `nowdoc` 在 PHP 7.3 中得到了一些简化。\n- 在字符串处理方面，从 PHP 7.1 开始，使用 `[]` 或 `strpos()` 访问字符串字符时允许使用负偏移量。\n\
  - 从 PHP 7.1 开始，`instanceof` 运算符允许字面量作为第一个操作数。\n- 在 PHP 7.2 中，对面向对象进行了一些调整：\n   \
