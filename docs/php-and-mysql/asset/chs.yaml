  \ | 最大持久连接数 | \"-1\" (无限制) |\n\n**表 19.2** \"php.ini\" 中的某些配置参数\n\n如果使用 `mysqlnd`\
  \ 作为客户端库（默认值），则可以在 `mysqlnd` 部分进行进一步的设置，包括表 19.3 中的内容。\n\n| 参数 | 说明 | 默认值 |\n| :---\
