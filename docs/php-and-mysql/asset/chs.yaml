  \ require laminas/laminas-db  \n```\n\n然后系统会询问你是否想将新包保存到配置中（参见图 12.7）。默认答案 1 是一个很好的选择。之后你就可以从应用程序访问\
  \ `Laminas\\Db` 了。\n\n![安装 laminas-db](img/img-f12.7.html) \n\n**图 12.7** 安装 laminas-db\n\
