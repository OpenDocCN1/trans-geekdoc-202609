  \ \n```\n\n输出如下：\n\n```\nArray\n(\n    [0] => PHP\n    [1] => is g\n    [2] => re\n\
  \    [3] => at\n)\n```\n\n*(注：此处已根据原文逻辑完成翻译并去除了示例中重复的干扰说明)*\n\n\n\n\n要将大写转换为小写或反之，你可以过滤\
  \ ASCII 码。PHP 函数 `ord(String)` 返回字母的 ASCII 码；`char(Ascii)` 是对应的函数，它可以将 ASCII 码转换为相应的字符串。然而，PHP\
  \ 开发者已经为你完成了了这项工作：`strtolower(String)` 将字符串中的所有字母转换为小写，而 `strtoupper(String)` 将所有字母转换为大写。其他字符（如数字或特殊字符）。\n\
  \n图 7.11A 可以在 www.asciitable.com 找到常用的 ASCII 表。\n\n```php\n<?php \n  $a = \"PHP\
  \ CMS SHOP\"; \n  echo strtolower($a); \n?>  \n```\n\n**列表 7.15** \"strtolower()\"\
  \ (\"strtolower.php\")\n\n例如，上述脚本生成了以下输出：php cms shop。\n\n### 提示\n\n许多函数（如 `str_replace()`）都有不区分大小写的变体。对于\
  \ `str_replace()`，其变体是 `str_ireplace()`。在字符串比较函数中，你可以通过名称中的 \"case\" 词来识别不区分大小写的\
  \ 54 变体。\n\n此处还包含两个辅助函数：\n\n* `ucfirst(String)` 如果字符串的第一个字符是小写字母，则将其转换为大写。\n* `ucwords(String)`\
  \ 使所有单词的首字母大写，但当然仅当它们之前是小写时。\n\n与大小写相关的各种函数的一个可能的实际应用是论坛的“尖叫保护”（scream protection）。这意味着函数会检查字符串中是否有许多大写字母，这表明用户正在大叫。如果是这样，则转换该字符串。\n\
  \n下面的简单函数实现了此功能：首先，将单个单词拆分为数组 55。除了第一个字母外，每个单词的每个字母都会经过处理。使用 `ord()` 函数进行大小区分，检查相应字符的\
  \ ASCII 码是小写字母还是大写字母，并在每情况下增加计数器。其他字符被忽略。最后，比较计数器。你可以自由选择在此设置的值。如果大写字母多小写字母，我们将字符串转换为小写字母并将单词首字母转换为大写。\n\
  \n```php\nfunction screamprotection($string) {\n  $words = str_word_count($string,\
  \ 1);\n  $big = 0;\n  $small = 0;\n  foreach($words as $word) {\n    for ($i = 1;\
  \ $i < strlen($word); $i++) {\n      $ascii = ord(substr($word, $i, 1));\n     \
  \ if ($ascii >= 65 && $ascii <= 90) {\n        $big++;\n      } elseif ($ascii >=\
  \ 97 && $ascii <= 122) {\n        $small++;\n      }\n    }\n  }\n  if ($big > $small)\
  \ {\n    return ucwords(strtolower($string));\n  } else {\n    return $string;\n\
  \  }\n}  \n```\n\n**列表 7.16** 简单的尖叫保护\n\n与大小写相关的各种函数的一个可能的实际应用是论坛的“尖叫保护”。这意味着函数会检查字符串中是否有许多大写字母，这表明用户正在大叫。如果是这样，则转换该字符串。\n\
