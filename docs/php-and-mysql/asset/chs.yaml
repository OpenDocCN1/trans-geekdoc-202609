  ]` 或 `$_POST[\"Fieldnamey\"]` 返回点击按钮时鼠标的（相对）y 坐标（如果表单是通过键盘发送的，则返回 0）。\n\n## 13.3\
  \ 表单验证\n\n你现在知道如何访问表单数据；后续处理（如保存到数据库）将在其他章节介绍。然而，对于大型网站还有另一个重要应用：表单数据的验证。很多时候，只有完整的表单才有意义，例如注册。此外，某些表单条目受特定条件的限制，例如电子邮件地址（简单来说必须包含恰好一个\
  \ `@` 符号）。在网络代理公司中，这些都是为了开发者准备，这就是为什么我们在表单中添加了一些检查。\n\n使用一个 `$ok` 变量进行检查。它的初始值为\
  \ `true`，但如果发生错误则会变为 `false`。在检查结束时，根据 `$ok` 变量决定做什么：要么显示错误信息并再次显示表单，要么——如上一个示例——输出表单中输入的所有内容。\n\
  \n### 13.3.1 文本字段（字段）\n\n文本字段有一个特殊之处：即使其中没有输入任何内容，网页浏览器也会传输字段中的数据，即使它是一个空字符串。在这方面，`$_GET[\"\
  \"]` 或 `$_POST[\"\"]` 是空的但存在的。因此，仅用 `isset()` 进行检查是不够的。你必须将值与空字符串进行比较，或者更好的是先调用\
  \ `trim()`。这样即使只输入了空格，表单字段也会被认为是空的。\n\n```html\n<body>\n```\n\n```php\n<?php\n \
  \ $ok = false;\n  if (isset($_POST[\"Submit\"])) {\n    $ok = true;\n    if (!isset($_POST[\"\
  FirstName\"]) ||\n        !is_string($_POST[\"FirstName\"]) ||\n        trim($_POST[\"\
  FirstName\"]) == \"\") {\n      $ok = false;\n    }\n    if (!isset($_POST[\"LastName\"\
  ]) ||\n        !is_string($_POST[\"LastName\"]) ||\n        trim($_POST[\"LastName\"\
  ]) == \"\") {\n      $ok = false;\n    }\n    if (!isset($_POST[\"Email\"]) ||\n\
  \        !is_string($_POST[\"Email\"]) ||\n        trim($_POST[\"Email\"]) == \"\
  \") {\n      $ok = false;\n    }\n    if (!isset($_POST[\"Promo\"]) ||\n       \
  \ !is_string($_POST[\"Promo\"]) ||\n        trim($_POST[\"Promo\"]) == \"\") {\n\
  \      $ok = false;\n    }\n    if (!isset($_POST[\"Comments\"]) ||\n        !is_string($_POST[\"\
  Comments\"]) ||\n        trim($_POST[\"Comments\"]) == \"\") {\n      $ok = false;\n\
  \    }\n    if ($ok) {\n?>\n```\n\n```html\n<h1>Form Data</h1>\n```\n\n```php\n\
  <?php\n  // ...\n?>\n<?php\n    }\n  } \n  if (!$ok) {\n?>\n```\n\n```html\n<h1>World\
  \ Cup Ticket Service</h1>\n<form method=\"post\">\n...\n</form>\n```\n\n```php\n\
  <?php\n  }\n?>\n```\n\n```html\n</body>\n```\n\n列表 13.9 所有文本字段均为必填字段（摘自 \"form-validation-textfields.php\"\
  ）\n\n让我们解释这里发生了什么：最初，假设必须显示表单，这就是为什么 `$ok` 被 设置为 `false`。相反，如果表单刚刚发送，那么 PHP 脚本最初假设一切都是正确的（`$ok\
  \ = true`）。如果没有错误（`if ($ok)`），则输出表单数据。然而，如果发生了错误（`if (!$ok)`），则输出表单本身。当然，如果直接调用页面而不发送表单，也会发生这种情况。这就是为什么在脚本结尾有一个独立的\
  \ `if (!$ok)` 查询。\n\n### 提示\n\n发生错误时，会直接显示表单——而没有任何提示发生了错误。在 `if ($ok)` 之前的这段代码片段可以修复这个问题：\n\
  \n```php\nif (!$ok) { \n  echo \"<p><b>表单不完整</b></p>\"; \n} \n```\n\n### 13.3.2\
  \ 单选按钮\n\n如果一组单选按钮是必填字段，则必须选择其中一个按钮。可以通过像下面的列表所示对 `$_GET[\"Field name\"]` 或 `$_POST[\"\
