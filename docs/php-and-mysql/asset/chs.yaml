  \ 相同的结果，但该搜索是不区分大小写的。\n\n```php\n$a = \"The blue riders.\"; \necho stripos($a, \"\
  Blue\");  \n```\n\n因此也返回 4，尽管 `blue` 标签是以小写字母 **b** 开头的。\n\n### 注意\n`strrpos(String,\
  \ search string)` 是 `strpos()` 的对应函数。在这里，搜索从后往前运行（通过名称中的 `r` 代表 \"right\" 可以识别）。因此，结果是搜索字符串的最后一次出现。`strripos(String,\
  \ search string)` 的工作方式与 `strrpos()` 相似，只是它不区分大小写。\n\n### 剩余字符串\n`strstr(String,\
  \ search string)` 返回从搜索字符串第一次出现开始的字符串剩余部分。搜索字符串包含在剩余字符串中。\n\n```php\n<?php \n  $a\
  \ = \"The blue riders.\"; \n  echo strstr($a, \"blue\"); \n?>  \n```\n\n**列表 7.18**\
