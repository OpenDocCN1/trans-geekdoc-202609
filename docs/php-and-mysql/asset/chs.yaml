  \ 文件格式的解释都不同，无法设置电子书文档以满足所有用例的要求。\n\n此外，并非所有的阅读设备都提供相同的文本显示功能，而且并非所有功能都能正常工作。最后，作为用户的您也通过设置定义了书籍内容在屏幕上的显示方式。\n\
  \n目前设备制造商提供和处理的 `EPUB` 格式实际上主要适用于纯文本文档显示（如小说）。一旦技术性文本包含图表、表格、脚注、旁注或编程代码，就会出现困难。更多信息请参阅屏幕显示说明提供了有关我们当前出版计划的详细一手信息。在这里，您还可以轻松订购我们所有的书籍和电子书。有关\
