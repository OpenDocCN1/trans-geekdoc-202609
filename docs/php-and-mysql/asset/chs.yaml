  \ date, entry FROM entry  \n```\n\n| name || email || date || entry |\n| --- | ---\
  \ | --- | --- |\n| Christian || christian@xy.zzz || 2025-01-01 || A warm welcome!\
  \ The guestbook is open. |\n| --- | --- | --- | --- |\n| Tobias || tobias@xy.zzz\
  \ || 2025-01-02 || This isn't exactly the place to be ... |\n| --- | --- | --- |\
  \ --- |\n| Christian || christian@xy.zzz || 2025-01-03 || There is some truth in\
  \ that. |\n\n**表 17.5** “SELECT” 查询结果\n\n结果也可以进行排序。此对应的 SQL 关键字是 `ORDER BY`，后面跟着要排序的列。排序方向也可以指定：`ASC`\
