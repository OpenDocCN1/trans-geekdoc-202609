  \ />  \n```\n\n列表 13.18 选择列表预填充（节选“form-prefill-selectlists”）\n\n\n\n\n\n对于多选择列表（`<select\
  \ multiple>`），这会稍微困难一些，因为其中不只是包含一个值，而是有多个可能的值。幸运的是，PHP 包含了 `in_array()` 函数，它可以检查一个元素是否存在于数组中。多选择列表的预填充工作原理完全相同：对于每个元素，都必须检查该值是否在从\
  \ `$_GET` 或 `$_POST` 读取的数组中。\n\n### 注意\n\n现在你也理解了为什么当用户没有选择任何内容时我们将 `$Section` 声明为一个空数组。`in_array()`\
  \ 函数不仅可以作用于数组，也可以作用于空数组。因此，我们通过前瞻性编程避免了在此时点出现错误消息。\n\n```php\nDesired section in\
