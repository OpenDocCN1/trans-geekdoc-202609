  （注：原文中存在大量重复内容，译文已根据逻辑进行了去重处理）\n\n\n\n反射（Reflection）存在于某些面向对象的编程语言中。它最简单的翻译是“照镜子看”。反射\
  \ API（Reflection API）由一系列类组成，用于更仔细地检查类、方法和属性——也就是说，对它们进行镜面检查并重用结果。这是在运行时完成的，因此你可以直接在代码中对结果做出反应。\n\
  \n要访问反射 API，请创建相应反射类的对应对象，例如，对于你使用的属性，可以使用 `ReflectionProperty`。然后你就可以使用该类的方法。在下面的示例中，我们使用了\
  \ `getValue()` 方法：\n\n```\n$MyComputer = new Computer();\n$refProp = new ReflectionProperty(\"\
  Computer\", \"cpu\");\necho $refProp->getValue($MyComputer);  \n```\n\n这里是另一种使用\
  \ `ReflectionClass` 的方法，它随后访问了一个方法：\n\n```php\n<?php\n  class Computer {\n    private\
  \ $cpu = \"The CPU\";\n    public function setCPU($cpu) {\n      echo 'The computer\
  \ has ' . $cpu;\n    }\n  }\n$refClass = new ReflectionClass('Computer');\n$computer\
  \ = new Computer();\n$method = $refClass->getMethod('setCPU');\necho $method;\n\
  echo '<br />';\n$method->invoke($computer, '4 CPUs');\n?>  \n```\n\n**列表 11.59**\
  \ \"ReflectionClass\" 的用法 (\"reflection\\_object.php\")\n\n在这里，通过反射类执行并检查了一个方法。使用\
  \ `invoke()` 方法进行执行。还存在 `invokeArgs(Object, Array)`，它可以以数组的形式传递多个参数（参见图 11.48）。\n\
  \n![方法先进行检查，后进行执行](img/img-f11.48.html) \n\n**图 11.48** 方法先进行检查，后执行\n\n### 注意\n\n\
  你可以在 [`s-prs.co/v602274`](http://s-prs.co/v602274) 了解更多。\n\n### 11.4.11 SPL\n\n\
  标准 PHP 库（SPL）基于 C++ 的标准模板库（STL）。这个库是什么？它是一组定义严格的类和接口，用于迭代器和其他重要的标准任务。迭代器是一种用于遍历其他元素的编程结构。最简单的迭代器类型是循环，正如你在第\
  \ 11.4.8 节中看到的那样。在这里我们从类似的示例开始，然后扩展到包含 SPL 功能。\n\n下面的示例将一个用逗号分隔的值的字符串拆分为若干单独的值并对它们进行遍历。图\
  \ 11.49 显示了该示例的输出：\n\n```php\n<?php\n  $text = 'comma,separated,values,in bulk';\n\
  \  $parts = explode(',', $text);\n  foreach ($parts as $value) {\n      echo $value\
  \ .'<br />';\n  }\n?>  \n```\n\n![值的分行输出](img/img-f11.49.html) \n\n**图 11.49** 值的分行输出\n\
  \n迭代器是 `foreach` 循环，它遍历由 `explode()` 创建的数组。然而，这种类型的实现并不容易替换或更改。你对迭代器的效果也几乎没有影响。这就是为什么存在迭代器接口，你可以使用它来创建自己的迭代器类。\n\
  \n但首先，你应该查看其背后的目标。下面的代码创建了 CSV 类的一个新对象。它接收逗号分隔的值。然后可以使用 `foreach` 对该对象进行简单的迭代：\n\
  \n```\n$text = 'comma,separated,values,in bulk';\n```\n\n\n\nSPL 有两个类，`FilterIterator`\
  \ 和 `LimitIterator`，它们专门用于在迭代器遍历期间过滤。换句话说，它们为内部迭代器形成了一个外层迭代器。要设置这样的场景，你必须稍微修改 `代码列表\
  \ 11.60`。在 `CSV` 类的 `getIterator()` 调用中，你使用外层迭代器（这里是 `FilterIterator`），并将内部迭代器作为第一个参数。第二个参数是作为过滤器的字符串：\n\
  \n```php\npublic function getIterator() {\n  return new CSVFilterIterator(new CSVIterator($this->csv),\
  \ 'comma');\n}  \n```\n\n`FilterIterator` 在 `CSVFilterIterator` 类中实现。它继承自 `FilterIterator`，并且只需要一个\
  \ `accept()` 方法，你在其中执行过滤操作。\n\n在构造函数中，传递内部迭代器的迭代器对象并调用构造函数。你还将过滤值保存在属性中：\n\n```php\n\
  \  class CSVFilterIterator extends FilterIterator {\n    private $value;\n\n   \
  \ public function __construct(CSVIterator $CSVIterator, $value) {\n      parent::__construct($CSVIterator);\n\
  \      $this->value = $value;\n    }  \n```\n\n接下来是过滤操作。要访问内部迭代器中当前迭代的元素，使用 `getInnerIterator()`\
  \ 方法，然后使用 `current()` 获取当前元素的值（或使用 `key()` 获取位置）：\n\n```php\n    public function\
  \ accept() {\n      $ele = $this->getInnerIterator()->current();\n      if (strpos($ele,\
  \ $this->value) !== 0) {\n        return true;\n      } else {\n        return false;\n\
  \      }\n    }\n  }  \n```\n\n在这种情况下，过滤非常简单。所有带有逗号的值都被过滤掉了。然而，这个示例清楚地展示了它的用处。你有一个迭代器，然后可以从外部对其进行过滤——即通过另一个类。\n\
  \n下面的列表显示了带有高亮 SPL 元素的完整代码。`图 11.50` 显示了输出。\n\n```php\n<?php\n  class CSVIterator\
  \ implements Iterator {\n    private $csv;\n    private $position;\n\n    public\
  \ function __construct($csv) {\n      $this->csv = explode(',', $csv);\n    }\n\
  \    public function next(): void {\n      $this->position+= 1;\n    }\n    public\
  \ function rewind(): void {\n      $this->position = 0;\n    }\n    public function\
  \ key(): int {\n      return $this->position;\n    }\n    public function current():\
  \ string {\n      return $this->csv[$this->position];\n    }\n    public function\
  \ valid(): bool {\n      return $this->position <count($this->csv);\n    }\n  }\n\
  \n  class CSVFilterIterator extends FilterIterator { \n  private $value;\n\n  public\
  \ function __construct(CSVIterator $CSVIterator, $value) { \n    parent::__construct($CSVIterator);\n\
  \    $this->value = $value;\n  }\n  public function accept(): bool {\n    $ele =\
  \ $this->getInnerIterator()->current();\n    if (strpos($ele, $this->value) !==\
  \ 0) {\n      return true;\n    } else {\n      return false;\n    }\n  }\n\n  class\
  \ CSV implements IteratorAggregate {\n    private $csv;\n\n    public function __construct($csv\
  \ = '') {\n      $this->csv = $csv;\n    }\n\n   public function getIterator():\
  \ CSVFilterIterator {\n    return new CSVFilterIterator(new CSVIterator($this->csv),\
  \ 'comma');\n  }\n\n  $text = new CSV('comma,separated,values,in');\n\n  foreach\
  \ ($text as $key => $value) {\n      echo $value .'<br />';\n  }\n?>\n```\n\n`代码列表\
  \ 11.61` 带有高亮的 SPL 元素。`图 11.50` “逗号”输出\n\n\n\n这意味着你通过这些行代码定义了 `Installation` 属性。你使用构造函数为该属性定义了一个类型为\
  \ `string`、名为 `value` 的参数。\n\n现在要使用该属性，使用相同的语法，只不过你可以插入名称并为参数的使用定义相应的值：\n\n```php\n\
  #[Installation(value: 'Mac')]\nclass Computer {\n\n}  \n```\n\n参数的定义方式与此处的具名参数方式相同，但也适用于普通函数参数。值和常量都可以作为参数：\n\
  \n```php\n#[Installation('Mac')]\nclass Computer {\n\n}  \n```\n\n最后几行展示了类中的用法，但相同的方法也适用于方法。同样，首先是定义：\n\
  \n```php\n#[Attribute]\nclass Operation {\n  public function __construct(public\
  \ string $type = 'Start') {\n  }\n}  \n```\n\n紧接着是部署（使用）：\n\n```php\n#[Operation(type:\
  \ 'shutdown')]\nfunction shutdown(int $seconds = 20) {\n\n}  \n```\n\n一个属性可以使用多次，并且可以用于所有类型的元素，例如类、方法、函数和属性。\n\
  \n### 注意\n\n可以将属性缩小为仅一种用途——例如，仅用于一个类、方法、函数或属性。通过 `TARGET_CLASS`、`TARGET_METHOD`、`TARGET_FUNCTION`\
  \ 和 `TARGET_PROPERTY` 常量可以实现这一点。这些值在属性的定义中指定：\n\n```php\n#Attribute(Attribute::TARGET_METHOD\
  \ | Attribute::TARGET_FUNCTION)] \n```\n\n在这里可以使用 `|` 组合多种用途。如果没有定义任何用途，默认值为 `TARGET_ALL`。\n\
  \n默认情况下，属性可能只能定义一次，且每个使用对应一个值。你可以通过 `IS_REPEATABLE` 常量来更改这一点：\n\n```php\n#Attributes(Attributes::IS_REPEATABLE)]\
  \ \n```\n\n那么插入看起来如下所示，例如：\n\n```php\n#[Installation('Windows')]\n#[Installation(value:\
  \ 'Mac')]\nclass Computer { \n```\n\n`IS_REPEATABLE` 可以与 `|` 以及其他常量结合以缩小用途。\n\n\
  到此结束了属性的定义和使用。现在我们想要通过反射 API 访问属性。为此的核心方法是 `getAttributes()`。它返回一个包含属性的数组。以下是类的调用示例：\n\
  \n```php\n$refClass = new reflectionClass(Computer::class);\ndumpAttributes($refClass->getAttributes());\
  \  \n```\n\n这提供了类的属性。在下一步，我们访问方法并检索它的属性：\n\n```php\ndumpAttributes($refClass->getMethod('shutdown')\n\
  ->getAttributes(operation::class));  \n```\n\n我们使用这个简单的函数来输出实际的输出：\n\n```php\nfunction\
  \ dumpAttributes($attributes) {\n  foreach ($attributes as $attribute) {\n    var_dump($attribute->getName());\n\
  \    var_dump($attribute->getArguments());\n    var_dump($attribute->newInstance());\n\
  \  }\n }  \n```\n\n下一个示例展示了带有两个属性的完整脚本。在这个脚本中，我们使用了严格类型，你可能在 第 6 章 中记得它。这意味着，例如\
  \ PHP 中属性定义和属性使用之间值之间的类型差异将被报告为 `TypeError`。\n\n```php\n<?php\n  declare(strict_types=1);\n\
  \n  #[Attribute]\n  class Installation {\n    public function __construct(public\
  \ string $value) {\n  }\n\n  #[Attribute]\n  class Operation {\n    public function\
  \ __construct(public string $type = 'Start') {\n    }\n  }\n\n  #[Installation('Windows')]\n\
  \  #[Installation(value: 'Mac')]\n  class Computer { \n  }\n\n  #[Operation(type:\
  \ 'shutdown')]\n  function shutdown(int $seconds = 20) {\n    echo \"Shutting down\
  \ in \" . $seconds . \" seconds\";\n  }\n\n  function dumpAttributes($attributes)\
  \ {\n    foreach ($attributes as $attribute) {\n      var_dump($attribute->getName());\n\
  \      var_dump($attribute->getArguments());\n      var_dump($attribute->newInstance());\n\
  \    }\n  }\n\n  $refClass = new reflectionClass(Computer::class);\n  dumpAttributes($refClass->getAttributes());\n\
  \n  dumpAttributes($refClass->getMethod('shutdown')\n  ->getAttributes(operation::class));\n\
  ```\n\n\n\n当然，你也可以冒险，简单地为类分配一个短名称——并寄希望该名称不会被其他软件组件使用。例如，PEAR 项目在这一点上就曾栽了大跟头，因为那里一直有一个名为\
  \ `Date` 的类——在 PHP 中也是如此。猜猜最后谁赢了？没错，是 PEAR，而它已经被宣告“死亡”了！PHP 在一个版本后将该类重命名为 `DateTime`。\n\
  \n解决这种局面的一种可能方法是使用命名空间（namespaces）。这允许你指定一个特定的区域，将相应 PHP 文件的代码放置在一个命名的保护伞下。在这个命名空间内，你可以使用简短简洁的类名，因为相同的类名也可以在其他（自然地、名称不同的）命名空间中使用。\n\
  \n### 11.5.2 使用命名空间\n\n命名空间支持最重要的术语是 `namespace`。刚开始最大的危险源是什么？`namespace` 必须是文件中的第一个语句（当然是在\
  \ `<?php` 之后）。换句话说，在它之前不能有其他的 PHP 代码或 HTML 输出。\n\n在 `namespace` 之后，输入命名空间的名称。这之后适用于整个\
  \ PHP 文件。这意味着以下三个 PHP 元素将成为命名空间的一部分，并通过命名空间名称进行访问（稍后会详细介绍）：\n\n*   类\n*   函数\n*\
  \   常量\n\n下面的列表显示了一个命名空间的简单示例。\n\n```\n<?php\n  namespace myNS;\n\n  const NAME\
  \ = 'Alpha';\n  function sayHello($name) {\n    echo \"Hello $name!\";\n  }\n?>\
  \  \n```\n\n**列表 11.64** 简单的命名空间 (\"namespace1.inc.php\")\n\n`NAME` 常量和 `sayHello()`\
  \ 函数现在都是 `myNS` 命名空间的一部分。\n\n### 提示\n\n你也可以在一个文件中使用多个命名空间。要做到这一点，只需按照以下模式插入大括号即可：\n\
  \n```\nnamespace NS1 {\n  /* .*/\n}\n\nnamespace namesNS2 {\n  /* .*/\n} \n```\n\
  \n### 11.5.3 使用命名空间\n\n使用命名空间有几种方法。让我们从最简单而显见的变体开始。首先，必须加载带有命名声明的文件：\n\n```\ninclude\
  \ 'namespace1.inc.php';  \n```\n\n然后你可以通过 `myNS\\sayHello()` 访问函数，通过 `myNS\\NAME`\
  \ 访问常量，使用反斜杠作为分隔符。\n\n```php\n<?php\n  include 'namespace1.inc.php';\n\n  myNS\\\
  sayHello(myNS\\NAME);\n?>  \n```\n\n**列表 11.65** 使用命名空间 (\"namespace1.php\")\n\n\
  ![通过命名空间问候](img/img-f11.54.html) \n\n**图 11.54** 通过命名空间问候\n\n### 注意\n\n命名空间名称本身可以由多个单独标识符组成，它们之间用反斜杠分隔——例如：\n\
  \n```\nnamespace Rheinwerk\\Marketing\\Newsletter\\ContactManagement; \n```\n\n\
  从 PHP 8 开始，也可以使用嵌套命名空间（de namespaces）。然而，命名空间的使用非常简单，但在于细节。\n\n### 11.5.4 确定当前命名空间\n\
  \n首先，必须加载带有命名声明的文件。\n\n```php\n<?php\n  namespace myNS;\n\n  const NAME = 'Alpha';\n\
  \  function sayHello($name) {\n    echo \"Hello $name!\";\n  }\n?>  \n```\n\n###\
  \ 11.5.5 通过别名使用命名空间\n\n如果你通过 `myNS\\Greeting` 导入此命名空间，你就创建名为 `Greeting` 的别名。你就可以完全不带前缀地使用它。\n\
  \n```php\n<?php\n  include 'namespace4.inc.php';\n\n  use myNS\\Greeting;\n\n$b\
  \ = new Greeting('Charlie');\n  $b->sayHello();\n?>  \n```\n\n\n\n\n```\nuse const\
  \ myNS\\{versionMajor, versionMinor as minor} \n```\n\n最后，现在通过 `use` 导入一个组时，可以在末尾添加一个额外的逗号了，这与函数类似（请参见第\
  \ 6 章）。这种潜在的意义在代码格式化时会体现出来：\n\n```\nuse const myNS\\{\n  versionMajor,\n  versionMinor,\n\
  \  minor,\n} \n```\n\n假设在稍后的某个时间点导入了一个额外的常量：\n\n```\nuse const myNS\\{\n  versionMajor,\n\
  \  versionMinor,\n  minor,\n  major, \n} \n```\n\n只有**粗体**显示的那行是新加（因为你需要的逗号之前就已经在那里了）。在版本控制系统中，只有这一行会被显示为已更改。从纯功能角度来看，这没有区别，但这是一个微小但重要的细节。\n\
  \n# 12 设计模式：MVC 及其他\n\n凭借丰富的编程经验，某些模式会被反复地使用。其中一些模式现在已经成为定式。本章将介绍其中一些模式，并简要介绍 Laminas\
  \ 框架。\n\n架构和软件开发之间有什么关系？比初看之下要紧密得多。两者都是关于如何从较小和较大的构建块构建一个完整的、复杂的“实体”——当然，这是一种简化的说法。如今，源自架构的方法甚至被认为是许多开发项目的核心组件。\n\
  \n奥地利建筑师克里斯托弗·历山大（Christopher Alexander）是 1977 年出版的著作《模式语言》（*A Pattern Language*）的主要作者。除此之外，他在书中引入了模式语言的概念。一种模式语言包含了特定主题领域内反复出现的问题和相应的解决方案（模式）。每个模式都有一个名称。\n\
  \n这种想法背后的逻辑是：与其一次又一次地重新发明轮子，不如使用模型语言来求助于一个可以反复使用的解决方案目录。对单个解决方案使用标准化术语也简化了通信，因为每个参与者都清楚某些术语的含义。来自历山大模型目录的示例包括公交站和联排房屋。\n\
  \n大约 10 年后，这个主题被引入编程领域，至少在科学领域如此。然而，这种方法直到 Erich Gamma、Richard Helm、Ralph Johnson\
  \ 和 John Vlissides 在 1994 年出版《设计模式》（*Design Patterns*）一后才真正成为主流。这本书描述了许多可以解决软件开发设计阶段问题的模式。另一本流行的出版物是\
  \ Martin Fowler 的《企业应用架构设计模式》（*Patterns of Enterprise Application Architecture*），它在八年后出现。\n\
  \n在科学和实践中，针对不同的模式有不同的表示法。然而，大多数模式的共同点是：模式有一个名称并且解决了一个问题。说起科学：模式的实际效果非常难以证明；因此，关于模式的出版物相对较少。在这，，的使用始终包含少量的信仰和信念。\n\
  \n本章介绍了三个选作示例的样本。由于本书侧重于 PHP，我们将对该主题进行简要概述。然而，为了建立与编程语言的桥梁并同时提供实用的参考，我们展示了相应模式在\
  \ Laminas 框架中是如何使用的。\n\n## 12.1 Laminas\n\nLaminas 框架是现在无数 PHP 框架之一。它背后拥有一段充满故事的历史：它始于\
  \ Zend 公司，当时该公司在 PHP 的进一步发展中仍起着主要作用。2019 年底，代码库被转移到 GitHub 并合并到新的 Laminas 项目中。新框架现在已经在\
  \ Linux 基金会的伞下找到了新家，并正在被积极地进一步开发。\n\n决定是完全依赖一个框架还是只使用部分部分一直是重要的，但这个讨论不是本书的主题。相反，Laminas\
  \ 作为某些设计模式的演示对象。\n\nLaminas 本身通过 `Composer` 安装，它是一个包和依赖管理器，我们将在后文中详细介绍它。Laminas\
  \ 本身作为某些设计模式的演示对象。如果你还没有使用 `Composer`，如果你还没有安装 `Composer`，我们将在第 38 章](#38_001.html#h38)\
  \ 中详细介绍它。`Pyrus` 曾由 PEAR 项目支持，但在 Laminas 中并不存在。\n\n![Laminas 首页](img/img-f12.html)\n\
  \n**图 12.1 首页**\n\nLaminas 项目网站 https://getlaminas.org 提供了所有子项目的详细文档（请参见第 38 章](#38_001.html#h38)）。如果你感兴趣，关于\
  \ Zend Framework 的当前信息可以在 https://framework.zend.com 获取。\n\n## 12.2 MVC\n\n第一种模式被称为模型-视图-控制器或\
  \ `MVC`。这种模式被越来越多地应用于应用程序。尽管它也可以用于较小的应用程序，但只有在达到一定规模时才有意义。\n\nMVC 设计模式解决了什么问题？Web\
  \ 应用程序！通常一个网站的内容包含在一个文件中：所有的 PHP 代码、HTML 结构以及 CSS 设计的布局。诚然，本书中的示例采用了非常相似的方法，这是为了教学，以便一目了然。然而，在复杂的项目中，会出现问题。例如数据库连接。如果此信息直接包含文件中，所有访问数据库的文件都需要它。因此，数据通过复制和粘贴在文件之间传输。尽管这种方法运行良好，但很容易出错，而且连接信息发生变化时会导致灾难。\n\
  \n这个问题可以通过包含文件在一定程度上解决。但一旦项目达到一定规模，会出现其他烦恼。一种可能的解决方案是 MVC 模式。它包含三个组件，每个组件都有不同的职责（具体实现取决于技术和口味）：\n\
  \n- 模型：包含应用程序数据——例如来自数据库。模型的一种特殊形式是视图模型，它专门供视图使用（参见下文）。\n- 视图（演示）：显示来自模型的信息。本质上由\
  \ HTML 模板组成。\n- 控制器：接收用户的 HTTP 请求并控制各种视图。\n\n图 12.2 展示了 MVC 的概览。图中展示了实践中常见的结构：视图不知道控制器，模型不知道它属于哪个视图。\n\
  \n![模型-视图-控制器模式](img/img-f12.2.html)\n\n**图 12.2 模型-视图-控制器模式**\n\n\n\n\n\n```\n\
  composer create-project -s dev laminas/laminas-mvc\n```\n\n随后 Composer 会加载一系列组件并向你提出几个问题。第一个是是否想要最小化安装，输入\
  \ `Y` 是，后续的输入 `N` 否。\n\n在可能新创建的 `vendor` 目录中，`autoload.php` 文件已准备就绪，以下指令使 Laminas\
  \ 可用（十六进制值对你来说肯定不同，我们不打印代码，这会报错）：\n\n```php\n<?php\n\n // autoload.php 由 Composer\
  \ 生成\n\nrequire_once __DIR__ . '/composer/autoload.php';\n\n return ComposerAutoloader();\
