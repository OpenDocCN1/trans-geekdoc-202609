  \ 路由 (`module/Application/config/module.config.php`)\n\n\n\n另一种模式是适配器（adapter）。这通常是一个具有固定接口的类，用于通信。适配器反而将请求转发给该接口的底层对象，而这些对象可能具有完全不同的接口。这种情况在\
  \ `Laminas`中就会出现，例如处理数据库时。`Laminas\\Db\\Adapter\\Adapter` 类就是为此而存在的；具体使用的数据库通过配置来指定。通用适配器可以处理一系列兼容的数据库系统。另一方面，我们的应用程序代码“只需要”与适配器交互即可。这样做的好处是，可以更换特定数据库的对象（因为适配器处理了通信，而不是我们的代码），适配器本身也可以被更换（得益于固定接口）。\n\
  \n以下指令允许你与 SQLite 数据库进行操作。“配置字符串”（`Pdo_Sqlite`）指定了使用的数据库驱动：\n\n```\n$db = new \\\
