  \ 1，所以结果是 1。\n\n```\n0b0010\n```\n\n这对应整数 2。表 5.5 显示了所有位运算符的简单二进制示例。要在 PHP 中实现这些示例，你必须以整数的形式编写二进制模式。\n\
