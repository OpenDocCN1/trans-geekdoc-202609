  </html>  \n```\n\n列表 22.15 编辑访客板条目 (\"gb-edit.php\")\n\n# 23 PostgreSQL\n\n\n\n\
  另一个流行的开源数据库是 PostgreSQL。因此，有一个对应的 PHP 扩展来访问它并不令人意外。\n\nPostgreSQL 数据库（`www.postgresql.org`）最初由加利福尼亚大学伯克利分校开发。该软件赢得了认可，但直到源代码作为开源发布后才取得了成功。\n\
  \n许多开发者避开 PostgreSQL 是因为认为它不稳定且容易出现数据损坏。幸运的是，这些都是过时信息；遗憾的是，它们才缓慢从开发者社区记忆中消失。PostgreSQL\
  \ 已经发展成为非常优秀的数据库。当然，它的某些方面与那些老牌的霸者不同，但这绝不是排除它的的标准。\n\n然而，在 Windows 上使用 PostgreSQL\
  \ 曾有一一段时间内是有问题的；必须安装额外的包，其中一些甚至被标记为弃用——即过时。这现在也成了过去式——尽管是最近才。\n\nPostgreSQL 是一个强大的数据库，单单它就能写一本书。与其他数据库章节一样，我们将关注标准任务，以便你使用\
  \ PostgreSQL 实现项目，然后介绍该数据库的一些精选特长，以激励你继续实验。\n\n## 23.1 准备工作\n\n开始初总是有安装。各种操作系统的二进制版本可以直接在\
  \ PostgreSQL 网站 `www.postgresql.org/download` 上找到。这使得安装变得轻而易举（这在过去并不如此）。不要惊讶图形化安装程序是从\
  \ `https://enterprisedb.com` 获取的——这是完全正确的。下载安装文件并点击完成安装。特别是在指定 PostgreSQL 的数据目录时，请确保数据库对该目录具有写权限。对于\
  \ Windows 程序目录（参见图 23.1 中的默认值），这种权限并不是自动具备的。\n\n![Windows 安装程序的安装选项](img/img-f23.1.html)\n\
  \n图 23.1 Windows 安装程序的安装选项\n\n对于 Unix/Linux，要么有预配置的包，或者发行版本身已经配备了数据库。如果你想手动设置软件，安装过程与往常一样。也就是说，解压下载的存档，然后执行魔法三部曲（最后一步\
  \ `make install` 显然需要 root 权限）：\n\n```\n./configure \nmake \nmake install  \n```\n\
  \n然后就是配置时间了。首先创建一个用户，就像 Windows 安装程序所的那样：\n\n```\nadduser postgres  \n```\n\n现在创建一个名为\
  \ data 的属于 postgres 用户的子目录：\n\n```\ncd /usr/local/pgsql\nmkdir data \nchown postgres\
  \ data\n```\n\n然后初始化数据库：\n\n```\n/usr/local/pgsql/bin/initdb -D /usr/local/pgsql\n\
  ```\n\n一旦完成，就可以启动 postmaster 守护进程。这样做如下：\n\n```\n/usr/local/pgsql/bin/postmaster\
  \ -D /usr/local/pgsql/data &\n```\n\n### 注意\n\n最后一步是创建一个将使用的数据库。如果你使用的是 Unix/Linux，创建数据库：\n\
  \n```\ncreatedb \n```\n\nWindows 用户还有一个额外的选项：在 PostgreSQL 组中有 pgAdmin 4。pgAdmin\
  \ 4 是一个强大的图形化、基于 Web 的 PostgreSQL 工具。（它非常适合检查 的结果。）你可以在 `www.pgadmin.org` 获取它。\n\
  \n### 提示\n\n另一个 Web 管理程序：phpPgAdmin，最初位于 `s-prs.co/v233`。该项目曾中断多年，但现在 GitHub 上有一个更新的版本（由新的管理）。你可以在那里找到\
  \ `s-prs.co/v234`。然而，你可能更喜欢维护活跃的 pgAdmin 4（参见图 23.2）。\n\n![在 pgAdmin 4 中方便地创建数据库](img/img-f23.2.html)\n\
  \n图 23.2 在 pgAdmin 4 中方便地创建数据库\n\n我们其余所有工作都直接在 PHP 代码中完成。说到 PHP，它必须被告知支持 PostgreSQL。在\
  \ Windows 中，这是通过 `php.ini` 文件中的简单条目实现的：\n\n```\nextension=pgsql  \n```\n\n如果你自己编译\
  \ PHP，请使用 `--with-pgsql=/path/to/pgsql` 参数进行配置并重新编译。接下来是必须查看 `phpinfo()` 输出：安装成功了吗？你可能会收到类似于图\
  \ 23.3 中的信息。Windows 下的一个可能原因是：PHP 扩展需要 `libpq.dll` 库，该库位于 PHP 目录。在某些系统中，该 DLL 必须在系统路径中才能被找到。在该步骤之后，你应该看到像图\
  \ 23.4 所示的屏幕：扩展已设置。\n\n![尚未找到 DLL](img/img-f23.3.html)\n\n图 23.3 尚未找到 DLL\n\n![扩展已成功安装](img/img-f23.4.html)\n\
  \n图 23.4 扩展已成功安装\n\n\n\n\n\n## 23.2 使用 PostgreSQL 访问数据库\n\n数据库的名称可能与之前的数据库有所不同，工作方式也不同，但相关任务始终是：建立连接、发送\
  \ SQL 命令和查询返回结果。方便的是，甚至函数的名称也相似。\n\n### 23.2.1 设置连接\n\n连接 PostgreSQL 数据库的函数名为 `pg_connect()`（或\
  \ `pg_pconnect()`，其中 `p` 代表持久化）。所有的 PHP PostgreSQL 函数都以 `pg_` 开头。你指定一个连接字符串作为参数。这有许多可能性；这里你可以看到一个包含大量信息（以及不安全的密码）的版本：\n\
  \n```\n\"host=localhost port=5432 dbname=PHP user=postgres password=pwd.\"\n```\n\
  \n因此，你指定了服务器、端口、数据库名称和用户数据。服务器和端口是默认指定的，因此在某些情况下可以省略。`pg_connect()` 函数返回一个连接句柄，如果发生错误，则返回\
  \ `false`。使用 `pg_close()` 可以再次关闭连接。\n\n```php\n<?php\n  if ($db = pg_connect(\"\
  host=localhost port=5432 dbname=PHP user=postgres \n                           \
  \                      password=pwd.\")) {\n    echo \"Connection established successfully.\"\
  ;\n    pg_close($db);\n  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n**列表\
  \ 23.1** 建立数据库连接 (\"pgsql-connect.php\")\n\n#### 注意事项\n\n如果你使用相同的连接字符串调用两次 `pg_connect()`，则不会开启新连接，而是再次使用（并返回）之前的连接。\n\
  \n### 23.2.2 查询\n\n通过 `pg_query()`，你向数据库发送 SQL 命令。这是在数据库中创建测试表的一种极佳方法。唯一的特殊之处是（再次）自增值，它在\
  \ PostgreSQL 中通过特殊数据类型 `SERIAL` 实现。如果发生错误，`pg_last_error()` 函数将返回最后发生的错误文本。然而，如果错误发生在\
  \ `pg_connect()` 中，则该函数将不起作用；它在示例示例中仅对 `pg_query()` 的调用是实用的。\n\n```php\n<?php\n\
  \  if ($db = pg_connect(\"host=localhost port=5432 dbname=PHP user=postgres \n \
  \                                                password=pwd.\")) {\n    $sql =\
  \ \"CREATE TABLE my_table (\n      id SERIAL PRIMARY KEY, \n      field VARCHAR(255)\n\
  \    )\";\n    if (pg_query($db, $sql)) {\n      echo \"Table created.<br />\";\n\
  \    } else {\n      echo \"Error: \" . pg_last_error() . \"!\";\n    }\n    $sql\
  \ = \"INSERT INTO my_table (field) VALUES ('value1')\";\n    if (pg_query($db, $sql))\
  \ {\n      echo \"Data entered.<br />\";\n    } else {\n      echo \"Error: \" .\
  \ pg_last_error() . \"!\";\n    }\n    $sql = \"INSERT INTO my_table (field) VALUES\
  \ ('value2')\";\n    if (pg_query($db, $sql)) {\n      echo \"Data entered.\";\n\
  \    } else {\n      echo \"Error: \" . pg_last_error() . \"!\";\n    }\n    pg_close($db);\n\
  \  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n**列表 23.2** 向数据库写入数据 (\"pgsql-query.php\"\
  )\n\n### 提示\n\nPHP 的 PostgreSQL 模块还支持一个特殊的辅助函数，它可以从危险的 SQL 特殊字符中释放值或对其进行正确的转义。在将动态数据用于\
  \ SQL 命令 之前，你应该使用这个函数 `pg_escape_string()` 处理它们。\n\n例如，使用 pgAdmin 查看表。你会发现自动创建了一个序列（见图\
  \ 23.5），这你可能在 Oracle 中很熟悉（另见第 22 章）。该序列在每次插入到表时都会加 1；新新表条目的 `id` 字段将自动包含序列中的当前值。这个“支架”被用于实现自增值。\n\
  \n![自动创建的序列](img/img-f23.5.html)\n\n**图 23.5** 自动创建的序列\n\n#### ID 和 OID\n\n当你查看表的\
  \ SQL 命令时，你会注意到另一个特性——不是你自己发出的命令，而是 pgAdmin 中显示的那个：\n\n```\nCREATE TABLE my_table\n\
  (\n  id serial NOT NULL,\n  feld varchar(255),\n  CONSTRAINT my_table_pkey PRIMARY\
  \ KEY (id)\n) \nWITH OIDS; \n```\n\n首先，成了主键约束；其次，命令以 `WITH OIDS` 结尾。这些是全局 PostgreSQL\
  \ ID——即比自增值高一级。如果激活了 `WITH OIDS`，则每个表条目都有一个数据库内唯一的 ID。你可以在 `WHERE` 条件中查询 `OID`，但不能。\n\
  \n### 23.2.3 返回值\n\n`pg_query()` 的返回值是一个结果指针。通常情况下，你想逐行遍历：`pg_fetch_assoc()` 将当前行作为关联数组返回。\n\
  \n```php\n<?php\n  if ($db = pg_connect(\"host=localhost port=5432 dbname=PHP user=postgres\
  \ \n                                                 password=pwd.\")) {\n    $sql\
  \ = \"SELECT * FROM my_table\";\n    if ($result = pg_query($db, $sql)) {\n    \
  \  echo \"<ul>\";\n      while ($row = pg_fetch_assoc($result)) {\n        echo\
  \ \"<li>\" . htmlspecialchars($row[\"id\"]) .\n             \": \" . htmlspecialchars($row[\"\
  field\"]) . \"</li>\";\n      }\n      echo \"</ul>\";\n    }\n    pg_close($db);\n\
  \  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n**列表 23.3** 关联数组形式的数据 (\"pgsql-associative.php\"\
  )\n\n与之对应的是 `pg_fetch_object()`，它将结果行作为对象返回，其中列名即属性。\n\n```php\n<?php\n  if ($db\
  \ = pg_connect(\"host=localhost port=5432 dbname=PHP user=postgres \n          \
  \                                       password=pwd.\")) {\n    $sql = \"SELECT\
  \ * FROM my_table\";\n    if ($result = pg_query($db, $sql)) {\n      echo \"<ul>\"\
  ;\n      while ($row = pg_fetch_object($result)) {\n        echo \"<li>\" . htmlspecialchars($row->id)\
  \ .\n             \": \" . htmlspecialchars($row->field) . \"</li>\";\n      }\n\
  \      echo \"</ul>\";\n    }\n    pg_close($db);\n  } else {\n    echo \"Error!\"\
  ;\n  }\n?>  \n```\n\n**列表 23.4** 对象形式的数据 (\"pgsql-object.php\")\n\n或者，你也可以使用数值访问，因为\
  \ `pg_fetch_row()` 返回一个包含所有行数据的数值数组。和所有数组一样，编号从 0 开始。这对于 SQL 函数如 `SUM()` 或 `COUNT()`\
  \ 非常实用，因为除非你使用别名，否则那里没有列名。\n\n非常实用但在资源方面并不经济的是 `pg_fetch_all()`，它正如其名所言的，返回完整的结果列表。对\
  \ `SELECT *` 查询的结果调用 `var_dump()` 将返回如下结果：\n\n```array(2) {\n  [0]=>\n  array(2)\
  \ {\n    [\"id\"]=>\n    string(1) \"1\"\n    [\"field\"]=>\n    string(5) \"value1\"\
  \n  }\n  [1]=>\n  array(2) {\n    [\"id\"]=>\n    string(1) \"2\"\n    [\"field\"\
  ]=>\n    string(5) \"value2\"\n  }\n}\n```\n\n\n\n\n因此，它是一个数组数组，你可以使用 `foreach`\
  \ 将以表格形式或列表形式输出。\n\n```php\n<?php\n  if ($db = pg_connect(\"host=localhost port=5432\
  \ dbname=PHP user=postgres\n                                                 password=pwd.\"\
  )) {\n    $sql = \"SELECT * FROM my_table\";\n    if ($result = pg_query($db, $sql))\
  \ {\n      $all = pg_fetch_all($result);\n      echo \"<ul>\";\n      foreach ($all\
  \ as $row) { \n        echo \"<li>\" . htmlspecialchars($row[\"id\"]) .\n      \
  \       \": \" . htmlspecialchars($row[\"field\"]) . \"</li>\";\n      }\n     \
  \ echo \"</ul>\";\n    }\n    pg_close($db);\n  } else {\n    echo \"Error!\";\n\
  \  }\n?>  \n```\n\n**Listing 23.5** 一性输出所有表内容 (\"pgsql-read-all.php\")\n\n### 23.2.4\
  \ 特殊功能\n\nPHP 的 PostgreSQL 模块提供了许多特殊功能，这里仅展示其中一部分。\n\n#### 最后插入的自动增值\n\n旧的问题：如果一个表具有自动增值（在\
  \ PostgreSQL 中，即带有自动创建序列的 `SERIAL` 数据类型），那么找出新创建的值具有什么 ID 是很有趣的。有两种方法可以实现：\n\n*\
  \   你使用 `SELECT` 命令查询序列的 `CURRVAL` 属性。\n*   你确定 `oid`，然后通过此确定自动增值（使用 `SELECT`）。\n\
  \n我们展示了第二种方案。方便的是，`pg_last_oid()` 函数返回上一个查询的 `oid` 值（`pg_query()` 的返回值被作为参数传递的）。下面的代码示例向测试表插入一个值并确定对应的\
  \ ID。\n\n```php\n<?php\n  if ($db = pg_connect(\"host=localhost port=5432 dbname=PHP\
  \ user=postgres\n                                                 password=pwd.\"\
  )) {\n    $sql = \"INSERT INTO my_table (field) VALUES ('value3')\";\n    if ($result\
  \ = pg_query($db, $sql)) {\n      $oid = pg_last_oid($result);\n      $result =\
  \ pg_query($db, \n        \"SELECT id FROM my_table WHERE oid=$oid\");\n      $row\
  \ = pg_fetch_row($result);\n      $id = $row[0];\n      echo \"Entry with ID $id\
  \ added.\";\n    } else {\n      echo \"Error: \" . pg_last_error() . \"!\";\n \
  \   }\n    pg_close($db);\n  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n\
  **Listing 23.6** 确定最后条目的自动增值 (\"pgsql-read-autoue.php\")\n\n#### 无 SQL 的 PostgreSQL\n\
  \n让我们面对它：通用数据库操作，特别是 PostgreSQL，最繁琐的部分是创建简单的 SQL 命令。但有一个解决方法。`pg_insert()` 函数向表插入数据。你将数据指定为关联数组，正如你从\
  \ `pg_fetch_assoc()` 预期的那样。这使得输入变得像蛋糕一样简单。特殊字符也会自动编码。\n\n```php\n<?php\n  if ($db\
  \ = pg_connect(\"host=localhost port=5432 dbname=PHP user=postgres\n           \
  \                                      password=pwd.\")) {\n    $data = [\"field\"\
  \ => \"value4\"];\n    if (pg_insert($db, \"my_table\", $data)) {\n      echo \"\
  Data entered.\";\n    } else {\n      echo \"Error: \" . pg_last_error() . \"!\"\
  ;\n    }\n  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n**Listing 23.7** 轻松插入数据\
  \ (\"pgsql-insert.php\")\n\n但这并非全部。更新数据也是可能的。`WHERE` 条件也被指定为一个数组。该数组包含字段名作为键，以及必须满足的值（因此只有等性是可能的）。下面的示例将\
  \ \"Value3\" 条目重命名为 \"Value4\"。\n\n```php\n<?php\n  if ($db = pg_connect(\"host=localhost\
  \ port=5432 dbname=PHP user=postgres\n                                         \
  \        password=pwd.\")) {\n    $data = [\"field\" => \"value4\"];\n    $condition\
  \ = [\"field\" => \"value3\"];\n    if (pg_update($db, \"my_table\", $data, $condition))\
  \ {\n      echo \"Data updated.\";\n    } else {\n      echo \"Error: \" . pg_last_error()\
  \ . \"!\";\n    }\n  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n**Listing\
  \ 23.8** 轻松更新数据 (\"pgsql-update.php\")\n\n如果 `UPDATE` 成功，那么 `SELECT` 也会成功。你在这里也将条件指定为数组。现在有两个条目在字段列中拥有\
  \ \"value4\" 值。这通过后续列表输出得到了确认，你可以在 图 23.6 中看到。\n\n```php\n<?php\n  if ($db = pg_connect(\"\
  host=localhost port=5432 dbname=PHP user=postgres\n                            \
  \                     password=pwd.\")) {\n    $data = [\"field\" => \"value4\"\
  ];\n    // ... (原文提供的文本在此处断裂)\n```\n\n#### PostgreSQL 中的文件\n\n在其他数据库中被称为 LOB 或 BLOB\
  \ 的在 PostgreSQL 中被称为 `lo`（用于大对象）。可以在这样的 `lo` 中存储大量的数据。插入通过以下步骤完成：\n\n1.  创建一个带有\
  \ `oid` 列的表。\n2.  使用 `pg_lo_create()` 创建一个 `oid`。\n3.  将 `oid` 插入到新表中。\n4.  使用 `pg_lo_open()`\
  \ 打开 `lo`。为了做到这一点，需要指定数据库连接（来自 `pg_connect()`）、`oid` 和文件模式（写入时为 `\"w\"`）。\n5.  使用\
  \ `pg_lo_write()` 将数据写入 `lo`——例如，从你用 `file_get_contents()` 读取的文件。\n6.  使用 `pg_lo_close()`\
  \ 关闭 `lo`。如果你不这样做，连接将关闭且信息将会丢失！\n7.  使用 `pg_close()` 关闭数据库连接。\n\n### 注意\n\n你必须在事务中执行整个过程——即使用\
  \ `BEGIN` 和 `COMMIT`。然而，后者是可选的，因为 PHP 脚本结束时会自动执行 `COMMIT`。下面的完整列表创建并填充了所需的表。\n\n\
  ```php\n<?php\n  if ($db = pg_connect(\"host=localhost port=5432 dbname=PHP user=postgres\n\
  \                                                 password=pwd.\")) {\n    $data\
  \ = file_get_contents(__FILE__);\n    pg_query ($db, \"CREATE TABLE files (\n  \
  \    obj_id oid,\n      name VARCHAR(255)\n    )\");\n    pg_query ($db, \"BEGIN\"\
  );\n    $oid = pg_lo_create($db);\n    $file = pg_escape_string(__FILE__);\n   \
  \ pg_query($db, \"INSERT INTO files (obj_id, name) VALUES ($oid, '$file')\");\n\
  \    $lo = pg_lo_open($db, $oid, \"w\");\n    pg_lo_write($lo, $data);\n    pg_lo_close($lo);\n\
  \    pg_query($db, \"COMMIT\"); \n    pg_close($db);\n    echo \"File inserted.\"\
  ;\n  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n**Listing 23.11** 将文件写入数据库\
  \ ... (\"pgsql-lo-write.php\")\n\n\n\n查看 `pgAdmin` 等管理工具可以发现，OID 实际上已经输入到 `obj_id`\
  \ 列中（参见图 23.7）。每个表元素也有一个 OID（当然，这是一个不同的 OID），但在 `pgAdmin 4` 的当前版本中并没有显式显示。\n\n读取数据需要以下几个步骤（参见图\
  \ 23.8）：\n\n1. 从表中读取 OID。\n2. 使用 `pg_lo_open()` 打开大对象（lo）。此时文件模式为用于读取的 `\"r\"`。\n\
  3. 使用 `pg_lo_read()` 读取文件内容，或使用 `pg_lo_read_all()` 直接完整地返回网页浏览器。\n4. 使用 `pg_lo_close()`\
  \ 关闭大对象。\n5. 使用 `pg_close()` 关闭与数据库的连接。\n\n![数据库中只有 OID](img/img-f23.7.html)\n\n\
  **图 23.7** 数据库中只有 OID\n\n![之前的文件已输出](img/img-f23.8.html)\n\n**图 23.8** 之前的文件已输出\n\
  \n以下相应的代码列表读取并输出了刚刚插入的文件。\n\n```\n<xmp>\n<?php\n  if ($db = pg_connect(\"host=localhost\
  \ port=5432 dbname=PHP user=postgres \n                                        \
  \         password=pwd.\")) {\n    pg_query($db, \"BEGIN\");\n    $result = pg_exec($db,\
  \ \n      \"SELECT obj_id FROM files WHERE name LIKE \n        '%pgsql-lo-write.php%'\"\
  );\n    $row = pg_fetch_assoc($result);\n    $lo = pg_lo_open($db, $row[\"obj_id\"\
  ], \"r\");\n    pg_lo_read_all($lo);\n    pg_lo_close($lo);\n    pg_query($db, \"\
  COMMIT\"); \n    pg_close($db); \n  } else {\n    echo \"Error!\";\n  }\n?>\n</xmp>\
  \  \n```\n\n**代码列表 23.12** ... 并再次读取 (\"pgsql-lo-read.php\")\n\n## 23.3 应用程序示例\n\
  \n这里的示例与所有其他数据库章节相同；不同之处在于细节。\n\n### 23.3.1 创建表\n\n照常通过调用 `CREATE TABLE` 来创建表。这里还应该注意的是，特殊的\
  \ PostgreSQL 特数据类型 `SERIAL` 用于自动取值。\n\n```php\n<?php\n  if ($db = pg_connect(\"\
  host=localhost port=5432 dbname=PHP user=postgres \n                           \
  \                      password=pwd.\")) {\n    $sql = \"CREATE TABLE guestbook\
  \ (\n      id SERIAL PRIMARY KEY, \n      heading VARCHAR(1000), \n      entry VARCHAR(8000),\n\
  \      author VARCHAR(50),\n      email VARCHAR(100),\n      date TIMESTAMP\n  \
  \  )\";\n    if (pg_query($db, $sql)) {\n      echo \"Table created.<br />\";\n\
  \    } else {\n      echo \"Error: \" . pg_last_error() . \"!\";\n    }\n    pg_close($db);\n\
  \  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n**代码列表 23.13** 表已创建 (\"gb-create.php\"\
  )\n\n### 23.3.2 输入数据\n\n在输入数据时，你会发现第一个潜在的问题。如果你遵循与其他章节相同的步骤，如果你的输入包含变音符号等特殊字符，可能会收到晦涩的错误信息。你可以在图\
  \ 23.9 中看到这一点。\n\n![特殊字符的可能错误消息](img/img-f23.9.html)\n\n**图 23.9** 特殊字符的可能错误消息\n\
