  \ 用于输入的更好的脚本 (\"gb-enter-2.php\")**\n\n[/content]\n\n译文：**\n\n[content]\n这是一种初步方法，但\
  \ SQL 中还有其他特殊字符，例如下划线或百分比符号（都用于 `WHERE` 子句）。因此，必须采取特殊措施。对于 MySQL，`magic_quotes`\
  \ 曾也用于此类操作。SQL 注入是创建这一不受欢迎（且最近已废弃）的 `magic quotes` 功能的主要原因之一。MySQL 可以通过反斜杠转义特殊字符，但这并不是\
  \ SQL 标准的一部分。因此，其他数据库不按照预期解释这些字符并不令人意外。但不要绝望：某些数据库模块提供了额外的函数（在 OOP API 的情况下为方法）来相应地准备用户输入。表\
  \ 32.1 显示了部分示例。\n\n| 模块 | 函数 |\n| --- | --- |\n| MySQL | `mysqli_real_escape_string()`/`MySQLi::real_escape_string()`\
  \ |\n| SQLite | `SQLite3::escapeString()` |\n| MSSQL | - |\n| PostgreSQL | `pg_escape_string()`\
  \ |\n| Oracle | - |\n\n**表 32.1** 转义特殊字符的函数\n\n正如你所看到的，某些数据库系统的状况看起来相当糟糕——但幸运的是，这些系统提供了预处理语句作为一种安全的方法。下面的列表显示了一个使用\
  \ PHP 的 `mysqli` 扩展在 MySQL 中的示例。\n\n```php\n<?php\n  $entry = $_POST[\"entry\"]\
  \ ?? \"\";\n\n  if ($db = mysqli_connect(\"server\", \"user\", \"password\",\n \
  \     \"guestbook\")) {\n    if ($stmt = mysqli_prepare($db, \n      \"INSERT INTO\
  \ entries (entry) VALUES (?)\")) {\n      mysqli_stmt_bind_param($stmt, \"s\", $entry);\n\
  \      mysqli_stmt_execute($stmt);\n      mysqli_stmt_close($stmt);\n    } \n  \
  \  mysqli_close($db);\n  }\n?> \n```\n\n```html\n<html\n<head>\n  <title>Guestbook</title>\n\
  </head>\n<body \n<form method=\"post\" action=\"\">\n  Comment: <textarea name=\"\
  entry\" cols=\"\" rows=\"\"></textarea><br />\n  <input type=\"submit\" value=\"\
  Enter\" />\n</form>\n</body>\n</html>\n```\n\n**列表 32.4** 一个更好的输入脚本 (\"gb-enter-2.php\"\
  )\n\nSQL 注入是非常危险的，因为它可以对 Web 服务器造成严重损害。因此，在处理用户输入的每一个数据库查询中都要务必小心。即使是专业杂志，也经常包含不过滤外部数据的代码，因此容易受到\
  \ SQL 注入的影响。你可以自己在你自己的网站上安全地测试这一点。如果你有页面通过 URL 传输数据（例如，`news.php?id=123`），请插入单引号（`news.php?id='123`）。如果你收到了\
  \ PHP 错误消息，则存在两个潜在的危险点：\n\n1. 页面没有过滤或验证用户输入。\n2. 页面将 PHP 消息输出给客户端，从而免费为攻击者提供了有价值的信息。\n\
  \n## 32.4 隐藏字段\n\n在与恶意输入数据方面，还有另一个棘手但又简单易举的选项。为了说明这一点，我们首先展示另一个示例。在章节开头，我们那个构建得糟糕的\
  \ CMS 使用了以下链接：\n\n```html\n<a href=\"edit.php?id=23\">Edit article #23</a>\n<a href=\"\
  edit.php?id=24\">Edit article #24</a>\n<a href=\"edit.php?id=27\">Edit article #27</a>\n\
  ```\n\n在扩展版本中，还有这些链接：\n\n```html\n<a href=\"delete.php?id=23\">Delete article #23</a>\n\
  <a href=\"delete.php?id=24\">Delete article #24</a>\n<a href=\"delete.php?id=27\"\
  >Delete article #27</a>\n```\n\n当然，这同样不安全，但程序员想出了一个对策。有人告诉他通过 `GET/URL` 渗透数据非常容易，于是他想出了一个更复杂的方法。当调用\
  \ `delete.php` 脚本时，用户仍然必须确认整个过程。要被删除的新闻文章作为隐藏字段传回服务器，因此对用户（以及攻击者）是不可见的。计划就此此了。下面的列表显示了相应的代码；图\
  \ 32.5 和 图 32.6 显示了浏览器中的输出。\n\n```html\n<html\n<head>\n  <title>Delete</title>\n\
  </head>\n<body>\n```\n\n```php\n<?php\n  $id_GET = $_GET[\"id\"] ?? \"\";\n  $id_POST\
  \ = $_POST[\"id\"] ?? \"\";\n\n  if ($id_GET != \"\" && $id_POST == \"\") {\n?>\n\
  ```\n\n```html\n<form method=\"post\">\n  <input type=\"hidden\" name=\"id\" \n\
  \    value=\"<?php echo htmlspecialchars($id_GET); ?>\" />\n  <input type=\"submit\"\
  \ value=\"Confirm deletion\" />\n</form>\n```\n\n```php\n<?php\n  if ($id_GET !=\
  \ \"\" && $id_POST != \"\") {\n    delete_entry($id_POST); // 待实现\n    echo \"<b>Entry\
  \ deleted!</b>\";\n  }\n?>\n```\n\n```html\n</body>\n</html>\n```\n\n\n\n\n\n```php\n\
  <?php\n  $Email = htmlspecialchars(filter_input(INPUT_POST, \"Email\", \n    FILTER_SANITIZE_EMAIL));\n\
  \  $Number = filter_input(INPUT_POST, \"Number\", FILTER_SANITIZE_NUMBER_INT);\n\
  \  echo \"<p><b>$Number of tickets for $Email</b></p>\";\n?>\n<?php\n    } else\
  \ {\n      echo \"<p><b>Form incomplete</b></p>\";\n    }\n  } \n\n  if (!$ok) {\n\
  ?> \n```\n\n```html\n<h1>世界杯门票购票服务</h1>\n<form method=\"post\" action=\"\">\n邮箱地址\
  \ <input type=\"text\" name=\"Email\" /><br />\n门票数量 \n<select name=\"Number\">\n\
  \  <option value=\"0\">请选择</option>\n  <option value=\"1\">1</option>\n  <option\
  \ value=\"2\">2</option>\n  <option value=\"3\">3</option>\n  <option value=\"4\"\
  >4</option>\n</select><br />\n<input type=\"submit\" name=\"Submit\" value=\"下单\"\
  \ />\n</form> \n```\n\n```php\n<?php\n  }\n?> \n```\n\n```html\n</body>\n</html>\
  \  \n```\n\n**列表 32.6** 表单数据经过过滤（\"filter.php\"）\n\n`filter_input()` 第三个参数的可能取值包括：\n\
  \n- `FILTER_SANITIZE_EMAIL`  \n  移除所有不属于电子邮件地址的字符。\n\n- `FILTER_SANITIZE_ENCODED`\
  \  \n  对数据进行 URL 编码。\n\n- `FILTER_SANITIZE_ADD_SLASHES`  \n  在特殊字符前添加反斜杠（内部会调用 `addslashes()`）。\n\
  \n- `FILTER_SANITIZE_NUMBER_FLOAT`  \n  移除所有不属于浮点数的字符。\n\n- `FILTER_SANITIZE_NUMBER_INT`\
  \  \n  移除所有不属于整数的字符。\n\n- `FILTER_SANITIZE_SPECIAL_CHARS`  \n  将所有特殊字符编码为 HTML 实体。\n\
  \n- `FILTER_SANITIZE_STRING` 和 `FILTER_SANITIZE_STRIPPED`  \n  移除 HTML 特殊字符。注意这些过滤器在\
  \ PHP 8.1.0 版本中已弃用；建议使用 `htmlspecialchars()`。\n\n- `FILTER_SANITIZE_UNSAFE_RAW`\
  \  \n  不移除 HTML 特殊字符。\n\n- `FILTER_SANITIZE_URL`  \n  移除所有不属于 URL 的字符。\n\n### 验证与清理\n\
  \n所有列出的过滤器名称中都包含 `SANITIZE`。这表示该过滤器会更改输入数据，且 `filter_input()` 返回新值。然而，如果你将 `SANITIZE`\
  \ 替换为 `VALIDATE`，则 `filter_input()` 只进行检查（而不进行更改）并返回 `true` 或 `false`（或 `null`），取决于数据是否被认为有效。\n\
  \n还可以为 `filter_input()` 提供第四个参数来指定额外信息。例如，存在 `FILTER_VALIDATE_REGEXP` 过滤器类型，它期望一个用于检查的正则表达式——但开头和结尾没有分隔符：\n\
  \n```php\n$Number = filter_input(INPUT_POST, \n\"Number\", \nFILTER_VALIDATE_REGEXP,\
  \ \n[\"regexp\" => \"^[1-9]\\d*$\"]);  \n```\n\nPHP 输入过滤器的第二个主要函数是 `filter_var()`。你向它传递数据（例如字符串），然后选择过滤器类型。这些与我们之前讨论的类型相同。如既往一样，完整列表可以在\
  \ PHP 手手册找到，地址为 `http://php.net/manual/filters.php`。\n\n下面的列表显示了一个基于第 26 章中类似应用程序的示例。\n\
  \n```html\n<form method=\"post\" action=\"\"> \nURL: <input type=\"text\" name=\"\
  url\" value=\"<?php\n  echo (isset($_POST[\"url\"]) && is_string($_POST[\"url\"\
  ])) ? htmlspecialchars($_POST[\"url\"]) : \"\";\n? /><input type=\"submit\" /> \n\
  </form> \n<hr /> \n```\n\n```php\n<?php \n  if (filter_input(INPUT_POST, \"url\"\
  , FILTER_VALIDATE_URL) == null) { \n    $url = filter_input(INPUT_POST, \"url\"\
  , FILTER_SANITIZE_URL); \n    $data = filter_var($url, FILTER_SANITIZE_STRING);\
  \ \n    echo \"<pre>$data</pre>\"; \n  } \n?>  \n```\n\n**列表 32.7** 从 HTML 标记中读取并释放\
  \ URL（\"textversion.php\"）\n\n该扩展还有其他功能，但这些示例对于初步了解已经足够。你可以在此处找到相应的文档：http://s-prs.co/v602247\n\
  \n### 注意\n\n另一类有趣的功能封装在 `ctype` 扩展中，该扩展也会自动激活。关于此的信息可以在 `http://php.net/ctype`找到。\n\
  \n## 32.6 跨站请求伪造\n\n跨站请求伪造（CSRF）被 XSS 和 SQL 注入等“大牌”竞争攻击所掩盖，它甚至在 2017 年从 OWASP 前\
  \ 10 列表中被移除——但在 2021 年作为排名第一项的子项目“失效的访问控制”又回归了。CSRF 不仅非常危险，而且在 Web 上变得日益常见。\n\n\n\
  \n\n你随后会在浏览器中立即看到显示订单确认的页面。一个“真实的”攻击者会将隐藏的表单放在 `iframe` 中，以此防止这种效果。\n\n有许多方法可以保护自己免受此类攻击。这些包括通用的安全措施，例如在下单前重新登录以及短会话超时。然而，也经常建议一些措施，例如检查\
  \ `HTTP referrer` 和检查 `IP address`，遗憾的是，这些在实践中并不总是能达到预期效果。\n\n目前被认为安全的保护措施如下：主要问题在于，攻击者可以准确地猜出相应订单的\
  \ HTTP 请求是什么样的。为了防止这一点，我们插入了一个包含随机值的额外隐藏表单字段。为此，我们让 `random_bytes()` 函数来确定一个相应的、不可预测的字符串：\n\
  \n```php\n<?php \n  $token = random_bytes(32); \n?> \n```\n\n```php\n...\n<input\
  \ type=\"hidden\" name=\"token\" value=\"<?php echo $token; ?>\" />  \n```\n\n同时，我们将此随机值保存在\
  \ `session` 中：\n\n```php\n$_SESSION[\"token\"] = $token;  \n```\n\n如果现在发送表单，我们将检查表单发送的值是否与\
  \ `session` 中的值相同。这防止了 CSRF 攻击尝试，因为攻击者既无法影响用户的 `session`，也无法提前猜测秘密令牌（token）是什么，因为它每次都是不同的。\n\
  \n通过这种方式，我们可以使用列表 32.8 中的表单，并结合令牌的集成与验证，从而在下一个列表中对其进行改进。\n\n```php\n<?php\n  session_start();\n\
  ?> \n```\n\n```html\n<head>\n  <title>Order Form</title>\n</head>\n<<body> \n```\n\
  \n```php\n<?php\n  $token = \"\";\n\n  if (isset($_POST[\"quantity\"]) &&\n    (int)$_POST[\"\
  quantity\"] > 0 &&\n    isset($_POST[\"articleId\"]) &&\n    isset($_SESSION[\"\
  token\"]) &&\n    isset($_POST[\"token\"]) &&\n    $_SESSION[\"token\"] === $_POST[\"\
  token\"]) {\n    file_put_contents(\n      \"orders.txt\",\n      sprintf(\"%d x\
  \ article %s - %s\\n\", \n        (int)$_POST[\"quantity\"], \n        $_POST[\"\
  articleId\"],\n        date(\"Y-m-d H:i:s\")),\n      FILE_APPEND);\n    echo \"\
  Order submitted!\";\n    unset($_SESSION[\"token\"]);\n  } else {\n    $token =\
  \ random_bytes(32);\n    $_SESSION[\"token\"] = $token;\n  }\n?> \n```\n\n```html\n\
  \  <form method=\"post\" action=\"\">\n    Quantity: <input type=\"text\" name=\"\
  quantity\" /><br />\n    <input type=\"hidden\" name=\"articleId\" value=\"123\"\
  \ />\n    <input type=\"hidden\" name=\"token\" value=\"<?php echo $token; ?>\"\
  \ />\n    <input type=\"submit\" value=\"Order\" />\n  </form>\n</body>\n</html>\
  \  \n```\n\n**列表 32.9** 改进后的订单表单（\"order-token.php\"）\n\n试一看：你仍然可以通过直接调用表单来下单。然而，如果你使用\
  \ HTML 文件（你必须调整表单的提交目标），你将进入“正常的”订单页面，但订单不会自动发送或记录在文本文件中。\n\n### 注意\n\n另一种针对 CSRF\
  \ 的额外保护措施是使用 `SameSite` cookie，这已经在第 14 章中讨论过。`php.ini` 设置为所有 PHP 会话激活一个特定的 `SameSite`\
  \ 模式：\n\n```ini\nsession.cookie_samesite = \"Lax\" \n```\n\n现代网页浏览器将逐渐将 cookie 视为\
  \ `SameSite=Lax`，这可以使利用 CSRF 漏洞变得困难得多。\n\n## 32.7 屏幕爬取与验证码\n\n高潮：为了结束对攻击者思维的简要介绍，我们展示一种特别阴险的攻击。假设你想提供一个显示当前股票价格的页面，但你自己不想为这些价格支付任何费用。没问题：只需在后台使用\
  \ `PHP` 调用交易所网站，读取价格（例如使用正则表达式），并将它们显示在你的页面上——自然地，使用你自己的布局。这听起来不错，也非常有效——而且是非法的。\n\
  \n### 注意\n\n顺带一下，这个过程被称为屏幕爬取（screen scraping）。\n\n另一个例子：假设你想发送尽可能多的垃圾邮件。免费邮箱提供商在一定限制内适用于此。你可以在那里创建新账户并发送广告邮件，直到账户被封禁，制服的人站在你的门口。但使用上一节的技术会方便得多：将注册表单保存到本地，对其进行分析，然后以修改后的形式发送回服务器——最好是全自动的。这将允许你只需按一下按钮就能创建多个账户。别笑：在一些冷门网站上就有软件可以做到这一点。\n\
  \n这两个场景有一个共同点：它们对网站来说非常不愉快，因为网站无法判断电话对面是人还是机器。早在 20 世纪 50 年代，英国数学家艾兰·图灵（Alan Turing）定义了一种测试，使得判断通信伙伴是人类还是机器成为可能。2000\
  \ 年，50 年后，四位研究人员汇聚在一起，并将这一概念应用于网络。他们将其命名为区分计算机与人类的全自动图灵测试（CAPTCHA）。验证码现在已用于许多网站。[图\
  \ 32.9](#32_007.html#f32.9）显示了一个随机出现并必须解决的验证码。在这种情况下，验证码是一个包含字母和数字（通常只是字母）且用户需要输入的图形。单个字符经过扭曲，使得计算机程序难以识别这些文本。\n\
  \n\n\n然而，仅凭这些并不能达到什么效果。你还需要处理管理工作。下面的示例直接基于包文档。验证码中的术存储在会话（session）变量中，并以此方式进行检查。但首先要启动\
  \ PHP 会话支持：\n\n```php\nsession_start(); \n```\n\n变量 `$ok` 记录了验证码是否已经解决：\n\n```php\n\
  $ok = false; \n```\n\n显示在浏览器中的文本保存在 `$info` 变量中：\n\n```php\n$info = \"Please enter\
  \ text in the image!\";\n```\n\n如果需要再次显示验证码（此时 `$ok` 为 false），则会生成新的图形，并将生成的 PNG\
  \ 图片保存到文件中。然后该文件将配合文本输入表单字段显示：\n\n```php\nif (!$ok) { \n  require_once 'Text/CAPTCHA.php';\n\
  \n  $c = Text_CAPTCHA::factory('Image'); \n  $c->init(200, 80);\n\n  $_SESSION[\"\
  phrase\"] = $c->getPhrase();\n\n  file_put_contents(sha1(session_id()) . \".png\"\
  , $c->getCAPTCHAAsPNG());\n\n  echo \"<form method=\\\"POST\\\">\" . \n       \"\
  <img src=\\\"\" . sha1(session_id()) . \".png?\" . time() . \"\\\" />\" . \n   \
  \    \"<input type=\\\"text\\\" name=\\\"phrase\\\" />\" .       \n       \"<input\
  \ type=\\\"submit\\\" /></form>\"; \n}  \n```\n\n### 提示\n\n附加当前的时间戳格式时间（使用 `time()`\
  \ 调用）可以防止 浏览器缓存旧的验证码。\n\n但当用户尝试解决验证码时会发生什么？在这种情况下，输入与会话变量中的验证码答案进行比较，并相应设置 `$ok`\
  \ 变量（以及 `$info` 变量）：\n\n```php\nif ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n\
  \  if (isset($_POST[\"phrase\"]) && isset($_SESSION[\"phrase\"]) &&\n    strlen($_POST[\"\
  phrase\"]) > 0 && strlen($_SESSION[\"phrase\"]) > 0 &&\n    $_POST[\"phrase\"] ===\
  \ $_SESSION[\"phrase\"]) {\n    $info = \"OK!\";\n    $ok = true;\n    unset($_SESSION['phrase']);\n\
  \  } else {\n    $info = \"Please try again!\";\n    unset($_SESSION['phrase']);\n\
  \  }\n  unlink(sha1(session_id()) . \".png\"); \n}  \n```\n\n状态消息在最后输出：\n\n```php\n\
  echo \"<p>$info</p>\"; \n```\n\n下面的列表显示了此示例的完整代码；图 32.10 显示了输出。\n\n```php\n<?php\n\
  \  session_start();\n  $ok = false;\n  $info = \"Please enter text in the image!\"\
  ;\n\n  if ($_SERVER[\"REQUEST_METHOD\"] == \"POST\") {\n    if (isset($_POST[\"\
  phrase\"]) && isset($_SESSION[\"phrase\"]) &&\n      strlen($_POST[\"phrase\"])\
  \ > 0 && strlen($_SESSION[\"phrase\"]) > 0 &&\n      $_POST[\"phrase\"] === $_SESSION[\"\
  phrase\"]) {\n      $info = \"OK!\";\n      $ok = true;\n      unset($_SESSION['phrase']);\n\
  \    } else {\n      $info = \"Please try again!\";\n      unset($_SESSION['phrase']);\n\
  \    }\n    unlink(sha1(session_id()) . \".png\"); \n  }\n\n  echo \"<p>$info</p>\"\
  ;\n\n  if (!$ok) {\n    require_once 'Text/CAPTCHA.php';\n\n    $c = Text_CAPTCHA::factory('Image');\n\
  \    $c->init(200, 80);\n \n    $_SESSION[\"phrase\"] = $c->getPhrase();\n \n  \
  \  file_put_contents(sha1(session_id()) . \".png\", $c->getCAPTCHAAsPNG());\n \n\
  \    echo \"<form method=\\\"POST\\\">\" . \n         \"<img src=\\\"\" . sha1(session_id())\
  \ . \".png?\" . time() . \"\\\" />\" . \n         \"<input type=\\\"text\\\" name=\\\
  \"phrase\\\" />\" .\n         \"<input type=\\\"submit\\\" /></form>\" ;\n  }\n\
  ?>\n```\n\n**列表 32.10** 使用验证码的代码（\"captcha-code.php\"）\n\n![应用中的验证码](img/img-f32.10.html)\
  \ \n\n**图 32.10** 应用中的验证码\n\n## 32.8 加密密码\n\n最后，我们将看看另一个 PHP 也有良好覆盖的安全性问题，尽管底层的编程错误没有\
  \ XSS、SQL 注入或 CSRF 那么直观。这里的主题是密码的安全存储。近期（甚至更早）过去的无数案例表明，许多公司在处理数据存储时非常粗留。Have I\
  \ Been Pwned 网站 ([`haveibeenpwned.com`](https://haveibeenpwned.com)) 是一个著名的资源，它始终活跃重大访问数据泄露案件，并提供了一个测试，告诉你自己的邮箱地址是否已被成功泄露。\n\
  \n![Have I Been Pwned](img/img-f32.11.html)\n\n**图 32.11** Have I Been Pwned\n\n\
  当然，还有其他的加密和哈希机制，但它们使用起来一直比较麻烦。因此，有了密码哈希 API。关于此内置扩展的所有信息可以在 [`php.net/password`](http://php.net/password)\
  \ 找到。你不需要任何配置或设置步骤即可使用此功能。内部提供的功能依赖于强大的 `crypt()` 函数，但密码哈希 API 本身封装了四个函数：\n\n* `password_hash()`：从输入（如密码）生成哈希\n\
  * `password_verify()`：检查输入是否匹配哈希\n* `password_get_info()`：提供哈希信息\n* `password_needs_rehash()`：检查哈希是否具有\n\
  \n前两个函数最重要的。操作相对简单：使用 `password_hash()` 生成哈希。除了输入本身，还必须指定使用的算法；PHP 两个常量：`PASSWORD_DEFAULT`（默认情况下是\
  \ bcrypt，但在未来的 PHP 版本中可能会更改）和 `PASSWORD_BCRYPT`。\n\n这是一个示例：\n\n```php\npassword_hash(\"\
  top secret\", PASSWORD_DEFAULT);\n```\n\n这是一个可能的输出：\n\n```php\n$2y$10$Bz8Kut2TCB17TF0YzLBHMugxG2eOBSYXI1vFcZrkp9hNo/1UWzOtu\n\
  ```\n\n这个哈希现在进入数据库；从这里无法看到密码。然而，我们可以使用 `password_verify()` 来检查输入是否匹配哈希：\n\n```php\n\
  password_verify(\"top secret\", \"$2y$10$Bz8Kut2TCB17TF0YzLBHMugxG2eOBSYXI1vFcZrkp9hNo/1UWzOtu\"\
  );\n```\n\n返回值意乎所料地是 true。通过这种方式，你可以调整第 15 章中列表 15.6 的登录逻辑。\n\n\n\n\n作为 `password_hash()`\
  \ 的第三个参数，你可以使用关联数组指定加密选项：`cost`，即生成哈希值的算法成本。数值越高越好，但计算时间也越长。10 是默认值，但只要性能良好，你也可以增加它。\n\
  \n这是一个相关的小示例：\n\n```\npassword_hash(\"top secret\", PASSWORD_BCRYPT, [\"cost\"=>15]);\
  \  \n```\n\n例如，这段代码在测试运行期间生成了以下返回值——等待几秒钟之后：\n\n```\n$2y$15$LywFa9fOJQb81CfHlbN9Kump0XYOtkGfw8br3jlQzt7.eStTPGBjG\
  \  \n```\n\n如你所示，哈希值也包含有关算法和成本的信息。之后的所有都是实际的哈希值。\n\n### 注意\n\n过去，还可以指定盐值（salt）——附加到待哈希字符串末尾的“盐”，以使哈希值更难追踪。PHP\
  \ 每次都会使用随机且安全的盐值，因此此配置选项在 PHP 8 中已被移除。\n\n这让你能够使用一个非常简单的 API 仍然安全地加密密码。`MD5` 和 `SHA1`\
  \ 哈希已不再足够。\n\n### 提示\n\nPHP 的标准加密扩展是 `Sodium`。它包含在 PHP 中，在 Linux 下需要 `-with-sodium`\
  \ 配置开关，在 Windows 下则需要在 `php.ini` 中添加 `extension=sodium` 条目。如既往一样，可以在 PHP 手手册找到更多信息：[`www.php.net/sodium`](https://www.php.net/sodium)。\n\
  \n本章涵盖的话题只是 Web 应用潜在安全漏洞的冰山一角。但如果你至少养成检查所有用户输入的习惯，许多潜在危险就可以被避免。再次，服务器日志通常提供了关于坏人如何开始以及他们在哪里寻找漏洞的线索。总而言之，你应该始终比坏者领先一两步。\n\
  \n# 33 身份验证\n\n安全是当今世界最重要的 IT 主题之一。这是一件好事。用户身份验证是这里的关键问题。\n\n安全的一个部分当然是安全编程；你可以在第\
  \ 32 章中阅读更多内容。但本章介绍的是开发者经常面对的一个任务：在网站上识别用户并赋予他们权限。\n\n### 注意\n\n“身份验证”（authentication）和“授权”（authorization）这两个术语有时互换使用。从定义上来说这是不正确的：身份验证是关于识别用户；授权是关于授予用户权限。在\
  \ Web 上，这通常只有一步：用户登录并从而获得访问权限。然而，授权也可以涉及分配权限，例如在角色系统内部。在这种情况下，用户通过身份验证并获得不同层次的权限。\n\
  \n本章的重点是身份验证。对此有几种方案：\n\n*   **由 Web 服务器提供的身份验证**\n    `Apache` 在此处提供了一个广泛使用的选项。`IIS`\
  \ 也提供类似的功能，尽管在实践中很少使用。\n*   **手动设置 HTTP 身份验证**\n    虽然 `HTTP` 协议的这种机制也被 `Apache`\
  \ 用于自身的验证，但你也可以使用 `PHP` 独立于 Web 服务器控制 `HTTP` 身份验证。\n*   **使用 Session 进行身份验证**\n\
  \    你对第 15 章中的 Session 一定熟悉。这第三种替代方案总是会发挥作用，例如在同时也需要授权时。由于它是直接在 `PHP` 中实现的，因此它也独立于环境——即\
  \ Web 服务器及其配置。\n*   **基于标准的身份验证**\n    这指的是所有基于当前标准（如 `OIDC` 和 `OAuth`）的身份验证程序。当多个应用程序想要登录中央位置（所谓的身份提供者）时，它们的时代就到了。\n\
  \n本章描述了前两种方案，并使用了基于标准的身份验证的小示例。最后，我们得出一个包含 Session 身份验证的结论。\n\n## 33.1 Apache\n\n\
  `Apache` 提供了一种简单的用户身份验证形式，这在实践中常用。其核心是 `.htaccess` 配置文件。或者，你也可以在 Web 服务器配置中全局定义或为特定的\
  \ `VHost` 定义配置。（注：由于提供的原始文本存在大量重复和格式混乱，此处翻译已根据要求提取了核心逻辑并进行了清理。）\n\n\n\n它规定了进行身份验证必须满足的条件。使用\
  \ `valid-user` 时，每个用户必须输入正确的用户名和密码图图 33.2](#33_001.html#f33.2) 显示了用户的输入掩码。\n\n![Apache\
  \ 请求身份验证](img/img-f33.2.html) \n\n**图 33.2** Apache 请求身份验证\n\n10. 现在将 `httpd.conf`\
  \ Apache 配置文件中根目录或你的应用程序目录的 `AllowOverride` 设置从：\n\n```\nAllowOverride None  \n\
  ```\n\n改为：\n\n```\nAllowOverride AuthConfig.  \n```\n\n现在有了更多几个设置选项。与其使用 `require\
  \ valid-user` 允许所有用户访问，你也可以将访问限制为某些用户：\n\n```\nrequire user user2  \n```\n\n你还可以只允许特定类型的访问：\n\
  \n```\n<Limit GET POST> \nrequire user nutzer \nrequire user nutzer2 \n</Limit>\
  \  \n```\n\n### 注释\n\n注意：在这种情况下，其他 HTTP 动词并没有被阻止，而是被启用了！或者，你也可以使用 `<LimitExcept>`，在这种情况下，会对列出方法以外的所有方法执行访问控制。\n\
  \n除了用户管理外，你还可以创建组。这需要以下操作：\n\n1. 在 `.htaccess`（或 `ht.access`）文件中，你添加对应文件的指定：\n\n\
  ```\nAuthGroupFile Path/.htgroup  \n```\n\n2. 然后在文本编辑器中创建此文件。它包含组名，后跟着一个冒号。然后是属于该组的所有用户名。注意，这些用户必须在普通用户文件（此处为\
  \ `.htpasswd`）中存在并带有密码！\n\n```\nmanagers: user user2  \n```\n\n### 注释\n\n包含组参与者的一行最大\
  \ own 为 8 KB。不过，你可以很容易地在下一行继续使用相同的用户名：\n\n```\nstaff: many \nstaff: even_more \n\
  ```\n\n3. 现在回到 `.htaccess` (`ht.access`)。在其中输入一个（或多个）组：\n\n```\nrequire group projectmanager\
  \  \n```\n\n顺便提一下，尽管有了组，你仍然可以指定单个用户——例如：\n\n```\nrequire user admin  \n```\n\n###\
  \ 注释\n\n如果你有大量密码，在文本文件中管理它们就不再有意义。此时可以使用 Apache 模块将用户名和密码存储在数据库中。最为人知的替代方案是使用 `mod_auth_dbm`\
  \ 将其存储在 DBM 数据库中。\n\n## 33.2 IIS 身份验证\n\nInternet 信息服务 (ISS)148 是微软 Windows 中的标准\
  \ Web 服务器。在生产系统中，通常是在 Windows 机器上使用 IIS 而不使用 Apache。IIS 提供了一系列身份验证选项。然而，其中某些并不适用于\
  \ Web 使用。通过 Kerberos 的集成 Windows 身份验证仅对内部网有用，例如客户端和服务器应该属于同一个域。\n\n基本身份验证（标准验证）和你已经在\
  \ Apache 中了解过的摘要身份验证（digest authentication）在这里是可以考虑。IIS 使用相同的 HTTP 能力。IIS 与 Apache\
  \ 相比，主要缺点是使用了现有的 Windows 用户账户进行身份验证。无论关联列表存储在何处，总是涉及一些工作。\n\n### 注释\n\n在图书馆系统等地方使用的一种方法是\
  \ IP 识别。在用户自己的页面上只允许预定义的 IP 范围。这种身份验证可以带密码识别实现，也可以不带密码。然而，对于具有灵活 IP 地址的用户来说，这永远没有意义。例如，大多数互联网服务提供商就是这种情况。此外，例如一位教授只有在处于大学网络内部时才能查看他的书籍。如果他在参加会议，那么这个系统对他来说就没用了。\n\
  \n要在 IIS 中使用标准身份验证，需要执行以下步骤：\n\n1. 首先，你需要激活基本身份验证。转到“启用或关闭 Windows 功能”。你可以在控制面板\
  \ • 程序和功能中找到它。\n\n2. 转到“万维网 服务 • 安全”并启用基本身份验证。\n\n3. 打开 Internet 信息服务 (IIS) 管理器。你可以在控制面板中找到它。\n\
  \n4. 在“连接”窗中，展开服务器名称，展开“站点”，然后点击你想启用基本身份验证的站点。\n\n5. 点击“身份验证”并启用基本身份验证。\n\n6. 下一步必须禁用匿名身份验证。\n\
  \n现在你可以根据需要为此目录添加用户或用户组。在配置中，`<basicAuthentication>` 现在可用。要使用摘要身份验证，你必须切换到一个用户账户，并为其中一个用户选择可逆加密。\n\
  \n![基本身份验证已激活](img/img-f33.3.html) \n\n**图 33.3** 基本身份验证已激活\n\n## 33.3 手动 HTTP 身份验证\n\
  \n不将 HTTP 身份验证交给服务器有几个优点：\n\n* 你不需要折腾文本文件或使用 Apache 并不那么简单的数据库函数，而是可以使用 PHP 控制一切。\n\
  * 与 IIS 相比，你的优势在于你不需要处理用户账户。\n* 你可以（相对）独立于 Web 服务器进行工作。\n\nHTTP 身份验证实现很快。你还记得 HTTP\
  \ 身份验证开始时发生了什么吗？浏览器接收到 HTTP 消息 401，你可以使用 PHP 输出它：\n\n```\nheader(\"WWW-Authenticate:\
  \ Basic=\\\"PHP\\\"\");\nheader(\"401\");\n```\n\n### 注释\n\n注意：在某些配置下（特别是使用 IIS），之前的行不起作用！在这种情况下，稍微修改后的头部通常会有帮助：\n\
  \n```\nheader(\"WWW-Authenticate: Basic=\\\"PHP\\\"\");\nheader(\"Status: 401\"\
  );\n```\n\n查询出现了（见图 33.4），但当然还没有密码检查。你通过 `$_SERVER[\"AUTH_USER\"]` 和 `$_SERVER[\"\
  AUTH_PW\"]` 访问用户名和密码。这允许快速实现密码检查。下面的列表显示了一个简单的脚本；图 33.5 显示了输出。\n\n```php\n<?php\n\
  \  if (isset($_SERVER[\"AUTH_USER\"]) &&\n            $_SERVER[\"AUTH_USER\"] ==\
  \ \"test\" &&\n            $_SERVER[\"AUTH_PW\"] == \"secure\") {\n    echo \"验证成功，欢迎！\"\
  ;\n    echo $_SERVER[\"AUTH_USER\"];\n \n  } else {\n    header(\"WWW-Authenticate:\
  \ Basic=\\\"PHP\\\"\");\n    header(\"HTTP/1.0 401\");\n  }\n?>\n```\n\n**列表 33.1**\
  \ 使用 HTTP 进行用户验证 (\"authenti_http.php\")\n\n![查询出现了](img/img-f33.4.html) \n\n**图\
  \ 33.4** 查询出现了\n\n### 注释\n\n使用简单的 if 检查单个用户名是最简单的变体。然而，你也可以编写自己的身份验证类，在其后添加数据库，以此此类推。原理没有改变。\n\
  \n测试时，你必须记住，在关闭浏览器之前，每次调用页面浏览器都会提供第一次输入的用户名和密码。要测试一种变体，你必须关闭浏览器或直接更改所需的密码。在密码的情况下，由于旧的浏览器密码不再正确，将返回“未验证”，用户可以重新输入。\n\
  \n\n\n使用 IIS 时，身份验证可能会遇到困难。重要的是，你必须关闭集成式 Windows 身份验证，因为这始终优于标准验证（包括手动 HTTP 身份验证）。如果不这样做，即使你输入了正确的用户名和密码，系统也会不断提示你输入。匿名访问是唯一不产生干扰的选项，因为它是从属的。\n\
  \n针对 IIS 反复报告了一些特殊特性和问题。在出现问题时，你应该注意以下最重要的几点：\n\n*   `$_SERVER` 变量存在问题。在某些 IIS/PHP\
  \ 组合中，返回不是 `$_SERVER[\"PHP_AUTH_USER\"]` 和 `$_SERVER[\"PHP_AUTH_PW\"]`，而是只返回 `$_SERVER[\"\
  HTTP_AUTHORIZATION\"]`，其中包含了用户名和密码。你可以通过以下结构过滤出这两者：\n\n```php\n$data = split(\"\
  :\", base64_decode(substr($_SERVER[\"HTTP_AUTHORIZATION\"],\n               6)));\n\
  \ $user = $data[0];\n $pass = $data[1];  \n```\n\n*   你通过冒号分割解码后的字符串。字符串从第六个字符开始，因为前五个字符包含身份验证方法——即\
  \ Basic（基础）。\n\n*   有时还会提示在 IIS 中安装 PHP ISAPI 模块作为过滤器（网站 • 属性 • ISAPI 过滤器）。\n\n\
  ## 33.4 基于标准的身份验证\n\n多年来，基于标准的身份验证在 Web 领域取得了成功。其原因在于 Web 架构的快速变化。过去，一家公司通常只有一个网站作为中心\
  \ Web 应用，客户可以在其中登录；而现在许多公司除了强制性的网站之外，还为客户提供客户门户、在线商店、在线学习系统等。所有这些应用程序都需要用户登录。那么，还有什么比将用户身份验证外包给独立服务（通常称为身份提供者）更显而易见的呢？\n\
  \n### 注意\n在多个应用程序中使用同一个登录名通常被称为单点登录（SSO）。这里需要注意的是：只有当用户在切换应用程序之间不需要不需要多次登录时，它才称是“真正的”单点登录。\n\
  \n除了真实用户的身份验证外，通过编程接口（API）进行数据交换也需要身份验证和授权选项。让我们来看一些重要的标准：\n\n*   OAuth 2.0 ([`s-prs.co/v602292`](http://s-prs.co/v602292))\
  \ 是身份验证和授权的基本标准。它最初为 API 客户端的身份验证开发，现在也与 OIDC 结合用于用户身份验证。\n\n*   OpenID Connect\
  \ (OIDC; [`s-prs.co/v602293`](http://s-prs.co/v602293)) 规范了身份数据的结构和交换。数据交换基于 REST\
  \ 原则并使用 JSON 作为数据格式。形象地地说，OIDC 是基于 OAuth 的。\n\n*   JSON Web Token (JWT; [`s-prs.co/v602294`](http://s-prs.co/v602294))\
  \ 定义了 OAuth 如何定义令牌的结构。\n\n*   Security Assertion Markup Language (SAML; [`s-prs.co/v602249`](http://s-prs.co/v602249))\
  \ 是一种基于 XML 的标准，定义了身份验证和授权数据的结构。\n\n基于标准的身份验证的示例，在本章中我们使用了 Google 的身份提供者。Google\
  \ 在此处提供了以下基本选项：\n\n*   通过名为 `GoogleSignIn` 的 Google  提供的现成客户端用户登录。此处的功能是“使用 Google\
  \ 登录”选项。\n\n*   以 OIDC、OAuth 和 JWT 为技术基础的完整身份验证 API。这可以很好地在 PHP 服务端使用。\n\n对于我们的示例，我们对\
  \ Google APIs 使用基于 OAuth 的身份验证。在内部，Google 使用它自己的用户身份验证。\n\n### 注意\n如果你不想仅仅连接到基于标准的身份提供者，而是想建立自己的身份提供者，你也可以在\
  \ PHP 世界中找到许多解决方案。然而，其中许多是某些 PHP 框架的一部分。OIDC 的独立解决方案是 phpOOIDC ([`s.prs.co/v602250`](http://s.prs.co/v602250))。OAuth\
  \ 服务器的良好概述可以在 [`oauth.net/code/php`](https://oauth.net/code/php) 找到。\n\n### 33.4.1\
  \ Google 项目的准备\n\n此处实现的示例基于 Google 非常丰富的 API 库中的一个标准示例。它提供了对 200 多个 Google API 的访问。在示例中，我们使用\
  \ Google Drive API，如果用户通过我们的应用程序身份验证并授权我们访问这些 API 权限，就可以访问其 Google Drive 中的文件。\n\
  \n#### 创建项目\nGoogle 上每个 API 查询的基础都是你在 Cloud Console 中创建的 API 项目：[`console.cloud.google.com`](https://console.cloud.google.com)。你只需要一个\
  \ Google 账号。只要你只将该项目用于测试目的，一切都是免费的。你可以无额外费用创建共十二这样的项目。\n\n![Create a Project](img/klein33_006.png)\n\
  *图 33.6*\n\n#### 创建凭据\n在下一步中，为项目命名。如果你已经在使用该项目，也可以将其分配给你的账户。\n\n项目创建后，你就可以随时在凭据视图中访问它。在下一步中，我们需要一些与安全相关的细节。让我们仔细查看。\n\
  \nAPI 密钥与身份验证尚没有直接关系。要实现这一点，你需要创建所谓的 OAuth 客户端 ID。Google 期望每个想要访问 API 的应用程序或移动应用都拥有一个这样的客户端\
  \ ID。对于我们的示例，我们选择“Web 应用程序”作为应用程序类型，因为我们想通过 PHP 使用 Web 访问应用程序。\n\n一个 OAuth 客户端 ID\
  \ 由几个部分组成：首先是客户端 ID 本身，其次是客户端密钥或密钥。我们在 PHP 应用程序中需要这两个数据，以便以后通过 OAuth 访问项目中的 API（即\
  \ Google Drive API）。要使用它们，Google 提供了一个方便的函数：一旦你创建了客户端 ID，凭据视图中就会出现一个下载图标。下载提供了一个包含项目和应用程序相关数据的完成\
  \ JSON 文件：\n\n```json\n{ \"web\":\n  {\n    \"client_id\": \"xyz.apps.googleusercontent.com\"\
  ,\n    \"project_id\": \"rheinwerk-php\",\n    \"auth_uri\": \"https://accounts.google.com/o/oauth2/auth\"\
  ,\n    \"token_uri\": \"https://oauth2.googleapis.com/token\",\n    \"auth_provider_x509_cert_url\"\
  : \"https://www.googleapis.com/oauth2/v1/certs\",\n    \"client_secret\": \"xyz\"\
  \n  }\n}\n```\n\n默认情况下，JSON 文件使用客户端 ID 作为文件名。为了简单起见，我们将其重命名为 `client_secrets.json`。\n\
  \n![The Name for the Project](img/klein33_007.png)\n*图 33.7*\n\n![The Interface\
  \ for the Login Data](img/klein33_008.png)\n*图 33.8*\n\n\n\n\n另一个安全功能隐藏在 OAuth 客户端\
  \ ID 的 `Authorized Redirect URIs`授权重定向 URI）设置之后。在这里，你应该输入 Google 在用户授权后应该重定向到的所有地址。在我们的案例中，这应该是本地地址：`http://localhost/php/oauth2callback.php`。如果你忽略了这一点，在重定向过程中与用户测试时，将会收到相应的错误消息。\n\
  \n## 配置同意屏幕\n\n由于你的应用程序稍后会请求用户同意通过 API 访问其数据，因此你仍然需要在 Google 项目中处理所谓的“同意屏幕”（也称为用户同意屏幕）。事实上，Google\
  \ 甚至强制你在创建第一个 OAuth 客户端 ID 之前完成此操作。\n\n项目中的许多重要设置都隐藏在审核屏幕之后：首先，你定义哪些用户可以访问该项目。只有当你将\
  \ Google 作为公司的内部平台时，才能使用“内部用户”。对于我们的示例，“外部用户”是正确的选择。只要你只想进行测试，就必须在第三步中单独指定用户。当你的项目以后准备上线时，它将通过\
  \ Google 的审核流程。\n\n![同意屏幕的设置也决定了哪些用户使用应用程序](img/img-f33.9.html) \n\n**图 33.9** \
  \     同意屏幕的设置也决定了哪些用户使用应用程序\n\n在测试用例中，可以将基本的应用程序信息（如名称、支持电子邮件和各种重要链接）保持简洁，或者除了必填字段（用星号标出）外直接留空。\n\
  \n这些区域基本上是对某些用户个人资料数据的授权，例如 `.../auth/userinfo.email` 情况下的电子邮件地址。\n\n现在仍然缺少测试用户。在简单的情况下，使用你创建项目时使用的\
  \ Google 账号即可。\n\n## 激活 API\n\n最后，你现在必须激活 Google Drive API。要做到这一点，请找到 `APIs & Services`下的\
  \ `Enable APIs & Services`（启用 API 和服务）按钮。它将进入一个搜索区域，你可以在其中搜索任何 API 并将其激活。在我们的案例中，我们正在寻找\
  \ Google Drive。\n\n![至少添加一个测试用户——可能是你自己的 Google 账号](img/img-f33.10.html) \n\n**图\
  \ 33.10**      至少添加一个测试用户——可能是你自己的 Google 账号\n\n![为 Google Drive 激活所需的 API](img/img-f33.11.html)\
  \ \n\n**图 33.11**      为 Google Drive 激活所需的 API\n\n### 33.4.2 通过 PHP \n\n幸运的是，Google\
  \ 为其 API 提供了库 `Google API PHP Client`。它支持整个 Google API 宇宙。你可以在 [`s-prs.co/v602251`](http://s-prs.co/v602251)\
  \ 找到它。\n\n### 安装\n\n客户端已针对 PHP 8 设计。在当前版本中也可以通过 `Composer` 轻松完成安装：\n\n```bash\n\
  composer require google/apiclient:\"².18\"  \n```\n\n或者在 `composer.json` 中：\n\n\
  ```json\n{\n  \"require\": {\n    \"google/apiclient\": \"².18\"\n  }\n}  \n```\n\
  \n然而，请注意：由于支持如此多的 API，安装需要一些时间，并且大量的 API 类最终会进入服务器。Google 允许通过 `Composer cleanup`\
  \ 只设置相关的 API。这里是一个仅包含 Google Drive 的示例：\n\n```json\n{\n    \"require\": {\n    \
  \    \"google/apiclient\": \"².18\"\n    },\n    \"scripts\": {\n        \"post-update-cmd\"\
  : \"Google\\\\Task\\\\cleanup\"\n    },\n    \"extra\": {\n        \"google/apiclient-services\"\
  : [\n            \"Drive\"\n        ]\n    }\n}\n```\n\n### 步骤\n\n此示例包含两个文件：\n\n\
  *   `google_oauth2_drive.php` 包含了对 Drive API 的实际访问，但重定向到 `oauth2callback.php` 进行验证。\n\
  *   `oauth2callback.php` 使用 Google 的 OAuth 身份提供程序进行身份验证，并在 code URL 参数中接收代码。该文件随后从\
  \ Google 获取访问令牌并将其返回给 `google_oauth2_drive.php`。通过此令牌，`google_oauth2_drive.php`\
  \ 即可访问 Drive 服务。\n\n如果一切正常，用户通过了验证并授权了我们的应用程序，那么流程按时间顺序如下：\n\n```\ngoogle_oauth2_drive.php\n\
  \  -> oauth2callback.php \n         -> <url target=\"https://accounts.google.com/o/oauth2/auth\"\
  > \n            https://accounts.google.com/o/oauth2/auth</url>\n     <- 接收参数 \"\
  code\"\n         -> 使用 \"code\" 验证并从 Google 获取访问令牌\n<- 接收访问令牌\n-> 通过访问令牌访问 Drive\
  \ 服务\n```\n\n![用户选择 Google 账号](img/img-f33.12.html) \n\n**图 33.12**      用户选择 Google\
  \ 账号\n\n\n\n\n\n接下来是决定性的分类区分。如果 Google 已经正确我们的应用程序进行了身份验证和授权，那么 Google 将返回一个 `code`\
  \ URL 参数：\n\n```php\nif (!isset($_GET['code'])) { \n  // 未身份验证 \n} else { \n  //\
  \ 已身份验证 -> 回到 google_oauth2_drive.php \n}  \n```\n\n如果不存在此参数，我们将生成授权 URL 并重定向到此\
  \ Google URL：\n\n```php\n  $auth_url = $client->createAuthUrl(); \n  header('Location:\
  \ ' . filter_var($auth_url, FILTER_SANITIZE_URL));  \n```\n\nGoogle API 客户端在此处使用\
  \ `client_secrets.json` 中指定的 URL 作为基础。\n\n现在在第二种情况下，`code` 参数已设置。在这种情况下，我们将客户端返回的访问令牌（access\
  \ token）保存到会话变量中：\n\n```php\n  $client->authenticate($_GET['code']); \n  $_SESSION['access_token']\
  \ = $client->getAccessToken();  \n```\n\n随后你将被重定向回 `google_oauth2_drive.php`：\n\n\
  ```php\n  $redirect_uri = 'http://localhost/php/google_oauth2_drive.php'; \n  header('Location:\
  \ ' . filter_var($redirect_uri, FILTER_SANITIZE_URL));  \n```\n\n![API 项目中的调用是可见的](img/img-f33.14.html)\
  \ \n\n**图 33.14** API 项目中的调用是可见的\n\n下面的列表概览了完整的源代码。\n\n```php\n<?php \nrequire_once\
  \ 'vendor/autoload.php'; \nsession_start(); \n$client = new Google\\Client(); \n\
  $client->setAuthConfigFile('client_secrets.json'); \n$client->setRedirectUri('http://localhost/php/oauth2callback.php');\
  \ \n$client->addScope(Google_Service_Drive::DRIVE_METADATA_READONLY); \nif (!isset($_GET['code']))\
  \ { \n  $auth_url = $client->createAuthUrl(); \n  header('Location: ' . filter_var($auth_url,\
  \ FILTER_SANITIZE_URL)); \n} else { \n  $client->authenticate($_GET['code']); \n\
  \  $_SESSION['access_token'] = $client->getAccessToken(); \n  $redirect_uri = 'http://localhost/php/google_oauth2_drive.php';\
  \ \n  header('Location: ' . filter_var($redirect_uri, FILTER_SANITIZE_URL)); \n\
  }\n ?>  \n```\n\n**代码列表 33.3** 授权脚本 (\"oauth2callback.php\")\n\n## 33.5 结论\n\n选择身份验证方法时最重要的因素是安全性、性能和易用性。所有概述的解决方案都必须根据这些标准进行衡量：\n\
  \n*   如果用户数量不是太大，在 Apache 中使用 `.htaccess` 进行 HTTP 验证非常容易使用。如果使用 SSL 进行基础认证（basic\
  \ authentication）或直接使用摘要认证（digest authentication），它就是安全的。但在后情况下，浏览器将被排除在外，这通常不是发明者的本意。性能尚可；配合\
  \ SSL。\n*   Google API 客户端在此处使用 `client_secrets.json` 中指定的 URL 作为基础。\n*   现在在第二种情况下，`code`\
  \ 参数已设置。在这种情况下，我们将客户端返回的访问令牌保存到会话变量中。\n*   随后你将被重定向回 `google_oauth2_drive.php`。\n\
  \n\n\n\n\n\n如前所述，`php.ini` 并不是 PHP 配置的唯一场所。结合 Apache Web 服务器（另参阅第 37 章），还有另外两种选项：\n\
  \n*   在 Web 服务器的 `.htaccess` 文件中\n*   在 Apache 配置文件 `httpd.conf` 中\n\n还有一种独立于 Web\
  \ 服务器的第三选项：\n\n*   在 PHP 脚本内部\n\n让我们详细介绍一下这三个选项：\n\n*   在 Apache Web 服务器的每个目录中，你可以使用\
  \ `.htaccess`（取决于 Apache 的配置）来颁发配置指令——例如，用于访问控制或授权（参阅第 33 章）。如果将 Apache 作为模块使用，你还可以通过以下两个指令设置\
  \ PHP 配置项：\n\n    *   `php_value option value`\n    *   `php_flag option value`\n\
  \n    使用 `php_value` 为那些你通常会在 `php.ini` 文件中找到的配置项指定值。用空格分隔设置名称和值：\n\n    ```\n \
  \   php_value session.save_path  \"/sessiondata\"\n    ```\n\n    `php_flag` 等同于标志位——即用于布尔值：\n\
  \n    ```\n    php_flag short_open_tag  On\n    ```\n\n*   完整的 Apache 配置可以在 `httpd.conf`\
  \ 文件中找到；在那里你可以设置例如哪些文件扩展名由哪些模块处理，以及它们具有哪些 MIME 类型。在 ways 也可以设置某些 PHP 设置。在 `.htaccess`\
  \ 中已知的 `php_value` 和 `php_flag` 指令同样可用，还有以下两个变体：\n\n    *   `php_admin_value option\
  \ value`\n    *   `php_admin_flag option value`\n\n    这两个指令的优势在于它们不能被 `.htaccess`\
  \ 覆盖。\n\n*   最后但同样重要的是，你可以基于脚本设置配置值。关联的函数是 `ini_set()`：\n\n    ```php\n    <?php\n\
  \      ini_set(\"include_path\", \".:/my/pear/path\");\n     ?>\n    ```\n\n因此这里有很多可能性，但遗憾的是，并不是每一种都总是可行的选项。这是可以理解的，因为如果脚本能够通过\
  \ `ini_set()` 更改 `auto_prepend_file` 将是致命的，因为 `auto_prepend_file` 在 PHP 脚本执行之前就已经生效了。这就是为什么配置项分为四类，你可以在表\
  \ 34.1 中找到。\n\n| 类别 (常量) | 数值 | 可更改的选项 |\n| --- | --- | --- |\n| PHP_INI_USER |\
  \ 1 | `ini_set()` |\n| PHP_INI_PERDIR | 2 | `.htaccess`, `httpd.conf`, `php.ini`\
  \ |\n| PHP_INI_SYSTEM | 4 | `httpd.conf`, `php.ini` |\n| PHP_INI_ALL | 7 | `ini_set()`,\
  \ `.htaccess`, `httpd.conf`, `php.ini` |\n\n**表 34.1** 四大配置类别\n\n还有一些选项只能在 `php.ini`\
  \ 中设置，例如 `disable_functions`。你可以在两个地方找到配置项的分类：\n\n*   在页面上\n*   在手册中央位置\n\n\n\n\n\
  \n\n```ini\n;;;;;;;;;;;;;;;;;;;;;;;;;;;;;; \n; 错误处理与日志 ; \n;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;\
  \ \n; error_reporting 级别： \n; E_ALL                - 所有错误和警告\n; E_ERROR        \
  \      -（致命的）运行时错误\n; E_RECOVERABLE_ERROR  - 几乎致命的运行时错误\n; E_WARNING           \
  \ - 非致命的运行时错误\n; E_PARSE              - 解析器错误\n; E_NOTICE             - 运行时通知\n\
  ; E_CORE_ERROR - PHP 启动时的错误 ; \n; E_CORE_WARNING - PHP 启动时的警告 ; \n; E_COMPILE_ERROR\
  \ - 编译时的错误 ; \n; E_COMPILE_WARNING - 编译时的警告 \n; E_USER_ERROR - 用户特定的错误消息 \n; E_USER_WARNING\
  \ - 用户特定的警告 \n; \nE_USER_NOTICE - 用户特定的通知 ; \nE_DEPRECATED - 针对未来 PHP 版本中将不再使用的代码的警告\
  \ \nE_USER_DEPRECATED - 针对过时代码的用户特定警告 \n; \n; 示例： \n; \n; - 除警告和兼容性注释以外的所有内容 \n\
  ; \n error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED \n; \n; - 除兼容性注释以外的所有内容\
  \ \nerror_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT \n; 将错误发送到客户端（浏览器） \ndisplay_errors\
  \ = Off \n; PHP 启动时的错误 \ndisplay_startup_errors = Off\n; 将错误写入系统日志文件 \nlog_errors\
  \ = On \n; 错误消息的最大长度（0 = 无限制） \nlog_errors_max_len = 1024 \n; 仅保存相同的错误位置一次\nignore_repeated_errors\
  \ = Off \n; 每个文件仅报告一个错误 \nignore_repeated_source = Off \n; 报告内存泄漏 \nreport_memleaks\
  \ = On \n; 在错误消息中启用 HTML（开启 = 可点击的错误消息） \n;html_errors = On \n; 本地 PHP 手册的路径（用于\
  \ html_errors） \n;docref_root = \"/phpmanual/\" \n;docref_ext = .html \n; 错误消息前的自动文本\
  \ \n;error_prepend_string = \"<span style='color: #ff0000'>\" \n; 错误消息后的自动文本 \n\
  ;error_append_string = \"</span>\" \n; 错误的专用日志文件 \n;error_log = php_errors.log \n\
  ; 使用 syslog（或 Windows 事件日志）处理错误 \n;error_log = syslog  \n```\n\nPHP 最重要的任务无疑是处理用户数据。在“数据处理（Data\
  \ Handling）”下，有一整系列配置开关用于此操作：\n\n```ini\n;;;;;;;;;;;;;;;;; \n; 数据处理 ; \n;;;;;;;;;;;;;;;;;\
  \ \n;\n; PHP 生成的 URL 中参数的分隔符 \n;arg_separator.output = \"&amp;\" \n; PHP 解析 URL\
  \ 时的参数分隔符 \n;arg_separator.input = \";&\" \n; PHP 环境、GET、POST、cookie、 \n; 服务器和自定义变量被注册的顺序\
  \ \nvariables_order = \"GPCS\" \n; PHP 环境、GET、POST、cookie、服务器和自定义 \n; 变量在 $_REQUEST\
  \ 中注册的顺序 \nrequest_order = \"GP\" \n; 指定 GET 变量是否应保存在 argv 和 argc 中（仅在未激活 auto_globals_jit\
  \ 时才可能） \nregister_argc_argv = Off \n; 指定环境、服务器和请求变量是否仅在第一次使用时创建 \nauto_globals_jit\
  \ = On\n; POST 数据的最大 own（上传有单独的设置！） \npost_max_size = 8M \n; 在每个 PHP 脚本执行前/后追加/执行（append/execute）文件\
  \ \nauto_prepend_file = \nauto_append_file = \n; Content-Type HTTP 头部的值 \ndefault_mimetype\
  \ = \"text/html\" \n; HTTP 头部的字符集 \ndefault_charset = \"UTF-8\"  \n```\n\nPHP 不提供集成的项目管理，因此在模块化应用方面，许多工作是通过外部文件完成的。“路径与目录（Paths\
  \ and Directories）”部分包含了指定这些文件位置的设置，其他如下：\n\n```ini\n;;;;;;;;;;;;;;;;;;;;;;;;; \n\
  ; 路径与目录 ; \n;;;;;;;;;;;;;;;;;;;;;;;;; \n; 通过 include/include_once/require/require_once\
  \ 搜索包含文件的路径 \n; UNIX: \"/path1:/path2\" \n;include_path = \".:/php/includes\" \n\
  ; \n; Windows: \"\\path1;\\path2\" \n;include_path = \".;c:\\php\\includes\" \n\
  ; PHP 脚本的根目录 \ndoc_root = \n; PHP 打开脚本的目录 \nuser_dir = \n; 扩展模块所在的目录（Windows 以外的所有情况）\
  \ \n; extension_dir = \"./\" \n; 扩展模块所在的目录（Windows 版本） \n; extension_dir = \"ext\"\
  \ \n; CGI 模式的额外安全保护。 \n; 对于 IIS 必须设置为 0! ; \ncgi.force_redirect = 1 \n; 指定 PHP 是否应对每个请求发送\
  \ HTTP 状态码 200 ; \ncgi.nph = 1 \n; 如果 cgi.force_redirect 已激活，则 PHP 查找的环境变量 ; \n\
  cgi.redirect_status_env = ; \n; 根据规范调整 CGI 路径信息 \n; cgi.fix_pathinfo = 1; \n; CGI\
  \ 二进制文件可以位于 Web 文件夹之外 \n; cgi.discard_path = 1; \n; 在 IIS 下启用身份伪装 \n; fastcgi.impersonate\
  \ = 1; \n; 禁用 FastCGI 日志 \n; fastcgi.logging = 0; \n; PHP 发送的 HTTP 头部类型。 \n; 0 =\
  \ Apache 兼容（默认值）， \n; 1 = RFC2626 兼容\n;cgi.rfc2616_headers = 0  \n```\n\n对于文件上传，php.ini\
  \ 中有一个专门的章节：\n\n```ini\n;;;;;;;;;;;;;;;; \n; 文件上传 ; \n;;;;;;;;;;;;;;;; \n; 激活文件上传\
  \ \nfile_uploads = On \n; 临时目录 \nupload_dir = \n; 上传文件最大大小 \nupload_max_filesize\
  \ = 2M \n; 请求允许的文件数 \nmax_file_uploads = 20\n```\n\nPHP 实用的功能之一是可以使用 URL 进行操作。这种行为可以通过\
  \ `allow_fopen` 和 `allow_wrap` 来控制：\n\n```ini\n;;;;;;;;;;;;;;;; \n; PHP 包装器 ; \n\
  ;;;;;;;;;;;;;;;; \n; 指定是否将 URL 视为文件 \nallow_fopen = On \n; 指定是否通过 URL 执行文件 \n;（自\
  \ PHP 7.4 起弃用，因此会有警告） \nallow_wrap = Off \n; 匿名 FTP 的密码 \n;from=\"john@doe.com\"\
  \ \n; 使用 FTP 时的代理 \n;user_agent=\"PHP\" \n; Socket 连接超时时间（秒） \ndefault_socket_timeout\
  \ = 60 \n; 自动检测换行符（针对 Mac）\n;auto_detect_lineings = Off \n```\n\n最后，让我们查看加载动态扩展模块（如\
  \ PDF 库）的区域：\n\n```ini\n;;;;;;;;;;;;;;;;;;;;;;;;; \n; 动态扩展 ; \n;;;;;;;;;;;;;;;;;;;;;;;;;\
  \ \n; \n;extension=bz2 \n;extension=ldap \n;extension=curl \n```\n\n执行此操作，只需移除 `extension=`\
  \ 前的分号。`extension=` 语句如果没有注释，将加载相应的 `.dll` 或 `.so` 扩展。php.ini 的其余设置是模块特定的选项，请参考相应的章节。在这里你可以输入使用的默认时区：\n\
  \n```ini\n;;;;;;;;;;;;;;;;; \n; 模块设置 ; \n;;;;;;;;;;;;;;;;;\n\n [Date] \n; 默认时区 \n\
  ;date.timezone = \n```\n\n时区的的一个可能值是 \"Europe/Berlin\"，完整列表可以在 [`php.net/manual/timezones.php`](http://php.net/manual/timezones.php)\
  \ 找到。\n\n本章简要介绍了 php.ini 文件，并介绍了更改相关设置的各种方法。忘记所有设置很容易的，但在实践中，只有少数设置需要修改（例如 `extension_dir`）。另一方面，你总是能发现实用的或性能优化选项，因此值得一看。\n\
  \n# 第八部分\n\n超越 PHP\n\n# 35   使用 Xdebug 进行排错\n\n调试是为犯错的人准备的——不幸的是，这意味着我们所有人。我们使用标准方法（或其他技术）在\
  \ PHP 脚本中查找错误。\n\n\n\n\n本书中的示例都有一个共同点：它们可以运行（至少在我们的测试中是如此的）。然而，代码并非凭空掉下来的，有时是多次尝试和试验的结果。在实现的过程中，我们反复遇到错误，然后必须纠正它们。本章将简要描述用于处理这些问题的一些技术。\n\
  \n我们现在不做的不是检测解析器错误并修复它们。对于此类错误，源代码在语法上是错误的；例如，可能缺少了括号或引号。然而，`PHP` 总是会指示错误发生的行，这可以很好地提示问题所在或应该从哪里查看。如果你使用一个（良好的）编辑器，它会在你输入时警告你错误。\n\
  \n![解析器错误](img/img-f35.1.html) \n\n**图 35.1** 解析器错误\n\n### 提示\n\n还有一个提示：错误信息中的行号（参见图\
  \ 35.1）有时会高出一行。原因是：在 `PHP` 中，你可以将语句跨越几行；它们通常只由分号终止。如果 `PHP` 没有找到分号，`PHP` 解释器只有在下一行才会注意到。\n\
  \n为了演示调试技术， 149 我们需要一个（略有错误的）示例脚本。它是由一个没有读过正则表达式章节（第 10 章）的人编写的。该脚本是从文本文件中过滤掉所有的\
  \ URL。方法如下：\n\n*   逐行读取文件。\n*   检查每行查看是否包含字符字符串 `http://`。\n*   如果是，系统将搜索 URL 的结束位置（空格或右括号之后）。\
  \ 150 \n*   显示所有找到的 URL。\n\n下面的列表显示了完整的示例。\n\n```\n<?php\n  $url = [];\n  $file\
  \ = fopen(\"text.txt\", \"r\");\n  while (!feof($file)) {\n    $line = fgets($file,\
  \ 1024);\n    if ($start = strpos($line, \"http://\")) {\n      $end1 = strpos($line,\
  \ \")\", $start+1);\n      $end2 = strpos($line, \" \", $start+1);\n      if ($end1\
  \ == -1 && $end2 == -1) {\n        $end = strlen($line);\n      } elseif ($end1\
  \ == -1) {\n        $end = $end2;\n      } elseif ($end2 == -1) {\n        $end\
  \ = $end1;\n      } else {\n        $end = min($end1, $end2);\n      }\n      $url[]\
  \ = substr($line, $start, $end - $start);\n    }\n  }\n  fclose($file);\n  echo\
  \ implode(\"<br />\", $url);\n?>  \n```\n\n**列表 35.1** （有错误的）URL (\"debugger.php\"\
  )\n\n当然，你还需要 `text.txt` 输入文件，如下一个列表所示。\n\n```\n在经过无尽的等待后，PHP 项目 (http://php.net/)\
