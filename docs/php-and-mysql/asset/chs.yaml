  \ . \"!\";\n        }\n      }\n      $sql = sprintf(\"SELECT * FROM guestbook WHERE\
  \ id=%s\",\n        pg_escape_string($_GET[\"id\"]));\n      $result = pg_query($db,\
  \ $sql);\n      if ($row = pg_fetch_object($result)) {\n        $Name = utf8_decode($row->author);\n\
  \        $Email = utf8_decode($row->email);\n        $Heading = utf8_decode($row->heading);\n\
  \        $Comment = utf8_decode($row->entry);\n      }\n      pg_close($db);\n \
  \   } else {\n      echo \"Error!\";\n    }\n  }\n?>\n```\n\n```html\n<form method=\"\
  post\" action=\"\">\nName <input type=\"text\" name=\"Name\" value=\"<?php\n  echo\
  \ htmlspecialchars($Name);\n?> /><br>\nEmail <input type=\"text\" name=\"Email\"\
  \ value=\"<?php\n  echo htmlspecialchars($Email);\n?> /><br>\nHeading <input type=\"\
  text\" name=\"Heading\" value=\"<?php\n  echo htmlspecialchars($Heading);\n?> /><br>\n\
  Comment<textarea cols=\"70\" rows=\"10\" name=\"Comment\"><?php\n  echo htmlspecialchars($Comment);\n\
  ?></textarea><br>\n<input type=\"submit\" name=\"Submit\" value=\"Update\" />\n\
  </form>\n</body>\n</html>\n```\n\n**列表 23.17** 编辑条目（`gb-edit.php`）\n\n\n\n\n\n一个重要的安装步骤是指定运行\
  \ `MongoDB` 的用户以及存储数据库的目录（请参见 图 24.2）。安装程序将授予所选用户对该文件夹的写权限，因此你应该仔细考虑是否真的想将程序目录用于此目的。\n\
  \n### 提示\n\n`MongoDB Compass` 管理软件也可以作为安装程序的一部分进行安装，它为 `MongoDB` 数据库提供了一个实用的图形用户界面。不过，你也可以以后从\
  \ [`s-prs.co/v602235`](http://s-prs.co/v602235) 下载。\n\n安装完成后，目标目录下会有一些可执行文件（在 Windows\
  \ 下，这些是 `.exe` 文件；否则它们没有扩展名）：\n\n* `mongod`: 数据库服务，也是最重要的组件\n* `mongo`: 用于管理和操作数据库的交互式\
  \ shell\n* `mongodump`: 用于创建数据库转储文件（备份）\n* `mongorestore`: 用于恢复转储文件\n* `mongoexport`:\
  \ 用于导出数据库数据（例如 JSON 格式）\n* `mongoimport`: 用于导入数据库数据（例如 JSON 格式）\n* `mongostat`:\
  \ 提供有关 `MongoDB` 实例的状态信息\n* `mongotop`: 提供有关单个 `MongoDB` 数据存储的状态信息\n\n![用户和数据目录的选择](img/img-f24.2.html)\n\
  \n**图 24.2** 用户和数据目录的选择\n\n因此，你必须启动 `mongod` `MongoDB` 守护进程，除非你在安装期间选择了为 `MongoDB`\
  \ 安装服务。在一种情况下，使用操作系统的服务管理会更方便（请参见 图 24.3）。\n\n关于 `MongoDB` 的 PHP 扩展，你必须小心：名为 `mongo`\
  \ 的是旧版本（不兼容 PHP 7 及更高版本）。`MongoDB` 本身有一个官方扩展，原则上它允许 PHP 与 `MongoDB` 服务器进行通信。不过，使用基于\
  \ PHP 扩展的 PHP 库会更方便。\n\n但首要任务是：虽然 PHP 在线手册（[`php.net/mongodb`](http://php.net/mongodb)）中也有关于\
  \ `MongoDB` 的信息，但 `MongoDB` 的数据库扩展并不是标准发行的一部分。该扩展位于 PECL。相应的页面是 [`pecl.php.net/package/mongodb`](https://pecl.php.net/package/mongodb)，但该包实际的主页可以在\
  \ [`www.mongodb.com/docs/drivers/php`](https://www.mongodb.com/docs/drivers/php)\
  \ 找到。在后者，你还会找到指向托管在 GitHub 上的源代码[\\[ 121 \\]](footnotes.html#ftn-fn24_01) 的链接以及更详细的信息。\n\
  \n如果你在 Unix/Linux 或 macOS 上工作，可以直接获取扩展：\n\n```\npecl install mongodb\n```\n\n![安装后\
  \ MongoDB 服务自动运行](img/img-f24.3.html)\n\n**图 24.3** 安装后 MongoDB 服务自动运行\n\nWindows\
  \ 用户可以在项目页面 [`pecl.php.net/package/mongodb`](http://pecl.php.net/package/mongodb)\
  \ 访问 PECL。在项目发布列表中，通常有一个标记为 `DLL` 的链接，指向文件列表。在链接缺失的情况下，GitHub 页面可以达到目标。在 [`s-prs.co/v602236`](http://s-prs.co/v602236)，有适用于各种\
  \ PHP 版本的 Windows 扩展：适用于 32 位和 64 位 PHP，以及线程安全（适用于 Apache 及等）和非线程安全（适用于 IIS）选项。\n\
  \n扩展的集成像通常一样工作：将扩展（`php_mongodb.dll`）放置在 PHP 的扩展目录（例如 `ext`），然后在 `php.ini` 中加载该扩展，可以使用完整文件名或已知的短版本：\n\
  \n```\nextension=php_mongodb.dll\nextension=mongodb\n```\n\n最后，`phpinfo()` 的输出包含一个来自\
  \ `MongoDB` 的项目（请参见 图 24.4）。\n\n#### 注意事项\n\n当新的 PHP 版本发布时，`MongoDB` 扩展有时会滞后，这可以通过控制台中符合以下的错误消息来识别：\n\
  \n```\nWarning: PHP Startup: mongodb: Unable to initialize module \nModule compiled\
  \ with module API=20210902 \nPHP compiled with module API=20230831 \n```\n\n在这种情况下，只有耐心才能解决。\n\
  \n![MongoDB 扩展安装正确](img/img-f24.4.html)\n\n**图 24.4** MongoDB 扩展安装正确\n\n这完成了所有准备工作，我们现在可以从\
  \ PHP 访问数据库了。刚刚安装的扩展只提供基础功能。使用 `MongoDB PHP Library` 会方便得多。\n\n## 24.2 使用 MongoDB\
  \ 访问数据库\n\n作为一种 NoSQL 数据库，`MongoDB` 的工作方式与通常系统系统有不同。特别是术语不同，因为存储的是文档而不是数据记录——更不用说关系。因此，表\
  \ 24.1;\n    $db = $conn->PHP;\n    echo \"数据库已创建。<br />\";\n  } catch (Exception\
  \ $ex) {\n    echo \"错误: \" . $ex->getMessage();\n  }\n?>\n```\n\n**列表 24.1** 建立数据库连接\
  \ (\"mongo-connect.php\")\n\n\n\n\n\n`MongoDB\\Client` 类的初始化建立了与 `localhost` 端口\
  \ `27017` 数据库的连接。访问 `$conn->PHP` 会访问 PHP 数据库。如果该数据库尚不存在，它将立即被创建！因此你在这里就可以看到系统的灵活性了——既有好处也有坏处。\n\
  \n#### 注意事项\n\n构造函数接受三个参数，所有参数都是可选的：\n\n1. 服务器——默认值 `\"mongodb://localhost:27017\"\
  `\n2. 建立连接的选项，例如身份验证信息\n3. 数据库扩展选项；用于 SSL/TLS 的证书信息\n\n要创建一个表（在 MongoDB 术语中称为集合），你可以调用\
  \ `createCollection()` 方法。如果调用成功，你可以直接通过 `$conn->PHP->table` 访问 PHP 数据库中的表集合，例如。\n\
  \n```php\n<?php\n  require_once __DIR__ . \"/vendor/autoload.php\";\n\n  try {\n\
  \    $conn = new MongoDB\\Client();\n    $db = $conn->PHP;\n    $db->createCollection(\"\
  my_table\");\n    echo \"Table created.<br />\";\n    // Access now via $conn->PHP->my_table\n\
  \  } catch (Exception $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?>\
  \  \n```\n\n**列表 24.2** 创建集合 (\"mongo-create.php\")\n\n### 24.2.2 插入\n\n如前解释的那样，MongoDB\
  \ 以“文档”为单位进行思考。此类文档本质上是具有原始属性的对象——例如 JavaScript 环境中的 JSON，或者 PHP 中增强的 `StdClass`（但在后的情况下，请记住从\
  \ PHP 8.2 开始，向 `StdClass` 动态添加类属性已过用）。本质上，你创建一个关联的、可能是嵌套的数组并将其插入。关于模式，因此你并不受限制，也不必须确保数据结构足够一致以便进行搜索。\n\
  \n输入数据非常简单；集合提供了 `insertOne()` 方法为此目的。数据通过引用进行传递。\n\n```php\n<?php\n  require_once\
  \ __DIR__ . \"/vendor/autoload.php\";\n  try {\n    $conn = new MongoDB\\Client();\n\
  \    $db = $conn->PHP->my_table;\n    $data = [\n      \"name1\" => \"value1\",\n\
  \      \"name2\" => \"value2\"\n    ];\n    $result = $db->insertOne($data);\n \
  \   echo \"Data entered.<br />\";\n    echo \"<pre>\" . print_r($result, true).\
  \ \"</pre>\";\n  } catch (Exception $ex) {\n    echo \"Error: \" . $ex->getMessage();\n\
  \  }\n?>  \n```\n\n**列表 24.3** 向数据库写入数据 (\"mongo-insert.php\")\n\n如果你查看 `insertOne()`\
  \ 的返回值，就会变得有趣。正如图 24.6 所示，将收到一个类型为 `MongoDB\\BSON\\ObjectId` 的唯一对象 ID `oid`。\n\n\
  这类似于 MySQL 和其他数据库中的自动增值，但这种情况下是一个较长的 GUID 而不是简单的数字。在章节的后后部分，我们将能够通过此直接访问单独的记录![输入数据的信息——包括生成的\
  \ ID](img/klein24_006.png)](img-f24.6.html)\n\n**图 24.6** 输入数据的信息——包括生成的 ID\n\n\
  #### 注意事项\n\n因此没有像 SQL 那样的查询语言来插入数据。在这方面，你不需要转义任何字符来避免 SQL 注入；这个问题在 MongoDB 中并不存在。特殊字符仅用于选择、更新或删除数据。不存在注入危险命令的风险，如第\
  \ 32 章所示。\n\n### 24.2.3 查询与返回值\n\n对数据库内所有文档（或数据）的查询非常简单：集合的 `find()` 方法首先返回所有文档，然后使用\
  \ `foreach` 对其进行迭代。如果这些文档具有统一的模式，输出也会简化（参见图 24.7）。\n\n```php\n<?php\n  require_once\
  \ __DIR__ . \"/vendor/autoload.php\";\n\n  try {\n    $conn = new MongoDB\\Client();\n\
  \    $db = $conn->PHP->my_table;\n    $result = $db->find();\n    echo \"<table><th>name1</th><th>name2</th></tr>\"\
  ;\n    foreach ($result as $id => $row) {\n      printf(\"<tr><td>%s</td><td>%s</td></tr>\"\
  ,\n        htmlspecialchars($row[\"name1\"]),\n        htmlspecialchars($row[\"\
  name2\"])\n      );\n  } catch (Exception $ex) {\n    echo \"Error: \" . $ex->getMessage();\n\
  \  }\n?>  \n```\n\n**列表 24.4** 输出集合的所有数据 (\"mongo-read-all.php\")![输出](img/klein24_007.png)](img-f24.html)\n\
  \n**图 24.7** 输出\n\n只想访问某些数据，必须向 `find()` 方法传递相应的查询标准。MongoDB 支持非常强大的查询语言。然而，最简单的搜索方法是传递带有属性和值的关联数组。因此，以下查询搜索\
  \ `name1` 属性中包含 `\"Value1\"` 且在 `name2` 中包含 `\"Value2\"` 的数据记录：\n\n```php\n$db =\
  \ $conn->PHP->my_table; \n$result = $db->find(\n   [\"name1\" => \"value1\", \"\
  name2\" => \"value2\"] \n);\n```\n\n考虑以下完整列表。\n\n```php\n<?php\n  require_once __DIR__\
  \ . \"/vendor/autoload.php\";\n\n  try {\n    $conn = new MongoDB\\Client();\n \
  \   $db = $conn->PHP->my_table;\n    $result = $db->find(\n      [\"name1\" => \"\
  value1\", \"name2\" => \"value2\"]\n    );\n    echo \"<table><th>name1</th><th>name2</th></tr>\"\
  ;\n    foreach ($result as $id => $row) {\n      printf(\"<tr><td>%s</td><td>%s</td></tr>\"\
  ,\n        htmlspecialchars($row[\"name1\"]),\n        htmlspecialchars($row[\"\
  name2\"])\n      );\n  } catch (Exception $ex) {\n    echo \"Error: \" . $ex->getMessage();\n\
  \  }\n?>  \n```\n\n**列表 24.5** 查询并输出集合数据 (\"mongo-read.php\")\n\n#### 注意事项\n\n如果查询仅返回一条数据记录（或者只需要所有文档中的第一个），请使用\
  \ `findOne()` 代替 `find()`。语法保持不变。\n\n最后重要的注意事项：如果你想使用文档的 ID 作为查询标准，必须非常小心。正如图 24.6\
  \ 所示，存在 ID——它不是简单的字符串值，而是 `ObjectID` 类型的对象。因此，在比较标准时，你必须指定完整命名空间的 `ObjectID` 实例。关联属性名为\
  \ `_id`：\n\n```php\n$result = $db->find([\"_id\" => new MongoDB\\BSON\\ObjectID(\"\
  abc123\")]);\n```\n\n### 24.2.4 刷新\n\n更新现有记录，MongoDB 使用 `updateOne()` 和 `updateMany()`\
  \ 方法，取决于你想更改一条还是多条数据记录。作为 `updateOne()` 的替代方案，你还可以使用 `replaceOne()`。该方法替换整个数据记录；而\
  \ `updateOne()` 可以在不破坏现有数据的情况下添加额外字段。\n\n函数首先期望如 `find()` 等查询标准，然后是用于替换找到的内容的新文档。语法有些特殊：数组\
  \ `$set` 键用于指定值的写入。MongoDB 在此处提供了许多其他选项，例如用于更新的特殊运算符。在以下列表中，我们仅简单地插入另一条数据记录。\n\n\
  ```php\n<?php\n  require_once __DIR__ . \"/vendor/autoload.php\";\n\n  try {\n \
  \   $conn = new MongoDB\\Client();\n    $db = $conn->PHP->my_table;\n    $db->updateOne(\n\
  \      [\"name1\" => \"value1\"], //查询标准\n      [\"\\$set\" => [\"name1\" => \"\
  value3\", \"name2\" => \"value4\"]] //新文档\n    );\n    $result = $db->find();\n\
  \    echo \"<table><th>name1</th><th>name2</th></tr>\";\n    foreach ($result as\
  \ $id => $row) {\n      printf(\"<tr><td>%s</td><td>%s</td></tr>\",\n        htmlspecialchars($row[\"\
  name1\"]),\n        htmlspecialchars($row[\"name2\"])\n      );\n  } catch (Exception\
  \ $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n\n**列表 24.6**\
  \ 更新集合数据 (\"mongo-update.php\")\n\n图 24.8 显示了结果![数据已更新](img/klein24_008.png)](img-f24.8.html)\n\
  \n\n\n\n\n### 24.2.5 删除\n\n最后但同样重要的是，也可以从 MongoDB 数据库中删除数据。经过之前的解释，这个步骤可能不再令人意外了。`deleteOne()`\
  \ 方法负责删除一条数据记录，而 `deleteMany()` 则一次性删除多条数据记录。同样需要一个搜索准则作为参数。Listing 24.7 包含了完整的代码。\n\
  \n```php\n<?php\n  require_once __DIR__ . \"/vendor/autoload.php\";\n\n  try {\n\
  \    $conn = new MongoDB\\Client();\n    $db = $conn->PHP->my_table;\n    $db->deleteOne(\n\
  \      [\"name1\" => \"value3\"] //search criterion\n    );\n  } catch (Exception\
  \ $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n\n列表 24.7 删除集合数据\
  \ (\"mongo-delete.php\")\n\n这就是 PHP 控制 MongoDB 的第一个见解。[`php.net/mongodb`](http://php.net/mongodb)\
  \ 在线手册包含了完整且详细的 API 说明。\n\n### 24.3 应用示例\n\n为了结束本章——以及整个数据库章节——我们实现了一个基于 MongoDB\
  \ 的著名留言簿示例。应用程序的基本结构保持不变，但数据库的通信根据之前页面的信息进行。仅更改了少数细节。\n\n### 24.3.1 创建数据存储\n\n我们假设应用程序的默认值为：运行的\
  \ MongoDB 实例位于当前服务器上，使用默认端口，不需要额外的身份验证。我们在 PHP 数据库中创建一个新的留言簿集合（该集合可能已由于之前的示例存在）。正如所讨论的，我们不需要数据库模式。\n\
  \n```php\n<?php\n  require_once __DIR__ . \"/vendor/autoload.php\";\n\n  try {\n\
  \    $conn = new MongoDB\\Client();\n    $db = $conn->PHP;\n    $db->createCollection(\"\
  guestbook\");\n    echo \"Database created.<br />\";\n  } catch (Exception $ex)\
  \ {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?>  \n```\n\n列表 24.8 已创建集合\
  \ (\"gb-create.php\")\n\n### 24.3.2 输入数据\n\n一旦数据存储创建完成，我们就使用通常的 HTML 界面进行数据输入。有一个特殊之处：MongoDB\
  \ 基于 UTF-8 运行，因此我们使用 `utf8_encode()` 对输入进行相应的编码。据此我们创建一个简单的关联数组，然后将其发送发送 MongoDB：\n\
  \n```php\n$data = [ \n  \"headline\" => utf8_encode($_POST[\"Heading\"]), \n  \"\
  entry\" => utf8_encode($_POST[\"Comment\"]),\n  \"author\" => utf8_encode($_POST[\"\
  Name\"]), \n  \"email\" => utf8_encode($_POST[\"Email\"]), \n  \"date\" => time()\
  \ \n]; \n$result = $db->insertOne($data);  \n```\n\n插入后，我们可以使用 `getInsertedId()`\
  \ 方法来确定生成的自动值。正如之前解释过的样，它是 `ObjectID` 类型。然而，字符串表示形式就是 ID 值本身，因此我们可以如下所示将其附加到 URL\
  \ 中：\n\n```php\n$id = $result->getInsertedId(); \necho \"Entry added. \n     <a\
  \ href=\\\"gb-edit.php?id=$id\\\">Edit</a>\";  \n```\n\n考虑以下完整的列表。\n\n```html\n\
  <html\n<head>\n  <title>Guestvook</title>\n</head>\n<body>\n<h1>Guestbook</h1> \n\
  ```\n\n```php\n<?php\n  if (isset($_POST[\"Name\"]) &&\n      isset($_POST[\"Email\"\
  ]) &&\n      isset($_POST[\"Heading\"]) &&\n      isset($_POST[\"Comment\"])) {\n\
  \    require_once __DIR__ . \"/vendor/autoload.php\";\n\n    try {\n      $conn\
  \ = new MongoDB\\Client();\n      $db = $conn->PHP->guestbook;\n      $data = [\n\
  \        \"heading\" => utf8_encode($_POST[\"Heading\"]),\n        \"entry\" =>\
  \ utf8_encode($_POST[\"Comment\"]),\n        \"author\" => utf8_encode($_POST[\"\
  Name\"]),\n        \"email\" => utf8_encode($_POST[\"Email\"]),\n        \"date\"\
  \ => time()\n      ];\n      $result = $db->insertOne($data);\n      $id = $result->getInsertedId();\n\
  \      echo \"Entry added. \n           <a href=\\\"gb-edit.php?id=$id\\\">Edit</a>\"\
  ;\n    } catch (Exception $ex) {\n      echo \"Error: \" . $ex->getMessage();\n\
  \    }\n  }\n?> \n```\n\n```html\n<form method=\"post\" action=\"\">\nName <input\
  \ type=\"text\" name=\"Name\" /><br />\nEmail address <input type=\"text\" name=\"\
  Email\" /><br />\nHeading <input type=\"text\" name=\"Heading\" /><br />\nComment\n\
  <textarea cols=\"70\" rows=\"10\" name=\"Comment\"></textarea><br />\n<input type=\"\
  submit\" name=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\n列表 24.9 数据可以输入 (\"\
  gb-enter.php\")\n\n### 24.3.3 输出\n\nMongoDB 的输出返回所有文档，我们通过 `foreach` 对它们进行迭代。\n\n\
  ```html\n<html\n<head>\n  <title>Guestbook</title>\n</head>\n<body>\n<h1>Guestbook</h1>\
  \ \n```\n\n```php\n<?php\n  require_once __DIR__ . \"/vendor/autoload.php\";\n\n\
  \  try {\n    $conn = new MongoDB\\Client();\n    $db = $conn->PHP->guestbook;\n\
  \    $result = $db->find();\n    foreach ($result as $id => $row) {\n      printf(\"\
  <p><a href=\\\"mailto:%s\\\">%s</a> wrote/at %s:</p>\n          <h3>%s</h3><p>%s</p><hr\
  \ />\",\n        utf8_encode($row[\"email\"]),\n        utf8_encode($row[\"author\"\
  ]),\n        date(\"Y-m-d, H:i\", $row[\"date\"]),\n        utf8_encode($row[\"\
  heading\"]),\n        nl2br(utf8_encode($row[\"entry\"])))\n      );\n    }\n  }\
  \ catch (Exception $ex) {\n    echo \"Error: \" . $ex->getMessage();\n  }\n?> \n\
  ```\n\n```html\n</body>\n</html>\n```\n\n列表 24.10 留言簿数据 (\"gb-show.php\")\n\n###\
  \ 24.3.4 删除数据\n\n要删除数据我们需要 `deleteOne()` 方法和相应的查询。然而，此时我们想要显示这个：下面的列表显示了删除的完整代码。\n\
  \n```php\n<?php\n  require_once __DIR__ . \"/vendor/autoload.php\";\n\n  if (isset($_GET[\"\
  id\"]) && ctype_alnum($_GET[\"id\"])) {\n    if (isset($_GET[\"ok\"])) {\n     \
  \ try {\n        $conn = new MongoDB\\Client();\n        $db = $conn->PHP->guestbook;\n\
  \        $db->deleteOne([\"_id\" => new MongoDB\\ObjectID($_GET[\"id\"])]);\n  \
  \      echo \"<p>Entry deleted.</p>\n              <p><a href=\\\"gb-admin.php\\\
  \">Back to overview</a></p>\";\n      } catch (Exception $ex) {\n        echo \"\
  Error: \" . $ex->getMessage();\n      }\n    } else {\n      printf(\"<a href=\\\
  \"gb-admin.php?id=%s&ok=1\\\">Really delete?                </a>\", urlencode($_GET[\"\
  id\"]));\n    }\n  } else {\n    try {\n      $conn = new MongoDB\\Client();\n \
  \     $db = $conn->PHP->guestbook;\n      $result = $db->find();\n      foreach\
  \ ($result as $id => $row) {\n        printf(\"<p><b><a href=\\\"gb-admin.php?id=%s\\\
  \">Delete this entry </a>\n                 - <a href=\\\"gb-edit.php?id=%s\\\"\
  >Edit this entry</a></b></p>\n          <p><a href=\\\"mailto:%s\\\">%s</a> wrote/at\
  \ %s:</p>\n          <h3>%s</h3><p>%s</p><hr />\", \n          urlencode($row[\"\
  _id\"]),\n          urlencode($row[\"_id\"]),\n          utf8_encode($row[\"email\"\
  ]),\n          utf8_encode($row[\"author\"]),\n          date(\"Y-m-d, H:i\", $row[\"\
  date\"]),\n          utf8_encode($row[\"heading\"]),\n          nl2br(utf8_encode($row[\"\
  entry\"])))\n      );\n    } catch (Exception $ex) {\n       echo \"Error: \" .\
  \ $ex->getMessage();\n    }\n  }\n?> \n```\n\n\n\n\n\n# 列表 24.11 显示所有数据的删除选项 (\"\
  gb-admin.php\")\n\n### 24.3.5 编辑数据\n\n最后，需要创建留言板的管理界面。特别是，在那里可以编辑现有的条目。为了首次显示它，必须先将其读取。为了实现这一点，我们使用上一个例子创建一个相应的查询。这次使用的方法是\
  \ `findOne()`，因为 `ID` 应该是唯一的：\n\n```php\n$row = $db->findOne(\n   [\"_id\" => new\
  \ MongoDB\\BSON\\ObjectID($_GET[\"id\"])])  \n```\n\n我们还扩展了输入表单，使得创建时间也作为表单的一部分提供。这简化了后续更新，因为我们可以从表单数据中组合完整的新数据记录：\n\
  \n```php\n// PHP \n$Date = $row[\"date\"]; \n```\n\n```html\n<!-- HTML --> \n<input\
  \ type=\"hidden\" name=\"Date\" value=\"<?php\n  echo htmlspecialchars($Date); \n\
  ?> />  \n```\n\n提交表单后，我们创建一个新数组，然后使用 `replaceOne()` 替换旧的数据记录：\n\n```php\n$data =\
  \ [ \n  \"heading\" => utf8_encode($_POST[\"Heading\"]), \n  \"entry\" => utf8_encode($_POST[\"\
  Comment\"]), \n  \"author\" => utf8_encode($_POST[\"Name\"]), \n  \"email\" => utf8_encode($_POST[\"\
  Email\"]), \n  \"date\" => $_POST[\"Date\"] \n]; \n$db->replaceOne([\"_id\" => new\
  \ MongoDB\\BSON\\ObjectID($_GET[\"id\"])], $data);  \n```\n\n就是这样了！列表 24.12 包含了完整的连续代码。\n\
  \n```html\n<html>\n<head>\n  <title>Guestbook</title>\n</head>\n<body>\n<h1>Guestbook</h1>\
  \ \n```\n\n```php\n<?php\n  $Name = \"\";\n  $Email = \"\";\n  $Heading = \"\";\n\
  \  $Comment = \"\";\n  $Date = \"\";\n\n  if (isset($_GET[\"id\"]) &&\n       ctype_alnum($_GET[\"\
  id\"])) {\n    require_once __DIR__ . \"/vendor/autoload.php\";\n\n    try {\n \
  \       $conn = new MongoDB\\Client();\n        $db = $conn->PHP->guestbook;\n \
  \     if (isset($_POST[\"Name\"]) &&\n          isset($_POST[\"Email\"]) &&\n  \
  \        isset($_POST[\"Heading\"]) &&\n          isset($_POST[\"Comment\"])) {\n\
  \        $date = [\n          \"heading\" => utf8_encode($_POST[\"Heading\"]),\n\
  \          \"entry\" => utf8_encode($_POST[\"Comment\"]),\n          \"author\"\
  \ => utf8_encode($_POST[\"Name\"]),\n          \"email\" => utf8_encode($_POST[\"\
  Email\"]),\n          \"date\" => $_POST[\"Date\"]\n          ];\n        $db->replaceOne([\"\
  _id\" => \n          [new MongoDB\\ObjectID($_GET[\"id\"])], $data);\n        echo\
  \ \"<p>Entry updated.</p>\n              <p><a href\\\"gb-admin.php\\\">Back to\
  \ overview</a>\n              </p>\";\n      }\n\n      if ($row = $db->findOne[\"\
  _id\" => \n          new MongoDBObjectID($_GET[\"id\"])])) {\n        $Name = utf8_decode($row[\"\
  author\"]);\n        $Email = utf8_decode($row[\"email\"]);\n        $Heading =\
  \ utf8_decode($row[\"heading\"]);\n        $Comment = utf8_decode($row[\"entry\"\
  ]);\n        $Date = $row[\"date\"];\n      }\n    } catch (Exception $ex) {\n \
  \      echo \"Error: \" . $ex->getMessage();\n    }\n  }\n?> \n```\n\n```html\n\
  <form method=\"post\" action=\"\">\nName <input type=\"text\" name=\"Name\" value=\"\
  <?php\n  echo htmlspecialchars($Name);\n?> /><br />\nEmail Address <input type=\"\
  text\" name=\"Email\" value=\"<?php\n  echo htmlspecialchars($Email);\n?> /><br\
  \ />\nHeading <input type=\"text\" name=\"Heading\" value=\"<?php\n  echo htmlspecialchars($Heading);\n\
  ?> /><br />\nComment\n<textarea cols=\"70\" rows=\"10\" name=\"Comment\"><?php\n\
  \  echo htmlspecialchars($Comment);\n?></textarea><br />\n<input type=\"hidden\"\
  \ name=\"Date\" value=\"<?php\n  echo htmlspecialchars($Date);\n?> />\n<input type=\"\
  submit\" name=\"Submit\" value=\"Update\" />\n</form>\n</body>\n</html>  \n```\n\
  \n# 列表 24.12 编辑留言板条目 (\"gb-edit.php\")\n\n与上文所介绍的其他系统相比，控制数据库甚至稍微简单一点，因为我们不需要担心数据类型和表结构。当然，这种灵活性也可能导致问题：例如，如果你拼写错了数据库名称，MongoDB\
  \ 不会报错，而是直接创建一个新的。这类错误在关系型系统中会更难检测一些。然而，MongoDB 无疑是我们数据库工具箱中一个令人兴奋的补充——即使在“真实”项目中也是如此。\n\
  \n## 24.4 设置\n\n表格 24.2 显示了 `php.ini` 配置文件中可用的 MongoDB 设置选项。\n\n| 参数 | 说明 | 默认值\
  \ |\n| --- | --- | --- |\n| mongodb.debug | 调试信息的写入路径 | |\n\n**表格 24.2** \"php.ini\"\
  \ 中的配置\n\n# 第五部分\n\n# 通信\n\n## 25.1 文件\n\n访问文件有很多方法，很难追踪。有两种不同的文件处理方法。你可以针对内容操作，即可以打开并关闭文件，读取数据并写入数据。或者，你可以关注文件系统本身，将文件复制到特定位置。我们将在后续章节中介绍这两种方法。\n\
  \n数据库操作也访问本地系统，因此不应低估文件的功能。\n\n### 准备工作\n\n在 Windows 中，访问文件经常会出现莫名的错误。免费工具 Filemon\
  \ 通常很有帮助，可以在 [www.sysinternals.com](http://www.sysinternals.com) 获取（该网站现已被微软收购）。它的继承者\
  \ Process Monitor 提供了更多功能。你可以查看 PHP 尝试访问哪些文件以及是否成功（参见图 25.1）。\n\n**图 25.1** 文件监控有助于访问文件\n\
  \n## 25.2 使用 PHP 处理文件\n\n正如你在数据库章节中所看到的，我们总是遵循相同的结构：首先描述如何创建数据库连接，然后如何发送查询并读取返回值。我们以此的方式处理文件。\n\
  \n#### 文件模式\n\n第一步是打开文件。为了实现这一点，使用 `fopen()`，其中 `f` 代表 file。当然，`fopen()` 期望将文件名作为绝对路径或相对路径作为参数。你必须指定文件模式；即打开文件的方式。\n\
  \n*   读取或写入权限或两者兼有？\n\n\n\n\n\n-   如果文件不存在，是否应该创建它？\n-   是否应该将新数据添加到文件末尾，还是覆盖现有数据？\n\
  \n共有五种文件模式：\n\n1. `a` 用于写入访问，并将新数据追加到文件末尾\n2. `r` 用于读取访问\n3. `w` 用于写入访问并覆盖现有数据\n\
  4. `c` 用于写入访问并覆盖现有数据，但在打开现有文件时不会立即删除内容（与 `w` 相比）\n5. `x` 用于创建并向新文件写入内容\n\n对于这五种模式，你都可以在模式标识符后添加一个加号\
  \ `+`，以便同时拥有读取和写入权限。表 25.1 显示了所有 10 种可能模式的概述。\n\n| 模式 | 读取权限 | 写入权限 | 附加 | 覆盖 |\
  \ 现有文件的警告 |\n| --- | --- | --- | --- | --- | --- |\n| `a` | - | + | + | - | - |\n\
  | `a+` | + | + | + | - | - |\n| `r` | + | - | - | - | - |\n| `r+` | + | + | - |\
  \ + | - |\n| `w` | - | + | - | + | - |\n| `w+` | + | + | - | + | - |\n| `c` | -\
  \ | + | - | + | - |\n| `c+` | + | + | - | + | - |\n| `x` | - | + | - | + | + |\n\
  | `x+` | + | + | - | + | + |\n\n**表 25.1** `fopen()` 的文件模式\n\n“现有文件的警告”列意味着如果文件已经存在，`fopen()`\
  \ 将返回一个警告。这是 `w` 和 `x` 文件模式之间的主要区别：在后一种模式下，如果文件已存在，PHP 会报错。\n\n但并非于此。你还可以为这 10 种模式添加另外两个选项之一：\n\
  \n-   `b` 以二进制模式打开文件，这样数据就不会转换为本地字符集。这对于二进制文件被特别推荐。\n-   相反，`t` 会转换文件：Unix/Linux\
  \ 行结束（`\\n`）会被转换为 Windows 行结束（`\\r\\n`）。\n\n`fopen()` 的返回值是一个所谓的文件句柄（file handle），这是一个指示刚刚打开的文件的数值。然后你可以使用此值进行所有其他文件操作，这些操作现在（多亏于句柄）知道指的是哪一个文件。\n\
  \n下面的第一个脚本创建一个文件然后再次将其关闭（使用 `fclose()`）。\n\n```php\n<?php\n  if ($file = fopen(\"\
  test.txt\", \"wb\")) {\n    echo \"File was created!\";\n    fclose($file);\n }\
  \ else {\n    echo \"File could not be created!\";\n  }\n?>  \n```\n\n**列表 25.1**\
  \ 创建文件 (\"file-create.php\")\n\n这种努力的报是是当前目录下生成了一个 `test.txt` 文件。它的大小仍为 0 字节，但这将发生变化。在任何情况下，请确保使用\
  \ `fclose()` 关闭文件。PHP 尝试在脚本结束时自动执行此，但你永远无法确定！\n\n### 路径中的文件\n\n如果 `fopen()` 的第三参数设置为\
  \ `true`，`fopen()` 将在 PHP 的 `include_path` 中也搜索要打开的文件。这是一个 PHP 配置变量，指定了通过 `include`、`include_once`、`require`\
  \ 和 `require_once` 加载的文件可以所在的目录（除非指定了绝对路径）。下面的调用打开了一个 PHP 文件并搜索了 `include_path`：\n\
  \n```php\n$file = fopen(\"file.php\", \"r\", true);\n```\n\n`include_path` 的使用仅对于读取访问有效。相对于当前路径，除非你使用绝对路径。\n\
  \n#### 写入数据\n\n向文件写入数据，使用 `fwrite()` 函数。第一个参数是文件句柄；第二个参数是文本。作为第三个参数，你可以指定要写入的数据长度。这对于你想从外部源或用户处接受数据有用。在任何情况下，请确保你之前以写入模式打开了文件（即不是\
  \ `r` 模式）。\n\n```php\n<?php\n  if ($file = fopen(\"test.txt\", \"wb\")) {\n    if\
  \ (fwrite($file, \"All of life is a test\\r\\n\") &&\n        fwrite($file, \"and\
  \ we are only the candidates.\")) {\n      echo \"File has been filled!\";\n   \
  \ } else {\n      echo \"Error while writing!\";\n    }\n    fclose($file);\n }\
  \ else {\n    echo \"File could not be opened!\";\n  }\n?>  \n```\n\n**列表 25.2**\
  \ 填充文件 (\"file-write.php\")\n\n`fwrite()` 的返回值是写入的字节数——如果写入失败则返回 `false`。\n\n####\
  \ 读取数据\n\n`passthru()` 将指定文件的所有数据发送到客户端。这样你甚至省去了 `echo` 语句，但（与示例不同）无法使用 `htmlspecialchars()`\
  \ 进行编码。\n\n按行访问的方法仍然有效。这在评估日志文件时非常有用：你读取每一行（对应一个日志目）并对其处理。相应的函数是 `fgets()`。然而，这里有一个特殊之处：你必须指定想要读取的最大字符数。如果行中的数据多于你指定的，你将无法获得完整的行。因此，你需要确切知道要读取的文件是什么样的。长度的良好值为\
  \ 4096 字节——即 4 KB。通过句柄访问的文件指针在读取操作后移动到下一个未读取的字符。然而，读取在行结束或文件结束处停止，因此你永远不会获得超过一行的数据。\n\
  \n你仍然需要的信息是如何判断文件结束。这可以通过 `feof()` 完成，其中 `eof` 代表文件结束。\n\n```html\n<pre> \n```\n\
  \n```php\n<?php\n  $file = fopen(\"test.txt\", \"rb\");\n  while (!feof($file))\
  \ {\n    $line = fgets($file, 4096);\n    echo htmlspecialchars($line);\n  }\n \
  \ fclose($file);\n?> \n```\n\n```html\n</pre>  \n```\n\n**列表 25.4** 按行读取文件 (\"file-read-lines.php\"\
  )\n\n\n\n\n\n请注意，由 `fgets()` 读取的字符串包含行尾结束符（如果存在）。如果你只对实际的行内容感兴趣，而不关心 `\\r\\n`，你可能需要删除最后一个字符（如果需要；最后一行并不一定以换行符结束）。\n\
  \n## 更多可能性\n\n当然，还有许多其他访问文件信息的方法，但在实践中这些方法并不常见。通过 `fgetc()`，你可以获取指定文件的下一个字符。这意味着你可以字面量地逐个输出它的内容。\n\
  \n在打开的文件中进行导航也是可能的。通过 `fseek()`，你可以将文件指针移动到指定的位置（从文件开始计算字节数）。使用 `fseek($file, 0)`，你可以跳转回文件开头，也可以使用\
  \ `rewind($file)` 别名。你可以通过 `ftell($file)` 获取文件指针的当前位置。最后一个警告是：如果你以 `a` 或 `a+` 模式打开文件，数据始终会被追加到文件末尾，即使你之前调用了\
  \ `rewind()` 或 `fseek()`。\n\n一如既往，PHP 在线手册提供了有关所有介绍函数的更多信息以及更多。\n\n## 25.2.2 操作文件系统\n\
  \n如果你不仅对文件的实际数据感兴趣，还对其在文件系统中的作用感兴趣，那么本节中的函数将对你有帮助。\n\n### 文件信息\n\n首先，有各种显示文件信息的帮助函数。在处理文件（示例中的\
  \ `test.txt`）之前，你可能对以下几点感兴趣：\n\n*   文件是否存在？\n*   如果，我可以向文件中写入吗？\n*   谁拥有该文件？它是否是一个文件（还是一个目录）？\n\
  \nPHP 为所有这些问题提供了答案，如 表 25.2 所示。\n\n| 函数 | 描述 |\n| --- | --- |\n| `file_exists()`\
  \ | 文件是否存在？ |\n| `is_dir()` | 是目录吗？ |\n| `is_executable()` | 是可执行文件吗？ |\n| `is_file()`\
  \ | 是文件吗？ |\n| `is_link()` | 是链接吗？ |\n| `is_readable()` | 文件可读吗？ |\n| `is_uploaded_file()`\
  \ | 是通过 HTTP 上传传输的文件吗？ |\n| `is_writable()` | 可以向文件写入吗？ |\n| * 关于这些信息可以在第 13 章 中找到。\
  \ |\n\n**表 25.2** 关于文件的信息\n\n下面的列表确定了之前创建的文件 `test.txt` 的这些信息；图 25.4 显示了它的输出。\n\n\
  ```php\n<?php\n  vprintf(\"<table><tr><th>Function</th><th>Value</th></tr>\n   \
  \ <tr><td><code>file_exists()</code></td><td>%s</td></tr>\n    <tr><td><code>is_dir()</code></td><td>%s</td></tr>\n\
  \    <tr><td><code>is_executable()</code></td><td>%s</td></tr>\n    <tr><td><code>is_file()</code></td><td>%s</td></tr>\n\
  \    <tr><td><code>is_link()</code></td><td>%s</td></tr>\n    <tr><td><code>is_readable()</code></td><td>%s</td></tr>\n\
  \    <tr><td><code>is_uploaded_file()</code></td><td>%s</td></tr>\n    <tr><td><code>is_writable()</code></td><td>%s</td></tr></table>\"\
  ,\n    [\n      var_export(file_exists(\"test.txt\"), true),\n      var_export(is_dir(\"\
  test.txt\"), true),\n      var_export(is_executable(\"test.txt\"), true),\n    \
  \  var_export(is_file(\"test.txt\"), true),\n      var_export(is_link(\"test.txt\"\
  ), true),\n      var_export(is_readable(\"test.txt\"), true),\n      var_export(is_uploaded_file(\"\
  test.txt\"), true),\n      var_export(is_writable(\"test.txt\"), true)\n    ]\n\
  \  ?>\n```\n\n**列表 25.5** 关于文件的大量信息 (\"file-infos.php\")\n\n关于 \"test.txt\" 文件的信息\n\
  **图 25.4** 关于 \"test.txt\" 的文件\n\n### 提示\n\n在 列表 25.5 中使用了 `var_export()`。它的行为类似于\
  \ `var_dump()`，但第二个参数可以指定信息应该是输出（false）还是返回（true）。在任何情况下，都需要调用 `var_dump()` 或 `var_export()`。\n\
  \n### 文件操作\n\n这些行的作者曾为 PHP 杂志写过文章。主编辑发送了关于相关主题的文章以避免重复。以下是节选（稍作修改）：\n\n```\nsystem(\"\
  cp file.xyz /path/to/target-directory/file\");\n```\n\n这样做很笨拙。`system()` 函数在操作系统级别执行命令，这在性能上成本高昂，而且隐藏着安全风险。在这种情况下，仅仅复制文件是不恰当的，因为它依赖于系统——PHP\
  \ 的平台无关性被破坏了。此外：PHP 提供了处理文件所需的一切。你从命令行熟悉的命令——`mkdir`、`cp` 或 `COPY`、`rm` 或 `DEL`——在\
  \ PHP 中都是可能的。表 25.3 显示了概述。\n\n| PHP | Unix/Linux/macOS | Windows (命令行) | 函数 |\n\
  | --- | --- | --- | --- |\n| `copy(\"Source\", \"Destination\")` | `cp Source Destination`\
  \ | `COPY Source Destination` | 复制文件 |\n| `mkdir(\"Directory\")` | `mkdir directory`\
  \ | `MKDIR directory` | 创建目录 |\n| `rename(\"Source\", \"Destination\")` | `mv Source\
  \ Destination` | `RENAME Source Destination` / `MOVE Source Destination` | 重命名文件或目录\
  \ |\n| `rmdir(\"Directory\")` | `rmdir directory` | `RMDIR directory` | 删除空目录 |\n\
  | `unlink(\"File\")` | `rm file` | `DEL file` | 删除文件 |\n\n**表 25.3** 用于文件操作的一些 PHP\
  \ 函数\n\n#### 系统操作\n\n除了 `system()`，你也可以使用 `exec()`；该函数不输出任何内容，但像往一样在操作系统级别执行命令。查询此类操作返回值有两种等效选项：\n\
  \n1. 使用反引号指定命令：\n   ```\n   $directory = `pwd`;\n   ```\n2. 使用 `shell_exec()`：\n\
  \   ```\n   $directory = shell_exec(\"pwd\");\n   ```\n\n再次，确保执行的命令是与操作系统无关（在示例中，并不是！）。\n\
  \n### \"dir\" 类\n\n为了操作文件系统，PHP 有一个名为 `dir` 的内置类。这允许对目录中的所有数据进行方便的面对象访问。使用目录名实例化，然后可以使用\
  \ `read()` 来确定下一个目录项并输出它，如下一个列表以及 图 25.5 所示。\n\n```php\n<?php\n  $d = dir(\".\"\
  );\n  while (($entry = $d->read()) !== false) {\n    echo htmlspecialchars($entry)\
  \ . \"<br />\";\n  }\n  $d->close();\n?>\n```\n\n**列表 25.6** 当前目录下的所有文件 (\"dir.php\"\
  )\n\n输出当前目录下的文件\n**图 25.5** 输出当前目录下的文件\n\n或者，你可以按照以下步骤进行：`opendir()` 创建目录的句柄，而 `readdir()`\
  \ 确定目录中的当前文件并将指针向前移动一个项。下面的列表中的代码产生与 `dir.php` 相同的结果。\n\n```php\n<?php\n  $d = opendir(\"\
  .\");\n  while (($entry = readdir($d)) !== false) {\n    echo htmlspecialchars($entry)\
  \ . \"<br />\";\n  }\n  closedir($d);\n?>\n```\n\n**列表 25.7** 以另一种方式确定当前目录下的所有文件\
  \ (\"dir-alternative.php\")\n\n### 实际路径与虚拟路径\n\n要确定当前脚本的实际路径有一个非常简单的技巧：使用 `__FILE__`\
  \ 常量（FILE 前后各下划线）。你可以在 图 25.6 中看到以下代码的输出。\n\n\n\n\n\n```php\n<?php \n  echo \"The\
  \ current script is called \" . __FILE__; \n?> \n```\n\n![通过 \"\\__FILE\\_\\_ \"\
  \ 获取完整的文件名](img/img-f25.6.html) \n\n**图 25.6**   通过 \"\\_\\__FILE\\_\\_\" 获取的文件名\n\
  \n使用 PHP 函数 `dirname()`，你将获得目录路径。与其使用 `$d = dir(\".\")`，你也可以使用以下代码从当前目录开始：\n\n```php\n\
  $d = dir(dirname(__FILE__)); \n```\n\n你也可以使用 `__DIR__` 常量更简洁地获取当前目录的名称。PHP 还提供了一个函数，可以将虚拟路径（例如\
  \ Web 服务器路径如 `/php/dir.php`）转换为绝对路径（例如 `/usr/httpd/htdocs/php/dir.php`）：即 `realpath()`。需要注意的是，该路径或文件必须存在；否则无法进行转换，且\
  \ `realpath()` 将返回 `false`。\n\n## 25.3 应用程序示例\n\n以上就是关于 PHP 处理文件最重要技巧的初步介绍。现在是时候付诸实践了。\n\
  \n### 25.3.1 留言板\n\n留言板是主要私有网站上一个广受欢迎的机会，供用户向网站管理员留言并相互交换信息。使用数据库实现这一点非常容易——事实上，非常简单，以至于本书的整个数据库章节（见第四部分）就包含了一个完整的留言板示例。不过也可以通过文件来实现，虽然没有那么方便。\n\
  \n其目标很明确：用户应该能够在留言板中输入消息。留言板数据存储在文本文件中。为了以后方便读取，我们使用了序列化技术，它可以将对象转换为字符串（并反向转换回来）。我们首先将每个条目的所有数据存储在一个关联数组中：\n\
  \n```php\n$data = [\"headline\" => $_POST[\"Heading\"], \n          \"entry\" =>\
  \ $_POST[\"Comment\"], \n          \"author\" => $_POST[\"Name\"], \n          \"\
  email\" => $_POST[\"Email\"], \n          \"date\" => date(\"Y-m-d, H:i\")];  \n\
  ```\n\n亮点在于：这些数据通过 `serialize()` 转换为字符串。但其中仍可能包含换行符，这使得以后读取变得困难。问题在于：一个条目从哪里开始，在哪里结束？但也有解决方案：`base64_encode()`\
  \ 对数据进行 Base64 编码，就像电子邮件程序执行的那样。这消除了所有的换行符，但数据对（人类）是不可读的：\n\n```php\n$data = base64_encode(serialize($data));\
  \  \n```\n\n基本上就是这样。代码列表仍然包含一些安全查询，例如留言板文件是否已存在（如果不存在则将创建）。然后读取留言板之前的内容：\n\n```php\n\
  $olddata = file_get_contents(\"uestbook.txt\");  \n```\n\n在写入文件时，先写入新条目，然后写入所有旧条目：\n\
  \n```php\nfile_put_contents(\"gaestuch.txt\", \"$data\\n$olddata\");  \n```\n\n\
  原因在于：在留言板中，先显示最新的条目是有意义的。如果你用 `\"from\"` 模式打开留言板文件，你只能在末尾追加数据，因此最近的条目将位于输出的最末尾（除非你花一点点功夫）。下面的列表显示了完整的脚本。\n\
  \n```html\n<head>\n  <title>Guestbook</title>\n</head>\n<body>\n<h1>Guestbook</h1>\n\
  ```\n\n```php\n<?php\n  if (isset($_POST[\"Name\"]) &&\n      isset($_POST[\"Email\"\
  ]) &&\n      isset($_POST[\"Heading\"]) &&\n      isset($_POST[\"Comment\"])) {\n\
  \    $data = [\"heading\" => $_POST[\"Heading\"], \"entry\" => $_POST[\"Comment\"\
  ], \n              \"author\" => $_POST[\"Name\"], \n              \"email\" =>\
  \ $_POST[\"Email\"], \n              \"date\" => date(\"Y-m-d, H:i\")];\n    $data\
  \ = base64_encode(serialize($data));\n    if (!file_exists(\"guestbook.txt\")) {\n\
  \      $file = fopen(\"guestbook.txt\", \"x\");\n      fclose($file);\n    }\n \
  \   $olddata = file_get_contents(\"guestbook.txt\");\n    if (file_put_contents(\"\
  guestbook.txt\", \"$data\\n$olddata\")) {\n      echo \"Entry added.\";\n    } else\
  \ {\n      echo \"Error!\";\n    }\n  }\n?> \n```\n\n```html\n<form method=\"post\"\
  \ action=\"\">\nName <input type=\"text\" name=\"Name\" />\nEmail address <input\
  \ type=\"text\" name=\"Email\" />\nHeading <input type=\"text\" name=\"Heading\"\
  \ />\nComment<textarea cols=\"70\" rows=\"10\" name=\"Comment\"></textarea>\n<input\
  \ type=\"submit\" name=\"Submit\" value=\"Submit\" />\n</form>\n</body>\n</html>\
  \  \n```\n\n**列表 25.8**   插入留言板 (\"gb-enter.php\")\n\n`图 25.7` 显示了用户可以在其中留下评论的表单。[用于留言的表单](img-f25.7.html)\
  \ \n\n**图 25.7**   用于留言的表单\n\n[通过表单] 留言板的界面](bilderklein/klein25_008.png)](img-f25.8.html)\
  \ \n\n**图 25.8**   用于留言板的界面\n\n留言板数据](img-f25.9.html) \n\n**图 25.9**   留言板数据\n\n\
  \n\n\n得亏了 `dir` 类，查看服务器端目录中的内容变得非常简单。因此，编写一个可以通过服务器硬盘提供基于浏览导航的文件浏览器，这种想法是显而易见的。这在\
  \ PHP 中不是什么问题：目录中的所有条目都会被读取并输出。使用哪个目录通过 URL 参数 `d` 来指定：\n\n```php\n$directory =\
  \ $_GET[\"d\"] ?? \".\";  \n```\n\n对于所有文件夹条目（你通过 `is_dir()` 来判断这一点），你创建一个指向当前脚本的链接，并将文件夹名称作为参数传递：\n\
  \n```php\n<?php\n  $script = htmlspecialchars($_SERVER[\"PHP_SELF\"]);\n  $directory\
  \ = $_GET[\"d\"] ?? \".\";\n  echo \"<h1>\" . htmlspecialchars(realpath($directory))\
  \ . \"</h1>\";\n  $d = opendir($directory);\n  while (($entry = readdir($d)) !==\
  \ false) {\n    if (is_dir(\"$directory/$entry\")) {\n      echo \"<a href=\\\"\
  $script?d=\" .\n           urlencode(\"$directory/$entry\") . \n           \"\\\"\
  >\" . htmlspecialchars(\"$entry/\") . \"</a><br />\";\n    } else {\n      echo\
  \ htmlspecialchars($entry) . \"<br />\";\n    }\n  }\n  closedir($d);\n?>  \n```\n\
  \n你可以在标题中看到一个特殊之处。如果你在文件浏览器中稍微导航一下，URL 中指定的路径会变得越来越长，因为文件名在路径中没有被正确解析（这种解析也被称为规范化）。在某个时刻，`$directory`\
  \ 将拥有一个像 `./folder1/../folder2/..` 这样的值，这本可以通过 `..` 写得短得多。PHP 没有提供执行此操作的函数，但它至少能够将相对路径转换为绝对路径，正如你之前看到的那样：使用\
  \ `realpath()`。这也会执行规范化：\n\n```php\necho \"<h1>\" . htmlspecialchars(realpath($directory))\
  \ . \"</h1>\";  \n```\n\n请查看下面的完整列表；其输出结果见图 25.10。\n\n```php\n<?php \n  $script\
  \ = htmlspecialchars($_SERVER[\"PHP_SELF\"]); \n  $directory = $_GET[\"d\"] ?? \"\
  .\"; \n  echo \"<h1>\" . htmlspecialchars(realpath($directory)) . \"</h1>\"; \n\
  \  $d = opendir($directory); \n  while (($entry = readdir($d)) !== false) { \n \
  \   if (is_dir(\"$directory/$entry\")) \n    { \n      echo \"<a href=\\\"$script?d=\"\
  \ . \n      urlencode(\"$directory/$entry\") . \n        \"\\\">\" . htmlspecialchars(\"\
  $entry/\") . \"</a><br />\"; \n    } else { \n      echo htmlspecialchars($entry)\
  \ . \"<br />\"; \n    }  \n  } \n  closedir($d); \n?>  \n```\n\n**列表 25.10** 代码简短的文件浏览器（\"\
  filebrowser.php”）\n\n该文件浏览器不包含任何错误检查，因此你可能会收到消息，提示没有足够的权限查看目录内容。这是一个测试你的提供商对 Web\
  \ 服务器安全防护良好方法。你还应该考虑对路径本身使用 `realpath()`，因为已知 URL 长度有限限制。\n\n一个显而易见的扩展（尚未实现）是显示文件。然而，这相对简单：首先使用\
  \ `is_file()` 检查条目是否为文件，然后使用 `is_readable()` 检查是否可以读取。如果两个函数都返回 `true`，那么你就可以文件名链接到第二个脚本，在那个脚本中，通过\
  \ `file_get_contents()` 只输出通过 URL 传递的文件名。\n\n![运行中的文件浏览器](img/img-f25.10.html)\n\
  \n**图 25.10** 运行中的文件浏览器\n\n### 注意\n\n此脚本仅适用于内部使用；在任何情况下都不应让外部人员访问该脚本，否则你 Web 服务器上的所有数据都可能暴露。因此，你应该确保脚本足够安全——例如，使用第\
  \ 33 章所示的技术。\n\n## 25.4 设置\n\n`php.ini` 配置文件包含了表 25.4 中列的文件操作选项。\n\n| 参数 | 说明 |\
  \ 默认值 |\n| --- | --- | --- |\n| `allow_url_fopen` | 指定是否允许通过 `fopen()` 打开 URL |\
  \ \"1\" |\n| `auto_detect_line_endings` | 指定是否自动确定文件的行结束（`\\r`、`\\n` 或 `\\r\\n`）\
  \ | \"Off\" |\n| `realpath_cache_size` | `realpath()` 缓存的大小 | \"16K\" |\n| `realpath_cache_ttl`\
  \ | `realpath()` 缓存条目的生存时间 | \"120\" |\n| *更多信息请参见第 26 章.* | |\n\n**表 25.4** \"\
  php.ini\" 中的参数\n\n# 26 HTTP 以及与外部世界的连接\n\n在面向服务的架构的时代，与其他计算机的通信至关重要。使用 PHP 建立连接有两种方式：使用内置的流机制。本章专门介绍流（streams），因为它们强大得多。\n\
  \n## 26.1 准备工作\n\n本章中的大多数示例无需预安装即可工作。然而，还有许多协议列在下方。\n\n如果你想使用 SSL 或 SFTP，需要在编译 PHP\
  \ 时包含它们。Windows 用户可以跳过这一步；它们已经包含了。在 `php.ini` 中指定指令。\n\n## 26.2 使用 PHP 进行外部连接\n\n\
  通过服务。\n\n### 注意\n\n第 27 章 显示了与其他计算机交换信息的进一步标准化的选项。\n\n### 26.2.1 流\n\n流是处理文件（无论是本地还是远程）的核心概念。流是一种数据流——即可以使用\
  \ PHP 处理的数据流。这里的特殊之处在于它通过标准接口支持不同的变体。这与数据库领域的 DSN 类似（参见第 18 章）：你有访问数据源的函数，并使用 DSN\
  \ 语法指定你使用的数据源类型。\n\n流也是如此：使用特定语法指定流，然后以类似于处理文件的方式进行操作。这可以通过 `fopen()` 作为一个很好的说明：到目前，你一直将文件名作为参数，例如\
  \ \"test.txt\"。在流表示中，你必须在前面写入要使用的协议——就像 URL 一样。对于文件，它是 `file://`。\n\n```php\n$file\
  \ = fopen(\"file://test.txt\", \"rb\");\n```\n\n在之前的章节中，这是必要的，因为 `file://` 是 PHP\
  \ 流函数的标准协议。因此，你可以省略它。然而，还有许多协议列在表 26.1 中。\n\n| 流 |  |\n| --- | --- |\n| `file://path/to/target-file`\
  \ | 本地或网络共享上的文件（然后 `\\\\\\\\sharename\\\\\\\\filename`） |\n| `tcp://domain.xy` |\
  \ TCP 连接 |\n\n\n\n\n| `ssl://domain.xy` | SSL/TLS 连接 |\n| `udp://domain.xy` | UDP\
  \ 连接 |\n| `http://www.domain.xy` | 通过 HTTP 获取文件 |\n| `https://www.domain.xy` | 通过\
  \ HTTPS 获取文件 |\n| `ftp://user:password@ ftp.domain.xy/file` | 通过 FTP 获取文件 |\n| `ftps://ftp.domain.xy/file`\
  \ | 通过 SFTP 获取文件 |\n| `php://stdin` | 输入 PHP 脚本 |\n| `php://stdout` | PHP 脚本输出 |\n\
  | `php://input` | 通过 POST 的输入数据 |\n| `php://output` | PHP 输出缓冲区 |\n| `php://stderr`\
  \ | PHP 错误 |\n| `php://filter` | 使用预定义过滤器 |\n| `compress.zlib://file` | 由 gzip 压缩的数据\
  \ |\n| `compress.bzip2://file` | 通过 bzip2 压缩的数据 |\n\n**表 26.1** PHP 可能的流\n\n####\
  \ 注意事项\n\n尽管在流类型方面该表已非常完整（如 `tls://`、`unix://` 和 `udp://` 等特殊类型未专门列出），但并不是所有的变体都已指定。例如，也可以为\
  \ HTTP 和 HTTPS 请求指定用户名和密码；可以在流中直接完成。\n\n文件流在上一节中已经过详尽的处理，尽管那里没有出现“流”一词。因此，本节其余部分处理其他可能的流，这些流始终会带有简要示例给出。\n\
  \n### 26.2.2 HTTP 流\n\n使用 `fopen()` 打开 HTTP 地址有意义吗？如果是为了读取网站上的数据，那非常有意义。由此也可以推断出\
  \ `fopen()` 必须指定哪种文件模式：当然是 \"r\"，因为你只能读取数据而不能写入。以下脚本读取 PHP 主页并将其输出（请参见 图 26.1）；记得按照早前的描述激活\
  \ OpenSSL。\n\n```html\n<h1>PHP 主页</h1> \n```\n\n```php\n<?php\n  $file = fopen(\"\
  https://www.php.net/\", \"r\");\n  while (!feof($file)) {\n    $line = fread($file,\
  \ 4096);\n    echo $line;\n  }\n  fclose($file);\n?>  \n```\n\n**列表 26.1** 读取 PHP\
  \ 主页 (\"http-1.php\")\n\n![PHP 主页，由 \"fopen()\" 决定——但遗憾的是，由于链接的原因，它并不特别好看](img/26.1)\n\
  \n**图 26.1** 由 \"fopen()\" 决定的 PHP 主页——但遗憾的是，由于链接的原因，它并不特别好看\n\n### 提示\n\n如果你使用\
  \ `file_get_contents()`，主页的输出会更快（且不需要 while 循环）。该函数也支持流。如果你有一个文件句柄，根据流类型，这可能会显示不同的信息。`stream_get_metadata()`\
  \ 函数返回所有这些数据的元数据（参见 图 26.2）。让我们看看 PHP 主页在读取时的情况：\n\n```php\n<?php\n  $file = fopen(\"\
  https://www.php.net/\", \"r\");\n  echo \"<pre>\";\n  echo htmlspecialchars(\n \
  \   print_r(stream_get_metadata($file), true)\n  );\n  echo \"</pre>\";\n  fclose($file);\n\
  ?>  \n```\n\n**列表 26.2** 到 \"php.net\" 的 HTTP 请求\n\n**图 26.2** HTTP 请求\n\n另一个与流相关的术语是上下文。要创建一个上下文需要\
  \ `stream_context_create()` 函数。你可以传递一个数组作为参数来指定选项：\n\n```php\n$context = stream_context_create(\n\
  \  [\"http\" =>\n    [\n      \"method\" => \"POST\",\n      \"header\" => \"Content-type:\
  \ application/x-www-form-urlencoded\", \n      \"content\" => \"search_string=HTTP&search_in=packages\"\
  \n    ]\n  ]\n);  \n```\n\n\n\n\n![Socket POST 请求的结果](img/img-f26.4.html) \n\n**图\
  \ 26.4** Socket POST 请求的结果\n\n### 注意\n当然，PECL 网站可能会随时发生变化。因此，无法保证代码在未来仍以完全相同的方式运行。\n\
  \n### FTP 流\n对于类型为 `ftp://user:password@ftp.domain.xy/path/file` 或 `ftps://user:password@ftp.domain.xy/path/file`\
  \ 的 FTP 流，你可以像处理普通文件一样处理 FTP 服务器上的文件（见前一章节）。如果你在 `fopen()` 中使用文件模式 `\"rb\"`，则可以从\
  \ FTP 服务器下载文件；使用 `\"wb\"` 或 `\"xb\"`，则可以创建文件。还有另一种选项：你可以将数据附加到 FTP 文件中——即也使用 `\"\
  ab\"` 模式。\n\n### 26.2.3 PHP 流\n在表 26.1 中列出的流中，有一个特别有趣：`php://filter`。PHP 已经包含了预定义的流过滤器：如果你向这些过滤器写入数据，数据将自动被转换。要尝试以下示例，你仍然上一章节中的\
  \ `test.txt` 文件，内容如下：\n\n```\nAll of life is a test\nand we are only the candidates\
  \  \n```\n\n你可以在过滤器中输入以下数据：\n- 对于 `resource`，指定你想要访问的流名称。\n- 通过 `read`，你可以指定读取时应用的过滤器。\n\
  - 通过 `write`，你定义了写入时使用的过滤器。\n\n下面的列表显示了一个示例。\n\n```\n<pre>  \n```\n\n```php\n<?php\n\
  \  echo htmlspecialchars(\n    file_get_contents(\n      \"php://filter/read=string.toupper/resource=test.txt\"\
  \n    )\n  );\n?>  \n```\n\n```\n</pre>  \n```\n\n**列表 26.5** \"string.toupper\"\
  \ 过滤器 (\"filter-1.php\")\n\n图 26.5 显示了结果：`string.toupper` 将流数据转换为大写字母。\n\n![过滤器的结果](img/img-f26.5.html)\
  \ \n\n**图 26.5** 过滤器的结果\n\nPHP 内置了以下四个过滤器：\n1. `string.rot13` 执行 ROT13 编码。[ 127\
  \ ]](footnotes.html#ftn-fn26_02)\n2. `string.strip_tags` 使用 `strip_tags()` 函数对所有数据进行预处理——即移除所有标签。\n\
  3. `string.tolower` 将所有数据转换为小写（类似于 `strtolower()`）。\n4. `string.toupper` 将所有数据转换为大写（类似于\
  \ `strtoupper()`）。\n\n还有一些转换过滤器：\n- `convert.base64-decode` 解码 Base64 数据（类似于 `base64_decode()`）。\n\
  - `convert.base64-encode` 将数据编码为 Base64 格式（类似于 `base64_encode()`）。\n- `convert.quoted-printable-decode`\
  \ 解码引号打印数据（类似于 `quoted_printable_decode()`）。\n- `convert.quoted-printable-encode`\
  \ 将数据编码为引号打印格式（类似于 `quoted_printable_encode()`）。\n\n在上一章节保存留言板数据时，我们本可以使用特定的 Base64\
  \ 过滤器。\n\n当然，这些只是非常有限的选项。幸运的是，PHP 提供了定义自定义流的选项。要实现这一点，你需要自己的类，该类继承自 `php_user_filter`。你需要其中一个\
  \ `filter()` 方法来处理数据。该方法的返回类型必须设置为 `int` 以避免弃用警告。方法的过程始终相同，你可以通过复制粘贴来继续（此示例也是这样创建的）。关键行是修改\
  \ `$bucket->data` 属性的行。在这里你可以看到使用 `htmlspecialchars()` 处理所有数据的类：\n\n```\nclass htmlspecialchars_filter\
  \ extends php_user_filter {\n  function filter($in, $out, &$consumed): int \n  {\n\
  \    while ($bucket = stream_bucket_makeable($in)) {\n      $bucket->data = htmlspecialchars($bucket->data);\n\
  \      // ...\n    }\n  }\n```\n\n通过 `stream_filter_register()`，你可以根据你的选择向系统注册该类：\n\
  \n```\nstream_filter_register(\n  \"string.toupper\", \n  \"htmlspecialchars_filter\"\
  \n);\n```\n\n`stream_get_filters()` 函数可以检查过滤器是否已实际注册到系统。然后你也可以使用该过滤器。下面的流打开 `test.txt`\
  \ 文件，将内容转换为大写并转换 HTML 字符；你可以在图 26.6 中看到输出。\n\n（注：用户提供的文本在结尾有些重复和混乱，我已经重新排版了提供的逻辑流。）\n\
  \n\n\n\n```php\n<?php\n  if (file_exists(\"test.gz\")) {\n    echo \"<h1>test.gz</h1><pre>\"\
  ;\n    echo htmlspecialchars(\n      file_get_contents(\"compress.zlib://test.gz\"\
  )\n    );\n    echo \"</pre>\";\n  }\n  if (file_exists(\"test.bz2\")) {\n    echo\
  \ \"<h1>test.bz2</h1><pre>\";\n    echo htmlspecialchars(\n      file_get_contents(\"\
  compress.bzip2://test.bz2\")\n    );\n    echo \"</pre>\";\n  }\n?>  \n```\n\n###\
  \ 列表 26.8 读取压缩文件 (\"zip-read.php\")\n\n你将收到这两个文件的内容（请参见图 26.8）——或者，如果 Windows 没有相应配置，则只会看到\
  \ GZ 文件中的数据。Unix/Linux 用户将看到两个压缩包。\n\n![Web 浏览器中的文件内容](img/img-f26.8.html) \n\n\
  ### 图 26.8 Web 浏览器中的文件内容\n\n### 注意\n\n你也可以尝试使用流（streams）打开 PHP 源码压缩包——例如 `php-8.x.y.tar.gz`\
  \ 文件。然而，你的系统可能会迅速达到（内存）限制。此外，它包含的文件是一个 TAR 文件，你无法使用 PHP 内置工具轻松编辑它。\n\n#### PHP 的\
  \ FTP 函数\n\n如果你想使用 FTP 特定的函数，必须在 Unix/Linux 下专门为此配置 FTP；`configure` 命令的 `--enable-ftp`\
  \ 选项可以处理这一点。然后，你就可以可以使用一系列特殊的 FTP 函数了，这些函数方便地封装了所有的 FTP 命令。下面的列表提供了一个说明性示例。\n\n\
  ```php\n<?php\n  $connection = ftp_connect(\"ftp.mozilla.org\"); \n  $login = ftp_login($connection,\
  \ \"anonymous\", \"guest@xy.zzz\"); \n  if ($connect && $login) {\n    if (ftp_get(\n\
  \          $connection, \n          \"README.txt\", \n          \"/README\", \n\
  \          FTP_ASCII\n        )) {\n      echo \"File <a href=\\\"README.txt\\\"\
  >saved</a>.\";\n    } else {\n      echo \"Error during download.\";\n    }\n  }\n\
  \  ftp_close($connection); \n?> \n```\n\n### 列表 26.9 PHP 的 FTP 函数 (\"ftp.php\")\n\
  \n列表 26.9 中的代码从 Mozilla 的 FTP 服务器下载 README 文件，该文件包含了有关服务器的通用信息。文件被保存在本地，并可以在那里查看。选择的下载模式是\
  \ `FTP_ASCII`；对于二进制文件，你需要 `FTP_BINARY`。\n\n## 26.3 Fibers（纤）\n\nPHP 8.1 引入了 Fibers\
  \ 新功能，用于同时执行多个任务。严格来说，Fibers 是带有暂停按钮的函数：如果需要，可以中断它们并在稍后恢复。这同时也导致了 `Fiber` 类实例的三个主要方法：\n\
  \n- `start()` 启动一个 fiber\n- `suspend()` 暂停一个 fiber\n- `resume()` 恢复已暂停的 fiber\n\n\
  为什么这个主题会出现在主要关于网络通信和 HTTP 的章节中？因为 Fibers 是执行并行 HTTP 请求的极佳方法！要实现这一点，我们创建多个 `Fiber`\
  \ 类的实例。构造函数包含作为匿名函数的代码。然后我们通过循环循环调用它们的 `start()` 方法来执行所有 Fibers。列表 26.10 显示了相应的代码。\n\
  \n```php\n<?php\n  $urls = [\n    \"https://www.php.net/\",\n    \"https://windows.php.net/\"\
  ,\n    \"https://pecl.php.net/\"\n  ];\n\n  $fibers = [];\n\n  foreach ($urls as\
  \ $url) {\n    array_push($fibers, new Fiber(function() use ($url) {\n      $contents\
  \ = file_get_contents($url);\n    }));\n  }\n\n  foreach ($fibers as $fiber) {\n\
  \    $data = $fiber->start();\n  }\n?>\n\n### 列表 26.10 使用 Fibers 并行 HTTP 请求 (\"\
  fibers.php\")\n\n关于 Fibers 的进一步虽然简短的信息可以在 PHP 文档 `www.php.net/fibers` 中找到。关于 Fibers\
  \ 的实现的更多详细信息，查看其 RFC (`https://php.net/rfc/fibers`) 是值得的。\n\n## 26.4 示例\n\n你可以使用流创建一些实用的应用程序。本节提供了两个适用于开发的建议。\n\
  \n### 26.4.1 网页的文本版本\n\n首先，让我们创建一个网页文本版本的方法。尽管像 Lynx 这样的基于 Web 的浏览器变得越来越好，考虑到访问性（accessibility）变得很重要，考虑这一点是一个好主意。\n\
  \n我们如何实现这一点？使用特殊的过滤器。`strip_tags` 过滤器已经很好，但假设我们想保留 `<p>` 标签的内容。我们还需要用 `htmlspecialchars()`\
  \ 准备输出：因为应该保留 `<p>` 标签（及其内容），在编写过滤器时，以下指令是决定性的：\n\n```php\n$bucket->data = htmlspecialchars(\
  \ \n  str_replace(\"<P>\", \"\", strip_tags($bucket->data, \"<p>\"))\n);\n```\n\n\
  列表 26.11 显示了一个小示例：用户输入网络地址，加载并转换为文本版本。图 26.9 显示了输出。\n\n```html\n<form method=\"\
  post\">\nURL: <input type=\"text\" name=\"url\" value=\"<?php\n  echo (isset($_POST[\"\
  url\"]) && is_string($_POST[\"url\"])) ? htmlspecialchars($_POST[\"url\"]) : \"\"\
  ;\n? /><input type=\"submit\" />\n</form>\n<hr /> \n```\n\n```php\n<?php\n  if (isset($_POST[\"\
  url\"]) && is_string($_POST[\"url\"])) {\n    $url = $_POST[\"url\"];\n    class\
  \ textversion_filter extends php_user_filter {\n      function filter($in, $out,\
  \ &$consumed, $closing): int \n      {\n        while ($bucket = stream_bucket_make_writeable($in))\
  \ {\n          $bucket->data = htmlspecialchars(\n            str_replace(\"<P>\"\
  , \"\", strip_tags($bucket->data, \"<p>\"))\n          );\n          $consumed +=\
  \ $bucket->datalen;\n          stream_bucket_append($out, $bucket);\n        }\n\
  \        return FS_PASS_ON;\n      }\n    }\n    stream_filter_register(\n     \
  \ \"string.textversion\", \n      \"textversion_filter\"\n    );\n    echo \"<pre>\"\
  ;\n    echo file_get_contents(\n      \"php://filter/read=string.textversion/resource=$url\"\
  \n    );\n    echo \"</pre>\";\n  }\n?>  \n```\n\n### 列表 26.11 网页的简单文本版本 (\"textversion.php\"\
  )\n\n![phpinfo()调用的文本版本](img/img-f26.9.html) \n\n### 图 26.9 phpinfo()调用的文本版本\n\n\
  ### 注意\n\n该应用程序的形式并非用于互联网，因为你可以在 URL 字段中输入任何流，包括本地文件名 `/etc/passwd`。如果你将此文本版本集成到你的网站，必须使脚本特别安全（例如仅允许来自特定服务器的\
  \ URL）。\n\n### 26.4.2 在线压缩器\n\n第二个应用程序将一个特殊任务——压缩文件——转移到 Web 服务器。假设用户没有 gzip 或 bzip2。如果你有自己的、更好的压缩算法，可以将其实现为独立的流并从而提供该服务（但请内部）。即使\
  \ gzip 算法没什么特别，示例仍然显示了特殊 PHP 流的潜力。\n\n用户通过 `<input type=\"file\" />` 将文件传输到 Web\
  \ 服务器。在通过 `is_uploaded_file()` 进行常规检查后，首先使用 `file_get_contents()` 读取文件，然后使用 `file_put_contents()`\
  \ 写入——这次是压缩后的：\n\n```php\n$tempfile = tempnam(\"/tmp\", \"php\");\n@file_put_contents(\
  \ \n  \"compress.zlib://$tempfile\", \n  file_get_contents($_FILES[\"file\"][\"\
  tmp_name\"]))\n);  \n```\n\n数据现在存储在由 `tempnam()` 创建临时文件中（提供的路径 `/tmp` 必须在你的系统中存在且可写）。通过\
  \ `file_get_contents()`，我们再次读取文件并通过手动写入相应的 HTTP 头部将其输出。作为 Web 浏览器的推荐文件名，我们使用原始文件的名称（我们使用\
  \ `$_FILES` 确定）加上扩展名 `.gz`：\n\n\n\n\n\n```\n$data = file_get_contents($tempfile);\n\
  header(\"Content-type: application/x-gzip\");\nheader(\"Content-disposition: inline;\
  \ filename=\" .\n       basename($_FILES[\"name\"]) . \".gz\");\necho $data;\nexit();\n\
  ```\n考虑以下列表；输出显示在图 26.10。\n\n```php\n<?php\n  if (isset($_FILES[\"file\"]) && isset($_FILES[\"\
  file\"][\"tmp_name\"]) &&\n    is_uploaded_file($_FILES[\"file\"][\"tmp_name\"]))\
  \ {\n    $tempfile = tempnam(\"/tmp\", \"php\");\n    if (@file_put_contents(\n\
  \        \"compress.zlib://$tempfile\",\n        file_get_contents($_FILES[\"file\"\
  ][\"tmp_name\"])\n      ) {\n      $data = file_get_contents($tempfile);\n     \
  \ header(\"Content-type: application/x-gzip\");\n      header(\"Content-disposition:\
  \ inline; filename=\" .\n             basename($_FILES[\"name\"]) . \".gz\");\n\
  \      echo $data;\n      exit();\n    }\n  } else {\n?>\n```\n\n```html\n<form\
  \ method=\"post\" enctype=\"multipart/form-data action=\"\">\n  <input type=\"file\"\
  \ name=\"file\" />\n  <input type=\"submit\" />\n</form>\n```\n\n```php\n<?php\n\
  \  ?>\n```\n\n列表 26.12 在线压缩器 (\"online-gzip.php\")\n\n![文件文件被上传、压缩并返回](img/klein26_010.png)\
  \ [1]\n\n图 26.10 文件被上传、压缩并返回\n\n#### 注意事项\n某些源将 `application/gzip` 列为 gzip 压缩文件的\
  \ MIME 类型。然而，如果你搜索 `application/gzip` 和脚本中使用的 `application/x-gzip`，后者的 MIME 类型似乎会返回更多匹配结果。\n\
  \n# 27 APIs 与服务\n\n接口在现代网站、在线商店和其他应用程序中起着举足的作用。因此，APIs 和 Web 服务的重要性在近年来得到了增强。\n\n\
  APIs 已经成为现代 IT 不可缺的一部分。无论你考虑的是 Google、Amazon 和 eBay 的 Web 服务等大型案例，还是公司、门户网站等之间的整体通信，Web\
  \ 服务都为不同应用程序之间铺平了道路。\n\nPHP 提供了大量的可用库。本章的目标是向你展示最重要的库，并解释如何使用它们。然而，我们也展示了简单的 REST\
  \ 无需库解决方案。如果你还不熟悉 Web 服务宇宙中的术语，可以在第 27.1.1 节中学习更多。\n\n## 27.1 准备\n\n准备部分分为两部分。首先列出了一些关于\
  \ Web 服务的基础知识，如果你是专家，可以也应该跳过这些内容。接下来是安装必要的库。\n\n### 27.1.1 Web 服务基础\n\nWeb 服务背后有一段波澜多彩的历史。Dave\
  \ Winer 作为一家名为 Userland 的小公司的创始人开启了序幕。他在他的产品中构建了远程过程调用 (`RPCs`）。这本身并不是什么新鲜事：无论是\
  \ `DCOM` 还是 `CORBA`，以前都实现过。Dave Winer 只是将他的 `RPCs` 封装在 `XML` 中。这促成了 `XML-RPC` 的诞生。\n\
  \n这个想法得到了微软 `COM` 开发者组的高度认可。正如 Dave Winer 一些时候在他的博客中所承认的那样，微软从其初期不久就参与了 `XML-RPC`\
  \ 的开发。这些想法随后与 IBM 合作发展成了 `SOAP` 协议。\n\n#### 架构\n\nWeb 服务经常被误解：被视为业务意义上的服务、被局限于互联网等。根据我们的定义，Web\
  \ 服务的目的是实现跨机器通信：一台服务器与另一台服务器通信。一旦开发者设置好，这种通信就会自动发生。\n\n这里的起点是 `RPCs`，它们在过去以各种技术存在。原则上，Web\
  \ 服务也允许通过网络进行方法调用。然而，它与之前的方法有两个重要的区别：\n\n*   Web 服务也可以作为简单的消息发送，而无需（立即）响应。\n*  \
  \ 得益于开放标准，Web 服务具有互操作性。这意味着任何服务器端技术都可以集成 Web 服务——今天 99% 的情况都是这么做的。128\n\nWeb 服务架构非常简单：你有一个服务提供者和一个消费者。消费者不应与最终客户混淆；相反，它是读取\
  \ Web 服务并使用其中信息的那个（服务器）。在大多数情况下，服务消费者会将其网站布局中的纯数据传递给其用户。\n\n服务提供者和服务消费者也是面向服务的架构\
  \ (`SOA`) 的关键元素。这个术语是现代应用程序面向对象架构 (`OOA`) 的对等词。`OOA` 是紧耦合的，而 `SOA` 基于松耦合。松耦合意味着服务可以被轻松更改。最终目标是实现服务的即插即用。\n\
  \n在 `SOA` 中，还有一个我们在此之前忽略的角色：服务目录。在目录中，服务提供者发布其服务。消费者发现它并可以直接连接到提供者。如果通信双方彼此认识，那么\
  \ Web 服务并不绝对需要目录。然而，目录是不可缺的。\n\n#### 标准\n\n现在的问题是哪些标准技术上对于 Web 服务是必要的。原则上，一个简单的\
  \ `HTTP GET` 请求就可以声明为 Web 服务。这被称为 `REST`。\n\nREST 服务中的数据可以使用多种格式进行交换。`JSON` ([www.json.org](http://www.json.org))\
  \ 是此领域的准标准。在 PHP 中，通过 `HTTP GET` 访问此类 Web 服务没有任何问题。返回值将是 `XML`，你可以使用 `SimpleXML`（参见第\
  \ 29 章）轻松地处理它。\n\n\n\n\n\nSOAP 最初代表的是 Simple Object Access Protocol（简单对象访问协议）。在\
  \ W3C 的 1.2 版本规范（www.w3.org/TR/soap）中，SOAP 现在简单地称为 SOAP。原因显而易见：SOAP 既并不简单，也不与对象访问直接相关。一个没有意义的缩写并不好用，但这个已经自然化的名称没有必要更改。\n\
  \nSOAP 的结构由三个元素组成：\n\n- `envelope`（封包）封装了整个 SOAP 消息。\n- `SOAP header`（SOAP 头）包含安全信息等，但它是可选的。\n\
  - `SOAP body`（SOAP 实体）包含实际的消息。\n\n### 注意\n今天，SOAP 消息通常通过 Web 协议 `HTTP` 发送。因此，`HTTP`\
  \ 头出现在消息上方。然而，并非如此。事实上，你也可以使用任何其他协议作为传输器。例如，`SMTP` 和 `FTP` 都是可能的。\n\n## WSDL\n手动生成\
  \ SOAP 消息并不是一项愉快的任务。这正是证明 `WSDL` 存在事实之一。与 SOAP 类似，`WSDL` 是由微软和 IBM 提交给 W3C 的。当前版本是\
  \ 2.0（www.w3.org/TR/wsdl.html）。\n\n`WSDL` 为 Web 服务提供了描述。描述包含了所有方法，但也可以提供许多今天并不经常使用的额外信息。\n\
  \n大多数 Web 服务实现程序都使用 `WSDL` 来减轻开发人员的工作。当你创建一个服务时，实现类可以生成 `WSDL` 自身。如果你消费该服务，实现类会访问\
  \ `WSDL` 并自动根据其生成所需的 SOAP 消息。\n\n## 问题\nWeb 服务在今天被广泛使用。尽管如此，仍然有一些因素没有得到优化解决或仍在开发中：\n\
  \n- 安全性。\n- 性能。\n- 事务和流程。\n- 目录服务并不算成功；`PHP` 也没有现代的实现。\n\n当涉及到安全性时，标准正在不断开发中：来自\
  \ `OASIS` 的 `WS-Security` 提供了一个很好的整体方法。`WS-Security` 具有非常开放的结构，并结合了许多其他现有标准，如 `XML\
  \ Encryption` 和 `SAML`。然而，例如在 `PHP` 中还没有全面的实现。\n\n在实践中，我们看到了许多用于身份验证和会话管理的自定义解决方案。一些\
  \ Web 服务提供者也不使用进一步的安全机制。Amazon 就是一个例子。只使用开发者令牌（即唯一 ID），该令牌随方法调用一起发送。没有使用进一步的安全性（例如\
  \ `SSL certificates`），因为 Amazon 自身处理最后的步骤——支付，并且只允许 Amazon 客户这样做。\n\n另一个经常被提到的问题与二进制传输相比的性能劣势。这里的解决方案之一是使用\
  \ `HTTP` 的 `gzip` 能力。然而，你应该对此进行测试，以真正确定压缩对于你的数据量是否必要。从性能角度来看，基于 SOAP 的服务经常因为描述数据的“开销”而受到批评。基于\
  \ `REST` 的服务解决了这个问题。\n\n第三个问题是事务和流程的。让我们来看一个简单的例子。假设你订了一张火车票。然后你上了一列满员的火车，对自己的预订感到满意，挤过头等舱站在你的座位前。但那里不是空的：一位和的老太太坐在那里。你们进行了简短的讨论，女士给你看她的票，上面显示的预订时间和你票上的完全一样。在这种情况下，应用程序中的事务安全性就失败了。\n\
  \n目前有许多旨在提供事务和流程的标准。最有前景的可能是 `BPEL`。\n\n## 实现\n在梦想互操作性时，人们经常忘记，你自然需要在用于 Web 服务的服务端编程语言中有一个实现。`PHP`\
  \ 赖于其多样化的开发者社区而繁荣，并提供了不同的实现。一方面，这是一个优势；另一方面，用于实现新标准的剩余资源并不多。\n\n以下是最重要的 Web 服务库和包的简要概述：\n\
  \n- `nuSOAP` 基于 Dietrich Ayala 的开发。`nuSOAP` 本身最初源于 `SOAPx4` 库，该库也由 Dietrich Ayala\
  \ 编写。它的优势在于能够动态生成 `WSDL` 以及与各种编程语言的成功互操作。\n- `PHP-SOAP` 是随 `PHP` 提供的标准库，因此是 `PHP`\
  \ 中处理基于 SOAP 的 Web 服务的最常用方法。\n\n### 注意\n`PHP-SOAP` 的开发在 `PHP` 社区中颇有争议。许多人更希望将 `PHP\
  \ 4` 最流行的包 `PEAR::SOAP` 移植到 `PHP 5`。由于 `PHP-SOAP` 的一些 bug，这种观点与日俱增。然而，`PHP-SOAP`\
  \ 胜出了。\n\n### 27.1.2 安装\n本节对安装的描述根据不同的实现进行了划分。\n\n#### nuSOAP\n安装 `nuSOAP` 非常简单，因为它只是几个可以集成到你的项目中的\
  \ `PHP` 文件。从 `https://github.com/contributte/nusoap` 下载文件——那是针对现代 `PHP` 版本对原始 `nuSoap`\
  \ 的重写。当前版本是 0.9.16。然后将 `lib` 目录放在你的项目文件夹中或你 Web 服务器上的任何其他文件夹中。你只需要将此文件集成到你的脚本中：\n\
  \n```\nrequire_once \"lib/nusoap.php\";\n```\n\n作为替代方案，你也可以使用 `Composer`。\n\n####\
  \ PHP-SOAP\n在 Linux 配置期间需要启用 `SOAP`：\n\n```bash\n--enable-soap\n```\n\n在 Windows\
  \ 上，需要在 `php.ini` 中添加以下行：\n\n```\nextension=php_soap.dll\n```\n\n`PHP 7.2` 或更高版本足够：\n\
  \n```\nextension=soap\n```\n\n这可能已经存在于主机中了。使用 `phpinfo()` 检查模块是否存在。\n\n![PHP-SOAP\
  \ 的集成](img/klein27_002.png)\n图 27.2 PHP-SOAP 的集成\n\n## 27.2 REST\n访问 `REST` 消息基本上非常简单。`REST`\
  \ 意味着数据和服务始终隐藏在唯一的 URL 之后。这意味着你只需要为它提供一个可以调用单个方法的 URL 结构。最简单的方法是通过 URL 参数——例如，结构如下：\n\
  \n- `method` 作为参数指定调用的方法。\n- `parameter` 接收参数数组。\n\n这里有一个完整的示例 URL：\n\n```\nhttp://localhost/php/rest_server.php?method=square&parameter=24\n\
  ```\n\n与 `REST` 交换可以使用多种格式。你可以定义自己的 XML 格式，或者使用 `JSON`，这是一种常用的数组和对象表示法。\n\n### 注意\n\
  URL 参数名称完全自由选择。数据格式也是如此。一方面，这非常灵活；另一方面，这也是 `REST` 的一个特性，因为你实际上必须自己定义一切。\n\n以下脚本通过指定方法和参数的两个\
  \ `GET` 参数创建一个 `REST` 服务器：\n\n1. 系统首先检查参数是否可用：\n\n```php\nif (isset($_GET['method'])\
  \ && isset($_GET['parameter'])) {\n```\n\n在此处可以进行进一步的检查。但对于这个简单的例子来说，我们只需要确定参数是否存在即可。\n\
  \n\n\n\n\n## 2. 参数处理\n\n随后处理 URL 参数。第二个 URL 参数包含函数的参数，它将使用 `json_decode()` 从 JSON\
  \ 格式转换为 PHP 数组：\n\n```php\n$method = $_GET['method'];\n$parameter = json_decode($_GET['parameter']);\
  \  \n```\n\n## 3. 验证\n\n为了确保不会调用任何未知的方法，我们需要检查被调用的函数是否存在：\n\n```php\nif (function_exists($method))\
  \ {  \n```\n\n在实际应用场景中，在数组或对象中注册所有可调用函数并仅允许已注册的函数是有意义的。\n\n## 4. 获取结果\n\n你可以通过带有第一个参数的方法来获取结果。结果本身在同一步中转换回数组，然后使用\
  \ `json_encode()` 将其转换为序列化数组：\n\n```php\n$result = [$method($parameter[0])];\n echo\
  \ json_encode($result);  \n```\n\n当使用具有不同参数数量的方法时，你必须在此处添加额外的检查。\n\n列表 27.1 包含了代码；图\
  \ 27.3 显示了输出。\n\n```php\n<?php\n  function square($a) { \n    if ($a != null &&\
  \ trim($a) != \"\") {\n      $square = $a * $a;\n      return $square;\n    }\n\
  \  }\n  if (isset($_GET['method']) && isset($_GET['parameter'])) {\n    $method\
  \ = $_GET['method'];\n    $parameter = json_decode($_GET['parameter']);\n    if\
  \ (function_exists($method)) {\n      $result = [$method($parameter[0])];\n    \
  \  echo json_encode($result);\n    }\n  }\n?>  \n```\n\n**列表 27.1** REST 服务器 (\"\
  rest_server.php\")\n\n![直接使用 \"GET\" 参数调用时服务器的返回](img/img-f27.3.html) \n\n**图 27.3**\
  \ 直接使用 \"GET\" 参数调用时服务器的返回\n\n## 客户端实现\n\n客户端的结构非常简单。通过文件函数，如果 `php.ini` 中激活了 `allow_url_fopen`，你可以直接访问\
  \ REST 服务。这里我们使用 `file_get_contents()`。核心是 URL，它在这里被组装：\n\n```php\n$url = 'http://localhost/php/rest_server.php?method='\
  \ . \nurlencode($method) . '&parameter=' . urlencode(json_encode($parameter)); \
  \ \n```\n\n响应本身仍然需要检查。如果调用失败，`file_get_contents()` 将返回 `false`。此时必须使用 `json_decode()`\
  \ 对响应进行转换，在我们案例中，数组的第一个元素就是响应。下面的列表显示了完整的脚本；输出见 图 27.4。\n\n```php\n<?php\n  $method\
  \ = 'square';\n  $a = 24;\n  $parameter = [$a];\n  $url = 'http://localhost/php/rest_server.php?methode='\
  \ . \n    urlencode($method) . '&parameter=' . urlencode(json_encode($parameter));\n\
  \  $answer = file_get_contents($url);\n  if ($answer !== false) {\n    $result =\
  \ json_decode($answer)[0];\n    print \"The square of $a is: \" . $result;\n  }\n\
  ?>  \n```\n\n**列表 27.2** REST 客户端 (\"rest_client.php\")\n\n![也可以使用 REST 计算平方](img/img-f27.4.html)\
  \ \n\n**图 27.4** 也可以使用 REST 计算平方\n\n## PHP 8.3 中的 JSON 验证\n\n在解码 JSON 时，你以前总是依赖于有效的\
  \ JSON 或自己编写验证函数。在 PHP 8.3 中，一个新的验证函数已成为 PHP 核心的一部分：`json_validate(JSON string,\
  \ depth, flag)`。它有三个参数：\n\n*   JSON 字符串是该方法的唯一强制参数，包含要验证的字符串。PHP 在此处使用 UTF-8 作为字符串字符编码。\n\
  *   depth（深度）是一个可选的规范，表示执行验证的嵌套深度。\n*   对于 flags（标志位），目前只有一个选项 `JSON_INVALID_UTF8_IGNORE`，它用于忽略无效的\
  \ UTF-8 字符。\n\n下面的列表显示了一个简单的示例。\n\n```php\n<?php\n  $json = '{\n    \"shares\" :\
  \ {\n      \"Miemens\" : 120,\n      \"Rheinwerk\" : 504\n    } \n  }';\n  var_dump(json_validate($json));\
  \ \n?>  \n```\n\n**列表 27.3** JSON (\"json_validate.php\")\n\n在这种情况下，结果为 true，因为\
  \ JSON 是有效的。这可以通过下一个列表中的微小变化快速更改。很难看出区别；仅仅在 \"Miemens\" 条目后缺少了一个逗号。\n\n```php\n\
  \  $json = '{\n    \"shares\" : {\n     \"Miemens\" : 120\n     \"Rheinwerk\" :\
  \ 504\n    } \n  }';\n  json_validate($json); \n  echo \"Result: \" . (json_validate($json)\
  \ ? \"true\" : \"false\");\n```\n**列表 27.4** JSON 验证示例\n\n\n\n\n\n```php\n<?php\n\
  \  function square($a) {\n    if ($a != null && trim($a) != \"\") {\n      $square\
  \ = $a * $a;\n      return $square;\n    } else {\n      return new soap_fault(\"\
  Client\", \"\", \"No parameter\");\n    }\n  } \n  require_once \"lib/nusoap.php\"\
  ;\n  $server = new nusoap_server();\n\n  $server->register(\"square\");\n  $data\
  \ = file_get_contents(\"php://input\") ?? \"\";\n  $server->service($data);\n?>\
  \  \n```\n```\n**Listing 27.5** 一个 nuSOAP 服务器 (`nusoap-server.php` )\n\n### 注意\n\
  \n在这个示例中，nuSOAP 会自动决定数据类型。不过，你也可以手动选择数据类型的选项。要做到这一点，请使用 `soapval(name, type, value,\
  \ namespace_value, namespace_type, attributes)` 函数。你也可以为名称输入空字符串。`type` 是数据类型；`value`\
  \ 是实际传输的内容。如果你想创建自己的变量和数据类型，并告知通信伙伴它们是什么，你应该使用命名空间。\n\n### 27.3.2 客户端\n\n现在我们来看消费服务的客户端。它像往常一样开始：\n\
  \n1.  首先添加 nuSOAP 库：\n\n    ```php\n    require_once \"nusoap.php\";  \n    ```\n\
  \n2.  接下来调用客户端。你将服务的 URL 作为参数输入：\n\n    ```php\n    $client = new nusoap_client(\"\
  http://localhost/php/nusoap_server.php\");  \n    ```\n\n    #### 注意\n\n    nuSOAP\
  \ 提供了另外两个方法，`soap_server()` 和 `soapclient()`，分别用于服务器和客户端。\n\n3.  使用 `call(method,\
  \ parameter)` 进行实际的方法调用。参数以数组的形式传递：\n\n    ```php\n    $a = 36;\n    $answer = $client->call(\"\
  square\", [$a]);  \n    ```\n\n4.  最后，检查是否发生了任何错误。如果一切正常，则显示结果：\n\n    ```php\n\
  \    if ($error = $client->getError()) {\n      print \"Error: \" . $error;\n  \
  \   } elseif ($error = $client->fault) {\n      print \"SOAP error: \" . $error;\n\
  \     } else {\n      print \"The square of $a is \" . $response;\n     }  \n  \
  \  ```\n\n`Listing 27.6` 显示了完整的脚本；输出显示在 `Figure 27.5` 中。\n\n```php\n<?php\n  require_once\
  \ \"lib/nusoap.php\";\n \n  $a = 36;\n \n  $client = new nusoap_client(\"http://localhost/php/nusoap_server.php\"\
  );\n  $response = $client->call(\"square\", [$a]);\n\n  if ($error = $client->getError())\
  \ {\n    print \"Error: \" . $error;\n  } elseif ($error = $client->fault) {\n \
  \   print \"SOAP error: \" . $error;\n  } else {\n    print \"The square of $a is\
  \ \" . $answer;\n  }\n?>  \n```\n```\n**Listing 27.6** 使用了 nuSOAP 的客户端 (`nusoap_client.php`\
  \ )\n\n**Figure 27.5** 你已经做过计算了吗？\n\n### 27.3.3 WSDL\n\n到目前为止，nuSOAP 的示例完全不需要 WSDL。但\
  \ WSDL 是一个重要的元素，特别是对于与其他技术之间的互操作性。要创建 WSDL，你只需要稍微调整你的脚本：\n\n1.  首先配置 WSDL。要做到这一点，请给服务起一个名称（这里是\
  \ Square）并指定命名空间：\n\n    ```php\n    $server->configureWSDL(\"Square\", \"http://www.arrabiata.de/nusoap/\"\
  );  \n    ```\n\n2.  接下来注册方法。函数的名称、格式、当前时间以及架构命名空间在这里非常重要：\n\n    ```php\n    $server->register(\"\
  square\",\n                      [\"a\" => \"xsd:int\"],\n                     \
  \ [\"square\" => \"xsd:int\"],\n                      \"http://soapinterop.org/\"\
  \n     );  \n    ```\n\n`Listing 27.7` 包含了完整的代码。\n\n```php\n<?php\n\n  function\
  \ square($a) {\n    if ($a != null && trim($a) != \"\") {\n      $square = $a *\
  \ $a;\n      return $square;\n    } else {\n      return new soap_fault(\"Client\"\
  , \"\", \"No parameter\");\n    }\n  } \n\n  require_once \"lib/nusoap.php\";\n\
  \  $server = new nusoap_server();\n\n  $server->configureWSDL(\"Square\", \"http://www.arrabiata.de/nusoap/\"\
  );\n \n  $server->register(\"square\",\n                    [\"a\" => \"xsd:int\"\
  ],\n                    [\"square\" => \"xsd:int\"],\n                    \"http://soapinterop.org/\"\
  \n  );\n \n  $data = file_get_contents(\"php://input\") !== null ? \n    file_get_contents(\"\
  php://input\") : \"\";\n  $server->service($data);\n  exit();\n?>  \n```\n```\n\
  **Listing 27.7** 使用了 nuSOAP 的 WSDL (`nusoap_wsdl_server.php` )\n\n你可以轻松查看 nuSOAP\
  \ 生成的 WSDL。只需在脚本名称后加上 `?wsdl` 即可。对于我们的示例，本地地址是 `http://localhost/php/nusoap_wsdl_service.php?wsdl`（参见\
  \ `Figure 27.7`）。WSDL 的长度显示自动生成确实有其优势。\n\n**Figure 27.7** 方法描述\n\n### 注意\n\n如果你在不带\
  \ `?wsdl` 的情况下调用服务，将收到引用 WSDL 并提供方法描述的信息。\n\n\n\n\n1. `SoapServer` 对象包含了所有重要内容。第一个参数用于\
  \ WSDL。由于我们在这里没有使用 WSDL，而是使用普通的 SOAP 调用，因此传递了 `null`。第二个参数是一个包含选项的关联数组：\n\n```php\n\
  $server = new SoapServer(null, [\"uri\" =>\n  \"http://www.arrabiata.de/PHP-SOAP/\"\
  ]);  \n```\n\n2. 再次使用了 `square()` 函数。与之前相比，只有抛出错误的方式发生了变化：\n\n```php\nthrow new\
  \ SoapFault(\"Client\", \"No parameter\");  \n```\n\n3. 最后，将函数添加到服务器中并使用 `handle()`\
  \ 启动服务器：\n\n```php\n$server->addFunction(\"square\");\n $server->handle();  \n```\n\
  \n`Listing 27.9` 显示了完整的脚本。\n\n```php\n<?php\n  $server = new SoapServer(null, [\"\
  uri\" => \n    \"http://www.arrabiata.de/PHP-SOAP/\"]);\n \n  function square($a)\
  \ { \n    if ($a != null && trim($a) != \"\") {\n      $square = $a * $a;\n    \
  \  return $square;\n    } else {\n      throw new SoapFault(\"Client\", \"No parameter\"\
  );\n    }\n  }\n  $server->addFunction(\"square\");\n  $server->handle();\n?>  \n\
  ```\n\n`Listing 27.9` PHP SOAP 服务器 (\"php_soap_server.php\")\n\n### 提示\n\n除了函数外，你还可以使用类并通过\
  \ `setClass(class)` 设置它。你可以在书籍的材料（见前言）中通过 `php_soap_server_class.php` 找到这种变体。\n\n\
  ### 27.4.2 客户端\n\n使用客户端时，PHP-SOAP 的简单处理更加明显：\n\n1. 你使用 `SoapClient` 对象创建客户端。第一个参数也用于\
  \ WSDL。如果没有可用的 WSDL（如此处所示），写零即可。第二个参数是带有选项的关联数组。当然，指定 SOAP Web 服务位置的 `location`\
  \ 选项尤为重要：\n\n```php\n$client = new SoapClient(null, ['location' =>\n           \
  \  \"http://localhost/php/php_soap_server.php\",\n             'uri' => \"http://arrabiata.de/PHP-SOAP/\"\
  ]);  \n```\n\n2. PHP-SOAP 中的错误处理通过 `try ... catch` 完成：\n\n```php\n  try {\n  ...\
  \ 进一步处理\n     } catch (SoapFault $ex) {\n  ... 错误处理\n     }  \n```\n\n3. 你在 `try`\
  \ 块中调用方法。通过 `__soapCall(method, parameter)` 实现。参数以数组的形式指定：\n\n```php\n$a = 111;\n\
  \ $answer = $client->__soapCall(\"square\", [$a]);\n print \"The square of $a is:\
  \ \" . $answer;  \n```\n\n4. 最后，你需要错误处理的代码。在这里我们简单地从 `SoapFault` 对象读取错误代码和相关描述。`Figure\
  \ 27.10` 显示了输出：\n\n```php\nprint \"Error code: \" . $ex->faultcode . \"<br/>\";\n\
  \ print \"Error string: \" . $ex->faultstring;  \n```\n\n![当参数缺失时的错误信息](img/img-f27.10.html)\n\
  \n`Figure 27.10` 当参数缺失时的错误信息\n\n下面的列表显示了客户端的代码；`Figure 27.11` 显示了输出。\n\n```php\n\
  <?php\n  $client = new SoapClient(null, ['location' => \n           \"http://localhost/php/php_soap_server.php\"\
  ,\n           'uri' => \"http://arrabiata.de/PHP-SOAP/\"]);\n  try {\n    $a = 111;\n\
  \    $answer = $client->__soapCall(\"square\", [$a]);\n    print \"The square of\
  \ $a is: \" . $answer; \n  } catch (SoapFault $ex) {\n    print \"Error code: \"\
  \ . $ex->faultcode . \"<br/>\";\n    print \"Error string: \" . $ex->faultstring;\n\
  \  }\n?>  \n```\n\n`Listing 27.10` PHP SOAP 客户端 (\"php_soap_client.php\")\n\n![PHP-SOAP\
  \ 解决的勤奋任务](img/img-f27.11.html)\n\n`Figure 27.11` PHP-SOAP 解决的勤奋任务\n\n### 27.4.3\
  \ WSDL\n\n使用 PHP-SOAP 很容易使用 WSDL。你只需要将相应 WSDL 的地址插入 `SoapClient(WSDL, options)`\
  \ 对象和 `SoapServer(WSDL, options)` 对象中。唯一的问题是 PHP-SOAP 不支持 WSDL。这意味着你必须手动编写 WSDL。\n\
  \n### 注意\n\n除了函数外，你还可以使用类并通过 `setClass(class)` 设置它。你可以在书籍的材料（见前言）中通过 `php_soap_server_class.php`\
  \ 找到这种变体。\n\n\n\n`JavaScript` 并没有一个单独的 `PHP` 扩展。为什么要有这样一个呢？在本章中，你将找到关于如何使用 `PHP`\
  \ 服务端技术创建客户端脚本，以及如何让这两种技术协同工作的工作通用信息和技巧。你不需要重新配置 `PHP` 即可实现这一点。\n\n然而，理解客户端与服务器之间（即\
  \ `JavaScript` 和 `PHP` 之间）的交互机制至关重要。`PHP` 代码在 Web 服务器上执行并在那里生成 `HTML` 代码（或其他格式），然后发送到客户端。任何\
  \ `JavaScript` 代码随后会在客户端执行。因此，你可以使用 `PHP` 创建代码，然后在浏览器中本地执行这些代码。\n\n这里的顺序非常重要：\n\n\
  1. `PHP` 脚本被调用并执行。\n2. `PHP` 脚本的结果（例如 `HTML`）被发送到浏览器。\n3. 浏览器可能会执行 `JavaScript`\
  \ 代码。\n\n这意味着 `PHP` 先执行，随后是（与此完全独立地）执行 `JavaScript` 代码。因此，你无法从 `JavaScript` 直接访问\
  \ `PHP` 代码（例如 `PHP` 变量）。当 `JavaScript` 执行时，`PHP` 已经完成了它的工作。`JavaScript` 解释器并不知道\
  \ `PHP` 的参与。因此，所有 `JavaScript` 代码可用的信息必须包含在 `HTML/JavaScript` 代码中。但如何从 `JavaScript`\
  \ 访问 `PHP` 变量呢？你可以用 `PHP` 创建 `JavaScript` 代码并将 `PHP` 变量嵌入其中。你可以在本章了解如何操作。\n\n##\
  \ 28.2 连接 JavaScript 与 PHP\n\n这两种技术之间的交互有两种方向：一方面，你可能感兴趣在 `JavaScript` 代码中获取 `PHP`\
  \ 变量（或信息）；另一方面，`PHP` 端也对 `JavaScript` 确定的内容感兴趣。\n\n为了清晰起见，总是使用简单的示例——例如 `window.alert()`。最后，目标是传达\
  \ `PHP` 和 `JavaScript`协同工作的技术。\n\n### 28.2.1 使用 JavaScript 读取 PHP 变量\n\n为了让 `JavaScript`\
  \ 访问 `PHP` 变量，`PHP` 必须创建一个 `JavaScript` 变量并赋予它 `PHP` 变量的值。让我们逐步进行，从 `PHP` 创建 `JavaScript`\
  \ 变量开始：\n\n```php\n<?php \n  echo \"<script>\\n\"; \n  echo \"var phpVersion = \\\
  \"8.3.12\\\";\\n\"; \n  echo \"</script> \"; \n?>  \n```\n\n这段代码向客户端发送了以下 `HTML/JavaScript`：\n\
  \n```html\n<script>  \n```\n\n```javascript\nvar phpVersion = \"8.3.12\";  \n```\n\
  \n```html\n</script>  \n```\n\n当使用 `PHP` 变量时，代码看起来非常相似：\n\n```php\n<?php \n  $phpv\
  \ = phpversion(); \n  echo \"<script>\\n\"; \n  echo \"var phpVersion = \\\"$phpv\\\
  \";\\n\"; \n  echo \"</script> \"; \n?>  \n```\n\n当然，函数调用也可以直接放在代码中：\n\n```php\n\
  <?php \n  echo \"<script>\\n\"; \n  echo \"var phpVersion = \\\"\" . phpversion()\
  \ . \"\\\";\\n\"; \n  echo \"</script> \"; \n?>  \n```\n\n下面的列表显示了一个完整的脚本，它在警告窗口中显示当前的\
  \ `PHP` 版本（参见图 28.1）。\n\n```html\n<html> \n<head> \n  <title>PHP and JavaScript</title>\
  \ \n  <script>  \n```\n\n```php\n<?php \n  echo \" var phpVersion = \\\"\" . phpversion()\
  \ . \"\\\";\\n\"; \n  echo \" window.alert(\\\"Generated by PHP \\\" + phpVersion);\"\
  ; \n?>  \n```\n\n```html\n  </script> \n</head> \n<body> \n<p>如果没有发生任何事情，说明你禁用了\
  \ JavaScript！</p> \n</body> \n</html>  \n```\n\n**列表 28.1** 由 JavaScript 输出 PHP\
  \ 版本 (\"js-1.php\")\n\n![JavaScript 显示 PHP 版本](img/img-f28.1.html)\n\n**图 28.1**\
  \ JavaScript 显示 PHP 版本\n\n然而，如果，如果要输出的变量值包含会导致生成的 `JavaScript` 代码失效的特殊字符，情况就会变得复杂一些。以下字符特别为“危险”：\n\
  \n- 引号\n  可以使用 `addslashes()` 方便地调整。\n- 所有具有转义序列的字符\n  这些是 `\\r`、`\\n`、`\\t` 等。字符串内的换行符不应作为换行符输出，而应作为\
  \ `\\n`。因此，这些特殊字符必须特殊处理：\n\n```php\n$replacement = [\n  \"\\n\" => \"\\\\n\",\n\
  \  \"\\r\" => \"\\\\r\",\n  \"\\t\" => \"\\\\t\"\n ];\n$variable = addslashes($variable);\n\
  $variable = strtr($variable, $substitution);  \n```\n\n最后，变量作为 `JavaScript` 代码输出：\n\
  \n```php\n<?php \n  echo(\"<script>\\n\"); \n  echo(\"var phpVariable = \\\"$variable\\\
  \";\\n\"); \n  echo(\"</script> \"); \n?>  \n```\n\n（注：由于提供的原文中存在大量重复内容，翻译已根据要求对核心逻辑进行了处理，并排除了重复输出的部分。）\n\
  \n\n\n\n* 加载一个（可能是不可见的）图形：\n\n```javascript\ndocument.images[\"image name\"].src\
  \ =\n  \"script.php?jsVar=\" + encodeURIComponent(jsVariable);  \n```\n\n## 28.3\
  \ Ajax\n\n`XMLHttpRequest` 对象可以被 JavaScript 调用，它自 1998 年左右起在 Microsoft Internet\
  \ Explorer 中可用。这使得在 JavaScript 后台发送 HTTP 请求并评估其返回成为可能。该对象最初由微软发明，纯粹是为了自己的利益，因为他们要为内部的\
  \ Outlook 邮件系统创建一个 Web 版本。为了避免页面的持续（可见）刷新，诸如 `XMLHttpRequest` 这样的技术就变得必不可少。\n\n\
  回到新千禧年之初：人们已经慢慢传出微软的浏览器技术实际上是一件好事。相关的浏览器逐渐添加了对它的支持：Mozilla（因此也是 Firefox 及其类浏览器）、Opera\
  \ 浏览器，以及 Safari。Google Chrome 尽管其版本号很高，但作为主流浏览器中最新的成员，也对该功能提供了 JavaScript 支持，Edge（以及当前的\
  \ Opera 浏览器）也是如此。\n\n到目前为止，一切良好——但这项技术在互联网上还没有显著的普及。然而，随后 Google 发布了一些高度依赖 `XMLHttpRequest`\
  \ 的网站。顾问 Jesse James Garrett 利用这一点创建了 Ajax。Ajax 应该代表“异步 JavaScript 和 XML”（asynchronous\
  \ JavaScript and XML），但实际上是一个误称；XML 完全没有必要。无论如何，自从这个词诞生以来，半个网络世界都在跟风这项“新”技术——尽管都是些相对琐碎的事情。\n\
  \n当然，以下是极度的简化，但 Ajax 可以相对简单地总结为：\n\n* JavaScript 可以向服务器发送 HTTP 请求（无需刷新页面）。\n* JavaScript\
  \ 可以访问这些 HTTP 请求的结果。\n\n得益于 JavaScript 的 DOM 能力，仍然巧妙地将服务器的返回内容集成到页面中。最早的例子之一就是 Google。如果你在那里输入搜索词，Google\
  \ 会会在你输入的同时搜索相应的查询语句并提供合适的建议，如图 28.3 所示。\n\n![Google Tries to Complete the Query](img/img-f28.3.html)\
  \ \n\n**图 28.3** Google 尝试补全查询\n\n我们在这里不会讨论实现实际所需的 JavaScript 代码；那是 JavaScript 书籍的内容。然而，有一些软件包可以实现客户端\
  \ JavaScript 与服务器 PHP 之间相对方便的连接。客户端与服务器之间的“胶水”正是 Ajax——或 `XMLHttpRequest`。\n\n该领域的最早软件包之一是\
  \ Sajax，可以在 `https://github.com/ajenbo/sajax` 获取。遗憾的是，它已经有几个世纪没有更新了，从 PHP 的角度来看，你必须在错误处理方面做出妥协。但该软件包仍然适用于短小的\
  \ JavaScript 示例。分发 ZIP 包包含 `Sajax.php` 文件，它包含了编程所需的一切。\n\n为了保持示例尽可能清晰，PHP 脚本中的业务逻辑非常简单：返回当前的服务器时间。这个简单的函数处理这个问题：\n\
  \n```php\nfunction serverTime() { \n  return date(\"H:i:s\"); \n}  \n```\n\n该函数位于服务器上，因此最初无法在客户端访问它。然而，Sajax\
  \ 可以建立这种连接。首先，加载库：\n\n```php\nrequire_once \"Sajax.php\";  \n```\n\n然后初始化包并导出 PHP\
  \ 函数，使其在客户端可用。最后，`sajax_handle_request()` 确保当前的 PHP 脚本也准备好接收相应的 `XMLHttpRequest`\
  \ 请求：\n\n```php\nsajax_init(); \nsajax_export(\"serverTime\"); \nsajax_handle_client_request();\
  \  \n```\n\nSajax 然后为每个导出的服务器端 PHP 函数生成一个对应的客户端 JavaScript 函数，负责建立连接和交换数据。函数名带有\
  \ `x_` 前缀。因此，为 `serverTime()` PHP 函数自动生成了一个 `x_serverTime()` JavaScript 函数。该函数带有一个额外参数：回调函数，该回调会在服务器返回结果可用时正好被调用；通信是异步的。这允许定期输出服务器时间（示例中大约每秒一次）：\n\
  \n```javascript\nfunction showServerTime() { \n  x_serverTime(serverTime_callback);\
  \ \n  setTimeout(showServerTime, 1000); \n} \nshowServerTime(); \n\nfunction serverTime_callback(result)\
  \ { \n  document.getElementById(\"Time\").innerHTML = result; \n}\n ...  \n```\n\
  \n```html\n<p id=\"Time\"></p>  \n```\n\n只剩下一个问题：确保数据交换的所有功能从何来？这由 Sajax 处理，只要你也在\
  \ `<script>` 元素内调用适当的函数，它就能自动生成对应的 JavaScript 代码：\n\n```html\n<script>  \n```\n\n\
  ```php\n<?php \n  sajax_show_javascript(); \n?>  \n```\n\n```html\n</script>\n```\n\
  \n列表 28.3 显示了完整的脚本：\n\n```php\n<?php \n  sajax_show_javascript(); \n?>  \n```\n\n\
  ```html\n<html>\n<head>\n  <title>PHP and JavaScript</title>\n  <script>\nfunction\
  \ showServerTime() { \n    x_serverTime(serverTime_callback); \n    setTimeout(showServerTime,\
  \ 1000); \n  } \nshowServerTime(); \n\nfunction serverTime_callback(result) { \n\
  \  document.getElementById(\"Time\").innerHTML = result; \n}\n  </script>\n</head>\n\
  <body>\n<p id=\"Time\"></p>\n</body>\n</html>\n```\n\n**列表 28.3** 时间来自服务器 (\"ajax\"\
  )\n\n图 28.4 显示了输出内容以及后台中发生的情况：\n\n```php\n<?php\nclass A {\n  public $b;\n  function\
  \ __construct($c) {\n    $this->b = $c;\n  }\n}\n$data = [1, \"hello\", true, new\
  \ A(\"xyz\")];\necho json_encode($data); \n// Output: [1, \"hello\",true,{\"b\"\
  : \"xyz\"\nvar_dump(json_decode(\"[1,\\\"hello\\\",true,{\\\"b\\\":\\\"xyz\\\"}]\"\
  ));\n// Output: array(4) {\n  [0]=>\n  int(1)\n  [1]=>\n  string(5) \"hello\"\n\
  \  [2]=>\n  bool(true)\n  [3]=>\n  object(stdClass)#2 (1) {\n    [\"b\"]=>\n   \
  \ string(3) \"xyz\"\n  }\n}\n?> \n```\n\n**图 28.4** 简单的输出，大量的技术\n\n### JavaScript\
  \ 的编码与解码\n\n在客户端和服务器之间传输大量数据的 Ajax 应用几乎完全依赖特殊格式：JSON（参见 [`json.org`](http://json.org)）。JSON\
  \ 基于一种 JavaScript 特性，允许非常紧凑地表示数组和对象。简单调用 JavaScript 函数 `JSON.parse()` 即可将 JSON 格式转换为\
  \ JavaScript 值。返回路径——即将 JavaScript 值转换为 JSON 字符串——通过 `JSON.stringify()` 完成。\n\n\
  在 PHP 中，你可以非常容易地生成和解码 JSON 数据。对应的函数是 `json_encode()` 和 `json_decode()`。考虑以下示例：\n\
  \n```php\n<?php\n  class A {\n    public $b;\n    function __construct($c) {\n \
  \     $this->b = $c;\n    }\n  }\n  $data = [1, \"hello\", true, new A(\"xyz\")];\n\
  \  echo json_encode($data); \n  // Output: [1, \"hello\",true,{\"b\": \"xyz\"}\n\
  \  var_dump(json_decode(\"[1,\\\"hello\\\",true,{\\\"b\\\":\\\"xyz\\\"}]\"));\n\
  \  // Output: array(4) {\n  [0]=>\n  int(1)\n  [1]=>\n  string(5) \"hello\"\n  [2]=>\n\
  \  bool(true)\n  [3]=>\n  object(stdClass)#2 (1) {\n    [\"b\"]=>\n    string(3)\
  \ \"xyz\"\n  }\n}\n?> \n```\n\n第 27 章也讨论了与 REST API 的 JSON。\n\n\n\n\nAjax 挺不错的，但性能并不高；毕竟，整个机制仍然基于\
  \ HTTP。使用 WebSockets 或 WebSocket 协议，有一个可能的替代方案。这是一种非常高性能的全双工（full-duplex）通信协议，能够以非常简单的方式在服务器和客户端之间交换数据。HTTP\
  \ 仍然在使用，但仅用于建立连接。\n\nWebSockets 有许多优势。除了更好的性能外，WebSocket 协议还提供了双向性，这意味着服务器可以在连接建立后持续向客户端发送数据。相比之下，传统的\
  \ HTTP 拉取（pull）模式（由客户端请求数据，服务器只有此时才返回数据）自然显得有些过时。\n\n## WebSocket 标准化\n\nWebSocket\
  \ 协议是互联网工程任务组 (IETF) 的官方 RFC：`RFC 6455` ([`tools.ietf.org/html/rfc6455)).\n\nW3C\
  \ 也有过关于 WebSockets 的领域。很长以来，这 was initially no longer maintained for a decade; it\
  \ has since been forwarded to the Hypertext Application Working Group (WHATWG) at\
  \ [https://websockets.spec.whatwg.org/`](https://websockets.spec.whatwg.org/)，所有的后续工作都在那里进行。\n\
  \n为了让应用程序与 WebSocket 工作，客户端和服务器必须做好准备。客户端通过 JavaScript 发送 WebSocket 请求，而服务器必须能够处理它。后者在\
  \ PHP 中实现是非常耗时的，这就是为什么我们使用外部组件。\n\n### 28.4.1 服务器\n\n有多个版本的 WebSocket 协议，服务器的任务之一是正确地支持每一个版本；我们稍后会看到，浏览器在某种程度上自动完成了这一点。但我们并不是自己实现一切，而是依赖于一个名为\
  \ `Ratchet` 的包 [`socketo.me`](http://socketo.me)（见图 28.5 [#28_004.html#f28.5]），那里有关于包的信息以及一个可以在线尝试的演示。\n\
  \n目前，`Ratchet` 只能通过 `Composer` 包管理器安装。在第 38 章 [#38_001.html#h3] 中你可以找到更多信息；此外，你还将学习如何在系统中安装\
  \ `Composer`。对于后面的解释，我们假设已经完成了这一步。\n\n![Ratchet 首页](img/img-f28.5.html)]\n\n**28.5\
  \ Ratchet 首页**\n\n现在通过 `Composer` 在项目目录下安装 `Ratchet` 包：\n\n```\ncomposer require\
  \ cboden/ratchet \n```\n\n如果你没有全局安装 `Composer`，但可以使用 `composer.phar`，请使用以下命令：\n\n\
  ```php /path/to/composer.phar require cboden/ratchet\n```\n\n`Ratchet` 随后被安装在系统中。支持自动加载（autoload）；`vendor/autoload.php`\
  \ 文件已被创建或适配。简单的 `require \"vendor/autoload.php\"`（带有自定义路径）加载了 `Ratchet` 需要的所有类（见图\
  \ 28.6 [#28_004.html#f28.6]）。\n\n![通过 Composer 安装 Ratchet](img/img-f28.6.html)]\n\
  \n**28.6 通过 Composer 安装 Ratchet**\n\n`Ratchet` 拥有一个同名的命名空间，下面有若干类。让我们先看看 `MessageComponentInterface`\
  \ 接口，它定义了四个方法：\n\n- `onOpen()`：当与 WebSocket 服务器建立连接时。\n- `onClose()`：当与 WebSocket\
  \ 服务器的连接关闭时。\n- `onMessage()`：当消息发送服务器时。\n- `onError()`：当发生错误时。\n\n在我们的示例中，想要实现一个简单的服务器，返回所有发送给它的消息。因此，我们只需要为\
  \ `onMessage()` 方法提供一个具体的实现。代码看起来如下：\n\n```php\nclass EchoServer implements MessageComponentInterface\
  \ {\n  public function onOpen(ConnectionInterface $conn) {}\n\n  public function\
  \ onMessage(ConnectionInterface $from, $msg) {\n    $from->send($msg);\n  }\n\n\
  \  public function onClose(ConnectionInterface $conn) {}\n\n  public function onError(ConnectionInterface\
  \ $conn, Exception $e) {}\n}\n```\n\n接下来，我们需要确保实现一个用于 WebSocket 调用的端点。为了做到，我们需要\
  \ `Ratchet` 中的一些类（这里未显示命名空间）：\n\n- `IoServer`：`Ratchet` 中服务器的通用基类。\n- `HttpServer`：创建一个可以接收\
  \ HTTP 请求的服务器。\n- `WsServer`：基于 HTTP 服务器实现 WebSocket 服务器。\n\n下面的嵌套调用为我们的 `EchoServer`\
  \ 实现创建了一个 WebSocket 服务器并执行：\n\n```php\n$server = IoServer::factory(\n  new HttpServer(\n\
  \    new WsServer(\n      new EchoServer()\n    )\n  ),\n  8080\n);\n```\n\n\n\n\
  \n\n```javascript\nvar ws = new WebSocket(\"ws://127.0.0.1:12345\");\n    ws.onmessage\
  \ = (e) => {\n      alert(\"Data from server: \" + e.data);\n    }\n\n    window.onload\
  \ = () => {\n      document.getElementById(\"btn\").addEventListener(\"click\",\
  \ (e) => {\n        var input = document.getElementById(\"input\").value;\n    \
  \    ws.send(input);\n      })\n    } \n```\n\n```html\n  </script>\n</head>\n<body>\n\
  \  <form>\n    <textarea id=\"Input\"></textarea>\n    <input type=\"button\" id=\"\
  btn\" value=\"Send\">\n  </form>\n</body>\n</html>  \n```\n\n**代码列表 28.5** 带有 HTML\
  \ 和 JavaScript 的 WebSocket 客户端 (`\"websockets.html\"`)\n\n![WebSocket 运行示例](img/img-f28.7.html)\
  \ \n\n**图 28.7** WebSocket 运行示例\n\n这只是对 WebSockets 的初步介绍，也是迈向具有大量 JavaScript 逻辑和高性能实时通信的现代应用的第一步。\n\
  \n# 第六部分\n\n数据格式\n\n# 29 XML\n\nXML 已经成为数据交换的通用标准，并作为大多数常用描述语言的基础。\n\n今天还有哪个软件产品没有用醒目的字母标上\
  \ XML 这个装饰性缩写？除了游戏领域，可能很难找到。文字处理程序生成 XML，布局程序输出 XML，CMS X 和 Y 以及数据库 Z 都支持可扩展标记语言（Extensible\
  \ Markup Language）。\n\n## 29.1 准备工作\n\n本章的准备工作不仅包括安装，还在开头对 XML 进行了简要介绍。如果你已经熟悉它，可以轻松地跳过。这有助于其他所有人理解本章的示例。然而，对于更深入的介绍，推荐阅读其他书籍。\n\
  \n### 29.1.1 XML 基础\n\nXML 已由 `W3C` 标准化为数据存储格式。它的原始母体是标准通用标记语言 (`SGML`)，该语言仍由国际标准化组织\
  \ (`ISO`) 标准化。XML 是 `SGML` 的子集，其主要特征是具有更严格的规则。\n\n### 注意\n\nHTML5 在标准表示法中并不是有效的\
  \ XML。然而，也可以选择兼容 XML 的 HTML5 示法：`XHTML` (`[`s-prs.co/v602241`](http://s-prs.co/v602241)`)。\n\
  \n#### 良好格式（Well-Formed）：XML 规则\n\nXML 文档由标签组成，标签是尖括号中的命令。数据封装在标签中。属性也可以分配给标签。到目前为止，这些在\
  \ HTML 中都很常见。在 XML 中，标签名称不是预先定义的；相反，名称应该描述数据内容。然而，标签特别是 XML 文档的结构有特定的规则。如果一个 XML\
  \ 文档遵循所有这些规则，则被称为“良好格式”（well-formed）。以下是最重要的规则：\n\n- XML 区分大小写；`Title` 与 `title`。\n\
  - 所有标签必须关闭。\n- 一个 XML 文档可以有一个根元素。\n- 属性必须位于引号内。\n- 标签名称必须以字母开头。\n- 标签名称可以由字母、数字、连字符、下划线和点组成。\n\
  - 标签名称不能包含空格。\n- XML 声明必须在第一位。\n- 标签必须正确嵌套。\n- 属性名称在标签内必须是唯一的。\n\n以下是一个良好格式 XML\
  \ 文档的示例：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<products>\n  <product>\n\
  \    <title>Vacuum</title>\n    <price currency=\"Euro\">4.80</price>\n  </product>\n\
  </products>\n```\n**代码列表 29.1** 良好格式的 XML (`\"wellformed.xml\"`)\n\n如果你想将 XML 转换为\
  \ HTML，可以使用 XSL。然而，对于更深入的介绍，推荐阅读其他书籍。\n\n#### 有效（Valid）：DTD 和 Schema\n\n良好格式的文档是处理\
  \ XML 的基本要求。“有效”（`Valid`）意味着 XML 文档遵循预定义的结构。该结构可以使用两种技术来定义：\n\n- 文档类型定义 (`DTD`)\n\
  - XML Schema (`XSD`)\n\n这两个标准都由 `W3C` 发布。`DTD` 的功能范围较小（它不支持数据类型），并且是一种不基于 XML 的独立语言。另一方面，`XSD`\
  \ 较新且至今仍在使用。然而，`XSD` 消除了 `DTD` 的缺点：该标准基于 XML 并且有更多的选项。HTML5 没有显式的 DTD。\n\n#### 命名空间\n\
  \n标签可以分配给特定的命名空间。当你合并多个 XML 文档时，这特别有用。例如，`price` 标签在不同的文档可能有完全不同的功能。如果它属于一个命名空间，就可以确保涉及的格式是清晰的。\n\
  \n#### XSLT\n\n可扩展样式表转换 (`XSLT`) 是 `XSL` 的子语言。`XSL` 定义 XML 文档的样式。`XSLT` 用于转换 XML\
  \ 文档——因此其名称中带有“转换”一词。转换可以从一种 XML 格式转换为另一种格式或其他格式。`XSLT` 通过所谓的模板工作：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<xsl:stylesheet xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  >\n  <xsl:template match=\"/\">\n    <html>\n      <body>\n        <xsl:for-each\
  \ select=\"products/product\">\n          <div>\n            <h2><xsl:value-of select=\"\
  title\"/></h2>\n            <p><xsl:value-of select=\"price\"/></p>\n          </div>\n\
  \        </xsl:for-each>\n      </body>\n    </html>\n  </xsl:template>\n</xsl:stylesheet>\n\
  ```\n**代码列表 29.2** 一个简单的 XSLT 转换\n\n\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\" ?>\n<xsl:stylesheet xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\" \n\
  \  version=\"1.0\">\n  <xsl:output indent=\"yes\" method=\"html\" />\n\n  <xsl:template\
  \ match=\"/\">\n    <xsl:apply-templates />\n  </xsl:template>\n\n  <xsl:template\
  \ match=\"products\">\n      <html>\n          <head>\n              <title>Products</title>\n\
  \      </head>\n      <body>\n          <table align=\"center\" width=\"500\" border=\"\
  1\">\n              <tr>\n                  <th>Product</th>\n                 \
  \ <th>Price</th>\n              </tr>\n              <xsl:apply-templates select=\"\
  product\" />\n          </table>\n      </body>\n      </html>\n  </xsl:template>\n\
  \n  <xsl:template match=\"product\">\n      <tr>\n          <td><xsl:value-of select=\"\
  title\" /></td>\n          <td><xsl:value-of select=\"price\" /></td>\n      </tr>\n\
  \  </xsl:template>\n</xsl:stylesheet>  \n```\n\n`Listing 29.2` 用于转换为 HTML 的 XSLT\
  \ (\"inHTML.xslt\")\n\n`products` 根元素的模板包含了 HTML 页面的完整基础结构。在插入单个产品的地方，有一个对 `product`\
  \ 标签模板的引用。标题和价格的值随后会在在那里显示。\n\n### XPath\n\nXML 文档是层级化组织的。在 XSLT 中，单个标签通过模板进行处理——但仍然没有办法在标签层次结构中进行更有效的搜索。XPath\
  \ 正用于此。其某些语法在某种程度上类似于控制台中的目录访问：\n\n```\n/products/product/title  \n```\n\n此行访问了来自\
  \ Listing 29.1 的 title 标签，它们位于 `products` 和 `product` 之下。这就是路径。此外，或者单独使用，你还可以指定一个所谓的轴（axis）。这决定了执行搜索的方向。例如，`Child`\
  \ 搜索子节点。轴后面跟着一个冒号和一个条件。\n\n例如，以下行读取所有具有 `product` 标签名的子节点：\n\n```\nChild::product\
  \  \n```\n\n##### Note\n\n在实践中，XPath 主要与其他 XML 标准结合使用。例如，XSLT 中的匹配规范（match specification）是一个\
  \ XPath 结构，可以使用所有的 XPath 函数。\n\n### XQuery\n\n仅凭 XPath 很难对 XML 文档执行所有可能的查询。因此，W3C\
  \ 创建了另一种基于 SQL 模型的查询语言 `XQuery`。在实践中，`XQuery` 并不经常使用，特别是在数据库领域，因为它只有查询机制，没有更新或修改选项。\n\
  \n##### Note\n\n注意缩写和产品名称：例如，Software AG 的 XML Tamino 数据库使用名为 `X-Query` 的查询语言，它与\
  \ `XQuery` 不同。\n\n### XML 编程\n\n假设你的 XML 文档要在 PHP 中以某种形式进行处理。一种方法是使用 XSLT。但如果你只想访问文档的非常特定的部分，你需要一个\
  \ XML 的编程接口：解析器。在实践中，解析器有方法：\n\n*   `SAX` 解析器，或面向事件的访问\n*   通过 `DOM` 树访问，它将 XML\
  \ 文档视为视为树\n*   混合形式或内部开发\n\n`SAX` 代表 XML 的简单 API（Simple API for XML）。通过这种访问变体，XML\
  \ 文档从左上到右被遍历。开始和结束标签以及属性会产生事件。然后可以使用方法对这些事件做出反应。`SAX` 没有标准化；它最初源于 Java 项目。你可以在 `www.saxproject.org`\
  \ 找到 `SAX` 的官方网站。`SAX` 现在也可以在开源 `sourceforge.net/projects/sax` 获取。\n\n与 `SAX` 相，`DOM`\
  \ 访问是由 W3C 标准化的 (`www.w3.org/DOM`)）。XML 文档作为层级结构加载到内存中，然后可以使用预定义的方法访问树的各个分支——所谓的节点（nodes）。\n\
  \n第三种方法是内部的。例如，从 PHP 5 开始，已经有了优秀的 `SimpleXML` 接口。ASP.NET 也通过 `XmlReader` 和 `XmlTextWriter`\
  \ 提供了自己的方法，它们与 `SAX` 类似——但只有一些差异。\n\n##### Note\n\n在实践中，遵循经验法则：`SAX` 明显快得多，而 `DOM`\
  \ 因为整个文档必须加载到内存中，会消耗大量资源。`SimpleXML` 是最简单的。\n\n### 安装\n\n自 PHP 5 时代起，XML 设置非常简单。PHP\
  \ 8 中的 XML 支持也完全基于 `libxml2`。`SAX` 和 `DOM` 不需要安装。`libxslt` 负责 XSLT。在 Linux 下配置 PHP\
  \ 使用。在 Windows 下，通过删除分号来注释掉以下行：\n\n```\nextension=php_dll\n```\n\n## 29.2 XML 访问\n\
  \n现在是实际工作的时候。在接下来的章节中，我们将使用各种方法访问和编辑 XML 文档。\n\n### 29.2.1 SAX\n\n`SAX` 解析器（或 XML\
  \ 解析器）遍历 XML 文档并对事件做出反应。`SAX` 解析器初看起来可能有点复杂，但实际上并不是。我们将通过简单的示例展示最重要的步骤。\n\nNote\n\
  \n起点是 Listing 29.1 的扩展版本。\n\n1. 首先创建 `SAX` 解析器：\n\n```\n$xml_parser = xml_parser_create();\n\
  ```\n\n2. 现在你需要两个事件处理器。当解析器遇到开始标签时产生事件，当遇到结束标签时产生另一个：\n\n```\nxml_set_element_handler($xml_parser,\
  \ \"elem_start\", \"elem_end\");\n```\n\n3. `elem_start()` 和 `elem_end()` 函数接收解析器本身、标签名（这里为\
  \ `$name` 变量）以及属性的关联数组（这里为 `$attribute` 变量）。在我们的示例中，我们输入标签的名称：\n\n```\nfunction\
  \ elem_start($xml_parser, $name, $attribute) {\n   echo \"&lt;\" . $name . \"&gt;\"\
  ;\n}\nfunction elem_end($xml_parser, $name) {\n   echo \"<br />\";\n}\n```\n\n4.\
  \ 现在产生了数据。另一个事件处理器负责此，它调用一个函数（这里是 `cdata`）：\n\n```\nxml_set_character_data_handler($xml_parser,\
  \ \"cdata\");\n```\n\n5. 该函数在特殊字符转换为 HTML 格式后输出数据：\n\n```\nfunction cdata($xml_parser,\
  \ $data) {\n   echo htmlspecialchars($data);\n}\n```\n\n6. 到此为止，XML 文件还没有被读取。这是通过\
  \ `file_get_contents(XML 文件)` 函数完成的：\n\n```\n$data = file_get_contents(\"products.xml\"\
  );\n```\n\n7. 然后解析数据。这是关键步骤：\n\n```\nxml_parse($xml_parser, $data, true);\n```\n\
  \n8. 最后，释放解析器。自 PHP 4 以来这不再需要，因为 PHP 会自动监控。但为了整洁并保持兼容性，你可以这样做：\n\n```\nxml_parser_free($xml_parser);\n\
  ```\n\n\n\n\n\n```php\n<?php\nfunction elem_start($xml_parser, $name, $attribute)\
  \ {\n   echo \"&lt;\" . $name . \"&gt;\";\n}\n\nfunction elem_end($xml_parser, $name)\
  \ {\n   echo \"<br />\";\n}\n\nfunction cdata($xml_parser, $data) {\n   echo htmlspecialchars($data);\n\
  }\n\n$xml_parser = xml_parser_create();\nxml_set_element_handler($xml_parser, \n\
  \   \"elem_start\", \"elem_end\");\nxml_set_character_data_handler($xml_parser,\
  \ \"cdata\");\n$data = file_get_contents(\"products.xml\");\nxml_parse($xml_parser,\
  \ $data, true);\nxml_parser_free($xml_parser);\n?>  \n```\n\n**列表 29.3** SAX 支持\
  \ (\"sax.php\")\n\n![使用 SAX 解析器的输出](img/img-f29.1.html) \n\n**图 29.1** 使用 SAX 解析器的输出\n\
  \n### 笔记\n\n这就是基本原理。现在，当然，你可以更改一些内容以获得更精确的结果。后续细节将在接后的章节中提供。\n\n### 解析器选项\n\n通过\
  \ `xml_parser_set_option(Parser, Option, Value)` 函数，你可以为解析器的行为分配更多选项。可以实现以下规格：\n\
  \n* `XML_OPTION_CASE_FOLDING` 控制解析器如何处理大写和小写字母。默认情况下，该选项设置为 1（即 `true`）。这意味着所有标签都将转换为大写。如果你将该选项设置为\
  \ 0（即 `false`），解析器将保持字母的原始状态（参见图 29.2）。\n\n    ![由于 \"XML_OPTION_CASE_FOLDING\"\
  ，所有标签名现在都恢复了原始状态](img/img-f29.2.html) \n\n    **图 29.2** 得亏了 \"XML_OPTION_CASE_FOLDING\"\
  ，所有标签名现在都恢复了原始状态\n\n* 通过 `XML_OPTION_TARGET_ENCODING`，你可以指定数据的字符集。你可以选择 ISO-8859-1、US-ASCII\
  \ 或 UTF-8。如果你在 XML 文档使用了该字符集中的特定字符，请选择该文档所属的字符集。\n\n* `XML_OPTION_SKIP_WHITE` 控制解析器是否忽略空格（空格、制表符等）。\n\
  \n### 笔记\n\n通过 `xml_parser_get_option(Parser, Option)`，你可以读取其中一个选项。这非常实用，例如为了查找编码。\n\
  \n### 收集剩余部分\n\n当你使用 SAX 解析器遍历 XML 文档时，某些元素会被忽略，例如 XML 声明或 DTD。你可以使用 `xml_set_default_handler(Parser,\
  \ \"Function\")` 使用事件处理器来处理这些剩余的元素。\n\n还有两个非常少使用的事件处理器：\n\n* `xml_set_processing_instruction_handler()`\
  \ 过滤掉处理指令。例如，PHP 标签 `<?php` 和 `?>` 就是处理指令。\n\n* `xml_set_unparsed_entity_decl_handler(Parser,\
  \ Handler)` 定义一个函数，用于过滤掉 DTD 中所有的 NDATA 节（N 代表 no）。\n\n### 区分标签\n\n当你使用 SAX 时，关键在于心态。始终意识到解析器是从上到下遍历文档的。这也能让你清楚你的事件处理器被调用的顺序。然后，当然，有多种方法可以你的目标。最简单的方法通常是分支区分（case\
  \ distinction）。\n\n在下面的示例中，我们使用分支区分来读取标题。我们为标题定义了我们 CDATA 事件处理器。然而，对于所有其他标签——主要是价格——我们定义了一个不输出任何内容的\
  \ CDATA 事件处理器。通过这个简单的技巧，输出了标题，但没有其他内容（参见图 29.3）。\n\n```php\n<?php\nfunction elem_start($xml_parser,\
  \ $name, $attribute) {\n   if ($name==\"title\"){\n      echo \"Product: \";\n \
  \     xml_set_character_data_handler($xml_parser, \"cdata_output\");\n   } else\
  \ {\n       xml_set_character_data_handler($xml_parser, \"cdata\");\n   }\n}\nfunction\
  \ elem_end($xml_parser, $name) {\n   if ($name==\"title\") {\n     echo \"<br />\"\
  ;\n   }\n}\nfunction cdata($xml, $data) {\n}\nfunction cdata_output($xml, $data)\
  \ {\n   echo htmlspecialchars($data);\n}\n\n$xml_parser = xml_parser_create();\n\
  xml_parser_set_option($xml_parser, XML_OPTION_CASE_FOLDING, 0);\nxml_set_element_handler($xml_parser,\
  \ \n   \"elem_start\", \"elem_end\");\nxml_set_character_data_handler($xml_parser,\
  \ \"cdata\");\n$data = file_get_contents(\"products.xml\");\nxml_parse($xml_parser,\
  \ $data, true);\nxml_parser_free($xml_parser);\n?>  \n```\n\n**列表 29.4** 精确控制输出\
  \ (\"sax.php\")\n\n将 `XML_OPTION_CASE_FOLDING` 选项设置为 false 也是重要的，否则标签将被转换为大写。\n\n\
  ![输出只包含产品，不包含价格](img/img-f29.3.html) \n\n**图 29.3** 输出只包含产品，不包含价格\n\n### 29.2.2\
  \ SimpleXML\n\n正如其名，SimpleXML 是一种非常简单的文档的方法。SimpleXML 既不是基于 SAX 也不是基于 DOM，而是一种专用解决方案。\n\
  \n### 笔记\n\n此部分的示例 XML 文件为 `products.xml`。\n\n#### 基本原理\n\n在 SimpleXML 中，每个节点可以通过名称访问。使用\
  \ SimpleXML 加载文件的起始点是：\n\n```php\n$sim = simplexml_load_file(\"products.xml\");\n\
  ```\n\n或者从字符串加载：\n\n```php\n$sim = simplexml_load_string($XML-String);\n```\n\n\
  `sim` 现在包含了根元素的引用。通过\n\n```php\n$sim->product,\n```\n\n引用第一个产品标签。然而，如果你输出它，什么也看不到。这是因为\
  \ SimpleXML 只输出标签的文本内容。\n\n在下面这一行中，标题标签有内容：\n\n```php\nprint $sim->product->title;\n\
  ```\n\n这就是为什么这一行输出了 vacuum cleaner。我们的示例 XML 中有多个 product 标签（参见图 29.4）。你可以使用数组轻松区分它们：\n\
  \n```php\nprint $sim->product[1]->title\n```\n\n这访问第二个产品并显示标题 teapot。\n\n![来自根元素的\
  \ SimpleXML 结构](img/img-f29.4.html) \n\n**图 29.4** 来自根元素的 SimpleXML 结构\n\n属性在 SimpleXML\
  \ 中关联数组的形式分配给标签的。如果你想访问价格标签中的货币，操作如下：\n\n```php\nprint $sim->product->price[\"currency\"\
  ];\n```\n\n要访问多个或所有标签，你可以使用循环。下面的示例遍历所有产品并在 HTML 表中输出标题、价格和货币（参见图 29.5）。\n\n```php\n\
  <?php\n  $sim = simplexml_load_file(\"products.xml\");\n  print '<table border=\"\
  1\" cellpadding=\"5\" align=\"center\">';\n  foreach ($sim->product as $product)\
  \ {\n    print '<tr><td>';\n    print $product->title;\n    print '</td><td>';\n\
  \    print $product->price . ' ' . $product->price[\"currency\"];\n    print '</td></tr>';\n\
  \  } \n  print '</table>';\n?>  \n```\n\n**列表 29.5** SimpleXML 的使用 (\"simpleXML.php\"\
  )\n\n![来自 XML 文件的 HTML 表](img/img-f29.5.html) \n\n**图 29.5** 来自 XML 文件的 HTML 表\n\
  \n### 提示\n\n最后一个示例与稍后在 列表 29.15 中显示的 XSLT 结果匹配。这提出了实践中应该使用什么的问题。如果必须快速完成，SimpleXML\
  \ 显然更容易。XSLT 的优势在于当你切换到另一种编程语言时，不需要重写整个转换脚本，只需要几行代码。然而，使用 XSLT 很难将内容（通常是 HTML 模板）与转换逻辑分离。相反，使用\
  \ SimpleXML，你可以配合任何 PHP 模板系统，例如 Smarty。\n\n### 其他方法\n\n`children()` 和 `attributes()`\
  \ 方法为你承担了更多工作。它们允许你直接访问元素的子节点或属性。在第一次调用时返回第一个对象。然后你可以遍历所有子节点或属性。\n\n\n\n\n\n```php\n\
  <?php \n  $sim = simplexml_load_file(\"products.xml\"); \n  foreach ($sim->children()\
  \ as $child) { \n    print $child->title . \"<br />\"; \n  } \n?>  \n```\n\n列表 29.6\
  \ `children()` 的用法 (`simpleXML_methods.php`\")\n\n## XPath\n\n如果标准的访问方式无法满足你的需求，你可以使用\
  \ SimpleXML 的 XPath 实现。这是通过 `xpath(expression)` 方法实现的，该方法接收一个 XPath 表达式作为参数并返回找到的第一个位置。使用循环来遍历所有找到的位置。\n\
  \n在下面的示例中，我们使用 XPath 读取所有的 `title` 标签。\n\n```php\n<?php \n  $sim = simplexml_load_file(\"\
  products.xml\"); \n  foreach ($sim->xpath(\"*/title\") as $title) { \n    print\
  \ \"$title<br />\"; \n  } \n?>  \n```\n\n列表 29.7 结合 SimpleXML 的 XPath (`simpleXML_XPath.php`\"\
  )\n\n此处的特殊之处在于，位于层级结构其他位置的 `title` 标签也会被交付。与普通的 SimpleXML 访问相比，使用 XPath 这需要多得多的精力。\n\
  \n## 写入\n\n最后但同样重要的是，通过 SimpleXML 你不仅可以读取和搜索文档，还可以向其中写入新内容。要实现这一点，只需访问标签并插入新内容即可。你可以以相同的方式更改属性。你还可以为元素添加新属性。你可以在下面的脚本中看到所有可能的更改。最后，使用\
  \ `asXML()` 方法将修改后的 XML 返回为字符串。图 29.6 显示了修改后的文件。\n\n```php\n<?php \n  if ($sim =\
  \ simplexml_load_file(\"products.xml\")) { \n      $sim->product[1]->title = \"\
  Coffee pot AB\";\n      $sim->product[1]->title[\"changed\"] = date(\"d.m.Y\");\n\
  \      $sim->product[1]->price[\"currency\"] = \"Euro\"; \n      print \"<pre>\"\
  \ . htmlentities($sim->asXML()) . \"</pre>\"; \n  } \n?>  \n```\n\n列表 29.8 使用 SimpleXML\
  \ 修改 XML (`simpleXML_edit.php`\")\n\n### 注意\n\n`asXML()` 方法不仅可以返回字符串，还可以返回一个文件。要实现这一点，只需指定文件名作为参数即可：\n\
  \n```php\n$sim->asXML(\"products2.xml\"); \n```\n\n![修改后的 XML 文件](img/img-f29.6.html)\
  \ \n\n图 29.6 修改后的 XML 文件\n\n## SimpleXML 和 DOM\n\nSimpleXML 不允许你添加新标签。这需要 DOM 访问。然而，这并不意味着你必须放弃\
  \ SimpleXML 的便利。以下两种方法确保了 DOM 对象与 SimpleXML 对象之间的 1:1 转换：\n\n- `simplexml_import_dom(DOM\
  \ object)` 将 DOM 对象转换为 SimpleXML 对象：\n\n  ```php\n$sim = simplexml_import_dom($dom);\
  \  \n  ```\n\n- `dom_import_simplexml(SimpleXML object)` 采取相反的方法将 SimpleXML 转换为\
  \ DOM 对象：\n\n  ```php\n$dom = dom_import_simplexml($sim);  \n  ```\n\n### 29.2.3\
  \ DOM 访问\n\nDOM 访问是访问 XML 元素最灵活的方式。它是面向对象的，并遵循 W3C 规范的指定命名。\n\n### 注意\n\nPHP 4 中已经存在\
  \ XML 的 DOM，但遗憾的是，旧实现没有使用 DOM 规范的官方名称。\n\n### 访问\n\n第一步是用 `DOMDocument` 对象访问 XML\
  \ 文档：\n\n1. 首先创建一个新的 `DOMDocument` 对象：\n\n  ```php\n$dom = new DOMDocument();  \n\
  \  ```\n\n2. 然后使用 `load(file)` 加载 XML 文档：\n\n  ```php\n$dom->load(\"products.xml\"\
  );  \n  ```\n\n  ##### 注意\n\n  除了 `load()` 之外，还有几种填充 `DOMDocument` 对象的替代方法。`loadXML(String)`\
  \ 从字符串加载对象，`loadHTML()` 从 HTML 字符串加载，`loadHTMLFile()` 从 HTML 文件加载。与 XML 不同，HTML\
  \ 并不要求是良好格式的即可被加载。这在实践中通常非常有用。\n\n3. 通过 `saveXML()`，你将 DOM 树作为字符串返回。如果你指定一个节点作为可选参数，则只输出该节点及其子节点：\n\
  \n  ```php\n$dom->saveXML();  \n  ```\n\n在下面的简单示例中，DOM 树被输出在 `<pre>` 标签中；你可以在图 29.7\
  \ 中的浏览器查看输出。\n\n```php\n<?php \n  $dom = new DOMDocument(); \n  $dom->load(\"products.xml\"\
  ); \n  print \"<pre>\" . htmlentities($dom->saveXML()) . \"</pre>\"; \n?>  \n```\n\
  \n列表 29.9 在浏览器中输出 XML (`dom.php`\")\n\n![输出的 XML 文件](img/img-f29.7.html) \n\n图 29.7\
  \ 作为输出的 XML 文件\n\n### 注意\n\n如果你想将 XML 保存到文件，请使用 `saveHTML(File)`。\n\n### 元素和标签\n\
  \nDOM 解析器还将空格和类似字符（空白字符）视为节点。在遍历 DOM 树时，这样做并不实际。因此，我们在这里使用 `LIBXML_NOBLANKS` 选项移除空白字符。\n\
  \n### 操作 DOM\n\n在本节中，你将看到一个 DOM 操作如何工作的示例。这里使用了一些 DOM 函数。示例脚本具有以下任务：它应该允许用户在 XML\
  \ 的末尾追加一条新记录。起点是熟悉的 `products.xml` 文件，你也可以在前言中找到它。\n\n\n\n\n\n8. 到目前为止，新元素仅存在于内存中；它们尚未挂载到\
  \ DOM 树中。要实现这一点，通过 `documentElement` 属性获取根元素，并使用 `appendChild()` 添加新产品以挂载新产品节点：\n\
  \n```\n$root = $dom->documentElement;\n$root->appendChild($new);  \n```\n\n9. 然后将标题和价格节点附加到这些节点上：\n\
  \n```\n$new->appendChild($title);\n$new->appendChild($price);  \n```\n\n10. 最后，使用\
  \ `saveXML()` 将修改后的 XML 文档输出为字符串：\n\n```\nprint \"<pre>\" . htmlentities($dom->saveXML())\
  \ . \"</pre>\";  \n```\n\n##### Note\n\n或者，你也可以使用 `save(file)` 将其写入文件。\n\nListing\
  \ 29.11 显示了带有表单的完整代码；你可以在 Figure 29.8 中查看输出。\n\n```php\n<?php\n  if (isset($_POST[\"\
  send\"]) && $_POST[\"title\"] != \"\") {\n    $dom = new DOMDocument();\n    $dom->load(realpath(\"\
  products.xml\"), LIBXML_NOBLANKS);\n\n    $new = $dom->createElement(\"product\"\
  );\n    $title = $dom->createElement(\"title\");\n    $price = $dom->createElement(\"\
  price\");\n    $price->setAttribute(\"currency\", $_POST[\"currency\"]);\n \n  \
  \  $titleContent = $dom->createTextNode($_POST[\"title\"]);\n    $priceContent =\
  \ $dom->createTextNode($_POST[\"price\"]);\n    $title->appendChild($titleContent);\n\
  \    $price->appendChild($priceContent);\n \n    //Append new element\n    $root\
  \ = $dom->documentElement; \n    $root->appendChild($new);\n \n    $new->appendChild($title);\n\
  \    $new->appendChild($price);\n    //Output in HTML:\n    print \"<pre>\" . htmlentities($dom->saveXML())\
  \ . \"</pre>\";\n \n    //Write to file:\n    $dom->save('products_new.xml');\n\
  \  }\n?> \n```\n\n```html\n<html>\n<head>\n  <title>New entry</title>\n</head>\n\
  <body>\n  <form method=\"POST\">\n    <input type=\"text\" name=\"title\" /> Product\
  \ title<br />\n    <input type=\"text\" name=\"price\" /> Price<br />\n    <input\
  \ type=\"text\" name=\"currency\" /> Currency<br />\n    <input type=\"submit\"\
  \ name=\"send\" value=\"Enter\" />\n  </form>\n</body>\n</html>  \n```\n\n**Listing\
  \ 29.11**  DOM DOM 树 (\"dom_edit.php\")\n\n![修改后的 XML 文件](img/img-f29.8.html) \n\
  \n**Figure 29.8** 修改后的 XML 文件\n\n### XPath\n\n值得关注一下 DOM 扩展中的 XPath 可能性。它的用法与 SimpleXML\
  \ 略有不同：你首先将 XML 文件加载到 `DOMDocument` 对象中，然后创建一个 `DOMXPath` 对象并使用 `query(XPath expression)`\
  \ 执行。\n\n```php\n<?php \n  $dom = new DOMDocument(); \n  if ($dom->load(\"products.xml\"\
  )) { \n    $xpath = new DOMXPath($dom); \n    foreach ($xpath->query(\"*/title\"\
  ) as $title) { \n      print $title->textContent . \"<br />\"; \n    }  \n  } \n\
  ?>  \n```\n**Listing 29.12** DOM 使用 XPath (dom_XPath.php)\n\n### DOM 和 SimpleXML\n\
  \n我们在 Section 29.2.2 中讨论了 DOM 和 SimpleXML 之间的转换。\n\n### 类\n\nDOM 扩展的 API 是完全面向对象的。文档本身是一个\
  \ `DOMDocument` 对象。节点是 `DOMNode`，标签是 `DOMElement` 以及更多方法和属性。新之处在于你可以为类添加功能。最简单的方法是编写自\
  \ `DOMDocument` 的类。这是一个常见的任务。\n\n### 29.2.4 验证\n\n验证是检查 XML 文档的结构是否正确。如果你对 XML 的外观有完全控制，则不需要验证。如果你有一个特定的结构但不知道它是否符合，情况有所不同。在这种情况下，需要\
  \ DTD 或 schema。以下列表显示了带有（内部）DTD 的文档。\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\" standalone=\"no\"?>\n<!DOCTYPE products [\n    ELEMENT products (product+)>\n\
  \    ELEMENT product (title+, price+)>\n    ELEMENT title (#PCDATA)>\n    ELEMENT\
  \ price (#PCDATA)>\n    <!ATTLIST price CDATA #REQUIRED>\n]>\n<products>\n  <product>\n\
  \    <title>Vacuum cleaner</title>\n    <price currency=\"Euro\">4.80</price>\n\
  \  </product>\n  <product>\n    <title>Teapot</title>\n    <price currency=\"Euro\"\
  >22.50</price>\n  </product>\n</products>\n```\n**Listing 29.13** XML 文档 (\"products_dtd\"\
  )\n\nDOM 扩展也提供了此类验证——实际上有三种验证类型：\n\n*   针对已知的 DTD\n*   针对 XSD\n*   针对 RELAX NG，一种在实践中非常流行的简单结构语言\n\
  \nPHP 为这三种情况都提供了独立的方法：\n\n*   `validate()` 验证 `DOMDocument` 对象中的 DTD：\n```\n$dom->validate();\n\
  ```\n*   `schemaValidate(filename)` 验证指定的 schema 文件：\n```\n$dom->schemaValidate(\"\
  schema.xsd\");\n```\n使用 `schemaValidateSource(String)` 也可以验证字符串指定的 XSD 文档。\n\n*\
  \   `relaxNGValidate(filename)` 验证 RELAX NG 文件：\n```\n$dom->relaxNGValidate(\"relax.rng\"\
  );\n```\n这里也有对应的 `relaxNGValidateSource(String)` 用于验证字符串。Listing 29.14 显示了一个针对 DTD\
  \ 验证的简单示例；你可以在 Figure 29.9 中看到输出。\n\n```php\n<?php\n  $dom = new DOMDocument();\n\
  \  if ($dom->load(\"products_dtd.xml\")) {\n    if ($dom->validate()) {\n      print\
  \ \"Validation successful!\";\n    } else {\n      print \"Validation failed!\"\
  ;\n    }\n  }\n?>  \n```\n**Listing 29.14** 针对 DTD 验证 (\"validate.php\")\n\n![故意引入的错误验证](img/img-f29.9.html)\
  \ \n\n**Figure 29.9** 故意引入的错误\n\n### 29.2.5 XSLT\n\n与 XML 文档一样，XSLT 文档是一个 `DOMDocument`\
  \ 对象。从 PHP 的角度来看，使用 XSLT 非常简单，包含以下步骤：\n\n1. 首先加载 XML 文件和 `XMLReader`。\n2. 然后启动 XSLT\
  \ 处理器：\n```\n$pro = new XsltProcessor();  \n```\n3. 现在导入 XSLT：\n```\n$pro->importStylesheet($xslt);\n\
  ```\n使用 `setProperty(Namespace, Name, Value)` 可以为转换设置属性。\n4. 使用 `transformToDoc(DOM)`\
  \ 执行转换：\n```\n$erg = $pro->transformToDoc($dom);\n```\n##### Note\n\n或者，你也可以使用 `transformToXml(DOM)`\
  \ 生成 XML 字符串。或者你可以使用 `transformToUri(DOM, URI)` 将 DOM 文档转换为流。\n5. 最后，保存结果。在这里，这是作为字符串完成的：\n\
  ```\nprint $erg->saveXML();\n```\n你也可以使用 DOM 扩展的其他方法，例如 `save(File)` 将转换后的文档保存到文件。\n\
  \n以下脚本——类似于 Listing 29.5——将 products.xml XML 文档转换为 HTML 页面（参见 Figure 29.10）。\n\n\
  ```php\n<?php\n$xml = new XMLReader();\n$xml->open(\"products.xml\");\n\nwhile ($xml->read())\
  \ {\n    if ($xml->nodeType == XMLReader::ELEMENT) {\n      if ($xml->localName\
  \ == \"title\") {\n        $xml->read();\n        echo htmlspecialchars($xml->value)\
  \ . \n             \"<br />\";\n      }\n    }\n}\n?>  \n```\n**Listing 29.15**\
  \ XSLT (\"xslt.php\")\n\n![作为 HTML 表格的产品](img/img-f29.10.html) \n\n**Figure 29.10**\
  \ 作为 HTML 表格的产品\n\n## 29.3 XMLReader 和 XMLWriter\n\nXMLReader 和 XMLWriter 是新的 XML\
  \ 访问变，其模型基于 Microsoft .NET 框架中的 XmlReader 和 XmlWriter。它们与通过 SAX 访问相似，但更容易使用。\n\n\
  ##### Note\n\nXMLReader 和 XMLWriter 从 PHP 5.1 起已直接集成到 PHP 核心中。\n\n### 29.3.1 XMLReader\n\
  \n\n\n\n与基于事件的 SAX 解析器不同，`XMLReader` 采用的是光标驱动型解析器，这在读取文件时很常见。这意味着 XML 元素是逐个通过的。随后可以通过各种属性获取有关相应元素的详细信息。如\
  \ `XMLREADER::ELEMENT` 等常量决定了元素的元素类型（标签、文本等）。你可以在 [`s-prs.co/v602242`](http://s-prs.co/v602242)\
  \ 找到完整的概述。\n\n与 `DOM` 解析器相比优势显而易见：不需要将整个文档存储在内存中。与 SAX 解析器相比，`XMLReader` 稍微更容易使用，且性能略好。此外，RELLAX\
  \ NG 目前也允许命名空间和验证。\n\n下面的列表显示了一个简单的示例，它遍历 XML 文件并输出 `<title>` 标签内的所有值（参见图 29.11）。\n\
  \n```php\n<?php \n$xml = new XMLReader(); \n$xml->open(\"products.xml\");\n\nwhile\
  \ ($xml->read()) \n{ \nif ($xml->nodeType == XMLReader::ELEMENT) {\n      if ($xml->localName\
  \ == \"title\") { \n$xml->read(); \necho htmlspecialchars($xml->value) .       \
  \       \n\"<br />\"; \n}\n    } \n} \n?>  \n```\n\n**列表 29.16** XMLReader 的使用示例\
  \ (\"xmlreader.php\")\n\n![读取出两个产品的标题](img/img-f29.11.html) \n\n**图 29.11** 读取出两个产品的标题\n\
  \n### 29.3.2 XMLWriter\n\n`XMLWriter` 是 `XMLReader` 的对应物。它写入 XML 文档并按照严格的层级结构进行，就像读取器一样。每个元素都有开始（`xmlwriter_start_element()`）和结束（`xmlwriter_end_element()`）。它既可以用基于函数的方式，可以用面向对象的方式。列表\
  \ 29.17 显示了面向函数的访问示例，结果如图 29.12 所示。\n\n```php\n<?php\n$xmlwr = xmlwriter_open_memory();\n\
  \nxmlwriter_set_indent($xmlwr, true);\n\nxmlwriter_start_document($xmlwr);\n\nxmlwriter_start_element($xmlwr,\
  \ \"products\");\nxmlwriter_start_element($xmlwr, \"product\");\n\nxmlwriter_start_element($xmlwr,\
  \ \"title\");\nxmlwriter_text($xmlwr, \"Vacuum cleaner XY\");\nxmlwriter_end_element($xmlwr);\n\
  \nxmlwriter_start_element($xmlwr, \"price\");\nxmlwriter_write_attribute($xmlwr,\
  \ \"currency\", \"Euro\");\nxmlwriter_text($xmlwr, \"4,80\");\nxmlwriter_end_element($xmlwr);\n\
  xmlwriter_end_element($xmlwr);\nxmlwriter_end_element($xmlwr);\nxmlwriter_end_document($xmlwr);\n\
  echo htmlspecialchars(xmlwriter_output_memory($xmlwr));\n?>  \n```\n\n**列表 29.17**\
  \ XMLWriter 的使用示例 (\"xmlwriter.php\")\n\n![XMLWriter 输出 XML 输出](img/img-f29.12.html)\
  \ \n\n**图 29.12** XMLWriter 输出 XML 输出\n\n列表 29.18 显示了相同的示例，但使用了面向对象的表示法。\n\n```php\n\
  <?php \n$xmlwr = new XMLWriter(); \n$xmlwr->openMemory(); \n$xmlwr->startDocument('1.0',\
  \ 'UTF-8');\n\n$xmlwr->setIndent(true); \n$xmlwr->startDocument(); \n$xmlwr->startElement('products');\n\
  $xmlwr->startElement('product');\n\n$xmlwr->startElement('title'); \n$xmlwr->text('Vacuum\
  \ cleaner XY'); \n$xmlwr->endElement();\n\n$xmlwr->startElement('price'); \n$xmlwr->writeAttribute('currency',\
  \ 'Euro'); \n$xmlwr->text('4,80'); \n$xmlwr->endElement();\n\n$xmlwr->endElement();\
  \ \n$xmlwr->endElement();\n\n$xmlwr->endDocument();\n\necho htmlspecialchars($xmlwr->outputMemory());\
  \ \n?>  \n```\n\n**列表 29.18** XMLWriter: 面向对象 (\"xmlwriter_oo.php\")\n\n## 29.4\
  \ EXIF\n\nXML 有成千上万个应用示例。原则上，XML 用于各种场景。XML 在需要存储数据的地方以层级化的方式进行。XML 也用于存储图像的元数据。EXIF（交换图像格式）用于存储相机信息。\n\
  \n### 29.4.1 准备\n\n为了让 PHP 访问 EXIF 数据，需要启用扩展。在 Linux 下，你需要配置以下行；在 Windows 下，只需取消注释：\n\
  \n```\nextension=exif\n```\n\n你可能还需要\n\n```\nextension=mbstring\n```\n\n### 29.4.2\
  \ 实现\n\n应用程序由两个脚本组成：`upload.php` 负责上传图像并保存到服务器；`read.php` 负责从磁盘读取 EXIF 数据。文件存储于\
  \ `images` 子目录中：\n\n```php\nif (isset($_FILES[\"File\"][\"name\"])) { \n  move_uploaded_file($_FILES[\"\
  File\"][\"tmp_name\"], \"./images/\" . $_FILES[\"File\"][\"name\"]);  \n}\n```\n\
  \n### 注意\n\n你可能需要检查是否已存在此文件。如果你的管理有多个用户，那么每个用户都需要自己的目录。你应该检查图像的大小并设置相应的限制。\n\n下一步是读取\
  \ EXIF 数据。使用了 `exif_read_data(Image, Required, Thumbnail)` 方法。你需要指定图像名称作为参数。随后是包含必须存在的\
  \ EXIF 信息部分的字符串。第三个参数控制是否以数组返回 EXIF 数据；第四个参数决定是否传输通常位于 EXIF 头部缩略图：\n\n```php\n$data\
  \ = exif_read_data(\"./images/\" . $_FILES[\"File\"][\"name\"], \"File, EXIF, IFD0\"\
  , true, false);  \n```\n\n剩下的都是 DOM 操作。如果文件不存在，则创建一个文档并写入根元素。随后是图像标签，它应该包含刚刚的图像的信息。各个\
  \ EXIF 信息通过 `foreach` 循环提供。以下是处理文件的过程示例：\n\n```php\n$file = $dom->createElement(\"\
  file\"); \n$image->appendChild($file); \nforeach ($data[\"FILE\"] as $index => $value)\
  \ { \n  if (!is_string($value)) { \n    $value = serialize($value); \n  } \n  $index\
  \ = $dom->createElement(strtolower($index)); \n  $value = $dom->createTextNode($value);\
  \ \n  $index->appendChild($value); \n  $file->appendChild($index); \n}  \n```\n\n\
  对 EXIF 和 IFD0 信息重复此操作，然后保存 XML 文件。你可以在下面的列表中看到完整代码。\n\n```html\n<html>\n<head>\n\
  \  <title>File upload</title>\n</head>\n<body> \n```\n\n\n\n\n```php\n<?php\n  if\
  \ (isset($_FILES[\"file\"])) {\n    move_uploaded_file($_FILES[\"File\"][\"tmp_name\"\
  ], \"./images/\" . \n                       $_FILES[\"Datei\"][\"name\"]);\n   \
  \ $data = exif_read_data(\"./images/\" . $_FILES[\"File\"][\"name\"], \n       \
  \                        \"File, EXIF, IFD0\", true, false);\n \n    //XML document\n\
  \    $dom = new DOMDocument();\n    if (@!$dom->load(\"images.xml\")) {\n      $images\
  \ = $dom->createElement(\"images\");\n      $dom->appendChild($images);\n    }\n\
  \    $image = $dom->createElement(\"image\");\n    $dom->documentElement->appendChild($image);\n\
  \n    //File data\n    $file = $dom->createElement(\"file\");\n    $image->appendChild($file);\
  \ \n \n    foreach ($data[\"FILE\"] as $index => $value) {\n      if (!is_string($value))\
  \ {\n        $value = serialize($value);\n      }\n      $index = $dom->createElement(strtolower($index));\n\
  \      $value = $dom->createTextNode($value);\n      $index->appendChild($value);\n\
  \      $file->appendChild($index); \n    }\n\n    //EXIF data\n    $exif = $dom->createElement(\"\
  exif\");\n    $image->appendChild($exif); \n \n    foreach ($data[\"EXIF\"] as $index\
  \ => $value) {\n      if (!is_string($value)) {\n        $value = serialize($value);\n\
  \      }\n      $index = $dom->createElement(strtolower($index));\n      $value\
  \ = $dom->createTextNode($value);\n      $index->appendChild($value);\n      $exif->appendChild($index);\
  \ \n    }\n \n    //IFD0 data\n    $ifd0 = $dom->createElement(\"ifd0\");\n    $image->appendChild($ifd0);\
  \ \n \n    foreach ($data[\"IFD0\"] as $index => $value) {\n      if (!is_string($value))\
  \ {\n        $value = serialize($value);\n      }\n      $index = $dom->createElement(strtolower($index));\n\
  \      $value = $dom->createTextNode($value);\n      $index->appendChild($value);\n\
  \      $ifd0->appendChild($index); \n    }\n \n    $dom->save(\"images.xml\");\n\
  \  }\n?> \n```\n\n```html\n  <form method=\"post\" enctype=\"multipart/form-data\"\
  >\n    <input type=\"file\" name=\"File\" />\n    <input type=\"submit\" value=\"\
  Upload\" />\n  </form>\n</body\n</html>  \n```\n\n**列表 29.19** 图片上传 (`upload.php`)\n\
  \n接下来的代码列表包含了从 XML 文件中读取某些信息的脚本。对于输出，我们使用 `SimpleXML` 而不是 `SAX`，因为这种方法的代码量少得多。\n\
  \n```php\n<?php\n  $sim = simplexml_load_file(\"images.xml\");\n  foreach ($sim->image\
  \ as $image) {\n    print '<table border=\"1\" cellpadding=\"5\">';\n    //filename\n\
  \    print '<tr><td>';\n    print 'File';\n    print '</td><td>';\n    print $image->filename;\n\
  \    print '</td></tr>';\n    //Date of the\n    print '<tr><td>';\n    print 'Date\
  \ of recording';\n    print '</td><td>';\n    print $image->exif->datetime;\n  \
  \  print '</td></tr>';\n    //image\n    print '<tr><td colspan=\"2\">';\n    print\
  \ '<img src=\"';\n    print './images/' . $image->filename;\n    print '\" /></td></tr>';\
  \ \n    print '</table>';\n  } \n?>\n```\n\n**列表 29.20** 使用 SimpleXML 读取 (`read.php`)\n\
  \n图 29.13 显示了结果。\n\n**图 29.13** 图片与 EXIF 信息一同输出\n\n### 提示\n\n改进的潜力是巨大的：你可以美化地格式化输出、捕获异常，并广泛地使用\
  \ EXIF 信息。从在线图片编辑到画廊，一切都是想象得到的。\n\n# 使用 PHP 处理图形\n\nPHP 显然不是 `Photoshop` 或 `GIMP`；这显而易见。然而，通过\
  \ PHP，你至少可以动态生成简单的图形。某些应用程序表明，动态生成图形非常有吸引力：例如，为用户个性化带有精美字体或简单图表的问候语。图形也用于安全机制：例如，生成的用户必须输入文本的验证码可以防止登录被破解。在\
  \ PHP 中，使用 `GD`（版本 2）来实现这一点。另一个名为 `PIMP` 的替代项目也讨论过很久，但从未完成。在本章中，我们将详细描述 `GD`，然后简要讨论替代方案，例如\
  \ `ImageMagick`。\n\n## 1. 准备工作\n\n`GD` 不需要多少准备工作。你只需要将库集成到 PHP 中。\n\n### 1.1 安装\n\
  \n在 Linux 下安装 `GD` 并不容易。首先从 [`github.com/libgd/libgd/releases`](https://github.com/libgd/libgd/releases)\
  \ 下载 `GD`。对于 JPEG 支持，你还需要 JPEG 库 ([www.ijg.org](http://www.ijg.org))，你必须将其编译 GD\
  \ 中。对于 TrueType 字体支持，你需要 `ZLIB`、`FreeType` 和 `XPM`。然后使用以下选项配置 PHP：\n\n```\n--with-gd\
  \ --enable-gd-native-ttf --with-png --with-zlib-dir=/usr/local/lib/zlib-1.2.1 --with-ttf\
  \ --with-jpeg-dir=/usr/local/lib/jpeg-6b/ --with-freetype-dir=/usr/local/lib/freetype-2.1.9/\
  \ --with-xpm-dir=/usr/X11R6\n```\n\n相比之下，在 Windows 下安装非常简单。只需通过删除分号来注释以下行：\n\n```\n\
  extension=php_gd2.dll\n```\n\n从 PHP 7.2 开始，这在没有 `php` 和 `.dll` 的情况下也有效：\n\n```\n\
  extension=gd2\n```\n\n在许多带有主机的安装和标准包中，该行已经被注释，且 `GD` 是自带的。你可以使用 `phpinfo()` 来测试安装是否成功。JPEG\
  \ 和 TrueType 字体支持已经包含在内。\n\n## 2. GD 实战\n\nThomas Boutell 编写的 `GD 2` 并非专为 PHP 编写，但它已经有了许多使用\
  \ `PHP` 的开发者。它提供了绘制形状和文本的选项，但也允许修改现有图像。\n\n### 2.1 基础框架\n\n使用 `GD 2` 创建图形是一个 PHP\
  \ 文件。基本结构是相同的。首先，你需要通过 HTTP 头部输出数据类型：\n\n```\nheader(\"Content-type: image/png\"\
  )\n```\n\n`Content-type` 是图像类型。你有以下选项：\n\n```\nheader(\"Content-type: image/gif\"\
  )\n```\n\n用于 GIF 或\n\n```\nheader(\"Content-type: image/jpeg\")\n```\n\n用于 JPEG。\n\
  \n### 注意\n\n`GIF` 仅支持 256 色，所有颜色都存储在调色板中。由于其区域压缩算法，`GIF` 主要适用于平面图形，并提供了透明度和 GIF\
  \ 动画等功能。JPEG 使用 1600 万颜色，适用于照片。然而，JPEG 使用有损压缩，如果压缩过强，会导致难看的像素化效果，称为 JPEG 伪影。\n\n\
  `PNG` 的作为这两种格式的替代方案：`PNG-8`（更低）存储 256 色，而 `PNG-24` 支持 1600 万颜色。`PNG-8` 支持简单的透明。对于\
  \ `PNG-24`，文件通常比 JPEG 大，但它们是无损压缩的，与 `PNG-8` 和 `JPEG` 相比，Alpha 透明有助于创建漂亮的效果。Alpha\
  \ 透明意味着像素也可以是透明的，从而与背景实现平滑过渡。\n\n现在你需要创建一个图像。为了这一点，使用 `imagecreatetruecolor(width,\
  \ height)` 函数：\n\n```\n$image = imagecreatetruecolor(200, 200)\n```\n\n真色彩图像支持 1600\
  \ 万颜色。如果你创建一个 GIF 或 PNG-8，请使用 `imagecreate(width, height)`：\n\n```\nimagecreate(200,\
  \ 200)\n```\n\n### 注意\n\n`GD 2` 没有提供面向对象的 API；它是基于函数的。这也是考虑替代标准库的原因之一。但在 PHP 8 中，`GD`\
  \ 资源也被替换为名为 `GDImage` 的 类。在 PHP 8.1 中，字体资源也进行了类似的替换，使用了 `GDFont` 类。\n\n\n\n\n\n\
  ```\nimagepng($image);  \n```\n\n创建一个 PNG，\n\n```\nimagegif($image);  \n```\n\n\
  一个 GIF，以及\n\n```\nimagejpeg($image);  \n\n```\n\n一个 JPEG。\n\n最后，你应该从内存中删除图像，这样你就不会带入任何遗留数据：\n\
  \n```\nimagedestroy($image);  \n```\n\n如果你现在在浏览器中查看该图像，会出现一个黑色区域，而不是你可能预期的白色（参见图\
  \ 30.1）。GD 自动将背景填充为黑色。如果你不指定颜色，黑色也是绘图时的默认颜色。\n\n要获得不同的背景颜色，你必须先用一个具有适当颜色的矩形填充图像。要实现这一点，请使用\
  \ `imagecolorallocate(image, R, G, B)` 定义一种颜色，然后使用 `imagefilledrectangle(image,\
  \ x1, y1, x2, y2, color)` 绘制矩形：\n\n```php\n$white = imagecolorallocate($image, 255,\
  \ 255, 255); \nimagefilledrectangle($image, 0, 0, 199, 199, $white);  \n```\n\n\
  ![回到黑色，背景的基础颜色 ...](img/img-f30.1.html)\n\n**图 30.1**    回到黑色，背景的基础颜色 ...\n\n你可以在图\
  \ 30.2 中看到结果。坐标是针对矩形的左上角和右下角的。\n\n![... 并变回白色 (\"basic.php\")](img/img-f30.2.html)\
  \ \n\n**图 30.2**    ... 并变回白色 (\"basic.php\")\n\n### 30.2.2 文本\n\nGD 中的文本本身是简单的，但字体选择和字体外观有时是一个问题。`imagestring(image,\
  \ font, x, y, text, color)` 函数允许你在图像中写入文本（参见图 30.3）。所有的设置都是自俗其懂的，字体除外。在这里，你指定标准\
  \ GD 字体之一。标准字体数字为 1 到 5。\n\n```php\n<?php \n  header(\"Content-type:image/png\"\
  );\n\n  $image = imagecreatetruecolor(200, 200);\n\n  $white = imagecolorallocate($image,\
  \ 255, 255, 255); \n  imagefilledrectangle($image, 0, 0, 199, 199, $white);\n  $blue\
  \ = imagecolorallocate($image, 51, 51, 204);\n  $text = \"GD 2 is great!\";   \n\
  \  imagestring($image, 5, 50, 50, $text, $blue);\n\n  imagepng($image); \n  imagedestroy($image);\
  \ \n?>  \n```\n\n**列表 30.1**    \"imagestring()\" (\"text.php\")\n\n![GD 的文本版](img/img-f30.3.html)\
  \ \n\n**图 30.3**    GD 的文本版\n\n### 提示\n\n使用 `imagestringup()`，你可以绘制垂直文本。x 和 y 坐标也代表文本的左上角。\n\
  \n文本输出的问题在于其外观和大小是固定的。因此，你只能通过 `imagestring()` 使用这些字体。现在你可以使用 `imagettf()` 加载新字体：\n\
  \n```\n$font = imagettffonts(); \n$white = imagecolorallocate($image, 255, 255,\
  \ 255); \nimagefilledrectangle($image, 0, 0, 199, 199, $white);\n```\n\n这种方法效果很好。然而，你需要\
  \ [www.dancesferrets.org/gdfs](http://www.dancesferrets.org/gdfs) 中的字体。如果你想更自由地定义字体，也可以使用\
  \ GD 创建 TrueType 字体（TTFs），通过 `imagettftext(image, size, angle, x, y, text, font,\
  \ color)` 函数。\n\n```php\n$blue = imagecolorallocate($image, 51, 51, 204);\n$text\
  \ = \"GD 2 is great!\"; \nimagettftext($image, 20, 0, 50, 50, $text, $font, $blue);\n\
  ```\n\n这种方法同样是填充的。你可以在 [www.dancesferrets.org/lab/gdfs](http://www.dancesferrets.org/lab/gdfs)\
  \ 找到一些，例如：\n\n```php\n$blue = imagecolorallocate($image, 51, 51, 204);\n$text =\
  \ \"GD 2 is great!\"; \nimagettftext($image, 20, 0, 50, 50, $text, $font, $blue);\n\
  ```\n\n**列表 30.2**    \"imagettftext()\" (\"times.php\")\n\n![文本输出](img/img-f30.4.html)\n\
  \n**图 30.4**    文本输出\n\n### 提示\n\n`imagettfbbox()` 函数返回文本的边界。提供的数组由四个坐标（x 和 y 值）组成，从左上开始。\n\
  \n### 30.2.3 形状\n\nGD 通过几个函数提供几何形状：\n\n*   `imagefilledrectangle(image, x1, y1,\
  \ x2, y2, color)` 绘制填充矩形。\n\n*   `imagefilledellipse(image, cx, cy, rx, ry, color)`\
  \ 创建填充椭圆，具有水平和垂直半径（rx 和 ry）。\n\n*   `imagefilledpolygon(image, points, color)` 填充多边形。Points\
  \ 是坐标数组。\n\n*   `imagefilledarc(image, cx, cy, width, height, start, end, color)`\
  \ 填充弧。cx 和 cy 指定圆心。Width 和 height 是弧的宽高。Start 和 end 定义角度。Style 是填充类型（例如 IMG_FILL）。\n\
  \n注意：所有函数也可以是不填充的（例如 `rectangle()`、`ellipse()`、`polygon()`、`arc()`）。\n\n\n\n\n\n\
  ```php\nimagesetthickness($image, 20); \n$red = imagecolorallocate($image, 204,\
  \ 51, 51); \n$blue = imagecolorallocate($image, 51, 51, 204); \nimagesetstyle($image,\
  \ array($red, $red, $blue, $blue, $white, $white)); \nimageline($image, 0, 0, 50,\
  \ 199, IMG_COLOR_STYLED); \nimageline($image, 50, 199, 100, 0, IMG_COLOR_STYLED);\
  \ \nimageline($image, 100, 0, 150, 199, IMG_COLOR_STYLED); \nimageline($image, 150,\
  \ 199, 200, 0, IMG_COLOR_STYLED);  \n```\n\n**列表 30.5** 线条及其样式 (\"lines.php\")\n\
  \n![单条线条样式](img/img-f30.7.html) \n\n**图 30.7** 单条线条样式\n\n### 提示\n\n通过 `imagesetbrush(image,\
  \ brush)` 方法，你甚至可以使用另一个图像作为线条的样式。要实现这一点，你必须像往常一样加载图像（例如，使用 `imagecreatefrompng()`），然后将其作为第二个参数传递给\
  \ `imagesetbrush()` 函数。要使用该刷笔，只需将颜色常量 `IMG_COLOR_STYLEDBRUSHED` 指定为颜色。\n\n## 30.2.5\
  \ 图像输出\n\n如果你想在网站上使用动态创建的文件，可以通过标准的 `<img>` 标签来实现：\n\n```\n<img src=\"script.php\"\
  \ />  \n```\n\n就是这样。图像会出现在浏览器中。\n\n如果不想让图像显示在浏览器中，而是将其保存到服务器上，请使用 `imagepng()`、`imagejpeg()`\
  \ 和 `imagegif()` 函数。只需使用第二个参数指定文件名即可：\n\n```php\nimagepng($image, \"test.tif\");\
  \  \n```\n\n使用 `ob_start()` 等类的输出缓冲区也可以通过 PHP 输出图像。PEAR 类 `Stream_Var` 也可以在此使用。\n\
  \n## 30.2.6 图像处理\n\n让我们谈谈编辑现有图像。你可以使用相应的 `image createfromXY(file name)` 函数打开现有图像，其中\
  \ `XY` 代表文件格式。\n\n你现在可以在现有图像中绘制文本或形状等新元素。这与之前节描述的过程没有区别。然而，图像编辑是关于更改图像本身。这有两种方法：\n\
  \n1. 对于具有 256 色和调色板的图像，你可以交换调色板中的颜色。\n2. 对于具有 1678 万种色的图像，你必须逐个更改每个像素。\n\n我们将通过灰度转换的示例向你展示这两种变。首先，在下一节中，我们将讨论如何缩小现有图像的大小。\n\
  \n### 缩小图像尺寸\n\n如果你想更改图像尺寸可以使用 `imagecopyresized(target, source, x, y, srcx, srcy,\
  \ width, height)` 函数。你指定目标图像和源图像，然后是图像开始的坐标，最后是目标和源的宽高。以下示例将图像缩小到原始大小的 10%，如图 30.8\
  \ 和图 30.9 所示。\n\n```php\n<?php \n  header(\"Content-type:image/jpeg\");\n\n  $image\
  \ = imagecreatefromjpeg(\"test.jpg\"); \n  $x = imagesx($image); \n  $y = imagesy($image);\n\
  \n  $image_smaller = imagecreatetruecolor($x * 0.2, $y * 0.2);\n\n  imagecopyresized($image_smaller,\
  \ $image, 0, 0, 0, 0, $x * 0.2, $y * 0.2); \n\n  imagejpeg($image_smaller); \n \
  \ imagedestroy($image); \n  imagedestroy($image_smaller); \n?>\n```\n\n**列表 30.6**\
  \ 缩小图像尺寸 (\"image_reduce.php\")\n\n![从大到](img/img-f30.8.html) \n\n**图 30.8** 从大到...\n\
  \n![...到小](img/img-f30.9) \n\n**图 30.9** ...到小\n\n### 注意\n\n记得在结束时从内存中删除两个图像。\n\n\
  ### 256 色灰度\n\n计算灰值最简单的方法是将组成颜色的红、绿、蓝各个颜色值相加并除以三。这个平均值即为灰度模式下的红、绿、蓝值。赋予颜色不同的权重会稍微微妙一些——例如，25%\
  \ 红色、40% 蓝色和 35% 绿色。\n\n理论就到此。在实践中，你现在只需要遍历图像中的所有颜色。我们将通过一个示例向你展示如何操作：\n\n1. 首先加载\
  \ 256 色色的图像：\n```php\n$image = imagecreatefromgif(); \n```\n2. 然后遍历图像中的所有颜色。我们将通过\
  \ `imagecolorotal()` 函数获取数量：\n```php\nfor ($i=0; $i<imagecolorotal($image); $i++)\n\
  ```\n3. 每个颜色都有索引，通过 `imagecolorsforindex` 获取颜色：\n```php\n$f = imagecolorsforindex($image,\
  \ $i);\n```\n4. 红、绿、蓝键值在 `$f` 数组通过通过公式计算灰度值：\n```php\n$gst = $f[\"red\"]*0.25 +\
  \ $f[\"green\"]*0.4 + $f[\"blue\"]*0.35;\n```\n5. 为了重新定义灰度，使用计算出的颜色值：\n```php\n\
  imagecolorset($image, $i, $gst, $gst);\n```\n6. 最后，只需输出图像。以下代码显示了完整过程：\n\n```php\n\
  <?php\n  header(\"Content-type:image/png\");\n\n  $image = imagecreatefromgif(\"\
  test.gif\");\n\n  for ($i=0; $i<imagecolorotal($image); $i++) { \n    $f = imagecolorsforindex($image,\
  \ $i); \n    $gst = $f[\"red\"]*0.25 + $f[\"green\"]*0.4 + $f[\"blue\"]*0.35; \n\
  \    imagecolorset($image, $i, $gst, $gst); \n  }\n  imagepng($image); \n  imagedestroy($image);\
  \ \n?>\n```\n\n**列表 30.7** 256 色灰度转换 (\"grayscale_256.php\")\n\n### 注意\n\n顺带一下，当你指定颜色时，还可以指定透明度。这是通过\
  \ `imageallocatealpha(image, red, green, blue, alpha)` 函数实现的，alpha 值范围为 0 到 127。调色板还有其他函数用于确定颜色：`imagecolorclosest()`\
  \ 和 `imagecolorclosestalpha()` 使用调色板中距离指定颜色的颜色。在 GIF 和 PNG-8 格式中指定透明颜色，使用 `imagecolortransparent(image,\
  \ color)`。\n\n### 1678 万色灰度\n\n如果你想将超过 256 色的照片转换为灰度，你实际上必须替换每个像素。然而，由于这消耗性能，我们将向你展示一个技巧。\n\
  \n这个技巧是使用 `imagetruecolopalette(image, dithering, number of colors)` 函数将图像颜色压缩到\
  \ 256 色调色板中。这种方法的缺点是丢失了颜色信息。另一方面，转换为灰度既快速又简单。\n\n```php\n<?php\n  header(\"Content-type:image/jpeg\"\
  );\n\n  $image = imagecreatefromjpeg(\"test.jpg\");\n  imagetruecolopalette($image,\
  \ false, 256);\n\n  for ($i=0; $i<imagecolorotal($image); $i++) { \n    $f = imagecolorsforindex($image,\
  \ $i); \n    $gst = $f[\"red\"]*0.15 + $f[\"green\"]*0.5 + $f[\"blue\"]*0.35; \n\
  \    imagecolorset($image, $i, $gst, $gst, $gst); \n  }\n\n  imagejpeg($image);\
  \ \n  imagedestroy($image); \n?>\n```\n\n**列表 30.8** 带有之前的调色板调整的转换 (\"grayscale_1678_conversion.php\"\
  )\n\n\n\n\n\n```php\n<?php \n  header(\"Content-type:image/jpeg\");\n\n  $image\
  \ = imagecreatefromjpeg(\"test.jpg\");\n  \nfor ($i=0; $i<imagesx($image); $i++)\
  \ { \n  for ($j=0; $j<imagesy($image); $j++) { \n    $f = imagecolorat($image, $i,\
  \ $j); \n    $f = imagecolorsforindex($image, $f); \n    $gst = $f[\"red\"]*0.25+\
  \ $f[\"green\"]*0.4+ $f[\"blue\"]*0.35; \n    $color = imagecolorallocate($image,\
  \ $gst, $gst, $gst); \n    imagesetpixel($image, $i, $j, $color); \n    } \n  }\n\
  \n  imagejpeg($image); \n  imagedestroy($image); \n?>  \n```\n\n**列表 30.9** 性能较低的\
  \ (\"grayscale_1678.php\")\n\n### 提示\n\nGD 中还提供了集成的图像处理选项：通过 `imageconvolution()`，你可以使用矩阵更改图像，例如对其进行模糊处理。还有一些可以使用\
  \ `imagefilter()` 应用的过滤器。每个过滤器都是一个常量，例如用于高斯模糊的 `IMG_FILTER_GAUSSIAN_BLUR`：\n\n```\n\
  imagefilter($image, IMG_FILTER_GAUSSIAN_BLUR); \n```\n\n根据过滤器的不同，设置中可以使用更多参数。你可以在\
  \ [`s-prs.co/v602243`](http://s-prs.co/v602243) 找到概览。\n\n### 30.2.7 动态图表\n\n本节的目标是从\
  \ XML 文件动态生成饼图。XML 文件的结构非常简单，包含一个带有各种答案的调查结果：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?> \n<question text=\"谁应该被踢出去？\"> \n  <answer id=\"a\" text=\"教练\">12</answer>\
  \ \n  <answer id=\"b\" text=\"球员\">53</answer> \n  <answer id=\"c\" text=\"董事会\"\
  >85</answer> \n</question>  \n```\n\n脚本使用 SimpleXML 读取 XML 文件中的数据。首先，使用 `foreach`\
  \ 循环累加所有答案的票数。这之后被用于计算每个答案的百分比。在完成常规 GD 准备工作后，跟随另一个循环遍历所有答案。计算每个答案的百分比份额。由此得到了相应弧形的最终角度：\n\
  \n```\n$end = $start+ 360 * intval($answer) / $ant_max;  \n```\n\n然后使用 `imagecolorallocate()`\
  \ 绘制弧形。我们使用 `imagettftext()` 添加图例。响应文本直接来自 XML 文件。最后，将起始角度设置为上一个结束角度。你可以在图 30.10\
  \ 中查看输出。\n\n```php\n<?php \n  $sim = simplexml_load_file(\"survey.xml\"); \n  \n\
  \  // 确定答案的总和\n  $ant_max = 0; \n  foreach ($sim->answer as $answer) { \n    $ant_max\
  \ += intval($answer); \n  }\n\n  header(\"Content-type:image/png\");\n  $image =\
  \ imagecreatetrue(350, 250);\n\n  $white = imagecolorallocate($image, 255, 255,\
  \ 255); \n  imagefilledrectangle($image, 0, 0, 349, 249, $white);\n\n  $colors =\
  \ array(imagecolorallocate($image, 204, 51, 51), \n                  imagecolorallocate($image,\
  \ 51, 204, 51), \n                  imagecolorallocate($image, 51, 51, 204), \n\
  \                  imagecolorallocate($image, 204, 204, 51));\n\n  // 起始角度\n  $start\
  \ = 0; \n  $i = 0; \n  foreach ($sim->answer as $answer) { \n    $end = $start+\
  \ 360 * intval($answer) / $ant_max; \n    imagefilledarc($image, 100, 120, 150,\
  \ 150, intval($start), $colors[$i], IMG_ARC_PIE);\n\n    // 标记答案\n    imagettftext($image,\
  \ 10, 0, 200, 50+ 20 * $i, $colors[$i], \"verdana.ttf\", $answer[\"text\"] . \"\
  : \" . $answer);\n\n    // 更新标记\n    $start = $end; \n    $i++;\n  }\n\n  // 标签\n\
  \  $black = imagecolorallocate($image, 0, 0, 0); \n  imagettftext($image, 10, 0,\
  \ 200, 50+ 20 * $i, $black, \"verdana.ttf\", $answer[\"text\"] . \": \" . $answer);\n\
  \  imagepngimage););\n\n\n```\n\n**  30..**   图 (\"draw.php\")\n\n**图 30.10** 饼图的显示\n\
