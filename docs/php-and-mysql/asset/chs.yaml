  \ \n\n**图 5.7 数字 20 转换为二进制表示**\n\n### 5.1.5 不按常理出牌的运算符\n\n你已经在第 4 章和第 4.3 节中见过赋值运算符（等号）。它用于给变量赋值，但它属于运算符范畴。此外，还有一些经常不被视为运算符的运算符。\n\
  \n#### 注意事项\n\n你可以在这里找到一些奇特的运算符。与对象相关的运算符将在第 11 章](#11_001.html#h11)中讨论。\n\n####\
  \ 奇特运算符\n\n你可以在这里找到一些奇特的运算符。与对象相关的运算符将在第 11 章](#11_001.html#h11)中讨论。\n\n\n\n\n\n\
  从 PHP 7 开始，增加了一个额外的条件运算符，它会检查第一个操作数的值是否为零，如果是，则不会返回错误信息，而是返回第二个操作数的值。它也被称为空合并运算符。[\\\
  [ 37 \\]](footnotes.html#ftn-fn05_03)这在某些情况下很有帮助，例如从表单传输变量时。在此，以前需要结合条件运算符和 `isset()`\
  \ 使用：\n\n```\nOperand1 ?? Operand2;  \n```\n\n接下来的行显示了该运算符的使用方法。这里检查了 `$_GET` 变量（参见图\
  \ 5.8）。如果它不为空，则将其值存储在 `$result` 变量中。如果它为空，则使用字符串 `'alternative'`。\n\n```\n$result\
  \ = $_GET['variable'] ?? 'alternative';  \n```\n\n![如果定义了 GET 变量结果会变化（请注意底部图像地址栏中的\
  \ GET 参数！）](img/img-f5.8.html) \n\n**图 5.8** 如果定义了 GET 变量结果会变化（请注意底部图像地址栏中的 GET\
  \ 参数！）\n\n##### Note\n\n此解决方案与以下使用条件运算符 `?:` 的方法完全对应：\n\n```\n$result = isset($_GET['variable'])\
  \ ? $_GET['variable'] : 'Alternative'; \n```\n\n这节省了大量的打字工作，并使代码更加优雅。\n\n带有零检查的条件运算符不仅可以一次使用一个值，还可以组合形成检查链。要做到这一点，只需将操作数连接在一起即可：\n\
  \n```\n$result = $_GET['variable'] ?? $_GET['variable2'] ?? 'Alternative';  \n```\n\
  \n如果名为 `variable` 的 GET 变量存在，则使用该值作为 `$result`。如果不存在，则将检查 `variable2`，最后才使用备用值。\n\
  \n### 空安全运算符\n\n空安全运算符是 PHP 8 中引入的新特性，可以作为带空检查的条件运算符的有用补充。\n\n“为什么还需要另一个运算符？”有些人会这样问。PHP\
  \ 8 文档中的官方示例很好地说明了这一点。空安全运算符的目的是解决嵌套对象的无限嵌套检查。因此，对于这个复杂的结构：\n\n```\n$country = \
  \ null;\nif ($session !== null) {\n  $user = $session->user;\n  if ($user !== null)\
  \ {\n    $address = $user->getAddress();\n    if ($address !== null) {\n      $country\
  \ = $address->country;\n    }\n  }\n}  \n```\n\n变成了单行代码：\n\n```\n$country = $session?->user?->getAddress()?->country;\
  \  \n```\n\n`?->` 运算符是空检查和调用下一个方法或属性的组合。空检查始终应用于左侧的操作数。\n\n```\nOperand1 ?-> Operand2\
  \ ?-> Call  \n```\n\n任何嵌套都是可能的；也就是说，运算符可以连续使用多次。然而，出于性能考虑，一旦第一个操作数为零，就会停止。这对应于短路求值原则。\n\
  \n运算符的主要应用领域是在面向对象的环境中通过函数和方法调用读取数据。需要注意的是，它不适用于写入或设置值。\n\n下面的示例显示了使用可选 `DateTime`\
  \ 对象的 `Travel` 类的情况：\n\n```\nclass Travel { \n  public ?DateTime $start = null;\
  \ \n}  \n```\n\n这里没有创建此对象，因为它被刻意注释掉了：\n\n```\n//$travel->start = new DateTime();\
  \  \n```\n\n在这种情况下，空安全运算符介入，确定第二个操作数 `start` 的值为 `null`，并因此结束检查：\n\n```\n$arrival\
  \ = $travel?->start?->format('d.m.Y');  \n```\n\n结果输出的值为 `NULL`。\n\n以下是完整的代码：\n\n\
  ```php\n<?php\nclass Travel {\n    public ?DateTime $start = null;\n}\n\n$travel\
  \ = new Travel();\n$travel->start = new DateTime();\n\n$arrival = $travel?->start?->format('d.m.Y');\n\
  var_dump($arrival);\n\n?>  \n```\n\n**列表 5.7** 空安全运算符 (`nullsafe_operator.php`)\n\
  \n![\"DateTime\" 对象为空(bilderklein/klein05_010a.png) \n\n**图 5.9** \"DateTime\" 对象为空\n\
  \n空安全运算符与带空检查的条件运算符之间的区别并不完全直观；两者都可以广泛应用于某些场景。因此，这里是对最重要差异的简要概述：\n\n*   空安全运算符允许将带有短路求值的函数和方法调用连接起来。然而，使用条件运算符时，调用未知方法会导致错误。\n\
  *   空安全运算符不支持数组键。这意味着如果数组键不存在，它将返回错误：\n\n    ```\n    $a = array();\n    $b = $a['test']?->property;\
  \  \n    ```\n\n*   另一方面，条件运算符可以轻松接受空数组键并采用备用文本 \"Not available\"：\n\n    ```\n\
  \    $a = array();\n    $b = $a['test']?->property;  \n    ```\n\n\n\n\n\n通俗来说，这意味着：如果满足条件，则执行语句。如果条件不满足，则忽略这些语句。然后——无论在何种情况下——代码在\
  \ `if` 分支区分之后都会执行。大括号内的语句被称为语句块。\n\n接下来的示例检查儿童的年龄。年龄在这里通过源代码中的 `$age` 变量指定。当然，这也可以是表单中的用户输入或来自数据库的值。\n\
  \n```php\n<?php\n  $age = 4;\n  if ($age > 3) {\n    echo \"At $age years, the child\
  \ has outgrown infancy.\";\n  }\n?>  \n```\n\n**列表 5.8** \"if\" 分支区分 (`if.php`)\n\
  \n你认为会显示什么？没错：显示带有孩子年龄的文本（参见图 5.10）。\n\n如果你将 `$age` 变量的值改为 `3` 或更小的数字（例如），那么没有任何输出。因此，页面将保持为空，因为条件不满足，带有\
  \ `echo` 的输出语句完全没有执行。\n\n![孩子超过三岁](img/img-f5.10.html) \n\n**图 5.10** 孩子超过三岁\n\n\
  #### \"elseif\"\n\n在实践中，通常不仅有一个备选方案，而是有多个。一种可能的解决方案是简单连续编写几个 `if` 分支区分：\n\n```php\n\
  if ($age > 3) {\n  echo \"At $age, the child has outgrown infancy.\";\n}\nif ($age\
  \ >= 2) {\n  echo \"The $age year old baby can speak a little.\";\n}  \n```\n\n\
  如果变量 `$age` 的值为 `6` 会发生什么？因为这两个 `if` 分支区分互不相关，所以它们会被分别检查。由于两个条件都满足了，PHP 会执行两个语句（参见图\
  \ 5.11）。\n\n![一个只会说说话的六岁宝宝？这行不通。(bilderklein/klein05_012.png) **图 5.11** 一个只会说说话的六岁宝宝？这行不通。要在分支区分中检查多个条件，可以使用\
  \ `elseif`：```phpif (condition) {   statements; } elseif (condition) {   statements;\
  \ }  ````elseif` 语句块只有在 `if` 条件不满足且 `elseif` 条件满足时才会执行。接下来的示例使用 `elseif` 代替了上一个示例中的两个\
  \ `if` 语句。```php$age = 6; if ($age > 3) {   echo \"At $age years old, the child\
  \ has outgrown infancy.\"; } elseif ($age >= 2) {   echo \"The $age years old baby\
  \ can speak a little.\"; }  ```**列表 5.9** 使用 \"elseif\" 检查备选方案 (`elseif.php`)在这个示例中，首先检查\
  \ `if` 条件。因为满足了条件，所以执行语句块。然后 PHP 离开分支区分。因此，不再检查 `elseif` 条件。你可以在图 5.12 中看到结果。![只执行\
  \ \"if\" 语句块](img/img-f5.12.html) \n\n**图 5.12** 只执行 \"if\" 语句块\n\n### 注意\n\n你可以连续使用任意数量的\
  \ `elseif` 条件。一旦第一个条件满足，就会退出分支区分。\n\n#### \"else\"\n\n你可以用 `if` 和 `elseif` 覆盖很多情况，但通常不能覆盖所有。这就是为什么存在\
  \ `else` 语句块：\n\n```php\nif (condition) { \n  statements; \n} elseif (condition)\
  \ { \n  statements; \n} else { \n  statements; \n} \n```\n\n如果之前的任何条件都不满足，则始终执行\
  \ `else` 语句。在下面的示例中，`else` 语句并不适用。\n\n```php\n$age = 6;\nif ($age > 3) {\n  echo\
  \ \"At $age years old, the child has outgrown infancy.\";\n} elseif ($age >= 2)\
  \ {\n  echo \"The $age years old baby can speak a little.\";\n} else {\n  echo \"\
  The child is still very young.\";\n}\n```\n\n**列表 5.10** \"else\" 语句 (`else.php`)\n\
  \n![执行 \"else\" 语句](img/img-f5.13.html) \n\n**图 5.13** 执行 \"else\" 语句\n\n### 注意\n\
  \n`else` 语句实际上是 `if` 和 `elseif` 的组合。接下来的示例展示了 `else` 变体：\n\n```php\nif (condition)\
  \ { \n  statements; \n} elseif (condition) { \n  statements; \n} else { \n  statements;\
  \ \n} \n```\n\n#### 替代形式\n\n`if` 语句也可以使用冒号采用更短的形式：\n\n```php\nif (condition)\n \
  \ statements;\nelseif (condition)\n  statements;\nelse\n  statements;\n```\n\n这种语法在其他语言中更常见，但在\
  \ PHP 中也可用。接下来的示例展示了它的样子：\n\n```php\nif (condition) :\n  statements;\nelseif (condition)\
  \ :\n  statements;\nelse :\n  statements;\nendif;\n```\n\n#### 短写形式\n\n`if` 语句也可以写成单行：\n\
  \n```php\nif (condition) statement;\n```\n\n`elseif` 和 `else` 也可以这样写：\n\n```php\n\
  if (condition) statement; elseif (condition) statement; else statement;\n```\n\n\
  ### 5.2.2 \"switch\"\n\nPHP 中的第二种分支区分是 `switch`。它在各个分支中检查变量或表达式的值。如果某个值与变量的值匹配，则执行后续语句。`break`\
  \ 语句随后退出 switch 分支区分。\n\n\n\n\n\n```php\nswitch (Variable) {\n  case Value1:\n \
  \   Statements;\n    break;\n  case Value2:\n    Statements;\n    break;\n  case\
  \ Value3:\n    Statements;\n    break;\n}  \n```\n\n如果你想检查一个变量的不同的值，那么 `switch case`\
  \ 区分结构特别适用。在下面的列表和图 5.16 中，你可以看到一个示例。\n\n```php\n$age = 30;\nswitch ($age) {\n \
  \ case 29:\n    echo \"You are 29.\";\n    break;\n  case 30:\n    echo \"You are\
  \ 30.\"\n    break;\n  case 31:\n    echo \"You are 31.\"\n    break;\n}  \n```\n\
  \n**列表 5.14**      \"switch\" Case 区分 (`switch.php`)\n\n![出现第二个情况](img/img-f5.16.html)\
  \ \n\n**图 5.16**      出现第二个情况\n\n### \"break\"\n\n如果你在 `switch case` 区分结构中省略了 `break`\
  \ 语句，所有语句将从适用的 case 开始执行。这种行为有时是理想的，例如你想对多个 case 执行相同的相同的语句，但在下面的示例中，它导致了不想要的结果（参见图\
  \ 5.17）。\n\n```php\n$age = 30;\nswitch ($age) {\n  case 29:\n    echo \"You are\
  \ 29.\";\n  case 30:\n    echo \"You are 30.\";\n  case 31:\n    echo \"You are\
  \ 31.\";\n}  \n```\n\n**列表 5.15**      不带 \"break\" 的 \"switch\" Case 区分 (`switch_without.php`)\n\
  \n![没有 \"break\" 时执行了多个语句](img/img-f5.17.html) \n\n**图 5.17**      没有 \"break\"\
  \ 时执行了多个语句\n\n这种行为的背景很容易解释：`switch case` 区分结构会固执地逐行执行。如果满足条件，意味着后续的所有行都将执行执行。case\
  \ 行会被忽略，但所有普通语句都会被执行。这种行为有时是理想的，特别是当需要从某一点开始执行语句时。\n\n### 标准情况: \"default\"\n\n\
  如果所有 case 都没有发生，`switch` 仍然有一个标准情况。它以 `default` 关键字开始。语句紧跟在冒之后：\n\n```php\nswitch\
  \ (Variable) {\n  case value1:\n    statements;\n    break;\n  case value2:\n  \
  \  statements;\n    break;\n  default:\n    statements;\n}  \n```\n\n通过标准情况，你可以捕获在之前的\
  \ case 中没有考虑到的所有情况。在下面的简单示例中，标准情况负责处理所有年龄不在 29 到 31 岁之间的人（参见图 5.18）。\n\n```php\n\
  $age = 32;\nswitch ($age) {\n  case 29:\n    echo \"You are 29.\";\n    break;\n\
  \  case 30:\n    echo \"You are 30.\";\n    break;\n  case 31:\n    echo \"You are\
  \ 31.\";\n    break;\n  default:\n    echo \"You are not between 29 and 31.\";\n\
  \  }  \n```\n\n**列表 5.16**      带有 \"default\" 语句的 \"switch\" (`switch_default.php`)\n\
  \n![出现了标准情况](img/img-f5.18.html) \n\n**图 5.18**      出现了标准情况\n\n### 带有条件\n\n到目前为止，你只使用了\
  \ `switch`，但 `switch` 也允许你为单个 case 指定条件。例如，你可以按类别检查年龄。\n\n```php\nswitch (true)\
  \ {\n  case ($age >= [13, 19]):\n    echo \"You are in your teens.\";\n    break;\n\
  \  case ($age >= [20, 29]):\n    echo \"You are in your twenties.\";\n    break;\n\
  \  case ($age >= [30, 39]):\n    echo \"You are in your thirties.\";\n    break;\n\
  \  default:\n    echo \"You are in another age group.\";\n}  \n```\n\n**列表 5.17**\
  \      带有条件的 \"switch\" (`switch_condition.php`)\n\n### \"if\" 和 \"switch\" 的比较\n\
  \n当你使用 `if-else-if` 结构时，你可以执行复杂的条件。然而，在将单个变量与多个值进行比较时，`switch` 通常更加整洁。\n\n```php\n\
  if ($age < 20) {\n    echo \"You are a teenager.\";\n} elseif ($age < 30) {\n  \
  \  echo \"You are in your twenties.\";\n} elseif ($age < 40) {\n    echo \"You are\
  \ in your thirties.\";\n} else {\n    echo \"You are in another age group.\";\n\
  }\n```\n\nPHP 8.0 引入的 `match` 表达式为 `switch` 提供了一个更简洁的替代方案。与 `switch` 不同，`match`\
  \ 会返回一个值并使用严格比较。\n\n```php\n$result = match ($age) {\n  29 => \"You are 29.\",\n\
  \  30 => \"You are 30.\",\n  31 => \"You are 31.\",\n  default => \"You are not\
  \ between 29 and 31.\",\n};\n\necho $result;\n```\n\n\n\n\n\n```\n$result = match\
  \ (true) {  \n```\n\n在该情况的对应行中，我们将值替换为返回真值作为结果的检查：\n\n```\n$age >= 10 && $age <\
  \ 30 => \"你的年龄在 10 到 29 岁之间。\",  \n```\n\n一旦某行的该检查返回 `true`，`match` 就会触发并接受该行的返回值——即示例中的下一行：\n\
  \n```\n$age >= 50 && $age < 70 => \"你的年龄在 50 到 69 岁之间。\",  \n```\n\n##### Note\n\
  \n实际的测试在这里移动到了测试行。这意味着你可以在此处不进行严格类型的情况下进行测试。在我们的案例中，`>=` 和 `<` 被用作运算符。这意味着即使 `$age`\
  \ 是字符串而不是整数，该检查也会返回 `true`。\n\n接下来的行将被忽略，即使它们的检查也返回 `true`。\n\n```php\n$age = 55;\
  \ \n$result = match (true) { \n  $age >= 10 && $age < 30 => \"你的年龄在 10 到 29 岁之间。\"\
  , \n  $age >= 30 && $age < 50 => \"你的年龄在 30 到 49 岁之间。\", \n  $age >= 50 && $age\
  \ < 70 => \"你的年龄在 50 到 69 岁之间。\", \n  default => \"你不符合任何分类。\" \n}; \necho $result;\
  \  \n```\n\n**列表 5.20** 带有复杂检查的 \"match\" (`match_true.php`)\n\n![复杂检查找到了正确的值](img/img-f5.19.html)\
  \ \n\n**图 5.19** 复杂检查找到了正确的值\n\n##### Note\n\n在计划 `match` 分用例的分支区分时，已经在讨论一些一些功能增强，例如除了单行返回值外还支持语句块。因此，我们可以期待在下一个\
  \ PHP 版本中出现许多新功能。\n\n## 5.3 循环 (Loops)\n\n通过循环，你可以连续执行多次语句。PHP 知道四种循环，这些循环在其他编程语言中也相当常见。\
  \ 40  你现在将了解四种循环中的三种。最后一种 `foreach` 主要用于对象和数组。它将在第 11 章 中讨论。\n\n### 5.3.1 \"for\"\
  \n\n`for` 循环是所有循环中最方便的。它已经有三个参数来控制循环的行为：\n\n```php\nfor (start statement; condition;\
  \ run statement) { \n  statements; \n}  \n```\n\n它的工作原理如下：\n\n1. 启动语句在开始时执行一次。\n\
  2. PHP 接着检查条件。\n3. 如果满足条件，解释器则执行循环内的语句。如果不符合，则立即退出循环。\n4. 在语句块（大括号）中的语句执行之后，执行运行语句。\n\
  5. PHP 接着再次检查条件。\n6. 如果情况如此，则执行语句块中的语句，然后执行运行语句。\n7. 依此类推。\n\n启动语句、条件和运行语句用于控制循环运行的次数。它们共同构成了循环计数器。请看下面的示例。\n\
  \n```php\nfor ($i = 0; $i < 10; $i++) { \n  echo \"$i<br />\"; \n}\n```\n\n**列表\
  \ 5.21** \"for\" 循环 (`for.php`)\n\n在这里，变量 `$i` 在启动语句中初始化为值 `0`。它是计数变量。条件是 `$i` 保持小于\
  \ `10`。在语句块中，输出 `$i` 和一个换行符。运行语句使用自增将 `$i` 加 `1`。你能想象循环的输出吗？没错：从 `0` 到 `9` 的数字，如图\
  \ 5.20 所示。\n\n![从 9 开始的数字](img/img-f5.20.html) \n\n**图 5.20** 从 9 开始的数字\n\n#####\
  \ Note\n\n`$i`、`$j` 等经常用作计数变量。这不是强制要求的，但已成为一种常见的做法。\n\n### 死循环 (Endless Loops)\n\
  \n运行语句用于确保条件不再满足。如果这不起作用——即条件始终满足——那么循环将无限执行下去（见图 5.21）。\n\n```php\nfor ($i = 0;\
  \ $i < 10; $i--) { \n  echo \"$i<br />\"; \n}\n```\n\n**列表 5.22** 死循环 (`for_endless.php`)\n\
  \n这种循环被称为死循环。在最好的情况下，这将导致你的服务器产生沉重的计算负载。在测试时这不是问题；你只需点击浏览器的“取消”按钮即可结束它。然而，在生产系统中，死循环可能会导致许多问题，且原因可能难以找到。\n\
  \n![死循环导致错误](img/img-f5.21.html) \n\n**图 5.21** 死循环导致错误\n\n### 其他形式 (Other Forms)\n\
  \n在 PHP 中，有几种 `for` 循环的替代方案可以满足 `if` 情况区分。如果你不需要设置，可以省略启动语句。在下面的示例中，我们在 HTML 循环之前初始化了计数器。\n\
  \n```php\n$i = 0;\nfor (; $i < 10; $i++)\n```\n\n**列表 5.23** 省略启动语句的 \"for\" (`for_different.php`)\n\
  \n在这种情况下，你可以省略 `for` 循环的三个参数中的任何一个。如果语句块只包含一行，可以省略大括号。在下面的示例中，我们在语句块内更改了计数器。\n\n\
  ```php\nfor ( $i < 10; )\n  echo \"$i++\";\n```\n\n**列表 5.24** 省略运行语句的 \"for\" (`for_different.php`)\n\
  \n##### Note\n\n在实际操作中，如果你不需要设置，可以省略运行语句。这通常是 `for` 循环的 HTML 输出计数器（见图 5.22）。\n\n\
  ```php\n<?php\n  for ($i = 0; $i < 10):\n?>\n<p>Output: <?=$i ?></p>\n<?php\n  endfor;\n\
  ?>\n```\n\n**列表 5.25** 用于 HTML 输出的 \"for\" (`for_different.php`)\n\n![HTML 代码输出](img/img-f5.22.html)\
  \ \n\n**图 5.22** HTML 代码输出\n\n### 嵌套循环 (Nesting Loops)\n\n循环在 PHP 中可以根据需要嵌套。你只需要在一个循环的语句块中编写另一个循环。\n\
  \n```php\nfor ($i = 1; $i <= 10; $i++) { \n  echo \"Row $i: \"; \n  for ($j = 1;\
  \ $j <= 10; $j++) { \n    echo $j * $i . \" \"; \n  } \n  echo \"<br />\"; \n}\n\
  ```\n\n**列表 5.26** 嵌套 \"for\" 循环 (`for_nested.php`)\n\n这个示例形成了 10 行，每行包含 1 到 10\
  \ 乘以行号数字（见图 5.23）。\n\n![小乘法表](img/img-f5.23.html) \n\n**图 5.23** 乘乘法表\n\n### 5.3.2\
  \ \"while\"\n\n`while` 循环被认为是循环的母体——因为它出现在大多数编程语言中，而且其他循环类型都可以由它形成。\n\n`while` 循环只有一个“内置”功能——即条件：\n\
  \n```php\nwhile (condition) { \n  statements; \n}\n```\n\n只要条件为真，循环就会执行。然而，为了让循环在某处终止，条件的一部分必须发生变化。`for`\
  \ 循环为此提供了运行语句；在 `while` 循环中，你必须自己创建它。\n\n\n\n\n\n```php\n<?php \n  $i = 1; \n  while\
  \ ($i < 10) { \n    echo \"$i<br />\"; \n    $i++; \n  } \n?>  \n```\n\n**列表 5.27**\
  \ \"while\" 循环 (\"while.php\")\n\n变量 `$i` 是计数器变量。它在进入 `while` 循环之前进行了初始化。`while`\
  \ 循环本身只检查 `$i` 是否小于 10。只要满足该条件，语句就会执行。语句块还包含跳转语句（run-through statement）。在每次循环运行中，`$i`\
  \ 增加 1（参见 图 5.24）。\n\n![使用 \"while\" 循环输出数字 1 到 9](img/img-f5.24.html) \n\n**图 5.24**\
  \ 使用 \"while\" 循环输出数字 1 到 9\n\n#### 注意事项\n\n如果你想与 `for` 循环进行类比，它的语法看起来如下：\n\n```php\n\
  Start statement; \nwhile (condition) { \n  statements; \n  run-through statement;\
  \ \n} \n```\n\n### 其他形式\n\n`while` 循环还允许其他表示法。如果你喜欢缩短代码，有以下选项：\n\n1. 如果 `while`\
  \ 循环中只有一个语句，你可以省略大括号，并将所有内容写在一行。这与 `for` 循环类似，但跳转语句放在哪里呢？你可以（仅在简单情况下）使用自增或自减直接将其插入语句中。在\
  \ 列表 5.28 中，自增写在操作数之后。这意味着它只在语句执行后执行。\n\n    ```php\n    $i = 1;\n    while($i <\
  \ 10) echo $i++ . \"<br />\";  \n    ```\n\n    **列表 5.28** 此列表输出数字 1 到 9 (\"while_different.php\"\
  )\n\n2. `while` 循环还有冒号语法，在本例中用 `endwhile` 结束。这意味着 `while` 循环可以灵活地跨多个 PHP 代码块使用，类似于大括号的作用。\n\
  \n    ```php\n    $i = 1;\n    while ($i < 10):\n    ?>\n    <p>Output: <?=$i ?></p>\n\
  \    <?php\n    $i++;\n    endwhile;\n    ?>  \n    ```\n\n    **列表 5.29** 分布在多个\
  \ PHP 块中的 \"while\" (\"while_different2.php\")\n\n### \"break\" 和 \"continue\"\n\
  \n`break` 语句用于退出循环。因此，示例中的结构是可能的。\n\n```php\n<?php\n  $i = 1;\n  while (true) {\n\
  \    if ($i < 10) {\n      echo \"$i<br />\";\n      $i++;\n    } else {\n     \
  \ break;\n    }\n  }\n?>  \n```\n\n**列表 5.30** 专门通过 \"break\" 结束的循环 (\"break.php\"\
  )\n\n这是一个通过 `break` 结束的触发循环。它输出从 1 到 9 的数字。或者，你可以在 `break` 后面跟一个数字，表示从内部退出外部的循环次数。因此，\n\
  \n```php\nbreak 1;\n```\n\n对应于\n\n```php\nbreak;\n```\n\n然而，如果你现在嵌套了几个循环或额外嵌套了一个\
  \ `switch` 分支，你也可以指定更高的值来退出嵌套。以下示例显示了一个实际上会输出 1 到 9 数字的 `while` 循环。`switch` 语句用于检查与\
  \ 2 乘积的两种情况。如果乘积为 10，则只退出 `switch` 语句（在下一次循环之前不会进行检查）。但是，如果乘积为 16，则 `break` 语句将退出\
  \ `switch` 情况（数字 1）和 `while` 循环（数字 2）。这意味着 9 不再输出（参见 图 5.25）。\n\n```php\n<?php\n\
  \  $i = 1;\n  $j = 2;\n  while ($i < 10) {\n    echo \"$i\";\n    switch ($i * $j)\
  \ {\n      case 10:\n        echo \" * $j = 10\";\n        break;\n      case 16:\n\
  \        echo \" * $j = 16\";\n        break 2;\n    }\n    echo \"<br />\";\n \
  \   $i++;\n  }\n?>  \n```\n\n**列表 5.31** 带有数字规格的 \"break\" (\"break_number.php\"\
  )\n\n![循环在 8 处中断](img/img-f5.25.html) \n\n**图 5.25** 循环在 8 处中断\n\n`continue` 使用频率略低于\
  \ `break`，它中断当前的循环迭代，然后继续下一次迭代。以下示例说明了这一点。在这里，输出从 1 到 9 的数字。如果一个数字能被 2 整除 4，则跳转语句将被执行并进入下一次迭代。然而，如果条件不满足（参见\
  \ 图 5.26），This Example, the \"Odd Number\" Only Output if \"continue\" Was Not Used](img-f5.26.html)\
  \ \n\n**图 5.26** 在此示例中，“奇数”仅输出如果未使用“continue”\n\n实际上，如果条件不满足，跳转语句将被执行并进入下一次迭代。然而，如果条件不满足（参见\
  \ 图 5.26），This Example, the \"Odd Number\" Only Output if \"continue\" Was Not Used](img-f5.26.html)\
  \ \n\n**图 5.26** 在此示例中，“奇数”仅输出如果未使用“continue”\n\n实际上，如果条件不满足，跳转语句将被执行并进入下一次迭代。然而，如果条件不满足（参见\
  \ 图 5.26），在在循环嵌套的 `switch` 语句中，`continue` 后面跟一个数字来指定退出循环。\n\n。   ..3 do-while\n\n\
  最后引入的循环类型是 `do-while`。原理上，它的工作方式与 `while` 循环相似，不同是在循环执行之后检查条件。这意味着语句至少执行一次：\n\n\
  ```php\ndo { \n  statements; \n} while (condition)  \n```\n\n以下示例显示了输出从 1 到 9 数字的常规循环。\n\
  \n```php\n<?php\n  $i = 1;\n  do {\n    echo \"$i<br />\";\n    $i++;\n  } while\
  \ ($i < 10)\n?>  \n```\n\n**列表 5.35** \"do-while\" 循环 (\"dowhile.php\")\n\n到为止，与正常的\
  \ `while` 循环没有明显区别。只有当条件从开始就不满足时，它才会变得异常。在这种情况下，语句块至少执行一次。\n\n```php\n$i = 11;\n\
  do {\n  echo \"$i<br />\";\n  $i++;\n} while ($i < 10)  \n```\n\n**列表 5.36** \"\
  do-while\" 的特殊特性 (\"dowhile_once.php\")\n\n\n\n\n\n代码流中的跳转在 PHP 中不是经常常用的功能。`goto`\
  \ 算符在 PHP 5.3 中引入，非常容易使用：你插入一个标记。名称可以自由选择，并在后面加上一个冒号。然后你使用 `goto 标记名称` 调用该标记。中间的所有代码都会被跳过。在接下来的示例中，输出\
  \ 1 被忽略，然后显示输出 2（参见图 5.30）。\n\n```php\n<?php \ngoto marker; \necho 'output 1'; \n\
  \nmarker: \necho 'output 2'; \n?>  \n```\n\n**列表 5.37** 通过 \"goto\" 进行跳转 (\"goto.php\"\
  )\n\n![仅第二版内容可见。](img/img-f5.30.html) \n\n**图 5.30** 仅第二版内容可见。\n\n#### 注意事项\n`goto`\
  \ 不允许跳转到循环或 switch 分支区分中。这将导致致命错误（fatal error）。\n\n# 6 函数与语言结构\n\n函数是编程中封装频繁使用功能最简单的方法。简单来说，函数是语句的集合。你可以自己编写这些集合，或者它们由\
  \ PHP 或无限数量 PHP 扩展之一提供。\n\n语言结构（language construct）与 PHP 指定的函数非常相似。然而，在语言结构中你可以省略函数典型的圆括号。\n\
  \n## 6.1 函数\n\n函数易于使用。需要完成两个步骤：\n\n* 你必须定义函数（也称为声明函数）。对于 PHP 函数来说，这并不是的；因为它已经在那里定义好了。\n\
  * 之后你必须调用该函数，因为它只有在被调用时才会执行。\n\n要定义函数，请使用 `function` 关键字：\n\n```\nfunction Name()\
  \ { \n  statements; \n}  \n```\n\n`function` 关键字后面紧跟着函数名。圆括号是函数的特征。这里也是放置参数的地方（第\
  \ 6.1.1 节）。大括号包含语句。你已经通过分支判断和循环熟悉了这种语句块。要调用函数，请使用它的名称和圆括号：\n\n```\nName();  \n```\n\
  \n在接下来的简单示例中，函数在被调用时输出一条记录（参见图 6.1）。\n\n```php\n<?php\n  function output() {\n \
  \   echo \"This is a function.\";\n  }\n  output();\n?>  \n```\n\n**列表 6.1** 一个简单的函数\
  \ (\"function.php\")\n\n![函数的输出](img/img-f6.1.html) \n\n**图 6.1** 函数的输出\n\n####\
  \ 注意事项\n函数名遵循与变量名相同的规则，但不区分大小写。此外，它们只能由字母、数字和下划线组成，并且必须以字母或下划线开头。\n\n### 6.1.1 参数\n\
  \n函数类似于黑盒。功能包含在函数内部的语句中。调用者不需要确切知道语句的具体样子，但他们应该能够向函数传递信息。这通过参数可以实现。\n\n你在函数的圆括号之间编写参数。参数名称被视为变量名，并在函数内部可用：\n\
  \n```\nfunction Name($Parametername1, $Parametername2) { \n  statements; \n}  \n\
  ```\n\n当调用函数时，你必须为参数传递值：\n\n```\nName(Value1, Value2);  \n```\n\n这里有一个短小的示例。以下脚本接收两个参数。然后输出这些参数。调用随后传递了两个字符串作为参数（参见图\
  \ 6.2）。\n\n```php\n<?php\n  function output($par1, $par2) {\n    echo \"Parameter\
  \ 1: $par1<br />\";\n    echo \"Parameter 2: $par2\";\n  }\n  output(\"Hello\",\
  \ \"World\");\n?>  \n```\n\n**列表 6.2** 向函数传递参数 (\"function_parameters.php\")\n\n\
  ![参数被输出](img/img-f6.2.html) \n\n**图 6.2** 参数被输出\n\n#### 注意事项\n从 PHP 7.3 开始，解析器允许在函数和方法调用最后一个参数后加上逗号——即所谓的尾随逗号（trailing\
  \ comma）。因此，下面的调用不会导致解析错误，尽管它看起来相当丑陋：\n\n```\noutput(\"Hello\", \"World\",); \n\
  ```\n\n从 PHP 8 开始，在方法和函数定义参数时这也是允许的：\n\n```php\nfunction output($par1, $par2,) {\
  \ \n```\n\n即使在定义方法和函数的参数时这也是允许的，这让代码变得更灵活。\n\n#### 默认值\n\n如果你不确定是否总是传递值，可以为参数设置默认值。\n\
  \n```php\n<?php\n  function output($par = \"Default\") {\n    echo \"Parameter value:\
  \ $par\";\n  }\n  output();\n?>  \n```\n\n**列表 6.3** 默认值 (\"function_default.php\"\
  )\n\n默认值在函数未被调用时被使用（参见图 6.3）。这意味着在没有提供值时，也不会发生错误。你也可以在调用时传递值，这在某些情况下是有效的。\n\n![默认值出现在顶部和底部](img/img-f6.3.html)\
  \ \n\n**图 6.3** 默认值出现在顶部和底部\n\n#### 注意事项\n如果你使用多个参数，必须将带有默认值的参数放在最后：\n\n```\nfunction\
  \ output($par1, $par2 = \"Default\") { \n  echo \"Parameter 1: $par1<br />\"; \n\
  \  echo \"Parameter 2: $par2\";\n}\n```\n\n#### 灵活参数数量\n\n默认值是向函数传递过少参数的解决方法。你可以使用\
  \ `...` 算符（splat 算符）传递多个参数。它位于最后一个参数之前，并将所有传递参数作为一个数组。\n\n`...` 算符只能与函数的最后一个参数配合使用。但是可以在它前面插入一个或多个其他参数。这些参数也可以具有默认值。\n\
  \n#### 注意事项\n多个参数通常被称为重载（overloading）。然而，对象意义上的重载意味着为不同数量的参数提供了不同的函数。情况并非如此。\n\n\
  下一个列表显示了一个示例。\n\n```php\n<?php\n  function flexible($a, ...$params) {\n    $elements\
  \ = count($params);\n    echo $elements . '<br />';\n    echo $params[0] + $params[2];\n\
  \  }\n  flexible(0, 1, 2, 3);\n?>  \n```\n\n**列表 6.4** 使用 … 算符捕获多个参数 (\"function_flexible_\
  \ parameters.php\")\n\n调用时传递了四个参数。第一个值 0 是定义参数 `$a` 的值。其他三个参数作为数组创建在 `$params` 中。由于这是一个普通数组，你可以使用\
  \ `count()` 数组函数确定元素的数量，并使用索引访问各个参数值。\n\n在较早的 PHP 版本中，其实就可以处理过多的参数了。相关函数自 PHP 4\
  \ 起就存在并且仍然有效：\n\n\n\n\n\n*   `func_num_args()` 将传递的元素个数作为返回值返回——无论是否为其定义了参数。因此，以下脚本输出\
  \ 1。\n\n```php\nfunction func() {\n  $elements = func_num_args();\n  echo $elements;\n\
  \ }\nfunc(\"Test\");  \n```\n**Listing 6.5** 元素的数量 (\"function_func_num_args.php\"\
  )\n\n*   `func_get_args()` 返回一个包含传递参数的数组。以下脚本通过索引 `0` 从数组中读取第一个也是唯一的参数。\n\n```php\n\
  function func() {\n  $elements = func_get_args();\n  echo $elements[0];\n }\n func(\"\
  Test\");  \n```\n**Listing 6.6** 包含元素的数组 (\"function_func_get_args.php\")\n\n* \
  \  `func_get_arg(index)` 允许你直接访问元素，而无需通过数组绕路。该函数返回标记有特定索引的元素值。第一个参数的索引为 `0`。\n\n\
  ```php\nfunction func() {\n  $element = func_get_arg(0);\n  echo $element;\n }\n\
  \ func(\"Test\");  \n```\n**Listing 6.7** 直接访问参数 (\"function_func_get_arg.php\"\
  )\n\n### 命名参数\n\n命名参数（或命名属性）是 PHP 8 引入的一个新选项，允许在函数调用中直接为单个参数赋值，而无需遵循指定的顺序，也无需定义到目标参数为止的所有可选参数。\n\
  \n后者通过 PHP 8 创新中使用 `htmlspecialchars()` PHP 函数的示例进行了说明。在文档中，该函数有四个属性：\n\n```php\n\
  htmlspecialchars ( string $string , int $flags = ENT_COMPAT | ENT_HTML401 , string\
  \ $encoding = ini_get(\"default_charset\") , bool $double_encode = true ) : string\
  \  \n```\n\n如果你现在想更改 `htmlspecialchars()` 的第四个参数，但不更改之前的两个，只需使用命名参数直接访问第四个参数 `$double_encode`\
  \ 即可：\n\n```php\nhtmlspecialchars($string, double_encode: false);  \n```\n\n要实现这一点，我们编写不带\
  \ `$` 的参数变量名，并在冒号后写上参数值。必须遵循唯一顺序是：先写未命名的参数，再写命名的参数。当然，强制性参数——那些没有默认值的参数——不可缺失。\n\
  \n这个应用示例在 PHP 已经定义的函数语文中使用了命名参数。然而，这同样适用于你自己的函数以及对象的方法。要实现这一点，只需用经典方式用变量定义函数：\n\n\
  ```php\nfunction output($par1, $par2, $par3 = 'Default value') {  \n```\n\n在调用函数时，首先按照函数中定义的顺序定义未命名的参数。在这里，值\
  \ `hello` 因此对应于 `$par1`。命名参数以灵活的顺序随其后：\n\n```php\noutput(\"Hello\", par3: \"World\"\
  , par2: \"New\");  \n```\n\n下一个列表显示了完整的代码。\n\n```php\nfunction output($par1, $par2,\
  \ $par3 = 'Default value') { \n  echo \"Parameter 1: $par1<br />\"; \n  echo \"\
  Parameter 2: $par2<br />\"; \n  echo \"Parameter 3: $par3<br />\"; \n}\noutput(\"\
  Hello\", par3: \"World\", par2: \"New\");  \n```\n**Listing 6.8** 命名参数 (\"function_named_parameters.php\"\
  )\n\n**Figure 6.5** 使用命名参数的输出：调用顺序无关\n\n### 注意\n当然，命名参数允许在函数中剧烈调换参数。然而，为了代码的整洁，不建议这样做。这里的重点是。\n\
  \n### 1.2 变量的有效性\n当然，命名参数允许参数在函数中任意交换。但是，对于整洁的代码，这并不被推荐。这里的重点是。\n\n函数内的变量是局部的，函数外的变量是全局的。在\
  \ PHP 中，你可以使用 `global` 关键字来获取值。\n\n```php\n<?php\n$global = \"global\";\nfunction\
  \ output() {\n  global $global;\n  echo $global;\n}\noutput();\n?>\n```\n**Listing\
  \ 6.9** 变量的有效性 (\"function_validity.php\")\n\n**Figure 6.6** 局部变量与全局变量\n\n#### 全局\n\
  如果你想从函数获取某些值，必须使用 `global` 关键字。全局变量。\n\n```php\n<?php\n$global = \"global\";\nfunction\
  \ output() {\n  global $global;\n  echo $global;\n}\noutput();\n?>\n```\n**Listing\
  \ 6.10** 全局 (\"function_global.php\")\n\n**Figure 6.7** 函数内的全局变量\n\n#### $GLOBALS\n\
  通过 `return`，你只能接收一个返回值。数组通常用于获取多个值。你将在第 8 章学习更多关于数组的知识。以下示例生成了一个乘法表并将其作为数组返回（见图\
  \ 6.8）。\n\n```php\n<?php\nfunction multiplication($a) {\n  $products = [];\n  for\
  \ ($i = 1; $i <= 10; $i++) {\n    $products[$i] = $a * $i;\n  }\n  return $products;\n\
  }\n$result = multiplication(2);\nforeach ($result as $ele) {\n  echo \"$ele<br />\"\
  ;\n}\n?>\n```\n**Listing 6.11** 返回数组的函数 (\"function_array.php\")\n\n**Figure 6.8**\
  \ 数组形式的乘法表\n\n### 1.3 返回值\n使用参数，你可以向函数传递值。为了从函数获取某些内容，你需要 `return` 关键字。它会终止函数；`return`\
  \ 之后的所有语句都会被忽略。`return` 处的值会被返回。\n\n```php\nfunction Name(Parameter) { \n  Statements;\
  \ \n  return ReturnValue; \n}  \n```\n\n然后你需要对返回值进行操作。你可以直接输出它。然而，你通常将其保存在变量中：\n\
  \n```php\n$Variable = Name(Parameter);  \n```\n\n### 注意\n没有返回值的函数实际上过程。在 PHP 中，这种区分是没有意义的。这就是为什么我们通常称之为函数。\n\
  \n下一个列表显示了一个简单的示例。函数接收一个参数，添加一个字符串并返回它。返回值随后被输出。\n\n```php\n<?php\n  function output($par)\
  \ {\n    return \"Hello $par\";\n  }\n  $return = output(\"world\");\n  echo $return;\n\
  ?>  \n```\n**Listing 6.12** 带返回值的函数 (\"function_return.php\")\n\n#### Tips\n函数，特别是带有返回值的函数，在包含更复杂的语句并被多次使用时，才能发挥其全部作用。\n\
  \n#### 多重返回值\n通过 `return`，你只能接收一个返回值。数组通常用于获取多个值。\n\n#### 返回引用\n\n\n\n\n\n你可以通过引用用的接收函数的返回值。要做到这一点，在函数名和调用函数时输入符号\
  \ &.[44\n\n```php\n<?php\n  $authors = [\"tobias\", \"christian\"];\n\n  function\
  \ &return(&$authors, $i) {\n      print_r($authors);\n      print \"<br />\";\n\
  \      return $authors[$i];\n  }\n \n  $author = &return($authors, 1); //$author\
  \ == \"christian\"\n  $author = \"wolfgang\"; //$author == \"wolfgang\"\n  print_r($authors);\n\
  ?>  \n```\n\n**列表 6.14** 引用返回 (\"function_reference.php\")\n\n当你从函数接收到较大的数组或对象返回时，这种变体非常有用。由于传递的是引用而不是数组或对象本身（参见图\
  \ 6.9），这种方法可以提高性能。\n\n![由于函数是通过引用调用的，数组的第二个元素发生了变化](img/img-f6.9.html) \n\n**图 6.9**\
  \ 由于函数是通过引用调用的，数组的第二个元素发生了变化\n\n### 6.1.4 变量中的函数名\n\nPHP 中经常提到一种选项：45 你可以将函数名保存在变量中，然后像使用原始函数调用一样使用它们。这里有一个示例：函数名为\
  \ `output()` 并期望一个参数。你可以将函数名保存在变量中，然后使用圆括号和必要的参数来调用该变量。\n\n```php\n<?php\n  function\
  \ output($par) {\n    echo \"Hello $par\";\n  }\n  $functionname = \"output\";\n\
  \  $functionname(\"PHP 8.3\");\n?>  \n```\n\n**列表 6.15** 函数名存储在变量中 (\"function_variables.php\"\
  )\n\n### 注意\n\n要测试变量是否包含一个可调用函数，你可以使用 `is_callable(Variable)` 函数。它返回一个布尔值。\n\n尽管此功能非常令人兴奋，但它有两个缺点：首先，性能会受到微影响，因为\
  \ PHP 总是必须先检查带圆括号的变量是否为函数。其次——这是一个严重得多的缺点——由于这种结构，代码变得非常难以理解。由于这个原因，该功能在实践中仅用于特殊情况，例如在使用\
  \ `usort()` 使用单独的函数进行排序时。\n\n### 6.1.5 匿名函数\n\n匿名函数，也称为闭包（closures），是——顾如其义——没有名字的函数。匿名函数定义在其他函数调用中，也可以赋值给变量。下面的示例将匿名函数赋值给变量\
  \ `$output`，然后可以任何时候再次调用它。\n\n```php\n$output = function($parameter) {\n    echo\
  \ 'My ' . $parameter . '<br />';\n};\n\n$output('Output 1');\n$output('Output 2');\n\
  ?>  \n```\n\n**列表 6.16** 匿名函数的使用 (\"anonymous_functions.php\")\n\n### 注意\n\n如所述，匿名函数可以在其他函数调用中使用。在那些地方它们是所谓的回调函数。一个例子是使用\
  \ `usort()` 进行排序。然而，匿名函数也可以通过 `call_user_func()` 在调用中使用。\n\n![匿名函数的输出](img/img-f6.10.html)\
  \ \n\n**图 6.10** 匿名函数的输出\n\n匿名函数也可以在其他函数内部使用在这种情况下，你可以使用 `use` 关键字将变量分配给匿名函数，然后这些变量在函数内部可用。\n\
  \n```php\nfunction output($separator) {\n  $address = 'My ';\n  $func = function($parameter)\
  \ use ($address, $separator) {\n    echo $address . $parameter . $separator;\n \
  \ };\n \n  $func('Output 1');\n  $func('Output 2');\n}\noutput('<br />');\n?>  \n\
  ```\n\n**列表 6.17** 匿名函数中的变量 (\"anonymous_functions_variables.php\")\n\n### 提示\n\n\
  使用 `func_num_args()`、`func_get_arg()` 和 `func_get_args()` 重载函数的选项在匿名函数中也可用。\n\n\
  ### 注意\n\n从 PHP 5.6 开始，`use` 也可以用于函数和常量。从 PHP 5.4 开始，你也可以在闭包中使用 `$this`，但仅当匿名方法是类的一部分时才。\n\
  \n### 6.1.6 递归函数\n\n递归函数是调用自身的函数。递归函数可以使用类似于循环的方式，例如。这意味着函数调用位于函数内部。然而，你仍然需要一个变化，否则你将导致递归函数产生无限循环。\n\
  \n下面的脚本使用递归函数计算阶乘 46\n\n```php\n<?php\n  function factorial($i) {\n    if ($i >\
  \ 0) {\n      return $i * factorial($i-1);\n    } else {\n      return 1;\n    }\n\
  \  }\n  echo factorial(5);\n?>  \n```\n\n**列表 6.18** 使用递归函数的阶乘 (\"function_recursive.php\"\
  )\n\n![5 的阶乘](img/img-f6.11.html) \n\n**图 6.11** 5 的阶乘是 120\n\n你可以通过循环获得相同的结果，如下：\n\
  \n```php\n$result = 1; \nfor ($i = 5; $i > 0; $i--) { \n  $result *= $i; \n}\necho\
  \ $result;\n```\n\n**列表 6.19** 循环阶乘 (\"loop_factorial.php\")\n\n递归函数在某些情况下被认为是优雅的，许多计算机科学家非常欣赏它。然而，对于那些没有写过的人来说，它通常难以阅读。\n\
  \n#### 生成器\n\n生成器基本上是在 `foreach` 中使用的函数，它们多次返回。而不是使用 `return`，而是使用 `yield`。\n\n\
  下面的示例定义了一个累加开始和结束之间数字的函数。增量可以通过单独参数选择。\n\n```php\n<?php\n  function add($start,\
  \ $end, $step = 1) {\n    if ($start < $end) {\n      $result = 0;\n      for ($i\
  \ = $start; $i <= $end; $i += $step) {\n        $result += $i;\n        yield $result;\n\
  \      }\n    }\n  }\n \n  foreach (add(2, 10, 2) as $result) {\n    echo $result\
  \ . '<br />';\n  }\n?>  \n```\n\n**列表 6.20** 用于迭代的生成器 (\"function_generator.php\"\
  )\n\n在示例中，结果直接输出（参见图 6.12](#06_001.html#f6.12)）。然而，它们也可以用于直接填充数组，例如。后者可能会大量数据填充工作内存。\n\
  \n![你可以看到累加过程](img/img-f6.12.html) \n\n**图 6.12** 你可以看到累加过程\n\n#### 静态变量\n\n局部变量——即只存在函数内部的变量——每次调用函数时都会重置。这就是为什么在上一节的阶乘示例中计数器必须作为参数传递。\n\
  \n然而，你也可以使用静态关键字创建静态变量，如下例所示。\n\n```php\n<?php\n  function factorial() {\n    static\
  \ $i = 3;\n    if ($i > 0) {\n      return $i-- * factorial();\n    } else {\n \
  \     return 1;\n    }\n  }\n  echo factorial();\n?>  \n```\n\n**列表 6.21** 阶乘的静态变量\
  \ (\"function_static.php\")\n\n### 6.1.7 类型声明\n\n\n\n\n类型声明允许你为函数参数和函数返回值指定固定数据类型。自\
  \ PHP 7 以来，这许多内容都是新的：从 PHP 7 开始，函数参数可以使用标量数据类型——`int`、`float`、`string` 和 `bool`。在此之前，已经可以按名称指定类和接口、数组（`array`）、用于可调用函数的\
  \ `callable` 等。\n\n返回值的数据类型指定在 PHP 7 中是完全新颖。它们通过函数名后的冒号隔开。接下来的示例为每个参数和返回值定义了整数类型。PHP\
  \ 默认会执行类型转换。\n\n```php\n<?php\n  function sum(int ...$a): int {\n    return array_sum($a);\n\
  \  }\n  $result = sum(1, '2', 3.7);\n  var_dump($result);\n?>  \n```\n\n列表 6.22\
  \ 参数和返回值的类型声明 (`typedeclaration.php`\")\n\n### 注意\n\n从 `float` 到 `int` 的类型转换不是四舍五入，而是丢弃小数部分！因此，这种操作已弃用。\n\
  \n![多亏了类型转换，输出返回值为 \"6\" 的整数 —— 但同时也显示已弃用](img/img-f6.13.html) \n\n图 6.13 多亏了类型转换，输出返回值为\
  \ \"6\" 的整数 —— 但同时也显示已弃用\n\n如果你更改之前显示的脚本，并在参数和返回值中使用 `float` 代替 `int`，那么 6.7 将以\
  \ `float` 输出（参见 图 6.14）：\n\n```php\nfunction sum(float ...$a): float { \n  return\
  \ array_sum($a); \n}  \n```\n\n![如果为参数和返回值指定 \"float\"，结果为 \"6.7\"](img/img-f6.14.html)\
  \ \n\n图 6.14 如果为参数和返回值指定 \"float\"，结果为 \"6.7\"\n\n### 严格类型\n\n默认情况下，PHP 会自动转换类型。然而，这有时会导致你的编程中出现错误，且在调试时难以发现。出于此原因，也可以强制执行严格类型处理。此设置通过\
  \ `declare()` 函数完成。在下一个示例中，`strict_types` 的值被设置为 1。\n\n```php\n<?php\n  declare(strict_types=1);\n\
  \n  function sum(float ...$a): string {\n    return array_sum($a);\n  }\n  $result\
  \ = sum(1, '2', 3.7);\n  var_dump($result); \n?>  \n```\n\n列表 6.23 带有严格检查的错误 (`typedeclaration_error.php`\"\
  )\n\n此脚本中有多种错误。首先，第二个参数是 `string`；其次，返回值没有被正确地声明为 `string`。然而，PHP 只会报告第一个类型错误（参见\
  \ 图 6.15）。因此，“被抛出”的错误是一个 `TypeError` 致命错误。\n\n![\"TypeError\" 跳跃到了错误的参数](img/img-f6.15.html)\
  \ \n\n图 6.15 \"TypeError\" 跳跃到了错误的参数\n\n### 敏感参数\n\n敏感参数是 PHP 8.2 中引入的新特性。它们防止函数参数的输出，例如在调试信息中。此功能用于关键或个人数据，如密码。这些数据应该被标记，之后将不再在错误消息中输出。\n\
  \n通过在相应参数之前指定 `Sensitive` 来标记参数（参见 第 11 章、第 11.4.12 节，该概念在该节引入）。接后的示例展示了使用和不使用该参数的情况。错误本身在示例中是构造的。\n\
  \n```php\n<?php\n  function password_edit(string $password): string {\n    throw\
  \ new Exception('Error');\n    return md5($password);\n  }\n  try {\n    $result\
  \ = password_edit(\"Secret password\");\n  } catch (Exception $e) {\n    echo $e;\n\
  \  }\n  echo '<br /><br />';\n  \n  function password_edit_secure(SensitiveParameter\
  \ $password): string {\n    throw new Exception('Error');\n    return md5($password);\n\
  \  }\n  try {\n    $result = password_edit_secure(\"Secret password\");\n  } catch\
  \ (Exception $e) {\n    echo $e;\n  }\n?>  \n```\n\n列表 6.24 敏感参数的使用 (`sensitive_parameters.php`\"\
  )\n\n![密码在顶部的错误消息中显示并在底部被覆盖](img/img-f6.16.html) \n\n图 6.16 密码在顶部的错误消息中显示并在底部被覆盖\n\
  \n### void 无返回\n\n如果一个函数没有返回值，自 PHP 7.1 起，该类型也可以是 `void`。在这种情况下，函数必须不使用返回（参见 图 6.14）：\n\
  \n```php\n<?php\nfunction display(): void {\n    echo \"Hello World\";\n}\n?>\n\
  ```\n\n列表 6.25 void 无返回 (`typedeclaration_void.php`\")\n\n![多亏了类型转换，输出返回值为 \"6\"\
  \ 的整数 —— 但同时也显示已弃用](img/img-f6.13.html) \n\n图 6.13 多亏了类型转换，输出返回值为 \"6\" 的整数 —— 但同时也显示已弃用\n\
  \n由于 PHP 7.1，如果函数没有返回值，该类型也可以是 `void`。在这种情况下，函数必须不使用返回（参见 图 6.14）：\n\n```php\n<?php\n\
  function display(): void {\n    echo \"Hello World\";\n}\n?>\n```\n\n列表 6.26 void\
  \ 无返回 (`typedeclaration_void.php`\")\n\n由于 PHP 7.1，如果函数没有返回值，该类型也可以是 `void`。在这种情况下，函数必须不使用返回（参见\
  \ 图 6.14）：\n\n```php\n<?php\nfunction display(): void {\n    echo \"Hello World\"\
  ;\n}\n?>\n```\n\n列表 6.25 void 无返回 (`typedeclaration_void.php`\")\n\n\n\n\n\nDNF\
  \ 类型从 PHP 8.2 版本开始扩展了 PHP，允许将联合类型（union types）和交叉类型（intersection types）相结合。在这里，交叉类型是联合类型中的多个选项之一。在接下来的示例中，函数的返回值可以是整数、字符串，或者\
  \ `type1` 或 `type2` 的对象：\n\n```\nfunction functionname(): (type1&type2)|int|string\
  \ {  \n```\n\n以下示例是完整脚本的节选。\n\n```\nfunction sum(int|string|float ...$a): (type1&type2)|int|float\
  \ {  \n```\n\n**列表 6.28**      DNF 类型允许任意混合 (\"dnf_types.php\")\n\n### 使用混合类型进行类型声明\n\
  \n`mixed` 类型是 PHP 8 中新引入的类型，用于你无法或不想指定特定类型，但仍想进行类型声明的情况。\n\n基本上，`mixed` 除此没有其他含义，它意味着任何类型都可以在此处传递或返回。如果你将其写成联合类型，它会像这样：\n\
  \n```\narray|bool|callable|int|float|object|resource|string|null  \n```\n\n以下示例展示了我们累加参数的示例函数。\n\
  \n```\nfunction sum(mixed ...$a): mixed { \n  return array_sum($a); \n} \n$result\
  \ = sum(1, '2', 3.7); \nvar_dump($result);  \n```\n\n**列表 6.29**     使用不同类型进行类型声明\
  \ (\"typedeclaration_mixed.php\")\n\n### 提示\n\n由于在 PHP 8 中，即使省略了类型声明，PHP 也会自动允许任何类型，因此产生了一个问题：为什么还需要\
  \ `mixed` 呢？背后有一个根本性的决定：如果你始终使用类型检查，有时仍然会出现你无法或不想指定类型的情况。在这种情况下，你使用 `mixed` 来精确地标记这些位置。\n\
  \n### 使用 Never 类型进行类型声明\n\n`never` 类型自 PHP 8.1 起引入的新类型，它是一种纯返回类型，表示函数不会结束，因此不返回任何内容。这意味着函数必须通过\
  \ `exit()` 退出，或者进入无限循环或生成异常。\n\n```php\n<?php \n  function output(string $a): never\
  \ { \n    echo $a; \n    exit(); \n  } \n  $result = output('output'); \n?>  \n\
  ```\n\n**列表 6.30**     使用 \"never\" 的函数返回类型声明 (\"never.php\")\n\n### 注意\n\n如果前面的脚本中缺少\
  \ `exit()`，结果将是一个致命错误。\n\n### 6.1.8 枚举\n\n枚举（Enumerations，通常简称为 enums）是列表，用于指定参数、返回值或其他数据类型可能允许的取值范围。在开发中，它们也出现在数据库层面，描述数据字段可以取哪些值。它们从\
  \ PHP 8.1 版本开始就可用了。它们主要用于面向对象的开发，但也可以用于函数类型。\n\n符号表示非常简单。关键字是 `enum`，后面跟上名称。单个值通过\
  \ `case` 关键字声明：\n\n```\nenum values \n{ \n    case case1; \n    case case2; \n \
  \   case case3; \n    case case4; \n}  \n```\n\n然后使用双冒号语法访问值：\n\n```\n$value = values::case3;\
  \  \n```\n\n完整使用时，它看起来如下所示。在函数调用的相应函数参数中，`enum` 被指定为类型：\n\n```\nfunction output(values\
  \ $parameter) {  \n```\n\n该参数随后可以在函数中使用。在接下来的简单示例中，switch case 区分访问了各个值，并在每个 case\
  \ 中执行输出。\n\n```php\n<?php\nenum values\n{\n    case case1;\n    case case2;\n  \
  \  case case3;\n    case Case4;\n}\n \nfunction output(values $parameter) {\n  switch\
  \ ($parameter) {\n    case values::case1:\n      echo \"case1\";\n      break;\n\
  \    case values::case2:\n      echo \"case2\";\n      break;\n    ...\n  }\n}\n\
  \ \n$value = values::case3;\noutput($value);\n?>  \n```\n\n**列表 6.31**     枚举定义固定值\
  \ (\"enumerations.php\")\n\n#### 带有标量值的枚举\n\n枚举也可以与标量值结合使用；这种技术的术称为带备份枚举（backed\
  \ enums）。在这里，整数或字符串被赋值为枚举的值。\n\n当使用枚举来从数据库或导入中转换数据字段时，这总是实用的，因为那里的数据字段通常具有简单的标量值。\n\
  \n声明再次简单。`enum` 被一个类型声明所补充——即 `int` 或 `string`。你可以在各个 case 中定义值：\n\n```\nenum values\
  \ : int \n{ \n    case case1 = 1; \n    case case2 = 2; \n    case case3 = 3; \n\
  \    case case4 = 4; \n}  \n```\n\n为了带标标量值访问正确的 case，PHP 为枚举提供了两种方法：\n\n* `from(value)`\
  \ 返回与标量值匹配的枚举 case。如果值不存在，PHP 会抛出 `ValueError`。\n* `tryFrom(value)` 执行的操作基本上相同，区别在于如果值不存在，它会返回零。因此，这种变体适用于例如数据源可能来自不可靠的值，并且需要实现单独错误处理函数的情况。\n\
  \n在接下来的示例中，输出了 `case2`。\n\n```php\n<?php \nenum values : int \n{ \n    case case1\
  \ = 1; \n    case case2 = 2; \n    case case3 = 3; \n    case case4 = 4; \n} \n\n\
  function output(values $parameter) { \n  ... \n} \n\n$value = values::from(2); \n\
  \noutput($value); \n?>  \n```\n\n**列表 6.32**     带标量值的枚举 (\"enumerations_scalar.php\"\
  )\n\n### 6.1.9 有帮助且实用的信息\n\n本节总结了一些有时需要的有趣帮助函数和代码段。\n\n#### 测试函数\n\n如果你使用函数，还应该检查函数是否存在，特别是对于更复杂的脚本。当你正在使用来自库的外部函数时，这一点同样重要。\n\
  \n最简单的方法看起来如下：\n\n```\nif (output()) { \n  echo output(); \n}  \n```\n\n不幸的是，如果函数不存在，这种检查将会失败（参见图\
  \ 6.18）。在这一点上，它是不可接受的。\n\n![函数不存在](img/klein06_15.png)\n\n**图 6.18**     函数不存在\n\
  \n使用 `function_exists(function_name)` 辅助函数检查效果更好。它接收函数名作为参数并返回布尔值。在接下来的行中，如果函数存在则执行它：\n\
  \n```\nif (function_exists(\"output\")) { \n  echo output(); \n}  \n```\n\n### 提示\n\
  \n你也可以用精确相等来测试数据类型：\n\n```\nif (function_exists(\"output\")) && output() === \"\"\
  ) { \necho output(); \n} \n```\n\n### \"isset()\"\n\n`isset(Parameter)` 函数你对变量非常熟悉。它检查变量是否已声明。你也可以在函数内部对参数使用该函数。对于值为\
  \ `NULL` 的参数，`isset()` 将它们视为未设置，因此返回假。相反，一个空字符串（`\"\"`）是已设置。\n\n```php\nfunction\
  \ output($par = NULL) {\n  if (isset($par)) {\n    return \"Hello $par\";\n  } else\
  \ {\n    return \"Hello without parameters\";\n  }\n}\n$return = output();\necho\
  \ $return;  \n```\n\n**列表 6.33**     \"isset()\" (\"isset.php\")\n\n之前的脚本返回“没有参数”，因为参数未设置，因此使用了默认值\
  \ `NULL`。\n\n### 注意\n\n警告：如果默认值没有设置为 `NULL`，那么 PHP 解释器将生成警告，因为参数不存在！\n\n#### \"\
  create_function()\"\n\n`create_function(parameters, statements)` 辅助函数仅适用于 PHP 7.3。在\
  \ PHP 8 中，它已被废弃，因为匿名函数提供了实用的替代方案。这意味着即使在旧的 PHP 版本中，最好也不使用它。\n\n如果你在旧代码中遇到该函数，通常会看到它被用于动态创建一个没有函数名称的函数（参见图\
  \ 6.19）。这种过程也被称为 lambda 风格。动态创建的函数在程序执行（运行时）需要更改代码或参数时是非常用的。\n\n\n\n\n\n```php\n\
  <?php \n  $function = create_function('$par', 'echo \"Hello \" . $par;'); \n  $function(\"\
  World\"); \n>  \n```\n\n**列表 6.34** `create_function()` (`create_function.php` )\n\
  \n![动态生成函数的输出](img/img-f6.19.html) \n\n**图 6.19** 动态生成函数的输出\n\n#### `call_user_func()`\n\
  \n辅助函数 `call_user_func(function name, parameter1, parameter2)` 用于调用函数。\n\n```php\n\
  function difference($a, $b) { \n  return $a - $b; \n} \necho call_user_func(\"difference\"\
  , 5, 2);  \n```\n\n**列表 6.35** `call_user_func()` (`call_user_func.php` )\n\n上述脚本输出了正确的结果\
  \ 3。`call_user_func()` 主要在需要动态构建参数时使用。\n\n此外，还有 `call_user_func_array(function name,\
  \ parameter array)`。使用此辅助函数，所有参数都存储在一个数组中，而不是用逗号分隔。\n\n### 6.1.10 PHP 函数\n\nPHP\
  \ 的功能主要体现在函数上。因此，PHP 文档最重要的部分是函数引用。你可以在文档中找到它，或者直接访问 [`php.net/manual/funcref.php`](http://php.net/manual/funcref.php)。到目前为止介绍的函数（它们可以帮助你编写自己的函数）也可以在函数引用中找到（参见图\
  \ 6.20）。\n\n### 注意\n\nPHP 函数本身也在不断进一步开发。这里是两个例子：从 PHP 5 开始，许多扩展（也）已转换为面向对象的操作。它们现在通过对象、方法和属性访问功能。在\
  \ PHP 8 中，PHP 自身函数的类型错误处理——在某些地方——终于标准化为 `TypeError` 错误。\n\n![PHP 函数引用](img/img-f6.20.html)\
  \ \n\n**图 6.20** PHP 函数引用\n\n在文档中，函数的语法表示样式类似于实际函数的声明样式。这里有一个使用 `htmlspecialchars()`\
  \ 的例子：\n\n```php\nhtmlspecialchars ( string $string , int $flags = ENT_COMPAT |\
  \ ENT_HTML401 , string $encoding = ini_get(\"default_charset\") , bool $double_encode\
  \ = true ) : string  \n```\n\n首先是函数名。参数紧跟在圆括号。每个参数之前都是该函数预期的数据类型。`mixed` 表示任何数据类型。\n\
  \n可选参数（不一定需要设置的参数）在文档中以其相应的默认值列出。这些可以是简单的值，也可以像本示例一样是常量或函数调用。\n\n最后，是函数返回的数据类型的缩写。对于\
  \ `isset()`，这是一个布尔值（`bool`）。特殊数据类型 `void` 表示函数没有返回值或不需要参数。\n\n### 提示\n\n如果你直接在 `php.net/`\
  \ 之后输入函数名——例如 `php.net/html specialchars`——那么你将直接跳转到相应函数的文档。\n\n## 6.2 语言结构\n\n\
  语言结构不是函数。然而，它们与函数非常相似。你可以通过两种方式辨别区别：\n\n* 语言结构可以包含不带圆括号的参数。因此，\n\n```php\necho \"\
  Test\";  \n```\n\n与\n\n```php\necho(\"Test\");\n```\n\n都是可能的。\n\n* 语言结构不能存储在变量中，且无法访问该变量。因此以下操作会失败（参见图\
  \ 6.21）：\n\n```php\n<?php\n  $functionname = \"echo\";\n  $functionname(\"test\"\
  );\n?>  \n```\n\n![调用 \"echo()\" 函数失败是因为它是语言结构](img/img-f6.21.html) \n\n**图 6.21**\
  \ 调用 \"echo()\" 函数失败是因为它是语言结构\n\n即使在这两个始终适用的点点之外，语言结构还有一些特殊特性。例如，`echo()` 可以接受多个参数，例如：\n\
  \n```php\necho \"Hello \", \"PHP 8.3\";  \n```\n\n或者\n\n```php\necho (\"Hello \"\
  ), (\"PHP 8.3\");\n```\n\n然而，如果参数被包含在圆括号内，则会失败（参见图 6.22）：\n\n```php\necho (\"Hello\
  \ \", \"PHP 8.3\");  \n```\n\n![\"带圆括号的 \"echo()\"产生语法错误](img/img-f6.22.html) \n\
  \n**图 6.22** 带圆括号的 \"echo()\"产生语法错误\n\n### 提示\n\n最后，了解你正在处理的是语言结构还是函数是很重要的。某些语言结构用于输出。\n\
  \n### 6.2.1 Heredoc\n\n对于较长的字符串，PHP 提供了 heredoc 语法，它最初来自 Perl。你用 `<<<` 开始 heredoc。\n\
  \n```php\n<?php \n  $test = <<<HERE\nContent of the heredoc text \nspread over several\
  \ lines \nand expanded.\n HERE;\n\n echo $test; \n?> \n```\n\n**列表 6.36** \"heredoc\"\
  \ (`heredoc.php`)\n\n![在浏览器中消失但在源代码中可见](img/img-f6.23.html) \n\n**图 6.23** 在浏览器中消失但在源代码中可见\n\
  \n### 注意\n\nheredoc 的开始和结束必须由相同的单词组成。注意大小写是有的。在 PHP 7.2 之前，该结束名称必须位于行首并后跟分号。名称周围不允许任何字符或空格。\n\
  \n从 PHP 7.3 开始，这种限制不再如此严格：可以出现空格，并且可以省略分号。然而，也有一些陷阱：首先，只有当上面的字符串内容也缩进时才允许缩进；其次，非常重要的是名称本身不能是内容的一部分，否则会导致解析错误。看以下示例：\n\
  \n```php\n<?php\n$test = <<<Content\nContent of the heredoc text \nspread over several\
  \ lines \nand expanded.\n Content;\n\n echo $test; \n?> \n```\n\n在这个示例中，heredoc\
  \ 被称为 `Content`，而这个名称出现在字符串的第一行。之后的所有内容都会导致解析错误（参见图 6.24），因为字符串在名称第二次出现后就结束了。\n\n\
  ![解析错误：名称已出现在内容中](img/img-f6.24.html) \n\n**图 6.24** 解析错误：名称已出现在内容中\n\n在 heredoc\
  \ 字符串内部，你可以使用双引号中也允许的所有转义序列。变量的值也会插入到字符串中。\n\n### 6.2.2 Nowdoc\n\n与 heredoc 非常相似的是\
  \ nowdoc 语法。唯一的区别是它不像双引号字符串那样反应，而是像单引号字符串。这从语法本身也可以看出来。这与 heredoc 完全一样，只是起始关键字被包含在单引号中。\n\
  \n\n\n\n\n```php\n<?php \n$test = <<<'NOW' \nContent of the nowdoc text \nspread\
  \ over several lines \nand expanded.\nNOW;\n\n echo $test; \n?>  \n```\n\n**Listing\
  \ 6.37** \"nowdoc\" 语法 (`nowdoc.php`)\n\n在 nowdoc 字符串中无法插入变量，这与单引号的对应。字符串中的所有内容都将直接输出。其他情况下，行为没有区别。字符串的结束标记必须与开始标记使用相同的关键词，但不需要加引号。在这里也必须区分大小写。在\
  \ PHP 7.2 之前，字符串的结束标记必须单独起一行，且不能有缩进，并在后面直接紧跟一个分号。\n\n### 6.2.3 格式化字符串\n\n通过 `printf(default-string,\
  \ parameter)`，你可以输出一个字符串并将其他参数作为占位符。占位符由百分号 `%` 后面跟一个指示要输出的参数数据类型的字母组成。\n\n```php\n\
  <?php \n  $sum = 200; \n  $format = \"%d Euro\"; \n  printf($format, $sum); \n?>\
  \  \n```\n\n**Listing 6.38** `printf()` (`printf.php`)\n\n前面的脚本生成以下输出：\n\n```\n\
  200 Euro\n```\n\n如果你使用多个参数，可以对占位符进行编号，以确保始终使用正确的参数（参见 图 6.25）。\n\n```php\n<?php\
  \ \n  $sum1 = 200; \n  $sum2 = 400; \n  $format = \"%2\\$d euros are more than %1\\\
  $d euros\"; \n  printf($format, $sum1, $sum2); \n?>  \n```\n\n**Listing 6.39** 用数字交换占位符\
  \ (`printf_multiple.php`)\n\n![第二个参数出现在第一个参数之前](img/img-f6.25.html)\n\n**Figure\
  \ 6.25** 第二个参数出现在第一个参数之前\n\n除了参数位置数字和转换类型外，你还可以在百分号后面指定其他元素。这些元素的顺序如下：\n\n*   首先，你可以输入一个\
  \ `0` 或一个空格。这表示如果你为占位符指定了最小所需宽度，将插入什么。注意：最小宽度只是第三个参数！如果你不设置第一个参数，则将自动使用空格。\n\n*\
  \   下一个字符是减号 (`-`)。如果存在，它确保左对齐。如果省略，则右对齐。只有当参数的字符少于允许的最小字符数时，对齐才有意义。\n\n*   接下来是一个带有最小字符数的数字。不过，此输入是可选的。在这种情况下，前两个设置也会被省略。\n\
  \n*   第四个位置由小数点和一个数字组成。它指定了小数部分的精度。该指定也是可选的。\n\n*   你已经知道第五个位置了。这是要转换的类型（参见 图 6.26）：\n\
  \n    *   `s` 代表字符串。\n    *   `b` 代表二进制数。\n    *   `c` 将整数转换为 ASCII 数字。\n    * \
  \  `d` 或 `I` 代表整数，以十进制数字显示。\n    *   `e` 或 `E` 是数字的科学计数法，例如 `2.5e+4`。\n    *   `f`\
  \ 代表浮点数。\n    *   `g` 或 `G` 是双精度，以浮点数显示。\n    *   `h` 或 `H` 是 PHP 8 中新增的，对应于 `g`\
  \ 或 `G`，但有一点不同：在显示浮点数时，不考虑字符串转换的本地设置。\n    *   `o` 生成八进制表示的数字。\n    *   `u` 是无无符号表示的整数。\n\
  \    *   `x` 代表小写字母十六进制表示数字。\n    *   `X` 代表大写字母十六进制表示数字。\n\n        ![使用不同的转换类型\
  \ (\"printf_formats.php\")](img/img-f6.26.html)\n\n        **Figure 6.26** 使用不同的转换类型\
  \ (`printf_formats.php`)\n\n这是另一个有助于理解的示例：\n\n```php\n$sum = 200; \n$format = \"\
  %07.2f\"; \nprintf($format, $sum);  \n```\n\n这提供了以下内容：\n\n```\n0200.00  \n```\n\n\
  开头插入了一个 `0`，因为最小宽度为 7，且使用零而不是空格填充。小数点后插入了两个小数。数据类型转换为浮点数。\n\n`sprintf(default string,\
  \ parameter)` 与 `printf()` 密切相关，但它将结果——即格式化后的字符串——作为返回值。\n\n```php\n$sum = 200;\
  \ \n$format = \"%.2f Euro\"; \n$result = sprintf($format, $sum); \necho $result;\
  \  \n```\n\n**Listing 6.40** `sprintf()` (`sprintf.php`)\n\n前面的行提供了以下字符串作为 `$result`\
  \ 变量的值，然后将其输出：\n\n```\n200. Euro  \n```\n\n##### Note\n\n这里提到的函数还包括 `vsprintf(Format,\
  \ Array)` 和 `vprintf(Format, Array)`。它们将带有参数的数组转换为具有指定格式的字符串。\n\n### 6.2.4 \"print_r\"\
  \ 和 \"var_dump\"\n\n`print_r(variable)` 和 `var_dump(Variable)` 函数将变量的结构和内容作为输出。它们非常适合分析复杂的数据类型，如对象和数组（参见\
  \ 图 6.27）。\n\n```php\n<?php \n  $days = array(\"Monday\", \"Tuesday\", \"Wednesday\"\
  ); \n  print \"print_r: \"; \n  print_r($days); \n  print \"<br />var_dump: \";\
  \ \n  var_dump($days); \n?>  \n```\n\n**Listing 6.41** `print_r()` 和 `var_dump()`\
  \ (`var_dump.php`)\n\n![第二个参数出现在第一个参数之前](img/img-f6.27.html)\n\n**Figure 6.27**\
  \ 第二个参数出现在第一个参数之前\n\n如果你为 `print_r()` 指定第二个参数为 `true`，你将获得关于变量的信息作为返回值。如果你不想将输出发送到浏览器，这非常有用：\n\
  \n```php\n$infos = print_r($days, true);  \n```\n\n##### Note\n\n作为处理对象时的另一个特殊功能，`var_dump()`\
  \ 只输出公共属性。`var_export()` 和 `print_r()` 也会输出私有和保护属性。`var_export()` 的另一个优势是：它返回可重用的代码。\n\
  \n## 7 字符串\n\n字符串处理：遗憾的是它是程序员最强大的工具之一。本章将向你介绍实践中用到的知识。\n\n大部分数据最终以字符串形式存在，无论是作为函数的返回值还是用户的输入。查看\
  \ PHP 的在线文档起初会让你大眼界。字符串操作函数列表是无尽的。但不要担心，在这里你会找到最重要的字符串操作的示例和解释。\n\n##### Note\n\n\
  如果你需要更大的力量，应该仔细查看正则表达式。PHP 在此处继承了 Perl 的功能；你可以在第 10 章](#10_001.html#h10) 了解更多信息。某些字符串函数还需要数组的知识，你可以在第\
  \ 8 章](#08_001.html#h8) 找到。尽管如此，我们将字符串放在前面，因为数组在逻辑上是基于字符串的，而且字符串处理在数组中也起着作用。\n\n\
  ## 7.1 连接\n\n连接字符串在编程术语中也称为拼接。因此字符串被连接。在 PHP 中通过点 (`.`) 实现。你可能已经多次使用过它，或者在第 5 章](#05_001.html#h5)\
  \ 中读过它。然而，这里的细节仍然很有：当字符串与其他数据类型连接时会发生什么？这在 PHP 中完全没有问题，因为点是专门为字符串操作保留的，PHP 会先将数据类型转换为字符串。\n\
  \n```php\n$a = 20; \n$b = \" euros\"; \necho $a . $b;  \n```\n\n\n\n\n正确显示了 20 欧元。相反，下面的代码显示了什么？\n\
  \n```php\n$a = 20; \n$b = 40; \necho $a . $b;  \n```\n\n这是正确的：两个整数都被转换成了字符串。因此，结果是\
  \ 2040。\n\n## 7.2 分割与合并\n\n最常见的任务之一是将字符串拆分为各个部分，或者从各个部分创建一个字符串。PHP 仅针对这一项任务就提供了许多不同的函数。\n\
  \n### 7.2.1 访问字符\n\n在 PHP 中，你可以像访问数组元素一样使用方括号来访问字符串的单个字母。第一个字母的索引为 0：\n\n```php\n\
  $text = \"Example string\"; \necho $text[0];  \n```\n\n因此返回的结果为 E。\n\n在很久以前，方括号变体曾有一段时间是不被推荐的。那时，PHP\
  \ 使用大括号作为方括号的替代方案。然而，与其他编程语言相比，这是“极不寻常”的。由于这个原因，在定期清理的过程中，决定完全依赖方括号进行访问。\n\n####\
  \ 注意事项\n\n从 PHP 7.1 开始，可以使用负偏移量来访问字符串。这意味着如果指定一个负数，PHP 将从字符串的末尾向前计数。代码：\n\n```php\n\
  $text = \"Example string\"; \necho $text[-6]; \n```\n\n因此返回的结果为 s。\n\n### 7.2.2\
  \ 均匀分割\n\n`chunk_split(String, Size, Insert)` 函数将字符串分割成相等的部分。你可以在这些部分之间插入另一个字符串。该函数随后返回结果。在下面的示例中，我们每四个字符分割一次字符串。在每次划分后，我们插入一个带有\
  \ HTML 标签 `<hr />` 的水平线。\n\n```php\n<?php \n  $a = \"PHP CMS SHOP\"; \n  echo chunk_split($a,\
  \ 4, \"<hr />\"); \n?>  \n```\n\n**列表 7.1** \"chunk_split()\" (\"chunk_split.php\"\
  )\n\n该函数唯一的问题是，填充字符串（如图 7.1 所示）是在每次划分后插入的——也就是说，在末尾也是如此。如果你不想这样做，必须切掉最后的几个字符。你可以使用\
  \ `substr(String, start position, number of characters)` 函数来实现。只需输入 0 作为截断的起始位置——即字符串的开头。选择一个负值作为字符数。这样你就不必总是将其调整为分隔符字符串的长度，可以使用\
  \ `strlen(String)` 函数确定其长度。\n\n```php\n<?php \n  $a = \"PHP CMS SHOP\"; \n  $sep\
  \ = \"<hr />\"; \n  echo substr(chunk_split($a, 4, $sep), 0, -strlen($sep)); \n\
  ?>  \n```\n\n**列表 7.2** 带有截断分隔符的 \"chunk_split()\" (\"chunk_split2.php\")\n\n![填充字符串在每次出现处插入](img/img-f7.1.html)\
  \ \n\n**图 7.1** 填充字符串在每次出现处插入\n\n你可以在图 7.2 中看到结果。\n\n![末尾不再有横线](img/img-f7.2.html)\
  \ \n\n**图 7.2** 末尾不再有横线\n\n### 7.2.3 换行\n\n`wordwrap(String, length, separator,\
  \ truncation)` 方法的工作方式与 `chunk_split()` 类似。然而，它的实际目标是在单词后插入换行。除了字符串本身，所有参数都是可选的。长度指定了在多少字符后插入换行。如果你省略它，系统会自动在\
  \ 75 个字符后中断。分隔符是插入到位置处的字符串。如果你省略它，PHP 会插入带有 `\\n` 的换行。`truncate` 参数决定单个单词是否被截断（true）。默认禁用（false）。\n\
  \n#### 注意事项\n\n如果你激活了截断，那么 `wordwrap()` 的工作方式就与 `chunk_split()` 相同。\n\n在下面的脚本中，字符串每三个字符插入一个分隔符。然而，由于保留了完整的单词，分割只发生在\
  \ PHP、CMS 和 SHOP 这几个单词之间。\n\n```php\n<?php\n  $a = \"PHP CMS SHOP\";\n  echo wordwrap($a,\
  \ 3); \n?>\n```\n\n**列表 7.3** \"wordwrap()\" (\"wordwrap.php\")\n\n在浏览器中看不到任何内容。这是为什么？换行是通过\
  \ `\\n` 完成的，所以你只能在源码中看到（参见图 7.3）。换行是通过 `\\n` 完成的，所以你只能在源码中看到（参见图 7.3](img-f7.3.html)\
  \ \n\n**图 7.3** 在源码处可见\n\n或者你可以使用 `wordwrap(String)`。它直接输入 `<br />` 作为分隔符。\n\n```php\n\
  <?php\n  $a = \"PHP CMS SHOP\";\n  echo wordwrap($a, 3, \"<br />\");\n```\n\n**列表\
  \ 7.4** \"wordwrap()\" (\"wordwrap.php\")\n\n图 7.4 显示了结果。\n\n![在浏览器中显示](img/img-f7.4.html)\
  \ \n\n**图 7.4** 在浏览器中显示\n\n### 7.2.5 字符串与数组\n\n分割与合并字符串还包括将字符串转换为数组以及反之。对于这两者都有不同的强大的函数。\n\
  \n#### 字符串转数组\n\n\n\n\n\n让我们从简单的开始。`explode(delimiter, string, limit)` 函数根据特定的分隔符将字符串拆分为一个数组。如果指定了可选的\
  \ `Limit` 参数，则创建的数组元素数量将与限制数量相符。数组的最后一个元素包含字符串的剩余部分，无论其长度如何。\n\n考虑下面这个简单的示例。首先，脚本在每个空格处分割字符串，然后输出数组的各个单独元素。\n\
  \n```php\n<?php \n  $a = \"PHP is great\"; \n  $strings = explode(\" \", $a); \n\
  \  foreach ($strings as $element) { \n    echo $element . \"<hr />\"; \n  } \n?>\
  \  \n```\n\n**列表 7.8** \"explode()\" (\"explode.php\")\n\n但如果，例如，你想考虑多个分隔符呢？在这种情况下，还有其他方法，我们将在接下来的章节中进行更详细的解释。\n\
  \n### 自定义函数\n\n最好的方法是快速编写你自己的函数，特别是用于分离时。你可以在 PHP 文档中找到其中一些函数，特别是在非常有用的用户注释中。\n\n\
  我们将展示我们自己的示例，这也是我们在实践中也使用过的。以下函数接收一个包含分隔符的数组，并使用这些分隔符分离字符串。所有分隔符随后将使用 `str_replace(To,\
  \ replacement, string)` 用数组中的第一个分隔符进行替换。然后使用 `explode()` 使用该分隔符对字符串进行分离。\n\n现在只有一个问题：如果字符串中两个分隔符连续出现，就会创建一个空的数组元素。我们使用\
  \ `array_filter(Array, function)` 函数过滤掉所有的空元素。如果函数返回 false，则该元素将不会包含在函数返回的数组中。\n\
  \n```php\nfunction explode_several($separator, $string) { \n  $string = str_replace($separator,\
  \ $separator[0], $string); \n  $result = explode($separator[0], $string); \n  $result\
  \ = array_filter($result, \"filter\"); \n  return $result; \n} \nfunction filter($value)\
  \ { \n  if($value == \"\") { \n    return false; \n  } else { \n    return true;\
  \ \n  }\n}  \n```\n\n**列表 7.9** 多重分隔符 (\"explode_more.php\")\n\n例如，使用以下字符串配合该函数：\n\
  \n```php\n$a = \"PHP is great. And everything is good.\";  \n```\n\n并输出返回的数组：\n\n\
  ```php\n$strings = explode_more(array(\" \", \".\"), $a); \nforeach ($strings as\
  \ $element) { \n  echo $element . \"<hr />\"; \n}  \n```\n\n你可以在 图 7.6 中看到结果。\n\n\
  ### 提示\n\n这并不是一个惊艳的提示，但却是你应该时不时记住的真理：通常只有多种手段的结合——在 PHP 的情况下，主要是函数的结合——才能导致成功。如果你想解决一个特定问题，在动手自己编写之前，先看看是否有任何类似的函数。\n\
  \n![字符串通过空格和点拆分成了各个部分](img/img-f7.6.html) \n\n**图 7.6** 字符串通过空格和点拆分成了各个部分\n\n###\
  \ \"split()\" 和 \"preg_split()\", 正表达式\n\n`split()` 和 `preg_split()` 函数是 `explode()`\
  \ 的替代方案。它们使用正则表达式作为分割的搜索模式。你可以在 第 10 章 中了解更多信息。\n\n### 注意\n\n`explode()` 的性能稍微比使用正则表达式的替代方案要略好一点，因为正则表达式仍然需要被解析。如果你编写自己的函数，你应该测试哪种方案更快。只需尝试一下即可。\n\
  \n### \"str_split()\"\n\n`str_split()` 将字符串按照指定的长度拆分为多个部分，并将它们存储在数组中。如果省略长度参数，则每个字符都作为一个元素。你可以在下面的示例中看到：\n\
  \n```php\n<?php\n  $str = \"PHP is great\";\n  print_r(str_split($str, 4));\n?>\
  \ \n```\n\n输出如下：\n\n```\nArray\n(\n    [0] => PHP\n    [1] => is g\n    [2] => re\n\
