  \n\n\n\n你可以像往常使用 `pear install CodeGen` 和 `pear install CodeGen_PECL` 来安装包（参见图 39.3）。在在此之前，建议——至少在第一次使用\
  \ PEAR 时——更新通道列表：\n\n```\npear update-channels  \n```\n\n虽然你仍然需要通过命令行参数向 `ext_skel.php`\
  \ 传递数据，但 `PECL_Gen` 的结构化程度更高：你需要 XML 格式。这里是一个 XML 配置文件的最小版本：\n\n```\n<?xml version=\"\
  1.0\"?> \n<extension name=\"Book\"> \n</extension>  \n```\n\n![安装 PEAR 包](img/img-f39.3.html)\
  \ \n\n**图 39.3** PEAR 包的安装\n\n这将创建一个名为 `Book` 的扩展，但没有任何其他相关信息。现在是时候改变这一点了。任何后续打印的\
  \ XML 代码将包含在 `<extension>` 元素内部。首先，你需要对扩展的功能进行简短总结。`<summary>` 元素专门用于此：\n\n```\n\
  <summary>Book generator</summary>  \n```\n\n然后，和使用 PEAR 一样，你可以存储关于扩展作者的信息。这在 PECL\
  \ 中相对不常见，因为这些信息也会出现在 `phpinfo()` 的输出中。然而，对于训练目的来说这并非不可，并且对于可能的商业 PHP 扩展可能有意义。此外，这些信息会填充\
  \ PECL 项目主页上的信息页（参见图 39.2）：\n\n```\n<maintainers>\n  <maintainer> \n    <user>wenz</user>\n\
  \    <name>Christian Wenz</name>\n    <email>wenz@php.net</email>\n    <role>lead</role>\n\
  \  </maintainer>\n</maintainers>  \n```\n\n此外，定义文件中还应该列出该扩展最后几个发布的版本，同样用于项目主页（以及\
  \ `phpinfo()`）：\n\n```\n<release>\n  <version>0.1.0</version>\n  <date>2024-01-24</date>\n\
  \  <state>alpha</state>\n  <notes>Little code, few features</notes>\n</release>\
  \  \n```\n\n现在我们来看核心部分：代码。对于扩展要实现的每个函数，你都需要一个 `<function>` 元素。在 `<proto>` 子元素中，你指定了函数的原型（即带有参数和数据类型的签名）。你还拥有\
  \ `<description>`（描述，如果需要可以写得详细）和 `<summary>`（摘要）字段：\n\n```\n<functions>\n  <function\
  \ name=\"write\">\n    <proto>string write(string topic)</proto>\n    <summary>Ghostwriter</summary>\n\
  \    <description>Creates a book. :-)</description>\n    <code></code>\n  </function>\n\
  </functions>  \n```\n\n唯一缺失的是实际的 C 代码。令人惊讶的是，你同样需要在 XML 文件中指定它，位于 `<code>` 和 `</code>`\
  \ 之间。这里是一段实际上为某个主题创建书籍的短代码；它只是返回一个字符串 `\"<topic> manual\"`：\n\n```\n<code><![CDATA[\n\
  \  char *title;\n  title = (char *)emalloc(topic_len + 9);\n  *title = '\\0';\n\
  \  strcat(title, topic);\n  strcat(title, \" Handbook\");\n  RETURN_STRINGL(title,\
  \ topic_len + 9, 0);\n]]>\n</code>  \n```\n\n列表 39.1 展示了完整的定义文件整体。\n\n```\n<?xml\
  \ version=\"1.0\"?>\n<extension name=\"Book\">\n  <functions>\n    <function name=\"\
  write\">\n      <proto>string write(string topic)</proto>\n      <summary>Ghostwriter</summary>\n\
  \      <description>Creates a book. :-)</description>\n      <code><![CDATA[\n \
  \       char *title;\n        title = (char *)emalloc(topic_len + 9);\n        *title\
  \ = '\\0';\n        strcat(title, topic);\n        strcat(title, \" Handbook\");\n\
  \        RETURN_STRINGL(title, topic_len + 9, 0);\n      ]]></code>\n    </function>\n\
  \  </functions>\n  <maintainers>\n    <maintainer> \n      <user>wenz</user>\n \
  \     <name>Christian Wenz</name>\n      <email>wenz@php.net</email>\n      <role>lead</role>\n\
  \    </maintainer>\n  </maintainers>\n  <release>\n    <version>0.1.0</version>\n\
  \    <date>2024-01-24</date>\n    <state>alpha</state>\n    <notes>Little code,\
  \ few features</notes>\n  </release>\n  <summary>Book generator</summary>\n</extension>\
  \  \n```\n\n**列表 39.1** PECL_Gen 的 XML 定义文件 (\"extension.xml\")\n\n现在你只需要调用 `PECL_Gen`。安装后，相应的脚本已存储在：\n\
  \n```\npecl-gen\n```\n\n现在你只需要调用 `PECL_Gen`。安装后，相应的脚本已存储在：\n\n```\npecl-gen\n```\n\
  \n\n\n现在你只需要编译扩展了。要完成这一点，进入 PHP 源代码根目录 (`php-src`) 并执行 `phpize` 脚本，该脚本随 PHP 一起安装（Windows\
  \ 用户请参考第 2 章 中的描述使用 `buildconf`）：\n\n```bash\nphpize  \n```\n\n然后重新配置 PHP（Windows\
  \ 用户使用 `nmake` 代替 `make`）：\n\n```bash\n./configure --enable-book \nmake  \n```\n\
  \n图 39.6 和 图 39.7 展示了这一过程。最后，除 Windows 外，请确保（使用 root 权限）扩展 (`Book.so`) 也正确的目录下：\n\
  \n```bash\nmake install  \n```\n\n![使用“--enable-book”配置开关](img/img-f39.6.html) \n\
  \n**图 39.6**     使用“--enable-book”配置开关\n\n![最终结果应该是](img/img-f39.7.html) \n\n**图\
  \ 39.7**     最终结果应该是\n\n大功告成！扩展的功能并不十分丰富，但它的创建速度非常快，而且并没有初看起来看起来（或者像以前那样）那么困难。\n\
  \n## 在 Windows 上使用 PECL 程序包进行编译\n\n如果你使用 `CodeGen_PECL` 生成了扩展框架并且正在使用 Windows，请将生成的\
  \ `book` 目录复制到 PHP 源代码的 `ext` 目录中并重新编译 PHP。（在创建配置文件时指定 `--enable-book` 开关。）\n\n\
  然而，在较新的 PHP 版本中，这里会出现一些问题——这是由于 `CodeGen_PECL` 已不再维护导致的。因此，请手动调整 `book.c` 文件。大约第\
  \ 16 行包含以下内容：\n\n```c\nfunction_entry book_functions[] = { \n```\n\n你必须将其替换为：\n\n\
  ```c\nzend_function_entry book_functions[] = { \n```\n\n然后编译应该就能正常工作了。\n\n## 39.3\
  \ 测试\n\n取决于你设置的是 `CodeGen_PECL` 还是 `ext_skel.php`，现在有两种测试选项。\n\n### 选项 1\n\n扩展是直接创建（`php_Book.so`\
  \ 或 `php_Book.dll`），因此是时候在 `php.ini` 中将其公开了：\n\n```ini\nextension=book  \n```\n\n\
  现在调用 `phpinfo()` 将显示关于该类的信息（参见图 39.8）。\n\n![“phpinfo()”输出中的我们的扩展](img/img-f39.8.html)\
  \ \n\n**图 39.8**     “phpinfo()”输出中的我们的扩展\n\n当然，你现在想测试这个扩展。由于你已经在 `php.ini` 中包含了该类，你可以直接调用新的\
  \ `write()` 函数：\n\n```php\n<?php \n  echo write(\"PHP 8.3\"); \n?>  \n```\n\n**列表\
  \ 39.2**     轻松编写 Book（\"book.php\"）\n\n图 39.9 显示了结果：脚本已经为 PHP 8.3 创建了一本手册（至少是标题）。\n\
  \n![一本关于 PHP 8.3 的书](img/img-f39.9.html) \n\n**图 39.9**     一本关于 PHP 8.3 的书\n\n\
  ### 选项 2\n\n扩展已直接集成到 PHP 中。这意味着你不再需要通过 `php.ini` 加载扩展，而是可以直接调用 `write()` 函数。这可以在命令行中直接进行测试：`php\
  \ -m` 返回所有扩展列表，而 `php -r` 执行代码（参见图 39.10）。\n\n![通过控制台测试扩展](img/img-f39.10.html)\
  \ \n\n**图 39.10**     通过控制台测试扩展\n\n你现在已经向你自己的 PHP 扩展迈出了第一步。你可能已经对更有用的 PECL 模块有了想法。如果你的扩展不仅能创建书名，还能创建完整的书籍文本，请告诉我们。感谢你购买这本（完全手工输入的）书！\n\
  \n# 40 为 PHP 贡献\n\nPHP 是开源的，因此源代码是公开的。在这方面，贡献代码（或任何其他内容）的门槛不再那么高了。\n\nPHP 项目的成功基于许多组件：语言的易用性、基于\
  \ PHP 的库和应用程序的广泛生态系统、庞的核心团队以及庞大的社区。\n\n虽然开源通常遵循 LOW 原则（让别人工作），但 PHP 是一门由开发者为开发者编写的语言。\n\
  \n在最后一个章节中，我们将简要展示如何为 PHP 做出贡献。\n\n## 40.1\n\nPHP 是开源的，因此源代码是公开的。在这方面，贡献代码（或任何其他内容）的门槛不再那么高了。\n\
  \nPHP 项目的成功基于许多组件：语言的易用性、基于 PHP 的库和应用程序的广泛生态系统、庞的核心团队以及庞大的社区。\n\n虽然开源通常遵循 LOW 原则（让别人工作），但\
  \ PHP 是一门由开发者为开发者编写的语言。\n\n在最后一个章节中，我们将简要展示如何为 PHP 做出贡献。\n\n### 来自版本管理\n\nPHP 并不总是通过\
  \ Git 管理的。该项目曾依赖并发版本 (CVS)，从 2009 年起最终转向了 Git。为 PHP 贡献代码有两种方式：要么添加新功能，要么改进现有内容。\n\
  \n### 用于 PHP 的补丁\n\nPHP 的开发是公开的。该项目曾使用一个独立的错误跟踪系统。现在使用了 GitHub 基础设施。有两个主要的仓库可以收集问题并提交问题：\n\
  \n*   PHP 源代码：`https://github.com/php/php-src`\n*   文档页面：`https://github.com/php/doc-en`\n\
  \n### 40.1.1 错误修复\n\n向 PHP 贡献最简单的代码是修复错误。无论起点在哪里，你总是需要一个已存在的错误。我们自己的一个较旧的示例非常适合演示，因为必要的代码修正相当简单。尽管在\
  \ Windows 8.1 下，输出却是 Windows 8（这在 Windows 10 甚至 11 出现之前）。实现 `phpinfo()` 函数的 `ext/standard/info.c`\
  \ 文件被确认为罪魁祸首。\n\n\n\n\n\n```cpp\nif (VER_PLATFORM_WIN32_NT==osvi.dwPlatformId &&\
  \ \n    osvi.dwMajorVersion > 4 ) {\n  if (osvi.dwMajorVersion == 6) {\n    if(\
  \ osvi.dwMinorVersion == 0 ) {\n      if( osvi.wProductType == VER_NT_WORKSTATION\
  \ ) {\n        major = \"Windows Vista\";\n      } else {\n        major = \"Windows\
  \ Server 2008\";\n      }\n    } else\n      if ( osvi.dwMinorVersion == 1 ) {\n\
  \        if( osvi.wProductType == VER_NT_WORKSTATION ) {\n          major = \"Windows\
  \ 7\";\n        } else {\n          major = \"Windows Server 2008 R2\";\n      \
  \  }\n      } else if ( osvi.dwMinorVersion == 2 ) {\n        if( osvi.wProductType\
  \ == VER_NT_WORKSTATION ) {\n          major = \"Windows 8\";\n        } else {\n\
  \          major = \"Windows Server 2012\";\n        }\n      }\n    } else {\n\
  \      major = \"Unknown Windows version\";\n    }\n    // ...\n  }\n  // ...\n\
  }  \n```\n\nWindows 8 在内部对应于 Windows 版本 `6.2`，这一点从代码可以看出。相反，Windows 8.1 是 Windows\
  \ `6.3`。问题之处在于：所使用的编程接口对 8 之后的所有 Windows 版本也只返回 `6.2`。因此，必须使用不同的调用方法。这在当前案例中已经研究并实现。\n\
  \n基本步骤——除了实现部分之外——相对简单。对 GitHub 上的 PHP 仓库进行分支（fork，大致等同于克），然后对分支中的代码进行相应的调整。接着将这些调整封装并在一个拉取请求（pull\
  \ request）中。如果你只需要更改单个文件，甚至可以在浏览器中直接修改代码并生成拉取请求（参见图 40.3；但仍建议使用适当的开发环境）。\n\n![在浏览器中直接修改\
  \ PHP C 代码！](img/img-f40.3.html)\n\n**图 40.3** 在浏览器中直接修改 PHP C 代码！\n\n你可以在 GitHub\
  \ 事项跟踪器（issue tracker）中看到此拉取请求的 URL。然后你希望负责该模块的开发团队会处理它。如果一切正常，你的补丁（patch）将得到改进（或者会被要求对其进行改进），最后——希望如此——拉取请求将被接受（参见图\
  \ 40.4）。\n\n![补丁稍后创建并合并](img/img-f40.4.html)\n\n**图 40.4** 补丁稍后创建并合并\n\n你的错误修复将包含在下一个\
  \ PHP 版本中！你可以确信获得无限的名誉，因为修复漏洞的人通常会被列在 `NEWS` 文件以及发布说明（release notes）中（参见图 40.5 和图\
  \ 40.6）。\n\n![发布说明中的已修复漏洞](img/img-f40.5.html)\n\n**图 40.5** 发布说明中的已修复漏洞\n\n![“NEWS”文件中的更多信息——以及\
  \ 15 毫秒的成誉](img/img-f40.6.html)\n\n**图 40.6** “NEWS”文件中的更多信息——以及 15 毫秒的成誉\n\n###\
  \ 40.1.2 新功能\n\nPHP 经常被指责在某些领域增长得非常“有机”，包括不一致的 API。为了在将来避免这种指责，PHP 项目定义了一个在添加新功能之前必须遵循的流程。整个过程被称为意见征求（Request\
  \ for Comments, `RFC`），可以在 `https://wiki.php.net/rfc`（概述；参见图 40.7）和 `https://wiki.php.net/rfc/howto`（逐步步骤）找到。本质上，该流程如下：\n\
  \n1. 为 PHP 构一个新的、有用的功能。\n2. 向 `internals@php.net` 发送邮件并描述你的想法。\n3. 如果没有被拒绝，则制定一个\
  \ `RFC`（通常是一个想法加上一个实现方案）并将其公开供讨论。\n4. 在讨论以及（必要时）进行一些调整后，将对你的 `RFC` 进行投票。\n5. 如果成功，你的代码将被添加到\
  \ PHP 中。\n\n#### 扩展阅读\n\nChristopher Jones 在 `http://s-prs.co/2258` 制定了一份相当详细的 `RFC`\
  \ 指南，比官方页面还要深入。Ben Ramsey 成功地通过了 `RFC` 并在幻灯片中描述了该过程，你可以在 `http://s-prs.co/2259`\
  \ 查看。\n\n![处于不同阶段的当前 RFC（协调等）](img/img-f40.7.html)\n\n**图 40.7** 处于不同阶段的当前 RFC（协调等）\n\
  \n### 40.2 更多选项\n\n然而，PHP 项目提供了多种在没有知识的情况下贡献的方法。`php.net/get-involved` 上的 `Get Involved`\
  \ 页面列出了方法：\n\n1. 你可以使用 PHP 运行测试套件。出现错误了吗？它们已经在错误跟踪器中报告了吗？\n2. 如果测试出现错误，是测试本身的问题，还是\
  \ PHP 确实存在错误？这种分析以及可能对测试（或 PHP）的修复非常有用。PHP 质量保证团队在 `php.net/write-test.php` 提供了关于编写测试的进一步信息。\n\
  3. 在错误跟踪器中提交漏洞（我们在本章中已经提到几次）。\n4. 扩展或翻译文档。\n\n我们想提到第五个我们非常关心的选项。PHP 基金会是由来自 PHP\
  \ 环境的几家公司和个人创立的，旨在让开源项目更加稳定，特别是由于了 Zend 的参与，尤其是微软（它在其他方面长期支持 PHP 版本）的参与。该组织不仅促进\
  \ PHP，还支持 14 兼职开发者。如果你或你的公司从 PHP 中受益，回馈一些什么不是个坏主意吗？请访问项目网站 `https://php.foundation`（参见图\
  \ 40.8）。无论你如何参与 PHP，即使你使用它：这是让项目变得更大、更成功的唯一方式。非常感谢！\n\n![PHP 基金会首页](img/img-f40.8.html)\n\
