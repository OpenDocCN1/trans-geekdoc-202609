  Heading\" value=\"<?php\n  echo htmlspecialchars($Heading);\n?>\" /><br />\nComment\n\
  <textarea cols=\"70\" rows=\"10\" name=\"Comment\"><?php\n  echo htmlspecialchars($Comment);\n\
  ?></textarea><br />\n<input type=\"submit\" name=\"Submit\" value=\"Update\" />\n\
  </form>\n</body>\n</html>  \n```\n\n**Listing 21.13** 编辑留言板条目 (\"gb-edit.php\")\n\
  \n# 22 Oracle 数据库\n\nOracle 不仅拥有 MySQL 数据库：该公司的主力舰仍然是 Oracle 数据库服务器。该产品还为 PHP 提供了卓越的连接。\n\
  \n对于 Oracle，意见分歧。粉丝认为该产品是终极数据库，在功能和性能方面是 117 无不可胜的。批评者对该数据库与竞争对手相比的许多特殊之处感到惊讶。换句话说：得益于提供的良好工具，（几乎）任何人都可以使用\
  \ Microsoft SQL Server，而许多人认为 Oracle 在专业应用程序中更强大。\n\n然而，本书的目的不是推崇某些偏爱的数据库，而是根据其\
  \ PHP 控制能力介绍市场上的所有相关产品。因此，你将深入了解与数据库操作的最重要命令。\n\n## 22.1 准备工作\n\n首先，你需要 Oracle。你可以从\
  \ Oracle 的技术资源（原 Oracle Technology Network，[www.oracle.com/technical-resources](http://www.oracle.com/technical-resources)）下载测试版本。与\
  \ Microsoft 类似，Oracle 现在提供了一个功能有所减少的免费数据库版本。它被称为 Oracle XE（Express 版），注册后可以在 Windows\
  \ 和 Linux 上的 [s-prs.co/v60227](http://s-prs.co/v60227) 下载（见图 22.1）。然而，Debian 和 Ubuntu\
  \ 用户在他们的系统中分发该软件比从 Oracle 网站获取它要容易得多。\n\nOracle 模块已经包含在 Windows 的主 PHP 程序包中。通过删除\
  \ `php.ini` 中某行开头的分号可以安装相应的扩展，这取决于你想要使用的客户端版本。例如，对于 PHP 8.3，默认只包含后者：\n\n```\n;extension=oci8_12c\
  \ ; 与 Oracle Database 12c Instant Client 使用\n;extension=oci8_19 ; 与 Oracle Database\
  \ 19 Instant Client 使用\n```\n\n![Downloads for Oracle XE](img/klein22_001.png)\n\
  **图 22.1** Oracle XE 的下载\n\n然而，使用此扩展的先决条件是 `php.ini` 中已经提到的 Oracle Instant Client\
  \ ([s-prs.co/v60228](http://s-prs.co/v60228))。在 Windows 中需要注意，因为你还需要 Microsoft Visual++\
  \ Redistributable；具体版本在 Oracle 的下载页面上有链接。\n\n包含扩展扩展 DLL 会加载全系列 Oracle 客户端 DLL，这就是为什么\
  \ Instant Client 也必须在路径中。为了实现这一点，Web 服务器自然需要对应目录的读取权限。例如，IIS 在用户账户 `IUSR_<machine\
  \ name>` 下运行，该账户仍需要分配此权限。请确保在“高级”选项下指定你想用新权限替换整个目录的旧权限。\n\n### 提示\n\n如果你没有更改这些权限的选项（通常通过文件属性中的“安全”选项卡），请在文件夹选项中禁用文件共享。\n\
  \n在 Unix/Linux 下，使用 `--with-oci8` 编译开关。`ORACLE_HOME` 环境变量应设置为 PHP 搜索 Oracle 库的目录。或者，你可以直接指定：`--with-oci8=/path/to`。如果你使用\
  \ PECL，安装如下：\n\n```\npecl install oci8\n```\n\n在两个操作系统都需要包含 Oracle 安装信息的环境变量：\n\n\
  *   `ORACLE_HOME`: Oracle 安装目录\n*   `ORACLE_SID`: 数据库名称\n*   `NLS_LANG`: 语言设置\n\
  *   `ORA_SDTZ`: 使用的时区\n\nWindows 用户在安装 Oracle 后会在注册表中找到这些信息。Unix/Linux 用户还需要 `LD_LIBRARY_PATH`\
  \ 变量以便找到库。这些操作系统的另一个要求是 Apache 必须链接 `pthread` 库。可以通过 `ldd /path/to/httpd` 进行检查（见图\
  \ 22.2）。\n\n![New Installation: This Apache Does Not Use pthread](img/klein22_002.png)\n\
  **图 22.2** 需要安装：此 Apache 不使用 pthread\n\n此时值得调用 `phpinfo()`，它（可能会）显示安装成功（见图 22.3）。\n\
  \n接下来，你需要相应地配置本地 Oracle 实例。为此，首先在 `SQL*Plus` 中创建一个密码为 `password` 的用户 `user`。118\
  \ 通过授予用户 `connect` 权限（在示例中还加入了 `dba`，这使得以后的访问变得更容易）。如果用户不存在，它会被创建。图 22.4 显示了命令行中的结果。\n\
  \n使用 SQL Developer 作为图形用户界面会更方便。你可以从 [s-prs.co/v60229](http://s-prs.co/v60229) 免费下载该工具，但你需要\
  \ Java Development Kit（Java 运行时环境是不够的）。然而，配置工具仍然很有价值，因为你可以在那里创建数据库并进行进一步设置。\n\n\
  ![The Installation of the Extension Was Successful](img/klein22_003.png)\n**图 22.3**\
  \ 扩展安装成功\n\n![The New User Is Created](img/klein22_004.png)\n**图 22.4** 用户已创建\n\n\
  最后，你需要决定 PHP 如何连接到 Oracle。这里有几种选项：\n\n*   本地 Oracle 实例名称。\n*   存储在 `tnsnames.ora`\
  \ 配置文件中的连接名称。\n\n\n\n\n使用 EasyConnect 语法，该语法从 Oracle 10g 版本开始可用。连接字符串类似于 URL——例如，`localhost/service\
  \ name`。\n\n在接下来，我们假设使用 `\"orcl\"` 作为连接字符串，可以作为 TNS 条目或本地实例名。如有必要，请根据您的各自系统调整此连接字符串，并确保测试用户也具有访问权限。\n\
  \n因此，安装和配置可能需要一些时间；遇到问题建议查看 PHP 在线手册中的用户注释。Oracle 还针对 PHP 使用提供了专门的常见问题（FAQ）：\n\n\
  * [`s-prs.co/v602230`](http://s-prs.co/v602230) 包含了关于使用 PHP 的通用信息。\n* [`s-prs.co/v602231`](http://s-prs.co/v602231)\
  \ 指向《地下 PHP 与 Oracle 手册》，这是一本关于使用 PHP 和 Oracle 开发的详细手册。（在出版时，它已更新至 Oracle 11g R2。）\n\
  * [`s-prs.co/v602232`](http://s-prs.co/v602232) 指向 PECL 中的 Oracle 扩展，目前由其维护，且通常比\
  \ PHP 自带的版本更新。从版本 3 开始，该扩展兼容 PHP 8；对于 PHP 7，最好使用版本 2.2。\n\n## 22.2 使用 Oracle 访问数据库\n\
  \n我们的新用户自然也想与数据库交互。相关任务将在后续章节中描述。首先警告：在使 PHP 函数名更加一致的这一值得赞誉的过程中，从 PHP 5 起某些内容发生了变化。现在，函数名的所有部分都由下划线分隔——例如\
  \ `oci_connect()` 和 `oci_fetch()`。在之前的版本中并非如此，那两个函数的调用方式不同，且各都不带下划线：`ocilogon()`\
  \ 和 `ocifetch()`。出于兼容性考虑，旧的函数名仍然有效，但我们只使用新的变体。\n\n### 22.2.1 连接设置\n\n通过 `oci_connect()`\
  \ 连接。前两个参数与其他某些 PHP 数据库模块一样是用户名和密码；第三个参数是 `tnsnames.ora` 文件中输入的服务名称（除非设置了环境变量或 `ORACLE_SID`\
  \ 注册表项，则可以省略该参数）。函数的返回值是一个数据库句柄，如果出错则返回 `false`。`oci_close()` 函数再次关闭连接。\n\n```php\n\
  <?php\n  if ($db = oci_connect(\"user\", \"password\", \"orcl\")) {\n    echo \"\
  Connection successful.\";\n    oci_close($db);\n  } else {\n    echo \"Error!\"\
  ;\n  }\n?>  \n```\n**列表 22.1** 建立连接 (\"oci-connect.php\")\n\n### 提示\n\n如果在这里发生错误，通常是因为环境变量没有正确设置，或者是因为\
  \ `tnsnames.ora` 文件包含了 Windows 行符。\n\n#### 错误处理\n\n本章中的示例仅输出相当平庸的错误信息；它们不会抑制各个函数的实际错误信息（出于调试考虑），但可以通过在函数名前加上\
  \ @ 符号 (`@`) 来实现这一点。\n\n不过，这里有一个特殊机制。`oci_error()` 返回关于上次发生的错误信息。可以传递以下参数：\n\n*\
  \ 建立连接时出错时不传参数\n* 解析 SQL 命令出错时传递数据库句柄\n* 执行 SQL 命令出错时传递命令对象\n\n关联数组包含以下字段：\n\n*\
  \ `code`: 来自 Oracle 的错误代码\n* `message`: 来自 Oracle 的错误文本\n* `offset`: 错误位置\n* `sqltext`:\
  \ 错误的 SQL 代码\n\n### 22.2.2 查询\n\n对数据库的查询分两个步骤进行：\n\n1. `oci_parse()` 解析 SQL 命令并将其创建一个对象。\n\
  2. `oci_execute()` 将对象发送到数据库。\n\n然而，这可能意味着……（注：提供的文本在查询部分包含大量重复/乱码文本；已根据指令保留了核心逻辑）。\n\
  \n（注：提供的格式化输入文本在 22.2.2 节包含大量重复且无意义的字符串。我在维护结构完整性和源文件中关键技术术语的同时清理了噪声。）\n\n\n\n\n\
  要从数据库中读取数据，再次有几种方法。`oci_result()` 函数的工作方式与与其他数据库系统的可 PHP 函数类似：你将句柄作为第一个参数（这里是通过\
  \ `oci_parse()` 预处理的 SQL 命令），并将字段名作为第二个参数。119 如果结果列表中还有行，则 `oci_fetch()` 返回值 true，否则返回\
  \ false。这是创建 `while` 循环的一种极佳方法。\n\n```php\n<?php\n  if ($db = oci_connect(\"user\"\
  , \"password\", \"orcl\")) {\n    $sql = \"SELECT * FROM my_table\";\n    $command\
  \ = oci_parse($db, $sql);\n    if (oci_execute($command)) {\n      echo \"<ul>\"\
  ;\n      while (oci_fetch($command)) { \n        echo \"<li>\" . htmlspecialchars(oci_result($command,\
  \ \"id\")) .\n             \": \" . htmlspecialchars(oci_result($command, \"field\"\
  )) . \"</li>\";\n      }\n      echo \"</ul>\";\n    }\n    oci_close($db);\n  }\
  \ else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n#### 列表 22.4 读取内容 (\"oci-read.php\"\
  )\n\n然而，这会为每个字段创建一个独立的（从性能角度来看）昂贵的函数调用。更好的做法是直接获取结果列表的完整行。通过 `oci_fetch_assoc()`，可以通过关联数组的形式实现。\n\
  \n```php\n<?php\n  if ($db = oci_connect(\"user\", \"password\", \"orcl\")) {\n\
  \    $sql = \"SELECT * FROM my_table\";\n    $command = oci_parse($db, $sql);\n\
  \    if (oci_execute($command)) {\n      echo \"<ul>\";\n      while ($row = oci_fetch_assoc($command))\
  \ { \n        echo \"<li>\" . htmlspecialchars($row[\"id\"]) .\n             \"\
  : \" . htmlspecialchars($row[\"field\"]) . \"</li>\";\n      }\n      echo \"</ul>\"\
  ;\n    }\n    oci_close($db);\n  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\
  \n#### 列表 22.5 通过关联数组读取 (\"oci-read-associative.php\")\n\n`oci_fetch_object()` 函数则将行返回为对象，列名作为属性。\n\
  \n```php\n<?php\n  if ($db = oci_connect(\"user\", \"password\", \"orcl\")) {\n\
  \    $sql = \"SELECT * FROM my_table\";\n    $command = oci_parse($db, $sql);\n\
  \    if (oci_execute($command)) {\n      echo \"<ul>\";\n      while ($row = oci_fetch_object($command))\
  \ { \n        echo \"<li>\" . htmlspecialchars($row->id) .\n             \": \"\
  \ . htmlspecialchars($row->field) . \"</li>\";\n      }\n      echo \"</ul>\";\n\
  \    }\n    oci_close($db);\n  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n\
  #### 列表 22.6 通过对象读取 (\"oci-read-object.php\")\n\n最后但同样重要的是，还有一种一次性读取整个结果列表的选项，尽管这建议用于较少的数据。相应的函数是\
  \ `oci_fetch_all()`，它期望五个参数：\n\n1. 由 `oci_parse()` 创建的命令。\n2. 返回数据的数组。\n3. 应该跳过多少行（`0`\
  \ 表示使用所有行）。\n4. 要返回的最大行数（`-1` 表示返回所有）。\n5. 返回值的类型——例如，`OCI_NUM`（带有数字索引的数组）或 `OCI_ASSOC`（关联数组）。\n\
  \n后三个参数是可选的。在下面的完整列表中，与之前的代码相比，特殊功能已**加粗**显示。\n\n```php\n<?php\n  if ($db = oci_connect(\"\
  user\", \"password\", \"orcl\")) {\n    $sql = \"SELECT * FROM my_table\";\n   \
  \ $command = oci_parse($db, $sql);\n    if (oci_execute($command)) {\n      echo\
  \ \"<ul>\";\n      oci_fetch_all($command, $all, 0, -1, OCI_ASSOC);\n      foreach\
  \ ($all as $row) { \n        echo \"<li>\" . htmlspecialchars($row[\"id\"]) .\n\
  \             \": \" . htmlspecialchars($row[\"field\"]) . \"</li>\";\n      }\n\
  \      echo \"</ul>\";\n    }\n    oci_close($db);\n  } else {\n    echo \"Error!\"\
  ;\n  }\n?>  \n```\n\n#### 列表 22.7 一次读取所有数据 (\"oci-read-all.php\")\n\n### 22.2.4\
  \ 特殊功能\n\nOracle 是一个具有许多特殊功能的数据库。这里突出显示了一些有趣的功能。\n\n##### 最后插入的自增值\n\n如你之前看到的，Oracle\
  \ 实际上没有自增值。但是可以通过序列（sequences）来实现。在这里我们使用了 `NEXTVAL` 获取序列的下一个值（同时增加序列 1）。`CURRVAL`\
  \ 提供序列的当前值。因此，如果你向数据库插入内容然后读取 `CURRVAL`，你就确定了最后插入的自增值（参见图 22.5）。\n\n```php\n<?php\n\
  \  if ($db = oci_connect(\"user\", \"password\", \"orcl\")) {\n    $sql1 = \"INSERT\
  \ INTO my_table (field) VALUES (:value)\";\n    $command1 = oci_parse($db, $sql1);\n\
  \    oci_bind_by_name($command1, \":value\", \"value\");\n    if (oci_execute($command1,\
  \ OCI_DEFAULT)) {\n      $sql2 = \"SELECT CURRVAL AS id FROM DUAL\";\n      $command2\
  \ = oci_parse($db, $sql2);\n      if (oci_execute($command2, OCI_DEFAULT)) {\n \
  \       oci_fetch($command2);\n        $id = oci_result($command2, \"id\");\n  \
  \    } else {\n        $id = \"??\";\n        echo \"Error!\";\n      }\n      echo\
  \ \"Data entered with ID $id.\";\n    } else {\n      echo \"Error!\";\n    }\n\
  \    oci_commit($db);\n    oci_close($db);\n  } else {\n    echo \"Error!\";\n \
  \ }\n?>  \n```\n\n#### 列表 22.8 读取自增值 (\"oci-autovalue.php\")\n\n数据库条目的 ID\n\n22.5\
  \ 新数据库\n\n##### 操作 LOB\n\nPHP 的 OCI8 扩展现在支持大对象 (LOBs) 和二进制大对象 (BLOBs)。这本身是一门科学，但值得一看，因为它提供了两个有趣的方法：\n\
  \n1. `load()` 从 LOB 加数据。\n2. `save()` 将数据保存到 LOB。\n\n注意你必须调用两次 `oci_execute()`：一次创建\
  \ LOB，另一次使用 `$lob->save()` 传输数据之后。`oci_new_descriptor()` 函数创建一个空的 LOB。\n\n```php\n\
  <?php\n  if ($db = oci_connect(\"user\", \"password\", \"orcl\")) {\n    $lob =\
  \ oci_new_descriptor($db, OCI_D_LOB);\n    $sql = \"INSERT INTO my_table (field,\
  \ data) VALUES ('LOB', EMPTY_BLOB()) RETURNING data INTO :lobdata\";\n    $command\
  \ = oci_parse($db, $sql);\n    oci_bind_by_name($command, \":lobdata\", $lob, -1,\
  \ OCI_B_LOB);\n    if (oci_execute($command, OCI_DEFAULT) && $lob->save(file_get_contents(\"\
  oci-lob-store.php\")) && oci_execute($command, OCI_COMMIT_SUCCESS)) {\n      echo\
  \ \"Data entered.<br />\";\n    } else {\n      echo \"Error!\";\n    }\n    oci_close($db);\n\
  \  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n#### 列表 22.9 在数据库中存储 LOB (\"\
  oci-lob-store.php\")\n\n读取过程非常相似。\n\n```php\n<?php\n  if ($db = oci_connect(\"user\"\
  , \"password\", \"orcl\")) {\n    $sql = \"SELECT data FROM my_table WHERE field\
  \ = 'LOB'\";\n    $command = oci_parse($db, $sql);\n    if (oci_execute($command)\
  \ && oci_fetch($command)) {\n      $lobdata = oci_result($command, \"data\");\n\
  \      echo \"<pre>\" . \n           nl2br(htmlspecialchars($lobdata->load())) .\
  \ \n           \"</pre>\";\n    } else {\n      echo \"Error!\";\n    }\n    oci_close($db);\n\
  \  } else {\n    echo \"Error!\";\n  }\n?>  \n```\n\n## 22.3 示例\n\nOracle 有其特殊之处，就像数据类型和序列一样。这些特性可以在经过测试的标准留言板示例中找到，我们将其迁移到了\
  \ OCI8 扩展中。\n\n### 22.3.1 创建表\n\n\n\n\n在创建表时，我们需要一个新的序列（sequence）以及对应的 `INSERT`\
  \ 触发器。为了避免在日期字段上处理不同的语言设置，我们将其声明为数值字段，并在稍后以 Unix epoch 格式写入当前戳。\n\n```php\n<?php\n\
  \  if ($db = oci_connect(\"user\", \"password\", \"orcl\")) {\n    $sql = \"CREATE\
  \ TABLE guestbook (\n      id NUMBER(10) PRIMARY KEY, \n      heading VARCHAR2(1000),\
  \ \n      entry VARCHAR2(5000),\n      author VARCHAR2(50),\n      email VARCHAR2(100),\n\
  \      date NUMBER(20) PRIMARY KEY\n    ); \n    CREATE SEQUENCE guestbook_id;\n\
  \    CREATE TRIGGER guestbook_autoincrement BEFORE INSERT ON guestbook\n       REFERENCING\
  \ NEW AS NEW OLD AS OLD FOR EACH ROW BEGIN\n       SELECT guestbook_id.NEXTVAL INTO\
  \ :NEW.id FROM DUAL;\n    END;\";\n    $command = oci_parse($db, $sql);\n    if\
  \ (oci_execute($command)) {\n      echo \"Table created.<br />\";\n    } else {\n\
  \      echo \"Error!\";\n    }\n    oci_close($db);\n  } else {\n    echo \"Error!\"\
  ;\n  }\n?>  \n```\n\n`Listing 22.11` 表已创建 (\"gb-create.php\")\n\n### 22.3.2 输入数据\n\
  \n数据库条目像往常一样工作。表单数据通过 `oci_bind_by_name()` 作为命名参数绑定到 SQL 命令中。\n\n插入的数据记录的 ID 使用\
  \ `guestbook_id.CURRVAL` 读取，并同时输出以供演示。在生产系统中，只有当用于编辑的 PHP 脚本经过了特殊的访问保护时，这种做法才有意义。\n\
  \n不要忘记：调用 `oci_execute()` 时不要使用默认模式，而要显式指定 `OCI_DEFAULT`。你还需要在脚本结束时调用 `oci_commit()`。\n\
  \n```html\n<html\n<head>\n  <title>Guestbook</title>\n</head>\n<body>\n<h1>Guestbook</h1>\
  \ \n```\n\n```php\n<?php\n  if (isset($_POST[\"Name\"]) &&\n      isset($_POST[\"\
  Email\"]) &&\n      isset($_POST[\"Heading\"]) &&\n      isset($_POST[\"Comment\"\
  ])) {\n    if ($db = oci_connect(\"user\", \"password\", \"orcl\")) {\n      $sql\
  \ = \"INSERT INTO guestbook \n        (heading, \n         entry,\n         author,\n\
  \         email,\n         date) \n        VALUES (:heading, :comment, :name, :email,\
  \ :date)\";\n      $command = oci_parse($db, $sql);\n      oci_bind_by_name($command,\
  \ \":Heading\", $_POST[\"Heading\"]);\n      oci_bind_by_name($command, \":Comment\"\
  , $_POST[\"Comment\"]);\n      oci_bind_by_name($command, \":Name\", $_POST[\"Name\"\
  ]);\n      oci_bind_by_name($command, \":Email\", $_POST[\"Email\"]);\n      oci_bind_by_name($command,\
  \ \":Date\", time());\n      if (oci_execute($command, OCI_DEFAULT)) {\n       \
  \ $sql_id = \"SELECT guestbook_id.CURRVAL AS id FROM DUAL\";\n        $command_id\
  \ = oci_parse($db, $sql_id);\n        if (oci_execute($command_id, OCI_DEFAULT))\
  \ {\n          oci_fetch($command_id);\n          $id = oci_result($command_id,\
  \ \"id\");\n        } else {\n          $id = \"\";\n          echo \"Error!\";\n\
  \        }\n        echo \"Entry added. \n             <a href=\\\"gb-admin?id=$id\\\
  \">Edit</a>\";\n      } else {\n        echo \"Error!\";\n      }\n      oci_commit($db);\n\
  \      oci_close($db);\n    } else {\n      echo \"Error!\";\n    }\n  }\n?> \n\
  ```\n\n```html\n<form method=\"post\" action=\"\">\nName <input type=\"text\" name=\"\
