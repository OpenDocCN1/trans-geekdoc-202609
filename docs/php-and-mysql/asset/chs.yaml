  \ 复选框\n\n复选框的模式与单选按钮相同：如果值匹配 `$_GET` 或 `$_POST`（或者有值），则必须输出 `checked=\"checked\"\
  `。\n\n```\n<input type=\"checkbox\" name=\"Terms\" value=\"ok\" <?php if ($Terms\
  \ != \"\") { \n    echo \"checked\"; \n  } ?>/> 我接受条款和条件。<br />  \n```\n\n列表 13.17\
  \ 复选框预填充（节选“form-prefill-checkboxes”）\n\n### 13.4.5 选择列表\n\n对于简单的选择列表，程序员的生活仍然很轻松。在这里，`value`\
  \ 属性的值也与来自 `$_GET` 或 `$_POST` 的数据进行比较。与复选框或单选按钮的主要区别在于，需要设置的属性是 `selected` 而不是 `checked`。\n\
  \n```\n票数\n<select name=\"Number\"> \n  <option value=\"0\">请选择</option> \n  <option\
  \ value=\"1\"<?php if ($Number == \"1\") { \n      echo \"selected\"; \n    } ?>>1</option>\
  \ \n  <option value=\"2\"<?php if ($Number == \"2\") { \n      echo \"selected\"\
  ; \n    } ?>>2</option> \n  <option value=\"3\"<?php if ($Number == \"3\") { \n\
  \      echo \"selected\"; \n    } ?>>3</option> \n  <option value=\"4\"<?php if\
