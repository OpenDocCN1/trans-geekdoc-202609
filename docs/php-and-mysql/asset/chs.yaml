  \n\n\n\n## 列表 13.23 画库的上传表单 (\"gallery-upload.php\")\n\n![不美观，但简单有效：图片画库](img/img-f13.14.html)\
  \ \n\n**图 13.14** 不美观，但简单有效：图片画库\n\n### 注意\n\n此脚本自然地包含一个潜在的安全漏洞：如果传输的文件名已被占用，PHP\
  \ 脚本将用同名文件覆盖旧文件。你可以通过向目标名称中添加随机组件（或者，测试文件是否已存在）来防止这一点：\n\n```php\n$target name =\
  \ \"upload/\" . time() . basename($target name); \n```\n\n在实际的画库页面上，你需要用到 `Directory`\
  \ 类，该类在第 25 章中引入。它会读取所有文件并根据它们创建 `<img>` 标签。\n\n```html\n<head>\n  <title>Gallery</title>\n\
  </head>\n<body> \n```\n\n```php\n<?php\n  if ($folder = opendir(\"upload/\")) {\n\
  \    while (false !== ($file = readdir($folder))) { \n      if ($file != \"..\"\
  \ && $file != \".\") { \n        echo \"<img src=\\\"upload/$file\\\" />\\n\"; \n\
  \      } \n    }\n    closedir($folder); \n  }\n?> \n```\n\n```html\n</body>\n</html>\
  \  \n```\n\n## 列表 13.24 输出图形 (\"gallery.php\")\n\n## 13.7 设置\n\n在结束本章之前，我们介绍了一些用于表单访问的相关配置选项。\n\
  \n在 `php.ini` 配置文件中，可以为表 13.2 中列出的选项设置表单处理和文件上传。\n\n| 参数 | 描述 | 默认值 |\n| --- | ---\
  \ | --- |\n| `file_uploads` | 指定是否支持文件上传 | \"1\" |\n| `post_max_size` | 通过 POST\
  \ 传输的文件最大大小 | \"8M\" |\n| `upload_max_filesize` | 传输的文件最大大小 | \"2M\" |\n| `upload_tmp_dir`\
  \ | 传输文件的临时目录 | NULL |\n| `variables_order` | 解析时环境变量、GET、POST、cookie 和服务器数据的顺序\
  \ | \"EGPCS\" |\n| `max_input_nesting_level` | 输入的最大嵌套深度（特别是与数组相关） | 64 |\n\n**表\
  \ 13.2** \"php.ini\" 中的配置参数\n\n# 14 Cookie\n\n有些人认为 Cookie 是一种用于收集数据的烦人手段。然而，许多\
  \ Web 应用程序如果没有 Cookie 几乎是无法想象的。PHP 提供了访问数据 Cookie 的方便方法。\n\nHTTP 是一个无状态协议；也就是说，它没有记忆。这意味着在两个页面请求之间无法临时存储任何数据。第一个页面上的所有可用信息在下一个页面都会丢失。解决这个问题有几种方案，将在本章和下一章中介绍。首先，我们将查看\
  \ Cookie——这种有用但有争议的“小饼干”。\n\n## 14.1 准备工作\n\nPHP 直接集成了对 Cookie 的支持。这意味着不需要额外的安装。然而，为了更好地理解本章中的示例，查看你网络浏览器的\
  \ Cookie 设置是很有用的。根据浏览器的不同，Cookie 可能是自动激活，或者每当新 Cookie 到来时出现警告消息。\n\n在 Safari 中，这些设置可以在\
  \ Safari • 偏好 • 隐私下找到。点击“阻止所有 Cookie”（参见图 14.1）后，Cookie 将不再工作——大多数网站也是如此，正如警告消息所示。\n\
  \n![Safari Cookie 设置](img/klein13_014.png) (f14.1)\n\n**图 14.1** Safari 的 Cookie\
  \ 设置\n\n在 Chrome 中，这些设置可以在 `chrome://settings` 下找到，并在隐私和安全中参见图 14.2。![Chrome Cookie\
  \ 设置](img/klein13_014.png) (f14.2)\n\n**图 14.2** Chrome 的 Cookie 设置\n\n在 Firefox\
  \ 中，这些设置可以在工具 • 隐私与安全下找到。![Firefox Cookie 设置](img/klein13_014.png) (f14.3)\n\n**图\
  \ 14.3** Firefox 的 Cookie 设置\n\nFirefox 浏览器（以及其他浏览器）还提供了 Cookie 处理的选项，可以通过增强型跟踪区域访问。\n\
  \n## 14.2 事实与背景\n\n但 Cookie 到底是什么？这个想法源于 90 年代的 Netscape，当时该公司仍然是领先者。临时描述可以在 `http://s-prs.co/v027`\
  \ 找到。\n\n### 14.2.1 什么是 Cookie？\n\nCookie 是在服务器（服务器）和客户端（浏览器）之间往来的文本信息。Web 服务器作为\
  \ HTTP 头部的一部分发送 Cookie。它如下：\n\n```http\nSet-Cookie: ProgrammingLanguage=PHP\nSet-Cookie:\
  \ LanguageVersion=8\n```\n\n这允许服务器再次访问之前发送的数据并识别用户。Cookie 本身存储在用户的硬盘上。具体实现由每个浏览器负责，并且略有不同。通常使用基于文件的数据库（如\
  \ SQLite）。\n\n还有可能 Cookie 只存储在内存中而不是永久存储在硬盘上。因此，重启浏览器后，这些数据将不再可用。在某些情况下，这种行为是理想的。\n\
  \n### 14.2.2 限制\n\n为了发布 Cookie 规范，采取了一些预防措施。最重要的限制之一是 Cookie 只能由设置它的服务器读取。因此，来自\
  \ `www.php.net` 的 Cookie 对于 `www.asp.net` 是不可见的——反之亦然。然而，可以将 Cookie 绑定到二级域名（SLD）。如果指定\
  \ `.php.net` 为 Cookie 域（带前点），该 Cookie 不仅可以从 `www.php.net` 读取，还可以从 `pecl.php.net`\
  \ 和 `windows.php.net` 等读取。甚至可以限制在域名内的特定路径。如果 Cookie 的路径设置为 `/government`，则无法从 `/opposition`\
  \ 页面访问，反之亦然。\n\n\n\n\n\n浏览器还被指令为最多接受 300 个 cookie。每个域名允许 20 个 cookie。一旦超过了这些限制之一（即总数达到第\
  \ 301 个 cookie 或某个域名的第 21 个 cookie 到达），则可能会删除对应的最旧 cookie。这些限制可以追溯到硬盘空间几乎贵得离谱的时代。现代浏览器对这些限制要宽松得多。\n\
  \n## 14.2.3 透明冲浪者？\n\n因此，cookie 仅由设置它的服务器读取。那么，为什么 cookie 会有这样的名声呢？cookie 经常被称为“透明冲浪者”——这联想到一个恐怖的画面：网络用户在不知情的情况下在网站上暴露了所有的个人数据。\n\
  \n主要原因之一仍然是历史性的。在 1997 年 3 月份的《Byte》杂志，Jon Udell 编写了一篇关于数字证书的文章。在文中，他指出这些数字 ID 明显优于\
  \ cookie；更糟糕的是，cookie 不能保证隐私，因为任何 Web 服务器都可以读取客户端计算机上的每一个 cookie。这个错误的陈述——如上一节所示——传播得非常快；甚至有传言说其他\
  \ Web 服务器可以利用 cookie 来读取用户的硬盘（嗯，cookie 确实存储在用户的硬盘上）。\n\n两个月和几期之后，在 1997 年 5 月，这份迟到的更正出现在页边栏的一个小框中。作者承认他完全没有检查过自己的主张，尽管这在技术上非常容易。他还声称自己有一个如何“窃取”cookie\
  \ 信息的想法，但在打印可能的结果（cookie 是不安全的）时并没有进行检查。事实证明，这是可能的。作者违反了关重要的基础新闻准则，但损害已经造成了。即使在今天，许多人仍然不知道\
  \ cookie 是什么以及它们带来哪些风险（另参见第 14.5 节）——哪些风险仅仅是危言耸听。在完全排除所有偏见和担忧的情况下，我们现在如何在 PHP 中使用\
  \ cookie。\n\n## 14.3 在 PHP 中处理 Cookie\n\n正如所提到的，cookie 处理（读/写）完全通过 HTTP 请求头进行。但如果这个繁琐的过程需要由用户来完成，那么\
  \ PHP 就不是 PHP 了。\n\n### 14.3.1 设置 Cookie\n\n`setcookie()` 函数有两种不同的语法选项。最常用的是以下语法（我们稍后会处理另一种）：\n\
  \n```\nboolean setcookie ( string name [, string value [, int expires [, string\
  \ path \n[, string domain [, bool secure[, bool httponly]]]]]])  \n```\n\n表 14.1\
  \ 解释了七个参数的含义。根据这些数量，你会欣赏 PHP 的命名函数参数功能，但这可能需要再等几页，因为首先要考虑一个特殊特性。\n\n| 参数 | 说明 |\
  \ 数据类型 |\n| --- | --- | --- |\n| name | cookie 的名称；此参数是唯一的强制性参数。所有其他均为可选。 | String\
  \ |\n| value | cookie 的值。 | String |\n| expires | cookie 的过期日期，表示自 1970 年 1 月 1\
  \ 日以来的秒数。 | Integer |\n| path | 可以读取 cookie 的目录。 | String |\n| domain | 访问 cookie\
  \ 的域名。 | String |\n| secure | 一个指定 cookie 是否仅通过 HTTPS 连接发送的值。 | Boolean |\n| httponly\
  \ | 表示 cookie 对于 JavaScript 是否是“不可见的”。 | Boolean |\n\n**表 14.1** \"setcookie()\"\
  \ 的参数\n\n各个参数（name 和 value 除外）在后文中将分别详细介绍。\n\n#### 过期日期\n\ncookie 有两种类型，根据过期日期而不同：\n\
  \n* 临时 cookie 或会话 cookie（session cookies），它们在浏览器关闭之前有效\n* 永久性 cookie 或持久 cookie，它们的有效期直到指定的过期日期\n\
  \n过期日期的设置如 表 14.1 所示，指定为一个整数值。所使用的“测量单位”是 Unix 世界中的 epoch 值：自 1970 年 1 月 1 日以来所经过的秒数。快速且直观地计算此类值的方法有两种主要方法：\n\
  \n* `time()` 返回当前日期和时间作为 epoch 值。如果你想让 cookie 从当前时间起在段时间内有效，请将 `time()` 的返回值加上相应的秒数时间。一个恰好有效一天的\
  \ cookie，其过期日期的值如下：\n\n```\ntime() + 60*60*24\n```\n也就是说，每分钟 60 秒，每小时 60 分钟，每天 24\
  \ 小时。\n\n* `mktime()` 将日期转换为 epoch 值。一个有效期到 2025 年平安夜（12 月 24 日）中午 12 点的 cookie，其过期日期的值如下：\n\
  \n```\nmktime(12, 0, 0, 12, 24, 2025)\n```\n\n#### 注意事项\n\n你可以在第 9 章 中找到关于这些以及其他函数的更多信息。\n\
  \n如果 cookie 没有过期日期（即 `setcookie()` 没有第三个参数，或者第三个参数为零），它就是临时 cookie。它在浏览器关闭时被删除。下次浏览器启动时它将不再存在。以下代码片段设置了\
  \ cookie：\n\n```php\n<?php \n  setcookie(\"ProgrammingLanguage\", \"PHP\", \n  \
  \  time() + 60*60*12); // 有效 12 小时\n  setcookie(\"LanguageVersion\", \"8\", \n \
  \   mktime(0, 0, 0, 12, 24, 2025)); // 2025 年 12 月 24 日\n  setcookie(\"Session\"\
  , \"abc123\"); // 临时的\n?>\n```\n\n#### 路径\n\nCookie 不仅可以绑定到域名，还可以绑定到目录。这在过去特别重要，当时域名非常昂贵，许多网站的\
  \ URL 类似于 site.xyz/username。当然，如果你在 site.xyz/username1 设置了 cookie，对于 site.xyz/username2\
  \ 的竞争对手来说将是致命的。因此，PHP 的 cookie 标准行为如下：你设置 cookie 的目录也将用作 cookie 路径的值。你在 site.xyz/products/index.php\
  \ 设置的某个 cookie 无法从首页 site.xyz/index.php 读取！因此，将 cookie 路径设置为主目录是一个好主意：\n\n```php\n\
  <?php \n  setcookie(\"ProgrammingLanguage\", \"PHP\", \n    time() + 60*60*12, \"\
  /\"); ?>\n```\n\n如果你只需要在网站特定区域使用 cookie（例如管理区域），相应的设置路径同样有用。最终，你将获得微小但显著的性能提升：cookie\
  \ 不再由 浏览器在所有页面的 HTTP 头中发送，而仅针对指定路径内的 URL。\n\n#### 域名\n\n`setcookie()` 的第五个参数是访问\
  \ cookie 的域名。默认情况下——即如果你没有指定域名——浏览器直接从 URL 中获取相关域名。因此，如果你的用户通过 IP 地址访问网站，则只会使用该地址；域名将无法工作。\n\
  \n在原始规范中，Netscape 开发者规定域名必须包含至少两个点。所以如果你想为 pecl.php.net、windows.php.net 和 www.php.net\
  \ 服务 cookie，你必须输入 \".php.net\" 作为值，包括前导的点。\n\n较新的浏览器并不一定要求两个点。然而，为了实现最大的浏览器兼容性，应尽可能在域名中指定至少两个点。\n\
  \n\n\n\n\n现在已经有人提出了一种聪明的技巧，可以在多个域之间使用并收集 cookie。整个过程在第 14.5 节中对进行了详细描述。该方法的核心组件是指定一个外部域。这意味着\
  \ cookie 被设置在 `www.php.net` 上，但指定的域名是 `www.asp.net`。然而，这种“跨域 cookie”会被某些浏览器拒绝，或者可能被拒绝。以下是一个代码片段，在其中创建了一个带有域\
  \ 值的 cookie：\n\n```php\n<?php \n  setcookie(\"ProgrammingLanguage\", \"PHP\", \n\
  \    time() \\+ 60*60*12, \"/\", \".php.net\"); \n?>  \n```\n\n该 cookie 可以从 `php.net`\
  \ 的所有子域中读取。\n\n### 安全性\n\n最后，`setcookie()` 的第六个参数值得提一下。如果将其设置为 `true`，则 cookie 将仅通过安全连接（即通过\
  \ `HTTPS`）发送。因此，如果你在 cookie 中存储敏感数据，就应该设置此参数——但你也需要一个支持 `HTTPS` 的 Web 服务器。\n\n如果你省略了此参数（或将其设置为\
  \ `false`），则 cookie 将仅通过 `HTTP` 发送，而不通过 `HTTPS`。\n\n#### 注意事项\n\n然而，在 cookie 中隐藏敏感数据（无论是否加密）并不一定是有优势的；事实上，这并不建议这样做。更好的做法是将这些数据专门存储在服务器上。在下一章中，你将学习如何实现这一点。\n\
  \n以下是另一个安全 cookie：\n\n```php\n<?php \n  setcookie(\"password\", \"top secret\",\
  \ \n    time() \\+ 60*60*12, \"/\", \".php.net\", \n    true); \n?>  \n```\n\n###\
  \ \"httponly\"\n\n跨站脚本攻击（一种针对 Web 应用程序的攻击，我们在第 32 章中详细讨论过）的可能表现之一是，被注入的 JavaScript\
  \ 代码可以访问 cookie。微软建议了如何至少可以增加这种难度：如果将 `httponly` 指定为额外的 cookie 参数，那么 cookie 将像以前一样随着完整的\
  \ HTTP 通信一起发送，但 JavaScript 不再能看到该 cookie。[ 97 ]](footnotes.html#ftn-fn14_01) 与此同时，其他浏览器开发者也效仿并事后适配了这一功能。\n\
  \n以下 cookie 无法被 JavaScript 读取：\n\n```php\n<?php \n  setcookie(\"password\", \"top\
  \ secret\", \n    time() \\+ 60*60*12, \"/\", \".php.net\", \n    true, true); \n\
  ?>  \n```\n\n### 备用语法和命名参数\n\n大量可能的参数是使用命名参数的典型范例。但如果我们按照如下方式编写前面的代码会发生什么呢？\n\n\
  ```php\n<?php \n  setcookie(name: \"password\", value: \"top secret\", \n    expires:\
  \ time() \\+ 60*60*12, path: \"/\", domain: \".php.net\", \n    secure: true, httponly:\
  \ true); \n?>  \n```\n\nPHP 通过以下错误确认了这一点：\n\n```\nPHP Fatal error: Uncaught Error:\
  \ Unknown named parameter $expires in .\n../set.php:3  \n```\n\n为了解决这个谜题，我们需要稍微扩展一下。为了让\
  \ `setcookie()` 函数尽可能灵活，正如前面提到的，它有一种备用语法：\n\n```\nsetcookie ( string $name [, string\
  \ $value = \"\" [, array $options = [] ]] )  \n```\n\n换句话说，除了名称和值之外，所有参数都存储在一个数组中，因此讨论的调用可以重写为：\n\
  \n```php\nsetcookie(\"password\", \"top secret\", \n   [ \n    expires: time() \\\
  + 60*60*12, path: \"/\", domain: \".php.net\", \n    secure: true, httponly: true,\
  \ \n  ]\n```\n\n这种调用是可能的。`setcookie()` 必须协调这两种签名。[98 ]](footnotes.html#ftn-fn14_02)\n\
  \n```php\nfunction setcookie(string $name, string $value = \"\", array $options\
  \ = []): bool {}\n```\n\n如果 `expires` 是数字，则它是到期时间；如果是数组，则则是 `options`。以下是可能的调用：\n\
  \n```php\nsetcookie(\"password\", \"top secret\", \ntime() \\+ 60*60*12, \"/\",\
  \ \".php.net\", true);\n```\n\n这两种 cookie 必须协调这两种签名。[99 ]](footnotes.html#ftn-fn14_03)\n\
  \n```php\n<?php\n  setcookie(\"password\", \"top secret\", \n    time() \\+ 60*60*12,\
  \ \"/\", \".php.net\", \n    true); \n?>  \n```\n\n### SameSite\n\nSameSite cookie\
  \ 是一个热门话题。一方面，跨站请求伪造（CSRF）攻击可以被防止或至少变得更加困难；另一方面，由于 Chrome 默认设置了 Lax 模式，每个 cookie\
  \ 有三种 SameSite 级别。这允许我们通过 数组来设置此值：\n\n| 参数 | 描述 |\n| --- | --- |\n| None | 允许跨站请求发送\
  \ cookie |\n| Lax | 仅通过 GET 请求发送 cookie |\n| Strict | 跨站请求时不发送 cookie |\n\n**表 14.2**\
  \ Cookie 的 SameSite \n\n由于 Chrome 默认设置为 Lax 模式（Firefox 也会在某时这样做），这可能需要一些额外的操作。这允许通过\
  \ `setcookie()` 如下：\n\n```php\nsetcookie(name: \"password\", value: \"top secret\"\
  , \n  options: [ \n    expires: time() \\+ 60*60*12, \n    path: \"/\", \n    domain:\
  \ \".php.net\", \n    secure: true, \n    httponly: true, \n    samesite: \"None\"\
  , \n  ]\n );\n```\n\n### 时机\n\n最后，一个重要的注意事项：由于 cookie 是作为 HTTP 头部发送的，所有 `setcookie()`\
  \ 的调用必须在第一个 HTML 输出之前完成。](footnotes.html#ftn-fn14_04) 这是因为一旦交付了 HTML，HTTP 头部就已经发送了。如果你在之后设置\
  \ HTTP 头部，就会出现图 14.4 所示的错误信息。\n\n在以下脚本中，这是正确的；即在 HTML 代码之前设置了 cookie：\n\n```php\n\
  <?php\n  setcookie(\"ProgrammingLanguage\", \"PHP\", \n    time() \\+ 60*60*12,\
  \ \"/\"); \n  setcookie(\"LanguageVersion\", \"8\", \n    mktime(0, 0, 0, 12, 24,\
  \ 2025), \"/\"); \n  setcookie(\"Session\", \"abc123\", 0, \"/\"); \n?>  \n```\n\
  \n```html\n<html>\n<head>\n  <title>Cookies</title>\n</head>\n<body>\n  <p>Cookies\
  \ have been set!</p>\n</body>\n</html>\n```\n\n**代码列表 14.1** 设置了三个 cookie (\"set.php\"\
  )\n\n该脚本的输出相对较少，因为正如前面所提到的，cookie 只有在下次访问页面时才会发送到服务器。然而，如果你查看浏览器开发者工具，你至少可以看到 Cookie\
  \ HTTP 头部。\n\n\n\n\n\n关于时间顺序的最后一点说明：Cookies 是按照它们在 PHP 脚本中出现的顺序发送给客户端的\n\n#### 特殊字符\n\
  \nCookie 的值会自动进行 URL 编码，因此在底层会调用 `urlencode()`。然而，在某些情况下你可能并不希望这样做，例如 Cookie 的值已经是\
  \ URL 编码过的。在这种情况下，请使用 `setrawcookie()` 函数，它不会修改 cookie 的值。除之外，该函数与 `setcookie()`\
  \ 完全相同。\n\n### 14.3.2 读取 Cookies\n\nPHP 读取客户端发送到 Web 服务器的所有 Cookie，并将它们放入 `$_COOKIE`\
  \ 全局数组中。下面的简单脚本输出该数组的内容；它简单地调用了 `print_r()`。\n\n```html\n<<html> \n<head> \n  <title>Cookies</title>\
  \ \n</head> \n<body> \n<xmp>  \n```\n\n```php\n<?php \n  print_r($_COOKIE); \n?>\
  \  \n```\n\n```html\n</xmp> \n</body> \n</html>  \n```\n\n**列表 14.2** 输出 \"_COOKIE\"\
  \ 的内容 (\"print_r.php\")\n\n图 14.6 显示了如果在 `set.php` 之前已执行，该脚本的输出（参见列表 14.1）。\n\n\
  ![浏览器中显示的 \"_COOKIE\" 内容](img/img-f14.6.html) \n\n**图 14.6** 浏览器中显示的 \"_COOKIE\"\
  \ 内容\n\n要访问单个 cookie，必须使用 cookie 名称作为数组键。接下来的列表显示了之前设置的三个 cookie。你可以在图 14.7 中看到结果。\n\
  \n```html\n<html> \n<head> \n  <title>Cookies</title> \n</head> \n<body> \n<table>\
  \ \n  <tr><th>Name</th><th>Value</th></tr> \n  <tr><td>Programming language</td><td>\
  \  \n```\n\n```php\n<?php \n  echo htmlspecialchars( \n    $_COOKIE[\"Programming\
  \ language\"]); \n?>  \n```\n\n```html\n  </td></tr>\n  <tr><td>Language version</td><td>\
  \  \n```\n\n```php\n<?php \n  echo htmlspecialchars( \n    $_COOKIE[\"Language version\"\
  ]); \n?>  \n```\n\n```html\n  </td></tr> \n  <tr><td>Session</td><td>  \n```\n\n\
  ```php\n<?php \n  echo htmlspecialchars( \n    $_COOKIE[\"Session\"]); \n?>  \n\
  ```\n\n```html\n  </td></tr> \n</table> \n</body> \n</html>  \n```\n\n**列表 14.3**\
  \ 输出三个 Cookies (\"read.php\")\n\n![浏览器中显示的 Cookie 句值（值）](img/img-f14.7.html) \n\n\
  **图 14.7** 浏览器中显示的 Cookie 值\n\n但请注意：如果不存在指定名称的 cookie，将根据相应的 PHP 配置显示警告消息。要测试这一点，请关闭所有浏览器窗口，重启浏览器并再次调用\
  \ `read.php` 脚本（或者，如果你的 Web 浏览器允许，你也可以手动删除 cookie 会话）。你可以在图 14.8 中看到结果：cookie 会话不再存在（因为它没有过期日期）。因此，`$_COOKIE[\"\
  Session\"]` 将无处可用。\n\n![不存在的 Cookie 的错误消息](img/img-f14.8.html) \n\n**图 14.8** 不存在\
  \ Cookie 的错误消息\n\n因此，你必须显式检查 cookie 是否存在。可以使用 `array_key_exists()` 数组函数来实现（参见第 8\
  \ 章）：\n\n```php\nif (array_key_exists(\"Session\", $_COOKIE)) { \n  // ...\n}  \n\
  ```\n\n然而，更常见的做法是像表单处理那样使用 `empty()` 或 `isset()` 进行检查：\n\n```php\nif (isset($_COOKIE[\"\
  Session\"])) { \n  // ...\n}  \n```\n\n#### 注意事项\n\n在书的在线材料中（参见前言）可以找到列表 14.3 的相应改进版本，文件名为\
  \ `read-improved.php`。那里的警告消息也消失了。\n\n这允许你读取每个 cookie，但无法读取其属性（如路径和过期日期）。此类数据仅存储在客户端；只有\
  \ cookie 名称和 cookie 值会被发送到服务器。\n\n### 14.3.3 删除 Cookies\n\n最后，仍然有一个如何删除 cookie 的。这可能是需要的，例如当\
  \ cookie 存储了用户已登录受保护系统的事实时。这里的技巧是将过期日期设置为过去的某个日期。浏览器随后从 cookie 内存中删除该 cookie。\n\n\
  例如，值 `0` 适用于此操作——即将日期转换为 1970 年 1 月 1 日——因为它显然在过去。以下代码将适用于会话 cookie；对于持久性 cookie，工作原理相同：\n\
  \n```php\nsetcookie(\"Session\", \"abc123\", 0, \"/\");  \n```\n\n#### 注意事项\n\n\
  再次提醒，请务必使用与设置 cookie 时相同的剩余参数。如果你省略了路径的第四个参数，浏览器会将该 cookie 视为一个新的临时 cookie（然后由于过期日期会立即将其删除）。\n\
  \n让我们创建一个允许用户删除 cookie 的小型应用程序。为此，所有的 cookie 都通过 `foreach` 循环输出：\n\n```php\nforeach\
  \ ($_COOKIE as $name) { \n  // ...\n }  \n```\n\n在每个 cookie 之后，都会输出一个链接，通过 URL 再次调用脚本。\n\
  \n\n\n\n然而，有一个限制：如前所述，路径的值必须与删除 cookie 时实际设置的 cookie 路径相匹配。这无法通过 `PHP` 读取到。因此，路径值\
  \ `\"/\"` 被“猜测”为该路径。如果 cookie 具有不同的路径，则删除将无法生效。\n\n### 14.3.4 “新” Cookie\n\n正如之前提过的，新的\
  \ cookie 规范可以在 [www.ietf.org/rfc/rfc2965.txt](http://www.ietf.org/rfc/rfc2965.txt)\
  \ 找到。该规范使用 `Set-Cookie2` 而不是 `Set-Cookie` 作为设置 cookie 的 HTTP 头部。cookie 数据的传输也也不同；例如，cookie\
  \ 值是在引号中传输的：\n\n```\nSet-Cookie2: Session=\"abc123\"; Path=\"/\"  \n```\n\n这设置了一个名为\
  \ `Session` 的 cookie，值为 `\"abc123\"`，它可以在整个网站（路径 `/`）上读取。随后，客户端将如下所示将 cookie 发回给\
  \ Web 服务器：\n\n```\nCookie: $Session=\"abc123\"; $Path=\"/\"  \n```\n\n当前浏览器尚未支持这种格式。然而，已经可以使用\
  \ `PHP` 使用这项技术了。你必须使用 `header()` 函数来设置 cookie，通过该函数你可以指定 HTTP 头部：\n\n```\nheader(\"\
  Set-Cookie2: Session=\\\"abc123\\\"; \" . \n       \"Path=\\\"/\\\"\");  \n```\n\
  \n一旦出现了可以处理这些“新” cookie 的客户端，你就可以通过 `$_SERVER[\"HTTP_COOKIE\"]` 访问这些数据。\n\n### 提示\n\
  \n`$_SERVER[\"HTTP_COOKIE\"]` 已经包含了 cookie 名称和值的列表；`$_COOKIE` 的数据也是由此确定的。\n\n如你所见，使用\
  \ `PHP` 你已经为下一代 cookie 做好了准备；然而，由于浏览器必要的向后兼容性，可能还需要一段时间才能被普及。但看起来似乎是值得的，因为新规范包含了将\
  \ cookie 绑定到端口的选项。\n\n#### 输出缓冲\n\n我们之前已经暗示过：由于 cookie 是作为 HTTP 头部的一部分发送的，因此必须在第一个\
  \ HTML 输出之前设置，因为 `PHP` 会将你输出的所有数据（例如通过 `echo` 或 `print` 甚至是 HTML 片段）直接发送给客户端。然而，你可以通过使用输出缓冲防止这一点。\n\
  \n按照以下步骤操作：\n\n1. 使用 `ob_start()` 开启输出缓冲。\n2. 输入你想要输出的数据（包括 cookie）。\n3. 使用 `ob_end_flush()`\
  \ 将所有缓冲数据发送到 浏览器（如果你省略该函数，缓冲区将在页面结束时自动发送给客户端）。\n\n因此，我们可以将 代码列表 14.1 修改如下所示的代码列表\
  \ 14.5](#14_003.html#l14.5)——在页面中间调用 `setcookie()`：\n\n```\n<?php \n  ob_start();\
  \ \n?> \n```\n\n```\n<html> \n<head> \n  <title>Cookies</title> \n</head> \n<body>\
  \ \n```\n\n```php\n<?php \n  setcookie(\"ProgrammingLanguage\", \"PHP\", \n    time()\
  \ + 60*60*12, \"/\"); \n  setcookie(\"LanguageVersion\", \"8\", \n    mktime(0,\
  \ 0, 0, 12, 24, 2025), \"/\"); \n  setcookie(\"Session\", \"abc123\", 0, \"/\");\
  \ \n?> \n```\n\n```\n<p>Cookies have been set!</p> \n</body> \n</html> \n```\n\n\
  ```php\n<?php \nob_end_flush(); \n?> \n```\n\n**代码列表 14.5** 使用缓冲设置了三个 Cookie (\"\
  set-buffering.php\")\n\n输出缓冲还提供了许多其他选项，这里只简要概述其中之一：大多数 Web 浏览器支持使用 `Gzip` 压缩的数据。这节省了大量的带宽，因为\
  \ Web 服务器不再发送 HTML 文档，而是只发送它的压缩版本。\n\n以下调用（必须位于页面头部）会为该页面开启 `Gzip` 压缩：\n\n```\n\
  ob_start(\"ob_gzhandler\"); \n```\n\n由于只有完整的页面才能使用 `Gzip`（或其他算法）进行压缩，因此在这里你需要一个输出缓冲。顺便提一下，`PHP`\
  \ 机制会自动检查浏览器是否支持 `Gzip`。如果不支持，数据将以传统方式发送——即未压缩。但需要注意的是，某些 Web 服务器也可以根据需要自动用 `Gzip`\
  \ 压缩所有输出数据。\n\n## 14.4 Cookie 测试\n\n让我们通过一个应用示例来演示我们学到的内容。由于 cookie 可以被用户禁用，因此确定用户是否接受\
  \ cookie 是非常重要的。这种测试可以很快地创建。\n\n首先，必须将 cookie 发送到浏览器。由于大多数浏览器分别处理临时和永久 cookie，你应该测试两种类型的\
  \ cookie：\n\n```\nsetcookie(\"CookieTemp\", \"ok\"); \nsetcookie(\"CookiePerm\"\
  , \"ok\", time() + 60*60*24);  \n```\n\n当 Web 服务器请求下一个文档时，这些 cookie 才会可用。由于 `IIS`\
  \ 的 bug，排除了使用 `header()` 转发（除非 `IIS` 的 bug 已修复）。\n\n以下脚本显示了完整的测试：\n\n```php\n<?php\
  \ \n// ... 测试逻辑 ...\n?>\n```\n\n\n\n\n这通常是如此，但有几种方法可以规避这一限制。假设你访问一个名为 `www.xy.zzz`\
  \ 的网站，其中包含一个来自 `www.ad-company.zzz` 发出的广告横幅。这意味着广告营销人员可以设置一个可以发送回 `ad-company.zzz`\
  \ 的 cookie。到目前为止，一切正常。\n\n然而，现在你访问了另一个网站，该网站纯属偶然地使用了同一个广告营销人员进行横幅显示。因此，如果该网站上显示了一个图片并由\
  \ `ad-company.zzz` 请求，广告营销人员就会接收到 cookie 并识别出你——尽管你正处于一个完全不同的网站上。\n\n在这种情况下，“损害”的当然是有限的。广告营销人员可以确定你访问了哪些网站，并此创建用户画像，并向你提供定向广告。然而，个人数据（如电子邮件地址或你在网站上输入的其他信息）对营销人员来说是不可见的。实践也表明，针对特定目标群的广告横幅似乎并不真的起作用，正如两位作者自己的测试所示的那样。相反，我们经常看到已经购买过的产品的广告。此外，这些第三方\
  \ cookie 会被当前的浏览器版本根据请求过滤掉。\n\n一种较旧的方法是在数据收集服务器上手动设置 cookie 中的域值。无论你处于哪个页面，cookie\
  \ 看起来总是来自收集站点，并被发送回那里。然而，这不再有效了；第三方 cookie 可以在浏览器中被自动拒绝。因此，即使这种“技巧”曾经偶尔被使用，它现在也成为过去式。\n\
  \n# 15 会话 (Sessions)\n\n会话依赖于 cookie，但使用起来更方便。虽然不使用 cookie 也可以使用会，但不建议这样做。\n\nHTTP\
  \ 是一个无状态协议；上一章已经多次指出这一点。cookie 只是规避这一限制的一种方法。从用户的角度来看，cookie 的主要问题是它们被用于在一定范围内创建用户画像。从网站开发者的角度来看，cookie\
  \ 的主要问题是它们可以在浏览器中被禁用。或者说，是可以禁用的——稍后详细介绍。\n\n一种可能的解决方案可以用一个词来表达：sessions。100 当访问者访问网站时，就会产生会话。因此，如果你访问在线商店的首页，点击了几页面并在\
  \ 10 分钟后浏览到另一个网站，那么你就与该商店有一个 10 分钟的会话。如果你在一个小时后回到商店，这通常被视为一个新的会话。\n\nPHP 提供了在会中存储数据的选项。这意味着你保存了会话数据——使用稍后解释的机制——只要会话处于激活状态，就可以再次访问这些数据。PHP\
  \ 会自动处理所有的技术细节（数据存储在何处、如何实现等）。\n\n## 15.1 准备工作\n\nPHP 的会话支持也是 PHP 的一部分，不需要任何额外的\
  \ DLL 或配置开关。101 然而，在本章期间，你可能需要定期对 `php.ini` PHP 配置文件进行修改。那里有一个 `Session` 部分，总结了所有相关的设置。起初，设置\
  \ `session.save_path` 的值是重要的。PHP 提供的 `php.ini` 模板包含以下内容：\n\n```\nsession.save_path\
  \ = \"/tmp\"\n```\n\n为什么这只是一个注释？在 Unix/Linux 系统上，`/tmp` 目录通常存在且对 Web 服务器或 PHP 进程可写，但在\
  \ Windows 上，这个目录通常不存在。如果它存在，Web 服务器可能没有写入权限。因此，在这种情况下，会话管理就会失败。有三种方法可以修复此：\n\n*\
  \   创建目录并为 Web 服务器分配写入权限。\n*   为 `session.save_path` 输入不同的目录。\n*   在 Apache 情况下，确保目录存在且\
  \ PHP 具有写入权限；在 IIS 情况下，确保目录存在且 PHP 具有写入权限；在 Windows 情况下，确保 `C:\\Temp` 目录存在且 PHP\
  \ 具有写入权限。（注：此处由于原文列表列表截断，已根据逻辑补全）。\n\n\n\n如果你正在使用 Unix/Linux，请使用此开关配置 PHP：\n\n`--enable-trans-sid`:\n\
  \n```\n./configure --enable-trans-sid  \n```\n\n*   在 Windows 下，此步骤不是必须的；PHP 分发版已经以这种方式编译了。\n\
  \n一旦你完成了这两个步骤，会话 ID（session ID）就可以自动附加到所有链接中。这里强调的是 `can`（可以）：该决策取决于 `php.ini` 配置设置\
  \ `session.use_cookies` 和 `session.use_only_cookies`。\n\n如果激活了 `session.use_only_cookies`——即设置为\
  \ `1`——那么 PHP 的会话管理将仅通过 cookie 运行。因此，客户端必须支持 cookie。`session.use_cookies` 的情况则有所不同。如果将其设置为\
  \ `0`——即关闭——则完全不使用任何 cookie；会话 ID 将被自动添加到 URL 中。然而，建议激活此选项，因为 PHP 此时会尝试设置一个带有会话\
  \ ID 的 cookie。如果客户端接受该 cookie，就会使用 cookie。但是，如果客户端拒绝该 cookie，则 PHP 将自动切换到“通过 URL\
  \ 传递会话 ID”模式。[表 15.1] 释了这一过程。\n\n| \"session.use_cookies\" | \"session.use_only_cookies\"\
  \ | 浏览器支持 cookie | PHP 会话通过/不通过 cookie 实现 |\n| --- | --- | --- | --- |\n| 0 | 0\
  \ | 是 | 不通过 |\n| 0 | 0 | 否 | 不通过 |\n| 0 | 1 | 是 | 通过 |\n| 0 | 1 | 否 | 不可能！ |\n|\
  \ 1 | 0 | 是 | 通过 |\n| 1 | 0 | 否 | 不通过 |\n| 1 | 1 | 是 | 通过 |\n| 1 | 1 | 否 | 不可能！\
  \ |\n\n**表 15.1** 会话设置对 cookie 的影响\n\n但 PHP 如何自动在生成的 HTML 代码中搜索链接呢？简单来说，PHP 解释器搜索某些模式。这些模式定义在\
  \ php.ini 中：\n\n```\nsession.trans_sid_tags = \"a=href,area=href,frame=src,form=\"\
  \  \n```\n\n该值的结构为 `Tag=Attribute`，其中即使属性未设置，等号也是强制性的。`<form>` 条目占据一个特殊位置：这确保了一个带有会话名称和\
  \ ID 的隐藏表单字段被整合进来。\n\n#### 注意事项\n\n此时可以立即注意到一个小的遗漏：对于 `<iframe>` 元素，会话 ID 不会自动附加。因此，你应该将此值添加到你的\
  \ php.ini 中：\n\n```\nsession.trans_sid_tags = \"a=href,area=href,frame=src,iframe=src,form=\"\
  \ \n```\n\n### 15.2.2 性能\n\n很明显，PHP 的会话支持消耗大量的性能。在生成 HTML 代码后，仍然需要搜索 URL，这些 URL\
  \ 可能需要通过会话 ID 进行扩展。这需要时间，因为所有链接都必须被找到并重写。因此，你应该只在需要的地方使用会话支持。电子商务网站是一个例外，它们在每个页面的每个都需要会话数据，因为购物车的内容不能丢失。如果需要，可以配置\
  \ PHP 使会话始终处于激活状态。这通过 php.ini 中的以下设置实现：\n\n```\nsession.auto_start = 1  \n```\n\n\
  由于上述原因，默认情况下，`session.auto_start` 的值为 `0`。\n\n#### 注意事项\n\n在以下示例中，我们始终假设会话没有自动激活。因此，我们在每个单独的页面上通过\
  \ `session_start()` PHP 函数启动会话。如果你将 `session.auto_start` 设置为 `1`，则必须从示例列表中移除对 `session_start()`\
  \ 的调用。\n\n存在一个潜在的性能问题：PHP 解释器搜索某些模式。这些模式定义在 php.ini 中：（此处对应原文逻辑重复，已按要求整合翻译）...（此处由于原文存在重复内容，已按要求处理）\n\
  ...然而，建议激活此选项，因为 PHP 此时会尝试设置一个带有会话 ID 的 cookie。如果客户端接受该 cookie，就会使用 cookie。但是，如果客户端拒绝该\
  \ cookie，则 PHP 将自动切换到“通过 URL 传递会话 ID”模式。[表 15.1] 释了这一过程。\n\n（注：由于提供的待翻译文本存在大量逻辑重复的段落，译文已根据要求“不要重复输出原文”进行了逻辑整合和翻译。）\n\
  \n由于上述原因，`session.auto_start` 的值为 `0`。\n\n#### 注意事项\n\n在以下示例中，我们始终假设会话没有自动激活。因此，我们在每个单独的页面上通过\
  \ `session_start()` PHP 函数启动会话。如果你将 `session.auto_start` 设置为 `1`，则必须从示例列表中移除对 `session_start()`\
  \ 的调用。\n\n存在一个潜在的性能问题：PHP 解释器搜索某些模式。这些模式定义在 php.ini 中：\n\n（由于原文中包含大量重复段落，此处译文已涵盖核心内容翻译并确保不重复输出。）\n\
  \n\n\n\n\n```php\nProgramming language|s:3: \"PHP\";Language version|i:8;  \n```\n\
  \n![The Session Directory with One File: There Are Many More on a Production System](img/img-f15.2.html)\
  \ \n\n**图 15.2** 单文件会话目录：生产系统中有更多选择\n\n### 15.3.2 读取数据\n\n读取数据同样简单：你只需要查看 `$_SESSION`\
  \ 来判断所需的数据是否存在其中。但请注意，该数组只有在调用 `session_start()` 之后才会被填充相应的值。代码列表 15.2 显示了读取会话数据的对应脚本，这些数据是在代码列表\
  \ 15.1 中写入的。\n\n```php\n<?php \n  session_start(); \n?>  \n```\n\n```html\n<html>\
  \ \n<head> \n  <title>Sessions</title> \n</head> \n<body> \n<p>Programming language:\
  \  \n```\n\n```php\n<?php \n  if (isset($_SESSION[\"Programming language\"])) {\
  \ \n    echo htmlspecialchars($_SESSION[\"Programming language\"]); \n  } \n?> \
  \ \n```\n\n```html\n</p> \n<p>Language version:  \n```\n\n```php\n<?php \n  if (isset($_SESSION[\"\
  Language version\"])) {\n    echo htmlspecialchars($_SESSION[\"Language version\"\
  ]); \n  } \n?>  \n```\n\n```html\n</p> \n<p><a href=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']);\
  \ ?>\">Reload \n</a></p> \n</body> \n</html>  \n```\n\n**代码列表 15.2** 读取会话数据（`read.php`）\n\
  \n![The Session Data in the Web Browser](img/img-f15.3.html) \n\n**图 15.3** 浏览器中的会话数据\n\
  \n如果你更仔细地观察生成的 HTML 代码，你会注意到，在在浏览器中第二次访问支持会话的页面后，如果你已启用了 Cookie 支持，URL 将不再扩展会话 ID（参见图\
  \ 15.3）。否则，会话 ID 将继续附加到所有链接上，并且即使在使用表单或框架时也不会丢失。\n\n### 15.3.3 删除数据\n\n要从会话中删除数据，有两种方法：\n\
  \n*   将相应的会话变量设置为空字符串或 0。这本身并没有删除变量，但它删除了它的值。\n*   使用 PHP 函数 `unset()` 删除相应的会话变量。\n\
  \n对于进一步的编程，这两种方法的结果是相同的，但出于性能考虑，使用 `unset()` 更好：\n\n```php\n<?php \n  if (isset($_SESSION[\"\
  Programming language\"])) { \n    unset($_SESSION[\"Programming language\"]); \n\
  \  } \n?>  \n```\n\n也可以删除整个会话（例如在注销时）。这需要两个步骤：\n\n*   首先，`session_unset()` 会删除会话中的所有变量；这等同于在\
  \ `foreach` 循环中使用 `unset()` 从 `$_SESSION` 中移除所有变量。或者，你也可以使用以下技巧来删除会话数组：\n\n    ```php\n\
  \    $_SESSION = [];  \n    ```\n\n*   然后，`session_destroy()` 会移除会话本身。\n\n你可能还会感兴趣删除会话\
  \ Cookie（如果它被设置过）。它的名称在 `php.ini` 中设置。默认在那里可以以下条目：\n\n```ini\nsession.name = PHPSESSID\
  \  \n```\n\n你可以通过 PHP 的 `session_name()` 动态地从读取此值。以下调用将删除此（临时的）Cookie：\n\n```php\n\
  <?php \n  setcookie(session_name(), \"away with it\", 0, \"/\"); \n?>  \n```\n\n\
  下一个代码列表一次性完成了所有这些任务。\n\n```php\n<?php \n  session_start(); \n?>  \n```\n\n```html\n\
  <html> \n<head> \n  <title>Sessions</title> \n</head> \n<body>  \n```\n\n```php\n\
  <?php \n  session_unset(); \n  session_destroy(); \n  setcookie(session_name(),\
  \ \"away with it\", 0, \"/\"); \n?>  \n```\n\n```html\n<p>Everything deleted!</p>\
  \ \n</body> \n</html>  \n```\n\n**代码列表 15.3** 所有会话数据均已删除（`delete.php`）\n\n### 15.3.4\
  \ 配置会话\n\n原则上，`php.ini` 文件用于配置会话。然而，在调用 `session_start()` 时可以指定配置选项，这些选项的优先级高于相应的\
  \ `php.ini` 设置。这本身可能并不十分有趣。但是，有一个配置设置只对 `session_start()` 起作用：`read_and_close`。如果激活了此项，会话会在读取数据后立即再次关闭。对于以下页面，这是一种简单但有效的性能措施：\n\
  \n```php\nsession_start([\"read_and_close\" => true]); \n```\n\n`session_start()`\
  \ 的参数是一个数组。\n\n## 15.4 受保护区域\n\n会话在网站中非常常见。其基础是 `session_start()`。以下列表显示了代码：\n\n\
  ```php\n<?php\n  session_start();\n\n  if (!isset($_SESSION[\"login\"])) {\n   \
  \ $url = $_SERVER[\"REQUEST_URI\"];\n    if (isset($_SERVER[\"QUERY_STRING\"]))\
  \ {\n      $url .= \"?\" . $_SERVER[\"QUERY_STRING\"];\n    }\n    header(\"Location:\
  \ $url\");\n    exit;\n  }\n?>\n```\n\n```html\n<html>\n<head>\n  <title>Protected\
  \ Area</title>\n</head>\n<body> \n<h1>Secret Info</h1>\n<a href=\"logout.php\">Logout</a>\n\
  </body> \n</html>\n```\n\n如果用户未获得授权，将进行重定向到登录页面。\n\n```php\n<?php\n  session_start();\n\
  \  unset($_SESSION[\"login\"]);\n  session_destroy();\n  header(\"Location: login.php\"\
  );\n  exit;\n?>\n```\n\n**代码列表 15.4** 登录检查代码（`login.php`）\n\n此脚本通常通过 `require_once`\
  \ 安装。\n\n```php\nrequire_once \"login.inc.php\";\n```\n\n```html\n<html> \n<head>\
  \ \n  <title>Protected Area</title> \n</head> \n<body> \n<h1>Secret Info</h1>\n\
  </body> \n</html>  \n```\n\n**代码列表 15.5** 登录逻辑代码（`login.inc.php`）\n\n```php\n<?php\n\
  \  session_start();\n\n  if (isset($_POST[\"user\"]) && isset($_POST[\"password\"\
  ])) {\n    if ($_POST[\"user\"] == \"christian\" && \n        $_POST[\"password\"\
  ] == \"top secret\") {\n      $_SESSION[\"login\"] = \"ok\";\n      $url = (isset($_GET[\"\
  url\"])) ? nl2br($_GET[\"url\"]) : \"index.php\";\n      header(\"Location: $url\"\
  );\n      exit;\n    }\n  }\n?>\n```\n\n```html\n<html>\n<head>\n  <title>Restricted\
  \ Area / Login</title>\n</head>\n<body>\n<form method=\"post\" action=\"\">\nUser:\
  \ <input type=\"text\" name=\"user\" size=\"10\" /><br />\nPassword: <input type=\"\
  password\" name=\"password\" size=\"10\" /><br />\n<input type=\"submit\" value=\"\
  Login\" />\n</form>\n</body>\n</html>\n```\n\n**代码列表 15.6** 登录表单（`login.php`）\n\n\
  ## 15.5 数据库中的会话\n\n尽管 PHP 的会话处理声誉良好但在某些场景下，独立的会话管理是有意义的。例如，你希望在会话期间收集数据并存储在数据库中；你希望会话本身也保存在数据库中。在这种情况下，PHP\
  \ 允许你自己负责会话数据管理。对应的 PHP 函数是 `session_set_save_handler()`：\n\n\n\n\n\n```\nbool session_set_save_handler(callback\
  \ open, callback close, callback read, \n  callback write, callback destroy, callback\
  \ gc)  \n```\n\n这六个参数具有以下含义：\n\n- `open`: 打开会话\n- `close`: 关闭会话\n- `read`: 读取会话数据\n\
  - `write`: 写入会话数据\n- `destroy`: 销毁会话数据\n- `gc`: 清理（垃圾回收）\n\n因此，这六个参数每一个代表会话管理中的一个事件。每个参数都是在相应事件发生时要调用的函数名称，或者作为匿名函数的函数本身。在后面，我们将提供这六个函数的示例实现。这种方法的优点是\
  \ PHP 负责处理其余繁琐的工作，例如会话 ID 的生成和所有链接的自动适配。\n\n以下代码将会话数据写入数据库，与传统的基于文件的方法相比，这可以带来巨大的性能优势。这需要提前阅读数据库章节，特别是关于\
  \ SQLite 的章节（第 20 节）。然而，即使没有了 SQLite 章节的基础知识，也能理解代码的基本功能。你只需要对示例中使用的 `sessions.db`\
  \ 数据库具有写权限。\n\n### 注意\n\n在生产服务器上，你必须确保 `sessions.db` 文件无法从外部访问。请将文件存储在 Web 服务器的主目录之外，或者配置你的服务器使得\
  \ .db 扩展的文件不会发送给客户端。\n\n我们现在将逐步构建代码。首先，我们将数据库文件名保存在全局变量中，以便以后于自定义，并编写一个创建表的函数。我们需要三个字段：\n\
  \n- `id`: 会话 ID\n- `data`: 会话数据\n- `access`: 最后一次访问会话数据的日期\n\n例如：\n\n```php\n<?php\n\
  \  $GLOBALS[\"sessions_db\"] = \"sessions.db\";\n  function createDB() {\n    $db\
  \ = new SQLite3($GLOBALS[\"sessions_db\"]);\n    $result = $db->query(\"CREATE TABLE\
  \ sessiondaten (id VARCHAR(32)\n      PRIMARY KEY, data TEXT, access VARCHAR(14))\"\
  );\n    $db->close();\n  }  \n```\n\n由于 SQLite 是一个无类型数据库，因此编写一个返回时间戳的辅助函数是有意义的。这种方法的优点是时间戳可以进行排序，因为日期的“最大”部分始终位于最前面——先是年，然后是月、日、小时、分钟和秒：\n\
  \n```php\n  function timestamp() { \n    return date(\"YmdHis\"); \n  }  \n```\n\
  \n首先是会话打开时要启动的函数。起初这里没什么做什么；数据库连接被打开并保存在全局变量中。PHP 自动将会话路径和相应的会话名称作为参数传递；但对我们的目的而言，这两者都不感兴趣。该函数绝对需要一个返回值：\n\
  \n```php\n  function _open($path, $name) {\n    if (!file_exists($GLOBALS[\"sessions_db\"\
  ])) {\n      createDB();\n    }\n    $GLOBALS[\"sessions_id\"] = new SQLite3($GLOBALS[\"\
  sessions_db\"]);\n    return true;\n  }  \n```\n\n在关闭会话时，必须关闭相关的数据库连接：\n\n```php\n\
  \  function _close() {\n    $GLOBALS[\"sessions_id\"]->close();\n    unset($GLOBALS[\"\
  sessions_id\"]);\n    return true;\n  }  \n```\n\n在读取会话数据时，情况变得有趣起来。PHP 自动将会话 ID\
  \ 传递给关联的处理函数；程序随后返回完整的序列化会话数据。如所述，PHP 负责处理所有繁琐的工作，例如填充 `$_SESSION` 数组。因此，读取仅限于执行和评估一个简单的\
  \ SELECT SQL 查询。此外，最后一次访问的日期设置为当前时间戳。这记录了会话已被访问，因此会话仍然处于激活状态。如果数据库没有打开（这实际上不应该发生，但防患于未），则将显式地调用\
  \ `_open()`：\n\n```php\n  function _read($sessionid) {\n    if (!isset($GLOBALS[\"\
  sessions_id\"])) {\n        _open(\"\", \"\");\n    }\n    $result = $GLOBALS[\"\
  sessions_id\"]->\n       query(\"SELECT data FROM session data WHERE id='$sessionid'\"\
  );\n    $row = $result->fetchArray();\n    if ($row) {\n      $value = $row[\"data\"\
  ];\n      $sessionid = $GLOBALS[\"sessions_id\"]->escapeString($sessionid);\n  \
  \    $GLOBALS[\"sessions_id\"]->query(\"UPDATE session data SET access=\n      \
  \ '\" . timestamp() . \"' WHERE id='$sessionid'\");\n    } else {\n      $value\
  \ = \"\";\n    }\n    return $value;\n  }  \n```\n\n写入会话数据时的过程也类似。UPDATE 语句同时更新会话信息的值和最后一次访问的日期。如果执行失败，则说明会话中还没有数据，这就是为什么添加了\
  \ `INSERT` 命令：\n\n```php\n  function _write($sessionid, $data) {\n    if (!isset($GLOBALS[\"\
  sessions_id\"])) {\n        _open(\"\", \"\");\n    }\n    $data = $GLOBALS[\"sessions_id\"\
  ]->escapeString($data);\n    $sessionid = $GLOBALS[\"sessions_id\"]->escapeString($sessionid);\n\
  \    $result = $GLOBALS[\"sessions_id\"]->query(\"UPDATE sessiondaten SET daten=\n\
  \                         '\" . $data . \"', access='\" . timestamp() . \n     \
  \                    \"' WHERE id='$sessionid'\");\n    if ($GLOBALS[\"sessions_id\"\
  ]->changes() == 0) {\n      $GLOBALS[\"sessions_id\"]->\n        query(\"INSERT\
  \ INTO session data (id, data, access) \n          VALUES ('$sessionid', '\" . $data\
  \ . \"', '\" . timestamp() . \"')\");\n    }\n    return true;\n  }  \n```\n\n返回值\
  \ `TRUE` 表示写入操作成功（即在此不进行进一步检查）。\n\n那是工作的主要部分。只剩下清理工作了。删除会话时，必须销毁所有关联数据：\n\n```php\n\
  \  function _destroy($sessionid) {\n    $sessionid = $GLOBALS[\"sessions_id\"]->escapeString($sessionid);\n\
  \    $GLOBALS[\"sessions_id\"]->query(\"DELETE FROM sessiondaten WHERE id=\n   \
  \     '$sessionid'\");\n    return true;\n  }  \n```\n\n清理时还有一个特殊功能：长时间未访问的会话应该被删除。生存时间作为参数传递给处理函数。删除分三个步骤进行：\n\
  \n- 首先，确定一个位于会话生存时间之前的日期值。\n- 然后将该日期值转换为时间戳。\n- 最后，删除所有小于计算出的时间戳会话数据。\n\n这是对应的代码：\n\
  \n```php\n  function _gc($lifetime) {\n    $expiration = time() - $lifetime;\n \
  \   $expiration_timestamp = date(\"YmdHis\", $expiration);\n    $GLOBALS[\"sessions_id\"\
  ]->\n      query(\"DELETE FROM session data WHERE access < '$expiration_timestamp'\"\
  );\n    return true;\n  }\n?>  \n```\n\n搞定！现在你只需要用 `session_set_save_handler()`\
  \ 注册这六个函数，并确保在页面关闭时写入会话数据：\n\n```php\n  session_set_save_handler(\"_open\", \"_close\"\
  , \"_read\", \"_write\", \n    \"_destroy\", \"_gc\");\n  register_shutdown_function(\"\
  session_write_close\");  \n```\n\n以下列表显示了完整的代码。\n\n\n\n\n```php\n<?php\n  $GLOBALS[\"\
  sessions_db\"] = \"sessions.db\";\n\n  function createDB() {\n    $db = new SQLite3($GLOBALS[\"\
  sessions_db\"]);\n    $result = $db->\n      query(\"CREATE TABLE sessiondaten (id\
  \ VARCHAR(32) PRIMARY KEY,\n        data TEXT, access VARCHAR(14))\");\n    $db->close();\n\
  \  }\n\n  function timestamp() {\n    return date(\"YmdHis\");\n  }\n\n  function\
  \ _open($path, $name) {\n    if (!file_exists($GLOBALS[\"sessions_db\"])) {\n  \
  \    createDB();\n    }\n    $GLOBALS[\"sessions_id\"] = new SQLite3($GLOBALS[\"\
  sessions_db\"]);\n    return true;\n  }\n\n  function _close() {\n    $GLOBALS[\"\
  sessions_id\"]->close();\n    unset($GLOBALS[\"sessions_id\"]);\n    return true;\n\
  \  }\n\n  function _read($sessionid) {\n    if (!isset($GLOBALS[\"sessions_id\"\
  ])) {\n        _open(\"\", \"\");\n    }\n    $result = $GLOBALS[\"sessions_id\"\
  ]->\n         query(\"SELECT data FROM session data WHERE id='$sessionid'\");\n\
  \    $row = $result->fetchArray();\n    if ($row) {\n      $value = $row[\"data\"\
  ];\n      $sessionid = $GLOBALS[\"sessions_id\"]->escapeString($sessionid);\n  \
  \    $GLOBALS[\"sessions_id\"]->query(\"UPDATE session data SET access=\n      \
  \                  '\" . timestamp() . \"' WHERE id='$sessionid'\");\n    } else\
  \ {\n      $value = \"\";\n    }\n    return $value;\n  }\n\n  function _write($sessionid,\
  \ $data) {\n    if (!isset($GLOBALS[\"sessions_id\"])) {\n        _open(\"\", \"\
  \");\n    }\n    $data = $GLOBALS[\"sessions_id\"]->escapeString($data);\n    $sessionid\
  \ = $GLOBALS[\"sessions_id\"]->escapeString($sessionid);\n    $result = $GLOBALS[\"\
  sessions_id\"]->query(\"UPDATE sessiondaten SET daten=\n                       \
  \  '\" . $data . \"', access='\" . timestamp() . \n                         \"'\
  \ WHERE id='$sessionid'\");\n    if ($GLOBALS[\"sessions_id\"]->changes() == 0)\
  \ {\n          $GLOBALS[\"sessions_id\"]->\n           query(\"INSERT INTO session\
  \ data (id, data, access) VALUES \n            ('$sessionid', '\" . $data . \"',\
  \ '\" . timestamp() . \"')\");\n    }\n    return true;\n  }\n\n  function _destroy($sessionid)\
  \ {\n    $sessionid = $GLOBALS[\"sessions_id\"]->escapeString($sessionid);\n   \
  \ $GLOBALS[\"sessions_id\"]->query(\"DELETE FROM session data WHERE id=\n      \
  \                             '$sessionid'\");\n    return true;\n  }\n\n  function\
  \ _gc($lifetime) {\n    $expiration = time() - $lifetime;\n    $expiration_timestamp\
  \ = date(\"YmdHis\", $expiration);\n    $GLOBALS[\"sessions_id\"]->\n       query(\"\
  DELETE FROM session data WHERE access < \n         '$expiration_timestamp'\");\n\
  \    return true;\n  }\n\n  session_set_save_handler(\"_open\", \"_close\", \"_read\"\
  , \"_write\", \n    \"_destroy\", \"_gc\");\n  register_shutdown_function(\"session_write\"\
  );\n  session_start();\n?>\n```\n\n### 列表 15.7 自定义会话处理器 (`sessions.inc.php`)\n\n\
  #### 使用面向对象的会话处理器\n\n在面向对象编程方面，如果可以简单地将一个类传递给 `session_set_save_handler()`，并由该类实现各个功能，将会更好。这确实是可行的。PHP\
  \ 提供了 `SessionHandlerInterface` 接口（参见第 11 章）。实现此接口的类可以传递给 `session_set_save_handler()`。在这里你可以看到接口的定义：\n\
  \n```\nSessionHandlerInterface {\n  abstract public bool close(void);\n  abstract\
  \ public bool destroy($sessionid);\n  abstract public bool gc($lifetime);\n  abstract\
  \ public bool open($path, $name);\n  abstract public string read($sessionid);\n\
  \  abstract public bool write($sessionid, $data);\n}\n```\n\n请注意：PHP 有一个 `SessionHandler`\
  \ 类，它代表 PHP 的内部处理器，但不是它自己的！如果你不想使用内部实现而想使用自己的，你不应该使用 `extends SessionHandler`，而应该使用\
  \ `implements SessionHandlerInterface`！\n\n在此基础上，该示例可以快速且方便地适配 SQLite。为了做到这一点，本质上需要通过加载自写的\
  \ `sessions.inc.php` 库来替换对 `session_start()` 的调用。以下显示写入会话变量的代码：\n\n```php\n<?php\n\
  \  require_once \"sessions.inc.php\";\n?>\n```\n\n```html\n<html>\n<head>\n  <title>Sessions</title>\n\
  </head>\n<body>\n```\n\n```php\n<?php\n  $_SESSION[\"Programming language\"] = \"\
  PHP\";\n  $_SESSION[\"Language version\"] = 8;\n?>\n```\n\n```html\n<p>Session variables\
  \ have been set!</p>\n<p><a href=\"read-db.php\">继续 ... ...</a></p>\n</body>\n</html>\n\
  ```\n\n#### 列表 15.8 写入的会话数据 (`write-db.php`)\n\n读取部分也（几乎）没有变化：\n\n```php\n<?php\n\
  \  require_once \"sessions.inc.php\";\n?>\n```\n\n```html\n<html>\n<head>\n  <title>Sessions</title>\n\
  </head>\n<body>\n<p>Programming language:\n```\n\n```php\n<?php\n  if (isset($_SESSION[\"\
  Programming language\"])) {\n    echo htmlspecialchars($_SESSION[\"Programming language\"\
  ]));\n  }\n?>\n```\n\n```html\n<p>Language version:\n```\n\n```php\n<?php\n  if\
  \ (isset($_SESSION[\"Language version\"])) {\n    echo htmlspecialchars($_SESSION[\"\
  Language version\"]));\n  }\n?>\n```\n\n```html\n<p><a href=\"<?php echo($_SERVER['PHP_SELF']);\
  \ ?>\">刷新</a></p>\n</body>\n</html>\n```\n\n#### 列表 15.9 ... 并立即再次输出 (`read-db.php`)\n\
  \n## 15.6 安全考量\n\n尽管会话提供了所有优势，但其缺点也不应被完全忽视。\n\n### 15.6.1 没有 Cookie 就没有会话\n\n特别是对于无\
  \ Cookie 的会话（cookieless sessions），便利性与安全性之间的差异是巨大的。过去曾声称 Web 应用在没有无 Cookie 会话的情况下无法工作，但现在更有可能是在使用无\
  \ Cookie 会话时无法工作。\n\n其原因非常简单：所有信息的关键 `session ID` 在这种情况下位于 URL 的明文中。想象以下情况：一个网页邮件提供商使用无\
  \ Cookie 会话。你向该邮件服务的客户发送一封邮件，带有一个你网站的链接，更准确地说，一个 PHP 脚本的链接。当邮件接收者点击链接时，脚本会被调用。你对脚本执行的第一件事是查看\
  \ `$_SERVER[\"HTTP_REFERER\"]`。浏览器会在此 HTTP 头部字段中发送上一页的 URL。103 只需少量努力即可读取它并同时确定该客户在邮件提供处的当前会话\
  \ ID。这被称为会话劫持（session hijacking）（参见第 32 章）。\n\n当免费邮件服务刚刚流行时，一些知名提供商很容易受到这种攻击。因此，所有的邮件提供商现在都使用（临时的）Cookie\
  \ 来传输 `session ID`。\n\n针对会话劫持有多种应对措施，但没有一种是完全有效的。一种潜在的办法是将会话限制在一个 IP 地址。这可以通过几个步骤完成：\n\
  \n1.  在创建会话时，将访问者当前的 IP 地址保存在一个独立的会话变量中：\n\n    ```php\n    $_SESSION[\"ip\"] =\
  \ $_SERVER[\"REMOTE_ADDR\"];\n    ```\n\n2.  每次访问会话时，系统都会检查 IP 地址是否仍然正确。如果不，则删除会话：\n\
  \n```php\nif ($_SESSION[\"ip\"] != $_SERVER[\"REMOTE_ADDR\"]) {\n  session_unset();\n\
  \  session_destroy();\n  setcookie(session_name(), \"away with it\", 0, \"/\");\n\
  }\n```\n\n\n\n\n另一种方法是评估 `HTTP_REFERER` 环境变量并始终检查用户是从哪个页面过来的。如果会 ID 被“窃取”，引用者（referrer）值可能是不正确的。遗憾的是，这并不总是可靠的，因为现在引用者并不总是会被发送。尽管如此，如果你仍然想使用这种方法，PHP\
  \ 让它变得非常简单。`session.referer_check` 配置设置可以设置为一个字符串，该字符串必须始终出现在 `HTTP_REFERER` 中；否则会话将被删除。\n\
  \n### 15.6.3 更改 Session ID\n\n为了进一步减少会话劫持的影响，限制（可能被劫持的）会话 ID 的有效期会有帮助。`session_regenerate_id()`\
  \ 函数对此很有用。每当调用此函数时，PHP 都会生成一个“新的”会话 ID，但会将现有会话的所有数据复制到新版本。\n\n`session_regenerate_id()`\
  \ 函数有一个可选参数。如果将其设置为 `true`，旧的会话将被删除。换句话说，如果会话 ID 被攻击者窃取，在下次调用 `session_regenerate_id()`\
  \ 之后，该会话将成为历史。\n\n这一过程并非没有缺点。永久地创建新的会话 ID 会消耗服务器的一些性能。然而，这是 PHP 的一项安全特性，被某些其他 Web\
  \ 技术所向往。\n\n### 注意\n\n[`s-prs.co/v602282`](http://s-prs.co/v602282) 上的文章（PHP 在线手册中也链接了它）对会话的“敌对接管”问题提供了很好的概述。\n\
  \n### 15.6.4 让跨站请求伪造变得更加困难\n\nCSRF 场景下的一种典型攻击场景包括发送跨域请求，并依赖于目标域的所有 cookie 随后也会被发送这一事实。有了\
  \ SameSite cookie，所有当前浏览器都支持一种机制，该机制通过对来自另一个域的请求更严格地处理带有相应 SameSite 标记的 cookie，使其变得更加困难（参见第\
  \ 14 章）。对于会话 cookie，可以通过 `php.ini` 配置设置此标记：\n\n```\nsession.cookie_samesite = \"\
  Strict\"\n```\n\n其他可能的值是 \"None\" 和 \"Lax\"。\n\n### 15.6.5 防止 JavaScript 访问会话 Cookie\n\
  \n另一项安全特性可以防止跨站脚本（XSS）的影响：如果你将 `php.ini` 配置选项 `session.cookie_httponly` 设置为 `1`\
  \ 或 `On`，那么会话 cookie 将标记为 `httponly` 标记（参见第 14 章）。这至少让通过 JavaScript 进行会话劫持变得更加困难。\n\
  \n原则上，以下适用于：仅使用 cookie 中包含 session ID 的会话！在过去的 20 年里，作者们反复看到在没有 cookie 的情况下运行 Web\
  \ 开发项目：不支持 cookie 的手持设备上的模糊客户端、由于公司范围策略不允许接受 cookie 的浏览器所使用的内部 Web 应用，以及其他一些情况。这里的关键词是“极端”，因为没有理由在没有\
  \ cookie 的情况下使用会话。你自己试一下吧：一次禁用 cookie 看看你能走多远——特别是对于 Web 邮箱服务和在线商店来说。\n\n# 16 电子邮件\n\
  \n电子邮件是最早的技术之一。在 PHP 中使用它要么非常简单，要么相当复杂，取决于应用程序。我们在这里描述了各种可能性。\n\n从动态 Web 应用程序发送电子邮件是经典任务之一。来自联系表单的数据必须以某种方式发送——即发送给网站管理员。如果应用程序发生错误，自动生成的电子邮件将非常实用。当然，由\
  \ Web 服务器自动发送的新事列表也是一种很有用的东西。\n\n通常来说，在服务器端发送电子邮件并不困难。然而，俗话所说，魔鬼在细节之中。虽然“简单”的电子邮件仍然很容易发送，但对于复杂的电子邮件（例如带有附件和格式设置的邮件），你需要专业知识或外部库。\n\
  \n## 16.1 准备工作\n\nmail 模块集成在 PHP 中，因此不需要额外的安装或配置开关。然而，这正是 `php.ini` 发挥作用的地方。这里有一个重要的点需要记住：发送电子邮件需要一个\
  \ SMTP 服务器；没有它，就无法发送。正由于这非常重要且经常被问到，我们将在信息框中再次重复一遍。\n\n### 注意\n\n你离不开 SMTP 服务器。真的。（你并不总是需要通过网络访问它，但那是另一个话题。）SMTP\
  \ 的缩写代表 Simple Mail Transfer Protocol（简单邮件传输协议）。这个名字说明了一切。该协议的语法非常简单。你甚至可以使用 `telnet`\
  \ 来尝试——如果你可以访问 SMTP 服务器（参见图 16.1）。要做到这一点，你只需要将 SMTP 的标准端口——即 `25` 作为调用 `telnet`\
  \ 的第二个参数：\n\n```\ntelnet mailservername 25\n```\n\n![SMTP 通过 Telnet 工作](img/klein16001.pngimg-f16.html)\n\
  图 16.1 SMTP 通过 Telnet 工作\n\n图 16.2 显示了生成的电子邮件（我们使用的是下文进一步描述的 `smtp4dev`）。\n\n![生成的电子邮件](img/klein16002.pngimg-f16.html)\n\
  图 16.2 生成的电子邮件\n\n然而，这并不总是有效。更糟糕的是：许多邮件服务器配置为只接受已知邮件地址或 IP 地址，这是由于垃圾邮件问题。一个例子是 GMX\
  \ 的邮件服务器：如图 16.3 所示，它立即识别虚假域名并报警。只有 GMX 成员允许发送邮件。\n\n![GMX 邮件服务器具有良好的拦截机制](img/klein16003.pngimg-f16.html)\n\
  图 16.3 GMX 邮件服务器具有良好的拦截机制\n\n另一个警告：由于垃圾邮件问题，许多邮件服务器会检查邮件来自哪个 IP 地址。如果你在本地系统上运行 SMTP\
  \ 服务器，你的邮件可能仍然到达。这是因为大多数垃圾邮件发送者通过拨号接入并使用本地 SMTP 服务器发送广告邮件。出于测试目的，仍然建议使用本地邮件服务器；日志文件就能显示邮件发送是否可能工作。以下产品适用：\n\
  \n*   在 Unix/Linux 下，`sendmail`、`qmail` 或 `postfix` 程序；它们都实现了邮件服务器。\n*   微软 IIS\
  \ 的版本包含 Microsoft SMTP 服务，这是一个功能 SMTP 服务。例如，在 Windows Server 上，你可以作为功能安装它（参见图 16.4）。\n\
  \n![Windows Server 包含 SMTP 服务](img/klein16004.pngimg-f16.html)\n图 16.4 Windows Server\
  \ 包含 SMTP 服务\n\n### 注意\n\n当然，这并不意味着你从桌面电脑发送的所有邮件都无法到达收件者。起作用的是发送服务器的 IP 地址。如果你使用提供商的邮件服务器，其\
  \ IP 地址是决定性的（而且通常不令人怀疑）。\n\n### 提示\n\n我们推荐来自 [`github.com/rnwood/smtp4dev`](https://github.com/rnwood/smtp4dev)\
  \ 的 `smtp4dev` 工具。这是一个免费、开源且跨平台的开发用 SMTP 服务器。使用它，邮件不会被实际发送，但你可以在本地拦截并查看它们。它非常适合开发！图\
  \ 16.5 显示了该工具的用户界面。\n\n\n\n\n\n![smtp4dev as a Console Application Including a Web\
  \ Interface](img/img-f16.5.html)\n\n**图 16.5** 作为包含 Web 界面的控制台程序的 smtp4dev\n\n对于\
  \ Unix/Linux，PHP 在任何情况下都期望 `sendmail`。对于 `qmail` 或 `postfix` 的用户来说，这初并不是问题，因为两者都提供了特殊的封装器，让应用程序认为它正在与\
  \ `sendmail` 服务器通信。如果你正在使用不同的服务器，请确保有一个行为类似于 `sendmail` 的二进制执行文件。\n\n现在是配置 `php.ini`\
  \ 的时候了。在 `[mail function]` 章节共有八个条目，尽管并不是每个条目对于每个操作系统都是需要的（最重要的是前四个）：\n\n*   `SMTP`\n\
  \    所使用的 SMTP 服务器名称（例如，本地服务器使用 `localhost`）。仅在 Windows 环境下必要！\n*   `smtp_port`\n\
  \    SMTP 服务器的端口（如果不是默认端口 25）；仅在 Windows 环境下必要！\n*   `sendmail_from`\n    发送邮件的发送者。仅在\
  \ Windows 环境下必要！\n*   `sendmail_path`\n    `sendmail` 的路径，包含参数（例如 `sendmail -t`）。仅在\
  \ Unix/Linux 环境下必要！\n*   `mail.force_extra_parameters`\n    必须始终发送到邮件程序的额外参数。\n\
  *   `mail.add_x_header`\n    指定是否应通过头部将 PHP 脚本的名称和 UID 添加到邮件。\n*   `mail.mixed_lf_and_crlf`\n\
  \    混合行结束符（仅某些特殊的邮件服务器必要）。\n*   `mail.log`\n    所有对 `mail()` 用的日志。\n\n### 提示\n\
  额外的邮件参数也可以通过程序进行设置。`php.ini` 中的配置设置主要供那些希望防止用户直接将参数传递给邮件发送器的主机感兴趣。\n\n随 PHP 提供的标准\
  \ `php.ini` 版本在 Unix/Linux 和 Windows 上是不同的；对于各自系统不相关的配置参数会被注释掉。在这里你可以看到 Unix/Linux\
  \ 安装的可能值：\n\n```\nsendmail_path = \"/var/qmail/bin/qmail-inject\"\n```\n\n而这里是一个可能的\
  \ Windows 配置：\n\n```\nSMTP = localhost \nsmtp_port = 25 \nsendmail_from = \"webapp@xy.zzz\"\
  \ \n```\n\n#### 注意事项\n为了清晰起见，我们在本章中省略了大部分错误修正。然而，特别是在发送邮件时，你应该始终检查邮件是否发送成功——至少是到达邮件服务器。当然，你无法确定接收者是否收到了邮件，因为你的邮件服务器会将邮件转发到接收者的邮件服务器，而该服务器不在你的控制范围内。\n\
  \n## 16.2 使用 PHP 发送邮件\n\n预判一点的是，原则上使用 PHP 发送邮件是一件非常简单的事情，因为只有一个函数负责此工作：\n\n```\n\
  bool mail ( string to, string subject, string message [, string additional_ \n \
  \ headers [, string additional_params]])  \n```\n\n这五个参数中，只有前三个是强制性的，代表以下信息：\n\n\
  *   接收者\n*   主题\n*   邮件内容\n*   额外的邮件头部（例如 \"X-Sender: PHP\"）\n*   邮件程序的额外参数（仅限 Unix/Linux；例如使用\
  \ `-f` 设置发送者地址，有时出于安全原因会被禁止）\n\n### 提示\n在此处使用命名函数参数是一个逻辑上的选择。\n\n### 16.2.1 标准邮件\n\
  \n让我们从下一个代码列表中的一个更简单的练习开始——即直接发送邮件（参见图 16.6）。这在字面意义上是一个单行代码（除了为了视觉考虑的换行外）。\n\n```php\n\
  <?php\n  mail(to: \"recipient@xy.zzz\", \n       subject: \"Mail from PHP\", \n\
  \       message: \"This mail was sent automatically!\" . \n                \"\\\
  n\\nThank you.\");\n?>  \n```\n\n**代码列表 16.1** 第一封简单邮件 (\"mail1.php\")\n\n#### 注意事项\n\
  在本章的示例中，我们大多使用了无效的邮箱地址；当然 `xy.zzz` 域名不存在。因此，你必须根据你的系统调整列表并使用有效地址。通过这种方式，我们避免了过去不愉快的经历，当时许多读者只想测试程序而不注意描述文本。其结果是我们收到了大量的测试邮件。有趣的是，这本书的德语版的某些读者阅读了上面的注释——然后直接使用了作者的联系地址作为接收者地址。\n\
  \n![第一封测试邮件](img/img-f16.6.html)\n\n**图 16.6** 第一封测试邮件\n\n### 提示\n如果你不仅想指定接收者的邮箱地址，还想指定对应的名称，请使用以下格式：\n\
  \n```\n\"One name\" <one.name@xy.zzz> \n```\n\n`mail()` 的第四个参数 (`additional_headers`）提供了极大的灵活性：可以在那里整合额外的邮件头部。例如，一种可能性是设置\
  \ `X-Mailer` 头部项，它负责发送程序的名称。\n\n```php\n<?php\n  mail(to: \"recipient@xy.zzz\",\
  \ \n       subject: \"Mail from PHP\", \n       message: \"This mail was sent automatically!\"\
  \ . \n                \"\\n\\nThank you.\", \n       additional_headers: \"X-Mailer:\
  \ \" . phpversion());\n?>  \n```\n\n**代码列表 16.2** 带有额外头部的邮件 (\"mail2.php\")\n\n\
  根据邮件程序的不同，你可能需要调用不同的命令来查看头部；图 16.7 显示了一个示例。然而，其他邮件头部特别有用：\n\n*   `Cc`\n    抄送接收者\n\
  *   `Bcc`\n    密抄接收者\n*   `X-Priority`\n    邮件的重要性\n*   `Reply-To`\n    回复地址\n\n\
  ![邮件头部中显示的 PHP 版本](img/img-f16.7.html)\n\n**图 16.7** 邮件头部中显示的 PHP 版本\n\n### 提示\n\
  对于感兴趣的人，邮件所依据的网络标准是 `RFC 822`，可以在 `http://s-prs.co/v62283](http://s-prs.co/v60283)\
  \ 查看。`RFC 2822` ([www.ietf.org/rfc/2822.txt](http://www.ietf.org/rfc/2822.txt))\
  \ 扩展了 `RFC 822`。\n\n所有这些头部可以通过 `mail()` 第四个参数中的换行符 (`\\r\\n`) 隔开。因此，下面的代码创建了一封邮件：\n\
  \n*   有两个抄送接收者\n*   有一个密抄接收者\n*   重要性评级为低\n*   并且给了一个不同的回复地址。\n\n```php\n<?php\n\
  \  mail(to: \"recipient@xy.zzz\", \n       subject: \"Mail from PHP\", \n      \
  \ message: \"This mail was sent automatically!\" . \n                \"\\n\\nThank\
  \ you.\", \n       additional_headers: \n         \"Cc: 1stcopy@xy.zzz,2ndcopy@xy.zzz\\\
  r\\nBcc:blindcopy@xy.zzz\\r\\n\" . \n         \"X-Priority: low\\r\\nReply-To:reply@xy.zzz\\\
  r\\n\" . \n         \"X-Mailer: PHP/\" . phpversion());\n?>  \n```\n\n**代码列表 16.3**\
  \ 带有多个接收者和其他选项的邮件 (\"mail3.php\")\n\n#### 关于分号和逗号\n`RFC 822` 规定多个邮件接收者之间用逗号隔开。微软电子邮件客户端在此采取了不同的方法：逗号用于分隔接收者的姓和名，然后在各个个体接收者之间使用分号。然而，这是微软的专有程序。微软邮件服务器足够聪明，可以将这些分号转换回逗号。即使你习惯在\
  \ Outlook 中在个体接收者之间使用分号，你也必须在 PHP（以及其他所有地方）中使用逗号。\n\n\n\n\n请注意，对于邮件而言，高优先级并不意味着邮件处理速度会更快。此设置的唯一效果是邮件在收件者的邮件程序中会被特别标记——仅此不加。遗憾的是，将邮件标记为“重要”的坏习惯有时会渗入，即使它们并不那么重要。换句话说，高重要性往往会产生相反的效果。\n\
  \n![具有多功能的封邮件](img/img-f16.8.html) \n\n**图 16.8** 多功能的封邮件\n\n此外，邮件优先级在 `RFC 822`\
  \ 中并没有标准化。这可以通过 `X-Priority` 的 `X-` 前缀来识别。因此，是否以及如何解释此邮件头，完全取决于邮件程序的决定。以下 `X-Priority`\
  \ 的值似乎已经得到普遍接受：\n\n* 低 (Low)\n* 普通 (Normal)\n* 高 (High)\n\n其他条目（如极高或极低）仅由特定的邮件客户端支持。\n\
  \n### 提示\n你还可以在 Windows 下使用 `From:sender@xy.zzz` 头部来覆盖 Windows 中的 `php.ini sendmail_from`\
  \ 设置。在 Unix/Linux 中，这是设置邮件发件者的方便方法。\n\n### 16.2.2 MIME 邮件\n\n到目前为止一切良好——而且简单。对于从\
  \ Web 应用程序发送的邮件（例如来自联系表单），目前编写的内容通常足够了。然而，营销人员特别希望邮件是斑斓的。事实上，可以使用 HTML 格式和文件附件来增强邮件。\n\
  \n但有一点必须立即明确：创建此类邮件相对耗时。通过使用外部库可以节省大部分工作。尽管如此，我们将演示基础知识，因为这将让你了解动态生成的邮件哪些是可以实现的，哪些不能实现。\n\
  \n### 注意\n在 [www.mhonarc.org/~ehood/MIME/](http://www.mhonarc.org/~ehood/MIME/)\
  \ 对各种 MIME 标准有很好的概述，这些标准现在归类为 `RFC 2045` 到 `2049`。`MIME` 代表多用途互联网邮件扩展（Multipurpose\
  \ Internet Mail Extensions），描述了邮件结构以及特殊格式和文件附件。\n\n编写 MIME 邮件需要两项预防措施：\n\n* 设置特殊头部\n\
  * 邮件文本的特殊构造\n\n让我们从头部开始。`Content-Type` 条目决定内容的类型。在这里可以选择多种 MIME 类型：\n\n* `multipart/mixed`\n\
  \  同一封邮件中的不同数据类型，例如邮件正文和文件附件\n* `multipart/alternative`\n  可以交替显示的邮件内容（例如文本和 HTML）\n\
  \n各个邮件部分之间通过分隔符字符串隔开。该字符字符串可以是任意的，但你必须确保它不会在消息文中随机出现。出于这种原因，通常使用较大的随机字符串。为了清晰起见，我们在后续始终使用相同的分隔符：`separator-0815`。在邮件内部，分隔符通过其所在的行以两个连字符开头来识别。创建合适分隔符的简单方法是例如使用随机数或其\
  \ `MD5` 哈希值：\n\n```\n$separator = \"--separator-\" . margin(1000000000, 9999999999);\
  \  \n```\n\n以下是一封由两部分组成——纯文本和 HTML 内容的邮件内容：\n\n```\nFrom: sender@xy.zzz \nTo: recipient@xy.zzz\
  \ \nSubject: MIME message \nMIME version: 1.0 \nContent-type: multipart/mixed; boundary=\"\
  separator-0815\" \nPreamble, which is not visible, except for very old clients \n\
  --separator-0815\nContent-type: text/plain; charset=\"iso-8859-1\"\n\nPure text\
  \ \n--separator-0815 \nContent-type: text/html\n\nHTML text with a <a href=\"http://www.php.net/\"\
  >link</a> \n--separator-0815-- \nAppendix, which is also not visible  \n```\n\n\n\
  \n**列表 16.5** 带有文件附件的邮件 (`mime2.php`)\n\n为了方便起见，首先在 `$mailtext` 变量中放置一个文件的占位符。然后使用\
  \ `str_replace()` 将该占位符替换为 Base64 编码的文件内容。\n\n![图片已附加到邮件](img/img-f16.10.html) \n\
  \n**图 16.10** 图片已附加到邮件\n\n如图 16.10 所示，邮件程序仅附加了图片，而没有直接显示它（Thunderbird 会渲染它，但在实际邮件正文之后）。然而，在某些情况下，实际上需要集成图片。其中一个例子就是\
  \ HTML 邮件。图片通常被集成在那里（特别是在广告邮件中，但那是另一个话题）。实现这一目标有两种方法：\n\n*   使用绝对的外部 URL：\n\n```html\n\
  <img src=\"http://server/name.gif\" />  \n```\n\n*   集成到邮件中：\n\n```html\n<img src=\"\
  cid:ID_of_the_graphic\" />  \n```\n\n`cid:ID_of_the_graphic` 格式是标准化的。`cid:` 是固定的；你只需要定义图片的\
  \ `CID`（内容标识符）。这也可以通过邮件头来实现。这是一个示例：\n\n```\nFrom: sender@xy.zzz \nTo: recipient@xy.zzz\
  \ \nSubject: MIME message\nMIME-Version: 1.0\nContent-type: multipart/alternative;\
  \ boundary=\"separator-0815\"\n\n除了非常旧的客户端外，这段前言可见\n--separator-0815\nContent-Type:\
  \ text/html\n\n<a href=\"http://www.php.net/\"><img src=\"cid:PHPLogo\" alt=\"PHP\
  \ logo\" /></a>\n\n    是非常棒的（见附件）！\n--separator-0815\nContent-Type: image/gif; name=\"\
  php.gif\"; \nContent-Transfer-Encoding: base64\nContent-ID: PHPLogo\nContent-Disposition:\
  \ attachment\n\nMIME64encoded==\n--separator-0815--\n同样不可见的说明信息\n```\n\n相应调整代码并不费力。\n\
  \n```php\n<?php\n  $filecontent = base64_encode(file_get_contents(\"php.gif\"));\n\
  \  $mailtext = 'Preamble, which is not visible, except for very old clients\n--separator-0815\n\
  Content-Type: text/html\n\n<a href=\"http://www.php.net/\"><img src=\"cid:PHPLogo\"\
  \ alt=\"PHP logo\" /></a> \n    是非常棒的！\n--separator-0815\nContent-Type: image/gif;\
  \ name=\"php.gif\"; \nContent-Transfer-Encoding: Base64\nContent-Disposition: inline\n\
  Content-ID: PHPLogo\n\n%%FILECONTENT%%\n--separator-0815--\n';\n  $mailtext = str_replace(\"\
  %%FILECONTENT%%\", $filecontent, $mailtext);\n  mail(to: \"recipient@xy.zzz\", \n\
  \       subject: \"MIME mail with attachment\", \n       message: $mailtext, \n\
  \       additional_headers: \"MIME-Version: 1.0\\nContent-type: multipart/alternative;\
  \ boundary=\\\"separator-0815\\\"\");\n?>  \n```\n\n**列表 16.6** 直接引用附加的图片 (`mime3.php`)\n\
  \n这应该是结束对 MIME 和 PHP “隐藏秘诀”的探索了。你已经看到如何或或容易地创建不仅包含纯文本，还包含图片和文件附件的邮件。但请注意，HTML 邮件占用的存储空间大得多。此外，益于\
  \ HTML 邮件（或某些邮件客户端的错误实现），许多疯狂的邮件病毒能够很容易传播。结果是用户通常完全不打开 HTML 邮件，或者只读取备用文本版本的邮件。遗憾的是，许多发送者忘记包含备用文本。因此，如果你必须使用\
  \ HTML 邮件，请使用 `multipart/alternative` 并同时创建一个邮件的文本版本。\n\n### 注意\n\n为了不让图 16.11 中的\
  \ `multipart/alternative` 被自动包含，你必须使用 `multipart/alternative` 并同时创建一个邮件的文本版本。\n\n\
  \n\n\n在本书的第四部分中（从本章开始），你将找到关于所有主要数据库以及如何使用 PHP 控制它们的信息。为此，我们将演示标准任务，介绍各个数据库的特殊功能，并且——为了确保良好的可比性——在每章的末尾提供一个一致的示例。在每一章都重新回顾\
  \ `SQL` 的基础知识会有些冗味。因此，我们选择了一种不同的方法：在本章中，你将学习关于 `SQL` 的所有核心内容。我们并不声称其完整性，但在读完本章后，你将拥有理解本章中其他数据库示例以及更多内容的工具。对于各个数据库的非常具体的细节，请参阅专业文献或相应产品的文档。本书主要关于\
  \ PHP。\n\n你通常会将本章中的代码输入到你使用的数据库所提供的管理工具中；或者，你也可以通过 `PHP` 直接将 `SQL` 命令发送到数据库。你可以在特定的数据库章节中了解如何操作。\n\
  \n## 17.1 创建数据库和表\n\n开发者经常谈论“一个数据库”，指的是例如 `MySQL` 或 `MSSQL` 的安装。然而，在关系型数据库模型中，术语略有不同。一个数据库服务器——或一个数据库安装——可以包含多个数据库。这些数据库包含表。你可以将表想象成类似于\
  \ `Microsoft Excel` 等电子表格：有列和行，每一行都是数据库中的一个条目。想象一个像表 17.1 那样的留言簿。可能的列可以是填写条目的人员、电子邮件地址、输入的文本以及条目的日期。这将是一个有四列的表。最好不要使用任何特殊字符作为列名；我们还实现了只使用小写字母的约定。\n\
  \n| 列名 | 描述 |\n| --- | --- |\n| `name` | 注册者的姓名 |\n| `email` | 注册者的电子邮件地址 |\n| `date`\
  \ | 条目日期 |\n| `entry` | 条目文本 |\n\n**表 17.1** 表格条目的内容\n\n### 17.1.1 主键\n\n出于性能考虑（以及其他原因，特别是当链接多个表时），为表使用主键是常见做法。主键是一个在表内值唯一的列。在留言簿的情况下，这看起来是什么样的？`name`\
  \ 和 `email` 地址不是唯一的，因为任何人都可以发布多个条目。`date` 也不是唯一的；至少在理论上，可能有两个条目同时到达数据库。甚至是条目的文本也不是唯一的。那么，是否应该将所有条目的组合提升为主键呢？那可能太复杂了，而且在某些极少数出现的情况下仍然不是唯一的。这就是为什么引入一个包含条目连续编号的新列已成为一种常见做法；这确保了唯一性。表\
  \ 17.2 是更新后的形式。\n\n| 列名 | 描述 |\n| --- | --- |\n| `id` | 条目编号，主键 |\n| `name` | 注册者的姓名\
  \ |\n| `email` | 注册者的电子邮件地址 |\n| `date` | 条目日期 |\n| `entry` | 条目文本 |\n\n**表 17.2**\
  \ 表“entry”的更新后的内容\n\n大多数数据库都为此类这种人工生成的主键提供单独的数据类型，即所谓的自增值（autovalue）。每当你向表中插入一条新数据记录时，自增值就会加\
  \ 1。这确保了表中的每个新条目都有一个大一的新编号。因此，你不需要在这方面担心任何事情；数据库会处理一切。\n\n### 17.1.2 数据类型\n\n每一列都需要一个定义的数据类型。尽管也有（少数）数据库在内部仅与字符串工作（`SQLite`\
  \ 就是其中之一），但在数据库内部进行类型划分通常可以大大提高性能。`SQL` 标准定义了一系列数据类型，其中表 17.3 展示了最重要类型相关类型。\n\n\
  | 数据类型 | 描述 |\n| --- | --- |\n| `BLOB` | 二进制大对象；（大型）二进制数据 |\n| `BOOLEAN` | 布尔值 |\n\
  | `CHAR(length)` | 固定长度的字符串 |\n| `DATE` | 日期值 |\n| `DECIMAL` | 小数值值 |\n| `INT` |\
  \ 整数 |\n| `TIMESTAMP` | 时间戳 |\n| `VARCHAR(length)` | 变长度字符串（括号内为最大长度） |\n\n**表 17.3**\
  \ `SQL` 数据类型选集\n\n每个数据库制造商可能会在此处提供一种变体——例如通过添加其他数据类型。这与 Web 服务的互操作性一样：从易于移植性的角度考虑，只使用标准数据类型是最好的。\n\
  \n#### 关于日期值的说明\n\n在理论上，数据库中的日期值是非常实用的。它们以高性能存储，并且查询结果可以方便地根据日期值进行排序。例如，在留言簿中，可以根据这些时间戳排序。但在涉及迁移时，日期值会让开发工作变得困难。因此，作者们倾向于不使用日期值，而是用小技巧来代替。接收日期的字段被创建为\
  \ `CHAR(14)`，并接收如 `20251231123456` 的时间戳。这对应于 2025 年除夕 12:34:56。这种特殊表示法的优势在于：由于“最大”值在前面，年份在前，然后是月份、日期，以此类推，很容易排序。`PHP`\
  \ 创建这种时间戳非常简单：\n\n```\ndate(\"YmdHis\")\n```\n\n或者，你也可以保存 ISO 格式的日期，你可以通过 `date(\"\
  c\")` 轻松获取：`2025-12-31T12:34:56+00:00`。\n\n使用 `CREATE DATABASE` `SQL` 命令（大写常见但并非强制）你可以创建一个数据库，并使用\
  \ `CREATE TABLE` 创建表。在后者的情况下，你指定所有的列名和数据类型。根据数据库的不同，自增值有不同的名称或数据类型——例如：\n\n```sql\n\
  CREATE TABLE entry( \n  id IDENTITY(1) PRIMARY KEY, \n  name VARCHAR(100), \n  email\
  \ VARCHAR(100), \n  date DATE, \n  entry VARCHAR(1000) \n)\n```\n\n### 注意\n\n通常所有的数据库命令以分号结束。然而，这通常只在你将多个语句打包在一起时才相关。对于你通过\
  \ `PHP` 发送到数据库的单个语句，分号是不必要的。\n\n\n\n\n向数据库插入数据的 SQL 命令是 `INSERT INTO <table name>`。接着，你输入你想要插入内容的列列表、关键字\
  \ `VALUES`，然后是具体的值。字符串值用单引号括起来（尽管对于日期值有不同的格式）！\n\n```\nINSERT INTO entry (name,\
  \ email, date, entry) VALUES \n('Christian', \n 'christian@xy.zzz', \n '2025-01-01',\n\
  \ 'Welcome to the guestbook! The guestbook is open. ')\nINSERT INTO entry (name,\
  \ email, date, entry) VALUES \n('Tobias', \n 'tobias@xy.zzz', \n '2025-01-02', \n\
  \ 'This isn’t exactly the place to be ... ')\nINSERT INTO entry (name, email, date,\
  \ entry) VALUES \n('Christian', \n 'christian@xy.zzz', \n '2025-01-03', \n 'There\
  \ is some truth in that. ')  \n```\n\n### 提示\n\n还有一种简写形式：\n\n```\nINSERT INTO <table\
  \ name> VALUES (<value1>, <value2>, <value3>) \n```\n\n在这里你只需要输入值，而不需要列名。为了做到这一点，你自然需要按照顺序输入值——即按照列定义的顺序。然而，在这个例子中，这并不可行，因为你不需要手动填充\
  \ `id` 列，而是将其留给数据库的自动填充机制。或者，你可以传递一个空字符串。\n\n## 17.3 查询数据\n\n最简单的查询形式如下：\n\n```\n\
  SELECT * FROM entry  \n```\n\n该查询从表（`FROM`）中选择（`SELECT`）所有内容（`*`）并返回它们（请参见 表 17.4）。\n\
