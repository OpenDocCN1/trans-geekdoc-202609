  \n### 23.3.5 编辑数据\n\n最后，必须创建一个带有编辑选项的表单。在这里，需要注意两个地方的 Unicode 字符。从数据库读取数据进行显示时，你必须使用\
  \ `utf8_decode()`，而在写回数据库时，必须使用 `utf8_encode()`。代码的其他部分与其他数据库模块完全相似，这就是为什么这个示例可以快速实现。\n\
  \n```html\n<html>\n<head>\n  <title>Guestbook</title>\n</head>\n<body>\n<h1>Guestbook</h1>\n\
  ```\n\n```php\n<?php\n  $Name = \"\";\n  $Email = \"\";\n  $Heading = \"\";\n  $Comment\
  \ = \"\";\n  if (isset($_GET[\"id\"]) &&\n       is_numeric($_GET[\"id\"])) {\n\
  \    if ($db = pg_connect(\"host=localhost port=5432 dbname=PHP user=postgres \n\
  \                                                   password=pwd.\")) {\n      if\
  \ (isset($_POST[\"Name\"]) &&\n          isset($_POST[\"Email\"]) &&\n         \
  \ isset($_POST[\"Heading\"]) &&\n          isset($_POST[\"Comment\"])) {\n     \
  \   $sql = vsprintf(\n          \"UPDATE guestbook SET\n          heading = '%s',\n\
  \          entry = '%s',\n          author = '%s',\n          email = '%s'\n   \
