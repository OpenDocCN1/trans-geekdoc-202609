  \n这些数字是二进制表示的。考虑以下例子：\n*   `1111` 代表 $8 + 4 + 2 + 1$，即 15。\n*   `1010` 代表 $8 + 0\
  \ + 2 + 0$，即 10。\n\n**注意**\n在 PHP 中，你也可以以二进制表示输入数字。为了这样做，数字前面带有 `0b`——例如，`0b1111`\
