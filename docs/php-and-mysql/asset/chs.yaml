  \n### 提示\n\n`spl_autoload_register()` 的一个旧的替代方案是 `__autoload()`。它不能像 `spl_autoload_register()`\
  \ 那样多次使用，且灵活性较低。它在 PHP 8 中被移除。\n\n### 11.4.3 `__METHOD__`\n\n`__METHOD__` 是一个由 PHP\
  \ 预定义的常量。它输出调用它的当前方法。在输出中，方法名之前用两个冒号与类分开（参见 图 11.37）。`__METHOD__` 也称为魔术常量，因为它的值自然地取决于上下文。与真正的常量不同，`__METHOD__`\
  \ 会根据它所在的方法提供不同的值。\n\n```php\n<?php\n  class Computer {\n    public function start()\
  \ {\n      echo \"This is the method \" .__METHOD__;\n    }\n  }\n  $MyComputer\
  \ = new Computer();\n  $MyComputer->start();\n?>  \n```\n\n**列表 11.48** 读取当前方法 (`method.php`)\n\
  \n![显示类名和方法名](img/img-f11.37.html) \n\n**图 11.37** 显示类名和方法名\n\n### 注意\n\n如果 `__METHOD__`\
  \ 在函数内而非方法内，则只显示函数（参见 图 11.38）。然而，为了此目的，还有 `__FUNCTION__`。\n\n![函数中的 `__METHOD__`](img/img-f11.38.html)\
  \ \n\n**图 11.38** 函数中的 `__METHOD__`\n\n### 贴士\n\nPHP 提供了其他魔术常量。`__FILE__` 返回当前脚本文件的名称和位置，`__LINE__`\
  \ 返回文件中的相应行号。\n\n### 11.4.4 `__toString()`\n\n当对象被显式转换为字符串时使用 `__toString()` 方法。这种显式转换发生在对象名称名前加上\
  \ `(string)`：\n\n```php\n(string) $Object;  \n```\n\n顺便提一下，此转换的返回值是之前的数据类型（即对象）以及对象的签名或数量。\n\
  \n转换之后，访问对象只会返回 `__toString()` 方法。考虑以下简单的简单示例；你可以在 图 11.39 中看到输出。\n\n```php\n<?php\n\
  \  class Computer {\n    public function __toString() {\n      return \"The output\
  \ for the method as a string\";\n    }  \n  } \n  $MyComputer = new Computer();\n\
  \  echo(string) $MyComputer .\"<br />\";\n  echo $MyComputer;\n?>  \n```\n\n**列表\
  \ 11.49** `__toString()` (`toString.php`)\n\n![顶部可以看到对象签名，底部是转换为字符串对象的返回](img/img-f11.39.html)\
  \ \n\n**图 11.39** 顶部可以看到对象签名，底部是转换为字符串对象的返回\n\n### 11.4.5 类类型与 \"instanceof\"\n\n\
  一个有趣且实用的问题是对象属于哪个类（或接口）。在 PHP 中，有两种方法可以确保这一点。一种是在参数前写上类名。在下面的示例中，只允许某些类 图 11.40）。\n\
  \n```php\n<?php\n  class Computer {\n    $CPU = \"The CPU\";\n  }\n  class Car {\n\
  \    $Wheels = 4;\n  }\n  function change($Object) {\n    $Object->CPU = \"4 GHZ\"\
  ;\n  }\n  $MyCar = new Computer();\n  change($MyCar);\n?>  \n```\n\n**列表 11.50**\
  \ 类类型 (`types.php`)\n\n![\"Computer\" 实例](img/img-f11.40.html) \n\n**图 11.40** \"\
  Computer\" 实例\n\n`instanceof` 运算符用于确定对象是否是某个类的实例。在 PHP 中，反过来它是弱类型的；这并不理想。语法如下：\n\
  \n```php\nObject instanceof\n```\n\n此构造的返回值是一个布尔值。通过 `instanceof` 运算符，你可以快速检查对象是否来自该类。图\
  \ 11.41 显示了输出。\n\n```php\n<?php\n  class Computer {\n    $CPU = \"The CPU\";\n \
  \   public function start() {\n      echo \"Computer is started.\";\n    }\n  }\n\
  \  class Car {\n    $Wheels = 4;\n  }\n  function change($Object) {\n    if ($Object\
  \ instanceof Computer) {\n      $Object->CPU = \"4 GHZ\";\n    } else {\n      echo\
  \ \"Hoppsa, wrong class!\";\n    }\n  }\n  $MyCar = new Car();\n  change($MyCar);\n\
  ?>  \n```\n\n**列表 11.51** 检查实例 (`instanceof.php`)\n\n### 注意\n\n如果实例传递给函数和方法，在 PHP\
  \ 中是以引用方式完成的。因此，它们仍然是同一个实例。因此，相等性检查返回真。另一方面，克隆的对象实例不再与原始对象相同，但内容相同。\n\n### 11.4.6\
  \ 比较对象\n\n对象在 PHP 中也可以相互比较。使用普通相等（`==`）比较，如果对象属于相同的类且具有相同的属性值，则返回真。精确相等比较（`===`）只有在它们确实是同一个对象时才返回真。因此，一个类的两个实例永远不会是完全相同的。\n\
  \n```php\n<?php\n  class Computer {\n  $CPU = \"The CPU\";\n    public function\
  \ start() {\n      echo \"Computer is started.\";\n    }\n  }\n  $MyComputer = new\
  \ Computer();\n  $MyLaptop = new Computer();\n  echo $MyComputer == $MyLaptop;\n\
  \  echo '<br />';\n  echo $MyComputer === $MyLaptop;\n  echo '<br />';\n  $MyLaptop->CPU\
  \ = \"2.5 GHZ Mobile\";\n  echo $MyComputer == $MyLaptop;\n?>  \n```\n\n**列表 11.52**\
  \ 相互比较对象 (`objects_compare.php`)\n\n\n\n\n\n### 11.4.7 对象的序列化\n\n特别是在 Web 端，有时需要发送信息或将其存储在\
  \ cookie 中，例如。在大多数情况下，信息应该以字符串的形式可用。对象也可以转换为字符串。这个过程被称为序列化。PHP 提供了两个用于序列化的函数：`serialize(object)`\
  \ 和用于将序列化还原的 `unserialize(string)`。\n\n以下脚本说明了这两者：首先对对象进行序列化，然后输出序列化后的二进制代码，最后将对象转换回另一个变量（参见图\
  \ 11.42）。你现在可以使用属性来访问对象的方法。当然，要小心：这只有在类存在的情况下才可行！\n\n```php\n<?php\n  class Computer\
  \ {\n  public $CPU = \"The CPU\";\n    public function start() {\n      echo \"\
  Computer is started.\";\n    }\n  }\n  $MyComputer = new Computer();\n  $serial\
  \ = serialize($MyComputer); \n  echo $serial .\"<br />\";\n  $MyComputer2 = unserialize($serial);\
  \ \n  $MyComputer2->start(); \n?>  \n```\n\n**列表 11.53** 序列化一个对象 (\"objects_serialize.php\"\
