  \"mailto:%s\\\">%s</a> wrote on/at %s:</p>\n          <h3>%s</h3><p>%s</p><hr noshade=\\\
  \"noshade\\\" />\", \n          urlencode($row->id),\n          urlencode($row->id),\n\
