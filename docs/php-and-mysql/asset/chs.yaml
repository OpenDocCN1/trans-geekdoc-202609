  Heading\"])),\n            pg_escape_string(utf8_encode($_POST[\"Comment\"])), \n\
  \            pg_escape_string(utf8_encode($_POST[\"Name\"])), \n            pg_escape_string(utf8_encode($_POST[\"\
  Email\"])), \n            pg_escape_string($_GET[\"id\"]) \n          ]\n      \
  \  );\n        if (pg_query($db, $sql)) {\n          echo \"<p>Entry changed.</p>\n\
