  \ 处找到。\n\n![“phpinfo()” 输出中的 \"xdebug\" 条](img/img-f35.5.html) \n\n**图 35.5**  \
  \   “phpinfo()”输出中的 \"xdebug\" 条\n\n![Xdebug 发送 Cookie ...](img/img-f35.6.html)\
