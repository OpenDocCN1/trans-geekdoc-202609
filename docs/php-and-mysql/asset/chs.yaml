  \n    **图 2.22** 配置运行通过——这是一个好兆头！\n\n5.  然后编译 PHP（参见 图 2.24）：\n\n    ```\n    make\
  \  \n    make install\n    ```\n\n    ##### 注意\n\n    你可以使用 `./configure --help`\
