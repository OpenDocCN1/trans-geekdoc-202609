  Email\"]) || \n    trim($_POST[\"Email\"]) == \"\" || \n    !preg_match( \n    \
  \  '/^[_a-zA-Z0-9_\\-.]+@[a-zA-Z0-9\\-.]+\\.[a-zA-Z]{2,6}$/', \n      $_POST[\"\
  Email\"])) { \n  $ok = false; \n} \n```\n\n这个正则表达式看起来很复杂，但它仅仅表达的意思是：一系列允许的字符、一个中括号，然后是许多允许的字符（包括至少一个点），之后是二到六个字符，即域名扩展名。当然，对于电子邮件，有更详细且可能更好的的验证表达式，但没有人会费力去查阅相关的\
  \ RFC（[www.ietf.org/rfc/rfc2822.txt](http://www.ietf.org/rfc/rfc2822.txt)）。从原则上讲，这只是为了捕捉无意的输入错误，因此严格来说，检查是否存在\
  \ `@` 符号几乎就足够了。95 随着国际域名的普及，这确实是一个问题，因为该正则表达式无法识别域名中允许的特殊字符（如变音符号）；`\\w` 表达式可能对此帮助。\n\
  \n这里有两个更多实用的表达式：\n\n- `^(\\w-)?(\\d{5})$`（用于美国邮政编码）\n\n- `^(\\d|1?\\d\\d|2[0-4]\\\
  d|25[0-5])\\.(\\d|1?\\d\\d|2[0-4]\\d|25[0-5])\\.(\\d|1?\\d\\d|2[0-4]\\d|25[0-5])\\\
  .(\\d|1?\\d\\d|2[0-4]\\d|25[0-5])$`（用于有效的 IP 地址 `[IPv4]`）\n\n### 13.3.5 更详细的错误信息\n\
  \n之前的表单检查并不很有建设性；显示的只是一个说出了问题的错误消息。然而，该消息并没有显示问题出在哪里。因此，你将在后面看到脚本的扩展版本。在这个版本中，所有发生错误的表单字段都存储在一个\
  \ `$errorfields` 数组中（参见图 13.9）。该数组会在脚本末尾输出：\n\n```php\necho \"<ul><li>\"; \necho\
  \ implode(\"</li><li>\", $errorfields); \necho \"</li></ul>\";  \n```\n\n通过这个小而有效的技巧，你可以轻而易举地获得列表显示。完整的示例在下面的列表中。\n\
  \n```html\n<html> \n<html>\n<head>\n  <title>订单表单</title>\n</head>\n<body> \n```\n\
  \n```php\n<?php\n  $ok = false;\n  $errorfields = [];\n  if (isset($_POST[\"Submit\"\
