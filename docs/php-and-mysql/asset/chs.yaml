  \n![Xdebug 集成到 PHPStorm 等其他编辑器](img/img-f35.8.html) \n\n**图 35.8**     Xdebug 集成到\
  \ PHPStorm 等其他编辑器\n\n另一个实用的选项是集成性能分析（profiling）。这需要两个额外的 `php.ini` 配置：\n\n```ini\n\
