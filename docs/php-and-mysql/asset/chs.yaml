  ]) == \"\") {\n      $ok = false;\n      $errorfields[] = \"Last name\";\n    }\n\
  \    if (!isset($_POST[\"Email\"]) ||\n      !is_string($_POST[\"Email\"]) || \n\
  \        trim($_POST[\"Email\"]) == \"\") {\n      $ok = false;\n      $errorfields[]\
  \ = \"Email\";\n    }\n    if (!isset($_POST[\"Promo\"]) ||\n      !is_string($_POST[\"\
  Promo\"]) || \n        trim($_POST[\"Promo\"]) == \"\") {\n      $ok = false;\n\
  \      $errorfields[] = \"Promo\";\n    }\n    if (!isset($_POST[\"Number\"]) ||\n\
  \      !is_string($_POST[\"Number\"])) {\n      $ok = false;\n      $errorfields[]\
  \ = \"Number\";\n    }\n    // ... (根据核心内容继续逻辑)\n```\n（注：由于输入文本具有重复/中断的逻辑块，结构遵循所提供源文本的流程）\n\
  \n```php\n    if ($ok) {\n      echo \"<ul><li>\";\n      echo implode(\"</li><li>\"\
  , $errorfields);\n      echo \"</li></ul>\";\n    } else {\n      echo \"<p>Form\
  \ incomplete</p>\";\n      echo \"<ul><li>\";\n      echo implode(\"</li><li>\"\
  , $errorfields);\n      echo \"</li></ul>\";\n    }\n  }\n?>\n```\n\n```html\n</body>\n\
  </html>\n```\n\n\n\n\n\n我们在几页前曾将之前的表单检查描述为“非建设性的”。现在情况仍然如此——无论是否有详细的错误信息。想象一下，如果表单再长一点，用户填写了它，这肯定需要五分钟。遗憾的是，用户遗漏了一个重要的字段。于是他收到了一条错误消息，并想要填写缺失的字段。但令他恼的是，表单再次显示为空。换句话说，用户必须重新填写所有字段。\n\
  \n在一些（较廉价的）网站上，开发者采取了非常简单的方法，让用户只需点击浏览器的“后退”按钮。遗憾的是，这并不总是有效，因为并不是所有浏览器都会缓存所有信息；这还取决于本地设置、内存使用和其他通用状况。\n\
  \n因此，使用后退按钮的方法是不行的；相反，它根本不予考虑。唯一真正可行的解决方案是使用已经输入的值预填充表单。\n\n遗憾的是，这种方法有一个缺点：它有时会非常费力且耗时。这很可能是它在许多书中被遗漏的原因。但事实是，这种技术是客户所要求的，并且应该是每个\
  \ PHP 开发者工具箱的一部分。在我们看来，因此这个主题不应该被省略。后续几个小节的枯燥工作有两个优势：首先，展示的技术始终是相同的，所以你可以轻松将其转移到你自己的表单中。其次，你拥有一个真正帮助用户提供所需信息的表单——向专业网站又迈了一步。\n\
  \n### 13.4.1 准备工作\n\n为了尽可能容易地实现预填充，需要对之前的脚本进行微调。需要做什么很清楚：必须对之前的表单输入进行评估，并可能将其输入表单。由于由于原因，脚本需要方便访问用户已输入或未输入的内容。这些信息已经被读取：\n\
  \n```\n  $Salutation = (isset($_POST[\"Salutation\"]) && is_string($_POST[\"Salutation\"\
  ])) ? \n$_POST[\"Salutation\"] : \"\";\n  $Firstname = (isset($_POST[\"FirstName\"\
  ]) && is_string($_POST[\"FirstName\"])) ? \n$_POST[\"FirstName\"] : \"\";\n  $Lastname\
  \ = (isset($_POST[\"LastName\"]) && is_string($_POST[\"LastName\"])) ? \n$_POST[\"\
  LastName\"] : \"\";\n  $Email = (isset($_POST[\"Email\"]) && is_string($_POST[\"\
  Email\"])) ? \n$_POST[\"Email\"] : \"\";\n  $Promo = (isset($_POST[\"Promo\"]) &&\
  \ is_string($_POST[\"Promo\"])) ? \n$_POST[\"Promo\"] : \"\";\n  $Number = (isset($_POST[\"\
  Number\"]) && is_string($_POST[\"Number\"])) ? \n$_POST[\"Number\"] : \"\";\n  $Section\
  \ = (isset($_POST[\"Section\"]) && is_array($_POST[\"Section\"])) ? \n$_POST[\"\
  Section\"] : [];\n  $Comments = (isset($_POST[\"Comments\"]) && is_string($_POST[\"\
  Comments\"])) ? \n$_POST[\"Comments\"] : \"\";\n  $Terms = (isset($_POST[\"Terms\"\
  ]) && is_string($_POST[\"Terms\"])) ? \n$_POST[\"Terms\"] : \"\";  \n```\n\n这是非常实用的。如果用户选择了称呼的某个单选按钮，该信息就在\
  \ `$Salutation` 中。如果什么都没有点击，该信息也在 `$Salutation` 中，因为此时变量包含一个空字符字符串。这些数据只有在表单完全完成后才被确定。然而，当表单出现错误时，我们需要这些数据。由于由于原因，整个块被移动到\
  \ PHP 代码的开头。然后根据字段类型继续执行。\n\n### 13.4.2 文本字段\n\n对于单行文本字段——即 `<input type=\"text\"\
  \ />` 和 `<input type=\"password\" />`——预填充值位于 `value` 属性中。然而，使用类似下面的结构将是一个致命的错误：\n\
  \n```\n<input type=\"text\" name=\"Field \" value=\"<?=$Field?>\" />  \n```\n\n\
  如果用户之前在字段中输入了例如 `>>PHP<<`，会发生什么？这将导致如下 HTML 代码：\n\n```\n<input type=\"text\" name=\"\
  Field \" value=\"\">>PHP<<\"\" />  \n```\n\n因此，将输出一个空文本字段，后面跟着文本 `PHP`（那些多余的大于号和小于号会变成什么高度取决于浏览器）。带着一点“犯罪能量”，可以构造出这种方式输出的完全不同的内容——例如\
  \ JavaScript 代码。\n\n### 注意\n\n第 32 章 (#32_001.html#h32) 是关于 PHP 编程中必要的安全考虑。在这里你将找到关于如何避免由上述类型的疏忽代码引起的事故的进一步信息。\n\
  \n因此，你必须先编辑变量中的值。可以使用 `htmlspecialchars()` 函数来实现。这同样适用于多行文本字段，只是字段的值不在 `value` 属性中，而是在\
  \ `<textarea>` 和 `</textarea>` 之间。下面的列表显示了相应的代码。\n\n```\n<input type=\"text\" name=\"\
  FirstName\" value=\"<?php echo htmlspecialchars($Firstname); ?>\" /> \n<input type=\"\
  text\" name=\"LastName\" value=\"<?php echo htmlspecialchars($Lastname); ?>\" />\
  \ \n<input type=\"text\" name=\"Email\" value=\"<?php echo htmlspecialchars($Email);\
  \ ?>\" /> \n<input type=\"text\" name=\"Promo\" value=\"<?php echo htmlspecialchars($Promo);\
  \ ?>\" /> \n<textarea cols=\"70\" rows=\"10\" name=\"Comments\"><?php echo htmlspecialchars($Comments);\
  \ ?></textarea>\n```\n\n列表 13.15 文本字段预填充（节选“form-prefill-textfields”）\n\n### 注意\n\
  \n确保不要创建任何空格（例如空格），因为这些可能会包含在 \"value\" 中。\n\n### 13.4.3 单选按钮\n\n对于单选按钮的情况非常简单：如果单选按钮的\
  \ `value` 属性与 `$_GET` 或 `$_POST` 中的值匹配，则该单选按钮被选（属性 checked）。这写起来有些繁琐。\n\n```\n<input\
