  \n## 13.5 文件上传\n\n还有一种表单字段尚未被提到：`<input type=\"file\" />`。这是一个用于上传文件的字段，允许用户通过网络浏览器将文件传输到\
  \ Web 服务器。此的一个应用是 Web 邮件脚本，它允许在邮件中附加文件（参见图 13.11 和图 13.12）。\n\nPHP 为访问此类文件上传提供了一个简单的内置选项。首先，你需要调整表单：如果表单的\
  \ `enctype` 属性没有像所示设置，你将无法在服务器端访问传输的数据。你还必须通过 `POST` 发送表单。老实说，依赖 `GET` 限制来处理文件也没有意义：\n\
  \n```\n<form method=\"post\" enctype=\"multipart/form-data\">\n```\n\n现在你只需要一个文件上传表单元素：\n\
  \n```\n<input type=\"file\" name=\"File\" />\n```\n\n所有所有传输的文件都可以通过 PHP 的（超全局）数组\
  \ `$_FILES` 访问。如果我们假设文件已在名为 `\"File\"` 的表单字段中指定，那么以下数组元素是值得关注的：\n\n* `$_FILES[\"\
  File\"][\"error\"]`：如果发生错误时的任何错误代码\n* `$_FILES[\"File\"][\"name\"]`：用户系统上的原始文件名\n\
  * `$_FILES[\"File\"][\"size\"]`：以字节为单位的文件大小\n* `$_FILES[\"File\"][\"tmp_name\"]`：文件在服务器上的（临时）名称\n\
  * `$_FILES[\"File\"][\"type\"]`：文件的 MIME 类型（由客户端浏览器发送）\n\n列表 13.21 输出了所有这些信息。\n\n\
  ```html\n<<html>\n<head>\n  <title>File Upload</title>\n</head>\n<body>\n```\n\n\
  ```\n\n```php\n<?php\n  if (isset($_FILES[\"File\"])) {\n    ksort($_FILES[\"File\"\
  ]);\n    reset($_FILES[\"File\"]);\n    echo \"<table>\";\n    foreach ($_FILES[\"\
  File\"] as $key => $value) {\n      $value = is_string($value) ? htmlspecialchars($value)\
  \ : \"\";\n      echo \"<tr><td>$key</td><td>$value</td></tr>\";\n    }\n    echo\
  \ \"</table>\";\n  }\n?>\n```\n\n```html\n<form method=\"post\" enctype=\"multipart/form-data\"\
  \ action=\"\">\n<input type=\"file\" name=\"File\" />\n<input type=\"submit\" value=\"\
  Upload\" />\n</form>\n</body>\n</html>\n```\n**列表 13.21** 关于传输文件的信息（\"file-upload.php\"\
  ）\n\n图 13.11 和图 13.12 显示了该脚本在两个不同浏览器处理同一个文件的结果。你可以看到 Internet Explorer（所使用的版本）传输了完整路径，从而为网站提供了比实际需要更多的信息。作为交换，文件大小可能不可用——但在大多数情况下，这是由于\
  \ Web 服务器造成的。![Chrome 中的传输文件](img/img-f13.11.html) **图 13.11** Chrome 中的传输文件![Internet\
  \ Explorer 中的传输文件](img/img-f13.12.html) **图 13.12** Internet Explorer 中的传输文件\n\n\
  ### 提示\n\n对于编程来说，这自然意味着如果你依赖 `basename()`，那么你才能获得获得不带路径的正确文件名。它从路径中提取实际文件名。然而，一旦\
  \ PHP 脚本完成，传输的文件就会被自动删除。因此，你必须确保文件已复制到某个地方，以便你可以继续使用它。这曾与风险相关。虽然 `$_FILES[\"file\"\
  ][\"tmp_name\"]` 包含了文件的临时名称，但稍微努力，攻击者也可以伪造这些信息，从而指示 PHP 脚本处理本不应该处理的文件（经典示例：`/etc/passwd`）。PHP\
  \ 提供了 `is_uploaded_file()` 函数，它可以检查文件名是否确实是通过通过文件上传传输的。既然你反正要把文件移动到某处，你应该使用 `move_uploaded_file()`\
  \ 函数，它会将文件移动到目标位置。\n\n### 注意\n\n你可以自己设置文件缓存的位置。如果 `php.ini` 中没有设置 `upload_tmp_dir`\
  \ 配置选项，则使用操作系统的临时目录。但在某些 PHP 版本中，这仅在 Unix/Linux 系统上运行良好。因此，务必设置此项，并且当然确保 PHP 对所选文件夹具有写入权限。在使用\
  \ `move_uploaded_file()` 时，目标文件夹也必须存在写入权限。\n\n还有一个 `upload_max_filesize` 选项，你可以指定传输文件的最大大小。然而，PHP\
  \ 会检查这一点：因此文件会被传输，但可能会被丢弃。这就是为什么我们不使用这个选项，因为你可以使用 `$_FILES[\"file\"][\"size\"]`\
  \ 来检查大小。\n\n如果你一次性传输多个文件，请注意 `max_file_uploads` `php.ini` 选项。它规定了允许的文件数量。\n\n###\
  \ 提示\n\n在这种情况下，还有一个实用的配置选项：`post_max_size` 是通过 `POST` 传输的所有文件的大小限制。如果超过限制，PHP 将不会执行脚本。\n\
  \n### 文件上传进度条\n\n技术上可以监控文件上传进度并在用户界面中显示。这样做的问题是服务器必须支持并向浏览器提供相应的数据，这在当前的 PHP 配置下意味着没有\
  \ FastCGI 和 PHP-FPM。然而，这使得有趣的用例成为可能。流行的选项有两种：\n\n* PHP 内置的上传功能，它通过会话管理工作（参见第 15\
  \ 章）。\n* `uploadprogress` PECL 扩展，可在 `http://s.prs.co/v60219` 获取，支持 PHP 8.x 并包含\
  \ Windows 二进制文件。简要文档可以在 GitHub 上找到，源代码也是如此：`http://s.prs.co/v60220`。\n\n## 13.6\
  \ 应用示例\n\n在这些丰富的信息之后，我们向你展示两个应用示例，它们为示例表单增加了额外功能并演示了文件上传。\n\n### 13.6.1 JavaScript\
  \ 表单检查\n\n通过使用 PHP，表单现在是无懈可击的。这意味着只有数据完整时才会被进一步处理。然而，正如前面提到的，表单检查更多是为用户提供的服务以防止意外错误。它无法防止故意错误。\n\
  \n\n\n\nJavaScript 在这里有些偏离主题，因为我们正在讨论的是 PHP。尽管如此，对于专业的 Web 开发来说，了解相关的 Web 技术是关重要的。\n\
  \n#### 注意事项\n\n在第 28 章中，我们将详细详细讨论 PHP 和 JavaScript 之间的交互。\n\n对 `<form>` 元素进行以下调整有助于确保表单在发送之前经过检查：\n\
  \n```html\n<form method=\"post\" onsubmit=\"return check(this);\">  \n```\n\n`onsubmit`\
  \ 属性用于指定在表单发送之前直接执行的 JavaScript 代码。技巧在于：如果 JavaScript 代码返回 `false`，则表单提交将被取消。在我们的案例中，代码是\
  \ `return check(this)`。计算过程：在（自写的）JavaScript 函数 `check()` 中对表单数据进行检查。如果发生错误，`check()`\
  \ 返回值 `false`。这意味着 `onsubmit` 的实际值为 `return false`，从而防止表单被发送。\n\n唯一缺失的是 JavaScript\
  \ 代码。这最好放置在 HTML 页面的 `<head>` 部分。必须定义 `check()` 函数；调用时，将待检查表单的引用作为参数传递。首先，声明一个错误变量，并在其中存储发生错误的字段名称：\n\
  \n```html\n<script> \n```\n\n```javascript\nfunction check(f) { \n  var error =\
  \ \"\";  \n```\n\n现在逐个检查字段。让我们从文本字段开始。在这里检查它们的值：\n\n```javascript\n  if (!f.elements[\"\
  FirstName\"] || f.elements[\"FirstName\"].value == \"\") {\n    error += \"First\
  \ name\\n\";\n  }\n  if (!f.elements[\"LastName\"] || f.elements[\"LastName\"].value\
  \ == \"\") {\n    error += \"Last name\\n\";\n  }\n  if (!f.elements[\"Email\"]\
  \ || f.elements[\"Email\"].value == \"\") {\n    error += \"Email\\n\";\n  }\n \
  \ if (!f.elements[\"Promo\"] || f.elements[\"Promo\"].value == \"\") {\n    error\
  \ += \"Promo\\n\";\n  }\n  if (!f.elements[\"Comments\"] || f.elements[\"Comments\"\
  ].value == \"\") {\n    error += \"Comments\\n\";\n  }  \n```\n\n### 提示\n\n既然相应的字段已存在于表单中，为什么还要用\
  \ `!f.elements[\"Field\"]` 进行检查？这里我们同样在进行瞻性编程。如果你将 JavaScript 代码适配到自己的脚本并在复制粘贴时忘记替换名称，就可以防止\
  \ JavaScript 错误信息。\n\n对于两个单选按钮，你必须检查是否其中一个已被选中；这可以使用 JavaScript 的 `checked` 属性完成：\n\
  \n```javascript\n  if (!f.elements[\"Salutation\"] || (\n      !f.elements[\"Salutation\"\
  ][0].checked && \n      !f.elements[\"Salutation\"][1].checked)) { \n    error +=\
  \ \"Salutation\\n\"; \n  }  \n```\n\n复选框比较简单。在这里，只需要考虑复选框本身——同样在 `checked` 属性中：\n\
  \n```javascript\n  if (!f.elements[\"erms\"].checked) { \n    error += \"Terms &\
  \ conditions\\n\";\n}    \n```\n\n对于选择列表，结果在很大程度上取决于“未选择内容”的具体含义。在示例表单中，单列表顶部包含一个占位条目（请选择），这显然被视为“未填写”。从第二个列表条目开始，字段才算被正确完成。JavaScript\
  \ 中列表字段的内部计数从 0 开始；也就是说，从第 1 个字段开始都是正常的。选中的字段位于 `selectedIndex` 属性，这产生了以下检查代码：\n\
  \n```javascript\n  if (!f.elements[\"Number\"] || f.elements[\"Number\"].selectedIndex\
  \ < 1) { \n    error += \"Number of tickets\\n\"; \n}\n```\n\n在多选列表中，很少使用 `selectedIndex`，因为感兴趣的不是第一个选中的元素（位于\
  \ `selectedIndex` 中），而是所有选中的元素。另一方面，在检查字段时，重要的是是否选中了任何内容。如果没有，`selectedIndex` 的值为\
  \ -1，我们进行如下检查：\n\n```javascript\n  if (!f.elements[\"Section[]\"] || \n      f.elements[\"\
  Section[]\"].selectedIndex == -1) {\n    error += \"Section\\n\"; \n}  \n```\n\n\
