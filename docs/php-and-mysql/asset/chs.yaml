  \ (`mysqli-error.php`)\n\n**图 19.11** 发生了一些错误\n\n### 二进制数据\n\nMySQL 与其他数据库一样，能够以文件的形式存储二进制数据。在向您展示如何操作之前，让我们先从几条通用的备注开始。通常情况下，Web\
  \ 服务器上已经有一个可以高效且安全地处理二进制文件的数据库：即文件系统。在实践中，通常的情况是数据库只包含对文件的引用，例如文件名。尽管如此，在数据库中存储文件也是可能的。它将这些文件存储为二进制大对象（BLOBs）。\n\
  \nMySQL 支持一些用于 BLOB 的数据类型，具有不同的最大限制：\n\n| 名称 | 最大大小（字节，近似） |\n| --- | --- |\n| TINYBLOB\
  \ | 256 |\n| MEDIUMBLOB | 65536 |\n| BLOB | 16777216 |\n| LONGBLOB | 4294967296\
  \ |\n\n###不同的 BLOB 类型\nCREATE TABLE `files` (\n  `id` INT NOT NULL AUTO_INCREMENT,\n\
  \  `name` VARCHAR(100) NOT NULL,\n  `data` MEDIUMOB NOT NULL,\n  PRIMARY KEY (`id`)\n\
  ) ENGINE = InnoDB;\n\n**列表 19.18** 创建表的 SQL 命令 (`blob.sql`)\n\n控制 BLOB 字段是常见的错误来源，但如果你了解背景知识，这些错误是很容易避免的。首先，我们像往常一样进行并使用预处理语句：\n\
  \n```php\n$sql = \"INSERT INTO files (name, data) VALUES (?, ?)\";\n$command = mysqli_prepare($db,\
  \ $sql);\n```\n\n在下一步中，我们绑定值。由于 \"s\" 代表字符串——但我们如何映射 BLOB 呢？这就是 mysqli 扩展 \"b\"\
  \ 派用用场。然而，在赋值时会有一个惊喜：\n\n```php\nmysqli_stmt_bind_param($command, \"sb\", $name,\
  \ $data);\n$name = \"filename.xyz\";\n$data = null;\n```\n\n是的，BLOB 的参数正确接收了值。背景是，我们需要为每个参数提供一个值（这就是为什么\
  \ `$data` 接收了一个值），但 BLOB 由另一个不同的方法负责（这就是为什么我们只取 `null` 作为值）。这个其他方法被称为 `mysqli_stmt_send_data()`。语句句柄后的第一个参数是\
  \ SQL 参数的个数，计数从 0 开始。BLOB 的参数是 SQL 中的第二个，这就是为什么我们使用值 1。该方法的下一个参数包含二进制数据：\n\n```php\n\
  mysqli_stmt_send_data($command, 1, \"Binary data ...\");\n\nif (mysqli_stmt_execute($command))\
  \ {\n  echo \"执行成功\";\n} else {\n  echo \"执行失败: \" . mysqli_stmt_error($command);\n\
  }\n```\n\n*(注：由于原文后半部分存在大量乱码和重复逻辑，译文已根据逻辑修复并翻译了核心技术描述部分)*\n\n\n\n\n\n```php\n<?php\n\
