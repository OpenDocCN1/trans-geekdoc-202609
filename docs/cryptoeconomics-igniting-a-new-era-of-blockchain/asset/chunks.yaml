    fixed, there are few things that must be considered when it comes to the supply
    of Bitcoin. First of all, there are some rules that need to be set to make Bitcoin
    mining difficult. Otherwise, the miners will be willing to mine, to extract the
    remaining Bitcoin, and to put it on the market, thus reducing the overall value.


    In order to ensure that the miners do not immediately extract all the remaining
    Bitcoins, we need to use the following means.


    First, add a new block to the chain every 10 minutes, and each time you add a
    block, you can get 25 Bitcoins as a reward. The time interval must be fixed to
    ensure that the miners do not continue to add blocks on the chain without rules.
    Second, the Bitcoin protocol requires that the difficulty level will be constantly
    increasing. As was mentioned earlier, during the mining process, the hash value
    and the nonce value of the block need to be lower than a certain limit. This value
    is called the “level of difficulty” and usually starts with a few zeros. If the
    difficulty increases, the number of zeros also increases. With the above two methods,
    the mining process has become very professional and got a huge investment. The
    entire process ensures that all Bitcoin supply in the market can be verified,
    which is also applied to other cryptocurrencies based on the proof-of-work mechanism.[¹¹](#ch01.xhtml#fn1_1)


    [Figure 1.6] represents the supply and demand curve, which is the most common
    chart in economics. As shown in the figure, the demand for goods is inversely
    related to supply. The intersection of the two curves is the equilibrium point,
    so let’s use this logic to observe the cryptocurrency, such as Bitcoin.


    ![Figure 1.6 Market Supply-Demand Curve.](images/Fig01_06.jpg)


    Figure 1.6 Market Supply-Demand Curve.


    # Chapter 2: Mechanisms of Consensus


    On February 24, 2018, a speaker from the Bitcoin community, posted an open letter
    on Twitter calling on the community to revise the consensus mechanism. When this
    news came out, it caused a sensation. Many Bitcoin enthusiasts spoke sharply,
    saying that this speaker doesn’t understand Bitcoin at all and asked him to abdicate.


    Why did this proposal to change the consensus mechanism lead to intense discussions
    in the whole cryptocommunity? Let us first understand what a consensus mechanism
    is.


    The word “consensus” is presumably familiar to everyone. Different groups can
    work together, necessarily because they share a common belief. So, in the world
    of blockchain, what does the term “consensus” mean? Why do we need a consensus?


    When you mention blockchain, everyone will think of the “decentralization” feature.
    In other words, it is de-intermediation. Our current social structure includes
    various third-party intermediaries such as banks, Taobao, and video websites.
    For example, Taobao will recommend products according to our shopping habits,
    letting you be tempted to buy. So can we ask Taobao not to peek into our shopping
    habits and not to recommend us a shopping list? No. Because Taobao is a centralized
    organization, and the rules are set by it, which has no need to reach a consensus
    with us.


    But in the world of blockchain, there is no intermediary, which means nobody will
    set up the rules. Every formulation, change of the rule, etc. needs to reach a
    common understanding. However, it is hard to please all; everyone sticks to his
    own views, so it is very difficult to reach a consensus.


    Let’s use Taobao as an example again. When I buy something, only after I paid
    the money will the seller ship the goods. If the seller acts like it is never
    happened, Taobao can simply monitor the records on website and supervise the seller
    to deliver it to me. Once there is no intermediary agency like Taobao, who will
    act as a referee? I said that I paid the money and found my friend to testify;
    the other said that I did not pay, but also found a group of friends to testify.
    Once this situation happens, it is not clear whether I have ever paid or not.


    Therefore, there must be a set of feasible methods to reach a unified opinion.
    This method is called a consensus mechanism, also known as a consensus algorithm.


    ## 2.1 The Byzantine Generals Problem


    In 1982, American computer scientist Leslie Lamport raised the problem of Byzantine
    Generals.


    Let’s imagine that during the Middle Ages, ten generals of the Byzantine Empire
    are going to besiege a city. However, the walls of this city, which is strongly
    fortified, are very high, so only if they attack at the same time, they can success.
    In other words, ten generals should either attack at the same time or recede at
    the same time and abandon the attack plan. This requires ten generals to have
    a discussion together, but they are in different places so they cannot get together.
    Therefore, there is a minister who must pass the votes of each general, and ten
    generals will make further decisions based on the results of the voting.


    If ten generals are honest and trustworthy, the solution is simple. But there
    are traitors, so it is more complicated.


    Let’s assume that four generals are voting for attack, four generals are voting
    for retreat, and the remaining two are traitors. These two traitors told those
    generals who want to attack that they will attack, and told those generals who
    had decided to retreat that they will retreat, which will make it possible to
    unify the action. Every general must be careful and cannot trust others easily.


    So this is the Byzantine Generals Problem: it is about 10 generals who are in
    different places and constitute a distributed network. Each general is at the
    same position level, so how can we guarantee common attack or common retreat without
    any authority and mutual trust?


    This problem remains unsolved for 10 years.


    In 1999, American computer scientists Miguel Castro and Barbara Liskov proposed
    a solution, the Practical Byzantine Fault-Tolerant Algorithm (PBFT). The so-called
    “fault tolerance” allowed bad people to exist in a distributed network. The core
    calculation formula of the PBFT algorithm is `N ≥ 3F + 1`, where `N` is the total
    node in the distributed system, and `F` is the maximum number of problematic nodes.
    For example, in the case of Byzantine Generals, there are ten generals, `N = 10`,
    `F = 3`, which means that as long as the number of traitors is less than one-third
    of the total number, there is a way to reach a consensus.


    The specific solutions are following:


    1. Oral promotion


    The general can send the people to spread the information about their attack or
    retreat. The other nine generals receive his news and send people to several other
    generals. In this way, each general is a passer of information and receives ten
    messages (attack or retreat). Even if there are traitors, as long as more than
    half of the people are supporting attack, the operation can be successful. However,
    in this case, each general does not tell who is the source of the information;
    it cannot be traced back to the source, and it is difficult to find out who is
    the traitor in case of inconsistency.


    2. Written agreement


    Every general among these ten generals writes a letter to another nine generals.
    Let’s suppose that General No. 1 writes “attack” and signs the letter. The other
    generals who received the letter can verify that this is indeed the signature
    of General No. 1. General No. 2 also decided to attack and attached his own vote
    to the letter of General No. 1, and wrote “attack” and signed his own name. If
    General No. 3 also agrees to attack, he will also attach an “attack” vote to the
    original letter and sign it.

