  trans: '

    2018 年 2 月中旬，多家海外媒体报道，冰岛 2018 年用于挖矿的电量将超过该国 34 万人口的总家庭用电量。一周后，Elite Fixtures 网站发布了当周更新的比特币挖矿成本调查。结果显示，开采一个比特币，`Antminer
    S9`的平均耗电为`17,773 kW`，`S7`的耗电为`45,889 kW`，而`Avalon 6`的耗电为`55,294 kW`。许多媒体并不理解什么是比特币矿；他们只是在追踪热点，就像追踪“电力消耗”一样。他们用“震惊！”和“太糟糕了！”等词来强调挖矿能量消耗是巨大的。


    作为比特币矿机制造商的领导者，比特大陆从未公开过其对能源问题的立场。2018 年，我与著名的中国经济学家步非沫讨论过挖矿问题；关于挖矿功耗是否可以定义为浪费行为，步先生的回答非常简单且犀利：“我花自己的钱买我想消耗的电。这是简单的消费者行为。这怎么能浪费呢？”


    `PoW`机制也被应用于市值第二大的加密货币以太坊。但以太坊创始人维健·布特林（Vitalik Buterin）希望修改共识机制。当我问他为什么时，他回答道：“我个人觉得`PoW`浪费能量并对环境有负面影响。现在比特币挖矿的耗电相当于整个新加坡的用电。而以太坊目前的耗电量达到了新加坡总用电量的
    30%”。


    我将经济学家关于浪费资源的观点转达给了维健·布特林。他这样反驳道：“从社会角度来看，这确实是一种浪费行为。但从矿工的角度来看，这不是浪费资源”。


    事实上，如果任何消费者行为都被上升到社会层面，问题将会变得复杂。


    # 2.3.2 PoW 问题 2：环境问题


    去年 12 月，CNNMoney 报道称某些专家表示比特币挖矿消耗大量能量，可能对环境有害。例如，气象学家埃里克·霍尔陶斯（Eric Holthaus）认为比特币挖矿正在减缓化石燃料向可再生能源的转型，并最终消耗超过可用范围的电力。环保主义者也毫不落后，他们担心比特币挖矿将严重损害全球应对气候变化的努力。


    1 月，瑞瑞银行在最新报告中提到，比特币挖矿不太可能引发“环境末日”。该报告指出，“线性预测矿工的功耗趋势线是错误的，因为该行业可能会开发更具能源效益的硬件和实践，以获得竞争优势。报告指出，这种现象在大麻种植者和数据中心运营商在这些行业高速增长时期都曾发生过”。


    当然，污染环境的论点可以为该行业提供新的商业机会。现在许多公司已开始研究绿色挖矿。


    去年 12 月，我收到一封来自美国的邮件。该公司表示他们正在研究绿色挖矿，并向我索联系方式。我查看了他们的官方网站，但没有发现任何内容。2018 年 2 月，我看到许多公司提供绿色挖矿解决方案。根据报告，这些机器的成本高于传统水电电。因此，即使你使用绿色挖矿，结果也将是灾难性的。


    # 2.3.3 PoW 问题 3：权力集中


    比特币自诞生以来经历过多次“死亡”。除了外部因素，我们必须意识到，如果矿机发货延迟而网络算力在增加，矿工将遭受巨大损失。`PoW`机制也被应用于以太坊。


    在激烈的竞争中，吴极汉的技术合作伙伴展锐（Micree Zhan）在公司成立不到 6 个月后，独立开发了第一代比特大陆 Antminer S1 矿机。与前代矿机相比，相同算力的能耗减少了一半。2015
    年初，展国宽开发并发布了第五代比特大陆 Antminer S5，确立了比特大陆在矿业市场的领先地位。


    ```

    图 2.2 算力分布


    ![图 2.2 算力分布。（注：Antpool 和 BTC.com 均属于比特大陆）。](img/Fig02.jpg)

    ```

