- raw: 'The other problem which exists in judicial fields is **data sharing** between
    different judicial organizations. For example, according to the existing law system,
    three organizations of public security are independent from each other and that
    influence efficiency and accuracy of the work. Blockchain can contribute a lot
    in this field, can realize data sharing on the chain based on the shared ledger,
    and connect the public security, the procuratorate, and the court that can improve
    the efficiency of case integration. Guizhou Ruipu Political and Legal Big Data
    Platform has been used since 2016, and only 2.3% of cases were given back for
    supplementary investigation (when there are not enough evidence), and it has decreased
    25.7% in comparison with the previous year; the arrest rate due to insufficient
    evidence has dropped 28.8% year-on-year in comparison with the previous year,
    the level acquittal decisions because of lack of evidence became close to zero,
    and the time limit for handling cases was shortened by nearly 30%. The chain landed
    in Guiyang, Sichuan, and Guangzhou.


    Another interesting example is *Arbitrage Chain*. In February 2018, the first
    “blockchain + PoE” award based on blockchain technology was issued by the Guangzhou
    Arbitration Commission. The so-called *Arbitrage Chain* has been operating stably
    for 5 months and has been built by WeBank in collaboration with the Guangzhou
    Arbitration Commission and Hangzhou Yibei Technology company. *Arbitrage Chain*
    is based on blockchain and helps to prevent tampering, and it is trustworthy,
    distributive, and based on encryption algorithms. When the data is signed and
    confirmed by the consensus mechanism, the chain is supplemented by smart contracts
    to ensure the authenticity of the data, so it can guarantee legality, relevance
    requirements, and standardization of trials and evidence.


    When it comes to the matter, the user’s authentication result and the HASH of
    the business operation evidence will be recorded on the *Arbitrage Chain* (legal
    chain block). When arbitration is required, the background personnel only need
    to click a button, and the corresponding evidence will be transmitted to the arbitration
    platform. After the arbitration institution receives the data, it checks with
    the blockchain node to verify the data and verifies it according to the network
    arbitration rules and issues an arbitral award.


    A consensus and real-time evidence, in case of disputes, are verified with PoE
    data and can be regarded as a direct evidence, reducing the arbitration process
    and costs, and improving.


    # [7.2.3   Food Safety and Supply Chain](#ch00_fm04_contents.xhtml#rsec7_2_3)


    The problem of food safety has been a very hot topic in media for a very long
    time. Food safety incidents such as waste oil, toxic milk powder, so-called “zombie
    meat”, and cadmium rice are numerous. The blockchain is based on decentralization
    and traceability, and can be transparent, so it can create a traceable system
    and an “unbreakable” food safety chain. In this way, on December 14, 2017, Wal-Mart,
    JD, IBM, and Tsinghua University jointly established *Safe Food Blockchain Traceability
    Alliance*, which aims to improve food tracking and safety by using blockchain.
    This cooperation between the four parties has created an effective standard for
    China to be a food safety ecosystem. Among them, IBM uses its own platform to
    provide expertise, and Tsinghua University acts as a technical consultant to share
    its expertise in core technologies and China’s food safety ecosystem. IBM and
    Tsinghua University plan to work with Wal-Mart and [JD.com](http://JD.com) to
    develop and optimize blockchain technology and promote it to more suppliers and
    retailers joining the alliance.


    For now, Jingdong has launched more than 100 brands to the chain, and more than
    300 hot-selling products were linked to anti-counterfeiting traceability data
    blocks. Wal-Mart’s tests show that by applying blockchain technology, the process
    of tracking a bag of mangoes from farm to store has been reduced from days to
    weeks to 2 seconds. And the time of food recall was significantly shortened, so
    the risk of food poisoning by consumers decreased significantly.


    # [7.3   Secret of Chinese Success](#ch00_fm04_contents.xhtml#rsec7_3)


    China has proved itself as one of the leading countries in the application of
    blockchain, it is often said that it has taken over the second place in the world
    after the USA or even already replaced it. What is the reason for it? How could
    China achieve these results?


    As early as December 2016, the State Council issued the “13th Five-Year National
    Informatization Plan”, juxtaposing blockchain technology and new technologies
    such as the Internet of Things, cloud computing, big data, and artificial intelligence
    as a key engine in sustainable development and deepening structural reforms and
    promotion. On May 30, 2018, Xi Jinping during his speech at the 19th Academician
    Conference of the Chinese Academy of Sciences and the 14th Academician Conference
    of the Chinese Academy of Engineering affirmed the significance of the blockchain
    technology. “Since the 21st century, global science and technology innovation
    has entered an era of unprecedented activity. A new round of technological revolution
    and industrial transformation is reshaping the global innovation map and reshaping
    the global economic structure. A new generation of information technology, represented
    by artificial intelligence, quantum information, mobile communication, Internet
    of Things, and blockchain, accelerates breakthrough applications, and fosters
    new life sciences represented by synthetic biology, genetic editing, brain science,
    and regenerative medicine. The transformation, the advanced manufacturing technology
    that integrates robots, digital and new materials is accelerating the transformation
    of manufacturing to intelligent, service-oriented and green”.


    According to Reality Shares research, in August 2019, the number of patents related
    to blockchain applied by Chinese companies (1,338) is nearly three times more
    than US companies (442) and German companies (44) ([Figure 7.1](#ch07.xhtml#fig7_1)).


    ![Figure 7.1   Number of Blockchain related Patents by Country in 2019. (Source:
    China National Intellectual Property Administration.)](images/Fig07_01.jpg)


    **Figure 7.1   Number of Blockchain related Patents by Country in 2019. (*Source*:
    China National Intellectual Property Administration.)**


    The number of blockchain patents owned by Chinese companies reached 68% of the
    global patent applications. The top three companies in the world – Alibaba (380),
    China United Network Communications (168), and Ping An Insurance (163) – are Chinese
    companies, and the fourth-ranked IBM (146) is based in the United States ([Figure
    7.2](#ch07.xhtml#fig7_2)).


    ![Figure 7.2   Top 10 Companies with the Most Number of Blockchain related Patents.](images/Fig07_02.jpg)


    **Figure 7.2   Top 10 Companies with the Most Number of Blockchain related Patents.**


    The Chinese government is also concerned about the functional aspects of the blockchain.
    Chinese government agencies have taken the lead in understanding blockchain projects
    at the public and corporate levels. China Information Industry Development Center
    regularly publishes major public chain technology evaluation indexes and rankings
    such as Bitcoin, EOS, and Ethereum. The evaluation of these projects is based
    on their basic skills, applicability, and creativity.'
