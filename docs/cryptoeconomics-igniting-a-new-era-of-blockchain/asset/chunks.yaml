    # Foreword


    Why do you need to read this book?


    It’s been 6 years since I invested in OKCoin in 2014. During this period, OKCoin
    (OKex) has become one of the largest cryptocurrency exchanges in the world, but
    I have to say that I only began to understand blockchain when I started Mars Finance
    at the end of the last year.


    A lot of people can’t see the opportunities in blockchain at a glance, because
    the blockchain is sufficiently subversive and complex. It appears to be an upgraded
    version of the “decentralized Internet” that was 20 years ago, which seems to
    be just a technological innovation. But in fact, the blockchain has established
    a new trust system, and thus, it has brought technology, economy, culture, and
    even humanity into it, and has chained everything, just like an octopus. I believe
    this is an opportunity far greater than the Internet. This is an opportunity to
    “flip the table”.


    It is not enough to understand such a complex and very new thing from a technical
    perspective. Therefore, in the community of Mars Finance, many people discuss
    the issue a little deeper; they touch upon the field of monetary and economics,
    and even philosophy and theology.


    Nowadays, terms such as “bitcoin”, “blockchain”, “smart contract”, and “mining”
    have entered our daily life. However, many people started to pay attention to
    blockchain technology more because of the recent rapid growth of cryptocurrency
    market cap, but not because they recognize blockchain as a technology that can
    bring us a new revolution by subverting the existing systems and practices.


    I really like the idea of “cryptoeconomics”. I believe that this term, which is
    unknown to majority of people, will occupy a very important position in the blockchain.
    The author of this book, Gong Jian, is an early participant in the Bitcoin community.
    He began to engage in mining in 2011, and he is also a columnist for *Harvard
    Business Review* and *The Entrepreneur*. The book he wrote is a systematic review
    of the structure and context of the blockchain-derived economic model. In my opinion,
    this is China’s first book on cryptoeconomics in popular science. It describes
    cryptoeconomics in connection with the game theory, behavioral economics, and
    others in simple understandable language.


    **Wang Feng**

    Founder of Linekong Interactive Group (HK.8267) and Mars Finance, partner of Geekbang
    Venture Capital Partner


    # Preface


    Perhaps you are now familiar with the term “blockchain”. Blockchain technology
    has subverted our existing perceptions and will bring us a new revolution.


    Although cryptoeconomics is not a well-known concept, it plays a very important
    role in blockchain. Vlad Zamfir, a developer of Ethereum, explained this term
    as “a formal discipline that studies protocols that governs the production, distribution,
    and consumption of goods and services in a decentralized digital economy. Cryptoeconomics
    is a practical science that focuses on the design and characterization of these
    protocols”.


    This book sorted out structures of blockchain-derived economic models and their
    history, and used actual cases to illustrate the inevitable relationships between
    cryptoeconomics and blockchain.


    Blockchain technology solves trust issues. After the mechanism of cryptoeconomics
    is written as a code, it can restrict everyone’s behavior on blockchain through
    a reward and punishment system that enables automatic mechanism with consensus
    in an innovative way. The greatest significance of cryptoeconomics lies in guaranteeing
    safety, stability, activity, and order in a decentralized consensus system. Security
    and stability are achieved mainly by cryptographical mechanisms. Activity and
    order are achieved through economic mechanisms.


    As this book discusses about the most popular consensus algorithms in current
    days as well as optimization mechanisms, those who are interested in and wish
    to explore the blockchain industry may find this book very useful. At the same
    time, with examples explained in clear and simple terms that are easy to understand,
    this book also explores economic mechanisms of blockchain such as game theory
    and behavioral economics.


    **Jian Gong**


    # Authors


    **Jian Gong** is a data scientist and technology entrepreneur. He used to be a
    columnist at Harvard Business Review (China), The Entrepreneur, etc. He was previously
    the Outstanding Winner of ICM.


    **Wei Xu** is the founder of Huixing Blockchain in China and former COO of Xiaogou
    Money.


    # Chapter 1


    ## What Is Cryptoeconomics?


    What is cryptoeconomics? Vlad Zamfir, a developer of Ethereum, explains this term
    as “a formal discipline that studies protocols that governs the production, distribution,
    and consumption of goods and services in a decentralized digital economy. Cryptoeconomics
    is a practical science that focuses on the design and characterization of these
    protocols”.


    If we leave the concept of cryptoeconomics itself and consider the origin of the
    word, we can see that it derives from two words: cryptography and economics.


    ### 1.1 The Basics of Cryptography

