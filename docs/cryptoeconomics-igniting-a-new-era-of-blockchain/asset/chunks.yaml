    In FBA, there are no goalkeepers, no centralists, and individual nodes can decide
    which participants they should trust. Nodes can choose multiple groups, and the
    choice of individual nodes may depend on standards outside the system. For example,
    if a bank is considered to have a good reputation, then all transactions on other
    nodes require its approval.


    There are different states in the relationship between legal units:


    * ■ Legal unit with intersection: good legal units share their nodes, causing
    node overlap between different legal units.

    * ■ Legal unit with no intersection: when there is no intersection between units,
    we get legal unit with no intersection.


    If the corpus does not intersect, for example, `Statute A` approved a statement
    of a pizza order, and `Statute B` approved a statement of a hamburger order. Because
    they can independently recognize contradictory statements, corpuses without intersection
    could be harmful for consensus.


    So how do you get the nodes to make better choices?


    Each node in the FBA system is responsible for ensuring that the selected legal
    unit does not violate the legal body intersection. It is often necessary to confirm
    whether the quorum cluster is large enough and whether the nodes contained in
    the cluster are important enough to not deceive or generate different information
    for different people and endanger their own reputation.


    Federal vote: accept, confirm.


    Nodes in the FBA system use a federated voting technique to implement their protocols.
    Federal voting techniques are used to guide the FBA system or a group of people
    working together to reach an agreement. In Stellar’s white paper, it is given
    the following example:


    > Lunch consensus


    > To describe in details the process of voting for a node and ultimately accepting
    a statement while allowing the system to agree, let us give an example that many
    people are familiar with. Let’s talk about a group of people voting for what to
    eat for lunch. In this case, the name of the person is the node, and all food
    options are the declarations that the node needs to refer to.


    > Vanessa works in a public office, where a large group of people are booking
    lunch according to their wishes. There are a lot of options, and not everyone
    will make a choice; when it is determined that there are enough people, they will
    place an order.


    > Vanessa and his work colleagues decided to use the FBA-based `SCP` to deal with
    this problem.


    #### Initial vote


    > We assume that Vanessa wants pizza, but still needs to be open-minded, in case
    the majority of people in this group choose other options apart from pizza.


    > Voting is a preparation for work and happens only in the node phase. In the
    first step of the federal election process, Vanessa stated that the pizza was
    valid and promised that if there won’t be any, she would not vote for any option
    apart from pizza. Unless enough of her work companions voted for the pizza, she
    might get the result of accepting a non-pizza option.


    #### Acception (Admittance)


    > Fortunately, there is a legal body intersection, and the body group can affect
    other nodes. Imagine another situation where Vanessa voted for hamburger. But
    remember, voting is just a preparation.


    > Winnie, Andrew, and Eva are all in the legal unit with Vanessa, and they can
    stop the process of accepting burgers. A `v-blocking` (v-shaped) set of nodes
    contains at least one node from all of Vanessa’s body groups and blocks all behaviors
    in the statute containing Vanessa, causing Vanessa to accept pizza.


    > In the following situations, Vanessa actually accepted the pizza:


    > * She has never accepted a statement that contradicts pizza.

    > * Members of each v-shaped restricted set declare to accept pizza, or each collective
    member that includes Vanessa also votes for pizza or declares to accept pizza.


    #### Official approval


    > When every quorum member votes for pizza, we say that this statute recognizes
    pizza. A node does not need to recognize the statement personally.


    > For example, Scott often relies on Andrew and Iris to decide what to eat. They
    are the legal unit of Scott. If all three of them voted for pizza, the unit approved
    the pizza.


    > A working companion can vote for a lunch option and then accept a lunch that
    is different from his vote. Vote pizza doesn’t have to insist on pizza for lunch
    – pizza is accepted as lunch only when it is approved.


    #### Confirmation


    > Confirmation is a final step in the electoral process, and it will result in
    a consistent agreement across the system. To ensure consensus, the nodes exchange
    confirmation messages with each other. The system agrees to a statement; once
    sufficient messages are distributed and processed, regardless of what happens
    afterwards, each active, error-free node will accept the statement.


    > For example, Eva declares that she accepts pizza and sends a confirmation message,
    `accept(pizza)`, which is shorthand for “I have accepted pizza”.


    > When Eva sends a confirmation message, Winnie, Andrew, Graydon, and others in
    the Eva statute broadcast `accept(pizza)`.


    > These messages can convince another person to accept the pizza. In the above
    example, if Vanessa voted against the pizza, for example, if the v-type limit
    set accepts the pizza, then Vanessa accepts the pizza. These other people convince
    more people as much as possible, always broadcasting `accept(pizza)` until everyone
    can accept the pizza.


    > Subsequent confirmation of the statute of the message allows Vanessa to confirm
    the pizza and achieve a system agreement. The company ordered pizza, and everyone
    was happy.


    This example fully illustrates the entire process of FBA system implementation.


    # 3.4 Other: Algorand Agreement


    Turing Award winner and MIT professor Sivio Micali designed the Algorand Consensus
    Agreement, a new encryption consensus mechanism that validates transactions in
    a very short time and extends to many users. Algorand ensures that users never
    disagree on confirmed transactions, even if some users are malicious, the network
    is temporarily partitioned. In contrast, the existing cryptocurrency allows for
    temporary forks, so it takes a long time, about an hour, and finally the number
    of acknowledgments is used to ensure that the transaction is confirmed.


    Algorand uses the new BA protocol agreement to reach user consensus in the next
    set of transactions. To extend the consensus to many users, Algorand uses a new
    mechanism based on verifiable random functions that allows users to self-check
    whether they are selected to participate in the BA protocol to license the next
    set of transactions. In Algorand’s BA protocol, in addition to the private key,
    the user does not retain any private state, allowing Algorand to replace the participant
    immediately after sending the message. This can mitigate targeted attacks on selected
    participants after their identity is revealed.

