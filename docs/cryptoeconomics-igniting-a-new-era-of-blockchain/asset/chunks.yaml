  trans: '


    当信件由六位将军签署时，就达成了“攻击”协议。与口头协议相比，书面协议可以帮你找到信息的来源，并揭示同意攻击的将军。如果他们共同攻击，而那些签署攻击的人在攻击期间撤退，那么该将军就是叛徒，他将在撤退时被处死。


    但这种书面协议也存在一个问题：如何确保在准确的时刻只有一个将军可以在信件后面添加自己的内容。换句话说，在 1 号将军的信件发出后，2 号到 10 号将军中，只有一个将军可以签署签名并将其传递给另一位将军。


    在现实生活中，分布式网络中的节点可能多于十个。那么，如何设计一种共识机制来让大量节点“签署”指令呢？


    要设计这样的共识机制，我们必须遵循分布式网络的基本设计原则。这一原则被称为 `CAP`（一致性、可用性和分区容错性）理论。


    ## 2.2 CAP 理论


    > 我爱鱼，亦爱熊掌。若鱼熊不可得，我宁舍鱼而取掌。


    这是中国哲学家孟子的名言，告诉我们生活中存在必须做的艰难选择。在分布式系统中，`CAP` 理论就是系统设计师无法逃避的“鱼熊掌”问题。


    `CAP` 理论由著名的计算机科学家 Eric Allen Brewer 在 20 世纪 90 年代后期提出。具体来说，它认为一致性、可用性和分区容错性在分布式系统中无法同时存在。`CAP`
    理论认为网络中的任何数据共享系统最多只能具备三个条件中的两个：


    * `Consistency (一致性)`：所有节点都访问最新数据的相同副本，且所有应用程序在任何时候都可以访问相同的数据。

    * `Availability (可用性)`：健康节点在有限时间内响应客户端的请求，而不需要一直等待。

    * `Partition Tolerance (分区容错性)`：所谓的分区意味着系统无法在时间限制内实现数据一致性。一旦发生这种情况，必须对当前操作在 `C`
    和 `A` 之间做出选择。你必须确保当集群中的某些节点断开时，集群能够继续提供服务。


    `图 2.1` 表示了这三个元素之间的关系。


    ![图 2.1 CAP 理论。](img/Fig02_01.jpg)


    **图 2.1 CAP 理论。**


    如图所示，为了满足 `CP`，在网络分区的情况下，为了实现 `C`，请求只能等待一段时间，结果无法实现 `A`；如果为了实现 `CA`，节点状态必须在时间范围内保持一致，且不能出现网络分区，因此它无法满足
    `AP`。为了满足 `AP`，分离的节点同时提供服务但无法相互通信，这将导致状态不一致且无法满足 `C`。


    但事实上，没有任何分布式系统可以避免网络故障（`P`）。因此，系统架构师往往必须在 `C` 和 `A` 之间做出选择。


    ## 2.3 PoW（工作量证明）机制


    在比特币诞生后的十年里，随着网络节点数量的增加，发起攻击的成本变得越来越贵，`PoW` 机制已被证明是安全可靠的。然而，为了维护账本的一致性（`CAP` 理论中的
    `C`）以及在网络节点掉线（`P`）等问题时的系统运行稳定性，比特币网络在某种程度上牺牲了可用性（`A`）。有些人也将这个问题称为“延迟”，即延迟问题。网络需要等待
    10 分钟，并且在账户更新之前应该有足够的交易被确认。如果比特币要获得 `AP`，客户端应该在交易加入区块链时立即接受它，这样它就不需要依赖其他节点，这非常有用。但风险是剩余节点可能会拒绝交易，从而牺牲一致性。


    中本聪明的 `PoW` 设计的核心思想是：你可以成为叛徒，可以作恶，可以制造伪造账户来破坏整个网络的稳定性，但你必须承担相应的成本。在 `PoW` 机制下，一个人必须完成整个网络
    50% 以上的工作量才能发起攻击。这种成本是巨大的。最好诚实地遵守规则并赚一些比特币。


    此外，许多人认为钱最重要的一点是安全。他们认为在 `PoW` 机制中投入大量工作解决数学问题以确保比特币的安全是一种浪费的行为。在这里，我们将讨论 `PoW`
    机制的三个社区经常讨论的重大问题。


    答案可以在白皮书中找到，挖矿可以获得奖励。每次账本更新代表 50 个比特币的奖励，每 4 年减半一次。2009–2012 年为 50 个，2013–2016
    年为 25 个，2017–2020 年将为 12.5 个。这一经济激励机制允许更多矿工参与，不断更新账本并共同维护稳定性。


    ### 2.3.1 PoW 问题 1：资源浪费


    冰岛被誉为“矿工天堂”。那里温度很低，计算机服务器可以自然冷却，而且地热能和水电站的可再生能源使得电价更低；通过这种方式吸引了世界各地的比特币矿业公司。


