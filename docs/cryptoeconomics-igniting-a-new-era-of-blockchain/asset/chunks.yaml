    ## 2. Characteristics of hard fork


    Hard fork has the following characteristics:


    1. It creates a new chain.

    2. Do not consider the compatibility of the old node with the new node, and make
    serious changes in the transaction data and the block data structure.

    3. The implementation is relatively complicated (the miners who do not upgrade
    the nodes remain on the original branch).

    3. Convenient to implement (it doesn’t require upgrade from you).


    ## 6.2.3 The Importance of Forks


    From the current mainstream point of view, the overall opinion about the fork
    is positive. Since the soft forks create limited changes to the network, the main
    focus is on the changes that the hard forks bring to the entire ecosystem.


    ### 1. Forked chains can add new technical features


    The most famous bitcoin fork should belong to the “forked out” bitcoin cash `BCH`.
    The important reason here is resentment between the Bitmain and Core teams. Bitmain
    is currently the world’s largest mining pool. Due to the lack of consensus on
    block expansion and isolation certification, Bitcoin decided that Bitcoin Cash
    (`BCH`) was completed after the network block reached a height of `504,311` and
    it completed a hard fork. After that, `BCH` updated the network difficulty adjustment
    algorithm `DAA` and increased the block capacity from `1M` to `8M`. After the
    `BCH` forked, there were plenty of forked coins, each of them with its own updated
    features. Therefore, we can see that the hard fork is actually a process of bringing
    innovation to the whole ecosystem. Since Satoshi’s invention of Bitcoin, there
    has been no restriction on the hard fork behavior of Bitcoin. The various forked
    out bitcoins with different characteristics are fully compatible on the market
    and are chosen the most suitable currency for people.


    ### 2. Relations between forks and community


    Fork is the result of a consensus that cannot be achieved. In the above example,
    the Bitcoin community could not reach an agreement, which led to the bitcoin blockchain
    fork. What if I can’t complete the fork? Unfortunately, if there is no way to
    solve it through the fork, it may lead to the team take different roads. For example,
    we are familiar with the case the BitShares founder `BM` (`Dan Larimer`), when
    it was impossible to reach a consensus with the community, and finally, he could
    only leave the team.


    Therefore, whether from innovation or community stability point of view, hard
    forks have rationality and positive sides in their own existence. Due to the poor
    performance of Ethereum in dealing with high concurrency cases, Vitalik is already
    considering the `PoS` consensus mechanism, but if this may touch the interests
    of a large number of original miners, will it be resolved by hard forks at the
    end?


    ## 6.3 P + ε Attack


    In the real world, it is always difficult to judge whether a person is a good
    person or a bad person, and whether a person is selfish or altruistic. In the
    democratic world, the minority obeying the majority is already a common consensus.
    But is it reasonable to be the result of the majority’s approval? We first rule
    out the irrational behavior of individuals who are emotionally affected. We assume
    that everyone chooses for their own interests and then realize that even a seemingly
    fair democratic voting system contains many unfair or even wrong.


    For example, Arrow’s impossibility theorem in economics mainly includes two points.


    1. Even in case of a fair vote, the vote does not necessarily reflect the wishes
    of the majority.

    2. Simultaneous voting is easily guided by the host to the desired result.


    To avoid such problems, it is necessary to cast money instead of votes. If there
    is a problem in a fair voting environment and the vote is manipulated, then it
    is clear that in the end, general public will suffer from it. Therefore, this
    is also the greatest significance of the decentralized blockchain network, so
    that all accounts and elections are open and transparent. This is also the goal
    which is pursued by people.


    Similarly, the laws of the economy in the real world are similar to those in cryptoeconomics.
    In the blockchain world, each node has to make constant choices to confirm which
    block is real; this is also a voting process. This process may be exploited by
    malicious nodes, for example, with a bribery. The `P + ε` attack mentioned here
    is just one of such processes.


    ### 6.3.1 What Is P + ε Attack


    Suppose there is a simple Schelling game in which the user votes to determine
    the outcome of a particular fact, the truth is `(1)` false `(0)`.


    At this point, each user can vote according to their own knowledge: `1` or `0`.
    If the user’s option is consistent with the majority in voting, the user will
    receive the reward `P`; otherwise, there will be no reward. We can show it in
    a payoff matrix diagram, as shown in `[Figure 6.1]`.


    ![Figure 6.1 Payoff Matrix without ε.](images/Fig06_01.jpg)


    **Figure 6.1 Payoff Matrix without ε.**


    The theoretical logic here is that if everyone wants others to vote truly, then
    their motivation is to vote honestly in respect for the majority, and that is
    why people believe and are willing to vote for those chose by majority; in this
    case, the system reaches a self-enhancing Nash equilibrium.


    Here, we can see if the individual votes for `0` and the result comes out, the
    majority vote is also `0` and then the individual can get the reward `P`; if the
    individual votes for `1`, the majority vote will be `0`, and the individual will
    not be rewarded. The other two cases are similar.


    Obviously, this is an ideal state. So, if there are dishonest or even evil voters
    in the system?


    Now, let’s see if there is an attack. Suppose an attacker with sufficient financial
    strength promises (if there is enough money, it will let others trust him). If
    the result of the vote is `0`, then the voter of the vote will be paid `P + ε`
    (the voter who gives the minority vote). If the result of the vote is `1` win,
    no fee will be paid (not voting for the majority vote). `[Figure 6.2]` shows the
    payoff matrix.


    ![Figure 6.2 Payoff Matric with ε.](images/Fig06_02.jpg)


    **Figure 6.2 Payoff Matric with ε.**


    For the voter: if the voter is rational, this multiple-choice question is very
    simple, because choosing to vote for `1` is the most in line with his own interests,
    because the worst result of the vote is to get the reward `P`. If you are lucky,
    you may get `P + ε` (`[Figure 6.2]`).


    For the attacker: once this cheating is successful, the attacker can achieve the
    goal without paying any fees. It is quite simple, if option `1` that was not recognized
    by the public is persuaded by many attackers to vote, and it becomes the final
    result, then according to the agreement, only if the result shows option `1` as
    a minority, `P + ε` can be obtained.


    It must be said that logically speaking, the `P + ε` attack is a very good way
    to attack. Just from the current point of view, this way still costs a lot, so
    the question is whether you really need to do this.


    ### 6.3.2 Protection from P + ε Attacks


    In fact, Vitalik, the founder of Ethereum, has already analyzed this problem since
    `2015` that was one of the important reasons for the planned upgrade of Ethereum
    to `Casper`. `Casper` has a lot of contents, and those who are interested can
    search online. For now, we just need to know that it is based on a `PoS` consensus
    mechanism.

    '
  trans: '


    ## 2. 硬叉的特点


    硬分叉具有以下特点：


    1. 它创建了一条新链。

    2. 不考虑旧节点与新节点之间的兼容性，并对交易数据和区块数据结构进行重大更改。

    3. 实现过程相对复杂（未升级节点的矿工将留在原始分支上）。

    3. 易于实现（它不需要你进行升级）。


    ## 6.2.3 分叉的重要性


    从目前的主流观点来看，对分叉的总体意见是积极的。由于软分叉对网络产生的改变有限，关注焦点在于硬分叉为整个生态系统带来的变化。


    ### 1. 分叉链可以添加新的技术特性


    最著名的比特币分叉应该属于“分叉出来的”比特币现金 `BCH`。这里的重要原因是比特易（Bitmain）团队与 Core 团队之间的恩怨。比特易目前是全球最大的矿池。由于在区块扩展和隔离认证上缺乏共识，比特币决定在网络区块高度达到
    `504,311` 之后，比特币现金 (`BCH`) 完成完成并执行了硬分叉。此后，`BCH` 更新了网络难度调整算法 `DAA`，并将区块容量从 `1M`
    增加到 `8M`。在 `BCH` 分叉后，出现了大量的分叉币，每种都有自己的更新特性。因此，我们可以看到硬分叉实际上是一个为整个生态系统带来新的过程。自从中本发明比特币以来，比特币的硬分叉行为没有任何限制。各种不同特征的分叉比特币在市场上是完全兼容的，并且人们选择了最适合自己的货币。


    ### 2. 分叉与社区的关系


    分叉是无法达成共识的结果。在上面的例子中，比特币社区无法达成一致，导致了比特币区块链的分叉。如果我无法完成分叉怎么办？遗憾的是，如果无法通过分叉来解决问题，可能会导致团队采取不同的道路。例如，我们所熟悉的
    BitShares 创始人 `BM` (`Dan Larimer`) 的案例，当无法与社区达成共识时，最终他只能离开团队。


    因此，无论从创新还是社区稳定性的来看，硬分叉的存在本身都具有合理性和积极意义。由于以太坊在处理高并发案例时性能较差，Vitalik 已经在考虑 `PoS`
    共识机制，但如果这可能会触及大量原始矿工的利益，最终会通过硬分叉解决吗？


    ## 6.3 P + ε 攻击


    在现实世界中，很难判断一个人是好人还是坏人，以及一个人是自私还是利他。在民主世界中，少数服从多数已经是一个普遍共识。但作为多数认可的结果是合理的吗？我们首先排除受情感影响的个体的非理性行为。我们假设每个人都为了自己的利益做出选择，然后发现即使是看似公平的民主投票系统也包含许多不公平甚至错误的地方。


    例如，经济学中的阿罗不可能定理主要包含两点：


    1. 即使在公平投票的情况下，投票也不一定能反映多数人的意愿。

    2. 同时投票很容易被主持人引导至想要的结果。


    为了避免此类问题，有必要投入资金而不是投票。如果公平的投票环境中存在问题且投票被操纵，那么显然最终普通大众将遭受损失。因此，这也是去中心化区块链网络的最大意义，让所有的账户和选举都公开透明。这也是人们追求的目标。


    同样，现实世界的经济规律与加密经济学规律相似。在区块链世界中，每个节点必须不断做出选择来确认哪个区块是真实的；这这也是一个投票过程。这个过程可能会被恶意节点利用，例如通过贿赂。这里提到的
    `P + ε` 攻击只是此类过程中的一种。


    ### 6.3.1 什么是 P + ε 攻击


    假设有一个简单的谢林博弈（Schelling game），用户通过投票来确定特定事实的结果，真相为 `(1)`，假为 `(0)`。


    此时，每个用户都可以根据自己的知识投票：`1` 或 `0`。如果用户的选项与投票中的多数意见一致，用户将获得奖励 `P`；否则没有奖励。我们可以在收益矩阵图中展示它，如`[图
    6.1]`所示。


    ![Figure 6.1 Payoff Matrix without ε.](img/Fig06_01.jpg)


    **图 6.1 不含 ε 的收益矩阵。**


    这里的理论逻辑是，如果每个人都希望他人诚实投票，那么他们的是为了尊重多数而诚实投票，这就是为什么人们相信并愿意为多数人选择的人投票；在这种情况下，系统达到了一个自增强的纳什均衡。


    在这里，我们可以看到如果个人投了 `0` 且结果出来，多数票也是 `0`，那么个人就可以获得奖励 `P`；如果个人投了 `1`，多数票将是 `0`，个人将不会获得奖励。其他两种情况也是类似的。


    显然，这是一个理想状态。那么，如果系统中存在不实甚至是邪恶的投票者呢？


    现在，让我们是否有攻击。假设一个拥有足够财力的攻击者承诺（如果钱足够，他会让其他人信任他）。如果投票结果为 `0`，那么该投票者将获得 `P + ε`（给出少数票的投票者）。如果投票结果为
    `1`，则不支付任何费用（不投给多数票）。`[图 6.2]` 显示了收益矩阵。


    ![Figure 6.2 Payoff Matric with ε.](img/Fig06_02.jpg)


    **图 6.2 含 ε 的收益矩阵。**


    对于投票者来说：如果投票者是理性的，这个多选择题非常简单，因为选择投 `1` 最符合自己的利益，因为投票最坏的结果获得奖励 `P`。如果你足够好，你可能会获得
    `P + ε`（`[图 6.2]`）。


    对于攻击者来说：一旦这种作弊成功，攻击者可以在不支付任何费用的情况下实现目标。这非常简单，如果未被认可的选项 `1` 被许多攻击者说服投票并成为最终结果，那么根据协议，只有当结果显示选项
    `1` 为少数时，才能获得 `P + ε`。


    必须说，从逻辑上讲，`P + ε` 攻击是一种非常好的攻击方式。从目前来看，这种方式仍然成本很高，所以问题是你是否真的需要这样做。


    ### 6.3.2 抵御 P + ε 攻击


    事实上，以太坊创始人 Vitalik 从 `2015` 年就开始分析了这个问题，这是计划将以太坊升级到 `Casper` 的重要原因之一。`Casper`
    包含很多内容，感兴趣的人可以在网上搜索。目前，我们只需要知道它是基于 `PoS` 共识机制的。


