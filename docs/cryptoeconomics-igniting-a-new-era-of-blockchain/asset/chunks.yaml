- raw: 'It’s no secret that free things make people feel good. “Zero” is not just
    a special way of expressing prices, but can also evoke passionate emotions – a
    source of irrational excitement. If the unit price of a project’s token is reduced
    from 1 RMB to 5 JIAO, will you participate? Possibly yes. If it is changed from
    5 JIAO to free? Will you fight to reach for it? Definitely will!


    Zero cost is so irresistible, what is going on? Why this thing makes us so happy?
    After all, free is likely to cause troubles for us: what we didn’t intend to buy,
    or who didn’t ever want to buy, would become incredibly attractive as soon as
    it becomes free.


    Have you registered an exchange that you have never heard in order to get a free
    token and have real-name certification?


    The biggest problem of free tokens is that it lures you to struggle between it
    and another project – and leads you to make unwise decisions. If you think that
    the blockchain + Internet of Things has great potential for development, you want
    to invest in projects in this field. After you have read the white paper of a
    project, you feel that your team and technology are OK, but you have invested
    another one that looks a little bit worse than the previous one because it has
    an extra 30% discount. You give up a better choice and invest in a project that
    you didn’t want, which is a great deal!


    Why is it so tempting in the end? Why do we have an irrational impulse to get
    free things, even if you don’t really need them?


    Adam Ereli, an economist at the Massachusetts Institute of Technology, believes
    the majority of transactions have both positive and negative aspects, but freedom
    makes us forget the negative ones. Free tokens create an emotional impulse and
    let us mistakenly believe that the value of free items is much higher than its
    actual value. This may be due to human instinctive fear of loss, and the true
    temptation of free is associated with this fear. There is no obvious loss in choosing
    a free item, but if the item we choose is not free, there is a risk that we may
    make a wrong decision and suffer a loss. So, if we let us choose, we will try
    to get it for free as much as we can.


    Therefore, zero is not just a price, and the emotional impulse caused by free
    tokens is invincible. The price effect caused by zero is very special, it is unmatched
    by other figures.


    Why are the unit costs of many project crowdfunding increasing over time? For
    example, in the first week of the project, there is a 40% discount, it is decreased
    by 10% every week until the offer is no longer offered, and this is the use of
    free psychology to encourage investors to get in as soon as possible. And if you
    find this project in the fourth week and know the previous offers, then, even
    if you are interested in it, you are likely to choose to give up.


    Let’s give a simple example. A project (more reliable) is in the promotion period.
    After you register, you have two choices, and you can only choose one: one is
    to get the token worth 100 yuan for free, and the other is a token worth 200 yuan
    – you need to pay 70 yuan. Think about it right away, which one do you choose?


    If you choose to get free 100 yuan token at once, then you are like the majority.
    If you count a little bit, you know that the token worth 200 yuan costs 70 yuan,
    so you earn 130 yuan. The income is definitely higher than the free 100 yuan token.
    Can you see the irrational behavior in reality?


    From the project side point of view, through a wide range of airdrops, people
    who can get tokens can be motivated to understand and promote the project, so
    that the tokens in their hands will increase, which will become a common promotion
    method.


    # [5.2.4   DAO Is Really the Main Form of Organization in the Future?](#ch00_fm04_contents.xhtml#rsec5_2_4)


    Recently, after careful research and analyses, you found a very good project,
    but according to some reasons, you don’t have the right channel to participate,
    so you find a friend with broad opportunities to ask for help.


    The friend readily agreed.


    So you transferred him ten ETHs (this is the biggest asset you can use), and then,
    the friend transferred the token of the project to you a lot and even paid the
    transfer fee.


    After 1 month, the project went on exchange and showed himself really good – there
    was a 50% increase in the cost price, so you made a profit.


    So, you invited your friend for dinner to thank him.


    You thanked him and took out the wallet: “This is 1000 RMB, please accept it”.


    How would the friends react? Would he be happy to accept the money, or would he
    smile very reluctantly? Even strike the table and leave?


    Why is it that in some similar situations, to thank with money is not as simple
    as just to say “thank you” orally?


    Social norms include good requests from each other. For example, when does this
    project start crowdfunding? How can I participate in this project? Social norms
    are hidden in our social nature and common needs. It is generally friendly and
    unclear, and does not require immediate returns. If you solve a problem for a
    person, it does not mean that he must help you to solve the problem right away,
    just like helping others to open the door – it brings joy to both of you and does
    not require immediate, equal return.


    The other world is very different from this: it is ruled by market norms. There
    is no friendship here, and the boundaries are very clear. The exchange here is
    black and white: wages, prices, rent, interest, and costs and profits. This relationship
    is not necessarily evil and vulgar. In fact, it includes self-reliance, innovation,
    and individualism, but it does mean interest comparisons and immediate payments.
    If you are in a world dominated by market discipline, you have to pay for it by
    work – it has always been like this.


    The fact that we live in both the social and market worlds is related to all aspects
    of our lives. From time to time, we need someone to help us move things, look
    after child for few hours, or receive a letter when we are out of town. How can
    we better motivate friends to help us? Or contribute to the community? It’s hard
    to make decisions—especially when there’s a danger of pushing relationships to
    market norms.


    The subtle balance of social norms and market norms is also evident in the business
    world. For example, many companies try to establish social norms with their employees,
    because they see the advantage of creating atmosphere with social norms. With
    the continuous development of technology, the boundaries between work and leisure
    are becoming more and more blurred. The manager of the company wants us to think
    about work on the way home, even in the shower. So, we are equipped with laptops
    and mobile phones to eliminate the boundaries between the workplace and the family.


    For companies, social norms have a greater advantage: they can make employees
    work enthusiastically and diligently, and care about the company. Employee loyalty
    to employers is often diminished under the market discipline, and social norms
    are the best way to motivate employees to remain loyal.


    Open-source software shows the potential of social norms. In Linux (an operating
    system) and other collaborative projects, you can post questions on any forum,
    and soon there will be many people responding to your questions. People in these
    online communities are happy to contribute time to society as a whole.


