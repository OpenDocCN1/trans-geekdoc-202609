- raw: 'In fact, a close review of the history of the development of Chinese mining
    machine manufacturers in the early years can show that there is a great similarity
    with the current ICO boom. There also have been various kinds of chaos such as
    postponed deliveries, scams, and illegal fundraising, which were checking the
    credibility of people in the industry. Yang Haipo, the founder of Viabtc, once
    sighed: “There are a lot of mining machines manufacturers which existed at the
    same time with Bitmain, but later on they all got into bankruptcy. Mining machine
    manufacturing requires coordination of procurement, supply chain, logistics and
    other aspects. The success of Bitmain shows that Wu Jihan is an excellent ‘steersman’
    of the company”.


    On February 24, 2018, CNBC quoted analytics company Bernstein that Bitmain’s revenue
    in 2017 was as high as $3 billion to $4 billion, equivalent to Nvidia’s last year’s
    profit. The Bernstein’s analysts mentioned in their report: “But Bitmain achieved
    this in merely 4 years, while it took Nvidia 24 years to get here”.[³](#ch02.xhtml#fn2_3)


    The report “Bitmain madly earned $3 billion, and it rivals Nvidia” has occupied
    the headlines of various traditional media and blockchain media in China and abroad
    for a while. This article sparked a discussion about whether the mining industry
    had a huge profit problem and divided it into two groups with clear positions.
    One group insisted that Bitmain is monopolizing the mining machine market and
    is trying to control bitcoin; the other group embraced Bitcoin, emphasizing that
    this is the result of market competition.


    Huang Shiliang (official WeChat account is Lightning HSL), a well-known blockchain
    educator in China, believes that “the more expensive the mining machine, the better
    it is. The more expensive is the price, the more it indicates the contribution
    of Wu Jihan to this industry”. But he also admitted that Bitmain is now a “unicorn”
    in the mining industry. Analyst Berstein estimates that Bitmain occupies a 70%–80%
    share of the Bitcoin mining machines and ASICS chip market.


    For this reason, the community called for the changes in the consensus algorithm,
    hoping that more miners will participate and break the monopoly of Bitmain.


    Can you defeat this unicorn only by modifying the consensus algorithm?


    Zhu Fa, co-founder of Poolin, believes that the changes in bitcoin algorithm are
    a pit: “First of all, if the BTC does not use SHA256 (hash algorithm), then the
    SHA256 computing power will immediately switch to other currencies with the same
    algorithm, such as BCH, SBTC. As a result, the BTC holder would be ‘trapped’.
    Secondly, after the algorithm is changed, basically the first thing is to make
    a new algorithm for the mining machine. So BTC miner has to re-purchase the mining
    machine. Miners will suffer losses. Thirdly, if ASIC-unfriendly algorithms are
    used as Monero and Ethereum do, it will make community resources and value flow
    towards other currencies, such as Monero and Ethereum. As a result, BTC holders
    would suffer losses”.


    Vitalik Buterin, a founder of Ethereum, tweeted a hybrid PoW/PoS system.[⁴](#ch02.xhtml#fn2_4)


    Vitalik wasn’t the first to propose this hybrid consensus mechanism of PoW+PoS.
    As early as in 2012, a geek with pseudonym Sunny King invented Peercoin and first
    adopted the Proof-of-Stake (PoS) mechanism to maintain network security.


    # [2.4   PoS (Proof-of-Stake) Mechanism](#ch00_fm04_contents.xhtml#rsec2_4)


    PoS is Proof-of-Stake. Stake means rights and interests, and as to the interests,
    each holder is a stakeholder. With the PoW mechanism, consensus is reached when
    someone has completed the workload and update the ledger. With the PoS mechanism,
    token holders with the largest tokens have more voices in the system. The latter
    is obviously more efficient than the former and can save a lot of power.


    Therefore, Ethereum also planned to switch from PoW mechanism to PoW+PoS.


    At this level, whales have more sayings in the PoS mechanisms than simple users.
    It seems rather unfair. This is like when a company makes a decision, the final
    decision is up to shareholders who has more equities. If so, how do you attract
    more new people to participate?


    Vitalik said that PoW has the same problem of insufficient attraction for new
    users. He suggested new users start with Dapps like CryptoKitties to participate
    in the system.


    This answer does not seem to be convincing. Dapps like CryptoKitties can be developed
    in Ethereum, and they could also be developed and applied in Bitcoin. So, which
    one is more attractive to new users?


    As we mentioned above, Bitmain made $3 billion–$4 billion in 2017, and it was
    achieved in 4 years, while it took Nvidia 24 years. I believe that many people
    would be attracted by the lure of huge wealth and are eager to tap into this industry.
    Japanese Internet giant GMO is working on a 7 nm mining chip; Samsung, a leading
    electronics company in South Korea, is also producing ASIC chips and supplies
    products to the Chinese mining companies.


    Therefore, when we discuss the monopoly of Bitmain, we must not ignore the fact
    that the market is constantly evolving, and there always will be new companies
    to compete with Bitmain. But can PoS mechanism evolve in this way?


    There is “resource curse” theory in the economics. It means that rich natural
    resources may rather be a “curse” of economic development than a “blessing”. Under
    the PoS mechanism, no matter how the market evolves, big whales can always get
    more rewards if they can find the way to remain an upper hand. It’s a dead end
    that the rich get richer and the poor get poorer. This kind of consensus approach
    can lead to strong centralization, which seems to be contrary to the decentralized
    spirit of the blockchain.


    # [2.5   LPoS (Leased Proof-of-Stake) Mechanism](#ch00_fm04_contents.xhtml#rsec2_5)


    It’s the same situation as with PoW mechanism; miners with less computing power
    can’t compete with miners own huge hashrate. With PoS mechanism, users with less
    tokens can’t compete with the big token holders for the right to record on the
    ledger, so they lack motivation to operate on the network nodes.


    This means that the entire network is only maintained by a few big whales. Only
    if there are more network nodes, more people participate, and the network can
    be more secure, so it is necessary to encourage small players to participate.
    Leased Proof-of-Stake (LPoS) allows simple users to lend their own coins to other
    nodes, increasing the weight of this node in the network. If the node can add
    the transaction to the public ledger, the proceeds will be shared to the original
    holder in an exact proportion.


    # [2.6   DPoS (Delegated Proof-of-Stake) Mechanism](#ch00_fm04_contents.xhtml#rsec2_6)


    DPoS is a delegated Proof-of-Stake mechanism. DPoS is based on the PoS, and there
    is one more option added – being “delegated”. Those who can get the right to (record
    on the ledger) are elected by the community and are rotated. This is similar to
    the National People’s Congress (NPC) system. We vote to select those who can represent
    the interests of the community as a whole, and if the representative does not
    perform well (e.g., do not record on time), we can also replace him. DPoS mechanism
    is relatively more decentralized compared with PoS mechanism.


    In fact, all mathematical programs are the simulations of the real world, and
    this mechanism of representative elections is the best mechanism that is proved
    to be the best in work. We can regard the elected representatives as “elites”,
    and this mechanism can be regarded as an elite agent system.'
