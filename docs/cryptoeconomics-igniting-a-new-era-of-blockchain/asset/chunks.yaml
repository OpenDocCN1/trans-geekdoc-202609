    Under the mechanism of zero-knowledge proof, only the transaction amount is disclosed
    to the counterparty in the personal information, and all other information is
    known only for you. But why is it good? Here, we have to talk about the trading
    mechanism of Bitcoin. We know that in the Bitcoin network, your public key is
    open to everyone, which means that once your address is exposed, in theory everyone
    can know how much money do you have there. Moreover, it will be not only the deposit
    at this address, but also the deposits of all addresses that have been trading
    with this address. After all these descriptions, are you be able to feel the seriousness
    of the problem here?


    The WannaCry virus incident in 2017 has caused many victims to pay bitcoin to
    redeem their files. We can imagine that if hackers specifically attack and exploit
    addresses in the future, it will cause even greater losses. Therefore, if you
    want to store a lot of bitcoins, unless you never connect to the Internet with
    this address; you will always be tailed. Privacy of your bitcoins has become an
    important issue. Zero-knowledge proof can solve this problem well, and unless
    you disclose it, the payee cannot know your sending address and identity.


    From the perspective of cryptoeconomics, there are two contradictions that are
    difficult to reconcile. First, the ledger disclosure of the blockchain can better
    form a consensus. Second, if an address is stolen, a certain clue can always be
    found through the common search of the parties. However, once the sending and
    receiving addresses are hidden, in case of asset theft, there is basically no
    way to trace them. How people choose is still unknown nowadays, and freedom and
    responsibility is a problem that everyone needs to think about.


    # Summary


    Human beings are constantly pursuing freedom and equality. For the first time,
    the emergence of Bitcoin gives almost everyone the freedom to control their wealth
    and create wealth equally. But this premise is to have security as a guarantee,
    and no one will give up security for freedom. We discussed several major security
    issues that happened in the current blockchain asset world. These are not all
    of them, and there may be more threats in the future.


    The threat we encounter may come from technology and possibly from system. We
    have to jump out of the limitations of a single technical thinking, and it is
    a reasonable approach to consider the various components of the entire cryptoeconomics
    circle, and how to balance the power, responsibility, and profit in all aspects
    of this cryptoeconomics Eco circle is a long and serious test for it.


    The participation of this system is following:


    * ■ Code creation (open source): how to use positive incentives in order to motivate
    software writers not to conduct malicious behavior?

    * ■ Maintenance of the project: How to make the maintainer escape centralization
    while guaranteeing its own interests?

    * ■ System security maintenance (miners): How can we make reasonable rewards and
    a larger distributed structure?

    * ■ Consumer: How to make it easy for users to use and keep assets safe?

    * ■ Investors and Communities: How to reduce speculation and create a positive
    community culture?


    Therefore, this ideal system allows the parties to restrict and develop each other
    through reasonable design, and at the same time, the perpetrators outside the
    system cannot gain benefits from their own acts of evil.


    From now on, the Bitcoin network is a reasonable balance of resources. The important
    point is that the network is simple enough, so external attacks are hard to come
