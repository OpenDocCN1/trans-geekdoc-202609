    When the letter is signed by six generals, an agreement to “attack” is reached.
    In comparison with the verbal agreement, the written one can help you to find
    the source of information and to reveal the generals who have agreed to attack.
    If they attack together, and those who have signed to attack will retreat during
    the attack, then the general is a traitor and he will be put to death during his
    retreat.


    But here is also a problem with this written agreement: how to ensure that only
    one general at an exact time attaches his own content after the letter. In other
    words, after the letter of General No. 1 is sent out, only one general among General
    Nos. 2 to 10 can attach his signature and pass it on to another general.


    In real life, there can be more than ten nodes in a distributed network. So how
    is a consensus mechanism designed in order to have a large number of nodes “sign”
    the order?


    To design such a consensus mechanism, we must follow the basic design principle
    of distributed networks. This principle is called `CAP` (Consistency, Availability,
    and Partition Tolerance) theory.


    ## 2.2 CAP Theory


    > I like fish, and I also like bear’s paws. If I cannot have the two together,
    I will let the fish go, and take the bear’s paws.


    These are famous words by Chinese Philosopher Mencius that tells us there are
    hard choices to make in our lives. In distributed systems, `CAP` theory is the
    “fish and bear’s paw” problem that system designers can’t escape.


    `CAP` theory was proposed by the famous computer scientist Eric Allen Brewer in
    the late 1990s. Specifically, it says that `Consistency`, `Availability`, and
    `Partition Tolerance` cannot exist together in a distributed system. `CAP` theory
    advocates that any data sharing system in the network can only have maximum two
    of the following three conditions:


    * `Consistency (C)`: all nodes access the same copy of the latest data, and all
    applications can access the same data at any time.

    * `Availability (A)`: healthy nodes respond to the client’s requests within a
    limited time, and there is no need to wait all the time.

    * `Partition Tolerance (P)`: so-called partition means that the system cannot
    achieve data consistency within the time limit. Once this happens, a choice between
    `C` and `A` for the current operation must be made. You have to ensure that the
    cluster can continue to serve if some nodes in the cluster are disconnected.


    `Figure 2.1` represents the relationship between these three elements.


    ![Figure 2.1 CAP Theory.](images/Fig02_01.jpg)


    **Figure 2.1 CAP Theory.**


    As shown in the figure, to satisfy `CP`, in the case of network partitioning,
    in order to achieve `C`, the request can only wait for a while, and as the result
    won’t achieve `A`; if `CA` is to be achieved, the node status must be consistent
    within the time limit, and the network partition must not emerge, so it cannot
    satisfy `AP`. To satisfy `AP`, the separated nodes are serving simultaneously
    but cannot communicate with each other, which will result in inconsistent states
    and won’t satisfy `C`.


    But in fact, there is no distributed system that can avoid network failure (`P`).
    Therefore, system architects often have to choose between `C` and `A`.


    ## 2.3 PoW (Proof-of-Work) Mechanism


    In the past decade since the birth of Bitcoin, as the number of network nodes
    has increased, the cost of launching attacks has become more and expensive, and
    the `PoW` mechanism has been proven to be safe and reliable. However, in order
    to maintain the consistency of the ledger (`C` in `CAP` theory) and the system
    operation stability in case of such problems as a node drop in network (`P`),
    bitcoin network sacrifices availability (`A`) to some extent. Some people also
    call this problem “latency”, the delay problem. The network needs 10 minutes to
    wait, and there should be enough transactions to be confirmed before the account
    can be updated. If Bitcoin is going to get `AP`, the client should accept the
    transaction as soon as it is added to the blockchain, so that it does not need
    to depend on other nodes, and so that is very useful. But there is a risk that
    the remaining nodes may reject the transaction and thereby sacrifice the consistency.


    The core idea of Satoshi Nakamoto’s `PoW` design is that you can be a traitor,
    you can do evil, you can make false accounts to destroy the stability of the entire
    network, but you must bear the relevant cost. Under the `PoW` mechanism, a person
    must complete more than 50% of the workload in the entire network in order to
    start an attack. This cost is enormous. It’s better to follow the rules honestly
    and earn some bitcoin.


    In addition, many people think that the most important thing about money is safety.
    They believe that giving a lot of works to solve mathematical problems in order
    to ensure the safety of Bitcoin in the `PoW` mechanism is a wasteful behavior.
    Here, we will talk about three major issues of the `PoW` mechanism, which are
    often discussed by the community.


    The answer can be found in whitepaper that de in mining can get rewards. Each
    ledger update represents a reward of 50 bitcoins, which is halved every 4 years.
    There were 50 in 2009–2012, 25 in 2013–2016, and 12.5 will be in 2017–2020. This
    set of economic incentives allows more miners to participate, constantly update
    the ledger, and jointly maintain the stability of.


    ### 2.3.1 Problem of PoW 1: Waste of Resources


    Iceland is known as a “miner’s paradise”. The temperature there is cold, a computer
    server can be naturally cooled, and the renewable energy of geothermal and hydroelectric
    power plants makes the electricity price lower; in that way it attracts bitcoin
    mining companies from all over the world.

