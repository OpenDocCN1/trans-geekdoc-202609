    In fact, if any consumer behavior is raised to the level of the society, the problem
    will be more complicated.


    # 2.3.2 Problem of PoW 2: Environmental Problem


    Last December, CNNMoney reported that some experts said that Bitcoin mining consumes
    a lot of energy and may be harmful to the environment. For example, meteorologist
    Eric Holthaus believes that Bitcoin mining is slowing the transition of fossil
    fuels to renewable energy and eventually consumes more electricity than is available.
    Environmentalists are not outdone as well, and they are afraid that bitcoin mining
    will seriously harm global efforts to combat climate change.


    In January, Credit Suisse in its latest report mentioned that bitcoin mining is
    unlikely to cause an “environmental Armageddon”. That report said, “it is a mistake
    to project miners’ power consumption lineally, as the industry will likely develop
    hardware and practices that are more energy-efficient in a bid to gain a competitive
    advantage. The report noted that this phenomenon occurred among both marijuana
    growers and data center operators during high-growth periods for these industries”.


    Of course, the argument of polluting the environment can provide new business
    opportunities for the industry. Now companies have begun to research green mining.


    Last December, I received an email from the United States. The company said they
    were researching green mining and asked me for contact. I checked their official
    website, but I did not find anything. In February 2018, I saw many companies providing
    green mining solutions. According to the report, the cost of these machines is
    higher than traditional hydropower. Therefore, even if you use green mining, the
    result will be disastrous.


    # 2.3.3 Problem of PoW 3: Centralization of Power


    Bitcoin has experienced multiple “deaths” since its birth. Besides external factors,
    we must realize that miners would suffer great if their mining machines were delayed
    in shipping while hashrate increases in the network. The `PoW` mechanism is also
    applied by Ethereum.


    In the fierce competition, Wu Jihan’s technical partner Micree Zhan independently
    developed the first generation of Bitmain Antminer machines S1 in less than 6��months
    after their company had been established. The energy consumption of the same computing
    power was half less in comparison with the previous mining machine. At the beginning
    of 2015, Zhan Ketuan developed and launched the fifth-generation Bitmain Antminer
    S5, which established the leading position of Bitmain in the mining market.


    ```

    Figure 2.2 Hashrate Distribution


    ![Figure 2.2 Hashrate Distribution. (Note: both Antpool and BTC.com belong to
    Bitmain).](images/Fig02.jpg)

    ```

