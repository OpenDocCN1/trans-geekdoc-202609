  trans: '

    免费的东西让人感觉很好，这并不是秘密。“零”不仅是一种表达价格的特殊方式，还能唤起强烈的情绪——一种非理性兴奋的源。如果一个项目的代币单价从 `1 RMB`
    降到 `5 JIAO`，你会参与吗？可能会。如果从 `5 JIAO` 变成免费呢？你会力争获得吗？绝对会！


    零成本是如此不可抵拒，这到底发生了什么？为什么这个东西能让我们如此开心？毕竟，免费很可能会给我们带来麻烦：我们本不想买的东西，或者根本没想过买的东西，一旦变成免费，就会变得极具吸引力。


    你是否为了获得一个免费代币并进行实名认证，而注册了一个从未听过的交易所？


    免费代币最大的问题在于，它诱导你在它和另一个项目之间挣扎——导致你做出不明智的决策。如果你认为区块链+物联网有巨大的发展潜力，你想投资该领域的项目。在读完一个项目的白皮书后，你觉得他们的团队和技术没问题，但你投资了另一个看起来比上一个差一点的项目，因为它有额外的
    `30%` 折扣。你放弃了更好的选择，投资了一个你并不想要的项目，这真划算！


    为什么最后来是如此诱人？为什么我们会有获得免费东西的非理性冲动，即使你并不真正需要它们？


    麻省理工学院的经济学家亚当·埃利（Adam Ereli）认为，大多数交易都有正负两面，但免费让我们忘记了负面因素。免费代币创造了一种情感冲动，让我们错误地认为免费物品的价值远高于其实际价值。这可能是由于人类对损失的本能恐惧，而免费的真正诱惑与这种恐惧有关。选择免费物品没有明显的损失，但如果我们选择的不是免费的，就存在做出错误决策并遭受损失的风险。所以，如果让我们自己选择，我们会尽可能尝试免费获取它。


    因此，“零”不仅仅是一个价格，免费代币引起的情绪冲动是无敌的。零所引起的价格效应非常特殊，其他数字无法比拟。


    为什么许多项目众筹的单位成本随着时间的推移而增加？例如，在项目的第一周有 `40%` 的折扣，每周减少 `10%` 直到优惠结束，这是利用免费心理鼓励投资者尽早入场。如果你在第四周发现这个项目并知道之前的优惠，那么即使你对此感兴趣，也可能选择放弃。


    让我们举个简单的例子。一个（更可靠的）项目正处于推广期。在你注册后，你有两个选择，且只能选择其一：一个是免费获得价值 `100 yuan` 的代币，另一个是价值
    `200 yuan` 的代币——你需要支付 `70 yuan`。想想，你会选哪一个？


    如果你选择直接获得免费的 `100 yuan` 代币，那么你就大多数人一样。如果你稍微算一下，你会发现价值 `200 yuan` 的代币花费 `70 yuan`，所以你赚了
    `130 yuan`。收益显然高于免费的 `100 yuan` 代币。你能在现实中看到这种非理性行为吗？


    从项目的角度来看，通过广泛的空投，能够获得代币的人会被激励去理解和推广项目，使他们手中的代币增值，这将成为一种常见的推广手段。


    # 5.2.4 DAO 真的是未来的组织形式吗？


    最近，经过仔细的研究和分析后，你发现了一个非常棒的项目，但由于某些原因，你没有参与的渠道，于是你找了一个机会广阔的朋友寻求帮助。


    朋友爽快地答应了。


    你转给了他 `ten ETHs`（这是你能使用的最大资产），然后，朋友向你转了大量的项目代币，甚至支付了转账费。


    `1 month` 之后，该项目上线并上涨了 `50%`，于是你请他吃晚餐：花了 `1000 RMB`。


    朋友会如何反应？是否在某些情况下，用金钱感谢你并不像简单的“谢谢”那么容易？


    另一个世界完全不同：它由市场规范支配。这里没有友谊，界限非常清晰。这里的交换是工资、租金、利息和成本。这种关系并不意味着邪恶或低俗。事实上，它包含了自力更、创新和个人主义，但也意味着利益和即时支付。如果你处于一个由市场纪律主导的世界，你必须通过工作来支付——一直一直是如此。


    我们生活在社会世界和市场世界中的这一事实与我们生活的方方面面有关。我们有时需要有人帮忙搬东西、看几个小时孩子，或者在我们不在家时收一封信。我们如何能更好地激励朋友帮助我们？或者为社区做出贡献？这很难决定——尤其是当存在将关系推向市场规范的风险时。社会规范与市场规范之间的微妙平衡在商业世界也显而易见。例如，许多公司试图与其员工建立社会规范，因为他们看到了用社会规范营造氛围的优势。随着技术的不断发展，工作与休闲之间的边界变得越来越模糊。公司经理希望我们在家的路上思考工作，甚至在洗澡时。因此，我们配备了笔记本电脑和手机来消除办公室与家庭之间的边界。


    对于公司来说，社会规范具有更大的优势：它们能让员工热情勤奋工作并关心公司。员工对雇主的忠诚度在市场纪律下往往降低，而社会规范是激励员工保持忠诚的最佳方法。开源软件展示了社会规范的潜力。在
    `Linux`（操作系统）和其他项目中，你可以在任何论坛上发布问题，很快就会很多人回答你的问题。这些在线社区的人乐意为整个社会做出贡献。

    '
