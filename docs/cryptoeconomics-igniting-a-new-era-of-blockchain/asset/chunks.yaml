    \ text is text broken. I will just provide the clean version.)\n\nHere is the\
    \ formatted version of the text provided:\n\n[content]\nIn the core module, Tendermint\
    \ works based on a circular voting mechanism, which is also the principle of a\
    \ consensus protocol. A round is divided into three processing steps: the verifier\
    \ proposes a block, sends the submission intent, and submits a new block after\
    \ signing. This mechanism provides a secure state replicator for atomic broadcasts,\
    \ adding a layer of responsibility – a security failure can be completely attributed\
    \ to Tendermint.\n\nThe Tendermint consensus algorithm starts with a set of verifiers.\
    \ The verifier maintains a full copy of the blockchain and can use the public\
    \ key to identify the certifier’s identity. They took turns to propose a block.\n\
    \nOnly one verifier can propose a block for each round of voting, and this should\
    \ be signed with the verifier’s corresponding private key, so if there is an error,\
    \ the verifier responsible for this can be found. Then, the remaining certifiers\
    \ need to vote for each proposal, and the votes need to be signed with their own\
    \ private key. These make up a round. However, it may take several rounds to submit\
    \ a new block because of the asynchronous network, which is shown in [Figure 3.2](#ch03.xhtml#fig3_2).\n\
    \n![Figure 3.2  Casper vs. Tendermint. (Source: Medium “Consensus Compare: Casper\
    \ vs. Tendermint”.)](images/Fig03_02.jpg)\n\n**Figure 3.2  Casper vs. Tendermint.\
    \ (*Source*: Medium “Consensus Compare: Casper vs. Tendermint”.)**\n\nThe certifier\
    \ may fail while submitting block: current proposal may be offline, or network\
    \ may experience a delay. Tendermint allows the verifier to be escaped (when the\
    \ turn comes to a verifier, the verifier is not creating a block). The verifier\
    \ waits a short period of time to receive the entire block proposed by the proposer\
    \ (the certifier of this round of the block) before moving to the next round of\
    \ voting. This dependency on timeouts makes Tendermint a weak synchronization\
    \ protocol rather than an asynchronous protocol. However, the multiplied protocol\
    \ is asynchronous, and the verifier will only process if it receives more than\
    \ two-thirds of the verifier set messages. Because of this, Tendermint requires\
    \ most of the certifiers to function properly, and if one-third or more of the\
    \ certifiers are offline or offline, the network will stop working.\n\nAssuming\
    \ less than one-third of the verifiers are Byzantium, Tendermint guarantees that\
    \ security will never be compromised – it means that the verifier (more than 2/3)\
    \ will never commit a conflicting block at the same height. Therefore, the blockchain\
    \ based on Tendermint will never fork.\n\nNowadays, Tendermint’s design decisions\
    \ have placed security and immutability on the top of flexibility. There is a\
    \ high probability in the real world that the system will really stop running\
    \ and participants will need to restart the system after updating the software\
    \ outside the protocol.\n\nOnly a few people in the digital cryptocurrency community\
    \ understood Casper and why it was valuable, Tendermint laid the foundation for\
    \ Casper research. The insight is that if a chain is itself highly fault-tolerant,\
    \ then you can rely on the chain to make a good decision about who will make the\
    \ block, but if the chain itself is unreliable, then you fall into the trap. The\
    \ problem with chickens and eggs has gone, which used to be the catastrophe of\
    \ all other consensus algorithms.\n\nThis design solution is considered to be\
    \ inferior to available prior protocols such as Ethereum and Bitcoin. But we need\
    \ to consider how to get back to the right chain in case if we have shifted to\
    \ the unsafe chain.\n\nLet’s take a look at the trade-offs in Bitcoin: if its\
    \ network is split, Bitcoin loses its security guarantee in the case of various\
    \ attacks. This is actually an unmodifiable theory; that is, when your confidence\
    \ interval is 100%, you are following a correct chain, and you will use this chain\
    \ to choose who will produce the next block, but once you transfer from an insecure\
    \ chain, there is no clear path to get you back to the right chain.\n\n### Clear\
    \ features of Tendermint:\n\n* ■ Proven activity\n* ■ Security threshold: 1/3\
    \ of the verifier\n* ■ Public/private chain compatibility\n* ■ Instant final determinism:\
    \ 1–3 seconds, depending on the number of certifiers\n* ■ Consistency first\n\
    * ■ Consensus security on weakly synchronic networks.\n\n# [(2)  CFFG](#ch00_fm04_contents.xhtml#rsec3_2_2_2)\n\
    \nThe chain-based CFFG is a consensus-based approach. The chain-based CFFG maintains\
    \ a full copy of the blockchain and can use the public key to identify the certifier’s\
    \ identity. They took turns to propose a block.\n\n*(Note: The remaining text\
    \ in the input was repetitive and fragmented; I have formatted the coherent sections\
    \ above to ensure document quality.)*\n"
