- raw: "A digital signature roughly consists of two algorithms: one is signing using\
    \ the private key to process the hash value of the message and the other is verification\
    \ using the public key to verify the authenticity of the signature. Rivest–Shamir–Adleman\
    \ (RSA) and Digital Signature Algorithm (DSA) are the two most popular digital\
    \ signature mechanisms.\n\nLet’s imagine in real life, why do we sign, what is\
    \ the role of signatures, and what are their characteristics?\n\n*   ■ Verifiability:\
    \ this signature should prove that it is indeed your handwriting.\n\n*   ■ Unforgeability:\
    \ no one else can forge your signature.\n\n*   ■ Non-repudiation: if you sign\
    \ your document with your own signature, the validity of the file will not be\
    \ reclaimed, and you can’t claim that someone else is signing you instead.\n\n\
    However, in real life, no matter how complicated the signature is, there is a\
    \ possibility of being forged. Because you can’t really verify the validity of\
    \ a signature with a simple visual aid (such as handwriting identification), it\
    \ is neither efficient nor reliable.\n\nCryptography gives us a solution to solve\
    \ problems through public and private keys. Let’s take a look at how these two\
    \ keys work and how they contribute to the cryptocurrency system.\n\nLet’s assume\
    \ that there are two people, A and B. A wants to send some very important data,\
    \ and B wants to identify that this data really comes from A; they can achieve\
    \ this by using A’s public and private keys. The public key, as its name suggests,\
    \ refers to the public key that can be obtained by anyone. The private key is\
    \ a key owned by the individual and cannot be shared with others. Also, it is\
    \ not feasible to determine a public key by someone’s private key.\n\nLet’s return\
    \ to the topic of A and B sending the data. If they want to use a key to exchange\
    \ information, how will they do it exactly?\n\nLet’s assume that A wants to send\
    \ the message M. A has a private key K1 and a public key K2. Then, when he sends\
    \ the message to B, he encrypts the message with the private key, and the message\
    \ becomes K1(M). When B receives this message, he can use A’s public key to get\
    \ the information, K2K1(M), so that the original information M can be obtained.\n\
    \nThe above process is clearly shown in [Figure 1.3](#ch01.xhtml#fig1_3).\n\n\
    ![Figure 1.3   Information Exchange using Public and Private Keys.](images/Fig01_03.jpg)\n\
    \n**Figure 1.3   Information Exchange using Public and Private Keys.**\n\nLet\
    \ us re-examine the features of digital signatures in cryptography through the\
    \ examples of signatures in everyday life.\n\n*   ■ Verifiability: if the encrypted\
    \ information can be decrypted with Al’s public key, it can be approved 100% that\
    \ A sent the message.\n\n*   ■ Unforgeability: if there is another person C, intercepting\
    \ this message and sending a message of his/her own with its own private key,\
    \ then A’s public key will not be able to decrypt it, because A’s public key can\
    \ only be used to decrypt the information encrypted with its own private key.\n\
    \n*   ■ Non-repudiation: similarly, if A claims, “I didn’t send the message, it’s\
    \ sent by C”, but B can use A’s public key to decrypt the information, which proves\
    \ that A is lying. In this way, A can’t recall the information he sent before,\
    \ and thus can’t deny it.\n\n# [1.2   Basic of Economics](#ch00_fm04_contents.xhtml#rsec1_2)\n\
    \nEconomics is a complex concept. In this book, we only describe some economic\
    \ theories that are related to cryptocurrency and blockchain.\n\nThe difference\
    \ between blockchains and other decentralized peer-to-peer systems is that it\
    \ provides users with financial and economic incentives to complete a job. Like\
    \ other solid economic systems, we all need people to get the job done through\
    \ incentives and rewards. Similarly, there are punishments for the miners who\
    \ act unethically or do not perform their duties.\n\n# [1.2.1   Incentives](#ch00_fm04_contents.xhtml#rsec1_2_1)\n\
    \nThe blockchain uses the following two combinations of incentives:\n\n*   ■ **The\
    \ first type of incentive combination**: Token + Privileges\n\n    Token: cryptocurrency\
    \ is distributed as a reward to participants who are highly active and contribute\
    \ to the blockchain.\n\n    Privileges: participants can get the right to make\
    \ a decision, which gives them the right to collect rent. For example, miners\
    \ who add new blocks can become temporary decision-makers for creating new blocks,\
    \ will become dictators of a new block for a short term, and will have the power\
    \ to decide which transactions have to be added to the block. They can charge\
    \ a fee for all transactions included in the block.\n\n*   ■ **The second type\
    \ of incentive combination**: Reward + Punishment\n\n    Reward: good participants\
    \ can get monetary rewards or the right to make decision after fulfilling the\
    \ work.\n\n    Punishment: bad participants must pay a currency fine or lose their\
    \ rights because of their malicious behavior.\n\n# [1.2.2   Punishment](#ch00_fm04_contents.xhtml#rsec1_2_2)\n\
    \nJust like any other effective economic system, there are positive and negative\
    \ incentives in cryptocurrency. Imagine a matrix of profits shown in [Figure 1.4](#ch01.xhtml#fig1_4);\
    \ not only the profit of participants is very high, but the impact on society\
    \ is also very high.\n\n![Figure 1.4   Payoff Matrix of a Social System.](images/Fig01_04.jpg)\n\
    \n**Figure 1.4   Payoff Matrix of a Social System.**\n\nLet’s suppose that there\
    \ are two people, A and B, who are going to commit crimes. Now, according to the\
    \ income matrix, when they commit crimes, their returns are high. So they may\
    \ all choose to commit crimes; although this is logically plausible, it will have\
    \ a very bad social impact. If everyone in the world is driven by personal greed,\
    \ the world will become terrible. So, how should human beings deal with the situation\
    \ in which everyone chooses to do evil? The answer is to introduce a penalty mechanism.\n\
    \nLet’s suppose that we have a social system in which, whenever someone commits\
    \ a crime by taking 0.5 from the system, he/she losses 5 as penalties. So let’s\
    \ add the penalty factor to the income matrix above and then observe the changes\
    \ in [Figure 1.5](#ch01.xhtml#fig1_5).\n\n![Figure 1.5   Payoff Matrix of a Social\
    \ System with Penalty Factor.](images/Fig01_05.jpg)\n\n**Figure 1.5   Payoff Matrix\
    \ of a Social System with Penalty Factor.**\n\nAs it is shown in the figure, the\
    \ benefits have changed dramatically, and not committing crime is the best strategy.\
    \ Now, the cost of punishment is high, but society has lost 0.5 for public facilities.\
    \ This will lead to situations where no one is participating in the social system\
    \ anymore; what motivates everyone in the community to participate? The answer\
    \ is that punishment is a coercive measure for everyone, and anyone who does not\
    \ participate will also be punished. For example, police officers are supported\
    \ by taxes, so they can punish criminals, but the loss of public facilities will\
    \ be taken from the public in the form of taxes. Anyone who participates but does\
    \ not pay taxes will be considered a criminal and punished.\n\nIn the blockchain\
    \ world, any miners who do not follow the rules and mine illegally will be punished,\
    \ and they will be deprived of their privilege and bear the risk of being socially\
    \ excluded. Once the proof of equity is adopted, this punishment will become more\
    \ severe. By using simple game theory and punishment systems, miners can maintain\
    \ integrity.\n\n# [1.3   Supply and Demand](#ch00_fm04_contents.xhtml#rsec1_3)\n\
    \nUnder such incentives and penalties, how can cryptocurrency become valuable?\
    \ The reason why cryptocurrency and ordinary currency have value is basically\
    \ the same; that is, based on trust. When people trust a certain commodity and\
    \ give it value, it becomes a currency. This is why the French currency and gold\
    \ were valuable at first. Therefore, when a given commodity has a given value,\
    \ the value changes with the supply and demand relationship, which is the oldest\
    \ rule in economics.\n\nWhat are the relationships between supply and demand?"
