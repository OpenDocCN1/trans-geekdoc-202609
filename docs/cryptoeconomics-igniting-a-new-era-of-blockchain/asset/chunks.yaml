  trans: '


    在 FBA（联邦拜庭）中，没有守门员，也没有中心节点，单个节点可以决定应该信任哪些参与者。节点可以选择多个组，且单个节点的选择可能取决于系统之外的标准。例如，如果一家银行被认为声誉良好，那么其他节点上的所有交易都需要它的批准。


    法律实体之间的关系存在不同的状态：


    * ■ 有交集的法律实体：良好的法律实体共享其节点，导致不同法律实体之间出现节点重叠。

    * ■ 无交集的法律实体：当实体之间没有交集点时，我们就得到了无交集的法律实体。


    如果语料库（Corpus）不交集，例如，`Statute A` 批准了一份披萨订单声明，而 `Statute B` 批准了一份汉堡订单声明。由于它们可以独立地识别矛盾的陈述，不交集的语料库会对共识产生危害。


    那么，如何让节点做出更好的选择呢？


    FBA 系统中的每个节点都负责确保所选法律实体不违反法律实体交集规则。通常需要确认法定人数集群（quorum cluster）是否足够大，以及集群中的节点是否足够重要，以至于不会欺骗或为不同的人生成不同的信息，并危及他们自己的声誉。


    联邦投票：接受，确认。


    FBA 系统中的节点使用联邦投票技术来实现它们的协议。联邦投票技术用于引导 FBA 系统或一组共同工作的人达成共识。在 Stellar 的白皮书中，给出了以下示例：


    > 午餐共识


    > 为了详细描述对节点投票并在最终接受声明的同时允许系统达成一致的过程，让我们举一个许多人熟悉的例子。让我们来聊一组人对午餐吃什么进行投票。在这种情况下，人的名字就是节点，所有的食物选项都是节点需要引用的声明。


    > 莎莎（Vanessa）在一个公共办公室工作，那里有一大群人根据自己的意愿预订午餐。有很多选择，并不是每个人都会做出选择；当确定人数足够时，他们就会下单。


    > 莎莎和她的同事们决定使用基于 FBA 的 `SCP` 来解决这个问题。


    #### 初始投票


    > 我们假设 莎莎想吃披萨，但仍然需要保持开放态度，以防组中的大多数人选择了披萨以外的其他选项。


    > 投票是工作的准备，只发生在节点阶段。在联邦选举过程的第一步中，莎莎声称披萨是有效的，并承诺如果没有披萨，她将不会投票披萨以外的任何选项。除非有足够的同事为披萨投票，否则她可能会得到接受非披萨选项的结果。


    #### 接受（准入）


    > 幸运的是，存在法律实体交集，实体组可以影响其他节点。想象另一种情况，莎莎投票了汉堡。但请记住，投票只是准备。


    > 薇妮（Winnie）、安德鲁（Andrew）和伊娃（Eva）都在莎莎所在的法律实体中，他们可以停止接受汉堡的过程。一个 `v-blocking`（V 型）节点集包含莎莎所有实体组中的至少一个节点，并阻止了包含莎莎的法律文件中的所有行为，导致莎莎接受披萨。


    > 在以下情况下，莎莎实际上接受了披萨：


    > * 她从未接受过与披萨矛盾的声明。

    > * 每个 V 型限制集的成员都声明接受披萨，或者包含莎莎的每个集体成员也为披萨投票或声明接受披萨。


    #### 正式批准


    > 当每个法定人数成员都为披萨投票时，我们说该法律文件认可了披萨。节点不需要个人认可该声明。


    > 例如，斯特（Scott）经常依赖安德鲁和艾莉丝（Iris）来决定吃什么。他们是斯特的法律实体。如果他们三个人都为披萨投票，该实体就批准了披萨。


    > 同事可以为一个午餐选项投票，然后接受与自己的投票不同的午餐。投票披萨并不意味着午餐必须坚持吃披萨——只有在批准后，披萨才被接受为午餐。


    #### 确认


    > 配置是选举过程的最后一步，它将导致整个系统的一致协议。为了确保共识，节点之间交换确认消息。系统同意一个声明；一旦足够的消息传播并处理，无论之后发生了什么，每个活跃且无错误的节点将接受该声明。


    > 例如，伊娃声明她接受披萨并发送一条确认消息，`accept(pizza)`，这是“我已经接受了披萨”的缩写。


    > 当伊娃发送确认消息时，薇妮、安德鲁、格雷登（Graydon）以及伊娃法律文件中的其他人广播 `accept(pizza)`。


    > 这些消息可以说服另一个人接受披萨。在上面的示例中，如果莎莎反对披萨，例如，如果 V 型限制集接受了披萨，那么莎莎就接受披萨。这些人尽可能地说服更多的人，不断广播
    `accept(pizza)` 直到所有人都能接受披萨为止。


    > 法律文件对消息的后续确认让莎莎确认了披萨并实现了系统共识。公司订了披萨，大家都很开心。


    这个示例完整地阐述了 FBA 系统实现的整个过程。


    # 3.4 其他：Algorand 共识协议


    图灵奖获得者、麻省理工学院教授西维奥·米卡利利（Sivio Micali）设计了 Algorand 共识协议，这是一种新型加密共识机制，可以在极时间内验证交易并扩展到许多用户。Algorand
    确保用户永远不对已确认的交易产生分歧，即使某些用户是恶意的，或者网络临时分区。相比之下，现有的加密货币允许临时分叉，因此需要很长时间（大约一小时），最后才通过确认的数量来确保交易已确认。


    Algorand 使用新的 BA 协议协议在下一组交易中达到用户共识。为了将共识扩展到许多用户，Algorand 使用了一种基于可验证随机函数（VRF）的新机制，允许用户自检自己是否被选中参与
    BA 协议以授权下一组交易。在 Algorand 的 BA 协议中，除了私钥外，用户不保留任何私有状态，允许 Algorand 在发送消息后立即更换参与者。这可以缓解身份暴露后针对被选参与者的针对性攻击。


