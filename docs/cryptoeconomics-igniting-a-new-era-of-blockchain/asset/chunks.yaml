  trans: '


    当一些人不断探索算法时，另一些人指责 PoW 浪费能量，而 POS 机制已经实现。尽管支持 PoW 的人正试图维持它，但他们必须承认 PoW 消耗能量的事实。这种指控开启了另一个探索路径，如果你能找到一种既能维护区块链安全又能以其他方式产生价值的算法，那就是完美的。


    这种探索方向中最具启发性的结果是 Primecoin（质币）。它由 Sunny King（笔名）发明，他也开发了 Peercoin。质币算法的核心思想是在进行哈希操作的同时寻找大质数。为什么要寻找质数？因为质数在数轴上稀疏且分布不均匀，在数轴上寻找质数只能盲目搜索和探索，这正是
    PoW 的特性。


    PoW 的另一个要求是易于验证。在这种情况下，人们在数百年的探索后取得了一些成果。Primecoin 通过两种方式进行测试：首先通过费尔马测试（Fermat
    test），然后通过欧拉-拉格朗日-利普希茨测试（Euler–Lagrange–Lipschitz test）；如果两项测试都通过，就可以被认为是质数。需要指出的是，这种方法不能保证通过数百次测试的都是质数，但这并不影响系统的运行。即使测试结果错误，只要每个节点都将其视为质数，系统就能运行。


    Primecoin 实际上是在寻找坎宁链。


    坎宁哈链有三种特定类型：第一类坎宁哈链、第二类坎宁哈链和双孪生链（bi-twin chain）。


    什么是坎宁哈链？让我们以第一类坎宁哈链为例解释。


    坎宁哈链中的每个数字都是前一个数字的两倍减一，例如：


    - `2, 3061, 6121, 12241, 24481`


    序列中的下一个数字 `48961 (24481 * 2 − 1)` 不是质数，因此这条坎宁哈链的长度为 5，Primecoin 的目标是探索更长的坎宁哈链（所有三类均可）。


    这里最重要的问题是：我如何利用坎宁哈链来验证一个区块是合法的？


    让我们来看看 Primecoin 的实现细节。


    1. 对中本·纳个明的区块头进行哈希：`hashBlockHeader = SHA256(BlockHeader)`

    2. 通过转换获取坎宁哈链的第一个数字：`originNum = hashBlockHeader * Multiplier`


    获得坎宁哈链的第一个数字 `originNum` 后，可以测试并计算质链长度的整数部分，而小数部分的计算与坎宁哈链中最后一个非质数的跨度有关。


    每个区块的复用是不同的，且计算过程与 `hashBlockHeader` 相关。为此，Primecoin 专门针对区块头进行了修改，并添加了字段 `bnPrimeChainMultiplier`
    来存储乘积因子。然而，在第一步计算 `hashBlockHeader` 时，输入数据并不包含这个乘积因子，这就是为什么特别指中本·纳个明的区块。


    Primecoin 是市场上第一个不使用哈希工作量证明机制的加密货币。挖掘过程本身具有一定的科学价值。但为什么你没有获得巨大的回报呢？


    根据我们已知的知识，质数在数轴上的分布不均匀，数字越大，质数越稀疏。寻找难度并非线性增加，因此时间消耗是不可预测的。然而，区块链需要区块的稳定性，而质数算法并不流行。但这种探索并非毫无意义，对
    PoW 工作量的探索仍在继续。


    ## 3.1.5 Ethash 和 Ethereum


    以太坊最初打算使用 POS，但由于 POS 设计的一些问题，开发团队决定在以太坊 1.0 阶段使用 PoW 方法。然后在 Serenity（平静）阶段，以太坊将从
    PoW 转换为 PoS。工作证明（PoW）意味着将电转化为热、Ethash 以及网络稳定性。


    以太坊的 PoW 算法被称为 `Ethash`（Dagger-Hashimoto 算法的修改版本），它与比特币的 PoW 算法略有不同，使得可以使用普通硬件进行挖掘。


    最新版本的 `Ethash` 设计旨在满足以下目标：


    1. **IO 饱和**：算法几乎消耗所有的可用内存带宽，这是实现 ASIC 抗性的策略，目标是可用内存，特别是 GPU 的显存（与电脑内存相比，它更接近理论上的最优值）。

    2. **“GPU 友好型”**：让 GPU 挖掘尽可能简单。CPU 挖掘几乎是不可能的，因为潜在的专门化影响太大了，而且 CPU 友好型算法具有容易受到僵尸网络攻击的缺点。因此，经过综合考虑，选择了“GPU
    - 图形处理单元友好”。

    3. **轻量客户端可验证性**：轻客户端能够在 C 语言桌面端以 0.01 秒为单位验证一轮挖掘，并在 Python 或 JavaScript 中验证一轮挖掘；以
    0.1 秒为单位验证一轮挖掘需要 1 MB 内存（但是指数增长）。

    4. **轻客户端减速**：使用轻客户端运行算法的过程应该比使用全客户端慢得多，因此在轻客户端上运行算法（包括通过专用硬件）不是经济上可行的挖掘方式。

    5. **轻客户端快速启动**：轻客户端能够完全运行并能够在 JavaScript 中 40 秒内验证区块。


    基于这些考虑，开发团队最终发布的 Ethash 挖掘基本上独立于 CPU 性能，但与内存大小和带宽正相关。这种来自以太坊的工作量证明算法降低了常用于比特币挖掘的特定硬件
    ASIC 的效率。


    Ethash 算法的基本过程如下：


    - 对于每个区块，首先通过扫描区块头计算种子（seed）：种子仅与当前区块的信息有关；使用种子生成 16 MB 的伪随机数据集（缓存）；然后生成一个 1 GB
    的数据集——基于缓存的 DAG。该数据集中的每个元素仅依赖于缓存中的少数元素。换句话说，只要有缓存，你就可以快速计算 DAG 中指定位置的元素。DAG 可以被理解为一个完全搜索空间。挖掘过程是从
    DAG 中随机选择元素（类似于在比特币挖掘中寻找合适的 `Nonce`），然后执行哈希操作。

    - 验证过程也类似。它根据缓存获取指定位置的元素，然后验证这组元素的哈希结果是否小于某个值。验证过程只需要普通的 CPU 和内存即可完成。这是因为缓存很小，且指定位置的
    DAG 元素很容易计算。缓存和 DAG 每 30,000 个区块更新一次。


    ## 3.1.6 Equihash 和 Zcash


    '
