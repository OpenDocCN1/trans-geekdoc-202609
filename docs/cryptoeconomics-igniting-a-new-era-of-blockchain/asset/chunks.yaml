    # [4.3   Schelling Point](#ch00_fm04_contents.xhtml#rsec4_3)


    Schelling point is the tendency of people in game theory to choose without communication.
    This choice may be because it looks natural, special, or related to the selector.
    This concept was coined by Thomas Schelling, a Nobel laureate in the United States,
    in the 1960s in the book *The Strategy of Conflict*. On [page 57](#ch03.xhtml#pg_57),
    Schelling describes “Some focal point for each person’s expectation of what the
    other expects him to expect to be expected to do”.[¹](#ch04.xhtml#fn4_1) This
    concept was later named after Schelling.


    For example, a group of independent and non-communicating people are required
    to select a number from the following figures, and only when the same number is
    selected by all of them, there will be a reward:


    *   38219057301490231


    *   100000000000


    *   1.43123289.


    They may choose the number 100000000000 at the same time, because it looks the
    most natural, and it is also the number that everyone expects others to choose.
    The other two numbers have no significant features.


    # [4.4   Bounded Rationality Model](#ch00_fm04_contents.xhtml#rsec4_4)


    Another concept in game theory that is crucial to cryptoeconomics is bounded rationality
    model. After the 1950s, it was recognized that an economy based on completely
    rational decision-making theory was only an ideal model, and it was impossible
    to guide actual decision-making. Herbent Simon proposed satisfaction criteria
    and bounded rationality model criteria, to replace the “economic man” with “social
    people”. The bounded rational model is also known as Simon’s model and Simon’s
    bounded rationality model. This is a more realistic model, which believes that
    human reason is a bounded rationality between perfect rationality and total irrationality.


    Bounded rationality model believes that decision-makers pursue rationality, but
    it is not the pursuit of rationality to the maximum. He only requires bounded
    rationality. This is because people’s knowledge, ability, or time is limited,
    and decision-makers can neither grasp all the information nor understand the detailed
    rules of decision-making. At the same time, the bounded rationality model believes
    that decision-makers pursue “satisfaction” standards rather than optimal standards
    in decision-making.


    Let’s take an example. Xiao Li every time uses his card to enter the gym. Once
    he was using his card to enter the gym, he found out that there is no one at the
    front desk and there are 5 yuan on the table. The limited rational model thinks
    that Xiao Li will not take these 5 yuan, because not take is against Xiao Li’s
    habits, the simplest decision, taking 5 yuan may impact Xiao Li’s daily fitness
    more, so Xiao Li will make not to take 5-yuan decision under limited conditions.
    This concept is very important for the design of harmful mechanism in cryptoeconomics.


    # [4.5   Game Theory Mechanism Design and Consensus Mechanism](#ch00_fm04_contents.xhtml#rsec4_5)


    The design of the consensus mechanism on the blockchain is most similar to the
    design of the game theory mechanism. The mechanism design is often called reverse
    game theory, because we start from a desired result and reverse derivative to
    design a complete game. If the players pursue their own interests in the game,
    it will produce the results that we want. For example, imagine that we are responsible
    for designing an auction rule, and our goal is to expect bidders to win the bid
    for the actual value of a product. To achieve this goal, we use game theory to
    design the auction into a game in which each player’s core strategy is to be able
    to bid on real value.


    The consensus mechanism design focuses on the system design and system establishment
    as game theory mechanism design does. As in our auction example, we use game theory
    to design a set of rules or mechanisms that can produce a custom balance. In the
    design of consensus mechanisms, we use cryptography and computer programming to
    implement this economic incentive. We design the systems that are usually distributed
    and decentralized.


    Bitcoin’s consensus algorithm Proof of Work (PoW) is the result of this approach.
    Nakamoto wanted Bitcoin to have certain characteristics, such as its ability to
    reach a consensus on its internal state and its ability to resist censorship.
    He then designed an entire Bitcoin system to implement these characteristics,
    assuming that people responded to economic incentives in a reasonable way.


    # [4.6   Game Theory Mechanism Design and Blockchain Security](#ch00_fm04_contents.xhtml#rsec4_6)


    In the real world of business, a hostile takeover is a behavior that greatly affects
    the security of the company. A malicious acquirer usually does not have the consent
    of the other party and wants to obtain control and all resources which has the
    other party. In the world of blockchains, there are similar security risks, and
    it is called the bribing attacker model.


    The bribery attacker model refers to an uncoordinated choice model, such as the
    Trustless Blockchain, where there is a briber with sufficient resources, who is
    using an additional economic reward (Bribery) to motivate other participants to
    take specific actions. The specific actions here usually have a greater impact
    on the security of the original blockchain system. For example, the most common
    is the malicious fork.


    If we use a malicious acquisition to analogize the bribery attacker model, we
    can explain that a briber outside a blockchain agreement acquires tokens or mining
    power through a condition, thereby achieving the purpose of attacking the original
    blockchain. In layman’s terms, it is called “buy existing nodes”.


    In order to better understand how the briber achieves its purpose, we use the
    popular game theory knowledge to make an analysis.


    Let’s assume that there is a simple voting mechanism, each participant in the
    blockchain can vote for both 0 and 1. The assumption that 0 is beneficial to the
    original blockchain, and 1 is unfavorable to the original blockchain. Only when
    the results of everyone’s vote are the same, everyone can get the corresponding
    reward P. In this case, the Nash equilibrium is that everyone voted 0, that is,
    the decision that is favorable to the original blockchain, and the profit matrix
    of decision is expressed as follows:


    |   || You vote 0 || You vote 1 |


    | --- | --- | --- |


    | The other people vote 0 || P, P || 0, 0 |


    | --- | --- | --- |


    | The other people vote1 || 0, 0 || P, P |


    If there is a bribery attacker at this time, he tells you that if you vote for
    1 while others don’t vote for 1, there is an additional reward ε in addition to
    the reward P, and then a new profit matrix of decision looks like this:


    |   || You vote 0 || You vote1 |


    | --- | --- | --- |


    | The other people vote 0 || P, P || 0, P + ε |


    | --- | --- | --- |


    | The other people vote 1 || 0, 0 || P, P |


    On the surface, it is the best choice for you to vote. The problem is that when
    the briber tells everyone the bribe conditions, everyone thinks that vote 1 is
    the best choice, and then the Nash equilibrium at this time becomes everyone’s
    vote; that is, everyone has chosen the decision, which is unfavorable for original
    blockchain.


    The briber achieved his goal through this P + ε attack and at the same time did
    not have to pay the promised bribe ε to make decisions that were unfavorable to
    the original blockchain. Very smart and clever, isn’t it? This P + ε attack problem
    is also one of the security risks similar to the PoW consensus mechanism.'
