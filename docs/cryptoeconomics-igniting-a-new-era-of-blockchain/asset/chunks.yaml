    Classical cryptography focuses on writing and transmission of information and
    corresponding deciphering methods. And modern cryptography originates from a large
    number of related cryptographic theories that emerged at the end of the 20th century,
    it is a branch of mathematics and computer science, and at the same time, it refers
    a lot to an information theory. Modern cryptography focuses not only on the confidentiality
    of information but also on information integrity verification, non-repudiation
    of information (i.e., digital signatures), and all information security issues,
    arising from internal and external attacks that emerge in distributed computing.


    The development of modern cryptography has promoted the development of computer
    science, especially the need for computer and network security. Nowadays, cryptography
    has been applied in daily life, including ATM chips, computer access passwords,
    e-commerce, and other spheres.


    Blockchain technology applies a lot of cryptographic content in its operation,
    which mainly includes `hash algorithm`, `key encryption`, and `digital signature`.


    # 1.1.1 Hash Algorithm


    Hash functions are often referred to as cryptographic hash functions, for example,
    message digest functions, which do not necessarily use keys, but are associated
    with many important cryptographic algorithms. It outputs the input data (usually
    an entire file) into a shorter fixed-length hash value.


    This process is one-way, and the possibility of two different inputs producing
    the same hash value is very low.


    Briefly, the hash algorithm maps strings of arbitrary length to shorter, fixed-length
    strings. For example, Bitcoin (what is the uses the `SHA-256` as a digest algorithm,
    which gives a 256-bit output for any length of input.


    So, what are the applications of the hash algorithm in cryptocurrency?


    ## 1. Cryptographic hash function


    A cryptographic hash function has the following characteristics:


    * Definiteness: no matter how many times are parsed in the same hash function,
    if the input is the same, the resulting output is always the same.

    * Efficiency of the calculations: the process of calculating hash values is very
    efficient.

    * Anti-preimage attack: for a given output, the input is irreversible.

    * The influence of subtle changes: subtle changes in any input can have a dramatic
    effect on the output of the hash function.


    The cryptographic hash function is very important for the security on blockchain
    and the mining.


    ## 2. Data structure


    In cryptography, there are two kinds of data structures which are important for
    understanding blockchains: linked list and hash pointer.


    The linked list is a data block that is sequentially connected in order, as shown
    in [Figure 1.1](ch01.xhtml#fig1_1).


    A blockchain is essentially a linked list in which each new block contains a hash
    pointer. The pointer points to the hash of the previous block and all the data
    it contains. With it, the blockchain has great features that cannot be changed.


    So how does the blockchain achieve immutability?


    If someone tries to tamper with the data in the block, let’s look at the third
    feature of the cryptographic hash function: “The effect of subtle changes is that
    any slight change in the input will have a dramatic impact on the output of the
    hash function”. So, even if someone tries to rewrite the data in the block subtly,
    it will also cause a huge change in the hash value of Block 1 stored in Block
    2, which will cause changes in the hash value of Block 2. The change, in turn,
    affects the hash value stored in Block 3. No. 3 affects No. 4, No. 4 affects No.
    5…. Eventually, the data on the entire blockchain will change. This way of modifying
    data by freezing the entire chain is almost impossible. Therefore, the blockchain
    is considered as immutable.


    Each block has its own Merkle root. If multiple transactions are included in each
    block and these transactions are stored linearly, the process of finding a particular
    transaction in all transactions can become very complicated. That’s why we use
    the Merkel tree.


    As it is shown in [Figure 1.2](ch01.xhtml#fig1_2), in the Merkel tree, all individual
    transactions can be traced back to the same root through a hash algorithm, which
    makes searching very easy. Therefore, if we want to get a specific data in the
    block, we can search directly through the hash value in the Merkel tree without
    linear access.


    ![Figure 1.1 Linked List and Hash Pointer Data Structure.](images/Fig01_01.jpg)


    **Figure 1.1 Linked List and Hash Pointer Data Structure.**


    ![Figure 1.2 Merkel Tree Trace Back Structure.](images/Fig01_02.jpg)


    **Figure 1.2 Merkel Tree Trace Back Structure.**


    ## 3. Mining


    The hash algorithm is very important for mining new encrypted blocks, and its
    working principle is the adjustment of the difficulty value. A random string named
    `nonce` is added to the hash of the new block and then hashed again. Next, check
    if it is lower than the set difficulty level. If it is lower, the resulting new
    block will be added to the chain, and the miner responsible for mining will be
    rewarded. If it is not lower, then the miner continues to modify the random string
    `nonce` until the value appears below the difficulty level.


    # 1.1.2 Key Encryption


    Key encryption includes symmetric key encryption and public key encryption.


    Symmetric key encryption is an encryption method in cryptography. If you convert
    one of the numbers, letters, or strings of random letters in the data, the key
    changes the text or letters in the data in a specific way, such as changing the
    relative position of the letters (e.g., the word “one” becomes “neo”). As long
    as the sender and the recipient know the secret key, they can encrypt and decrypt
    the data.


    Public key encryption, or public key cryptography, also known as asymmetric key
    cryptography, is another encryption method in cryptography. The biggest feature
    relative to symmetric key cryptography is that encryption and decryption use different
    keys. The data obtained by encryption using the encrypted key can only be decrypted
    by the decryption key of the user. If you know one of them, you can’t figure out
    another one. Therefore, if one of the keys is disclosed, it does not harm the
    other one; that is, the publicly opened key is public key, and the undisclosed
    key is private key.


    In symmetric key cryptography, encryption and decryption use the same key, and
    perhaps different keys are used for different messages, but they all face the
    challenge of key management. Since each pair of communicating parties must use
    a different key than the other group, when the number of network members increases,
    the number of keys increases quadratically. A more complicated problem here is:
    how do you create a common key for secure communication when there is no secure
    channel between the two parties? If you have a channel to create a key securely,
    why not to use an existing channel. This is really a contraction of the matter
    who came first? It is just a “chicken or egg contradiction”.


    # 1.1.3 Digital Signature


    Digital signatures are the foundation of public key infrastructures (PKIs) and
    many network security mechanisms (SSL/TLS, virtual private networks, etc.). As
    it is clear from the name, digital signature is a digitization of ordinary signatures
    in daily life. The feature of it is that others can easily create signatures,
    but it is difficult to imitate. Digital signatures can be permanently combined
    with signed messages and cannot be removed from messages.

