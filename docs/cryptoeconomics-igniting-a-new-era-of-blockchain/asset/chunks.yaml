    事实上，仔细回顾早期中国矿机厂商的发展史，可以发现它与当前的 ICO 热潮有极大的相似之处。当时也出现过各种混乱，如延迟交货、诈骗和非法集资，这些都考验着行业内人的信誉。`Viabtc`
    的创始人杨海波曾叹道：“曾有很多与 `Bitmain` 同时存在的矿机厂商，但后来它们都破产了。矿机制造需要采购、供应链、物流等方面的协调。`Bitmain`
    的成功表明吴忌寒是一个公司非常优秀的‘舵手’”。


    2018 年 2 月 24 日，CNBC 引用分析公司 `Bernstein` 的数据，`Bitmain` 在 2017 年的收入高达 30 亿至 40 亿美元，等同于
    `Nvidia` 去年的利润。`Bernstein` 的分析师在报告中提到：“但 `Bitmain` 仅用 4 年就实现了这一点，而 `Nvidia` 花了
    24 年才达到这里”。


    《比特大陆疯狂赚取 30 亿美元，与英伟达竞争》这篇报告曾一段时间占据了国内外各类传统媒体和区块链媒体的头条。这篇文章引发了关于矿业行业是否存在巨额利润问题的讨论，并将其分为立场明确的两个群体。一组坚持认为
    `Bitmain` 正在垄断矿机市场并试图控制 `bitcoin`；另一组则拥抱 `Bitcoin`，强调这是市场竞争的结果。


    中国知名区块链教育工作者（官方微信公众号为 `Lightning HSL`）黄世亮认为，“矿机越贵越好。价格越高，越说明吴忌寒对这个行业的贡献越大”。但他也承认
    `Bitmain` 现在是矿业行业的一只“独角兽”。分析师 `Berstein` 估计，`Bitmain` 占据了 `Bitcoin` 矿机和 `ASICS`
    芯片市场 70%–80% 的份额。


    正因此，社区呼吁改变共识算法，希望更多矿工参与并打破 `Bitmain` 的垄断。


    你仅仅通过修改共识算法就能击败这只独角兽吗？


    `Poolin` 的联合创始人朱发认为 `bitcoin` 算法的改变是一个陷阱：“首先，如果 `BTC` 不使用 `SHA256`（哈希算法），那么 `SHA256`
    算力会立即切换到相同算法的其他货币，如 `BCH`、`SBTC`。结果是 `BTC` 持有者将被‘困住’。其次，算法改变后，基本上第一件事就是为矿机制作新算法。因此
    `BTC` 矿工必须重新购买矿。矿工将遭受损失。第三，如果使用像 `Monero` 和 `Ethereum` 那样对 ASIC 不友好的算法，将使社区资源和价值流向其他货币，如
    `Monero` 和 `Ethereum`。结果是 `BTC` 持有者将遭受损失”。


    `Ethereum` 的创始人 Vitalik Buterin 推文了一种混合的 `PoW/PoS` 系统。


    Vitalik 并不是第一个提出这种 `PoW+PoS` 混合共识机制的人。早在 2012 年，一个化名为 Sunny King 的极客就发明了 `Peercoin`，并首次采用
    `Proof-of-Stake` (`PoS`) 机制来维护网络安全。


    # 2.4 PoS (权益证明) 机制


    `PoS` 是 `Proof-of-Stake`（权益证明）。Stake 意味着权利和利益，至于利益，每个持有者都是利益相关者。在 `PoW` 机制下，共识是在有人完成工作量并更新账本时达成的。在
    `PoS` 机制下，拥有最多代币的持有者在系统中更有发言权。后者显然比前者高效，可以节省大量电力。


    因此，`Ethereum` 也计划从 `PoW` 机制切换到 `PoW+PoS`。


    在这个层面上，巨户在 `PoS` 机制中比普通用户更有话语权。这似乎相当不公平。就像公司做决定时，最终决定由持有更多股份的股东决定。如果是这样，如何吸引更多新人参与呢？


    Vitalik 说 `PoW` 也存在对新用户吸引力不足的问题。他建议新用户从像 `CryptoKitties` 这样的 `Dapps` 开始参与系统。


    这个答案似乎并没有说服力。`CryptoKitties` 这样的 `Dapps` 可以在 `Ethereum` 上开发，也可以在 `Bitcoin` 上开发应用。那么，哪一个对新用户更有吸引力呢？


    正如我们上面提到的，`Bitmain` 在 2017 年赚了 30 亿至 40 亿美元，这是在 4 年内实现的，而 `Nvidia` 花了 24 年。我相信许多人会被此吸引。


    当我们讨论 `Bitmain` 的垄断时，不能忽视市场不断演变的这一事实，会有新公司与 `Bitmain` 竞争。但 `PoS` 机制能以此方式演变吗？


    经济学中有一个“资源诅咒”理论。这意味着丰富的自然资源可能是发展的诅咒，而非祝福。在 `PoS` 机制下，无论市场如何演变，巨户总能获得更多回报，这是一个富者愈利的死循环。这种共识方法会导致中心化，似乎违背了去中心化的精神。


    # 2.5 LPoS (租赁权益证明) 机制


    这与 `PoW` 机制的情况相似；算力较小的矿工无法与巨大算力的矿工竞争。在 `PoS` 机制下，代币较少的用户无法与大额持有者竞争记账权，因此他们缺乏在网络节点运行的动力。


    这意味着整个网络仅由少数巨户维护。只有当节点越多、参与者越多，网络才能更安全，因此有必要鼓励小参与。`Leased Proof-of-Stake` (`LPoS`)
    允许普通用户将币借给其他节点，增加该节点在网络中的权重。如果节点将交易添加到公共账本，收益将按比例分配给持有者。


    # 2.6 DPoS (委托权益证明) 机制


    `DPoS` 是 `delegated Proof-of-Stake`（委托权益证明）机制。`DPoS` 基于 `PoS`，但增加了一个选项——被“委托”。获得记账权的人由社区选举产生并轮换。这类似于人民代表大会（NPC）制度。我们投票选出能代表社区整体利益的人，如果代表人表现不佳（例如没有按时记账），我们也可以替换他们。`DPoS`
    机制相比 `PoS` 机制相对更去中心化。


