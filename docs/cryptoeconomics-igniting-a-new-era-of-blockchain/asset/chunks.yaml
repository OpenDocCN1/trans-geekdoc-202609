    | --- | --- | --- |

    | 参与者 1 合作者 | 3, 3 | 0, −1 |

    | --- | --- | --- |

    | 参与者 1 背叛者 | −1, 0 | 0, 0 |


    我们可以看到，在加入惩罚机制后，纳什均衡已经从背叛（实施恶意行为）变成了合作。这一机制是区块链经济模型中非常重要的一部分。


    # 4.3 谢林点 (Schelling Point)


    谢林点是指博弈论中人们在没有沟通的情况下进行选择的倾向。这种选择可能是因为看起来很自然、特殊，或者与选择者有关。这一概念是由美国诺贝尔奖奖得主托马斯·谢林（Thomas
    Schelling）在 20 世纪 60 年代的著作《冲突的策略》一书中提出的。在`page 57` 上，谢林描述道：“每个人对对方预期他所预期他所预期会做某事的某个焦点点”。这一概念后来以谢林的名字命名。


    例如，一组独立且互不联系的人被从以下数字中选择一个数字，只有当他们人都选择了同一个数字时，才会获得奖励：


    * 38219057301490231

    * 100000000000

    * 1.43123289.


    他们可能会同时选择数字 `100000000000`，因为它看起来最自然，而且也是每个人预期别人选择的数字。另外两个数字没有显著的特征。


    # 4.4 有限理性模型 (Bounded Rationality Model)


    博弈论中另一个对加密经济学至关重要的概念是有限理性模型。20 世纪 50 年代以后，人们意识到基于完全理性决策理论的经济模型只是一个理想模型，无法指导实际决策。赫伯特·西蒙（Herbent
    Simon）提出了满意标准和有限理性模型准则，用“社会人”取代了“经济人”。有限理性模型也被称为 `Simon’s model` 和 `Simon’s bounded
    rationality model`。这是一个更符合现实的模型，它认为人的理性是完全理性与完全非理性之间的有限理性。


    有限理性模型认为决策者追求理性，但并不是对理性的极致追求。他只需要有限理性。这是因为人们的知识、能力或时间是有限的，决策者既无法掌握所有信息，也无法理解决策的详细规则。同时，有限理性模型认为决策者在决策时追求的是“满意”标准而非最优标准。


    让我们举个例子。小李每次都用卡进入健身房。有一次他正要用卡进入健身房，他发现前台没人，桌上有 5 元钱。有限理性模型认为小李不会拿这 5 元钱，因为不拿钱符合小李的习惯，且这是最简单的决策，而拿这
    5 元钱可能会更多地影响小李的日常健身，因此在有限条件下，小李会做出不拿 5 元钱的决定。这一概念对于加密经济学中惩罚机制的设计非常重要。


    # 4.5 博弈论机制设计与共识机制


    区块链共识机制的设计与博弈论机制的设计最为相似。机制设计通常被称为逆向博弈论，因为我们是从期望的结果开始，反向推导以设计一个完整的博弈。如果玩家在博弈中追求自己的利益，就会产生我们想要的结果。例如，假设我们负责设计一种拍卖规则，我们的目标是希望竞标者以产品的实际价值中标得。为了实现这一目标，我们使用博弈论将拍卖设计成一个博弈，每个玩家的核心策略是能够对真实价值进行报价。


    共识机制的设计关注系统设计和系统建立，正如博弈论机制设计一样。正如我们的拍卖示例，我们使用博弈论设计了一套可以产生自定义平衡的规则或机制。在共识机制的设计中，我们使用密码学和计算机编程来实现这种经济激励。我们设计的系统通常是分布式且去中心化的。


    比特币的共识算法 `Proof of Work` (`PoW`) 就是这种方法的结果。中本希望比特币能够具有某些特性，例如其对内部状态达成共识的能力以及抗审查的能力。随后他设计了整个比特币系统来实现这些特性，假设人们会以合理的方式对经济激励做出反应。


    # 4.6 博弈论机制设计与区块链安全


    在商业现实世界中，恶意收购（hostile takeover）是一种极大影响公司安全的行为。恶意收购者通常没有对方的同意，并希望获得控制权以及对方所有的资源。在区块链世界中，存在类似的安全风险，被称为贿赂机制（bribing
    mechanism）。


    贿赂攻击模型指的是不受协调的选择，例如无信任区块链（Trustless Blockchain），其中有一个拥有充足资源的贿赂者，通常会对原始区块链产生更大的影响。例如最常见的是恶意分叉（malicious
    fork）。


    如果我们用恶意收购来类比贿赂攻击模型，就可以解释这一点。为了更好地理解贿赂者如何达到目的，我们使用常用的博弈论知识进行分析。假设有一个简单的投票机制，区块链中的每个参与者都可以对
    0 和 1 进行投票。假设 0 对原始区块链有利，而 1 对原始区块链是不利的。只有当所有人的投票结果相同时，大家才能获得相应的奖励 `P`。在这种情况下，纳什均衡是所有人投
    0，即有利于原始区块链的决策，其收益矩阵表示如下：


    | | 你投 0 | 你投 1 |

    | --- | --- | --- |

    | 其他人投 0 | P, P | 0, 0 |

    | --- | --- | --- |

    | 其他人投 1 | 0, 0 | P, P |


    如果此时有一个贿赂攻击者，他告诉：如果你投 1 而其他人不投 1，除了奖励 `P` 之外还有额外的奖励 `ε`，那么新的决策收益矩阵如下：


    | | 你投 0 | 你投 1 |

    | --- | --- | --- |

    | 其他人投 0 | P, P | 0, P + ε |

    | --- | --- | --- |

    | 其他人投 1 | 0, 0 | P, P |


    从表面上看，投 1 是你的选择。问题在于，当贿赂者告诉所有人贿赂条件时，每个人都认为投 1 是最好的，此时的纳什均衡变成了所有人都投票；即每个人选择了不利于原始区块链的决策。


    贿赂者通过这种 `P + ε` 攻击实现了目标，同时不需要为了做出不利于原始区块链的决策而支付承诺的贿 `ε`。非常聪明对吧？这种 `P + ε` 攻击问题也是类似于
    `PoW` 共识机制的安全风险之一。


    '
