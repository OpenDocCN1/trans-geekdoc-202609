- raw: 'In the core module, Tendermint works based on a circular voting mechanism,
    which is also the principle of a consensus protocol. A round is divided into three
    processing steps: the verifier proposes a block, sends the submission intent,
    and submits a new block after signing. This mechanism provides a secure state
    replicator for atomic broadcasts, adding a layer of responsibility – a security
    failure can be completely attributed to Tendermint.


    The Tendermint consensus algorithm starts with a set of verifiers. The verifier
    maintains a full copy of the blockchain and can use the public key to identify
    the certifier’s identity. They took turns to propose a block.


    Only one verifier can propose a block for each round of voting, and this should
    be signed with the verifier’s corresponding private key, so if there is an error,
    the verifier responsible for this can be found. Then, the remaining certifiers
    need to vote for each proposal, and the votes need to be signed with their own
    private key. These make up a round. However, it may take several rounds to submit
    a new block because of the asynchronous network, which is shown in [Figure 3.2](#ch03.xhtml#fig3_2).


    ![Figure 3.2   Casper vs. Tendermint. (Source: Medium “Consensus Compare: Casper
    vs. Tendermint”.)](images/Fig03_02.jpg)


    **Figure 3.2   Casper vs. Tendermint. (*Source*: Medium “Consensus Compare: Casper
    vs. Tendermint”.)**


    The certifier may fail while submitting block: current proposal may be offline,
    or network may experience a delay. Tendermint allows the verifier to be escaped
    (when the turn comes to a verifier, the verifier is not creating a block). The
    verifier waits a short period of time to receive the entire block proposed by
    the proposer (the certifier of this round of the block) before moving to the next
    round of voting. This dependency on timeouts makes Tendermint a weak synchronization
    protocol rather than an asynchronous protocol. However, the multiplied protocol
    is asynchronous, and the verifier will only process if it receives more than two-thirds
    of the verifier set messages. Because of this, Tendermint requires most of the
    certifiers to function properly, and if one-third or more of the certifiers are
    offline or offline, the network will stop working.


    Assuming less than one-third of the verifiers are Byzantium, Tendermint guarantees
    that security will never be compromised – it means that the verifier (more than
    2/3) will never commit a conflicting block at the same height. Therefore, the
    blockchain based on Tendermint will never fork.


    Nowadays, Tendermint’s design decisions have placed security and immutability
    on the top of flexibility. There is a high probability in the real world that
    the system will really stop running and participants will need to restart the
    system after updating the software outside the protocol.


    Only a few people in the digital cryptocurrency community understood Casper and
    why it was valuable, Tendermint laid the foundation for Casper research. The insight
    is that if a chain is itself highly fault-tolerant, then you can rely on the chain
    to make a good decision about who will make the block, but if the chain itself
    is unreliable, then you fall into the trap. The problem with chickens and eggs
    has gone, which used to be the catastrophe of all other consensus algorithms.


    This design solution is considered to be inferior to available prior protocols
    such as Ethereum and Bitcoin. But we need to consider how to get back to the right
    chain in case if we have shifted to the unsafe chain.


    Let’s take a look at the trade-offs in Bitcoin: if its network is split, Bitcoin
    loses its security guarantee in the case of various attacks. This is actually
    an unmodifiable theory; that is, when your confidence interval is 100%, you are
    following a correct chain, and you will use this chain to choose who will produce
    the next block, but once you transfer from an insecure chain, there is no clear
    path to get you back to the right chain.


    Clear features of Tendermint:


    *   ■ Proven activity


    *   ■ Security threshold: 1/3 of the verifier


    *   ■ Public/private chain compatibility


    *   ■ Instant final determinism: 1–3 seconds, depending on the number of certifiers


    *   ■ Consistency first


    *   ■ Consensus security on weakly synchronic networks.


    # [(2)   CFFG](#ch00_fm04_contents.xhtml#rsec3_2_2_2)


    The chain-based PoS imitates the workload proof consensus algorithm, in which
    the protocol allows the pseudo-randomly selected verifier to generate a new block,
    a hash join of the new block (including the hash value of the previous block)
    to the previous longest chain of the parent block. Chain-based PoS relies a lot
    on synchronous networks and usually prioritizes availability rather than consistency.
    Casper(s) is an adaptation of Tendermint’s core ideas for environments that tend
    to be active rather than safe.


    CTFG is a well-defined PoS construction, but CFFG is a PoS that covers the existing
    Ethereum PoW proposal mechanism, in fact combining both PoW and PoS.


    Both Bitcoin and Ethereum’s PoW Consensus Agreement will not make a “final” decision,
    and blocks may be potentially reorganized to some past block heights. When the
    block has no chance to be modified, it can be called “final determination”.


    Because the workload proof does not provide such a modification guarantee, it
    is considered to be unsafe. Conversely, when we continue to lengthen the chain,
    the final deterministic probability of the block is getting higher and higher.
    The logic implemented by CFFG can increase the desired final determination and
    51% attack resistance for the Ethereum blockchain.


    CFFG will be rolled out in multiple steps, and PoW security model is gradually
    transited to PoS security mode in a conservative manner. The first iteration of
    Casper will be to implement the hybrid PoW/PoS protocol discussed here. The last
    iteration of Casper is likely to draw on the lessons of CFFG and CTFG towards
    a complete PoS protocol.


    CFFG is a hybrid between chain-based PoS and BFT-based PoS because it draws on
    both ideas. Its modular overlay design makes it easier to update the current PoW
    chain as it is a more conservative approach to upgrading the system to a completely
    different consensus model.


    Casper’s application logic exists inside smart contracts. To be a certifier in
    Casper, you must have Ethereum token (ETH) and store ETH in the Casper Smart Contract
    as a leveraged benefit. The mechanism proposed by the block in the first iteration
    of Casper will be preserved: it still uses the Nakamoto PoW consensus, and miners
    can create the blocks. However, in order to finalize the block, Casper’s PoS coverage
    has control and has its own verifier to vote after the PoW miners.


    One of the most important parts of Casper’s PoS consensus is checkpoints. When
    Casper evaluates the final certainty in the 50-block increment, it is called a
    checkpoint, and every 50 block fragments is called an epoch. This process is triggered
    by the verifier who is sending a voting message at every cycle.


    Just to sum up, the final determination of a block requires two conditions:


    *   ■ Most (more than 2/3) verifiers voted for block 1 during cycle 1 and therefore
    recognize block 1 as legit.


    *   ■ Most (more than 2/3) verifiers voted for block 2 during cycle 2, and block
