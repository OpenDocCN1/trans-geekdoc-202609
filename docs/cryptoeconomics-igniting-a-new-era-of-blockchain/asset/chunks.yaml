    在加密经济学中，价值往往是通过比较来决定的：如何确保 `Bitcoin` 和 `Ethereum` 等系统中矿工的公平性？我们可以通过比较解决问题的速度，即看谁能更快地解决问题，以及谁能获得将交易添加到公共账本的权利；对于各种共识机制，如
    `PoW`、`POS` 和 `DPOS`，我们一直在比较哪一种更代表未来的发展方向。


    我们这种比较的习惯不仅是不理性的，而且这种不理性是可以预测的。我们总是习惯于观察周围的事物来确定彼此之间的关系，这不仅适用于实物，也适用于无形体验，即使在处理情感、态度和观点等瞬时波动较大的事物时也是如此。


    相对性帮助我们在生活中做出决策，但它也可能让我们感到非常痛苦。例如，在接触区块链之前，你的正常年薪是 10 万人民币，在投资 `Bitcoin` 之后变成了
    500 万人民币。这当然是一件幸事的事；但如果你知道周围的朋友们至少赚了 1 亿人民币，你还能从中感到快乐吗？


    如果我们能控制比较的范围，转到一个能够提高我们相对幸福感的圈子，我们将过上更舒适的生活。


    ## 5.2.2 为什么你对 10,000 美元的比特币毫无感觉，而有些人却为之疯狂？


    从 2017 年底开始，各国开始控制代币发行 (`ICO`)）。加密货币一直在下跌，价格腰斩只是基本操作。跌幅 80% 也随处可见，导致无数人遭受巨大损失。


    然而，在经历了 3 个月的监管后，加密货币市场变成了大牛市。许多被认为在状况持续恶化中挣扎的币种复苏了，第二个春天比以前更加耀眼。`Bitcoin` 在 12
    月突破了 1.4 万人民币大关，让无数人叹息并错过了最好的投机机会。


    在此期间，有些人不顾一切地寻找任何路径逃离，而另一些则冷静地购买底部代币；为什么面对同样的处境，不同的人会做出不同的选择？


    行为经济学指出，当人们做决定时，思考往往受到他们获取的第一条信息的影响，就像沉入的海锚，将你的思想固定在某处，而你却对此毫无察觉。这种影响被称为“锚定效应”。


    锚定效应为我们对比特币价格的不同接受程度提供了一个很好的解释。当人们第一次接触并尝试理解比特币时，不同的人对价值的理解存在显著差异：


    * A 认为 `Bitcoin` 仅仅是一段无用的代码。它完全不具备货币的属性。现在的价格是因为炒作。早晚会有泡沫破灭的一天。他们还没有准备好接受价格历史上的持续上涨，而且绝对不会买，例如著名的拒绝了
    100 个 `bitcoins` 的 Lang 教授。

    * B 认为 `bitcoin` 是挖矿产生的，所以它的价格应该等于挖掘 `bitcoin` 的成本（设备投入 + 电费 + 维修费），因此它以高于成本的价格出售，例如……

    * C 认为如果你周围的朋友们至少赚了 1 亿人民币，你还能从中感到快乐吗？

    * D 认为 `bitcoin` 是挖矿产生的，所以它的价格应该等于挖掘 `bitcoin` 的成本（设备投入 + 电费 + 维修费），因此它以高于成本的价格出售，例如……


