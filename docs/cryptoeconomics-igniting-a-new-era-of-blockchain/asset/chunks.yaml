    有一天你下班回到家，躺在沙发上习惯性地打开 `imToken` 钱包， 然后在余额列表中发现了一个奇怪的代币和一些代币。如果你是刚开始遇到这种情况，我相信你至少会感到一丝兴奋，但现在你已经习惯了：这只是某些项目的
    `airdrop`（空投）。


