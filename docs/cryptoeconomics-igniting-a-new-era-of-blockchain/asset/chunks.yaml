    \ protocol. A round is divided into three processing steps: the verifier proposes\
    \ a block, sends the submission intent, and submits a new block after signing.\
    \ This mechanism provides a secure state replicator for atomic broadcasts, adding\
    \ a layer of responsibility – a security failure can be completely attributed\
    \ to Tendermint.\n\nThe Tendermint consensus algorithm starts with a set of verifiers.\
    \ The verifier maintains a full copy of the blockchain and can use the public\
    \ key to identify the certifier’s identity. They took turns to propose a block.\n\
    \nOnly one verifier can propose a block for each round of voting, and this should\
    \ be signed with the verifier’s corresponding private key, so if there is an error,\
    \ the verifier responsible for this can be found. Then, the remaining certifiers\
    \ need to vote for each proposal, and the votes need to be signed with their own\
    \ private key. These make up a round. However, it may take several rounds to submit\
    \ a new block because of the asynchronous network, which is shown in [Figure 3.2](#ch03.xhtml#fig3_2).\n\
    \n![Figure 3.2  Casper vs. Tendermint. (Source: Medium “Consensus Compare: Casper\
    \ vs. Tendermint”.)](images/Fig03_02.jpg)\n\n**Figure 3.2  Casper vs. Tendermint.\
    \ (*Source*: Medium “Consensus Compare: Casper vs. Tendermint”.)**\n\nThe certifier\
    \ may fail while submitting block: current proposal may be offline, or network\
    \ may experience a delay. Tendermint allows the verifier to be escaped (when the\
    \ turn comes to a verifier, the verifier is not creating a block). The verifier\
    \ waits a short period of time to receive the entire block proposed by the proposer\
    \ (the certifier of this round of the block) before moving to the next round of\
    \ voting. This dependency on timeouts makes Tendermint a weak synchronization\
    \ protocol rather than an asynchronous protocol. However, the multiplied protocol\
    \ is asynchronous, and the verifier will only process if it receives more than\
    \ two-thirds of the verifier set messages. Because of this, Tendermint requires\
    \ most of the certifiers to function properly, and if one-third or more of the\
    \ certifiers are offline or offline, the network will stop working.\n\nAssuming\
    \ less than one-third of the verifiers are Byzantium, Tendermint guarantees that\
    \ security will never be compromised – it means that the verifier (more than 2/3)\
    \ will never commit a conflicting block at the same height. Therefore, the blockchain\
    \ based on Tendermint will never fork.\n\nNowadays, Tendermint’s design decisions\
    \ have placed security and immutability on the top of flexibility. There is a\
