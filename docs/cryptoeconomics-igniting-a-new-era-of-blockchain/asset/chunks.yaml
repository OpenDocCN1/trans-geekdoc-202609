    \ as the number of network nodes has increased, the cost of launching attacks\
    \ has become more and more expensive, and the PoW mechanism has been proven to\
    \ be safe and reliable. However, in order to maintain the consistency of the ledger\
    \ (C in CAP theory) and the system operation stability in case of such problems\
    \ as a node drop in network partition (P), bitcoin network sacrifices availability\
    \ (A) to some extent. Some people also call this problem “latency”, the delay\
    \ problem. The network needs 10 minutes to wait, and there should be enough transactions\
    \ to be confirmed before the account can be updated. If Bitcoin is going to get\
    \ the AP, the client should accept the transaction as soon as it is added to the\
    \ blockchain, so that it does not need to depend on other nodes, and so that is\
    \ very useful. But there is a risk that the remaining nodes may reject the transaction\
    \ and thereby sacrifice the consistency.\n\nIn addition, many people think that\
    \ the most important thing about money is safety. They believe that giving a lot\
    \ of works to solve mathematical problems in order to ensure the safety of Bitcoin\
    \ in the PoW mechanism is a wasteful behavior. Here, we will talk about three\
    \ major issues of the PoW mechanism, which are often discussed by the community.\n\
    \n# [2.3.1   Problem of PoW 1: Waste of Resources](#ch00_fm04_contents.xhtml#rsec2_3_1)\n\
    \nIceland is known as a “miner’s paradise”. The temperature there is cold, a computer\
    \ server can be naturally cooled, and the renewable energy of geothermal and hydroelectric\
    \ power plants makes the electricity price lower; in that way it attracts bitcoin\
    \ mining companies from all over the world."
