    \ reached. In comparison with the verbal agreement, the written one can help you\
    \ to find the source of information and to reveal the generals who have agreed\
    \ to attack. If they attack together, and those who have signed to attack will\
    \ retreat during the attack, then the general is a traitor and he will be put\
    \ to death during his retreat.\n\n    But here is also a problem with this written\
    \ agreement: how to ensure that only one general at an exact time attaches his\
    \ own content after the letter. In other words, after the letter of General No.\
