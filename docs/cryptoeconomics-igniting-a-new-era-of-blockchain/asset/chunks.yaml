  trans: "\n因此，为了进行更公平的代币分配，一些项目采用“荷兰式拍卖”作为其代币拍卖的模型。荷兰式拍卖是指竞价价格从高到低逐渐，直到第一位出价者在价格达到或高于储备价时达成交易。这使得加密经济学应用被引入到了拍卖领域。\n\
    \n无论是建立低层共识协议，还是设计更优代币销售机制，都可以视为一种加密经济学。构建这些应用需要理解激励机制如何影响用户行为，设计能够可靠产生结果的经济机制，并且有理解构建构建的底层区块链的功能和局限性。\n\
    \n当然，还有许多区块链应用并非加密经济学的产物。例如，`Status` 和 `MetaMask`，这些平台和钱包类程序允许用户与 `Ethereum` 区块链进行交互。除了区块链底层已有的机制外，这些机制并不涉及任何其他加密经济学机制。\n\
    \n# 结论\n\n从加密经济学的角度思考区块链空间非常有帮助。一旦你对加密经济学有了一定的理解，就可以破解我们行业中的许多争议和辩论。\n\n例如，一种带有中心化管理且不使用工作量证明的“许可链”，自首次引入以来就一直存在争议。这一领域通常被称为“分布式账本技术”，侧重于金融和商业用例。许多区块链技术的支持者不喜欢这种技术。这些“许可链”从字面上说是区块链，但其中一些总是很诡异。“许可链”似乎拒绝了每个人认为的区块链的核心理念：可以在不依赖中心化信任方或传统金融系统的情况下达成共识。\n\
    \n区分它们的最佳方法是看这个区块链是否是加密经济学的产物。一个简单的分布式账本，一个基于加密经济学设计以达成共识或调整激励机制的区块链，可能对某些应用有用。但它与那些利用密码学和经济激励来生成无先验共识的区块链（如\
    \ `Bitcoin` 和 `Ethereum`）完全不同。这是两种不同的技术，区分它们的最佳方法就是看它们是否是加密经济学的产物。\n\n此外，我们应该预期未来会有不依赖于“区块”和“链”的加密经济学共识协议。显然，这种技术与区块链技术有共同之处，但将它们称为区块链是不正确的。我们需要看这样一种协议是否是加密经济学的产物，而不是看它是否是区块链。\n\
    \nICO 关注这种区别，但很少有清晰的解释。代币价值的最强表现之一是，许多人独立地意识到 = 它是否构成了所连接应用的不可或缺的一部分。更清楚地说：代币是否是应用程序中加密经济学机制的必要部分？这正是为什么理解\
    \ ICO 项目中的机制设计对于确定代币的效用和价值至关重要。\n\n在过去的几年里，我们一直从单一应用（`bitcoin`）的角度来思考这个新领域，而我们已经转向了底层技术（`blockchain`）的视角。现在我们需要退退一步，以统一的方式看待这类解决方案，即加密经济学。\n\
    \n# 索引\n\n### A\n- `ABCI`, `见` `Application Blockchain Interface (ABCI)`\n- `Access\
    \ mode`, `144`\n- `Algorand Agreement`, `76`\n- `Alibaba`, `150`\n- `Anchoring\
