  trans: '

    然而，我们的精力是的，资金也是的，不可能参与所有项目，而且并非所有项目都是可靠的。


    然而，即使你完全同意这一观点，当你看到群里有人在发送新项目的信息，或者当你创建一个新项目的二维码时，你仍然会自然地加入群组，然后打开群设置，取消群消息提醒；当然，如果这个项目很有很有，你还会将其置顶。


    事实上，不仅是项目，许多人也关注数百种加密货币的价格走势——尽管他们持有的比例不到十分分之一。那么，我们关注所有项目信息的原因究竟是什么呢？


    在当今世界的背景下，我们仍然竭力为自己保留多种选择，有时我们甚至可能不知道在这个过程中错过了其他事情。当你正忙于处理某些并不一定重要的事情时，你可能会忘记一些真正重要的事情。结果就是，由于你关注了太多的项目，你无法对几个非常好的项目进行深入研究，从而错过了投资机会。


    当有很多选择时，后果是什么？为什么我们必须为自己保留这么多选择，即使这些选择需要付出非常高的代价？为什么我们不能专心地去做好每一件事呢？


    耶大学教授沈世英通过实验发现，通常在明确的目标引导下，我们会努力追求最大化满意。在理想情况下，我们会尝试所有可能的选项并选择最合适的一个。然而，事实并非如此理想，因为机会是瞬即逝的，你不能等到分析完所有项目后再要求项目启动众筹，所以你总是会错过一些；当然，最好的项目可能就在其中。


    我们如何才能消除这种非理性的冲动，不再追逐那些毫无价值的冗余选择？哲学家埃里克·弗罗姆（Erich Fromm）在 1941 年写了一本书《逃离自由》。他说，在现代民主制度下，并不是缺乏机会，而是机会太多，这让人眼目缭乱。这种现象在今天的社会中变得更加明显。人们不断地提醒自己，我们可以做任何事情并实现我们的预期。


    问题是这个梦想是否可以实现。我们必须尽一切努力提高自己；我们必须在生活中尝试一切；我们必须在出生前至少看一遍那 1000 件事。但如果我们这样做，难道不会过度劳而精疲力竭吗？


    我们有必要放弃这些项目，仅仅是因为这些项目耗费时间并挤占了我们的参与机会，它们让我们无法兼顾那些宝贵的选择并让我们精疲力竭。


    # 5.3 行为经济学与加密经济学的交汇


    上文，我们可以意识到在日常生活和行为决策中，我们并不像传统经济学那样理性全面，而加密经济学中的智能合约可以用作外部约束，帮助我们做得更好。决策机制、区块链本身的公平开放性使我们能够获取我们想要知道的信息，而不是让数据由第三方中介控制。


    我们可以预测，随着区块链技术的不断发展和加密经济学理论的逐步完善，我们将走向一个更好的世界，这对于想要进入这一领域的公司来说是要考虑的。


    # 第 6 章：加密经济学与区块链安全


    加密经济学（Cryptoeconomics）很容易与现实世界的经济学联系起来。它们有相似之处，但并不完全相同。我们的现实经济学更多关于研究社会经济运行规律，例如研究人们如何做选择，这使得政策能够更好地协调经济和社会进步发展。而加密经济学更多关于机制设计（机制设计，一个结合了微观经济学和博弈论的分分支）。我们可以简单地理解：加密经济学是在加密世界中重构一个在经济上高效的框架和规则，这里的一切都基于代码并包含一个合理的激励系统。因此，加密经济学更多关于设计。而现实经济学更多关于从现有的社会结构中发现规律并遵循它们。


    从另一个角度来看，现实世界的经济规律会受到许多因素的影响。在加密世界中，运行规则由代码决定，大多数收益通过共识获得。这反映了它的公平性，同时也考虑了最重要的——信任性。


    由于它被视为未来的价值，如何确保这种价值在去中心化系统中具有 100%的钢铁般保护，这是重中之重。下面，让我们先了解影响加密经济学安全的主要因素。


    ## 6.1 女巫攻击


    `Sybil attack` 这个名字源于 1973 年根据弗洛拉·施赖伯（Flora Schreiber）小说《西比》改编的电影。这是一个关于一个化名为西比尔·多塞特（Sybil
    Dorsett）的女性心理治疗的故事。她被诊断为分离身份障碍，曾经拥有 16 个人格。


    这个词的扩展含义是，在点点网络中，一个节点通常拥有多个身份，通过控制大多数节点来削弱冗余备份的作用。

