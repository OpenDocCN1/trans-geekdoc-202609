- raw: "In Algorand, users reached a consensus on the new block through BA. The BA\
    \ is very fast to execute. Generally speaking, the BA has three substeps per cycle,\
    \ and each time there is more than 1/3 probability to reach a consensus. Once\
    \ the “verifier” has reached a consensus on a new block, more than half of the\
    \ “verifiers” will electronically sign the block with their own private key (equivalent\
    \ to authentication), and the block will begin to spread in the Algorand network.\
    \ An important feature of BA is that BA participants can be replaced (player-replaceable)\
    \ in a peer-to-peer network communication. That is, each substep of each cycle\
    \ of the BA can be performed by a new, independently randomly selected participant.\
    \ In this case, BA can still reach a consensus correctly and effectively. Assuming\
    \ there are millions of users, the participants in each substep of the BA can\
    \ be completely different, and each batch of participants cannot determine who\
    \ is the next group of participants and thus cannot collude.\n\nAccording to Algorand’s\
    \ team test, we can evaluate Algorand’s performance on 1000 EC2 virtual machines,\
    \ simulating up to 500,000 users. The experimental results show that Algorand\
    \ confirms the transaction within one minute, achieves 125 times the throughput\
    \ of Bitcoin, hardly expands for more users, and almost does not cause fines for\
    \ more users, but Algorand has a big problem that there is no incentive mechanism,\
    \ so running in a completely decentralized environment requires practical tests.\n\
    \n\uFEFF\n\n# [Chapter 4](#ch00_fm04_contents.xhtml#rchapter4)\n\n# [Game Theory\
    \ and Cryptoeconomics](#ch00_fm04_contents.xhtml#rchapter4)\n\n# [4.1   What Is\
    \ Game Theory?](#ch00_fm04_contents.xhtml#rsec4_1)\n\nGame theory is an analysis\
    \ toolkit which is designed to help us to understand the observed phenomena of\
    \ interactions between decision-making bodies. Basic assumption implied by this\
    \ theory is that decision-makers pursue determined external goals (they are rational)\
    \ and consider their own knowledge or the expectations of other decision-making\
    \ actors (their reasoning is strategic).\n\nGame theory has a long history, for\
    \ example, “The Art of War” in ancient China. At the very beginning, game theory\
    \ was researching questions of losing and winning in playing chess, bridge, gambling,\
    \ it was mainly based on practical experience, it wasn’t developing theoretically,\
    \ so officially, it was developed into a discipline only at the beginning of the\
    \ 20th century.\n\nThe study of game theory began with Zermelo, Borel and von\
    \ Neumann, and von Neumann and Oskar Morgenstern was systematized and formalized\
    \ for the first time. Then, John Forbes Nash Jr. used the fixed-point theorem\
    \ to prove the existence of equilibrium points, which laid a solid foundation\
    \ for the generalization of game theory.\n\nFrom an economical point of view,\
    \ everyone thinks that modern economic game theory was introduced in the 1950s\
    \ by famous American mathematician von Neumann and an economist Oscar Morgenstern.\
    \ It has become one of the main tools of economic analysis and has made very important\
    \ contributions to the development of economic theory such as industrial organization\
    \ theory, principal-agent theory, and information economics. The Nobel Prize in\
    \ Economics in 1994 and 1996 was given to economists who have been studying game\
    \ theory.\n\nGame theory considers the predictive behavior and actual behavior\
    \ of individuals in a group environment with specific rules. There are three basic\
    \ elements: Players, Strategies, and Payoffs. Game theory assumes the following:\n\
    \n*   ■ Participants are rational and maximize their own interests.\n\n*   ■ Participants\
    \ form correct beliefs and expectations about the environment and the behavior\
    \ of other participants in the environment.\n\nThat means, in a strategy combination,\
    \ all participants will encounter a following situation: when the other person\
    \ does not change the strategy, his strategy at this time is the best – this is\
    \ the famous Nash equilibrium. At the Nash equilibrium point, every rational participant\
    \ does not have the impulse to change the strategy alone. At this time, if he\
    \ changes the strategy, his interests will decrease.\n\nThe classification of\
    \ the game also has different classifications according to different benchmarks.\
    \ It is generally believed that games can be mainly divided into cooperative games\
    \ and non-cooperative games. The difference between a cooperative game and a non-cooperative\
    \ game is whether there is a binding agreement between the parties that interact\
    \ with each other. If there is, it is a cooperative game. If not, it is a non-cooperative\
    \ game.\n\nFrom the time series of behavior, game theory is further divided into\
    \ two categories: static game and dynamic game. Static game means that in the\
    \ game, the participants choose at the same time or even if it is not at the same\
    \ time, the actors do not know what specific actions have been taken. Dynamic\
    \ game means that in the game, the actions of the participants are in order, and\
    \ then actors can observe the actions selected by the first actors. Simply it\
    \ could be understood as “prisoner’s dilemma”, which means a simultaneous decision,\
    \ which belongs to the static game; and the decision-making games such as chess\
    \ or games where the actions have the priority of order belong to the dynamic\
    \ game.\n\nAccording to the degree of understanding of the participants to other\
    \ participants, they are divided into a complete information game and an incomplete\
    \ information game. Full game means that in the process of game, each participant\
    \ has accurate information about the characteristics, strategy space, and income\
    \ function of other participants; incomplete information game refers to the game\
    \ where characteristics, strategic space, and the income function information\
    \ of the participants are not accurate enough or accurate for not all of the participants.\n\
    \n# [4.2   Nash Equilibrium](#ch00_fm04_contents.xhtml#rsec4_2)\n\nLet’s return\
    \ to the classic prisoner’s dilemma question and explain Nash equilibrium, the\
    \ quintessence of game theory, and cryptoeconomics:\n\nSuppose there are two participants\
    \ and a banker. Each participant has two cards: each with “cooperation” and “betrayal”.\
    \ Participants each placed a card face down and placed it in front of the dealer.\
    \ That excludes the possibility of participants knowing the choice of the other\
    \ party. The dealer then opens the cards of two participants and pays the proceeds\
    \ of both parties according to the following rules:\n\n*   ■ One person betrayed,\
    \ one person cooperated: the traitor got five points (interest drive) and the\
