  trans: '

    从上面的示例中看到，`P + ε` 最大的问题是攻击者可以在不预付的情况下组织攻击。他只需要证明自己有足够的支付能力即可。在 Casper 中，任何投票者的投票权重将与其持有的资产直接相关。换句话说，在做出选择之前，你必须向系统抵押某些资产（以太坊币是以太坊币的抵押），这些资产的金额决定了你的发言权。这将大大增加恶意行为的成本。每个投票者只能选择真实的结果来做出选择。如果你想改变结果并投资少数派，你可能不仅无法获得奖励，还会失去所有的抵押物和资产。


    在这种情况下，如果犯罪者想要购买其他投票者，他只能展示更多的资产来获得他人的信任。


    # 6.4 DAO 攻击


    关于 DAO 攻击，我们必须首先了解这个故事的历史。


    2015 年 7 月 30 日，维塔利克·布特林（Vitalik Buterin）和以太坊基金创建了第一个基于区块链的图灵完备智能合约平台。这一天，以太坊正式面。随后,[Sock.it](http://Sock.it)
    设计了 The DAO 以太坊合约，并在 2016 年 4 月 30 日正式部署了 The Dao 智能合约。2016 年 5 月 27 日，它完成了全球最大的众筹，募集了
    1.5 亿美元。


    2016 年 6 月 17 日，The DAO 遭到黑客攻击，大量以太坊被盗（3641,694 ETH）。这就是著名的 Dao 攻击。正因为这次攻击，原始以太坊遭受了巨大损害，最后在万不得已，为了挽救
    DAO 投资者的损失，决定进行硬分叉。2016 年 7 月 20 日，在区块高度 1,920,000 处成功完成了硬分叉。被遗弃的原始链就是现在的经典 ETC。


    回顾历史，这次 Dao 攻击应该是非常强大的，它的破坏力几乎摧毁了以太坊。在宣布资金被盗的那天，以太坊的价格下跌了 50%。


    那么什么是 DAO 攻击呢？


    攻击者利用了合约中的一个致命漏洞。攻击者创建了一个合约来分配 The DAO 合约的 `splitDAO`，并利用漏洞让 The DAO 智能合约调用攻击者新合约中的
    `()`()` 函数，然后在该函数中递归地分配 `splitDAO`。这种操作一直持续到 gas 耗尽、内存 `stacklimit` 达到或递归限制达到为止。在此之前，可以在不减少自己账户余额的情况下转移账户余额。


    既然这个漏洞已经被修复，我相信将不会再有这样的递归调用了。


    # 6.4.1 The DAO 在加密经济学意义


    从某种意义上说，The DAO 是自比特币以来最重要的社会实验。在一个每个人都习惯了中心化管理的世界上，该如何实现去中心化管理呢？


    首先让我们看看从从开始到项目发布的发展过程：


    1. 一群人为他们想要运行的组织编写了智能合约（程序）。

    2. 有一个初始资金阶段，在此期间人们通过购买代表所有权的代币向 DAO 提供资金来源（称为众筹或 ICO）。

    3. 筹款结束后，DAO 开始运行。

    4. 人们可以就如何使用资金向 DAO 建议，持有代币的成员可以对这些建议进行投票。


    可以看出，从编程到筹款再到决策，它都是基于尽可能去中心化的原则。事实上，这也是我们讨论加密经济学时一个重要的通用性：去中心化。由于这一特性，在设计像 DAO
    这样的组织时，人们不应只考虑代码问题，因为代码支持分布式特性。DAO 的愿景是通过分布、去中心化来实现社区的自治，这个愿景非常好，但如果没有安全保障，即使是更宏大的梦想也可能幻灭。


    这是公平的一面，但 DAO 攻击也向我们展示了这种经济设计存在的问题：


    1. 事故发生后，去中心化系统在应对上面临了困境。例如，如果解决方案提交太晚，会被舆论指责；但快速解决方案会导致更多的中心化，而且因为无法考虑到每个人，将受到部分抵制。

    2. 犯罪者很难被追踪甚至追捕。首先，是因为没有特殊的法律限制，其次是因为犯罪者使用的方法在理论上并没有被系统禁止。从软件算法的角度来看，完善合约可能需要更多的时间。

    3. 软件是开源的，因此提供代码的人遍布世界。是否存在恶意程序员？你能接受匿名贡献吗？在去中心化社区中，谁对软件负责？

    4. 矿工是区块链生态系统的重要部分。很容易产生中心化的聚集。但如何给矿工分配合理的奖励并限制他们的影响呢？在 DAO 的解决方案中，如果没有矿工的支持，可能会导致另一个完全不同的结果。


    我们需要去中心化的原因是因为我们相信没有完美的人，然后我们必须认真思考一个问题：是否存在完美的代码？


    仍然有很多问题。DAO 攻击本质上是一个技术错误，但从加密经济学的角度来看，它更像是一个系统问题，甚至是哲学问题。


    # 6.5 零知识证明


    “零知识证明”由 S. Goldwasser、S. Micali 和 C. Rackoff 在 20 世纪 80 年代早期提出。这意味着证明者能够让人相信某一个断言是正确的，而无需向验证者提供任何有用信息。零知识证明本质上是一个涉及两个或多个方的协议，其中双方或双方采取完成任务所需的系列步骤。证明者向验证者证明其知道或拥有某个信息，但证明过程不会向验证者泄露关于该信息的任何信息。大量事实证明零知识证明在密码学中非常有用。如果你可以使用零知识证明进行验证，你将能够解决很多问题。


    有很多设计零知识证明的项目，但最著名的可能是 Zcash。


    这是一个简单的例子。如果你捡到了钱包并有人声称那是他的，你可以通过两种方式证明这些人是真实的钱包所有者：


    1. 让对方提供钱包所有者的证明，或者如果钱包里恰好有身份证，就可以立即证明。

    2. 钱包里没有文件。你可以对方描述钱包的细节。如果你能详细描述，比如金额、钱包颜色、丢失的大致地点等……你也可以证明。


    第二种方案就是零知识证明。换句话说，零知识证明的目的是让发送者保护自己的隐私，并在不发布身份的情况下实现交易。

    '
