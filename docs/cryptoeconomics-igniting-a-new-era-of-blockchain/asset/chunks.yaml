- raw: 'We can see from the above example that the biggest problem with P + ε is that
    an attacker can organize an attack without paying in advance. He just needs to
    prove that he has enough ability to pay. In Casper, the voting weight of any voter
    will be directly related to the assets that it holds. In other words, you have
    to be forced to mortgage some of your assets (the Ethereum is the mortgage of
    Ethereum coins) to the system before making a choice, and the amount of this asset
    decides you rights for voice. This will greatly increase the cost of malicious
    behavior. Each voter can only choose the true result to make a choice. If you
    want to change the result and invest in the minority, then you may not only get
    the reward but also lose all the mortgage and your assets.


    In this case, if the perpetrator wants to buy other voters, he can only show more
    of his assets in order to gain the trust of the others.


    # [6.4   DAO Attack](#ch00_fm04_contents.xhtml#rsec6_4)


    Regarding Dao attacks, we have to first understand the history of this story.


    On July 30, 2015, Vitalik Buterin and the Ethereum Foundation created the first
    blockchain-based Turing Complete Smart Contract Platform. On this day, Ethereum
    officially met the public. Then, [Sock.it](http://Sock.it) designed The DAO Ethereum
    Contract and officially deployed The Dao Smart Contract on April 30, 2016. On
    May 27, 2016, it has completed the world’s largest crowdfunding raising $150 million.


    On June 17, 2016, The DAO was hacked and stolen a large amount of Ethereum (3,641,694
    ETH). This is the famous Dao attack. It is precise because of this attack that
    the original Ethereum was harmed a lot, and finally, in desperation, in order
    to save the loss of The DAO’s investors, it was decided to make a hard fork. On
    July 20, 2016, at the block height of 1,920,000 it was successfully hard-forked.
    The abandoned original chain is the current classical ETC.


    Looking back at history, this Dao attack is supposed to be very powerful, and
    its destructive power almost destroyed Ethereum. On the day when it was announced
    that money were stolen, Ethereum price slumped by 50%.


    So what is the DAO attack?


    The attacker exploited a fatal vulnerability in the contract. The attacker created
    a contract to allocate the splitDAO of The DAO Contract and exploited the vulnerability
    to let The DAO Smart Contract call the “()” function in the attacker’s new contract,
    and then recursively allocated splitDAO in the function. That didn’t stop until
    the gas was fully used up, or the memory stacklimit was reached, or the recursion
    limit was reached. Before this, it was possible to transfer account balance without
    reducing your own.


    Now that this vulnerability has been fixed, I believe that there will be no such
    recursive calls.


    # [6.4.1   The Significance of The DAO Cryptoeconomics](#ch00_fm04_contents.xhtml#rsec6_4_1)


    In a sense, The DAO is the most important significant social experiment since
    Bitcoin. In a world where everyone is got used to centralized management, how
    to achieve decentralized management?


    First let’s look at the development from the very beginning to the launch of the
    project:


    1.  A group of people wrote smart contracts (programs) for the organization they
    want to run


    2.  There was an initial funding period during which people were providing funding
    sources to DAO by purchasing tokens that represent ownership (known as crowdfunding
    or ICO).


    3.  After the end of fundraising, DAO began to operate.


    4.  People could make recommendations to DAO on how to use the funds, and members
    holding tokens can vote for them.


    It can be seen that from programming, to fundraising and then to decision-making,
    it is based on the principle of being as decentralized as possible. In fact, it
    is also an important universality of our discussion about cryptoeconomics: decentralization.
    Due to this feature, people should consider not just the code problem when designing
    an organization like DAO, since the code supports the distributed feature. The
    Dao’s vision is to achieve autonomy in the community through distribution, decentralization,
    and this vision is very good, but if there is no security guarantee, even more
    ambitious dream also can vanish.


    This is a fair side, but The DAO attack also shows us that there were problems
    based on this economic design:


    1.  After the accident has happened, the decentralized system met a dilemma in
    response. For example, if the solution is submitted late, it will be complained
    by public opinion; but the quick solution will lead to more centralization, and
    because it is impossible to take into account everyone, it will be partially resisted.


    2.  The perpetrators are hard to be traced and even pursued. First, because there
    is no special legal constraint, the second is that the method used by the perpetrators
    in theory is not prohibited by the system. It may take more time to perfect the
    contract from a software algorithm pint of view.


    3.  The software is open source, so the people who provide the code are scattered
    around the world. Is there a malicious programmer? Can you accept anonymous contributions?
    In a decentralized community, who is responsible for the software?


    4.  Mine work is an important part of the blockchain ecosystem. It is very easy
    to generate centralized gathering. But how to assign reasonable rewards to miners
    and limit their influence? In the solution of The DAO, if there is no support
    from the miners, it may lead another completely different result.


    The reason why we need to decentralize is because we believe that there is no
    perfect person, and then we have to seriously think over a question: is there
    a perfect code?


    There are still many problems. The DAO attack is essentially a technical error,
    but from the perspective of cryptoeconomics, it may be more like a system problem
    or even a philosophical problem.


    # [6.5   Zero-Knowledge Proof](#ch00_fm04_contents.xhtml#rsec6_5)


    The “zero-knowledge proof” was proposed by S. Goldwasser, S. Micali, and C. Rackoff
    in the early 1980s. It means that the certifier is able to believe that a certain
    assertion is correct without providing any useful information to the verifier.
    A zero-knowledge proof is essentially an agreement involving two or more parties,
    where two or more parties take series of steps that are required for finishing
    the task. The certifier proves to the verifier and believes that he or she knows
    or owns a message, but the attestation process cannot disclose any information
    about the certified message to the verifier. A large number of facts prove that
    zero-knowledge proof is very useful in cryptography. If you can use zero-knowledge
    proof for verification, you will be able to solve many problems effectively.


    There are a lot of projects with zero-knowledge proof design, but probably the
    most famous is Zcash.


    Here’s a simple example. If you pick up a wallet and someone is claiming it, you
    can prove that this person is the real wallet owner in two ways:


    1.  Let the other party provide evidence of the owner of the wallet, or if it
    happens to have an ID card in the wallet, it can be proved immediately.


    2.  There is no document in the wallet. You can let the other party describe the
    details of the wallet. If you can describe it in detail, such as how much money
    there is, the color of the wallet, approximate time when it was lost and where
    it was lost, etc.…, you can also prove it.


    The second option is zero-knowledge proof. In other words, the purpose of zero-knowledge
    proof is to let you ask the sender to protect his privacy and to implement the
    transaction without publishing his identity.'
