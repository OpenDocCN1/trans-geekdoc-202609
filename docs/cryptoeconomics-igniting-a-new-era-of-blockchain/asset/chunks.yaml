  fmt: "\nTherefore, in order to conduct more equitable token distribution, some projects\
    \ use “Dutch auction” as a model for their token auctions. Dutch auctions refer\
    \ to the auction bids declining from high to low until the first bidder strikes\
    \ a deal when the price (at or above the reserve price). This has enabled the\
    \ cryptoeconomy application to the field of auctions.\n\nWhether it is the establishment\
    \ of a low-level consensus agreement or the design of a better token sales mechanism,\
    \ it can be seen as a cryptoeconomy. Building these applications requires an understanding\
    \ of how incentives affect user’s behavior, the design of economic mechanisms\
    \ that reliably produce a result, and it is necessary to understand the functions\
    \ and limitations of blockchain at the bottom layer that builds an application.\n\
    \nOf course, there are many blockchain applications that are not the product of\
    \ cryptoeconomics. For example, `Status` and `MetaMask`, these application programs\
    \ at the platforms and wallets that allow users to interact with the `Ethereum`\
    \ blockchain. These mechanisms do not involve any other cryptoeconomics mechanism\
    \ apart from those that are already part of bottom layer of blockchain.\n\n# Conclusion\n\
    \nThinking about blockchain space from the cryptoeconomical point of view is very\
    \ helpful. Once you have a certain understanding of cryptoeconomics, you can unlock\
    \ many of the controversies and debates in our industry.\n\nFor example, a “licensing\
    \ chain” that is with centralized management and does not use proof of effort\
    \ has been controversial since it was first introduced. This area is often referred\
    \ to as “distributed ledger technology”, focusing on financial and business use\
    \ cases. Many supporters of blockchain technology don’t like this technology.\
    \ These “license chains” are literally blockchains, but some of them are always\
    \ weird. The “license chain” seems to reject something that everyone thinks is\
    \ the focus of the blockchain: consensus can be reached without relying on a centrally\
    \ trusted party or a traditional financial system.\n\nThe best way to distinguish\
    \ them is to see if this blockchain is a product of cryptoeconomics. Just a simple\
    \ distributed ledger, a blockchain that is based on cryptoeconomics design in\
    \ order to reach consensus or adjust incentives, may be useful for some applications.\
    \ But it is completely different from the one that is using cryptography and economic\
    \ incentives to generate blockchains that have no previous consensus (such as\
    \ `Bitcoin` and `Ethereum`). These are two different technologies, and the best\
    \ way to distinguish them is to see if they are the product of cryptoeconomics.\n\
    \nAlso, we should expect that there will be cryptoeconomics consensus agreements\
    \ that do not depend on “blocks” and “chains” in the future. Obviously, this technique\
    \ has something in common with blockchain technology, but it is not correct to\
    \ call them blockchains. We need to look at whether such an agreement is a product\
    \ of cryptoeconomics, not whether it is a blockchain.\n\nICO focuses on this distinction,\
    \ but there are few clear explanations. One of the strongest manifestations of\
    \ the value of a token is that many people independently realize = whether it\
    \ constitutes an integral part of the application to which it is connected. To\
    \ say it more clearly: is the token a necessary part of the cryptoeconomics mechanism\
    \ in application program? That’s the reason why understanding the mechanism design\
    \ in the ICO project is crucial for determining the utility and value of the token.\n\
    \nIn the past few years, we have been thinking about this new field from the perspective\
    \ of only one application (`bitcoin`), and we have shifted to the perspective\
    \ of the bottom layer technology (`blockchain`). We now need to take a step back\
    \ and look at this type of solution in a unified way, that is cryptoeconomics.\n\
