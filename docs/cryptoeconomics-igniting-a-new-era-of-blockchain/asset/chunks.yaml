    此外，从 2017 年开始，政府批准的中国电子标准研究院（CESI）开始对标准区块链系统的功能进行测试，以验证在中国运营的顶级区块链项目的稳健性。该认证过程非常严谨，基于广泛的指导原则，并考虑了区块链技术的新兴特性，这些特性在难以管理的环境中非常有用。目前，只有
    30 个项目通过了认证。认证是自愿的而非强制的，但在区块链社区具有很高的公信力。


    此外，中国似乎将成为首个应用区块链数字货币（DCEP）的国家。中国人民银行已对其进行了 5-6 全年的研究，并且已经有了 40 多个项目（注：原文可能意指“projects”）。其核心理念是采用一种双层操作系统；即人民银行首先将`DCEP`发放给银行或其他金融机构，再由这些机构兑换给公众。`DCEP`的意义在于它不是现有货币的数字化，而是`M0`的替代方案。它极大地减少了交易对账户的依赖，有利于人民币的流通和国际化。同时，`DCEP`可以实现对货币发行、会计和流向等数据的实时采集，为货币的制定以及货币政策的制定与实施提供有用的参考。


    因此，在政府的高度支持和广泛应用下，区块链已经在许多行业成功落地，并在近年中国的实际应用中取得了明显的成功。


    # 第 8 章：加密经济学的未来


    蒸汽机为人类提供了动力。互联网为人类提供了计算平台，而区块链将解决人类的信任问题。


    区块链的出现直接改变了社会的生产关系，我们可以预期资源可以更公平地分配。区块链公平性的基础是规则的制定和执行与中心化组织相分离，并被点对点网络的共识所取代。因此，我们需要更仔细地观察区块链对社会的影响。在这种情况下，加密经济学应运而生。


    信任从未被量化，因为它是无形的，只存在于人与之间的感知。但信任的价值是巨大的。例如，小偷对社会的损害不仅在于偷走了受害者的财富，还造成了不公。更重要的是小偷的存在增加了整个社会的信任成本。


    在解决基础信任问题后，区块链会对我们产生什么影响？我想我们可以从以下方面进行展望：中介人的服务将逐渐消失，这将允许利益更快地分配。


    中介人的存在是因为市场信息不对称以及市场交易双方之间缺乏信任。如果你将这种服务放在链上，它将极大提高陌生人之间的交易效率，例如租赁市场、二手交易市场和虚拟商品市场。


    因为信任方是`smart contract`而非人，平台的运营成本非常低，成本的降低可以自然地惠及买卖双方。此外，由于平台是可信的，且确认权是明确的，这将让人们更容易做出决策。


    ## 1. 共享经济


    共享经济将进一步注入活力。目前最成功的共享项目是`Mobike`和`滴滴`。通过区块链和`物联网`的结合，未来的共享可能是这样的：


    在开发交易策略过程中的任何投资者都需要参考各种数据。其他人在使用这些数据时需要支付特定的代币。如果用户通过数据开发出成功的交易策略，那么最初的数据上传者可以获得`名利`，如果数据被证明是伪造或没有实际意义，上传者将受到惩罚。上述机制也适用于投资者设计的交易策略。


    ## 2. 社区管理


    未来，社会将产生越来越多的社区，这些社区将拥有自己独特的价值。例如：健身、写作、音乐……


    我们如何能在更短的时间内达成共识？社区很有可能拥有自己的`smart contract`，奖励和惩罚不是个人，而是代码。加密经济学的生态发展将极大地改变人与人的合作、群体内部合作，甚至是国家之间的关系。由于这一切都是基于一种新的社区形式，我们需要考虑更多。


    ## 3. 加密经济学的应用


    目前已经有很多基于并设计加密经济学的应用。在解决了区块链共识这一基础问题后，我们可以在`Ethereum`等区块链上构建各种应用。组织和个人可以创建自己的应用。通过`smart
    contract`代码的形式在不同场景下设计条件逻辑，并使用价值单元进行激励和惩罚，以实现目前无法实现的结果。


    例如，作为交易策略市场的`Signals`可以通过加密经济学来实现目标，而`Signals`使用其本地代币`SGN`来创建奖励机制。


    '
