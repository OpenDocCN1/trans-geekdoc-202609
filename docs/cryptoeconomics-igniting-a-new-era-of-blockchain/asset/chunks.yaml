    It doesn’t matter whether it is PoW, PoS, LPoS, or DPoS, they follow the same
    rule: the one who does more work gets more coins. If one can be elected as representative,
    doesn’t that mean he is better than others in some ways? Is it that he must have
    completed a specific “workload” in the past, so he has got today’s achievements?
    Can we simply regard various consensus mechanisms as a product at the market?
    Existence is justified, and when it is adopted, there is a market. The most important
    thing is to develop your own products, not to “hurt” others maliciously.


    In the past few years, there has been developing many consensus mechanisms in
    the community, especially, the creative consensus inventions of various ICO projects.
    No matter which consensus mechanism it is, as long as it can generate demand and
    get more people involved, it is a valuable mechanism. We welcome the various consensus
    mechanisms to compete with each other and let the market decide the winners.


    Readers can also use their imagination to design new consensus mechanisms, such
    as proof-of-reputation; everything is up to the one who has a good reputation;
    proof-of-credits, everything is up to one who has the highest credit limit.


    # Chapter 3

    # Optimized Consensus Mechanism


    ## 3.1 Optimized Versions of PoW Mechanism


    We all know that Bitcoin’s PoW uses `SHA256` algorithm. Initially, individuals
    can participate in mining through `CPU`. However, when chip manufacturers such
    as Bitmain and Avalon developed `ASIC`, mining is not something that individuals
    can do easily. Later, with the emergence of graphic card mining and mining pools,
    the Bitcoin community began to worry that the mining pool would result in concentration
    of computing power, contrary to the original design concept of “one CPU, one ticket”.
    During that time, the anxiety of centralization was very serious. The discussion
    in the Bitcoin community was very intense. Bitcoin was “dead” again and again
    in the forum. Until now, the debates over whether the mining pool violates the
    principle of decentralization are continuing.


    ### 3.1.1 Litecoin’s SCRYPT Algorithm


    `SHA256` algorithm was one of the reasons people thought that led to professional
    mining machines and mining pools, since this algorithm could be easily computed.
    Therefore, people started to look for better algorithms.


    At that time, Litecoin emerged, and it was based on the `SCRYPT` algorithm. It
    is said that `SCRYPT` was developed by a well-known hacker and has not been widely
    used because it has not received strict security review and comprehensive arguments
    such as the `SHA` series. Compared with the `SHA256` algorithm, `SCRYPT` has higher
    hardware requirements, occupies more memory, and consumes more computing time.
    Parallel computing is extremely difficult. Obviously, the `SCRYPT` algorithm is
    more resistant to mining. In addition, Litecoin changed the block time to 2.5
    minutes. In the era when the altcoin was still rare, the Litecoin relied on these
    two innovations to achieve great success and took the first position from the
    altcoin for a long time.


    Later, `SCRYPT` algorithm was modified into `SCRYPT-N` algorithm, which improved
    the general idea. They all pursued greater memory consumption and calculation
    time to hold back `ASIC` mining machine.


    Soon, the success of Litecoin induced a variety of algorithmic innovations. Between
    2012 and 2014, algorithmic innovation has always been a hot topic in community
    discussions, and every currency that uses innovative algorithms can make a new
    wave.


    ### 3.1.2 Tandem and Dash


    Rearranging combinations is the most common method among the innovative methods
    that are commonly used by humans. In addition to the idea of increasing memory
    consumption and increasing of the computation time, some people began to think:
    “Can you use multiple hash algorithms instead of just a single algorithm?”


    So, in July 2013, Quark was released, and it was the first use of multiple rounds
    of hash algorithm. It sounded like a very high-level thing, but in fact it was
    very simple and was to do nine rounds of hash operation on the input data, and
    the previous round of results was used as the input of the next round of operations.
    These six encryption algorithms used in these nine rounds of hashing were `BLAKE`,
    `BMW`, `GROESTL`, `JH`, `KECCAK`, and `SKEIN`, all of which were well-recognized
    secure hash algorithms, and implementation code had already existed.


    When this multi-round hashing method has appeared, it gave people a visually safe
    and powerful feeling, and there were countless fans.


    Dash (`DASH`, formerly Darkcoin) is based on this micro-innovation, it uses 11
    algorithms: `BLAKE`, `BMW`, `GROESTL`, `JH`, `KECCAK`, `SKEIN`, `LUFFFA`, `CUBEHASH`,
    `SHAVITE`, `SIMD`, `ECHO`, and it is called `X11`. Then, later emerged `X13`,
    `X15` series.


    This kind of algorithm is actually a serial idea. The drawback is that as long
    as one of the algorithms is cracked, the whole algorithm is cracked. It is like
    an interlocking chain: as long as one of the rings is broken, the whole chain
    is divided into two.


    ### 3.1.3 Parallel Algorithm and Heavycoin


    In case of tandem, it is natural to think of parallelism, and Heavycoin (`HVC`)
    was the first to try. Although it is now unknown in the country, it was the first
    time when the game was implemented on chain and it can be described as famous.


    Details of `HVC` algorithm:


    1. Input data, perform a `HEFTY1` hash operation, and get the result `d1`.

    2. Take `d1` as input, then perform `SHA256`, `KECCAK512`, `GROESTL512`, and `BLAKE512`
    operations in turn, and obtain outputs `d2`, `d3`, `d4`, and `d5` separately.

    3. Finally, the first 64 bits of `d2`–d5` are extracted separately, and the final
    256-bit hash result is formed as the block ID.


    Why should we first perform a round of `HEFTY1` hashing? The reason is that `HEFTY1`
    is extremely difficult to calculate and its resistance against mining machines
    exceeds `SCRYPT`. But like `SCRYPT`, security has not been justified by an official
    agency, so the latter four security-recognized algorithms have been added to enhance
    security.


    Let’s compare the methods of series connection and parallel connection of algorithms.
    Series connection methods such as Quark, `X11`, etc., use a variety of hash functions
    in a series connection, but do not improve the overall resistance, because their
    securities are determined by the weakest algorithm. As soon as any hash function
    encounters a collision attack, it endangers the security of the whole system ([Figure
    3.1](#fig3_1)).


    ![Figure 3.1 Different Algorithm Structure. (Source: The original figure is taken
    from the evolution of blockchain core technology of CSDN – algorithm evolution),
    https://www.beekuaibao.com/article/60609260047261960](images/Fig03_01.jpg)


    **Figure 3.1 Different Algorithm Structure. (*Source*: The original figure is
    taken from the evolution of blockchain core technology of CSDN – algorithm evolution),
    [https://www.beekuaibao.com/article/60609260047261960](https://www.beekuaibao.com/)**


    Let’s take a look at the parallel connection algorithm `HVC`; it extracts 64 bits
    from `SHA256`, `KECCAK512`, `GROESTL512`, and `BLAKE512` algorithms separately
    and get the final result after fusion and confusion. If one of the algorithms
    was cracked, it can only endanger one of 64 bits, and only if the four algorithms
    are cracked at the same time, it will endanger the whole system.


    Bitcoin uses only one type of hash algorithm. Imagine that when `SHA256` proves
    to be no longer secure on a certain day, although the algorithm can be changed,
    it will inevitably lead to unstableness of the system. If you use the parallel
    algorithm, you can gain a relative stable period for hard fork transition.


