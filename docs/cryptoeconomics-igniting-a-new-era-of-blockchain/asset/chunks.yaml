- raw: '> What issues are discussed by cryptoeconomics? First of all, we just talked
    about the operation of the entire blockchain. The economic organization on the
    blockchain neither depend on people, nor on companies, it depends on mathematical
    algorithms. Peer-to-peer trading also relies on mathematical algorithms. As you
    can see, a set of mathematical algorithms does not increase the marginal cost
    of one person and ten thousand people. Especially if the marginal cost tends to
    zero, then we still need the organizational system of “company”? The reason why
    the “company” was invented was necessary because the market transaction cost was
    too high, so it was necessary for us to internalize a certain part of the market
    function into an internal process to reduce the costs. The reason why companies
    can exist is because the cost of certain functions after internalization is lower
    than the market, so the existence of enterprises is necessary. When the marginal
    cost becomes zero, you don’t need a company, because there is no point in its
    existence.


    The community based on cryptoeconomics, or the decentralized organization, will
    better handle the relationship between social norms and market norms.


    Perhaps in the future we will get used to a “society without money”, which will
    completely abandon market norms: all activities in this community won’t accept
    the coins. Instead of it, the entire community will commit the exchange economy
    – you give something to someone, and someone else will give you something. Here,
    everyone works hard for the same goal, developers will consciously contribute
    and update the necessary code, operators will publish articles and newsletters,
    designers will collect opinions from everyone to create products and pages, and
    everyone’s labor will faithfully recorded on the blockchain, and according to
    it, you can get all the products and services the community can offer. This will
    be the most inclusive, socially caring community.


    # [5.2.5   How to Control Our Impulses? Maybe You Need a Smart Contract](#ch00_fm04_contents.xhtml#rsec5_2_5)


    For many of us, rational consumption and rational investment is a hard thing:
    we know our monthly fixed income clearly, and we know that we should save in order
    to prevent accidents, but we still do not hesitate to make a purchase of the thing
    that we liked.


    The same is for individual investors who focus on blockchain investment, if you
    look at any suggestions or guidelines for investing in blockchain projects, you
    will find that the primary emphasis is on reasonable asset allocation, which is
    generally at your disposal, usually 10%–20% of the budget surplus, but how many
    people really invest in this ratio?


    I believe that there are a lot of people who quited their jobs and sold their
    houses to do investment in a full time fashion.


    And that is not only about consumption and investment, our behavioral decisions
    in other areas are inconsistent with what we think.


    When we are calm and rational, the estimation of behavioral decision is in line
    with a series of logical standards. How many people have said: “I speculate on
    the currency occasionally, so I won’t put myself in”. You think that you understand
    yourself, understand your preferences, and understand what you have the ability
    to do, but we often fail to estimate fully our response.


    In Freud’s terminology, each of us includes a dark “self”, a “self”, and a beast
    that gains control from the unpredictable “superego”. As a result, friends who
    are usually calm and rational will be furious if they missed a good project and
    curse the project team; good-tempered people will become emotionally violent when
    the market plunges; people who only invest with their own pocket money will put
    all they can when Bitcoin skyrockets. These usually good people think that they
    know themselves, but when the market is extremely volatile, everything will be
    changed.


    How can we deal with the irrationality that can emerge at any time?


    Behavioral economists have shown through experiments that if there is an authoritarian
    “external voice” to issue orders, the majority of us will listen immediately;
    but the best way seems to be to give people the opportunity to set their own bottom
    line and choose the path of action they like. This approach may not be as effective
    as mandatory, but it can help us to push ourselves in the right direction.


    What is the bottom line? We have difficulties in self-control, which is related
    to immediate satisfaction and delayed satisfaction – this is a clear fact. But
    at the same time, every problem we face has a potential self-control mechanism.
    If we can’t withdraw from the wages we receive, we may let the employer automatically
    help us deduct it; if we don’t control how much money we invest in the currency
    market, we can be supervised by others. There are many tools that allow us to
    achieve self-control and help us achieve our aspirations.


    Yes, I believe that the concept of “smart contract” has already emerged in your
    mind. It can help us to control our behavior by setting up smart contracts.


    For example, spending with credit card. Many years ago, the United States had
    an “ice cup” method that can reduce credit card spending. This can be the way
    to correct the impulse of consumption in your own home: you put your credit card
    in a glass of water and then put it in the refrigerator to freeze it. Then, if
    you are impulsive and decide to buy something, you must wait for the ice in the
    cup melted to take the credit card. By that time, your impulses may disappear.


    Of course, for those of you who have countless credit cards and have already opened
    Jiebei and Huabei, it is not a good idea to put credit card and mobile phone into
    a refrigerator. It is simply a smart contract that provides us with a new solution,
    and it has created a more effective mechanism for us, both free choice and inherent
    limitations.


    Imagine a credit card with a smart agreement written in advance that can help
    you to limit your consumer behavior. You can set the spending limit for each type
    of item, each store, and each purchase. For example, you can limit snack consumption
    to 300 USD per month, cloth consumption to 2,000 USD per quarter, and entertainment
    consumption to 200 USD per month, and prohibit spending on desserts at 10 o’clock
    in the evening.


    What if you exceed the spending limit? It’s up to you to decide what kind of punishment
    you can take, such as setting up a credit card to automatically repay, or transfer
    to regular savings, donate to a charity, or even automatically post it to your
    Facebook moments like the following:


    “Yes, I once again broke my promises. I did not insist on my own budget control
    plan at 23:12 on February 22, 2020 because I ordered a barbecue takeaway and a
    bottle of Coke. Please watch and help me”.


    Imagine the potential of credit cards with smart contracts that are beginning
    to flood into the market. These smart cards offer the possibility to create consumption
    plans according to each person’s needs and help people manage credit wisely. Of
    course, there could be created other tools with smart contracts similar to it,
    and it will help us to control our lives better.


    # [5.2.6   Dilemma of Multiple Choices: Why Do We Want to Participate in All Projects?](#ch00_fm04_contents.xhtml#rsec5_2_6)


    2017 is a year of digital currency and ICO outbreak. Anyone who from cryptocommunity
    can easily name a few skyrocketing currencies. Income in hundreds of thousands
    has completely ignited our passion for ICO.


    Have you ever had such an experience: as you didn’t have the opportunity to participate
    in public crowdfunding of skyrocketing project, you don’t want to miss any possible
    project anymore, so you don’t care about your original work every day, but you
    all the time check everything about the latest projects, joined hundreds of project
    investment discussion groups, and you are not afraid of hard work of leafing through
    the phone?'
