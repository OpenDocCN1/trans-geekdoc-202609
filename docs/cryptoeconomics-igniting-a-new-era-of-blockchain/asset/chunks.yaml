    and clearing between institutions.


    In 2018, Tencent also took its focus on Supply Chain Finance Solution. On April
    12, 2018, the Tencent blockchain officially released the “Tencent Blockchain +
    Supply Chain Financial Solution”. It has fundamentally improved the financing
    dilemma of small and microenterprises and contributed to the transformation of
    the local industry and upgrading through application of the blockchain technology
    and operational resources of Tencent. It has used the accounts receivable of the
    core enterprise as the underlying assets, and realized the circulation of credit
    certificates through Tencent’s blockchain technology, to ensure that the relevant
    information cannot be falsified, cannot be refinanced, can be traced, and can
    help related parties form a supply chain.


    In the credit information industry, there has been a row of disadvantages as a
    relatively narrow circle of market participants, limited coverage of public credit
    reporting agencies, and personal information security issues. And application
    of blockchain in this industry is used to complete `the credit information on
    chain`, so it guarantees that the original data is non-tamperable. Just like that,
    Gongxinbao in 2016 has developed a “Gongxinbao Data Exchange”, a universal data
    exchange, based on blockchain technology. The bottom layer is an alliance chain
    based on the blockchain (public chain). The typical customers are Internet finance
    companies, government departments, banks, and insurance companies. `Gongxinbao`
    mainly collects user data under the authorization of users through data crawler
    products, covering various dimensions such as pan-finance, pan-e-commerce, pan-social,
    and personal identity, providing credit basis for major banks, Internet finance
    companies, and other institutions. `Gongxinbao` will anonymize the parties of
    the transaction, realize the ownership certification of digital assets, and effectively
    curb the fraud in data exchange.


    In 2016, `Bubi`, one of the leaders in applying blockchain technologies to different
    industries within the Chinese market, reached a strategic agreement with `Tiancheng
    Credit`, aiming to build a general-purpose credit information system through blockchain
    decentralized mutual assistance and cooperation, and a network-wide accounting
    system, and use the consensus mechanism of blockchain to establish open credit.
    The blockchain credit solution designed by both parties is that the data part
    stored in the blockchain is publicly visible, and users in need can find the required
    data through search and purchase it from all data vendors. The program will solve
    the problem of trust and transaction difficulties between data providers, and
    reduce the procedures and costs of data transactions.


    According to incomplete statistics, more than 20% of the ongoing blockchain application
    scenarios in the world involve insurance. Although the application of blockchain
    technology in the insurance industry is mostly in the technical verification stage,
    the rapid development of the application scenario has already predicted that the
    technology will bring a transformative impact to the `insurance industry`. According
    to the survey, more than half of the insurance companies’ executives around the
    world have recognized the importance of blockchain technology for the insurance
    industry.


    The essence of insurance is risk trading, which can serve the real economy naturally,
    but the insurance industry faces major challenges such as data dispersion and
    data security. The blockchain can realize information sharing and connection of
    a large number of distributed nodes based on shared accounts. Blockchain ensures
    that the insurance service process is more transparent, and it uses smart contracts
    to automate business processes. In that way, China Construction Bank and technology
    giant IBM have jointly developed a bank insurance service system based on blockchain
    technology.


    Another interesting example is the `Shanghai Stock Exchange Blockchain Insurance
    Service Platform`, which was launched in September 2017. This platform independently
    developed the `Golang national secret algorithm package`, which can support 50,000
    fingerprint data verification chaining per second in the electronic policy deposit
    certificate scenario and can respond to high concurrent system requests. This
    system can be widely used in insurance transactions, financial clearing and settlement,
    and anti-fraud and regulatory compliance.


    According to the public information, the main service structure of the insurance
    chain includes four aspects: the consensus service architecture ensures the consistency
    of the data on the chain; the identity authentication service architecture implements
    such functions of authentication, auditing, issue, and management of identity
    data. Under the premise of ensuring the security of smart contracts, the contract
    service architecture implements the service functions of installing, applying
    and upgrading smart contracts, which provides strong support for the authentication
    services in the blockchain system; the platform service architecture satisfies
    the dynamics. Multi-chain configuration and access mode services under the same
    network and the same underlying platform. At the same time, the chain supports
    three functions of data security and cleaning, application scenario system, and
    data exchange service.


    ## 7.2 Police and Other Governmental Solutions


    China officially stresses upon the key values of justice and fairness. The transparent
    traceable network constructed by blockchain technology complies with these values
    of justice and fairness, and at the same time can improve judicial efficiency
    and embody judicial procedural justice. In the legal field, the blockchain can
    be applied to invoicing, collecting evidence, electronic data, PoE, and public
    security data.


    In 2012, The Law of Civil Procedure approved collecting evidence (取证) for the
    first time, and collecting evidence started to be used as a valid evidence. However,
    the main problem in this field is electronic data authenticity and integrity.
    As the main feature of blockchain is traceability, it can solve these problems
    and ensure the authenticity of electronic data. Zhejiang DataQin company developed
    the security network chain for that purpose. In the case of a dispute over the
    infringement of the information network communication right in the Hangzhou Internet
    Court, one of the parties used this security network to collect evidence. After
    the trial, the court approved the blockchain application in keeping electronic
    data. During this case, blockchain was recognized for the first time in the Chinese
    Court.

