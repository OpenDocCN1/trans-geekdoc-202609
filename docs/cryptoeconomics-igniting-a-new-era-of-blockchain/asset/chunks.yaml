    无论是 PoW、PoS、LPoS 还是 DPoS，它们都遵循相同的规则：工作量越大，获得的硬币越多。如果一个人被选为代表，这难道意味着他在某些方面比优于其他人吗？难道是因为他过去必须完成了特定的“工作量”，才获得了今天的成就吗？我们可以简单地将各种共识机制视为市场上的产品吗？存在就是合理的，当它被采用时，就有市场。最重要的是开发你自己的产品，而不是恶意地“伤害”他人。


    在过去的几年里，社区中开发出了许多共识机制，尤其是各种 ICO 项目创新的共识发明。无论是哪种共识机制，只要能产生需求并吸引更多人参与，就是有价值的机制。我们欢迎各种共识机制相互竞争，让市场决定胜者。


    读者也可以利用想象力设计新的共识机制，例如信誉证明；一切都取决于声誉良好的人；信用证明；一切都取决于信用额度最高的人。


    # 第 3 章

    # 优化共识机制


    ## 3.1 PoW 机制的优化版本


    我们都知道比特币的 PoW 使用了 `SHA256` 算法。最初，个人可以通过 `CPU` 挖矿。然而，当比特大陆和蚂等芯片制造商开发出 `ASIC` 后，挖矿不再是个人可以轻松完成的事情。后来，随着显卡矿和矿池的出现，比特币社区开始担心矿池会导致算力集中，这违背了“一
    CPU，一票”的原始设计理念。在那段时间，对中心化的焦虑非常严重。比特币社区的讨论非常激烈。比特币在论坛中反复被“死亡”。直到现在，关于矿池是否违反去中心化原则的辩论仍在持续。


    ### 3.1.1 莱币的 SCRYPT 算法


    `SHA256` 算法是人们认为导致专业矿机和矿池出现的原因之一，因为这种算法很容易计算。因此，人们开始寻找更好的算法。


    那时，莱币问世，它基于 `SCRYPT` 算法。据说 `SCRYPT` 由一位著名黑客开发，由于它没有经过严格的安全审查和像 `SHA` 系列那样全面的论证，因此并没有被广泛使用。与
    `SHA256` 算法相比，`SCRYPT` 有更高的硬件要求，占用更多内存，并消耗更多计算时间。并行计算极其困难。显然，`SCRYPT` 算法更具抗矿性。此外，莱币将区块时间更改为
    2.5 分钟。在山币仍然稀缺的时代，莱币依靠这两项创新取得了巨大的成功，并在长期内占据了山币的首位。


    后来，`SCRYPT` 算法被修改为 `SCRYPT-N` 算法，改进了通用理念。它们都追求更大的内存消耗和计算时间，以抑制 `ASIC` 矿机。


    很快，莱币的成功引发了各种算法创新。在 2012 年到 2014 年之间，算法创新一直是社区讨论的热点话题，每种使用创新算法的货币都能掀起一波浪潮。


    ### 3.1.2 串联与 Dash


    重新排列组合是人类常用的创新方法中最常见的方法。除了增加内存消耗和增加计算时间的想法外，一些人开始思考：“你是否可以使用多个哈希算法而不是仅仅是的算法？”


    因此，在 2013 年 7 月，Quark 发布，它是首次使用多轮哈希算法。这听起来是一件非常高级的事情，但实际上它非常简单，即对输入数据进行九轮哈希操作，并将上一轮的结果作为下一轮操作的输入。在这九轮哈希中使用的六种加密算法是
    `BLAKE`、`BMW`、`GROESTL`、`JH`、`KECCAK` 和 `SKEIN`，它们都是公认的安全哈希算法，且实现代码已经存在。


    当这种多轮哈希方法出现时，它给了人们一种视觉上安全和强大的感觉，吸引了无数粉丝。


    Dash (`DASH`，以前名为 Darkcoin）基于这种微创新，它使用了 11 种算法：`BLAKE`、`BMW`、`GROESTL`、`JH`、`KECCAK`、`SKEIN`、`LUFFFA`、`CUBEHASH`、`SHAVITE`、`SIMD`
    和 `ECHO`，被称为 `X11`。随后出现了 `X13`、`X15` 系列。


    这种算法实际上是一种串行思想。缺点是只要其中一种算法被破解，整个算法就被破解了。它就像一条互锁的链：只要其中一个环断了，整条链就会分成两部分。


    ### 3.1.3 并行算法与 Heavycoin


    在串联的情况下，自然会考虑到并行性，Heavycoin (`HVC`) 是第一个尝试的。虽然它现在在国内不为人知，但它是第一次链上实现游戏，可以被认为是著名的。


    `HVC` 算法的细节：


    1. 输入数据，执行 `HEFTY1` 哈希操作，获得结果 `d1`。

    2. 以 `d1` 为输入，然后执行 `SHA256`、`KECCAK512`、`GROESTL512` 和 `BLAKE512` 操作，分别获得输出 `d2`、`d3`、`d4`
    和 `d5`。

    3. 最后，分别提取 `d2`–`d5` 的前 64 位，形成最终的 256 位哈希结果作为区块 ID。


    我们为什么要先执行一轮 `HEFTY1` 哈希？由于是 `HEFTY1` 极难计算，其抗矿机性超过了 `SCRYPT`。但像 `SCRYPT` 一样，安全性尚未通过官方机构的证实，因此增加了后四种安全认可的算法来增强安全性。


    让我们比较算法的串行连接和并行连接。串行连接方法如 Quark、`X11` 等，在串行连接中使用多种哈希函数，但并没有提高整体抗性，因为它们的安全性是由最弱的算法决定的。一旦任何哈希函数遇到碰撞攻击，就会危及整个系统的安全
    (图 3.1)）。


    ![图 3.1 不同算法结构。（来源：原图取自 CSDN 区块链核心技术演进——算法演进），https://www.beekuaibao.com/article/60609260047261960](img/Fig03_01.jpg)


    **图 3.1 不同算法结构。（*来源*：原图取自 CSDN 区块链核心技术演进——算法演进），[`www.beekuaibao.com/article/60609260047261960`](https://www.beekuaibao.com/)**


    让我们看看并行连接算法 `HVC`；它分别从 `SHA256`、`KECCAK512`、`GROESTL512` 和 `BLAKE512` 算法中提取 64
    位，并在融合和混淆后获得最终结果。如果其中一种算法被破解，它只能危及 64 位之一，只有当四种算法同时被破解时，才会危及整个系统。


    比特币只使用一种类型的哈希算法。想象一下当某一天 `SHA256` 被证明不再安全，虽然可以更改算法，但将不可避免地导致系统不稳定。如果你使用并行算法，你可以获得一个相对稳定的硬叉过渡期。


