    在核心模块中，Tendermint 基于循环投票机制工作，这也是共识协议的原理。一轮被分为三个处理步骤：验证者提议区块、发送提交意图，并在签名后提交新区块。这种机制为原子广播提供了一个安全的状态复制器，增加了一层责任——任何安全性故障可以完全归咎于
    Tendermint。


    Tendermint 共识算法从一组验证者开始。验证者维护区块链的完整副本，并可以使用公钥来识别验证者的身份。他们轮流提议区块。


    在每轮投票中，只有一个验证者可以提议区块，且该区块必须用该验证者对应的私钥进行签名，因此如果发生错误，就可以找到负责该区块的验证者。然后，剩余的验证者需要对每个提议进行投票，且投票需要用他们自己的私钥签名。这些步骤构成了一轮。然而，由于异步网络的存在，可能需要几轮才能提交新区块，如图
    3.2 所示。


    ![Figure 3.2 Casper vs. Tendermint. (Source: Medium “Consensus Compare: Casper
    vs. Tendermint”.)](img/Fig03_02.jpg)


    **图 3.2 Casper vs. Tendermint。来源：Medium “Consensus Compare: Casper vs. Tendermint”。）**


    验证者在提交区块时可能会失败：当前提议可能离线，或网络可能会延迟。Tendermint 允许验证者跳过（当轮到某个验证者时，该验证者不创建区块）。验证者会在进入下一轮投票之前等待一段时间以接收提议者（本轮区块的验证者）提出的整个区块。这种对超时的依赖使得
    Tendermint 成为弱同步协议而非异步协议。然而，该协议本身是异步的，验证者只有在接收到超过验证者集合三分之二的消息时才会进行处理。正如此，Tendermint
    要求大多数验证者正常运行，如果三分之一或以上的验证者离线或故障，网络将停止工作。


    假设少于三分之一的验证者是拜占庭节点，Tendermint 保证安全性永远不会被破坏——这意味着验证者（超过 2/3）永远不会在同一高度提交冲突区块。因此，基于
    Tendermint 的区块链永远不会分叉。


    如今，Tendermint 的设计决策将安全不可变性置于灵活性之上。在现实世界中，系统极有可能停止运行，参与者需要在协议之外更新软件后重启系统。


    数字加密货币社区中只有少数人理解 Casper 以及它为什么有价值，Tendermint 为 Casper 的研究奠定了基础。其洞察在于：如果链本身具有高度容错性，那么你就可以依靠链来做出关于谁创建区块的良好决策；但如果链本身是不可靠的，你就会陷入陷阱。鸡生蛋蛋的问题消失了，而这曾是所有其他共识算法的灾难。


    这种设计方案被认为劣于以太坊和比特币等现有的协议。但我们需要考虑，在转移到不安全的链的情况下，如何回到正确的链。


    ### Tendermint 的清晰特性：


    * ■ 经过验证的活动

    * ■ 安全阈值：1/3 验证者

    * ■ 公有链/私有链兼容性

    * ■ 即时最终确定性：1–3 秒，取决于验证者的数量

    * ■ 一致性优先

    * ■ 弱同步网络上的共识安全性。


    # (2) CFFG](#ch00_fm04_contents.xhtml#rsec3_2_2_2)


    基于链的 CFFG 是一种基于共识的方法。基于链的 CFFG 维护区块链的完整副本，可以使用公钥识别验证者的身份。他们轮流提议区块。


    在每轮投票中，只有一个验证者可以提议区块，且该区块必须用该验证者对应的私钥进行签名，因此如果发生错误，就可以找到负责该区块的验证者。然后，剩余的验证者需要对每个提议进行投票，且投票需要用他们自己的私钥签名。这些步骤构成了一轮。然而，由于异步网络的存在，可能需要几轮才能提交新区块。

