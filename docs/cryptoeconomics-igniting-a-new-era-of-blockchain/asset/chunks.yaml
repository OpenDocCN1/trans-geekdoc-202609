- raw: 'In October 2016, Zcash went online. The biggest feature of that currency was
    the usage of a zero-knowledge proof to achieve private transactions. The zero-knowledge
    proof gives the proof without leaking the information, and the verifier confirms
    whether it is correct by verifying it. Zcash hides all the information of the
    trader in the blockchain record, including the address of the two parties and
    the amount of the transaction, thus achieving anonymity. Zcash was very cautious
    about the choice of algorithm. After considering the algorithms such as SHA256D,
    SCRYPT, CUCKOO HASH, and LYRA2, Zcash team has chosen Equihash.


    Equihash is a PoW algorithm designed by Alex Biryukov and Dmitry Khovratovich.
    The theoretical basis is computer science and an issue in cryptography – a generalized
    birthday paradox. Equihash is a memory-dependent algorithm. The size of the computing
    power depends mainly on how much memory it has. It is more suitable for general-purpose
    computers with a large amount of memory, rather than special hardware chips. According
    to the papers of two inventors, the algorithm requires at least 700M of memory
    and a 1.8 GHz CPU for 30 seconds. After optimization by the Zcash project, each
    mining thread currently needs 1G memory, so Zcash officially believes that the
    algorithm is difficult to appear in the short-term mining machine (ASIC) and thus
    achieves the ASIC resistance against the performance of the mining machine. Because
    the generalized birthday paradox has been extensively studied, Zcash officially
    believes that the algorithm is fair, and they think it is difficult for someone
    or an organization to optimize the algorithm secretly. The Equihash algorithm
    is very easy to verify, which is very important for implementing Zcash light clients
    on restricted devices in the future. The general process of Zcash mining is: first
    construct the input conditions (block head and various parameters), then transform
    the input conditions into “general form of generalized birthday problem” through
    a specific function, then use the optimization algorithm to solve the problem,
    and obtain the solution. And then, estimate the difficulty of the received solution.
    If the algorithm condition and the difficulty condition are fulfilled at the same
    time, it is determined that the “mining” is successful; otherwise, the random
    number is to be recomputed.


    Chinese bitcoingold (BTG) is also using the Equihash algorithm. BTG is also a
    branch of the Bitcoin blockchain. BTG miners created blocks in Bitcoin block 491407
    with a new work-proving algorithm and forked it successfully, in the area before
    Bitcoin block 491407 the blockchain remained unchanged. The original token allocation
    method for BTG is almost identical to the one used for Bitcoin cash forks on August
    1. When the block 491406 is forked, the owner holding the Bitcoin automatically
    receives the BTG at a rate of 1 BTC = 1 BTG.


    # [3.2   Optimized PoS](#ch00_fm04_contents.xhtml#rsec3_2)


    # [3.2.1   Byzantine General and Byzantine Fault-Tolerance Algorithm](#ch00_fm04_contents.xhtml#rsec3_2_1)


    In 1982, Lamport, Shostak, and Pease first raised the issue of General Byzantine.
    Ethan Buchman from Cosmos describes: “This is a problem with implementing a distributed
    protocol in a compromised communication network, that is, the problem of building
    a reliable system in an unreliable environment”. Since then, no one has been able
    to create a system that can solve the problem of Byzantine Generals from 1982
    to 1999. Because at that time, the Internet just evolved from cloud-based central
    computing, all that needed to be solved was fault tolerance. Therefore, in the
    people’s consciousness, the Byzantine General problem is irrelevant to the calculation,
    and more is the popularity of fault-tolerant algorithms. For example, the Paxos
    algorithm invented in 1998 and the Raft algorithm invented in 2013 are widely
    used. The Practical Byzantine Fault Tolerance (PBFT) was invented in 1999, in
    addition to the academic world, and has not been widely used in real life.


    Until 2008, when Satoshi Nakamoto designed the distributed Byzantine Fault Tolerance
    (BFT) algorithm at the network scale level into the blockchain solution, which
    popularized BFT. Since then, people in the computing systems research community
    have begun to conceive how to apply BFT to the real world.


    In 2011, the BitcoinTalk Forum organized a discussion on the concept of proof-of-stake
    (PoS). The original PoS study assumes that a series of peer nodes in the system
    are static and stable for a long time. But this assumption in the blockchain environment
    is completely unrealistic. Therefore, the initial PoS protocol implementation
    results are not ideal. Until the creation of Tendermint by Jae Kwon in 2014, when
    it was the first truly applied distributed BFT study to the PoS public blockchain
    environment. A major breakthrough for Jae Kwon is to enable Tendermint to apply
    BFT research to the field of replication state machines (blockchains) using block,
    hash links, dynamic validator sets, and loop leader elections. In the Tendermint
    environment, a large number of consensus algorithms (Honeybadger, Ouroboros, Tezos,
    Casper) are applied, all of which contain elements of BTF research and elements
    observed by other modules in the blockchain.


    In fact, all the research done for proof-of-entitlement (PoS) points to an important
    question: Can we achieve the level of security for the PoW without running out
    of scarce material resources? This problem can be translated into: PoS voting
    rights are not calculated by calculation but are denominated in the currency of
    the chain.


    In comparison with the scalability of the blockchain, the discussion of the POS
    consensus issue of blockchain is more extensive and enthusiastic. Due to the high
    cost of running PoW mining and various external environmental issues, a large
    amount of resources is pouring into PoS security research.


    # [3.2.2   Algorithm for Realizing Proof-of-Stake](#ch00_fm04_contents.xhtml#rsec3_2_2)


    Next, we will discuss the three main PoS protocols that use PoS in cryptocurrencies:


    *   ■ CTFG (Casper the Friendly Ghost) – research led by Vlad Zamfir


    *   ■ CFFG (Casper the Friendly Finality Gadget) – research led by Vitalik Buterin


    *   ■ Tendermint – research led by Jae Kwon.


    There are many different ways to implement PoS algorithms, but the two main principles
    of PoS design are chain-based PoS and BFT based on PoS. Tendermint is based on
    the Byzantine fault-tolerant PoS design, CTFG is a chain-based PoS design, and
    CFFG is a mixture of both.


    The CAP theory in computer science returns the impossibility of providing more
    than two-thirds of guarantees in distributed data systems: Availability, Consistency,
    and Partition Tolerance. Chain-based PoS algorithms tend to choose high availability
    without high consistency, because high availability means that all transactions
    can be processed, but at the expense of consistent state replication across the
    network. BFT-based, on the other hand, tends to choose high consistency.


    # [(1)   Tendermint and POS Based on BTF](#ch00_fm04_contents.xhtml#rsec3_2_2_1)


    In PFT-based PoS protocol pseudo-random arrangements, a verifier proposes a block
    during multiple rounds of voting. However, committing and finalizing blocks depends
    on the majority −2/3 of all verifiers sign on the submitted block. It may take
    several rounds before the block is finalized. The BFT system can only fail 1/3
    of the failures, including failures or malicious attacks.


    Tendermint consists of two main technologies: the blockchain consensus engine
    and a common application interface. The consensus engine is called the Tendermint
    core module, ensuring that the same transactions are recorded in the same order
    in each machine. The application interface is called the Application Blockchain
    Interface (ABCI), allowing transactions to be processed by programs written in
    any programming language.'
