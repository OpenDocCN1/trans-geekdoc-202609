- raw: 'In mid-February 2018, a number of overseas media reported that the electricity
    used for mining in Iceland in 2018 would exceed the total household electricity
    consumption of the country’s 340,000 population. A week later, the Elite Fixtures
    website published an updated bitcoin mining cost survey of that week. The results
    showed that to mine one bitcoin, the average electricity consumption of Antminer
    S9 mine was 17,773 kW, the electricity consumption of S7 was 45,889 kW, and the
    electricity consumption of Avalon 6 was 55,294 kW. A lot of media don’t understand
    what is Bitcoin mining; they just track the hot spots, as was with the “electricity
    consumption”. They used the words “shock!” and “terrible!” to emphasize that the
    consumption of energy for mining was huge.


    Bitmain, the leader of the Bitcoin mining manufacturers, has never publicly stated
    its position on energy consumption. In 2018, I talked to a famous Chinese economist
    Buer Feimo about mining problems; Mr. Bu’s answer about whether mining power consumption
    can be defined as wasteful behavior was very simple and sharp: “I spend my own
    money on the electricity which I want to consume by myself. This is simple consumer
    behavior. How can it be wasteful?”


    The PoW mechanism is also applied by Ethereum, the second-largest cryptocurrency
    in terms of market capitalization. But the founder of Ethereum, Vitalik Buterin,
    also hopes to modify the consensus mechanism. When I asked him why, he replied:
    “I personally feel that PoW wastes energy and has bad influence on the environment.
    Now the electricity consumption for mining Bitcoin is equivalent to the electricity
    consumption of the whole Singapore. And Ethereum electricity consumption currently
    reaches 30% of Singapore’s total electricity consumption”.


    I have forwarded the opinion of the economist about wasting resources to Vitalik
    Buterin. He refuted in this way: “From social point of view, it is indeed a wasteful
    behavior. But from the standpoint of miners it is not wasting of resources”.


    In fact, if any consumer behavior is raised to the level of the society, the problem
    will be more complicated.


    # [2.3.2   Problem of PoW 2: Environmental Problem](#ch00_fm04_contents.xhtml#rsec2_3_2)


    Last December, CNNMoney reported that some experts said that Bitcoin mining consumes
    a lot of energy and may be harmful to the environment. For example, meteorologist
    Eric Holthaus believes that Bitcoin mining is slowing the transition of fossil
    fuels to renewable energy and eventually consumes more electricity than is available.
    Environmentalists are not outdone as well, and they are afraid that bitcoin mining
    will seriously harm global efforts to combat climate change.


    In January, Credit Suisse in its latest report mentioned that bitcoin mining is
    unlikely to cause an “environmental Armageddon”. That report said, “it is a mistake
    to project miners’ power consumption lineally, as the industry will likely develop
    hardware and practices that are more energy-efficient in a bid to gain a competitive
    advantage. The report noted that this phenomenon occurred among both marijuana
    growers and data center operators during high-growth periods for these industries”.[¹](#ch02.xhtml#fn2_1)


    Of course, the argument of polluting the environment can provide new business
    opportunities for the industry. Now companies have begun to research green mining.


    Last December, I received an email from the United States. A traditional company
    said they were researching green mining and asked me to give them contact of Chinese
    mining machine manufacturers for potential business cooperation. I checked it
    out at their official website, but I did not find out that they are related to
    mining business, so I refused their request. In February 2018, I saw a website
    reporting that a Bitcoin ATM producer is also entering the green mining industry.
    According to the company, “it is possible to run these machines solely on renewable
    energy without losing performance”.[²](#ch02.xhtml#fn2_2) If you search for “green
    bitcoin mining” on Google, you can find that many companies have expressed that
    they can provide green mining solutions, and there is a company who has developed
    a solar-powered mining machine.


    The cost of these green mining solutions is higher than the cost of traditional
    hydropower or thermal power. Therefore, even if there is a possibility of green
    mining, the miners will still leave the things as they are.


    # [2.3.3   Problem of PoW 3: Centralization of Computing Power](#ch00_fm04_contents.xhtml#rsec2_3_3)


    Bitcoin has experienced hundreds of “deaths” during last 10 years since its birth.
    Besides from external factors, there can be only an internal cause for the real
    death of Bitcoin. There is a sword of Damocles hanging over the “head” of Bitcoin
    and that is “51% power attack”. Here, we can understand the power as a workload.
    In other words, whoever completes the workload of more than 50% of the entire
    network, whoever has the whole, decides the flow of bitcoin transactions, establishes
    new rules, and reaches a new consensus. As it is shown in [Figure 2.2](#ch02.xhtml#fig2_2),
    now, only mainland China is a computing power of more than 40% of the entire network.


    ![Figure 2.2   Bitcoin Hashrate Distribution. (Note: both Antpool and BTC.com
    belong to Bitmain.) https://www.mangoresearch.co/​understanding-blockchain-tech-cap-theorem/.](images/Fig02_02.jpg)


    **Figure 2.2   Bitcoin Hashrate Distribution. (Note: both Antpool and [BTC.com](http://BTC.com)
    belong to Bitmain.) [https://www.mangoresearch.co/​understanding-blockchain-tech-cap-theorem/](https://www.mangoresearch.co/).**


    I have privately teased my friends that the Bitmain is a “mysterious force from
    the East” which the Western world is not able to understand. How has this mysterious
    force risen?


    In August 2012, Jiang Xinyu (Internet nickname is “friedcat”) from Chinese Science
    and Technology University set up a company in Shenzhen. He announced to manufacture
    Application Specific Integrated Circuit (ASIC) mining machines, and fundraised
    online through a “virtual IPO” project, which was issued with a price of 0.1 bitcoin.
    He issued 160,000 shares and promised that those who bought the stocks could be
    paid with dividends. Wu Jihan, CEO of Bitmain, bought 15,000 virtual stocks. After
    that, two things happened that made Wu Jihan realize the importance of obtaining
    bitcoin mining technology.


    In December 2012, “friedcat” called Wu Jihan and told him that something went
    wrong with the ASIC chip. The problem was solved later, which was a huge relief
    to Jihan.


    In April 2013, Wu Jihan spent several millions for the Avalon mining machine pre-order.
    But the delivery was not on time to the delivery date. We must realize that miners
    would suffer great if their mining machines were delayed in shipping while hashrate
    increases in the network. The result would be disastrous.


    After these two experiences, Wu Jihan created Bitmain in May 2013. In the late
    May of the same year, CCTV’s “Half-hour Economy” reported bitcoin news for the
    first time and attracted a large number of investors to enter the market, which
    gave birth to a huge mining machine market. Two months later, there emerged a
    multiple bitcoin miners: Pigeon, TMR, Biter, Landchip, Bee, Garden, Smart, etc.


    In the fierce competition, Wu Jihan’s technical partner Micree Zhan independently
    developed the first generation of Bitmain Antminer machines S1 in less than 6 months
    after their company had been established. The energy consumption of the same computing
    power was half less in comparison with the previous mining machine. At the beginning
    of 2015, Zhan Ketuan developed and launched the fifth-generation Bitmain Antminer
    S5, which established the leading position of Bitmain in the mining market. Bitmain
    Antminer machines evolved fast and became a new game changer.'
