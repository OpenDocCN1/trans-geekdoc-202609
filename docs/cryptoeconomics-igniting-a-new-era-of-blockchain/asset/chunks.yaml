    # 第 4 章：博弈论与加密经济学


    ## 4.1 什么是博弈论？


    博弈论是一种旨在帮助我们理解决策主体之间观察互动现象的分析工具。该理论隐含的基本假设是：决策者追求确定的外部目标（他们是理性的），并考虑自己的知识或其他决策参与者的预期（他们的推理是策略性的）。


    博弈论有悠久的历史，例如古代中国的《孙子法》。最初，博弈论研究的是象棋、桥牌、赌博中的输负问题，主要基于实践经验，并没有在理论上进行发展，因此它直到 20
    世纪初才正式发展成为一门学科。


    博弈论的研究始于策梅洛（Zermelo）、博尔（Borel）和冯·诺伊曼（von Neumann），冯·诺伊曼和奥斯卡·根斯斯特恩（Oskar Morgenstern）首次将其系统化和形式化。随后，约翰·福布斯·纳什（John
    Forbes Nash Jr.）利用固定点定理证明了均衡点的存在，为博弈论的泛化奠定了坚实基础。


    从经济角度来看，人们认为现代经济博弈论是 20 世纪 50 年由美国数学家冯·诺伊曼和经济学家奥斯卡·根斯斯特恩引入的。它已成为经济分析的主要工具之一，对产业组织理论、委托代理理论和信息经济学等经济理论的发展做出了重要贡献。1994
    年和 1996 年的诺贝尔经济学奖授予了研究博弈论的经济学家。


    博弈论考虑的是在具有特定规则的群体环境中预测行为和实际行为。它包含三个基本要素：参与者（Players）、策略（Strategies）和收益（Payoffs）。博弈论假设如下：


    * 参与者是理性的，并利益最大化。

    * 参与者对环境以及环境中其他参与者的行为形成正确的信念和预期。


    这意味着，在策略组合中，所有参与者都会遇到以下情况：当对方不改变策略时，他此时的策略是最好的——这就是著名的纳什均衡。在纳什均衡点，每个理性的参与者都没有单方面改变策略的冲动。此时，如果他改变策略，他的利益将会减少。


    博弈的分类也根据不同的基准有不同的划分。人们认为博弈主要可以分为合作博弈和非合作博弈。合作博弈与非合作博弈之间的区别在于，相互互动的双方之间是否存在具有约束力的协议。如果有，就是合作博弈；如果没有，就是非合作博弈。


    从行为序列的角度来看，博弈论进一步分为两类：静态博弈和动态博弈。静态博弈意味着在博弈中，参与者是同时选择，或者即使不是同时，参与者也不知道采取了哪些具体行动。动态博弈意味着在博弈中，参与者的行动是有顺序的，参与者可以观察第一个参与者所选择的行动。简单可以理解为“囚徒困境”，意味着同时决策，属于静态博弈；而象棋或具有顺序优先权的决策游戏则属于动态博弈。


    根据参与者对其他参与者的了解程度，它们分为完全信息博弈和不完全信息博弈。完全博弈意味着在博弈过程中，每个参与者对其他参与者的特征、策略空间和收益函数都有准确的信息；不完全信息博弈是指参与者的特征、策略空间和收益函数不够准确，或者对所有参与者来说都不准确。


    ## 4.2 纳什均衡


    让我们回到经典的囚徒困境问题，解释纳什均衡这一博弈论的精髓以及加密经济学：


    假设有两个参与者和一个银行家。每个参与者两张卡片：每张写有“合作”或“背叛”。参与者各将一张卡片反面朝放在庄家面前。这排除了参与者知道对方选择的可能性。然后，庄家打开两个参与者的卡片，并根据以下规则支付双方的收益：


    * 一人背叛，一人合作：背叛者得到 5 分（利益驱动），合作者得零分（支付欺诈）。

    * 两人合作：各得到 3 分（合作补偿）。

    * 两人背叛：各得到 1 分（背叛惩罚）。


    利益决策矩阵如下：


    | | 参与者 2 合作者 | 参与者 2 背叛者 |

    | --- | --- | --- |

    | **参与者 1 合作者** | 3, 3 | 0, 5 |

    | **参与者 1 背叛者** | 5, 0 | 1, 1 |


    但这里有一个问题。如果存在像区块链这样没有信任基础的环境（例如分叉收益大于原始链的挖矿收益），那么背叛参与者 1 和 2 的利益将大于合作者，那么解决方案是什么？例如，有如下利益决策矩阵：


    | | 参与者 2 合作者 | 参与者 2 背叛者 |

    | --- | --- | --- |

    | **参与者 1 合作者** | 3, 3 | 0, 5 |

    | **参与者 1 背叛者** | 5, 0 | 6, 6 |


    在区块链中，参与者可能会为了个人利益而完全忽视所有人的利益。此时，“惩罚”机制尤为重要。如果我们能设定如下机制：所有背叛行为（对整体利益不利的行为）都将被惩罚
    6 分，那么新的利益决策矩阵将变为：


    '
