    look at any suggestions or guidelines for investing in blockchain projects, you
    will find that the primary emphasis is on reasonable asset allocation, which is
    generally at your disposal, usually 10%–20% of the budget surplus, but how many
    people really invest in this ratio?


    I believe that there are a lot of people who quited their jobs and sold their
    houses to do investment in a full time fashion.


    And that is not only about consumption and investment, our behavioral decisions
    in other areas are inconsistent with what we think.


    When we are calm and rational, the estimation of behavioral decision is in line
    with a series of logical standards. How many people have said: “I speculate on
    the currency occasionally, so I won’t put myself in”. You think that you understand
    yourself, understand your preferences, and understand what you have the ability
    to do, but we often fail to estimate fully our response.


    In Freud’s terminology, each of us includes a dark “self”, a “self”, and a beast
    that gains control from the unpredictable “superego”. As a result, friends who
    are usually calm and rational will be furious if they missed a good project and
    curse the project team; good-tempered people will become emotionally violent when
    the market plunges; people who only invest with their own pocket money will put
    all they can when `Bitcoin` skyrockets. These usually good people think that they
    know themselves, but when the market is extremely volatile, everything will be
    changed.


    How can we deal with the irrationality that can emerge at any time?


    Behavioral economists have shown through experiments that if there is an authoritarian
    “external voice” to issue orders, the majority of us will listen immediately;
    but the best way seems to be to give people the opportunity to set their own bottom
    line and choose the path of action they like. This approach may not be as effective
    as mandatory, but it can help us to push ourselves in the right direction.


    What is the bottom line? We have difficulties in self-control, which is related
    to immediate satisfaction and delayed satisfaction – this is a clear fact. But
    at the same time, every problem we face has a potential self-control mechanism.
    If we can’t withdraw from the wages we receive, we may let the employer automatically
    help us deduct it; if we don’t control how much money we invest in the currency
    market, we can be supervised by others. There are many tools that allow us to
    achieve self-control and help us.


    # 5.2.6 Dilemma of Multiple Choices: Why Do We Want to Participate in All Projects?


    2017 is a year of digital currency and ICO outbreak. Anyone who from cryptocommunity
    can easily name a few skyrocketing currencies. Income in hundreds of thousands
    has completely ignited our passion for ICO.


    Have you ever had such an experience: as you didn’t have the opportunity to participate
    in public crowdfunding of skyrocketing project, you don’t want to miss any possible
    project anymore...

    '
  trans: '

    加密经济学讨论了哪些问题？首先，我们刚刚讨论了整个区块链的运行。区块链上的经济组织既不依赖人，也不依赖公司，而是依赖于数学算法。点对点交易也依赖于数学算法。如你所见，一组数学算法并不会增加一个人和万人的边际成本。特别是当边际成本趋于零时，我们还需要“公司”这种组织系统吗？“公司”之所以明的之所以是必要的，是因为市场交易成本太高，所以我们必须将部分市场功能内部化为内部过程以降低成本。公司之所以能够存在，是因为某些功能内部化后的成本低于市场，因此企业的存在是必要的。当边际成本变为零时，你就不需要公司了，因为它的存在没有意义。


    基于加密经济学的社区（或者说去中心化组织）将更好地处理社会规范与市场规范之间的关系。


    也许在未来，我们将习惯一个“没有货币的社会”，它将完全放弃市场规范：该社区中的所有活动将不再接受代币。相反，整个社区将致力于交换经济——你给某人东西，另一个人就会给你东西。在这里，每个人都为了同一个目标努力工作，开发者会有意识地贡献并更新必要的代码，运营者会发布文章和时报，设计师会收集每个人的意见来创建产品和页面，每个人的劳动都将忠实地记录在区块链上，并根据这些记录，你可以获得社区能提供的所有产品和服务。这将是一个最具包容性、最具社会关怀的社区。


    # 5.2.5 如何控制我们的冲动？也许你需要一个智能合约


    对于我们许多人来说，理性消费和理性投资是一件困难的事：我们清楚地知道每月的固定收入，也知道应该储蓄以防意外，但我们仍然不会犹豫地购买自己喜欢的东西。


    这对于关注区块链投资的个人投资者也是如此，如果你看任何关于投资区块链项目的建议或指南，你会发现重点重点是合理的资产配置，这通常是你可以掌控的，通常占预算盈余的
    10%–20%，但到底有多少人真的按照这个比例进行投资呢？


    我相信有很多人已经辞了工作、卖了房子来全职进行投资。


    而且这不仅关乎消费和投资，我们在其他领域的行为决策也与我们的想法不一致。


    当我们冷静且理智时，对行为决策的估计符合一系列逻辑标准。有多少人说过：“我偶尔会投机性货币，所以我不会让自己陷进去。”你认为你了解自己，了解自己的偏好，了解自己能力做什么，但我们往往无法完全估量自己的反应。


    在弗洛伊德的术语中，我们每个人都包含一个黑暗的“自我”、一个“自我”，以及一个从不可预测的“超级自我”中获得控制的野兽。结果，通常冷静理智的朋友如果错过了一个好项目会大发雷霆并诅咒项目团队；脾气好的人在市场暴跌时会变得情绪暴躁；只用自己零花钱投资的人会在
    `Bitcoin` 飙升时投入他们所能投入的所有资金。这些通常情况下好的人认为他们了解自己，但当市场极端波动时，一切都会发生变化。


    我们如何处理随时可能出现的非理性行为呢？


    行为经济学家通过实验表明，如果有一个权威的“外部声音”来下达指令，我们大多数人会立即听从；但最好的方法似乎是给人们机会设定自己的底线，并选择他们喜欢的行动路径。这种方法可能没有强制性那么有效，但它可以帮助我们把自己推向正确的方向。


    底线是什么？我们在自控方面存在困难，这与即时满足和延迟满足有关——这是一个明确的事实。但同时，我们面临的每个问题都有潜在的自控机制。如果我们无法提取收到的工资，可以让雇主自动帮我们扣除；如果我们不控制投入货币市场的资金量，可以由他人监督。有很多工具可以帮助我们实现自控并帮助我们。


    # 5.2.6 多重选择的困境：为什么我们想参与所有项目？


    2017 年是数字货币和 ICO 爆发的一年。加密社区的任何人都能轻松说出几个飙升的货币。几十万的收益完全点燃了我们对 ICO 的热情。


    你有过这样的经历吗：由于你错过了热门项目的公募机会，你再也不想错过任何可能的项目了……

    '
