  trans: '

    当检查点被最终化时，验证者将获得奖励。然而，如果两个最终化的检查点在相同的高度分叉，那么安全性就会被破坏，此时达到了降低范围的条件，且至少 1/3 的保证金将被消除。当安全性受到损害时，错误归因的证据可以作为交易广播给
    PoW 矿工。然后，PoW 将证据交易合并进一个区块中进行挖矿，而提交证据的验证者将获得发现者的奖励。当这种情况发生时，在冲突区域内签名的恶意验证者将在两条链上均被消除，从而确保整个区块链的合法性。


    现在，如果矿工发起了严重的强制攻击会发生什么？现在， Casper 的最终化区块链可以防止 PoW 攻击者，即使有 51% 或更多的算力试图重写最新检查点以外的历史也会被阻止。因此，Casper
    提供了安全性。与 CTFG 不同，由于 CFFG 是不同提议机制之上的覆盖层，Casper 无法保证活跃性，因为活跃取决于提议机制。


    验证者有动力聚集在权威链上，因为如果他们继续在不同的链上投票，他们将受到惩罚。slasher 2.0 的形成允许验证者不仅因双重投票受罚，还因在错误的链上投票而受罚。然而，这造成了一个困境，验证者担心如果出现分叉且他不确定哪一个是权威的，如果他在错误的链上进行了投票，他应该选择切断还是放弃投票。


    CFFG 的清晰特性：


    * ■ 最终化：超过 20 分钟的最终化。每 50 个区块（一个周期）最终化一次区块，以防止 PoW 挖矿暴力攻击。

    * ■ 共识安全性

    * ■ 证明的活跃性

    * ■ 优先级可用性。


    # (3) CTFG


    CTFG 是一种正确构造 (CBC) 共识协议，旨在对抗真实环境下的寡头垄。CTFG 是 GHOS 或 GHOST 协议在工作量证明中的适应，用于其分叉选择规则。CTFG
    背后的指导设计原则基于旨在实现安全性的加密经济形式化方法。与上述详细的 CFFG 混合协议不同，CTFG 是纯 PoS 的。


    > Casper 的诞生仅仅是“友好的幽灵”，它是 GHOST 在权益证明中的适应，并配有让卡尔特对非卡尔特验证者“友好”的激励。


    > Vlad Zamfir，《Casper 历史》第 5 章


    与工作量证明类似，CTFG 在一致性和可用性之间进行权衡。特别是当区块未最终化时，它们在链中的深度越深就越安全。CTFG 类似于 CFFG，链头的处理始终比区块的最终化快得多。


    Casper 的 PoS 提议机制与 Tendermint 提议机制之间的最大区别在于，与伪随机选择节点相比，后者的验证者基于他们看到的区块来提议区块。


    Casper 提供了一个独特的特性，即参数化安全边际。类似于在比特币中使用六次确认来确定经济最终状态，CTFG 中的“评估安全性”允许验证者拥有一个与其他验证者不同的安全阈值函数。Casper
    的设计允许验证者在保持网络低 PoS 开销的同时，选择自己的容错阈值。


    Casper 相比 Tendermint 的核心优势是网络随时可以容纳一定数量的验证者。区块确认时间应该更短，因为 Tendermint 中的区块在创建时就需要被最终化。为了实现短区块时间，Tendermint
    PoS 能够容纳的验证者数量需要限制。由于 CTFG 和 CFFG 在区块创建时不需要安全性，与 Cosmos 的 100 个验证者相比，以太坊网络可以适应更多的验证者。


    CTFG 的清晰特性


    * ■ 可用性。Casper 的节点可以在达到共识之前进行划分。

    * ■ 异步安全性。

    * ■ 生存性。Casper 的决策可以部分同步，但在异步环境下无法存活。

    * ■ 卡尔特抗性。Casper 构建在防止合谋的基础上，因此验证者可以不违背协议。

    * ■ 安全性，取决于评估者的安全阈值。


    # 3.2.3 权益证明的陷阱


    # (1) 无利益的关系


    起初，有很多种方法描述 PoS 的通用陷阱，此时“无利益的关系”被提出。Jae Kwon 在 2014 年 5 月以“不幸的选择悖论”这一名称首次提到这一问题。2014
    年 7 月，Vitalik 以比特币开发者描述的“无利益的关系”推广了这一问题。


    在工作量证明中，对于在链上挖矿的矿工，如果他们想要危害，必须分离稀缺的计算资源并利用这种高成本来遏制恶行。在现代非退化 PoS 中，这种成本被设计到协议中，以模拟矿工物理挖矿的限制。例如，以太坊创始人
    Vitalik Buterin 在 2014 年引入了 `slasher` 概念，协议内的罚可以缓解这种攻击。


    同年，Jae Kwon 进一步推广了这种方法，这是实现 Tendermint 共识协议的首次迭代。增加成本和允许严厉处罚对所有非退化 BFT 协议都有帮助，甚至本文介绍的三种共识也是如此。


    # (2) 远程攻击


    由于用户在 PoS 机制中拥有提取的权利，因此存在远程攻击的隐藏风险。这是因为攻击者可以进行任何长度的分叉而无需担心被剪没。因为一旦保证金解除，不跨越区块高度投票的激励就被取消了。换句话说，当超过
    2/3 的验证者取消保证金时，他们可以恶意创建一个包含之前验证者的第二条链，这可能导致任意交易。


