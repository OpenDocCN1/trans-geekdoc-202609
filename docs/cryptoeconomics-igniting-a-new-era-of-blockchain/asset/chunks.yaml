    # Chapter 7: Blockchain in China


    ## 7.1 The Power of Blockchain in Real Life


    Today, blockchain technology is considered to be the most disruptive technological
    innovation since the invention of the Internet. Without the intervention of any
    third-party center, participants can reach a consensus and solve the problem of
    reliable transmission of trust and value at a very low cost.


    The security characteristics and trust mechanism of the blockchain is becoming
    an important technological engine for the development of the digital economy.
    It can play a role in various industries. The development potential of the industry
    application field is huge, and it is expected to reshape all spheres of life.
    According to Gartner’s forecast, the market value of blockchain technology will
    reach $176 billion in 2025 and reach $3.1 trillion by 2030.


    Nowadays, there are plenty of successful cases of blockchain used in different
    industries, and they already brought obvious economic and social benefits. For
    example, in the financial sector blockchain has been used in supply chain finance,
    blockchain credit, blockchain insurance, judicial electronic information deposit,
    and billing. It is applied in many other industries, such as culture products
    and copyright management, trading, agricultural product traceability, security
    information exchange in the network, police data exchange, blockchain medical
    association, blockchain real estate deposit certificate, blockchain electronic
    invoices, blockchain enterprise tax database, blockchain poverty alleviation,
    and fund management.


    ## 7.2 Real Use Cases of Blockchain in China


    ### 7.2.1 Financial Solutions


    The financial industry is inherently rich in many raw data and needs a large-scale
    consensus, so it complies with the needs in the financial sector.


    For example, `supply chain finance`. Traditional supply chain finance has many
    problems, such as information is fragmented, enterprise credit cannot be transmitted,
    and compliance risk is difficult to control effectively. The blockchain completes
    credit transmission based on shared books and uses timestamp technology, so it
    is difficult to tamper with features to realize transaction confirmation and transaction
    real proof. It provides automated operational tools for supply chain financial
    business execution based on `smart contracts`.

