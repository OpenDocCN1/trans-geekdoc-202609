    \ changes in [Figure 1.5](#ch01.xhtml#fig1_5).\n\n![Figure 1.5   Payoff Matrix\
    \ of a Social System with Penalty Factor.](images/Fig01_05.jpg)\n\n**Figure 1.5\
    \   Payoff Matrix of a Social System with Penalty Factor.**\n\nAs it is shown\
    \ in the figure, the benefits have changed dramatically, and not committing crime\
    \ is the best strategy. Now, the cost of punishment is high, but society has lost\
    \ `0.5` for public facilities. This will lead to situations where no one is participating\
    \ in the social system anymore; what motivates everyone in the community to participate?\
    \ The answer is that punishment is a coercive measure for everyone, and anyone\
    \ who does not participate will be punished. For example, police officers are\
    \ supported by taxes, so they can punish criminals, but the loss of public facilities\
    \ will be taken from the public in the form of taxes. Anyone who participates\
    \ but does not pay taxes will be considered a criminal and punished.\n\nIn the\
    \ blockchain world, any miners who do not follow the rules and mine illegally\
    \ will be punished, and they will be deprived of their privilege and bear the\
    \ risk of being socially excluded. Once the proof of equity is adopted, this punishment\
    \ will become more severe. By using simple game theory and punishment systems,\
    \ miners can maintain integrity.\n\n# 1.3 Supply and Demand (#ch00_fm04_contents.xhtml#rsec1_3)\n\
    \nUnder such incentives and penalties, how can cryptocurrency become valuable?\
    \ The reason why cryptocurrency and ordinary currency have value is basically\
    \ the same; that is, based on trust. When people trust a certain commodity and\
    \ give it value, it becomes a currency. This is why the French currency and gold\
    \ were valuable at first. Therefore, when a given commodity has a given value,\
    \ the value changes with the supply and demand relationship, which is the oldest\
    \ rule in economics.\n\nWhat are the relationships between supply and demand?\n"
