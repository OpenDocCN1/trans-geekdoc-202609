    一种解决方案是引入带有保证金和惩罚机制的改进型 PoS（权益证明）共识机制。由于每个区块链参与者在链上都有保证金，如果有人贿赂你并要求你做出对原始区块链不利的决策，你将失去所有的保证金，并且你会觉得这不值得努力。而且，在上述决策收益矩阵中，我们还知道，即使你做出了对原始区块链不利的决策，你也无法获得贿赂者承诺的额外补偿
    `ε`，无论这个 `ε` 有大。


    # 4.7 基于博弈论的共识机制展望——以太坊 Casper 共识算法


    Casper 是以太坊从 PoW 转型 PoS 的优化版 PoS 共识机制。以太坊的核心贡献者 Vitalik Buterin 意图使用 Casper 实现以太坊的永久分叉以完成这一转型。通常情况下，Casper
    要求验证者在共识结果上投入大部分保证金。共识结果由验证者的下注情况形成：验证者必须猜测其他人会对哪个区块下注赢，并且对该区块进行下注。如果注中，他们可以拿回保证金加上交易费，可能还会获得一些新货币；如果下注未能达成快速一致，他们只能拿回部分保证金。因此，验证者的下注分布将在几轮后收敛。此外，如果验证者的下注变化太大，例如先下注某个区块有高概率胜，然后又下注另一个区块高概率胜，他将受到严重惩罚。这条规则确保验证者只有在非常确定其他人也认为某个区块胜率很高时，才会高概率下注。Casper
    使用这种机制确保只要验证者足够，下注就不会在收敛到一个结果后又收敛到另一个结果。验证者在每个高度 `h` 对每个候选区块下注，为每个区块分配一个胜率概率并发布。通过反复下注，验证者将为每个高度
    `h` 选择唯一的获胜区块，这个过程也决定了交易执行的顺序。如果验证者在某个高度发布了大于 100% 的概率分布，或发布了小于 0% 的概率，或给无效区块分配了大于
    0% 的概率，Casper 将惩罚其保证金。


    简而言之，Casper 权益证明（Equity Proof）试图通过强制执行大量的以太坊安全押金而非计算机计算，来实现验证者的功能，从而为加密经济学提供极大的安全保障。这种安全押金（或加密经济证明）被证明是一种强大的震慑手段。其理念一目了然——如果你在区块链上制造麻烦，你将失去一切。


    Casper 强制参与者加入谢林币（Schelling Coin）游戏。参与者被迫在大多数人会下注的对象投入安全押金。使用相同的递归逻辑，大多数参与者会准确地为有效交易投票，因为每个参与者都预期其他人得出相同的结论。当权益证明能够抵抗
    `P + ε` 攻击时情况如此，因为在他们最终投票给少数派的情况下，攻击者必须提供巨大的预算来补贴参与者的安全押金。


    在这些安全模型的背景下，我们可以看到 Casper 的韧性集中在非协调选择模型中，并源于贿赂攻击者。Casper 在理论上对源于协作攻击者模型的 51%攻击也敏感。但像比特币一样，以太坊已经将此类攻击的成本提高到了极高水平，几乎完全遏制了它。在
    Casper 环境中，失去所有相关权的威胁是更强的冲击。


    # 第 5 章


    # 行为经济学与加密经济学


    ## 5.1 行为经济学对比传统经济学：非理性 vs 理性


    传统经济学假设人是理性的——这一假设的含义是，我们可以计算并量化日常生活中面临的所有选择的价值，并选择对我们最有利的那个。一旦我们犯了错并做了非理性的事情，通过“市场的力量”就会把我们拉回正确理性的路径。基于这些假设，从亚当·斯密开始，世代经济学家推导出了深远且无所不在的结论：从税收到健康政策，再到商品服务的定价。


    然而，我们远没有传统经济学理论假设的那么理智。我们经常做一些冲动性的、甚至不符合自身利益的事情（例如，我们知道熬夜对身体不好，但还是在刷手机）。不仅如此，我们的非理性行为并非偶然和无意识的，而是系统性的甚至是可预测的，这正是行为经济学所追求的目标。


    行为经济学利用社会心理学的知识来研究信息活动对经济活动的影响。它从人的实际行为出发，帮助我们正确理解日常生活中隐藏的各种异常。


    本章不涵盖任何复杂且陌生的概念或原理，而是源于每个人都熟悉的实际场景，讨论我们通常行为决策的缺点，以及行为经济学和加密经济学能带给我们什么帮助。


    ## 5.2 区块链世界的行为经济学


    ### 5.2.1 如何向朋友介绍区块链？


    > “什么是区块链？”


    > “什么是比特币？”


    行业内的所有人在向朋友介绍区块链时都会被问到上述问题。你能用一个简洁清晰的句子回答吗？


    > 区块链是计算机技术的新应用模型，如分布式数据存储、点点传输、共识机制和加密算法。


    > 比特币是一种去中心化的、点点的形式的加密数字货币系统。


    如果你最初按照百度百科的介绍来回答（这需要你花时间精确记忆），对方极有可能无法理解，因为很难直观地理解这句句话的含义，所以你可以简单地解释如下：


    > 区块链是下一代互联网。以前我们只能通过网络发送信息，现在我们可以直接传递价值。


    > 目前的转账是通过银行、支付宝或微信完成的；如果使用比特币，我们可以直接转账而无需任何第三方。


    通过将区块链与互联网、比特币和银行进行比较，即使对方不能完全理解细节，也能在脑中形成一个更直接、更具体的印象，因为比较的对象是我们熟悉的事物。


    行为心理学指出，我们心中并没有“内在价值尺”来告诉我们某个物品的真实价值；相反，我们关注的是该物品与其他物品的相对优势来估计其价值。例如，即使你不知道蚂蚁
    S9 矿机的价格，你也可以推断它比 S10 贵。


