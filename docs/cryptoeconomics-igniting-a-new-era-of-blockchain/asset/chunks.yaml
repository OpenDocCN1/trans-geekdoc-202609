    # 4.7 Prospect of Game Theory-Based Consensus Mechanism – Ethereum’s Casper Consensus
    Algorithm


    Casper is an optimized version of PoS consensus mechanism for Ethereum to transform
    from PoW to PoS. Ethereum’s core contributor Vitalik Buterin intends to use Casper
    for permanent divergence of Ethereum to achieve this transformation. In general,
    Casper requires validators to place a majority of the margin on the consensus
    outcome. The consensus result is formed by the certifier’s betting situation:
    the certifier must guess which other person will bet on which block to win, and
    also bet the block. If the bet is correct, they can get back the margin plus the
    transaction fee, and maybe there will be some new currency; if the bet does not
    reach a quick agreement, they can only get back some of the margin. Therefore,
    the certifier’s bet distribution will converge after several rounds. In addition,
    if the verifier changes the bet too significantly, such as first betting that
    a block has a high probability of winning, and then betting that another block
    has a high probability of winning, he will be severely punished. This rule ensures
    that the verifier only bets with a high probability if he is very convinced that
    other people also believe that a block has a high probability of winning. Casper
    uses this mechanism to ensure that no bets converge on one result and then converge
    to another, as long as the certifier is sufficient. The verifier places a bet
    on each candidate block at each height `h`, assigns each block a winning probability,
    and publishes it. By repeatedly betting, the certifier will select a unique winning
    block for each height `h`, and this process also determines the order in which
    the trades are executed. If a verifier publishes a probability distribution greater
    than 100% at a certain height, or publishes a probability of less than 0%, or
    assigns a probability of greater than 0% to an invalid block, Casper will punish
    his margin.


    In short, the Casper Equity Proof attempts to provide a very large security margin
    for cryptoeconomics, by enforcing a large Ethereum security deposit instead of
    computer computing, which implements the certifier’s functionality. This security
    deposit, or cryptoeconomy proof, proved to be a powerful deterrent. The idea is
    clear at a glance – if you create the trouble on the blockchain, you will lose
    everything.


    Casper forces participants to join a Schelling Coin game. Participants were forced
    to place their security deposits on what most people would bet. Using the same
    recursive logic, most participants will accurately vote for a valid transaction
    because each participant expects others to reach the same conclusion. This is
    the case, when the proof of equity can resist the `P + ε` attack, because in the
    event that they will eventually vote for the minority, the attacker will have
    to provide a very large budget to subsidize the participant’s security deposit.


    In the context of these security models, we can see that Casper’s resilience is
    concentrated in the uncoordinated selection model and stems from bribery attackers.
    Casper is also theoretically sensitive to 51% of attacks originating from cooperate
    attacker models. But, like Bitcoin, Ethereum has raised the cost of making such
    an attack to such a high level that it has almost completely contained it. In
    the Casper environment, the threat of losing all relevant rights is even a stronger
    shock.


    # Chapter 5


    # Behavioral Economics and Cryptoeconomics


    ## 5.1 Behavioral Economics vs. Traditional Economics: Irrational vs. Rational


    Traditional economics assumes that people are rational – the implication of this
    assumption is that we can calculate and scale the value of all the choices we
    face in our daily lives and choose the one that is most beneficial to us. And
    once we make mistakes and do irrational things, through the “power of the market”
    will quickly pull us back to the path of correct rationality. Based on these assumptions,
    from Adam Smith, generations of economists have derived far-reaching and all-encompassing
    conclusions: from taxation to health policy to the pricing of goods and services.


    However, we are far less rational than the traditional economic theory assumes.
    We often do things that are impulsive and even not in our own interests (such
    as we know that staying up late is bad for the body, but still looking around).
    Not only that, but our irrational behaviors are not irregular and unconscious,
    but systematic and even predictable, and this is the goal pursued by behavioral
    economics.


    Behavioral economics uses the knowledge of social psychology to study the influence
    of information activities on the economic activities. It starts from people’s
    actual behaviors and helps us to understand the various anomalies hidden in daily
    life correctly.


    This chapter does not cover any complex and unfamiliar concepts or principles,
    but rather comes from the practical scenarios that everyone is familiar with,
    discussing the shortcomings of our usual behavioral decisions, and what behavioral
    economics and cryptographic economics can help us with.


    ## 5.2 Behavioral Economics in the Blockchain World


    ### 5.2.1 How to Introduce Blockchain to Friends?


    > “What is a blockchain?”


    > “What is Bitcoin?”


    All people in the industry will be asked the above questions while introducing
    the blockchain to friends. Can you answer it in a concise and clear sentence?


    > Blockchain is a new application model for computer technologies such as distributed
    data storage, point-to-point transmission, consensus mechanisms, and encryption
    algorithms.


    > Bitcoin is a decentralized, point-to-point form of encrypted digital currency
    system.


    If you originally answer in accordance with Baidu Encyclopedia’s introduction
    (it takes time for you to memorize them precisely), the other party’s great probability
    is incomprehensible, because it is difficult to intuitively understand the meaning
    of these two sentences, so you can simply explain as following:


    > The blockchain is the next generation of the Internet. Before we could only
    send information through the network, now we can pass the value directly.


    > The current transfer is made through Bank, Alipay or WeChat; if Bitcoin is used,
    we can transfer directly without any third party.


    By comparing the blockchain with the Internet, Bitcoin, and the bank, even if
    the other party can’t fully understand the specific details, it can form a more
    direct and specific impression in the mind, because the objects of comparison
    are things we know well.


    Behavioral psychology points out that there is no “internal value meter” in our
    hearts to tell us what the true value of an item is; instead, we are concerned
    with the relative merits of this item and other items to estimate its value. For
    example, even if you don’t know the price of the ant S9 miner, you can infer that
    it is more expensive than the S10.

