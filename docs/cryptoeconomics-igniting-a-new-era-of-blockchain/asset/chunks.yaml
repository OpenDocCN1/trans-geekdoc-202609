    \ to be escaped (when the turn comes to a verifier, the verifier is not creating\
    \ a block). The verifier waits a short period of time to receive the entire block\
    \ proposed by the proposer (the certifier of this round of the block) before moving\
    \ to the next round of voting. This dependency on timeouts makes Tendermint a\
    \ weak synchronization protocol rather than an asynchronous protocol. However,\
    \ the multiplied protocol is asynchronous, and the verifier will only process\
    \ if it receives more than two-thirds of the verifier set messages. Because of\
    \ this, Tendermint requires most of the certifiers to function properly, and if\
    \ one-third or more of the certifiers are offline or offline, the network will\
    \ stop working.\n\nAssuming less than one-third of the verifiers are Byzantium,\
