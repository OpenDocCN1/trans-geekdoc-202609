- raw: "The network with low-level redundancy has the risk of being attacked by sybils\
    \ at any time. Several large miners can collude at any time, destroying the network\
    \ with greater than or almost 51% of computing power (the right of making the\
    \ blocks), and not packing or not putting the blocks on the ledger in the critical\
    \ moment is already fatal. Once a malicious node obtained the right to put the\
    \ blocks on the ledger freely, we can say that the sybil attack is successful.\
    \ At the same time, it can also be declared that the entire network will become\
    \ untrustworthy and lose its value.\n\nAlthough the principle of sybil attack\
    \ is simple, we cannot completely eliminate this phenomenon. Once the right to\
    \ put the block on the ledger is monopolized by a few people, they may betray\
    \ at any time and shift from trustworthy node to a sybil attacker.\n\n# [6.1.1   Cost\
    \ of Sybil Attacks on Traditional and Blockchain Networks](#ch00_fm04_contents.xhtml#rsec6_1_1)\n\
    \nThe previous section briefly illustrates the principles of sybil attacks on\
    \ blockchain networks. In fact, in terms of sybil attacks, it is easier to attack\
    \ on a traditional network. It is easier because of the cost. Since the cost of\
    \ launching a sybil attack in a traditional network is extremely low, a malicious\
    \ attacker will have a relatively large profit if the attack is successfully executed.\
    \ Take a step back and say that there is no loss even if there is no success.\n\
    \nFrom an economic point of view, everything has costs, and the value is not worth\
    \ doing. Cost is an important factor. On the other hand, we are familiar only\
    \ with the bitcoin network; since 2009, we have been running safely without any\
    \ centralized management. This is because the cost of the problem has been taken\
    \ into account when Nakamoto was designing it. In other words, if you are going\
    \ to carry out a sybil attack on the Bitcoin network, then you have to pay for\
    \ it. And the cost is not low.\n\nAt least you have to have computing power (i.e.,\
    \ a mining machine), and you have to pay a high cost of electricity. So, a malicious\
    \ node with a profit-making purpose will find that it is not cost-effective; perhaps\
    \ you will think about whether there will be such a malicious node, which is not\
    \ doing that for profit, but for just disrupting the network or for crashing?\
    \ In fact, you only need to know a little more so you can understand that you\
    \ have to pay at least $3 billion on hardware costs to control the bitcoin network.\
    \ Here is only the cost of purchasing equipment directly. If you want to bribe\
    \ different miners for malicious attacks, then you must pay more than normal mining\
    \ to achieve the goal.\n\nHere, the role of economic law is so powerful that it\
    \ basically eliminates the way of hoping to shut down the bitcoin network through\
    \ sybil attacks. This is also the ingenuity of cryptoeconomics.\n\nOf course,\
    \ because the bitcoin network is too powerful now, the sybil attack definitely\
    \ has a very small probability of success. However, the newly emerged network\
    \ may not be so lucky. Due to insufficient network computing power and insufficient\
    \ nodes, the probability of sybil attack success would be much greater. There\
    \ are few projects that were dead because of sybil attack.\n\nThe prevention of\
    \ sybil attacks is the game of putting the transaction in a new block. The more\
    \ people participate in the event, the less likely they are to collude; for example,\
    \ they are from different countries and different interest groups. Therefore,\
    \ the more the participants, the safer the network. However, it raises a problem.\
    \ When the network wants to upgrade, the original competitive contradiction will\
    \ improve the resistance of the software. Just like a double-edged sword, how\
    \ to use and balance interests is a problem that needs to be continuously explored\
    \ from the perspective of cryptoeconomics in the future blockchain network consensus\
    \ mechanism.\n\n# [6.2   Fork: Soft Fork and Hard Fork](#ch00_fm04_contents.xhtml#rsec6_2)\n\
    \n# [6.2.1   Fork, Soft Fork, and Hard Fork Concepts](#ch00_fm04_contents.xhtml#rsec6_2_1)\n\
    \nFork is a by-product of distributed consensus; it happens when two miners produce\
    \ blocks at almost the same time. This uncertainty disappears when subsequent\
    \ blocks are added to one of the blocks. It makes this chain the longest, and\
    \ the other block is “isolated” or “abandoned” by the network. In addition, with\
    \ the development of bitcoin, the bugs of various bitcoins need to be repaired,\
    \ and the bitcoin protocol needs to be continuously improved. The bitcoin network\
    \ is continuously upgraded by the forks. However, the Bitcoin network is not the\
    \ same as the original centralized software. The original centralized software\
    \ only needs to upgrade the software of the central node, and the upgrade of the\
    \ Bitcoin network can only be carried out by the fork. Forks are divided into\
    \ soft fork and hard forks. Soft fork and hard fork are two ways to upgrade the\
    \ Bitcoin network. When developers want to modify Bitcoin’s consensus algorithm,\
    \ they can also voluntarily fork the network. When a block contains an invalid\
    \ transaction, the block will be ignored by the network and the miners who find\
    \ the block will lose the blockchain reward. So usually the miners just want to\
    \ dig into the effective block and join the longest chain.\n\n1.  Fork\n\n   \
    \ In the blockchain, the miner creates the block and links it to the main chain.\
    \ Generally, only one block is generated at the same time. If two blocks are generated\
    \ at the same time, there will emerge two blockchains of the same length and with\
    \ the same information about transactions in the whole network, but with different\
    \ miners’ signatures or different transaction order. This situation is called\
    \ fork. The blockchain branches into two different chains with the same “ancestors”.\n\
    \n2.  Soft Fork\n\n    Soft forks are forward-compatible forks in blockchain or\
    \ decentralized systems. Forward compatibility means that when a new consensus\
    \ rule is released, the node does not have to be upgraded to a new consensus rule\
    \ in the decentralized structure, because the new rules for soft forks still conform\
    \ to the old rules, and all nodes that are not upgraded still can accept new rules.\
    \ In this case, there are no complete nodes executing the old rules, and there\
    \ are no miners who produce the blocks that conform to traditional rules. All\
    \ complete nodes have been upgraded to enforce soft fork rules, and all miners\
    \ are producing blocks that meet the soft fork rules. Therefore, the chain does\
    \ not fork. This is the soft fork blockchain.\n\n3.  Hard Fork\n\n    Hard fork\
    \ refers to a fork that is not forward compatible in a blockchain or decentralized\
    \ network. Hard forks always change the technology used by cryptocurrency. This\
    \ change makes all new data blocks different from the original ones. The old version\
    \ will not accept the blocks created by the new version. If a new hard fork fails,\
    \ then all users will get back to original data. An example of a hard fork is\
    \ the breakup of Bitcoin’s New York Consensus in 2017, which eventually split\
    \ bitcoin into BCH and increased the block size limit from 1 MB to 8 MB. Although\
    \ the 8 MB block was previously considered to be an incompatible block in the\
    \ bitcoin network, it was compatible with 8 MB blocks after hard fork activation.\n\
    \n    Another well-known fork case is the hard fork of The DAO on Ethereum, which\
    \ is the best analytical example to show the disagreement in community rules.\
    \ The original etheric chain turned into two different versions of the blockchain\
    \ – ETC and ETH, each with a different concept and token.\n\n# [6.2.2   Main Characteristics\
    \ of Soft Fork and Hard Fork](#ch00_fm04_contents.xhtml#rsec6_2_2)\n\n1.  Characteristics\
    \ of soft fork\n\n    Soft fork has following characteristics:\n\n    1.  It doesn’t\
    \ create a new chain.\n\n    2.  Due to the limitation of transaction data and\
    \ block data structure, complex rule changes such as changing the block size cannot\
    \ be implemented through soft forks."
