    However, our energy is limited, our funds are limited, it is impossible to participate
    in all projects, and not all projects are reliable.


    However, even if you completely agree with this, but you see someone in the group
    is sending information about new project, or if you create a new project QR code,
    you will still naturally join the group and then open the group settings, and
    cancel group message reminder, of course, if this project is really promising,
    you will top it.


    In fact, not only projects but also many people are concerned about the situation
    with prices of hundreds of currencies – although they hold less than one-tenth.
    So, what is the reason for us to pay attention to the information about all projects?


    In the context of today’s world, we still try our best to keep a variety of choices
    for ourselves, and sometimes we even may not know that we missed other things
    during this process. While you are terribly busy with something not necessarily
    important, you can forget about something that really matters. The result is that
    as you were focused on too many projects, you couldn’t do in-depth study of several
    very good projects and missed investment opportunities.


    What are the consequences of the situation when there are a lot of choices? Why
    do we have to keep so many choices for ourselves, even if these choices have to
    pay a very high price? Why can’t we do everything intently?


    Shen Jiying, professor at Yale University, experiments found out that usually
    in case of clear target guidance, we will strive to pursue the maximum satisfaction.
    In the ideal situation, we will try all possible options and then choose the most
    suitable one. However, the facts are not so ideal, because the opportunity is
    fleeting, you can’t wait until all the projects are analyzed and then require
    the project to start crowdfunding, so you will always miss some of them; of course,
    the best projects may be among them.


    How can we get rid of this irrational impulse and not chase the redundant choices
    that are worthless? The philosopher Erich Fromm wrote a book in 1941, *Escape
    from Freedom*. He said that under the modern democratic system, it is not the
    lack of opportunities, but there are too many opportunities, and it makes people
    dazzling. Now it is more evident in today’s society. People constantly remind
    themselves that we can do everything and achieve what we expect.


    The question is whether this dream can be achieved. We must do everything possible
    to improve ourselves; we must try everything in life; we must look at all the
    1,000 things at least once before we are born. And if we do like this, will you
    not be overworked and exhausted?


    It is necessary for us to give up these projects simply because these projects
    are time-consuming and crowd out our participation opportunities, and they make
    us unable to take into account those valuable choices and make us exhausted.


    # 5.3 The Intersection of Behavioral Economics and Cryptoeconomics


    Above, we can recognize that in daily life and behavioral decision-making, we
    are not as rational and comprehensive as traditional economics, and smart contracts
    in cryptographic economics can be used as external constraints to help us do better.
    The decision-making, the fair and open nature of the blockchain itself allows
    us to get the information we want to know, rather than the data being controlled
    by a third-party intermediary.


    We can predict that with the constant development of blockchain technology and
    the gradual improvement of the theory of cryptoeconomics, we will come to a better
    world, what that is to be considered by the companies that want to enter this
    field.


    # Chapter 6: Cryptoeconomics and the Security of Blockchain


    Cryptoeconomics is easily associated with economics in the real world. They have
    similarities, but they are not exactly the same. Our real economics is more about
    studying the laws of economic operation in society, such as studying how people
    make choices, which makes it easier for policies to better coordinate economic
    and social progress and development. And cryptoeconomics is more about a mechanism
    design (mechanism design, a branching field that combines microeconomics and game
    theory). We can understand this simply: cryptoeconomics is to re-enact a framework
    and rules that are economically efficient in the world of encryption, and everything
    here is based on code and contains a reasonable incentive system. Therefore, cryptoeconomics
    is more about the design. And economics in reality is more about discovering laws
    from the existing social structure and following them.


    From another point of view, the economic laws in the real world will be affected
    by many factors. In the encrypted world, the operating rules are determined by
    code, and most of gains the majority of consensus. This also reflects its fairness,
    while also taking into account the most important – trustworthiness.


    Since it is seen as the value in the future, how to ensure that the value has
    a 100% steel-like protection in decentralized systems, this is a top priority.
    Below, let us first understand the main factors affecting security in cryptoeconomics.


    ## 6.1 Sybil Attack


    The name `Sybil attack` originates from the film based on Flora Schreiber’s novel
    *Sybil*, written in 1973. This was a story about the psychotherapy of the woman
    with pseudonym Sybil Dorsett. She was diagnosed with a dissociative identity disorder,
    and she used to have 16 personalities.


    The extended meaning of this word is that in a peer-to-peer network, a node usually
    has multiple identities, which weaken the role of redundant backups by controlling
    most of the nodes.


    In a peer-to-peer network, that is, a `P2P network`, because different users can
    join or exit node at any time, in order to maintain network stability, the same
    data will be backed up to multiple nodes. This is what we call `data redundancy
    mechanism`. The ultimate goal of `sybil attack` is to attack the `data redundancy
    mechanism`.


    The main accounting confirmation of the `Bitcoin network` is maintained by the
    power provided by the miners. Let’s assume that a miner in the network needs to
    change the rules and results of the network for some purpose, such as the speed
    of making the block (we can’t guarantee that every miner is trustworthy), and
    if such a miner is planning to achieve the goal, then he can invest a lot of computing
    power or buy other miners to achieve the goal.


    So-called investing a huge amount of computing power has a very simple logics,
    it is just to buy mining machine hardware and produce computing power, but in
    this case, the cost will be huge. If you want to control the `Bitcoin network`,
    according to recent currency price of `Bitcoin`, you will need at least 3–4 billion
    dollars. This way of controlling the right to update the entire network is also
    called `51% right`.


    Let’s take a look at the second case. If enough miners unite to modify the results,
    it is considered as malicious behavior. If the evil miners have enough people
    to unite, they can concentrate only on the transactions they want to process transactions
    and ignore other transactions.

