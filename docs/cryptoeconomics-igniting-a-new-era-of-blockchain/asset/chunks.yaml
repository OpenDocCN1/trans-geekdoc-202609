    This is quite fatal for the PoS protocol because the security model for PoS must
    be “subjective”. (what is a “subjective” security model? If the information can
    be verified within the agreement, it can be called “objective”; if the information
    must be verified by means other than the protocol, it is called “subjective”.)
    After a new node joins the network, it may draw different conclusions about the
    state of the current network. Because their decisions are based on subjective
    information, that is, social reputation. At this point, however, we compare it
    with the PoW and find that the security model of the PoW must be “objective” because
    their decisions are based on objective information and the current network state
    is always in the situation of with the highest workload, and the new node always
    has the same conclusion about the network state.


    So how to prevent the harm of long-range attacks?


    Under the weak subjective model proposed by Vitalik, while accessing a new node
    in the network for verification, the current node must be bound to the deposit.
    Only if the verification node has paid a deposit, his signature is economically
    meaningful. This means that the client can only rely on the signature of the verification
    node that has locked deposit. Therefore, when the client receives and authenticates
    the consensus data, the chain of consensus approval must come from the block of
    the verification node that currently locked the deposit. In comparison with the
    PoW protocol, the consensus-recognized chain is derived from the Genesis block
    – as long as you know the data of the Genesis block, you can identify the chain
    of consensus recognition. Here, as long as you know the verification node that
    currently locks the deposit, you can identify the chain of consensus approval.
    A client that does not know the list of authentication nodes that currently locked
    the deposit must obtain this list through another channel first. This restriction
    identifies the consensus by asking everyone to use current information.


    In addition, the process of unbinding deposit must go through a “thaw” period.
    Unbinding can cause delays in message synchronization for weeks to months, requiring
    time to “thaw”. Because the agreement forbids to recover before the Nth block,
    where N is the length of the deposit, this rule invalidates any long-range forks.
    At the same time, synchronizing data requires obtaining the character of the latest
    locked deposit verification node list from other channels, which achieves the
    “weak subjectivity” as Vitalik says.


    Casper(s) and Tendermint use this simple locking mechanism (commonly known as
    “freeze” in “Tendermint”) to lock the equity for a period of time (“thaw” from
    weeks to months) in case any verification node maliciously compromises system
    security. In CFFG algorithm research, led by Vitalik Buterin, the fork can only
    modify the block after the final block, thus preventing remote attacks. In CFFG,
    attempts to modify such long-distance bifurcations of blocks earlier than the
    final block by using timestamps are not recognized by the protocol.


    # (3) Cartel Formation


    PoS still has a problem to solve, that is, the problem of oligopoly, and of course,
    this is also the problem that any economic form needs to face.


    > Cryptocurrency is incredibly concentrated. So is mining power. Oligopolistic
    competition is the norm in many “real-life” markets. Coordination between a small
    number of relatively wealthy validators is much easier than coordination between
    a large number of relatively poor validators. Cartels formation is completely
    expected, in our context.


    > *Vlad Zamfir, [Chapter 4] of “The History of Casper”*


    Tendermint relies on additional protocol management methods to confront oligopoly
    verifiers. Although there is no agreement on the censorship system, relying on
    out-of-band social information to solve the problem of the cartel formation, the
    basic principle is that the user will inevitably notice the formation of the cartel,
    and the society will also gossip about it. Then, give up or vote to reorganize
    the blocked blockchain.


    So far, Vlad’s Casper protocol is the only one that explicitly uses consensus
    within the review incentives to combat a cartel formation.


    # (4) Future Work


    The operation of the public chain on the product is still a relatively new technology.
    The only security model that has so far shown to be non-corrupt is the proof of
    workload. The design space for the proof of equity is still very large, and the
    engineering understanding is not enough, because the proof of equity is a cutting-edge
    research field, and there is still not enough data support at the present days.
    To achieve an optimal PoS consensus algorithm, we still have a lot of future work
    to do.


    The first direction in which the future can work is probably Tendermint. It might
    be to propose a new improvement mechanism for it, or to compress Tendermint’s
    multiple rounds of voting into one round of voting.


    The second area of future work may be to use a more advanced encryption technique
    to make the signature of the block header smaller. Because we are building a “blockchain
    internet” through Cosmos, moving our client certification from one chain to another
    is our core job. From this point of view, it is very advantageous to use a more
    advanced cryptography to reduce the size of the block header by thirty times or
    more.


    In addition, we can optimize the p2p layer so that we can significantly reduce
    the amount of traffic required by the final block. In the future work, not only
    the amount of data in the header of the compressed block, but also the amount
    of data sent to the peer could be reduced. In this case, a larger set of verifiers
    can be added above the threshold of the initial 100 verifiers of the Cosmos network.


    # 3.3 PBFT Optimized Version: Federal Byzantine Agreement (FBA)


    In the traditional PBFT, the Byzantine Agreement can guarantee the achievement
    of distributed consensus despite the spoilers that lead to Byzantine mistakes.
    However, it requires all participants of the system to agree, and all nodes in
    the network must be known and pre-authenticated.


    Anyone of the Federal Byzantine Agreements (FBAs) can join, distributed way group
    (quorum or nodes are sufficient) can come to a compromise, each node can determine
    its trustworthy object, and different nodes do not need to trust the same participant
    combination in order to complete the consensus. Flexible trust means that users
    are free to trust any combination of participants who believe that are appropriate.


    The Stellar Consensus Protocol (SCP), proposed by Stellar.org’s chief scientific
    officer, Professor David Mazières, is the first example of a Federated Byzantine
    Agreement (FBA). The Stellar Consensus Agreement provides a way to reach a consensus
    by accurately recording financial transactions without relying on closed systems.
    The Stellar Consensus Agreement also has four key attributes: decentralized control,
    low latency, flexible trust, and asymptotic security.


    Before we explain the FBA in detail, we need to know what is the legal unit?


    In a distributed system, a legal unit is a collection of nodes that meet the reached
    agreement. The FBA introduces the concept of a quorum, a subset of statutes that
    can persuade a particular node to agree.


    FBA’s main features:


    Each node in the FBA can select its own legal unit sets, and the quorum results
    of the entire system are determined by the choices made by a single node. This
    is the key difference between the Byzantine (BA) protocol system and the FBA system.

