  trans: '

    经典密码学关注信息的编写、传输以及相应的解密方法。而现代密码学源于 20 世纪末出现的大量相关加密理论，它是数学和计算机科学的一个分支，同时也涉及大量的信息论。现代密码学不仅关注信息的机密性，还关注信息的完整性校验、信息的不可否认性（即数字签名）以及由于分布式计算中出现的内外攻击引起的所有信息安全问题。


    现代密码学的发展促进了计算机科学的发展，特别是计算机和网络安全的需求。如今，密码学已应用于日常生活中，包括 ATM 芯片、计算机访问密码、电子商务等领域。


    区块链技术在运行过程中应用了大量的加密内容，主要包括`hash algorithm`、`key encryption`和`digital signature`。


    # 1.1.1 哈希算法


    哈希函数通常被称为加密哈希函数，例如消息摘要函数，它们并不一定使用密钥，但与许多重要的加密算法相关联。它将输入数据（通常是整个文件）输出为一个较短的固定长度哈希值。


    这个过程是单向的，两个不同输入产生相同哈希值的可能性非常低。


    简之，哈希算法将任意长度的字符串映射为较短的固定长度字符串。例如，比特币使用了`SHA-256`作为摘要算法，它对任何长度的输入都会产生 256 位的输出。


    那么，哈希算法在加密货币中的应用是什么呢？


    ## 1. 加密哈希函数


    加密哈希函数具有以下特征：


    *   确定性：无论在同一个哈希函数中解析多少次，只要输入相同，得到的输出始终是相同的。

    *   计算效率：计算哈希值的过程非常高效。

    *   抗原像攻击：对于给定的输出，其输入是不可逆的。

    *   细微变化的影响：输入中的任何细微变化都会对哈希函数的输出产生巨大的影响。


    加密哈希函数对于区块链的安全和挖矿至关重要。


    ## 2. 数据结构


    在密码学中，有两种数据结构对于理解区块链至关重要：链表和哈希指针。


    链表是按顺序顺序连接的数据块，如图 1.1 所示，在 Merkle 树中，所有单个交易都可以通过哈希算法追溯到同一个根，这使得搜索变得简单。因此，如果我们想获取区块中的特定数据，可以直接通过
    Merkle 树中的哈希值进行搜索，而不需要线性访问。


    ![图 1.1 链表和哈希指针数据结构。](img/Fig01_01.jpg)


    **图 1.1 链表和哈希指针数据结构。**


    ![图 1.2 Merkle 树追溯结构。](img/Fig01_02.jpg)


    **图 1.2 Merkle 树追溯结构。**


    ## 3. 挖矿


    哈希算法对于挖掘新的加密区块非常重要，其工作原理是调整难度值。将一个名为`nonce`的随机字符串添加到新区块的哈希中，然后再次哈希。接下来，检查是否低于设置的难度。如果低于，生成的新区块将被添加到链中，负责挖掘的矿工将获得奖励。如果不低于，矿工将继续修改随机字符串`nonce`，直到值低于难度水平。


    # 1.1.2 密钥加密


    密钥加密包括对称密钥加密和公钥加密。


    对称密钥加密是密码学中的一种加密方法。如果你转换数据中的一个数字、字母或随机字母字符串，密钥会以特定的方式改变数据中的文本或字母，例如改变字母的相对位置（例如单词“one”变成“neo”）。只要发送者和接收者知道密钥，他们就可以加密和解密数据。


    公钥加密，也称为非对称密钥加密，是密码学中的另一种加密方法。与对称加密相比，最大的特征是加密和解密使用不同的密钥。使用加密密钥获得的数据只能通过用户的解密密钥解密。如果你知道其中一个，就无法确定另一个。因此，如果其中一个密钥公开，也不会损害另一个；即公开的密钥是公钥，不公开的密钥是私钥。


    在对称加密中，加密和解密使用相同的密钥，可能对不同的消息使用不同的密钥，但它们都面临密钥管理的挑战。由于每对通信双方必须使用与其不同的密钥，当网络成员增加时，密钥的数量呈平方级增长。这里更复杂的问题是：在双方之间没有安全通道的情况下，如何为安全通信创建一个共同密钥？如果你有一个通道通道创建密钥，为什么不使用现有的通道呢？这确实是一个关于谁先谁后的矛盾问题。


    # 1.1.3 数字签名


    数字签名是公钥基础设施（PKI）和许多网络安全机制（SSL/TLS、虚拟专用网络等）的基础。如名称所示，数字签名是日常生活中签名的数字化。它的特征是他人可以很容易创建签名，但很难模仿。数字签名可以与被签名的消息永久结合，且无法从消息中移除。


