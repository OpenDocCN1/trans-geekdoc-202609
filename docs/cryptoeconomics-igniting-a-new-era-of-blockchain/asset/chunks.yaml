  trans: "\n低冗余网络随时面临着遭受女巫攻击（sybils attack）的风险。几个大型矿工可能随时勾结，利用超过 51% 或接近 51% 的算力（记区块的权利）来破坏网络，而且在关键时刻不打包或不将区块写入账本已经是致命的。一旦恶意节点获得了随心所欲将区块写入账本的权利，我们就可以说女巫攻击成功了。同时，也可以宣布整个网络将变得不可信并失去其价值。\n\
    \n尽管女巫攻击的原理很简单，但我们无法完全消除这种现象。一旦将区块写入账本的权利被少数人垄断，他们可能会随时背叛，从可信节点变为女巫攻击者。\n\n# 6.1.1���传统网络与区块链网络女巫攻击的成本\n\
    \n上一节简要说明了区块链网络女巫攻击的原理。事实上，在女巫攻击方面，攻击传统网络更容易。之所以更容易，是因为成本的原因。由于在传统网络中发起女巫攻击的成本极低，如果攻击成功执行，恶意攻击者将获得相当大的利润。退一步说，即使没有成功也没有任何损失。\n\
    \n从经济角度来看，万物都有成本，如果价值就不值得为为。成本是一个重要因素。另一方面，我们只熟悉比特币网络；自 2009 年以来，它在没有任何中心化管理的情况下一直安全运行。这是因为中本在设计它时已经考虑了问题的成本。换句话说，如果你想对比特币网络进行女巫攻击，那么你就必须付出代价。而且这个代价并不低。\n\
    \n至少你必须拥有算力（即挖矿机），并且必须支付高昂的电费。因此，以盈利为目的的恶意节点会发现这样做并不划算；或许你可能会想是否存在这样的恶意节点不是为了盈利，而是为了破坏网络或使其崩溃？事实上，你只需要稍微多了解一点就能理解，控制比特币网络至少需要在硬件成本上支付\
    \ 30 亿美元。这仅仅是直接购买设备的成本。如果你想通过贿赂不同的矿工来进行恶意攻击，你必须支付比正常挖矿高多的费用来实现目标。\n\n在这里，经济规律的作用如此强大，以至于它基本上消除了通过女巫攻击关闭比特币网络的途径。这也是加密经济学的精妙之处。\n\
    \n当然，因为比特币网络现在太强大了，女巫攻击的成功概率非常小。然而，新出现的网络可能就不会那么幸运。由于网络算力不足和节点不足，女巫攻击成功的概率会大得多。很少有项目因为女巫攻击而死亡。\n\
    \n女巫攻击的防御是将交易放入新区块中的博弈。参与事件的人越多，他们勾结的可能性就越低；例如，他们来自不同的国家和不同的利益。\n\n## 6.2���分叉、软分叉与硬分叉\n\
