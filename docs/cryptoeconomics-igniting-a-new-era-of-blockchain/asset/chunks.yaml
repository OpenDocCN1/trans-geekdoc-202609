- raw: "*   In FBA, there are no goalkeepers, no centralists, and individual nodes\
    \ can decide which participants they should trust. Nodes can choose multiple groups,\
    \ and the choice of individual nodes may depend on standards outside the system.\
    \ For example, if a bank is considered to have a good reputation, then all transactions\
    \ on other nodes require its approval.\n\nThere are different states in the relationship\
    \ between legal units:\n\n*   ■ Legal unit with intersection: good legal units\
    \ share their nodes, causing node overlap between different legal units.\n\n*\
    \   ■ Legal unit with no intersection: when there is no intersection between units,\
    \ we get legal unit with no intersection.\n\nIf the corpus does not intersect,\
    \ for example, Statute A approved a statement of a pizza order, and Statute B\
    \ approved a statement of a hamburger order. Because they can independently recognize\
    \ contradictory statements, corpuses without intersection could be harmful for\
    \ consensus.\n\nSo how do you get the nodes to make better choices?\n\nEach node\
    \ in the FBA system is responsible for ensuring that the selected legal unit does\
    \ not violate the legal body intersection. It is often necessary to confirm whether\
