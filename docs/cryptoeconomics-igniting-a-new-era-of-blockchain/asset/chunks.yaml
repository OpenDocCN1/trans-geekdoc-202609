    and placed it in front of the dealer. That excludes the possibility of participants
    knowing the choice of the other party. The dealer then opens the cards of two
    participants and pays the proceeds of both parties according to the following
    rules:


    * One person betrayed, one person cooperated: the traitor got five points (interest
    drive) and the collaborator zero points (payment fraud).

    * Both of them cooperate: each got three points (cooperative compensation).

    * Both of them betrayed: each got one point (betrayal punishment).


    The matrix of interest’s decision is the following:


