    \ represents a reward of 50 bitcoins, which is halved every 4 years. There were\
    \ 50 in 2009–2012, 25 in 2013–2016, and 12.5 will be in 2017–2020. This set of\
    \ economic incentives allows more miners to participate, constantly update the\
    \ ledger, and jointly maintain the stability of the Bitcoin network.\n\nThe core\
    \ idea of Satoshi Nakamoto’s PoW design is that you can be a traitor, you can\
    \ do evil, you can make false accounts to destroy the stability of the entire\
    \ network, but you must bear the relevant cost. Under the PoW mechanism, a person\
    \ must complete more than 50% of the workload in the entire network in order to\
    \ start an attack on it. This cost is enormous. It’s better to follow the rules\
