    比特币的总量固定在 2100 万个。由于总量是固定的，因此在考虑比特币的供应时，需要考虑的因素很少。首先，需要设定一些规则来增加比特币挖矿的难度。否则，矿工将乐于挖矿、提取剩余的比特币并将其投入市场，从而降低整体价值。


    为了确保矿工不会立即提取所有剩余的比特币，我们需要使用以下手段。


    首先，每 10 分钟向链添加一个新区块，每次添加区块时，你就可以获得 25 个比特币作为奖励。时间间隔必须是固定的，以确保矿工不会在没有规则的情况下持续向链上添加区块。其次，比特币协议要求难度水平不断增加。正如前面提到的，在挖矿过程中，区块的哈希值和随机数（nonce
    value）需要低于某个限制。这个值被称为“难度系数”，通常以几个零开始。如果难度增加，零的数量也会随之增加。通过以上两种方法，挖矿过程变得非常专业化并吸引了巨大的投资。整个过程确保了市场中所有的比特币供应都可以被验证，这也被应用于基于工作量证明机制的其他加密货币。¹¹


    [图 1.6] 代表了供需曲线，这是经济学中最常见的图表。如图所示，需求与供给成反比。两条曲线的交点是平衡点，因此让我们用这种逻辑来观察加密货币，例如比特币。


    ![图 1.6 市场供需曲线](img/Fig01_06.jpg)


    图 1.6 市场供需曲线。


    # 第二章：共识机制


    2018 年 2 月 24 日，比特币社区的一位演讲者在 Twitter 上发布了一封公开信，呼吁社区修改共识机制。当消息出来时，引起了轰动。许多比特币爱好者言辞犀利，认为这位演讲者完全不懂比特币，并要求他辞职。


    为什么这个改变共识机制的提会在整个加密货币社区引发激烈讨论？让我们先理解什么是共识。


    “共识”这个词大家应该熟悉。不同的群体能够合作，必然是因为他们拥有共同的信念。那么，在区块链世界中，“共识”意味着什么？为什么我们需要共识？


    当你提到区块链时，每个人都会想到“去中心化”特征。换句话之，就是去中间化。我们目前的社会结构包含了如银行、淘宝和视频网站等各种第三方中介机构。例如，淘宝会根据我们的购物习惯推荐产品，让你产生购买冲动。那么我们能要求淘宝不要窥探我们的购物习惯、不要向我们推荐购物清单吗？不能。因为淘宝是一个中心化组织，规则由它设定，它没有必要与我们达成共识。


    但在区块链世界中，没有中介机构，这意味着没有人会设定规则。每一项规则的制定、变更等都需要达成共同的理解。然而，要让所有人满意是很困难的；每个人都坚持自己的观点，因此达成共识非常困难。


    让我们再次以淘宝为例。当我买东西时，只有在我付了钱后，卖家才会发货。如果卖家表现得像什么都没发生过一样，淘宝可以简单监控网站上的记录并监督卖家发货给我。一旦没有了淘宝这样的中介机构，谁来充当裁判员？我说我付了钱并找了朋友作证；另一个人说我没付钱但也找了一群朋友作证。一旦这种情况发生，局面就会陷入僵局。


