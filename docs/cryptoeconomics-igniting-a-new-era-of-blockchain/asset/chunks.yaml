    \n### 6.2.1���分叉、软分叉与硬分叉\n\n女巫攻击的防御是将交易放入新区块中的博弈。参与事件的人越多，他们勾结的可能性就越低；例如，他们来自不同的国家和不同的利益。\n\
    \n1.  **分叉 (Fork)**\n    在区块链中，矿工创建区块并将其链接到最长链。通常情况下同时生成一个区块。如果同时生成两个区块，就会出现两条长度相同的链，但交易的签名或顺序不同。这种情况被称为分叉。区块链分叉成两条具有相同“祖先”的链。两条长度相同的链，但交易信息不同。区块链分叉成两条具有相同“祖先”的链。\n\
    \n2.  **软分叉 (Soft Fork)**\n    软分叉在区块链或去中心化系统中是向前兼容的。向前兼容意味着发布新的共识规则时，节点不需要升级到新规则，因为软分叉的新规则仍然符合旧规则。在这种情况下，未升级的节点仍然可以接受新规则。所有执行旧规则的节点都在产生符合规则的区块。因此，链不会分叉。这就是软分叉区块链。\n\
    \n3.  **硬分叉 (Hard Fork)**\n    硬分叉指的是在区块链或去中心化网络中不兼容的分叉。硬分叉总是改变加密货币使用的技术。这种变化使得所有新的区块与原始区块不同。旧版本将不会接受新版本创建的区块。如果新的硬分叉失败，所有用户将回到原始数据。硬分叉的一个例子是\
    \ 2017 年比特币纽约共识的分裂，它最终比特币分裂为 BCH，并将区块限制从 1 MB 增加到 8 MB。尽管 8 MB 区块以前被认为是比特币网络中的不兼容区块，但在硬分叉激活后它是与\
    \ 8 MB 区块兼容的。\n\n另一个著名的分叉案例是以太坊上的 DAO 的硬分叉，这是展示社区规则分歧的最佳分析案例。原始以太坊链变成了两个版本的区块链——ETC\
    \ 和 ETH，每个版本都有不同的概念和代币。\n\n### 6.2.2 软分叉与硬分叉的主要特征\n\n1.  **软分叉的特征**\n    软分叉具有以下特征：\n\
    \n    1.  它没有创建新链。\n\n    2.  由于交易数据和区块数据结构的限制，复杂的规则更改（如更改区块大小）无法通过软分叉来实现。\n"
