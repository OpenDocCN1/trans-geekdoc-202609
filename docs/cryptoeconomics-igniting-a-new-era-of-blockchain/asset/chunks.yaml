- raw: 'In cryptoeconomics, value is often determined by comparison: how to ensure
    the fairness of miners who are mining in systems such as Bitcoin and Ethereum?
    We can compare the speed of solving the problems, who can solve the problems quicker,
    and who can get the right to add the transaction to the public ledger; for various
    consensus mechanisms, such as PoW, POS, and DPOS, we have been comparing which
    one represents the future direction more.


    Our comparative habit is not only irrational, but this irrationality is predictable.
    We always rely on observing the things around us to determine each other’s relationships,
    not only in tangible objects, but also in intangible experiences, even when we
    are dealing with temporarily volatile things such as feelings, attitudes, and
    opinions.


    Relativity helps us make decisions in our lives, but it can also make us feel
    very painful. For example, your normal annual salary before contacting the blockchain
    is 100K RMB, and it becomes 500K RMB after investing in Bitcoin. This is of course
    a happy thing; but if you know that the friends around you earn at least 100,000K
    RMB, can you still be happy?


    If we can control the scope of our comparison and turn to a circle that can improve
    our relative happiness, we will live a more comfortable life.


    # [5.2.2   Why Are You Completely Indifferent to $10,000 Bitcoin, While Some People
    Are Crazy for it?](#ch00_fm04_contents.xhtml#rsec5_2_2)


    Starting from late 2017, countries began to control initial coin offering (ICO).
    The cryptocurrency was falling all the time, and price cut half was only basic.
    Eighty percent fall was also everywhere, causing countless people to suffer heavy
    losses.


    However, after 3 months of market regulation, the cryptocurrency market has turned
    into a big bull market. Numerous currencies that were considered lingering on
    in a steadily worsening condition have been revived, and the second spring was
    more dazzling than before. Bitcoin broke through the price of 14K RMB in December,
    and let countless people sigh and miss the best speculative opportunities.


    Some people fled in any path they could without considering during this period,
    and the others were calmly buying bottomed out tokens; why did different people
    made a different choice in the face of the same situation?


    Behavioral economics points out that when people make decisions, thinking is often
    influenced by the first information they get, just like the anchor that sinks
    into the sea, fixing your mind somewhere, and then you are not aware of yourself.
    The impact of this is called the “anchoring effect”.


    The anchoring effect is a good explanation for our different acceptance of bitcoin
    prices, and the different people have significantly different understanding of
    the value, when they have a contact with bitcoin and try to understand bitcoin
    for the first time:


    *   A thinks that Bitcoin is a string of useless code. It doesn’t have the attributes
    of money at all. Now the price is due to hype. Sooner or later, there will be
    a bubble bursting day. They are not ready to accept that the price was rising
    all over its history, and definitely won’t buy it, for example, such as Professor
    Lang, who is famous for rejecting 100 bitcoins.


    *   B believes that bitcoin is produced by mining, so its price should be equal
    to the cost of mining bitcoin (equipment input + electricity fee + repair), so
    it will be sold above cost, such as 10K bitcoin for two Papa John’s Pizzas.


    *   C   believes that Bitcoin is one of the future global payment methods, which
    can match the current total value of gold, so each bitcoin is worth about $1,300.


    *   D   believes that Bitcoin will completely subvert the existing financial system,
    equal to the total global value of the future, so the current price is still low
    in the long run, just like it is often said: “Now it is the best time than ever
    to buy bottomed out tokens for the long run”.


    We don’t need to evaluate the rationality of the above ideas, but simply analyze
    the first impressions of different people on the value of Bitcoin during the first
    contact. Unless there is any major event which can subvert the cognition, then
    the initial value/price in the future will be used as an “anchor point” to become
    an important criterion for judging whether it should be bought/sold at present.


    The same reason can also be used in the ICO. When the whole coin economy grows
    wildly in 2017, projects with cryptoinfluencers listed as consultants in the whitepaper
    tend to grasp more attention and get more funding, as for people who don’t understand
    the project basics, such “anchoring” consultants influence people’s judgements.


    The above illustrates that in the decisions we make, whether inadvertent or well
    thought out, “anchoring” plays a great role.


    The cryptocurrency market can be seen as a complete free market: if you think
    a project is promising, then you invest and such an exchange is beneficial to
    both parties. In other words, whether the exchange behavior is mutually beneficial
    depends on whether the parties in the market are really clear about the value
    of the exchanged items.


    However, if our choices are often influenced by our initial “anchor”, the choices
    made on this may not accurately reflect the practical value and pleasure we get
    from this project (whether many items are really useful or it is still unknown).
    In this way, if we can’t accurately calculate the value of the project and just
    blindly follow the cryptoinfluencers, we can’t figure out if the deal will benefit
    us.


    For example, due to the unfortunate initial anchor, we may mistakenly use Bitcoin
    (the initial anchor price is lower) to invest some junk projects (the initial
    anchor pricing could be on the contrary, higher), and in the end, we are finished.


    Perhaps it’s time to check out the “anchor” in the currency circle we are staying.
    Was it a big coffee that we’ve been praising before, or do you still want to be
    as reliable as you thought? Have you ever sworn that you won’t sell and still
    decided to leave in your hands after re-examining the project? Once we rethink
    the old choices, we will open our doors to new decisions, new days, and new opportunities.


    And when we rethink our previous “anchor”, the blockchain can help us to a large
    extent. Because of its irreversible nature of information records, we can look
    up all the records and have one of them. The performance of the series is re-evaluated
    – history is always the best teacher.


    # [5.2.3   Why Do So Many Projects Like Airdrops?](#ch00_fm04_contents.xhtml#rsec5_2_3)


    One day you got home from work, and while you were lying on the sofa and habitually
    opened the imToken wallet, and then found a strange token in the balance list
    and a number of tokens. If you are just starting to encounter this situation,
    I believe you will be at least a little bit excited, but now you got used to it:
    it is just some project’s “airdrop”.


    “Airdrop” refers to a large amount of tokens (also called “free candy”) that a
    certain person or an organization will send to the user’s wallet. Many users will
    not refuse this and will even take the initiative to find various channels of
    information to get free candies; there are also people who have designed the corresponding
    programs and websites to collect information about the latest project airdrops.


    In addition to airdrops, there is a mainstream way to get the project tokens for
    free, and it often appears in various WeChat groups for speculators or circle
    of friends.


    This is not only the promotion of the project itself, but also many exchanges
    obtain users in this way (such as free delivery of their own platform tokens),
    especially good effect is when it is especially effective when exchanges reward
    a user based on how many people he invites.'
