- raw: 'While some people are constantly exploring algorithms, others are accusing
    PoW of wasting energy, POS mechanism has already been implemented. Although people
    who support PoW are trying to maintain it, but they have to admit the fact that
    PoW consumes energy. This accusation opens up another path of exploration, which
    is perfect if you can find an algorithm that can maintain blockchain security
    and generate value in other ways.


    The most inspiring result on this way of exploration is Primecoin. It was invented
    by Sunny King (pseudonym), who also developed Peercoin. The core idea of the prime
    currency algorithm is to look for large prime numbers while doing hash operations.
    Why is it looking for prime numbers? Because the prime numbers are rare on the
    number axis and the distribution is irregular, finding the prime numbers on the
    number axis can be only blindly searched and explored, which is the characteristic
    of the PoW.


    Another requirement of PoW is to be verified easily. In this case, people have
    achieved some results after hundreds of years of exploration. The Primecoin is
    tested in two ways: first by the Fermat test and then by the Euler–Lagrange–Lipschitz
    test; if both tests pass, it can be considered as a prime number. It should be
    pointed out that this method does not guarantee that hundreds of passes through
    the test are all prime numbers, but which does not affect the system operation.
    Even if the test results are wrong, as long as every node considers it as a prime
    number, the system will work.


    Primecoin is actually looking for Cunningham chains.


    There are three specific types of Cunningham chains: type one Cunningham chain,
    type two Cunningham chain, and bi-twin chain.


    What is Cunningham chain? Let’s use the example of the first type of Cunningham
    chain to explain.


    Each number in the Cunningham chain is twice the previous number minus one, such
    as


    *   , 3061, 6121, 12241, 24481


    The next number of numbers in the series 48961 (24481 \* 2 − 1) is not a prime
    number, so the length of this Cunningham chain is 5, and the goal of Primecoin
    is to explore a longer Cunningham chain (all three categories are OK).


    So here is the most important question. How can I use the Cunningham chain to
    verify that a block is legit?


    Let’s take a look at the implementation details of Primecoins.


    1.  Hashing Satoshi Nakamoto’s block head: hashBlockHeader  =  SHA256(BlockHeader)


    2.  Get the first number of the Cunningham chain by transformation: originNum 
    =  hashBlockHeader \* Multiplier


    After obtaining the first number of the originNum of the Cunningham’s chain, the
    integer part of the length of the prime chain can be tested and calculated, and
    the calculation of the fractional part is related to the span of the last non-prime
    of the Cunningham’s chain.


    Multiplexing of each block is different, and the calculation process is related
    to the hashBlockHeader. For this purpose, the Primecoin has been modified specifically
    for the block header, and field bnPrimeChainMultiplier has been added to store
    the product factor. However, when the hashBlockHeader is calculated in the first
    step above, the input data does not contain this product factor, and that is why
    the Satoshi Nakamoto’s block is specifically pointed out.


    Primecoin is the first cryptocurrency on the market that does not use the Hash
    workload proof mechanism. The mining process itself has a certain scientific value.
    But why are you not getting a big promotion?


    According to the knowledge we have, the prime numbers are unevenly distributed
    on the numerical axis, and the larger the number, the rarer the prime numbers.
    The difficulty of finding is not linearly increasing, so the time consumption
    is unpredictable. However, the blockchain requires block stability, and the prime
    number algorithm is not popular. But this kind of exploration is not meaningless,
    and the exploration of using the workload of PoW is still going on.


    # [3.1.5   Ethash and Ethereum](#ch00_fm04_contents.xhtml#rsec3_1_5)


    Ethereum originally intended to use POS, but due to some problems with POS design,
    the development team decided to use the PoW method in the Ethereum 1.0 phase.
    Then in the Serenity phase, Ethereum will be converted from PoW to PoS. Proof-of-work
    (PoW) means converting electricity to heat, Ethash and network stability.


    Ethereum’s PoW algorithm is called Ethash (a modified version of the Dagger-Hashimoto
    algorithm), which is slightly different from Bitcoin’s PoW algorithm, which makes
    it possible to mine with ordinary hardware.


    The latest version of Ethash is designed to meet the following goals:


    1.  IO saturation: the algorithm should consume almost the entire available memory
    access bandwidth, which is a strategy to achieve ASIC resistance, which is aimed
    at available RAM, especially in GPUs VRAM, and comparing to computers’ memory,
    it is closer to the theoretically optimal value)


    2.  “GPU-friendly”: make GPU mining as simple as possible. It is almost impossible
    for the CPU mining because the potential specialization impacts are too huge,
    and the CPU-friendly algorithms do have the disadvantage of being vulnerable to
    botnet attacks. So after comprehensive consideration, it was chosen to be “GPU
    - Graphics Processing Unit friendly”.


    3.  Light client verifiability: light clients should be able to verify a round
    of mining in 0.01 second units on a C language desktop, and verify a round of
    mining in Python or JavaScript; verification of one round of mining in 0.1 second
    units will require 1 MB of memory (but exponentially).


    4.  Light client slowdown: the process of running algorithms with a light client
    should be much slower than using a full client, so running algorithms on light
    clients (including through dedicated hardware) is not an economically viable way
    to mine.


    5.  Light client quick start: light client should be able to operate completely
    and be able to verify blocks in JavaScript in 40 seconds


    By these considerations, the Ethash mining that was finally released by the development
    team was basically independent of CPU performance, but was positively related
    to memory size and memory bandwidth. This workload proof algorithm from Ethereum
    reduces the efficiency of specific hardware ASICs that is commonly used for Bitcoin
    mining.


    The basic process of the Ethash algorithm is given as follows:


    *   For each block, first calculate a seed by scanning the block header: the seed
    is only related to the information of the current block; use the seed to generate
    a 16 MB pseudo-random data set (cache); and then, generate a 1 GB data set – the
    DAG based on the cache. Each element in this data set depends only on a few elements
    in the cache. In other words, as long as there is a cache, you can quickly calculate
    the elements in the specified position in the DAG. DAG can be understood as a
    complete search space. The mining process is to select elements from the DAG randomly
    (similar to finding the appropriate Nonce in Bitcoin mining) and then perform
    the hash operation.


    *   The verification process is similar. It gets the specified position of the
    element, based on the cache to get, and then, it verifies that the hash result
    of this set of elements is less than a certain value. The verification process
    only needs to be done with normal CPU and normal memory. This is because the cache
    is small, and the DAG elements at the specified location are easy to compute.
    Cache and DAG are updated every 30,000 blocks.


    # [3.1.6   Equihash and Zcash](#ch00_fm04_contents.xhtml#rsec3_1_6)'
