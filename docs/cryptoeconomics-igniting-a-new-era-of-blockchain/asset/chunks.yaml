    2016 年 10 月，Zcash 上线了。该货币最大的特点是使用了零知识证明来实现私有交易。零知识证明可以在不泄露信息的情况下提供证明，而验证者通过验证来确认其正确性。Zcash
    在区块链记录中隐藏了交易者的所有信息，包括双方的地址和交易金额，从而实现了匿名性。Zcash 在算法的选择上非常谨慎。在考虑了 `SHA256D`、`SYPT`、`CUCKOO
    HASH` 和 `LYRA2` 等算法后，Zcash 团队选择了 `Equihash`。


    Equihash 是由 Alex Biryukov 和 Dmitry Khovratovich 设计的 PoW 算法。其理论基础是计算机科学和密码学中的一个问题——推广生日悖论。Equihash
    是一种依赖内存的算法。算力的大小主要取决于内存的大小。它更适合具有大内存的通用计算机，而不是特殊的硬件芯片。根据两位发明者的论文，该算法至少需要 `700M`
    的内存和 `1.8 GHz` 的 CPU 运行 30 秒。经过 Zcash 项目的优化，目前每个挖矿线程需要 `1G` 内存，因此 Zcash 官方认为该算法在短期内矿机（ASIC）中很难出现，从而实现了针对矿机性能的
    ASIC 抗性。由于推广生日悖论已被广泛研究，Zcash 官方认为该算法是公平的，他们认为某个人或组织很难秘密优化该算法。Equihash 算法非常容易验证，这对于未来在受限设备上实现
    Zcash 客户端至关重要。Zcash 挖矿的一般过程是：首先构建输入条件（区块头和各种参数），然后通过特定函数将输入条件转换为“推广生日问题的一般形式”，然后使用优化算法解决问题并获得解决方案。然后，估计收到的解决方案的难度。如果同时满足算法条件和难度条件，则判定“挖矿”成功；否则，重新计算随机数。


    中国比特币黄金 (`BTG`) 也使用了 Equihash 算法。BTG 也是比特币区块链的一个分支。BTG 矿工在比特币区块 `491407` 处使用新的工作量证明算法创建了区块并成功分叉，在比特币区块
    `491407` 之前的区块保持不变。BTG 的原始代币分配方法与 8 月 1 日比特币现金分叉使用的方法几乎相同。当区块 `491406` 分叉时，持有比特币的所有者将按照
    `1 BTC = 1 BTG` 的比例自动获得 BTG。


    # 3.2 优化 PoS


    ## 3.2.1 拜庭将领与拜庭容错算法


    1982 年，Lamport、Shostak 和 Pease 首次提出了通用拜庭将的问题。来自 Cosmos 的 Ethan Buchman 描述道：“这是一个在受损通信网络中实现分布式协议的问题，即在不可靠的环境中构建可靠系统的问题”。从那时起，还没有人能够创建一个解决
    1982 年到 1999 年间拜庭将领问题的系统。因为在当时，互联网刚刚从云端中央计算演变，需要解决的是容错问题。因此，在人们的意识中，拜庭将领问题与计算无关，更流行的是容错算法。例如，1998
    年发明的 `Paxos` 算法和 2013 年发明的 `Raft` 算法被广泛使用。1999 年发明的实用拜庭容错 (`PBFT`) 除了学术界外，在现实生活中并未被广泛使用。


    直到 2008 年，中本聪明将网络规模层面的分布式拜庭容错 (`BFT`) 算法设计进区块链解决方案中，使 BFT 变得流行。。从那时起，计算系统研究社区的人们开始思考如何将
    BFT 应用于现实世界。


    2011 年，BitcoinTalk 论坛组织了一场关于权益证明 (`PoS`) 概念的讨论。原始 PoS 研究假设系统中的一系列节点在长时间内是静态且稳定的。但在区块链环境中，这种假设完全是不符合实际的。因此，初始的
    PoS 协议实现结果并不理想。直到 2014 年 Jae Kwon 创建了 `Tendermint`，这是首次将分布式 BFT 研究真正应用到 PoS 公共链环境中的。Jae
    Kwon 的一个重大突破是让 Tendermint 通过区块、哈希链接、动态验证者集和循环领导者选举，将 BFT 研究应用到复制状态机（区块链）领域。在 Tendermint
    环境中应用了大量的共识算法（`Honeybadger`、`Ouroboros`、`Tezos`、`Casper`），它们都包含 BTF 研究元素以及区块链中其他模块观察到的元素。


    事实上，所有针对权益证明 (`PoS`) 的研究都指向一个重要问题：我们可以在不耗尽稀缺物质资源的情况下达到 PoW 的安全水平吗？这个问题可以转化为：PoS
    投票权不是通过计算得出的，而是以链上货币计量的。


    与区块链的可扩展性相比，对 POS 共识问题的讨论更加广泛和热烈。由于运行 PoW 挖矿成本高昂以及各种环境问题，大量资源正投入到 PoS 安全中。


    ## 3.2.2 实现权益证明的算法


    接下来，我们将讨论在加密货币中使用 PoS 的三个主要 PoS 协议：


    - `CTFG` (Casper the Friendly Ghost) – 由 Vlad Zamfir 领导的研究

    - `CFFG` (Casper the Friendly Finality Gadget) – 由 Vitalik Buterin 领导的研究

    - `Tendermint` – 由 Jae Kwon 领导的研究


    实现 PoS 算法有许多不同的方法，但 PoS 设计的两个主要原则是基于链的 PoS 和基于 BFT 的 PoS。Tendermint 基于拜庭容错的 PoS
    设计，CTFG 是基于链的 PoS 设计，而 CFFG 是两者的结合。


    计算机科学中的 CAP 理论认为分布式数据系统无法提供超过三分之二的保证：可用性、一致性和分区容错性。基于链的 PoS 算法倾向于选择高可用性而非高一致性，因为高可用性意味着所有交易都可以处理，但以牺牲跨网络的状态一致为代价。而基于
    BFT 的算法倾向于选择高一致性。


    ### (1) Tendermint 和基于 BTF 的 POS


    在基于 PFT 的 PoS 协议伪排列中，验证者在多轮投票中提议区块。然而，提交并确认区块取决于所有验证者的多数 −2/3 对提交的区块签名。可能需要几轮才能完成区块。BFT
    系统只能承受 1/3 的故障，包括故障或恶意攻击。


    Tendermint 由两个主要技术组成：区块链共识引擎和通用应用接口。共识引擎被称为 `Tendermint` 核心模块，确保每台机器以相同的顺序记录相同的交易。应用接口被称为
    `应用区块链接口` (`ABCI`)，允许用任何编程语言编写的程序处理交易。


    '
