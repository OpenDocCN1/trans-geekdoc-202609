  trans: "\n\n这对 PoS 协议来说是致命的，因为 PoS 的安全模型必须是“**主观的**。（什么是“主观的”安全模型？如果信息可以在协议内被验证，那么它就可以被称为“客观的”；如果信息必须通过协议以外的手段进行验证，则它被称为“主观的”。）当一个新节点加入网络后，它可能对当前网络的状态得出不同的结论。因为它们的决策是基于主观信息的，即社会信誉。然而，在此时，我们将其与\
    \ PoW（工作量证明）进行比较，发现 PoW 的安全模型必须是“**客观的”，因为它们的决策是基于客观信息的，且当前网络状态始终处于工作量最大的情况，新节点对网络状态总会有相同的结论。\n\
    \n那么如何防止长距离攻击的伤害呢？\n\n在 Vitalik 提出的弱主观模型下，在访问网络中的新节点进行验证时，当前节点必须与质金绑定。只有当验证节点支付了质金时，其签名才具有经济意义。这意味着客户端只能依赖已锁定质金的验证节点的签名。因此，当客户端接收并验证共识数据时，共识批准链必须来自当前锁定质金的验证节点的区块。与\
    \ PoW 协议相比，共识认可链是从创世区块派出来的——只要你知道源世区块的数据，就可以识别共识认可链。在这里，只要你知道当前锁定质金的验证节点，就可以识别共识批准链。不知道当前锁定质金的认证节点列表的客户端必须通过另一个通道获取此列表。这种限制通过要求所有人使用当前信息来识别共识。\n\
    \n此外，解冻质金的过程必须经过一个“解冻”（thaw）期。解冻会导致消息同步延迟几周到几个月，需要时间来“解冻”。因为协议禁止在第 N 个区块（N 是质金的长度）之前恢复，这条规则使任何长距离分叉失效。同时，同步数据需要从其他渠道获取最新的锁定质金验证节点列表的特征，这实现了\
    \ Vitalik 所说的“**弱主观**”。\n\nCasper(s) 和 Tendermint 使用这种简单的锁定机制（在 Tendermint 中通常被称为“冻结”freeze）来锁定一段时间（从几周到几个月的“解冻”），以防任何验证节点恶意破坏系统安全。在\
    \ Vitalik Buterin 领导的 CFFG 算法研究中，分支只能修改最终区块之后的区块，从而防止远程攻击。在 CFFG 中，尝试使用时间戳修改最终区块之前的此类长距离区块分叉是不会被协议认可的。\n\
    \n# (3) 团伙形成 (Cartel Formation)\n\nPoS 仍然有一个问题需要解决，那就是垄断问题，当然，这也是任何经济形式都需要面临的问题。\n\
    \n> 加密货币极其集中。算力也是如此。垄断竞争是许多“现实世界”市场中的常态。少数相对富有的验证者之间的协调比大量相对贫穷的验证者之间的协调要容易得多。在我们的语境下，团伙的形成是完全意料之中的。\n\
    \n> *Vlad Zamfir, 《Casper 历史》第 4 章* \n\nTendermint 依赖于额外的协议管理方法来应对垄断的验证者。虽然在审查系统上没有共识，但依靠带外社会信息来解决团伙形成问题，其基本原理是用户将不可避免地注意到团伙的形成，社会也会对其进行议论。然后，放弃或投票重新组织被阻塞的区块链。\n\
    \n到为止，Vlad 的 Casper 协议是唯一明确在审查激励内部使用共识来对抗团伙形成的协议。\n\n# (4) 未来工作\n\n公链在产品上的运行仍然是一项较新的技术。到目前为止，唯一被证明不可腐败的安全模型是工作量证明。权益证明（PoS）的设计空间仍然非常大，工程理解尚不足，因为权益证明是一个前沿研究领域，目前还没有足够的数据支持。为了实现最优的\
    \ PoS 共识算法，我们仍然有许多未来工作要做完成。\n\n未来可以努力的第一方向可能是 Tendermint。这可能是为它提出一种新的改进机制，或者将\
    \ Tendermint 的多轮投票压缩为一轮投票。\n\n未来工作的第二个领域可能是使用更先进的加密技术来使区块头的签名更小。因为我们正在通过 Cosmos\
    \ 构建一个“区块链互联网”，将我们的客户端认证从一条链移动到另一条链是核心工作。从这个角度来看，使用更先进的密码学将区块头缩小三十倍或更多是非常有利的。\n\
    \n此外，我们可以优化 p2p 层，以便显著减少最终区块所需的流量。在未来的工作中，不仅是压缩区块头中的数据量，发送到对点的数据量也可以被减少。在这种情况下，可以在\
    \ Cosmos 网络初始 100 个验证者的阈值之上添加更多的验证者。\n\n# 3.3 PBFT 优化版本：联邦拜斯庭协议 (FBA)\n\n在传统的\
    \ PBFT 中，尽管有导致拜斯庭错误的破坏者，拜斯庭协议也能保证分布式共识的达成。然而，它要求系统的所有参与者达成一致，且网络中的所有节点必须是已知的并经过预认证。\n\
    \n任何联邦拜斯庭协议（FBA）都可以加入，分布式方式组（法定人数或节点足够）可以达成一致，每个节点可以确定其信赖的对象，不同的节点不需要信任相同的参与者组合即可完成共识。灵活信任意味着用户可以自由信任他们认为合适的参与者组合。\n\
    \n由 Stellar.org 首席科学官 David Mazières 教授提出的 Stellar 共识协议（SCP）是联邦拜斯庭协议（FBA）的第一个示例。Stellar\
    \ 共识协议提供了一种在不依赖封闭系统的情况下通过准确记录金融交易达到共识的方法。Stellar 共识协议还有四个关键属性：去中心化控制、低延迟、灵活信任和渐进安全。\n\
    \n在详细详细解释 FBA 之前，我们需要知道什么是法定单元（legal unit）？\n\n在分布式系统中，法定单元是达成协议的节点集合。FBA 引入了法定人数（quorum）的概念，即可以说服特定节点同意的法定人数子集。\n\
    \nFBA 的主要特征：\n\nFBA 中的每个节点都可以选择自己的法定单元集合，而整个系统的法定人数结果由单个节点的选择决定。这是拜斯庭（BA）协议系统与\
    \ FBA 系统之间的关键区别。\n\n"
