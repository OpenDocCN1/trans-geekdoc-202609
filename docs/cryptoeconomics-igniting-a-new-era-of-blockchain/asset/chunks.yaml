    When a checkpoint is finalized, the verifier gets paid. However, if there are
    two finalized checkpoints that are split at the same height, then the security
    is broken, and at this time, the conditions for the reduction are reached, and
    at least 1/3 of the margin will be eliminated. When the security is compromised,
    evidence of the error attribution can be broadcasted as a transaction to the PoW
    miner. Then, PoW combines the evidence transaction into a block for mining, and
    the verifier who submitted the evidence will get the cost of the finder. When
    this happens, malicious verifiers signed in the conflict zone will be eliminated
    on both links, ensuring the legitimacy of the entire blockchain.


    Now what happens if a miner makes a serious force attack? Now Casper’s finalized
    blockchain can prevent PoW attackers, even if 51% or more of the computing power
    trying to rewrite the history other than the latest checkpoint will be blocked.
    So Casper provides security. Unlike CTFG, because CFFG is a layer of coverage
    on different proposed mechanisms, Casper cannot ensure activity because activity
    is dependent on the proposed mechanism.


    The verifiers are motivated to assemble on the chain of authority because they
    will be punished if they continue to vote on different chains. The formation of
    slasher 2.0 allows the verifier to be punished not only for double voting but
    also for voting on the incorrect chain. However, this also creates a dilemma,
    where the verifier is worried that if there is a branch and he is not sure which
    one is authoritative, and if he voted on the incorrect chain, he chooses to cut
    off or to leave the voting.


    Clear features of CFFG:


    * ■ Finalization: Finalization over 20 minutes. Finalize the block every 50 blocks
    (one cycle) to prevent PoW mining brute force attack

    * ■ Consensus security

    * ■ Proven activity

    * ■ Priority availability.


    # (3) CTFG


    CTFG is a correct construction (CBC) consensus agreement designed to combat the
    real environment of oligopoly. CTFG is a PoS adaptation of the GHOS or GHOST protocol
    in the proof of workload for its fork selection rules. The guiding design principles
    behind CTFG are based on cryptographic economics with formal methods designed
    to achieve security. Unlike the CFFG hybrid protocol detailed above, CTFG is a
    purely PoS.


    > Casper was born as simply “the friendly ghost”, an adaptation of GHOST to proof-of-stake,
    complete with incentives that would make a cartel “friendly” to non-cartel validators.


    > Vlad Zamfir, Chapter 5 of Casper’s History


    Similar to the proof of workload, CTFG trades off consistency and usability. In
    particular, when the blocks are not finalized, they will be safer as the depth
    deeper in the chain. CTFG is a bit like CFFG, and the processing of the chain
    header is always much faster than the finalization of the block.


    The biggest difference between Casper’s PoS proposal mechanism and the Tendermint
    proposal mechanism is that compared to the pseudo-random selection leader, the
    former’s verifier can propose blocks based on the blocks they see.


    Casper provides a unique feature which is the parameterized safety margin. Similar
    to using six acknowledgments in Bitcoin to determine an economic final state,
    “evaluation security” in CTFG, a verifier can have a different security threshold
    function than other verifiers. Casper is designed to allow verifiers to choose
    their own fault-tolerant thresholds while maintaining low PoS overhead in the
    network.


    Casper’s core advantage over Tendermint is that the network can accommodate a
    certain number of validators at any time. Block confirmation time should be shorter
    because the blocks in Tendermint need to be finalized when they are created. In
    order to achieve short block times, there needs to be a limit on the number of
    validators that Tendermint PoS can accommodate. Since CTFG and CFFG do not need
    security when the block is created, the Ethereum network, in comparison to cosmoses’100
    validators, can accommodate a larger number of validators.


    Clear features of CTFG


    * ■ Availability. Casper’s nodes can be divided before they reach a consensus.

    * ■ Asynchronous security.

    * ■ Survival. Casper’s decision can survive partial synchronization, but not survive
    in asynchronous.

    * ■ Cartel resistance. Casper is built on the basis of boycotting oligopolistic
    attackers, so certifiers can go beyond the agreement without any collusion.

    * ■ Security, depending on the evaluator’s assessment security threshold.


    # 3.2.3 Trap of Proof-of-Stake


    # (1) Relations with No Interest


    At first, there were many different ways to describe the general trap of PoS,
    and “relations with no interest” was raised at this time. Jae Kwon first mentioned
    this issue in May 2014 with the unfortunate name of “Bad Choice Paradox”. In July
    2014, Vitalik popularized the problem of the exact definitions described by Bitcoin
    developers as relations with “no interest”.


    The problem is following: at a given block height, the verifier can effectively
    compromise security by voting for multiple conflicting blocks without paying any
    price for it.


    A simple PoS design is very vulnerable to these attacks. It is a disaster, because
    there is no incentive to encourage everyone to focus on a single chain all the
    time, and each incentive is to be repeatedly signed on multiple conflicting chains
    at once, in order to get more block incentives. Economically optimal strategy
    becomes as much as possible to vote on multiple forks, as shown in Figure 3.4.


    ![Figure 3.4 Honest Voting vs. Dishonest Voting in PoS. https://www.bcskill.com/index.php/archives/793.html](images/Fig03_04.jpg)


    Figure 3.4 Honest Voting vs. Dishonest Voting in PoS. https://www.bcskill.com/index.php/archives/793.html


    In the proof of workload, for miners who are mining on chains, if they want to
    do harm, they must separate their very scarce computing resources and use this
    high cost to curb the evil situation. In modern non-degenerate PoS, this cost
    is designed into the agreement to mimic the limitations of PoW physical mining
    for miners. For example, Ethereum leader Vitalik Buterin introduced the `slasher`
    concept in 2014, and the penalty within the agreement can mitigate this attack.


    In the same year, Jae Kwon further promoted this method, which is the first iteration
    to implement the Tendermint consensus protocol. Increasing costs and allowing
    harsh penalties were helpful for all non-degenerate BFT protocols, and even the
    three consensuses presented in this section are used.


    # (2) Remote Attack


    Since the user has the right to withdraw the deposit in the PoS mechanism, there
    is a hidden danger of remote attack. That’s because an attacker can fork over
    any block length without worrying about being cut. Because once the margin is
    unbound, the incentive to not vote long distances from a block height is canceled.
    In other words, when more than 2/3 of the certifiers unbind, they can maliciously
    create a second chain containing the previous set of certifiers, which could result
    in arbitrary transactions.

