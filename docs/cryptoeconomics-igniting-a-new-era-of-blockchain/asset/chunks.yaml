    \ and pass it on to another general.\n\n    In real life, there can be more than\
    \ ten nodes in a distributed network. So how is a consensus mechanism designed\
    \ in order to have a large number of nodes “sign” the order?\n\n    To design\
    \ such a consensus mechanism, we must follow the basic design principle of distributed\
    \ networks. This principle is called CAP (Consistency, Availability, and Partition\
    \ Tolerance) theory.\n\n# [2.2   CAP Theory](#ch00_fm04_contents.xhtml#rsec2_2)\n\
    \n> I like fish, and I also like bear’s paws. If I cannot have the two together,\
    \ I will let the fish go, and take the bear’s paws.\n\nThese are famous words\
    \ by Chinese Philosopher Mencius that tells us there are hard choices to make\
    \ in our lives. In distributed systems, CAP theory is the “fish and bear’s paw”\
    \ problem that system designers can’t escape.\n\nCAP theory was proposed by the\
    \ famous computer scientist Eric Allen Brewer in the late 1990s. Specifically,\
    \ it says that Consistency, Availability, and Partition Tolerance cannot exist\
    \ together in a distributed system. CAP theory advocates that any data sharing\
    \ system in the network can only have maximum two of the following three conditions:\n\
    \n*   Consistency (C): all nodes access the same copy of the latest data, and\
    \ all applications can access the same data at any time.\n\n*   Availability (A):\
    \ healthy nodes respond to the client’s requests within a limited time, and there\
    \ is no need to wait all the time.\n\n*   Partition Tolerance (P): so-called partition\
    \ means that the system cannot achieve data consistency within the time limit.\
    \ Once this happens, a choice between C and A for the current operation must be\
    \ made. You have to ensure that the cluster can continue to serve if some nodes\
    \ in the cluster are disconnected.\n\n[Figure 2.1](#ch02.xhtml#fig2_1) represents\
    \ the relationship between these three elements.\n\n![Figure 2.1   CAP Theory.](images/Fig02_01.jpg)\n\
    \n**Figure 2.1   CAP Theory.**\n\nAs shown in the figure, to satisfy CP, in the\
    \ case of network partitioning, in order to achieve C, the request can only wait\
    \ for a while, and as the result won’t achieve A; if CA is to be achieved, the\
    \ node status must be consistent within the time limit, and the network partition\
    \ must not emerge, so it cannot satisfy AP. To satisfy AP, the separated nodes\
    \ are serving simultaneously but cannot communicate with each other, which will\
    \ result in inconsistent states and won’t satisfy C.\n\nBut in fact, there is\
    \ no distributed system that can avoid network failure (P). Therefore, system\
    \ architects often have to choose between satisfying CP and AP.\n\nLimited by\
    \ this theory, in 2008, Nakamoto discovered the Bitcoin and proposed the Proof-of-Work\
    \ (PoW) workload proof mechanism, which became an ultimate solution to the Byzantine\
    \ Generals problem.\n\n# [2.3   PoW (Proof-of-Work) Mechanism](#ch00_fm04_contents.xhtml#rsec2_3)\n\
    \nBitcoin or bottom-layer blockchain technology, in fact is a public ledger that\
    \ records real-time transactions in the Bitcoin network. This ledger needs constant\
    \ data updates, so how to ensure the data accuracy on this ledger, and how to\
    \ ensure that the entire network recognizes only this one ledger?\n\nIf we assume\
    \ that there are 10 computers on the whole network, and the ledger should be updated\
    \ every 10 minutes, then who’s ledger will be considered as an accurate? The answer\
    \ given by Nakamoto is that every update should be made only according to one\
    \ computer. Which one? We do it according to the one who has completed the workload.\
    \ This is the PoW mechanism. The workload here refers specifically to mining,\
    \ that is, using computing power to solve a complex mathematical problem. The\
    \ miner who solves it first and completes the “workload” can update the public\
    \ ledger. After the miner updated the ledger, other people on the network would\
    \ update it simultaneously.\n\n(Note: If there are two miners who have completed\
    \ the workload at the same time, then the network speed decides who will be the\
    \ first: the one who will broadcast the first will get the right to record.)\n\
    \nSo why are some people willing to complete the workload and maintain the consistency\
    \ of the Bitcoin ledger?\n\nThe answer can be found in Nakamoto’s whitepaper that\
