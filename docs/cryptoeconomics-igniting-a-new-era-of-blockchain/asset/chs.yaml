  \ (`DSA`) 是两种最流行的数字签名机制。\n\n让我们在现实生活中想象一下，为什么要签名？签名的作用是什么？它们的特征又是什么？\n\n- ■ 可验证性：这种签名应该证明它确实是你的手笔迹。\n\
  - ■ 不可伪造性：没有其他人可以伪造你的签名。\n- ■ 不可否认性：如果你用自己的签名签署了文档，那么该文件的有效性将不会被撤销，你不能声称是别人替你签的。\n\
  \n然而，在现实生活中，无论签名多么复杂，都有被伪造的可能性。因为你无法通过简单的视觉辅助（如手写识别）来真实地验证签名的有效性，这既不高效也不可靠。\n\n\
  密码学为我们提供了一个通过公钥和私钥来解决问题的解决方案。让我们来看看这两个密钥是如何工作的，以及它们是如何贡献于加密货币系统的。\n\n假设有两个人 A 和\
  \ B。A 想要发送一些非常重要的数据，B 想要识别这些数据是否真的来自 A；他们可以通过使用 A 的公钥和私钥来实现这一点。公钥，顾其名，是指任何人都可以获取的公钥。私钥是个人拥有的密钥，不能与他人共享。此外，通过某人的私钥来确定其公钥是不行的。\n\
  \n回到 A 和 B 发送数据的课题。如果他们想用密钥来交换信息，具体将如何操作呢？\n\n假设 A 想要发送消息 `M`。A 有一个私钥 `K1` 和一个公钥\
  \ `K2`。那么当他向 B 发送消息时，他用私钥加密消息，消息变成了 `K1(M)`。当 B 接收这条消息时，他可以使用 A 的公钥获取信息 `K2K1(M)`，从而获得原始信息\
  \ `M`。\n\n上述过程在图 1.3 中清晰所示。\n\n\n\n让我们通过日常生活中名的例子，重新审视密码学中数字签名的特征。\n\n- ■ 可验证性：如果加密信息可以用\
  \ A 的公钥解密，就可以 100% 确认 A 发送了消息。\n- ■ 不可伪造性：如果有另一个人 C 拦截这条消息并用自己的私钥发送他自己的消息，那么 A 的公钥将无法解密它，因为\
  \ A 的公钥只能解密用其自己的私钥加密的信息。\n- ■ 不可否认性：同样，如果 A 声称“我没有发送这条消息，是 C 发的”，但 B 可以使用 A 的公钥解密信息，这证明了\
  \ A 在撒谎。这样，A 就无法收回他之前发送的信息，因此无法否认。\n\n# 1.2 经济学基础 (#ch00_fm04_contents.xhtml#rsec1_2)\n\
