  \n### 6.2.1���分叉、软分叉与硬分叉\n\n女巫攻击的防御是将交易放入新区块中的博弈。参与事件的人越多，他们勾结的可能性就越低；例如，他们来自不同的国家和不同的利益。\n\
  \n1.  **分叉 (Fork)**\n    在区块链中，矿工创建区块并将其链接到最长链。通常情况下同时生成一个区块。如果同时生成两个区块，就会出现两条长度相同的链，但交易的签名或顺序不同。这种情况被称为分叉。区块链分叉成两条具有相同“祖先”的链。两条长度相同的链，但交易信息不同。区块链分叉成两条具有相同“祖先”的链。\n\
  \n2.  **软分叉 (Soft Fork)**\n    软分叉在区块链或去中心化系统中是向前兼容的。向前兼容意味着发布新的共识规则时，节点不需要升级到新规则，因为软分叉的新规则仍然符合旧规则。在这种情况下，未升级的节点仍然可以接受新规则。所有执行旧规则的节点都在产生符合规则的区块。因此，链不会分叉。这就是软分叉区块链。\n\
  \n3.  **硬分叉 (Hard Fork)**\n    硬分叉指的是在区块链或去中心化网络中不兼容的分叉。硬分叉总是改变加密货币使用的技术。这种变化使得所有新的区块与原始区块不同。旧版本将不会接受新版本创建的区块。如果新的硬分叉失败，所有用户将回到原始数据。硬分叉的一个例子是\
  \ 2017 年比特币纽约共识的分裂，它最终比特币分裂为 BCH，并将区块限制从 1 MB 增加到 8 MB。尽管 8 MB 区块以前被认为是比特币网络中的不兼容区块，但在硬分叉激活后它是与\
  \ 8 MB 区块兼容的。\n\n另一个著名的分叉案例是以太坊上的 DAO 的硬分叉，这是展示社区规则分歧的最佳分析案例。原始以太坊链变成了两个版本的区块链——ETC\
  \ 和 ETH，每个版本都有不同的概念和代币。\n\n### 6.2.2 软分叉与硬分叉的主要特征\n\n1.  **软分叉的特征**\n    软分叉具有以下特征：\n\
  \n    1.  它没有创建新链。\n\n    2.  由于交易数据和区块数据结构的限制，复杂的规则更改（如更改区块大小）无法通过软分叉来实现。\n\n\n\
  \n\n### 2. 硬叉的特点\n\n硬分叉具有以下特点：\n\n1. 它创建了一条新链。\n2. 不考虑旧节点与新节点之间的兼容性，并对交易数据和区块数据结构进行重大更改。\n\
  3. 实现过程相对复杂（未升级节点的矿工将留在原始分支上）。\n3. 易于实现（它不需要你进行升级）。\n\n### 6.2.3 分叉的重要性\n\n从目前的主流观点来看，对分叉的总体意见是积极的。由于软分叉对网络产生的改变有限，关注焦点在于硬分叉为整个生态系统带来的变化。\n\
  \n### 1. 分叉链可以添加新的技术特性\n\n最著名的比特币分叉应该属于“分叉出来的”比特币现金 `BCH`。这里的重要原因是比特易（Bitmain）团队与\
  \ Core 团队之间的恩怨。比特易目前是全球最大的矿池。由于在区块扩展和隔离认证上缺乏共识，比特币决定在网络区块高度达到 `504,311` 之后，比特币现金\
  \ (`BCH`) 完成完成并执行了硬分叉。此后，`BCH` 更新了网络难度调整算法 `DAA`，并将区块容量从 `1M` 增加到 `8M`。在 `BCH` 分叉后，出现了大量的分叉币，每种都有自己的更新特性。因此，我们可以看到硬分叉实际上是一个为整个生态系统带来新的过程。自从中本发明比特币以来，比特币的硬分叉行为没有任何限制。各种不同特征的分叉比特币在市场上是完全兼容的，并且人们选择了最适合自己的货币。\n\
  \n### 2. 分叉与社区的关系\n\n分叉是无法达成共识的结果。在上面的例子中，比特币社区无法达成一致，导致了比特币区块链的分叉。如果我无法完成分叉怎么办？遗憾的是，如果无法通过分叉来解决问题，可能会导致团队采取不同的道路。例如，我们所熟悉的\
  \ BitShares 创始人 `BM` (`Dan Larimer`) 的案例，当无法与社区达成共识时，最终他只能离开团队。\n\n因此，无论从创新还是社区稳定性的来看，硬分叉的存在本身都具有合理性和积极意义。由于以太坊在处理高并发案例时性能较差，Vitalik\
  \ 已经在考虑 `PoS` 共识机制，但如果这可能会触及大量原始矿工的利益，最终会通过硬分叉解决吗？\n\n## 6.3 P + ε 攻击\n\n在现实世界中，很难判断一个人是好人还是坏人，以及一个人是自私还是利他。在民主世界中，少数服从多数已经是一个普遍共识。但作为多数认可的结果是合理的吗？我们首先排除受情感影响的个体的非理性行为。我们假设每个人都为了自己的利益做出选择，然后发现即使是看似公平的民主投票系统也包含许多不公平甚至错误的地方。\n\
  \n例如，经济学中的阿罗不可能定理主要包含两点：\n\n1. 即使在公平投票的情况下，投票也不一定能反映多数人的意愿。\n2. 同时投票很容易被主持人引导至想要的结果。\n\
  \n为了避免此类问题，有必要投入资金而不是投票。如果公平的投票环境中存在问题且投票被操纵，那么显然最终普通大众将遭受损失。因此，这也是去中心化区块链网络的最大意义，让所有的账户和选举都公开透明。这也是人们追求的目标。\n\
  \n同样，现实世界的经济规律与加密经济学规律相似。在区块链世界中，每个节点必须不断做出选择来确认哪个区块是真实的；这这也是一个投票过程。这个过程可能会被恶意节点利用，例如通过贿赂。这里提到的\
  \ `P + ε` 攻击只是此类过程中的一种。\n\n### 6.3.1 什么是 P + ε 攻击\n\n假设有一个简单的谢林博弈（Schelling game），用户通过投票来确定特定事实的结果，真相为\
  \ `(1)`，假为 `(0)`。\n\n此时，每个用户都可以根据自己的知识投票：`1` 或 `0`。如果用户的选项与投票中的多数意见一致，用户将获得奖励 `P`；否则没有奖励。我们可以在收益矩阵图中展示它，如`[图\
  \ 6.1]`所示。\n\n![Figure 6.1 Payoff Matrix without ε.](img/Fig06_01.jpg)\n\n**图 6.1\
  \ 不含 ε 的收益矩阵。**\n\n这里的理论逻辑是，如果每个人都希望他人诚实投票，那么他们的是为了尊重多数而诚实投票，这就是为什么人们相信并愿意为多数人选择的人投票；在这种情况下，系统达到了一个自增强的纳什均衡。\n\
  \n在这里，我们可以看到如果个人投了 `0` 且结果出来，多数票也是 `0`，那么个人就可以获得奖励 `P`；如果个人投了 `1`，多数票将是 `0`，个人将不会获得奖励。其他两种情况也是类似的。\n\
  \n显然，这是一个理想状态。那么，如果系统中存在不实甚至是邪恶的投票者呢？\n\n现在，让我们是否有攻击。假设一个拥有足够财力的攻击者承诺（如果钱足够，他会让其他人信任他）。如果投票结果为\
  \ `0`，那么该投票者将获得 `P + ε`（给出少数票的投票者）。如果投票结果为 `1`，则不支付任何费用（不投给多数票）。`[图 6.2]` 显示了收益矩阵。\n\
  \n![Figure 6.2 Payoff Matric with ε.](img/Fig06_02.jpg)\n\n**图 6.2 含 ε 的收益矩阵。**\n\
  \n对于投票者来说：如果投票者是理性的，这个多选择题非常简单，因为选择投 `1` 最符合自己的利益，因为投票最坏的结果获得奖励 `P`。如果你足够好，你可能会获得\
  \ `P + ε`（`[图 6.2]`）。\n\n对于攻击者来说：一旦这种作弊成功，攻击者可以在不支付任何费用的情况下实现目标。这非常简单，如果未被认可的选项\
  \ `1` 被许多攻击者说服投票并成为最终结果，那么根据协议，只有当结果显示选项 `1` 为少数时，才能获得 `P + ε`。\n\n必须说，从逻辑上讲，`P\
  \ + ε` 攻击是一种非常好的攻击方式。从目前来看，这种方式仍然成本很高，所以问题是你是否真的需要这样做。\n\n### 6.3.2 抵御 P + ε 攻击\n\
  \n事实上，以太坊创始人 Vitalik 从 `2015` 年就开始分析了这个问题，这是计划将以太坊升级到 `Casper` 的重要原因之一。`Casper`\
  \ 包含很多内容，感兴趣的人可以在网上搜索。目前，我们只需要知道它是基于 `PoS` 共识机制的。\n\n\n\n\n从上面的示例中看到，`P + ε` 最大的问题是攻击者可以在不预付的情况下组织攻击。他只需要证明自己有足够的支付能力即可。在\
  \ Casper 中，任何投票者的投票权重将与其持有的资产直接相关。换句话说，在做出选择之前，你必须向系统抵押某些资产（以太坊币是以太坊币的抵押），这些资产的金额决定了你的发言权。这将大大增加恶意行为的成本。每个投票者只能选择真实的结果来做出选择。如果你想改变结果并投资少数派，你可能不仅无法获得奖励，还会失去所有的抵押物和资产。\n\
  \n在这种情况下，如果犯罪者想要购买其他投票者，他只能展示更多的资产来获得他人的信任。\n\n## 6.4 DAO 攻击\n\n关于 DAO 攻击，我们必须首先了解这个故事的历史。\n\
  \n2015 年 7 月 30 日，维塔利克·布特林（Vitalik Buterin）和以太坊基金创建了第一个基于区块链的图灵完备智能合约平台。这一天，以太坊正式面。随后,[Sock.it](http://Sock.it)\
  \ 设计了 The DAO 以太坊合约，并在 2016 年 4 月 30 日正式部署了 The Dao 智能合约。2016 年 5 月 27 日，它完成了全球最大的众筹，募集了\
  \ 1.5 亿美元。\n\n2016 年 6 月 17 日，The DAO 遭到黑客攻击，大量以太坊被盗（3641,694 ETH）。这就是著名的 Dao 攻击。正因为这次攻击，原始以太坊遭受了巨大损害，最后在万不得已，为了挽救\
  \ DAO 投资者的损失，决定进行硬分叉。2016 年 7 月 20 日，在区块高度 1,920,000 处成功完成了硬分叉。被遗弃的原始链就是现在的经典 ETC。\n\
  \n回顾历史，这次 Dao 攻击应该是非常强大的，它的破坏力几乎摧毁了以太坊。在宣布资金被盗的那天，以太坊的价格下跌了 50%。\n\n那么什么是 DAO 攻击呢？\n\
  \n攻击者利用了合约中的一个致命漏洞。攻击者创建了一个合约来分配 The DAO 合约的 `splitDAO`，并利用漏洞让 The DAO 智能合约调用攻击者新合约中的\
  \ `()`()` 函数，然后在该函数中递归地分配 `splitDAO`。这种操作一直持续到 gas 耗尽、内存 `stacklimit` 达到或递归限制达到为止。在此之前，可以在不减少自己账户余额的情况下转移账户余额。\n\
  \n既然这个漏洞已经被修复，我相信将不会再有这样的递归调用了。\n\n# 6.4.1 The DAO 在加密经济学意义\n\n从某种意义上说，The DAO 是自比特币以来最重要的社会实验。在一个每个人都习惯了中心化管理的世界上，该如何实现去中心化管理呢？\n\
  \n首先让我们看看从从开始到项目发布的发展过程：\n\n1. 一群人为他们想要运行的组织编写了智能合约（程序）。\n2. 有一个初始资金阶段，在此期间人们通过购买代表所有权的代币向\
  \ DAO 提供资金来源（称为众筹或 ICO）。\n3. 筹款结束后，DAO 开始运行。\n4. 人们可以就如何使用资金向 DAO 建议，持有代币的成员可以对这些建议进行投票。\n\
  \n可以看出，从编程到筹款再到决策，它都是基于尽可能去中心化的原则。事实上，这也是我们讨论加密经济学时一个重要的通用性：去中心化。由于这一特性，在设计像 DAO\
  \ 这样的组织时，人们不应只考虑代码问题，因为代码支持分布式特性。DAO 的愿景是通过分布、去中心化来实现社区的自治，这个愿景非常好，但如果没有安全保障，即使是更宏大的梦想也可能幻灭。\n\
  \n这是公平的一面，但 DAO 攻击也向我们展示了这种经济设计存在的问题：\n\n1. 事故发生后，去中心化系统在应对上面临了困境。例如，如果解决方案提交太晚，会被舆论指责；但快速解决方案会导致更多的中心化，而且因为无法考虑到每个人，将受到部分抵制。\n\
  2. 犯罪者很难被追踪甚至追捕。首先，是因为没有特殊的法律限制，其次是因为犯罪者使用的方法在理论上并没有被系统禁止。从软件算法的角度来看，完善合约可能需要更多的时间。\n\
  3. 软件是开源的，因此提供代码的人遍布世界。是否存在恶意程序员？你能接受匿名贡献吗？在去中心化社区中，谁对软件负责？\n4. 矿工是区块链生态系统的重要部分。很容易产生中心化的聚集。但如何给矿工分配合理的奖励并限制他们的影响呢？在\
  \ DAO 的解决方案中，如果没有矿工的支持，可能会导致另一个完全不同的结果。\n\n我们需要去中心化的原因是因为我们相信没有完美的人，然后我们必须认真思考一个问题：是否存在完美的代码？\n\
  \n仍然有很多问题。DAO 攻击本质上是一个技术错误，但从加密经济学的角度来看，它更像是一个系统问题，甚至是哲学问题。\n\n## 6.5 零知识证明\n\n\
  “零知识证明”由 S. Goldwasser、S. Micali 和 C. Rackoff 在 20 世纪 80 年代早期提出。这意味着证明者能够让人相信某一个断言是正确的，而无需向验证者提供任何有用信息。零知识证明本质上是一个涉及两个或多个方的协议，其中双方或双方采取完成任务所需的系列步骤。证明者向验证者证明其知道或拥有某个信息，但证明过程不会向验证者泄露关于该信息的任何信息。大量事实证明零知识证明在密码学中非常有用。如果你可以使用零知识证明进行验证，你将能够解决很多问题。\n\
  \n有很多设计零知识证明的项目，但最著名的可能是 Zcash。\n\n这是一个简单的例子。如果你捡到了钱包并有人声称那是他的，你可以通过两种方式证明这些人是真实的钱包所有者：\n\
  \n1. 让对方提供钱包所有者的证明，或者如果钱包里恰好有身份证，就可以立即证明。\n2. 钱包里没有文件。你可以对方描述钱包的细节。如果你能详细描述，比如金额、钱包颜色、丢失的大致地点等……你也可以证明。\n\
  \n第二种方案就是零知识证明。换句话说，零知识证明的目的是让发送者保护自己的隐私，并在不发布身份的情况下实现交易。\n\n\n\n\n在零知识证明的机制下，个人信息中只有交易金额会对交易方公开，所有其他信息仅你本人知晓。但为什么这样做好呢？在这里，我们必须谈谈比特币的交易机制。我们知道，在比特币网络中，你的公钥是对所有人开放的，这意味着一旦你的地址暴露，从理论上讲，每个人都能知道你那里有多少了钱。而且，不仅是该地址的存款，还有所有与该地址进行过交易的地址的存款。在经过这些描述后，你感受到这里问题的严重性了吗？\n\
  \n2017 年的勒索病毒（WannaCry）病毒事件导致许多受害者支付比特币以赎回他们的文件。我们可以想象，如果未来黑客专门攻击并利用地址，将造成更大的损失。因此，如果你想存储大量的比特币，除非你从不使用该地址连接互联网，否则你将一直处于尾随之中。比特币的隐私已成为一个重要问题。零知识证明可以很好地解决这个问题，除非你主动披露，否则支付方无法知道你的发送地址和身份。\n\
  \n从加密经济学的角度来看，存在两个难以调和的矛盾。首先，区块链账本公开可以更好地形成共识。其次，如果地址被盗，通过各方的共同搜索总能找到某些线索。然而，一旦发送和接收地址被隐藏，万发生资产被窃，基本上没有办法进行溯源。目前人们如何选择尚且未知，自由与责任是每个人都需要思考的问题。\n\
  \n# 总结\n\n人类不断追求自由与平等。比特币的出现第一次让几乎每个人拥有了控制自己财富和平等创造财富的自由。但这个前提是以安全为保障的，没有人会为了自由而放弃安全。我们讨论了当前区块链资产世界发生的几个重大安全问题。这些并不是全部，未来可能还会有更多威胁。\n\
  \n我们面临的威胁可能来自技术，也可能来自系统。我们必须跳出单一技术思维的局限性，考虑整个加密经济圈的各个组件是一个合理的方法，而如何在这一整个加密经济生态圈的各个方面平衡权力、责任和利润，对该系统来说是一项长久而严峻的考验。\n\
  \n该系统的参与者包括：\n\n* ■ 代码创作（开源）：如何利用正向激励来激励软件编写不进行恶意行为？\n* ■ 项目维护：如何让维护者在保障自身利益的同时逃脱中心化？\n\
  * ■ 系统安全维护（矿工）：我们如何能实现合理的奖励和更大的分布式结构？\n* ■ 消费者：如何让用户易于使用并保持资产安全？\n* ■ 投资者和社区：如何减少投机行为并创造积极的社区文化？\n\
  \n因此，这种理想的系统允许各方通过合理的设计相互制约和发展，同时系统外的执行者无法从其恶行行为中获利。\n\n从现在起，比特币网络是一个资源的合理平衡。关键点是网络足够简单，外部攻击很难得手。尽管人们对矿工的高度集中存有疑虑，但它尚未达到中心化的程度。我们还可以进一步思考，如果我们实现了中心化，并在投入大量财务资源后进行恶意行为，那么作恶者的损失将将是巨大的。为什么呢？因为除了财务投入外，另一个确定的无形损失是，一旦恶意行为成功，比特币网络将不再具有信誉，这可能导致当前高价值的瞬时归零。从这个角度来看，任何终极目标是利益的个人或组织都没有这样做的动机。\n\
  \n尽管我们仍在经历此起彼伏的安全危险，但我们相信，只要人类不断探索，未来将有解决方案。\n\n# 第 7 章：中国的区块链\n\n## 7.1 区块链在中国的力量\n\
  \n如今，区块链技术被认为是自互联网发明以来最具颠覆性的技术创新。在没有第三方中心干预的情况下，参与者可以达成共识并以极低的成本实现信任和价值的可靠传输。\n\n\
  区块链的安全特性信任机制正成为数字经济发展的重要技术引擎。它可以作用于各个行业。行业应用领域的潜力巨大，预计将重塑生活的领域。根据 Gartner 的预测，区块链市场价值将在\
  \ 2025 年达到 1760 亿美元，并在 2030 年达到 3.1 万亿美元。\n\n目前，不同行业已有大量区块链应用的成功案例，它们已经带来了明显的经济和社会效益。例如，在金融领域，区块链已应用于供应链金融、信用、保险、司法电子信息备案和账单。它还应用于许多其他行业，如文化产品版权管理、交易、农产品溯源、网络安全信息交换、警方数据交换、医疗协会、房地产质押证、电子发票、企业税务数据库、区块链扶贫和基金管理。\n\
  \n## 7.2 中国区块链的实际案例\n\n### 7.2.1 金融解决方案\n\n金融行业本质上富含许多原始数据并需要大规模共识，因此符合金融领域的需求。\n\
  \n例如，`供应链金融`。传统的供应链金融存在许多问题，如信息碎片化、企业信用无法传输以及合规风险难以有效控制。区块链基于共享账本完成信用传输并使用时间戳技术，因此具有难以篡改的特性，从而实现交易确认和交易真实性证明。它根据`智能合约`为供应链金融业务执行提供自动化操作工具。\n\
  \n\n\n\n2017 年 3 月，京东金融推出了一个基于区块链技术的资产云工厂基础设施资产管理平台；旨在帮助京东消费供应链的金融服务类公司落地京东金融的资产云工厂业务中。该系统设置了三个验证节点：申请、审批、贷款；底层资产池中每笔贷款的其他资金流向必须通过区块链上的每一个验证节点；资金流信息通过其指定的支付通道直接链到链上，确保了底层资产生成与循环与区块链之间的强耦合，并保证了入链资产与出链资产的一致性。同时，通过分布式账本和共识机制实时维护各机构的信息和资金，有效解决了机构间耗时费力的对账和清算问题。\n\
  \n2018 年，腾讯也将焦点转向了供应链金融解决方案。2018 年 4 月 12 日，腾讯区块链正式发布了“腾讯区块链+供应链金融解决方案”。该方案通过应用区块链技术和运营资源，从根本上改善了小微企业的融资困境，并为当地产业的转型和升级做了贡献。它以核心企业的应收账款为底层资产，通过腾讯区块链技术实现了信用凭证的流通，确保相关信息不可伪造、不可再融资、可追溯，并帮助相关方形成供应链。\n\
  \n在信用信息行业，存在市场参与者圈子较窄、公共信用报告机构覆盖范围有限以及个人信息安全等缺点。在该行业应用区块链用于完成`the credit information\
  \ on chain`，从而保证了原始数据的不可篡改。正如此，工信宝在 2016 年开发了基于区块链技术的通用数据交换平台“工信宝数据交换”。其底层是基于区块链（公链）的联盟链。典型客户包括互联网金融公司、政府部门、银行和保险公司。`工信宝`主要通过数据爬虫产品在用户授权下收集用户数据，涵盖泛金融、泛电商、泛社交和个人身份等多个维度，为各大银行、互联网金融公司等机构提供信用基础。`工信宝`会对交易双方进行匿名化，实现数字资产的所有权认证，有效遏制数据交换中的欺诈行为。\n\
  \n2016 年，中国市场将区块链技术应用于不同行业的领先者之一`秘比`与`天诚诚信`达成战略协议，旨在通过区块链去中心化互助合作以及全网会计系统构建一个通用的信用信息系统，并利用区块链共识机制建立开放信用。双方设计的区块链信用解决方案是：存储在区块链中的数据部分公开可见，有需求的用户可以通过搜索找到所需数据并从所有数据供应商处购买。该方案将解决数据提供者之间的信任和交易难题，并减少数据交易的流程和成本。\n\
  \n据不完全统计，全球范围内正在进行的区块链应用场景中超过 20%涉及保险。尽管区块链技术在保险行业的应用大多仍处于技术验证阶段，但应用场景的快速发展已经预示了该技术将给`insurance\
  \ industry`带来变革性影响。根据调查，全球超过一半的保险公司高管已经认可区块链技术对保险行业的重要性。\n\n保险的本质是风险交易，可以自然地服务实体经济，但保险行业面临着数据分散和数据安全等重大挑战。区块链可以基于共享账户实现大量分布式节点的信息共享和连接。区块链确保了保险服务过程更加透明，并利用智能合约实现业务自动化。通过这种方式，中国银行与科技巨头\
  \ IBM 共同开发了基于区块链技术的银行财资服务系统。\n\n另一个有趣的例子是`上海证券交易所区块链保险服务平台`，它于 2017 年 9 月推出。该平台独立开发了`Golang\
  \ national secret algorithm package`，在电子保单存款证书场景下支持每秒 50,000 次指纹数据验证链，并能响应高并发系统请求。该系统可以广泛用于保险交易、金融清结算以及反欺诈和监管合规。\n\
  \n根据公开信息，保险链的主要服务结构包括四个方面：共识服务架构确保了链上数据的一致性；身份认证服务架构实现了身份数据的认证、审计、发放和管理功能；在确保智能合约安全的前提下，合约服务架构实现了安装、应用和升级智能合约的服务功能，为区块链系统中的认证服务提供了强有力支持；平台服务架构满足动态性，提供同一网络、同一底层平台下的多链配置和接入模式服务。同时，该链支持数据安全与清洗、应用场景系统和数据交换服务三大功能。\n\
  \n## 7.2 警方及其他政府解决方案\n\n中国正式强调公正公平的核心价值。区块链技术构建的透明可追溯网络符合这些公正公平价值观，同时可以提高司法效率并体现司法程序公正。在法律领域，区块链可以应用于发票、取证、电子数据、PoE\
  \ 以及公安数据。\n\n2012 年，《民事诉讼法》首次通过了电子取证规定，取证开始作为有效证据使用。然而，该领域的主要问题是电子数据的真实性和完整性。由于区块链的主要特征是可追溯性，它可以解决这些问题并确保电子数据的真实性。浙江数存公司为此目的开发了安全网络链。在杭州互联网法院的一起信息网络传播权纠纷案中，一方使用了该安全网络进行取证。审理后，法院认可了区块链在电子数据保存中的应用。在此案中，区块链首次在中国法院获得认可。\n\
  \n\n\n司法领域存在的另一个问题是不同司法机构之间的`data sharing`（数据共享）。例如，根据现有的法律体系，公安系统的三个机构之间是相互独立的，这影响了工作的效率和准确性。区块链在该领域可以做出巨大贡献，能够基于共享账本实现链上数据共享，并连接公安机关、检察院和法院，从而提高案件整合处理的效率。贵州锐普政法大数据平台自\
  \ 2016 年投入使用以来，被退回补充调查（证据不足时）的案件仅占 2.3%，较去年减少了 25.7%；因证据不足导致的不起率同比下降了 28.8%，因证据不足导致的无罪判决比例接近于零，办案时限缩短了近\
  \ 30%。该链已在贵阳、四川和广州落地。\n\n另一个有趣的例子是`Arbitrage Chain`（仲裁链）。2018 年 2 月，广州仲裁委员会颁发了首个基于区块链技术的“区块链\
  \ + PoE”奖。所谓的`Arbitrage Chain`已稳定运行了 5 个月，它由微银行联合广州仲裁委员会和杭州易贝科技公司共同构建。`Arbitrage\
  \ Chain`基于区块链，有助于防止篡改，具有可信赖、分布式和基于加密算法的特点。当数据通过共识机制签名并确认后，通过智能合约进行补充以确保数据的真实性，从而可以保证裁判和证据的合法性、关联性要求和标准化。\n\
  \n涉及此类事项时，用户的认证结果和业务操作证据的`HASH`值将记录在`Arbitrage Chain`（法律链块）上。当需要仲裁时，相关人员只需点击按钮，相应的证据就会传输到仲裁平台。仲裁机构收到数据后，通过区块链节点进行数据校验，并根据网络仲裁规则进行验证后发布仲裁裁决。\n\
  \n共识和实时证据在发生纠纷时可以通过`PoE`数据进行验证，并被视为直接证据，减少了仲裁流程和成本，并提高了效率。\n\n### 7.2.3 食品安全与供应链\n\
  \n食品安全问题长期以来一直是媒体的热点。地油、有毒奶粉、所谓的“僵尸肉”和镉米等食品安全事件屡见不鲜。区块链基于去中心化和可追溯性，具有透明性，因此可以创建一个可追溯系统和“不可破坏”的食品安全链。如此，2017\
  \ 年 12 月 14 日，沃尔玛、京东、IBM 和清华大学共同建立了`Safe Food Blockchain Traceability Alliance`（食品安全区块链溯源联盟），旨在通过区块链改进食品追踪和安全。这四方的合作为中国食品安全生态系统创建了有效标准。其中，`IBM`利用自己的平台提供专业知识，清华大学担任技术顾问分享其在核心技术和中国食品安全生态系统方面的经验。`IBM`和清华大学计划与沃尔玛和`JD.com`合作开发优化区块链技术，并推动更多供应商和零售商加入联盟。\n\
  \n目前，京东已有 100 多个品牌上链，超过 300 个热销产品关联了防伪溯源数据数据块。沃尔玛的测试显示，通过应用区块链技术，一箱芒果从农场到商店的追踪过程已从几天缩短至\
  \ 2 秒。而且食品召回的时间显著缩短，消费者发生食品中毒的风险也大大降低。\n\n## 7.3 中国成功的奥秘\n\n中国已经证明了自己是区块链应用的领先国家之一，人们常说其应用水平仅位于美国之后，甚至已经取代了美国。原因是什么？中国是如何取得这些成果的？\n\
  \n早在 2016 年 12 月，国务院就发布了《“十三五”国家信息化规划》，将区块链技术与物联网、云计算、大数据和人工智能等新技术并列为实现可持续发展、深化结构性改革和推动升级的关键引擎。2018\
  \ 年 5 月 30 日，习近平在在中国科学院第 19 次学术大会和中国工程院第 14 次学术大会上的讲话中，肯定了区块链技术的意义。“21 世纪以来，全球科技创新进入了一个前所未有的活跃时代。新一轮科技革命和产业转型正在重塑全球创新格局，重塑全球经济结构。以人工智能、量子信息、移动通信、物联网和区块链为代表的新一代信息技术，正在加速突破性应用，并培育以合成生物学、基因编辑、脑科学和再生医学为代表的新兴生命科学。融合机器人、数字和新材料的先进制造技术，正在加速制造业向智能化、服务导向和绿色化的转型。”\n\
  \n根据 Reality Shares 的研究，2019 年 8 月，中国公司申请的区块链相关专利数量（1338 件）几乎是美国公司（442 件）和德国公司（44\
  \ 件）的三倍（图 7.1）。\n\n中国公司拥有的区块链专利数量占全球专利申请总数的 68%。世界排名前名的公司——`阿里巴巴`（380 件）、`中国联通`（168\
  \ 件）和平安保险（163 件）均为中国公司，而排名第四的`IBM`（146 件）位于美国（图 7.2）。\n\n中国政府也关注区块链的功能性。中国政府机构已领先理解公共和企业级区块链项目。中国信息产业发展中心定期发布主流链技术评价指标和排名，如`Bitcoin`、`EOS`和`Ethereum`。\n\
  \n\n\n此外，从 2017 年开始，政府批准的中国电子标准研究院（CESI）开始对标准区块链系统的功能进行测试，以验证在中国运营的顶级区块链项目的稳健性。该认证过程非常严谨，基于广泛的指导原则，并考虑了区块链技术的新兴特性，这些特性在难以管理的环境中非常有用。目前，只有\
  \ 30 个项目通过了认证。认证是自愿的而非强制的，但在区块链社区具有很高的公信力。\n\n此外，中国似乎将成为首个应用区块链数字货币（DCEP）的国家。中国人民银行已对其进行了\
  \ 5-6 全年的研究，并且已经有了 40 多个项目（注：原文可能意指“projects”）。其核心理念是采用一种双层操作系统；即人民银行首先将`DCEP`发放给银行或其他金融机构，再由这些机构兑换给公众。`DCEP`的意义在于它不是现有货币的数字化，而是`M0`的替代方案。它极大地减少了交易对账户的依赖，有利于人民币的流通和国际化。同时，`DCEP`可以实现对货币发行、会计和流向等数据的实时采集，为货币的制定以及货币政策的制定与实施提供有用的参考。\n\
  \n因此，在政府的高度支持和广泛应用下，区块链已经在许多行业成功落地，并在近年中国的实际应用中取得了明显的成功。\n\n# 第 8 章：加密经济学的未来\n\n\
  蒸汽机为人类提供了动力。互联网为人类提供了计算平台，而区块链将解决人类的信任问题。\n\n区块链的出现直接改变了社会的生产关系，我们可以预期资源可以更公平地分配。区块链公平性的基础是规则的制定和执行与中心化组织相分离，并被点对点网络的共识所取代。因此，我们需要更仔细地观察区块链对社会的影响。在这种情况下，加密经济学应运而生。\n\
  \n信任从未被量化，因为它是无形的，只存在于人与之间的感知。但信任的价值是巨大的。例如，小偷对社会的损害不仅在于偷走了受害者的财富，还造成了不公。更重要的是小偷的存在增加了整个社会的信任成本。\n\
  \n在解决基础信任问题后，区块链会对我们产生什么影响？我想我们可以从以下方面进行展望：中介人的服务将逐渐消失，这将允许利益更快地分配。\n\n中介人的存在是因为市场信息不对称以及市场交易双方之间缺乏信任。如果你将这种服务放在链上，它将极大提高陌生人之间的交易效率，例如租赁市场、二手交易市场和虚拟商品市场。\n\
  \n因为信任方是`smart contract`而非人，平台的运营成本非常低，成本的降低可以自然地惠及买卖双方。此外，由于平台是可信的，且确认权是明确的，这将让人们更容易做出决策。\n\
  \n## 1. 共享经济\n\n共享经济将进一步注入活力。目前最成功的共享项目是`Mobike`和`滴滴`。通过区块链和`物联网`的结合，未来的共享可能是这样的：\n\
  \n在开发交易策略过程中的任何投资者都需要参考各种数据。其他人在使用这些数据时需要支付特定的代币。如果用户通过数据开发出成功的交易策略，那么最初的数据上传者可以获得`名利`，如果数据被证明是伪造或没有实际意义，上传者将受到惩罚。上述机制也适用于投资者设计的交易策略。\n\
  \n## 2. 社区管理\n\n未来，社会将产生越来越多的社区，这些社区将拥有自己独特的价值。例如：健身、写作、音乐……\n\n我们如何能在更短的时间内达成共识？社区很有可能拥有自己的`smart\
  \ contract`，奖励和惩罚不是个人，而是代码。加密经济学的生态发展将极大地改变人与人的合作、群体内部合作，甚至是国家之间的关系。由于这一切都是基于一种新的社区形式，我们需要考虑更多。\n\
  \n## 3. 加密经济学的应用\n\n目前已经有很多基于并设计加密经济学的应用。在解决了区块链共识这一基础问题后，我们可以在`Ethereum`等区块链上构建各种应用。组织和个人可以创建自己的应用。通过`smart\
  \ contract`代码的形式在不同场景下设计条件逻辑，并使用价值单元进行激励和惩罚，以实现目前无法实现的结果。\n\n例如，作为交易策略市场的`Signals`可以通过加密经济学来实现目标，而`Signals`使用其本地代币`SGN`来创建奖励机制。\n\
  \n\n\n\n因此，为了进行更公平的代币分配，一些项目采用“荷兰式拍卖”作为其代币拍卖的模型。荷兰式拍卖是指竞价价格从高到低逐渐，直到第一位出价者在价格达到或高于储备价时达成交易。这使得加密经济学应用被引入到了拍卖领域。\n\
  \n无论是建立低层共识协议，还是设计更优代币销售机制，都可以视为一种加密经济学。构建这些应用需要理解激励机制如何影响用户行为，设计能够可靠产生结果的经济机制，并且有理解构建构建的底层区块链的功能和局限性。\n\
  \n当然，还有许多区块链应用并非加密经济学的产物。例如，`Status` 和 `MetaMask`，这些平台和钱包类程序允许用户与 `Ethereum` 区块链进行交互。除了区块链底层已有的机制外，这些机制并不涉及任何其他加密经济学机制。\n\
  \n# 结论\n\n从加密经济学的角度思考区块链空间非常有帮助。一旦你对加密经济学有了一定的理解，就可以破解我们行业中的许多争议和辩论。\n\n例如，一种带有中心化管理且不使用工作量证明的“许可链”，自首次引入以来就一直存在争议。这一领域通常被称为“分布式账本技术”，侧重于金融和商业用例。许多区块链技术的支持者不喜欢这种技术。这些“许可链”从字面上说是区块链，但其中一些总是很诡异。“许可链”似乎拒绝了每个人认为的区块链的核心理念：可以在不依赖中心化信任方或传统金融系统的情况下达成共识。\n\
  \n区分它们的最佳方法是看这个区块链是否是加密经济学的产物。一个简单的分布式账本，一个基于加密经济学设计以达成共识或调整激励机制的区块链，可能对某些应用有用。但它与那些利用密码学和经济激励来生成无先验共识的区块链（如\
  \ `Bitcoin` 和 `Ethereum`）完全不同。这是两种不同的技术，区分它们的最佳方法就是看它们是否是加密经济学的产物。\n\n此外，我们应该预期未来会有不依赖于“区块”和“链”的加密经济学共识协议。显然，这种技术与区块链技术有共同之处，但将它们称为区块链是不正确的。我们需要看这样一种协议是否是加密经济学的产物，而不是看它是否是区块链。\n\
  \nICO 关注这种区别，但很少有清晰的解释。代币价值的最强表现之一是，许多人独立地意识到 = 它是否构成了所连接应用的不可或缺的一部分。更清楚地说：代币是否是应用程序中加密经济学机制的必要部分？这正是为什么理解\
  \ ICO 项目中的机制设计对于确定代币的效用和价值至关重要。\n\n在过去的几年里，我们一直从单一应用（`bitcoin`）的角度来思考这个新领域，而我们已经转向了底层技术（`blockchain`）的视角。现在我们需要退退一步，以统一的方式看待这类解决方案，即加密经济学。\n\
