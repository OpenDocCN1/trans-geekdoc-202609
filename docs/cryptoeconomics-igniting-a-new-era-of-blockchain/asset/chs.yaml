  \n经济学是一个复杂的概念。在本书中，我们只描述一些与加密货币和区块链相关的经济理论。\n\n区块链与其他去中心化点对点系统的区别区别在于，它为用户提供了财务和经济激励来完成工作。像其他稳固的经济系统一样，我们都需要人们通过激励和奖励来完成工作。同样，假设有两个人\
  \ A 和 B。A 想要发送一些非常重要的数据，B 想要识别这些数据是否真的来自 A；他们可以通过使用 A 的公钥和私钥来实现这一点。公钥，顾其名，是指任何人都可以获取的公钥。私钥是个人拥有的密钥，不能与他人共享。此外，通过某人的私钥来确定其公钥是不行的。\n\
  \n\n\n比特币的总量固定在 2100 万个。由于总量是固定的，因此在考虑比特币的供应时，需要考虑的因素很少。首先，需要设定一些规则来增加比特币挖矿的难度。否则，矿工将乐于挖矿、提取剩余的比特币并将其投入市场，从而降低整体价值。\n\
  \n为了确保矿工不会立即提取所有剩余的比特币，我们需要使用以下手段。\n\n首先，每 10 分钟向链添加一个新区块，每次添加区块时，你就可以获得 25 个比特币作为奖励。时间间隔必须是固定的，以确保矿工不会在没有规则的情况下持续向链上添加区块。其次，比特币协议要求难度水平不断增加。正如前面提到的，在挖矿过程中，区块的哈希值和随机数（nonce\
  \ value）需要低于某个限制。这个值被称为“难度系数”，通常以几个零开始。如果难度增加，零的数量也会随之增加。通过以上两种方法，挖矿过程变得非常专业化并吸引了巨大的投资。整个过程确保了市场中所有的比特币供应都可以被验证，这也被应用于基于工作量证明机制的其他加密货币。¹¹\n\
  \n[图 1.6] 代表了供需曲线，这是经济学中最常见的图表。如图所示，需求与供给成反比。两条曲线的交点是平衡点，因此让我们用这种逻辑来观察加密货币，例如比特币。\n\
  \n\n\n# 第二章：共识机制\n\n2018 年 2 月 24 日，比特币社区的一位演讲者在 Twitter 上发布了一封公开信，呼吁社区修改共识机制。当消息出来时，引起了轰动。许多比特币爱好者言辞犀利，认为这位演讲者完全不懂比特币，并要求他辞职。\n\
  \n为什么这个改变共识机制的提会在整个加密货币社区引发激烈讨论？让我们先理解什么是共识。\n\n“共识”这个词大家应该熟悉。不同的群体能够合作，必然是因为他们拥有共同的信念。那么，在区块链世界中，“共识”意味着什么？为什么我们需要共识？\n\
  \n当你提到区块链时，每个人都会想到“去中心化”特征。换句话之，就是去中间化。我们目前的社会结构包含了如银行、淘宝和视频网站等各种第三方中介机构。例如，淘宝会根据我们的购物习惯推荐产品，让你产生购买冲动。那么我们能要求淘宝不要窥探我们的购物习惯、不要向我们推荐购物清单吗？不能。因为淘宝是一个中心化组织，规则由它设定，它没有必要与我们达成共识。\n\
  \n但在区块链世界中，没有中介机构，这意味着没有人会设定规则。每一项规则的制定、变更等都需要达成共同的理解。然而，要让所有人满意是很困难的；每个人都坚持自己的观点，因此达成共识非常困难。\n\
  \n让我们再次以淘宝为例。当我买东西时，只有在我付了钱后，卖家才会发货。如果卖家表现得像什么都没发生过一样，淘宝可以简单监控网站上的记录并监督卖家发货给我。一旦没有了淘宝这样的中介机构，谁来充当裁判员？我说我付了钱并找了朋友作证；另一个人说我没付钱但也找了一群朋友作证。一旦这种情况发生，局面就会陷入僵局。\n\
  \n\n\n\n\n当信件由六位将军签署时，就达成了“攻击”协议。与口头协议相比，书面协议可以帮你找到信息的来源，并揭示同意攻击的将军。如果他们共同攻击，而那些签署攻击的人在攻击期间撤退，那么该将军就是叛徒，他将在撤退时被处死。\n\
  \n但这种书面协议也存在一个问题：如何确保在准确的时刻只有一个将军可以在信件后面添加自己的内容。换句话说，在 1 号将军的信件发出后，2 号到 10 号将军中，只有一个将军可以签署签名并将其传递给另一位将军。\n\
  \n在现实生活中，分布式网络中的节点可能多于十个。那么，如何设计一种共识机制来让大量节点“签署”指令呢？\n\n要设计这样的共识机制，我们必须遵循分布式网络的基本设计原则。这一原则被称为\
  \ `CAP`（一致性、可用性和分区容错性）理论。\n\n## 2.2 CAP 理论\n\n> 我爱鱼，亦爱熊掌。若鱼熊不可得，我宁舍鱼而取掌。\n\n这是中国哲学家孟子的名言，告诉我们生活中存在必须做的艰难选择。在分布式系统中，`CAP`\
  \ 理论就是系统设计师无法逃避的“鱼熊掌”问题。\n\n`CAP` 理论由著名的计算机科学家 Eric Allen Brewer 在 20 世纪 90 年代后期提出。具体来说，它认为一致性、可用性和分区容错性在分布式系统中无法同时存在。`CAP`\
  \ 理论认为网络中的任何数据共享系统最多只能具备三个条件中的两个：\n\n* `Consistency (一致性)`：所有节点都访问最新数据的相同副本，且所有应用程序在任何时候都可以访问相同的数据。\n\
  * `Availability (可用性)`：健康节点在有限时间内响应客户端的请求，而不需要一直等待。\n* `Partition Tolerance (分区容错性)`：所谓的分区意味着系统无法在时间限制内实现数据一致性。一旦发生这种情况，必须对当前操作在\
  \ `C` 和 `A` 之间做出选择。你必须确保当集群中的某些节点断开时，集群能够继续提供服务。\n\n`图 2.1` 表示了这三个元素之间的关系。\n\n\n\
  \n如图所示，为了满足 `CP`，在网络分区的情况下，为了实现 `C`，请求只能等待一段时间，结果无法实现 `A`；如果为了实现 `CA`，节点状态必须在时间范围内保持一致，且不能出现网络分区，因此它无法满足\
  \ `AP`。为了满足 `AP`，分离的节点同时提供服务但无法相互通信，这将导致状态不一致且无法满足 `C`。\n\n但事实上，没有任何分布式系统可以避免网络故障（`P`）。因此，系统架构师往往必须在\
  \ `C` 和 `A` 之间做出选择。\n\n## 2.3 PoW（工作量证明）机制\n\n在比特币诞生后的十年里，随着网络节点数量的增加，发起攻击的成本变得越来越贵，`PoW`\
  \ 机制已被证明是安全可靠的。然而，为了维护账本的一致性（`CAP` 理论中的 `C`）以及在网络节点掉线（`P`）等问题时的系统运行稳定性，比特币网络在某种程度上牺牲了可用性（`A`）。有些人也将这个问题称为“延迟”，即延迟问题。网络需要等待\
  \ 10 分钟，并且在账户更新之前应该有足够的交易被确认。如果比特币要获得 `AP`，客户端应该在交易加入区块链时立即接受它，这样它就不需要依赖其他节点，这非常有用。但风险是剩余节点可能会拒绝交易，从而牺牲一致性。\n\
  \n中本聪明的 `PoW` 设计的核心思想是：你可以成为叛徒，可以作恶，可以制造伪造账户来破坏整个网络的稳定性，但你必须承担相应的成本。在 `PoW` 机制下，一个人必须完成整个网络\
  \ 50% 以上的工作量才能发起攻击。这种成本是巨大的。最好诚实地遵守规则并赚一些比特币。\n\n此外，许多人认为钱最重要的一点是安全。他们认为在 `PoW`\
  \ 机制中投入大量工作解决数学问题以确保比特币的安全是一种浪费的行为。在这里，我们将讨论 `PoW` 机制的三个社区经常讨论的重大问题。\n\n答案可以在白皮书中找到，挖矿可以获得奖励。每次账本更新代表\
  \ 50 个比特币的奖励，每 4 年减半一次。2009–2012 年为 50 个，2013–2016 年为 25 个，2017–2020 年将为 12.5 个。这一经济激励机制允许更多矿工参与，不断更新账本并共同维护稳定性。\n\
  \n### 2.3.1 PoW 问题 1：资源浪费\n\n冰岛被誉为“矿工天堂”。那里温度很低，计算机服务器可以自然冷却，而且地热能和水电站的可再生能源使得电价更低；通过这种方式吸引了世界各地的比特币矿业公司。\n\
  \n\n\n\n2018 年 2 月中旬，多家海外媒体报道，冰岛 2018 年用于挖矿的电量将超过该国 34 万人口的总家庭用电量。一周后，Elite Fixtures\
  \ 网站发布了当周更新的比特币挖矿成本调查。结果显示，开采一个比特币，`Antminer S9`的平均耗电为`17,773 kW`，`S7`的耗电为`45,889 kW`，而`Avalon\
  \ 6`的耗电为`55,294 kW`。许多媒体并不理解什么是比特币矿；他们只是在追踪热点，就像追踪“电力消耗”一样。他们用“震惊！”和“太糟糕了！”等词来强调挖矿能量消耗是巨大的。\n\
  \n作为比特币矿机制造商的领导者，比特大陆从未公开过其对能源问题的立场。2018 年，我与著名的中国经济学家步非沫讨论过挖矿问题；关于挖矿功耗是否可以定义为浪费行为，步先生的回答非常简单且犀利：“我花自己的钱买我想消耗的电。这是简单的消费者行为。这怎么能浪费呢？”\n\
  \n`PoW`机制也被应用于市值第二大的加密货币以太坊。但以太坊创始人维健·布特林（Vitalik Buterin）希望修改共识机制。当我问他为什么时，他回答道：“我个人觉得`PoW`浪费能量并对环境有负面影响。现在比特币挖矿的耗电相当于整个新加坡的用电。而以太坊目前的耗电量达到了新加坡总用电量的\
  \ 30%”。\n\n我将经济学家关于浪费资源的观点转达给了维健·布特林。他这样反驳道：“从社会角度来看，这确实是一种浪费行为。但从矿工的角度来看，这不是浪费资源”。\n\
  \n事实上，如果任何消费者行为都被上升到社会层面，问题将会变得复杂。\n\n### 2.3.2 PoW 问题 2：环境问题\n\n去年 12 月，CNNMoney\
  \ 报道称某些专家表示比特币挖矿消耗大量能量，可能对环境有害。例如，气象学家埃里克·霍尔陶斯（Eric Holthaus）认为比特币挖矿正在减缓化石燃料向可再生能源的转型，并最终消耗超过可用范围的电力。环保主义者也毫不落后，他们担心比特币挖矿将严重损害全球应对气候变化的努力。\n\
  \n1 月，瑞瑞银行在最新报告中提到，比特币挖矿不太可能引发“环境末日”。该报告指出，“线性预测矿工的功耗趋势线是错误的，因为该行业可能会开发更具能源效益的硬件和实践，以获得竞争优势。报告指出，这种现象在大麻种植者和数据中心运营商在这些行业高速增长时期都曾发生过”。\n\
  \n当然，污染环境的论点可以为该行业提供新的商业机会。现在许多公司已开始研究绿色挖矿。\n\n去年 12 月，我收到一封来自美国的邮件。该公司表示他们正在研究绿色挖矿，并向我索联系方式。我查看了他们的官方网站，但没有发现任何内容。2018\
  \ 年 2 月，我看到许多公司提供绿色挖矿解决方案。根据报告，这些机器的成本高于传统水电电。因此，即使你使用绿色挖矿，结果也将是灾难性的。\n\n### 2.3.3\
  \ PoW 问题 3：权力集中\n\n比特币自诞生以来经历过多次“死亡”。除了外部因素，我们必须意识到，如果矿机发货延迟而网络算力在增加，矿工将遭受巨大损失。`PoW`机制也被应用于以太坊。\n\
  \n在激烈的竞争中，吴极汉的技术合作伙伴展锐（Micree Zhan）在公司成立不到 6 个月后，独立开发了第一代比特大陆 Antminer S1 矿机。与前代矿机相比，相同算力的能耗减少了一半。2015\
  \ 年初，展国宽开发并发布了第五代比特大陆 Antminer S5，确立了比特大陆在矿业市场的领先地位。\n\n```\n图 2.2 算力分布\n\n```\n\
  \n\n\n\n事实上，仔细回顾早期中国矿机厂商的发展史，可以发现它与当前的 ICO 热潮有极大的相似之处。当时也出现过各种混乱，如延迟交货、诈骗和非法集资，这些都考验着行业内人的信誉。`Viabtc`\
  \ 的创始人杨海波曾叹道：“曾有很多与 `Bitmain` 同时存在的矿机厂商，但后来它们都破产了。矿机制造需要采购、供应链、物流等方面的协调。`Bitmain`\
  \ 的成功表明吴忌寒是一个公司非常优秀的‘舵手’”。\n\n2018 年 2 月 24 日，CNBC 引用分析公司 `Bernstein` 的数据，`Bitmain`\
  \ 在 2017 年的收入高达 30 亿至 40 亿美元，等同于 `Nvidia` 去年的利润。`Bernstein` 的分析师在报告中提到：“但 `Bitmain`\
  \ 仅用 4 年就实现了这一点，而 `Nvidia` 花了 24 年才达到这里”。\n\n《比特大陆疯狂赚取 30 亿美元，与英伟达竞争》这篇报告曾一段时间占据了国内外各类传统媒体和区块链媒体的头条。这篇文章引发了关于矿业行业是否存在巨额利润问题的讨论，并将其分为立场明确的两个群体。一组坚持认为\
  \ `Bitmain` 正在垄断矿机市场并试图控制 `bitcoin`；另一组则拥抱 `Bitcoin`，强调这是市场竞争的结果。\n\n中国知名区块链教育工作者（官方微信公众号为\
  \ `Lightning HSL`）黄世亮认为，“矿机越贵越好。价格越高，越说明吴忌寒对这个行业的贡献越大”。但他也承认 `Bitmain` 现在是矿业行业的一只“独角兽”。分析师\
  \ `Berstein` 估计，`Bitmain` 占据了 `Bitcoin` 矿机和 `ASICS` 芯片市场 70%–80% 的份额。\n\n正因此，社区呼吁改变共识算法，希望更多矿工参与并打破\
  \ `Bitmain` 的垄断。\n\n你仅仅通过修改共识算法就能击败这只独角兽吗？\n\n`Poolin` 的联合创始人朱发认为 `bitcoin` 算法的改变是一个陷阱：“首先，如果\
  \ `BTC` 不使用 `SHA256`（哈希算法），那么 `SHA256` 算力会立即切换到相同算法的其他货币，如 `BCH`、`SBTC`。结果是 `BTC`\
  \ 持有者将被‘困住’。其次，算法改变后，基本上第一件事就是为矿机制作新算法。因此 `BTC` 矿工必须重新购买矿。矿工将遭受损失。第三，如果使用像 `Monero`\
  \ 和 `Ethereum` 那样对 ASIC 不友好的算法，将使社区资源和价值流向其他货币，如 `Monero` 和 `Ethereum`。结果是 `BTC`\
  \ 持有者将遭受损失”。\n\n`Ethereum` 的创始人 Vitalik Buterin 推文了一种混合的 `PoW/PoS` 系统。\n\nVitalik\
  \ 并不是第一个提出这种 `PoW+PoS` 混合共识机制的人。早在 2012 年，一个化名为 Sunny King 的极客就发明了 `Peercoin`，并首次采用\
  \ `Proof-of-Stake` (`PoS`) 机制来维护网络安全。\n\n## 2.4 PoS (权益证明) 机制\n\n`PoS` 是 `Proof-of-Stake`（权益证明）。Stake\
  \ 意味着权利和利益，至于利益，每个持有者都是利益相关者。在 `PoW` 机制下，共识是在有人完成工作量并更新账本时达成的。在 `PoS` 机制下，拥有最多代币的持有者在系统中更有发言权。后者显然比前者高效，可以节省大量电力。\n\
  \n因此，`Ethereum` 也计划从 `PoW` 机制切换到 `PoW+PoS`。\n\n在这个层面上，巨户在 `PoS` 机制中比普通用户更有话语权。这似乎相当不公平。就像公司做决定时，最终决定由持有更多股份的股东决定。如果是这样，如何吸引更多新人参与呢？\n\
  \nVitalik 说 `PoW` 也存在对新用户吸引力不足的问题。他建议新用户从像 `CryptoKitties` 这样的 `Dapps` 开始参与系统。\n\
  \n这个答案似乎并没有说服力。`CryptoKitties` 这样的 `Dapps` 可以在 `Ethereum` 上开发，也可以在 `Bitcoin` 上开发应用。那么，哪一个对新用户更有吸引力呢？\n\
  \n正如我们上面提到的，`Bitmain` 在 2017 年赚了 30 亿至 40 亿美元，这是在 4 年内实现的，而 `Nvidia` 花了 24 年。我相信许多人会被此吸引。\n\
  \n当我们讨论 `Bitmain` 的垄断时，不能忽视市场不断演变的这一事实，会有新公司与 `Bitmain` 竞争。但 `PoS` 机制能以此方式演变吗？\n\
  \n经济学中有一个“资源诅咒”理论。这意味着丰富的自然资源可能是发展的诅咒，而非祝福。在 `PoS` 机制下，无论市场如何演变，巨户总能获得更多回报，这是一个富者愈利的死循环。这种共识方法会导致中心化，似乎违背了去中心化的精神。\n\
  \n## 2.5 LPoS (租赁权益证明) 机制\n\n这与 `PoW` 机制的情况相似；算力较小的矿工无法与巨大算力的矿工竞争。在 `PoS` 机制下，代币较少的用户无法与大额持有者竞争记账权，因此他们缺乏在网络节点运行的动力。\n\
  \n这意味着整个网络仅由少数巨户维护。只有当节点越多、参与者越多，网络才能更安全，因此有必要鼓励小参与。`Leased Proof-of-Stake` (`LPoS`)\
  \ 允许普通用户将币借给其他节点，增加该节点在网络中的权重。如果节点将交易添加到公共账本，收益将按比例分配给持有者。\n\n## 2.6 DPoS (委托权益证明)\
  \ 机制\n\n`DPoS` 是 `delegated Proof-of-Stake`（委托权益证明）机制。`DPoS` 基于 `PoS`，但增加了一个选项——被“委托”。获得记账权的人由社区选举产生并轮换。这类似于人民代表大会（NPC）制度。我们投票选出能代表社区整体利益的人，如果代表人表现不佳（例如没有按时记账），我们也可以替换他们。`DPoS`\
  \ 机制相比 `PoS` 机制相对更去中心化。\n\n\n\n\n\n无论是 PoW、PoS、LPoS 还是 DPoS，它们都遵循相同的规则：工作量越大，获得的硬币越多。如果一个人被选为代表，这难道意味着他在某些方面比优于其他人吗？难道是因为他过去必须完成了特定的“工作量”，才获得了今天的成就吗？我们可以简单地将各种共识机制视为市场上的产品吗？存在就是合理的，当它被采用时，就有市场。最重要的是开发你自己的产品，而不是恶意地“伤害”他人。\n\
  \n在过去的几年里，社区中开发出了许多共识机制，尤其是各种 ICO 项目创新的共识发明。无论是哪种共识机制，只要能产生需求并吸引更多人参与，就是有价值的机制。我们欢迎各种共识机制相互竞争，让市场决定胜者。\n\
  \n读者也可以利用想象力设计新的共识机制，例如信誉证明；一切都取决于声誉良好的人；信用证明；一切都取决于信用额度最高的人。\n\n# 第 3 章\n# 优化共识机制\n\
  \n## 3.1 PoW 机制的优化版本\n\n我们都知道比特币的 PoW 使用了 `SHA256` 算法。最初，个人可以通过 `CPU` 挖矿。然而，当比特大陆和蚂等芯片制造商开发出\
  \ `ASIC` 后，挖矿不再是个人可以轻松完成的事情。后来，随着显卡矿和矿池的出现，比特币社区开始担心矿池会导致算力集中，这违背了“一 CPU，一票”的原始设计理念。在那段时间，对中心化的焦虑非常严重。比特币社区的讨论非常激烈。比特币在论坛中反复被“死亡”。直到现在，关于矿池是否违反去中心化原则的辩论仍在持续。\n\
  \n### 3.1.1 莱币的 SCRYPT 算法\n\n`SHA256` 算法是人们认为导致专业矿机和矿池出现的原因之一，因为这种算法很容易计算。因此，人们开始寻找更好的算法。\n\
  \n那时，莱币问世，它基于 `SCRYPT` 算法。据说 `SCRYPT` 由一位著名黑客开发，由于它没有经过严格的安全审查和像 `SHA` 系列那样全面的论证，因此并没有被广泛使用。与\
  \ `SHA256` 算法相比，`SCRYPT` 有更高的硬件要求，占用更多内存，并消耗更多计算时间。并行计算极其困难。显然，`SCRYPT` 算法更具抗矿性。此外，莱币将区块时间更改为\
  \ 2.5 分钟。在山币仍然稀缺的时代，莱币依靠这两项创新取得了巨大的成功，并在长期内占据了山币的首位。\n\n后来，`SCRYPT` 算法被修改为 `SCRYPT-N`\
  \ 算法，改进了通用理念。它们都追求更大的内存消耗和计算时间，以抑制 `ASIC` 矿机。\n\n很快，莱币的成功引发了各种算法创新。在 2012 年到 2014\
  \ 年之间，算法创新一直是社区讨论的热点话题，每种使用创新算法的货币都能掀起一波浪潮。\n\n### 3.1.2 串联与 Dash\n\n重新排列组合是人类常用的创新方法中最常见的方法。除了增加内存消耗和增加计算时间的想法外，一些人开始思考：“你是否可以使用多个哈希算法而不是仅仅是的算法？”\n\
  \n因此，在 2013 年 7 月，Quark 发布，它是首次使用多轮哈希算法。这听起来是一件非常高级的事情，但实际上它非常简单，即对输入数据进行九轮哈希操作，并将上一轮的结果作为下一轮操作的输入。在这九轮哈希中使用的六种加密算法是\
  \ `BLAKE`、`BMW`、`GROESTL`、`JH`、`KECCAK` 和 `SKEIN`，它们都是公认的安全哈希算法，且实现代码已经存在。\n\n当这种多轮哈希方法出现时，它给了人们一种视觉上安全和强大的感觉，吸引了无数粉丝。\n\
  \nDash (`DASH`，以前名为 Darkcoin）基于这种微创新，它使用了 11 种算法：`BLAKE`、`BMW`、`GROESTL`、`JH`、`KECCAK`、`SKEIN`、`LUFFFA`、`CUBEHASH`、`SHAVITE`、`SIMD`\
  \ 和 `ECHO`，被称为 `X11`。随后出现了 `X13`、`X15` 系列。\n\n这种算法实际上是一种串行思想。缺点是只要其中一种算法被破解，整个算法就被破解了。它就像一条互锁的链：只要其中一个环断了，整条链就会分成两部分。\n\
  \n### 3.1.3 并行算法与 Heavycoin\n\n在串联的情况下，自然会考虑到并行性，Heavycoin (`HVC`) 是第一个尝试的。虽然它现在在国内不为人知，但它是第一次链上实现游戏，可以被认为是著名的。\n\
  \n`HVC` 算法的细节：\n\n1. 输入数据，执行 `HEFTY1` 哈希操作，获得结果 `d1`。\n2. 以 `d1` 为输入，然后执行 `SHA256`、`KECCAK512`、`GROESTL512`\
  \ 和 `BLAKE512` 操作，分别获得输出 `d2`、`d3`、`d4` 和 `d5`。\n3. 最后，分别提取 `d2`–`d5` 的前 64 位，形成最终的\
  \ 256 位哈希结果作为区块 ID。\n\n我们为什么要先执行一轮 `HEFTY1` 哈希？由于是 `HEFTY1` 极难计算，其抗矿机性超过了 `SCRYPT`。但像\
  \ `SCRYPT` 一样，安全性尚未通过官方机构的证实，因此增加了后四种安全认可的算法来增强安全性。\n\n让我们比较算法的串行连接和并行连接。串行连接方法如\
  \ Quark、`X11` 等，在串行连接中使用多种哈希函数，但并没有提高整体抗性，因为它们的安全性是由最弱的算法决定的。一旦任何哈希函数遇到碰撞攻击，就会危及整个系统的安全\
  \ (图 3.1)）。\n\n\n\n让我们看看并行连接算法 `HVC`；它分别从 `SHA256`、`KECCAK512`、`GROESTL512` 和 `BLAKE512`\
  \ 算法中提取 64 位，并在融合和混淆后获得最终结果。如果其中一种算法被破解，它只能危及 64 位之一，只有当四种算法同时被破解时，才会危及整个系统。\n\n\
  比特币只使用一种类型的哈希算法。想象一下当某一天 `SHA256` 被证明不再安全，虽然可以更改算法，但将不可避免地导致系统不稳定。如果你使用并行算法，你可以获得一个相对稳定的硬叉过渡期。\n\
  \n### 3.1.4 Primecoin\n\n\n\n\n\n当一些人不断探索算法时，另一些人指责 PoW 浪费能量，而 POS 机制已经实现。尽管支持 PoW\
  \ 的人正试图维持它，但他们必须承认 PoW 消耗能量的事实。这种指控开启了另一个探索路径，如果你能找到一种既能维护区块链安全又能以其他方式产生价值的算法，那就是完美的。\n\
  \n这种探索方向中最具启发性的结果是 Primecoin（质币）。它由 Sunny King（笔名）发明，他也开发了 Peercoin。质币算法的核心思想是在进行哈希操作的同时寻找大质数。为什么要寻找质数？因为质数在数轴上稀疏且分布不均匀，在数轴上寻找质数只能盲目搜索和探索，这正是\
  \ PoW 的特性。\n\nPoW 的另一个要求是易于验证。在这种情况下，人们在数百年的探索后取得了一些成果。Primecoin 通过两种方式进行测试：首先通过费尔马测试（Fermat\
  \ test），然后通过欧拉-拉格朗日-利普希茨测试（Euler–Lagrange–Lipschitz test）；如果两项测试都通过，就可以被认为是质数。需要指出的是，这种方法不能保证通过数百次测试的都是质数，但这并不影响系统的运行。即使测试结果错误，只要每个节点都将其视为质数，系统就能运行。\n\
  \nPrimecoin 实际上是在寻找坎宁链。\n\n坎宁哈链有三种特定类型：第一类坎宁哈链、第二类坎宁哈链和双孪生链（bi-twin chain）。\n\n\
  什么是坎宁哈链？让我们以第一类坎宁哈链为例解释。\n\n坎宁哈链中的每个数字都是前一个数字的两倍减一，例如：\n\n- `2, 3061, 6121, 12241,\
  \ 24481`\n\n序列中的下一个数字 `48961 (24481 * 2 − 1)` 不是质数，因此这条坎宁哈链的长度为 5，Primecoin 的目标是探索更长的坎宁哈链（所有三类均可）。\n\
  \n这里最重要的问题是：我如何利用坎宁哈链来验证一个区块是合法的？\n\n让我们来看看 Primecoin 的实现细节。\n\n1. 对中本·纳个明的区块头进行哈希：`hashBlockHeader\
  \ = SHA256(BlockHeader)`\n2. 通过转换获取坎宁哈链的第一个数字：`originNum = hashBlockHeader * Multiplier`\n\
  \n获得坎宁哈链的第一个数字 `originNum` 后，可以测试并计算质链长度的整数部分，而小数部分的计算与坎宁哈链中最后一个非质数的跨度有关。\n\n每个区块的复用是不同的，且计算过程与\
  \ `hashBlockHeader` 相关。为此，Primecoin 专门针对区块头进行了修改，并添加了字段 `bnPrimeChainMultiplier`\
  \ 来存储乘积因子。然而，在第一步计算 `hashBlockHeader` 时，输入数据并不包含这个乘积因子，这就是为什么特别指中本·纳个明的区块。\n\nPrimecoin\
  \ 是市场上第一个不使用哈希工作量证明机制的加密货币。挖掘过程本身具有一定的科学价值。但为什么你没有获得巨大的回报呢？\n\n根据我们已知的知识，质数在数轴上的分布不均匀，数字越大，质数越稀疏。寻找难度并非线性增加，因此时间消耗是不可预测的。然而，区块链需要区块的稳定性，而质数算法并不流行。但这种探索并非毫无意义，对\
  \ PoW 工作量的探索仍在继续。\n\n### 3.1.5 Ethash 和 Ethereum\n\n以太坊最初打算使用 POS，但由于 POS 设计的一些问题，开发团队决定在以太坊\
  \ 1.0 阶段使用 PoW 方法。然后在 Serenity（平静）阶段，以太坊将从 PoW 转换为 PoS。工作证明（PoW）意味着将电转化为热、Ethash\
  \ 以及网络稳定性。\n\n以太坊的 PoW 算法被称为 `Ethash`（Dagger-Hashimoto 算法的修改版本），它与比特币的 PoW 算法略有不同，使得可以使用普通硬件进行挖掘。\n\
  \n最新版本的 `Ethash` 设计旨在满足以下目标：\n\n1. **IO 饱和**：算法几乎消耗所有的可用内存带宽，这是实现 ASIC 抗性的策略，目标是可用内存，特别是\
  \ GPU 的显存（与电脑内存相比，它更接近理论上的最优值）。\n2. **“GPU 友好型”**：让 GPU 挖掘尽可能简单。CPU 挖掘几乎是不可能的，因为潜在的专门化影响太大了，而且\
  \ CPU 友好型算法具有容易受到僵尸网络攻击的缺点。因此，经过综合考虑，选择了“GPU - 图形处理单元友好”。\n3. **轻量客户端可验证性**：轻客户端能够在\
  \ C 语言桌面端以 0.01 秒为单位验证一轮挖掘，并在 Python 或 JavaScript 中验证一轮挖掘；以 0.1 秒为单位验证一轮挖掘需要 1 MB\
  \ 内存（但是指数增长）。\n4. **轻客户端减速**：使用轻客户端运行算法的过程应该比使用全客户端慢得多，因此在轻客户端上运行算法（包括通过专用硬件）不是经济上可行的挖掘方式。\n\
  5. **轻客户端快速启动**：轻客户端能够完全运行并能够在 JavaScript 中 40 秒内验证区块。\n\n基于这些考虑，开发团队最终发布的 Ethash\
  \ 挖掘基本上独立于 CPU 性能，但与内存大小和带宽正相关。这种来自以太坊的工作量证明算法降低了常用于比特币挖掘的特定硬件 ASIC 的效率。\n\nEthash\
  \ 算法的基本过程如下：\n\n- 对于每个区块，首先通过扫描区块头计算种子（seed）：种子仅与当前区块的信息有关；使用种子生成 16 MB 的伪随机数据集（缓存）；然后生成一个\
  \ 1 GB 的数据集——基于缓存的 DAG。该数据集中的每个元素仅依赖于缓存中的少数元素。换句话说，只要有缓存，你就可以快速计算 DAG 中指定位置的元素。DAG\
  \ 可以被理解为一个完全搜索空间。挖掘过程是从 DAG 中随机选择元素（类似于在比特币挖掘中寻找合适的 `Nonce`），然后执行哈希操作。\n- 验证过程也类似。它根据缓存获取指定位置的元素，然后验证这组元素的哈希结果是否小于某个值。验证过程只需要普通的\
  \ CPU 和内存即可完成。这是因为缓存很小，且指定位置的 DAG 元素很容易计算。缓存和 DAG 每 30,000 个区块更新一次。\n\n### 3.1.6\
  \ Equihash 和 Zcash\n\n\n\n\n\n2016 年 10 月，Zcash 上线了。该货币最大的特点是使用了零知识证明来实现私有交易。零知识证明可以在不泄露信息的情况下提供证明，而验证者通过验证来确认其正确性。Zcash\
  \ 在区块链记录中隐藏了交易者的所有信息，包括双方的地址和交易金额，从而实现了匿名性。Zcash 在算法的选择上非常谨慎。在考虑了 `SHA256D`、`SYPT`、`CUCKOO\
  \ HASH` 和 `LYRA2` 等算法后，Zcash 团队选择了 `Equihash`。\n\nEquihash 是由 Alex Biryukov 和 Dmitry\
  \ Khovratovich 设计的 PoW 算法。其理论基础是计算机科学和密码学中的一个问题——推广生日悖论。Equihash 是一种依赖内存的算法。算力的大小主要取决于内存的大小。它更适合具有大内存的通用计算机，而不是特殊的硬件芯片。根据两位发明者的论文，该算法至少需要\
  \ `700M` 的内存和 `1.8 GHz` 的 CPU 运行 30 秒。经过 Zcash 项目的优化，目前每个挖矿线程需要 `1G` 内存，因此 Zcash\
  \ 官方认为该算法在短期内矿机（ASIC）中很难出现，从而实现了针对矿机性能的 ASIC 抗性。由于推广生日悖论已被广泛研究，Zcash 官方认为该算法是公平的，他们认为某个人或组织很难秘密优化该算法。Equihash\
  \ 算法非常容易验证，这对于未来在受限设备上实现 Zcash 客户端至关重要。Zcash 挖矿的一般过程是：首先构建输入条件（区块头和各种参数），然后通过特定函数将输入条件转换为“推广生日问题的一般形式”，然后使用优化算法解决问题并获得解决方案。然后，估计收到的解决方案的难度。如果同时满足算法条件和难度条件，则判定“挖矿”成功；否则，重新计算随机数。\n\
  \n中国比特币黄金 (`BTG`) 也使用了 Equihash 算法。BTG 也是比特币区块链的一个分支。BTG 矿工在比特币区块 `491407` 处使用新的工作量证明算法创建了区块并成功分叉，在比特币区块\
  \ `491407` 之前的区块保持不变。BTG 的原始代币分配方法与 8 月 1 日比特币现金分叉使用的方法几乎相同。当区块 `491406` 分叉时，持有比特币的所有者将按照\
  \ `1 BTC = 1 BTG` 的比例自动获得 BTG。\n\n## 3.2 优化 PoS\n\n### 3.2.1 拜庭将领与拜庭容错算法\n\n1982\
  \ 年，Lamport、Shostak 和 Pease 首次提出了通用拜庭将的问题。来自 Cosmos 的 Ethan Buchman 描述道：“这是一个在受损通信网络中实现分布式协议的问题，即在不可靠的环境中构建可靠系统的问题”。从那时起，还没有人能够创建一个解决\
  \ 1982 年到 1999 年间拜庭将领问题的系统。因为在当时，互联网刚刚从云端中央计算演变，需要解决的是容错问题。因此，在人们的意识中，拜庭将领问题与计算无关，更流行的是容错算法。例如，1998\
  \ 年发明的 `Paxos` 算法和 2013 年发明的 `Raft` 算法被广泛使用。1999 年发明的实用拜庭容错 (`PBFT`) 除了学术界外，在现实生活中并未被广泛使用。\n\
  \n直到 2008 年，中本聪明将网络规模层面的分布式拜庭容错 (`BFT`) 算法设计进区块链解决方案中，使 BFT 变得流行。。从那时起，计算系统研究社区的人们开始思考如何将\
  \ BFT 应用于现实世界。\n\n2011 年，BitcoinTalk 论坛组织了一场关于权益证明 (`PoS`) 概念的讨论。原始 PoS 研究假设系统中的一系列节点在长时间内是静态且稳定的。但在区块链环境中，这种假设完全是不符合实际的。因此，初始的\
  \ PoS 协议实现结果并不理想。直到 2014 年 Jae Kwon 创建了 `Tendermint`，这是首次将分布式 BFT 研究真正应用到 PoS 公共链环境中的。Jae\
  \ Kwon 的一个重大突破是让 Tendermint 通过区块、哈希链接、动态验证者集和循环领导者选举，将 BFT 研究应用到复制状态机（区块链）领域。在 Tendermint\
  \ 环境中应用了大量的共识算法（`Honeybadger`、`Ouroboros`、`Tezos`、`Casper`），它们都包含 BTF 研究元素以及区块链中其他模块观察到的元素。\n\
  \n事实上，所有针对权益证明 (`PoS`) 的研究都指向一个重要问题：我们可以在不耗尽稀缺物质资源的情况下达到 PoW 的安全水平吗？这个问题可以转化为：PoS\
  \ 投票权不是通过计算得出的，而是以链上货币计量的。\n\n与区块链的可扩展性相比，对 POS 共识问题的讨论更加广泛和热烈。由于运行 PoW 挖矿成本高昂以及各种环境问题，大量资源正投入到\
  \ PoS 安全中。\n\n### 3.2.2 实现权益证明的算法\n\n接下来，我们将讨论在加密货币中使用 PoS 的三个主要 PoS 协议：\n\n- `CTFG`\
  \ (Casper the Friendly Ghost) – 由 Vlad Zamfir 领导的研究\n- `CFFG` (Casper the Friendly\
  \ Finality Gadget) – 由 Vitalik Buterin 领导的研究\n- `Tendermint` – 由 Jae Kwon 领导的研究\n\
  \n实现 PoS 算法有许多不同的方法，但 PoS 设计的两个主要原则是基于链的 PoS 和基于 BFT 的 PoS。Tendermint 基于拜庭容错的 PoS\
  \ 设计，CTFG 是基于链的 PoS 设计，而 CFFG 是两者的结合。\n\n计算机科学中的 CAP 理论认为分布式数据系统无法提供超过三分之二的保证：可用性、一致性和分区容错性。基于链的\
  \ PoS 算法倾向于选择高可用性而非高一致性，因为高可用性意味着所有交易都可以处理，但以牺牲跨网络的状态一致为代价。而基于 BFT 的算法倾向于选择高一致性。\n\
  \n### (1) Tendermint 和基于 BTF 的 POS\n\n在基于 PFT 的 PoS 协议伪排列中，验证者在多轮投票中提议区块。然而，提交并确认区块取决于所有验证者的多数\
  \ −2/3 对提交的区块签名。可能需要几轮才能完成区块。BFT 系统只能承受 1/3 的故障，包括故障或恶意攻击。\n\nTendermint 由两个主要技术组成：区块链共识引擎和通用应用接口。共识引擎被称为\
  \ `Tendermint` 核心模块，确保每台机器以相同的顺序记录相同的交易。应用接口被称为 `应用区块链接口` (`ABCI`)，允许用任何编程语言编写的程序处理交易。\n\
  \n\n\n\n在核心模块中，Tendermint 基于循环投票机制工作，这也是共识协议的原理。一轮被分为三个处理步骤：验证者提议区块、发送提交意图，并在签名后提交新区块。这种机制为原子广播提供了一个安全的状态复制器，增加了一层责任——任何安全性故障可以完全归咎于\
  \ Tendermint。\n\nTendermint 共识算法从一组验证者开始。验证者维护区块链的完整副本，并可以使用公钥来识别验证者的身份。他们轮流提议区块。\n\
  \n在每轮投票中，只有一个验证者可以提议区块，且该区块必须用该验证者对应的私钥进行签名，因此如果发生错误，就可以找到负责该区块的验证者。然后，剩余的验证者需要对每个提议进行投票，且投票需要用他们自己的私钥签名。这些步骤构成了一轮。然而，由于异步网络的存在，可能需要几轮才能提交新区块，如图\
  \ 3.2 所示。\n\n\n\n验证者在提交区块时可能会失败：当前提议可能离线，或网络可能会延迟。Tendermint 允许验证者跳过（当轮到某个验证者时，该验证者不创建区块）。验证者会在进入下一轮投票之前等待一段时间以接收提议者（本轮区块的验证者）提出的整个区块。这种对超时的依赖使得\
  \ Tendermint 成为弱同步协议而非异步协议。然而，该协议本身是异步的，验证者只有在接收到超过验证者集合三分之二的消息时才会进行处理。正如此，Tendermint\
  \ 要求大多数验证者正常运行，如果三分之一或以上的验证者离线或故障，网络将停止工作。\n\n假设少于三分之一的验证者是拜占庭节点，Tendermint 保证安全性永远不会被破坏——这意味着验证者（超过\
  \ 2/3）永远不会在同一高度提交冲突区块。因此，基于 Tendermint 的区块链永远不会分叉。\n\n如今，Tendermint 的设计决策将安全不可变性置于灵活性之上。在现实世界中，系统极有可能停止运行，参与者需要在协议之外更新软件后重启系统。\n\
  \n数字加密货币社区中只有少数人理解 Casper 以及它为什么有价值，Tendermint 为 Casper 的研究奠定了基础。其洞察在于：如果链本身具有高度容错性，那么你就可以依靠链来做出关于谁创建区块的良好决策；但如果链本身是不可靠的，你就会陷入陷阱。鸡生蛋蛋的问题消失了，而这曾是所有其他共识算法的灾难。\n\
  \n这种设计方案被认为劣于以太坊和比特币等现有的协议。但我们需要考虑，在转移到不安全的链的情况下，如何回到正确的链。\n\n### Tendermint 的清晰特性：\n\
  \n* ■ 经过验证的活动\n* ■ 安全阈值：1/3 验证者\n* ■ 公有链/私有链兼容性\n* ■ 即时最终确定性：1–3 秒，取决于验证者的数量\n*\
  \ ■ 一致性优先\n* ■ 弱同步网络上的共识安全性。\n\n\n基于链的 CFFG 是一种基于共识的方法。基于链的 CFFG 维护区块链的完整副本，可以使用公钥识别验证者的身份。他们轮流提议区块。\n\
  \n在每轮投票中，只有一个验证者可以提议区块，且该区块必须用该验证者对应的私钥进行签名，因此如果发生错误，就可以找到负责该区块的验证者。然后，剩余的验证者需要对每个提议进行投票，且投票需要用他们自己的私钥签名。这些步骤构成了一轮。然而，由于异步网络的存在，可能需要几轮才能提交新区块。\n\
  \n\n\n当检查点被最终化时，验证者将获得奖励。然而，如果两个最终化的检查点在相同的高度分叉，那么安全性就会被破坏，此时达到了降低范围的条件，且至少 1/3\
  \ 的保证金将被消除。当安全性受到损害时，错误归因的证据可以作为交易广播给 PoW 矿工。然后，PoW 将证据交易合并进一个区块中进行挖矿，而提交证据的验证者将获得发现者的奖励。当这种情况发生时，在冲突区域内签名的恶意验证者将在两条链上均被消除，从而确保整个区块链的合法性。\n\
  \n现在，如果矿工发起了严重的强制攻击会发生什么？现在， Casper 的最终化区块链可以防止 PoW 攻击者，即使有 51% 或更多的算力试图重写最新检查点以外的历史也会被阻止。因此，Casper\
  \ 提供了安全性。与 CTFG 不同，由于 CFFG 是不同提议机制之上的覆盖层，Casper 无法保证活跃性，因为活跃取决于提议机制。\n\n验证者有动力聚集在权威链上，因为如果他们继续在不同的链上投票，他们将受到惩罚。slasher\
  \ 2.0 的形成允许验证者不仅因双重投票受罚，还因在错误的链上投票而受罚。然而，这造成了一个困境，验证者担心如果出现分叉且他不确定哪一个是权威的，如果他在错误的链上进行了投票，他应该选择切断还是放弃投票。\n\
  \nCFFG 的清晰特性：\n\n* ■ 最终化：超过 20 分钟的最终化。每 50 个区块（一个周期）最终化一次区块，以防止 PoW 挖矿暴力攻击。\n* ■\
  \ 共识安全性\n* ■ 证明的活跃性\n* ■ 优先级可用性。\n\n### (3) CTFG\n\nCTFG 是一种正确构造 (CBC) 共识协议，旨在对抗真实环境下的寡头垄。CTFG\
  \ 是 GHOS 或 GHOST 协议在工作量证明中的适应，用于其分叉选择规则。CTFG 背后的指导设计原则基于旨在实现安全性的加密经济形式化方法。与上述详细的\
  \ CFFG 混合协议不同，CTFG 是纯 PoS 的。\n\n> Casper 的诞生仅仅是“友好的幽灵”，它是 GHOST 在权益证明中的适应，并配有让卡尔特对非卡尔特验证者“友好”的激励。\n\
  \n> Vlad Zamfir，《Casper 历史》第 5 章\n\n与工作量证明类似，CTFG 在一致性和可用性之间进行权衡。特别是当区块未最终化时，它们在链中的深度越深就越安全。CTFG\
  \ 类似于 CFFG，链头的处理始终比区块的最终化快得多。\n\nCasper 的 PoS 提议机制与 Tendermint 提议机制之间的最大区别在于，与伪随机选择节点相比，后者的验证者基于他们看到的区块来提议区块。\n\
  \nCasper 提供了一个独特的特性，即参数化安全边际。类似于在比特币中使用六次确认来确定经济最终状态，CTFG 中的“评估安全性”允许验证者拥有一个与其他验证者不同的安全阈值函数。Casper\
  \ 的设计允许验证者在保持网络低 PoS 开销的同时，选择自己的容错阈值。\n\nCasper 相比 Tendermint 的核心优势是网络随时可以容纳一定数量的验证者。区块确认时间应该更短，因为\
  \ Tendermint 中的区块在创建时就需要被最终化。为了实现短区块时间，Tendermint PoS 能够容纳的验证者数量需要限制。由于 CTFG 和 CFFG\
  \ 在区块创建时不需要安全性，与 Cosmos 的 100 个验证者相比，以太坊网络可以适应更多的验证者。\n\nCTFG 的清晰特性\n\n* ■ 可用性。Casper\
  \ 的节点可以在达到共识之前进行划分。\n* ■ 异步安全性。\n* ■ 生存性。Casper 的决策可以部分同步，但在异步环境下无法存活。\n* ■ 卡尔特抗性。Casper\
  \ 构建在防止合谋的基础上，因此验证者可以不违背协议。\n* ■ 安全性，取决于评估者的安全阈值。\n\n### 3.2.3 权益证明的陷阱\n\n### (1)\
  \ 无利益的关系\n\n起初，有很多种方法描述 PoS 的通用陷阱，此时“无利益的关系”被提出。Jae Kwon 在 2014 年 5 月以“不幸的选择悖论”这一名称首次提到这一问题。2014\
  \ 年 7 月，Vitalik 以比特币开发者描述的“无利益的关系”推广了这一问题。\n\n在工作量证明中，对于在链上挖矿的矿工，如果他们想要危害，必须分离稀缺的计算资源并利用这种高成本来遏制恶行。在现代非退化\
  \ PoS 中，这种成本被设计到协议中，以模拟矿工物理挖矿的限制。例如，以太坊创始人 Vitalik Buterin 在 2014 年引入了 `slasher`\
  \ 概念，协议内的罚可以缓解这种攻击。\n\n同年，Jae Kwon 进一步推广了这种方法，这是实现 Tendermint 共识协议的首次迭代。增加成本和允许严厉处罚对所有非退化\
  \ BFT 协议都有帮助，甚至本文介绍的三种共识也是如此。\n\n### (2) 远程攻击\n\n由于用户在 PoS 机制中拥有提取的权利，因此存在远程攻击的隐藏风险。这是因为攻击者可以进行任何长度的分叉而无需担心被剪没。因为一旦保证金解除，不跨越区块高度投票的激励就被取消了。换句话说，当超过\
  \ 2/3 的验证者取消保证金时，他们可以恶意创建一个包含之前验证者的第二条链，这可能导致任意交易。\n\n\n\n\n\n这对 PoS 协议来说是致命的，因为\
  \ PoS 的安全模型必须是“**主观的**。（什么是“主观的”安全模型？如果信息可以在协议内被验证，那么它就可以被称为“客观的”；如果信息必须通过协议以外的手段进行验证，则它被称为“主观的”。）当一个新节点加入网络后，它可能对当前网络的状态得出不同的结论。因为它们的决策是基于主观信息的，即社会信誉。然而，在此时，我们将其与\
  \ PoW（工作量证明）进行比较，发现 PoW 的安全模型必须是“**客观的”，因为它们的决策是基于客观信息的，且当前网络状态始终处于工作量最大的情况，新节点对网络状态总会有相同的结论。\n\
  \n那么如何防止长距离攻击的伤害呢？\n\n在 Vitalik 提出的弱主观模型下，在访问网络中的新节点进行验证时，当前节点必须与质金绑定。只有当验证节点支付了质金时，其签名才具有经济意义。这意味着客户端只能依赖已锁定质金的验证节点的签名。因此，当客户端接收并验证共识数据时，共识批准链必须来自当前锁定质金的验证节点的区块。与\
  \ PoW 协议相比，共识认可链是从创世区块派出来的——只要你知道源世区块的数据，就可以识别共识认可链。在这里，只要你知道当前锁定质金的验证节点，就可以识别共识批准链。不知道当前锁定质金的认证节点列表的客户端必须通过另一个通道获取此列表。这种限制通过要求所有人使用当前信息来识别共识。\n\
  \n此外，解冻质金的过程必须经过一个“解冻”（thaw）期。解冻会导致消息同步延迟几周到几个月，需要时间来“解冻”。因为协议禁止在第 N 个区块（N 是质金的长度）之前恢复，这条规则使任何长距离分叉失效。同时，同步数据需要从其他渠道获取最新的锁定质金验证节点列表的特征，这实现了\
  \ Vitalik 所说的“**弱主观**”。\n\nCasper(s) 和 Tendermint 使用这种简单的锁定机制（在 Tendermint 中通常被称为“冻结”freeze）来锁定一段时间（从几周到几个月的“解冻”），以防任何验证节点恶意破坏系统安全。在\
  \ Vitalik Buterin 领导的 CFFG 算法研究中，分支只能修改最终区块之后的区块，从而防止远程攻击。在 CFFG 中，尝试使用时间戳修改最终区块之前的此类长距离区块分叉是不会被协议认可的。\n\
  \n### (3) 团伙形成 (Cartel Formation)\n\nPoS 仍然有一个问题需要解决，那就是垄断问题，当然，这也是任何经济形式都需要面临的问题。\n\
  \n> 加密货币极其集中。算力也是如此。垄断竞争是许多“现实世界”市场中的常态。少数相对富有的验证者之间的协调比大量相对贫穷的验证者之间的协调要容易得多。在我们的语境下，团伙的形成是完全意料之中的。\n\
  \n> *Vlad Zamfir, 《Casper 历史》第 4 章* \n\nTendermint 依赖于额外的协议管理方法来应对垄断的验证者。虽然在审查系统上没有共识，但依靠带外社会信息来解决团伙形成问题，其基本原理是用户将不可避免地注意到团伙的形成，社会也会对其进行议论。然后，放弃或投票重新组织被阻塞的区块链。\n\
  \n到为止，Vlad 的 Casper 协议是唯一明确在审查激励内部使用共识来对抗团伙形成的协议。\n\n### (4) 未来工作\n\n公链在产品上的运行仍然是一项较新的技术。到目前为止，唯一被证明不可腐败的安全模型是工作量证明。权益证明（PoS）的设计空间仍然非常大，工程理解尚不足，因为权益证明是一个前沿研究领域，目前还没有足够的数据支持。为了实现最优的\
  \ PoS 共识算法，我们仍然有许多未来工作要做完成。\n\n未来可以努力的第一方向可能是 Tendermint。这可能是为它提出一种新的改进机制，或者将 Tendermint\
  \ 的多轮投票压缩为一轮投票。\n\n未来工作的第二个领域可能是使用更先进的加密技术来使区块头的签名更小。因为我们正在通过 Cosmos 构建一个“区块链互联网”，将我们的客户端认证从一条链移动到另一条链是核心工作。从这个角度来看，使用更先进的密码学将区块头缩小三十倍或更多是非常有利的。\n\
  \n此外，我们可以优化 p2p 层，以便显著减少最终区块所需的流量。在未来的工作中，不仅是压缩区块头中的数据量，发送到对点的数据量也可以被减少。在这种情况下，可以在\
  \ Cosmos 网络初始 100 个验证者的阈值之上添加更多的验证者。\n\n## 3.3 PBFT 优化版本：联邦拜斯庭协议 (FBA)\n\n在传统的 PBFT\
  \ 中，尽管有导致拜斯庭错误的破坏者，拜斯庭协议也能保证分布式共识的达成。然而，它要求系统的所有参与者达成一致，且网络中的所有节点必须是已知的并经过预认证。\n\
  \n任何联邦拜斯庭协议（FBA）都可以加入，分布式方式组（法定人数或节点足够）可以达成一致，每个节点可以确定其信赖的对象，不同的节点不需要信任相同的参与者组合即可完成共识。灵活信任意味着用户可以自由信任他们认为合适的参与者组合。\n\
  \n由 Stellar.org 首席科学官 David Mazières 教授提出的 Stellar 共识协议（SCP）是联邦拜斯庭协议（FBA）的第一个示例。Stellar\
  \ 共识协议提供了一种在不依赖封闭系统的情况下通过准确记录金融交易达到共识的方法。Stellar 共识协议还有四个关键属性：去中心化控制、低延迟、灵活信任和渐进安全。\n\
  \n在详细详细解释 FBA 之前，我们需要知道什么是法定单元（legal unit）？\n\n在分布式系统中，法定单元是达成协议的节点集合。FBA 引入了法定人数（quorum）的概念，即可以说服特定节点同意的法定人数子集。\n\
  \nFBA 的主要特征：\n\nFBA 中的每个节点都可以选择自己的法定单元集合，而整个系统的法定人数结果由单个节点的选择决定。这是拜斯庭（BA）协议系统与 FBA\
  \ 系统之间的关键区别。\n\n\n\n\n\n在 FBA（联邦拜庭）中，没有守门员，也没有中心节点，单个节点可以决定应该信任哪些参与者。节点可以选择多个组，且单个节点的选择可能取决于系统之外的标准。例如，如果一家银行被认为声誉良好，那么其他节点上的所有交易都需要它的批准。\n\
  \n法律实体之间的关系存在不同的状态：\n\n* ■ 有交集的法律实体：良好的法律实体共享其节点，导致不同法律实体之间出现节点重叠。\n* ■ 无交集的法律实体：当实体之间没有交集点时，我们就得到了无交集的法律实体。\n\
  \n如果语料库（Corpus）不交集，例如，`Statute A` 批准了一份披萨订单声明，而 `Statute B` 批准了一份汉堡订单声明。由于它们可以独立地识别矛盾的陈述，不交集的语料库会对共识产生危害。\n\
  \n那么，如何让节点做出更好的选择呢？\n\nFBA 系统中的每个节点都负责确保所选法律实体不违反法律实体交集规则。通常需要确认法定人数集群（quorum cluster）是否足够大，以及集群中的节点是否足够重要，以至于不会欺骗或为不同的人生成不同的信息，并危及他们自己的声誉。\n\
  \n联邦投票：接受，确认。\n\nFBA 系统中的节点使用联邦投票技术来实现它们的协议。联邦投票技术用于引导 FBA 系统或一组共同工作的人达成共识。在 Stellar\
  \ 的白皮书中，给出了以下示例：\n\n> 午餐共识\n\n> 为了详细描述对节点投票并在最终接受声明的同时允许系统达成一致的过程，让我们举一个许多人熟悉的例子。让我们来聊一组人对午餐吃什么进行投票。在这种情况下，人的名字就是节点，所有的食物选项都是节点需要引用的声明。\n\
  \n> 莎莎（Vanessa）在一个公共办公室工作，那里有一大群人根据自己的意愿预订午餐。有很多选择，并不是每个人都会做出选择；当确定人数足够时，他们就会下单。\n\
  \n> 莎莎和她的同事们决定使用基于 FBA 的 `SCP` 来解决这个问题。\n\n#### 初始投票\n\n> 我们假设 莎莎想吃披萨，但仍然需要保持开放态度，以防组中的大多数人选择了披萨以外的其他选项。\n\
  \n> 投票是工作的准备，只发生在节点阶段。在联邦选举过程的第一步中，莎莎声称披萨是有效的，并承诺如果没有披萨，她将不会投票披萨以外的任何选项。除非有足够的同事为披萨投票，否则她可能会得到接受非披萨选项的结果。\n\
  \n#### 接受（准入）\n\n> 幸运的是，存在法律实体交集，实体组可以影响其他节点。想象另一种情况，莎莎投票了汉堡。但请记住，投票只是准备。\n\n> 薇妮（Winnie）、安德鲁（Andrew）和伊娃（Eva）都在莎莎所在的法律实体中，他们可以停止接受汉堡的过程。一个\
  \ `v-blocking`（V 型）节点集包含莎莎所有实体组中的至少一个节点，并阻止了包含莎莎的法律文件中的所有行为，导致莎莎接受披萨。\n\n> 在以下情况下，莎莎实际上接受了披萨：\n\
  \n> * 她从未接受过与披萨矛盾的声明。\n> * 每个 V 型限制集的成员都声明接受披萨，或者包含莎莎的每个集体成员也为披萨投票或声明接受披萨。\n\n####\
  \ 正式批准\n\n> 当每个法定人数成员都为披萨投票时，我们说该法律文件认可了披萨。节点不需要个人认可该声明。\n\n> 例如，斯特（Scott）经常依赖安德鲁和艾莉丝（Iris）来决定吃什么。他们是斯特的法律实体。如果他们三个人都为披萨投票，该实体就批准了披萨。\n\
  \n> 同事可以为一个午餐选项投票，然后接受与自己的投票不同的午餐。投票披萨并不意味着午餐必须坚持吃披萨——只有在批准后，披萨才被接受为午餐。\n\n####\
  \ 确认\n\n> 配置是选举过程的最后一步，它将导致整个系统的一致协议。为了确保共识，节点之间交换确认消息。系统同意一个声明；一旦足够的消息传播并处理，无论之后发生了什么，每个活跃且无错误的节点将接受该声明。\n\
  \n> 例如，伊娃声明她接受披萨并发送一条确认消息，`accept(pizza)`，这是“我已经接受了披萨”的缩写。\n\n> 当伊娃发送确认消息时，薇妮、安德鲁、格雷登（Graydon）以及伊娃法律文件中的其他人广播\
  \ `accept(pizza)`。\n\n> 这些消息可以说服另一个人接受披萨。在上面的示例中，如果莎莎反对披萨，例如，如果 V 型限制集接受了披萨，那么莎莎就接受披萨。这些人尽可能地说服更多的人，不断广播\
  \ `accept(pizza)` 直到所有人都能接受披萨为止。\n\n> 法律文件对消息的后续确认让莎莎确认了披萨并实现了系统共识。公司订了披萨，大家都很开心。\n\
  \n这个示例完整地阐述了 FBA 系统实现的整个过程。\n\n## 3.4 其他：Algorand 共识协议\n\n图灵奖获得者、麻省理工学院教授西维奥·米卡利利（Sivio\
  \ Micali）设计了 Algorand 共识协议，这是一种新型加密共识机制，可以在极时间内验证交易并扩展到许多用户。Algorand 确保用户永远不对已确认的交易产生分歧，即使某些用户是恶意的，或者网络临时分区。相比之下，现有的加密货币允许临时分叉，因此需要很长时间（大约一小时），最后才通过确认的数量来确保交易已确认。\n\
  \nAlgorand 使用新的 BA 协议协议在下一组交易中达到用户共识。为了将共识扩展到许多用户，Algorand 使用了一种基于可验证随机函数（VRF）的新机制，允许用户自检自己是否被选中参与\
  \ BA 协议以授权下一组交易。在 Algorand 的 BA 协议中，除了私钥外，用户不保留任何私有状态，允许 Algorand 在发送消息后立即更换参与者。这可以缓解身份暴露后针对被选参与者的针对性攻击。\n\
  \n\n\n\n在 Algorand 中，用户通过 `BA` 对新区块达成共识。`BA` 的执行速度非常快。通常情况下，每个循环的 `BA` 有三个子步骤，且每次达到共识的概率都大于\
  \ 1/3。一旦“验证者”对新区块达成共识，超过半的“验证者”将用自己的私钥对区块进行电子签名（等同于身份验证），该区块将开始在 Algorand 网络中传播。`BA`\
  \ 的一个重要特性是 `BA` 参与者在点对网络通信中是可以被替换的（玩家可替换）。这意味着 `BA` 每个循环的每个子步骤都可以由新的、独立随机选择的参与者执行。在这种情况下，`BA`\
  \ 仍然能够正确且有效地达成共识。假设有数百万用户，`BA` 每个子步骤的参与者可以是完全不同的，且每批参与者无法确定下一组参与者是谁，因此无法合谋。\n\n\
  根据 Algorand 团队的测试，我们可以在 1000 台 EC2 虚拟机上评估 Algorand 的性能，模拟多达 500,000 个用户。实验结果显示，Algorand\
  \ 在一分钟内确认交易，吞吐量达到比特币的 125 倍，对于更多用户的增加几乎没有扩展，且几乎不会为更多用户产生罚金，但 Algorand 有一个大问题，即缺乏激励机制，因此在完全去中心化的环境中运行还需要实践。\n\
  \n# 第 4 章：博弈论与加密经济学\n\n## 4.1 什么是博弈论？\n\n博弈论是一种旨在帮助我们理解决策主体之间观察互动现象的分析工具。该理论隐含的基本假设是：决策者追求确定的外部目标（他们是理性的），并考虑自己的知识或其他决策参与者的预期（他们的推理是策略性的）。\n\
  \n博弈论有悠久的历史，例如古代中国的《孙子法》。最初，博弈论研究的是象棋、桥牌、赌博中的输负问题，主要基于实践经验，并没有在理论上进行发展，因此它直到 20\
  \ 世纪初才正式发展成为一门学科。\n\n博弈论的研究始于策梅洛（Zermelo）、博尔（Borel）和冯·诺伊曼（von Neumann），冯·诺伊曼和奥斯卡·根斯斯特恩（Oskar\
  \ Morgenstern）首次将其系统化和形式化。随后，约翰·福布斯·纳什（John Forbes Nash Jr.）利用固定点定理证明了均衡点的存在，为博弈论的泛化奠定了坚实基础。\n\
  \n从经济角度来看，人们认为现代经济博弈论是 20 世纪 50 年由美国数学家冯·诺伊曼和经济学家奥斯卡·根斯斯特恩引入的。它已成为经济分析的主要工具之一，对产业组织理论、委托代理理论和信息经济学等经济理论的发展做出了重要贡献。1994\
  \ 年和 1996 年的诺贝尔经济学奖授予了研究博弈论的经济学家。\n\n博弈论考虑的是在具有特定规则的群体环境中预测行为和实际行为。它包含三个基本要素：参与者（Players）、策略（Strategies）和收益（Payoffs）。博弈论假设如下：\n\
  \n* 参与者是理性的，并利益最大化。\n* 参与者对环境以及环境中其他参与者的行为形成正确的信念和预期。\n\n这意味着，在策略组合中，所有参与者都会遇到以下情况：当对方不改变策略时，他此时的策略是最好的——这就是著名的纳什均衡。在纳什均衡点，每个理性的参与者都没有单方面改变策略的冲动。此时，如果他改变策略，他的利益将会减少。\n\
  \n博弈的分类也根据不同的基准有不同的划分。人们认为博弈主要可以分为合作博弈和非合作博弈。合作博弈与非合作博弈之间的区别在于，相互互动的双方之间是否存在具有约束力的协议。如果有，就是合作博弈；如果没有，就是非合作博弈。\n\
  \n从行为序列的角度来看，博弈论进一步分为两类：静态博弈和动态博弈。静态博弈意味着在博弈中，参与者是同时选择，或者即使不是同时，参与者也不知道采取了哪些具体行动。动态博弈意味着在博弈中，参与者的行动是有顺序的，参与者可以观察第一个参与者所选择的行动。简单可以理解为“囚徒困境”，意味着同时决策，属于静态博弈；而象棋或具有顺序优先权的决策游戏则属于动态博弈。\n\
  \n根据参与者对其他参与者的了解程度，它们分为完全信息博弈和不完全信息博弈。完全博弈意味着在博弈过程中，每个参与者对其他参与者的特征、策略空间和收益函数都有准确的信息；不完全信息博弈是指参与者的特征、策略空间和收益函数不够准确，或者对所有参与者来说都不准确。\n\
  \n## 4.2 纳什均衡\n\n让我们回到经典的囚徒困境问题，解释纳什均衡这一博弈论的精髓以及加密经济学：\n\n假设有两个参与者和一个银行家。每个参与者两张卡片：每张写有“合作”或“背叛”。参与者各将一张卡片反面朝放在庄家面前。这排除了参与者知道对方选择的可能性。然后，庄家打开两个参与者的卡片，并根据以下规则支付双方的收益：\n\
  \n* 一人背叛，一人合作：背叛者得到 5 分（利益驱动），合作者得零分（支付欺诈）。\n* 两人合作：各得到 3 分（合作补偿）。\n* 两人背叛：各得到 1\
  \ 分（背叛惩罚）。\n\n利益决策矩阵如下：\n\n| | 参与者 2 合作者 | 参与者 2 背叛者 |\n| --- | --- | --- |\n| **参与者\
  \ 1 合作者** | 3, 3 | 0, 5 |\n| **参与者 1 背叛者** | 5, 0 | 1, 1 |\n\n但这里有一个问题。如果存在像区块链这样没有信任基础的环境（例如分叉收益大于原始链的挖矿收益），那么背叛参与者\
  \ 1 和 2 的利益将大于合作者，那么解决方案是什么？例如，有如下利益决策矩阵：\n\n| | 参与者 2 合作者 | 参与者 2 背叛者 |\n| ---\
  \ | --- | --- |\n| **参与者 1 合作者** | 3, 3 | 0, 5 |\n| **参与者 1 背叛者** | 5, 0 | 6, 6\
  \ |\n\n在区块链中，参与者可能会为了个人利益而完全忽视所有人的利益。此时，“惩罚”机制尤为重要。如果我们能设定如下机制：所有背叛行为（对整体利益不利的行为）都将被惩罚\
  \ 6 分，那么新的利益决策矩阵将变为：\n\n\n\n\n\n| | 参与者 2 合作者 | 参与者 2 背叛者 |\n| --- | --- | --- |\n\
  | 参与者 1 合作者 | 3, 3 | 0, −1 |\n| --- | --- | --- |\n| 参与者 1 背叛者 | −1, 0 | 0, 0 |\n\
  \n我们可以看到，在加入惩罚机制后，纳什均衡已经从背叛（实施恶意行为）变成了合作。这一机制是区块链经济模型中非常重要的一部分。\n\n## 4.3 谢林点 (Schelling\
  \ Point)\n\n谢林点是指博弈论中人们在没有沟通的情况下进行选择的倾向。这种选择可能是因为看起来很自然、特殊，或者与选择者有关。这一概念是由美国诺贝尔奖奖得主托马斯·谢林（Thomas\
  \ Schelling）在 20 世纪 60 年代的著作《冲突的策略》一书中提出的。在`page 57` 上，谢林描述道：“每个人对对方预期他所预期他所预期会做某事的某个焦点点”。这一概念后来以谢林的名字命名。\n\
  \n例如，一组独立且互不联系的人被从以下数字中选择一个数字，只有当他们人都选择了同一个数字时，才会获得奖励：\n\n* 38219057301490231\n\
  * 100000000000\n* 1.43123289.\n\n他们可能会同时选择数字 `100000000000`，因为它看起来最自然，而且也是每个人预期别人选择的数字。另外两个数字没有显著的特征。\n\
  \n## 4.4 有限理性模型 (Bounded Rationality Model)\n\n博弈论中另一个对加密经济学至关重要的概念是有限理性模型。20 世纪\
  \ 50 年代以后，人们意识到基于完全理性决策理论的经济模型只是一个理想模型，无法指导实际决策。赫伯特·西蒙（Herbent Simon）提出了满意标准和有限理性模型准则，用“社会人”取代了“经济人”。有限理性模型也被称为\
  \ `Simon’s model` 和 `Simon’s bounded rationality model`。这是一个更符合现实的模型，它认为人的理性是完全理性与完全非理性之间的有限理性。\n\
  \n有限理性模型认为决策者追求理性，但并不是对理性的极致追求。他只需要有限理性。这是因为人们的知识、能力或时间是有限的，决策者既无法掌握所有信息，也无法理解决策的详细规则。同时，有限理性模型认为决策者在决策时追求的是“满意”标准而非最优标准。\n\
  \n让我们举个例子。小李每次都用卡进入健身房。有一次他正要用卡进入健身房，他发现前台没人，桌上有 5 元钱。有限理性模型认为小李不会拿这 5 元钱，因为不拿钱符合小李的习惯，且这是最简单的决策，而拿这\
  \ 5 元钱可能会更多地影响小李的日常健身，因此在有限条件下，小李会做出不拿 5 元钱的决定。这一概念对于加密经济学中惩罚机制的设计非常重要。\n\n## 4.5\
  \ 博弈论机制设计与共识机制\n\n区块链共识机制的设计与博弈论机制的设计最为相似。机制设计通常被称为逆向博弈论，因为我们是从期望的结果开始，反向推导以设计一个完整的博弈。如果玩家在博弈中追求自己的利益，就会产生我们想要的结果。例如，假设我们负责设计一种拍卖规则，我们的目标是希望竞标者以产品的实际价值中标得。为了实现这一目标，我们使用博弈论将拍卖设计成一个博弈，每个玩家的核心策略是能够对真实价值进行报价。\n\
  \n共识机制的设计关注系统设计和系统建立，正如博弈论机制设计一样。正如我们的拍卖示例，我们使用博弈论设计了一套可以产生自定义平衡的规则或机制。在共识机制的设计中，我们使用密码学和计算机编程来实现这种经济激励。我们设计的系统通常是分布式且去中心化的。\n\
  \n比特币的共识算法 `Proof of Work` (`PoW`) 就是这种方法的结果。中本希望比特币能够具有某些特性，例如其对内部状态达成共识的能力以及抗审查的能力。随后他设计了整个比特币系统来实现这些特性，假设人们会以合理的方式对经济激励做出反应。\n\
  \n## 4.6 博弈论机制设计与区块链安全\n\n在商业现实世界中，恶意收购（hostile takeover）是一种极大影响公司安全的行为。恶意收购者通常没有对方的同意，并希望获得控制权以及对方所有的资源。在区块链世界中，存在类似的安全风险，被称为贿赂机制（bribing\
  \ mechanism）。\n\n贿赂攻击模型指的是不受协调的选择，例如无信任区块链（Trustless Blockchain），其中有一个拥有充足资源的贿赂者，通常会对原始区块链产生更大的影响。例如最常见的是恶意分叉（malicious\
  \ fork）。\n\n如果我们用恶意收购来类比贿赂攻击模型，就可以解释这一点。为了更好地理解贿赂者如何达到目的，我们使用常用的博弈论知识进行分析。假设有一个简单的投票机制，区块链中的每个参与者都可以对\
  \ 0 和 1 进行投票。假设 0 对原始区块链有利，而 1 对原始区块链是不利的。只有当所有人的投票结果相同时，大家才能获得相应的奖励 `P`。在这种情况下，纳什均衡是所有人投\
  \ 0，即有利于原始区块链的决策，其收益矩阵表示如下：\n\n| | 你投 0 | 你投 1 |\n| --- | --- | --- |\n| 其他人投 0\
  \ | P, P | 0, 0 |\n| --- | --- | --- |\n| 其他人投 1 | 0, 0 | P, P |\n\n如果此时有一个贿赂攻击者，他告诉：如果你投\
  \ 1 而其他人不投 1，除了奖励 `P` 之外还有额外的奖励 `ε`，那么新的决策收益矩阵如下：\n\n| | 你投 0 | 你投 1 |\n| --- |\
  \ --- | --- |\n| 其他人投 0 | P, P | 0, P + ε |\n| --- | --- | --- |\n| 其他人投 1 | 0,\
  \ 0 | P, P |\n\n从表面上看，投 1 是你的选择。问题在于，当贿赂者告诉所有人贿赂条件时，每个人都认为投 1 是最好的，此时的纳什均衡变成了所有人都投票；即每个人选择了不利于原始区块链的决策。\n\
  \n贿赂者通过这种 `P + ε` 攻击实现了目标，同时不需要为了做出不利于原始区块链的决策而支付承诺的贿 `ε`。非常聪明对吧？这种 `P + ε` 攻击问题也是类似于\
  \ `PoW` 共识机制的安全风险之一。\n\n\n\n\n\n一种解决方案是引入带有保证金和惩罚机制的改进型 PoS（权益证明）共识机制。由于每个区块链参与者在链上都有保证金，如果有人贿赂你并要求你做出对原始区块链不利的决策，你将失去所有的保证金，并且你会觉得这不值得努力。而且，在上述决策收益矩阵中，我们还知道，即使你做出了对原始区块链不利的决策，你也无法获得贿赂者承诺的额外补偿\
  \ `ε`，无论这个 `ε` 有大。\n\n## 4.7 基于博弈论的共识机制展望——以太坊 Casper 共识算法\n\nCasper 是以太坊从 PoW 转型\
  \ PoS 的优化版 PoS 共识机制。以太坊的核心贡献者 Vitalik Buterin 意图使用 Casper 实现以太坊的永久分叉以完成这一转型。通常情况下，Casper\
  \ 要求验证者在共识结果上投入大部分保证金。共识结果由验证者的下注情况形成：验证者必须猜测其他人会对哪个区块下注赢，并且对该区块进行下注。如果注中，他们可以拿回保证金加上交易费，可能还会获得一些新货币；如果下注未能达成快速一致，他们只能拿回部分保证金。因此，验证者的下注分布将在几轮后收敛。此外，如果验证者的下注变化太大，例如先下注某个区块有高概率胜，然后又下注另一个区块高概率胜，他将受到严重惩罚。这条规则确保验证者只有在非常确定其他人也认为某个区块胜率很高时，才会高概率下注。Casper\
  \ 使用这种机制确保只要验证者足够，下注就不会在收敛到一个结果后又收敛到另一个结果。验证者在每个高度 `h` 对每个候选区块下注，为每个区块分配一个胜率概率并发布。通过反复下注，验证者将为每个高度\
  \ `h` 选择唯一的获胜区块，这个过程也决定了交易执行的顺序。如果验证者在某个高度发布了大于 100% 的概率分布，或发布了小于 0% 的概率，或给无效区块分配了大于\
  \ 0% 的概率，Casper 将惩罚其保证金。\n\n简而言之，Casper 权益证明（Equity Proof）试图通过强制执行大量的以太坊安全押金而非计算机计算，来实现验证者的功能，从而为加密经济学提供极大的安全保障。这种安全押金（或加密经济证明）被证明是一种强大的震慑手段。其理念一目了然——如果你在区块链上制造麻烦，你将失去一切。\n\
  \nCasper 强制参与者加入谢林币（Schelling Coin）游戏。参与者被迫在大多数人会下注的对象投入安全押金。使用相同的递归逻辑，大多数参与者会准确地为有效交易投票，因为每个参与者都预期其他人得出相同的结论。当权益证明能够抵抗\
  \ `P + ε` 攻击时情况如此，因为在他们最终投票给少数派的情况下，攻击者必须提供巨大的预算来补贴参与者的安全押金。\n\n在这些安全模型的背景下，我们可以看到\
  \ Casper 的韧性集中在非协调选择模型中，并源于贿赂攻击者。Casper 在理论上对源于协作攻击者模型的 51%攻击也敏感。但像比特币一样，以太坊已经将此类攻击的成本提高到了极高水平，几乎完全遏制了它。在\
  \ Casper 环境中，失去所有相关权的威胁是更强的冲击。\n\n# 第 5 章\n\n# 行为经济学与加密经济学\n\n## 5.1 行为经济学对比传统经济学：非理性\
  \ vs 理性\n\n传统经济学假设人是理性的——这一假设的含义是，我们可以计算并量化日常生活中面临的所有选择的价值，并选择对我们最有利的那个。一旦我们犯了错并做了非理性的事情，通过“市场的力量”就会把我们拉回正确理性的路径。基于这些假设，从亚当·斯密开始，世代经济学家推导出了深远且无所不在的结论：从税收到健康政策，再到商品服务的定价。\n\
  \n然而，我们远没有传统经济学理论假设的那么理智。我们经常做一些冲动性的、甚至不符合自身利益的事情（例如，我们知道熬夜对身体不好，但还是在刷手机）。不仅如此，我们的非理性行为并非偶然和无意识的，而是系统性的甚至是可预测的，这正是行为经济学所追求的目标。\n\
  \n行为经济学利用社会心理学的知识来研究信息活动对经济活动的影响。它从人的实际行为出发，帮助我们正确理解日常生活中隐藏的各种异常。\n\n本章不涵盖任何复杂且陌生的概念或原理，而是源于每个人都熟悉的实际场景，讨论我们通常行为决策的缺点，以及行为经济学和加密经济学能带给我们什么帮助。\n\
  \n## 5.2 区块链世界的行为经济学\n\n### 5.2.1 如何向朋友介绍区块链？\n\n> “什么是区块链？”\n\n> “什么是比特币？”\n\n\
  行业内的所有人在向朋友介绍区块链时都会被问到上述问题。你能用一个简洁清晰的句子回答吗？\n\n> 区块链是计算机技术的新应用模型，如分布式数据存储、点点传输、共识机制和加密算法。\n\
  \n> 比特币是一种去中心化的、点点的形式的加密数字货币系统。\n\n如果你最初按照百度百科的介绍来回答（这需要你花时间精确记忆），对方极有可能无法理解，因为很难直观地理解这句句话的含义，所以你可以简单地解释如下：\n\
  \n> 区块链是下一代互联网。以前我们只能通过网络发送信息，现在我们可以直接传递价值。\n\n> 目前的转账是通过银行、支付宝或微信完成的；如果使用比特币，我们可以直接转账而无需任何第三方。\n\
  \n通过将区块链与互联网、比特币和银行进行比较，即使对方不能完全理解细节，也能在脑中形成一个更直接、更具体的印象，因为比较的对象是我们熟悉的事物。\n\n行为心理学指出，我们心中并没有“内在价值尺”来告诉我们某个物品的真实价值；相反，我们关注的是该物品与其他物品的相对优势来估计其价值。例如，即使你不知道蚂蚁\
  \ S9 矿机的价格，你也可以推断它比 S10 贵。\n\n\n\n\n\n在加密经济学中，价值往往是通过比较来决定的：如何确保 `Bitcoin` 和 `Ethereum`\
  \ 等系统中矿工的公平性？我们可以通过比较解决问题的速度，即看谁能更快地解决问题，以及谁能获得将交易添加到公共账本的权利；对于各种共识机制，如 `PoW`、`POS`\
  \ 和 `DPOS`，我们一直在比较哪一种更代表未来的发展方向。\n\n我们这种比较的习惯不仅是不理性的，而且这种不理性是可以预测的。我们总是习惯于观察周围的事物来确定彼此之间的关系，这不仅适用于实物，也适用于无形体验，即使在处理情感、态度和观点等瞬时波动较大的事物时也是如此。\n\
  \n相对性帮助我们在生活中做出决策，但它也可能让我们感到非常痛苦。例如，在接触区块链之前，你的正常年薪是 10 万人民币，在投资 `Bitcoin` 之后变成了\
  \ 500 万人民币。这当然是一件幸事的事；但如果你知道周围的朋友们至少赚了 1 亿人民币，你还能从中感到快乐吗？\n\n如果我们能控制比较的范围，转到一个能够提高我们相对幸福感的圈子，我们将过上更舒适的生活。\n\
  \n### 5.2.2 为什么你对 10,000 美元的比特币毫无感觉，而有些人却为之疯狂？\n\n从 2017 年底开始，各国开始控制代币发行 (`ICO`)）。加密货币一直在下跌，价格腰斩只是基本操作。跌幅\
  \ 80% 也随处可见，导致无数人遭受巨大损失。\n\n然而，在经历了 3 个月的监管后，加密货币市场变成了大牛市。许多被认为在状况持续恶化中挣扎的币种复苏了，第二个春天比以前更加耀眼。`Bitcoin`\
  \ 在 12 月突破了 1.4 万人民币大关，让无数人叹息并错过了最好的投机机会。\n\n在此期间，有些人不顾一切地寻找任何路径逃离，而另一些则冷静地购买底部代币；为什么面对同样的处境，不同的人会做出不同的选择？\n\
  \n行为经济学指出，当人们做决定时，思考往往受到他们获取的第一条信息的影响，就像沉入的海锚，将你的思想固定在某处，而你却对此毫无察觉。这种影响被称为“锚定效应”。\n\
  \n锚定效应为我们对比特币价格的不同接受程度提供了一个很好的解释。当人们第一次接触并尝试理解比特币时，不同的人对价值的理解存在显著差异：\n\n* A 认为 `Bitcoin`\
  \ 仅仅是一段无用的代码。它完全不具备货币的属性。现在的价格是因为炒作。早晚会有泡沫破灭的一天。他们还没有准备好接受价格历史上的持续上涨，而且绝对不会买，例如著名的拒绝了\
  \ 100 个 `bitcoins` 的 Lang 教授。\n* B 认为 `bitcoin` 是挖矿产生的，所以它的价格应该等于挖掘 `bitcoin` 的成本（设备投入\
  \ + 电费 + 维修费），因此它以高于成本的价格出售，例如……\n* C 认为如果你周围的朋友们至少赚了 1 亿人民币，你还能从中感到快乐吗？\n* D 认为\
  \ `bitcoin` 是挖矿产生的，所以它的价格应该等于挖掘 `bitcoin` 的成本（设备投入 + 电费 + 维修费），因此它以高于成本的价格出售，例如……\n\
  \n### 5.2.3 为什么很多项目喜欢空投？\n\n有一天你下班回到家，躺在沙发上习惯性地打开 `imToken` 钱包， 然后在余额列表中发现了一个奇怪的代币和一些代币。如果你是刚开始遇到这种情况，我相信你至少会感到一丝兴奋，但现在你已经习惯了：这只是某些项目的\
  \ `airdrop`（空投）。\n\n\n\n\n免费的东西让人感觉很好，这并不是秘密。“零”不仅是一种表达价格的特殊方式，还能唤起强烈的情绪——一种非理性兴奋的源。如果一个项目的代币单价从\
  \ `1 RMB` 降到 `5 JIAO`，你会参与吗？可能会。如果从 `5 JIAO` 变成免费呢？你会力争获得吗？绝对会！\n\n零成本是如此不可抵拒，这到底发生了什么？为什么这个东西能让我们如此开心？毕竟，免费很可能会给我们带来麻烦：我们本不想买的东西，或者根本没想过买的东西，一旦变成免费，就会变得极具吸引力。\n\
  \n你是否为了获得一个免费代币并进行实名认证，而注册了一个从未听过的交易所？\n\n免费代币最大的问题在于，它诱导你在它和另一个项目之间挣扎——导致你做出不明智的决策。如果你认为区块链+物联网有巨大的发展潜力，你想投资该领域的项目。在读完一个项目的白皮书后，你觉得他们的团队和技术没问题，但你投资了另一个看起来比上一个差一点的项目，因为它有额外的\
  \ `30%` 折扣。你放弃了更好的选择，投资了一个你并不想要的项目，这真划算！\n\n为什么最后来是如此诱人？为什么我们会有获得免费东西的非理性冲动，即使你并不真正需要它们？\n\
  \n麻省理工学院的经济学家亚当·埃利（Adam Ereli）认为，大多数交易都有正负两面，但免费让我们忘记了负面因素。免费代币创造了一种情感冲动，让我们错误地认为免费物品的价值远高于其实际价值。这可能是由于人类对损失的本能恐惧，而免费的真正诱惑与这种恐惧有关。选择免费物品没有明显的损失，但如果我们选择的不是免费的，就存在做出错误决策并遭受损失的风险。所以，如果让我们自己选择，我们会尽可能尝试免费获取它。\n\
  \n因此，“零”不仅仅是一个价格，免费代币引起的情绪冲动是无敌的。零所引起的价格效应非常特殊，其他数字无法比拟。\n\n为什么许多项目众筹的单位成本随着时间的推移而增加？例如，在项目的第一周有\
  \ `40%` 的折扣，每周减少 `10%` 直到优惠结束，这是利用免费心理鼓励投资者尽早入场。如果你在第四周发现这个项目并知道之前的优惠，那么即使你对此感兴趣，也可能选择放弃。\n\
  \n让我们举个简单的例子。一个（更可靠的）项目正处于推广期。在你注册后，你有两个选择，且只能选择其一：一个是免费获得价值 `100 yuan` 的代币，另一个是价值\
  \ `200 yuan` 的代币——你需要支付 `70 yuan`。想想，你会选哪一个？\n\n如果你选择直接获得免费的 `100 yuan` 代币，那么你就大多数人一样。如果你稍微算一下，你会发现价值\
  \ `200 yuan` 的代币花费 `70 yuan`，所以你赚了 `130 yuan`。收益显然高于免费的 `100 yuan` 代币。你能在现实中看到这种非理性行为吗？\n\
  \n从项目的角度来看，通过广泛的空投，能够获得代币的人会被激励去理解和推广项目，使他们手中的代币增值，这将成为一种常见的推广手段。\n\n### 5.2.4 DAO\
  \ 真的是未来的组织形式吗？\n\n最近，经过仔细的研究和分析后，你发现了一个非常棒的项目，但由于某些原因，你没有参与的渠道，于是你找了一个机会广阔的朋友寻求帮助。\n\
  \n朋友爽快地答应了。\n\n你转给了他 `ten ETHs`（这是你能使用的最大资产），然后，朋友向你转了大量的项目代币，甚至支付了转账费。\n\n`1 month`\
  \ 之后，该项目上线并上涨了 `50%`，于是你请他吃晚餐：花了 `1000 RMB`。\n\n朋友会如何反应？是否在某些情况下，用金钱感谢你并不像简单的“谢谢”那么容易？\n\
  \n另一个世界完全不同：它由市场规范支配。这里没有友谊，界限非常清晰。这里的交换是工资、租金、利息和成本。这种关系并不意味着邪恶或低俗。事实上，它包含了自力更、创新和个人主义，但也意味着利益和即时支付。如果你处于一个由市场纪律主导的世界，你必须通过工作来支付——一直一直是如此。\n\
  \n我们生活在社会世界和市场世界中的这一事实与我们生活的方方面面有关。我们有时需要有人帮忙搬东西、看几个小时孩子，或者在我们不在家时收一封信。我们如何能更好地激励朋友帮助我们？或者为社区做出贡献？这很难决定——尤其是当存在将关系推向市场规范的风险时。社会规范与市场规范之间的微妙平衡在商业世界也显而易见。例如，许多公司试图与其员工建立社会规范，因为他们看到了用社会规范营造氛围的优势。随着技术的不断发展，工作与休闲之间的边界变得越来越模糊。公司经理希望我们在家的路上思考工作，甚至在洗澡时。因此，我们配备了笔记本电脑和手机来消除办公室与家庭之间的边界。\n\
  \n对于公司来说，社会规范具有更大的优势：它们能让员工热情勤奋工作并关心公司。员工对雇主的忠诚度在市场纪律下往往降低，而社会规范是激励员工保持忠诚的最佳方法。开源软件展示了社会规范的潜力。在\
  \ `Linux`（操作系统）和其他项目中，你可以在任何论坛上发布问题，很快就会很多人回答你的问题。这些在线社区的人乐意为整个社会做出贡献。\n\n\n\n加密经济学讨论了哪些问题？首先，我们刚刚讨论了整个区块链的运行。区块链上的经济组织既不依赖人，也不依赖公司，而是依赖于数学算法。点对点交易也依赖于数学算法。如你所见，一组数学算法并不会增加一个人和万人的边际成本。特别是当边际成本趋于零时，我们还需要“公司”这种组织系统吗？“公司”之所以明的之所以是必要的，是因为市场交易成本太高，所以我们必须将部分市场功能内部化为内部过程以降低成本。公司之所以能够存在，是因为某些功能内部化后的成本低于市场，因此企业的存在是必要的。当边际成本变为零时，你就不需要公司了，因为它的存在没有意义。\n\
  \n基于加密经济学的社区（或者说去中心化组织）将更好地处理社会规范与市场规范之间的关系。\n\n也许在未来，我们将习惯一个“没有货币的社会”，它将完全放弃市场规范：该社区中的所有活动将不再接受代币。相反，整个社区将致力于交换经济——你给某人东西，另一个人就会给你东西。在这里，每个人都为了同一个目标努力工作，开发者会有意识地贡献并更新必要的代码，运营者会发布文章和时报，设计师会收集每个人的意见来创建产品和页面，每个人的劳动都将忠实地记录在区块链上，并根据这些记录，你可以获得社区能提供的所有产品和服务。这将是一个最具包容性、最具社会关怀的社区。\n\
  \n### 5.2.5 如何控制我们的冲动？也许你需要一个智能合约\n\n对于我们许多人来说，理性消费和理性投资是一件困难的事：我们清楚地知道每月的固定收入，也知道应该储蓄以防意外，但我们仍然不会犹豫地购买自己喜欢的东西。\n\
  \n这对于关注区块链投资的个人投资者也是如此，如果你看任何关于投资区块链项目的建议或指南，你会发现重点重点是合理的资产配置，这通常是你可以掌控的，通常占预算盈余的\
  \ 10%–20%，但到底有多少人真的按照这个比例进行投资呢？\n\n我相信有很多人已经辞了工作、卖了房子来全职进行投资。\n\n而且这不仅关乎消费和投资，我们在其他领域的行为决策也与我们的想法不一致。\n\
  \n当我们冷静且理智时，对行为决策的估计符合一系列逻辑标准。有多少人说过：“我偶尔会投机性货币，所以我不会让自己陷进去。”你认为你了解自己，了解自己的偏好，了解自己能力做什么，但我们往往无法完全估量自己的反应。\n\
  \n在弗洛伊德的术语中，我们每个人都包含一个黑暗的“自我”、一个“自我”，以及一个从不可预测的“超级自我”中获得控制的野兽。结果，通常冷静理智的朋友如果错过了一个好项目会大发雷霆并诅咒项目团队；脾气好的人在市场暴跌时会变得情绪暴躁；只用自己零花钱投资的人会在\
  \ `Bitcoin` 飙升时投入他们所能投入的所有资金。这些通常情况下好的人认为他们了解自己，但当市场极端波动时，一切都会发生变化。\n\n我们如何处理随时可能出现的非理性行为呢？\n\
  \n行为经济学家通过实验表明，如果有一个权威的“外部声音”来下达指令，我们大多数人会立即听从；但最好的方法似乎是给人们机会设定自己的底线，并选择他们喜欢的行动路径。这种方法可能没有强制性那么有效，但它可以帮助我们把自己推向正确的方向。\n\
  \n底线是什么？我们在自控方面存在困难，这与即时满足和延迟满足有关——这是一个明确的事实。但同时，我们面临的每个问题都有潜在的自控机制。如果我们无法提取收到的工资，可以让雇主自动帮我们扣除；如果我们不控制投入货币市场的资金量，可以由他人监督。有很多工具可以帮助我们实现自控并帮助我们。\n\
  \n### 5.2.6 多重选择的困境：为什么我们想参与所有项目？\n\n2017 年是数字货币和 ICO 爆发的一年。加密社区的任何人都能轻松说出几个飙升的货币。几十万的收益完全点燃了我们对\
  \ ICO 的热情。\n\n你有过这样的经历吗：由于你错过了热门项目的公募机会，你再也不想错过任何可能的项目了……\n\n\n\n然而，我们的精力是的，资金也是的，不可能参与所有项目，而且并非所有项目都是可靠的。\n\
  \n然而，即使你完全同意这一观点，当你看到群里有人在发送新项目的信息，或者当你创建一个新项目的二维码时，你仍然会自然地加入群组，然后打开群设置，取消群消息提醒；当然，如果这个项目很有很有，你还会将其置顶。\n\
  \n事实上，不仅是项目，许多人也关注数百种加密货币的价格走势——尽管他们持有的比例不到十分分之一。那么，我们关注所有项目信息的原因究竟是什么呢？\n\n在当今世界的背景下，我们仍然竭力为自己保留多种选择，有时我们甚至可能不知道在这个过程中错过了其他事情。当你正忙于处理某些并不一定重要的事情时，你可能会忘记一些真正重要的事情。结果就是，由于你关注了太多的项目，你无法对几个非常好的项目进行深入研究，从而错过了投资机会。\n\
  \n当有很多选择时，后果是什么？为什么我们必须为自己保留这么多选择，即使这些选择需要付出非常高的代价？为什么我们不能专心地去做好每一件事呢？\n\n耶大学教授沈世英通过实验发现，通常在明确的目标引导下，我们会努力追求最大化满意。在理想情况下，我们会尝试所有可能的选项并选择最合适的一个。然而，事实并非如此理想，因为机会是瞬即逝的，你不能等到分析完所有项目后再要求项目启动众筹，所以你总是会错过一些；当然，最好的项目可能就在其中。\n\
  \n我们如何才能消除这种非理性的冲动，不再追逐那些毫无价值的冗余选择？哲学家埃里克·弗罗姆（Erich Fromm）在 1941 年写了一本书《逃离自由》。他说，在现代民主制度下，并不是缺乏机会，而是机会太多，这让人眼目缭乱。这种现象在今天的社会中变得更加明显。人们不断地提醒自己，我们可以做任何事情并实现我们的预期。\n\
  \n问题是这个梦想是否可以实现。我们必须尽一切努力提高自己；我们必须在生活中尝试一切；我们必须在出生前至少看一遍那 1000 件事。但如果我们这样做，难道不会过度劳而精疲力竭吗？\n\
  \n我们有必要放弃这些项目，仅仅是因为这些项目耗费时间并挤占了我们的参与机会，它们让我们无法兼顾那些宝贵的选择并让我们精疲力竭。\n\n## 5.3 行为经济学与加密经济学的交汇\n\
  \n上文，我们可以意识到在日常生活和行为决策中，我们并不像传统经济学那样理性全面，而加密经济学中的智能合约可以用作外部约束，帮助我们做得更好。决策机制、区块链本身的公平开放性使我们能够获取我们想要知道的信息，而不是让数据由第三方中介控制。\n\
  \n我们可以预测，随着区块链技术的不断发展和加密经济学理论的逐步完善，我们将走向一个更好的世界，这对于想要进入这一领域的公司来说是要考虑的。\n\n# 第 6\
  \ 章：加密经济学与区块链安全\n\n加密经济学（Cryptoeconomics）很容易与现实世界的经济学联系起来。它们有相似之处，但并不完全相同。我们的现实经济学更多关于研究社会经济运行规律，例如研究人们如何做选择，这使得政策能够更好地协调经济和社会进步发展。而加密经济学更多关于机制设计（机制设计，一个结合了微观经济学和博弈论的分分支）。我们可以简单地理解：加密经济学是在加密世界中重构一个在经济上高效的框架和规则，这里的一切都基于代码并包含一个合理的激励系统。因此，加密经济学更多关于设计。而现实经济学更多关于从现有的社会结构中发现规律并遵循它们。\n\
  \n从另一个角度来看，现实世界的经济规律会受到许多因素的影响。在加密世界中，运行规则由代码决定，大多数收益通过共识获得。这反映了它的公平性，同时也考虑了最重要的——信任性。\n\
  \n由于它被视为未来的价值，如何确保这种价值在去中心化系统中具有 100%的钢铁般保护，这是重中之重。下面，让我们先了解影响加密经济学安全的主要因素。\n\n\
  ## 6.1 女巫攻击\n\n`Sybil attack` 这个名字源于 1973 年根据弗洛拉·施赖伯（Flora Schreiber）小说《西比》改编的电影。这是一个关于一个化名为西比尔·多塞特（Sybil\
  \ Dorsett）的女性心理治疗的故事。她被诊断为分离身份障碍，曾经拥有 16 个人格。\n\n这个词的扩展含义是，在点点网络中，一个节点通常拥有多个身份，通过控制大多数节点来削弱冗余备份的作用。\n\
  \n\n\n低冗余网络随时面临着遭受女巫攻击（sybils attack）的风险。几个大型矿工可能随时勾结，利用超过 51% 或接近 51% 的算力（记区块的权利）来破坏网络，而且在关键时刻不打包或不将区块写入账本已经是致命的。一旦恶意节点获得了随心所欲将区块写入账本的权利，我们就可以说女巫攻击成功了。同时，也可以宣布整个网络将变得不可信并失去其价值。\n\
  \n尽管女巫攻击的原理很简单，但我们无法完全消除这种现象。一旦将区块写入账本的权利被少数人垄断，他们可能会随时背叛，从可信节点变为女巫攻击者。\n\n# 6.1.1���传统网络与区块链网络女巫攻击的成本\n\
  \n上一节简要说明了区块链网络女巫攻击的原理。事实上，在女巫攻击方面，攻击传统网络更容易。之所以更容易，是因为成本的原因。由于在传统网络中发起女巫攻击的成本极低，如果攻击成功执行，恶意攻击者将获得相当大的利润。退一步说，即使没有成功也没有任何损失。\n\
  \n从经济角度来看，万物都有成本，如果价值就不值得为为。成本是一个重要因素。另一方面，我们只熟悉比特币网络；自 2009 年以来，它在没有任何中心化管理的情况下一直安全运行。这是因为中本在设计它时已经考虑了问题的成本。换句话说，如果你想对比特币网络进行女巫攻击，那么你就必须付出代价。而且这个代价并不低。\n\
  \n至少你必须拥有算力（即挖矿机），并且必须支付高昂的电费。因此，以盈利为目的的恶意节点会发现这样做并不划算；或许你可能会想是否存在这样的恶意节点不是为了盈利，而是为了破坏网络或使其崩溃？事实上，你只需要稍微多了解一点就能理解，控制比特币网络至少需要在硬件成本上支付\
  \ 30 亿美元。这仅仅是直接购买设备的成本。如果你想通过贿赂不同的矿工来进行恶意攻击，你必须支付比正常挖矿高多的费用来实现目标。\n\n在这里，经济规律的作用如此强大，以至于它基本上消除了通过女巫攻击关闭比特币网络的途径。这也是加密经济学的精妙之处。\n\
  \n当然，因为比特币网络现在太强大了，女巫攻击的成功概率非常小。然而，新出现的网络可能就不会那么幸运。由于网络算力不足和节点不足，女巫攻击成功的概率会大得多。很少有项目因为女巫攻击而死亡。\n\
  \n女巫攻击的防御是将交易放入新区块中的博弈。参与事件的人越多，他们勾结的可能性就越低；例如，他们来自不同的国家和不同的利益。\n\n## 6.2���分叉、软分叉与硬分叉\n\
