    **SOL-17  CH.SOL- 2.14.**

    There are various approaches to solve this problem, here we provide two; direct
    derivation or derivation via the softmax function.


    +   1 Direct derivation:

    .

    $\frac{d}{dx}\sigma(x) = \frac{d}{dx}((1+e^{-x})^{-1}) = -(1+e^{-x})^{-2}\frac{d}{dx}(1+e^{-x})
    = \frac{e^{-x}}{(1+e^{-x})^2}.$


    +   2 Softmax derivation:

    .

    In a classification problem with mutually exclusive classes, where all of the
    values are positive and sum to one, a softmax activation function may be used.
    By definition, the softmax activation function consists of n terms, such that
    $\forall i \in [1, n]$:

    $f(\theta_i) = \frac{e^{\theta_i}}{\sum_{k} e^{\theta_k}} = \frac{1}{1+e^{-\theta_i}\sum_{k
    \neq i} e^{\theta_k}}.$


    > To compute the partial derivative of 2.18, we treat all $\theta_k$ where $k
    \neq i$ as constants and then differentiate $\theta_i$ using regular differentiation
    rules. For a given $\theta_i$, let us define:


    $\beta = \sum_{k \neq i} e^{\theta_k},$ (2.19)


    and

    $f(\theta_i) = \frac{1}{1+\beta e^{-\theta_i}} = (1+\beta e^{-\theta_i})^{-1}.$
    (2.20)


    > It can now be shown that the derivative with respect to $\theta_i$ holds:


    $f''(\theta_i) = (1+\beta e^{-\theta_i})^{-2}\beta e^{-\theta_i},$ (2.21)'
