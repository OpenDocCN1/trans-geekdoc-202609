    # 6.3 Solutions


    # 6.3.1 Bagging, Boosting and Stacking


    **SOL-135** **CH.SOL- 6.1.**

    All the presented options are correct.


    **SOL-136** **CH.SOL- 6.2.**

    The correct choice would be stacking. In cases where the given corpus is small,
    we would most likely prefer training our models on the **full data-set**.


    **SOL-137** **CH.SOL- 6.3.**

    A random forest is a type of a decision tree which utilizes bagging.


    **SOL-138** **CH.SOL- 6.4.**

    The presented algorithm is a classic bagging.


    **SOL-139** **CH.SOL- 6.5.**

    The approach which is depicted is the **first phase** of stacking. In stacking,
