    artificial intelligence from a mere concept to reality.


    Calculus is frequently taught in a way that is very burdensome to the student,
    therefore I tried incorporating the writing of Python code snippets into the learning
    process and the usage of:


    +   DAGs ( D irected A cyclic G raphs). Gradient descent is the essence of optimization
    in deep learning, which requires efficient access to first and second order derivatives
    that AD frameworks provide. While older AD frameworks were written in C++ ([ 4
    ]), the newer ones are Python-based such as Autograd ([ 10 ]) and JAX ([ 3 ],
    [ 1 ] ).


    Derivatives are also crucial in graphics applications. For example, in a rendering
    technique entitled global illumination , photons bounce in a synthetically generated
    scene while their direction and colour has to be determined using derivatives
    based on the specific material each photon hits. In ray tracing algorithms, the
    colour of the pixels is determined by tracing the trajectory the photons travel
    from the eye of the observer through a synthetic 3D scene.


    A function is usually represented by a DAG . For instance, one commonly used form
    is to represent intermediate values as nodes and operations as arcs ( 5.2 ). One
    other commonly used form is to represent not only the values but also the operations
    as nodes ( 5.11 ).


