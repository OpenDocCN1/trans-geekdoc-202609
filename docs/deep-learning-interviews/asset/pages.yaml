  md: '# PRB-202 [2199 CH.PR B- 8.26.


    In this problem, you have to actually read 4 different papers, so you will probably
    not encounter such a question during an interview, however reading academic papers
    is an excellent skill to master for becoming a DL researcher .


    Read the following papers which discuss aspects of the Kullback-Leibler divergence:


    +   i Bennet [ 2 ]

    ii Ziv [ 29 ]

    iii Bigi [ 3 ]

    iv Jensen [ 1 ]


    The Kullback-Leibler divergence , which was discussed thoroughly in chap 4 is
    a measure of how different two probability distribution are. As noted, the KL
    divergence of the probability distributions P, Q on a set X is defined as shown
    in Equation 8.11 .


    ```

    $$D_{KL}(P||Q)=\sum_{x\in X}P(x)log\frac{P(x)}{Q(x)}\tag{8.11}$$

    ```


    Note however that since KL divergence is a non-symmetric information theoretical
    measure of distance of P from Q, then it is not strictly a distance metric. During
    the past years, various KL based distance measures (rather than divergence based)
    have been introduced in the literature generalizing this measure .


    Name each of the following KL based distances:


    ```

    $$D_{KLD1}(P||Q)=D_{KL}(P||Q)+D_{KL}(Q||P)\tag{8.12}$$

    $$D_{KLD2}(P||Q)=\sum_{x\in X}(P(x)-Q(x))log\frac{P(x)}{Q(x)}\tag{8.13}$$

    ```'
