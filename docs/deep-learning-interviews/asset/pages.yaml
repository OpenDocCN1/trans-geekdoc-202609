    **SOL-72** **CH.SOL- 4.6.**

    Information is an *increase* in uncertainty.


    **SOL-73** **CH.SOL- 4.7.**

    The Shannor bit has two distinctive states; it is either 0 or 1, but never both
    at the same time. Shannon devised an experiment in which there is a question whose
    only two possible answers were *equally likely to happen*. He then defined *one
    bit* as the amount of information gained (or alternatively, the amount of entropy
    removed) once an answer to the question has been learned. He then continued to
    state that when the a-priori probability of any one possible answer is higher
    than the other, the answer would have conveyed less than one bit of information.


    **SOL-74** **CH.SOL- 4.8.**

    The notion of surprise is directly related to the likelihood of an event happening.
    Mathematically is it inversely proportional to the probability of that event.

    Accordingly, learning that a high-probability event has taken place, for instance
    the sun rising, is **much less of a surprise** and gives less information than
    learning that a low-probability event, for instance, rain in a hot summer day,
    has taken place. Therefore, the less likely the occurrence of an event, the greater
    information it conveys.

    In the case where an event is a-priori known to occur for certain ($P_a = 1$),
    then *no information* is conveyed by it. On the other hand, an extremely intermint
    event conveys a lot of information as it **surprises** us and informs us that
    a very improbable state exists.'
