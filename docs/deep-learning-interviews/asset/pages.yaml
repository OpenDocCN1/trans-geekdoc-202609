  md: '# SOL-4

    CH.SOL- 2.1.


    **True.** However, when an excessive and unnecessary number of variables is used
    in a logistic regression model, peculiarities (e.g., specific attributes) of the
    underlying data set disproportionately affect the coefficients in the model, a
    phenomena commonly referred to as “overfitting”. Therefore, it is important that
    a logistic regression model does not start training with more variables than is
    justified for the given number of observations .


    # SOL-5

    CH.SOL- 2.2.


    The odds of success are defined as the ratio between the probability of success
    $p \in [0, 1]$ and the probability of failure $1-p$. Formally:


    ```

