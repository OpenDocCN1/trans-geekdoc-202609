- pgno: 7
  md: '# FOREWORD.


    > > *We will build a machine that will fly.*

    >

    > — Joseph Michael Montgolfier, French Inventor/Aeronaut (1740-1810)


    ![](img/574135cb1d7125b50cf484d943cdd676_7_0.png)


    EEP learning interviews are technical, dense, and thanks to the fields competitiveness,
    often high-stakes. The prospect of preparing for one can be daunting, and the
    fear of failure can be paralyzing and many interviewees find their ideas slipping
    away alongside their confidence.


    This book was written for you: an aspiring data scientist with a quantitative
    background, facing down the gauntlet of the interview process in an increasingly
    competitive field. For most of you, the interview process is the most significant
    hurdle between you and a dream job. Even though you have the ability, the background,
    and the motivation to excel in your target position, you might need some guidance
    on how to get your foot in the door.


    Though this book is highly technical it is not too dense to work through quickly.
    It aims to be comprehensive, including many of the terms and topics involved in
    modern data science and deep learning. That thoroughness makes it unique; no other
    single work offers such breadth of learning targeted so specifically at the demands
    of the interview.


    Most comparable information is available in a variety of formats, locations, structures,
    and resourcesblog posts, tech articles, and short books scattered across the internet.
    Those resources are simply not adequate to the demands of deep learning interview
    or exam preparation and were not assembled with this explicit purpose in mind.
    It is hoped that this book does not suffer the same shortcomings.


    ![](img/574135cb1d7125b50cf484d943cdd676_7_1.png)


    HIS books creation was guided by a few key principles: clarity and depth, thoroughness
    and precision, interest and accuracy. The volume was designed for use by job seekers
    in the fields of machine learning and deep learning whose abilities and background
    locate them firmly within STEM (science, technology, engineering, and mathematics).
    The book will still be of use to other readers, such as those still undergoing
    their initial education in a STEM field.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'However, it is tailored most directly to the needs of **active job seekers
    and students attending M.Sc/Ph.D programmes in AI** . It is, in any case, a book
    for engineers, mathematicians, and computer scientists: nowhere does it include
    the kind of very basic background material that would allow it to be read by someone
    with no prior knowledge of quantitative and mathematical processes.


    The books contents are a large inventory of numerous topics relevant to deep learning
    job interviews and graduate level exams. Ideas that are interesting or pertinent
    have been excluded if they are not valuable in that context. That places this
    work at the forefront of the growing trend in education and in business to emphasize
    a core set of practical mathematical and computational skills. It is now widely
    understood that the training of every computer scientist must include a course
    dealing with the fundamental theorems of machine learning in a rigorous manner;
    Deep Learning appears in the curriculum of nearly every university; and this volume
    is designed as a convenient ongoing reference for graduates of such courses and
    programs.


    The book is grounded in both academic expertise and on-the-job experience and
    thus has two goals. First, it compresses all of the necessary information into
    a coherent package. And second, it renders that information accessible and makes
    it easy to navigate. As a result, the book helps the reader develop a thorough
    understanding of the principles and concepts underlying practical data science.
    None of the textbooks I read met all of those needs, which are:


    +   1. **Appropriate presentation level** . I wanted a friendly introductory text
    acc to graduate students who have not had extensive applied experience : scientists.


    +   2. **A text that is rigorous** and builds a solid understanding of the subject
    v getting bogged down in too many technicalities.


    +   3. **Logical and notational consistency among topics** . There are i connections
    between calculus, logistic regression, entropy, and deep le theory, which I feel
    need to be emphasized and elucidated if the reader is: understand the field. Differences
    in notation and presentation style in c sources make it very difficult for students
    to appreciate these kinds of conne


    +   4. **Manageable size** . It is very useful to have a text compact enough that
    al material in it can be covered in few weeks or months of intensive review candidates
    will have only that much time to prepare for an interview, so a text is of no
    use to them.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'The text that follows is an attempt to meet all of the above challenges. It
    will inevitably prove more successful at handling some of them than others, but
    it has at least made a sincere and devoted effort.


    # ## A note about Bibliography


    The book provides a carefully curated bibliography to guide further study, whether
    for interview preparation or simply as a matter of interest or job-relevant research.
    A comprehensive bibliography would be far too long to include here, and would
    be of little immediate use, so the selections have been made with deliberate attention
    to the value of each included text.


    Only the most important books and articles on each topic have been included, and
    only those written in English that I personally consulted. Each is given a brief
    annotation to indicate its scope and applicability. Many of the works cited will
    be found to include very full bibliographies of the particular subject treated,
    and I recommend turning there if you wish to dive deeper into a specific topic,
    method, or process.


    We have a web page for this book, where we list errata, examples, and any additional
    information. You can access this page at: [http://www.interviews.ai](http://www.interviews.ai)
    . To comment or ask technical questions about this book, send email to: [entropy@interviews.ai](mailto:entropy@interviews.ai)
    .


    **I would also like to solicit corrections, criticisms, and suggestions from students
    and other readers. Although I have tried to eliminate errors over the multi year
    process of writing and revising this text, a few undoubtedly remain. In particular,
    some typographical infelicities will no doubt find their way into the final version.
    I hope you will forgive them .**


    **THE AUTHOR** .


    TEL AVIV ISRAEL , DECEMBER , 2020. FIRST PRINTING , DECEMBER 2020.'
