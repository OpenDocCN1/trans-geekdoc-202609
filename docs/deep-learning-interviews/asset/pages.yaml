    # SOL-34 \u2714 CH.SOL-3.5.


    The answers below regard a discrete random variable. The curious reader is encouraged
    to expand them to the continuous case .


    +   1. For a random variable $X$ with probability mass function $P(X=k)$ and a
    set of outcomes $K$, the expected value of $X$ is defined as:


    ```

    $E[X] := \sum_{k \in K} k P(X=k)$.            (3.12)

    ```


    Note: The expectation of $X$ may also be denoted by $\mu_X$.


    +   2. The variance of $X$ is defined as:


    ```

    $\text{Var}[X] := E[(X - E[X])^2]$.            (3.13)

    ```


    Note: The variance of $X$ may also be denoted by $\sigma_X^2$, while $\sigma_X$
    itself denotes the standard deviation of $X$.


    +   3. The population mean and variance of a binomial random variable with parameters
    $n$ and $p$ are:


    ```

    $E[X] = np$              $V[X] = np(1-p)$            (3.14)

    ```


