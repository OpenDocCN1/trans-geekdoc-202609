  md: '# SOL-178 ✏️ CH.SOL-8.2.


    Cross Validation is a cornerstone in machine learning, allowing data scientists
    to take full gain of restricted training data. In classification, effective cross
    validation is essential to making the learning task efficient and more accurate.
    A frequently used form of the technique is identified as K-fold cross validation.
    Using this approach, the full data set is divided into K randomly selected folds,
    occasionally stratified, meaning that each fold has roughly the same class distribution
    as the overall data set. Subsequently, for each fold, all the other (K – 1) folds
    are used for training, while the present fold is used for testing. This process
    guarantees that sets used for testing, are not used by a classifier that also
    saw it during training.


    K-Fold CV


