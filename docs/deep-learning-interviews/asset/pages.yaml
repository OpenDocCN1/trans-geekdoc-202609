    # 5.2.11 Feed forward neural networks


    Understanding the inner-workings of Feed Forward Neural Networks (FFNN) is crucial
    to the understanding of other, more advanced Neural Networks such as CNN''s.


    A Neural Network (NN) is an interconnected assembly of simple processing elements,
    $units$ or $nodes$ , whose functionality is loosely based on the animal neuron.
    The processing ability of the network is stored in the inter-unit connection strengths,
    or $weights$ , obtained by a process of adaptation to, or $learning$ from, a set
    of training patterns. $[\ref{6}]$


    The *Backpropagation Algorithm* is the most widely used learning algorithm for
    FFNN. Backpropagation is a training method that uses the *Generalized Delta Rule*
    . Its basic idea is to perform a gradient descent on the total squared error of
