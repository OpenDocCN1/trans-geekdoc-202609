  md: 'Manual differentiation is tedious and error-prone and practically unusable
    for real-time graphics applications wherein numerous successive derivatives have
    to be repeatedly calculated. Symbolic differentiation on the other hand, is a
    computer based method that uses a collection of differentiation rules to analytically
    calculate an exact derivative of a function resulting in a purely symbolic derivatives.
    Many symbolic differentiation libraries utilize what is known as *operator-overloading*
    ([ 9 ]) for both the forward and reverse forms of differentiation, albeit they
    are not quite as fast as AD.


    # ## 5.2 Problems


    # ### 5.2.1 AD, Gradient descent & Backpropagation


    AD [ 5 ] is the application of the chain rule to functions by computers in order
    to automatically compute derivatives. AD plays a significant role in training
    deep learning algorithms and in order to understand AD you need a solid grounding
    in Calculus. As opposed to numerical differentiation, AD is a procedure for establishing
    **exact** derivatives without any truncation errors. AD breaks a computer program
    into a series of fundamental mathematical operations, and the gradient or Hessian
    of the computer program is found by successive application of the chain rule (5.1
    ) to it''s elementary constituents.


    For instance, in the C++ programming language, two techniques ([ 4 ]) are commonly
    utilized in transforming a program that calculates numerical values of a function
    into a program which calculates numerical values for derivatives of that function;
    (1) an operator overloading approach and (2) systematic source code transformation.


    ```

    $$\left.\frac{\partial}{\partial t}f(g(t))\right|_{t=t_0} = \left(\left.\frac{\partial}{\partial
    s}f(s)\right|_{s=g(t_0)}\right)\left(\left.\frac{\partial}{\partial t}g(t)\right|_{t=t_0}\right)
    \tag{5.1}$$

    ```


    One notable feature of AD is that the values of the derivatives produced by applying
    AD, as opposed to numerical differentiation (finite difference formulas), are
    **exact and accurate** . Two variants of AD are widely adopted by the scientific
    community: the forward mode or the reverse mode where the underlying distinction
    between them is the order in which the chain rule is being utilized. The forward
    mode, also entitled tangent mode, propagates derivatives from the dependent towards
    the independent variables, whereas the reverse or adjoint mode does exactly the
    opposite. AD makes heavy use of a concept known as dual numbers (DN) first introduced
    by Clifford ([ 2 ]).'
