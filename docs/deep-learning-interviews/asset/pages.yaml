    entropy $(4.4)$, many are still unable to calculate simple logarithms. The purpose
    of this chapter is to present the aspiring data scientist with some of the most
    significant notions of entropy and to elucidate its relationship to probability.
    Therefore, it is primarily focused on basic quantities in information theory such
