  md: '# **SOL-40 ✏ CH.SOL- 3.11.**


    The essence of Bayesian analysis is to draw inference of unknown quantities or
    quantiles from the posterior distribution $p(\Gamma = \gamma | X = x)$, which
    is traditionally derived from prior beliefs and data information. Bayesian statistical
    conclusions about chances to obtain the parameter $\Gamma = \gamma$ or unobserved
    values of random variable $X = x$, are made in terms of probability statements.
    These probability statements are conditional on the observed values of X, which
    is denoted as $p(\Gamma = \gamma | X = x)$, called posterior distributions of
    parameter $\gamma$. Bayesian analysis is a practical method for making inferences
    from data and prior beliefs using probability models for quantities we observe
    and for quantities which we wish to learn. Bayes rule provides a relationship
    of this form:


    ```

    posterior $\propto p(\mathbf{x}|\gamma) p(\gamma) \propto$ data given prior $\times$
    chance of prior . (3.30)

    ```


    # **SOL-41 ✏ CH.SOL- 3.12.**


    The posterior density summarizes what is known about the parameter of interest
    $\gamma$ after the data is **observed** . In Bayesian statistics, the posterior
    density $p(\Gamma = \gamma | X = x)$ becomes the **prior** for this next experiment.
    This is part of the well-known Bayesian updating mechanism wherein we update our
    knowledge to reflect the actual distribution of data that we observed. To summarize,
    from the perspective of Bayes Theorem, we update the **prior distribution** to
    a **posterior distribution** after seeing the data .


