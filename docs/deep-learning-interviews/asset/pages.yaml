  md: 'Applying the chain rule from calculus:


    ```

    $$2v e^{-\frac{mv^2}{2kT}} + v^2\left(-\frac{m}{2kT}2v\right)e^{-\frac{mv^2}{2kT}}
    = 0 \tag{3.90}$$

    ```


    We notice that several terms cancel out:


    ```

    $$v^2 \frac{m}{2kT} = 1 \tag{3.91}$$

    ```


    Now the quadratic equation can be solved yielding:


    ```

    $$v_{\text{most\_probable}} = \sqrt{\frac{2kT}{m}} \tag{3.92}$$

    ```


    Therefore, this is the most probable value at which the dropout layer will fire
    .


