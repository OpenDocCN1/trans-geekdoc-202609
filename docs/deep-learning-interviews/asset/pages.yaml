    $$\mathcal{L}_{\gamma}(X=x)=p(X=x|\gamma)\quad (3.26)$$


    $$\ell_{\gamma}(X=x)=\ln\left(p(X=x|\gamma)\right)\quad (3.27)$$


    The term likelihood can be intuitively understood from this definition; it deduces
    how likely is to obtain a value $x$ when a prior information is given regarding
