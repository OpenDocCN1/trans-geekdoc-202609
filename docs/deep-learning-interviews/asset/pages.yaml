    # ReLU


    **PRB-223 \* CH.PRB- 8.47.**


    The rectified linear unit, or ReLU $g(z) = \max \{0, z\}$ is the default for many
    CNN architectures. It is defined by the following function:


    $$

    \begin{aligned}

    f_{\mathrm{ReLU}}(x) = \max(0, x) \tag{8.31}

    \end{aligned}

    $$


    Or:


    $$

    \begin{aligned}

