  md: '# 4.1 Introduction


    INDUCTIVE inference, is the problem of reasoning under conditions of incomplete
    information, or **uncertainty**. According to Shannon’s theory [2], information
    and uncertainty are two sides of the same coin: the more uncertainty there is,
    the more information we gain by removing the uncertainty. Entropy plays central
    roles in many scientific realms ranging from physics and statistics to data science
    and economics. A basic problem in information theory is encoding large quantities
    of information [2].


    Shannon’s discovery of the fundamental laws of data compression and transmission
    marked the birth of information theory. In his fundamental paper of 1948, “*A
    Mathematical Theory of Communication*” [4], Shannon proposed a measure of the
    uncertainty associated with a random memory-less source, called *Entropy*.


    ![](img/574135cb1d7125b50cf484d943cdd676_107_0.png)


    FIGURE 4.1: Mutual information


    Entropy first emerged in thermodynamics in the $18^{th}$ century by Carnot, [1]
    in his pioneering work on steam entitled “*Reflection on the Motive Power of Fire*”
    (Fig. 4.2). Subsequently it appeared in statistical mechanics where it was viewed
    as a measure of *disorder*. However, it was Boltzmann (4.30) who found the connection
    between entropy and probability, and the notion of'
