    - ‘true negatives’.


    +   3  A typical ROC curve has a concave shape with (0,0) as the beginning and
    (1,1) as the end point


    +   4  The ROC curve of a ‘random guess classifier’, when the classifier is completely
    confused and cannot at all distinguish between the two classes, has an AUC of
