    # 5.2.5 Taylor series expansion


    The idea behind a Taylor series is that if you know a function and all its derivatives
    at one point $x = a$, you can approximate the function at other points near $a$.
    As an example, take $f(x) = \sqrt{x}$. You can use Taylor series to approximate
    $\sqrt{10}$ by knowing $f(9)$ and all the derivatives $f''(9), f''''(9)$.


    The MacLaurin series (5.2) is a special case of Taylor series when $f(0), f''(0)$
    are known:


    ```

    $$f(x) = f(0) + xf''(0) + \frac{x^2}{2!}f''''(0) + \frac{x^3}{3!}f''''''(0) +
    \cdots = \sum_{p=0}^{\infty} \frac{x^p}{p!}f^{(p)}(0) \tag{5.2}$$

    ```


    For instance, the Maclaurin expansion of cos ( $x$ ) is:


    ```

    $$\begin{aligned} & f(x) = \cos x, \quad f''(x) = -\sin x, \\ & f''''(x) = -\cos
    x, \quad f''''''(x) = \sin x \tag{5.3} \end{aligned}$$

    ```


    When evaluated at 0 results in:


    ```

    $$\cos x = 1 - \frac{x^2}{2!} + \frac{x^4}{4!} - \frac{x^6}{6!} + \cdots \tag{5.4}$$

    ```


    **PRB-105 ? CH.PRB- 5.6.**

    Find the Taylor series expansion for: 1.


    ```

    $$\frac{1}{1 - x} \tag{5.5}$$

    ```'
