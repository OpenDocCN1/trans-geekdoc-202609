  md: '# AUTHOR''S BIOGRAPHY.


    ![](img/574135cb1d7125b50cf484d943cdd676_11_0.png)


    **When Shlomo** typed his book in LATEX, he wanted it to reflect some of his passions:
    AI, design, typography, and most notably coding. On a typical day, his two halves
    - the scientist and the artist - spend hours meticulously designing AI systems,
    from epilepsy prediction and pulmonary nodule detection, to training a computer-vision
    model on a cluster.


    Shlomo spends whole days in a lab full of GPUs working on his many interesting
    research projects. Though research satisfies his itch for discovery, his most
    important scientific contribution, he says, is helping other researchers.


    And the results are evident in his publications. But, although theoretical studies
    are important, practical experience has many great virtues. As the Head of AI
    at DeepOncology, he developed uses of Deep Learning for precise tumour detection,
    expanding and refining what human experts are capable of. The work, which relies
    on CNN''s, marks the culmination of a career spent applying AI techniques to problems
    in medical AI. Shlomo holds an MSc in Digital Signal Processing (Distinction)
    from the University of London.


    **A PERSONAL NOTE:** In this first volume, I purposely present a coherent, cumulative,
    and content-specific **core curriculum** of the data science field, including
    topics such as information theory, Bayesian statistics, algorithmic differentiation,
    logistic regression, perceptrons, and convolutional neural networks.'
