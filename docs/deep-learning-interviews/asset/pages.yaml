- pgno: 24
  md: 'ARGATED advertising. Deciphering dead languages. Detecting malignant tumours.
    Predicting natural disasters. Every year we see dozens of new uses for deep learning
    emerge from corporate R&R, academia, and plucky entrepreneurs. Increasingly, deep
    learning and artificial intelligence are in-grained in our cultural consciousness.
    Leading universities are dedicating programs to teaching them, and they make the
    headlines every few days.


    That means jobs. It means intense demand and intense competition. It means a generation
    of data scientists and machine learning engineers making their way into the workforce
    and using deep learning to change how things work. This book is for them, and
    for you. It is aimed at current or aspiring experts and students in the field
    possessed of a strong grounding in mathematics, an active imagination, engaged
    creativity, and an appreciation for data. It is hand-tailored to give you the
    best possible preparation for deep learning job interviews by guiding you through
    hundreds of fully solved questions.


    That is what makes the volume so specifically valuable to students and job seekers:
    it provides them with the ability to speak confidently and quickly on any relevant
    topic, to answer technical questions clearly and correctly, and to fully understand
    the purpose and meaning of interview questions and answers.


    Those are powerful, indispensable advantages to have when walking into the interview
    room.


    The questions and problems the book poses are tough enough to cut your teeth on-and
    to dramatically improve your skills but theyre framed within thought provoking
    questions, powerful and engaging stories, and cutting edge scientific information.
    What are bosons and fermions? What is chorionic villus? Where did the Ebola virus
    first appear, and how does it spread? Why is binary options trading so dangerous?


    Your curiosity will pull you through the books problem sets, formulas, and instructions,
    and as you progress, youll deepen your understanding of deep learning. There are
    intricate connections between calculus, logistic regression, entropy, and deep
    learning theory; work through the book, and those connections will feel intuitive.


    # 1.1.2 What will I learn'
