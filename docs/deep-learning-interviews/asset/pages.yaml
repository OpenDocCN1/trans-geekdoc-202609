  md: '![](img/574135cb1d7125b50cf484d943cdd676_308_0.png)


    The idea behind hashing is that items are hashed into buckets, such that similar
    items will have a higher probability of hashing into the same buckets.


    The goal of MinHash is to compute the Jaccard similarity without actually computing
    the intersection and union of the sets, which would be slower. The main idea behind
    MinHash is to devise a signature scheme such that the probability that there is
    a match between the signatures of two sets, S 1 and S 2 , is equal to the Jaccard
    measure [ 12 ].


    # SOL-204 CH.SOL- 8.28.


    Locality-Sensitive Hashing (LSH) is a method which is used for determining which
    items in a given set are similar. Rather than using the naive approach of comparing
    all pairs of items within a set, items are hashed into buckets, such that similar
    items will be more likely to hash into the same buckets.


    # SOL-205 CH.SOL- 8.29.


    Maximise.'
