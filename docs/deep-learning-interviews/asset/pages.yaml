  md: '# 3.1 Introduction


    ![](img/574135cb1d7125b50cf484d943cdd676_65_0.png)


    HE Bayesian school of thought has permeated fields such as mechanical statistics,
    classical probability, and financial mathematics [13 ]. In tandem, the subject
    matter itself has gained attraction, particularly in the field of BML. It is not
    surprising then, that several new Python based probabilistic programming libraries
    such as PyMc3 and Stan [11 ] have emerged and have become widely adopted by the
    machine learning community.


    This chapter aims to introduce the Bayesian paradigm and apply Bayesian inferences
    in a variety of problems. In particular, the reader will be introduced with real-life
    examples of conditional probability and also discover one of the most important
    results in Bayesian statistics: that the family of beta distributions is conjugate
    to a binomial likelihood . It should be stressed that Bayesian inference is a
    subject matter that students evidently find hard to grasp, since it heavily relies
    on rigorous probabilistic interpretations of data. Specifically, several obstacles
    hamper with the prospect of learning Bayesian statistics:


    +   1. Students typically undergo merely basic introduction to classical probability
    statistics. Nonetheless, what follows requires a very solid grounding in these
    concepts.

    2. Many courses and resources that address Bayesian learning do not cover these
    concepts.

    3. A strong comprehension of Bayesian methods involves numerical training sophistication
    levels that go beyond first year calculus.


    Conclusively, this chapter may be much harder to understand than other chapters.
    Thus, we strongly urge the readers to thoroughly solve the following questions
    and verify their grasp of the mathematical concepts in the basis of the solutions
    [8].


    # 3.2 Problems


    # 3.2.1 Expectation and Variance'
