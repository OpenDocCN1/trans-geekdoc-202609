  md: '*Denoting s and f as success and failure respectively, we know that the likelihood
    is:*


    $p(x_1, \ldots, x_n | \theta) = \theta^s (1 - \theta)^f$ \hspace{\fill} (8.71)


    *With the following parameters $\alpha = \beta = 1$ the beta distribution acts
    like Uniform prior:*


    $\theta \sim \text{Beta}(\alpha, \beta), \text{ given } \alpha = \beta = 1$ \hspace{\fill}
    (8.72)


    *Hence, the* ***prior*** *density is:*


    $p(\theta) = \frac{1}{B(\alpha, \beta)} \theta^{\alpha-1} (1-\theta)^{\beta-1}$
    \hspace{\fill} (8.73)


    *Therefore the* ***posterior*** *is:*


    $\begin{aligned} p(\theta | x_1, \ldots, x_n) &\propto p(x_1, \ldots, x_n | \theta)\,
    p(\theta) \\ &\propto \theta^s (1-\theta)^f \theta^{\alpha-1} (1-\theta)^{\beta-1}
    \\ &= \theta^{\alpha+s-1} (1-\theta)^{\beta+f-1} \end{aligned}$ \hspace{\fill}
    (8.74)


