- pgno: 25
  md: '# Starting Your Career


    Are you actively pursuing a career in deep learning and data science, or hoping
    to do so? If so, you''re in luckeverything from deep learning to artificial intelligence
    is in extremely high demand in the contemporary workforce. Deep learning professionals
    are highly sought after and also find themselves among the highest-paid employee
    groups in companies around the world.


    So your career choice is spot on, and the financial and intellectual benefits
    of landing a solid job are tremendous. But those positions have a high barrier
    to entry: the deep learning interview. These interviews have become their own
    tiny industry, with HR employees having to specialize in the relevant topics so
    as to distinguish well-prepared job candidates from those who simply have a loose
    working knowledge of the material. Outside the interview itself, the difference
    doesnt always feel important. Deep learning libraries are so good that a machine
    learning pipeline can often be assembled with little high-skill input from the
    researcher themselves. But that level of ability wont cut it in the interview.
    Youll be asked practical questions, technical questions, and theoretical questions,
    and expected to answer them all confidently and fluently.


    For unprepared candidates, thats the end of the road. Many give up after repeated
    post-interview rejections.


    # Advancing Your Career


    Some of you will be more confident. Those of you with years on the job will be
    highly motivated, exceptionally numerate, and prepared to take an active, hands-on
    role in deep learning projects. You probably already have extensive knowledge
    in applied mathematics, computer science, statistics, and economics. Those are
    all formidable advantages.


    But at the same time, its unlikely that you will have prepared for the interview
    itself. Deep learning interviewsespecially those for the most interesting, autonomous,
    and challenging positionsdemand that you not only know how to do your job but
    that you display that knowledge clearly, eloquently, and without hesitation. Some
    questions will be straightforward and familiar, but others might be farther afield
    or draw on areas you havent encountered since college.


    There is simply no reason to leave that kind of thing to chance. Make sure youre
    prepared. Confirm that you are up-to-date on terms, concepts,'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'and algorithms. Refresh your memory of fundamentals, and how they

    inform contemporary research practices. And when the interview comes,

    walk into the room knowing that youre ready for whats coming your way.


    # Diving Into Deep Learning


    “Deep Learning Job Interviews” is organized into chapters that each

    consist of an Introduction to a topic, Problems illustrating core aspects of

    the topic, and complete Solutions. You can expect each question and

    problem in this volume to be clear, practical, and relevant to the subject.

    Problems fall into two groups, conceptual and application-based.

    Conceptual problems are aimed at testing and improving your knowledge

    of basic underlying concepts, while applications are targeted at practicing

    or applying what you’ve learned (most of these are relevant to Python and

    PyTorch). The chapters are followed by a reference list of relevant

    formulas and a selective bibliography for guide further reading.


    # 1.1.3 How to Work Problems


    In real life, like in exams, you will encounter problems of varying

    difficulty. A good skill to practice is recognizing the level of difficulty a

    problem poses. Job interviews will have some easy problems, some

    standard problems, and some much harder problems.


    Each chapter of this book is usually organized into three sections:

    Introduction, Problems, and Solutions. As you are attempting to tackle

    problems, resist the temptation to prematurely peek at the solution; It is

