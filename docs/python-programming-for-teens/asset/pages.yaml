    # The onkey Function


    Turtle graphics can recognize two keyboard events: a key press and a key release.
    There are two functions to register event handlers for these events: onkeypress
    and onkeyrelease. In this section, you learn about the function onkey, which is
    a synonym for onkeyrelease.


    The function onkey expects two arguments: a function and a keyboard value. The
    keyboard value is either a string containing the single character on a given keyboard
    key or a string reserved for a special key, such as an arrow key. The onkey function
    binds a given key to a given function, meaning that when the key is released,
    the function is called. For example, if you issue the command onkey(down, "d"),
    Python binds the “d” key to the down function, and the pen is placed down when
    the user releases the “d” key. As before, you set up all your event handlers for
    the different keys and then call the listen function to start listening for events.


    To experiment with key events, you can bind the arrow keys to move the turtle
    forward or backward, turn it left or right, and clear the drawing, as shown in
    the following shell session:


    ```

    >>> from turtle import *

    >>> pencolor("blue")

    >>> speed(0)

    >>> width(2)

    >>> onkey(clear, "c")

    >>> onkey(lambda: forward(5), "Right")

    >>> onkey(lambda: back(5), "Left")

    >>> onkey(lambda: right(5), "r")

    >>> onkey(lambda: left(5), "l")

    >>> listen()

    ```


    Note several points about this code:


    +   - "Right" identifies the right arrow key, whereas "r" identifies the key containing
    that letter.

    +   - The movement and rotation functions use a distance of 5 units and an angle
    of 5 degrees, respectively, for faster interaction.

    +   - All but one of the event-handling functions are provided as lambda expressions.
    You first saw lambda expressions in Chapter 5, “Defining Functions.” You use a
    lambda'
