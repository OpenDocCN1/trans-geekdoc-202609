- pgno: 68
  md: '# SETTING AND EXAMINING THE TURTLE’S STATE


    You have seen how the turtle has some initial settings when the turtle graphics
    window opens: a position, a heading, and a pen color. These and various other
    values are called the turtle’s state. The turtle functions either change the turtle’s
    state or allow you to examine it. In this section, you explore three other aspects
    of the turtle’s state: its pen size, its shape, and its speed.


    # The Pen Size


    The turtle’s pen draws lines by painting tiny colored squares at various positions.
    These squares are called pixels. If your monitor has a high resolution, these
    pixels are quite tiny, so the lines drawn appear very thin. This is okay for fine
    work, but you might want to increase the pen’s size to draw heavier lines otherwise.
    To do so, you call the pensize function with the new pen size as an integer argument.
    For example, the expression pensize(4) sets the pen’s size to 4 pixels. To look
    up the current pen size, you call pensize().


    # The Shape


    As you saw earlier, the turtle’s shape is initially a caret symbol. You can change
    the turtle’s shape to any of the built-in shapes provided by turtle graphics,
    or you can add a new shape of your own. Table 2.3 lists the names and icons of
    the standard turtle shapes. The function getshapes returns a list of the available
    shape names.


    Table 2.3 The Built-in Turtle Shapes and Their Names


    | Name | Shape |

    |------|-------|

    | "arrow" | ▶ |

    | "blank" | No visible shape. |

    | "circle" | ● |

    | "classic" | ► |

    | "square" | ■ |

    | "triangle" | ▶ |

    | "turtle" | 🐢 |'
  merge: -1
  img_proc: true
- pgno: 69
  md: "To change the turtle’s shape, simply call the shape function with the desired\
    \ shape name as a string argument. For example, the expression shape(\"turtle\"\
    ) changes the turtle’s shape to a turtle. Calling shape with no argument returns\
    \ the turtle’s current shape name. If you do not want to see the turtle’s shape,\
    \ simply call hideturtle() or change its shape to \"blank\".\n\nThe function addshape\
    \ adds a new shape to the set of shapes already in turtle graphics. You can use\
    \ an image you have created for the new shape as long as its file is in GIF format.\
    \ You then give addshape the name of this file as an argument. For example, if\
    \ you want the turtle’s shape to be the Trident, the logo of Washington and Lee\
    \ University, you run the following code. The result is shown in Figure 2.8.\n\
    \n```\n>>> addshape(\"trident.gif\")\n>>> getshapes()\n['arrow', 'blank', 'circle',\
    \ 'classic', 'square', 'triangle',\n 'trident.gif', 'turtle']\n>>> shape(\"trident.gif\"\
    )\n```\n\n![](img/4dc3f6307b32ff815a6d58ec1c84708c_69_0.png)\n\nFigure 2.8\nChanging\
    \ the turtle’s shape to the Trident.\n© 2014 Python Software Foundation.\n\nPython\
    \ looks in the current working directory for the shape’s file. If the file is\
    \ somewhere else, you must provide its full pathname. If you want to find the\
    \ pathname of the current working directory, run the following code:\n\n```\n\
    >>> import os\n>>> os.getcwd()\n'/Users/ken/Documents'\n```"
