    | Method | What It Does |

    |---|---|

    | color(*args) | Can take zero, one, or two arguments. If there are no arguments,
    returns a tuple containing the current pen color and fill color. A single argument
    must be a color value, and both the pen color and the fill color are set to this
    value. Otherwise, the two arguments must be color values, which are used to set
    the pen color and the fill color, respectively. Arguments can have the form colorString
    (such as "red" or "#AA0000") or (r, g, b). If RGB values are used, they must be
    integers in the range from 0 through 255. |

    | colormode(cmode = None) | If the argument is absent, returns the current color
    mode. Otherwise, sets the color mode to cmode, which must be either 1 or 255.
    A color mode of 1 allows the use of basic colors only; a color mode of 255 allows
    the use of RGB values. |

    | fillcolor(*args) | If there are no arguments, returns the turtle''s current
    fill color. Otherwise, resets the turtle''s fill color. Arguments can have the
    form colorString (such as "red" or "#AA0000"), (r, g, b), or r, g, b. If RGB values
    are used, they must be integers in the range from 0 through 255. |

    | pencolor(width = None) | If there are no arguments, returns the turtle''s current
    pen color. Otherwise, resets the turtle''s pen color. Arguments can have the form
    colorString (such as "red" or "#AA0000"), (r, g, b), or r, g, b. If RGB values
    are used, they must be integers in the range from 0 through 255. |'
