    # WORKING WITH DICTIONARIES


    Lists and tuples are sequences. They are well suited for applications in which
    items must be ordered by position. Another type of data structure, called the
    dictionary, does not order its items by position. Instead, a dictionary associates
    each item with a unique value called a key. For example, when you hear the words
    mother and father, it’s likely that images of your mother and father immediately
    come to mind. In a crude sense, your mind or memory is like a big dictionary,
    in which each item or idea is associated with a unique key that allows you to
    access it. In this section, you explore the use of Python dictionaries to model
    this type of memory storage.


    # Dictionary Literals


    A dictionary is a set of key/value pairs. In a Python dictionary, the keys must
    be unique, but the values can be repeated. A key must be an immutable value, such
    as a number or a string. A value can be any Python data object or even a function
    or method.


    A dictionary literal consists of curly braces {}, which enclose a sequence of
    key/value pairs. Commas separate the pairs. Within each pair, a colon appears
    between the key and the value. The next shell session shows some example dictionaries:


    ```

    >>> {}

    {}

    >>> kenInfo = {"name":"Ken", "hair-color":"gray", "age":63}

    ```'
