- pgno: 169
  md: "The recursive summation function developed in this section might seem elegant\
    \ and graceful to the eye, but each call at runtime requires an extra chunk of\
    \ computer memory to support the storage for the arguments and return values.\
    \ Thus, the amount of memory required to run this function grows as a linear function\
    \ of the size of the range of numbers being summed. For small ranges, this is\
    \ not a significant problem, but for large ranges, a loop-based summation provides\
    \ a better alternative.\n\nThe loop-based version of the summation function uses\
    \ a for loop with the range function and adds each value to an ongoing total.\
    \ The total is initially set to 0 and is returned when the loop finishes. Here\
    \ is the code:\n\n```\ndef summation(low, high):\n    \"\"\"Returns the summation\
    \ of the integers\n    from low to high.\n    Precondition: low <= high.\"\"\"\
    \n    total = 0\n    for number in range(low, high + 1):\n        total += number\n\
    \    return total\n```\n\nWhy is the runtime performance of this version better\
    \ than the recursive version? The loop-based function is called just once, with\
    \ memory allocated for the two arguments low and high and for the temporary variables\
    \ total and number. On each pass through the loop, the values in this storage\
    \ are reset, but no new storage is ever added or ever needed.\n\nSo now you might\
    \ ask, “Why do I need to bother with recursion at all, if a loop-based function\
    \ seems to perform better than a recursive one?” There are two cases in which\
    \ you might still prefer a recursive alternative.\n\nThe first reason you might\
    \ prefer recursion is that it allows you to write some recursive functions that\
    \ do not result in growth of memory usage at runtime. These functions are called\
    \ tail-recursive functions. In a tail-recursive function, no operation is performed\
    \ after a recursive call. The recursive summation function defined earlier is\
    \ not, on this definition, tail recursive. After each recursive call of summation\
    \ returns, its total is added to the previous value of the low argument, in the\
    \ following statement:\n\n```\nreturn low + summation(low + 1, high)\n```\n\n\
    To convert such a function to a tail-recursive function, you need to think of\
    \ a way of passing the total as an extra argument to each function call. Then\
    \ you can increase the total at runtime before each recursive call, rather than\
    \ after. In the case of the summation function,"
  merge: -1
  img_proc: true
- pgno: 170
  md: "the total is initially 0, and it is returned directly when low becomes greater\
    \ than high. When low is less than or equal to high, summation is called recursively,\
    \ as follows:\n\n```\nsummation(low + 1, high, low + total)\n```\n\nThe total\
    \ argument has a default value of 0, so it doesn’t need to be provided on the\
    \ top-level call of the summation function. Here is the complete code for the\
    \ tail-recursive version:\n\n```\ndef summation(low, high, total = 0):\n    \"\
    \"\"Returns the summation of the integers\n    from low to high.\n    Precondition:\
    \ low <= high.\"\"\"\n    if low > high:\n        return total\n    else:\n  \
    \      return summation(low + 1, high, low + total)\n```\n\nAlthough this function\
    \ looks like it might be called multiple times, a smart compiler can translate\
    \ the Python code to a loop-based version that uses a fixed amount of memory for\
    \ the three arguments and the single value returned if low is greater than high.\
    \ Thus, it becomes a matter of your Python taste whether you use this version\
    \ or the loop-based version of the function, because they are both loop based\
    \ at runtime.\n\nThe second reason you might prefer recursion is that some loop-based\
    \ solutions also require a linear growth of computer memory at runtime. In those\
    \ solutions, your code manipulates a Python data structure called a stack, which\
    \ schedules other data values for processing by the loop. As the size of the problem\
    \ grows, so does the stack. In this case, a recursive solution performs no less\
    \ efficiently than an iterative solution but might be preferred on the grounds\
    \ of taste or simplicity. You will see examples of such problems later in this\
    \ chapter.\n\n# Infinite Recursion\n\nAs you design and use recursive functions,\
    \ you need to be aware of a potential error that can occur in their use. Like\
    \ loops, recursive functions have to have a way of stopping and returning with\
    \ a solution to a problem. Thus, you have to be careful to move the process along\
    \ so that you can reach the base case.\n\nFor example, the first version of the\
    \ summation function increments the value of the first argument until it equals\
