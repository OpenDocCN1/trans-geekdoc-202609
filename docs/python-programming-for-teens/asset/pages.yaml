  md: '(without the buttons). Python’s basic arithmetic operations are listed in Table
    1.1. In this table, the symbols A and B can be either numbers or expressions containing
    numbers and operators.


    **Table 1.1 Basic Arithmetic Operations**


    | Operation | What It Does | Example | Value |

    |---|---|---|---|

    | A + B | Returns the sum of A and B | 5 + 2 | 7 |

    | A - B | Returns the result of subtracting B from A | 5 - 2 | 3 |

    | A * B | Returns the product of A and B | 5 * 2 | 10 |

    | A / B | Returns the exact result of dividing A by B | 5 / 2 | 2.5 |

    | A // B | Returns the integer quotient from dividing A by B | 5 // 2 | 2 |

    | A % B | Returns the integer remainder from dividing A by B | 5 % 2 | 1 |

    | A ** B | Returns A^B | 5 ** 2 | 25 |

    | - A | Returns the arithmetic negation of A | - (5 * 2) | -10 |


    Note the following points about the arithmetic operations:


    +   1. The / operator produces the exact result of division, as a floating-point
    number.

    +   2. The // operator produces an integer quotient.

    +   3. When two integers are used with the other operators, the result is an integer.

    +   4. When at least one floating-point number is used with the other operators,
    the result is a floating-point number. Thus, 5 * 2 is 10, whereas 5 * 2.3 is 11.5.


    As in mathematics, the arithmetic operators are governed by precedence rules.
    If operators of the same precedence appear in consecutive positions, they are
    evaluated in left-to-right order. For example, the expression 3 + 4 - 2 + 5 is
    evaluated from left to right, producing 10.


    When the operators do not have the same precedence, ** is evaluated first, then
    multiplication (*, /, //, or %), and finally addition (+ or -). For example, the
    expression 4 + 3 * 2 ** 3 first evaluates 2 ** 3, then 3 * 8, and finally 4 +
    24, to produce 32.


    You can use parentheses to override these rules. For example, (3 + 4) * 2 begins
    evaluation with the addition, whereas 3 + 4 * 2 begins evaluation with the multiplication.
    What are the results of evaluating these two expressions? Open a shell and check!'
