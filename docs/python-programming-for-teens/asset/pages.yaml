- pgno: 199
  md: '# Implementation: Translation, Scaling, and Rotation


    Translation moves a polygon a given *x* distance and *y* distance. To implement
    the `translate` method, you need to hide the polygon if it’s visible. You then
    increment the `xPos` and `yPos` attributes by the *x* and *y* distances, respectively,
    and show the polygon if it’s visible.


    Scaling changes the size of a polygon by a given factor. If that factor is greater
    than 1, the size increases, and if it’s less than 1, the size decreases.


    Rotation turns the polygon to the left or the right by a given number of degrees.
    You assume that a positive number indicates a left turn, whereas a negative number
    indicates a right turn.


    The completion of these methods is left as an exercise for you.


    # Inheritance: Squares and Hexagons as Subclasses


    Suppose you’d like to provide new classes for more specific types of polygons,
    such as squares and hexagons. With objects and classes, that’s easy. Instead of
    reinventing the wheel and defining whole new classes, you can make the classes
    `Square` and `Hexagon` subclasses of `RegularPolygon`. In Python, a *subclass*
    of a given class gets to use the *parent class*’s attributes and methods for free,
    by *inheritance*. Figure 8.2 shows the relationship between the parent class `RegularPolygon`
    and two of its subclasses, `Square` and `Hexagon`.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_199_0.png)


    **Figure 8.2**

    A parent class and two of its subclasses.


    The only difference between squares and regular polygons, after all, is that squares
    always have four sides. Thus, to create a new `Square` object, you call the `Square`
    function'
