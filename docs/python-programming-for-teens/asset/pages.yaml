    ```\n\nname Ken\nage 63\nhair-color gray\n>>>\n\nAs you can see, the for loop\
    \ is easy to use as long as you have a sequence of items to process or a definite\
    \ number of iterations to perform.\n\n# ASKING QUESTIONS: BOOLEAN EXPRESSIONS\n\
    \nAs mentioned earlier, a computer program may have to respond to conditions in\
    \ the computer’s environment to select which course of action to take. Examining\
    \ these conditions takes the form of asking yes/no questions. For example, is\
    \ the integer value greater than 0? Is the turtle at the right edge of the turtle\
    \ graphics window? Does the file exist in the current working directory? Is the\
    \ length of the list equal to 0? These questions take the form of Boolean expressions\
    \ in Python code. In this section, you explore various ways of getting answers\
    \ to yes/no questions with Boolean expressions."
