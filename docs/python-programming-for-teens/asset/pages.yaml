- pgno: 186
  md: '+   - An infinite recursion is an error that occurs when the base case is never
    reached.

    +   - Recursive functions can be elegant to read but costly to run. When work
    is done after a recursive call, the runtime system must add memory for each recursive
    call. A loop-based strategy runs faster and consumes less memory.

    +   - A tail-recursive function, which does no work after a recursive call, can
    consume the same amount of running time and memory as a loop-based function.

    +   - The sequential search has a linear running time, whereas a binary search
    has a logarithmic running time.

    +   - Abstract paintings and fractals are examples of structures that have a recursive
    character.

    +   - The tracer function delays output until the update function is called. However,
    the computation of the data to be output can continue during this delay.


    # EXERCISES


    Launch the IDLE shell, open a file window, and complete the following exercises.
    You should run each program within IDLE and, when it is completed, in the terminal
    window.


