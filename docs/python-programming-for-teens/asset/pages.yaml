  md: '+   - A Python function is an operation that can be called by name to produce
    a value. When a function is called, it can receive other data as arguments to
    use in its computations.

    +   - A Python module, like the `math` module, is a library of functions and other
    resources that can be imported for use in your code. Examples of these resources
    are the function `math.sqrt` and the constant `math.pi`.

    +   - The `int`, `float`, and `str` functions are used to convert data to integers,
    floating-point numbers, and strings, respectively.

    +   - Python variables are names that refer to data values.

    +   - The assignment operator `=` is used to set a variable to a value.

    +   - A data structure is a datum that contains other data values. Operations
    exist to construct data structures and to access their component parts. Examples
    of data structures are strings, lists, tuples, and dictionaries.

    +   - A string is a sequence of zero or more characters. Python strings appear
    enclosed in quote marks.

    +   - The `+` operator glues together two strings to build a new string that contains
    them. This operation is called concatenation.

    +   - The `[]` operator returns the character at the given integer index position
    in a string.

    +   - The `[]` operator returns a substring of a string when a `:` appears within
    the operator. This is known as a slice operation.

    +   - A list is a sequence of zero or more data values. The items in Python lists
    appear enclosed in square brackets. Lists respond to the `+` and `[]` operators,
    as well as operations to insert and remove items. Unlike strings, lists are mutable.

    +   - A tuple is a sequence of zero or more data values. The items in Python tuples
    appear enclosed in parentheses. Unlike lists, tuples are immutable.

    +   - A dictionary is a set of key/value pairs. The items in Python dictionaries
    appear enclosed in curly braces. The data within a dictionary are not ordered
    by their positions, but by their keys.

    +   - The named operations on strings, lists, tuples, and dictionaries are known
    as methods. A method call consists of a datum, followed by a dot, followed by
