- pgno: 207
  md: "# A GRID CLASS FOR THE GAME OF TIC-TAC-TOE\n\nTo play the game of Tic-Tac-Toe,\
    \ you first draw a 3 by 3 grid of squares. (A napkin or even a flat area on a\
    \ beach can serve as a writing surface.) You and your opponent then take turns\
    \ placing Xs and Os on the squares, until the winner lines up three of his letters\
    \ in a row, column, or diagonal. Figure 8.4 shows a sample outcome of this game\
    \ in a turtle graphics window.\n\n![](img/4dc3f6307b32ff815a6d58ec1c84708c_207_0.png)\n\
    \nFigure 8.4\nA game of Tic-Tac-Toe.\n© 2014 Python Software Foundation.\n\nIn\
    \ this section, you develop a grid class and supporting code to play a two-person\
    \ game of Tic-Tac-Toe. In the exercises, you can then modify the program so that\
    \ you can play the game against the computer.\n\n# Modeling a Grid\n\nA two-dimensional\
    \ grid is laid out in rows and columns. For example, consider a grid with three\
    \ rows and three columns, where each position contains an integer. The integers\
    \ range from 0 through 8. You can easily view this grid in the Python shell by\
    \ printing consecutive integers in each row, using the following nested loop structure:\n\
    \n```\n>>> number = 0\n>>> for row in range(3):\n    for column in range(3):\n\
    \        print(number, end=\" \")\n        number = number + 1\n    print()\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 208
  md: "```\n0 1 2\n3 4 5\n6 7 8\n>>>\n```\n\nIf you want to store these data for later\
    \ use, you can represent the grid with a list structure. The following session\
    \ places the data in a list and then outputs them in two-dimensional grid format:\n\
    \n```\n>>> grid = list(range(9))\n>>> index = 0\n>>> for row in range(3):\n  \
    \  for column in range(3):\n        print(grid[index], end = \" \")\n        index\
    \ = index + 1\n    print()\n```\n\n```\n0 1 2\n3 4 5\n6 7 8\n>>>\n```\n\nIf it\
    \ seems odd to model a two-dimensional structure with a linear structure like\
    \ a list, you can define your own Grid class to represent a grid more directly.\
    \ You access each datum in this structure by providing two index values: one for\
    \ the row and one for the column. Unlike the coordinate system of turtle graphics,\
    \ the position (0, 0) locates the datum in the upper-left corner of this structure.\
    \ Thus, the datum in row 1, column 2 is at position (1, 2). The row index gets\
    \ larger as you move down in the grid, and the column index gets larger as you\
    \ move to the right.\n\nThe next session assumes that such a class is available\
    \ in the grid module. You create a Grid object with the required numbers of rows\
    \ and columns, and then you can load this object with data and print its contents:\n\
    \n```\n>>> from grid import Grid\n>>> datum = 0\n>>> gryd = Grid(3, 3)      #\
    \ Create a 3 by 3 Grid object\n>>> for row in range(3):\n    for column in range(3):\n\
    \        gryd[row][column] = datum\n        datum = datum + 1\n```"
