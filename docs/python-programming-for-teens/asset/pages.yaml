    >>>\n```\n\nIn the discussion that follows, you use a list structure to hold a\
    \ grid’s data.\n\n# Defining a Class for a Tic-Tac-Toe Grid\n\nEach square in\
    \ Tic-Tac-Toe is either empty or contains a letter. When a player clicks on an\
    \ empty square, that player’s letter is inserted and displayed there. Thus, a\
    \ square is complex enough to warrant its own class definition. You call this\
    \ new class TicTacToeSquare and define it in the module tictactoesquare.py.\n\n\
    When you decide to define a new class, the first question you should ask yourself\
    \ is, “Can I get some data and behavior for free by subclassing an existing class?”\
    \ By now, you do not want to write all your code from scratch. You have seen two\
    \ examples of subclassing in this chapter already: Square is a subclass of RegularPolygon,\
    \ and MenuItem is a subclass of Turtle. Because you want a Tic-Tac-Toe square\
    \ to respond to mouse clicks, subclassing the Turtle class looks like a wise move.\n\
    \nIn addition to its turtle-like attributes (shape, pen color, fill color, position,\
    \ and a callback function), a Tic-Tac-Toe square contains two other data values.\
    \ The first data value is a single-character string. This string will be empty\
    \ when a square is created and will be either X or O after a player makes a successful\
    \ move. The second data value is the integer index of the square in the grid.\
    \ (Remember that you will use a list to contain the squares.) These data are initialized\
    \ when you create the square.\n\nIn addition to the __init__ method, the TicTacToeSquare\
    \ class includes a text method. This method is the getter and setter for the letter\
    \ that appears within a grid square. The Tic-Tac-Toe game uses this method to\
    \ examine the letter within a square and to place a letter in it if it’s empty."
