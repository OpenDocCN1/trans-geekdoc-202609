- pgno: 137
  md: "# The randomForward Function\n\nThe randomForward function might contain the\
    \ two lines of code that pick a random distance and move the turtle forward by\
    \ that amount. But you can make this function a bit more flexible than that, as\
    \ follows:\n\n```\ndef randomForward(lower, upper = None):\n    \"\"\"Moves the\
    \ turtle a random distance, from lower through upper.\n    If upper is absent,\
    \ moves turtle the lower distance\"\"\"\n    if not upper:\n        distance =\
    \ lower\n    else:\n        distance = randint(lower, upper)\n    forward(distance)\n\
    ```\n\nYou might be surprised to see that the second argument, upper, has a default\
    \ value of None. This, together with the if-else statement, allows the caller\
    \ to move the turtle forward either a random distance or a given distance. Thus,\
    \ the randomForward function will work just as expected in the random walk program,\
    \ but will also be helpful when used in a slightly different way in other programs.\n\
    \n# The randomTurn Function\n\nThe randomTurn function has one required argument\
    \ and two optional arguments.\n\nAs in the randomDistance function, the first\
    \ two arguments are named lower and upper, and they work together in a similar\
    \ manner. If the value of upper is absent, the turn is not random, and the value\
    \ of lower is the number of degrees used to take the turn. If they are both present,\
    \ a random number from lower through upper is chosen to specify the number of\
    \ degrees.\n\nThe third argument is named probability, and it specifies the probability\
    \ of the turtle’s turning. The default value of this argument is 1, meaning that\
    \ the turn will be made. Any value less than 1 means that the turn might not be\
    \ taken at all.\n\nAs you can imagine, this function requires substantial control\
    \ logic. Here is the code, followed by an explanation:\n\n```\ndef randomTurn(lower,\
    \ upper = None, probability = 1):\n    \"\"\"Turns the turtle a random number\
    \ of degrees, from\n    lower through upper.\n    If upper is absent, turns the\
    \ turtle by the lower amount of degrees.\n    Probability represents the likelihood\
    \ of making the turn.\"\"\"\n    from random import choice\n```"
  merge: -1
  img_proc: true
- pgno: 138
  md: "```\n# Determine whether to make a turn first.\nif probability < .01:    #\
    \ Probability too small to take the turn\n    return\nif probability < 1:    #\
    \ Maybe not take the turn\n    if not choice(range(100)) in range(0, int(probability\
    \ * 100)):\n        return\n\n# A turn will be made, so the # of degrees is either\
    \ random or given\nif not upper:    # Upper absent, so use lower\n    degrees\
    \ = lower\nelse:    # Choose a random amount of degrees\n    degrees = randint(lower,\
    \ upper)\n\nif randint(1, 2) == 1:    # Turn left or right with equal prob.\n\
    \    left(degrees)\nelse:\n    right(degrees)\n```\n\nWhew! There is a saying\
    \ that nothing good comes cheaply, and this function is a case in point. Whenever\
    \ there is complex logic, you try to handle the easiest cases first. So, here\
    \ are the cases in this function:\n\n+   1. The probability is less than .01,\
    \ so you just quit the function.\n+   2. The probability is less than 1, so you\
    \ use it to determine whether to continue. You pick a random number from 0 through\
    \ 99 and then see if that number is in the range of numbers from 0 through 100\
    \ times the probability. If it’s not in that range, you quit the function.\n+\
    \   3. If you get this far, you’ll be turning the turtle. If the value of upper\
    \ is not present, the number of degrees will be the value of lower. Otherwise,\
    \ the number of degrees is a random number from lower through upper.\n+   4. Finally,\
    \ you choose whether to turn left or right, with equal probability.\n\nNote that\
    \ the function also imports the random function choice for later use in its code.\n\
    \nEven though you have expended a lot of effort on several new function definitions,\
    \ this effort will be well rewarded. Your top-level code will be simpler and easier\
    \ to read and manage. Moreover, other programmers will find your code useful,\
    \ should you decide to share it with them."
  merge: -1
  img_proc: true
- pgno: 139
  md: "# Another Version of the Random Walk\n\nThe random walk program halts when\
    \ the turtle crosses an edge of the window. But animals don’t typically stop when\
    \ they encounter obstacles; they either climb over them or turn to try another\
    \ route.\n\nAnother version of a random walk allows the turtle to turn back into\
    \ the enclosed area of the window when it encounters an edge. In this version,\
    \ the main loop runs a definite number of times—perhaps long enough to allow the\
    \ turtle several “rebounds” off the edges of its window. When the turtle crosses\
    \ an edge, it turns its back to that edge and proceeds from there. Otherwise,\
    \ it takes a random turn, as before. The program also allows the user to specify\
    \ the number of iterations via a command-line argument. This value is 1000 by\
    \ default.\n\nHere is the code for the new version of the program:\n\n```\nfrom\
    \ turtle import *\nfrom random import randint\nimport sys\n\n# New function definitions\
    \ will go here\n\ndef main():\n    if len(sys.argv) > 1:\n        iterations =\
    \ int(sys.argv[1])\n    else:\n        iterations = 1000\n    reset()\n    for\
    \ count in range(iterations):\n        randomForward(1, 3)      # Move 1, 2, or\
    \ 3 units\n        if atTopEdge():\n            setheading(270)      # Go south\n\
    \        elif atBottomEdge():\n            setheading(90)       # Go north\n \
    \       elif atLeftEdge():\n            setheading(0)        # Go east\n     \
    \   elif atRightEdge():\n            setheading(180)      # Go west\n        else:\n\
    \            randomTurn(45, 135, .05) # Turn 1/20 of the time by default\n```\n\
    \nAs you can see, the functions you developed in this section have come in quite\
    \ handy. You will have many more occasions to structure your code with functions\
    \ in the rest of this book."
  merge: -1
  img_proc: true
- pgno: 140
  md: '# SUMMARY


    +   - A function definition consists of a heading and a set of statements.

    +   - A function heading contains the function’s name and a parenthesized list
    of argument names.

    +   - A function’s docstring is located between the function’s heading and its
    statements.

    +   - A default argument appears as an assignment of a default value to the argument’s
    name in a function heading.

    +   - If an argument has a default value, you can omit that argument when the
    function is called.

    +   - Arguments can be passed with keywords when a function is called. The keyword
    is the argument’s name, which is followed by the assignment operator and its value.
    A keyword argument may appear in a different position than its position in the
    function definition’s heading.

    +   - An argument without a keyword must appear in the same position in both the
    call and the definition of the function.

    +   - An argument without a default value must appear before any of the arguments
    with defaults in the function definition’s heading.

    +   - An argument without a default value is required; you cannot omit it when
    the function is called.

    +   - The `return` statement returns the value of an expression to the function’s
    caller. When the expression is omitted or the function has no `return` statement,
    that function returns the value `None`.

    +   - A function may be passed as an argument to another function.

    +   - The `lambda` expression creates an anonymous function.


    # EXERCISES


    Launch the IDLE shell, open a file window, and complete the following exercises.
    You should run each program within IDLE and, when it is completed, in the terminal
    window.


    +   1. The Pythagorean Theorem defines the relationship between the hypotenuse
    of a right triangle and its other two sides. It states that the square of the
    hypotenuse is equal to the sum of the squares of the other two sides. Define a
    function named `hypo`'
