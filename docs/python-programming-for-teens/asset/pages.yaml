- pgno: 136
  md: "As you can see, you have just reduced 15 lines of code to 4 lines of code and\
    \ made the top-level program easier to read and understand. You can also supply\
    \ arguments that move the turtle shorter distances and turn it fewer times to\
    \ smooth the pattern of the walk. Now it’s time to complete the program by defining\
    \ the functions.\n\n# The atEdge Function\n\nAs a first cut at defining the atEdge\
