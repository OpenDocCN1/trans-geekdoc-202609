- pgno: 188
  md: "# OBJECTS, METHODS, AND CLASSES IN TURTLE GRAPHICS\n\nWhen you call a turtle\
    \ graphics function such as goto or setcolor, the position or color of the turtle\
    \ changes. Underneath the hood, turtle graphics maintains a single turtle object\
    \ that does all this work. Hereafter, this object is called the system turtle.\
    \ Also underneath the hood, other objects represent the window and the canvas\
    \ on which the turtle does its drawing. If all you need is a single turtle, this\
    \ arrangement suffices. However, if you would like to use several turtles, you\
    \ need to be able to create them, give them names or place them in the appropriate\
    \ data structures, and manipulate them directly by calling methods. In this section,\
    \ you learn how to do that.\n\n# The Turtle Class and Its Methods\n\nThe class\
    \ of all turtle objects is named Turtle. This name is capitalized, to distinguish\
    \ it from the turtle module in which it is defined. You can access this class\
    \ by running the statement from turtle import Turtle. At that point, you can create\
    \ two new turtle objects, named sleepy and happy, as follows:\n\n```\n>>> from\
    \ turtle import Turtle\n>>> sleepy = Turtle(shape = \"turtle\")\n>>> happy = Turtle(shape\
    \ = \"turtle\")\n```\n\nThe new turtle objects have the same default attributes\
    \ (position, color, heading, and so on) as the system turtle, but they are distinct\
    \ objects. Most of the built-in turtle graphics functions that you used before\
    \ can now be called as methods on the new turtle objects. For example, the next\
    \ session modifies the initial settings of the two turtles and draws some line\
    \ segments:\n\n```\n>>> sleepy.color(\"blue\")\n>>> sleepy.goto(70, 70)\n>>> happy.color(\"\
    red\")\n>>> happy.goto(-70, 70)\n```\n\nThe only difference between this code\
    \ and the turtle functions that you have been using thus far is that now you must\
    \ refer to a particular turtle object when you want it to do something. For example,\
    \ the following code segment draws a square of length 70 at sleepy’s current position:\n\
    \n```\n>>> for count in range(4):\n    sleepy.forward(70)\n    sleepy.left(90)\n\
    ```"
  merge: -1
