- pgno: 134
  md: "Thus, to plot the two functions as shown in Figure 5.1, you would call the\
    \ following:\n\n```\nplot(linear, 0, 50, \"y = 2 * x + 10\")\nplot(quadratic,\
    \ -5, 15, \"y = x ** 2 - 10 * x + 3\")\n```\n\nIn the plot function, you raise\
    \ the pen and position it at the first point (x, y) generated by applying the\
    \ argument function. You then lower the pen and loop through the remaining x values\
    \ in the domain. On each pass through the loop, you apply the function to compute\
    \ a y value and go to the new (x, y) position. When the loop finishes, the last\
    \ step writes the label at the final (x, y) position. Here is the code for the\
    \ plot function:\n\n```\ndef plot(f, x1, x2, label):\n    \"\"\"Plots f(x) for\
    \ the domain x1..x2.\"\"\"\n    up()\n    y = f(x1)\n    goto(x1, y)\n    down()\n\
    \    for x in range(x1 + 1, x2 + 1):\n        y = f(x)\n        goto(x, y)\n \
    \   write(label, font = (\"Arial\", 16, \"bold\"))\n```\n\nA helper function draws\
    \ the axes to the dimensions of the canvas, and the size of the pen is set to\
    \ 2 before plotting the functions for clarity. The development of the complete\
    \ program is left as an exercise for you.\n\n# REFACTORING A PROGRAM WITH FUNCTIONS\n\
    \nThe process of modifying a program to make it simpler to read and maintain is\
    \ called refactoring. In this section, you explore how to refactor the code for\
    \ a random walk, introduced in Chapter 3. Here is the code for the second version\
    \ of that program:\n\n```\nfrom turtle import *\nfrom random import randint\n\
    reset()\nwidth = window_width()                     # Line 4\nheight = window_height()\n\
    (minX, maxX) = (-(width / 2), width / 2)\n(minY, maxY) = (-(height / 2), height\
    \ / 2)\n(x, y) = position()\nwhile x > minX and y > minY and x < maxX and y <\
    \ maxY: # Line 9\n    distance = randint(10, 60)              # Line 10\n    forward(distance)\
    \                       # Line 11\n```"
  merge: -1
  img_proc: true
- pgno: 135
  md: "```\ndegrees = randint(45, 135)      # Line 12\nif randint(1, 2) == 1:\n  \
    \  left(degrees)\nelse:\n    right(degrees)              # Line 16\n(x, y) = position()\
    \             # Line 17\n```\n\nIn this version of the program, the turtle moves\
    \ a random distance and then turns left or right a random number of degrees until\
    \ it moves past one of the edges of the window. At that point, the turtle stops\
    \ and the program ends.\n\n# Simplifying the Code for the Random Walk\n\nIf you\
    \ study the code for the random walk closely, you will spot several major tasks\
    \ that function calls could simplify:\n\nLines 4–9 and line 17 are run to determine\
    \ whether the turtle has crossed an edge of the window. This code could be packaged\
    \ in a Boolean function named atEdge. This function returns True if the turtle’s\
    \ position has crossed an edge, or False otherwise. Moreover, because the window’s\
    \ dimensions are examined each time the function is called, the turtle can continue\
    \ if the user grows the window or stop sooner if the user shrinks the window.\n\
    \nLines 11 and 12 move the turtle forward a random distance. This code could go\
    \ in a function named randomForward, which expects the bounds of the possible\
    \ distances as arguments.\n\nLines 12–16 turn the turtle left or right by a random\
    \ number of degrees. You could place this code in a function named randomTurn,\
    \ which expects the bounds of the possible degrees as arguments. You could also\
    \ add a third, optional argument that specifies the probability of making a turn.\n\
    \nBefore you define each of these new functions, you should rewrite the code for\
    \ the top-level program (now in a main function) to see how your functions are\
    \ used:\n\n```\nfrom turtle import *\nfrom random import randint\n\n# New function\
    \ definitions will go here\n\ndef main():\n    reset()\n    while not atEdge():\n\
    \        randomForward(1, 3)      # Move 1, 2, or 3 units\n        randomTurn(45,\
    \ 135, .05) # Turn 1/20 of the time\n```"
