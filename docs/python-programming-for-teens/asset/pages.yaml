    print(\"Volume:\", volume(radius))\nif __name__ == '__main__':\n    main()\n```\n\
    ```\n\nNote that the variable PI is assigned a value above any of the function\
    \ definitions. Thus, it is a module variable, and its value is accessible everywhere\
    \ in the module. Because PI behaves like a constant in this program, you set its\
    \ value just once. The only restriction on the use of a module variable is that\
    \ you cannot assign it a new value within a function definition. You will see\
    \ how to get around that limitation shortly.\n\n# Tracking the History of Turtle\
    \ Positions\n\nNow, suppose you need to know the positions that the turtle has\
    \ recently visited. For example, you might write a program that allows the user\
    \ to draw a triangle with three mouse clicks. Each click will be on a vertex of\
    \ the triangle, and the turtle will connect them with line segments to complete\
    \ the drawing. The first line-drawing program won’t be able to do this. (Try it\
    \ yourself; you’ll need four clicks.)\n\nTo draw a triangle with just three clicks,\
    \ your program needs a different strategy. On the first mouse click, the turtle\
    \ skips to that position, without drawing. On the second mouse click, the turtle\
    \ draws a line segment connecting the first two vertices. On the third mouse click,\
    \ the turtle draws two more line segments to complete the figure.\n\nTo support\
    \ this capability, you need to record the positions of earlier clicks somewhere,\
    \ and you need to make some choices based on the number of clicks that have already\
    \ occurred. A list would work fine for that; it would start out empty, and you\
    \ could append each position to the list when the mouse is clicked. Here are the\
    \ rules for making choices, based on the length of this list:\n\n+   - If the\
    \ list is empty, skip to the click position and add the click position to the\
    \ list.\n+   - If the list contains one position, go to the click position (drawing\
    \ a line segment from the first position) and add the click position to the list.\n\
    +   - If the list contains two positions, draw line segments from each of them\
    \ to the click position, and make the list empty again.\n\nAll this code goes\
    \ in the event-handling function for mouse clicks. Name that function setVertex.\
    \ As usual, the function expects two arguments: the coordinates of the mouse click.\
    \ The function assumes that the variable positionHistory refers to a list of the"
