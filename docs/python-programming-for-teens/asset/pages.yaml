  md: '# CHAPTER 7


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_163_0.png)


    # RECURSION


    Computer science is sometimes called the science of abstraction. As you learned
    in Chapter 5, “Defining Functions,” an abstraction is a means of simplifying a
    complex situation or problem. For example, the term word processing refers to
    all the things you might do with text, including editing text, checking the spelling
    and grammar of text, and saving text to files, among other things. Each of these
    apparently simple processes, in turn, is an abstraction of other processes.


    In this chapter, you learn an especially beautiful and elegant way to create abstractions
    called recursion. A recursive situation or problem can be subdivided into smaller
    situations or problems of the same form. Along the way, you learn how to construct
    recursive functions to solve such problems and explore some recursive patterns
    in art and nature.


    # RECURSIVE DESIGN


    Recursive design is a variation of an important design strategy called top-down
    design. In this section, you review the top-down design of a program from Chapter
    5, as a prelude to learning about the important features of recursive design.


    # Top-Down Design


    One popular design strategy for programs of any significant size and complexity
    is called top-down design. This strategy starts with a global view of the entire
    problem and breaks the problem into smaller, more manageable subproblems—a process
    known as problem decomposition. As each subproblem is isolated, its solution is
    assigned to a function.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Problem decomposition may continue down to lower levels, because a subproblem
    might in turn contain two or more lower-level problems to solve. As functions
    are developed to solve each subproblem, the solution to the overall problem is
    gradually filled out in detail. This process is also called *stepwise refinement*.


    For example, consider the problem of plotting the graph of a function, for which
    you wrote a program in Chapter 5. The solution to this problem required you to
    perform several subtasks:


    +   - Initialize the turtle’s state.

    +   - Draw the axes.

    +   - Compute the value of y for each value x in a set of values in a function’s
    domain.

    +   - Draw line segments between the resulting (x, y) points in the graph.


    You assigned each of these tasks to a Python function and coordinated their actions
    within a top-level `main` function. The relationships among the programmer-defined
    functions are depicted in the *call diagram* of Figure 7.1.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_164_0.png)


    # Figure 7.1


    The call diagram of the function-plotting program.


    Note that program execution begins with the `main` function at the top of the
    diagram. This function calls the functions shown in the next level below, from
    left to right. The functions not shown, such as `speed`, are built in. Others,
    like `plot`, are defined by you and call still other functions at a lower level
    to do their work.


    There are four important points to note about top-down design:


    +   - You typically begin with a `main` function, which simply calls other functions
    to accomplish its task. This part of design is easy, because you simply think
    of'
