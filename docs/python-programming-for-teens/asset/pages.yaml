    \ 180 by a random number between –0.5 and 0.5 to produce a random number between\
    \ –90 and 90. The expression int((random.random() - .5) * 100) produces a random\
    \ integer between –50 and 50.\n\nNote also that the main function allows you to\
    \ adjust the number of iterations and the number of turtles on different runs\
    \ of the program.\n\n# A New Class: RegularPolygon\n\nJust as you can define new\
    \ functions when the built-in functions won’t do, you can define new classes when\
    \ the need arises. Classes can represent almost any types of objects you can think\
    \ of, such as geometric shapes, houses, books, or living things. All you need\
    \ to think of when you model a type of object with a class is the set of attributes\
    \ it needs and the behavior it exhibits. In the next two sections, you develop\
    \ two new classes: a regular polygon class and a menu item class.\n\nYou can draw\
    \ regular polygons rather nicely with the function developed earlier, but you\
    \ can also think of regular polygons as objects in their own right. They may have\
    \ other attributes and behavior than their length and their capacity to draw themselves.\
    \ A regular polygon can be filled or not, can have two colors (a fill and an outline),\
    \ and can have an area and a perimeter. A regular polygon also has a position\
    \ and a heading in the turtle graphics coordinate system and can be hidden or\
    \ shown. Finally, a regular polygon can"
