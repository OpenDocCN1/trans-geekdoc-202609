    keys, values, and key/value pairs, respectively. Like other data structures, a
    dictionary is created when it’s mentioned as a literal, or when you run the dict
    function with the appropriate argument—in this case, a list of tuples. The len
    function returns the number of keys in a dictionary, but the + operator is undefined.


    There are two basic access operations. One operation just places a target key
