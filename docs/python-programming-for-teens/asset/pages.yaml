- pgno: 70
  md: 'Note that the string returned is the pathname of the Documents folder on my
    computer. If I put the file for the shape in that folder, Python can locate it
    with just the file’s name.


    You can also create your own shapes for the turtle with Python’s shape and poly
    functions. Check the documentation for details.


    # The Speed


    You can see the turtle move when it draws a line. If the turtle moves too slowly,
    you might get impatient with it, but if it moves too quickly, you might not be
    able to observe its movement. The function speed allows you to set the turtle’s
    speed to your satisfaction. The argument to speed can be either an integer or
    a string. The integers range from 0 to 10, with 0 being the fastest speed. The
    other integers decrease the speed, from 10 down to 1. The turtle’s initial speed
    is 3. Table 2.4 lists the available strings for speeds and the corresponding integers.
    As usual, calling the function with no argument returns the current speed.


    Table 2.4 Turtle Speed Values as Strings and Integers


    | String | Integer |

    |---|---|

    | "fastest" | 0 |

    | "fast" | 10 |

    | "normal" | 6 |

    | "slow" | 3 |

    | "slowest" | 1 |


    # Other Information About the Turtle’s State


    As you have seen, when you call the functions pensize, shape, and speed without
    arguments, these functions return the current values of these settings. You can
    obtain information about any aspect of the turtle’s state by calling the appropriate
    function. For instance, try calling the functions position, heading, isdown, and
    isvisible. You will use this information in turtle graphics applications later
    in this book.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# WORKING WITH COLORS


    Color monitors support the display of bright and beautiful drawings and images.
    Although the turtle’s initial color is black and the color of the canvas is white,
    you can reset these colors to any color that your system supports.


    # The Pen Color and the Background Color


    The easiest way to change the pen’s color is to call the `pencolor` function with
    a string argument. Example strings are the names of common colors, such as "red"
    or "green". You can change the color of the canvas by calling the `bgcolor` function
    in a similar manner. Figure 2.9 shows a white square drawn on a black background
    after changing the initial pen and background colors.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_71_0.png)


    Figure 2.9

    Drawing with a white pen on a black background.

    © 2014 Python Software Foundation.


    Note that when you change the pen color, the turtle’s shape also assumes that
    color.


    Millions of other colors are available on modern computer systems. To use these,
    you need to learn how computers represent colors.


    # How Computers Represent Colors


    All data used in computers are ultimately represented as numbers. Integers and
    floating-point numbers are obvious examples. The characters contained in strings
    translate to integer values that are stored and manipulated within the computer.
    Colors are no different. Each of the shades of the basic colors that you see,
    and all the mixtures thereof, must be'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'translated by input devices such as scanners and cameras to numbers before
    you can store and process them. Before colors are displayed on a monitor, the
    computer must translate these numbers back to the colors that you see.


    Among the various schemes for representing colors, the RGB system is a fairly
    common one. The letters stand for the color components of red, green, and blue,
    to which the human retina is sensitive. These components are mixed to form a unique
    color value. Naturally, the computer represents these values as integers. A color
    component can be any integer from 0 through 255. The value 255 represents the
    maximum intensity of a given color component, whereas the value 0 represents the
    total absence of that component. The RGB value (0, 0, 0) is black, and the RGB
    value (255, 255, 255) is white. Table 2.5 lists some example colors and their
    RGB values.


    Table 2.5 Some Colors and Their RGB Values


    | Color | RGB Value |

    |-------|-----------|

    | "black" | (0, 0, 0) |

    | "red" | (255, 0, 0) |

    | "green" | (0, 255, 0) |

    | "blue" | (0, 0, 255) |

    | "yellow" | (255, 255, 0) |

    | "gray" | (127, 127, 127) |

    | "white" | (255, 255, 255) |


    In Python, an RGB value is represented as the tuple (r, g, b). There are 256³
    or 16,777,216 distinct colors in this system—so many that the human eye cannot
    distinguish many of the adjacent values.


    To set the pen color or background color to an RGB value, you first have to set
    the turtle’s color mode to 255 by calling colormode(255). You then can call pencolor
    or bgcolor with three integer arguments or with a single tuple of three integers.
    For example, pencolor(127, 0, 0) sets the pen color to maroon.


    For more information on colors, consult PageTutor’s ColorPicker site, at www.pagetutor.com/colorpicker/index.html.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Filled Shapes


    Earlier you saw how to draw a square with the turtle. Suppose you want to draw
    not just the outline of a square, but a square filled with a given color. Turtle
    graphics allows you to do so by using the fillcolor, begin_fill, and end_fill
    functions.


    You begin by setting the fill color of the shape. The fillcolor function does
    this using a color argument, as discussed in the previous section. The initial
    fill color is black. Note that when you set the fill color, this color also fills
    the shape of the turtle.


    You then call the begin_fill function, followed by the commands that draw the
    square. Finally, you call the end_fill function, which tells turtle graphics to
    fill any fillable shapes drawn since the last call of begin_fill. The next session
    draws a filled square of length 70, with a black outline and a red interior. The
    result is shown in Figure 2.10 (color omitted, of course).


    ```

    >>> reset()

    >>> fillcolor("red")

    >>> begin_fill()

    >>> forward(70)

    >>> left(90)

    >>> forward(70)

    >>> left(90)

    >>> forward(70)

    >>> left(90)

    >>> forward(70)

    >>> left(90)

    >>> end_fill()

    ```


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_73_0.png)


    Figure 2.10

    Drawing a filled shape.

    © 2014 Python Software Foundation.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'The `color` function combines actions of the `pencolor` and `fillcolor` functions.
    Its first argument is the pen color, and its second argument is the fill color.
    When called with no arguments, `color` returns a tuple containing these two colors.
    Thus, the expression `color("blue", "red")` would set the pen color to blue and
    the fill color to red.


    Table 2.6 summarizes the functions related to colors in turtle graphics.


    Table 2.6 Functions Related to Colors


    | Function | What It Does |

    |---|---|

    | `bgcolor(color)` | Sets the color of the canvas to `color` |

    | `color(pColor, fColor)` | Sets the turtle’s pen color to `pColor` and its fill
    color to `fColor` |

    | `fillcolor(color)` | Sets the turtle’s fill color to `color` |

    | `pencolor(color)` | Sets the turtle’s pen color to `color` |

    | `begin_fill()` | Begins a sequence of commands to draw filled shapes |

    | `end_fill()` | Ends a sequence of commands to draw filled shapes |


    # DRAWING CIRCLES


    Turtle graphics provides just one built-in function that draws a shape. This function,
    named `circle`, expects the circle’s radius as an argument. Optional arguments
    include the `extent` (the portion of the circle to be drawn, in degrees) and the
    `steps` (the number of lines used to draw the circle’s circumference). You supply
    the `extent` argument when you want to draw an arc. Filling an arc requires you
    to connect the turtle’s starting and ending points.


    To get a feel for how the circle function works, run the following code in the
    shell:


    ```

    >>> from turtle import *

    >>> home()

    >>> circle(50)

    ```


    Note that the turtle starts by facing east at the home position, draws the circle
    by repeatedly moving forward and turning left, and finally returns to its original
    position and heading.


    Now consider how to draw a filled pie slice within this circle. The slice is a
    filled arc that occupies the lower-right quarter of the circle, as shown in Figure
    2.11.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/4dc3f6307b32ff815a6d58ec1c84708c_75_0.png)


    Figure 2.11

    Drawing a circle containing a filled arc.

    © 2014 Python Software Foundation.


    You start by running begin_fill to begin drawing a filled shape. To draw the arc,
    the turtle starts at the home position and draws a circle with a radius of 50
    and an extent of 90 degrees. The turtle then draws two line segments to close
    the arc, create the pie slice, and allow it to be filled. To do this, you move
    the turtle to position (0, 50), which is the center point of the circle, and then
    return it to the home position. Finally, you run end_fill to fill the new shape.
    Here is the code:


    ```

    >>> begin_fill()

    >>> circle(50, 90)

    >>> goto(0, 50)

    >>> home()

    >>> end_fill()

    ```


    The key to working with circles and arcs is to set the initial position and the
    heading of the turtle to get the results that you want. For example, suppose you
    want a half-moon shape whose center point is the origin, whose radius is 50, and
    whose flat side lies along the x-axis, as shown in Figure 2.12.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/4dc3f6307b32ff815a6d58ec1c84708c_76_0.png)


    Figure 2.12

    Drawing a half moon.

    © 2014 Python Software Foundation.


    The turtle starts drawing the circle from position (−50, 0), with the turtle’s
    heading at 270 degrees. Moving to that position from the home position draws half
    of the flat side of the arc. Then the turtle turns right 90 degrees. To draw the
    arc, the turtle draws the circle with an extent of 180 degrees. After drawing
    the arc, the turtle draws the other half of its flat side by returning home. Here
    is the code:


    ```

    >>> reset()

    >>> begin_fill()

    >>> goto(-50, 0)

    >>> right(90)

    >>> circle(50, 180)

    >>> home()

    >>> end_fill()

    >>> hideturtle()

    ```


    # DRAWING TEXT


    You draw text in the turtle’s window by calling the write function. The required
    argument is a string. Optional arguments direct the turtle to move during the
    drawing, align the text to the left, center, or right of the turtle’s initial
    position, and use a text font that you supply. The following code fragments show
    two ways to draw some text, with and without the optional arguments. The results
    are shown in Figure 2.13.'
