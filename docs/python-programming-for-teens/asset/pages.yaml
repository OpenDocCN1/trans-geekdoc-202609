- pgno: 191
  md: 'be translated (moved given x and y distances from its current position), scaled
    (have its size reduced or increased by a given factor), and rotated (turned left
    or right by a given angle). Although you can define functions to represent most
    of this behavior, it is much more convenient to bundle an object’s attributes
    and behavior in a class. You name this new class RegularPolygon and then begin
    its design.


    # Design: Determine the Attributes


    You begin by listing the attributes of a regular polygon and their default values
    (see Table 8.1). The attributes of an object are usually named with nouns (such
    as length) or adjectives (such as isVisible). The default values are ones these
    attributes have when a new polygon is created if the programmer creating it does
    not provide them. Typically, the programmer can override most of these defaults
    when a polygon is created.


    Table 8.1 The Attributes of Regular Polygons


    | Attribute | Default Value |

    |---|---|

    | turtle | A new turtle |

    | length | None; the programmer must provide it |

    | xPos | None; the programmer must provide it |

    | yPos | None; the programmer must provide it |

    | heading | None; the programmer must provide it |

    | sides | 3 |

    | outlineColor | "black" |

    | fillColor | "black" |

    | fillOn | False |

    | isVisible | True |


    Note that four of the attributes—the length, the coordinates of the polygon’s
    position, and the heading—have no defaults. This means that the programmer is
    required to provide her values when a new RegularPolygon object is created. Note
    also that the attributes include a turtle object, which is used to draw or hide
    the polygon in the turtle graphics window. The turtle object is created within
    the regular polygon object when it is created.'
