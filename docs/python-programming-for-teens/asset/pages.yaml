- pgno: 86
  md: "This design plan is expressed in pseudocode. Pseudocode cannot be run as actual\
    \ program code, but it is close enough to English and to Python that it can serve\
    \ as a blueprint for writing the equivalent Python code.\n\nNow you translate\
    \ this pseudocode design to Python code. The first statement in the body of the\
    \ loop expands to another loop to draw a hexagon. The entire design expands to\
    \ the following Python code:\n\n```\n>>> for count in range(10):\n    for count\
    \ in range(6):\n        forward(70)\n        left(60)\n    left(36)\n```\n\nIn\
    \ this code, the loop that draws the hexagon is nested with another loop. Note\
    \ how the indentation helps you and Python determine which statements belong in\
    \ the bodies of the two loops. When you enter this code into the shell, be careful\
    \ to press the Delete or Backspace key once after entering the line left(60) so\
    \ that the line left(36) aligns with the second line beginning with for. On each\
    \ pass through the outer loop, the inner loop is run first. When the inner loop\
    \ terminates, the turtle turns left 36 degrees before drawing the next hexagon.\n\
    \nYou can vary the pattern drawn in the turtle graphics window by changing the\
    \ number of iterations and the turtle’s rotation angle in the outer loop or by\
    \ changing the type of shape drawn by the inner loop. You are encouraged to experiment\
    \ with different combinations of these options.\n\n# How the range Function Works\
    \ with a for Loop\n\nIf you want to repeat a sequence of operations a given number\
    \ of times, the loop patterns just shown suffice. However, you might want to iterate\
    \ through a sequence of values and use each value for some purpose in the body\
    \ of the loop. For example, consider computing the sum total of the integers from\
    \ 1 through 10. The following code fragments accomplish this:\n\n```\n>>> total\
    \ = 0\n>>> for number in range(1, 11):\n    total = total + number\n\n>>> total\n\
    55\n```"
