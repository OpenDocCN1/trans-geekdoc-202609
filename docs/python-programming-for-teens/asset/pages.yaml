    Suppose you are working on a program that computes and uses the volume of a sphere.
    You are given the sphere’s radius of 4.2 inches. You first compute its volume
    using the formula 4/3πr³, with 3.1416 as your estimate of π. Here is the Python
    expression you might write for that:


    ```

    4 / 3 * 3.1416 * 4.2 ** 3

    ```'
