  md: "```\ndef __init__(self, value = False):\n    \"\"\"Sets the initial state.\"\
    \"\"\n    self._value = value\n\ndef value(self, newValue = None):\n    \"\"\"\
    Getter and setter.\"\"\"\n    if not newValue is None:\n        self._value =\
    \ newValue\n    return self._value\n```\n\nNow you can add a flag object to your\
    \ program to enable your changeColor and skip functions to communicate. You initialize\
    \ the variable, named clickFlag, above the function definitions. Because clickFlag\
    \ is a module variable, both functions can locate and change the flag. Its value\
    \ is initially False because no clicks have yet occurred.\n\nWhen changeColor\
    \ is called, it sets the value of clickFlag to True. When skip is called shortly\
    \ thereafter, it sees that the flag’s value is True and avoids moving the system\
    \ turtle. But skip resets the flag’s value to False because the next click event\
    \ might not be on a menu item.\n\nIf a click does not occur on a menu item, changeColor\
    \ is not called. In that case, the flag’s value is guaranteed to be False, so\
    \ skip moves the system turtle to the mouse coordinates.\n\nHere is the revised\
    \ code that uses the new flag object:\n\n```\nfrom flag import Flag\nclickFlag\
    \ = Flag()            # Create a global flag, initially False\n\ndef changeColor(c):\n\
    \    \"\"\"Changes the pen's color to c and sets clickFlag to True.\"\"\"\n  \
    \  clickFlag.value(True)      # Menu item selected, make flag True\n    color(c)\n\
    \ndef skip(x, y):\n    \"\"\"Moves the pen to the given location without drawing,\
    \ if a menu\n    item has not been clicked. Otherwise, sets clickFlag to False\"\
    \"\"\n    if not clickFlag.value():   # Menu item not selected, so ok to move\n\
    \        up()\n        goto(x, y)\n        down()\n    else:                 \
    \      # Menu item selected, so reset flag to False\n        clickFlag.value(False)\n\
    ```"
