- pgno: 99
  md: "insects, in their natural environment. Their movements might be determined\
    \ by the nearness of food or potential predators. Other movements might appear\
    \ to be quite random; they seem to just wander around.\n\nTo simulate this type\
    \ of random movement, you can make the turtle take a *random walk*. One way to\
    \ do this is to move the turtle a random distance and then turn a random number\
    \ of degrees to the left or right. You repeat this process a given number of times.\
    \ You use Python’s function `random.randint` to obtain a random integer within\
    \ a given range. The following shell session produces the random walk shown in\
    \ Figure 3.5.\n\n```\n>>> from random import randint\n>>> reset()\n>>> for count\
    \ in range(30):\n    distance = randint(10, 60)\n    forward(distance)\n    degrees\
    \ = randint(45, 135)\n    if randint(1, 2) == 1:\n        left(degrees)\n    else:\n\
    \        right(degrees)\n```\n\n![](img/4dc3f6307b32ff815a6d58ec1c84708c_99_0.png)\n\
    \nFigure 3.5\nA random walk.\n© 2014 Python Software Foundation.\n\nNote that\
    \ the turtle might walk beneath the edge of the window for a bit and then return\
    \ to the visible area of the canvas."
