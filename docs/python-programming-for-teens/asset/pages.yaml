  md: "# USING MODULE VARIABLES\n\nIn the programs you have written thus far, you\
    \ have used variables to track various kinds of information, such as a pen color\
    \ input by the user or the coordinates of a point that are the arguments in a\
    \ function definition. When you manipulated these variables, either to use their\
    \ values or to reset them, you usually did so within the body of a function definition.\
    \ For example, you used variables to receive inputs in the main function or to\
    \ access arguments in the skip function. Variables of this sort are considered\
    \ to be local to that function, meaning that their values are accessible only\
    \ within the body of that function and not outside of it (either in another function\
    \ or in the surrounding module).\n\nLocal variables may be of no help when you\
    \ need to track information that several functions should know about. For example,\
    \ the functions that respond to mouse events know the turtle’s current position,\
    \ but not its previous one. In this section, you examine the use of another kind\
    \ of variable, called a module variable, which allows you to share this information\
    \ among different functions.\n\n# Initializing and Using Module Variables\n\n\
    You have seen several module variables in your turtle graphics programs thus far—the\
    \ variables __main__ and msg in the if statement at the end of each program. The\
    \ variables math.pi and sys.argv are also module variables, although they belong\
    \ to another module that your program module imports. The math module assigns\
    \ the variable pi its value. Python automatically assigns __main__ and sys.argv\
    \ their values when a program is run. Your program assigns msg its value. Each\
    \ name is a module variable because it is assigned a value outside the bodies\
    \ of any function definitions.\n\nAfter a module variable has been assigned a\
    \ value, you can access this value anywhere within the module, including within\
    \ the bodies of function definitions. The next short Python program demonstrates\
    \ the introduction and use of another module variable for π:\n\n```\n'''\nmodulevariables.py\n\
    '''\n\nPI = 3.14        # Module variable (instead of math.pi)\n\ndef area(radius):\n\
    \    return PI * radius ** 2\n\ndef volume(radius):\n    return 4 / 3 + PI * radius\
    \ ** 3\n\ndef main():\n    radius = 4.5\n    print(\"PI:\", PI)\n```"
