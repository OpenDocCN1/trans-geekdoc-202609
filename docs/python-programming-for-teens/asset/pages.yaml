- pgno: 67
  md: '![](img/4dc3f6307b32ff815a6d58ec1c84708c_67_0.png)


    Figure 2.7

    A failed attempt to draw an equilateral triangle.

    © 2014 Python Software Foundation.


    This is a good example of a logic or design error. You meant to create an interior
    angle of 60 degrees by turning left 60 degrees, but you got an interior angle
    of 120 degrees instead. To get the correct result, you need to turn further, exactly
    120 degrees, each time. Recall that drawing a square requires four left turns
    of 90 degrees each, or 360 total degrees. The total number of degrees turned by
    the turtle in its circuit for an equilateral triangle is also 360 degrees (3 turns
    of 120 degrees each). You will use this fact about turtle geometry to draw some
    other geometric shapes in the exercises.


    # Undoing, Clearing, and Resetting


    When you edit a file of text, the Edit menu typically offers an Undo Typing option.
    When you select this option, the editor deletes the word or phrase that you most
    recently entered. In a similar fashion, turtle graphics keeps track of all the
    commands that you enter and allows you to undo the most recent command by calling
    the `undo` function. Thus, instead of clearing the canvas, you can back up just
    a bit if you don’t like the results by entering one or more `undo` commands.


    If you don’t like the results at all, or you just want to clear a drawing and
    start over, you can call `clear` or `reset`. Both functions erase all the drawings
    on the canvas. However, `clear` leaves all the turtle’s current settings alone
    (position, heading, color, and pen size), whereas `reset` restores the turtle’s
    initial settings.'
