- pgno: 83
  md: '# CHAPTER 3


    # CONTROL STRUCTURES:

    SEQUENCING, ITERATION,

    AND SELECTION


    In the previous chapter, you learned how to draw some simple geometric shapes,
    such as squares and triangles, using basic turtle graphics operations. Each basic
    operation models what you would do when drawing these shapes with pencil and paper;
    for example, turn left 90 degrees, and then move forward 70 units. When you entered
    a sequence of such operations in the Python shell, you were actually writing a
    computer program.


    Many programs consist of simple sequences of operations that instruct the computer
    to perform one task after another, until the overall task is completed and a problem
    is solved. However, there are two reasons why moving forward through a simple
    sequence of operations is not sufficient to solve some problems:


    +   1. The type of operation to perform might depend on some aspect of the current
    situation in the computer’s world. For example, if you enter a bad password, the
    program must detect this and respond with an error message; otherwise, the program
    can go ahead and log you in for the requested service. This type of control, in
    which a choice of operations is based on a condition, is called selection.

    +   2. You might need to perform a sequence of operations several times. For example,
    if you enter an incorrect password three times, the program might block further
    attempts until you contact the service by phone. This type of control, in which
    the same sequence of operations is repeated, is called iteration.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_83_0.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: "It turns out that sequencing, selection, and iteration are the only types of\
    \ control structures really needed to solve any problem with a computer program.\
    \ In this chapter, you return to the Python shell to experiment with these control\
    \ structures.\n\n# REPEATING A SEQUENCE OF STATEMENTS: ITERATION\n\nThe simplest\
    \ form of control structure iterates or repeats a given sequence of operations\
    \ a fixed number of times. This structure, called a definite loop, is examined\
    \ first. You will see examples of indefinite loops, which incorporate a selection\
    \ component, later in this chapter.\n\n# The for Loop\n\nWhen you drew a square\
    \ in the last chapter, you actually entered the two expressions\n\n```\n>>> forward(70)\n\
    >>> left(90)\n```\n\na total of four times. Wouldn’t it be nice if you could just\
    \ tell Python to repeat these two operations four times, instead of writing them\
    \ four times yourself?\n\nPython provides a control structure called a for loop\
    \ for just this purpose. Now start up turtle graphics and enter this statement\
    \ into the shell. (Remember that the >>> symbol is the shell prompt, not part\
    \ of your code.)\n\n```\n>>> for count in range(4):\n    forward(70)\n    left(90)\n\
    \n>>>\n```\n\nNote that the sequence of two drawing operations appears just once\
    \ and is indented in the body of the loop structure. The indentation is significant,\
    \ in that it tells Python (and you, the reader) which statements belong to the\
    \ sequence to be repeated. You end this sequence and the loop by pressing the\
    \ Return or Enter key twice.\n\nThe heading of the loop structure, for count in\
    \ range(4):, is Python’s way of saying, “repeat the following sequence of operations\
    \ four times.” Note that Python automatically indents each statement in the sequence\
    \ of statements after the loop heading.\n\nNow compose a loop that draws a triangle.\
    \ Actually, you don’t have to rewrite all the code; just place the cursor at the\
    \ end of the last expression in the previous loop and press Enter. This copies\
    \ and pastes the code after the next shell prompt. Which parts of"
  merge: -1
  img_proc: true
- pgno: 85
  md: "the code do you still have to edit to draw a triangle? Assuming that the length\
    \ of a side doesn’t change, you need three sides and three left turns of 120 degrees\
    \ each. When you make these changes to the code and press Enter twice, you should\
    \ see your triangle within the square.\n\nNow use the same loop structure again\
    \ to draw a pentagon, a hexagon, and an octagon. The result should look like your\
    \ solution to Exercise 1.2 in Chapter 1, “Getting Started with Python,” but your\
    \ code is much easier to write.\n\nThe real power of a for loop is that it allows\
    \ you to write a short sequence of statements and then repeat it any number of\
    \ times that you like.\n\n# Nested Loops\n\nSuppose that you want to draw several\
    \ hexagons of the same length in different positions or orientations. For example,\
    \ you might want to rotate 10 hexagons around the origin to produce the pattern\
    \ shown in Figure 3.1.\n\n![](img/4dc3f6307b32ff815a6d58ec1c84708c_85_0.png)\n\
    \nFigure 3.1\nUsing 10 hexagons to produce a pattern.\n© 2014 Python Software\
    \ Foundation.\n\nYou already know how to use a loop to draw a single hexagon.\
    \ Now you want to repeat that process 10 times and adjust the heading of the turtle\
    \ by 36 degrees after each hexagon is drawn. Here is a design plan for the complete\
    \ process:\n\n```\nRepeat 10 times\n    Draw a hexagon\n    Turn left 36 degrees\n\
    ```"
  merge: -1
