  md: "Here is the code for the complete definition of the TicTacToeSquare class:\n\
    \n```\n```python\n\"\"\"\nFile: tictactoesquare.py\nDefines the TicTacToeSquare\
    \ class.\n\"\"\"\n\nfrom turtle import Turtle\n\nclass TicTacToeSquare(Turtle):\n\
    \    \"\"\"Represents a Tic-Tac-Toe square.\"\"\"\n\n    FONT = (\"Arial\", 12,\
    \ \"bold\")\n\n    def __init__(self, index, grid, length, xPos, yPos,\n     \
    \           outlineColor = \"black\", fillColor = \"white\", text = \"\"):\n \
    \       \"\"\"Sets the initial state of the Tic-Tac-Toe square.\"\"\"\n      \
    \  Turtle.__init__(self, shape = \"square\", visible = False)\n        self.speed(0)\n\
    \        self.color(outlineColor, fillColor)\n        self.up()\n        self.goto(xPos,\
    \ yPos)\n        self.resizemode(\"user\")\n        self.shapesize(length / 20,\
    \ length / 20)\n        self._text = text\n        self._index = index\n     \
    \   self._grid = grid\n        self.onclick(lambda x, y: self._grid.makeMove(self._index))\n\
    \        self.showturtle()\n\n    def text(self, text = None):\n        \"\"\"\
    Getter and setter for text.\"\"\"\n        if not text is None:\n            self._text\
    \ = text\n            self.write(text, align = \"center\", font = TicTacToeSquare.FONT)\n\
    \        return self._text\n```\n```\n\n# Using Class Variables\n\nThere is a\
    \ new type of variable in the TicTacToeSquare class that you have not seen before.\
    \ The variable FONT is initialized between the class header and the first method\
    \ definition. This makes it a class variable. Unlike an instance variable, which\
    \ always begins with the prefix self and refers to data that belong to a single\
    \ object, a class variable refers to data that the entire class of objects shares\
    \ in common. Because the letters in all the grid squares"
