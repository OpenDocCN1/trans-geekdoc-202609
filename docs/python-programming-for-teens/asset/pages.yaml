- pgno: 195
  md: "As always, you start the module’s text with a docstring that includes the filename\
    \ and the purpose of the module. You then list any imports for this module. Here\
    \ is an example for the regularpolygon module:\n\n```\n```\n\"\"\"\nFile: regularpolygon.py\n\
    Defines a RegularPolygon class.\n\"\"\"\n```\n```\n\n```\nfrom turtle import Turtle,\
    \ bgcolor\n```\n\nNote that you do not import all the resources from the turtle\
    \ module using the statement from turtle import *. Instead, you import only those\
    \ classes and functions that you need for the module under construction. This\
    \ tactic helps to prevent errors that might result from calls to functions that\
    \ you really don’t need.\n\nThe class definition follows. Its form is\n\n```\n\
    class ClassName(ParentClassName):\n    methodDefinitions\n```\n\nThis form is\
    \ similar to that of a function definition, in which you have a header followed\
    \ by an indented body of code. But in this case, the indented body of code is\
    \ a series of method definitions.\n\nProgrammer-defined class names are usually\
    \ capitalized, so you can pick them out from variable and method names. For this\
    \ class, the ParentClassName in parentheses should be object. Here is the code\
    \ for the header of the RegularPolygon class and its docstring:\n\n```\nclass\
    \ RegularPolygon(object):\n    \"\"\"Represents a regular polygon.\"\"\"\n```\n\
    \nThe method definitions are listed one after the other, as you did with function\
    \ definitions earlier. But note that they must be indented one tab or four spaces\
    \ to the right of the class header (the line that begins with class).\n\nThe form\
    \ of a method definition is similar to that of a function definition:\n\n```\n\
    def methodName(self, otherArguments):\n    statements\n```\n\nThere is one critical\
    \ difference, however. The first argument in a method definition must always be\
    \ self. This word refers to the particular object on which the method is called.\
    \ You then use self to locate this object within the body of the method. Note\
    \ that self only appears as an argument in a method definition; it is omitted\
    \ from the argument list when the method is called."
  merge: -1
  img_proc: true
- pgno: 196
  md: "# Implementation: The __init__ Method\n\nThe first method to define in a class\
    \ is a special method named __init__. Note the underscores at the beginning and\
    \ end of this name. This method is responsible for initializing an object’s data\
    \ when the programmer creates that object. Thus, when the programmer makes the\
    \ call\n\n```\nRegularPolygon(length = 50, xPos = 80, yPos = 80, sides = 6,\n\
    \    outlineColor = \"red\", fillOn = True)\n```\n\nPython automatically runs\
    \ the method __init__, as defined in the RegularPolygon class. This method assigns\
    \ any supplied arguments or their defaults to the appropriate data variables within\
    \ the object and automatically returns a new, initialized regular polygon object\
    \ to the caller.\n\nThe data variables that hold the values of an object’s attributes\
    \ are also called instance variables. To pick these out from argument names and\
    \ temporary variables, instance variable names always begin with the prefix self\
    \ and by convention use a leading underscore. Otherwise, the code for the __init__\
    \ method is much like the code for any function definition that you have seen,\
    \ although you do not provide a return statement in this method. Here is the code:\n\
    \n```\ndef __init__(self, length, xPos, yPos, heading, sides = 3,\n    outlineColor\
    \ = \"black\", fillColor = \"black\",\n    fillOn = False, isVisible = True):\n\
    \    \"\"\"Sets the initial state of the polygon.\"\"\"\n    self._turtle = Turtle(visible\
    \ = False)  # Always hide the turtle\n    self._turtle.speed(0)\n    self._length\
    \ = length\n    self._xPos = xPos\n    self._yPos = yPos\n    self._heading =\
    \ heading\n    self._sides = sides\n    self._outlineColor = outlineColor\n  \
    \  self._fillColor = fillColor\n    self._fillOn = fillOn\n    self._isVisible\
    \ = isVisible\n    if isVisible:          # Display the polygon if it's\n    \
    \    self.show()        # visible\n```\n\nAs you can see, when you run the RegularPolygon\
    \ function, you get a distinct polygon object that contains its own data values;\
    \ that’s what the __init__ method does for each one."
  merge: -1
  img_proc: true
- pgno: 197
  md: "# Implementation: Showing and Hiding\n\nThe next most important methods are\
    \ the `show` and `hide` methods. These methods display a polygon or hide it in\
    \ the turtle graphics window. Showing the polygon is straightforward: you use\
    \ the code from the `regularPolygon` function developed earlier, with an adjustment\
    \ for filling the polygon if its `fillOn` attribute is True. Hiding the polygon\
    \ means erasing it from the turtle graphics window. You can accomplish this by\
    \ drawing the polygon in the window's background color. Each of these methods\
    \ also adjusts the `isVisible` attribute to the appropriate value.\n\nBecause\
    \ both the `show` and `hide` methods draw the polygon, it is useful to develop\
    \ an auxiliary method just for drawing. You name this method `_draw`; the leading\
    \ underscore indicates that it's a helper method that is not called by other users\
    \ of this class. Here is the code for this method:\n\n```\ndef _draw(self):\n\
    \    \"\"\"Draws a regular polygon with the given turtle,\n    length and number\
    \ of sides.\"\"\"\n    interiorAngle = 360 / self._sides\n    self._turtle.up()\n\
    \    self._turtle.setheading(self._heading)\n    self._turtle.color(self.outlineColor(),\
    \ self.fillColor())\n    self._turtle.goto(self._xPos, self._yPos)\n    self._turtle.down()\n\
    \    if self.fillOn():\n        self._turtle.begin_fill()\n    for count in range(self._sides):\n\
    \        self._turtle.forward(self._length)\n        self._turtle.left(interiorAngle)\n\
    \    if self.fillOn():\n        self._turtle.end_fill()\n```\n\nNote that you\
    \ must set the turtle's heading and colors and move it to its position before\
    \ beginning to draw. The `_draw` method then checks the polygon's `fillOn` attribute\
    \ and, if it's True, calls `begin_fill` on the turtle object. After the drawing\
    \ loop finishes, the method checks `fillOn` again to end the fill if necessary.\n\
    \nThe `show` method is pretty simple by comparison. Here is the code:\n\n```\n\
    def show(self):\n    \"\"\"Displays the polygon.\"\"\"\n    self._draw()\n   \
    \ self._isVisible = True\n```"
  merge: -1
  img_proc: true
- pgno: 198
  md: "The hide method must set things up so that the _draw method works with an outline\
    \ color and a fill color that are the same as the current background color (the\
    \ color of the turtle graphics canvas). This erases the polygon. To accomplish\
    \ this, the hide method first saves the polygon’s outline and fill colors in temporary\
    \ variables so they can be restored after drawing the polygon (the polygon’s actual\
    \ colors don’t change, they’re simply hidden). The method then sets both color\
    \ attributes to the current background color and increases the turtle’s pen size\
    \ before calling _draw. Finally, after the polygon’s colors and the turtle’s pen\
    \ size are restored, its isVisible attribute is set to False. Here is the code:\n\
    \n```\ndef hide(self):\n    \"\"\"Erases the polygon.\"\"\"\n    oldOutline =\
    \ self.outlineColor()      # Save the current colors\n    oldFill = self.fillColor()\n\
    \    erasingColor = bgcolor()\n    self.__outlineColor = erasingColor   # Prepare\
    \ to erase\n    self.__fillColor = erasingColor\n    self.__turtle.pensize(3)\
    \             # Make sure outline goes away\n    self.__draw()\n    self.__outlineColor\
    \ = oldOutline     # Restore the current colors\n    self.__fillColor = oldFill\n\
    \    self.__turtle.pensize(1)\n    self.__isVisible = False\n```\n\n# Implementation:\
    \ Getting and Setting\n\nThree of the polygon methods allow you to either examine\
    \ or modify an attribute, depending on whether an argument is present. For example,\
    \ consider the outlineColor method. If this method’s argument is not supplied\
    \ when it is called, its value is None by default. In that case, you just return\
    \ the current outline color. But if it’s not None, the argument is present, and\
    \ the method should reset the outline color to the new value and redraw the polygon\
    \ if it’s visible. Here is the code for this method:\n\n```\ndef outlineColor(self,\
    \ value = None):\n    \"\"\"Getter and setter for the outline color.\"\"\"\n \
    \   if value:\n        self.__outlineColor = value\n        if self.isVisible():\n\
    \            self.show()\n    return self.__outlineColor\n```\n\nThe other two\
    \ methods have a similar structure and are left as exercises for you."
  merge: -1
