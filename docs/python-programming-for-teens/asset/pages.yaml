- pgno: 212
  md: "# Defining a Class for the Grid\n\nThe grid class is named TicTacToeGrid, and\
    \ it appears in the module tictactoe grid.py. This class is responsible for creating\
    \ the grid squares, laying them out in the window, and managing the game logic.\
    \ Here is the code for the imports and the class header:\n\n```\n```python\n\"\
    \"\"\nFile: tictactoe grid.py\nDefines the TicTacToeGrid class.\n\"\"\"\n\nfrom\
    \ tictactoesquare import TicTacToeSquare\nfrom turtle import goto, tracer, up,\
    \ update, write\nclass TicTacToeGrid(object):\n    \"\"\"Represents a Tic-Tac-Toe\
    \ grid.\"\"\"\n```\n```\n\nNote that you import just the functions you need from\
    \ the turtle module, not everything.\n\n# Laying Out the Grid\n\nThe two main\
    \ attributes of the grid are a list that contains the grid squares and a string\
    \ that represents the current player’s letter. The creator of a grid can specify\
    \ the size of a square, the position of the grid, the outline and fill colors\
    \ of the squares, and the current player’s letter. As usual, these attributes\
    \ are initialized in the __init__ method. This method also lays out the squares\
    \ in the grid. Here is the code for the __init__ method:\n\n```\n```python\ndef\
    \ __init__(self, length, xPos, yPos,\n            outlineColor=\"black\", fillColor=\"\
    white\",\n            letter=\"X\"):\n    \"\"\"Sets the initial state of the\
    \ Tic-Tac-Toe grid.\"\"\"\n    self._letter = letter\n    self._grid = list()\n\
    \    index = 0\n    y = yPos\n    tracer(False)\n    for row in range(3):\n  \
    \      x = xPos\n        for column in range(3):\n            square = TicTacToeSquare(index,\
    \ self, length, x, y,\n                                    outlineColor, fillColor)\n\
    \            self._grid.append(square)\n            x += length\n            index\
    \ += 1\n        y -= length\n    update()\n    tracer(True)\n```\n```"
