  md: "turns left and moves forward by small increments until it completes a circuit.\
    \ Now you can schedule these actions with a timer.\n\nIn the first experiment,\
    \ you instruct the turtle to turn left and move forward, after a delay of a given\
    \ number of milliseconds. You then repeat this process, forever. The turtle appears\
    \ to rotate in a circular pattern (without drawing the circle). To quit the program,\
    \ you click the mouse in the turtle graphics window.\n\nHere is the code for this\
    \ program, in the file animate1.py.\n\n```\n```python\n\"\"\"\nanimate1.py\nAnimates\
    \ the turtle using the ontimer function.\n\"\"\"\n\nfrom turtle import *\n\ndef\
    \ act():\n    \"\"\"Move forward and turn a bit, forever.\"\"\"\n    left(2)\n\
    \    forward(2)\n    ontimer(act, 1)\n\ndef main():\n    \"\"\"Start the timer\
    \ with the move function.\n    The user's click exits the program.\"\"\"\n   \
    \ reset()\n    shape(\"turtle\")\n    speed(0)\n    up()\n    exitonclick()  \
    \    # Quit the program when the user clicks the mouse\n    listen()\n    ontimer(act,\
    \ 1)\n    return \"Done!\"\n\nif __name__ == '__main__':\n    msg = main()\n \
    \   print(msg)\n    mainloop()\n```\n```\n\nThe act function turns the turtle\
    \ left, moves it forward, and calls ontimer with the act function and a delay\
    \ of 1 millisecond as arguments. This looks a bit like a recursive function, but\
    \ it's indirect—ontimer calls act, which calls ontimer again. This recursion is\
    \ also infinite, because there is no check for a base case condition and no return."
