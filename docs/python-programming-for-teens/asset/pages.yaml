- pgno: 49
  md: 'The insert method always inserts an item before the given index, after shifting
    some items to the right by one position. The pop method removes the item at the
    given index, before shifting some items to the left by one position. Note that
    when you omit the index, the pop method removes the last item in the list.


    Other list methods are content based, meaning that they are given or targeted
    at an item rather than a position in the list. For example, the append method
    adds a given item to the end of a list, whereas the remove method removes the
    first instance of a given item from a list. The following shell session demonstrates
    these operations:


    ```

    >>> fruits

    [''oranges'', ''bananas'', ''apples'']

    >>> fruits.append("grapes")

    >>> fruits

    [''oranges'', ''bananas'', ''apples'', ''grapes'']

    >>> fruits.remove("bananas")

    >>> fruits

    [''oranges'', ''apples'', ''grapes'']

    ```


    Note that the item given to the remove method must already be in the list.


    Although the items in a list are always ordered by position, they may not be in
    alphabetical order (if they are strings) or in ascending or descending order (if
    they are numbers). Rearranging list items into this kind of order is called sorting.
    Sorting is a complex process, but the list method sort makes that easy, as shown
    here:


    ```

    >>> fruits

    [''oranges'', ''peaches'', ''cherries'', ''apples'']

    >>> fruits.sort()

    >>> fruits

    [''apples'', ''cherries'', ''oranges'', ''peaches'']

    >>> grades

    [77, 100, 85, 92]

    >>> grades.sort()

    >>> grades

    [77, 85, 92, 100]

    >>> grades.reverse()

    >>> grades

    [100, 92, 85, 77]

    ```


    Note that the methods sort and reverse are used in sequence to place list items
    in descending order.'
