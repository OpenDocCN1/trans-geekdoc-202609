    \ exception, and the program crashes.\n\nThe key to avoiding such errors is to\
    \ warn the users of your function about the preconditions on its arguments. Remember\
    \ to include that information in docstrings!\n\n# Sequential Search of a List\n\
    \nBefore you explore the use of recursion in turtle graphics, you’ll explore the\
