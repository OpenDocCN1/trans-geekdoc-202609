- pgno: 211
  md: 'are displayed with the same font, it is not necessary to keep this font in
    a separate storage area belonging to each square. That’s why you put the font
    in a class variable, where all the squares can see it and use it. Because class
    variables usually behave like constants, you spell them in caps.


    Note also that the text method, which uses the FONT variable to write the text
    to the window, must use the class name as a prefix with this variable, as in TicTacToeSquare.FONT.


    # Stretching the Shape of a Turtle


    You decided to subclass the Turtle class rather than the Square class for TicTacToeSquare
    because grid squares can get more useful behavior from turtles than from squares.
    However, the turtle’s “square” shape is not automatically the same size as your
    grid square’s shape. You don’t want the turtle to have to draw a separate square
    to compensate for that; the square’s shape should be exactly the turtle’s shape
    in the window. More importantly, when the user clicks anywhere within the space
    of a square, the square/turtle should detect and respond to that click.


    To get the turtle’s shape to be the same size as the length of a square, you have
    to stretch the size of the turtle’s shape with the shapesize method. The two arguments
    you need in this context are the stretch width and the stretch height factors.
    For this application, each of these factors should be the length of the square
    divided by 20. Before running shapesize, you must run resizemode("user").


    # Making a Move


    One of the arguments to the __init__ method of TicTacToeSquare is its grid, and
    another is its index in that grid. The square needs this information to run the
    appropriate method when the user clicks in the square. The following three lines
    of code set up the callback function, which accomplishes this task:


    ```

    self.__index = index

    self.__grid = grid

    self.onclick(lambda x, y: self.__grid.makeMove(self.__index))

    ```


    When the user clicks in this square, the grid’s makeMove method is called with
    the square’s index as an argument. From there, it is the grid’s responsibility
    to make the move and update the window.


    You can now turn your attention to the grid class.'
