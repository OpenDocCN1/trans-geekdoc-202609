  md: '# Using Functions


    As you have seen, the arithmetic and assignment operations consist of an operator
    and one or more operands. Python also provides many other basic operations, which
    are packaged as functions. A function is like an operator but is referred to by
    a name rather than an operator symbol. When a function is evaluated or called,
    its operands are supplied to it in the form of arguments. For example, the Python
    function abs expects a number as its single argument and computes and returns
    that number’s absolute value. Thus, the function call abs(-34) returns 34.


    When a Python function is called, Python first evaluates its arguments. The resulting
    values are then passed to the function, which uses them to compute and return
    its value. Although the written form of a function call is slightly different,
    the process is no different from evaluating an expression with operands and operators.
    The form of a function call is as follows:


    ```

    functionName(argumentExpression-1, argumentExpression-2, ...)

    ```


    Function calls are expressions, and their arguments are expressions. For example,
    the arithmetic expression


    ```

    abs(length - width) + 2

    ```


    produces a result, as long as the variables length and width refer to numbers.


    Some Python functions allow for optional arguments as well as required arguments.
    For example, the Python function round expects one required argument: the number
    to be rounded. If that number is a floating-point number, the integer value nearest
    to it is returned. However, round can also be called with a second argument: an
    integer indicating the number of places of precision to use in the result. Thus,
    round(3.1416) returns 3, whereas round(3.1416, 3) returns 3.142.


    Generally, the number of arguments used with a function must match the number
    of its required arguments, unless it allows optional arguments. For functions
    provided by Python, the types of the arguments (such as numbers) used must also
    match the types of the arguments expected at each position in the sequence of
    arguments.


