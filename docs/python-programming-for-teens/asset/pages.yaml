    \ Functions and Loops\n\nBy now, you may have guessed that a recursive function\
    \ repeats a given process until a condition becomes False. If you think that sounds\
    \ like a loop, you’re right. In principle, you can rewrite any recursive function\
    \ as a loop, and you can rewrite any loop as a recursive function. The choice\
