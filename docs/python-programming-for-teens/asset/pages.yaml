- pgno: 125
  md: "# Testing Functions in a Program\n\nNow that you’ve seen how to define and\
    \ call your own functions, you need to know where to put them in Python code files.\
    \ One way is to write a short tester program. You compose this program in an Integrated\
    \ Development Environment (IDLE) file window, just as in Chapter 4. The structure\
    \ of a tester program now includes the definitions of your functions. Although\
    \ these definitions can appear in any order in the file, it’s common to place\
    \ them between the import section and the main function. The next code segment\
    \ shows a program that tests the functions you have defined thus far in this chapter.\n\
    \n```\n```\n\"\"\"\ntestsquare.py\nTester program for square and randomColor functions.\n\
    \"\"\"\n\nfrom turtle import *\nfrom random import randint\n\ndef square(length):\n\
    \    \"\"\"Draws a square with the given length.\"\"\"\n    for count in range(4):\n\
    \        forward(length)\n        left(90)\n\ndef randomColor():\n    \"\"\"Returns\
    \ a random RGB color.\"\"\"\n    return (randint(0, 255), randint(0, 255), randint(0,\
    \ 255))\n\ndef main():\n    \"\"\"Draws a radial pattern with 10 randomly colored\
    \ squares.\"\"\"\n    speed(0)\n    pensize(2)\n    colormode(255)\n    hideturtle()\n\
    \    for count in range(10):\n        pencolor(randomColor())\n        square(70)\n\
    \        left(36)\n    return \"Done!\"\n\nif __name__ == \"__main__\":\n    msg\
    \ = main()\n    print(msg)\n    mainloop()\n```\n```"
