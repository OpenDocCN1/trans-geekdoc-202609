- pgno: 124
  md: "# The return Statement\n\nThe square function defined earlier just draws a\
    \ square but does not return a value to its caller. The main function discussed\
    \ in Chapter 4 returns a string value, which is not very interesting. Many other\
    \ functions, such as Python’s math.sqrt function, expect one or more arguments\
    \ and compute and return a value.\n\nTo see how a function can return a value,\
    \ consider the creation of a random color. In the code examples so far, you have\
    \ seen that a random color is a tuple containing three random integers, each of\
    \ which is in the range from 0 to 255. You might create a random color in Python\
    \ with this code:\n\n```\nrandomColor = (randint(0, 255), randint(0, 255), randint(0,\
    \ 255))\n```\n\nHere you assign a color value of the appropriate form to the variable\
    \ randomColor. However, each time you need a new random color, you have to run\
    \ the same assignment statement (or a different one, if the variable’s name changes).\n\
    \nIt would be much more convenient if you could call a function named randomColor\
    \ and then use its value wherever you wanted. You would not have to rewrite or\
    \ copy and paste a line of complex code every time you wanted a random color.\
    \ Here is the definition of this function:\n\n```\ndef randomColor():\n    \"\"\
    \"Returns a random RGB color.\"\"\"\n    return (randint(0, 255), randint(0, 255),\
    \ randint(0, 255))\n```\n\nNote that this function expects no arguments and returns\
    \ a value. The return statement here includes the Python expression that creates\
    \ the color value. The next code fragment shows how you might use the function\
    \ randomColor to draw colored squares in the example pattern:\n\n```\nfor count\
    \ in range(10):\n    pencolor(randomColor())\n    square(70)\n    left(36)\n```\n\
    \nHere’s the form of the return statement:\n\n```\nreturn optionalExpression\n\
    ```\n\nYou can use a return statement to quit a function at any point, even within\
    \ a loop and even though the function does not return a value. When you omit the\
    \ expression from a return statement or omit the return statement entirely from\
    \ a function’s statements, that function automatically returns the Python value\
    \ None."
