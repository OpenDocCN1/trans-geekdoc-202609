- pgno: 162
  md: '+   - Optional arguments to `onscreenclick`, `onclick`, `ondrag`, and `onrelease`
    are the number of the button (1 = left, 2 = right) and a Boolean value indicating
    whether to add the new event-handling function or replace the existing ones.

    +   - The functions to register event-handling functions for keyboard events are
    `onkeypress` and `onkeyrelease` (a synonym for `onkey`). `onkeypress` expects
    a function and an optional string as arguments. `onkeyrelease` expects both a
    function and a string as arguments. The string represents a keyboard character.
    When the user presses or releases a registered key, the associated event-handling
    function is triggered. If the string argument to `onkeypress` is omitted, the
    function is triggered when any key is pressed.

    +   - After the event-handling functions have been registered, the `listen` function
    tells turtle graphics to listen for events.

    +   - A module variable is used to make data accessible to all the functions in
    a module. A module variable cannot be reset with an assignment statement within
    a function. However, if the variable refers to a mutable structure, like a list,
    that structure can be modified.


