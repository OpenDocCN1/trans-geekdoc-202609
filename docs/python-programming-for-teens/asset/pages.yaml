    you can manipulate them separately.


    If at any point you want to clear all the turtle’s drawings and return the turtle
    to its initial position and heading, you just call the reset function.


    When you start turtle graphics, the turtle’s pen is initially down on the canvas,
    ready to draw lines and shapes. You can pick the pen up and put it down by calling
    the up and down functions, respectively. When the pen is up, you can move the
    turtle without drawing anything.


    # Drawing a Square


    The basic turtle movement functions are listed in Table 2.2.


    **Table 2.2 Turtle Movement Functions**


    | Function | What It Does |

    |---|---|

    | `backward(distance)` | Moves the turtle the given distance in the opposite of
    its current direction |

    | `forward(distance)` | Moves the turtle the given distance in its current direction
    |

    | `goto(x, y)` | Moves the turtle to position (x, y) |

    | `home()` | Moves the turtle to position (0, 0) and sets its heading to 0 degrees
    |

    | `left(degrees)` | Turns the turtle counterclockwise by the given degrees |

    | `right(degrees)` | Turns the turtle clockwise by the given degrees |

    | `setheading(degrees)` | Sets the turtle’s heading to degrees |


    There are also several synonyms for these functions, which you can look up in
    the documentation. Note that the functions forward, backward, left, and right
    adjust the turtle’s position or heading relative to its current position or heading.
    By contrast, the functions goto, home, and setheading reset the turtle’s position
    or heading directly.


    To explore some of these operations, you’ll examine two ways to draw a square
    of length 70 with the turtle. Assume that the lower-left corner of this square
    is at the home position. The desired result is shown in Figure 2.5.'
