- pgno: 222
  md: '# Table 9.1 Optional Initial Arguments for AnimatedTurtle (Continued)


    | Keyword | Default Value |

    |---|---|

    | heading | 0 |

    | outlineColor | "black" |

    | fillColor | "black" |

    | timeInterval | 1 |

    | animated | True |

    | callback | lambda t: False |


    The behavior of an animated turtle is like that of a regular turtle, because the
    AnimatedTurtle class inherits all the Turtle methods. In addition, an animated
    turtle recognizes the methods described in Table 9.2.


    # Table 9.2 The AnimatedTurtle Methods


    | Method | What It Does |

    |---|---|

    | act() | If the turtle is animated, calls the callback function with the turtle
    as an argument, and then calls ontimer with the act method and the time interval
    as arguments. |

    | animated(flag = None) | Setter and getter for the turtle''s animated attribute.
    If flag is absent, the turtle''s animated state is returned. Otherwise, flag is
    either True or False, and this state is reset. |

    | callback(f = None) | Setter and getter for the callback attribute. If f is absent,
    the current callback function is returned. Otherwise, f is a function of one argument,
    and the callback attribute is set to this function. |

    | timeInterval(t = None) | Setter and getter for the timeInterval attribute. If
    t is absent, the current time interval is returned. Otherwise, t is a nonnegative
    number, and the time interval is reset. |'
