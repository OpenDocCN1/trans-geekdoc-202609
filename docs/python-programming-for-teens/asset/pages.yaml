    N-1, so the function is called recursively with these arguments.


    The second level N-1 c-curve uses the line segment (xm, ym), (x2, y2) and level
    N-1, so the function is called recursively with these arguments.


    For example, in a level-0 c-curve, let (x1, y1) be (50, -50) and (x2, y2) be (50,
    50). Then, to obtain a level-1 c-curve, use the formulas for computing xm and
