  md: '# Binary Search of a List


    Your sequential search function works as advertised, but it does not run as quickly
    as it could with the given list. A sequential search like this one has a *linear
    running time*, meaning that the amount of time it takes to run the search grows
    directly with the length of the list. For example, in the worst case, you must
    examine each item to determine that the target item "cherries" is not in the list.
    If the list contains 100 items, 100 recursive calls are required, and if the list
    grows in length by a factor of 10, so does the number of recursive calls.


    Why should a search perform better than that with this particular list? If you
    look closely, you see that the items in the list are strings in ascending order.
    If the items are guaranteed to be in sorted order, your search function can take
    advantage of this fact to reduce the search time considerably.


    The strategy for this type of search, called a *binary search*, is simple. You
    go to the midpoint of the list, instead of the first item, and compare the item
    at that position to the target item. If the two items are equal, you’re done.
    Otherwise, if the target item is less than the item at the midpoint, you continue
    the search in the part of the list to the left of the midpoint. Otherwise, the
    target must be greater than the item at the midpoint, so you search only the part
    of the list to the right of the midpoint.


    Instead of always searching the rest of the list to the right of the current position,
    as in sequential search, the binary search examines *either* the segment of the
    list to the right *or* the segment of the list to the left of the current position.
    Because the binary search function is recursive, you have to feed it arguments
    that tell it the leftmost and rightmost positions of the current list segment
    under examination.


    The only things left to determine are how to compute the midpoint, how to adjust
    the endpoints before the recursive calls, and how to determine when there are
    no more items left to examine. If you assume that `left` and `right` are the current
    endpoints of the list, the midpoint between them is always


    ```

    (left + right) // 2

    ```


    If the target item is less than the item at the midpoint, the new right endpoint
    becomes


    ```

    right = midpoint - 1

    ```


    If the target item is greater than the item at the midpoint, the new left endpoint
    becomes


    ```

    left = midpoint + 1

    ```


    As the search moves around in the list, the two endpoints `left` and `right` eventually
    converge toward a crossover point somewhere within the list. When they move past'
  merge: -1
  img_proc: true
- pgno: 174
  md: "each other, there are no more items to examine, and the target item is not\
    \ present. So, as long as\n\n```\nleft <= right\n```\n\nthe search must continue.\n\
    \nYour new version of the myIn function keeps its header and defines a recursive\
    \ helper function named binaryIn. This function takes the left and right endpoints\
    \ of the list as arguments. Their initial values are 0 and the length of the list\
    \ minus one, respectively. Here is the complete code for the new version of myIn:\n\
    \n```\ndef myIn(targetItem, lyst):\n    def binaryIn(left, right):\n        if\
    \ left <= right:\n            midPoint = (left + right) // 2\n            if lyst[midPoint]\
    \ == targetItem:\n                return True\n            elif targetItem < lyst[midPoint]:\n\
    \                return binaryIn(left, midpoint - 1)\n            else:\n    \
    \            return binaryIn(midPoint + 1, right)\n        else:\n           \
    \ return False\n    return binaryIn(0, len(lyst) - 1)\n```\n\nRecall that the\
    \ sequential search function must examine every item in the worst case, when the\
    \ target item is not present. Thus, in this case, if there are 16 items, the sequential\
    \ search function must make 16 recursive calls. Just how much faster is the binary\
    \ search function? The binary search discards half of the remaining list items\
    \ before each recursive call. So, how many recursive calls must be made before\
    \ you discover that a target item is not in a list? That number is equal to the\
    \ number of times that you can divide the length of the list by 2 before you reach\
    \ a list segment whose length is 0. For example, for a list of length 16, the\
    \ recursive calls examine list segments of lengths 8, 4, 2, 1, and 0. That’s a\
    \ maximum of 5 calls, whereas the sequential search requires a maximum of 16 calls.\
    \ Put mathematically, the binary search has a logarithmic running time (5 equals\
    \ 1 + log₂ of 16, where the log₂ of a number is the exponent used with 2 to obtain\
    \ that number). This means that the running time grows only logarithmically with\
    \ the size of the list. That is, when the size of the list doubles, the amount\
    \ of work that the binary search performs does not double, but increases by just\
    \ 1 recursive call!"
