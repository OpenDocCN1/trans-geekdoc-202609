    \ = (-(width / 2), width / 2)\n    (minY, maxY) = (-(height / 2), height / 2)\n\
    \    (x, y) = position()\n    return x > minX and y > minY and x < maxX and y\
    \ < maxY\n```\n```\n\nBefore you move on to the other functions, consider how\
    \ you might simplify the code of the atEdge function, while adding some other\
    \ potentially useful functions. The atEdge function determines whether the turtle\
    \ has crossed an edge. This will be True if the turtle crosses the top edge, the\
    \ bottom edge, the left edge, or the right edge. By expressing it in this way\
    \ and imagining that you have four new functions at your disposal, you can rewrite\
    \ the code for atEdge as follows:\n\n```\n```python\ndef atEdge():\n    \"\"\"\
    Returns True if the turtle is at an edge of the window,\n    or False otherwise.\"\
    \"\"\n    return atTopEdge() or atBottomEdge() or \\\n           atLeftEdge()\
    \ or atRightEdge()\n```\n```\n\nEach of the four new edge-detection functions\
    \ compares one of the turtle’s coordinates to a single boundary coordinate. For\
    \ instance, here is the code for the topEdge function:\n\n```\n```python\ndef\
    \ atTopEdge():\n    \"\"\"Returns True if the turtle is at the top edge of the\
    \ window,\n    or False otherwise.\"\"\"\n    return ycor() > window_height()\
