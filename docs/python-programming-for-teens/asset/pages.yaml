  md: '# ABOUT THE AUTHOR


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_5_0.png)


    **Kenneth A. Lambert** is a professor of computer science and the chair of that
    department at Washington and Lee University. He has taught introductory programming
    courses for 29 years and has been an active researcher in computer science education.
    Lambert has authored or coauthored 25 textbooks, including a series of introductory
    C++ textbooks with Douglas Nance and Thomas Naps, a series of introductory Java
    textbooks with Martin Osborne, and a series of introductory Python textbooks.
    His most recent textbook is *Fundamentals of Python: Data Structures.*'
