    **Table 1.2 The Precedence of Arithmetic Operators**


    | Operator | Precedence |

    |---|---|

    | - (unary negation) | 4 |

    | ** | 3 |

    | *, /, //, % | 2 |

    | +, - (binary subtraction) | 1 |


    The exponentiation operator ** is also right associative. This means that consecutive
    ** operators are evaluated from right to left. Thus, the expression 2 ** 3 **
    2 produces 512, whereas (2 ** 3) ** 2 produces 64.


    Finally, a note on style: although Python ignores spaces within arithmetic expressions,
    the use of spaces around each operator can make your code easy for you and other
    people to read. For example, compare


    ```

