- pgno: 101
  md: 'Because the distances and headings are random, and the user may alter the size
    of the window at runtime, the number of paths that the turtle takes on any given
    walk is unpredictable. That''s why you must use a `while` loop in this case.


    # SUMMARY


    +   - The basic control structures in programming are sequencing, selection, and
    iteration.

    +   - A sequence of statements consists of one statement written after another.
    The computer runs them in the order in which they appear.

    +   - A selection statement tests at least one condition. If the condition is
    `True`, the computer runs the sequence of statements. Otherwise, the computer
    skips this sequence and runs the code following it.

    +   - A one-way `if` statement contains one test of a condition, followed by a
    sequence of statements. A two-way `if` statement contains one test of a condition,
    followed by two alternative sequences of statements. A multiway `if` statement
    contains two or more tests of conditions, each of which is followed by an alternative
    sequence of statements.

    +   - The two Boolean values are `True` and `False`.

    +   - A condition is a Boolean expression. A Boolean expression returns `True`
    or `False`.

    +   - The comparison operators `==`, `!=`, `<`, `>`, `<=`, and `>=` can compare
    integers, floating-point numbers, or strings. Comparisons return `True` or `False`.

    +   - The logical operators `and`, `or`, and `not` take Boolean expressions as
    operands. Logical operations return `True` or `False`.

    +   - The rules for logical operations are described in truth tables.

    +   - A `for` loop is used to repeat a sequence of statements a definite number
    of times.

    +   - A `for` loop uses the `range` function to count through a sequence of integers.

    +   - A `for` loop can visit the characters in a string, the items in a list or
    tuple, and the keys in a dictionary.

    +   - A `while` loop is used to repeat a sequence of statements zero or more times.
    The loop is governed by the test of a condition, which must be `True` for the
    loop to continue running the sequence of statements.'
  merge: -1
  img_proc: true
