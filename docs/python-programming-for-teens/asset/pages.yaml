- pgno: 121
  md: '# CHAPTER 5


    # DEFINING FUNCTIONS


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_121_0.png)


    Thus far in this book, your Python programs have consisted of built-in operators,
    control statements, calls to built-in functions, and one programmer-defined function,
    main, introduced in the previous chapter.


    Strictly speaking, programmer-defined functions are not necessary. You can construct
    any program using only Python’s built-in operators, functions, and control statements.
    However, in any significant program, the resulting code would be extremely complex,
    difficult to verify, and almost impossible to maintain.


    The problem is that the human brain can wrap itself around just a few things at
    once. (Psychologists say three things comfortably, and at most seven.) People
    cope with complexity by developing a mechanism to simplify or hide it. This mechanism
    is called abstraction. Put most plainly, abstraction hides detail and thus allows
    a person to view many things as just one thing. You use abstractions to refer
    to the most common tasks in everyday life. For example, consider the expression
    “doing my laundry.” This expression is simple, but it refers to a multistep process
    that involves fetching dirty clothes from the hamper, separating them into whites
    and colors, loading them into the washer, transferring them to the dryer, and
    folding them and putting them into the dresser or closet. Indeed, without abstractions,
    most of your everyday activities would be impossible to discuss, plan, or carry
    out. Likewise, effective designers must invent useful abstractions to control
    complexity.


    Design is important in many fields. The architect who designs a building, the
    engineer who designs a bridge or a new automobile, and the politician, advertising
    executive, or military'
