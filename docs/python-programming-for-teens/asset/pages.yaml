    Note that you should call the listen function only after all the event-handling
    functions have been set, although in this case, there is only one of these.


    Turtle graphics includes another function, onclick, which registers a function
    to handle mouse clicks that occur within the boundaries of the turtle’s shape.
    You should experiment with the use of onclick in a session similar to the one
