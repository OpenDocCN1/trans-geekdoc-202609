- pgno: 100
  md: "A more interesting scenario has the turtle stopping when it encounters a piece\
    \ of food or an obstacle that it can’t get around. This type of process calls\
    \ for an indefinite loop that continues while such an encounter has not occurred.\
    \ The next shell session directs the turtle to move around until it encounters\
    \ one of the edges of its window. Figure 3.6 shows a result.\n\n```\n>>> reset()\n\
    >>> width = window_width()\n>>> height = window_height()\n>>> (minX, maxX) = (-(width\
    \ / 2), width / 2)\n>>> (minY, maxY) = (-(height / 2), height / 2)\n>>> (x, y)\
    \ = position()\n>>> while x > minX and y > minY and x < maxX and y < maxY:\n \
    \   distance = randint(10, 60)\n    forward(distance)\n    degrees = randint(45,\
    \ 135)\n    if randint(1, 2) == 1:\n        left(degrees)\n    else:\n       \
    \ right(degrees)\n    (x, y) = position()\n```\n\n![](img/4dc3f6307b32ff815a6d58ec1c84708c_100_0.png)\n\
    \nFigure 3.6\nA random walk to a boundary.\n© 2014 Python Software Foundation."
