  md: '# CHAPTER 2


    # GETTING STARTED WITH

    TURTLE GRAPHICS


    Python’s basic code elements allow you to manipulate numbers, text, and data structures
    such as lists and dictionaries. However, modern computers also make extensive
    use of graphics and allow you to interact with graphical images directly by moving
    a mouse or pointing device. In this chapter, you learn some basic Python graphics
    operations, using a subsystem called turtle graphics.


    # LOOKING AT THE TURTLE AND ITS WORLD


    Turtle graphics was developed with the Logo programming language in the late 1960s
    to teach programming to children. Turtle graphics allows you to simulate the movements
    of a turtle robot by moving an image around on a computer monitor. The turtle
    is equipped with a pen that can draw lines and shapes as it moves about.


    The turtle has a position in a two-dimensional coordinate system. In geometry,
    a two-dimensional coordinate system consists of a horizontal x-axis and a vertical
    y-axis, as shown in Figure 2.1.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_59_0.png)'
