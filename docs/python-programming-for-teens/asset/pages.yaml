  md: "Suppose the function receives a level of 3 on its top-level call. A level-3\
    \ drawing consists of two rectangles, each of which is a level-2 drawing. Each\
    \ of these, in turn, consists of two rectangles, each of which is a level-1 drawing.\
    \ A level-1 drawing is a simple rectangle containing no smaller rectangles.\n\n\
    The main point here is that you use the same mondrian function to create all these\
    \ drawings, as long as their levels are greater than or equal to 1. Each one is\
    \ drawn on either the top-level call or a recursive call of mondrian.\n\nWhen\
    \ does the recursion stop? When the level becomes 0. In that case, the function\
    \ simply returns and does nothing. Here is a pseudocode design for this recursive\
    \ process:\n\n```\nFunction mondrian(x1, y1, x2, y2, level)\n    If level > 0\n\
    \        Call drawRectangle(x1, y1, x2, y2)\n        Compute the corner points\
    \ of two smaller rectangles\n        Call mondrian with one set of corner points\
    \ and level - 1\n        Call mondrian with the other set of corner points and\
    \ level - 1\n```\n\nAs you can see, because the level decreases by 1 on each recursive\
    \ call, it will eventually reach 0, and the recursion will stop.\n\nThe most complicated\
    \ part of the mondrian function is the computation of the corner points of the\
    \ two new rectangles. There are many options here. The simplest strategy would\
    \ be to locate the corner points of the two rectangles given by a vertical line\
    \ through the middle of the current rectangle. However, if you do this every time,\
    \ you'll see a boring series of evenly spaced vertical lines in the drawing.\n\
    \nA better alternative is to subdivide the current rectangle either vertically\
    \ or horizontally, with equal probability. In addition, you can split the current\
    \ rectangle into unequal areas, perhaps using fractions of 1/3 and 2/3 of the\
    \ current rectangle’s size.\n\nThe following Python code for the mondrian function\
    \ uses this strategy. You will have an opportunity to refine it in the exercises.\n\
    \n```\ndef mondrian(x1, y1, x2, y2, level):\n    \"\"\"Draws a Mondrian-like painting\
