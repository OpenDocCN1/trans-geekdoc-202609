    \ Iteration, and Selection,” with the square function:\n\n```\nfor count in range(10):\n\
    \    square(70)\n    left(36)\n```\n\nYou can define similar functions to draw\
    \ other geometric shapes, such as hexagons and octagons, as you will see in the\
    \ exercises.\n\nThe simplest form of a Python function definition is\n\n```\n\
    def functionName(arguments):\n    statements\n```\n\nwhere arguments is a series\
    \ of names separated by commas. Note that each statement in statements must be\
    \ indented below the function’s heading.\n\n# Docstrings\n\nIn Chapter 4, you\
    \ saw how a docstring, the quoted text at the top of a program or module file,\
    \ describes the purpose of that program or module. As you define new functions\
    \ to solve problems, you should also document them with docstrings. As shown in\
    \ your definition of the square function, the docstring appears on a line between\
    \ the function heading and the body of the function. Note that you must indent\
    \ this string to the same column as the statements within the function. When used\
    \ in a function definition, a docstring should state what the function does, describe\
    \ the roles of any arguments, and describe the value, if there is one, that the\
    \ function returns.\n\nAs mentioned in Chapter 4, docstrings allow Python to provide\
    \ help to the programmer from the shell. When you import a function’s module,\
    \ you can get help on the function by entering help(moduleName.functionName) at\
    \ a shell prompt.\n\nAlways write the doctring before you write the function’s\
    \ code. This practice helps you clarify what the function does and what roles\
    \ its arguments play. It also gives the callers of your function, who might be\
    \ other programmers, valuable information about the use of a resource that you\
    \ are providing."
