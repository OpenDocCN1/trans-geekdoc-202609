- pgno: 193
  md: "| Method | Description |\n|---|---|\n| fillColor(value = None) | If value (a\
    \ color) is provided, resets the fillColor attribute to this value and redraws\
    \ the polygon if it's visible. Returns its current value. |\n| isVisible() | Returns\
    \ True if the polygon is shown, or False if it's hidden. |\n| position() | Returns\
    \ a tuple (x, y) representing the coordinates of the current position. |\n| heading()\
    \ | Returns the current heading in degrees. |\n| translate(xDist, yDist) | Moves\
    \ the polygon the given distance and redraws it if it's visible. |\n| scale(factor)\
    \ | Grows or shrinks the polygon by the given factor and redraws it if it's visible.\
    \ |\n| rotate(degrees) | Rotates the polygon by the given degrees and redraws\
    \ it if it's visible. Positive degrees rotate to the left, and negative degrees\
    \ rotate to the right. |\n\nNote that the methods fillOn, outlineColor, and fillColor\
    \ work in a similar manner to some of the turtle methods. That is, when you supply\
    \ no argument, the method returns the value of the current setting; when you supply\
    \ an argument, the method uses it to establish a new setting and redraws the polygon\
    \ if it's visible.\n\nThe next session shows some of these methods in action with\
    \ a hexagon. The RegularPolygon class is located in a new module named regularpolygon.\n\
    \n```\n>>> from regularpolygon import RegularPolygon\n>>> hexagon = RegularPolygon(length\
    \ = 50, xPos = 80, yPos = 80, sides = 6,\n    outlineColor = \"red\", fillOn =\
    \ True)\n>>> hexagon.translate(100, 0)      # Move 100 pixels to the right\n>>>\
    \ hexagon.scale(1.5)             # Increase the size by half\n>>> hexagon.rotate(45)\
    \             # Spin 45 degrees to the left\n>>> hexagon.outlineColor()\n\"red\"\
    \n>>> hexagon.outlineColor(\"blue\")  # Redraw outline in blue\n```\n\nWhen each\
    \ of these methods runs, you should see a change in the turtle graphics window,\
    \ according to the rules of behavior specified in Table 8.2."
