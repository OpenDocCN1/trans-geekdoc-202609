    \ recent call last):\n  File \"<pyshell#5>\", line 1, in <module>\n    fruits.index(\"\
    cherries\")\nValueError: 'cherries' is not in list\n>>>\n```\n\nBoth operations\
    \ perform a *sequential search*. This means that the search starts with the first\
    \ item in the list, compares it to the target item, and continues from there through\
    \ consecutive positions until the target is located or the end of the list is\
