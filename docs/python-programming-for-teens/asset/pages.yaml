    You can draw an N-level c-curve with a recursive function. The function receives
    the endpoints of a line segment and the current level as arguments. At level 0,
    the function draws a simple line segment. Otherwise, a level N c-curve consists
    of two level N-1 c-curves, constructed as follows:


    ```

    Let xm be (x1 + x2 + y1 - y2) // 2

    Let ym be (x2 + y1 + y2 - x1) // 2

    ```


