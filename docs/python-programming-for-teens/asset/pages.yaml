- pgno: 200
  md: "(but without the number of sides) along with any of the other arguments that\
    \ you need or may supply for any other type of polygon. Here is an example:\n\n\
    ```\nsquare = Square(length = 70, xPos = 0, yPos = 0, heading = 45,\n    outlineColor\
    \ = \"blue\")\n```\n\nThe only method that you need to define in the new Square\
    \ class is __init__, which overrides the default number of sides. Here is the\
    \ code, followed by an explanation:\n\n```\nclass Square(RegularPolygon):\n  \
    \  def __init__(self, length, xPos, yPos, heading, outlineColor = \"black\",\n\
    \        fillColor = \"black\", fillOn = False, isVisible = True):\n        #\
    \ Call the parent's __init__ with 4 sides only\n        RegularPolygon.__init__(self,\
    \ length, xPos, yPos, 4, heading,\n            outlineColor, fillColor, fillOn,\n\
    \            isVisible)\n```\n\nThis code can appear in the same module as the\
    \ code for RegularPolygon. If this code is in a different module, you have to\
    \ import RegularPolygon for it to work.\n\nNote that the parent class in parentheses\
    \ is now RegularPolygon rather than object.\n\nAlso note that the method RegularPolygon.__init__\
    \ is called, with self as an explicit first argument, within Square’s __init__\
    \ method. This call of the same method in the parent class takes care of setting\
    \ all the square’s attributes, which already belong to it as a subtype of RegularPolygon.\n\
    \nBecause all the other methods are also inherited from the RegularPolygon class,\
    \ your Square class is ready to be used without further changes! The code for\
    \ a Hexagon class is similar and is left as an exercise for you.\n\n# New Class:\
    \ Menu Item\n\nUsers of graphics-based programs select different commands or other\
    \ options from menus. Sometimes these selections are offered as drop-downs from\
    \ a menu bar or as items arranged on a visible palette. For example, suppose the\
    \ sketching program of Chapter 6, “User Interaction with the Mouse and the Keyboard,”\
    \ allowed you to select a color from a menu of colors. The options could be arranged\
    \ in a column of colored discs along the left margin of the window. When the user\
    \ clicks the mouse on a colored disc in this menu, the program would use that\
    \ color from then on in its drawings. In this section, you develop a new class\
