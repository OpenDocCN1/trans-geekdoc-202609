  md: "commander who designs the next campaign must organize a team and coordinate\
    \ its members to achieve its objectives. Design is equally important in constructing\
    \ computer programs, some of which are the most complex artifacts that human beings\
    \ have ever built. In this chapter, you explore the use of functions to design\
    \ computer programs.\n\n# BASIC ELEMENTS OF FUNCTION DEFINITIONS\n\nIn this section,\
    \ you learn the basic elements of function definitions. These elements include\
    \ arguments, docstrings, the return statement, and optional/keyword/default arguments.\n\
    \n# Circles and Squares\n\nConsider what you need to do to draw several circles\
    \ and squares in a turtle graphics program. To draw a circle, you just move the\
    \ turtle to the desired position and call the built-in circle function with the\
    \ radius as an argument. But to draw a square of a given length, you have to write\
    \ the following loop:\n\n```\nfor count in range(4):\n    forward(length)\n  \
    \  left(90)\n```\n\nYou could copy and paste this code to each place in your program\
    \ where you want to draw a square, but what if you want to use a different variable\
    \ or a number for the length? Then you’d still have to edit this code after you\
    \ copied it. You’d probably agree that calling a function, such as square, with\
    \ the length as an argument, would be a lot easier. For example, the code fragments\
    \ in the next shell session would draw a circle within a square:\n\n```\n>>> reset()\n\
    >>> hideturtle()\n>>> circle(40)\n>>> backward(40)\n>>> square(80)\n```\n\nFortunately,\
    \ as you first saw in Chapter 4, “Composing, Saving, and Running Programs,” Python\
    \ allows you to define your own functions. You can define a square function by\
    \ placing the loop below an appropriate heading, as follows:\n\n```\ndef square(length):\n\
    \    \"\"\"Draws a square with the given length.\"\"\"\n    for count in range(4):\n\
    \        forward(length)\n        left(90)\n```"
