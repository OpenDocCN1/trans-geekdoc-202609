    ```\n\n# Response to User Events, Revisited\n\nThe presence of multiple turtles\
    \ presents some interesting opportunities and problems in interactive turtle graphics\
    \ programs. For example, you might want to allow the user to drag regular polygon\
    \ objects around in the window after they are created, or you might want to select\
    \ a polygon for removal. Because a polygon contains a turtle object, it might\
    \ not be too hard to define onclick and ondrag methods in the RegularPolygon class\
    \ that have the desired behavior. On the other hand, any program that configures\
    \ objects to respond to onclick events will have problems when it also tries to\
    \ respond to onscreen click events, as does the sketching program discussed in\
    \ Chapter 6. In this section, you explore how to get different types of objects\
    \ to respond to user events and how to handle potentially troublesome interactions\
    \ among these responses.\n\n# Whose Click Is It Anyway?\n\nConsider the tester\
    \ program for menu items presented earlier. This program changes the color of\
    \ the system turtle when the user clicks on a menu item. Now, suppose you want\
    \ the system turtle to respond to mouse events as well. For example, the user\
    \ could drag the system turtle to draw lines, as was shown in Chapter 6. There\
    \ is no problem here, because the system turtle would be the only object responding\
    \ to such events in the program. (Recall that the ondrag function targets the\
    \ system turtle.)\n\nHowever, suppose you also want to be able to move the system\
    \ turtle, as you did in Chapter 6, by clicking anywhere in the turtle graphics\
    \ window. You must use the onscreen click function to tell the screen to respond\
    \ to a click event. All will be well, as long as you don’t try to select a menu\
    \ item with a click; the system turtle will move to the click position as desired.\
    \ However, when you try to select a menu item, the system turtle also moves to\
