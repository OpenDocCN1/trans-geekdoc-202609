  md: '# CHAPTER 6


    # User Interaction with the Mouse and the Keyboard


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_143_0.png)


    In the previous two chapters, you wrote programs that drew shapes in a turtle
    graphics window. However, many other programs take information as input from people.
    This information might be text (like a username and password) or numbers (like
    your age or income tax paid). Text and numbers are entered from the keyboard.
    People might also interact with a program by moving a mouse, clicking it, or dragging
    it. Many programs, especially computer games, would be unthinkable without such
    input capabilities. In this chapter, you explore various ways of allowing users
    to interact with your turtle graphics programs.


    # Using Dialog-Based Input


    In Chapter 4, “Composing, Saving, and Running Programs,” you learned how some
    programs obtain input via command-line arguments. For example, when you run the
    command


    ```

    examplepattern.py 6 blue pink

    ```


    the program draws a radial pattern of hexagons with a blue pen color and a pink
    fill color. This way of taking input into a program is fine for some applications,
    but it has two shortcomings:


    +   - Most people don’t run programs from a terminal window.

    +   - When they do, it may not be clear to them what role the input plays in the
    program. In this program, which color is the pen color, and which color is the
    fill color? And what does the 6 mean?'
