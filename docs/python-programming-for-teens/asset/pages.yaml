- pgno: 192
  md: "Before you consider the behavior of a regular polygon, you’ll see how a couple\
    \ of them might be created. You create a regular polygon by using its class name\
    \ to call a function. The required arguments are the attributes with no defaults\
    \ listed in Table 8.1. You can also provide any or all of the other attributes\
    \ as optional arguments. For clarity, you should use the keyword notation when\
    \ supplying arguments in this situation. In the next session, you create a square\
    \ and a hexagon with the given attributes:\n\n```\n>>> from regularpolygon import\
    \ RegularPolygon\n>>> square = RegularPolygon(length = 70, xPos = 0, yPos = 0,\n\
    \    heading = 45, sides = 4, outlineColor = \"blue\")\n>>> hexagon = RegularPolygon(length\
    \ = 50, xPos = 80, yPos = 80, sides = 6,\n    heading = 0, outlineColor = \"red\"\
    ,\n    fillOn = True)\n```\n\nBecause the default value of the isVisible attribute\
    \ is True, both of these polygons appear in the turtle graphics window as soon\
    \ as they are created.\n\n# Design: Determine the Behavior\n\nThe behavior of\
    \ an object consists of the actions it performs when you run its methods. Taking\
    \ a cue from your experience with a turtle object, two basic behaviors immediately\
    \ come to mind: showing and hiding the object. Other behaviors relate directly\
    \ to the polygon object’s attributes, such as examining or modifying its colors\
    \ or changing its fillOn attribute. Behavior also includes what happens when you\
    \ create a new object. Thus, creating a regular polygon whose isVisible attribute\
    \ is True immediately draws it in the turtle graphics window. Table 8.2 lists\
    \ a reasonable set of methods that capture the behavior of RegularPolygon objects.\n\
    \nTable 8.2 The Methods of Regular Polygons\n\n| Method | Default Value |\n|---|---|\n\
    | show() | Displays the polygon and sets its visibility to True. |\n| hide() |\
    \ Hides the polygon and sets its visibility to False. |\n| fillOn(value = None)\
    \ | If value (a Boolean) is provided, resets the fillOn attribute to this value.\
    \ Returns its current value. |\n| outlineColor(value = None) | If value (a color)\
    \ is provided, resets the outlineColor attribute to this value and redraws the\
    \ polygon if it’s visible. Returns its current value. |"
