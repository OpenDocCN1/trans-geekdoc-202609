- pgno: 40
  md: 'There are three types of errors that can occur in your code:


    +   - **Syntax errors**—These errors occur when your code is not well formed,
    according to the syntax or grammar rules of Python. For example, the expression
    `abs(-34)` is syntactically correct, but the expression `abs(-34))` is not. (It
    contains an extra right paren.)

    +   - **Semantic errors**—These errors occur when a syntactically correct expression
    is evaluated, but Python cannot carry out the evaluation. For example, Python
    cannot divide a number by zero, cannot compute the square root of a negative number,
    and cannot use a variable that has not yet been given a value, even though you
    can enter each such expression in the shell without a syntax error.

    +   - **Logic errors**—Also called *design errors*, these errors occur when Python
    successfully evaluates an expression, but the expression returns an incorrect
    result. For example, the expression `math.pi * 34 ** 2` does return a value, but
    if you expect this value to be the volume of a sphere of radius 34, your code
    contains a logic or design error.


    Python detects syntax and semantic errors automatically and displays error messages.
    However, you must detect logic or design errors yourself by testing and inspecting
    the results of your code. In advanced software development settings, programmers
    can use software tools to automate some of this testing as well.


    In general, you should regard error messages with a friendly eye and learn to
    understand what they mean. As you become a competent programmer, you will have
    few syntax and semantic errors in your code, so you can turn your attention to
    eliminating any logic errors.


