  md: "processors on your particular system. The Format menu includes some commands\
    \ for formatting Python code and cleaning up indentation problems.\n\nTo save\
    \ a program to a file, select the Save option from the File menu, or use the control\
    \ key sequence on your particular system (Command+S on a Mac, and Ctrl+S on other\
    \ systems). Python program files have a .py extension. If you don’t provide that\
    \ when you save a file for the first time, Python adds it for you.\n\n# Program\
    \ Structure\n\nAs you saw in Chapter 3, some Python statements, such as loops\
    \ and selection statements, have a structure. Python follows this structure to\
    \ run the statements, just as you follow it to understand what they mean.\n\n\
    A complete Python program also has a structure—one that you employ in each program\
    \ you write. Here is an example turtle graphics program that draws a pattern of\
    \ hexagon shapes similar to the one you saw in Chapter 3. You can find this program\
    \ in the file named samplepattern.py on the companion website (www.cengageptr.com/downloads).\
    \ The next few subsections explain each part of the program’s structure.\n\n```\n\
    ```python\n\"\"\"\nsamplepattern.py\nDraws a pattern using a hexagon.\n\"\"\"\n\
    \nfrom turtle import *\n\ndef main():\n    reset()\n    speed(0)\n    pensize(2)\n\
    \    hideturtle()\n    color(\"blue\", \"yellow\")    # Blue outline, yellow fill\n\
    \    begin_fill()\n    for count in range(10):    # Draw 10 hexagons\n       \
    \ for count in range(6):  # Draw each hexagon\n            forward(70)\n     \
    \       left(60)\n        left(36)                # Rotate them evenly\n    end_fill()\n\
    \    return \"Done!\"\n```\n```"
