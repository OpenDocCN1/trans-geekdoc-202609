  md: "```\ndef callback(self, fun=None):\n    \"\"\"Getter and setter for the callback\
    \ function. If flag is True,\n    also starts or resumes the animation.\"\"\"\n\
    \    if not fun is None:\n        self.__callback = fun\n    return self.__callback\n\
    \ndef act(self):\n    \"\"\"Performs the next callback action if the turtle is\
    \ animated.\"\"\"\n    if not self.animated():\n        return\n    self.__callback(self)\n\
    \    ontimer(lambda: self.act(), self._timeInterval)\n```\n\nThere are two things\
    \ to note about this code:\n\nThe __init__ method calls the act method in its\
    \ last step because the default state of this type of turtle is to be animated.\
    \ Thus, by default, the animation begins as soon as the turtle is created.\n\n\
    If the animated state is False, the act method simply returns. This logic allows\
    \ you to pause or resume the animation by calling the animated method with an\
    \ argument of False or True, respectively. You can also create a turtle whose\
    \ animation is initially off by overriding the default value of the animated attribute.\n\
    \nThe act method implements the logic of the timer that you saw in earlier examples.\
    \ In this logic, an action is performed, and then ontimer waits for a given time\
    \ interval before performing that action again. In AnimatedTurtle.act, the callback\
    \ function is called with self (the turtle) as an argument. This function can\
    \ perform whatever actions you want. A call of the act method is then bundled\
    \ in a function that is passed to ontimer for the next cycle of the animation.\n\
