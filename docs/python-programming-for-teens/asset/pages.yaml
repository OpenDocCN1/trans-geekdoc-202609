- pgno: 129
  md: "# Functions as Arguments\n\nConsider the code that draws a radial pattern of\
    \ 10 squares:\n\n```\nfor count in range(10):\n    square(70)\n    left(36)\n\
    ```\n\nAs you saw in Chapter 4, you can use code such as this to draw a pattern\
    \ that uses triangles, hexagons, or other regular polygons. At this point, you\
    \ should be asking yourself this: what must change in this pattern of code to\
    \ use a different type of polygon in the drawing? Obviously, it’s just the name\
    \ of the function, which in this particular instance happens to be square. If\
    \ you substitute the name hexagon, the code calls the function to draw hexagons\
    \ instead.\n\nUnfortunately, you must rewrite the same loop each time you want\
    \ to draw the pattern. You would like to capture this common pattern of code in\
    \ a single function. The only thing that would vary from call to call of this\
    \ function would be the name of the function used to draw the particular type\
    \ of polygon. If you could pass this function as an argument to a pattern-drawing\
    \ function, you’d be all set.\n\nAssume that your new pattern-drawing function\
    \ is named radialPattern. You could call it to draw a square-based pattern and\
    \ a hexagon-based pattern in the following manner:\n\n```\nradialPattern(square)\n\
    radialPattern(hexagon)\n```\n\nFortunately, Python is one of the few programming\
    \ languages that allow you to do this. Here is the code for the definition of\
    \ the radialPattern function:\n\n```\ndef radialPattern(polygonFunction):\n  \
    \  \"\"\"Draws a series of polygons by rotating around a center point.\"\"\"\n\
    \    for count in range(10):\n        polygonFunction(70)\n        left(36)\n\
    ```\n\nNote that the argument name, polygonFunction in this definition, refers\
    \ to the function that the caller passes. This function can be square, hexagon,\
    \ or any function of one argument that draws a polygon.\n\nBy now, you should\
    \ be thinking to yourself, “Hey, this radialPattern function is still not general\
    \ enough. It always draws a pattern with 10 polygons of length 70. I want to provide\
    \ a function that can draw any number of polygons of any length.” You’d be right\
    \ to think that, and in the exercises, you’ll have an opportunity to act on that\
    \ thought."
