    # RESPONDING TO MOUSE EVENTS


    Perhaps you have used a paint program, which allows you to make drawings by dragging
    the mouse around on a virtual sketchpad. To do this in turtle graphics, you have
    to be able to detect mouse events and respond to them. The turtle graphics system
    recognizes the three types of mouse events listed in Table 6.1.


    **Table 6.1 Mouse Events**


    | Mouse Event | When It Happens | Example |

    |---|---|---|

    | Click | The user presses and releases the mouse button, without moving the mouse.
    | The user selects a file icon. |

    | Drag | The user presses the mouse button and moves the mouse while continuing
    to press the button. | The user drags a file icon from one window to another.
    |

    | Release | The user releases the mouse button. | The user releases the mouse
    button when the icon of a file is over the trashcan icon. |


    In this section, you explore how to detect and respond to mouse events in turtle
    graphics.


    # Drawing Line Segments with Mouse Clicks


    To enable turtle graphics to respond to a mouse event, you need to perform two
    steps:


    +   1. Let turtle graphics know which function it should call when a given type
    of mouse event, such as a click, occurs. This function is called an event-handling
    function.

    +   2. Tell turtle graphics to start listening for events.


    Suppose you want turtle graphics to call its goto function whenever the user clicks
    the mouse anywhere in the turtle graphics window. To do this, you pass the goto
    function as an argument to the function onscreen click (Step 1). You then call
    the listen function,'
