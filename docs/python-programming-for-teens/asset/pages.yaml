- pgno: 78
  md: 'The window’s initial width is 50% of your screen’s width and 75% of its height.
    The window is centered on your screen. The functions window_width and window_height
    return the window’s current width and height, respectively. (Recall that the user
    may alter these dimensions with the mouse at any time.)


    To change the size and position of the window under program control, call the
    setup function. The first two arguments to set up are the window’s dimensions.
    If these arguments are integers, they represent the actual width and height. If
    these arguments are floating-point numbers, they represent fractions of the screen’s
    width and height. The third and fourth arguments represent the window’s position
    relative to the boundaries of the screen. If these arguments are positive, they
    indicate the distances of the window from the left boundary and the top boundary,
    respectively. If they are negative, the distances are relative to the right and
    bottom edges of the screen.


    The next shell session places a turtle graphics window in the upper-right corner
    of the screen. The background color is black, and the pen and fill colors are
    white.


    ```

    >>> setup(400, 300, -400, 50)

    >>> screensize(1650, 1080, "black")

    >>> color("white", "white")

    ```


    Table 2.7 summarizes the functions related to the window and canvas in turtle
    graphics.


    Table 2.7 Functions Related to the Window and Canvas


    | Function | What It Does |

    |---|---|

    | screensize() | Returns the tuple (canvasWidth, canvasHeight). |

    | screensize(canvwidth, canvheight, bg) | Sets the width, height, and background
    color of the canvas. (All arguments are optional.) |

    | setup(width, height, startx, starty) | Sets the size and position of the turtle
    graphics window. width and height can be integers (the actual number of pixels)
    or floats (the percentages of the screen’s dimensions). startx and starty can
    be positive (the position in pixels from the left edge of the screen) or negative
    (the position in pixels from the right edge of the screen). |

    | window_height() | Returns the height of the turtle graphics window. |

    | window_width() | Returns the width of the turtle graphics window. |'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# USING A CONFIGURATION FILE


    As you become proficient with turtle graphics, you will want to customize the
    settings for the initial state of the turtle and its window. You can put your
    settings in a configuration file, so you won’t have to run them in your code each
    time you start up IDLE.


    When you import resources from the `turtle` module, Python looks for a file named
    `turtle.cfg` in the current working directory. This should be a text file containing
    your settings. If the file exists, Python automatically calls the appropriate
    functions with the data contained in the configuration file. Here is an example
    of some of the settings that Python uses by default:


    ```

    width = 0.5

    height = 0.75

    leftright = None

    topbottom = None

    canvwidth = 400

    canvheight = 300

    colormode = 1.0

    shape = classic

    pencolor = black

    fillcolor = black

    title = Python Turtle Graphics

    ```


    Note that the string values for the colors, shape, and window title are written
    without the quotes.


    There are many other turtle graphics functions not covered in this chapter. If
    you’re curious about them, check the documentation. Some of them handle user inputs
    from the keyboard and the mouse. Others are useful for programming animations.
    You will learn about some of these operations later in this book. For now, practice
    using the basic functions introduced here, before you move on to the next chapter.


    # SUMMARY


    +   - Turtle graphics supports drawing pictures with a virtual pen and canvas.
    You can access turtle graphics operations by running the statement `from turtle
    import *`.

    +   - The turtle has a position, heading, speed, pen size, shape, pen color, and
    fill color. You can examine these attributes or change them by calling the appropriate
    functions.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '+   - You can show or hide the turtle, and you can pick up its pen or place
    it down on the canvas.

    +   - The turtle’s position is located within a two-dimensional coordinate system
    whose origin (0, 0) is at the center of the canvas.

    +   - You can move the turtle forward or backward a given distance in its current
    heading.

    +   - You can rotate the turtle’s heading to the left or the right by a given
    number of degrees.

    +   - You can examine and reset the dimensions of the turtle’s canvas and window.
    You can examine or reset the color of the canvas.

    +   - The `reset` function restores the original state of turtle graphics, whereas
    the `clear` function just erases the turtle’s drawings.

    +   - Colors are represented in two modes. The first mode uses names, such as
    "red" and "blue", for a few common colors. The second mode uses the RGB system.
    In this system, color values are tuples of the form (r, g, b), where each item
    is an integer ranging from 0 through 255. The integers represent the intensities
    of the red, green, and blue components of a color. There are 255³ colors available
    in this mode.

    +   - The `begin_fill` and `end_fill` functions enclose a code segment that fills
    a shape with the turtle’s current fill color.

    +   - The `write` function draws text in the turtle graphics window.


    # EXERCISES


    Launch the IDLE shell and complete the following exercises. You should write your
    code interactively in the IDLE shell.


    +   1. The Müller-Lyer illusion is caused by an image that consists of two parallel
    line segments. One line segment looks like an arrow with two heads, and the other
    line segment looks like an arrow with two tails. Although the line segments are
