    This concludes your introduction to user interaction with turtle graphics. You
    can now write some programs that really engage people.


    # SUMMARY


    +   - The user can provide interactive inputs to a turtle graphics program by
    means of pop-up dialogs. Turtle graphics provides two types of dialogs: one for
    numbers and one for text.

    +   - The `textinput` function is used to pop up a dialog for a string (a single
    line of text). The function expects the dialog''s title and a prompt as string
    arguments. If the user cancels or closes the dialog, the function returns `None`.
    Otherwise, if the user clicks OK, the function returns the string contained in
    the input field.

    +   - The `numinput` function is used to pop up a dialog for an input number.
    The function expects the dialog''s title and a prompt as string arguments. Optional
    arguments include a default numeric value, a minimum allowable value, and a maximum
    allowable value. If the user cancels or closes the dialog, the function returns
    `None`. Otherwise, if the user clicks OK, the function checks the text in the
    input field for correct format, converts this text to a number, and checks it
    against any optional bounds. If an error occurs, the dialog informs the user and
    waits for more input. Otherwise, the number is returned as a `float`.

    +   - The user can also interact with a turtle graphics program if that program
    is set up to respond to mouse events and keyboard events.

    +   - The four mouse events in turtle graphics are a click in the window, a click
    on the turtle''s shape, a drag on the turtle''s shape, and a release on the turtle''s
    shape.

    +   - The programmer responds to a mouse event by providing an event-handling
    function. This function is triggered when an event of that type occurs.

    +   - The functions to register event-handling functions for mouse events are
    `onscreenclick`, `onclick`, `ondrag`, and `onrelease`. Each of these functions
    expects an event-handling function as an argument. When triggered, this function
    is passed the coordinates where the mouse event occurred.'
