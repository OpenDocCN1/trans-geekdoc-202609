  md: '# How Event Handling Works


    Even after you have told turtle graphics which function should handle a given
    mouse event and told it to start listening for events, nothing happens until an
    event occurs. In the example you just saw, turtle graphics is ready to call the
    goto function whenever you click the mouse in its window. When you do that, turtle
    graphics passes the current mouse coordinates as arguments to the goto function,
    and the turtle moves to that new position. So event handling is automatic once
    you have told turtle graphics which functions to use and readied it to listen
    for events. The only thing you have to do, in the case of a mouse event, is to
    provide an event-handling function that expects two arguments. These arguments
    represent the (x, y) coordinates of the current mouse position.


    # Freehand Drawing by Dragging the Mouse


    Drawing line segments with mouse clicks, as you did just now, is pretty simple
    but also pretty rigid. You can only draw straight lines, and you can’t pick the
    pen up and put it down again without drawing another line segment. A true freehand
    drawing program allows you to drag the virtual pen around with the mouse and draw
    curved lines as well as straight ones. When you let go of the mouse button, you
    can move the virtual pen to a new position without drawing anything.


    Turtle graphics allows you to respond to mouse drag events with the ondrag function.
    Like the onscreen click function, the ondrag function expects another function
    as an argument. The latter function is triggered repeatedly, while the user drags
    the mouse from one position to another in the turtle graphics window. Initially,
    you must position the mouse on the turtle’s shape for the first drag event to
    be detected. As before, the event-handling function’s two arguments will be the
    current mouse coordinates.


    To experiment with ondrag in the shell, you can pass it the goto function, just
    as you did with onscreen click earlier. Figure 6.3 shows a sample drawing. Here
    is the new shell session:


    ```

    >>> from turtle import *

    >>> shape("circle")

    >>> pencolor("blue")

    >>> width(2)

    >>> ondrag(goto)

    >>> listen()

    ```'
