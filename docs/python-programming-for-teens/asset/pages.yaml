- pgno: 189
  md: "# A Random Walk with Several Turtles\n\nYou learned about random walks in Chapter\
    \ 3, “Control Structures: Sequencing, Iteration, and Selection.” Now that you\
    \ can create and manipulate your own turtle objects, you can take several of them\
    \ for a walk. Figure 8.1 shows four turtles at the end of their walk.\n\n![](img/4dc3f6307b32ff815a6d58ec1c84708c_189_0.png)\n\
    \nFigure 8.1\nA random walk with several turtles.\n© 2014 Python Software Foundation.\n\
    \nWhen you work with many objects of the same type, it’s convenient to keep them\
    \ in a list. In your new random walk program, you create an empty list and then\
    \ add four new turtle objects to it. Each turtle has a different color (not shown\
    \ in Figure 8.1). After you add the turtles to the list, you can move them simultaneously\
    \ by running a loop. On each pass through this loop, a turtle turns left a random\
    \ number of degrees and moves forward a random distance. The loop through the\
    \ turtles list is nested within a loop that runs a fixed number of times. Here\
    \ is the code for the new random walk program:\n\n```\n\"\"\"\nFile: randomwalk.py\n\
    Four turtles take a random walk.\n\"\"\"\n\nfrom turtle import *\nfrom random\
    \ import randint, random\n\ndef randomColor():\n    \"Returns a random RGB color.\"\
    \n    return (randint(0, 255), randint(0, 255), randint(0, 255))\n\ndef main(iterations\
    \ = 30, numTurtles = 4):\n    # Initialize the list of turtles\n    turtles =\
    \ []\n```"
