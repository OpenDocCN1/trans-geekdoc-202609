  md: 'If the value of this expression is used just once in your program, you compute
    it just once and use it there. However, if it is used in several places in your
    program, you must write the same expression several times. That’s a waste of your
    time in writing code and a waste of the computer’s time in evaluating it. Is there
    a way to write the expression, compute its value just once, and then simply use
    this value many times thereafter?


    Yes, there is, and that’s one reason why programs use variables. A variable in
    Python is a name that stands for a value. A Python variable is given a value by
    using the assignment operator =, according to the following form:


    ```

    variable = expression

    ```


    where variable is any Python name (with a few exceptions to be discussed later)
    and expression is any Python expression (including the arithmetic expressions
    under discussion here). Thus, in our example, the variable volume could be given
    the volume of the sphere via the assignment


    ```

    volume = 4 / 3 * 3.1416 * 4.2 ** 3

    ```


    and then used many times in other code later on. Note that because the precedence
    of assignment is lower that that of the other operators, the expression to the
    right of the = operator is evaluated first, before the variable to the left receives
    the value.


    Now, suppose you had to compute the volumes of several different spheres. You
    could type out the expressions 4 / 3 and 3.1416 every time you write the code
    to compute a new volume. But you could instead use other variables, such as FOUR_THIRDS
    and PI, to make these values easy to remember each time you repeat the formula.
    Figure 1.4 shows a session in the shell where these values are established and
    the volumes of two spheres, with radii 4.2 and 5.4, are computed.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_35_0.png)


