- pgno: 60
  md: '![](img/4dc3f6307b32ff815a6d58ec1c84708c_60_0.png)


    Figure 2.1

    A two-dimensional coordinate system.


    The origin or center point of this system, (0, 0), is located at the intersection
    of the axes. Any other position (x, y) is relative to the origin. The x values
    are positive to the right of the origin and negative to the left of it. The y
    values are positive above the origin and negative below it.


    You can move the turtle forward or backward a given distance from its current
    position. The direction of this movement is determined by its current heading.
    You can turn its heading a given number of degrees to the left or to the right.
    You can also set the turtle pen’s color and size, draw some basic shapes, fill
    those shapes with color, control the turtle’s speed, and access the boundaries
    of the turtle’s drawing area.


    To experiment with turtle graphics in the Python shell, launch IDLE as you did
    in Chapter 1, “Getting Started with Python.” Then run the following code fragments
    in the shell:


    ```

    >>> from turtle import *

    >>> showturtle()

    ```


    You should see a second window pop up, like the one shown in Figure 2.2.'
