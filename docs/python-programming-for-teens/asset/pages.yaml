- pgno: 13
  md: '# INTRODUCTION


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_13_0.png)


    Welcome to *Python Programming for Teens*. Whether you’re under 20 or just a teenager
    at heart, this book will introduce you to computer programming. You can use it
    in a classroom or on your own. The only assumption is that you know how to use
    a modern computer system with a keyboard, screen, and mouse.


    To make your learning experience fun and interesting, you will write programs
    that draw pictures on the screen and allow you to interact with them by using
    the mouse. Along the way, you will learn the basic principles of program design
    and problem solving with computers. You will then be able to apply these ideas
    and techniques to solve problems in almost any area of study. But most of all,
    you will experience the joy of building things that work *and* look great!


    # WHY PYTHON?


    Computer technology and applications have become increasingly more sophisticated
    over the past several decades, and so has the computer science curriculum, especially
    at the introductory level. Today’s students learn a bit of programming and problem
    solving and are then expected to move quickly into topics like software development,
    complexity analysis, and data structures that, 20 years ago, were reserved for
    advanced courses. In addition, the ascent of object-oriented programming as a
    dominant method has led instructors and textbook authors to bring powerful, industrial-strength
    programming languages such as C++ and Java into the introductory curriculum. As
    a result, instead of experiencing the rewards and excitement of computer programming,
    beginning students'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'often become overwhelmed by the combined tasks of mastering advanced concepts
    and learning the syntax of a programming language.


    This book uses the Python programming language as a way of making the learning
    experience manageable and attractive for students and instructors alike. Python
    offers the following pedagogical benefits:


    +   - Python has simple, conventional syntax. Its statements are close to those
    of ordinary English, and its expressions use the conventional notation found in
    algebra. Thus, beginners can spend less time learning the syntax of a programming
    language and more time learning to solve interesting problems.

    +   - Python has safe semantics. Any expression or statement whose meaning violates
    the definition of the language produces an error message.

    +   - Python scales well. It is easy for beginners to write simple programs. Python
    also includes all the advanced features of a modern programming language, such
    as support for data structures and object-oriented software development, for use
    when they become necessary.

    +   - Python is highly interactive. Expressions and statements can be entered
    at an interpreter’s prompts to allow the programmer to try out experimental code
    and receive immediate feedback. Longer code segments can then be composed and
    saved in script files to be loaded and run as modules or standalone applications.

    +   - Python is general purpose. In today’s context, this means that the language
    includes resources for contemporary applications, including media computing and
    networks.

    +   - Python is free and is in widespread use in the industry. Students can download
    it to run on a variety of devices. There is a large Python user community, and
    expertise in Python programming has great resume value.


    To summarize these benefits, Python is a comfortable and flexible vehicle for
    expressing ideas about computation, both for beginners and experts alike. If students
    learn these ideas well in their first experience with programming, they should
    have no problems making a quick transition to other languages and technologies
    needed to achieve their educational or career objectives. Most importantly, beginners
    will spend less time staring at a computer screen and more time thinking about
    interesting problems to solve.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# ORGANIZATION OF THE BOOK


    The approach in this book is easygoing, with each new concept introduced only
    when you need it.


    Chapter 1, “Getting Started with Python,” advises you how to download, install,
    and start the Python programming software used in this book. You try out simple
    program commands and become acquainted with the basic features of the Python language
    that you will use throughout the book.


    Chapter 2, “Getting Started with Turtle Graphics,” introduces the basic commands
    for turtle graphics. You learn to draw pictures with a set of simple commands.
    Along the way, you discover a thing or two about colors and two-dimensional geometry.


    Chapter 3, “Control Structures: Sequencing, Iteration, and Selection,” covers
    the program commands that allow the computer to make choices and perform repetitive
    tasks.


    Chapters 4, “Composing, Saving, and Running Programs,” shows you how to save your
    programs in files, so you can give them to others or work on them another day.
    You learn how to organize a program like an essay, so it is easy for you and others
    to read, understand, and edit. You also learn a bit about how the computer is
    able to read, understand, and run a program.


    Chapter 5, “Defining Functions,” introduces an important design feature: the function.
    By organizing your programs with functions, you can simplify complex tasks and
    eliminate unnecessary duplications in your code.


    Chapter 6, “User Interaction with the Mouse and the Keyboard,” covers features
    that allow people to interact with your programs. You learn program commands for
    responding to mouse and keyboard events, as well as pop-up dialogs that can take
    information from your programs’ users.


    Chapter 7, “Recursion,” teaches you about another important design strategy called
    recursion. You write some recursive functions that generate computer art and fractal
    images.


    Chapter 8, “Objects and Classes,” offers a beginner’s guide to the use of objects
    and classes in programming. You learn how to define new types of objects, such
    as menu items for choosing colors and grids for board games, and use them in interesting
    programs.


    Chapter 9, “Animations,” concludes the book with a brief introduction to animations.
    You discover how to get images to move independently and interact in interesting
    ways.


    Two appendixes follow the last chapter. Appendix A, “Turtle Graphics Commands,”
    provides a reference for the set of turtle graphics commands introduced in the
    book.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Each chapter includes a set of two programming exercises that build on concepts
    and examples introduced earlier in that chapter. You can find the answers to these
    exercises in Appendix B, “Solutions to Exercises.”


    # COMPANION WEBSITE DOWNLOADS


    You may download the companion website files from www.cengageptr.com/downloads.
    These files include the example programs discussed in the book and the solutions
    to the exercises.


    # A BRIEF HISTORY OF COMPUTING


    Before you jump ahead to programming, you might want to peek at some context.
    The following table summarizes some of the major developments in the history of
    computing. The discussion that follows provides more details about these developments.


    | Approximate Date | Major Developments |

    |---|---|

    | Before 1800 | Mathematicians develop and use algorithms<br>Abacus used as a
    calculating aide<br>First mechanical calculators built by Leibniz and Pascal |

    | 1800–1930 | Jacquard’s loom<br>Babbage’s Analytical Engine<br>Boole’s system
    of logic<br>Hollerith’s punch card machine |

    | 1930s | Turing publishes results on computability<br>Shannon’s theory of information
    and digital switching |

    | 1940s | First electronic digital computers |

    | 1950s | First symbolic programming languages<br>Transistors make computers smaller,
    faster, more durable, less expensive<br>Emergence of data-processing applications
    |

    | 1960–1975 | Integrated circuits accelerate the miniaturization of computer hardware<br>First
    minicomputers<br>Time-sharing operating systems<br>Interactive user interfaces
    with keyboards and monitors<br>Proliferation of high-level programming languages<br>Emergence
    of a software industry and the academic study of computer science and computer
    engineering |'
  merge: -1
  img_proc: true
