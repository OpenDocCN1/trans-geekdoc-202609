- pgno: 126
  md: "Run this program in an IDLE file window (F5 key). Then import the module testsquare\
    \ in the shell. At that point, you can ask for help on any of the functions, or\
    \ on the entire module, by running the help function with the function or the\
    \ module name as an argument. You can also run the function testsquare.randomColor.\
    \ Do that a couple of times to view the results. As you experiment with this program,\
    \ you are also encouraged to add and test new functions, such as a function that\
    \ draws a hexagon.\n\nRemember to write the docstrings first!\n\n# Optional, Default,\
    \ and Keyword Arguments\n\nSuppose that you want to accept an optional color argument\
    \ in your square function. This argument, if present, allows the caller to draw\
    \ a square in a new pen color. If this argument is absent, the function draws\
    \ the square in the current pen color. If the function draws the square in a new\
    \ color, it restores the old color before returning.\n\nThe next code fragment\
    \ draws a radial pattern of squares using random colors.\n\n```\nfor count in\
    \ range(10):\n    square(70, randomColor())\n    left(36)\n```\n\nTo define a\
    \ function with an optional argument, you place the argument name and the default\
    \ value in what looks like an assignment statement, as shown in the next definition:\n\
    \n```\ndef square(length, newColor = None):\n    \"\"\"Draws a square with the\
    \ given length and optional color.\"\"\"\n    if newColor:\n        oldColor =\
    \ pencolor()      # Save old pen color and use new color\n        pencolor(newColor)\n\
    \    for count in range(4):\n        forward(length)\n        left(90)\n    if\
    \ newColor:\n        pencolor(oldColor)         # Restore old pen color\n```\n\
    \nNote that the first argument, named length, has no default value. This argument\
    \ is not optional but is required, meaning that the function’s caller must supply\
    \ the length.\n\nIf the caller does not supply a second argument when the function\
    \ is called, the value of newColor is automatically None. Because Python views\
    \ this value as False and any color value as True, you can check for the presence\
    \ of a new color in a one-way if statement."
  merge: -1
  img_proc: true
- pgno: 127
  md: "If the new color is present, you can save the current pen color in the temporary\
    \ variable oldColor and reset the pen to the new color. Otherwise, if no color\
    \ argument is present, you can leave the pen color as it is.\n\nAfter the square\
    \ is drawn, you check for the presence of the new color once more and restore\
    \ the old color if the new color exists.\n\nHere are some example calls of this\
    \ function:\n\n```\n>>> square(70)\n>>> square(70, \"red\")\n>>> square(length\
    \ = 70, newColor = \"red\")\n>>> square(newColor = \"red\", length = 70)\n```\n\
    \nThe first two calls of the function show just the values of the arguments. The\
    \ next two calls show the names of the arguments as well as their values. When\
    \ used in this way, they are called keyword arguments. The use of keyword arguments\
    \ allows you to supply the arguments to a function in a different order than the\
    \ one shown earlier in the function’s definition. However, if you omit the keyword\
    \ with an argument, that argument must appear in the same position as it was in\
    \ the function’s definition.\n\n# FUNCTIONS AS GENERAL SOLUTIONS TO PROBLEMS\n\
    \nOnce you become comfortable with defining your own functions, you will start\
    \ to write them for almost every occasion. But after you’ve written the code for\
    \ several functions, you might start to see a common or redundant pattern in them.\
    \ You might try to find a way to capture this redundancy in a new function, thus\
    \ saving yourself the trouble of rewriting or copying and pasting the same code.\
    \ In this section, you examine two ways to do this.\n\n# Regular Polygons\n\n\
    The functions square and hexagon are already solutions to general problems, in\
    \ so far as they allow you to draw a square or a hexagon of any length. However,\
    \ when you examine the code of each function, you see that the only differences\
    \ are in the number of sides and the size of the interior angle. Here they are:\n\
    \n```\ndef square(length):\n    \"\"\"Draws a square with the given length.\"\"\
    \"\n    for count in range(4):\n        forward(length)\n        left(90)\n```"
