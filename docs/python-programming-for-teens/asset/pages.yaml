  md: "You can examine or change any of the three specific attributes of an animated\
    \ turtle, even while its animation is in progress. For example, you can increase\
    \ or decrease the time interval or pause or resume the animation with a shell\
    \ command. Alternatively, you can access these attributes within the callback\
    \ function, which takes the turtle as an argument.\n\n# Using an Animated Turtle\
    \ in a Shell Session\n\nIn keeping with the practice of trying out new resources\
    \ in the shell, you can enter a few simple commands to animate a turtle that moves\
    \ in a circular pattern. You assume that the AnimatedTurtle class is defined in\
    \ a module named animatedturtle.py, in the current working directory. Then you\
    \ enter this code in the shell:\n\n```\n>>> from animatedturtle import AnimatedTurtle\n\
    >>> from turtle import hideturtle, listen, onscreenclick\n>>> def moveAndTurn(t):\n\
    \    t.forward(2)\n    t.left(2)\n\n>>> hideturtle()\n>>> sleepy = AnimatedTurtle(animated\
    \ = False, callback = moveAndTurn)\n>>> onscreenclick(lambda x, y: sleepy.animated(not\
    \ sleepy.animated()))\n>>> listen()\n>>> sleepy.animated(True)\n```\n\nWhen you\
    \ create this turtle, you set its animated flag to False, so it won’t start acting\
    \ right away. You also pass it a callback function, which turns it and moves it\
    \ when the animation begins.\n\nYou then register a function for screen clicks;\
    \ this function pauses or resumes the animation. Note the code for this function:\n\
    \n```\nlambda x, y: sleepy.animated(not sleepy.animated())\n```\n\nThe x and y\
    \ arguments are ignored. The animated method is called twice—first as getter and\
    \ then as setter—to reset the value of this attribute to its logical negation.\
    \ This pauses when the animation is underway or resumes when the animation is\
    \ paused.\n\n# Defining the AnimatedTurtle Class\n\nThe AnimatedTurtle class is\
    \ a subclass of the Turtle class. In addition to the turtle’s state, this class\
    \ maintains a time interval and a callback function to be used when the turtle\
    \ is"
