    # List Literals and Operators


    A list is a sequence of data values called items. Items can be any data values
    whatsoever. Like the characters in a string, the items in a list are ordered by
    position, counting from 0. In Python, a list literal is represented as a sequence
    of items separated by commas. The sequence of items is enclosed in square brackets,
    as shown in the next shell session.


    ```

    >>> [34, 46, 22]

    [34, 46, 22]

    >>> emptyList = []

