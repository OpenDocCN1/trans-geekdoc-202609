- pgno: 103
  md: '# CHAPTER 4


    # COMPOSING, SAVING, AND RUNNING PROGRAMS


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_103_0.png)


    Thus far in this book, you have been entering short Python code fragments into
    the IDLE shell and viewing the results. This method works well for experimenting
    with the basic elements of Python, including the turtle graphics operations. However,
    as the things you want to do with your code get more complicated, so does your
    code. At that point, entering lots of small pieces of code into the shell becomes
    unwieldy and inconvenient. When you put related code fragments together, you really
    have what counts as a *computer program*. What you need now is an editor for composing
    programs, a means of saving them to files for later use, and a means of running
    them. The programming process and its supporting tools are the topics of this
    chapter.


    # EXPLORING THE PROGRAM DEVELOPMENT PROCESS


    A *program* is a sequence of statements or instructions that solves a problem.
    Programs can be as short as a single line of code or can consist of millions of
    lines of code. Software companies may employ many teams of programmers to work
    on a single large program. Each team is responsible for working on a solution
    to a piece of the overall problem (for example, the spell checker, file manager,
    and editor in a word processing program). Each team in turn may be composed of
    smaller teams who work on different stages of the programming process. These stages
    include the following, which are also shown in the flow diagram of Figure 4.1:


    +   1. **Analysis**—In this stage, you determine exactly what counts as a solution
    to a problem. For example, a spell checker should check the spelling of words
    in a text file'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'and make changes where necessary. Note that you do no coding here, but you
    determine what the results of your program should be. You will check the program
    for these results during program testing. You might also write the manual for
    the program’s users.


    +   2. **Design**—In this stage, you use the results of analysis to determine
    how the program will solve its assigned problem. Some coding might occur here,
    although design tools such as the pseudocode that you saw in Chapter 3, “Control
    Structures: Sequencing, Iteration, and Selection,” might also be used.

    +   3. **Coding**—In this stage, you translate the results of design into the
    code of a programming language. Note that the same design could be coded in different
    languages, such as Python, Java, and C++, depending on the needs of the client
    and the computer system where the program will be run.

    +   4. **Compilation**—In this stage, you run a program that translates your program
    into a form that can be run on a computer. Compilation may reveal syntax errors,
    which you must correct before continuing.

    +   5. **Testing**—In this stage, you repeatedly run the program with different
    inputs and observe the outputs. If the program halts with an error message, or
    if the program produces unexpected outputs, you have to retreat to an earlier
    phase to fix the errors.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_104_0.png)


    Figure 4.1

    The program development process.


    Very rarely would you participate in all of these stages in a large programming
    project. In fact, you might have an entire career in just one area, as an analyst,
    designer, coder, or tester. But for short programs, you might do everything.'
  merge: -1
  img_proc: true
