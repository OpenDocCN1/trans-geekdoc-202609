- pgno: 231
  md: 'As you can see, this shape consists of a rectangle and three triangles. Python’s
    Shape class allows you to create compound shapes from several polygons. To do
    so, you obtain a new compound shape object by running the following code:


    ```

    >>> from turtle import *

    >>> shape = Shape("compound")

    ```


    You then create representations of the four polygons and add them to the shape,
    as follows:


    ```

    >>> fuselage = ((0,0), (25, 0), (25, 10), (0, 10))

    >>> noseCone = ((25, 0), (35, 5), (25, 10))

    >>> fin1 = ((0, 10), (-5, 30), (10, 10))

    >>> fin2 = ((0, 0), (-5, -20), (10, 0))

    >>> shape.addcomponent(noseCone, "pink", "black")

    >>> shape.addcomponent(fuselage, "red", "black")

    >>> shape.addcomponent(fin1, "green", "black")

    >>> shape.addcomponent(fin2, "green", "black")

    ```


    Note that you can include optional fill and outline colors for each polygon as
    you add it to the shape.


    Finally, you can register the new shape with a name, create a turtle with that
    shape, and tilt and turn it so it’s ready to lift off:


    ```

    >>> addshape("rocket", shape)

    >>> Mercury = Turtle(shape = "rocket")

    >>> Mercury.tilt(90)

    >>> Mercury.left(90)

    ```


    Unfortunately, turtles with compound shapes don’t appear to detect mouse events;
    but other than that, they’re good to go!


    That’s it. Hopefully you have had fun developing your code, viewing the results,
    and interacting with your Python programs. Now you are a competent Python programmer,
    ready to move on to the next level. Play on!


    # SUMMARY


    +   - An animation uses a timer to schedule a sequence of actions at regular intervals.

    +   - The ontimer function takes two arguments: a function of no arguments and
    a number of milliseconds. The ontimer function sets a timer to run for the given
    number of milliseconds. When that time expires, the function argument is called.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '+   - The `begin_poly` and `end_poly` functions are used to record the turtle’s
    drawing of a polygon. The `get_poly` function returns a tuple of the coordinates
    of the recorded polygon’s vertices.

    +   - The `addshape` function can be used to register a new turtle shape. This
    function expects two arguments: a shape name and a shape. The shape can be a GIF
    filename or a tuple containing the vertices of a polygon.

    +   - The `Shape` class is used to create a compound shape from several polygons.
    The instance method `addcomponent` expects a tuple of polygon vertices as an argument
    and adds this information to the shape. You can use a shape object to register
    a new turtle shape.


    # EXERCISES


    Launch the IDLE shell, open a file window, and complete the following exercises.
    You should run each program within IDLE and, when it is completed, in the terminal
