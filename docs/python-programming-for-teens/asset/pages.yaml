  md: '# RECURSIVE PATTERNS IN ART: ABSTRACT PAINTING


    The twentieth century Dutch artist Piet Mondrian developed a style of abstract
    painting that exhibited simple recursive patterns. To generate such a pattern
    with a computer, you begin with a rectangle drawn in a random color and then repeatedly
    draw two unequal subdivisions with random colors. Several sample drawings are
    shown in Figure 7.3 (actual colors not shown).


