  md: '# FUNCTIONS RELATED TO THE WINDOW AND CANVAS


    These functions examine or modify various aspects of the canvas or window.


    # Window Functions


    The functions in Table A.9 examine or modify various attributes of the turtle
    graphics window.


    Table A.9 Functions Related to the Window


    | Method | What It Does |

    |---|---|

    | addshape(name, shape = None) | If shape is absent, name must be the name of
    a GIF file on disk. Otherwise, shape must be an object of type Shape, or a tuple
    containing the vertices of a polygon. Registers the shape under the name in the
    screen''s shape dictionary. |

    | bgcolor(*args) | If the argument is absent, returns the canvas''s current color.
    Otherwise, resets the canvas color. Arguments can have the form colorString (such
    as "red" or "#AA0000"), (r, g, b), or r, g, b. If RGB values are used, they must
    be integers in the range from 0 through 255. |

    | bgpic(picname = None) | If picname is a filename (must be a GIF file), display
    the corresponding image as the canvas background. If picname is "nopic", delete
    the background image, if present. If picname is None, return the filename of the
    current background image. |

    | exitonclick() | Quits the running program when the user clicks the mouse in
    the window. |

    | getshapes() | Returns a list of the currently registered shape names. |

    | onscreenclick(fun, btn=1, add=None) | Registers fun as a function to be triggered
    when the mouse is clicked on the canvas. fun should be a function of two arguments,
    the x and y coordinates of the mouse click. Optional btn values are 1 (left button)
    or 2 (right button). When add is True, the existing event-handling functions for
    screen clicks are not removed. |

    | ontimer(fun, t = 0) | Calls fun after a delay of t milliseconds. |


    (Continued)'
