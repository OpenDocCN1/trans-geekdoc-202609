  img_proc: true
- pgno: 166
  md: "Note that each call of the `summation` function, with the exception of the\
    \ last one, calls `summation` again. This call is known as a *recursive call*\
    \ of the function.\n\nThe final call of the `summation` function makes no recursive\
    \ call but instead returns one of the arguments directly. This is known as the\
    \ *base case* of the function.\n\nOn each recursive call of the function, the\
    \ first argument increases by 1. As this value increases, it eventually reaches\
    \ a limit that stops the recursive process. In other words, this adjustment allows\
    \ the function to detect when the recursion should stop and return the base case\
    \ value.\n\nNow, can you come up with a general formula for the `summation` function\
    \ from its recursive description? Of course you can. You assume that the `summation`\
    \ function has two arguments, named `low` and `high`. As their names imply, you\
    \ also assume that `low` is less than or equal to `high` whenever the function\
    \ is called. So the recursive formula for the `summation` function is expressed\
    \ as two equations. The first equation expresses what a summation is when the\
    \ two arguments are equal (the final call in Figure 7.2). The second equation\
    \ expresses what a summation is otherwise. Here are the two equations:\n\n`summation(low,\
    \ high) = high, if low == high`\n`summation(low, high) = low + summation(low +\
    \ 1, high)`\n\nYou should review Figure 7.2 to verify that these two equations\
    \ describe the partial summations contained in `summation(1, 4)` before continuing.\n\
    \nYou can turn this design into an implementation by defining a Python function\
    \ named `summation`. This function states the assumptions about the arguments\
    \ in a docstring and then uses a two-way `if` statement to express the two options\
    \ stated in the design. Here is the code for the function, embedded in a short\
    \ tester program:\n\n```\n```\n\"\"\"\nFile: recursion1.py\nDefine and test a\
    \ recursive summation function.\n\"\"\"\n\nimport sys\n\ndef summation(low, high):\n\
    \    \"\"\"Returns the summation of the integers\n    from low to high.\n    Precondition:\
    \ low <= high.\"\"\"\n    if low == high:\n        return high\n    else:\n  \
    \      return low + summation(low + 1, high)\n```\n```"
