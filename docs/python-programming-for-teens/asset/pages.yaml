- pgno: 89
  md: '# Boolean Values


    Named for the nineteenth century British mathematician and logician George Boole,
    a Boolean expression returns one of two values: `True` or `False`. These values
    are taken to mean “yes” or “no” when they result from evaluating Boolean expressions.
    Like the words for, from, and import, the words `True` and `False` are Python
    *keywords*. They are colored orange in IDLE and cannot be used as the names of
    variables. Like the numbers and other literals, the values `True` and `False`
    evaluate to themselves.


    # Comparisons


    The == operator compares any two Python values for equality and returns `True`
    if they’re equal and `False` if they’re not. The != operator stands for “not equal
    to” and returns the opposite results of ==. Here are some example comparisons:


    ```

    >>> 34 == 0

    False

    >>> 34 != 0

    True

    >>> 34 == 2 * 17

    True

    >>> "Ken" == "KEN"

    False

    >>> "Ken" == 34

    False

    ```


    As you can see, comparisons are Boolean expressions. Note that Python compares
    two strings by examining the pairs of characters at each position. Because "e"
    does not equal "E", the strings "Ken" and "KEN" are not equal.


    The operators <, >, <=, and >= are used to compare values that can be ordered
    in ascending or descending order. Thus, you can compare two numbers or two strings
    in this manner. You should try these other comparison operators in the shell to
    make sure you understand their meanings.


    # Logical Operations


    Boole used the values `True` and `False` in a system of logic. There are three
    basic operations in this system:


    +   - **Logical negation**—This operation applies the logical operator `not` to
    a Boolean expression. The result returned is `False` if the expression is `True`
    and `True` if the expression is `False`.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '+   - **Logical conjunction**—This operation applies the logical operator and
    to two operands, both of which are Boolean expressions. The operation returns
    True if both of the expressions are True, and it returns False otherwise.

    +   - **Logical disjunction**—This operation applies the logical operator or to
    two operands, both of which are Boolean expressions. The operation returns False
    if both of the expressions are False; otherwise, it returns True.


    Suppose that a program receives an input number from the user, and you want to
    test it to verify that its value is within a range of values, say, from 0 through
    100. For this condition to be True, the number must be greater than or equal to
    0 and less than or equal to 100. The following shell session shows some tests
    for this condition:


    ```

    >>> number = int(input("Enter a number: "))

    Enter a number: 55

    >>> number >= 0 and number <= 100

    True

    >>> number = int(input("Enter a number: "))

    Enter a number: -1

    >>> number >= 0 and number <= 100

    False

    >>> number = int(input("Enter a number: "))

    Enter a number: 101

    >>> number >= 0 and number <= 100

    False

    ```


    Logical operations might seem strange at first, but they are actually easier to
    understand than arithmetic operations once you get used to them. The main reason
    for this is that there is only a finite number of possible combinations of values
    for the operands. You can list these combinations and the results in truth tables.
    Table 3.1 shows the combinations and results for negation. Table 3.2 shows the
    combinations and results for conjunction and disjunction. Note that both A and
    B refer to Boolean expressions.


    Table 3.1 The Truth Table for Logical Negation


    | A | not A |

    |---|-------|

    | True | False |

    | False | True |'
  merge: -1
  img_proc: true
- pgno: 91
  md: "Table 3.2 The Truth Table for Logical Conjunction and Logical Disjunction\n\
    \n| A | B | A and B | A or B |\n|---|---|---|---|\n| True | True | True | True\
    \ |\n| True | False | False | True |\n| False | True | False | True |\n| False\
    \ | False | False | False |\n\nYou probably won’t use logical operations very\
    \ often. But if you need help with them, you can always review these tables for\
    \ their evaluation rules and then try your expressions in the shell.\n\n# MAKING\
    \ CHOICES: SELECTION STATEMENTS\n\nAfter you determine how to ask a yes/no question\
    \ about a condition, you must decide what to do with the answer. Sometimes you\
    \ take action if the answer is “yes” but do nothing if it is “no.” For example,\
    \ if the remainder of an integer division is not 0, you would output the remainder;\
    \ otherwise, the output of the quotient, which happened earlier, would suffice.\n\
    \nOther times, you perform one action if the answer to your question is “yes”\
    \ but another action if the answer is “no.” For example, if a password is recognized,\
    \ you can perform the requested service; otherwise, you output an error message\
    \ to the user.\n\nStill other times, there may be many different options available,\
    \ but only one of them is input. You must compare the input to each possible option\
    \ until a match is found, whereupon you perform the associated action. Command\
    \ menus call for this type of multiway decision.\n\nIn this section, you explore\
    \ Python’s different types of selection statements for making one-way, two-way,\
    \ and multiway decisions.\n\n# The One-Way if Statement\n\nYou use the one-way\
    \ if statement to make a one-way decision. Its form is\n\n```\nif BooleanExpression:\n\
    \    Statements\n```"
  merge: -1
  img_proc: true
- pgno: 92
  md: "where Statements is a sequence of one or more statements. Note the indentation\
    \ before the nested statements. As in the for loop, the indentation in an if statement\
    \ is significant. It picks out the statements that are run if the Boolean expression\
    \ is True. If the Boolean expression is False, these statements are skipped, and\
    \ the computation continues following the entire if statement. Figure 3.2 shows\
    \ the flow of control in this type of selection statement.\n\n![](img/4dc3f6307b32ff815a6d58ec1c84708c_92_0.png)\n\
    \nFigure 3.2\n\nThe flow of control in a one-way if statement.\n\nHere is the\
    \ example of integer division mentioned earlier:\n\n```\n>>> divisor = 10\n>>>\
    \ divisor = 3\n>>> dividend = 10\n>>> quotient = dividend // divisor\n>>> remainder\
    \ = dividend % divisor\n>>> print(\"The quotient is\", quotient)\nThe quotient\
    \ is 3\n>>> if remainder != 0:\n    print(\"The remainder is\", remainder)\n```\n\
    \nThe remainder is 1\n\nAs you can see, if the divisor had been 2 or the dividend\
    \ had been 9, the remainder, 0, would not have been output at all.\n\nOne-way\
    \ if statements are rare, but you should experiment with one just in case you\
    \ have a need for it some day."
  merge: -1
  img_proc: true
- pgno: 93
  md: "# The Two-Way if Statement\n\nTwo-way decisions, like forks in the road, are\
    \ common. You go one way or the other, depending on the condition you examine\
    \ at the choice point. The form for a two-way if statement to make this type of\
    \ choice is\n\n```\nif BooleanExpression:\n    ConsequentStatements\nelse:\n \
    \   AlternativeStatements\n```\n\nOnce again, the indentation of the nested statements\
    \ reflects the logic of this control structure. If the Boolean expression is True,\
    \ run the consequent statements and then skip to the end of the entire if-else\
    \ statement. Otherwise, skip the consequent statements and run the alternative\
    \ statements following the keyword else. Figure 3.3 shows the flow of control\
    \ in this type of selection statement.\n\n![](img/4dc3f6307b32ff815a6d58ec1c84708c_93_0.png)\n\
    \nFigure 3.3\nThe flow of control in a two-way if statement.\n\nHere is an example\
    \ of how you can use an if-else statement to accept or reject a user’s input number:\n\
    \n```\n>>> import math\n>>> number = input(\"Enter a positive number: \")\n>>>\
    \ if number > 0:\n    print(\"The square root is\", math.sqrt(number))\nelse:\n\
    \    print(\"Error: the number must be greater than 0\")\n```"
  merge: -1
  img_proc: true
- pgno: 94
  md: "# Probable Options with random.randint\n\nIn Chapter 1, you saw how to use\
    \ Python’s random.choice function with a list to simulate a coin toss:\n\n```\n\
    >>> import random\n>>> coin = [\"heads\", \"tails\"]\n>>> random.choice(coin)\n\
    'tails'\n```\n\nBecause there are two options from which to choose, picking one\
    \ at random causes each option to be chosen approximately 50% of the time over\
    \ the course of many tosses. To demonstrate this, you can run the following code\
    \ fragments, which count the number of heads and tails over 50 tosses:\n\n```\n\
    >>> headCount = 0\n>>> tailCount = 0\n>>> for count in range(50):\n    result\
    \ = (random.choice(coin))\n    if result == \"heads\":\n        headCount += 1\n\
    \    else:\n        tailCount += 1\n\n>>> headCount\n22\n>>> tailCount\n28\n```\n\
    \nAs you can see, over the long haul, a coin toss turns up heads about half of\
    \ the time and tails about half of the time. In mathematical terms, each side\
    \ of the coin turns up with a probability of .5. As a rule, if an event has a\
    \ probability of 1, it means that it is certain to occur (100% of the time). Smaller\
    \ probability values correlate to smaller percentages.\n\nOccasionally, you will\
    \ want to select an option based on a given probability value. Suppose that the\
    \ probability of that option is .25 (1 out of 4). Instead of building a Python\
    \ list of four values, you can pick a random integer from a range of integers\
    \ using the function random.randint. This function expects two arguments: the\
    \ lower and upper bounds of the range. Thus, to select an option with a probability\
    \ of .25, you can call random.randint(1, 4)"
  merge: -1
  img_proc: true
- pgno: 95
  md: "and compare the result to a given number, say, 1. Over the long haul, you should\
    \ see this number returned 25% of the time, as shown in the next shell session:\n\
    \n```\n>>> total = 0\n>>> for count in range(50):\n    result = random.randint(1,\
    \ 4)\n    if result == 1:\n        total += 1\n\n>>> total\n13\n>>> 4 * 13\n52\n\
    ```\n\nThis method works well for probabilities expressed as the fractions ½,\
    \ ¼, and so forth, but what about fractions with larger numerators, such as ¾?\
    \ This means that you are looking for any of 3 given numbers out of 4. Expressed\
    \ in English, you want to see if a random number between 1 and 4 is in the range\
    \ from 1 to 3. Here is the Python code for this test:\n\n```\n>>> random.randint(1,\
    \ 4) in range(1, 4)\nFalse\n```\n\nTo verify that this expression returns True\
    \ three-quarters of the time, test it in loop like the others shown in this section.\n\
    \nUsing these techniques, you should be able to perform an action in code with\
    \ any given probability that is required by a problem. The exercises give you\
    \ a chance to perform further experiments with probability.\n\n# The Multiway\
    \ if Statement\n\nYou must make a multiway decision when there are more than two\
    \ possible paths of action. (Most conventional forks have four prongs, after all.)\
    \ Thus, there are at least two conditions that must be checked in this kind of\
    \ situation. Python provides a multiway if statement for this purpose. Its form\
    \ is\n\n```\nif BooleanExpression:\n    statements\nelif Booleanexpression:\n\
    \    statements\n.\n.\nelse:\n    statements\n```"
  merge: -1
  img_proc: true
- pgno: 96
  md: "After you ask the first question in the if clause, you can ask as many questions\
    \ with elif clauses as you need to. The trailing else clause, which is optional,\
    \ handles the case where the answer to all the questions is False, or “no.” Note\
    \ that only one sequence of statements is chosen and run.\n\nThe following code\
    \ fragments demonstrate a simple command interpreter for doing arithmetic:\n\n\
    ```\n```\n>>> x = float(input(\"Enter the first number: \"))\nEnter the first\
    \ number: 3.44\n>>> y = float(input(\"Enter the second number: \"))\nEnter the\
    \ second number: 45.6\n>>> command = input(\"Enter an arithmetic operator [+ ,\
    \ - , * , /]: \")\nEnter an arithmetic operator [+ , - , * , /]: *\n>>> if command\
    \ == \"+\":\n    print(\"The sum is\", x + y)\nelif command == \"-\":\n    print(\"\
    The differnce is\", x - y)\nelif command == \"*\":\n    print(\"The product is\"\
    , x * y)\nelif command == \"/\":\n    print(\"The quotient is\", x / y)\nelse:\n\
    \    print(\"Error: unrecognized operator\")\nThe product is 156.864\n```\n```\n\
    \nYou will see uses of selection statements in turtle graphics programs later\
    \ in this chapter.\n\n# USING SELECTION TO CONTROL ITERATION\n\nThe for loop examined\
    \ earlier is quite rigid. It iterates a definite number of times, over some fixed\
    \ sequence of values. This type of loop is simple to design and works well for\
    \ many problems. However, some situations call for a more flexible type of loop:\
    \ one that cannot anticipate how many iterations will be performed. This type\
    \ of loop must be able to ask the question, “Should I continue or not?” and be\
    \ able to exit when the answer is “no.” This type of loop is called an indefinite\
    \ loop, and in this section, you explore how to design indefinite loops for various\
    \ situations."
  merge: -1
  img_proc: true
- pgno: 97
  md: "# The while Loop\n\nPython provides a control structure called a while loop\
    \ for when you can’t predict how many times the loop will iterate. Its form is\
    \ quite simple:\n\n```\nwhile BooleanExpression:\n    Statements\n```\n\nThis\
    \ form looks a bit like that of the one-way if statement discussed earlier. The\
    \ behavior is similar, too. The difference is that the loop repeatedly tests the\
    \ Boolean expression until it becomes False. Whenever the expression returns True,\
    \ the statements in the body of the loop are run; otherwise, the body of the loop\
    \ is skipped, and computation continues after the loop. Thus, the statements in\
    \ the one-way if statement are run once or not at all, whereas the statements\
    \ in the while loop are run zero or more times. Figure 3.4 shows the flow of control\
    \ in this type of loop.\n\n![](img/4dc3f6307b32ff815a6d58ec1c84708c_97_0.png)\n\
    \nFigure 3.4\nThe flow of control in a while loop.\n\nA while loop can be used\
    \ like a for loop, to move through a sequence of values, as shown in the next\
    \ shell session:\n\n```\n>>> number = 0\n>>> while number < 5:\n    print(number)\n\
    \    number = number + 1\n\n>>>\n0\n1\n2\n3\n4\n```"
  merge: -1
  img_proc: true
- pgno: 98
  md: "However, the while loop really comes into its own when the number of iterations\
    \ is unpredictable. For example, consider Euclid’s method for computing the greatest\
    \ common divisor of two integers. The greatest common divisor of two integers\
    \ is the largest integer by which both numbers can be evenly divided (with a remainder\
    \ of 0). For instance, the greatest common divisor of 120 and 32 is 8. Euclid’s\
    \ method starts with the two numbers A and B and assumes A >= B and B >= 0. You\
    \ repeatedly replace B with the remainder of dividing A by B and replace A with\
    \ B. You stop when B equals 0; at that point, A is the answer. Here is a pseudocode\
    \ design for this method:\n\n```\nWhile B > 0\n    C = A remainder B\n    A =\
    \ B\n    B = C\n```\n\nWhen A = 128 and B = 32, the loop sets A to 32 and B to\
    \ 24 on the first pass. On the second pass, A becomes 24 and B becomes 8. On the\
    \ third and final pass, A becomes 8 and B becomes 0. You can confirm that this\
    \ is how Euclid’s method works with Python code in the following shell session:\n\
    \n```\n>>> a = 120\n>>> b = 32\n>>> while b > 0:\n    c = a % b\n    a = b\n \
    \   b = c\n    print(a, b)\n```\n\n32 24\n24 8\n8 0\n>>> a\n8\n\nAs you can see,\
    \ it’s impossible to anticipate the number of iterations required for any given\
    \ values of A and B. Therefore, the while loop is the appropriate loop control\
    \ structure to use for Euclid’s method.\n\n# Random Walks in Turtle Graphics\n\
    \nIn the turtle graphics examples seen thus far, your turtle has moved in quite\
    \ rigid and regular ways to draw geometric shapes. But consider the movements\
    \ of animals, such as"
