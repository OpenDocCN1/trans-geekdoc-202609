    # The mainloop Function


    Now it’s time to look more closely at the last three lines of code in the example
    program. The first line calls the main function, which pops up the turtle graphics
    window and draws the pattern. At that point, main returns the string "Done!" The
    program then outputs this string either to the IDLE shell or to the terminal window,
    depending on the launch method. The last line of code calls the mainloop() function.
    This function causes the turtle graphics window to stay open when the program
    is run from a terminal window. If you are running the program from an IDLE file
    window, you cannot return to the shell until you close the turtle graphics window.


    # RUNNING A PROGRAM


    By now you will be eager to run the example program. This section explores a couple
    of ways to do this. But first you need a quick reminder about using a turtle graphics
    configuration file.


    # Using a Turtle Graphics Configuration File


    As mentioned in Chapter 2, “Getting Started with Turtle Graphics,” a turtle graphics
    configuration file can provide the same initial settings for several programs.
    For example, you might want a smaller initial turtle graphics window and the full
    RGB color mode. Many of the example programs in the rest of this book use a configuration
    file with the following settings:


    ```

    width = 400

    height = 300

    canvwidth = 1200

    canvheight = 900

    using_IDLE = True

    colormode = 255

    title = Python Turtle Graphics

    ```


    This file is named turtle.cfg and should sit in the same directory as your Python
    program file. Of course, you are free to modify any of these settings from within
    your program after it launches.'
