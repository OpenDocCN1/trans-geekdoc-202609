- pgno: 65
  md: '![](img/4dc3f6307b32ff815a6d58ec1c84708c_65_0.png)


    Figure 2.5

    Drawing a square.

    © 2014 Python Software Foundation.


    The first method uses the reset, forward, and left functions. The reset function
    positions the turtle at the lower-left corner of the square, heading east. Now
    imagine that you are the turtle, standing on the drawing area and heading east.
    You would walk forward 70 units, turn left 90 degrees, walk forward again, and
    turn left again. You’d perform these two steps twice more until you were back
    at the home position. Here is the code that describes this process and carries
    it out in turtle graphics:


    ```

    >>> reset()

    >>> forward(70)

    >>> left(90)

    >>> forward(70)

    >>> left(90)

    >>> forward(70)

    >>> left(90)

    >>> forward(70)

    >>> left(90)

    ```


    Note that the last call of the left function is not necessary to complete the
    drawing, but it leaves the turtle’s heading as it was at the beginning of the
    process.


    The second method uses the goto function to draw line segments between each of
    the four corners of the square. To do this, you must first figure out the positions
    of the four corners. They are (0, 0), (70, 0), (70, 70), and (0, 70). These coordinates
    give the arguments to the four calls of goto required to draw the square, as follows:


    ```

    >>> reset()

    >>> goto(70, 0)

    >>> goto(70, 70)

    >>> goto(0, 70)

    >>> goto(0, 0)

    ```'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Note that `goto` does not change the turtle’s heading.


    Which method seems easier and more straightforward to you? The first method probably
    requires less mental effort; aside from knowing that each corner of a square encloses
    a 90-degree angle, you just have to know the number of sides and the length of
    a side. The second method forces you to calculate all the coordinates of the corners
    ahead of time. Moreover, if you want to change the length of the square the next
    time you draw it, you only have to change one value in the first method: the length
    of the square. At times, you will want to use `goto`, but this is not one of them.


    # Drawing an Equilateral Triangle


    Now consider drawing an equilateral triangle. In this type of triangle, all the
    sides are the same length, and each vertex forms an interior angle of 60 degrees.
    If you assume that the length is 70 units, the leftmost vertex is at the origin,
    and the top vertex is above the x-axis, then the triangle is as shown in Figure
    2.6.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_66_0.png)


    Figure 2.6

    Drawing an equilateral triangle.

    © 2014 Python Software Foundation.


    How would you draw this triangle? Each vertex of the triangle encloses an angle
    of 60 degrees. So, following the preferred method for drawing a square, if you
    move the turtle forward 70 units and turn left 60 degrees three times, that should
    do it, right? Unfortunately, the result shown in Figure 2.7 doesn’t quite cut
    it.'
