- pgno: 144
  md: 'Most people are used to receiving an informative prompt for a computer input;
    such a prompt describes the type of value that’s requested. In terminal-based
    Python programs, Python’s input function serves this purpose, but again, most
    people don’t run programs from a terminal window. Moreover, even when you do run
    a turtle graphics program from a terminal, your program code can no longer access
    the terminal window for input values.


    The primary way in which window-based applications receive input is via labeled
    entry fields within a window. As you know from filling in forms on the web, you
    place the mouse cursor in a box and type in the number or text requested. The
    request or prompt is a label that appears next to the field. You then click a
    Submit or OK button to inform the program that the input is ready, or you click
    a Cancel button to back out of the input operation altogether. Turtle graphics
    supports this strategy for input with input dialogs, which form the subject of
    this section.


    # Input Dialogs in Turtle Graphics


    An input dialog is a small window that pops up for input. The window contains
    a message about the kind of data requested and a field for the user to enter this
    information via the keyboard. Command buttons are available to submit or cancel
    the input.


    Assume that the pattern drawing program of the previous two chapters takes three
    inputs from input dialogs. At program start-up, the user is presented with a sequence
    of three dialogs, shown in Figure 6.1.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_144_0.png)


    Figure 6.1

    Three input dialogs.

    © 2014 Python Software Foundation.


    When the user closes each dialog, the next one pops up, until all the input has
    been submitted or canceled. If input is canceled, the program uses a default value,
    as before.


    Turtle graphics dialogs come in two flavors: one for accepting numbers, and the
    other for accepting strings. The two functions for input dialogs are named textinput
    and numinput. Now you’ll examine these functions more closely.'
