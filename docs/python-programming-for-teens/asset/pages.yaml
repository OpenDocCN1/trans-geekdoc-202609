- pgno: 201
  md: "# Design: Determine the Attributes and Behavior\n\nA menu item has a position\
    \ in the window, a shape, a color, and a callback function. A callback function\
    \ is triggered when a user event, such as a mouse click, occurs. You learned in\
    \ Chapter 6 how to set up the system turtle to respond to mouse click events with\
    \ the onclick function. This function receives a callback function as an argument.\
    \ From that point on, when the user clicks the mouse within the area of the turtle’s\
    \ shape, its callback function is triggered.\n\nBecause all these attributes of\
    \ a menu item are also attributes of a turtle object, the best way to proceed\
    \ is to make your new MenuItem class a subclass of the Turtle class. Then your\
    \ MenuItem class gets all of a turtle’s attributes and methods for free.\n\nBecause\
    \ the only thing that a menu item does is respond to a mouse click, you don’t\
    \ have to worry about defining other behavior. All the work gets done when the\
    \ MenuItem object is created. You just provide its position, its shape, its color,\
    \ and a callback function as arguments to the MenuItem function (and also to its\
    \ __init__ method). Here is an example of a menu item’s use:\n\n```\n>>> from\
    \ menuitem import MenuItem\n>>> MenuItem(-50, 0, \"circle\", \"red\", lambda color:\
    \ print(color))\n```\n\nThe second line of code places a red disc at position\
    \ (-50, 0) in the turtle graphics window and sets its callback function to the\
    \ lambda expression. When the user clicks on the disc, the program prints the\
    \ disc’s color in the Python shell window.\n\n# Implementation and Testing\n\n\
    The MenuItem class consists of an import statement and the definition of the __init__\
    \ method. This method expects x and y coordinates, a shape, a color, and a callback\
    \ function as arguments. Here is the code for the MenuItem class:\n\n```\n\"\"\
    \"\nFile: menuitem.py\nDefines a class for menu items.\n\"\"\"\n\nfrom turtle\
    \ import Turtle\n\nclass MenuItem(Turtle):\n    \"\"\"Represents a menu item.\"\
    \"\"\n```"
  merge: -1
  img_proc: true
- pgno: 202
  md: "```\ndef __init__(self, x, y, shape, color, callBack):\n    \"\"\"Sets the\
    \ initial state of a menu item.\"\"\"\n    Turtle.__init__(self, shape=shape,\
    \ visible=False)\n    self.speed(0)\n    self.up()\n    self.goto(x, y)\n    self.color(color,\
    \ color)\n    self._callBack = callBack\n    # Pass my color to the callback function\
    \ when I'm clicked\n    self.onclick(lambda x, y: self._callBack(color))\n   \
    \ self.showturtle()\n```\n\nBecause MenuItem is a subclass of Turtle, you have\
    \ to call Turtle’s __init__ method first. You can provide the shape and initial\
    \ visibility as arguments to this method. The turtle is initially hidden, until\
    \ it’s moved to its final location.\n\nNote that self now refers to the menu item\
    \ under construction, which is also a turtle. So you pick up this menu item by\
    \ calling self.up(). If you forget to use self and call the system turtle’s function\
    \ up(), you get an error message. Because you imported Turtle rather than * from\
    \ the turtle module, your code no longer has access to the system turtle’s functions.\
    \ This style of defensive programming helps to prevent logic errors at runtime.\n\
    \nYou create a new instance variable for the callback function and call the onclick\
    \ method to register it. You should pay close attention to the following two lines\
    \ of code:\n\n```\nself._callBack = callBack\n# Pass my color to the callback\
    \ function when I'm clicked\nself.onclick(lambda x, y: self._callBack(color))\n\
    ```\n\nRecall that a callback function for a click event is passed the x and y\
    \ coordinates of the mouse when a mouse click occurs. Therefore, the function\
    \ passed to the onclick method must be a function of two arguments. But the callback\
    \ function that the menu item receives from its creator is a function of one argument:\
    \ a color. So you construct a lambda expression with two arguments to keep onclick\
    \ happy and hide a call of the callback function with its color argument in the\
    \ body of this lambda.\n\nNow when the user clicks the mouse on a menu item, its\
    \ callback function is triggered and passed the mouse coordinates, which are ignored.\
    \ Instead, the function saved in the instance variable self._callback is called\
    \ with the menu item’s color as an argument. If you go back and look at the code\
    \ for the callback function that was provided by the creator of the menu item,\
    \ you see that it has been set up to let the user know which color has been selected."
