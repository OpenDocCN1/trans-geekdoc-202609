  img_proc: true
- pgno: 87
  md: "The for loop is set up to iterate over a sequence of values. When used with\
    \ the range function, the loop iterates over each integer included in a range\
    \ of integers. As you saw in Chapter 1, when range is called with a single integer\
    \ argument, it produces a sequence of integers, ranging from 0 through the integer\
    \ argument minus one. On each pass through the loop, the current value in the\
    \ sequence is automatically assigned to the variable in the loop heading. You\
    \ can use this variable in the loop body, as shown in following code fragment:\n\
    \n```\n```\n>>> for number in range(5):\n    print(number)\n\n>>>\n0\n1\n2\n3\n\
    4\n```\n```\n\nYou also saw that you can begin a range with a value other than\
    \ 0 by calling the range function with two arguments. For example, you can print\
    \ the integers from 1 through 5 by passing the arguments 1 and 6 to range.\n\n\
    Finally, you can visit a range of integers in descending order by calling the\
    \ range function with three arguments. The first argument is the upper bound,\
    \ the second argument is the lower bound minus one, and the third argument is\
    \ -1.\n\nYou should experiment with all three of these methods of counting with\
    \ a for loop until you understand how they work.\n\n# Loops with Strings, Lists,\
    \ and Dictionaries\n\nBecause a for loop visits items in a sequence, it can also\
    \ visit the items in a string or a list. The next code fragments demonstrate this:\n\
    \n```\n```\n>>> name = \"Kenneth\"\n>>> for ch in name:\n    print(ch)\n```\n\
    ```"
  merge: -1
