    Fine art can be expensive!


    # RECURSIVE PATTERNS IN NATURE: FRACTALS


    Fractals are highly repetitive or recursive patterns. A fractal object appears
    geometric, yet it cannot be described with ordinary Euclidean geometry. Strangely,
    a fractal curve is not one dimensional, and a fractal surface is not two dimensional.
    Instead, every fractal shape has its own fractal dimension. To understand what
    this means, you start by considering the nature of an ordinary curve, which has
    a precise finite length between any two points. By contrast, a fractal curve has
    an indefinite length between any two points. The apparent length of a fractal
    curve depends on the level of detail in which it is viewed. As you zoom in on
    a segment of a fractal curve, you can see more and more details, and its length
    appears greater and greater. Consider a coastline, for example. Seen from a distance,
    it has many wiggles but a discernible length. Now put a piece of the coastline
    under magnification. It has many similar wiggles, and the discernible length increases.
    Self-similarity under magnification is the defining characteristic of fractals;
    it’s seen in the shapes of mountains, the branching patterns of tree limbs, and
    many other natural objects.


    One example of a fractal curve is the c-curve. Figure 7.5 shows the first six
    levels of c-curves and a level-10 c-curve.'
