  img_proc: true
- pgno: 213
  md: "Nothing is unusual here; by now, you should be familiar with the nested loop\
    \ pattern used to process a grid. The index that identifies each grid square is\
    \ passed along with self, the grid, to each square as it is created. That information\
    \ is used in the game logic of the other methods in this class. Note that you\
    \ call the tracer and update functions to speed up the display of the grid at\
    \ program start-up.\n\n# Defining Methods for the Game Logic\n\nThe other methods\
    \ in the TicTacToeGrid class are concerned with the game logic. The method makeMove,\
    \ which you passed to each grid square when it was created, is triggered when\
    \ the user clicks in a square. This method receives the index of the target square\
    \ as an argument.\n\nThe method obtains the square where the click occurred and\
    \ examines the text contained there. If the text is the empty string, the grid’s\
    \ current letter is put into the square and then set to the other player’s letter.\
    \ The method then checks the grid to see if there is a winner and, if so, announces\
    \ the outcome. Instead of writing the complex code for checking for a winner here,\
    \ you pass the buck onto another method, to be defined later. (Remember: passing\
    \ the buck is a programming virtue.)\n\nHere is the code for the makeMove method:\n\
    \n```\ndef makeMove(self, index):\n    \"\"\"Responds to a user's click in a square.\"\
    \"\"\n    square = self.__grid[index]\n    if square.text() == \"\":\n       \
    \ square.text(self.__letter)\n        if self.__letter == \"X\":\n           \
    \ self.__letter = \"O\"\n        else:\n            self.__letter = \"X\"\n  \
    \  winner = self.__hasWinner()\n    if winner:\n        up()\n        hideturtle()\n\
    \        goto(-40, 110)\n        write(winner + \" wins!\", font = (\"Arial\"\
    , 24, \"bold\"))\n```\n\nThe _hasWinner method examines the grid and, if there\
    \ is a winner, returns that player’s letter; otherwise, the method returns the\
    \ empty string. The method must check each row, each column, and each diagonal\
    \ to see if one of them contains three Xs or three Os."
