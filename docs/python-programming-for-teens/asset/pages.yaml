  md: '# CHAPTER 8


    # OBJECTS AND CLASSES


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_187_0.png)


    Throughout this book, you have been using functions to construct programs that
    solve interesting problems. Many of these functions, such as the turtle graphics
    functions and the `math` module functions, are built in to the Python programming
    language. In Chapter 5, “Defining Functions,” you learned how to define your own
    more specialized functions, and in Chapter 7, “Recursion,” you learned how to
    define functions that can be applied recursively in special situations.


    In this chapter, you learn to construct programs that use another important abstraction
    mechanism. In this style of abstraction, you think of the data and their behavior
    as the basic program components. Each datum is called an *object*, and each object
    is of a particular type or *class*. A class specifies the set of *methods* that
    can be applied to its objects to produce their behavior. But from the perspective
    of a programmer, objects and classes are software resources like any other. To
    use these resources, you


    +   - Create objects of a class by running a special function or mentioning these
    objects as literals (in the case of strings, lists, tuples, and dictionaries).

    +   - Assign these objects to variables or place them in the appropriate data
    structures (such as lists or dictionaries).

    +   - Get these objects to do things by calling their methods.

    +   - Define new classes of objects if suitable ones do not yet exist.


    Now you are ready to explore the use of objects, methods, and classes in turtle
    graphics.'
