  md: "positions of the most recent mouse clicks. Now the only remaining question\
    \ is this: where is this variable initialized to the empty list?\n\nBecause the\
    \ variable positionHistory must retain its value between function calls, it must\
    \ be a module variable. Thus, it is initialized near the beginning of the module,\
    \ just like you did with PI in the earlier example. Here is the code for the complete\
    \ program:\n\n```\n\"\"\"\ntriangle.py\nDraws triangles with 3 mouse clicks.\n\
    \"\"\"\n\nfrom turtle import *\n\npositionHistory = []\n\ndef setVertex(x, y):\n\
