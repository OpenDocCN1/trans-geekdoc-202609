- pgno: 128
  md: "```\ndef hexagon(length):\n    \"\"\"Draws a hexagon with the given length.\"\
    \"\"\n    for count in range(6):\n        forward(length)\n        left(60)\n\
    ```\n\nBoth squares and hexagons are examples of a more general type of geometric\
    \ shape called a regular polygon. In a regular polygon, all the sides are the\
    \ same length and all the interior angles are the same size. Because the interior\
    \ angle always equals 360 divided by the number of sides, the only variations\
    \ in these shapes are in fact the length of a side and the number of sides.\n\n\
    Now, can you see a way of defining a new, more general function that allows the\
    \ caller to draw a regular polygon? Of course, you can; this function, named regularPolygon,\
    \ takes two arguments: the length and the number of sides. Its loop iterates over\
    \ the number of sides after computing the appropriate interior angle to use, as\
    \ follows:\n\n```\ndef regularPolygon(length, numSides):\n    \"\"\"Draws a regular\
    \ polygon with the given length\n    and number of sides.\"\"\"\n    interiorAngle\
    \ = 360 / numSides\n    for count in range(numSides):\n        forward(length)\n\
    \        left(interiorAngle)\n```\n\nHere are some example calls of this function,\
    \ to draw a square and a hexagon:\n\n```\n>>> regularPolygon(70, 4)    # Draw\
    \ a square of length 70\n>>> regularPolygon(70, 6)    # Draw a hexagon of length\
    \ 70\n```\n\nYou can also simplify the definitions of the functions square and\
    \ hexagon, as follows:\n\n```\ndef square(length):\n    \"\"\"Draws a square with\
    \ the given length.\"\"\"\n    regularPolygon(length, 4)\n\ndef hexagon(length):\n\
    \    \"\"\"Draws a hexagon with the given length.\"\"\"\n    regularPolygon(length,\
    \ 6)\n```\n\nIf you need to add code to draw a new type of regular polygon, such\
    \ as a triangle or a pentagon, you can define a specific function like you did\
    \ for squares and hexagons."
