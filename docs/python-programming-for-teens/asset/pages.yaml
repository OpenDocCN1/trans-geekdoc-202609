- pgno: 217
  md: '# CHAPTER 9


    # ANIMATIONS


    Part of the fun of working with turtle graphics is that you can either move figures
    around in the window with the mouse or watch them move around on their own. Self-moving
    figures form the basis of computer *animations*, and these in turn form the basis
    of video games, cartoons, and animated feature films.


    In this closing chapter, you explore some of the features of animations in turtle
    graphics. After this brief introduction to animations, you will be ready to explore
    the wider world of computer programming.


    # ANIMATING THE TURTLE WITH A TIMER


    Thus far in this book, your programs have moved the turtle around in the window
    to draw interesting figures. With the exception of the random walk program, the
    movement of the turtle has not been a subject of interest in its own right. Indeed,
    in many cases, you have increased the speed of the turtle to its maximum value
    so you could focus on the result of its actions, such as a fractal image or an
    abstract painting.


    By contrast, in animations, movement becomes the main point of interest, and coordinating
    the movements of many objects within a frame becomes the main challenge for the
    programmer. In this section, you learn to use a timer to start animating a turtle.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_217_0.png)'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Using the ontimer Function


    The turtle graphics function ontimer calls a function after a delay of time. Here
    is its form:


    ```

    ontimer(aFunctionOfNoArguments, delayInMilliseconds)

    ```


    For example, suppose you want to move the turtle forward 70 pixels after a delay
    of 10 seconds and do that twice. Here is how you would accomplish that in a shell
    session:


    ```

    >>> from turtle import *

    >>> reset()

    >>> speed(0)

    >>> shape("turtle")

    >>> ontimer(lambda: forward(70), 10000)

    >>> ontimer(lambda: forward(70), 10000)

    ```


    You should notice a slight delay between the moment that you press the Enter key
    and the beginning of the turtle’s movement. Note that you use a lambda expression
    to wrap your function of one argument, forward(70), in a function of no arguments
    to keep ontimer happy. Finally, note that the delay has no effect on the speed
    of the turtle’s movement, once it is initiated; that is governed by the speed
    function, as usual. Thus, other combinations are possible, such as a slow movement
    after a brief delay.


    Now, you might be wondering, “Why bother with a timer at all, when I can already
    control the speed of the turtle’s movements and get some animation with the speed
    function?”


    There are three reasons why timers are useful:


    +   1. A timer can schedule actions at regular intervals. You need to do that
    for animations that run on their own. Using a timer thus enables you to sustain
    turtle movements for an indefinite amount of time.

    +   2. Using a timer also allows you to control the intervals between actions
    in a machine-independent manner. Although the speed of the turtle might vary with
    the speed of your hardware, the interval of the delay that you pass to the ontimer
    function will be the same number of milliseconds, no matter how fast or slow your
    hardware is.

    +   3. Finally, by introducing a delay into a turtle’s sequence of actions, you
    allow other turtles to perform their actions while a given turtle is “resting”
    during its delay.


    # Scheduling Actions at Regular Intervals


    You are ready to learn how to use a timer to schedule repeated actions. You will
    recall the process of drawing a circle described in Chapter 5, “Defining Functions,”
    where the turtle'
  merge: -1
