- pgno: 233
  md: '# APPENDIX A


    # TURTLE GRAPHICS COMMANDS


    This appendix brings together in one place a reference for the Python turtle graphics
    commands used in this book, along with a few others. For the commands not listed
    here, and for the most current documentation on all the features and commands
    of turtle graphics, visit Python’s website at http://docs.python.org/3/library/turtle.html#module-turtle.


    # TURTLE FUNCTIONS


    All the functions listed in this section are functions in the turtle module. Most
    of them are also methods in the Turtle class. When called as a function, the operation
    acts on the single system turtle. When called as a method, the operation acts
    on the turtle object associated with the call. Many of the functions have synonyms;
    consult Python’s documentation for details.


    # Turtle Motion


    The functions in Table A.1 move the turtle and manipulate various aspects of the
    turtle’s state.


    ![](img/4dc3f6307b32ff815a6d58ec1c84708c_233_0.png)'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Table A.1 Moving and Drawing


    | Method | What It Does |

    |---|---|

    | backward(distance) | Moves the turtle the given distance in the opposite direction
    from its current heading. |

    | circle(radius, extent = None, steps = None) | Draws a circle with the given
    radius. extent, if present, is the number of degrees in an arc. steps, if present,
    is the number of steps that the turtle moves to draw the circle. |

    | clear() | Deletes the drawings from the canvas. Does not affect the drawings
    of other turtles. |

    | forward(distance) | Moves the turtle the given distance in the direction of
    its current heading. |

    | goto(x, y) | Moves the turtle to the given position. |

    | home() | Moves the turtle to position (0, 0). |

    | left(angle) | Turns the turtle counterclockwise by the given number of degrees.
    If angle is negative, turns the turtle clockwise. |

    | reset() | Deletes the drawings from the canvas, sends the turtle home, and resets
    its state to the default values. |

    | right(angle) | Turns the turtle clockwise by the given number of degrees. If
    angle is negative, turns the turtle counterclockwise. |

    | setx(x) | Sets the turtle’s x coordinate to x and moves the turtle to the new
    position. |

    | sety(y) | Sets the turtle’s y coordinate to y and moves the turtle to the new
    position. |

    | setheading(angle) | Sets the turtle’s heading to angle and turns the turtle
    if necessary. |

    | speed(speed = None) | If the argument is absent, returns the turtle’s current
    speed as an integer. Otherwise, the argument can be a number or a string. Speed
    numbers range from 0 (the fastest setting) through 10 (the slowest). Strings can
    be "fastest", "fast", "normal", "slow", and "slowest". |'
