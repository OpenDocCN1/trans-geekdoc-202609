    \ for you, the reader, to help you understand what’s going on at those points\
    \ in the program code. You should include end-of-line comments sparingly—only\
    \ when you think your code needs some clarification.\n\n# import Statements\n\n\
    This program uses turtle graphics functions, so it must import them, as you did\
