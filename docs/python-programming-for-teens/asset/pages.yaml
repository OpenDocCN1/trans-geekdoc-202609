    Table A.6 Appearance


    | Method | What It Does |

    |---|---|

    | resizemode(rmode = None) | If the argument is absent, returns the turtle’s current
    resize mode. Otherwise, sets the resize mode to rmode. The resize mode can be
    "auto", "user", or "noresize". The "auto" mode adapts the size of the turtle to
    its pen size. The "noresize" mode does not do this. The "user" mode adapts the
    size of the turtle to the stretch factors and outline width as set by the shapesize
    function. |

    | shape(name = None) | If the argument is absent, returns the turtle’s current
    shape name. Otherwise, resets the turtle’s shape to the shape with this name.
    The name and shape must be registered in the screen’s shape dictionary. |

    | shapesize(stretch_wid = None, stretch_len = None, outline = None) | If the arguments
    are absent, returns a tuple containing the current shape size factors. Otherwise,
    resets these factors to the given values, which must be positive numbers. |

    | tilt(angle = None) | If the argument is absent, returns the turtle’s tilt angle.
