- pgno: 214
  md: "To do this, the method builds nine 3-character strings from the data in the\
    \ grid and compares each one to the strings \"XXX\" or \"000\", until a match\
    \ is found or none exists. If a match is found, the corresponding letter is returned;\
    \ otherwise, the empty string is returned. Here is the code for this method:\n\
    \n```\ndef _hasWinner(self):\n    \"\"\"Returns the letter of the winner or the\
    \ empty string\n    if there is no winner.\"\"\"\n    row0 = self._getString(0,\
    \ 1, 2)\n    row1 = self._getString(3, 4, 5)\n    row2 = self._getString(6, 7,\
