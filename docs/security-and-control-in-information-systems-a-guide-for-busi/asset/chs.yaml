  | 最大化可审计性 ||  ||  ||  ||  || • |\n\n\n\n\n\n表格反映了信息系统控制与安全领域的关注重点正逐渐从更传统的目标（在 **第\
  \ 1 部分** **和** **第 2 部分** 中）转向 第 3 部分、第 4 部分 和 第 5 部分 所涵盖的新目标。后者随着“有线社会”的兴起而日益重要。互联网上电子商务的增长，以及对磁性和光学介质存储记录的依赖度提高，意味着即使拥有完善的安全和控制政策的组织也必须对其进行不断修订。\n\
  \n### 4 本书的目标\n\n希望读者会发现本书提供了以下内容：\n\n* 分析和建议，承认大多数组织中系统状态的混乱和不完美。这是不可能避免的结果，因为多年来采购了不同的硬件和软件产品，并且必须让它们并行运行。\n\
  * 适用于所有类型系统的基本原则，从老旧的“遗留”软件到现代的客户机-服务器应用，以及电子商务中正在开启的令人兴奋的前景。\n* 强调技术应如何应用，而非对其工作原理的详细阐述。例如，密码学被呈现为创建“一套工具箱”的手段，而非作为其本身的科学主题。\n\
  * 对安全和控制的人性和组织方面的见解，以便管理人员能够在这些领域更有效地发挥作用，并了解他们可以从专家那里获得何种帮助，特别是在计算机审计领域。\n* 足够的背景知识，使读者能够参与可能在所有组织中不时需要的\
  \ IS 安全审查，并理解英国 BS 7799 标准等要求。\n* 对评估安全措施成本和效益的现实建议。这些建议旨在避免提出理想化且全面的解决方案，即使它们可能负担不起的情况。\n\
  * 在可能的情况下提供插图和案例研究，借鉴来自世界各地大大小小组织、公共和私营部门的经验。\n\n最重要的是，本书力求将 IS 安全与控制领域呈现为一个在不同时期需要独创性、主动性、想象力、注重细节和远见的领域。简而言之，它必然会考验即使是最优秀的管理者使其正确的能力。它不应被视为与信息系统相关的一个简单麻烦。这是令人兴奋的领域，值得任何追求商业职业的人充满热情地探索。\n\
  \n# 第 1 部分 威胁与风险\n\n## 第 1 部分导言\n\n风险是我们所有人日常生活的一部分。我们会决定是否要沿高速公路快速驾驶。我们会考虑食用标签上已过保质期的食品的后果，并尽量避免走光线昏暗的街道。只有通过理解和应对这些风险，我们才能生存。\n\
  \n同样，企业的生存也取决于对风险的成功应对，而其中日益增多的风险与信息系统相关。不幸的是，它们通常很难察觉。软件和数据完全不可见，一块计算机硬件看起来与另一块非常相似。警告信号可能很少，而且等到注意到时，可能为时已晚。\n\
  \n第 1 部分 首先审视适用于信息系统的各种威胁。它指出，这些威胁并不总是源于恶意或甚至蓄意的行动。除了考虑其造成损害的能力外，重要的是要决定其发生的可能性。这使得可以计算出所涉及风险的\
  \ *规模*，然后可以在它们之间进行比较。\n\n不应认为通过在 IS 安装周围筑起庞大的防御工事就能实现风险保护。更重要的是选择完全 *正确* 的对策，针对最重要的风险。描述了一些用于估计风险严重程度的方法，并提出了确保所引入的所有对策都适当且具有成本效益的方法建议。\n\
  \n# 第一章 信息受威胁\n\nDOI: [10.4324/9780203992319-3](https://dx.doi.org/10.4324/9780203992319-3)\n\
  \n## 1.1 对信息进行估值\n\n控制和保护信息的愿望根植于信息具有价值的观念。但如何评估这种价值呢？显然，它不仅仅是信息的存储介质，这一点可以从消费者愿意为商业“信息产品”支付的高价中看出，例如包含音乐或计算机游戏的\
  \ CD。\n\n当信息以这种方式交易时，可以测试其市场价值。但这无法适用于企业组织持有的绝大部分信息，它们为内部使用而保留，且不受任何定价。 当然，一些商业秘密可能对竞争对手具有明显的价值。同样，企业系统包含大量内在价值很小的信息（例如已广泛发布广告文案），但将其存档是有用的。\n\
  \n企业信息的价值一直是经济学家理论分析的主题。例如，Marschak 指出信息 *质量* 的价值，它将使企业做出明智的决策。相反，错误的存在会削弱信息的信誉，从而降低其价值（Marschak\
  \ 1968）。信息系统方面的作者在经济学家思想的基础上进行了扩展。Monk 指出，仅仅 *搜索* 信息就相当于一次经济交易，并且“沟通行为必然是经济事件”。因此，价值不仅来自持有信息，还来自能够通过网络轻松传达信息的能力（Monk\
  \ 1993: 16）。\n\nKeen 描述了一种更务实的方法，他引用了一家银行的案例，该银行编制了“IT 资产负债表”。令银行有些惊讶的是，它发现自己在开发软件和收集数据上投入的金额是其信息技术（IT）硬件支出的三倍（Keen\
  \ 1991: 第 6 章）。尽管数字很大，计算仍仅表明获取信息资产的 *成本*。它们对银行的实际 *价值* 可能与这些成本完全无关。\n\n在对北美十二家制造公司的研究中，McKinnon\
  \ 和 Bruns（1992）询问管理人员 *他们* 认为什么使信息有价值。研究人员发现，大家普遍认为信息应该是可信的、及时的、相关的和准确的。然而，同一信息可能被不同管理人员视为具有不同价值。例如，具有会计学位的人比会计背景有限的人更看重财务报告。\n\
  \n\n\n\n\n也许最雄心勃勃的尝试为信息估值提供一个通用框架的是 Boisot 提出的。Boisot（1998）将“知识资产”描述为具有三个维度。`Codification`\
  \ 将信息组织成类别或分类，使其更容易搜索。`Abstraction` 有助于揭示信息的形状和意义，而 `diffusion` 则决定了信息对想要使用它的人的可用性。这三个维度中的每一个都会对信息价值产生影响。例如，一个数据库可能具有很高的编码性，从而增加其对感兴趣个人的价值。与此同时，扩散可能保持较低，从而赋予其稀缺价值并证明收取访问溢价是合理的。Boisot\
  \ 承认使用这三个维度并不能消除对主观判断的需求，但建议它可以提供一个有用的讨论框架，帮助组织的成员就他们所使用信息的价值达成更好的共识。\n\n与其试图对信息本身进行估值，不如更可行的做法是对整个信息系统进行估值。这是审查购买新系统或扩展旧系统提案时所采取的方法。除非能对升级所期望的收益进行估值，否则就无法判断投资是否值得。市面上有很多指南可以帮助这一领域的决策，其中大多数主要关注成本方面。遗憾的是，如果收益的数字都是通过敷衍和猜测得出的，那么详细而准确的成本核算帮助也不大。而且，预测收益与实际结果进行核对的情况也不常见。正如\
  \ Hares 和 Royle 所指出的，组织在实施后进行任何形式的分析以查看新系统预期的收益是否真正实现的情况很少。因此，他们无法从 Hares 和 Royle（1994：Ch.\
  \ 8）所称的 `benefits realisation` 的经验中吸取教训。\n\n估值 IS 资产对会计人员来说也是一个问题。虽然无形资产定期被列入资产负债表，但目前没有精确的估值方法。美国财务会计准则委员会（FASB\
  \ 1999）的一份草案标准对“技术型资产”进行了分类，包括软件、数据库和信息系统。它将这些资产与价值由法律在一段时间内保护的资产区分开来，例如专利、商标和版权，其价值将在法律保护到期时急剧下降。然而，实际价值的确定仍然取决于专业惯例和做法。\n\
  \n总之，信息系统及其内容的确切估值之所以困难，是因为：\n\n* 价值不一定与获取或开发成本相关；\n* 对同一系统的不同用户而言，价值感知会大相径庭；\n\
  * 价值往往取决于瞬时品质，例如及时性和相关性；\n* 对于企业内部的信息，价值无法进行“市场检验”。\n\n为了比较风险的严重程度（Chapter 2）并规划业务连续性（Chapter\
  \ 9），有必要至少评估不同 IS 资源 `relative` 价值。相关章节中讨论了这样做的方法。总的来说，企业不需要知道其 IS 服务的确切价值就能认识到它们往往非常高。事实上，在许多情况下，信息系统已成为组织运作不可或缺的一部分，其生存完全取决于它们。\n\
  \n## 1.2 Business Dependence on Information Systems\n\n在 20 世纪 50 年代末，伦敦的食品制造商 J.\
  \ Lyons & Co 是使用电子计算机进行新业务方法的先驱。所涉及的计算机——该公司自行建造并编程——依赖于电子管和运动部件，按今天的标准极不可靠。它也并非没有危险，正如案例研究所示。\n\
  \nJ. Lyons & Co 有能力利用 IT，`without` 完全依赖它，这种经验在许多公司首次自动化其文书和制造流程时也得到了体现。\n\n今天，很难找到不使用信息技术的制造商，但现在技术被期望完全可靠，并支撑着对业务至关重要的一切活动。计算机被期望安排原材料需求，控制生产线上的流程，并支持产品向零售商的配送。现代超市连锁店反过来利用其系统尽可能快速地将商品从仓库移动到商店货架，再通过收银台。商品在供应链中的流动速度多年来已大幅加快，任何环节的失误或故障都可能产生严重的连锁反应。\n\
  \n突然的计算机故障的可能性现在已成为许多管理者的噩梦：一个挤满周六早晨购物者的超市，收银台全部无法工作；或一个跟踪系统故障的仓库，没人知道东西在哪里；或一条要求速度和温度保持在精确限制内的生产线，控制系统已失效。这种对\
  \ IT 的高度依赖也不可避免地蔓延到商业的其他部门，尤其是在政府和军队的行政部门。小型企业也开始超越传统的计算应用，如文字处理和会计，现在在更广泛的各种情况下使用计算机。例子从酒店跟踪其房间预订和入住率，到通过互联网网站运营的书籍和音乐\
  \ CD 销售商。\n\n每个企业对 IT 设施的依赖程度 `how` 各不相同，且每天都在变化。可能表明高于平均依赖度的因素包括：\n\n* 服务基于对客户的\
  \ `immediate response`（例如预订航空座位或电话银行）；\n* 依赖 `centralised database`（例如，拥有全国零部件和备件数据库的车辆制造商）；\n\
  * 在与 `health or safety` 相关的流程中使用 IS（例如医院，或涉及危险化学品的制造流程）；\n* 在必须基于 `up-to-theminute`\
  \ 信息做出决策的市场中运营（例如债券和股票的日内交易）；\n* 组织 `core activity` 依赖 IS（例如运营彩票，或空中交通管制）。\n\n许多组织因不止一个原因而高度依赖。它们在某些时期的脆弱性也可能更大：例如，夏季周末的计算机故障可能对工厂关闭的制造公司影响微乎其微，但对主题公园在其高峰参观日来说可能是灾难性的。\n\
  \n## 1.3 New Sources of Threats to Information Systems\n\n随着企业对 IS 的依赖程度增加，可能出现的威胁范围和严重程度也在增加。这可能出于以下几个原因：\n\
  \n* `Scale`。系统越来越多地在国家或国际范围内运行。例如，银行计算机中心的故障可能导致其所有自动取款机离线。\n\n\n\n\n\n*速度*。以前，火灾、水灾或恶意破坏摧毁记录可能需要一些时间。相比之下，大型计算机文件可以在几秒钟内被电子删除或损坏。同样，未经授权的数据传输或复制也可以几乎瞬间完成。\n\
  \n*技术创新*。新技术改变了所有基本规则，而许多人并不太了解它。以前，合理的做法是很大程度上依赖员工的常识（例如，不要把文件柜锁着）。在基于 IT 的系统中，他们甚至可能意识到自己正在承担不可接受的风险。另一方面，在技能光谱的另一端，有一些技术娴熟的技术人员把入侵和破坏系统视为一种挑战。他们可以从网络的另一端发动攻击——无需接近他们攻击的场所。\n\
  \n*隐藏原因*。有时，在复杂的系统中追溯问题的根源是困难的。例如，1985 年 1 月 1 日，试图使用两家主要清算银行的自动取款机的客户发现，这些银行通常互相接受对方的卡，但结果却不可预测。问题最终被追溯到其中一家银行对卡片磁条的错误更新。似乎该银行的某些软件未能识别\
  \ 1984 年是闰年，并在卡片上输入了日期信息，从而使系统的其他部分感到困惑。\n\n总之：新威胁可能：\n* 具有深远的潜在影响；\n* 其影响非常迅速；\n\
  * 源于技术技能的缺乏和滥用；并且\n* 难以追溯到其来源。\n\n## 1.4 外包和再造：二十年的变革\n\n与此同时，企业对信息系统的依赖程度越来越高，它们不得不接受关于这些系统应如何管理和组织的一些相当激进的观念转变。在\
  \ 1980 年代，许多组织开始看到与日常运行计算机系统业务保持距离的优势。他们的目标通常是降低或控制成本，因为内部数据中心需要越来越昂贵的设备，以及大量程序员和操作员来维持运行。人们认为，将信息系统的责任交给外部组织将使管理层能够专注于其业务的核心方面。如果外部人员可以接管像在全国范围内运输成品或管理员工养老金计划等职能，为什么不做\
  \ IT 呢？\n\n这被称为*外包*，一些主要参与者迅速进入这一迅速扩张的业务。有些公司（如 IBM）是计算机供应商，认为这是他们已提供的 IT 产品和服务的合乎逻辑的延伸。其他公司（如安达信咨询）则从其最初的会计业务基础进入。其中一家最成功的跨国外包公司是电子数据系统公司（EDS）。EDS\
  \ 最初是其母公司通用汽车的外包服务提供商，逐渐扩大其业务，直到现在为世界各地的公司提供外包服务。当像美国大陆银行这样高度依赖 IS 的公司采用外包时，外包获得了尊重（Huber\
  \ 1993）。Lacity 和 Hirschheim 对外包的其他美国公司的经验进行了广泛记录（1993 和 1995）。\n\n理论上，将运行 IT 的责任交给外部人员可确保管理层不必担心对\
  \ IT 的依赖。如果需要全天候服务，这将在与服务提供商的合同中规定，服务提供商将对任何故障承担责任。然而，实际上，外包商不愿提供任何此类绝对保证。相反，管理层必须对一个组织的专业技能和诚信充满信心，同时意识到他们现在对计算机操作的许多方面不再有直接的投入或控制。\n\
  \n与所有重大的组织变革一样，员工往往对外包计划感到威胁。例如，1996 年，澳大利亚社区和公共部门工会积极反对多项政府外包计划。这种对抗所产生的紧张气氛无助于获得员工的合作和遵守，而良好的安全实践在很大程度上取决于这一点。\n\
  \n紧随外包之后的是 1990 年代初期的新时尚，即*业务流程再造*（BPR）。直到此时，信息系统主要用于自动化现有的工作方式。迈克尔·哈默将其贬为只是“铺设牛道”。相反，企业应以信息技术的力量和灵活性为优势，寻求组织其活动的新方法（Hammer\
  \ 1990）。哈默后来为再造制定了“宣言”（Hammer and Champy 1993），正如一位批评者指出的那样，它在很大程度上借鉴了 1950 年代发展的社会技术系统设计思想（Mumford\
  \ 1995）。\n\nBPR 被许多组织热情地采纳，特别是那些在服务质量和速度方面竞争的组织。例如，银行找到了缩短贷款审批周期的办法，并整合了其系统，以便客户可以查询各种服务，而无需在部门之间来回转接的挫败感。一些公司选择攻击会计职能，美国的福特是首批改造其供应商付款处理方式的公司之一。其他公司，如德国光学设备制造商蔡司，则将\
  \ BPR 应用于其仓储和配送网络。\n\nBPR 项目的成功程度参差不齐，尤其是在过于强调试图节省成本的情况下（Hall *et al* 1993）。即使在成功的实施中，预测新工作方法带来的一些安全风险也并不总是容易的。例如，BPR\
  \ 哲学包括“赋权”服务客户的人员。除非仔细规划，否则这可能意味着员工将被赋予应为控制和审计目的而保持分离的混合责任。\n\n与外包一样，员工的主流情绪可能是敌对的，因为他们想知道自己的工作是否会变得更糟，甚至消失。与外包不同，这种担忧扩展到参与“重新设计”流程的任何人，而不仅仅是受雇于运行信息系统的员工。\n\
  \n总之：外包和 BPR 的新方法：\n* 转移了对 IT 运营的控制和影响；\n* 在受变化影响的员工中产生了焦虑；\n* 并非总是伴随着相应的安全措施更新。\n\
  \n信息系统使用方式持续创新的模式看起来可能将持续到二十一世纪。例如，通过互联网销售商品的公司将不得不开发新的、更灵活的方法来处理订单和分销商品，在一些行业，制造商已经在探索跳过零售商、直接与消费者交易的方法（Bridge\
  \ 1999）。\n\n## 1.5 威胁的性质和来源\n\n\n\n\n\n一个组织如果没有首先清楚地了解自己试图防范的是什么，就不可能期望制定出有效的数据安全措施。必须强调，对数据的“威胁”并不一定源于*蓄意*造成损害的意图。在此语境中，威胁被定义为*对\
  \ IT 系统的可靠性或完整性构成任何潜在危害的来源*。威胁可能源于无知、无能、粗心、恶意，或这些因素的组合。同样重要的是要预见到由于系统本身固有的弱点而可能发生的潜在故障，这些故障可能被完全无意地触发——换句话说，系统本身处于安全分析师会认为构成*危害*的状态。\n\
  \n人们提出了各种对威胁进行分类的方法。例如，英国审计委员会就使用了*nine*个类别来分析计算机滥用事件（Audit Commission 1998）。作为对不同类型威胁的管理响应的基础，建议将其中一些合并，形成*五*个主要标题，如下所示。\n\
  \n### 1.5.1 Theft\n\n盗窃旨在从组织中转移资产。因此，欺诈（下面讨论）可以被视为一种特殊的盗窃形式。然而，可以做出一些有用的区分：在盗窃中，对资产消失的掩盖几乎没有或完全没有，而实施欺诈的人可能会竭尽全力隐藏其活动，使所有记录看起来一致且“正常”。当然，盗窃也可能难以被发现，并且需要一段时间才会暴露，因此欺诈与盗窃之间的区别并不总是泾渭分明。一个特别的例子是*无形*资产如数据和软件的盗窃，这些资产可以通过制作未经授权的副本来“窃取”。由于原件保持不变且未被标记，小偷可能在犯罪现场不留下任何蛛丝马迹。这或许最好被视为一种秘密的盗窃形式，而非欺诈，因为小偷无需安排某种“掩盖”来隐藏犯罪。\n\
  \n如果员工滥用组织的资源，这在严格的技术意义上也可能构成盗窃（例如，关于文具或电力的消耗）。然而，在某些情况下，根据特定规则或立法，也会有单独的行动依据，例如，如果滥用涉及冒犯性或色情材料。\n\
  \n### 1.5.2 Fraud\n\n欺诈涉及在某种欺骗的帮助下占有资产。这通常涉及智胜旨在保护系统免受此类攻击的控制。毫不奇怪，欺诈是设计和审计系统控制人员的主要关注点。\n\
  \n欺诈可以由组织内部的人员或外部人员实施。在某些情况下，两者都参与其中。肇事者可能在组织中处于相当低的层级，在这种情况下，目标通常是在很长一段时间内转移相对较小的金额。欺诈也可能发生在组织的高层，在这种情况下，目标通常是实现更间接的利益，例如提高公司的股价，或说服客户签订有利可图的合同。\n\
  \n英国法律委员会已审查了与欺诈有关的法律，并提出了可以更好地界定涉及不诚实和欺骗的犯罪的方式的方法。特别是，委员会指出：\n\n> ‘由于技术变革，特别是互联网的发展，现在有可能在不欺骗人类思想的情况下欺诈性地获取价值重大的服务。这种行为目前不构成犯罪。因此，我们初步得出结论：\n\
  > \n> （1）即使没有欺骗人类思想，未经提供服务者许可而获取服务也应构成犯罪……’\n\n> Law Commission 1999\n\n### 1.5.3\
  \ Malicious Damage\n\n这里的“损害”可能是物理性的，例如纵火烧毁机器房或销毁包含重要数据的软盘。然而，组织越来越多地需要保护自己免受更微妙和狡猾的损害类型。他们可能被\
  \ singled out 作为此类攻击的目标，或发现自己是计算机病毒等 rogue 程序无差别攻击的受害者。在任何一种情况下，数据都可能被秘密篡改或擦除，而不留下任何明显痕迹。损害可能要等到合法用户下次尝试访问数据时才会暴露，此时他们会发现查询程序无法运行，或开始给出奇怪的错误信息。\n\
  \n### 1.5.4 Incompetence and Mistakes\n\n如果系统的常规用户粗心大意，或根本不了解自己在做什么，他们可能会无意中导致系统出现错误或故障。然而，良好的系统设计的目的是在他们造成任何严重或持久的损害之前阻止他们。这是通过限制他们对系统的访问，并对他们使用系统中一些更强大的功能的能力设置检查和限制来实现的。然而，错误有时会溜过防线，正如无能的案例所显示的那样。\n\
  \n那些更深入地参与系统运行并因此获得更强大访问权限的人通常代表更严重的威胁。如果他们不了解自己在做什么，他们就有造成极其严重问题的潜力。处于这种位置的人包括大型机操作员、系统程序员，以及有权调查系统中正在发生的事情的人（包括计算机审计员）。\n\
  \n### 1.5.5 Accidents and Disasters\n\n无论一个组织如何努力预见上述四个类别下的威胁，总会存在一个残余类别的事件，这些事件发生的可能性很小，但无法完全排除。例子包括恶劣天气条件的影响、工厂或油轮意外释放有毒物质，或办公室发生火灾。恐怖主义行为——尽管这些代表了恶意破坏的极致——通常被包括在此类别中，因为其影响通常与自然灾害相似。所有此类事件都可能瘫痪或摧毁计算机系统，在许多情况下，唯一的解决方案是退回到事先计划好的备用安排。\n\
  \n### 1.5.6 Categories of Threat: Conclusions\n\n前三种类型的威胁（即盗窃、欺诈和恶意破坏，其中威胁是蓄意的）有时被归为*计算机滥用*的一般标题下。这是一个有用的概括性术语，可用于涵盖各种不完全符合迄今提供的类别的活动。例如，如果一名员工打算通过电子邮件向同事发送冒犯性信息，但却错误地发送给了供应商，似乎几乎不值得争论它究竟属于哪个类别。显而易见的是，该员工滥用了系统。\n\
  \n“滥用”反过来又常与“误用”互换使用。*误用*在某种程度上是一个更温和的术语，但很难在两者含义之间划清界限。在英国，*误用*越来越多地被赋予特定含义，用来表示根据《1990\
  \ 年计算机滥用法》构成犯罪的未经授权使用计算机的方式。\n\n\n\n\n\n不同的 `motivations` 潜藏在每一种威胁之后。前两种（盗窃和欺诈）都由对\
  \ `personal enrichment` 的希望驱动。这可能是通过直接获取金钱、服务或商品（在盗窃的情况下），或通过更狡猾的手段（例如董事发布歪曲公司状况的账目）。由于目的是利用他人的资产，后者将被留下未受损害，除非这在推进犯罪过程中不可避免。\n\
  \n这种动机可能在安全措施出现漏洞时才被激活，例如在办公桌上发现写有密码的纸片，或注意到某项控制程序未被正确执行。或者，有人可能以更渐进的方式滑向不当行为。有些人会采取系统化的方法；他们会着手积累关于系统弱点的知识，并进行实验（起初可能相当无害）以了解如何利用这些弱点。\n\
  \n可能最难辨别的动机与恶意破坏有关。这些可分为两个主要类别：`grievance`（包括对个人或组织的报复、推行某种意识形态，或对世界整体的某种无焦点不满）和\
  \ `vanity`（向自己或更广泛的黑客社区证明自己的技能）。通常动机是混合的，就像有才华的黑客，他们既想展示自己的技能，同时也希望给他们不同意其目标或价值观的组织制造麻烦。黑客在探测可利用的弱点时通常会采取系统化的方法。\n\
  \n错误和无能为管理带来特殊问题。它们可能可追溯到一般缺乏动机的根源，即员工对工作缺乏投入，因此无法发挥最佳水平。同样，导致损害的技能或知识缺乏可能源于培训不足，因此并非完全是员工的过错。\n\
  \n最后，自然灾害可归类为保险业所用的“天灾”。它们将由于组织无法控制的异常天气条件或其他情况造成，没有必要考虑动机的問題。恐怖袭击背后可能存在强烈动机，但此类怨恨往往是一般性的；组织可能只是不幸地在错误的时间出现在错误的地点。\n\
  \n与每种威胁类型相关的动机和结果已在 Table 1.1 中汇总。\n\nTable 1.1\n\n|  || Motive || Outcome |\n|\
  \ --- | --- | --- |\n|  || Personal gain || Vanity, malice, revenge, idealism ||\
  \ No motive applies || Assets misappropriated (directly or indirectly) || Loss concealed\
  \ || Assets destroyed |\n| *Fraud* || ✓ ||  ||  || ✓ || ✓ ||  |\n| --- | --- | ---\
  \ | --- | --- | --- | --- |\n| *Theft* || ✓ ||  ||  || ✓ ||  ||  |\n| *Malicious\
  \ damage* ||  || ✓ ||  ||  ||  || ✓ |\n| *Incompetence* ||  ||  || ✓ ||  ||  ||\
  \ ✓ |\n| *Accidents and disasters* ||  ||  || ✓ ||  ||  || ✓ |\n\n## 1.6 Internal\
  \ Versus External Threats\n\n威胁源自何处？上一节强调的案例表明，它们可能来自各个方向。在上一章中，引入了将威胁视为 `internal`\
  \ 或 `external` 的概念，具体取决于它们来自 `organisational boundary` 内部还是外部。这意味着存在两组人：一组在边界内部，组织对其具有一定影响力；另一组在边界外部，组织对其相对无能为力。\n\
  \n实际上，生活并非如此简单，边界的性质也难以界定。很容易识别出直接受雇于组织、因此根据雇佣条款有义务遵循管理指令的人员。然而，大多数组织在各种其他协议下聘请协助，例如使用代理员工、服务承包商和顾问。随着\
  \ section 1.4 中描述的 IT 及其他领域的外部承包和外包安排的普及，这已变得越来越普遍。这些承包商可能被允许完全进入组织的场所和设施，并在许多方面被视为与正式员工一样对待。这些员工的合同通常要求他们必须遵守组织的日常规则，包括与数据安全相关的规则。然而，最终，他们的培训和工作实践中仍会有一些方面超出组织的直接控制范围，并且他们要对其自身的管理负责。如果此类人员行为不当，他们应被视为“内部”还是“外部”运作？\n\
  \n一种解决方案是用承认 `series` 边界的模型取代基于 `single` 边界的模型。随着每一次边界的跨越，组织施加的影响力范围变得越来越弱。这种情况在\
  \ Figure 1.1 中有所说明。\n\n![Figure 1.1 Influence across the ‘organisational boundary'](img/fig1_1_B.jpg)\n\
  \nFigure 1.1 Influence across the ‘organisational boundary'\n\n从个人管理者的角度来看，围绕其直接负责的工作组还存在一个额外的边界。在管理良好的组织中，这应意义不大；然而，如果组织不够和谐，则在其他部门建立影响力时可能会出现问题。\n\
  \n承包商即使在理论上受相同条款和条件约束，实际上也更难施加影响。交易伙伴拥有更大的独立性；尽管可以通过具有法律约束力的协议施加压力，或因为他们重视业务关系而不愿危及它。\n\
  \n可能最大的变化发生在考虑组织的客户（或客户）时。他们没有理由觉得自己欠组织人情。即使他们可能被授予直接访问组织系统（例如网站或在线银行服务）的权限，他们也可能选择蔑视指令或警告。如果他们知道自己可以选择将业务转移给竞争对手，这种情况尤其可能发生。\n\
  \n在某些情况下（如信用卡或在线信息服务），客户必须向服务提供商注册，这使得可以对服务使用附加条件并正式实施。然而，对于首次通过互联网查询或购物的用户来说，这根本不可行。最后，除了在所有这些不同身份下与组织有往来的人之外，还有大量从未与之接触过的人，但他们可能获得其计算机系统的访问权限。\n\
  \n威胁越“外部”，在计算机系统 `within` 应用自动化控制时就越需要严格。这是因为影响用户行为的其他选择变得越来越有限；即使存在，使用起来也可能很繁琐。例如，随着从\
  \ Figure 1.1 的左侧向右侧移动，通常会适用以下情况：\n\n*   `Appeals have to be made to the jurisdiction\
  \ of authorities outside the organisation`. 通常此类机构将是执法机构。其他机构也可能参与其中，例如负责监管某个行业部门或职业的机构。\n\
  \n\n\n\n\n*对那些涉嫌对安全构成威胁的人实施制裁需要更长的时间。证据将更难获取，建立案件会更复杂。\n\n*必须更依赖强制性控制而非咨询性控制*。咨询性控制依赖于受其约束者的善意和合规性。在与组织关系疏远或不存在的人的情况下，不能假定这一点。\n\
  \nFigure 1.1 中的“影响范围”*光谱*对于计算机*滥用*（涵盖欺诈、盗窃和恶意破坏）这一一般领域的威胁尤其重要。这些威胁可能源于内部、外部以及两者之间的任何位置。对于非故意威胁（疏忽、事故和灾难）而言，情况略有不同。疏忽往往是组织*内部*的问题，而灾难通常源于*外部*。因此，威胁的分布如\
  \ Figure 1.2 所示。\n\n![Figure 1.2 Internal versus external threats](img/fig1_2_B.jpg)\n\
  \nFigure 1.2 Internal versus external threats\n\n事故引发了一些特殊问题（因此它们在图表上的位置）。在组织的自身影响范围内，应该能够预防事故，或至少将其降到最低。因此，它们不应经常出现在“内部”一侧，而被显示为更属于图表的“外部”一侧。这一问题将在\
  \ chapter 9 中进一步讨论。\n\n## 1.7 Questions\n\n1. 判定以下每起事件适用哪一类威胁（定义见 section 1.5）。\n\
  \   * 一名秘书重新格式化了一张软盘（从而删除了盘上的所有数据），她认为盘中包含的是无人需要的旧备忘录。事实上，盘中保存的是首席执行官一份重要报告的唯一副本。\n\
  \   * 一名应收账款职员在正常工作时间以外接受客户的现金付款，开具手写收据且不做任何记录。他将钱据为己有。\n   * 一名秘书认为办公室使用的图形软件包对她儿子的家庭作业有用，于是将其复制到软盘上，以便带回家在自己的电脑上使用。\n\
  \   * 一家公司在一栋大型办公楼内租用空间。其中另一名租户篡改了燃气供暖系统，造成大爆炸，导致该公司的本地网络服务器停止运行。\n   * 一名刚刚被裁员的员工在办公桌上度过最后几分钟，删除了重要的电子邮件记录，并用一系列关于管理层的贬损性信息取而代之。\n\
  \n2. 以与问题 1 相同的方式分析以下问题。注意，这些案例分类起来更困难（例如可能涉及不止一类威胁）。\n   * 员工 A 有权合法访问会计系统。在 A\
  \ 离开座位时，来自另一部门的员工 B 使用她的终端机提高当月自己的薪酬。\n   * 一名报社记者贿赂一名护士，以便从病人管理系统获取有关正在医院接受治疗的一名演艺界人士的信息。\n\
  \   * 一名员工从一个共享软件互联网站点下载了一个被宣传为“包治百病”的防病毒软件包。该软件实际上包含一种危险的病毒，很快导致办公室多台 PC 停止运行。\n\
  \   * 一名初级员工致电高级经理的秘书，自称是内部审计员，正在检查密码。他要求并获得了经理的密码。然后他以经理身份登录，向全体员工发送了一封恶作剧电子邮件，并对当月的销售数据进行了修改。\n\
  \n3. 在以下情况下，你作为经理可能施加什么影响？\n   * 一名自由职业顾问受聘一个月，紧急制作一份成本效益分析报告。顾问已获得公司会计和生产系统的完全访问权限。她经常将数据下载到她的便携式\
  \ PC 上在家工作。该 PC 似乎缺乏任何安全功能，而你的员工刚刚把一台遗留在员工餐厅椅子上的电脑带给你。\n   * 你是某家大街银行当地分行的经理。一名愤怒的客户寄回一张新发行的取款机卡，说卡不能用。事实证明，客户已在卡背面写上了他的个人识别号码（PIN）。如果你：\n\
  \     1. 卡因在上面写 PIN 号码而受损？\n     2. 卡最初编码错误，因此故障实际上是银行的过错，与写 PIN 号码无关？\n   * 你收到一封来自互联网上一个你从未听说过的来源的电子邮件。它邀请你访问一个“火爆”的色情网站，并指出同样的邀请已发送给组织内其他人。\n\
  \n4. 将以下威胁归类为“内部”或“外部”（如果合适，请指出威胁兼具两者特征）。\n   * 系统管理员通过电子邮件向你发送新的登录密码。你的秘书按时打印出该信息并放在开放式办公室的你的办公桌上。\n\
  \   * 你向客户发放磁条卡以识别他们。其中一张卡被借用、复制并用于冒充持卡人。\n   * 一名不明的电话呼叫者致电负责管理你的局域网（LAN）服务器的高级秘书。呼叫者讲了一个合理的故事，结果秘书透露了进入\
  \ LAN 的你的密码。\n   * 来自你的会计系统的定期报告显示，你的三个供应商似乎都位于同一地点，而该地点实际上是一个住宿地址。没有人注意到这一点。\n\n\
  # chapter two Risk Appraisal and Management\n\nDOI: [10.4324/9780203992319-4](https://dx.doi.org/10.4324/9780203992319-4)\n\
  \n## 2.1 Why Appraise Risk?\n\n列出可能适用于信息系统的所有威胁相对容易。然而，其中一些可能极不可能发生，或造成的损害微乎其微。可以安全地忽略它们，因为担心它们会浪费每个人的时间。另一方面，清单中可能包括更频繁发生的威胁，或发生频率较低但可能造成毁灭性后果的威胁。在这种情况下，管理层必然要求采取行动应对它们。大多数威胁介于这两个极端之间。问题在于，在决定如何处理之前，如何权衡威胁的严重性。\n\
  \n这种情况可以与房主在决定如何保护房屋时面临的情况相比较。可以想象各种各样的危险，包括火灾、水灾、天上掉落的碎片、燃气爆炸、盗窃、结构坍塌和风暴损坏。虽然房主力求尽可能安全地防范此类威胁，但他们不会试图消除每一种可能的风险。做到这一点将涉及用防爆墙加固房屋，在每个房间安装电子设备以探测入侵者，并在屋顶安装导弹电池以粉碎可能从飞机上掉落的碎片。采取此类措施的成本和不便会被认为是不合理的，除非是处于高度偏执状态的人。同时，大多数房主会期望采取防范更常见威胁的预防措施，例如安装烟雾探测器、窗锁和防盗报警器。\n\
  \n\n\n\n\n风险是一个有助于评估和比较威胁并将其置于某种背景下的概念。风险使我们能够考虑威胁的潜在损害程度，*以及*其发生的概率。因此，例如，虽然我们的家庭主人在接受山体滑坡可能造成巨大损害的同时，他或她仍可能将其视为零风险，如果所讨论的房屋建在坚硬岩石的高原上。同样，即使邻里盗窃频繁发生，可能仍不值得在花园棚屋上安装安全锁，因为里面只有那些理智的人根本不想偷的东西。\n\
  \n最重要的是，风险评估提供了一种*量化*预期影响或损害水平的方法。这为以每个人都能同意的基础来估算风险开辟了道路，从而使管理团队更容易比较一种风险与另一种风险，并决定哪些风险需要优先考虑。在最简单的方法中，所有风险都将按优先顺序列出，管理层将决定他们准备在列表中进行到多远为止。“截止”点可以通过两种方式之一来决定。他们可以决定沿着列表工作，直到花光他们能负担得起的为止，或者他们可以旨在消除所有超过一定严重程度的风险，而不管成本如何。这些选择在图\
  \ 2.1 中有所说明。\n\n![Figure 2.1 ](img/fig2_1_B.jpg)\n\nFigure 2.1 \n\n这两种方法都预设风险可以根据组织对其的重视程度以某种顺序排列。人们投入了大量精力来开发旨在比较和优先考虑风险的方法论，其中一些在第\
  \ 2.5 节。中进行了描述。定义一种通用、通用方法论在某种程度上已成为信息安全领域的“圣杯”。然而，它很可能始终难以捉摸，其原因在接下来的两个部分中有所阐述。\n\
  \n与其寻找一种可以在每次情况下使用的“通用”风险评估工具，不如为每种特定情况寻找合适的方法论更为可取。重大情况值得进行彻底审查，可能需要数周时间并需要高度正式的调查。次要情况需要更快、更不正式地处理。在任何一种情况下，评估仍只提供在特定时间点风险的“快照”。需要定期审查和后续跟进。这种持续监控风险并在必要时采取纠正措施的过程构成了*风险管理*的基础。\n\
  \n本章后面的部分阐述了风险管理在信息安全背景下可以应用的一些方法。风险管理并不是可以在真空中进行的事情。美国国家航空航天局（NASA）（1993）指南中强烈指出，将风险管理视为更广泛管理职能的一部分是可取的：\n\
  \n> 风险管理不是独立于其他管理职能的独立职能。相反，风险管理是正常计划、组织、控制、指导和协调的固有部分。换句话说，风险管理只是良好管理的一部分。\n\n\
  ## 2.2 风险感知\n\n任何人要对风险采取行动，他或她必须首先被说服接受它是严重的。不幸的是，我们每个人往往都有自己独特的看法来权衡风险的严重性。这是因为我们的风险感知受到经验和气质的强烈影响，以及对事实和数据的更理性分析。尽管存在许多计算风险的技术，通常在数学上非常复杂，但当人们的直觉告诉他们结论感觉不对时，结果仍可能受到质疑。\n\
  \n管理科学家长期以来一直对这一领域感兴趣。大量研究试图确定管理人员如何做出涉及风险的决策，但发现很难确定其行为中一致的模式。例如，可以合理地假设人们天生倾向于*规避风险*或*寻求风险*。这些术语在第\
  \ 2.4 节中进一步定义，但可以概括如下：\n\n* *规避风险*的人谨慎，不愿接受风险（尤其是那些他们不完全理解的风险），并对任何关于不存在风险的声明或保证持怀疑态度。\n\
  * *寻求风险*的人则相反，更倾向于接受某些风险是不可避免的，甚至可能认为接受某些风险是可取的。这并不意味着他们做决定时就不够谨慎或认真。寻求风险意味着对结果持普遍更乐观的看法，但*不*一定达到愚蠢和不负责任的程度。\n\
  \n与许多人类特征一样，这样的标签并非万无一失，只是因为人们并不总是以一致的方式行事。他们可能会混淆问题，在生活的某些领域规避风险，而在其他领域寻求风险。例如，一名安全官员在工作时可能表现出规避风险的行为，阻止任何看起来有点可疑的人，并在出现麻烦的第一迹象时呼叫帮助。非工作时间，他可能会通过攀岩或参观赌场来弥补这一点。可以安全地假设的是，如果有人被赋予消除风险的角色（如计算机审计员），他或她在工作场所至少总是会试图采取规避风险的观点。\n\
  \n对风险的态度也可能在风险实际发生时迅速改变。例如，如果办公室的本地网络被病毒破坏，一旦网络服务恢复，每个人都可能变得非常规避风险。人们会突然热衷于使用病毒检查器，并遵守有关不从互联网下载程序的规则。不幸的是，这种热情可能不会持续很久，因为人们对灾难的记忆开始淡化。一旦风险不再*似乎*那么真实，人们就会回到走捷径和忽视办公室关于病毒的指导方针。在这样做时，他们的行为会变得越来越寻求风险。这种人类反应是可以理解的，但在风险分析方面是完全不合逻辑的，因为威胁的性质在任何阶段都没有改变。同样危险的是有时出现的相反反应，即人们假设因为威胁最近已经实现，因此它在一段时间内再次出现的概率非常低。\n\
  \n风险行为也可能在员工承受压力时发生变化。这可能与 McGothlin（1956）在赛马场观察到的那种效应有关。McGothlin 指出，人们在投注中连续亏损时，随着一天的进行，他们会越来越多地选择将钱押在“冷门”上。似乎他们赢回损失的决心使他们不顾谨慎，行为变得越来越寻求风险。如果在努力让一个失败的系统“恢复在线”期间出现危机感，有时也可以看到同一种效应。如果恢复系统的适度努力没有带来结果，人们可能会开始尝试越来越鲁莽的措施。这会导致对最初导致系统瘫痪的东西造成额外损害。\n\
  \n\n\n\n\n一些研究人员曾试图识别影响人们看待风险方式的 `cultural` 力量。他们认为，个体的背景和气质会影响他们试图理解不确定性所采用的方式。Adams（1995）描述了四种不同的文化类型。`Individualists`\
  \ 认为世界本质上是良善的，可以容纳相当多的冒险行为，而 `egalitarians` 则本能地更为谨慎。`Fatalists` 对结果漠不关心，认为试图改变结果的努力毫无意义，而\
  \ `hierarchists` 则认为所有风险都必须得到妥善调查和管理至关重要。这些世界观尤其会影响人们对任何相关证据的态度。例如，尽管对相关科学数据几乎没有了解，他们仍会对食品中的致癌物或全球变暖等威胁表达根深蒂固的观点。同样，大多数人会对信息技术产生某种情绪反应。在极端情况下，他们可能会觉得它反社会、去人性化，并且倾向于从一个问题跳到下一个问题；或者他们可能认为它是令人兴奋且有益的力量，造福人类。这更多归因于“直觉”而非广泛的科学研究。不幸的是，在处理工作场所使用的信息系统时，极难将这些感受抛在一边。在理想世界中，我们或许会确保所有员工都是\
  \ `hierarchists`，支持衡量和控制风险。然而，文化理论家认为，这些是深埋在我们内心深处的思维态度。它们是在长期中形成的，不会很快或轻易地被管理层改变。\n\
  \n管理者自身也面临一个困境。一般来说，组织的成功取决于管理者对其克服障碍的能力持乐观态度，并据此愿意承担风险。尽管如此，他们始终需要警惕走得太远——尤其是绝不能相信他们找到了完全无风险的选项。Stephen\
  \ Fay 描述了与巴林银行相关的此类情况。Fay（1996：186）提到巴林银行管理层在 1995 年初的心态，不久后该银行因新加坡的 Nick Leeson\
  \ 的不诚实和鲁莽行为而负债累累地倒闭：\n\n> 在伦敦的巴林银行，每个人都认为李森的操作是无风险的。执行委员会也相信这一点：Andrew Tuckey \\\
  [巴林银行副董事长\\]…告诉朋友们，巴林的高层知道一旦其他银行发现李森是如何赚取如此多钱的，他的利润势必会迅速下降。然而，就目前而言，Tuckey 坚持认为，它们是无风险的。\n\
  \n看来，巴林银行的管理者 `preferred` 相信李森找到了玩转系统的新方法，且没有涉及严重风险。银行中少数人有所怀疑，但发现很难在 prevailing\
  \ 的舆论氛围下追查下去。同样，如果要维护信息系统安全，就必须警惕管理团队中任何过度乐观的倾向或信念的抬头，并确保始终为更怀疑的观点提供表达空间。\n\n##\
  \ 2.3 风险决策：预见的必要性\n\n即使管理层决心在评估风险时尽可能客观公正，也可能很快遇到进一步的问题。假设我们的模型管理者倾向于尽可能公正地审查证据。不幸的是，证据可能很匮乏。由于信息技术的角色和性质不断变化，可能缺乏相关过去经验作为可靠的指导。其结果是，管理层必须假设全新风险可能随时出现。\n\
  \n在计算的早期阶段的一个案例研究中可以找到一些问题的例证。今天，某人可以这样随意进出主计算机区域的想法似乎有点过时。但我们拥有多年后见之明的应用。在这些事件发生时，让人们在机器房里随意走动的风险并没有被如此广泛地认识。摘录结尾提出的那种问题很可能被视为琐碎或危言耸听。任何推动更严格安全政策的人都必须表现出一定的决心和坚持。\n\
  \n一旦特定风险 `have` 得到更广泛的认可，它们就会进入一般知识库，忽视它们就变得明显疏忽。传播这种知识的常见方式是通过 `checklists`。在当今世界，有大量清单涵盖机器房的物理安全，例如。虽然清单是积累风险来源想法的好方法，但正如我们所见，它们并不能帮助区分重要与琐碎。它们也可能变得过于宽泛，以至于提出的许多问题与手头情况无关。\n\
  \n最后，还必须认识到，无论清单多么详尽，都不可能涵盖 `every` 可能性。必须预期新的风险形式可能会出现，只能通过 `anticipation` 来识别。如果回到\
  \ 1977 年，就会进入一个机器房安全风险尚未被广泛经历的世界，因此有远见的管理者需要运用他们的预见力来预测 `might` 发生的情况。在当今信息技术被更广泛使用且继续以快节奏变化的世界里，愿意并能够预见新的风险来源仍然同等重要。\n\
  \n预见依赖于对设备、软件和工作环境各方面提出“如果会怎样”的问题的能力。它需要主动性和想象力的结合。它要求仔细审视技术和程序上看似微小的变化所带来的影响——即使乍一看似乎与安全无关。事实上，在某些情况下，变化本意是\
  \ `improve` 安全，但却产生了意想不到的副作用。以下给出两个例子，取自系统安全领域，在该领域长期以来已显现出类似的风险预见问题。\n\n信息技术以新颖方式使用时，很容易看出会出现可比的情况。例如，彩票系统传统上基于纸质彩票和存根。现在，大多数大型国家或全国性彩票都是使用计算机终端网络运行的。这实际上是对业务流程的彻底“再造”，需要重新评估伪造和欺诈带来的一切可能风险。在其他情况下，变化可能更微小，但仍需要重新评估风险。以下是一些典型例子。\n\
  \n* 主计算机房的所有设备都要搬迁到新址。即使目标是将一切“原样”搬到新址，工作环境和服务提供，例如电信，必然会发生一些变化。搬迁过程中也可能出现风险。\n\
  * 一家公司使用基于 PC 的软件为客户计算报价。该软件对竞争对手极具吸引力。迄今为止，该软件在台式机上运行。现在提议让部分员工在便携式 PC 上使用相同的软件。从技术角度看，这是一个微不足道的改变，但新的工作方式将产生新的被盗和丢失风险。\n\
  \n\n\n\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\n在表达式`cvar = avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`\n\
  \n在`List.of(arg0, arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd\
  \ arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\
  \n\n\n\n然而，如果你厌恶冒险，你可能愿意以低于这个价格出售彩票，知道如果你接受一笔较小的金额（比如 £40），你就能确保拿到这笔现金。另一方面，风险寻求者可能会将彩票定价为\
  \ £60，因为他或她被彩票可能实际价值 £100 的想法所吸引。情况在 图 2.3 中有所说明，该图基于 Keeney 和 Raiffa（1976）。\n\n\
  ![Figure 2.3 ](img/fig2_3_B.jpg)\n\nFigure 2.3 \n\n图 2.3 显示，厌恶风险的人总是愿意为了确定性而接受较低的价值。寻求风险的人更喜欢冒险，因此所提供的‘安全’替代方案就需要更高。直线代表‘风险中性’选择。\n\
  \n显然，我们不可能为每个决策都设计出 图 2.3 的等价物：这将耗费大量时间。然而，它有助于理解人们在面对信息系统安全风险时 routinely 表现出的行为类型。例如，如果你在\
  \ PC 上安装病毒检查程序，你每天早上可能需要花费 2 分钟等待检查程序遍历所有文件。这会造成一种轻微且可预测的麻烦，你可能更愿意接受这种麻烦，而不是病毒攻击你的\
  \ PC 时偶尔会发生的重大且不可预测的麻烦。（有关其他示例，请参阅本章末尾的问题）。\n\n一种基于期望效用的通用风险评估和比较方法为 *年度损失期望值*（ALE）。ALE\
  \ 的计算方法为：\n\n> （结果的成本，单位为 £）×（该结果在 1 年内发生的概率）\n\n在此情况下，ALE 的单位为英镑/年。例如，如果处理发票时出错的平均损失估计为\
  \ £5，且每年预计发生 1,000 次错误，则发票错误的 ALE 为 **每年 £5,000**。\n\nALE 提供了一种快速简单的方法，将多种不同的风险简化为单一数值，以便相互比较。如果在刚才的例子中，客户信件错误的\
  \ ALE 以同样方式计算并发现为 **每年 £250**，这将有助于决定将注意力集中在发票而非信件上。\n\nALE 数值还可用于帮助评估为 *降低* 风险值得投入多少资金。假设我们通过花费固定金额\
  \ £9,000 改善发票软件的错误检查，可将错误发生率降低到每年 100 次。ALE 将降至 **每年 £500**，减少了 £4,500。这表明，仅凭 ALE\
  \ 的年度‘节省’，软件改进大约 2 年即可收回成本。\n\n在使用这种简单衡量方法时，重要的是要认识到其局限性，包括以下几点。\n\n* ALE 计算中使用的\
  \ *估计质量* 非常重要。例如，可能 *已知* 每年大约发生 1,000 次发票错误，且每次错误的损失经过仔细研究后取平均值。或者，这两个数字都只是粗略估计。关于软件改进将使错误从每年\
  \ 1,000 次减少到 100 次的说法，还需要提出更深入的问题。这是基于其他使用相同软件的用户经验，还是仅仅是有根据的猜测？请注意，ALE 计算中只要有一个‘异常’数值，就会使整个比较基础陷入混乱。\n\
  * 在比较 ALE 时，涉及 *极高成本和极低概率* 的情况需要格外谨慎。（此类情况可在 图 2.2 的左上角找到）。例如，假设飞机坠落在主计算机中心的风险在任何一年被评为百万分之一。成本（假设坠毁摧毁中心）估计为一千万英镑。ALE\
  \ 将相当低——每年仅 £10。现在考虑便携式 PC 被盗的风险。在这种情况下，概率被定为百年一次，PC 的价值约为 £1,000。这给出了 *相同* 的 ALE，即每年\
  \ £10。很少有人会认为这些风险在任何方面都等同。此外，基于每年 £10 对计算机中心的任何投资回报计算都将毫无意义。\n* ALE 假设存在可 *预测* 的\
  \ *直接财务* 损失。然而情况并非总是如此。例如，如果黑客设法进入组织的网站？我们可以估计发生这种情况的概率。但假设结果可能从留下琐碎信息到破坏网站上的一切不等。我们使用‘最坏情况’情景吗？不幸的是，这并不合理，因为最坏情况本质上比一般黑客事件更不可能发生——而我们最初就是基于一般黑客事件来估计概率的。\n\
  \n20 世纪 70 年代末，Robert Courtney Jr 开发了 ALE 的修订版。他的想法被纳入美国国家标准与技术研究院于 1979 年发布的《联邦信息处理标准出版物第\
  \ 65 号》（或‘FIPS 65’）文件中。Courtney 建议不简单地将成本和年概率相乘，而是将两者放在按十的幂递增的‘评级’量表上（见 表 2.1）。这有时被称为\
  \ *数量级* 方法。\n\n表 2.1 FIPS 65 评级\n\n| Impact || Impact Rating, i || Frequency ||\
  \ Frequency Rating, f |\n| --- | --- | --- | --- |\n| 10 || 1 || Once in 300 years\
  \ || 1 |\n| --- | --- | --- | --- |\n| 100 || 2 || Once in 30 years || 2 |\n| 1000\
  \ || 3 || Once in 3 years || 3 |\n| 10000 || 4 || Once in 100 days || 4 |\n| 100000\
  \ || 5 || Once in 10 days || 5 |\n| 1000000 || 6 || Once per day || 6 |\n| 10000000\
  \ || 7 || 10 times per day || 7 |\n| 100000000 || 8 || 100 times per day || 8 |\n\
  \n‘影响’最初设想以美元衡量，但任何大致等价的当地货币单位都可以使用。ALE 是根据专门设计的公式计算的：(10^((f+i−3))/3)。不幸的是，这种使\
  \ ALE 更系统化的尝试并没有解决其作为通用风险衡量标准的根本弱点。尽管当时相当流行，FIPS 65 现在已很少使用。\n\n一般而言，ALE 技术只有在以下情况下才可能有所帮助：\n\
  \n* 事件发生的频率足够高，使得概率可以轻易 *观察* 到，最好在采取任何补救措施之前和之后都能观察到。（这意味着频率需要在 表 2.1 中的数量级表中 5\
  \ 到 8 级之间）。在本节前面举的例子中，假设如果投资错误检查软件，错误发生率将从每年 1,000 次减少到 100 次。假设新软件 *确实* 成功，其有效性应在一个月或两个月内显现，因为错误率应从每周约二十次明显下降到一两次。因此，预测的成本节约可以在实践中得到证明，这意味着可以通过比较早期估计值与观察值来\
  \ *校准* 概率。\n\n\n\n\n\n财务损失必须是（不期望的）结果的实际且适当的衡量标准。理想情况下，它将是一笔固定的直接成本，例如更换设备或软件所需的支出。任何间接成本（例如文件丢失造成的损失）或无形成本（例如客户信誉丧失）都将涉及“较软”的估算，这势必会削弱\
  \ ALE 计算的准确性和可靠性。\n\n在其局限性范围内使用时，ALE 可以成为任何组织的实用决策辅助工具。然而，试图将其扩展超出其能力范围是危险的，特别是试图对\
  \ *每一种* 风险类型进行全面审查时。\n\n## 2.5 风险评估：大型组织\n\n### 2.5.1 风险评估方法：概述\n\n一家英国咨询公司提供一项服务，用于探测网络安全风险，该服务被描述为“IT\
  \ 安全健康检查”（DERA 1997）。要求进行“健康检查”意味着管理层已查看现有系统并未发现特别令人担忧的症状，但仍希望得到一切安好的保证。认为需要进行风险评估的其他情况包括引入全新系统、对旧系统增加扩展，或作为信息安全不良经历的应对措施。\n\
  \n一般来说，风险评估应尽可能早地在系统开发阶段开始（该问题将在 第 11 章 中再次讨论）。然而，本节仅限于已投入运行的系统的风险评估。此外，它主要关注只有大型组织才负担得起的广泛而系统的分析。\n\
  \n一项评估信息安全风险的项目应至少提供两个主要成果：\n* 它应提供 *可能适用于信息系统的所有潜在威胁的全面清单*；\n* 它应能够以一致的方式估算 *与每种威胁相关的风险大小*，以便在不同风险之间进行可靠的比较。\n\
  \n这些成果应以便于制定 *降低或消除* 风险以及 *改善风险管理* 策略的方式呈现。由高级管理层发起并涵盖组织内广泛系统的评估被称为采取 *自上而下* 的方法。由个人或部门发起的较小举措则代表\
  \ *自下而上* 的方法。\n\n应注意，信息安全风险评估在许多方面与在其他领域进行的风险评估不同，例如外部审计师（在规划审计账目的计划时）或公司财务主管（在分析金融市场的风险敞口时）进行的风险评估。在这些其他领域的经验是获取有用思想和想法的来源，但不应假定技能集可以直接转移。\n\
  \n“购买”风险评估所需部分专业知识的一种方式是应用 *方法论*，也许结合咨询服务以帮助应用它。风险评估方法论提供了一套现成的“零件工具包”，并使组织能够迅速开始，而无需自行发明所有必要的程序和技术。大多数方法论在某种程度上是专有的，通常会收取许可费，外加咨询和建议费用。“产品”将包括一套文档，其中包含如何应用该方法论的指导，以及必须填写的一系列表格（纸质或电子）。数据的实际处理和分析大部分将借助计算机程序完成，这些程序通常可以在普通\
  \ PC 上相当舒适地处理。\n\n尽管采用标准方法论可以在初期为组织节省大量时间，但必须强调的是，任何 *应用方法论* 的项目仍然会非常耗时，因为涉及大量的事实调查和分析。这些可能需要数周或数月才能完成——这也是这种方法很少对小型组织具有成本效益的原因之一。（在这种情况下，必须依赖较不正式的方法，如\
  \ 第 2.6 节 中所讨论的）。\n\n在任何方法论的早期阶段，都需要在三个主要领域进行事实调查。\n* *需要保护的资产*。这些会因组织的性质而有很大差异。这里的“资产”不仅仅是指在资产负债表中列出的资产，还包括信息系统中具有价值的任何要素，包括软件及其任何扩展、组织的信息资产，以及员工投入了时间的系统的任何特性，例如设置账户代码或为各种目的编制电子邮件分发列表。\n\
  * *威胁的性质和来源*。同样重要的是要识别每一种可能的威胁，并记录其可能出现的方式和地点。威胁需要根据诸如 第 1 章 中讨论的因素进行分组：例如，该威胁源于何处？造成威胁者的动机是什么？\n\
  * *资产的脆弱性*。这涉及确定哪些资产容易受到哪些威胁的过程。联系可能并不总是显而易见，可能需要与员工进行详细咨询才能找到它们。情况也可能因可能存在的“连锁”效应而变得复杂：例如，如果存在一种情况，即一个网络服务器的故障可能会使同一网络上的其他服务器失效。\n\
  \n除了提供系统地识别和记录上述所有内容的系统方法外，一个好的方法论还应提供有关如何设置和管理评估项目的实用指导。这应包括帮助确定应将哪些系统纳入项目的范围、估算所需的人员工时数以及制定项目计划。\n\
  \n方法论应提供的关键好处是能够 *利用他人之前的经验* 进行评估。这种经验主要通过四种方式传递。\n* 通过使用 *已知风险目录*（应由方法论提供者持续更新）。如果方法论\
  \ *仅* 针对信息安全，则效果最佳。那些将“安全”作为一般概念来看待，或声称适用于安全或财务等其他领域的方法论不太可能拥有足够广泛或集中的安全风险数据库。\n\
  * 通过创建 *数据收集的标准方法*。理想情况下，这些方法应得到全面且写得很好的文档以及一套适当的表格和核对清单的支持。参与数据收集的人员应能够在接受最少培训的情况下开展工作，并确信他们将以相同的方式收集信息，从而使结果彼此可比较。\n\
  * 通过提供 *分析数据的工具*，最好得到计算机处理的支持。管理者应能够了解分析背后的关键原则，分析不应只是通过“黑箱”流程处理的东西。（事实上，管理者应怀疑任何将复杂性或迷惑能力作为美德的方法论。）\n\
  * 通过生成 *调查结果和建议的翔实报告*。这些报告应简洁，并以管理者能够理解的术语表述。（对某些方法论的批评是，它们会产生冗长而繁多的报告，这使得在确定要点并将其用于制定行动计划时变得困难）。\n\
  \n\n\n\n\n理想情况下，该方法论在所有这些方面都会得分很高，但这并不能保证与组织需求的良好*匹配*。例如，一些方法论的根源在于计算的旧的集中组织和大型机主导的时代，在涉及\
  \ PC 或互联网的新型威胁方面相对薄弱。其他方法则更具时效性，但专业化程度较高，因此只处理某一领域的风险，例如网络。方法论在所需详细程度和准确性方面也各不相同。如果需要快速获得结果，或者资金有限，那么开展一项需要数月才能完成的极其严格的方法论是没有意义的。最可能的结果是，只有少数几个小区域得到适当分析，而无法得出任何明确的结论。\n\
  \n还需要在完全外包整个流程、由供应商团队负责整个项目，以及完全依赖组织自身员工努力的相反极端之间取得平衡。员工*应该*积极参与数据收集和分析非常重要，因为这会促使他们思考安全问题，他们的参与也会使他们更有可能支持任何变革建议。与此同时，如果要求他们承担大量额外工作，或使用他们不了解的方法进行调查，他们会感到不满。让员工更容易参与的一种方法是邀请他们提交数据并在\
  \ PC 上运行分析，使用基于专家系统的软件。这类软件可以避免提出不必要的问题，并为用户提供更“智能”的指导，使其使用起来更加友好。\n\n如果评估至关重要，或者该方法论将在多次不同场合使用，那么制定一个简短名单并详细比较两三种方法论可能是值得的。例如，加利福尼亚州就业发展部在决定在州就业机构中使用哪种产品时就这样做了（State\
  \ of California 1995）。\n\nTable 2.2 中列出了一些已商业化推广的风险评估方法论示例。\n\nTable 2.2\n\n| Product\
  \ || Name/source || Place of origin |\n| --- | --- | --- |\n| CRAMM v3 || CCTA Risk\
  \ Analysis and Management Methodology || Norwich, UK |\n| --- | --- | --- |\n| HAWK\
  \ || Hankuk risk Analysis Watch-out Kit || Seoul, Korea |\n| IST/RAMP || International\
  \ Security Technology, Risk Analysis Management Program || New York, USA |\n| LAVA\
  \ || Los Alamos Vulnerability and Risk Assessment || Los Alamos, USA |\n| MARION\
  \ || Méthode d’Analyse de Risques Informatiques et d’Optimisation par Niveau ||\
  \ France |\n| RiskPAC || Computer Security Consultants, Inc || Connecticut, USA\
  \ |\n| RiskWatch || Expert Systems Software, Inc || Maryland, USA |\n\nTable 2.2\
  \ 仅展示了已开发的方法论中的一小部分。Moses（1992）中可以找到对一系列产品的综述。在决定采用任何特定方法论之前，重要的是尽可能获取尽可能多产品的最新信息，然后考虑所列问题。\n\
  \n### 2.5.2 Risk Assessment Methodologies: The Theoretical Basis\n\n随着风险评估方法论的增长和增多，它们主要在处理数据的范围和数量以及呈现结果的复杂性方面发展。支撑它们的原则却没有发展太多。\n\
  \n任何方法论的设计者面临的一个反复出现的问题是如何为所有被测量的项目分配价值。通常存在一定程度的作弊，因为评估者被要求以数字形式提供评级，即使他们所做的估值是主观的。例如，评估者可能会被告知在\
  \ 0 到 5 的范围内对威胁的影响进行评级，这是有时被称为*影响分析*的一部分。如果（如在一种情况下）量表的底部是“可忽略的”，而量表的顶部是“灾难性的”，这就引出了许多关于如何为介于两者之间的威胁分配值的问题。另一种可能性是使用“高”、“中”和“低”等术语，但这仍然相当于在三点量表上主观地对威胁进行评级。无论评估者如何认真对待这项任务，它都涉及基于经验、直觉以及其他不太精确的输入做出的选择。\n\
  \n在确定资产、威胁和漏洞的定义时也会出现类似问题。可行的方法必须将这些内容归纳为可管理的类别数量。这必然涉及许多妥协。例如，计算机安装的物理威胁是全部归为一种威胁类型，还是分为不同类型（火灾、洪水、炸弹等）？后者将使风险分析更具区分度，但会极大地增加工作量。\n\
  \n因此，很大程度上取决于方法论设计者设计适当类别和量表的技巧。第一步将是根据设计者的定义以一致的方式收集数据。然后分析过程将开始，基于另外两个步骤，如 Figures\
  \ 2.4 和 2.5. 所示\n\n![Figure 2.4 ](img/fig2_4_B.jpg)\n\nFigure 2.4 \n\n![Figure 2.5\
  \ ](img/fig2_5_B.jpg)\n\nFigure 2.5 \n\nFigure 2.4 说明了必须定义的关系类型。实际上，它们会更加复杂，记录和分析它们的任务将交给计算机。在\
  \ Figure 2.4 中，假设已审查了威胁列表，并且已确定威胁适用于资产的每个实例。威胁 `T4` 被用作示例。已发现它适用于两个资产 `A3` 和 `A6`。已估计威胁\
  \ `T4` 对 `A3` 的可能*影响*的严重程度为 `i(4,3)`，而威胁 `T4` 发生的*概率*为 `p(4)`。然后使用基于 `i(4,3)` 和\
  \ `p(4)` 的函数计算该特定风险。这可以用前面描述的 ALE 表示，但也可以使用其他形式的损失期望计算。\n\n以这种方式检查每个风险后，分析的第二阶段将研究可能的*对策*的影响。方法论应提供一份广泛的对策清单，`C1`、`C2`……\
  \ Figure 2.5 显示了其中三种对策，其中 `C2` 对威胁 `T4` 有效。对策 `C2` 被显示为用于降低威胁 `T4` 对两个资产 `A3` 和\
  \ `A6` 造成的风险。在 `A3` 的情况下，它通过降低风险的*影响*和*概率*两个要素来实现这一点（因此 `i` 和 `p` 有了新值，用 `i′` 和\
  \ `p′` 表示）。在 `A6` 的情况下，只有概率发生了变化。在某些情况下，可能需要使用一个以上的对策。一旦达到这种复杂程度，计算机分析的帮助再次变得必不可少。\n\
  \n如果使用两个或多个对策，它们应*互补*而不是*重复*。例如，假设欺诈是福利支付系统的一项关键威胁。已确定三种可能的对策为：\n\n1. 对向系统添加新客户的程序进行更严格的管理；\n\
  2. 保留系统活动的更好日志，例如支票制作；\n3. 新的文具以便于控制支票的打印。\n\n\n\n\n\nIt is likely that (B) will\
  \ add very little to (C), and vice versa. However, either of them in conjunction\
  \ with (A) will result in two different methods of attacking fraud, which complement\
  \ each other. If a choice is to be made between (B) and (C), then further analysis\
  \ may well reveal that (B), being a more general countermeasure, helps to reduce\
  \ risks in several other areas, whereas (C) is more specialised. If so, (B) is likely\
  \ to be a better investment.\n\nIn a real risk assessment, there would be dozens,\
  \ maybe even hundreds, of decisions of this kind to consider. Each involves referring\
  \ to least six items of data (viz. asset, threat, vulnerability, impact, probability\
  \ and countermeasure). Furthermore, in many cases the situation will be much more\
  \ complex than the ones mentioned (e.g. with several threats affecting one asset,\
  \ or multiple countermeasures). A vital role of the PC software supporting the methodology\
  \ is to keep track of the huge amounts of data which all this implies, and provide\
  \ intelligible reports based on it.\n\n## 2.6 Risk Assessment: Smaller Organisations\n\
  \nRisk assessment, as so far described, is very much the province of larger organisations,\
  \ which can afford to staff and equip projects of this kind. Anyone contemplating\
  \ a risk assessment in a small business, or a department initiating its own ‘bottom-up’\
  \ security review, will be looking for an altogether cheaper and quicker approach.\
  \ Can risk assessment be made feasible and worthwhile in these settings?\n\nA manager\
  \ in a small unit can claim to start with one or two advantages. Not least is a\
  \ first-hand knowledge of the business processes which take place at the local level,\
  \ and insights into how they work. Identifying and listing assets is also relatively\
  \ easy, particularly if this is a small business run by an entrepreneur who acquired\
  \ or created most of them.\n\nHowever, the corresponding list of disadvantages facing\
  \ the manager is much longer. The number and variety of threats, particularly from\
  \ external sources, is likely to be much the same as for a larger organisation.\
  \ If the unit is a small business or partnership, rather than a department with\
  \ access to corporate resources, there will be no prospect of help from specialists\
  \ in computer audit. The unit may even lack anyone in the role of computer manager:\
  \ instead, it is more common for individuals to take on the job of looking after\
  \ the systems which are of concern to them. This means that knowledge of how systems\
  \ have been set up, and how they are operated, is not documented, and resides in\
  \ several people’s heads. Perhaps most problematic of all, the working style of\
  \ many small enterprises is highly idiosyncratic and informal. Those running small\
  \ businesses do so, primarily, because they enjoy being independent (Gray 1992).\
  \ This almost guarantees a mismatch between the general culture of the workplace,\
  \ and the culture of investigations based on bureaucratic procedures and checklists.\n\
  \nIn these circumstances, there is little point in trying to devise ‘miniaturised’\
  \ versions of `MARION` or `CRAMM`. Instead, more open-ended enquiries will need\
  \ to be substituted, with employees being invited to contribute whatever knowledge\
  \ and insights they can. There is still some merit, however, in following the same\
  \ three basic steps laid down in the formal methodologies.\n\n1. Gather information\
  \ about as many assets, threats and vulnerabilities as possible.\n2. Decide which\
  \ vulnerabilities the business needs to take particularly seriously.\n3. Ascertain\
  \ which countermeasures will work best in reducing these vulnerabilities.\n\nIt\
  \ is particularly important that step (1) is carried out without too many preconceptions.\
  \ This includes aspects of the daily routine of the business which everyone assumes\
  \ to be well understood. For example, it may appear that the accounts clerk has\
  \ been following a certain control procedure, but it may be that she has been quietly\
  \ ignoring it, and concealing this from everyone, because she does not really see\
  \ the point of it. Similarly, if systems are all being managed on an ad hoc basis\
  \ by different individuals, it is quite likely that A is erroneously assuming that\
  \ B is looking after issues such as backing up all the system files. Simply opening\
  \ up such questions can bring important vulnerabilities to light, and it may be\
  \ possible to find solutions for some of them very quickly.\n\nFor step (2), lack\
  \ of time and resources will preclude many quantitative measures on which to base\
  \ comparisons. However, this is a familiar predicament for most small businesses.\
  \ The main concern at this stage should be to make sure the assessment has highlighted\
  \ all the vulnerabilities capable of proving truly devastating to the business.\
  \ External advice may need to be sought at this stage, particularly where threats\
  \ of a more technical nature are involved.\n\nFinally, in selecting the countermeasures\
  \ (step (3)), it will be a good idea to check whether there are some simple solutions,\
  \ and to ignore some of the blandishments of vendors of security products. Maybe\
  \ a particular link to the Internet is not necessary, or some systems could be switched\
  \ off altogether at certain times, or it simply is not necessary for certain files\
  \ to be available ‘on-line’.\n\nAll the above assumes that risk assessment is something\
  \ the business has undertaken of its own volition, but on occasions there will be\
  \ pressure from outside. For example, if a site in the UK is registered for the\
  \ purposes of data protection, it will need to show that it has taken appropriate\
  \ security measures, and that these are based on some kind of risk assessment (Data\
  \ Protection Registrar 1997). Pressure may also be applied indirectly, by trading\
  \ partners. For example, a retail chain may specify certain security standards to\
  \ be met by suppliers, before they will be permitted to link in electronically to\
  \ the retailer’s systems.\n\nIn all such cases, it is vital to treat the risk assessment\
  \ as if it were the organisation’s own idea. Otherwise it will risk developing into\
  \ a ‘ticks in boxes’ approach, with the over-riding objective being to obtain the\
  \ necessary approval or certification. There is then a danger that awkward issues\
  \ are not investigated properly, because of the possibility that they will delay\
  \ things, or cause approval to be withheld. Power (1997) has described the results\
  \ which flow from turning procedures into a ‘ritual’ in this way. Some of the wider\
  \ issues raised by official certification programmes, such as `BS 7799` in the UK,\
  \ are discussed further in `Chapter 14`.\n\n## 2.7 Costs and Benefits of Risk Reduction\n\
  \nWhatever methods are used for selecting countermeasures – whether formal or informal\
  \ – minds will become concentrated when the costs begin to emerge. Up to now, it\
  \ has been assumed that a single cost can be identified, which can be offset against\
  \ the expected benefits from reducing the loss expectancy. Unfortunately, security\
  \ costs are rarely as simple as this. There are just a few situations where it is\
  \ possible to buy equipment which can be installed and then operate without further\
  \ intervention. Everyday security situations perhaps provide a misleading comparison,\
  \ since it is possible to invest in a front door lock, or a car alarm, and then\
  \ use them free of any further charges. With most IS security measures, some costs\
  \ will be ongoing.\n\nCosts to be considered fall under four headings:\n\n1. *Start-up\
  \ costs*. The expenditure needed to purchase any equipment, software, consultancy\
  \ or staff time needed to set up the countermeasure and ensure that it is working\
  \ correctly.\n2. *Fixed operating costs*. Recurring costs arising from such things\
  \ as line rentals, service agreements, or software updates. An example would be\
  \ the charges made by some vendors of virus protection software for providing regular\
  \ updates to the list of viruses which the software can recognise.\n\n\n\n\n\n###\
  \ 3. *可变运营成本*\n这些成本会随着计算机服务规模或使用量的变化而变化。例如，组织每购置一台新 PC，可能就需要为其购买一台安全设备，或者需要向认证机构支付费用来注册加密密钥（见第\
  \ 7.3 节所述）。\n\n### 4. *间接成本*\n除上述所有成本外，组织还以多种方式为安全付费，这些费用不会出现在会计账簿中。例如，员工花费时间遵循安全程序（如运行病毒检查、制作备份副本和更改密码）。安全软件可能会导致某些流程比原本更慢。如果需要定期测试或审计控制措施，也会产生成本。\n\
  \n建议了一些简单的成本模型以帮助决策。除了非常重大的投资外，并不建议实际绘制图表。然而，这类模型有助于形成对成本可能如何变化的心理图像。\n\n例如，假设一家企业在其网络上面临两种可能的对策，两者都将解决相同的漏洞。措施\
  \ A 需要在网络核心安装一套复杂且昂贵的软件，但此后运营成本非常低。方法 B 则设置成本低，但需要为网络的每个用户发放一张价值 £5 的智能卡。各自的成本线显示在图\
  \ 2.6 中。在这种情况下，A 与 B 之间的选择将在很大程度上取决于系统预期用户数量。此外，如果用户成本*重复*出现，两种方案之间的差异可能变得更加明显。例如，这可能是因为智能卡需要定期更新或重新发放。\n\
  \n![Figure 2.6 ](img/fig2_6_B.jpg)\nFigure 2.6 \n\n在其他情况下，投资水平可能并非取决于产品价格，而是取决于人员成本。一个例子就是调查欺诈所需花费的时间和精力。一般来说，可以预期，随着内部审计团队投入的努力增加，发现和遏制欺诈带来的收益会成比例增长，如图\
  \ 2.7 中 C 线所示。然而，理想的状况（也是审计人员努力争取的状况）是，将（有限的）努力集中在最有可能的目标上。这样一来，我们希望能获得类似 D 线所示的结果。在这里，初始投资带来最大收益，随后的投资收益递减。\n\
  \n![Figure 2.7 ](img/fig2_7_B.jpg)\nFigure 2.7 \n\n最后，也可以对因用户不便而产生的成本进行类似分析。员工的生活最轻松时，控制措施轻微或不存在。这种情况显示在图\
  \ 2.8 中曲线 E 的左端。间接成本较低，但安全性会受损。随着曲线向右移动，安全性得到改善，但员工会遇到更多中断和延迟。一个例子是办公终端的超时设置。如果应用程序在\
  \ 2 小时未使用后自动关闭，用户几乎不需要重新登录。然而，这也让入侵者更容易得手。如果超时时间缩短至 5 分钟，登录将成为频繁且令人恼火的事情，但安全性会大大提高。\n\
  \n![Figure 2.8 ](img/fig2_8_B.jpg)\nFigure 2.8 \n\n如果成本的精确数字难以捉摸，那么*收益*的数字就更难确定了。主要是，组织会寻求与消除单个威胁相关的损失避免。然而，还可以获得一些更普遍的收益：\n\
  \n1. *效率提升*。拥有可靠且提供准确信息的系统，使员工能够快速而自信地工作。良好的控制措施在提供这些收益方面发挥的作用，与更明显的特性（如快速响应时间或设计良好的屏幕布局）一样重要。\n\
  \n2. *竞争优势*。系统可靠性和准确性的证据会传导给客户。事实上，对于基于互联网的服务，他们可以直接自行判断。受体验印象深刻并感到安心的客户更有可能保持忠诚。\n\
  \n3. *信息资产价值提升*。通过在信息收集和存储过程中保持良好的控制，企业确保不断增加其“信息资本”的价值。管理人员基于历史信息做出判断时，可以确信这些信息不会因错误或遗漏而具有误导性。如果及早发现异常迹象，每个人都可以确信这是真实的，而不仅仅是“系统噪声”。\n\
  \n4. *企业隐私*。有时组织需要做出关键决策，但又不能让外界察觉到任何迹象。如果参与者知道他们可以通过信息系统基础设施自由交换信息，而不必担心泄漏或拦截，决策质量将大大提高。\n\
  \n## 2.8 Questions\n\n1. 在以下情况下，你可能会看到何种‘风险寻求’或‘风险厌恶’行为？\n   * 有人在办公室的 PC 上安装一个‘屏幕保护程序’，该程序是从朋友那里复制磁盘获得的。\n\
  \   * 一名在家上网的互联网用户正在从一个网站购买音乐 CD。\n   * 一名计算机操作员即将打印出 200 张工资支票。\n   * 4 月 1 日，一条*看起来*是官方的消息发送到办公室所有计算机屏幕。它建议每个人立即保存工作并注销，因为系统将在\
  \ 5 分钟后关闭。\n\n2. 一家零售公司拥有五家大型商店，每家商店的运营方式基本相同。它已与供应商建立了广泛的电子联系，并在销售点支付处理和库存管理中使用信息技术。管理人员最近怀疑某些计算机系统上正在发生欺诈。\n\
  \   其中一家商店的经理要求你撰写一份报告（不超过 600 字），说明如何进行信息系统安全风险评估。指出你认为在此情况下合适的评估方法，并给出你的理由。\n\n\
  3. 风险评估产生了控制办公室局域网的服务器的以下漏洞清单。\n   1. 未经授权将许可的程序材料复制到个人 PC 的硬盘上，或复制到磁盘上。\n   2.\
  \ 通过服务器使用互联网访问‘冲浪’色情网站。\n   3. 宏病毒破坏或销毁文字处理文件。\n   4. 具有会计系统密码的用户交换并共享其密码。\n   对于每个漏洞，从下面的列表中选择你认为*最*有效的对策。给出每个选择的理由。\n\
  \   * 仅在正常办公时间允许访问服务器设施。\n   * 禁用个人 PC 读写磁盘的能力。\n   * 所有密码至少每月更改一次。\n   * 仅允许访问经批准的互联网站点列表。\n\
  \   * 禁止访问*未*批准的站点列表。\n   * 每天备份服务器上的所有文件。\n   * 服务器上的所有活动均以电子方式记录。\n\n\n\n\n\n\
  4. 如果你能够访问互联网，你可以测试一下自己对风险的*自身*感知。找到一两个提供在线服务的网站（最好是那些可能涉及客户大量付款的服务，例如预订假期，或开设投资账户）。把自己置于即将与相关公司开展业务的客户位置。特别注意付款安排，以及所提供的任何保证（例如，许多网站都有关于法律、安全和隐私等事项的“细则”页面）。\n\
  \n现在编制两个简短的清单。 其中一个应列出你*不愿*成为该网站客户的原因，另一个应列出让你感到*安心和有信心*成为客户的原因。\n\n# 第 2 部分 内部服务的控制\n\
  \n## 第 2 部分简介\n\n组织内部的信息系统往往已成为“家具的一部分”，因此人们不会期望它们会暴露出许多安全和控制问题。其中一些可能是“遗留”系统，已经存在了很长时间。其他系统在最初安装时可能曾引起一些头痛，但现在似乎运行得相当顺利。对控制的担忧可能被归咎于审计师为证明其存在而制造，或是那些无事可做的人提出的毫无意义的焦虑。控制的真正棘手问题难道不是在使用互联网和其他网络时才出现吗（见第\
  \ 3 部分讨论）？\n\n这种观点至少需要从两个原因来反驳。首先，任何形式的自满都为欺诈、粗心大意和系统不负责任的使用创造了理想的氛围。其次，如果在外部建立网络连接，它们通常会链接回这些内部系统本身，在这一点上，这些系统的控制可能受到前所未有的考验。因此，虽然组织在建立新的外部服务时应特别小心，但它们也必须密切关注自己后院正在发生的事情。良好的控制的许多基础都建立在那里。\n\
  \n第 2 部分关注的是控制如何在组织的内部 IT 基础设施*内部*应用。它首先研究系统与其用户之间，以及管理人员与其下属之间关系的多个方面。（这些有时被称为“软”问题，但不应将其理解为易于处理。）最后两章描述了用于基本安全和控制的许多自动化技术，首先介绍识别用户和限制其访问的方法，然后介绍可以内置到他们在计算机上执行的单个交易中的制衡措施。\n\
  \n# 第三章 计算机化控制：组织背景\n\nDOI：[10.4324/9780203992319-6](https://dx.doi.org/10.4324/9780203992319-6)\n\
  \n## 3.1 引言\n\n第 2 章提出了一些可以应用于风险评估以及选择降低风险的对策的原则。然而，它回避了管理人员在试图提高安全性时所面临的许多人为和实际问题。例如，管理人员干预信息系统安全方面的管辖权或能力可能会受到质疑，也许是因为其他人觉得自己的领地受到了侵犯。成功还取决于对组织内部信息系统实施和运行责任分配方式的良好理解。\n\
  \n本章探讨了在这种文化和组织背景下必须做出安全和控制决策。本章集中讨论组织内部的问题，暂时忽略了通过数据网络进行组织间联系所引发的一些更广泛的问题（本书的第\
  \ 3 部分将重返这些问题）。它特别关注如果信息系统与组织的战略目标之间出现不匹配可能产生的影响。这种不匹配很容易在组织进行一系列快速而激进的变革时出现，也许是因为需要削减成本，或是努力推出新服务以击败竞争对手。不论原因如何，不匹配无疑会增加围绕系统使用的紧张感，这不利于良好的安全实践。\n\
  \n同样重要的是要理解一些日常压力，这些压力源于信息系统对人们工作生活的影响，即使系统已经建立并稳定。人们的反应既受其个人态度的塑造，也受工作场所整体文化的塑造。因此，本章后半部分考虑了员工的行为如何受到信任或忠诚感的影响，以及当人们对某些形式的控制的伦理产生分歧时可能出现的冲突。\n\
  \n管理人员在追求看似有吸引力且见效快的科技“解决方案”时，也需要有敏锐的嗅觉。 这种“解决方案”可能由供应商宣传，或由那些仅仅坚持“必须对这种情况做点什么”的人提出。问题不仅仅在于，沿着这些思路进行的采购很容易在没有最基本的风险分析和对所有可用替代补救措施的全面探索的情况下进行。“膝跳反应”式的解决方案可能与员工的工作方式完全不符，并可能成为他们怨恨的来源。因此，组织背景即使在最简单最小的安全决策中也很重要。\n\
  \n## 3.2 信息安全和控制作为总经理的责任\n\n在商业计算的最初阶段，信息系统的开发和管理几乎所有责任都落在庞大的“数据处理”部门。任何安全和控制问题都会很自然地作为该部门活动的一部分被提及。数据处理部门的大多数员工都非常注重技术，并且对“他们”的系统内部运作有详细的了解。用户部门方面，他们也很乐意让别人去处理他们无法理解的控制技术细节，而这些细节对于没有编程或工程技能的人来说往往难以理解。\n\
  \n在这些形成期，开发了许多用于审计和控制系统的有用技术。然而，在许多方面，实施控制的业务相当简单，因为所有计算机服务都牢牢地控制在同一个部门之下。此外，所提供的服务，特别是那些以交互方式工作的服务，与今天的标准相比非常原始。这意味着用户对将向他们提供的功能和数据的范围并没有很高的期望。某些类型的威胁（如黑客和病毒）当时还鲜为人知。所有这些加起来形成了一种情况，即需要考虑的威胁和补救措施比今天要少得多。\n\
  \n最终，数据处理经理也处于非常有利的谈判地位，因为他或她负责组织内部通常的垄断服务。他或她可以通过单方面决策，或（也许更狡猾地）声称技术考虑排除了任何替代解决方案，从而缩短关于安全措施的适当性或可接受性的任何辩论。\n\
  \n\n\n\n\n在 1980 年代，这一集中化模式开始承受越来越大的压力，许多组织开始寻求管理其信息系统基础设施和服务的新方法。这主要由技术进步驱动，技术现在能够提供更小、更便宜且更具韧性的系统。供应商抓住机会绕过数据处理部门，并开始直接向用户销售其产品。与此同时，董事会层面日益认识到\
  \ IT 已步入成熟。它不再仅仅是工厂或办公室中的另一种工具，而必须被视为决定业务成败的潜在关键因素。这进而引发了关于应由何种人负责管理信息系统以带领组织迈向新时代的讨论。人们呼吁需要更多具备“混合”技能的人才，涵盖\
  \ IT 和业务的其他方面（Dixon and John 1989），或呼吁“全面发展”的管理者，能够自如应对 IT 引发的更广泛战略问题（Meiklejohn\
  \ 1989）。人们对组织应如何塑造和管理以有效利用信息系统给予了很大关注，例如 Keen（1991）和 Scott Morton（1991）。\n\n对于大多数组织而言，今天这些问题仍然是高级管理层的关注重点。在关于信息系统管理的更广泛讨论中，信息系统安全与控制问题已成为日益常见的主题。特别是，安全与控制的三个方面经常浮现出来。\n\
  \n* *安全与控制不再是中央技术人员的专属，甚至也不是其主要职责*。在即用型软件包和“即插即用”硬件的世界里，每个人都可以成为“自己动手”的系统构建者。这种新型的\
  \ DIY 爱好者主要关心的是让系统运行起来，并不一定会过多关注安全性和完整性问题。因此，可能无意中创造了新的漏洞。因为所有这些现在都可以在不涉及或咨询中央 IT\
  \ 部门的情况下发生，一个有用的安全网被移除了。过去本会被中央经验丰富的技术人员识别出的威胁现在却未被察觉。\n\n因此，组织不得不更加主动地监控新信息系统是如何以及在何处引入的。这有时导致\
  \ IT 部门的权力得到恢复，特别是在跟踪整个组织中安装的 IT 设备以及执行对常用打包软件的标准的方面。\n\n* *安全与控制问题跨越了正常的分界线*。这些问题可能无法\
  \ neatly 归入正常的部门边界，例如，A 部门的用户可能希望被允许访问由 B 部门维护的某些数据文件。这将需要*双方*部门共同商定适当的<|message|>\
  \ 安全措施。如果各个部门都在运行自己的自主系统，对此类跨界安排的需求是不可避免的。如果跨链接的需求只是偶尔发生，可能很容易友好且安全地解决，但如果考虑更大规模的数据交换，安全与控制可能会纠缠于围绕信息地位和所有权而产生的更大政治问题。Davenport（1994）简洁地指出：“如果信息就是权力和金钱，人们就不会轻易分享它”。\n\
  \n* *安全与控制的成本和收益分配不均*。几乎没有安全措施是零成本的。即使灌输“良好实践”也需要培训，一个可能的结果是员工必须在处理每笔交易上花费额外的时间。不幸的是，安全成本可能特别沉重地落在某些部门，例如负责大量数据录入的部门，或经常与客户打交道的部门。与此同时，收益通常不会归于该部门，而是归于整个组织。在许多情况下，收益无论如何都将\
  \ largely 不可见，至少对于那些承受所有额外压力和开销的人来说是如此。所有这些都加剧了政治紧张，特别是在对高标准安全与控制的要求从组织高层下达，而让各个部门自行寻找实施资源的情况下。\n\
  \n由于所有这些原因，很少有管理者能够避免在某个时候被卷入关于信息应如何被控制、审查或存储的讨论。要找到可行的解决方案，他们需要考虑的不仅是信息系统的安全相关方面，还需要考虑关于系统目的的更一般性问题，以及它们与组织目标的契合程度如何。如果系统提供的功能与组织为自己设定的业务目标之间存在良好匹配，建立良好控制将容易得多。相反，对系统没有被认为特别有用，或其运行方式“与众不同”的系统施加和实施控制可能极其困难。\n\
  \n## 3.3 使控制系统与组织的结构和文化相匹配\n\n信息系统应如何量身定制以满足其所服务的组织的需求？这个问题已受到大量研究和分析。一般认为，在某种意义上，IT\
  \ 与业务之间必须存在良好的 *fit* 或 *alignment*。Raymond *et al*（1995）已表明，正确实现对齐存在业务激励，因为企业随后可以预期在财务和其他指标方面取得更好的成果。然而，关于如何实现良好对齐，甚至如何判断是否已实现，存在不同的观点。\n\
  \n例如，McKersie 和 Walton（1991）强调了实现对齐的不同方式：例如，组织是把技术拉入以对应其现有工作方式，还是调整部分工作实践以适应*围绕*技术？技术与组织“拉力”的概念已被\
  \ Burn（1996）进一步发展为一个模型，他认为 IT 的引入可能在僵化和高度官僚化的组织中受阻，导致信息系统战略沦为“伪创新”。同样，一个在观念和工作方法上更灵活的组织仍可能受阻，因为它缺乏对\
  \ IT 潜在应用的真正愿景。Keen（1993）认为最终目标应是 IT 被 *fused* 进入组织的情况。实现这种融合状态的组织会发现，每当它们计划和实施运营变更时，技术就会像其他任何问题一样成为议题，并被视为与他们所做的一切完全交织在一起。\n\
  \n\n\n\n\n同样地，关于如何设计组织以优化 IT 的使用，也存在不同的学派观点。Stebbins *et al* (1995) 对此进行了全面综述。Broadbent\
  \ 和 Weill (1993) 对组织设计进行的实证研究考察了 IT 实施和战略在四家澳大利亚银行中的关联方式。他们得出的结论之一是，如果战略制定在组织的多个不同层级同时进行，则效果最佳，并且“当这些资源由最接近业务需求的人管理时，信息系统的管理最为有效”。\n\
  \nSambamurthy 和 Zmud (1999) 调查了促使企业倾向于 IT 决策集中与本地化的因素。研究了八家公司，其中只有一家将所有关键 IT 决策集中做出。其余公司被发现采用分散或“联邦”结构。在联邦安排下，一些决策（例如关于\
  \ IT 基础设施的决策）由中央做出，而另一些决策（例如关于单个项目实施的决策）则在更本地的层级做出。研究人员认为，联邦制倾向于在集中力量（例如通过资源共享实现成本削减的重点）和分散力量（例如用户地理分散）冲突时出现。\n\
  \n无论“联邦”方法多么适合组织，从信息系统安全角度来看，它可能是最不 promising 的。安全和控制问题会不断有“落入”地方与中央决策之间的缝隙的危险。或者，中央可能在没有充分了解地方层面的活动管理方式的情况下强行施加控制，或者地方用户可能认为控制与正在进行的其他政策举措相关，而这些举措因中央以不敏感的方式推动而受到抵制。Dhillon\
  \ (1997) 在研究英国地方议会控制管理方式时发现所有这些因素都在发挥作用。该议会采用了本质上的联邦主义 IT 管理方法，Dhillon 的研究发现了若干管理责任冲突和混乱导致控制缺失或无效的实例。\n\
  \n对齐问题也可以在相当小的作业组内检测到，例如小型企业，或大型组织内的半自治单位。\n\n这种错位通常可以追溯到将计算机系统的管理交给相对初级人员的决定。此类决定基于权宜之计而非深思熟虑。某员工被认为对计算充满热情，或似乎对相关软件有一定先前知识。也许由于缺乏其他候选人，这些被视为足以将系统托付给此人照管的资格（Hawker\
  \ 1996）。问题在于，此人的地位在安全问题上可能完全不合适。对系统的整体责任意味着设置访问控制、确保备份、并维护适当的日志和轨迹。与此同时，相关人员还掌握着主密码，因此可能可以随意访问每个人的数据文件。这种权力对于在其他方面可能只是组织中初级成员的人来说并不容易承受。\n\
  \n许多报道案例表明，判断作业组内责任应如何分配是多么容易出错。第 69 页的示例取自英国审计委员会报告。在这种情况下，似乎不太可能柜员本就*打算*在设定汇率时使用任何自由裁量权。此类事项通常由总部决定。因此，理想的解决方案是总部的决定由中央做出并强制执行，也许通过安全的网络链接每天早上下载汇率值。与此同时，本地可访问的功能必须通过第\
  \ 4 章所述的自动化访问控制进行限制。\n\n正如巴林银行所发现的那样，如果没有限制地方员工自行修改计算机系统的能力，甚至可能导致更灾难性的控制失败。巴林银行的报告系统要求新加坡办公室——尼克·里森在那里担任结算员——每天向伦敦提交报告，汇总新加坡所有活跃账户的数字。1992\
  \ 年 7 月，里森指示当地巴林员工王博士更改当地会计系统的编程，使其中一个账户（“88888”账户）的关键数据从每日报告中排除。似乎没有人记录或质疑这一更改。此后对该账户的使用对里森对银行实施的欺诈至关重要。巴林倒闭的官方调查指出：\n\
  \n> 据推测……里森从一开始就打算将“88888”账户用于未经授权的活动，而王博士的行动……旨在将该账户排除在巴林的账簿和记录之外。在伦敦，巴林的管理层和其他人员表示，直到\
  \ 1995 年 2 月 25 日星期四之前，他们都不知道“88888”账户的存在。\n\n> \n> Board of Inquiry 1995: 78\n\n\
  当地程序员能够以这种方式修改中央报告系统，很大程度上归功于新加坡办公室的放任风格，那里汇报线路不明确，员工分散在相距十层的两处办公室。与此同时，伦敦办公室普遍（且错误地）认为新加坡正在正确遵循公司程序。因此，例如，没有尝试核对到达伦敦的某些数据，因为人们认为新加坡已经完成了核对（Fay\
  \ 1996）。\n\n巴林银行急于进入新市场导致了一些导致其制度性粗心的压力。在过去二十年里，世界各地的银行普遍经历了重大动荡，导致其组织、技术和控制的对齐不断出现问题。在发达经济体中，发生了多次收购和合并，因为地方或区域银行寻求在全球市场上站稳脚跟。例如，1998\
  \ 年加拿大启动了两项主要银行合并，其中一位参与的首席执行官声称结果将是“加拿大乃至北美最先进的电子银行”（Middlemiss 1998）。美国银行受跨境交易快速增长的推动，一直在进行海外收购，并以“足以压倒最有活力的\
  \ IT 专业人员”的方式整合其服务（Caldwell 1998）。在欠发达经济体中，银行能够跳过计算机化的一些早期步骤，但现在发现自己陷入了同样的快速变化旋风，对组织完整性和安全产生诸多影响（例如中国银行的情况（Hood\
  \ and Yang 1998））。在银行业所有这些疯狂活动的背景下，巴林的灾难并不更可原谅，但也许没那么令人惊讶。\n\n\n\n\n\n其他行业不必像银行业那样面对同样的变革速度，但它们也已经转向新的信息系统使用和配置方式。例如，它们将选定的活动推向\
  \ `client` PC，这些 PC 与中央 `server` 协同工作，形成所谓的“客户-服务器”系统。它们还彻底重新设计了业务流程，以改善对客户的服务。这些创新通常由技术驱动，而组织层面的影响可能并未得到充分思考。即使在新系统与组织结构\
  \ `have` 被成功匹配的情况下，在过渡过程中仍存在某些形式的控制会悄无声息地消失的危险。这在例如削减了一层管理层，或职责被重新组合而恰好有利于欺诈的情况下尤其可能发生。这些不受欢迎的副作用已由\
  \ Marcella（1995）和 Sia 和 Boon（1996）进行了广泛分析。\n\n## 3.4 平衡信任与强制\n\n人们对信息系统的态度往往是矛盾的。员工欢迎不再需要翻阅文件柜的想法，并能够依靠系统进行复杂的计算。然而，仅仅是一些小的设计缺陷，或系统实施管理不善，就可能引发反感。在最坏的情况下，员工可能会表现出\
  \ Marakas 和 Hornik（1996）所称的“被动抵制滥用”。这种情况发生在对系统的疑虑未在公开讨论中得到解决，员工转而采用更隐蔽的方式表达不满。Marakas\
  \ 和 Hornik 引用了一个涉及医院病人管理系统的情况。实施恰逢招聘冻结，因此在过渡期间员工必须承担非常高的工作量。在并行运行阶段，这种过载尤其严重，在此期间员工必须同时维持旧系统和新系统的运行。这一阶段结束后不久，发现输入新系统的数据中出现了严重错误。找不到任何技术解释，而当管理层最终宣布严厉打击以找出问题原因时，问题立即消失了。\n\
  \n反感也可能产生，因为负责安装系统的人员往往具有以技术为主的观念和做法。在一家建筑事务所的项目中，一位研究人员指出：“系统安装与使用者之间的互动之间存在不匹配，因为安装技术的人员与使用者之间存在\
  \ `a cultural difference between the people who install the technology and the users`”（斜体添加）（Purcell\
  \ 1993：56）。Backhouse 和 Dhillon（1996）也在信息系统安全控制方面观察到了类似的文化冲突。根据对英国一家医院控制措施的观察，他们得出结论认为，问题必然会出现，因为“……计算机化信息系统的正式系统僵化的规则式结构被强加于以非正式规范为基础的环境之上”。本例中的非正式规范是医生、护士和管理人员等群体所遵守的规范。这些群体各自对什么是“恰当”的工作方法有自己的想法，而且各群体并不总是持有相同的观点。在这种情况下，设计出每个人都认为可接受的控制措施必然会很困难。\n\
  \n在所有此类冲突中，相互信任的水平都是首当其冲的受害者。每个人际或商业关系都需要一定程度的信任。这是一种我们在与他人互动中大多能够识别出的品质，然而却难以定义或衡量。我们经常在不知不觉中依赖它。它需要时间来建立，却可以很容易且迅速地被摧毁。它在短期内抵消了更自私的个人风险与收益的计算。Francis\
  \ Fukuyama（1995：152）指出：\n\n> 我们经常把最低限度的信任和诚实视为理所当然，并忘记它们渗透到日常经济生活中，对其顺利运行至关重要。例如，为什么人们不更频繁地在不付账的情况下走出餐馆或出租车？……如果他们像经济学家所断言的那样，只是单纯地最大化收入而不受诸如惯例或道德考虑等非经济因素的约束，那么他们每次进入餐馆或出租车时都应该计算是否可以不付钱而不被发现。如果作弊的成本（以尴尬为代价，或在最坏情况下与轻微的法律纠纷）高于预期的收益（免费的一餐），那么一个人就会保持诚实；如果不是，他或她就会走出去。如果这种作弊变得更普遍，企业将不得不承担更高的成本，也许需要在门口安排人员确保顾客在付款前不会离开，或要求预先支付现金押金。\n\
  \n可以把 Fukuyama 关于餐馆顾客的例子替换为面临欺诈雇主机会的员工。员工也可以做出纯粹的功利主义判断。作弊的成本（在这种情况下， presumably\
  \ 涉及被解雇以及由此带来的所有后果）是否会被从获得的金钱或货物中获得的收益所抵消？（如果员工特别严谨，他当然可以加入一些风险分析来帮助进行这种比较）。然而，大多数员工并不会以这种冷酷和算计的方式对待道德决策。他们会受到个人道德准则的驱动，渴望保持良好的声誉，或相信商业应按照某些最低标准进行。\n\
  \nJacobs（1992）提出的一个观点是，基于信任的系统会在人们开始形成交易关系时自然演化。她认为，历史上的交易社区中可以找到这种证据，并且它至今仍是商业文化的标志。她将此描述为“商业道德综合征”。Jacobs\
  \ 将这些“商业”态度与“守护者”所表现出的态度形成对比，“守护者”在政府部门或法律系统等其角色是管理或监管的组织中工作。在这里，更看重对机构的忠诚以及遵守规则的意愿。恰当地遵守程序可能实际上要求\
  \ `not` 表现出信任。组织，特别是大型组织，包含代表 Jacobs 两种“道德综合征”的群体。“商业”部门负责制造、交易和收入的产生，而“守护者”角色则由会计和人力资源等公司职能部门承担，这些部门监管组织的事务，并关心正直和公平的问题。\n\
  \n\n\n\n\n无论它们是否能整齐地落在商业/守护的对立面，组织内部的不同工作组不可避免地会对信任持有不同的态度——或者更具体地说，对任何暗示他们*不*值得信任的推断持有不同的态度。这些差异不仅取决于工作组的性质和职能，还取决于员工的地位和资历、他们的专业独立程度，以及个人“人脉网络”的影响。更复杂的是，一些团体将虚张声势和欺骗视为正常的商业策略。虚张声势是一项复杂的游戏，因为虚张声势者呈现的是事实的部分或扭曲版本，但仅限于被认为会被听众接受和理解的范围内。越界将会导致双方之间信任的彻底崩溃。它通常用于企业之间的谈判中，但在内部争夺影响力或资源的过程中也可能是一种策略（正如我们所见，这两者在控制和安全决策中占据重要地位）。虚张声势作为一种商业策略的合法性，曾让包括\
  \ Carr（1993）和 Bowie（1993）在内的多位商业伦理学家费解。\n\n最终，直觉将不得不成为评估信任在任何给定情况下如何运作的主要指导。然而，由于两个因素，在实施控制时永远不能忽视信任。\n\
  \n* *员工态度和敏感性*。看起来传递不信任信号的控制措施会遭到怨恨，特别是那些习惯于在高度信任环境中工作的员工。同样，如果工作氛围正好相反，怀疑盛行，很少有人会将事情看作表面那样，那么就很不明智地认为所有用户都值得信任。这只会被解读为管理上的软弱或无能。\n\
  * *最小化成本*。信任可以被视为一种资产，具有真实的货币价值。如果员工*可以*被信任，对精细而昂贵的控制的任何投资都将是浪费的（而且可能适得其反）。然而，这对经理来说是一个极其难以采取和捍卫的立场，因为它需要对其他员工有高度的信任，并愿意放弃依赖明确控制所提供的更可预测的“更安全”选择。然而，这对组织在启动和经常性成本方面的节省可能相当可观。\n\
  \n## 3.5 信任的局限：‘社会工程’的兴起\n\n如果组织可以通过培养信任文化获得利益，那么如果他们的员工既信任又天真，他们也可能面临严重风险。员工必须意识到各种自信骗子带来的威胁，他们会试图冒充合法用户，然后利用这种信任地位。这已成为那些从事计算机滥用计划的人的流行技术，并且创造了术语\
  \ *社会工程* 来描述他们的活动。最简单的例子是使用某种计谋说服某人透露其密码。能够输入有效的用户标识符和密码总是比不得不诉诸技术伎俩进入系统要容易得多。\n\
  \n社会工程可以成为那些对欺诈或盗窃感兴趣的人的有用起点，但它主要与黑客的恶意入侵有关。Kevin Mitnick 是一名黑客，他在洛杉矶的青少年时期发展了他的社会工程技能，正如所描述的事件所示。\n\
  \n该事件说明了社会工程的三个基本原则：\n\n* 为自己编造一个合理的身份，以及你所做事情的理由。\n* 转移对你真实动机和意图的注意力。\n* 利用人们的易感性和弱点。\n\
  \n第三原则由 Mitnick 应用，他利用了警卫感到无聊的事实。社会工程师也可能利用人们渴望取悦他人的心理、他们感到不安全以及他们不愿因看似非常小的程序问题而卷入争执的心理。\n\
  \n虽然社会工程可用于进入建筑物，或在面对面交谈中诱骗信息，但社会工程师的首选媒介是电话。摆脱了实际露面的需要，冒名顶替者可以扮演多种不同的角色。Gordon（1995）认为这些可分为五大基本类别：\n\
  \n1. *无知的菜鸟*。冒名顶替者扮演新员工，或刚将 PC 连接到网络的人的角色，并致电计算机中心寻求帮助。这种装傻的方式会博取同情，并鼓励人们详细说明每一个细节。\n\
  2. *技术人员*。这里角色互换，例如，冒名顶替者致电秘书，声称自己正为公司从事某种深度技术工作，并询问是否可以获得某人的密码以帮助进行测试。\n3. *VIP*。此人仗势欺人，假装是高级管理人员或官员。透露信息将有某种至关重要且紧急的原因，如果不透露将产生严重后果。\n\
  4. *有愤怒老板的人*。在这种情况下，会博取听众的同情：‘销售经理在这件事上真的为难我了。你能帮我一把吗？’\n5. *安全人员*。这是一个有风险的选择，但如果成功，它结合了\
  \ VIP 的权威和技术人员的吓人术语。冒充安全官员可以提出各种关于程序、密码和系统设施的问题。\n\n对抗社会工程的对策取决于持续的警惕，以及愿意以相关问题作出回应的意愿。如果员工对来电者的身份有疑问，应鼓励他们以冷静而坚持的方式尽可能多地寻求佐证信息。他们的培训应涵盖泄露看似无害的细节的危险，例如某人的工作时间，或她拥有访问权限的系统，即使对方身份存疑也不应透露给任何人。最重要的是，应鼓励员工*永远*不要想当然地认为电话来电者就是他或她声称的那个人。\n\
  \n## 3.6 控制的合法性：一些正直和监视问题\n\n从理论上讲，每个组织都力求使其所有数据完全准确可靠，并根据合法的“需知”原则限制访问。当然，这些雄心壮志存在技术限制（将在后续章节探讨），但公司必须运作的社会和伦理框架也对其施加了限制。\n\
  \n例如，跨国公司试图在其所有业务中应用统一的会计系统。它在海关官员期望在货物能从码头移走之前收到巨额贿赂的国家进行贸易，或在政客期望收到巨额诱因以润滑商业交易的地方进行贸易。这些付款应如何记录？是否有人在账簿中记入条目，完全准确地显示在某月某日支付了\
  \ X 美元的贿赂？即使这被记录在账簿中，也极不可能在公司账目中在“贿赂和诱因”下出现一笔款项。会计系统必须在某处被篡改，以便这些付款与销售的其他、更合法的成本一起被埋藏。\n\
  \nKelly（1984）描述了美国银行在意大利面临的一种困境：\n\n\n\n\n\n> \\[银行\\] 被其意大利律师建议提交一份错误陈述收入和支出的纳税申报表，从而严重低估了实际应缴税款。然而，银行了解到，大多数其他意大利公司都将这种做法视为标准操作程序，仅仅是与意大利税务局进行复杂谈判过程的第一步。银行最初拒绝提交虚假申报表……但由于由此产生的税单比可比意大利公司被要求支付的税款高出数倍，银行在随后几年改变了政策，同意采用‘意大利式’做法。\n\
  \n此类情况并非仅限于在国际上运营的企业。在某些行业中，发票上的价格常规性地超过所供应商品的价值已被视为一种公认惯例（例如，关于将计费给供应链下游客户的原材料）。在其他行业中，会为已知不必要或不存在的工作支付款项。所有这些付款尽管仍必须在声称保持完整和准确记录的会计系统中得到体现。\n\
  \n当当地的习俗和做法纵容员工使用或挪用资产时，也会出现类似问题。大多数组织在偶尔进行私人复印或电话等琐碎层面容忍这种情况。然而，在某些行业，人们普遍认识到一定数量的库存，特别是以边角料或不合格零部件的形式，会通过工厂大门流出。其他雇主对员工适度私人使用公司场所、车辆或设备的情况视而不见。\n\
  \n对这种类型的‘灰色地带’违规行为的容忍可能是唯一可行的选择，因为它们难以或无法被检测。方便地将它们视为在组织的控制之下‘飞越雷达’。然而，引入新的 IT 系统可以迅速改变这种情况，因为它提供了更严格、更详细的测量和跟踪。由此产生的监控结果可能既是刻意的，也是无意的。例如，在作者所知的一个零部件仓库中，引入了一套计算机化库存系统来记录每件库存物品的位置。随后人们意识到该系统可用于分析仓库内叉车司机的活动。仓库里不断移动的卡车似乎非常忙碌，但事实证明，其中相当多的行程完全没有必要。司机们只是为了看起来忙碌而四处驾驶。\n\
  \n或者，新的系统可能明确以监控员工为目的而引入。酒吧和餐厅使用的计算机化收银系统就是一个例子。此前，酒吧工作人员会提供饮料，将钱放入收银机，到了当天结束时，可以对收到的现金和售出的饮料进行非常粗略的核对。非正式的‘福利’，例如偶尔为朋友提供免费饮料，很可能不会被发现。但如果员工必须通过专用键盘识别自己并记录每件售出商品的详细信息，则可以保留更精确的记录。管理层随后可以用各种方式使用这些数据。正如为餐厅使用的某款软件包的广告材料所解释的那样：\n\
  \n> 管理人员可以跟踪销售活动、客户订单历史和员工效率，以及快速轻松地将关键商店数据传达给远程办公室。\n\n超市收银台的收银员以及处理电话订单和查询的职员同样意识到计算机系统可以监控他们的工作速度。整天被系统束缚的员工尤其容易受到监控；由此造成的压力已被\
  \ Picard (1994) 记录。Picard 引用了一名员工代表的话说，监控应仅用于培训员工、评估趋势，或在已有理由怀疑员工表现不佳时进行核查。否则，‘它只是用来打人的棍子’。\n\
  \n员工的负面反应不仅会破坏劳资关系，还可能对他们对待记录保存的方式产生意想不到的影响。这在 Walton 描述的一家英国电子公司研究中得到了说明。该公司引入了一套基于计算机的系统来跟踪其现场技术人员的工作，他们在人们家中安装和维修电器。该系统监控每次上门访问所花费的时间和结果。技术人员对系统计算的‘有效性评级’尤其感到不满，因为这些评级未能考虑并非技术人员过错的*无生产*时间（例如屋主不在家的情况）。Walton\
  \ (1989: 170) 引用了技术人员的以下反应：\n\n> ‘这就像营中的间谍’，一人说道；‘它确切地知道你做了什么。’一名现场技术人员承认，他保留了一本手工活动日记，以防管理层询问。‘我开始每小时写下我所做的事情的日记。这样当他们问起时，我就能为自己辩护’。\n\
  \n类似的问题也可能出现在‘群件’中，即文职人员都使用连接到同一办公系统的个人电脑，办公室经理可以向不同个人指派任务。引入此类系统的困难由负责一家公司养老金计划的部门主管向作者描述。员工对经理能够监控他们正在做什么，并通过电子‘收件箱’强加一套做事顺序的想法感到警惕。这必须在系统引入前进行广泛协商（Westcott\
  \ and Hawker 1994: 15）。\n\n计算机系统提供的更大细节和准确性也可能揭穿某些形式的虚张声势。Sproull 和 Kiesler (1992)\
  \ 描述了一种‘虚构’的总部程序，该程序被发明出来以说服销售代表比实际必要更早提交报表。这种诡计在基于电子通信的更透明世界中很难生存。然而，Sproull 和\
  \ Kiesler 认为，所有相关方都在不断进行调整，因此如果一种操纵方法被消除，就会有新的方法被发明来取而代之。例如，人们会歪曲他们输入系统中的信息：\n\n\
  > 假设每个人都共享或想要共享准确信息的技术和技术政策，可能产生在组织知情程度更高时不会出现的新问题。在其他条件相同的情况下，如果各方发送和接收准确且完整的信息，它们可能会损害自身的战略地位并威胁组织内部控制的平衡。发送者知道这一点，就会歪曲信息。接收者知道这一点，就会贬低信息。仅仅提高信息共享的速率和范围，可能只会增加误导性和被打折的沟通数量。\n\
  \n> Sproull, Kiesler 1992: 117\n\n即使出于*善意*输入不准确的信息，也可能导致荒谬的结果。在英国数据保护专员报告的一起案例中，一名建筑协会客户投诉称，她感到不安，因为协会的文件记录她为\
  \ 52 岁，而她实际只有 42 岁。工作人员为避免冒犯而付出的努力彻底失败，因为客户显然对他们对她年龄的估计并不感到受宠若惊。\n\n\n\n\n\n前面的例证表明，对数据进行“准确性”控制并非总是看起来那么简单。有时允许一定程度的模糊性可能是明智的，或者提供保证，说明对数据的使用和分析方式将受到限制。\n\
  \n## 3.7 忠诚与义务的冲突\n\n雇主有权期望员工忠诚，但不能期望这种忠诚是完全无条件的。例如，员工可能认为自己有权对公司不当行为“吹哨”，或拒绝接受他们认为不诚实或不安全的指示。这种忠诚冲突已被商业伦理作家广泛讨论（Hoffman\
  \ and Frederick 1995）。\n\n更常见的是，忠诚冲突出现在员工希望遵守源自组织之外的正式 *道德行为准则* 时。这通常是因为他们的工作受专业机构监管，如医学和社会工作等关怀职业，或法律和会计等商业职业。在这种情况下，员工可能面临关于控制的适当行使和使用的困境。一些例子包括：\n\
  \n* 负责 *员工福利* 和 *职业健康* 等领域的人员可能觉得有义务保护他们从员工处获得的某些信息的保密性。这可能是因为信息涉及家庭事务，因此提及组织之外的人，或因为它是健康记录，相关个人希望保持私密。这可能意味着禁止高级管理人员访问相关数据字段，而高级管理人员通常期望能够完全访问员工的人事记录（例如检查他们的工作时间，或最新的绩效评估等级）。\n\
  * *政府* 机构的员工，无论是地方还是国家层面，可能对让某些信息项目可供民选代表访问也有类似的担忧。例如，这可能是因为他们怀疑信息主要被寻求作为对政治对手施压的一种方式。这一技巧最著名的倡导者可能是美国总统理查德·尼克松，他曾寻求有关其政治敌人的税务事务的信息（Watergate\
  \ Hearings 1973; Impeachment Report 1974）。\n* 员工可能希望对具有未来 *证据价值* 的材料获得控制方面的保证。有时一项发现或意见将被“记录在案”。这可能包括以专业身份作出的陈述，或与内部调查或质询相关的陈述。在这种情况下，可以合理地期望对这些陈述的任何电子版本适用特殊保障措施。例如，一名安全官可能会记录一些观察或测量结果，这些结果指向安全制度的缺陷，并希望确保这些记录随后无法被更改或删除。\n\
  \n如果忠诚应归于客户，可能有必要设立 *防火墙*。这些通常用于组织拥有在同一市场竞争的客户 A 和客户 B 的情况下。分配给客户 A 的团队必须能够向其客户保证，商业敏感信息不会被客户\
  \ B 的团队访问。另一个团队也必须能够向 *其* 客户提供类似保证。然而，两个团队可能都在同一系统上存储文件和文档。\n\n防火墙是通过扩展正常的安全控制来创建的，以确保不会发生任何不期望的信息交叉流动，即使是无意的。防火墙也用于客户因其他（合法）原因要求工作完全保密的情况，例如，信息的流通可能导致内幕交易指控，或客户正在准备一次意外的收购要约。在这些情况下，对额外、量身定制的保护的要求需要超出基本客户文件，还包括电子邮件，以及与客户之间传输的任何文件。\n\
  \n在某些情况下，客户可能期望防火墙适用于相当常规的服务。这在金融服务行业尤其适用，其中银行、保险、信贷和投资服务可能都由同一家公司提供。客户会期望某些交易——尤其是通过银行账户进行的交易——仅对一个服务中心保密。对公司\
  \ *不* 实施限制的压力源于他们所掌握数据的商业价值。美国注册会计师协会（AICPA 1999）指出：\n\n> 随着公司和个人的更多交易以电子方式处理，将有可能根据交易模式和内容准确而深入地描绘个人和公司。商业企业、政府机构和不法个人对这些信息将有巨大的需求。将存在合法和非法的市场用于收集和转售这些信息。公司和公司内部的个人将被诱惑出售在保密情况下捕获的信息。许多公司将声称已建立防火墙以防止信息未经授权的传播。用户将需要保证已建立有效的程序。\n\
  \n如果公司 X 代表竞争对手提供数据处理服务，类似的“需求”信息是可以预期的。1993 年，维珍航空与英国航空之间爆发了一场激烈的争执，维珍指控英国航空根据其根据外包合同为维珍处理的乘客信息，开展了“肮脏手段”活动（Hawker\
  \ 1993）。最近，两家在线书商之间发生的类似争端以法庭案件告终，当时 Alibris，即为亚马逊提供互联网服务的公司的所有者，承认窥探了亚马逊的电子邮件流量（Silicon\
  \ 1999）。\n\n## 3.8 问题\n\n1. 你是律师事务所的资深合伙人。你在事务所的新 IT 系统上投入了大量资金，该事务所雇用了 50 多人。担任高级管理员、25\
  \ 年来一直忠诚且非常有效的员工，对 IT 带来的变化热情不足。该系统的选型和实施由一名两年前加入事务所的年轻、刚取得资格的律师主导。\n\n在管理新系统的安全方面可能会出现什么问题？请建议在这种情况下如何最好地分配一些关键职责。\n\
  \n2. 总部已向所有经理发出指令，声明在任何情况下都不得使用公司的电子邮件服务进行个人通信。它指出，经理将对其部门内系统任何滥用负责。\n\n你是一名负责二十名文员团队的经理，所有人都定期使用电子邮件。起草一份传阅给你的团队的备忘录，解释并论证该政策，并描述你打算进行的检查类型。\n\
  \n3. 你独自在公司伦敦办公室，晚上加班时电话响了。你不认识来电者，对方声称是公司多伦多办公室的一名会计。你知道公司在加拿大有大量员工，但对其了解不多。来电者带有加拿大口音。\n\
  \n\n\n\n\n来电者为这么晚打电话道歉，但表示他正承受巨大压力，需要为加拿大国家经理制作一份分析报告，而截止时间只有 3 小时后了。要下载必要的信息，似乎唯一可行的办法就是借用你的密码，并利用此密码对公司的国际会计系统进行广泛访问。来电者建议在他完成后你立即更改密码。\n\
  \n你会如何回应这一请求？你又如何在第二天向自己的经理解释你的回应？\n\n4. “信息系统及其控制措施必须与所服务的组织紧密匹配。” 请对这一论断进行批判性评论。\n\
  \n# 第四章 访问控制\n\nDOI: [10.4324/9780203992319-7](https://dx.doi.org/10.4324/9780203992319-7)\n\
  \n## 4.1 引言\n\n如果有人上门到你家并要求进入，你的即时反应就是实施访问控制。你首先会想核实该人的身份。你可能会认为谨慎的做法是透过窗户看一下，*在*开门*之前*确认是否认识来访者。如果是公务人员，你可能会要求查看身份证件，或对其进行盘问以判断其是否真实。一旦进入家中，你会期望对其行为施加一些限制。例如，想查看电表的人会被带到楼梯下的橱柜处，而不会被允许在屋内随意走动。另一方面，亲密的朋友则可能被信任可以随意走动。\n\
  \n信息系统中的访问控制也遵循同样的基本思路。Figure 4.1 是从本书引言中使用的图表（Figure I.3）发展而来的。请注意，即使用户*被*允许访问系统，也会对可使用的功能进行限制（图表中用勾号或叉号标记）。以这种方式强制执行的访问模式将为每个用户量身定制。\n\
  \n![Figure 4.1 ](img/fig4_1_B.jpg)\n\nFigure 4.1 \n\n本章关注的是系统相当于前门的环节。在示例中，简要描述了一种早期访问控制系统的实现方式，以及导致其被采用的原因。IBM\
  \ 在 1973 年为系统设定的目标至今仍然同样相关。\n\n## 4.2 用户识别方法的特征\n\n所有访问控制的起点都是对任何试图进入系统的人进行身份核查。由于这必须通过自动化手段完成，该过程通常比家门口的房主更为\
  \ impersonal（尽管扫描和识别人脸的技术现在已商业化）。之后，还可能启用其他类型的访问限制，这些将在本章后面描述。\n\n至关重要的是，如果有人在起初就欺骗了系统，并冒充授权用户，后续的所有防线都将彻底失效。因此，不出所料，人们投入了大量精力来设计可靠且万无一失的核查方法，以验证声称有权访问系统的人的凭证。\n\
  \n### 4.2.1 身份核查系统的特征\n\n一个良好的身份核查方法应具有以下特征。\n\n* 不允许出现 *假阳性*。假阳性是指系统判定用户有权访问，而实际上并非如此。例如，黑客入侵系统的目的通常就是说服系统自己是授权用户，从而制造假阳性。\n\
  * 不允许出现 *假阴性*。假阴性是指授权用户被误认为是 *未*授权用户而被排除在系统之外。乍一看，这似乎不是什么大问题。如果授权用户偶尔被排除在外，可能被视为不幸，但至少安全没有被破坏。然而，用户往往对假阴性反应强烈，这也是需要考虑的众多人为因素之一（见下文）。\n\
  * 使用时必须不会耗时或繁琐。用户不想在系统判断其身份是否真实时被长时间等待，也不愿接受冗长的提问或测试。他们真正感兴趣的只是开始在计算机系统上工作。\n* 必须适合其所应用的工作站的类型和位置。对于便携式终端和\
  \ PC，以及位于正常办公环境之外的工位，例如工厂或仓库，或从家中拨号接入的人来说，这可能是一个特别的问题。\n\n寻找最佳的身份核查方法必然涉及一定的妥协。如果筛查过于严格和苛刻，会让用户感到恼火，并增加假阴性的风险。如果过于宽松，用户可能会更舒适，但会增加放进冒名者的风险。\n\
  \n结果可以如 Figure 4.2 所示。如果一个组织决心将假阳性降到绝对最低，它会收紧控制并向图表左侧移动。这样做会冒着假阴性增加的风险。另一方面，如果组织对特别不愿得罪的人实施交易安全（例如取款机或家庭银行的客户），它可能担心假阴性会惹恼他们并失去客户。因此它会倾向于向图表右侧移动。在这种情况下，因偶发欺诈而产生的任何成本都可能被认为是为了良好的客户关系而值得接受。理想的访问方法将使曲线收敛于假阳性和假阴性均为零的点上。实际上，要接近这一理想而不投入非常高的费用是困难的（见\
  \ section 4.7）。\n\n![Figure 4.2 ](img/fig4_2_B.jpg)\n\nFigure 4.2 \n\n### 4.2.2\
  \ 用户识别方法\n\n用户识别方法可分为三大主要类型，基于：\n\n* 你所知道的东西（密码）；\n* 你所拥有的东西（令牌）；\n* 你个人的一个或多个特征（生物特征）。\n\
  \n在实践中，这些方法常被组合使用。例如，要从取款机取款，你需要使用你所拥有的东西（卡）以及你所知道的东西（个人识别号码）。只要它们彼此独立，这种组合就比每种方法单独使用要强得多：例如，不应能从卡上打印的账号等信息推断出你的\
  \ PIN 码（当然，持卡人也绝不应将 PIN 码写在卡*上*）。如果我们将 Figure 4.2 应用于现金卡的使用，结果将类似于 Figure 4.3\n\n\
  ![Figure 4.3 ](img/fig4_3_B.jpg)\n\nFigure 4.3 \n\n\n\n\n\n请注意，随着允许用户重新输入 PIN 的次数增加，误报的概率会稳步上升。另一方面，通过减少允许的重试次数，我们增加了合法用户被拒绝的可能性（即误报）。通常银行会在三次尝试时划线，这允许用户出现一两次“手指失误”的情况。此后它会将情况视为可疑，并中止交易（并且出纳机可能会吞卡）。\n\
  \n现在将三种用户识别类型进行更详细的检查。\n\n#### 你所知道的东西\n\n密码仍然是迄今为止最广泛使用的访问控制方法。这并不是因为密码是控制访问的特别强有力的方法（它们对用户来说也不特别受欢迎，尤其是如果他们必须为多个系统记住密码时）。然而，密码的主要优势在于使用它们不需要安装任何额外设备。输入密码只需要现有的键盘或键区。这与为每个人发放卡片或令牌的成本，以及在计算机终端中构建专用读卡器或识别设备相比。\n\
  \n密码可以相对*强*或*弱*。理想情况下，密码应尽可能强。强密码具有以下特征：\n\n* 它们不基于所有者的任何个人属性（例如配偶姓名、房屋号码、出生日期或星座，或任何可以通过几番询问就能发现的数据）。\n\
  * 它们尽可能长。仅仅增加字母或数字的数量就会使密码更难猜测。\n* 使用的字符范围尽可能广（大小写字母、数字和特殊字符，如 ! 或 \\*）。\n* 它们是随机生成的（例如，2$hP91j，而不是\
  \ LETMEIN）。\n\n弱密码具有与上述列表完全相反的属性。如果我的生日是 1 月 23 日，那么 2301 这个密码将是一个非常弱的密码，因为它很短、只由数字组成，并且很容易被猜到。这个使访问码难以猜测的问题实际上早于计算机，正如理查德·费曼的实验所显示的那样。\n\
  \n同样重要的是密码的*管理*。计算机系统可以强制执行一些规则，例如：\n\n* 密码必须在设定的间隔内更改（比如每周一次或每月一次）。\n* 新密码应始终与以前使用过的密码不同，即用户绝不允许“重复使用”旧密码。\n\
  \n系统还可以通过以下方式间接支持良好的密码制度的维护：\n\n* 为用户生成密码以确保它们具有前面所述的“强”特征，或在用户自行选择时审核密码是否合适；\n\
  * 在输入密码时抑制密码的显示。一个惯例是在屏幕上用无意义的字符（例如星号）代替密码的每个字符显示。这使用户能够判断是否已输入所有字符。与此同时，旁观者观看屏幕时无法读取密码。当然，旁观者可以看到密码的长度，这可能有助于猜测密码。从数据安全角度来看，最好屏幕上完全不显示任何内容；然而，用户喜欢在每次输入字符时看到某种反应。即使抑制显示，也可能有人通过观察键盘而不是屏幕来发现密码，正如“肩窥”示例所述。\n\
  \n管理层还应强制执行其他规则，包括：\n\n* 员工绝不应以书面形式存储密码在任何其他人可以方便访问的位置。（这尤其适用于明显的藏匿处，如办公桌的顶层抽屉，或放在计算机旁的软盘盒。）\n\
  * 密码不应被共享或“借给”其他人以使其能够临时访问系统。\n* 任何怀疑密码已被泄露的人都应通知管理层，或如果系统允许，则立即更改密码。\n* 确保新密码通过安全渠道发放给员工，例如由密码管理员通过密封且防篡改的信封传递给员工。\n\
  * 确保密码在不再需要时立即失效（例如，员工离职时）。\n\n#### 你所拥有的东西\n\n密码容易出错，因为人们会忘记它们，或记错了部分数字的顺序，或输入错误。这些问题可以通过将个人身份代码纳入某种*令牌*来解决。最熟悉的令牌形式是标准的\
  \ 3⅛ 英寸乘 2⅛ 英寸塑料卡，其代码存储在卡背面的磁条上。比个人以密码形式合理记住的范围更广泛。此外，除非卡片以某种方式损坏，否则每次将其送入适当的读取设备时，它都会提供准确可靠的读出。\n\
  \n新型令牌不断被引入。它们有各种形状和形式，主要要求是小巧、轻便且不易损坏。应方便携带在口袋或手提包中，或作为手镯或项链的一部分佩戴。有些必须与读取设备接触，而其他一些则可以使用红外线或无线电频率在远距离检测到（在这方面，它们类似于汽车报警器中使用的遥控设备）。\n\
  \n令牌的主要弱点是它们可能落入错误的人手中。它们易于携带使得它们特别容易丢失或被盗。因此，令牌应始终与其他独立的身份验证形式（如密码或指纹）结合使用。\n\n\
  复制也是一个问题。例如，制造或获取能够精确复制标准磁卡的设备并不太困难。即使卡上的数据对制作复制品的人来说毫无意义（也许是通过加密），这也无关紧要。复制品与原件无法区分足以确保系统会被欺骗而允许访问。\n\
  \n抵消这些漏洞的一种方法是为令牌引入一些“智能”。这意味着加入一个微小的处理芯片，实际上将令牌变成一台微型计算机。这可以用 3⅛ 英寸乘 2⅛ 英寸的塑料卡来实现，制成仅比普通信用卡或借记卡稍厚的卡：这些通常被称为*智能卡*。智能卡可以用多种方式使用，例如：\n\
  \n* 它们可能包含一个小型平面键盘，用户在其中输入密码以激活卡。\n* 它们可能有一个显示面板，显示每隔一分钟左右就会改变的访问码。用户读取该代码并将其视为临时的一次性密码。与此同时，控制对系统访问的程序知道在任何给定时间应从每个用户那里期望哪个代码。\n\
  * 卡本身可能被读卡器询问，并利用其逻辑计算出正确的响应。这种逻辑不能像磁条上的数据那样被复制。（即使尝试拆解卡片以试图弄清逻辑，它也会被设计成这样会导致不可逆的内部损坏，使任务变得不可能。）\n\
  \n\n\n\n\n#### 一个或多个你的个人特征\n\n理想的识别方法是不需要用户记住密码或携带令牌。相反，他们只需向计算机系统展示自己，并由其*固有*的某些方面进行识别。系统当然必须对所有可能的用户以及将被检查的特征有记录信息。\n\
  \n这种方法依赖于*生物特征识别*，即对人体的某些预定义且永久的识别特征进行测量。最常见的是这些测量基于声音、手或眼睛。其想法是用户应通过某种快速且自然的动作来识别，例如说出一句话，或将手放在扫描仪上。这消除了与分发和存储密码或令牌相关的许多问题。然而，生物特征方法仅在有限程度上被引入，因为：\n\
  * 生物特征识别依赖于对大量数据进行复杂的模式识别。因此运行身份检查需要大量的计算能力和数据存储容量。\n* 建立生物特征检查系统往往更复杂。用户必须在受控条件下说出一些示例短语，或允许采集指纹。如果用户都是同一公司在同一建筑物工作的员工，这可能并不太困难，但对于银行客户等分散的用户来说则可行性要低得多。\n\
  * 系统与其他系统一样，必须进行调整以尽量减少误报和漏报。必须允许一定的误差范围。例如，如果使用语音识别，就不能期望人们总是以完全相同的方式说出短语，并且诸如嘶哑或胸部感染等状况会改变声音的某些特征。然而，在允许这种误差时，始终存在向图\
  \ 4.2 右侧移动过远并放进误报的危险。\n\n决定生物特征应用的另一个关键因素是对用户而言该方法的可接受性。一种可能非常准确的识别人员的方法涉及使用激光束照向眼睛后部，以检查视网膜中血液毛细血管的图案。虽然这可以在不损伤眼睛的情况下完成，但许多人对接受视网膜扫描感到抗拒，部分原因是他们担心视力会受损，部分原因是盯着特殊传感器看很不自然。\n\
  \n因此，关注点转向了使用虹膜图案作为识别基础的可能性。虹膜位于眼睛外部，并且可以从远处扫描。最终，研究人员希望能够使计算机扫描一个人的面部，并以与人类大致相同的方式识别它。然而，如果机器要能够考虑不同的光照条件、面部角度、化妆的使用等，这将需要相当高的复杂性。\n\
  \n提供指纹进行检查的想法，如同视网膜扫描一样，可能会遇到一些抵制，因为在公众心目中，指纹与警察逮捕嫌疑人时遵循的程序有关。更可接受的替代方案是使用手部几何形状，手部放在平面上并测量其尺寸。还可以使用个人签名，以正常方式书写但在特殊敏感板上。在这种情况下，重要的是记录笔的运动模式，而不仅仅是签名的形状，否则该方法很容易通过传统的伪造而被滥用。\n\
  \n即使使用常规键盘也可以提供一些身份识别的线索，尽管这对于访问控制目的来说并不太实用。因为每个人在键盘上工作都会形成一定的风格和节奏，所以可以通过分析击键记录来识别用户。这在检查已登录的人是否确实是他们声称的人时很有用。\n\
  \n![Figure 4.4 Picture of fingerprint reader with keypad](img/fig4_4_B.jpg)\n图 4.4\
  \ 指纹读卡器带键盘的图片\n\n总之，以下方法可用于生物特征识别：\n1. 被动测试（用户无需采取任何行动）：\n    * 视网膜图案；\n    * 虹膜图案；\n\
  \    * 人脸识别；\n2. 主动测试（用户必须以某种方式参与）：\n    * 手部几何形状；\n    * 指纹；\n    * 语音模式；\n   \
  \ * 手写签名；\n    * 击键模式\n\n### 4.2.3 适用于所有识别方法的补充措施\n\n无论使用何种识别方法（或方法组合），都可以应用某些措施来加强对用户\
  \ ID 滥用的保护。重点可以放在旨在*预防*的控制上，或*反馈*控制上，后者有助于在滥用发生后检测到它。\n\n#### 预防\n* *终端超时*。如果用户已登录，但一段设定的时间内未发生任何活动，系统将断开用户连接。这降低了其他人发现终端无人看管并阅读显示内容，或利用终端在无人看管时仍运行的访问权限的风险。类似的效果可以通过使用“屏幕保护程序”来实现，其工作原理大致相同：如果似乎没有人使用计算机，屏幕上的材料将被图案或图片替换，只有输入屏幕保护程序密码后才能移除。\n\
  * *访问与工作模式绑定*。通常员工只需要在正常工作时间或从自己工作区域的终端访问系统。如果是这样，系统可以设置为将访问限制为例如某个特定办公室的终端，周一至周五上午\
  \ 8:00 至下午 6:00。\n\n#### 反馈\n* *有关先前登录的信息*。每当用户登录时，系统应回复一条消息，说明该用户 ID 上次使用的时间。这使用户可以检查日期和时间是否与其回忆或其正常工作模式一致。明显的问题示例是，如果系统声称该\
  \ ID 在周末凌晨办公室关闭时被使用。用户应立即提醒系统管理员该 ID 很可能已被泄露。\n* *对 ID 使用情况的分析*。某些情况明显可疑，例如，如果同一\
  \ ID 在同一时间被用于两个不同地点的登录。可以使用分析软件浏览系统登录记录，突出显示任何不应该发生的情况。这种分析也可以在“实时”进行，使可疑登录在发生时被阻止或质询，从而将其从反馈型控制转变为预防型控制。\n\
  \n其他形式的反馈和预防性控制在第 5.1 节中讨论。\n\n## 4.3 系统范围的访问控制\n\n许多组织中发现的 IT 格局是多年添加、扩展和修改各种系统混合的结果。随着部门合并，或各自为政地进行\
  \ IT 采购，或因无法负担更换而勉强使用过时的软件，结果形成了一片凌乱的 IT 拼凑物。（唯一大家通常能达成一致的是，如果能重新开始，他们几乎肯定会做得不一样）。\n\
  \n\n\n\n\n这种来自过去的遗留问题也可能使 IT 系统难以与当前的组织结构和边界非常精确地保持一致。这一点所带来的一些影响已经有所涉及（参见第 1.6\
  \ 节和第 3.3 节）。不幸的是，整个访问控制的概念都依赖于能够在被保护的实体和未被保护的实体之间做出明确区分。这迫使必须非常精确地决定系统的边界在哪里，以及谁被允许使用它们。如果以往的做法是设施以非正式方式共享，或者对于一些较老旧或使用频率较低的系统而言“开放访问”一直是常态，那么这可能会证明特别困难。\n\
  \n传统上，访问控制的边界设定在两个层级。第一层标志着*通用控制*的适用点。理想情况下，这些控制涵盖组织中使用的所有 IT 设施。有时，考虑一个较小的单元可能是合适的，例如一个单独的办公地点或一家公司的部门。在第二层级，*应用控制*用于在人们开始使用单个设施（此处的“应用”指基于特定软件的服务，例如会计或计算机辅助设计）后调节访问和使用。许多组织中\
  \ IT 的拼凑式演进意味着该模型在实践中往往无法非常完美地契合；然而，它有助于探讨访问控制最好如何以及在何处进行管理的一些问题。\n\n在通用边界上的访问控制可以类比为使用共享办公楼外门的钥匙。这是获得你想要使用的设施访问权限的第一步。给予你这种“通用”访问并不意味着你被允许在建筑物内自由漫游。一旦被准入系统，你会发现自己被限制在被认为与你的需求相关的应用范围内。这可以类比为能够进入一栋办公楼，但被迫使用只能停在你工作楼层的电梯。这种控制模型在图\
  \ 4.5 中有所描述。\n\n![Figure 4.5 General and application controls](img/fig4_5_B.jpg)\n\
  \nFigure 4.5 General and application controls\n\n在业务系统中，一些应用（如电子邮件）将对几乎每个人开放。其他应用（如研究与开发或市场营销使用的数据库）则包含具有相当商业价值的数据，因此其使用将受到更严格的限制。理想情况下，通用访问控制应为每个人呈现系统的“逻辑”视图，给人一种印象，即除了该用户被授权的应用之外没有其他应用。因此用户\
  \ A 和用户 B 在首次登录时可能会看到两套截然不同的选项（参见图 4.6）。以这种方式隐藏应用对用户来说很方便，因为他们不会浪费时间尝试进入被禁止的应用，同时也使有志于黑客攻击和欺诈的人的生活变得更加困难。\n\
  \n![Figure 4.6 Two versions of logons to applications](img/fig4_6_B.jpg)\n\nFigure\
  \ 4.6 Two versions of logons to applications\n\n需要允许每个用户访问的权限需要在*访问控制表 (ACT)*中定义。这是一个在软件中创建的表格，将用户和应用关联起来。在最基本的形式中，访问控制表将列出所有授权用户，并显示应为每个用户开放的应用（如下图所示图\
  \ 4.7）。它最好是中央操作系统或网络管理软件的组成部分；由于访问控制对安全至关重要，最好将其设计并构建到软件的核心中。如果认为基本操作系统存在弱点，或为了帮助日常管理对\
  \ ACT 的更改，也可以购买专门的安全软件产品来加强控制。\n\n![Figure 4.7 Access Control Table](img/fig4_7_B.jpg)\n\
  \nFigure 4.7 Access Control Table\n\n任何能够修改访问控制表的人都处于极其强大的地位。因此，至关重要的是该表本身必须受到严格的访问控制，只有少数高级员工被授权对其进行更改。\n\
  \n## 4.4 应用控制：多重与单点登录\n\n一旦用户获得了对应用的合法访问，是否需要施加进一步的访问控制取决于应用的性质。例如，每个电子邮件用户都需要大致相同的标准功能；使用市场数据库的人希望能够浏览其中包含的所有数据。在这些情况下，对应用的访问意味着可以自由使用而无需任何进一步限制。\n\
  \n在其他情况下，需要引入额外的控制层级。例如，一名初级职员可能被允许访问会计系统，但仅限于录入订单或发票。而他的主管则被允许执行更敏感的任务，例如在系统中录入新客户和核销坏账。同样，对于跟踪仓库货物情况的应用，某些人仅限于查询库存状况，而其他人则被允许在货物进出时记录变更。在医院，初级员工可能能够使用患者管理系统查找患者的所在位置，但不能浏览其他患者详情。应用层级控制的增加在图\
  \ 4.8 中有所说明。\n\n![Figure 4.8 ](img/fig4_8_B.jpg)\n\nFigure 4.8 \n\n在图 4.8 中，应用内的访问（以会计为例）由一个额外的\
  \ ACT 决定，显示应为每个用户提供的功能。\n\n如果以这种方式为应用创建单独的访问控制制度，则存在一些优缺点，如下所示。\n\n### 优点\n\n* *接近性*。如果有某个部门是应用的主要使用者，访问控制的责任可以分配给其高级员工之一。该人员将处于了解应用使用方式的良好位置，因此可以判断部门不同成员可能需要的访问类型。\n\
  \n* *响应性*。将责任移交给驻用户部门的人员意味着用户请求更新和更改，以及报告他们对控制工作方式的任何担忧应该会更容易。\n\n### 缺点\n\n* *登录的复杂性*。以最常见的情况为例，即使用密码，创建完全独立的访问控制制度意味着用户必须先输入一个密码进行通用访问，然后再输入另一个密码进入应用。用户可以理解地不愿使用多个密码。可以安排使用相同的密码用于两种情况（该过程称为*同步*密码）。然而，这意味着本地密码管理员与中心之间需要不断联络。此外，并非总能对不同软件包中的密码格式和用户\
  \ ID 应用相同的约定。如果使用任何令牌或生物识别方法，复杂性会倍增。\n\n\n\n\n\n*划分职责*。设置和维护访问控制的责任现在分散在两个地方，用户可能会觉得烦人且令人困惑，尤其是当他们试图解决紧急问题时。\n\
  \n解决“多重密码”问题的一种方法是采用基于 `single sign-on` 的方法。要使其发挥作用，必须在控制两个不同层级的软件之间建立安全链接。一旦用户通过了通用访问控制，其信息就会自动转发给应用程序软件。应用程序软件随后将此作为身份证明。\n\
  \n单点登录可以通过两种不同的方式实现：\n\n* `Scripting`。通用访问控制软件存储应用程序软件会识别的用户 ID 和密码。这些信息以模拟用户在屏幕上输入相应登录序列的效果的方式传递给应用程序软件。\n\
  * `Authentication server`。所有访问控制都移交给一台专门的服务器机器。该服务器对每个用户进行初始检查。与应用程序交换专门编码的信号以传递用户身份。对于这种方法能够发挥作用，每个应用程序必须嵌入特殊代码，以处理并响应来自身份验证服务器的信号。\n\
  \n`Scripting` 实现起来容易得多，但很难做到完全安全。如果脚本不够正确，可能会出现不可预测的结果，并且应用程序可能会返回令人困惑的消息。身份验证服务器是控制的更好手段，但需要付出相当多的努力来设置和管理。在任何一种情况下，单点登录都应仅作为覆盖整个组织的协调良好的努力来进行\
  \ Hardy 1996。\n\n## 4.5 构建和实施访问控制规则\n\n访问控制设施通常作为软件包的标准功能提供。作为此类功能，它们应与其他任何方面一样彻底地进行审查。例如，在比较会计产品时，接受供应商的保证说外币处理或报告生成“只是小儿科”会被视为天真。会立即要求提供文件和演示来支持此类说法。\n\
  \n此外，购买者通常期望发现某些软件包比其他软件包更适合，只是因为它们与业务需求的“契合度”更好。同样原则适用于访问控制。评估这一方面可能相关的一些标准包括：\n\
  \n* 控制所需的 `granularity` 程度。例如，在控制对数据的访问时，是否需要能够区分到单个数据项的级别，还是更概括的控制就足够了？\n* 创建 `ACT`\
  \ 条目时的 `user-friendliness`。从头开始构建 `ACT` 非常耗时。产品应提供有效的帮助和快捷方式。\n* 控制的 `sharing` 和\
  \ `delegation`。例如，受保护文件的拥有者是否希望自行决定授予其他用户访问权限，而无需向安全管理员请示？\n* 与组织 `standards` 的一致性。示例包括公司要求所有密码在设定的时间间隔后更改，或是否使用单点登录。\n\
  * `specific to the organisation` 的要求。也许需要能够将访问权限与位置、终端标识符或一天中的时间相关联？\n\n为了使访问控制易于操作，一些供应商将其简化为最基本的功能。例如，他们可能会创建有限数量的预定访问“级别”。这让人想起分层/军事化安全方法。每位员工被分配一个数字，例如一到九之间：数字越高，可访问的设施范围越大。问题在于，在给定级别上的设施组合可能与任何特定员工的工作说明书不完全匹配。因此，在一款面向小型企业的会计软件包中，所选级别将决定员工在\
  \ *所有* 设施上的权限范围，从分类账、库存和税务记录到折扣、价格和报告格式的设置。这不允许出现例如员工仅需要对销售分类账具有较高访问级别的情况。系统坚持必须在整个设施范围内授予同样高的访问级别。\n\
  \n信誉良好的软件包通常在分配访问权限方面提供更大的灵活性。例如，应该能够定义用户将被允许执行的任务类型的精确列表。理想情况下，每个任务都可以链接到用户为执行它而选择的特定图标或菜单选项。其效果是使其中一些保持为“活动”功能，而其他功能则拒绝执行，或根本从屏幕上呈现的选项中消失。\n\
  \n为了了解在这种情况下如何加快设置 `ACT` 的过程，让我们考虑一个涵盖三个主要功能区域 `F1`、`F2` 和 `F3` 的假设系统。在会计系统的情况下，例如，这些可能对应于围绕销售、采购和总分类账的活动。如果一名职员仅处理常规客户交易，则无需直接访问采购和总分类账。对这些的访问因此可以整体禁止，如\
  \ Figure 4.9 所示。\n\n![Figure 4.9 ](img/fig4_9_B.jpg)\n\nFigure 4.9 \n\n然而，就销售而言，我们可能希望缩小对职员允许做什么的定义。因此，我们将遍历\
  \ `F1` 内的子功能，打开一些，关闭一些，如 Figure 4.10 所示。\n\n![Figure 4.10 ](img/fig4_10_B.jpg)\n\
  \nFigure 4.10 \n\n用于执行此操作的屏幕示例显示在 Figure 4.11 中 [取自 Sage Sterling]。\n\n![Figure\
  \ 4.11 ](img/fig4_11_B.jpg)\n\nFigure 4.11 \n\nFigure 4.11 显示为一位用户设置选项，该用户将被禁止访问总分类账，但对客户和供应商交易给予部分访问权限。为了更详细地指定访问权限，有必要请求下一级，并切换“Access\
  \ Type”列中的条目。在 Figure 4.11 中，这正是在“Customers”下的任务中进行的操作。\n\n然而，并非所有软件包都适合以这种方式工作的控制。有时有必要以不同的方式应用访问控制，集中在人们对读取和写入数据的权利上。这在下一节中讨论。\n\
  \n## 4.6 对数据库和聚合数据的访问\n\n`Databases` 最初被设想为集中管理的、可供组织中每个人使用的中央数据存储库。在“真正的”数据库中，所有数据都由一个名为\
  \ `Database Management System (DBMS)` 的软件管理。任何从数据库读取或写入的数据都必须通过 `DBMS`，后者强制执行数据编码和组织的标准方法。目标是确保存在单一、可靠的数据来源，该来源独立于使用它的应用程序。`DBMS`\
  \ 的这种“托管”角色使其成为强制执行某些类型访问控制的有用位置。`DBMS` 的功能在 Figure 4.12 中示意性地显示\n\n![Figure 4.12\
  \ ](img/fig4_2_B.jpg)\n\nFigure 4.12 \n\n\n\n\n\n不幸的是，‘database’ 已被证明是一个有用的词，用来描述任何类型的庞大数据集合。即使已经安装了数据库软件产品（现在已有数款可在普通\
  \ PC 上运行），也无法保证它实际上被用作 DBMS。它可能只是以一种方便的方式保存一个大型文件，该文件需要以各种相当复杂的方式进行搜索。在这种情况下，数据库没有系统范围的作用，实际上与任何其他应用程序没有什么不同。\n\
  \n如果数据库 *确实* 对整个组织使用的数据拥有保管权，那么访问权限的控制就成为一个关键问题。尽管某些应用程序可能会定期向数据库输入数据，但严格来说，这些数据并不‘属于’它们。数据现在已成为整个组织拥有的资源。\n\
  \n因此，有必要仔细查看数据库的每个用户被允许做什么。对数据的访问权限可分为以下五大类：\n\n* READ. 用户可以读取数据并复制，但不能以任何方式更改它。\n\
  * WRITE. 用户可以输入新数据。这通常适用于 *预期* 的数据，即已经为其创建了空字段。\n* UPDATE. 用户可以更改现有数据。例如，薪水可能会从每年\
  \ £15,000 更新为 £16,000。在此上下文中，删除现有条目也等同于更新。\n* CREATE. 用户可以建立新的记录或文件。例如，可以为新员工创建记录，或建立一个新文件来保存来年的销售信息。\n\
  * DELETE. 用户可以删除现有记录或文件。\n\n在每种情况下，‘用户’可能是使用查询程序（基于诸如结构化查询语言之类的搜索语言）的人，也可能是依赖数据库获取数据的应用程序。当然，该应用程序最终也会响应来自‘用户’的命令。\n\
  \n数据库的 ACT 往往很复杂，因为它必须为每个用户-应用程序指定可访问的数据以及允许的使用类型。在某些情况下，访问需要指定到单个数据字段的级别。\n\n例如，员工记录可能包含多个字段。Figure\
  \ 4.13 仅显示了张先生的六个字段。前三个字段显示姓名和出生日期，不应更改，因此对大多数用户应为 *只读*。然而，一个或多个用户将需要能够 *更新* 接下来的两个字段，因为哈罗德在公司的发展过程中会有所进步。评估字段也需要在未来某个时间点\
  \ *写入* 等级。哈罗德的记录将在他加入公司时 *创建*，并在离职时 *删除*（至少从当前员工文件中删除）。\n\n![Figure 4.13 ](img/fig4_13_B.jpg)\n\
  \nFigure 4.13 \n\n所有这些都必须在数据库的 ACT 中指定。设置此项需要了解数据库的复杂性以及可能使用它的应用程序。因此，这不是一般管理层应期望直接干预的任务。相反，需要向技术团队传达指导方针，特别是向数据库管理员传达。由于由此产生的访问规则涵盖数据库的所有用户，它们应被视为\
  \ *一般* 而非 *应用程序* 级别的控制。\n\n由于数据库旨在成为广泛使用的资源，通常会发现只读访问被广泛提供。存在一种危险，即关注点集中在对数据完整性构成潜在威胁的更活跃的访问权限上。例如，在错误的人手中，更新或创建记录的能力在实施各种欺诈时可能非常有用。然而，即使是只读访问权限也应谨慎审查。这尤其适用于数据库包含个人身份信息（例如上面引用的\
  \ H. Chang 的记录）或具有商业敏感性（例如显示按产品和地区划分的销售明细）的情况。\n\n一个常见的要求是应提供整体概览（例如显示某一职级的员工人数，或全国的销售数量），同时拒绝访问更具体的细节。这使得数据可以用于规划和行政决策，而不会冒泄密风险。这类总体统计数据可以通过\
  \ *聚合* 数据来提供，使其减少为‘北部办公室有 25 名员工年薪超过 £20,000 p.a.’之类的形式。或者，记录可以被 *匿名化*，这样细节得以保留，但无法与个人姓名或地点关联。这种‘去识别化’可能是数据库中保存数据的永久特征，也可能通过在对可能敏感的记录进行查询时使用的特殊保护例程来强制执行。用于在这些情况下保护匿名性的技术有时统称为\
  \ *Privacy Enhancing Technologies (PET)*。PET 设计用来抵御的威胁是 *inference attack*。推断攻击可以通过多种方式进行（Hinke\
  \ *et al* 1997），但都具有相同的目标。提交多个（完全合法的）查询给数据库，每个查询都给出匿名且看似无害的结果。然后将这些结果进行比较，以推断特定的信息。最简单的技术，最早由\
  \ Hoffman 和 Miller (1970) 指出，涉及在比较略有不同的聚合数据时使用一定的狡猾。假设，例如，可以从数据库中检索以下陈述：\n\n> 北部地区\
  \ 10 名经理的平均薪水 = £28,000\n\n这是一个聚合陈述，完全不提供任何关于个人经理的信息。\n\n然而，假设一周后同样的查询给出响应：\n\n\
  > 北部地区 11 名经理的平均薪水 = £29,000\n\n简单的算术运算表明，如果平均值增加了 £1000，那么新经理的薪水必须为每年 £39,000。如果查询者知道新任命到北部地区经理的身份（来自数据库或其他地方），那么将个人与薪水联系起来就变得非常简单。\n\
  \n## 4.7 一些风险和成本问题\n\n访问控制的可能弱点，如同任何其他控制一样，可以接受风险分析。然而，在估计损失的严重性时，组织可能会对他们认为特别有害的失败类型持有不同的看法。例如，如果直接向公众提供在线服务，假阴性可能被认为极其不\
  \ desirable，因为客户可能会感到不满，并可能通过转向竞争对手来表达这种不满。事实上，许多金融服务公司宁愿接受一定数量的假阳性以及随之而来的欺诈，也不愿承担这种风险。因此，他们会将接受标准稍微偏向宽松的一面。\n\
  \n另一方面，如果组织需要保持公众对其处理机密数据能力的信任（例如保险公司，或许多公共部门机构），它将更担心假阳性。这些组织最不希望看到的是报纸报道称其文件已被入侵，并获得了有关其客户个人事务的详细信息。\n\
  \n\n\n\n\n访问控制还应从投资回报率以及其他衡量资金使用效益的指标（见第 2.7 节所述）角度加以考虑。例如，一种购买成本低廉的访问控制机制（也许因为它只是廉价套餐中内置的几个基本选项）可能导致高昂的经常性成本，这是因为随后花费在排解问题和与\
  \ ACT 更新搏斗上的员工时间。另一方面，成功的单点登录项目则需要大量的前期投入，但从长远来看有望大幅降低成本（例如，通过集中维护所有密码，以及减少员工的中断和浪费时间）。\n\
  \n不幸的是，访问控制方面的投资通常与其它投资决策不可分割地联系在一起。例如，如果一家公司正在运行计划在一年或两年内更换的旧“遗留”应用程序，它就不愿意现在投入资金来升级以改善访问控制。在这种情况下，问题不在于访问控制不合理地昂贵，而在于其投资回报期短或不确定。\n\
  \n同样，可能组织已承诺在所有系统中使用特定类型的令牌进行访问控制。因此，所购买的任何新软件都必须能够支持这种方法。其结果可能是原本很有希望的一两个产品不得不被排除在候选名单之外，而最终选定的产品因此可能无法提供最佳的资金使用效益。在这里，软件购买者实际上是在为保持与组织更广泛的安全目标一致而支付溢价。\n\
  \n## 4.8 问题\n\n1. 汽车修理厂的服务部门使用一套计算机系统，提供以下功能：\n    * 预约车辆进行保养和维修；\n    * 订购和跟踪备件；\n\
  \    * 跟踪在制品以及每个工单所花费的时间；\n    * 为客户准备明细账单；\n    * 在服务到期时向客户发送提醒信函。\n\n    该系统由接待员（同时处理所有电话呼叫）、管理员（负责账目）以及一名主管和五名技工组成维修团队的人员使用。\n\
  \n    为该系统制定一个简单的访问控制表。对每种用户类型对每个功能的访问权限进行说明，并在每种情况下标明你是否允许访问为“完全”、“部分”或“无”。\n\n\
  2. 你负责一个社区社会工作团队，你的几名员工已配备便携式 PC 用于记录有关客户的信息。在与社会服务主管的非正式讨论中，她表示她刚刚读到一篇关于语音识别软件的文章。她认为这将为员工提供比基于密码的现有系统更方便的身份识别方式。你指出可能存在一两个缺点，并承诺就此事撰写一份简短备忘录。\n\
  \n    写一份简短备忘录（不超过 400 字），说明在这种情况下使用语音识别进行用户身份识别的优点和缺点。\n\n3. “最终，密码的使用将完全消失。”你同意吗？指出试图用基于令牌和生物特征的其它识别方法取代密码时可能存在的一些缺点。\n\
  \n4. 解释单点登录如何为大型企业中的员工带来好处，并解释在试图实施此类方案时可能出现的问题。\n\n# 第五章 业务流程内部的控制\n\nDOI: [10.4324/9780203992319-8](https://dx.doi.org/10.4324/9780203992319-8)\n\
  \n## 5.1 引言：交易与流程\n\n上一章描述了如何对登录信息系统的用户的凭证进行核查，并决定向其开放哪些设施。本章将探讨下一步，即控制用户实际开始工作后发生的事情。可能需要对输入的数据类型或其处理方式进行核查。可能需要向用户发送警告信息，或记录某些类型的活动。这些核查通常关注数据本身的准确性和完整性，而不仅仅是用户所采取的操作是否被授权的问题。\n\
  \n任何在终端或 PC 上工作的人都在不断地与信息系统进行 *交易*。例如，假设一名用户登录，查询她的电子邮件文件夹，查找最新的生产统计数据，并指示会计软件发出采购订单。每项活动都将由不同的软件\
  \ *应用* 执行。在一个应用内部，交易是活动的基本单位，为用户完成一项任务，该任务他或她可能做过很多次，并且是日常例行工作。\n\n在信息系统术语中，这类应用统称为\
  \ *事务处理系统*。它们可以与其它类型的软件形成对比，例如电子表格和财务模型，这些软件允许用户更自由地操作数字和做出假设。这些通常用于探索战略选项并进行临时分析。在这些情况下，应用被描述为为用户提供\
  \ *决策支持* 设施。\n\n在此上下文中使用“交易”一词可能会令人困惑，因为它在其它地方往往有完全不同的含义（例如，耗时数月谈判的房产交易可能被视为一次单一的业务“交易”）。然而，就以下分析而言，将采用在计算机系统上下文中通常应用的、更狭窄的定义。\n\
  \n每笔交易将涉及一个或多个以下序列：\n\nINPUT → PROCESSING → OUTPUT.\n\n*输入* 通常来自人工操作员，按键或点击鼠标。有时，活动会在计算机系统内部自动启动，当一笔交易触发另一笔交易，而无需任何进一步的人为干预。例如，当仓库被要求发货某些货物时，其库存下降可能低于预先选定的再订购水平。然后可能会自动启动一笔交易来订购商品以补充货架。\n\
  \n交易的 *处理* 可能在大型中央计算机上进行，也可能在用户自己的 PC 上进行，或由两者协同完成（这种安排称为 *客户端-服务器*）。*输出* 然后会被发送回用户的显示屏、打印设备，或发送到中间目的地，例如磁盘文件或网络。\n\
  \n由于交易种类繁多且规模不一，因此并不总是容易明确定义每笔交易的开始和结束。例如，如果输出不是立即发送给用户，而是放入某种队列以便稍后检索，那么交易究竟何时完成？在设计系统控制时，这类细节可能至关重要。然而，暂时忽略所有此类复杂性。交易将被假定为用户执行的一项简单任务。它可能涉及在价格表上查找一些细节、更改客户的信用额度，或让系统生成一份标准的月度报告。\n\
  \n\n\n\n\n当然，在许多情况下，需要一系列*交易*才能实现特定目标。这些交易可能由不同地点的人员执行。整个系列被视为构成一个*业务流程*。将贷款申请通过所有必要步骤，从接收表格到向客户发送要约信，就是一个业务流程。发行彩票、核对号码与开奖结果、向幸运获奖者寄送支票的顺序也是如此。Davenport\
  \ (1993：5) 提供的正式定义是：\n\n> 一种有结构的、可衡量的活动集合，旨在为特定客户或市场生产指定的输出……因此，流程是在时间和空间上对工作活动的特定排序，具有开始、结束，以及明确识别的输入和输出：一种行动结构。\n\
  \nDavenport 提到了‘输入’和‘输出’适用于整个流程。因此，情况可以如 Figure 5.1 所示。\n\n![Figure 5.1 ](img/fig5_1_B.jpg)\n\
  \nFigure 5.1 \n\n通常，整个*流程*的输入和输出将是与客户互动的基础。因此，贷款申请人可能会填写表格，这就成为*流程输入*。*流程输出*可能是提供贷款的个性化标准信函，并说明条款和条件。中间的所有交易都将是公司内部的。其中一些涉及操作员与屏幕交互，并一次处理一个客户。其他可能涉及‘批量’处理，即将相同细节对多个客户一起处理，例如，将他们的姓名和地址全部添加到邮件列表中。\n\
  \n本章主要集中于应适用于典型交易输入、处理和输出的控制。更广泛的控制，基于跟踪单个案例从流程一端到另一端的进展，在与审计员的角色相关联时进行讨论，其角色和职能在\
  \ Part 5 中描述。\n\n交易控制可能旨在通过*预防*或*反馈*来运作。预防性控制预见到潜在的问题情况，并在怀疑出现问题时立即介入。反馈控制则事后运作，使问题来源能够在*事件发生后*被识别。因此，如果客户试图下达超过其信用限额的订单，这可以立即通过预防性控制检测到。另一方面，如果客户用无效支票付款，可能要等一段时间银行才会收到坏消息，这时才作为反馈控制发挥作用。\n\
  \n预防性控制可能以*咨询性*或*强制性*的方式运作。如果控制仅是咨询性的，则可以被推翻。我们那位超过信用限额的客户仍可被允许下单，如果决定这样做符合公司利益的话。另一方面，公司可能有严格的（强制性）规定，客户绝不能超过信用限额，如果是这样，系统将被编程为拒绝接受该订单。\n\
  \n反馈控制由于其本质，通常是咨询性的，因为它们表现为某种报告或错误信息。有时反馈可迅速获得，可以设想在某些情况下强制以特定方式做出反应是有用的。然而，这可能存在危险。（读者可参考本章末尾的问题\
  \ 1，考虑一些示例）。\n\n### 5.2 输入：应用于数据捕获的检查\n\n将数据输入商业计算机系统需要控制，以确保数据的*质量*合理（即尽可能准确），并防止引入可能对系统产生任何*不利影响*的数据。输入检查应被视为过滤掉可能导致日后问题的任何内容的首要且最佳机会。\n\
  \n有时应用程序对接受数据的形式和格式相当灵活。日常例子是文字处理软件。它假设用户应被允许输入他们想要的几乎任何内容。同样，电子表格或图形软件包中的通用功能允许完全自由地输入数据，而不考虑其准确性、完整性或适当性。越来越多地，这些软件包提供进行某些类型检查的选项，这些将在第\
  \ 5.2.5 节中讨论。可以制定公司政策使用这些检查，或通过模板和宏等设施施加一定程度的强制执行。然而，所谓‘通用’办公软件包的吸引力在于它们便宜、易于学习，并允许用户以尽可能少的麻烦输入他们想要的任何数据。\n\
  \n另一方面，更专业的交易处理系统则要求数据以严格规定的方式输入。例如，会计软件包将需要指定的代码、日期和金额来处理收款等事项。地方议会的住房系统将需要以完全正确的方式输入租户姓名、地址和房产类型，或许还有特殊代码来表示房产是否适合老年人或残疾人。这些系统具有结构和可预测性，使得能够设计对输入数据的相当精确的检查。在大多数情况下，数据输入可通过*数据捕获屏幕*\
  \ (Figure 5.2) 控制，这些屏幕向操作员指定要输入的确切数据以及屏幕的哪些区域。\n\n![Figure 5.2 Data capture screen\
  \ for an invoice](img/fig5_2_B.jpg)\n\nFigure 5.2 Data capture screen for an invoice\n\
  \n当数据以这种方式输入时，可以进行多种不同类型的检查。请注意，数据*不一定*是通过键盘输入的。它同样可以从条形码、磁卡、智能卡或能够读取数字和字母的扫描仪中获取。未来，操作员更有可能使用语音识别功能，简单地向计算机口述各个字段的内容。在所有这些情况下，在数据实际被系统接受并存储之前，使用类似的流程来检查数据。数据也可以通过使用鼠标来输入（或更严格地说，选择）。如果所有允许的值都可以预测，并且列表不太长，这可以成为确保只有有效条目进入系统的好方法。\n\
  \n输入检查主要是*预防性*的，通常结合*咨询性*和*强制性*特征。它们可用于控制各种不可接受数据的输入。\n\n#### 5.2.1 数据值不一致或不被允许\n\
  \n没有系统能提供对*所有*可能错误的完全保护。它所能做的只是质疑看起来不合理的条目。因此大多数会计系统会拒绝处理 £0.00 的付款，而医疗系统可能会拒绝 55\
  \ 岁患者需要学前免疫的想法。此类测试与数据的*一致性*有关。对一致性的检查可能相当复杂，可能涉及与其他信息的交叉引用。例如，零售商对信用卡号码的检查可能会显示它在被盗卡的‘热名单’上，这将导致零售商中止交易。一致性检查在防止欺诈方面的价值在随附案例中得以体现。\n\
  \n\n\n\n\n判断特定值一致性的规则可能由计算机软件提供商预先设定，也可能由运营系统的组织自行指定。例如，许多系统会预设拒绝设定在未来的日期，因为它们处理的是只能在“事件发生后”记录的业务活动。同样，预订系统会拒绝诸如假期预订的结束日期早于开始日期之类的不合逻辑情况。在其他情况下，关于日期的定制规则可能是合适的。例如，酒店预订系统完全可以处理设定在很远未来的日期，但如果酒店提供特别优惠套餐，它可能会加入自己的自动检查，以判断某个日期是否确实有优惠价可用。实际上，许多系统允许嵌入在基础软件中的规则与系统管理员可以随意设置和更改的其他可选规则相结合。\n\
  \n其他常见的检查涉及 *sequence* 和 *range*。序列是指为每笔交易分配一个参考编号。这可以由输入数据的个人完成，但最好由系统独立分配编号。如果编号按升序排列，则可以对照交易被记录为发生的时间进行交叉检查。如果记录显示交易\
  \ 73 似乎发生在交易 72 之前，这将引起人们对可能存在欺诈行为的关注。\n\n范围是一种防止因“手指失误”导致错误的有用方法。例如，如果你正在输入考试的百分比成绩，就不会期望任何值超过\
  \ 100。同样，一个月不可能有 32 天。如果操作员在输入这些值时出现错误，可以强制其立即更正。一些范围检查可以根据组织的需要量身定制。因此，虽然常识表明“每周工作时间”不可能超过\
  \ 168 小时，但法律或公司政策中可能规定了更低的限制，例如每周 48 小时。同样，一家公司可能从事为一定年龄以上的人提供汽车保险单的业务，或者一家通过电话接受订单的公司可能坚持每笔订单必须达到最低价值。\n\
  \n有时系统会被要求检查数据的 *reasonableness*，这并非总是可以用硬性规则来指定。在这种情况下，控制通常是建议性的。例如，虽然员工每周通常限制在\
  \ 48 小时，但特殊情况下允许工时更高。突出显示任何超过常态的情况仍然很有帮助，因为操作员可以随后检查这是否确实是特殊情况，还是某种错误。合理性检查可以应用于任何可能但不寻常的情况，例如预订\
  \ 44 张剧院票：目标不是让包车团体预订剧院行程变得困难，而是确保操作员没有打算预订 4 个座位，却不小心按了两次同一个按钮。\n\n#### 5.2.2 Invalid\
  \ or Incorrectly Formatted Data\n\n通常很有用的是能够指定只有某些值才会被视为 *valid*。这意味着定义一个可接受的值集合。一个简单的例子是坚持对问题的回答必须是“Y”或“N”。在某些情况下，检查可能更复杂，例如参考号包含一个或多个“校验位”，它们被添加到数字末尾。任何包含错误校验位的数字都将被拒绝。数据录入软件需要事先知道应期望多少个校验位，以及它们是如何计算的。然后它自行计算校验位，并将其答案与已输入的答案进行比较。增值税登记号校验位的计算方法作为示例展示。当然，校验位的计算方法必须非常谨慎地选择，以便始终提供正确数量的位数，并以大致相等的频率给出所有可能的答案。\n\
  \n在其他情况下，数据只有在遵循字母和数字的特定 *format* 时才被视为有效。例如，一家公司可能为每个客户分配一个形式为 CUST123 的参考号。然后数据录入软件将检查在客户编号字段中输入的内容是否由四个字母后跟三个数字组成。格式检查可能比这更通用，例如，它可以确保客户姓名仅由字母和标点符号组成，或确保金钱金额仅以数字形式输入。格式可以为任何遵循可预测模式的东西指定，例如日期和时间。对于日期，人们可能习惯于不同的惯例（因此\
  \ 01/02 可能符合所需格式，但对欧洲读者意味着 2 月 1 日，对美国人则意味着 1 月 2 日）。在这种情况下，一个解决方案是坚持使用无歧义的格式，例如日数后跟三个字母表示月份。\n\
  \n#### 5.2.3 Incomplete Data\n\n不完整性可能通过前一节所述的某些格式检查来检测，但这些检查一次只适用于一个值。因此格式检查可能会显示客户编号不够长，但无法检查操作员是否已填写交易进行所需的所有其他字段。在最简单的情况下，可能要求在数据录入屏幕上的\
  \ *every* 字段中都输入内容。在其他情况下，所需信息的数量可能是有条件的。例如，电话订单录入屏幕可能允许客户选择 (a) 开具发票或 (b) 提供信用卡号。然后软件可能在以下\
  \ *either* 情况中认为提供的数据是完整的：\n\n1. 客户提供订单参考号；或\n2. 客户提供信用卡号 *and* 卡片的到期日期。\n\n请注意，软件还可以应用一致性测试，以便它可以拒绝不合适的混合，例如在同一屏幕上输入订单参考号和信用卡到期日。\n\
  \n由于完整性测试意味着对输入数据的某种可预测性，因此某些数据项并不很容易适用于这种测试。地址可能是一个特别的问题，尤其是来自多个不同国家/地区的地址（对于在互联网上开店的卖家来说，这变得越来越常见）。可以测试是否包含某种邮政编码或邮编等内容，但其他元素如“城镇”、“州”或“省”可能并不总是相关。在其他情况下，完整性所需的条目数量根本无法得知，例如，被问及“资格”或“残疾”时，一个人可能列出一个或多个。\n\
  \n#### 5.2.4 Requirements for Independent Authorisation or Verification not Met\n\
  \n到目前为止提到的所有检查都将是内置于应用程序软件中的自动筛选过程的一部分。对于企业认为特别关键的数据，尤其是存在欺诈威胁时，添加一些基于人工干预的额外控制措施会很有用。\n\
  \n三种常用的方法有：\n\n\n\n\n\n*   `Dual entry`（有时也称为 `dual keying`）。相同的数据由两位不同的人独立输入。系统会比较两个版本，并突出显示任何差异。然后必须有人检查所有发现冲突的情况，并选择正确的版本。这是一种识别和消除录入错误的好方法，但在人员时间方面成本很高。如果目的是防止故意篡改输入数据的行为，则最终阶段（审查数据并解决任何差异）必须由资深且值得信赖的人员处理。\n\
  *   `Explicit authorisation`。如果所涉及的数据录入可能促进欺诈，系统可以被编程为在接受数据之前要求某种形式的授权。最常见的做法是要求主管使用更高级别的授权登录，并表示批准该交易（批准可在同一终端上给出，或理想情况下在另一个终端上给出，以降低主管密码被发现的风险）。当向客户退款或注销债务时，可能会遵循此程序。\n\
  *   `Control totals`。控制总额主要用于财务数据，但可应用于几乎任何保留有价值项目累计记录的交易。其步骤顺序如下。\n    1. 将若干类似交易批量组合在一起。\n\
  \    2. 人员 A 浏览交易的资料来源（例如一堆纸质发票）并计算所有交易的总值（所有发票应付金额的总和）。\n    3. 该总值输入计算机。人员 B 现在输入所有交易的数据。\n\
  \    4. B 完成数据录入后，计算机自行计算总值，并将其与 A 在开始时输入的值进行比较。\n    5. 如果总额匹配，则交易处理继续进行。如果不匹配，系统将拒绝继续，数据录入必须被检查，直到差异得到解释为止。\n\
  \n与校验位一样，控制总额可以成为显示录入错误的有用方法。它们也可能有助于遏制欺诈，前提是 A 和 B 完全相互独立地工作。\n\n#### 5.2.5 非标准语法或词汇\n\
  \n即使信息以自由形式输入，如文字处理和电子邮件，企业也可能希望确保材料符合其自身的规范和标准。办公软件包现在提供了一系列用于检查文本的选项，可以在输入时突出显示可能的错误，或随后运行检查。最常见的是，检查器会将文本中的单词与标准拼写列表进行比较，并查询不在列表中的单词。操作员被留下来做出最终决定：由于总会有名称、缩写或另一种语言的引文无法在官方列表中识别的情况，因此这是一个无法完全自动化的过程。\n\
  \n一些检查器更进一步，会查找语法、标点甚至风格上的疏漏。\n\n尽管它们有助于发现写得糟糕或令人困惑的短语，但它们只能应用相对简单的规则，无法考虑上下文。因此，大多数检查器会忽略诸如“payment\
  \ to be made in ponds sterling”这样的短语，因为它符合所有拼写和语法的规则，尽管不符合常识。\n\n## 5.3 处理数据\n\n\
  一旦数据输入系统，它将以对用户 largely 隐藏的方式进行处理。事实上，即使对技术熟练的人员来说，也不应认为处理逻辑很容易显而易见。这可能是因为相关代码非常旧，而且关于它的文档可能已经丢失，或者因为它是用后来已过时的语言编写的。‘打包’程序也会因不同原因造成问题。在这种情况下，这是因为供应商更喜欢以\
  \ `object` 代码形式交付产品。这是可以直接在机器上运行的代码，但不包含原始 `source` 程序中的任何信息，而这些信息对于理解程序逻辑是必需的。许多组织在试图确定其程序是否能够正确处理\
  \ 2000 年及以后的日期时，都不舒服地熟悉了弄清其系统“幕后”发生了什么的问题。\n\n检测和识别软件异常的潜在困难在两个旧案例中得到体现，一个涉及欺诈，另一个是逻辑错误。在这两种情况下，都需要外部压力才能揭示发生了什么。今天的安装目标应该是建立措施，确保此类异常能够迅速被发现，在其成为尴尬来源之前。这些措施可能包括：\n\
  1. `Preventive controls`\n    * `Dual processing`。与双重录入类似（参见 5.2.4），这取决于做两次。两台计算机相连，交易在两台计算机上同时处理。结果会不断比较。这种安排的主要目的是通常确保系统可用性（例如，在超市收银系统）。然而，对准确性的额外检查是有用的副产品。由于两个处理器运行相同的软件，如果这是由于在两者上都复制的软件缺陷造成的，两个处理器仍可能对错误结果达成一致。\n\
  \    * `Control totals`。再次，这里使用的原则与输入时相同（参见 5.2.4）。该方法只能在所有记录都以相同方式处理的情况下应用（即使用‘批处理’）。例如，如果一家电力供应商正在生成将发送给客户的季度账单，可以为程序预期处理的账单数量创建一个控制总额。或者，可以对电力单位的数量或应计账单总额进行汇总。该总额必须与在批处理中其他地方独立计算的总额相匹配。\n\
  2. `Feedback controls`\n    * `Test transactions`。这些可以是已预先计算出预期结果的“真实”交易，也可以将“虚拟”交易输入系统，使用专门选择的数据来探测系统是否按规范工作。虚拟交易之后需要取消或折扣——这当然本身就是一个需要谨慎控制的问题。\n\
  \    * `Transaction logs`。交易进行时，会将所选细节写入计算机文件。理想情况下，该文件位于“一次写入”介质上，例如一次写入多次读取的光盘（或\
  \ WORM）。这确保了即使有人成功干扰交易或其输出，日志本身也无法被篡改，有用的线索或证据会保留在“记录”上。从交易日志中应能够确定用户的身份、时间以及有关输入的数据或写入的文件的指示。一些软件供应商将这种日志称为提供计算机化的“审计跟踪”。然而，审计跟踪应始终包括其他佐证证据（参见\
  \ section 13.3）。\n\n## 5.4 输出：打印机和显示器\n\n\n\n\n\n在大多数情况下，输出会直接以屏幕上的消息形式返回给发起交易的<|message|>用户。然而，也可能存在其他输出（例如，发送给其他员工的消息，或发送到打印队列的文档）。一旦输出被发送到网络上，就可能极难控制其最终目的地：这个问题将在第\
  \ 6 章中进一步讨论。在组织的内部系统中，对输出的威胁可以归为三大主要类别。\n\n1. *随意浏览带来的威胁*。正如敏感文件不应随意留在办公桌上一样，如果输出设备可能携带不打算广泛传播的信息，就应将其置于视线之外。定位方面需要特别注意。路人很容易瞥见屏幕，或阅读从打印机输出的材料内容。开放式办公室或带玻璃隔断的办公室就是此类风险较高的场所。在员工和公众都能方便进入的地方，如医院病房或接待区，也可能出现类似问题。\n\
  敏感的打印输出可以通过使用内表面带有碳涂层的特殊信封包装来保护。这类文具在工资单上被广泛使用。打印机（必须是使用击打技术的打印机，例如菊花针或点阵打印机）不会在外表面留下标记，但碳涂层可确保信息转移到内部的空白纸张上。结果是，即使操作打印机的人也无法得知打印了什么内容。\n\
  \n2. *欺诈和盗窃的机会*。如果输出涉及创造有价值的东西，例如支票或证书，就需要防范伪造企图。通常，一套空白表格会预先印刷，通常带有防伪功能，例如水印，或使用特殊墨水，可揭示对覆盖其上印刷信息的擦除企图。显然，必须尽一切努力确保这些表格不会落入错误的人手中。一个有用的预防措施是对表格进行顺序编号，以便可将指定数量分配给一批次运行（从而实际上提供了一个控制总额）。进一步的控制信息也可以添加到打印在表格上的详细信息中，例如，可稍后用于核实真实性的参考编号。\n\
  \n3. *输出的后续传播*。当输出传回给用户时，很容易假设它只会在屏幕上显示几秒钟。然而，技术已发展到可以轻松地将输出转换为其他形式。例如：\n* 屏幕输出可以被捕获为图像（在\
  \ Windows 键盘上，这只需使用 `Print Screen` 键），然后可以将其粘贴到文档中并通过电子邮件发送，或打印出来。\n* 输出文本可能被语音合成器“读取”。此类软件现在通常安装以帮助视力不佳或其他残疾人士。\n\
  * 用户 PC 中的“客户端”软件可能使输出能够被转移到磁盘存储中，在此或其他机器上。\n\n鉴于输出可以被转换和复制的便捷性，应尽可能严格地应用以下规则。\n\
  * 如果发送的输出包含敏感信息，应将其“标记”为此类信息，最好是在信息*本身*中包含警告消息。这可能意味着要偏离组织对纸质文件所采用的一些惯例。例如，许多公司使用包含“草稿”或“公司机密”等页眉或横幅的文具。可以为文字处理文档设计等效的电子模板，但这些模板的使用远不如纸质版本方便。文字处理文档在任何情况下都可以很容易地转换为纯文本版本，而这些版本将不携带模板创建的任何警告信息。\n\
  * 应建议员工谨慎对待电子输出已被“删除”的假设。软件经常声明数据已被删除，而实际上它只是声明相关文件空间现在可供覆盖使用。直到该空间实际被覆盖，原材料仍可被任何愿意费心直接检查存储介质或使用诸如\
  \ DOS `undelete` 或 Windows `recycle bin` 之类命令的人读取。\n\n在处置先前记录有输出的介质时也应谨慎。正如机密纸质文件应通过碎纸机使其无法辨认一样，磁性和光学磁盘应被系统性地擦除或销毁。输出不应仅因其含义不明显就被认为不重要：例如，二维条形码的打印件可能对人眼无法理解，但会包含有用信息，并且数据可能以“隐形”方式存储在塑料卡和其他代币中。\n\
  \n当输出受专有权利约束时（例如，受许可的软件或受版权保护的文本），可能需要其他更专业的控制措施以防止可能的侵权。这些内容将在第 13.5 节中进一步讨论。\n\
  \n## 5.5 从交易中派生的信息\n\n通过常规交易常规存储的记录会随时间积累，成为管理的重要信息来源。例如，销售和营销部门可能想知道产品销售情况如何，或生产部门可能想检查是否已达到目标。一般经理也依赖于从计算机数据中得出的定期报告和简报。将这种管理信息的获取视为交易处理的“副产品”似乎很诱人。提取此类数据似乎不应引发太多安全问题，因为它将由少数人执行，且在相对容易控制的条件下进行。\n\
  \n然而，派生信息的其他方面也需要考虑。可以通过考虑管理会计师收集和使用的信息的特定案例来说明这一点。管理会计师（有时称为“经理会计师”）的角色因组织而异，但他们的工作有两个关键特征：\n\
  1. 它在很大程度上依赖于派生信息（来自几乎所有活动部门，而不仅仅是会计），并且\n2. 它以某种方式影响所有经理，因为它决定了组织内部成本和资源的分配方式。\n\
  \n在获取和使用“副产品”数据时，管理会计师必须考虑以下因素。这些因素既影响可以对数据置信的程度，也影响应围绕其建立的安全措施。\n\n### 5.5.1 数据输入的完整性\n\
  \n\n\n\n\n员工在交易过程中记录数据的方式会受到他们对数据用途的认知影响。如果他们怀疑数据将被用来评估自己或其组织，就会渗入选择性和偏见。典型例子是记录活动所用时间的日志。如果时间要计入客户账单，任务的时长可能会被夸大。如果目的是显得非常高效，它可能会被缩短。员工很快就会形成一种记录此类数据的“适当”方式的感觉。只要相关人员意识到正在起作用的因素，这并不会过度误导管理层。然而，“副产品”数据的麻烦在于，它最终可能进入各种各样的评估和计算中，而其中潜在的扭曲却被隐藏且未被认识到。\n\
  \n这些问题因使用“绩效指标”的日益流行而加剧。这些指标在公共服务提供方面尤其被采用，在那里找到既可衡量又有意义的指标并不总是容易的。通常，最简单的选择是将其基于交易处理可提供的输出。指标随后可用于“基准”，即比较不同组织的成就。这可能是通过与咨询公司计算的“行业标准”进行比较，或通过发布医院等公共部门机构的“排行榜”来实现。绩效指标的例子包括等待名单长度、每个客户的成本以及服务响应时间。实现良好指标的压力可能导致记录不足或过度，或采用记录方法的根本性改变。例如，一项活动可能会被拆分为两到三个独立的部分，以便呈现出更高的吞吐量和生产力。\n\
  \n员工也可能意识到他们将根据交易数据进行个人评估。如果激励和奖励与他们生产率的衡量挂钩，这对他们来说尤其重要（Moizer 1991）。\n\n这在考虑“确保准确性”的安全目标时提出了一些微妙的问题。如果记录的数据从一开始就已知不准确，为什么还要在系统传输过程中保护它？答案是，在许多情况下，组织会接受存在一致偏差的数据，因为这可以被认识并加以考虑。其他类型的偏差，例如由输入错误或篡改单个记录引起的问题更为严重，因为信息不再能够被信任以提供关于任何事物的准确指示。\n\
  \n管理层应始终意识到控制措施实际上可能只是在为错误信息提供安全通道的风险。这是对“垃圾进，垃圾出”这一老主题的变体。绝不能假设控制措施，无论设计得多么完善，都能*保证*信息系统输出的准确性或有效性。\n\
  \n### 5.5.2 非正式信息系统\n\n人们只有在计算机系统能够及时提供他们所需的信息时，才会使用从计算机系统派生的信息。否则，他们将诉诸自己的收集和报告所需信息的方法。McKinnon\
  \ 和 Bruns 研究了北美十二家制造公司，发现对非正式报告机制的高度依赖。他们引用一位工厂经理的话说：\n\n> 会计人员可能每天下午 1 点前就能给我一份昨天产量的报告。到那时，第一班次只剩下\
  \ 2 或 2×小时的生产时间了。因此，与其依赖会计，我让我的班组主管在每个班次结束时写下我们当天的投入和停机时间。这样一来，我们每天早上开厂时就能拿到这些数据。\n\
  \n> McKinnon and Bruns 1992: 220\n\n这种非官方的数据收集可能是出于最好的理由进行的，但它不会被纳入“官方”信息系统设计的控制范围。如果相关数据具有商业敏感性，或者这种非正式的方法延伸到数据传递给他人的方式，那么安全性就很容易受到损害。\n\
  \n### 5.5.3 分析中使用的数据\n\n一旦派生数据与交易数据分离，它就可能进入各种信息存储，无论是官方的还是非官方的，并且很难控制其使用和传播。一方面，它可能被输入正式报告中，这些报告根据既定规则发布和存储。它也可能保存在决策支持系统（DSS）中，用于使用电子表格和统计软件包等工具进行分析。如果\
  \ DSS 组织良好，它将包括一个数据管理设施，用于跟踪和索引存储中的所有数据。\n\n然而，数据也可能进入更“私人”的存储中，这些存储由个人作为其在大型机上的文件分配的一部分持有，或保存在其个人\
  \ PC 的磁盘驱动器上。这些可能是出于最好的动机而获取和开发的。例如，管理会计师可能会觉得建立一个小型档案很有用，以便能够查看成本或盈利能力的长期趋势。\n\n\
  此类存储存在问题，因为所有者不太可能费心为单个文件设置访问控制，而其中一些可能包含相当敏感的材料。最佳解决方案可能是采取全面方法，将*所有*文件视为潜在敏感。\
  \ 如果它们在 PC 上，机器应具有强大的安全保护（例如，开机密码，以及覆盖所有派生数据的密码保护）。如果它们在大机上，可能需要使控制措施成为强制性而非酌情性的。\n\
  \n### 5.5.4 内部与外部报告\n\n内部收集和分析的数据为传递给组织*外部*人员的报告提供了基础。这些报告可能受保密条件约束（例如，向税务机关或监管机构提供信息）或可供任何人在印刷品或互联网上阅读。\n\
  \n在管理会计师的情况下，关于成本和活动水平所获取的信息现在成为年度报告和账目中陈述的起点。以前仅用于内部决策的材料被转化为公司财务状况的图景，然后公开发布。数字本身可能不会改变，但一旦发布到公共领域，它们就获得了全新的地位。\n\
  \n确保已发布账目符合所有相关标准、法律和法规的责任由组织的财务会计师承担，并得到外部审计师的协助。然而，在账目的形式达成一致之前，任何财务信息的“泄漏”都可能造成损害。特别敏感的是在正式发布之前会引起股东关注的信息，例如与竞争对手合并的前景，或发布盈利警告。\
  \ Mayer（1995）分析了确保信息适当传递给投资者的一些实际和伦理问题。\n\n\n\n\n\n理论上，一个组织可以让其所有信息系统对外部人员完全透明。互联网的出现使得股东或其他任何利益相关方都可以浏览公司最新数据的可能性成为现实，而且无需发布年度报告。虽然在技术上可行，但这种安排会剥夺组织为竞争和生存所需的商业隐私。它也会使确定哪些数据应被视为完全“审计过”的变得困难。本书本节中描述的内部壁垒预计在相当长的时间内会继续存在。\n\
  \n信息技术尽管如此，已经在数据可以通过电子链路访问和传输的便捷性方面打开了潘多拉魔盒。这不可避免地使将任何信息限制为纯粹“内部”使用的任务变得复杂。用于应对网络带来的挑战的方法将在接下来的三章中描述。\n\
  \n## 5.7 问题\n\n1. 判断以下每个控制是 `preventive` 还是 `feedback` 控制。你会建议其效果应为咨询性的还是强制性的？\n\
  \    1. 医院的药物处方系统检测到标签上指定的剂量超过了通常致命的水平。\n    2. 你的月度信用卡账单包含几项你不认识的项目。\n    3. 病毒检查程序扫描你所有的文件，并生成报告指出它已检测到并移除了危险病毒。\n\
  \    4. 某些“智能”软件监控所有借记卡交易的发生情况，并检测到对某张特定卡的使用模式可疑。它立即将该卡列入黑名单，使其不再有效。\n    5. 一个休闲中心要求在每次预订时出示带有条形码的会员卡。一名会员想预订网球场但把会员卡留在家里了。\n\
  \n2. 在以下每种情况下，可能需要何种输入检查？\n    1. 在旅行预订中输入儿童的出生日期（假设 14 岁以下儿童可享受半价票）。\n    2. 输入从仓库发放的组件的零件号。\n\
  \    3. 输入为假日预订应付余额而收到的金额。\n\n3. 解释 `control total` 如何与输入一批来自供应商的发票相关联。\n\n# 第 3\
  \ 部分 网络化服务的控制\n\n## 第 3 部分介绍\n\n1845 年，亨利·戴维·梭罗在马萨诸塞州康科德附近的瓦尔登池畔为自己建造了一间木屋，并在那里度过了两年时间思考生活、自然以及现代技术的愚蠢。他特别抨击人们对铁路和电报的痴迷，并著名地观察到“我们急于从缅因州到德克萨斯州建设一条磁电报；但缅因州和德克萨斯州可能没有什么重要的事情需要交流”（Thoreau\
  \ 1910）。人们只能想象他会对手机和互联网作何感想。\n\n今天的企业需要保持连接。他们的客户和供应商希望通过电子邮件进行沟通。他们的竞争对手将在互联网上开设商店并开拓新市场。更传统的电子商业形式，如电子数据交换（EDI），继续蓬勃发展壮大。真的没有切断联系、退回到瓦尔登池畔宁静的选项。\n\
  \n第 3 部分 解释了组织如何能在自身与外部网络之间建立保护屏障，以及它们应如何安全地与其客户和商业伙伴进行沟通。这必然会涉及一些相当深奥的领域，例如非对称加密和公钥基础设施。这些技术不需要详细理解，但重要的是要确切知道它们可以和不可以预期实现什么。\n\
  \n第 3 部分 首先描述了网络技术中使用的一些技术，并指出主要威胁可能出现的位置。讨论随后转向实施和管理安全措施的方法。最后，关注转向网络的一些小规模问题。其中大多数集中在办公室的局域网，这实际上是内部基础设施的一部分。然而，它们被归类为“网络”而非“内部”主题，因为它们很少完全与更广泛的网络隔离，并且一些网络相关问题必须作为整体来看待。例如，考虑办公室集群的病毒防护时不可能不参考病毒通过互联网的传播。在此，机会也被用来更仔细地审视与小型团体工作相关的控制的其他方面。\n\
  \n# 第六章 网络通信的控制\n\nDOI: [10.4324/9780203992319-10](https://dx.doi.org/10.4324/9780203992319-10)\n\
  \n## 6.1 引言\n\n对“电子商务”将属于未来的期望导致全球网络技术投资激增。一个例子是新加坡，多年来一直把信息技术投资作为优先事项，但最近已将其中的很大一部分转移到其网络基础设施上（Donovan\
  \ 1991）。在同一地区，马来西亚启动了多媒体超级走廊，而新的联邦首都布城被设计为完全“有线城市”。香港也不甘落后，推出了一项将岛上部分地区改造成网络化“数码港”的计划。类似的举措可在许多其他国家找到，这反过来又导致销售网络设备和服务的公司业务激增（Anon\
  \ 1999）。\n\nCairncross（1997: xiv）已确定了这场电信革命约 30 个后果。其中一些，如个人隐私的侵蚀，以及税收制度之间的竞争，已显现一段时间。其他一些的效用尚未得到证实，例如，“服务将变得更可靠，人们更有可能信任彼此信守承诺”。可以肯定的是，随着电子交易渗透到业务的越来越多方面，数据安全的各个方面都必须重新评估。\n\
  \n许多企业现在完全依赖网络，就像它们最初依赖其大型机一样。其中许多企业依靠电子数据交换进行日常交易，并通过英国的 BACS 和美国的 ACH 网络等电子系统进行常规支付。它们利用新型的基于互联网的系统和服务，这些系统和服务易于访问且友好到几乎任何人都能使用。为此，它们被迫对安全进行一些激进的重新思考。例如，必须找到在世界另一端核实交易伙伴资质的方法，使服务易于客户访问（但对黑客不可访问），并审计现在较少或根本不保留交易纸质记录的多个不同组织之间的电子交换。\n\
  \n## 6.2 商业网络：功能与起源\n\n\n\n\n\n在 1960 年代，兰德公司的一名工程师保罗·巴兰（Paul Baran）提出了富有远见的网络构想，该网络能够使不同研究机构的计算机更容易相互通信。他设想通过巨型晶格结构连接计算机——在当时这是一个新颖的想法。起初，电话公司宣称巴兰的想法不可行，并拒绝协助测试，但凭借美国国防部及其高级研究计划署的支持，一个原型网络最终得以建成，并在\
  \ 1969 年开始运行（Hafner and Lyon 1998）。`ARPANET` 将消息划分为可通过网络中多条替代路由传输的数据‘分组’。这些想法迅速被商业界采纳，并开发出新的‘分组交换’标准（如欧洲的\
  \ `CCITT X25`）。公司现在可以购买运行 `X25` 标准的终端，并连接到各种商业网络服务。\n\n在 1970 年代，企业网络往往有两种类型。大型公司更喜欢创建自己的私有网络，基于\
  \ IBM 的系统网络体系结构（`SNA`）等专有软件。这些软件产品对网络上发生的一切进行严格控制，其辐射源自企业数据中心的一台功能强大的大型机。这使公司确信安全问题正在被监控，并保持在他们的控制之下。与此同时，开放系统倡导者提出了一种替代方法，他们不信任推广\
  \ `SNA` 和其他专有软件的供应商的动机，因为这些软件往往会使客户‘锁定’在供应商自己的产品上。‘开放’标准的替代方法以用于运行计算机的 `UNIX` 操作系统为中心，以及用于电信的\
  \ `X25` 和相关的一组协议。开放系统在公共部门中得到了特别强有力的推广，因为人们认为它们减少了对任何一个供应商的依赖，并为系统采购创造了更公平的‘竞争环境’。\n\
  \n不幸的是，开放系统方法的安全性并不是其强项。`UNIX` 最初由 AT&T 贝尔实验室开发，提供一种通用操作系统，可在各种制造商的硬件上运行。然后它可以成为其所有研究机构的标准，使他们更容易合作。贝尔将\
  \ `UNIX` 置于公共领域这一决定推动了其流行。加州大学伯克利分校开发的免费版本被广泛使用，尤其是在大学中。这确保了熟悉并喜欢 `UNIX` 的计算机科学毕业生源源不断。`UNIX`\
  \ 也吸引了软件开发人员，因为他们可以相对轻松地修改和扩展操作系统的功能。这意味着大量人熟悉了 `UNIX` 内部操作的细节。不幸的是，这也造成了一个相当大的社区，他们倾向于找到破坏它的方法，利用自己的技能更改或绕过代码的一部分。在随后的岁月里，将安全*重新加入*\
  \ `UNIX` 成为一场艰难的斗争。\n\n20 世纪 80 年代出现了两个对互联网后续发展产生重大影响的发展。第一个是为 `ARPANET` 开发的两种通信协议：`Transmission\
  \ Control Protocol` 和 `Internet Protocol`。它们通常组合使用，并称为 `TCP/IP`。当 `ARPANET` 后来演变为我们现在所知的互联网时，`TCP/IP`\
  \ 标准继续被使用。第二个发展是 1981 年 `IBM` 个人电脑的到来。`IBM PC` 的架构迅速成为全球标准。它被视为理想的‘客户端’机器，功能强大，可以独立执行任务，同时也可以作为网络的接入点。该架构实际上成为‘开放’标准（尽管\
  \ `IBM` 试图阻止这一点），世界各地的制造商纷纷进入，以满足快速增长的客户群。不幸的是，`TCP/IP` 也不像 `DOS` 操作系统那样特别考虑到安全而设计，用于\
  \ PC。\n\n企业开始看到将办公 PC 连接成 *局域网* 的优势。最初，这些网络被作为降低成本的一种方式出售，例如使多个 PC 用户能够共享一台高质量打印机的使用。然而，很快就变得清楚，负责管理\
  \ `LAN` 的‘服务器’机器可以承担其他角色。它可以作为各种常用文件的存储库，并为用户提供程序库，以便在需要时下载。这反过来又使 `LAN` 的安全性，特别是\
  \ `LAN` 服务器的安全性成为关键问题。当服务器开始用作企业内外其他网络的网关时，`LAN` 服务器安全变得更加重要。安全现在需要考虑用户可能尝试将自己与外部世界连接起来的所有可能方式。\n\
  \n20 世纪 90 年代见证了互联网作为终极公共数据网络的成熟。网络的晶格方法证明非常适合需要迅速在全球范围内扩展的服务。信息技术许多方面自最初的 `ARPANET`\
  \ 时代以来已经发生了翻天覆地的变化。特别是，办公桌或家庭中的典型 PC 可以处理声音和图形，其能力远远超过 1960 年代可用的任何东西。这种强大的技术使得任何拥有\
  \ PC、电话线以及愿意学习浏览器基本命令（如 `Netscape` 或 `Explorer`）的人都可以获得互联网访问权限。即使是最怀疑信息技术的人现在也可以作为一个套件购买所有必要的软件和设备，并在几分钟内冲浪网络。但尽管从用户角度来看服务变得更加复杂，互联网仍然依赖于其成长过程中使用的操作系统和传输协议。从安全角度来看，越来越明显的是，这些对于该任务来说并不理想。\n\
  \n## 6.3 监听数据传输\n\n人们对他人可能窃听网络消息的担忧由来已久。1845 年，大西部铁路公司推出了其新的伦敦至斯劳之间的电报服务，广告称其客户可以‘以最令人信赖的保密性即时往返发送电报’。即使在当时，这一说法也极其可疑，因为一直很容易在电报线路的任何一点检测到电流的变化，并利用此来推断消息的内容。\n\
  \n结果，电报服务的市场发展相当缓慢。需求的真正增长是基于语音的电话。这导致在大多数发达国家，电话线路与居民的比例现在为 50% 或更多。在北美和斯堪的纳维亚等一些地区，该比例已攀升至约\
  \ 70%。在第三世界，另一方面，许多比例仍然极低：例如在非洲，整个大陆的平均值仅略高于 2%（`ITU` 1999）。无论何处已经建立了广泛的电话网络，它们都提供了一种廉价且即时的连接数据服务的方式。尽管如此，电话电缆并不特别适合承载数据‘数字’，而不是它们最初设计的模拟语音信号。\n\
  \n\n\n\n\nIngenious methods have been devised for getting round the limitations\
  \ of telephone cables, for example by using intelligent modem devices or by transmitting\
  \ along two lines at once (Anon 1998). In the longer term, however, more radical\
  \ solutions are required, if users are to be able to transmit and receive large\
  \ volumes of data at reasonable speeds. Accordingly, many countries have introduced\
  \ Integrated Services Digital Networks (ISDN), designed specifically to handle data.\
  \ ISDN is essentially a digital version of the old voice-based telephone system,\
  \ with subscribers dialling up each other to create connections as and when they\
  \ need them. ISDN eliminates the need for modems, and provides higher transfer speeds\
  \ with much lower error rates.\n\nIn telephony, the most rapidly growing sector\
  \ at present is mobile phones. Mobile subscribers are already in the majority in\
  \ Finland, and this is expected to be the norm in many countries within the first\
  \ few years of the twenty-first century (Black 1999).\n\nAs in the early days of\
  \ wire-based telephony, the voice-based services have been the initial driving force\
  \ behind the expansion of networks. However, the data services are close behind\
  \ and moving up fast. The Groupe Spéciale Mobile (GSM) standard, widely used in\
  \ Europe, supports data traffic at 9,600 bits per second, matching the rate available\
  \ with cheaper modems on a conventional telephone line. GSM also includes Short\
  \ Message Service, supporting messages of up to 160 characters. GSM has been adopted\
  \ in many countries, but differing standards have evolved, particularly in Japan\
  \ and the USA. Strenuous efforts are being made within the telecommunications industry\
  \ to secure world-wide agreement for a new and more advanced standard, the Universal\
  \ Mobile Telecommunications System (UMTS). This will not only ensure that an individual’s\
  \ phone will work in any country, but will support much faster data transmissions\
  \ (Holley and Costello 1998; Emmerson 1998).\n\nRadio can also be used in a localised\
  \ way to connect up conventional-style telephones within a building, or in any area\
  \ of high population density (Anon 1996). In today’s world, therefore, it must be\
  \ expected that most messages will end up being routed across a variety of different\
  \ media. They may be sent through land lines, beamed to a mobile computer by radio,\
  \ or bounced to and from telecommunications satellites. The increasing reliance\
  \ on radio for many of these communications links inevitably increases the opportunities\
  \ for outsiders to locate and intercept the data traffic.\n\nA distinction should\
  \ be drawn between the deliberate use of radio to carry data messages (which can\
  \ then, by definition, be intercepted by anyone tuning in to the appropriate frequency),\
  \ and the emission of radio signals as an unwanted by-product. All computer and\
  \ telecommunications equipment sends out a jumble of low-intensity signals, which\
  \ can be picked up and interpreted, albeit with some difficulty and only by getting\
  \ quite close to the equipment. This is only worthwhile if the stakes are high,\
  \ and the eavesdroppers need to be skilled and determined. Protection against this\
  \ kind of leakage of signals is mainly confined to top-secret military installations.\
  \ A range of measures which can be taken to combat this problem have been defined\
  \ by the TEMPEST programme in the United States (Russell and Gangemi 1991).\n\n\
  The different types of cable-based transmission media each have their vulnerabilities,\
  \ which are summarised as follows.\n\n* *Unshielded Twisted Pair*. UTP has traditionally\
  \ been widely used in telephone networks, especially in providing the final link\
  \ from the local distribution point into the home or office. Being unshielded, it\
  \ gives off weak signals, which can be used to listen in on the traffic flowing\
  \ along it. UTP is also used in many Local Area Networks.\n* *Coaxial Cable*. LANs\
  \ based on the idea of connecting everyone onto a single ‘bus’ (as in Ethernets)\
  \ tend to use coaxial cable. This has an outer layer, added primarily to prevent\
  \ outside signals from interfering with those travelling inside the cable. However,\
  \ this also works the other way round, making it difficult to pick up signals from\
  \ outside. Nevertheless, it is relatively easy to insert a probe into a coaxial\
  \ cable, without disturbing its operation, and read off the signals this way.\n\
  * *Electrical Mains Circuits*. Electricity utilities have explored various ways\
  \ of sending data signals over the circuits used to provide power supplies. Providing\
  \ the correct equipment is used, this is not as dangerous as it sounds, and of course\
  \ there is a big advantage in that power cable is already in place throughout most\
  \ buildings. However, the data security of this method of transmission is poor.\
  \ In particular, if signals are travelling through vertical lengths of wire (as\
  \ in street lights) these act as very effective radio transmitters (Ward 1998).\n\
  * *Optical Fibre*. Optical fibre cables rely on light waves which carry signals\
  \ along very thin filaments of glass. The cable is surrounded by an opaque plastic\
  \ coating, which makes it impossible for anyone to ‘read’ the signals without first\
  \ tampering with the cable. It is extremely difficult to intercept the signals without\
  \ causing them to be distorted, thus giving the game away.\n\n## 6.4 Communication\
  \ Layers\n\nWiretapping and eavesdropping tend to capture the popular imagination,\
  \ but they are by no means the best or only way of finding out what is being sent\
  \ over networks. If security measures are directed solely at preventing these direct\
  \ methods of interception, some other serious security exposures are likely to be\
  \ overlooked.\n\nData communications can be regarded as depending on a series of\
  \ ‘layers’. The lower layers concentrate on the business of sending data between\
  \ different points in the network, and ensuring that every data packet is accounted\
  \ for and has no errors. The higher layers deal with the data as it is actually\
  \ created and worked on by the computer users. Data being transmitted from a user’s\
  \ computer application is usually broken up into smaller packets, with special codes\
  \ being added to indicate the destination of the data and other control information.\
  \ For incoming data the same process is carried out in reverse. The individual data\
  \ packets are recombined and presented back to the user as intelligible messages\
  \ and images.\n\nAn analogy can be made with conventional mail services: a manager\
  \ dictates a letter to a secretary which is typed up, put in an envelope, and put\
  \ in the mail ‘out’ tray. These activities, which all take place in the office,\
  \ can be equated with the *top* layers. The letter is subsequently routed between\
  \ sorting offices, depending on the address information on the envelope. This activity,\
  \ which requires no knowledge of what is actually *inside* the envelope, is equivalent\
  \ to the work of the *lower* layers.\n\nIn 1978 the International Standards Organisation\
  \ established a Reference Model for Open Systems Interconnection, defining a total\
  \ of seven different communications layers. These layers have been widely used as\
  \ guidance for those designing communications software, and have been extensively\
  \ described and documented (Halsall 1996; Judge 1988). However, for the purposes\
  \ of analysing security risks in general, it is sufficient to simplify this to just\
  \ three layers, as shown in Figure 6.1.\n\n![Figure 6.1 ](img/fig6_1_C.jpg)\n\n\
  Figure 6.1 \n\n\n\n\n\n窃听者关注的是*最低*层，因为他们希望在数据通过物理链路传输时（即沿着电线，或通过无线电波广播）获得数据的读取。因为数据将被切分成数据包，并且控制代码会混入其中，他们面临着从\
  \ resulting 杂乱中筛选并剔除与特定消息相关的有意义位点的挑战。可能有多个消息同时通过一条链路传输，这给窃听者带来了更大的问题。\n\n因此，攻击者可能更倾向于针对中间（网络）层，该层决定消息如何在网络上传输。例如，用户\
  \ X 和 Y 之间可能存在两条可能的路由，如图 6.2 所示。\n\n![Figure 6.2 ](img/fig6_2_C.jpg)\n\nFigure 6.2\
  \ \n\n路由软件期望在每个数据包中找到报头信息，其中包括发送者的地址（在本例中为用户 X）和目的地址（用户 Y）。网络层的作用是根据网络上当前的流量水平和其他相关条件，决定使用哪条路由。因此，它将决定消息是否经由节点\
  \ B 或节点 C。\n\n如果入侵者能够找到某种方式破坏寻址系统或路由过程，这将为转移消息打开各种可能性。它也避免了可能因窃听特定链路而产生的问题，例如节点\
  \ A 和节点 B 之间的链路。毕竟，所寻求的消息最终可能经由节点 C 路由。对路由机制的成功干扰将使攻击者能够将消息发送到不同的目的地，创建虚假消息，或仅仅便于在更方便的位置进行窃听。关于消息路由的信息本身也可能引起兴趣，只是为了确定\
  \ X 和 Y 之间是否正在传输流量；在某些情况下，这本身就足以泄露有价值的信息。\n\n最后，攻击者可以专注于顶层（应用层），该层与计算机中运行的应用程序进行交互。每当应用程序需要在网络上传送或接收数据时，就会调用这一层。数据的形式与应用程序用户所见的形式非常接近这一事实意味着它将更容易被解释。各类层的威胁总结于表\
  \ 6.1。\n\nTable 6.1\n\n| Layer || Data || Threats arise from: |\n| --- | --- | ---\
  \ |\n| Application || Complete, and close to form actually seen by users || Interference\
  \ with software on the user’s computer |\n| --- | --- | --- |\n| Network || Divided\
  \ up, with control information added || Interference with the network routing software\
  \ |\n| Link || Divided up (may also be incomplete, if multiple routes are used)\
  \ || Eavesdropping on individual nodes or links |\n\n## 6.5 The Role of Cryptography\n\
