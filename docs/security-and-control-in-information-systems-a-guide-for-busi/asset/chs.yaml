  \n## 引言\n\nDOI: [10.4324/9780203992319-1](https://dx.doi.org/10.4324/9780203992319-1)\n\
  \n### 1 本书的目的\n\n企业习惯于应对风险，但这并不意味着它们欢迎面对新的风险。信息技术（IT）在大多数商业活动中开辟了道路，却被证明出人意料地脆弱。它为商业世界带来了新的不确定性，因为它似乎容易受到错误、事故、欺诈和各种恶意攻击的影响。因此，如果商业组织对其对信息系统（IS）的依赖感到矛盾，也就不足为奇了。特别是电子交易的到来，让许多人怀疑新技术是否完全值得信赖。\n\
  \n为应对这些焦虑，已有大量权威出版物问世。其中许多主要面向计算机审计从业者。其他出版物则深入技术性地解释了安全方法和原则。目前，人们对互联网的安全性给予了很大关注，互联网已俘获了公众的想象力，并证明是迄今为止最无政府的科技发展之一。安全与控制也在更正统的领域获得了更大的突出地位，例如信息系统的标准教材。那么，本书希望做出什么贡献呢？\n\
  \n其出发点是一个假设，即 IS 安全与控制应成为*每一个*关心企业管理和财务监督的人的核心技能之一。它认为，我们需要在该领域拥有大量普通从业者，而不仅仅是专家顾问。本书试图以企业读者能够理解的方式描述原则和实践，并引用私营和公共部门的例子。\n\
  \n并无意暗示专家可以被取代。事实上，随着信息系统在全球迅速普及，我们可能需要更多专家。然而，在咨询专家时，希望本书中的信息能帮助非专业人士抢占先机。他们将已经知道控制薄弱点可能出现在哪里，以及可用的补救措施类型。他们无需对加密能实现什么、访问控制应如何运作、计算机审计中常用的技术等事项进行背景简报。他们还应更有信心积极参与优化其自身使用的系统的控制，并向供应商要求适当的安全功能。更有用的是，他们应该能够挑战在\
  \ IS 安全中经常占主导地位的机械化方法，其中答案被认为主要是技术性的。这基于一种观点，即可以在允许的内容和不允许的内容之间划清明确的界限。在大多数组织中，生活根本就不是那么整洁。\n\
  \n英国审计署反复传达的信息是，许多信息系统的滥用源于未能采取非常基础的预防措施。例如，在其关于计算机欺诈和滥用的三年一次调查之一中，审计署（1994 年）指出：\n\
  \n> 所有导致计算机欺诈和滥用的原因都可以在任何关于控制机制的教科书中找到，而缺乏基本控制导致了大多数事件。\n\n这种对“回归基础”的需求信念是许多从事计算机审计工作的人所共有的。他们抱怨员工不仅忽略采取简单预防措施，而且似乎意识不到其必要性。也许更令人沮丧的是，他们发现普遍认为安全与控制是高级管理层、技术人员、内部审计团队的责任——似乎任何人都可以，唯独不是那些每天实际使用计算机系统的人。\n\
  \n\n\n\n所有这些似乎都指向需要更多人积极参与处理安全和控制问题。本书试图通过集中于基本原则、提供大量实用示例，并避免提供深入的技术分析，来鼓励这种更广泛的参与。不可避免地，本书很大程度上涉及技术问题，但尽可能展示了最简单的示例，并为希望深入了解更困难案例的读者提供了其他书籍和文章的参考。\n\
  \n必须承认，有几个因素共同作用，阻碍人们参与信息系统安全和控制。例如，技术解决方案的供应商依赖于利用人们的恐惧。他们的目标，自然而然地，是播下怀疑的种子，然后将讨论转移到他们的技术解决方案上。潜在的购买者处于进退两难的境地。完全不投资如果事情*确实*出了问题，会引发无休止的调查，而几乎任何实际选择的投资水平都会被同事质疑为过度。许多人选择求稳，最终拥有一个布满监视器、过滤器和检查器的信息系统。不幸的是，他们可能对这些东西究竟应该实现什么只有最模糊的概念。\n\
  \n另一个阻碍因素是一些指南的“清单”方法。清单深受顾问的喜爱，顾问与供应商一样，有既得利益去制造担忧。它们可以激发有用的想法，但在决定哪些问题真正重要时却帮助不大。结果呢？焦虑加剧，因为清单不可避免地会提出比任何人可能有时间处理的问题和议题更多。\n\
  \n最后，还有一些安全技术输出的令人不安的影响，并非总是出于本意。出于展示专业能力的愿望，或许是因为热爱安全领域众多谜题和悖论，技术作者渴望探索每一种可想象的威胁和弱点。结果就像阅读一本医学百科全书。没多久，你就开始怀疑所描述的所有症状和疾病都必须适用于你自己的系统。这种现代形式的疑病症可能迅速导致安全措施考虑不周且昂贵。\n\
  \n当一家公司的计算机系统运行顺畅时，坐等并祈祷这种幸福状态持续下去的诱惑无处不在。尤其是忙碌的管理者，总是会有许多更紧迫的事情在待办事项中。即使在教育机构，教师也不断寻求避免课程超载。对他们而言，安全和控制代表着又一个主题，需要与商业课程中的众多其他主题竞争。然而，在信息技术以前所未有的速度改变商业世界之际，我们所有人都需要在这一领域投入时间，并寻求一种恰当的平衡，介于自满和恐慌之间。\n\
  \n因此，本书的承诺是尽可能涵盖信息系统安全和控制中的主要问题，并以普通读者能够理解的方式尽力做到。引用保持低调，但希望对学术读者和其他希望跟进感兴趣点的读者来说足够严谨。案例研究和示例已尽可能用于说明观点。每章末尾的复习问题主要面向正在学习课程的人。然而，许多问题旨在激发进一步的想法，其中一些建议在工作场所进行实际观察，因此希望它们也能引起其他类型读者的兴趣。\n\
  \n在进一步解释本书的目标和结构之前，先简要看看一些已应用于信息系统安全和控制的简单图片和模型会有所帮助。\n\n### 2 商业环境中的安全模型\n\n“计算机安全”最初是军方的专属领域，其主要关注点是确保可能对敌人有帮助的信息的保密性。因此，人们认为关键要求是围绕信息系统建立强大的防御，并将信息发布降到最低。商业世界摆脱这些假设并发展出自己的新假设花了一些时间。虽然企业通常不希望其信息系统对外部人员开放，但它们还有一些同样重要的其他关注点。例如，它们希望确信其系统提供的信息准确可靠，电子记录在必要时可作为证据使用，以及输入或使用信息的人员可以被\
  \ readily 识别。\n\n另一方面，军事信息系统安全模型假设保密是首要的，并且存在用户层级，用户的安全许可程度反映其资历。Bell 和 La Padula\
  \ (1973) 提出了一个沿此思路的正式模型（见 Figure I.1），1983 年该模型被写入美国国防部的《可信计算机系统评估标准》。该标准后来更广为人知为“橙皮书”，此后一直定期修订，作为安全级别的指南。\n\
  \n![Figure I.1 The military (hierarchical) model](img/figI_1_B.jpg)\n\nFigure I.1\
  \ The military (hierarchical) model\n\n对数据安全的军事关注导致了围绕 Bell-La Padula 模型构建的软件的相当大投资，随着时间的推移，这些模型的改编开始进入商业市场。此时，开始有人质疑军事模型是否完全适用于企业。Clark\
  \ 和 Wilson (1987: 185) 指出：\n\n> 在商业环境中，防止披露通常很重要，但防止未经授权的数据修改通常更为重要。\n\nClark 和\
  \ Wilson 进一步指出，企业总体上并不特别担心信息“泄漏”给错误的人。他们更担心的是能够依赖其系统提供的信息，尤其是在会计方面。为此，企业希望防止错误发生，并尽可能使员工难以实施欺诈。因此，Clark\
  \ 和 Wilson 从会计实践中借用了两个概念，即 *well-formed transactions* 和 *separation of duties*，并建议了它们如何在计算机系统中应用。Well-formed\
  \ transactions 是指不断积累佐证证据的交易。不允许修改或删除信息：相反，变更始终通过额外的“更正”条目进行。职责分离涉及以旨在使人们难以串谋并实施欺诈的方式分配任务。这两个概念都特别关注信息是否应*发布*的问题不大。关注点更多集中在信息的*准确性*和*完整性*上。\n\
  \n考虑到这些优先事项，需要对商业信息系统安全应如何运作采取更宽泛的观点。Clark 和 Wilson 从保密开始，增加了准确性和防篡改。在电子商务时代，至少还有另外五个需要添加的目标，这里列出。\n\
  \n\n\n\n\n接下来的章节阐述了实现 `all` 这些目标的思路。它们在各种行政和财务记录的背景下进行探讨，涵盖私营和公共部门。所有组织都假定将安全和控制纳入其“业务”目标，尽管在重点上不可避免地存在重大差异，尤其是在个人数据隐私保护或记录长期保存的需求等领域。\n\
  \n在实施任何安全模型（无论是军事还是商业）时，重要的是要确定应在哪儿应用控制措施，这些控制措施是完全或部分 `automated` 的。这意味着要在某些系统组件和活动周围设置\
  \ `automated control boundary`。理想情况下，组织中的所有信息系统都将被收集在同一个边界之内。实际上，可能必须有多个独立的“容器”。每个容器都可以如\
  \ 图 I.2 所示。\n\n![图 I.2](img/figI_2_B.jpg)\n\n图 I.2\n\n请注意，所有希望使用容器内信息服务的人都必须首先获得授权才能使用，通过“门口”的访问控制进入。容器内部，系统通过限制来强制执行，以确保每个用户仅限于其实际需要的活动（具体如何实现将在\
  \ 第 2 部分 中讨论）。\n\n在 图 I.3 中，容器被显示为被另一个边界（用虚线表示）包围，该边界包含为组织工作的人员。\n\n![图 I.3 ](img/figI_3_B.jpg)\n\
  \n图 I.3 \n\n由于组织可能希望向选定的外部人员（例如客户和供应商）提供访问权限，因此现在显示了两个访问箭头：一个代表组织内部人员的 `internal`\
  \ 访问，另一个显示组织外部人员的 `external` 访问。如果系统的安全或完整性受到威胁，这些威胁也可以被视为通常源于 `internal` 或 `external`。\n\
  \n### 3 本书的结构\n\n本书的 `第 1 部分` 介绍了主要与上述前三个目标相关的一些概念。它考虑了信息如何被估值，以及如何对针对信息系统的各种威胁进行分类。然后提出了两个主题，管理者必须在其中做出艰难判断：首先，在估计风险水平时，其次，在设计控制时必须考虑的一些人为因素。\n\
  \n设置自动化控制边界的内容在 `第 2 部分` 中介绍。第 2 部分 的很大一部分涉及访问控制“门口”的创建和管理，所有跨边界的流量都应通过这些门口进行监管。还对需要在自动化控制边界\
  \ `inside` 业务交易上应用的控制措施以及应补充和支持它们的组织结构和程序给予了关注。到目前为止，重点仍然放在前三个安全和控制目标上（保密性、准确性和防篡改）。\n\
  \n在 `第 3 部分` 中，关注点转向系统相互链接的情况。现在可以如 图 I.4 所示来看待这种情况。管理者现在面临关于信任可以在网络链接上延伸到何种程度的判断。\n\
  \n![图 I.4 ](img/figI_4_B.jpg)\n\n图 I.4 \n\n即使不同系统名义上在同一组织边界内，也会出现相同的问题，如果它们通过网络链接。\
  \ 第 8 章 涵盖了这种情况（特别强调局域网）。\n\n到目前为止，本书关注的是对典型信息系统中日常交易的常规控制。 `第 4 部分` 转向一些更具战略性和长期性的问题，特别是在发生灾难时使业务生存成为可能，以及创建在未来很长一段时间内仍能运行的档案方面。共同主题是数据随时间的保存。今天的组织意识到，数据以其各种形式是一种具有相当价值的资产。计算机系统的故障可能意味着业务所依赖的记录的丢失，在极端情况下，会导致业务崩溃。另一种依赖性正在增长，因为越来越多的历史数据进入电子存储。不能认为这些数据在数年后仍可理解，并具有证据价值。\n\
  \n`第 5 部分` 关注合规问题。描述了计算机审计员的角色，并将其与 IS 安全官等其他人员的角色进行比较。这些是使用 IS 的所有组织的重要职能，尽管职责并不总是很正式地分配。良好的计算机审计超越了现在，参与将安全规划到新系统中，并在设计和测试阶段帮助建立控制。还包括一章关于计算机取证。虽然“侦探”工作只在相对不频繁的情况下需要，但了解可用的技术是有帮助的（并且使用它们的威胁有时可以成为一种有用的威慑）。\n\
  \n与 IS 控制相关的行业标准和法律规定的考虑被保留到 `第 6 部分`。它提供了许多示例，以及那些希望了解最新情况的人的参考点。该部分可与 附录 2 提供的网站列表结合使用。最后，一些“经验法则”挑选出书中的主题，并尝试以管理者易于记住的方式呈现它们（附录\
  \ 1）。\n\n表 I.1 显示了本书不同部分如何处理八个安全和控制目标。 （第 6 部分 未包含在表中：可以认为标准和立法与 `all` 目标相关）。 表\
  \ I.1 仅旨在大致指导在本书的哪一部分引入各种目标。到 第 5 部分 开始时，目标是大多数目标都已得到详细讨论，以便可以将注意力转向必须实施它们的那些人的角色。有关章节内容的更详细指导，请参阅每章开头的摘要信息。\n\
