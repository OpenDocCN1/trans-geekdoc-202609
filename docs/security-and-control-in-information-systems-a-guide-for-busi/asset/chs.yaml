  \ || Eavesdropping on individual nodes or links |\n\n## 6.5 The Role of Cryptography\n\
  \n实际上不可能使每根电缆都防篡改，也不可能阻止未经授权的人在他们想听时监听无线电传输。然而，可以通过发送已被故意变得完全无法理解形式的消息来挫败他们。这是密码学的主要作用之一。密码学具有诸多优势，因为它可以在数据仍处于应用层时就被应用。这自动提供了在数据通过所有其他层移动过程中的拦截保护。这种密码学的使用有时被称为“端到端”（见图\
  \ 6.3）。\n\n![Figure 6.3 ](img/fig6_3_C.jpg)\n\nFigure 6.3 \n\n将密码学用于保密消息的用途可以追溯到希腊和罗马时代（Beutelspacher\
  \ 1994）。其中一种最早的方法由公元前五世纪的斯巴达将军发明。一条长而薄的纸条被螺旋式地缠绕在一根棍子上。然后沿着棍子的长度在纸上书写消息。当纸被展开时，它包含一串毫无意义的字母。然而，通过将纸缠绕在另一根直径相同的棍子上，接收者可以立即解码消息。如果纸条落入敌手手中，它看起来会包含完全的胡言乱语。\n\
  \n在二十世纪的大部分时间里，政府和军队一直以与斯巴达人相同的方式继续应用密码学。技术不断改进，但主要关注点是防止敌对国家窃听内部通信（Andrew 1996）。然而，近年来，便宜且充足的计算能力的出现促进了新型密码技术的发展，这些技术可用于其他目的。例如，它们可用于“签名和密封”消息。这些技术旨在保护数据的*完整性*而非保密性。它们对于确保业务数据准确且真实很有用，从而满足\
  \ Clark 和 Wilson (1987) 提出的某些需求（见引言）。\n\n密码学的机制实际上不需要对使用者可见。越来越多的供应商生产软件包来处理所有技术细节，并使用户能够通过点击简单的菜单和图标来应用密码学。尽管如此，盲目使用此类设施而不了解密码学提供的保护的优势和局限性，存在一定的危险。\n\
  \n密码学将人类可读的数据转换为看似完全无意义的数据位流。但结果只是*看起来*毫无意义：任何知道所使用密码算法并拥有正确密码密钥的人都可以逆转该过程，从而使材料变得有意义，如图\
  \ 6.4.所示\n\n![Figure 6.4 ](img/fig6_4_B.jpg)\n\nFigure 6.4 \n\n在当今的多媒体世界中，“明文”实际上可能是一段语音录音、一张照片、一个视频剪辑，或任何其他基于位流的数据形式。现代加密方法可以处理任何以数字形式表示的东西。由于业务越来越多地使用包含图表和图解的电子文档，或包含声音和视频序列的计算机生成演示文稿，因此如果需要，所有此类材料都可以通过加密过程得到保护。\n\
  \n这与过去使用的加密方法之间存在显著差异。历史上，加密依赖于单个字母的*换位*（如斯巴达示例）或根据预先安排的方案将一个字母*替换*为另一个字母。后一种方法的例子是十六世纪布莱兹·德·维吉尼尔发明的密码（见图\
  \ 6.5）。\n\n![Figure 6.5 Viginere Cipher](img/fig6_5_B.jpg)\n\nFigure 6.5 Viginere\
  \ Cipher\n\n维吉尼尔密码与现代加密方法之间的一个共同点是其对使用*密钥*的依赖。示例中显示的密钥长五个字符长，必须为消息的发送者和接收者所知。如同密码一样，一般原则是密钥越长越好。在行和列中查找字母的过程可以与当今加密中使用的*算法*相比较。\n\
  \n\n\n\n\n尽管密钥仍然是密码学的重要组成部分，但基于单个字母的换位或替换的加密方法在计算机时代已被基本放弃。因为每种人类语言都有其特征模式，某些字母和字母序列出现的频率高于其他字母，因此相对容易设计程序来搜寻加密字母中的模式，作为“破解密码”的第一步。\n\
  相反，现代密码学根本不理会单个字母或符号，而只是将任何数字化信息视为一串比特。`Stream ciphers`一次操作几个比特，以连续流的方式进行。它们特别适合于需要“实时”传输的数据加密，例如通过数字网络进行的电话通话。`Block\
  \ ciphers`首先将数据分成固定长度的块，然后对每个块应用加密逻辑，再将它们重新拼接在一起（示例见 Figure 6.6）。单个块可能包含多个字母、图片的一小部分，或数字声音录音的一段短突发。\n\
  ![Figure 6.6 The Operation of a Block Cipher](img/fig6_6_B.jpg)\nFigure 6.6 The\
  \ Operation of a Block Cipher\n## 6.6 Business Applications of Encryption\n向电子商务的转变迫使企业认识到纸质系统一直以来固有的一些优势。纸张，例如，可以携带签名以表明有人已检查或批准其内容，或携带水印以防止任何人制作伪造副本。它可以作为某些明确保证已给出或订单在特定日期下达的证据。它带有“白纸黑字”的权威性。对在电子世界中实现“白纸黑字”同等方式的搜索刺激了密码学应用的新思路。其中两种技术被证明特别有用：非对称密码学和哈希。\n\
  1. `Asymmetric cryptography`. 到目前为止描述的所有技术都假设发送方和接收方都使用相同的密钥。显然，双方都必须对密钥保密，换句话说，他们都将其视为“私钥”。这是一种“对称”安排，事实上直到最近这才唯一可用的加密类型。然而，在\
  \ 1976 年 Diffie 和 Hellman 提出加密可以基于*对*密钥：其中一个密钥用于加密消息，另一个用于解密它。乍一看，这似乎是一个完全不必要的复杂化。然而，它开辟了全新的可能性。\n\
  假设 Alice 在她的计算机上生成一对非对称密钥。她将其中一个保密，这成为她的*私钥*。另一个密钥成为她的*公钥*，她将其提供给任何想要它的人。这在试图保密消息方面完全没有意义。如果您加密一条消息，然后让每个人都拥有一个可以解密它的公钥，您与其避免所有这些努力，直接向每个人发送明文。\n\
  然而，公钥允许消息接收者做一些完全不同的事情。如果接收者用公钥解密消息，并且这生成了有意义的明文，那么这就证明加密*必须是由 Alice 完成的*。这相当于 Alice\
  \ 对消息进行了“签名”，该过程有时被描述为应用*数字签名*。请注意，*任何人*只要拥有 Alice 的公钥副本，都可以执行此验证过程，以确认消息来自 Alice。与此同时，只要\
  \ Alice 将私钥安全地隐藏在她的计算机内部，就没有人可以“伪造”她的签名。情况如图 Figure 6.7 所示。\n![Figure 6.7 A simple\
  \ digital signature](img/fig6_7_B.jpg)\nFigure 6.7 A simple digital signature\n\
  使用非对称密钥的过程是可逆的。这意味着任何人都可以加密一条消息，使用 Alice 的公钥，然后将其发回给 Alice。除了 Alice 之外，没有人能够解密它。Alice\
  \ 现在将她的私钥用作*解密*密钥。如果许多人想向某个人发送机密信息，这很有用。例如，可以将家庭诊所的所有医生都提供医院顾问的公钥。这将使他们能够向顾问发送有关其患者的留言，并确信顾问是唯一拥有能够解密这些留言的密钥的人。\n\
  使用非对称私钥签名在建立*不可否认性*方面也很有用。有时会出现 Alice 可能想否认她发送了消息的情况。例如，她可能要求她的股票经纪人购买一些股票，随后在接下来的几个小时内其价值急剧下跌。如果她的指令是用她的私钥加密发送的，她就无法否认她已发出指令。不可否认性对于消息的*接收*也可能很重要。例如，如果股票实际上在价值上急剧上涨，经纪人可能想扣留它们，并声称\
  \ Alice 的订单从未到达他。这种问题只能通过坚持所有消息必须立即得到确认来解决，通常是通过自动生成返回消息。很明显，如果这条消息也能被加密，在这种情况下使用*接收者*的私钥，将有助于解决任何后续争议。\n\
  2. `Hash functions`. 哈希将明文转换为无意义的数字串，在这方面它与加密的工作方式非常相似。然而，有两个重要区别。第一个是哈希过程的输出比原始消息*短*得多：哈希函数故意将其“缩小”到其原大小的一小部分。第二个区别是哈希旨在是*不可逆的*。整个过程只朝一个方向工作，因此无法从哈希反向推导出原始消息的内容。\n\
  再次，哈希技术并不特别关心保密性。哈希最常见的用途是将其添加到消息末尾，而该消息可能作为明文公开发送。哈希提供的证据是*消息自发送以来未被更改*。在收到消息和哈希后，接收方会对消息内容重新应用相同的哈希技术。将此结果与发送方提供的哈希进行比较。如果两者相同，接收方就可以确信消息在途中未被篡改。该程序如图\
  \ Figure 6.8 所示。\n![Figure 6.8](img/fig6_8_B.jpg)\nFigure 6.8\n哈希有时被称为 `Message\
  \ Digest`。它为整个消息提供的验证与校验位为单个数字提供的验证相同（参见 section 5.2.2）。一个好的哈希算法旨在尽可能让任何试图干扰消息的人的生活变得困难。它将确保即使是微小的更改，例如在数字末尾添加一个零，也会导致哈希值发生显著变化。\n\
  \n\n\n\n\n与所有密码技术一样，哈希也容易受到各种形式的攻击。由于哈希值非常短，必然会出现多个明文产生相同的哈希值（尽管不太可能有许多明文是能构成有意义的词）。然而，如果哈希算法是广泛使用的算法，则攻击者可能能够更改消息并为其生成一个真实的哈希值。因此，一些哈希算法需要使用秘密密钥。或者，消息的选定部分可以在事先商定的密钥下进行加密，并将其附加为\
  \ `Message Authentication Code`。\n\n非对称密码学和哈希函数共同提供了一套强大的“工具箱”来控制信息（参见 图 6.9）。每种技术在传统的纸质世界中都有其对应物。针对法律和其他重要文件每天都会采取同等措施，甚至在美国宪法第二条中也得到体现，该条款规定了总统选举中选票的计票方式：\n\
  \n![图 6.9 密码工具箱](img/fig6_9_B.jpg)\n\n图 6.9 密码工具箱\n\n他们应列出所有被投票的人及其各自的票数清单；他们应签署并证明该清单，并密封后送交美国政府所在地，交予参议院议长。参议院议长应在参议院和众议院面前打开所有证书，然后进行计票。\n\
  \n所有这些程序 `could` 都可以通过电子方式进行。事实上，签名过程如果有的话会更可靠，因为数字签名是“附加”在整个文档上，而不仅仅是最后一页。\n\n\
  刚刚描述的技术经常组合使用。例如，可以为消息生成哈希函数，然后将消息及其哈希值 `both` 输入加密算法。这提供了两种形式的保护：一种主要旨在保护消息的完整性，另一种旨在确保其内容保密。\n\
  \n也可以对已经加密的内容进行重新加密。例如，Alice 可以使用她的私钥加密消息，然后使用 Bob 的公钥对结果进行加密。这将确保除了 Bob 之外没有人能够解开读取消息所需的\
  \ `both` 解密层。假设 Bob 拥有 Alice 的公钥，他也可以检查确实是她发送了该消息。这种双层非对称加密因此提供了额外价值：它保护了消息的保密性，并对双方的身份进行核查。\n\
  \n请注意，计算机用户不应直接处理密码密钥和算法。许多厂商现在提供旨在简化安全和签名消息业务的产品。由于密码密钥本身是一串冗长、无意义的数字组合，这些密钥将由密码软件负责处理并隐藏起来。要使用软件的功能，用户将使用更常规的密码（在此上下文中有时称为\
  \ `passphrase`）。同样，大多数用户实际上不会为消息计算哈希结果然后进行比较。这将在计算机的“幕后”完成，并通过屏幕上的消息告知哈希检查是否成功。\n\
  \n## 6.7 密码方法成本与漏洞\n\n随着密码学的应用不断扩展，人们寻找攻击和破坏其方法的方式的兴趣也随之增加。已有若干公开报道的案例，攻击者成功解密了消息，即使加密方法相当复杂（见示例）。这些攻击通常采用“暴力”方法。暴力攻击涉及依次尝试每一种可能的加密密钥，希望找到能产生可理解结果的密钥。这绝非易事；例如，如果密钥长\
  \ 40 位，就需要测试超过一百万百万种组合。即使是快速计算机也需要数年才能完成此操作。然而，通过利用大量计算机并行寻找答案，以及使用特殊软件加速分析，可以加快这一过程。\n\
  \n此类攻击不太可能针对消息，除非它们被认为具有极高的价值。在大多数报道案例中，攻击的目的是为了证明某一点，或回应挑战，而不是为了获取任何商业价值的信息。\n\n\
  然而，由于必须假设潜在攻击者可用的计算能力会随时间增加，因此人们不断寻求使加密更强的方法。密码学家与攻击者之间这种智力较量很可能在可预见的未来继续进行（Schneier\
  \ 1998）。它围绕加密过程中的两个主要要素展开。一方面，密码学家努力创建越来越复杂的 `algorithms`，旨在不向攻击者提供任何线索，无论多么微不足道，关于明文、密文和加密密钥之间的关系。他们还试图预见到其他人可能尝试对加密方法发起的各种反攻击方式。另一方面，`key\
  \ length` 可以成为增强加密能力的一个因素。更长的密钥意味着攻击者需要处理的数字组合更多。它提供的保护与在系统访问控制的上下文中观察到的更长密码和 PIN\
  \ 的情况类似（参见 第 4.2.2 节）。\n\n使攻击者更难的另一种方法是层层加密。加密后使用 key-1 的加密输出，然后使用 key-2 再次加密，依此类推。这有点像让建筑物访客依次通过一系列门，每扇门都装有不同的锁。\n\
  \n所有这些增强密码强度的方法都伴随着成本。密码学使用的经验法则是其开销可能 `increase` 如果：\n\n* `the encryption is asymmetric\
  \ rather than symmetric`。非对称算法比对称算法需要更多的处理能力。如果消息很短，这可能不重要，但在尝试发送大量文本或多媒体文件时，这可能是一个重要因素。像\
  \ RSA 这样的非对称算法加密给定消息所需的处理时间可能比像 DES 这样的对称算法多 1,000 倍（下面给出了这些算法的一些细节）。\n\n* `a longer\
  \ encryption key is used`。计算机处理时间会随着密钥变长而增加，且增加可能不成比例（例如，一个基准测试显示，将 RSA 密钥长度从 512\
  \ 位加倍到 1,024 位，导致解密时间几乎增加了六倍（Schneier 1998））。\n\n* `multiple layers of encryption\
  \ are used`。在这种情况下，开销大致成比例，即三层加密大约需要单层加密三倍的处理能力。\n\n\n\n\n\n一旦消息被加密，其长度将与明文相同；因此不会在网络上产生额外的流量负载。然而，有时需要“即时”加密，例如视频会议或语音通话。如\
  \ section 6.5 所述，在这种情况下，使用流加密而非分组加密可能是有利的。无论使用何种加密方法，可用的处理能力必须足以避免在峰值负载下出现减速。这可能意味着需要投资比原本必要更强大的处理器。\n\
  \n以下两种方法可以最大程度地减少常规交易中加密的开销。\n\n* *使用哈希的数字签名*。使用非对称算法和她的私钥，Alice 可以加密，从而“数字签名”整个消息。然而，她同样可以准备消息的哈希值并对其进行签名。由于哈希值比原始消息短得多，因此涉及的加密开销要小得多。Bob\
  \ 现在必须解密哈希值，并将其与他从收到的消息计算出的值进行核对。如果这一切都能令人满意地进行，他就可以确信哈希值和消息都来自 Alice。此过程在 Figure\
  \ 6.10 中进行了说明。\n\n![Figure 6.10 Digital signing using a hash](img/fig6_10_B.jpg)\n\
  \nFigure 6.10 Digital signing using a hash\n\n* *先非对称后对称加密*。如果 Alice 拥有 Bob 的公钥，她就可以在保密条件下使用该密钥向他发送她选择的另一个密钥。此密钥现在仅\
  \ Alice 和 Bob 知道。他们随后可以使用此密钥作为后续消息的`one-time key`，在两个方向上使用对称加密。这使他们能够从启动时的一次性非对称加密爆发（开销高）切换到其余数据流量的对称加密（开销低）。\n\
  \n## 6.8 Security on the Internet\n\n将企业连接到互联网，无论是作为网络提供商还是仅用于浏览和使用电子邮件，都会立即使其与全球数百万人进行联系，完全不加区分。企业可以与客户、供应商、监管机构、银行和其他可以预期对其业务目标有共同利益的人进行沟通。与此同时，它也使自己对异议者、无政府主义者、诈骗者以及许多其他利益可能远不如人意的人开放。当然，其他服务，如邮件和电话，也存在同样的普遍连通性。然而，只有互联网能够快速、直接地对企业核心的计算机化功能造成严重损害。\n\
  \n*在将互联网视为通信媒介时，唯一可以安全做出的假设是它完全没有任何安全性*。更糟糕的是，它作为全球松散的网络联合体运行，监督和监管参差不齐且经常不存在。因此，如果远程用户*确实*对企业发动了成功的攻击，获得补救的机会将微乎其微。\n\
  \n不出所料，这种情况催生了一个蓬勃发展的市场，专门提供旨在让企业用户安心的产品和服务。例如，有供应商会建立（在某些情况下还运营）`Virtual Private\
  \ Network`（VPN）。这是一种网络服务，即使流量实际上是通过不安全的链路，例如互联网传输，也能向所有用户保证一定的安全设施。（这种安全路由的创建有时也被称为`tunnelling`）。还有各种各样的产品称为`firewalls`，旨在在企业与互联网之间创建保护屏障。防火墙保护特定站点，而\
  \ VPN 的保护范围则延伸到多个站点。防火墙和 VPN 的简化图示见 Figure 6.11。\n\n![Figure 6.11 ](img/fig6_11_B.jpg)\n\
  \nFigure 6.11 \n\n供应商会以他们认为对市场有吸引力的方式将产品打包在一起。对于 VPN 或防火墙究竟应提供什么，并没有统一的定义。然而，这两种产品往往都工作在`lower`通信层（见\
  \ section 6.4 所述）。它们集中于为在网络中路由数据而插入数据的控制信息。它们的目的是检测任何可疑的东西，例如，对某种流量来说不寻常的服务功能请求，或使用不合适的网络地址。其假设是，到达屏障的数据包可能已被熟练的黑客篡改，他们正在寻找进入组织计算设施的途径。\n\
  \n为了使这种检查有效，VPN 或防火墙软件必须被告知它应将何种活动视为正确或正常。有时这种情况会发生变化（例如，当有新计算机接入网络时），因此规则需要进行修改。与访问控制表和病毒检查器一样，VPN\
  \ 和防火墙必须不断审查，并在变化发生时尽快更新。\n\n不幸的是，某些类型的攻击无法在较低的通信层中检测到。为了进行真正严格的检查，需要在*所有*层面上应用。一些更昂贵的防火墙试图通过充当所选上层活动的`proxy`来实现这一点。例如，代理防火墙会拦截登录应用程序的请求，并在用户接近真正的应用程序之前*先*进行用户凭证的必要检查。此类预防措施成本极高，因为它们不仅涉及为防火墙提供额外的机器，还需要重新设计应用程序程序，以确保安全元素可以分开处理。代理防火墙的维护成本也很高，因为其软件需要随着应用程序程序的任何修改而升级。代理防火墙如图\
  \ Figure 6.12 所示。\n\n![Figure 6.12 ](img/fig6_12_C.jpg)\n\nFigure 6.12 \n\n在决定防火墙或\
  \ VPN 对给定组织是否有帮助时，有用的是首先看看互联网将如何使用。并非每个人以相同的方式或出于相同原因连接到互联网。以下是一些关键考虑因素。\n\n* *企业内部的连通性*。如果一台孤立的\
  \ PC 连接到互联网，潜在的损害仅限于该 PC。然而，如果该 PC 还连接到企业内部运行的局域网或内联网，入侵者可能到处去攻击任何东西。对于某些电子商务应用，可能必须具有这种类型的连接（例如，如果公众要在网页上输入预订，并且这些预订要立即传输到中央预订系统）。另一方面，如果只是办公室工作人员偶尔需要查询互联网，最便宜、最有效的屏障可能是使用一台独立的\
  \ PC，该 PC 包含最少的软件，包括网络浏览器，但除了其与网络的连接外，绝对没有任何其他网络连接。\n\n\n\n\n\n*   *数据流量的可预测性*。通信在源、目的地或内容类型方面可能或多或少是可预测的。例如，一名电子商务交易商可能只与已在其系统上注册过的客户交易，而且即使如此，也可能将其活动限制在指定的交易范围内。这使得情况变得容易得多进行控制。另一方面，律师事务所或社会服务部门可能期望从各种来源发送和接收大量多样化的材料。\n\
  \n*   *员工的技能和动机*。学习如何使用互联网所需的时间很少，但这不应被理解为员工培训是不必要的。希望所有员工都能对互联网上可能遇到的诡计“有街头智慧”，这些诡计可能会诱使他们透露机密信息，或下载旨在造成损害的程序。另一方面，如果以这种方式培训员工不可行，则可能需要通过安装一些额外的预防措施来弥补，例如完全禁用某些功能。\n\
  \n*   *过滤和阻断流量的需求*。除了阻断看起来具有欺骗性或恶意意图的传入消息外，组织还可能希望限制员工被允许在互联网上进行的活动类型。例如，它可能希望阻止下载计算机游戏，或将网络用于娱乐的其他用途。它还可能寻求阻止访问提供计算机病毒、色情内容、恐怖主义技能或其他反社会材料的网站。防火墙可以对进出组织的流量进行审查，并采用不可取网站的禁止列表，或在日常工作中所需的网站的批准列表。这些问题在\
  \ section 8.6.中有进一步讨论。\n\n与任何安全产品一样，防火墙和 VPN 不应基于仅仅拥有它们就一定会带来好处的假设而购买。更不应假设昂贵的产品会比便宜的产品取得更好的效果，或设备的购买成本与其生命周期成本有任何特殊关系，因为如果更新设施简陋，或需要供应商频繁干预，其运行开销可能很大。\n\
  \n## 6.9 Questions\n\n1. True or false?\n\n    1. It is difficult to intercept messages\
  \ sent along an optic fibre cable.\n    2. UNIX is a good operating system to use\
  \ from a security point of view, because so many people understand its internal\
  \ workings.\n    3. Cryptology is concerned with encrypting each word in turn in\
  \ a message.\n    4. The best place to apply encryption is in the Link Layer.\n\
  \    5. Asymmetric encryption uses up more processing power than symmetric encryption.\n\
  \    6. good firewall will never need any updating.\n    7. Substitution ciphers\
  \ are an excellent way of protecting secret email messages.\n    8. A Message Digest\
  \ is the same length as the message on which it is based.\n\n2. Explain what is\
  \ meant by a ‘brute force attack’. What measures can be taken to make this kind\
  \ of attack more difficult?\n\n3. A hacker plans to eavesdrop on messages sent to\
  \ and from the terminal of a senior manager. What would be the advantages and disadvantages,\
  \ from the hacker’s point of view, of trying to attack via (a) the application layer,\
  \ and (b) the link layer?\n\n4. If you are a spreadsheet user, you can experiment\
  \ with creating a simple hash function for yourself. Type in a brief message, putting\
  \ only one letter per cell in a row across the worksheet. Now find the spreadsheet\
  \ function which converts a letter into its corresponding digital code (in Excel,\
  \ this is the `CODE` command). Use this command to create a row of numbers corresponding\
  \ to the letters (for example, if your first letter is in cell `A1`, you could create\
  \ a row of numbers immediately underneath, by entering `=CODE(A1)` in cell `A2`,\
  \ and then filling right). You can now use these numbers to create your hash. If\
  \ you wanted your hash to be, say, five numbers in length, you could add together\
  \ all the numbers in row `B`, and take the last five digits of the resulting total.\
  \ To give your hash a more unpredictable result, you could multiply each letter\
  \ by a different factor, and use a modulus function to give you a ‘remainder’ which\
  \ has a fixed length.\n\nWhen you have designed your hash, try writing out a set\
  \ of instructions which would enable someone else to use it. This will be your ‘hash\
  \ algorithm’.\n\n# chapter seven Managing the Security of Networked Facilities\n\
  \nDOI: [10.4324/9780203992319-11](https://dx.doi.org/10.4324/9780203992319-11)\n\
  \n## 7.1 Introduction\n\nThe simplest view of networks is that they are pipelines\
  \ for information, based on cables which are part of the basic infrastructure in\
  \ the same way as the electricity or water supplies. It is tempting to assume that\
  \ any security issues will revolve around the communications hardware, and such\
  \ matters as the route to be taken by cable ducts, or the type of connectors being\
  \ used. However, as the previous chapter showed, this will result in some vital\
  \ aspects of network security being overlooked altogether.\n\nAs with all security\
  \ measures, network security needs to be based on a much broader view, and must\
  \ involve people who understand the business priorities. For example, if a business\
  \ is embarking on a new venture in electronic commerce, it must have some idea of\
  \ which network-based threats might cause particular loss or embarrassment. If it\
  \ is a public authority launching an on-line service to the public, it may need\
  \ to review whether particular care needs to be taken with personal information\
  \ in transit.\n\nOnly then will it be possible to begin to identify the best countermeasures.\
  \ First, management will need to focus on the way access to the network is controlled.\
  \ The methods of identifying users, and the creation and use of access control tables,\
  \ will be essentially the same as those outlined earlier in Chapter 4. However,\
  \ there are some additional complications in ensuring that employees distributed\
  \ around a network are provided with all the necessary software, passwords and keys,\
  \ in a secure fashion. Problem situations also have to be anticipated and planned\
  \ for, such as an employee losing the key needed to decrypt an urgent message, or\
  \ the collapse of part of the network through equipment failure.\n\nManagement involvement\
  \ continues to be essential once the network facilities have been put in place.\
  \ Few networks remain static, and (as was seen with firewalls and VPNs) it is dangerous\
  \ to assume that countermeasures will remain effective indefinitely, and so updates\
  \ must be made on a regular basis.\n\nNotwithstanding the ‘hi-tech’ nature of many\
  \ current developments in networking, much network security management still remains\
  \ a matter of common sense and attention to detail. A new generation of control\
  \ tools is appearing, based on cryptography, and at first sight these may seem incomprehensible\
  \ except to boffins. However, the underlying principles are not difficult to grasp,\
  \ and in future it is likely that networks will deploy them on a routine basis.\
  \ It is therefore important for managers to have some idea of their functions, and\
  \ their strengths and weaknesses.\n\n\n\n\n\n密码学对于电子商务项目尤其至关重要。不幸的是，一些产品安装和维护成本相当高昂，但如果管理不当，其有效性很快就会受到损害。这是企业很容易发现自己将资金投入到最终证明脆弱且短命的解决方案中的一个领域。与此同时，完全理解这些技术所提供的能力和益处的管理层可以预期比以往任何时候都更好地保护其商业利益。\n\
  \n## 7.2 密码密钥的维护和分发\n\n大多数密码学应用的初始要求是每个用户都需要一个密钥，该密钥可以是对称的也可以是非对称的，并且必须保密。至关重要的是，这些密钥必须在严格控制的条件下发放，否则其有效性从一开始就会受到损害。\n\
  在许多方面，私钥就像密码一样，因为它们“属于”用户。然而，存在重要区别。对称私钥需要被不止一个人知晓，即一个发送者和一个或多个接收者，但在这一精选圈子内保持秘密。对于非对称加密，用户必须绝对保密自己的私钥，这与密码非常相似，但同时也有必要记录*其他人*的公钥。因此，分发密钥比密码复杂得多：不仅仅是为每个人生成一个密钥，然后发送给他们。\n\
  为网络用户设置密钥的问题进一步复杂化，因为正如 Meyer (1995) 所指出的那样，存在一种“先有鸡还是先有蛋”类型的问题。Meyer 的悖论是：\n* 建立安全通道需要使用密码学；\n\
  * 向人们发送其密码学密钥需要使用安全通道。\n摆脱这一恶性循环的唯一方法是在最初找到一种相当独立且安全的方式来分发密钥。理论上，密钥可以写下来并装在密封信封中发送，就像密码一样。然而，如果它们记录在纸上，对用户来说就会像长串的乱码。人们不会很高兴被要求将它们输入计算机，而且在输入时很可能会犯错误。\n\
  因此，任何密钥分发最好通过电子媒介进行。例如，密钥可以记录在软盘上，装在个人地址且防篡改的信封中发送出去。实际上，通常更容易将一个站点上多个用户的密钥全部发送给受信任的员工，然后由该员工直接在各个个人电脑上安装它们。\n\
  能够在不安全网络链路上工作的全自动方法也已被设计出来，但这些方法存在一些局限性。其中最早的例子之一是 Diffie 和 Hellman 设计的一系列交换，通过这种方式，Alice\
  \ 和 Bob 可以在没有任何事先安排的情况下就一个仅他们自己知道的对称密钥达成一致 Gove 1999。在使用此类方法时，分发中心必须确定它确实是在与另一端的正确用户通信，并且用户的软件没有以任何方式受到损害。因此，必须非常重视该程序通过独立的通信线路进行检查，例如通过拨打已知的分机号码进行电话呼叫，或进行其他独立验证以确保一切如其所见。\n\
  如果要分发大量密钥，应假定这会引起黑客的好奇。例如，黑客可能会冒充授权用户以获取真正的密钥，或在密钥传输途中拦截密钥以便替换为伪造的密钥。如果此类攻击成功，它们将为日后破坏系统提供巨大的机会。值得投入时间和精力使任何初始密钥分发尽可能万无一失，因为它是所有后续密码保护的基础。\n\
  假设分发中心已成功向每个人发放了对称私钥。现在可以在每个用户和中心之间创建安全通道，并摆脱“先有鸡还是先有蛋”的困境。然而，在这一点上，只有中心知道*所有*密钥。因此，用户可以与中心安全通信，但不能相互通信。为了使每个用户能够向每个其他用户发送加密消息，可能需要向网络中的每个点分发非常长的密钥列表。列表上的名称和密钥会不断变化。这种安排在行政上是一场噩梦，而且很难保持安全。\n\
  为了避免其中一些问题，大型组织可能会选择设置一个*密钥分发中心* KDC，其工作方式如下：\n* 通过上述类型的<|message|>\n* 如果 Alice\
  \ 想与 Bob 通信，她首先向 KDC 发送一条消息，该消息使用*她*的私钥加密，说明她希望做什么。\n* KDC 生成一个仅在 Alice 和 Bob 之间对话期间使用的密钥，有时称为*会话密钥*。该密钥使用\
  \ Alice 的密钥加密后发送给 Alice，使用 Bob 的密钥加密后发送给 Bob。Alice 和 Bob 各自解密会话密钥。他们现在拥有一个仅他们和中心知道的密钥，可用于相互交换消息。\n\
  该程序在 Figure 7.1 中进行了说明。其实际实现将完全由软件处理，因此一旦 Alice 通过菜单选择或单击图标表示她想要建立安全通信，其余过程对她和 Bob\
  \ 来说都是完全不可见的。\n![Figure 7.1 Key Distribution Centre](img/fig7_1_B.jpg)\nFigure 7.1\
  \ Key Distribution Centre\n请注意，一旦他们的对话结束，会话密钥将被丢弃。如果 Alice 和 Bob 开始另一场对话，他们将需要获得一个新密钥。这避免了他们需要在计算机上建立任何密钥列表的需求。还有一个安全优势，即每个密钥的临时性为任何可能尝试拦截和解码消息的人增加了额外的挑战。\n\
  KDC 是管理密码学以保护保密性的灵活高效方式。使用对称密钥作为会话密钥意味着可以保持加密过程的开销较低。如果人员发生变化或网络重新配置，所有必要的更新都可以集中处理。然而，Kaufman\
  \ *et al* (1995) 指出还应考虑以下三个缺点：\n* *单点故障*。由于每个人都依赖 KDC，如果它离线，安全通信将停止运行。可以使用重复的设备和软件来提高可用性，但这会显著增加成本。\n\
  * *性能瓶颈*。即使 KDC 正常运行，如果在高峰时段收到大量会话密钥请求，也可能会变慢，从而延迟消息发送。\n* *全有或全无的脆弱性*。KDC 消除了可能因密钥列表分布在网络周围而产生的风险。然而，如果任何人*应该*成功获得对\
  \ KDC 内部密钥列表或软件的未经授权访问，它将使他们能够在整个网络上为所欲为。\n\n\n\n\n\n鉴于 KDC 所发挥的关键作用，以及它必须得到极其严格保护的需要，其职责应由一位非常高级的管理人员直接负责。如果出于任何原因，该职能是在外包协议下处理的，则应适用最严格的条款和条件。\n\
  \n## 7.3 PGP、认证机构和公钥基础设施\n\n使用 KDC 组织密钥分发提供了一种整洁的集中式解决方案，非常适合“机构”网络，例如医院或会计师事务所内部通信所使用的网络。在另一极端，可以使用“自己动手”的安排来分发密钥，以便人们以更临时的方式使用密码学。也许最著名的例子就是\
  \ Pretty Good Privacy（PGP），由 Phil Zimmerman 发明并公开发布于公共领域（1995）。\n\nPGP 共享软件包使用户能够生成一个非对称密钥对。假设\
  \ Alice 已经这样做了。她现在将她的公钥发送给 Bob。Bob 在生成了自己的密钥对后，将*他的*公钥发送给 Alice。他们现在可以在两者之间建立一个安全链路，因为用各自公钥编码的消息只能由正确的私钥所有者读取。一旦建立了这种安全链路，就像\
  \ KDC 一样，会商定一个私密会话密钥。然后可以使用开销更低的对称加密来处理剩余的消息。\n\n该软件还确保私钥得到妥善保护，并提供存储他人公钥于“密钥环”上的功能。收集公钥的工作就留给用户的积极性和主动性。\n\
  \nPGP 非常适合希望安全通信但又不想受更正式方案僵化和官僚主义束缚的小团体。每个人生成一个密钥对，并设置一个“密钥环”来存储他人的公钥。公钥交换的具体方式取决于该团体。在团体内部，必须就被视为可信的条件达成共识。因此，如果两个当事人彼此非常熟悉，他们可能很乐意通过电子邮件互相发送密钥。\n\
  \n一旦 B 在他认为可靠的条件下获得了 A 的公钥，他可能会将其传递给他也非常熟悉的 C。这种机制如 Figure 7.2 所示，有时被称为“信任网络”。此类程序快捷且非正式。然而，它们并不特别适合企业的需求，主要有两个缺点：\n\
  \n*   最终，没有人对密钥的*真实性*负责。密钥可能来自各种来源，每个密钥都由提供者担保。这如果目的是在朋友之间实现通信隐私，影响不大。然而，企业经常需要与几乎不了解的人或公司打交道。对密钥的真实性或来源“信任”可能会使其暴露于各种欺骗之下。\n\
  *   尽管信任网络软件可以相当用户友好，但它作为一个*独立应用程序*运行，任何使用它的人都需要很好地理解它在做什么以及如何运作。再次，这对于业余爱好者在真正“个人”电脑上使用是没问题的，但如果该\
  \ PC 是更广泛企业系统的一部分，就会造成问题。在压力下工作或计算技能有限的员工不希望参与设置加密保护的“ nuts and bolts”。\n\n![Figure\
  \ 7.2 Web of trust](img/fig7_2_B.jpg)\n\nFigure 7.2 Web of trust\n\n大多数企业需要一种密钥分发方法，它介于\
  \ KDC 相当僵化和集中的方法与信任网络所体现的更自由联想方法之间。可以在另一种基于非对称密钥的方法中找到解决方案，该方法采用更正式的方法来提供公钥并证明其真实性。由相关各方任命的机构来执行此角色，被称为\
  \ *Certification Authority*（CA）。CA 可能会向公众提供服务，或向公司联盟提供服务，也可仅在单一组织内部运营。CA 必须拥有的最重要资产是所有使用者对其的信任。这意味着让自己高度可见，并提供人们可以轻松联系它的方式（电子和非电子）。一些\
  \ CA 服务，如 Verisign 和 Thawte，是在互联网上发展其业务身份的新企业。现有机构，如银行，也看到了将强有力、广为人知的品牌置于 CA 背后的优势，并也在进入该领域（Anon\
  \ 1998a）。在一些国家，使面向公众的 CA 服务受政府许可监管，可以增强其可信度。\n\n商业 CA 以不同方式营销其服务，有时提供取决于证书复杂程度或进行背景调查深度的价格表。证书有时会被赋予吸引人的名称（如“数字护照”）。然而，所有证书基本执行相同的功能，其生成涉及以下序列的一个版本。\n\
  \nCA 首先生成一个密钥对，并遵循通常的做法将私钥保密，并尽可能广泛地公布其公钥。然后它建立一个程序，其中：\n\n*   Alice 向 CA 申请证书，并向其提供她的公钥副本；\n\
  *   CA 进行检查以确保 Alice 就是她声称的人；\n*   CA 然后使用 CA 的私钥签署并生成证书。\n\n所创建的证书有四个主要组成部分：\n\n\
  1.  足够的信息来可靠地识别 Alice，通过提供她的全名和其他个人细节；\n2.  Alice 公钥的副本；\n3.  一个到期日期，超过该日期证书将不再有效；\n\
  4.  使用 CA 私钥创建的数字签名。\n\n实际上，CA 可能选择通过对 (1) 至 (3) 的内容进行哈希，然后对哈希进行签名来签署证书。这与签署整个证书一样安全，并且具有将证书中所有重要信息保留为明文的优点。CA\
  \ 也可能承诺为 Alice 生成她的密钥对，但理想情况下 Alice 应该独立完成，以确保只有她自己拥有私钥副本。\n\nAlice 现在可以将已签名的证书副本传递给任何需要它的人。例如，Bob\
  \ 在获得 CA 广泛宣传的公钥后，使用它来检查 Alice 证书副本上的签名。一旦他知道 Alice 的密钥获得了 CA 的“认可印章”，Bob 就可以更有信心地使用它来与\
  \ Alice 建立通信。\n\n一个好的认证机构做的不仅仅是签署证书。事实上，如果这就是 CA 所提供的一切，其价值有限。它还应提供一系列持续服务，包括：\n\
  \n*   *证书吊销*。有时可能需要取消证书。例如，这可能是因为证书是为某人与其雇佣相关的而签发的，并且个人细节中包含对工作状态的引用。证书不能像实体卡或令牌一样在员工离职时“上交”。相反，CA\
  \ 必须维护一份所有已取消证书的清单，并使其可供任何希望检查的人使用。理想情况下，这应是一个在线设施，也许可通过互联网访问。\n\n\n\n\n\n*   `Legal\
  \ liability`. 证书旨在传达一种保证，即密钥与其使用者之间存在关联，并且是真实的。因此，CA 应对其所签署的信息的准确性承担一定责任。但这绝非总是如此。一些“CA”宣传的证书在申请人的背景上完全不做任何核查。来自此类来源的证书完全一文不值（有点像伪造大学学位的证书，可以通过邮件花\
  \ 5 美元订购）。即使那些*确实*进行合理核查的 CA，通常也会通过法律免责声明来保护自己，这些免责声明可以严格限制其责任。\n\n*   `Security\
  \ within the CA`. CA 的私钥必须始终完全安全。任何获得该密钥的人都可以伪造新证书，并破坏所有现有证书的可信度。\n\n这一系列要求，其中 CA\
  \ 签名过程只是其中一部分，定义了应包含在适当的 `Public Key Infrastructure` 中的内容。PKI 涵盖了为可靠地分配和分发公钥所需的所有服务和设施。良好的\
  \ PKI 将提供管理良好且用户方便的设施，并且能够满足任何特殊需求（例如，为个人发放的密钥和为整个部门或组织发放的“企业”密钥提供混合支持（Dam and Lin\
  \ 1996））。更复杂的 PKI 利用智能卡和其他附加技术来帮助密钥分发和管理。\n\nTable 7.1 中给出了三种主要密钥分发方法的摘要。针对这些方法设计了许多变体。其中一些（如\
  \ `Kerberos` 身份验证系统）扩展了 KDC 的功能，通过生成“票据”来定义网络机器上要为每个用户开放的设施（Kaufman *et al* 1995）。应注意的是，无论多么复杂，*所有*此类身份验证系统最终都\
  \ crucially 依赖于设置时对用户身份进行的核查质量。\n\nTable 7.1\n\n| Method || Characteristics || Suitable\
  \ for: |\n| --- | --- | --- |\n| Key Distribution Centre || Centralised; sets up\
  \ symmetric key for each session || Large bounded group |\n| --- | --- | --- |\n\
  | Web of trust || Dispersed and informal; distribution of public (asymmetric) keys\
  \ || Small ad hoc group |\n| Public Key Infrastructure || Dispersed and formal;\
  \ distribution of public (asymmetric) keys || Large unbounded group |\n\n## 7.4\
  \ Key Storage, Escrow and Recovery\n\n经常使用密码学的企业应考虑出现问题时的情况。常见的一个例子是文本已成功加密，无论是由企业本身还是其交易伙伴加密，但用于解密的密钥却丢失或损坏。\n\
  \n如果企业已向所有客户发送了其公钥，而此时才发现丢失了至关重要的私钥，这就尤其尴尬。它现在将无法读取传入消息，也无法对消息进行数字签名。如果对称密钥在企业内部被广泛使用，特别是如果它已被用于加密已归档的数据，则对称密钥的丢失也会产生类似的毁灭性影响。\n\
  \n所有这些情况都需要某种获取“备用”密钥的程序。企业无法设法“重新创建”其密钥——如果可以的话，这将使任何潜在攻击者的工作变得太容易。有两种基本方法，可以与人们为备用前门或汽车钥匙所做的安排进行比较。最简单的解决方案是复制密钥并交给他人妥善保管。或者，最初提供密钥的公司可能能够在适当的安全措施下重新创建它（例如，丢失密钥的所有者可能需要提供与密钥关联的唯一参考号）。\n\
  \n任何密钥的重复副本最好保存在远离原件的地方。如果副本保存在同一系统中，就有危险会遭受与原始密钥相同的命运（例如，被病毒攻击清除）。将其放在不同的系统上，或放在锁在保险箱中的软盘上，也会让可能对它感兴趣的任何黑客的生活变得特别困难。按照惯例，企业自行安排的任何此类安排都被称为\
  \ `key recovery`。\n\n外部机构可能被委托持有密钥的副本。如果密钥所有者要求这样做，这只不过是“外包”密钥恢复。然而，有时存在强制性因素。当有法律义务向外部机构——通常是负责监管或执法工作的机构——提供密钥副本时，这就被称为\
  \ `key escrow`。“Escrow”一词借自法律，简单地意味着独立第三方保管资产。\n\n为什么当局对密钥托管感兴趣？在世界各地，随着越来越多的商业活动以电子方式进行，政府越来越担心其监控通信的能力。迄今为止，官方窃听几乎没有遇到\
  \ `technical` 问题。在法治健全的国家，通常会有立法限制允许进行此类拦截的情况。然而，现代密码学发展的一个后果是，这种情况被颠倒了过来。随着越来越多的流量被加密，即使法律允许，政府在读取这些流量时也面临巨大的技术问题。因此，他们一直在寻找使自己能够获取所需任何密码密钥的方法。他们提出的理由通常集中在追踪涉嫌与毒品贩运或洗钱有关的资金转移，以及调查逃税和欺诈的需要。一些不太友好的批评者则认为，政府可能还发展出了对其他国家企业的商业间谍活动的兴趣（Anon\
  \ 1999a）。\n\n这一领域的首次重大辩论始于 1994 年，当时美国政府引入了“托管加密标准”。该标准将体现在“Clipper 芯片”中。这些大批量生产的逻辑芯片将被纳入所有加密产品中，并将为其所有者提供高度安全的加密\
  \ *但* 带有所谓的执法访问字段。LEAF 不会直接透露加密密钥，但官员可以通过将 LEAF 与其他政府持有信息结合来计算出密钥。因此，LEAF 就像汽车钥匙上的参考号一样发挥作用（Dam\
  \ and Lin 1996）。企业和公民自由主义者一致对该提案提出强烈反对，最终该提案被撤回（Diffie and Landau 1998）。Clipper\
  \ 方法无论如何都会存在一些实际限制，因为该芯片主要设计用于在较低通信层执行加密的设备，而这并不总是使用它的最有效位置（参见 section 6.5）。\n\n\
  \n\n\n\n1997 年，英国政府的一份咨询文件提出了对托管（escrow）的一种新方法（DTI 1997）。在英国的方案中，密钥必须在收到“已验证的授权请求”后一小时内在线交出。该方案与美国的方案一样，因既压制又不可行而遭到广泛谴责。\n\
  \n政府还试图通过对销售和分销进行限制，防止加密软件落入“错误的人手中”。在美国，加密产品被定义为“军火”，并像坦克和导弹一样受到出口管制。由此引发了与计算机行业的激烈争论，因为供应商认为这些法规阻碍了他们向跨国公司和其他希望在全球建立安全通信的实体销售可信赖的产品。一些妥协已达成，但这些妥协主要集中在对较弱加密产品的豁免上（可以认为政府能够解密这些产品）。在其他地方，许多国家也纷纷效仿，对密码学的转让和使用施加限制（参见\
  \ 第 14.1 节）。\n\n## 7.5 公司间交易：EFT、EDI 和电子邮件\n\n如果一家企业对其内部网络拥有完全控制权，它就可以完全按照自己的意愿使用密码学和其他安全措施。如果它希望与其它组织安全地交换信息，则并非如此。在这种情况下，它很可能会发现自己的选择受到了其他方的偏好或能力的限制。例如，他们可能无法处理某些加密方法，或希望遵守由外部提供商（如\
  \ VAN）设定的标准。\n\n通常，企业对企业链接可分为三类：\n\n1. *电子资金转账*。EFT 消息只需包含与金额、账号等相关的少量基本细节。消息的接收方通常是银行（或者有人会认为，EFT\
  \ 消息参与了授权 ATM 发放现金）。EFT 消息的构造相当简单，但必须高度重视确保其在传输过程中不会被篡改并且得到完全认证。\n\n“电汇”式的资金转账可追溯到\
  \ 1871 年，当时美国的 Western Union 公司推出了这项服务。安全性依赖于公司内部使用的授权码系统。电汇的潜在弱点在 1978 年的 Security\
  \ Pacific Bank 诈骗案中被极其明显地暴露出来，当时一名在银行工作的承包商多次观察到员工使用资金转账程序，并记住了授权码。他利用这些知识向纽约的一个账户转账超过\
  \ 1000 万美元（Cornwall 1989）。\n\n今天的系统要复杂得多，并且由计算机驱动。SWIFT 组织提供了一项国际服务，用于银行之间发送金融指令，总部位于比利时的\
  \ La Hulpe。（它通常以缩写形式为人所知，但最初首字母缩写代表 Society for Worldwide Interbank Financial Telecommunication，世界银行间金融电信协会。）SWIFT\
  \ 的成员由全球约 6,500 家精选金融机构组成。对网络的访问受到严格控制，成员必须使用基于 SWIFT 严格制定的标准的加密。\n\n对于日常商业支付，多数国家都有服务可用于涉及相对小额的资金转账。这些通常是“批量”支付，例如在每周或每月末将组织所有员工的工资转入其银行账户。在英国，超过四分之三的劳动力现在以这种方式领取工资。使用此类服务的用户必须注册，并将被要求使用识别码和密码。然而，由于涉及的企业数量众多，管理加密的开销过大，因此加密被排除在外。\n\
  \n2. *电子数据交换*。EDI 为企业对企业消息提供了一套标准格式。例如，销售发票和预订确认等项目的內容和布局都有格式规范。（类似的格式也用于资金转账，因此\
  \ EFT 可被视为 EDI 的一个专门子集。）\n\nEDI 起源于 1980 年代的多个不同商业领域，最初每个行业都开发了自己的“方言”——用于汽车制造、航运、建筑、旅游等。欧洲和美国也曾一段时间存在不同的标准。所有这些标准最终都汇聚成了\
  \ UN/EDIFACT 规范（行政、商业和运输电子数据交换），该规范现已在全球使用。\n\nEDI 提供的一项效率是，其消息现在被许多商业计算机软件所识别。这意味着，例如，订单的详细信息可以直接传递到订单录入系统，或发货通知可以直接记录到仓库数据库。这种人类干预的缺失无疑加快了业务流程并降低了成本，但也去除了有时至关重要的人能够注意到消息中存在不合理或可疑要素的机会。\n\
  \n3. *电子邮件*。邮件消息完全自由格式。它们可用于传递业务信息和指令，但这些信息必须由人工阅读者（或也许是“智能”计算机程序）来解释。互联网上最常用的电子邮件格式是\
  \ SMTP（简单邮件传输协议）。基本的 SMTP 格式比 EFT/EDI 更简单、更通用，并假定其承载的消息仅为文本。然而，SMTP “扩展”此后已被发明，以使其能够承载其他类型的数据（见下文）。\n\
  \n原则上，电子邮件可用于发送从公司的秘密生产计划到最琐碎的小事的任何内容。除非企业愿意常规加密其电子邮件，否则唯一可行的政策是发布禁令，禁止使用电子邮件传输任何敏感信息。在此背景下，应记住不同类型的消息通常是“链式”连接的，例如\
  \ 图 7.3 所示的案例。在此示例中，一名在家工作的经理向办公室的一名职员发送电子邮件，其指令导致向银行发送了一条 EDI 消息。银行随后根据 *其* 指令作出回应，向供应商进行\
  \ EFT 付款。\n\n![Figure 7.3](img/fig7_3_B.jpg)\n\n图 7.3\n\n随着世界越来越依赖电子消息传递，发现这种链式连接——一条消息触发另一条消息——变得司空见惯。从安全角度来看，重要的是链中的所有环节都应获得相似程度的保护。例如，EFT\
  \ 消息可能因涉及现金转账而受到非常严格的控制。最终，如果一个有心的黑客能够伪造一封令人信服的电子邮件从而引发所有其他事件，这些控制措施就毫无用处了。电子邮件伪造并不特别困难，美国软件公司\
  \ Oracle 就为此付出了代价，当时一封据称由 Oracle 经理发送的电子邮件被引用在一项不公平解雇的索赔中。该邮件最终被证明是由提出索赔的前员工伪造的（Savarnejad\
  \ 1997）。\n\n\n\n\n\n企业可能会发现，安全策略也因使用互联网交换 EDI 消息的做法日益普及而变得复杂。对于希望以低成本进入数据网络的小型和中型企业而言，这是一种越来越有吸引力的选择（Tucker\
  \ 1997）。为了确保 EDI 消息在保持其特殊布局的同时送达，它会被“包裹”在电子邮件消息中，使用 SMTP 的特殊 MIME 扩展（其中 MIME 代表多用途互联网邮件扩展）。这使企业能够获得\
  \ EDI 的好处（例如，避免将详细信息重新输入其会计系统），同时也能利用互联网的廉价性和连通性。\n\n## 7.6 与公众交易：电子商务\n\nEDI 现在已证明对许多企业不可或缺，并已成为商业环境中被接受的一部分。大多数\
  \ EDI 交易都是在彼此知根知底的成熟组织之间进行的。除了能够通过公共注册和目录识别彼此外，各方通常会在安排开始时签署某种正式协议，以确定在 EDI 交易出现问题时各自的责任和义务。\n\
  \n另一方面，互联网商业发展的浪潮则集中在直接向消费者销售。在这种情况下，销售交易可能是双方之间第一次（也可能是唯一一次）接触。供应商希望从互联网获得两大关键优势。首先，它是一种廉价的销售媒介，全天候运行，可覆盖全球客户。其次，客户能够迅速做出并确认购买决定。因此，供应商对那些似乎威胁到这两大优势的安全措施持谨慎态度。例如，如果需要额外步骤来核实客户的资质，或付款方式过于繁琐，在线购物的吸引力就会开始消失。\n\
  \n事实上，若干因素需要有利地结合，互联网销售才具有商业可行性，而且在世界不同地区情况各异。例如，在拉丁美洲，消费者对在线支付系统特别不信任。这源于服务水平不佳的经历，以及企业对咨询和投诉普遍缺乏响应。信用卡服务也备受诟病，因为它们传统上不愿在出现问题时给予客户任何赔偿，例如信用卡被欺诈性使用或货物未送达。除了要与这种不利的舆论环境作斗争外，有意涉足网络交易的企业还必须克服一些技术障碍，因为电信服务昂贵且并不总是可靠，而且互联网服务提供商往往收取高额费用（Davis\
  \ 1999）。与此同时，在东南亚的部分地区，虽然已在电信基础设施上投入了大量资金，但互联网服务提供的发展却未必跟上步伐。因此，在印度，一些公司宁愿在美国设立网站，也不愿在本国设立（Chowdhary\
  \ 1997）。\n\n就控制和安全而言，互联网上出现的新型面向消费者的服务带来了三个特别的挑战：\n\n* *建立买方和卖方的资质*。信任问题是*双向*的。客户一旦停止浏览在线目录并下订单，供应商就必须信任客户提出的付款方式。与此同时，客户必须相信供应商有意愿和能力交付所订购的商品。双方几乎没有什么可依据的，除了通过互联网传递的信息。\n\
  * *在速度与安全之间取得平衡*。通过互联网交易的巨大吸引力在于其即时性和响应性。为了实现这一点，安全程序必须在“实时”进行，交易仍在进行中。任何引入额外检查的尝试，例如补充电话或传真消息，都会破坏这种即时性，并随之带走互联网的大部分吸引力。事实上，甚至一些号称“即时”的交易安全方法也被供应商抵制，认为它们太慢（见下文对\
  \ SET 的讨论）。\n* *小额交易*。从理论上讲，互联网应该是小额购买的理想媒介，特别是“数字”商品，如简短报告的文本或一段录制音乐。然而，传统的电子支付系统（如借记卡和信用卡）并不适合处理所涉及的小额资金。因此，人们正在寻找使电子支付变得容易的方法，适用于那种在传统购物之旅中会用零钱支付的小额金额。\n\
  \n第一个旨在解决上述至少部分问题的产品之一是 *Secure Socket Layer*（SSL）协议，它作为 Netscape 网络浏览器的功能引入。SSL\
  \ 通过作为流行互联网浏览器的一部分免费提供，很快确立了事实上的标准地位。自推出以来，它已得到进一步发展，版本 3 不仅提供消息加密，还能使用非对称加密密钥对发送方和接收方的身份进行认证。\n\
  \n随后微软推出了其 *Secure Channel Services* 产品，声称支持多种安全协议，包括 SSL。与此同时，*Secure Electronic\
  \ Transaction*（SET）协议也在推出，得到了包括 IBM、VISA 和 Mastercard 在内的主要商业公司联盟的支持。所有这些产品都在应用层附近工作，如\
  \ Figure 7.4 所示。\n\n![Figure 7.4 ](img/fig7_4_C.jpg)\n\nFigure 7.4 \n\n所有这些产品都提供类似的设施。它们中任何一个最终成为主导标准在多大程度上，将在很大程度上取决于商业和政治因素，以及它们的技术优点。SET\
  \ 是这些产品中最专业的，因为它专为在线信用卡交易而设计。乍一看，这似乎让它在主导电子商务的竞争中抢占先机。然而，并非每个人都热衷于看到信用卡成为互联网上占主导地位的支付方式。一些商业利益更希望使用替代方法，或许更独立于现有的银行系统。此外，SET\
  \ 还必须与为其设计的商户和发卡机构的抵制作斗争。SET 的第一个障碍是，必须说服所有客户在其个人电脑上安装软件，为他们创建“电子钱包”。每个客户随后使用该软件生成一对非对称密钥，公钥由认证机构（通常是发行信用卡的银行）担保。这确保了客户的正确认证，但也增加了营销和启动成本。金融服务业内部也出现了不安，因为单个\
  \ SET 交易虽然安全，但处理时间可能过长，令人无法接受（Lambeth 1999）。\n\n\n\n\n\n除了 `SET` 之外，还有许多其他方案采用了电子钱包的理念。在某些情况下，例如\
  \ `eWallet`，新功能会通过将代码下载到用户的 `PC` 中而自动不时添加。电子钱包反复出现的一个问题是，像生成和存储密钥，或添加功能升级这样的敏感操作，必须在控制不正式或不存在的机器上进行。普通家庭\
  \ `PC` 将可供家庭所有成员以及朋友和访客（包括校友）访问，其中一些人的计算机知识可能比居民更丰富。在这种环境下设计足够坚固以保持安全的软件绝非易事。由于钱包的访问将由密码控制，家庭内部也存在安全泄露的风险，一旦出现这种情况，整个安排就开始显得极不安全。\n\
  \n电子钱包是否会流行起来还有待观察。这是一个进入成本低的市场，但最终的幸存者只有在经历一系列激烈的领地争夺战后才会出现。除了推出和品牌推广电子钱包的问题外，供应商还必须提防可能使产品过时的技术变化。特别是，很可能直接面向消费者的互联网服务的扩展将基于新型工作站，与电视机或移动电话相连。拥有专为互联网设计且仅运行浏览器功能的工作站，可大大简化控制问题。\n\
  \n### 影响互联网支付系统的因素\n\n除了家庭中部署的技术类型外，还有几个其他因素会影响互联网支付系统的发展。拟议的支付系统通常可分为三类。\n\n####\
  \ 1. 对现有借记卡和信用卡支付系统的扩展\n在此情况下，客户继续与发卡机构保持账户关系，付款通过传输卡号获得授权，最好连同其他佐证细节，例如卡片到期日。处理卡支付必然涉及不同金融机构之间的协作。在信用卡的情况下，一家机构向客户发行了卡片，而另一家（通常称为商户收单机构）则与卖方达成协议，负责处理所有收到的付款的处理。商户收单机构将交易详情传回发卡机构，发卡机构从客户的信用卡账户中扣款。借记卡的工作方式类似，但费用直接记入客户的个人银行账户。\n\
  \n这些结算安排已在全球范围内建立并得到验证，并且已在互联网上定期使用。两个因素阻碍了其更广泛的使用。首先，与每笔交易相关的开销仍然相对较高，排除了卡片用于许多互联网卖家希望提供的那种高容量、低价值销售。其次，公众仍然担心通过互联网发送卡号。这种焦虑往往集中在客户与卖方之间通信的保密性上，尽管这不一定是薄弱环节。问题更可能出现是因为银行和商家未能强制执行对不完整或不一致的卡详情的常规检查。这在下一节中描述的一个案例中得到了说明\
  \ section 7.7。\n\n#### 2. 基于“电子现金”的系统创建\n在这种情况下，购买者不是使用卡号来授权对账户的扣款，而是向卖方传输一串比特。这些比特具有内在价值。这意味着结算立即发生，最接近纯粹基于信息的传统货币的等价物（如其替代名称\
  \ *digital cash* 所强调的那样）。客户使用支票或信用卡等传统方式从电子现金提供商处购买比特串，然后付款。\n\n电子现金方案只有在现金具备以下所有特征时，才能声称模仿真实货币（即普通纸币和硬币所具有的特征）：\n\
  \n1. *独立且便携*。每次交易发生时，现金发行方都不参与。\n2. *不可重复使用*。一旦现金被“花费”，它就会永远离开花费者的占有。\n3. *易于转移*。交接现金的过程快捷简便。\n\
  4. *可支付任意金额*。可以为客户花费的确切金额出示现金，或交出较大金额并收到找零。\n5. *可见*。客户很容易查明当前持有多少现金，或交易中正在转移多少现金。\n\
  \n已经推出了许多数字现金方案，但所有方案都在上述一个或多个方面暴露出不足。例如，由于比特串可以轻松复制任意多次，因此很难使电子现金不可重复使用。为了抵御电子伪造的企图，有必要检查某人是否试图重复使用同一比特串。这与其他目标相冲突，例如特征\
  \ (a) 和 (c) 所指出的那样。发行和使用大量小面额电子硬币也很麻烦，如果要实现特征 (d)，这是必要的。\n\nLynch 和 Lundquist 提供了对几种胚胎方案的调查（1996）。大多数方案最终都依赖于对传统方法的巧妙更新，并依赖于电子版的信用授权或支票支付。一种提供真正电子硬币的早期方案由\
  \ `Digicash` 推出，该方案还为付款人提供了匿名保证。`Digicash` 在 1998 年遇到财务困难，随后将使用其特殊加密方法的权利出售给西雅图的\
  \ `eCash Technologies Inc`（`ecash` 2000）。\n\n#### 3. 创建“电子钱包”\n与可加载到任何 `PC` 的电子钱包不同，电子钱包基于一种令牌（通常是智能卡），可以随身携带。安全机制内置于钱包中，例如，除非在销售时输入\
  \ `PIN`，否则资金无法被“花费”。在钱包中内置智能使其具有极大的多功能性。它可以兼作传统的信用卡或借记卡，其价值可以通过在专用终端“充值”来补充。正在开发小型便携设备以提供卡片价值的读出，并通过电信链路下载实现充值。在此类设备的帮助下，电子钱包可以提供与电子现金相关的全部五项功能。`Mondex`\
  \ 卡可能是最成熟的产品，已在世界许多地区进行了试验。该卡最初于 1994 年发行，已发展成为一个标准，以至于许多制造商可以提供“`Mondex`compatible”设备（`Mondex`\
  \ 2000）。迄今为止的试验包括加拿大安大略省圭尔夫市（`Campbell` 1998）、`McDonald’s Deutschland` 的快餐店（`Essick`\
  \ 1998）以及几所大学校园。成功往往在小型封闭社区中最大，因为可以在销售点安装必要的读卡设备的零售商“关键数量”可以被说服。\n\n\n\n\n\n为确保安全，智能卡中软件的标准需要得到支持，即现金如何加载到卡中以及特殊情况如何处理（例如，如果需要向客户退款）。欧洲银行标准委员会已代表其成员调查这些问题，并起草了若干标准（ECBS\
  \ 1999）。\n\n## 7.7 网络的监控与监视\n\n由于银行和商家无法依赖 SET 等保护机制的广泛采用，他们不得不转向其他方式来打击和检测互联网上的卡片欺诈。假设现有的卡交易处理安排足以应对电子时代的危险，已在估计影响\
  \ 22 个国家 900,000 名受害者的案例中得到强调。美国联邦贸易委员会的调查导致 1999 年 1 月发布了此处转载的新闻稿。\n\n这种骗局似乎组织良好，其细节由明尼苏达大学的\
  \ John Faughnan 博士拼凑而成（Wallich 1999）。Faughnan 博士确定了欺诈的五个主要要素。\n\n* *获取卡号*。犯罪分子无需拦截消息或入侵文件。由于\
  \ VISA 卡的格式规范和校验位计算是众所周知的，任何人都可以生成一份有效的 VISA 号码清单。这些号码会通过任何输入有效性检查，后者仅检查是否符合基本格式规则。\n\
  \n* *商家身份*。欺诈是通过申请并获得授权作为卖家接受信用卡付款的公司来操作的。在某些情况下，另一家公司将被用作所谓“销售”来源的幌子——也许甚至不知道骗局。这些销售公司将参与互联网上电子材料的交易，通常是色情性质的。\n\
  \n* *交易处理*。虚假交易的详细信息将通过正常的交易分拣流程发送给负责受害者账户的银行。一些卡号可能在分拣过程中被退回，其他则可能稍后被银行本身退回。然而，其中许多卡号得以通过，尤其是在某些国家/地区（这显然随后成为该计划的理想目标）。\n\
  \n* *设置账户扣费*。所有交易金额都很小（通常略低于 20 美元），按每月定期支付。那些通过筛选流程的交易现在将从银行向商家产生稳定的收入流。\n\n* *受害者的反应*。受害者会被阻止采取行动，因为美国的信用卡交易通常只有在金额超过\
  \ 50 美元时才会被赔偿，而且许多银行在 60 天后不再受理索赔。试图通过“供应商”寻求补救将遇到 FTC 描述的障碍。尽管如此，一些人似乎对自己被暗示购买了色情内容感到特别愤怒，这可能有助于增加向\
  \ FTC 提出的投诉数量。\n\n这种类型的骗局很容易由任何不诚实的商家在小规模上实施。然而，通过采取系统化的方法并协调多个参与者的努力，就有可能获得估计约为\
  \ 4000 万美元的利润。被发现的风险被保持在较低水平，因为任何主要参与方都无法获得完整而详细的事件全貌。如果只有极少数主导的卡提供商，这种欺诈的机会当然可能会减少，但在英国确实如此时，这种主导地位被认为会降低竞争并违背公共利益（MMC\
  \ 1989）。此外，由于欺诈具有国际范围，一个国家监管机构（如 FTC）很难将所有线索拼凑在一起，如果犯罪分子最终位于美国境外，它将缺乏管辖权。\n\n鉴于参与信用卡处理的金融机构数量众多，如果在处理周期中检查应在哪一步应用出现不一致，也就不难理解了。理论上，可以很容易地排除任何“发明”的卡号，通过将所有号码与实际已发行的卡清单进行核对。要求提供到期日期或持卡人姓名等佐证细节也会有所帮助，因为这些细节必须与虚假卡号一起编造，并且可能有助于暴露问题。当卡在商店的销售点终端上出示时，这些细节会被自动捕获，但在电话或互联网交易中必须明确请求。正如\
  \ FTC 案例所示，必须假定负责请求此类细节的一些商家可能积极参与欺诈。\n\n金融机构的另一项武器是体现*人工智能*的软件。它可以通过监控交易来“学习”正常活动模式，并挑选出可疑事件。这种软件已被证明在检测卡片滥用方面很成功，并被银行和一些国家\
  \ VISA 组织使用。该软件将审查与交易相关的多个因素，并为每个因素赋予权重。如果总和超过某个阈值，则交易被视为异常可疑。理想情况下，这应由发卡银行执行，因为它拥有个人持卡人正常购买习惯的记录，并且可以在个人层面寻找不太可能的消费模式。在国家或国际层面筛选大量交易不太可能产生成效，而且本案中描述的欺诈性\
  \ 20 美元扣费似乎已“溜过雷达”。\n\n组织可能需要在自己的专用网络上实施监控和监视；这将在第 13.4 节中进一步讨论。\n\n## 7.8 问题\n\n\
  1. 制药公司的一个研究部门雇用了 150 名员工。由于员工之间交换的大多数信息具有商业价值，公司希望强制员工对其所有内部通信进行加密。在这种情况下，您会推荐哪种密钥分发方法，为什么？\n\
  \n2. 您已被要求为您的组织选择一个证书颁发机构来负责密钥的身份验证。选择*四个*您认为对 CA 来说特别重要的功能或设施，并就每个功能写一份简要说明。\n\n\
  3. EFT、EDI 和电子邮件分别履行什么不同功能？假设您在一家组织工作，该组织大量使用电子邮件进行内部沟通以及与供应商和客户的沟通。起草一份一页的指导文件，供员工阅读，告知他们使用电子邮件的主要安全风险，并就他们如何采用最佳实践提出建议。\n\
  \n4. 解释在家庭使用的 PC 上持有的“电子钱包”是什么意思？设置和操作此设施的主要安全问题是什么？\n\n# 第八章 局域网和小系统的控制\n\nDOI:\
  \ [10.4324/9780203992319-12](https://dx.doi.org/10.4324/9780203992319-12)\n\n##\
  \ 8.1 引言\n\n\n\n\n\n网络技术为“虚拟”工作组开辟了许多新的可能性，其成员来自不同地点协作，可能除了通过视频会议线路外从未真正见面。然而，大多数人仍然在更传统的环境中使用计算机，坐在办公桌前，周围是来自其部门、科室或小型企业的其他人。计算机可能都通过局域网连接在一起，但通常规模足够小，以至于大多数用户彼此都认识个人。组织的<|message|>数据安全实践的根源就在于这种本地化、个人化的层面。\n\
  \n在这个层面上出现的情况可以很好地检验管理层对安全的更广泛承诺。例如，一名员工可能担心她的密码已被泄露，但她不知道如何更改它。或者病毒检查程序弹出了一条晦涩的消息，让秘书完全困惑，不知道该怎么办。或者总部机密的数字资料刚刚被发现放在网络化激光打印机出纸盘上的备忘录上。\n\
  \n经理应如何应对这类情况？让我们假设员工表现出负责任的态度，将问题公开。他们的未来行为将强烈受到其询问被如何对待的影响。如果他们被告知在琐碎问题上浪费时间，或者被痛斥计算机的愚蠢，或者只是被告知不要大惊小怪把问题带到别处，这显然会发出完全错误的信号。\n\
  \n即使反应更为谨慎，也可能无法掩饰一定程度的疲惫或不耐烦。在人力允许的情况下，反应应积极且表示赞赏，并应将问题的提出视为推广良好实践的机会。这并不意味着任何人应试图掩饰解决问题的烦琐。然而，如果经理表现出决心追查此事，并给予一定优先度，这将传达比任何安全简报或冗长办公室备忘录都更有力的信息。\n\
  \n本章关注所有在“最前线”出现的问题——在办公室或诊所或商店的日常工作中——并建议在这种环境中应如何最好地应用安全技术。\n\n## 8.2 管理本地工作组内的合规性\n\
  \n在接受了办公桌上放置个人电脑的正常性后，大多数办公室现在已将其视为理所当然，即它们应通过局域网连接。这一过程如此不引人注意，以至于一位顾问观察到：“我拜访过许多小型公司，他们甚至不知道自己拥有局域网”（Alexander\
  \ 1995）。\n\n桌面上的这种互联性为新的工作方式开辟了许多可能性。不应假设因为技术在各处都差不多，所以使用方式始终相同。在一端，一些（通常较大）组织安装软件来确定分配给每个组成员的任务，并跟踪他们所有的活动。这可以与更非正式的安排形成对比，在这种安排中，员工能够电子通信并共享设施，但仅在他们愿意时才这样做。后一种风格在大多数组织中占主导地位。帮助支持群体工作的软件，特别是更正式意义上的，通常被称为“群件”，其使用被称为计算机支持的协同工作（CSCW）。\n\
  \n当 CSCW 被组织起来以允许管理层审查和干预时，可能会导致员工产生怨恨，他们会觉得自己受到监视。这也可能导致被贬值和去技能化的感觉。这可能导致一种更受抑制、参与度更低的工作方式，人们急于遵循软件提供的提示，并担心其表现可能如何在软件记录中反映出来（McCarthy\
  \ 1994）。\n\n另一方面，如果协作是非正式的，可能会导致形成新的、非官方的安排，从而绕过先前已有的程序。这可能导致管理人员的 insecurity 感觉，因为他们不再“在循环中”。电子通信也有使人们对他人地位，特别是其资历或性别的认识降低的效果（Sproull\
  \ and Kiesler 1992）。\n\n在小型企业中，与大型组织中的部门相反，群体工作几乎总是更为轻松。这反映了小型企业创业者的文化，他们主要受“自己做老板”的愿望驱动，并将自主权视为比财富或地位更重要（Gray\
  \ 1992）。即使大型公司也可能希望“赋权”给本地工作组（也许作为业务流程再造的一部分）并利用其适应性。自主的小组在必要时可以快速而富有创造性地应对 unforeseen\
  \ 情况（Hutchins 1991），并且可以预期找到绕过问题的方法，而不是一切都“按部就班”。\n\n无论采用何种工作模式，一个可能的结果是人们对 IT 的依赖形式出现新的依赖。正如\
  \ Orlikowski（1966）所观察到的：\n\n> 不可避免地，工作越是技术中介化，且这种中介越有价值和有效，工作和工作者就越依赖于技术。依赖体现在两个方面：对硬件、网络、软件和数据质量可用性的物理依赖，以及对技术中包含的知识的心理依赖。前者可以通过各种备份机制、测试和审查程序来管理。后者更难以管理，因为它代表了一种心态。对于从未在没有技术的情况下执行过工作的人来说，这尤其成问题。\n\
  \nCSCW 不仅改变了人们工作的机制：它改变了他们对权威如何行使的感受，并在特别是在电子连接的同伴群体内部创造了新的社会压力。确保遵守信息安全措施对经理有若干影响：\n\
  \n* *IT 的均等化效应*。如果使用电子邮件发布指示或通知，请记住您的信息将与其他众多信息并列，屏幕上看起来都非常相似。它将不如，例如，鼓舞人心的讲话或个人信件那样令人印象深刻和有效。\n\
  * *IT 依赖*。管理良好的 IT 不引人注意，并被接受为“只是家具的一部分”。员工在意识不到的情况下依赖 IT。您为提高他们的安全意识，特别是关于数据可能丢失或损坏方面的努力，可能让他们觉得毫无意义，甚至有点偏执。\n\
  * *通过 IT 的监视*。如果员工感觉 CSCW 软件正在控制和监控他们的活动，他们可能会得出结论认为安全已得到妥善处理，并且他们无需进一步参与。\n\n##\
  \ 8.3 办公软件内的控制措施（1）：文书和行政应用\n\n\n\n\n\n安全功能经常在企业软件包的宣传材料中被提及作为卖点。然而，将竞争供应商的安全声明进行比较，比软件的其他方面要困难得多。例如，如果一个文字处理产品被认为提供拼写检查等日常功能，这可以迅速得到测试和验证。另一方面，关于该软件包在其文件系统中提供高度安全的加密设施的说法，可能得到各种标准、命名算法和其他技术数据的支持，但只有技术专家才能对其进行适当核查。\n\
  \n无论如何，供应商最多只能提供实施安全措施的手段。无论其*潜在*多么优秀，任何安全措施在未得到正确配置和激活之前都是毫无用处的。虽然购买一个具有五星级安全功能的软件包可能让人感到安心，但如果对其使用缺乏半心半意的承诺，这样做就毫无意义。事实上，这样的投资可能完全是浪费金钱。顺着这个类比，这就像入住一家五星级酒店，然后走出去在路边的快餐柜台用餐。\n\
  \n选择和安装办公软件中的安全功能变得更加复杂，这主要是由于软件的打包和营销方式。在个人电脑市场尤其如此，市场由一家供应商（Microsoft）主导，该供应商热衷于向每个人销售基于其办公和网络管理软件产品线的集成方法。竞争对手也有类似的雄心。一个结果是，用户发现自己承受着压力，必须建立一个工作组和网络活动都不可分割地交织在一起的系统。这符合供应商的营销策略，他们希望在桌面上“拥有”尽可能多的活动，并通过自己的专有标准将其扩展。安全在这种情况下可能并不总是受益，尤其是如果过分强调共享资源并使其“用户友好”。\n\
  \n### 1. ‘虚拟’文件存储\n用户被鼓励认为，保存在自己硬盘上的文件与保存在其他机器或互联网站点上的文件之间没有区别。用于从所有这些不同来源检索文件的机制被故意设计成看起来相同。这意味着人们不必学习任何新的程序来处理远程文件，并为他们开辟了全新的、令人兴奋的工作方式。与此同时，它也创造了一系列全新的安全风险。对安全问题的最佳解决方案往往就是彻底消除它，通过使人们无法访问自己机器之外的文件来实现。然而，软件越来越多地被设计为自我推销；用户会发现它内置了设施扩展方式的演示，以及订阅新产品和服务的邀请。至少，这会产生让用户获得更广泛访问权限的需求。在最坏的情况下，访问权限默认就已可用，甚至可能包括指向可下载全新程序和进一步营销材料的网站的指针。\n\
  企业面临的问题是，它不能假定设置新的办公软件包在安全方面必然是“万无一失”的。困境在个人电脑供应商提供预装办公应用的“即用型”系统的情况下尤其尖锐。这无疑节省了大量设置和配置时间。然而，预装软件的人试图使其适应广大客户群体的各种可能需求。由于他们希望客户在尽可能短的时间内开始高效使用个人电脑，因此他们的重点将放在消除障碍，并尽可能轻松地激活应用程序。\n\
  \n### 2. 过于热心的软件\n安全与便利之间的冲突可以通过许多其他方式显现。例如，“自动完成功能”是一种非常用户友好的设备，但它会削弱安全性，正如 Schifreen（1999）所指出的。自动完成功能会介入以完成它认为识别出的短语或地址。如果你在输入一个很长的网站地址时，自动完成功能会在你输入前几个字符后为你填入剩余地址，这可能很有帮助。但如果它也在请求你的\
  \ ID 和密码的面板中主动提供条目呢？Alexander（1996）给出了一个更离奇的例子。有一个特别“有帮助”的功能，如果密码输入三次不成功，就会弹出提示询问你是否愿意通过设置一个更容易记住的新密码来重新开始。\n\
  \n### 3. 自行访问控制\n供应商面临的一个问题是，在煽动了对完全联网办公的热情后，他们必须提供一种设置授权以限制人们可以看到和做的事情的手段。这意味着创建第\
  \ 4 章中描述的那种访问控制表。在老式的主机计算机上，这样的表由昂贵的高薪系统程序员设置和管理。供应商面临将此任务简化到可以由中等电脑素养的办公室主管处理的水平。\n\
  他们尚未完全成功。可以消除一些技术术语，并用在办公室听起来更熟悉的术语来代替。例如，对文档只有只读访问权限的人被称作“审阅者”，而“拥有”文件的人几乎可以做任何事情。即便如此，面对“发布编辑”与“发布作者”等术语时，有时有必要查看细则以了解每组权利的确切允许和不允许内容。\n\
  即使访问控制管理员能够弄清楚所有这些内容，然后就需要确保使用文档的每个人*也*理解限制是如何运作的。在许多情况下，他们需要这种理解，以便他们自己能够为自己创建的文档设置访问限制，并希望他人更新或审阅这些文档。为使其令人满意地运作所需的时间和精力不应被低估。相反，如果访问权限管理不善，人们只会通过在任何可以的地方互相授予不受限制的权限来绕过它们。这就成为一个潜在的“五星级”设施被变成一星服务的典型例子。\n\
  \n### 4. 标准保护，标准对策\n办公软件现在常规提供保护文档和文件的方法，通常基于在保存数据时输入密码。这种密码的问题在于，它们可能是临时选择的和输入的，很容易被遗忘。\n\
  一个尽责的用户会遵循关于选择晦涩、随机密码并每次更改的规则。这意味着大量业务数据可能最终被锁起来，受保护的密码被私下保存——也许并不系统化。情况与加密保护的文件类似（参见第\
  \ 7.4 节），对于加密，存在一种可能性，即如果加密密钥丢失，可以通过密钥恢复方案检索。\n\n\n\n\n\n设计一个安全且实用的方案来存储和恢复个人文件多年来使用过的密码，并非易事。因此，密码破解服务市场蓬勃发展也就不足为奇了；这些服务要么提供能够在流行产品中查找密码的程序，要么提供按件计费的服务，即将文件寄出（通常通过电子邮件）以解开其内容。例如，Office\
  \ 97 之前的 Microsoft Word 版本的文件，其密码保护就可以通过互联网上不到 100 美元的软件移除。现在出现了针对 Word 后续版本中引入的更强功能的服务，基于暴力攻击。\n\
  \n### 5. 删除——还是没删？\n对于已被“删除”的文件也会出现类似的困境。删除操作被证明是错误的的情况无时不有。大多数文件系统实际上并不会擦除文件的内容，而只是假装它已不存在。这意味着原始数据仍会记录在磁盘表面，直到该空间再次被需要并被新文件覆盖为止。实际上，这意味着数据在几个月后往往仍可检索。\n\
  \n理解这一原理的 DOS 用户可以通过使用 `UNDELETE` 命令轻松恢复文件。在 Windows 中，将文件发送到回收站后检索文件甚至更容易。在大多数情况下，这是一种有用且务实的解决方案，用户可以丢弃文件，同时知道在紧急情况下仍有很大机会恢复它们。然而，如果目标是消除数据的所有痕迹，例如\
  \ PC 即将被移交给不同所有者时，这种形式的“删除”完全不够。\n\n### 6. 剪贴板和屏幕抓取工具\n能够在不同应用程序之间传输数据是供应商宣传的“集成”办公软件的另一项优势。这可以大大加快编辑速度，例如，能够将电子表格中的图表直接传输到文字处理报告中。同样，在浏览互联网时“抓取”屏幕上出现的图像也可能很有用。不幸的是，这存在安全方面的弊端：一旦某物出现在\
  \ PC 屏幕上，就必须假定它可能流向几乎任何地方。‘提取’一段文本或图像并将其传输到电子邮件、磁盘文件或打印机实在太容易了。各种电子“剪切和粘贴”版本——无论是办公室使用的“官方”软件的一部分，还是从共享软件磁盘和网站获取的——都嘲弄了每个经典安全模型中的一条关键规则，即必须始终控制数据被操作的方式。\n\
  \n在许多基于 PC 的办公系统中还存在另外两个弱点，听起来有些深奥，但其潜在危险可能超过上述任何一种。首先应注意的是，如果文件由特定应用程序“拥有”，这并不能阻止其他软件也读取它们。特殊的文件搜索产品，通常由审计员使用，会查看任何类型的文件，并尝试以某种有意义的布局在屏幕上排列其内容。即使没有此类产品，仅将文件作为文本文件打开，在记事本或文字处理功能中打开，也能很好地了解文件包含的内容。这使得任何人都可以浏览文件内容，即使他们通常无权访问创建它们的应用程序。特定的目标可能是电子日记系统中创建的记录，或他人的电子邮件信息。\n\
  \n理想情况下，所有此类敏感文件都应以加密形式保存。办公产品有时会提供加密选项，但质量参差不齐。特别是，如果软件创建自己的内部密钥，而不是要求用户提供密码短语，则加密的价值可能有限。否则，有可用的软件包可以收紧\
  \ PC 上的访问控制，使任何未经授权的用户更难浏览硬盘。\n\n第二个主要漏洞涉及密码。每个应用程序都会有一组文件，通常位于其自己的目录或子目录中。其中一些包含程序代码，而另一些则记录程序需要引用的控制信息。这些文件可以像其他文件一样浏览。窥探者对那些因程序活动而被更新的文件特别感兴趣，而不是自程序发布以来未发生变化的静态文件。找到更新的文件很容易，因为每个文件名旁边都列出了最后更新的日期和时间。\n\
  \n更新的文件之一将包含当前密码。大多数供应商会以某种方式伪装这些密码，但他们的努力有时有点敷衍了事。这是因为他们知道迟早会接到客户的痛苦电话，该客户丢失了主密码，从而将自己锁定在对业务运营至关重要的数据之外。唯一务实的解决方案是使密码检索困难，但不要\
  \ `too` 困难。这对真正决心的黑客来说是个好消息。\n\n密码保护 `can` 变得极其安全。一种方法是不要以明文形式将个人密码存储在硬盘上，而是将其转换为哈希。众所周知，哈希会将文本转换为无意义的位串，并且只能单向工作，因此不可能逆向哈希过程以恢复密码。当软件处理登录时，它会向用户请求密码，并立即对其进行哈希处理。然后它将结果与控制文件列表中存储的哈希进行比较。只有当两个哈希相同时，用户才会被授予访问权限。\n\
  \n这让黑客的生活变得困难，但哈希列表仍然容易受到有决心的攻击。例如，如果相关应用程序软件是广泛可用的软件包，就有可能对其进行实验并生成可能的密码及其对应哈希的列表。这将是一个很长的列表，但如果黑客将其全部放在便携式计算机上，存储和搜索它并不是一个大问题。为了挫败这种攻击，哈希计算中增加了一个额外的变化，即将密码与“盐”一起进行哈希。盐是软件其他地方隐藏的随机数。\n\
  \n安全文献中经常出现发现的狡猾技巧，这些技巧可用于从软件中获取密码。其中一个更令人惊讶的例子涉及备份实用程序，该实用程序在首次安装时，会将操作系统的主密码保存在任何人都可以轻松访问的文件中（Hancock\
  \ 1999）。虽然这是一个相当深奥的主题，但密码保护是应始终与供应商提出的问题。任何弱点都会为攻击者打开获取具有高级访问权限的密码的途径，从而拥有广泛漫游的权力，造成大量损害和混乱。\n\
  \n## 8.4 办公软件内的控制措施（2）：会计应用程序\n\n\n\n\n\n会计信息以各种形式呈现，对组织内部和外部的广泛人群都很重要。其可信度源于规范其收集和处理的会计惯例。这些惯例常被视为针对欺诈行为的尝试而设立，但它们同样关注防止记录以粗心或不一致的方式保存。目标是会计系统的输出应始终如实、公允地反映组织所进行的全部财务交易。\n\
  \n### 访问权限和安全\n\n要实现这一点，至关重要的是访问权限必须审慎分配。某些用户可能只需要能够读取特定的分类账条目，而几乎不需要其他权限；而在另一极端，审计团队必须能够深入到系统中经过的任何交易的细节。因此，会计软件供应商通常会提供丰富的<|message|>安全功能。与其他软件一样，这些功能仅靠存在是无法完成工作的：它们必须根据组织的需求进行评估、配置并投入使用。\n\
  \n设置访问控制表时常见的困难在于，第一次尝试必须在系统全新且不熟悉时进行，而没有人完全了解所有功能的工作方式。因此，很难确切知道应分配哪些访问权限；人们往往不愿将太多功能排除在太多人之外，以防万一需要。\n\
  \n随着时间的推移，这一问题会因以下情况而加剧：使用软件的初级员工在日常使用中，对其运作的许多方面比上级了解得更透彻。此时，可能没有人会想到要做任何欺诈行为，但人们可能会出于好奇尝试任何可访问的功能。从这里，典型的欺诈模式可能会发展起来。用户看到了一种欺骗系统的可能方式，并进行几次试探性实验。如果这些实验未被察觉，就为更系统地发展欺诈打开了大门。\n\
  \n因此，一切似乎运行顺利并不意味着访问权限设置正确。访问控制表应每隔几个月审查一次，并应向员工解释，某些访问权限被移除并非对其诚信的任何否定，只是现在意识到它们对工作并非必需。\n\
  \n### 对会计系统的威胁\n\n与此同时，应注意不要过于专注于人们普遍认为的会计系统威胁，即贪婪或不忠的员工以狡猾的方式将资金转移到个人银行账户，或安排向同伙发送“免费”商品。还应关注以下等威胁。\n\
  \n* *企业欺诈*。这是个人员工实施欺诈的反面。所有基本交易都可能被正确录入，但组织的高层合谋篡改数据，直至公布的账目。或者，员工可能被故意蒙在鼓里，不知道他们被要求执行的交易真正的含义，这一手法曾为已故的罗伯特·麦克斯韦所青睐（Bower\
  \ 1991）。这对怀疑有问题的初级员工来说尤其困难，因为他们必须在“吹哨人”与可能面临的后果之间权衡：（另见 第 3.7 节）。\n* *软件故障和错误*。编程需要细致入微的关注，有时结果印证了业界的说法，即“程序做的是你告诉它做的事，而不是你*想要*它做的事”。Neumann\
  \ 对许多、常常是怪异的编程错误的回顾见于 (1995)。错误不一定必然出现在会计系统本身。一家英国公司引入了计算机化库存管理系统，发现其提供的错误信息导致其销售成本少计了\
  \ £800,000（Anon 1994）。这种类型的缺陷，即错误在相当长的时间内累积且未被察觉，是对企业财务健康最严重的威胁之一。\n* *人为错误*。输入控制可以捕捉到部分，但并非全部录入数字时的错误。错误也可能在系统最初设置时发生，特别是在会计科目表以及为识别产品、人员等群体而分配的其他代码方面。自动生成的分录也可能成为麻烦的来源。例如，资产价值每年可能减少以计提折旧，或定期向供应商付款。危险在于，这些自动计算可能被设置运行时间过长，或在错误的时间运行（例如按月而非按年）。\n\
  * *系统中的容差*。良好会计系统的目标是提供完全平衡、没有误差余地的数字。然而，在某些行业，发现差异是相当正常的，即使理论上两组数字本应完全相同。典型的零售商店就是一个例子。后方记录为已收到的商品*应该*与前方收银台记录通过的商品完全匹配。实际上，会存在一些损耗，即货架上的少量商品会常规性“消失”。只有通过监控和基准比较这些差异，管理层才能确定它们在多大程度上是由于测量中的正常误差（例如按重量出售的散装商品，或未记录的商品不合格或损坏情况），而非顾客或员工的故意盗窃。\n\
  \n在某些情况下，差异可能为揭露更险恶的问题提供关键线索，正如劳伦斯伯克利案例所说明的。\n\n### 更正分录\n\n如果要在账目中解决差异，重要的是必须通过适当的交易来完成。例如，交易在当时存在不确定性的分录可以放入“暂记”账户。如果随后发现该分录应归属其他地方，应通过从一个账户到另一个账户的明确转账来移动金额。同样，坏账或丢失或损坏的商品的核销也应始终通过额外的交易来完成。\n\
  \n其推论是，分类账中的分录绝不应通过直接修改来“更正”。软件包在正常操作期间会阻止这种情况，但可能仍包含直接编辑分类账的设施，通常作为最后的手段，以防出现无法以其他方式解决的重大问题。此类设施应禁止所有人使用，除选定的少数人外。即使是合法用户也很容易犯错导致账目混乱，绝对不应给任何可能怀有不良意图的人提供任何机会。\n\
  \n\n\n\n\n供应商在确定何时以及如何记录审计追踪所需的资料时，也面临着在安全性和实用性之间取得平衡的类似问题。（在会计术语中，审计追踪不仅仅是计算机保存的事件日志。它包括从头到尾追溯业务流程财务方面的所有电子和纸质文件。）供应商首先必须决定在计算机上保留多少追踪信息（因为详细的追踪会占用大量存储空间）。追踪数据本身必须得到保护（特别是防止任何人以上一节所述的方式浏览文件）。在某些情况下，交易相关的打印报告可能被要求作为审计追踪的一部分。很难将其设为绝对强制，因为打印机容易出现故障。另一方面，如果要提供覆盖功能，则该功能本身也需要严格控制。\n\
  \n## 8.5 病毒、下载以及网络个人计算的其他危害\n\n病毒防护是一个很好的例子，说明基层每个人的积极参与是必不可少的。现在有许多优秀的防病毒产品，但它们都会给用户带来一定程度的不便，例如在等待软件运行检查时，或响应其警告信息。员工在任何情况下都不应忽视防病毒软件发出的警告。否则会给自己和组织中的其他人带来中断。\n\
  \n计算机病毒是微型计算机程序，旨在自我复制并造成损害。它们与生物病毒具有许多共同特性，但在一个重要方面有所不同，那就是它们没有任何“自然”属性。它们是由程序员构思出来的，而这些程序员大多身份不明。他们的目的是在商业和个人计算世界中引入一种“细菌战”。\n\
  \n编写病毒代码与任何编程一样都提供了一个技术挑战。然而，在这种情况下的额外转折是，编写者必须制作出一种能够在明确不欢迎它的系统中存活的东西，并且仍能找到造成损害和自我传播的方法。毫无疑问，这代表着一个有趣的挑战，尽管它相当扭曲且反社会。\n\
  \n病毒编写者寻求实现四个主要目标。\n\n* *病毒必须能够附着于流行格式的程序*。微软在全球 PC 上使用的软件产品中取得主导地位所付出的代价之一是，该公司的产品已成为病毒编写者的主要目标。理论上，病毒可以针对*任何*软件产品编写。然而，如果病毒影响的软件仅被少数人使用，尤其是他们从不相互通信，那么病毒将没有机会传播。另一方面，MS-DOS、Windows\
  \ 和 Office 系列产品的用户不断通过软盘和电子邮件附件相互发送文件。这使得病毒更容易在用户社区中传播，从而导致感染“流行”。\n* *病毒必须能够自我复制*。抵达系统\
  \ A 后，病毒会设法找到一种将其转移到系统 B 和 C 的方法。网络链接对此目的尤其有帮助，并且已被 Melissa 和 Explore.zip 等病毒非常有效地利用。\n\
  * *病毒应难以被检测*。对于早期的病毒编写者来说，这意味着尽可能保持代码尽可能短。程序占用的空间远不如今天的机器那么多，快速扫描可执行文件就能发现任何突然且神秘地变大的程序。软盘的引导扇区也是放置病毒的热门位置，因为其空间非常有限，可以让病毒从一台机器传播到另一台机器。现代软件在存储需求上变得更加奢侈，其组件可能分布在多个不同目录中，因此很难发现这里那里多出的几百字节。\n\
  \n避免被检测是病毒编写者与防病毒软件提供商之间持续的智力较量的一部分。编写者无法避免在代码中留下明显的序列，而防病毒扫描程序会寻找这些序列。然而，编写者可以通过每次复制时让部分代码略有变化，或将其隐藏在主机软件的隐蔽且难以访问的角落来试图混淆视听。\n\
  * *病毒应能引起注意*。这似乎与前一个要求相矛盾，但如果病毒不携带某种“有效载荷”，就毫无意义。如果受害者幸运的话，病毒最多只是发送一条幽默或政治性的信息，或对文档进行一些令人恼火但易于纠正的更改。更严重的病毒会销毁整套文件，或随机更改文本中单词的顺序（这相当于销毁它）。它可能会干扰软件的行为，例如使\
  \ PC 突然确信软盘驱动器已不复存在。非常经常，*围绕病毒可能影响的不确定性*本身就是一种损害。几乎不可能检查典型办公 PC 中保存的*所有*文件，以查看是否有任何异常。\n\
  \n对病毒的防护应不仅仅是安装一些防病毒软件。员工首先应被明确告知使用该软件是强制性的，并且他们需要遵守其他措施，包括：\n\n* *禁止“娱乐”软件*。为了避免被视为扫兴者，管理者必须坚持不允许在办公机器上加载任何未经授权的软件。这包括看似无害的项目，如屏幕保护程序、字体、剪贴画集以及对操作系统的“有帮助”添加。引入完全不合适的程序，如电脑游戏或未经授权的网络浏览器，应被视为严重的纪律问题。\n\
  * *维护备份副本*。文件和某些程序的备份副本将用于灾难恢复（参见 section 9.4）。无论此要求如何，都应定期制作所有重要文件的本地副本，并且应始终有一种回退途径来生成软件（也许使用供应商提供的原始磁盘）。某些病毒会在几分钟内销毁整个硬盘的内容，并且无法逆转这种损害。\n\
  * *使用软件的中央副本*。局域网上的文件服务器可用于存储常用软件的“干净”副本，并对其进行特别严格的保护。然后将用户的机器设置成定期自动从该中央源刷新其副本，也许每次机器通电时。即使用户的机器确实被感染，感染也会在被干净副本覆盖时被清除。\n\
  * *限制 Internet 活动*。一些网站充当病毒的传播中心（通常声称这是出于“教育”原因）。即使没有下载病毒的意图，也可能因意外或遵循网站上的恶作剧说明而发生。如果员工因工作需要访问\
  \ Internet，他们应被指示绝不同意下载程序，并将任何下载的文件通过病毒检查器进行检查。这应适用于即使是最信誉良好的网站（作者曾从一个官方数据安全网站检索到一个感染文件）。\n\
  \n\n\n\n\n病毒是最常见且最广泛经历的数据安全事件原因。在大多数情况下造成的损害很轻微，但宽松的程序与坏运气结合起来，可能导致整台 PC 或 LAN 完全混乱。\n\
  \n由于病毒攻击的概念现在已为大多数人所熟悉，人们想出了各种诡计来利用他们的恐惧。其中常见的一种是电子邮件信息，警告称通过电子邮件传播一种极其危险的病毒：如果用户收到包含特定标题信息的邮件，决不能打开它，因为\
  \ PC 的硬盘将立即严重损坏，等等等等。这些警告通常被呈现为源自某些权威来源，例如 IBM 或 Microsoft 或官方机构。收件人被敦促将警告转发给他人。这些信息大多是恶作剧，目的是让很多人担心，并产生大量无意义的电子邮件流量。员工应被告知绝不要转发此类信息，除非也许转发给有能力评估信息是否真实的\
  \ IT 部门人员。\n\n其他危害不断出现在互联网上。其中一些是规模和复杂程度各异的恶意程序，使原始的 DOS 病毒看起来非常原始。这里描述了一些例子。\n\n\
  ## 8.6 规范互联网的使用\n\n安装互联网连接，无论是通过组织网络的一部分的网关，还是通过直接连接到 PC 的电话线，现在都是一项相对简单的任务，可以在几分钟内完成。在授权此类连接之前，管理层应确信它将是有用且必要的。否则它将制造大量危害，却毫无意义。\n\
  \n一种可用的控制选项是使用过滤机制，限制 PC 用户可以进行的活动。这一领域的主要倡议来自学校和家长组织，他们担心儿童能够从互联网上检索“成人”材料。一个例子是\
  \ Internet 4 Families（见 Figure 8.1）。\n\n![Figure 8.1 ](img/fig8_1_B.jpg)\n\nFigure\
  \ 8.1 \n\n企业可能希望使用类似的筛选方式，以防止员工通过办公设施浏览不合适的网站。筛选可以通过多种不同的方式进行。\n\n* 检查可以基于网页头中包含的类别代码。对此类代码的标准已被提出（“互联网内容选择平台”，或\
  \ PICS）。然而，这取决于网页提供者广泛合作并包含代码，这并不总是能实现。\n* 可以依赖商业提供的“过滤列表”。这是一个网站地址列表，会不断更新，以包含提供商认为应被\
  \ *排除* 的所有网站的内容。这可以与在私人电话交换机中设置“禁止”电话号码列表相比较。\n* 供应商正在开发“智能”过滤器，它们检查传入的图像并寻找可疑特征，例如肉色比例过高。这可能会捕获更明显的色情形式，但始终存在风险，即它也可能反对董事会成员的数字化肖像，而这些肖像急需纳入年度报告中。此类程序还必须能够处理图像传输的许多不同格式（包括视频和各种图像压缩形式）。\n\
  * 如果对互联网的合法使用预计仅限于少数几个网站，则可以指定这些网站为唯一要 *包含* 的网站。\n* 过滤也可以应用于从 PC *发出* 的消息。通常，用户产生的向互联网发出的流量很少，与作为回复发送的兆字节的屏幕图像和\
  \ Java 代码片段相比微不足道。这种传出流量可以针对网站地址或发送到搜索引擎中的关键词进行筛选。这种方法困难之处在于识别“违规”关键词。许多网站对性和暴力使用非常含糊和委婉的提法。\n\
  \n在与传入电子邮件相关的保护中也可能寻求额外保护，其中不受请求的“垃圾”消息很容易超过收到的合法消息的数量。筛选再次可以基于允许所有消息通过，除非它们源自禁止列表中的地址，或仅接受来自批准列表中的地址的消息。对于许多组织而言，后一种方法并不太可行，特别是如果它们依赖来自以前未知地址的电子邮件查询作为新业务来源。\n\
  \n供应商现在还提供可以“智能”扫描电子邮件的软件。这可以避免一些列表维护问题，但其使用也可能引发难以处理的伦理问题，这些问题在 section 13.6. 中进一步讨论。\n\
  \n## 8.7 问题\n\n1. 你是二十名秘书和行政人员的办公室经理。你的员工通过 LAN 进行网络连接，通过该网络他们可以使用公司的电子邮件服务。他们无法访问互联网。写一份备忘录（约\
  \ 500 字），为员工提供有关如何防范病毒感染的建议。包括在检测到病毒时应采取的行动的参考。\n2. 解释计算机支持协作工作的引入如何可能改变员工与管理层之间的关系，特别是在合规和控制问题方面。\n\
  3. 一款会计软件广告称其包含“现代企业可能需要的一切控制”，并继续说“设置控制既快又简单，可以在几分钟内由没有任何系统使用经验的人完成”。解释为什么你可能会怀疑这些说法的真实性。通过描述一种产品可能难以兑现其承诺的控制类型来说明你的答案。\n\
  4. 你刚刚安装了一款新软件包来支持你小型企业的活动，该企业是一家位于城市商务区的旅行社。你可能希望对软件中的以下功能施加哪些限制，为什么？\n    * 软件手册建议可以从互联网网站下载该软件包的定期升级。网站地址已提供。\n\
  \    * 手册还解释了，如果客户取消预订，有一个命令会立即从系统中删除客户的所有详细信息和预订。\n\n# 4 业务连续性和归档\n\n## 第四部分介绍\n\
  \n本书前面（在 Chapter 2）提到过处理风险的问题，其中潜在损害极其严重，但概率非常低。在这种情况下计算年度损失期望值总是会得出一个适中的数字，这本身并不太令人担忧。然而，每个人心里都会有这样的想法：如果损害\
  \ *确实* 发生，其影响可能是毁灭性的——甚至可能导致企业倒闭。\n\n\n\n\n\n第 4 部分更详细地考察了出现这种情况的两个具体实例。首先，信息系统发生灾难性事件从而使组织无法运作的可能性虽小但真实存在。如果这种故障只持续一两个小时，可能很快就能追上积压的工作，并通过简单的道歉恢复客户好感。另一方面，如果中断看起来可能持续数天，公司很快就会为生存而战。\n\
  \n业务连续性规划（BCP）关注的是对可能摧毁业务的灾难进行“思考不可想象之事”。BCP 不仅关注信息系统，但信息系统通常位居议程之首。必须将努力集中于试图减轻灾难造成的损害，并使替代设施能够投入使用。在后一种情况下，至关重要的是要有一份经过充分测试的灾难恢复计划，并且能够在瞬间启动。\n\
  \n高影响低概率风险的第二个例子见于电子归档领域。记录保留政策应确定记录保留多长时间。然而，如果记录存储在光学或磁性介质上，不能假定它们将无限期可读。经过数年后，证明某份记录确实由特定部门或个人创建也可能很困难。也许只有少数记录需要检索，但如果需要，它们可能在诉讼或监管听证中发挥关键作用。如果其真实性很容易被否定，保留它们所花费的努力和费用就白费了。\n\
  \n这些事件发生的概率非常小；但忽视它们并不会使它们消失。对于大多数组织，特别是对信息系统高度依赖的组织而言，BCP 和电子归档都应被视为重大的战略问题。\n\n\
  # 第九章 业务连续性\n\nDOI: [10.4324/9780203992319-14](https://dx.doi.org/10.4324/9780203992319-14)\n\
  \n## 9.1 引言\n\n1989 年 9 月，飓风 Hugo 摧毁了南卡罗来纳州的大部分地区。18 人死亡，该地区造成的损失估计约为 50 亿美元。对该地区\
  \ 41 家公司的后续研究显示，其中 23 家在计算设施方面没有任何应急计划。其中 20 家报告称计算机服务中断了 1 至 16 天，其余公司中断时间更长，最长达\
  \ 4 个月（Cerullo 和 McDuffie 1991）。\n\n在近年，IT 服务“灾难恢复”的重要性已得到广泛认可，它已成为企业能够承受各种重大挫折的能力的更广泛关注的一部分。该通用领域被称为“业务连续性规划”或“业务连续性管理”。现在已普遍接受，这需要涉及企业的几乎每一个方面。根据一份官方指南：\n\
  \n> BCM 的政策几乎肯定会与其他领域的政策重叠，应注意确保 BCM 政策与其他业务和技术政策相兼容。\n>\n> CCTA 1995: 16\n\n然而，本章仅关注可以采取的措施以确保\
  \ IT 服务的连续性。这些措施当然必须与为业务连续性规划所需进行的许多其他评估和活动并行。同时，BCP 的 IT 元素也提出了一些在其他领域不太可能出现的特定挑战；例如：\n\
  \n* 很容易陷入运营和管理数据丢失且完全无法替代的情况。同样适用于组织专门委托或改编的任何软件。很少有其他主要资产能如此迅速、彻底地被摧毁。\n* 随着“直接”面向公众服务的增长，IT\
  \ 设施的丢失可能极其明显，因而非常尴尬。这反过来又可能迅速转化为负面宣传浪潮，以及严重的客户信心丧失。\n* 即使有可能让 IT 服务“恢复上线”，在保持本书其他地方所述的所有检查和控制的同时做到这一点也很困难。在故障之后，管理层在恢复服务的同时，必须同样关注保持控制。\n\
  * 实施 BCP 不仅增加了运行 IT 服务的开销，而且在某些情况下，还会直接与其它安全要求冲突。例如，定期备份数据会创建数据的多个副本，从而增加访问控制的问题。\n\
  \n为每项 IT 服务开展 BCP 绝非易事，且不能没有高级管理层的全力支持。这并不意味着许多想法不能同样适用于本地或个人层面。即使组织已很好地掌握了 BCP，也可能值得查看办公室中的单个系统，并考虑是否可以采取进一步措施，以最大程度地减少更本地化灾难可能造成的任何中断。\n\
  \n## 9.2 对业务连续性的威胁\n\nBCP 包含两种截然不同的准备类型。首先，是识别那些可以被*避免*的威胁。例如，将计算机中心设在易受洪水影响的河流附近的地下是不明智的。同样，至关重要的电子记录可以通过将其置于只读介质上来保护，以免任何人意外覆盖。其次，是那些永远无法完全消除的更顽固威胁。在这种情况下，唯一可行的选择是假设最坏情况，并着手决定如果威胁出现时可以做什么来*加快恢复*。\n\
  \n在任何一种情况下，第一步都是尽可能列出最全面的威胁清单。在此阶段，不应因其过于离奇或微不足道而丢弃任何内容。生活总有习惯性地抛出大多数人都不愿想象的情况，如以下示例所示：\n\
  \n“横向”思考的初始练习可能是以下之一：\n\n* 通过完全不同的路线为计算机引一条额外的电源供应。这确保了即使其中一条供电线路受损，例如承包商在附近挖路时，也仍有电力可用。\n\
  * 安装应急电源，可在正常电源失效时立即接管。\n* 制定安排，以便计算工作能迅速转移到另一栋建筑中的另一台计算机。\n\n这三个选项在 图 9.1 中有所说明。\n\
  \n![Figure 9.1 ](img/fig9_1_B.jpg)\n\n\n\n\n\n图 9.1 \n\n通常，消除威胁源是最困难的选择。不幸的是，往往会有完全超出组织控制范围的因素在起作用。奥克兰、新西兰的电力供应就是这种情况\
  \ [见第 203 页所述]。其他例子包括油轮在相邻高速公路上泄漏有毒化学品、飞机从天上掉下来，或在共享建筑的另一部分发生火灾。\n\n如果威胁实际上无法阻止，可能可以消除其影响，或至少将其降到最低。例子包括提供可在立即激活的替代\
  \ IT 设备，或自动释放惰性气体以扑灭火灾。\n\n然而，如果一切都失败了，组织将不得不重建其 IT 服务，也许是在完全不同的地点。在最坏的情况下，其场所可能遭受如此严重的破坏，以至于别无选择。即使损坏只是部分性的，最快恢复服务正常的方式可能仍然是重新开始。所有这些类型的决定都必须在灾难恢复计划中预先考虑，该计划在\
  \ 第 9.5 节 中进一步描述。\n\n## 9.3 处理器、节点和终端的物理保护\n\n物理保护主要关注消除或防范可能的损坏 *源*。最初，这些被认为集中在极端天气条件、意外爆炸以及保险公司将其归类为“天灾”的其他不频繁但灾难性的事件上。多年来，经验使企业将人类恶意攻击也加入了名单。虽然在今天的气候下很难想象，但在计算机新颖且相对稀有的时代，公司经常通过将其安装在从街上可以看到的地方，或为访客设立专门的参观区来炫耀其享有盛誉的采购。如今，这种做法将被认为极其天真。保护任何类型的计算机安装的首要规则是，不应有任何以任何方式宣传其存在的东西，并且它通常应尽可能不引人注目。\n\
  \n还可以采取其他更明确的步骤来防止蓄意破坏。对任何主要 IT 或电信综合体的访问应通过通常的方法进行控制，例如所有入口旁的刷卡、生物识别或键盘。妥协有时是必要的，因为虽然受限区域必须难以进入，但在火灾或炸弹警报发生时，必须易于逃离。\n\
  \n分散的 IT 设备访问控制起来可能更困难，并且容易被忽视。这可能是因为计算机设备是在事后才添加到原本为其他用途而布置的办公空间中。因此，办公室局域网的主服务器可能最终与文具储物柜相邻，只是因为这是能找到的唯一位置。然而，这会使其容易受到物理损坏，以及各种类型的黑客攻击：请注意，即使服务器的显示单元在不同的房间，攻击者也可以轻松插入另一个显示单元，或通过机器背面的插座连接其他监控设备。即使无法使房间安全，也应有可能用某种可锁定的外壳将服务器围起来。\n\
  \n设备也需要妥善防范“自然”灾害。在办公大楼内，最常见的威胁来自火灾和洪水。火灾造成的损害可能有多种形式：\n\n* 设备本身可能起火。如果布线不专业，或允许垃圾在设备所在的机柜内或下方堆积，则尤其可能发生这种情况。\n\
  * 存储介质可能易燃。Sherwood（1992）描述了英国原子能管理局的一项实验，其中一架磁带架被故意点燃。房间内没有其他设备。实验本应进行 20 分钟，但由于火灾产生的热量开始对建筑结构造成损害，不得不在\
  \ 12 分钟后放弃。\n* 火灾在楼下或甚至相邻建筑物中爆发产生的热量足以熔化或变形磁性介质，或对逻辑芯片造成严重损坏。\n* 被吸入 IT 设备的烟雾可能造成损坏，特别是如果它沉积在磁性或光学磁盘表面。\n\
  * 即使是通常防火的设备，也可能因纵火攻击而受损，如果攻击者向其倾倒易燃材料，或故意短路电气连接。\n\n火灾还可能间接造成破坏，如果试图用泡沫、喷淋装置或水管将其扑灭。水基灭火器绝不应用于电气设备，但在办公室内挤满\
  \ IT 设备而发生恐慌的情况下，这一规则可能会被遗忘。也不排除水会渗入的风险，因为在共享建筑中 *其他人* 的喷淋系统被激活后，水会渗入。\n\n洪水通常被描绘成大量水从超载的河流流出，或是强降雨的其它影响。然而，建筑物也可能因附近自来水管、排水管和下水道的泄漏而遭受同样严重的破坏。内部水管几乎出现在建筑物的任何部位，因为它们沿着墙壁和天花板布线，为水槽、厕所、中央供暖散热器和喷淋系统供水。不幸的是，通常很难确定所有这些管道的确切位置。无论如何，缓慢的泄漏可以通过各种意想不到的途径向下渗透到建筑物中，并累积造成相当严重的洪水，尤其是在周末或其他假期期间无人察觉时发生。\n\
  \n其他自然危害将因当地情况而异。例如，在世界许多地区，地震构成威胁。许多领先的美国计算机公司在“硅谷”设有工厂，硅谷位于加州圣安德烈亚斯断层之上。当 1989\
  \ 年 10 月该地区发生大地震时，其中几家公司以及旧金山的企业都遭受了中断（Foremski 1989）。一家位于煤矿区的英国设施已将其列入可能危险清单中的地面沉降。必须考虑异常天气条件的可能性，包括雷击和龙卷风等怪异情况。即使是降雪，在不寻常的数量下也可能造成灾难性后果（见第\
  \ 214 页 EDS 雪害的描述）。理想情况下，所有这些环境因素都将在确定建筑物位置和设计时予以考虑。如果震动和沉降是严重威胁，将设备牢固地固定在地板和墙壁上会有所帮助。然而，在大多数情况下，企业将只能尽力利用现有场所，这不可避免地意味着某些妥协。\n\
  \n最终，IT 设备的物理保护与大多数其他类型资产的保护并无太大区别。该领域的规划应始终与组织整体负责物理安全的部门密切合作。\n\n## 9.4 预防灾难\n\
  \n\n\n\n\nIT 系统的第二道防线是考虑是否，尤其是在损坏范围有限的情况下，系统是否可以在没有不良影响的情况下继续运行。消除或避免损坏的影响需要某种形式的“安全网”。安装了额外的设备和错误管理软件，在出现故障时介入。理想情况下，这将无缝进行，用户甚至不会意识到有什么问题。实际上，可能并不总是能够实现“即时”恢复，或者服务的质量会出现明显的下降。\n\
  \n故障当然也可能发生在软件中，而不仅仅是硬件。大多数 PC 用户都直接经历过系统“崩溃”，屏幕冻结，用户只能根据关于指针和内存限制的神秘信息来判断最好怎么做。市面上有各种软件产品声称可以使系统“防崩溃”。事实上，正如\
  \ Halfhill（1998）指出的那样，更好的解决方案通常是尽量减少安装或同时运行的软件数量，并遵循一些基本良好的系统维护规则。无论如何，对于普通办公 PC\
  \ 来说，实现 100% 可用性很少是优先事项。\n\n对于大型系统，情况可能完全不同。如果系统对企业至关重要，无论出于何种原因，错误恢复都将被非常认真对待：一个典型例子是英国国家彩票。每周三和周六下午，在主要抽奖之前，全国约\
  \ 27,000 个终端前都会排起长队。任何一个终端的服务中断都会导致大量收入损失，并让许多客户和零售商感到不满。因此，彩票公司已大量投资额外设备，以使其能够在尽可能多的可能影响其系统的故障中存活下来，包括电力中断、处理器或磁盘崩溃以及电信故障（Partridge\
  \ 1994）。\n\n要确保即时恢复通常需要三个关键要素。\n\n* *重复设施*。这可以是处理器、包含最新文件副本的磁盘驱动器、电源或通信线路。该设施可能很少被调用，因此必须确保在需要时它能够工作。这就像在汽车后备箱里放一个备胎：如果司机在深夜荒无人烟的高速公路上爆胎，这不是发现备胎无法使用的时候。\n\
  检查可以通过定期测试设备进行，也可以通过系统的工作方式内置。例如，双处理器系统（通常用于计算机化电话交换机和超市收银台）可以轮流担任一天的“主”处理器。在此期间，“从”机器模仿每项活动，以便随时准备立即接管。第二天，角色互换。如果一个组件以这种方式“影子”另一个组件，则两者必须尽可能相互独立。如果两个处理器例如共享一个关键且容易出现故障的组件（如电源单元或网络接口卡），那么拥有两个处理器就几乎没有意义。\n\
  \n* *切换后的完整性*。没有任何程序是真正“即时”的，因此当重复设施接管时，它可能与原始状态完全相同始终存在风险。这可能意味着一些数据会“从裂缝中”丢失，或者系统会留下无法正确完成的事务。解决这些问题需要在软件设计上具有一定的复杂性，毕竟软件是在不太理想的情况下被激活的；例如，它可能需要在一个正在失效的处理器上运行，该处理器不会突然“死亡”，而是遭受一系列间歇性故障。软件设计人员有两个基本选择：一种是回溯软件所采取的步骤，直到达到一切应该正常的状态。软件随后重新启动。这被称为*向后恢复*，可以与人类操作员使用的某些文字处理软件的设施相比较，即可以“撤消”命令和击键。另一种是*向前恢复*，涉及清理甲板并重新开始。以文字处理类比来说，这就像重新启动文字处理程序并重新加载正在进行的工作的上次保存的副本。一般来说，设计能够在每种可能情况下保持完整性的软件极其困难。为了帮助理清出现的任何差异，系统必须始终提供良好的诊断信息，并详细记录所有故障以及它们发生的确切时间。\n\
  \n* *维修的可行性*。如果系统定期关闭进行维护，任何有故障的部件都可以在下一次可用机会进行维修或更换。对于全天候运行的系统，情况就不那么简单了。即时恢复只有在“飞行中”维修是可行的情况下才有意义。否则，用户仍会感到不便，尽管他们可能对中断的时间有所选择，并且可以提前收到警告。\n\
  只有在设备设计时已考虑到这一点时，才能进行运行维修。例如，技术人员必须能够在不干扰任何未受影响的设备或不必关闭公共电源的情况下安全地接触到组件的所有部分。\n\n\
  仔细查看在故障发生时*确切*预期会发生什么是有益的，这可以通过更详细地查看两个特定实例（电源和磁盘驱动器）来说明。\n\n### 9.4.1 电源\n\n一家试图涵盖各种情况的企业可能采取的安排如\
  \ Figure 9.2 所示。在正常运行期间，电力从左上方通过正常电源供应（1）输入。如果该电源失效，但电力公用事业仍通过公共电网供电，则设备从正常电源供应（2）获取电力。\n\
  \n![Figure 9.2 ](img/fig9_2_B.jpg)\n\nFigure 9.2 \n\n右侧的不间断电源（UPS）单元不断监控这些外部电源，如果它们*同时*失效，则会立即介入。然而，UPS\
  \ 依赖于一组电池，其额定值可维持电力供应约 15 或 30 分钟。因此，UPS 提供的只是一个喘息空间，在此期间备用发电机启动，并在必要时接管，直到正常电力恢复。\n\
  \n目标是计算设备应始终获得稳定的电力供应。UPS 必须能够应对外部供电中的各种不可预测性。例如，在 1990 年英格兰西部严重风暴期间，公司遭受了不断中断并在短时间内恢复的电力供应（Collins\
  \ 1990）。一个好的 UPS 将平滑所有波动，即使它们证明是极短暂的。由于计算机设备通常自行监控电力状况，并且对瞬态电力下降的反应通常是关闭自身，因此 UPS\
  \ 必须领先于它，即对变化更敏感且反应更快。\n\n\n\n\n\n定期检查将需要涵盖备用电源系统的各个方面，例如，确保 UPS 电池保持充电状态，并且发电机能够正常工作并且油箱中有燃料。较大的\
  \ UPS 系统会从电池产生大量热量，因此可能需要一些特殊的冷却装置。如果安装了新的计算设备，备用电源的容量也应包含在审查事项中，以确保它能够应对可能增加的需求。\n\
  \n### 9.4.2 磁盘：镜像和影子\n\n个人电脑通常依赖于单个容量为数 GB 的磁盘驱动器。较大的系统使用多个驱动器，并非全部相同；例如，正在归档的数据可能会写入较慢且更便宜的设备，例如\
  \ WORM（“一次写入，多次读取”光驱）。\n\n只有对经常需要的数据才可能考虑对组件故障的保护。有三种不同的方法可以实现这一点，如 Figure 9.3 所示。这显示了一个相当简化的图示，其中处理器可以将数据存储在三个磁盘中的任何一个上。有两个文件\
  \ A 和 B，每个文件都假设，为了简单起见，只包含两条记录。\n\n![Figure 9.3 ](img/fig9_3_B.jpg)\n\nFigure 9.3\
  \ \n\n复制文件 A 的最简单方法是将它完整写入同一单元（图示顶部的单元 1）中的 *both* 磁盘。或者，可以将副本发送到完全不同的磁盘单元（单元 2），它可能位于完全不同的位置。第一个选项更容易、更便宜地实现，但第二个选项中使用单独的单元使该安排更具弹性。创建副本，尤其是在远程站点保存副本，被称为\
  \ *mirroring* 或 *shadowing*。\n\n第三种可能性使用文件 B 显示。同样，该文件只有两条记录，但这次记录被拆分到两个驱动器上。这被称为\
  \ *striping* 数据。将条带化应用于仅两条记录意义不大，但它是 RAID 存储系统的基本特征，其中 RAID 代表 Redundant Array of\
  \ Independent (or Inexpensive) Disks。RAID 系统包含大量磁盘驱动器，数据被条带化到所有驱动器中（不一定是单个记录，而是\
  \ RAID 单元控制系统选择的任何方式）。RAID 供应商已经设计出管理数据的高级方法，以帮助确保即使单个驱动器发生故障也能访问。\n\nRAID 不仅因其弹性而变得流行，而且因为它可以为写入和检索记录提供极好的响应时间。供应商开发了各种各样的系统，其中许多系统结合了\
  \ *both* 条带化和影子复制的优点（Brackenridge 1993）。因此，可以获得两全其美的效果——性能和弹性，尽管通常价格较高。用户应记住，在严重灾难发生时，单个磁盘的内容在很大程度上毫无意义，并且数据只能在专有\
  \ RAID 软件的帮助下以及它维护的表的情况下重新拼凑。\n\n## 9.5 创建和实施灾难恢复计划\n\nSchweitzer（1996：112）引用了一位信息系统经理的说法，他在一次现场检查中被要求提供灾难恢复计划的副本。他回应说：“我们没有应急计划\
  \ *because we have never had a disaster*。”这或许概括了许多管理者的私下看法。为什么要费心和花钱制定 DRP？过去从未需要过它，而且将来永远不需要的可能性很大。\n\
  \n有一小部分，并且在减少的组织不需要 DRP；这种稀有品种的成员很少使用信息系统，并且工作在长期的销售和生产周期中。所有组织都应至少审查是否需要 DRP。一旦计划的理由成立，高级管理层必须通过提供开发计划所需的工作资源，并批准对计划所涵盖服务的定义作为组织生存的绝对必需品，采取初步步骤。\n\
  \n如果部分或全部 IT 系统外包，恢复程序必须由外包协议涵盖。即便如此，从灾难中恢复的实际过程将需要 *both* 方的合作，并且 DRP 应该说明哪些责任属于组织，哪些属于外包商。\n\
  \nDRP 需要包含 Figure 9.4 中显示的六个关键要素。前两个条目被下划线标出，因为它们指的是资产，一旦丢失，可能无法替代。清单上的其他一切都可以从其他地方购买、乞求或借用。组织会发现自己无法在公开市场上购买（事实上也不愿购买）的是上个月的销售明细，以及员工的经验和专业知识。\n\
  \n![Figure 9.4 ](img/fig9_4_B.jpg)\n\nFigure 9.4 \n\nDRP 是行动计划，因此应集中于实际问题，例如人们如何联系、他们应该做什么、他们将在哪里找到东西。在紧急情况的高峰期，员工不会对阅读政策的细微差别感兴趣。结构应以向新车或计算机所有者发布的指南的最佳示例为模型，提供所有必要的参考资料并有良好的索引，并以简单的方式解释应遵循的程序。\n\
  \n计划的副本应分发给所有可能在实施中发挥重要作用的人。应鼓励员工将副本带回家，以便即使办公室无法进入也能获得。这意味着维护一份流通清单和对任何更新的系统分发；否则，人们会试图实施计划的不同版本，从而导致混乱。\n\
  \n一些措施需要在持续的基础上实施。例如，必须定期进行备份，并且需要测试备用设施。\n\n让我们依次考虑计划的每个要素。\n\n1. *People*。有充分的理由坚持制定计划的人\
  \ *not* 是在计划实施时负责的人。首先，计划的作者应假设有必要详细说明员工的所有角色和职责，包括将负责恢复操作的人的职责。这确保了计划中没有任何内容依赖于仅作者知道的信息，从而避免了可能在关键时刻出现的问题，如果作者离开公司或休假。第二，很可能如果灾难威胁到企业的整个未来，首席执行官希望直接控制。\n\
  \n同样，计划中定义的程序不应假设指定个人可用。实际上，他们可能无法联系，或可能因灾难的影响而受伤甚至死亡。这并不意味着计划中应避免使用姓名——事实上，姓名和家庭电话号码将是其中的重要部分；但是，在可能的情况下，应确定替补和副手。\n\
  \n2. *Data and software*。应假设灾难会摧毁组织场所内保存的所有数据和软件副本。这引发了关于备份副本应保存在何处以及如何保持最新等众多问题。\n\
  \n\n\n\n\n保持数据备份副本的最简单方法基于‘世代’，如图 9.5 所示。1 月 1 日，数据备份到磁带 A 上。一周后备份制作在磁带 B 上，再过一周使用磁带\
  \ C。此时，安装有三个备份。其中只有一个是最新的，但在最新备份出现任何问题时，另外两个可用作‘长停’。此时，磁带开始轮换，因此在 1 月 22 日磁带 A 被重新使用，并成为最新副本。这确保了在任何给定时间总会有三代磁带：年老的‘祖父母’、年轻的‘父母’和新的‘孩子’。为了提高至少一份副本始终存活的机会，磁带都存放在不同的位置。这可能意味着使用组织拥有的其他建筑物，或商业运营的安全保险库服务。\n\
  \n![Figure 9.5](img/fig9_5_C.jpg)\n\n图 9.5\n\n实际上，出于多种原因，数据备份策略需要比这更复杂一些。\n\n* 由于完整备份通常涉及海量数据，使用*增量*备份可能更容易。这些备份仅包含自上次备份以来对数据所做的*更改*。要完整重建数据，需要从一次完整备份开始，并添加自那以后制作的所有增量备份。\n\
  * 可能已为其他目的设立了其他复制程序；例如，记录可能定期从主计算机磁盘上的‘实时’文件中删除，并放入某种形式的档案中。可能认为（也许完全错误）归档提供了抵御灾难的保护。如果档案未受保护，它们也必须纳入备份计划，因为它们可能因法律原因、协助审计或为管理决策所需的长期分析而需要。\n\
  * 当数据在系统上实时存在时，它将受到第 4 章中描述的访问控制的约束。数据必须在备份到磁带后继续受到保护（这通常意味着对磁带使用情况施加严格限制），并且必须能够以完全等价的形式在另一系统上重建数据，以便访问控制继续有效。如果文件已受到基于哈希或加密的控制，则必须特别注意完整且完好地传输文件。\n\
  \n在某些情况下，备份数据似乎毫无意义；例如，用于规划或设计工作的参考数据可能来自外部来源，易于替换。系统上可能保存了一些数据集的重复副本，以服务于不同的用户组，或提高系统性能，对这些副本进行重复备份似乎过分。\n\
  \n在大型安装中，筛选此类数据可能值得付出努力。其方法之一是按‘关键性’对其进行排名。Toigo（1996：167）将关键性高的数据定义为支持关键业务功能、或因法律或审计目的而必需、或包含专有信息和商业秘密的数据。然后可以忽略占用大量存储空间的低关键性数据。\n\
  \n软件通常占用的存储空间要少得多，因此完全备份它不应有问题。必须特别注意关键软件，即独特于企业并处理库存管理、会计等核心活动的软件。尽管如此，值得尽可能全面地进行软件备份，以避免因程序之间并非总是明显的相互依赖而受困。例如，一个软件包可能需要使用数据压缩实用程序，否则将无法打开其文件。\n\
  \n### 3. 场所\n如果现有的计算机设施变成一堆废墟，你去哪里？这个问题应在很早之前就考虑过，并将其答案纳入 DRP。为了确保可用性，替代场所应远离原址，增加其不受可能吞噬原址的更广泛灾难影响的机会。然而，这会减慢恢复速度，因为转移人员和任何被抢救的材料需要更长时间。\n\
  \n### 4. 处理器\n关于处理器的决策与关于场所的决策密切相关。通常，备用站点可分为三类。\n\n#### 1. 互助\n与另一站点达成协议，预留空间和计算能力，并在灾难发生时始终可用。其思路是双方各自运行类似的系统，但始终预留一定的空闲容量，以便在必要时可为对方提供备份。这对于同一组织内的两个站点来说是一个有吸引力的选择，尤其是如果它们由单一\
  \ IT 部门运营。情况会变得更复杂，如果涉及独立组织。毕竟，每一方都必须为对方的利益资助空闲容量，很难就应如何支付达成一致。紧张局势也可能出现，因为即使最初非常相似，安装也可能需要在设备或软件方面朝不同方向发展。\n\
  \n#### 2. 温备或热备\n热备站点提供与组织自身安装中可用的设施高度匹配的设施。这包括所有必要的电力、布线、电信、空调以及一套完整的计算机设备。\n\n\
  提供更基础设施的站点可能被称为‘温备’站点。这里的预期是并非所有东西都能立即获得，但已制定计划在数小时内调入并激活所需内容。很少有组织能负担得起自建热备或温备站点，这是一个少数专业商业提供商的领域，他们通过向订阅者收取年度费用来覆盖成本。即便如此，协议的细则可能规定不保证站点在需要时可用，如\
  \ EDS 雪灾案例所示。\n\n#### 3. 冷备\n冷备站点（有时称为‘空壳’站点）提供的只是在从零开始重建计算机服务的空间。它将拥有足够的电力供应和一些基础的电信链路，但几乎没有其他东西。客户必须自行借用或购买处理器、磁盘和打印机，并安排所需的任何额外电信链路。\n\
  \nBarnes（1999）描述的此类变体包括一家零售银行将额外的电力和电话线路接入员工食堂，以便该食堂可作为其冷备站点，以及一家伦敦出版公司制定的方案，即一名物业代理人承诺每年收取费用，始终在其名下识别出三个空置且适合作为冷备站点的场所，并在六个月租约下可立即使用。\n\
  \n\n\n\n\n### 5. 电信\n需要为普通电话线路做出安排（包括用于电话订购或查询服务所需的线路，这些服务正在迁移）。DRP 还应规定为组织其他部门的数据链路所需连接的数量和类型，例如分公司或仓库，以及外部服务，例如通过\
  \ VAN 或互联网进行 EDI 和电子邮件的链路。如果组织运营自己的网站，它可能会发现最好的解决方案是安排能够快速激活网站镜像副本，使用商业互联网网站提供商的服务。\n\
  \n### 6. 供给\n有时候最简单的事情最容易被忽视。然而，没有基本用品，任何计算机系统都无法运行，例如墨盒、连续纸和单张纸打印机用纸，以及充足的空白磁带和软盘。在这方面的预见性可能在很大程度上维持客户和供应商的信心，例如，如果组织能够继续在其自己的预印文具上寄出信件和支票。\n\
  \n计划的具体形式将取决于组织规模和优先事项等因素。CCTA（1995）和 Toigo（1996）提供了有助于制定计划的有用检查清单和模板。\n\n当灾难发生时，很难预测最初一小时或两小时会发生什么，因为这在很大程度上取决于时间和情况。然而，应尽快按照\
  \ Figure 9.6 所示的顺序激活恢复计划。当 IRA 炸弹于 1992 年摧毁伦敦金融中心几座建筑物时，受影响最严重的公司之一 Commercial Union\
  \ 的总经理在 40 分钟内在其家中召开了危机会议。损失如此严重，CU 别无选择，只能立即激活其 DRP。\n\n![Figure 9.6 Based on Computer\
  \ Disasters and Contingency Planning, Amdahl Executive Institute, 1990](img/fig9_6_B.jpg)\n\
  \nFigure 9.6 Based on Computer Disasters and Contingency Planning, Amdahl Executive\
  \ Institute, 1990\n\n如果损坏只是部分性的，灾难评估阶段可能更困难。显然，如果原始站点有合理可能恢复使用，就没有必要让所有人的精力都集中在转移到备用站点上。然而，一旦决定实施计划，就应尽可能减少每个人被期望扮演的角色的不确定性。\n\
  \n计划能够奏效的唯一方法是经过测试。有效的测试可能不受欢迎。一家加州公司实施了在周末随机进行的测试。员工必须像对待真实情况一样做出响应，即使这意味着放弃一次珍贵的滑雪或海滩之旅。只有通过引入这种程度的真实性，才能发现计划中的差距和问题；例如，可能会发现员工电话号码已更改；或者当软件在“家庭”机器上运行完美，但在转移到另一台看似相同的机器上时却无法运行时，可能会出现技术问题。这可能是由于内置的许可证保护检查，或适用于其使用的数据的访问控制。测试还将揭示任何被遗忘的项目；例如，承包商的电话号码或电子邮件地址最终被证明是需要的，或进行运行调整和维修的简单工具。\n\
  \nBased on Computer Disasters and Contingency Planning, Amdahl Executive Institute,\
  \ 1990\n\n在可能的情况下，应在未经事先通知的情况下让设备和软件供应商参与测试。如果要使用冷备用站点，可能无法实际检查系统的大部分重建工作。尽管如此，仍应能够检查所有相关供应商是否可以联系，以及他们是否持有所需物品的库存。\n\
  \n## 9.6 IT 普及的含义\n\n灾难恢复计划中规定的程序将涵盖组织核心保存的所有程序和文件。理想情况下，这些将包含远程办公室捕获或生成的所有重要内容。实际上，总会有一些本地保存的材料尚未以这种方式纳入中央信息系统。\n\
  \n在某种程度上，电子形式的本地文件是一种优势。以前，文件可能因爆炸或火灾中文件柜被毁而丢失，唯一的保护可能就是大量的预防性复印。相比之下，电子记录可以在几秒钟内备份，并存储在单个磁盘上。本地办公室不需要制定完整的灾难恢复计划，但应根据以下原则采取一些基本措施。\n\
  \n*   *合规的简易性*。最简单的选择是复制绝对所有内容。完全有可能定期使用磁带流驱动器或大容量软盘驱动器对每台 PC 的每个磁盘进行完整复制。但与病毒检查的情况一样，这只有在确保每个人都遵守的情况下才有效。如果备份涉及将设备插入机器背面并搜索正确的屏幕图标来激活它，可能会不愿意去做备份。\n\
  \n    保存文件的过程应实现自动化，以至于在关闭机器之前只需选择一个菜单选项，或甚至每天自动触发即可。如果 PC 连接到局域网，备份副本可以发送到 LAN\
  \ 服务器，然后服务器的文件可以批量备份。如果 PC 是便携式的，它可能需要自己的备份存储设备。越来越多的 PC 文件备份服务在互联网上提供，尽管在这种情况下，需要注意确保任何敏感文件得到适当保护。\n\
  \n*   *文本和语音消息*。除了办公室 PC 上直接由用户控制的文件外，可能还有对部门工作重要的收发消息的副本。这些可能包括 EDI 消息、电子邮件和语音邮件。检查其中哪些（如果有）实际保存在办公室服务器上将很有用。如果它们保存在其他地方，值得询问在灾难发生时为其恢复所做的安排。\n\
  \n*   *工具的可获得性*。偶尔员工可能需要处理敏感信息。在传统办公室中，他们可能需要确保所有相关文件保存在特别安全的柜子中。重要的是，电子方式进行此类工作的人员也能轻松获得同等设施。例如，组织应使获取和安装个人\
  \ PC 的额外访问控制和备份设施变得容易，特别是如果这些 PC 是便携式的。\n\n## 9.7 为业务连续性保护措施投资的合理性\n\n业务连续性保护（BCP）措施的选择应基于对所有风险、成本和收益的评估，使用本书记载的方法（见\
  \ Chapter 2）。然而，这些方法的应用方式与其他类型的<|message|>\n\n\n\n\n*   *许多正在考虑的威胁并非特定于 IT*。这意味着通常可以从其他领域工作的人那里获得丰富的经验，并且可能存在早在\
  \ IT 发明之前就已存在的相关统计数据。例子是自然现象，例如恶劣天气的模式及其带来的影响。\n\n*   *BCP 涵盖整个企业，而不仅仅是 IT*。这意味着\
  \ IT 资产可能需要与其他完全不同类型的资产一起考虑，并且用于分析的方法必须符合 BCP 项目团队选择的方法。\n\n*   *BCP 将超越组织本身*。如果灾难袭击整个地区或社区，恢复将因公共服务缺乏以及公司之间对稀缺设施的竞争而受阻。可能很难获得有关正在发生的事情的可靠信息，或确定谁负责。借鉴加拿大的经验，Newton\
  \ 和 Pattison（1998：I12, 1）指出：‘民选官员或应急机构的行动可能会将控制权从高级企业高管转移到负责您所在地区应急管理的众多组织手中。简单地说，在该地点的业务恢复中，您的管理层不再“说了算”。’\n\
  \n*   *与 BCP 相关的对策通常可以进行测试*。正如前几章所见，在事件发生时几乎不可能验证电子钱包或互联网防火墙是否足以抵御攻击。然而，BCP 问题通常集中在更平凡的问题上，例如墙是否防火，或屋顶是否足够坚固以承受给定载荷。灾难恢复计划也可以通过假装建筑物无法使用来彻底测试。这与与其他形式的安全测试相关的不确定性形成对比，在其他形式的安全测试中，有必要猜测有才华的黑客可能如何发动攻击：这取决于驻地专家或一支“老虎队”的驯服黑客能够识别所有可能威胁的假设。\n\
  \n*   *BCP 关注资产的保存*，因此将可能损失的估计减少到现金数字并不太困难。相比之下，对于隐私或消息完整性等同样重要的议题，很难量化安全措施所提供的利益。\n\
  \n上述大多数因素的效果是使 BCP 的计算感觉更“主流”且更熟悉（至少对会计师而言）。然而，潜在损失的非常大规模，以及通常与之相关的非常低的概率，使计算进入了之前讨论过的有问题的领域（参见\
  \ 第 2.4 节）\n\n在考虑重大故障的影响时，可能的后果可分为两个标题：*直接*和*间接*损失。\n\n直接损失通常是可以投保的。保险公司的赔付无疑有助于减轻灾难的影响，但绝不应将其视为恢复计划的替代品。保险公司可以理解地不愿承保任何事先无法明确界定的损失。他们将提供设备更换的保险，或在特定情况下提供补偿，但除此之外，免责条款开始变得非常广泛，或将要求支付高得多的保费。无论如何，如果灾难的净结果是公司无法继续经营并被迫进入接管程序，直接损失的赔偿对公司的债权人来说可能很重要，但对公司本身而言意义不大。\n\
  \n因此，最重要的损失是*后果性*或*间接*损失。\n\n间接损失往往是无形且难以量化的。它们通常会远远超过直接损失，并且在灾难结束后很长时间内仍会持续。例如，对\
  \ 15 家幸存于灾难的公司的股价研究表明，股价恢复到事件前的水平平均需要约 50 天（Knight 和 Pretty 1997）。股价低似乎是公司需要面对的相当遥远的问题，但它可能对公司的恢复努力产生非常实际的影响，例如，使其更难以获得信贷额度。\n\
  \n可能损失的量化可基于*业务影响分析*，其中直接损失被归类为具有*硬*影响，间接损失为*软*影响（CCTA 1995）。软或间接影响往往需要更长时间才能显现，并会产生更持久的影响。初步评估可能会显示\
  \ 图 9.7 中建议的形式之一的影响。在所有情况下，初始直接损失将是严重的，但可以通过保险寻求补偿。\n\n![Figure 9.7 Possible patterns\
  \ of loss following a disaster](img/fig9_7_B.jpg)\n\n图 9.7 灾难后可能的损失模式\n\n真正决定组织命运的是之后发生的事情。如果灾难摧毁了重要记录的唯一副本，损失可能会升级，如线\
  \ C 所示。如果记录可以重建，但只能通过从其他来源重新手工输入等繁琐过程，组织将面临高额开销的长期时期，如线 B 所示。目标显然应该是成本通过实施有效的恢复计划迅速恢复到正常水平（线\
  \ A）。\n\n## 9.8 问题\n\n1. 确定您工作或学习场所中一台重要的计算机安装。确定该安装的五种*物理*威胁，并按严重程度排序。在每种情况下，判断是否有任何对策是可行的，如果可行，选择*一种*可以用合理成本实施的对策。\n\
  \n2. 仔细阅读以下备忘录。它包含哪些不合逻辑和不一致之处？\n\n3. 制定一份灾难恢复计划的大纲，以应对您个人计算机的丢失或损毁。粗略估计如果您要做出计划所需的所有准备，您将产生的成本，包括您所需的设备和材料，以及您的时间成本。\n\
  \n4. “业务连续性规划只对悲观主义者和官僚感兴趣”。在简短的论文中（600–800 字）讨论这一命题，说明您是否同意或不同意。\n\n5. 解释为什么在某些情况下，创建备份副本可能会使实现保密商业有价值信息的目标变得更加困难。\n\
  \n# 第十章 归档数据的控制\n\nDOI: [10.4324/9780203992319-15](https://dx.doi.org/10.4324/9780203992319-15)\n\
  \n## 10.1 引言\n\n计算机系统鼓励数据囤积。对典型个人计算机硬盘的检查将显示数百个文件，其中许多文件将在机器的生命周期内一直保留在那里。磁盘空间现在如此便宜，以至于没有动力清除不再想要的材料。日常工作的所有即时关注也分散了对保持文件有序所需的规划和整理工作的注意力。因此，文件逐渐变得杂乱无章，查找一份文档的过程变得需要大量苦思冥想，并通过关键词搜索四处寻找。\n\
  \n\n\n\n\n所有这些都会浪费企业的时间，尽管影响很少非常严重；这也不是一个特别新的现象——寻找“丢失”的文件，毕竟与档案盒和文件柜有关，是一种历史悠久的活动。电子媒体可能会导致文件激增，但这可以通过强大的搜索工具的可用性得到补偿。文件拥堵和激增的问题最终并不是担心依赖电子媒体进行记录长期存储的原因。\n\
  \n与计算机生成的记录相关更严重的问题更为根本，并且在未来几年可能会变得更加明显。这与世界最初欢迎核能的到来有着一些令人不安的相似之处。它被视为一种清洁且廉价的能源来源。只有当处理乏燃料和退役反应堆的成本变得清晰时，人们才开始质疑核技术的*整体*经济可行性。\n\
  \n今天，计算机系统的成本论证往往集中在技术将如何影响企业的日常运营和工作方式上。来自改进订单处理的额外收入，或来自减少文书工作的成本节约，都与新设备和软件的投资成本相平衡。必须长期保留记录的经济和其他后果很少被考虑。这忽略了老式纸质系统的一些主要优势：纸质文件一旦归档，就构成了不会褪色的记录，任何人都可以阅读和理解。在许多情况下，记录还包含真实性证据，因为人们已在文件上签名或\
  \ initials，或用自己的手写下了笔记。纸张以低成本自动提供了所有这些功能。\n\n这些简单而明显的特性在许多形式的电子文件中并不存在，因此有必要找到将其重新构建的方法。不幸的是，很不清楚这一过程需要进行到何种程度。计算机存储介质基于最近才发明的技术。没有人能完全确定记录在上面的磁性和光学图案会持续多久。必须对未来是否还能获得读取当今磁盘格式的设备存在一些不确定性。数据当然可以始终复制到新介质上，但关于副本真实性的争议将如何解决呢？事实上，未来的任何人如何才能核实数字数据的真实性？\n\
  \n未能充分保存和验证记录可能会导致日后产生大量成本，因为企业可能需要记录来证明其在应对诉讼或监管机构关注时的案件。除了记录变得无法阅读或不可靠的商业影响外，许多研究人员和公共档案管理员也担心有关企业运作的信息可能对后代来说会丢失。\n\
  \n## 10.2 软件和介质的过时\n\n塞缪尔·佩皮斯的日记，以其对十七世纪伦敦生活的生动描述而闻名，被保存在剑桥、英格兰一所学院图书馆的六本皮革装订的卷册中。只要它们不暴露于极端的高温或潮湿环境下，这种类型的纸质记录可以提供一个能够保存数百年的记录。事实上，与许多其他历史书籍和文件相比，佩皮斯的日记还很年轻，造纸术早在上一个千年初期就已确立，而商业造纸术在欧洲已确立了\
  \ 200 多年（Guild 1999）。\n\n佩皮斯写作的一个有趣特点是，虽然文本得以保存，但解读起来并不容易。佩皮斯使用了托马斯·谢尔顿发明的速记的当代版本。毋庸置疑，这与今天使用的速记几乎没有共同之处，因此佩皮斯写作的解读者还需要能够获得谢尔顿对其速记方法的指南的副本，该指南于\
  \ 1642 年出版（Latham 1987）。\n\n类似的问题也可能困扰未来的研究人员，试图读取磁性或光学磁盘。正如 Rothenberg（1995）指出的那样，数字存储设备（如\
  \ CD-ROM）上包含的内容并没有什么自明之处。每张磁盘都包含一长串位，在能够解释它们之前，必须找到一些额外信息：例如，磁盘上的文件是如何索引的，以及它们是编码为文本还是图像。\n\
  \n在今天几乎相同的 PC 世界中，这似乎是无关紧要的实际问题，当 IBM 兼容的 CD-ROM 可以被任何适当配置的机器读取时。然而，这只是一个暂时情况。假设存档数据被记录在\
  \ CD 上。有人在 10 年或 20 年后试图读取 CD 时可能会面临三个基本问题。\n\n1. *软件惯例和标准*。软件不断发展，因为供应商升级其产品，并说服客户丢弃旧版本。供应商有既得利益确保旧版本创建的任何文件仍可被新版本读取，以避免昂贵的文件转换并使客户“锁定”在同一产品系列中。因此，例如，每个市场领先的文字处理产品都能够读取旧版本文件。根据公司的营销策略，它还可能提供读取由其竞争对手软件包生成的文件的功能。\n\
  \n这种读取文件的灵活性，只要供应商认为有利，就会被提供。没有供应商能负担得起无限期地支持所有文件格式，即使是在数百万份销售的通用软件包中。对于会计或医学等更专业的软件包，成本限制更强，支持很少能追溯到紧接的前一个版本。\n\
  \n净结果是，正确读取过时文件的机会不断减少。为了理解一个文件，我们必须有一个可以解释它的程序（相当于托马斯·谢尔顿的速记指南）。问题是相关程序可能早已从市场上撤出。事实上，为其编写的机器也可能已不复存在。问题因并非每个人都使用市场领先产品而变得更加复杂，而且无论如何市场领导者会随着时间的推移而变化。因此，像\
  \ Apple 和 Amstrad 这样的公司过去曾推出运行其专有软件的办公机器系列，使用与主导的 IBM 标准不兼容的方式格式化的软盘。软件公司在设定 PC\
  \ 软件标准的能力上也波动不定。例如，在 PC 软件通过键盘驱动而不是鼠标的时代，Lotus 主导了电子表格市场，文字处理主要由 WordPerfect 主导，而数据库则由\
  \ dBase IV 开创。\n\n虽然对普通办公 PC 用户来说不太明显，但在大型系统方面也发生了完全相同的情况。例如，主机的供应商会定期通知，某些旧版软件的支持将在某日期被撤回。之后，软件可能继续运行得相当愉快，但它是在借来的时间上运行。如果出现问题，例如由于旧软件与供应商引入的一些新功能之间的冲突，购买者只能尽力自行解决。\n\
  \n\n\n\n\n## 2. 硬件的过时\n新一代硬件每隔几年就会出现，而且变化的步伐没有放缓的迹象。这些变化既影响计算机本身，也影响它们所依赖的存储设备。能够继续使用处理器的能力与之所依赖的操作系统密切相关。DOS\
  \ 操作系统是在第一台 IBM PC 上引入的，它已历经数代芯片技术而存活下来，因此大多数 DOS 程序今天仍可运行。然而，其他操作系统就没有如此长寿。例如，DOS\
  \ 最初与另一个名为 CP/M 的操作系统竞争（Steffens 1994）。CP/M 早已从场景中消失，连同 Commodore Amiga 等面向业务的机器上使用的其他专有操作系统一起消失。在\
  \ 1990 年代初期，IBM 试图将其 PC 市场引向基于其 OS/2 操作系统的路线，该系统与使用名为 Micro Channel Architecture\
  \ 的功能的处理器绑定。这场战役最终败给了运行 Microsoft Windows 的更常规的 PC。\n\n磁盘也发生了设计和格式的变化。早期标准基于直径 5¼\
  \ 英寸的软盘，装在软盘盒中，可存储 360 KB 数据。5¼ 英寸软盘被广泛使用，并在整个 1980 年代保持标准。然而，今天任何遇到这些软盘的人都会很难找到能够读取它的机器。\n\
  \n同样，在大型机计算领域也观察到平行的变化。磁带长期以来一直是归档的传统介质，但格式和设计多年来发生了根本性变化。开发了更好的磁涂层，因此可以在给定的表面积上存储更多数据。大型\
  \ 10 英寸卷盘已让位于更紧凑的盒式系统，并出现了类似的问题：磁带及其数据可能完好无损，但能够读取它的机器可能只在科学博物馆中才能找到。\n\n## 3. 介质的劣化\n\
  关于光学和磁性介质的最后一种疑虑， concerns 它们能否在多年中准确地保留信息。这些介质的主要吸引力（它们能够以非常高的密度保存数据）也证明是其弱点之一。对表面仅很小区域的损坏就可能使相当大数量的数据无法读取。记录技术试图通过添加额外的编码来检测和纠正错误来补偿这一点。不幸的是，这些方法无法应对严重损坏，例如磁盘或磁带暴露于强磁场中，削弱了其表面存储的信号，或尖锐物体刺穿了光盘的脆弱板，光盘厚度仅一毫米多一点。\n\
  \n此外，这些介质容易随时间劣化。很难做出准确的预测，因为制造商一直在不断提高产品的质量。在 1980 年代，美国国家标准局建议磁带的使用寿命应视为 20 年（Saffady\
  \ 1993）。音乐行业已经在 1960 年代制作的磁带录音中遇到问题，其中一些现在已无法读取（Beacham 1996）。光盘存在的时间并不长，其寿命的大多数数据都是基于实验室压力测试的推断。制造商显然期望光盘应能使用\
  \ 100 年或更长时间，但在提供保修时却更为谨慎（Arps 1993）。\n\n## 10.3 业务数据归档的要求\n公共档案员寻求保存记录，以便未来的历史学家能够建立对事件的完整和平衡的观点。商业组织出于开明的自利而保存记录——要么是因为法律对其施加了某种要求，要么是因为他们希望确保如果事实问题上出现争论，他们将拥有证据在手。公共部门的组织可能会被所有这些要求所困扰，因为它们承担了许多商业职能，但也将期望向公共档案馆提供记录。\n\
  \n大多数国家要求组织保留其业务活动的记录，规定一定的时间。常见例子是与税务责任有关的记录。保留的最低时间段在立法和税法中规定，通常与允许任何一方对已作出的税务评估提出质疑的时间挂钩。这具有这样的优势，即在规定期限届满后，该信息不再可在诉讼中使用，因此其重要性丧失。\n\
  \n税务制度会为不同情况规定不同的时间段。因此，美国联邦税务制度要求会计记录应在相关纳税申报表日期后保存 3 年，但如果纳税人严重少报收入或申报表在任何方面存在欺诈，则延长至\
  \ 6 年（Williamson and Marcum 1998）。在英国，税务局在 6 年期满后不得提高其评估，尽管如果发生欺诈或疏忽行为，则增加至 20 年（Taxes\
  \ Management Act 1970）。不同形式的税收适用不同规则，因此公司可能需要制定相当复杂的保留政策以确保合规。\n\n许多组织希望出于其活动的性质而更长时间地保留会计和行政记录。在某些情况下，这意味着在客户的生命周期内保留记录。这在医疗保健中尤为明显，患者积累记录“从摇篮到坟墓”。这些记录在事件发生多年后可能具有法律影响，正如一家卫生当局所发现的那样，当一名患者在五十多年后被允许因脊髓肿瘤的错误诊断而提起诉讼时（Anon\
  \ 1998b）。其他保留长期记录的企业例子包括从事抵押贷款、人寿保险、养老金、房产、设备租赁或存在长期健康和安全问题的产品，如飞机和药品的企业。对于各类组织来说，谨慎的做法是保留某些领域的记录，例如有关过去和现在员工以及作为承包商为其工作的人的记录。然而，个人详细信息的保留可能受数据保护立法约束，要求删除与组织需求不再相关的任何信息。关于应如何做出此类判断的具体指导并不总是很充分（参见\
  \ section 14.4）。\n\n公司可能会发现，他们在公司章程中无意中纳入了关于纸质文件的假设。例如，1996 年 Rolls Royce plc 采用了多项变更，以反映伦敦\
  \ CREST 无纸化股票交易系统的引入。公司章程此前允许在登记后 6 年销毁任何转让文书。这被延长“以使公司能够在 6 年期后销毁因无纸化证券转让而产生的任何\
  \ *电子生成或存储* 的信息”（Rolls Royce 1996）。\n\n## 10.4 归档文件和文档的认证\n\n\n\n\n\n如果 Alice 想通过数据网络向\
  \ Bob 发送经过身份验证的文档，她会将文档通过哈希算法处理并添加数字签名，使用她的私钥非对称密钥（参见 第 6.6 节）。档案材料的身份验证完全基于相同的原理。然而在对档案记录进行身份验证时，Alice\
  \ 并不是通过网络与 Bob 通信，而是将消息送上穿越时空的旅程。Bob 并不会在接下来的一个小时或一天内检查消息的凭证，而是在某个未来的日期（也许是很多年后）进行检查。这两种情况在\
  \ 图 10.1 中有所说明。\n\n![Figure 10.1 ](img/fig10_1_B.jpg)\n\nFigure 10.1 \n\n档案记录身份验证重要的案例示例可以在制药公司的研究实验室中找到。传统上，研究人员会在一周结束时收集他们的笔记和报告，并请见证人签名并注明日期。这种方式对记录的身份验证必须是公司的政策，以防它需要向美国食品药品监督管理局证明其研究是如何进行的（Wayner\
  \ 1999）。如果研究人员以电子方式生成研究数据，仅仅为了让某人签署纸质副本而将其全部打印出来就毫无意义。相反，公司可以使用电子方法来对数据进行身份验证。\n\
  \n该方法基于“时间戳”，其工作原理如下。假设一家公司希望能够证明一份电子文档是在某个特定日期或之前产生的，例如 2001 年 6 月 1 日。它会将电子记录通过哈希算法处理（就像要保护网络消息免受篡改一样）；然而，在这种情况下哈希的使用方式不同。它会被“记录在案”，以一种直接与\
  \ 2001 年 6 月 1 日关联的方式；例如，它被印刷在当日报纸的个人专栏中，或包含在当时广泛流传的其他文档中。或者，它可以交给独立的第三方，后者记录哈希值及其收到日期。已经存在愿意为“公证”哈希提供此服务的公司。如果需要进一步的安全性，归档记录可以像网络消息一样进行加密和/或数字签名。\n\
  \n如果对记录日期产生任何争议，这些过程可以逆转，证据将被重新关联，以显示内容在该特定日期时确实如所声称的那样。该程序在 图 10.2 中有所说明。时间戳对于单个记录和文件来说简单有效。对更大数据集合使用它在技术上是可行的，但管理起来要困难得多。问题源于需要将数据保持在哈希时完全相同的形式。这意味着其任何部分都不能被删除，如果将其复制到不同的记录介质上，数据结构或编码方式不得有任何偶然变化。仅仅移除或更改一个位就会显著改变哈希值（这正是哈希算法的设计目的），并使整个操作失效。\n\
  \n![Figure 10.2 Digital time stamp](img/fig10_2_B.jpg)\n\nFigure 10.2 Digital time\
  \ stamp\n\n另一种方法是维护一份电子日志，记录文件发生的一切。如果日志完全单独保存，它可以用作审计跟踪的一部分，以检查所有数据是否以得到适当授权的方式创建。不幸的是，更仔细地审视其影响会发现，这同样可能迅速变成一场行政噩梦。这一问题在医疗记录方面已被广泛讨论。患者通常会由多位医生治疗，每位医生都希望确保记录是正确的——即使一次临床咨询与下一次之间相隔很长时间。能够追溯检查某项特定测试或诊断的责任人也是有用的。\n\
  \n在英国，初级保健患者记录的草案标准中包含了此处所示的要求。\n\n同样，问题不在于供应商是否能够提供具有这些功能的系统，而在于用户是否能够维护它。例如，审计跟踪记录将包括用户\
  \ ID，如果没有补充表将其与真实人员关联，这些 ID 将毫无意义：例如，显示“`DR05`”实际上是 Raj Singh 医生。此外，该表必须提供完整细节，并且*必须与当时完全相同*：否则可能\
  \ Dr Singh 此后已转到另一家诊所。此后，甚至可能“`DR05`”这一相同 ID 已分配给他的继任者。如果没有广泛的佐证证据（需要与审计跟踪一起存储），任何尝试“重建”记录的努力都会迅速瓦解。所有这些问题可能因前面本章提到的软件版本问题而加剧，即用于创建记录的软件版本已被取代，且不再可用。\n\
  \n任何试图建立可在长时间内进行身份验证的档案的人都面临着最后一个挑战。保护必须基于今天可用的哈希和加密技术，但不可避免的是，这些技术在未来的密码学家（和黑客）看来会显得原始。必须进一步预期的是，任何在例如\
  \ 2025 年希望伪造 2001 年记录的人都将拥有按今天标准而言惊人快速的计算机。Schneier (1998) 回顾了试图预测几年后加密攻击可能采取何种形式的难题，他得出结论：“无论你喜欢与否，密码学家都必须具有未来主义眼光”。不幸的是，这又是无法给出坚定或令人安心的答案的领域。用大量看似安全的加密将数据包裹起来，就像把文件放入铁箱中，明知最终箱子很可能会锈蚀一样。\n\
  \n## 10.5 记录保留政策\n\n在电子时代，组织必须决定保存哪些记录，*以及*应使用何种技术来保存它们。即使它们已有基于纸质记录的明确保留政策，也不会预见到电子存储可能出现的大多数情况——特别是如果许多核心业务记录是以电子方式*产生*的，这通常是“业务流程再造”练习的结果。\n\
  \n电子记录比纸质记录更具可塑性。它们易于编辑、复制，并在网络上传输。一段文本可能经过来自不同部门的数位作者的多次修订，这些作者可能相隔数千英里。“最终”版本可能被打印出来发送给组织外部的其他人，但讽刺的是，纸质版本是没人想保存的东西。\n\
  \n如果公司使用 EDI 或电子邮件，那么它每天还要处理也许数百条消息。每条消息都相当于一张纸——一份订单表格、收据确认、会议议程——通常会至少暂时保存。其中一些消息需要保留，与账目、合同和法规合规相关。其他消息，例如通知全体员工新任命或食堂营业时间变更的电子邮件，可以视为一次性使用。\n\
  \n电子邮件可以即兴撰写并广泛传播，这为各种陷阱打开了大门。Skupsky 对这一问题进行了总结：\n\n\n\n\n\n> 当个人通过电子邮件进行交流时，他们经常使用“宽松”的语言，这种语言可能适用于内部对话，但在正式书面文件中则完全不合适。有些人使用反映个人观点或偏见的措辞，认为电子邮件是个人和私密的。法院案件现已确认，电子邮件既非个人也非私密。\n\
  \n> Skupsky D. S. ‘Establishing Retention Periods for Electronic Records’,\n> Records\
  \ Management Quarterly, April 1993: 40–9\n\n电子邮件已出现在许多法律诉讼中，尤其是在美国。例如，在 1999 年 6\
  \ 月，微软被迫在有关其网络浏览器软件营销的反垄断诉讼中公开一批内部电子邮件。这些电子邮件揭示了微软员工讨论如何反驳针对该公司提出的某些指控的方式（Anon 1999b）。也有判例认为电子邮件可以是“公共记录”，不应被销毁（如在白宫流传的电子邮件案例中）。在英国，一家健康保险公司的员工流传了对竞争对手公司作出不利评论的电子邮件。这些电子邮件构成了诽谤诉讼的基础，该诉讼在庭外和解，并支付了巨额赔偿（Nelms\
  \ 1999）。\n\n电子邮件的案例凸显了界定文件保留政策所涵盖的“文件”之难。随着业务应用越来越多地使用语音和视频技术，文件类型的多样性将增加。仅说明文件所涉及的内容将不再足够；还必须考虑它们存储的确切形式。\n\
  \n因此，保留政策应涵盖三个主要领域。\n\n* *政策所涵盖的文件定义*。这可以参照其主题、作者或可能的未来需求的性质来确定（例如，可能与诉讼相关的文件）。定义应尽可能使用精确的术语（例如，使用“17\
  \ 岁以下儿童的记录”而不是仅“儿童的记录”）。\n* *涵盖保留期限的规则*。这些规则应指明保留的时间段以及该期限的起始日期。例如，是记录创建的日期，还是最后更新的日期？规则还应明确说明在此时间之后记录*可以*被销毁，还是*必须*被销毁（如某些数据保护立法所要求）。\n\
  * *记录存储的媒介*。在当前政策中，这被假定为纸张。一些政策会特别提及装订本或卡片，或其他可供人阅读的媒介，如缩微胶片。未来，在此项下将不得不包含大量内容，以规定磁性和光学文件如何保存，并附带在必要时将经过认证的副本制作到新媒介上的相关程序。\n\
  \n此处展示了为英国国家医疗服务体系建议的政策示例。英国商业记录保留的法律要求的全面指南由伦敦特许秘书与行政人员协会出版，并定期更新（最近一次更新于 1997\
  \ 年）（ICSA 1997）。\n\n## 10.6 Questions\n\n1. 你被提供了一盘磁带，据说其中包含一台刚安装在你工厂里的新设备说明书文本的副本。你没有任何其他信息。为了能够阅读和解读磁带上的信息，你还需要知道什么？\n\
  2. 在 PC 上启动文字处理软件包，并查看其提供的选项，查看（a）读取由软件的旧版本创建的文件以及其他供应商软件创建的文件的能力，以及（b）创建可被*其他*文字处理软件读取的文件的能力。（提示：查看有关文件转换的帮助屏幕可能是个不错的起点）。评估一下*为什么*你认为供应商提供了这种特定的转换功能组合。\n\
  3. 一家公司在其计算机系统上生成了一张图表，打算将其作为专利申请的一部分。它希望能够证明该图表是由 Baffle 教授在特定日期创建的，并且希望能够以黑客无法理解的形式将其电子存储。应如何实现这些目标？\n\
  4. 为你熟悉的计算机系统（例如你自己的 PC，或办公室会计系统）制定并记录一份简单的记录保留政策。特别注意那些几年后可能需要作为证据或参考的记录。\n   制定政策后，诚实地评估你认为自己能够遵守该政策的程度。从中，找出在典型组织中可能阻碍良好记录保留实施的两个或三个主要阻力因素。\n\
  5. 一家人寿保险公司有一个文件，其中列出了其所有客户账户的详细信息，包括他们当年支付的保费。该文件以电子形式保存在磁盘驱动器上。\n   该公司希望对该文件制作一份归档副本，以备将来出现任何疑问或质疑时，可作为客户账户状态的证据。你会建议采取哪些步骤，以确保公司能够证明该文件是在所声称的日期创建的，并且此后未被更改或添加？\n\
  \n# Part 5 Computer Audit\n\n## Introduction to Part 5\n\n审计员与其他许多专业人士一样，很容易落入他们被世界其他人误解的想法。他们被视为各种各样的财务侦探，其主要任务是嗅出欺诈，或是热衷于控制的狂人，痴迷于执行规则和法规。与审计员的会面可能与去看牙医一样令人期待。\n\
  \n`Part 5` 主要关注计算机审计员的角色。他们有时可能有略微不同的职位名称，例如 IS 审计员，或内部审计员（计算机系统）。然而，在许多组织中，“计算机审计员”这一概念已扎根，并且在整个\
  \ `Part 5` 中使用此称谓。对计算机审计的描述旨在消除围绕它的一些 lingering 怀疑（例如，它是具有专制倾向的极客的磁铁）。事实上，一名熟练且热情的计算机审计员可以预先防范许多类型的问题，并通过改善系统的稳定性和控制来帮助实现成本节约。\n\
  \n严格来说，审计员只提供建议和评论。如果需要采取行动，应由管理层以正常方式进行。理论上，计算机审计员的建议将由具有特定责任的人实施，也许是信息系统安全官。然而，并非总是可行地以如此明确的方式分配责任，而\
  \ `Part 5` 探讨了实践中发展起来的一些关系和妥协。\n\n\n\n\n\n进一步的章节随后专门讨论了正在兴起的计算机取证领域。该领域关注的是确保从信息系统中收集到的证据是准确的，并且作为证据是有效的。这可能需要大量的细致工作，尤其是如果调查的任何迹象都不应透露给被怀疑有不当行为的人。这种调查在公众的想象中似乎是审计工作的主食，但在实践中却相对罕见。总的来说，希望第\
  \ 5 部分能提供一个有用的指南，说明计算机审计员*真正*做些什么。\n\n# 第十一章 计算机审计 新系统的引入\n\nDOI：[10.4324/9780203992319-17](https://dx.doi.org/10.4324/9780203992319-17)\n\
  \n## 11.1 计算机审计员的角色\n\n当公司首次开始将核心会计系统转移到计算机上时，很快就变得显而易见，某些传统的审计方法根本行不通。以前依赖表格和备忘录的过程现在被隐藏在计算机的“底层”之下。为了检查到底发生了什么，现在有必要考虑在其内部运行的程序的逻辑。传统审计员不确定应如何处理这种新技术，这种技术缺乏今天理所当然的用户友好功能，对于非技术人员来说可能相当令人困惑。作为回应，一种新型的专家出现了，最初被称为\
  \ EDP 审计员（即“电子数据处理”）。EDP 是与早期大型机系统相关的术语，随着计算的传播和多样化，更合适的做法是将名称改为“计算机审计员”。有时也使用“IS\
  \ 审计员”这一术语。\n\n真正的“审计”应由完全独立于负责安装或运行系统的人员的人来执行，并且在接下来的章节中假设了这种地位。人们在进行各种检查和调查时常自称从事“审计”工作并不罕见；或者技术人员可能会被指派代表内部审计部门从事“计算机审计”工作，即使他们的常规汇报线在其他地方。如果审计部门规模小或资源不足，这可能确实是唯一可用的选择。\n\
  \n理想情况下，企业治理将得到最好的服务，如果计算机审计成为内部审计职能不可分割的一部分，并在其指导下进行。这将其牢固地置于更广泛的内部控制框架之内，而这些控制又将受到外部审计师的审查。\n\
  \n在实践中，担任计算机审计员角色的人通常是从编程和系统设计的工作中转过来的。他们通常起初对审计的规则和方法只有粗浅的了解，但通过在审计团队中工作，他们通过实践经验获得了这些技能。与此同时，他们将帮助开发处理基于新技术的系统审计所需的工具和程序。\n\
  \n计算机审计领域一直在迅速发展，但关于计算机审计是否可以真正被视为一种独立的职业或专业仍存在许多不确定性。因为在信息时代，让*任何*类型的审计员都无法处理至少是计算的基本方面是没有意义的。这已为世界各地的专业会计机构所认识到，他们稳步在其课程中引入了更多与\
  \ IT 相关的元素。然而，要同时精通*审计*和 IT 仍然极其困难，尤其是在跟上技术方面不断创新的情况下。因此，审计团队很可能仍需要征用和培训那些主要专长是技术的人才。\n\
  \nIT 对内部和外部审计的工作都产生了重大影响，但“计算机审计员”这一称号通常保留给在内部审计团队工作的那些人。提供外部审计服务的公司已开始雇用和培训大量 IT\
  \ 专家，部分原因是帮助发展他们蓬勃发展的咨询副业。由于外部审计是一个竞争非常激烈的行业，它也很大程度上依赖于计算机化工具，这些工具有助于提高审计计划的效率及其结果的分析和呈现。在这些领域工作的审计员可能仍然不会认为自己以任何特殊方式是*计算机*审计员。这部分是因为他们理所当然地认为，如今他们将不得不处理绝大多数客户的计算机系统，部分原因是因为法律和会计职业非常明确地定义了公共审计中必须实现的目标——拥有纯粹的“计算机”版本是没有多大意义的。\n\
  \n外部审计可以追溯到十九世纪末，当时几个国家的会计专业机构成立，政府开始强制进行审计，以保护股东的利益。外部审计的重点仍然是每个财政年度末报告和账目的公布。重点是为股东提供保证，即他们的资源被有效使用，并确认已公布账目中的信息未受欺诈或错误污染（Sherer\
  \ 和 Kent 1983）。这要求充分了解客户的会计系统的工作方式，但与此同时，外部审计师往往不得不依赖内部审计师已设立并核证的检查和控制。由于时间和资源的压力，外部审计师很难对安全和控制机制进行任何实质性的深入调查。\n\
  \n相比之下，*内部*审计是一个年轻得多的职业。例如，美国内部审计师协会成立于 1941 年。内部审计师的角色以务实的方式演变，回应了组织，特别是大型组织感受到的需求，即他们应该有某种方式来检查规则和程序是否得到正确执行。这最好通过让一个与他人稍有区别的人或部门负责，并能提供独立的观点来实现。这种独立性可以通过让审计师直接向审计委员会报告来加强（尽管其有效性受到了质疑（Wolnizer\
  \ 1995））。或者，内部审计可能有一个更常规的汇报线，通常向财务总监汇报。在最糟糕的情况下，它可能只不过是一个象征性的存在，基于对会计部门中某个不幸人员分配的几乎看不见且非常兼职的责任。\n\
  \n内部审计主要关注财务交易，但可以扩展到行政的其他领域。其角色未由立法定义，因此组织可以自由地以他们喜欢的任何授权设立它。例如，他们可能会决定审计员应参与新系统选择和设计的非常早期阶段，并期望他们为所有后续阶段做出贡献，直至最终实施。在其他情况下，他们可能希望审计员更低调，仅在要求时提供建议。审计员参与所有系统项目并非必不可少，只有在*相关*项目中以*适当*的方式参与即可。其含义将在以下各节中讨论。\n\
  \n\n\n\n\n内部审计人员长期以来一直被其他员工持怀疑态度，被认为具有“执法”角色，尤其是在查处欺诈方面。然而，一本权威教材（Venables and Impey\
  \ 1991）认为他们至少还应承担另外四项责任：\n\n* 防止和发现错误；\n* 消除浪费（源于规划和控制不善、资产缺乏维护等原因）；\n* 确保管理报告基于准确可靠的信息；\n\
  * 检查是否遵守相关法律法规。\n\n内部审计人员不能期望在所有这些领域运作而不侵入他人的职责范围。例如，管理会计师负责生成报告，而大多数经理认为消除浪费是他们的责任，特别是如果他们从事运营管理或质量保证等领域。良好的内部审计建立在各方之间的协作意识之上，只有当事情严重脱轨时，审计人员才会采取更对抗的立场。上述责任清单中的一个有趣特点是，它们都涉及对信息系统完整性和安全性进行核查的要求。因此，`computer`\
  \ 审计员的角色在这里自然契合。\n\n计算在内部和外部审计中的作用总结于 Figure 11.1。正如 Figure 11.1 所暗示的那样，计算机审计员将成为与外部审计公司\
  \ IS 专家联系的有用渠道。她能够协助从系统中提取数据，代表外部审计师运行测试，并查找他们所需的任何技术文档（如程序流程图）。如果组织运行的系统在国际上运作，她还应能够提供网络的协调视图，以及适用于国家边界的任何自动化控制。许多外部审计公司还设有咨询部门，渴望帮助实施新的控制和对策。这会引发微妙的伦理问题，即审计是否被用作咨询业务的“钓鱼之旅”。同样，审计员的专业知识可能有助于判断此类咨询是否有用。\n\
  \n![Figure 11.1 ](img/fig11_1_B.jpg)\n\nFigure 11.1 \n\n## 11.2 系统开发的审计\n\n定制或“量身定制”软件的衰落曾被多次预测，尤其是由打包解决方案供应商提出，但仍有许多情况企业更愿意选择这种方式。例如，政府部门可能必须根据该国独有的规则和立法实施系统，或企业可能为自己设定创造独特服务以超越竞争对手的目标。定制软件通常规模庞大，对组织的一项或多项核心活动至关重要。因此，关于其可审计性以及应设计其中的控制机制的问题，最好在早期阶段就进行讨论。\n\
  \n关于计算机审计员是否应参与这些早期阶段，可以有两种不同的观点。一方面，早期参与应确保所有适当的控制作为基本设计的一部分被纳入，而不必以后作为事后考虑“临时加上”。由于任何增添和更改往往随着软件项目进入后期阶段而变得越来越昂贵，这表明计算机审计员的早期干预应有助于降低开发成本。另一方面，如果审计员与项目过于密切地参与，她可能很难保持独立性和公正性。她可能会发现开发团队的态度影响了她：例如，团队可能非常重视满足截止日期，从而形成一种风险更可能被接受、走捷径的氛围。\n\
  \n对美国一家领先公司内部审计人员的调查表明，让他们在项目中担任“参与性”角色显著提高了他们的工作满意度（Allen 1996）。这种对“亲手操作”角色的享受同样可能适用于计算机审计员。然而，在积极参与设计和开发的过程中，他们在后期探究系统弱点时失去客观性的真实危险尤其存在，特别是如果内置控制的质量或适用性受到质疑。\n\
  \n无论计算机审计员的参与程度如何，其范围都必须在开始时明确界定，并由所有相关方达成一致。Mitchell（1995）建议将项目分为四个等级，其中最低等级表示敏感性低的项目，几乎不需要或不需要审计人员参与，而最高等级则意味着定期且持续的参与。在后一种情况下，应做出决定，计算机审计员应参加哪些会议，应将其列入哪些传阅名单，等等。\n\
  \n还应就开发的哪些方面应纳入计算机审计员的职权范围达成一致。可能的责任领域清单列于 Table 11.1。\n\nTable 11.1 Computer Auditor\
  \ Responsibilities During System Development Life Cycle (SDLC)\n\n| SDLC stage |\
  \ | Areas of involvement for computer auditor |\n| --- | --- | --- |\n| Initiation\
  \ | | Review security needs, investigate alternatives, and prepare proposals for\
  \ preferred alternative |\n| Requirement specification | | Provide definition of\
  \ security requirements, determine how quality assurance is to be applied to the\
  \ development of security features |\n| Design | | Specify security features in\
  \ more detail, and suggest methods for testing their effectiveness |\n| Construction\
  \ | | Assist in developing software features, oversee initial testing, and ensure\
  \ that features are properly integrated with the rest of the software |\n| Implementation\
  \ and testing | | Carry out final tests on security features in individual modules\
  \ and in the integrated system. Ensure that all security and control measures are\
  \ fully documented |\n\n## 11.3 非传统方法：软件包和终端用户计算\n\n对于内部软件开发，计算机审计员至少有参与可能影响安全的设计和编码决策的选择。然而，软件行业最近的发展却合力剥夺了这一选择。相反，计算机审计员不得不从较远的距离进行评估，而且不总是从一个很好的观察点进行。\n\
  \n在极端情况下，存在商业化软件包的“接受或放弃”性质。这些软件包可能声称包含访问控制、备份生成、文件和消息加密等功能。核实这些声明极其困难，因为大多数供应商将产品的最内在细节视为专有。计算机审计员将无法检查源代码，因为产品将以“目标”代码形式交付，可直接在机器上运行。同样，也不会有程序流程图可供参考，除非是为营销目的制作的、非常肤浅的少数图表。\n\
  \n\n\n\n在另一极端，则是“自己动手”的编程工具，可用于在 PC 上创建简单的应用程序，例如 Visual Basic 和 Java。文字处理软件和电子表格等软件包中也内置了许多“定制”选项。这种大杂烩式的活动有时被归类为*最终用户*计算。对于因中央编程服务延误而感到沮丧、并希望组建一些简单的定制功能的部门来说，这种选择可能极具诱惑力。如果在敏感领域采用最终用户方法，风险会特别高，例如为个人信息数据库添加前端设施，或建立公众可访问的网站。除非采取措施控制局面，否则企业将完全暴露在对热心业余爱好者编写的程序的依赖风险中。计算机审计师控制这些开发的能力将微乎其微，因为在大多数情况下，她将对这些开发一无所知，处于一种幸福的无知状态。\n\
  \n在两个极端之间还有许多其他选择，其中大多数引发的控制问题同样棘手。软件包可能包含一些标准模块，以及一些可“裁剪”以满足客户需求的模块。现有软件的增补或扩展可能委托给外部编程承包商（他们可能在完全不同的地点远程办公，甚至可能在另一个大陆），或委托给实习学生。互联网站点和杂志赠送的\
  \ CD-ROM 上也流通着无数代码片段，声称能提供有用的业务功能。过去可以通过中央编程部门自然强制执行的许多严谨性几乎已荡然无存。计算机审计师现在必须制定策略，确保所有信息系统开发——即使那些乍看之下后果微不足道的开发——都纳入其管辖范围。\n\
  \n计算机审计师可能面临的其他问题包括以下几点：\n\n1. *需求蔓延*。当委托软件开发的人开始改变主意，对软件功能提出新要求时，就会发生这种情况。这是内部软件开发中的常见问题，但在这种情况下，后果虽昂贵，却可通过修订软件规格说明来解决。试图修改现成软件包的成本可能更高，而且会破坏最初用于证明采购软件包合理性的大多数优势。一个例子是命运多舛的\
  \ TAURUS 项目，该项目始于 1988 年，旨在实现伦敦证券交易所的计算机化。项目团队决定以 Vista Corporation 的一个软件包为基础，但随后意识到需要进行大量更改，以使其适应英国而非美国的交易惯例。Drummond（1996:\
  \ 102）对此描述道：\n\n> 修改工作成了一个问题。Vista Corporation 不是一家软件公司，而是一家拥有一款成品软件的企业。他们习惯只做微小修改，根本无力承担证券交易所现在要求的大规模重写工作。\n\
  \n从完整性和安全性的角度来看，对软件包的修改导致了一个无解的局面。如果供应商在一个小众市场运营，不太可能拥有进行重大更改的资源（如 Vista 的情况）。如果产品服务于一个大得多的市场（例如小企业会计或\
  \ EDI 消息传递），其售价将因规模经济而大幅降低，且错误和故障本应已被早期用户暴露出来。即使供应商愿意提供修改，现在的收费标准也将是通常与定制系统相关的较高费率，且极有可能引入新的错误。\n\
  \n2. *认证标志与标准*。供应商可能会引用各种标准，以证明其产品的质量或安全性。一个例子是与数据安全相关的 ISO 7498 系列标准。（其中一些标准的详情见第\
  \ 14 章）。在依赖这些标准之前，应铭记两点考量。首先，某些标准可能并不特别相关。例如，根据“橙皮书”（见第 14.3 节）的规定，许多类型的安全特性可按从\
  \ A1（优秀）到 C2（最低）的等级评级。然而，这些评级主要与集中式系统中的保密性保护相关。例如，它们无法保证系统能抵御病毒攻击、检查消息是否被篡改，或执行商业环境中可能需要的其他功能。其次，评级只能反映产品的*潜在*能力。如果安全特性未能以称职的方式实际实施，产品拥有的任何质量评级将迅速变得无关紧要。\n\
  \n3. *安全管理功能*。安装后，安全管理员将需要不时更新用户授权，计算机审计师将希望查阅审计踪迹信息。如果与系统的交互笨拙，或文档晦涩难懂，这些功能的使用将受到阻碍。这也可能表明整体设计存在弱点。对于软件包，至少应能在实际运行的系统上看到相关功能的演示，并询问其他用户站点是否遇到过问题。对于最终用户计算，作者不太可能在编程工作中充分考虑安全或审计影响，其工作甚至可能破坏原有的控制措施。\n\
  \n4. *与现有软件的集成*。这将关乎安装软件的人员，但也对内部控制有影响。软件包将有自己的约定，涉及最大允许密码长度、非活动用户超时、增量备份等特性。最终用户程序可能没有此类约定，或依赖标准产品的约定。如果用户习惯了高度集成，例如系统提供单点登录或统一的备份方法，这将是一个特别的问题。\n\
  \n## 11.4 系统测试与实施审计\n\n有大量记录在案的 IT 项目彻底“脱轨”的案例，且关于导致此类项目失控因素的文献也日益增多（Beynon-Davies\
  \ 1995，Drummond 1996，Keil 1995，Margetts 和 Willcocks 1993）。如果项目严重偏离轨道以至于被取消（这种情况有时会发生），后果可能严重影响组织的财务状况及其高级管理层的信誉。然而，如果旧系统在灾难期间持续运行，则不一定会有任何安全风险暴露。\n\
  \n\n\n\n危险的明显迹象是，在旧系统被新系统取代的过程中，项目问题丛生，并且很明显新系统无法达到预期。伦敦外交部（FCO）在 1990 年的经历提供了可能发生情况的一个例子。FCO\
  \ 曾委托开发一套新的会计系统，在长达 2 年的转换项目中，该项目从一次危机挣扎到另一场危机。最终，FCO 被迫采用新系统，尽管它远未达到可接受的标准，因为旧系统崩溃且无法修复。\n\
  \nFCO 按照所有正确的原则规划了新系统的实施。投入使用前，使用虚拟会计信息对新系统进行测试。还将有一段并行运行期，在此期间旧系统仍作为备份，以防新系统失败。然而，新系统的问题如此可怕，以至于在允许的并行运行期间，员工试图通过将分录转入特殊的“转储账户”来弥补软件中已知的错误。转储账户的内容从未得到妥善梳理。最初尝试将新系统中的数字与旧系统得出的数字进行核对时，发现差异约为\
  \ 4600 万英镑（UK Accounts 1991）。没有理由认为这笔钱已经消失，后来通过粗略的账目平衡最终得以实现。然而，在几个月的时间里，FCO 依赖的会计系统缺乏任何内部控制，完全无法审计。\n\
  \n项目混乱当然也可能源于从一开始就竭力排斥审计人员的关注。1993 年，加州机动车管理局最终被迫取消一项升级其驾驶执照数据库的项目。在投入约 5000 万美元于该项目期间，采用了各种手段来掩盖项目的资金方式，并且不断提供关于正在进行工作的过于乐观的报告。Collins（1997:\
  \ 228）指出：“如果有定期的独立核实或审计，欺骗测试行为本会被发现，因为审计人员应向首席执行官或其等同职位报告，而不是向计算机部门报告。”该案例很好地说明了需要由内部审计职能指导*所有*审计，并与组织负责人保持直接沟通渠道的必要性。\n\
  \n必须对项目的技术可行性“吹哨”的前景，使计算机审计员处于无疑感到非常不舒服的位置。这是对她忠诚度是否在于应用开发团队，还是整个组织的终极考验。然而，如果审计员不愿意采取此类行动，那么一开始设立审计角色就毫无意义。\n\
  \n在大多数项目最终取得某种成功的情况下，计算机审计员的目标将是：\n\n* *验证设计中规定的预防性控制和反馈控制是否运行并有效*。这可能意味着在强调将软件更具生产力的功能“推向市场”时，坚持要求优先考虑这些控制。控制很容易被视为可选项或额外负担，如果时间资源紧张，可以留到以后再做。控制的测试也可能遭到抵制，因为其中一些控制（尤其是访问控制）只有在软件的所有要素整合在一起，接近发布就绪时才能完全测试。\n\
  * *确保所需的并发控制已到位*。并发控制使计算机审计员能够在软件日常使用中检查其中的流程。它们将在第 12.3 节中进一步讨论。\n* *确保控制得到充分记录*。控制的目的、它们在软件中的构建位置以及预期使用方式不应存在任何神秘之处，所有这些都应在文档中进行说明。\n\
  * *检查是否已为变更管理做出安排*。不可避免地，软件投入生产后会进行修改和升级。其中一些变更将涉及安全问题。变更管理系统应确保在考虑此类变更时，计算机审计员会收到通知。\n\
  \n## 11.5 问题\n\n1. 计算机审计员是否应积极参与软件开发项目？探讨计算机审计员参与系统开发生命周期不同阶段的利弊。\n2. 描述计算机审计员在评估和实施控制时可能面临的一些困难：\n\
  \    1. 在为专业市场服务的软件包中，以及\n    2. 在由工资部门的行政助理编写的 JAVA 程序中。\n3. 你负责一个内部审计部门，正在尝试任命一名计算机审计角色。你可能对以下每种可能性会预见到什么缺点？\n\
  \    1. 一家营销安全软件的公司提出让你免费使用一名“审计顾问”一个月。\n    2. 任命一名来自 IT 服务部的系统程序员，他自 30 年前安装第一台大型机以来一直从事这份工作。\n\
  \    3. 任命一名 25 岁的自称“专业资格”的计算机审计员。他在一家使用与你公司完全不同的计算机系统的公司担任计算机审计员已有 3 年经验。\n4. 你是一名初级经理，刚刚获得使用雇主开发的全新人力资源应用的权限。当你登录新系统时，你惊讶地发现你可以浏览最高级经理以及公司其他各部门员工的个人档案。可能出现这种疏漏的原因是什么？在哪些情况下你会认为计算机审计员负有过错？\n\
  \n# 第十二章 现有系统的计算机审计控制\n\nDOI: [10.4324/9780203992319-18](https://dx.doi.org/10.4324/9780203992319-18)\n\
  \n## 12.1 引言\n\n1973 年，美国 Equity Funding Corporation 发生了一起大规模欺诈案被曝光。该公司严重依赖计算机的使用，计算机被用来大规模虚构保险客户。某一阶段，甚至编写了一个程序来创建数千条不存在的保险单记录，总价值达\
  \ 4.3 亿美元。公司许多员工积极参与了欺诈。该案例生动地说明了计算机在完全缺乏有效内部控制的情况下，能够迅速生成大量看似真实的数据的强大能力。\n\n\n\n\
  \n\n这种事情今天不可能发生。还是有可能呢？一位审计员指出，导致 Equity Funding 控制失败的许多因素（这些失败又因外部审计师的严重无能而加剧）在现代环境中很容易再次出现（Hancox\
  \ 1997）。从技术上讲，识别出正在编造虚假记录的计算机程序并不困难，而且理想情况下在它接近生产系统之前就应提出质疑，使用上一章概述的程序。然而，还有许多其他方式可以使\
  \ rogue 程序和其他未经授权的修改进入生产系统。计算机审计员的挑战是尽可能使之变得困难，并在发生时能够迅速检测到。\n\n今天的计算机审计员可以利用比 1973\
  \ 年时更令人印象深刻的一系列工具来监控和调查系统。此外，计算机审计员的地位已经提高，人数也更多。与此同时，Equity Funding 案例中显现的诱惑并未消失。计算机审计员仍可能受到压力，不要“兴风作浪”或提出不雅的问题。计算机审计的价值可能会受到质疑，尤其是在财政紧张时期，它可能觉得有义务寻找证明其存在的方式。这可能促使人们努力在组织内部推销自己及其服务。一位顾问将其总结为敦促审计员“创造价值——搞政治”（Krull\
  \ 1995）。计算机审计*可以*很容易被视为对每个人的时间和资源的一种非生产性消耗，在某些情况下，宣传其带来的好处是合适的。然而，赢得朋友的过程绝不应发展到创造一种义务感，无论这种感觉是模糊的还是表达出来的，都可能使审计员的独立性和诚信受到质疑。\n\
  \n计算机审计员应寻求在何种制度下运作？本章集中讨论三个有助于持续成功审计系统的因素。\n\n* 必须能够确定系统中每个部分安装了什么，并识别所有已进行的更改和修改。\n\
  * 内置于系统中的内部控制机制必须定期检查，以确保其正常工作。\n* 执行计算机审计职能的人员必须具备适当的专业技术和审计技能组合。\n\n## 12.2 变更管理与控制\n\
  \n成功的企业依靠不断变化而蓬勃发展，这往往反映在对其计算机系统的要求上。变革的压力来自各方，因为人们希望使系统运行更高效，或利用技术新发展，或改善为用户提供的服务。如果变更未得到妥善管理，系统将开始出现不需要的副作用，通常表现为无法解释的问题和故障。正如一位专家所尖锐指出的：“如果软件永远不改变，大多数安装很快就会实现大幅提高的生产服务水平——生产问题会减少并几乎消失”（Williams\
  \ 1994）。作者完全可以补充说，这种稳定性也会消除计算机审计员的大部分工作。\n\n由于安装不可能原地不动，因此需要建立程序来跟踪所有发生的变更。对复杂的变更跟踪的需求在早期的大型机上就已得到认可，当时需要不断地对软件进行升级和修复。很快就变得显而易见，最好的组织方式是利用计算机本身的强大功能，通过\
  \ IBM 的系统修改程序等产品来实现。此类程序会记录机器上运行的所有内容，并积累已添加的所有变更的知识。与此同时，在应用开发部门，正在开发类似技术来帮助程序员跟踪大型软件开发项目中编写的代码模块。此类技术通常被称为*变更管理*。变更管理数据库最终可能持有相当数量的数据，但其中大部分数据都源自单个站点。因此，很容易查明谁提供了数据，或定位并识别其描述的特定软件和设备。\n\
  \n随着 IT 开始分散到整个组织，收集有关正在发生的事情的信息变得极其困难。特别是 PC 用户开始“自行其是”，通过自己的预算添加设备和软件，而不通知任何人。人们尝试将变更管理的思想应用于此，以带来某种秩序。结果是一套新的技术，这些技术通常再次被纳入专门的支持软件中，被称为*配置管理*。\n\
  \n配置管理之所以复杂，是因为多个不同方可能希望发起变更，除非采取适当的行政控制，否则几乎没有东西能阻止他们为所欲为。该情况在 Figure 12.1 中有所说明。\n\
  \n![Figure 12.1 Configuration management: the pressures for change](img/fig12_1_B.jpg)\n\
  \nFigure 12.1 Configuration management: the pressures for change\n\n可能想要的变更类型的示例包括以下内容。\n\
  \n* *管理层*可能希望引入新设施来帮助业务运营，例如在线日历或电子公告板。或者他们可能受到外部立法施加的压力，例如引入符合健康和安全要求的新型视觉显示屏。\n\
  * *用户*可能对收到的服务不满意，也许是因为响应时间缓慢，或他们认为菜单屏幕设计不良。\n* *供应商*会有他们希望应用的修复和升级，特别是为了消除软件中的错误。\n\
  * *IT 部门*将不断审查基础设施的可靠性和容量，并可能希望采取安装新的局域网电缆或升级网络管理软件等行动。\n\n计算机审计员也偶尔可能希望提出变更建议，但就其而言，他们的主要目标将是确保所有由*其他人*请求的所有变更都得到妥善管理。这不是计算机审计通常会自行承担的工作。配置管理的管理通常由\
  \ IT 部门承担，对其而言，完整的设备登记册对于规划其大部分工作至关重要。现在有许多商业软件产品可帮助维护设备登记册及其上安装的任何软件。更高级的版本能够通过网络直接从\
  \ PC 检索信息，从而获取其中大部分信息。\n\n从计算机审计员的角度来看，变更和配置管理的登记册是有帮助的。\n\n\n\n\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\
  \n在表达式`cvar = avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`\n\n在`List.of(arg0,\
  \ arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd\
  \ arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\
  \n\n\n\n不同类型的测试针对的是降低不同形式的风险。控制测试旨在降低 `control risk`。控制风险仅涵盖那些控制 *应当* 消除的风险；换句话说，如果所有控制都完美运行，控制风险将被降至零。实质性测试旨在针对\
  \ `inherent risk`。固有风险源于错误和每个人都意识到可能发生的情形的存在，而这些情形无法轻易控制，也许因为它们源于组织之外。审计师试图识别所有此类风险，以便集中关注认为可能发生风险的领域。第三类风险有时会被加上，即\
  \ `detection risk`。这有点更晦涩，因为它旨在涵盖审计师未能识别的所有风险。由此可知，查核风险实际上永远无法被衡量，但它为审计师提供了一个有用的目标，审计师不断努力降低它。\n\
  \n审计师在分析风险时的目标与 Chapter 2 中更一般地概述的风险评估目标基本相同。他们旨在使用客观且可量化的测量，并且他们预期新的和不熟悉的风险会不断出现，他们必须设法预见。然而，上述提到的风险类别是由审计师为审计师定义的，不一定与其它专业人士使用的风险类别相匹配。\n\
  \n审计师考虑进行的任何检查都是专门针对一个或多个风险类别的，这为审计提供了有用的框架。一些个人风险分析领域也已被审计师特别很好地发展，例如对记录的抽样，以确保它们是整个文件的适当横截面。一般来说，计算机审计师面临的查核风险比传统审计中预期的要多，并且不会那么依赖正式技术。例如，如果\
  \ PC 以不受控制的方式被获取，或者如果没有变更管理，就不需要深入分析就能看出风险很高。\n\n特别是在更大、更复杂的系统中，检查可能基于为此目的而特意“植入”的设施。这些被称为\
  \ `concurrent` 审计技术。并发技术的两个例子是：\n\n*   `Integrated Test Facility (ITF)`。这允许将虚假或“虚拟”交易输入到系统中。这些将被选择为尽可能棘手，以考验所涉及流程的能力。之后结果将与独立计算进行核对（如上所述的实质性测试）。使用\
  \ ITF 的问题在于交易不得出现在任何“真实”的账户、库存等中。这可以通过两种方式解决。第一个可能性是设计一种对虚拟交易进行标记的方法，使其正常处理，但所有结果都被转移到一个特殊的测试文件。这避免了对现实记录的更新，但给应用程序代码引入了额外的复杂性（以及可能的新错误）。第二个选项是跟随原始交易进行一个完全相反的交易，旨在将文件恢复到如果什么都没发生时的状态。这也存在一些轻微的危险，例如，如果冲销操作不正确，或者有人在冲销生效之前基于文件中的信息做出决策。\n\
  \n*   `Snapshot techniques`。这同样需要添加额外的软件，这次用于追踪交易每一步发生的情况。通过拥有一个跟踪程序来“拍摄快照”，该程序会保存诸如从磁盘驱动器读取的字段内容以及计算的中间阶段等信息。它可以与医生向患者注射放射不透明染料以便在\
  \ X 射线图像上跟踪其进展相比较。审计师随后可以将所有快照信息放在一起，并将发生的情况与 *应当* 发生的情况进行比较，后者根据程序文档和其他地方规定的逻辑确定。\n\
  \n其他并发技术基于嵌入审计模块，这些模块检测并记录某些类型情况的细节（例如，涉及超过一定金额的现金支付的所有交易），或特定的审计“钩子”，当发生意外活动时发出警报，例如尝试从已被指定为休眠的账户中取款（Spiram\
  \ and Sumners 1992）。\n\n## 12.4 Competencies Required of Computer Auditors\n\n如果计算机审计师要使用诸如并发测试之类的技术，这意味着要对实时系统的内部代码进行干预，那么确保他们具备必要的技术能力似乎是明智的。对计算机审计师来说，拥有良好的个人素质也很重要，包括外交手腕（这对于那些具有严重技术倾向的人来说并不总是自然的），以及一定的坚韧性和主动性。\n\
  \n不出所料，关于计算机审计师应如何培训和考核的问题一直存在很多争论。其中最悠久的方案之一是由美国的 信息系统审计与控制协会 (`ISACA` 2000) 运营的。要根据该方案成为认证信息系统审计师\
  \ (`CISA`)，候选人必须具有系统审计的实践经验，并通过一项 4 小时的多项选择题测试（提供九种不同语言）。测试中略多于三分之一的内容涉及信息安全，其余部分涵盖系统开发和管理等更广泛的问题。获得资格的人预计要遵守道德准则，并接受继续教育。其他一些资格认证方案在\
  \ section 14.1. 中描述。\n\n诸如 `CISA` 之类的方案的主要成分与法律和会计等其他成熟的专业领域很相似。然而，计算机审计在确立其作为独立职业方面进展有限。怀疑这一领域的进展将继续缓慢主要有两个原因。\n\
  \n首先，很难定义一套核心技术技能。 section 12.3 中引用的一些技术，例如，意味着能够理解程序源代码和流程图，以及基于埋藏在操作系统深处的代码扩展的跟踪使用。计算机审计师还可以预期会被要求评估组织考虑采用的任何新“前沿”技术相关的风险。这都意味着需要相当高水平的技术能力。一份为英国零售商制定的职位说明书包括对系统开发方法论和实践、项目管理技术的了解，并指出这些实践技能应与“对本公司及其行业中的系统和流程的具体了解”相结合（Blackburn\
  \ 1997）。这表明组织最好“培养”自己的计算机审计师。在许多情况下，从 IT 部门招聘人员并培训他们掌握审计技术，可能比在外部寻找经验丰富的“专业”计算机审计师更容易。\n\
  \n\n\n\n\n这第二点，引发了关于计算机审计技能究竟有多可转移的问题。诸如 `CISA` 之类的资格认证可以保证某人理解典型计算机系统的基本要素，以及它们应如何管理的原则。它们也可能要求具备大量的审计经验。尽管如此，雇主可能会更优先考虑对企业实际使用的设备、操作系统和应用程序的深入了解。他们更愿意雇用一个由“偷猎者”转变为“护林员”的人。这种情况在计算机审计已得到充分建立的行业中尤为明显，例如金融服务业和公共服务的某些分支。\n\
  \n因此，计算机审计师在满足通常为“职业”所规定的标准方面存在一定的困难。认可方案仍相当初级，并且缺乏其他特征，例如在准入点的监管或某种形式的许可（Freidson\
  \ 1986）。相反，它们依赖于不太正式的认可，但这种认可却是真实且即将到来的，因为对他们专业服务的需求。实际上，这意味着计算机审计师只能凭借其技术技能来成败。有关计算机审计的出版物，与有关更成熟职业的出版物不同，主要关注技术问题。鉴于这种技术重点，毫不奇怪地发现计算机审计师经常与组织中其他对信息系统感兴趣的人广泛建立联系。与此同时，他们必须依靠与内部审计和会计等更成熟职能的关联来获得其地位和独立性。Figure\
  \ 12.2 给出了这一情况的简化视图。阴影区域描绘了一个区域，在该区域内，对 IT 的关注提供了共同纽带。在该区域内保持适当的合作关系并不总是简单的，并且存在各种潜在的冲突领域。\n\
  \n* *Site security*. 保护组织的员工和有形资产的措施越来越多地依赖于技术的使用。有时，可以进行有益的合作，例如如果计算机审计师需要知道员工是否在特定时间在现场，或者有机会将信息系统控制与执行物理访问的控制集成在一起。在军事或政府机构中，信息保密是首要关注的问题，这种安全职能将非常强大，与运行信息系统的人员有牢固的联系。\n\
  \n* *IS security officer (ISSO)*. 许多组织，特别是较小的组织，并没有正式任命的 ISSO。然而，通常情况下，IS 中央服务部门的某个人将负责监督安全。责任可能与管理密码和访问控制表相结合，使该角色非常技术化。设立\
  \ ISSO 的一个优点是，可以任命某人对业务的运作方式有更广泛的见解（Kovacich 1997）。\n\n* *IS central services*.\
  \ 该部门的成员将负责管理访问控制，并负责执行和应用本书其他地方所述的许多措施。理想情况下，他们将与计算机审计师密切合作，但执行和审计的角色应保持分离。安全管理涉及提供措施和强制执行合规性。审计师的存在是为了充当看门狗，并提供客观的审查和建议。这种关系是否富有成效，将取决于组织内的舆论气候。对美国\
  \ 300 多名信息系统经理的一项研究显示，通常情况下，他们对 IS 审计师的技术技能评价不高，并且认为无论如何他们都没有足够的资源来实施审计师的发现。他们尽管如此仍感到有强烈的压力去采取行动。绝大多数（85%）拒绝了审计师是合作伙伴或仅仅是顾问的想法，并持更传统的观点，认为审计师具有对抗性的“警察”角色（Hunton\
  \ and Wright 1995）。\n\n* *IS local services*. 服务管理是否下放到地方层面，将在很大程度上取决于组织的架构（参见 section\
  \ 3.3）。在这一层面，计算机审计师也可能发现一种 somewhat 对抗性的氛围，特别是如果文化是对“总部”职能普遍不信任的话。这使得激励员工确保合规变得困难。考虑一下\
  \ Gordon 在处理她银行时引用的一个事件。Gordon 女士希望更改其账户适用的其中一个条件，并出示了一张已取消的支票以表明账户号码。账户详细信息随后由银行职员修改，Gordon\
  \ 女士被邀请为电话访问选择新的 PIN 码。Gordon 女士（1999）指出：\n> … 在任何时候，我都没有被要求出示照片身份证。我以前从未见过这位职员，她也不认识我。我拿出我的护照，上面与我的银行账户姓名不同，并说：“你忘了要求这个。”她瞥了一眼，说：“好的，谢谢！”就这样结束了。\n\
  也许 Gordon 女士遇到的职员不知道规则。更可能的是，她知道规则，但并不特别认为它们有什么意义。扭转这种态度需要不断地滴灌式观察和解释。计算机审计师可以采取的一种方法是确保技术人员充分了解安全措施，希望他们会主动向周围的其他员工解释和证明这些措施。\n\
  \n* IS suppliers. 供应商通常向做出采购决策的管理人员销售产品，但如果安全被视为产品的强项，计算机审计师将成为目标。此外，计算机审计师可能会被要求处理供应商提供\
  \ IS 安全产品和服务的探索性方法。这是一种收集信息的有用方式，但审计师必须注意不要显得与任何一家供应商结盟，这与审计师独立性的主张并不相符。\n\n![Figure\
  \ 12.2 ](img/fig12_2_B.jpg)\n\nFigure 12.2 \n\n尽管在这种以技术为主的领域中运作，计算机审计师也需要警惕审计世界总体上发生的某些地震式转变。例如，在\
  \ 1992 年，美国会计的发起组织委员会（`COSO`）审查了内部控制的性质和目的。它建议应更多关注组织中人员的总体诚信、道德价值观和能力水平等所谓“软”因素。这反过来又引发了关于内部审计与外部审计之间适当角色的新辩论。另一个美国机构（内部审计师协会研究基金会）最近资助的研究表明，世界各地的企业开始将以前分开的风险管理职能整合在一起，包括内部审计、质量保证和健康与安全。项目主管预测，“风险管理与保证将被视为管理的一个维度。在这种情况下，内部审计消失在管理过程中”（`IIA`\
  \ 1998）。内部审计是否真的会被以这种方式吸收，以及计算机审计是否会随之被吸收，还有待观察。\n\n## 12.5 Questions\n\n\n\n\n\n\
  1. 你部门的所有员工刚刚收到首席执行官的一封信。信中说明已安装了一个新的分析软件包，可以识别连接到公司网络的任何 PC 上安装的所有程序。信中抱怨使用该软件包发现部门里每个人机器上都安装了游戏。信中随后采取了威胁的语气，指出这严重违反了公司规章，可能导致纪律处分。\n\
  经调查，你发现所指的游戏是随 Windows 软件标准提供的，而该软件最初是由中央 IT 服务安装的。起草一份简短的声明（1–2 页），说明你认为在未来使用该新分析软件包及其结果时应审慎采用的政策和程序。\n\
  \n2. 在办公室更换台式电脑的硬件或软件组件可能有哪些合理的商业原因？说明为什么必须以系统的方式跟踪和记录所有此类更改的 *三个* 原因。\n\n3. 你在一家严重依赖信息系统提供客户服务的金融服务公司工作。在这些系统控制出现一系列疏漏后，已决定聘请一名计算机审计员。\n\
  确定你认为此人应具备的 *五个* 重要能力，并按重要性顺序列出。\n\n4. Mega Corporation 设有中央信息服务部，其中一名高级员工担任安全管理员。在公司内部审计部内，有一个小型计算机审计员小组，其中一人负责中央大型机的会计相关问题。\n\
  描述这两个员工在工作中至少有两种共同点，以及他们的工作至少有两种不同之处。\n\n# 第十三章 计算机取证\n\nDOI: [10.4324/9780203992319-19](https://dx.doi.org/10.4324/9780203992319-19)\n\
  \n## 13.1 引言\n\n管理人员经常不得不基于直觉或怀疑行事。如果有迹象表明计算设施被滥用，本能的反应通常是采取一些先发制人的行动。例如，可能收紧访问控制制度，或重新分配员工职责；如果这样做是隐秘的，就无需对任何人提出指控，也不会损害良好的工作关系。与此同时，管理层传达了一个明确的信息，即不会容忍滥用行为。\n\
  然而，这些“温和”的做法并不总是合适的，在这种情况下，就有必要获取确凿证据并对肇事者进行对质。要成功做到这一点需要对 **计算机取证** 有良好的理解。计算机取证可能在以下情况下使用：\n\
  * 滥用行为如此公然和严重，以至于认为识别和惩罚肇事者很重要；\n* 管理层希望确切了解滥用是如何发生的，以便他们确信其对策会有效；\n* 组织因滥用而面临来自其他方的法律诉讼。例如，软件供应商因违反许可协议条款而提出的索赔，或关于在计算机系统中流传的材料具有诽谤性的指控。\n\
  在这种情况下，需要进行调查，其范围远不止于确定滥用是否发生。这些调查可被视为“取证”，与警察侦探工作相类比。它们旨在提供足够强有力的证据，以抵御被牵连者可能提出的任何质疑。\n\
  由于基于计算机的证据可能被迅速销毁，因此在不引起任何嫌疑人注意的情况下收集证据至关重要。证据还必须足够全面，以排除对事件的任何其他解释。即使组织没有打算将证据带上法庭，它也必须假设证据最终可能被迫走上这一方向，因此必须始终怀着这种可能性收集证据。一旦它对一名员工提出指控，该员工可能会寻求某种形式的正式审查，特别是如果存在惩罚性行动的可能性。这就有可能使证据最终必须在全面诉讼的背景下提出，在这种情况下，可以预期会尽一切努力对其进行\
  \ discredit。\n在理想的世界里，取证调查应常规进行，而不仅仅是在怀疑出现问题时进行（如第 264 页的案例 A）。不幸的是，此类调查无一例外地昂贵，而且在开始时很少能准确预测任何特定调查的费用\
  \ *有多高*。一旦开始，调查可能持续几天，也可能持续数月。调查人员的时间成本很高，因为他们必须高度熟练于在系统中寻找，使用复杂的搜索和分析工具。必须在保护和记录证据方面格外小心，这大大增加了间接成本。组织必然不愿投资于这种资源密集型的活动，除非存在严重的损失或犯罪似乎值得这样做。更不用说，如果一开始没有任何证据表明有什么特别问题，他们更不愿为此提供资金。\n\
  乍一看，取证调查似乎是组织自身计算机审计员的理想任务，但该领域的顾问强烈反对这种做法，而且并非完全出于自利。例如，Wilding（1997）指出，长期密切从事系统工作的人并不最适合发现其弱点。如果发现缺陷，他们可能会采取防御性反应，觉得自己在某种程度上负有责任。此外，他们可能对收集和存储证据相关的法律要求了解不足。\n\
  无论计算机审计员是否实际发起取证调查，他们的投入和协助在流程的各个阶段都是必不可少的。本章概述了当今“计算机侦探”可用的一些方法和工具。\n\n## 13.2\
  \ 获取有效计算机证据的技术和程序\n\n无论调查人员面对的是局域网上的两三台 PC，还是基于大型机的庞大企业系统，他们面临的第一个问题基本相同。从哪里开始寻找？一位大型系统专家总结了这个问题：“欺诈的证据通常埋藏在计算机上保存的数十万条有效记录之下”（Iyer\
  \ 1996: 396）。调查人员需要随身携带的第一件也是最重要的工具是能够帮助挖掘这些数据的软件。\n在基于大型机的系统中，此类工具可能是应用程序软件或操作系统不可分割的一部分。如果组织建立了企业数据库或数据仓库，或使用覆盖多个主要部门的应用程序软件，如企业资源规划，就尤其可能出现这种情况。合适的工具也可能在执行信息系统中提供，该系统使高级管理人员能够“向下钻取”企业数据，以调查各个单位的绩效情况。\n\
  规划者和预测者也可能在决策支持系统中拥有类似的设施，其目标也是从组织的各个部分检索数据，尽管目的不同。DSS 用户感兴趣的是整合信息，以便他们能够构建财务模型并做出预测。大多数时间，他们都在查看汇总数据并试图发现其中的显著趋势。\n\
  \n\n\n\n\n如果目标系统基于较小的机器，例如个人电脑，那么不太可能已经部署了合适的分析软件。一些小型公司或部门可能会包含一个强大的研究小组，该小组习惯于提取和监控数据，例如专门的债券交易公司，或质量保证部门。然而，更常见的情况是只找到普通的数据库和电子表格软件包。这些软件包具有相当强大的分析能力，但并不适合临时调查。数据通常需要转换为不同的格式，并且每个单独字段的布局都需要定义给软件包。此时，必须使用通用软件包中一些更晦涩的功能，而它们并不总是特别合适。\n\
  \n无论数据来自个人电脑还是大型机，专业调查人员更愿意使用自己的专用搜索和分析工具。他们在这些工具的使用上积累了技能和经验，并且知道可以期望得到什么样的结果。使用自己的工具也意味着他们可以自由地将聚光灯投向*任何*可能重要的数据，而不仅仅是恰好可以在为其他目的而设计的设施中访问的数据，例如\
  \ EIS。\n\n如果要分析的数据仅限于一个来源，例如个人电脑的硬盘，最好的选择是将其复制，以便在完全不同的系统上从容分析。调查人员出于其他原因也可能偏好制作副本。首先，可以制作一份副本用于分析，另一份副本可以制作并在受控条件下保存。如果怀疑日后可能出现关于磁盘当时到底包含什么内容的法律争论，这一点很重要。可以利用专有的复制系统在复制时添加完整性检查，例如，对每个数据块取哈希值并记录下来，并对副本进行加密。包含数据和所有相关哈希值的记录介质将被密封在防篡改袋中，并准备完整的文档，详细说明副本的取样时间、地点以及取样人员。\n\
  \n制作副本的第二个原因是这可以快速完成，如果必要的话，可以通过物理移除硬盘来制作副本。甚至无需打开个人电脑的电源。如果目的是避免提醒个人电脑的所有者，一切都可以在深夜秘密进行，不留下个人电脑被触碰过的迹象。当然，必须注意不要留下移动个人电脑或其周围物品的痕迹。这需要一个组织良好的行动，并对细节给予高度关注。例如，团队中的一名成员可能负责在任何活动开始之前拍摄桌面的宝丽来或数码照片，以便能够将一切恢复到原样。\n\
  \n最后，即使没有必要在保密条件下制作副本，能够按需分析数据而不冒干扰实时应用的风险，仍然具有诸多优势。\n\n### 13.3 相关联的来自多个来源的数据\n\
  \n在查看一组计算机记录时，调查人员面前呈现的是一个“虚拟世界”，它可能与现实世界相符，也可能不相符。在 Equity Funding 案件中（参见 section\
  \ 12.1），创建了数千份虚假的保险单。由于保险单是一种仅以抽象形式存在的金融资产，很难检查它是否“真正”存在。\n\n资产可以是虚假的，但绝非抽象，正如美国磁盘制造商\
  \ Miniscribe 在 20 世纪 80 年代后期的一系列欺诈案中所展示的那样。该公司开始在其仓库和分销点之间转移过时的备件、故障设备甚至建筑砖块，同时声称这些都是可销售的产品，具有相应的高账面价值。诀窍在于保持这些废品的流动。这使得任何人都难以核实公司的记录是否反映了在任何给定时间实际存放的库存（Foremski\
  \ 1989a）。\n\n任何审计员的黄金法则是不时进行“现实核查”，并且如果可能的话，不要提前通知。这可能涉及任何事情，从突然出现在仓库检查库存水平，到询问第三层的办公室是否真的已按装饰合同的细节进行了粉刷。英国严重欺诈办公室的一位高级官员强调了采取外部视角的重要性。他认为，审计员经常未能发现欺诈，部分原因在于他们没有进行充分的调查，允许管理层限制其工作范围，并且未能识别交易中涉及的关系（Knox\
  \ 1994）。\n\n审计员面临的情况主要有三种形式：\n\n1. *虚假陈述*，*但内部一致*。记录与现实不符，但欺诈已以如此高超的技巧完成，以至于仅通过查看计算机文件就找不到任何不一致之处。这通常需要在组织的高层进行某种串谋，就像\
  \ Equity Funding 和 Miniscribe 的案例一样。然而，这种情况*可以*由地位低得多的人制造，正如洛杉矶高中生 Jerry Schneider\
  \ 参与的古董计算机欺诈案所显示的那样。1971 年，年轻的 Jerry 获得了当地电话公司使用的计算机化库存系统的完整指南库。利用这些指南中的信息，他购得了一辆前电话公司卡车（拍卖所得），通过贿赂朋友获得了进入公司仓库大门的通行钥匙，并获得了一部按键式电话。他使用电话的键盘向自动化仓库系统提出材料\
  \ requisition，仿佛来自电话公司的某个施工现场。然后他驾驶他的“公司”卡车前往仓库领取物品，并在公开市场上出售。\n\n后来，他发现可以省去寻找买家。他利用对计算机系统的了解，拨号并提出\
  \ requisition，将某项物品的库存数量降低到其再订购点以下。然后他打电话给公司，询问他们是否碰巧正在寻找该物品的供应。当公司检查计算机文件时，他们发现不出所料，他们确实需要，于是安排回购自己的货物。这些交易的总结果是，尽管货物和款项正以惊人的速度流向不当目的地，但仓库记录中从未出现任何不一致。最终，Jerry\
  \ 的一个不满的朋友揭发了这一骗局。公司随后发现，由于他们对计算机化系统的依赖，尴尬地无法弄清到底有多少库存实际上被盗（Moscove and Simkin 1987）。\n\
  \n\n\n\n\n事后看来，很容易提出一些简单的审计就能发现仓库的货物流出是否与施工现场活动的其他记录相符；或者可以对个别交易进行随机抽查的计划。在现代系统中，人们会期望系统保留活动日志，这有助于揭示数据录入是否被篡改。在调查一起涉及一名家庭医生对其多名病人实施谋杀的英国刑事案件时，侦探检查此类日志后发现，被告为受害者录入了倒签的病史，为他们编造了严重的医疗问题，而所有这些细节实际上都是在患者死亡*之后*才录入的（News\
  \ 2000）。\n\n其寓意是，当面对一套看似完美的记录时，任何调查人员或审计员都应始终考虑其各个方面如何能从独立来源得到验证。在采用高度集成系统（如企业资源规划）的公司中，或在依赖\
  \ EDI 和其他完全电子通信的价值链中工作时，从系统外部真正独立的来源找到佐证信息并不总是容易。\n\n## 2. *隐藏的模式和差异*\n在 第 5.2.1\
  \ 节 中曾提到那位铁路职员，他在其他人的姓名旁输入自己的员工编号，以便将额外付款转给自己而不引起注意。这种行为并未被预防性控制措施发现。通过对记录进行回顾性分析来揭露此类欺诈，必然是一个更加繁琐且昂贵的过程，而且在此期间企业已经因欺诈而遭受了财务损失。\n\
  \n一旦欺诈真正扎根，审计员面临的问题就是该从哪里开始挖掘。考虑一起养老金职员成功实施了 15 年的欺诈案，涉及超过 £500,000 的挪用资金。该职员在虚假姓名下开设了若干建筑协会账户。他授权定期向这些账户付款，始终遵守以下规则：付款金额较小，使用他推测（正确地）不太可能被审查的老旧养老金计划，且付款从不涉及任何税务问题。通过始终以“紧急”批次表格提交申请，并审慎移除可能日后形成审计线索的任何文件，规避了本地控制（Essinger\
  \ 1991）。鉴于该程序被重复的次数之多，职员的活动中必然存在一种规律性模式。然而，这是一种审计员极难发现的模式。\n\n## 3. *幽灵和双重身份*\n\
  任何为欺诈目的创建虚假客户或供应商的人仍面临一个问题，即付款或货物需要发送到真实目的地。可以通过租赁住宿或使用代理服务的地址来解决这个问题，但欺诈者往往为了省钱而使用自己的地址信息，只是为“客户”使用一个假名。\n\
  \n通过运行检查，例如是否任何客户或供应商与员工使用相同的电话号码，这类诡计可以相当迅速地被发现。了解是否有人使用属于住宿代理的地址也可能具有参考价值。Wilding（1997）建议可能值得将此类交叉核对扩展到可能存档的其他细节，例如直系亲属的姓名和地址。Wilding\
  \ 提出的其他建议在使用时必须谨慎考虑数据保护法：例如，检查两名员工是否经常在同一时间休假，以防存在某种密切关系，而这种关系与相关员工之间的职责分离不相容。如果数据来自组织外部来源进行关联，数据保护也不可避免地成为一个问题。例如，一位伦敦市议会的财务总监描述了检测住房福利欺诈申请的困难。已知申请人向伦敦地区\
  \ 33 个不同的地方当局多次申请福利。（其中一人，体现了对 IT 的创新使用，在他的 PC 上保存了一个数据库，以确保他每天穿着合适的衣服，以匹配他众多不同的身份。）对申请人数据的关联是打击欺诈的有力武器，但只有在确保其合法性后才能使用（Leeming\
  \ 1995）。\n\n# 13.4 通信服务的滥用\n\n电话服务传统上一直是企业内部的一个独立领域。即使大多数私人交换机现在已实现计算机化，其安全性也不总是与信息系统整体的安全性很好地集成。这种集成的重要性日益增长，因为电信变得更加数字化，更多的数据流量通过私人交换机路由。\n\
  \n计算机化交换机可以记录其所传输的巨大流量细节。日志是有关连接时间及持续时间的重要信息来源，既包括传入也包括传出。日志还将指示呼叫的来源和目的地，尽管这可能因使用重定向、会议电话或语音邮件等高级功能而变得复杂。\n\
  \n日志中的信息可以与其他系统获得的记录相关联，或单独使用以发现可疑的活动模式，表明员工未经授权使用服务。日志在检测来自外部的攻击时可以成为至关重要的证据来源，例如\
  \ *phreakers*。Phreakers 是电话领域的计算机黑客等价物，虽然他们有时会设法造成损害，但其主要目标通常是拨打电话而不付费。这是通过将呼叫通过私人交换机路由，使其看似源自该交换机来实现的。然后不知情的企业将被收取这些电话的费用。在某些交换机中，phreakers\
  \ 会得到实际上*本意*就是这样工作的设施的协助。这些设施旨在允许授权用户以廉价或免费的方式呼叫交换机，然后从那里拨出到另一个号码。一家电话公用事业公司的调查经理指出（Mulhall\
  \ 1995：298），尽管大多数交换机都有密码保护设施，但许多组织并不费心使用它们。‘对此基本安全疏忽给出了各种理由，例如：“你不能指望我们的高级管理人员记住一个\
  \ 3/4 位 PIN。”考虑到这些人的薪水，这是一个荒谬的情况。’这种骗局的更复杂版本涉及设置拨号直通呼叫到收取高价费率的号码。毋庸置疑，相关的高价费率号码是作为欺诈的一部分而设立的，以便随后根据正常的收入分成安排，从电话公用事业公司索取付款。\n\
  \n在电信管制宽松的国家，电话账单现在可用于对各种服务收取费用，其中一些服务以前可能通过信用卡公司支付。这导致了一种被称为 *cramming* 的做法的出现，定义为“在电话账单上列入消费者未订购的商品或服务的费用”（Valentine\
  \ 1998：第 14 段）。\n\n\n\n\n\n即使是一个小型组织，其电话记录也会产生大量的数据，因此文件查询包对于进行分析是必不可少的。Williams（1996）建议了如何使用此类包来找出不负责任或未经授权的使用情况，例如，通过列出通话时间过长或涉及高价费率号码的通话。Williams\
  \ 举例说明了发现一家英国公司在凌晨六点左右向尼日利亚拨打电话的情况。最终发现是一名清洁工所为。显然，如果分析由熟悉业务的人来完成会很有帮助，例如知道客户并不在尼日利亚，员工也不需要在正常办公时间外打电话。然而，对于不愿投入时间和软件自行进行分析的组织来说，外包承包商会承担此项工作，有时甚至采用“无节省则无费用”的方式。\n\
  \n## 13.5 证明所有权：电子水印\n\n前面讨论的（在 Chapter 6 中）用于建立信息来源和真实性的方法都假设发送方和接收方之间存在一定程度的合作。为了使这些方法发挥作用，双方必须就加密和哈希的适当算法达成一致，并相互提供加密密钥。\n\
  \n然而，有时，接收方的合作却是最后可以期望的事情。非法获取信息的人不会倾向于协助证明该信息的来源。调查人员因此需要能够证明该信息只能来自合法所有者。此类情况通常围绕版权侵权展开，其中材料可能已被窃取，或许以违反许可协议的方式使用。\n\
  \n*电子水印*技术已得到开发，主要是为了满足新型信息产业保护其产品的需求。随着音乐、电影和软件都可以通过互联网轻松传输，版权变得难以执行。人们曾试图禁止可能用于制作非法副本的设备，但这些尝试面临巨大的可行性和执行问题（Simons\
  \ 1998）。\n\n电子水印的潜在用途并不局限于版权保护。例如，一家公司可能担心内部文件被“泄露”给外部人员。通过为每份文档副本应用不同的水印，就可以追踪在组织外部发现的任何副本的来源。\n\
  \n成功的电子水印需要满足以下要求：\n\n* 它应以无法被检测的方式嵌入数字材料中，除非知道水印处理过程的人；\n* 即使被检测到，也应尽可能难以破坏或移除；\n\
  * 如果材料通过网络传输，或经过某些常用转换，例如将图片转换为不同的位图标准，或在边缘裁剪图片，它应保持完整。\n\n可以看出，与传统水印（例如在钞票或证书上可见）的相似之处并不完全准确。电子水印通常是不可见的（尽管可以包含可见符号作为威慑）。另一方面，纸质水印任何人都可以检查。电子水印旨在在复制后仍然存在，而纸质水印即使是最好的复印机也无法复制。电子水印实际上是隐藏信息的更通用技术集的应用，称为*隐写术*。与密码学一样，一些隐写术技术相当简单，但这使它们容易受到攻击。例如，可以通过将选定的字母稍微上移或下移，或使用单词之间的间隙作为代码（单个空格可能代表数字“0”，双空格代表数字“1”）来在普通文本中隐藏消息。大多数读者不太可能注意到由此产生的细微不规则性。然而，一旦方法被发现，解码和伪造就变得非常容易。消息也可能因对文本的非常普通的操作而很容易丢失。例如，如果在文字处理器上更改边距，单词间隙的模式将会改变，因为行尾的所有空格都会被忽略。\n\
  \nBender *et al*（1996）描述了更适合数字时代的技术。这些技术最适用于包含大量比特的数字对象，例如高清图像或音乐片段。隐写者的目标是用包含隐藏消息的“伪随机”比特序列替换原始文件中随机出现的比特。这将导致图像某些部分的亮度或颜色设置发生细微变化，或音乐作品中听到的音调发生变化。然而，成功的隐写术的艺术在于使这些变化完全无法察觉。为了获得最佳效果，隐写者会确保比特更改分布在整个图片或声音序列中，使其难以编辑出来，并且会有检查机制来指示消息是否已被更改或损坏。\n\
  \n许多隐写术系统仍处于实验阶段，但一些软件包已在商业上销售。这些产品使有价值的数字材料（例如受版权保护的声音和图像）的所有者能够应用唯一的<|message|>\n\
  \n\n\n\n在着手证明某种不当行为确实发生时，过程中很可能会出现伦理问题。例如，在正常情况下会被视为私人的事项，可能需要进行核查。还有一种危险，即责任可能会被引导指向某一个特定的人，因为其他人试图撇清关系，导致那个人被孤立成为替罪羊。调查还必须基于公平和一致的原则。例如，如果一种做法在过去几年里一直被默许，那么突然引入“零容忍”政策并对违规者进行突击打击，几乎是不合理的。\n\
  \n伦理判断之所以尤其困难，是因为没有任何规则手册能够涵盖调查过程中可能出现的各种曲折。它们还因为管理层和员工双方的利害关系都可能很高而变得更加棘手。公司可能损失宝贵的信息资产，员工可能最终被解雇。这些是伦理决策，正如阿德里安·卡多伯里爵士所说，管理者需要“自己制定规则”。他的意思并不是说他们可以随意为所欲为；他的观点是，伦理、商业和其他方面的考虑经常会发生冲突，而且管理者可能会发现“伦理路标并不总是指向同一个方向”（Andrews\
  \ 1989：70）。\n\n那么管理者应如何着手“制定规则”呢？伦理学中一个被广泛接受的一般规则是，应该始终首先寻求对事实的完整而准确的版本。然而，在涉及信息系统的调查中，通常会有强烈感觉认为某些事实*不*应让调查人员获取。对隐私的尊重要求个人背景或活动的某些方面应被允许保持秘密。在某些情况下，类似的保护也可能由其他法律实体主张，例如合伙企业或公司。\n\
  \n提出了三条主要论点来主张尊重隐私，即使这可能会妨碍调查的进展。第一条强调需要在不受与案件无关但可能引起各种偏见的信息影响的情况下做出判断。这里借用法律理论家约翰·罗尔斯在发展其关于井然有序社会的概念时使用的“无知之幕”的想法很有用。罗尔斯认为，如果决策不受当事人“某些在道德上无关的信息”影响，将有助于制定公平的规则（Rawls\
  \ 1999：236）。数据保护规则的共同目标是规定在何处以及如何施加无知之幕：例如，目前欧洲大部分数据保护法所依据的一项指令规定，数据应始终为特定目的而收集，并且不得以与该目的不一致的任何方式披露（EC\
  \ 1995；参见第 14.4 节）。然而，此类规则不能绝对化，必须在更大的公共利益中允许例外。因此，例如，如果一名员工故意在系统中输入虚假信息，她几乎不能要求将其保密，理由是这纯粹是私事。与此同时，调查人员也没有理由翻查与员工相关的*所有*记录。在这一领域，很难定义明确的伦理或法律规则，尤其是在调查工作中；不可避免地会出现无法知道在寻找证据时可能会偶然发现什么的情况。\n\
  \n第二条论点关注数据主体的权利。这从这样一个假设开始，即个人可以对个人信息主张类似于所有权的权利。因此，如果信息被披露，始终应征得个人的同意。这在调查背景下又会产生问题，因为嫌疑人可能必须不知道调查正在进行。在这种情况下，征求同意只会暴露调查意图。无论如何，决定个人信息的“所有权”可能很困难，因为它经常是模糊的：例如，如果\
  \ A 已婚 B，或者如果 A 已经向大量人提供了该信息。因此，一些作者更喜欢探讨个人在多大程度上可以通过控制个人信息的使用方式来主张其*自主权*（Gross\
  \ 1971）。\n\n最后，专业人士经常提出一个更务实的论点，他们从客户那里保密地接收信息。他们的担忧是，如果客户不能确信这些信息将被完全保密，他们就不会向他们提供亲密和个人细节。这在许多国家已成为一个主要问题，涉及家庭医生持有的记录。唐纳森和洛尔（Donaldson\
  \ and Lohr 1994）指出，各种调查机构可能寻求获取此类记录，以追查医疗保健索赔或付款方面的可能不规则行为、虐待风险儿童的细节等。因此，医生已无法再保证信息不会超出诊疗室文件柜的范围，人们担心患者因此会更加谨慎。\n\
  \n这三种隐私观点绝非相互排斥，在任何特定情况下都可能同等重要。例如，在追查 X 的欺诈性健康保险索赔的过程中，可能出现了关于 Y 的医疗细节，而 Y 宁愿将其保密。假设\
  \ Y 是无辜的第三方，这可以被视为各种意义上的不公平释放无关信息、对 Y 隐私权的侵犯，以及对医患保密的违反。\n\n使用执行电子通信例行扫描的程序也可能引发对员工隐私侵入的困境。当然，从监控系统提取的信息的使用可以使员工受益。例如，冒犯性电子邮件的传播肯定会让员工不安，事实上，如果组织不对违规者采取行动，它可能面临法律诉讼。在工作中完全的行动和通信隐私既不实际也不\
  \ desirable。然而，如果信息的使用不审慎，就很容易进入不可接受的领域，例如，如果一名员工因违反公司规则的轻微违规而被“挑出来”。拦截和干预必须始终以对所涉及的伦理问题敏感的方式进行。\n\
  \n### 13.7 问题\n\n1. 同样的数据可能由（a）法证调查员和（b）负责规划和预测的部门怀着不同的目的进行搜索和分析。\n\n请指出您预期在两种方法之间会发现的关键差异，特别参考：\n\
  \n* 搜索和分析的目标；\n* 调查进行的方式；\n* 执行工作所需技能。\n\n*两种*类型的调查中可能会使用什么类型的软件工具？\n\n\n\n\n\n\
  ## 2.\n你有理由怀疑一群员工通过在会计系统中设置虚假客户信息来欺骗公司。会计工作使用的是办公室 PC 服务器上的标准软件包。该系统通常只在正常办公时间运行，但员工在其他时间工作是惯例，尤其是在每个会计期间结束时。\n\
  \n你希望弄清楚你的怀疑是否正确，如果属实，则查明谁参与了欺诈。确定你需要获取访问权限以推进调查的数据记录类型，并给出对其进行分析的示例。\n\n## 3.\n\
  给出 `three` 个原因，说明为什么不直接在“实时”系统上进行取证分析，而将其复制并带到其他地方进行分析可能是更可取的。\n\n## 4.\n解释“电子水印”是如何工作的。它与应用于例如银行纸币的更传统的水印之间主要有哪些区别？\n\
  \n# 第 6 部分 法规和标准\n\n## 第 6 部分介绍\n\n如果我要向你推销一把门锁，我可以当着你的面把演示模型拆开，并试图说服你其内部构造如此精妙且设计精良，以至于能抵御最坚定的窃贼。或者，我也可以请专家事先对产品进行彻底检查。如果专家得出结论认为该锁符合某些标准，而你愿意接受这些结论，我们双方都会节省大量时间。\n\
  \n针对消费品的合规性测试已得到确立。许多产品都带有批准标志或“风筝标志”，表明它们已通过某种认证流程。人们已做出大量努力，试图将同样的方法应用于信息安全和控制。标准已为信息系统产品中的安全功能、自身的安全产品，甚至安装中的整体安全管理制定。\n\
  \n防火墙或操作系统的安全标准，当然比门锁复杂得多。此外，安全门锁的原理已被很好地理解且广为人知。如果你愿意，拆开锁自己看一看并不太困难。在信息系统安全领域，情况则恰恰相反。专家并不总是就安全功能应如何构建达成一致，普通人几乎没有机会评估由电路板和代码行构成的产品。\n\
  \n在 第 6 部分 中，描述了一些为设定和衡量标准而开发的方案。在大多数情况下，这些方案都由监管机构支持，并且描述了其中一些机构的地位。还特别关注了数据保护问题，目前在世界许多地区已实施了相关法规。该部分最后提供了有关未来可能变化的几点提示。\n\
  \n# 第十四章 标准、行为准则和监管机构\n\nDOI: [10.4324/9780203992319-21](https://dx.doi.org/10.4324/9780203992319-21)\n\
  \n## 14.1 监管框架\n\n鉴于信息系统的完整性和安全性至关重要，人们可能会期望公共机构渴望鼓励监督和监管。事实上，许多政府和国际机构都已启动了相关举措。然而，由于众多希望成为监管者的机构各自拥有自己的标准、规则、基准和行为准则，情况变得混乱。有些由政府赞助，有些由行业联盟赞助，还有些由专业和消费者团体赞助。总体而言，结果并不十分连贯。一方面，有资源充足的机构能够通过严格的程序执行其标准，另一方面则是一些机构，尽管名称听起来令人印象深刻，却缺乏实质或权威。\n\
  \n这使得任何寻求“官方”指导或保证的人都难以应对。关于谁有权在特定情况下行使管辖权以及基于什么依据，也存在很大的混淆可能。这种不太理想的状况有几个原因，主要如下。\n\
  \n* 技术继续快速发展，为制定规则和法规的人设定了不断变化的目标。\n* 网络交易越来越多地在全球范围内进行，因此监管制度必须在全球范围内才能有效。这不可避免地会产生巨大压力，因为各国都在争取其认为符合国家利益的东西。\n\
  * 由于信息系统渗透到业务的许多方面，其监管并不 neatly 适合任何一个职业、行业部门或政府机构的职权范围。\n* 在技术层面，有大量业务软件和硬件产品可供选择。每个组织都以自己的方式设置产品组合。很难预测当所有这些产品组合在一起形成系统并开始相互作用时，会出现何种漏洞。\n\
  * 即使有意建立监管制度，也严重缺乏具备适当技能和知识来付诸实践的人才。\n\n面对这些阻碍进展的障碍，令人惊讶的是，事实上已实施了许多有用且值得称道的措施。引入一定程度的秩序和保证的努力可以从三个不同方向看到，如\
  \ Figure 14.1 所示。\n\n![Figure 14.1 ](img/fig14_1_B.jpg)\n\nFigure 14.1 \n\n就 *产品*\
  \ 而言，“标准”有两种截然不同的相关方式。首先，标准可以以详细规范的形式应用，指示产品应如何工作。例如，如果要在网络上在两台计算机之间建立连接，往返的消息必须在两端以完全相同的方式处理。这取决于\
  \ *标准化*，这对于基本通信协议以及应用于消息的任何安全功能（例如加密或消息认证码）都是必要的。\n\n“设定标准”还有更常见的含义，其目的是确保产品达到一定的\
  \ *质量* 水平。例如，可以编写一个忠实遵循 SET 或 SSL 等安全协议的程序，但其中包含的编码缺陷使其容易受到不法分子的攻击。对于安全相关产品，实施必须在\
  \ *两种* 意义上都符合标准。其中，证明产品质量良好且无缺陷通常要困难得多。为此，必须对产品的设计和编码进行严格审查，并在受控条件下将其置于各种问题情况或恶意攻击之下。安德森进行的多项研究已证明了此类检查的重要性，他发现了若干商业安全系统的实现存在弱点，包括智能卡和自动取款机（Anderson\
  \ 1994）。\n\n另一方面，符合 *标准化* 通常更容易检查，因为不正确的实现会产生明显的错误，甚至可能根本无法工作。例如，我对标准加密算法的不完全正确实现很可能产生输出，使得其他人即使使用正确的算法和密钥也无法解密。\n\
  \n\n\n\n\n即使成功，产品标准化往往也是一把双刃剑。仅仅因为变得熟悉和流行，产品就会吸引黑客和病毒编写者的注意。当用户从同一供应商安装一套“产品系列”时，问题会变得更加严重，而供应商自然乐于鼓励这种做法。这确保了产品能够顺畅地协同工作，得益于它们符合供应商的专有标准。最近病毒编写的创新已经利用了这一点，例如针对由\
  \ Microsoft Outlook 处理的电子邮件发起的“Bubbleboy”病毒株（Hancock 1999a）。关于产品标准的安全性方面以及赞助和监督它们的机构的进一步描述见\
  \ 14.3。\n\n尝试为*人员*指定胜任能力和资格通常是基于职位说明书进行的。在大多数情况下，这意味着对信息系统审计有很强的侧重。 Table 14.1 显示了一些可获得的资格。这些资格在为人们提供提升专业知识的激励方面发挥着宝贵作用。然而，就其与普通企业的相关性而言，它们也引发了一些更广泛的问题。\n\
  \nTable 14.1 Some organisations offering qualifications in IS audit and security\n\
  \n| Organisation || Qualification || Notes |\n| --- | --- | --- |\n| Information\
  \ Systems Audit and Control Association (ISACA) || Certified Information Systems\
  \ Auditor (CISA) || ISACA was formerly the EDP Auditors Association |\n| --- | ---\
  \ | --- |\n| International Information Systems Security Certification Consortium\
  \ Inc (ISC)² || Certified Information System Security Professional (CISSP) || CISSP\
  \ is supported by the Computer Security Institute (CSI) and InformationSystems Security\
  \ Association (ISSA) |\n| Institute of Internal Auditors (IIA) || Certified Internal\
  \ Auditor || Includes IS technical skills. |\n| Institute of Internal Auditors –\
  \ United Kingdom (IIA-UK) || Qualification in Computer Auditing (QiCA) || Also offers\
  \ a more general Internal Audit qualification |\n\n首先，必须对 IS 安全和控制“专业人员”将被负责的事务范围做出一些假设。如果他们的角色*纯粹*是审计和提供建议，那么这不会引起多少管辖权问题。最终做出决定的那些人始终有选择忽略所提供建议的选项，并且不会觉得必须放弃任何权威。\n\
  \n然而，许多组织，特别是规模较小的组织，不愿意仅仅为了获取专业建议而雇用人员。他们也不愿意支付聘请顾问所带来的高昂费用。相反，他们会尽量确保必要的专业知识在公司各个部门的员工中尽可能广泛地分布。这将包括诸如现场安全、质量控制、应急规划和人力资源等职能，以及管理信息系统本身的人员。在这种情况下，将\
  \ IS 安全和控制的适当知识子集纳入*所有*相关专业和管理群体的资格认证中开始显得更为可取。\n\n第二个问题集源于技能的测试方式。设置涉及技术事实或理论的考试总是更容易的，特别是如果测试（如\
  \ CISA 和 CISSP）使用多项选择题。测试更柔软的技能则更困难，例如进行一次重大的风险分析，或说服员工遵守新的安全制度。资格认证试图通过要求在相关岗位上的实践经验来解决这个问题，但对于任何人来说，判断候选人可能从中学习到什么或没有学习到什么总是很困难的。事实上，如果没有广泛的监督，经验只会强化和延续不良做法的风险始终存在。\n\
  \n推广资格认证的人也必须确保他们能够销售自己的产品。如果没有令人向往的就业前景来激励候选人，很少有人会感兴趣投入时间学习。如果获得资格的标准没有做到客观和透明，资格认证就会缺乏可信度。因此，不难发现对已被广泛认可的一个角色（计算机审计员）的反复强调，以及考试中强烈以技术为中心的侧重。这里概述了两种特定情况下所需的部分知识。\n\
  \n与其试图为产品或职业设定标准，可以认为采用通过*监管*制度的“自上而下”方法更为可取，该制度规定组织必须实现的安全和控制结果。然后可以让相关管理层自行决定如何遵守。监管可以直接通过立法实施，也可以由被赋予对特定商业部门或活动进行监督的机构间接管理。\n\
  \n在制定新法规时，各国政府往往集中在公众利益较高的领域（例如涉及个人隐私或信息自由的问题）或政府自身有既得利益的领域（例如与执法和税收有关）。这并不总是产生合乎逻辑或连贯的结果。例如，一家美国法院曾被要求裁定一家向客户提供互联网服务的有线电视公司如何同时遵守《有线通信政策法》，*和*《电子通信隐私法》。这两部法律都规定了在怀疑客户从事刑事活动时拦截消息的条件。不幸的是，这些法律在诸如是否必须首先通知客户等重要细节上存在分歧。有人认为，即使是最守法的有线电视运营商也无法同时遵守这两部立法（Massachusetts\
  \ 1999）。\n\n多年来，世界各地的政府一直试图通过禁止出口任何真正有效的算法来监管密码学的使用。最著名的例子可能是美国政府使用其《国际武器贸易条例》。密码产品被列入美国军需品清单，出口任何（无论是设计、代码还是硬件）能够使某人创建强大密码设施的东西都成为违法行为。许多其他国家也实施了类似的限制（清单可在\
  \ Garfinkel 和 Spafford (1997) 中找到，Koops (2000) 维护了一个当前限制的网站）。多年来，系统供应商和公民自由团体提出的投诉导致越来越多的例外情况被做出，但仍有许多限制存在（Dam\
  \ 和 Lin 1996：Ch. 4）。\n\n在欧洲，已经努力协调与电子商务行为有关的法律。1999 年，经过大量磋商和修改，达成了一个框架，用于规范认证机构，并使数字签名与传统签名具有同等效力（EC\
  \ 1999）。现在必须将适当的措施纳入国家立法，例如 1999 年底提交英国议会的《电子通信法案》。\n\n\n\n\n\n同时，欧洲关于规范互联网客户与供应商发生纠纷时客户地位的提案遭到了强烈反对。该提案将管辖权赋予客户居住国的法院。供应商对可能需要在任意\
  \ 15 个国家应诉的想法自然持敌对态度（Europa 2000）。\n\n对于普通企业而言，试图选择经过测试的产品、获得可靠建议并遵守所有相关法规的情况，至少可以说是令人望而生畏的。\
  \ Figure 14.1 中的三支箭头往往会以一种杂乱无章甚至相互矛盾的方式汇聚到组织之上。一个可能的结果是，服务提供商，特别是电子商务领域的服务提供商，将越来越多地提供外包安排，由此他们承担控制和合规问题的全部责任。另一条发展方向是提供基于对组织信息系统全部或部分进行全面“健康检查”的认证计划。\
  \ Section 14.2 描述了两种此类计划。\n\n## 14.2 认证计划：BS 7799 和 Webtrust\n\nBS 7799 和 WebTrust\
  \ 都是用于认证信息系统安全性的计划。BS 7799 适用于整个系统及其工作环境。WebTrust 仅适用于网站。\n\n这些计划有以下共同点：\n* 对所有申请人进行彻底的测试和检查流程。\n\
  * 这必须由接受过特殊培训和评估的人员执行。\n* 认证为固定期限，必须定期续期。\n* 该计划由 well established 公共机构支持。\n* 用户可以轻松核实组织声称获得认证的真实性。\n\
  * 希望该标准能够在国际上适用。\n\n作为接受认证流程的回报，组织获得了宣传其已达到标准的权利，这意味着其安全性和控制质量。两个计划都要求其发起者在界定认证标准、记录和宣传计划细节，以及说服公司和个人在进行认证前接受培训方面投入了大量资金。\n\
  \nBS 7799 最初于 1995 年发布，作为公司可据此衡量自身的标准集。1997–8 年对该标准进行了审查，并建立了机制，使 BS 7799 的授予须经外部审计流程。该计划名为\
  \ c:cure，并由 BSI-DISC 管理。 （BSI 是英国标准协会，DISC 是其 IT 部门，其首字母缩写代表 Delivering Information\
  \ Solutions to Customers）。\n\n要满足 BS 7799 的要求，组织必须能够证明其在十个主要领域的胜任能力：\n* Security\
  \ policy\n* Security organisation\n* Assets classification and control\n* Personnel\
  \ security\n* Physical and environmental security\n* Computer and network management\n\
  * Access Control\n* System Development and Maintenance\n* Business Continuity Planning\n\
  * Compliance, with respect to internal policies, and the law\n\n显然，这些不同领域需要根据组织的性质给予不同的权重。例如，并非所有企业都自行开发系统，有些企业可能仅有限地使用网络。经验法则表明，计划组织者建议，对于一个雇员\
  \ 100 人的典型企业，认证大约需要 6 天的工作量，而对于 1000 名员工的企业，则约为 25 天。一旦获得，认证有效期为 3 年。\n\n澳大利亚/新西兰信息安全管理认证计划\
  \ AS/NZS 4444 与 BS 7799 具有相似的目标，并且这些计划之间存在一定的协调可能性。通过法语和德语翻译其文件，也在推广 BS 7799 的更广泛采用，并且正在推动将其作为\
  \ ISO 标准采用。然而，该计划因其方法过于“独立”，并且与组织内部可能已有的内部控制流程联系不足而受到一些批评。此外，虽然它要求制定安全政策，但对于检查管理团队的适当成员是否被指派实施和执行这些政策的规定并不具体。\n\
  \nWebTrust 计划由美国注册会计师协会和加拿大特许会计师协会于 1998 年联合开发，并与 Verisign 合作。由于会计师长期以来拥有进行外部审计的专有权，并且许多会计师事务所还拥有蓬勃发展的\
  \ IS 咨询业务，因此对网站的审计似乎是合乎逻辑的发展。该计划已迅速从其北美基地发展到更国际化的立足点，这得益于主要会计师事务所的全球覆盖范围，以及英国和爱尔兰会计师协会等其他机构对其计划的认可。\n\
  \nWebTrust 认证主要集中在三个领域：\n* *Business practice disclosure*。网站必须向客户明确说明其订单和查询将如何处理。\n\
  * *Transaction integrity*。对通过网页进行的交易的准确性、完整性和及时性进行调查。还对交易产生的会计记录进行审查。\n* *Information\
  \ protection*。对客户详细信息在传输过程中以及存储在客户系统中的保护进行评估。\n\n完成认证流程后，网站被允许在 90 天内展示 WebTrust\
  \ 批准标志。显示在屏幕上的 WebTrust 标志应为“实时”标志，以便可以单击该标志并立即转到相关审计员报告的副本。实际上，该报告可能包含重大保留意见。例如，在一个实例中出现以下内容：\n\
  \n> 由于控制固有的局限性，错误或欺诈可能发生且未被发现。此外，基于我们发现得出的任何结论的预测，其有效性可能会因 (1) 对系统或控制的更改，(2) 处理要求的更改，或\
  \ (3) 因时间推移而需要进行的更改 … 而改变。\n\n此类条款说明了在目标可能迅速移动的环境中应用认证的困难。如果消费者希望进行进一步核查，他们可以咨询\
  \ Verisign 独立维护的所有当前认证网站列表。\n\nBS 7799 和 WebTrust 等计划面临的主要问题在于，如何将其与成本更低、但不够严格的计划进行市场竞争，这些计划授予“批准标志”。例如，英国消费者协会有一个计划，网站如果承诺遵守良好实践守则，就可以使用\
  \ Which? Web Trader 标志。该守则中的许多要求与 WebTrust 规定的要求相似。然而，在这种情况下并未进行外部审计。Epinions (2000)\
  \ 等在线消费者网站邀请客户自行提供一种审计形式，通过 *reputation managers* 注册他们对网站的印象和体验。这使得人们能够看到以前客户对服务质量的看法，尽管当然无法保证所有观点都是合理或公正的。\n\
  \n## 14.3 技术标准 for is Products\n\n\n\n\n\n技术标准的定义和采用涉及全球众多官方和半官方机构。它们大多通过合作协议和交叉代表联系在一起。通常可分为三类：\n\
  \n*   *行业主导*。成员可能来自 IS 货物和服务的供应商，如 ETSI（欧洲电信标准协会），或由严重依赖 IS 的行业部门的代表组成，例如 ECBS（欧洲银行标准委员会）。\n\
  *   *专业*。一些在 IS 领域工作的专业人士协会已发展出制定标准的作用。其中最历史悠久的是总部位于美国的电气和电子工程师学会（IEEE）。\n*   *“官方”标准制定机构*。其中一些由政府资助，但许多是独立的非营利组织。也许最著名的是\
  \ ISO，它是 130 个国家标准组织的联合会。（ISO 的名称并非基于其缩写（它实际上称为国际标准化组织），而是基于希腊语中的“相等”一词）。\n\n一些机构的工作方式涉及上述的混合。美国国家标准协会就是一个例子，它是一个非营利机构，其公开目标是通过标准提高美国工业的竞争力。其成员来自私营部门公司和政府机构的广泛跨界。\n\
  \n有关 IT 标准制定的全面、 albeit 略显过时的概述，读者可参考 Judge（1991）和 Cargill（1989）。如今，任何 IS 采购商都不可能跟踪全球所有与标准相关的活动，但大多数标准机构现在都有组织良好的网站，并且经常值得检查在营销材料中发现的任何关于标准的引用。（这也可能很有趣，可以向供应商提出一两个关键问题。绝不能认为销售团队对\
  \ IS 标准术语的熟悉程度比其客户更高）。\n\n一些主要标准机构网站的详细信息在 附录 2 中提供。以下两个示例展示了标准如何在产品规格中出现，以及它们可能为何重要。\n\
  \n### 示例 1\n\n以下内容取自一款电子邮件产品的实际规格。\n\n> 消息签名使用美国国家标准与技术研究所（NIST）的数字签名算法（DSA）和安全散列算法（SHA-1）生成；消息使用\
  \ FORTEZZA PC 卡上的密码协处理器进行加密\n> \n> LJL 2000\n\n该声明是较好的声明之一，因为它至少解释了所有缩写的含义。然而，对于不熟悉的人来说，这些名称可能仍然意义不大。\n\
  \nNIST 并不是通常意义上的国家标准机构，而是一个美国商务部下属机构。NIST 以 `FIPS`（联邦信息处理标准）的形式发布其标准，任何人都可以自由采用。然而，所有美国政府机构都应尽可能遵守\
  \ `FIPS`。数字签名算法是《数字签名标准》中授权使用的两种算法之一，该标准以 `FIPS 186–1`（1998）发布。安全散列算法定义于 `FIPS Publication\
  \ 180–1`（1995）。所有这些信息都可以在 NIST 网站 `www.nist.gov` 上查到。\n\n`FORTEZZA` 加密卡是由美国国家安全局推广的标准。符合该标准的情况可以使用\
  \ NSA 开发的测试进行认证，其详细信息可在 `www.fortezza-support.com` 上找到。\n\n因此，有意购买者可以得出结论，本产品规格中提到的加密、签名和散列功能均基于美国政府官方机构制定的标准。此外，这些标准应在美国政府内部的广泛使用中得到检验。有些人会对此感到安心。另一些人则对美国政府的参与持更负面的看法：例如，有人指责其故意在开发的产品中留下“后门”，以便秘密解密消息。这就是标准规范的\
  \ *开放性* 变得重要之处，因为如果它可以完全独立于政府进行实现和测试，就不太可能在其中构建任何不正当的设施。\n\n标准领域的变幻莫测或许可以通过另一系列散列算法标准的例子来说明。罗纳德·里维斯特（RSA\
  \ 加密的创始人）发明了一系列散列（或消息摘要）算法，称为 `MD2`、`MD4` 和 `MD5`。这些标准的详细信息可以在 RSA Security Inc\
  \ 的网站上找到，也可以在保存 RFC 目录的多个其他网站上找到。`RFC`（征求意见稿）是发布与互联网上使用的产品相关的规范的一种方式，供人们自愿作为标准使用。此类标准的权威性来自广泛的采用和测试，而非来自官方政府认可。\n\
  \n### 示例 2\n\n一些营销材料涉及执行访问控制或防止黑客攻击的软件，并声称该产品已获得某一安全级别的认证。提供的保证例如：“X 操作系统已评定为 TCSEC\
  \ C2 级”，或“此防火墙符合 ITSEC E3 标准”。\n\n同样，普通客户可能会想知道这种胡言乱语在购买决策中的相关性或无关性。就刚刚引用的两个实例而言：\n\
  \n*   `TCSEC` 代表可信计算机安全评估标准。这是其中最古老的安全标准之一，最初由美国国防部于 1983 年开发，被称为“橙皮书”。它集中于“可信计算基”，即在系统中执行安全控制的软件。\n\
  \    `TCSEC` 一直反映其军事起源，主要关注保密的保存。系统可从 A 到 D 评级。D 是最低类别，提供很少或没有安全性，A 是最高可能等级。一些类别被细分，例如\
  \ C2 实际上低于 C1。\n*   `ITSEC` 代表 IT 安全评估和认证计划。它由欧洲委员会推广，并在英国由切尔滕纳姆的政府安全和通信机构（CESG）管理。正在努力将\
  \ `ITSEC` 与 `TCSEC` 和其他国家计划协调起来，统称为通用标准项目。\n    `ITSEC` 将软件产品从 E0 到 E6 分级。E0 不提供任何保护，而\
  \ E6 提供广泛的保护以及适当的<|message|> 管理工具。认证级别越高，检查其安全声明所需的文档和测试量就越大。\n\n根据这些计划授予的类别始终应被视为仅表示产品的\
  \ *潜在* 安全性。如果产品未正确安装和管理，安全性将被破坏，对优质产品的投资将付诸东流。还应密切注意该计划设定的标准的性质。如果像 `TCSEC` 这种情况，重点是确保保密，这可能对企业组织而言并非最高优先事项。\n\
  \n\n\n\n\n除了官方赞助的“风筝标志”之外，还有一些商业运营的认证计划，例如西海岸实验室的 Checkmark，以及 ICSA Labs 认证计划。这里的重点往往集中在供应商竞争激烈的产品领域，例如防火墙、病毒检查器和不间断电源。评估有时会包括对单个功能的评级，这可以为竞争产品之间的比较提供有用的参考点。\n\
  \n## 11.4 商业系统中的数据保护问题\n\n隐私一直是与计算机化相关的最广泛和最激烈的辩论主题之一。不仅信息系统可以存储人们生活各个方面的大量细节，而且可以即时检索它们，通过网络广播，并将来自不同来源的记录关联起来，以发现具有罪证性或尴尬的含义。这种便利被认为给私营公司和政府机构都带来了不健康的诱惑。在后者情况下，怀疑尤其集中在负责执法和国家安全的人员身上。即使个人信息的存储完全出于正当理由，人们也担心它比纸质记录更容易受到入侵。\n\
  \n这场辩论首次真正聚焦于人们意识到计算机化将被广泛应用于美国 1970 年和英国 1971 年即将举行的全国人口普查时。（即使现在，政府似乎对人口普查特别敏感。英国政府提前\
  \ 2 年多就公布了 2001 年人口普查计划 Census 1999）。在 1970 年代，关于计算机和公民自由的辩论此起彼伏，在英国的情况下，委托了两份冗长的官方报告。这些报告中的许多分析经受住了时间的考验，今天仍然具有相关阅读价值。Lindop\
  \ 1978; Younger 1972。与此同时，律师和计算机专业人士都描绘了未来的黯淡图景，并要求个人应获得更大的法律保护 Miller 1971; Sieghart\
  \ 1976; Warner and Stone 1970。\n\n在随后的几年里，许多国家通过引入数据保护法来回应这些公众关切。尽管这些举措都以不同的方式开始，并在许多不同的法律体系内进行，但最终结果都趋向于收敛到一套相似的基本措施。Bennett\
  \ 对这一趋同过程进行了描述 1992。在欧洲范围内，开始进一步推进这种协调，欧洲共同体于 1990 年发布了草案指令 Michael 1994。该指令最终形成用了另外\
  \ 5 年时间 EC 1995。\n\n此后，该指令已成为欧盟所有国家立法的依据。指令开篇段落给出了采取行动的两个理由。首先，它断言“数据处理系统”必须尊重人们的权利和自由，“尤其是隐私权”。其次，它提供了一个更具商业性的理由：商品、人员、服务和资本的自由流动要求“个人数据应能够在成员国之间自由流动”，而不危及个人的自由。\n\
  \n该指令在第 6 条中列出了数据保护应基于的若干原则，原文如下。\n\n第 6 条中曲折的措辞和对术语的谨慎使用反映了界定数据保护 *确切* 适用范围的困难。指令其他地方对“个人数据”和“处理”等术语提供了精确定义。还制定了程序以使人们能够查阅与其相关的记录，并在执法和国家安全等领域定义了某些允许的豁免类别。该指令涵盖所有类型的归档系统\
  \ 无论是否计算机化 和所有类型的媒体 包括图像以及记录。个人信息的持有者必须实施“适当”的安全措施。判断什么可能“适当”留给系统负责人，因为指令只提供了最一般的指导。第\
  \ 17 条规定：\n\n> 考虑到技术水平和实施成本，此类措施应确保与处理所带来的风险和待保护数据的性质相适应的安全水平。\n\n在英国，该指令的规定已或多或少完全转入\
  \ 1998 年《数据保护法》。\n\n像大多数数据保护措施一样，欧洲指令绝不仅仅关注隐私。它还规范了信息处理的另外两个主要方面。正如第 6 条所示，信息必须\
  \ *准确* 这一点被高度强调。该指令还关注个人信息的处理 *公平性*，在第 6 条及其他条款中都有体现。例如，第 15 条禁止某些形式的自动化决策 特别针对信用评分等技术，除非它们得到某种形式的人工审查或调解的支持。\n\
  \n*隐私* 是不受打扰的权利，将个人信息隐藏于他人之外，并免受侵入性调查。隐私、准确性和公平性有时会难以协调。例如，如果你创建一项检查权，以确保记录的准确性，检查程序可能被冒充数据主体的人滥用。同样，如果你想做出公平的决定，首要任务是尽可能多地了解情况，这一要求可能与隐私要求相冲突。正是这些及其他冲突的存在，使得数据保护成为一个雷区。还有其他同样值得的立法要求，可能使日常决策者难以应对。例如，公共部门的管理人员可能会发现个人隐私与信息自由之间存在冲突。许多国家对健康或信用记录等事项有具体立法必须考虑。或者，法律中可能存在相关的一般规定，例如美国宪法第四修正案中关于不合理搜查和扣押的规定\
  \ Diffie and Landau 1998。\n\n在引入数据保护法的地区，其执行取决于有专人 通常是隐私专员 负责维护个人数据库登记册，并对违反法律者采取行动。各种形式的隐私专员现在已存在于大多数欧洲国家，以及澳大利亚、加拿大、以色列、新西兰和台湾。香港在\
  \ 1995 年通过的条例下设有专员，但该办公室似乎并未在移交至内地管辖后存续。\n\n\n\n\n委员们在执行法律方面面临着艰难的斗争，而这些法律不可避免地涵盖了日益增多的商业活动范围。他们还必须抵御注册和证明合规的过程退化为官僚仪式所带来的持续危险。其早期例子是\
  \ 1984 年第一部英国《数据保护法》下使用的注册表格。该表格对组织详情有四页，外加每项单独的数据使用各有八页。意识到数千名家庭医生都必须根据该法进行注册，而且他们都以大致相同的目的使用个人数据，英国医学协会随即出版了一份‘提示单’，说明应勾选哪些框（BMA\
  \ 1988）。\n\n在美国，联邦法律规范了征信机构对个人信息的利用（US Law 1971）以及政府对个人信息的利用（US Law 1974），但在某些领域法律仍然薄弱（尤其是在健康记录方面）。一个针对网站的自愿合规计划\
  \ Truste 已逐步发展壮大，目前约有一千名订阅者（Truste 2000）。成员同意遵守数据保护的一般原则，而 Truste 负责管理其所称的‘监督和投诉解决程序’。该计划的优势在于能够迅速回应公众关切和技术变化，但最终它缺乏真正的约束力。\n\
  \n与互联网上许多监管问题一样，问题源于确定个人信息的‘持有’和‘使用’的确切位置。现代技术使得在国家 Y 持有国家 X 公民的信息变得容易，并可在国家 Z 访问该信息以作出关于他们的决定。即使立法声称涵盖所有这些情况，执行起来也可能异常困难。隐私专员已开始探索更积极合作的方式。由于合规会增加企业的运营成本，全球采取一致的方法将带来好处，至少可以创造公平竞争环境。\n\
  \n## 14.5 信息系统在未来：控制与监管的一些问题\n\n1972 年，邀请了二十位行业专家推测他们设想计算机在 2000 年如何被使用，并指出其对公共政策的任何影响（Avebury\
  \ *et al* 1972）。大约 30 年后，结果读起来很有趣。虽然几位作者对即将到来的变革规模有所预见，但大多数人主要关注他们自己时代的议程。计算机网络可能会使服务更易获得，但其核心仍将是主导\
  \ 1970 年代计算的笨重大型机。自动化将导致严重的失业，信息系统使用起来仍会笨拙，因为每个人仍必须以计算机程序员的精神来使用它们。没有人想象到个人电脑、图形用户界面和互联网所带来的产业浪潮。事实上，人们甚至怀疑，即使有人*描述*了他们对这些事物的设想，编辑也可能会将其视为过于异想天开而予以驳回。\n\
  \n1972 年接受挑战的作者们的努力可以得出两个教训。首先，无法预见人们将以何种惊人的创造力运用新技术，以及由此对企业产生的连锁反应，企业被迫以新的方式运作和竞争。其次，有一些令人担忧的原因始终保持不变，安全和控制就是其中之一。1972\
  \ 年的作者中有人担心计算机数据库对个人自由的影响，政府可能需要干预与计算机相关的行业，以及信息系统对企业管理和控制的影响。进入二十一世纪初，所有这些辩论仍在继续，尽管系统本身已历经数代技术的发展。\n\
  \n今天做出预测似乎尤其危险，因为电子商务正以如此疯狂的速度推进。然而，这里将大胆提出四项预测（这些预测本身也许能在 2030 年为读者提供一些娱乐）。这样做的目的与\
  \ Meek 在介绍 1972 年研究时所描述的目的相同：\n\n> 试图找出可能出现问题的地方，特别是那些将有重要选择、具有潜在重大意义的选择的地方……我们最担心的是，决策可能被默认作出。\n\
  \nAvebury *et al* 1972: 19\n\n四项预测如下。\n\n* 信息系统不断改变人们对时间框架的认知和期望。IS 控制和安全将难以跟上。\n\
  \n例如，客户将期望*所有*服务都以交互式和即时的方式运行，并将其视为常态。无法立即响应的系统将被视为不合格。这种认知转变很容易观察到，但其后果有时并不明显。不幸的是，很可能控制方面的想法不会足够快地跟上步伐。\n\
  \n对所有类型‘即时’交易的持续转变将使风险大大增加。企业必须确保其控制措施能够迅速启动，并且在出现异常情况或系统受到攻击时能够以‘失效安全’的方式运行。当然，这类策略在许多预防性控制中早已使用，尤其是在防火墙中。然而，它们需要得到更广泛的应用，特别是在信息沿基于电子链接的价值链快速传递的情况下。最终，将会达到一个无法再依赖反馈控制的地步。\n\
  \n与此同时，任何提供交互式服务的企业或公共机构都将继续积累大量数据。其中大部分将是日常交易产生的副产品。最简单也最有吸引力的选择就是简单地将所有这些数据倾倒到大容量存储设备上（这些设备将继续变得更大、更便宜）。鉴于首要任务是让交易尽快运行，总是会诱使人们将记录保存和归档问题留到以后再解决。\n\
  \n不幸的是，这也是时间框架不断缩短的另一个领域。仅几年后，数据可能就变得无法读取或无法使用，原因多种多样。除非数据得到适当过滤和注释，否则可能难以追踪。如果媒体和软件过时，就无法解读。但最重要的是，如果数据未得到保护和认证，就将没有任何证据价值，组织将处于暴露的境地，因为它将没有其他副本可供依赖。\n\
  \n* 新形式的权力斗争和竞争性博弈将在未来几年主导电子商务世界。\n\n在互联网创造的电子金鱼碗中，监控客户、竞争对手，甚至那些试图监管网络活动的个人的活动将变得容易。可以预见，我们将看到新的破坏行动和‘肮脏手段’。这些手段可能特别有效且凶残，因为它们与网络交易本身一样，可以实时进行。已经出现了大量实例，企业被大量虚假信息淹没，或发现具有与自己相似地址的网站上发布了敌对材料，或遭受精心植入的互联网谣言的困扰。\n\
  \n\n\n\n\n这种策略将以快速的步伐发展，并且可能来自相当意想不到的渠道。即使是声誉良好的企业也会被诱惑加入这场纷争，如果所涉及的技术处于法律边缘地带。监管机构将极度缺乏灵活性和管辖权，并且无力对此做太多事情。国际跨境纠纷将是一个特别的问题。即使大多数国家同意执行法规，也总会有那些被诱惑从提供避风港中获利的人，在那里对不光彩的手段视而不见。这些国家将是互联网的等价物，即那些为航运设立宽松许可制度并提供“方便旗”的国家。\n\
  \n大多数政府会发现自己在试图监管的企业方面拥有越来越少的有效权力。由于企业不希望在无政府状态下运营，可以预期施加秩序的动力将来自内部，通过强大的商业联盟来实现。为了安抚消费者，互联网服务提供商和交易商将合作为他们提供“舒适区”。这将伴随着对家庭工作站上发生的事情进行更大控制的举措。服务提供商无法容忍在平均家庭\
  \ PC 上盛行的无政府状态，并将寻求安装基于智能卡和黑盒的解决方案，其最内在的工作原理他们可以随时控制。\n\n### 国家对基于互联网活动的控制将趋向于最小化或完全化。\n\
  \n在两者之间达成妥协将是困难的。在大多数民主国家，存在强大的商业和公民自由游说团体，它们经常在反对国家控制的问题上达成一致。例如，澳大利亚的《广播服务修正案（在线服务）法》，要求互联网服务提供商屏蔽对淫秽和冒犯性网站的访问，就遭到了来自两个游说团体的强烈批评。大多数情况下的结果是几乎不可能执行的薄弱立法。美国能源部委员会发言时，解密办公室主任评论道：\n\
  \n> 我所要说的是，互联网完全在瓦解一种管理哲学，即国会通过法律，而我们官僚执行它们。\n\n> \n> Siebert 1996\n\n人们对互联网将削弱政府权威的担忧，也在与征税能力、防止地下经济的滋生以及执行有关酒类或处方药等商品许可的法律的联系中得到表达。在美国，其中许多问题在\
  \ 1998 年被搁置，当时根据《互联网税收自由法》引入了为期 3 年的任何基于互联网的税收变化的暂停期。\n\n有些人将这一论点推向了最终结论，并预测民族国家的崩溃（Angell\
  \ 1995）。与此同时，一些国家，尤其是中国，已表示决心将互联网上的所有活动置于国家控制之下。如果一个国家愿意在控制技术上大量投资，并且准备用对越界者严厉的惩罚来支持这一点，它很可能会成功。没有理由说互联网不能像它能带来无政府状态一样有效地带来极权主义。\n\
  \n### 消费者将被廉价和便利的在线购物所吸引，但也会发现明显的缺点。\n\n有两个问题尤其突出：\n\n1. *如果出现问题，供应商的不可接近性*。网站只呈现出可接近性的假象。只要供应商愿意，它们就能提供快速响应，但如果客户试图投诉，它们也可以呈现出冷漠的外表。没有冲进当地商店或旅行社并要求与经理交谈的等价物。\n\
  网络供应商可能不会标明其所在位置。即使他们这样做，网络空间的非真实性质也可能使用户着迷。……我们也许不能那么确信我们能够抵制新的操纵形式，特别是如果我们在深夜浏览，或坐在长途飞行中疲倦无聊时。\n\
  \n人们对互联网将使人们“信息丰富”的方式大加赞扬。然而，如果信息本身质量低下且不可信，这种丰富将是虚幻的。没有人会因为能够轻松筛选大量垃圾而变得更好。\n\n\
  对于企业来说，就像对于个人一样，如果对其准确性和完整性存在持续的怀疑，那么拥有轻松获取信息的能力的价值将会大幅下降。一个令人欣慰的前景是，员工将通过他们对互联网的个人体验获得对这一问题的新的认识。如果他们发现尝试在网上找到可靠信息令人沮丧，他们可能会对在工作生活中为他们提供受控信息的努力更加同情。\n\
  \n\n\n\n\n另一方面，也有可能出现新的“网络怀疑主义”形式，人们会简单地对这些问题耸耸肩，因为它们被视为超出其控制范围。无论大众情绪发生何种变化，有一点是肯定的：企业管理者需要密切监控它。信息系统的安全和控制最终并不取决于硬件或软件，而取决于使用它们的所有人。\n\
  \n# 附录一：管理人员的十二条经验法则\n\n1. 无论你对信息系统感到多么不足，也不要仅仅因为他们看起来比你更热情或更有知识，就把责任交给别人。\n2. 倾听你的员工关于他们在使用系统时遇到的困难的反馈。假设为了绕过他们的问题，他们可能会忽视或规避控制措施（例如，通过走捷径）。\n\
  3. 在可能的情况下，优先使用预防性控制而非反馈性控制。\n4. 不要认为人们对生活、工作、风险或纪律的态度会仅仅因为他们坐在电脑屏幕前就有所改善。\n5. 对违反基本安全规则的行为，如密码保密问题，要提出质疑，但要保持一致，不要过度。始终为即将做某件极其愚蠢的事情的人保留一些后手。\n\
  6. 不要认为安全产品无论多么令人印象深刻就是唯一的补救措施。始终假设可能存在更简单、低技术的替代方案。\n7. 如果你正在考虑购买安全产品，确保你（而不是供应商）能够精确描述它将防范的威胁。\n\
  8. 始终将检查清单视为思考过程的起点，而不是让你确信自己已涵盖每一种可能情况的方式。\n9. 如果你的组织中没有计算机审计员，请说服某人偶尔以业余身份承担该角色。让他们以新鲜的眼光审视你使用的系统，并告诉你任何令他们担忧的明显弱点。\n\
  10. 始终假设从未知来源获得的文件和程序都被感染了相当于炭疽、肉毒杆菌和黑死病的病原体。\n11. 即使你有一流的记录保留政策，也不要认为人们正在按照政策执行。偶尔随机索取一份历史记录。问问自己，如果需要的话，它能否作为证据站得住脚。\n\
  12. 不要认为你的灾难恢复计划的任何方面“到时候会一切顺利”。它不会。\n\n# 附录二：有用的互联网地址\n\n有关产品、标准和立法的最新信息可以在互联网上的各种网站上找到。下面给出了一些网站地址（URL）的选择。只提供了基本地址，因为各个页面地址经常会根据网站的决定而更改。在大多数情况下，需要在网站内进一步搜索或导航才能找到与安全和控制相关的材料。许多网站还提供了指向其他相关网站的有用链接。\n\
