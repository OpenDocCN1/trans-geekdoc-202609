  \n\n\n\n\n\n\n\n\n\n\n\n\n## 鸣谢\n\n信息系统（IS）安全与控制是一个快速变化的领域，而且在其中公开信息往往会受到强烈阻碍。我深深感激许多为本书写作提供指导的人，他们提供了大量信息，往往是非正式的。特别是，我要感谢英国计算机学会的各专业小组的成员，包括\
  \ Tony Ball、Fleur Fisher、Mary Hawking、Glyn Hayes、Brian Layzell、Willie List、John\
  \ Pike 和 Mark Treleaven。BCS 计算机审计专业小组通过其会议也提供了宝贵的信息。我还受益于研究生和应届毕业生的诸多挑战和想法，特别是 Olivier\
  \ Massart 和 Jog Dhody。\n\nRay Hackney 和 Steve Clarke 对文本早期草稿进行了非常彻底和有帮助的审阅，Andrew\
  \ Thomas 则就撰写书籍的压力提供了切实可行的建议。尽管他们尽了最大努力，本书中无疑仍存在许多不足之处，这些责任由作者承担。\n\n## 出版商致谢\n\n\
