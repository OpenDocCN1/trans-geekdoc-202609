  \n### 黑客与病毒\n\n此类网站显然需要谨慎浏览。由黑客运营、面向黑客的网站可以提供有趣的信息，但最好使用一台不包含任何您珍视数据的 PC 进行访问。\n\
  \n主要的反病毒软件供应商维护着参考网站，它们是获取当前信息的良好来源。骗局病毒在许多网站上被追踪，包括：\n\n*   [www.urbanmyths.com](http://www.urbanmyths.com)\n\
  *   [urbanlegends.miningco.com](http://urbanlegends.miningco.com)\n*   [www.symantec.com/avcen](http://www.symantec.com)\n\
  \n# 术语表\n\n**访问控制**\n\n: 一种识别信息系统授权用户、并确定他们被允许使用系统内哪些设施的方法。\n\n**访问控制表**\n\n: 一张列出所有被授权访问信息系统或其中某个应用程序人员的表。针对每个用户标识符，该表指明该用户被允许或不被允许做什么。\n\
  \n**ALE（年度损失期望值）**\n\n: 一种比较风险的简单方法。针对给定威胁可能造成的损害估算出一笔现金金额，然后乘以该威胁在任何一年内发生的概率。\n\
  \n**算法**\n\n: 在密码学中，指一组指令（通常以计算机程序的形式），决定明文如何转换为加密消息，反之亦然。\n\n**应用控制**\n\n: 其范围仅限于某一特定应用程序的控制。应用程序是指专门服务于组织内某一特定职能（如会计或计算机辅助设计）的单个程序或一套程序。\n\
  \n**非对称密码学**\n\n: 一组基于特殊生成的密钥对使用的密码技术。一个密钥用于加密消息，另一个密钥用于解密。如果发送者保管好一个密钥（私钥）并公开另一个密钥（公钥），就有可能创建数字签名（见相关条目）。\n\
  \n**审计**\n\n: 由独立评估人员进行的审查。审计概念由会计师发展而来，他们定期进行*外部*审计，以让利益相关者放心，确信组织的财务事务得到妥善管理。*内部*审计由组织内部员工执行，通常以更持续的方式进行。\n\
  \n**审计追踪**\n\n: 一组证据，使审计员能够追踪业务流程每个阶段发生了什么。追踪记录可能包含计算机记录和纸质文档的混合体。\n\n**认证 / 鉴权**\n\
  \n: 通常通过自动化手段，由电子交易双方中的一方提供身份证明。\n\n**生物特征识别 / 生物测定学**\n\n: 可用作自动识别基础的一个人的物理属性或特征，例如独特的声纹或指纹模式。\n\
  \n**分组密码**\n\n: 一种加密方法，其中数据首先被分成固定长度的块（通常为 64 位或更多）。然后每个块依次由密码算法进行转换。这会给数据带来一些“断续性”，这可能使该技术不适合“实时”声音或视频传输。另见流密码。\n\
  \n**业务连续性规划**\n\n: 一项全企业范围的工作，旨在识别可能严重损害业务运作能力的威胁。然后制定计划以消除此类威胁，或在无法预防时将其影响降至最低。\n\
  \n**CEN（欧洲标准化委员会）**\n\n: 也称为欧洲标准化委员会。致力于推广欧洲的技术标准。\n\n**认证机构**\n\n: 一个信誉良好的机构，颁发电子证书以证明公钥的真实性。每个证书至少应显示密钥所有者的身份（无论是个人还是组织）、密钥的副本以及有效期。证书应由\
  \ CA 进行数字签名。\n\n**校验位**\n\n: 在参考号码（如增值税注册号或信用卡号）末尾添加一位或两位额外数字。每当号码被重新录入系统时，这些额外数字都会被重新计算，作为检查该号码是否有效的一种方式。\n\
  \n**中间隔离 / 防火墙**\n\n: 一种安排，即同一组织内的人员之间对某些信息（通常与客户有关）相互保密。\n\n**CISA（注册信息系统审计师）**\n\
  \n: 由 ISACA（见相关条目）管理的资格认证。\n\n**COBIT（信息及相关技术控制目标）**\n\n: 一套由 ISACA（见相关条目）开发的用于实施安全和控制的标准。\n\
  \n**冷备份**\n\n: 发生灾难时可将计算机服务转移至的备用站点。该站点仅具备基本设施，可能需要一两天时间才能使服务启动运行。\n\n**并发性**\n\n\
  : 适用于内置于系统中的计算机审计功能的术语，这些功能可以在系统实际使用时被激活。\n\n**控制总计**\n\n: 如果正在向应用程序录入一批条目，或正在执行一系列计算，系统会按数量或价值计算出一个适当的总计。然后独立地重新计算该总计，并将两个结果进行比较。\n\
  \n**CRAMM（CCTA 风险分析与管理方法）**\n\n: 由英国政府中央计算机与电信局设计的一种风险分析方法论。\n\n**CRL（证书吊销列表）**\n\
  \n: 由认证机构发布的列表，列出了其已颁发但尚未到期、但 CA 希望注销的证书。该列表应由 CA 进行数字签名，以证明其真实性。\n\n**对策**\n\n\
  : 针对信息系统的每一种威胁，都会有一种或多种可能的对策。这些对策要么防止威胁发生，要么大幅降低其影响。\n\n**密码学**\n\n: 使用算法和密钥对数据进行转换，使其能被他人复现或逆向还原。最初主要用于提供通信保密性，密码学现在在提供防篡改、签名和时间戳等功能方面发挥着大大扩展的作用。\n\
  \n**数据加密标准**\n\n: 一种基于 64 位分组的对称加密技术，首次作为标准发布于 1977 年。\n\n**解密**\n\n: 对加密消息进行解码，以显示（有意义的）明文。有时也称为破译消息。\n\
  \n**Diffie-Hellman 密钥交换**\n\n\n\n\n\n# 术语表\n\n## An early method of establishing\
  \ a private key\n当两个人试图通过不安全的通信链路建立私钥时的一种早期方法。以其发明者 Whitfield Diffie 和 Martin Hellman\
  \ 的名字命名。\n\n## Digital Signature\n任何数字材料都可以使用签名者的私钥通过非对称加密进行“签名”。签名者必须绝对保密该密钥。任何知道签名者*公钥*的人都可以解密该材料。成功解密确认该材料确实来自签名者。\n\
  \n## Disaster Recovery Plan\n一份详细计划，规定组织的信息系统遭受严重退化或损坏时应采取的措施。该计划应定期进行测试。\n\n##\
  \ Discretionary Access Control\n允许用户“拥有”某些数据或设施，并决定是否授予其他用户访问权限的系统。这种安排在基于大型机的早期分时系统中被视为相当先进。随着个人计算机的出现，用户控制“其”资源并按自主基础共享这些资源已成为司空见惯的做法。\n\
  \n## EDI (Electronic Data Interchange)\n使用标准电子格式交换业务报文。\n\n## EDIFACT (Electronic\
  \ Data Interchange for Administration, Commerce and Transport)\n一种国际采用的 EDI 报文标准。它包含一些用于认证和安全的可选规定。\n\
  \n## Electronic Purse\n一种可以存入现金价值的智能卡。持卡人可以在拥有适当读卡设备的零售商处“花费”该现金。\n\n## Electronic\
  \ Wallet\n安装在用户个人计算机上的程序，当通过互联网进行金融交易时接管控制权。\n\n## Electronic Watermark\n一种证明电子（数字）材料作者身份或所有权的方法。另请参阅\
  \ Steganography。\n\n## Encryption\n对一段明文进行编码，以生成（不可理解的）加密报文。有时也称为 enciphering。\n\
  \n## ETSI (European Telecommunications Standards Institute)\n一个制定欧洲标准的论坛，拥有数百名成员，主要来自电信行业。\n\
  \n## EU (Expected Utility)\n一种量化风险的方法。通过将结果的大小（通常以货币收益或损失衡量）乘以该结果发生的概率来获得。\n\n##\
  \ Escrow\n将电子材料副本存放给独立第三方的安排。可以规定在何种情况下以及向谁发布该材料。通常涉少量高价值材料，例如加密密钥。\n\n## False\
  \ Negative\n用户识别失败的一种，即合法的授权用户被系统错误地拒绝。\n\n## False Positive\n用户识别失败的一种，即冒名顶替者（假装成授权用户）被系统错误地接受。\n\
  \n## Feedback Control\n一种依赖于在事件发生*后*采取补救措施的控制。（例如，通过检查电话交换机生成的日志来检测未经授权的电话呼叫）。\n\
  \n## Firewall\n安装在组织内部数据网络与外部网络（通常是互联网）边界上的保护设备。防火墙将过滤掉某些形式的不需要的流量和发起恶意攻击的尝试。\n\n\
  ## Fraud\n资产的挪用，或制造财务状况的误导性印象，行为人试图隐瞒任何不当行为的事实。\n\n## General Control\n应用于整个系统的任何类型控制的统称。这一概念更容易应用于基于一个或多个中央大型机的系统，因为“系统”几乎完全位于一个机房内。然而，在更复杂的分布式系统中，通用控制仍然是必要的，特别是在提供访问控制的“外部边界”方面。\n\
  \n## Generation Data Sets\n一种轮换使用存放备份的介质的技术。通常有三代副本。每当制作新的备份副本时，*最旧*的版本会被覆盖，从而成为最新的一代。\n\
  \n## Groupware\n旨在使工作组能够共享文件、程序和传入的电子文档的软件，通常具有供管理者监控和控制的功能。\n\n## GSM (Groupe Spéciale\
  \ Mondiale)\n一种移动电话国际标准，有时被英文化为 Global System for Mobile Communications。用户识别由 SIM\
  \ (Subscriber Identification Module) 提供。\n\n## Hacker\n在报刊用语中，指对信息系统进行恶意攻击的人，特别是跨数据网络的攻击。最初，“hacker”指对计算机内部结构有着痴迷兴趣的任何人。\n\
  \n## Hoax Virus\n一种电子邮件，声称警告互联网上流行的病毒或其他危险。收件人被敦促转发该警告。实际上不存在危险，该邮件的目的是制造恐慌和大量不必要的邮件。\n\
  \n## Hot stand-by\n一种提供计算机服务的备用设施，可在灾难发生时迅速激活。\n\n## IAB (Internet Architecture\
  \ Board)\n（前身为 Internet Activities Board）一个协调互联网发展并推广技术标准的机构。\n\n## ISACA (Information\
  \ Systems Audit and Control Association)\n一个长期致力于推广 IS 安全领域良好实践和专业标准的机构。总部位于美国，在世界其他地区设有分会。最初名为\
  \ EDP Auditors Association。\n\n## IIA (Institute of Internal Auditors)\n一个总部位于美国的组织，其成员从事内部审计、计算机审计、治理和内部控制工作。\n\
  \n## IIA-UK (Institute of Internal Auditors – United Kingdom)\n与同名的美国机构职能相似，并与其有联系。\n\
  \n## (ISC)² (International Information Systems Security Certification Consortium\
  \ Inc)\n一个为 IS 安全从业者提供认证的非营利性公司。\n\n## ISDN (Integrated Services Digital Network)\n\
  一种数字电信线路标准，可以像普通商用或家用电话线一样通过“拨号”按需连接。\n\n## ITAR (International Traffic in Arms\
  \ Regulations)\n美国关于军火出口的法规。“军火”的定义包括加密产品和算法。\n\n## ITSEC (Information Technology\
  \ Security Evaluation & Certification Scheme)\n欧盟委员会推动的一项计划，旨在制定评估 IT 产品和系统安全性的标准。\n\
  \n## KDC (Key Distribution Centre)\n一种基于中央计算机存储和分发加密密钥的方法。密钥通常是对称的，用户群是“封闭的”（例如，仅限于一个组织的员工）。\n\
  \n## Kerberos\nKDC 功能的扩展，最初在麻省理工学院开发，通过向用户发放电子“票据”，授权他们使用内部网络上的各种设施。Kerberos 经历了多个版本的演进，并已被纳入商业产品中。\n\
  \n## LEAF (Law Enforcement Access Field)\n美国政府在 1990 年代初大力推广的“Clipper”加密芯片的一个有争议的特性。LEAF\
  \ 提供了一种确定加密密钥的“后门”方法，从而解码报文。\n\n## MAC (Mandatory Access Control)\n\n\n\n\n\n# 术语表\n\
  \n## 强制访问控制\n\n一种控制系统，旨在对每个用户可用的设施和数据设置限制，这些限制由中央系统管理员确定。个人用户**无权**传递或共享其任何特权（参见自主访问控制）。\n\
  \n## MAC (Message Authentication Code，消息认证码)\n\n添加到消息中的一段简短代码，接收方可借此检查消息是否被篡改。（尽管名称中提及“认证”，MAC\
  \ 不一定能提供发送者身份的证据）。\n\n## 消息摘要\n\n一种消息认证码形式。消息摘要算法已定义多项标准，使用哈希函数生成一个长度短、固定的值（通常为\
  \ 128 位）。\n\n## MIC (Message Integrity Check，消息完整性检查)\n\n消息认证码的另一种称呼。\n\n## 不可抵赖\n\
  \n一种旨在防止消息发送者事后否认其发送过该消息的机制。这可通过要求使用数字签名，或在通信序列中加入额外步骤来实现。\n\n## 一次性密码本\n\n一种加密方法，通信双方各持有一份相同的、随机选取的数字或字母字符串。该字符串长度必须至少等于待加密消息的长度。随后按一组简单规则将字符串与消息结合。这是一种极其安全的方法，但建立和维护非常麻烦。\n\
  \n## 橙皮书\n\n美国国防部发布的一套安全标准（可信计算机系统评估标准）。\n\n## 口令短语\n\n有时用于区分“激活存储加密密钥所输入的密码”与“登录信息系统设施的密码”的术语。\n\
  \n## 密码\n\n用户在获准访问信息系统设施前必须输入的一串字符。\n\n## PGP (Pretty Good Privacy，优良隐私协议)\n\nPhil\
  \ Zimmerman 在互联网上发布的一款共享软件加密产品。采用非对称密钥建立每次通信。用户以非正式方式互传公钥。\n\n## 电话破解者\n\n指利用技术手段窃取免费电话通话、并在电信网络上实施其他类型欺诈的人员。\n\
  \n## PICS (Platform for Internet Content Selection，互联网内容选择平台)\n\n一种用于标记万维网上可访问文档内容的通用系统。\n\
  \n## PIN (Personal Identification Number，个人识别号码)\n\n一种密码形式。仅使用数值，因此可通过智能卡、自动柜员机等键盘输入。\n\
  \n## PKI (Public Key Infrastructure，公钥基础设施)\n\n一种确保用于加密的公钥（非对称密钥）安全分发和维护的服务。\n\n\
  ## 预防性控制\n\n一种能检测潜在安全或完整性问题并立即采取保护措施的控制。（例如：通过在交换机中设置拦截名单，防止员工拨打特定电话号码）。\n\n## 隐私增强技术\n\
  \n应用于一系列技术的术语，旨在确保无法从聚合数据中检索个人详细信息（例如：为管理或规划目的提供统计数据）。\n\n## 私钥\n\n一种仅在保密前提下有效的加密密钥。*非对称*私钥应仅为一人所知。*对称*私钥至少需为两人所知，因为加密和解密使用同一密钥。\n\
  \n## 进程\n\n在信息系统语境下，为提供特定服务（通常面向单个客户）而必须按顺序完成的一系列任务或事务。\n\n## 公钥\n\n在非对称加密中生成密钥对时，其中一个密钥可公开给所有人，成为“公钥”。随后可用于验证数字签名。\n\
  \n## RAID (Redundant Array of Independent Drives，独立磁盘冗余阵列)\n\n将大量小磁盘驱动器组合成一个单元。与同等容量的单个大磁盘驱动器相比，RAID\
  \ 存储提供更快的检索时间，且单个驱动器故障导致整体失效的脆弱性更低。\n\n## RSA\n\n一种非对称加密方法，1978 年提出，以其发明者（Ronald\
  \ Rivest、Adi Shamir、Leonard Adleman）命名。\n\n## SDLC (System Development Life Cycle，系统开发生命周期)\n\
  \n实施新信息系统的一系列步骤，从最初的构想，到系统投入运行后的评估。\n\n## SET (Secure Electronic Transaction，安全电子交易协议)\n\
  \n一种用于基于信用卡支付的互联网交易中、对交易双方进行认证并提供通信保密性的标准。\n\n## 智能卡\n\n一种尺寸与普通信用卡相同、但内嵌计算机芯片的塑料卡。芯片可编程以协助安全检查，或在卡作为电子钱包使用时存储现金价值。\n\
  \n## 社会工程学\n\n利用骗取信任的伎俩及其他狡猾手段，诱导人们泄露敏感信息（如密码或个人档案）。\n\n## SSL (Secure Socket Layer，安全套接层)\n\
  \n一种保护用户网页浏览器与远程站点间互联网通信的方法，包含保密性和认证功能。\n\n## 隐写术\n\n一组将消息隐藏在电子文件（可包含文本、声音或图像）中的技术。隐藏的消息可用于传递秘密信息，或作为文件素材所有权的证据。\n\
  \n## 流密码\n\n一种对极短“数据片”（例如每次 8 位）进行操作的加密算法。这意味着加密不会干扰数据的平滑流动。然而，流密码往往比分组密码较弱。\n\n\
  ## TCSEC (Trusted Computer System Evaluation Criteria，可信计算机系统评估标准)\n\n美国国防部发布的一套安全标准，常被称为“橙皮书”。\n\
  \n## 威胁\n\n对信息系统完整性或安全性构成的危险来源。\n\n## 时间戳\n\n一种证明电子（数字）材料最初存储于特定日期且自那时起未被篡改的方法。\n\
  \n## 令牌\n\n一个人持有的、访问信息系统所必需的物件。例如：带磁条的塑料卡、响应无线电信号的钥匙扣。\n\n## 事务\n\n在信息系统语境下，事务是构成系统主要活动的日常例行任务——例如：创建新客户记录、通过网页下订单。\n\
  \n## 后门\n\n软件中的薄弱点，可能是有意或无意留下的，允许某人在软件运行时、不受任何访问控制约束地更改其功能或设置。\n\n## 特洛伊木马\n\n安装在信息系统中、具有（或看似具有）合法功能、但包含恶意代码的程序。通常由“内部人员”（如更新系统部分代码的程序员）植入。\n\
  \n## UMTS (Universal Mobile Telecommunications System，通用移动电信系统)\n\n一种全球移动电话标准，包含数据传输功能。\n\
  \n## UPS (Uninterruptible Power Supply，不间断电源)\n\n一种电池驱动的电源，在停电时立即切入。通常旨在提供短期电源，以便作出替代安排（如启动发电机）。\n\
  \n## VAN (Value Added Network，增值网络)\n\n一种将电信服务的建立和管理责任移交给外部承包商、由承包商以多种方式“增加价值”（例如：协助\
  \ EDI）的安排。\n\n## 病毒\n\n\n\n\n\n## 病毒\n\n: 一种旨在将自身从一台计算机传播到另一台计算机的程序。每个病毒都需要一个“载体”，这通常是人们会忍不住传播的“趣味”材料，例如计算机游戏或屏幕保护程序。病毒的影响严重程度各不相同，从显示恼人的消息到擦除磁盘上的所有数据。\n\
  \n## 蠕虫\n\n: 一种专门设计用于通过网络链路自我延续传播的病毒（在此过程中通常会对网络连接造成某种损害）。\n\n# 参考文献\n\n*   Adams,\
