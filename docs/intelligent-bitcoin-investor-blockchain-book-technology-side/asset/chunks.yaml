- raw: 'INTRODUCTION ![](rsrcHV.jpg)“Side Hustling” Cryptocurrency Is Allowing People
    To Quit their Jobs, Travel The World, Pay Off All Debt, And Setting Them Up For
    A Luxurious And Comfortable Retirement. I’m going to show you the 3 step system
    we use to consistently make 5 figures per month in cryptocurrency… with a 90%
    success rate, with less than 30 minutes of work per day. If that sounds far fetched,
    believe me, I know. I felt that way too. But after seeing my own success and the
    success of my friends and students, I know this is real and can be for you too
    In this book, we’re going to be sharing some amazing and real success stories
    of people I’ve helped make real money with cryptocurrency. In fact, I’m going
    to show you real stories of real people, and the mind boggling opportunities still
    on the possible for you in 2020. Opportunities that WONT LAST FOREVER. As the
    cryptocurrency market matures, it will get a lot harder to make money if you haven’t
    started early. This is a unique chance to set yourself up for life. We are going
    to open your mind up to a brand new opportunity today... Regular people are using
    the advice I’m about to give you to quit their jobs early with crypto in just
    a few hours a day. In no way, shape, or form am I saying that you will for sure
    be able to do the same. This is not some get rich quick commercial. I don’t know
    you personally, I don’t know how motivated you are, how interested you are, or
    anything about you other than you obviously have a desire to make some more money.
    The stories in this book are to show you what others have achieved, and should
    not be taken as a guarantee to what you can make, more like what is possible for
    you with the right work ethic, training, and patience. My name is Iman Schafei
    and I’m the CEO and founder of genius wealth secrets. I’m excited to share what
    I know with you today. One of my passions is finding new opportunities and investing
    in them. Testing them out myself and then teaching them to my friends and students.
    Every single day, I see people giving out bad advice and I can’t just sit back
    and watch that. It drives me nuts because these people are practically stealing
    people’s money. There are only a select few teachers we can trust for sound advice
    - it’s my job to be one of them. In this book, I’m going to show you 3 things:
    1\. The biggest opportunity with cryptocurrency - how we make money with it profitably,
    without being glued to the screen all day, without needing a ton of startup money,
    and without having to become a mathematician or economist. 2\. The 3 step trading
    system we use to consistently make 5 figures per month in EASY markets… with a
    90% success probability, in less than 30 minutes of work per day 3\. How to get
    in on it right now, no matter your experience level, prior training, whether the
    market is up or down, or where you live I’m going to show you The Path to a new
    life. Over the next hour, I’m going to show how to give yourself a new 5 figure
    monthly Income. That’s right. I said monthly. This might sound a little unbelievable
    to you as it did to me when I first started many years ago, but this is exactly
    what we help our hundreds of students achieve every single day. I’m not sure why
    you are here today, in my experience it’s usually for a few different reasons.
    Maybe you are already trading and want to have better returns. Maybe you need
    more monthly income and don’t want to get a second job Maybe you want to trade
    full time so you don’t need to work a job anymore Maybe you are determined to
    setup a comfortable safe retirement If any of these apply to you, you are in the
    right place. Please read every sentence carefully… the devil is in the details.
    You have taken the time to train with me today - so do yourself a favour and put
    your phone notifications on silent, lock the kids in the closet if you have to,
    turn the TV off, and do whatever it takes to give yourself the gift of full focus.
    You get out of life what you put into it - put in the effort now to give me your
    undivided attention as I show you the way out… a way to a brand new life starting
    today just like my students Here’s the really cool thing about this: We only use
    trading strategies reliably proven. I’m glad you are here now because it’s always
    smart to get in before the masses. That last thing I want is for you to miss out
    on something that could have made a big difference in your life. Think about how
    many inventions, investments, and good opportunities you’ve personally watched
    go to the moon while you kick yourself thinking, “I knew that was gonna take off…
    but I didn’t do anything about it.” Don’t let that happen again. It’s your time.
    If making a retirement fortune seems impossible to you right now, believe me…
    I know how you feel! But you don’t need to make a fortune right now. Take it slow…
    work your way up. Replace your job income first - that is a great, sensible goal
    for most people. Imagine the feeling if not HAVING to work at a job? Instead,
    you spend an hour or two a day making some trades… At the end of the day, what
    I’m really talking about is taking your freedom back. What you’ll discover here
    today, will set you on a new path… a path that will set you free. My goal is to
    help you and 10,000 others have what I call “the 3 freedoms” – Financial Freedom
    (bills paid, debt paid, don’t have to work, no waiting to buy the things you want)
    – Time Freedom (Travel, volunteer, afternoon movies, restaurants, sleeping in
    on Monday) – Choice Freedom (Nobody tells you what to do, where to be, or when
    to be there) I promise to walk you through a step-by-step strategy to replacing
    your income and retiring early in a few years or less by trading and investing
    - even if you don’t have a ton of money to start with. What Is The Market I am
    saying is the best in the world right now for trading? Mark Zuckerberg, the owner
    of the largest social media platform in the entire world… not only is he ALL IN
    on investing in this, but he is also ALL IN on creating his OWN… So he can offer
    it to his 2.8 BILLION users. Maybe you’ve heard the news? I’ll just tell you.
    Mark Zuckerberg recently announced that Facebook will be launching its own crypto
    currency for their 2.8 billion users. This is BIG… because it proves what I’ve
    been saying for years - crypto currency is the future of money and fortunes created
    from it. Think about it - By Facebook having their own currency for almost 3 billion
    people, they can become more powerful than many COUNTRIES! Facebook isn’t the
    only company getting in on this crypto currency boom. Some of the largest countries
    and companies in the world are jumping on this and it’s not a brash jump… these
    are very calculated moves. I’m here to teach you about the huge opportunities
    trading and investing in crypto currency while it’s still early - the second wave
    has not hit yet but when it does, a lot of people are going to get very rich.
    If you bought 1000 bitcoin in 2011, you’d have paid one thousand US dollars. Today,
    your $1000 would be worth over 9.4 million. Aside from Bitcoin, there are over
    1600 OTHER cryptocurrencies being traded every single day. I told you this was
    underground but I never said it was small! Bitcoin alone has an average of 300,000
    transactions or trades per DAY! ![](rsrcHW.jpg)Imagine adding up the other 1600
    cryptocurrencies… we’re talking tens of millions of trades per day in the cryptocurrency
    market. The top 6 crypto currency exchanges have a trading volume of over 1 BILLION
    dollars per DAY ![](rsrcHX.jpg)And there’s over 262 different cryptocurrency exchanges…
    The money that is being made right now is mind boggling… do you want some of it?
    Because it’s never been easier to profit in crypto no matter what the market is
    doing. BUT... if you want to make the MOST amount of money in the LEAST amount
    of time, you need to get in before the second wave… “I want to give you a secret
    to making all of this work for you. Bitcoin is a digital currency that first came
    out in 2009. Since it is a digital or virtual currency, it may be sent or exchanged
    through the internet. It is one of the first digital currencies to be decentralized,
    with its creation attributed to an individual known as Satoshi Nakamoto. Bitcoin
    today is considered to be the future of online currency, and it’s easy to see
    why. What are the Advantages of Bitcoins? As a type of online currency, Bitcoin
    offers a wide range of benefits. The following are some of its strongest advantages: '
