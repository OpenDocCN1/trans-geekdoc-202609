    \ these transactions are recorded into a ledger. This is done to keep track of\
    \ payments, including the senders, receivers, and the kinds of transaction that\
    \ took place. The transactions are collated into a list, also known as a block.\
    \ When a transaction takes place, the miners verify and confirm the transactions\
    \ and record them into a public ledger. This long list of blocks is called a blockchain.\
    \ The blockchain is used to identify, evaluate, and confirm any transaction done\
    \ between bitcoin addresses. A new list is added to the blockchain after a single\
    \ transaction. However, the ledger is available only digitally. This raises the\
    \ question of security and accuracy. To ensure that the blockchain is continually\
    \ updated and verified, the miners involve themselves and subject each update\
    \ into a process. With information derived from the block, the miners apply a\
    \ mathematical formula to arrive at a hash. The hash is composed of randomly sequenced\
    \ letters and numbers, which is compiled along with the block. The hash can be\
    \ found at the end of a blockchain within a specific period. \n\n*   What are\
    \ other features of the hash? A hash is a unique combination of letters and numbers\
    \ that play a role in keeping a blockchain intact. Although data from a block\
    \ can be used to generate a hash, it will be impossible to identify the data used\
    \ from which block just by simply looking at a hash. Each hash is unique so that\
    \ altering any character in the bitcoin block will also alter the resulting hash.\
    \ Furthermore, miners do not generate a hash simply by sifting through transactions\
    \ in the blockchain. The hash of the last block stored in the blockchain is also\
    \ needed in order to create a new hash. This makes the blockchain more secure\
    \ and easier to identify if and when tampering occurs. A fake transaction may\
    \ involve altering a stored block, which will then result in a change in the block’s\
    \ hash. Once a hashing function is run, and the hash is found to be dissimilar\
    \ to the one stored in the blockchain, the transaction will be classified as fake.\
    \ \n\n*   How do miners compete for coins? Using software specifically designed\
    \ for mining blocks, miners compete among themselves to seal a block and create\
    \ a correct hash. Once a miner is able to do this, he or she gets rewarded with\
    \ 25 bitcoins. This has provided a solid incentive for mining to continually take\
    \ place as well as for the blockchain to be constantly updated and secured. Nonetheless,\
    \ computers may find it too easy to generate a hash from available block data.\
    \ It is important for the bitcoin network to make the process more complex in\
    \ order to prevent the generating of hashes in just a matter of seconds. To establish\
    \ a sort of protocol, Bitcoin requires proof of work. The hash has to appear in\
    \ a certain way, such as having the required number of zeroes. To create a different\
    \ hash, miners have to use a nonce. The nonce is altered every time a hash fails\
    \ to follow a specific format, and the hashing process recommences. It is important\
    \ to find a nonce that generates a hash in the required format. Miners earn bitcoins\
    \ once this correct hash is created. \n\nTHE PROFITABILITY AND ACCEPTABILITY OF\
    \ BITCOINS ![](rsrcHV.jpg)In a Bitcoin network, you can find a unique set of players\
    \ who do not trust everybody else, so that verification takes top priority. It\
    \ also helps that participants are given incentives to take part in verification.\
    \ Bitcoin miners are the ones responsible for keeping the entire infrastructure\
    \ safe and secure. In return, their work is paid for through new bitcoins and\
    \ network fees paid for by Bitcoin users. Despite the bitcoin network’s bi-weekly\
    \ update on the difficulty involved in mining, the number of bitcoin mining participants\
    \ shows no signs of slowing down. HOW IS BITCOIN POISED FOR GROWTH? Recent media\
    \ mileage has placed bitcoins and other cryptocurrencies in the spotlight, especially\
    \ with their market performance in investment value. The fact that the U.S. dollar\
    \ continues to weaken has also helped catapult bitcoins into a bigger share of\
