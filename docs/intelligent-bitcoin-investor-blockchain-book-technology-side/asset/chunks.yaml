    # 比特币安全吗？


    ![](img/rsrcHV.jpg)


    显然，比特币已经超出了主流范围。事实上，预计比特币在很长一段时间内都不会被视为主流，这可能是合理的。然而，忽视比特币的价值可能是一个草率的决定。截至 2017
    年 1 月，价值 149 亿美元的比特币已经在流通。作为支持比特币的技术，区块链，的普及程度正在稳步增长。区块链基础设施最终可能会挑战传统交易、银行和其他类型交易的某些流程。尽管如此，问题仍然存在：比特币有多安全？


    ## 作为高风险货币的比特币


    作为加密货币，比特币不可能没有重大的风险。在瑞瑞银行全球市场研究部的一份报告中，加密货币的波动性是石油的三倍，不是美元兑英镑汇率的十一倍。


    在传输过程中，比特币金额是不可逆的。因此，在购买或传输期间输入金额时不允许任何错误。此外，用户访问比特币账户使用的密码是私有的且不可重置的。如果用户忘记了`private
    key` 或被他人破解，比特币将无法找回。


    ## 区块链的免疫结构


    尽管潜在的黑客攻击具有风险性，但支持比特币交易的区块链技术被认为对黑客攻击具有免疫力。该架构并不是记录个人账户，而是编译所有通过比特币进行的所有过去交易。


    在个人传输期间，所有运行`bitcoin software`的计算机将处理发送者的`public signature`。该签名将与区块链中编码的交易一起通过验证，以识别是否为账户的所有者发送了比特币。区块链中还有其他计算机进一步验证该过程。


    一旦交易完成，它就会收集到所有之前交易的记录中。然后，矿工开始竞争一个旨在验证区块链的数学难题。在矿工宣布宣布胜者之前，其他矿工必须首先验证所有交易的有效性。获胜的矿工将获得新造的比特币作为奖励。这是增加比特币货币供应并确保每次比特币交换或交易的准确性的良好方法。


    ## 攻击概率


    尽管如此，关于攻击概率的问题仍然围绕着比特币行业。黑客是否可能操纵区块链并将资金转到他自己的账户？答案是肯定的，但只有在黑客拥有卓越计算能力时才可能。这是因为目前的比特币交换交易只能通过查看所有历史交易来验证。这意味着计算机不仅必须解决当前的区块链，还要解决与其相关的所有区块。


    区块链如此复杂且错综，瑞瑞银行将其比作地质层，最近的区块是软土，而之前的区块是硬的沉积岩。区块链越深，它就越复杂。这使得区块链更难被破解和操纵。


    ### 51% 攻击


    当比特币矿工将比特币价值份额集中在自己之间时也会发生巨大的风险。如果单一实体获得整个网络超过`51 percent`的控制权，就存在风险新交易或删除之前交易的可能性。瑞瑞银行估计，即使是对网络的`30
    percent`控制，也会允许恶意矿工干预近期交易。因此，`51 percent control attack`可能会导致所有比特币价值的崩溃。


    这种规模的攻击不仅会影响恶意矿工自己，还会影响他们正在破解的资产。因此，任何恶意攻击者从一开始可能自己就是一名矿工，即一个对确保整个账本合法性和准确性所需的流程有深入了解的人。


    ### 加密货币网络盗窃


    毫无疑问，区块链技术的独特设计具有威慑攻击尝试的能力。然而，在线交易所和数字钱包可能会成为网络攻击的受害者。


    2016 年 8 月，`Bitfilnex`交易所的黑客攻破了 119,756 个比特币，总价值 8200 万美元。最大的网络攻击案例之一发生在 2014
    年，通过`Mt. Gox`比特币交易所，黑客最终偷走了价值 5.9 亿美元的 850,000 个比特币。尽管进行了追回努力，但追回的硬币数量仅占总额的`24
    percent`。在各种报告揭露了公司内部不道德经营行为后，日本检察官指控`Mt. Gox`执行官`Mark Karpeles`贪污罪。


    结论，区块链技术是一种用于数字货币交易和交换的高度安全的架构。然而，当恶意实体试图操纵结构时，系统——和其他系统一样——面临风险。


    # 保持比特币安全的方法


    ![](img/rsrc.jpg)


    鉴于比特币价值不断增加和受欢迎程度日益提高，投资者最担心的问题之一是在哪里以及如何保持它们安全。比特币与实体硬币不同，不能存储在物理位置。作为数字货币，比特币通过`bitcoin
    addresses`进行存储和访问。这些地址需要`digital keys`或密码。为了完全保护你的比特币，你需要确保这些数字密钥始终受到保护。


    每个比特币地址有两个密钥，即`public key`和`private key`。对公众可见的`Bitcoin address`是由`public keys`派生出来的。这个地址类似于你与联系人共享的任何电子邮件地址。另一方面，`private
    key`的功能类似于你的电子邮件密码。你用它来访问`digital wallet`，以便为购买或交换发送比特币。为了保护`digital wallet`中的比特币，你必须始终保持`private
    keys`的安全。


    你也可以选择离线访问比特币，例如存储在另一个数据库中，以保护比特币免受网络威胁。你还可以利用`multisignature addresses`。这些地址允许多个方持有地址的一部分作为密钥。为了访问比特币，你必须获得地址其他用户的批准。在这些`multisignature
    addresses`中，可以选择需要多少用户签名。


    # 深入了解比特币挖掘


    ![](img/rsrc.jpg)


    作为数字货币，比特币不是打印的。与允许全球政府发行新货币的传统货币制度不同，比特币是被发现和挖掘的。在全球范围内，计算机通过竞争的方式挖掘比特币。


    '
