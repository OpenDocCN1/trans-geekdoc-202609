    # INITIAL COIN OFFERINGS


    ![](rsrcHV.jpg)


    Also known as Initial Coin Offering, `ICO` is a fund-raising venture meant to
    help cryptocurrency startups obtain capital. It is largely unregulated, which
    means that this process is typically done to evade the tough and heavily-regulated
    process of raising capital through banks and venture capitalists. An `ICO` works
    through the same principle of an `IPO` (Initial Price Offering), which you will
    have to look into prior to buying stocks.


    In an `ICO`, you purchase cryptocurrency instead. Usually, you purchase these
    cryptocurrencies from a startup, which makes the promise that you will own some
    its assets relative to the investment value you have made into the company. In
    an `ICO`, you will own assets in the form of digital coins. In an `IPO`, buying
    stock can provide you with voting rights or even equity. When you purchase coins
    in an `ICO`, you do not have any equity rights. The value of the coins is heavily
    influenced by the value of the digital currency company issuing them.


    In an `ICO` procedure, its developers will first declare its plans for the project
    or currency startup, and after which they will create a white paper to explain
    important details about the offering. They will also procure the support of advisors
    in the industry and decide on the tokens for offering. The `ICO` will then be
    advertised and held to interested entities.


    ## Getting the Most Out of ICOs


    Although many `ICOs` are legitimate, not all of them are worthy of your time or
    money. `ICOs` are unregulated, and this could open the process to scammers who
    do not intend to return any of your investment. Thus, it is important to exercise
    caution when planning to invest in an Initial Coin Offering.


    An important guideline is to see whether the published white paper has clearly
    established the details of the offering. The agenda should be crisp and clear.
    It is also important for the identities of the developers to be readily available
    and accessible. One red flag is for the developers to hide under aliases or not
    have their location and contact details visible to interested parties.


    Investing in `ICOs` comes with solid advantages such as being able to support
    worthwhile cryptocurrency projects. Also, `ICOs` do not require strict and rigorous
    paperwork, making it a relatively easy investment scheme compared to `POs`. Nonetheless,
    its unregulated environment can make it an attractive playground for scammers.
    There is also the worry that the investment is being made only through pure speculation.
    Network congestion could also result in failed transactions.


    Nonetheless, `ICOs` continue to open new opportunities for innovative projects
    and valuable cryptocurrency technologies. Also, it provides incentives to those
    who have the skill and the resources to foster pioneering solutions to new and
    expected problems in cryptocurrency transactions. The important step in any investment,
    whether in an `IPO` or `ICO`, is to be cautious and to study each investment scheme
    as much as possible. This helps to track down `ICO` scams and to channel funds
    into projects that provide real and long-term digital currency benefits.


