- raw: "IS BITCOIN SAFE? ![](rsrcHV.jpg)Clearly, Bitcoin is beyond mainstream. In\
    \ fact, it may be reasonable to expect that bitcoins will never be considered\
    \ mainstream for a long time. However, to ignore the value of bitcoins may be\
    \ a hasty route to take. As of January 2017, $14.9 billion worth of bitcoins have\
    \ already been circulating. Blockchain, the technology supporting bitcoin, has\
    \ steadily grown in popularity. The blockchain infrastructure may eventually challenge\
    \ certain processes of traditional trading, banking, and other types of financial\
    \ transactions. Still, the question remains: how safe are bitcoins? Bitcoin as\
    \ Risky Currency As cryptocurrency, bitcoins cannot be without some considerable\
    \ risk. In a report made by the Global Markets Research Department of Credit Suisse,\
    \ the value of cryptocurrency is three times more volatile than the value of oil\
    \ and eleven times more unstable than the exchange rate between the dollar and\
    \ the British pound. During transfers, bitcoin amounts are irreversible. Thus,\
    \ there should be no room for errors when typing amounts during purchases or transfers.\
    \ Also, the password that users employ to access their bitcoin accounts is private\
    \ and non-resettable. In cases where the user forgets the private key, or someone\
