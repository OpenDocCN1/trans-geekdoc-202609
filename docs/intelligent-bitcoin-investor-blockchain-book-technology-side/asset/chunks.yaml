    # Why are other businesses not accepting Bitcoin?


    Given Bitcoin’s rising popularity and legitimacy as evidenced by its partnerships
    with stable businesses, you may be asking why some businesses still do not accept
    bitcoin. To answer this, it is necessary to consider two crucial factors — volatility
    and lack of regulation. The value of `bitcoin` is still considered to be highly
    volatile so that businesses could suffer through massive losses overnight. A concrete
    illustration: Within a single day, from June 25 to June 36, `bitcoin` prices plummeted
    to more than $200. For businesses, this could mean depletion in deal values anywhere
    from 7% to 10% in just a few hours. In these instances, Bitcoin’s lack of governmental
    backing works more against it than for it. Regulating `bitcoin` is also a tricky
    path to tread. U.S. lawmakers have threatened to impose strict regulations on
    the currency especially since it is being used for marijuana-related transactions.


    ## ARE THERE BITCOIN ALTERNATIVES?


    ![](rsrcHV.jpg) `Bitcoin` is just one kind of cryptocurrency, which means that
    there are other cryptocurrencies that you can use for your investment. These are
    known as altcoins or alternative coins. The following are some bitcoin alternatives
    that you can look into.


    *   **Ethеr**: Owning up to 30 percent of market share, `Ether` is the second-largest
    participant in the cryptocurrency market, next to `Bitcoin`. Although `Ether`
    first started out as a network (then known as `Ethereum`) for betting and ride-sharing,
    it eventually evolved into a currency meant for daily transactions. However, `Ether`
    has not been on the market for as long Bitcoin has, which means that it could
    pose serious security threats due to its lack of sufficient testing.

    *   **Rіррlе XRP**: `Ripple XRP` was primarily used for banks to efficiently transfer
    funds between currencies. One of the biggest advantages of `Ripple XRP` over `Bitcoin`
    is that the former can process as many as a thousand transactions in a span of
    a mere second. By contrast, `Bitcoin` can manage only seven per second. Investing
    in `XRP` could also bring in benefits as regulators are supporting the use of
    `XRP` in banking transactions. One caveat, though, `Ripple` only owns 60 percent
    of its coins, which means they are significantly dependent on the actions of their
    shareholders.

    *   **PоtCоіn**: As a way to help facilitate transactions in the growing cannabis
    industry, `PotCoin` was generated. There are no middle banks required in a `Potcoin`
    transaction, as the coins are facilitated directly between buyer and seller. Available
    for use globally, `PotCoin` increased its value recently when it sponsored a North
    Korea trip for Dennis Rodman in June 2017.

    *   **Lіtесоіn**: `Litecoin` employs almost the same programming structure with
    `Bitcoin`, although the former is designed for more widespread use. `Bitcoin`
    miners require specifically designed computers, whereas `Litecoin` miners only
    need home PCs. In May 2017, `Coinbase` added `Litecoin` to its trading platform,
    increasing its value in the market and attracting more users and investors.

    *   **Zсаѕh**: One of the competitive advantages of `Zcash` over `Bitcoin` is
    that it claims to employ a more intricate blockchain technology to ensure better
    user privacy and encryption of transactions. With `Zcash`, two parties can participate
    in an exchange without knowing the identities of those involved in the transaction.
    Despite the promise that `Zcash` has manifested, it is still a new player in the
    cryptocurrency market. Some security concerns have cropped up as a result. If
    these setbacks are managed well, `Zcash` could easily become a good investment
    catch.

    *   **Dаѕh**: `Dash`, which used to be known as `Darkcoin`, has already partnered
    with a gift card company and a payments gateway website. In addition, it has started
    working with a digital currency exchanged based in Venezuela. A huge component
    of `Dash`’s potential staying power in the market is its peer-to-peer network,
    which it claims to foster improved capacity and better security.

    *   **Siacoin**: `Siacoin` is no small player in the cryptocurrency market, as
    it was born out of MIT in 2013. It is the virtual currency used in renting cloud
    storage and in data transmitting and encrypting on the `Sia` cloud platform. Transactions
    are done via `Siacoin`, including mining and trading, employ what is known as
    smart contracts. This altcoin is considered to be a sleeping giant due to its
    huge potential as an emerging major player in the market. However, `Siacoin` is
    still in its early stages. Like any alternative currency, it could decline in
    value overnight due to volatility and other factors.


    ## TRADING AND INVESTING IN ALTCOINS: A CLOSER LOOK


    ![](rsrcHV.jpg) Altcoins come from two words – ‘alt’ and ‘coins.’ These words
    roughly translate to alternative coins or alternative currencies. After the launch
    and the success of `Bitcoin`, other cryptocurrencies have begun to enter the market.
    Many of these cryptocurrencies highlight their advantages over the more established
    `Bitcoin`, especially when it comes to security and flexibility. Other features
    that altcoins tend to improve on are privacy or confidentiality, DNS resolution,
    transaction speeds, and many others. Although these altcoins attempt to present
    themselves as more distinct and more beneficial than bitcoins, the reality is
    that many of them are still patterned heavily on the framework of bitcoins.


    ### The Trading and Investing Benefits of Altcoins


    There is no denying the potential of altcoins in the cryptocurrency market. Some
    altcoins, such as `Ether`, are performing exceptionally well in the market. [Some
    of the factors](http://bitcoinist.com/crypto-wars-bitcoin-vs-altcoins/) that could
    be attributed to this are the availability of cheaper transactions and the accessibility
    of blockchains that could accommodate high-volume transactions. One of the comments
    regarding `Bitcoin` is that the high fees do not necessarily correspond to its
    less-than-ideal speeds. Furthermore, altcoins are viewed to be more flexible when
    it comes to managing risks as some of them could provide more diverse trading
    and investing alternatives.


    ### Some Altcoin Drawbacks


    Not all altcoins are ripe for investing, however. Many altcoins in the market
    may appear to be distinct, offering a host of interesting benefits. However, some
    of them are simply weak spinoffs of `Bitcoin` or other better-established cryptocurrencies.
    Thus, it is important to look first before you leap, as far as investing in altcoins
    go. It is also crucial to see whether the benefits marketed by these altcoins
    are ‘actual’ benefits or empty promises. For instance, an altcoin that boasts
    of a high number of coins could mean that each coin has a lesser value compared
    to other digital currencies.


    ### The Bitcoin Advantage over Altcoins


    As already mentioned, many alternative currencies appear to be promising and have
    fared exceptionally well in the market. However, not all of them can outperform
    the market presence and performance longevity shown by `Bitcoin`. Some of these
    altcoins have exchange rates that are several times more volatile than bitcoins,
    making them a high-risk investment. `Bitcoin`’s strongest benefits over altcoins
    are on security and testing. For the past eight years, `Bitcoin` has undergone
    and continues to undergo strict and consistent testing throughout all these years
    in operation. The accessibility of `Bitcoin` is also one of its clear benefits.
    The fact that major companies such as `Microsoft` and `Paypal` have partnered
    with it is already proof of its legitimacy and staying power. Thus, although altcoins
    may be ideal for smaller investments and transactions, any large-scale cryptocurrency
    investing will stand to benefit better from `Bitcoin`.

