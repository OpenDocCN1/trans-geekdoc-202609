    # 首次代币发行


    ![](img/rsrcHV.jpg)


    首次货币发行（Initial Coin Offering），也称为 `ICO`，是一种旨在帮助加密货币初创公司获得资金的融资投机。它在很大程度上不受监管，这意味着这一过程通常是为了规避通过银行和风险投资人筹资的严格且高度监管的程序。`ICO`
    的工作原理与 `IPO`（首次公开募股）相同，在购买股票之前，你必须对其进行研究。


    在 `ICO` 中，你购买的是加密货币。通常，你从初创公司购买这些加密货币，公司承诺根据你对公司的投资价值，让你拥有其部分资产。在 `ICO` 中，你拥有的是数字硬币形式的资产。而在
    `IPO` 中，购买股票可以为你提供投票权甚至股权。当你在 `ICO` 中购买代币时，你并不拥有任何股权。代币的价值受发行它们的数字货币公司价值的影响很大。


    在 `ICO` 程序中，开发者首先会宣布对项目或货币初创公司的计划，随后他们将创建一份白皮书来解释发售的重要细节。他们还将寻求行业顾问的支持，并决定发售的代币。然后，`ICO`
    将向感兴趣的实体进行广告并举行。


    ## 如何充分利用 ICO


    尽管许多 `ICOs` 是合法的，但并非所有的都值得你投入时间和金钱。`ICOs` 是不受监管的，这可能让那些无打算回报你任何投资的骗子有机可乘。因此，在计划投资首次代币发行时，保持谨慎非常重要。


    一个重要的准则是看已发布的白皮书是否已明确了发售细节。议程应该简洁明了。此外，开发者的身份易于获取和访问也同样重要。一个红旗是开发者隐藏在化名下，或者不让相关方看到他们的位置和联系方式。


    投资 `ICOs` 具有实实在的优势，例如能够支持有的加密货币项目。此外，`ICOs` 不需要严格严谨的文件工作，与 `POs` 相比，这是一种相对容易的投资方案。然而，其不受监管的环境可能使其成为骗子的迷人的乐场。人们还担心投资完全是通过纯投机行为进行的。网络拥堵也可能导致交易失败。


    尽管如此，`ICOs` 继续为创新项目和有价值的加密货币技术开启新的机会。此外，它为那些有技能和资源对加密货币交易中新及预期问题培养开创性解决方案的人提供了激励。无论投资
    `IPO` 还是 `ICO`，任何投资中都很重要的一步都是保持谨慎，并尽可能地研究每种投资方案。这有助于追踪 `ICO` 骗局，并将资金引导至能提供真实且长期数字货币收益的项目。


    # 如何通过加密货币交易退休


    ![](img/rsrcHY.jpg)


    你知道吗？90% 的开业企业在头几年内都会**失败**？好吧，星巴克的加盟店在开业后的成功率为 90%。我已经告诉过你们，我们的交易系统能给你提供 90%
    的成功率……我们能获得 90% 的原因与星巴克获得 90% 而大多数其他企业完全失败的原因是相同的。


    1. 一个经证明的**系统**

    2. 支持与培训


    这不仅仅是星巴克。事实上，根据《创业者》杂志，“加盟店的成功率为 90%，这是任何业务中失败率最低的”。我们也是如此。我们已经做了工作，将我们的系统打包并交给你，连同支持和问责机制……让你有很高的成功。你最好相信，星巴克创建自己的加密货币并非偶然——他们有数百名全职分析师研究市场和新的业务机会……当像星巴克、微软和
    Facebook 这样的大公司都在全力投入加密货币时，是时候关注并行动了。


    我们之所以对我们的交易系统非常适合你充满信心，是因为我们的运营方式就像星巴克一样：一个经过证明的可重复系统 + 支持。唯一让 (testimonial name)
    能够取得如此快速进展的因素，是因为她投资了一个带有导师指导的经过证明的系统。让我们聊聊为什么在学习交易时你需要支持。


    1. `Accountability`（很容易失去专注和动力。有人看护你并让你保持在正轨上是无价的）

    2. `Expert advice`（由一个知道哪里有地雷的人牵着你的手，可以帮助你不被炸。导师已经去过你正尝试去的地方，可以确保你做出正确的选择和获胜的交易。导师不会替你做工作，但他们会确保你做了正确的工作）


    导师帮助你摆脱所谓的“分析瘫痪”。很容易感到困惑和不知所措。你需要身边有那个人——这太重要了。你需要一个极其清晰的策略和执行到底的问责……否则你只会从一个机会跳到另一个机会，从未给自己一个公平的机会去把某事推向完成。加密货币是真实的，收益真实的，你**可以**做到这一点……但单独战斗可能代价高昂，并且比需要的时间长得多。我不知道你如何，但我宁愿现在就拥有……重要的是你要知道，你不需要找一个亿万富翁当你的导师，事实上，如果导师太成功了，他们将无法再与初学者产生共鸣了。


    很多人有很多愚蠢的想法，但我相信寻找导师时要寻找 3 点。如果某人具备这 3 点，你已经排除了 99% 声称是合格导师的人：

    1. 找到一个获得你想要的结果的人

    2. 确保他们的客户获得你想要的结果

    3. 确保他们有一套供你执行的方法


    有些人为自己获得了很好的结果，但对他们的学生却没有。有些人有时能获得结果，是因为他们缺乏让他们执行的方法。每当我投资导师指导，都会回报。价格一直是一个挑战，但它本该应该是挑战，这正是让我坚持下去并使其生效的原因。正如那些快速导师会告诉你的——成功需要巨大的行动！如果你在这门课程中什么都不做，就这样做：找一个优秀的导师并听从他的话。（注：原文包含重复句）。


    我知道我的交易方法有效，我知道它们对执行的人有效，但你我都知道，大多数人太懒，不愿做一点工作……我不希望这种情况出现在我的生活中，原因有两个：#1 与不想工作的人共处很痛苦。你遇到过那种让你抓狂、想勒死掉的同事吗？我们都有过，这里也一样——我需要优秀的人。第二个原因是，如果你不听从我的指令（尽管它们简单易于执行），那么我不能要你的学生。如果我招收不听从指令的学生，他们赚不到钱。当他们不赚钱时，我的声誉会受损。教人们如何交易加密货币对我来说只是一个收入来源（因为为什么我不直接花更多时间加倍我的加密货币交易呢？）这是因为世界上最富的人总是说你应该有多个收入来源。我交易加密货币赚了不错的钱，所以我想，为什么不教其他人也交易呢。这对大家来说都是双赢。


    '
