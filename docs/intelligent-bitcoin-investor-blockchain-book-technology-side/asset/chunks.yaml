- raw: "THE QUESTION OF LEGITIMACY: IS BITCOIN LEGAL? ![](rsrcHV.jpg)The questions\
    \ on legality that surround Bitcoin are not surprising. Crucial to these questions\
    \ is the fact that bitcoins are not subject to regulations. To those who are used\
    \ to transacting only through fiat currency, bitcoin’s unregulated operations\
    \ can be questionable. Nonetheless, Bitcoin is far from being a counterfeit or\
    \ illegal digital currency. First of all, it is not fake money. Businesses have\
    \ been accepting bitcoins as payments just like they would accept any other existing\
    \ currency. Secondly, the lack of regulations governing bitcoins does not necessarily\
    \ point to its illegitimacy. Since bitcoins provide an entirely new way of making\
    \ payments, no concrete rules have been made as of yet in order to regulate its\
    \ use in a wider market. Finally, bitcoins do not violate any laws; hence it is\
    \ a mistake to refer to it as an illegal means of transacting financially. In\
    \ fact, the IRS considers Bitcoin as properties similar to stocks and bonds. Thus,\
    \ federal law mandates that the sale and purchase of bitcoins must be treated\
    \ as the transactions of any other stock property. In 2013, the Financial Crimes\
    \ Enforcement Network of the U.S Treasury Department did not consider the purchase\
    \ of well-natured products and services through bitcoin as an illegal activity.\
    \ Mining bitcoins, however, may be subject to specific laws that regulate its\
    \ operations and use. Bitcoin miners typically fall into the category of money\
    \ transmitters. This means that miners must follow certain laws. Up to the present\
    \ time, however, none of those laws have been employed as means to subvert the\
    \ use of bitcoins. Anonymity as a Feature of Criminal Activities One of the events\
    \ that led to speculations on bitcoins’ illegitimacy is Silk Road’s duplicitous\
    \ activity. Silk Road used to be a digital marketplace for illegal goods, where\
    \ bitcoins were considered as the only acceptable payment. The primary reason\
    \ for using bitcoins is its anonymity since buyer identities will remain undisclosed\
    \ during and after the sale. This makes it difficult for authorities to track\
    \ down the persons involved in such illicit transactions. Thus, authorities in\
    \ the United States and other countries are concerned with the possibility that\
    \ bitcoins will be used to facilitate more illegal transactions, such as money\
    \ laundering and the exchange of illegal goods. In 2012, the FBI published a document\
    \ that tackled the issues surrounding bitcoins and its distinction against other\
    \ digital currencies, such as eGold and WebMoney. One major cause of concern raised\
    \ by the FBI was the possible lack of regulations in offshore services and overseas\
    \ exchanges. Tracking illicit activities beyond U.S. borders may be more taxing,\
    \ if not near impossible. While the FBI has already successfully shut down Silk\
    \ Road in October 2013, especially after US Senator Charles Schumer’s called bitcoin\
    \ a “surrogate currency,” the connection between this notorious site and bitcoin\
    \ as its sole payment mode has nevertheless lingered. This has engendered an erroneous\
    \ label on bitcoin as a dubious digital currency. In another case, the US Drug\
    \ Enforcement Administration seized bitcoins from a US resident in June 2013 after\
    \ finding out that the individual has used them in acquiring a controlled substance.\
    \ While its features of anonymity may render bitcoin as an attractive type of\
    \ virtual currency for illicit transactions, this does not qualify bitcoin as\
    \ an illegal currency. Countless illicit transactions all over the globe are being\
    \ made through cash, gold, and bitcoin payments. Nonetheless, the lack of proper\
    \ regulations regarding the use of bitcoins makes it a complex currency to use,\
    \ especially during exchanges and mining activities. Digital Currency Laws across\
    \ Countries The use of bitcoins is viewed differently across countries all over\
    \ the world. In Iceland, for example, bitcoin is automatically classified as illegal.\
    \ Many countries have released statements classifying digital currencies, including\
    \ bitcoin, as non-regulated currencies. However, bitcoin is generally considered\
    \ a legitimate currency for legal transactions. As long as bitcoin is not used\
    \ for illegal means or the exchange of illicit goods and services, it does not\
    \ translate to any law violation. If you are using bitcoins or planning to invest\
    \ in bitcoins, it is important to consider your location. You need to understand\
    \ which regulations govern bitcoins in your country. The laws regarding digital\
    \ currencies, including bitcoins, continue to shift and change. Bitcoins will\
    \ continue to grow in popularity and use. Given these factors, it is understandable\
    \ how bitcoins will continue to generate questions in the months or years to come.\
    \ \n\nBITCOIN REGULATING AGENCIES ![](rsrcHV.jpg)Different countries regulate\
    \ bitcoins through various agencies. In the US, various national and state agencies\
    \ serve as bitcoin regulators. The following are agencies which have already initiated\
    \ regulations or have expressed intentions to draft regulations in the future:\
    \ \n\n*   FinCEN \n\nFinCEN or the Financial Crimes Enforcement Network, an agency\
    \ within the US Treasury Department has published guidelines on virtual currencies\
    \ and their use. Published on March 18, 2013, these guidelines aim to define the\
    \ circumstances which will categorize virtual currency users as money transmitting\
    \ businesses (MTBs) or money services businesses. MTBs must strictly follow the\
    \ mandate on Anti-Money Laundering (AML), which prohibits financial laundering\
    \ practices and Know Your Client (KYC) measures, which requires businesses to\
    \ identify the individuals or other businesses they are transacting with. \n\n\
    *   CFTC \n\nCFTC or the Commodity Futures Trading Commission takes care of financial\
    \ derivatives in the U.S. Although they have not made any regulations as of present\
    \ time, it has already announced that it would do so when necessary. \n\n*   SEC\
    \ \n\nThe SEC or the Securities and Exchange Commission has not issued any concrete\
    \ regulation on virtual currencies. However, it has published pertinent investor\
    \ alerts through its Office of Investor Education and Advocacy. These alerts have\
    \ specifically focused on dishonest investment schemes, such as Ponzi schemes\
    \ and other schemes that use bitcoin payments. These alerts were made after the\
    \ case of Trendon T. Shavers (also known as ‘pirateat40’), a Texas resident who\
    \ was criminally charged after founding and operating the Bitcoin Savings and\
    \ Trust. This fraudulent company aimed to raise 70,000 bitcoins by promising up\
    \ to 7% in weekly interest to investors. According to the SEC, virtual currencies\
    \ are considered as securities and should abide by guidelines governing securities.\
    \ \n\n*   THE LEGISLATIVE BRANCH \n\nIt was in August 2013 that the US Senate\
    \ sent a letter of inquiry regarding the risks of virtual currencies to law enforcement\
    \ agencies across the country. One of these agencies was the Department of Homeland\
    \ Security. The letter included a request for policies and guidelines pertaining\
    \ to the treatment of virtual currencies. One major concern was the lack of paper\
    \ trail that could be used by regulating agencies to examine digital currency\
    \ transactions. By November 2013, the agencies have sent in their reply to the\
    \ Senate. The Department of Homeland Security expressed concerns about the possibility\
    \ of criminal activities instigated by the anonymity inherent in bitcoin use.\
    \ Nonetheless, the Department of Justice and the Federal Reserve have acknowledged\
    \ the legitimate use and value of virtual currencies. Due to the case instigated\
    \ by SEC, the legislative branch of the U.S. government has determined Bitcoin’s\
    \ legal classification. In the Shaver case of Texas, the accused attempted to\
    \ declassify bitcoin as money. Judge Amos Mazzant, however, responded to Shaver’s\
    \ claims by issuing a memorandum classifying Bitcoin as legitimate money or currency.\
    \ \n\n*   U.S. STATES "
