- raw: "Bitcoin follows specific regulations and guidelines that tend to vary from\
    \ one state to another. In California and New York, efforts have been made to\
    \ relentlessly pursue Bitcoin-related organizations. In New Mexico, South Carolina,\
    \ and Montana, however, there are no specific regulations that govern MTBs or\
    \ money transmitting businesses. A brief history of state government approaches\
    \ on bitcoin use began in May 2013 through a letter from the state financial regulator\
    \ of California to the non-profit Bitcoin promotional entity, Bitcoin Foundation.\
    \ The letter warned the organization that it may be operating as a non-licensed\
    \ money transmission business and could face possible fines and imprisonment.\
    \ In August 2013, the Department of Financial Services in New York did the same,\
    \ although the letters were addressed to 22 bitcoin companies by means of subpoenas.\
    \ The communication, however, was more conciliatory than accusatory in nature,\
    \ as it simply contained a request to develop the necessary regulatory guidelines\
    \ for digital currencies. This resulted in a more positive approach to the virtual\
    \ currency industry. Specifically, this led to the consent for digital currency\
    \ exchanges starting 2014, after the announcement of state Superintendent of Financial\
    \ Services Mr. Benjamin M. Lasky in New York. In June 2015, the New York State\
    \ Department of Financial Services put up BitLicense, the first virtual licensing\
    \ agency to address concerns on bitcoin and other digital currencies in the United\
    \ States. The regulations found in BitLicense are different to the financial regulations\
    \ on technology put up by other states such as Texas and Vermont, and the prior\
    \ legislation amendments done by California. \n\n*   PRIVATE SECTOR COMPANIES\
    \ (BANKS) \n\nSome banks have suspended the accounts of depositors who were found\
    \ to have operated at bitcoin exchanges. In some of these cases, the reason for\
    \ closing the accounts was the failure of the owners to open a money transmitting\
    \ account instead. Nonetheless, the US Senate has already answered these questions\
    \ on banking and federal regulations regarding bitcoin exchanges. While there\
    \ is no certainty for legislation as a result of these Senate hearings, agencies\
    \ have released positive feedbacks from these hearings, specifically on the legitimacy\
    \ of bitcoin as a digital currency. \n\nWHAT THIS MAY MEAN TO YOU ![](rsrcHV.jpg)In\
    \ a nutshell, the legality of bitcoins depends on where you are located, who you\
    \ are, and what you are doing with the coins. As a bitcoin stakeholder, you may\
    \ fall into one or more than one categories. You must understand that each category\
    \ comes with its own legal considerations. \n\n*   Users . Users refer to individuals\
    \ who use bitcoins whether for spending or hoarding. Per FinCEN rules, it is legal\
    \ to use bitcoins as long as you simply do it for the purchase of goods and services.\
    \ As a user, you will not be regulated under the category of a money transmitter.\
    \ \n\n*   Miners . If you obtain bitcoins through mining, you may be considered\
    \ as a money transmitter and, therefore, subject to money transmitting rules.\
    \ A money transmitter, according to FinCEN, is an individual that reproduces units\
    \ of virtual money and sells those units to another entity for traditional currency.\
    \ If you are a miner, you will be declassified from simple bitcoin user to money\
    \ transmitter. As a result, you will have to abide by rules on money transmitting\
    \ businesses. Nonetheless, bitcoin miners continue to request for clarificatory\
    \ information from FinCEN regarding their status. As of present time, this issue\
    \ has not yet reached any court process. \n\n*   Exchangers . FinCEN defines exchangers\
    \ or those that exchange their currencies for bitcoins, as money transmitting\
    \ businesses. The agency furthermore defines an exchanger and money transmitter\
    \ as someone who accepts bitcoins from one entity and transmits this virtual currency\
    \ to another for the same purpose as transmitting any currency or funding. "
