    Its not just starbucks. In fact, according to Entrepreneur Magazine, “success
    rates for franchises are 90%, making this the lowest failure rate of any business”
    We are much the same. We’ve done the work to package up our systems and hand them
    to you, along with the support and accountability…. Allowing you to have a high
    chance of success. And you better believe the fact that Starbucks created its
    own cryptocurrency is no accident - they have hundreds of full-time analysts researching
    the marketplace and new business opportunities… When big companies like Starbucks,
    Microsoft, and Facebook are going all in on crypto, its time to pay attention
    and get moving.


    The reason we are so confident our trading system is perfect for you is because
    we operate just like Starbucks: A proven repeatable system + Support. The only
    thing that enabled (testimonial name) to have such quick progress, was that she
    invested in a proven system with mentoring. Let’s talk about why you need support
    when learning to trade.


    1. `Accountability` (It’s easy to lose focus, and motivation. Having someone looking
    out for you to keep you on track is priceless)

    2. `Expert advice` (Having someone holding your hand who knows where the landmines
    are, can help you not get blown up. Mentors have already been where you are trying
    to go and can make sure you make the right choices and winning trades. Mentors
    do not do the work for you, but they make sure you do the right work)


    Mentors help you out of what’s called “paralysis analysis”. It’s easy to get confused
    and overwhelmed. You need that person on your side - it’s so important. You need
    a crystal clear strategy and the accountability to see it through… or else you’ll
    just jump from opportunity to opportunity, never giving yourself a fair shake
    at driving something to completion. Crypto currency is real, the wins are real,
    and you CAN do this… But doing it alone can be costly and take a lot longer than
    it needs to. I don’t know about you but I’d rather have it all now… And its important
    you know, you don’t need to find a billionaire to be your mentor, in fact, if
    the mentor is toooo successful, they won’t be able to relate to the beginner anymore.


    A lot of people have silly ideas, but I believe there are 3 things to look for
    when finding a mentor. If someone has these 3 things, you’ve just eliminated 99%
    of everyone claiming to be a qualified mentor:

    1. Find someone who’s getting the results you want

    2. Make sure their clients are getting the results you want

    3. Make sure they have a process for doing the same thing for you


    Some people get great results for themselves, but not their students. Some can
    get their students once in a while because they lack a process for them to follow.
    Every Time I’ve invested in mentoring, it’s paid off in SPEED of results. The
    price was always a stretch, but it’s supposed to be a stretch, that’s what made
    me follow through and actually make it work. Because despite what the get quick
    gurus will tell you - success requires massive action! If you do nothing else
    in this class, do this: Find a great mentor and do whatever he says. (Note: The
    source text contains repetitive phrases here).


    I know my trading methods work and I know they work for the people who work them,
    but you and I both know, most people are way too lazy to do a little work... and
    I can’t have that in my life for two reasons: #1 its a pain in the ass to work
    with someone you don’t want to. Have you ever had a co-worker who drove you nuts
    and just wanted to strangle? We all have, and it’s no different here - I need
    good people around me. The second reason is if you aren’t going to follow my directions
    (even though they are simple and easy to follow) then I can’t have you as a student.
    If I bring on students who don’t follow my direction, they won’t make money. When
    they don’t make money, my reputation suffers and can ruin the teaching part of
    my business. Me teaching people how to trade crypto is just one income stream
    for me (because why wouldn’t I just spend more time doubling down on my crypto
    trading right?) it’s because the most wealthy people on the planet always say
    you should have multiple streams of income. I make good money trading crypto so
    I thought, why the heck don’t I teach other people to trade too. It’s a win win
    for everyone and easier than opening a coffee shop or something. But if my students
    don’t make money, I’m ruined. And my name means everything to me - I’m not going
    to throw it all away by enrolling someone who doesn’t want it bad enough. But
    if you are accepted as a student, you’ll be part of a family. A family who all
    have the same goals - to retire rich while.

