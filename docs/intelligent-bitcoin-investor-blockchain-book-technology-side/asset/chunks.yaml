    # 合法性问题：比特币合法吗？


    ![](img/rsrcHV.jpg)


    围绕比特币的合法性问题并不令人意外。这些问题的关键在于，比特币不受监管。对于那些习惯于仅通过法币货币进行交易的人来说，比特币不受监管的操作可能会引发质疑。尽管如此，比特币绝非伪造币或非法的数字货币。


    首先，它不是假钱。企业接受比特币作为支付方式就像接受任何其他现有货币一样。其次，对比特币缺乏监管规定并不一定意味着其不合法。由于比特币提供了一种全新的支付方式，目前尚未制定任何具体的规则来监管其在更广泛市场中的应用。最后，比特币没有违反任何法律；因此，将其称为为金融交易的非法手段是错误的。事实上，`IRS`
    将比特币视为类似于股票和债券的财产。因此，联邦法律规定，比特币的买卖必须被视为任何其他股票资产的交易。2013 年，美国财政部（`U.SS Treasury
    Department`）的`Financial Crimes Enforcement Network`并不认为通过比特币购买良好的产品和服务是非法活动。


    然而，挖掘比特币可能受到监管其运营和使用的特定法律。比特币矿工通常属于资金汇款范畴。这意味着矿工必须遵守某些法律。但到为止，这些法律中还没有被用作破坏比特币使用的手段。


    ## 作为犯罪活动特征的匿名性


    导致比特币非法产生猜测的事件之一是`Silk Road`（丝绸之路）的欺诈活动。`Silk Road`曾是一个非法商品的数字市场，比特币被认为是唯一的接受支付方式。使用比特币的首要原因是其匿名性，因为买家身份在销售期间和之后都将保持不公开。这使得当局难以追踪此类非法交易的涉及人员。因此，美国及其他国家的当局担心比特币可能被用于便利更多非法交易，例如洗钱和非法物品的交易。


    2012 年，`FBI`发布了一份文件，处理了围绕比特币的问题及其与其他数字货币（如`eGold`和`WebMoney`）的区别。`FBI`提出的一个主要担忧是，离岸服务和海外交易所可能缺乏监管。在`U.S.`边境之外追踪非法活动可能更加费力，如果不是近乎不可能的话。虽然`FBI`已在
    2013 年 10 月成功关停了`Silk Road`，特别是在美国参议员查尔斯·舒默（Charles Schumer）称比特币为“替代货币”之后，但这个臭名昭著的网站与作为唯一支付模式之间的联系依然存在。这给比特币贴上了“可疑数字货币”的错误标签。


    在另一个案件中，美国毒品管理局（`US Drug Enforcement Administration`）在 2013 年 6 月从一名美国居民处没收了比特币，原因是发现其曾使用比特币获取受控物质。虽然其匿名特征可能使比特币成为非法交易中一种吸引人的虚拟货币，但这并不使比特币成为非法货币。全球范围内无数非法交易正通过现金、黄金和比特币支付进行。然而，对比特币的使用缺乏适当的监管使其成为一种复杂的货币，特别是在交易和挖矿活动期间。


    ## 各国数字货币法


    世界各国对比特币的使用看法不同。例如，在冰岛，比特币被自动归类为非法。许多国家已发布声明，将包括比特币在内的数字货币归类为不受监管。然而，比特币通常被认为是合法货币。比特币将继续增长。考虑到这些因素，了解哪些规定监管着比特币至关重要。


    ## 比特监管机构


    ![](img/rsrc.jpg)


    不同国家通过各种机构监管比特币。在美国，各种国家和州机构的职责如下：


    ### FinEN

    `FinEN`或`Financial Crimes Enforcement Network`（金融犯罪执法网络）是财政部内部的一个机构，已发布了关于虚拟货币的指南。这些指南于
    2013 年 3 月 18 日发布，旨在将虚拟货币用户定义为资金汇款业务（`MTBs`）。`MTBs`必须严格遵守反洗钱（`AML`）和了解客户（`KYC`）措施的要求，这要求企业识别与其交易的个人或其他企业。


    ### CFTC

    `CFTC`或`Commodity Futures Commission`（商品期货委员会）负责美国的金融衍生品。尽管他们目前尚未制定任何规定，但已宣布将在必要时制定。


    ### SEC

    `SEC`或`Securities and Exchange Commission`（证券交易委员会）尚未对虚拟货币发布任何具体规定。然而，它通过其`Office
    of Investor Education and Advocacy`（投资者办公室）发布了相关的投资者警报。这些警报特别关注不诚实的投资计划，例如庞氏骗和其他使用比特币的计划。这些警报是在`Trendon
    T. Shavers`（也称为`pirate40`）案件后发布的，这位德克萨斯州居民在创立并运营`Bitcoin Savings and Trust`后被提刑事指控。这家欺诈公司通过向投资者承诺高达
    7%的周息来募集 70,000 个比特币。根据`SEC`的，虚拟货币被视为证券，应遵守证券指南。


    ## 立法分支


    2013 年 8 月，美国参议院向全国执法机构发送了一封关于虚拟货币风险的查询信。其中一个机构是国土安全部。信中包含了对虚拟货币处理的政策和指南的要求。2013
    年 11 月，这些机构已向参议院提交了回复。国土安全部对使用比特币固有的匿名性可能引发犯罪活动表示担忧。然而，司法部和联邦储备银行已承认虚拟货币的合法用途和价值。由于`SEC`发起的案件，美国政府立法分支已确定了比特币的法律分类。在德克萨斯州的
    Shaver 案中，被告试图取消比特币作为货币的分类。然而，阿莫斯·马赞特（Amos Mazzant）法官通过发布备忘录，对 Shaver 的主张做出了回应，将比特币归类为合法货币或货币。


    ## 美国各州


    '
