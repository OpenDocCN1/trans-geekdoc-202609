    # 引言


    ![](img/rsrcHV.jpg)


    “副业”加密货币正让人们辞职、环游世界、偿还所有债务，并为他们奢华舒适的退休生活奠定基础。我将向你展示我们所使用的三步系统，它让我们在加密货币领域每月稳定获得五位数的收入……成功率高达
    90%，每天只需工作不到 30 分钟。如果这听起来有些遥不可及，相信我，我明白。我曾也有这种感觉。但在看到自己的成功以及我的朋友和学生的成功后，我知道这是真实的，而且你也可以做到。


    在本书中，我们将分享一些我帮助过的通过加密货币赚到真钱的惊人且真实的成功故事。事实上，我将向你展示真实人的真实故事，以及你在 2020 年仍然可能拥有的令人难以置信的机会。这些机会**不会永远持续**。


    随着加密货币市场的成熟，如果你没有尽早开始，赚钱将会变得困难得多。这是一个让你改变自己一生的独特机会。今天，我们将为你开启一个全新的机会大门……普通人正在利用我即将给你的建议，每天只需花几个小时就能通过加密货币提早辞职。我绝不是以任何方式或形式说你一定能这样做。


    这不是某种快速致富的广告。我不了解你个人，不知道你的动力有多大、兴趣有多浓，或者除了你显而易见想赚更多钱之外的关于你的任何信息。书中的故事是为了向你展示他人成就了什么，而不应被视为对你收入的保证，而说是在你拥有正确的职业道德、培训和耐心的情况下，你可能实现的可能性。


    我叫 `Iman Schafei`，是 `genius wealth secrets` 的首席执行官兼创始人。我很激动今天能与你分享我的所知。我的热情之一是发现新机会并进行投资。亲自测试它们，然后教教给我的朋友和学生。每天，我都看到人们在提供糟糕的建议，我不能坐视旁观。这让我几乎抓狂，因为这些人实际上在偷取人们的钱。只有少数几个老师可以让我们信任他们的可靠建议——我的工作就是成为其中之一。


    在本书中，我将向你展示 3 件事：

    1. 加密货币最大的机会——我们如何盈利地从中赚钱，而不需要整天盯着屏幕，不需要大量的启动资金，也不需要成为数学家或经济学家。

    2. 我们使用的三步交易系统，让我们在**容易**的市场中每月稳定获得五位数的收入……成功概率为 90%，每天工作不到 30 分钟。

    3. 如何现在就加入，无论你的经验水平、先前的培训、无论市场上涨还是下跌，无论你住在何处。


    我将向你展示通往新生活的**路径**。在接下来的一小时里，我将展示如何为自己提供一份每月五位数的新收入。没错，我说的是“每月”。这听起来对你可能有些不可置信，就像多年前我刚开始时对我的感觉一样，但这正是我们每天都在帮助数百名学生实现的。。


    我不确定你今天为什么会在这里，根据我的经验，通常有几个不同的原因：

    - 也许你已经在交易，并希望获得更好的回报。

    - 也许你需要更多的月收入，但又不想找第二份工作。

    - 也许你想全职交易，这样你再也不需要上班了。

    - 也许你决心要建立一个舒适安全的退休生活。


    如果其中任何一点适用于你，你就找对地方了。请仔细阅读每一句话……细节决定成败。你今天花时间与我一起训练——所以请帮帮自己，把手机调静音，如果需要就把孩子关进房间，关掉电视，尽一切努力给自己一份专注的礼物。你投入生活什么，就能收获什么——现在投入精力，全神贯注地听我展示道路……像我的学生一样，开启今天开始的新生活。


    这件事最酷的地方在于：我们只使用经过可靠验证的交易策略。我很高兴你现在在这里，因为在大众之前进入总是是明智的。我最不希望你错过了本可以改变你生活的事情。回想你亲眼目睹多少发明、投资和优质机会飞上太空，而你只能自责不已：“我知道那个会起飞的……但我什么都没做。”不要让这种事情再次发生。


    这是你的时代。如果现在赚取退休财富对你来说似乎是不可能的，相信我……我理解你的感受！但你现在不需要赚大钱。慢慢来……步步为营。首先取代你的工作收入——这对大多数人来说是一个很棒、合理的目标。想象一下**不需要**上班是什么感觉？相反，你每天只花一两小时做一些交易……在一天结束时，我真正谈论的是夺回你的自由。你今天在这里发现的，将引导你走向一条新的道路……一条让你获得自由的道路。


    我的目标是帮助你和另外 1 万人获得我所谓的“三项自由”：

    - **财务自由**（账单已付、债务已清、无需上班、无需等待即可购买想要的东西）

    - **时间自由**（随心决定何时工作）

    - **选择自由**（决定住在哪里）


    '
