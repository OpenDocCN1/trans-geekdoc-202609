    # 挖矿是如何进行的？


    当人们通过网络发送比特币时，这些交易会被记录在账本中。这样做是为了跟踪支付情况，包括发送者、接收者以及发生的交易类型。这些交易被汇编成一个列表，也称为“区块”。当交易发生时，矿工会验证并确认这些交易，并将它们记录在公共账本中。这个长长的区块列表被称为区块链。区块链用于识别、评估和确认比特币地址之间进行的任何交易。在完成单笔交易后，区块链会添加一个新列表。然而，该账本仅以数字形式存在。这引发了安全性和准确性的问题。为了确保区块链得到不断更新和验证，矿工会参与其中并使每次更新进入一个处理过程。根据从区块中获得的信息，矿工应用数学公式得出哈希值（hash）。哈希值由随机排序的字母和数字组成，并与区块一起编译。哈希值可以在特定时期区块链末尾找到。


    # 哈希值的其他特征是什么？


    哈希值是字母和数字的唯一组合，在保持区块链完整性方面起着作用。虽然可以使用区块的数据来生成哈希值，但仅通过观察哈希值，是不可能识别数据来自哪个区块的。每个哈希值都是唯一的，因此更改区块中的任何字符都会导致结果哈希值的改变。此外，矿工并非简单通过筛选区块链中的交易来生成哈希值。创建新哈希值还需要存储在区块链中的上一个区块的哈希值。这使得区块链更加安全，并且在发生篡改时更容易识别何时发生。虚假交易可能涉及修改存储的区块，这将导致区块哈希值的更改。一旦运行哈希函数，并发现哈希值与区块链中存储的不符，该交易将被归类为虚假。


    # 矿工是如何竞争代币的？


    矿工使用专门为挖掘区块设计的软件，彼此之间竞争以密封区块并创建一个正确的哈希值。一旦矿工做到这一点，他或她将获得 25 个比特币奖励。这为挖掘的持续进行以及区块链的不断更新和安全提供了坚实的激励。尽管如此，计算机可能会发现从可用区块数据生成哈希值太简单了。对于比特币网络来说，让这一过程变得更加复杂以防止在几秒钟内生成哈希值。为了建立一种协议，比特币需要工作量证明（proof
    of work）。哈希值必须以特定的方式出现，例如具有数量数量零。为了创建一个不同的哈希值，矿工必须使用随机数（nonce）。每当哈希值未能符合特定格式时，随机数就会被更改，哈希过程重新开始。找到一个能生成所需格式哈希值的随机数是非常重要的。一旦创建了正确的哈希值，矿工就能获得比特币。


    # 比特币的盈利能力和接受性


    在比特币网络中，你可以找到一组独特的玩家，他们不信任其他任何人，因此验证是首要任务。参与者被给予激励参与验证这也有帮助。比特币矿工是维护整个基础设施安全和稳固的人。作为回报，他们的工作通过新发行的比特币和比特币用户支付的网络费用获得报酬。尽管比特币网络每两周对挖掘难度进行一次更新，但比特币挖掘参与者的数量没有出放缓的迹象。


    # 比特币如何准备增长？


    最近的媒体报道将比特币和其他加密货币推向了风口中心，特别是它们在投资价值方面的市场表现。美元持续走软的事实也有助于比特币在货币市场中占据更大的份额。毕竟，美国消费者对涉及弱势货币的投资并不感兴趣。比特币的另一个特征是其投资机会上限仅为
    2100 万个。与美元无限的货币基础相比，比特币是一种有限资源。对于某些投资者来说，这可能指向比特币在一段时间内保留和增加财富的能力。


    # 接受比特币的品牌和企业


    目前，许多品牌和企业接受比特币作为商品和服务的支付。以下是其中的五个公司或企业：


    ### Overstock

    Overstock 是在 2014 年开始接受比特币支付的在线公司之一。在 2014 年 1 月，Overstock 与 `Coinbase`合作以促进交易。首席执行官
    Patrick Byrne 允许储备的比特币金额仅占 5%到 10%，这是一个虽小但充满前景的加密货币投资。


    '
