  ## 比特币是如何工作的？

  无论你拥有美元、欧元还是任何其他类型的货币，都可以将其兑换为 `bitcoin`。你需要数字钱包来妥善地存储 `bitcoins`，这些“钱包”可能位于你自己的
  `PC`、移动设备或通过第三方网站存储。一旦你拥有了 `bitcoins`，你就可以用任何货币购买任何物品，而无需经过银行和其他财经网站相关的冗长交易。


  ## 为什么要使用比特币？

  现在，你可能想问——如果我可以使用传统货币来购买商品和服务，我为什么要用 `bitcoins` 呢？答案很简单。无论你在世界上任何地方，使用它们都更简单、更便宜。由于
  `bitcoins` 不绑定于任何国家，因此没有严格的监管。这使得国际支付变得更加简单和快捷。即使是中小企业也能从比特币支付中获益，因为不涉及费用或其他支出。你还可以通过
  `bitcoin` 购买任何商品，同时保持你作为买家的匿名性。由于 `bitcoins` 广阔的未来，许多人已经在购买它们进行投资了。


  ## 如何获取比特币？

  有几种方法可以获取 `bitcoins`，这些包括购买或交换、转账和挖矿。


  *   **通过交易所购买**。如果你计划购买或出售 `bitcoins`，可以通过被称为比特币交易所的网站进行。在购买 `bitcoins` 时，你可以使用任何偏好的货币。

  *   **转账**。将 `bitcoins` 发送到另一方就像访问你的手机、个人电脑或在线平台一样简单。它的工作原理与数字货币转账相同。

  *   **挖矿**。你也可以通过挖矿获取 `bitcoins`，这本质上是通过投资计算机硬件并解决复杂的数学方程来竞争挖掘 `bitcoins`。挖矿是一种保护网络的方式，矿工会定期获得新验证交易的奖励。这些交易反过来记录在公开透明的账中。最近，云矿使得矿工能够在无需投资昂贵基础设施的情况下继续努力。通过云矿，矿工只需投资第三方网站，这些网站将负责基础设施和硬件需求。


  ## 如何存储和保存比特币？

  `Bitcoins` 存储在数字钱包中，可以下载到你的 `computer` 上、安全地存在你的移动设备中或保存在云端。数字钱包的工作原理与虚拟银行账户相同。通过这些钱包，你可以进行任何交易，例如发送或接收
  `bitcoins`、支付购买费用或仅仅保存你的 `bitcoins` 以供未来投资。与银行账户中的资金不同，存储在数字钱包中的 `bitcoins` 不受 `FDIC`
  或联邦储蓄保险公司的担保。


  ## 比特币钱包：哪种更好？


  *   **云端钱包**。将 `bitcoins` 存储在云端的最大优势之一是消除了电脑钱包的安装。有时，在 `PC` 上安装可能需要长时间的同步过程。然而，与安装在
  `PC` 相比，云端钱包更容易被破解和破坏。云端比特币钱包的好处是它们大多数都是非常安全的。

  *   **电脑中的钱包**。如果你是一个不想承担互联网相关风险的人，那么将 `bitcoins` 存储在 PC 安装的钱包中是一个不错的选择。尽管如此，币种损坏的风险仍然存在，特别是当你在没有将
  `bitcoins` 存储在另一个钱包之前就格式化 `computer`，或者 `PC` 被病毒攻击时。


  ## 关于比特币的匿名性和创新

  使用 `bitcoin` 的最大优势之一是交易期间不需要提供你的真实姓名。虽然比特币交易记录在公共日志中，但该日志只记录钱包 ID，而不是所有者的姓名。这确保了你通过
  `bitcoin` 进行的任何购买或销售都是保持隐私且不可追踪的。除了匿名性的优势外，`bitcoins` 还具有高度的创新性。事实上，它对金融交易的影响，堪比数字（或网络）出版对印刷出版的影响。






  # 合法性问题：比特币合法吗？


  ![](img/rsrcHV.jpg)


  围绕比特币的合法性问题并不令人意外。这些问题的关键在于，比特币不受监管。对于那些习惯于仅通过法币货币进行交易的人来说，比特币不受监管的操作可能会引发质疑。尽管如此，比特币绝非伪造币或非法的数字货币。


  首先，它不是假钱。企业接受比特币作为支付方式就像接受任何其他现有货币一样。其次，对比特币缺乏监管规定并不一定意味着其不合法。由于比特币提供了一种全新的支付方式，目前尚未制定任何具体的规则来监管其在更广泛市场中的应用。最后，比特币没有违反任何法律；因此，将其称为为金融交易的非法手段是错误的。事实上，`IRS`
  将比特币视为类似于股票和债券的财产。因此，联邦法律规定，比特币的买卖必须被视为任何其他股票资产的交易。2013 年，美国财政部（`U.SS Treasury Department`）的`Financial
  Crimes Enforcement Network`并不认为通过比特币购买良好的产品和服务是非法活动。


  然而，挖掘比特币可能受到监管其运营和使用的特定法律。比特币矿工通常属于资金汇款范畴。这意味着矿工必须遵守某些法律。但到为止，这些法律中还没有被用作破坏比特币使用的手段。


  ## 作为犯罪活动特征的匿名性


  导致比特币非法产生猜测的事件之一是`Silk Road`（丝绸之路）的欺诈活动。`Silk Road`曾是一个非法商品的数字市场，比特币被认为是唯一的接受支付方式。使用比特币的首要原因是其匿名性，因为买家身份在销售期间和之后都将保持不公开。这使得当局难以追踪此类非法交易的涉及人员。因此，美国及其他国家的当局担心比特币可能被用于便利更多非法交易，例如洗钱和非法物品的交易。


  2012 年，`FBI`发布了一份文件，处理了围绕比特币的问题及其与其他数字货币（如`eGold`和`WebMoney`）的区别。`FBI`提出的一个主要担忧是，离岸服务和海外交易所可能缺乏监管。在`U.S.`边境之外追踪非法活动可能更加费力，如果不是近乎不可能的话。虽然`FBI`已在
  2013 年 10 月成功关停了`Silk Road`，特别是在美国参议员查尔斯·舒默（Charles Schumer）称比特币为“替代货币”之后，但这个臭名昭著的网站与作为唯一支付模式之间的联系依然存在。这给比特币贴上了“可疑数字货币”的错误标签。


  在另一个案件中，美国毒品管理局（`US Drug Enforcement Administration`）在 2013 年 6 月从一名美国居民处没收了比特币，原因是发现其曾使用比特币获取受控物质。虽然其匿名特征可能使比特币成为非法交易中一种吸引人的虚拟货币，但这并不使比特币成为非法货币。全球范围内无数非法交易正通过现金、黄金和比特币支付进行。然而，对比特币的使用缺乏适当的监管使其成为一种复杂的货币，特别是在交易和挖矿活动期间。


  ## 各国数字货币法


  世界各国对比特币的使用看法不同。例如，在冰岛，比特币被自动归类为非法。许多国家已发布声明，将包括比特币在内的数字货币归类为不受监管。然而，比特币通常被认为是合法货币。比特币将继续增长。考虑到这些因素，了解哪些规定监管着比特币至关重要。


  ## 比特监管机构


  ![](img/rsrc.jpg)


  不同国家通过各种机构监管比特币。在美国，各种国家和州机构的职责如下：


  ### FinEN

  `FinEN`或`Financial Crimes Enforcement Network`（金融犯罪执法网络）是财政部内部的一个机构，已发布了关于虚拟货币的指南。这些指南于
  2013 年 3 月 18 日发布，旨在将虚拟货币用户定义为资金汇款业务（`MTBs`）。`MTBs`必须严格遵守反洗钱（`AML`）和了解客户（`KYC`）措施的要求，这要求企业识别与其交易的个人或其他企业。


  ### CFTC

  `CFTC`或`Commodity Futures Commission`（商品期货委员会）负责美国的金融衍生品。尽管他们目前尚未制定任何规定，但已宣布将在必要时制定。


  ### SEC

  `SEC`或`Securities and Exchange Commission`（证券交易委员会）尚未对虚拟货币发布任何具体规定。然而，它通过其`Office
  of Investor Education and Advocacy`（投资者办公室）发布了相关的投资者警报。这些警报特别关注不诚实的投资计划，例如庞氏骗和其他使用比特币的计划。这些警报是在`Trendon
  T. Shavers`（也称为`pirate40`）案件后发布的，这位德克萨斯州居民在创立并运营`Bitcoin Savings and Trust`后被提刑事指控。这家欺诈公司通过向投资者承诺高达
  7%的周息来募集 70,000 个比特币。根据`SEC`的，虚拟货币被视为证券，应遵守证券指南。


  ## 立法分支


  2013 年 8 月，美国参议院向全国执法机构发送了一封关于虚拟货币风险的查询信。其中一个机构是国土安全部。信中包含了对虚拟货币处理的政策和指南的要求。2013
  年 11 月，这些机构已向参议院提交了回复。国土安全部对使用比特币固有的匿名性可能引发犯罪活动表示担忧。然而，司法部和联邦储备银行已承认虚拟货币的合法用途和价值。由于`SEC`发起的案件，美国政府立法分支已确定了比特币的法律分类。在德克萨斯州的
  Shaver 案中，被告试图取消比特币作为货币的分类。然而，阿莫斯·马赞特（Amos Mazzant）法官通过发布备忘录，对 Shaver 的主张做出了回应，将比特币归类为合法货币或货币。


  ## 美国各州





  比特币遵循特定的法规和指南，而这些规定往往因州而有所不同。在加利福尼亚州和纽约州，相关部门一直在持续追踪与比特币相关的组织。然而，在新墨西哥州、南卡罗来纳州和蒙大拿州，并没有监管货币交易业务（MTBs）或货币传输业务的特定规定。


  州政府对待比特币使用方法的简要历史始于 2013 年 5 月，当时加利福尼亚州金融监管机构向非营利比特币推广实体 `Bitcoin Foundation` 发出了一封信。该信警告该机构，其行为可能作为未获得许可的货币传输业务运营，并可能面临罚款和监禁。2013
  年 8 月，纽约州金融服务部采取了同样的行动，尽管这些信是通过传票寄给 22 家比特币相关公司的。然而，这种沟通在性质上更多是调解而非指控，因为它仅仅是表达了为数字货币制定必要的监管指南的请求。


  这导致了对虚拟货币行业采取了更积极的态度。具体而言，在纽约州金融服务局长 Benjamin M. Lasky 先生宣布后，这导致了数字货币交易所从 2014 年开始获得许可。2015
  年 6 月，纽约州金融服务部推出了 `BitLicense`，这是美国首个解决比特币和其他数字货币担忧的虚拟许可机构。`BitLicense` 中的法规与德克萨斯州和佛蒙特州等州提出的科技金融法规以及加利福尼亚州之前的法律修订有所不同。


  ### 私营部门公司（银行）


  一些银行挂起了被发现在比特币交易所活动的存款人的账户。在这些案例中，关闭账户的原因是所有未能开设货币传输账户。尽管如此，美国参院已经回答了关于比特币交易所银行和联邦法规的问题。虽然由于这些参院听证会尚未确定立法，但相关机构已发布了听证会的积极反馈，特别是关于比特币作为数字货币的合法性。


  ### 这对你可能意味着什么


  简而言之，比特币的合法性取决于你所在地、你的身份以及你对硬币的操作。作为比特币利益相关者，你可能属于一个或多个类别。你必须理解，每个类别都有其自身的法律考量。


  *   **用户**：用户是指为了消费或囤积而比特币的个人。根据 `FinCEN` 规则，只要你仅仅是为了购买商品和服务而使用比特币就是合法的。作为用户，你不会根据货币传输者的类别受到监管。

  *   **矿工**：如果你通过挖矿获得比特币，你可能被视为货币传输者，因此受到货币传输规则的约束。根据 `FinCEN` 的定义，货币传输者是指产生虚拟货币并将这些单位以传统货币出售给实实个人。如果你是矿工，你的身份将从简单的比特币用户转变为货币传输者。因此，你必须遵守货币传输业务的规则。尽管如此，比特币矿工继续向
  `FinCEN` 请求有关其身份的澄清信息。目前，该问题尚未进入任何法院程序。

  *   **交易所**：`FinCEN` 将交易所或将自己的货币兑换为比特币的人定义为货币传输业务。该机构进一步定义称，交易所和货币传输者是指接受一个实体的比特币并将此类虚拟货币传输给另一个实体的人，其目的与传输任何货币或资金相同。





  # 比特币安全吗？


  ![](img/rsrcHV.jpg)


  显然，比特币已经超出了主流范围。事实上，预计比特币在很长一段时间内都不会被视为主流，这可能是合理的。然而，忽视比特币的价值可能是一个草率的决定。截至 2017
  年 1 月，价值 149 亿美元的比特币已经在流通。作为支持比特币的技术，区块链，的普及程度正在稳步增长。区块链基础设施最终可能会挑战传统交易、银行和其他类型交易的某些流程。尽管如此，问题仍然存在：比特币有多安全？


  ## 作为高风险货币的比特币


  作为加密货币，比特币不可能没有重大的风险。在瑞瑞银行全球市场研究部的一份报告中，加密货币的波动性是石油的三倍，不是美元兑英镑汇率的十一倍。


  在传输过程中，比特币金额是不可逆的。因此，在购买或传输期间输入金额时不允许任何错误。此外，用户访问比特币账户使用的密码是私有的且不可重置的。如果用户忘记了`private
  key` 或被他人破解，比特币将无法找回。


  ## 区块链的免疫结构


  尽管潜在的黑客攻击具有风险性，但支持比特币交易的区块链技术被认为对黑客攻击具有免疫力。该架构并不是记录个人账户，而是编译所有通过比特币进行的所有过去交易。


  在个人传输期间，所有运行`bitcoin software`的计算机将处理发送者的`public signature`。该签名将与区块链中编码的交易一起通过验证，以识别是否为账户的所有者发送了比特币。区块链中还有其他计算机进一步验证该过程。


  一旦交易完成，它就会收集到所有之前交易的记录中。然后，矿工开始竞争一个旨在验证区块链的数学难题。在矿工宣布宣布胜者之前，其他矿工必须首先验证所有交易的有效性。获胜的矿工将获得新造的比特币作为奖励。这是增加比特币货币供应并确保每次比特币交换或交易的准确性的良好方法。


  ## 攻击概率


  尽管如此，关于攻击概率的问题仍然围绕着比特币行业。黑客是否可能操纵区块链并将资金转到他自己的账户？答案是肯定的，但只有在黑客拥有卓越计算能力时才可能。这是因为目前的比特币交换交易只能通过查看所有历史交易来验证。这意味着计算机不仅必须解决当前的区块链，还要解决与其相关的所有区块。


  区块链如此复杂且错综，瑞瑞银行将其比作地质层，最近的区块是软土，而之前的区块是硬的沉积岩。区块链越深，它就越复杂。这使得区块链更难被破解和操纵。


  ### 51% 攻击


  当比特币矿工将比特币价值份额集中在自己之间时也会发生巨大的风险。如果单一实体获得整个网络超过`51 percent`的控制权，就存在风险新交易或删除之前交易的可能性。瑞瑞银行估计，即使是对网络的`30
  percent`控制，也会允许恶意矿工干预近期交易。因此，`51 percent control attack`可能会导致所有比特币价值的崩溃。


  这种规模的攻击不仅会影响恶意矿工自己，还会影响他们正在破解的资产。因此，任何恶意攻击者从一开始可能自己就是一名矿工，即一个对确保整个账本合法性和准确性所需的流程有深入了解的人。


  ### 加密货币网络盗窃


  毫无疑问，区块链技术的独特设计具有威慑攻击尝试的能力。然而，在线交易所和数字钱包可能会成为网络攻击的受害者。


  2016 年 8 月，`Bitfilnex`交易所的黑客攻破了 119,756 个比特币，总价值 8200 万美元。最大的网络攻击案例之一发生在 2014 年，通过`Mt.
  Gox`比特币交易所，黑客最终偷走了价值 5.9 亿美元的 850,000 个比特币。尽管进行了追回努力，但追回的硬币数量仅占总额的`24 percent`。在各种报告揭露了公司内部不道德经营行为后，日本检察官指控`Mt.
  Gox`执行官`Mark Karpeles`贪污罪。


  结论，区块链技术是一种用于数字货币交易和交换的高度安全的架构。然而，当恶意实体试图操纵结构时，系统——和其他系统一样——面临风险。


  # 保持比特币安全的方法


  ![](img/rsrc.jpg)


  鉴于比特币价值不断增加和受欢迎程度日益提高，投资者最担心的问题之一是在哪里以及如何保持它们安全。比特币与实体硬币不同，不能存储在物理位置。作为数字货币，比特币通过`bitcoin
  addresses`进行存储和访问。这些地址需要`digital keys`或密码。为了完全保护你的比特币，你需要确保这些数字密钥始终受到保护。


  每个比特币地址有两个密钥，即`public key`和`private key`。对公众可见的`Bitcoin address`是由`public keys`派生出来的。这个地址类似于你与联系人共享的任何电子邮件地址。另一方面，`private
  key`的功能类似于你的电子邮件密码。你用它来访问`digital wallet`，以便为购买或交换发送比特币。为了保护`digital wallet`中的比特币，你必须始终保持`private
  keys`的安全。


  你也可以选择离线访问比特币，例如存储在另一个数据库中，以保护比特币免受网络威胁。你还可以利用`multisignature addresses`。这些地址允许多个方持有地址的一部分作为密钥。为了访问比特币，你必须获得地址其他用户的批准。在这些`multisignature
  addresses`中，可以选择需要多少用户签名。


  # 深入了解比特币挖掘


  ![](img/rsrc.jpg)


  作为数字货币，比特币不是打印的。与允许全球政府发行新货币的传统货币制度不同，比特币是被发现和挖掘的。在全球范围内，计算机通过竞争的方式挖掘比特币。






  # 挖矿是如何进行的？


  当人们通过网络发送比特币时，这些交易会被记录在账本中。这样做是为了跟踪支付情况，包括发送者、接收者以及发生的交易类型。这些交易被汇编成一个列表，也称为“区块”。当交易发生时，矿工会验证并确认这些交易，并将它们记录在公共账本中。这个长长的区块列表被称为区块链。区块链用于识别、评估和确认比特币地址之间进行的任何交易。在完成单笔交易后，区块链会添加一个新列表。然而，该账本仅以数字形式存在。这引发了安全性和准确性的问题。为了确保区块链得到不断更新和验证，矿工会参与其中并使每次更新进入一个处理过程。根据从区块中获得的信息，矿工应用数学公式得出哈希值（hash）。哈希值由随机排序的字母和数字组成，并与区块一起编译。哈希值可以在特定时期区块链末尾找到。


  # 哈希值的其他特征是什么？


  哈希值是字母和数字的唯一组合，在保持区块链完整性方面起着作用。虽然可以使用区块的数据来生成哈希值，但仅通过观察哈希值，是不可能识别数据来自哪个区块的。每个哈希值都是唯一的，因此更改区块中的任何字符都会导致结果哈希值的改变。此外，矿工并非简单通过筛选区块链中的交易来生成哈希值。创建新哈希值还需要存储在区块链中的上一个区块的哈希值。这使得区块链更加安全，并且在发生篡改时更容易识别何时发生。虚假交易可能涉及修改存储的区块，这将导致区块哈希值的更改。一旦运行哈希函数，并发现哈希值与区块链中存储的不符，该交易将被归类为虚假。


  # 矿工是如何竞争代币的？


  矿工使用专门为挖掘区块设计的软件，彼此之间竞争以密封区块并创建一个正确的哈希值。一旦矿工做到这一点，他或她将获得 25 个比特币奖励。这为挖掘的持续进行以及区块链的不断更新和安全提供了坚实的激励。尽管如此，计算机可能会发现从可用区块数据生成哈希值太简单了。对于比特币网络来说，让这一过程变得更加复杂以防止在几秒钟内生成哈希值。为了建立一种协议，比特币需要工作量证明（proof
  of work）。哈希值必须以特定的方式出现，例如具有数量数量零。为了创建一个不同的哈希值，矿工必须使用随机数（nonce）。每当哈希值未能符合特定格式时，随机数就会被更改，哈希过程重新开始。找到一个能生成所需格式哈希值的随机数是非常重要的。一旦创建了正确的哈希值，矿工就能获得比特币。


  # 比特币的盈利能力和接受性


  在比特币网络中，你可以找到一组独特的玩家，他们不信任其他任何人，因此验证是首要任务。参与者被给予激励参与验证这也有帮助。比特币矿工是维护整个基础设施安全和稳固的人。作为回报，他们的工作通过新发行的比特币和比特币用户支付的网络费用获得报酬。尽管比特币网络每两周对挖掘难度进行一次更新，但比特币挖掘参与者的数量没有出放缓的迹象。


  # 比特币如何准备增长？


  最近的媒体报道将比特币和其他加密货币推向了风口中心，特别是它们在投资价值方面的市场表现。美元持续走软的事实也有助于比特币在货币市场中占据更大的份额。毕竟，美国消费者对涉及弱势货币的投资并不感兴趣。比特币的另一个特征是其投资机会上限仅为
  2100 万个。与美元无限的货币基础相比，比特币是一种有限资源。对于某些投资者来说，这可能指向比特币在一段时间内保留和增加财富的能力。


  # 接受比特币的品牌和企业


  目前，许多品牌和企业接受比特币作为商品和服务的支付。以下是其中的五个公司或企业：


  ### Overstock

  Overstock 是在 2014 年开始接受比特币支付的在线公司之一。在 2014 年 1 月，Overstock 与 `Coinbase`合作以促进交易。首席执行官
  Patrick Byrne 允许储备的比特币金额仅占 5%到 10%，这是一个虽小但充满前景的加密货币投资。






  # 为什么其他企业不接受比特币？


  鉴于比特币日益增长的普及以及通过与稳健企业的伙伴关系所证明的其合法性，你可能会问为什么有些企业仍然不接受比特币。要回答这个问题，必须考虑两个关键因素——波动性和缺乏监管。`bitcoin`
  的价值仍被认为具有高度波动性，因此企业可能会在夜之间遭受巨额。一个具体的例子是：在 6 月 25 日到 6 月 26 日的一天内，`bitcoin` 价格跌至
  200 美元以下。对于企业而言，这可能意味着在几小时内，交易价值就会缩水 7% 到 10%。在这些情况下，比特币缺乏政府支持的负面影响大于正面影响。监管 `bitcoin`
  也是一条棘棘的道路。美国立法者已威胁要对这种货币实施严格监管，特别是因为它正被用于与大大麻相关的交易。


  ## 有比特币的替代品吗？


  ![](img/rsrcHV.jpg) `Bitcoin` 只是加密货币的一种，这意味着你还有其他可以用于投资的加密货币。这些被称为山寨币（altcoins）或替代币。以下是一些你可以研究的比特币替代品。


  *   **Ethеr**：`Ether` 占据高达 30% 的市场份额，是加密货币市场的第二大参与者，仅次于 `Bitcoin`。尽管 `Ether` 最初是作为一个网络（当时被称为
  `Ethereum`）用于博彩和网约车平台，但它最终演变成一种用于日常交易的货币。然而，`Ether` 的上市时间还没有比特币那么长，这意味着由于缺乏足够的测试，它可能会带来严重的安全威胁。

  *   **Rірpplе XRP**：`Ripple XRP` 主要用于银行在不同货币之间高效传输资金。`Ripple XRP` 相比 `Bitcoin` 的最大优势之一是它可以在一秒内处理多达千笔交易。相比之下，`Bitcoin`
  每秒只能处理七笔。投资 `XRP` 也能带来收益，因为监管机构支持在银行交易中使用 `XRP`。但需要注意的是，`Ripple` 仅拥有其 60% 的硬币，这意味着他们严重依赖于股东的行为。

  *   **PоtCоіn**：`PotCoin` 的产生是为了帮助日益增长的大麻行业促进交易。在 `Potcoin` 交易中不需要中间银行，硬币直接在买方和卖方之间进行。`PotCoin`
  在全球可用，它在 2017 年 6 月为丹尼斯·罗德曼赞助了朝鲜之行后，价值有所增加。

  *   **Lіtеosіn**：`Litecoin` 与 `Bitcoin` 采用几乎相同的编程结构，尽管后者设计用于更广泛的使用。`Bitcoin` 矿工需要专门设计的计算机，而
  `Litecoin` 矿工只需要家用电脑。2017 年 5 月，`Coinbase` 将 `Litecoin` 添加到其交易平台，增加了它在市场上的价值，并吸引了更多用户和投资者。

  *   **Zсаѕh**：`Zcash` 相比 `Bitcoin` 的竞争优势之一是它声称采用了更复杂的区块链技术来确保更好的用户隐私和交易加密。通过 `Zcash`，双方可以参与交易而无需知道交易参与者的身份。尽管
  `Zcash` 展现了其潜力，但它仍然是加密货币市场中的新成员。因此出现了一些安全疑虑。如果这些挫折得到良好管理，`Zcash` 可能会成为一个极好的投资选择。

  *   **Dаѕh**：`Dash` 曾被称为 `Darkcoin` 已与一家礼品卡公司和一个支付网关网站合作。此外，它还开始与位于委内瑞拉的数字货币交易所合作。`Dash`
  在市场中潜力的一个巨大部分是它的点对点网络，它声称这能促进能力的提高和安全性。

  *   **Siacoin**：`Siacoin` 在加密货币市场中并非小角色，因为它诞生于 2013 年麻省理工学院（MIT）。它是 `Sia` 云平台用于租赁云存储以及数据传输和加密的虚拟货币。通过
  `Siacoin` 进行的交易包括挖矿和交易使用了所谓的智能合约。这种山寨币被认为是一个巨头，因为它作为市场上新兴的主要玩家具有巨大的潜力。然而，`Siacoin`
  仍处于早期阶段。与其他替代货币一样，由于波动和其他因素，它的价值可能会在夜之间下降。


  ## 交易和投资山寨币：深入观察


  ![](img/rsrcHV.jpg) 山寨币来自两个词——“alt”（替代）和“coins”（币）。这些词大致翻译为替代币或替代货币。在 `Bitcoin`
  发布并成功后，其他加密货币开始进入市场。这些加密货币许多强调了它们相对于更成熟的 `Bitcoin` 的优势，特别是在安全性和活性方面。山寨币倾向于改进的其他特征还有隐私或机密性、DNS
  解析、交易速度等。尽管这些山寨币试图将自己表现得比比特币更独特、更有利，但现实是，它们中的许多很大程度上仍然遵循比特币的框架。


  ### 山寨币的交易和投资收益


  不可否认山寨币在加密货币市场的潜力。某些山寨币（如 `Ether`）在市场上的表现异常。可以归于此的[一些因素](http://bitcoinist.com/crypto-wars-bitcoin-vs-altcoins/)
  是更廉的交易可用性以及可以容纳高量交易的区块链访问性。关于 `Bitcoin` 的评论之一是，高费用并不一定意味着其速度不理想。此外，在风险管理方面，山寨币被认为更加灵活，因为其中一些可以提供更多元化的交易和投资替代方案。


  ### 山寨币的缺点


  然而，并非所有的山寨币都适合投资。市场上的许多山寨币看起来是独特的，提供了一系列有趣的益处。然而，其中一些仅仅是 `Bitcoin` 或其他更成熟稳固的加密货币的弱势衍生品。因此，在投资山寨币时，“先看后买”是重要的。了解这些山寨币营销的收益是“真实的”收益还是空头承诺也至关重要。例如，一个吹嘘币数量的山寨币可能意味着每个硬币与其他数字货币相比价值较低。


  ### 比特币相对于山寨币的优势


  正如前面提到的，许多替代货币看起来很有前景，并在市场上的表现异常。然而，并非所有它们都能超越 `Bitcoin` 展现出的市场存在感和长期性能。某些山寨币的汇率比比特币波动好几倍，使得它们成为高风险投资。`Bitcoin`
  相比山寨币的最强优势在于安全性和测试。在过去的八年里，`Bitcoin` 在运营期间一直接受并持续进行严格的测试。比特币的访问性也是其明显优势之一。`Microsoft`
  和 `Paypal` 等大公司与其合作的事实已经证明了它的合法性和生命力。因此，尽管山寨币可能是较小投资和交易的理想选择，任何大规模的加密货币投资将从 `Bitcoin`
  中获益更多。






  # 首次代币发行


  ![](img/rsrcHV.jpg)


  首次货币发行（Initial Coin Offering），也称为 `ICO`，是一种旨在帮助加密货币初创公司获得资金的融资投机。它在很大程度上不受监管，这意味着这一过程通常是为了规避通过银行和风险投资人筹资的严格且高度监管的程序。`ICO`
  的工作原理与 `IPO`（首次公开募股）相同，在购买股票之前，你必须对其进行研究。


  在 `ICO` 中，你购买的是加密货币。通常，你从初创公司购买这些加密货币，公司承诺根据你对公司的投资价值，让你拥有其部分资产。在 `ICO` 中，你拥有的是数字硬币形式的资产。而在
  `IPO` 中，购买股票可以为你提供投票权甚至股权。当你在 `ICO` 中购买代币时，你并不拥有任何股权。代币的价值受发行它们的数字货币公司价值的影响很大。


  在 `ICO` 程序中，开发者首先会宣布对项目或货币初创公司的计划，随后他们将创建一份白皮书来解释发售的重要细节。他们还将寻求行业顾问的支持，并决定发售的代币。然后，`ICO`
  将向感兴趣的实体进行广告并举行。


  ## 如何充分利用 ICO


  尽管许多 `ICOs` 是合法的，但并非所有的都值得你投入时间和金钱。`ICOs` 是不受监管的，这可能让那些无打算回报你任何投资的骗子有机可乘。因此，在计划投资首次代币发行时，保持谨慎非常重要。


  一个重要的准则是看已发布的白皮书是否已明确了发售细节。议程应该简洁明了。此外，开发者的身份易于获取和访问也同样重要。一个红旗是开发者隐藏在化名下，或者不让相关方看到他们的位置和联系方式。


  投资 `ICOs` 具有实实在的优势，例如能够支持有的加密货币项目。此外，`ICOs` 不需要严格严谨的文件工作，与 `POs` 相比，这是一种相对容易的投资方案。然而，其不受监管的环境可能使其成为骗子的迷人的乐场。人们还担心投资完全是通过纯投机行为进行的。网络拥堵也可能导致交易失败。


  尽管如此，`ICOs` 继续为创新项目和有价值的加密货币技术开启新的机会。此外，它为那些有技能和资源对加密货币交易中新及预期问题培养开创性解决方案的人提供了激励。无论投资
  `IPO` 还是 `ICO`，任何投资中都很重要的一步都是保持谨慎，并尽可能地研究每种投资方案。这有助于追踪 `ICO` 骗局，并将资金引导至能提供真实且长期数字货币收益的项目。


