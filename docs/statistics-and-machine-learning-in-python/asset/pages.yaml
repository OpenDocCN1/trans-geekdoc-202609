    \ ill-conditioned or singular matrices.\n\n+   - The sampling density of N samples\
    \ in an P-dimensional space is proportional to N^{1/P}. Thus a high-dimensional\
    \ space becomes very sparse, leading to poor estimations of samples densities.\n\
    +   - Another consequence of the sparse sampling in high dimensions is that all\
    \ sample points are close to an edge of the sample. Consider N data points uniformly\
    \ distributed in a P-dimensional unit ball centered at the origin. Suppose we\
    \ consider a nearest-neighbor estimate at the origin. The median distance from\
    \ the origin to the closest data point is given by the expression\n\n$d(P,N) =\
    \ \\left(1 - \\frac{1}{2^N}\\right)^{1/P}$\n\nA more complicated expression exists\
    \ for the mean distance to the closest point. For N = 500, P = 10 , d(P,N) ≈ 0.52,\
    \ more than halfway to the boundary. Hence most data points are closer to the\
    \ boundary of the sample space than to any other data point. The reason that this\
    \ presents a problem is that prediction is much more difficult near the edges\
    \ of the training sample. One must extrapolate from neighboring sample points\
    \ rather than interpolate between them. (Source: T Hastie, R Tibshirani, J Friedman.\
    \ The Elements of Statistical Learning: Data Mining, Inference, and Prediction.\
    \ Second Edition, 2009.)\n\n+   - Structural risk minimization provides a theoretical\
    \ background of this phenomenon. (See VC dimension.)\n+   - See also bias–variance\
