  md: '# Example


    Given the following samples, we will test whether its true mean is 1.75.


    Warning, when computing the std or the variance, set ddof=1. The default value,
    ddof=0, leads to the biased estimator of the variance.


    ```

    import numpy as np


    x= [ 1.83,  1.83,  1.73,  1.82,  1.83,  1.73,  1.99,  1.85,  1.68,  1.87]


    xbar = np.mean(x)  # sample mean

    mu0 = 1.75  # hypothesized value

    s = np.std(x, ddof=1)  # sample standard deviation

    n = len(x)  # sample size


    tobs = (xbar - mu0) / (s / np.sqrt(n))

    print(tobs)

    ```


