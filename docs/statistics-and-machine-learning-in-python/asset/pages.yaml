- pgno: 115
  md: 'The Euclidean norm of a vector can be computed using the dot product, as


    $$\|\mathbf{a}\|_2 = \sqrt{\mathbf{a}\cdot\mathbf{a}}.$$


    # Geometric definition: projection


    In Euclidean space, a Euclidean vector is a geometrical object that possesses
    both a magnitude and a direction. A vector can be pictured as an arrow. Its magnitude
    is its length, and its direction is the direction that the arrow points. The magnitude
    of a vector a is denoted by $\|\mathbf{a}\|_2$. The dot product of two Euclidean
    vectors a and b is defined by


    $$\mathbf{a}\cdot\mathbf{b} = \|\mathbf{a}\|_2 \|\mathbf{b}\|_2 \cos\theta,$$


    where $\theta$ is the angle between $\mathbf{a}$ and $\mathbf{b}$.


    In particular, if $\mathbf{a}$ and $\mathbf{b}$ are orthogonal, then the angle
    between them is $90^\circ$ and


    $$\mathbf{a}\cdot\mathbf{b}=0.$$


    At the other extreme, if they are codirectional, then the angle between them is
    $0^\circ$ and


    $$\mathbf{a}\cdot\mathbf{b}=\|\mathbf{a}\|_2\|\mathbf{b}\|_2$$


    This implies that the dot product of a vector $\mathbf{a}$ by itself is


    $$\mathbf{a}\cdot\mathbf{a}=\|\mathbf{a}\|_2^2.$$


    The scalar projection (or scalar component) of a Euclidean vector $\mathbf{a}$
    in the direction of a Euclidean vector $\mathbf{b}$ is given by


    $$a_b = \|\mathbf{a}\|_2 \cos\theta,$$


    where $\theta$ is the angle between $\mathbf{a}$ and $\mathbf{b}$.


    In terms of the geometric definition of the dot product, this can be rewritten


    $$a_b = \frac{\mathbf{a}\cdot\mathbf{b}}{\|\mathbf{b}\|_2},$$


    ```

