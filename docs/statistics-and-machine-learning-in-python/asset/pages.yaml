  md: '+   - Unexplained variance: $\frac{SS_{res}}{\sigma^2} \sim \chi^2_{n-2}$

    +   - Explained variance: $\frac{SS_{reg}}{\sigma^2} \sim \chi^2_1$. The single
    degree of freedom comes from the difference between $\frac{SS_{tot}}{\sigma^2}
    (\sim \chi^2_{n-1})$ and $\frac{SS_{res}}{\sigma^2} (\sim \chi^2_{n-2})$, i.e.
    $(n-1) - (n-2)$ degree of freedom.


    The Fisher statistics of the ratio of two variances:


    F = \frac{Explained variance}{Unexplained variance} = \frac{SS_{reg}/1}{SS_{res}/(n-2)}
    \sim F(1, n-2)


    Using the F-distribution, compute the probability of observing a value greater
    than F under H_0, i.e.: P(x > F | H_0), i.e. the survival function (1 – Cumulative
    Distribution Function) at x of the given F-distribution.


    # 7.6.2 Multiple regression


    # Theory


    Multiple Linear Regression is the most basic supervised learning algorithm.


    Given: a set of training data {x_1, ..., x_N} with corresponding targets {y_1,
    ..., y_N}.


    In linear regression, we assume that the model that generates the data involves
    only a linear combination of the input variables, i.e.


    y(x_i, β) = β^0 + β^1 x_i^1 + ... + β^P x_i^P ,


    or, simplified


    y(x_i, β) = β_0 + \sum_{j=1}^{P-1} β_j x_i^j .


    Extending each sample with an intercept, x_i := [1, x_i] ∈ R^{P+1} allows us to
    use a more general notation based on linear algebra and write it as a simple dot
    product:


    y(x_i, β) = x_i^T β ,


    where β ∈ R^{P+1} is a vector of weights that define the P + 1 parameters of the
    model. From now on we have P regressors + the intercept.


    Minimize the Mean Squared Error MSE loss:


    MSE(β) = \frac{1}{N} \sum_{i=1}^N (y_i - y(x_i, β))^2 = \frac{1}{N} \sum_{i=1}^N
    (y_i - x_i^T β)^2


    Let X = [x_0^T, ..., x_N^T] be a N × P + 1 matrix of N samples of P input features
    with one column of one and let y = [y_1, ..., y_N] be a vector of the N targets.
    Then, using linear algebra, the mean squared error (MSE) loss can be rewritten:


    MSE(β) = \frac{1}{N} \|y - Xβ\|_2^2 .


