  md: "# Python Unit Testing\n\n# 3.12 Object Oriented Programming (OOP)\n\n# Sources\n\
    \n+   - http://python-textbok.readthedocs.org/en/latest/Object_Oriented_Programming.html\n\
    \n# Principles\n\n+   - **Encapsulate** data (attributes) and code (methods) into\
    \ objects.\n+   - **Class** = template or blueprint that can be used to create\
    \ objects.\n+   - An **object** is a specific instance of a class.\n+   - **Inheritance:**\
    \ OOP allows classes to inherit commonly used state and behaviour from other classes.\
    \ Reduce code duplication\n+   - **Polymorphism:** (usually obtained through polymorphism)\
    \ calling code is agnostic as to whether an object belongs to a parent class or\
    \ one of its descendants (abstraction, modularity). The same method called on\
    \ 2 objects of 2 different classes will behave differently.\n\n```\n```python\n\
    import math\n\nclass Shape2D:\n    def area(self):\n        raise NotImplementedError()\n\
    \n# __init__ is a special method called the constructor\n\n# Inheritance + Encapsulation\n\
    class Square(Shape2D):\n    def __init__(self, width):\n        self.width = width\n\
    \n    def area(self):\n        return self.width ** 2\n\nclass Disk(Shape2D):\n\
    \    def __init__(self, radius):\n        self.radius = radius\n\n    def area(self):\n\
    \        return math.pi * self.radius ** 2\n\nshapes = [Square(2), Disk(3)]\n\n\
    # Polymorphism\nprint([s.area() for s in shapes])\n\ns = Shape2D()\ntry:\n   \
    \ s.area()\nexcept NotImplementedError as e:\n    print(\"NotImplementedError\"\
    )\n```\n```\n\nOut:"
