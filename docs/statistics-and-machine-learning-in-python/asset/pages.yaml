    # 13.12.3 Area Under Curve (AUC) of Receiver operating characteristic (ROC)


    Some classifier may have found a good discriminative projection w. However if
    the threshold to decide the final predicted class is poorly adjusted, the performances
    will highlight an high specificity and a low sensitivity or the contrary.


    In this case it is recommended to use the AUC of a ROC analysis which basically
    provide a measure of overlap of the two classes when points are projected on the
    discriminative axis. For more detail on ROC and AUC see:https://en.wikipedia.org/wiki/Receiver_operating_characteristic.


    ```

    from sklearn import metrics

    score_pred = np.array([.1 , .2 , .3 , .4 , .5 , .6 , .7 , .8])

    y_true = np.array([0, 0, 0, 0, 1, 1, 1, 1])

    thres = .9

    y_pred = (score_pred > thres).astype(int)


    print("Predictions:", y_pred)

    metrics.accuracy_score(y_true, y_pred)


    # The overall precision an recall on each individual class

    p, r, f, s = metrics.precision_recall_fscore_support(y_true, y_pred)

    print("Recalls:", r)

    # 100% of specificity, 0% of sensitivity

    ```'
