    # 13.8 Ridge linear Support Vector Machine (L2-regularization)


    Support Vector Machine seek for separating hyperplane with maximum margin to enforce
    robustness against noise. Like logistic regression it is a discriminative method
    that only focuses of predictions.


    Here we present the non separable case of Maximum Margin Classifiers with ±1 coding
    (i.e.: y_i ∈ {-1,+1}). In the next figure the legend apply to samples of “dot”
    class.


    Linear SVM for classification (also called SVM-C or SVC) minimizes:


    min Linear SVM(w) = penalty(w) + C Hinge loss(w) = ||w||_2 + C \sum_{i=1}^N \xi_i
    with \forall i y_i (w · x_i) ≥ 1 - \xi_i


    Here we introduced the slack variables: ξ_i, with ξ_i = 0 for points that are
    on or inside the correct margin boundary and ξ_i = |y_i - (w cdot · x_i)| for
    other points. Thus:


    +   1. If y_i (w · x_i) ≥ 1 then the point lies outside the margin but on the
    correct side of the decision boundary. In this case ξ_i = 0. The constraint is
    thus not active for this point. It does not contribute to the prediction.'
