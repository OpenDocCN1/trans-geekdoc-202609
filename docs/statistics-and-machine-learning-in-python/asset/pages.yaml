- pgno: 151
  md: 'Each $P$-dimensional data point $\mathbf{x}_i$ is then projected onto $\mathbf{v}$,
    where the coordinate (in the coordinate system of $\mathbf{v}$) is a scalar value,
    namely $\mathbf{x}_i^T \mathbf{v}$. I.e., we want to find the vector $\mathbf{v}$
    that maximizes these coordinates along $\mathbf{v}$, which we will see corresponds
    to maximizing the variance of the projected data. This is equivalently expressed
    as


    $$\mathbf{v} = \arg\max_{\|\mathbf{v}\|=1} \frac{1}{N} \sum_i (\mathbf{x}_i^T
    \mathbf{v})^2.$$


    We can write this in matrix form as


    $$\mathbf{v} = \arg\max_{\|\mathbf{v}\|=1} \frac{1}{N}\|\mathbf{X}\mathbf{v}\|^2
    = \frac{1}{N}\mathbf{v}^T\mathbf{X}^T\mathbf{X}\mathbf{v} = \mathbf{v}^T\mathbf{S_{XX}}\mathbf{v},$$


    where $\mathbf{S_{XX}}$ is a biased estiamte of the covariance matrix of the data,
    i.e.


    $$\mathbf{S_{XX}} = \frac{1}{N}\mathbf{X}^T\mathbf{X}.$$


    We now maximize the projected variance $\mathbf{v}^T\mathbf{S_{XX}}\mathbf{v}$
    with respect to $\mathbf{v}$. Clearly, this has to be a constrained maximization
    to prevent $\|\mathbf{v}_2\| \to \infty$. The appropriate constraint comes from
    the normalization condition $\|\mathbf{v}\|_2 \equiv \|\mathbf{v}\|_2^2 = \mathbf{v}^T\mathbf{v}
    = 1$. To enforce this constraint, we introduce a Lagrange multiplier that we shall
    denote by $\lambda$, and then make an unconstrained maximization of


    $$\mathbf{v}^T\mathbf{S_{XX}}\mathbf{v} - \lambda(\mathbf{v}^T\mathbf{v} - 1).$$


    By setting the gradient with respect to $\mathbf{v}$ equal to zero, we see that
    this quantity has a stationary point when


    $$\mathbf{S_{XX}}\mathbf{v} = \lambda\mathbf{v}.$$


    We note that $\mathbf{v}$ is an eigenvector of $\mathbf{S_{XX}}$.


    If we left-multiply the above equation by $\mathbf{v}^T$ and make use of $\mathbf{v}^T\mathbf{v}
    = 1$, we see that the variance is given by


    $$\mathbf{v}^T\mathbf{S_{XX}}\mathbf{v} = \lambda,$$


    and so the variance will be at a maximum when $\mathbf{v}$ is equal to the eigenvector
    corresponding to the largest eigenvalue, $\lambda$. This eigenvector is known
    as the first principal component.


    We can define additional principal components in an incremental fashion by choosing
    each new direction to be that which maximizes the projected variance amongst all
    possible directions that are orthogonal to those already considered. If we consider
    the general case of a $K$-dimensional projection space, the optimal linear projection
    for which the variance of the projected data is maximized is now defined by the
    $K$ eigenvectors, $\mathbf{v}_1,\dots,\mathbf{v}_K$, of the data covariance matrix
    $\mathbf{S_{XX}}$ that corresponds to the $K$ largest eigenvalues, $\lambda_1
    \ge \lambda_2 \ge \dots \ge \lambda_K$.


    # Back to SVD


    The sample covariance matrix of centered data $\mathbf{X}$ is given by


    $$\mathbf{S_{XX}} = \frac{1}{N-1}\mathbf{X}^T\mathbf{X}.$$


    We rewrite $\mathbf{X}^T\mathbf{X}$ using the SVD decomposition of $\mathbf{X}$
    as'
