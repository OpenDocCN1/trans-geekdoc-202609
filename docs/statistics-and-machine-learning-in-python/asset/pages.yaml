  md: '# 7.4.1 Pearson correlation test: test association between two quantitative
    variables


    Test the correlation coefficient of two quantitative variables. The test calculates
    a Pearson correlation coefficient and the p-value for testing non-correlation.


    Let x and y two quantitative variables, where n samples were obeserved. The linear
    correlation coeficient is defined as :


    r = \frac{\sum_{i=1}^{n}(x_i - \bar{x})(y_i - \bar{y})}{\sqrt{\sum_{i=1}^{n}(x_i
    - \bar{x})^2 \sqrt{\sum_{i=1}^{n}(y_i - \bar{y})^2}}.


    Under H0, the test statistic t = \sqrt{n-2} \frac{r}{\sqrt{1-r^2}} follow Student
    distribution with n - 2 degrees of freedom.


    ```

    import numpy as np

    import scipy.stats as stats

    n = 50

    x = np.random.normal(size=n)

    y = 2 * x + np.random.normal(size=n)


    # Compute with scipy

    cor, pval = stats.pearsonr(x, y)

    ```


    # 7.4.2 Two sample (Student) t-test: compare two means


    The two-sample t-test (Snedecor and Cochran, 1989) is used to determine if two
    population means are equal. There are several variations on this test. If data
    are paired (e.g. 2 measures, before and after treatment for each individual) use
    the one-sample t-test of the difference. The variances of the two samples may
    be assumed to be equal (a.k.a. homoscedasticity) or unequal (a.k.a. heteroscedasticity).


    # 1. Model the data


    Assume that the two random variables are normally distributed: x ~ N(μx, σx),
    y ~ N(μy, σy).


    # 2. Fit: estimate the model parameters


    Estimate means and variances: \bar{x}, s_x^2, \bar{y}, s_y^2.


    # 3. t-test


    If we assume equal variance, The t statistic, that is used to test whether the
    means are different is:


    t = \frac{\bar{x} - \bar{y}}{s \cdot \sqrt{\frac{1}{n_x} + \frac{1}{n_y}}},


    where, \bar{x} and \bar{y} are the sample mean of group 1 and 2'
