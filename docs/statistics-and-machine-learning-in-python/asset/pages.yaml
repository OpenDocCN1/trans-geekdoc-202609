- pgno: 114
  md: '# MULTIVARIATE STATISTICS


    Multivariate statistics includes all statistical techniques for analyzing samples
    made of two or more variables. The data set (a $N \times P$ matrix $\mathbf{X}$)
    is a collection of $N$ independent samples column vectors $[\mathbf{x}_1, \dots,
    \mathbf{x}_i, \dots, \mathbf{x}_N]$ of length $P$


    $\mathbf{X} = \begin{bmatrix} -\mathbf{x}_1^T - \\ \vdots \\ -\mathbf{x}_i^T -
    \\ \vdots \\ -\mathbf{x}_P^T - \end{bmatrix} = \begin{bmatrix} x_{11} & \cdots
    & x_{1j} & \cdots & x_{1P} \\ \vdots & & \vdots & & \vdots \\ x_{i1} & \cdots
    & x_{ij} & \cdots & x_{iP} \\ \vdots & & \vdots & & \vdots \\ x_{N1} & \cdots
    & x_{Nj} & \cdots & x_{NP} \end{bmatrix} = \begin{bmatrix} x_{11} & \dots & x_{1P}
    \\ \vdots & & \vdots \\ \mathbf{X} & & \\ \vdots & & \vdots \\ x_{N1} & \dots
    & x_{NP} \end{bmatrix}_{N \times P}.$


    # 8.1 Linear Algebra


    # 8.1.1 Euclidean norm and distance


    The Euclidean norm of a vector $\mathbf{a} \in \mathbb{R}^P$ is denoted


    $\|\mathbf{a}\|_2 = \sqrt{\sum_{i}^{P} a_i^2}$


    The Euclidean distance between two vectors $\mathbf{a}, \mathbf{b} \in \mathbb{R}^P$
    is


    $\|\mathbf{a} - \mathbf{b}\|_2 = \sqrt{\sum_{i}^{P} (a_i - b_i)^2}$


    # 8.1.2 Dot product and projection


    Source: Wikipedia


    # Algebraic definition


    The dot product, denoted $\cdot$" of two $P$-dimensional vectors $\mathbf{a} =
    [a_1, a_2, \dots, a_P]$ and $\mathbf{a} = [b_1, b_2, \dots, b_P]$ is defined as


    $\mathbf{a} \cdot \mathbf{b} = \mathbf{a}^T \mathbf{b} = \sum_{i} a_i b_i = [a_1
    \dots \mathbf{a}^T \dots a_P] \begin{bmatrix} b_1 \\ \vdots \\ \mathbf{b} \\ \vdots
    \\ b_P \end{bmatrix}.$'
