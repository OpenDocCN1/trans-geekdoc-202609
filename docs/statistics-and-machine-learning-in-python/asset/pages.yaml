    # 5.11 Dealing with outliers


    ```

    size = pd.Series(np.random.normal(loc=175, size=20, scale=10))

    # Corrupt the first 3 measures

    size[:3] += 500

    ```


    # 5.11.1 Based on parametric statistics: use the mean


    Assume random variable follows the normal distribution Exclude data outside 3
    standard-deviations: - Probability that a sample lies within 1 sd: 68.27% - Probability
    that a sample lies within 3 sd: 99.73% (68.27 + 2 * 15.73)


    ```

    size_outlr_mean = size.copy()

    size_outlr_mean[((size - size.mean()).abs() > 3 * size.std())] = size.mean()

    print(size_outlr_mean.mean())

    ```


    Out:


    ```

    248.48963819938044

    ```


    # 5.11.2 Based on non-parametric statistics: use the median


    Median absolute deviation (MAD), based on the median, is a robust non-parametric
    statistics.

    https://en.wikipedia.org/wiki/Median_absolute_deviation


    ```

    mad = 1.4826 * np.median(np.abs(size - size.median()))

    size_outlr_mad = size.copy()


    size_outlr_mad[((size - size.median()).abs() > 3 * mad)] = size.median()

    print(size_outlr_mad.mean(), size_outlr_mad.median())

    ```


    Out:


    ```

    173.80000467192673 178.7023568870694

    ```'
