    ```python

    import pandas as pd

    import matplotlib.pyplot as plt

    %matplotlib inline


    url = ''https://raw.githubusercontent.com/neurospin/pystatsml/master/datasets/salary_table.csv''

    salary = pd.read_csv(url)

