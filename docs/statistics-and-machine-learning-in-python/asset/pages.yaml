  md: '$$p(C_k|x) = \frac{p(C_k)p(x|C_k)}{p(x)}$$


    Where $p(x)$ is the marginal distribution obtained by suming of classes: As usual,
    the denominator in Bayes’ theorem can be found in terms of the quantities appearing
    in the numerator, because


    $$p(x) = \sum_{k} p(x|C_k)p(C_k)$$


    +   4. Classify $x$ using the Maximum-a-Posteriori probability: $C_k = \arg\max_{C_k}
    p(C_k|x)$


    LDA is a **generative model** since the class-conditional distributions cal be
    used to generate samples of each classes.


    LDA is useful to deal with imbalanced group sizes (eg.: $N_1 \gg N_0$) since priors
    probabilities can be used to explicitly re-balance the classification by setting
    $p(C_0) = p(C_1) = 1/2$ or whatever seems relevant.


    LDA can be generalised to the multiclass case with $K > 2$.


    With $N_1 = N_0$, LDA lead to the same solution than Fisher’s linear discriminant.


