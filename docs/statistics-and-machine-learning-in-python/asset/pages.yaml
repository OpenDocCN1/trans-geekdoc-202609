  md: 'known as the coefficient of determination, denoted $R^2$ pronounced **R-squared.**


    The total sum of squares, $SS_{tot}$ is the sum of the sum of squares explained
    by the regression, $SS_{reg}$, plus the sum of squares of residuals unexplained
    by the regression, $SS_{res}$, also called the SSE, i.e. such that


    $SS_{tot} = SS_{reg} + SS_{res}$


    ![](img/c2ad4b400bf63af9804b2d44510f76a6_100_0.png)


    Fig. 7.4: title


    The mean of $y$ is


    $\bar{y} = \frac{1}{n} \sum_{i} y_i.$


    The total sum of squares is the total squared sum of deviations from the mean
    of $y$, i.e.


    $SS_{tot} = \sum_{i} (y_i - \bar{y})^2$


    The regression sum of squares, also called the explained sum of squares:


    $SS_{reg} = \sum_{i} (\hat{y}_i - \bar{y})^2,$


    where $\hat{y}_i = \beta x_i + \beta_0$ is the estimated value of salary $\hat{y}_i$
    given a value of experience $x_i$.


    The sum of squares of the residuals, also called the residual sum of squares (RSS)
    is:


    $SS_{res} = \sum_{i} (y_i - \hat{y}_i)^2.$


    $R^2$ is the explained sum of squares of errors. It is the variance explain by
    the regression divided by the total variance, i.e.


    $R^2 = \frac{\text{explained SS}}{\text{total SS}} = \frac{SS_{reg}}{SS_{tot}}
    = 1 - \frac{SS_{res}}{SS_{tot}}.$


    # 3.2 Test


    Let $\hat{\sigma}^2 = SS_{res}/(n - 2)$ be an estimator of the variance of $\epsilon$.
    The 2 in the denominator stems from the 2 estimated parameters: intercept and
    coefficient.'
