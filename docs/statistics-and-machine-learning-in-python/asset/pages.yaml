    # 8.2 Mean vector


    The mean $(P \times 1)$ column-vector $\mu$ whose estimator is


    $$\bar{\mathbf{x}} = \frac{1}{N}\sum_{i=1}^{N}\mathbf{x}_i = \frac{1}{N}\sum_{i=1}^{N}\begin{bmatrix}x_{i1}\\
    \vdots\\ x_{ij}\\ \vdots\\ x_{iP}\end{bmatrix}=\begin{bmatrix}\bar{x}_1\\ \vdots\\
    \bar{x}_j\\ \vdots\\ \bar{x}_P\end{bmatrix}.$$'
