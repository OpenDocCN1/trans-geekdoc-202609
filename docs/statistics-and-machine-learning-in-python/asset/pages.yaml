  md: '$$\log L(\boldsymbol{w}) = \sum_{i}^{N} \{ y_i \log p(C_1|\boldsymbol{w}, \boldsymbol{x}_i)
    + (1 - y_i) \log(1 - p(C_1|\boldsymbol{w}, \boldsymbol{x}_i)) \} \tag{13.8}$$\n\n$$\log
    L(\boldsymbol{w}) = \sum_{i}^{N} \{ y_i \boldsymbol{w} \cdot \boldsymbol{x}_i
    - \log(1 + \exp^{\boldsymbol{w} \boldsymbol{x}_i}) \} \tag{13.9}$$\n\n(13.10)


    Logistic regression is a **discriminative model** since it focuses only on the
    posterior probability of each class $p(C_k|x)$. It only requires to estimate the
    $P$ weight of the $w$ vector. Thus it should be favoured over LDA with many input
    features. In small dimension and balanced situations it would provide similar
    predictions than LDA.


    However imbalanced group sizes cannot be explicitly controlled. It can be managed
    using a reweighting of the input samples.


