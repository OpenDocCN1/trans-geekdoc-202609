  md: '# 13.3 Logistic regression


    Logistic regression is called a generalized linear models. ie.: it is a linear
    model with a link function that maps the output of linear multiple regression
    to the posterior probability of each class $p(C_k|x) \in [0, 1]$ using the logistic
    sigmoid function:


    $p(C_k|w, x_i) = \frac{1}{1 + \exp(-w \cdot x_i)}$


    ![](img/c2ad4b400bf63af9804b2d44510f76a6_191_0.png)


    Fig. 13.2: logistic sigmoid function


    Logistic regression seeks to minimizes the likelihood $L$ as Loss function $\mathcal{L}$:


    $\min L(w) = \Pi_i^N p(C_k|w, x_i)$


    Partically, the Loss function $\mathcal{L}$ is the log-likelihood:


    $\min \mathcal{L}(w) = \log L(w) = \sum_{i}^{N} \log p(C_k|w, x_i)$


    In the two-class case the algorithms simplify considerably by coding the two-classes
    ($C_0$ and $C_1$) via a 0/1 response $y_i$. Indeed, since $p(C_0|w, x_i) = 1 -
    p(C_1|w, x_i)$, the log-likelihood can be re-witten:'
