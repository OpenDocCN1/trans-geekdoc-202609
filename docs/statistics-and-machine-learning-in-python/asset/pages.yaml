  md: "or\n\n$F = \\frac{\\text{between-group variability}}{\\text{within-group variability}}.$\n\
    \nThe “explained variance”, or “between-group variability” is\n\n$\\sum_{i} n_{i}(\\\
    bar{Y}_{i.} - \\bar{Y})^{2}/(K - 1),$\n\nwhere $\\bar{Y}_{i.}$ denotes the sample\
    \ mean in the $i$th group, $n_{i}$ is the number of observations in the $i$th\
    \ group, $\\bar{Y}$ denotes the overall mean of the data, and $K$ denotes the\
    \ number of groups.\n\nThe “unexplained variance”, or “within-group variability”\
    \ is\n\n$\\sum_{ij}(Y_{ij} - \\bar{Y}_{i.})^{2}/(N - K),$\n\nwhere $Y_{ij}$ is\
    \ the $j$th observation in the $i$th out of $K$ groups and $N$ is the overall\
    \ sample size. This $F$-statistic follows the $F$-distribution with $K - 1$ and\
    \ $N - K$ degrees of freedom under the null hypothesis. The statistic will be\
    \ large if the between-group variability is large relative to the within-group\
    \ variability, which is unlikely to happen if the population means of the groups\
    \ all have the same value.\n\nNote that when there are only two groups for the\
    \ one-way ANOVA F-test, $F = t^{2}$ where $t$ is the Student’s $t$ statistic.\n\
