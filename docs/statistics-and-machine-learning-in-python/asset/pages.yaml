  md: '+   • The distribution of sum of squares of n normal random variables: ∑_i^n
    Z_i² ~ χ_n²


    The sum of two χ² RV with p and q df is a χ² RV with p + q df. This is useful
    when summing/subtracting sum of squares.


    The χ²-distribution is used to model errors measured as sum of squares or the
    distribution of the sample variance.




    The F-distribution, F_{n,p}, with n and p degrees of freedom is the ratio of two
    independent χ² variables. Let X ~ χ_n² and Y ~ χ_p² then:


    F_{n,p} = \frac{X/n}{Y/p}


    The F-distribution plays a central role in hypothesis testing answering the question:
    Are two variances equals?, is the ratio or two errors significantly large?.


    ```

    import numpy as np

    from scipy.stats import f

    import matplotlib.pyplot as plt

    %matplotlib inline

    fvalues = np.linspace(1, 5, 100)

    # pdf(x, df1, df2): Probability density function at x of F.

    plt.plot(fvalues, f.pdf(fvalues, 1, 30), ''b-'', label="F(1, 30)")

    plt.plot(fvalues, f.pdf(fvalues, 5, 30), ''r-'', label="F(5, 30)")

    plt.legend()

    # cdf(x, df1, df2): Cumulative distribution function of F.

    # ie.

    proba_at_f_inf_3 = f.cdf(3, 1, 30) # P(F(1,30) < 3)

    # ppf(q, df1, df2): Percent point function (inverse of cdf) at q of F.

    f_at_proba_inf_95 = f.ppf(.95, 1, 30) # q such P(F(1,30) < .95)

    assert f.cdf(f_at_proba_inf_95, 1, 30) == .95

    # sf(x, df1, df2): Survival function (1 - cdf) at x of F.

    proba_at_f_sup_3 = f.sf(3, 1, 30) # P(F(1,30) > 3)

    assert proba_at_f_inf_3 + proba_at_f_sup_3 == 1

    # p-value: P(F(1, 30)) < 0.05

    low_proba_fvalues = fvalues[fvalues > f_at_proba_inf_95]

    plt.fill_between(low_proba_fvalues, 0, f.pdf(low_proba_fvalues, 1, 30),

    alpha=.8, label="P < 0.05")

    plt.show()

    ```'
