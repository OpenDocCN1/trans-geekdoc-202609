  md: '![](img/c2ad4b400bf63af9804b2d44510f76a6_155_0.png)


    # 10.4 Multi-dimensional Scaling (MDS)


    Resources:


    +   - http://www.stat.pitt.edu/sungkyu/course/2221Fall13/lec8_mds_combined.pdf

    +   - https://en.wikipedia.org/wiki/Multidimensional_scaling

    +   - Hastie, Tibshirani and Friedman (2009). *The Elements of Statistical Learning:
    Data Mining, Inference, and Prediction.* New York: Springer, Second Edition.


    The purpose of MDS is to find a low-dimensional projection of the data in which
    the pairwise distances between data points is preserved, as closely as possible
    (in a least-squares sense).


    +   - Let **D** be the (*N* × *N*) pairwise distance matrix where *d_ij* is a
    *distance* between points *i* and *j*.

    +   - The MDS concept can be extended to a wide variety of data types specified
    in terms of a similarity matrix.


    Given the dissimilarity (distance) matrix **D**_{N×N} = [*d_ij*], MDS attempts
    to find *K*-dimensional projections of the *N* points **x**₁,…, **x**_N ∈ ℝ^K,
    concatenated in an **X**_{N×K} matrix, so that *d_ij* ≈ ||**x**_i − **x**_j||
    are as close as possible. This can be obtained by the minimization of a loss function
    called the **stress function**


    stress(**X**) = Σ_{i≠j} (d_{ij} − ||**x**_i − **x**_j||)² .


    This loss function is known as *least-squares* or *Kruskal-Shepard* scaling.


    A modification of *least-squares* scaling is the *Sammon mapping*


    stress_{Sammon}(**X**) = Σ_{i≠j} (d_{ij} − ||**x**_i − **x**_j||)² / d_{ij} .'
