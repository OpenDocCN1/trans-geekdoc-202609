    # 13.12.2 Significance of classification rate


    P-value associated to classification rate. Compared the number of correct classifications
    (=accuracy ×N) to the null hypothesis of Binomial distribution of parameters p
    (typically 50% of chance level) and N (Number of observations).


    Is 60% of accuracy a significant prediction rate among 62 observations?


    Since this is an exact, two-sided test of the null hypothesis, the p-value can
    be divided by 2 since we test that the accuracy is superior to the chance level.


    ```

    import scipy.stats


    acc, N = 0.62, 62

    pval = scipy.stats.binom_test(x=int(acc * N), n=N, p=0.5) / 2

    print(pval)

    ```


