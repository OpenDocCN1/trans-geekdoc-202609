    If the covariance matrix is the identity matrix, the Mahalanobis distance reduces
    to the Euclidean distance. If the covariance matrix is diagonal, then the resulting
    distance measure is called a normalized Euclidean distance.


    More generally, the Mahalanobis distance is a measure of the distance between
    a point x and a distribution N(x|μ, Σ). It is a multi-dimensional generalization
    of the idea of measuring how many standard deviations away x is from the mean.
    This distance is zero if x is at the mean, and grows as x moves away from the
    mean: along each principal component axis, it measures the number of standard
    deviations from x to the mean of the distribution.


    # 8.7 Multivariate normal distribution


    The distribution, or probability density function (PDF) (sometimes just density),
    of a continuous random variable is a function that describes the relative likelihood
    for this random variable to take on a given value.


    The multivariate normal distribution, or multivariate Gaussian distribution, of
    a P-dimensional random vector x = [x1, x2, …, xP]ᵀ is


    N(x|μ, Σ) = 1 / ((2π)^{P/2} |Σ|^{1/2}) exp{ -1/2 (x - μ)ᵀ Σ^{-1} (x - μ) }


