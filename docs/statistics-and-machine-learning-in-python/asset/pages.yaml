  md: "Since we do not care about the magnitude of $w$, only its direction, we replaced\
    \ the scalar factor $(w^T S_B w)/(w^T S_W w)$ by $\\lambda$.\n\nIn the multiple-class\
    \ case, the solutions $w$ are determined by the eigenvectors of $S_W^{-1} S_B$\
    \ that correspond to the $K-1$ largest eigenvalues.\n\nHowever, in the two-class\
    \ case (in which $S_B = (\\mu_1 - \\mu_0)(\\mu_1 - \\mu_0)^T$) it is easy to show\
    \ that $w = S_W^{-1}(\\mu_1 - \\mu_0)$ is the unique eigenvector of $S_W^{-1}\
    \ S_B$:\n\n$S_W^{-1}(\\mu_1 - \\mu_0)(\\mu_1 - \\mu_0)^T w = \\lambda w$\n\n$S_W^{-1}(\\\
    mu_1 - \\mu_0)(\\mu_1 - \\mu_0)^T S_W^{-1}(\\mu_1 - \\mu_0) = \\lambda S_W^{-1}(\\\
    mu_1 - \\mu_0)$\n\nwhere here $\\lambda = (\\mu_1 - \\mu_0)^T S_W^{-1}(\\mu_1\
    \ - \\mu_0)$. Which leads to the result\n\n$w \\propto S_W^{-1}(\\mu_1 - \\mu_0)$.\n\
    \n# 13.1.2 The separating hyperplane\n\nThe separating hyperplane is a $P-1$-dimensional\
    \ hyper surface, orthogonal to the projection vector, $w$. There is no single\
    \ best way to find the origin of the plane along $w$, or equivalently the classification\
    \ threshold that determines whether a point should be classified as belonging\
    \ to $C_0$ or to $C_1$. However, if the projected points have roughly the same\
    \ distribution, then the threshold can be chosen as the hyperplane exactly between\
    \ the projections of the two means, i.e. as\n\n$T = w \\cdot \\frac{1}{2}(\\mu_1\
    \ - \\mu_0)$.\n\n```\n%matplotlib inline\nimport warnings\nwarnings.filterwarnings(action='once')\n\
    ```\n\n# 13.2 Linear discriminant analysis (LDA)\n\nLinear discriminant analysis\
    \ (LDA) is a probabilistic generalization of Fisher’s linear discriminant. It\
    \ uses Bayes’ rule to fix the threshold based on prior probabilities of classes.\n\
    \n+   1. First compute the The class-conditional distributions of $x$ given class\
    \ $C_k$: $p(x|C_k) = \\mathcal{N}(x|\\mu_k, S_W)$. Where $\\mathcal{N}(x|\\mu_k,\
    \ S_W)$ is the multivariate Gaussian distribution defined over a P-dimensional\
    \ vector $x$ of continuous variables, which is given by\n+   \n+   $\\mathcal{N}(x|\\\
    mu_k, S_W) = \\frac{1}{(2\\pi)^{P/2}|S_W|^{1/2}} \\exp\\{-\\frac{1}{2}(x - \\\
    mu_k)^T S_W^{-1}(x - \\mu_k)\\}$\n+   \n+   2. Estimate the prior probabilities\
    \ of class $k$, $p(C_k) = N_k/N$.\n+   \n+   3. Compute posterior probabilities\
    \ (ie. the probability of a each class given a sample) combining conditional with\
    \ priors using Bayes’ rule:"
