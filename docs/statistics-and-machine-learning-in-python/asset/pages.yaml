  md: '# 13.12 Metrics of classification performance evaluation


    # 13.12.1 Metrics for binary classification


    source: https://en.wikipedia.org/wiki/Sensitivity_and_specificity


    Imagine a study evaluating a new test that screens people for a disease. Each
    person taking the test either has or does not have the disease. The test outcome
    can be positive (classifying the person as having the disease) or negative (classifying
    the person as not having the disease). The test results for each subject may or
    may not match the subject’s actual status. In that setting:


    +   - True positive (TP): Sick people correctly identified as sick

    +   - False positive (FP): Healthy people incorrectly identified as sick

    +   - True negative (TN): Healthy people correctly identified as healthy

    +   - False negative (FN): Sick people incorrectly identified as healthy

    +   - Accuracy (ACC):

    +     ACC = (TP + TN) / (TP + FP + FN + TN)

    +   - Sensitivity (SEN) or recall of the positive class or true positive rate
    (TPR) or hit rate:

    +     SEN = TP / P = TP / (TP+FN)

    +   - Specificity (SPC) or recall of the negative class or true negative rate:

    +     SPC = TN / N = TN / (TN+FP)

    +   - Precision or positive predictive value (PPV):

    +     PPV = TP / (TP + FP)

    +   - Balanced accuracy (bACC):is a useful performance measure is the balanced
    accuracy which avoids inflated performance estimates on imbalanced datasets (Brodersen,
    et al. (2010). “The balanced accuracy and its posterior distribution”). It is
    defined as the arithmetic mean of sensitivity and specificity, or the average
    accuracy obtained on either class:

    +     bACC = 1/2 * (SEN + SPC)

    +   - F1 Score (or F-score) which is a weighted average of precision and recall
    are useful to deal with imbalanced datasets


    The four outcomes can be formulated in a 2×2 contingency table or confusion matrix
    https://en.wikipedia.org/wiki/Sensitivity_and_specificity


    For more precision see: http://scikit-learn.org/stable/modules/model_evaluation.html


    ```

    from sklearn import metrics

    y_pred = [0, 1, 0, 0]

    y_true = [0, 1, 0, 1]


    metrics.accuracy_score(y_true, y_pred)


    # The overall precision an recall

    metrics.precision_score(y_true, y_pred)

    metrics.recall_score(y_true, y_pred)


    # Recalls on individual classes: SEN & SPC

