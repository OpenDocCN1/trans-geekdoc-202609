  md: '# 7.5.2 Wilcoxon signed-rank test (quantitative ~ cte)


    Source: https://en.wikipedia.org/wiki/Wilcoxon_signed-rank_test


    The Wilcoxon signed-rank test is a non-parametric statistical hypothesis test
    used when comparing two related samples, matched samples, or repeated measurements
    on a single sample to assess whether their population mean ranks differ (i.e.
    it is a paired difference test). It is equivalent to one-sample test of the difference
    of paired samples.


    It can be used as an alternative to the paired Student’s t-test, t-test for matched
    pairs, or the t-test for dependent samples when the population cannot be assumed
    to be normally distributed.


    When to use it? Observe the data distribution: - presence of outliers - the distribution
    of the residuals is not Gaussian


    It has a lower sensitivity compared to t-test. May be problematic to use when
    the sample size is small.


    Null hypothesis H0: difference between the pairs follows a symmetric distribution
    around zero.


    ```

    import scipy.stats as stats

    n = 20

    # Buisness Volume time 0

    bv0 = np.random.normal(loc=3, scale=.1, size=n)

    # Buisness Volume time 1

    bv1 = bv0 + 0.1 + np.random.normal(loc=0, scale=.1, size=n)


    # create an outlier

    bv1[0] -= 10


    # Paired t-test

    print(stats.ttest_rel(bv0, bv1))


    # Wilcoxon

    print(stats.wilcoxon(bv0, bv1))

    ```


    ```

    Ttest_relResult(statistic=0.7676263474825586, pvalue=0.4521440652558284)

    WilcoxonResult(statistic=34.0, pvalue=0.0080344288555667)

    ```


    # 7.5.3 Mann–Whitney U test (quantitative ~ categorical (2 levels))


    In statistics, the Mann–Whitney U test (also called the Mann–Whitney–Wilcoxon,
    Wilcoxon rank-sum test or Wilcoxon–Mann–Whitney test) is a nonparametric test
    of the null hypothesis that two samples come from the same population against
    an alternative hypothesis, especially that a particular population tends to have
    larger values than the other.


    It can be applied on unknown distributions contrary to e.g. a t-test that has
    to be applied only on normal distributions, and it is nearly as efficient as the
    t-test on normal distributions.


    ```

    import scipy.stats as stats

    n = 20

    # Buismess Volume group 0

    bv0 = np.random.normal(loc=1, scale=.1, size=n)


    # Buismess Volume group 1

    bv1 = np.random.normal(loc=1.2, scale=.1, size=n)

    ```'
