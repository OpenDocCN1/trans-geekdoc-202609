    +   - Control packages environment for a specific purpose: collaborating with
    someone else, delivering an application to your client,

    +   - Switch between environments


    List of all environments


    :: conda info –envs


    +   1. Create new environment

    +   2. Activate

    +   3. Install new package


    ```

    conda create --name test

    # Or

    conda env create -f environment.yml

    source activate test

    conda info --envs

    conda list

    conda search -f numpy

    conda install numpy

    ```


