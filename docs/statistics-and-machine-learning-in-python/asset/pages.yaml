    Univariate statistical analysis: explore association between pairs of variables.


    +   - In statistics, a categorical variable or factor is a variable that can take
    on one of a limited, and usually fixed, number of possible values, thus assigning
    each individual to a particular group or “category”. The levels are the possibles
    values of the variable. Number of levels = 2: binomial; Number of levels > 2:
    multinomial. There is no intrinsic ordering to the categories. For example, gender
    is a categorical variable having two categories (male and female) and there is
    no intrinsic ordering to the categories. For example, Sex (Female, Male), Hair
    color (blonde, brown, etc.).

    +   - An ordinal variable is a categorical variable with a clear ordering of the
    levels. For example: drinks per day (none, small, medium and high).

    +   - A continuous or quantitative variable x ∈ ℝ is one that can take any value
    in a range of possible values, possibly infinite. E.g.: salary, experience in
