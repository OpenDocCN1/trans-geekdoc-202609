  md: "```\nassert np.all(y_test_pred == y_test_pred_seq)\nassert np.allclose(np.array(coefs_cv).squeeze(),\
    \ np.array(coefs_seq).squeeze())\n```\n\n# 15.4 CV for model selection: setting\
    \ the hyper parameters\n\nIt is important to note CV may be used for two separate\
    \ goals:\n\n+   1. Model assessment: having chosen a final model, estimating its\
    \ prediction error (generalization error) on new data.\n+   \n+   2. Model selection:\
    \ estimating the performance of different models in order to choose the best one.\
    \ One special case of model selection is the selection model's hyper parameters.\
    \ Indeed remember that most of learning algorithm have a hyper parameters (typically\
    \ the regularization parameter) that has to be set.\n\nGenerally we must address\
    \ the two problems simultaneously. The usual approach for both problems is to\
    \ randomly divide the dataset into three parts: a training set, a validation set,\
    \ and a test set.\n\n+   • The training set (train) is used to fit the models;\n\
    +   • the validation set (val) is used to estimate prediction error for model\
    \ selection or to determine the hyper parameters over a grid of possible values.\n\
    +   • the test set (test) is used for assessment of the generalization error of\
    \ the final chosen model.\n\n# 15.4.1 Grid search procedure\n\nModel selection\
    \ of the best hyper parameters over a grid of possible values\n\nFor each possible\
    \ values of hyper parameters α_k:\n\n+   1. Fit the learner on training set: f(X_train,\
    \ y_train, α_k)\n+   \n+   2. Evaluate the model on the validation set and keep\
    \ the parameter(s) that minimises the error measure\n+   \n+   α_* = arg min L(f(X_train),\
    \ y_val, α_k)\n+   \n+   3. Refit the learner on all training + validation data\
    \ using the best hyper parameters: f* ≡ f(X_trainUval, y_trainUval, α_*)\n+  \
    \ \n+   4. ** Model assessment ** of f* on the test set: L(f*(X_test), y_test)\n\
    \n# 15.4.2 Nested CV for model selection and assessment\n\nMost of time, we cannot\
    \ afford such three-way split. Thus, again we will use CV, but in this case we\
    \ need two nested CVs.\n\nOne outer CV loop, for model assessment. This CV performs\
    \ K splits of the dataset into training plus validation (X_{-K}, y_{-K}) set and\
    \ a test set X_K, y_K"
