- pgno: 12
  md: "# INTRODUCTION TO MACHINE LEARNING\n\n# 2.1 Machine learning within data science\n\
    \n![](img/c2ad4b400bf63af9804b2d44510f76a6_12_0.png)\n\nMachine learning covers\
    \ two main types of data analysis:\n\n+   1. Exploratory analysis: Unsupervised\
    \ learning. Discover the structure within the data. E.g.: Experience (in years\
    \ in a company) and salary are correlated.\n+   \n+   2. Predictive analysis:\
    \ Supervised learning. This is sometimes described as “learn from the past to\
    \ predict the future”. Scenario: a company wants to detect potential future clients\
    \ among a base of prospects. Retrospective data analysis: we go through the data\
    \ constituted of previous prospected companies, with their characteristics (size,\
    \ domain, localization, etc…). Some of these companies became clients, others\
    \ did not. The question is, can we possibly predict which of the new companies\
    \ are more likely to become clients, based on their characteristics based on previous\
    \ observations? In this example, the training data consists of a set of n training\
    \ samples. Each sample, x_i, is a vector of p input features (company characteristics)\
    \ and a target feature (y_i ∈ {Yes, No}) (whether they became a client or not)."
  merge: -1
  img_proc: true
