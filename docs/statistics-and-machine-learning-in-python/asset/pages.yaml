  md: '# CLUSTERING


    Wikipedia: Cluster analysis or clustering is the task of grouping a set of objects
    in such a way that objects in the same group (called a cluster) are more similar
    (in some sense or another) to each other than to those in other groups (clusters).
    Clustering is one of the main task of exploratory data mining, and a common technique
    for statistical data analysis, used in many fields, including machine learning,
    pattern recognition, image analysis, information retrieval, and bioinformatics.


    Sources: http://scikit-learn.org/stable/modules/clustering.html


    # 11.1 K-means clustering


    Source: C. M. Bishop *Pattern Recognition and Machine Learning*, Springer, 2006


    Suppose we have a data set $X = \{x_1, \cdots , x_N\}$ that consists of $N$ observations
    of a random $D$-dimensional Euclidean variable $x$. Our goal is to partition the
    data set into some number, $K$, of clusters, where we shall suppose for the moment
    that the value of $K$ is given. Intuitively, we might think of a cluster as comprising
    a group of data points whose inter-point distances are small compared to the distances
    to points outside of the cluster. We can formalize this notion by first introducing
    a set of $D$-dimensional vectors $\mu_k$, where $k = 1, \ldots , K$, in which
    $\mu_k$ is a **prototype** associated with the $k^{th}$ cluster. As we shall see
    shortly, we can think of the $\mu_k$ as representing the centres of the clusters.
    Our goal is then to find an assignment of data points to clusters, as well as
    a set of vectors $\{\mu_k\}$, such that the sum of the squares of the distances
    of each data point to its closest prototype vector $\mu_k$, is at a minimum.


    It is convenient at this point to define some notation to describe the assignment
    of data points to clusters. For each data point $x_i$, we introduce a corresponding
    set of binary indicator variables $r_{ik} \in \{0,1\}$, where $k = 1, \ldots ,
    K$, that describes which of the $K$ clusters the data point $x_i$ is assigned
    to, so that if data point $x_i$ is assigned to cluster $k$ then $r_{ik} = 1$,
    and $r_{ij} = 0$ for $j \neq k$. This is known as the 1-of-$K$ coding scheme.
    We can then define an objective function, denoted **inertia**, as


    $J(r, \mu) = \sum_{i}^{N} \sum_{k}^{K} r_{ik} \|x_i - \mu_k\|_2^2$


    which represents the sum of the squares of the Euclidean distances of each data
    point to its assigned vector $\mu_k$. Our goal is to find values for the $\{r_{ik}\}$
    and the $\{\mu_k\}$ so as to minimize the function $J$. We can do this through
    an iterative procedure in which each iteration involves two successive steps corresponding
    to successive optimizations with respect to the $r_{ik}$ and the $\mu_k$. First
    we choose some initial values for the $\mu_k$. Then in the first phase we minimize
    $J$ with respect to the $r_{ik}$, keeping the $\mu_k$ fixed. In the second phase
    we minimize $J$ with respect to'
