    # Dealing with multicollinearity:


    +   - Regularisation by e.g. ℓ₂ shrinkage: Introduce a bias in the solution by
    making $(X^T X)^{-1}$ non-singular. See ℓ₂ shrinkage.

    +   - Feature selection: select a small number of features. See: Isabelle Guyon
    and André Elisseeff *An introduction to variable and feature selection* The Journal
    of Machine Learning Research, 2003.

    +   - Feature selection: select a small number of features using ℓ₁ shrinkage.

    +   - Extract few independent (uncorrelated) features using e.g. principal components
    analysis (PCA), partial least squares regression (PLS-R) or regression methods
    that cut the number of predictors to a smaller set of uncorrelated components.


    # 12.3.3 High dimensionality


    High dimensions means a large number of input features. Linear predictor associate
    one parameter to each input feature, so a high-dimensional situation ($P$, number
    of features, is large) with a relatively small number of samples $N$ (so-called
    large $P$ small $N$ situation) generally lead to an overfit of the training data.
    Thus it is generally a bad idea to add many input features into the learner. This
    phenomenon is called the **curse of dimensionality**.


    One of the most important criteria to use when choosing a learning algorithm is
    based on the relative size of $P$ and $N$.


    +   - Remenber that the “covariance” matrix $\mathbf{X}^T \mathbf{X}$ used in
    the linear model is a $P \times P$ matrix of rank $\min(N, P)$. Thus if $P > N$
    the equation system is overparameterized and admit an'
