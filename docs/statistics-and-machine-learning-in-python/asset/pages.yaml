  md: "The Sammon mapping performs better at preserving small distances compared to\
    \ the least-squares scaling.\n\n# 10.4.1 Classical multidimensional scaling\n\n\
    Also known as principal coordinates analysis, PCoA.\n\n+   - The distance matrix,\
    \ D, is transformed to a similarity matrix, B, often using centered inner products.\n\
    +   - The loss function becomes\n+   \n+     stress_classical(X) = sum_{i≠j} (b_ij\
    \ - <x_i, x_j>)^2.\n+   - The stress function in classical MDS is sometimes called\
    \ strain.\n+   - The solution for the classical MDS problems can be found from\
    \ the eigenvectors of the similarity matrix.\n+   - If the distances in D are\
    \ Euclidean and double centered inner products are used, the results are equivalent\
    \ to PCA.\n\n# 10.4.2 Example\n\nThe eurodist dataset provides the road distances\
    \ (in kilometers) between 21 cities in Europe. Given this matrix of pairwise (non-Euclidean)\
    \ distances D = [d_ij], MDS can be used to recover the coordinates of the cities\
