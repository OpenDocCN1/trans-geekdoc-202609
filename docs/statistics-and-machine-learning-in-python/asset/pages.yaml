    ```


    # 1. Model the data


    Model the data on some hypothesis e.g.: salary is a linear function of the experience.


    salary_i = β experience_i + β0 + ε_i,


    more generally


    y_i = β x_i + β0 + ε_i


    +   - β: the slope or coefficient or parameter of the model,

    +   - β0: the intercept or bias is the second parameter of the model,

    +   - ε_i: is the i th error, or residual with ε ~ N(0, σ²).


    The simple regression is equivalent to the Pearson correlation.


    # 2. Fit: estimate the model parameters


    The goal it so estimate β, β0 and σ².


    Minimizes the mean squared error (MSE) or the Sum squared error (SSE). The so-called
    Ordinary Least Squares (OLS) finds β, β0 that minimizes the SSE = Σ_i ε_i²


    SSE = Σ_i (y_i - β x_i - β0)²


    Recall from calculus that an extreme point can be found by computing where the
    derivative is zero, i.e. to find the intercept, we perform the steps:


    ∂SSE/∂β0 = Σ_i (y_i - β x_i - β0) = 0

    Σ_i y_i = β Σ_i x_i + n β0

    n ȳ = n β x̄ + n β0

    β0 = ȳ - β x̄


    To find the regression coefficient, we perform the steps:


    ∂SSE/∂β = Σ_i x_i (y_i - β x_i - β0) = 0'
