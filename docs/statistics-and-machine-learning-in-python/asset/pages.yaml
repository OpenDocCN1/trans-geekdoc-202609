    \n# 4.7 Broadcasting\n\nSources: https://docs.scipy.org/doc/numpy-1.13.0/user/basics.broadcasting.html\
    \ Implicit conversion to allow operations on arrays of different sizes. - The\
    \ smaller array is stretched or “broadcasted” across the larger array so that\
    \ they have compatible shapes. - Fast vectorized operation in C instead of Python.\
    \ - No needless copies.\n\n# 4.7.1 Rules\n\nStarting with the trailing axis and\
    \ working backward, Numpy compares arrays dimensions.\n\n+   - If two dimensions\
    \ are equal then continues\n+   - If one of the operand has dimension 1 stretches\
    \ it to match the largest one\n+   - When one of the shapes runs out of dimensions\
    \ (because it has less dimensions than the other shape), Numpy will use 1 in the\
    \ comparison process until the other shape’s dimensions run out as well.\n\n```\n\
    a = np.array([[ 0,  0,  0],\n             [10, 10, 10],\n             [20, 20,\
    \ 20],\n             [30, 30, 30]])\n\nb = np.array([0, 1, 2])\n\nprint(a + b)\n\
    ```\n\nOut:\n\n```\n[[ 0  1  2]\n[10 11 12]\n```"
