    ```


    The :math:`p`-value is the probability to observe a value t more extreme than
    the observed one t_obs under the null hypothesis H0: P(t > t_obs|H0)


    ```

    import scipy.stats as stats

    import matplotlib.pyplot as plt


    #tobs = 2.39687663116  # assume the t-value

    tvalues = np.linspace(-10, 10, 100)

    plt.plot(tvalues, stats.t.pdf(tvalues, n-1), ''b-'', label=''T(n-1)'')

    upper_tval_tvalues = tvalues[tvalues > tobs]

    plt.fill_between(upper_tval_tvalues, 0, stats.t.pdf(upper_tval_tvalues, n-1),
