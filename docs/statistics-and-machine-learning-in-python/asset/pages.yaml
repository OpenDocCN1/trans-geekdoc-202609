    # 13.5 Ridge Fisher’s linear classification (L2-regularization)


    When the matrix $S_W$ is not full rank or $P \gg N$, the The Fisher most discriminant
    projection estimate of the is not unique. This can be solved using a biased version
    of $S_W$:


    $S_W^{Ridge} = S_W + \lambda I$


    where $I$ is the $P \times P$ identity matrix. This leads to the regularized (ridge)
    estimator of the Fisher’s linear discriminant analysis:


    $w^{Ridge} \propto (S_W + \lambda I)^{-1} (\mu_1 - \mu_0)$


    ![](img/c2ad4b400bf63af9804b2d44510f76a6_193_1.png)


    Fig. 13.4: The Ridge Fisher most discriminant projection


    Increasing $\lambda$ will:


    +   - Shrinks the coefficients toward zero.

    +   - The covariance will converge toward the diagonal matrix, reducing the contribution
    of the pairwise covariances.


