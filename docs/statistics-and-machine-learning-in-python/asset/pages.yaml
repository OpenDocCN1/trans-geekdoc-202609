    # 13.4 Overfitting


    VC dimension (for Vapnik–Chervonenkis dimension) is a measure of the **capacity**
    (complexity, expressive power, richness, or flexibility) of a statistical classification
    algorithm, defined as the cardinality of the largest set of points that the algorithm
    can shatter.


    Theorem: Linear classifier in $R^P$ have VC dimension of $P + 1$. Hence in dimension
    two ($P = 2$) any random partition of 3 points can be learned.'
