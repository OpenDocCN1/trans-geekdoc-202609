    \ set: (X_{-K,-L}, y_{-K,-L}) and a validation set: (X_{-K,L}, y_{-K,L}).\n\n\
    # 15.4.3 Implementation with scikit-learn\n\nNote that the inner CV loop combined\
    \ with the learner form a new learner with an automatic model (parameter) selection\
    \ procedure. This new learner can be easily constructed using Scikit-learn. The\
    \ learned is wrapped inside a GridSearchCV class.\n\nThen the new learned can\
    \ be plugged into the classical outer CV loop.\n\n```\nimport numpy as np\nfrom\
    \ sklearn import datasets\nimport sklearn.linear_model as lm\nfrom sklearn.model_selection\
    \ import GridSearchCV\nimport sklearn.metrics as metrics\nfrom sklearn.model_selection\
    \ import KFold\n\n# Dataset\nnoise_sd = 10\nX, y, coef = datasets.make_regression(n_samples=50,\
    \ n_features=100, noise=noise_sd,\n                                      n_informative=2,\
    \ random_state=42, coef=True)\n\n# Use this to tune the noise parameter such that\
    \ snr < 5\nprint(\"SNR:\", np.std(np.dot(X, coef)) / noise_sd)\n\n# param grid\
    \ over alpha & l1_ratio\nparam_grid = {'alpha': 10. ** np.arange(-3, 3), 'l1_ratio':[.1,\
    \ .5, .9]}\n\n# Warp\nmodel = GridSearchCV(lm.ElasticNet(max_iter=10000), param_grid,\
    \ cv=5)\n\n# 1) Biased usage: fit on all data, ommit outer CV loop\nmodel.fit(X,\
    \ y)\nprint(\"Train r2:%.2f\" % metrics.r2_score(y, model.predict(X)))\nprint(model.best_params_)\n\
    \n# 2) User made outer CV, useful to extract specific information\ncv = KFold(n_splits=5,\
    \ random_state=42)\ny_test_pred = np.zeros(len(y))\ny_train_pred = np.zeros(len(y))\n\
    alphas = list()\n\nfor train, test in cv.split(X, y):\n    X_train, X_test, y_train,\
    \ y_test = X[train, :], X[test, :], y[train], y[test]\n    model.fit(X_train,\
    \ y_train)\n    y_test_pred[test] = model.predict(X_test)\n    y_train_pred[train]\
    \ = model.predict(X_train)\n    alphas.append(model.best_params_)\n\nprint(\"\
    Train r2:%.2f\" % metrics.r2_score(y, y_train_pred))\nprint(\"Test  r2:%.2f\"\
    \ % metrics.r2_score(y, y_test_pred))\nprint(\"Selected alphas:\", alphas)\n```"
