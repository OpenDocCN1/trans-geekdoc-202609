  - '[PAGE 150]


    +   - The idea of principal component analysis is to find the K **principal components
    directions** (called the **loadings**) **V**$_{K×P}$ that capture the variation
    in the data as much as possible.

    +   - It converts a set of N P-dimensional observations **N**$_{N×P}$ of possibly
    correlated variables into a set of N K-dimensional samples **C**$_{N×K}$, where
    the K < P. The new variables are linearly uncorrelated. The columns of **C**$_{N×K}$
    are called the **principal components**.

    +   - The dimension reduction is obtained by using only K < P components that
    exploit correlation (covariance) among the original variables.

    +   - PCA is mathematically defined as an orthogonal linear transformation **V**$_{K×P}$
    that transforms the data to a new coordinate system such that the greatest variance
    by some projection of the data comes to lie on the first coordinate (called the
    first principal component), the second greatest variance on the second coordinate,
    and so on.


    **C**$_{N×K}$ = **X**$_{N×P}$ **V**$_{P×K}$


    +   - PCA can be thought of as fitting a P-dimensional ellipsoid to the data,
    where each axis of the ellipsoid represents a principal component. If some axis
    of the ellipse is small, then the variance along that axis is also small, and
    by omitting that axis and its corresponding principal component from our representation
    of the dataset, we lose only a commensurately small amount of information.

    +   - Finding the K largest axes of the ellipse will permit to project the data
    onto a space having dimensionality K < P while maximizing the variance of the
    projected data.


    # 10.3.2 Dataset preprocessing


    # Centering


    Consider a data matrix, **X** , with column-wise zero empirical mean (the sample
    mean of each column has been shifted to zero), ie. **X** is replaced by **X**
    − **1** **x̄**$^{T}$.


    # Standardizing


    Optionally, standardize the columns, i.e., scale them by their standard-deviation.
    Without standardization, a variable with a high variance will capture most of
    the effect of the PCA. The principal direction will be aligned with this variable.
    Standardization will, however, raise noise variables to the save level as informative
    variables.


    The covariance matrix of centered standardized data is the correlation matrix.


    # 10.3.3 Eigendecomposition of the data covariance matrix


    To begin with, consider the projection onto a one-dimensional space (K = 1). We
    can define the direction of this space using a P-dimensional vector **v**, which
    for convenience (and without loss of generality) we shall choose to be a unit
    vector so that ‖**v**‖₂ = 1 (note that we are only interested in the direction
    defined by **v**, not in the magnitude of **v** itself). PCA consists of two mains
    steps:


    # Projection in the directions that capture the greatest variance'
