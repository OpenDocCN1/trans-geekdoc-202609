    A permutation test is a type of non-parametric randomization test in which the
    null distribution of a test statistic is estimated by randomly permuting the observations.


    Permutation tests are highly attractive because they make no assumptions other
    than that the observations are independent and identically distributed under the
    null hypothesis.


    +   1. Compute a observed statistic t_obs on the data.

    +   2. Use randomization to compute the distribution of t under the null hypothesis:
    Perform N random permutation of the data. For each sample of permuted data, i
    the data compute the statistic t_i. This procedure provides the distribution of
    t under the null hypothesis H0: P(t|H0)

    +   3. Compute the p-value = P(t > t_obs | H0) | {t_i > t_obs}, where t_i''s include
    t_obs.




