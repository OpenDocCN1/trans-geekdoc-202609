    # Statistics and Machine Learning in Python, Release 0.2


    +   • Divisive: A top-down strategy, where all observations start out in the same
    cluster, and then the clusters are split recursively downwards in the hierarchy.


    In order to decide which clusters to merge or to split, a measure of dissimilarity
    between clusters is introduced. More specific, this comprise a distance measure
    and a linkage criterion. The distance measure is just what it sounds like, and
    the linkage criterion is essentially a function of the distances between points,
    for instance the minimum distance between points in two clusters, the maximum
    distance between points in two clusters, the average distance between points in
    two clusters, etc. One particular linkage criterion, the Ward criterion, will
    be discussed next.




    Ward clustering belongs to the family of agglomerative hierarchical clustering
    algorithms. This means that they are based on a “bottoms up” approach: each sample
    starts in its own cluster, and pairs of clusters are merged as one moves up the
    hierarchy.


    In Ward clustering, the criterion for choosing the pair of clusters to merge at
    each step is the minimum variance criterion. Ward''s minimum variance criterion
    minimizes the total within-cluster variance by each merge. To implement this method,
    at each step: find the pair of clusters that leads to minimum increase in total
    within-cluster variance after merging. This increase is a weighted squared distance
    between cluster centers.


    The main advantage of agglomerative hierarchical clustering over K-means clustering
    is that you can benefit from known neighborhood information, for example, neighboring
    pixels in an image.


    ```

