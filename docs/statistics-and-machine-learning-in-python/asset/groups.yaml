    \ of several groups are equal, and therefore generalizes the t-test to more than\
    \ two groups. ANOVAs are useful for comparing (testing) three or more means (groups\
    \ or variables) for statistical significance. It is conceptually similar to multiple\
    \ two-sample t-tests, but is less conservative.\n\nHere we will consider one-way\
    \ ANOVA with one independent variable, ie one-way anova.\n\n### 1. Model the data\n\
    \nA company has applied three marketing strategies to three samples of customers\
    \ in order to increase their business volume. The marketing is asking whether\
    \ the strategies led to different increases of business volume. Let y1, y2 and\
    \ y3 be the three samples of business volume increase.\n\nHere we assume that\
    \ the three populations were sampled from three random variables that are normally\
    \ distributed. I.e., Y1 ~ N(μ1, σ1), Y2 ~ N(μ2, σ2) and Y3 ~ N(μ3, σ3).\n\n###\
    \ 2. Fit: estimate the model parameters\n\nEstimate means and variances: ȳi, σi,\
    \ ∀i ∈ {1, 2, 3}.\n\n### 3. F-test\n\nSource: https://en.wikipedia.org/wiki/F-test\n\
    \nThe ANOVA F-test can be used to assess whether any of the strategies is on average\
    \ superior, or inferior, to the others versus the null hypothesis that all four\
    \ strategies yield the same mean response (increase of business volume). This\
    \ is an example of an “omnibus” test, meaning that a single test is performed\
    \ to detect any of several possible differences. Alternatively, we could carry\
    \ out pair-wise tests among the strategies. The advantage of the ANOVA F-test\
    \ is that we do not need to pre-specify which strategies are to be compared, and\
    \ we do not need to adjust for making multiple comparisons. The disadvantage of\
    \ the ANOVA F-test is that if we reject the null hypothesis, we do not know which\
    \ strategies can be said to be significantly different from the others.\n\nThe\
    \ formula for the one-way ANOVA F-test statistic is\n\nF = explained variance\
    \ / unexplained variance\n\nor\n\n$F = \\frac{\\text{between-group variability}}{\\\
    text{within-group variability}}.$\n\nThe “explained variance”, or “between-group\
    \ variability” is\n\n$\\sum_{i} n_{i}(\\bar{Y}_{i.} - \\bar{Y})^{2}/(K - 1),$\n\
    \nwhere $\\bar{Y}_{i.}$ denotes the sample mean in the $i$th group, $n_{i}$ is\
    \ the number of observations in the $i$th group, $\\bar{Y}$ denotes the overall\
    \ mean of the data, and $K$ denotes the number of groups.\n\nThe “unexplained\
    \ variance”, or “within-group variability” is\n\n$\\sum_{ij}(Y_{ij} - \\bar{Y}_{i.})^{2}/(N\
    \ - K),$\n\nwhere $Y_{ij}$ is the $j$th observation in the $i$th out of $K$ groups\
    \ and $N$ is the overall sample size. This $F$-statistic follows the $F$-distribution\
    \ with $K - 1$ and $N - K$ degrees of freedom under the null hypothesis. The statistic\
    \ will be large if the between-group variability is large relative to the within-group\
    \ variability, which is unlikely to happen if the population means of the groups\
    \ all have the same value.\n\nNote that when there are only two groups for the\
