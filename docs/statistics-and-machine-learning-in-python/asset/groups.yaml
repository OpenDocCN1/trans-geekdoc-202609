    ## 7.5 Non-parametric test of pairwise associations


    ### 7.5.1 Spearman rank-order correlation (quantitative ~ quantitative)


    The Spearman correlation is a non-parametric measure of the monotonicity of the
    relationship between two datasets.


    When to use it? Observe the data distribution:

    - presence of outliers

    - the distribution of the residuals is not Gaussian.


    Like other correlation coefficients, this one varies between -1 and +1 with 0
    implying no correlation. Correlations of -1 or +1 imply an exact monotonic relationship.
    Positive correlations imply that as x increases, so does y. Negative correlations
    imply that as x increases, y decreases.


    ```

    import numpy as np

    import scipy.stats as stats

    import matplotlib.pyplot as plt


    x = np.array([44.4, 45.9, 41.9, 53.3, 44.7, 44.1, 50.7, 45.2, 46, 47, 48, 60.1])

    y = np.array([2.6, 3.1, 2.5, 5.0, 3.6, 4.0, 5.2, 2.8, 4, 4.1, 4.5, 3.8])


    plt.plot(x, y, "bo")


    # Non-Parametric Spearman

    cor, pval = stats.spearmanr(x, y)

    print("Non-Parametric Spearman cor test, cor: %.4f, pval: %.4f" % (cor, pval))


    # Parametric Pearson cor test

    cor, pval = stats.pearsonr(x, y)

    print("Parametric Pearson cor test: cor: %.4f, pval: %.4f" % (cor, pval))

    ```


    Non-Parametric Spearman cor test, cor: 0.7110, pval: 0.0095

    Parametric Pearson cor test: cor: 0.5263, pval: 0.0788


    ![](img/c2ad4b400bf63af9804b2d44510f76a6_94_0.png)


    ### 7.5.2 Wilcoxon signed-rank test (quantitative ~ cte)


    Source: https://en.wikipedia.org/wiki/Wilcoxon_signed-rank_test


    The Wilcoxon signed-rank test is a non-parametric statistical hypothesis test
    used when comparing two related samples, matched samples, or repeated measurements
    on a single sample to assess whether their population mean ranks differ (i.e.
    it is a paired difference test). It is equivalent to one-sample test of the difference
    of paired samples.


    It can be used as an alternative to the paired Student’s t-test, t-test for matched
    pairs, or the t-test for dependent samples when the population cannot be assumed
    to be normally distributed.


    When to use it? Observe the data distribution:

    - presence of outliers

    - the distribution of the residuals is not Gaussian


    It has a lower sensitivity compared to t-test. May be problematic to use when
    the sample size is small.


    Null hypothesis H0: difference between the pairs follows a symmetric distribution
    around zero.


    ```

    import scipy.stats as stats

    n = 20

    # Business Volume time 0

    bv0 = np.random.normal(loc=3, scale=.1, size=n)

    # Business Volume time 1

    bv1 = bv0 + 0.1 + np.random.normal(loc=0, scale=.1, size=n)


    # create an outlier

    bv1[0] -= 10


    # Paired t-test

    print(stats.ttest_rel(bv0, bv1))


    # Wilcoxon

    print(stats.wilcoxon(bv0, bv1))

    ```


