    # 7.2.2 The Chi-Square distribution


    The chi-square or $\chi^2_n$ distribution with $n$ degrees of freedom (df) is
    the distribution of a sum of the squares of $n$ independent standard normal random
    variables $\mathcal{N}(0,1)$. Let $X \sim \mathcal{N}(\mu, \sigma^2)$, then, $Z
    = (X - \mu)/\sigma \sim \mathcal{N}(0,1)$, then:


