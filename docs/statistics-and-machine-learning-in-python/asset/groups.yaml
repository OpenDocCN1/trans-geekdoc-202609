  mdcn: "\n- 未解释方差：\\(\\frac{SS_{\\text{res}}}{\\sigma^2} \\sim \\chi^2_{n-2}\\)\n\
    - 解释方差：\\(\\frac{SS_{\\text{reg}}}{\\sigma^2} \\sim \\chi^2_1\\)。单一自由度来自 \\(\\\
    frac{SS_{\\text{tot}}}{\\sigma^2} (\\sim \\chi^2_{n-1})\\) 与 \\(\\frac{SS_{\\\
    text{res}}}{\\sigma^2} (\\sim \\chi^2_{n-2})\\) 之间的差值，即 \\((n-1) - (n-2)\\) 自由度。\n\
    \n两个方差比率的 Fisher 统计量：\n\n\\[\nF = \\frac{\\text{Explained variance}}{\\text{Unexplained\
    \ variance}} = \\frac{SS_{\\text{reg}}/1}{SS_{\\text{res}}/(n-2)} \\sim F(1, n-2)\n\
    \\]\n\n使用 \\(F\\) 分布，计算在 \\(H_0\\) 下观察到大于 \\(F\\) 的值的概率，即 \\(P(x > F \\mid H_0)\\\
    )，即给定 \\(F\\) 分布在 \\(x\\) 处的生存函数（\\(1 - \\text{CDF}\\)）。\n\n## 7.6.2 多元回归\n\n\
    ### 理论\n\n多元线性回归是最基本的监督学习算法。\n\n给定：一组训练数据 \\(\\{x_1, \\dots, x_N\\}\\) 与对应的目标\
    \ \\(\\{y_1, \\dots, y_N\\}\\)。\n\n在线性回归中，我们假设生成数据的模型仅涉及输入变量的线性组合，即\n\n\\[\ny(x_i,\
    \ \\beta) = \\beta_0 + \\beta_1 x_i^1 + \\dots + \\beta_P x_i^P,\n\\]\n\n或，简化为\n\
    \n\\[\ny(x_i, \\beta) = \\beta_0 + \\sum_{j=1}^{P} \\beta_j x_i^j.\n\\]\n\n通过为每个样本扩展截距，\\\
    (x_i := [1, x_i] \\in \\mathbb{R}^{P+1}\\) 允许我们使用基于线性代数的更一般记号并将其写成简单的点积：\n\n\\\
    [\ny(x_i, \\beta) = x_i^T \\beta,\n\\]\n\n其中 \\(\\beta \\in \\mathbb{R}^{P+1}\\\
    ) 是定义模型 \\(P+1\\) 个参数的权重向量。从现在起我们有 \\(P\\) 个回归量 + 截距。\n\n最小化均方误差（MSE）损失：\n\n\\\
    [\nMSE(\\beta) = \\frac{1}{N} \\sum_{i=1}^N (y_i - y(x_i, \\beta))^2 = \\frac{1}{N}\
    \ \\sum_{i=1}^N (y_i - x_i^T \\beta)^2\n\\]\n\n设 \\(X = [x_1^T, \\dots, x_N^T]\\\
    ) 为 \\(N \\times (P+1)\\) 矩阵，包含 \\(N\\) 个样本的 \\(P\\) 个输入特征并带有一列全为 1，且设 \\(y =\
    \ [y_1, \\dots, y_N]\\) 为 \\(N\\) 个目标的向量。那么，利用线性代数，均方误差（MSE）损失可以重写为：\n\n\\[\n\
    MSE(\\beta) = \\frac{1}{N} \\|y - X\\beta\\|_2^2.\n\\]\n\n使 MSE 最小的 \\(\\beta\\\
    ) 可以通过以下方式求得：\n\n\\[\n\\begin{aligned}\n\\nabla_\\beta \\left( \\frac{1}{N} \\\
    |y - X\\beta\\|_2^2 \\right) &= 0 \\tag{7.6}\\\\\n\\frac{1}{N} \\nabla_\\beta\
    \ (y - X\\beta)^T (y - X\\beta) &= 0 \\tag{7.7}\\\\\n\\frac{1}{N} \\nabla_\\beta\
    \ (y^T y - 2\\beta^T X^T y + \\beta^T X^T X \\beta) &= 0 \\tag{7.8}\\\\\n-2 X^T\
    \ y + 2 X^T X \\beta &= 0 \\tag{7.9}\\\\\nX^T X \\beta &= X^T y \\tag{7.10}\\\\\
    \n\\beta &= (X^T X)^{-1} X^T y, \\tag{7.11}\n\\end{aligned}\n\\]\n\n其中 \\((X^T\
    \ X)^{-1} X^T\\) 是 \\(X\\) 的伪逆。\n\n### 使用 NumPy 拟合\n\n```python\nimport numpy\
    \ as np\nfrom scipy import linalg\nnp.random.seed(seed=42)  # make the example\
    \ reproducible\n\n# Dataset\nN, P = 50, 4\nX = np.random.normal(size=N * P).reshape((N,\
    \ P))\n# Our model needs an intercept so we add a column of 1s:\nX[:, 0] = 1\n\
    print(X[:5, :])\n\nbetastar = np.array([10, 1., .5, 0.1])\ne = np.random.normal(size=N)\n\
    y = np.dot(X, betastar) + e\n\n# Estimate the parameters\nXpinv = linalg.pinv2(X)\n\
    betahat = np.dot(Xpinv, y)\nprint(\"Estimated beta:\\n\", betahat)\n```\n\n```text\n\
