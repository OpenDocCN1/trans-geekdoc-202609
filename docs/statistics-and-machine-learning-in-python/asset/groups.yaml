    \ |  |  |  |  |  |  | X |\n\n## 机器学习简介\n\n### 2.1 数据科学中的机器学习\n\n![](img/c2ad4b400bf63af9804b2d44510f76a6_12_0.png)\n\
    \n机器学习涵盖两种主要的数据分析类型：\n\n1. 探索性分析：无监督学习。发现数据内部的结构。例：公司年限（年）和薪水相关。\n\n2. 预测性分析：监督学习。这有时被描述为“从过去学习以预测未来”。场景：一家公司希望在一批潜在客户中检测出潜在的未来客户。回顾性数据分析：我们遍历由之前潜在公司构成的数据，以及它们的特征（规模、领域、位置等……）。其中一些公司成为客户，其他公司没有。问题是，我们能否根据先前的观察，基于它们的特征预测哪些新公司更有可能成为客户？在这个例子中，训练数据由一组\
    \ n 个训练样本组成。每个样本 x_i 是一个 p 个输入特征（公司特征）的向量和一个目标特征（y_i ∈ {Yes, No}）（它们是否成为客户）。\n\
    \n![](img/c2ad4b400bf63af9804b2d44510f76a6_13_0.png)\n\n### 2.2 IT/计算机科学工具\n\n\
    - 高性能计算（HPC）\n- 数据流、数据库、文件 I/O 等。\n- Python：编程语言。\n- Numpy：Python 库，特别适用于处理原始数值数据（矩阵、数学运算）。\n\
    - Pandas：输入/输出，操作结构化数据（表格）。\n\n### 2.3 统计学和应用数学\n\n- 线性模型。\n- 非参数统计。\n- 线性代数：矩阵运算、求逆、特征值。\n\
    \n### 2.4 数据分析方法论\n\n1. 将客户需求形式化为学习问题：\n   - 目标变量：监督问题。\n     - 目标是定性的：分类。\n \
    \    - 目标是定量的：回归。\n   - 无目标变量：无监督问题\n     - 高维样本的可视化：PCA、流形学习等。\n     - 寻找样本组（隐藏结构）：聚类。\n\
    2. 询问数据集的问题\n   - 样本数量\n   - 变量数量，每个变量的类型。\n3. 定义样本\n\n## Python 语言\n\n来源 Kevin\
    \ Markham https://github.com/justmarkham/python-reference\n\n### 3.1 导入库\n\n```\n\
    # 'generic import' of math module\nimport math\nmath.sqrt(25)\n\n# import a function\n\
    from math import sqrt\nsqrt(25)    # no longer have to reference the module\n\n\
    # import multiple functions at once\nfrom math import cos, floor\n\n# import all\
    \ functions in a module (generally discouraged)\n# from os import *\n\n# define\
    \ an alias\nimport numpy as np\n\n# show all functions in math module\ncontent\
    \ = dir(math)\n```\n\n### 3.2 基本操作\n\n```\n# Numbers\n10 + 4      # add (returns\
    \ 14)\n10 - 4      # subtract (returns 6)\n10 * 4      # multiply (returns 40)\n\
    10 ** 4     # exponent (returns 10000)\n10 / 4      # divide (returns 2 because\
    \ both types are 'int')\n10 / float(4)  # divide (returns 2.5)\n5 % 4       #\
    \ modulo (returns 1) - also known as the remainder\n\n10 / 4      # true division\
    \ (returns 2.5)\n10 // 4     # floor division (returns 2)\n```\n\n```\n# Boolean\
    \ operations\n# comparisons (these return True)\n5 > 3\n5 >= 3\n5 != 3\n5 == 5\n\
