    # 7.5 Non-parametric test of pairwise associations


    # 7.5.1 Spearman rank-order correlation (quantitative ~ quantitative)


    The Spearman correlation is a non-parametric measure of the monotonicity of the
    relationship between two datasets.


    When to use it? Observe the data distribution: - presence of outliers - the distribution
    of the residuals is not Gaussian.


    Like other correlation coefficients, this one varies between -1 and +1 with 0
    implying no correlation. Correlations of -1 or +1 imply an exact monotonic relationship.
    Positive correlations imply that as x increases, so does y. Negative correlations
    imply that as x increases, y decreases.


    ```

    import numpy as np

    import scipy.stats as stats

    import matplotlib.pyplot as plt


    x = np.array([44.4, 45.9, 41.9, 53.3, 44.7, 44.1, 50.7, 45.2, 46, 47, 48, 60.1])

    y = np.array([2.6, 3.1, 2.5, 5.0, 3.6, 4.0, 5.2, 2.8, 4, 4.1, 4.5, 3.8])


    plt.plot(x, y, "bo")


    # Non-Parametric Spearman

    cor, pval = stats.spearmanr(x, y)

    print("Non-Parametric Spearman cor test, cor: %.4f, pval: %.4f" % (cor, pval))


    # "Parametric Pearson cor test

    cor, pval = stats.pearsonr(x, y)

    print("Parametric Pearson cor test: cor: %.4f, pval: %.4f" % (cor, pval))

    ```


    Non-Parametric Spearman cor test, cor: 0.7110, pval: 0.0095

