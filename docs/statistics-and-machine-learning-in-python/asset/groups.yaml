    the **binomial distribution** of parameters N=100, **P=0.5**:


    Pr(X = k|H₀) = Pr(X = k|n = 100, p = 0.5) = (100 choose k) 0.5^k (1 - 0.5)^(100−k).


    P(X = k ≥ 60|H₀) = Σ_{k=60}^{100} (100 choose k) 0.5^k (1 - 0.5)^(100−k)

    = 1 - Σ_{k=1}^{60} (100 choose k) 0.5^k (1 - 0.5)^(100−k), the cumulative distribution
