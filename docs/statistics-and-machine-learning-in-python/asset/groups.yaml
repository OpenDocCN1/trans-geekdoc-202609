    # DIMENSION REDUCTION AND FEATURE EXTRACTION


    # 10.1 Introduction


    In machine learning and statistics, dimensionality reduction or dimension reduction
    is the process of reducing the number of features under consideration, and can
    be divided into feature selection (not addressed here) and feature extraction.


    Feature extraction starts from an initial set of measured data and builds derived
    values (features) intended to be informative and non-redundant, facilitating the
    subsequent learning and generalization steps, and in some cases leading to better
    human interpretations. Feature extraction is related to dimensionality reduction.


    The input matrix X, of dimension N × P, is


    $$\begin{bmatrix} x_{11} & \dots & x_{1P} \\ \vdots & X & \vdots \\ x_{N1} & \dots
    & x_{NP} \end{bmatrix}$$


    where the rows represent the samples and columns represent the variables.


    The goal is to learn a transformation that extracts a few relevant features. This
    is generally done by exploiting the covariance ΣXX between the input features.


    # 10.2 Singular value decomposition and matrix factorization


    # 10.2.1 Matrix factorization principles


    Decompose the data matrix X_{N×P} into a product of a mixing matrix U_{N×K} and
    a dictionary matrix V_{P×K}.


    $$X = U V^T$$


    If we consider only a subset of components K < rank(X) < min(P, N − 1), X is approximated
    by a matrix X̂:


    $$X ≈ \hat{X} = U V^T$$


    Each line of x_i is a linear combination (mixing u_i) of dictionary items V.


    N P-dimensional data points lie in a space whose dimension is less than N − 1
    (2 dots lie on a line, 3 on a plane, etc.).'
  - '[PAGE 147]


    ![](img/c2ad4b400bf63af9804b2d44510f76a6_147_0.png)


    Fig. 10.1: Matrix factorization


    # 10.2.2 Singular value decomposition (SVD) principles


    Singular-value decomposition (SVD) factorises the data matrix X_{N×P} into a product:


    X = U D V^T


    where


    [x11 x1P; X; xN1 xNP] = [u11 u1K; U; uN1 uNK] [d1 0; D; 0 dK] [v11 v1P; V^T; vK1
    vKP]


    # U: right-singular


    +   - V = [v1, ..., vK] is a P × K orthogonal matrix.

    +   - It is a dictionary of patterns to be combined (according to the mixing coefficients)
    to reconstruct the original samples.

    +   - V perfoms the initial rotations (projection) along the K = min(N, P) principal
    component directions, also called loadings.

    +   - Each vj performs the linear combination of the variables that has maximum
    sample variance, subject to being uncorrelated with the previous vj-1.


    # D: singular values


    +   - D is a K × K diagonal matrix made of the singular values of X with d1 ≥
    d2 ≥ ... ≥ dK ≥ 0.

    +   - D scale the projection along the coordinate axes by d1, d2, ..., dK.

    +   - Singular values are the square roots of the eigenvalues of X^T X.


    # V: left-singular vectors


    +   - U = [u1, ..., uK] is an N × K orthogonal matrix.'
  - '[PAGE 148]


    +   - Each row v_i provides the mixing coefficients of dictionary items to reconstruct
    the sample x_i

    +   - It may be understood as the coordinates on the new orthogonal basis (obtained
    after the initial rotation) called principal components in the PCA.


    # 10.2.3 SVD for variables transformation


    V transforms correlated variables (X) into a set of uncorrelated ones (UD) that
    better expose the various relationships among the original data items.


    X = UDV^T,  (10.1)

    XV = UDV^T V,  (10.2)

    XV = UDI,  (10.3)

    XV = UD  (10.4)


    At the same time, SVD is a method for identifying and ordering the dimensions
    along which data points exhibit the most variation.


    ```

    import numpy as np

    import scipy

    from sklearn.decomposition import PCA

    import matplotlib.pyplot as plt

    import seaborn as sns

    %matplotlib inline


    np.random.seed(42)


    # dataset

    n_samples = 100

    experience = np.random.normal(size=n_samples)

    salary = 1500 + experience + np.random.normal(size=n_samples, scale=.5)

    X = np.column_stack([experience, salary])


    # PCA using SVD

    X -= X.mean(axis=0)  # Centering is required

    U, s, Vh = scipy.linalg.svd(X, full_matrices=False)

    # U : Unitary matrix having left singular vectors as columns.

    #     Of shape (n_samples,n_samples) or (n_samples,n_comps), depending on

    #     full_matrices.

    #

    # s : The singular values, sorted in non-increasing order. Of shape (n_comps,),

    #     with n_comps = min(n_samples, n_features).

    #

    # Vh: Unitary matrix having right singular vectors as rows.

    #     Of shape (n_features, n_features) or (n_comps, n_features) depending

    #     on full_matrices.


    plt.figure(figsize=(9, 3))


    plt.subplot(131)

    plt.scatter(U[:, 0], U[:, 1], s=50)

    plt.axis(''equal'')

