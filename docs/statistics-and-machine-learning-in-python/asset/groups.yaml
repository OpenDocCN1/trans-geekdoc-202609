    # 12.4 Ridge regression (ℓ₂-regularization)


    Overfitting generally leads to excessively complex weight vectors, accounting
    for noise or spurious correlations within predictors. To avoid this phenomenon
    the learning should constrain the solution in order to fit a global pattern. This
    constraint will reduce (bias) the capacity of the learning algorithm. Adding such
    a penalty will force the coefficients to be small, i.e. to shrink them toward
    zeros.


    Therefore the loss function ℒ(β) (generally the SSE) is combined with a penalty
    function Ω(β) leading to the general form:


    Penalized(β) = ℒ(β) + λΩ(β)


    The respective contribution of the loss and the penalty is controlled by the regularization
    parameter λ.


    Ridge regression impose a ℓ₂ penalty on the coefficients, i.e. it penalizes with
    the Euclidean norm of the coefficients while minimizing SSE. The objective function
    becomes:


    Ridge(β) = ||y − Xβ||₂² + λ||β||₂².


    The β that minimises F_Ridge(β) can be found by the following derivation:'
  - '[PAGE 180]


    ∇β Ridge(β) = 0  (12.6)

    ∇β((y − Xβ)^T(y − Xβ) + λβ^Tβ) = 0  (12.7)

    ∇β((y^T y − 2β^T X^T y + β^T X^T Xβ + λβ^T β)) = 0  (12.8)

    −2X^T y + 2X^T Xβ + 2λβ = 0  (12.9)

    −X^T y + (X^T X + λI)β = 0  (12.10)

    (X^T X + λI)β = X^T y  (12.11)

    β = (X^T X + λI)^{-1} X^T y  (12.12)


    +   - The solution adds a positive constant to the diagonal of X^T X before inversion.
    This makes the problem nonsingular, even if X^T X is not of full rank, and was
    the main motivation behind ridge regression.

    +   - Increasing λ shrinks the β coefficients toward 0.

    +   - This approach **penalizes** the objective function by the **Euclidian (:math:`ell_2`)
    norm** of the coefficients such that solutions with large coefficients become
    unattractive.


    The ridge penalty shrinks the coefficients toward zero. The figure illustrates:
    the OLS solution on the left. The ℓ1 and ℓ2 penalties in the middle pane. The
    penalized OLS in the right pane. The right pane shows how the penalties shrink
    the coefficients toward zero. The black points are the minimum found in each case,
    and the white points represents the true solution used to generate the data.


