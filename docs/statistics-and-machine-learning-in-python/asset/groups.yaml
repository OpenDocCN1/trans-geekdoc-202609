    mu}_1 - \\boldsymbol{\\mu}_0).$$\n\n### Demonstration\n\nDifferentiating $F_{\\\
    text{Fisher}}(w)$ with respect to $w$ gives\n\n$$\\nabla_{\\boldsymbol{w}} F_{\\\
