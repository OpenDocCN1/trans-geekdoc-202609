    mid k)p(k)}{p(x)}$  (11.2)\n$=\\frac{\\mathcal{N}(x\\mid \\mu_k,\\Sigma_k)p(k)}{\\\
    sum_{k=1}^{K}\\mathcal{N}(x\\mid \\mu_k,\\Sigma_k)p(k)}$  (11.3)\n\nSince the\
    \ class parameters, $p(k)$, $\\mu_k$ and $\\Sigma_k$, depend on the responsibilities\
    \ $p(k\\mid x)$ and the responsibilities depend on class parameters, we need a\
    \ two-step iterative algorithm: the expectation-maximization (EM) algorithm. We\
    \ discuss this algorithm next.\n\n### 11.3.1 The expectation-maximization (EM)\
    \ algorithm for Gaussian mixtures\nGiven a Gaussian mixture model, the goal is\
    \ to maximize the likelihood function with respect to the parameters (comprised\
