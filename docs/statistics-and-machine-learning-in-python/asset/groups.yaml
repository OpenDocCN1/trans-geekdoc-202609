    mu}_0)^T \\boldsymbol{w}}{\\boldsymbol{w}^T \\boldsymbol{X}_c^T \\boldsymbol{X}_c\
    \ \\boldsymbol{w}}$ (13.6)\n\n$= \\frac{\\boldsymbol{w}^T \\boldsymbol{S}_B \\\
    boldsymbol{w}}{\\boldsymbol{w}^T \\boldsymbol{S}_W \\boldsymbol{w}}.$ (13.7)\n\
    \n## 13.1.1 The Fisher most discriminant projection\n\nIn the two-class case,\
    \ the maximum separation occurs by a projection on the $(\\boldsymbol{\\mu}_1\
    \ - \\boldsymbol{\\mu}_0)$ using the Mahalanobis metric $\\boldsymbol{S}_W^{-1}$,\
