    \ standard deviations away x is from the mean. This distance is zero if x is at\
    \ the mean, and grows as x moves away from the mean: along each principal component\
    \ axis, it measures the number of standard deviations from x to the mean of the\
    \ distribution.\n\n## 8.7 Multivariate normal distribution\n\nThe distribution,\
    \ or probability density function (PDF) (sometimes just density), of a continuous\
