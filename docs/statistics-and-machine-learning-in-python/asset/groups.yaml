    # 7.4 Testing pairwise associations


    Univariate statistical analysis: explore association between pairs of variables.


    +   - In statistics, a categorical variable or factor is a variable that can take
    on one of a limited, and usually fixed, number of possible values, thus assigning
    each individual to a particular group or “category”. The levels are the possibles
    values of the variable. Number of levels = 2: binomial; Number of levels > 2:
