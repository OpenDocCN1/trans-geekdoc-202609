    # 7.4.3 ANOVA F-test (quantitative ~ categorical (>2 levels))


    Analysis of variance (ANOVA) provides a statistical test of whether or not the
    means of several groups are equal, and therefore generalizes the t-test to more
    than two groups. ANOVAs are useful for comparing (testing) three or more means
    (groups or variables) for statistical significance. It is conceptually similar
    to multiple two-sample t-tests, but is less conservative.


    Here we will consider one-way ANOVA with one independent variable, ie one-way
    anova.


    # 1. Model the data


    A company has applied three marketing strategies to three samples of customers
    in order increase their business volume. The marketing is asking whether the strategies
    led to different increases of business volume. Let y1, y2 and y3 be the three
    samples of business volume increase.


    Here we assume that the three populations were sampled from three random variables
    that are normally distributed. I.e., Y1 ~ N(μ1, σ1), Y2 ~ N(μ2, σ2) and Y3 ~ N(μ3,
    σ3).


    # 2. Fit: estimate the model parameters


    Estimate means and variances: ȳi, σi, ∀i ∈ {1, 2, 3}.


    # 3. F-test


    Source: https://en.wikipedia.org/wiki/F-test


    The ANOVA F-test can be used to assess whether any of the strategies is on average
    superior, or inferior, to the others versus the null hypothesis that all four
    strategies yield the same mean response (increase of business volume). This is
    an example of an “omnibus” test, meaning that a single test is performed to detect
    any of several possible differences. Alternatively, we could carry out pair-wise
    tests among the strategies. The advantage of the ANOVA F-test is that we do not
    need to pre-specify which strategies are to be compared, and we do not need to
    adjust for making multiple comparisons. The disadvantage of the ANOVA F-test is
    that if we reject the null hypothesis, we do not know which strategies can be
    said to be significantly different from the others.


    The formula for the one-way ANOVA F-test statistic is


    F = explained variance / unexplained variance'
