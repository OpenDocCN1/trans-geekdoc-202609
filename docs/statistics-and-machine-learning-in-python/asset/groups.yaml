    # 14.2 Random forest


    A random forest is a meta estimator that fits a number of **decision tree learners**
    on various sub-samples of the dataset and use averaging to improve the predictive
    accuracy and control over-fitting.


    # 14.2.1 Decision tree learner


    A tree can be “learned” by splitting the training dataset into subsets based on
    an features value test.


    Each internal node represents a “test” on an feature resulting on the split of
    the current sample. At each step the algorithm selects the feature and a cutoff
    value that maximises a given metric. Different metrics exist for regression tree
    (target is continuous) or classification tree (the target is qualitative).


    This process is repeated on each derived subset in a recursive manner called recursive
    partitioning. The recursion is completed when the subset at a node has all the
    same value of the target variable, or when splitting no longer adds value to the
    predictions. This general principle is implemented by many recursive partitioning
    tree algorithms.


    Decision trees are simple to understand and interpret however they tend to overfit
    the data. However decision trees tend to overfit the training set. Leo Breiman
    propose random forest to deal with this issue.


    ```

    from sklearn.ensemble import RandomForestClassifier


    forest = RandomForestClassifier(n_estimators = 100)

    forest.fit(X, y)


    print("#Errors: %i" % np.sum(y != forest.predict(X)))

