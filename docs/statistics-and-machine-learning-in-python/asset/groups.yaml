    # 9.11 Time Series Forecasting with Python using Autoregressive Moving Average
    (ARMA) models


    Source:


    +   - https://www.packtpub.com/mapt/book/big_data_and_business_intelligence/9781783553358/7/ch07lvl1sec77/arma-models

    +   - http://en.wikipedia.org/wiki/Autoregressive%E2%80%93moving-average_model

    +   - ARIMA: https://www.analyticsvidhya.com/blog/2016/02/time-series-forecasting-codes-python/


    ARMA models are often used to forecast a time series. These models combine autoregressive
    and moving average models. In moving average models, we assume that a variable
    is the sum of the mean of the time series and a linear combination of noise components.


    The autoregressive and moving average models can have different orders. In general,
    we can define an ARMA model with p autoregressive terms and q moving average terms
    as follows:


    x_t = sum_{i}^{p} a_i x_{t-i} + sum_{i}^{q} b_i ε_{t-i} + ε_t


    # 9.11.1 Choosing p and q


    Plot the partial autocorrelation functions for an estimate of p, and likewise
    using the autocorrelation functions for an estimate of q.


    Partial Autocorrelation Function (PACF): This measures the correlation between
    the TS with a lagged version of itself but after eliminating the variations already
    explained by the intervening comparisons. Eg at lag 5, it will check the correlation
    but remove the effects already explained by lags 1 to 4.


    ```

    from statsmodels.tsa.stattools import acf, pacf


    x = df["gym"].astype(float)


    x_diff = x.diff().dropna() # first item is NA

    # ACF and PACF plots:


    lag_acf = acf(x_diff, nlags=20)

    lag_pacf = pacf(x_diff, nlags=20, method=''ols'')


    #Plot ACF:

    plt.subplot(121)

    plt.plot(lag_acf)

    plt.axhline(y=0,linestyle=''--'',color=''gray'')

    plt.axhline(y=-1.96/np.sqrt(len(x_diff)),linestyle=''--'',color=''gray'')

    plt.axhline(y=1.96/np.sqrt(len(x_diff)),linestyle=''--'',color=''gray'')

    plt.title(''Autocorrelation Function  (q=1)'')


    #Plot PACF:

    plt.subplot(122)

    plt.plot(lag_pacf)

    plt.axhline(y=0,linestyle=''--'',color=''gray'')

    ```'
