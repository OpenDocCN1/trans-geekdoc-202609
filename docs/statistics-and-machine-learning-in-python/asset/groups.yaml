    \ 的情况下，提出一种解决方案。\n\n## 13.4 过拟合\n\nVC 维（Vapnik–Chervonenkis 维数的简称）是衡量统计分类算法**容量**（复杂度、表达能力、丰富度或灵活性）的一种度量，定义为该算法能够打散的最大点集的基数。\n\
