    # 7.2 Main distributions


    # 7.2.1 Normal distribution


    The normal distribution, noted $\mathcal{N}(\mu, \sigma)$ with parameters: $\mu$
    mean (location) and $\sigma > 0$ std-dev. Estimators: $\bar{x}$ and $\sigma_x$.


    The normal distribution, noted $\mathcal{N}$, is useful because of the central
    limit theorem (CLT) which states that: given certain conditions, the arithmetic
    mean of a sufficiently large number of iterates of independent random variables,
    each with a well-defined expected value and well-defined variance, will be approximately
    normally distributed, regardless of the underlying distribution.


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    from scipy.stats import norm

    %matplotlib inline


    mu = 0 # mean

    variance = 2 #variance

    sigma = np.sqrt(variance) #standard deviation\n",

    x = np.linspace(mu-3*variance,mu+3*variance, 100)

    plt.plot(x, norm.pdf(x, mu, sigma))

    ```


