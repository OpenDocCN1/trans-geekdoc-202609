    # LINEAR METHODS FOR REGRESSION


    # 12.1 Ordinary least squares


    Linear regression models the **output**, or **target** variable $y \in \mathbb{R}$
    as a linear combination of the $(P-1)$-dimensional input $x \in \mathbb{R}^{(P-1)}$.
    Let $\mathbf{X}$ be the $N \times P$ matrix with each row an input vector (with
    a 1 in the first position), and similarly let $y$ be the $N$-dimensional vector
    of outputs in the **training set**, the linear model will predict the $\mathbf{y}$
    given $\mathbf{X}$ using the **parameter vector**, or **weight vector** $\beta
    \in \mathbb{R}^P$ according to


    $$\mathbf{y} = \mathbf{X}\beta + \varepsilon,$$


    where $\varepsilon \in \mathbb{R}^N$ are the **residuals**, or the errors of the
    prediction. The $\beta$ is found by minimizing an **objective function**, which
    is the **loss function**, $\mathcal{L}(\beta)$, i.e. the error measured on the
    data. This error is the **sum of squared errors (SSE)** loss. Minimizing the SSE
    is the Ordinary Least Square OLS regression as objective function.


    $$\begin{aligned}

    \text{OLS}(\beta) &= \mathcal{L}(\beta) && (12.1)\\

    &= \text{SSE}(\beta) && (12.2)\\

    &= \sum_{i}^{N}(y_i - \mathbf{x}_i^T \beta)^2 && (12.3)\\

    &= (\mathbf{y} - \mathbf{X}\beta)^T (\mathbf{y} - \mathbf{X}\beta) && (12.4)\\

    &= \|\mathbf{y} - \mathbf{X}\beta\|_2^2, && (12.5)

    \end{aligned}$$


    which is a simple **ordinary least squares (OLS)** minimization.


    # 12.2 Linear regression with scikit-learn


    Scikit learn offer many models for supervised learning, and they all follow the
    same application programming interface (API), namely:


    ```

    model = Estimator()

    model.fit(X, y)

    predictions = model.predict(X)

    ```'
