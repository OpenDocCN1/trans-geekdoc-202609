    # 15.1 Left out samples validation


    The training error can be easily calculated by applying the statistical learning
    method to the observations used in its training. But because of overfitting, the
    training error rate can dramatically underestimate the error that would be obtained
    on new samples.


    The test error is the average error that results from a learning method to predict
    the response on a new samples that is, on samples that were not used in training
    the method. Given a data set, the use of a particular learning method is warranted
    if it results in a low test error. The test error can be easily calculated if
    a designated test set is available. Unfortunately, this is usually not the case.


    Thus the original dataset is generally split in a training and a test (or validation)
    data sets. Large training set (80%) small test set (20%) might provide a poor
    estimation of the predictive performances. On the contrary, large test set and
    small training set might produce a poorly estimated learner. This is why, on situation
    where we cannot afford such split, it recommended to use cross-validation scheme
    to estimate the predictive power of a learning algorithm.


    # 15.2 Cross-Validation (CV)


    Cross-Validation scheme randomly divides the set of observations into K groups,
    or folds, of approximately equal size. The first fold is treated as a validation
    set, and the method f() is fitted on the remaining union of K − 1 folds: (f(X−K,y−K)).


    The measure of performance (the score function S), either an error measure or
    an correct prediction measure is an average of a loss error or correct prediction
    measure, noted L, between a true target value and the predicted target value.
    The score function is evaluated of the on the observations in the held-out fold.
    For each sample i we consider the model estimated f(X−k(i),y−k(i)) on the data
    set without the group k that contains i noted −k(i). This procedure is repeated
    K times; each time, a different group of observations is treated as a test set.
    Then we compare the predicted value (f−k(i)(x−k(i))=ŷi) with true value yi using
    a Error or Loss function L(y,ŷ). We can the compute a score S averaging over
    all samples:


    ```

    S(f) = 1/N ∑_i L(y_i, f_{-k(i)}(x_{-k(i)}, y_{-k(i)}))

    ```


