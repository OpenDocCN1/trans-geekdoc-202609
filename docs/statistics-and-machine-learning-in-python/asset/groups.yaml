    ```\n\n```\n#Errors: 0\n```\n\n## 15.1 留出样本验证\n\n训练误差可以通过将统计学习方法应用于其训练中使用的观测值来轻松计算。但由于过拟合，训练误差率可能会严重低估在新样本上获得的误差。\n\
    \n测试误差是学习方法预测新样本响应时产生的平均误差，即在训练该方法时未使用过的样本。给定一个数据集，如果某种学习方法导致较低的测试误差，则使用该方法是有保证的。如果有指定的测试集，则可以轻松计算测试误差。不幸的是，这通常不是这种情况。\n\
    \n因此，原始数据集通常分为训练集和测试集（或验证集）。大型训练集（80%）和小测试集（20%）可能会提供预测性能的较差估计。相反，大型测试集和小训练集可能会产生估计不佳的学习器。这就是为什么在我们无法承受这种分割的情况下，建议使用交叉验证方案来估计学习算法的预测能力。\n\
    \n## 15.2 交叉验证 (CV)\n\n交叉验证方案随机将观测集合分为 K 个组或折叠，大小大致相等。第一个折叠被视为验证集，并且方法 f() 在剩余的\
    \ K − 1 个折叠的并集上拟合：f(X_{−k}, y_{−k})。性能度量（评分函数 S），是误差度量或正确预测度量，是真实目标值与预测目标值之间损失（误差或正确预测度量）\
    \ noted L 的平均值。评分函数在保留的折叠中的观测值上进行评估。对于每个样本 i，我们考虑在不包含 i 的组 k 的数据集上估计的模型 f(X_{−k(i)},\
    \ y_{−k(i)})，表示为 −k(i)。该过程重复 K 次；每次都有不同的观测组被视为测试集。然后我们使用误差或损失函数 L(y, ŷ) 将预测值（f_{−k(i)}(x_{−k(i)})\
    \ = ŷ_i）与真实值 y_i 进行比较。然后我们可以计算在所有样本上平均的分数 S：\n\n$$\nS(f) = \\frac{1}{N} \\sum_i\
    \ L\\left(y_i, f_{-k(i)}(x_{-k(i)}, y_{-k(i)})\\right)\n$$\n\n同样，我们可以在每个折叠 k 上计算分数\
    \ S 并在折叠之间取平均值：\n\n$$\n\\mathcal{S}(f) = \\frac{1}{K} \\sum_{k=1}^{K} \\mathcal{S}_{k}(f).\n\
    $$\n\n$$\n\\mathcal{S}(f) = \\frac{1}{K} \\sum_{k=1}^{K} \\frac{1}{N_{k}} \\sum_{i\
