    \ to find *K*-dimensional projections of the *N* points **x**₁,…, **x**_N ∈ ℝ^K,\
    \ concatenated in an **X**_{N×K} matrix, so that *d_ij* ≈ ||**x**_i − **x**_j||\
    \ are as close as possible. This can be obtained by the minimization of a loss\
    \ function called the **stress function**\n\nstress(**X**) = Σ_{i≠j} (d_{ij} −\
