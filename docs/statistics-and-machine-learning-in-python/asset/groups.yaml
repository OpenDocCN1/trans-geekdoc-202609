    # UNIVARIATE STATISTICS


    Basics univariate statistics are required to explore dataset:


    +   - Discover associations between a variable of interest and potential predictors.
    It is strongly recommended to start with simple univariate methods before moving
    to complex multivariate predictors.

    +   - Assess the prediction performances of machine learning predictors.

    +   - Most of the univariate statistics are based on the linear model which is
    one of the main model in machine learning.


    # 7.1 Estimators of the main statistical measures


    # 7.1.1 Mean


    Properties of the expected value operator E(·) of a random variable X


    E(X + c) = E(X) + c  (7.1)

    E(X + Y) = E(X) + E(Y)  (7.2)

    E(aX) = aE(X)  (7.3)


    The estimator \bar{x} on a sample of size n: x = x₁,...,xₙ is given by


    \bar{x} = \frac{1}{n} \sum_{i} x_{i}


    \bar{x} is itself a random variable with properties:


    +   - E(\bar{x}) = \bar{x},

    +   - Var(\bar{x}) = \frac{Var(X)}{n}.


    # 7.1.2 Variance


    Var(X) = E((X - E(X))²) = E(X²) - (E(X))²


    The estimator is


    \sigma_{x}^{2} = \frac{1}{n-1} \sum_{i} (x_{i} - \bar{x})^{2}'
  - '[PAGE 79]


    Note here the subtracted 1 degree of freedom (df) in the divisor. In standard
    statistical practice, df = 1 provides an unbiased estimator of the variance of
    a hypothetical infinite population. With df = 0 it instead provides a maximum
    likelihood estimate of the variance for normally distributed variables.


    # 7.1.3 Standard deviation


    $Std(X) = \sqrt{Var(X)}$


    The estimator is simply $\sigma_x = \sqrt{\sigma_x^2}$.


    # 7.1.4 Covariance


    $Cov(X, Y) = E((X - E(X))(Y - E(Y))) = E(XY) - E(X)E(Y)$.


    Properties:


    Cov(X, X) = Var(X)

    Cov(X, Y) = Cov(Y, X)

    Cov(cX, Y) = c Cov(X, Y)

    Cov(X + c, Y) = Cov(X, Y)


    The estimator with df = 1 is


    $\sigma_{xy} = \frac{1}{n - 1} \sum_{i} (x_i - \bar{x})(y_i - \bar{y})$


    # 7.1.5 Correlation


    $Cor(X, Y) = \frac{Cov(X, Y)}{Std(X)Std(Y)}$


    The estimator is


    $\rho_{xy} = \frac{\sigma_{xy}}{\sigma_x \sigma_y}$


    # 7.1.6 Standard Error (SE)


    The standard error (SE) is the standard deviation (of the sampling distribution)
    of a statistic:


    $SE(X) = \frac{Std(X)}{\sqrt{n}}$


    It is most commonly considered for the mean with the estimator $SE(\bar{x}) =
    \sigma_x / \sqrt{n}$.


