    # 15.6 Bootstrapping


    Bootstrapping is a random sampling with replacement strategy which provides an
    non-parametric method to assess the variability of performances scores such standard
    errors or confidence intervals.


    A great advantage of bootstrap is its simplicity. It is a straightforward way
    to derive estimates of standard errors and confidence intervals for complex estimators
    of complex parameters of the distribution, such as percentile points, proportions,
    odds ratio, and correlation coefficients.


    +   1. Perform B sampling, with replacement, of the dataset.

    +   2. For each sample i fit the model and compute the scores.

    +   3. Assess standard errors and confidence intervals of scores using the scores
    obtained on the B resampled dataset.


