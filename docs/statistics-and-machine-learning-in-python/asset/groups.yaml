    # 8.3 Covariance matrix


    +   - The covariance matrix Σ_XX is a **symmetric** positive semi-definite matrix
    whose element in the j, k position is the covariance between the j^th and k^th
    elements of a random vector i.e. the j^th and k^th columns of X.

    +   - The covariance matrix generalizes the notion of covariance to multiple dimensions.

    +   - The covariance matrix describe the shape of the sample distribution around
    the mean assuming an elliptical distribution:


    Σ_XX = E(X - E(X))^T E(X - E(X))


    whose estimator S_XX is a P × P matrix given by


    S_XX = 1/(N - 1) (X - 1 x̄^T)^T (X - 1 x̄^T).


    If we assume that X is centered, i.e. X is replaced by X - 1 x̄^T then the estimator
    is


    S_XX = 1/(N - 1) X^T X = 1/(N - 1) [x11 … xN1; x1j … xNj; …; x1P … xNP] [x11 …
    x1k x1P; …; …; xN1 … xNk xNP] = [s1 … s1k s1P; … s_jk …; … s_P]


    where


    s_jk = s_kj = 1/(N - 1) x_j^T x_k = 1/(N - 1) Σ_{i=1}^N x_{ij} x_{ik}


    is an estimator of the covariance between the j^th and k^th variables.


