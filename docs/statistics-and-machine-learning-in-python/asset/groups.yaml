    Fig. 7.3: Linear model


    Given n random samples (yᵢ, x₁ᵢ, …, xₚᵢ), i = 1, …, n, the linear regression models
    the relation between the observations yᵢ and the independent variables xᵢᵖ is
    formulated as


    yᵢ = β₀ + β₁x₁ᵢ + ⋯ + βₚxₚᵢ + εᵢ      i = 1, …, n


    +   - The β''s are the model parameters, ie, the regression coeficients.

    +   - β₀ is the intercept or the bias.

    +   - εᵢ are the residuals.

    +   - **An independent variable (IV)**. It is a variable that stands alone and
    isn''t changed by the other variables you are trying to measure. For example,
    someone''s age might be an independent variable. Other factors (such as what they
    eat, how much they go to school, how much television they watch) aren''t going
    to change a person''s age. In fact, when you are looking for some kind of relationship
    between variables you are trying to see if the independent variable causes some
    kind of change in the other variables, or dependent variables. In Machine Learning,
    these variables are also called the **predictors**.

    +   - A **dependent variable**. It is something that depends on other factors.
    For example, a test score could be a dependent variable because it could change
    depending on several factors such as how much you studied, how much sleep you
    got the night before you took the test, or even how hungry you were when you took
    it. Usually when you are looking for a relationship between two things you are
    trying to find out what makes the dependent variable change the way it does. In
    Machine Learning this variable is called a **target variable**.'
