    \ 0/1 响应 $y_i$ 对两个类别（$C_0$ 和 $C_1$）进行编码，算法会大大简化。实际上，由于 $p(C_0|w, x_i) = 1 - p(C_1|w,\
    \ x_i)$，对数似然可以重写为：\n\n$$\\log L(\\boldsymbol{w}) = \\sum_{i}^{N} \\{ y_i \\log\
    \ p(C_1|\\boldsymbol{w}, \\boldsymbol{x}_i) + (1 - y_i) \\log(1 - p(C_1|\\boldsymbol{w},\
    \ \\boldsymbol{x}_i)) \\} \\tag{13.8}$$\n\n$$\\log L(\\boldsymbol{w}) = \\sum_{i}^{N}\
    \ \\{ y_i \\boldsymbol{w} \\cdot \\boldsymbol{x}_i - \\log(1 + \\exp(\\boldsymbol{w}\
    \ \\cdot \\boldsymbol{x}_i)) \\} \\tag{13.9}$$\n\n(13.10)\n\n逻辑回归是一种**判别模型**，因为它只关注每个类别的后验概率\
    \ $p(C_k|x)$。它只需要估计 $w$ 向量的 $P$ 个权重。因此，在输入特征较多的情况下，它应该比 LDA 更受青睐。在小维度和平衡情况下，它会提供与\
    \ LDA 类似的预测。\n\n然而，不平衡的组大小无法显式控制。可以通过对输入样本进行重新加权来管理。\n\n```python\nfrom sklearn\
    \ import linear_model\nlogreg = linear_model.LogisticRegression(C=1e8, solver='lbfgs')\n\
    # This class implements regularized logistic regression. C is the Inverse of regularization\
    \ strength.\n# Large value => no regularization.\n\nlogreg.fit(X, y)\ny_pred_logreg\
    \ = logreg.predict(X)\n\nerrors = y_pred_logreg != y\nprint(\"Nb errors=%i, error\
    \ rate=%.2f\" % (errors.sum(), errors.sum() / len(y_pred_logreg)))\nprint(logreg.coef_)\n\
    ```\n\n```\nNb errors=10, error rate=0.05\n[[-5.1516729  5.57303883]]\n```\n\n\
