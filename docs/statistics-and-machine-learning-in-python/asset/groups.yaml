    \ = model.predict(X_train)\n\nprint(\"Train r2:%.2f\" % metrics.r2_score(y, y_train_pred))\n\
    print(\"Test  r2:%.2f\" % metrics.r2_score(y, y_test_pred))\n```\n\n```\n/home/edouard/anaconda3/lib/python3.6/site-packages/_pytest/fixtures.py:844:\n\
