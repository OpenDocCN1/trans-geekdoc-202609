    \n## 单变量统计\n\n探索数据集需要基本的单变量统计：\n\n- 发现感兴趣变量与潜在预测因子之间的关联。强烈建议在转向复杂的 multivariate\
    \ 预测因子之前先从简单的单变量方法开始。\n- 评估机器学习预测因子的预测性能。\n- 大多数单变量统计基于线性模型，而线性模型是机器学习中的主要模型之一。\n\
    \n### 7.1 主要统计量估计器\n\n#### 7.1.1 均值\n\n随机变量 X 的期望值算子 E(·) 的性质\n\nE(X + c) = E(X)\
    \ + c  (7.1)\nE(X + Y) = E(X) + E(Y)  (7.2)\nE(aX) = aE(X)  (7.3)\n\n样本量为 n 的样本\
    \ $x_1, \\dots, x_n$ 上的估计量 $\\bar{x}$ 给出为\n\n$\\bar{x} = \\frac{1}{n} \\sum_{i}\
    \ x_{i}$\n\n$\\bar{x}$ 本身是一个随机变量，具有以下性质：\n\n- $E(\\bar{x}) = \\mu$,\n- $Var(\\\
    bar{x}) = \\frac{Var(X)}{n}$.\n\n#### 7.1.2 方差\n\n$Var(X) = E((X - E(X))^2) =\
    \ E(X^2) - (E(X))^2$\n\n估计量为\n\n$\\sigma_{x}^{2} = \\frac{1}{n-1} \\sum_{i} (x_{i}\
    \ - \\bar{x})^{2}$\n\n注意这里除数中减去的 1 个自由度（df）。在标准的统计实践中，df = 1 提供了对假设无限总体方差的无偏估计。而\
    \ df = 0 则提供了正态分布变量方差的最大似然估计。\n\n#### 7.1.3 标准差\n\n$Std(X) = \\sqrt{Var(X)}$\n\
    \n估计量 simply 为 $\\sigma_x = \\sqrt{\\sigma_x^2}$。\n\n#### 7.1.4 协方差\n\n$Cov(X,\
    \ Y) = E((X - E(X))(Y - E(Y))) = E(XY) - E(X)E(Y)$.\n\n性质：\n\n- Cov(X, X) = Var(X)\n\
    - Cov(X, Y) = Cov(Y, X)\n- Cov(cX, Y) = c Cov(X, Y)\n- Cov(X + c, Y) = Cov(X,\
    \ Y)\n\ndf = 1 的估计量为\n\n$\\sigma_{xy} = \\frac{1}{n - 1} \\sum_{i} (x_i - \\bar{x})(y_i\
    \ - \\bar{y})$\n\n#### 7.1.5 相关性\n\n$Cor(X, Y) = \\frac{Cov(X, Y)}{Std(X)Std(Y)}$\n\
    \n估计量为\n\n$\\rho_{xy} = \\frac{\\sigma_{xy}}{\\sigma_x \\sigma_y}$\n\n#### 7.1.6\
    \ 标准误差（SE）\n\n标准误差（SE）是统计量的抽样分布的标准差：\n\n$SE(X) = \\frac{Std(X)}{\\sqrt{n}}$\n\n\
    它最常用于均值，估计量为 $SE(\\bar{x}) = \\sigma_x / \\sqrt{n}$。\n\n#### 7.1.7 练习\n\n- 生成\
    \ 2 个随机样本：x ~ N(1.78, 0.1) 和 y ~ N(1.66, 0.1)，两者大小均为 10。\n- 仅使用 `np.sum()` 操作计算\
    \ $\\bar{x}, \\sigma_x, \\sigma_{xy}$（xbar, xvar, xycov）。探索 `np` 模块以找出执行相同计算的\
    \ numpy 函数，并使用 assert 将其与之前的結果进行比较。\n\n### 7.2 主要分布\n\n#### 7.2.1 正态分布\n\n正态分布记为\
    \ $\\mathcal{N}(\\mu, \\sigma)$，参数为：$\\mu$ 均值（位置）和 $\\sigma > 0$ 标准差。估计量：$\\bar{x}$\
    \ 和 $\\sigma_x$。\n\n正态分布记为 $\\mathcal{N}$，其有用性源于中心极限定理（CLT），该定理指出：在一定条件下，足够多独立随机变量的算术平均值，每个随机变量具有明确的期望值和明确的方差，将近似服从正态分布，而与底层分布无关。\n\
    \n```\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy.stats import\
    \ norm\n%matplotlib inline\n\nmu = 0 # mean\nvariance = 2 # variance\nsigma =\
    \ np.sqrt(variance) # standard deviation\nx = np.linspace(mu-3*variance, mu+3*variance,\
    \ 100)\nplt.plot(x, norm.pdf(x, mu, sigma))\n```\n\n```\n[<matplotlib.lines.Line2D\
    \ at 0x7fc56b189cf8>]\n```\n\n![](img/c2ad4b400bf63af9804b2d44510f76a6_80_0.png)\n\
