  - "[PAGE 204]\n\n# NON LINEAR LEARNING ALGORITHMS\n\n\n\nSVM are based kernel methods\
    \ require only a user-specified kernel function K(x_i,x_j), i.e., a similarity\
    \ function over pairs of data points (x_i,x_j) into kernel (dual) space on which\
    \ learning algorithms operate linearly, i.e. every operation on points is a linear\
    \ combination of K(x_i,x_j).\n\nOutline of the SVM algorithm:\n\n+   1. Map points\
    \ x into kernel space using a kernel function: x → K(x,.).\n+   \n+   2. Learning\
    \ algorithms operate linearly by dot product into high-kernel space K(.,x_i) ·\
    \ K(.,x_j).\n+   \n+      • Using the kernel trick (Mercer’s Theorem) replace\
    \ dot product in high dimensional space by a simpler operation such that K(.,x_i)\
    \ · K(.,x_j) = K(x_i,x_j). Thus we only need to compute a similarity measure for\
    \ each pairs of point and store in a N × N Gram matrix.\n+   \n+      • Finally,\
    \ The learning process consist of estimating the α_i of the decision function\
    \ that maximises the hinge loss (of f(x)) plus some penalty when applied on all\
    \ training points.\n+   \n+      f(x) = sign ( ∑_i α_i y_i K(x_i, x) ).\n+   \n\
    +   3. Predict a new point x using the decision function.\n\n\n\nOne of the most\
    \ commonly used kernel is the Radial Basis Function (RBF Kernel). For a pair of\
    \ points x_i, x_j the RBF kernel is defined as:\n\n```\nK(x_i,x_j) = exp ( - ||x_i\
    \ - x_j||^2 / (2σ^2) )\n= exp (-γ ||x_i - x_j||^2 )   (14.1)\n\n= exp (-γ ||x_i\
    \ - x_j||^2 )   (14.2)\n```\n\nWhere σ (or γ) defines the kernel width parameter.\
    \ Basically, we consider a Gaussian function centered on each training sample\
    \ x_i . it has a ready interpretation as a similarity measure as it decreases\
    \ with squared Euclidean distance between the two feature vectors."
