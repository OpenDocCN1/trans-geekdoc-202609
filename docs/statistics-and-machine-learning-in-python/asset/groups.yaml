    \n### 10.3.1 原理\n\n- 主成分分析是用于线性降维的主要方法。\n- 主成分分析的思想是找到 K 个**主成分方向**（称为**载荷**）**V**$_{K×P}$，尽可能多地捕获数据中的变化。\n\
