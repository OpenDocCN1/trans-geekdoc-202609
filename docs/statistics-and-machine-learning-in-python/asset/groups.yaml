    \n## 10.4 多维缩放 (MDS)\n\n资源：\n\n- http://www.stat.pitt.edu/sungkyu/course/2221Fall13/lec8_mds_combined.pdf\n\
    - https://en.wikipedia.org/wiki/Multidimensional_scaling\n- Hastie, Tibshirani\
    \ and Friedman (2009). *The Elements of Statistical Learning: Data Mining, Inference,\
    \ and Prediction.* New York: Springer, Second Edition.\n\nMDS 的目的是找到数据的低维投影，其中数据点之间的成对距离尽可能地保持（在最小二乘意义上）。\n\
    \n- 设 **D** 为 (*N* × *N*) 成对距离矩阵，其中 *d_ij* 是点 *i* 和 *j* 之间的 *distance*。\n- MDS\
    \ 概念可以扩展到以相似性矩阵指定的各种数据类型。\n\n给定非相似性（距离）矩阵 **D**_{N×N} = [*d_ij*]，MDS 试图找到 *N*\
    \ 个点 **x**₁,…, **x**_N ∈ ℝ^K 的 *K* 维投影，连接成 **X**_{N×K} 矩阵，使得 *d_ij* ≈ ||**x**_i\
    \ − **x**_j|| 尽可能接近。这可以通过最小化称为 **stress function** 的损失函数获得\n\nstress(**X**) =\
    \ Σ_{i≠j} (d_{ij} − ||**x**_i − **x**_j||)² .\n\n该损失函数被称为 *least-squares* 或 *Kruskal-Shepard*\
    \ 缩放。\n\n*least-squares* 缩放的一种修改是 *Sammon mapping*\n\nstress_{Sammon}(**X**) =\
    \ Σ_{i≠j} (d_{ij} − ||**x**_i − **x**_j||)² / d_{ij} .\n\nSammon mapping 相比于最小二乘缩放更好地保持了小距离。\n\
    \n## 10.4.1 经典多维缩放\n\n也称为主坐标分析，PCoA。\n\n- 距离矩阵 D 经常使用中心化内积变换为相似性矩阵 B。\n- 损失函数变为\n\
    - stress_classical(X) = sum_{i≠j} (b_ij - <x_i, x_j>)^2.\n- 经典 MDS 中的应力函数有时称为\
    \ strain。\n- 经典 MDS 问题的解可以从相似性矩阵的特征向量中找到。\n- 如果 D 中的距离是欧几里得的并且使用双中心化内积，结果等价于 PCA。\n\
    \n## 10.4.2 示例\n\neurodist 数据集提供了欧洲 21 个城市之间的公路距离（以公里为单位）。给定这个成对（非欧几里得）距离矩阵 D\
    \ = [d_ij]，MDS 可用于恢复城市在某个欧几里得参考系中的坐标，其方向是任意的。\n\n```\nimport pandas as pd\nimport\
