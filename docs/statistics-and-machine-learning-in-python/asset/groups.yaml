    import scipy.stats as stats

    n = 50

    x = np.random.normal(size=n)

    y = 2 * x + np.random.normal(size=n)


    # Compute with scipy

    cor, pval = stats.pearsonr(x, y)

    ```


    # 7.4.2 Two sample (Student) t-test: compare two means


    The two-sample t-test (Snedecor and Cochran, 1989) is used to determine if two
    population means are equal. There are several variations on this test. If data
    are paired (e.g. 2 measures, before and after treatment for each individual) use
    the one-sample t-test of the difference. The variances of the two samples may
    be assumed to be equal (a.k.a. homoscedasticity) or unequal (a.k.a. heteroscedasticity).


    # 1. Model the data


    Assume that the two random variables are normally distributed: x ~ N(μx, σx),
    y ~ N(μy, σy).


