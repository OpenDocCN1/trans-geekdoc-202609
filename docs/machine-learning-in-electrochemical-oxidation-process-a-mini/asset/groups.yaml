    curve of the SVM model (Fig. 6b) indicated that increasing the sample size could
    improve the model''s accuracy, achieving significant precision with approximately
    500 samples. Further refinement of the model involved hyperparameter tuning through
    grid search for 800 sample sets, leading to a RMSE of 0.130 eV for the training
    set and 0.131 eV for the test set (Fig. 6c). Moreover, the relative error distribution
    confirmed the model''s accuracy.


