    # 3. Mainly machine learning algorithms in electrochemical oxidation


    This section analyzed and summarized the basic theory of common ML algorithms,
    including MLR and typical nonlinear regression (NR) algorithms such as SVM, XGBoost,
    ANN and RF.


    The MLR model determines the optimal parameter estimates by minimizing the discrepancy
    between the actual observed values and the predicted values of model (usually
    the sum of squared differences). This model is capable of assessing and interpreting
    the weight of each independent variable with respect to the dependent variable
    [27]. Within the context of electrochemical oxidation, MLR can be utilized to
    understand how various process parameters such as current density, pH value, electrode
    material, and treatment time influence the efficiency of electrochemical oxidation.
    By analyzing data collected from experimental processes, MLR aids in predicting
    the outcomes of electrochemical treatment under varying conditions and in optimizing
    process parameters to achieve maximum efficiency [28]. The multiple linear regression
    equation is a mathematical model used to describe the linear relationship between
    a dependent variable (Y) and multiple independent variables (X1, X2, ..., Xn).
    The equation is typically represented as follows (Eq. 1):


    ```

    Y = \beta_1 X_1 + \beta_2 X_2 + \beta_3 X_3 + \cdots + \beta_n X_n + \varepsilon

    ```


    where \beta_j (j = 1, 2, 3, ..., k) represents the regression coefficient, while
    \varepsilon denotes the error component.


    NR is a form of regression analysis where observed data is modelled by a function
    that is a nonlinear combination of the model


    ![](img/3aa35d4c40b6a535721ef39907027cd0_2_1.png)


    Fig. 2. Schematic diagram of SVM, ANN, RF, and XGBoost algorithms.


    parameters and depends on one or more independent variables. NR is particularly
    useful in environmental applications, as the relationships between variables are
    often not linear. This type of regression allows for more accurate modeling and
    prediction of complex processes [29]. Nonlinear models can be generally expressed
    in the form (Eq. 2):


    ```

    Y = f(x, \theta) + \varepsilon

    ```


    where Y represents the response variable, while f denotes the function employed.
    The x indicates inputs, \theta symbolizes the parameters that require estimation,
    and \varepsilon refers to the error component. If the second derivative of the
    function with respect to any parameter is non-zero, then that parameter is categorized
    as a nonlinear parameter [30]. Based on that principle, numerous models with superior
    performance for addressing nonlinear problems have been developed, such as SVM,
    ANN, RF, and XGBoost, as shown in Fig. 2.


    As a general ML algorithm, the SVM idea was originally proposed by Vapnik and
    Chervonenkis in 1963 [31]. With constant improvement, SVM have emerged as a standard
    algorithm for ML, pattern recognition, and data fitting, and they are now applied
    to a wide range of real-world issues. SVM is based on finding a dividing hyperplane
    in the sample space based on the training set, thus differentiating different
    samples. The hyperplane in the sample space and the distance from any point to
    the hyperplane are denoted as Eqs. 3 and 4, respectively [4]:


    ```

    \omega^T x + b = 0

    ```


    ```

    r = \frac{|\omega^T x + b|}{\|\omega\|}

    ```


    where \omega is the normal vector, which determines the direction of the hyperplane
    and b is the displacement term, which determines the distance between the hyperplane
    and the origin. If a hyperplane can correctly classify the training set, then
    the margin of the support vectors can be represented as Eq. 5. To find the hyperplane
    with the maximum margin, it is necessary to maximize Eq. 5. Consequently, this
    forms the fundamental expression of SVM, as represented by Eq. 6, which is the
    minimization of 1/\gamma. In practical scenarios, the original dataset may not
    always be linear. Therefore, when there is no hyperplane that can correctly classify
    the dataset in the original space, kernel functions are employed to map the samples
    from the original space to a higher-dimensional feature'
