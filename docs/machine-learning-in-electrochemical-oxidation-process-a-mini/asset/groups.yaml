    # 4.4. Prediction of material characterization


    Common ML algorithms include NR such as decision trees, neural networks, GPR,
    etc. These algorithms help predict catalytic activity based on a dataset of known
    materials [48]. ML algorithms can significantly reduce the computational cost
    and time associated with density functional theory (DFT) calculations by learning
    from existing DFT datasets. Zhang et al. utilized ML to accelerate DFT studies
    on the catalytic performance of platinum-modified amorphous alloy surface catalysts.
    The study engineered ML potentials through the construction of distance contribution
    descriptors (DCD) and used ML-accelerated DFT calculations to determine the Gibbs
