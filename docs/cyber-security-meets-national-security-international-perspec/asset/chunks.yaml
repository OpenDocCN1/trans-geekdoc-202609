  trans: '


    在商业方面，到 21 世纪，许多企业已经采用了旨在创新以及改进客户服务和运营的技术，这通常在盈利能力和运营便利性方面取得了积极成效。开展在线业务的优势是巨大的，到
    2018 年，全球超过 42%的业务是以这种方式进行的（取自 [`www.slideshare.net/sap/99-facts-on-the-future-of-business-in-the-digital-economy-2018`](https://www.slideshare.net/sap/99-facts-on-the-future-of-business-in-the-digital-economy-2018)）。与此同时，采取此类措施的企业面临着未经授权的使用和恶意攻击的风险，包括盗窃、知识产权的破坏、内部人员滥用以及信息的非法使用，这等同于数据可靠性和机密性的丢失，并影响了企业与其用户/客户之间的信任水平（Shalhoub
    & Al Qasimi, 2010）。


    在一个数字经济以买方与卖方物理分离、买方与产品分离以及网络犯罪风险为特征的环境中，企业必须找到以可持续方式与客户建立和发展网络关系的方法，其中最好的是建立一个受信任的数字空间。（Shalhoub
    & Al Qasimi, 2010）。当我们考虑到世界上大多数国家目前在几乎所有具有国家意义的方面进行数字化转型，例如电子治理、电子商务、电子投票、电子交易、电子学习以及社会人类事业的其他重要方面时，这一点的重要性就尤为凸显了。在这种情况下，数字信任和安全具有至关重要的意义，需要政策制定者的关注。


    ## 网络犯罪的兴起与模式


    网络犯罪在历史上出现于 20 世纪 70 年代和 80 年代的冷战时期。在那个时期，大多数网络犯罪的模式都围绕着参与意识形态斗争的国家展开，并涉及对竞争对手计算机和数据的攻击。与核扩散、情报活动和外事政策相关的重要数据曾是受相关政府雇佣的专业人员黑客的目标。与此同时，个人犯罪分子也积极地黑入数据，针对关键国家基础设施和金融组织，以盗窃资金和破坏为目的（Kshetri
    2019; Mordi 2019）。然而，从普及性来看，在苏联崩溃后，网络犯罪变得更加广泛、动态且无处不在。


    据认为，2018 年和 2019 年全球通过对网站和组织的大型攻击和盗窃，网络犯罪产生了价值 1.5 万亿美元和 2 万亿美元的资金。据我们所知，通过网络犯罪实现的年总额包括：非法在线市场的
    8600 亿、贸易机密和知识产权盗窃的 5000 亿、数据交易的 1600 亿、犯罪软件的 16 亿以及勒索软件的 10 亿。在美国，仅 2010 年一年，网络诈骗就导致了
    250 亿美元的损失；在英国和澳大利亚，2015 年的损失达到 36 亿英镑和 9400 万澳元。这些犯罪很大程度上涉及跨国公司和政府信息，2018 年数据泄露的主要案例包括雅虎（30
    亿美元）、安德玛（1.5 亿美元）、eBay（1.45 亿美元）、Equifax（1.1 亿美元）、Facebook（8700 万美元）、摩根大通银行（7600
    万美元）、Paystation（7700 万美元）、Uber（5600 万美元）和宜家家居（5600 万美元）（Re-Hashed 2019）。


    现在转向尼日利亚，与其他发展中国家类似，该国在世纪 70 年代和 80 年代的互联网和网络空间发展水平微乎其微。尽管在冷战期间它是资本主义国家的附属，但当时尼日利亚的网络犯罪几乎不存在。然而，从
    20 世纪 90 年代开始，尼日利亚加入了面临非军事安全威胁的国家行列，其中网络犯罪处于核心位置。例如，如果整个非洲在 2017 年因网络犯罪损失了 35
    亿美元，那么尼日利亚所占部分为 6.45 亿美元，是目前为止最大的（Kshetri 2019）。一年后，据报道尼日利亚在 2018 年遭受网络攻击共计损失了
    8 亿美元（2880 亿纳日拉）（Azeez 2019）。更广泛地说，2019 年的一份报告显示，尼日利亚近年来每年因网络犯罪损失 1270 亿纳日拉（328,842,878
    美元）（Ohwovoriole 2019）。此外，由于与该国相关的每日事件频繁，尼日利亚有有全球网络犯罪总部的声誉（尽管 2017 年的 Statista
    数据甚至没有将尼日利亚列入网络犯罪发生率最高的二十个国家）（Mordi 2019）。最后，尼日利亚通信委员会（`NCC`）2018 年报告称，该国有约 900
    万未注册线路被手机用户使用；其中一些线路显然被用于恐怖主义、农村匪患、社区暴力、绑架和抢劫等犯罪活动，对国家安全构成了严重威胁。


    ## 网络安全政策与法规


    对网络安全政策的需求源于一种认知，即全球治理已转向电子治理以及随之产生的安全影响。2009 年针对韩国和美国的网络攻击为这方面提供了一个值得关注的案例（Andreason
    2012, 77）。根据 Pelton 和 Singh（2015）的观点，网络法应针对四个主要领域。第一是个人和家庭保护，包括保护股票、债券、银行账户和信用卡、医疗保健账户、桌面电脑和
    Wi-Fi、个人手机手机和家庭记录。第二个方面涉及智能手机和通过手机安全访问运行的免费 Wi-Fi 的网络安全政策。第三个方面是通过应用具有网络安全影响的卫星来保护关键基础设施。最后，第四是对网络活动的严格政府监管和监控。然而，现实情况是，此类政策的发展最多是杂乱无章。


    为了尽可能减少网络犯罪的发生和严重性，各种国际组织承担了推动发达国家和发展中国家网络法律发展的责任。在这方面作为领导者的国际电信联盟（`ITU`）在 2007
    年启动了全球安全议程，并成立了一个高级专家小组来调查问题并制定长期战略的建议（Shalhoub & Al Qasimi 2010, 18）。`ITU` 特别在其主持下颁布的法律对利用电磁频谱或国际电信网络的信息战攻击具有某些适用性（Greenberg,
    Goodman, & Hoo 1998, 7）。


