  raw: "The growth in digital power offers a very imperfect reflection of the real\
    \ clout of the states under discussion here: GAFAM’s rise obscures the United\
    \ States’ geopolitical decline, while China’s technological power conceals its\
    \ demographic fragility. Conversely, in both Africa and the Middle East, hacking\
    \ operations designed to steal digital or financial resources reveal the weaknesses\
    \ of supposedly powerful forces.\n\nSocial digitalization rates are therefore\
    \ a better reflection of the resources that are immediately available rather than\
    \ their future potential. The internet has become a bitterly contested space among\
    \ competing economic powers. The aim of this competition is to effectively privatize\
    \ a space that is temporarily free for users to explore. Permanent connectivity,\
    \ which devours instant data and interconnects objects and reified human beings,\
    \ bypasses anyone who refuses to accede and labels them as suspicious. In the\
    \ future, we can predict that states and individuals will generate a fog of incorrect\
    \ data in an act of defiance designed to shield themselves from view.^([38](#chapter1.xhtml#footnote-38))\
    \ Finally, digitalization is throwing up unexpected geopolitical changes. Ultimately,\
    \ it will sweep away repetitive jobs and temporarily concentrate power in innovative\
    \ territories, while making it possible for states and businesses to identify\
    \ opinion leaders using relational mapping. Lastly, it will enable military chiefs\
    \ to order robots to kill targets using AI-powered facial recognition. We are\
    \ entering into the era of hybrid civilizations.\n\n1.  [1](#chapter1.xhtml#footnote-1-backlink)\
    \ The idea behind all anonymizing systems is to blend various network users’ communications\
    \ together so that they become individually indistinguishable. As a result, it\
    \ becomes impossible to draw a correspondence between data and identity.\n\n2.\
    \  [2](#chapter1.xhtml#footnote-2-backlink) Cyberattacks have now become so sophisticated\
    \ that it is impossible to determine where the perpetrators are located. This\
    \ makes it difficult to implement aggressive tactics as recommended by the latest\
    \ cyber strategy white paper.\n\n3.  [3](#chapter1.xhtml#footnote-3-backlink)\
    \ Arnold Toynbee wrote that “if we were to look at the history of war techniques\
    \ in isolation in Greek history, we would observe continuous progress from beginning\
    \ to end, before, during and even after the growth period. We would also observe\
    \ that each step on the road to progress is stimulated by events that are otherwise\
    \ disastrous for Hellenic civilisation.” Toynbee, *L*’*histoire* (Paris: Gallimard,\
    \ 1951), 219. Translation from the French text.\n\n4.  [4](#chapter1.xhtml#footnote-4-backlink)\
    \ The wider public is entirely unaware of how Google’s search engine works.\n\n\
    5.  [5](#chapter1.xhtml#footnote-5-backlink) For her part, magistrate and cyber\
    \ specialist Myriam Quéméner examines how French law is changing in reaction to\
    \ disruptive digital technology.\n\n6.  [6](#chapter1.xhtml#footnote-6-backlink)\
    \ The Suez Canal and Strait of Malacca are strategic points for underwater cables.\
    \ China, meanwhile, is only connected to the world via four points.\n\n7.  [7](#chapter1.xhtml#footnote-7-backlink)\
    \ The Marea network is made up of cables no bigger than a hosepipe and was completed\
    \ in 2017. It links Virginia to Bilbao and currently transmits 75 percent of the\
    \ world’s current online traffic.\n\n8.  [8](#chapter1.xhtml#footnote-8-backlink)\
    \ The website Pastebin, for instance, lists the most recent hacking operations.\
    \ See also Tim Jordan and Paul Taylor, “A Sociology of Hackers,” *Sociological\
    \ Review* 46, no. 4 (November 1998): 757–80. Note that people with Asperger’s\
    \ syndrome (a form of autism characterised by communication difficulties) are\
    \ particularly likely to thrive in IT professions. Steve Silberman, “The Geek\
    \ Syndrome,” *Science*, January 12, 2001.\n\n9.  [9](#chapter1.xhtml#footnote-9-backlink)\
    \ One of Quantcube Technology’s flagship products is Global Macro Smart Data,\
    \ a real-time predictive platform licensed annually to users. Since May 2013,\
    \ Quantcube Technology has predicted twenty-one election results with 92 percent\
    \ accuracy, several weeks before the polls even opened. The start-up notably predicted\
    \ that the UK would vote to leave the EU in 2016 and that Donald Trump would win\
    \ the 2016 US presidential election (a fortnight ahead of time in the latter case),\
    \ as well as the results of France’s first round of presidential elections in\
    \ 2017 and the 2018 American mid-terms.\n\n10.  [10](#chapter1.xhtml#footnote-10-backlink)\
    \ Major digital platforms’ most significant means of reducing friction between\
    \ these different identities is to moderate users’ posts. This invisible task\
    \ was analyzed by Tarleton Gillespie in *The Custodians of the Internet* (New\
    \ Haven: Yale University Press, 2018), 296. It consumes a huge amount of resources.\
    \ Global platforms use automated detection tools to moderate content. The task\
    \ of moderation itself involves flagging up offensive or inappropriate content.\n\
    \n11.  [11](#chapter1.xhtml#footnote-11-backlink) Unless, of course, these virtual\
    \ confrontations threaten the cyber security upon which foreign investments depend.\n\
    \n12.  [12](#chapter1.xhtml#footnote-12-backlink) State start-ups could find themselves\
    \ at the cutting edge of government reforms.\n\n13.  [13](#chapter1.xhtml#footnote-13-backlink)\
    \ For Pierre Bellanger, “software and algorithms are human thought in code. Only\
    \ a third of our brains is dedicated to rational cognition. If the majority of\
    \ our thoughts emerge from our unconscious, as soon as networks develop they become\
    \ unmoored from reason, control and any understanding of our own thoughts. The\
    \ internet is coding and connecting up our dreams.” Translation from the French\
    \ text.\n\n14.  [14](#chapter1.xhtml#footnote-14-backlink) Cybercrime is mostly\
    \ fueled by developing economies, which have recently become a significant force\
    \ as far as fraud is concerned. Attacks originating in Brazil continue to rise,\
    \ making it one of the world’s five most prolific cybercrime hotspots. Currently,\
    \ the most effective hackers operate from Israel and India.\n\n15.  [15](#chapter1.xhtml#footnote-15-backlink)\
    \ The Tor network, which is spreading through the darknet, uses the onion routing\
    \ technology that was developed by the US Navy in the 1990s. This military technology\
    \ was mostly financed by the US government to promote democracy around the world.\
    \ Until 2017, the US government funneled nearly all its funding via the US Navy,\
    \ the State Department, and the Broadcasting Board of Governors that emerged from\
    \ the CIA. As a result, major intelligence agencies can reverse data anonymizing\
    \ processes to uncover Tor users’ true identities.\n\n16.  [16](#chapter1.xhtml#footnote-16-backlink)\
    \ Hackers can control the automatic windows and the indicators on a dashboard,\
    \ or even cause the engine to malfunction.\n\n17.  [17](#chapter1.xhtml#footnote-17-backlink)\
    \ According to Kaspersky Lab’s predictions for targeted threats in 2019. The next\
    \ viral infections will be imperceptible. \n\n18.  [18](#chapter1.xhtml#footnote-18-backlink)\
    \ Viruses use an unstable enzyme to multiply. Because there is no corrective system\
    \ to call upon, this error remains in the genome. It occurs in about one out of\
    \ every 10,000 cases. Much variation therefore exists within a viral population.\n\
    \n19.  [19](#chapter1.xhtml#footnote-19-backlink) Examples include Steve Jobs\
    \ (Apple), Mark Zuckerberg (Facebook), Bill Gates (Microsoft) and Linus Torvalds\
    \ (Linux).\n\n20.  [20](#chapter1.xhtml#footnote-20-backlink) The internet’s infrastructure\
    \ is mainly made up of high-capacity underwater fibre optic cables linked up to\
    \ terrestrial cables and routers. For Europe, the most important cables are those\
    \ that link the continent to the UK and, from there, to the US via the Atlantic\
    \ Ocean."
