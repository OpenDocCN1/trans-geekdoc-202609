    由于他在连接电子商务网站时使用了互联网协议（IP）地址，警方锁定了犯罪嫌疑并发起了大规模搜捕。梅拉（Merah）躲在家里抵御了长达 32 小时的围攻，最终在一次进攻中被击杀。五名精英警察部队成员在行动中受伤。随后，几个圣战武装团体声称对梅拉的袭击承担责任。更模糊的是，梅拉与情报机构之间关系的性质不明，这引发了关于所谓安全漏洞和未经证实的合作理论的争议。


    ## 曼格尼维尔的屠杀


    第二个案件发生在 2016 年 6 月 13 日，当时一名名为拉罗西·阿巴巴拉（Larossi Abballa）的 25 岁恐怖分子在曼格尼维尔的家中杀害了一对警察夫妇。多亏于阿巴拉在
    Facebook 直播中交流的另一名激进穆斯林的干预，这对夫妇三岁的儿子得以幸免。当阿巴拉拍摄杀人视频以声称自己是伊斯兰国成员时，他犹豫该如何处理那个孩子。这名恐怖分子三年前因协助恐怖策划而被定罪，在杀人几小时后被精英警察小队击毙。他决定杀死那两个人的原因尚不清楚。然而，他似乎并没有随机选择这对夫妇。对其手机的分析显示，他曾多次监视该地区。此外，在
    2017 年 10 月，警方在搜查一名涉嫌恐怖主义案件的女性家中时，缴获了一个`USB`优盘，在上面他们发现了 2,626 名警察的名字。名单中还包括了警察工会所有高级成员的姓名、识别码和所属单位（日期为
    2008 年）。所有这些警察都任职于国内安全部门。至于这些信息是如何泄露的——这些敏感数据已与名单列出的所有代理以及工会本身共享，使得信息泄露变得更容易。事实上，嫌疑人曾住在一位密友母亲家中，该女性是一名士兵军官兼工会代表，且皈依了伊斯兰教。警方就曼格尼维尔屠杀案对她进行了审问，因为她确实知道有人要参加圣战。然而，由于缺乏证据，未能对其提出任何指控。


    ## 哈庞案件，2019 年


    2019 年 10 月 3 日，在巴黎警察厅情报局工作的公务员米卡埃尔·哈庞（Mickaël Harpon）在该机构的功能包括预防恐怖主义的庭院内杀杀了三名警察和一名行政人员。将此次杀戮归类为恐怖袭击毫无疑问，因为其犯罪者的目标是“‘杀死不信者’”。法国首次面临“内战误伤”式的恐怖袭击，即由武装部队成员故意实施的友火攻击。


    在哈庞案件中，最严重的是他可以接触机密数据，因为他是一名负责计算机维护的技员。（等等，他是一名负责计算机维护的技员）。尽管他表现明显激进，这名恐怖分子仍查阅了关于警察厅员工的个人数据。在他的`USB`优盘中发现了机密数据以及圣战宣传品。虽然随后的调查未能证实机密数据泄露，但这仅仅是因为缺乏直接证据。在杀戮案后，情报专家公开表达了担忧，认为一个参加过极端清真寺的知名激进穆斯林，何如何能获得如此级别的安全审查许可。一个特别调查委员会建议了三十五项措施，以防止未来发生此类风险。


    ## 结论


    对网络威胁的误解导致了武装部队和其他安全部门大多数安全漏洞的根源失败（名誉受损、泄密、针对成员生命的袭击）。最近的案例强调，人们不需要成为高级黑客或使用高科技即可造成损失。如果没有人遵守程序，增加控制可能没有任何结果。然而，一场针对军事人员的强有力且长期的意识提升活动，如果观察到心态的转变，将开始见效。事实上，网络安全已成为军事人员生活中不可避免的一部分。


    为了面对这些新威胁，法国采取了多种措施。首先，其情报部门必须适应变革。在情报世界，建立了专门从事专业知识的新部门和小组。联合外部情报（`DGSE`）和军事情报（`DRM`），国防安全部门（`DRSD`）专门保护所有`MoD`军事人员和小组。反恐的目标是识别并中和可能来自组织、团体或个人的内部和外部威胁。`DRSD`代理负责调查并加强安全。其中，`DRSD`的关键任务之一是在海外任务之前对部队进行反恐指导（保护数据、维护保密、避免名誉损害）。每年，若干军事人员因情报部门管理的违规行为而受到军事指挥部有时是法院的惩罚。


    如今，大多数电子通信都是加密的。武装部队使用的专用电子邮件和计算机网络应保持不被破解和密封。今天，任何小队领导都使用加密软件管理自己的部队。此外，`MoD`已聘请了数百名计算机科学专家、软件设计师和其他类型的“极客”加入古老和新的单位，如`44th`和`54th`团、`805th`团（创建于
    2016 年），与布塔尼的`785th`团并列，作为网络安全和反恐的先锋。


