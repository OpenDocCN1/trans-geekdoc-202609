    考虑到他们造成伤亡的能力，更重要的是，尽管手段有限且遭受了巨大损失，他们仍能战斗多年，我们必须面对他们拥有真正的专业技能这一事实。此外，也许我们也应该承认，这个敌人对我们的了解比我们对他们的了解还要深入。许多恐怖分子在欧洲出生和成长。西方流行文化影响着世界上任何地方看电视或听广播的人。这正是软实力这把双刃剑的另一面。因此，如果低估了现有威胁，以至于不采取任何安全措施，将是非常危险的。浏览
    `Web` 和连接社交网站的能力在全球范围内都是轻而易举的。此外，鉴于人们有时会在 `Web` 上与某些未知的第三方分享个人数据，如今获取这些数据变得更加容易了。有些人在
    `Facebook`、`Twitter`、`Instagram`、`YouTube` 等平台上公开分享了大量的照片、视频和帖子，以至于人们可以很容易为他们建立档案。不幸的是，一些军方人员（或其他任何公共机构）误用了在线网络。如果一名特工忘记了
    `Internet` 不是讨论任务的论坛，而是与亲属联系的手段，他就会危及自己的任务。这种情况并非假设。最著名的案例之一发生在 2010 年的以色列陆军内部。具体而言，一名以色列士兵在
    `Facebook` 上发布了一个帖子，揭露了在约旦岸一项即将执行的任务细节：“周三我们将清理卡塔纳村（拉姆拉附近）——今天是抓捕行动，明天是一次抓捕行动，然后愿上帝保佑，周四就能回家。”其他军人向部队指挥官报告了该帖子，指挥官担心行动安全已泄露，决定取消该任务。2008
    年，另一名以色列士兵因在 `Facebook` 上上传敏感信息而被入狱。考虑到法国军队社交网络的用户数量，这种情况在那里也可能发生。2014 年的一项调查指出，四分之三的军人（大多数是非士官）是社交网络活跃用户。只有
    11%的人在[入伍后]放弃了他们的在线账号，而 15%的人（每三人中有一位军官）从未有过任何账号。因此，2012 年，法国国防部发布了一份《社交网络正确使用指南》。与此同时，网络安全专家经常在训练营和军事学院举办讲座，警告人员注意社交网络对海外及国内行动构成的危险。


    最近，网络战场上出现了来自社交网络的新威胁。欺骗是一种广为人知的行动模式，旨在影响敌人的活动。现在，这种手段正在 `Web` 上进行。例如，法国军队在萨赫尔地区的某些对手散布明显的虚假新闻，以助长一场流行的反法国运动。根据这些虚假新闻，`Barkhane`
    行动人员的所谓“友军误伤”事件频繁涉及其非洲盟友。另一些则假称法国支持武装恐怖组织。这些谎言显然不公且偏颇，但却被大量地分享、点赞和评论。


    关于所谓的在武装部队中卧底的组织化狂热分传言，起到了在部队内部制造猜疑的作用。尽管一些法国军队的前成员实际上加入了伊斯兰国进行圣战（吉亥德），但大多数穆斯林士兵对法国国家是忠诚的。事实上，一条在几个网站上流传多年的著名虚假新闻，涉及
    1999 年 `福煦` 号航空母舰上的一场所谓的“兵变”。根据这一传闻，穆斯林水员对他们所参与的针对科索沃（现为穆斯林国家）的轰炸行动感到厌倦，试图反叛。然而，这从未真正发生过。


    尽管如此，多年来在法国军队和警方中确实发现过一些潜在的伊斯兰恐怖分子和暴力激进分子。我们必须承认，敌人擅长使用新媒体工具并建立交流策略，能够在 `Web`
    上以尽可能有效且越来越毫不掩饰的方式表达自己。事实上，一些宣传电影和杂志的设计和制作符合西方标准。像 `Dabiq`、`Rumiyah`、`Inspire`
    和 `Dar al-Islam` 这样的网络杂志在 2014 年至 2016 年间以多种语言（包括法语）出版。它们为潜在的恐怖分子提供了入门包，这些人只需通过阅读就能获得技术和思想材料。伊斯兰国作为一个领土实体的失败，并没有结束他们在
    `Web` 或相关数字支持媒体上分享信息或进行宣传。


    ### 法国安全部队的致命威胁


    对国土的恐怖威胁让军人在自己的国家变得匿名。现在，在执勤之外禁止穿着制服。名字被删除，脸部被模糊以防止在媒体报道期间被识别。结果是士兵已经从日常生活和人们的脑海中消失。除了七千到万万执行
    `Sentinelle` 行巡逻街道以确保敏感地区（主要是宗教场所）安全的士兵外，法国人无法在面包店或超市购物时看到穿着战斗服或制服的士兵。一些退休的军事官员和匿名高级军官谴责他们认为的向敌人退缩的行为。这种观点并非没有道理。然而，我们必须承认，在过去的十年里，武装力量成员和其他安全部门遭受了恐怖主义的严重伤害。让我们回想法国三个著名的案例，说明了在当今本土反恐战争中军人是如何被针对的。在这三个案例中，网络安全都发挥了关键作用。


    #### 2012 年梅拉案


    穆哈默德·梅拉（Mohammed Merah）是法国国土安全部门熟知的惯性罪犯。作为一个激进的穆斯林分子，他曾多次前往巴基斯坦和阿富汗，在恐怖分子训练营接受培训。尽管他假装——最终也被相信——是以游客身份前往该地区，但国土安全分析师继续监控他的活动。2012
    年 3 月 11 日，他终于为了追求吉亥德而采取犯罪行动，目标是军人。他很容易地识别出第一个受害者：后者在一个广为人知的电子商务网站上发布了一个描述过于直白的广告。这名士兵名为伊马哈德·本·齐亚坦（Imad
    Ibn Ziaten）的空军士官，想卖掉他的摩托车；在广告中，他解释说由于经常离开家所以不得不处理掉。最后，他写道：“我是一名军人。”梅拉假装对车感兴趣，并与齐亚坦约了见面；见面时，他指责齐亚坦是伊斯兰教的叛徒并杀害了他。三天后，他袭击了一群在蒙托万军区大门外街道上路过的军人。两名士兵遇，另一名重伤。2012
    年 3 月 19 日，他最终袭击了一所犹太学校，杀死了一名成年人和三名儿童。

