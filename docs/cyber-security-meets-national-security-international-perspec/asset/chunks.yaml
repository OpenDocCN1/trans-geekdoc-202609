    The growth in digital power offers a very imperfect reflection of the real clout
    of the states under discussion here: GAFAM’s rise obscures the United States’
    geopolitical decline, while China’s technological power conceals its demographic
    fragility. Conversely, in both Africa and the Middle East, hacking operations
    designed to steal digital or financial resources reveal the weaknesses of supposedly
    powerful forces.


    Social digitalization rates are therefore a better reflection of the resources
    that are immediately available rather than their future potential. The internet
    has become a bitterly contested space among competing economic powers. The aim
    of this competition is to effectively privatize a space that is temporarily free
    for users to explore. Permanent connectivity, which devours instant data and interconnects
    objects and reified human beings, bypasses anyone who refuses to accede and labels
    them as suspicious. In the future, we can predict that states and individuals
    will generate a fog of incorrect data in an act of defiance designed to shield
    themselves from view.^^ Finally, digitalization is throwing up unexpected geopolitical
    changes. Ultimately, it will sweep away repetitive jobs and temporarily concentrate
    power in innovative territories, while making it possible for states and businesses
    to identify opinion leaders using relational mapping. Lastly, it will enable military
    chiefs to order robots to kill targets using AI-powered facial recognition. We
    are entering into the era of hybrid civilizations.


    ### Footnotes


    1. 1 The idea behind all anonymizing systems is to blend various network users’
    communications together so that they become individually indistinguishable. As
    a result, it becomes impossible to draw a correspondence between data and identity.

    2. 2 Cyberattacks have now become so sophisticated that it is impossible to determine
    where the perpetrators are located. This makes it difficult to implement aggressive
    tactics as recommended by the latest cyber strategy white paper.

    3. 3 Arnold Toynbee wrote that “if we were to look at the history of war techniques
    in isolation in Greek history, we would observe continuous progress from beginning
    to end, before, during and even after the growth period. We would also observe
    that each step on the road to progress is stimulated by events that are otherwise
    disastrous for Hellenic civilisation.” Toynbee, L’*histoire (Paris: Gallimard,
    1951), 219. Translation from the French text.

    4. 4 The wider public is entirely unaware of how `Google`’s search engine works.

    5. 5 For her part, magistrate and cyber specialist Myriam Quéméner examines how
    French law is changing in reaction to disruptive digital technology.

    6. 6 The Suez Canal and Strait of Malacca are strategic points for underwater
    cables. China, meanwhile, is only connected to the world via four points.

    7. 7 The `Marea` network is made up of cables no bigger than a hosepipe and was
    completed in 2017. It links Virginia to Bilbao and currently transmits 75 percent
    of the world’s current online traffic.

    8. 8 The website `Pastebin`, for instance, lists the most recent hacking. Note
    that people with Asperger’s syndrome (a form of autism) are particularly likely
    to thrive. See Silberman, “The Geek,” *Science*, 12.

    9. 9 Because there is no corrective system to call upon, this error remains in
    the genome. The---- predicted with 92 accuracy.

    10. 10 According to Kaspersky Lab’s predictions for targeted threats in 2019.
    The---- predicted would leave the election in 2016.

    11. 11 Unless, of course, these confrontations threaten to.

    12. 12 The next viral infections will be imperceptible.

    13. 13 The---- from the French text.

    14. 14 Attacks originating in Brazil continue to rise.

    15. 15 The `Tor` network, which is spreading through the darknet, uses the onion
    routing technology that was developed by the US Navy in the 1990s.

    16. 16 Hackers can control the automatic windows and the indicators on a dashboard,
    or even cause the engine to malfunction.

    17. 17 The---- predicted to.

    18. 18 Viruses use an unstable enzyme to multiply.

    19. 19 Examples include Steve Jobs, Mark Zuckerberg, Bill Gates and `Linux` .

    20. 20 The internet’s infrastructure is mainly made up of high-capacity underwater
    fibre optic cables linked up to terrestrial cables and routers.

