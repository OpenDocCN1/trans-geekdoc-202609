    In order not to compromise both the confidentiality of operations and their own
    security in a context of frequent terrorist attacks against representative of
    the state, servicemen must obviously keep some secrecy regarding their own engagement.
    It is not only an elementary professional skill; it is a primary need, for the
    consequences are often serious. Here, I will talk examine how servicemen’s lack
    of discretion on social networks could harm the entire security organization.
    (1) First, I will discuss the e-reputational damage. (2) Then, I will focus on
    the risk of compromising missions, which is a threat that sometimes leads to (3)
    tragic and deadly endings.


    ## Reputational Harm


    In a famous article published in 1999, U.S.M.C. general Charles C. Krulak insisted
    on the role of “strategic corporals” in modern wars, that is to say, in asymmetric
    conflicts mixing peacekeeping and humanitarian aid in an over-mediatised atmosphere.
    His aim was to demonstrate that a low-rank private could seriously compromise
    the mission—and the campaign as a whole—if a wrong decision with negative consequences
    were to be mediatised.^([2](#chapter2.xhtml#footnote-2)) Subsequently, French
    retired colonel and academic Michel Goya tried to propose a mathematical formula
    for Krulak’s concept. Namely, he wrote, “We could formulate an equation of the
    strategic corporal with the following elements:


    - `F` representing the initial folly

    - `R` representing the portrayal of the folly

    - `S` representing its spreading in the media

    - `C` representing the unfavourable context.


    Note that `C` resonates with `F`. Indeed, an unfavourable context leads to folly,
    either deliberately because of provocative actions or simply due to an atmosphere
    of distrust.”^([3](#chapter2.xhtml#footnote-3))


    In April 2004, human rights violations committed by US Army and CIA personnel
    against detainees in the Abu Ghraib prison in Iraq came to public attention. The
    scandal tarnished the reputation of the US Army, whose mission was supposed to
    promote democracy and human rights. Condemned both within the United States and
    abroad, the affair is a textbook case of the strategic corporal’s negative effect
    in cases of misconduct. Indeed, the infamous photos have remained visible on the
    Web, years after the prosecution and condemnation of black sheep servicemen.


    Devastating for the reputation of the armed forces, dubious video with dead or
    submissive persons rapidly go viral because of the easy sharing on websites like
    `YouTube`. Similarly harmful, explicit references to renegade political regimes
    made by individuals wearing a uniform generally force top officials to condemn
    them. Haunted by its painful history and extremely vigilant when it comes to ethical
    issues, the Bundeswher was shaken by a “desecration of skulls” scandal in 2006.^([4](#chapter2.xhtml#footnote-4))
    In the same vein, German, Australian, or French armies—among others—have been
    confronted with leaked photos and videos showing servicemen praising the Third
    Reich.^([5](#chapter2.xhtml#footnote-5)) However, praising horrors is not the
    only way for servicemen to tarnish the reputation of the institution they serve
    in. Numerous apparently “benign” cases underline how powerful and hurtful speeches
    and opinions by personnel may undermine the armed forces’ image. For example,
    both the *gilets jaunes* (“yellow jackets”) and the anti-gay marriage movements
    have been praised by an unknown number of members of the French Ministry of Defense.
    As individuals, they benefit from the liberty to demonstrate, provided they are
    dressed in civilian clothing. However, any incident or violence they are involved
    in during a demonstration is generally mentioned in the media, as is their membership
    in a public institution. Obviously, this does not mean that there are plenty of
    servicemen who belong to militant groups attacking the police and causing extensive
    damage. At the same time, during arrests of rioters and looters, some suspicious
    passers-by have been known to work for Defense. Even though they could be found
    innocent—black sheep do exist, let’s not deny it—the career consequences are hardly
    ever neutral.^([6](#chapter2.xhtml#footnote-6))


    There are other types of reputational risks besides servicemen holding objectionable
    opinions or taking part in violent riots. Between 2011 and 2016, the scandal over
    `Louvois`, the defective software dedicated to pay the wages of Army personnel,
    was directly responsible for massive unpaid wages, provoking delicate personal
    financial situations. In 2012 only, members of the army experienced an estimated
    465 million Euros in unpaid wages. While the Ministry of Defense did recognize
    the situation as a failure and acknowledged its shameful consequences, committees
    of servicemen spouses and partners popped up on social networks to denounce the
    unbearable circumstances into which they were thrust. The breaking of a kind of
    omertà suddenly enabled the media to address the consequences for families and
    the amount of public funds wasted in this dramatic failure.^([7](#chapter2.xhtml#footnote-7))
    Due to the outrage people expressed over the scandal, the Army had no choice but
    to jettison `Louvois` and replace it with a new software. For our purposes, even
    though the burden of responsibility rested with the politicians who had decided
    to implement the defective software, the scandal damaged the Army’s reputation.
    Considering the slow political response and the hidden pressures some servicemen
    experienced from their hierarchy to silence some spousal committees, many soldiers,
    NCOs, officers, and their relatives did interpret the situation as a form of disrespect.


    ## Compromising Missions


    In addition to the risk of tarnishing the reputation of the Armed Forces, misuses
    of social network sites are very likely to compromise mission safety. What are
    we talking about, precisely? In any operation, one of the key success factors
    is keeping the highest possible level of confidentiality. When the enemy knows
    the very moment, the place, or the composition of the detachment, he is then capable
    to respond appropriately, adapting his own modes of action to foil ours. Indeed,
    knowing the enemy is essential to anticipating his modes of action. That is the
    reason why all Armed Forces have an intelligence service dedicated to the understanding
    of the enemy. However, the Armed Forces are not the only actors that try to adopt
    the opposite point of view.


    The military capabilities of the enemies the French army has been fighting since
    the 2000s are inferior by far to French standards. However, it would be a serious
    mistake to consider these terrorist armed groups as being unable to seek out information
    on our capabilities and modes of action. Certainly, their intelligence cells have
    limited means. Until we are shown proof to the contrary, the Islamic State or
    other Islamic armed groups in the Sahel lack high-tech intel capabilities such
    as satellites, electronic warfare, air support, or Special Forces operators. On
    the other hand, it would be risky to assume they are unimaginative. They have
    discernible capabilities of diverting certain technologies from their primary
    purpose or adapting obsolete military equipment to meet new needs. Those so-called
    barefoot thugs dressed in rags and driving rusty pickup trucks know how to design
    unpiloted armed aerial vehicles, send encrypted messages, and infiltrate government
    departments and agencies.

