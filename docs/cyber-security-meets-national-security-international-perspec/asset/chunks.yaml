    ## Digitalizing the World: The Era of Invisible Power


    **Thomas Flichy de La Neuville (Rennes School of Business)**


    ### Introduction


    It is clear that the digitalization the world, which interconnects people and
    equipment, represents a major civilizational transition. It is changing the ways
    in which power is exercised, partly concealing it from public view. Hackers operate
    anonymously, attacking websites that collect unwitting users’ information.([1](#chapter1.xhtml#footnote-1))
    The cybernetic era is therefore making power less perceptible and this, in turn,
    makes research into this current technological shift crucially important.([2](#chapter1.xhtml#footnote-2))
    However, this endeavor is not without risk. There is a danger that we mistake
    advances in digital technology for the true vitality of a civilization built on
    the ability to breathe new life into every part of society.([3](#chapter1.xhtml#footnote-3))
    Currently, the real and virtual worlds are hybridizing, generating fears around
    human life being stripped away in favor of technology. This concern is balanced
    out by hopes that a form of digital humanism will arise. Still, the situation
    is difficult, because invisible power is not easy to spot.([4](#chapter1.xhtml#footnote-4))


    Indeed, one of the dilemmas faced by research into cybersecurity is that most
    data is not accessible to the wider public. This complex field of study can only
    be deciphered using the technical capabilities of the army or intelligence services.
    Still, it is possible to overcome this barrier by exploring the sources of information
    at either end of the chain. Upstream, a small number of philosophers are reflecting
    critically on the digital world. One example is Bernard Stiegler, who considers
    that the internet is a disruptive technology, in that digital automation leads
    to tax avoidance and unemployment.([5](#chapter1.xhtml#footnote-5)) Eric Sadin,
    meanwhile, defines artificial intelligence (AI) as a kind of rationality that
    interprets various situations in real time in order to continually propose services
    and products, a technoliberalism aiming to mould behavior. Lastly, Kave Salamatian
    sees the internet as a many-tentacled beast with a hyperconnected heart, whose
    underwater infrastructure provides an indication of the state of digital geopolitics.([6](#chapter1.xhtml#footnote-6))
    Downstream, various blogs and websites testify to the current vitality of technology.
    It is useful to cross-reference technology website `Wired.com`, which is written
    for a nonspecialist audience, with French websites `InternetActu.net` and `Reflets.info`,
    which offer a more critical view.


    Various blogs and websites testify to the current vitality of technology. It is
    useful to cross-reference technology website `Wired.com`, which is written for
    a nonspecialist audience, with French websites `InternetActu.net` and `Reflets.info`,
    which offer a more critical view.


