    34.  [34](#chapter1.xhtml#footnote-34-backlink) Cybercrime can sometimes be a
    proxy for military action. This was the case for these Iranian cyberattacks, which
    were designed to relieve pressure on the country during the embargo.


    35.  [35](#chapter1.xhtml#footnote-35-backlink) They hacked into *Charlie Hebdo*’s
    website, for instance, in 2011.


    36.  [36](#chapter1.xhtml#footnote-36-backlink) In 2017, representatives of the
    Herzliya-based NSO Group Technologies held a series of meetings in Vienna and
    at least one Gulf nation, during which a $55 million contract was signed to supply
    Saudi Arabia with its famous Pegasus spyware. On the opposition side, Jamal Khashoggi
    and Omar Abdulaziz wanted to set up a cyber-opposition movement.


    37.  [37](#chapter1.xhtml#footnote-37-backlink) The lack of local training and
    a general lack of awareness of the dangers of cyberattacks have left the kingdom
    exposed.


    38.  [38](#chapter1.xhtml#footnote-38-backlink) Voice cloning is now a reality.
    Using a single minute of recorded audio, Lyrebird and Wave Net can digitally recreate
    an individual’s voice to have him or her “say” whatever they want. Similarly,
    Stanford University has demonstrated facial control in which a person’s facial
    expressions are recorded live but edited by an actor, with a computer instantly
    reproducing the latter’s movements yet with any target person’s face. Such deepfakes
    can attack individuals, organizations, and states. University College London has
    developed its *My Text in Your Handwriting* program to accurately reproduce a
    person’s handwriting from a single sample. A talking robot named Luka mimics the
    characters from the TV series *Silicon Valley*, recycling dialogue from the first
    two seasons. The robot responds to questions by generating new phrases based on
    the models provided to it. In 2022, it is believed that populations in developed
    nations will read more fake news than genuine information. Automatic text, image
    and audio generators could contaminate the entire human communication network.
    8.5 percent of Twitter accounts are already run by bots.


    ## The “Strategic Corporal”: Facing the Cyber Threat in French Armies and Homeland
    Security Forces


    **Antoine-Louis de Prémonville (officer in the French Army** **and independent
    researcher in History and Geopolitics)**


    ### Introduction


    The young men and women joining the ranks of the French Army and homeland security
    forces every year have a lot in common with their fellow citizens. Their habits,
    leisure, and tastes are those promoted in the everyday life. Contrary to the cliché,
    French servicemen don’t live on the fringes of society. Most of them surf the
    Web and use social networks to keep in touch with their family and relatives while
    serving in France or overseas. In fact, nothing in particular seems to protect
    them against exterior threats; on the contrary, their activities make them valuable
    targets. Indeed, the French Armies and other security services have tended to
    adopt the newest trends and technologies for communication and self-promotion.
    Nowadays, the internet is available in every boot camp and most officers daily
    send e-mails daily for internal communication.


    Granted by the French constitution, servicemen have the same rights as any other
    citizens —even if they obtained the right to vote after women, on August 17, 1945!
    However, among the very specificities of the military, they have a duty to exercise
    restraint regarding political, philosophical, and religious opinions, in order
    not to harm the e-reputation of the Armies.


    As the very last wardens of the Republic, the armed forces should not allow servicemen
    to express personal points of view in the name of the institution. The dangers
    of this are clear. For example, even though some service members served loyally
    as members of Parliament under the Third Republic, the government at the time
    feared the influence of conservative officers, most of them Catholic, Bonapartist,
    or royalist. That is the reason why an 1875 law disqualified them from standing
    as candidates for parliament election. Admittedly, Field Marshal de Mac Mahon
    openly endorsed plans for royalist restoration and General Boulanger had planned
    a military coup. Loyal but openly reluctant in his support for the republic, Field
    Marshal Lyautey was far too critical as a secretary of war. And, of course, we
    cannot forget Field Marshal Pétain and the Vichy regime.


    Yet, today, expressing discord with the official line seems inconceivable. Recall
    that the army’s nickname is the “Big Mute” ( *la* *Grande Muette*)! Even if servicemen
    can be elected to Parliament, they must leave office for the duration of their
    term.^([1](#chapter2.xhtml#footnote-1)) Along with the preservation of the reputation
    of the armed forces, the discretion of servicemen on social networks is thus a
    professional imperative.'
