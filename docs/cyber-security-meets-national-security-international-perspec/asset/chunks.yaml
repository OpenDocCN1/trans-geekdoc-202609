    Primary source data came from interviews with some selected participants drawn
    from different categories, as well as from the policy document on cybersecurity
    adopted by the Nigerian government and other reports from relevant agencies. A
    total number of thirty interviewees were selected, to be sorted in four categories
    coded as `category A`, `B`, `C`, and `D`.


    In `category A`, eight military or paramilitary security personnel were selected
    from different agencies directly dealing with security issues. A senior security
    officer in Nigerian military was selected based on accessibility and possession
    of quality relevant data on the subject matter of study; another senior officer
    from the Nigerian Police Force was chosen based on accessibility and possession
    of valuable information. Other interviewees in this category included a senior
    officer from the Department of State Security, a senior officer from the Nigerian
    Immigration Services, a senior officer from the Nigerian Prison Services, a senior
    officer from the Nigerian Security and Civil Defense Corps, a senior officer from
    the Nigerian Custom Services, and a senior officer from the Nigerian Federal Road
    Safety Corps.


    In `category B`, ten senior officials were chosen from institutes and agencies
    handling security issues, including two senior officials from the National Institute
    for Policy and Strategic Studies (`NIPSS`) Kuru Jos, two senior officials in the
    National Defense Academy (`NDA`), two senior officials from the Nigeria Police
    College Wudil Kano, two senior officials from the Ministry of Defense, and two
    senior officials from the National War College Abuja. For its part, `category
    C` comprised academicians, wherein six professors were selected from three universities
    based on the proximities of the researchers. Two are professors in political science
    with specialization in security and strategic studies from a reputable national
    university, two are professors of computer science with specialization in cybersecurity
    and digital environment, and the last two are professors of sociology with specialization
    in criminology from a reputable national university.


    In `category D`, six members of private institutions that deal with cyber activities
    were selected randomly and interviewed. These comprise a senior bank official
    in Abuja in one of the commercial banks, two senior officers from the telecommunications
    companies operating in Nigeria, a senior official in the Nigerian Communication
    Commission (`NCC`), a senior official from the Nigerian Technology Development
    Agency (`NITDA`), and a senior official from the Federal Ministry of Communication.
    All of them were selected and interviewed in Abuja, where their head offices are
    located.


    There were three criteria used to identify the informants to be interviewed for
    this study. The first was the identification of stakeholders who are closely linked
    and related to the subject matter of national security, cybersecurity, and cybercrime
    and digital economy. The researchers were instructed by various agencies and ministries
    to consult staff or units on cybersecurity in security parastatals and other ministries.
    They were directed by senior officials there to consult the most informed in the
    unit on the subject matter of cybersecurity. The selected informants were interviewed
    based on the condition of anonymity and confidentiality. The second criteria used
    was the accessibility. For instance, academicians who were consulted were chosen
    based on accessibility in addition to their possession of in-depth knowledge on
    the subject matter; the same was true for some government ministries and agencies.
    The third criteria used was based on Sharan’s postulate (2009) that the minimum
    number of interviewees for a qualitative research project should be either four
    or five and that the maximum should be thirty, depending on the availability of
    the resources and informants with quality information.


    While the questions were prepared separately for each category, some general questions
    were posed to all four categories of interviewees. Semistructured questions were
    designed to enable for flexibility and free flow of information from the informants.
    The method used for gathering the data was written questionnaires organized in
    semistructured sessions, adapted to the different categories of the informants.
    Some of them were interviewed through phones, some responded through email, and
    others through WhatsApp.


    Finally, as mentioned, the other primary sources of data included the government
    policy document on cybersecurity enacted in 2015 by the Nigerian government, together
    with various reports by national and international agencies on cybersecurity in
    Nigeria. Secondary sources consisted of books, journals, and internet sources
    relevant to the topic at hand. The data obtained were grouped into themes and
    analyzed using content analysis in which the previously existing literature was
    analyzed in relation to the findings of this work and the application of the theoretical
    framework for conclusion and findings.


    ## Discussion and Findings


    This section discusses the major findings from the fieldwork, contextualizing
    it within the existing literature and the adopted theoretical framework, which
    enabled the identification of the knowledge gap and contribution to knowledge.
    The data are discussed in thematic form under three major themes: perspectives
    on challenges and prospects of cybersecurity in Nigeria, the effects of cybercrimes
    on Nigeria’s national security, and implications of cybercrime for the digital
    economy.


    ### Perspectives on Challenges and Prospects of Cybersecurity in Nigeria


    We have previously noted the rapidly increasing number of internet and computer
    users in Nigeria, a population that is vulnerable to cybersecurity breaches and
    cybercrime. The potential for negative outcomes has been further escalated with
    the emergence of social media usage in the country, to include emails, Facebook,
    WhatsApp, Telegram, YouTube, Instagram, and many other technologies. In addition
    to data presented earlier, we should note that digital growth indicators from
    2019 to 2020 show that mobile connections increased by 12 million (+7.7 percent),
    the number of internet users grew by 2.2 million (2.6 percent), and active social
    media users increased by 3.4 million (14 percent). These data substantiate the
    conclusion that Nigeria has been going digital rapidly in recent years: for example,
    from 2013 to 2019 the number of internet users increased from 51 million to 93
    million, as seen in [figure 2](#chapter3.xhtml#fig2).


    **Figure 2: Number of Internet Users in Nigeria from 2013 to 2019**


    ![Images](images/pg-46.jpg)


    **Source: Adopted from Statista 2019.**


    Another source from the Nigerian Communication Commission (`NCC`) disclosed the
    figure of internet users in Nigeria as 111.6 million in December 2018, an increase
    of more than 10 million over Statista’s data. In any event, the increase in the
    use of social media also contributes to the vulnerability and exposure of the
    private users and government agencies, organizations, and corporations to cybercrime.


    The figures above imply that there is a clear need in Nigeria for allocating a
    huge sum of money and adopting a strong policy on cybersecurity in order to minimize
    vulnerability and effectively combat related crimes. Indeed, this was the justification
    for the adoption of the Cybersecurity Act in 2015. On the other hand, Nigeria
    faces a serious challenge in the cybersecurity sector because of poor infrastructure,
    low levels of digital know-how and low-level information transmission. The 2018
    Cybersecurity Index concisely pinpointed Nigeria’s vulnerabilities in this regard
    ([table 1](#chapter3.xhtml#tab1)).


    **Table 1: Nigeria’s Cybersecurity Index 2018**


    | **Rank** | **National Cybersecurity Index** | **Digital Development Level**
    | **Difference** |

    | --- | --- | --- | --- |

    | 45 | 44.16 | 35.86 | 8.30 |

