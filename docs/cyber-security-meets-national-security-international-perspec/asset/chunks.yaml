    \ Networks 财团已开始在巴西的福尔塔萨和华尔街之间建立海底光纤连接。该项目被称为 `Seabras-1`，最终将通过南非连接非洲金融市场。\n\n\
    # 22. 自 2009 以来，新喀里多尼一直通过 `Gondwana-1` 电缆与澳大利亚连接，确保了其最快的通信速度。Orange 公司还计划将法属圭亚那与加勒比连接起来。\n\
    \n# 23. 美国对日益增长的中国投资做出了激烈反应。2013 年，美国政府阻止了在纽约和伦敦之间铺设一条跨大西洋电缆的计划，中国公司 `华为` 本打算参与其中。\n\
    \n# 24. 自 2019 年 2 月以来，`SACS` 电缆将安哥拉与巴西连接起来，而 `ELLALINK` 则通过佛得角将葡萄牙与巴西连接。\n\n\
    # 25. GAFAM 的系统在历史上与极具流动性的威尼斯贡船公司具有相似性，后者能够将旅行者分享的信息传递给总督。\n\n# 26. 中国的努力与美国在\
    \ 20 世纪 50 年代试图阻止苏联进入核和航空航天领域的方式之间存在相似之处。\n\n# 27. 值得注意的是，尽管法国具有法律稳定性和普遍吸引力，但由于其僵化的劳动法，法国在过去的二十年里未能在技术领域创造出任何突破性的创新。\n\
    \n# 28. 网成瘾者被视为需要纠正行为的“偏离者”，也被视为需要医疗帮助的“病人”。\n\n# 29. 这一系统基于某些美国保险公司使用的问卷。\n\n\
    # 30. 例如，阿尔及利亚——一个被认为最不安全的国家——在 2017 年不得不派遣专门的网络警察来监控其高中毕业考试。\n\n# 31. 2017 年耗资\
    \ 8 亿美元。\n\n# 32. 黑客是极备受追的的。事实上，迪拜甚至举办了一场黑客博览！\n\n# 33. “算法”一词是由九世纪的波斯数学家花拉子子发明的。\n\
    \n# 34. `Charlie Hebdo` \n\n# 35. `NSO Group`\n\n# 36. `Silicon Valley`\n\n# 37.\
    \ `My Text` \n\n# 38. `Lyrebird` 和 `WaveNet`\n\n## “战略士兵”：面对军队和国土安全面临的网络威胁\n###\
    \ Antoine-Louis de Prémonville（法国陆军军，历史与地缘政治独立研究员）\n\n#### 引言\n每年加入法国军队和国土安全部队的男女与他们的公民有许多共同点。他们的习惯、休闲活动和口味都是受推崇的。与刻板印象不同，军人并非生活在社会的边缘。大多数人在法国或海外服役期间会通过浏览网页和使用社交网络与家人属保持联系。事实上，似乎没有什么东西可以保护他们免受外部威胁；相反，他们的活动使他们成为有价值的目标。事实上，法国陆军和其他安全部门倾向于采用最新的趋势和技术进行通信和自我宣传。如今，每个训练营都有互联网，大多数军官每天都会发送电子邮件。\n\
    \n根据法国宪法，军人享有与任何公民相同的权利——尽管他们是在 1945 年 8 月 17 日比女性晚才获得投票权。然而，在军事的特殊性中，他们有义务在政治、哲学和宗教观点上保持克制，以免损害军队的声誉。\n\
    \n作为共和国最后的守卫者，武装力量不应允许军人以机构的名义表达个人观点。这种的危险是显而易见的。例如，尽管一些军人曾在第三共和国时期忠诚地担任议会议员，但当时的政府担心保守军官的影响，这些军官大多数是天主教徒、波拿仑主义者或王党者。这就是为什么\
    \ 1875 年的一法律取消了他们竞选议员的资格。诚然，马农陆元帅公开支持王室复辟的计划，而布朗热尔将军曾计划发动军事政变。虽然忠诚但在对共和国的支持上公开表现不情愿，利奥泰元帅担任战争部长期间过于具有批判性。\n\
    \n然而，在今天，对官方路线表示分歧似乎是不可思议的。记住，军队的绰号是“大哑巴者”（*la* *Grande Muette*）！即使军人当选为议员，也必须在任期内离职。因此，在维护军队声誉的同时，军人在社交网络上的谨慎是一项职业要求。\n\
    \n"
