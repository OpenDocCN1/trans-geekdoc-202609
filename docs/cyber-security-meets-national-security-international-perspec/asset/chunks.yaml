    AI 首先是关于情感的。¹³ 事实上，网络攻击（通常由国家支持）是三种古老实践的复杂版本，即`破坏`（sabotage）、`间谍`（espionage）和`颠覆`（subversion）。¹⁵
    尽管这些操作的成本已大幅，但网络破坏的范围仍然有限。尽管如此，事实证明它可以以各种方式造成损害：现在有可能炸管道、决大坝、干扰雷达、推迟核计划、关闭银行、接管汽车或通过给手机设置陷阱杀害某人。¹⁶
    网络间谍活动是真正的增长领域：今天，间谍们被海量的被盗数据所淹没，导致他们无法解释所有脱离了其文化背景的信息。在间谍世界中，攻击变得日益复杂。例如，某些病毒在执行过程中会自我删除，使其无法追踪。¹⁷
    它们还可以像生物病毒一样发生变异。¹⁸ 至于颠覆，虽然在网上发起抗议运动很容易，但长期维持非常困难。因此，破坏使得世界的数字化进程在暂时变得更加困难，而间谍活动则收割我们持续连接的成果。最终，只有非商业性的颠覆能够危及当前的数字化转型，但其执行频率太低，尚构成威胁。


    在研究了数字革命的运作后，我们现在可以勾勒出潜在的后果。


    ### 数字帝国 vs. 属国


    数字化世界的地缘政治具有三个主要趋势：美国权力的侵蚀、中国权力的增长，以及两国在数字上殖民世界其他地区的竞争。


    #### 美国权力的侵蚀


    美国权力通过寡垄断进入虚拟世界：`GAFAM`。它由五家大企业（`Google`、`Apple`、`Facebook`、`Amazon` 和 `Microsoft`）组成，并由黑客创立。¹⁹
    它在物理上存储信息。²⁰ 因此，80% 的数据通过美国，且监听站部署在电缆着陆点。²¹ 控制电缆的地缘政治影响包括加剧海外领土的依赖性、²² 最重要的是，为了应对美国的支配，其他参与者越来越多地采取了反措施：例如，为了躲避美国的监控，巴西建立了自己连接西班牙的电缆链路。同样，中国建造了
    `Sea-me-we 5` 海缆以连接中东并最终到达欧洲。例如，华为海洋通信（Huawei Marine）集团正在铺设更多的海底电缆，例如在巴西和喀麦隆之间。


    由于 `GAFAM` 的行为像一个国家，丹麦在 2017 年向其派遣了一位大使。事实上，它更像是一个盗窃国家，依靠偷取的数据生存，其信仰体系同时借鉴了左翼自由意志主义和右翼的技术决定论。²⁵
    产生的技术自由主义由富有远见、富有魅力的创始人推崇，他们创造了在技术上始终领先的创新商业产品。在投资基金的支持下，`GAFAM` 在 2016 年的研发上花费了
    580 亿美元。他们的垄断地位部分归功于活跃在`硅谷`的优秀中国和印度才智。然而，他们仍在与中国竞争，而中国正试图阻止他们进一步发展。²⁶ 为了在这种环境中维持其主导地位，美国必须加速与欧洲的工业整合。而欧洲方面，如果希望重新建立数字主权，则需要加倍自身在数字技术方面的努力和投资。²⁷
    如果否则，它将不得不接受战略联盟，使其沦为仅仅是一个数字属国。


