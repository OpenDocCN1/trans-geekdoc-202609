  trans: '


    为了在频繁针对国家代表的恐怖袭击背景下，不损害行动的机密性和自身的安全，军人员显然必须对自己的参与情况保持某种保密。这不仅是一项基本的职业技能，更是一种基本需求，因为其后果往往非常严重。在这里，我将探讨军人员在社交网络上缺乏谨慎的行为如何损害整个安全组织。(1)
    首先，我将讨论网络声誉损害。(2) 其次，我将关注任务受损的风险，这种威胁有时会导致 (3) 悲剧性和致命的结局。


    ## 声誉损害


    在 1999 年发表的一篇著名文章中，美国海军陆战队将查尔斯·C·克鲁拉克（Charles C. Krulak）强调了“战略下士”在现代战争中的作用，即在高度媒体化的环境下，混合了和平维持与人道主义援助的不对称冲突。他的目的是证明，如果一个具有负面后果的错误决定被媒体化，一个低级士兵可能会严重损害任务——乃至整个战役。(2)
    随后，法国退休上校、学者米歇尔·戈雅（Michel Goya）试图为克鲁拉克的概念提出一个数学公式。即他写道：“我们可以用以下要素建立战略下士的方程：


    - `F` 代表最初的愚蠢

    - `R` 代表对这种愚蠢的描述

    - `S` 代表其在媒体中的传播

    - `C` 代表不利的背景


    注意，`C` 与 `F` 呼应。事实上，不利的背景会导致愚蠢行为，要么是由于故意的挑衅，要么仅仅是因为一种不信任的氛围。”(3)


    2004 年 4 月，美国陆军和 CIA 人员在伊拉克阿布格莱布监狱对被留者实施的人权侵犯引起了公众关注。这一丑闻损害了美国陆军的声誉，其任务本应促进民主和人权。该事件在美国国内外都遭到了谴责，是战略下士在行为不当时产生负面影响的教科书案例。事实上，在对害分子军人员进行起诉和谴责多年后，那些臭名照片在网络上依然可见。


    对于武装部队的声誉来说是毁灭性的，带有死者或顺从者的可疑视频因 `YouTube` 等网站易于分享而迅速病毒传播。同样有害的是，穿着制服的人员对叛乱政权的明确提及通常迫使高层官员对其进行谴责。德国联邦军（Bundeswehr）深受其痛苦历史的困扰，并在伦理问题上极度警惕，但在
    2006 年因“亵渎头骨”丑闻而受到震惊。(4) 同样，德国、澳大利亚或法国军队等也面临过泄露的照片和视频，视频中显示军人员在赞美第三帝国。(5) 然而，赞美恐怖主义并非军人员损害其所属机构声誉的唯一方式。许多看似“无害”的案例凸显了人员强大且伤人的言论和观点可能如何破坏武装部队的形象。例如，“黄马甲”（*gilets
    jaunes*）和反同性婚姻运动曾受到大量法国国防成员的赞扬。作为个人，只要他们穿着便服，就享有示威的自由。然而，他们在示威期间涉及的任何事件或暴力行为通常会被媒体报道，他们作为公共机构成员的身份也是如此。显然，这并不意味着有大量属于攻击警察并造成广泛破坏的激进组织的军人员。与此同时，在逮捕暴乱者和劫夺者期间，已知一些可疑的路人为国防部门工作。尽管他们可能被证明是无的——害分子确实存在，我们不否认——但职业后果几乎不是中性的。(6)


    除了军人员持有反感意见或参与暴力暴乱外，还有其他类型的声誉风险。2011 年至 2016 年间，`Louvois`（一个用于发放陆军工资的缺陷软件）丑闻直接导致了大规模欠薪，引发了敏感的个人财务困境。仅在
    2012 年，军人就遭受了估计 4.65 亿欧元的欠薪。虽然国防部承认这种情况是一种失败并承认了其可耻的后果，但军人员配偶和伴侣组成的委员会在社交网络上出现，谴责他们推入的无法忍受的境地。这种沉默的打破让媒体能够关注对家庭造成的影响以及在这场戏剧性失败中浪费的公共资金数。(7)
    由于人们对这一丑闻表达的愤怒，陆军别无放弃 `Louvois` 并用新软件取代它。对于我们而言，尽管责任在于决定实施该缺陷软件的政治家，但该丑闻损害了陆军的声誉。考虑到政治反应的缓慢以及某些军人员面临的层级要求其某些配偶委员会的隐性压力，许多士兵、士官、军官及其家属将这种情况视为一种不尊重的形式。


    ## 损害任务


    除了损害武装部队声誉的风险外，滥用社交网站还极有可能损害任务安全。我们具体在讨论什么？在任何行动中，成功的关键因素之一是保持尽可能可能的机密性。当敌人知道确切的时刻、地点或分队的组成时，他能够做出适当反应，调整自己的行动模式来瓦解我们的行动。事实上，了解敌人对于预测其行动模式至关重要。这就是为什么所有武装部队都有专门研究敌人的情报部门的原因。然而，武装部队并非试图采取相反观点的唯一参与者。


    法国军自 21 世纪以来一直战斗的敌人，其军事能力远低于法国标准。然而，如果认为这些恐怖武装团体无法寻找有关我们能力和行动模式的信息，将是一个严重的错误。诚然，他们的小组手段有限。在看到反面证明之前，伊斯兰国或萨赫勒地区的其他伊斯兰武装团体缺乏如卫星、电子战、空中支援或特种部队人员等高科技情报能力。另一方面，假设他们缺乏想象力是有风险的。他们具有明显的能力，可以将某些技术偏离其用途或调整过时的军事设备以满足新需求。那些穿着破烂衣服、开着生锈皮卡车的所谓“光脚小子”，知道如何设计无人武装飞行器、发送加密信息并渗透政府部门和机构。


