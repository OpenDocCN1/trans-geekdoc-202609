    ## 理论框架：Alagappa (1987) 的发展中国家国家安全模型


    本研究采用并扩展了 Muthiah Alagappa (1987) 提出的“发展中国家国家安全”模型，下文对其进行了展示和讨论。我们之所以这样做有三个原因。首先，该图中所描绘的价值链和清晰的插图便于理解所涉及的概念，即国家安全以及可能的脆弱性和威胁。其次，以往针对我们研究案例的研究使用了其他理论，如政治现实主义、集体安全、外交政策分析及其他相关框架，但没有一个理论提到了这一框架，这清楚地证明了本研究的创新性、贡献以及所提出的新观点。第三，该理论本身为未来的理论构建留下了空间。该理论最初开发于
    1987 年，在当时发展中国家的网络安全和网络犯罪几乎不存在的时期，它识别了对发展中国家国家安全的内部和外部威胁。但它的假设为探索政治、社会、经济和环境领域的威胁留了门门，使研究人员能够基于原始假设并在该理论的基础上进行构建，进一步发展社会科学领域的知识。


    **图 1：发展中国家国家安全：分析框架**


    ![Images](img/pg-40.jpg)


    **来源：Muthiah Alagappa (1987)。由研究人员扩展。**


    上述模型表明，国家安全本质上面临两大主要威胁：内部威胁和外部威胁，两者都可能是传统的或非传统的。在内部情况下，可能会出现社会不协调和其他脆弱性，这可能导致武装团体的出现——这是一种传统威胁；而在外部层面，可能存在领土和国家利益问题，导致一个国家与另一个国家发生常规军事冲突。从非传统的角度来看，经济、地理、社会环境或海陆权利等问题可能是潜在的冲突，可能导致像尼日利亚这样的发展中国家面临内部和外部的不安全。例如，此处的博哈拉姆（Boko
    Haram）案例既属于尼日利亚面临的传统和非传统威胁，也属于内部和外部安全威胁。威胁的性质可以是经济、军事性的、政治性的，或者正如我们在本研究中提出的，与恐怖主义、粮食不安全或网络攻击有关。因此，正如
    Alagappa (1987) 所指出的，任何寻求绝对国家安全的严重发展中国家都必须关注内部和外部安全，并且必须极力考虑传统和非传统的军事威胁。


    Alagappa (1987) 提出的框架适用于本研究，因为它具有对尼日利亚等国家国家安全提供全方位解释的优势，即兼顾了传统和非传统的威胁。上述节中讨论的其他理论框架可以解释网络安全和网络犯罪的政治角度或经济视角。然而，我们所依赖的理论在理论和实证分析方面都是全包容的。例如，通过观察尼日利亚手机和互联网的用户数量，并检查网络犯罪导致的数十亿美元损失，人们可以很容易地利用这一框架来建立并说明这些现象与国家安全有关。政府在财政单一账户（`TSA`）中存入数万尼日拉，以及每月用于集成人员薪资信息系统（`IPPIS`）支付工资的数百亿尼日拉，如果……就构成了一个脆弱性节点。


