    | 1 | 人们未能从数字交易中获益，导致技术普及率低 |

    | 2 | 网络空间被误用于琐碎活动，而非有生产性的事业 |

    | 3 | 企业现在发现运营日益困难 |

    | 4 | 小规模企业在电子商务领域没有得到发展 |

    | 5 | 投资遭受损失并被浪费 |

    | 6 | 电子商务中的公众信心受到影响 |


    **来源：研究人员于 2018 年 7 月至 12 月期间对选定受访者进行访谈的实地调查。**


    与之前一样，一些受访者的主要观点有必要在此引用。其中一人透露道：“尼日利亚人现在正足足家中通过电子商务和数字购物享受数字经济。但意识不足、缺乏接触、脆弱性以及脆弱的网络安全正威胁着该国数字经济的革命，尽管现实是该国如果不数字化将无法生存，该国记录的黑客和网络诈骗者的巨额损失表明数字经济面临着严峻的挑战”（2018
    年 8 月 6 日上午 10:00 与 C 类类受访者的访谈）。另一位受访者透露：“由于该国网络犯罪的发发生率惊人，尼日利亚的企业发现很难为客户简化交易，甚至由于黑客攻击和该国脆弱的网络安全，政府自身向电子治理和电子交易的转型也很缓慢”（2018
    年 8 月 17 日下午 3:00 与 A 类类受访者的访谈）。


    ### 结论与建议


    研究得出结论，尼日利亚通过建立`2015 年网络安全法`（Cybersecurity Act 2015）意识到网络安全的重要性，这是对该国近期出现网络犯罪的直接反应。该研究在实证和理论方面都对学术文献做出了贡献。在实证方面，研究揭示了有关尼日利亚移动和互联网用户的统计数据，以及该国的数字在线活动。它报告了受访者关于网络犯罪对尼日利亚国家安全和数字经济影响的科学观点。在理论方面，该研究成功地将国家安全和网络安全领域的各种现有假设与该研究领域的新实证证据联系起来。该研究在政策方面也具有意义，为网络安全政策制定提出了一些建议以防止尼日利亚的网络犯罪。建议列如下：


    1. 政府和其他负责 ICT 监管的机构应提高公众意识，强调防止安全代码和其他重要信息在网上泄露的性；

    2. 应提高人们的敏感性，让他们向负责网络安全政策的机构报告可疑交易；

    3. 应聘请专家对相关机构的现有员工进行网络安全技术培训，以便于识别威胁；

    4. 应每季度定期举办研讨会和媒体广告，以告知公众、组织和政府机构网络犯罪的工作原理以及如何采取保护措施；

    5. 被捕获网络犯罪活动的人应根据`2015 年网络安全法`的规定受到严厉惩罚。


    ### 资金致谢


    本研究工作在`Diya`的`grant`援助下完成。


