    Considering their ability to inflict casualties and, what is more, to keep on
    fighting for years despite the limited means at their disposal and the tremendous
    losses experienced, we need to face that they have true professional skills. Moreover,
    maybe should we admit, too, that this enemy knows us better than we know him.
    Many terrorists were born and raised in Europe. Western pop culture influences
    anyone watching the television or listening to the radio anywhere in the world.
    That is the other side of soft power’s double-edged sword. Hence, it would very
    be risky to underestimate the existing threat to the point where no safety precautions
    are taken. The ability to surf the `Web` and connect to social network sites is
    easily accessible worldwide. Moreover, accessing personal data nowadays is all
    the easier given that people share them with sometimes unknown third parties on
    the `Web`. Some people publicly share so many photos, videos, and posts on `Facebook`,
    `Twitter`, `Instagram`, `YouTube`, and so on, that one can easily establish a
    file on them. Unfortunately, some members of the armed forces (or any other public
    agency) misuse the online networks. Were an agent to forget that the `Internet`
    is not a forum for discussion about their missions but a means to stay in touch
    with relatives, he would compromise his mission. Such a situation is not hypothetical.
    One of the most famous cases happened in 2010, within the Israeli army. Specifically,
    an Israeli private published a post on `Facebook` revealing details of an upcoming
    mission in the West Bank: “On Wednesday we are cleaning out the village of Katana
    (nr Ramallah) – today \[an\] arrest operation, tomorrow an arrest operation and
    then please god, home by Thursday.” Other servicemen reported the post to the
    unit’s commanding officer, who decided to cancel the mission for fear that operational
    security had been breached. In 2008 another Israeli soldier was jailed for uploading
    sensitive information onto `Facebook`. Considering the number of social networks
    users in the French armed forces, such a possibility could arise there, too. A
    2014 survey pointed out that three out of four army service members, most of them
    noncommissioned, were active social networks users. Only 11 percent had given
    up their online profiles [upon joining the army], whereas 15 percent (one out
    of three being officers) had never had any. Hence, in 2012 the French Ministry
    of Defense released a `Guide to the Correct Use of Social Networks`. Meanwhile,
    cyber security experts regularly give conferences in boot camps and military academies
    to warn the personnel about the dangers posed by social networks to operations
    abroad and in the homeland.


    More recently, new threats from social networks have arisen in the cyber battlefield.
    Deception is a well-known mode of operation aimed at influencing the enemy’s manoeuvres.
    Now, it is being conducted on the `Web`. For example, some opponents of the French
    army in the Sahel spread obvious fake news to foster a popular anti-French movement.
    According to these fake news items, so-called friendly fires incidents by `Barkhane`
    operators would frequently involve its African allies. Others pretend that the
    French support armed terrorist groups. Clearly unfair and partisan, these lies
    are massively shared, “liked,” and commented upon.


    Rumours about so-called organized fanatics serving undercover in the Armed Forces
    serve to spread suspicion within the units. Although some former members of the
    French armed forces have in fact joined the Islamic State to conduct holy war
    (jihad), most Muslim soldiers are loyal to the French state. Indeed, a famous
    fake piece of news, which has been shared for years on several websites, deals
    with a so-called mutiny onboard the aircraft carrier `Foch` in 1999. According
    to this rumour, Muslim sailors, fed up with the bombing campaign against Kosovo
    (a now Muslim country) they were participating in, attempted to revolt. However,
    this never actually occurred.


    For all that, some potential Islamic terrorists and violent radicalized individuals
    have certainly been detected for years in the French armed forces and police.
    We must admit the enemy is competent in using new media tools and establishing
    communication strategies, capable of expressing himself ever more undisguised
    in the most efficient ways possible on the `Web`. Indeed, the design and production
    of some propaganda films and magazines do conform to Western standards. Webzines
    like `Dabiq`, `Rumiyah`, `Inspire`, and `Dar al-Islam` were issued irregularly
    in 2014–2016 in several languages, including French. They provided starter packets
    to potential terrorists who could obtain technical and ideological material just
    by reading them. The defeat of the Islamic state as a territorial entity has not
    put an end to their sharing information or propaganda on the `Web` or the relevant
    digital support media.


    ### A Deadly Threat to French Security Forces


    The terrorist threat to the homeland has made military men anonymous in their
    own country. Nowadays, wearing the uniform has been banned outside the service.
    Names are erased and faces are blurred to prevent identification during media
    coverage. As a result, soldiers have vanished from everyday life and from peoples’
    mind. With the exception of the seven to ten thousand soldiers of operation `Sentinelle`
    who patrol the streets to ensure the security of sensitive areas—mostly religious
    sites—French people can no longer see soldiers dressed in battledress or uniform
    in a bakery or shopping in a supermarket. Some retired military officials and
    anonymous senior officers do denounce what they consider a retreat in front of
    the enemy. Such an argument is not without merit. However, we must admit that
    over the past decade, members of the armed forces and other security services
    have suffered heavily from terrorism. Let us just remind three famous cases in
    France illustrating how service men have been targeted in today’s war against
    terrorism on home soil. In all three cases, cyber security played a key role.


    #### The Merah Case, 2012


    Mohammed Merah was a chronic offender well-known to the French homeland security
    services. A radicalized Muslim, he had traveled several times to Pakistan and
    Afghanistan to pass through traineeships in terrorist boot camps. Although he
    pretended—and was eventually believed—to be traveling to the region as a tourist,
    some homeland security analysts continued to monitor his activities. On March
    11, 2012, he set out finally to criminally act in pursuit of jihad, targeting
    servicemen. He was able to identify his first victim easily: the latter had posted
    an advertisement with a far too explicit description on a widely known e-commerce
    site. The serviceman, an airborne NCO named Imad Ibn Ziaten, wanted to sell his
    motorbike; in the ad, he explained that he had no choice but to get rid of as
    he was frequently away from home. In conclusion, he wrote, “I am a serviceman.”
    Merah feigned interest in the bike and arranged an appointment with Ibn Ziaten;
    upon meeting him, he denounced Ibn Ziaten as a traitor to Islam and killed him.
    Three days later, he attacked a group of servicemen who were passing by in a street
    at the gates of their military compound in Montauban. Two soldiers were killed
    and another one was seriously injured. On March 19, 2012, he finally attacked
    a Jewish school, killing one adult and three children.

