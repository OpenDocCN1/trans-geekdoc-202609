    原始数据源于对不同类别的受访参与者的访谈，以及尼日利亚政府采纳的网络安全政策文件和其他相关机构的报告。总共选择了 30 名受访者，并分为四类，分别标记为 `category
    A`、`B`、`C` 和 `D`。


    在 `category A` 中，从直接处理安全问题的不同机构选取了 8 名军事或准军事安全人员。根据可接触性和对研究主题拥有高质量相关数据，选选取了一位尼日利亚军的高级安全官员；另一位尼日利亚警察部队的高级官员则是根据其可接触性和拥有价值信息而被出的。该类别的其他受访者包括国家安全局的一名高级官员、尼日利亚移民局的一名高级官员、尼日利亚监狱管理局的一名高级官员、尼日利亚安全民防部队的一名高级官员、尼日利亚海关的一名高级官员以及尼日利亚联邦道路管理局的一名高级官员。


    在 `category B` 中，从处理安全问题的机构和部门选取了 10 名高级官员，其中包括来自库鲁乔斯国家政策与战略研究学院（`NIPSS`）的两名高级官员、来自国防学院（`NDA`）的两名高级官员、来自卡诺伍德迪尔尼日利亚警察学院的两名高级官员、来自国防部的两名高级官员，以及来自阿贾巴国家战争学院的两名高级官员。此外，`category
    C` 由学术人员组成，根据研究人员的就近程度，从三所大学选取了六位教授。其中两位是来自某所知名国立大学的、专长于安全与战略研究的政治学教授；两位是专长于网络安全和数字环境的计算机科学教授；最后两位是来自某所知名国立大学的、专长于犯罪学的社会学教授。


    在 `category D` 中，随机选取并访谈了六名处理网络活动的私人机构成员。其中包括阿比贾某商业银行的一名高级银行官员、在尼日利亚运营的电信公司的两名高级官员、尼日利亚通信委员会（`NCC`）的一名高级官员、尼日利亚技术开发局（`NITDA`）的一名高级官员以及联邦通信部的一名高级官员。他们都在总部所在地阿比贾被选取并接受了访谈。


    本研究使用了三个标准来确定受访信息源。第一个标准是识别与国家安全、网络安全、网络犯罪和数字经济主题密切相关的利益相关者。研究人员根据各机构和部委指示，咨询了安全下属机构和其他部门负责网络安全的工作人员或单位。他们在当地高级官员的指导下，咨询了部门内对网络安全主题最了解的人员。选定的信息源在匿名和保密的情况下接受了访谈。第二个标准是可接触性。例如，被咨询的学术人员除了根据其对主题拥有深入知识外，还根据其可接触性被选取；某些政府部门和机构也是如此。第三个标准基于
    Sharan（2009）的假设，即定性研究项目的最少访谈人数应为四或五人，最多为三十人，具体取决于资源和拥有高质量信息的人员情况。


    虽然针对每个类别分别准备了问题，但对所有四类受访者都提出了一些通用问题。半结构化问题的设计确保了信息从信息源获取的灵性和自由。收集数据的方法是组织半结构化会议的书面问卷，并根据信息源的不同类别进行了调整。其中一些人通过电话访谈，一些人通过电子邮件回复，另一些则通过
    WhatsApp。


    最后，如所述，其他原始数据来源包括尼日利亚政府于 2015 年颁布的网络安全政策文件，以及国家和国际机构关于尼日利亚网络安全的各种报告。次级来源包括与主题相关的书籍、期刊和互联网资源。获得的数据被分为主题，并使用内容分析法进行分析，对现有文献结合本研究的发现以及理论框架的应用进行结论和发现。


    ## 讨论与发现


    本节讨论了实地调查的主要发现，将其置于现有文献和所采用的理论框架中，从而识别知识空白并对知识做出贡献。数据以三个主要主题的形式进行讨论：尼日利亚网络安全挑战与前景的观点、网络犯罪对尼日利亚国家安全的影响以及网络犯罪对数字经济的影响。


    ### 尼日利亚网络安全挑战与前景观点


    我们之前注意到尼日利亚互联网和计算机用户数量正在迅速增加，这一人群容易受到网络安全漏洞和网络犯罪的影响。随着国内社交媒体的使用（包括电子邮件、Facebook、WhatsApp、Telegram、YouTube、Instagram
    以及许多其他技术），产生负面结果的可能性进一步升级。除了之前提供的数据外，我们还应该注意到，2019 年至 2020 年的数字增长指标显示，移动连接增加了
    1200 万（+7.7%），互联网用户增长了 220 万（2.6%），活跃社交媒体用户增加了 340 万（14%）。这些数据证实了以下结论：尼日利亚近年来正快速走向数字化：例如，从
    2013 年至 2019 年，互联网用户从 5100 万增加到 9300 万，如图 2


    **来源：引用自 Statista 2019。**


    来自尼日利亚通信委员会（`NCC`）的另一个来源显示，2018 年 12 月尼日利亚互联网用户为 1.116 亿，比 Statista 的数据多出 1000
    万。无论如何，社交媒体使用的增加增加了私人用户以及政府机构、组织和公司面临网络犯罪的脆弱性和风险。


    上述数字表明，尼日利亚明确需要投入大量资金并采取强有的网络安全政策，以减少脆弱性并有效打击相关犯罪。事实上，这正是 2015 年通过《网络安全法》的理由。另一方面，由于基础设施落后、数字知识水平低以及信息传输水平低，尼日利亚在网络安全领域面临严峻挑战。2018
    年网络安全指数简要指出了尼日利亚在这方面的脆弱性（见表 1）。


    **表 1：2018 年尼日利亚网络安全指数**


    | **排名** | **国家网络安全指数** | **数字发展水平** | **差异** |

