    As for subversion, while it is easy to start a protest movement online, it is
    very difficult to maintain in the long run. As a result, sabotage makes it temporarily
    trickier for the world to go digital, whereas espionage harvests the results of
    our constant connectivity. Ultimately, only noncommercial subversion is capable
    of endangering the current digital transition, but it is too infrequently executed
    to pose any serious kind of threat.


    Having examined the digital revolution’s workings, we can now sketch out the potential
    geopolitical consequences. Indeed, as can be seen from the preceding discussion,
    global digitalization is rooted in market dynamics and enables power to be exerted
    invisibly upon connected individuals. From a broader standpoint, it is aiding
    financial capitalism maneuver toward a new international geopolitical configuration,
    to which we now turn.


    ### Digital Empires vs. Digital Vassal States


    Geopolitics in the digitalized world are characterized by three major trends:
    an erosion of American power, an increase in Chinese power, and competition between
    the two to digitally colonize the rest of the world.


    #### Eroding America’s Digital Power


    American power entered the virtual world via an oligopoly: GAFAM. Made up of five
    major businesses (Google, Apple, Facebook, Amazon, and Microsoft) and founded
    by former hackers,^([19](#chapter1.xhtml#footnote-19)) GAFAM physically stores
    information.^([20](#chapter1.xhtml#footnote-20)) As such, this big data is accessible
    to the United States and its British relay station. 80 percent of data goes through
    the United States, and listening stations are positioned close to where underwater
    cables reach land.^([21](#chapter1.xhtml#footnote-21)) The geopolitical implications
    for control over cables range from fostering dependency among overseas territories
    far from major population centers,^([22](#chapter1.xhtml#footnote-22)) rising
    Chinese-American tensions,^([23](#chapter1.xhtml#footnote-23)) and in other, less-publicized
    arenas such as Portuguese-Brazilian wrangling for control over the former Portuguese
    colonies’ economic market.^([24](#chapter1.xhtml#footnote-24)) Most notably, in
    response to US dominance other actors have increasingly taken countermeasures:
    For example, to evade American surveillance, Brazil has built its own cable link
    to Spain. Similarly, China has built the Sea-me-we 5 cable to connect with the
    Middle East and, ultimately, Europe. And the Huawei Marine group is laying more
    and more underwater cables, for instance between Brazil and Cameroon.


    Because GAFAM behaves like a state, Denmark dispatched an ambassador to it in
    2017. In reality, it is more like a kleptocracy, which is living off stolen data,
    and whose hybridized belief system borrows from both left-wing libertarianism
    and right-wing technological determinism.^([25](#chapter1.xhtml#footnote-25))
    The resulting techno-libertarianism is espoused by visionary, charismatic founders
    who generate innovative commercial offerings that are always technologically avant-garde.
    With support from investment funds, GAFAM spent $58 billion on research and  development
    in 2016. They partly owe their monopoly to the brilliant Chinese and Indian minds
    that staff Silicon Valley. They are still in competition with China, however,
    which is trying to prevent them from developing any further.^([26](#chapter1.xhtml#footnote-26))
    To maintain its dominant position in this environment, the United States must
    speed up its industrial integration with Europe. For its part, if it hopes to
    reestablish its digital sovereignty, Europe needs to redouble its own efforts
    and investments in digital technology.^([27](#chapter1.xhtml#footnote-27)) If
    it does not, it will have to accept strategic alliances which reduce it to nothing
    more than a digital vassal state.


    #### China’s Rise to Cybernetic Power as an Indicator of Rare Resources'
