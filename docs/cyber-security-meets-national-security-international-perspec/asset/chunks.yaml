    In terms of commerce, by the twenty-first century, many businesses had adopted
    technology aimed at innovation and improvement of customer services and operations,
    often with positive results in terms of profitability and ease of operations.
    The advantages of conducting business online are such that in 2018 more than 42
    percent of business globally were conducted in this manner (retrieved from [https://www.slideshare.net/sap/99-facts-on-the-future-of-business-in-the-digital-economy-2018](https://www.slideshare.net/sap/99-facts-on-the-future-of-business-in-the-digital-economy-2018)).
    At the same time, enterprises that have done so face the risk of unauthorized
    use and malicious attacks, including theft, the destruction of intellectual property,
    abuse by insiders, and illegal use of information, which is tantamount to the
    loss of data reliability and confidentiality and affects the levels of trust between
    enterprises and their users/customers (Shalhoub & Al Qasimi, 2010).


    In an environment where the digital economy is characterized by the physical separation
    of the buyer from the seller, the separation of the buyer from the product, and
    the risk of cybercrime, enterprises must find ways of initiating and developing
    cyber relationships with customers in sustainable ways, of which the best is establishing
    a trusted digital space. (Shalhoub & Al Qasimi, 2010). The importance this point
    is underscored when we consider that most countries in the world are currently
    going digital in virtually all aspects of national importance, such as e-governance,
    e-commerce, e-voting, e-transaction, e-learning, and other vital aspects of human
    endeavor in the society. Digital trust and security in this case take on paramount
    importance and demand the attention of policymakers.


    ## Emergence and Patterns of Cybercrime


    Cybercrime emerged historically in the 1970s and 1980s during the Cold War era.
    During that period, most patterns of cybercrimes revolved around nation-states
    engaged in the ideological battle and involved attacking the computers and data
    of rival countries. Important data related to nuclear proliferation, intelligence
    movements, and foreign policy were the subject of hacking by professionals employed
    by the relevant governments. At the same time, individual criminals were also
    actively hacking data, targeting critical national infrastructures and financial
    organizations for the purposes of stealing of money and sabotage (Kshetri 2019;
    Mordi 2019). However, in terms of its pervasiveness, cybercrime became far more
    extensive, dynamic, and pervasive after the collapse of the USSR.


    Cybercrime is believed to have generated an amount of money worth $1.5 trillion
    in 2018 and $2 trillion in 2019 across the globe through major hacks and thefts
    from websites and organizations. The annual total amount (that we know of) realized
    from cybercrimes consists of $860 billion from illegal online markets, $500 billion
    from trade secrets and IP thefts, $160 billion from data trading, $1.6 billion
    from crimeware; and $1 billion from ransomware. In the United States, cyber frauds
    led to losses of $25 billion in 2010 alone; in Britain and Australia, losses in
    2015 amounted to 3.6 billion British pounds and AU$94 million. These crimes have
    largely involved multinational corporations and governmental information, with
    major examples of data breaches in 2018 including Yahoo ($3 billion), Under Armour
    ($150 million), eBay ($145 million), Equifax ($110 million), Facebook ($87 million),
    JP Morgan Chase ($76 million), Paystation ($77 million), Uber ($57.6 million),
    and Home Depot ($56 million) (Re-Hashed 2019).


    Turning to Nigeria now, similar to other developing countries, the level of development
    in internet and cyberspace in the 1970s and 1980s in that country was minimal.
    Even though it was an appendage of capitalist states during the Cold War, cybercrimes
    in Nigeria during this time were practically nonexistent. Beginning with the 1990s,
    however, Nigeria joined the retinue of states facing nonmilitary security threats,
    with cybercrime front and central. For instance, if Africa as a whole lost $3.5
    billion in 2017 to cybercrimes, the Nigerian portion of this sum was $645 million,
    by far the largest (Kshetri 2019). A year later, it was reported that Nigeria
    lost $800 million (N288 billion) collectively to cyberattacks in 2018 (Azeez 2019).
    More broadly, a 2019 report disclosed that Nigeria has lost on average N127 billion
    ($328,842,878 million) annually to cybercrimes in recent years (Ohwovoriole 2019).
    Furthermore, Nigeria has the reputation of being the global headquarters of cybercrimes,
    due to frequent daily incidences linked to the country (even though Statista data
    in 2017 did not even mention Nigeria among the top twenty countries in terms of
    the highest incidence of cybercrime) (Mordi 2019). Finally, in addition to these
    glaring threats posed by cybercriminals to the Nigerian economy, the Nigerian
    Communication Commission (`NCC`) reported in 2018 that there were about 9 million
    unregistered lines in the country that were used by mobile owners; some of these
    were clearly being used for criminal activities such as terrorism, rural banditry,
    communal violence, kidnapping and robbery, posing a serious threat to national
    security.


    ## Policies and Regulations on Cybersecurity


    The need for policies on cybersecurity is anchored in the recognition that there
    has been a shift in global governance toward e-governance and the security implications
    arising therefrom. The 2009 cyberattacks on South Korea and United States present
    a good case for concern in this regard (Andreason 2012, 77). According to Pelton
    and Singh (2015), cybersecurity laws should target four major areas. The first
    is personal and family protection, which consists of protecting stocks, bonds,
    bank accounts and credit cards, Medicare accounts, desktop computers and Wi-Fi,
    personal cell phones, and family records. The second aspect involves cybersecurity
    policies for smart phones and free Wi-Fi that operates through mobile phone security
    and access. The third aspect is protecting vital infrastructure through the application
    of satellites with cybersecurity implications. Finally, the fourth is strict government
    regulation and monitoring of cyber activities. The reality, however, is that the
    development of such policies has been haphazard at best.


    In an attempt to minimize the rate and severity of cybercrimes, various international
    organizations have undertaken the responsibility of pushing toward cyber law development
    in both the developed and developing countries. A leader in this respect, the
    International Telecommunications Union (`ITU`) launched the Global Security Agenda
    in 2007 and formed a High-Level Expert Group to investigate the issues and develop
    proposals for long term strategies (Shalhoub & Al Qasimi 2010, 18). The `ITU`
    in particular promulgates laws under its auspices that have some applicability
    to information warfare attacks that use the electromagnetic spectrum or international
    telecommunications network (Greenberg, Goodman, & Hoo 1998, 7).

