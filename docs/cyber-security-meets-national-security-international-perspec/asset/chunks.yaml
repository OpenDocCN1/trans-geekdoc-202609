    had used while connecting to the e-commerce site, the police launched a vast manhunt.
    Merah, who had dug himself in at home and resisted a thirty-two-hour siege, was
    finally killed in an assault. Five members of an elite police force were injured
    during the action. Afterward, several jihadist armed groups claimed responsibility
    for Merah’s attacks. Even murkier, the unclear nature of the relationship between
    Merah and the intelligence services has generated controversies about so-called
    security gaps and unproven theories of collaboration.


    #### The Slaughter of Magnanville


    The second case happened on June 13, 2016, when a twenty-five-year-old terrorist
    named Larossi Abballa slaughtered a police officer couple in their home in Magnanville.
    The couple’s three-year-old son was spared thanks to the intervention of another
    radical Muslim, with whom Abballa was chatting on Facebook live. As he was filming
    the killings to claim his membership in the Islamic State, Aballa questioned himself
    about what to do with the kid. The terrorist, who had been convicted three years
    earlier of assisting a terrorist plot, was shot a few hours after the murders
    by an elite police squad.^([14](#chapter2.xhtml#footnote-14)) The reason why he
    decided to kill those two persons remains unknown. However, it seems he did not
    choose the couple randomly. Analysis of his cell phone revealed he had surveilled
    the area several times. Moreover, in October 2017, while searching the home of
    a woman suspected of complicity in a terrorism case, the police seized a USB pen
    on which they found the names of 2,626 police officers. Also included was a list
    of the names, identification numbers, and units of all the senior members of a
    police union (dated to 2008). All these police officers served in the homeland
    security services. As to how this information had leaked—the sensitive data had
    been shared with all the agents mentioned in the list and with the union itself,
    making the breach of information all the easier.^([15](#chapter2.xhtml#footnote-15))
    Indeed, the suspect had been housed by a close friend’s mother who was an NCO
    police officer and union representative who had converted to Islam. The police
    interrogated her regarding the Magnanville slaughter, as she did know people about
    to participate in jihad.^([16](#chapter2.xhtml#footnote-16)) However, due to a
    lack of evidence, no charge could be laid against her.


    ### Harpon Case, 2019


    On October 3, 2019, Mickaël Harpon, a civil servant working at the Intelligence
    Bureau of the Paris Prefecture, assassinated three policemen and an administrative
    agent in the courtyard of this institution, whose purpose includes preventing
    terrorism. There was no doubt in classifying the killing as a terrorist attack,
    since its perpetrator’s aim was to “« kill unbelievers.”^([17](#chapter2.xhtml#footnote-17))
    For the very first time, France faced a “blue on blue” terrorist attack, a friendly
    fire attack carried out on purpose by a member of the force.^([18](#chapter2.xhtml#footnote-18))


    In the Harpon case, the most serious thing is that he had access to classified
    data, as he was a technician responsible for the maintenance of computers. In
    spite of his evident radicalization, the terrorist could consult lots of personal
    data concerning Prefecture employees. Confidential data as well as jihadist propaganda
    were found on his USB pen. While subsequent investigations could not confirm there
    were leaks of confidential data, this was due only to an absence of direct evidence.^([19](#chapter2.xhtml#footnote-19))
    In the aftermath of the killings, intelligence experts have publicly expressed
    concerns about how a well-known radical Muslim, who attended extremist mosques,
    could had been granted such a level of security clearance.^([20](#chapter2.xhtml#footnote-20))
    A special commission of inquiry has proposed thirty-five measures to prevent such
    a risk in the future.^([21](#chapter2.xhtml#footnote-21))


    ### Conclusion


    A misunderstanding of the cyber threat causes the human failures at the root of
    most security breaches in the armed forces and other security services (injury
    of reputation, compromising, attacks on members’ lives). The recent cases underscore
    that one need not be a senior hacker or employ high-tech to cause losses. Increasing
    controls may produce no results if no one observes the procedures. However, a
    powerful and long-term awareness raising campaign aimed at informing servicemen
    on the cyber threat is starting to yield encouraging results, as a change in mentality
    can be observed. Indeed, cyber security has become quite inevitable in the everyday
    life of servicemen.


    To face these new threats, France has taken various measures. First, its intelligence
    services have had to adapt to the e-revolution. Within the intel world, new departments
    and cells dedicated to very specific know-how have been set up. Along with the
    external intelligence service (DGSE) and the Military Intelligence Service (DRM),
    the Department for Intelligence and Defense Security (DRSD) seeks specifically
    to protect all MoD servicemen and cells. Dedicated to counterintelligence, its
    aim is to identify opponents’ intentions and to neutralize any internal and external
    threats which may lead to hostile acts from organizations, groups, or individuals.
    DRSD agents investigate and protect. They identify weaknesses and contribute to
    bolstering security. Among others, one of the key missions of the DRSD is to mentor
    troops on counterintelligence (securing data, preserving secrecy, avoiding reputational
    damage) prior to any tour of duty overseas. Every year, several servicemen are
    punished by the military high command, and sometimes by the courts, for judicial
    misconduct because of offenses that intel services managed to identify or prevent.


    Nowadays, most electronic communications are encrypted. The armed forces use dedicated
    email and computer networks that are supposed to remain unbroken and hermetic
    to hackers’ assaults. Today, any platoon leader frequently uses encrypted software
    to communicate within his own unit. Moreover, the MoD has been hiring hundreds
    of computer science specialists, software designers, data analysts, hackers, and
    other kinds of “geeks” to join ancient and brand-new units such as the 44th and
    the 54th Signal battalions, the 805th Signal company (created in 2016), which
    stands alongside the 785th electronic warfare company in Brittany, as spearheads
    for cyber security and counterintelligence. Even if much still must be done to
    compete with superpowers on the virtual battlefield, France has remained credible
    in how it understands the strategic issues. Hopefully, considering its indigenous
    know-hows and the renowned multinational defence groups (Dassault System, Sagem,
    Safran, Thalès, etc.) based in France, the issue is rather more “we will do it”
    than “we can do it.”


