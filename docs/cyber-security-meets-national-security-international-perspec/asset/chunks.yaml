    In addition to the summary above, there are one or two views that are revealing
    and should be expressed here. In an interview, one of the informants narrated
    that “Nigeria is tilting towards cyberspace like other world countries but there
    is a huge challenge that should awaken the policymakers towards particularly securing
    the cyberspace through an effective cybersecurity. This is because Nigeria lost
    N288 billion in 2018 alone to cybercrime which is alarming and a threat to the
    internet users in the country” (Interview with an informant in category A on October
    27, 2018, in Abuja at 11:30 am). From a different perspective, another informant
    revealed that “the weak cybersecurity space in Nigeria disclosed how vulnerable
    the country. Nowadays, we are no longer battling with terrorism alone but cyberterrorism
    because even the terrorists themselves were using the cyberspace through the anonymity
    doctrine to undertake their heinous crimes” (Interview with an informant in category
    C on September 18, 2018, at 9 am).


    ## Effects of Cybercrime on National Security in Nigeria


    Cybercrime has now become a major security headache across the globe because of
    its nature, which is cross-border, anonymous, and very difficult to detect or
    prove. In Nigeria in particular, the cybercrime indices indicate a harmful and
    vulnerable situation, with the country listing among the ten top countries in
    the cybercrime index as reported by US Federal Bureau of Investigation. The report
    revealed that the United States ranks first, United Kingdom second, Nigeria third,
    followed by Canada, Romania, Italy, Spain, South Africa, Russia, and China. Apart
    from the above, the interviewed informants revealed different views on the effects
    of cybercrime on national security in Nigeria. The views are summarized and presented
    below in a tabular form ([table 3](#chapter3.xhtml#tab3)).


    ## Table 3: Summary of Informants Views on the Effects of Cybercrimes on National
    Security


    | Category | Informants | Responses |

    | --- | --- | --- |

