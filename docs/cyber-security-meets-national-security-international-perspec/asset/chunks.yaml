    China’s demographic collapse has forced the emerging power to concentrate on technology.
    The PRC is now hugely connected, and over half of its population has been online
    since 2017. Four hundred million Chinese people play online games, for example.
    Chinese internet users are online for about three hours a day, and over half of
    that time is spent on a mobile device. They browse and watch online videos, abandoning
    TV screens in favor of more nomadic options. Within this context, as part of its
    attempt to encourage digitalization while safeguarding against domestic political
    change, China is seeking to disentangle itself from `ICANN`, a legal authority
    based in California that regulates the internet, by boycotting multilateral meetings.
    Its objective is to draw a strict dividing line between the “Chinese internet”
    and the “global internet.” In an attempt to “cleanse” the internet, the Chinese
    Communist Party has long sought to strengthen its grip on what it describes as
    information pollution and “electronic opium.”^([28](#chapter1.xhtml#footnote-28))


    From another angle, the Chinese have outclassed the Americans when it comes to
    AI. AI thrives when data is collected in massive quantities, and China has huge
    amounts of homogenized data that enables it to outstrip the United States in this
    realm. The country’s “social credit” system, which awards every citizen a certain
    number of points based on behavior, has enabled it to extract vast amounts of
    data since it came into force in 2020.^([29](#chapter1.xhtml#footnote-29)) Two
    modes of plundering data are thus going head-to-head: GAFAM pilfers our data on
    the one hand, while the Chinese government pilfers its own citizens’ data on the
    other. The Chinese have the data but the Americans have the algorithms, which
    is why it is so crucial to the Chinese that they manage to plunder the latter
    or attract the very best engineers who will help them catch up. Competition here
    is fierce and has left behind India, which is only responsible for developing
    existing programs. For example, in order to maintain its digital independence,
    China restricts how its rare metals are exported and used, as these will go on
    to be used in the mobile phone manufacturing process. For Guillaume Pitron, the
    battle for rare metals is the hidden side of the digital revolution, and in the
    future, tensions will become particularly high in territories targeted by cyber-colonists.


    ## Major Powers Competing to Digitally Colonize Africa


    If the digital colonisation process were modeled on an algorithm, it would include
    the following steps. First, the colonizer would facilitate a cyberattack on the
    target state’s communications and present itself as the latter’s savior. Next,
    it would connect the country to the internet, secure its strategic networks and
    capture local cyber elites by rolling out a master’s degree program in digitalization.
    It would then pillage the country’s data, take over the consumer market and, finally,
    engage in online electoral marketing to maintain its grip on its conquered market.


    This is precisely what is happening in Africa, where connectivity is growing rapidly.
    In 2018 alone, 35.2 percent of Africans were using the internet, compared with
    16 percent in 2012. In this context, China has taken a very original stance toward
    the continent. First of all, Chinese businesses have provided the continent with
    technological tools at very competitive prices. For instance, Shenzhen-based electronics
    manufacturer `Huawei` has been operating in Africa since 1999. In 2013, it partnered
    up with `Microsoft` to conquer the African smartphone market and is now outperforming
    the Californian giant in this sector in Africa. `Huawei`’s ambition is now to
    sell premium telephones to an African middle class looking for enhanced services,
    further positioning China as a leader in this market. There are, however, significant
    differences between countries, from North Africa to the Sahel region, as the Chinese
    are not the only cyber colonizers in town.^([30](#chapter1.xhtml#footnote-30))


    For example, the British are also taking an interest in this promising market
    and organized a cyber-forum in 2018. France, too, has been seeking a piece of
    the pie. In 2019 `Orange` set up a specialist cyber defence subsidiary in Morocco:
    `Orange Cyberdefense Morocco` officially opened for business in Casablanca on
    April 16, 2019. A master’s degree in cyber defense has been set up in partnership
    with the `Université Polytechnique Hauts-de-France` in Valenciennes to attract
    African talent and launch their careers. France also has a long-established presence
    in Libya as, in 2007, `Amesys`—a French subsidiary of `Bull`—sold its `Eagle`
    program to the Gaddafi regime to track its opponents. After changing its name
    to `Advanced Middle East`, the company then sold a similar system to Egypt known
    as `Cerebro`.


    ## The Middle East: Digital Islands and Rich Pickings


    Finally, it is worth considering here another region where digitalization is taking
    on increasing importance–the Middle East. The latter has two “islands,” Iran and
    Israel, which represent opposing yet mirroring forces. On the one hand, Israel
    provides 7 percent of the world’s cybersecurity, and its industry benefits from
    high levels of investment that aim to protect a territory stripped of its strategic
    importance, while also improving its ability to export innovations.^([31](#chapter1.xhtml#footnote-31))
    On May 6, 2019, Israel sent out a warning to hackers operating outside its borders.
    After one cyberattack in particular, the Israel Defense Forces bombed a building
    in the Gaza Strip that was sheltering hackers. This has not prevented Israel itself
    from recruiting hackers keen to offer it their services for a hefty fee.^([32](#chapter1.xhtml#footnote-32))
    The field is growing, as exemplified by three former intelligence officers who
    founded `XM Cyber` in 2016 to operate in this particular field. For its part,
    and in opposition to Israel, stands the digital island of Iran, a country with
    equal levels of creativity but lacking in Western investment.^([33](#chapter1.xhtml#footnote-33))
    Among other things, Iran appears to have been behind cyberattacks on certain British
    banks in December 2018. The viruses used—`Shamoon 1`, `Shamoon 2`, and `Shamoon
    3`—also targeted petroleum infrastructures in the Gulf’s oil monarchies.^([34](#chapter1.xhtml#footnote-34))


    Yet, Iran and Israel are not the only actors in the Middle East whose digitalizing
    activities have an impact outside their own borders. In Turkey, the nationalist
    `Cyber-Warrior Akıncılar` group has hacked anyone or any organization deemed opposed
    to the interests of Turkey and Islam.^([35](#chapter1.xhtml#footnote-35)) Saudi
    Arabia, meanwhile, has enjoyed technical support from certain Israeli cybersecurity
    firms, which have made use of their position to gather data on the behavior of
    the country’s elites or opponents to the regime.^([36](#chapter1.xhtml#footnote-36))
    Still, despite the protection offered by these companies, Saudi Arabia is now
    the most frequently targeted Middle Eastern country when it comes to cyberattacks,
    which mostly aim to steal information from private and public institutions’ information
    systems.^([37](#chapter1.xhtml#footnote-37))


    ### Conclusion

