    **Source: Field survey from interviews conducted between July to December 2018
    with the selected informants by the researchers.**


    As before, some informants’ major points are relevant to be quoted here. One of
    them disclosed that “the Nigerians are now enjoying digital economy through e-commerce
    and digital shopping from the comfort of their homes. But inadequate awareness,
    exposure, vulnerability, and weak cybersecurity is threatening the revolution
    in digital economy in the country even with the reality that the country can no
    longer survive without going digital, the colossal loss to hackers and cyber fraudsters
    recorded in the country disclosed that the digital economy has a serious challenge”
    (Interview with an informant in category C on August 6, 2018, at 10: 00 am). Another
    informant revealed that “corporations in Nigeria are finding it difficult to make
    transaction easier for its customers due to the alarming rate of cybercrime in
    the country and even the government itself is slow in transferring towards e-governance
    and e-transaction due to hackers and a weak cybersecurity in the country” (Interview
    with an informant in category A on August 17, 2018, at 3:00 pm).


    ### Conclusion and Recommendations


    The study concludes that Nigeria has recognized the importance of cybersecurity
    owing to its establishment of the `Cybersecurity Act 2015`, as a direct response
    to the recent emergence of cybercrimes in the country. The study contributed to
    the scholarly literature both empirically and theoretically. Empirically, the
    study revealed statistics regarding mobile and internet users in Nigeria as well
    as digital online activities in the country. It reported scientific views from
    informants on the effects of cybercrimes on national security and digital economy
    in Nigeria. Theoretically, the study succeeded in linking the connection between
    the various existing propositions on matters of national security and cybersecurity
    and the emerging empirical evidence from the area of study. The study also has
    policy implications in terms of initiating some proposals for policymaking in
    cybersecurity to prevent cybercrimes in Nigeria. The recommendations are listed
    below:


    1. The government and other agencies responsible for ICT regulations should create
    popular awareness on the need to prevent the exposure of security codes and other
    vital information online;

    2. People should be sensitized to report suspicious transactions to the agencies
    that are responsible for the handling of cybersecurity policies;

    3. Experts should be engaged to train existing staff within the relevant agencies
    on cybersecurity technicalities for easy identification of threats;

    4. Workshops and media advertisements should be regularized quarterly to enlighten
    the public, organizations, and governmental agencies on the workings of cybercrime
    and how to adopt measures for protection;

    5. Those who are caught in cybercrime activities should be punished severely according
    to the regulations of `Cybersecurity Act 2015`.


