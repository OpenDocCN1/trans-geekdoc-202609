    Babayo Sule（尼日利亚贡戈比州卡舍雷联邦贡戈比联邦大学政治科学系）；Bakri Mat（马来西亚北马大学国际研究学院）；Usman Sambo（尼日利亚约贝州达马图鲁约贝州大学公共管理系）；Mohammed
    Kwarah Tal（尼日利亚贡戈比州卡舍雷联邦贡戈比联邦大学政治科学系）；以及 Muhammad Aminu Yahaya（尼日利亚贡戈比州贡戈比州大学公共管理系）。


    ### 摘要


    本研究从国际安全辩论中非传统话语的视角，探讨了网络犯罪和脆弱的网络安全防御对尼日利亚国家安全和数字经济的影响。研究采用了定性方法进行数据收集和分析，并利用了一手数据和次级数据。一手数据包括对尼日利亚相关机构选定受访者进行的深度访谈，以及关于网络安全和网络犯罪的政府政策文件，包括与安全人员、学者、安全研究机构高级官员以及通信部门私营机构和政府部门成员的对话。次级数据由书籍、期刊和互联网资源组成。分析显示，网络犯罪在尼日利亚在未被察觉的情况下蓬勃发展，影响了其关键国家基础设施，由于网络安全能力薄弱导致了长期恐怖主义活动，影响了国家安全和国家环境安全。文章建议尼日利亚采取措施加强其网络空间和数字环境，以预防犯罪并促进国家安全和数字经济。


    ### 引言


    冷战时期及以后出现的新安全话语范式转变，强调了关注对国内和国际安全的非传统或非军事威胁的性（Buzan & Hansen 2009）。事实上，海盗活动、洪水、干旱、疾病、恐怖主义、环境灾害和网络犯罪等广泛安全挑战的出现，使得人们必须重新审视当代全球安全的基础（Buzan
    1983, 4）。特别是网络安全，构成了一项持续的挑战，威胁着人类的生存和跨国家的基础设施。在面对可能导致数十亿美元财产损失、现金被盗以及关键国家基础设施崩溃的威胁和脆弱性时，各国正付出巨大努力，保护其网络空间免受网络攻击和网络犯罪的侵害（Fischer
    2009）。全球范围内网络犯罪呈上升趋势（Buchanan 2016），影响了个人、公司、组织和政府，造成了价值数十亿美元的损失（Antonucci 2017）。


    在此背景下，尼日利亚是一个发展中国家，正在多个战线上应对国家安全威胁，包括传统的军事威胁和饥饿、疾病、侵蚀、海盗、干旱、洪水、恐怖主义以及境内外的网络犯罪爆发等非传统挑战。对后一种威胁的认识促使尼日利亚政府在
    2015 年通过了一份关于网络安全的政策文件，这是一份全面的政策声明，详细说明了政府为实现更安全的数字环境所做的规定和努力。许多学者（Schjolberg
    & Ghernaouti-Helie 2009; Reveron & Mahoney-Norris 2011; Schjolberg & Ghernaouti-Helie
    2011; Singer & Friedman 2014; Mazurczyk, Drobniak, & Moore 2016; Maurer 2018）指出，互联网和网络空间是全球性的，对所有国家带来了多重脆弱性；事实上，对尼日利亚的研究（Frank
    & Odunayo 2013; Olayemi 2014; Omodunbi, Odiase, Olaniyan, & Esan 2016; Ajiji 2017;
    Chukwuma & Mogom 2018; and Mohammed, Mohammed, & Solanke 2019）虽然在该主题上研究较少，但表明尼日利亚对这些威胁的脆弱性与其他世界国家一样。


    然而，由于其独特的状况，尼日利亚案例在网络安全和网络犯罪研究方面显得尤为重要。该国是非洲人口最多的国家，也是地球上最大的黑人国家。它是世界十大产油国之一，也是人口第七的国家。尼日利亚互联网接入的爆炸式增长应该是决策者和网络安全领域关键参与者的首关注，因为在尼日利亚背景下，脆弱性迫在眉睫。然而，对尼日利亚网络安全问题的分析极其不足，这正是本文试图解决的空白。除了提供现状概述外，我们还为尼日利亚政府提供了如何改进该国现有网络安全基础设施的建议。


    ### 文献综述


    在本节，我们讨论了与研究主题相关的一些实证和理论问题。这些包括：（1）网络安全作为全球关注核心的出现；（2）全球数字经济的演变和特征；（3）全球及尼日利亚网络犯罪的出现和模式；（4）与网络安全的政策和法规；（5）尼日利亚国家安全；以及（6）尼日利亚对网络安全关注和网络犯罪的政策响应。


    #### 全球背景下的网络安全


    在当代，互联网通信技术和数字活动的快速扩张，特别是手机的普及，产生了新的安全担忧，因为大量的存储数据已成为黑客和犯罪分的目标（Rayes & Salam 2019）。此外，在互联网领域进行的金融交易成为明显的脆弱性渠道。随着全球超过
    50 亿人拥有手机，40 亿人接入互联网，网络安全已成为不可避免且紧迫的问题（Global Web Index 2019）。随着国家之间的网络攻击以及个人犯罪分子针对国家和公共用户的攻击日益增加，学术话语中出现了国家安全范式的转变（Reveron
    et al. 2011）。在尼日利亚的具体情况下，21 世纪关于手机所有者、互联网用户和数字经济的统计表明，政府和个人都必须将网络安全视为严肃问题。


    #### 数字经济


    数字经济，特别是电子商务、电子政和在线学习等数字活动，已经经历了数十年的转型。自二世界大战结束以来，各国向数字空间移动以便利生活，这一现象可以追溯到第一台计算机的发明（Severo
    2019, 165）。随着互联网服务的出现，数字活动在 20 世纪 8 年代开始流行（Noam, 2019）。全球范围内互联网系统的爆炸式增长，以及手机、笔记本电脑、iPad、平板电脑和其他使用互联网服务的通信设备的诞生，已成功实现了世界的数字化（Schwanholz
    & Graham, 2018）。


