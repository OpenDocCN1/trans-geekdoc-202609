    中国的人口崩塌迫使这一新兴力量聚焦于技术领域。中国现在已高度互联，超过一半的人口自 2017 年以来一直已接入网络。例如，有四亿中国人正在玩网络游戏。中国互联网用户每天上网时间约为三小时，其中超过一半的时间花在移动设备上。他们浏览并观看在线视频，放弃了电视屏幕，转而选择更具流动性的方案。在这种背景下，作为其试图鼓励数字化同时防范国内政治变化的一部分，中国正试图通过抵制多边会议来与`ICANN`（一家总部位于加利福尼亚、监管互联网的法律机构）脱钩。其目标是在“中国互联网”与“全球互联网”之间划定一条严格的界限。为了试图“净化”互联网，中国共产党长期以来一直加强对其所描述的“信息污染”和“电子鸦片”的控制。^(28)


    从另一个角度来看，中国在人工智能方面已经超越了美国。人工智能在海量数据采集时蓬勃发展，而中国拥有海量的同质数据，这使其在该领域超越美国。该国的“社会信用”系统根据行为赋予每个公民一定数量的分数，自
    2020 年实施以来，它使其能够提取海量数据。^(29) 因此，两种掠夺数据的模式正面对面对锋：一方面，GAFAM 窃取我们的数据；另一方面，中国政府掠夺其本公民的数据。中国拥有数据，但美国拥有算法，这就是为什么对中国来说，设法成功掠夺后者或吸引最顶尖的工程师帮助他们追赶是至关重要的。这里的竞争异常激烈，并将印度甩在身后，印度仅负责开发现有的程序。例如，为了维护其数字独立，中国限制了稀有金属的出口和使用，因为这些将用于用于手机的制造过程。对于吉尧·皮特隆（Guillaume
    Pitron）来说，稀有金属之战是数字革命的隐藏面，在未来，被网络殖民者针对的领土紧张局势将变得特别高度。


    ## 大国竞争数字殖民化非洲


    如果数字殖民化过程被建模为一个算法，它将包括以下步骤。首先，殖民者将促进对目标国通信网络进行网络攻击，并表现为该国的救救主。其次，它会将该国接入互联网，确保其战略网络，并通过推出数字化的硕士学位课程来捕获当地的网络精英。然后，它将掠夺该国的数据，接管消费市场，并最后进行在线选举营销以维持其对被征服市场的控制。


    这正是在非洲发生的事情，那里的连通性正在迅速增长。仅在 2018 年，就有 35.2%的非洲人正在使用互联网，而 2012 年这一比例为 16%。在这种背景下，中国对非洲大陆采取了非常独特的立场。首先，中国企业以极具竞争力的价格为该大陆提供了技术工具。例如，总部位于深圳的电子制造商`华为`自
    1999 年起就开始在非洲运营。2013 年，它与`Microsoft`合作征服非洲智能手机市场，现在在非洲这一领域的表现已优于这家加州科技巨头。`华为`现在的野心是向寻求更好服务的非洲中产阶级销售高端手机，进一步确立中国作为该市场领导者的地位。然而，从从北非到萨赫尔地区，各国之间存在显著差异，因为中国并不是当地唯一的网络殖民者。^(30)


    例如，英国人对这一前景广阔的市场感兴趣，并在 2018 年组织了一个网络论坛。法国也一直试图分一杯羹。2019 年，`Orange`在摩洛哥设立了专门的网络防御子公司：`Orange
    Cyberdefense`于 4 月 16 日在卡萨布兰卡开业。瓦南的`Université Polytechnique Hauts-de-France`合作设立了网络防御硕士学位，以吸引非洲人才并开启职业。法国在利比亚也有长期存在，因为在
    2007 年，`Amesys`（`Bull`的子公司）向格达菲政权出售了名为`Eagle`的程序以追踪反对者。`Advanced Middle East`随后向埃及出售了名为`Cerebro`的系统。


    ## 中东：数字岛屿与丰富收益


    最后，值得考虑另一个数字化日益重要的地区——中东。后者有两个“岛屿”：伊朗和以色列，它们代表了对立又镜像的力量。一方面，以色列提供了全球 7%的网络安全，其行业受益于高水平的投资，这些投资旨在保护其战略领土，同时提高其创新能力。^(31)2019
    年 5 月 6 日，以色列向在其边界外运行的海客发出了警告。在一次特定的网络攻击后，以色列国防军炸毁了加沙地区一栋窝藏黑客的建筑。这并没有阻止以色列自己招募愿意为了高额费用提供服务的黑客。^(32)该领域正在增长，例如三位在
    2016 年创立`XM Cyber`的前情报官，他们在该特定领域运营。作为回应，并与以色列对立的是伊朗这一数字岛屿，这是一个具有同样创造力但缺乏西方投资的国家。^(33)


    然而，伊朗和以色列并不是中东唯一数字化活动影响边界之外的行动者。在土耳其，民族主义组织`Cyber-Warrior Akıncılar`黑进入了任何被认为违背土耳其和伊斯兰利益的个人或组织。^(35)与此同时，沙特阿拉伯一直受到某些以色列安全公司的技术支持，这些公司利用其地位收集有关该国精英或政权反对者的数据。^(36)
    尽管如此，尽管公司提供了保护，沙特阿拉伯现在是中东最受网络攻击频繁的国家，这些攻击主要是从私人和公共机构的信息系统中窃取信息。^(37)


