    In an interview, one informant underscored a crucial point, namely that “critical
    national infrastructures are at great risk in the country such as payment platform
    like `IPPIS` and `Treasury Single Account` as well as many other segments that
    are using the internet for delivering important services to the nation. The repercussions
    are that once Nigeria by either advertent or inadvertent accident found itself
    under cyberattacks, the damage would be unimaginable” (Interview with an informant
    in category B on November 11, 2018, at 8:30 pm). Furthermore, another informant
    disclosed that “the global trend for national security is shifting towards cyberspace
    and collective security is now moving globally towards securing the cyberspace
    which is more important. Criminal activities that can threaten national security
    of a country like Nigeria such as terrorism, cyber fraud, looting of national
    treasury and lack of national databank for emergencies are possible if the cybersecurity
    of Nigeria is not given adequate attention that it deserves as other world countries
    are doing today” (Interview with an informant in category D on December 19, 2018,
    at 11:00 am). Theoretically, the Alagappa model is useful to strengthen the analysis
    here because the activities of hackers and terrorists as indicated above show
    that the insecure cyberspace in Nigeria has greatly exposed the country to criminal
    activities that affect national security.


    Additionally, during fieldwork the researchers themselves noted a daily incidence
    of an average of two mails per day via their emails, where they are targeted for
    cybercrimes and fraud. Some of the emails bore European, American, or Arabic names,
    claiming to come from the `United Nations` and other reputable international organizations;
    the content of the email would ask the recipients to assist in the transfer of
    millions of dollars from various world destinations into Nigeria. The targeted
    individual would be asked to help by providing his account details for the transaction
    and in return he would allegedly receive half of the proceeds of the transfer.
    In other mails, the targeted individual would be congratulated and asked to forward
    his details as the winner of the `World Health Organization`’s annual charity,
    or a prize given by the `United Nations`, `UNICEF`, or other related agencies.
    All the informants who were consulted as interviewees for this study also attested
    to the same experience. Sometimes it is a direct call from some unscrupulous elements
    claiming that you must send your account number and Bank Verification Number (`BVN`)
    for rectification of an account issue. Once sent, you will start receiving alerts
    that you are withdrawing money, your account hacked, and the money stolen. “In
    essence, once your email is online and you are a frequent user of internet and
    emails especially academicians who published articles with their details of addresses
    and other organizations that place the details of their staff on net, you are
    vulnerable and exposed to these cybercriminals” (Informants in category B, views
    expressed during an interview on September 17, 2018, at 9:30 am).


    In another view, some of the informants also narrated that cybercrimes are carried
    out through the use of computers and smartphones, leading to national insecurity.
    For instance, terrorists in Niger-Delta who steal oil and bomb the oil wells and
    pipelines communicate through phones and emails; similarly, the Boko Haram terrorists
    carried out their insurgency using internet communication such as computers, `YouTube`
    to release video messages, phones, and other means of modern communication. The
    lack of a proper mechanism put in place by the government to detect the criminals
    is causing a serious security breach and a potential threat to national security
    as is now being witnessed where the entire country is enmeshed in one form of
    insecurity or the other such as Boko Haram in the northeast, armed bandits and
    kidnapping in the northwest, a Farmers-Herders conflict in the north central region,
    militants’ activities in Niger-Delta, kidnappings in the southeast and armed robbery
    in the southwest.


    ## Implications of Cybercrime on Digital Economy


    Globally, there are around three and a half billion internet users and five billion
    mobile phone users. Ninety-nine percent of the world’s population lives in a place
    that is covered by a mobile-cellular network and 84 percent of people on the planet
    live somewhere covered by mobile broadband networks (Graham 2019, 3). The above
    statistics indicate that the world is fast becoming connected by internet and
    cyberspace activities, including Nigeria, and this by implication means a commensurate
    rate of cybercrimes and threats to digital economy. Cybercrime in Nigeria in particular
    has great implications for the digital economy because Nigeria is an emerging
    economy well-positioned to survive and prosper via e-commerce due to its population
    of about 200 million, enormous potential market, and diverse natural resources.
    The above assertion is supported by the statistics below.


    The online purchase of consumer goods in Nigeria in 2020 discloses a significant
    number of users of digital economy in the country. About 76.6 million Nigerians
    are shopping online, worth an amount of `$3.37 billion; 2.2 percent of the GDP
    comprises the activities of online consumer. The value of the e-commerce market
    is recorded at `$13 billion`, which signifies an increase of 42 percent from 2019
    and an average of `$401` per consumer. Forty percent of transactions in 2020 were
    conducted using mobile phones. Of the payment method of e-commerce in Nigeria,
    the following may be said (as of 2020): 27 percent was credit card, 24 percent
    cash, 23 percent bank transfer, 9.0 percent e-wallet, and 17 percent other. The
    number of people who are making digital payment transactions is 105 million, with
    a total annual value of `$21.61 billion`, signifying an increase of 21 percent
    from 2019 with `$206` as an average digital payment per digital payment user.
    The value of the total digital advertising market is `$1.17 billion`, with `$412
    million` spent on digital search ads, `$516 million` spent on social media ads,
    `$89 million` spent on digital banner ads, `$94 million` on digital video ads,
    and `$55 million` on digital classified ads (Global Web Index 2020).


    A summary of the views of the informants on the implications of cybercrimes on
    the digital economy is presented below in [table 4](#chapter3.xhtml#tab4).


    Table 4: Summary of the Views of Informants on the Implications of Cybercrime
    on Digital Economy.


    | **Category** | **Informants** | **Responses** |

    | --- | --- | --- |

    | A | 1 | Low level of digital trust |

    | --- | --- | --- |

    | | 2 | Affects economic growth and development particularly e-commerce |

    | | | 3 | Prevents utilization of cyberspace for jobs creation |

    | | | 4 | Discourages entrepreneurs from initiating a business model on the internet
    |

    | | | 5 | Leads to loss of billions of USD |

    | | | 6 | Sabotage the economy |

    | | | 7 | Decline in the service sectors and Value Added Tax (VAT) |

    | | | 8 | Stymied modernization of business activities leading to physical transactions
    |

    | B | 1 | Affects governmental revenue generation |

    | | 2 | Consolidates overdependence on oil only as the major source of revenue
    |

    | | | 3 | Deprives service sectors from performing |

    | | | 4 | The usual relief of physical task of business is not benefitted from
    \[sic.] |

    | | | 5 | Many businesses collapsed |

    | | | 6 | It deprives aspiring entrepreneurs of innovation and initiation |

    | | | 7 | Resources are wasted and lost unnecessarily |

    | | | 8 | Lack of confidence and cynicism about digital activities |

    | | | 9 | Secrecy is violated and compromised |

    | | | 10 | Waste of time, energy, and resources |

    | C | 1 | Lack of digital trust |

    | | | 2 | e-commerce is crippled |

