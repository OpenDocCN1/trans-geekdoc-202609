    数字实力的增长并不能很好地反映此处所讨论的国家的真实影响力：GAFAM 的崛起掩盖了美国地缘政治的衰落，而中国的技术实力则掩盖了其人口结构上的脆弱性。相反，在非洲和中东，旨在窃取数字或金融资源的黑客行动揭示了那些看似强大力量的弱点。


    因此，社会数字化率更能反映即时可用的资源，而非其未来潜力。互联网已成为竞争性经济大国之间激烈争夺的空间。这种竞争的目标是有效地将暂时供用户自由探索的空间私有化。永久连接吞噬着即时数据，并将物体和物化的人连接起来，它绕过了任何拒绝屈从的人，并将他们标记为可疑。我们可以预测，未来国家和个人将产生错误数据的迷雾，以此作为反抗行为来保护自己不被发现。^^最后，数字化正在引发意料之外的地缘政治变化。最终，它将扫除重复性工作，并将权力暂时集中在创新领地，同时让国家和企业能够通过关系映射识别意见领袖。最后，它将使军事指挥官能够命令机器人使用
    AI 驱动的脸部识别来杀死目标。我们正在进入混合文明时代。


    ### 脚注


    1. 1 所有匿名化系统背后的想法是将各种网络用户的通信混合在一起，使它们在个体上变得无法区分。结果是，数据与身份之间建立联系是不可能的。

    2. 2 网络攻击现在已变得如此复杂，以无法确定攻击者的所在地。这使得实施最新网络战略白皮书建议的进攻性战术变得困难。

    3. 3 阿诺德·汤因贝（Arnold Toynbee）写道：“如果我们孤立地观察希腊历史上的战争技术，我们将观察到从开始到结束——增长时期之前、期间甚至之后——的持续进步。我们还会观察到进步道路上的每一步都是由对希腊文明本是灾难性的事件所刺激的。”汤因贝，L’*histoire
    (Paris: Gallimard, 1951)*, 219. 译自法语原文。

    4. 4 广大的公众完全不知道 `Google` 的搜索引擎是如何运作的。

    5. 5 法官兼网络安全专家米丽亚·凯梅内尔（Myriam Quéméner）研究了法国法律如何为了应对破坏性的数字技术而发生变化。

    6. 6 苏伊士运河和马六甲海峡是海底电缆的战略点。与此同时，中国仅通过四个点与世界相。

    7. 7 `Marea` 网络由不像软管大的电缆组成，于 2017 年竣工。它连接了弗吉尼亚州和比尔湾，目前传输着全球 75%的在线流量。

    8. 8 例如，`Pastebin` 网站列出了最近的黑客攻击。注意，亚斯伯格综合征（自闭症的一种）的人特别可能表现出色。见 Silberman，“The
    Geek,” *Science*, 12。

    9. 9 因为没有可以利用的修正系统，这种错误仍然留在基因组中。----以 92%的准确率预测。

    10. 10 根据卡巴斯基实验室（Kaspersky Lab）对 2019 年针对性威胁的预测。----将影响 2016 年的选举。

    11. 11 除非，这些对抗威胁到了它们。

    12. 12 下一次病毒感染将是不可察觉的。

    13. 13 ---- 译自法语原文。

    14. 14 源自巴西的攻击继续增加。

    15. 15 在暗网中蔓延的 `Tor` 网络使用了美国海军在 20 世纪 90 年代开发的洋葱路由技术。

    16. 16 黑客可以控制仪表盘上的自动窗户和指示灯，甚至导致引擎发生故障。

    17. 17 ---- 预计将。

    18. 18 病毒使用一种不稳定的酶来繁殖。

    19. 19 例子包括史蒂夫·乔布斯、马克·扎克伯格、比尔·盖茨和 `Linux`。

    20. 20 互联网基础设施主要由高容量海底光电缆连接到陆地电缆和路由器组成。

