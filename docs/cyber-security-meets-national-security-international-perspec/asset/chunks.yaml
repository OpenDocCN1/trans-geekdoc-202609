    ## 世界数字化化：隐形权力时代


    **Thomas Flichy de La Neuville (雷内商学院)**


    ### 引言


    显而易见，连接人与设备的世界数字化进程代表了一场重大的文明转型。它正在改变权力的行使方式，并在某种程度上将其隐藏在公众视线之外。黑客匿名操作，攻击收集无意用户信息的网站。(1)
    因此，网络时代正使权力变得愈难以察觉，这反过来使得对这一当前技术转变的研究变得至关重要。(2) 然而，这项努力并非没有风险。我们面临一种危险，即把数字技术的进步误认为是文明的真正活力，而这种活力本应建立在为社会每个部分注入新生命的能力之上的。(3)
    目前，现实世界与虚拟世界正在融合，引发了对人类生命因追求技术化而被剥夺的恐惧。这种担忧被一种数字人文主义可能兴起的希望所平衡。尽管如此，局势依然严峻，因为隐形权力并不容易被发现。(4)


    事实上，网络安全研究面临的困境之一是，大多数数据公众无法获取。这一复杂的研究领域只有利用军队或情报机构的技术能力才能破译。尽管如此，通过探索链条两端的信息源，有可能克服这一障碍。在在上游，少数哲学家正在对数字世界进行批判性思考。其中一个例子是伯尔纳德·斯蒂格勒（Bernard
    Stiegler），他认为互联网是一种破坏性技术，因为数字自动化会导致避税和失业。(5) 与此同时，埃里克·萨迪尼（Eric Sadin）将人工智能（AI）定义为一种理性，它通过实时解释各种情况来不断提议服务和产品，这是一种塑造行为的技术新自由主义。最后，卡维·萨拉姆塔蒂安（Kave
    Salamatian）将互联网视为一个拥有超连接心脏的多触怪兽，其水下基础设施指示了数字地缘政治的状态。(6) 在下游，各种博客和网站见证了技术的当前活力。将科技网站
    `Wired.com`（专为非专业读者撰写）与法国网站 `InternetActu.net` 和 `Reflets.info`（提供更具批判性的观点）进行交叉引用是有很有用的。


