    AI is first and foremost about emotions.[^13](#footnote-13 Algorithms turn our
    mental space into code in an effort to capture our attention. The origins of captology
    reside in the work of Stanford University’s B. J. Fogg, who published *Persuasive
    Technology: Using Computers to Change What We Think and Do* in 2003. Persuasive
    technologies have been designed by choice architects to nudge people’s choices
    in a certain direction. Rooted in behavioral economics and neuro-marketing, they
    lend algorithms a governing power. This new economy considers our attention spans
    to be a rare and precious resource that can be used to a business’s advantage
    when it is focused on information that, in turn, provokes a particular action.
    Recognizing the potential negative effect of these techniques, Bernard Stiegler
    has criticized psychotechnology that short-circuits our attention spans, as had
    Noam Chomsky and Edward S. Herman before him when they denounced the media’s role
    in manufacturing consent. Captology can also builds on artificially generated
    anxieties, such as the “fear of missing out.” This particular fear is largely
    fueled by certain aspects of modern technology, such as mobile phones and social
    networking sites, such as `Facebook` or `Twitter`, which enable users to constantly
    compare their profiles. As the world’s internet usage grows, a proportion of individuals
    will become psychologically dependent on being online and suffer from anxiety
    whenever they are not logged in.


    Captology’s potential for generating negative outcomes within the context of global
    digitalization is clear–and yet in the imagination of the global citizenry and
    security services it is overshadowed by fear of cybercrime, which, however, tends
    to be overemphasized in the surrounding discourse.


    ## Cybercrime’s Minimal Impact on Global Digitalization


    Although cybercrime is becoming increasingly prevalent, especially in developing
    countries, groups of hackers rarely manage to paralyze organizations or states
    for long periods of time.[^14](#footnote-14) In reality, cyberattacks (which are
    often supported by states) are a sophisticated version of three ancient practices,
    namely `sabotage`, `espionage`, and `subversion`..[^15](#footnote-15) Although
    the costs involved in these operations have plummeted, cybersabotage is still
    limited in scope. Still, it has been shown capable of doing damage in various
    ways: it is now possible to blow up a pipeline, break a dam, scramble a radar,
    delay a nuclear program, shut down a bank, take control of a car or assassinate
    someone by booby-trapping their mobile phone.[^16](#footnote-16) Cyber-espionage
    is the real growth area: today, spies are overwhelmed by the amount of stolen
    data on offer, rendering them incapable of interpreting all this information shorn
    from its cultural context. In the world of espionage, attacks are becoming increasingly
    sophisticated. Certain viruses erase themselves as they go, for instance, making
    them impossible to trace.[^17](#footnote-17) They can also mutate, just like biological
    viruses.[^18](#footnote-18) As for subversion, while it is easy to start a protest
    movement online, it is very difficult to maintain in the long run. As a result,
    sabotage makes it temporarily trickier for the world to go digital, whereas espionage
    harvests the results of our constant connectivity. Ultimately, only noncommercial
    subversion is capable of endangering the current digital transition, but it is
    too infrequently executed to pose.


    Having examined the digital revolution’s workings, we can now sketch out the potential
    consequences.


    ### Digital Empires vs. Vassal States


    Geopolitics in the digitalized world are characterized by three major trends:
    an erosion of American power, an increase in Chinese power, and competition between
    the two to digitally colonize the rest of world.


    #### Eroding America’s Power


    American power entered the virtual world via an oligopoly: `GAFAM`. Made up of
    five major businesses (`Google`, `Apple`, `Facebook`, `Amazon`, and `Microsoft`)
    and founded by hackers,[^19](#footnote-19) `GAFAM` physically stores information.[^20](#footnote-20)
    As such, 80 percent of data goes through the United States, and listening stations
    are positioned close to where cables reach land.[^21](#footnote-21) The geopolitical
    implications for control over cables range from fostering dependency among overseas
    territories,[^22](#footnote-22) rising Chinese-American tensions,[^23](#footnote-23)
    and in other, less-publicized arenas such as Portuguese-Brazilian wrangling for
    control over the former colonies’ economic market.[^24](#footnote-24) Most notably,
    in response to US dominance other actors have increasingly taken countermeasures:
    For example, to evade American surveillance, Brazil has built its own cable link
    to Spain. Similarly, China has built the `Sea-me-we 5` cable to connect with the
    Middle East and, ultimately, Europe. And the `Huawei Marine` group is laying more
    more underwater cables, for instance between Brazil and Cameroon.


    Because `GAFAM` behaves like a state, Denmark dispatched an ambassador to it in
    2017. In reality, it is more like a kleptocracy, which is living off stolen data,
    and whose belief system borrows from both left-wing libertarianism and right-wing
    technological determinism.[^25](#footnote-25) The resulting techno-libertarianism
    is espoused by visionary, charismatic founders who generate innovative commercial
    offerings that are always technologically avant-garde. With support from investment
    funds, `GAFAM` spent $58 billion on research and development in 2016. They partly
    owe their monopoly to the brilliant Chinese and Indian minds that staff `Silicon
    Valley`. They are still in competition with China, however, which is trying to
    prevent them from developing any further.[^26](#footnote-26) To maintain its dominant
    position in this environment, the United States must speed up its industrial integration
    with Europe. For its part, if it hopes to reestablish its digital sovereignty,
    Europe needs to redouble its own efforts and investments in digital technology.[^27](#footnote-27)
    If it does not, it will have to accept strategic alliances which reduce it to
    nothing more than a digital vassal state.

