    by Alagappa (1987)


    This work adopts and expands the on the “National Security of Developing States”
    model postulated by Muthiah Alagappa (1987), presented and discussed below. We
    did so for three reasons. The first has to do with the chain of values and clear
    illustrations that are depicted in the diagram for easy grasp of the concepts
    involved, namely, national security and possible vulnerabilities and threats.
    Secondly, previous studies on our case have used other theories, such as political
    realism, collective security, foreign policy analysis, and other related frameworks,
    but none of them refer to this framework, clearly demonstrating the innovative
    nature, contribution, and new ideas proposed by this study. Thirdly, the theory
    as it stands leaves room for future theory building. Originally developed in 1987,
    the theory identified some internal and external threats to national security
    of developing countries at a time when cybersecurity and cybercrime in developing
    countries were practically nonexistent. But its postulations left the door open
    to explore threats in the political, social, economic, and environmental areas,
    making it easy for researchers to lean on the original postulations and build
    on the theory for further development of knowledge in the field of social sciences.


    **Figure 1: The National Security of Developing States: A Framework of Analysis**


    ![Images](images/pg-40.jpg)


    **Source: Muthiah Alagappa (1987). Expanded by the researchers.**


    The above model indicates that there are, esentially, two major threats to national
    security: internal and external threats, with both being possibly either traditional
    or nontraditional. In the internal case, there may be social incoherence and other
    vulnerabilitites that might lead to armed groups—which is a traditional threat—while
    at the external level there might be territorial and national interest issues
    that might set one country at conventional military conflict with another. From
    the nontraditional perspective, issues such as the economy, geography, social
    settings, or sea and land rights can be potential conflicts that might lead to
    insecurity internally and externally for developing states like Nigeria. For example,
    case of Boko Haram here falls within both the traditional and nontraditional threats
    and internal and external security threats that Nigeria is facing. The nature
    of threats can be economic, military, political, or, as we propose in this research,
    related to terrorism, food insecurity, or cyber attacks. Thus, as identified by
    Alagappa (1987), any serious developing country that seeks absolute national security
    must pay attention to both internal and external security and also must give consideration
    utmostly to both the trational and nontraditional military threats.


    The framework advanced by Alagappa (1987) is suitable for this study because it
    has the leverage of providing an all-round explanation of national security of
    countries like Nigeria, that is, accounting for both traditional and nontraditional
    threats. Other theoretical frameworks discussed in the above section can explain
    either the political angle or the economic perspective of cybersecurity and cybercrime.
    However, the theory we lean upon is all-encompassing in terms of both theoretical
    and empirical analysis. For instance, looking at the figures of users of mobile
    phone and internet in Nigeria and examining the loss of billions of dollars in
    cybercrime, one can easily use this framework to establish and illustrate that
    the phenomena are related to national security. The trillions of Naira deposited
    in Treasury Single Account (TSA) by the government and the hundreds of billions
    used monthly for the payment of salaries under the Integrated Personnel Payroll
    Information System (IPPIS) present a node of vulnerability if the Nigerian cybersecurity
    system is hit. In our work, we rely on empirical evidence related to cyber communication
    by criminals and terrorists in building the theoretical apparatus. In essence,
    our empirical findings strongly support the theory’s suggestion that nontraditional
    security threats to countries like Nigeria can be as strong as traditional ones.


    Our work is inspired, certainly, by that of others. For instance, Cavelty & Wenger
    (2019) opined that there is a great deal of effort within the international relations
    discipline aimed at situating its analytical discourse toward an inclusive focus
    on cybersecurity as a part of global security concerns. Cavelty et al. (2019)
    stress that cybersecurity is connected to political security because state actors
    are dealing with state and nonstate actors on the international scene whenever
    there are threats and vulnerabilities of attacks from a perceived hostile enemy.
    Cavelty et al. (2019) presented three key drivers that influence cybersecurity
    politics and research in the field. They include politics (divided into domestic
    politics and international politics), science (consisting of academic debates
    and institutionalization), and technology (involving key events and development
    and use). One of the areas that this research is interested in is domestic and
    international politics of Nigeria with regard to cybersecurity, and of particular
    relevance to us is that Cavelty et al. (2019) found it expedient to expand the
    rationale behind why research of this nature is undertaken from the theoretical
    perspective.


    There are other studies (Koops 2016; Aniekan & Afolabi 2017; Diogenes & Ozkaya
    2018; Kremling & Parker 2018; and Kshetri 2019) similar to that of Cavelty et
    al. (2019) on the nature and necessity of undertaking cybersecurity research and
    cybercrime protection from the perspective of politics. These studies suggest
    strongly that any serious country and indeed other organzations as well as individuals
    today must have a serious provision and concern for securing their personal belongings,
    data, and environment against political attacks via cyberwarfare. The Nigerian
    case is especially pertinent because of the shortage of adequate research on the
    political implications of cybersecurity in the country from the vantage point
    of national security. Research of this nature should be of paramount importance
    not only for policymaking but also for setting the foundation of future research
    on cybersecurity and politics in the Nigerian contexts and by expansion, in Africa.
    Finally, we should note an interesting work (World Bank, 2017) that emphasizes
    more the digital aspect of the question: namely, the World Bank posits that the
    extent to which consumers and organizations are going digital makes it imperitive
    for countries to secure their cyberspace.


    The theoretical and empirical contribution of our research supports the conclusion
    that the assumptions and strategies presented by the likes of Alagappa (1987),
    Cavelty et al. (2019), and Kshetri (2019) for identification of cybersecurity
    as a nontraditional political security threat that requires counteraction should
    be analyzed and digested by researchers and policymakers in the area of study.
    To reiterate, we settled ultimately for Alagappa’s model because of its permeability,
    comprehensiveness, and wider horizon in embracing all the elements and variables
    discussed in the study, such as national security, cybersecurity, cybercrime,
    digital economy, policy responses, and collective security in general.


