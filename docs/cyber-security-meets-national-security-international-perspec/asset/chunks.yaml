    # 来源：2018 年全球网络安全指数。


    然而，并非所有来源对尼日利亚网络安全的前景和挑战的看法都是相同的。我们在此以表格的形式总结并展示了他们的观点（表 2）。


    ## 表 2：受访者对尼日利亚网络安全前景与挑战的响应


    | 类别 | 受访者 | 前景 | 挑战 |

    | --- | --- | --- | --- |

    | A | 1 | 强有力的规则法规 | 缺乏执行 |

    | | 2 | 意识提高 | 信息流 |

    | | 3 | 存在网络安全法 | 缺乏对规则的遵守 |

    | | 4 | 全球合作与互联互通 | 跨境犯罪 |

    | | 5 | 用户增加和恶意软件防护 | 匿名性因素 |

    | | 6 | 全球意识论坛和政策 | 贫弱的数字知识 |

    | | 7 | 通过政策加强保护 | 网络安全管理不善 |

    | | 8 | 互联网用户水平低 | 脆弱性 |

    | | | | |

    | B | 1 | 网络犯罪制裁的出现 | 互联网的跨境性质 |

    | | 2 | 网络安全政策的可用性 | 网络空间中的漏洞 |

    | | 3 | 信息流增加 | 基础设施水平低 |

    | | 4 | 网络安全计划的出现 | 专家数量有限 |

    | | 5 | 来自先进国家的技术支持 | 怀疑和缺乏数字信任 |

    | | 6 | 弥补互联网知识差距 | 信息流水平低 |

    | | 7 | 建立网络安全法 | 机构执行失败 |

    | | 8 | 通过政策进行数字保护 | 匿名和外部威胁 |

    | | 9 | 培训和现代设备 | 运行中技术支持低 |

    | | 10 | 识别可疑活动的点 | 腐败和管理不当 |

    | | | | |

    | C | 1 | 拓宽安全研究的视界 | 专业人员和专家不足 |

    | | 2 | 存在特定的政策和制裁 | 缺乏足够的意识 |

    | | 3 | 全球意识和技术支持 | 脆弱性与人权 |

    | | 4 | 公众良知提高 | 网络空间的全球性 |

    | | 5 | 强有力的政策和表现 | 保护水平低 |

    | | 6 | 监控犯罪分子以检测 | 侵犯隐私 |

    | | | | |

    | D | 1 | 数字活动水平低 | 缺乏领域知识 |

    | | 2 | 监管的存在 | 脆弱的安全形势 |

    | | 3 | 网络安全专业人才的培训 | 缺乏政治意愿 |

    | | 4 | 信息流管理系统 | 缺乏合格的人力 |

    | | 5 | 政府的数字化政策 | 缺乏对威胁的认识 |

    | | 6 | 对诈骗者和网络分子的抵抗 | 互联网用户增加 |


    **来源：研究人员于 2018 年 7 月至 12 月期间对选定受访者进行实地调查。**


    除了上述总结外，还有一两个有见地的观点应当在此处表达。在一次访谈中，一位受访者描述道：“尼日利亚像世界上其他国家一样向网络空间倾，但存在一个巨大的挑战应该唤醒政策制定者，特别是通过有效的网络安全来保障网络空间。这是因为尼日利亚仅在
    2018 年就因网络犯罪损失了 288 亿尼日拉，这令人震惊，并对该国的互联网用户构成了威胁”（2018 年 10 月 27 日在阿比贾上午 11:30，与
    A 类受访者的访谈）。从另一个角度来看，另一位受访者透露：“尼日利亚脆弱的网络安全空间暴露了该国有多脆弱。如今，我们不再仅仅与恐怖主义斗争，还在与网络恐怖主义斗争，因为恐怖分子自己也在通过匿名原则利用网络空间来实施他们的暴行”（2018
    年 9 月 18 日上午 9:00，与 C 类受访者的访谈）。


    ## 网络犯罪对尼日利亚国家安全的影响


    由于网络犯罪具有跨境、匿名且极难检测或证明的本质，它现在已成为全球范围内主要的安全头疼问题。特别是在尼日利亚，网络犯罪指数显示出有害且脆弱的状况，根据美国联邦调查局的报告，该国位列网络犯罪指数排名前十的国家之一。报告显示，美国排名第一，英国第二，尼日利亚第三，随后是加拿大、罗马尼亚、意大利、西班牙、南非、俄罗斯和中国。除上述内容外，受访者对网络犯罪对尼日利亚国家安全的影响发表了不同的观点。这些观点以表格形式总结并呈现（表
    3）。


    ## 表 3：受访者关于网络犯罪对国家安全影响的观点总结


    | 类别 | 受访者 | 响应 |

    | --- | --- | --- |

    | A | 1 | 它为恐怖主义留了空间 |

    | | 2 | 它加剧了叛乱 |

    | | 3 | 它制造了恐惧和未被发现的犯罪扩散 |

    | | 4 | 它导致不安全在全国范围内蔓延 |

    | | 5 | 每年损失数十亿的资源 |

    | | 6 | 绑架和其他犯罪在不受阻碍的情况下猖獗 |

    | | 7 | 关键国家信息被获取 |

    | | 8 | 人们在该国不安全，包括安全人员 |

    | B | 1 | 关键国家基础设施面临风险 |

    | | 2 | 个人在私人交易中受到影响 |

    | | 3 | 恐怖分子利用网络空间进行协调 |

    | | 4 | 内部和外部诈骗者欺骗尼日利亚人 |

    | | 5 | 安全人员发现难以处理叛乱 |

    | | 6 | 反叛乱因使用互联网而面临挫折 |

    | | 7 | 犯罪分子通过电子诈诈索数十亿尼日拉 |

    | | 8 | 经济受到网络犯罪的影响 |

    | | 9 | 社会环境遭受通过互联网进行的犯罪侵害 |

    | | 10 | 手机的出现导致了网络犯罪和不安全 |

    | C | 1 | 网络分子利用智能手机和互联网进行活动 |

    | | 2 | 恐怖主义通过网络通信增加了恐怖主义 |

    | | 3 | 通过对数字企业的电子攻击存在外部威胁 |

    | | 4 | 组织数据被黑客导致每年损失数十亿尼日拉 |

    | | 5 | 国家经济因威胁而滞后 |

    | | 6 | 由于对网络犯罪的恐惧，数字经济停滞 |

    | D | 1 | 网络犯罪导致恐怖主义增加，影响国家安全 |

    | | 2 | 在线业务因相互怀疑而受到网络犯罪影响 |

    | | 3 | 关键政府信息被未经授权的人获取 |

    | | 4 | 国家安全规划面临犯罪分子黑客攻击的风险 |

    | | 5 | 使用私用手机和电子邮件暴露了个人 |

    | | 6 | 个人通过网络空间被追踪和针对 |


