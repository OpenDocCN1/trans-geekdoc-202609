    在国家层面，各国政府已通过了反黑客法律以促进网络安全，并尝试在《联合国宪章》第 51 条规定的国际承认的“国家在受到攻击时的自卫权”框架内解决这一问题（Guiora
    2017, 63）。由一些欧洲国家发起的《网络犯罪公约》是目前全球范围内网络犯罪领域唯一的国际协议。该公约也向欧洲以外的国家开放成员，例如美国、加拿大、日本和澳大利亚已签署了该公约。公约包含三个关键领域：实体法、程序性要求和国际合作。然而，一些批评者认为这些法律已经过时，未能有效帮助保护私人或政府计算机（Kosseff
    2017）。此外，正如 Maurushat (2013) 所观察到的，与网络犯罪相关的法律面临着许多挑战，包括但不限于言论自由/言论自由、版权、过失侵权行为、诽谤、非法电信拦截（监视）、隐私法、数据保护和数据泄露通知。


    ## 国家安全


    传统的国家安全思维是基于这样一个假设：国家行为体是国内和国际政治中的主要参与者（Buzan 1983, 2）。一种新的概念范式描绘了由于非国家行为体成为国家和跨国政治中强大力量的出现，冷战后期的国家安全、实际上国际安全变得更加复杂和动态（Buzan
    & Hansen, 2009, 9）。事实上，二战后盛行的权力平衡的失败凸显了国际体系中集体安全的重要性（Johari 1997, 215）。为此，人们提出了许多解决方案，其中最突出的可能是亨利·基辛格等现实主义理论者提出的威慑理论（Taylor
    2012）。


    总来说，任何国家的国家安全政策在扩展到全球之前，必须识别国内威胁并进行相应的遏制。每个国家都可能陷入永久战争；对颠覆的控制必须通过统治和自然领导力来实现，这可以通过武装力量实现（Chomsky
    & Herman 1979）。同时，当代国家安全必须解决的不仅仅军事威胁，还包括气候状况、社会环境、政治结构、国家经济基础等方面，其中网络安全尤为突出。考虑到背景，我们现在简要讨论当代尼日利亚的国家安全问题。


    ## 尼日利亚国家安全


    尼日利亚的国家安全政策强调国内保护、非洲统一、和平以及通过合作、不干涉和尊重人类尊严与价值来促进全球和平与安全。自 1960 年政治独立以来，尼日利亚采取了许多措施确保国家在扩大非洲和全球影响力的同时获得充分的保护（Yakubu
    2012, 12）。在这些目标中，基本目标是保护所有公民和其他国家居民的生命和财产。这旨在通过建立社会凝聚力、经济繁荣以及不同群体之间的共同生存来实现。表面上，尼日利亚的防御战略足于在其他问题之前承认人类尊严、个人福祉和繁荣的核心地位（Alkali
    2010, 10）。然而，决策者实际上未能充分关注这些价值观和理想导致了巨大的安全缺口，这种缺口在 1967 年的内战中，以及近年来通过恐怖主义、社区冲突、政治暴力、农村土匪、绑架、抢劫和网络犯罪表现出来。


    目前，尼日利亚面临许多许多外的安全挑战。在国内，由于多宗教、多民族和地区政治引起的动荡政治环境和脆弱的社会背景导致了安全困境，大面积连续的地理区域、渗透性强的边界和经济问题加剧了这种局面。英语区和法语区的二元对立是另一个安全担忧，尼日利亚被四个具有法国殖民背景的西非主要国家包围，在通信、外部效忠和合作方面存在巨大鸿沟（Yakubu
    2012, 14）。最近，尼日利亚面临了一种新的安全威胁，即博科哈哈姆恐怖组织（Boko Haram）的出现，他们以宗教为掩护，在国家北部（特别是东北部地区）实施针对人类的暴行。在这种背景下，Sule
    等人（2019）建议，尼日利亚安全机构的重点应转向基于网络安全和情报收集的非传统方法，以应对非传统/非军事威胁。


    ## 尼日利亚对网络安全和网络犯罪的政策响应


    在尼日利亚，《2015 年网络犯罪禁止法》（`Cybercrimes Prohibition Act of 2015`）是促进网络安全和防止国内网络犯罪的主要政策工具。该政策文件明确重申该法的主要目的是防止对国家关键基础设施的损害（第二部分，第
    3 和第 4 条）。该法描述了被视为网络犯罪并受法律惩处的的罪行（第三部分，第 5 至 36 条），包括：


    *   针对国家关键信息基础设施的犯罪；

    *   非法访问计算机；

    *   非法注册网络咖啡厅；

    *   系统干扰；

    *   拦截电子信息、电子邮件或电子货币转账；

    *   篡改关键基础设施；

    *   故意误导电子信息；

    *   非法拦截；

    *   计算机相关的伪造或欺诈；

    *   盗取电子设备；

    *   未经授权修改计算机系统；

    *   网络数据和系统干扰；

    *   欺诈电子签名；

    *   网络恐怖主义；

    *   金融机构发布的例外；

    *   虚假发布电子指令；

    *   虚假报告网络威胁；

    *   身份盗窃和冒充；

    *   儿童色情及相关犯罪；

    *   网络跟踪或网络域名抢注；

    *   种族主义和排外情绪犯罪；

    *   共谋；

    *   进口和伪造电子工具；

    *   服务提供者违反信誉；

    *   操纵 ATM/POS 终端；

    *   传播计算机病毒；（`2015 年网络犯罪法`）。


    上述确定的网络犯罪行为规定的处罚各不相同，但在严重性方面是相关的。某些犯罪被处以十年监禁且不罚金，而某些犯罪最高可处以十五监禁且不罚金。其他犯罪则处以三年监禁或处以七百万奈拉的罚金。


    ### 案例研究与方法


    截至 2018 年，全球网络指数报告尼日利亚的人口为 2.03 亿，其中 1.69 亿（83%）拥有手机连接。8949 万（42%）是互联网用户，2700
    万（13%）是活跃社交媒体用户。2020 年的数字增长指标与 2019 年相比，尼日利亚人口增加了 510 万（增长 2.6%）。这些数据标志了尼日利亚互联网和数字通信研究的一个重要门槛。


