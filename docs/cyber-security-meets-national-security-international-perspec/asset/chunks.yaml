- fmt: '

    Babayo Sule (Department of Political Science, Federal University of Kashere Gombe,
    Gombe State Nigeria); Bakri Mat (School of International Studies, Universiti Utara
    Malaysia); Usman Sambo (Department of Public Administration, Yobe State University,
    Damaturu, Yobe State Nigeria); Mohammed Kwarah Tal (Department of Political Science,
    Federal University of Kashere Gombe, Gombe State Nigeria); and Muhammad Aminu
    Yahaya (Department of Public Administration, Gombe State University Gombe State
    Nigeria).


    ### Abstract


    This study examines the implications of cybercrime and weak cybersecurity defense
    for Nigeria’s national security and digital economy from the perspective of nontraditional
    discourse within international security debates. The research adopted a qualitative
    approach to data collection and analysis, with both primary and secondary source
    data employed. The primary data involved in-depth interviews with selected informants
    from the relevant agencies in Nigeria and the available governmental policy documents
    on cybersecurity and cybercrime, including conversations with security personnel,
    academics, senior officials from security research institutes, members of private
    institutions and government agencies in communication sectors. The secondary data
    consist of books, journals, and internet sources. Our analysis reveals that cybercrime
    is flourishing in Nigeria undetected, affecting its critical national infrastructure,
    causing prolonged terrorism affecting national security and the safety of national
    environment due to weak cybersecurity capability. The article recommends that
    Nigeria adopt measures toward strengthening its cyberspace and digital environment
    to prevent crimes and promote national security and the digital economy.


    ### Introduction


    The shift in the new paradigm of security discourse that emerged during the era
    of Cold War and beyond stresses the need to pay attention to nontraditional or
    nonmilitary threats to domestic and international security (Buzan & Hansen 2009).
    Indeed, the emergence of widespread security challenges such as marine pirates,
    flood, drought, diseases, terrorism, environmental hazards, and cybercrimes necessitates
    the rethinking of the foundation of contemporary global security (Buzan 1983,
    4). Cybersecurity in particular poses an unrelenting challenge, threatening the
    existence of mankind and infrastructures across nation-states. Countries are making
    serious efforts in protecting their cyberspace from cyberattacks and cybercrimes
    in the face of threats and vulnerabilities that could cause billions of dollars’
    worth of loss in properties, cash theft, and the collapse of critical national
    infrastructures (Fischer 2009). Cybercrime is on the rise globally (Buchanan 2016),
    affecting individuals, companies, organizations, and governments with damages
    worth billions of dollars (Antonucci 2017).


    Within this context, Nigeria is a developing country battling threats to national
    security on numerous fronts, both traditional military threats and nontraditional
    challenges such as hunger, diseases, erosion, sea piracy, drought, flood, terrorism,
    and the explosion of cybercrime both within and outside its borders. Recognition
    of this latter threat led to the adoption of a policy document on cybersecurity
    by the Nigerian government in 2015, a comprehensive policy statement detailing
    the provisions and efforts of the government aimed at achieving a safer digital
    environment. Many scholars (Schjolberg & Ghernaouti-Helie 2009; Reveron & Mahoney-Norris
    2011; Schjolberg & Ghernaouti-Helie 2011; Singer & Friedman 2014; Mazurczyk, Drobniak,
    & Moore 2016; Maurer 2018) have pointed out that internet and cyberspace are global
    and pose multiple vulnerabilities to all nation states, and in fact, studies on
    Nigeria (Frank & Odunayo 2013; Olayemi 2014; Omodunbi, Odiase, Olaniyan, & Esan
    2016; Ajiji 2017; Chukwuma & Mogom 2018; and Mohammed, Mohammed, & Solanke 2019),
    though scanty on the subject matter, suggest that Nigeria is as vulnerable as
    other countries in the world to these threats.


    The Nigerian case, however, is particularly important in terms of the study of
    cybersecurity and cybercrime due to its unique set of circumstances. The country
    is the most populous state in Africa, and by extension, the biggest Black nation
    on earth. It is the tenth-largest oil producing state and the seventh most populous
    country in the world. The explosion of internet access in Nigeria should be of
    prime concern for both policymakers and key players in the world of cybersecurity,
    as vulnerability in the Nigerian context is always imminent. Yet, comprehensive
    analysis of Nigerian cybersecurity issues is woefully inadequate, a gap this article
    seeks to address. In addition to providing an overview of the situation we offer
    policy suggestions for the Nigerian government on how to improve on the existing
    cybersecurity infrastructure in the country.


    ### Literature Review


    In this section, we discuss some of the empirical and theoretical issues related
    to the subject matter of study. These include (1) the emergence of cybersecurity
    as a central global concern; (2) the evolution and character of the global digital
    economy; (3) the emergence and patterns of cybercrime globally and in Nigeria;
    (4) policies and regulations related to cybersecurity; (5) Nigerian national security;
    and (6) Nigerian policy response to cybersecurity concerns and cybercrime.


    #### Cybersecurity in the Global Context


    In the contemporary era, the rapid expansion of internet communication technologies
    and digital activities, particularly the proliferation of cellular phones, has
    created a new security concern, as large quantities of stored data have become
    the target of hackers and criminals (Rayes & Salam 2019). Further, financial transactions
    carried out in the internet arena serve as a clear avenue of vulnerability. With
    over five billion people in the world possessing mobile phones and over four billion
    having access to the internet, cybersecurity has become an inevitable and pressing
    concern (Global Web Index 2019). As cyberattacks by nation-states among themselves
    and by individual criminals against both states and public users have proliferated,
    a national security paradigm shift has emerged in intellectual discourses (Reveron
    et al. 2011). In the specific case of Nigeria, twenty-first-century statistics
    on mobile owners, internet users, and the digital economy suggest that cybersecurity
    must be taken as a serious concern by both government and private individuals.


    #### Digital Economy


    The digital economy and indeed, digital activities such as e-commerce, e-governance,
    and e-learning, have been undergoing transformation for several decades. Countries
    have been moving toward digital space for ease of life since the end of World
    War II, a phenomenon that dates to the invention of the first computer (Severo
    2019, 165). With the emergence of internet services, digital activities began
    to proliferate in the 1980s (Noam, 2019). The contemporary explosion in internet
    systems across the globe and the creation of communication gadgets such as mobile
    phones, laptops, iPad, tablets, and other gadgets that use internet services has
    effectively succeeded in digitalizing the world (Schwanholz & Graham, 2018).

