    ### The Commercial Dynamics of the Digital Revolution


    Driven by an ambition to replace human unpredictability with artificial intelligence,
    the digital revolution uses captology to monopolize consumers’ attention and has
    remained untouched by cyber-functionalities.


    #### Artificial Intelligence: A Trojan Horse Designed to Rob Humans of Their Independence


    In the years to come, the development of AI will be flanked by the development
    of 5G and quantum computing. 5G is one hundred times faster than 4G and interconnects
    people with digital devices, providing the conditions for everything from smart
    cities to automated environments. 5G is designed for the Internet of Things, such
    as smart cars and drones, for example. Switzerland has taken an early lead in
    this area, launching 338 5G masts on April 17, 2019. This technology is not without
    its risks, however, as it must be relayed every 800 meters. The waves are very
    high in frequency and noncontinuous. The situation is further complicated by the
    fact that China has a number of 5G-related patents, with obvious geopolitical
    implications. In May 2019, US president Donald Trump banned American telecoms
    networks from buying Huawei equipment. Indeed, the United States has expressed
    fears about wide-scale espionage and has pressured its allies to freeze out the
    Chinese company. However, should Huawei and other Chinese businesses be prevented
    from rolling out 5G capabilities in Europe, the cost to European telecoms operators
    would be €55 billion and eighteen months of lost time.


    On the quantum computing side, new quantum computers (and `IBM Q` in particular)
    are rendering current cryptographic protocols obsolete. While the ten or so quantum
    computers currently in existence are still in the experimental stage, in the next
    few years, the development of AI will primarily allow it to not only guide consumers’
    choices but also to reform state bureaucracy.([12](#chapter1.xhtml#footnote-12))
    A new science – captology – has been developed to this end.


    #### Captology: The Art of Invisible Manipulation

