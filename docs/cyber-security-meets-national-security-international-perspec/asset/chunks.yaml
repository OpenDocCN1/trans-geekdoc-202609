- fmt: "\n# 21. Historically, underwater cabling helped the British Empire to increase\
    \ its financial power. The first functional cable was laid in 1851 between the\
    \ coasts of France and England with the primary aim of telegraphing stock market\
    \ information. Today, the Seaborn Networks consortium has now started building\
    \ an underwater fibre optic connection between Fortaleza in Brazil and Wall Street.\
    \ Known as `Seabras-1`, the project will eventually link up to African financial\
    \ markets via South Africa.\n\n# 22. New Caledonia has been linked to Australia\
    \ via the `Gondwana-1` cable since 2009, guaranteeing it the fastest possible\
    \ communications. Orange is also planning to link French Guiana to the Caribbean.\n\
    \n# 23. The United States has responded vigorously to increasingly powerful Chinese\
    \ investments. In 2013, the American administration thwarted plans to lay a new\
    \ transatlantic cable between New York and London, to which Chinese firm `Huawei`\
    \ was meant to contribute.\n\n# 24. The `SACS` cable has linked Angola to Brazil\
    \ since February 2019, while `ELLALINK` connects Portugal to Brazil via Cape Verde.\n\
    \n# 25. GAFAM’s system bears historical comparison to the extremely mobile Venetian\
    \ gondolier company, which was able to pass information shared by travelers to\
    \ the doge.\n\n# 26. There are similarities between China’s efforts and the way\
    \ the United States attempted to block the USSR’s forays into the nuclear and\
    \ aerospace industries in the 1950s.\n\n# 27. It should be noted, for example,\
    \ that despite its legal stability and general appeal, France has not been able\
    \ to create any ground-breaking innovations within the technology realm for the\
    \ past twenty years due to its rigid labor laws.\n\n# 28. Internet addicts are\
    \ viewed as both “deviants” who need their behavior corrected and “sick patients”\
    \ who require medical help.\n\n# 29. This system is based on the questionnaires\
    \ used by certain American insurance companies.\n\n# 30. For example, Algeria\
    \ – considered the least secure country—had to call in specialist cyber police\
    \ officers to monitor its baccalaureate exams in 2017.\n\n# 31. $800 million in\
    \ 2017.\n\n# 32. Hackers are highly coveted. In fact, Dubai has even organized\
    \ a hacking fair!\n\n# 33. The word “algorithm” was invented by Persian mathematician\
    \ al-Khwarizmi in the ninth century.\n\n# 34. `Charlie Hebdo` \n\n# 35. `NSO Group`\n\
    \n# 36. `Silicon Valley`\n\n# 37. `My Text` \n\n# 38. `Lyrebird` and `WaveNet`\n\
    \n## The “Strategic Corporal”: Facing the Cyber Threat in Armies and Homeland\
    \ Security\n### Antoine-Louis de Prémonville (Officer in the French Army and independent\
    \ researcher in History and Geopolitics)\n\n#### Introduction\nThe young men and\
    \ women joining the ranks of the French Army and homeland forces every year have\
    \ a lot in common with their fellow citizens. Their habits, leisure, and tastes\
    \ are those promoted. Contrary to the cliché, servicemen don’t live on the fringes\
    \ of society. Most of them surf the Web and use social networks to keep in touch\
    \ with family and relatives while serving in France or overseas. In fact, nothing\
    \ in particular seems to protect them against exterior threats; on the contrary,\
    \ their activities make them valuable targets. Indeed, the French Armies and other\
    \ security services have tended to adopt the newest trends and technologies for\
    \ communication and self-promotion. Nowadays, the internet is available in every\
    \ boot camp and most officers daily send e-mails.\n\nGranted by the French constitution,\
    \ servicemen have the same rights as any other citizens—even if they obtained\
    \ the right to vote after women, on August 17, 1945. However, among the very specificities\
    \ of the military, they have a duty to exercise restraint regarding political,\
    \ philosophical, and religious opinions, in order not to harm the reputation of\
    \ the Armies.\n\nAs the very last wardens of the Republic, the armed forces should\
    \ not allow servicemen to express personal points of views in the name of the\
    \ institution. The dangers of this are clear. For example, even though some service\
    \ members served loyally as members of Parliament under the Third Republic, the\
    \ government at the time feared the influence of conservative officers, most of\
    \ them Catholic, Bonapartist, or royalist. That is the reason why an 1875 law\
    \ disqualified them from standing as candidates for parliament election. Admittedly,\
    \ Field Marshal de Mahon openly endorsed plans for royalist restoration and General\
    \ Boulanger had planned a military coup. Loyal but openly reluctant in his support\
    \ for the republic, Field Marshal Lyautey was far too critical as a secretary\
    \ of war.\n\nYet, today, expressing discord with the official line seems inconceivable.\
    \ Recall that the army’s nickname is the “Big Mute” ( *la* *Grande Muette*)! Even\
    \ if servicemen can be elected to Parliament, they must leave office for the duration\
    \ of their term. Along with the preservation of the reputation of the armed forces,\
    \ the discretion of servicemen on social networks is thus a professional imperative.\n"
