  trans: '


    在一次访谈中，一位消息人士强调了一个关键点，即“该国的关键基础设施面临巨大风险，例如`IPPIS`和单一财政账户（Treasury Single Account）等支付平台，以及许多利用互联网为国家提供重要服务的部门。后果是，一旦尼日利亚由于无意或故意的意外遭受网络攻击，其损害将是无法想象的”（2018
    年 11 月 11 日晚上 8:30 对 B 类类消息人士的访谈）。此外，另一位消息人士透露道，“全球国家安全趋势正向网络空间转移，集体安全正向全球范围内转向保护网络空间，这变得更为重要。如果尼日利亚的网络安全不能像当今世界其他国家那样得到应有的关注，那么可能威胁尼日利亚国家安全的犯罪活动，如恐怖主义、网络诈骗、掠夺国库以及缺乏应急国家数据库，将变得极具可能性”（2018
    年 12 月 19 日上午 11:00 对 D 类类消息人士的访谈）。从理论上讲，Alagappa 模型对加强此分析很有用，因为上述黑客和恐怖分子的活动表明，尼日利亚不安全的网络空间使该国家极大暴露在影响国家安全的犯罪活动之中。


    此外，在实地调查期间，研究人员自己注意到，每天平均收到两封邮件，他们正成为网络犯罪和诈骗的目标。某些邮件带有欧洲、美国或阿拉伯的名字，声称来自`联合国`（United
    Nations）及其他信誉良好的国际组织；邮件内容要求收件者协助将从世界各地汇入的数百万美元转入尼日利亚。目标个人会被要求提供其账户详情以协助交易，作为回报，据称他将获得转账收益的一半。在其他邮件中，目标个人会收到祝贺，并被要求作为世界卫生组织`（World
    Health Organization）年度慈善活动或`联合国`、`联合国儿童`或其他相关机构奖励的获奖者提交详情。所有作为本研究受访对象的消息人士也证实了同样的经历。有时是来自某些不良分子的直接电话，声称必须发送账户号码和银行验证码（`BVN`）以修正账户问题。一旦发送，你就会开始收到提醒，显示你正在取款、账户被黑以及资金被盗。“从本质上说，一旦你的邮箱上线，你是互联网和电子邮件的频繁用户，尤其是那些发表了包含地址详情和其他机构信息的学者，以及那些在网上公布员工详情的机构，你就变得脆弱，并暴露在这些网络犯罪分子面前”（B
    类消息人士，2018 年 9 月 17 日上午 9:30 访谈期间表达的观点）。


    在另一种观点中，一些消息人士还叙述了网络犯罪是通过使用电脑和智能手机实施，导致了国家不安全。例如，尼日利亚三角洲地区偷窃石油并炸毁油井和输管道的恐怖分子通过电话和电子邮件进行通信；同样，博科哈姆（Boko
    Haram）恐怖分子利用互联网通信手段，如电脑、通过`YouTube`发布视频信息、手机和其他现代通信手段进行叛乱。政府未能建立检测犯罪分子的适当机制，导致了严重的安全漏洞和对国家安全的构成的潜在威胁，正如目前所看到的，整个国家正陷入了各种形式的不安全之中，例如东北部的博科哈姆、西北部的武装匪匪和绑架、北中部地区的农民与牧民冲突、尼日利亚三角洲的武装分子活动、东南部的绑架案以及西南部的武装抢劫。


    ## 网络犯罪对数字经济的影响


    在全球范围内，有约 35 亿互联网用户和 50 亿手机用户。全球 99%的人口生活的移动蜂窝网络覆盖范围内，地球上 84%的人居住在移动宽带网络覆盖区域（Graham
    2019, 3）。上述统计数据表明，世界正迅速通过互联网和网络空间活动连接起来，尼日利亚也是如此，这意味着网络犯罪和对数字经济的威胁也随之同比例增长。特别是尼日利亚的网络犯罪对数字经济具有巨大影响，因为尼日利亚是一个新兴经济体，凭借约
    2 亿人口、巨大的潜在市场和多样化的自然资源，非常利于通过电子商务实现生存和繁荣。上述断言得到了下表统计数据的支持。


    2020 年尼日利亚的消费品在线购买显示，该国拥有大量的数字经济用户。约 7660 万尼日利亚人进行在线购物，价值达`33.7 亿美元`；GDP 的 2.2%构由在线消费活动组成。电子商务市场的价值记录为`130
    亿美元`，标志着比 2019 年增加了 42%，每位消费者的平均花费为`401 美元`。2020 年 40%的交易是通过手机完成的。在尼日利亚电子商务的支付方式中，如下（截至
    2020 年）：27%信用卡，24%现金，23%银行转账，9.0%电子钱包，17%其他。进行数字支付交易的人数为 1.05 亿，年度总值为`216.1 亿美元`，比
    2019 年增长 21%，每位数字支付用户的平均支付金额为`206 美元`。数字广告市场总价值为`11.7 亿美元`，其中`4.1 亿美元`用于数字搜索广告，`5.1
    亿美元`用于社交媒体广告，`8900 万美元`用于横幅广告，`9400 万美元`用于视频广告，`5500 万美元`用于分类广告（Global Web Index
    2020）。


    关于网络犯罪对数字经济影响的观点总结见下表 4。


    表 4：消息人士关于网络犯罪对数字经济影响的观点总结。


    | **类别** | **消息人士** | **观点** |

