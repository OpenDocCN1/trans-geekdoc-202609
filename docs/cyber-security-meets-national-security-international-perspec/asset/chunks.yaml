    On the state level, governments have adopted antihacking laws to help promote
    cybersecurity and attempted to approach the issue within the framework of the
    internationally recognized right of nation-states’ rights to defend themselves
    when attacked, in accordance with article 51 of the UN Charter (Guiora 2017, 63).
    The Convention on Cybercrime, initiated by some European countries, is the only
    international agreement in existence at the global level in the area of cybercrime.
    It is also open for membership to countries outside of Europe, being signed for
    example by the United States, Canada, Japan, and Australia. The convention comprises
    three key areas: substantive law, procedural requirements, and international cooperation.
    However, some critics argue that these laws are outdated and have failed to help
    effectively protect either private or government computers (Kosseff 2017). Further,
    as observed by Maurushat (2013), the challenges of laws related to cybercrime
    are many, including but not limited to the issues of freedom of expression/freedom
    of speech, copyright, tort of negligence, defamation, illegal telecommunications
    interception (surveillance), privacy law, data protection, and data breach notification.


    ## National Security


    The traditional thinking on national security was predicated on the assumption
    that state actors are the major players in national and international politics
    (Buzan 1983, 2). A new conceptual paradigm depicts that national security and
    indeed, international security, is more complex and dynamic in the post–Cold War
    era because of the emergence of nonstate actors as powerful players in national
    and transnational politics (Buzan & Hansen, 2009, 9). Indeed, the failure of the
    balance of power that had reigned after World War II highlighted the importance
    of collective security in the international system (Johari 1997, 215). To this
    end, a number of solutions have been proffered, of which perhaps the most prominent
    is the deterrence theory as advanced by Realist theorists such as Henry Kissinger
    (Taylor 2012).


    Generally speaking, the national security policy of any state must identify threats
    domestically and contain them accordingly before expansion toward the global level.
    Every state may be involved in permanent warfare; control over subversion must
    be through domination and natural leadership, which is attainable through armed
    forces (Chomsky & Herman 1979). At the same time, in the present-day national
    security must address more than just military threats, to include climate conditions,
    social settings, political structure, the economic basis of the country, among
    other aspects, with cybersecurity prominent among them. With this context in mind,
    we now turn briefly to a discussion of national security issues in contemporary
    Nigeria.


    ## Nigerian National Security


    Nigeria’s national security policy emphasizes domestic protection, African unity,
    peace, and the promotion of global peace and security through cooperation, noninterference,
    and respect for the dignity and value of mankind. Since political independence
    in 1960, Nigeria has adopted many measures to ensure that the country would protect
    itself adequately while extending its influence at the African level and globally
    (Yakubu 2012, 12). Of these goals, the fundamental objective is the protection
    of the lives and properties of all the citizens and other inhabitants of the country.
    This is meant to be achieved through building social cohesion, economic prosperity,
    and mutual coexistence between different groups. Ostensibly, the Nigerian defense
    strategy is anchored in the understanding the centrality of the recognition of
    the dignity of mankind, personal well-being, and prosperity before other issues
    (Alkali 2010, 10). However, the failure of policymakers to in fact pay adequate
    attention these values and ideals created a huge security gap, which manifested
    in 1967 through the civil war and later in recent years through terrorism, communal
    clashes, political violence, rural banditry, kidnapping, robbery, and cybercrimes.


    Currently, Nigeria faces many security challenges, both internally and externally.
    Within the country, the volatile political environment and fragile social settings
    emanating from multireligious, multiethnic, and regional politics have contributed
    to security dilemmas, exacerbated by a large contiguous geography, porous borders,
    and economic problems. The Anglophone and Francophone dichotomy is another security
    concern, in which Nigeria is surrounded by four major West African countries with
    a French colonial past, creating a wide gap in terms of communication, external
    allegiance, and cooperation (Yakubu 2012, 14). More recently, Nigeria has come
    to face a new security threat, namely, terrorism, with the emergence of the Boko
    Haram, which shields itself under the umbrella of religion to commit heinous crimes
    against mankind in the northern part of the country, particularly the northeastern
    enclave. Within this context, Sule et al. (2019) have suggested that the major
    focus of the Nigerian security apparatus should pivot toward a nontraditional
    approach based in cybersecurity and intelligence gathering to address nontraditional/nonmilitary
    threats.


    ## Nigerian Policy Response to Cybersecurity and Cybercrime


    In Nigeria, the `Cybercrimes Prohibition Act of 2015` is the major policy instrument
    meant to boost cybersecurity and prevent cybercrimes in the country. The policy
    document reiterates unequivocally that the major aim of the act is the prevention
    of damage to critical national infrastructure (part II, sec. 3 and 4). The act
    describes those offenses that are considered to be cybercrimes and punishable
    by law (part III, sec. 5 to 36), including:


    *   offenses against critical national information infrastructure;

    *   unlawful access to a computer;

    *   illegal registration of a cybercafé;

    *   system interference;

    *   interception of electronic messages, email, or electronic money transfers;

    *   tampering with critical infrastructures;

    *   willful misdirection of electronic messages;

    *   unlawful interceptions;

    *   computer related forgery or fraud;

    *   theft of electronic devices;

    *   unauthorized modification of computer systems;

    *   network data and system interference;

    *   fraudulent electronic signature;

    *   cyber terrorism;

    *   exceptions to financial institutions posting;

    *   fraudulent issuance of e-instructions;

    *   fraudulent reporting of cyber threats;

    *   identity theft and impersonation;

    *   child pornography and related offenses;

    *   cyberstalking or cybersquatting;

    *   racist and xenophobic offenses;

    *   conspiracy;

    *   importation and fabrication of e-tools;

    *   breach of confidence by service providers;

    *   manipulation of ATM/POS terminals;

    *   spreading a computer virus; (`Cybercrime Act, 2015`).


    The punishments stipulated for the above identified cybercrimes offenses vary
    but are related in terms of their severity. Some are punishable with ten-year
    imprisonment without an option of a fine while some risk up to fifteen years without
    an option for a fine. Others are punishable with a three-year imprisonment or
    an option of a fine amounting to seven million Niara.


    ### The Case Study and Methodology


    As of 2018, the Global Web Index reported Nigeria’s population to be 203.6 million,
    with 169.2 million (83 percent) having mobile phone connections. 89.49 million
    (42 percent) are internet users and 27 million (13 percent) are active social
    media users. The digital growth indicators in 2020 from that of 2019 indicate
    an increase of 5.1 million (2.6 percent) million in Nigerian population. These
    figures indicate an important threshold in the study of internet and digital communication
    in Nigeria.

