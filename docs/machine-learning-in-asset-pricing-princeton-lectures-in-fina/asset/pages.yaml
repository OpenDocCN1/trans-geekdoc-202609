  md: 'These R² numbers again highlight the low signal-to-noise ratio in stock return
    prediction applications. Even though CV R² of around 1% are economically substantial—the
    implied standard deviation of the predictable component of annual returns is about
    4%—the predictable component only accounts for a very small part of total return
    variance.


    Since we estimated the hyperparameter γ by maximizing the CV R² on the validation
    folds, the CV R² reported in Table 3.2 are not fully out-of-sample. Out-of-sample
    R² on test data sets used neither in model training nor hyperparameter estimation
    are likely somewhat lower. Later in this chapter, we look at such out-of-sample
    R². But even leaving this issue aside for now, there are questions about the suitability
    of R² measures in predictive performance assessment and as objectives in hyperparameter
    optimization in an asset pricing application. We look into these issues first.


    # 3.2 Predictive Performance Assessment


    ML applications often focus on minimization of the sum of squared prediction errors.
    Correspondingly, the sum of squared prediction errors, or functions of it like
    the R², are often used as a predictive performance measure. It may seem natural
    that minimization of individual stock return prediction error is an appropriate
    objective in a stock return prediction application, too.


    However, it is not obvious that this is the right approach in an asset pricing
    setting. For example, in a portfolio management application, the ultimate goal
    often is not to predict returns on individual assets but rather to construct a
    portfolio that earns a high return relative to its risk out-of-sample. Similarly,
    when researchers study risk premia or market efficiency, they may be more interested
    in the risk-return properties of portfolios that aggregate the returns of groups
    of securities rather than of individual security returns. Methods that yield better
    predictions of individual security returns, in the sense of a higher predictive
    R², do not necessarily yield better portfolios in terms of standard metrics such
    as the portfolio’s Sharpe ratio. Therefore, the fact that ridge regression in
    the second row of Table 3.2 produces a higher CV R² than an OLS regression does
    not necessarily mean that a portfolio constructed to exploit the predicted return
    differences between stocks based on the ridge estimates would perform better on
    the cross-validation folds than one based on the OLS estimates.


    Column (iv) in Table 3.2 illustrates this. This column shows the annualized cross-validated
    mean return of a portfolio in which individual stocks are weighted by the predicted
    returns from the estimated regression. In'
