  md: 'can map Bayesian estimation into the ridge and lasso regressions we discussed
    earlier in this chapter. As we show now, the specification of the prior distribution
    affects the type of penalization that is imposed on the objective function.


    Suppose we have the view that the elements of $\mathbf{g}$ are drawn from a multivariate
    normal distribution, $\mathbf{g} \sim \mathcal{N}(0, \Sigma_g)$. Given this prior
    distribution, $p(\mathbf{g})$, and the likelihood, $p(\mathbf{y}|\mathbf{g})$,
    implied by the normal distribution of the regression residuals $\boldsymbol{\varepsilon}$,
    Bayes’ rule tells us that the posterior distribution of $\mathbf{g}$ given the
    observed data $\mathbf{y}$ follows


    $$p(\mathbf{g}|\mathbf{y}) \propto p(\mathbf{y}|\mathbf{g})p(\mathbf{g}). \tag{2.21}$$


    With normal prior and likelihood, the posterior distribution is normal, too. The
    mean of this posterior distribution takes a form akin to a generalized least-squares
    (GLS) regression, but with an additional term in the inverse (Lindley and Smith
    1972):


    $$\hat{\mathbf{g}} = \left(\mathbf{X}^{\prime}\Sigma^{-1}\mathbf{X}+\Sigma_g^{-1}\right)^{-1}\mathbf{X}^{\prime}\Sigma^{-1}\mathbf{y}.
    \tag{2.22}$$


    The additional term $\Sigma_g^{-1}$ in the inverse induces shrinkage that tilts
    the estimates away from the GLS estimates toward the mean of the prior distribution
    (which we assumed to be a vector of zeros here). If we specialize to uncorrelated
    homoskedastic regression residuals, $\Sigma=I_N\sigma^2$, and uncorrelated and
    homoskedastic elements of $\mathbf{g}$ under the prior distribution, $\Sigma_g=I_K\sigma_g^2$,
    we obtain


    $$\hat{\mathbf{g}} = \left(\mathbf{X}^{\prime}\mathbf{X}+\frac{\sigma^2}{\sigma_g^2}I_K\right)^{-1}\mathbf{X}^{\prime}\mathbf{y}.
    \tag{2.23}$$


    This expression is identical to the ridge regression estimator in (2.7) with $\gamma=\sigma^2/\sigma_g^2$.
    This means that the ridge regression penalty has a Bayesian interpretation that
    relates $\gamma$ to the dispersion in the prior distribution. If $\sigma_g^2$
    is large, which implies that we do not have a precise prior view about the likely
    magnitude of the elements of $\mathbf{g}$, $\gamma$ is small and there is little
    shrinkage toward the prior mean. In contrast, if the prior distribution is tightly
    concentrated around the prior mean, with $\sigma_g^2$ small, then shrinkage is
    strong.


    The Bayesian framework allows us to give a more precise interpretation of the
    concern about “overfitting” that we used earlier to motivate regularization and
    shrinkage. Overfitting means estimating a model without giving proper weight to
    prior information that we have about the parameters. If our prior is diffuse,
    $\sigma_g^2 \rightarrow \infty$, there is really no motivation for shrinkage.
    In this case, fitting a regression without shrinkage'
