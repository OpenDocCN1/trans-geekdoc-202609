    # 5.4 Extensions


    The basic modeling framework can be extended in a number of interesting directions
    that may bring further realism to the model. This section briefly reviews two
    of these directions: sparsity in investors’ cash flow forecasts and extra shrinkage
    or sparsity. Both of these can be understood as modifications of the prior beliefs
    that investors approach the learning problem with.


    # 5.4.1 Sparsity


    The stochastic environment we have assumed so far leads investors to apply shrinkage
    in their cash flow forecasting regressions, but they do not impose sparsity. But
    it may be plausible that investors also use sparsity to discipline their forecasting
    models in a high-dimensional environment. By changing distributional assumptions,
    we can obtain a sparse solution in investors’ learning problem that still remains
    close to, but not exactly equal, to the Bayesian posterior mean. We need that,
    (i) investors’ prior is that the elements $g_j$ of $g$ are drawn from a Laplace
    distribution, $$f(g_j)=\frac{1}{2b}\exp\left(-\frac{|g_j|}{b}\right),$$ where
    $2b^2 = \frac{\theta}{\gamma}$ is the variance; and (ii) investors price assets
    based on the mode rather than the mean of the posterior distribution (i.e., based
    on a MAP estimator). In this case, investors’ forecasts can be represented as
    the fitted values from a Lasso regression (Tibshirani 1996).


    That investors use the posterior mode in pricing is a deviation from the fully
    Bayesian framework. As a consequence, the result that the expected OOS portfolio
    return in (5.29) is zero no longer holds exactly. In simulations, Martin and Nagel
    (2019) show that the deviations are small, and overall, the return predictability
    looks very similar to the shrinkage without sparsity case.'
