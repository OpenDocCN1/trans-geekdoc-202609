    that the expected return effect is concentrated among stocks with extreme values
    of the characteristic. Fama and French (2008) and Freyberger, Neuhierl, and Weber
    (2020) provide evidence of nonlinear effects for other anomalies but in terms
    of portfolio sorts and cross-sectional return prediction rather than SDF estimation.
