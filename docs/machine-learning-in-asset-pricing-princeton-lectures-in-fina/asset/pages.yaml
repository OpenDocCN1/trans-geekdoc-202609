  md: 'exponential weighting is that we can express $\hat{g}_t$ as a recursively updated
    estimator:


    $$\hat{g}_t = (1-\phi)\hat{g}_{t-1} + \phi (X''X + \gamma I_K)^{-1}X''r_t. \tag{3.29}$$


    This means that to compute the estimate for a new period, we do not need to reestimate
    over the whole sample. Instead, we can just use the most recent period’s return
    data to compute the second term in (3.29) and use it to update the previous period’s
    estimate.


    Rolling windows and exponential weighting, and related techniques, are not new
    to asset pricing. But there are additional complications with ML techniques on
    high-dimensional data sets where regularization is required. In regularized methods
    like ridge regression and lasso, the issue is not only how to track structural
    change in the parameters of the prediction model, but also whether and how to
    adapt the values of the penalty hyperparameters over time. In the ridge regression
    example in (3.29) we kept the penalty parameter $\gamma$ fixed, but there is not
    necessarily a good reason to keep it fixed over time. And if it can vary over
    time, we need a data-driven method to estimate how it changes over time. However,
    simply reestimating the penalty hyperparameters every period in overlapping rolling
    or expanding windows may be computationally too expensive. With big data sets,
    the computational burden can be substantial. To circumvent this computational
    burden, Monti, Anagnostopoulos, and Montana (2018) propose a recursive updating
    scheme for penalty hyperparameters. This is potentially a promising avenue for
    asset pricing applications, too.


    Structural change considerations also raise questions about the suitability of
    CV methods for model validation and hyperparameter tuning. Typical implementations
    of $k$-fold CV presume that the temporal position of a validation fold relative
    to the training folds is irrelevant. Validation folds can be drawn from data that
    is older than some of the training data. In a stationary setting, this is fine.
    But when structural change is present, it is not clear that drawing validation
    data from time periods that precede all or part of the training data is appropriate.
    The direction of time can matter. A model that performs well in predicting data
    in backward validation folds may not necessarily perform well in predicting forward.
    This is an important issue for asset pricing applications of ML and there is so
    far little research tackling it. In Chapter 5 we will return to this question.


    # 3.9  Concluding Remarks


    In this chapter, we have explored fundamental issues that arise in the application
    of supervised ML techniques in asset pricing. In many ways, ML methods are well
    suited for prediction problems in academic research'
