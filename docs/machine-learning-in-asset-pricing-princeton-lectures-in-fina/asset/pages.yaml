- pgno: 41
  md: 'The same issue we discussed regarding the scaling of covariates for ridge regression
    applies to the lasso as well. When we apply the lasso, we implicitly express the
    view that a Laplace distribution with equal dispersion for each of the elements
    of g is the appropriate prior distribution. If we do not think this is a plausible
    assumption, we need to rescale the covariates accordingly. The off-the-shelf approach
    of standardizing covariates before lasso estimation is not necessarily the right
    approach.


    Finally, we can give cross-validation a heuristic Bayesian interpretation as well.
    CV is essentially a way of estimating the prior dispersion σ_g^2 from the data.
    As we already discussed earlier, there is a connection between the complexity
    penalty imposed by the AIC and penalty choice based on CV. George and Foster (2000)
    show that there is in turn a close relationship between estimation that optimizes
    the AIC (or related measures of fit that impose a complexity penalty) and empirical
    Bayes estimation. In the empirical Bayes approach, the prior parameters are estimated
    empirically by putting an uninformative hyperprior on the prior parameters and
    then looking for prior parameter values that maximize the posterior probability.
    We can think of CV therefore as approximating an empirical Bayes approach in which
    we estimate parameters of the prior distribution from the data.


    In summary, regularization has a Bayesian interpretation as the expression of
    prior knowledge about model parameters. Even if we do not formally follow a full
    Bayesian approach, we can use the Bayesian interpretation to bring domain-specific
    knowledge to bear on the learning problem. Preprocessing of data (e.g., scaling),
    or the specification of penalties (e.g., which kind of norm of the parameter vector
    to penalize), implicitly expresses prior views. The Bayesian interpretation can
    help us make these choices in a way that is appropriate for the specific ML problem
    we intend to tackle. In the next chapter, we examine properties of typical prediction
    problems in asset pricing and what these properties tell us, through a Bayesian
    lens, about appropriate preprocessing and specification choices.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# SUPERVISED LEARNING IN ASSET PRICING


    THE SUPERVISED ML methods we reviewed in Chapter 2 are potentially valuable additions
    to the toolkit in asset pricing. Many prediction problems in asset pricing are
    of high-dimensional nature in that a large number of observable variables could
    have useful predictive information. For example, in stock return prediction a
    huge number of variables could potentially be relevant as predictors. Firm characteristics
    from accounting data, signals extracted from textual information in corporate
    disclosures, variables summarizing the history of price and trading volume, information
    in media reports, and many other variables could potentially contain predictive
    information.


    Until recently, much of the existing literature in asset pricing has dealt with
    this high dimensionality by imposing ad hoc sparsity. Rather than considering
    large numbers of predictors simultaneously, researchers often consider small sets
    of predictors in isolation. For example, when researchers investigate a new predictor
    variable, a common approach in the academic literature is to evaluate whether
    the variable has marginal predictive information relative to a small “standard”
    set of firm characteristics, for instance, those used in the factors models of
    Hou, Xue, and Zhang (2015) and Fama and French (2015) (size, book-to-market equity,
    investment, profitability). The problem with this approach of considering small
    sets of predictors in isolation is that there could be substantial redundancy
    among the predictors that have been discovered in the literature.


    There is no compelling economic motivation for the ad hoc sparsity imposed in
    this traditional approach. Accordingly, there is a need for approaches that can
    handle the high dimensionality of the prediction problem without imposing ad hoc
    sparsity. ML methods are well suited for this task, but straight off-the-shelf
    application of these methods is unlikely to fully exploit their potential. Asset
    pricing applications are in important ways different from the applications, often
    in the technology sector, for which the ML methods have originally been developed.
    Table 3.1 lists some of these differences. Of course, these distinctions are not
    always so clear-cut, but in many cases they will be relevant to some degree.'
  merge: -1
  img_proc: true
