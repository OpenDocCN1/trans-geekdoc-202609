    These results raise questions about the interpretation of empirical research in
    cross-sectional asset pricing. Some empirical studies in this area econometrically
    test asset pricing models. Others search for new factors or return predictors.
    The vast majority of this empirical work looks at the data, implicitly or explicitly,
    through the lens of rational expectations models in which investors are assumed
    to know the relevant parameters of the processes generating asset fundamentals.
    Under this null hypothesis, in-sample regressions run ex post on historical data
    consistently estimate the return predictability that investors see ex ante. Hence,
    the conclusion follows that such in-sample return predictability must reflect
    either risk premia or systematic mistakes investors make when pricing assets.
    The results reviewed in this chapter cast doubt on this interpretation. When investors
    face a high-dimensional environment, in-sample return predictability evidence
    loses the economic content it has in a rational expectations setting. While the
    rational expectations model may be a good approximation when investors’ environment
    is low-dimensional and hence learning only has small effects on asset prices,
    it is no longer a good approximation in the high-dimensional case. In-sample predictability
    can be the consequence of investors not having precise knowledge of the parameters
    of a data-generating process that involves large numbers of potentially relevant
    predictor variables.


    Put differently, the economic content of the (semi-strong) market efficiency notion
    that prices “fully reflect” all public information (Fama 1970) is not clear in
    a high-dimensional setting. Researchers usually emphasize the “joint hypothesis
    problem” as the main difficulty in interpreting market efficiency tests: the econometrician
    studying asset prices does not know the model that determines risk premia required
    by risk-averse investors. But even leaving aside this problem, the interpretation
    of the market efficiency notion is not clear. Does “fully reflect” mean that investors
    know the parameters of the cash flow prediction model or, alternatively, that
    investors employ Bayesian updating when they learn about these parameters? The
    analysis in this chapter shows that there is a big wedge between these two interpretations.
    The former, adopted in much of the empirical literature, can be tested with in-sample
    return predictability regressions. In a setting in which investors face a high-dimensional
    environment, this does not seem like an economically interesting hypothesis. Its
    rejection does not warrant the conclusion that risk premia must be presented or
    that investors must be subject to behavioral biases that induce mispricing.


    This suggests an alternative interpretation of the “factor zoo” in the cross-section
    of stock returns (Cochrane 2011; Harvey, Liu, and Zhu'
