- pgno: 26
  md: '$$\min_{g}\left[\frac{1}{N}(y-Xg)''(y-Xg)+\gamma\sum_{j=1}^{K}|g_j|\right].
    \tag{2.8}$$


    Unlike in the ridge case, the solution is not linear in $y$ and there is no closed-form
    expression for this solution, but several procedures exist that can solve numerically
    for the lasso solution, including the least angle regression (LARS) algorithm
    (Hastie, Tibshirani, and Friedman 2009).


    As in the ridge regression case, this penalty specification also induces shrinkage
    of coefficients toward zero. But shrinkage is of a different nature here. Unlike
    ridge regression, the lasso can yield *sparse coefficient* estimates, where only
    a small number of the elements of $\hat{g}$ are nonzero.


    In the special case of $X$ with orthonormal columns, the lasso shifts OLS estimates
    toward zero by a fixed amount $\gamma$, but if doing so would flip the sign for
    an element of $\hat{g}$, this element is set to zero instead (Hastie, Tibshirani,
    and Friedman 2009). This means we have $\hat{g}_j=\operatorname{sgn}(\hat{g}_{j,OLS})(|\hat{g}_{j,OLS}|-\gamma)_+$.


    *Elastic net.* The lasso runs into problems with correlated variables. Suppose,
    for example, that we have two strongly positively correlated covariates that are
    both associated with a corresponding element of $g$ that takes exactly the same
    true value. Whether we include only one or the other covariate among the nonzero
    coefficients (with coefficient estimate doubled relative to the true coefficient)
    or both (with the two coefficient estimates approximately equal to the true coefficients)
    affects approximately neither the loss part nor the penalty part of the lasso
    objective in (2.8). As a consequence, the lasso is nearly indifferent between
    including one, the other, or both covariates among those that get nonzero coefficients.
    It may depend on some irrelevant properties of noise in the data which of these
    options lasso will pick. Slight tweaks to the data could lead the lasso to flip
    from selecting one instead of the other variable. To maximize predictive performance,
    it may however be best to include an average of both covariates in the model,
    so that we average out the noise of the two covariates. This is precisely what
    ridge regression would do.


    For this reason, the elastic net (Zou and Hastie 2005) combines ridge and lasso
    penalties


    $$\min_{g}\left[\frac{1}{N}(y-Xg)''(y-Xg)+\gamma_1\sum_{j=1}^{K}|g_j|+\gamma_2g''g\right].
    \tag{2.9}$$


    Like the lasso, the elastic net will set some coefficients to exactly zero, but
    it relies on variable selection to a lesser degree than the lasso and instead
    also imposes some ridge-like shrinkage.


    One important issue that we will come back to in the next chapters is that the
    ridge, lasso, and elastic net solutions are not invariant to the'
