    portfolio performance. For this reason, we first look more closely into the effects
    of regularization on portfolio performance before we look at consequences of a
    non-diagonal covariance matrix of returns.


    # 3.3 REGULARIZATION AND INVESTMENT PERFORMANCE


    In this section, we examine the effects of regularization on the OOS $R^2$ and
    portfolio performance in a validation data set. As before, we use ridge regression
    as an example, but the lessons we draw from this analysis apply more broadly to
    other forms of penalized regression like lasso as well.


