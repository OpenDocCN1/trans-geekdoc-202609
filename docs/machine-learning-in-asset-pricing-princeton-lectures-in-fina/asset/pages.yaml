- pgno: 131
  md: 'I begin with empirical applications of ML tools. Part of the challenge in empirical
    work is to sort out how to select and tweak ML methods to be most useful in asset
    pricing applications. Some progress has been made, but many questions remain about
    economically appropriate methods of regularization, the role of nonlinearities,
    and how to deal with structural change in the underlying data-generating process.


    While most of the recent ML applications in asset pricing have focused on return
    prediction or closely related tasks, ML methods could be useful for other purposes,
    too. I discuss two areas where application of ML methods seems promising. Both
    broadly fall into the area of asset demand analysis. One is the empirical estimation
    of asset demand systems from detailed investor portfolio holdings data; the other
    is the analysis of investor expectations data.


    Finally, I offer some suggestions on how asset pricing theory could advance by
    adopting ML as a model of investor belief formation in high-dimensional environments.
    This discussion builds on the analysis in Chapter 5, which raised questions about
    how to conduct and interpret empirical work on return predictability. But the
    insights researchers have obtained so far may just be the tip of the iceberg.
    There are many directions in which one could take this approach further. There
    is more to be discovered about asset pricing from exposing investors within theoretical
    models to a realistically complex, high-dimensional environment in which learning
    is difficult.


    # 6.1  Characterizing Investment Opportunities


    Return predictability analyses, factor model estimation, and construction of empirical
    SDFs all help to characterize the investment opportunities available in financial
    markets. Given the richness of the information that is available to researchers
    for constructing predictors of returns and risks, this is a natural area for application
    of ML methods. Early work in this area has often taken tools off the shelf from
    elsewhere in the ML literature. Much work remains to be done to adapt ML tools
    for the specific conditions in asset pricing.


    # 6.1.1  Economic Restrictions for ML


    Given the low signal-to-noise ratio in asset price data, prior knowledge of the
    researcher plays a more important role than in other ML applications. An extremely
    flexible, purely data-driven approach is unlikely to work well. For this reason,
    it is important to fuse ML methods with'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'economic restrictions that provide some a priori structure to guide the choice
    of ML algorithm, the method of regularization, and other aspects of the approach.


    Chapter 4 illustrated how this can be done in a Bayesian regression setting. The
    Bayesian setting made it relatively straightforward to connect the estimation
    approach with economic restrictions. In this case, economically motivated restrictions
    like the absence of near-arbitrage opportunities and concentration of factor premia
    in major sources of return covariance can be imposed through the prior beliefs
    about SDF parameters.


    This approach, however, completely abstracted from frictions. This potentially
    misses useful prior information about assets and portfolios that are most likely
    to exhibit big magnitudes of expected excess returns and Sharpe ratios. Short-sale
    constraints and other limits to “arbitrage” could cause such premia to be concentrated
    among assets where these frictions are particularly strong. Therefore, extending
    the prior beliefs specification to allow for friction-induced patterns in expected
    returns could potentially lead to further improvement in out-of-sample predictive
    power. For this purpose, one would need to relate the prior variance of expected
    asset returns to asset characteristics that predict the presence of frictions.
    This would reduce the degree of shrinkage that is applied to expected return estimates
    for assets that are likely affected by frictions.


    It would also be interesting to build stronger bridges between structural economic
    models of asset prices (i.e., asset pricing models with explicit assumptions about
    investor beliefs and preferences) and ML approaches. With the Bayesian regression
    framework, this again should not be too complicated. One could tilt prior beliefs
    about expected returns or SDF parameters toward the predictions implied by structural
    asset pricing models. This would be somewhat similar in spirit to the approach
    in Pástor and Stambaugh (2000), but in a high-dimensional setting and with structural
    rather than reduced-form asset pricing models. An analysis along these lines would
    allow researchers to investigate whether imperfect, partially misspecified models
    could nevertheless have some value in describing the investment opportunity set.


    A Bayesian regression approach makes it relatively easy to inject economic restrictions
    through prior beliefs. But there are many other interesting ML approaches that
    do not fit into the Bayesian regression framework. An important task for future
    research is to investigate whether one can combine economic reasoning with other
    ML methods, too. Bryzgalova, Pelger, and Zhu (2019) take some steps toward this
    goal for tree-based methods. They prune and shrink trees based on a penalized
    mean-variance optimization problem that is closely related to the criterion that
    we discussed in Chapter 4 within the Bayesian regression approach.'
