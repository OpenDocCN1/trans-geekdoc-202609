  md: 'where the subscript 2 indicates an OOS sample moment from the withheld sample.
    We repeat this procedure \(k\) times, each time treating a different subsample
    as the OOS data. We then average the \(R^2\) across these \(k\) estimates, yielding
    the cross-validated \(R^2_{\mathrm{oos}}\). Finally, we choose \(\gamma\) (or
    \(\gamma_1, \gamma_2\)) that generates the highest \(R^2_{\mathrm{oos}}\).


    We chose \(k = 3\) as a compromise between estimation uncertainty in \(\hat{b}\)
    and estimation uncertainty in the OOS covariance matrix \(\hat{\Sigma}_2\). The
    latter type of uncertainty increases with \(k\). With high \(k\), the withheld
    sample becomes too short for \(\hat{\Sigma}_2\) to be well behaved, which distorts
    the fitted factor mean returns \(\hat{\Sigma}_2\hat{b}\). However, our results
    are robust to using moderately higher \(k\).


    This penalty choice procedure uses information from the whole sample to find the
    penalty parameters that minimize the \(R^2\) based on Eq. (30). The cross-validated
    OOS \(R^2\) at the optimal values of the penalty parameters is therefore typically
    an upward-biased estimate of the true OOS \(R^2\) that one would obtain in a new
    data set that has not been used for penalty parameter estimation (Varma and Simon
    (2006), Tibshirani and Tibshirani (2009)). Our interest centers on the optimal
    strength of regularization and we therefore are only concerned about the relative
    performance of models at various degrees of regularization, not the level of the
    OOS \(R^2\). In a subsequent step, in Section 4.4, we also evaluate the penalty
    parameter choice OOS by applying the estimated SDF on a part of the sample that
    has not been used to estimate the penalty parameters.


