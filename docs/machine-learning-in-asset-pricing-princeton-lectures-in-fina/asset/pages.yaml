    x_{s,t}^i x_{s,t}^j \right|}.\tag{4.27}$$


    We include all first-order interactions in our empirical tests. In addition to
    interactions, we also include second and third powers of each characteristic,
    which are defined analogously based on interaction of the characteristic with
