  md: 'viewed from the perspective of learning models, the situation is different.
    If investors face a high-dimensional learning problem, in- and out-of-sample tests
    examine fundamentally different hypotheses. Learning can generate in-sample predictability,
    but not OOS predictability. OOS tests therefore have a clear economic motivation.


    Finally, the results in this chapter also provide a perspective on how technological
    progress in data construction and data analysis could affect the return predictability
    observed in empirical research. Many cross-sectional stock return studies use
    historical data from time periods in which investors had less data available at
    their fingertips and much more constrained data processing capabilities than researchers
    have today. Researchers can easily construct variables today (say, through automated
    textual analysis of corporate filings) that were basically inaccessible to investors
    several decades ago even though the data may have existed in principle (e.g.,
    in the form of hardcopy annual reports). Through the lens of the model in this
    chapter, we can interpret this lack of data access as forcing investors to employ
    excessively sparse valuation models when they priced assets. Following the logic
    of the analysis in Section 5.4.2, it is therefore likely that when researchers
    use current methods and technology to construct predictor variables in earlier
    historical time periods, these variables predict returns not only in in-sample,
    but also in pseudo-OOS tests. For variables that may not have been available to
    investors when they priced assets, researchers should be cautious in attributing
    the return predictability to risk premia or behavioral biases of investors.


    # 5.6 Concluding Remarks


    This chapter has shown how the presence of a high-dimensional learning problem
    in investors’ cash flow forecasting has important effects on the statistical properties
    of asset prices. As the availability of data that is potentially relevant for
    investors’ cash flow forecasting keeps expanding, these learning-induced pricing
    effects are likely to grow in importance.


    We developed these ideas within a cross-sectional asset pricing framework, but
    they are likely much more broadly relevant. Similar issues arise in any setting
    in which economic agents learn to make forecasts and face a potentially large
    number of relevant predictors. The statistical properties of forecast errors will
    be sensitive to the dimensionality of investors’ learning problem. Forecast error
    predictability that seems anomalous relative to a rational expectations benchmark
    could be a consequence of learning in a high-dimensional environment.'
