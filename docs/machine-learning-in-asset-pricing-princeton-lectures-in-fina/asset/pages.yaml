- pgno: 76
  md: 'lead to spurious overfitting. Informative prior beliefs in our Bayesian setting
    prevent this overfitting, which helps ensure good OOS predictive performance.


    Fifth, the prior beliefs are motivated by basic asset pricing theory. Asset pricing
    models of various kinds generally imply that much of the variance of the SDF should
    be attributable to high-eigenvalue (i.e., high-variance) principal components
    (PCs) of the candidate factor returns. Therefore, if a factor earns high expected
    returns, it also should have high variance. As Kozak, Nagel, and Santosh (2018)
    argue, this is true not only in rational expectations models in which pervasive
    macroeconomic risks are priced, but also, under plausible restrictions, in models
    in which cross-sectional variation in expected returns arises from biased investor
    beliefs. The prior distribution in our approach reflects these economic considerations.
    Compared to the naïve ordinary least squares (OLS) estimator, the Bayesian posterior
    shrinks the SDF coefficients toward zero, but the degree of shrinkage in our case
    is not equal for all assets. Instead, the posterior applies significantly more
    shrinkage to SDF coefficients associated with low-eigenvalue PCs.


    Sixth, we also investigate whether a sparse representation of the SDF in which
    only few characteristics-based factors enter the SDF is sufficient to empirically
    capture the investment opportunity set. Such characteristics-sparse SDFs are popular
    in the empirical asset pricing literature (see, e.g., Fama and French (1993) for
    a three factor model; Hou, Xue, and Zhang (2015) use four factors, Fama and French
    (2015) use five factors, and Barillas and Shanken (2018) suggest a six-factor
    model). Our baseline Bayesian approach implies regularization with a squared L²-norm
    penalty that shrinks many SDF coefficients to nearly, but not exactly, zero. To
    allow for sparsity, we augment the estimation criterion with an L¹-norm penalty,
    similar to an elastic net.


    Finally, we use a simple approach to allow characteristics to have nonlinear effects.
    For this purpose, we augment the set of stock characteristics with second and
    third powers and linear first-order interactions of characteristics. The first-order
    interactions allow us to capture nonlinearities that empirical asset pricing studies
    focused on small sets of characteristics often allow for through double-sorted
    portfolios. For example, by sorting stocks into portfolios independently on two
    dimensions—say, firm size and the past year’s return (momentum)—one can allow
    the relation between these characteristics and expected returns and covariances
    to be nonlinear. The pairwise first-order interactions work in a similar way,
    but we form them for large numbers of characteristics. Overall, augmenting the
    characteristics set with these nonlinear transformations results in a total number
    of thousands of characteristics.'
