- pgno: 46
  md: 'In this chapter, we look at a simple return prediction model for stocks that
    uses only past returns as predictors. A model with such a limited set of inputs
    is not meant to be representative of the sort of model that one would need to
    estimate in order to build a well-performing investment strategy in today''s markets.
    A well-performing strategy based on such easily available inputs would be low-hanging
    fruit—but this fruit has likely been picked already quite a while ago. For our
    purposes here, an exploration of a simple returns-based prediction model with
    historical data is useful for illustrating some of the issues we have to tackle
    if we want to adopt ML techniques in asset pricing.


    At a general level, the goal of return prediction regressions is to approximate
    conditional expected returns, which means that we are trying to find the function
    $f(.)$ $$ \mathbb{E}[r_{i,t+1} | x_{i,t}] = f(x_{i,t}) \tag{3.1} $$ that maps
    observable asset-level characteristics $x_{i,t}$ into expectations of returns
    conditional on characteristics. We focus here purely on predicting *cross-sectional*
    differences in returns and so we can think of the returns of an individual stock,
    $r_i$, as expressed relative to a market index return. In the next chapter, we
    will look at a broader set of predictor variables, but here we start with a set
    of predictors composed exclusively of functions of past realized returns of stock
    $i$. Even within this restricted set of predictors, it is easy to come up with
    a large number of predictor variables, and hence a fairly high-dimensional prediction
    problem, if one doesn''t want to impose ad hoc sparsity restrictions on the model.


    Specifically, we analyze a model where $r_{i,t+1}$ is a monthly stock return and
    $f(x_{i,t})$ is a linear function of 120 lags of the stock''s own past monthly
    returns, past returns squared, and past returns to the third power. The second
    and third power terms allow for possible nonlinearity in the relationship between
    past returns and future returns. To avoid contamination with microstructure-induced
    biases and very short horizons, we skip the first lag. Thus, we have the regression
    $$ r_{i,t+1} = \sum_{k=1}^{119} b_k r_{i,t-k} + \sum_{k=1}^{119} c_k r_{i,t-k}^2
    + \sum_{k=1}^{119} d_k r_{i,t-k}^3 + e_{i,t+1}, \tag{3.2} $$


    with a total of $3 \times 119 = 357$ predictor variables.


    Each month $t$, we use all stocks in the Center for Research in Security Prices
    (CRSP) database except small stocks that have market capitalization below the
    20th NYSE percentile and price lower than one dollar at the end of month $t-1$.
    We exclude stocks below this threshold to make sure the results are not driven
    by extremely small and illiquid stocks. For the dependent variable $r_{i,t+1}$,
    we use returns from January 1970 to June'
