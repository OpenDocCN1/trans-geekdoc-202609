- pgno: 141
  md: 'Which features of the cash flow generating process are they therefore likely
    to have missed? How does this affect the return predictability that a current
    econometrician—armed with current data sets and computing power—may find in historical
    data from these earlier times?


    # 6.3.2 Heterogeneity


    Another stark simplification in the model outlined in Chapter 5 is the homogeneity
    of investors. All investors are identical and this is common knowledge. As a necessary
    consequence, investors’ learning problem is limited to learning about exogenous
    fundamentals. Investors learn from realizations of exogenous cash flows about
    the properties of the cash flow process, but there is no scope for learning from
    endogenous variables and for learning about other market participants in this
    model.


    Many interesting questions therefore remain unanswered. One has to do with heterogeneity
    in terms of sophistication. Some market participants have extremely strong data
    collection and analysis capabilities that help them to find profitable investment
    strategies in a high-dimensional environment. Other market participants may be
    less sophisticated and some of their investments decisions may be based on noise
    rather than signal. The trading of such noise traders in the marketplace may generate
    profitable opportunities for the sophisticated investors to exploit. But to do
    so, the sophisticated investors may need to learn from past price data about the
    behavior of the less sophisticated agents. Thus, introduction of heterogeneity
    in sophistication also introduces scope for learning from the endogenous price
    history. And in a high-dimensional environment where a large number of firm characteristics
    are relevant for predicting asset fundamentals, large numbers of these firm characteristics
    may also be relevant for teasing out from past price data the mispricings induced
    by noise trader demand. It would therefore be natural to model sophisticated investors
    as users of ML tools in their learning process.


    Intuitively, many researchers would probably agree that there is a continuous
    process of mispricing discovery and elimination in financial markets, but there
    are very few formal models of this process. Moreover, for the learning about mispricing
    to be realistic in terms of its difficulty, this problem should be studied in
    a high-dimensional setting.


    A recent paper by Davis (2020) takes some steps in this direction. In his model,
    ML investors use historical price data to learn about the mispricing induced by
    noise trader asset demand. In an early period, only noise traders are present.
    Through simulation, he examines to what extent mispricing gets eliminated in equilibrium
    when ML investors enter the market in future periods. Many interesting variations
    of this theme are still to be'
