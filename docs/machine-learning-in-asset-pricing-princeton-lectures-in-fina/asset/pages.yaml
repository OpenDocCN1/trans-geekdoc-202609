- pgno: 133
  md: 'Can one find a similar connection to economic optimization criteria in neural
    network methods? Is it possible to give an economic interpretation of ensemble
    methods such as bagging and boosting? Answers to these questions would be a big
    step forward toward tightly integrating ML methods into the empirical asset pricing
    toolkit.


    # 6.1.2 *Nonlinearities*


    At several points in this book, I have conjectured that nonlinearities may play
    a less prominent role in asset pricing applications than in many typical ML applications
    outside of finance. This is not to say, however, that nonlinearities can be neglected.
    First, the focus of this book is on equity markets and on prediction problems
    that involve first moments of equity returns. Nonlinearities may play a bigger
    role in other areas of asset pricing. For example, in default risk modeling, nonlinearities
    are more prominent than in stock returns. This may give an edge to ML methods
    that are particularly well suited for accommodating these nonlinearities. Second,
    even in equity market research, certain types of nonlinearities seem relevant.
    Based on the evidence that the ML literature on the cross-section of stock returns
    has accumulated so far, first-order interactions between firm characteristics
    appear to be the quantitatively most important type of nonlinearity.


    An interesting question that remains to be answered in this regard is whether
    nonlinear methods like neural networks and tree-based approaches actually have
    a clear advantage over linear penalized regression models (e.g., elastic net)
    that include covariate interactions. For example, the elastic net that Gu, Kelly,
    and Xiu (2020a) compare with neural networks does not include covariate interactions.
    It is clear that nonlinear methods outperform linear methods without interaction,
    but it is still an open question whether an elastic net approach that includes
    covariate interactions can perform as well as a neural net or tree-based approach
    in asset pricing applications. Sorting out this question would be a big help toward
    a better understanding of which of the many available ML methods are best suited
    for asset pricing applications.


    Interpretability is a concern with nonlinear models. To give an economic interpretation
    of the predictive success of a model, we need to be able to assess how different
    covariates contribute to the predictions of the model. One can look at the gradient,
    but this provides only a local assessment of covariate influence around a particular
    value of the covariate vector. Recent research has made some progress on developing
    summary measures of the global influence of a variable. For example, Horel and
    Gieseke (2019) propose a statistic that is a weighted average of squared'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'partial derivatives of a neural network estimator and that allows statistical
    significance testing. These issues are also relevant for asset pricing applications
    of nonlinear models. Along the lines of our discussion in Section 3.2, for economic
    interpretation it would be particularly useful to develop metrics that reveal
    how covariates contribute to the squared Sharpe ratio of a portfolio, or the variance
    of an SDF, constructed based on the predictions of the estimated network.


    # 6.1.3 Structural Change


    Perhaps the most important empirical challenge is to adapt ML methods for structural
    change in asset markets. Asset return moments change over time as the structure
    of the economy changes, investors learn from experienced history, the mix of market
    participants changes, and technology advances. Most ML methods are not designed
    for settings undergoing such continuous structural change. Accordingly, the existing
    ML papers in cross-sectional asset pricing have so far taken an approach that
    mostly neglects this structural change. As in standard rational expectations econometrics,
    they proceed, implicitly, under the assumption that there is an underlying stable
    law of motion generating returns that an econometrician can recover by sampling
    asset return data over relatively long periods.


    As Chapter 5 made clear, this is a particularly unpalatable assumption in a high-dimensional
    environment. If a large number of covariates are available to an econometrician
    as potential return predictors, this also means that investors have to digest
    the predictive information from a large number of covariates. Learning these predictive
    relationships from observed data is subject to parameter uncertainty. As a consequence,
    realized asset returns may be contaminated with substantial estimation errors
    that were not predictable in real time to investors, but that may look predictable
    ex post to the econometrician in in-sample regressions. Moreover, to the extent
    that some variables truly predict returns in an out-of-sample sense—perhaps because
    learning is slower and more imperfect than in the frictionless Bayesian model
    of Chapter 5—this predictive relationship is likely to change over time. There
    may be a dynamic process of anomaly discovery and elimination by arbitrageurs.


    In this sense, the advancement of ML-inspired methods in asset pricing has brought
    to the surface a tension that needs to be resolved. On one hand, empirical asset
    pricing research has pushed methods toward more realism by taking into account
    large numbers of predictors without imposing ad hoc sparsity on prediction models.
    On the other hand, once we recognize the high dimensionality of the environment
    investors'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'operate in, the implicit assumption that the predictive role of these predictors
    for asset returns was stable over decades looks untenable. In rudimentary ways,
    this has already been addressed to some extent in many recent papers. The use
    of hold-out samples for pseudo-OOS tests and, in some cases, rolling estimation
    approaches, is basically an acknowledgment that predictive relationships may not
    be stable over time. Yet, there is so far no systematic treatment of the structural
    change issue in asset pricing ML studies.


    Structural change complicates the application of ML approaches in several ways.
    In Section 3.8, we briefly discussed two of these complications. One is that structural
    change implies that not only parameters of the prediction model may change over
    time, but hyperparameters—for example, penalty parameters in ridge regression
    or lasso—may change, too. Another one is that standard cross-validation methods
    for model validation and hyperparameter estimation that are indifferent to time
    ordering of observations lack justification when structural change is present.
    Drawing validation data from time periods that precede all or part of the training
    data is fine in a stationary setting, but may not be appropriate when there is
    structural change in the predictive relationships.


    There are several directions in which future research could progress on this question.
    First, computational considerations loom large. Repeatedly retraining computationally
    demanding learners over largely overlapping rolling data sets is inefficient and
    may be prohibitively expensive for some ML methods. Finding computationally efficient
    updating schemes could help overcome this obstacle. In Section 3.8 we discussed
    that this is straightforward for ridge regression where the estimator can be expressed
    in a recursively updated form. For other methods, it is not as simple, but the
    literature offers some suggestions, too. For example, Angelosante and Giannakis
    (2009) and Monti, Anagnostopoulos, and Montana (2018) suggest recursive approaches
    for lasso. Martínez-Rego, Pérez-Sánchez, Fontenla-Romero, and Alonso-Betanzos
    (2011) propose an updating scheme for neural networks that allows for gradual
    forgetting of earlier data. Whether any of these approaches, perhaps with some
    modifications, could work well in asset pricing applications is not clear at this
    point, but it seems like an interesting direction to explore.


    Second, as we did in Chapter 4 in a stationary setting, it seems important to
    develop a framework that allows us to link statistical approaches for handling
    structural change with economic principles. While computational efficiency considerations
    may dictate the choice of updating scheme in some applications, it would nevertheless
    be useful to understand what an updating scheme should look like, ideally, given
    some prior beliefs about the underlying economic model of asset prices and the
    reasons'
