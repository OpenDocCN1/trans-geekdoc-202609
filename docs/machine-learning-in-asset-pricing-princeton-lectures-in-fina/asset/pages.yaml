  md: '# INTRODUCTION


    Prediction problems are central to asset pricing. To price stocks, investors must
    forecast firms’ future cash flows. Investors seeking out-performing trading strategies
    search for signals that predict asset returns. Researchers testing asset pricing
    models look for predictor variables that can forecast return differences between
    assets or that capture forecastable variation in returns across time. Models of
    credit risk require predictors of default. Hedging and risk management models
    require forecasts of asset return co-movement.


    The number of predictor variables that are potentially relevant in these applications
    is enormous. Technological advances have led to an explosive growth in the amount
    of information that is available to investors and analysts. Even if we look just
    at the narrow slice of data that can be extracted from corporate financial reports,
    the growth in data availability has been staggering. Figure 1.1 provides some
    rough estimates. One hundred years ago, printed annual volumes like the Moody’s
    manuals that summarized corporate financial reports represented much of what was
    readily available to the public. With the advent of electronic computing, databases
    like COMPUSTAT expanded coverage to perhaps hundreds or thousands of variables
    per firm. Today, there is an almost uncountable number of variables that one can
    construct from publicly available information. The SEC’s Edgar database contains
    financial report data on the order of magnitude of terabytes. With textual analysis,
    one could probably construct a million variables for each firm from these files.


    Corporate financial reports represent only a small fraction of what is potentially
    available to investors. Databases that record the past history of market prices
    and transactions contain a gigantic volume of data; sentiment measures can be
    extracted from social media; online reviews by customers and employees may contain
    valuable information; and many other data sources could be relevant.


    This abundance of potential predictor variables gives rise to a statistical problem.
    As an example, consider the case of cross-sectional stock return prediction. Say
    there are $N = 5000$ stocks for which we can observe returns. The number of return
    predictors, $J$, that we might consider for forecasting differences in stocks’
    returns could easily exceed the number of stocks. Is it possible to estimate the
    relationship between so many'
