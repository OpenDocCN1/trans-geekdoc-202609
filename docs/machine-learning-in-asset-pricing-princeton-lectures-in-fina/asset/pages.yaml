- pgno: 140
  md: 'makes investors’ learning problem still, in many ways, too easy. In this section,
    I discuss a few ideas about how to enrich such models so that they better represent
    the complexity that investors face in the real world and how they deal with it.


    # 6.3.1 Bounded Rationality


    Once we admit that investors operate in a complex environment in which they have
    to keep track of a large number of predictor variables, it also becomes hard to
    defend the assumption that there are no bounds to rationality. Gathering large
    amounts of data may require costly search, acquisition, and processing. Computational
    capacity may be limited. In addition, decision makers may have a preference for
    tractable, simple, and transparent models.


    In Chapter 5 we took a small step in this direction when we explored the consequences
    of excessive shrinkage or sparsity in investors’ forecasting models. This can
    be thought of loosely as a consequence of a cost of model complexity or a preference
    for simpler models. However, we did not microfound this deviation from the frictionless
    Bayesian model. A related example is the model in Molavi, Tahbaz-Salehi, and Vedolin
    (2020). Theirs is a time-series setting in which investors use an excessively
    sparse factor model to make forecasts and price assets.


    Much work remains to be done to understand better how frictions shape the data
    sets and models that investors work with. Some potentially useful ideas already
    exist in recent work. For example, Dugast and Foucault (2020) present a model
    in which investors engage in costly and random search for predictor variables.
    Gabaix (2014) reexamines consumer theory and competitive equilibrium theory in
    a model in which attention to many variables is costly. Routledge (2019) studies
    an asset allocation problem in which investors have a preference for simplicity
    in the statistical model they use to inform their asset allocation decision.


    It would be interesting to put such frictions into an asset pricing framework
    in which one can analyze questions about return predictability. Which types of
    data are more likely to be incorporated into prices; which types of data get ignored
    due to the frictions and then show up as predictable components in returns? Are
    there ways of calibrating these frictions to get quantitative predictions for
    the asset pricing consequences?


    With a microfoundation for excessive sparsity or shrinkage, one could then also
    examine how these frictions changed over time and what consequences this had for
    asset prices. Investors several decades ago presumably found it much more costly
    to find, process, and analyze data.'
