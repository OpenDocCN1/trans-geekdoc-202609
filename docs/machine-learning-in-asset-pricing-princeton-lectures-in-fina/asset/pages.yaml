    (4.20) resembles a ridge regression objective, but with some important differences.
    A standard ridge regression objective function would impose a penalty on the squared
    $L^2$-norm of coefficients, $b''b$, while the objective in (4.20) penalizes $\gamma
    b''\Sigma b$.


    We can also rewrite the criterion in (4.20) equivalently as


    $$\hat{b}=\arg\min_{b}\{\left(\bar{\mu}-\Sigma b\right)''\Sigma^{-1}\left(\bar{\mu}-\Sigma
