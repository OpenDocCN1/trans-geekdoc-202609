  md: 'However, unless K is very small relative to T, this naïve estimator yields
    very imprecise estimates of b. The main source of imprecision is the uncertainty
    about μ. Note that one can rewrite the naïve estimator as an OLS regression estimator
    \hat{b} = (\overline{Σ} Σ)^{-1} \overline{Σ} \overline{μ}, i.e., a cross-sectional
    regression of factor means on the covariances of these factors with each other.
    As is generally the case in expected return estimation, the factor mean estimates
    are imprecise even with fairly long samples of returns. In a high-dimensional
    setting with large K, the cross-sectional regression effectively has a large number
    of explanatory variables. As a consequence, the regression will end up spuriously
    overfitting the huge noise component in the factor means, resulting in a very
    imprecise \hat{b} estimate and bad out-of-sample performance. Estimation uncertainty
    in the covariance matrix can further exacerbate the problem, but as discussed
    in more detail in Kozak, Nagel, and Santosh (2020), the main source of fragility
    in this setting are the factor means, not the covariances.


    To avoid spurious overfitting, we bring in economically motivated prior beliefs
    about the factors’ expected returns. If the prior beliefs are well motivated and
    truly informative, this will help reduce the (posterior) uncertainty about the
    SDF coefficients. In other words, bringing in prior information regularizes the
    estimation problem sufficiently to produce robust estimates that perform well
