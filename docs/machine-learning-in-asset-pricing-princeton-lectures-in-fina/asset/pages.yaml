    data sets. We supplement the sets of 50 anomaly and 80 WFR raw characteristics
    with additional ones constructed as second and third powers and linear first-order
    interactions of the raw characteristics. This exercise is interesting not only
    in terms of the statistical challenge but also because it allows us to relax the
    rather arbitrary assumption that characteristics-based factor portfolio weights
    are linear in (ranked and normalized) characteristics.


