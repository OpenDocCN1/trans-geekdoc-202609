    where $\Sigma \equiv \mathbb{E}\left[(f_t-\mathbb{E}f_t)(f_t-\mathbb{E}f_t)''\right]$.
    Rewriting this expression as


    $$b = (\Sigma''\Sigma)^{-1}\Sigma\mathbb{E}(f_t) \tag{4.4}$$


    shows that the SDF coefficients can be interpreted as the coefficients in a cross-sectional
    regression of the expected asset returns to be explained by the SDF—which, in
    this case, are the $K$ elements of $\mathbb{E}[f_t]$—on the $K$ columns of covariances
    of each factor with the other factors and with itself.


    In practice, without knowledge of population moments, estimating the SDF coefficients
    by running such a cross-sectional regression in sample would result in overfitting
    of noise, with the consequence of poor out-of-sample performance, unless $K$ is
    small. Since SDF coefficients are also weights of the MVE portfolio, the difficulty
    of estimating SDF coefficients with big $K$ is closely related to the well-known
    problem of estimating the weights of the MVE portfolio when the number of assets
    is large. The supervised learning approach we use is designed to address this
    problem.


    Much of the existing characteristics-based factor model literature has sidestepped
    this high-dimensionality problem by focusing on models that include only a small
    number of factors. We will refer to such models as characteristics-sparse models.
    Whether such a characteristics-sparse model can adequately describe the SDF in
    a cross-section with a large number of stock characteristics is a key empirical
    question that the empirical results reported in this chapter shed light on.


    Kozak, Nagel, and Santosh (2020) point out that there are no strong economic reasons
    to expect characteristics-sparsity of the SDF. However, one may be able to find
    rotations of the characteristics factor data that admit, at least approximately,
    a sparse SDF representation. Kozak, Nagel, and Santosh (2018) argue that absence
    of near-arbitrage (extremely high Sharpe ratios) implies that factors earning
    substantial risk premia must be major sources of co-movement. This conclusion
    obtains under very mild assumptions and applies equally to “rational” and “behavioral”
    models. Furthermore, for typical sets of test assets, returns have a strong factor
    structure dominated by a small number of PCs with the highest variance. Under
    these two conditions, an SDF with a small number of these high-variance PCs as
    factors should explain most of the cross-sectional variation in expected returns.
