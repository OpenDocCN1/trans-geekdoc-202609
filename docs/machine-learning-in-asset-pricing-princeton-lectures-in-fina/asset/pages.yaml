    # ### 3.5 Return Covariances and Portfolio Aggregation


    Covariances of prediction errors play a much bigger role in asset pricing than
    in typical ML applications. If our aim is to use a return prediction model to
    form a portfolio with high return relative to the level of risk, the covariance
    matrix of the unpredictable component of returns plays an important role.


    While we have assumed so far that the covariance matrix is known, in practice
    it must be estimated. This introduces an additional layer of estimation errors
    that can lead to substantial problems in portfolio construction. In the extreme
    case, if one wanted to work with thousands individual stocks, finding the mean–variance
    efficient combination of these stocks would require an estimate of a huge covariance
    matrix with millions of elements. Estimating this covariance matrix would be difficult
    without imposing substantial constraints on its functional form or some form of
    shrinkage estimation applied to the covariance matrix. Moreover, typical individual
    stock return data sets are unbalanced panels that may be difficult to work with
    for the purpose of covariance matrix estimation. Finally, in data sets spanning
    many years or decades, an individual stock’s covariance properties are likely
    to change over time as the firm’s characteristics change.


    For this reason, it can make sense to first aggregate stocks into portfolios based
    on the covariates of the return prediction model. If the characteristics that
    we use to form portfolios are related to stocks’ covariance exposures, the covariances
    of portfolios could be much more stable than covariances of individual stocks.
    And portfolio aggregation should help with covariance matrix estimation, at least
    as long as the number of covariates is smaller than the number of assets, i.e.,
    $K < N$.


