  md: 'The material in this chapter is an abbreviated and adapted version of Kozak,
    Nagel, and Santosh (2020).


    # ### 4.1 Asset Pricing with Characteristics-Based Factors


    We start by laying out the basic asset pricing framework that underlies characteristics-based
    factor models. We first describe this framework in terms of population moments,
    leaving aside estimation issues for now. Building on this, we can then proceed
    to describe the estimation problem and a supervised learning approach for dealing
    with the high dimensionality of this problem.


    For any point in time $t$, let $r_t$ denote an $N \times 1$ vector of excess returns
    for $N$ stocks. Each stock has $K$ characteristics that we collect in the $N \times
    K$ matrix $X_t$. In line with the portfolio aggregation approach outlined in the
    previous chapter, we use $K$ factor portfolios formed by weighting stocks’ returns
    with their characteristics. The factor returns are $f_t = X_{t-1}''r_t$. Then
    one can always find a price-of-risk vector $b$ such that an SDF


    $$M_t = 1 - b''(f_t - \mathbb{E}[f_t]) \tag{4.1}$$


    satisfies the unconditional pricing equation


    $$\mathbb{E}[M_t f_t] = 0, \tag{4.2}$$


    where the factors $f_t$ serve simultaneously as the assets whose returns we are
    trying to explain as well as the candidate factors that can potentially enter
    as priced factors into the SDF. The price-of-risk vector $b$ in the SDF is at
    the same time also the vector of weights in the mean-variance efficient (MVE)
    portfolio.


    In our empirical work, we cross-sectionally demean each column of $X_{t-1}$ so
    that the factors in $f_t$ are returns on zero-investment long-short portfolios.
    Typical characteristics-based factor models in the literature add a market factor
    to capture the level of the equity risk premia, while the long-short characteristics
    factors explain cross-sectional variation. In our specification, we focus on these
    cross-sectional differences. We do not explicitly include a market factor, but
    we orthogonalize the characteristics-based factors with respect to the market
    factor. This is equivalent, in terms of the effect on pricing errors, to including
    a market factor in the SDF. It is therefore useful here to think of the elements
    of $f$ as factors that have been orthogonalized. In our empirical analysis, we
    also work with factors that are orthogonalized with respect to the market return.'
