- pgno: 44
  md: 'power, by increasing the measurement frequency. This is related to the observation
    in Merton (1980) that increasing the measurement frequency does not yield more
    precise estimates of expected returns. Thus, one way or another, we have to live
    with the limited returns data availability.


    In asset pricing, unlike in many typical ML applications, we are not necessarily
    interested in obtaining accurate predictions of individual outcomes. For example,
    in stock return prediction, we are not necessarily interested in predicting individual
    stocks’ returns, but rather in constructing a portfolio with good risk-return
    properties. Whether methods that deliver the most accurate return forecasts at
    the individual stock level also automatically give us the best-performing portfolio
    once we aggregate across stocks is an open question that does not have an obvious
    answer, as we will see later in this chapter.


    Because of this portfolio perspective in many asset pricing applications, we are
    also inherently more interested in the covariance properties of prediction errors
    than the data scientists working on typical ML problems. After all, in a setting
    with many assets, covariances of return prediction errors determine much of the
    portfolio volatility. And this portfolio volatility plays a big role in determining
    the risk-return properties of the portfolio. Properties of error covariances could
    matter at all stages of an ML application in asset pricing, starting with the
    question of what the optimal ML algorithm is, how to regularize it, how to evaluate
    predictive performance, and how to use its output for portfolio construction.


    As we discussed in the previous chapter, for ML algorithms to work well, it is
    important to bring in prior knowledge about the nature of the prediction problem
    and the properties of the data. For regression problems, one such property is
    the degree of sparsity of the model. As Hastie, Tibshirani, and Wainwright (2015)
    emphasize, sparse models seem to do well in many applications, including genomics,
    image classification, textual analysis, and many others. In many of these applications,
    there are prior reasons to expect sparsity. For instance, in image classification,
    some regions of an image may simply be irrelevant for the classification task.
    Similarly, in analysis of genetic factors that predict a disease, a large number
    of candidate genes may have no relationship to the disease whatsoever. In asset
    pricing, however, it is not so clear, a priori, that a sparse model describes
    well how the data are generated. For example, in return prediction with accounting
    variables, what would be the justification for us to assume, before looking at
    the data, that a substantial number of balance sheet variables are likely to be
    completely irrelevant for return prediction? Wouldn’t it be more plausible that
    some are more relevant, others less—perhaps because they are all different noisy
    signals of some underlying unobservable factors—but few are probably, a priori,
    of exactly zero relevance?'
