  md: 'scaling of the covariates. For example, in the ridge case, suppose that X is
    such that X′X is diagonal. How much estimates get shrunk to zero when we add the
    ridge γI_K to X′X depends on the magnitude of the diagonal elements of X′X. For
    covariates with small variance and hence a small diagonal entry in X′X, the effect
    of adding γ to the diagonal element is much bigger than for covariates with large
    variance. For this reason, it is common to standardize inputs to unit standard
    deviation before computing the ridge estimates. But this may not always be the
    right approach. Sometimes prior knowledge about a learning problem can tell us
    that we actually should shrink the coefficients of some covariates more than those
    of others.


    # 2.2.2 Trees and Random Forests


    Regression trees approximate the nonlinear function f(x_i) with a multidimensional
    step function (Breiman, Friedman, Olshen, and Stone 1984). The feature space is
    divided into regions, or leaves, that contain a neighborhood around each point
    x_i at which we want to approximate f. Within each leaf h = 1, ..., H, the function
    f(x_i) is approximated as an equal-weighted average, \bar{y}_h, of the observations
    y_i in this leaf.


    Finding a suitable general partition of the feature space can be difficult. For
    this reason, tree-based algorithms often use recursive binary partitions. The
    partitioning of the feature can then be represented as a decision tree; hence
    the name of the method. Panel (a) in Figure 2.1 presents an example.


    How can we find a partition that approximates f well? Finding the globally optimal
    partition that minimizes the residual sum of squared errors can be computationally
    infeasible. Even if we restrict ourselves to recursive binary partitions, there
    may still be an enormous number of possible trees that we would have to evaluate
    to determine global optimality. Much of the success of tree-based methods has
    come from the development of algorithms that do a good job in finding partitions
