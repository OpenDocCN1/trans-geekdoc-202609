    a ridge regression estimate of $\hat{g}(\gamma)$ and squared error loss, the in-sample
    error is


    $$mse(\gamma)=\frac{1}{N}[y-X\hat{g}(\gamma)]''[y-X\hat{g}(\gamma)].\tag{2.16}$$


    Within the training data, the ridge regression estimate $\hat{g}$ fits not only
    the variation in $y$ truly related to $X$, but also to some extent the noise in
    the residual $\epsilon$. To what extent an estimated model can (over-)fit the
    noise in the training data depends on the model''s complexity. One approach to
    estimating the expected out-of-sample prediction error therefore tries to correct
    the in-sample error for the bias induced by the model''s complexity. In an OLS
    regression, the complexity would simply be the number of parameters that are estimated,
    which in turn is equal to the number of covariates. In the ridge regression case,
    the situation is a bit more complicated, because shrinkage constrains the estimates
    and thereby reduces model complexity. When we look for an optimal ridge regression
    penalty, we do not simply pick $\gamma$ to minimize $mse(\gamma)$, but also take
    into account the out-of-sample prediction benefits of reduced model complexity
    that come with a higher $\gamma$.


