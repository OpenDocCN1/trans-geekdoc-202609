    can capture model complexity with the effective number of parameters equal to
    the trace of the “hat”-matrix $H$ (Hastie, Tibshirani, and Friedman 2009). In
    the ridge regression case, this effective number of parameters is


    $$d(\gamma)=\mathrm{tr}\left[X(X''X+\gamma I_K)^{-1}X''\right]\tag{2.17}$$


    where $\mathrm{tr}[.]$ represents the trace operator. In the OLS case, where $\gamma=0$,
    $d$ would simply be equal to the number of covariates included in the regression,
    i.e., $d=K.$² With $\gamma>0$, we have $d<K$. Shrinkage reduces the effective
    number of parameters. For example, in the special case of $X$ with orthonormal
    columns, we would have $d=K/(1+\gamma)$.


    Equipped with the effective number of parameters, we can then calculate measures
    of fit that adjust the in-sample error for its optimistic bias and that account
    for the complexity-reducing benefit of a higher penalty. The adjusted measures
    should be a better estimate of the expected prediction error than the in-sample
    error. One such measure is the Akaike information criterion (AIC). In the case
