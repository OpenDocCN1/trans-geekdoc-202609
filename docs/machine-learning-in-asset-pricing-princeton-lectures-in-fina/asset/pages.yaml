  md: 'in asset pricing and in quantitative investment management. I have focused
    the discussion on cross-sectional asset return prediction problems, but there
    are other types of problems in asset pricing where supervised ML techniques could
    be useful. This includes, for example, applications that involve prediction of
    asset cash flows rather than returns, credit risk prediction, and the search for
    approximate hedging strategies.


    The discussion in this chapter highlighted that while ML techniques can be useful,
    off-the-shelf application of ML methods without careful adaptation to the specific
    conditions of an asset pricing application is unlikely to produce good results.
    Prediction problems in asset pricing are in many ways substantially different
    from the prediction problems that most ML methods were developed for. Seemingly
    mundane questions such as how to scale predictor variables in data preprocessing
    can actually matter a lot for the performance of supervised learning algorithms.
    The choice between different ML methods implicitly pins down the patterns in the
    data—such as sparsity or the degree and type of nonlinearity—that the estimation
    can detect. Given the low signal-to-noise ratio in typical asset pricing settings,
    the idea that one could simply let the data speak and resolve these issues in
    a completely automatic and data-driven way without imposing substantial structure
    on the problem seems far-fetched.


    The conclusion, therefore, is that we need an analytical framework that allows
    us to inject a limited amount of economic reasoning when we set up ML tools to
    tackle asset pricing problems. The next chapter presents an approach that makes
    some progress in this direction. Going beyond the simplistic example with just
    past returns as predictors that we examined in this chapter, we look at an application
    with a broader set of firm characteristics as candidate predictors. In line with
    the takeaways from the discussion in this chapter, the approach will take into
    account the important role of the covariance matrix in portfolio performance and
    it will allow for nonlinearities in the form of interactions between firm characteristics.
    Most importantly, the approach is built on a Bayesian foundation that provides
    a conduit to inject economic reasoning when we set up the estimation and regularization
    approach.'
