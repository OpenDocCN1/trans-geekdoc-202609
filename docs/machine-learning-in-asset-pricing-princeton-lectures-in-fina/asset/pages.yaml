    error estimation and hyperparameter tuning that are less demanding in terms of
    underlying assumptions. A popular purely data-driven method is cross-validation
    (CV). In CV, the model estimates obtained from the training data are used to make
    predictions on a separate, independent validation data set. The model’s error
    on this validation data set then provides an estimate of the prediction error.
    CV seems like a natural method for assessing predictive performance: we simply
    check the actual predictive performance on a data set that we didn’t use to train
    the model. Moreover, Stone (1977) showed that model comparisons based on CV or
    AIC are asymptotically equivalent. In this sense, we can think of CV as empirically
    approximating the AIC.


