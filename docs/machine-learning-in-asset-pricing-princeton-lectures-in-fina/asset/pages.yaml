- pgno: 18
  md: 'throughout various parts of this book. I will use the ML and statistics terminology
    interchangeably.


    # 1.5 Supervised and Unsupervised Learning


    ML methods can be broadly classified into two categories. *Supervised* learning
    basically refers to regression methods. The training data that is used to train
    the algorithm comes with features $x_i$ and labels $y_i$. The goal is to find
    a function $y_i = f(x_i)$ that maps features into labels. These methods are called
    supervised learning because one can view the training of the algorithm as a learning
    process supervised by a “teacher.” The learner makes predictions based on $x_i$
    in the training data. By revealing the correct labels $y_i$, the teacher tells
    the learner whether the prediction was correct. This information about correct
    or incorrect predictions is used by the learner to tweak the estimate of the function.
    Once the training is completed, this learned function can then be used to predict
    labels out-of-sample in data sets where we only have features, but not labels.
    The image classification example we discussed earlier belongs to this supervised
    learning category, but there is a large number of other methods that belong into
    this category as well. Chapter 2 reviews some of the most important ones.


    In *unsupervised* learning, the data that is used to train the algorithm only
    has features, not labels. The goal in unsupervised learning is to find a compressed
    summary of the data that captures its essential properties. One simple example
    of a method in this category is principal component analysis (PCA). In PCA, a
    set of variables is approximated with a smaller number of underlying factors that
    capture a large amount of the common variation among the variables.


    Methods in both categories have useful applications in asset pricing. In this
    book, I focus largely on supervised learning. One of the fundamental problems
    in asset pricing—both for financial economists studying asset prices and for investment
    practitioners—is the estimation of expected asset returns conditional on a set
    of predictor variables. This is, effectively, a supervised learning problem. Similarly,
    estimation of cash flow forecasting models in asset valuation is a supervised
    learning problem. Unsupervised learning methods often play a secondary role in
    asset pricing applications, for example, in an initial dimension-reduction step
    that summarizes data before it is fed into a supervised learning algorithm. The
    distinction between supervised and unsupervised learning in asset pricing applications
    is not as sharp as it may seem, though. As we will see, some supervised learning
    approaches effectively have built-in dimension-reduction elements that are similar
    to those in unsupervised learning approaches.'
