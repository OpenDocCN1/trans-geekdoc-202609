    # 2.4 Bayesian Interpretation


    Application of ML methods requires a number of choices. Even if we fix the model
    that we want to train—e.g., a linear regression or a neural network—we face a
    number of possibilities on how to regularize the estimation. For example, in penalized
    regression, the choice of penalty function will determine whether the estimated
    model will likely feature sparsity (if we use an L¹-norm penalty) or not (if we
    use a squared L²-norm penalty). Which one is best? Having made this choice, we
    then need to tune the penalty hyperparameters, as we just discussed in the previous
    section. Choices concerning variable scaling are important, too. In this chapter
    we have already encountered the issue that the effect of penalization on parameter
    estimates is sensitive to the scaling of the input variables. Should we normalize
    all inputs to have equal standard deviation or would some other type of scaling
    be better? The answer is not obvious.


    We could try to simply let the data speak on these questions. Just as we can optimize
    hyperparameters with CV, we could try to use CV to find out which of these choices
    works best in terms of producing lower prediction error on a validation data set.
    Ultimately, though, we would run into the no-free lunch problem (Wolpert 1996)
    emphasized at the beginning of this chapter: we cannot hope to identify one ML
    algorithm that is universally better than any other algorithm over all possible
    data generating distributions. We will have to make some a priori assumptions
    about the properties of the data. A purely data-driven ML approach is not possible.
    We need to bring in some prior knowledge about the objective we are pursuing with
    the ML approach and the kinds of data that the algorithm will be confronted with.


    A Bayesian interpretation of parameter estimation and regularization can be helpful
    for this purpose. Bayesian statistics allows us to express prior knowledge probabilistically,
    in terms of prior distributions. Consider the linear regression framework y =
    Xg + ε and assume that ε ~ N(0, Σ), where we know the values of entries in the
    covariance matrix Σ, but not the value of the coefficient vector g. Prior knowledge
    comes in the form of a prior distribution for g. Under certain assumptions, we'
