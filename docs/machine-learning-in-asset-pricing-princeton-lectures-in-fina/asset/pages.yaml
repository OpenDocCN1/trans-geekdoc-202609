    expand the set of possible predictors exponentially. For instance, with only first-order
    interactions of 50 raw characteristics and their powers, we obtain ½ n(n + 1)
    + 2n = 1,375 candidate factors and test asset returns. For 80 WFR characteristics,
    we obtain a set of 3,400 portfolios.


    We construct the nonlinear weights and interactions as follows. For any two given
    rank-transformed characteristics x_{s,t}^i and x_{s,t}^j of a stock s at time
    t, we define the first-order interaction characteristic x_{s,t}^{ij} as the product
    of two original characteristics that is further renormalized using (4.26) as follows:


    $$x_{s,t}^{ij} = \frac{\left(x_{s,t}^i x_{s,t}^j - \frac{1}{n_t}\sum_{s=1}^{n_t}
