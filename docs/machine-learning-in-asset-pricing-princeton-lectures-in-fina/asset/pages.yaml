    along its diagonal. Thus shrinkage is strong if t or θ are small, or J/N is large,
    or along principal components with small eigenvalues. In these cases, the prior’s
    influence on the posterior is strong because the observed data is not very informative
    relative to the prior.


    The derivations above outline the mechanics of Bayesian updating. But there is
    an important underlying economic interpretation. Economic plausibility calls for
    an informative prior in which the prior covariance parameter θ is not extremely
    large so that the elements of g cannot be arbitrarily big. Extremely big g would
    imply that the cross-sectional variance of the predictable component of cash flow
    growth, Xg, is huge relative to the variance of unpredictable noise e. This would
    mean that most of cash flow growth variation is predictable based on firm characteristics—which
    is not a plausible representation of economic reality. For this reason, it makes
    economic sense for investors to believe, a priori, that extremely large magnitudes
    of g are unlikely.


