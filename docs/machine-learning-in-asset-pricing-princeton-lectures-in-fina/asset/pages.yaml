- pgno: 48
  md: '2019. We demean the dependent variable and all explanatory variables month
    by month to focus purely on cross-sectional variation (which is why the regression
    (3.2) does not include an intercept term). In addition, we cross-sectionally standardize
    all predictor variables to unit standard deviation each month. We weight the observations
    each month such that the regression gives equal weight to each month in the sample.
    In an asset pricing application with an unbalanced panel of stock returns, this
    is a natural weighting scheme because the mean return of a portfolio strategy
    (which might include a different number of stocks each month) would also give
    equal weight to each period.


    We use the ridge regression estimator (2.7) that we discussed in the previous
    chapter. The penalty hyperparameter is estimated using leave-one-year-out CV.
    That is, the CV folds are contiguous blocks of monthly cross-sections that comprise
    a calendar year. This means that we compute the estimates using all but one year
    of the sample as training folds, we calculate the predicted returns in the left-out
    validation year, and we record the resulting R². We then repeat with a different
    left-out year and again record the R². We repeat until each year of the sample
    has been left out once. At the end, we average the R² across all left-out years
    and we search for a penalty value that maximizes this cross-validated R². This
    leave-one-year-out approach of constructing the folds is consistent with our data-weighting
    scheme that gives equal weight to each calendar period in the estimation.


    To demonstrate that the ridge regression estimates recover useful information,
    we first inspect the estimated regression coefficients. The ridge regression automatically
    detects many prominent predictability patterns that have been documented in the
    existing literature for roughly this sample period or parts of it. Panel (a) of
    Figure 3.1 shows the estimates for the b_k coefficients in (3.2), i.e., the coefficients
    for the first-order terms of lagged returns. It may not be apparent at first sight,
    but on closer look one can see that in just one estimation, the ridge regression
    recovers several major anomalies related to past returns: the positive coefficients
    up to lags of 12 months capture momentum as in Jegadeesh and Titman (1993); the
    plot also shows that continuation of recent returns is concentrated in lags 6
    to 12, as pointed out in Novy-Marx (2012); the mostly negative coefficients for
    lags beyond 12 months reflect long-term reversals as in DeBondt and Thaler (1985).
    Strikingly, there are also large positive coefficients at lags equal to multiples
    of 12. This pattern is the momentum seasonality reported by Heston and Sadka (2008).
    This effect shows up all the way back to lag 120. While these effects have been
    documented separately in different studies, they can all be captured in one go
    with a single regression here.'
