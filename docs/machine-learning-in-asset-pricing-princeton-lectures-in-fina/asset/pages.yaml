  md: 'cookbook recipes for applying ML techniques in asset pricing. Instead, by pointing
    out interesting unresolved issues, I hope to provide some inspiration for future
    research that addresses these issues. In this spirit, the last chapter summarizes
    a number of open research questions that are particularly important for further
    progress in this area of asset pricing.


    # 1.7 ORGANIZATION OF THIS BOOK


    The rest of this book is organized as follows. Chapter 2 provides a brief overview
    of a number of basic supervised learning methods. The chapter begins by reviewing
    regression methods that are designed to predict continuous variables, including
    ridge regression, lasso, trees and random forests, and neural networks. Several
    of these learning algorithms involve hyperparameters that need to be set in advance,
    before the actual estimation. Chapter 2 discusses data-driven methods of tuning
    these hyperparameters to optimize the predictive performance of the learning algorithm.
    Hyperparameters often control the degree of regularization imposed on the estimation.
    Chapter 2 ends with a brief illustration of a Bayesian interpretation of regularization.
    In this interpretation, regularization corresponds to imposing certain prior distributions
    on model parameters. We use this Bayesian interpretation in subsequent chapters
    inject economic reasoning and prior knowledge into the design of ML approaches
    in asset pricing.


    Chapter 3 explores challenges that arise when applying ML methods in asset pricing.
    The chapter starts by outlining some key differences between the properties of
    data that most ML algorithms have been developed for and the properties of data
    that are typical in asset pricing. Throughout the chapter, I illustrate some of
    these issues with a concrete empirical example of cross-sectional stock return
    prediction using each stock’s own price history as source of predictive information.
    The chapter highlights that while ML methods are well suited for the prediction
    problems that arise in asset pricing, these techniques require significant adaptation
    if they are to deliver on their full potential. What works in typical ML applications,
    say in the technology sector or biostatistics, does not necessarily work well
    in asset pricing. Among other things, the low signal-to-noise ratio in asset pricing
    applications means that attempts to simply let the data speak within an extremely
    flexible framework are unlikely to yield good results. We will have to impose
    some structure on the learning algorithm. To do so, we need to connect the ML
    methods to basic economic frameworks of asset pricing and portfolio choice. Some
    principles from Bayesian statistics are useful for making this connection.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Chapter 4 describes an approach that makes some progress in this direction.
    It starts from a basic mean-variance portfolio choice problem—or, equivalently,
    the problem of finding a stochastic discount factor expressed as a linear combination
    of asset returns—and the notion that near-arbitrage opportunities are unlikely
    to exist in the stock market. By formulating Bayesian prior beliefs about the
    risk-return opportunities in the market, this framework allows us to impose economically
    motivated constraints on the return prediction problem. The estimator that emerges
    from this approach is similar to the elastic net estimator common in many ML applications,
    but with some important differences that come from taking into account the fact
    that prediction error covariances are an important determinant of a portfolios
    risk-return profile. The empirical application of this estimator uses a broad
    set of firm characteristics as return predictors, as well as nonlinear transformations
    of those, including pairwise interactions between characteristics. The empirical
    findings suggest that imposing economically motivated prior beliefs is important
    for obtaining good out-of-sample predictive performance.


    Chapter 5 takes a theoretical perspective. The earlier chapters show that statistical
    analysis of financial market data must address the fact that the environment is
    high-dimensional and ML methods provide a good toolbox for this purpose. But what
    about the investors whose investment decisions determine the asset prices that
    feed into these statistical analyses? If the information environment in financial
    markets is such that the prediction problems are high-dimensional, investors in
    theoretical models of financial markets should presumably face this high dimensionality,
    too. Machine learning methods therefore provide an attractive blueprint for modeling
    investor belief formation in theoretical models. Chapter 5 pursues this approach.
    To focus on fundamental issues, we consider a simple environment in which investors
    must learn from historical data the relationship between stocks’ cash flows and
    a large set of firm characteristics that serve as predictor variables. Investors
    are Bayesian and shrink their prediction model estimates toward objectively correct
    prior beliefs. In equilibrium, stocks are priced such that returns are unpredictable
    out-of-sample. However, returns are strongly predictable in-sample in ex-post
    statistical analyses of returns. This is due to the fact that an econometrician
    analyzing data ex post with in-sample analyses has the advantage of hindsight
    knowledge that investors in real time do not have. In a low-dimensional environment
    this implicit advantage of the econometrician can be small, but it is large in
    a high-dimensional environment. In-sample regressions are therefore ill suited
    for inferring risk premia or the effects of behavioral biases of investors from
    asset price data.


    Chapter 6 concludes the book by outlining a research agenda for future research
    on ML in asset pricing.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# SUPERVISED LEARNING


    IN THIS CHAPTER, I provide a brief overview of supervised learning methods. The
    literature on this topic is vast and rapidly evolving. The overview in this chapter
    is by no means a complete survey. Rather than trying to give a detailed account
    of methods in this area, I focus my discussion on the basic elements of these
    techniques that seem particularly useful for asset pricing. Subsequent chapters
    flesh out the material on some of those methods in more detail by looking at asset
    pricing applications.


    # 2.1 SUPERVISED LEARNING AS FUNCTION APPROXIMATION


    In supervised learning, the objective is to predict outcomes y (e.g., stock prices)
    based on some K observed predictors, or features, collected in the K × 1 vector
    x (e.g., a set of firm characteristics). We can characterize this problem as using
    training data {y_i, x_i}_1^N to find the unknown function f ∈ F in


    y_i = f(x_i) + ε_i    (2.1)


    that maps predictors into outcomes, where ε represents mean-zero noise that is
    unpredictable by x. The hope is that outcomes encountered outside of the training
    data set will be generated from the same statistical model (2.1) as the training
    data so that the function estimate f̂(x_i) obtained from the training data will
    be a good out-of-sample predictor.


    Supervised learning methods can be grouped into two categories. Classification
    methods are used in settings where the dependent variable y is categorical. Regression
    methods deal with continuous dependent variables. In asset pricing applications,
    regression problems are more common, although classification methods can also
    be useful, for example for prediction of binary events like a corporate default.
    I focus on regression methods in this book.


    Supervised learning methods also differ in the class of functions F they consider.
    Some methods work with linear functions. Methods in this category are variants
    of linear regression methods that are ubiquitous in econometrics. Other methods
    allow for highly nonlinear functions. These methods have analogies with nonparametric
    methods in econometrics such as kernel regression approaches. Common to all of
    these'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'supervised learning methods is that they are designed to work well in high-dimensional
    settings where x includes a very large number of features, possibly greater than
    the number of observations in the training data.


    ML researchers typically try to avoid making strong assumptions about f such as,
    for example, assuming that f is linear and x low-dimensional, with only a few
    variables selected a priori out of a much larger set of potential predictors.
    Instead, the goal is to let the data speak about f(x_i) under only weak assumptions
    about f and about the set of relevant predictors. How far can one push this idea?
    Is it possible to develop a completely automated universal ML approach that can
    uncover f entirely from the data in any arbitrary setting (e.g., no matter whether
    the prediction problem is, say, in image recognition, biomedical applications,
    or asset pricing) and then provide predictions that generalize from the training
    data to test data sets that were not seen by the learning algorithm?


    Wolpert (1996) shows that such a universal learning algorithm does not exist.
    This result is known as the *no-free-lunch* theorem in ML. This means that unless
    we have some prior knowledge about the prediction problem, we don’t have reason
    to prefer, just based on first principles, one learning algorithm over another
    one. Moreover, if we have multiple algorithms that fit the training data equally
    well, we cannot determine, without prior knowledge, which of these is likely to
    yield better predictions on a yet-unseen test data set. Finding an algorithm that
    produces good predictions on the test data therefore necessarily requires some
    domain-specific prior knowledge about the prediction problem that we are trying
    to solve. In our supervised learning framework here, this could be knowledge about
    the class of functions that f belongs to, the stability of this function as we
    move from a training data set to a test data on which we want to make predictions,
    and the statistical distribution of ε and x. Successful prediction requires that
    we bias our choice of learning algorithm, including the details of its implementation,
    towards algorithms that are appropriate for the nature of the prediction problem
    we face (Wilson and Martinez 1997).


    This connects to an underlying theme of this book. To successfully apply ML in
    asset pricing, we need to look for ways to bring in knowledge about the properties
    of asset price data when we choose among the many available learning algorithms
    and their various specifications. The number of learning algorithms and specification
    choices that we could take off the shelf to throw at a prediction problem is huge.
    But not all of these are equally well suited for prediction problems in asset
    pricing.


    We now briefly review several supervised learning methods. Then, at the end of
    this chapter, and also in the next chapter, we return to the question of how to
    impose prior knowledge on the learning algorithm.'
