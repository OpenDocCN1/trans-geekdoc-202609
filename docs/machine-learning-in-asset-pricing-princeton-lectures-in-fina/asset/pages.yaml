    As we discussed in Section 2.4, the Bayesian estimator maps into a penalized regression
    estimator. If we maximize the model cross-sectional $R^2$ for explaining mean
    returns subject to a penalty on the model-implied maximum squared Sharpe ratio
    $\gamma b''\Sigma b$,


    $$\hat{b}=\arg\min_{b}\{\left(\bar{\mu}-\Sigma b\right)''\left(\bar{\mu}-\Sigma
    b\right)+\gamma b''\Sigma b\},\tag{4.20}$$


