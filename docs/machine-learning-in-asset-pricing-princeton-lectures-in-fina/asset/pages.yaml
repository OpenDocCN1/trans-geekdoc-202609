- pgno: 137
  md: '# 6.2.1 Demand System Estimation


    Koijen and Yogo (2019) have introduced an asset demand system estimation approach
    to asset pricing. Similar to product demand estimation in industrial organization
    research, asset demand in this framework has two components. One part is a function
    of observable asset characteristics (such as market equity, book equity, profitability,
    and many other characteristics commonly used in empirical asset pricing). The
    remainder is latent demand that is due to asset characteristics that are unobservable
    to the econometrician. The demand system can be estimated from portfolio holdings
    data for different groups of investors present in the market. The estimated system
    provides price elasticities of asset demand that can then be used, in conjunction
    with a market clearing condition, to conduct counterfactual exercises, such as,
    for example, to assess the effects on asset prices of a shock to asset supply.


    This approach to asset pricing comes with several empirical challenges that ML
    methods can help address. First, the set of characteristics that are potentially
    relevant for asset demand is likely extremely large. Koijen and Yogo (2019) use
    a small number of characteristics and this leaves much of asset demand attributed
    to latent demand. It would be interesting to know whether this result changes
    when a much larger set of characteristics is considered with methods that are
    well suited for high-dimensional estimation problems. As we discussed in Chapter
    4, a large number of characteristics are relevant for predicting cross-sectional
    differences in stock returns. Within the asset demand system model, the characteristics
    that explain variation in expected returns in equilibrium must be characteristics
    that determine investors’ expectations of asset payoffs, or their perceptions
    of risk, and hence their asset demands.


    Second, there is a large degree of heterogeneity in the characteristics that are
    relevant for different investors. A subset of characteristics that matters for
    one group of investors may be ignored by other groups. In other words, there may
    be substantial sparsity in investor-level asset demand functions. ML methods may
    therefore be useful to allow for such sparsity and to deal with it in a computationally
    efficient way.


    Third, just as for asset return prediction, structural change is likely important.
    It seems unrealistic that investors’ asset demand functions could stay stable
    over long periods of time. Therefore, adapting ML methods to handle structural
    change is likely to be useful for asset demand system estimation as well.


    Similar types of challenges arise in consumer product demand system estimation.
    Accordingly, the literature there has started to adopt ML tools to address these
    challenges. Athey and Imbens (2019) and Gillen, Montero, Moon, and Shum (2019)
    discuss approaches that can handle the'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'high dimensionality and sparsity of these settings. These methods may potentially
    be applicable in asset demand estimation, too.


    # 6.2.2 Expectations Formation


    Beliefs about asset returns are a potentially important determinant of asset demand
    and, ultimately, of equilibrium asset prices. Studying the properties of market
    participants’ forecasts of asset returns—or of variables like earnings, GDP growth,
    and inflation that should be related to asset return expectations—can help shed
    light on the belief formation process. For many classes of investors, direct expectations
    data is not available. Empirical studies therefore examine expectations of professional
    forecasters or equity analysts as proxies for the unobservable investor expectations.


    There is a huge literature on the properties of such forecasts. However, the typical
    benchmark in this literature is a model of rational expectations in which forecasters
    know the parameters of the underlying model generating the variables they are
    forecasting. Studies have used in-sample forecast error predictability regressions
    to document various empirical deviations from this benchmark, including over-
    or underreaction to surprise information.


    In-sample tests of forecast error predictability are, however, subject to the
    same issues that we discussed in Chapter 5 for in-sample return predictability
    tests in high-dimensional settings. Recall that realized returns in the model
    in Chapter 5 are simply the errors in investors’ forecasts of future asset payoffs.
    The in-sample return predictability arising in this model is really a manifestation
    of more general in-sample forecast error predictability under Bayesian learning.
    Forecasters’ learning about the data-generating process contaminates forecast
    errors with error components that are in-sample predictable, although they are
    not predictable OOS.


    There is therefore an opportunity to take a fresh look at the properties of expectations
    of investors, analysts, and macroeconomic forecasters with a different approach.
    The approach should account for the high dimensionality of forecasters’ environment
    and it should evaluate forecasts against OOS benchmarks that do not give a look-ahead
    advantage to the econometrician the way in-sample tests do. Disentangling learning-induced
    estimation errors from belief distortions due to bounded rationality and behavioral
    biases is an important step toward a better understanding of expectations formation
    in financial markets and the macroeconomy.


    The ML methods reviewed in this book provide the tools to accomplish this. They
    allow researchers to construct forecast benchmarks that'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'take into account the predictive information in a large number of potentially
    relevant covariates that are observable to forecasters. Combining this large amount
    of predictive information in a regularized and, possibly, sparse and nonlinear
    model, researchers can built a benchmark that represents how a highly sophisticated
    forecaster would form expectations.


    Just as in asset return prediction, structural change is an important issue for
    forecast benchmarking, too. The relationship between observable covariates and
    the variables to be forecasted is unlikely to be stable over long periods of time.
    To be a good representation of how a skilled forecaster would build a forecasting
    model, an ML-based forecast benchmark should account for such structural change.
    Rolling-window estimation is a simple possibility, but, as we discussed earlier
    in this chapter, there may be better approaches.


    Bianchi, Ludvigson, and Ma (2020) is a recent example of research that follows
    this path. They examine professional forecasts of macroeconomic variables. Their
    forecast benchmark accommodates high dimensionality through a dynamic factor model
    and regularization. The forecasts from this benchmark are based only on information
    that is available to forecasters in real time with model training and validation
    conducted with a rolling window approach.


    # 6.3 THEORY APPLICATIONS OF ML


    Empirical work in asset pricing has started to embrace the notion that prediction
    problems are high-dimensional and that empirical methods should be able to handle
    this high dimensionality. There are many promising opportunities to do the same
    in theoretical modeling of financial markets. Chapter 5 showed that theory-implied
    properties of asset prices are very different, and in some ways closer to empirical
    reality, when investors’ high-dimensional learning problem is not assumed away.
    Much more research remains to be done—in asset pricing, and in economics more
    generally—on models in which economic agents confront a complex reality with the
    tools of a statistician, and in which, like a real-world statistician, they are
    left with considerable uncertainty about the laws of motion governing the world.


    The analysis in Chapter 5 stayed, on purpose, within a Bayesian frictionless framework
    and thus very close to existing learning models in asset pricing. We wanted to
    introduce high dimensionality into investors’ learning without at the same time
    also introducing any other costs, constraints, and imperfections. But this is
    not to say that these complications are not relevant. The frictionless Bayesian
    setting is a useful starting point, but it'
  merge: -1
