  md: '# PREFACE


    This book is an expanded version of the *Princeton Lectures in Finance* that I
    gave at Princeton University in May 2019. I am grateful to Markus Brunnermeier
    and the Bendheim Center for Finance at Princeton University for their hospitality.
    I also thank Princeton University Press and its economics editor, Joe Jackson,
    for supporting this book project. It gave me a great opportunity to reflect on
    the recent progress of machine learning in asset pricing and the open questions
    that research could tackle in the future.


    My interest in machine learning applications in asset pricing grew out of joint
    projects with my co-authors Serhiy Kozak and Shrihari Santosh that we started
    when Serhiy and I were colleagues at the University of Michigan. Looking at the
    academic literature on stock returns, one of our areas of interest, we saw a challenge
    that called for a new approach. At the time, research on the determinants of stock
    returns was struggling to make sense of the fact that a huge number of different
    firm characteristics seemed to have a role in predicting differences in future
    returns between stocks. Yet, published research studies that proposed a new predictor
    evaluated its predictive performance relative to a sparse selection of only a
    small number of already-known predictors. This begged the question whether many
    of the predictors documented in the literature would actually be redundant if
    evaluated jointly. It also left open the question whether these predictors could
    have important interaction effects. A proper characterization of the investment
    opportunities in equity markets would have to consider a large set of predictors
    jointly. Machine learning methods were appealing to us as a natural solution for
    these challenges. One of the papers that resulted from this collaboration (Kozak,
    Nagel, and Santosh 2020) forms the core of Chapter 4.


    More recently, Ian Martin and I started thinking about machine learning methods
    as a model of belief formation for sophisticated economic agents. For investors,
    for example, forecasts are crucial decision inputs. Like data scientists applying
    machine learning techniques to big data sets, investors face an enormous number
    of potentially relevant predictor variables. To explain the properties of asset
    prices, it therefore seems important that theoretical models account for the high-dimensional
    nature of investors’ learning problem. Modeling economic agents as machine learners
    gives them sophisticated tools to deal with this problem in'
  merge: -1
  img_proc: true
