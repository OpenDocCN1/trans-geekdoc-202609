    # 5.1.1 Investors


    Investors are homogeneous and risk-neutral. We further assume that the interest
    rate is zero. This means that return predictability cannot be a consequence of
    risk premia or time-varying interest rates. By abstracting from risk premia, we
    intentionally make it easy for an econometrician to test market efficiency in
    our setting. Since risk premia are absent, there is no joint hypothesis problem
    due to unknown risk pricing models. Yet, as we will show, the presence of investors’
    learning problem still makes interpretation of standard market efficiency tests
    tricky.


    Homogeneity of investors is a simplifying assumption. As a first cut to this problem,
    we want to keep the analysis as transparent as possible. But this is not to say
    that heterogeneity is unimportant. It would be interesting and realistic to extend
    the setting to allow for heterogeneity, perhaps with investors differing in their
    methods of data analysis or in the data that they observe. Heterogeneity would
    also introduce the possibility of investors having to learn about the models and
    beliefs of other investors. Such learning about endogenous objects could potentially
    introduce additional interesting asset price dynamics. In this analysis here,
    however, we want to first see to what extent asset price properties change when
    we introduce learning and high dimensionality in a homogeneous investor setting.


    # 5.1.2 Pricing


    To keep the asset valuation simple, we focus on the pricing of one-period dividend
    strips, i.e., the claim to a single dividend one period ahead. The vector p_t
    represents the prices, at time t, of claims to dividends that will be paid at
    time t + 1. This focus on dividend strips is not as restrictive as it may seem.
    One can think of one period in this model as a long time span, say a decade, and
    the dividend strip payoff as the cash flows of a long-lived stock compressed into
    a single cash flow that occurs at the typical duration of a stock.


    Given risk neutrality and zero interest rate, p_t is then equal to the investors’
    expectation of next-period dividends,


    p_t = \tilde{\mathbb{E}}_t y_{t+1} = y_t + \tilde{\mathbb{E}}_t \Delta y_{t+1}
    = y_t + \tilde{\mathbb{E}}_t (X g + e_{t+1}) .


    The issue of central interest in this chapter is how investors form these expectations
    \tilde{\mathbb{E}}_t [·].


    As a benchmark, consider the case of rational expectations where investors are
    assumed to know g. In this case, there is no learning problem. Dividend expectations
    are constant at \tilde{\mathbb{E}}_t (X g + e_{t+1}) = X g. Prices under'
