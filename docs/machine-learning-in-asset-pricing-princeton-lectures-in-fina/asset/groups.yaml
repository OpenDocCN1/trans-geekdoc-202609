    error, induced by noise $e_{t+1}$ that ended up, by chance, having some correlation
    with the columns of $X$. This is the null hypothesis that underlies a vast literature
    on market efficiency tests and cross-sectional stock return anomalies. Given that
    the elements of $e_{t+1}$ are distributed $N(0, 1)$, it would follow, under this
    null, using the usual OLS variance formulas (with known residual variance), that


    $$

    \sqrt{N} h_{t+1} \sim N(0, N(X''X)^{-1}), \tag{5.7}

    $$


    which provides the basis for standard significance tests in return predictability
    regressions.


