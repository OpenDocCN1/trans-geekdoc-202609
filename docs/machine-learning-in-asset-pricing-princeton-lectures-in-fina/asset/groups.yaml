    ## 监督学习


    在本章中，我简要概述监督学习方法。关于这一主题的文献浩如烟海且发展迅速。本章的概述绝不是一份完整的综述。我无意详细描述该领域的所有方法，而是将讨论重点放在那些对资产定价特别有用的技术基本要素上。后续章节将结合资产定价应用，更详细地展开其中一些方法的内容。


    ### 2.1 监督学习作为函数逼近


    在监督学习中，目标是根据一些已观测到的预测变量（即特征）来预测结果 y（例如股票价格），这些预测变量收集在 K × 1 向量 x 中（例如一组公司特征）。我们可以将这一问题描述为：利用训练数据
    {y_i, x_i}_1^N 来寻找未知函数 f ∈ F，使得


    y_i = f(x_i) + ε_i    (2.1)


    其中 f 将预测变量映射为结果，ε 表示均值零且无法被 x 预测的噪声。我们希望训练数据集之外出现的结果将由与训练数据相同的统计模型 (2.1) 生成，从而使得从训练数据中获得的函数估计
    f̂(x_i) 能成为一个良好的样本外预测器。


    监督学习方法可分为两类。分类方法用于因变量 y 是类别型的情形。回归方法处理连续型因变量。在资产定价应用中，回归问题更为常见，尽管分类方法也可能有用，例如用于预测公司违约等二元事件。本书聚焦于回归方法。


    监督学习方法在它们考虑的函数类 F 上也存在差异。有些方法使用线性函数。这类方法中的变体是计量经济学中无处不在的线性回归方法的变体。其他方法允许高度非线性函数。这些方法与计量经济学中的非参数方法（如核回归方法）有相似之处。所有这些监督学习方法的一个共同点是，它们都设计用于在高维设置下良好运行，其中
    x 包含非常多的特征，可能多于训练数据中的观测数。


    机器学习研究人员通常尽量避免对 f 做出强假设，例如假设 f 是线性的且 x 是低维的，仅从更大的一组潜在预测变量中事先选出少数几个变量。相反，目标是在对
    f 和相关预测变量集合仅作弱假设的情况下，让数据自己“说话”以揭示 f(x_i)。这一想法能推到多远？是否有可能开发出一种完全自动化的通用机器学习方法，在任何任意设置（例如，无论预测问题是图像识别、生物医学应用还是资产定价）下都能完全从数据中发现
    f，然后提供能够从训练数据泛化到学习算法未曾见过的测试数据集的预测？


    Wolpert (1996) 表明，这种通用学习算法并不存在。这一结果被称为机器学习中的*没有免费午餐*定理。这意味着，除非我们对预测问题有一些先验知识，否则我们没有理由仅基于第一性原理偏好某一种学习算法而非另一种。此外，如果我们有多个算法在训练数据上拟合得同样好，那么在没有先验知识的情况下，我们无法确定其中哪一个可能在尚未见过的测试数据集上产生更好的预测。因此，要在测试数据上产生良好预测的算法，必然要求我们对试图解决的预测问题拥有一些特定领域的先验知识。在我们这里的监督学习框架中，这些知识可以是关于
    f 所属的函数类的知识，是当我们从训练数据集转移到我们想要进行预测的测试数据时该函数的稳定性，还是 ε 和 x 的统计分布。成功的预测要求我们在选择学习算法（包括其实现细节）时，偏向于适合我们所面临的预测问题性质的算法（Wilson
    and Martinez 1997）。


    这联系到本书的一个潜在主题。要在资产定价中成功应用机器学习，我们需要在许多可用的学习算法及其各种规格中进行选择时，寻找引入资产价格数据性质知识的方法。我们可以从货架上取下来用于某个预测问题的学习算法和规格选择数量庞大。但并非所有这些都同样适合资产定价中的预测问题。


    我们现在简要回顾几种监督学习方法。然后，在本章末尾以及下一章中，我们将回到如何将先验知识施加于学习算法这一问题上来。


    在高维设置中，当 K 相对于 N 而言不小，甚至可能大于 N 时，基于OLS估计的预测往往不可靠。虽然此时样本内 R² 可能非常高，但样本外预测的 R² 可能非常低甚至为负。原因是，相对于观测数量，协变量如此之多，OLS
    通过调整 ĝ 以适应噪声而非真实信号，从而严重过度拟合数据。这些样本内看似可预测的模式随后不会在样本外数据集中重复，预测表现也很差。在极端情况下，当 K >
    N 时，OLS 估计不是唯一的。存在无穷多个 ĝ 的解，它们都能完美拟合训练数据。但这种完美拟合中很大一部分可能是虚假地拟合了 y_i = f(x_i) +
    ε_i 中的 ε_i，而不是捕捉 f(x_i)。


    **岭回归**。当 K 较大时，对估计量惩罚其选择较大的 ĝ 元素幅度，有助于提高预测性能。岭回归就是这种方法的一个例子。在岭回归中（Hoerl and Kennard
    1970），目标是最小化与OLS相同的平方误差损失函数，但加上一个 L²-范数惩罚项 g′g，


    min_g [ 1/N (y - Xg)′ (y - Xg) + γ g′g ] . (2.6)


    因此，目标函数由两部分组成。第一项表示损失。OLS回归只会最小化这一部分。第二项表示惩罚，其中超参数 γ 控制惩罚的强度。解为


    ĝ = (X′X + γ I_K)⁻¹ X′y, (2.7)


    其中 I_K 是 K × K 的单位矩阵。通过在 X′X 上加一个对角矩阵（“岭”），逆矩阵中 γ I_K 的存在诱导回归系数向零收缩。直观地说，(2.6)
    中包含 g′g 的惩罚项会惩罚那些 ĝ 元素幅度较大的估计。因此，岭回归最终得到的回归系数估计比OLS估计更接近零（OLS是γ = 0的特例）。岭回归中的
    L² 收缩是防止过拟合的正则化（regularization）的一个例子。


    在 X 具有标准正交列的特例中，即 X′X = I_K，从 (2.7) 可以看出，岭回归将OLS估计量 ĝ_{j,OLS} 的每个元素以相同的因子向零收缩：ĝ_j
    = ĝ_{j,OLS}/(1 + γ)。


    **套索（Lasso）**。另一种流行的方法是用 L¹-范数惩罚 ‖g‖₁ = Σ_{j=1}^K |g_j| 来代替。这就是套索方法（Tibshirani
    1996）。套索的目标函数为


    $$\min_{g}\left[\frac{1}{N}(y-Xg)''(y-Xg)+\gamma\sum_{j=1}^{K}|g_j|\right]. \tag{2.8}$$


    与岭回归不同，其解不是 y 的线性函数，也没有闭式解，但有几种程序可以数值求解套索解，包括最小角回归（LARS）算法（Hastie, Tibshirani,
