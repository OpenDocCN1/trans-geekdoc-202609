    到目前为止我们讨论的学习算法都涉及需要在训练前预设的超参数。例如，岭回归目标函数 (2.6) 依赖于超参数 γ，它决定了目标函数中惩罚项的权重，进而决定了惩罚所导致的收缩程度。为了从训练数据中估计回归系数
    β，我们需要事先确定 γ 的值。类似地，lasso 需要一个预设的惩罚参数，而弹性网估计器则需要两个。正如我们在上一节刚刚讨论的，神经网络目标函数也可以有惩罚参数。例如，对于随机森林，用于节点分裂的随机抽取候选特征集的大小以及树的最大深度都是超参数。


    最终，我们希望训练后的模型在预测任务中表现良好。因此，我们寻找能够最小化预测误差的超参数值。为了最小化预测误差，我们需要能够针对给定的超参数值估计预测误差。这并不是一件完全直接的事情。我们不能简单地使用训练数据集中的样本内误差，因为它是我们在一个新数据集中获得的预测误差的向下偏误估计，而这个新数据集


