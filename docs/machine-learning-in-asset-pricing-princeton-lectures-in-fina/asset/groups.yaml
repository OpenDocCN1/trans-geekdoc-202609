    # 4.2.3 Data-Driven Penalty Choice


    To implement the estimators (4.17) and (4.22), we need to set the values of the
    penalty parameters γ, γ1, and γ2. In the L^2-only penalty specification, the penalty
    parameter γ = τ/(κ^2 T) following from the prior (4.13) has an economic interpretation.
    The root expected maximum squared Sharpe ratio under the prior is


    𝔼[μ′ Σ^{-1} μ]^{1/2} = κ. (4.23)


    This means that γ = τ/(κ^2 T) implicitly represents views about the maximum squared
    Sharpe ratio. For example, an expectation that the maximum Sharpe ratio cannot
    be very high, i.e., low κ, would imply high γ and hence a high degree of shrinkage
    imposed on the estimation. Some researchers pick a prior belief based on intuitive
    reasoning about the likely relationship between the maximum squared Sharpe ratio
    and the historical squared Sharpe ratio of a market index.² However, these are
    intuitive guesses. It would be difficult to go further and ground beliefs about
    κ in deeper economic analyses of plausible degrees of risk aversion, risk-bearing
    capacity of arbitrageurs, and degree of mispricing. For this reason, we prefer
    a data-driven approach. But we will make use of (4.23) to express the magnitude
    of the L^2-penalty that we apply in estimation in terms of an economically interpretable
    root expected maximum squared Sharpe ratio.


    We use a data-driven approach that involves estimation of γ via k-fold cross-validation
    (CV). We divide the historic data into k equal subsamples. Then, for each possible
    γ (or each possible pair of γ1, γ2 in the dual-penalty specification), we compute
    \hat{b} by applying (4.17) to k − 1 of these subsamples. We evaluate the OOS fit
    of the resulting model on the single withheld subsample. Consistent with the penalized
    objective, (4.20), we compute the OOS R-squared as


    R^2_{OOS} = 1 - \frac{(\bar{μ}_2 - \bar{Σ}_2 \hat{b})'' (\bar{μ}_2 - \bar{Σ}_2
    \hat{b})}{\bar{μ}_2'' \bar{μ}_2}, (4.24)


