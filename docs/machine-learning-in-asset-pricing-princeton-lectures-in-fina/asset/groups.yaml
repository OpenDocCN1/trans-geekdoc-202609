    return variation associated with this covariate, is not high. In this case, the
    relatively small cost of forgone predictive power is worth paying given the benefit
    from reducing estimation error.


    Since the variance of the portfolio return is unaffected by shrinkage, any improvement
    in the expected return would also translate into an improvement in the Sharpe
    ratio. Hence, for shrinkage to improve portfolio performance relative to unregularized
    OLS regressions in a setting with cross-sectionally homoskedastic and uncorrelated
    returns, as well as orthogonalized covariates, the covariates must differ in their
    cross-sectional dispersion. Only then will ridge regression shrink the coefficients
    of different covariates to different degrees, which is required for shrinkage
    to have an effect on portfolio performance measures.


    More generally, shrinkage can improve portfolio performance if there is heterogeneity
    in the covariates’ relative contribution to expected return and to estimation
    error. Heterogeneity in contributions to risk is another relevant dimension that
    we have not considered yet. Shrinkage must affect undesirable contributions (estimation
    error, risk) more than desirable ones (expected returns).


