    data set will be generated from the same statistical model (2.1) as the training
    data so that the function estimate f̂(x_i) obtained from the training data will
    be a good out-of-sample predictor.


    Supervised learning methods can be grouped into two categories. Classification
    methods are used in settings where the dependent variable y is categorical. Regression
    methods deal with continuous dependent variables. In asset pricing applications,
    regression problems are more common, although classification methods can also
    be useful, for example for prediction of binary events like a corporate default.
    I focus on regression methods in this book.


    Supervised learning methods also differ in the class of functions F they consider.
    Some methods work with linear functions. Methods in this category are variants
    of linear regression methods that are ubiquitous in econometrics. Other methods
    allow for highly nonlinear functions. These methods have analogies with nonparametric
    methods in econometrics such as kernel regression approaches. Common to all of
    these supervised learning methods is that they are designed to work well in high-dimensional
    settings where x includes a very large number of features, possibly greater than
