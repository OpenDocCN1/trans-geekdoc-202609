    L¹-范数惩罚）或不具有（如果使用平方 L²-范数惩罚）。哪一个最好？做出这一选择后，我们还需要调整惩罚超参数，正如我们在上一节中刚讨论的那样。关于变量缩放的选择也很重要。在本章中，我们已经遇到过惩罚对参数估计的影响对输入变量的缩放很敏感的问题。我们是否应该将所有输入标准化为具有相同的标准差，还是其他类型的缩放会更好？答案并不明显。


    我们可以尝试简单地让数据对这些问题作出回答。正如我们可以用交叉验证来优化超参数一样，我们也可以尝试使用交叉验证来找出哪种选择在验证数据集上产生更低的预测误差方面效果最好。不过最终，我们会遇到本章开头强调的没有免费午餐问题（Wolpert
    1996）：我们无法期望识别出一种在所有可能的数据生成分布上普遍优于任何其他算法的机器学习算法。我们必须对数据的性质做出一些先验假设。纯粹基于数据驱动的机器学习方法是不可能的。我们需要引入一些关于我们使用机器学习方法所追求的目标以及算法将面对的数据类型的先验知识。


    参数估计和正则化的贝叶斯解释对此可能有所帮助。贝叶斯统计允许我们以概率形式表达先验知识，即以先验分布的形式。考虑线性回归框架 y = Xg + ε 并假设
    ε ~ N(0, Σ)，其中我们知道协方差矩阵 Σ 中元素的取值，但不知道系数向量 g 的取值。先验知识以 g 的先验分布的形式出现。在某些假设下，我们可以将贝叶斯估计映射到本章前面讨论的岭回归和套索回归。正如我们现在所示，先验分布的设定会影响施加在目标函数上的惩罚类型。


    假设我们认为 $\mathbf{g}$ 的元素是从多元正态分布中抽取的，$\mathbf{g} \sim \mathcal{N}(0, \Sigma_g)$。给定该先验分布，$p(\mathbf{g})$，以及由回归残差
    $\boldsymbol{\varepsilon}$ 的正态分布所暗示的似然，$p(\mathbf{y}|\mathbf{g})$，贝叶斯法则告诉我们，给定观测数据
    $\mathbf{y}$ 时 $\mathbf{g}$ 的后验分布遵循


    $$p(\mathbf{g}|\mathbf{y}) \propto p(\mathbf{y}|\mathbf{g})p(\mathbf{g}). \tag{2.21}$$


    在正态先验和似然的情况下，后验分布也是正态的。该后验分布的均值具有类似于广义最小二乘（GLS）回归的形式，但在逆矩阵中多了一个项（Lindley and Smith
    1972）：


    $$\hat{\mathbf{g}} = \left(\mathbf{X}^{\prime}\Sigma^{-1}\mathbf{X}+\Sigma_g^{-1}\right)^{-1}\mathbf{X}^{\prime}\Sigma^{-1}\mathbf{y}.
    \tag{2.22}$$


    逆矩阵中的额外项 $\Sigma_g^{-1}$ 诱导了收缩，使估计值偏离 GLS 估计值，朝向先验分布的均值（我们在这里假设为零向量）。如果我们专门考虑不相关且同方差的回归残差，$\Sigma=I_N\sigma^2$，以及先验分布下不相关且同方差的
    $\mathbf{g}$ 元素，$\Sigma_g=I_K\sigma_g^2$，我们得到


    $$\hat{\mathbf{g}} = \left(\mathbf{X}^{\prime}\mathbf{X}+\frac{\sigma^2}{\sigma_g^2}I_K\right)^{-1}\mathbf{X}^{\prime}\mathbf{y}.
    \tag{2.23}$$


    该表达式与 (2.7) 中的岭回归估计量相同，其中 $\gamma=\sigma^2/\sigma_g^2$。这意味着岭回归惩罚具有贝叶斯解释，将 $\gamma$
    与先验分布中的离散程度联系起来。如果 $\sigma_g^2$ 很大，这意味着我们对 $\mathbf{g}$ 元素的可能大小没有精确的先验看法，$\gamma$
    很小，且朝向先验均值的收缩很少。相反，如果先验分布紧密集中在先验均值周围，$\sigma_g^2$ 很小，则收缩很强。


    贝叶斯框架允许我们对之前用来激励正则化和收缩的关于“overfitting”的担忧给出更精确的解释。过拟合意味着在估计模型时没有给予我们对参数所拥有的先验信息适当的权重。如果我们的先验是弥散的，$\sigma_g^2
