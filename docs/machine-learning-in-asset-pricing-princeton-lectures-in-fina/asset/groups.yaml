    \(\bar{r}=Xg+\bar{e}\)，其先验为 \(g \sim N(0, \Sigma_g)\)，其中 \(\bar{r}\) 和 \(\bar{e}\)
    分别是来自样本量为 \(\tau\) 的 \(r_t\) 和 \(e_t\) 的平均值，且 \(\Sigma = \operatorname{var}(e_t)\)，我们得到后验均值


    \[

    \hat{g}=\left( X''\Sigma^{-1}X + \frac{1}{\tau}\Sigma_g^{-1} \right)^{-1} X''\Sigma^{-1}\bar{r}.
    \tag{3.21}

    \]


