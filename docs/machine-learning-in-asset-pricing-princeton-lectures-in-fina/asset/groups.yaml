    ![](img/d6b658bf753df69fb65789651dc4a65e_40_0.png)


    Figure 2.3. Normal and Laplace distributions


    The posterior mean in Bayesian regression with Laplace prior does not exhibit
    sparsity, though. The lasso estimator—which yields sparse estimates—is not equal
    to the posterior mean but the posterior mode. This means that one obtains the
    lasso as a maximum a posteriori (MAP) estimator of g (Tibshirani 1996). The lasso
    penalty parameter effectively controls the dispersion of the prior distribution.


    From Bayes’ rule we can see that the MAP estimator is closely related to maximum
    likelihood estimation. The MAP estimator looks for the value of g that is most
    likely given the observed data and the prior beliefs, which means the value that
    maximizes the posterior probability


    $$\hat{g} = \arg\max_{g} p(g|y),$$ (2.24)


    which, by Bayes’ rule is equivalent to maximizing p(y|g)p(g), i.e., the product
    of the likelihood and the prior. In contrast, the maximum likelihood estimator
    would just maximize p(y|g), without weighting by the prior distribution. In the
    case of a flat prior, the MAP and maximum likelihood estimator coincide.


    While prediction based on MAP estimates is not a proper full-fledged Bayesian
    analysis—the fully Bayesian approach would use the posterior distribution to construct
    a predictive distribution, not point estimates plugged into the model, and it
    would incorporate prior uncertainty about σ²—the MAP estimation framework allows
    us incorporate prior beliefs in a simple way. This in turn allows us to see how
    the lasso implicitly incorporates prior beliefs about g.'
  - '[PAGE 41]


    The same issue we discussed regarding the scaling of covariates for ridge regression
    applies to the lasso as well. When we apply the lasso, we implicitly express the
    view that a Laplace distribution with equal dispersion for each of the elements
    of g is the appropriate prior distribution. If we do not think this is a plausible
    assumption, we need to rescale the covariates accordingly. The off-the-shelf approach
    of standardizing covariates before lasso estimation is not necessarily the right
    approach.


    Finally, we can give cross-validation a heuristic Bayesian interpretation as well.
    CV is essentially a way of estimating the prior dispersion σ_g^2 from the data.
    As we already discussed earlier, there is a connection between the complexity
    penalty imposed by the AIC and penalty choice based on CV. George and Foster (2000)
    show that there is in turn a close relationship between estimation that optimizes
    the AIC (or related measures of fit that impose a complexity penalty) and empirical
    Bayes estimation. In the empirical Bayes approach, the prior parameters are estimated
    empirically by putting an uninformative hyperprior on the prior parameters and
    then looking for prior parameter values that maximize the posterior probability.
    We can think of CV therefore as approximating an empirical Bayes approach in which
    we estimate parameters of the prior distribution from the data.


    In summary, regularization has a Bayesian interpretation as the expression of
    prior knowledge about model parameters. Even if we do not formally follow a full
    Bayesian approach, we can use the Bayesian interpretation to bring domain-specific
    knowledge to bear on the learning problem. Preprocessing of data (e.g., scaling),
    or the specification of penalties (e.g., which kind of norm of the parameter vector
    to penalize), implicitly expresses prior views. The Bayesian interpretation can
    help us make these choices in a way that is appropriate for the specific ML problem
    we intend to tackle. In the next chapter, we examine properties of typical prediction
    problems in asset pricing and what these properties tell us, through a Bayesian
    lens, about appropriate preprocessing and specification choices.'
