    (i.e., for periods t > \tau) with expected value and variance of


    ```

    \mathbb{E}[\hat{\omega}'' \hat{r}_v | \hat{\omega}] \approx \frac{\mu'' \mu}{\sqrt{\mu''
    \mu + \frac{N}{\tau}\sigma^2}}, \quad \text{var}(\hat{\omega}'' \hat{r}_v | \hat{\omega})
