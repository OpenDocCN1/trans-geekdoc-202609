    to be differentiated in some way. Heterogeneity in cost functions, for instance,
    could be a source of such differentiation. It would also be interesting to investigate
    whether slight random differences in initial conditions before investors approach
    data—say, in their prior beliefs, the data samples available to them, or the methods
    of analysis—in a high-dimensional environment could lead to substantial differences
    in their forecasting models.


