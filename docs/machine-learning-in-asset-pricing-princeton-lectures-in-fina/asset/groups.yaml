  md: '

    explored. For instance, what would be the optimal ML approach for the sophisticated
    investors in an environment like this? What would they do if they were Bayesians?
    Which prior beliefs would be objectively correct in this setting? If ML investors
    are present in multiple periods and continue to learn each period, does their
    learning problem get complicated by the fact that now past price data not only
    reflects noise trader activity but also the price impact of ML investors’ own
    trading? What happens when capital available to ML investors depends on their
    past performance?


    Given that there is a great deal of specialization among investors in financial
    markets, it would be interesting to examine heterogeneity among sophisticated
    investors. In reality, there seems to be a lot of sparsity in the models that
    professional investors use, explicitly or implicitly. For example, some focus
    on detailed fundamental analyses of a small number of companies, some conduct
    comprehensive statistical analyses in a broad cross-section of assets, others
    focus on signals embedded in assets’ price histories. Each of these specialists
    omits a wide range of potentially predictive variables from their models.


    To obtain such specialization and sparsity in a theoretical model, there has to
    be a cost associated with comprehensive, complex models. Moreover, investors have
    to be differentiated in some way. Heterogeneity in cost functions, for instance,
    could be a source of such differentiation. It would also be interesting to investigate
    whether slight random differences in initial conditions before investors approach
    data—say, in their prior beliefs, the data samples available to them, or the methods
    of analysis—in a high-dimensional environment could lead to substantial differences
    in their forecasting models.


    It is an open question whether this specialization is important for equilibrium
    outcomes. Can one represent, at least approximately, the asset demands of such
    investors using sparse models with a representative investor who learns from public
    data, perhaps with shrinkage, but without imposing sparsity on the forecasting
    model? Or is something important getting lost in this approximation?


    Balasubramanian and Yang (2020) is a recent example of a model of investor learning
    in a high-dimensional environment where heterogeneity is important for equilibrium
    outcomes. In their model, investors use publicly observed covariates to forecast
    fundamentals with a Bayesian regression along similar lines as in the model of
    Chapter 5. To form posterior beliefs, investors combine historical data with their
    prior beliefs about the model governing the asset fundamentals. While they all
    see the same public data, investors are heterogeneous in that they also receive
    private signals about fundamental value. In some sense, investors’ models are
    extremely sparse because they only observe their own private signal, not the private
    signals of others. The key assumption in the model is that investors are uncertain
    about other investors’ prior beliefs. If the environment is sufficiently high-dimensional,
    then, as a consequence of the uncertainty about others’ priors, it can be near-optimal,
    in equilibrium, for investors to base their asset demands on their own statistical
    forecasts without conditioning on price. As a result, the equilibrium price contains
    more noise than it would if investors could frictionlessly share all information.


    This model has some attractive features that push the modeling of investor learning
    toward greater realism: investors digest high-dimensional information, they specialize
    in different sources of information, they are sophisticated in their learning
    about asset fundamentals, and they are not sure about the priors others hold when
    they approach the data. What a model with heterogeneity of this kind would imply
    for in-sample and out-of-sample return predictability, and the evolution of this
    predictability over time, is still an open question.


    In a multi-period setting, it could further be interesting to have some investors
    specialize in non-price predictors of asset fundamentals while others focus on
    information embedded in the price history. Such a theory would share similarities
    with Hong and Stein (1999)—a model that produces predictable under- and overreaction
    patterns in returns. In their model, fundamental information diffuses gradually
    and investors observing these signals do not condition their asset demands on
    price. Investors forecasting based on price history are able to use only a sparse
    representation of this price history. In their model, these assumptions are imposed
    ad hoc, but it would be interesting to examine whether a combination of a high-dimensional
    environment and uncertainty about other investors’ priors could explain a neglect
    of conditioning on price and the sparsity of investors’ models.


    ### 6.4 CONCLUDING REMARKS


    Financial markets are places where participants process information from an incredibly
    rich array of data sources. ML methods allow researchers to bring this richness
    into empirical and theoretical studies of asset prices. As the earlier chapters
    in this book have demonstrated, embracing this richness leads to a novel perspective
    on asset prices. Empirical estimates of risk and return look different from what
    models with artificially imposed sparsity would suggest. The economic interpretation
    of these estimates in terms of risk premia, mispricing due to investor biases,
    or learning-induced return predictability is different as well.


    There are exciting research opportunities at this frontier. Some new puzzles will
    emerge in empirical studies employing ML methods; others may find a resolution
    through theoretical models that account for the difficulty of investors’ learning
    problem in high-dimensional environments. Altogether, this should lead to a better
    understanding of the dynamic process by which complex information is distilled
    into market prices.


