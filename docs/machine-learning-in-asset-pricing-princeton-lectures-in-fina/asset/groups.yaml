    strength of regularization and we therefore are only concerned about the relative
    performance of models at various degrees of regularization, not the level of the
    OOS \(R^2\). In a subsequent step, in Section 4.4, we also evaluate the penalty
    parameter choice OOS by applying the estimated SDF on a part of the sample that
