    网络可以逼近，例如，形如 $(x_{i,1}+x_{i,2})^2 = x_{i,1}^2 + 2x_{i,1}x_{i,2}+ x_{i,2}^2$ 的函数，该函数涉及跨特征交互
    $x_{i,1}x_{i,2}$。


    为了使用训练数据拟合神经网络，可以采用与之前讨论线性回归方法时类似的误差平方和目标函数。将所有网络参数收集到向量 $\theta$ 中，目标函数为


    $\displaystyle \min_{\theta} \sum_{i=1}^{N} [y_i - f(x_i, \theta)]^2. \qquad (2.14)$


    该目标函数的最小化可通过数值方法实现，例如随机梯度下降或拟牛顿方法（参见 Hastie, Tibshirani, and Friedman 2009）。为了最小化的目的，使用平滑激活函数（如
    sigmoid 函数）而非不可微函数（如 ReLU）也是有利的。¹


    对于神经网络，我们也需要担心过拟合训练数据。具有许多节点和层的网络可能极其准确地逼近训练数据，但在样本外预测中表现不佳。正则化可以防止这种过拟合。类似于在岭回归目标函数
    (2.6) 中添加惩罚项，我们可以


    ¹Sigmoid 函数 $g(z_i)=[1+\exp(-z_i)]^{-1}$ 的取值在 $(0,1)$ 区间内，当 $z_i \to -\infty$
    和 $z_i \to +\infty$ 时分别趋近于渐近线 0 和 1。


    在此目标函数中添加一个平方 L² 范数惩罚项：


    min_{θ} Σ_{i=1}^{N} [y_i - f(x_i, θ)]² + γ θ'' θ. (2.15)


    这会使得神经网络权重向零收缩。对于 sigmoid 激活函数，非常小的权重意味着激活函数处于近似线性的区域。因此，不仅输出被收缩向零，神经网络也被收缩向线性回归模型。


    与我们之前讨论的线性回归方法类似，输入的缩放在此处对正则化的效果也很重要。某个输入的绝对幅度越大，意味着与该输入在网络中传播路径上相关的权重的幅度越小，因而这些权重在惩罚项
    γ θ'' θ 中的作用越小，从而对它们施加的收缩也越少。通常会将输入缩放为零均值和单位标准差，但这不一定是最佳方法。基于对预测问题和数据特性的先验考虑，也许更可取的做法是将不同输入缩放至不同幅度，以增加对
    θ 中某些元素的收缩程度，并减少对其他元素的收缩。


