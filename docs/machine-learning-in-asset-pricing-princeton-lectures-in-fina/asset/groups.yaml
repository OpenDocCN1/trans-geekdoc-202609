    ## 5.3 Return Predictability


    We now examine the properties of returns when investors price assets based on
    the posterior in (5.23) that results from objectively correct, informative prior
    beliefs. Compared to returns under OLS learning in (5.15), there is now an additional
    term in the expression for returns:


    $$r_{t+1}=X(I_J - \Gamma_t)g - X\Gamma_t(X''X)^{-1}X''\bar{e}_t + e_{t+1}. \tag{5.25}$$


    The first term on the right-hand side of (5.25) appeared because of the shrinkage
    induced by the informative prior. With a diffuse prior, and hence OLS learning,
    we would have $\Gamma_t = I_J$ and the term would disappear. But with an informative
    prior it is nonzero. We can interpret this term as the effect of “underreaction,”
    due to shrinkage, to the fundamental information in $X$.


    As in the OLS learning case, the second term represents the effect of noise on
    investors’ posterior mean. The purpose of shrinkage induced by the informative
    prior is to dampen the effects of this noise-induced estimation error. Shrinkage
    via $\Gamma_t$ dampens this component, but at the cost of generating the first
    term. Under Bayesian learning, $\Gamma_t$ optimally trades off the pricing error
    arising from these two components.


    ### 5.3.1 In-Sample Return Predictability


    When an econometrician samples returns from this economy and regresses the returns
    in (5.25) on $X$, then the expression for the regression coefficients, as the
    one for returns in (5.25), now has an additional term compared with the OLS learning
    case:[^3]


    $$b_{t+1}=(X''X)^{-1}X''r_{t+1}

    =(I_J - \Gamma_t)g - \Gamma_t(X''X)^{-1}X''\bar{e}_t + (X''X)^{-1}X''e_{t+1}.
    \tag{5.26}$$


    The first term on the right-hand side is a consequence of the first term in the
    return expression (5.25). Shrinkage induced by the informative prior leaves this
    component in returns that is correlated with the columns of $X$. Consequently,
    it gets picked up in the regression of returns on $X$.


    Now let’s revisit the in-sample portfolio strategy with weights $w_t = \frac{1}{N}
    X b_{t+1}$, using $b_{t+1}$ from (5.26). In this case, results in Martin and Nagel
    (2019) show that the expected value of the portfolio return $r_{IS,t+1} = w''_t
    r_{t+1} = b''_{t+1} (X''X) b_{t+1}$ is


    $$\mathbb{E} r_{IS,t+1} = \frac{1}{N} \mathbb{E}\big[\mathbf{g}'' (I_J - \Gamma_t)''
    X''X (I_J - \Gamma_t) \mathbf{g}\big] + \frac{1}{N} \mathbb{E}\big[\tilde{e}''_t
    X (X''X)^{-1} \Gamma_t X''X \Gamma_t X'' \tilde{e}_t \big] + \frac{1}{N} \big[
    e''_{t+1} X (X''X)^{-1} X'' e_{t+1} \big] = \frac{1}{N} \sum_{j=1}^{J} \left(
    \frac{\lambda_j}{t\lambda_j + \frac{1}{\theta}} + 1 \right). \tag{5.27}$$


    When $\theta \to \infty$, this expression converges to the expected return we
    obtained in the OLS learning case in (5.19).


    To interpret the magnitudes, it is useful to note that since $r_{IS,t+1} = \frac{1}{N}
    b''_{t+1} X''X b_{t+1}$, the expected return $\mathbb{E} r_{IS,t+1}$ also represents
    the expected total explained return variance in the in-sample predictive regression,
    while $1 - J/N$ is the variance of the residual. We can therefore construct an
    adjusted $R^2$ measure from the return prediction regression,


    $$R^2_{adj.} = 1 - \left(1 - \frac{\mathbb{E} r_{IS,t+1}}{1 - J/N + \mathbb{E}
    r_{IS,t+1}} \right) \frac{N}{N - J}. \tag{5.28}$$


    In the rational expectations case $\mathbb{E} r_{IS,t+1} = J/N$, as we showed
    in (5.11), and hence this adjusted $R^2$ is exactly zero. With learning, however,
    there are in-sample predictable components in returns that raise $R^2_{adj.}$
    above zero.


    Figure 5.2 illustrates this with a numerical example. As before, $N = 1000$ and
    we draw IID elements of $\mathbf{X}$ from a standard normal distribution. The
    vector $\mathbf{g}$ is drawn from the prior distribution (5.21) with $\theta =
    1$. As Martin and Nagel (2019) discuss, with $\theta = 1$, the share of predictable
    variation in cash flow growth is roughly of the same magnitude as the share of
    long-term earnings growth rates over a 10-year horizon that are forecastable with
    analyst forecasts according to the evidence in Chan, Karceski, and Lakonishok
    (2003). If we interpret one period in the model as a 10-year time window, we get
    an empirically realistic cross-section of cash flow growth rates. We set $t =
    1$, which means that investors have learned from one period of cash flow growth
    observations.


    The solid line in Figure 5.2 shows the adjusted $R^2$ for different values of
    $J$. When $J$ is not small relative to $N$, the adjusted $R^2$ is substantially
    above zero. For example, with $J = 900$, the adjusted $R^2$ is above 25%. In other
    words, an econometrician running this regression would find substantial in-sample
    return predictability even though investors in this economy do not demand any
    risk premia and they do not have behavioral biases in their belief formation.


    [^2]: In other words, $1/N X''X$ will have a substantial number of small eigenvalues.
    Asymptotically, if $N \to \infty$ and $J/N$ converges to a fixed constant, the
    distribution of eigenvalues of $1/N X''X$ follows the Marchenko-Pastur distribution.


    [^3]: One could also let the econometrician use shrinkage methods like ridge regression,
    effectively imposing a prior that the coefficients in the return predictability
    regression cannot be too big. If the econometrician’s prior distribution of the
    coefficients is roughly in line with the true distribution of the coefficients,
    using such methods would strengthen the in-sample return predictability, but it
    would not qualitatively change the results.

