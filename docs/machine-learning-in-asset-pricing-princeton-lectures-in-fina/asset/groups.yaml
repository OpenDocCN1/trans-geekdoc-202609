    ### 4.2.2 *稀疏性*


    我们迄今为止提出的方法通过将 SDF 系数收缩向零来处理高维挑战，但没有任何系数被设为恰好为零。换句话说，我们得到的结果并不是稀疏的。正如我们在第 4.1
    节中所论证的，以特征为基础的因子极端稀疏性的经济依据很弱。然而，允许某些因子在对 SDF 的贡献方面真正是冗余的可能性可能是有用的。此外，正如我们所讨论的，出于经济原因，有理由期望
    SDF 在 PC 方面的稀疏表示能够提供良好的近似。因此，当我们将 PC 视为因子时，稀疏性可能是有用的。


    出于这些原因，我们现在在由 (4.21) 给出的惩罚回归问题中引入额外的 $L^1$ 惩罚 $\gamma_1\sum_{j=1}^{H}|b_j|$。该方法由
    lasso 回归和弹性网络动机而来，并且会导致 $\hat{b}$ 的某些元素被设为零。结合 $L^1$ 和 $L^2$ 惩罚，我们的估计量求解问题。$^{1}$


    $$\hat{b}=\arg\min_b\; (\bar{\mu}-\Sigma b)''\Sigma^{-1}(\bar{\mu}-\Sigma b)+\gamma_2
    b''b+\gamma_1\sum_{j=1}^{H}|b_j|. \qquad (4.22)$$


    这种双惩罚方法在很大程度上具有 $L^2$ 仅惩罚方法的经济动机，同时增加了可能提供稀疏 SDF 表示的额外好处。我们可以通过改变 $L^1$ 惩罚的强度来控制稀疏程度，并通过改变
    $L^2$ 惩罚来控制经济收缩程度。


    虽然我们最终会让数据决定惩罚 $\gamma_1$ 和 $\gamma_2$ 的最优值，但有理由相信完全关闭 $L^2$ 惩罚并专注于纯 lasso 风格估计在这种资产定价环境中效果不佳。众所周知，当回归量相关时，lasso
    相比 ridge 和弹性网络的表现相对较差（Tibshirani 1996, Zou and Hastie 2005）。正如我们在第 2.2.1 节中所讨论的，$L^1$
    惩罚估计倾向于选择两个相关变量中的一个而不是对它们进行平均，如果相关协变量各自包含共同信号和不相关的噪声，则会损害预测性能。例如，与仅选择账面市值比作为 SDF
    中代表价值效应的唯一特征相比，考虑多种价值度量的加权平均可能是有利的，例如账面市值比、市价股息比和现金流价格比。这种推理也表明，$L^1$ 仅惩罚在我们先将特征为基础的因子转换到其
    PC 再进行估计时可能效果更好。我们在下面的实证工作中检验这个问题。


    ¹为求解 (4.22) 中的优化问题，我们使用 Zou 和 Hastie (2005) 中的 LARS-EN 算法。


    ### 4.2.3 数据驱动的惩罚选择


    为了实现估计量 (4.17) 和 (4.22)，我们需要设定惩罚参数 γ、γ1 和 γ2 的值。在 $L^2$ 仅惩罚设定中，惩罚参数 γ = τ/(κ^2
    T) 遵循先验 (4.13) 具有经济解释。在先验下的根期望最大平方夏普比率为


    𝔼[μ′ Σ^{-1} μ]^{1/2} = κ. (4.23)


    这意味着 γ = τ/(κ^2 T) 隐式地代表了关于最大平方夏普比率的观点。例如，对最大夏普比率不能很高、即 κ 很低的预期将意味着 γ 很高，从而在估计中施加高度的收缩。一些研究人员基于关于最大平方夏普比率与市场指数历史平方夏普比率之间可能关系的直观推理来选择先验信念。²
    然而，这些都是直观猜测。更进一步地，将 κ 的信念建立在关于风险厌恶程度、套利者风险承担能力和误定价程度的更深层次经济分析上将是困难的。出于这个原因，我们更倾向于数据驱动的方法。但我们将利用
    (4.23) 来用经济可解释的根期望最大平方夏普比率来表达我们在估计中应用的 $L^2$ 惩罚的大小。


    我们使用一种数据驱动的方法，该方法涉及通过 k 折交叉验证 (CV) 估计 γ。我们将历史数据划分为 k 个相等子样本。然后，对于每个可能的 γ（或双惩罚设定中每对可能的
    γ1、γ2），我们通过将 (4.17) 应用于其中 k − 1 个子样本来计算 \hat{b}。我们在单个保留子样本上评估 resulting 模型的 OOS
    拟合。与惩罚目标 (4.20) 一致，我们计算 OOS R 平方为


    R^2_{OOS} = 1 - \frac{(\bar{μ}_2 - \bar{Σ}_2 \hat{b})'' (\bar{μ}_2 - \bar{Σ}_2
    \hat{b})}{\bar{μ}_2'' \bar{μ}_2}, (4.24)


    其中下标 2 表示来自保留样本的 OOS 样本矩。我们重复此过程 \(k\) 次，每次将不同的子样本视为 OOS 数据。然后我们对这 \(k\) 个估计的
    \(R^2\) 进行平均，得到交叉验证的 \(R^2_{\mathrm{oos}}\)。最后，我们选择产生最高 \(R^2_{\mathrm{oos}}\)
    的 \(\gamma\)（或 \(\gamma_1, \gamma_2\)）。


    ²Barillas 和 Shanken (2018) 是最近的一个例子。另见 MacKinlay (1995) 和 Ross (1976) 的类似论点。


    我们选择 \(k = 3\) 作为 \(\hat{b}\) 的估计不确定性和 OOS 协方差矩阵 \(\hat{\Sigma}_2\) 的估计不确定性之间的折中。后一种不确定性随
    \(k\) 增加。随着 \(k\) 升高，保留样本变得太短而无法使 \(\hat{\Sigma}_2\) 良好表现，这会扭曲拟合的因子平均收益 \(\hat{\Sigma}_2\hat{b}\)。然而，我们的结果对使用适度更高的
    \(k\) 具有稳健性。


    该惩罚选择程序使用整个样本的信息来找到使基于公式 (30) 的 \(R^2\) 最小化的惩罚参数。在惩罚参数的最优值处的交叉验证 OOS \(R^2\) 因此通常是对在未用于惩罚参数估计的新数据集中会获得的真实
    OOS \(R^2\) 的向上有偏估计（Varma 和 Simon (2006)，Tibshirani 和 Tibshirani (2009)）。我们的兴趣集中在正则化的最优强度上，因此我们只关心在不同正则化程度下模型的相对表现，而不关心
    OOS \(R^2\) 的水平。在随后的步骤中，在第 4.4 节中，我们还通过将估计的 SDF 应用于未用于估计惩罚参数的样本部分来对 OOS 惩罚参数选择进行评估。


