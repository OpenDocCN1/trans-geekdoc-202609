    # SUPERVISED LEARNING IN ASSET PRICING


    THE SUPERVISED ML methods we reviewed in Chapter 2 are potentially valuable additions
    to the toolkit in asset pricing. Many prediction problems in asset pricing are
    of high-dimensional nature in that a large number of observable variables could
    have useful predictive information. For example, in stock return prediction a
    huge number of variables could potentially be relevant as predictors. Firm characteristics
    from accounting data, signals extracted from textual information in corporate
    disclosures, variables summarizing the history of price and trading volume, information
    in media reports, and many other variables could potentially contain predictive
    information.


    Until recently, much of the existing literature in asset pricing has dealt with
    this high dimensionality by imposing ad hoc sparsity. Rather than considering
    large numbers of predictors simultaneously, researchers often consider small sets
    of predictors in isolation. For example, when researchers investigate a new predictor
    variable, a common approach in the academic literature is to evaluate whether
    the variable has marginal predictive information relative to a small “standard”
    set of firm characteristics, for instance, those used in the factors models of
    Hou, Xue, and Zhang (2015) and Fama and French (2015) (size, book-to-market equity,
    investment, profitability). The problem with this approach of considering small
    sets of predictors in isolation is that there could be substantial redundancy
    among the predictors that have been discovered in the literature.


    There is no compelling economic motivation for the ad hoc sparsity imposed in
    this traditional approach. Accordingly, there is a need for approaches that can
    handle the high dimensionality of the prediction problem without imposing ad hoc
    sparsity. ML methods are well suited for this task, but straight off-the-shelf
    application of these methods is unlikely to fully exploit their potential. Asset
    pricing applications are in important ways different from the applications, often
    in the technology sector, for which the ML methods have originally been developed.
    Table 3.1 lists some of these differences. Of course, these distinctions are not
    always so clear-cut, but in many cases they will be relevant to some degree.'
