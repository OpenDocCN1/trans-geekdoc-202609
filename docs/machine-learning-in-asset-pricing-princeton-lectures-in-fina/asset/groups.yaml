    # ### 4.2.2 *Sparsity*


    The method that we have presented so far deals with the high-dimensionality challenge
    by shrinking SDF coefficients toward zero, but none of the coefficients are set
    to exactly zero. In other words, the solution we obtain is not sparse. As we have
    argued in Section 4.1, the economic case for extreme sparsity with characteristics-based
    factors is weak. However, it may be useful to allow for the possibility that some
    factors are truly redundant in terms of their contribution to the SDF. Moreover,
    as we have discussed, there are economic reasons to expect that a representation
    of the SDF that is sparse in terms of PCs could provide a good approximation.
    Sparsity could therefore be useful when we consider PCs as factors.


    For these reasons, we now introduce an additional $L^1$ penalty $\gamma_1\sum_{j=1}^{H}|b_j|$
    in the penalized regression problem given by (4.21). The approach is motivated
    by lasso regression and elastic net and it leads to some elements of $\hat{b}$
    being set to zero. Combining both $L^1$ and $L^2$ penalties, our estimator solves
    the problem.$^{1}$


    $$\hat{b}=\arg\min_b\; (\bar{\mu}-\Sigma b)''\Sigma^{-1}(\bar{\mu}-\Sigma b)+\gamma_2
    b''b+\gamma_1\sum_{j=1}^{H}|b_j|. \qquad (4.22)$$


    This dual-penalty method enjoys much of the economic motivation behind the $L^2$-penalty-only
    method with an added benefit of potentially delivering sparse SDF representations.
    We can control the degree of sparsity by varying the strength of the $L^1$ penalty
    and the degree of economic shrinkage by varying the $L^2$ penalty.


    While we will ultimately let the data speak about the optimal values of the penalties
    $\gamma_1$ and $\gamma_2$, there is reason to believe that completely switching
    off the $L^2$ penalty and focusing purely on lasso-style estimation would not
    work well in this asset pricing setting. Lasso is known to suffer from relatively
    poor performance compared with ridge and elastic net when regressors are correlated
    (Tibshirani 1996, Zou and Hastie 2005). As we discussed in Section 2.2.1, the
    tendency of $L^1$-penalized estimation to pick one of two correlated variables,
    rather than averaging them, hurts predictive performance if correlated covariates
    each contain a common signal and uncorrelated noise. For instance, rather than
    picking book-to-market as the only characteristic to represent the value effect
    in an SDF, it may be advantageous to consider a weighted average of multiple measures
    of value, such as book-to-market, price-dividend, and cash flow-to-price


    ¹To solve the optimization problem in (4.22), we use the LARS-EN algorithm in
    Zou and Hastie (2005).'
