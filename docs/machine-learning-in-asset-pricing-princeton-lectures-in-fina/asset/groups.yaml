    (solid) and PCs (dashed). Dotted lines in Panel (b) depict $-1$ s.e. bounds of
    the CV estimator.


    $L^1$-penalty can be used to omit the pricing-irrelevant factors, but a $L^2$-penalty-only
    method works just as well in terms of OOS $R^2$.


    ## 4.3.3 Interactions


    To raise the statistical challenge, we now consider extremely high-dimensional
    data sets. We supplement the sets of 50 anomaly and 80 WFR raw characteristics
    with additional ones constructed as second and third powers and linear first-order
    interactions of the raw characteristics. This exercise is interesting not only
    in terms of the statistical challenge but also because it allows us to relax the
    rather arbitrary assumption that characteristics-based factor portfolio weights
    are linear in (ranked and normalized) characteristics.


    In fact, for some anomalies like the idiosyncratic volatility anomaly, it is known
    that the expected return effect is concentrated among stocks with extreme values
    of the characteristic. Fama and French (2008) and Freyberger, Neuhierl, and Weber
    (2020) provide evidence of nonlinear effects for other anomalies but in terms
    of portfolio sorts and cross-sectional return prediction rather than SDF estimation.
    Furthermore, while there

    is existing evidence of interaction effects for a few anomalies (Asness, Moskowitz,
    and Pedersen 2013, Fama and French 2008), interactions have not been explored
    in the pre-ML empirical asset pricing literature for more than these few—presumably
    a consequence of the extreme high dimensionality of the problem. Interactions
    expand the set of possible predictors exponentially. For instance, with only first-order
    interactions of 50 raw characteristics and their powers, we obtain ½ n(n + 1)
    + 2n = 1,375 candidate factors and test asset returns. For 80 WFR characteristics,
    we obtain a set of 3,400 portfolios.


    We construct the nonlinear weights and interactions as follows. For any two given
    rank-transformed characteristics x_{s,t}^i and x_{s,t}^j of a stock s at time
    t, we define the first-order interaction characteristic x_{s,t}^{ij} as the product
    of two original characteristics that is further renormalized using (4.26) as follows:


    $$x_{s,t}^{ij} = \frac{\left(x_{s,t}^i x_{s,t}^j - \frac{1}{n_t}\sum_{s=1}^{n_t}
    x_{s,t}^i x_{s,t}^j\right)}{\sum_{s=1}^{n_t} \left| x_{s,t}^i x_{s,t}^j - \frac{1}{n_t}\sum_{s=1}^{n_t}
    x_{s,t}^i x_{s,t}^j \right|}.\tag{4.27}$$


    We include all first-order interactions in our empirical tests. In addition to
    interactions, we also include second and third powers of each characteristic,
    which are defined analogously based on interaction of the characteristic with
    itself. Note that although we renormalize all characteristics after interacting
    or raising to powers, we do not rerank them. For example, the cube of any given
    characteristic then is a new different characteristic that has stronger exposures
    to stocks with extreme realization of the original characteristic but has the
    same gross exposure (leverage). The Internet Appendix of Kozak, Nagel, and Santosh
    (2020) illustrates how this approach maps into more conventional two-way portfolio
    sorts.


    Due to the extremely high number of characteristics-based factors in this case,
    our three-fold cross-validation method runs into numerical instability issues
    in covariance matrix inversion, even with daily data. For this reason, we switch
    to two-fold cross-validation. This gives us a somewhat longer sample to estimate
    the covariance matrix, and this sample extension is sufficient to obtain stable
    behavior.


    Figure 4.5 shows contour maps of the OOS cross-sectional R^2 as a function of
    κ (on the x-axis) and the number of nonzero SDF coefficients (on the y-axis).
    Plots for the raw portfolio returns are shown in the top row, and plots for the
    PCs are in the bottom row. Focusing first on the

    results for the raw portfolio returns, it is apparent that a substantial degree
    of sparsity is now possible for both the anomalies and the WFR portfolios without
    deterioration in the OOS R². Strengthening the L¹-penalty to the point that only
    around 100 of the characteristics and their powers and interactions remain in
    the SDF (out of 1,375 and 3,400, respectively) does not reduce the OOS R² as long
    as one picks the L²-penalty optimal for this level of sparsity. As before, an
    L¹-penalty-only approach leads to poor OOS performance.


    8 Because some interactions are missing in the earlier part of the sample, our
    sample periods shorten to February 1974–December 2017 and September 1968–December
    2017 for anomaly and WFR characteristics, respectively.


    ![](img/d6b658bf753df69fb65789651dc4a65e_96_0.png)


    (a) 50 anomalies


    (b) WFR portfolios


    Figure 4.6. L¹ sparsity of models with interactions. We show the maximum OOS cross-sectional
    R² attained by a model with n factors (on the x-axis) across all possible values
    of L² shrinkage for models based on interactions of original characteristics portfolios
    (solid) and PCs (dashed). Panel (a) focuses on the SDF constructed from PCs of
    interactions of 50 anomaly portfolios. Panel (b) shows coefficient estimates corresponding
    to PCs based on interactions of WFR portfolios. Dotted lines depict −1 s.e. bounds
    of the CV estimator.


    The plots in the bottom row show contour maps for PCs. These results are drastically
    different from the ones in the top row in terms of how much sparsity can be imposed
    without hurting OOS performance. Very few PCs—or even just one—suffice to obtain
    substantial OOS explanatory power. But here, too, the combination of sparsity
    with an optimally chosen L² penalty is very important. Adding more PCs does not
    hurt as long as substantial L² shrinkage is imposed, but it does not improve OOS
    performance much either.


    The two plots in Figure 4.6 take a cut in the contour plots along the ridge of
    maximal OOS R² from bottom to top, where we vary sparsity and choose the L² optimal
    shrinkage for each level of sparsity. These plots


    with the same characteristics. What our framework does not allow for is a change
    over time in the cross-sectional moments of the characteristics in X. With a stochastically
    changing X it could happen, for example, that two characteristics that are highly
    correlated in one period are no longer strongly correlated in future periods.
    This would make investors’ learning and forecasting problems harder.


    Third, while we consider a fairly high-dimensional environment in which J can
    be close to N, we assume that J < N. The set of characteristics available to real-world
    investors is potentially very large and so J ≥ N might be reasonable. An extension
    to allow for J ≥ N would be relatively straightforward, but at the cost of considerably
    greater notational complexity. The effects of learning on asset price properties
    can be seen more clearly in the simpler J < N setting.


    Overall, our model therefore likely understates the difficulty of the learning
    problem that actual investors face in their investment decision-making process.
    Even so, as analysis in this chapter will show, the properties of asset prices
    are strongly affected by learning. Extending the model to take into account realistic
    additional complications in the learning problem would further enhance these effects.


    The properties of the parameter vector g, and investors’ beliefs about the values
    of these parameters, play an important role in our analysis. Specifically, the
    magnitudes of the elements of g determine the proportion of cash flow growth variation
    that is predictable with X. Therefore, when investors learn about g from historical
    observations of Δy, the magnitudes of the g elements determine the ratio of signal
    (variance of Xg) to noise (variance of e) in Δy.


    We assume that the vector g is drawn from a multivariate normal distribution,


    g ∼ N(0, θ/J I_J), (5.2)


    where θ is a constant. We think of g as drawn by nature, at the very beginning
    of this economy, before any dividends are realized and any assets priced. It then
    stays constant through time. The specification of variances and covariances as
    proportional to 1/J in (5.2) ensures that the signal to noise ratio is invariant
    to J. To see this, note that if investors had perfect knowledge of the parameter
    vector g, investors would be able to fully predict the Xg component of Δy_t in
    (5.1). One can show that this predictable component has the cross-sectional variance
    1/N 𝔼[g''X''Xg] = θ.¹


    ¹ Apply the trace operator, use its cyclical properties, and use the normalization
    of tr(X''X)=N J from above.

