    ## 5.6 Concluding Remarks


    This chapter has shown how the presence of a high-dimensional learning problem
    in investors’ cash flow forecasting has important effects on the statistical properties
    of asset prices. As the availability of data that is potentially relevant for
    investors’ cash flow forecasting keeps expanding, these learning-induced pricing
    effects are likely to grow in importance.


    We developed these ideas within a cross-sectional asset pricing framework, but
    they are likely much more broadly relevant. Similar issues arise in any setting
    in which economic agents learn to make forecasts and face a potentially large
    number of relevant predictors. The statistical properties of forecast errors will
    be sensitive to the dimensionality of investors’ learning problem. Forecast error
    predictability that seems anomalous relative to a rational expectations benchmark
    could be a consequence of learning in a high-dimensional environment.


    The next chapter outlines directions that research on investor learning in complex
