    # SUPERVISED LEARNING


    IN THIS CHAPTER, I provide a brief overview of supervised learning methods. The
    literature on this topic is vast and rapidly evolving. The overview in this chapter
    is by no means a complete survey. Rather than trying to give a detailed account
    of methods in this area, I focus my discussion on the basic elements of these
    techniques that seem particularly useful for asset pricing. Subsequent chapters
    flesh out the material on some of those methods in more detail by looking at asset
    pricing applications.


    # 2.1 SUPERVISED LEARNING AS FUNCTION APPROXIMATION


    In supervised learning, the objective is to predict outcomes y (e.g., stock prices)
    based on some K observed predictors, or features, collected in the K × 1 vector
    x (e.g., a set of firm characteristics). We can characterize this problem as using
    training data {y_i, x_i}_1^N to find the unknown function f ∈ F in


    y_i = f(x_i) + ε_i    (2.1)


    that maps predictors into outcomes, where ε represents mean-zero noise that is
    unpredictable by x. The hope is that outcomes encountered outside of the training
    data set will be generated from the same statistical model (2.1) as the training
    data so that the function estimate f̂(x_i) obtained from the training data will
    be a good out-of-sample predictor.


    Supervised learning methods can be grouped into two categories. Classification
    methods are used in settings where the dependent variable y is categorical. Regression
    methods deal with continuous dependent variables. In asset pricing applications,
    regression problems are more common, although classification methods can also
    be useful, for example for prediction of binary events like a corporate default.
    I focus on regression methods in this book.


    Supervised learning methods also differ in the class of functions F they consider.
    Some methods work with linear functions. Methods in this category are variants
    of linear regression methods that are ubiquitous in econometrics. Other methods
    allow for highly nonlinear functions. These methods have analogies with nonparametric
    methods in econometrics such as kernel regression approaches. Common to all of
    these'
  - '[PAGE 23]


    supervised learning methods is that they are designed to work well in high-dimensional
    settings where x includes a very large number of features, possibly greater than
    the number of observations in the training data.


