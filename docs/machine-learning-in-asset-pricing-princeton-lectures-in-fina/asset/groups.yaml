    # A RESEARCH AGENDA


    THE NUMBER OF ML applications in asset pricing is growing rapidly. This parallels
    similar growth in many other areas of economics where ML methods are quickly becoming
    part of the standard toolkit, such as, for example, in causal inference (Athey
    and Imbens 2019) and for textual analysis (Gentzkow, Kelly, and Taddy 2019). ML
    methods hold promise for advancing our understanding of asset prices. Empirically,
    they permit the study of the relationships between asset prices and a rich set
    of information without forcing artificial and ad hoc sparsity on the empirical
    models. In theoretical studies, ML tools can provide inspiration for modeling
    of economic decision making in settings with complex sources of uncertainty without
    imposing unrealistic simplicity on the environment.


    Chapters 4 and 5 provided two examples of empirical and theoretical applications
    of ML approaches. These analyses, and other related recent studies, have produced
    some novel insights about the properties of asset prices. Embracing the high dimensionality
    of the prediction environment faced by investors leads to a richer empirical description
    of the investment opportunity set. It also helps, theoretically, to better understand
    how assets are priced in financial markets.


    But many questions remain unanswered. To a large extent, the literature in this
    area is still in an early exploratory phase. Different papers apply different
    methods to similar problems, but there is no consensus yet on the most suitable
    ML methods for particular sets of problems in asset pricing. A central theme of
    this book is that off-the-shelf application of ML tools, without injecting some
    degree of economic reasoning, is unlikely to work well. Asset price data have
    specific properties that call for an ML approach that is tailored to these conditions.
    A lot of work remains to be done to integrate ML methods more firmly with asset
    pricing theory and existing empirical methods.


    In this chapter, I discuss some of these research opportunities. This sketch of
    a research agenda is by no means a complete survey of open questions in this area,
    but I hope that it can serve as useful inspiration for future research. As in
    much of this book, I focus mostly on the cross-section of stock returns in my
    discussion of these research opportunities, but there are, of course, related
    potential applications in other areas of asset pricing as well.'
