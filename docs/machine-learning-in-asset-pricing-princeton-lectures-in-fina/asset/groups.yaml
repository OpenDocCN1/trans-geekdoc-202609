    # REPRESENTATION AS A PENALIZED ESTIMATOR


    As we discussed in Section 2.4, the Bayesian estimator maps into a penalized regression
    estimator. If we maximize the model cross-sectional $R^2$ for explaining mean
    returns subject to a penalty on the model-implied maximum squared Sharpe ratio
    $\gamma b''\Sigma b$,


    $$\hat{b}=\arg\min_{b}\{\left(\bar{\mu}-\Sigma b\right)''\left(\bar{\mu}-\Sigma
    b\right)+\gamma b''\Sigma b\},\tag{4.20}$$


    the problem leads to exactly the same solution as in (4.17). The objective in
    (4.20) resembles a ridge regression objective, but with some important differences.
    A standard ridge regression objective function would impose a penalty on the squared
    $L^2$-norm of coefficients, $b''b$, while the objective in (4.20) penalizes $\gamma
    b''\Sigma b$.


    We can also rewrite the criterion in (4.20) equivalently as


    $$\hat{b}=\arg\min_{b}\{\left(\bar{\mu}-\Sigma b\right)''\Sigma^{-1}\left(\bar{\mu}-\Sigma
    b\right)+\gamma b''b\}.\tag{4.21}$$


    In this formulation, the estimator penalizes $b''b$ as in a standard ridge regression,
    but the loss function is different because errors are weighted by $\Sigma^{-1}$,
    akin to a GLS regression. This way of writing the estimation criterion is useful
    for introducing a sparsity-inducing penalty.'
