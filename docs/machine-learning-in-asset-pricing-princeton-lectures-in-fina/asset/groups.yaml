    当投资者基于$\theta = 0.5$形成先验信念时，他们拥有一个客观正确的先验。在这种情况下，先验方差$\theta/J$约为$5.6 \times 10^{-4}$。这正是图5.1中预测MSE达到最小值的位置。OLS学习将是$\theta
    \to \infty$的极限，因此先验方差趋向无穷大。如图所示，走向这个方向会恶化预测表现。事实上，当投资者的先验方差显著高于客观正确先验的方差时，存在一个点，使得预测MSE高于随机游走预测的MSE——后者简单地将估计的$g$设为零并预测$\Delta
    y_t = 0$。该随机游走预测的MSE以虚线显示。这说明了当$J$很大时，基于扩散先验的预测表现有多差。


    图5.1展示了另一个有趣的变动：我们让$X$矩阵随机化。我们每期重新抽取$X$的元素。现金流然后生成为$\Delta y_t = X_{t-1} g + e_t$。投资者将$\Delta
    y_{t-1}$对$X_{t-2}$回归来了解$g$。为了预测$\Delta y_t$，他们将这些估计应用于$X_{t-1}$。图5.1中的虚线显示了由此产生的预测MSE。最小值仍然与固定$X$情形相同：客观正确的先验使预测MSE最小化。然而，在先验过于分散的情况下，预测表现的恶化在这一情形中要严重得多。OLS预测会产生极其不准确的预测。


    直观地说，原因在于当协变量的数量$J$与观测值数量$N$在量级上相近时，$X$的许多列会偶然地出现高度正相关或负相关，尽管它们的元素是独立同分布的。[^2]
    OLS倾向于为这些高度相关的协变量对分配非常大的系数幅度，而它们在OLS拟合值中很大程度上相互抵消。OLS目标函数关于这些系数几乎是平坦的。小的系数幅度或使得协变量在OLS拟合值中大部分相互抵消的大系数，会产生几乎相同的拟合。如果协变量矩阵$X$保持不变，它们在基于OLS估计的预测中也会大体上相互抵消。因此，OLS难以确定这些系数的幅度并不会造成太大危害。然而，如果协变量矩阵随机变化，那么一对在$X_{t-2}$中恰好高度相关的协变量，很可能在$X_{t-1}$中不再高度相关。结果是，从对$X_{t-2}$回归得到的大幅OLS系数估计，在将这些估计应用于$X_{t-1}$的预测中不再具有抵消效应。这会使预测受到巨大估计误差的污染，导致糟糕的预测表现。


    当信息性先验接近客观正确的先验时，这一问题会得到缓解，因为正如我们上面提到的，在$1/N X''X$的具有小特征值的主成分方向上，收缩效应尤为强烈。如果某些特征近似由其他特征张成，就会出现小特征值。此时，后验均值会强烈降低来自那些在OLS估计中具有接近抵消效应的协变量对预测的贡献。


    $X$每期独立抽取，作为企业特征随机变化的一种表示，可能过于极端，但具有一定持续性的自回归过程或许是现实的。在本章其余部分，我们坚持固定$X$的情形。但有必要记住，随机$X$会使投资者的预测问题更加困难，并进一步增强信息性先验信念的重要性。


    ## 5.3 收益可预测性


    现在，我们考察当投资者基于由客观正确、信息性先验信念所得到的后验（5.23）对资产定价时收益的性质。与OLS学习情形下（5.15）的收益相比，收益表达式中现在多了一项：


    $$r_{t+1}=X(I_J - \Gamma_t)g - X\Gamma_t(X''X)^{-1}X''\bar{e}_t + e_{t+1}. \tag{5.25}$$


    （5.25）右侧第一项的出现是由于信息性先验所诱导的收缩。在扩散先验（即OLS学习）下，我们有$\Gamma_t = I_J$，该项将消失。但在信息性先验下，它非零。我们可以将这一项解释为由于收缩而对$X$中基本信息“反应不足”的效应。


    与OLS学习情形一样，第二项代表噪声对投资者后验均值的影响。信息性先验所诱导的收缩旨在抑制这种噪声诱导的估计误差的影响。通过$\Gamma_t$进行的收缩抑制了这一分量，但代价是产生了第一项。在贝叶斯学习下，$\Gamma_t$最优地权衡了由这两个分量产生的定价误差。


    ### 5.3.1 样本内收益可预测性


    当计量经济学家从该经济体中抽取收益，并将（5.25）中的收益对$X$进行回归时，与OLS学习情形相比，回归系数的表达式（如（5.25）中收益的表达式一样）现在多了一项：[^3]


    $$b_{t+1}=(X''X)^{-1}X''r_{t+1}

    =(I_J - \Gamma_t)g - \Gamma_t(X''X)^{-1}X''\bar{e}_t + (X''X)^{-1}X''e_{t+1}.
    \tag{5.26}$$


    右侧第一项是收益表达式（5.25）中第一项的结果。信息性先验所诱导的收缩在收益中保留了这一与$X$的列相关的分量。因此，在收益对$X$的回归中，它会被捕获。


