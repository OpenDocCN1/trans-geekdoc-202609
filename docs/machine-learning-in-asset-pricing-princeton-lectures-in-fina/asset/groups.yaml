    ## 5.1.1 投资者


    投资者是同质的且风险中性。我们进一步假设利率为零。这意味着收益可预测性不能是风险溢价或时变利率的结果。通过抽象掉风险溢价，我们有意使计量经济学家在我们的设定中更容易检验市场效率。由于不存在风险溢价，因此不存在因未知风险定价模型而产生的联合假设问题。然而，正如我们将要展示的那样，投资者学习问题的存在仍然使得标准市场效率检验的解释变得棘手。


    投资者的同质性是一个简化假设。作为对该问题的初步处理，我们希望尽可能保持分析的透明性。但这并不意味着异质性不重要。将设定扩展以允许异质性会很有趣也更符合现实，例如投资者在数据分析方法或所观察的数据上存在差异。异质性还会引入投资者需要学习其他投资者模型和信念的可能性。对内生对象的这种学习可能带来额外的有趣资产价格动态。然而，在此分析中，我们首先想看看在同质投资者设定下引入学习和高维性时，资产价格特性在多大程度上会发生变化。


    ## 5.1.2 定价


    为保持资产估值简单，我们关注一期股息 strip 的定价，即对一期后单个股息的要求权。向量 $p_t$ 表示在时间 $t$ 时，对将在时间 $t + 1$
    支付的股息的要求权的價格。这种对股息 strip 的关注看似限制性并不强。可以把模型中的一期看作一个较长的时间跨度，例如十年，而股息 strip 的收益则可视为长期股票的现金流压缩成在股票典型存续期发生的单一现金流。


    在风险中性和零利率的条件下，$p_t$ 然后等于投资者对下一期股息的预期，


    $$

    p_t = \tilde{\mathbb{E}}_t y_{t+1} = y_t + \tilde{\mathbb{E}}_t \Delta y_{t+1}
    = y_t + \tilde{\mathbb{E}}_t (X g + e_{t+1}).

    $$


    本章核心关注的问题是投资者如何形成这些预期 $\tilde{\mathbb{E}}_t [\cdot]$。


    作为基准，考虑理性预期情形，其中假设投资者已知 $g$。在这种情况下，不存在学习问题。股息预期恒定为 $\tilde{\mathbb{E}}_t (X g
    + e_{t+1}) = X g$。因此理性预期下的价格为


    $$

    p_t = y_t + Xg, \tag{5.3}

    $$


    以及已实现的價格变动，我们从现在起称之为“收益”，为


    $$

    r_{t+1} = y_{t+1} - p_t = \Delta y_{t+1} - Xg = e_{t+1}. \tag{5.4}

    $$


    我们分析的最终目标是理解投资者的信念形成如何影响资产价格的特性。特别是，我们有兴趣弄清基于学习的信念形成是否会诱发收益可预测性。在现有的资产定价文献中，股票收益横截面的收益可预测性通常归因于风险溢价的存在或投资者的行为偏差。但在这里我们想看看高维环境下的学习是否可能是收益可预测性的另一种来源。


    ## 5.1.3 计量经济学家观察者


    为此，我们考虑一位观察该经济体中资产已实现收益的计量经济学家。计量经济学家利用这些收益进行标准的基于回归的收益可预测性检验。更具体地说，计量经济学家询问公司特征
    $X$ 是否可用于预测横截面上的收益。将已实现收益对特征进行回归，计量经济学家得到系数向量：


    $$

    h_{t+1} = (X''X)^{-1} X'' r_{t+1}. \tag{5.5}

    $$


    在 (5.4) 中具有理性预期的投资者情形下，其中 $r_{t+1} = e_{t+1}$，收益是不可预测的，且


    $$

    h_{t+1} = (X''X)^{-1} X'' e_{t+1}. \tag{5.6}

    $$


    $h_{t+1}$ 元素的任何偏离零的情况纯粹是由于估计误差引起，该误差由噪声 $e_{t+1}$ 偶然与 $X$ 的列产生相关性所致。这是支撑大量关于市场效率检验和横截面股票收益异常文献的原假设。鉴于
    $e_{t+1}$ 的元素服从 $N(0, 1)$ 分布，在该原假设下，使用通常的 OLS 方差公式（残差方差已知），可得


    $$

    \sqrt{N} h_{t+1} \sim N(0, N(X''X)^{-1}), \tag{5.7}

    $$


    这为收益可预测性回归中的标准显著性检验提供了基础。


    为


    $$

    \mathbb{E}\,r_{IS,t+1} = \frac{1}{N}\,\mathbb{E}\left[\bar{e}_t''X\,(X''X)^{-1}X''\bar{e}_t\right]
    + \frac{1}{N}\,\mathbb{E}\left[e_{t+1}''X\,(X''X)^{-1}X''e_{t+1}\right] = \frac{J}{tN}+\frac{J}{N}.
    \tag{5.19}

    $$


    如果计量经济学家通过减去 $J/N$ 来对 $\mathbb{E}\,r_{IS,t+1}$ 进行调整，以使其相对于理性预期原假设 (5.11) 下的预期收益，仍会剩下项
    $\frac{J}{tN}$。如果 $J$ 相对于 $N$ 很小，则该项可能可以忽略不计。然而，在高维情形下，当 $J$ 与 $N$ 的量级相当时，计量经济学家会发现这种样本内交易策略相对于理性预期基准具有实质性的正预期收益。因此，如果计量经济学家将
    $r_{IS,t+1}$ 的实际值与在理性预期原假设下投资组合收益应有的 (5.8) 中的 $\chi^2$ 分布进行比较，她很可能会发现 $r_{IS,t+1}$
    位于该分布的远尾部。


    在此模型中，与理性预期设定不同，得出 $\mathbb{E}\,r_{IS,t+1}>J/N$ 的发现表明存在风险溢价或投资者必须具有行为偏差的结论是不正确的。在此模型中，投资者是风险中性的，因此风险溢价为零。投资者也没有行为偏差（需要说明的是，我们仍需评估
    OLS 学习在此是否是最佳学习方法）。经济解释是不同的：产生相对于理性预期基准的高预期收益的 (5.19) 中的第一项是投资者学习 $\mathbf{g}$
    的结果。


    例如，当某个公司特征（$\mathbf{X}$ 的一列）在投资者截至时间 $t$ 观察到的样本中恰好与 $\bar{e}_t$ 正相关时，投资者相对于理性预期基准而言，对具有该特征正值的股票会过于乐观。因此，其价格过高，未来收益较低。对于该特征值较低的股票则相反。拥有
    $t+1$ 收益数据的计量经济学家随后可以通过将 $r_{t+1}$ 对该特征进行回归来捕捉这种样本内收益可预测性。


    虽然由于 OLS 回归在应用统计和预测中的广泛使用，OLS 学习具有直观吸引力，但它是一种特设方法。尚不清楚这是否是该设定下投资者的最优学习方法。而如果这不是最优方法，那么
    OLS 学习产生的样本内收益可预测性是否只是投资者使用次优方法的后果呢？


    收缩是 $g$ 的信息先验的结果。为了明确收缩程度取决于什么，注意 $(I_J + \frac{J}{N\theta t}\mathbf{\Lambda}^{-1})^{-1}$
    是对角矩阵，其元素为


    $$

    \frac{\lambda_j}{\lambda_j + \frac{J}{N\theta t}}

    $$


    沿其对角线。因此，如果 $t$ 或 $\theta$ 很小，或 $J/N$ 很大，或沿特征值较小的主成分，则收缩较强。在这些情况下，先验对后验的影响很强，因为相对于先验而言，观测数据并不十分信息丰富。


    上述推导概述了贝叶斯更新的机制。但其背后有一个重要的经济解释。经济合理性要求一个信息先验，其中先验协方差参数 $\theta$ 不极大，以使 $g$ 的元素不能任意大。极大的
    $g$ 将意味着现金流增长可预测成分 $Xg$ 的横截面方差相对于不可预测噪声 $e$ 的方差而言巨大。这意味着大部分现金流增长的变化可基于公司特征预测——这并不是经济现实的合理表述。因此，从经济角度看，投资者先验地认为
    $g$ 的极大数值不太可能是有意义的。


    这也清楚地说明了为什么在该设定下 OLS 学习缺乏经济合理性。OLS 学习出现在先验为弥散的特殊情形，即 $\theta \to \infty$。在这种情况下，$\Gamma_t$
    收敛到单位矩阵，$\tilde{g}_t$ 收敛到 OLS 估计量。因此让投资者使用 OLS 学习实际上假设投资者忽略了可预测现金流增长成分的极大数值在经济上是不合理的这一事实。


    在 $J/N$ 很小的低维设定中，这影响不大。正如 (5.24) 中的表达式所示，如果 $J/N \to 0$，则 $\Gamma_t$ 收敛到单位矩阵，从而后验均值收敛到
    OLS 估计量。因此，OLS 学习作为低维设定下投资者信念更新的模型可能是可以接受的。


    但如果 $J$ 与 $N$ 的量级接近，情况就大不相同。在这种情况下，(5.23) 中的 OLS 估计量与后验均值之间存在很大差距。OLS 学习不仅在经济上不合理，而且还会导致预测性能较差。图
