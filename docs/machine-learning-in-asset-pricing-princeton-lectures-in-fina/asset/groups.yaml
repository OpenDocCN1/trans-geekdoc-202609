  - '[PAGE 39]


    is not overfitting the training data. Speaking of overfitting only makes sense
    if there is reason to think—perhaps based on economic plausibility considerations—that
    the magnitude of the regression coefficients is unlikely to be extremely large.
    Then, ignoring such information and estimating a regression without shrinkage
    would mean that we are overfitting the training data by not giving any weight
    to this prior information.


    Throughout much of this book, we will come back repeatedly to this Bayesian interpretation
    of regularization. In the ML literature, it is more common to discuss the effects
    of regularization in terms of a *bias-variance tradeoff*. Under this perspective,
    fitting an estimator to training data without much regularization yields low bias,
    but high estimation error, i.e., high variance. Regularization can reduce variance,
    but at the cost of biasing the estimator. From a Bayesian perspective, however,
    the frequentist notion of unbiased estimation that serves as a reference point
    for these tradeoff calculations is not of any particular significance. Given prior
    beliefs, the posterior, and the regularization implied by the posterior, represent
    the optimal way to combine these prior beliefs and the information from the empirical
    data. For the purpose of looking for links between regularization and economic
    restrictions—a central theme in this book—it is more useful to discuss how prior
    information shapes regularization than to frame it in terms of a bias-variance
    tradeoff.


    The Bayesian interpretation of regularization also clarifies how we should think
    about scaling of covariates in a ridge regression. If one wants to use ridge regression,
    variables should be scaled in such a way that a prior that assigns equal variance
    to each element of **g** is plausible. In contrast, if we believe that some coefficients
    are likely smaller in magnitude than others, then ridge regression does not yield
    the appropriate degree of shrinkage. It shrinks too much the coefficients on covariates
    with coefficients likely far from zero relative to those that are likely closer
    to zero. We should then rescale the covariates such that equal variance of the
    elements of **g** becomes plausible. This is the point where we need to bring
    in domain-specific prior knowledge about the prediction task and the data-generating
    distribution in order to guide the estimator.


    In the Bayesian framework, our prior view about the distribution of **g** also
    determines whether we end up with ridge regression or some other type of shrinkage.
    If the prior distribution is Laplace instead of normal, we obtain something close
    to the lasso. Figure 2.3 provides an example to compare the normal distribution
    (dashed line) with the Laplace distribution (solid line). Compared to the normal
    distribution, the Laplace distribution has more mass concentrated around zero
    and fatter tails. As a consequence, a Bayesian regression with Laplace prior leads,
    relative to ridge regression, to less shrinkage of large coefficients and greater
    shrinkage of small coefficients, which is similar to what the lasso does.'
