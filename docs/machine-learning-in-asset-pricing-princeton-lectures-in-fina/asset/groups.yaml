    # 1.7 ORGANIZATION OF THIS BOOK


    The rest of this book is organized as follows. Chapter 2 provides a brief overview
    of a number of basic supervised learning methods. The chapter begins by reviewing
    regression methods that are designed to predict continuous variables, including
    ridge regression, lasso, trees and random forests, and neural networks. Several
    of these learning algorithms involve hyperparameters that need to be set in advance,
    before the actual estimation. Chapter 2 discusses data-driven methods of tuning
    these hyperparameters to optimize the predictive performance of the learning algorithm.
    Hyperparameters often control the degree of regularization imposed on the estimation.
    Chapter 2 ends with a brief illustration of a Bayesian interpretation of regularization.
    In this interpretation, regularization corresponds to imposing certain prior distributions
    on model parameters. We use this Bayesian interpretation in subsequent chapters
    inject economic reasoning and prior knowledge into the design of ML approaches
    in asset pricing.


    Chapter 3 explores challenges that arise when applying ML methods in asset pricing.
    The chapter starts by outlining some key differences between the properties of
    data that most ML algorithms have been developed for and the properties of data
    that are typical in asset pricing. Throughout the chapter, I illustrate some of
    these issues with a concrete empirical example of cross-sectional stock return
    prediction using each stock’s own price history as source of predictive information.
    The chapter highlights that while ML methods are well suited for the prediction
    problems that arise in asset pricing, these techniques require significant adaptation
    if they are to deliver on their full potential. What works in typical ML applications,
    say in the technology sector or biostatistics, does not necessarily work well
    in asset pricing. Among other things, the low signal-to-noise ratio in asset pricing
    applications means that attempts to simply let the data speak within an extremely
    flexible framework are unlikely to yield good results. We will have to impose
    some structure on the learning algorithm. To do so, we need to connect the ML
    methods to basic economic frameworks of asset pricing and portfolio choice. Some
    principles from Bayesian statistics are useful for making this connection.'
  - '[PAGE 21]


    Chapter 4 describes an approach that makes some progress in this direction. It
    starts from a basic mean-variance portfolio choice problem—or, equivalently, the
    problem of finding a stochastic discount factor expressed as a linear combination
    of asset returns—and the notion that near-arbitrage opportunities are unlikely
    to exist in the stock market. By formulating Bayesian prior beliefs about the
    risk-return opportunities in the market, this framework allows us to impose economically
    motivated constraints on the return prediction problem. The estimator that emerges
    from this approach is similar to the elastic net estimator common in many ML applications,
    but with some important differences that come from taking into account the fact
    that prediction error covariances are an important determinant of a portfolios
    risk-return profile. The empirical application of this estimator uses a broad
    set of firm characteristics as return predictors, as well as nonlinear transformations
    of those, including pairwise interactions between characteristics. The empirical
    findings suggest that imposing economically motivated prior beliefs is important
    for obtaining good out-of-sample predictive performance.


    Chapter 5 takes a theoretical perspective. The earlier chapters show that statistical
    analysis of financial market data must address the fact that the environment is
    high-dimensional and ML methods provide a good toolbox for this purpose. But what
    about the investors whose investment decisions determine the asset prices that
    feed into these statistical analyses? If the information environment in financial
    markets is such that the prediction problems are high-dimensional, investors in
    theoretical models of financial markets should presumably face this high dimensionality,
    too. Machine learning methods therefore provide an attractive blueprint for modeling
    investor belief formation in theoretical models. Chapter 5 pursues this approach.
    To focus on fundamental issues, we consider a simple environment in which investors
    must learn from historical data the relationship between stocks’ cash flows and
    a large set of firm characteristics that serve as predictor variables. Investors
    are Bayesian and shrink their prediction model estimates toward objectively correct
    prior beliefs. In equilibrium, stocks are priced such that returns are unpredictable
    out-of-sample. However, returns are strongly predictable in-sample in ex-post
    statistical analyses of returns. This is due to the fact that an econometrician
    analyzing data ex post with in-sample analyses has the advantage of hindsight
    knowledge that investors in real time do not have. In a low-dimensional environment
    this implicit advantage of the econometrician can be small, but it is large in
    a high-dimensional environment. In-sample regressions are therefore ill suited
    for inferring risk premia or the effects of behavioral biases of investors from
    asset price data.


    Chapter 6 concludes the book by outlining a research agenda for future research
    on ML in asset pricing.'
