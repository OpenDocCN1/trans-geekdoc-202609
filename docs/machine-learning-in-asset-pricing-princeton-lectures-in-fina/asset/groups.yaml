    功率，通过提高测量频率。这与 Merton（1980）中的观察相关，即提高测量频率并不会带来对预期收益更精确的估计。因此，无论如何，我们都必须接受收益数据可得性有限的现实。


    在资产定价中，与许多典型的机器学习应用不同，我们并不一定对获得单个结果的准确预测感兴趣。例如，在股票收益预测中，我们并不一定对预测单个股票的收益感兴趣，而更关注构建具有良好风险收益特征的投资组合。将单个股票层面最准确的收益预测方法聚合到股票组合后是否能自动获得表现最佳的投资组合，这是一个开放性问题，没有明显的答案，正如本章后面将看到的那样。


    正因为许多资产定价应用都具有这种投资组合视角，我们对预测误差的协方差特性也比从事典型机器学习问题的研究人员更感兴趣。毕竟，在多资产环境下，收益预测误差的协方差决定了投资组合波动率的大部分。而这种投资组合波动率在决定投资组合的风险收益特征方面发挥着重要作用。误差协方差的特性可能在资产定价中机器学习应用的各个阶段都至关重要，从最优机器学习算法是什么、如何正则化它、如何评估预测性能，以及如何将其输出用于投资组合构建等问题的开始。


    正如我们在上一章讨论的那样，要使机器学习算法发挥良好作用，引入关于预测问题本质和数据属性的先验知识很重要。对于回归问题，其中一个属性就是模型的稀疏程度。正如
    Hastie、Tibshirani 和 Wainwright（2015）所强调的，稀疏模型在许多应用中似乎表现良好，包括基因组学、图像分类、文本分析等。在这些应用的许多情况下，事先就有理由预期稀疏性。例如，在图像分类中，图像的某些区域可能对分类任务完全无关。同样，在分析预测疾病的遗传因素时，大量候选基因可能与该疾病毫无关系。然而，在资产定价中，事先并不清楚稀疏模型能否很好地描述数据的生成方式。例如，在使用会计变量进行收益预测时，我们在查看数据之前假设相当数量的资产负债表变量可能与收益预测完全无关，有什么理由呢？难道不是更合理地认为有些更相关、有些较少相关——也许因为它们都是对某些潜在不可观察因素的不同噪声信号——但事先几乎没有变量的相关性恰好为零？


    在本章中，我们研究一个仅使用过去收益作为预测因子的简单股票收益预测模型。具有如此有限输入集的模型并不旨在代表在当今市场中构建表现良好的投资策略所需估计的模型类型。基于如此易得输入的表现良好的策略将是唾手可得的果实——但这种果实很可能早已被摘取。对于我们的目的而言，利用历史数据探索一个简单的基于收益的预测模型有助于说明如果我们想在资产定价中采用机器学习技术，需要解决的一些问题。


    在一般层面上，收益预测回归的目标是近似条件预期收益，这意味着我们试图找到函数 $f(.)$ $$ \mathbb{E}[r_{i,t+1} | x_{i,t}]
    = f(x_{i,t}) \tag{3.1} $$ 将可观察的资产层面特征 $x_{i,t}$ 映射为在特征条件下的收益预期。我们在这里纯粹关注预测 *cross-sectional*
    差异在收益中，因此我们可以将单个股票的收益 $r_i$ 视为相对于市场指数收益的表达。在下一章中，我们将研究更广泛的预测变量集合，但在本文中我们从仅由股票
    $i$ 的过去已实现收益的函数组成的预测变量集合开始。即使在这一受限的预测变量集合内，如果不想对模型施加特设的稀疏限制，也很容易产生大量预测变量，从而形成一个相当高维的预测问题。


    具体而言，我们分析的模型中 $r_{i,t+1}$ 为月度股票收益，而 $f(x_{i,t})$ 是股票自身过去月度收益的 120 个滞后项、过去收益平方以及过去收益三次方的线性函数。二次项和三次项允许过去收益与未来收益之间关系存在可能的非线性。为了避免微观结构引起的偏差和非常短的期限污染，我们跳过第一个滞后。因此，我们有回归
    $$ r_{i,t+1} = \sum_{k=1}^{119} b_k r_{i,t-k} + \sum_{k=1}^{119} c_k r_{i,t-k}^2
    + \sum_{k=1}^{119} d_k r_{i,t-k}^3 + e_{i,t+1}, \tag{3.2} $$


    总共有 $3 \times 119 = 357$ 个预测变量。


    每月 $t$，我们使用证券价格研究中心（CRSP）数据库中的所有股票，除了在月末 $t-1$ 时市值低于纽约证券交易所第 20 百分位且价格低于一美元的小盘股。我们排除低于此阈值的股票，以确保结果不会由极小且流动性差的股票驱动。对于因变量
    $r_{i,t+1}$，我们使用 1970 年 1 月至 2019 年 6 月的收益。我们逐月对因变量和所有解释变量进行去均值处理，以纯粹关注横截面变化（这就是回归式（3.2）不包含截距项的原因）。此外，我们逐月对所有预测变量进行横截面标准化，使其单位标准差。我们对每个月的观测值进行加权，使得回归在样本中对每个月给予相同的权重。在具有非平衡股票收益面板的资产定价应用中，这是一种自然的加权方案，因为投资组合策略的平均收益（每月可能包含不同数量的股票）也会对每个时期给予相同的权重。


    我们使用上一章讨论过的岭回归估计量（2.7）。惩罚超参数使用留一年的交叉验证进行估计。也就是说，交叉验证的折为构成一个日历年的连续月度横截面块。这意味着我们使用样本中除一年外的所有年份作为训练折来计算估计值，在被留出的验证年份中计算预测收益，并记录由此产生的
    R²。然后我们用不同的留出年份重复，并再次记录 R²。我们重复直到样本中的每个年份都被留出一次。最后，我们对所有留出年份的 R² 取平均，并搜索使该交叉验证
    R² 最大化的惩罚值。这种构建折的留一年法与我们在估计中对每个日历时期给予相同权重的加权方案一致。


    为了证明岭回归估计能够恢复有用信息，我们首先检查估计的回归系数。岭回归自动检测到现有文献中已记录的许多显著的可预测性模式，大致涵盖此样本期或其部分。图 3.1
    的面板（a）显示了式（3.2）中 b_k 系数的估计值，即滞后收益的一阶项系数。乍一看可能不明显，但仔细观察可以发现，在一次估计中，岭回归就恢复了与过去收益相关的几个主要异常现象：最高达
    12 个月滞后的正系数捕捉到 Jegadeesh 和 Titman（1993）中的动量效应；该图还显示近期收益的延续集中在 6 至 12 个滞后，如 Novy-Marx（2012）所指出的那样；12
    个月以后滞后项大多为负的系数反映了 DeBondt 和 Thaler（1985）中的长期反转。引人注目的是，在等于 12 的倍数的滞后处也存在较大的正系数。这种模式是
    Heston 和 Sadka（2008）报道的动量季节性。该效应一直追溯到滞后 120。虽然这些效应在不同研究中是分别记录的，但在这里可以用一次回归一次性捕捉所有这些效应。

    '
