    we orthogonalize the characteristics-based factors with respect to the market
    factor. This is equivalent, in terms of the effect on pricing errors, to including
    a market factor in the SDF. It is therefore useful here to think of the elements
    of $f$ as factors that have been orthogonalized. In our empirical analysis, we
    also work with factors that are orthogonalized with respect to the market return.'
