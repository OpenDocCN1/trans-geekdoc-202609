    specify all columns that you want to remove from a particular database table.
    If you do not specify which columns should be deleted, all of the database table''s
    columns will be removed.


    The DELETE statement has the following syntax:


    ```

    DELETE <table_name> [WHERE <condition>] [FROM <the_starting_point>] [WITH <options>]

    ```


    This means that the DELETE statement selects columns and removes rows satisfying
    certain conditions.


    Generally, you can use the DELETE command to delete data from a table or view.


    1: Suppose that you have a table in your database named Resume. The Resume table
    has three columns named Emp_ID, Name, and Current_Salary. You can use the following
    SQL commands to delete all rows of the Resume table that have an Emp_ID value
