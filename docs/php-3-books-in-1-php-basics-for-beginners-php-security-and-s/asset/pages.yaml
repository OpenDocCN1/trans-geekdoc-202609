    # The Wildcards


    Wildcards are characters used to replace a portion of a string without changing
    the original text of that string. Wildcards typically come in two forms: Character
    Numeric Wildcard and Character String Wildcard.


    The Character Numeric Wildcard is represented by a percent (%) symbol and can
    be used when you know that every instance of the specified character must appear
    within the string, but you don’t care exactly which character will be replaced.
    For example, given a user name of "Smith," you could use a % wildcard to replace
    the first character in the string with any character of your choosing. The final
    result would be smith%.


    The Character String Wildcard functions are the same as the Character Numeric
    Wildcard, except that it allows you to specify a string of characters that can
    appear in replacement of the targeted character. Thus, you could specify a wildcard
    that can match any 3 characters in the string. For example, this string: "smith%"
    will replace smith with the word Smith and % with any word of your choosing. The
    final result would be Smith.


    # How to use Wildcards


    You can use the wildcard in the following ways:


    +   1. Use a “%” character to specify any number of characters you want. If you
    wish to substitute for all characters except for the first one, use this: “% %.
    This can be replaced with any number of characters, but you must have at least
    one digit, and the percent must be included in the string.'
