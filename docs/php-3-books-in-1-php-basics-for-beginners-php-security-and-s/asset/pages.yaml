    # Benefits of PHP Class Interfaces


    +   1. Interfaces can be declared in namespaces where they belong, instead of
    being mixed with classes

    +   2. Interfaces are easier to organize and use

    +   3. Interfaces can have properties and methods added as more features are required,
    instead of having to modify the original interface definition every time

    +   4. Client code does not need to change when new features are added; it simply
    uses the interface methods even if they''re implemented by a new class

    +   5. Interfaces can be changed without affecting client code

    +   6. Interfaces can be extended to add new methods and properties without modifying
    the original interface definition

    +   7. Interfaces encourage re-use of code, as any class that implements the interface
    must support all of the methods and properties defined by it.'
