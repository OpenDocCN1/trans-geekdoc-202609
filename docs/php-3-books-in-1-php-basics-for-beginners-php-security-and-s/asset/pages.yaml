    # MySQL Functions


    You can use three functions to fetch data:


    mysqli_fetch( ), mysqli_num_rows( ) and mysqli_result( ). The first two are used
    to check the type of information you receive.


    mysqli_fetch_array( ) returns an array, or a specific object. If you use mysqli_fetch(
    ), it will return an integer with the number of rows returned by the query. If
    there are no rows, you can check if mysqli_errno( ) is equal to zero.


    mysqli_num_rows( ) returns a string that contains the number of rows in the table,
    or -1 if there are no rows. A query may have MySQL''s built-in LIMIT clause, which
    allows you to specify how many rows should be returned.


    mysqli_result( ) returns a string containing the number of rows that you specified
    in your query, or mysqli_affected_rows( ) if there is no LIMIT statement specified.


    mysqli_connect( ) and mysqli_query( ) will also return an error if a query has
    been executed and there are errors. If you want to get the error message, you
    can use the mysqli_errno( ), which will return a string containing the MySQL error
    code.


    Functions that can be used to join data are: mysqli_num_fields( ) and mysqli_field(
