    the image. The $color variable contains what kind of color to use to draw each
    pixel on your image, which in this example will be white. The $black_line_image
    variable holds onto a reference to an image that will be created later. The last
    lines copy the data from the black line image to the color image. The code above
    lays out an image of a straight line.


    # Drawing Rectangles in PHP


    To draw a rectangle in PHP, you first need to set up some variables. Here''s an
    example:


    ```

    $x1 = 0; $y1 = 0; $x2 = 220; $y2 = 20; $color = ''rgba(255,0,0,1)'';

    $black_rectangle_image=imagecreatefrompng(''blackrectangle.png'');

    $white_rectangle_image=imagecreatefrompng(''white.png'');

    $white_rectangle_image = imagecolorallocate($white_rectangle_image, 255, 255,
    255);

    imagecopy($black_rectangle_image, $white_rectangle_image, 0 , 0 , 0 , $x1 , $y1
    ,0);

    imagecopy($black_rectangle_image, $white_rectangle_image, 220 , 220 , 0 , 240
    , $x2 - 50 ,$y2 -50 );

    ```


    The first lines set the variables needed to. In this example, x1 is the starting
    point, and y1 is the height of the rectangle. Similarly, x2 is the ending point,
    and y2 is the height of the rectangle. The next lines set up some variables to
    be used in creating and laying out an image. The $color variable contains which
    color to use to draw each pixel on your image, which in this example will be white.
    The $black_rectangle_image variable holds onto a reference to an image that will
    be created later. The last lines copy the data from the black rectangle image
    to the color image. The code above lays out an image of a straight rectangle.


    # Drawing Circles in PHP


    To draw a circle in PHP, you first need to set up some variables. Here''s an example:


    ```

    $x1 = 0; $y1 = 0; $x2 = 220; $y2 = 20; $color = ''rgba(255,0,0,1)'';

    $black_circle_image=imagecreatefrompng(''blackcircle.png'');

    $white_circle_image=imagecreatefrompng(''white.png'');

    $white_circle_image = imagecolorallocate($white_circle_image, 255, 255, 255);
    imagecopy($black_circle_image, $white_circle_image, 0 , 0 , 0 , $x1 , $y1 ,0);
    imagecopy($black_circle_image, $white_circle_image, 220 - 40 , 220 - 40 , 0 -
    40 , 0 - 40 , 240 - 80 , $x2 -100 -40 *2+ 50 + 20 + 60 *2- 2.5*2,$y2 -80 ,0);

    $red_circle_image=imagecreatefrompng(''color.png''); imagecopyresized($red_circle_image,
    $black_circle_image, 0 , 0 , 220 - 40 , 220 - 40 , 240 - 80 , 200 + 150 + 50 +
    15 );

    echo $white_circle_image;

    ```


    The first lines set the variables needed to draw the circle. In this example,
    x1 is the starting point, and y1 is the height of the circle. Similarly, x2 is
    the ending point, and y2 is the height of the circle. The next lines set up some
    variables to be used in creating and laying out an image. The $color variable
    contains which color to use to draw each pixel on your image, which in this example
    will be white. The $black_circle_image variable holds onto a reference to an image
    that will be created later. The last lines copy the data from the black circle
    image to the color image. The code above lays out an image of a straight circle,
    or in this case, a filled circle.


    # Drawing Polygons in PHP'
