  md: '4) Cookiejar: This function will return an array containing all of the cookies
    that have been stored so far by PHP. You can use this function for debugging purposes
    or for storing all the cookies created during a session in an array for future
    use. If you save this code in a script called test.php, it will retrieve all of
    the cookies that have been stored so far and print their values to the browser
    using echo.


    You can see the session cookies in action:


    ```

    <span style="border:1px solid black;"> </span> <?php session_start(); ?>

    ```


    The session cookie is handy, and it takes a lot of time to store if the user logs
    in and out a lot. This is because you have to call the setcookie() function, again
    and again each time it expires. There are two formats of session cookies they
    are namespaced and non-namespaced. The namespaced cookies are stored in a session,
    and this is the default way.


    To store session cookies using namespaced, you need to add a namespace to your
    cookie name; for example, if you want to save it in the same session, then take
    the following code:


    ```

    session_id()=YOUR_SESSION_ID;

    ```


    5) Check Cookies: This function returns all of the cookies that have been stored
    so far. You can use this function for debugging purposes or for storing all the
    cookies created during a session in an array for future use.


    6) Remove Cookies: This function removes all of the cookies that have been stored
    so far.


    7) Set-Cookie Path: You can set the cookie path domain and secure these details
    using this function.


    8) Cookie Expiration Time: This function expiration date you can set to expire
    from 3 minutes to one year from now.'
