  md: "The process of polymorphism is called dynamic binding or (late-binding). A\
    \ base class defines the speak() function, but it also calls getName(), a polymorphic\
    \ function that each child class implements differently. The phrase \"late binding\"\
    \ refers to the fact that the request is only bound to a specific data type when\
    \ the function is called at runtime. Simply put, despite the fact that speak()\
    \ is specified in the generic Person class, it will invoke the getName() implementation\
    \ particular to the child. True polymorphism is enabled through this late-binding\
    \ feature, which is PHP’s new feature.\n\nAnother example:\n\n```\n```php\nclass\
    \ Character {\n    protected $m_Character_Title;\n    public function __construct($character_Title)\n\
    \    {\n        $this->m_Character_Title = $character_Title;\n    }\n    public\
    \ function get_Character_Title()\n    {\n        return $this->m_Character_Title;\n\
    \    }\n}\nclass Rachel extends Character\n{\n    public function get_Character_Title()\n\
    \    {\n        return 'Rachel: ' .parent::get_Character_Title();\n    }\n}\n\n\
    function Character_Name(Character $character)\n{\n    echo $character->get_Character_Title();\n\
    }\n$girlCharacter = new Rachel(\"who\");\nName($girlCharacter);\n```\n```\n\n\
    This is a polymorphism example since the Name() function is aware that it is receiving\
    \ an object of type Person but is unaware of whether the Product is Lucy, or Jane,\
    \ or someone else. Take note of how we declared the type Person as a parameter\
    \ for the Name() function – in highly typed languages, stating the data type of\
    \ function arguments is compulsory, whereas in PHP, specifying the data type (known\
    \ as type hinting) of functions is optional. If they are included, PHP will throw\
    \ a fatal error if a non-object or an object which is different from the expected\
    \ data type is passed to the function.\n\nPHP is a dynamic programming language\
    \ because it performs many of the same tasks as other languages at compile time.\
    \ It is loosely typed or dynamically typed, in the sense that the majority of\
    \ type checking occurs during runtime rather than during compilation. While values\
    \ have types in dynamic typing, variables do not; consequently, a variable can\
    \ refer to any value of any type.\n\n# **Method Overloading**"
