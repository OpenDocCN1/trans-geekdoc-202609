    At this point, you’re probably starting to get used to how a TOP clause works
    and how it can help your queries. It''s not quite that straightforward, though.
    There are some restrictions to keep in mind when using this clause. You can read
    more about these restrictions in the section below.


    The TOP Clause can be used with all kinds of conditions (including IN and NOT
    IN). It will always evaluate at the end of the SQL statement, even if it is querying
    a result set that has been computed earlier in the process. In other words, if
    you have multiple SELECT statements that use LIMIT or ORDER BY clauses, only one
    of those statements will ever be executed under a TOP Clause. This means that
    you will miss out on possible complexity savings, even though SQL Server treats
    the operations as a unit.


    # The ROWNUM Clause


    The ROWNUM Clause helps SQL Server determine how many rows to return from a query.
    It is used to limit the number of rows that are returned from a SELECT statement.


    The ROWNUM Clause has the same syntax as the TOP Clause, but its behavior is different.
    When used in a SELECT statement, it will only evaluate for the current row or
    for all rows in that query’s result set when executed with a LIMIT clause. That
    is if there are exactly N rows and the ROWNUM clause is used, only N rows will
    be returned. If it’s not used, then all rows in the result set will be returned
    (i.e., once all ROWS affected by the query have been fetched).


    In SQL-2005 and SQL-99 (but not in later versions), this behavior can be changed
    by adding an optional "NOT NULL" clause to the ROWNUM Clause. This is best illustrated
    by an example:


    ```

    select * from newstaffpartition order by staffid, Lastname, firstname, age where
    staffid > 10

    limit 5 ROWNUM(staffid)

    ```


    This will return a result set that only includes five rows.


