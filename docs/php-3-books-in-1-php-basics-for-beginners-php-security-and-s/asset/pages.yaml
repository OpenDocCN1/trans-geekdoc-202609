  md: '# PHP – Definition and History


    The abbreviation PHP means Hypertext Preprocessor. The initial letter of the acronym
    represents the full term, a most confusing trait of the language. It is considered
    to be a pretty simple one to master.


    PHP is a scripting language primarily built for the construction of websites.
    Data retrieval from SQL databases is a typical use. It is also used in the production
    of graphs and other visualizations. For instance, a designer can create links
    to images or make thumbnails for an image gallery. PHP is responsible for duties
    such as password acceptance, user authentication, and handling forum posts and
    guest books. Another frequent application is Facebook integration.


    You may even use PHP to develop a website that enables users to create content
    - even if they lack basic HTML knowledge!


    The fact that PHP is dynamic is one of the key distinctions between it and normal
    HTML. However, this is not an either/or scenario as both languages are interoperable.
    PHP has the ability to generate HTML code.


    PHP in its current form is a descendent of a program called PHP/FI. PHP’s first
    release was in 1994 by Rasmus Lerdorf. He named the script package "Personal Home
    Page Tools" or "PHP Tools" because it was originally used to track visits to his
    online curriculum vitae. Rasmus modified PHP Tools over time when additional functionality
    became necessary, resulting in a substantially larger and more powerful implementation.


    This new paradigm may interact with databases and other systems, enabling users
    to construct simple dynamic web applications such as guestbooks. Rasmus gave the
    PHP Tools source code to the public in June 1995, allowing developers to tweak
    it as desired. Additionally, users were able - and encouraged - to provide solutions
    for code faults as well as general improvements.


    Rasmus expanded PHP in September of that year, and for a little period, the PHP
    designation was discarded. The new implementation, termed FI, includes several
    of PHP''s essential functions (short for "Forms Interpreter"). Variables resembling
    those found in Perl, automatic form variable interpretation, and embedded HTML
    syntax were all included. Similar to Perl''s syntax, but far more restricted,
    basic, and inconsistent.


    Developers must use HTML comments to embed code in an HTML file. Despite mixed
    reviews, FI gained popularity and acceptability as a CGI tool — but not quite
    as much as it did as a language. In October 1995, all this changed because Rasmus
    did a complete redesign of the code. It was the first edition that included what
    is often considered an advanced scripting interface,'
