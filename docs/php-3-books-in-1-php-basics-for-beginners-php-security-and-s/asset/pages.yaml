  md: '# PHP File Function Syntax


    The syntax for the files function is:


    ```

    function( $name , $type = "" , $dir = "." , $exclude = "" , $keep_last_access
    = false )

    ```


    Below I''ll go into the details of each of those arguments in a little more detail.


    $name - The name of the file that you''re creating is required, and it can''t
    be changed after you''ve created your file. Suppose you don''t specify the $name
    argument, then the file will be saved to your system under the same name as your
    script.


    $type - The type of file you want to create. This is optional, and if it isn''t
    specified, then PHP will use a default value of ''text/plain.'' Supported values
    include: text, HTML, php, and xml.


    $dir - The directory that you want to save your file in; if this isn''t specified,
    then it''ll be saved to your "Documents" folder.


    $exclude - This option may be used to tell the PHP interpreter not to save certain
    files to the directory. For example, maybe you want certain images and CSS files
    saved to a different location than your other files. Use this option if you want
    to specify an alternate directory that should be excluded from saving.


    $keep_last_access - You can use this argument in order to specify how long (in
    seconds) a file should be kept around after it''s been deleted. This is useful
    for debugging purposes. If it''s set to '' true,'' then you''ll be able to find
    out when the file was last accessed.


    # Uses of the Files Function


    # 1. Generating a New File


    The most obvious use of the files function is to create a new file, but it can
    also be used to rename an existing file or remove an existing file. These are
    useful if you want to easily move your blog posts around then they can make it
    easier! Here''s a quick example:


    ```

    <html><body><?php $my_file = file("file.txt"); print "New file name: ".$my_file.".<br>";
    ?> <h1>Post Name</h1> <?php $my_file = file("post.txt", "text/plain"); print "<p>New
    post name: ".$my_file."</p><br><br>"; ?> </body> </html>

    ```


    Building a file structure like this is pretty easy, but if you don''t have many
    files saved to your system, you may want to consider using a more reliable program
    to do it for you.


    # 2. Creating and Saving Files


    You can create new files and then save them to your system with the files() function.
    In the example below, I''m going to create a new set of blog posts by first creating
    a file:


    ```

    <?php $my_file = file("post.txt", "text/plain"); print "<h1>Post Title</h1>";
    ?> <?php $my_file =

    ```'
