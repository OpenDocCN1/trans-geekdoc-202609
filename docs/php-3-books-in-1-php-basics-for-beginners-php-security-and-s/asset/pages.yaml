- pgno: 320
  md: '# The TOP Clause


    The TOP Clause helps ensure that output is limited to specific values. We will
    start out by explaining this clause and then explore some of its uses and limitations
    before moving on to look at the ROWNUM and LIMIT Clauses.


    The TOP clause is used to limit the number of rows sent back from a query. It
    determines the order of the output from an SQL statement and specifies how many
    rows are sent back. A TOP Clause can be used with any clause that generates rows
    (where, select, order by, and group by).


    A TOP clause only evaluates when all rows have been fetched from a table or when
    those rows don’t fulfill a condition (e.g., if the limit is less than the total
    number of records in a table).


    There is a different syntax for the TOP Clause that comes from SQL-92 and SQL:2003.
    All of these forms will be covered here below.


    Now, let’s take a look at some examples so we can get some practice. The first
    example will just show us how to use the TOP Clause with a SELECT statement. In
    this example, if there are more than five rows in the table, only five will be
    returned.


    ```

    select * from newstaffpartition where staffid > 10 order by staffid

    TOP 5 OF NEWSTAFFPARTITION WHERE STAFFID > 10 ORDER BY STAFFID

    ```


    If we want to get a combination of many values, the TOP Clause can help.


    ```

    select * from newstaffpartition order by staffid, Lastname, firstname, age where
    staffid > 10 order by name

    TOP 5 OF NEWSTAFFPARTITION ORDER BY STAFFID, LASTNAME, FIRSTNAME, AGE WHERE STAFFID
    > 10 ORDER BY NAME

    ```


    Using the TOP Clause with a GROUP BY statement is similar to using it with a SELECT
    statement. The example below will generate an output that only shows the top five
    employees.


    ```

    select Lastname, firstname, age from newstaffpartition

    GROUP BY LASTNAME, FIRSTNAME, AGE

    TOP 5 OF NEWSTAFFPARTITION GROUP BY LASTNAME, FIRSTNAME, AGE

    ```


    It’s also possible to combine TOP with both ORDER BY and LIMIT. These next three
    examples will show how to get results for the top five people in the list (based
    on employment date), but only information for the last five people who were hired
    by year.


    ```

    select * from newstaffpartition group by Lastname, firstname

    GROUP BY LASTNAME, FIRSTNAME LIMIT 5

    ```


    ```

    TOP 5 OF NEWSTAFFPARTITION GROUP BY LASTNAME, FIRSTNAME LIMIT 5

    ```


    Similar to the previous examples, you can use TOP with both a SELECT and a GROUP
    BY. The two following examples show how to get results for the top five employees
    (by the last name) or the top five by employment date (by the last name).'
