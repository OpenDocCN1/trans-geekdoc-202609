  md: '# # Introduction


    ![](img/232f65b1c63e7757b6150e92c9cc0d00_10_0.png)


    After learning PHP, I secured a high-paying back-end web development job right
    out of college by demonstrating to recruiters my command of the language and my
    understanding of other aspects of web development through my developed project.
    PHP is a relatively easy language for beginners to learn, with a clean and stylish
    syntax, whose mastery is possible within a relatively short duration from beginner
    to the professional level, typically 2–3 months. However, there is a caveat.


    As a novice, the instructor and the method of instruction have a considerable
    impact on the learner’s ability to assimilate. Without a good tutor, the student
    may quickly lose interest in the subject. This can have a huge impact on one’s
    career path in the worst-case situation. I, too, had to struggle to learn these
    things.


    Throughout my education, I learned that most PHP study materials - books, PDFs,
    and tutorials - are not user-friendly. I felt that the author/tutor rushed through
    the course and neglected to clarify the thought process required to get at the
    reasoning behind particular lines of code, assuming the audience is already conversant
    with PHP. This is not the case for a newbie, so I will spend time explaining the
    logic behind each code in this book.


    When it comes to learning PHP, it is critical to choose an effective resource
    - one that keeps the learning curve linear and progresses to difficult topics.
    After providing sufficient insight and examples on the concepts, one that discusses
    the questions asked by recruiters at top organizations, one that offers in-class
    support in the form of resolving any doubts students may'
