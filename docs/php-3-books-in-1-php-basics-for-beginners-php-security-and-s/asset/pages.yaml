    just using strings as our keys and numbers as our values. This is because we can
    add much more meaning to our data in terms of its relationships.


    Associative array is a feature in PHP5 that allows us to create structures where
    we can store any data type as our keys and any other data type as our values.
    For example, we could store an image as a value and its name as the key. Additionally,
    we could also use these structures within objects but only if they were declared
    in the beginning of our class (e.g. $Image = array(''path''=>''/images/image_name.gif'');
    ).


    There is an example code below for a ''Month'' object using an associative array:


    ```

    <code>class Month { private $months; public function __construct() { $this->months
