  md: '# Session and Cookies


    Data in a session is stored on the server, where sessions are saved in files,
    cookies are sent to the user’s browser, and they can be read by browsers. Cookies
    expire, and session data is lost when a browser is closed.


    For example, if you open your web browser to visit Google Search and then close
    it before you visit any other pages or sites from that search bar, all information
    that Google collected about your first search will be deleted because of the expiration
    time for cookies. That also means that if you close your browser and then open
    another one, you will have to perform the search again, and Google will not save
    previous results from previous searches.


    PHP, as a server-side programming language, uses cookies to store information
    about users in their browsers. Cookies can be used to store user preferences and
    other information specific to your site.


    The PHP code in Listing 1 will create a cookie. If you save this code in a script
    called test.php, it will send the cookie that is created to all users who visit
    the page. After you type in the URL for your site, click the Go! button, and then
    click any link on your page (it doesn’t matter which link), you will see that
    a new cookie is set on your computer. The retrieved cookie will contain the URL
    of your site.


    Listing 1: PHP Cookie Code for all Users


    ```

    <?php echo "Cookie Value: ".$_COOKIE["class_name"]; ?>

    ```


    The code in Listing 2 will retrieve a cookie from a user’s computer. If you save
    this code in a script called test.php, it will remove the cookie from the browser
    of all users who visit the page. After you type in the URL for your site, click
    the Go! button, and then click any link on your page (it doesn’t matter which
    link), you will see that a new cookie is created on the browser of all users who
    visit that page.


    Listing 2: PHP Cookie Code to Remove/Delete Someone’s Cookie


    ```

    <?php if(eregi(''class_name'', $_COOKIE["class_name"])) { $cookie=""; } else {
    $cookie=""; } ?>

    ```


    The life of a cookie can be extended by the use of cookies.js, which is sometimes
    referred to as a session management function, or the "session cookie" function.
    Cookies can be used to store the user’s ID, the user’s preferences on a website,
    and their login credentials. The codes in Listing 3 will create cookies that contain
    an ID and a username, which will be saved on the user’s computer. If you save
    these codes in a script called test.php, it will send the cookies that it'
