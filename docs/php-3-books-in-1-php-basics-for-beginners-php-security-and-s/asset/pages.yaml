- pgno: 338
  md: '# PHP Graphics


    ![](img/232f65b1c63e7757b6150e92c9cc0d00_338_0.png)


    There are many ways to create graphical representations with PHP, with the most
    common method being through image manipulation. This chapter shows how to generate
    images from a PHP array and how to use those images in your program. The code
    is written for examples, and you may update the code as you need it!


    Use the GD library, which will allow you to scale your images to any size. Also,
    it will make it easy to create thumbnails of images.


    The GD library is free and open source. To use it, configure your PHP installation
    to use the GD graphics library. If you are using a system that uses RPM (Redhat
    Package Manager) for installing software, such as Redhat or CentOS servers, then
    you will want to look in the /etc/php.


    # Drawing Lines in PHP


    To draw a line in PHP, you first need to set up some variables. Here''s an example:


    ```

    $x1 = 0; $y1 = 0; $x2 = 220; $y2 = 20; $color = ''rgba(255,0,0,1)'';

    $black_line_image=imagecreatefrompng(''blackline.png''); $white_line_image=imagecreatefrompng(''white.png'');

    $white_line_image = imagecolorallocate($white_line_image, 255, 255, 255);

    imagecopy($black_line_image, $white_line_image, 0, 0, 0, $x1, $y1 ,0); imagecopy($black_line_image,

    $white_line_image, 220 , 220 , 0 , 240 , $x2 ,$y2 );

    ```


    The first lines set the variables needed to draw the line. In this example, x1
    is the starting point, and y1 is the height of the line. Similarly, x2 is the
    ending point, and y2 is the height of the line.'
  merge: -1
  img_proc: true
