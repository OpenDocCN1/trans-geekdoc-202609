    Errors are inescapable; they are unavoidable. Chance, on the other hand, favors
    the prepared thinker, and as a developer, you''ll have a far better chance of
    producing useful software if you look into the roadblocks that are almost certain
    to exist. User-initiated errors can be avoided by incorporating beneficial tools
    like javascript form validation. Set your code to handle foreseeable faults and
    exceptions to avoid a catastrophic failure. In addition to PHP error reporting
    and configuration directives, the current PHP version has a number of useful exception
    management tools. Let''s begin with the ability to handle exceptions.


    The way PHP reports problems is controlled by a slew of configuration directives.
    I''ll begin by going over a few of the latter. If you become bored, make a note
