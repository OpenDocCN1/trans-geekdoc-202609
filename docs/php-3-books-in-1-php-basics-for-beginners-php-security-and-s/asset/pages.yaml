    # PHP Class Interfaces


    An interface is a contract, an agreement of sorts. It defines the minimum required
    methods and properties that a class needs to have in order to implement it. When
    you declare an interface, you''re telling other developers that this is the knowledge
    you need in order to write code for your application - nothing else will suffice.


    Interfaces are a very popular method of writing interfaces in PHP. A PHP class
    is declared to implement one or more interfaces.


    Say for example you want to define an interface for customers. You could write
    something like this:


    ```

    ```php

    <?php interface Customer { /** * Returns the name of a customer * @return string
    */ public function getName(); }

    ?>

    ```

    ```


    We declare the interface with the keyword "interface." We then define the name
    and the methods that belong to this interface. The "public" keyword is meant to
    tell the client (i.e., other developers) that they can get at these methods, even
    if they don''t have access to the interface itself (i.e., they don''t have access
    to the class that implements it).


    If we want to use this interface in our HTML page, we might write something like
    this:


    ```

    ```html

    <html> <head> <script type ="text/javascript"> $(document).ready(function() {
    var c = new Customer(); c.getName(); }); </script> </head> <body> <h2>The Customer
    Interface</h2> <p><b>Name:</b> <?php echo $c->getName(); ?></p> </body> </html>
    <...

    ```

    ```


    This is the way interfaces were usually used in older versions of PHP. However,
    with the advent of namespaces in PHP 5.3, the implementation of interfaces has
    changed. Now, when you define an interface, you can also declare the namespace
    for this interface. This allows for better encapsulation and flexibility of your
    class implementation.


    ```

    ```php

    <?php namespace CustomerInterface ; interface Customer { /** * Returns the name
    of a customer * @return string */ public function getName(); } ?>

    <?php namespace Userinterface ; class Customer implements CustomerInterface {
    public function getName() { return "My name is " . $this -> firstName . " " .
    $this -> lastName ; } }?>

    ```

    ```


    You can now tell that the GetName() method belongs to the Customer interface.
    The name of your web page will also change, in this example from <script


    ```

    ```javascript

    type="text/javascript">...</script>... to <script type="application/javascript">...</script>...

    ```

    ```


    This gives you more control over your application, as you don''t have to be confined
    to having every method of an interface implemented in every class that implements
    it.'
