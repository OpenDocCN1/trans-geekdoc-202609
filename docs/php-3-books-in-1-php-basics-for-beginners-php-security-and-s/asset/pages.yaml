  md: '# Mathematical Functions


    Understanding what each mathematical function does and its general usage can help
    a lot when you''re piecing together your own programs. So, this chapter will provide
    an introduction to mathematical functions in PHP that should get you well on your
    way towards solving any problems with them.


    The following are some of the mathematical functions on PHP:


    b: returns the absolute value of a number.


    Ceiling: returns the ceiling function only if the argument is an integer. Otherwise,
    it returns NaN. It also ignores negative numbers.


    Floor: returns the floor function only if the argument is an integer or a float
    (for example, when you divide by 0). Otherwise, it returns NaN. It also ignores
    negative numbers.


    Truncate: truncates a number to the decimal point by removing the thousandth digits.
    To do so, use a binary operator (such as modulus) to get the remainder of dividing
    the number by 8, then divide it by 10. 5 % 8 = 1, so 7 is truncated to 0.


    Abs: returns the absolute value of an integer or float. Also returns NaN when
    no argument is passed or if it is a negative value.


    Pow: makes a floating-point number power another floating-point number. Returns
    0 for negative or floating-point numbers for 0 (like 0 * 5 = 0). If the base isn''t
    an integer, it returns NaN. Negative values will not get a very accurate result.


    exp: in exponential notation, returns e to the power of x. If x is negative, it
    returns NaN.


    log: as a float, returns the natural logarithm of its argument. (For example,
    log(100) = 2.) If x is not greater than 1, it returns NaN.


    log10: returns the base 10 logarithm of its argument (for example, log10(100)
    = 2). If x is not greater than 0, it returns NaN.


    Pow: returns the first argument raised to the power of the second argument. If
    either of them is 0 or negative, it returns NaN.


    The arctangent of its two arguments is returned by atan2. Returns a value in radians
    between -π/2 and π/2, unless one of them is NaN. If both numbers are less than
    -1 or greater than 1, it will'
