  md: 'This gives you a very quick way of reporting errors to the browser, and it
    can be a faster way of reporting an error than logging in to each website individually
    and manually typing an error message into each site''s error log file.


    # 4. Security


    You can reset a user to an anonymous guest or disable scripts from running from
    .htaccess files on Apache servers. This helps prevent some well-known attacks
    such as cross-site scripting, cross-site request forgery, SQL injection, and other
    malicious attacks against your website.


    # ***Disadvantages of using PHP $_SERVER***


    +   1. No type of safety


    As you are dealing with data coming from the browser, there is no type checking
    being done, and you need to use try-catch blocks to prevent your script from crashing.


    +   2. HTTP Request and Response Variables


    There is no way to know the details of an HTTP request, such as the request method
    or the IP address or domain name of who is viewing your pages. This information
    is only available after you get a response back to your script. You must then
    parse the response and get this information.


    +   3. Unknowing information


    Once the information is transmitted to your web server, it will be parsed by the
    web server and sent to the browser. In cases of cookies, DNS translations, and
    other features, other people on your network may have gotten them before you.


    +   4. HTTP vs. HTTPS


    The HTTP engine does not protect against somebody tampering with data being transmitted
    from a client as it is just a plain text HTTP protocol. On the other hand, HTTPS
    over SSL adds additional security layers for secure communication channels between
    servers and clients.


    +   5. Cross-Origin Resource Sharing


    If you are working on multiple machines with additional groups of people, all
    of them may have access to the same information without your knowledge. If all
    these people have access to your scripts, there is no way you can control who
    sees what information and what they do with it.


    # PHP $_POST Variable


    The $_POST variable is a predefined PHP global variable that stores information
    submitted by the form. The $_POST variable is typically used in an HTML form to
    allow users to submit information, such as name and address, without refreshing
    the page or returning to another page.


    The $_POST variable is set when an HTML form is processed by the PHP engine. Each
    post in a form has its own dedicated entry in the $_POST array.'
