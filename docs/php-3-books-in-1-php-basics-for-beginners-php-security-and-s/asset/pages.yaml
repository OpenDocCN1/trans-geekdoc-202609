    # Class Objects


    Class objects define a class of objects which act similarly in many respects.
    For example, all cars are capable of driving and must have four wheels. These
    two properties are defined with class variables that are shared by every car.


    Class objects should be used when you want to group similar types of objects together
    or when you want object-oriented programming to work with your code. Class-based
    languages like PHP provide the power and flexibility needed to create changing
    and flexible code easier than ever before.


    In a class-based language, a class is an object that defines the behaviors and
    attributes of a type of object. Class-based programming allows you to create your
    own model of objects that can change over time and even be reused by different
    programs.


    A class is like a blueprint for an object. It defines the attributes, behaviors,
    and relationships between its variables. A class does not create any objects itself;
    it merely defines the variable values for objects that are going to be created
    later on in the program. PHP provides the OOP capabilities needed to create an
    object-oriented world of changing and flexible code.


    To create a class, put your variables inside the class. Then, you tell the PHP
    interpreter within the class what function to execute for each of the variables
    in that class.


    Instead of putting all your code into a separate script file, you write everything
    in one script file. However, it depends on how you would like to use that script
    file. You can use it as a module or as a component.


    A module is a set of code that can be reused in different programs and run independently
    from any other modules. A component is used in one specific program and does not
    exist outside that program.


    Class objects may also be more secure because you only have to worry about one
    class and not many different classes.


    PHP provides the OOP capabilities needed to implement class variables, method
    functions, and object creation. To define a class in PHP, you must first use the
    keyword "class," followed by your class name. Class variables are defined using
    the keyword "public" instead of "private."'
