    # Comparison between a global variable and a superglobal variable


    Global variables are declared within the script/function, whereas superglobal
    variables are not.


    Global variables can be accessed through the usual array indexing operator and
    access their values without having to refer to them by their official names.


    Superglobals can only be accessed through the register_globals, which is a function
    added to your PHP code from the php.ini file.


    Global variables provide better performance than superglobals because they are
    stored in your script and take less memory.


    Superglobals are a powerful feature, even though we have to use a dollar sign
    before using them. One thing to note is that some parts of the PHP parser may
    use certain superglobal variables without the dollar sign.


    In some cases, when we create a global variable and it is used in other scripts
    and functions, the global variables are actually stored in the same file as our
    script, which may cause problems later on with writing each script in its own
    file, which is recommended for security reasons.


    # PHP $_SERVER


    $_SERVER is a PHP super global that contains all the information about how the
    script was called, who is calling it, what machine it''s being served on, and
    much more.


    It is a PHP super-global (a super global being an environment variable that''s
    available globally). It contains information about who is running the script,
    where it was served from, and much more.'
