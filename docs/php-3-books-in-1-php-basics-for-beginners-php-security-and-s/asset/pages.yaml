  md: '# Restful APIs


    ![](img/232f65b1c63e7757b6150e92c9cc0d00_327_0.png)


    A RESTful API is an interface that allows the software to be connected to a data
    source on the internet through web services. It returns HTTP responses, enabling
    software developers to use the data in JavaScript code and then process it into
    the desired format.


    RESTful API is a collection of resources that provide data to further process
    in the application. When we make a call to the API, it returns XML or JSON format
    as a response.


    A few things to note about an API:


    All API calls must be wrapped in an XMLHttpRequest object (or flash equivalent).
    The requests themselves are simple HTTP GETs with parameters passed in form fields
    or within the URI.


    All API resources must be accessed using a uniform URL structure (similar to Uniform
    Resource Identifiers.)


    A RESTful API can be a simple static web page or an entire web service. The only
    thing required is the ability to call an API.


    REST stands for Representational State Transfer. It is a set of architectural
    constraints for moving data between client and server on the Web. REST requests
    use HTTP and follow common HTTP conventions, such as using GET or POST commands,
    cookies, and XML or'
  merge: -1
  img_proc: true
