    # Mocks and Stubs


    The process of substituting an object with a testdouble that returns specified
    values is known as stubbing.


    Mocking is the process of validating behavior by substituting a test double for
    an object. Mock objects are used in unit testing to imitate the behavior of real
    objects in test cases. When you utilize them, it is easy to test the functionality
    of the object you are building. Mock objects are useful when the genuine implementation
    of one or more of an object''s dependencies is still in progress, or when one
    or more of an object''s dependencies is dependent on aspects that are difficult
    to replicate. Both of these cases are illustrated by testing the interaction between
    your application and a database. Normally, you''d use a function or another data
    access object, but what if the database hasn''t yet been created?


    What if no data was available, or if the database-querying code had not yet been
    written? A mock data access object simulates the true data access object by returning
    some pre-defined values. This saves you the time and effort of setting up the
    database, loading test data, and writing the code to query the database. Mocks
    helps in validating the request, say SQL, was appropriately created by the object
    that is accessing the connection in the context of an imagined'
