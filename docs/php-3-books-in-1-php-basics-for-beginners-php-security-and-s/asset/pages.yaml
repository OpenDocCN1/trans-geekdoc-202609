    # Assertion Methods


    An assertion is a tool for testing your assumptions about a certain system feature.
    An assertion is typically used to represent a test concerning the outcome of a
    tested code statement or segment. If the outcome of a test differs from the intended
    outcome, the test fails, and a warning message is presented. Assertion methods
    are also useful for documenting how the system under test should behave. Let''s
    replace the example test case above with an assertion method:


    ```

    <?PHP

    class Unit_Test extends PHPUnit_Framework_TestCase {


    private $m_x;

    private $m_y;


    public function Unit_Test_Setup()

    {

    $this->m_x = 2;

    $this->m_y = ''2'';

    }


    public function Unit_Test_TestEqual() {

    $this->assertTrue($this->m_x == $this->m_y);

    }


    public function Unit_Test_TestIdentical() {

    $this->assertTrue($this->m_x === $this->m_y);

    }

    public function Unit_Test_TearDown() {

    $m_x = "";

    $m_y = "";

    }

    }

    ?>

    ```


    All assertion methods allow an optional description as a final parameter. This
    will be used to'
