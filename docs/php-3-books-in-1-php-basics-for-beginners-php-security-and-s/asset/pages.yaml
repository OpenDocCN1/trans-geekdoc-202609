    # Benefits of RESTful APIs


    +   1. RESTful APIs give you full control over data access. You''re in charge
    of which data you access and when. Reading the data in JavaScript is a cinch,
    with no cryptic HTTP requests. So updating your data is just as simple.

    +   2. RESTful APIs result in high performance. If a service already exists that
    can solve your problem, REST-style calls will quickly return the information you
    need and dramatically reduce wait times for your application''s users.

    +   3. RESTful APIs are easy to implement. Most developers understand REST in
    theory and know how to get started.

    +   4. RESTful APIs are scalable and fit for the future. They''re designed to
    be compatible with new technology, so you can use them now but don''t have to
    worry about them becoming obsolete in the future.

    +   5. RESTful APIs are secure enough for almost any application purpose. A service
    is designed to be a secure interface between your server and the rest of the web,
    so you can be sure that your data is safe. That means you don''t have to add extra
    complexity or security layers to protect the rest of your application.

    +   6. A RESTful API can be normalized across all your service providers. This
    means that you''ll only have to deal with one set of data and one set of APIs
    for accessing that data.

    +   7. RESTful APIs are easy to test and can be easily used with other applications.


