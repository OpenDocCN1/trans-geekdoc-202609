- pgno: 342
  md: '# Files


    ![](img/232f65b1c63e7757b6150e92c9cc0d00_342_0.png)


    The files function is one of the most important parts of any PHP script. This
    function allows you to store a copy of your shiny new blog post, for example,
    to a file on your hard drive.


    This function is used to create files that can be used to permanently save data,
    and they are also often used as a temporary storage space. When you remove a file
    from your computer, it is no longer accessible, but it can still be viewed in
    the recycle bin. In this tutorial, we''ll discuss how to use this handy function
    in your PHP scripts!


    The first argument of the files() function is required, and it specifies the name
    of the file that you want to create or open. The second input is optional and
    specifies the location of the file on your system. By default, the file will be
    saved to your Documents or Desktop folder, but you can specify an alternate directory
    if you need to. The third argument is also optional, and it specifies how long
    the file should be kept available. It gives a timestamp that''s used to tell when
    the last access was made.


    Here''s a brief example of how the files function works:


    ```

    ```php

    <?php $my_file = file("file.txt"); print "The file contains the following text:
    "; print $my_file; ?>

    ```

    ```


    In the above script, I''m creating a new file called file.txt and writing some
    text to it. I then call up that info by printing out the contents of my variable
    with a list-printing function called ''print.'''
  merge: -1
