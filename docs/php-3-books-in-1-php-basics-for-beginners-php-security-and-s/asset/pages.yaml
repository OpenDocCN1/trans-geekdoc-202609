    \ network is 10.0.0.0/8.\n\nAs you can see, $_SERVER has a number of useful variables\
    \ in it. If you need to debug an application, one useful technique is to just\
    \ write out each variable to the browser, and that can tell you a lot about what's\
    \ going on with your application.\n\nThere's also the $_SERVER[\"REMOTE_ADDR\"\
    ] variable, which will tell you the IP address of the person running your code.\
    \ It's 192.168.1.1 in this case. This is useful for quickly, easily, and accurately\
    \ figuring out who is visiting your site from where.\n\nA common use of $_SERVER\
    \ is to look up the host from where a request was sent from.\n\nThis is especially\
    \ useful in the case of a production environment, as you can respond to that request\
    \ by sending the client a different file instead. You can do this by using $_REQUEST[\"\
    SERVER_NAME\"] and $_REQUEST[\"REMOTE_ADDR\"] as shown below:\n\nNow that we know\
    \ how to find out who is visiting our site let's look at what else is in $_SERVER.\n\
    \nAll of this data can help you debug your PHP application as it gives you all\
    \ the information about where your application is running from. This can allow\
    \ you to quickly find out whether a problem is at your local machine or in the\
    \ server itself.\n\n# ***Advantages of using PHP $_SERVER***\n\n+   1. **Accessing\
    \ $_SERVER from an external file**\n+      When you want to access a specific\
    \ variable from an external file, you can do so by just adding the variable to\
    \ the local variables while executing your script. You need not specify its type\
