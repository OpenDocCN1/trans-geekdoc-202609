    # The UPDATE Statement


    The UPDATE statement is a control statement that updates the values of the specified
    columns in a table. It is similar to INSERT and DELETE statements, except that
    it does not actually insert or delete rows from the table. The UPDATE statement
    changes only what is contained in the specified columns for an individual row
    at a time.


    The UPDATE statement cannot be used to update the same column more than once within
    a single UPDATE statement. For example, you can use a WHERE clause to change the
    salary of all employees who earn less than $10,000 per year. The following statement
    is not legal:


    Once an expression is computed in an UPDATE statement, it cannot be redefined
    within the same UPDATE statement (through the use of SET or new expressions).


    The UPDATE statement can be executed under either of the following two circumstances:


    A single UPDATE statement can update multiple rows from a table. This is called
    a multi-row UPDATE statement. The number of rows in the table that this type of
    UPDATE statement affects can be as large as one million; however, there are some
    limitations.


    In this kind of UPDATE statement, the WHERE clause begins with the table selector
    and then consists of a selection of key columns from which individual rows are
    selected for updating. This selection is called a selection list.


    The first column in the selection list always is the column identifier (also called
    a table name or primary key) for the table being updated. The second and any subsequent
    columns in the selection list are referred to as referring columns; these specify
    individual rows to be selected.


    In a multi-row UPDATE statement, the SELECT statement is followed by an ORDER
    BY clause that specifies the sort order for all the rows to be updated. The UPDATE
    statement then contains an expression that is evaluated for each row in the table
    being updated. Each of these expressions is assigned to one of the referring columns
    specified in the SELECT list. If a row meets all these criteria, then its values
    are updated; otherwise, they are left unchanged. The value of the primary key
    column is always updated.


    Important: Each of the SELECT and ORDER BY clauses has an implicit ORDER BY on
    the entire table being updated so that sorting is based on the entire table''s
    order. For example, in a multi-row UPDATE statement that updates all columns sorted
    by the first name, you must use parentheses to explicitly force this ordering
    on each particular row to be updated.


