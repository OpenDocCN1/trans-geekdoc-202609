  \ 包含第 1 层函数的属性，即 `print` 函数的属性。`String str` 包含输入脚本中的遍历标记。例如，如果子字符串是“(print，”`str`\
  \ 将包含“print”。`Variable j` 初始化为零。当算法在遍历中遇到‘(`时，检查 `j` 的值。如果 `j` 等于 0，则 `string str`\
  \ 是函数名，因此将 `string str` 推入 `SPF` 并增加 `j`。如果 `j` 大于 1，则增加 `j`，并将 `string str` 推入\
  \ `attr[j]`。在 `attr [j]` 链表中遇到括号时存储的数据如“#func_name”类似于“#2print”，其中 '#' 是表示属性的符号，2\
  \ 是函数级别，“print”是属性值。当算法遇到‘，”时，意味着属性正在分离。`String str` 推入 `attr [j]` 链表。当算法遇到‘)’时，意味着函数级别正在降低。`j`\
  \ 的值减一。图 9 显示了在遍历脚本时 `j` 值的变化。当算法遍历整个脚本时，`attr [1` 链表的大小被推入 `SPF`。算法随后调用 `SPF create`\
