  \n[*] 通讯作者：`gupta.brij@gmail.com`\n\n# 第 15 章：教 Johnny 如何防御网络钓鱼攻击\n\n## 将自我效能角色整合到游戏应用中\n\
  \nNalin A.G. Arachchilage[¹] 和 Mumtaz Abdul Hameed[^(,))]*\n\n### 1. 引言\n\n2016\
  \ 年 3 月，希拉里·克林顿总统竞选主席 John Podesta 收到了一封主题为“*你的密码已被使用*”的网络钓鱼邮件（见图 1）。邮件问候 Podesta：“你好，John，”然后读道：“有人刚刚使用你的密码尝试登录你的\
  \ Google 账户 `john.podesta@gmail.com`。”随后，邮件提供了一个时间戳（3 月 19 日周六，8:34:30 UTC）以及一个位于乌克兰的\
  \ IP 地址（`134.249.139.239`），有人在那里使用了他的密码。邮件还声明：“Google 已阻止了此次登录尝试。”随后提供了一个链接，诱导他立即更改密码。`Bit.ly`\
  \ 提供网址缩短服务（即 Twitter 用户经常使用），这可以让用户更容易分享。因此，黑客创建了一个名为 `Fancy Bear` 的 `Bit.ly` 账号（属于一个俄罗斯黑客小组），以绕过网络浏览器钓鱼邮件过滤系统，确保攻击成功。遗憾的是，Podesta\
  \ 点击了链接并向黑客泄露了他的凭据。该黑客小组创建了与 `Fancy Bear` 控制域名关联的 `Bit.ly` 账号，但未能将账号设为私。因此，这表明“人类是最脆弱的环节”。\n\
  \n![images/fig15.jpg)\n**图 1 John Podesta 的邮件**\n\n网络钓鱼对计算机用户来说特别危险。它结合了社会工程（即人类欺诈的艺术）与技术手段（例如反钓鱼技术）以实现攻击成功。钓鱼旨在窃取敏感信息，如用户名、密码和网上银行详情。大众营销犯罪分子通过实施身份盗用来联系、索取并获取资金或其他价值物品。大众营销诈骗\
  \ (MMF) 是一种严重、复杂且往往有组织的犯罪，利用了大众通信（例如电子邮件、社交网络网站）。\n\n自动化工具（例如反钓鱼、防杀病毒和反间谍软件）已经开发并用于提醒用户注意欺诈邮件。然而，这些工具并非完全可靠；例如，即使是最好的反钓鱼工具也漏掉了超过\
  \ 20% 的网站，因为“人类”是安全中最脆弱的环节。完全避免终端用户是不可能的；例如，在个人电脑使用中，网络安全的一种缓解方法是对终端用户进行安全教育。教育研究人员和行业专家论述了良好的用户安全设计是有效的。\n\
  \n本研究探讨了如何将与用户知识相关的“自我效能”整合到反钓鱼教育游戏中的，以阻败网络钓鱼攻击？我们最初关注于识别人的“自我效能”如何增强他们的钓鱼威胁规避行为。根据文献，我们随后尝试识别影响（在本例中为概念性知识、程序性知识或两者的相互作用）的因素，通过他们的动机来增强人们的防范行为。根据文献，我们还将尝试识别概念性知识或程序性知识对计算机用户防御钓鱼攻击的自我效能是否具有积极影响。此外，本研究工作将程序性或概念性（或两者的相互作用效应）知识整合到反钓鱼教育游戏中，以更好地教育人们如何保护自己免受钓鱼攻击。我们相信这将无疑提高用户防御网络钓鱼的能力。\n\
  \n## 2. 相关工作\n\n\n\n\n\n# 教育游戏与模拟\n\n教育游戏和模拟已日益成为一种广泛接受的巨大且强大的教学工具，可能会引发一场“教学革命”[16,\
  \ 17, 18, 19]]。其主要原因是，基于游戏的教育和虚拟环境的使用使用户能够通过经验进行学习，同时引导他们通过批判性思维来解决问题[2, 20]]。严肃游戏（Serious\
  \ Games）被描述为“根据特定规则在计算机上进行的心理竞赛”。[21]] 根据 Zyda 对严肃游戏的定义，提出了以下主题分类：军事游戏、政府游戏、教育游戏、公司游戏、医疗游戏以及政治和宗教游戏。尽管如此，严肃游戏作为一种有效的教学媒介非常有用[22]]，因为它能够让用户以互动且具有吸引力的方式进行学习[23]]。文献中有大量的发表的研究描述了游戏在教育背景下的作用。Bellotti\
  \ 等人[24]]为高中设计了一款名为“SeaGame”的大型在线多人游戏（MMOG），旨在促进与海洋相关行为（如航海或海滩监控）的最佳实践。“SeaGame”的主要重点是将教育内容嵌入到一个有意义、同质且具有吸引力的整体游戏语境中，让玩家在享受乐趣的同时进行学习。作者们得出结论，这类游戏有助于人们改进其行为的最佳实践。\n\
  \n此外，基于游戏的教育在激励玩家改变行为方面进一步很有用。Gustafsson 和 Bang[25]]设计了一款名为“Power Agent”的泛在移动游戏，旨在教育青少年及其家庭减少家庭能源消耗。他们试图将家庭环境及其设备转变为一个用于用电使用实践经验的学习竞技场。结果表明，该游戏概念在吸引青少年及其家庭在游戏期间减少能源消耗方面更加高效。此外，严肃游戏是有效的，它们不仅可以改变人们的行为，还可以培养他们解决数学问题的逻辑思维。[26]]\
  \ 研究人员通过实证调查设计了“Wu’s Castle”，这是一款 2D（二维）角色扮演游戏，学生在其中培养了 `C++` 编码技能，如循环、数组、算法以及逻辑思维和问题解决能力。结果显示，“Wu’s\
  \ Castle”比传统的编程作业在学习如何解决数组和循环问题方面更有效。严肃游戏研究中最广认的事实之一是能够增强玩家对学习的动机，因为他们能够保持注意力并持续沉浸其中[2,\
  \ 27]]。教育游戏的其他有趣事实还有：\n\n- 提供玩家可以自由探索的沉浸式环境，并促进自主性学习[31, 32]]。\n- 带有进的即时反馈过程[33,\
  \ 29]]。\n- 与建构主义理论以及对学习的支持[28, 34]]。\n\n严肃游戏的设计是一把双刃剑。当它的力量被正确用于良好的目的时，它具有提高人类表现巨大潜力。然而，当它被用于破坏时，会对社会造成巨大威胁。因此，教育游戏的设计并非易事[35]]。基于教育能够在自然环境中嵌入学习的观点在文献中反复出现[36,\
  \ 2, 15, 10, 6, 27]]。\n\n许多教育游戏已被设计和开发以保护计算机用户并解决网络空间的安全问题[17]]，例如，某些教育游戏教授信息概念，而另一些则是纯粹的娱乐，没有信息保障的基础[66]]。然而，关于结合安全人文方面的虚拟世界参与的研究很少[10]]。\n\
  \n尽管有可用性专家声称用户教育和培训无效[10]]，但其他研究人员揭示，设计良好的用户教育可能是对抗网络攻击（如恶意威胁）的推荐方法[38, 14, 15,\
  \ 39, 40]]。与[41]]一致，[14]]以及其他研究人员认为，针对恶意威胁的现有安全教育对访问潜在恶意网站的终端用户提供的保护保护乎其道[15, 10,\
  \ 13]]。\n\n当前防钓鱼安全教育无效的另一个原因是，安全教育提供者假设用户热于规避风险，因此可能采取保护自己的行为。[14]]。他们声称，安全教育应该考虑用户行为的驱动因素，而不是仅仅警告用户危险。\n\
  \n\n\n\n文献表明，设计良好的以教育为中心的游戏对学习有所帮助，即使在没有辅助的情况下使用也是如此。\\[10\\]开发的“反钓鱼菲尔”（Anti-phishing\
  \ Phil）游戏研究结果证实，游戏在教育人们识别钓鱼和其他安全攻击方面，比其他教育方法（如阅读反钓鱼教程或阅读现有的在线培训材料）更有效。\\\\[2\\]开发了一个手机游戏原型，用于教人们如何防御钓鱼攻击。他们的手机游戏设计旨在通过增强保护自己免受钓鱼威胁的动机，提高用户的规避行为。研究结果显示，该设计的手机游戏在教人们如何防御钓鱼攻击方面了一定效果，参与者在后测评估中的钓鱼威胁规避行为有了显著提高。此外，研究发现表明，参与者的威胁感知、保护有效性、自我效能感、感知严重性和感知易感性因素对威胁规避行为有积极影响，而保护成本则有负面影响。\n\
  \n\\[42\\]开发了一种桌游，有助于增强用户对网络钓鱼诈骗的意识。他们的发现显示，在玩游戏后，参与者对钓鱼诈骗有了更好的理解，并学会了如何更好地保护自己。\\\
  [43\\]设计并评估了一个嵌入式培训电子邮件系统，教导人们在正常使用电子邮件期间保护自己免受钓鱼攻击的侵害。作者开展了实验室实验，对比了标准钓鱼安全通知与他们开发的两种嵌入式培训设计的有效性。他们发现，嵌入式培训比目前发送安全通知的实践更有效。\n\
  \n\\[44\\]评估了终端用户教育在区分钓鱼邮件与合法邮件方面的影响。他们对钓鱼教育进行了概述，针对情境感知攻击，并通过结合钓鱼 IQ 测试和课堂讨论引入了一种终端用户教育的新策略。该技术涉及向用户提供正规邮件和欺诈邮件，并要求他们从真实邮件中识别出钓鱼尝试。研究得出结论，用户在进行钓鱼\
  \ IQ 测试和课堂讨论后，能够正确识别钓鱼邮件。用户也承认了 IQ 测试和课堂讨论的用处。印第安纳大学的研究人员还对 1,700 名学生进行了类似研究，收集了学生经常访问的网站，并向其发送钓鱼信息或伪造他们的电子邮件地址\
  \ \\[45\\]。\n\nTseng 等人 \\[[[46\\]还根据网站内容开发了一种游戏来教用户了解钓鱼。作者提出了钓鱼攻击框架层次结构来描述钓鱼攻击技术的定型特征。框架模型的继承和实例化属性允许他们扩展原始钓鱼页面以增加游戏内容。最后，作者开发了一个反钓鱼教育性游戏，以评估所提框架层次结构的有效性。评估结果显示，大多数讲师和专家对该系统表示满意。\n\
  \n之前的研究表明，单靠技术不足以确保关键的 IT 安全问题。到目前为止，关于终端用户执行安全操作和防止用户遭受攻击的工作还较少，而这些对于应对钓鱼攻击至关重要\
  \ \\[2, 13, 3, 47–50, 23, 51\\]。许多讨论最终都止于这样一个结论：“如果我们能把用户从系统中移除就好了”，但由于无法完全消除用户（例如在家庭中使用），最好的安全方法是教育用户安全。之前的研究表明，设计良好的用户教育是有效的\
  \ \\[10, 15, 43, 54\\]。这可以是基于 Web 的培训、情境培训和嵌入式培训来实现。\n\n因此，本研究重点关注如何更好地教育人们以保护自己免受钓鱼攻击。\n\
  \n\n\n\n游戏故事是基于一个大鱼和小鱼角色的场景创作的，它们都生活在一个大池塘里。玩家扮演小鱼的角色，它想通过吃虫子来变成大鱼。虫子在游戏设计中是随机生成的。然而，小鱼必须非常警惕“钓鱼者”（phishers），因为他们可能会用虚假的虫子欺骗他。这代表了通过培养威胁感知来应对钓鱼攻击。另一个角色是大鱼，它是池塘里一条经验丰富且成熟的鱼。提出的移动游戏设计原型包含两个部分：教授钓鱼\
  \ URL 和钓鱼邮件的概念。所提出的游戏设计教了人们如何区分合法的 URL（统一资源定位符）与欺诈性 URL。\n\n## 4.2 故事分镜（Storyboarding）\n\
  \n游戏场景侧重于设计一种教育性游戏，让用户能够防御钓鱼攻击。因此，本研究尝试基于游戏场景设计一个故事分镜，作为游戏的第一步。\n\n故事分镜是叙事的简短图形化表示，可用于各种任务\
  \ [58]。创建故事分镜的练习源于特定社区的长久历史，例如电影开发、电视节目片段和卡通动画社区 [59]。故事分镜是人机交互（HCI）中的一种常用技术，用于展示系统界面和使用场景\
  \ [58]。视觉化游戏的最佳方法之一就是进行“分镜设计”，创建一系列显示不同场景和目标的图画 [59]。故事分镜草图在本研究中用于进行头脑风暴，并在纸上记录游戏的大致。故事是丰富的，对设定、人物、动机、活动、目标和价值观的详细描述以连贯且因果连接的方式呈现。\n\
  \n随着交互式计算从桌面转向移动设备，故事分镜不仅应该展示与特定界面设计背景相关的细节，还应该展示用户在使用系统期间的动机和情感的高级概念 [58]。这是因为缺乏用户动机会导致系统使用时的满意度降低。这种情况会导致用户无法投入到系统中，也直接导致系统无法产生预期的输出水平。故事分镜可以在设计新技术时说明应用程序功能如何运作的视觉化场景。设计者创建一个信息设计场景，指定任务对象和动作的表示方式，这可能帮助终端用户感知、解释并理解提出的功能。交互设计场景规定了用户将如何与系统交互以执行新活动。因此，在本研究中，创建故事的过程可以使玩家的注意力集中到产生有效解决方案的因素上。\n\
  \n基于故事的设计方法在两个特定方面非常有益 [60]。首先，使用案例描述对于理解技术如何重塑用户活动至关重要。其次，故事可以在系统构建和确定其影响之前创建。因此，事实证明设计人员经常使用故事分镜来将信息的描绘视觉化。\n\
  \n目前有许多研究利用故事分镜工具，如 `Silk` [61]、`DENIM` [62] 和 `DEMAIS` [42] 来创建交互场景，以传递终端用户如何与设想的系统交互。然而，设计人员在对自己的设计方案进行头脑风暴时，使用墨水笔或铅笔和纸通过快速草图来捕捉他们的想法。设计者通过创建一个信息设计场景，指定任务对象和动作的表示方式，帮助用户感知、解释并理解功能。使用\
  \ `PowerPoint` 或 `Paint` 等工具，或者更高级的图形工具如 `Photoshop` 和 `Illustrator`。此外，纸质原型是低保真原型。这种原型设计可以是高保真或低保真的。高保真原型对用户来说看起来更真实。因此，用户可能更愿意评价界面。这种快速纸质原型对于设计故事分镜非常有效\
  \ [63]。最后，快速纸质原型被认为是设计故事的有效工具。因此，最初使用墨水笔、便利贴和纸绘制了故事分镜，所示图 3 [58]。\n\n![Image](img/fig15_3.jpg)\n\
  \n**图 3**：游戏故事分镜设计。\n\n### 4.3 机制\n\n有趣的故事是保持用户吸引力的极佳药物 [64]。叙事技巧被用于吸引注意力，同时也放大了现实中的趣味。故事可以基于个人经验或著名传说，也可以旨在建立关联内容单元、激励或强化的故事情。\n\
  \n游戏基于一个大鱼和小鱼角色的场景，它们生活在一个大池塘里。故事越合适、真实且内容丰富，越能触发用户。游戏的主角是小鱼，它想通过吃虫子来变成大鱼。玩家扮演小鱼的角色。然而，它必须警惕那些试图用虚假虫子欺骗它的钓鱼者。这代表了通过培养威胁感知来应对钓鱼攻击。每个虫子都与一个网址关联，统一资源定位符（URL）以对话框的形式出现。小鱼的任务是在结束前吃掉所有与合法网址关联的真实虫子，并拒绝与虚假网址关联的虚假虫子。这试图开发游戏设计中钓鱼威胁的严重性和易感性。\n\
  \n另一个角色是小鱼的老师，它是池塘里一条成熟且丰富的鱼。如果与 URL 关联的虫子可疑，且难以识别，小鱼可以去找他的老师并寻求帮助。老师可以通过提供一些识别坏虫子的技巧来帮助他。例如，“开头带有数字的网址通常是诈骗”，或“公司名称后面带有连字符的\
  \ URL 通常是诈骗”。\n\n\n\n\n游戏原型设计总共有 10 个 URL，用于随机显示虫子，其中包括五条好虫（与合法 URL 关联）和五条假虫（与钓鱼\
  \ URL 关联）。如果用户通过观察 URL 正确识别出所有好虫并避开所有假虫，他将获得 10 分（在这种情况下，每次尝试得 1 分）。如果用户错误识别了好虫或假虫，每次尝试将从完成游戏所需的剩余总生命中减少一次。如果用户向大鱼寻求帮助（在这种情况下是小鱼的老师），每次尝试将从完成游戏的剩余总时间（总计\
  \ 600 秒）中减少 100 秒。\n\n### 4.4 游戏设计\n\n该游戏是基于上述分镜叙故事机制（图 3）设计的。每条虫子都与一个 URL 关联，并以对话框的形式出现。小鱼的任务是在时间结束前吃掉所有与合法\
  \ URL 关联的真实虫，同时防止吃掉与欺诈 URL 关联的假虫。如果钓鱼 URL 被正确识别，游戏玩家将被提示识别 URL 的哪个部分指示了钓鱼（图 4）。这决定了游戏玩家是否理解了钓鱼\
  \ URL 的概念性知识。此时，游戏玩家得分将鼓励他/她继续游戏。然而，如果钓鱼 URL 被错误识别，游戏玩家将获得实时反馈，通过恰当的示例说明其决策错误的原因，例如“合法网站的\
  \ URL 开头通常没有数字”或 `http://187.52.91.111/.www.hsbc.co.uk`。因此，这试图在游戏设计的语境下教授玩家关于钓鱼\
  \ URL 的概念性知识。\n\n此外，人们可以认为，向玩家展示不同类型的 URL 以让其识别是钓鱼的还是合法的（即程序性知识），然后要求他们识别 URL 的哪个部分是钓鱼的（即概念性知识），将对其自我效能产生积极影响，从而增强对钓鱼威胁回避。\n\
  \n提出的游戏设计分不同的级别呈现，例如初级、中级和高级。当玩家从初级移动到高级时，URL 组合的复杂性（即程序性知识）剧增，同时完成游戏的时间周期大大缩短。钓鱼预防的程序性知识将在游戏设计中解决，因为\
  \ URL 的复杂性通过设计呈现给玩家。整体游戏设计侧重于设计一种创新的、游戏化的方法，将概念性和程序性知识效应整合到游戏玩家（即计算机用户）阻止钓鱼攻击的自我效能中。\n\
  \n请识别 URL 的哪个部分指示了钓鱼？\n\n![Image](img/fig15_4.jpg)\n\n**图 4：** 游戏玩家被提示识别 URL 的哪个部分指示了钓鱼。\n\
  \n如果与 URL 关联的虫子可疑，或者很难识别/猜测，小鱼（在此指游戏玩家）可以去大鱼那里寻求帮助。大鱼将提供一些如何识别与欺诈 URL 关联的坏虫的提示。例如，“URL\
  \ 中公司名称后跟着连字符通常是骗局”或“开头带有数字的网站地址通常是骗局”。这再次有助于培养玩家对抗钓鱼攻击的“自我效能”。每当小鱼向大鱼寻求某些帮助时，剩余时间将减少一定数量（例如\
  \ 100 秒），作为保护措施的代价。\n\n## 5 结论与未来工作\n\n本研究侧重于设计一种创新的游戏化应用程序，将概念性和程序性知识效应整合到游戏玩家（即计算机用户）对抗钓鱼攻击的自我效能中。研究探讨了如何将“自我效能”整合到教导人们阻止钓鱼攻击的反钓鱼教育游戏工具中。游戏设计教授了如何区分合法\
  \ URL（统一资源定位符）和欺诈 URL。\n\n\n\n\n- Almomani, A., Gupta, B.B., Wan, T.C., Altaher,\
