  \ Waleed Alomoush 和 Kamal Alieyan\n\nMohammad Alauthman, Ammar Almomani, Mohammed\
  \ Alweshah, Waleed Alomoush 和 Kamal Alieyan\n\n钓鱼邮件是指旨在欺骗他人并诱使其泄露机密信息（如密码、用户名和信用卡信息）的欺诈邮件。此类信息可能与银行账户有关。这样做是为了获取非法财务收益。由于此类邮件，本研究旨在识别并讨论用于对抗和检测钓鱼邮件的机器学习方法。本章旨在识别并讨论用于对抗和检测钓鱼邮件的机器学习方法。这些方法用于过滤钓鱼攻击。研究人员还对几种钓鱼邮件过滤方法进行了评估；并对它们进行了比较。这种比较是从优点和局限性方面进行的。因此，本研究旨在加深人们对钓鱼攻击相关问题的理解。它旨在提高人们对用于对抗和过滤钓鱼邮件方法的意识。\n\
  \n### 1. 引言\n\n钓鱼邮件是指旨在欺骗他人并诱使其泄露机密信息（如密码、用户名和信用卡信息）的欺诈邮件。此类信息可能与银行账户有关。这样做是为了获取非法财务收益。由于此类邮件，本研究旨在识别并讨论用于对抗和检测钓鱼邮件的机器学习方法。本章旨在识别并讨论用于对抗和检测钓鱼邮件的机器学习方法。这些方法用于过滤钓鱼攻击。研究人员还对几种钓鱼邮件过滤方法进行了评估；并对它们进行了比较。这种比较是从优点和局限性方面进行的。因此，本研究旨在加深人们对钓鱼攻击相关问题的理解。它旨在提高人们对用于对抗和过滤钓鱼邮件方法的意识。\n\
  \n钓鱼邮件是指旨在欺骗他人并诱使其泄露机密信息（如密码、用户名和信用卡信息）的欺诈邮件。此类信息可能与银行账户有关。这样做是为了获取非法财务收益。由于此类邮件，本研究旨在识别并讨论用于对抗和检测钓鱼邮件的机器学习方法。本章旨在识别并讨论用于对抗和检测钓鱼邮件的机器学习方法。这些方法用于过滤钓鱼攻击。研究人员还对几种钓鱼邮件过滤方法进行了评估；并对它们进行了比较。这种比较是从优点和局限性方面进行的。因此，本研究旨在加深人们对钓鱼攻击相关问题的理解。它旨在提高人们对用于对抗和过滤钓鱼邮件方法的意识。\n\
  \n## 2. 钓鱼邮件的背景与概述\n\n通过本节，研究人员识别了钓鱼攻击的类型、生命周期和分析。有必要关注邮件。\n\n\n\n\n\n通过在线模式，数据逐条到达。在每条数据到达时，会进行本地学习；而在离线模式下，所有数据集均可用于全局学习\
  \ [8, 9]。在线模式旨在与互联网连接协同工作。分类过程中的错误水平随时间推移而增加，特别是在处理未知的零日网络钓鱼邮件时 [10]。\n\n### 2.1\
  \ 钓鱼攻击\n\n钓鱼攻击可以被视为垃圾邮件的一种，采用了两种技术——一种是欺骗钓鱼技术，另一种是基于恶意软件的钓鱼技术。钓鱼邮件是指作为欺诈计划部分的电子邮件诈骗\
  \ [11]。通过欺骗技术，钓鱼者通常伪装成可信的实体或个人（例如银行官员），并通过电子邮件要求目标受害者打开嵌入的链接。通过该链接，钓鱼者试图将目标受害者重定向到一个虚假网站，在虚假网站中，钓鱼者要求用户提供与银行账户或信用卡相关的敏感信息。这使得钓鱼者能够非法获取利益。\n\
  \n通过使用基于恶意软件的钓鱼技术，钓鱼者通常伪装成可信的实体或个人（例如银行官员），并通过电子邮件要求目标受害者打开包含恶意软件或恶意代码的嵌入链接。通过此类恶意软件或代码，钓鱼者可以控制受害系统并直接获取敏感数据。这是通过利用目标系统中存在的漏洞实现的。有时，钓鱼者会尝试将用户误导至由代理监控的虚假或合法网站\
  \ [16]。通过本研究，研究人员重点关注欺骗性钓鱼，因为它是常见的钓鱼技术之一。图 1 展示了钓鱼攻击的形式 [17]。\n\n\n\n### 2.2 钓鱼邮件的生命周期\n\
  \n代表钓鱼邮件生命周期的阶段在图 2 所示。通过识别这些阶段，可以理解钓鱼攻击发生的方式。很明显，钓鱼攻击始于有人发送包含链接的欺诈邮件。这一阶段类似于钓鱼过程，因为犯罪分子在此阶段向许多人发送邮件，希望找到一个脆弱的受害者，该受害者可能会访问附带链接。需要注意的是，钓鱼邮件通常看起来像合法的邮件。犯罪分子伪装成银行官员或公司员工，并通常提供合法公司/银行的名称和地址。至于附带链接，它看起来是合法的。这一切都是钓鱼者提供的，旨在诱骗人们“上钩”（即打开链接）\
  \ [12]。\n\n在初，钓鱼者曾伪装成知名网站的代表。2004 年 3 月 9 日，报道了一次钓鱼攻击。钓鱼者伪装成 eBay 网站的代表。钓鱼者的邮件如图\
  \ 3 所示 [18]。钓鱼者声称邮件接收者的信息无效。邮件接收者被要求更新其信息。\n\n钓鱼者在邮件中提供了一个链接，进入一个看起来像 eBay 的虚假网页。该虚假网页要求用户提供联系信息和其社会安全信息。他还被要求提供\
  \ eBay 用户名和密码。\n\n该邮件看起来是由 eBay 发送的合法邮件，通过发送者的邮件地址（[S-Harbor@eBay.com](http://S-Harbor@eBay.com)）表示。网站看起来是合法的。例如，网页地址包含\
  \ (`http`)。用户发现虚假网页的 IP 地址为 `210.93.131.250`，属于韩国。因此，这个虚假网站与 eBay 的实际网站之间没有关系。图\
  \ 4 展示了该虚假网页的截图 [18]。然而，存在不同的方法用于将邮件分类为合法和钓鱼邮件，使使用户能够检测邮件。研究人员识别出这些方法如下。\n\n\n\n\
  \n**图 3:** 邮件示例（相关的钓鱼者伪装成 eBay 网站代表） [13]。\n\n\n**图 4:** eBay 虚假页面截图 [13]。\n\n##\
  \ 2.3 钓鱼邮件分类方法（即过滤方法）²\n\n过滤邮件是将邮件自动分类为合法和钓鱼邮件的过程。这一过程通过钓鱼过滤器执行，对邮件进行分析和分类。可以单独处理邮件以检测钓鱼的存在。这也可以通过基于学习的过滤器来实现，通过分析带有标注的邮件集\
  \ [19]。钓鱼邮件由两个部分组成：正文和邮件头。邮件头包含多个字段（例如 `from`、`to` 等）；在钓鱼邮件中，邮件头后面跟着正文。邮件头明确提供了关于主题、接收者和发送者的路由数据。至于正文，它提供了目标邮件的内容。图\
  \ 5 展示了邮件的结构。对于图 6，它展示了邮件结构的示例，并用于特征提取相关的目的 [12]。\n\n\n**图 5:** 邮件结构分类 [14]。\n\n\
  \n**图 6:** 邮件结构示例（用于特征提取相关的目的） [14]。\n\n为了识别预处理阶段的步骤，必须识别邮件格式。此外，理解邮件过滤技术需要关于邮件格式和结构的运行数据。邮件结构定义在\
  \ `RFC 5322` 中 [19]。就像古代通信邮件一样，有一个信封。然而，用户通常看不到信封，因为邮件系统在将邮件投递给用户之前会丢弃信封。图 7 展示了信封的示例。额外的信封接收者通过额外的\
  \ `RCPT` 定义。\n\n\n**图 7:** 邮件信封示例。\n\n\n**图 8:** 邮件源代码示例。\n\nHELO: 客户端向 SMTP 服务器发送\
  \ HELO 命令以标识其自身身份并启动 SMTP 会话。\n\n\n\n\n从上述源代码中，系统将提取 21 个二进制特征。邮件通常由两个主要元素组成——正文和头部。正文包含消息文本和任何额外附件。图\
  \ 8 展示了一封关联学位邮件的示例。它与正文和头部一起呈现。至于邮件源代码，它包含以下内容：\n\n1. `Delivered-To`：指消息应递送到的电子邮件地址。\n\
  2. `Received`：一个列表，包含了邮件为了到达目标邮件地址而经过的所有服务器。\n3. `Return-Path`：发送非递送成功执执的电子邮件地址。\n\
  4. `Received-SPF`：发送者策略框架 (SPF) 域名的验证结果。\n5. `Message-ID`：电子消息的唯一标识符。\n6. `The Content`：头部类型，旨在指定数据的性质。\n\
  7. `X-originating-IP`：一种用于识别连接到邮件服务 HTTP 前端的客户端源 IP 地址的行业标准。\n8. `From`：由一个电子邮件地址和一个用于识别发送者的短语组成。\n\
  9. `To`：由一个电子邮件地址和一个短语组成。它们由发送者确定并用于识别接收者。\n10. `Subject`：消息主题，由发送者指定。\n11. `Date`：由发送者的邮件程序确定，包含发送者系统的时区。\n\
  12. `Content-Disposition`：包含与附件相关的数据。\n\n### 2.4 基于学习的垃圾过滤方法的特征\n\n钓鱼者使用的方法之一是寻找受害者并引导他们访问虚假网站。通过此类网站，受害者被要求披露其机密信息。然而，存在基于学习的垃圾邮件过滤方法，它们具有若干特征。这些特征被分为三类——隐含主题模型特征、基础特征和动态马尔可夫链特征\
  \ [12]。\n### 2.4.1 基础特征\n\n基础特征直接从关联学位邮件中提取，分类如下：\n\n* 结构特征从关联学位超文本标记语言树中提取，该树解释了邮件正文的结构，例如解释消息格式多样性的\
  \ `MIME` 常见。这些特征体现了独特且复合的正文组件以及大量的其他正文组件。\n* 链接特征代表嵌入关联学位邮件中完全不同的通用资源定位符链接选项，例如带有信息处理的链接数量、欺骗性链接的多样性（用户可见的\
  \ URL）、图片后链接的多样性、链接中点的多样性等。\n* 组件特征代表在关联学位邮件中使用的网络技术类型，如超文本标记语言、脚本、显式 `JavaScript`\
  \ 以及其他形式。\n* 垃圾邮件过滤器特征通常有两个布尔值（0, 1）。大多数研究人员使用 Spam Assassin (SA) 工具 [21]，该具有具有\
  \ 50 个选项来判断关联学位邮件是否被评估为垃圾邮件。默认情况下，如果消息得分超过 5.0，则视为垃圾邮件 [22]。\n* 词列表特征是可能描述钓鱼邮件的词汇表，无论邮件中是否出现这些词，都可以布尔特征进行分类。词根如\
  \ `account`、`update`、`confirm`、`verifiy`、`secure`、`log`、`click` 等 [12]。\n\n### 2.4.2\
  \ 隐含主题模型特征\n\n这些特征是不可感知的“隐含”特征，使用了邮件中平方面积分布的词簇。这些预期在钓鱼邮件中通常会看到 `click` 和 `account`\
  \ 词。此外，在传统的财务邮件中，可以看到 `market`、`prices` 和 `plan` 等词 [12, 23, 24]。\n\n### 2.4.3 动态马尔可夫链特征\n\
  \n这里采用了基于文本的特征并支持词袋，为每类消息的“语言”，从而捕捉邮件属于特定类别的概率。这些邮件被生成作为知识分析的基础。对于替换消息，这些选项计算其属于各种类别（例如钓鱼邮件或正常邮件类）的概率\
  \ [12]。\n\n### 2.5 监督学习方法与无监督方法\n\n在机器学习算法中，数据集的每个实例都通过同一组特征进行识别，这些特征可以是连续或分类的。如果实例带有标签（即相应的正确输出），则该学习方案被称为“监督”。监督学习公式分析教学知识并产生一个推理器。该推理器应该对任何有效输入进行预测。因此，学习公式应该从教学知识中泛化。此类算法可能包括\
  \ `NN(MLP)` 和 `SVM` 算法 [15]。\n\n至于无监督学习，它体现在发现未标记数据背后的结构中，因为提供给学习者的示例没有标签。没有可用于评估潜在解决方案的奖励信号或误差。这种信号的缺失区分了监督学习与无监督学习以及通用学习，例如聚类技术，如\
  \ `K-means` 聚类算法和 `ECM` 算法 [15]。\n\n混合（监督/无监督）学习模型结合了监督学习和无监督学习方法的原理和元素 [16]。\n\n\
  ## 3 应对钓鱼邮件攻击的方法\n\n已经开发了多种方法来攻击。五个防御区域根据它们在攻击流程中的位置（图 9）进行了分类 [7]。本研究的研究人员提出了 `PDENFF`，它是一种服务器端过滤器和分类器（编号\
  \ 5）。数据流中还有其他元素，例如 `简单邮件传输协议 (SMTP)` 和 `IMAP` 服务器协议，它们被认为是跨网络协议 (IP) 邮件传输的标准。这些保护方法旨在应对钓鱼攻击。\n\
  \n### 3.1 网络级保护\n\n\n\n\n\n实施此措施是为了防止恶意地址或域名传播进入网络，从而使网站管理员能够拦截由这些系统发送的消息。此类消息通常是垃圾邮件或网络钓鱼邮件。域名系统黑名单\
  \ 17 由网络服务提供商（ISP）使用，通过识别流量进行更新和生成。这种方法的本质是被动的。网络钓鱼者应通过在网络层面控制合法用户计算机的无尽动态恶意地址 18\
  \ 来克服绕过这种保护。Snort 中存在的规则会不断更新以维持保护。一位研究人员针对 19 对四种算法在性能方面进行了比较。这项比较是为了通过收集整整一周的数据来探索基于\
  \ DNS 投毒的攻击。他们发现，“k-最近邻”公式在比较中表现出最佳性能。其误报率为 (0.7)%，真阳性率为 (99.4)%。\n\n\n### 3.2 认证\n\
  \n基于认证的方法用于过滤电子邮件，设计用于识别收到的电子邮件消息是否由合法路径发送，因为这可以证明该名称未被网络钓鱼者伪造。后者方法增加了通过电子邮件通信的安全性。用户级认证被秘密地作为凭据使用。然而，正如不断增加的网络钓鱼攻击所证明的，秘密认证是可以被破解的。域级认证实施在供应商之间（例如，从一台邮件服务器到另一台邮件服务器）。微软提出了一种名为\
  \ `Sender ID` 的替代技术 20。它用于域级认证（图 10）。Yahoo 开发了一项名为 DomainKey 的相同技术 21。然而，为了实现有效的域级认证，供应商（发送者和接收者）必须使用相同的技术\
  \ 11。\n\n电子邮件认证中还实施了其他技术，通过 `digital signature`（数字签名）和 `secret hashing`（秘密哈希）对名称利用产生\
  \ `hash`（一种为了支持消息内容而计算的代码）。机构会建立一种政策，使所有与客户进行的高价值电子邮件通信都使用经过认证的非公有密钥进行数字签名。在接收电子邮件时，接收者应验证电子邮件的合法性。网络钓鱼者不太可能在虚假邮件上产生合法的签名。`PGP`\
  \ 和 `S/MIME` 是数字签名技术的示例。许多作者建议使用密钥分发和数字签名检测钓鱼邮件，但今天大多数用户并不使用电子邮件认证 11。\n\n\n一些银行（例如奥地利银行）使用用户交易认证码\
  \ (`TANs`）来检测网络钓鱼邮件。这些数字通过 `SMS` 消息发送给用户 22，尽管这种方法降低了被网络钓鱼者攻击的风险。但这种方法仍然受到中间人攻击的威胁。移动端\
  \ `TAN` 需要成本、时间和大量的基础设施。因此，`TAN` 不被认为是评估与通信相关风险的可接受方式。\n\n为了克服认证过滤器，网络钓鱼者应向计算机程序（例如\
  \ `Froogle`）发送一个成本更低的建议。该建议将引导流量流向其网站。计算机程序 23 无法管理此类转账或支付交易。因此，需要一种过滤网站和电子邮件内容的替代方法。\n\
  \n### 3.3 客户端工具\n\n处理客户端属性的工具包含了用户配置过滤器和基于浏览器的工具。`SpoofGuard` 24、`NetCraft` 25（图\
  \ 11）、`eBay toolbar` 26、`Calling ID` 27、`Cloud Mark` 28 和 `phishing filter` 29 是许多客户端属性工具。它们通过直接侦测“Web\
  \ 浏览器”来检查钓鱼和攻击。其他技术在客户端属性工具中额外提供了解决方案，包含了域名检查、算法、URL 检查、页面内容和社区输入。这些经过设计的工具会通过窗口警告用户。它展示了\
  \ `NetCraft`——一种客户端属性工具 25。\n\n\n\n\n\n| 白名单 | 仅接受合法邮件 | 误报率高 | IE, Mozilla Firefox\
  \ 浏览器 [37, 38]] |\n| 黑名单 | 针对已知钓鱼网站具有智能性 | 漏报率高 | IE, Mozilla Firefox 浏览器 [37, 38]]\
  \ |\n\n## 3.4 用户教育\n\n支持的社会响应方法取决于钓鱼攻击发起者的意识和教育程度 [39–43]。下文提到，用户教育技术中主要有三种方法：\n\
  \n`第一种方法`提供有关钓鱼攻击相关风险的在线信息。它还提供了避开此类攻击的方法。这些材料由政府、商业平台非营利组织（如 `eBay`、`Amazon` 和\
  \ `Bank of America`）以及企业打印，如图图 12 所示。\n\n`第二种方法`指的是在线培训和测试，并对用户识别钓鱼网站和邮件的能力，例如 `Phil\
  \ Game` [44]]。开发了一种来自 `Kumaraguru` [58]] 的知名方案。它体现了培训风格，使用户能够检测出钓鱼邮件。通过这种培训，用户会收到通知，告知他们钓鱼邮件的存在。主要的培训系统将对威胁性文本或图形提供警告。第二种培训使用漫画格式来传输类似的信息。作者们共同规划了一种基于游戏的方法，指导用户如何关注钓鱼网站和邮件。他们在一个不同年龄段的用户群体中测试了这种方法，发现这种方法有助于提高有关钓鱼攻击的数据范围。\n\
  \n\n\n## 3.5 服务器端过滤器和分类器\n\n支持的基于内容的过滤方法基于内容。这是因为在对抗“零日”攻击时，内容分析是最佳选择。因此，大多数研究人员旨在对抗此类攻击\
  \ [5]]。这种方法依赖于关联提取的钓鱼邮件选项组，通过适配为应用数学分类器并在机器学习算法上进行训练。这样做是为了区分合法邮件和钓鱼邮件。随后，将分类器用于关联邮件流，以预测最近收到的邮件类别。通常，过滤钓鱼邮件是一项按照列所示的方式操作的关联应用\
  \ [12, 45]]。\n\n$C_{phishing\\\\,, email}\\\\, F\\left( {e,\\theta} \\right) = C_{ham\\\
  \\,, email},\\\\left\\{ \\begin{matrix} {\\\\text{if}\\\\,\\\\text{the}\\\\,\\\\\
  text{email}\\\\, e\\\\,\\\\,\\\\text{is}\\\\,\\\\text{considered}\\\\,\\\\text{phishing}\\\
  \\,\\\\text{email}} \\\\\\\\ {\\\\text{if}\\\\,\\\\text{the}\\\\,\\\\text{email}\\\
  \\, e\\\\,\\\\,\\\\text{is}\\\\,\\\\text{considered}\\\\,\\\\text{phishing}\\\\\
  ,\\\\text{email}} \\endend\n\n其中 `e` 指稍后将分类的邮件。对于 `θ`，它指的是参数向量，`C phishing email`\
  \ 和 `C ham email` 是分配给邮件消息的标签。\n\n大多数钓鱼邮件基于内容的过滤方法基于机器学习分类算法。对于基于学习的技术，参数向量 `θ`\
  \ 是在预定义数据集上对分类器进行培训的结果。`θ = ⊖(E), E = {(e[1], y[1]), (e[2],y[2]), …(e[n], y[n])},\
  \ y[i] ∈ {C[phishing email], C[ham email]*}`，其中\n\n`e[1], e[2] … e[n]` 指早期收集的邮件消息。`y[1],\
  \ y[2] … y[n]` 指匹配的标签。对于 `⊖`，它指的是训练函数 [14]]。\n\n在此期间，基于机器学习技术的某些过滤器和分类器被分为五个子部分。通常，每个人使用类似的技术并继承相似的方案，但存在某些差异。\n\
  \n### 3.5.1 基于词袋模型的方法\n\n这种方法论可以是钓鱼邮件过滤器，它将计算机文件视为无形式的词集合，这些词应用于部分或整个邮件消息。它基于机器学习分类算法\
  \ [14, 46]]。为了清楚起见，假设我们类型：`phishing email` 和 `ham email`。然后，假设带有相应标签的邮件消息：`phishing\
  \ email` 或 `ham email`。\n\n$W_{xy} = TF\\_{x\\\\overset{}{y}}\\\\, Log\\\\, x\\\\\
  frac{S}{DFi}$\n\n\n\n\n\n\n\n\n\n其中 `W[xy]` 是 `y[th]` 文档（邮件）中 `x[th]` 个单词的权重，`TF[xy]`\
  \ 是 `x[th]` 个单词（w）在 `y[th]` 文档（邮件）中的出现范围。`DF[x]` 是 `i[th]` 个单词（w）发生时邮件消息的覆盖范围，而\
  \ `S`（如上所述）是教练数据集中的消息总范围。词袋模型（Bag-of-Words model）具有若干局限性。它被强制要求庞大的选项范围，消耗内存和时间，并且很大程度上依赖监督学习公式工作。此外，它对于“零日”攻击并不有效\
  \ \\[20\\]。\n\n### 3.5.2 多分类器算法\n\n这些方法通常依赖于分类器集合之间的比较。目前，许多分析使用了新的分类器算法，如随机森林（RFs）。随机森林是合并多个树预测器的分类器，特别是当每棵树都取决于逐个采样随机向量的值时，并且可以处理信息集中海量的变量。另一种算法回归（LR）是许多领域用于二分类信息预测的最广泛应用的数学模型之一。这归功于它的简单性。神经网络（NNet）分类器容纳三层（输入层、隐藏层和输出层），通过对流行的缺陷的输入和输出对系统进行教练来获取所需信息。网络不断精炼，直到结果达到接受的准确率水平，如图\
  \ 15 所示。神经网络的强大源于隐藏植被细胞层的非线性。非线性对于网络学习高级映射至关重要。`Sigmoid` 操作是神经网络中常用的操作 \\[50\\]。\n\
  \n\n\nAbu-Nimeh \\[50\\] 针对钓鱼邮件预测的机器学习技术比较了六种分类器，即加性回归树（BART）、LR \\[53\\\\] SVM、RF、分类回归树（CART）和\
  \ NNet。他使用了 43 个特征对信息集中的六种分类器进行教练和测试。然而，结果表明，没有适用于钓鱼邮件预测的常规分类器，例如，如果某些分类器的假阳性（FP）水平较低，它们会有很高的假阴性（FN）或漏报率（LR），其\
  \ FP 为 4%，那么大量的 FN 就会达到 17%。\n\n### 3.5.3 基于模型的分类器特征\n\n这些方法构建完整的模型，通过多种协调算法和分类器来产生新选项，以提供最终结果\
  \ \\[54\\]。下面是若干方法。\n\n`PHONEY`：Chandrasekaran \\[55\\] 将模拟用户响应投射为一种独特的方法。该方法检测钓鱼邮件攻击和模拟真实用户的虚假响应，从根本上反转了受害者和敌人的特质。PHONEY\
  \ 技术在八个月时间内对少于 20 封完全不同的钓鱼邮件进行了测试和评估。结果发现收集到的信息太少，不足以应对像钓鱼邮件这样巨大的负面影响。这种方法需要时间来反转受害者和钓鱼攻击者的特征，如图\
  \ 16 所示。\n\n作者在相同的数据集上获得了比 Filch 技术更高的结果，并测试了指定主题的有效性。此外，该模型是在广告 ISP 的一个极其真实的环境中开发的\
  \ \\[77]\\]。然而，该方法选择了海量多样化的选项（约 81 个）以及它的多种分类算法。这意味着在分析方法中时间很长，并且在分析方法内部，大量的动态马尔可夫链承受着高内存需求。\n\
  \n\n\n\n\n### 3.5.4 钓鱼邮件聚类\n\n钓鱼邮件聚类是根据相似性对分类信息进行塑造的方法。它通常是一种无监督机器学习算法规则。这类的机器学习技术依赖于通过在线或离线模式过滤支持聚类邮件的钓鱼邮件。最常用的聚类技术之一是\
  \ `k`-means 聚类。`K`-means 聚类是一种离线且无监督的算法规则，它从关键中心 `k` 开始，因为它是假设的中心。然后过程继续每个邮件对象到中心的间隔\
  \ \\[57\\]。下面是与该方法相关的方法。\n\n### 3.5.5 多层系统\n\n这些方法基于结合工作的不同分类器算法来增强结果。钓鱼邮件的分层技术是方法中最有效的安排。在这种技术中，钓鱼邮件选项以极其有序的方式提取并分类，并将输出发送到选择分类器，如图\
  \ 18 所示，其中 `c1`、`c2` 和 `c3` 是三层中的分类器。如果消息被任何一层分类错误，第三层可以在方法内创建调用。最有效的结果来自 `c1 (SVM)`、`c2`\
  \ (AdaBoost) \\[58\\\\] 和 `c3` (朴素贝叶) \\[59\\\\] 自适应算法规则。三层的典型准确率为 97%。然而，该方法的特点是处理时间长，研究质量需要几个阶段。此外，信息集的第三仍然被分类错误\
  \ \\[12\\]。\n\nRamanathan 投射的 PhishGNET \\[11\\\\] 可以是一种利用系统支持的语言处理过程和三层算法机器学习技术来发现钓鱼攻击的多层方法。这些算法如下：概率潜在语义分析（PLSA），用于创建主题模型；AdaBoost，用于创建强分类器；协同教练（Co-coaching），用于从标记和未标记示例中创建分类器。对于这种多层方法，Ramanathan\
  \ 得到了 97.7% 的结果。然而，该方法使用了 47 个复杂的特征，需要关键处理并消耗额外的内存和计算时间。因此，该方法在现实应用中并不有效。\n\n\n\n\
  ### 3.5.6 演化连接系统 (ECOS)\n\n\n\n\n\n演化连接系统（Evolving Connectionist System）是一种通过知识发现简化演化过程的连接主义架构。它可以是一个神经网络，或是一组持续运行并通过与环境以及与其他系统的持续关系来改变其结构和功能的网络。该系统类似于传统的专家系统，使用固定数量的规则来开发人工智能（AI）[61]。它在动态规则方面具有活性，可以在在线或离线模式下工作，并与不断的环境进行动态交互。这种系统可以解决许多现实问题的复杂性和变化性。它在整个过程中不断成长并采用许多技术。\n\
  \n\n**图 19:** 整体钓鱼邮件聚类方法，PECM。\n\n`PECM` 由 ALmomani [85] 提出，他提出了一种独特的观点，将适应分类的演化簇技术（ECMC）用于创建一个名为钓鱼演化簇技术（PECM）的新模型。`PECM`的功能支持钓鱼邮件两特征组之间的相似性。`PECM`\
  \ 模型在在线模式下将邮件分类为钓鱼邮件或正常邮件方面被证明极其有效，同时不会对过量的内存、速度和单次通过算法规则的使用产生密集影响，从而将准确率提高到 99.7%。\n\
  \n`PENFF` 由 ALmomani [86] 设计，用于检测和预测未知的“零日”钓鱼邮件，它提供了一个名为钓鱼演化神经模糊框架（PENFF）的替代框架，该框架支持自适应演化模糊神经网络（EFuNN）[62]。作为性能指标；其基础均方根误差（RMSE）和非归一化误差指数（NDEI）分别为\
  \ 0.12 和 0.21，与其他方法相比，错误率较低（图 20）。\n\n`PDENFF` 由 ALmomani [63] 设计，并引入了一种适应“演化连接系统”的新颖框架。`PDENFF`\
  \ 是一个框架自适应在线框架，通过离线学习增强，以动态发现未知的“零日”钓鱼邮件。该框架旨在实现低内存占用的高速“终身”学习，并最大限度地减少了护理配置中规则库的影响，与针对“零日”钓鱼邮件漏洞的生成的现有解决方案相比，改进了\
  \ 3%（图 21）。\n\n\n\n\n\n## 4. 结论\n\n本章是网络安全威胁趋势中最新且问题最大的趋势之一。这是一种通过看似合法的垃圾邮件获取机密信息的方法。我们有一个关于防止此类钓鱼邮件攻击的章节。本章提升了对钓鱼邮件危害、该领域以及过滤钓鱼邮件未来范围的理解。文献中给方法在准确性或性能方面仍存在许多局限性，特别是对于“零日”钓鱼邮件攻击。大多数分类器不会主要基于监督学习建立钓鱼邮件区域，即它们必须在发现替代攻击之前进行学习。无监督学习虽然更快，但准确率较低；或者采用混合学习（监督和无监督），这既耗时又昂贵。虽然采用了多种算法，但到目前还没有通用的技术。\n\
