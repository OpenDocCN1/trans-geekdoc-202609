  ### 1. 引言\n\n自从智能手机出现以来，移动行业被不同操作系统提供的应用程序所彻底改变。这些应用程序位于应用商店中，不同操作系统的名称不同，例如在 Windows\
  \ 中是自己的商店，而在安卓中是 Google 商店。安卓系统为用户提供了极大的便利，同时在 Google 商店中提供了数以千计的应用，其中许多应用的下载量超过了\
  \ 1000 万。这些安卓应用程序根据用户的需求提供不同的功能。用户可以直接获取这些应用程序，并可以轻松下载到智能手机上。与下载和安装一样，开发者在应用商店托管应用也非常简单直接\
  \ [32], [33], [34], [35], [36], [37], [38], [39]。随着良好的移动数据连接、强大的智能手机、应用商店以及集成计费系统的出现，这些上传和下载已变得非常高效。托管应用的开发者可以通过该计费系统轻松收款，而下载某些付费应用的用户则通过该系统进行支付\
  \ [40–47]。\n\n用户根据特定需求下载不同的应用程序。这些应用程序在下载前会向用户请求某些权限。用户可以允许所有权限，也可以简单地拒绝下载应用程序。目前还没有允许某些权限而拒绝其他权限。这些权限允许应用程序访问手机的许多核心服务，例如摄像头、联系人、日历、手机位置、短信等。显而易见，如果某些恶意软件被误用，手机提供的这些核心服务可能会成为重大的隐私问题。\n\
  \n\n\n\n\nGoogle Play 商店中的应用程序数量以惊人的速度增长。因此，恶意应用程序的数量以及所有真实的开发者和 Android 的所有者 Google\
  \ 都意识到了这一事实。因此，只有包含受信任密钥数字签名的应用程序才被允许进入商店并供用户下载。任何没有数字签名的应用程序都不允许托管在 Google Play\
  \ 商店中，但这些应用可以从其他不可信的来源下载，而我们绝不建议这样做。尽管这些数字签名可以在初始阶段就帮助剔除恶意应用程序，但恶意开发者有许多其他方法来绕过这一点，例如重新打包或更新攻击等。这些攻击利用\
  \ Play 商店中现有的应用程序，对其进行修改，使其具有恶意性，然后再次托管在商店商店中。当合法用户下载并安装此类应用程序时，他们的设备将会受到损坏，数据以及个人信息也会被泄露。\n\
  \n在本文中，我们提出了一种原型方法 `Droid-Sec`，旨在用户尝试下载和安装恶意应用程序时对其进行检测。`Droid-Sec` 会给用户一个合理的警告，告知该应用程序是恶意的，可能会损坏设备并将个人信息泄露给未知来源。`Droid-Sec`\
  \ 利用基于行为的恶意软件检测系统来发现恶意应用程序。其核心思想是将任何 Android 应用程序使用的系统调用与存储在远程服务器上的该应用程序应的标准系统调用进行比较。如果应用程序使用的系统调用与标准许可系统调用匹配，则该\
  \ Android 应用程序是合法的；否则它是恶意的。一旦应用程序被判定为恶意，`Droid-Sec` 具有禁用相应应用程序互联网连接的机制。\n\n我们的方法在本质上与市场上其他手机防毒软件相似。然而，传统的防毒软件采用基于特征的比较技术；而\
  \ `Droid-Sec` 利用基于系统调用的比较技术。之所以采用这种改进是因为基于数字签名的过滤很容易被攻击者绕过。此外，`Droid-Sec` 还能帮助手机用户选择性地禁用那些恶意应用程序的互联网连接。\n\
  \n### 贡献\n`Droid-Sec` 是一种基于动态分析的方法，它在运行时检查 Android 应用程序的行为，并根据这些行为以及应用程序使用的系统调用，我们的方法可以确定应用程序的恶意性质。我们引入\
  \ `Droid-Sec` 是为了有效检测并拦截恶意应用程序。本文的主要贡献如下：\n\n- 提出了一种轻量级检测方法 `Droid-Sec`，它跟踪应用程序的系统调用并将文件传输到远程服务器进行比较，从而使其非常轻量。与传统的防毒软件相比，它消耗的\
  \ CPU、电池和其他资源更少。\n- `Droid-Sec` 在原生应用程序上测试，这些应用程序经过修改以显示出某些恶意特征。`Droid-Sec` 以约 99%\
  \ 的准确率检测出了应用程序的恶意性质。\n- `Droid-Sec` 不仅检测应用程序的恶意性质，还能阻止应用程序的访问访问。\n- 我们提供了实验证据，并证明这种方法在实时环境中是可行且有效的。\n\
  \n## 2. 相关工作\n基本上，检测 Android 恶意软件的方法有两种——静态分析和动态分析。在静态分析中，我们通常会检查 Android 应用程序的源代码以发现其恶意性；如果源代码显示与原始代码不同，则该应用程序被认为是恶意的。在静态分析中，应用程序不需要执行；而在动态分析的情况下，恶意性质是在运行时发现的。这种方法可能会漏掉部分代码，但它提供了比静态分析更高的准确性。\n\
  \n在静态分析中，通常会检查应用程序请求的权限以确定应用程序的性质。Peng 等人应用简单的朴素贝叶斯算法获取请求的权限 [1]，为 Android 应用程序开发了一个分层分类模型。`AdDroid`\
  \ [2] 也提出了一种基于权限的机制，将权限从广告框架中分离，从而使敏感信息免受广告库的侵害。Sarma 等人 [3] 根据赋予实际应用程序和恶意应用程序的权限确定后者的恶意性质。基于权限的方法通常准确率较低。\n\
  \n许多基于动态分析的方法也已开发出来，这些方法在动态运行时检查 Android 应用程序的恶意性质。`CrowDroid` [4] 是使用动态分析的方法之一。它是一种基于机器学习的方法，可以根据恶意应用程序的行为检测系统中的恶意软件。它跟踪运行时应用程序使用的系统调用，并应用机器学习算法对良性和恶性应用程序进行聚类。`Andromaly`\
  \ [5] 也是一种基于动态分析的机器学习方法，它根据从传感器活动到 CPU 使用的多个参数来监控手机和用户行为。另一种类似的开发方法是 `MADAM` [6]，它根据某些利用特征检测应用程序的恶意性质。`MADAM`\
  \ 在野外恶意软件上显示了良好的结果。在 [7] 中，作者讨论了一种利用算法提取特征并发现异常的方法。在 [8] 中，讨论了一种基于行为的恶意软件检测系统，该系统关联用户输入与系统调用以确定发送短信/彩信应用程序的恶意性质。\n\
  \n### 2.1 现有解决方案\n手机是重要但危险的设备。它们包含大量的敏感和隐私信息，因此上述所有漏洞以及更多此类问题必须得到适当的处理。考虑到这一点，已经开发并为手机添加了许多措施以确保其安全并免受攻击者或入侵者的侵害。这些措施有各种形式，从操作系统自身的安全层开发到应用商店中可下载的应用，取决于系统的威胁。\n\
  \n**Android 沙箱**：Android 操作系统包含一个使其安全架构的核心功能。它是 `Android 沙箱`，本质上为手机设备上安装的所有应用程序创建了虚拟盒，这些应用程序无法访问或操纵沙箱之外的任何资源。这一关键功能有助于在最基础层面上提供安全保护。\n\
  \n\n\n\n\n### 杀毒软件\n在操作系统安全之上是一层安全软件，它包含了用于保护智能手机设备安全的各种不同组件。`Antivirus` 可以作为此类组件部署在智能手机上，保护设备免受恶意应用程序和各种恶意软件的侵害。这种软件通过检查恶意可执行文件的签名，并与其自身仓库中存储的签名进行比较，来检测潜伏在智能手机中的任何恶意程序。如果这些签名匹配，则其本质上是恶意的，否则不是。因此，使用像\
  \ `Avast antivirus` 这样良好的杀毒软件，可以避免恶意软件和其他恶意应用程序 [22]。\n\n### 防盗软件\n盗窃是我们在世界上看到的最老且最常见的犯罪之一。因此，有许多方法可以保护财物品免受盗贼之手。从锁的发明到生物识别的发布和引入，防盗系统已经显著增长。`Anti-theft\
  \ software` 是一种帮助防止未经授权访问智能手机设备的代码。当设备被盗或丢失时，它们可以帮助追踪设备，并实现远程擦除数据 [23]。\n\n### 更新与密码保护\n\
  始终建议保持所有软件处于更新状态，因为当软件更新时，旧漏洞会从应用程序中移除，应用程序代码中的任何漏洞都会得到妥善管理和处理，这使得黑客入侵此类应用变得更加困难。保护所有已安装应用程序的密码，是确保存储在这些应用程序中的数据免受攻击者（甚至在设备被盗或丢失时）保持安全的良好方法。\n\
  \n### 安全 Wi-Fi\n连接到不安全或公共 `Wi-Fi` 可能证明是用户及其数据面临的最大威胁之一。因为任何人都可以加入这些开放网络，从而为攻击者打开了一扇容易的大门。因此，建议只加入那些浏览器显示已激活\
  \ `SSL` 加密的网络。当 `SSL encryption is active` 状态时，网站在打开之前会先向用户的浏览器进行自身身份验证。如果任何网站未能通过身份验证，就会弹出“不可信”的安全证书提示。\n\
  \n### 关闭蓝牙\n有时用户会无意或有意识地让蓝牙功能开启，从而落入入侵者的圈套，入侵者会强制将他们的设备与用户的设备配对并损坏设备。一旦设备被强制配对，敏感和隐私信息就会在用户不知情的情况下被攻击者获取。因此，建议在使用后在设置菜单中关闭蓝牙，不要让其保持开启。\n\
  \n### 2.2 当前问题与挑战\n我们在前一节中针对各种移动漏洞提供了一些解决方案。这些解决方案在本质上是非常基础的。遗憾的是，当今世界的攻击者比以前要熟练得多，并且非常了解上述解决方案。这些攻击者的技能组合包括利用和损坏设备的新类型方法。仅仅关闭蓝牙或下载安装杀毒软件不足以制约这些攻击者。这些解决方案包含许多漏洞，攻击者对此了如指掌。因此，这些方法不足以应对市场上潜伏的恶意软件数量大幅上升。根据最近的报告\
  \ [24]。\n\n## 3 背景、动机与统计\nAndroid 操作系统是一个基于 Linux 内核的操作系统，最初为触摸屏设备（如智能手机等）设计，但如今市场上出现了许多运行\
  \ Android 系统的可穿戴设备和电视。Android OS 支持一个开放平台，这得益于稳健的安全架构和严格的安全程序。它由多层架构组成，为 Android\
  \ 提供了所需的灵活性并结合了安全性。该安全架构旨在的主要目标是：保护重要和敏感的用户信息、保护各种系统资源以及将每个应用程序与其他相互隔离。\n\nAndroid\
  \ 操作系统通过 Android 团队在该平台上引入的以下安全特性实现了这些目标——安装任何应用程序之前授予用户权限、每个应用程序的数字签名以及 Android\
  \ 沙箱机制。因此，Android 是一个安全的应用程序开发平台，应用程序主要用 Java 语言编写，并运行在 `Dalvik Virtual Machine\
  \ (DVM)` 中。\n\n### 3.1 Android 软件栈\n图 1 显示了 Android 软件栈，它为 Android 架构提供了不同的设备驱动程序，并在最底层与内核结合。随着我们沿着堆栈向上移动，会遇到中间件、Android\
  \ 运行时环境和应用程序 [9, 10]。\n\n#### Linux 内核\nAndroid 软件栈的底层是 `Linux kernel`，它提供了内存管理、进程管理、设备管理等功能。Linux\
  \ 擅长的所有其他内容，如用于与硬件建立接口的网络和设备驱动程序，也由内核管理。\n\n#### 库\n库位于内核层之上，包含了库 `libc`、开源网页浏览器引擎\
  \ `web-kit`、用于存储应用程序数据的 `SQLite 数据库` 以及用于安全的 `SSL libraries`。\n\n\n\n\n\n### Android\
  \ 运行时 (Run-time)\nAndroid 运行时是中间件的另一部分。它由 `Dalvik Virtual Machine` (`DVM`)组成，它是\
  \ Android 的虚拟机。`DVM` 利用了 Linux 的特性，例如内存管理和多线程。Android 运行时还包含了一些帮助 Android 开发者开发应用程序的库。\n\
  \n### 应用框架 (Application Framework)\n这一层是 Android 软件栈较高层之一，为应用程序提供服务，Android 开发者可以使用这些服务以最高效率构建应用程序。\n\
  \n### 应用程序 (Applications)\n顶层由 Android 应用程序占据，这些程序在此层被开发，例如 Android 游戏、浏览器等。\n\n\
  ### 3.2 背景与历史\n在本节中我们将介绍 Android 操作系统是如何诞生并演变成今天样子的。由于我们选择 Android 作为构建框架的操作系统，因此讨论\
  \ Android 操作系统的历史似乎是明智的。Android 起初作为一个移动操作系统，现在可以在不同的平板电脑上看到，甚至扩展到了支持智能电视和可穿戴设备。由于\
  \ Android 去年发布了适用于 Android Auto 的 `SDK`，Android 正在将其触角扩展到各种汽车。\n\nAndroid 开始支持任何和一切实体物体的那一天已不远了。这是一段始于\
  \ 2003 年的长长旅程，但从那时取得了巨大的里程碑。表 1 突出了 Android API 版本的各个更新，分别对应其发布的月份和年份。\n\n*   Android\
  \ Inc. 于 2003 年成立于帕洛阿阿尔托，随后于 2005 年被 Google 收购。在 2007 年 11 月发布 beta 版本之前，Android\
  \ 的 alpha 版本在 Google 内部和 `OHA`（开放手机联盟）内部发布。不同的内部版本代号为“Astro Boy”（铁臂小刚）和“R2-D2”。\n\
