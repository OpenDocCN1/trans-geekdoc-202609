  \ Normalia Samian. (2013). 移动自组织网络中基于信任的路由机制：设计与实现。\n\n### 1. 引言\n\n税收被认为是中国的重中之重。中国政府报告显示，损失率超过\
  \ 20%。同时，在中国或其他经济体的经济转型过程中，当公司治理不成熟时，交叉控制者往往会寻找监管漏洞以使其自身利益最大化。因此，本章提出了“控制者交叉”（controller\
  \ interlock）的定义，用以刻画企业控制者之间的交叉关系。\n\n在介绍公司治理网络（CGN）的定义和控制者交叉的提后，本章关注一个重要问题，即 CGN\
  \ 中基于交叉的逃税（ITE）的检测。该问题被细分为三个基础问题：(i) 如何根据中国的经济环境定义控制者交叉（简称 I 类问题）；\n(ii) 如何识别企业控制者之间的控制者交叉关系带（简称\
  \ II 类问题）；\n(iii) 如何检测 ITE 的可疑群体（简称 III 类问题）。\n\n在本章中，为了解决 I 类问题，我们基于深入研究的“董事会交叉”概念，结合中国企业的控制关系，创造了控制者交叉的概念。此外，为了解决\
  \ II 类问题，我们采用图投影方法来识别符合控制者交叉模式的关系带，然后提出了一种基于控制者交叉关系带的组件模式匹配方法，用于检测 ITE 可疑群体，以解决\
  \ III 类问题。最后，基于中国某省 2009-2015 年七年的数据进行了一系列实验，结果表明我们提出的方法可以大大提高逃税检测的效率。\n\n## 2.\
  \ 相关工作\n\n董事会交叉分析是税务和经济领域的一个新兴课题，并引起了广泛关注。\n\n\n\n\n董事会交叉已应用于行业动态分析 [12, 11, 5,\
  \ 8]]和公司决策 [1, 3]]。Suominen 等人 [12] 将董事会交叉视为公司创新和增长所需的组织间流动的工具，特别关注董事会网络或交叉的组织间流。。Robins\
  \ 等人 [11] 引入了二部图聚类系数，用于比较美国和澳大利亚交叉公司董事的全局结构属性。Ma 等人 [8] 发现，在中国与国家-社会关系相关的重大政治和社会事件非营利组织的董事会交叉网络中，存在一个结构独立的领域。Connelly\
  \ 等人 [3] 在考察了美国公司交叉董事的广泛社会网络的同时，还通过整合理性行动者、潜在的抑制性影响以及网络结构考虑，探讨了新兴策略通过交叉董事会进行的扩散。\n\
  \n此外，许多研究人员指出交叉公司之间存在明显的模仿效应，这可以提高公司的盈利能力。例如，Chua 等人 [2] 使用社交网络分析确定了来自 2010 年富富\
  \ 500 强公司的交叉董事会与公司盈利能力之间的关系，并指出交叉和权力行使与公司盈利能力均呈正线性关系。Peltonen 等人 [10] 指出，具有国际收入交叉的公司以及董事会交叉的公司具有作为重要信息和资源渠道的潜力。\n\
  \n然而，在某些特殊环境下也分析了与董事会交叉相关的负面绩效影响。Liu [7] 研究了环境动态性对新兴经济体（如中国）交叉董事与公司绩效之间关系的影响。他指出，交叉董事会组成的社交网络中心的企业产将受到负面影响。Croci\
  \ 等人 [4] 使用顶点中心性指标考察了交叉董事会及其经济影响，发现意大利公司价值与董事会交叉网络的程度和特征向量中心性之间存在负相关关系。\n\n## 3.\
  \ 公司治理网络与控制者交叉\n\n### 3.1 公司治理网络\n\n公司治理网络（CGN）的形成是为了代表一种基于 CWNBM 的异构信息网络。因此，我们首先对本研究工作中使用的\
  \ CGN 定义定义如下：\n\n**定义 1：** CGN 被公式化为一个五元组：\n\n`CGN = (V, E, W, VColor, EColor)`\n\
  \n其中\n\n- **V**: `{v[p] | p = 1, …, N[V]}` 表示节点集；\n- **E**: 表示所有现有弧的集合，令 `E = {e[pq]}\
  \ = {(v[p], v[q]) | 0 < p, q ≤ N[V]}``，其中 `e[pq] = (v[p], v[q])` 表示从第 `p` 个节点到第\
  \ `q` 个节点存在弧；\n- **W**: `{w | 0 < p, q ≤ N[V]}` 表示从第 `p` 个节点到第 `q` 个节点弧的权重（IAD）；\n\
  - **VColor**: `{LC, BC, CC}`，其中 `LC` 表示法人或董事的颜色；`CC` 表示公司的颜色；`BC` 表示股东的颜色。使用 **VColor**\
  \ 中的颜色对 CGN 中的 **V** 进行分类时，我们可以得出以下结论 `V = {L ∪ C ∪ B}`，其中 `L = {v[l] | l = 1, …,\
  \ N[L], N[L] < N[V]}` 表示所有标记为颜色 `LC` 的法人或董事节点，`C = {v[c] | c = 1, …, N[C], N[C]\
  \ < N[V]}` 表示所有标记为颜色 `CC` 的公司节点，`B = {v[b] | b = 1, …, N[B], N[B] < N[V]}` 表示所有标记为颜色\
  \ `BC` 的股东；\n- **EColor**: `{LC, BC, CC}`，其中 `LC` 表示法人或董事的颜色；`CC` 表示公司的颜色；`BC` 表示股东的颜色。\n\
  \n### 3.2 控制者交叉\n\n董事会交叉被定义为在各自的董事会中共享一个共同成员，其中某家公司的人员在另一家公司的董事会任 [6, 9]]。\n\n在本章中，我们扩展了董事会交叉的内涵，将其发展为适用于中国经济环境的概念：\n\
  \n- (i) 关注点从寻找公司之间的交叉关系转向挖掘公司控制者之间潜在的交叉关系。\n- (ii) 涉及的人员从简单的董事扩展到控制者的多种角色——董事、法人股东。涉及的关系从\
  \ `P` 与 `C` 之间的简单董事关系扩展到实际控制的范围、`P` 与 `C` 之间的持股关系，以及 `C` 与 `C` 之间的投资关系。然后，从 `P`\
  \ 到 `C` 的影响相应从直接控制链路（`P-C`）扩展到控制链（`P-C-...-C`）。\n\n基于上述扩展，控制者交叉被定义为两个控制者之间的链路，每个人都在共同公司的董事会或管理层任职，或对其有间接影响。\n\
  \n## 4. 控制者交叉模式识别\n\n### 4.1 利益共同体划分\n\n\n\n考虑到生成的控制关系网络（CGN）是一个大规模图，第一步是应用分治策略将\
  \ CGN 划分为一系列较小的弱连通子图。这一步的灵感源于一个直观的想法：控制者互锁结构的拓扑包含在控制网络的一个分量中，因为它属于连通图且仅由控制弧构建。同时，一个连接控制网络中两个不连通分量的交易关系弧是不引起怀疑的交易关系。显而，这意味着在交易关系弧背后，绝对存在有一方（节点）没有同时参与这两个分量。因此，控制网络中的第\
  \ `i` 个最大弱连通子图与其所属公司节点之间的交易关系弧构成了 CGN 的第 `i` 个利益社区，记为 `subCGN(i)`。`subCGN` 的控制部分记为\
  \ `subCtrlNet`，`subCGN` 的交易部分记为 `subTraNet`。\n\n### 4.2 潜在组件模式基 (PCPB) 的构建\n\n每个\
  \ ITE（利益相关交易）可疑群体都由两个潜在的控制关系轨迹（见定义 2）组成，位于 IAT（关联交易）之后，且每个轨迹的起始节点（控制者）之间存在控制者互锁关系。因此，有必要构建一个\
  \ PCPB，以 `InP-OutC` 游走的形式记录整个 `subCtrlNet` 中的所有潜在控制关系轨迹（见定义 3）。为此，提出了一种新型基于并行标签传播的控制关系轨迹遍历算法，该算法在每个\
  \ `subCtrlNet` 中执行以获取 PCPB。算法的主要步骤如下：\n\n### 步骤 1：初始化过程\n\n首先，为每个节点初始化一个唯一标识标签（`IdLabel`）。同时，假设\
  \ `subCtrlNet` 中的每个节点携带一个本地轨迹集 `LTrailSet`，用于存储以节点本身结束的控制关系轨迹。将每个 `Person` 节点（一个节点作为一个轨迹）的唯一\
  \ `IdLabel` 添加到其 `LTrailSet` 中进行初始化，并将每个 `Corporation` 节点的 `LTrailSet` 定义为空集。同时，定义一个全局轨迹集\
  \ `GTrailSet` 来存储 `subCtrlNet` 中的所有静态 IRR 轨迹，并将其初始化为空集。\n\n### 步骤 2：传播过程\n\n让每个节点的\
  \ `LTrailSet`（第一个循环仅限 `Person` 节点）通过追踪其相邻边的方向传播到其邻居。然后，移除未收到任何邻居 `LTrailSet` 的节点并断开与其邻居的连接。接下来，统计\
  \ `subCtrlNet` 中的节点数量。如果数量为零，则算法终止，`GTrailSet` 为记录该 `subCtrlNet` 中所有静态 IRR 轨迹的 PCPB；否则继续。\n\
  \n### 步骤 3：更新过程\n\n每个节点根据从邻居收集的 `LTrailSet` 更新自己的 `LTrailSet`。节点的详细更新操作包括以下三个步骤：(i)\
  \ 将 `LTrailSet` 弹出 `GTrailSet`；(ii) 合并收集到的 `LTrailSet` 并移除包含该节点 `IdLabel` 的组件轨迹；(iii)\
  \ 将 `IdLabel` 添加到其余组件轨迹中，并通过获得的新轨迹集更新该节点的 `LTrailSet`。\n\n步骤 2 和 3 迭代执行，直到满足终止条件。然后，每个\
  \ `subCtrlNet` 中的所有控制关系轨迹都记录在相应的 PCPB 中，并将每个轨迹的副本分发到 `IdLabel` 等于轨迹最后一个元素的节点的 `LTrailSet`\
  \ 中。上述三步方法的伪代码见 算法 1。\n\n**算法 1：** PCPB 构建\n\n![Image](img/alg12_1.jpg)\n\n**定义\
  \ 2：**潜在控制关系轨迹\n\n潜在控制关系轨迹是指满足以下条件的轨迹 `T`：\n\n`T = {(p, c[1], c[2], ..., c[n]) |\
  \ p ∈ P, c[1], c[2], ..., c[n] ∈ C, (p, c[1]), (p, c[2]), ..., (c[n], c) ∈ E}`\n\
  \n**定义 3：**个人节点起始且公司节点结束的游走 (InP-OutC 游走)\n\n个人节点起始且公司节点结束的游走是指控制网络中轨迹集的一种轨迹，且不包含任何交易弧，它由一个\
  \ `Person` 节点开始并于 `Corporation` 节点结束。\n\n### 4.3 控制者互锁模式识别\n\n控制者互锁定义为两个控制者之间的连接，每个控制者都在共同公司的董事会或执行层任职，或对其有间接影响。为了解决控制者互锁模式识别问题，我们首先提出了一种基于二图网络模型来刻画个人与公司之间的控制关系，并生成个人-公司二图网络\
  \ (PCBN)。然后，通过将 PCBN 映射到名为 Person 的单图网络（称为 P 投影图），完成控制者互锁连接的构建任务。\n\n对于 PCPB 中以\
  \ `InP-OutC` 游走形式存在的每个潜在控制关系轨迹，提取第一个最后一个节点（`p` 和 `c`）形成 `Person` 节点集 `P` 和 `Corporation`\
  \ 节点集 `C`，边 `(p, c)` 形成边集 `E`。然后 PCBN 可以由二图 `{P, C, E}` 表示，其中 `P` 和 `C` 是网络的两个部分。同一集合\
  \ `P` 中的节点之间没有边，即 `E` 中的每条边 `(p, c)` 满足 `p ∈ P` 且 `c ∈ C`。我们使用 `N(p) = {c | c ∈\
  \ C}` 表示个人节点 `p` 的公司邻居集。为了分析 PCBN 中的控制者互锁连接，将其映射到 P 投影图（见定义 4）。\n\n**定义 4：**P 投影图。给定一个二图\
  \ `PCBN = {P, C, E}`，其 P 投影图定义为单图 `PCBN[P] = {P, E[P]}`，其中边集为 `E[P] = {(p1, p2)\
  \ | p1, p2 ∈ P}`。\n\n从定义中可以看出，如果二图网络中的 `Person` 部分节点 `p1` 和 `p2` 在 `Corporation`\
  \ 部分至少有一个共同邻居，则在 P 投影图 `PCBN[P]` 中存在控制者互锁连接 `(p1, p2)`。详细过程见 算法 2。\n\n**算法 2：**\
  \ 控制者互锁识别\n\n![Image](img/alg12_2.jpg)\n\n## 5 可疑避税群体识别\n\n根据定义 5，通过基于 PCPB 和控制者互锁连接执行首次互锁连接连接（见引理\
  \ 1），构建出一系列 `FIT-OutC` 游走。然后，ITE 的拓扑模式可以重新描述为背后具有相同控制者互锁连接的 `FIT-OutC` 游走。\n\n对于\
  \ `subTraNet(i)` 中的每条交易关系弧 `tra`（i = 1, …, L），从 `subCGN(i)` 的 PCPB 中提取 `tra` 源顶点\
  \ `src` 和目标顶点 `dst` 的 `LIntrlSet`。如果存在 `trail[s] ∈ LIntrlSet(src)` 和 `trail[d] ∈\
  \ LIntrlSet(dst)`，使得 `trail^s`、`trail^d` 与 `tra` 的组合符合上述拓扑模式，则称 `tra` 的两个交易方涉嫌 ITE，即\
  \ `tra` 属于利益相关交易，`trail[s]` 和 `trail[d]` 是可疑关系轨迹。详细过程见 算法 3。\n\n**算法 3：** 可疑避税群体识别\n\
  \n![Image](img/alg12_3.jpg)\n\n\n\n\n## 定义 5\n*首次控制器互锁绑定启动与协同节点停止走廊*（*FIT-OutC*\
  \ walk）是一种由首次互锁绑定连接（见 `引理 1`）产生的轨迹，该连接在属于 `InP-OutC` 路径集（PCPB）的轨迹起始点（start）处添加了一个控制器互锁绑定。新生成的局部和全局\
  \ `FIT-OutC` 路径集分别被命名为 `LIntrlSet` 和 `InPCPB`，对应于 `InP-OutC` 路径集。\n\n## 引理 1\n如果将一个控制板绑定添加到控制关系尾部的头部，并形成了一条新路径\
  \ `nw`，则 `nw` 是一条轨迹。我们将这种添加控制器互锁绑定的操作称为首次互锁绑定连接。\n\n## 6. 实验评估\n\n### 6.1 实验设计\n\
  \n**数据集与预处理。** 实验基于中国 S 省 2009 年至 2015 年的真实税收数据进行。每月从数据中生成一系列 CGN，平均包含 2,872,469\
  \ 个节点和 2,488,982 条弧。同时，利用七年的审计结果作为数据集。每条结果都是对公司财务状况检查后得出的结论，包括公司的纳税人 ID 和检查标识符（即：`1`\
  \ 表示逃税，`0` 表示非逃税）。在数据集中，每月平均包含 19,328 家 ITE 公司和 18,209 家非 ITE 公司。\n\n**评估技术。** 针对数据集中的每个纳税人\
  \ `t`，应用识别方法来检测其是否属于可疑逃税小组的交易方。然后，将获得的结论 `C` 从以下两个方面与实际审计结果（即地面真值）进行比较：(i) 当 `t`\
  \ 的标识符等于 `1` 时，如果 `C` 包含任何识别出的可疑小组，则认为 `t` 被正确识别；(ii) 当 `t` 的标识符等于 `0` 时，如果 `C`\
  \ 返回为空，则认为 `t` 未误报。\n\n**评估标准。** 为了评估我们所提识别方法的性能，使用了两个指标：`识别准确率`（Identification\
  \ Precision）和 `命中率`（Hit Rate）。`识别准确率 (IP)` 是被预测为可疑且确实涉及逃税的公司比例。`命中率 (HR)` 是真实实施了逃税行为并随后被成功识别的公司比例。`识别准确率`和\
  \ `命中率` 越高，表明识别能力越强。\n\n**比较方法。** 在实验中，我们使用传统的板级互锁进行比较，因为传统的板级互锁和我们提出的控制器互锁都指的是控制器对多个公司产生共享影响的实践。\n\
  \n对于这两个互锁概念，采用基于图的模型来表征其模式，每种模式都由两条潜在的控制关系轨迹和一条利益关联交易弧组成。可疑关系轨迹的构建受两个因素影响：(i) `Th`：控制弧的权重阈值；(ii)\
  \ `L`：可疑潜在控制关系轨迹的最大长度限制。如果我们设置较高的 `Th`，则较少的控制弧将被认为具有足够的影响力，随后构建的轨迹也会减少。同理，如果设置较小的\
  \ `L`，也会发生相同的情况。\n\n实验结果将通过数值统计和分析，展示可疑关系轨迹构建因素的多样性（即 `Th` 和 `L`）对评估指标的影响。\n\n###\
  \ 6.2 实验结果\n\n**不同方法的效果。** [表 1] 和 [2] 显示了控制器互锁方法和板级互锁方法获得的效果（`识别准确率` 和 `命中率`）的比较。虽然在不同评估指标下的效果有所不同，但整体而言，控制器互锁方法的性能优于板级互锁方法。具体而言，在\
  \ `命中率` 方面的提升显著，而在 `识别准确率` 方面的提升更为平滑。如 [表 1] 所示，以 `L` = 2，`Th` = 0.3 为，控制器互锁方法的描述如下：(i)\
  \ 它的 `识别准确率` 大约等于板级互锁方法；(ii) 它的 `命中率` 高得多，提升了 237%。结论，与板级互锁方法相比，控制器互锁方法大大提高了逃税识别的\
  \ `命中率`，同时实现了相似的 `识别准确率`。\n\n**表 1：** 关于 `Th` 的影响。\n\n| `Th` | **控制器互锁** | **板级互锁**\
  \ |\n| --- | --- | --- |\n| `IP` | `HR` | `IP` | `HR` |\n| 0.1 | 0.7850 | 0.0331\
  \ | 0.8025 | 0.0101 |\n| 0.2 | 0.7810 | 0.0316 | 0.7957 | 0.0095 |\n| 0.3 | 0.7748\
