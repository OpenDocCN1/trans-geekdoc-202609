  \ `Linked List attr`。算法遍历 `Linked List attr`。如果被遍历地址的数据包含，”则该数据是函数名。函数名被推入 `SPF\
  \ 链表`。深一层函数的大小被推入数据结构中。然后算法递归调用自身，以便将更深层函数的列表推入列表。如果数据不包含‘#’，则数据被推入 `SPF 链表`。\n\n\
  **Algorithm 3:** 脚本变量的嵌套背景确定。\n\n![Image](img/alg13_3.jpg)\n\n\n\n\n简单的 SPF 算法以脚本字符串作为输入。它遍历字符串并将括号前的文本和括号后的文本分离。括号前的文本是函数名，也是\
  \ SPF 中的第一个条目。括号后的文本包含用逗号分隔的属性。因此，算法存储了这些属性。SPF 首先根据属性的数量追加，最后追加属性本身。算法 5 展示了通过脚本属性函数\
