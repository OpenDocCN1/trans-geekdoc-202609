  \n### 8.2.2 超参数选择\n\n所有的深度学习架构都是通过随时间反传播（`BPTT`）技术进行训练的。`RNN`、`IRNN`、`LSTM`、`GRU`、`CNN`\
  \ 和 `CNN-LSTM` 等深度网络是参数化函数，寻找最佳参数是一项重要任务。这由于 DGA 检测率实际上取决于最优的网络参数和网络结构 [37]。所有实验均运行了\
  \ 1000 个时代（epochs），批量大小为 128，学习率为 0.001。\n\n在 `RNN/LSTM/GRU/IRNN` 中，针对中等规模的 `RNN/LSTM/GRU/\
  \ IRNN` 网络，对单元/内存块数量 32, 64, 96, 128, 256 进行了两次实验尝试。中等规模的 `RNN/LSTM/GRU/IRNN` 网络包含单层\
  \ `RNN/LSTM/GRU/IRNN` 层，随后是丢弃率为 `0.1` 的 dropout 层以及一个带有单神经元和 `sigmoid` 非线性激活函数的全连接层。具有\
  \ 64 个单元/内存块的 `RNN/LSTM/GRU/IRNN` 层表现良好，此外，32 个单元/内存块的性能与 64 个单元相当。为了给特征提取提供更高层次的自由度，其余实验的单元/内存块数量设置为\
  \ 128。在第二组实验中，我们将二元语法（bigrams）作为输入传递 `RNN/LSTM/GRU/IRNN`。与字符级输入相比，它们的性能相当差。\n\n\
  在 `CNN` 中，针对中等规模的 `CNN`，对过滤器 4, 16, 32, 64 和 128 以及过滤器长度 3 进行了三次实验尝试。中等规模的 `CNN`\
  \ 由 `convolution1d`、池化长度为 2 的 `maxpooling1d`、带有 128 个神经元的全连接层、丢弃率为 `0.2` 的 dropout\
  \ 层以及带有 1 个神经元和 `sigmoid` 非线性激活函数的全连接层组成。具有 64 个过滤器的 `CNN` 网络优于其他过滤器。因此，在其余实验中，我们将\
  \ `convolution1d` 层中的过滤器数量设置为 64。\n\n### 8.2.3 提出的架构\n\n所提深度学习模型的直观概述见于 图 1。它由三个部分组成：域名字符嵌入、特征表示和分类器。这包含了深度神经网络在训练过程中学习的若干参数。在训练期间，嵌入层、深度学习层和全连接层协同工作，以实现准确且稳健的\
  \ DGA 检测。该模型在三种不同的实验设计上进行了评估：\n\n* 二分类分类，即检测 DGA。\n* 多分类，即对域名类型进行分类。\n* 深度学习，即预测\
  \ DGA 状态。\n\n所提模型的计算流解释如下：\n\n![Image](img/fig6_1)\n\n**图 1：** 所提深度学习模型的直观概述。\n\n\
  * **域名字符嵌入：** 我们使用了以下架构：\n  - 数据集 1：训练数据。\n  - 数据集 2：验证数据。\n  - 数据集 3：测试数据。\n* **特征表示：**\
  \ 我们使用了以下循环层 `RNN`、`LSTM`、`GRU` 和 `IRNN`，如 图 2\n\n**图 2：** `CNN-LSTM` 学习的嵌入字符向量。\n\
  \n* **循环层：** 我们使用了循环层 `RNN`、`LSTM`、`GRU` 和 `IRNN`。\n* **卷积层：** 为了学习字符之间的空间相关性或局部特征，使用了\
  \ `CNN`。它包含两个层——第一层通过多个 `convolution1d` 操作提取局部特征，并传递给 `maxpooling1d`。\n* **正则化：**\
  \ 在深度层和全连接层之间使用了丢弃率为 `0.1`（`CNN` 中为 `0.2`）的 dropout 层，作为正则化参数以防止过拟合。\n\n\n\n\n\n\
  -   **分类：** 从深层提取的新特征被传递到全连接层进行分类。全连接层是学习深层提取特征的非线性组合的一种廉价方法。在全连接层中，一层中的每个神经元都连接到另一层中的所有神经元。全连接神经网络由两层组成，例如具有\
  \ 128 个单元的全连接层，其后是具有一个单元的全连接层。它在二分类中包含`sigmoid` 激活函数，在多分类中包含`softmax` 激活函数（具有 40\
  \ 个单元的全连接层）。在将域名分类为良性或 DGA 生成时，深度学习模型的预测损失使用二元交叉熵进行估计：\n\n| $loss(p,e) = - \\frac{1}{N}{\\\
  sum\\limits\\_{i = 1}^{N}{\\lbrack e\\_{i}\\log p\\_{i} + (1 - e\\_{i}}})\\log(1\
  \ - p\\_{i})\\rbrack}$ | (23) |\n| --- | --- |\n\n其中 `p` 是测试数据集中所有域名的预测概率向量，`e`\
  \ 是期望类别标签向量，0 代表良性，1 代表 DGA 生成。\n\n在将域名分类为良性或 DGA 生成并将其归类到家族时，深度学习模型的预测损失使用分类交叉熵进行估计：\n\
  \n| `loss(p, e) = \\sum[x]p(x)log(e(x))` | (24) |\n| --- | --- |\n\n其中 `p` 是真实概率分布，`q`\
  \ 是预测概率分布。为了最小化二元交叉熵和分类交叉熵的损失，我们通过反向传播使用了 `Adam` 优化器 [39]]。\n\n### 8.3 尝试的其他替代架构\n\
  \n在选择所提出的深度学习模型（即 `CNN-LSTM`）时，我们还尝试了其他架构：\n\n-   堆叠 `RNN/LSTM/GRU/IRNN` 层\n-  \
  \ 堆叠嵌入层后接 `RNN/LSTM/GRU/IRNN/CNN/CNN-LSTM` 层\n-   堆叠 `convolution1d` 层以捕获非线性卷积激活\n\
  -   混合架构中堆叠 `convolution1d` 层后接 `RNN/LSTM/GRU/IRNN` 层\n\n### 8.4 评估结果\n\n所提出的深度学习和机器学习模型的性能在三个不同的数据集上进行了评估，例如\
  \ `Dataset 1`、`Data set 2` 和 `Dataset 3`。此外，训练模型在 `Dataset 1` 上的性能在 `Dataset 2`\
  \ 和 `Dataset 3` 上对域名分类为良性或 DGA 生成进行了评估。结果通过比较在 `[0.0−1.0]` 范围内不同阈值的两种操作特性（如真阳性率和假阳性率），以\
  \ ROC 曲线的形式给出。该指标独立于整个语料库中良性样本与恶意样本的比例。`Dataset 1`的 ROC 曲线显示在图 3 中，所有三个数据集的其他统计指标报告在表\
  \ 3 和表 4 中。在大规模域名语料库下，深度学习模型的性能优于 N-gram 或领域专家派导的特征。这表明带有深度学习层的嵌入可以作为自动特征提取器的稳健方法。此外，N-gram\
  \ 的性能优于领域专家派导的特征。这是由于大规模域名语料库的优势，且 N-gram 包是自然语言处理领域中的一种有效表示方法 [40]。\n\n![Image](img/fig6_3.jpg)\n\
