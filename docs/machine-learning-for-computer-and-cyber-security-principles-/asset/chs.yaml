  \ 14, 15, 18–20, 24]。\n- `Safety`（安全性）使网络变得可用且环境友好[17]。\n- `Confidentiality`（机密性）保证数据传输经过认证且防盗窃[16,\
  \ 17]。\n- `Integrity`（完整性）加强任何非法形式的数据修改[23]。\n- `Maintainability`（可维护性）和`adaptability`（适应性）是相互依赖的术语，包含两个能力：改进（意味着增强和维护）以及调整（意味着适应特定的条件集）[19,\
  \ 23]。\n\n![Image](img/fig3_3.jpg)\n**图 3：** 可靠性评估。\n\n- `Security`（安全防护），在此语境下，意味着保护数据免受内部或外部的攻击[13]。\n\
  \n(b) `Negative traits`（负面特性）会降低网络的可靠性（威胁）[4, 28]。`fault → error → failure`（故障 →\
  \ 错误 → 失效）链展示了网络中的这些特性[30]。威胁的汇总定义如下[21, 22, 27]：\n\n- `Fault`（故障）揭示网络中的缺陷，从而导致错误（图\
  \ 4）。\n- `Error`（错误）发生在运行时，并导致错误的输出。\n- `Failure`（失效）使网络无法工作[29, 31–33)]。此外，它会影响网络状态并使其从稳定变为不稳定（图\
  \ 5）。\n\n(c) `Positive traits`（正面特性）提高网络的可靠性（手段）。这些特性使得网络能够更好地适应用户需求或网络运行的环境。这些包括下文解释的故障预防、消除和容错能力[23,\
  \ 25, 26]：\n\n- `Prevention`（预防）包含了从初始设计阶段到最终维护阶段的转换。从初始阶段就开始防止 `error → fault`\
  \ 循环。\n\n![Image](img/fig3_4.jpg)\n**图 4：** 故障分类。\n\n![Image](img/fig3_5.jpg)\n\
  **图 5：** 失效分类。\n\n- `Tolerance`（容错）允许网络在出现故障的情况下继续工作。\n- `Removal`（消除）处理现有故障。\n\
  - `Forecasting`（预测）预测可能发生的故障。\n\n### 1.4 动机\n\n网络向用户提供预定义服务的能力被称为“可靠性”[4, 5]。当信任特性被引入网络中或数据流得到优化时，网络会变得更加可靠，从而提高整体\
