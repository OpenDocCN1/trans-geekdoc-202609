  \ 仿真时间 || 60 秒 |\n\n该收集的数据集保存在存储库中供后续访问。进行数据预处理 [42] 以移除冗余值（如果有）[43]，并将处理后的数据传递到下一阶段，即统计预测模型。\n\
  \n## 2.2 统计预测模型\n\n使用箱线图对数据集进行统计分析，展示数据所有特征的分布 [44, 45]（图 8）。该分析在 `R`（版本 3.3）中完成，并显示了数据集特定特征所在的最大和最小范围。该图是借助\
  \ `R` 仓库包含的 Rattle 库绘制的。\n\n同样，也可以分析数据集不同特征之间的相关性 [46, 47]。在图 9 中，负相关显示为黑色，正相关为灰色。\n\
  \n在此阶段，整个数据集被划分为训练-测试数据 [48, 49]。遵循的标准划分比例是训练集 70%，测试集 30%。然后通过识别问题所属的类别来选择预测学习模型。类别包括回归类型、分类（二分类或多分类）或聚类问题\
  \ [50–52]。如果预测的目标变量为小数类型，则属于回归问题；如果预测的目标变量为二值类型，则属于二分类问题。此外，如果预测的目标变量为多分类类型，则属于多分类问题并包含多个类别。\n\
  \n`R`（版本 3.3）提供了多种机器学习模型，根据问题的类型进行实现。在本章节中，我们将 `DF` 视为预测参数。`DF` 是该数据集的目标变量，因此问题属于回归类。选择四个机器学习模型来演示预测技术，即：线性模型、神经网络、随机森林和决策树。这些预测模型将基于相关系数（用\
  \ `r` 表示）、决定系数（用 `R²` 表示）、均方根误差（用 `RMSE` 表示）、准确率（用 `Acc` 表示）和耗时（用 `TT` 表示）进行评估。相关系数提供了有关实际值与预测值之间如何联系的信息。它可以通过卡尔-皮尔逊相关公式计算\
  \ [53]。相关系数的值位于 `[0,1]` 之间。值越接近 1，说明相关性越好。决定系数（`R2`）是回归评估的主要结果，其值处于 `0 < R2 < 1`\
  \ 区间。值越接近 1，回归模型的效果越良好 [54]。如果值为 0，则意味着回归模型失败。从数学上讲，它是相关系数平方的结果。均方根误差（`RMSE`）告诉我们实际值与预测值之间存在多少误差\
  \ [55]。准确率代表预测值接近实际值的程度，且在可接受的误差范围内 [56]。它预测哪种模型最适合某个问题。耗时告知机器学习模型执行所需的总时间 [56]。\n\
  \n**表 2：** 主要仿真数据集（洗乱的、部分数据记录）。\n\n![Image](img/tab3_2.jpg)\n![Image](img/tab3_2a.jpg)\n\
  ![Image](img/tab3_2b.jpg)\n![Image](img/tab3_2c.jpg)\n![Image](img/tab3_2d.jpg)\n\
  ![Image](img/tab3_2f.jpg)\n![Image](img/tab3_2g.jpg)\n![Image](img/tab3_2h.jpg)\n\
  ![Image](img/tab3_2i.jpg)\n![Image](img/tab3_2j.jpg)\n![Image](img/fig3_8.jpg)\n\
  \n**图 8：** 数据集特征的箱线图。\n\n![Image](img/fig3_9.jpg)\n\n**图 9：** 数据集特征之间的相关性。\n\n上述所有模型都需要\
  \ `R` 编程语言中的公式进行计算：\n\n```\nformula ← as. formula(paste(target,”~”,paste(c(selected\
  \ inputs),collapse = “+”)))\n```\n\n*线性模型：* 该模型是数据集特征或属性的线性混合 [70]。这意味着目标值与数据集的其他特征之间存在线性关系\
  \ [71]。`R` 中线性执行的代码为：\n\n```\nLinear Model ← lm (formula, train Dataset)\n```\n\n\
  *神经网络：* 这些网络基于分布在多个层上的人工神经元概念构建的 [72]。使用这些模型代替线性的一一对应关系，可以轻松识别非线性模式 [73]。输入层处理只接收输入的神经元。输入神经元的数量等于数据集的特征数量\
  \ [74]，在回归问题的情况下，输出层产生单个神经元以获得结果。整个计算发生在输入层和输出层之间的隐藏层中 [75]。`R` 中神经网络执行的代码为：\n\n\
  ```\nNeural Network Model ← nnet (formula, train Dataset, size=10, linout=TRUE,\
  \ skip=TRUE, MaxNWts=10000, trace=FALSE, maxit=100)\n```\n\n神经网络使用的调优参数为 `size`、`linout`、`skip`、`MaxNWts`、`trace`\
  \ 和 `maxit`。\n\n*随机森林模型：* 它是一种基于集的监督学习模型 [76]，其准确性取决于森林中生长的树的总数。树的数量越多，准确性越高 [77]。由于捕捉了许多输入变量的方差，使得更多的特征能够协作提高预测准确率，因此在大多数回归场景中具有更好的预测准确率\
  \ [78]。特征重要性是此类参数之一，可以通过该算法轻松计算 [79, 80]。`R` 中执行随机森林的代码为：\n\n```\nRandom Forest\
  \ ← random Forest (formula, train Dataset, ntree=5, mtry=2, importance=TRUE)\n```\n\
  \n随机森林模型使用的调优参数为 `ntree`、`mtry` 和 `importance`。\n\n\n\n\n\n### 决策树模型\n\n决策树可用于回归和分类类问题\
  \ [81]。该模型的核心概念是将数据集划分为较小的数据集 [82, 83]，这些数据集基于描述性特征进行概念化。这种划分一直持续，直到获得包含归类为单一特定标签的数据点的最小数据集。数据集的每个特征都是根，结果表示为子节点\
  \ [84, 85]。特定特征的划分取决于两个值——信息增益 [86]和划分产生的熵 [87]。回归问题中的连续值在根节点划分之前会被转换为分类值。在回归情况下，划分是信息增益参数决定的。决策树唯一的缺点是它会过拟合数据。在\
  \ `R` 中执行决策树模型的代码为：\n\n```\nDecision Tree ← rpart(formula, train Dataset, parms=list(split=‘‘information”),\
  \ control=rpart.control (use surrogate=0, max surrogate=0))\n```\n\n决策树的调节参数为 `parms`\
  \ 和 `control`。\n\n表 3 中计算的结果可以进行统计评估以获得最终结果。从表中我们可以得出结论：如果我们希望在准确性方面获得更好的结果，我们将选择线性模型和神经网络。同样，如果我们希望在误差方面获得更好的结果，我们将倾向于神经网络模型。简而言之，为了整体优化，我们需要决定哪些标准最符合应用需求。\n\
