  \ ACM。\n\n\n\n\n在过去的几年里，人们意识到安全失败是由糟糕的机制造成的频率至少与糟糕的设计一样样高 [2]。大部分研究社区关注的是提供技术解决方案以保护数据，而从经济角度进行的研究较少；在这一特定领域目前仅有少数工作\
  \ [3, 4, 5]。大型组织和公司缺乏合作防御攻击和威胁的激励。任何攻击的解决方案可以是技术性的，也可以是经济性的。不可否认的事实是，像 [6, 7] 这样的协作技术解决方案是有效的方案，但组织缺乏实施这些方案的激励；因此，必须优先考虑经济解决方案，以为正确的方提供更强的激励。\n\
  \n通常情况下，防御威胁和攻击的方并非受害方，而受害方并非防御方。\n\n这就是为什么在软件世界和 IT 行业取得了如此进步后，我们仍然缺乏经济解决方案的主要原因。为了实施经济解决方案，我们需要理解什么是激励链，以及在互联网上应对哪些方提供激励。互联网世界是服务器、ISP、路由器、内容提供者和终端用户等多个实体的协作。每个方都需要强烈的动力（无论是金钱还是任何形式的利润）来相互合作为终端用户提供优质服务。这种动力在技术解决方案中被称为“激励缺失”。例如，边界处的网关路由器保护特定网络免受攻击。由于这一行动，终端用户和内容提供者是受益最大的方。网关路由器几乎不会遭受终端用户或内容提供者的任何损失。我们需要为网关路由器提供强力的激励（动力），以便它在未来表现得更好。这并不意味着终端用户和内容提供者直接给网关路由器钱。事实上，我们需要建立正激励链，让资金从一个方转移到另一个方，最终到达网关路由器。\n\
  \n每个组织对针对网络攻击的安全投入都有特定的预算。由安全专业人员决定，预算的一部分固定用于花在方法和工具上，例如在系统上安装防火墙、入侵检测系统和反病毒软件。剩余金额用于聘请第三方处理所有与安全相关的违规。现在，聘请第三方完全取决于组织的规模和可用资源。小型公司无法负担第三方的巨额费用。这是经济解决方案的主要缺点；它对所有规模的组织都不友好。技术解决方案有其局限性，经济解决方案也有其局限性，但要建立有效的解决方案，我们需要将技术解决方案与基于激励的解决方案相结合。在本文中，我们关注经济解决方案以及对基于激励的解决方案的迫切需求。\n\
  \n## 2. 基于经济解决方案的文献综\n\n如上所述，信息安全管理是一个成熟的领域，很大程度上关注技术解决方案（防火墙、入侵检测系统、加密技术、访问权限），如\
  \ [8, 9, 10, 11, 12, 13, 14]，而在同一领域关于经济解决方案的工作非常少。在 2001 年，Anderson [15] 以及 Gordon\
  \ 和 Loeb [16] 对这一主题引起了兴趣。在 [15] 中，安全研究人员之前发现许多许多空白和问题通过微观经济学概念得到了解决。他还通过经济学概念总结了许多信息安全问题。尽管拥有资源，组织缺乏一个告诉如何向信息安全投入资源的概念框架。在\
  \ [16] 中，从业务角度提出了一个经济模型，用于计算组织在信息安全上投入的最优金额。该模型考虑了两个主要因素——信息的脆弱性和与脆弱性相关的潜在损失，以计算安全信息的最优投资水平。本文的主要目标是实现安全投资利润最大化。\n\
  \n在 [17] 中，提出了一种使用净现值（NPV）模型的资本投资预算过程，根据成本效益分析计算安全支出。使用 NPV 模型背后的主要驱动力是它允许公司计算从信息安全投资中获得的收益和利润。然而，在他的调查中，他也显示某些受访者不使用\
  \ NPV 模型来估计安全支出，但大多数受访者将安全违规导致的潜在损失以及未来发生此类违规的概率视为估计安全金额的重要因素。但无论如何，每个组织都在使用经济分析和原理来处理预算以确保安全。\n\
  \n在 [18] 中，研究人员展示了证据，如果安全违规损害了公司的机密性，那么市场对受害公司会有明显的负面反应，这无疑会影响公司未来的经济表现。但这项调查存在许多局限。另一作者\
  \ Riordan 在 [19] 中研究了在网络外部性存在时提供经济激励解决方案。同样在这一方向上，作者 [20] 研究了安全投入取决于网络中其他代理。他们首先为航空公司系统开发了一个相互依赖安全（IDS）模型，然后将该模型应用于网络安全、防火保护等许多应用程序。网络上的每个节点都会针对外部攻击进行安全投入，但不是针对内部病毒，病毒可以轻易破坏系统并成为其他网络的攻击源。在\
  \ [21] 中，作者展示了当补丁成本很高且负外部性影响网络安全时，用户的激励如何影响网络安全。他们表明，对于专利软件，补丁回扣（用户因修复漏洞而获得厂商补偿）和自我修复占主导地位，而对于免费软件则严格自我修复。在\
  \ [22] 中，作者提出了一个模型，研究负面市场外部性下漏洞披露的最优决策。\n\nMoore 等人在 [23] 中对 2001 年 7 月 19 日“Code\
  \ Red”蠕虫的攻击进行了案例研究，尽管这次攻击是一次国际性事件且主要注意力集中在大型企业的损失上，但很大一部分受害者是家庭用户和小公司。从这一事实可以清楚，与大型组织相比，家庭用户的激励更少。\n\
  \n\n\n\n在[24]中，作者提出了一个补丁管理的博弈论模型。他们证明了的补丁发布周期和企业的补丁更新周期并不一定成正比，但通过分配责任和成本分摊可以同步。在[25]中，Moore\
  \ 等人表示，投资回报率（RoI）在某些情况下可以优化使用，但并非适用于所有场景。\n\n在企业具有互联 IT 关系的情况下，存在大量的文献综述。在[26]中，企业之间的相互依赖性变成了负外部性，并导致企业的投资水平低于最优水平。在过去的几十年里，许多研究人员提出了各种模型，以使企业能够对安全投资做出最优决策，在正、负市场外部性的影响下对漏洞披露做出最优决策，许多工作展示了低层级或家庭用户中激励的重要性，以及安全外包的重要性。\n\
  \n后续章节将讨论激励机制和网络安全保险的重要性，以及提供经济激励解决方案的应用。\n\n# 3. 网络安全保险\n\n到目前，我们提到了正确对齐激励的重要性。沿着同样的思路，我们研究了保险，它是互联网世界中风险管理的强大工具。通常，互联网上的风险管理涉及对技术和方法的投资，以缓解风险、减少攻击强度和后果，因此几十年来一直是大型研究社区关注的焦点[27,\
  \ 28, 29, 30, 31, 32, 33]。保留风险并对其进行分析以供未来改进也是缓解风险选项之一。在部署上述方案后，我们仍然面临一些残余风险。此时，网络安全保险发挥了作用。网络安全保险使个人或企业能够通过预定义的定期支付来恢复因不确定事件造成的损失。在后续章节中，我们将讨论网络安全保险的需求及其重要性。\n\
  \n尽管在检测和缓解网络攻击的技术和方法方面有所进展，但由于许多原因，我们并未接近完美安全，例如：(i) 缺乏提供针对所有类型攻击防护的技术解决方案；(ii)\
  \ 终端用户、安全提供商和网络法律执法机构之间的激励链薄弱；(iii) 免费车问题，即实体利用他人投资安全措施产生的后果来逃避对安全措施的投资；(iv) “柠檬市场”效应，即安全提供商缺乏足够的激励在市场上推出性能稳健的产品[34]；(v)\
  \ 在没有强激励的情况下，没有任何互联网实体准备好对另一方造成的损害承担责任。考虑到这些点，我们需要将范式转移到更有效的风险管理解决方案。网络安全保险正在成为这一方向上的一个成熟工具。\n\
  \n在网络安全保险中，组织聘佣第三方来处理所有攻击风险，以换取保费（经济激励）。网络安全保险是企业安全外包的一种。许多因素，如市场竞争、相关企业的预算、安全的质量和类型，都会影响特定组织的决策。我们从网络安全保险中获得的主要优势是：首先，它让组织承担部分责任，通过`firewalls`或安装`anti-viruses`来确保系统安全以降低保费[35,\
  \ 36]；其次，这种网络安全保险做法为保险人寻求为用户提供最佳服务设定基准和标准[30, 37]；第三，它提高了保护质量；最后，也是最重要的，它改善了社会福利[36]。\n\
  \n我们需要提到一个重要事实，一些人认为网络安全保险是百分之百稳健安全的替代方案。这是错误的。事实上，网络安全保险是管理和处理网络风险的一种选择。现在让我们讨论该领域的一些最新趋势。根据保险协会的调查[38]，2016\
  \ 年的泄露事件从 2015 年的 780 次上升到 109 次（百万），但与此同时 2016 年仅为 3700 万，远少于 2015 年的 16900 万，这并不好。受这些泄露影响严重的行业占\
  \ 2016 年总泄露次数的 45.2%。2017 年发生了 202 次泄露。最大的数据泄露事件由雅虎于 2017 年 10 月报告，影响了近 30 亿账户。根据健康信息学的调查，21%的企业承认由于网络攻击造成的金钱损失逐年增加。根据卡斯斯基的报告[39]，平均情况下，一次安全事件的成本对大企业为\
  \ 86 万美元，而中小企业（SMBs）则为 8.6 万美元。CSIS 计算，全球年度安全损失在 2018 年将达到 50 亿美元，到 2020 年将达到 75\
  \ 亿美元。\n\n让我们理解企业如何在不假设市场外部性和竞争的情况下做出决策的[4]。例如，如果一个组织有 500 万美元的安全预算，投入 200 万美元用于`firewalls`、入侵检测系统、`anti-virus`等设备，并将剩余的\
  \ 300 万美元用于雇用第三方监控和分析所有的安全活动。假设公司每月的安全支出为 10 万或 20 万美元，概率相等。我们假设第三方可以轻松管理这些泄露，`(12*100,000)`\
  \ 120 万美元或`(12*200,000)` 240 万美元是节省的资金。这两种结果的概率相等。因此，额外投资的净值为`(0.5*12,000,000 +0.5*24,000,000)`\
  \ 1800 万美元，这由第三方处理。现在，`(30,000,000-18,000,000)` 1200 万美元是组织在 IT 外包上的额外投入。在这里，投资\
  \ 300 万美元网络安全保险并不是一个好的选择。\n\n与此同时，如果我们把预算减少到 200 万美元，那么组织可以考虑将安全外包为`(20,000,000-18,000,000)`\
  \ 200 万美元，这远小于 1200 万美元。但如果我们进一步减少投资到 100 万美元，那么`(18,000,000-10,000,000)` 800 万美元就是这项额外投资的净期望值。因此，该价值的预期回报率是`(8,000,000/10,000,000)`或\
  \ 80%，这是一个非常好的数字。如果预期回报率是 80%，那么公司可以毫不费力地在安全上投入百万美元。这就是工业内采取决策的方式。\n\n\n\n\n\n在本节中，我们将重点介绍过去几年推动网络保险演变的一些重大事件。\n\
  \n早些时候，保单并未将互联网上的数据丢失视为物理损坏，也没有将其纳入保障范围。保险公司将网络财产视为无形财产，因此认为对其造成任何损害是不可能的；这成了保险公司与企业之间冲突的焦点。尽管拥有商业综合责任险（`CGL`）保障，企业仍开始对各种威胁感到不安全。随后，在\
  \ 20 世纪 90 年代初，一些规则和法律开始支持“互联网数据丢失可被视为物理损坏”这一事实。[40] 是第一个凸显了保险公司与客户之间冲突的案例，在该案中，法院宣布计算机磁带和数据是有形财产，因为数据具有永久价值。另一个案例\
  \ [41] 中，在因系统故障导致数据丢失的情况下，法院倾向于被保险人一方。同样，在另一个案例 [42] 中，法院宣布计算机 `RAM` 中编程程序的丢失构成了物理损坏或损失。与此类似，许多案例不断引发质疑，且法院对被保险人表示了认可。此外，另一个问题是，虽然大多数\
  \ `CGL` 保单没有全球覆盖范围，但许多网络侵权行为是国际性的 [43]。1998 年，“ICSA`（国际计算机安全协会）引入了原始形式的黑客保险保单。网络风险和漏洞并没有发生突然转变，从而产生对网络保险的需求。彻底改变网络风险概念的两个重大事件分别是\
  \ `Y2K`（千年虫）和 `9/11` 袭击。`Y2K` 是一个臭名昭著的被称为“千年虫”的病毒。它格式化了全球日历数据，导致 2000 年和 1900 年无法区分。这是公司首次意识到网络风险如何对电子商务造成潜在损害的事件。\n\
  \n第二个事件是针对世界贸易中心的 `9/11` 袭击事件，它完全改变了安全专业人员对网络风险的认知。在那一年中，包括 `NASA`、`FBI`、`美国参议院`和国防部（`DoD`）在内的多个美国政府机构在\
  \ `9/11` 前后遭到黑客攻击。这是针对美国主要公司的一系列 `DDoS` 攻击。2011 年被视为 IT 保险与网络风险深度关联的一年。\n\n历史上还有一个最重大的事件——`TJX`\
  \ 黑客攻击 [44]。2007 年，在 18 个月的时间里，4500 万客户的信用卡和借记卡信息被盗。黑客在公司网络中植入了非法软件并盗走了所有用户的个人数据。据报道，攻击发生在\
  \ 2006 年 5 月，并在七个月后的 2006 年 12 月中被发现。这一事件导致公司损失了近 500 万美元。此外，这一事件完全摧毁了公司的声誉。除了财务损失，公司在市场上还遭受了巨大的声誉损失和品牌损害。经过法庭听证，发现实际上有\
  \ 9400 万客户受影响，几乎是 4500 万的两倍。这次数据泄露是历史上规模最大的，在这一事件之后，公司被迫考虑针对网络风险的替代解决方案。他们开始意识到，尽管在\
  \ 100% 稳健的安全解决方案上投入了巨资，他们并不安全，而且大品牌公司和大型企业也是如此。如果大品牌都是如此，那么小型机构和企业呢？\n\n除了推动网络保险增长的重大事件外，不同国家的法律也是推动网络保险显著增长的驱动力。2003\
  \ 年，第一部数据泄露通知法开始实施，规定公司必须白纸黑字地对客户和监管机构负责 [45]。在欧盟，2009 年颁布了针对电信和 `ISP`（互联网服务提供商）的《电子隐私条例》，因为这些公司拥有海量的客户个人数据数据库。因此，监管机构考虑对银行和保险公司罚款，并在发生任何数据泄露事件时，公司必须通知客户以及上级机构。网络保险公司不断根据变化的法律修改其保单，以便以客户可以负担的保费涵盖网络风险和漏洞的每一种可能性。尽管有许多因素使得网络保险市场如此巨大，例如市场地位、来自其他保险提供者的竞争，以及通过保单获取利润的愿望（这些保单设计精良，从被保险人的角度涵盖了所有可能的网络风险，但同时，保单在发生数据泄露或冲突时也能支持保险公司）。然而，2000\
  \ 年以来过去十年的重大事件对网络保险从传统、基础、原始向全面的增长做出了巨大贡献。\n\n### 3.2 风险评估\n\n网络保险是一个统术语，涵盖了由于网络攻击或数据泄露事件导致的甲方和第三方损失。网络保险提供者面临着许多挑战，例如设计涵盖所有可能风险的保单，同时他们试图通过应用某些条件、免责条款或限制来忽略某些高概率的不利事件。涉及风险评估的过程非常复杂，且在这样一个不断变化的环境中尚未定义；包括如何将识别出的风险和设计的保单转化为制定良好的、具有盈利性的保费（既不能太低以免公司面临亏损，也不能太高以免客户没有需求）；以及道德风险问题。在本节中，我们只讨论风险评估因素。\n\
  \n风险评估是网络保险保单承保的重要环节，因为网络攻击会对受害者产生经济影响，任何形式的计算错误或在保费公式中未考虑微小因素都可能导致公司陷入困境（财务和声誉损失）。从从开始，风险评估方法是有缺陷的，因为政策编写者信任并不足够的因素，例如公司过去的数据泄露事件、当地监管机构设定的标准或基准以及\
  \ IT 市场（竞争对手的政策框架和市场状况）。但互联网的变化和网络攻击的普及受更多于上述因素的影响，这些因素确实值得考虑。在过去的十年里，风险评估范式发生了巨大变化，从仅检查正确安装和部署的防火墙、`IDS`\
  \ 和防病毒软件的传统评估流程，转变为对公司概况进行彻底分析的新型全面性前评估。现在的风险评估程序不仅提供了公司安全概况的静态数据总结，还提供了关于公司状况更有意义的统计数据。\n\
  \n\n\n\n传统的风险评估流程未能充分发现公司安全投资在缓解重大风险方面的影响，但现在风险评估公司会生成问卷或清单，其问题涵盖了从物理安全到网络漏洞的范围；它们涉及公司的\
  \ IT 基础设施、安全投资预算、当局和员工为确保安全而遵循的实践、公司管理的数据类型、公司外包的服务、公司与其他保险公司过去和现在的关系，公司当局必须引用规定提供虚假信息是犯罪的国家法律。他们将清单分为四个主要领域，即：组织、数据管理、网络文化和风险暴露程度。表\
  \ 1 给出了这些领域的描述 \\[46]。\n\n**表 1：** 各领域名称的描述。\n\n| **序号** | **领域名称** | **描述** |\n\
  | --- | --- | --- |\n| 1. | 组织 | • 通用 • 基础设施 • 危机管理 • 高层管理 • 数据泄露历史 • IT 安全预算 |\n\
  | 2. | 数据管理 | • 需要保护的数据类型（客户个人数据，如信用卡/借记卡信息，或贸易秘密或专利知识） • 访问管理 • 安全设备的部署 • 恢复措施\
  \ |\n| 3. | 网络文化 | • 员工检测威胁的 • 针对威胁的响应措施 • 威胁可见性 • 网络使用政策 |\n| 4. | 风险暴露程度 | • 业务类型\
  \ • 漏洞评估 • 对外包服务的依赖 • 与外包供应商的关系 |\n| 5. | 法律与合规 | • 是否严格遵守国家法律 • 是否遵循了特定行业标准？ |\n\
  \n这种检查并将公司概况划分为不同领域的新型整体方法，从不同维度彻底量化了网络风险。这种新方法通过检查公司的外包依赖（寻求第三方帮助提供服务），来检查第三方或分包商可能向申请人网络引入了何种漏洞或风险。除了监控和分析可能导致数据丢失事件的其他外部因素外，该方法还检查了组织在其内部实施的网络文化。在事后方法中，网络保险公司会定期进行风险评估，以优化风险优先的决策。\n\
  \nIT 市场的进步、攻击手段的多样化、拥有完美网络攻击计划的新型网络恐怖分子的出现、市场竞争以及稳健安全性的缺乏等因素，使得这种方法适用于风险评估。\n\n\
  ## 4. 激励的需求\n\n为了使互联网成为安全的数据存储地并实现安全交易，所有政府、非政府（营利性和非营利性的公共或私营企业）都需要齐手来防御网络攻击，并将网络安全视为社会福利。组织应停止将对网络安全的投资视为一种盈利过程。这是我们为确保互联网安全应该做的第一件事。\n\
  \n其次，在我们完善维护系统的人员之前，维护系统的人员需要齐手防御网络攻击，并将网络安全视为社会福利。组织应停止将对网络安全的投资视为一种盈利过程。这是我们为确保互联网安全应该做的第一件事。\n\
  \n（注：原文后续存在大量重复段落，此处已根据要求保留核心内容并进行去重处理。）\n\n\n\n\n2000 年初，人们目睹了一场 DDoS 攻击，针对 Yahoo、Amazon\
  \ 等大公司发动了一系列 DDoS 攻击。这种 DDoS 攻击涉及向目标系统灌入巨大的数据包流量。Varian \\[48\\] 将解释为一种激励错配的案例，即用户愿意在防病毒软件上花钱，但不愿意花钱购买能够防止其系统被用于攻击第三方的软件。\n\
  \n网络攻击的结果不仅是因为网络层面的缺乏激励，也源于组织层面的缺乏激励。黑客和网络攻击者拥有他们自己的隐性市场经济，这使得那些仅具备计算机知识、拥有良好激励且具有攻击新想法的人很容易进入。这种隐性市场经济的特征与可见的防御市场经济完全不同。攻击者总是利用攻击者与防御者之间不平衡的激励。根据对\
  \ 800 名 IT 安全专业人员的调查报告 \\[49\\]，存在三类让防御者处于劣势的主要激励错配。要点如下：\n\n1. 第一种激励错配发生在攻击者和防御者之间。安全专业人员的激励由许多因素决定，例如自上而下的决策方法，并受到特定公司和其所在国家监管机构所设协议的限制；而攻击者的激励则受到个人利益和隐性去中心化市场经济的影响。\n\
  \n2. 计划方法与其执行之间的激励不平衡。每个组织都有明确的应对网络攻击的方法，但由于某些原因，许多组织未能从实践中实施。许多策略仅停留在文档中。\n\n3.\
  \ 政策制定者与政策执行者之间的激励错配。制定政策的高层权威与将政策付诸实践的操作员在激励的感知上存在很大差异。\n\n网络攻击者拥有金钱、名誉等直接激励，但网络数据防御者只有间接激励。该报告的另一个事实是，设计政策的高层对激励效果的信任超过了对低层政策执行者的信任。这可能是由于底层员工对现有激励不了解。如果将从攻击者隐性市场经济中学到的知识应用到组织的工作环境和安全提供市场，那么许多错配就能得到修正。我们需要在操作层面增加更多激励，并使激励的层级分布实现均匀。黑客社区利用市场力量的比防御者更有效。他们知道如何利用竞争和市场价格来降低新进入者的门槛，并帮助他们利用暴露漏洞以及实施攻击的新想法。其次，漏洞的公开披露对攻击者和防御者的影响不同。漏洞公开披露减少了攻击者在漏洞研究中的努力和成本，而防御者修复这些漏洞则需要一些时间。\n\
  \n因此，将责任分配给正确的方、在正确的点和政策执行者层面增长激励、通过实验为风险评估和激励创建过程提供正确的指标、更多地使用外包安全以及促进信息共享，可以帮助修正激励的错配。\n\
  \n## 4.2 影响安全的外部因素\n\n互联网世界受到许多普遍、松散且巨大的外部性的影响。外部性是指公司由于他人的决定而必须遭受的成本（或收益）。外部性的影响不会反映在市场价格中。它是公司由于别人的决定而导致的福利损失或增加。例如，如果一个工厂拥有熟练的工人，那么该工厂的产量无疑很好；这就是正外部性。但如果一个用户不保护他的系统，那么对其他用户来说可能产生负外部性，因为这个不安全的系统可以被当作僵尸网络的一部分，用来攻击其他方。\n\
  \n软件供应商之间为了争夺用户的钱包而存在竞争，并不太关心最重要的特性——安全。我们以多种方式支付 IT 安全漏洞的代价：金钱损失、声誉损失。安装安全功能需要额外的资金、精力和时间、设备性能下降、用户困扰以及产品上市推迟。不关注安全的后果对软件供应商来说损害较小，因为他们只需要面对间歇性的负面报道、一段时间的服务中断以及用户转向其他服务提供商。因此，每家大企业在安全方面做的与每个组织所的一一样。这些并不是影响网络安全外部性的唯一因素。\n\
  \n作者 Hirshleifer \\[50\\] 提到了弱链法则。传统上，我们假设对公共物品的保护取决于保护小组所有成员努力的总和。但在文中，作者通过一个例子解释了公共物品的保护取决于特定小组中最弱环节的努力。他通过一个例子说明了：一个名为\
  \ Anarchia 的岛屿，当岛上的每个家庭都建造防御设施时，可以免受洪水侵害，现在岛屿的安全完全取决于最弱（最懒惰）的家庭所建立的防御。他进一步将这个例子与\
  \ ICBM 攻击进行了对比。Varian \\[51\\] 扩展了这项工作，展示了系统可靠性取决于三种情况：总努力、弱链和最佳机会。在努力总和的情况下，系统可靠性主要取决于具有最高成本效益比的链路，所有其他单位对该链路所采取的措施进行“便车”。另一位作者\
  \ \\[52\\] 将正外部性定义为免费车问题的原因。他指出，采取防御措施的人可以为他人产生正外部性，但同时，这可能鼓励其他用户不采取足够的防御措施。这一理论在现实生活中也有意义。如果两个邻居共用一个花园，一个家庭定期打扫，那么对另一个家庭产生了正外部性，但同时也阻碍了另一个家庭去打扫花园。通常，正外部性和免费车问题是同一硬币的两面。\n\
  \n在 \\[53\\] 中，作者们展示了一个事实：正消费外部性直接或间接地影响了新技术的采用，例如当前使用该技术的用户数量会影响用户采用该技术的决策。用户从技术中获得的效用与消费该技术的人数成正比。同样，另一种网络外部性是兼容性。如果新技术能够在用户已有的硬件上运行，那么它就能帮助用户采用新技术。同样，高效防御机制的部署取决于使用它的人数以及它与用户已有技术的兼容性。但每个人都在等待另一个用户先使用技术并给出评价，结果导致高效技术永远无法被实施。\
  \ \\[54\\] 试图为这些问题提供解决方案。\n\n\n\n\n此外，软件供应商将安全视为一种额外功能，除非能为公司带来利润，否则他们就不会尽全力。供应商试图在构建安全软件的成本与不安全软件的收益之间取得平衡。由于他们仅考虑自身所承担的安全软件成本的这种不恰方法，他们忽略了整个互联网空间以及其他公司和用户所承担的成本。由于这些软件，买家不得不花钱投入到安全中。这也是网络安全的一种外部性。许多因素都是如此，例如软件垄断对可用高质量产品的限制、“锁定效应”——公司最初仅提供最少的安全，一旦他们在市场中立足或获得了一定数量的用户以开展良好业务，他们就开始缓慢地增加安全性以锁住客户；而兼容性问题使得客户切换公司变得非常困难，这再次构成了网络安全的外部性。\n\
  \n非常悲哀的是，没有一家公司将安全作为一种区分性特征。公司宁愿接受暂时的负面报道，也不愿在软件开发周期的初期嵌入安全功能。并不是我们缺乏安全的解决方案或协议，而是我们缺乏实现它们的正向外部性。\n\
  \n## 5. 应用\n\n在本节中，我们将讨论经济解决方案在解决安全数据泄露中的应用。\n\n## 5.1 漏洞交易\n\n漏洞的公开是否会导致洁净的网络空间，长期以来软件供应商和安全研究人员之间讨论的话题。已有许多文章关于软件漏洞以巨额进行出售和购买的市场。参与这项业务的不仅有软件公司和网络攻击市场，还有许多政府机构也在从事同样的业务。十年来，这个买卖漏洞的市场有了大幅增长。一些研究人员发表了关于漏洞相关问题的论文。此外，我们还将讨论作者所完成的一些重要工作。\n\
  \n在 `[55]` 中，作者指出，一个存在许多漏洞的软件，修复其中一个并对攻击者发现另一个漏洞的概率产生很大影响。除非发现了相互依赖的漏洞，否则应该应对漏洞进行披露或持续补丁。\n\
  \n开源和免费软件供应商认为，向所有用户提供源代码是安全的一好一步，因为用户、专业人士和研究人员可以发现漏洞；而对手社区认为认为，如果软件代码公开，那么攻击者发现漏洞将花费更少的努力。现在我们有一个问题：哪种漏洞公开方式更有帮助——是攻击者还是防御者？\n\
  \nAnderson `[56]` 在 2002 年显示，在某些假设下，源代码的开放对攻击者和防御者同样有利。根据他的研究，他发现开源软件和专有软件具有相同的安全水平。另一位作者\
  \ `[57]` Ozment 讨论了立即披露（在补丁准备好之前发布漏洞报告）和负责任披露（在补丁准备好之后发布漏洞报告）。支持立即披露的社区认为，立即披露漏洞会迫使软件供应商立即提供补丁，同时鼓励用户缓解攻击风险。支持负责任披露的社区认为，立即披露会导致攻击者更容易发现漏洞，从而导致可能产生巨大成本的攻击。在论文接下来的部分，他调查了\
  \ `FreeBSD` 中的漏洞，发现漏洞存在关联，并且确实可能被重新发现 `[57]`。此外，Ozment 和 Schechter 还发现，核心且未更改的 `FreeBSD`\
  \ 操作系统独特漏洞的披露率在六年内有所下降 `[58]`。这些研究人员声称，漏洞的披露通过提高安全性延长了软件的寿命。漏洞披露为软件供应商提供补丁提供了必要的动力\
  \ `[59]`。在 `[60]` 中，Arora 等人扩展了 `[59]` 的工作，并通过实证研究发现与公开披露相比，私人披露使得供应商对漏洞的响应降低。他还指出，尽管披露会导致攻击数量增加，但同时会导致报告漏洞数量减少。\n\
  \n因此，我们可以清楚地看到研究人员和软件供应商对漏洞披露持有矛盾观点。软件供应商需要理解设计安全软件的成本低于漏洞公布后打补丁的成本。除了成本之外，供应商还要面临声誉损失，我们又怎么忽略编写和部署补丁的成本呢？正如之前在\
  \ `[16]` 中讨论的那样，Gordan 和 Loeb 提出了一个模型，证明保护高漏洞信息是昂贵的，因此公司专注于保护具有平均漏洞的信息。他们还分析说，为了优化安全投资的预期利润，公司应该只花费安全泄露事件预期损失的一小部分。\n\
  \n一个具有社会责任感的白帽黑客在发现漏洞后，会负责任地向相关公司报告，以获得某些资金奖励。在这种情况下，没有一方面临损失，因为相关公司现在可以修复补丁，而白帽黑客获得了奖励，且没有发生与该相关的的网络攻击。但讽刺的是，黑帽黑客将同样的漏洞报告给隐藏的网络攻击市场反而更有利。我们需要鼓励白帽交易，因为许多公司已经启动了许多提供漏洞报告激励的计划。例如，Google\
  \ 的“零计划”就是这样一项计划，雇佣全职研究人员寻找漏洞并向相关公司报告。该方案中还有一个有效的规定——如果相关公司未在 90 天内修复漏洞，该网站将公开其名称。不可否认的是，所有互联网实体中的一方都必须为这些漏洞付费，要么是支付给顾问的费用，要么是支付给外包安全的费用，或者是许多其他直接和间接损失。因此，从软件开发之初就开始投资修复漏洞和缺陷会更好。\n\
  \n## 5.2 隐私经济学\n\n互联网提供无与伦比的隐私机会同时也提供了隐私丧失的机会。有许多法律法规被用来保护隐私，并得到了用户和专业人士的大支持。还有许多技术可以提供良好的安全性来维护隐私\
  \ `[61]`。我们已经讨论过，公司实施良好技术解决方案的动力并不强。\n\n\n\n\n\n每个人都关注隐私，但很少有人为保护隐私采取实际行动。人们对隐私表示极度关注，但在几乎没有或完全没有激励的情况下，不愿花几分钟在互联网上提供自己的个人信息。这种互联网上言论与行动之间的差距，促使许多研究人员投入时间关注这一领域。\n\
  \n在`[62]`中，作者提出了一个模型来研究各种监管法律对安全投资的影响。他们指出，被攻破的企业必须向当局报告安全投资情况，这导致了对违规检测的过度投资，以及对预防性技术的投资不足。在`[63]`中，提出了一种效用分析方法，供企业决定是否需要投资内部安全措施或外包安全。在论文`[64]`中，作者展示了用户关于保护隐私的决策受到许多因素的影响，例如信息不完全，而且即使在信息完全的情况下，由于用户无法对海量数据集做出理性行动，他们也会为了短期利益而牺牲长期隐私。\n\
  \n在另一项行为研究`[65]`中，作者对学生进行了调查，用以衡量他们在不同场景下的隐私偏好，并显示：一组学生阅读了所有的隐私政策，以确保他们的答案在未来永远不会与自己关联，并在总问题中只回答了几个问题。而另一组被要求在某个没有隐私功能的网站（与他们的大学网站无关）上回答问题的学生则透露了他们所有的个人信息。在`[66]`中，作者调查了隐私缺陷泄露以及与隐私相关的数据泄露对消费者未来购买的影响。如果`[18]`所示，报告安全数据泄露的公司损失了机密信息，那么此类公司的股价更有可能下跌。因此，隐私经济学主要作用于公司和用户与个人数据的行为。在这里，激励机制对用户和企业增强安全功能也同样起着主要作用。\n\
  \n## 6. 结论\n\n最后，我们得出结论：解决安全漏洞的经济解决方案与技术解决方案同样重要。在本章中，我们尝试就经济解决方案的重要性、网络保险、责任归属、在相关方建立适当激励机制的增长、安全面临的外部性，以及与漏洞和隐私相关的贸易提供一些有用的见解。如果我们成功地提供了激励并纠正了经济问题，供应商就可以实施高效的技术解决方案。任何级别的用户，无论是家庭用户还是大型企业的安全经理，都必须理解他们对网络上其他实体的责任，并在保障系统安全方面尽最大努力，因为网络安全是相互依赖的。外部性在监管网络安全方面也起着重要作用。\n\
