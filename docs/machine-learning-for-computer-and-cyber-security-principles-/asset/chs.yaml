  \ L` 亮相。Android Lollipop 具有一个围绕响应式设计语言构建的全新设计的用户界面。在 `Android L` 中，可以从锁屏访问通知，并在屏幕顶部的应用程序中显示。Google\
  \ 对其进行了内部更改。\n\n\n\n\n\n### 引言\n\n入侵者的心理很难解读，因为入侵者攻击背后可能存在各种原因。首要且最重要的原因就是金钱。尽管大多数黑客并非出于财务利益驱动，但仍有许多犯罪分子利用他们的黑客技术来赚钱。他们主要通过在市场上投放虚假的电子商务应用程序或在互联网建立网站来收集敏感的信用卡和借记卡详情。然后他们将这些信息泄露到自己的远程服务器，再利用这些信息从合法用户那里窃取资金。许多攻击者或入侵者攻击设备只是为了监控用户及其日常活动。在这种情况下，攻击者可能是朋友、家庭成员，甚至是商业竞争对手。网络间谍在如今已不再不寻常，许多组织为了维持自己的地位并领先于其他竞争对手，沉溺于这种不良习惯。这些组织雇佣第三方专家来为他们做脏工作。通常情况下，攻击者入侵设备的动机是为了窃取用户的知识产权。据说，某些攻击者沉迷于黑客行为仅仅是为了寻求刺激和快感，或者为了获得关注而进行某些噱头。有些攻击者只想破坏社会的正常运行，他们的主要目标是尽可能给普通后代造成麻烦。而另一些攻击者攻击设备只是为了将其作为大规模攻击的工具，例如作为\
  \ `DDoS` 攻击的一部分，或作为其非法材料（如盗版软件或色情内容）的存储媒介。当攻击者损坏设备并破解设备上所有的敏感数据时，身份盗用也是常见的现象 [[19]]。因此，攻击的分类虽然很难定义，但为了窃取信息和任何方式伤害用户而攻击设备都是犯罪行为，没有任何理由可以证明此类行为。针对智能手机的一些最新攻击列在[表\
  \ 2]中。\n\n事实上，实际上任何拥有智能手机设备并连接到互联网的人都容易被这些入侵者破解、被恶意软件攻击或被恶意应用程序渗透。因此，在保护设备免受攻击方面，需要一些主动的方法。需要以任何可能的方法对抗这些攻击者，并确保设备使用的安全和可靠。\n\
  \n在本文中，我们提出了一种原型方法 `Droid-Sec`，旨在当用户无意或刻意尝试从应用市场下载并安装恶意应用程序时，识别任何恶意程序。我们的方法在检查应用程序时给用户一个合理的警告，告知所安装的程序是恶意的，可能会损坏设备并将个人和敏感信息泄露给未知来源。\n\
  \n**表 2：** 近期移动设备受攻击统计。\n\n| 序号 | 名称 | 描述 |\n| --- | --- | --- |\n| 1. | `SMSZombie`\
  \ | 应用程序内部隐藏了一个木马病毒，用于向在线支付系统发送昂贵的短信并窃取敏感信息。 |\n| 2. | `Angry Birds: Space` | 在非官方应用商店发现一个与原版\
  \ `Angry Birds: Space` 同名的虚假应用，它会在用户的设备上安装恶意软件。 |\n| 3. | `Super Battery Charger`\
  \ | 该应用程序本应在安装后延长智能手机的电池寿命，但实际上被用于发送昂贵的短信。 |\n| 4. | `FakeInst` | 发现该恶意软件属于 `FakeInst`\
  \ 家族，它也用于向主要位于俄罗斯的高收费号码发送短信。 |\n| 5. | `LuckyCat` | 中国黑客创建了这种针对 Windows 和 Macintosh\
  \ 操作系统的间谍软件，它在下载和安装后会打开后门。 |\n| 6. | `Unknown` | 用户的移动汽车网络被入侵，属于客户和驾驶员的所有敏感数据被第三方泄露到远程数据库。\
  \ |\n\n`Droid-Sec` 利用基于行为的恶意软件检测系统来检测潜伏在设备中的任何恶意应用程序。`Droid-Sec` 的方法是将任何安卓 应用程序使用的系统调用与存储在远程服务器上的该程序应使用的标准系统调用进行比较。在比较之后，我们检查应用程序使用的系统调用是否与服务器上存储的标准许可系统调用匹配。如果调用匹配，则该安卓\
  \ 应用程序是非恶意的；反之，如果调用不匹配，则意味着第三方修改了这些系统调用，并且可能是恶意的。最后，我们为用户提供了这一功能，他们可以通过它选择性禁用这些应用程序的互联网连接。\n\
  \n## 4. 移动漏洞分类\n\n在当今世界，移动智能手机已成为每个人不可或缺的工具，涵盖了从孩子到成人的所有人。数百万用户（包括各种大型企业和组织）将手机作为通信工具，并作为根据需要规划日程和组织生活方式的手段。所有相关数据都保存在他们的手机中，对设备设备的任何入侵都可能损害这些信息。因此，移动安全变得越来越重要。收集并存储在移动手机中的所有个人数据和敏感信息需要确保安全，免受入侵者的侵害\
  \ [[20]]。\n\n在当今世界，像电脑一样，手机已成为攻击者的首选目标。由于智能手机的功能远超通话，这些其他功能可以被任何熟练的攻击者利用，他们可以利用通信手段，如短信服务\
  \ (`SMS`)、`Bluetooth`、`WI-FI` 网络、`GPS` 等 [[21]]。此外，他们还可以利用不同网络浏览器和底层操作系统的软件漏洞。此外，攻击者可以通过恶意软件或恶意程序进行攻击。这些恶意软件或程序在下载后会对设备造成破坏，并经常泄露用户的敏感和隐私数据。所有这些攻击都会损坏智能手机并破解存储在手机上的任何敏感信息。\n\
  \n如上述，攻击者有多种方式利用智能手机。[表 3] 简要描述了各种类型的移动漏洞。\n\n智能手机中的这些漏洞为攻击者非法访问智能手机设备并在未经用户同意的情况下获取敏感信息打开了大门。由于大多数这些功能是为了方便用户访问和帮助其流畅运行而作为内置功能，因此无法完全消除。\n\
  \n**表 3：** 移动漏洞描述。\n\n| 序号 | 移动漏洞 | 简述 |\n| --- | --- | --- |\n| 1. | 利用 `SMS` 或\
  \ `MMS` | 攻击者可以利用此功能发送带有病毒附件的短信给不知情的的用户，并破坏其设备。 |\n| 2. | 利用 `Wi-Fi` 网络 | 攻击者可以尝试窃听\
  \ `Wi-Fi` 通信以获取敏感信息，如用户名和密码。 |\n| 3. | 基于 `Bluetooth` 的攻击 | 攻击者可以通过连接用户手机来利用蓝牙功能，获取对设备的完全控制权。\
  \ |\n| 4. | 从损坏的电脑同步数据 | 在进行数据同步时，电脑中的恶意软件可以在用户不知情的情况下传输到手机中。 |\n\n\n\n\n\n| 5.\
  \ | 恶意网页 | 手机可能会受到各种黑客技术的攻击，例如钓鱼等，攻击者利用这些技术来非法获取信息。 |\n| 6. | 恶意应用 | 许多恶意应用潜伏在应用商店中，一旦下载并安装，就会相应损坏智能手机。\
  \ |\n| 7. | 手机被窃 | 如果设备被盗或丢失，任何位于加密存储区域之外的数据都可能被泄露。 |\n\n## 5. 建议的方法：DROID-SEC（Android\
  \ 安全）\n\n由于 Android 应用是开源且广泛提供的，这些应用程序容易受到各种形式的攻击，特别是 [27] 中描述的重打包攻击和更新攻击。Droid-Sec\
  \ 侧重于检测恶意应用，在检测到应用程序的恶意本质后，它可以用于阻止该应用程序的互联网连接。如果应用程序无法连接到互联网，它就无法向外界发送私有数据。Droid-Sec\
  \ 仅阻止应用程序的互联网访问，而该应用程序仍保留在 Android 设备上。因此，手机用户可以在不让其损害用户隐私的情况下，享受恶意应用程序的所有所需功能。我们可以以条形码扫描器为例，这是一个用于扫描的极佳\
  \ Android 应用，它可能需要联系人数据、互联网访问和浏览器历史等权限，并且它可能被某些恶意攻击者伪造。此应用程序在没有互联网访问的情况下也可以正常运行。如果用户发现此应用程序显示出某些恶意特征，可以阻止其互联网连接，用户仍然可以访问此应用程序提供的大部分服务。\n\
  \n图 2 展示了该方法，它依赖于正常应用程序和恶意应用程序使用的系统调用事件的比较。我们的方法要求任何 Android 应用的发布者提供 Android 应用使用的系统调用集，并将这些系统调用存储在远程服务器上。这些系统调用集是该特定\
  \ Android 应用的标准系统调用集。任何正常应用程序将遵循此集合，而恶意应用程序倾向于使用与此标准集合不同的系统调用，因为这些恶意应用程序请求的权限会有不同。Droid-Sec\
  \ 倾向于跟踪任何应用程序使用的系统调用，并将应用程序实际使用的这些系统调用集与标准系统调用集进行比较。基于这种比较，该方法可以发现哪个应用程序是恶意的，哪个不是。当该方法检测到应用程序是否恶意后，它会阻止该应用程序的互联网访问，从而使恶意应用程序对用户无害且可使用。\n\
  \n![Image](img/fig7_2.jpg)\n\n**图 2：** 正常应用程序与恶意应用程序的系统调用比较 [28]。\n\n在此过程中，最重要的步骤是跟踪系统调用，这是通过利用\
  \ Linux 工具 `strace` 的功能实现的，它也被称为“系统调用跟踪器”。\n\n### 5.1 Strace\n\n`strace` 是一个 Linux\
  \ 实用，用于跟踪任何程序使用的系统调用。通过这种方式，我们可以说它跟踪了应用程序如何与 Linux 内核交互。这种交互意味着程序接收了哪些 Linux 信号，以及程序使用了哪些系统调用\
  \ [29]。换句话说，我们可以说 `Strace` 在执行期间运行指定的程序。它会跟踪并记录程序在执行期间使用的所有系统调用以及接收到的所有信号。每个系统调用的名称、返回值和参数都会打印在由\
  \ `-o` 选项指定的文件中，或者标准错误输出中 [30]。\n\n`strace` 命令的基本语法为：\n\n```\nstrace [command or\
  \ program][arguments]\n```\n\n在这里，在该方法中，首先找到任何特定进程的 `pid`，然后在生成的输出存储在 `straceOut.txt`\
  \ 之前，对该进程应用 `strace`：\n```\nstrace -p pid –o straceOut.txt\n```\n\n这里，被使用的 `pid`\
  \ 进程将受到跟踪，生成的所有系统调用将被存储并发送到远程服务器进行比较。阻止互联网访问的核心概念围绕着 `IP tables` 展开。就像在 Windows\
  \ 中一样，后台防火墙一直运行并不断扫描系统中的恶意应用程序。该防火墙决定了哪些程序可以连接互联网，哪些不能。对于类似的任务，Linux 中同样有 `IP tables`，它定义了哪些应用程序或进程被允许访问互联网，哪些被阻止。正如我们所知，Android\
  \ 是一个基于 Linux 的操作系统，因此可以使用 `IP tables` 来阻止恶意的互联网流量请求。\n\n### 5.2 IP Tables\n\n`IP\
  \ tables` 是基于 Linux 的命令行防火墙工具，通常使用策略链来阻止或允许互联网流量。如果系统中必须建立任何连接，`IP tables` 会检查列表中是否有用于匹配的规则。如果没有找到规则，它将采用默认规则\
  \ [31]。*链的类型*：`IP tables` 有三种链——`input`、`forward` 和 `output`。\n\n*Input (输入)*：这类链通常用于管理所有传入连接的行为。例如，对于任何数据从其他用户发送到你的计算机/服务器，`IP\
  \ tables` 将尝试查找该特定 IP 地址和端口的规则，并根据此接受或拒绝传入的互联网流量 [31]。\n\n*Forward (转发)*：如果存在入站连接且这些连接并不在本地交付，则需要\
  \ `forward` 策略链。我们可以以路由器为例，路由器接收的所有流量都是为了转发，因为路由器只是中间节点。如果你正在使用路由或其他路由机制，则使用这些类型的策略链。\n\
  \n*Output (输出)*：此链用于出站连接，例如，如果我们尝试 ping [facebook.com](http://facebook.com)，`IP\
  \ tables` 将检查输出链，以在做出允许或拒绝连接尝试的决定之前查看关于 ping [facebook.com] 的规则。\n\n### 5.2.1 Android\
  \ 中的 IP Tables\n\n`IP tables` 是 AOSP 中的默认模块；可以编写 `c` 代码来使用 `net filter` 并处理它。我们可以使用\
  \ `net filter` 编写 `c` 代码进行处理。例如，我们可以创建一个 Android 项目并编写一个 JNI 文件，使用 `NDK-build` 进行编译，然后通过\
  \ `ADB push` 将可执行文件推送到 Android 文件系统中。在移动端，你可以 `ADB shell` 进入并以 root 用户身份直接使用 `IP\
  \ tables` 命令，就像在 Linux 中一样 [31]\n\n*常用 IP Tables 命令*\n\n一些常用的 `IP tables` 命令在 [32]\
  \ 中描述。\n\n阻止来自 IP\n```\niptables -A INPUT -s 13.21.23.54 -j DROP\n```\n\n针对特定端口\n\
  ```\niptables -A INPUT -s 13.21.23.54 –p tcp –dport 22 -j DROP\n```\n\n使用网络而非仅单个\
  \ IP\n```\niptables -A INPUT -s 13.21.23.0/24 -j DROP\n```\n\n### 5.3 允许或阻止特定连接\n\
  \n通过使用 `IP tables` 策略链，可以针对特定的范围、端口和地址允许或阻止互联网流量。例如，我们将连接设置为 `DROP`，但它们也可以切换为 `ACCEPT`\
  \ 或 `REJECT`；这完全取决于用户的需求以及用户如何配置策略链。\n\n\n\n\n\n我们使用了 `IP tables` 来阻止或取消安卓应用程序的互联网访问权限。`IP\
  \ tables` 比任何类型的防火墙（如 `Windows firewall`）都更好，因为它不需要在后台运行。每当用户想要阻止任何应用程序的访问时，他可以调用任何命令并更改授予给特定安卓应用程序的访问权限。由于\
  \ `IP tables` 不会一直运行，可以节省大量的资源，如 `CPU resource`、`memory battery` 等，然后这些资源就可以被其他应用程序使用。图\
  \ 9 描述了检测应用程序恶意特性的步骤顺序。\n\n### 5.4 Droid-Sec 的操作\n\nDroid-Sec 分两个阶段运行：首先它检测应用程序的恶意性，其次它阻止恶意应用程序的互联网访问。该方法结合了两个模块，用于检测恶意性并随后阻止恶意应用程序。\n\
  \n在第一个模块中，开发了一个基础 Web 应用程序，任何授权的开发者都可以上传其应用程序的所有合法系统调用文件。这将被作为标准系统调用集，与真实应用程序追踪到的系统调用进行比较。该\
  \ Web 应用程序使用 `PHP` 作为后端，`HTML`、`CSS`、`JavaScript`、`Jquery` 作为前端，`Apache server`\
  \ 和 `MySql` 数据库。对于第二个模块，我们开发了一个实时的安卓应用程序。该应用程序阻止被第一个模块检测到的恶意应用程序的互联网访问。\n\n图 3 展示了恶意应用程序和正常应用程序的一些系统调用，这些调用是通过\
  \ `Droid-Sec` 客户端帮助追踪的，包含系统调用的生成的输出文件被发送到远程服务器。检测安卓应用程序恶意特性的核心概念是将标准系统调用集与安卓应用程序实际使用的系统调用进行比较。标准系统调用集由发布者提供并存储在远程服务器上。该远程服务器对存储的标准系统调用和记录的系统调用运行比较算法。\n\
  \n![Image](img/fig7_3.jpg)\n\n**Fig. 3：** 基于系统调用的恶意软件检测系统 [28]。\n\n所以，基本上在第一部分，当用户想要验证某个应用程序是否恶意时，用户启动应用程序\
  \ `DroidSec`，使用 `strace` 开始追踪所有正在运行的应用程序。每当 `strace` 附加到任何进程时，它都会开始记录该进程使用的所有系统调用。此进程产生的所有系统调用都记录在输出日志文件中。现在客户端/用户端的工作完成。这些生成的输出日志文件现在被发送到远程\
  \ Web 服务器，服务器已经包含了供应用程序使用的标准系统调用事件。现在在远程服务器上有两组系统调用事件——一组是标准系统调用事件，另一组是记录的系统调用事件。现在在远程服务器上，这些比较这些系统调用。如果比较结果相同，则意味着该应用程序使用的那组系统调用事件符合发布者允许的系统调用事件。这也意味着应用程序所需的权限与真实应用程序相同。在这种情况下，该实例的应用程序被远程服务器声明为安全，不需要采取进一步操作。但如果比较显示记录的系统调用与许可的标准系统调用不同，则意味着该应用程序表现出偏离真实应用程序正常功能的情况。这意味着该应用程序的特定实例已被某些攻击者修改以供其使用。它所要求的权限与标准应用程序不同。在这种情况下，服务器向用户回复警告消息，将该实例的应用程序声明为恶意应用程序。该模块的整个工作原理在图\
  \ 4 中解释。现在，用户知道了该应用程序的恶意性，可以阻止该应用程序的互联网访问或从其设备中完全卸载。为了阻止恶意应用程序的互联网访问，设计了一个单独的模块将在下一节中解释。\n\
  \n![Image](img/fig7_4.jpg)\n\n**Fig. 4：** 应用程序恶意性检测过程流程图。\n\n在第一部分，`Droid-Sec` 已成功检测出系统中哪些应用程序是恶意的，哪些不是；用户必须根据自己的需求阻止或取消恶意应用程序的互联网访问。现在我们在这里描述\
  \ `Droid-sec` 如何能够阻止恶意应用程序的互联网访问。\n\n每当 `Droid-Sec` 启动以阻止互联网访问时，它会查看缓存目录并检查是否存在二进制文件。然后它将检查系统中安装的应用程序名称并首先查找缓存。如果\
  \ `Droid-Sec` 发现应用程序列表不在缓存中，则在显示之前先加载应用程序列表。现在向用户显示一个屏幕，其中显示两种模式的应用程序列表——黑名单模式和白名单模式。黑名单模式用于提供阻止应用程序互联网访问的功能，白名单模式用于授予应用程序互联网访问。从这里，用户必须检查他的偏好，即他想要阻止哪些应用程序，或者想要向哪些应用程序提供互联网访问。图\
  \ 5 展示了阻止恶意应用程序互联网访问的步骤顺序。\n\n![Image](img/fig7_5.jpg)\n\n**Fig. 5：** 阻止恶意应用程序互联网访问的过程。\n\
  \n如果用户检查其黑名单模式的偏好，则将形成阻止该应用程序互联网访问的规则，而用户根据其偏好选择白名单。形成的规则将为被阻止的应用程序提供互联网访问。当用户点击保存规则时，`Droid-Sec`\
  \ 首先检查它是否已授予 root 权限，如果 `Droid-Sec` 没有 root 权限，则授予它 root 权限。需要 root 权限是因为 `Droid-Sec`\
  \ 需要更改其他应用程序的权限，而在 Linux 中已知只有 root 权限的用户才有权执行这类权限任务。为了获取 root 权限，`Droid-Sec` 使用第三方软件，称为\
  \ `KingoRoot`。当用户为 `Droid-Sec` 提供 root 权限时，会生成一个包含应用程序规则的脚本。该脚本主要包含在 Linux 内核上执行的所有必要命令，例如阻止黑名单模式应用程序互联网访问的命令。它还包含应用于规则的应用程序的\
  \ `PID`。\n\n\n\n\n现在 Linux 内核上创建了内部线程，并在这些内部线程上运行脚本。这些线程现在持有包含所有必要信息的脚本，例如所选应用的\
  \ PID，以及用于阻止互联网访问或提供互联网访问的 Linux 命令，这些内部线程被授予了 root 权限。这些线程在 Linux 内核上执行。脚本包含了 `IP\
  \ tables` 规则，这些规则决定了进程的互联网连接性。所选应用程序的当前 `IP tables` 规则会被修改，随着所选应用的 `IP tables` 规则发生改变，根据用户的选择，该应用将被阻止或授予访问权限。如果在执行过程且规则正在修改时出现任何错误情况，将抛出异常并在屏幕上显示警告消息，然后终止该线程。如果线程执行过程中无任何错误，则\
  \ `IP tables` 规则将被更改，并在屏幕上显示应用的消息。现在，所选恶意应用程序的互联网访问已被阻止。\n\n## 6. 实验设置与结果\n\n在系列安卓安卓智能手机上测试了多种应用程序。这些程序被安装在具有不同安卓版本的各种移动手机上，即\
  \ Jellybean、Kitkat 和 GingerBread。首先，在安卓应用（如计算器）上测试了 Droid-Sec。我们对计算器的源代码进行了一些修改，使得修改后的计算器可以从安卓设备获取联系人详情并在不通知用户的情况下将这些详情发送到服务器。因此，修改后的计算器与实际计算器相比执行了不同的系统调用。Droid-Sec\
  \ 对比了此修改计算器和实际计算器生成的系统调用，并将修改计算器判定为恶意。我们阻止了修改计算器的互联网访问，并将其保留在设备中供使用，而不产生任何安全风险。表\
  \ 4 列出了某些具有不同安卓版本的流行安卓智能手机设备，DroidSec 在这些设备上安装并测试了我们修改的计算器应用，并提供了成功的结果。\n\n同样，与计算器一样，我们对一个简单的数独谜题安卓游戏进行了一些修改，使其开始获取安卓设备的\
  \ GPS 位置并发送到远程服务器。通过这种方式，这个修改后的数独游戏损害了用户的隐私。它也被声明为恶意应用。随后，对正常计算器和正常数独进行了了 Droid-Sec\
  \ 的测试，所有追踪到的系统调用都属于正常的系统调用集。因此，它们被声明为正常应用程序。同样地，Droid-Sec 在不同的安卓版本上对几个更多修改后的恶意应用和正常应用进行了测试，在所有情况下，Droid-Sec\
  \ 都能区分正常应用程序和修改应用程序。\n\n**表 4：** 测试 mockdroid 的移动设备和安卓设备。\n\n| **序号** | **手机** |\
  \ **安卓版本** | **备注** |\n| --- | --- | --- | --- |\n| 1. | 三星 Galaxy Grand 2 | Android\
  \ v4.3 (Jelly Bean) | 成功 |\n| 2. | Moto G (第二代) | Android v4.4.4 (KitKat) | 成功 |\n\
  | 3. | XOLO Q700 | Android OS, v4.2 (Jelly Bean) | 成功 |\n| 4. | 三星 Galaxy Y Plus\
  \ S5303 | Android v4.0 (Ice Cream Sandwich) | 成功 |\n| 5. | 三星 Galaxy Note N-7000\
  \ | Android v2.3 (Gingerbread) | 成功 |\n\n### 6.1 恶意应用的检测\n\n在第一步中，Droid-Sec 如 图\
  \ 6 所示追踪系统调用。现在由于防火墙已启用，Droid-Sec 请求了 root 权限。\n\n![Image](img/fig7_6.jpg)\n\n**图\
  \ 6：** 上传标准系统调用。\n\n用户现在可以看到所有应用程序的列表，如 图 7 所示。\n\n![Image](img/fig7_7.jpg)\n\n\
  **图 7：** 标准系统调用列表。\n\n### 6.2 拦截应用程序访问\n\nDroid-Sec 互联网的功能非常简单。防火墙默认处于禁用模式。用户可以通过点击设备上的设置来启用防火墙，如\
  \ 图 8 所示。\n\n![Image](img/fig7_8.jpg)\n\n**图 8：** 为 DroidSec 授予 root 权限。\n\n现在防火墙已启用，用户可以看到应用程序列表，如\
  \ 图 9 所示，并知道哪个应用是恶意的。\n\n![Image](img/fig7_9.jpg)\n\n**图 9：** 已检查应用程序的互联网拦截。\n\n\
  用户现在选择了恶意应用程序并必须点击保存规则，以便修改这些应用程序的互联网访问规则，如 图 10 所示。\n\n![Image](img/fig7_10.jpg)\n\
  \n**图 10：** 应用 IP tables 规则。\n\nDroid-Sec 不需要一直运行来限制应用程序的互联网访问，因为 Droid-Sec 修改了被拦截应用的\
  \ `IP tables` 规则。该规则在进一步修改之前保持不变。如果用户想再次为被阻止的应用提供互联网访问，他可以再次使用 Droid-Sec 更改 `IP\
  \ tables` 的权限，并保存直到再次修改。通过这种方式，Droid-Sec 可以限制恶意应用程序的互联网访问，使其无法将隐私数据发送到用户设备之外。\n\n\
  ## 7. 讨论\n\n在本方法中我们提出了一种优雅且高效的方法——Droid-Sec，它不仅能检测恶意应用程序，还能限制恶意应用程序的互联网访问。最近，已经提出了许多检测恶意应用的防御方法。其中许多方法利用了基于签名的检测系统概念。这些技术显示的准确率较低，因为签名很容易被攻击者绕过。然而，Droid-Sec\
  \ 的准确率比这类方法高得多。\n\n\n\n\n\n除此之外，还有许多其他方法，它们利用系统调用来检测应用程序的恶意性。此外，这些方法还使用了机器学习算法，根据系统调用事件对非恶意应用和恶意应用进行聚类。然而，这些技术需要使用大型数据库来存储应用程序日志文件，而且在使用广泛的机器学习算法进行聚类时也十分耗时。在我们的方法中，只需要存储标准的系统调用文件，这在存储方面非常高效，而且\
  \ `Droid-Sec` 不需要任何机器学习算法，这使其在时间复杂度上更具效率。\n\n还有许多其他方法仅侧于对恶意应用程序的检测；然而，它们并没有提供处理恶意应用程序的解决方案。通常，智能手机用户只有删除恶意应用程序这一选择。但在我们的方法中，我们提出了一种高效机制来阻止恶意应用程序的互联网访问，从而使恶意应用程序失效，因为它无法向外部世界泄露用户数据。\n\
  \n## 8. 结论与未来展望\n\n在本文中，我们介绍了一种新方法——`Droid-Sec`，旨在检测设备中的任何类型的恶意应用程序。`Droid-Sec`\
  \ 将特定应用程序的系统调用与合法开发者在应用市场上传的标准真实应用程序的使用的系统调用进行比较。如果系统调用恰好相同，则该应用程序被认为是无害的；否则，如果系统调用不同，则该应用程序被标记为恶性，并向用户发出关于该应用程序的警告。`DroidSec`\
  \ 还提供了阻止被标记应用程序互联网访问的功能。它初看起来可能像普通的防毒软件，但与它们完全不同，因为防毒软件使用基于签名的检测技术来寻找恶意应用程序，而我们的应用程序使用基于系统调检测技术。对于今天的攻击者来说，绕过基于签名的技术已变得容易，但模拟系统调用仍然非常困难。此外，它提供了阻止恶意应用程序互联网连接的功能。\n\
  \n目前，`Droid-Sec` 能够阻止恶意应用程序访问互联网。但智能手机设备的安全漏洞可以通过不使用互联网的其他途径发生，例如，某些应用程序可以访问日历数据库或电话录，或使用手机的\
  \ GPS 跟踪用户。这类可疑应用程序可以将位置发送给第三方，如果不通过互联网，也可能通过短信功能。因此，我们目前正在识别许多此类问题并扩展 `Droid-Sec`\
  \ 以解决所有这些问题。最重要的是，我们希望我们的应用程序能够在不需要用户任何帮助或指导的情况下主动运行，以便在不久的将来，我们可以扩展 `DroidSec`\
  \ 以实现这些特性。\n\n## References\n\n- [1] Peng, H., Gates, C., Sarma, B., Li, N., Qi,\
