  \ 无攻击(b) 黑洞攻击(c) PTH 攻击检测 |\n\n## 5.2 针对不同网络规模的分析结果\n\n在这里我们看到了黑洞攻击与正常 `AODV`（即无任何攻击情况下的性能）对比的分析结果，并针对不同的网络规模进行了研究。在后续分析中，网络中的节点总数变化为\
  \ 40、50 和 60，其中恶意节点数量保持为 15，并使用不同的指标衡量其影响。\n\n图. 8 中的折线图显示了攻击以及检测防御机制对应用源发送总数据包的影响。如折线图所示，在存在黑洞攻击的情况下，应用源本身无法发送大量数据，但在检测期间，提出的\
