  \ Levenshtein 距离计算\n\n![Image](img/alg13_6.jpg)\n\n## 4. 实现与实验评估\n\n本节讨论了针对云托管 Web\
  \ 应用程序在线社交网络框架的 XSS 攻击实现和实验评估结果。\n\n### 4.1 实现\n\n作者利用 `ICAN` 云模拟器的能力来设计他们的原型模型，并通过创建该模拟器的不同虚拟机来集成了他们的基础设施设置。不同的经过测试\
  \ Web 应用程序免费平台也托管在这些 `ICAN` 云模拟器的虚拟机上。我们从不可侵入的角度出发，评估了我们防御 XSS 蠕虫攻击的方法。通过对系统的详尽测试，检测到了高效且稳定的效果。我们框架的可靠\
  \ XSS 检测及防护方法在五个 Web 应用程序平台上进行了测试，分别是 Humhub、Wordpress、Joomla、Drupal 和 Elgg。所有这些平台的安装都是使用本地主机服务器\
  \ `XAMPP` 完成的。安装完成后，下一步是借助 XSS 攻击向量存储库 `[14, 15, 16, 17, 18]` 搜索我们网站中的漏洞。这些存储库包含了许多负责\
  \ XSS 蠕虫注入漏洞的脚本或负载。\n\n此外，我们通过软件开发环境 `Java Development Kit (JDK)` 在 `Java` 中完善了我们框架的模板，并将其设置包含在用于\
  \ `Java Runtime Environment (JRE)` 的 `Eclipse IDE` 虚拟机上。`Eclipse IDE` 部署在带有 2.24\
  \ GHz 双核处理器、4 GB RAM、运行 Windows 10 家庭版和 Google Chrome 的设备上。我们使用了 `JSOUP`，这是一个用于处理超文本标记语言的\
  \ `Java` 库。它用于解析 `HTML` 文档。它提供了应用程序接口来从统一资源定位符或 `HTML` 文件中移除并处理数据。它使用文档对象模型 (DOM)、`CSS`\
