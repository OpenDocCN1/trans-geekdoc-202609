  \n# 第 3 章\n\n## 下一代基于自适应机会性感知的无线传感器网络：一种机器学习视角\n\nJasminder Kaur Sandhu,*, Anil\
  \ Kumar Verma 和 Prashant Singh Rana\n\n随着技术的进步，机会性感知已成为节点间数据路由最有效的方式。这种下一代感知技术最显著的应用是无线传感器网络，它们部署在恶劣环境中并与真实世界的网络系统连接。服务质量（QoS）是此类系统的一个重要方面，它是可靠性评估的术语，可靠性评估进一步决定了网络的适应性。本文对服务质量和可靠性评估提供了详细的见解；此外，通过优化网络的数据流，可以增强网络的可靠性。本章提出了一种基于机器学习的预测框架来优化数据流，从而增强网络的可靠性。此外，还对结果进行了交叉验证，以检查网络中所用预测技术的稳健性。\n\
  \n### 1. 引言\n\n机会性网络利用无线传输的广播特性，在具有多跳传输且密度优为较高的无线网络中高效运行。这些网络中的路由按以下三个步骤进行：\n\n\
  i. 数据包从一个节点广播。\nii. 根据协调协议选择最佳节点转发数据包。\niii. 最终完成数据包转发。\n\n这种路由机制具有某些优点，包括可靠性的显著提高；由于利用了截获的数据包，发送数据包时的失败概率降至最低，且传输范围得以扩大\
  \ [[1], [2]]。这些网络可以根据其应用领域分类如下（[图 1]）：\n\n*   **传感器网络**：此类网络感知感兴趣的区域，该区域内可能发生了特定事件。传感器由电池驱动，能量有限。机会性网络为成功传输铺平了道路。它们使用机会性方法从源地到终地通信数据。此外，网络的冗余特征催生了诸许多应用，例如\
  \ Bionets（生物启发自主网络）和 ZebraNet（野外动物监测）。\n\n*   **口袋交换网络**：这类网络不依赖于基础设施。它们促进了移动设备与用户之间的通信。最常见的例子是连接移动设备的\
  \ Manets（移动自形网络）。\n\n*   **车载网络**：这些网络主要用于存在连接问题（如节点高度稀疏，此处延迟更大）的地方。DTN（延迟容忍网络）就是此类类型之一。\n\
  \n*   **无结构机会性网络**：在该网络中，主机连接到另一组主机。数据共享在这些不安全主机组之间进行，具有较高水平的不确定性。SON（语义机会性网络）属于此类。条件相似性是\
  \ SON 的主要关注点。\n\n![Image]\n**图 1:** 机会性网络的分类和应用领域。\n\n### 1.1 服务质量\n\n服务质量（`QoS`）是这些网络的重要方面，在两个水平上确定，即用户定义层和低层。此外，网络的可靠性方面主要与可靠性评估相关。可靠性包含了上述两个层面的特征。如[图\
  \ 2]所示，QoS 是可靠性的上位术语。\n\n本文的可靠性评估是通过无线传感器网络（`WSN`）进行的，这是机会性网络的一种类型。本文考虑了 `WSN` 中的数据流。其可靠性直接取决于网络的数据包递送率。\n\
  \n### 1.2 无线传感器网络\n\n在感兴趣区域设置了大量传感器节点，它们协作实现由用户分配或根据特定应用领域定义的预定义任务 [[3]]。数据在源节点和目的节点（也称为`汇节点`或`基站`）之间通过称为`跳跃`的技术进行通信。当中间节点参与这种通信时，被称为`多跳`。源节点与目的节点之间的直接通信被称为`单跳通信`。\n\
  \n![Image]\n**图 2:** 机会性网络的 QoS。\n\n### 1.3 可靠性评估\n\n\n\n\n\n网络向用户提供预定义服务的能力被称为“可靠性”（dependability）[4,\
  \ 5]。当信任特性被引入网络中或数据流得到优化时，网络会变得更加可靠，从而提高整体 QoS [6, 7, 8]。可靠性评估重点关注以下三个方面 [9–11]，如图\
  \ 3 所示。\n\n(a) 可靠网络的`特征或特性`包括可用性、可靠性、安全性（safety）、完整性、安全性、机密性和可维护性。网络的可靠性通过`属性`推断得出。该推断基于用户需求。各种属性如下：\n\
  \n- `Availability`（可用性）指网络在调用服务时的“运行时间”[15]。\n- `Reliability`（可靠性）当网络按照用户规范或在特定环境中持续工作时，被认为是高水平[12,\
  \ 14, 15, 18–20, 24]。\n- `Safety`（安全性）使网络变得可用且环境友好[17]。\n- `Confidentiality`（机密性）保证数据传输经过认证且防盗窃[16,\
  \ 17]。\n- `Integrity`（完整性）加强任何非法形式的数据修改[23]。\n- `Maintainability`（可维护性）和`adaptability`（适应性）是相互依赖的术语，包含两个能力：改进（意味着增强和维护）以及调整（意味着适应特定的条件集）[19,\
  \ 23]。\n\n![Image](img/fig3_3.jpg)\n**图 3：** 可靠性评估。\n\n- `Security`（安全防护，注：此处与 Safety\
  \ 区别，指攻击防护），在此语境下，意味着保护数据免受内部或外部的攻击[13]。\n\n(b) `Negative traits`（负面特性）会降低网络的可靠性（威胁）[4,\
  \ 28]。`fault → error → failure`（故障 → 错误 →失效）链展示了网络中的这些特性[30]。威胁的汇总定义如下[21, 22, 27]：\n\
  \n- `Fault`（故障）揭示网络中的缺陷，从而导致错误（图 4）。\n- `Error`（错误）发生在运行时，并导致错误的输出。\n- `Failure`（失效）使网络无法工作[29,\
  \ 31–33)]。此外，它会影响网络状态并使其从稳定变为不稳定（图 5）。\n\n(c) `Positive traits`（正面特性）提高网络的可靠性（手段）。这些特性使得网络能够更好地适应用户需求或网络运行的环境。这些包括下文解释的故障预防、消除和容错能力[23,\
  \ 25, 26]：\n\n- `Prevention`（预防）包含了从初始设计阶段到最终维护阶段的转换。从初始阶段就开始防止 `error → fault`\
  \ 循环。\n\n![Image](img/fig3_4.jpg)\n**图 4：** 故障分类。\n\n![Image](img/fig3_5.jpg)\n\
  **图 5：** 失效分类。\n\n- `Tolerance`（容错）允许网络在出现故障的情况下继续。\n- `Removal`（消除）处理现有故障。\n- `Forecasting`（预测）预测可能发生的故障。\n\
  \n### 1.4 动机\n\n网络向用户提供预定义服务的能力被称为“可靠性”[4, 5]。当信任特性被引入网络中或数据流得到优化时，网络会变得更加可靠，从而提高整体\
  \ QoS [6, 7, 8]。可靠性评估重点关注以下三个方面 [9–11]，如图 3 所示。\n\n(a) 可靠网络的`特征或特性`包括可用性、可靠性、安全性（safety）、完整性、安全防护（security）、机密性和可维护性。网络的可靠性通过`属性`推断得出。该推断基于用户需求。各种属性如下：\n\
  \n- `Availability`（可用性）指网络在被调用服务时的“运行时间”[15]。\n- `Reliability`（可靠性）当网络按照用户规范或在特定环境中持续工作时，被认为是高水平[12,\
