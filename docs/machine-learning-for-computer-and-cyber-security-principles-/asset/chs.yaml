  ## 一基于深度学习的网络网络威胁检测系统\n*Angel Luis Perales Gomez, Lorenzo Fernandez Maimo* 与 *Felix\
  \ J. Garcia Clemente*\n\n新的网络技术和范式使现有的入侵检测和防御程序失效。特别是即将第五代（5G）移动技术具有海量信息和高传输率，这给网络安全防御系统带来了新挑战。在这方面，本章提出了一种用于\
  \ 5G 移动网络网络威胁检测的系统，该系统利用了从网络流中获取的统计特征。由于这些特征与负载无关，即使对于加密流量也可以进行计算。该系统实时分析网络流量，并且能够自适应以应对流量波动。该提议在僵尸网络背景下进行了评估，达到了合理的分类准确率。此外，模型的预测运行时间也在各种深度学习框架和各种流量负载下进行了评估。实验结果表明，该模型适用于真实的\
  \ 5G 场景。\n\n### 1. 引言\n\n年来，网络安全研究人员使用了各种技术并开发了多种解决方案来保护组织资产免受恶意攻击者的侵害。网络安全解决方案提供了加密、权限管理检查能力以保护网络数据。然而，网络安全威胁（如木马、病毒、蠕虫和僵尸网络等[1]）需要网络安全解决方案不断更新。\n\
  \n\n\n现代网络承载的海量流量使得入侵检测系统（IDS）无法有效地收集和分析每一个数据包。例如，像 `Snort` 这样的深度包检测（DPI）工具 [2]\
  \ 由于开销问题开始丢弃 1.5 Gbps [3] 的数据包。最近，为了对 `Snort` 的性能以及机器学习技术在其上的应用进行全面的性能评估，人员进行了密集的实验\
  \ [4]。这些实验涵盖了广泛的带宽范围，结果显示 4 Gbps 时丢包率为 9.5%，而在 10 Gbps 时丢包率上升到 20%。为了提高性能，人们提出了了基于硬件加速器的先进并行化技术。其中，基于现场可编程门阵列（FPGA）的技术可以支持高达\
  \ 4 Gbps 的无损速度 [5]，而基于特定专用集成电路（ASIC）的技术则达到了接近 7.2 Gbps 的速度 [6]。\n\n因此，基于 DPI 的 IDS\
  \ 解决方案采用了新的检测方法，向使用创新的基于 AI 技术进化 [7]。关于快速分类收集到的网络流并检测攻击的解决方案的完整调查可以在 [8] 中找到。然而，具有更高传输速率未来网络将使这些解决方案不足。物联网\
  \ [9] 或新的第五代（5G）移动技术便是如此，其新的高级功能将给现有检测程序带来挑战；因此，这些程序需要根据新需求进行调整。\n\n5G-PPP 联盟已确定了一组在分析和检查流量网络流时具有高影响的关键性能指标（KPI）\
  \ [10]。这种检查以高效快速的方式计算入站网络流的检测程序所需的某些特征。在这些 KPI 中，以下四个指标使得 5G 移动网络中的检测程序更具挑战性：\n\n\
  * 每个地理区域的移动数据量增加 1000 倍。\n* 连接设备数量增加 10 到 100 倍。\n* 典型用户数据速率提高 10 到 100 倍。\n* 端到端延迟小于\
  \ 1 ms。\n\n属于 5G 订阅者的大量用户设备（UE）、它们产生的海量数据流量以及连接延迟的降低，使得我们在实时场景中，在不丢失网络威胁检测准确性的情况下面临着待解决的新挑战。\n\
  \n为了克服这一挑战，本章介绍了一种面向 5G 的架构，通过深度学习技术识别 5G 网络中的网络威胁。该方法基于一个特征向量，该向量由从给定时间段内网络流获得的统计度量组成。这些特征与有效负载无关，因此适用于适用于加密流量。在我们的提议中，以监督的方式通过从著名的僵尸网络数据集计算出的特征向量来训练深度学习模型。随后，使用该模型在\
  \ във类僵尸网络的语文中将网络流量分类为正常或异常 [11]。我们的实验结果展示了我们提议的分类准确率及其预测运行时间。结果表明，该运行时间适用于 5G 网络的时间限制。此外，本章首先详细研究了不同的深度学习技术以及它们如何应用于网络异常检测。\n\
  \n## 2. 深度学习\n\n多年来，机器学习已应用于广泛的领域，例如垃圾邮件过滤器或推荐系统。如今，机器学习正在被更先进的深度学习技术所取代。两者密切相关，并共享相同的哲学——它们从输入数据集中构建模型，并使用它对未见数据进行预测。事实上，深度学习被认为是机器学习的一个子领域（见\
  \ 图. 1）。然而，机器学习需要特征工程来生成输入特征，因此需要更多的领域知识，而深度学习则从原始数据中获取自己的特征 [12]。这一事实，加上现代硬件计算能力的提高以及可用于广泛问题的公共数据集的可用，是深度学习成功的主要原因。\n\
  \n在本节中，将简要介绍机器学习，描述使用机器学习的典型问题以及可用的不同训练方法。接下来，将解释深度学习背后的核心概念，从基础的前馈人工神经网络开始，到更复杂的架构结束。\n\
  \n\n\n### 2.1 机器学习\n\n机器学习是人工智能的一个领域，允许计算机从数据中学习而无需显式编程。机器学习算法（也称为“模型”）在使用进行预测之前需要一个训练阶段。在训练阶段，算法使用输入数据找到一个允许对属于相同上下文的未见数据进行预测的模型。如果模型能准确预测未见数据，则模型就可以进行泛化，因此可以用于未来的预测。相反，如果模型准确预测了训练期间使用的数据，但在用于新数据时准确性大大降低，则模型对训练数据过拟合了。\n\
  \n此外，模型可能具有无法从数据中优化的参数；这些被称为“超参数”。在许多情况下，它们的默认值足以获得可以的结果。然而，达到顶尖水平需要这些模型超参数。这通常是最耗时的部分，因为它意味着要对范围超参数值进行拟合和测试。\n\
  \n我们可以根据预期输出考虑两类主要的机器学习任务：分类和回归（见 图. 2）。\n\n* 分类：我们想要确定元素最可能的类别，例如区分猫和狗的照片。这通常涉及找到一个分割不同类别的边界。当我们只有两个类时，被称为二分类。如果我们有多个类，则被称为类别分类。机器学习中一个典型的分类问题是识别手写数字。解决此任务的一种方法是使用著名的\
  \ `MNIST` 数据集训练模型。在这个问题中，输入数据是代表手写数字的图像，输出是数字本身。这可以被视为一个 10 类分类任务。\n\n* 回归：尝试对因变量与一个或多个自变量之间的关系建模。它被用于预测和推理。预测示例是当我们想根据卧室数量、浴室数量、平方米、城市和地区等变量预测房屋价格时。相反，如果我们想知道房价的增加与特定城市相关，我们正在进行推理。\n\
  \n除了根据预期输出对机器学习算法进行分类外，我们还可以将其分类为监督学习或无监督学习，取决于它们是否分别需要标记的数据：\n\n\n\n\n\n**监督学习**：每个样本都有标签，因此我们可以计算真实值与预测值之间的误差，并相应地调整模型参数。\n\
  \n**无监督学习**：在这种情况下，数据集没有标签，因此解决问题的方法主要基于聚类算法。这些算法基于是将数据分组聚类，即每个簇的样本彼此之间的相似性高于与其他簇样本的相似性。\n\
  \n监督机器学习算法的非穷尽列表包括线性回归、逻辑回归、支持向量机、人工神经网络、随机森林或决策树等。其中一些算法（如逻辑回归）侧重于分类任务；而另一些则侧重于回归任务（例如\
  \ `linear regression`）。某些算法既可以用于回归，也可以用于分类；例如支持向量机、人工神经网络或随机森林。对于无监督算法，一个例子是著名的\
  \ k-means 聚类方法。\n\n\n**图 2：** 分类与回归的区别。在分类中，虚线表示区分两个类别的线性边界；在回归中，虚线模型化了两个变量之间的线性关系。\n\
  \n### 2.2 人工神经网络\n\n前馈神经网络是基础的人工神经网络架构之一，它由分层组织的神经元组成。人工神经元受到生物神经元的启发，它们接收来自不同连接的输入信号，对输入进行加权和，并应用激活函数来产生输出。\n\
  \n详细的人工神经元方案可以在图 3 所示。输入为 `x`[1] … `x[n]`，它们与标记为 `w[0]` … `w[n]` 的权重相乘。执行加权和后，最后应用激活函数产生输出。\n\
  \n从数学角度来看，神经元执行由等式 1 给出的定义操作。我们可以将加权和算子表示为矩阵乘法，其中 `x` 和 `w` 都具有 `n` × 1 的形状，`n`\
  \ 是神经元的输入数量。\n\n| $g(x) = \\sigma({\\\\sum\\limits\\_{i = 0}^{n}{w\\_{i}x\\_{i}\
  \ + b}}) = \\sigma(w^{T}x + b)$ | (1) |\n| --- | --- |\n\n 激活函数 $\\sigma$ 用于为输出引入非线性。三种最常见的激活函数是\
  \ sigmoid、双曲正切 (`tanh`) 和线性整流线性单元 (`ReLU`）。sigmoid 激活函数的输出值介于 0 和 1 之间。sigmoid 的一个特殊情况称为逻辑函数，经常被用作二分类问题的最后步骤（等式\
  \ 2）。这些问题相当常见；例如，在监督异常检测中，目标是预测两个类别之间：正常和异常。因此，可以使用 sigmoid 作为最后一步将输出限制在 0 到 1 之间。最后，通过阈值决定类别（例如，如果\
  \ `sigmoid(x)` > 0.5 则为第一类，如果 `sigmoid(x)` ≤ 0.5 则为第二类）。\n\n| $sigmoid(x) = \\frac{1}{1\
  \ + e^{- x}}$ | (2) |\n| --- | --- |\n\n双曲正切激活函数可以表示为双曲余弦和双曲正弦函数。输出值从 −1 到 1（等式\
  \ 3）。\n\n| $tanh(x) = \\frac{sinh(x)}{cosh(x)} = \\frac{e^{x} - e^{- x}}{e^{x} +\
  \ e^{- x}}$ | (3) |\n| --- | --- |\n\n`ReLU` 反则基于最大函数，它取 0 和输入之间的最大值（等式 4）。`ReLU`\
  \ 比 `sigmoid` 或 `tanh` 更简单，因为任何负值都被设为 0；因此它不需要计算任何乘法或指数。`ReLU` 的一个特性是它可以帮助解决梯度消失问题[13]。\n\
  \n| `ReLU(x)`ↄ= `max(0,x*)` | (4) |\n| --- | --- |\n\n三种激活函数在图 4 中。\n\n\n**图 3：**\
  \ 单层人工神经网络——感知机。\n\n**图 4：** 神经网络中常用的激活函数。\n\n通常，如图 5 所示，前馈神经网络由称为“输入层”的第一层、一个或多个“隐藏层”以及称为“输出层”的最终层组成。在训练阶段，输入层接收训练数据；然后每个神经元计算其输出并传播到下一层。对每个隐藏层重复此过程直到到达输出层。这被称为“前向传播”。到达输出层时，损失函数计算输出与真实值之间的误差。\n\
  \n| $MSE = \\frac{1}{n}\\sum\\limits\\_{i = 0}^{n}(y_{i} - \\hat{y}_{i})^{2}$ |\
  \ (5) |\n| --- | --- |\n\n| $-\\frac{1}{n}\\sum\\limits\\_{i = 1}^{n}[y_{i}\\log(\\\
  hat{y}_{i}) + (1 - y_{i})\\log(1 - \\hat{y}_{i})]$ | (6) |\n| --- | --- |\n\n| $-\\\
  frac{1}{n}\\sum\\limits\\_{i = 1}^{n}\\sum\\limits\\_{j = 1}^{m}[y_{ij}\\log(\\\
  hat{y}_{ij}) + (1 - y_{ij})\\log(1 - \\hat{y}_{ij})]$ | (7) |\n| --- | --- |\n\n\
  \n\n\n\n前馈神经网络基于全连接层，其中每个神经元都与相邻层中的其他神经元相连接。相比之下，卷积神经网络（CNN）利用了局部感受野（也称为滤波器，它在相邻层的神经元之间强制执行局部连接模式，即神经元连接到前一层的一个小区域）、共享权重（权重与滤波器相关，因此每个输出都使用相同的权重）以及池化（用于简化输出）。\n\
  \n尽管 CNN 在计算机视觉任务（例如图像分类或目标检测）中取得了顶尖结果，但它们并不局限于图像处理，也不限于二维输入。此外，它们在自然语言处理或时间序列预测等领域也证明了自身的有效性。\n\
  \n构建卷积网络通常使用三种主要类型的层：卷积层、池化层和全连接层（与前馈神经网络相同）。\n\n### 2.3.1 卷积层\n\n这是卷积神经网络架构中的核心层，基于卷积算子。卷积是一种在计算机视觉和图像处理应用中广泛使用的线性操作。对于图像，卷积表示为一个名为\
  \ `kernel`（卷积核）、`filter`（滤波器）或特征检测器的矩阵。卷积核在图像上移动并应用于每个图像位置。生成的矩阵被称为 `feature map`（特征图）、`activation\
  \ map`（激活图）或卷积特征。\n\n图 6 形象地展示了如何执行该操作。需要注意的是，这不是传统的矩阵乘法，而是 `kernel` 与底层像素之间的点积。不同的卷积核会导致不同的激活图。在图中，输出计算如下：\n\
  \n1 × 0 + 2 × 1 + 4 × 0 + 2 × 1 + 4 × -4 + 6 × 1 + 3 × 0 + 2 × 1 + 7 × 0 = -4\n\n\
  卷积层的目的是从输入图像中提取特征，其中滤波器权重决定了要检测的特征。这些权重是网络在训练阶段将学习的参数。\n\n\n**图 6:** 卷积操作——结果存储在与滤波器中心对应的输出单元中。\n\
  \n### 2.3.2 池化层\n\n通常在卷积层之后会使用池化层。其目的是通过选择补丁（patch）中最具代表性的特征来降低输出的维度。池化操作通过在给定的\
  \ `stride`（步长）上应用聚合操作（通常是最大或平均）对其输入进行下采样。池化操作的一个有趣属性是它还引入了平移不变性。\n\n### 2.3.3 全连接层\n\
  \n全连接层类似于用于前馈神经网络的层。在 CNN 场景中，该层被用作最后的分类阶段。最后一个卷积层输出给定数量的特征图。该输出在传递到全连接层之前会被展平为单列向量。\n\
  \n\n\n在图 7 中，我们可以看到一种名为 `LeNet-5` 的著名卷积神经网络架构 [15]，用于手写数字分类。`LeNet-5` 接受 28 × 28\
  \ 像素的图像作为输入。网络由两个卷积层（每层都有对应的最大池化层）和两个全连接层组成，最后是一个 10 输出的分类层。每个输出代表一个类别成员的估计。这种神经网络架构可以与上述\
  \ MNIST 数据集结合来分类手写数字。\n\n### 2.3.4 循环神经网络\n\n循环神经网络（RNN）是一种人工神经网络架构，其单元之间的连接沿序列形成一个有向图。与前馈神经网络不同，RNN\
  \ 可以使用其内部状态来处理输入序列。这使得 RNN 适用于需要数据序列的任务，例如语音识别、语言建模、翻译或图像描述生成。\n\n循环神经网络的输入是一个长度为\
  \ `n` 的序列，表示为 `x[0]`、`x[1]`、...`x[n-1]`。内部状态可以用等式 8 表示，其中 `h[t]` 是处理 `x[t]` 输入后的隐藏状态，`h[t-1]`\
  \ 是上一个隐藏状态。`W` 和 `U` 是相应的权重。输出函数 `y[t]` 可以在等式 9 中看到，其中 `V` 是权重。\n\n| h[t] = σ(W[t]x[t]\
  \ + U[t]h[t-1]) | (8) |\n| --- | --- |\n| y[t] = σ(V[t]h[t]) | (9) |\n\nRNN 架构的关键概念是使用之前的状态\
  \ `h[t-1]`，它为网络提供了关于过去的信息。这种上下文用于预测序列的下一个元素或翻译给定句子。然而，RNN 面临梯度消失问题，因此难以处理长期依赖。长短期记忆（LSTM）通过使用更复杂的架构解决了这一缺陷。\n\
  \n### 2.3.5 长短期记忆网络\n\n长短期记忆网络（LSTM）[16] 是一种特殊的 RNN 架构，能够学习长期依赖。它可以记住长时间的信息。LSTM\
  \ 使用 LSTM 单元作为构建基础。\n\n一个 LSTM 单元由细胞状态 `c[t]` 和三个不同的门组成：遗忘门 `f[t]`、输入门 `i[t]` 和输出门\
  \ `o[t]`。输入门决定如何更新细胞状态。下一步是获取一个用于更新细胞状态的候选值。该候选值通过对前一个隐藏状态和输入数据应用 `tanh` 生成。新的细胞值计算为旧细胞状态与候选值的和，分别与遗忘值和输入值逐元素相乘\
  \ (*)。\n\n输出门负责决定向下一个单元传递哪些信息。其值取决于输入数据和上一个隐藏状态。最后，输出（或隐藏状态）通过输出门与应用于细胞状态的 `tanh`\
  \ 函数逐元素相乘计算得出(等式 10)。在这里，`W` 和 `U` 是输入数据和上一个隐藏状态相关的权重；`b` 是偏置。\n\nf[t] = σ(W[f]x[t]\
  \ + U[f]h[t-1] + b[f])\ni[t] = σ(W[i]x[t] + U[i]h[t-1] + b[i])\nc[t] = f[t]*c[t-1]\
  \ + i[t]*tanh(W[c]x[t] + U[c]h[t-1] + b[c])\n(10)\n\no[t] = σ(W[o]x[t] + U[o]h[t-1]\
  \ + b[o])\nh[t] = o[t]*tanh(c[t])\n(11)\n\n\n\n\n异常检测是识别不符合预期模式或行为的项、事件或观测。一种简单的异常检测程序可以是定义一个代表正常行为的区域，并将数据中任何不属于该正常区域的样本标记为异常。根据`[17]]`，这种简单的方法面临若干挑战——难以定义此类正常区域；由自适应恶意攻击者产生的异常；正常行为的演变；异常的定义依赖于特定语境（例如，在医学领域，体温的微小波动可能是异常，而在股票市场领域，类似的偏差可能是正常的）；或者缺乏标记数据集的可用性。\n\
  \n由于异常的种类繁多，通用异常检测问题被认为是极其困难的。此外，即使在给定的语境下，异常的概念也会随时间而变化。为了说明这一点，假设一个不允许 P2P 流量的网络。在这种情况下，P2P\
  \ 流量会被归类为异常。然而，如果公司决定利用某些 P2P 平台提供新服务，那么异常的 P2P 流量将极难与允许的流量区分开来。\n\n在计算机网络中，异常检测几十年来一直是研究课题，人们已经探索了许多方法`[17,\
  \ 18]]`。然而，深度学习视角近年来引起了特别关注`[19]]`。\n\n### 深度学习异常检测技术\n\n深度学习异常检测技术通常作为区分正常类和异常类的分类器。这些技术按以下三种模式之一运行：\n\
  \n**监督****检测需要一个将流量标记为正常或异常的数据集。主要问题在于如何构建一个真正全面的训练集，并对所有异常流量进行恰当标记。这些数据集通常是不可用的，且难以收集和维护`[20]]`。其原因有几点，例如收集此类数据需要耗费巨大精力，分析所需的专家知识水平，甚至涉及用户隐私问题。事实上，从某公司或机构的网络中收集所有流量涉及不同的法律方面。\n\
  \n**无监督**检测不需要任何标记训练。该技术的目标通常是发现数据中的相似样本组（聚类）。随之产生的问题是如何确定识别出的类别与预期的类别相对应。即使我们拥有涵盖所有不同场景和流量模式的大量数据，我们也不能盲目地相信结果。然而，当用于降维时，这些方法非常适合提取判别性的高层特征，从而提高监督或半监督算法的分类性能。\n\
  \n**半监督**检测尝试从足够的采集样本中估计正常流量的概率分布。这在样本被归类为正常的区域（不一定是凸的）周围定义了一个紧密的边界。与监督方法的区别在于，样本空间中没有异常区域形状的信息。如果新流量超过阈值距离，则被分类为异常。\n\
  \n在无监督学习方法中，深度信念网络（`DBN`）[21]]、堆叠自动编码器（`SAE`）[22]]以及受限玻尔兹曼机（`RBM`）是`DBN`的构建模块。`SAE`使用来自`RBM`的输入。两者都可以通过支持向量机（`SVM`）[23,\
  \ 24]]进行微调。\n\n## 4. 网络威胁检测方案\n\n为了实现有效的网络异常检测，我们使用了一种集成在 5G 网络中的分布式系统[25]]，该系统遵循\
  \ ETSI NFV 架构[26]]，该架构也被用作其他方案的基础[27, 28]]。\n\n该系统如图`Fig. 8`所示，由两个虚拟网络函数（`VNF`）组成——异常症状检测（`ASD`）和网络异常检测（`NAD`）。前者位于无线接入网络（`RAN`）基础设施内部。它侧重于快速搜索异常症状，症状基本上是流量中检测到的异常迹象。后者是带时间戳且与`RAN`相关的症状的收集器，由中央进程分析时间线以及这些症状之间的关系以识别任何网络异常。一旦检测到异常，立即通信到监控和诊断模块。\n\
  \n我们的方案是灵活的，因为当网络流量增加时，它可以部署新的虚拟资源以继续检测异常症状。它还具有扩展性，因为症状检测是在`RANs`中以分布式方式进行的，而异常检测则是在核心网（即演进分组核心网，`EPC`）中以集中方式进行。\n\
  \n关于`ASD`和`NAD`功能，我们提议使用深度学习技术来分析网络流。我们将流统计分为两步过程：流导出和流采集。前者负责生成流，而后者聚合流以计算特征向量，适用于异常检测任务。然而，一个首要的设计决策是确定为了训练我们的系统需要计算的网络流特征集。\n\
  \n\n\n\n在我们的架构中，异常检测分为两个级别，如图. 9 所示。在低层，流收集器在给定时间段内收集所有不同的流，并计算出一个特征向量，`ASD` 模块将该向量分类为异常或正常。这种初始分类必须尽可能快地完成，即使以牺牲准确性来换取更短的响应时间。如果怀疑存在异常，则会将一个包含相关特征向量、时间戳以及检测到的异常类型（当使用多分类方法时）的“症状包”（symptom\
  \ packet）发送到下一级，即 `NAD` 模块。\n\n\n**图 8：** 网络异常检测系统。\n\n\n**图 9：** 低层 (ASD) 和高层 (NAD)\
  \ 模块详情。\n\n`NAD` 接收来自所有 `ASD` 的多个症状流，根据其时间戳对其进行排序并组装成时间序列。判断该序列是否属于一组攻击类别中的某一类的任务可以被视为一个症状序列分类问题。\n\
  \n### 4.1 相应的深度学习模型\n\n专注于 `NAD`，选择用于检测异常的模型是 `LSTM`。主要原因是，如果 `ASDs` 具有足够的分类性能，`NAD`\
  \ 模块对时间的限制较少。在我们的研究中，我们主要关注 `ASD` 模块，因为它的运行时性能至关重要。\n\n关于 `ASD` 模块，选定的使用的深度学习模型是\
  \ `DBN` 和 `SAE`。这两个模型共享相同的结构，并可以用于监督和无监督学习。如果有带标签的数据集，我们可以使用 `DBN` 或 `SAE` 模型后接一个分类层。否则，我们提议使用\
  \ `DBN` 作为一种半监督方法，使用正常网络流量进行训练，并将 `DBN` 作为一种判别式 RBM（Discriminative RBM）使用，不需要任何额外的反向传播层\
  \ [29]。\n\n一些作者建议使用 `DBN` 或 `SAE` 后接 `SVM` 作为最终层 [23]。该模型可用作为一种监督的二分类方法，或作为半监督的单类方法。这种方法被舍弃了，因为它不适用于大规模高维数据集。\n\
  \n我们评估了三种不同的监督 `DBN` 架构。它们分别具有一层、三层和六层隐藏层。作为最终层，我们选择了一个带有 `sigmoid` 激活函数的分类层，给出流为正常或异常的概率。这些模型假设使用带标签的数据集进行训练，具有两个类——*正常*或*异常*。\n\
  \n### 4.2 网络流特征\n\n如前面的章节所述，机器学习特征需要手动进行工程化。为了避免依赖领域专家知识，我们尝试从包含许多指标的输入向量中自动计算判别性特征。\n\
  \n流导出需要 `NetFlow`，它定义了流记录如何传输到流收集器。`NetFlow` 记录包含每个流的：源和目的 IP 地址及端口、开始和结束时间戳、服务类型、三层协议、`TCP`\
  \ 标志、下一跳路由器、输入和输出 `SNMP` 接口、源和目的自治系统以及网络掩码。此外，每条流记录还携带了关于交换的数据包数量和字节数的聚合信息。\n\n\
  每条流记录都可以从流收集器直接发送到症状检测模块。然而，流记录太简单了，只允许提取少数特征。进一步的方法是从流记录窗口中获取聚合视图 [24]。在这种情况下，定时器和/或计数函数在接收到一定数量的流（偏移）后触发聚合过程。聚合视图是以多尺度方式取一个或多个时间段计算的（例如，可以考虑\
  \ 5 分钟、1 分钟和 1 秒的时间段获得三个特征向量）。\n\n所需的特征可能不同，取决于我们想要检测的异常；例如，如果我们想检测 `TCP` 异常，我们只需要\
  \ `TCP` 特征。在我们的实验中，我们识别了从表 1 所示特征中计算出的 288 个特征。为了生成这些特征，我们考虑了两个流子集——一组完整的 `TCP/UDP`\
  \ 流，另一组经过过滤的 `TCP/UDP` 流，以便其源/目的 IP 属于偏移量内的流。\n\n在选定的 `TCP/UDP` 特征中，我们强调了与计算 `NetFlow`\
  \ 记录熵和方差相关的特征。首先，流入流源 IP 的熵和流出流目的 IP 的熵允许获得有关相应 IP 在流集中出现方式的特征。流入流源端口的熵和流出流目的端口的熵允许获得与网络端口类似的特征。其次，流入流、流出流和总流\
  \ IP 数据包数量以及总字节数的方差允许获得有关分析集中流之间差异程度的特征。\n\n**表 1：** 从网络流计算的用于分类测试的选定 `TCP/UDP`\
  \ 特征。\n| **特征 (*t*)** |\n| 流的数量、流入流的数量、流出流的数量。流入和流出流占总数的百分比。对称和非对称流占总数的百分比。流入、流出和总流中\
  \ IP 数据包的和、最大值、最小值、平均值和方差。流入、流出和总流字节的和、最大值、最小值、平均值和方差。流入、流出和总流源字节的和、最大值、最小值、平均值和方差。流入流源\
  \ IP 和流出流目的 IP 的不同数量。流入和流出流源/目的端口的不同数量。流入流源 IP 和流出流目的 IP 的熵。流入和流出流源/目的端口的熵。流入和流出流端口\
  \ > 1024 的百分比。流入和流出流端口 ≤ 1024 的百分比。 |\n## 5 实验结果\n复杂的 5G 场景对评估模型时的运行时施加了重要限制。因此，实验的目标不仅是寻找具有足够分类准确性的深度学习模型，还要寻找具有低评估时间的架构。在本节中，对图.\
  \ 9 所示的 `ASD` 模块从两个不同的维度进行分析——其分类准确性和模型评估运行时。\n在第 3 节中讨论了处理异常通用概念的困难。考虑到这一点，所提异常检测方法的范围需要受到限制。众周知，网络中的异常通常与受恶意软件感染形成僵尸网络的计算机恶意行为有关。这一事实加上带有真实标签流量的最新可用数据集，使我们关注僵尸网络攻击检测。因此，在这一实验部分，我们选择了一种监督方法，将无监督方法留给未来的工作讨论。\n\
  ### 5.1 CTU 数据集\n\n\n\nCTU [30] 是一个公开的数据集，于 2011 年在捷克共和国 CTU 大学捕获，适用于本文语境。它尝试满足成为一个优秀数据集的所有良好要求——它包含真实的僵尸网络攻击而非模拟、来自大型网络的未知流量、用于训练和评估的真值标签（ground-truth\
  \ labels）以及不同类型的僵尸网络。CTU 数据集包含 13 个场景，涉及不同数量的感染计算机和七个僵尸网络家族。每个场景的流量都被记录在一个`pcap`文件中，该文件包含所有数据包并经过后处理以提取其他类型的信息。每个场景中的包数量、捕获流量的总大小以及存在的僵尸网络见表\
  \ 2。\n\n虽然关于不同场景的详细描述可以在 [31] 中找到，但我们简要介绍其中一些。场景 1 基于运行了 6.15 小时的 `Neris` 僵尸网络。该僵尸网络使用基于\
  \ HTTP 的 C&C 通道并尝试发送垃圾邮件。在场景 3 中，`Rbot` 僵尸网络运行了几天并扫描了大型网络范围。`Murlo` 僵尸网络在场景 8 中运行了\
  \ 19.5 小时，并尝试连接到多个远程 C&C 系统。其余场景中的僵尸网络执行其他操作，如 UDP 和 ICMP DDoS 攻击、扫描 Web 代理或 P2P\
  \ 连接。\n\n**表 2：** CTU 僵尸网络场景。\n| **数据集** | **包数量** | **大小** | **僵尸网络** |\n| 场景 1\
  \ | 71 971 482 | 52 GB | Neris |\n| 场景 3 | 167 730 395 | 121 GB | Rbot |\n| 场景 5\
  \ | 4 481 167 | 37.6 GB | Virut |\n| 场景 7 | 7 467 139 | 5.8 GB | Sogou |\n| 场景 9\
  \ | 115 415 321 | 94 GB | Neris |\n| 场景 11 | 6 337 202 | 5.2 GB | Rbot |\n| 场景 13\
  \ | 50 888 256 | 34 GB | Virut |\n\n## 5.2 分类性能\n\n在支持我们使用简单深度学习模型决策的分类实验中，我们需要一个待测试的模型。第\
  \ 4 节中提到的任何模型都可以被选择；然而，我们决定使用深度贝叶斯网络（DBN）接分类层。\n\n首先，通过在接收每个网络流后获取 30 秒和 60 秒的聚合视图，从\
  \ CTU 数据创建特征向量。通过这种方式，如果最后一个收到的网络流是异常的，那么相应的特征向量也将标记为异常。\n\n遗憾的是，这类数据集是高度不平衡的，因为异常流量的比例通常很小。这使得学习过程更具挑战性，因为神经网络倾向于将所有流量归类为正常，从而获得接近\
  \ 100%的准确率。在这种情况下，我们使用了加权损失函数来补偿标签不平衡。此外，我们使用了比准确率更合适的指标：精确率（precision）和召回率（recall）的组合，或者更简而言之，使用\
  \ F1 值。混淆矩阵中的条目定义如下：\n\n- **真阳性**（True Positive）：指被正确预测为正的正例数量。\n- **真阴性**（True\
  \ Negative）：指被正确预测为负的负例数量。\n- **假阳性**（False Positive）：指被错误预测为正的负例数量。\n- **假阴性**（False\
  \ Negative）：指被错误预测为负的正例数量。\n\n所提的评估指标为：\n\n- **精确率**（Precision）：指示预测的正例中正确的比例。\n\
  $$Precision = \\frac{TP}{TP + FP}$$\n\n- **召回率**（Recall）或灵敏度：定义了分类器正确预测的正例比例。\n\
  $$Recall = \\frac{TP}{TP + FN}$$\n\n- **F1 值**：显示正类精确率和召回率之间的权衡。\n$$F1 score = 2\
  \ \\times \\frac{Precision \\times Recall}{Precision + Recall}$$\n\n在实验中，我们使用了两种训练/测试划分。第一种划分是将整个数据集划分为训练集、验证集和测试集；第二种划分使用了\
  \ CTU 数据集作者建议的划分 [30]。他们的方法将整个数据集分为两个子集：训练集和测试集。该划分考虑了以下限制：训练和验证子集应占整个数据集的 80%左右；测试集应占整个数据集的\
  \ 20%，且训练和验证子集中使用的任何僵尸网络家族都不应出现在测试集中。\n\n考虑到所有这些，我们希望找到一个具有足够分类性能的简单深度学习模型。我们将搜索范围限制在三个具有最多六个隐藏层的\
  \ DBN 上，使用`ReLu`作为激活函数，输入向量为 288 个特征，采用批归一化并将二分类分类器作为输出层。输出层的激活函数为 sigmoid，交叉熵为使用的代价函数。每个网络的超参数为：学习率[0.001,\
  \ 0.5]，丢弃率（dropout）[0, 0.4]，以及 L2 正则化[0, 0.2]。超参数调优通过 10 折交叉验证和随机搜索完成。\n\n## 5.3\
  \ 执行性能\n\n\n\n\n存在多种商业深度学习框架和库。为了训练所提出的神经网络，所选框架必须支持 `LSTM Recurrent Networks`（NAD\
  \ 模块中使用的模型）和 `DBNs`，同时还要支持多 GPU。我们用于测试性能基准的选定深度学习库有：`TensorFlow 1.4` [32], `Caffe2\
  \ 0.8.1` [33, 34], `Theano 1.0.0rc1` [35], `PyTorch 0.2.0˙4` [36], `MXNet 0.11.0`\
  \ [37] 以及 `CNTK 2.2` [38]。它们都已广泛应用于各种研发和商业项目以及不同的场景中。此外，所选框架均为开源项目，除 `Theano` 之外，所有框架都得到了知名高科技公司的支持。`Caffe2`\
  \ 和 `Pytorch` 由 Facebook 赞助；`Tensorflow` 由 `Google` 支持；`CNTK` 由 `Microsoft` 支持；`MxNet`\
  \ 由 `Amazon` 赞助。`Theano` 被认为最早的深度学习框架之一，由蒙特利尔大学的研究小组开发。\n\n所有所选框架的一个共同特征是为开发者提供\
  \ `Python` API，允许快速进行原型设计。另一个相关特性是，大多数框架还提供 `C` API，允许编译为准备好在生产环境中部署的机器码。我们在实验部署中同时使用了\
  \ `Python` 和 `C` API。\n\n在这些实验中，我们通过使用 `DBN` 评估了上述框架的性能。我们在评估中还包含了我们自己基于 `cuBLAS`\
  \ [39] 的实现，作为一种开销最小的基准方案。`DBN` 模型在每个实验中保持相同的输入和输出尺寸（即输入层的大小与特征向量相同，输出层大小为 2）。然后使用\
  \ `Softmax` 来估计属于正规类或异常类的概率。所选的架构如下：\n\n*   一个包含 128 个浮点数的隐藏全连接层。\n*   三个包含 128、64\
  \ 和 32 个浮点数的隐藏全连接层。\n*   六个包含 128、128、64、64、32 和 32 个浮点数的隐藏全连接层。\n\n模型可以在 `CPU`\
  \ 或 `GPU` 上进行评估，并假设特征向量批次（batch）以最快速度到达系统内存。因此，如果模型通过 `CPU` 评估，则可以直接访问该批次。反之，如果模型通过\
  \ `GPU` 评估，则有必要将该批次传输到 `GPU` 内存中。\n\n为了获得最佳性能，必须考虑几个因素。无论由哪种处理器运行模型，批次大小（batch size）对执行时间都有很大影响。如果模型通过\
  \ `CPU` 评估，大批次可以利用`高级向量扩展`（Advanced Vector Extensions）。然而，超过某个批次大小后，可能会出现更多的缓存/TLB\
  \ 缺失和页错误，导致吞吐量变差。相反，如果模型通过 `GPU` 评估，增加批次大小可以缩短执行时间，因为可以同时使用更高比例的可用处理单元。但在后的情况下，花费在将批次传输到\
  \ `GPU` 内存上的时间也会增加。在这一实验性工作中，我们只使用了一个 `GPU`，因此批次大小受到 `GPU` 内存限制。\n\n我们使用一台配备 32\
  \ GB 内存、主频 3.5 GHz 六核 `Intel i7-5930K` 处理器（带超线程）、运行 `Linux` 系统以及一个 8 GB 内存 `NVIDIA\
  \ GeForce GTX 1080` 的工作站进行了性能评估。\n\n### 5.3.1 确定最佳批次大小和框架\n\n尽管大多数深度学习框架被设计为作为计算图工作，但我们决定将深度学习框架视为黑盒，并通过在每个\
  \ `RAN` 上安装我们的软件期间执行的基准测试来确定更合适的框架。该基准测试运行多次测试，以找到给定框架的最佳批次大小。我们对元组 `(model, framework,\
  \ vector size, batch size*)` 的所有可行组合进行了性能测量。这里，`vector size` 是特征 `vector` 的分量数量；`batch\
  \ size` 是批次中特征向量的数量；`model` 是训练好的深度学习模型；`framework` 是用于训练和评估该模型的深度学习框架。这些模型和框架在上面已描述。\n\
  \n为了清晰起见，图 10 仅显示了在 `GPU` 上运行的六隐藏层神经网络的结果性能。单隐藏层和三隐藏层神经网络的性能除了缩放外，没有显著的行为变化。结果显示，当批次大小固定时，加速比随向量大小变化的函数不是线性的。这一事实可能有几个原因——内存传输时间、计算时间、`GPU`\
  \ 线程数或 `CUDA` 的网格和块维度等。然而，我们的目标不是对这种行为提供深入浅的描述，而是调整我们的软件以使其性能最大化。具体而言，图 10 展示了每个框架在输入向量为\
  \ 128 和 256 以及各种批次大小下的得分。\n\n\n**图 10：** 针对多种批次大小和两种特征向量大小的六隐藏层神经网络 (GPU) 性能。（*顶部*）128\
  \ 特征向量（*底部*）256 特征向量。\n\n如图 10 所示，所有向量和批次大小的最佳性能都是我们使用 `cuBLAS` 的自实现，其次是 `Caffe2`。鉴于所有分析的框架都使用\
  \ `cuBLAS` 进行矩阵运算，我们对模型的特制实现可以被认为是实现吞吐量的上限。我们的版本没有受到框架为了提供灵活性和扩展功能而所需的抽象层开销的影响。\n\
  \n检查每个框架的行为，`cuBLAS` 在 128 和 256 向量大小下的最佳得分分别为 0.8 和 0.46 万特征向量/秒。紧随其后的是 `Caffe2`，随着批次大小的增加，性能差异变得更小。相反，`MxNet`\
  \ 和 `Theano` 的得分最差；`Theano` 在批次大小为 `2¹⁷` 向量大小为 128 时获得其最佳结果（0.15 万特征向量/秒）；而 `MxNet`\
  \ 在批次大小为 `2¹⁵` 向量大小为 128 时获得 0.21 万特征向量/秒的最佳得分。应该注意到，`Theano` 是一个特殊情况，因为在向量大小固定时，所有批次大小的几乎保持不变。\n\
  \n尽管特征数量可能是无限的，但我们将特征向量设置为 256 个元素。选择这个数字是因为考虑到之前的 ASD 分类性能（见第 4.2 节）。使用此输入向量大小并在我们的工作站上运行模型，三种\
  \ DBN 架构中的最佳批次大小如表 6 所示。\n\n\n\n`cuBLAS` 实现可以被认为是使用这些框架所能达的最大吞吐量。然而，将向量大小固定为 256\
  \ 并仅考虑商业框架时，`Caffe2` 在所有批大小下都提供了最佳性能。对于单层架构和批大小为 `2¹⁷` 的情况，它的性能达到了每秒 510 万个特征向量，而次优选择是\
  \ `CNTK`，每秒提供 380 万个特征向量。另一方面，`MxNet` 和 `Theano` 在排名中处于末位，与 `Caffe2` 和 `PyTorch`\
  \ 相比，它们在几乎每种配置下的结果都很差。特别是在此配置下，`MxNet` 在批大小为 `2¹³` 时达到了每秒 154 万个特征向量的最佳标记。`Theano`\
  \ 在批大小为 `2¹⁷` 时获得了每秒 164 万个特征向量。\n\n我们应该记住，这些结果是在上述特定工作站上运行基准测试获得的。因此，在其他现有的硬件配置上，得分可能会大不同，因为每个\
  \ RAN 中可用的虚拟计算资源可能会导致深度学习框架和批大小的不同优化组合。这使得在安装阶段在每个 RAN 上运行基准测试集，并确定适用于 5G 网络中特定\
  \ RAN 的最佳框架至关重要。还需要注意的是，尽管运行在 `GPU` 上的 `Caffe2` 提供了最佳性能，但它可能不是最合适的选项。例如，低流量系统可能会因为功耗策略决定不使用\
  \ `GPU`。在这种情况下，运行在 `CPU` 上的 `TensorFlow` 是最佳选择。此外，还可以考虑其他系统配置，例如使用多个 `GPU` 的框架。无论如何，我们的架构都允许自适应于任何硬件环境。\n\
  \n**表 6：** 最佳批大小。\n\n### 5.3.2 CPU vs GPU 性能\n\n`GPUs` 已经成为机器学习计算必不可少的工具，因为深度学习模型实际上非常适合在它们上执行。计算越复杂、越独立，性能提升通常越令人印象深刻。\n\
  \n在我们特殊的情况下，与计算时间相比，将批从主内存传输到 `GPU` 所花费的时间是不容忽视的。如果批很小，内存传输次数就会增加，从而限制吞吐量。相反，如果批很大，内存将成为最常见的限制。图\
  \ 11 展示了某些框架如何随着批大小的增加而改进。相比之下，其他一些在相同情况下甚至会变差。对于每个框架，`GPU` 相比 `CPU` 显示都有显著提升。需要注意的是，`cuBLAS`\
  \ 是运行在 `GPU` 上的库，因此 `CPU` 基准测试不包含它。\n\n\n值得注意的是，运行在 `CPU` 上的 `TensorFlow` 得分比某些运行在\
  \ `GPU` 上的框架更好。特别是对于批大小为 `2¹³` 和 `2¹⁵` 的单隐藏层架构，`TensorFlow` 的表现优于 `MxNet` 且类似于 `Theano`。相比之下，在\
  \ `GPU` 上获得最高分的 `Caffe2` 在 `CPU` 上的得分最低。通常情况下，所有运行在 `CPU` 上的框架性能都低于每秒 100 万个特征向量，`TensorFlow`\
  \ 例外，它在单层架构中可达到每秒 130 万个特征向量。\n\n### 5.4 讨论\n\n为了使实验结果具体化，让我们考虑一个真实的 5G 场景：一个城市有\
  \ 5 个 `RAN`，每个 `RAN` 有 50 个 `eNB`（用于连接的 LTE 无线接入网络元素），共有 1000 万居民，每人有一个 `UE`。假设每个\
  \ `RAN` 处理 200 万居民，每个连接的 `UE` 平均每秒产生 10 个流，且每个 `eNB` 完美平衡 40000 个 `UE`。在这种配置下，每个\
  \ `eNB` 每秒将管理 40 万个流。如果我们假设每个 `eNB` 有一个 `ASD` 且偏移一个流，将导致每秒向每个 `ASD` 发送 40 万个特征向量。根据实验结果，这种负载可以通过\
  \ `TensorFlow` 使用任何批大小或 `MxNet` 使用 `2¹¹` 或 `2¹³` 批大小在 `CPU` 上进行管理。同样，如果假设有 5 个 `eNB`\
  \ 向 `ASD` 发送数据而不仅仅是一个，我们得到的是每秒 200 万个特征向量。在这种情况下，系统应选择运行在 `GPU` 上的框架，因为任何运行在 `CPU`\
  \ 上的框架都可以处理。合适的框架是：`PyTorch`、`CNTK`、`Caffe2` 以及基于 `cuBLAS` 的实现。\n\n## 6 结论\n\n提出了一种用于\
  \ 5G 移动网络架构异常检测的系统。该提案基于一种新型的双层深度机器学习模型，其中第一层是监督或半监督学习方法，在每个 `RAN` 上尽可能快地实现 `DBN`\
  \ 或 `SAE`。由于 `RAN` 处理的网络流量巨大，这权衡了一些准确性。它的任务是检测症状，即在可配置的短时间内发生的局部异常流量状况。\n\n\n\n\n\
  还进行了多项实验，以对深度学习框架进行全面的对比性能评估。其目标是确定最适合实现最高处理性能的框架。实验结果表明，5G 网络中的系统都能根据具体情况使用某个框架，例如取决于无线接入网（RAN）中物理资源（`GPU`\
  \ 或 `CPU`）的可用性，或者取决于网络流的接收率。\n\n作为未来的工作，可以考虑以下几个方面。首先，有必要使用来自 5G 流量的真实流量来训练 `ASD`\
  \ 和 `NAD` 模块，并从系统整体来测试异常检测的准确性。其次，另一个重要问题是流采集器从网络流窗口创建特征向量的效率。某些统计特征无法随着新流的到达进行增量计算，这使得它们的计算开销非常昂贵。因此，我们需要开发一种高效的实现方法，使我们能够实时生成特征向量。最后，最后一个问题是将我们基于深度学习技术的异常检测方法与深度数据包检测（DPI）工具（如\
  \ `Snort`）集成。当系统检测到异常时，应该以高效的方式存储相关的网络流，例如使用高性能数据库。随后 DPI 工具可以对它们进行分析，以更精确地确定异常类型。\n\
