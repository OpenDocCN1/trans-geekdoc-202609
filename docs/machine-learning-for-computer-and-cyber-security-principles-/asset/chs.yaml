  \n\n本节讨论了社交网络服务（OSNs）中声誉、信任和隐私领域的研究贡献。具体而言，本节重点关注了这些贡献在社交网络中知识提取与使用范围内的应用文献。\n\n\
  \n\n[4] 提出了一种基于信任的推荐系统，该系统兼顾了隐私考虑。它根据某些匹配属性向朋友推荐其朋友的朋友。通常，推荐系统应该能够获取社交网络（OSNs）中个体的个人或私有信息，以便能够根据这些属性推荐人物、职业或产品。此类推荐系统在原理上类似于根据共同兴趣建立配对的媒合灯程序。推荐系统还与上下文无关，这意味着在推荐系统中可以咨询所有的个人朋友，而无法根据特定的查询语境区分出其中某些朋友在特定情境下可能并不是理想的推荐者。Guo\
  \ 等人的模型通过一种模型解决了此类问题，该模型将推荐扩展到了第一跳（或度数）之外的朋友圈（例如，朋友的朋友等）。该模型定义了从零（不信任）到一（完全信任）的连续信任值范围。与此，[5]\
  \ 允许社交网络中的用户与其直接朋友之外的人互动，同时保护隐私，不将信息暴露给那些陌生人。论文的案例研究侧重于社交网络中节点之间连接存在的匿名化问题。通常这不是公开信息，仅在第一度朋友之间可见。论文专门考虑了为了聚合网络查询而进行的网络匿名化[6]\
  \ 提出了一种用于可视化社交网络中信任关系的模型。所提的身份验证系统向用户建议其新请求的邀请是否可信，这是我们所提声誉模型的用例之一，即当社交网络中的用户收到来自陌生人的邀请时，他们可以使用请求者的声誉排名作为决定接受或拒绝邀请的依据。我们的想法是通过此种声誉排名公式，将信任从陌生人的朋友转移到被邀请者。我们的加权边或友谊公式旨在向被邀请者展示邀请者与被邀请者朋友之间是否存在关系，还展示了这些关系的权重，因为在某些情况下，仅关系存在与否可能会引起困惑。在许多情况下，用户可能会被骗添加朋友，这意味着这些朋友一旦被添加到好友列表，就不应允许他们参与所有的常规用户活动。这种方法也可以作为应对社交网络垃圾信息传播的方法，用户可以根据预定义的指标自动接受或拒绝来自陌生人甚至朋友的消息。许多名人或自我中心的用户默认允许添加新朋友或不经过任何处理。[7]\
  \ 讨论了社交网络中友谊连接与地理位置的关联以及对未来朋友位置的预测。Dey 等人（2012）评估了社交网络用户年龄对其保护隐私信息能力的影响。他们提出了一种根据与朋友的互动估计\
  \ Facebook 用户年龄的方法。最近，由于 Facebook 实施了额外的隐私要求，无法公开爬取 Facebook 用户，[8] 提出了一种基于移动的朋友的朋友检测算法。这在原理上类似于根据共同属性连接人们的匹配算法。在寻找朋友的范围内，[9]\
  \ 提出了一种联邦社交网络。此类方法的一个问题是用户可能会向他人暴露信息（如位置位置）。该方法基于某些评分。在平衡社交网络隐私问题时，[10] 对 Facebook\
  \ 和 MySpace 进行了调查，结果显示 Facebook 用户愿意分享更多。同样，Zhang 等人（2010）对安全问题进行了性讨论。[11] 评估了社交网络中的访问控制模型。用户可以为朋友和活动指定静态策略。这一决策会被系统记录，因为用户可以针对其活动逐案决定细粒度的策略。在访问控制模型主题上，[12]\
  \ 提出了社交网络中基于规则的访问控制。作者将关系的深度和最短路径长度描述为两个重要属性。\n\n[13] 为社交网络提供了一种自动隐私系统，用于处理此类情况，例如社交网络中的用户可能会发布包含其他人或朋友参与的活动、图像或视频。\n\
  \n9.2   声誉模型的应用\n\n在本节中，我们描述了所提系统在可能应用中如何使用的示例。在社交网络的混合交互和基于历史的隐私系统中，我们的目标是为用户开发一种自动隐私系统，帮助他们在遵循以下约束和指南的情况下对自己的活动做出合理的隐私评估决策：\n\
  \n-   社交网络中的每个节点都与社交网络中的所有其他节点拥有关系，其加权值在零（非朋友）到一（非常亲的朋友）之间变化。初始假设是，只有朋友（例如，加权边 >\
  \ 0）的用户才能看到其他用户的简介和活动。\n\n-   系统可以从两个选项的初始设置开始：(1) 开放隐私，所有值 > 0 的用户都可以查看用户的简介和所有发布的活动。作为替代方案，为了便于手动考虑，用户可以临时阻止某些朋友查看其简介和活动。这一静态决策将使这些朋友的值保持为零，从而使他们暂时不友好；(2)\
  \ 闭合隐私，除非主体用户明确添加，否则没有用户可以查看任何活动。\n\n-   随着朋友与用户活动的互动，他们的边信任值会逐渐增加。这仅适用于闭合隐私模型，因为开放模型假设所有朋友最初都可以看到其他人的活动。\n\
  \n\n\n社交网络（OSNs）的主要功能之一是通过网络工具促进用户与网络应用程序或用户彼此之间的更多互动，从而扩大其社交网络的使用范围。大多数推荐新朋友的算法都使用与个人、国家、职业、兴趣或共同朋友相关的相似属性。我们的目标是扩展早期提出的基于交互的信誉系统，并根据个人与朋友之间关系的强度以及朋友与用户活动的互动情况，提供朋友推荐。\n\
  \n我们对社交网络中关系的研究表明，OSNs 中任何用户的大多数朋友都是“沉默型”或“低调型”的朋友，他们很少或偶尔与用户活动产生互动。例如，在 `Facebook`\
  \ 中，三个主要的朋友互动动作是：点赞、评论或留言板标记（wall tags）。留言板标记似乎是关系强度的最高指标，尤其是因为它需要节点所有者的特殊权限。对照片、视频或帖子进行评论属于中级活动，许多朋友会周期性地发表评论。此类评论的数量可以作为关系亲密程度或权重的另一个指标。点赞的数量似乎是最大也是最低的友谊指标。\n\
  \n我们对 `Facebook` 的大量用户进行了调查，注意到在很多情况下，除了研究用户在 OSNs 中的活动以及他们与这些活动的互动外，还可以根据对用户活动的研究提取出几个可能的共同特征。这些特征包括这些用户参与社交网络的程度。尽管存在许多共同特征，但如果两个用户在社交网络中的参与量存在差异，他们可能不会被认为具有相似的个人画像。我们的模型还包括与小组或公共页面的互动程度等。与经典的朋友匹配不同，可能使用相似小组或研究兴趣的算法需要进一步评估用户在这些小组或公共页面中的参与情况。用户可以在许多小组或公共网站上注册，但他们可能很少与其中的活动进行互动。两个与某个小组或公共网站有频繁互动的用户应该被视为极佳的候选朋友，即使他们有许多不同的属性。\n\
  \n作为一种接受陌生人邀请的推荐系统，我们的信誉系统帮助节点做出决定是否接受或拒绝陌生人发送的连接请求。该模型是基于交互的，这意味着模型将根据缺乏互动来详细说明对于受邀请者这是一个陌生人；它还显示了受邀请者的朋友中谁与这个陌生人互动过，以便就该陌生人进行咨询。OSNs\
  \ 中的专业推介（Professional referrals）被许多企业视为营销和评估用户对商业产品感知的必要工具。除了对产品（如书籍、电子产品等）的推荐外，推荐还可用于寻求服务的专业或专家推介（如医生、顾问、教育者、诊所、餐厅或品牌）。用户可能会信任他们的朋友及其推荐。一些与职业相关的\
  \ OSNs（如 `LinkedIn`）允许用户从朋友那里寻求推荐。朋友之间的互动可以帮助区分这些朋友之间关系的性质（即个人性或职业性）。在考虑朋友的推介推荐时，也应该考虑这种分类。例如，来自个人朋友的专业推荐可能属于（利益冲突）的范畴。我们在此假设\
  \ OSN 能够确定这两个朋友之间存在的关系性质（即个人性或职业性）。这需要基于四个元素对推介决策进行建模：(1) 被推荐者，(2) 推荐者，(3) 他们关系的性质，以及\
  \ (4) 被推荐者寻求推荐的背景。如图 1\n\n**图. 1：** 专业推介架构。\n\n### 9.2 信用报告\n\n几份参考文献表明，信用报告机构已经在使用或聚合来自社交网络的信息。我们认为，我们所提出的\
  \ OSN 节点信誉排名可以直接作为信用或背景报告的一部分。它允许用户透明地监控并改进他们的信用评估，这将影响是否给这些用户提供信用的其他可能决策。在经典的信用和背景报告中，个人得分可能会受到用户无感知或无法改变的事件的负面影响。信誉评分并非涉及财务决策和活动的信用报告的替代品；它是一种补充，显示了与用户在线存在或特定在线行为相关的新或不同维度。用户可以通过朋友的选择以及他们创建的活动类型来提高信誉评分。\n\
  \n### 9.3 OSNs 中的垃圾信息检测\n\n\n\n垃圾邮件在电子邮件中非常流行，用户经常收到向大量电子邮件用户发送的非自愿邮件，这很大程度上是为了营销或财务目的。垃圾邮件问题在在线社交网络（OSNs）中也迅速增长。在某些情况下，垃圾邮件发送者在公开页面注册，以继续发布他们的垃圾邮件信息。在其他情况下，他们可能会寻求与许多用户建立友，以便在用户的活动中传播他们的营销信息。许多\
  \ OSN 用户可能会刻意或无意地接受匿名用户的友请求。此外，OSN 用户很少会筛选其好友列表来核实他们是否想要保留或删除某些姓名。他们的账户可能会面临安全问题，或者至少会暴露给垃圾邮件发送者。根据我们的模型，我们建议定期向用户提醒那些与其活动极少互动的用户。用户可以筛选这些名称，并决定是否要与这些名称保持联系。对于拥有大量朋友的用户来说，这可以作为手动调查的一种方便替代方案。这也是基于内容的垃圾邮件检测的替代方案，后者可能会导致数量的假阴性或假阳性剔除朋友。\n\
  \n### 9.4 网络演化的评估\n\nOSN 中群的形成是动态的，并且可以从一个网络变为另一个网络。与群体形成、互动或兴趣相关的信息或知识提取可以与许多研究领域相关。然而，这种知识提取面临着若干挑战，包括数据量巨大以及需要一个聚焦的上下文，以便集中搜索。这样一来，对该类过程进行仪器化或自动化就可能是可能的。通过本文，我们展示了如何动态衡量\
  \ OSN 敏捷群体成员之间关系强度的示例。这些群体或小圈并不是正式形成或定义的。\n\n### 9.5 正面或负面互动\n\n我们的原始信誉模型基于统计数据，不需要对互动内容进行分析。此类互动无论其性质是正面还是负面都会被考虑。尽管如此，可以对公共帖子和互动进行语义分析，以查看朋友之间的评论是正面还是负面的。最终，友谊——权重的范围可以从\
  \ (–1) 到 (1)，而不是从 (0) 到 (1)。例如，一个朋友可能与用户有大量互动，但根据情感分析，此类互动一直是负面的，因此该关系的整体权重值应该是负的。\n\
  \n### 9.6 上容器驱动的隐私评估\n\n我们提出了一种自动的上下文驱动隐私系统，该系统可以根据用户发布的帖子或活动，提醒用户谁可以或应该看到他们的活动。该系统有两种运行模式：(1)\
  \ 手动模式，在该模式下，活动作者可以决定活动的隐私级别。隐私评估系统可以根据作者简介中的用户好友分类决定谁可以或不能查看、评论或传播该活动；(2) 自动模式，在该模式下，隐私评估系统可以决定活动的机密性分类。可以使用情感分析方法对活动进行最终判断，将其归为几个选项中的一个类别标签（例如：正常、已分类或机密）。基于此初始机密性分类，第二步将类似于手动模式，即为不同的朋友分配不同的可见性或访问级别。\n\
  \n## 10 Twitter 数据集\n\n大多数公开的社交网络数据集包含关于节点的特性的，但没有包含描述不同节点之间关系的特性的。利用 Twitter 数据，我们开发了一个工具来提取用户之间可能发生的不同类型的互动。\n\
  \n与我们之前使用并描述的 Facebook 数据集相比，我们发现 Twitter 中朋友之间的互动在大多数情况下没有 Facebook 那么明确（例如，对朋友的帖子发表评论，或在主墙上标记）。Twitter\
  \ 用户可以点赞（收藏）他们朋友的推文。他们也可以转发这些推文。然而，在 Twitter 中，不存在所有朋友都能响应用户帖子或推文的高互动评论会话。除了推文、转发和收藏外，Twitter\
  \ 用户还可以通过（提及 @mentions）或（标签 #hashtags）间接地与他们的朋友互动。这些（朋友）可以是网站或组织，而不仅仅是 Twitter 用户。[图\
  \ 2] 显示了我们基于 Twitter 实体生成的数据集文件。\n\n- `Tweets`：代表主要的 Twitter 实体；所有其他实体都可以从 Tweet\
  \ 实体内提取。例如，在我们的 Twitter 解析工具中，行 `tweets = twitter.GetTwitts(userName, 100). result;`\
  \ 生成了用于提取所有其他实体的推文（Tweets）集合。代码中的 `(100)` 表示 Twitter 的速率限制。\n- `Contributions`：是贡献推文创作的用户。这通常包括除原始推文作者之外的其他\
  \ ID。\n- `Coordinates`：代表推文的地理位置，采用经度而非纬度。\n- `Followers`：可以从推文的 `user` 实体中提取，这些是关注推文作者的其他用户。\n\
  \n![Image](img/fig5_2.jpg)\n\n**图 2：** Twitter 解析的实体。\n\n- `Followings`：可以从推文的 `user`\
  \ 实体中提取，这些是推文作者关注的其他用户。\n- `Hashtags`：如果推文包含标签，则 Hashtag 实体将包含标签的文本。\n- `Languages`：代表推文文本的机器检测语言。\n\
  - `URLs`：是从推文文本中可以提取的 URL 或链接集合。\n- `User Mentions`：是从推文文本中收集的屏幕名称集合。\n- `Symbols`：是从推文文本中提取的金融符号集合。\n\
  \n## 11 结论\n\n在早的一项工作中，我们在 OSN 中提出了一种信誉模型，旨在提高信息的准确性，增强从 OSN 中提取知识，并提高用户活动的质量。本章概述了扩展的信誉模型及其应用。本章还开发了一个来自\
  \ Twitter 的公开数据集，用作所提信誉模型及其应用的原型。随着 OSN 中交换的信息海量增长，对于这些网络提高信息质量变得非常必要，特别是这些网络中的信息是整个互联网知识库不可或缺的一部分。\n\
