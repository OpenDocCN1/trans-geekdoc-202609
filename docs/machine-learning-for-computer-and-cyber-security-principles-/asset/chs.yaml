  # 第 5 章评估和利用社交网络用户交互的模型\n\nIzzat Alsmadi 和 Muhammad-Abdullah\n\n### 1. 引言\n\n在当今的网络世界，社交网络（OSNs）是全球用户访问量网站。根据\
  \ Facebook 的数据，“截至 2017 年第三季度，月活跃用户超过 20.7 亿。这些用户中包括截至 2013 年 5 月使用该网站扩大市场的 1600\
  \ 万当地企业。截至 2013 年 5 月，每天分享的内容高达 47 亿份。”\n\n社交网络用户包括个人、公司和政府部门，他们维护社交网络的需求分别是：最大化社会资本和声誉、维持竞争优势以及促进公民交易。\n\
  \n社交网络中的海量数据使得知识提取成为从业者和研究人员的重要目标。此外，最近的商业收购（如微软收购诺基亚、脸收购 WhatsApp）表明，技术的兴趣正从硬件和软件转向信息。\n\
  \n社交网络数据是多个领域分析的目标，包括但不限于社会科学、安全与情报、业务分析和营销。然而，社交网络数据的收集和分析是在用户知情或不知情的情况下进行的。许多说法表明社交网络非法入侵并分析不同用户之间的私人对话和内容。根据[1]，“由于各种社交媒体的普及，个人用户通过与其他用户交换大量信息或活动，使其隐私面临风险。这引起了对在未经同意的情况下将私人信息泄露给恶意实体的严重担忧，”（第\
  \ 265 页）。\n\n此外，分析感兴趣的一类数据是意见挖掘或情感分析，即探索人们对特定产品、新闻、事件或企业的意见或建议。推荐系统关注的是利用社交网络数据，为产品、专家或候选雇主/员工提供建议。然而，这些推荐系统的问题之一是它们通常是依赖上下文的。每个推荐系统都应该首先指定（例如根据用户查询）推荐的主题。此外，实时分析用户数据以评估用户对特定查询的意见或建议。这两个因素和其他因素共同增加了过程的复杂性。\n\
  \n\n\n\n作为一种解决方案，研究者提出了声誉排名模型，例如 [1, 2]`。它们通过收集关于节点及其活动的统计数据，而不查看这些活动的实际内容，从而在保护社交网络（OSNs）用户隐私的同时，收集有关他们的关系、观点或活动的信息。这些模型还对\
  \ OSN 中的用户本身提供静态推荐，这最终提升了 OSN 中的信息质量，因为用户会更关注朋友的选择以及他们发布的活动，因为这最终可能会影响到他们自己的声誉。这种推荐系统有多种可能的应用场景。例如，它们可以用于搜索查询排名、信用报告评估，以及职业、教育等方面的推荐。\n\
  \n本章扩展了声誉排名模型，并提供了以下明确的新新贡献：\n\n- 它在从 Facebook 收集的真实数据集上[3]`对声誉排名模型进行了评估。\n- 它扩展了描述\
  \ OSN 中朋友之间信任关系的加权边方程。\n- 它为早期假设模型[1]`描述的实际问题提供了解决方案。\n- 它扩展了“经典而非基于权重的团”的使用，并实现了一种加权团模型，该模型使用归一化权重来评估每个团内部的纽带强度。\n\
  \n我们提出的声誉模型受到目前两种流行的基于交互的排名模型的启发：\n\n(1) `Page Rank (PR)`：Page rank 是搜索引擎（特别是整个互联网）根据搜索查询对检索到的网页进行排名最重要的算法之一。由于大多数搜索查询会检索大量的匹配或半匹配结果，因此开发一种对检索结果结果或网页进行排名的算法至关重要。根据搜索查询，大多数页面排名算法检索网页并根据其流行程度对其进行排名。当更多人访问该网站或页面或指向它（即\
  \ `Inlinks`）时，网站或页面就会变得更流行。`Inlinks` 是指示指向主题网页的网页数量的指标。在我们的 OSN 声誉模型中，`Inlinks`\
  \ 由朋友数量表示。朋友与主体或节点活动的交互次数在我们的模型中由页面访问或页面浏览表示。\n\n(2) `H-index`：尽管 H-index 简单简单，但它仍然是评估或比较研究人员贡献的最流行的引用索引。对于个人作者，H-index\
  \ 公式根据两个属性计算索引——作者的出版物和每篇出版物的引用次数。最终，`H-index` 值代表了作者的引用次数超过特定数量的出版物数量。例如，一个 `H-index`\
  \ 为 10 的作者表示该作者有 10 篇论文，其中这 10 篇论文中的每一篇都被 10 或更多论文引用。与之前页面排名的比较类似，H-index 出版物可以看作我们声誉排名中的朋友数量，而引用数由朋友与主体节点活动的交互表示。事实上，朋友与源节点的交互可以被视为推荐或引荐，这与\
  \ `H-index` 引用是同义的。\n\n本章其余部分的结构如下：第 2 节讨论了通过描述声誉的每个组件如何推导出实体声誉。第 3 节描述了如何将提出的声誉模型应用于\
  \ OSN 的隐私评估中。第 4 节概述了 OSN 中现有信任、声誉和隐私模型方面的相关工作。第 5 节提供了所提声誉模型预期应用的插图。最后，第 6 节总结了这项工作并建议了未来的工作方向。\n\
  \n## 2. 声誉模型\n\n所提声誉系统的重点在于为 OSN 中的每个节点或用户推导出声誉分数。在这项工作中，考虑一个图 `(G)`，其中实体是顶点，两个实体之间的社交关系由边表示。也就是说，如果两个实体通过边连接，那么这两个实体彼此的朋友。尽管如此，一个实体对另一个实体的信任程度可能会不同，这意味着信任关系是主观且非对称的。因此，每个节点都被分配了一个加权声誉分数，以便具有不同交互量的用户可以相互比较。该计算考虑了两个主要输入：\n\
  \n(1) `作为节点的节点与其他用户之间的交互`：在图模型中，这些交互被建模为边。与经典方法不同，提出的模型通过朋友之间的交互量来区分边（或朋友之间的关系）的厚度[1]`。这种加权边是双向的，一个方向的值通常与另一个不同。这一领域的动机之一是能够更精细地地区分朋友之间关系的权重，而不是仅仅是经典的二分类法（即：是朋友或不是朋友）。\n\
  \n(2) `用户活动`：与第一个组件相结合，可以根据用户的活动及其朋友对这些活动的交互来计算用户的声誉。在 OSN 中，用户可以创建帖子、推文或上传图片等。无论基于不同\
  \ OSN 的活动性质如何，朋友都会对这些活动做出响应（例如，通过赞、评论、转发）。模型考虑了朋友与这些活动的交互量，以及基于权重的归一化过程，以便无论交互量大小都能比较来自不同用户的活动。文献中提供的模型无法进一步区分朋友与特定活动的交互是正面的还是负面的。这被归于构建模型的数据的局限性。数据不包含节点交互的内容，以防违反样本参与者的隐私。因此，我们提出的模型扩展到包含情感分析，以评估用户之间交互的极性，将其作为权衡朋友关系的另一个维度。\n\
  \nAlsmadi 等人的模型通过从 OSN 中提取团（cliques）得到了扩展。与经典的极大团的使用不同，极大团关注的是评估两个特定节点之间是否存在关系（即二元的零或一），而提出的模型计算了每条边的权重，并最终计算了整个团的加权强度。\n\
  \n## 3. 朋友的加权信任\n\n\n\n\n在基于图的社交网络中，每个用户由一个节点表示。节点之间的边表示这两个特定节点之间的友谊关系。通常，社交网络（OSNs）中的友谊链接以二进制形式表示（即：存在或不存在）。然而，我们提出的模型根据不同朋友或节点之间的交互来计算不同关系的权重。这使得在大多数情况下，两个特定朋友之间的边值在某侧和另一侧不同。由于每个\
  \ OSN 的朋友之间可能有不同类型的活动，每种活动的权重是根据这些朋友在该项活动中的交互量除以以总活动交互量（即来自所有朋友的交互量）计算出的。OSN 中的每种活动计算出相同的权重，并根据所有活动计算出一个整体平均值。作为初始估计器，所有不同类型的活动（例如：赞、照片、标签、推文、转发、收藏）被赋予了相同的权重。最终，这些不同活动的权重将有所不同。\n\
  \n所提出的声誉模型旨在为 OSN 中的每个用户或节点提供一个单一值，以最好地识别其声誉评分。此前，我们根据节点与活动的交互情况为每个节点的朋友计算加权边。节点的加权声誉可以简单地视为该主体节点所有加权边（即来自所有朋友的边）的和。\n\
  \n## 4. 实验与分析\n\n目前有多个 OSN 数据集公开可用。然而，所选数据集存在某些限制，因为它应该包含有关 OSN 中朋友之间不同类型交互的信息。因此，我们使用了\
  \ `[3]` 中描述的数据集。该数据集包含了从 Facebook 收集的信息，包括 221 个唯一用户和这些用户之间的 2421 条边交互。该数据集还包含了关于\
  \ Facebook 中朋友之间三种类型交互的信息：共同页面点赞数、共同照片标签数和留言板贴文数。\n\n我们开发了一个程序，根据 `[1]` 中描述的方程计算加权边、声誉和加权团（。\n\
  \n# 5. 加权边\n\n表 1 展示了总共 2421 条边关系中的前 50 条。由于前 50 条边关系中的最后一个值为 (0.431)，这表明大多数社交网络关系可以被归类为（弱），因为\
  \ 2421 条中的 50 条占比为 43%。传统上，所有 2421 条边将被赋予值一（表示关系存在），而值为零（表示无关系）。根据我们的算法，对于社交网络中那些只有一个朋友的用户，其加权边中的值一将始终存在。当三种活动（赞、照片和留言板）中的每一种都被赋予三分之一的权重时，加权边为一。对于一个用户来说，这些活动中的每一个都将为一（因为分子等于分母）。然而，我们认为这种情况在现实中很少存在（即一个用户只有一个朋友），它在收集到的数据集中的存在很大程度上是因为收集过程的局限性。加权边为我们提供的“二进制”边（值可以是零或一）的替代方案的另一个重要信息，是了解两个朋友之间从两个方向来看关系的差异。在原始或二进制关系中，当关系存在时，它是双向的。在我们的情况下，加权边可以完全不同，并在零到一之间变化。例如，列出的前\
  \ 50 条加权边中没有任何一条在反方向上存在。这意味着这前 50 条关系仅在单侧是强。在 OSN 中，我们可以看到这种不平衡关系的模式。例如，一个名人或自我用户（ego\
  \ user）预计会有许多粉丝关注他/她，他们的方向有显著的加权边，而来自名人方向的权重较低。这种方法可以用于检测一些异常边的示例。例如，社交网络中的垃圾信息是近年来日益增长的问题，许多垃圾发送者只请求发布他们的广告。这些与朋友交互水平很低的用户可以根据我们的算法被检测到。加权边也可以作为一种根据交互对朋友进行分类的简单方法。例如，加权边在\
  \ 70%以上的朋友可以归类为“好朋友”，70% 到 30% 之间的可以归类为“普通朋友”，最后低于 30% 的水平归类为“轻度朋友”。\n\n**表 1：**\
  \ 前 50 名加权节点关系。\n\n![Image](img/tab5_1.jpg)\n\n# 6. 加权声誉\n\n如前所述，定义声誉的目标是为 OSN 中的每个用户提供一个单一且唯一的值，以便与同一\
  \ OSN 中的个体进行比较。该值应该促进信息质量和信任。这可以根据每个用户的的朋友数量以及这些朋友与源用户创建的活动之间的交互量计算出来。在信息质量方面，应该鼓励用户创建可以引发大量交互的内容。好朋友会与用户创建的大部分活动交互。为了隐私，目标是使系统根据交互自动对朋友分类，并最终决定他们在源节点上的隐私级别。与加权边的值相似，加权声誉的值在用户没有朋友时最小为零，在用户仅有一个朋友时为一。所有其他情况都介于两者之间。\n\
