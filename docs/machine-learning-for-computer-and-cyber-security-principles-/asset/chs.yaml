- "# 计算机与网络安全中的机器学习：原理、算法与实践\n\n\n\n\n\n\n\n*编辑*\n\n**Brij B. Gupta**\n\n印度，库鲁克什特拉国立技术学院\n\
  \n**Michael Sheng**\n\n澳大利亚，悉尼，麦考瑞大学计算机科学系\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n计算机安全涉及利用技术和策略，通过采取预防、检测和恢复活动来确保机密性、完整性和可用性。在多年来对网络安全的研究和教学中，我们注意到基于机器学习的解决方案呈现日益增长的趋势，其中大多数围绕机器学习和数据挖掘技术展开。由于无法找到任何关于这些现代技术的恰当汇编，我们决定编写这这本书，书名为*计算机与网络安全中的中的机器学习：原理、算法与实践*。\n\
  \n网络空间继续面临着具有挑战性的威胁和漏洞，使我们暴露在不同严重程度的网络攻击之中，而为了应对这些攻击，机器学习是一个理想的解决方案。我们认为，对任何技术问题的学习和理解都要求以不同的方式进行多次研究，这能为问题提供新颖视角。因此，为了确保可接受且满意的安全水平，要求研究人员清晰地理解新新技术及其工作机制。这本书对于希望在网络安全领域探索不同机器学习技术和工具的研究人员、教育工作者和工程师来说，非常有价值的参考。对于在软件开发中使用机器学习技术的人（特别是开发网络安全应用的人）来说也具有通用意义。我们希望书中介绍的工作能够激发新的讨论并产生原创思想，从而进一步发展这一重要领域。\n\
  \n我们对作者的贡献表示诚挚的感谢和认可，并感谢评审员通过专业知识改进了手稿。我们感谢 CRC Press 和 Taylor & Francis 集团给予我们出版这本书的机会。我们感谢他们在整个出版过程中提供的支持和专业精神。\n\
