  \ regression` | 0.906 | 0.906 | 0.999 | 0.950 |\n| 专家级手工设计特征 | | | | |\n| `Random\
  \ Forest` | 0.902 | 0.902 | | |\n| `Data set 2-CNN-LSTM` | 0.959 | 0.957 | 0.992\
  \ | 0.974 |\n| `Data set 3-CNN-LSTM` | 0.936 | 0.931 | 0.989 | 0.959 |\n\n**表 4：**\
  \ 将域名分类为良性或 DGA 生成并将 DGA 生成域名归类到其家族的测试结果总结（Dataset 1 的真阳性率和假阳性率见图 1.5）。\n\n| **方法**\
  \ | **准确率** | **精确率** | **召回率** | **F-score** |\n| --- | --- | --- | --- | --- |\n\
  | `RNN` | 0.920 | 0.922 | 0.920 | 0.918 |\n| `LSTM` | 0.963 | 0.964 | 0.963 | 0.963\
  \ |\n| `I-RNN` | 0.934 | 0.938 | 0.934 | 0.932 |\n| `GRU` | 0.959 | 0.960 | 0.959\
  \ | 0.958 |\n| `CNN` | 0.924 | 0.925 | 0.924 | 0.922 |\n| `CNN-LSTM` | 0.977 | 0.978\
  \ | 0.977 | 0.976 |\n| `bigram logistic regression` | 0.880 | 0.882 | 0.880 | 0.875\
  \ |\n| 专家级手工设计特征 | | | | |\n| `Random Forest` | 0.855 | 0.859 | 0.855 | 0.849 |\n\
  \n所有深度学习模型在 Dataset 2 和 Dataset 3 上的总体结果相对于 Dataset 1 要少得多。这是因为 Dataset 2 和 Dataset\
  \ 3 是在完全不同的环境中收集的。因此这些域名在训练模型中是未见的。然而，结果是可观的。\n\n### 8.5 结论、未来工作与局限性\n\n我们命名了 `Deep-DGA-Detect`，通过分析并探索由核心互联网协议（即\
  \ `域名系统 (DNS)`）生成的事件数据来对抗网络安全威胁。这可以作为一级互联网服务提供商（ISP）级别的网络威胁态势感知平台。该框架可以通过添加恶意软件二进制分析模块变得更加稳健，从而提供恶意软件的详细信息。此外，它完全无法通过直接使用\
  \ IP 地址通信来绕过 DNS 的恶意通信。这一局限性可以通过引入 `NetFlow` 来缓解。考虑到在更长域名上训练的计算成本，我们无法训练更复杂的架构。结果可以通过使用高计算成本的架构进一步改进。复杂的网络架构可以通过使用高级硬件并结合分布式训练方法进行训练，这是我们目前无法尝试的。\n\
  \n\n\n\n\n# 9. Deep-URL: 使用字符嵌入深度学习检测恶意 URL 的深度解析\n\n### 9.1 引言\n\n近年来，互联网已从简单的静态网站发展到数十亿动态交互式网站。这种进步彻底重塑了通信、交易和协作的范式，对人类是一件好事。然而，互联网的这些宝贵利益被网络犯罪分子所利用，他们利用网络作为媒介，借助非法优势实施恶意活动。通常，恶意攻击者使用受攻击的统一资源定位符（URL）作为主要工具指向恶意网站\
  \ [50]。受攻击的 URL 被称为恶意 URL，通过电子邮件和社交媒体资源等通信渠道传播。[51] 研究指出，所有网站中三分之一在本质上可能是恶意的，这表明了恶意使用恶意\
  \ URL 来实施网络犯罪。因此，及时检测受攻击的 URL 可以避免重大损失。开发一种应对恶意 URL 的适当解决方案已被认为是网络安全情报领域的一项重要工作。\n\
  \n市场上现有的大多数商业系统都是基于黑名单、正则表达式和签名匹配方法 [52]。所有这些方法都是响应性的，在检测现有恶意 URL 的变体以及完全全新的 URL\
  \ 时存在滞后性。在那期间，恶意攻击者可以从终端用户那里获利。这两种系统都需要领域专家，他们不断监控系统、创建签名并向客户推送更新。作为一种解决方案，十年来，研究人员提出了了几种基于机器学习的\
  \ URL 检测系统 [52]。这些系统需要领域级专家知识来对安全制品类型（例如 URL）进行特征工程和特征表示，并利用这些表示来寻找机器学习模型的准确率。在实时系统部署的情况下，基于机器学习的\
  \ URL 系统面临诸如大型标记训练 URL 语料库以及在 URL 模式持续变化时分析系统等问题。深度学习是机器学习的一个分支 [37]，它是降低训练成本的一种重要方式，并且作用于原始输入上，而不是依赖人工特征工程。对此，我们提出了\
  \ `deep-URL`，它将原始 URL 作为输入，通过字符级嵌入、深层网络和带有非线性激活函数的前馈网络来检测 URL 是恶性的还是良性的。为了进行对比研究，评估了其他机器学习分类器的性能。\n\
  \n### 9.2 相关工作\n\n研究人员已使用黑名单和基于机器学习的解决方案作为其检测恶意 URL 的主要技术。黑名单是广泛用于阻止恶意 URL 的非机器学习机制之一。它使用蜜罐、网络爬虫和通过人类反馈进行的手动报告作为工具来更新恶意\
  \ URL 库。当用户尝试访问 URL 时，黑名单将自动触发。它进行模式匹配以判断该 URL 是否在他们的存储库中。如果是，请求将被阻止。这已应用于网络浏览器中，如\
  \ PhishTank [53]、DNS-BH [54] 和 jwSpamSpy [55]。商业恶意 URL 检测系统包括 Google Safe Browsing\
  \ [56]、McAfee SiteAdvisor [57]、Web of Trust (WOT) [58]、Websense ThreatSeeker Network\
  \ [59]、Cisco IronPort Web Reputation [60] 和 Trend Micro Web Reputation Query Online\
  \ System [61]。黑名单机制简单、易于，且在发现新的恶意 URL 时完全无效，此外，始终需要人工输入来更新恶意 URL 库。\n\n机器学习方法依赖特征工程来提取词法、基于主机的特征以及两者的结合，以区分良性和恶意\
  \ URL。基于主机的特征包括与 IP 地址、域名、连接速度、WHOIS 数据和地理属性的信息。词法特征包括域名以及属性，如长度、标记和连字符的数量、IP 地址或端口号、目录、文件名和参数。最初，[62]\
  \ 使用带有 URL 特征的各种机器学习分类器将 URL 分类为恶意或良性。在特征工程中，他们使用了基于递归熵减的机制来获取标记，第二步他们从收集的标记中提取了一组特征。他们声称基于\
  \ URL 的特征与页面内容特征相比表现良好。[63] 他们仅使用词法、头部和时间信息的特征研究了 URL 的隐藏欺诈特征。他们报告的结果显示出更高的恶意检测率，此外他们还声明，当训练阶段存在大量恶意和良性\
  \ URL 样本时，这些方法可以表现良好。[64] 提出了一种使用在线学习算法处理大规模恶意 URL 的可扩展机制。他们报告说，通过一个实时 URL 分类系统证明了在线学习算法的性能优于批量学习算法。在线学习机制使用了黑名单主机信息和词法信息结合的特征集，在平衡数据集上显示的恶意检测率高达\
  \ 99%。[65] 他们比较了人工神经网络 (ANN) 方法与静态分类器（如支持向量机 SVM、决策树 DT、朴素贝叶斯 NB 和 K 近邻算法 KNN）在恶意网页检测中的有效性，使用了来自\
  \ URL 和页面内容的词法静态特征集。与其他静态分类器相比，ANN 方法通过报告 95.08 的最高准确率表现良好。此外，还详细讨论了每个特征对于识别攻击并从而降低误报率的重要性。[66]\
  \ 他们讨论了 SVM 和 ANN 方法使用词法和基于主机的特征检测恶意 URL 的性能。结果显示，ANN 机制优于 SVM，因为它能够长时间存储访问过的 URL\
  \ 过去信息，并在看到 MLP 网络隐藏层发生变化时进行更新和删除。遗憾的是，通过人工特征工程识别最优特征是一项艰巨的任务。此外，必须不断更新特征以规避不断变化的混淆技术。这项工作自动化了特征工程过程，而不是依赖人工特征工程。\n\
  \n### 9.3 实验\n\n### 9.3.1 数据集描述\n\n\n\n\n\n收集多种不同的 URL 是必要的。随着时间的推移，由于恶意 URL 的增加，人们即使相互协作，追踪日益增长的恶意\
  \ URL 样本也变得越来越困难。对于 `Dataset 1`，从 [Alexa.com](http://Alexa.com) DMOZ 目录以及 [OpenPhish.org](http://OpenPhish.org)、[Phishtank.com](http://Phishtank.com)、[MalwareDomainlist.com](http://MalwareDomainlist.com)\
  \ 和 [MalwareDomains.com](http://MalwareDomains.com) 获取了合法和恶意 URL 的唯一样本。`Dataset\
  \ 2` 来自 [68]]。将数据集分为训练集和测试集有多种方法。对于 `Dataset 2`，使用了两种划分方法：一种是使用 `scikit-learn` [67]]\
  \ 进行随机划分，另一种是使用时间划分（time-split）。在恶意软件检测案例中，时间划分效果良好，并有助于提高零日恶意软件的检测。训练数据集可以是早于测试数据集时间段内首次出现的\
  \ URL 样本。测试集可能是模型已拥有的且在作为零日恶意软件运行之前不可见的样本。`Dataset 1` 和 `Dataset 2` 的详细统计数据如表 5\
  \ 所示。\n\n**表 5：** URL 语料库统计。\n\n| **Dataset** | **Training** | **Testing** |\n|\
  \ --- | --- | --- |\n| Data set 1 | 150793 | 73229 |\n| Data set 2 random split\
  \ | 87201 | 37373 |\n| Data set 2 time split | 86315 | 38259 |\n\n### 9.3.2 超参数选择\n\
  \n所有深度学习模型实验均使用随反向传播（BPTT）方法进行训练。深度学习模型如 `RNN`、`IRNN`、`LSTM`、`GRU`、`CNN` 和 `CNN-LSTM`\
  \ 是参数化函数。因此，深度学习模型的恶意检测率隐含地取决于最优参数 [37]]。为网络和网络结构寻找最优参数被认为项重要任务。所有实验均运行 1000 个 epoch，批次大小（batch\
  \ size）为 256，学习率为 0.001。\n\n我们针对基础 `LSTM` 网络，对单元/内存块的数量（32, 64, 128, 256, 512）运行了三次试验实验。基础网络包含单个\
  \ `RNN`/`LSTM`/`GRU`/`IRNN` 层，随后是 0.2 的丢弃层（dropout）以及带有一个个神经元和 `sigmoid` 非线性激活函数的全连接层。与其他实验相比，在\
  \ `RNN/LSTM/GRU/IRNN` 中使用 256 个单元/内存块的实验表现较好。尽管 128 个单元/内存块的实验与 256 个的效果相当，但我们在其余实验中将单元/内存块的数量设置为\
  \ 256，以为特征学习提供额外的自由度。我们还尝试了将二元语法（bigrams）作为输入传递给 `RNN/LSTM/GRU/IRNN` 模型。二元语法的性能低于字符级输入。\n\
  \n我们在基础 `CNN` 网络中，针对卷积长度为 4 的过滤器（4, 16, 32, 64, 128, 256 和 512）运行了三次试验实验。基础 `CNN`\
  \ 网络由 `convolution1d`、池化长度为 2 的 `maxpooling1d`、带有 256 个神经元的全连接层、0.3 的丢弃层以及带有一个神经元和\
  \ `sigmoid` 非线性激活函数的全连接层组成。与其它过滤器相比，具有具有 256 个过滤器的 `CNN` 网络表现良好。此外，具有 128 个过滤器的\
  \ `CNN` 网络性能与 256 个相当。因此，我们决定在其余实验中将过滤器数量设置为 256。\n\n### 9.3.3 提出的架构\n\n所提深度学习模型的直观概览见图\
  \ 5。它包含三个部分：URL 字符编码、特征学习和分类器。深度学习架构包含多个在训练期间由深度神经网络学习的参数。在训练期间，嵌入、深度学习层和全连接层协同工作，以构建一个准确的恶意\
  \ URL 检测模型。模型在以下三个实验设计上进行评估：\n\n*   二分类，即在 `Dataset 1` 的随机划分上将 URL 分类为合法或恶意。\n*\
  \   二分类，即在 `Dataset 2` 的随机划分上将 URL 分类为合法或恶意。\n*   二分类，即在 `Dataset 2` 的时间划分上将 URL\
  \ 分类为合法或恶意。\n\n深度学习模型的计算流解释如下：\n\n**1. URL 字符编码：** 通过遵循上述机制，为 `Dataset 1` 构建了训练（150793*1666）和测试（73229*1666）矩阵，为\
  \ `Dataset 2` 构建了训练（87201*1666）和测试（37373*1666）矩阵，以及训练（86315*1666）和测试（38259*1666）。这些矩阵被传递到批次大小为\
  \ 256 的嵌入层，将每个字符映射到 256 长度的实值向量。作为超参数之一，为深度架构提供了额外的自由度。在反向传播期间，嵌入层与深度层协同工作。嵌入层尝试将相似字符分组在不同的簇中。这种表示有助于其他层轻松捕捉\
  \ URL 的语义和上下文相似性。为了可视化，将 256 高维向量表示通过 `t-SNE` 转换为二维向量，如图 6 所示，数字和特殊字符出现在不同的簇中。这表明嵌入层捕捉了\
  \ URL 的语义和上下文相似性。\n\n![Image](img/fig6_5)\n\n**图 5：** 深度学习架构概述；未显示所有层及其连接。\n\n![Image](img/fig6_6)\n\
  \n**图 6：** `CNN-LSTM` 分类器学习的嵌入字符使用二维投影（PCA）和 `t-SNE` 表示。\n\n**2. 通过深层进行特征学习：** 我们使用了各种深层，如\
  \ `RNN`、`LSTM`、`GRU`、`IRNN`、`CNN` 以及混合网络 `CNN-LSTM` 来进行特征学习。循环结构如 `RNN`、`LSTM`、`GRU`\
  \ 和 `IRNN` 捕捉序列信息，而 `CNN` 提取字符间的空间信息。所有深度学习架构仅包含一个深层。因此未使用批量归一化技术 [38]]。跟随正则表达式的模式匹配技术不同，深度网络层以连续值（即模式的程度而非二值）匹配模式。\n\
  \n**3. 循环层：** 我们采用了各种循环层，如 `RNN`、`LSTM`、`GRU` 和 `IRNN`。根据超参数选择期间获取的知识，单元/内存块的数量设置为\
  \ 256。循环层从字符级嵌入输出中学习序列信息。这产生了最优张量特征并将其传递到丢弃层。`RNN` 中的单元使用 `hyperbolic tangent` 作为输入和输出激活函数，其值范围在\
  \ [−1, 1] 之间。`LSTM` 记忆单元使用 `hyperbolic tangent` 作为输入和输出激活函数，其值范围在 [−1, 1] 之间，门门使用\
  \ `logistic sigmoid`，其值范围在 [1, 0] 之间。\n\n\n\n\n\n### 4. 卷积层\n我们使用 CNN 网络来捕捉字符之间的空间相关性。它由两个层组成，例如\
  \ `convolution1d` 和 `maxpooling1d`。`convolution1d` 层包含多个卷积操作，有助于提取局部特征。通常，一个 `convolution1d`\
  \ 层包含 256 个长度为 4 的过滤器，这些过滤器在字符嵌入向量序列上滑动，并在每一步产生一个连续值。该值代表了模式在字符嵌入向量子序列中的匹配程度。此 `convolution1d`\
  \ 的输出被传递到 `maxpooling1d`。该层包含一个长度为 4 的池化，可以将卷积特征图分为四个等份。同样，`maxpooling1d` 的输出被平化为一个向量并传递到全连接层。为了从\
  \ `max-pooling1d` 输出中学习序列信息，我们将其传入 `LSTM` 层，该层包含 50 个记忆块。\n\n### 5. 正则化\n在深层与全连接层之间放置了一个比例比例为\
  \ 0.2（CNN 中为 0.3）的 dropout 层。它作为正则化参数来防止过拟合。dropout 是一种在深度学习模型训练期间随机移除神经元及其连接的方法。当我们对不带\
  \ dropout 的深度学习模型进行实验时，网络在大多数实验中对数据产生过拟合（即使使用了大量的 URL 语料库）。\n\n### 6. 分类\n计算 URL\
  \ 具有恶意概率的下一步，是将深度学习层捕获的特征传递到全连接层。全连接层是学习深层捕获特征的非线性组合的合理方法。在全连接层中，前一层的每个神经元都与下一层的每个其他神经元连接。它包含两个层，例如一个具有\
  \ 128 个单元的全连接层，后面跟着带有 1 个单元和非线性激活函数的全连接层，用于将 URL 分类为合法或恶意。深度学习模型的预测损失使用 `binary-cross\
  \ entropy` 计算，公式如下：\n\n$$\nloss(pr,ep) = - \\frac{1}{N}{\\sum\\limits_{i = 1}^{\
  \ N}{\\lbrack ep_{i}\\log pr_{i} + (1 - ep_{i})\\log(1 - pr_{i})\\rbrack}}\n$$\n\
  \n其中 `pr` 是真实概率分布，`ep` 是预测概率分布。为了最小化 `binary-cross entropy` 和 `categorical-cross\
  \ entropy` 的损失，我们通过反向传播使用了 `Adam` 优化器。\n\n### 9.4 评估结果\n各种深度学习模型和机器学习模型的效性在两个不同的数据集上进行了评估，例如\
  \ `Dataset 1` 和 `Dataset 2`。`Dataset 1` 使用 `scikit-learn` 通过随机划分划分为训练集、验证集和测试集。`Dataset\
  \ 2` 使用了两种划分设计：随机划分和时间划分。`Dataset 1`、`Dataset 2` 的随机划分以及 `Dataset 2` 的时间划分的结果以 ROC\
  \ 曲线的形式所示，通过比较在 `[0.0–1.0]` 范围内不同阈值的两种运行特性（如真阳性率和假阳性率），分别展示在 [Figs. 7]、[8] 和 [9]\
  \ 中。该指标与整个语料库中合法 URL URL 的比例无关。`Dataset 1` 和 `Dataset 2` 的详细统计测量报告在 [Table 6] 中。机器学习分类器依赖于特征，特别是计算了三-gram。为了将三-gram\
  \ 表示转换为数值表示，使用了哈希机制。这创建了一个长度为 1000 的向量，并使用哈希算法对每个三-gram 进行哈希。这些向量作为输入传递到深度神经网络。深度神经网络包含五层：前两层包含\
  \ 256 个单元，第三层包含 128 个单元，第四层包含 64 个，第五层包含 32 个，最终输出层包含一个带有 `sigmoid` 非线性激活函数的单元。在深度神经网络的深层之间，我们添加了\
  \ `ReLU` 作为激活函数，随后是批归一化层和比例为 0.1 的 dropout 层。与 `Dataset 1` 相比，深度学习模型和机器学习分类器在 `Dataset\
  \ 2` 上的性能均较低。在两个数据集上中，深度学习模型的整体性能都优于 N-gram 或专家设计的特征。因此，我们声称带有深度学习层的字符级 URL 嵌入可以作为一种强大的自动特征提取方法。此外，N-grams\
  \ 在 `Dataset 1` 和 `Dataset 2` 中的表现均优于专家设计的特征。主要原因是大型 URL 语库的优势，以及 N-grams 集合在 NLP\
  \ 领域是一种有效的表示。\n\n**Table 6:** 测试结果总结。\n\n| **Data set 1** | | | | |\n| :--- | :---\
