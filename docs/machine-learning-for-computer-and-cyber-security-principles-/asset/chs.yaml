  **图. 10:** 网络规模 vs 路由负载。\n\n![Image](img/fig11_11.jpg)\n**图. 11:** 网络规模 vs MAC 负载。\n\
  \n图. 13 中的折线图显示了攻击以及检测防御机制对吞吐量的影响。如折线所示，在存在黑洞攻击的情况下，吞吐量几乎为零。但在检测后，提出的 `DTH-AODV`\
  \ 的吞吐量得到了极大改善，几乎与无攻击的正常 `AODV` 相等。\n\n![Image](img/fig11_12.jpg)\n**图. 12:** 网络规模\
  \ vs 应用层丢包。\n\n![Image](img/fig11_13.jpg)\n**图. 13:** 网络规模 vs 吞吐量。\n\n图. 14 中的折线图显示了攻击以及检测防御机制对\
  \ PDF（包交付率）的影响。如折线所示，在存在黑洞攻击的情况下，PDF 几乎为零。而在低网络密度下 PDF 为零。例如在 40 个节点时，由于 40 个节点中有\
  \ 15 个恶意节点并能够中断通信，但在检测期间，提出的 `DTH-AODV` 的 PDF 得到了极大改善，几乎与无攻击的正常 `AODV` 相等。在 PDF\
  \ 方面，正常 `AODV` 与提出的 `DTH-AODV` 性能几乎相等。\n\n![Image](img/fig11_14.jpg)\n**图. 14:**\
  \ 网络规模 vs PDF。\n\n图. 15 中的折线图显示了攻击以及检测防御机制对数据流端到端延迟（EED）的影响。随着网络节点数量的增加，性能会下降。如折线所示，黑洞攻击提供的\
  \ EED 似乎比正常 `AODV` 更低，但这并不意味着黑洞攻击改进了网络性能。攻击下的低端到端延迟源于一个奇怪的现象：攻击导致 TCP 流断开，由于数据包完全没有转发到任何后续节点，间接减少了网络中的消息开销并减少了带宽占用，否则这些带宽会被转发的数据包消耗。因此，未受黑洞攻击影响的流（没有相邻攻击节点的连接）利用了额外的带宽并获得了一些性能。此外，请记住，端到端延迟仅根据包发送和接收的时间计算。因此，如果包没有被接收，则无法计算端到端延迟。因此，该平均\
  \ EED 仅针对成功交付包的平均 EED。\n\n![Image](img/fig11_15.jpg)\n**图. 15:** 网络规模 vs 端到端延迟。\n\
  \n`DTH-AODV` 的 EED 比正常 `AODV` 略高，这是因为在攻击检测防御期间，将通过避开路径上的恶意节点来解决替代路由，导致路径长度增加，从而增加了端到端延迟。\n\
  \n\n\n\n\nFig. 16 中的以下折线图显示了攻击以及检测防御机制在电池能量消耗方面的影响。如图线图所示，在存在攻击的情况下，电池电量消耗低于正常的\
  \ `AODV`（无攻击状态），但这并不意味着这些攻击提高了能量消耗方面的性能。攻击下的低能耗产生的原因是，这些攻击导致了数据流中断，由于数据包完全没有被转发到任何后续节点，因此间接减少了其他节点的电量消耗；否则，这些电量将用于转发数据包而被消耗。因此，未受攻击影响的节点（即没有相邻攻击节点的节点）保留了一些电量。理解这一奇现象需要对整个网络场景进行更好的可视化。情况很简单——在没有任何攻击的情况下，`AODV`\
  \ 能够发送大量数据，且大多数节点能够参与该通信并将能量用于数据包的传输/转发，因此能量在大多数节点中被消耗。但在存在攻击的情况下，数据包在中途丢弃，完全不转发数据包的其他节点的电源得以保留。随着网络节点数量的增加，性能似乎在下降。\n\
  \n但有趣的是，所提的 `DTH-AODV` 的能量消耗比正常的 `AODV` 略低。这显然证明了所提检测模型的运行更好。\n\n许多之前的论文表示攻击会增加能量消耗。当然，这可能也是事实，但意义并不相同。例如，如果应用程序在攻击下持续尝试发送数据，那么发送节点以及发送者与攻击节点之间某些其他节点的电池将迅速减少。如果应用程序由于丢包而积极重传，这将增加能量消耗。但传输协议会处理丢包场景，并仅降低发送速率以避免进一步丢失。这就是为什么在攻击下，网络中的平均能量消耗似乎减少了。理解这一奇现象需要对整个网络场景进行更好的可视化。\n\
  \nFig. 17 中的以下折线图显示了攻击以及检测防御机制在开销方面的影响。如图所示，在存在黑洞的情况下，开销最小的，因为黑洞直接破坏了所有通信。但通过所提基于\
  \ `DTH-AODV` 的检测防御机制，开销变得与正常的 `AODV` 相同，这意味着所提的 `DTH-AODV` 工作效果与正常的 `AODV` 几乎一致。\n\
  \n![Image](img/fig11_16.jpg)\n\n**图 16：** 网络大小与电池能量。\n\n![Image](img/fig11_17.jpg)\n\
  \n**图 17：** 网络大小与开销。\n\n## 6. DTH-AODV 与其他信任路由算法的比较\n\nTable 3 比较了传统的基于 `AODV` 的信任路由算法与新算法\
  \ `DTH-AODV` 的特性。\n\n**表 3:** 现有基于 `AODV` 的信任路由协议与 `PTH-AODV` 的特性对比\n\n| 安全路由算法\
  \ | 特性 | 优点 | 缺点 |\n| :--- | :--- | :--- | :--- |\n| 针对共谋节点的协作信任路由 [66] | 该协议假设信任值预先分配给所有节点。\
  \ | 该协议旨在寻找通到目的地的最短路径。 | 信任的预先分配使得网络动态性降低，对变化情况适应性差。公钥基础设施的使用使得协议使用成本高昂，而且维护所有密钥会产生更多开销。该协议在节点被破坏的情况下会失效。\
  \ |\n| 嵌入信任 AODV (T-AODV) [67] | 该协议是 131 的扩展，区别在于通过交换路由消息定期更新信任因子。然而，该协议也假设了公钥基础设施的存在，并假设所有节点的无线范围相同，这在研究上更具理论性。\
  \ | 在此协议中，避免了恶意节点的以下行为：如果恶意节点通过更改跳数、目的地址等在 `RREQ` 数据包中提供错误信息；如果恶意节点意图更改信息而解密真实节点给出的签名。\
  \ | 该协议无法找到从源节点到目的地的安全端到端路径。在公钥基础设施上产生了更多开销。 |\n| 纯自组织网络中的信任建立 [68] | 该协议运行不需要受信任的第三方基础设施。所有节点计算机都基于直接反馈信任该值。\
  \ | 在路由发现期间会绕过恶意节点。在存在恶意节点的情况下，该协议实现了更好的吞吐量。 | 由于协议的特殊性增加了额外开销。协议的准确性取决于计算信任值时所分配的权重值。该协议更容易受到\
  \ IP 欺骗和 MAC 欺骗攻击。当恶意节点共谋时，该协议失效。 |\n| 基于意见的信任路由协议 – TAODV [69] | 该协议使用了软加密技术。 |\
  \ 消息的加密部分通过不同路由转发，使得恶意节点难以获取完整消息。 | 该协议容易受到内部攻击。路由选择花费更多时间。可能无法对所有消息进行安全路由。 |\n\
  | 基于友谊的路由算法 – frAODV [70] | 每个节点存储友好节点列表和友谊值。友谊值决定了信任程度。在控制数据包传输期间，节点之间交换友谊值。 |\
  \ 性能在更动态的网络中提供了更好的结果。 | 实验是基于 5 个节点进行的，因此该协议在大规模节点下的性能尚不确定。 |\n\n\n\n\n\n| 协议 |\
  \ 描述 |\n| :--- | :--- |\n| **DTH-AODV** | 该协议不需要公钥基础设施。它也没有使用任何加密技术。然而，节点仅在需要建立路由时才会交换信任值，且信任值取决于成功通信中前一个邻居提供的反馈。该协议还避免了由于定期交换信任指标带来的额外开销。通过节点间信任值的交换，该协议可以检测所有自私节点和恶意节点。此外，有时长时间未参与通信的真实节点会被误判为自私节点。该协议还避免了将真实节点误指为自私节点。\
  \ |\n| **未来工作** | 针对随时间推的信任分散和信任延迟可以进行更多工作。也可以通过恶意场景收集信任。针对恶意合谋节点，也可以进行更多工作。 |\n\
  \n## 7. 结论\n\n### 7.1 总结\n\n在这项工作中，我们提出了一种基于动态信任握手的黑洞攻击检测方法。我们在 `NS2` 环境下实现了 `DTH-AODV`，并将其性能与标准\
  \ `AODV` 以及受攻击下的标准 `AODV` 结果进行了比较。所提 `DTH-AODV` 的主要优势在于能够在路由发现过程的极早期就检测并防止了恶意节点。因此，在路由解析过程中，不需要对路由表进行任何操作，因为根据设计，它在路由发现阶段本身就避免了将恶意跳包含在正常节点的表中。\n\
  \n### 7.2 分析与结果\n\n我们进行了大量的仿真和分析，以获得显著且可解释的结论。通过合适的指标衡量了攻击对检测和防御机制的影响，并解释了性能的改进。根据得的结果，所提出的基于动态信任握手的恶意节点检测与防御机制运行良好，成功检测到了网络中的黑洞节点，并避免了通过它们建立路由。如上一节结果所示，所提\
  \ `DTH-AODV` 的吞吐量和 `PDF` 几乎达到了正常的 `AODV`。\n\n在此工作中，我们在设计中使用了未加密的信任握手消息，但在未来的工作中，我们可能会探索使用基于私钥或/公钥的加密机制来实现更安全的运行。这可能会增加运行开销，但可以解决与基于加密的信任握手机制相关的开销问题。\n\
