  \ 49th Hawaii International Conference on IEEE.\n\n# 第 13 章 针对 Web 应用程序防御 JavaScript\
  \ 恶意代码\n\n### 1. 引言\n\n在线网络（OSN）是促进交流的虚拟场所。如今，许多社交网络拥有数百万用户。最受欢迎且最大的社交网络是拥有十亿用户的\
  \ Facebook。社交网络不仅限于非正式用途；它也被用于正式目的。网络存储了大量的个人/职业信息，因此黑客对这些网站非常关注。黑客可以利用这些信息进行活动。为了给在线用户提供更好的服务，社交网络利用\
  \ JavaScript 或相关的编程语言能力。对这种语言的支持为恶意代码注入提供了肥沃的土壤[1]]。此类恶意代码的注入引发了跨站脚本（XSS）威胁[2]。实际上，跨站脚本的缩写曾是\
  \ CSS，但由于它与层样式表冲突，因此被更改并改为 XSS。跨站脚本是由微软工程师在 2000 年命名的。此前见证过多次利用 JavaScript 漏洞的跨站脚本攻击；其中一个案例发生在\
  \ 2005 年 10 月 4 日 My Space 社交网站发布期间。该网站遭受了名为 JS 的 XSS 病毒攻击。空间英雄（俗称 Samy）由 Samy Kamkar\
  \ 设计。超过百万用户运行了该破坏性负载，导致了 Samy 的异常传播。Samy 实际上携带了一个恶意脚本，会在受害者的 My Space 个人页上显示“但最重要的是，Samy\
  \ 是我的英雄”。另一次 XSS 攻击发生在 2016 年的跨国电商公司 eBay，当时其登录页面被攻击者注入了恶意脚本，会在用户输入电子邮件和密码后返回错误信息。根据最近的统计，恶意代码注入是\
  \ Web 应用程序中常见的漏洞。这些漏洞的存在是因为对用户输入验证不当。由于当前 Web 应用程序的范围和复杂性以及浏览器调用 JavaScript 引擎的无数方式，消除所有可能的恶意代码注入是不可能的。最初，当由于恶意代码注入导致\
  \ XSS 时，它被分为两类：存储型 XSS 和非持久型 XSS。后来，第三类 XSS（即基于 DOM 的 XSS）在 2005 年被定义[3]。\n\n\n\n\
  \n在云计算非常盛行的现代，云安全是一个备受关注的话题。如今，许多商业级 IT 组织正通过访问在线社交网络（OSN）的服务来利用云计算的特性，而不是投入昂贵的传统计算，因为后者需要物理计算机内存和高能耗。在\
  \ Web 2.0 和 HTML5 技术时代，OSN 被认为是共享信息最常用的方法，因为众周知，用于云计算的设置安装在互联网上，而不是单机上。因此，在基于云的环境背景下，存在许多互联网基础设施的应用程序漏洞。\n\
  \n跨站脚本（XSS）攻击是 Web 应用最关键的安全关注点。根据 `Acunetix Web Application Vulnerability Report`、`2017`，几乎\
  \ 50% 的网站容易受到 XSS 攻击 [4]。2015 年的报告显示，只有 33% 的 Web 应用容易受到 XSS 攻击。从报告中可以推断，易受 XSS\
  \ 攻击的 Web 应用程序数量增加了 17%。跨站脚本（XSS）是 2017 年用于利用 Web 应用程序最常见的攻击类型（占比 39.2%）。同样代表的是用于访问敏感信息或运行\
  \ OS 命令以进一步渗透系统的 SQL 注入，位居最常用攻击之第二（占比 25.1%）。预计跨站脚本和 SQL 注入将继续占据利用 Web 应用攻击的一半以上。除了\
  \ XSS 和 SQL 注入外，涉及信息泄露的信息泄露和 XML 注入也是主要威胁之一（占比 8.8%）。许多研究人员观察到 XSS 攻击的效果取决于所使用的\
  \ Web 浏览器类型，因此对 Web 模块的 XSS 攻击质量取决于所使用的浏览器类型 [5, 6, 7, 8, 9, 10]。作者对本文的贡献是提供一种新颖的方法，通过在云虚拟机和雾设备边缘网络上使用脚本属性函数来保护\
  \ Web 应用免受 XSS 攻击 [11, 12, 13, 14, 15, 16]。以下点解释了为什么大量 Web 应用容易受到 XSS 攻击：\n\n###\
  \ 单独使用服务端防御机制不足\n服务器端内容验证是 XSS 防御最常用的做法。纯服务器端的缓解策略基于客户端浏览器的解析/渲染与服务器端处理一致的假设。但实际上，这种一致性是缺失的，且对输入的客户端验证不可信。近期已有攻击者针对了这一漏洞。服务器上的一个字符串，例如\
  \ `<button onclick:=attack\\_code>`，会被浏览器解释为 `<button onclick=attack_code>`，而 `attack_code`\
  \ 由 JavaScript 引擎执行。\n\n### 内容验证是一种易错的机制\n对不可信数据的验证也是防止 XSS 的常用机制。清理（Sanitization）是此类验证的一种，它从不可信数据中移除可能的恶意元素。转义（Escaping）是另一种方法，它转换危险元素，防止它们被\
  \ JavaScript 引擎解释。特殊字符表明，清理机制经常无法防止所有攻击，特别是当 Web 开发者使用流行的服务端脚本语言（如 `PHP`）提供的自定义内置清理函数时。这些\
  \ `PHP` 内置清理函数检查用户输入并快速验证数据。`PHP` 的 `filter_var()` 函数会移除 ASCII 值大于 127 的字符，并移除 HTML\
  \ 标签；因此它忽略了用户输入中的特殊字符，导致对内容的清理不当。\n\n### 开发者技能缺乏\n对于在线社交网络，当务之急是为用户提供易于数据的相互接收和返回。这同时也方便了攻击者与应用程序进程的直接通信。此外，开发者并不关注如何提高在线社交网络对于此类攻击的防御安全性，因此增加了\
  \ `OSN` 面对不同攻击向量的脆弱性。\n\n基于可验证的观察，我们列出了 XSS 保护的三项要求。防御不应仅依赖于服务端清理。此外，我们应该有一个客户端清理过程。防御不应仅依赖于对恶意活动症状（如跨域敏感信息窃取）的检测。防御必须以一种在浏览器实现和用户配置中均可靠的方式来限制不可靠的数据。\n\
  \n## 2. XSS 攻击背景\n\n\n\n\n\n跨站脚本（Cross-Site Scripting）是基于 OSN 的 Web 应用程序最显著的攻击。这些攻击通过在云端\
  \ OSN 应用的注入点插入恶意脚本，来窃取活跃用户的敏感凭据或劫持其在 Web 应用上的会话；甚至当用户点击某些恶意链接时（攻击者可以通过 XSS 将恶意脚本部署到网页或我们的\
  \ OSN 账户中），安装新的网络浏览器。博客 Web 应用等具有大量用户输入字段的 Web 应用更容易受到 XSS 攻击的影响。通过 XSS，攻击者可以通过修改网站的内容获取对网站所有输入和输出数据的控制。XSS\
  \ 在绕过 SOP（同源策略）概念方面也起着重要作用。SOP（同源策略）禁止网站从另一个源的页面获取内容。例如，[www.JSsanspf.com/login.html](http://www.JSsanspf.com)\
  \ 的信息无法被 [www.cracker.com](http://www.cracker.com) 访问；而是可以被 [www.JSsanspf.com/form.html](http://www.JSsanspf.com/form.html)\
  \ 访问，因为它属于同一个源。通过禁止对跨源内容的访问，随机网站在登录启用 SOP 的 Web 应用页面时，无法读取或修改其中的数据。XSS 攻击具有巨大的危害，且是\
  \ Web 应用中一个普遍存在的安全问题 [8, 9, 10]。成功的 XSS 攻击不仅会给用户带来严重的安全损害，还会给 Web 应用带来损害。每当 HTML\
  \ 代码动态生成且用户输入未经过过滤并反映在页面上时，就容易受到 XSS 攻击，因为攻击者可以在那里插入自己的 HTML 代码。Web 浏览器的 JavaScript\
  \ 引擎会运行 XSS 代码，因为它将其视为由部署在云平台虚拟机上的 OSN 服务器所发送的响应。通过这种方式，攻击者能够访问同一域的其他页面，并读取数据或设置\
  \ cookie。XSS 已成为世界万维网的严重危险之一。图 3 展示了用于对漏洞 Web 应用进行 XSS 攻击的流程抽象视图。该图中也清楚地反映出三方（即攻击者、\
  \ 浏览器和受害者设备）参与了 XSS 攻击过程。要发生 XSS 攻击，攻击者在注入点中注入恶意 JavaScript，该注入点可能是 Web 应用的注释部分或任何用户输入字段。恶意\
  \ JS 攻击向量被保存到 OSN 服务器的数据库中。现在，当客户端从部署在云平台虚拟机上的 OSN 服务器请求页面（HREQ）时，OSN 服务器响应 HTTP\
  \ 响应（HRES），其中也包含恶意的 JS 代码，该代码在客户端机器上运行。当 Web 应用受到攻击时，用户的所有重要信息可能被窃取 [11, 12, 13,\
  \ 14]。\n\n### 2.1 XSS 攻击的分类\n\nXSS 攻击分为四类，即非持久性、持久性、基于变异和基于文档对象模型（DOM）的 XSS 攻击。这四类攻击在对\
  \ Web 应用的利用方式上不同，但目标都是窃取用户凭据。\n\n### 2.1.1 非持久性跨站脚本攻击\n\n被称为反射型 XSS（Reflected XSS）。在此类攻击中，用户通过\
  \ HTTP 请求（HREQ）将用户输入发送到 OSN 服务器，服务器响应 HRES，其中在错误消息、搜索结果或任何其他响应中包含了完整的、未经过过滤的用户输入。这种攻击也被称为\
  \ TYPE 1 XSS，因为攻击是通过单次请求/响应周期执行的 [6, 7]。\n\n图 1 解释了非持久性 XSS 攻击的一种模式。\n\n![Image](img/fig13_1.jpg)\n\
  \n**图. 1:** 非持久性 XSS 攻击的利用。\n\n### 2.1.2 持久性跨站脚本攻击\n\n这种攻击也称为非反射型 XSS 攻击。如 图. 2\
  \ 所示，在此攻击中，攻击者在注入点注入恶意代码，代码被保存在 OSN 服务器的数据库中。当客户端请求页面时，OSN 服务器通过发送包含恶意代码的页面进行响应，浏览器将其认为是开发者编写的脚本，JavaScript\
  \ 引擎执行该代码。持久性攻击频率较低，因为注入点较少且较难识别，但同时它们比非持久性攻击更危险，因为后者只影响一个用户，而持久性攻击会影响所有请求恶意代码的用户\
  \ [12, 13, 14]。\n\n![Image](img/fig13_2.jpg)\n\n**图. 2:** 持久性 XSS 攻击的利用。\n\n###\
  \ 2.1.3 基于 DOM XSS 攻击\n\nDOM XSS 是一种跨站脚本攻击，它依赖于对其关联 DOM 响应数据的不当处理 [6, 7, 8, 9]。大多数读者会混淆基于\
  \ DOM 的 XSS 攻击和反射型 XSS 攻击。基于 DOM 的 XSS 修改网页的文档对象模型，JavaScript 代码在应用程序中执行，尽管看起来与反射型\
  \ XSS 相似，但区别在于当我们更改 DOM 时，数据永远不会到达服务器。这意味着攻击发生在客户端，即服务器端不受影响。表 1 突出了不同类型 XSS 漏洞的总结。DOM\
  \ 中有几个对象攻击者可以操纵以创建 XSS 条件。\n\n**表 1:** XSS 类型总结。\n\n| 类型 | 名称 | 漏洞位置 | 描述 | 利用级别\
  \ |\n| --- | --- | --- | --- | --- |\n| 0 | 基于 DOM | 客户端脚本 | 使用文档对象通过客户端脚本写入 HTML\
  \ | 高 |\n| 1 | 非持久性 | 服务端脚本 | 用户提供的数据被服务器产生可能未正确编码的结果 | 高 |\n| 2 | 存储型、持久性 | 服务端脚本\
  \ | 用户提供的数据存储在服务器上以后显示而未正确编码 | 低 |\n\n## 2.2 现有解决方案的低效\n\n鉴于 XSS-Guard [17] 的日益流行，以及在检测恶意脚本的实验中对\
  \ Web 应用源代码的有限使用（特别是针对在线用户端点），非源码分析在 XSS 攻击预测和误报率（FPR）评估中日益受到关注，特别是在 OSN 平台上。近年来，基于\
  \ Web 代理的监控系统取得了巨大进展 [18, 19]，但这些系统不断忽略精确过滤器的设计开发以及在 Web 应用源码中的合理放置。\n\n\n\n\n最近，机器学习算法（朴素贝叶斯、支持向量机\
  \ (SVM) 和 J48 决策树）已成为早期评估恶意脚本攻击向量快速且高效的替代技术 [20]。商业专家系统（如 AppScan、N-Stalker、Zed\
  \ Attack Proxy、WebInspect 和 Acunetix）被 Web 开发人员用于预测 XSS 攻击向量 [21]。这些扫描器的缺点在于它们使用正则表达式来检测动态内容的呈现，导致保真度低并误杀良性\
  \ HTML 内容。因此，多年来，此类技术的误报率（FPR）仍然无法控制。大多数的 XSS 防御技术依赖于平台，因为不同的解析器对脚本内容的解释方式不同，因此\
  \ Web 浏览器具有多种不同的解析差异。为了解决这个问题，一种自定义的平台无关 HTML 解析器（即 `BIXSAN`）在浏览器端生成解析树，以减少 浏览器的不规则行为\
  \ [22]。随后，它在几种 Web 浏览器基础设施（如 Opera、Netscape、Internet Explorer (IE)、Firefox Google\
  \ Chrome）上进行了评估，发现其适应性较差，因为它要求对此类 浏览器的现有基础设施进行重构。此外，这些现有技术的设置扩展性不足，无法有效集成并评估托管在云平台虚拟机上的\
  \ Web 应用。\n\nXSS 攻击以两种形式存在——存储型 XSS 和反射型 XSS，恶意脚本代码通常在服务器端引入。针对这两类 XSS 蠕虫，存在无数防御解决方案。尽管有很多可用解决方案，但极少有能应对最新类型的\
  \ XSS 攻击；例如，一个因素是 HTML5 的引入，尽管 HTML5 在功能、设计和演进的用户指示性方面帮助 Web 应用达到了全新的高水平，并被视为 Adobe\
  \ 的 Flash 和微软的 Silverlight 的替代品。此外，HTML5 也给我们带来了新的安全挑战和攻击漏洞，在开发 Web 应用时需要注意。HTML5\
  \ 提供了跨源资源共享 (CORS)，它绕过了同源策略 (SOP)，增加了针对 XSS、CSRF 等攻击的脆弱性。HTML5 提供了许多 API，如 web worker、history\
  \ 以及包括`<video>`、`<source>`、`<autofocus>`标签，用于创建新的 XSS 攻击向量，例如：\n\n```\n<video><source\
  \ on error= “<script>alert(“XSS ATTACK”)</script>></video>\n```\n\n现代 Web 浏览器或现有的\
  \ XSS 攻击过滤器对这些新的 HTML5 攻击向量效率低下。此外，与其他语言不同，恶意函数是在运行时检测的 [7]。而且，大多数 Web 应用允许通过`<script>`\
  \ 标签或链接标签 `<a>` 使用第三方 JavaScript，这是此类攻击的主要原因。因此，代码直接从第三方源检索并立即处理。所以此代码不受宿主端应用的控制，甚至不受\
  \ Web 服务器的控制。因此，需要一种基于 DOM 的 XSS 攻击防御解决方案，它可以找出 XSS 攻击向量并通过有效的 HTML5 XSS 攻击向量清理/过滤机制对其进行诊断。大多数可用技术依赖字符串匹配方法，这种方法无法识别扭曲的\
  \ JavaScript 攻击向量注入。此外，解析器的选择也非常重要，因为 `JSOUP` 解析器可以清理白名单，因此可以是一个很好的选择。在不评估上下文的情况下对\
  \ JavaScript 代码的危险变量进行清理/过滤，在减轻 JavaScript 攻击向量的影响方面是一种无效的清理技术。\n\n## 3. 浏览器无关清理框架\n\
  \n作者提出了一种新的脚本注释估计和浏览器无关的清理框架，用于扫描托管在云平台虚拟机上的 Web 应用中的此类恶意攻击向量。现有的基于依赖器的清理机制的技术 [2,\
  \ 3, 4] 仅成功揭示了此类脚本代码非法字面量/变量的外部上下文，并在在其中注入了清理原语函数。无疑，除非该技术能够找到脚本代码的此类上下文，否则清理并不是缓解\
  \ Web 应用中 XSS 蠕虫影响的有效机制。基于这一严重的研究空白，作者引入了针对云托管 Web 应用中 JS 蠕虫的增强浏览器无关运行时动态解析和清理。\n\
  \n所提出的框架通过两个例程工作，即脚本注释注入和脚本注释评估。从脚本注释注入阶段开始，通过 Web 解析器对 Web 应用模块进行解析，`DOM generator`\
  \ 生成相应的 DOM 树。`DOM generator` 接收解析器的 URL 链接作为输入。从相应的 DOM 树中提取的脚本代码特征被估计并注入到原始源代码中。脚本注释库保留注入的特征以及源代码。此外，通过\
  \ `script comparator` 例程工作，HTTP 请求被转发到 Web 服务器，浏览器接收相应的 HTTP 响应。隐藏的注入点由 HTML 解析器管理并提供给脚本链接提取器以提取所需的脚本代码。\n\
  \n作者提出了一种新的清理机制——`使用脚本属性函数的 JavaScript 清理 (JS-SANSPF)`，这是一种基于注入和聚合的清理框架，使用了脚本属性函数。该框架建议以两种模式运行，即训练模式和检测模式。当\
  \ Web 应用刚刚开发完成并准备放在 OS 服务器上时运行训练模式。每当 Web 应用有 HTTP 请求时，运行检测模式。建议在训练模式和检测模式下计算脚本属性函数。训练模式中的计算结果被保存并与检测模式中的计算进行匹配。如果两次计算结果相同，则\
  \ HTTP 响应不受任何 XSS 攻击向量；如果计算不匹配，则可以推断 HTTP 响应包含 XSS 攻击向量并需要清理。\n\n### 3.1 抽象视图\n\n\
  \n\n\n\n在这里，作者简要讨论了所提出的框架，如图 3 所示。该框架被设计以两种模式运行，称为训练模式（Training mode）和检测模式（Detection\
  \ mode）。训练模式是一次性活动，在 Web 应用程序开发完成并准备部署到 OSN 服务器时运行。在训练模式下，该框架将识别并定位 Web 应用程序可能的注入点，并计算注入点处找到脚本的属性函数。检测模式则每当对\
  \ Web 应用程序有 HTTP 请求时，在雾网设备的边缘网络上执行。在执行检测模式之前，会将训练模式计算出的原始 SPF 附加到 HTTP 响应（HRES）中。在检测模式下，框架将计算\
  \ HRES 的脚本属性函数（SPF），并将其与原始 SPF 进行比较。如果比较结果显示两个 SPF 相同，则将 HRES 发送到客户端。否则，将对 HRES\
  \ 进行清理后发送到客户端。清理是一个复杂的过程，包括对相似的脚本进行聚合，然后为每个聚合组创建模板，以便该组的脚本可以用单个模板来表示。然后，使用高效算法对模板进行清理。图\
  \ 4 也说明了我们框架的两种模式的流程图。\n\n![Image](img/fig13_3.jpg)\n\n**图 3：** 防御模型的抽象视图。\n\n![Image](img/fig13_4.jpg)\n\
  \n**图 4：** 我们框架两种模式的流程图。\n\n### 3.2 详细视图\n\n在这里，作者讨论了如图 6 所示的框架详细视图。JS-SANSPF 框架以两种模式运行，即训练模式和检测模式。\n\
  \n### 3.2.1 训练模式\n\n该模式是一次性活动，在 Web 应用程序开发完成并准备部署到 OSN 服务器时执行。在此阶段，首先爬取 Web 应用程序模块，根据数据的输入字段检查其是静态网页还是动态网页。给该\
  \ Web 模块的输入是经爬虫获取的提取网页。对输入进行解析，以检查网页是静态的还是动态的。如果模块的输出本质上是静态的，则直接通过解析器并生成文档对象模型（DOM），但如果模块本质上是动态的，则由\
  \ Crawljax 爬虫爬取。爬虫的输出随后传递给 HTML 组件解析器，解析器解析网页中的 HTML 代码以生成 DOM 树。解析器的输出传输到组件层级生成器（CHG），它创建代码中所用组件的层级结构。CHG\
  \ 的输出输入到树遍历器，遍历器遍历树并将其输出发送到注入点提取器（IPE）。IPE 还从 IP 仓库获取输入，该仓库存储了 Web 模块中可以找到的所有可能的注入点。然后，IPE\
  \ 通过 IP 仓库的输入在代码树中识别可能的注入点。IPE 将其输出发送到 JS 矿器，由其识别可能注入点处使用的 JavaScript 代码。JS 矿器的输出发送到脚本属性函数创建器，它计算可能注入点处使用的脚本的属性函数。\n\
  \n### 3.2.2 检测模式\n\n该模式在每次发起 HTTP 请求时执行。该模式解析 HTTP 响应（HRES）并创建 DOM 树。然后，模式从 DOM\
  \ 树中提取脚本并计算提取脚本的脚本属性函数（SPF）。将计算出的 SPF 与训练模式中计算的 SPF 进行比较。如果两组 SPF 之间没有偏差，则将 HRES\
  \ 发给用户。如果发现偏差，则将 SPF 与原始 SPF 不匹配的脚本与“作弊表”（cheat-sheet）进行比较，该表是到目前已使用的 XSS 脚本向量列表。\n\
  \n**情况 1**：如果在作弊表中发现了该脚本，则对该脚本进行聚合，并为每个聚合组创建一个模板，以表示该组的所有脚本。将使用高效算法对模板进行清理，由该模板表示的脚本将进行相应的更改。\n\
  \n**情况 2**：如果不在作弊表中找到该脚本，则 Web 应用程序所有者的安全部门将收到该脚本的警告。由于框架无法在作弊表中找到该脚本，框架无法确定该脚本是否为\
  \ XSS 攻击向量。但是，它将尽力防止任何可能的 XSS 攻击向量到达客户端。框架将采取的步骤包括事件处理、移除可疑关键词、检查数据 URI 以及移除字符转义。完成这些步骤后，框架将把清理后的\
  \ HRES 发送到客户端。\n\n### 3.3 JS-SANSPF 的核心组件\n\nJS-SANSPF 以两种模式工作：训练阶段和检测阶段。在这里，作者讨论了两种模式的组件。\n\
  \n### 3.3.1 训练阶段\n\n**HTML 组件解析器 (HTMLCP)**：Web 应用程序的数据被发送到 HTMLCP，其工作是将 HTML 标记语言解析为解析树。HTMLCP\
  \ 解析整个 HTML 文件并将解析后的数据存储在字符串 `S` 中。由于解析是基于语法法定义的语法，因此解析遵循一组规则。\n\n**组件层级生成器 (CHG)**：该模块读取字符串\
  \ `S` 并生成字符串的 DOM 树，在树中组件被分离。DOM 树是 HTML 的对象表示，类似于 JavaScript。树的根节点是 `Document`\
  \ 对象。生成 DOM 树的操作由语法分析器执行，它生成解析树。生成的 DOM 树传递给语义分析器，后者生成语义解析树。在 HTML 的情况下，我们使用 `HTML-DTD`（超文本标记语言文档类型定义）语法。例如，`S=\"\
  <html><head><title></title><script></script></head></html>\"`\n\n**树遍历器**：该模块遍历整个\
  \ DOM 树（数据结构 `D`），并输出所有不同的节点。树遍历器在我们的案例中执行分词，生成对应节点的令牌流，我们稍后用它从注入点仓库中识别注入点。例如，对于上述数据结构\
  \ `D`，模块将输出一个节点数组，`N = {\"html\", \"head\", \"title\", \"script\"}`。\n\n**注入点仓库\
  \ (IPR)**：该模块包含所有可能的注入点列表。该仓库全球通用，并用于发现 Web 应用程序中的漏洞。\n\n**注入点提取器 (IPE)**：该模块检查\
  \ Web 应用程序中的注入点漏洞。该模块的输入是树遍历的输出（在本例中为数组 `N`）以及由 `IPR` 生成的列表。它包含与 `IPE` 匹配的注入点。该模块的输出是注入点数组\
  \ `IP`。\n\n\n\n**JS Miner**: 该模块从注入点提取器中提取脚本。该模块的输入是 `array IPE`，输出是 `array JS`。\n\
  \n**脚本属性函数创建器 (SPF Creator)**: 该模块根据脚本的属性计算脚本的**脚本属性函数 (SPF)**。该模块的输入是 `array JS`。该模块的输出是\
  \ `string SPF`，随后被存储在**脚本属性函数仓库 (SPF Repository)** 中。\n\n**脚本属性函数仓库**: 该模块包含存在所有所有注入点中的脚本的\
  \ `SPF`。该模块在检测模式下也起着重要作用，因为它会在 HTTP 响应中附加 `SPF`。\n\n![Image](img/fig13_6.jpg)\n\n\
  **图. 6:** 提议的防御框架。\n\n### 3.3.2 检测阶段\n\n**脚本属性函数差异器 (SPFD)**: 该模块计算存在于 `HRES` 中的脚本的\
  \ `SPF`，然后将其与训练阶段计算出的 `SPF` 进行比较。如果 `SPFs` 相同，比较输出为 `true`；如果两个 `SPF` 不相同，则输出为 `false`。`False`\
  \ 输出意味着某些注入点被插入了额外的脚本，而该脚本并非开发者最初在 Web 模块中编写。此类脚本本质上可能是恶意的，因此在发送到浏览器之前，将其发送到后续组件进行进一步调查。如果\
  \ `SPFD` 返回 `true`，则会将 `HRES` 发送到浏览器；否则，产生 `false` 输出的脚本将发送到**脚本表比较器 (Cheat Sheet\
  \ Comparator)** 进行进一步调查。\n\n**脚本表比较器 (CSC)**: 该模块将输入脚本与**攻击脚本表仓库 (Cheat-Sheet Attack\
  \ Repository)** 中列出的脚本进行比较。`攻击脚本表仓库` 包含了到目前为止的所有 XSS 攻击向量。该模块的输入是那些 `SPF` 未在训练阶段开发的\
  \ `SPFs` 列表中找到的脚本。如果在仓库中发现了输入脚本，则意味着这些脚本确实是 XSS 攻击向量，并将发送到**JS 攻击向量聚合器 (JS Attack\
  \ Vector Congregator)** 进行清洗；否则，这些脚本不一定是攻击向量，但为了安全起见，`脚本表比较器` 模块将向拥有 Web 模块的组织发送关于额外脚本的警报，并尝试根据其启发式算法清洗这些脚本。\n\
  \n**JS 攻击向量聚合器**: 该模块对外观相似的脚本进行聚类。该模块将每个脚本与其他脚本进行比较，并计算两个脚本之间的 `Levenshtein’s distance`。如果计算出的\
  \ `Levenshtein’s distance` 小于等于最大允许的 `Levenshtein’s distance`，则对这两个脚本进行聚合。图 7 展示了相似脚本分组的示例。\n\
  \n**模板构建器**: 该模块负责创建脚本模板。该模块的输入是脚本簇。该模块找到给定簇中脚本的**最长公共子序列 (LCS)**。然后模块找到一个与 `LCS`\
  \ 最相似的脚本（其与 `LCS` 的 `Levenshtein’s distance` 最小），假设为 `string s`。模块随后比较 `string s`\
  \ 和 `LCS`。在字符匹配的位置，将该处的字符附加到模板字符串中。否则，只有当模板字符串中的上一个字符不是‘-’时，才在模板字符串中附加‘-’字符。图 8\
  \ 展示了给定簇的模板构建示例。\n\n![Image](img/fig13_8.jpg)\n\n**Fig. 8:** 模板构建器过程的形成。\n\n**背景敏感性清洗器**:\
  \ 该模块负责恶意脚本的清洗。该模块的输入是脚本模板，输出是清洗后的脚本模板。\n\n**脚本属性函数计算算法**: 该算法接受脚本字符串作为输入。该算法维护一个名为\
  \ `SPF` 的链表，其中包含所用脚本的**脚本属性函数**。算法遍历脚本并找出脚本使用的左括号数量。如果脚本不包含左括号，则输入脚本是一个简单的命令，例如变量初始化或向变量中插入新值。在这种情况下，整个命令被推入\
  \ `SPF 链表`。如果脚本包含一个左括号，则输入脚本是一个简单的函数，如 `document.write()` 等，算法将调用 `simple SPF algorithm`，并将\
  \ `simple SPF algorithm` 返回的列表推入 `SPF 链表`。如果脚本包含多个左括号，则输入脚本是一个复杂脚本，如 `document.write(print())`\
  \ 等。在这种情况下，算法将调用 `Nested SPF`，并将 `Nested SPF` 返回的列表推入 `SPF 链表`。算法 3 说明了寻找脚本变量不同背景的过程。\n\
