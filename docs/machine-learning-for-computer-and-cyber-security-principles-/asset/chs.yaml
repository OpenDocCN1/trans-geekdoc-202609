  \ `logistic regression` 的 ROC 曲线面积为 0.941。因此，`logistic regression`、`NN` 和 `NB` 在检索这两组信息方面更有效。然而，`logistic\
  \ regression` 具有最小交叉熵值 (`log loss`)，尽管是非概率性的，但根据此参数进行评分。\n\n## 6. 结论与未来工作\n\n本研究目的是评估监督机器学习算法，并识别出检测和预测极早期肺癌发生的最佳方法。数据集收集自在线肺癌\
  \ Web 系统。数据被视为预后调查数据，并应用于 12 种算法，旨在建立早期肺癌检测的最有效方法。研究依赖于包含分类为易感因素和症状预后数据。在 12 种算法中，`AdaBoost`\
  \ 最准确，具有最高的灵敏性和特异性。自适应提升算法被应用于 `Decision Tree` 分类器。在其他 11 种算法中，`Decision Tree` 最弱，尽管自适应提升使其成为最强。模型\
  \ `AdaBoost` 确定过敏、吸烟和酒精摄入是导致肺癌的关键易感因素。`AdaBoost` 与其他模型一样，识别出过敏是肺癌的主要原因，并推断出报告的过敏表现为肺部的刺激，因此吸入有毒物质（包括烟草的化学成分）是导致肺癌的主要条件。其他因素，如酒精摄入和同伴压力以不同方式导致该状况；即酒精作为过敏原或致命化学物质的来源，其含量和消耗暴露了肺部。同伴压力的作用在建模术语中更多是说明性的。未来的研究应该考虑将同伴压力作为说明因素而非预测属性。此外，如果未来的研究能考虑二手吸烟对肺癌的影响将是明智的。关于自适应提升，明智地在\
  \ `SVM` 等性能最好的算法上实施提升。\n\n### 致谢\n\n感谢 Data World 平台共享并提供肺癌数据集。特别感谢 Stacey Robert\
  \ 为 Data World 提供数据集，以及所有对本论文做出贡献的人。\n\n### 关键术语与定义\n\n`Machine Learning` 是人工智能的一个分支，专注于设计和开发允许计算机学习的算法和技术。自动学习的主要任务是从数据中提取有价值的信息。\n\
  \n`Big Data`——一组巨大且复杂，通常难以通过单一数据库管理或传统数据处理应用程序处理。大数据挑战包括采集、存储和分析。\n\n`Artificial\
  \ Intelligence`——模拟人类能力的计算机系统。其关键特征之一是学习、推理和对未编程情况的能力。\n\n`Cancer`——一组具有侵袭性细胞的疾病。这种疾病可以影响身体大部分部位。它也被定义为身体组织的异常生长，因此影响多种器官，症状通常取决于受损的器官或组织。\n\
  \n`Secure Socket Layer`——是最广泛使用的且强大的安全协议之一，它在服务器和客户端（例如 Web 服务器和互联网）之间创建加密链接。\n\n\
