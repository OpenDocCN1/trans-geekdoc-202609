  \ **图 14：** 时间的十折交叉验证。\n\n因此，根据应用领域得出了最终结论。该结论被称为预测（输出）。此外，在完成机器学习预测过程后，开发的模型被保存。当引入具有某些特征的新网络时，这些模型可以提供所需的输出。简而言之，过去的经验可以提供未来的方向。\n\
  \n### 3 结论\n\n适应性是任何部署在敌对环境中的无线网络的基础要素。它管理网络提供的 QS 并影响可靠性。波动流量需要对无线网络进行优化。这为优化和机器学习领域的未来研究铺平了道路。本章考虑了线性模型、神经网络、随机森林和决策树来预测无线网络中的数据流。在准确性方面，线性模型优于其他模型。神经网络模型产生了最小均方误差值。模型选择取决于应用领域。\n\
