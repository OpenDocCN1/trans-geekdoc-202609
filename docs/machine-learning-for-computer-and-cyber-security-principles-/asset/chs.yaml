  | 0.8 | 0.7618 | 0.0151 | |\n| 0.9 | 0.7690 | 0.0131 | |\n\n**表 2：** 关于 `L` 的影响。\n\
  \n| `L` | **控制器互锁** | **板级互锁** |\n| --- | --- | --- |\n| `IP` | `HR` | `IP` | `HR`\
