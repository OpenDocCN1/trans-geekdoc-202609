  \n# 第 4 章 (#08_Contents.xhtml#ch4)\n\n## 一种仿生网络安全方法 (#08_Contents.xhtml#ch4)\n\n\
  Siyakha N. Mthunzi,¹ Elhadj Benkhelifa,¹^,^(\\*) Tomasz Bosakowski² 和 Salim Hariri³\n\
  \n### 1. 引言\n\n对于网络安全、网络空间以及大多数“网络化”事物[1]等概念的定义缺乏共识，解决网络安全问题……对网络安全的识别缺乏共识……在文献中……[2]。人类参与者/因素的重要性在欧盟委员会的预测中得到了证实，由于恶意人类行为和攻击，电子服务将发生重大故障（损失约\
  \ 1930 亿欧元）。[2]提出了一种“包容性”的网络安全定义，即“组织和国家为了安全风险过程采取的相关方法和行动，以保护网络空间中使用数据资产的机密性、完整性和可用性。”本章将网络安全视为确保和保障数据安全的连续技术和创新。它从大自然的复杂系统中汲取灵感，将网络空间的复杂性和动态背景识别为缓解灾难性威胁和攻击的核心。本章探索了复杂系统（包括动物界和植物）中通过进化生存而来的自然现象，如何被用作网络环境中自适应缓解的机制。\n\
  \n### 2. 背景\n\n近年来，见证了网络犯罪的指数级增长，这在认为被物联网和云计算等新兴技术的采用所加剧。仅 2015 年，大多数被视为黑客事件的入侵都是针对客户的银行详情、地址和其他个人信息的。多年来，黑客事件已扩展到现代经济的所有方面，包括交通、能源、银行、医疗保健、电信，在某些情况下还涉及政府机构。网络黑客事件，包括德国和英国电信巨头沃达丰[4]和\
  \ TalkTalk[5]，是此类攻击规模、频率和影响的完美范例。最近在英国，Dixons Carphone 遭受了涉及 590 万张支付卡和 120 万条个人数据记录的大数据入侵[6]。这些入侵引发了人们对于高度复杂、持续且有动机的对手环境中，安全解决方案就绪程度的担忧，特别是考虑到它们对公用事业（如电力、交通等）的影响。随着智能健康和医疗保健领域的新发明成为敏感领域，这些领域的安全性至关重要[7]。\n\
  \n\n\n\n传统的计算机网络环境允许高度可管理的安全流程，这些包括限制用户权限、限制软件、在校园内推送更新、通过防火墙策略集中管理入侵检测以及控制网络流量。路由和其他反应式方法确保了对网络和设备安全进行高效有效的控制。因此，在满足安全目标方面的控制程度在用户用例和环境之间存在巨大差异。无论如何，这种精细的控制至少可以实现对大型网络环境的充分日志记录和理解。\n\
  \n然而，随着网络空间的出现和广泛使用，安全问题被认为更具复杂性，并需要不同的流程来维护数据的机密性、完整性和可用性（`CIA`）以及系统的稳定性。诸如 `IoT`\
  \ 和大数据等技术使得传统的防火墙部署成为了一项挑战，这不仅是因为在遭受拒绝服务攻击（`DoS`）的多跳路由环境中，设备会产生带宽和电能的浪费，还因为在高度移动的环境中执行静态安全策略带来了额外挑战。在具有一系列移动和非移动设备以及各种通信接口的数字环境中，这几乎是不可能的；而且，网络是以各种方式、形式和结构构建的。此外，可以认为，`CIA`\
  \ 三元法（一个处理安全领域的行业标准 [8]）在数字领域是有缺陷的。正如 [9] 指出的，归属于数字环境的其他信息特征应当被添加到 `CIA` 模型中 [9]。\n\
  \n网络空间对复杂且高度动态的网络和通信环境的愿景可以总结为孤立节点，这些节点面临各种安全威胁，包括为了恶意目的而强制联网。因此，网络安全的潜力需要一种新型安全系统来帮助防御。随着网络空间危机的升级，以及最新漏洞和网络攻击的频率和复杂度增加，采用更有效的解决方案以实施简化、动态且成本效益的数字解决方案的需求将变得越来越重要。这有助于现有解决方案（包括人类信息安全专业人员）的生产力。此外，现有的传统安全技术（如防火墙、防病毒扫描器和用户访问控制）有助于限制已知威胁。然而，如果没有额外的智能组件来监督并整合这些安全控制的有效性（如企业网络所示），如果其中任何一个被破解，正如事实所示，结果将是灾难性的。\n\
  \n## 3. 网络空间\n\n为了研究数字格局，理解刻画网络空间的复杂性至关重要。复杂性是一种可以在各种系统中观察到的现象，包括物理系统和生物系统。虽然对复杂性的完整且一致的定义在领域之间存在争议\
  \ [10]，但本章的讨论围绕 [10] 提出的科学定义展开。复杂系统描述“共享以下共同主题的现象、结构、聚合、有机体或问题：它们本质上是复杂或错综复杂的，它们很少是完全决定性的，系统的数学模型通常是复杂的，并涉及非线性、病态或混沌行为，并且系统倾向于产生意料之外的结果（涌现行为）”\
  \ [10]。\n\n虽然大规模网络本质上是复杂的，对于网络空间和网络安全也是如此 [11]，但复杂性本身是设计健壮系统时的一个有用的概念 [12]。在本章中，网络空间的复杂性描述了一种系统的通用含义，即其组件从设计或功能（或两者）上来说难以验证。事实上，本章假设网络空间的复杂性与网络和通信系统内部交互有关，包括系统用户和误用者以及涌现行为的不可预测性。正如\
  \ [12] 所提到的，复杂系统的特点是，系统组件之间的交互可能是非故意的，例如，与系统数据的无意交互导致了不可预测的系统输出和该系统并非预期的涌现行为。正如文献在下文节中将的那样，不可预测性可能是网络空间及其相关技术的不可避免的属性。图\
  \ 1 阐述了网络空间、技术、网络和通信系统和其他范式的规模。此图并非代表整个数字领域的详尽视图，而是提供说明性示例。这些将在下文中通过列表进行简要描述。\n\n\
  ![Image](img/fig4_1.jpg)\n\n**图 1：** 网络空间插图。\n\n*   云计算是新兴技术（如 `Bitcoin`）的事实计算平台和推动者。\n\
  *   物联网（`IoT`） [13, 14, 15, 16] 预示了万物联网愿景：物理实体并通过网络能够交换局部和全球信息（分别是它们自身及其环境）。因此，`IoT`\
  \ 技术通过对上述生成信息的即时访问，实现了进一步的创新和服务。\n*   基础设施（如医疗、水务和交通等）至关重要。\n*   竞争环境和网络战争在计算机和通信网络的新时代已变得至关重要。\n\
  \n复杂系统在微观尺度上通过进化发展。在进化过程中，选择涉及那些有助于有机体生存优势或劣势的属性 [17]。例如，栖息地有高大且顶部充满营养和果实的树木食草性哺乳动物，如果它们高大、脖子长或会爬树，就可能生存并繁殖。同样，复杂系统内部的元素通常会经过选择，最适应环境的元素会被选中。例如，自由市场经济中的产品通过市场力量进行筛选，民主制度下的政治家通过选举/投票进行筛选，动物则通过自然压力（如捕食和竞争）进行筛选。复杂的自然系统中充满了源自自主实体之间交互的复杂行为模式（例如适应和学习）\
  \ [18]。一个例子是自然免疫系统中 `B 细胞` 在识别和销毁病原体时采用的记忆适应和自学习机制 [19]。因此，适应有助于对环境变化做出反应。通过反馈回路，输入信息的微小变化通常可以触发大规模的输出。\n\
  \n\n\n\n`图 2` 展示了组件集向相互连接且相互依赖的组件网络的转换。左侧的图形设计显示了系统的构建组件，一组自主组件。它的转换过程——右侧的图表，代表了一个复杂系统，其中大量呈指数级增长的自主组件是相互连接的（虚线）且相互依赖的（虚线边缘的黑色标记）。它们的连接本质定义了系统的（全局意义上的）复杂性，而非其特征。自主性使得组件能够通过本地指令进行适应，并集体地同步（通过协作和协调）个体状态，从而形成一种自下而上的秩序。\n\
  \n![Image](img/fig4_2.jpg)\n\n**图 2：** 复杂系统的形成：非线性、连接、相互依赖和自适应。\n\n随着当前网络空间创新趋势以及具有多方协作（特别是涉及第三方）的新型设备和平台的泛滥，协调和控制这些方之间的交互往往容易出错。复杂环境具有不可预测和动态的特性（例如云计算，其本身是网络空间的一个集），需要智能系统控制。虽然传统计算系统通常对固有过程保持一致控制，但控制理论的\
  \ `[20]` 方法论和假设为处理控制提供了更好的洞察。控制理论的基础前提是在存在极端不可预测和动态变化时增强的适应能力 `[21]`。然而，在非线性和动态网络环境中，控制范式应当自适应的，并且是可动态配置和/或重新配置的。在大量的先进技术中，作者在\
  \ `[22]` 中的分类识别了此类自自适应的特征，并在下方概述如下：\n\n*   目标：系统应该实现的目标，例如：演化、灵活性、多样性、持续时间等。\n*\
  \   变化：适应的原因，例如：来源、类型、频率、预期等。\n*   机制：系统对自主性的响应、范围、持续时间、及时性等。\n*   效果：适应对系统的影响，例如：关键性、可预测性、韧性等。\n\
  \n如果接受网络空间是复杂的，因此属于上述复杂系统的范畴，那么网络安全研究或许应该从成熟的复杂自适应系统（如自然界中的系统）中寻求灵感。沿着这一方向，根据其组件子域区分网络领域并研究网络安全挑战是非常重要的。\n\
  \n### 3.1 网络安全挑战\n\n网络安全与传统的信息安全不同，它不仅是一个过程，而且是一个产品和或技术。正如 `[9]` 所示，网络领域包含的特征对于传统\
  \ CIA 分法描述之外的特征，例如：战争、欺凌、恐怖主义等。例如，一个家庭自动化系统可以在不影响受害者信息的情况下被破解（这属于 CIA 分法和常见安全属性之外），但通过针对受害者的其他资产（即网络犯罪）来实现。因此，网络安全涉及对传统\
  \ CIA 分法常见描述之外资产的保护。\n\n另一方面，传统计算系统通常对固有过程保持一致控制，而安全控制则通过管理 `[23]` 来。从这个意义上说，`[24]`\
  \ 关注关键资产。然而，正如文献所出的，应对措施 `[25]` 显示，在提供所有输入的情况下可以设计解决方案。\n\n网络空间使攻击者能够增加攻击面，从而增加了漏洞管理的复杂性并提高了攻击复杂度。已经证明，复杂的且持续的攻击者会持续存在受攻击的网络中\
  \ `[26]`。案例包括 `Stuxnet`、`Flame` 和 `Duqu`，它们通过隐藏网络流量来规避检测 `[27]`。基于此，本节将复杂性视为未来网络安全研究的核心。目前的网络安全方法（通常是自上而下的）将大量精力放在政策和法规上，这本质上是不够的\
  \ `[28]`，因为高层失败或不完善会向下传递到网络空间中的低级元素。另一方面，学术界和工业界的进一步工作致力于设计攻击和防御工具以有效应对网络安全威胁，例如集成到网络协议中的应对措施以确保可靠的信息交换\
  \ `[29]`。虽然这些方法足以缓解网络安全威胁，但也意味着网络安全风险的治理更难实施。此外，正如文献所示，措施仍然是不足够的 `[30]`。\n\n`图 3`\
  \ 展示了上述内容，并突出了网络安全现有的研究挑战。在这个图形设计中，网络空间的复杂性和动态性为网络安全引入了数据控制失败和适应失败问题（图形顶部）。此外，服务和资源故障仍然是一个关注的主要领域\
  \ `[31, 32]`。此外，保证、性能和评估是一个持续的挑战 `[33]`。\n\n![Image](img/fig4_3.jpg)\n\n**图 3：**\
  \ 网络安全的研究挑战。\n\n\n\n\n目前，英国政府将其归为国家安全的“第一级”威胁 \\[34, 35\\]，这种国家层面的战略转变表明了网络安全的重要性。网络攻击，如在拉克\
  \ \\[36\\],伊朗 \\[37\\]以及“阿拉伯之春”期间 \\[38\\]发生的攻击，无疑展示了未来网络攻击可能的影响。在国际舞台上，联合国政府专家小组\
  \ \\[39, 40\\]正式承认了在国际安全背景下，国际法对于网络活动和网络问题的适用性。尽管如此，尽管对国际法的适用性已达成明确共识，但健全的国家实践对网络安全法律的应用构成了重大挑战\
  \ \\[41\\]。\n\n现有的安全框架，包括云安全联盟（CSA),[¹ 美国国立标准与技术研究所（NIST),² 欧洲网络和信息安全局（ENISA),³\
  \ 英国国家基础设施保护中心（CPNI),⁴等，侧重于网络安全方法，其目标包括但不限于巩固安全风险和漏洞。这些框架旨在为缓解网络威胁提供最佳实践指南。表 1 展示了关键网络空间应用中核心标准化领域的示例。该表并非旨在对标准化领域或关键网络应用领域进行详尽列举。然而，本章作者感兴趣的是，它清楚地证明了对完善且充分的网络安全（网络事件管理）标准化的迫切需求。\n\
  \n美国国防部（DoD） \\[42\\]将网络空间情报、监控和侦察定义为在网络空间中进行的旨在支持当前和未来行动的情报收集活动 \\[43\\]，并将其与间谍活动进行类比，间谍活动被定义为“国家未经授权的故意收集信息”。虽然网络空间间谍活动的影响通常被认为没有攻击性网络操作严重，但\
  \ 2016 年美国民主国家委员会电子邮件遭黑客攻击表明，此类活动仍然能够造成重大损害 \\[44\\]。此外，\\[45\\]提供的证据凸显了网络空间经济和商业间谍活动的普遍性，可能的国家资助攻击者（被识别为高级持续性威胁）自\
  \ 2014 年以来一直在全球范围内进行系统的黑客攻击，以获取知识产权和敏感数据。随着包括图像、视频、3D 在内的多媒体大数据爆炸式增长，文献表明隐私方面正着多模态挑战的兴起\
  \ \\[46\\]。Zhang 等人（2017）实际上提出了一个称为 `CyVOD` 的反盗版框架，以保护多媒体内容版权免受攻击 \\[47\\]。\n\n\
  **表 1：** 关键网络空间应用中核心标准化领域的示例。\n\n![Image](img/tabp4_1.jpg)\n\n尽管历史上间谍活动局限于特定目标的小规模行动，但[48\\\
  ]认为，网络空间间谍行动的潜在规模及其影响平民的能力，意味着国际法中这种模糊性和不确定性已不再被容忍。\\[45\\]建议需要能够充分反映现代能力的法律改革。此外，表达法理论\
  \ \\[49\\]认为，这些改革会影响国家行为并识别出社会中潜在的不容忍性。此外，可以得出结论，此类改革对于建立新的国内法律至关重要，以减少网络空间间谍活动的整体普遍性。通过概述网络空间安全挑战以及随后的差距和局限性，以及网络空间的复杂性对一系列网络策略的影响，以下小节简要探讨了如何克服这些差距和局限性，以增强未来的网络安全行动。\n\
  \n### 3.1.1 使用人工智能增强网络安全\n\n迄为止，正在进行的努力集中于软计算和机器学习方法，以增强计算智能 [50]。在生物学领域，包括一些作者\
  \ \\[51, 52, 53\\]以及[54\\]展示了机器学习方法在预测患者生存率方面的应用。虽然机器学习已成功应用于科学领域以及网络空间的飞速发展（即物联网\
  \ `IoT`、Web 技术、移动计算、数字经济等），但机器学习尚未得到一致的应用。机器学习的几个核心属性如可扩展性、适应性以及适应新未知变化的能力，表明它们适用于应用。例如，大数据的处理和操作或执行高计算的能力（这些过去可能是具有挑战性的）现在是重大的机遇。对于网络安全，有两个主要领域适合机器学习：1.\
  \ 数据处理和 2. 专家系统。\n\n人工智能（`AI`）领域在过去五年中的进展比预期更快 \\[55]]。像 DeepMind 的 `AlphaGo` \\\
  [56\\]这样的项目是人工智能实施投入的一个示例。人工智能在网络操作中的应用被[55\\]视为一个关键里程碑，对网络安全具有变革性影响，使能够能够更少的资源完成更多工作，就像网络行动对情报行动潜在规模的影响一样。\\\
  [57, 58, 59\\]事实上确定了人工智能的五个子领域作为增强进攻和防御网络操作的可能领域。然而，研究人员 \\[57\\], \\[58\\\\]和\\\
  [59\\]的新兴共识强调了人工智能带来的影响规模。因此，Allen 和 Chan \\[55\\]敦促负责任、可持续且有效地使用人工智能，包括法律、伦理和经济考虑。下表介绍了人工智能子领域作为进攻和防御安全措施的可能应用。\n\
  \n**表 2：** 人工智能作为防御和进攻措施的应用示例。\n\n| 1 AI 子领域 | 2 可能的网络用途（防御性） | 3 可能的网络用途（进攻性） |\n\
  | --- | --- | --- |\n| 4 专家系统 | 5 识别欺骗性媒体 | 6 生成欺骗性媒体 |\n| 7 机器学习 | 8 威胁检测和攻击的未来预测\
  \ | 9 检测开源漏洞；规避防御措施 |\n\n\n\n\n\n| 深度学习 | 攻击检测与恶意软件识别 | 暴力破解现有防御措施（例如密码） |\n| :---\
  \ | :--- | :--- |\n| 计算机视觉 | 预测网络攻击、检测并识别漏洞以及生成补丁解决方案 | 发现新的复杂的零日攻击 |\n| 自然语言处理\
  \ | 异常检测与僵尸网络识别 | 社会工程 |\n\n### 3.2 网络安全对非常规方法的必要性\n\n由于观察到网络空间和本质上的网络安全环境具有复杂性，因此从其他系统中寻求灵感是很有必要的。在其他领域，例如机器人领域，人们利用了免疫系统的类比来设计自组织机制\
  \ [12]。生物学概念是核心，并有助于在多个领域实现稳健的方案，包括计算、金融建模 [60] 和机器人技术 [61] 等。生物系统的内在优势在于其分布式架构，其中自主实体做出具有全局影响的局部决策\
  \ [62]，例如免疫系统能够通过动态创建和销毁变异或感染的体细胞来适应并自我保护，因为它在学习新威胁的同时保护自身及其保护组件 [62]。由于虚拟化在网络空间中非常常见，软件定义平台和网络高度依赖它；然而，随着攻击面变得既新又宽，安全监控也变得更加困难\
  \ [63]。因此，网络技术和基础设施的稳健性取决于底层虚拟化的质量，而技术资源的复杂性影响了实现的水平 [64]。\n\n自然界有效地展示了自组织、适应性、韧性和其他成功现象\
  \ [65]。自然系统的优势在于自主实体做出局部决策、持续协调和共享信息的能力，以维持全局秩序的形式 [18]。例如，捕食者-猎物者动态凸显了物种间相互作用的重要性和后果，以及群的功能如何取决于该群的特征。\n\
  \n生物系统一直是跨越整个计算连续的研究体，可以追溯到 20 世纪 80 年代 [66]。近年来，几项调查 [67, 65, 68, 69, 19]] 致力于评估计算相关应用中的生物启发算法。随着对网络系统需求的增长，以及对各种设备和基础设施所提供的互联网连接的依赖\
  \ [19]，计算系统必须具备足够的适应性、韧性、可扩展性和稳健性以抵抗故障，并具有足够的动态性来应对变化。人们认为，生物启发方法能够在长期内提供性能的一致性\
  \ [61]，并且确实与互联环境的复杂属性和相对成功具有共同点 [67]。例如，用于无线自组织网络的生物系统的自组织（SO）属性意味着路由节点的聚类增强了数据转发协议的可扩展性\
  \ [19]。正因如此，网络变得稳健并能够适应频繁的拓扑结构变化。\n\n其他工作通过提出以下观点阐明了自然的天赋，即受生物学启发的系统能够产生显著的成果以实现探索\
  \ [70]，并带来超越过去人们想象的独特进展 [71]。这一假设在数据中心、网格和云等高度分布式且异构环境的性能优化和增强中是显而易见的 [72]。尽管如此，正如文献所论，并非所有生物算法的假设都没有局限性\
  \ [73]。尽管存在上述局限性，在使用生物启发方法作为计算连续体问题的非常规解决方案方面无疑存在巨大的潜力。考虑到对生物学中生理和生态因素的理解如何使医学创新能够治愈甚至在某些情况下消除疾病\
  \ [74]，保持乐观是合理的。\n\n图 4 根据生理和生态属性区分的生物启发方法的分类示例。诸如捕食对适应和反适应的进化影响等现象决定了物种的行为。行为（包括觅食物种中的捕食风险和成本评估\
  \ [75]）随实体与其环境之间相互作用的结果而改变 [76]。\n\n![Image](img/fig4_4.jpg)\n\n**图 4：** 生物启发方法的分类示例。\n\
  \n基于捕食者与其猎物之间存在的相互作用和行为，开发了一系列创新。为此，[77] 应用了捕食者-猎物动态：特别是捕食成本的原理，作为恶意软件的新方法。同样，[78]\
  \ 将捕食者-猎物范式设定为有益蠕虫（捕食者）终止入侵的蠕虫，而恶意蠕虫（猎物）在系统中是不受欢迎欢迎的。[79] 的工作基于斑马群对捕捕食者的自管理属性。[80,\
  \ 81] 旨在解决分布式系统中病毒和蠕虫挑战的方法基于捕食群落中发现成功捕食者的属性。[82] 的作者解释说，传统的安全方法侧重于对受限的数据集进行复杂的分析，而非常规机制则在广泛的输入上以“简单的分布式方式”处理少量数据。许多形式的生物启发人工智能系统被证明在应用于入侵检测系统（IDS）时是成功的，其中遗传算法（GA）特别为成功\
  \ [83]。尽管取得了这些成功，这些方法往往倾向于改进旧旧技术的效率，并且许多问题（如单点入口分析）仍然存在。在考虑云系统对网络感知恶意软件的防御时，重要的一点是，此类系统现在包含了基于复杂网络结构的多个节点。虽然传统的安全防御（单点入口分析）适用于单机，但仍需要新的非常规防御系统来保护这些复杂的网络。因此，将分布式的生物防御系统应用于计算机网络将更适合解决许多问题，无论是恶意软件还是其他。\n\
  \n\n\n\n\n应用于传统分布式计算系统的生物启发方法展示了源自其生物学背景的有用特性——这些属性定义了起源、发展和进展，或者生态因素；例如自然环境中器官与生物之间的相互作用因素，如基于\
  \ `T-cells` 负选择设计的 `IDS`，`T-cells` 能够结合并杀死感染或有害的细胞 [19]。或者，利用 `B-cells` 在识别和破坏病原体时采用的记忆和自学习机制来设计\
  \ `IDS` [19]，这适用于免疫系统的生理学比喻。鉴于生物系统取得了巨大成功，研究描述本章核心要素的理论基础，以及它们在网络安全连续体中作为可行方法的应用，似乎是合乎逻辑的。为了应对不安全因素，可以实施与自然界类似的非传统主动防御机制和策略，包括欺骗策略（例如\
  \ `honeypots`），这些可以作为对抗敌者的被动诱饵，或作为主动诱饵来分散敌者的注意力 [84]。目前已经提出了许多应对措施，包括攻击性方法，例如“白虫”\
  \ [85]，它们主动追踪恶意软件并意图破坏它们。欺骗技术，如 `address hopping` [86]，通过掩盖潜在攻击者对传输设备的实际可见性来保护传输中的数据。\n\
  \n接下来的一节将进一步研究生物系统，考虑自然系统中的复杂性和自组织性是否可能适用于网络安全。首先，本节将简要介绍常见的生物系统及其应用领域。随后将探索通用计算安全领域的现有应用，然后评估这些概念在网络安全中的适用性。在随后的子节中，捕食者-被食者的动态关系、被食者的避捕食机制和反捕食机制被推测性地应用于网络安全案例。避捕食被推测性地视为一种可利用的机制，以便在网络空间中实现生存。[87,\
  \ 88, 89] 之前的工作提供了全面的综述，为本节的非传统背景做贡献。\n\n## 4. 生物启发方法综述\n\n在许多工作中，[65] 的作者对生物启发网络协议进行了全面的综述，引用了大量来源，暗示了免疫启发的算法形成了网络安全、异常和误行为检测的基础\
  \ [65]。作者将流行病学与计算机网络的内容分联系起来，包括对互联网上蠕虫和病毒传播的分析。在 [67] 中，他们通过将入侵检测和恶意软件传播分别与 `AIS`\
  \ 和流行病学联系起来表示赞同，作为互补的生物启发领域。在其他工作中，[90] 的作者提出了一种受蚁群启发的信任与声誉模型（`BTRM-WSN`），作为一种根据最高声誉路径利用信任选择的策略\
  \ [92]。尽管他们的模型是为无线传感器网络设计的，但可以合理假设，通过适应蚁群系统 [92]，底层的信任模型可以扩展到云计算环境，在该系统中，通过留下信息素残留物来构建满足定义条件的路径，以便随后的蚂蚁可以遵循信任的路线。其他模型，包括信任蚁群系统（`TACS`）[93]、基于群体智能的\
  \ `AntRep` 算法 [94]、基于时间的动态信任模型（`TBDTM`）[95] 等，已针对分布式系统提出。尽管如此，强调在云环境中使用之前，有必要进行全面的测试和评估\
  \ [96]。\n\n受生物系统中固有的基因识别和分配可靠性的启发，Wang 等人提出了一种基于家族基因的云信任模型（`FBCT`），以解决基于 `PKI` 的系统固有的局限性，包括云环境内节点识别、访问控制和第三方认证系统方面的挑战\
  \ [97]。根据[99] 作者的观点，通过采用家族基因中的生物学原理，他们的模型为云计算领域的信任提供了解决方案。[79] 的工作探索了将生物比喻作为设计、建模和实现云\
  \ Web 服务的基础，该服务能够处理由长时间运行进程和安全攻击引起的稳定性问题 [79]。根据作者的说法，他们提出的群启发方法不仅简化了技术挑战，还为系统管理员增强了新的设计。Table\
  \ 3 总结了一些生物系统，根据其应用领域对其进行了分类，并列出了它们的优缺点。\n\n面对持续且复杂的攻击者，开发基于大自然基础的网络安全应对措施至关重要。现有的解决方案失败了，因为它们无法适应以对抗攻击者的强度和攻击性\
  \ [98]。[26]这些安全措施仅在传统网络中有效。因此，这些作者预言了自适应网络防御（ACD）方法的兴起，基于优化不可预测性和最大化攻击面的配置，从而增加攻击者的成本\
  \ [26]。复杂性、大规模虚拟化和网络空间的极端分布式特性使得此类环境中的追责性、审计性和信任变得至关重要 [99, 100]。\n\n**表 3:** 网络环境中的生物启发方法总结。\n\
