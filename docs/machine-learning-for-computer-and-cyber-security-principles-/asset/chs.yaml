  \n### 总结\n拒绝服务攻击通过向旨在处理其他合法请求的服务器发送大量数据来损害服务的可用性。受害者无法无法其他用户提供服务，并忙于处理攻击者的数据包。此外，某些攻击者发送恶意请求，导致系统资源因数据溢出，然后尝试丢弃属于合法用户的数据包。\n\
  \n### 关键术语与定义\n\n**恶意软件 (Malwares):** 恶意软件是攻击计算机的软件或部分软件。恶意软件是“malicious software”的缩写，可以渗透受害者。恶意软件包括计算机病毒、蠕虫程序和木马。\n\
  \n**文件病毒 (File Virus):** 文件病毒附加在二进制可执行文件中。一旦这种病毒留在内存中，它就会尝试感染所有程序。\n\n**宏病毒 (Macro\
  \ Virus):** 某些应用程序（如 Microsoft Word、Excel 或 PowerPoint）允许在文档中添加宏，这样当打开文档时，该宏代码就会自动执行。宏病毒用宏代码编写，并在此类文档打开时传播。\n\
  \n**多部分病毒 (Multipartite Virus):** 它是 MBR 病毒和文件病毒的结合。它在初始阶段附加到二进制可执行文件中。当用户运行此文件时，病毒被插入启动记录中，当下次计算机启动时，病毒会被加载到内存中并感染其他文件和程序。\n\
  \n**多态病毒 (Polymorphic Viruses):** 这类病毒在每次附着到系统时都会改变其形式。这些病毒的这种特性使其非常难以检测和找到治疗方法。\n\
  \n**隐形病毒 (Stealth Viruses):** 这些病毒影响文件、文件系统的目录项、磁盘头移动等。它们的影响从用户的角度来看是隐藏起来的。\n\n\
  **后门 (Backdoor):** 后门攻击是一种绕过计算机系统安全认证的恶意软件，并为攻击者提供未经授权的远程访问。\n\n**根内核 (Rootkit):**\
  \ Rootkit 是另一种恶意软件，它允许特权访问计算机，同时隐藏某些程序的存在。一旦攻击者获得计算机的管理员权限或 root 权限，就可以获取机密信息。\n\
  \n**逻辑炸 (Logic Bombs):** 逻辑炸在满足特定条件时开始感染系统。它是一段在预期未满足之前保持隐藏的代码。例如，在某个特定日期，它将开始显示消息或开始删除文件。\n\
  \n\n\n\n\n# 钓鱼攻击\n钓鱼攻击是一种网络攻击类型，攻击者创建一个实体（例如银行网站、社交媒体网站或在线支付处理网站），其外观与合法网站完全相同。然后，攻击者诱导用户输入机密信息，如银行账户密码、信用卡信息，并将其用于获取财务利益或其他动机。钓鱼攻击通常借助垃圾邮件或即时消息服务的帮助进行，并批量发送给成千上万的用户。用户会被此类钓鱼邮件所吸引，例如他们可能认为登录银行网站可以获得奖励资金，随后打开了钓鱼网站的网页。\n\
  \n# 跨站脚本 (XSS)\n跨站脚本（XSS）是一种通常出现在 Web 应用程序中的计算机安全漏洞。XSS 指的是利用 Web 应用程序代码中的漏洞，这种黑技术允许黑客从终端用户发送恶意内容并从受害者处收集某种类型的数据。接收用户输入并在未进行任何验证的情况下生成输出的\
  \ Web 应用程序容易受到此类攻击。攻击者向其他用户访问的网页中注入客户端脚本。当该用户的浏览器执行该脚本时，可能会执行恶意活动，如访问 Cookie、会话令牌或其他本应留在用户本地的敏感信息。\n\
  \n# 欺骗\n在欺骗攻击中，一个人或一个程序装成另一个用户或其他设备，然后尝试执行某些恶意活动，例如发起拒绝服务攻击、窃取数据、传播病毒或蠕虫、绕过访问控制等。有多种欺骗技术，如\
  \ IP 欺骗、ARP 欺骗、DNS 服务器欺骗、电子邮件地址欺骗。\n\n# IP 欺骗\nIP 地址欺骗是所有欺骗攻击类型中最常见且使用最广泛的类型。攻击者用其他\
  \ IP 地址伪造攻击包的源地址。因此，当检测到攻击时，无法找到攻击包的真实来源。例如，在 DDoS 攻击中，大量带有伪造源地址的攻击包被发送到受害者服务器。IP\
  \ 欺骗的另一种方法是伪造目标地址。当响应返回目标地址时，它们将进入伪造的地址，即受害者的地址。\n\n# ARP 欺骗\n地址解析协议（ARP）用于在从外部网络接收数据包时将\
  \ IP 地址解析为链路层地址。在 ARP 欺骗中，攻击者跨局域网发送伪造的 ARP 消息，使得攻击者的链路层地址与网络中某些机器的 IP 地址绑定。这导致消息从合法源重定向到攻击者，而不是合目的地。攻击者随后能够窃取信息或更改传输中的数据，或者阻止所有进入局域网的流量。ARP\
  \ 欺骗还用于执行其他类型的攻击，如 DoS、中间人攻击、会话劫持等。\n\n# DNS 服务器欺骗\n域名系统（DNS）服务器将域名映射到 IP 地址。当用户在浏览器中输入网站地址时，由\
  \ DNS 负责将该域名地址解析为服务器的 IP 地址。在 DNS 欺骗攻击中，攻击者更改 DNS 服务器中的条目，使得当用户输入特定的网站地址时，它会被重重定向到另一个通常属于攻击者的\
  \ IP 地址，或者可能与攻击者想要泛洪流量的受害者相关。攻击者可能会用恶意程序回复这些消息，以损害受害者的计算机。\n\n# 电子邮件地址欺骗\n电子邮件地址欺骗使用不同的电子邮件地址代替邮件的真实来源。接收者无法判断邮件的实际发送者，因为他们只能看到伪造的电子邮件地址。由于简单邮件传输协议（SMTP）不提供任何适当的验证，攻击者能够执行电子邮件地址欺骗。通常，通过让\
  \ SMTP 客户端与邮件服务器协商来确保预防，但如果不采取此预防措施，任何熟悉邮件服务器的人都可以连接到服务器并使用它发送消息。存储并转发给接收者的电子邮件信息可以根据攻击者的意愿进行更改修改。因此，攻击者有可能发送带有伪造源地址的电子邮件。\n\
