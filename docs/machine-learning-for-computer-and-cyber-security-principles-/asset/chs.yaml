  \n# 应用于安全医疗数据系统架构的机器学习算法肺癌早期检测与预测\n\nTh Baker, Dhiya Al-Jumeily, Abir Hussain, Ahmed\
  \ J. Aljaaf and Jamila Mustafina\n\n## 1 引言\n\n癌症研究在过去十年中不断发展，大部分进展归功于医学和生物技术领域的创新与发明。在实现癌症治疗和降低死亡率的众多挑战中，早期筛查和识别癌症类型一直是早期预测和实施治疗的障碍。除了技术之外，研究人员还开发并使用了不同的策略来实现癌症早期预测。然而，这些进步导致了海量数据的收集、聚合和存储，这种发展使得大数据的概念以及对更好分析的需求变得更加紧迫。尽管社区可以获得大量数据，但准确预测疾病结果对于研究人员和医疗从业者来说都是最具趣味性和挑战性的任务之一\
  \ [[1]]。为了准确预测健康结果，癌症研究人员采用了机器学习技术。机器学习算法可以检测隐藏在复杂数据中的模式和关系，最重要的是，这些技术在预测疾病方面已被证明有效。\n\
  \n本文重点关注如何使用机器学习算法进行癌症早期检测。分析和推理基于调查数据。在无辐射的情况下检测肺癌的想法为解决辐射引起的一些问题提供了解决方案。尽管如此，重点是解决癌症检测的持续问题。\n\
  \n根据 [[2]]，癌症仍然是全球领先的公共健康问题，也是美国的第二大死亡原因。研究人员对可避免的死亡人数进行了估计和计算，其中包括主要的风险因素。分析依赖于\
  \ 1930 年至 2015 年间收集的死亡数据，关注的是对 2018 年疾病的预测和结论。研究确定，预计 2018 年将有 1,735,350 例侵袭性癌症病例影响美国人，全球范围内数字更高。建模实验的结果还显示，2018\
  \ 年将有 609,640 名美国人因癌症去世。在结论中，研究人员确定，除了获得高质量医疗保健等关键因素外，癌症易感性取决于种族和年龄。\n\n## 1.1 网络安全与数据安全\n\
  \n\n\n\n工业 4.0 时代及其概念引入了诸如云存储及其它基于互联网的技术，这些技术使数据暴露在无数威胁之中，特别是考虑到物联网所带来的暴露风险 [[3]]。大数据及所有其他相关云技术和其它概念的持续采用和使用增加了敏感数据的风险。因此，对于收集和存储数据的系统，考虑计算机安全是恰当的。大多数机构（包括医疗机构在内）正在收集、整理、聚合和存储数字数据，其中绝大多数数据都是敏感的，因为它们包含了医疗和其他社会经济数据。\n\
  \n令人深关关注的是高级持续性攻击数量的不断增加。包括医疗机构在内的各机构有义务重新审视其网络安全威胁，并转向`预防、检测和响应 (PRD)` 范式 [[4]]。在\
  \ `CIA` 三元组语境下，改进检测是识别系统异常或奇特模式的终极技术。`CID` 三元组是一个处理数据机密性、完整性和可用性的数据安全概念 [[5]]。三元组的机密性公理侧重于确保数据隐私，这涉及到所有限制访问敏感信息的措施。大多数机构使用不同的加密技术来保护其数据。大多数常用方法包括带有双重验证叠加的密码、安全令牌和生物识别验证等\
  \ [[5]]。三元组的另一个公理——完整性确保数据的一致性、准确性和可靠性，因此侧重于数据传输过程中的保护。也就是说，机构必须确保数据不会被中间人或浏览器内攻击者截获。数据集必须具有验证机制，包括`checksums`，并可能需要适当备份以恢复任何受影响的文件。最后，可用性涉及数据存储硬件和软件的维护，以确保系统不会产生不停机。硬件必须按照设定标准运行，支持软件和操作系统必须正常运行且无任何冲突。为了确保数据的可用性，建议机构采用额外的安全措施，包括`防火墙`和`代理`，以保护系统免受恶意攻击。\n\
  \n大数据技术结合机器学习算法已证明对于攻击检测和预防至关重要。然而，由于需要保护的数据量巨大，且并非所有数据源或平台都具备系统所需的安全功能，大数据也对 `CIA`\
  \ 三元组构成了挑战。例如，研究中使用的调查数据检索自`Data World Website`。该平台为不同的应用提供数据集，其中一些用于金融分析。在大多数情况下，金融数据中的敏感信息或属性出于安全考虑会被移除，而这些做法对于某些特定的机器学习应用来说是非常不利的。尽管如此，`Data\
  \ World` 使用`socket security layer`来验证访问数据的远程计算机的身份。该平台是一个实施加密以确保数据机密性的系统示例 [[6]]。具体而言，系统使用`digital\
  \ signature`来验证下载文件的身份。尽管有这些特性，调查数据的完整性也取决于数据贡献者在收集过程中所遵循的规范和预防措施。关于调查安全性的辩论是一个敏感问题，因为信息已被证明是攻击者的金矿。在健康数据安全方面，有很多方法可以确保保护，从而确保数据的机密性和完整性。一些新兴的图像加密技术包括使用`quaternion\
  \ Fresnel transforms`的技术 [[7]]。该技术还使用了`2D-based logistic-adjusted-sine map`，它是独特的方法之一。\n\
  \n### 1.2 新颖性与研究贡献\n\n有必要重申，并非所有国家或地区（无论政治还是经济上）都能获得高质量的癌症护理。事实上，大多数来自被认为是中等或贫困地区的人总是去`U.S.`和印度寻求治疗。重要的是，最近的大多数研究已经确定，利用机器学习技术评估癌症风险和预测复发的尝试呈日益增长趋势\
  \ [[2, 8, 9]]。这些论文的作者关注如何使用机器学习算法预测患者出院后癌症的复发，并确定这些技术比替代的统计技术更准确。\n\n在本研究中，将使用被认为比替代统计分析更准确的机器学习技术来研究癌症易感因素及其对癌症发病率和率的贡献。研究实现了`12`种机器学习算法，并比较了它们的性能以确定性能最好的算法。\n\
  \n\n\n\n\n已有许多研究侧重于多种癌症的早期检测。然而，仍有研究侧重于肺癌的早期检测和预测。例如，在 [10] 中，探索了使用 `MRI` 图像预测肺癌的概率。研究人员将疼痛、呼吸困难、咳嗽、疲劳和体重减轻确定为肺癌的症状，并将疾病归因于尼古丁、吸入毒气、基因突变和被动吸烟。这些科学家设计的系统旨在初始阶段检测肺癌，尽管作者承认在第一或第二阶段检测肺癌具有很高的挑战性。研究人员建议可以使用\
  \ `MRI` 图像作为输入数据，因为辐射对 `MRI` 扫描的影响或影响致命性较小。所提的框架由预处理、分割、特征提取和比较组成。比较使用神经网络和其他适用于图像分析的数据挖掘算法完成，且该模型应根据图像预测未来的癌症发生率。因此，个人可以进行\
  \ `MRI` 扫描，这些图像可以用于预测医学和个性化医疗。然而，随着医学个性化和大数据的发展，安全性逐渐成了一个问题，特别是在处理健康图像时。\n\n关于健康数据安全，[11]\
  \ 提出了一种新的图像伪造检测系统，验证医疗图像以确保其机性和完整性。该系统基于机器学习分类器，并将 `SVM` 和基于极端学习的算法作为其多分辨率技术的一部分。所提系统在噪声图上应用了回归拟合器，并将输出馈给分类器。噪声过滤发生在计算资源的边缘，而分类则在计算系统的核心完成。所提系统是机器学习在健康领域文档验证中影响的缩影。图像在癌症检测中起着至关重要的作用，尽管大多数技术仍处于实验室阶段。[12]\
  \ 探索了机器学习在探索高分辨率分析中的应用。研究人员提出了单值值分解算法的变体，认为图像中的冗余减少了可以从图像中检索的信息量，并假设非局部自相似性和低秩先验技术可以提高图像分辨率。该算法结合非局部插值和自相似性来增强图像。该技术也可用于检测。\n\
  \n疾病检测的另一个显著趋势是量子信息处理的日益广泛。研究人员认为，量子信息处理更高效更安全，因为它基于深奥的量子力学领域 [13]。在图像处理中，量子技术依赖于量子并行性，因此具有高效性和安全性。提高图像分析性能的其他其他技术还包括除了并行编程使用图形处理器（`GPUs`）来实现不同的算法\
  \ [14]。使用 `GPUs` 和并行编程背后的概念是提高计算能力并缩短医学图像的处理时间。文章讨论的感兴趣区域的分割和识别基于模糊 C 均值算法。[15]\
  \ 也使用了基于 `GPU` 的增强来提高图像处理图像，尽管研究人员使用了混合方法，并在不损害图像分割质量的情况下，实现了高达 8.9 倍的性能提升。尽管有了这些进展，癌症的早期检测仍然是一个大问题，下面讨论了一些解决此问题的研究。\n\
  \n# 3. 方法论\n\n本节详细说明了研究中使用的数据，包括用于数据学习的属性和特征。它还对研究中使用的算法以及研究中的方法进行了简要讨论。\n\n###\
  \ 3.1 数据源与类型\n\n该研究使用从安全在线网络系统 `https://data.world` 获取的预后调查数据集。该网络系统利用安全协议，例如安全套接层（`SSL`），其设计用于确保数据共享的通信安全，并在数据传输过程中对其进行加密和解密，以确保在共享敏感调查数据时建立安全连接。从系统架构的角度来看，该网络系统涵盖了在网络浏览器上对患者数据的检索和返回。该网络系统基于多层架构构建，根据功能将系统的不同组件分为若干层。每层在不同的系统上运行，因此避免了单点故障并增强了应用和安全性。\n\
  \n数据集包含 16 个属性和 309 个实例，这些也代表了研究的参与人数。属性在表 1 中总结，应该注意的是，肺癌属性既作为倾向因素也作为模型的预测变量。\n\
  \n属性 `SOB` 和 `SD` 是呼吸短和吞咽困难的缩写。属性 `Lung` 既是预测变量也是倾向因素。除了 `Age` 之外，所有的测量水平都是具有两个水平的分类变量。`Age`\
  \ 变量是数值且值很高，因此使用该变量可能会导致模型性能下降。也就是说，大多数机器学习算法（包括决策树）在应用于分类变量时表现最好。在研究中，将基于熵的离散化应用于\
  \ `Age` 属性，并将其转换为与其他属性类似的名义属性。熵方程所示，方法的选择基于信息增益优势 [17]。\n\n\n\n\n\n| $Entropy(D\\\
  _{1}) = - {\\\\sum\\\\limits\\_{i = 1}^{m}{p\\_{i}\\\\log\\_{2}p\\_{i}}}$ | (1)\
  \ |\n| --- | --- |\n\n在公式 1 中，求和从 1 开始迭代，`m` 是根据观测值或分类器值创建的离散类别数量。`p_i` 是观测值属于该类别的概率。然而，该方程计算的是单次划分的熵，而离散化的目标是最大化从将\
  \ `Age` 属性划分为有限离散类别时获得的信息。熵通过达到最小值来实现信息最大化。也就是说，闭合熵越接近零，变量的分箱和离散化就越理想，而信息增益表示为公式\
  \ 1 中定义的各熵之和，如下 [17]：\n\n| $Info\\_{A{tt}}(D) = \\frac{\\\\left| D\\_{1} \\right|}{\\\
  \\left| D \\\\right|}Entropy\\\\,(D\\_{1}) + \\frac{\\\\left| D\\_{2} \\right|}{\\\
  \\left| D \\\\right|}Entropy\\\\,(D\\_{2}) + \\cdots + \\frac{\\\\left| D\\_{m}\
  \ \\right|}{\\\\left| D \\\\right|}Entropy\\\\,(D\\_{m})$ | (2) |\n| --- | --- |\n\
  \n在公式 2 中，左侧代表信息属性，右侧是每个箱的熵（`Entropy (D[1])`、`Entropy (D²)`、...`Entropy (D[m])`）之和乘以它们各自的大小\
  \ $(\\frac{\\left| D\\_{1} \\right|}{\\left| D \\right|},\\\\frac{\\left| D\\_{2}\
  \ \\right|}{\\left| D \\right|},\\\\cdots,\\\\frac{\\left| D\\_{m} \\right|}{\\\
  left| D \\right|})$。因此，跨越 `m` 个箱的信息与所创建的箱的大小及其熵成正比 [17]。\n\n### 3.2 研究方法\n\n预处理后的数据在\
  \ SPSS 20 版本中进行了分析，尽管某些算法是在 Weka 中实现的。总而言，该研究基于以下框架使用了视觉化编程。计划的方法分为三个阶段：预处理、模型设置以及学习与评估。预处理涉及\
  \ `Age` 变量的离散化以及利用其他属性对肺癌属性进行表征。属性被归类为诱发因素或症状因素。预处理过程中的分组表征建立了肺癌的发生率，并指出了每组中显著的诱发因素和症状。在研究中，肺癌表征的结果作为评估每个算法性能的基准。分组表征结果显示，270\
  \ 例发病病例患有肺癌，而只有 39 例不是。在评估相应模型时，分类准确率（`CA`）和测试显著性（`F1`）基于模型预测这两个表征组别的能力。所有模型都使用了\
  \ 10 折交叉验证，以便每类预测观测值的结果为平均值。其余的比较分析也基于这些平均值。计划的方法以及研究中使用的其他措施（包括算法）如图图 1 所示。该研究还根据其他研究的结果进行了推断，并根据所选指标的声誉增强了其结果。\n\
  \n图 1 显示了研究中使用的方法，包括数据预处理、数据学习和模型评估。预处理细节包括使用基于熵的方法对 `Age` 属性进行离散化。视觉程序中的数据学习器包括决策树、SVM、kNN、神经网络、朴素贝叶斯、随机梯度下降、随机森林和\
  \ AdaBoost。研究中包含的其他算法包括 `ID3`、`J48`、`CHAID` 和 `Deep Learning`。这些算法与决策树回归和神经网络（多感知层）算法相关。模型根据混淆矩阵、ROC\
  \ 分析、校准图和提升曲线进行评估。\n\n![Image](img/fig10_1.jpg)\n\n**图 1：** 研究方法概述。\n\n### 3.3 算法\n\
  \n该研究总共使用了 12 种算法，并在随后的小节中对每种算法进行了讨论。讨论重点是每种算法的特征以及使其适用于本研究的主要需求。\n\n### 3.3.1 朴素贝叶斯\n\
  \n该算法是预测分类任务中常用的算法之一。该算法基于贝叶斯概率规则 [18]。该规则将计算出的后验概率分解为先验和似然概率。在应用中，假设一个实验（例如 `E`）具有包含所有可能结果的子空间\
  \ `S`。学习数据也同样适用，以确定诱发因素的后果。假设在每种情况下或每个个体病例中，诱发因素和症状都代表了肺癌发生的所有可能性。也就是说，假设 `A` 和\
  \ `B` 分表示一个诱发因素和一个症状，那么咳嗽（症状）是吸烟（诱发因素）的条件概率表示如下 [18]：\n\n```\nP(B/A) = \\frac{P(A\
  \ \\cap B)}{P(A)}\n```\n\n为了使似然规则成立，`A` 的概率必须大于 0，且左侧表示在给定 `A` 的情况下 `B` 的概率。\n\n\
  ### 3.3.2 决策树、随机森林和逻辑回归\n\n`DT` 分类器基于在节点上构建分支的回归算法。它代表了属性之间的层次关系。在研究中，决策树用于构建分类和回归任务的预测模型\
  \ [19]。在肺癌发生预测解释中，树呈现为选择及其结果的分级模型。例如，医生和护士可以使用决策树识别患者或个人是否易患肺癌。作为分类器预测模型，决策树是对属性空间的递归划分。模型具有根节点树的形式，因此它是一个没有入边的根节点的有向树，尽管根据规则，其他节点仅有一个入边\
  \ [20]。没有出边的节点被称为“测试”节点或“内部节点”，而其余节点构成了叶子节点，主要被称为“决策”节点或“终端”节点。在研究中，每个内部节点根据从输入属性值导出的离散函数将空间划分为两个或多个子空间；这就是离散化\
  \ `Age` 属性的基础。随机森林是一组树，也可以作为分类器或回归模型。在树和随机森林中常用的回归算法包括但不限于 `ID3`、`CHAID` 和 `CRT`\
  \ [19]。\n\n#### 3.3.3 ID3, CHAID 和 CRT\n\n\n\n\n迭代二分法 3（Iterative Dichotomiser 3,\
  \ ID3）是最简单的决策树算法。该算法依赖信息增益来控制分裂，当所有情况都被赋予预测变量的单一值，或者最小化熵为零或接近零时，树的生长停止`[21]`。需要注意的是，该算法没有实现任何剪枝过程，也不处理非分类变量或信息缺失的数据。在利用信息增益来停止增长方面，ID3\
  \ 依赖于公式 2 中的熵信息公式。\n\n卡方检验自动交互检测（CHAID）最初也仅旨在分析名义变量`[22]`。该算法为输入变量寻找与预测变量之间显著性差异最小的一对值。差异的显著性基于所选统计检验的方法。统计技术方法的选择也取决于预测变量的性质。例如，F\
  \ 检验适用于连续预测变量；皮尔逊卡方检验适用于名义预测变量，而似然比检验适用于序数预测变量`[21]`。在对年龄离散化后，研究中使用的所有变量均为序数变量，因此在\
  \ CHAID 算法使用了比例检验。\n\n### 3.3.4 神经网络\n\nNN 算法基于多层感知器算法。多层感知器（MLP）是用于真实世界数据挖掘应用的神经网络。通常，它由层与层之间全连接的自适应权重隐藏层组成`[21]`。这些层分为输入层、隐藏层或输出层。该算法可以近似输入空间非伪区域的任何观精度和任何连续函数。因此，它被称为通用近似器。准确程度取决于隐藏层的数量、权重和偏置。\n\
  \n### 3.3.5 支持向量机 (SVM)\n\nSVM 是一种用于不同研究领域的高性能模式识别技术。该算法通过部署决策函数来运行，试图将训练子集分为两个水平、类别或种类。在选择决策函数时，确保到超平面两侧训练数据中最近点之间的距离最大化`[19]`。如果决策函数无法线性分离数据点，则实现核函数将数据转换到具有\
  \ SVM 算法支持的特征的不同维度空间。\n\n### 3.3.6 随机梯度下降\n\nSGD 是用于惩罚线性判分析的梯度下降方法之一。需要注意的是，神经网络和深度学习算法使用\
  \ SGD 来惩罚模型学习过程中正向或反向传播相关的高成本。这两个算法包含的 SGD 导致更快的收敛，更新目标算子 `J(θ)` 参数 `θ` 的算法如下所示`[23]`：\n\
  \n| `θ` ℄=℄`θ` ⅅ− `α`∇[`θ`]*E[`J(`θ`)`] || (4) |\n| --- | --- |\n\n方程中的期望 `E […]`是通过评估与训练集相关的代价和梯度来估计的。当作为算法或数据学习器使用时，SGD\
  \ 忽略了期望函数并计算参数梯度，使得方程变为：\n\n| `θ` ℄=℄`θ` ⅅ− `α`∇[`θ`]*J(`θ`; `ρ`^((i`)), `β`^((i`)))\
  \ || (5) |\n| --- | --- |\n\n在公式 5 中 `ρ^((i)), β^((i))` 是从训练集中抽取的一对属性，其梯度或斜率与其他观测值独立计算`[23]`。SGD\
  \ 可以被认为是相关系数的变体，但重点在于使用或关注训练数据集中的单个样本。该算法最小化了后续更新中的方差，导致更稳定的收敛。它还使用了高度优化的矩阵操作，否则这些操作需要批处理。\n\
  \n### 3.3.7 AdaBoost\n\n自适应提升或 AdaBoost 是一种结合并改进弱分类器或学习器的算法，即它指的是一种训练已识别分类器的方法，算法仅选择能提高模型性能的特征并忽略无关特征。一个传统的提升分类器可以表示如下`[24]`：\n\
  \n| $F_{\\tau}(x) = {\\sum_{\\tau = 1}^{T}f_{\\tau}}(x)$ || (6) |\n| --- | --- |\n\
  \n其中 `x` 指所有模型输入，包括目标变量，而 `f[τ]` 指弱学习器或分类器。在分类过程中，假设每个弱学习器都会产生一个假设输出 `h(x[i])`。\n\
  \n---\n\n## 4. 实验\n\n实验在不同的平台上实现，即 SPSS 20。如表 1 所示，实验中使用的数据被分为诱发因素和疾病症状。该规范有助于对肺癌是组和非肺癌否组进行表征。实验如第\
  \ 2.4 节所述分阶段实施的。\n\n### 4.1 实验设置\n\n首先，使用 Weka 中的 `discretize` 函数对年龄属性进行离散化处理。上传以逗号分隔格式的数据并对年龄进行离散化；将结果写入数据表，并如图所示保存结果，下方的可视化给出了这些结果。\n\
  \n其次，将保存的数据加载到图 2 文件标签的文件部分，并自动执行分析，评分结果汇总并存储在 Test & Score 可视化元素中。该元素包含了比较不同算法的指标，算法和结果的示例所示。\n\
  \n最后，使用图 3 中可视化程序中的 ROC 分析、混淆矩阵和预测元素检索了其余图表（ROC 曲线）、预测和性能指标。\n\n\n\n\n使用了性能指标和评估曲线来对模型进行评估。研究中使用的指标包括准确率、精确率、召回率、F-1\
  \ 值以及 ROC 曲线下面积。计算指标时使用的公式记录在《实现推荐系统指南》的`[25]`中。研究中使用的曲线包括 ROC 曲线、提升图和校准图。需要注意的是，研究采用了\
  \ 10 折交叉验证，因此每个算法在混淆矩阵表中呈现的准确率和错误率均为平均值。\n\n## 5. 结果与讨论\n\n后续章节将对群体表征的输出以及所选个体算法的结果进行展示、解释和讨论：\n\
  \n## 5.1 预处理与群体表征\n\n根据提供的属性，将肺癌发生率分为两组的表征结果总结在`表 2`中。群体表征的目的是基于连续属性的均值和标准差，以及离散属性的召回率和精确率，展示组之间的差异。表格显示，87.4%\
  \ 的病例为肺癌阳性，而只有 12.6% 的病例没有肺癌。后续聚类和学习算法也应正确预测或分类这些病例，性能最好的算法对癌症病例应达到约 87% 的准确率，对非肺癌病例应达到\
  \ 13%。根据表征结果（`表 2`），过敏是肺癌的主要原因，尽管它也可以被认为是主要的诱发因素。饮酒紧随肺癌的首要原因，而吸烟在肺癌阳性组中是肺癌发生最低的原因。相反，在未患肺癌的人中，吸烟是肺癌的主要原因，而年龄、慢性疾病和焦虑是主要的诱发因素。在症状方面，没有肺癌的人可能因为上述暴露条件和诱发因素而患病，往往会感到疲劳和胸痛。而对于肺癌患者，呼吸哮鸣、咳嗽和胸痛是该疾病的主要症状。\n\
  \n**表 2：** 使用均值和标准差的肺癌群体表征。\n\n![Image](img/tab10_2.jpg)\n\n一些额外的属性缩写和简写包括`AC`（饮酒）、`SD`（吞咽困难）、`PEER_PRE`（同伴压力）、`YELLOW_FIN`（手指黄）、`CHRONIC\
  \ D`（慢性疾病）和`SOB`（呼吸困难）。\n\n### 5.2 模型结果\n\n后续章节将讨论个体算法的结果以及所有模型之间的比较：\n\n### 5.2.1\
  \ 朴素贝叶斯\n\n肺癌发生率的分类基于每个诱发因素和症状的贡献概率和绝对重要性。基于对数优势比，肺癌的每个诱发因素和症状具有不同的影响概率。具体而言，过敏、饮酒、吞咽困难、呼吸哮鸣和咳嗽的对数优势比上分别为\
  \ 37%、40%、32%、43% 和 46%。\n\n`表 2`中的点均为 0.0，尽管已计算了对数优势比；至关重要的一点是，对数优势比为正值，因此分别为 67%、60%、68%、54%。\n\
  \n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n（注：5.2.1 提供的源文本包含关于数字的重复/碎片化句子；我在保留核心技术描述的同时，应用了格式说明。）\n\
  \n\n\n\n随机森林与 `Decision Tree` 不同，它仅将 85.8% 的病例分类为癌症，尽管它在确定肺癌时引入了吸烟、疲劳和手指发黄等条件。假设某个体没有过敏，如果他/她吸烟，有\
  \ 91% 的概率患上肺癌；如果饮酒，概率为 71.1%。如果此人因饮酒患上肺癌，那么他有 62.1% 的概率出现喘鸣，以及 90.2% 的概率感到疲劳。出现喘鸣的人要么在咳嗽（50.9%），要么在吸烟（79.4%）。在疲劳的人中，有\
  \ 78.9% 的人会经历吞咽困难。关于吸烟，吸烟者患肺癌的概率为 100%，尽管性别会改变其对肺癌的敏感性。也就是说，女性如果吸烟，患肺癌的概率为 93.1%，而在这一比例中，91.5%\
  \ 的敏感性可以归因于饮酒，且有 96.8% 的概率该疾病将表现为手指发黄。\n\n![Image](img/fig10_7.jpg)\n\n**图 7：**\
  \ 用于肺癌预后数据的随机森林模型。\n\n### 5.2.3 ID3、CHAID 和 CRT\n\n这些是高级的决策树学习算法。这三种算法使用了不同的树生长和剪枝方法。`ID3`\
  \ 模型树所示：\n\n![Image](img/fig10_8.jpg)\n\n**图 8：** `ID3` 树模型，显示了肺癌比例以及主要的诱发因素（过敏）和症状（吞咽困难）。\n\
  \n该模型将 `Age`（年龄）作为一个诱发因素，这与 `Decision Tree`、`random forest` 和 `Naïve Bayes` 模型的区别。`ID3`\
  \ 模型显示 87% 的病例为癌症，而 13% 为非。这确立了过敏是癌症的主要原因。在非过敏性癌症病例中，患者可能出现吞咽困难，而同伴压力仍然是主要的驱动因素。然而，在肺癌与年龄相关的案例中，模型认为\
  \ 30 岁以上的人比 30 岁以下的人更容易患由过敏引起的肺癌。\n\n`CHAID` 模型产生了与 `ID3` 模型相似的树，尽管它排除了年龄因素。该模型所示于\
