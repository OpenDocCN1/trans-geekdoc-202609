  - `AODV.cc`\n\n#### 4.4 用于攻击检测和的的函数\n以下函数被修改以支持该机制：\n- `trust handshake timer`\n\
  - `AODV::SendHandshakePacket()`\n- `AODV::RecvAODV()`\n\n## 5 结果与讨论\n我们在 Ubuntu\
