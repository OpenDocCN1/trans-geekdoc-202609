  \ `Nexus 7` 平板。`Android 4.2` (`API level 17`) 随后于 2012 年 7 月 13 日发布。\n*   2013 年\
  \ 10 月 31 日，`Android 4.3` (`API level 18`) 发布。\n*   2014 年 6 月 25 日，`Android 4.4`\
  \ (`API level 19`)，KitKat（巧克力威化）发布，首次在 Google 的 `Nexus 5` 上亮相。带有可穿戴扩展的 `Android\
