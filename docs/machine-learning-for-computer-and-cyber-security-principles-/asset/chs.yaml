  \ FPR）。\n\n## 9.5 尝试的替代架构\n\n在评估用于恶意 URL 检测的深度学习方法时，我们尝试了以下架构：\n\n- 混合架构中堆叠的 `convolution1d`\
  \ 层后接 `RNN/LSTM/GRU/IRNN` 层。\n- 堆叠的 `embeddings` 后接 `RNN/LSTM/GRU/IRNN/CNN/CNN-LSTM`\
  \ 层。\n- 堆叠的 `convolution1d` 层用于捕捉非线性卷积激活。\n- 堆叠的 `RNN/LSTM/GRU/IRNN` 层。\n\n## 9.6\
  \ 结论、未来工作方向与讨论\n\n在本子系统中，我们研究了基于深度学习的无特征检测方法在恶意 URL 检测中的应用。此外，还使用了带有特征工程的传统机器学习算法。与传统的机器学习分类器相比，深度学习架构表现良好。此外，它可以轻松处理恶意\
  \ URL 的漂移，并在对抗环境中作为一种稳健的机制。根据结果，我们声称基于深度学习的恶意 URL 检测消除了对黑名单、正则表达式、签名匹配方法以及基于机器学习的解决方案的需求。我们将其命名为\
  \ Deep-URL，并可以通过添加如网站注册服务、网站内容、网络信誉、文件路径和注册表项等辅助信息来使其更加健壮。\n\n## 10 组织安全建议架构\n\n\
  所开发框架的架构细节请见图 11。该框架由三个模块组成：(1) 数据收集 (2) 深度学习模块 (3) 持续监测。\n\n![![Image](img/fig6_10.jpg)\n\
  \n**图 10：** 从合法和恶意 URL 中随机选择 50 个 URL，并使用 t-SNE 显示了它们在倒数第二层的激活值。\n\n![Image](img/fig6_11.jpg)\n\
  \n**图 11：** 组织安全架构图。\n\n被动式传感器从 [2] 中讨论的五个不同源收集 DNS 和 URL 数据。每个传感器可以处理来自多个源的数据。收集的数据包含\
  \ DNS 和 URL 日志。这些日志包含了用户查询的细节。解析单元解析日志并专门提取具有多个 IP 地址的域名和 URL。域名和 URL 被传递到深度学习模块。检测到的域名/URL\
  \ 然后送入持续监测系统。在这里，系统以五秒为持续持续监测目标域名/URL。该系统将主动查询以检查检测到的域名/URL 的 IP 是否发生任何变化。\n\n##\
  \ 11 结论、未来工作与局限性\n\n在此工作中，我们研究并探索了 DNS 和 URL 的事件数据，用于网络安全威胁态势感知。为了处理大量的 DNS 和 URL\
  \ 日志，开发了一种高度可的分布式大数据框架。该框架利用了自然语言处理（NLP）的概念，并使用深度学习架构自动检测网络安全威胁。开发的框架每秒能够分析超过 200\
  \ 万次事件，并实时检测其中的恶意活动。通过添加额外的计算资源，该框架可以扩展以分析更大规模的网络事件数据。从预警信号到恶意活动的可扩展性和实时检测，使得该框架在任何同类系统中脱颖而出。\n\
  \n在目前的研究中，尚未提供恶意软件二进制分析的功能。这可以提供关于恶意软件特征的额外信息。此外，将网页内容分析添加到 URL 检测模块中可以提高恶意检测率。这两项任务将作为未来提高恶意活动检测率的空间。\n\
