  \n[1¹]](#16_Chapter08.xhtml#rfn11)\n\n\n\n\n\n下一个组件是矿工，其功能是将等待确认的交易合并成单个区块，然后生成该区块的哈希值。每个矿工都会反复执行这一过程，直到区块的哈希值小于目标值。他们通过改变要包含在区块中的交易集来实现这一点。矿工负责验证比特币交易的真实性、完整性和正确性。矿工可以与其他共同矿工合作，形成矿池\
  \ [[12]]。每当任何矿工或矿池成功生成了工作量证明时，该矿工就会在比特币网络中广播经过验证的区块。为了获得奖励，该区块必须经过大多数参与矿工的验证，之后该区块就会被添加到公共区块链中。作为手续费奖励的比特币随后分配给矿池中的共同矿工，分配比例取决于每个单独矿工所付出的工作量。有些矿池将奖励在所有共同矿工之间平均分配，但这种政策是不公平的\
  \ [[13]]。管理矿池的矿工将获得更高的份额，因为他们还承担了管理矿池的额外工作。\n\n比特币交易所是使用其他功能性货币买卖比特币的虚拟空间，而开发者则是一组程序员，他们致力于改进比特币加密货币并为其添加新功能。他们的工作可以在\
  \ Github 仓库中找到。他们主要关注开发利用比特币的新和服务软件。\n\n![Image](img/fig9_1.jpg)\n\n**图 1:** 比特币系统的组件。\n\
  \n## 2.2 区块链\n\n比特币骨骨是区块链，其基本组件是区块，它是比特币网络中发生的所有交易的公共日志。由于它是 P2P 的，因此它支持分布式计算。这些区块以默克尔树的形式链在一起\
  \ [[14]]，包含完整的交易节点。默克尔树是一种树形数据结构，存储区块中交易的摘要。交易是一个识别比特币所有者的脚本（Script）。脚本是矿工执行的指令序列。为了确保一旦写入公共日志的交易不可更改，比特币矿工需要解决一种被称为工作量证明的密码学难题。硬币所有权从一个人到另一个人的转移由交易表示。\n\
  \n### 2.3 交易脚本\n\n交易由两个部分组成——输入和输出。输入表示未花费的币，输出表示接收者的地址。输入由 `scriptSig` 定义，该签名确保正在传输的比特币是未花费的且属于发送者。输出由\
  \ `scriptPubKey` 定义，它指定了兑回正在传输的比特币的条件。比特币环境包含五个标准脚本——公钥、支付给公钥哈希（P2PKH）、多签名、支付脚本哈希（Pay-to-Script\
  \ Hash）[15]] 和数据输出。公钥脚本定义了用于签名交易的密钥。P2PKH 脚本用于找到哈希值为给定值的公钥。在多签名脚本中，需要多个签名才能兑回比特币。支付脚本哈希允许更复杂的条件。数据输出用于存储任意信息。为了确保一旦写入公共日志的交易不可更改，比特币矿工需要解决一种被称为工作量证明的密码学难题。\n\
  \n### 2.4 拜占庭共识\n\n比特币骨干是区块链……比特币依赖拜占庭共识的概念 [[18]] 来确保分布式和相互扩展、最终区块链的接受。拜占庭共识必须确保两个属性——共性和有效性。共性意味着所有参与的矿工在最后返回相同的区块链。有效性意味着诚实矿工扩展的区块链是有效的。在区块链中，区块以链状线性结构连接。区块链最右侧的区块是最近挖掘的区块，被称为头部（head）。区块链最左侧的区块是最早挖掘的区块，被称为创世区块。区块链的长度是指从创世区块之后的区块数量。比特币环境设置了一个参数，决定了挖掘下一个区块的难度。它是通过增加密码哈希难题的级别来实现的，使得每\
  \ 10 分钟仅生成一个区块，不多不少。这种难度水平每 2016 个区块重新校准一次。\n\n### 2.5 比特币协议\n\n比特币协议 [[19]] 是比特币矿工执行的协议。它的两个主要属性是——公共前缀属性和链质量属性。公共前缀属性意味着两个诚实矿工的区块链仅在最新的区块上有所不同。链质量属性确保诚实矿工挖掘的区块链在足够长的部分不存在任何对抗性区块。\n\
  \n\n\n\n链验证协议用于验证区块链的结构属性。对于区块链中的每一个区块，该协议会检查三点：首先，`PoW` 是否正确解决；其次，时间戳计时器是否超时；第三，是否存在上一个区块的哈希。如果所有区块都能通过验证测试，则该区块链是有效的；否则，将被拒绝。链比较协议负责从一组区块链中找到最合适的一个。竞争链可能被随机选取或按字母顺序选取，在输出中，长度最长的区块链将成为胜者。`PoW`\
  \ 协议尝试通过对预定义的次数进行暴力破解来解决密码学哈希难题，从而扩展获胜的区块链。对于每个新提议的区块，该协议会生成区块哈希，该哈希必须小于设定的目标值。如果破解了难题，区块链将扩展一个区块；否则，保持不变。通过这种方式，`bitcoin`\
  \ 协议被无限迭代。\n\n## 3. 针对比特币协议的攻击分类\n\n比特币环境是不可控且去中心化的，这使得它更容易受到受到网络攻击，因为生成欺诈交易变得更加容易。`bitcoin`\
  \ 协议和 `bitcoin` 网络中发现了多种漏洞。图 3 列出了基于不同威胁的各种可能攻击。\n\n### 3.1 分布式拒绝服务攻击\n\n`bitcoin`\
  \ 系统容易受到第一类网络攻击是网络基础设施攻击。这些攻击通过利用 `bitcoin` 点对点网络通信协议中的漏洞来实现。在此分类下的第一个是分布式拒绝服务（`DDoS`）攻击\
  \ [20]。在这种攻击中，网络资源被耗尽，以阻止真实用户访问服务。这种攻击在主机的指令下执行，主机会指令其他受感染的机器（也称为从机）通过用恶意数据包淹没受害者网络来使其过载。`bitcoin`\
  \ 网络已确认发生过 `142` 种不同的 `DDoS` 攻击。在这种攻击中，大量受感染的客户端节点向诚实矿工发送虚假交易请求。一段时间后，该诚实矿工就会负担过度并开始丢弃所有请求（包括来自其他诚实矿工的请求），从而导致拒绝服务。由于奖励更高\
  \ [22]，`DDoS` 攻击发生在大型矿池 [21] 和大型 `bitcoin` 交易所中。单个矿工和小规模矿池对于此类攻击是安全的。`DDoS` 攻击者的主要目的是产生巨额赎金。`DDoS`\
  \ 攻击阻碍矿池中的参与矿工，导致他们退出矿池。例如，恶意矿工向同矿显示他拥有更多的算力，足以夺取其奖励；诚实矿工发现退一步为佳，从而在 `bitcoin` 网络中成功实施了\
  \ `DDoS`。\n\n![Image](img/fig9_3.jpg)\n\n**图 3:** 比特币系统中的网络攻击。\n\n获得大部分算力的攻击者将能够发起双花费攻击和分布式拒绝服务（`DDoS`）攻击\
  \ [43]。贿赂同矿有三种方法——带外报价、带内报价和负费率报价。在带外报价中，攻击者向同矿提供直接支付，这些同矿愿意在攻击者的私有区块链上工作，该链包含攻击者预矿的区块。在带内报价中，攻击者通过提供\
  \ `bitcoins` 来诱导同矿。攻击者创建一个区块链分支，任何选择在该分支上挖矿的矿工都可以获得免费的 `bitcoins` 奖励。在负费率报价中，攻击者通过支付比当前矿池提供的奖励份额来诱导同矿。\n\
  \n虽然合作矿工获得的收益非常丰厚，但它们是短暂的，因为从长远来看，诚实矿工会对矿池失去信任，最终导致 `bitcoin` 汇率崩溃。另一种矿池攻击是羽毛分叉（feather\
  \ forking）。在这种攻击中，攻击者勒索用户客户端支付某些 `bitcoins`，否则攻击者将对该特定客户端节点执行的交易进行黑名单。攻击者通过公开广播被黑名单的交易来实现这一点。攻击者创建一个区块链分支并努力扩展该分支，使其超过公共区块链。如果攻击者未能做到，它将丢弃私有区块链并恢复在公共区块链上工作。当攻击者决定阻止并黑名单某个特定交易时，他或她将执行迭代分叉以获得同矿的信任。\n\
  \n### 3.2 可变性攻击\n\n下一类攻击包括可变性攻击 [23, 24]。可变性攻击会导致拒绝服务。在可变性攻击中，通过插入虚假交易扰乱待处理交易的顺序。这些虚假交易产生更高的交易验证费用，从而诱导诚实矿工将此虚假交易以高于队列中交易的优先级包含。攻击者的目的是浪费矿工的时间和算力来验证虚假交易，而这最终是徒劳无功。在密码学中，如果攻击者能够在不知道生成\
  \ `X` 的函数的情况下生成类似于 `X` 的输出 `Y`，则使用“可变性”一词。在 `bitcoin` 网络中，通过改变两个语义相同交易的语法配置，使交易变得可变。。这可以在不知道用户私钥的情况下完成，因为\
  \ `bitcoin` 协议中有一个漏洞，它通过 `transaction-id` 识别每笔交易。但这个 `transaction id` 可能不是唯一的，这意味着从\
  \ `Alice` 到 `Bob` 转账 `x` 个 `bitcoins` 的交易可能有两个 `transaction ids` —— `T` 和 `T’`。这种情况是因为这些交易的哈希是不同的。尽管传输的\
  \ `bitcoins` 数量相似，但每次传输的都是不同的 `bitcoins`set。`bitcoin` 协议的这个漏洞在交易可变性攻击中被利用。\n\n\n\
  \nMt. Gox 比特交易所使用了比特币协议的自定义实现，该实现存在此漏洞 \\[25, 26\\]。由于这种攻击，交易所不得不封锁账户并禁止了交易。攻击者能够从该比特币交易所提取两次其货币。之所以之所以可能，是因为\
  \ Mt. Gox 比特交易所使用的比特币协议自定义实现只搜索匹配的 `transaction-id`，而最近的比特币协议参考实现则会搜索任何在语义上等价的交易。在\
  \ Mt. Gox \\[27\\] 案例中，攻击者在 Mt. Gox 有一个比特币交易账户。例如，Alice 首先在她的交易所账户中存入了 `X` 个比特币。然后她向\
  \ Mt. Gox 发送了交易 `Tx`，要求将她的币退还给她。作为回应，Mt. Gox 了一了交易 `Ty` 将 Alice 的币退还给她。接下来，Alice\
  \ 生成了 `T’`，它在语义上与 `Tx` 相同但具有不同的 `transaction-id`。该交易 `T’` 被包含在公共区块链中，而交易 `Tx` 被回滚，因此\
  \ Alice 现在通知 Mt. Gox 交易 `Tx` 失败。然后，Mt. Gox 检查其交易，没有找到交易 `Tx`，这让他相信 Alice 关于交易失败的说法是真的，因此将\
  \ `X` 个比特币退还给她。这些就是从未提交过的 `X` 个比特币。\n\n### 3.3 退款攻击 (Refund Attacks)\n\n当任何比特币交易失败时，比特币交易所必须启动退款。这就是退款攻击\
  \ \\[28\\] 发挥作用的地方。边界网协议-70 (`BIP-70`) 被比特币开发者社区广泛接受，用于使用比特币进行成功支付。几乎所有主要的钱包和交易所服务都使用此协议。有些支付服务为交易所和钱包服务供应商提供了一个平台和基础设施，以便其在安全环境中运行。退款攻击是通过利用\
  \ `BIP-70` 中存在的身份验证漏洞发生的。在这种攻击中，用户钱包受恶意比特币节点的控制。每当客户开始交易他的比特币时，他的钱包地址就会发送到恶意节点。交易完成后，恶意用户向客户交易的节点请求退款。在退款请求的退款地址中，恶意用户放入了自己的钱包地址，比特币便退还给了他。客户并不知道这些以其名义发生的所有交易。这是因为使用\
  \ `BIP-70` 协议的商户缺乏对发送退款请求的人的安全身份验证。\n\n### 3.4 中间人攻击 (Man-in-the-Middle Attack)\n\
  \n比特币系统中的网络基础设施攻击也包括中间人攻击 (`MITM`) \\[29\\]。在这种情况下，攻击者通过将受害者引导至伪装成可信商户网站的网站来帮助其进行安全的比特币支付，但点击网页会暴露受害者的身份，包括受害者的钱包地址。每当任何客户参与任何类型的在线支付时，他会被重定向到一个合法的支付网关。假设客户\
  \ `C` 刚刚从受害者那里买了东西。那么受害者的支付网关页面将在客户的浏览器中打开。该页面受攻击者的控制，客户 `C` 的细节将在受害者察觉到这些操作的情况下被攻击者获。在客户\
  \ `C` 向受害者付款后，攻击者以客户 `C` 的名义发送退款请求，退款金额将发送给攻击者。客户对退款不知情，受害者失去了他的币。因此，中间人攻击成功。\n\n\
  为了防止这种情况，需要对 `BIP-70` 协议进行修订。比特币网络中的所有节点都有一个维护时间计数的内部时钟。这有两种——中位数时间（median time）和系统时间。中位数时间是相邻节点在加入比特币网络时发送给新连接节点的时间。它是通过相邻节点共享的\
  \ `version` 信息发送的。系统时间是节点自身的定时器，允许与中位数时间产生最大 70 分钟的偏差。每当超过最大偏差限制时，它就会重置。\n\n###\
  \ 3.5 时间劫持攻击 (Time-jacking Attack)\n\n在时间劫持攻击 \\[30, 31\\]中，攻击者通过虚假的中位数时间向对等节点引入时间的不准确性。攻击者可能为此目的种植虚假节点。这将导致对等节点计时器的突然增加或减少。一种经典的攻击涉及通过增加协作节点的计时器，使受害者节点的计时器变得最慢。受害者可以被滞后的最长时间为\
  \ 140 分钟。任何区块链的接受都取决于网络时间；因此，通过更改标记，攻击者混淆了对等节点。受害者节点随后在一个已被网络其他部分丢弃的旧区块链分支上开始挖掘，从而浪费了他们的时间计算能力。这导致了比特币交易确认率的延迟，节点可能需要等待超过\
  \ 6 分钟才能确保刚刚验证的交易不会被回滚。\n\n### 3.6 女女攻击 (Sybil Attack)\n\n在女女攻击 \\[32, 34\\]中，恶意节点通过形成一组虚假节点来破坏网络的一部分。它们的动机是把受害者节点从比特币网络中划分并将其隔离，使得受害者节点的所有交易都无法阻止进入公共区块链。这是通过协作计时攻击实现的，这导致加密过程花费更长的时间，从而延迟了受害者交易的确认。受害者交易的输入在网络中等待验证，这增加了这些输入被用于双花攻击\
  \ \\[35\\]的脆弱性。\n\n### 3.7 日食攻击 (Eclipse Attack)\n\n在日食攻击 \\[33\\]中，攻击者拥有多个 IP 地址来执行欺骗。受害者被攻击者选中，之后受害者节点尝试连接的所有\
  \ IP 地址都被重定向到攻击者的 IP 地址，从而了受害者希望连接的节点。日食攻击进一步分为两种——基础设施攻击和僵尸网络攻击。基础设施攻击发生在互联网提供商\
  \ (`ISP`) 上，强制操控多个比特币客户端节点的地址。在僵尸网络攻击中，攻击者操控特定范围的地址，例如私有 IP 地址影响连接在该私有网络对等节点。这种攻击是由僵尸网络执行的，它们根据攻击者的指令工作。在新的区块被挖掘后，关于这个新挖掘区块的信息会在比特币网络中广播。这些信息按设定的时间间隔共享。篡改攻击\
  \ \\[36\\]中的攻击者通过拥塞网络路由和通过发送多个请求过载客户端节点，延迟这种广播信息的传播。\n\n### 3.8 双花攻击 (Double Spending\
  \ Attacks)\n\n\n\n\n\n双花费攻击 `[14]` 意味着将同一笔比特币用于两次不同的交易。在比特币网络中，矿工的工作职责是验证和处理网络中的交易。他们必须确保任何交易中的输入（inputs）仅引用未花费的币。这是通过分布式时间戳和分布式拜斯庭共识协议实现的。例如，Alice\
  \ 在时间 `t1` 使用她的比特币 `B[alice]` 创建了一笔指向 Bob 的交易 `Tx`。Alice 在比特币网络中广播了这笔交易。随后，在与 `t1`\
  \ 几乎并行的时间 `t2`，Alice 再次使用比特币 `B[alice]` 创建了另一笔交易 `Ty`。这次的交易指向的是一个她已经拥有的钱包地址。如果 Bob\
  \ 接受了交易 `Tx` 并提供了商品或服务，那么 Alice 将成功地两次使用了同一笔比特币，因为 Bob 面临着无法收回这些比特币的风险。在比特币网络中，确保任何交易中仅使用未花费的比特币是矿工的动态责任。当任何矿工\
  \ `X` 接收到两个输入脚本中具有相同比特币的交易时，矿工 `X` 必须仅验证其中一个，从而拒绝另一个。\n\n即使比特币交易中有严格的排序和工作量证明（proof-of-work），比特币环境仍然容易受到双花费攻击。只有当连续满足以下四个条件时，双花费攻击才能成功：首先，当比特币网络中的部分矿工批准了\
  \ Alice 的交易 `Tx`，Bob 收到批准确认后释放了他的产品和服务，随后却发现被批准的交易被回滚了。其次，与此同时，比特币网络中的其余矿工批准了交易\
  \ `Ty`，从而导致现有区块链的分叉（forking）。第三，Bob 在向 Alice 发送产品或服务后，收到了交易 `Ty` 的批准确认。最后，超过 50%\
  \ 的比特币矿工必须开始在接受 `Ty` 为有效交易的区块链上进行挖矿。如果满足所有这些条件，Alice 将成功地将同一组比特币两次用于不同的商品和服务。双花费攻击具有不同程度的难度和复杂性，可以分为六个子类，如\
  \ `Fig. 3` 所示。\n\n### 3.9 Finney 攻击\n\n在 Finney 攻击 `[37]` 中，Alice 预先挖掘了包含 `Ty` 交易的区块。随后\
  \ Alice 使用相同的比特币 `B[alice]` 创建了指向 Bob 的交易 `Tx`。Alice 保持预挖区块私有状态，不向比特币网络广播。Alice\
  \ 等待到矿工接受了她的交易 `Tx` 并宣布其有效。Bob 从网络矿工处获得交易 `Tx` 的有效性确认后，释放了商品和服务。当 Alice 从 Bob 那里收到商品和服务后，她便将自己预挖的区块广播到网络中，创建一个长度相等的区块链分叉链。如果大多数比特币矿工开始在这个新创建的分叉区块链上工作，那么\
  \ Alice 将成功地使交易 `Ty` 有效而使 `Tx` 失效，因为根据比特币协议，当出现分叉时，矿工将在最长的区块链上工作。\n\n这在两个区块链分叉之间产生了竞态条件。\n\
  \n### 3.10 暴力攻击\n\n在暴力攻击 `[38]` 中，攻击者控制了网络中的 `x` 个节点。如果矿工拥有额外的计算能力来帮助其解决工作量证明，这种情况就是可能的。为了避免这种情况，Bob\
  \ 应该等待 `n` 次确认。这是在网络中进行的。\n\n### 3.11 Vector-76 攻击\n\n另一种形式的双花费攻击发生在存款场景。它被称为 Vector-76\
  \ 攻击 `[39]`。在这种攻击中，Alice 会预挖存款交易。这使得 Alice 分叉链的长度增加了一倍。按照比特币协议，网络随后会将最长链视为有效，导致交易被回滚并造成比特币损失。\n\
  \n### 3.12 余额攻击\n\n另一种双花费攻击被称为余额攻击 `[40]`，利用了比特币协议的工作量证明特性。其基础是，如果矿工能够比其他矿工更快地生成工作量证明，那么其成功的概率就会增加。在余额攻击中，Alice\
  \ 会尝试延迟网络通信。这取决于对算力的依赖程度。\n\n### 3.13 Goldfinger 攻击\n\n最后一种双花费攻击是 Goldfinger 攻击，也称为\
  \ 51% 攻击。这是一种理论攻击，如果执行成功，将导致比特币系统不稳定。在最坏的情况下，当超过 50% 的算力集中在单个矿工或矿池时，这种情况可能会发生。下面的图表显示了确认次数、算力与双花费之间的关系。\n\
  \n![Image](img/fig9_4.jpg)\n\n图 4：显示双花费关系的图表。\n\n### 3.14 矿池攻击\n\n比特币系统中的下一类网络攻击是矿池攻击\
  \ `[62]`。比特币矿工聚集资源以增加其哈算力，这将直接缩短他们选择放入提议区块的交易集的验证时间。最近，挖矿策略的研究领域受到了广泛关注。矿池攻击大致分为两类——内部攻击和外部攻击。在内部攻击中，池内矿工变得不诚实，试图在交易费中获取更多公平份额奖励。在外部矿池攻击中，池内矿工不参与。这些攻击由外部矿工执行，他们利用其更高的哈算力来发起双花费攻击。\n\
  \n\n\n\n\n# 事实证明，比特币网络中每个参与的矿工都是为了获得奖励，但他们以诚实公平的方式这样做，而不损害其他矿工。但在自私挖矿攻击中，不诚实的矿工会刻意隐藏他们已经成功挖掘出的区块信息。他们的目的是双倍的：第一，他们想要获得矿池赢得奖励的不公平份额。这意味着奖励不再根据单个矿工所完成的工作进行分配，而是得到了不公平的分发。不诚实矿工获得的份额超过其在挖掘中投入的算力。这些不诚实矿工的第二个目的是迷惑其他矿工，导致他们的资源消耗在错误的区块链上。\n\
  \n为了更好地理解这一点，让我们假设 Alice 是矿池中的不诚实矿工。Alice 保留了预挖区块的信息。然后，她在自己的私有链上继续挖掘。只有当她的私有链长度超过矿池其他部分正在挖掘的公共链长度时，她才在矿池中发布她的私有链。这导致区块链的分叉。然后根据比特币协议的规则，所有矿工都需要切换到最长链，即\
  \ Alice 新广播的区块链。这样做，原本给予诚实矿工在之前的区块链上添加区块的奖励会被矿池管理者收回，从而导致诚实矿工的时间、精力和金钱浪费。如果 Alice\
  \ 能够与其他不诚实的共同矿工合作并在矿池中建立自己的不诚实子池，攻击将变得增强，这可能进一步导致 51% 攻击。\n\n## 3.15 跳池攻击\n\n下一种矿池攻击是跳池攻击。在这种攻击中，攻击者分析其他矿工提交给矿池管理的矿份额条目。很多时候，发生的情况是大量矿工提交了矿份额，但矿池无法找到下一个区块。在这种情况下，即使在后期找到了区块，奖励也将根据数量巨大的矿份额条目进行分配；因此单个份额将微不足道。在这种情况下，攻击者会动态地切换他的矿池或开始独立挖掘。\n\
  \n### 3.16 留区块攻击\n\n另一种矿池攻击被称为留区块攻击 [41, 42]，其中攻击者永远不广播他挖掘的区块。它可以分为两种类型——破坏攻击和伏击攻击。在破坏攻击中，攻击者的目的不是获得奖励，而是让其他矿工失去奖励。在伏击攻击中，攻击者的目的是通过刻意隐藏预挖区块来获得奖励，就像自私挖矿一样。伏击攻击在短期内经济上并不可行，但长期来看会造成巨大的损害，导致矿池在几个月内损失大量资金。矿池容易受到下一种攻击是“贿赂攻击”。在这种攻击中，攻击者贿赂并诱导其他矿工与攻击者共享他们的计算资源，攻击者最终可能会获得矿池中大部分资源的控制。虽然攻击者拥有大部分算力的时间较短，但它对矿池的奖励收益构成了威胁。\n\
  \n## 4. 比特币协议中的安全与隐私问题\n\n随着计算能力的增加和密码分析技术的进步，密码学原语面临被破解的风险 [46]。这些原语随着时间的推移而削化，很少发生突然破解。尽管下文讨论的一些攻击是理论上的\
  \ [47]，但预测它们影响是非常关重要的，以便制定严谨的应急预案。流程图显示了比特币协议验证下一个提议区块的密码原语遵循的过程。由于挖掘活动的变化、网络延迟以及不诚实矿工的存在，区块链的正确状态产生争议，导致区块链分叉。为了防止分叉，区块链中引入了检查点，当发生争议时，区块链将重置为上一个检查点。这些检查点条目从区块链中的第一个区块开始，被称为\
  \ `genesis block`。这样，矿工之间维持了共识，他们只继续挖掘最长的区块链 [48]。\n\n但这些临时分叉增加了双重花费攻击发生的可能性。简单来说，双重花费发生在攻击者首先用其钱包中的比特币换取服务时。然后，他重组交易账本，使得最初记入的金额被扣除，允许他将其用于某些其他交易。技术上，对手试图利用网络中的这种临时分裂。在这种攻击中，攻击者在区块链的两个不同分支中放置具有相同输入脚本的两个不同交易。只有在达成共识并将其中一个分支选为有效分支时，才能防止这种情况发生。为此，接收者在提交之前必须等待许多确认区块。Satoshi\
  \ Nakamoto 解释说，如果接收者等待发送者的交易在区块链中向前推进 `N` 个区块，比特币系统就有抵抗双重花费攻击的能力。那么，发送者能够重组公共区块链的概率将随\
  \ `N` 的指数级下降。\n\n![Image](img/fig9_5.jpg)\n\n**图 5:** 比特币密码学原语。\n\n比特币系统中的另一个主要安全问题是超过一半的算力集中在一个矿工手中。这导致了系统的不稳定，在引入矿池概念后，这种攻击的几几倍地增加。在矿池中，创建了一个矿工小组来协作并共同寻找\
  \ `nonce value`。矿奖励然后根据每个成员矿工完成的工作比例进行分配。一旦交易通过验证，接受的区块详情就会遍遍网络。所有节点并不需要下载末端的完整区块链；它们只需要下载相应的\
  \ `Merkle tree` 的区块头并成为轻量级客户端，遵循简单支付验证 (`SPV`)。随着时间的推移，比特币社区通过分叉对比特币协议进行新的更新和安全增强。当这种分叉与之前的版本向后兼容时，被称为\
  \ `soft fork`。它不严格，因为并不是所有节点都需要升级到最新版本。当这种分叉向后兼容时，则被称为 `hard fork`。在硬分叉的情况下，所有节点都需要升级到最新版本才能参与，因为新交易会被旧版本的比特币协议拒绝。\n\
  \n### 4.1 哈希\n\n\n\n\n比特币中的哈希操作发生在两个地方 `[49, 50]`。主哈函数具有 256 位输出，次级哈函数具有 160 位输出。主哈函数有三个功能：首先，它是矿工用于生成\
  \ `PoW` 的哈希函数；其次，它用于生成区块中交易的哈希，并存储在 `Merkle` 树中；第三，它在用私钥对交易签名时使用。在主哈函数中，`Secure\
  \ Hash Algorithm` 对输入应用了两次。次级哈函数用于两个脚本——`P2PKH` 和 `P2SH`。在次级哈函数中，首先使用 `SHA-256`\
  \ 对输入哈希，然后使用 `RACE Integrity Primitives Evaluation Message Digest`(`RIPEMD-160)`）处理。一个健壮的哈希函数必须确保三个属性——抗原像性、抗第二原像性和抗碰撞性。抗原像性意味着即使攻击者知道输出，也很难找到进行哈希的输入。抗第二原像性意味着给定一个输入和一个与其哈希相等的哈希，无法找到另一个输入值。抗碰撞性意味着在计算上无法找到两个哈希值相同的不同输入。\n\
  \n要攻击碰撞性和抗第二原像性属性，只需要公开主哈希或次级哈希中的其中一个；而要攻击抗原像性属性，攻击者需要知道两个哈希。当哈希算法被破解并导致主哈函数的抗碰撞性被破坏时，比特币会被盗取并销毁。当次级哈函数的抗碰撞性被破坏时，交易将遭到否认。抗第二原像性属性被破坏会导致双花费，而抗原像属性被破坏会暴露用户地址，并导致区块链的完全崩溃。\n\
  \n### 4.2 数字签名方案\n\n比特币协议使用的数字签名方案是 `Elliptical Curve Digital Signature Algorithm`(`ECDSA`）\
  \ `[51, 52]`，它使用了 `secp256k1` 参数。它被用于为主哈希值签名。当签名方案被破解时，会导致交易的可变体性攻击。在这种攻击中，攻击者能够在不验证签名的情况下，以多种方式编码同一笔交易。衡量数字签名方案健壮性的三个参数是——不可伪造性、完整性和不可否认性。不可伪造性意味着在不知道私钥的情况下，无法生成签名。当不可伪造性属性被破坏时，会导致四种形式的破解——完全破解、通用伪造、选择性伪造和存在性伪造。通用伪造允许攻击者伪造所有消息。选择性伪造允许攻击者仅能伪造其选择的某些消息。这给比特币钱包带来了风险，使攻击者能够清空它们。\n\
  \n存在性伪造是攻击者为新消息生成有效签名的能力，但这种方法是无效，因为新消息可能不是有效消息。有效消息是有效交易的哈希。完整性确保签名绑定到某一个交易，而不能连接到另一个交易上。当完整性被破坏时，所声称的付款是不真实的。\n\
  \n\n\n比特币交易所也曾是分布式拒绝服务（DDoS）攻击的目标 [54]。由于它们处理的货币交易量巨大，因此极具价值的攻击目标。在 DDoS 攻击中，攻击者的主要动机是通过过载服务器带宽和耗尽其资源来破坏其提供的服务。攻击者利用系统中的漏洞，被攻破的系统随后由攻击者本人控制，以扩大其僵尸机器军队。被攻破的机器充当主机，进一步利用其他系统的漏洞以获取控制权。所有这些机器构成了从机，它们根据主机的指令执行操作，而主机又根据攻击者的指令对受害者机器发起攻击。受害者机器会被大量的恶意数据包请求淹没。\n\
  \n著名的比特币交易所 BTC China 在 2014 年曾成为大规模 DDoS 攻击的受害者。这是一次 SYN 洪水攻击，持续了九小时，流量水平升至 100\
  \ Gb。攻击者并非使用僵尸机器军队，而是使用由多个被攻破服务器组成的网络来发起攻击。同样，Bitstamp 和 BTC-e 比特币交易所也在 2014 年沦为\
  \ DDoS 攻击受害者，导致交易被迫暂停 48 小时并遭受了巨大损失。\n\n![Image](img/fig9_8.jpg)\n\n**图 8：** DDoS\
  \ 攻击场景。\n\n# 5. 比特币安全防御机制分类\n\n比特币加密货币的日益普及吸引了许多用户。一个用户若想参与比特币系统，必须拥有一个作为比特币客户端节点的比特币钱包。为了确保交易安全，必须对比特币钱包的公私钥采用适当的密钥策略\
  \ [44]。这至关重要，因为一旦用户忘记或遗失这些密钥，与之相关的比特币也将随之丢失。这些密钥机密性的遭到破坏被称为“钱包被盗”，这是由使用受攻破的钱包软件引起的。比特币协议使用椭圆曲线数字签名算法\
  \ (ECDSA) [45] 通过对交易进行数字签名来确保安全。每笔新交易都使用不同的私钥，以保持高度随机性和动态性。为了窃取比特币，攻击者的目标是破解哈希值和签名方案。因此我们可以说，与传统货币系统不同，比特币利用公钥加密来确保安全。这引起了对这些密钥安全存储和管理的关注。\n\
  \n用户有多种钱包选项可选，如热钱包、冷钱包、纸质钱包和脑钱包。如今几乎所有的在线钱包都有移动应用程序，方便用户访问。虽然热钱包更容易受到网络黑客攻击，但冷钱包的实用性不高。更高级的钱包是纸质钱包，将私钥写下并存储在物理安全的空间内。此外还会使用脑钱包，它利用用户的记忆，用户以短语或句子的形式记住密钥。\n\
  \n历史上最大的比特币交易所门头（Mt. Gox）曾被破解，导致价值 4.5 亿美元的比特币丢失。在此事件之后，人们对比特币交易所失去了信任，开始将比特币存在自己的钱包中。使用一种名为\
  \ `provisions` 的技术来存放比特币。如果丢失密钥，没有其他方法恢复资金。钱包的安全性取决于私钥的安全性。用户负责保护密钥安全。如果密钥被盗，比特币将永远消失。这就是为什么人们使用冷钱包来存储比特币。\n\
  \n\n\n生物识别技术在安全和监控领域的应用日益增长。其用量的增加也体现在网上银行、智能手机、云计算和电子商务中。生物识别由两个词组成——bio（生物）和 metric（测量）。“Bio”意味着生命，“metric”意味着测量。生物识别考虑个人内在的行为和生理特征。这包括\
  \ DNA、虹膜识别、指纹、人脸识别和心率识别。生物识别系统会对这些特征进行统计分析，只有当存储的数据与输入的数据充分匹配时，才会宣布匹配成功。声纹是一项新的补充，它考虑了说话时呼出空气的特征。与密码码（pin）、密码、密钥和卡片等传统验证技术相比，生物识别系统具有许多优点。\n\
  \n主要优势是它在生物学上仅属于一个人，因此不会被轻易破解。它易于使用，减轻了记忆 `pin` 和密码的负担。虽然建立生物识别系统的初始成本较高，但由于简化了用户管理，从长期来看，生物识别有助于节省成本。此外，从大量数据中找到正匹配的速度由运行在现有算法上的快速计算机处理，例如基于图像的算法和基于特征点的算法。生物识别系统可以与现有的访问控制系统集成以增强安全级别。\n\
  \n## 5.2 硬件安全模块\n\n硬件安全模块 (`HSM`) 是一种防篡设备，用于存储、处理和管理加密密钥。它的主要职责是保护这些存储的密钥。密钥的处理涉及加密、解密、身份验证和数字签名的生成。它们可以根据应用程序的需求进行定制。现在已经提供了加密虚拟化程序，它们利用云环境提供按需加密服务。\n\
  \n一次性密码 (`OTP`) 是另一种基于硬件解决方案，用户需要输入密码，该密码在用户每次尝试登录账户时都会重新生成。这防止了身份盗窃，因为生成的密码无法再次使用。虽然\
  \ `OTP` 是一种确保强认证的方便方法，但它容易受到网络攻击，如钓鱼、中间人攻击和键盘记录。`OTP` 是使用网格卡和交易密码列表生成的。虽然这种方法很便宜，但也很慢。更快的方法是使用硬件设备生成\
  \ `OTP`。现在使用基于微处理器的智能卡来生成 `OTP`。它们具有处理能力更强、便携性和数据存储能力大的优点。\n\n## 5.3 基于知识的技术\n\n\
  个人识别码 (`PIN`) 是用于验证用户身份的代码。与密码不同，它仅由数字字符组成。早期，`PIN` 仅用于自动取款机 (`ATM`) 交易，但现在它的用途已扩展到解锁门锁和智能手机。用户应避免使用连续的\
  \ `PIN`，如 `1234`、`0000`，并且应避免使用通用信息（如出生日期、车号）作为 `PIN`。较长的 `PIN` 更健壮，因为攻击者需要尝试更多的排列组合组合来破解\
  \ `PIN`。为不同的卡片记住许多 `PIN` 对用户来说是一项麻烦的工作，所以这时密码管理器就派上了用场。它们存储账户记录及其相应的 `PIN`。创建 `PIN`\
  \ 有许多创新方法，例如将字母转换为数字基；例如，`bitcoin` 将翻译为 `2920315914`。\n\n## 5.4 公钥基础设施\n\n某些智能安全卡采用公钥基础设施\
  \ (`PKI`) 来实现强身份验证能力，因此它是基于硬件、基于知识和基于软件的所有技术的结合，如图 10 所示。`PKI` 是一种用于电子金融交易的软件验证方法。用于执行\
  \ `bitcoin` 地址加密、解密以及 `bitcoin` 客户端数字签名的密钥管理和分配由 `PKI` 处理。它向参与节点分发授权证书，将它们识别为传输的\
  \ `bitcoin` 节点。每个证书都包含一个电子指纹。\n\n`PKI` 有两个部分——证书权威和注册机构。证书权威必须根据 `PKI` 框架同步颁发授权数字证书。它检查申请人的背景以防止任何欺诈。证书权威用其私钥对证书签名，并将公钥交给想要认证的实体。注册机构作为辅助认证机构工作。维护一个证书数据库，保存所有的证书请求、已发行和注销证书。`PKI`\
  \ 广泛用于智能卡登录、企业资源计划 (`ERP`) 以及安全套接层 (`SSL`) 中的客户端验证。它基于信任链模型，这是一个中心化模型并需要管理机构，但去中心化工作是\
  \ `bitcoin` 系统的特征。因此，在这里使用的 `PKI` 基于名为“信任网模型”的去中心化信任模型，而不是信任链模型。\n\n## 6 结论\n\n\
  自 2008 年 `bitcoin` 出现以来，其货币价值经历了多次波动，有时飙升，有时崩盘。随着时间的推移，多次安全漏洞实例证明了 `bitcoin` 系统容易受到许多威胁。该系统一直受到\
  \ `DDoS` 攻击，个人钱包和交易所曾被黑客入侵。由于用户的匿名性和 `区块链` 的公开性，它被广泛用于非法活动，如毒品交易和洗钱。然而，在互联网时代，数字货币的重要性不容忽视。目前还没有一种系统性的程序或安全模型来确保数字货币的安全，但建议至少采用双重验证过程。\n\
