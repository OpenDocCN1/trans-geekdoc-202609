  \n\\* 通讯作者：gupta.brij@gmail.com\n\n# 第 8 章 (#08_Contents.xhtml#ch8)\n\n## 基于元启发算法的入侵检测特征选择方法\
  \ (#08_Contents.xhtml#ch8)\n\nAmmar Almomani,^(1) Mohammed Alweshah,^(2,),^(\\*)](#16_Chapter08.xhtml#cor8_1),\
  \ Saleh Al Khalayleh,^(2) Mohammed Al-Refai^(3) and Riyadh Qashi^(4)\n\n### 1. 引言\n\
  \n大多数现代应用程序，尤其是随着数字数据量的增加，已经将特征选择过程视为其工作的重要组成部分。因此，特征选择已应用于许多知名领域，如文本挖掘、模式识别、图像处理和计算机视觉、工业应用、网页、书签分类等\
  \ [1, 2, 3]。\n\n特征选择选择是一个复杂的问题，需要使用人工智能方法来解决。然而，多年来，研究人员一直试图寻找提高该科学领域准确性和效率的最佳方法。科学家们目前正尝试改进特征选择过程的研究点是使用另一种算法结合学习模型。这些可以与学习模型一起使用的算法之一是作为优化器的元启发式技术\
  \ [4]。\n\n近年的研究表明，这些算法能够提供非常准确的结果并改进属性选择过程。特征选择问题中使用了许多元启发式算法，例如模拟退火、蚁群算法、人工蜂群算法、差分进化、遗传算法、和谐搜索以及书中后提到的许多其他算法。尽管这些算法中许多被用于此任务，但研究人员仍在寻找新算法以为该问题提供解决方案。这背后的动力有两点：寻找更少的被选特征，或者提高准确性\
  \ [5]。\n\n此外，特征选择和其他数据挖掘技术的另一个应用领域是网络安全 [6]。由于互联网和网络应用的发展以及全球访问这些用户的增加，国家安全和网络安全现在是许多研究人员的焦点。由于数据挖掘，用户现在可以进行各种关联分析，这同时也引发了隐私担忧。因此，研究人员感兴趣于寻找能够处理恶意软件检测的方法。这些提出的方法与信息增益方法作为特征选择器，以及演化聚类方法作为演化学习分类器有效结合\
  \ [6]。\n\n本文将涉及几个主题。在开始和引言之后，第 2 节阐明了问题描述。然后，第 3 节阐述了特征选择过程的概念，在第 4 节讨论了元启发算法的概念，并回顾了使用这些算法进行特征选择的最重要的现代研究。接下来，在第\
  \ 5 节讨论了结合网络安全的数据挖掘方法。最后，第 6 节和第 7 节分别介绍了讨论和结论。\n\n## 2. 问题陈述\n\n特征选择问题是如何从有时包含大量特征的原始数据集中选择最少数量的特征。随着时间的推移，特征选择的需求现在变得非常重要，以改进并找到解决方案，为许多问题提供清晰的思路\
  \ [7]。例如，为了在大型集中找到特定结论，某些特征与问题相关，而另一些无关。如果选择了所有特征，无疑会影响搜索。为了找到最佳解决方案，有必要选择与问题相关的特征，并避免选择任何可能影响结果的特征，无论它是通过产生不准确的结果还是在分析过程中花费大量时间。图\
  \ 1 显示了属性减少的概念。\n\n```\n![Image]\n```\n**图. 1:** 特征选择的概念。\n\n特征选择过程的目标是尽可能减少特征数量，但不是以牺牲准确性为代价。因此，选择过程的成功取决于两个重要因素：减少属性数量和提高准确率\
  \ [8]。\n\n### 3. 特征选择过程\n\n特征选择是数据挖掘和人工智能领域最重要的过程之一，因为它旨在构建一组训练数据以应用于预测建模。该过程通过选择完整数据集的子集完成，该子集代表了达到数据最大变异所需的最小特征\
  \ [9, 10]。\n\n特征选择过程将消除冗余、无关和误导性特征，以获得代表最佳的最佳子集，如果决策取决于某个特征，则它就是相关的；否则就是无关。如果它与其他特征高度相关，它就是冗余的。这一切通常会提高并增加分类准确率\
  \ [11, 12]。此外，减少特征可以高效地提高模型训练性能，特别是当分类器训练非常昂贵时 [13, 14]。\n\n特征选择过程通过几个阶段达到最佳解决方案\
  \ [15, 16]。图 2 展示了该过程的阶段。\n\n```\n![Image]\n```\n**图. 2:** 特征选择过程的阶段。\n\n\n\n\n\n\
  图 2 展示了特征选择过程的四个阶段，这些包括生成程序、评估函数、停止准则和验证程序。在生成阶段，从完整数据集中选择出一组属性进行评估过程，以确定其是否符合解决方案`[15]`。这一过程可以通过两种方式完成：\n\
  \n• `Forward selection`（正向选择）：在这里逐个地选择特征，开始时生成的子集为空。\n\n• `Backward elimination`（后向淘汰）：在这里先选择所有特征，然后逐个地消除它们。\n\
  \n在评估阶段，使用特定标准来选择与所研究问题相关的所需特征。该标准代表一个阈值，如果特征大于或等于阈值值，则选择该特征并忽略剩余特征。有一组可以作为阈值的指标，包括距离、信息、相关性和一致性`[17]`。停止准则是对评估的控制；它决定了属性子集是否实现了解决问题所需的解决方案。如果它以适当的方式实现了解决问题所需的解决方案，则将其交给分类算法（验证阶段），否则将生成一个新的子集进行评估`[18]`。\n\
  \n在明确特征选择过程的阶段后，该过程的通用算法可以如图 3 所示。\n\n![Image](img/fig8_3.jpg)\n\n**图 3:** 特征选择的通用算法。\n\
  \n## 3.1 特征选择方法\n\n特征选择过程有多种执行方法。没有哪种方法比另一种更好。每种方法都适用于某些问题，因此，研究问题的性质决定了这些方法中的哪一个给出更好的结果。特征选择过程的常用方法有过滤式、包装式、嵌入式和混合式[19]`。\n\
  \n### 3.1.1 过滤方法\n\n过滤方法是一种通过检查和评估数据的内在特性来选择特征的技术，且独立于分类算法`[20]`。使用特定标准来选择适用于所研究问题的所需特征。该标准代表一个阈值，如果特征大于或等于阈值值，则选择该特征并忽略剩余特征`[18]`。有一组可以作为阈值的指标，包括距离、信息、相关性和一致性`[1]`。\n\
  \n过滤方法独立于分类算法，因此它是快速且可扩展的。然而，因为它没有与分类器关联来选择属性，它丢失了一些准确性。有很多使用过滤技术的方法，包括信息增益 (`IG`)、增益率\
  \ (`GR`)`、对称不确定性 (`SU`)`、基于相关性的选择 (`CFS`)`、马尔可夫毯 (`MBF`)`、快速基于相关性的选择 (`FCBF`) 以及最小冗余最大相关性\
  \ (`MRMR`)`。\n\n### 3.1.2 包装方法\n\n包装方法与过滤方法不同，因为它将分类器作为评估的一部分。因此，获得的结果将比过滤方法更准确`[22]`。另一个缺点是使用分类器时会发生过拟合，这将导致更长的时间消耗且无法进行泛化`[23]`。\n\
  \n### 3.1.3 嵌入方法\n\n嵌入方法与包装方法相似，因为它在属性选择期间使用分类器，但其计算成本相对较低`[24]`。\n\n### 3.1.4 混合方法\n\
  \n混合方法顺序使用过滤和包装方法。它基于两个阶段来选择特征。在第一阶段，应用过滤方法[25]`。\n\n## 4 元启发式算法\n\n优化技术是用于解决某些问题的计算程序，这些方法获得的结果最优或次优。优化模型可以分为两种方法——精确方法和近似方法。精确方法确保最优解，而近似方法获得近优解。启发式算法和近似算法是近似方法的两种类型，其中近似算法在接受的时间确保高质量解。\n\
  \n元启发式算法的原理是寻找一种特定的数学技术，通过多次重复尝试实施来连接最佳解决方案`[26, 27]`。\n\n元启发式算法用于多个领域，例如管理行政、统计学以及所有工程和信息学领域。它们能够根据要解决问题的性质创建动态方法，并在可能的解决方案范围内找到问题最合适的解决方案，然后将该解决方案的价值提高到可能的最大程度[28]`。\n\
  \n元启发式算法考虑了搜索过程中收集的信息以引导搜索过程。它们嵌入了算子以逃离局部最优。如上所述，元启发式通常是不完全的方法；它们不保证能找到全局最优解。它们通常找到近似结果[29]`。\n\
  \n在设计元启发式算法时，应该同时考虑探索和开发[30, 31]`：\n\n• `Exploration phase`（探索阶段）：这是向多个站点和新位置的移动，以便发现并了解这些地方的一切。它代表了一个新的学习过程。基于种群的元启发式算法是以探索为导向的。\n\
  \n• `Exploitation phase`（开发阶段）：这是对这些点的利用并充分利用其中现有的资源。基于单点的元启发式算法是以开发为导向的。\n\n\n\n\
  \n\n在本综述中，使用的元启发算法共有 23 种，分别是模拟退火、禁忌搜索、蚁群优化、狮群优化、人工蜂群、蝙蝠算法、蜂算法、二进制生物地理学优化、猫群优化、Coco\
  \ 搜索、协作搜索算法、差异进化、蜻蜓算法、萤火虫算法、鱼群优化、蝗虫优化、引力搜索算法、灰狼优化器、遗传算法、和谐搜索、蛾火优化、粒子群优化、鲸鱼优化算法。本文献综述按算法名称进行安排。\n\
  \n### 4.1 单解元启发算法\n\n这些算法基于为问题创建初始解，然后向邻域区域移动 [28]。它们被称为“轨迹算法”，因为它们在搜索过程中遵循特定的路径，从第一个解开始。在该方法中，只有当结果解优于当前解时才会执行每一步，该过程持续直到获得局部最小值\
  \ [29]。\n\n### 4.1.1 模拟退火\n\n模拟退火（SA）被广泛应用于优化问题。该算法的灵感来自钢铁加工过程 [32]，该过程模拟了材料在热浴中的冷却。该算法关注研究冷却后材料结构的属性，因为这些属性受冷却速度的影响。如果冷却过程缓慢，将形成较大的晶粒；但如果反之，晶体将会产生缺陷。Kirkpatrick\
  \ 等人 (1983) [33] 在优化问题中使用模拟退火，其核心思想是使用该算法寻找可能的解以及最优解的收敛性。\n\nBarbu 等人 (2017) 针对高维数据应用中的特征选择提出了一种学习方案，将退火用于计算机视觉和大数据学习。该方法取得了许多优势，例如更高效地破坏性能，且没有在估计中引入任何意外的偏差。此外，它还解决了受约束优化问题，并在估计和选择方面都具有性能保证。然而，它无法处理目标检测问题\
  \ [34]。\n\n### 4.1.2 禁忌搜索\n\nGlover (1989) 创建了禁忌搜索（TS），作为可用于解决优化问题的局部搜索算法之一。“禁忌”意味着不可触碰或不可访问的禁物；它源自波利尼西亚岛居民使用的语言\
  \ [35]。\n\nWang 等人 (2016) 提出了一种通过二进制帝国主义竞争算法（BICA）与禁忌搜索结合，利用基因表达数据选择属性的混合方法。结果显示，该方法在减少特征的同时保持了高分类准确率\
  \ [36]。\n\nShi 等人 (2018) 提出结合遗传算法和禁忌搜索的混合方法，从高分辨率遥感图像中选择目标。他们旨在通过禁忌搜索改进遗传算法的早收敛问题。所提方法提高了分类准确率，尽管它不能增加减少特征的数量\
  \ [37]。\n\n### 4.2 群体元启发算法\n\n这些算法处理的是一组解，而不是单个解。首先初始化一组解，然后生成另一组解（种群）。在达到特定标准后停止搜索\
  \ [38]。在这些算法中，需要注意的是，达到最优解取决于如何操作种群。大多数与此类算法相关的方法分为进化计算（EC）和群体智能（SI） [29]。\n\n###\
  \ 4.2.1 蚁群算法\n\n蚁群优化（ACO）由 Dorigo 和 Di Caro (1999) 提出。该算法的灵感来自模拟蚂蚁寻找食物。它是依赖经验和错误率来提供可行解的搜索算法之一。因此，它被用于解决计算机耗时较的问题或需要测试所有可能性以达到所需解的问题\
  \ [39]。\n\nSabeena 和 Sarojini (2015) 使用 ACO 和 SVM 分类器对乳腺癌和肝癌两个数据集进行特征减少并提高准确率，从而为每个数据集准确预测目标类别。这种技术表明，所选子集获得了更高的准确率，且特征选择过程的实施通常可以提高分类器的准确性\
  \ [40]。\n\nSharma (2015) 使用蚁群优化对击键动态进行特征选择，使用了 SVM 和 KNN 分器。在这种方法中，结果的准确率不仅得到了维持而且得到了提高，且认证所需的时间减少\
  \ [41]。\n\nWan 等人 (2016) 采用改进的二进制蚁群优化（MBACO）结合遗传算法进行特征选择。利用 SVM 作为分类器，使用该方法有许多优点，例如提高了适应度平均值，且比\
  \ GA、EGA、IGA、BPSO、BACO 和 GA-ACO 更便于降低维度。从 CPU 时间来看，它适用于实时应用，并且与 MBACO 结合时可以克服巨大的计算效率。结果表明，能够在效率和分类准确率之间保持良好的平衡\
  \ [42]。\n\nAghdam 和 Kabiri (2016) 使用 ACO 和最近邻分类器来选择特征，并训练分类器以识别任何类型的攻击。该方法在使用 KDD\
  \ Cup 99 测试数据集时减少了约 88% 的特征，检测错误减少了约 24%。此外，它减少了内存占用和所需的 CPU 时间，除了是数据的更稳健的表示外，对入侵检测非常可靠。然而，该方法尚未用于复杂的分类器以提高其性能。此外，基于载荷的入侵检测特征选择尚未成熟\
  \ [43]。\n\n\n\n\n\nBehrouz Zamani 等人 (2016) 使用 `ACO` 搜索解空间，并计算了由 `ACO` 选择的特征子集与未选择的子集之间的相关性。`ACO`\
  \ 通过构建一个亲和矩阵来构建解，以便从排序后的特征中选择概率函数。在此类方法中，使用了多个分类器来评估性能；同时，所提工作还与许多监督和无监督算法进行了对比\
  \ [46]。\n\n### 4.2.2 蚁狮优化算法\n\nZawbaa 等人 (2015) 旨在通过引入混沌来提高 `ALO` 在特征选择中的性能。这种方法（`CALO`）被应用于生物和医学数据，以展示该方法在复杂数据上的有效性。该方法的优势表现为——`CALO`\
  \ 的准确率优于使用相同测试数据的其他技术。然而，使用该技术存在一些局限性，例如，所选特征子集可能不同，且当转换为另一个分类器时，运行时间可能会增加。因此在实时应用中，该方法可能无法高效工作\
  \ [47]。\n\nEmary 等人 (2016) 通过将 `ALO` 转换为二值 `ALO`，提出了一种基于 `ALO` 二值变体的包装式子集特征选择机制，其使用了两种机制——`V\
  \ 型`函数和`S 型`函数，或者创建一种受蚁狮优化算子启发的等效二进制算子。所提出的机制应用于特征选择问题，并与其他算法进行了对比，如 (`PSO`)、(`GA`)、连续型\
  \ `ALO` 和二值蝙蝠算法 (`BBA`）。结果表明了所提算法（`BALO`）的有效性。此外，`V 型` 显示出优于 `S 型`的结果 [48]。\n\n\
  Mafarja 等人 (2017) 将 `ALO` 作为一种包装式特征选择方法，提出了六种迁移函数，并将其平分为两类——`S 型`和`V 型`。所提出的方法在\
  \ 18 个著名数据集上进行了测试，并将结果与其他方法进行了对比，如 `PSO`、`GSA` 以及两个之前的基于蚁狮优化的算法。结果表明所提算法在准确性方面的有效性\
  \ [49]。\n\n### 4.2.3 人工蜂群\n\nKaraboga (2005) 提出了人工蜂群，其中群中的蜜蜂被分为三个不同的群体——觅蜜蜂、观察蜂和探索蜂，并且每个食物源对应有一只人工蜂。该算法常用于优化领域，并取得了满意的结果\
  \ [50]。[50]。\n\nRagothaman 和 Sarojini (2016) 将 `ABC` 与 `Pareto 优化` 结合以选择非支配特征。使用这种方法有许多优势，包括提高非支配特征的分类准确率，以及确定特征子集中特征的个性和独立性。然而，可以使用聚类和一些统计方法来选择非支配且经过验证的特征子集\
  \ [51]。\n\nSamsani 和 Suma (2016) 提出了一种二值 `ABC` 方法，通过`决策树`分类器、`原生贝叶斯`和`K-近邻`选择甲状腺疾病数据集的特征。在该方法中，三个分类器的准确率水平都显著提高，且\
  \ `ABC` 提供了一个小的特征子集。然而，为了实现这一结果，作者共同实现了三个分类器而非一个 [52]。\n\nGhanem 和 Jantan (2016)\
  \ 采用了多目标 `ABC` 来选择帕累托前沿的特征，通过适应度函数减少冗余特征和误报率。该方法显示了在分类性能方面的良好结果。然而，`ABC` 最初是作为单目标提出的\
  \ [53]。\n\nHancer 等人 (2015) 使用多目标 `ABC` 进行分类选择，通过开发多目标 `ABC` 框架，利用互信息测量来衡量特征与类别标签之间的依赖性。该方法的优势表现为消除无关特征并获得高分类性能。然而，该方法的分类性能有时无法达到高水平，且未与其他方法进行对比。此外，尚未开发一种新的多目标\
  \ `ABC` 来解决大规模特征选择问题 [54]。\n\n### 4.2.4 蝙蝠算法\n\nYang (2010) 提出了蝙蝠算法 (`BA`)，一种基于蝙蝠通过回声在黑暗中定位猎物的想法的算法\
  \ [55]。[55]。\n\nRozlini 等人 (2015) 提出了一种结合了证据理论的 `BA` 增强框架，以寻找最优特征并提高分类性能。该方法有许多优势，例如高分类准确率且特征与分类性能相关。然而，分类过程中的无关特征未知，作者未与\
  \ `KNN` 和 `贝叶斯` 等技术进行对比 [56]。\n\nBansal 和 Sahoo (2015) 提出了一种通过基于 `BA` 的多目标算法研究 `FMS`\
  \ 来解决生成非支配解的方法。该方法的优势体现在分类的最大化和特征向量维度的最小化。然而，该方法必须在大规模数据集上进行测试 [57]。\n\nKumar (2017)\
  \ 提出了一种通过离散余弦变换结合主成分分析 `DCT-PCA` 和 `BA` 使用提取和减少的特征进行人脸识别的方法。与其他特征选择算法（如 (`PSO`)、(`GA`)\
  \ 和布谷鸟搜索 (`CS`)）相比，所提方法具有更少的特征和更高的识别率 [58]。\n\nJeyasingh 和 Veluchamy (2017) 增强了\
  \ `BA` 以开发改进蝙蝠算法 (`MBA`)，以便在乳腺癌诊断数据集 (`WDBC`) 上进行特征选择。这样做是为了实现精确诊断。作者在局部游游中选择随机实例以检测最佳解。获得的最佳解进行排序并应用到随机森林分类器\
  \ (`RF`) 的训练过程中。该方法在分类过程中的准确率高于其他技术（如增益率和相关性特征选择） [59]。\n\n\n\n\n\nEesa 等人 (2015)\
  \ 提出了一种基于 `ID3` 和蜜群算法（Bees Algorithm）的组合模型，用于网络入侵检测系统的特征选择。该方法的优点是与所有特征获得的结果相比，它显示出了高性能。然而，通过控制负责搜索食物恢复可能位置的蜜蜂数量，可以使其效率更高\
  \ [62]。\n\n### 4.2.6 二进制基于生物地理学的优化算法\n\nBoukra (2017) 提出了一种基于改进方法的入侵检测封装式特征选择方法，称为引导自适应二值基于生物地理学的优化算法（`GAB-BBO`）。在该方法中，通过使用新的迁移和变异算子对\
  \ `BBO` 进行改进。此外，还改进了进化状态估计（`ESE`），以通过连续的汉明距离（Hamming distance）和模糊逻辑（fuzzy logic）来适应算法行为。此外，通过在探索阶段调整\
  \ `GAB-BBO` 参数并使用加权局部搜索（`WLS`）来增强开发能力，实现了全局搜索与局部搜索之间的平衡。实验分两个阶段进行：首先，使用基准函数评估 `GAB-BBO`\
  \ 的性能；其次，使用 `Kdd’99` 入侵检测数据集进行实验。在与其他方法进行比较后，结果表明所提方法在特征选择问题中具有提供良好竞争方案的能力 [63]。\n\
  \n### 4.2.7 猫群优化算法\n\nChu 等人 (2006) 提出了猫群优化算法（`CSO`），该算法依赖于观察猫的行为，它包含两个阶段——追踪模式和寻找模式，这两个部分的结合赋予了该算法巨大的力量\
  \ [64]。64 \n\nLin 等人 (2016) 针对特征选择问题对原始的猫群优化算法进行了改进，称为 `ICSO`。作者提出了两种使用词频-逆文档频率（`TF-IDF`）术语增强当前\
  \ `CSO` 的方法。所提出的方法证明比原生的 `CSO` 更准确 [[65]。\n\n### 4.2.8 谷雏搜索算法\n\nYang 和 Deb (2009)\
  \ 受某些谷雏鸟寄生行为的启发，提出了谷雏搜索算法（`CSA`）。该算法在优化领域取得了巨大的成功 [66]。[66] \n\nSujana 等人 (2017)\
  \ [67] 使用 `CS` 开发了并行谷雏搜索优化算法（`PCSO`）并将其应用于特征选择领域。结果显示，与其他经过比较的方法相比，它具有更高的准确性，且在减少尺寸的同时效率更高\
  \ [63]。\n\n### 4.2.9 乌鸦搜索算法\n\nAskarzadeh (2016) 受乌鸦聪明行为的启发提出了乌鸦搜索算法，因为众周知乌鸦会在不同的存储空间中储存过剩食物，以便它们在饥饿时返回这些食物\
  \ [68]。[68]\n\nSayed 等人 (2017) 提出了一种新算法，称为混沌乌鸦搜索算法（`CCSA`），以增强特征选择领域的原生 `CSA`。他们使用了\
  \ 10 个混沌映射来替换原生 `CSO` 的随机移动参数。结果表明（`CCSA`）在最佳和平均适应度值测试中获得了更高的值，并且优于原生 `CSA` [69]。\n\
  \n### 4.2.10 差分进化\n\nStorn 和 Price (1997) 提出了差分进化算法（`DE`）。通过在许多应用中的使用，该算法证明了其高效执行任务的能力，是一种可靠的优化算法。该算法的优势在于在搜索过程中仅使用三个参数\
  \ (166)。然而，它也有一些局限性，如种群停滞和收敛速度慢 [70]。[70]\n\nNoghabi 等人 (2015) 提出了一种 `DE` 的新方法，可以在癌症分类能力的基因选择中产生新的变异和提取。随后，填充空隙位置。在这里，`DE`\
  \ 缺乏开发的问题得到了解决；因此，分类准确性变得更好。然而，由于种群规模和维度对该方法的影响，存在某些问题 [71]。\n\nWang 等人 (2016) 使用\
  \ `DE` 进行数据预处理，以解决以相同分类准确率减少或增加数据的问题。该方法的优点在使用即时选择时减少了数据集的特征。然而，在使用即时选择时，搜索空间中的分类准确性有时会变差。此外，它需要新的解表示以及计算廉价的适应度度量\
  \ [72]。\n\nShahbeig 等人 (2016) 应用二分进化算法算法减少属性并确定海绵的纯度。该方法的优点是减少了随机条件并提高了算法的稳健性 [73]。\n\
  \n### 4.2.11 蜻蜓算法\n\nMirjalili (2016) 提出了受蜻蜓行为启发的 `DA` 算法，应用于多个优化问题。在特征选择领域，Mafarja\
  \ 等 (2017) [74] 使用二值蜻蜓算法（`BDA`）结合 `KNN` 分类器提出了一种封装特征选择方法。结果显示 `BDA` 在搜索特征时能够避免局部最优。与其他方法相比，它显示出优越的性能\
  \ [75]。75]\n\n### 4.2.12 火萤虫算法\n\n火萤虫算法（`FA`）由 Yang (2009) 提出，受火萤虫通过信号吸引其他火萤虫行为的启发，目前广泛应用于优化问题。Zhang\
  \ 等人 (2017) [76] 通过提出基于返回成本的二值火萤虫算法（`RC-BBFA`）改进了 `FA` 在特征选择领域的能力。在 10 个数据集上应用该方法后，结果证明\
  \ `RC-BBFA` 在保持高分类率的同时减少了属性数量 [77, 78]。\n\n### 4.2.13 鱼群优化算法\n\nLi (2002) 提出了鱼群优化算法（`FSO`），以表达鱼在生命周期中觅食、迁移和其他集体行为中的智能\
  \ [79]。[79]\n\nManikandan 和 Kalpana (2017) 增强了原生 `FSO` 的人工鱼群优化（`AFSO`）技术，并结合分类回归树（`CART`）来提高特征选择过程的准确性。结果表明\
  \ `AFSO` 在测量、准确率、精确率和召回率方面表现更好 [80]。\n\n\n\n\n\nMafarja 等人 (2017) 通过将进化种群动力学 (`EPD`)\
  \ 用于 `GOA`，改进了基础 `GOA` 在特征选择问题中的效能。在 22 个基准数据集上应用该方法后，结果和分析表明，与所有混合方法相比，该方法在分类准确率、所选特征数量、消耗的\
  \ CPU 时间以及收敛行为方面改进了特征选择过程 [82]。\n\n### 4.2.15 引力搜索算法\n\nRashedi 等人 (2009) 引入了引力搜索算法\
  \ (`GSA`) 作为基于牛顿物理定律引力法则的优化技术之一，其中轻质量物体会被大质量物体吸引 [83]。\n\nNagpal 等人 (2017) 使用 `GSA`\
  \ 实现了一种基于包装的方法，利用 `k-最近邻分类器` 在医学数据集进行特征选择。结果显示 `GSA` 能够高效减少属性，平均减少率为 66%。此外，与`粒子群优化`和`遗传算法`相比，`GSA`\
  \ 在分类准确率上取得了更好的性能 [84]。\n\nBostani 和 Sheikhan (2017) 提出了一种基于互信息 (`MI`) 和二值引力搜索算法\
  \ (`BGSA`) 的混合过滤与包装方法，用于减少入侵检测系统的属性。将 `MI-BGSA` 方法与其他包装和过滤方法（如 `BGSA`、`BPSO`、`ReliefF`\
  \ 和卡方检验）进行了比较。结果显示 `MI-BGSA` 提高了分类准确率并减少了与目标类最相关的属性 [85]。\n\n### 4.2.16 遗传算法\n\n\
  遗传算法 (`GA`) 由 John Holland 及其密歇根大学的学生在 20 世纪 70 年代提出 [86]。遗传算法是在针对特定设计的可用方案集中搜索最佳方案的重要技术。基因操纵通过连续的育种过程传递优化优势并强化这些特征。这些特征具有最强的进入育种并通过重复遗传循环产生最优世代的能力；质量逐渐提高\
  \ [87]。\n\nCerrada 等人 (2015) 使用 `GA` 设计了多阶段故障诊断模型，在每个阶段从候选特征子集中选择最佳特征。研究表明，`GA`\
  \ 仍然是优化搜索过程的良好工具，可以通过新方法实现以提高其性能。然而，该方法导致了对齿轮故障诊断相关条件参数物理意义的研究 [88]。\n\nHong 等人\
  \ (2015) 使用 `GA` 从语料库中选择了一组优化特征，以最小化计算复杂度并提高分类性能。在这种方法中，当使用所有特征时，分类性能优于使用 `FSGA`\
  \ 的情况（召回率除外）。此外，分类时间也可以缩短，并且能够胜实时数据处理。然而，作者建议使用并行 `GA` 来提高其重复性能，并对该算法针对重复特征选择和适应度函数进行了改进。此外，该方法无法处理大数据环境\
  \ [89]。\n\nSoufan 等人 (2015) 展示了 `DWFS` ——一种 Web 工具，在包装方法上使用并行遗传算法，并与随机搜索算法结合以增强特征选择过程。使用这种技术的优点体现在保持分类性能的同时减少特征数量的能力。然而，它在处理复杂的生物和生物医学数据或大型问题时有时是不可行的\
  \ [90]。\n\nChen 等人 (2016) 使用了一种基于 `CGPGA` 的混合模型，结合了粗粒并行遗传算法和 `SVM` 来解决分类器的特征选择问题。使用这种技术有许多优势，例如最小化所选特征子集的大小、支持向量的数量和训练时间。此外，它优化了\
  \ `SVM` 模型参数，并以高效的方式正确获得了判别特征子集。此外，它使底层保持支持向量比例。然而，它并没有通过优化指令最小化构建的 `SVM` 模型数量。因此，如果问题变得很大，它的工作效率就会低下\
  \ [91]。\n\nAalaei 等人 (2016) 使用遗传算法和 `PS-classifier` 通过包装方法为乳腺癌诊断选择有效特征。这种技术提高了分类器的准确性、特异性和敏感性\
  \ [92]。\n\n### 4.2.17 灰狼优化器\n\nMirjalili 和 Lewis (2014) 提出了灰狼优化器 (`GWO`)，其中灰狼的捕食机制通过四种狼的领导等级进行模拟——它们的名称分别为\
  \ `alpha`、`beta`、`delta` 和 `omega`。优化过程通过三个步骤完成：寻找猎物、围捕猎物和攻击猎物 [93]。\n\nEmary 等人\
  \ (2016) 提出了 `GWO` 的二值版本用于包装特征选择。原始 `GWO` 通过应用两种机制得到了增强：第一种通过对三个最优方案进行交叉来寻找新位置；第二种机制用于更新灰狼的位置。目前的工作与\
  \ `PSO` 和 `GA` 进行了比较。结果显示了 `BGWA` 在 18 个数据集上的效率 [94]。\n\n### 4.2.18 和谐搜索\n\nGeem\
  \ 等人 (2001) 提出了和谐搜索 (`HS`)，它不被认为是受自然启发的算法，但它模拟了根据特定标准达到理想状态的过程。`HS` 在控制、信号处理和机械工程等领域取得了巨大成功\
  \ [95]。\n\nBagyamathi 和 Inbarani (2015) 使用粗糙集理论与改进和谐搜索算法 (`IHSRRA`) 的混合方法对蛋白质序列进行分类，并通过移除无关特征减少数据集。研究表明，该方法有助于解决高维度问题，且分类非常准确。此外，它对于预测蛋白质功能非常有用。结果，本文证明了基于\
  \ `HS` 和粗糙集 (`RST`) 方法的有效性和实用性 [96]。\n\n### 4.2.19 蛾火虫优化\n\nMirjalili (2015) 提出了蛾火虫优化\
  \ (`MFO`)，其灵感源于自然界中蛾类的运动，蛾类在晚上以相对于月亮的固定角度飞行，并长距离直线飞行。这种模拟方法被有效地用于优化问题 [97]。\n\n\
  Zawbaa 等人 (2016) 提出了一种新机制，通过包装方法应用蛾火虫优化 (`MFO`) 来解决特征选择问题并获得最优子集。该算法与其他特征选择算法（如基于著名数据集的\
  \ `GA` 和 `PSO`）进行了比较。该算法的证明高于其他特征选择 [98]。\n\n\n\n\n\nEberhart 和 Kennedy (1995) 提出了`Particle\
  \ Swarm Optimization` (`PSO`），这是一种鸟类群集行为的模拟。该算法在优化领域的应用已取得非常准确 `[99]`。\n\nWu (2015)\
  \ 为文本分类实现了两轮特征选择，结合了`filter`（过滤）和`wrapper`（封装）两种方法。`filter` 方法是`Information Gain`\
  \ (`IG`）方法，而`wrapper` 方法是基于`5NN` 和 `Rocchio` 的 `BPSO`。这种技术的优势在于减少了特征数量并提高了分类性能。此外，它的计算时间非常短。另一方面，它无法在分布式系统中高效地运行\
  \ `[100]`。\n\nButler-Yeoman, Xue 等人 (2015) 提出了一种寻找目标大小的方法，通过开发顺序随机目标大小优化方法，使用基于\
  \ `wrapper` 特征选择方法的 `PSO` 来粗略指示特征子集的最小大小。该方法的优点是减少了特征数量，并实现了与使用所有特征或标准 `PSO` 相似甚至更好的分类效果。然而，对随机特征选择算法的一致性分析存在问题，且相对简单并缺乏理论证明\
  \ `[101]`。\n\nAghdam 和 Heidari (2015) 将 `PSO` 应用于词袋模型的文本特征，在该模型中，文档被视为单词或短语的集合，特征向量中的每个位置对应于文档中的给定术语。使用这种方法的优势之一是在问题空间上具有强大的搜索能力，可以高效地找到最小特征子集。此外，可以在对原始数据集没有任何先验知识的情况下选择特征\
  \ `[102]`。\n\nJavidi 和 Emami (2016) 引入了一种组合搜索方法，可以利用 `PSO` 在发现新区域和局部搜索之间取得平衡。`CBPSOL`\
  \ 在问题空间中具有强大的搜索能力，能够在真实和高维合成数据集中高效地找到最小特征子集。但如果在 `CBPSOL` 之前使用基于 `filter` 的方法，则无法表现出高性能\
  \ `[103]`。\n\n### 4.2.21 鲸优化算法\n\nMirjalili 和 Lewis (2016) 提出了这种算法，它模拟了座尾鲸在海中的捕鱼过程\
  \ `[104]`。`[104]`\n\nSharawi, Zawbaa 等人 (2017) 了一种特征选择方法，通过使用基于 `wrapper` 的 `Whale\
  \ Optimization Algorithm` (`WOA`) 来获得最优特征子集。通过 16 个数据集将该方法与其他特征选择算法（如 `PSO` 和 `GA`）对比，结果表明\
  \ `WOA` 比其他算法更高的精度 `[105]`。\n\nMafarja 和 Mirjalili (2017) 提出了两种基于 `WOA` 的混合技术。第一种技术使用了\
  \ `Simulated Annealing` (`SA`)。第二种技术使用了 `GA`。结果显示混合方法改进了特征选择的性能。\n\nMafarja 和 Mirjalili\
  \ 还提出了另一个使用 `crossover`（交叉）和 `mutation`（变异）算子的 `WOA` 版本。结果显示这种方法在检测复杂模式方面更为有效。\n\
  \n在回顾了最重要的工作后，得出了以下优势：\n\n- 处理复杂特征和优化的能力。\n- 处理真实世界数据集和优化的能力。\n- 提供快速收敛率的能力。\n-\
  \ 实现高精度结果的能力。\n- 计算成本低。\n- 为优化问题寻找全局最优解的能力。\n- 与其他算法混合的能力。\n- 通过分类保护数据免受滥用的能力。\n\
  \n然而，这些算法具有处理非常问题的能力，但结果取决于数据的性质和程度。\n\n## 5. 带网络安全的数据挖掘方法\n\n本部分讨论了数据挖掘技术对网络安全的重要性，并提供了简要概述。目前，该领域吸引了许多研究者的关注，以寻找最佳保护方法。最重要的数据挖掘技术是分类和聚类。还讨论了作为元启发式算法的遗传算法。\n\
  \nThuraisingham 等人 (2008) 介绍了一项基于数据挖掘技术的安全应用研究，例如链路分析和关联规则挖掘。这些静态和动态分析通过挖掘网络流量和数据流，提供了一个检测新威胁的持续过程，这有助于提高高效率\
  \ `[108]`。\n\nKshirsagar 等人 (2012) 提出了几种基于遗传算法和数据挖掘技术的入侵检测系统模型 `[109]`。该研究关注保护数据免受滥用的签名方法，该过程需要在入侵检测系统中设置并存储特殊规则，以便通过匹配过程识别攻击。\n\
  \nHarshna 和 Navneet Kaur (2014) 将模糊逻辑与遗传算法用于入侵检测系统，通过从审计数据中选择一组可用特征集，在检测异常方面生成更灵活的模式。实验在数值数据集上执行。结果显示了模糊逻辑与遗传算法结合在检测真实威胁方面的效率。\n\
  \n\n\n\n\nAl-Qurishi 等人 (2017) 开发了一种方法，通过使用集中化管理协议来暴露社交网络中的恶意用户和伪造软件，以防止此类损害并在社交网络中提供一种安全的通信手段。该协议为这些网络的所有用户设置了路障，并确保通信仅限于人类。因此，它能够有效的方式识别机器人账户\
  \ [111]]。\n\n此外，在网络传输图像编码领域，四元数傅里叶变换（QFST）方法被用于 [112] 对图像进行加密，并提高了安全性和链路退化性能。加密后的三维图像在二维基础上进行加密。这种所提议的方法证明了用于保持图像内容机密的加密方法的有效性和正确性。\n\
  \n在物联网（IOT）概念方面，风险检测的安全领域近年来已成为研究领域的一个重要空间。物联网用户在云端存储了大量敏感数据，导致安全忧虑可能会增加，这些数据必须保护免受损害或被非法访问。互联网用户对存储在电子云中的敏感数据进行加密的敏感数据加密过程，是处理这些安全忧虑的解决方案，所有研究预计在未来几年内，所有为客户提供互联网服务的数据公司将受到加密服务的保护\
  \ [113]]。\n\n公司提供的物联网服务越来越多地采用云计算中的数据安全。敏感数据需要在产生之初、在离开云端或进入云端之前就受到保护。这需要正确的数据保护策略——以数据为中心的云端方法\
  \ [114]]，该方法适用于并适应多种不同的系统。图 4 显示了从设备或云端发送之前的数据加密。\n\n![图像](img/fig8_4.jpg)\n\n**图\
  \ 4：** 物联网中的数据加密。\n\n这一研究方向吸引了许多研究者的关注。最近，Tewari 和 Gupta (2017) 在物联网环境中提出了一种用于设备与服务器之间相互认证的新机制。该机制取决于椭圆曲线加密（ECC）的编码方法\
  \ [115]，通过结果表明，该方法是抵抗网络任何潜在攻击的有效解决方案。在另一篇论文 [116] 中，使用了 NS 仿真技术设计了无线视频监控系统，确保了频率频率分布并最大限度地减少了网络传输中的视频失真。\n\
  \nMemos 等人 (2017) 通过分析与网络交换媒体的安全和保护相关的最重要的研究，描述了物联网面临的安全挑战。此外，还对未来可能用于实现智慧城市概念的大多数算法进行了研究，例如基于媒体的监控系统（EAMSuS）和高效率视频编码（HEVC）\
  \ [117]]。\n\n应用安全技术并保持机密性的另一个领域是移动云计算系统。Zkik 等人 (2017) 提出了一种加密同质信息的方案，以保护信息的机密性并进行远程检索。结果证明，在实施所提方法后，发现该方法在该领域具有健壮性、高效性并具备安全分析的能力\
  \ [118]]。\n\nIbtihal 和 Hassan (2017) 使用了一种新方法通过使用获取安全结构。通过 `openstack` 和 `paillier`，此外还使用了\
  \ `dwt` 来实现数据加密，这种方法在数据从设备或云端发送之前就进行了加密。\n\n# 6 讨论\n\n正如文中所言，云计算中的物联网公司越来越多地采用数据安全。敏感数据需要在其产生之初、在离开云端或进入云端之前就受到保护。安全担忧可能会增加，这些数据必须保护免受损害或被非法访问。数据加密的这一研究方面吸引了许多研究者的关注。最近，Tewari\
  \ 和 Gupta (2017) 在物联网环境中提出了一种用于设备与服务器之间相互认证的新机制。该机制依赖于椭圆曲线加密（ECC）方法，结果表明该方法是有效的解决方案。\n\
  \n# 7 结论\n\n本研究的主要目标是提出一种新方法来优化特征选择。元启发算法在搜索过程中收集信息并引导搜索。元启发算法已被广泛应用于特征选择，由于它们在这一领域具有能力。在实施所提方法后，发现其具有健壮性、高效性并能够进行安全分析。此外，建议未来的研究可以改进网络安全领域的特征选择问题。\n\
