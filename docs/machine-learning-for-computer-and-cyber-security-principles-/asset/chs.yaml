  \n### 6.4 人工神经网络（ANNs）\n人工神经网络（ANNs）表示为有向图，其中节点表示神经元，边表示突触。前馈网络（FFNs）和循环神经网络（RNN）是两种主要类型。多层感知器（MLP）是\
  \ FFN 的子集，由三层或更多层组成。\n\n\n\n\n在 MLP 的输出层中，带有 `softmax` 函数 `SF(Z*)` 的三层网络等同于多分类逻辑回归。具有\
  \ `l` 个隐藏层的 MLP 网络通常可以定义为：\n\n| *H**I*(*x*) = *H**I**l*)))) || (7) |\n\n## 6.5 损失函数、最下降或梯度下降与反向传播\n\
  \n上述对前馈神经网络（FFNs）的描述表明，MLP 是参数化函数。这需要一种方法寻找最优模型参数以获得良好的预测和结论。其中，定义损失函数是第一步。损失函数\
  \ `loss(pr, tr)` 以预测值 (`pr`) 和目标值 (`tr`) 作为输入，给出预测值 (`pr`) 与目标值 (`tr`) 之间的不一致性。常用的损失函数之一是欧几里得距离：\n\
  \n| *d*(*t**r*,*p**r*)=||*t**r*−*p**r*||[2]² || (8) |\n\n负对数概率用于多分类问题，其中 `tr` 是目标类别，`p(pr)`\
  \ 是神经网络产生的概率分布：\n\n| *d*(*t**r*, *p*(*p**r*)) = −�log��*p*(*p**r*)[*t**r*] || (9)\
  \ |\n\n本文进行的若干实验都是多分类问题。然而，在训练过程中，网络接收的是一组修正后的输入输出集 `inop` = (*p*[1], *q*[1]), (*p*[2],\
  \ *q*[2]), …, (*p[n], q[n]*)。然后我们的目标是降低如下所示的损失平均值：\n\n| $loss(p\\_{n},q\\_{n}) =\
  \ \\frac{1}{n}{\\\\sum\\limits\\_{i = 1}^{n}{d(q\\_{i},f(p\\_{i}))}}$ || (10) |\n\
  \n这种类型的损失函数将在后续讨论的深度学习算法中使用。\n\n为了在神经网络中获得更好的结果，必须最小化损失函数。损失函数的定义如下：\n\n| $Train\\\
  _{inop}(\\theta) \\equiv J\\_{inop}(\\theta) = \\frac{1}{n}{\\\\sum\\limits\\_{i\
  \ = 1}^{n}{d(q\\_{i},f\\_{\\theta}(p\\_{i}))}}$ || (11) |\n\n其中 `θ` = (*w*[1], *b*[1],\
  \ …, *w[k], b[k]*)\n\n我们的目标是通过选择合适的 `θ` ∈ ℝ^(d) 来最小化损失函数 `Jinop`。这涉及在代价 `inop` 下估估计\
  \ `f[θ]` (`p[i]`) 和 `∇f[θ]` (`p[i]`)。\n\n| $\\min\\limits_{\\theta}J(\\theta)$ ||\
  \ (12) |\n\n为了做到这一点，我们可以遵循各种优化技术；梯度下降是其中一种。它是最常用的方法之一，并且本身被认为是优化损失函数的良好方法。通过以下规则重复计算梯度并更新参数，对整个数据集执行单次更新：\n\
  \n| θ^new = θold−α∇J(θ) || (13) |\n\n`α` 被称为学习率。为了找到 J 的导数，采用了反向传播或误差后传播算法。\n\n\
  ### 6.6 循环网络 (RNN)\n\n循环网络 (RNN) 与多层感知器 (MLP) 非常相似。唯一的区别是在 RNN 中，隐藏层中的单元包含自递归连接。这有助于将上一个输入“前向传递”的隐藏层输出与下一个输入拼接，并共同作为隐藏层的输入\
  \ [4]。这在机器翻译、语言建模等领域的工智能（AI）任务中显示了卓越性能。通常，RNN 接收任意长度的输入序列 `x[T]`，并在转移函数 `tf` 的帮助下递归映射为隐藏状态向量\
  \ `hi[T]`。每个时间步 `t` 的隐藏状态向量通过当前输入序列 `x[t]` 和上一个隐藏状态向量 `hi[t-1]` 的转移函数 `tf` 计算，如下所示：\n\
  \n| hi_{t} = \\begin{matrix} 0 & t = 0 \\\\ tf(hi_{t - 1},x_{t}) & {otherwise}\\\
  \\end{matrix} || (14) |\n\n其中 `tf` 由 `x[t]` 和 `h[t]` 的仿变换加上逐元素非线性组成。这种类型的转移函数 `tf`\
  \ 在训练长序列时会导致梯度消失和爆炸问题；梯度向量随时间步增长或衰减 [20]。长短期记忆 (LSTM) 是 RNN 的变体，它有一个被称为“记忆块”的特殊单元。记忆块包含一个记忆单元、一组输入门和输出门。记忆单元的状态由输入输出门控制。遗忘门\
  \ [21] 和孔径连接 [22] 是 LSTM 中的两个重要单元。门执行记忆单元的遗忘或重置操作，孔径连接有助于学习输出的精度。\n\n通常，记忆块在每个时间步\
  \ `t` 包含输入门 `it`、遗忘门 `ft`、输出门 `ot`、记忆单元 `m` 和隐藏状态向量 `hi`。记忆块的转移函数定义如下：\n\n| it[t]\
  \ = σ(w[it]x[t] + P[it]hi[t-1] + Q[it]m[t-1] + b[it]) || (15) |\n\n| ft[t] = σ(w[ft]x[t]\
  \ + P[ft]hi[t-1] + Q[ft]m[t-1] + b[ft]) || (16) |\n\n| ot[t] = σ(w[ot]x[t] + P[ot]hi[t-1]\
  \ + Q[ot]m[t-1] + b[ot]) || (17) |\n\n| m1[t] = tanh(w[mt]x[t] + P[m]hi[t-1] + b[m])\
  \ || (18) |\n\n| m[t] = it[t] ⊙ m1[t] || (19) |\n\n| hi[t] = ot[t] ⊙ tanh(m[t])\
  \ || (20) |\n\n\n\n\n\n对于每个域名名/URL `du`，我们构建一个一个域名名/URL 矩阵 `DU` ∈ ℝ(`d`×|`du`|)，其中每一列\
  \ `i` 代表域名名/URL 中对应位置 `i` 处的字符嵌入矩阵 `c`。卷积神经网络 (CNN) 使用 `convolution1d`、`pooling1d`\
  \ 操作对输入矩阵 `DU` 应用一系列变换，以从低层词嵌入中学习域名名/URL 中每个字符的最优特征表示。这种优特征表示捕捉了更高层次的语义概念。\n\n`Convolution1d`\
  \ 专注于学习域名名/URL 内部发现的判别性字符序列。这些序列在整个训练语料库中非常常见。\n\n`convolution1D` 层对域名名/URL 上的长度为\
  \ `h` 的滑动窗口应用一组 `m` 个滤波器操作。令 `DU[[i:i+h]]` 表示字符向量 `DU[i]` 到 `DU[i+h]` 的拼接。对于给定的滤波器\
  \ `F` ∈ ℝ(`d`×`h`)，新特征 `f[i]` 的估计值为：\n\n| $f_{i}: := {\\sum\\limits_{k,j}}{(DU_{[\
  \ i:i + h]})}_{k,j}.F_{k,j}$ | (21) |\n| --- | --- |\n\n新特征向量 `f[i]` ∈ R(`l`–`h`+1)\
  \ 通过拼接域名名/URL 中所有可能的向量形成。然后，将来自所有 `m` 个滤波器的向量 `f[i]` 聚合形成特征图矩阵 `F` ∈ R(`m`×(`n`–`h`+1))。\n\
  \n`Convolutional1D` 层的输出通过非线性激活函数 `ReLU` 传递到池化层。`Pooling 1 D` 是一种下采样操作。它在固定的不重叠间隔上取最大元素，聚合并形成特征图矩阵\
  \ $F_{\\text{pooled}} \\in^{m \\times \\frac{n - h + 1}{s}}$，其中 `s` 是每个间隔的长度。\n\n\
  通常，CNN 网络的倒数第二层是全连接层。它与前一层中的所有激活值连接，并在二分类中包含 `sigmoid` 非线性激活函数，在多分类中包含 `softmax`\
  \ 非线性激活函数。\n\n最大池化操作的输出也可以传递到递归结构，如 RNN、LSTM、GRU 和 IRNN 网络，以捕捉序列信息，定义如下：\n\n| `FM`\
  \  = `CNN(x[t])` | (22) |\n| --- | --- |\n\n其中，CNN 由 `convolution1D` 和 `max-pooling1D`\
  \ 层组成。特征图 `FM` 被传递到递归结构以学习长期时间依赖关系；`x[t]` 表示带有类别标签的输入特征向量。\n\n## 7. 软件框架\n\n目前已经建立了许多强大且易用的软件框架，以促进深度学习架构的实现。针对这些在设备（CPU\
  \ 和 GPU）上执行的各种深度学习架构的对比研究已从扩展性、硬件利用率和速度方面进行了讨论 [30]。本研究的深度学习架构使用最新的软件框架——Google\
  \ 开源数据流引擎 TensorFlow 进行了实验 [31]。TensorFlow 允许程序员构建统一的数据流图来构建数值系统。所有 RNN 方法的实验均使用\
  \ BPTT 技术进行训练。\n\n## 8. Deep-DGA-Detect：深度学习应用于基于 DGA 的大规模恶意软件检测\n\n### 8.1 引言\n\
  \n如今，互联网已成为最大且最重要的全球通信媒体和基础设施。它连接了数十亿个枢纽，使它们能够相互通信。域名系统 (DNS)（服务或服务器）在互联网的运行中具有主导地位。DNS\
  \ 是一个分布式、可扩展、可靠、动态且全球可用的数据库，将域名映射到 IP 地址，反之亦然。DNS 的这些特性为网络犯罪提供了托管恶意内容或管理钓鱼网站以窃取用户信息的机会\
  \ [41]。如今，此类威胁的行为和操作正在经历关键的变化和进展。一种广泛使用的攻击策略是利用机器人僵尸网络 [42]。僵尸网络被大量用于恶意目的，例如分布式拒绝服务\
  \ (DDoS)攻击、大规模垃圾邮件活动、身份盗窃、流量嗅、键盘记录、传播新恶意软件等。僵尸网络是一组受控的主机，由僵尸主通过向命令与控制服务器 (C2C) 发布命令或指令进行控制。黑名单和汇洞是安全组织阻止\
  \ C2C 与僵尸主之间通信点的最常用方法 [43, 44]。黑名单被认为是一项艰巨的任务，主要因为数据库必须定期手动更新。此外，僵尸网络不断改进，规避检测的新方法也在不断产生。攻击者规避黑名单的广泛使用方法之一是\
  \ DNS 敏捷性或波动方法（fluxing），这大部分是 IP 泛或域名泛服务 [45]。在本文中，仅研究了域名泛服务。域名泛服务使用域名生成算法 (DGA)。它在大规模上伪随机生成域名，并尝试使用尝试法联系其\
  \ C2C 服务器。要成功击败攻击，所有域名在生效之前必须被列入黑名单或汇洞化。汇洞意味着对恶意软件及其 DGA 家族进行逆向工程以找到种子。种子是数字、字母、日期/时间等的并集。使用种子，可以通过注册即将到来的域名并将其作为冒充\
  \ C2C 服务器来劫持相应的僵尸网络。直观上，对手必须使用更新的种子重新部署僵尸网络，以恢复其功能。随着动态生成域名程度的增加，这种防御变得日益复杂。总的来说，只有当僵尸网络活动使用的算法和种子均已知时，黑名单和汇洞方法才有效。\n\
  \n针对 DGA 生成域名的大量报告中黑名单的有效性，[43] 进行了详细研究（此处原文引用重复）。该研究考虑了公共黑名单和私有黑名单。与作者包含在任何黑名单中的\
  \ DGA 相比，公共黑名单的 DGA 报告少得多。私有黑名单进展良好，但它们在不同恶意软件家族中的性能从 0% 到 99.5% 不等。该研究声称黑名单是必要的。它们可以作为初始护盾并提供足够的保护水平；必须结合另一种方法。\n\
  \n\n\n\n\n创建一个 DGA 分类器来攻击基于 DGA 的恶意软件是另一种最常用的方法。该分类器可以留存在网络中，嗅探 DNS 请求并寻找 DGA。每当\
  \ DGA 分类器检测到 DGA 时，它会通知网络管理员或其他自动化工具，以进一步检查 DGA 的根源。以往的 DGA 分析和检测工作可以分为追溯检测和实时检测。追溯检测是一种反应性系统，因为它通过聚类方法将大量的域名集分为若干类，旨在产生每个类别的统计属性\
  \ [[46, 47, 48]]。Pleiades [[46]] 是一个能够在不逆向工程机器人恶意软件的情况下检测基于 DGA 域名的主要系统。这包括 DGA\
  \ 发现、DGA 分类和 C&C 检测模块。DGA 发现模块根据 `NXDomains` 检测并聚类僵尸网络查询。DGA 分类模块使用交替决策树学习方法来发现和区分\
  \ `NXDomain` 簇，而 C&C 检测则使用隐马尔可夫模型，每个 DGA 家族使用一个独特的模型。通常，在训练期间，会创建一个模型，并根据统计测试（例如\
  \ `Kullback-Leibler divergence`）对 DGAs 进行分类。这种方法主要基于对大量流量的分析，因此 DGA 在被检测之前可能已经建立了通信。此外，这些类型的检测系统利用上下文信息（如\
  \ `NXDomains`、`HTTP headers` 和被动 DNS）来进一步提高 DGA 的检测率。这类 DGA 检测系统无法用于实时安全应用中的实时检测和预防\
  \ [[49]]。此外，在许多实时应用（例如，端点检测与响应）中，使用上下文信息来检测 DGA 可能并不是一种合适的方法。由于由于原因，端点检测与响应系统对内存、网络和处理的使用有着不可妥协的要求。\n\
  \n实时检测方法旨在仅通过域名对每个域名进行检测和分类（分为 DGA 生成或良性），以阻止任何 C2C 服务器通信。与追溯方法相比，这通常被认为是复杂的，因为在实时部署系统中实现最优性能是困难的。在\
  \ [[49]] 中，追溯方法的性能非常低。以前的许多实时方法大多基于机器学习。经典的基于机器学习的 DGA 检测和分类依赖于特征工程阶段，例如字符串长度、元音与辅音的比例、熵等。因此，它们的性能隐含地依赖于领域特定特征。领域特定特征的提取并不总是可行，主要由于数据量和可访问特征的限制。深度学习是在访问大数据时获取最佳特征表示的一种可行方法。此外，特征工程方法很容易被绕过。[[46]]首次提出了基于隐马尔可夫模型（`HMM`）的实时\
  \ DGA 检测系统，但性能非常糟糕。与经典机器学习中的特征工程机制不同，深度学习架构将原始域名作为输入，每个隐藏层中的非线性有助于学习更复杂、更抽象的特征表示。该子系统的目标设定如下：\n\
  \n* 作者引入了 `Deep-DGA-Detect`，这是一个可扩展的基于 DGA 的僵尸网络识别框架，能够高效分析网络中的 DNS 流量，检测并告警 DGA\
  \ 生成域的存在。\n* 在检测 DGA 生成域名并将其分类到相应 DGA 家族的背景下，展示了各种经典机器学习和深度学习架构在大型标记数据集上的性能。这些数据集由来自\
  \ `Alexa`、`OpenDNS` 和 40 个已知 DGA 家族的算法生成域名和良性域名组成 [[33]]。\n* 在包含来自私有源和公共源的算法生成域名和良性域名的大型标记数据集上，执行了完整的\
  \ `Deep-DGA-Detect` 实现。\n\n### 8.2 \n\n为了大规模训练深度学习架构，使用了 `TensorFlow` 框架¹ 配合 `Apache\
  \ Spark`²。在 `Hadoop`³ 之上使用 `TensorFlow` 和 `Apache Spark` 可以对大数据进行更高效、准确的分析。\n\n\
