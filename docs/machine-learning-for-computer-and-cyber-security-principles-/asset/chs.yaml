  \ 表 1 中的特征描述，该模型本应正确预测出 13% 的“否”肺癌病例，尽管实际情况并非如此。\n\n**表 3：** 基于肺癌组预测的两个分类器（`ID3`\
  \ 和 `CHAID`）的性能。\n\n![Image](img/tab10_3.jpg)\n\n图 8 和 图 9 显示 `ID3` 和 `CHAID` 对肺癌组和非癌症组的预测分别为\
