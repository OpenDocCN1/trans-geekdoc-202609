  \n### 使用 F 检验评估\n为了验证检测到的 H5-XSS 数量（真阳性 `TP`）低于注入的 H5-XSS 攻击向量数量；我们利用了假设的概念。我们假设了以下两个假设：\n\
  \n**零假设 (H[0]):** `JS-SANSPF` 正确检测了超过 78% 的攻击向量（`p > 0.78`）。\n\n**备择假设 (H[A]):**\
  \ `JS-SANSPF` 正确检测的攻击向量不超过 78%（`p <= 0.78`）。\n\nP 检验的假设如下：\n\n1. 随机数据：样本是随机收集的。\n\
  2. 10% 节点：样本量小于攻击向量总体的 10%。\n3. 必须至少有 10 次成功和 10 次失败（`np > 10` 和 `nq > 10`）：`np\
  \ = 50*0.78 = 39 > 10`，且 `nq = 50*0.22 = 11 > 10`。\n\n由于三个假设均已满足，我们可以考虑显著性水平（`α\
