  \ `DTH-AODV` 接收的数据量与无攻击的正常 `AODV` 相当。\n\n图. 10 中的折线图显示了攻击以及检测防御机制对路由负载的影响。如图. 10\
  \ 中的折线所示，在存在黑洞的情况下，路由负载非常高，但通过基于提出的 `DTH-AODV` 的检测防御机制，路由负载几乎与正常 `AODV` 相等。在路由负载方面，正常\
  \ `AODV` 和提出的 `DTH-AODV` 的性能几乎相等。\n\n图. 11 中的折线图显示了攻击以及检测防御机制对 MAC 负载的影响。如折线所示，在存在黑洞的情况下，MAC\
  \ 负载非常高。但通过基于提出的 `DTH-AODV` 的检测防御机制，MAC 负载几乎与正常 `AODV` 相等。在 MAC 负载方面，正常 `AODV` 与提出的\
  \ `DTH-AODV` 的性能几乎相等。\n\n图. 12 中的折线图显示了攻击以及检测防御机制对应用层总丢包的影响。如折线所示，在存在黑洞攻击的情况下，应用层丢弃了大量包。但在检测期间，提出的\
  \ `DTH-AODV` 的丢包量大大减少，几乎与无攻击的正常 `AODV` 相等。在应用层丢包方面，提出的 `DTH-AODV` 丢包数量略高一点。这是因为\
  \ `DTH-AODV` 会尝试发送比正常 `AODV` 更多的数据包。\n\n![Image](img/fig11_8.jpg)\n**图. 8:** 网络规模\
