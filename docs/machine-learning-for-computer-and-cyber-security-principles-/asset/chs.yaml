  \ 保持稳定；当 `L` 从 1 变为 5 时，增加并不显著。理论上，如果最大长度更大，则 PCPB 将涉及更多的潜在控制关系轨迹。我们分析了原因并发现，尽管当\
  \ `L` 增大时会有更多具有长控制轨迹的可疑小组，但新识别出的公司很少，因为大部分新增公司与先前的发现重复。\n\n![图像](img/fig12_1.jpg)\n\
  \n## 7. 结论\n\n\n\n\n本章侧重于检测通过关联利益交易进行逃避税的企业，这些交易受企业控制者之间潜在交叉关系的控制。首先，基于中国企业的控制关系，首次提出了并引入了一个名为“控制者交织”（controller\
  \ interlock）的概念，该概念参考了经过深入研究的董事会交织概念。接下来，采用图投影方法来识别不同企业控制者之间符合控制者交织模式的关联。然后，提出了一种组件模式匹配方法，根据识别出的控制者交织关系检测可疑的关联交易（ITE）群体。最后，基于中国某省七年间（2009–2015\
  \ 年）的数据进行了一系列实验，结果表明我们提出的方法可以极大提高逃税检测的效率。\n\n### 参考文献\n\n\\[1\\] Battiston, S.,\
