  \ 用于肺癌预后数据的随机森林模型。\n\n### 5.2.3 ID3、CHAID 和 CRT\n\n这些是高级的决策树学习算法。这三种算法使用了不同的树生长和剪枝方法。`ID3`\
  \ 模型树所示：\n\n![Image](img/fig10_8.jpg)\n\n**图 8：** `ID3` 树模型，显示了肺癌比例以及主要的诱发因素（过敏）和症状（吞咽困难）。\n\
  \n该模型将 `Age`（年龄）作为一个诱发因素，这与 `Decision Tree`、`random forest` 和 `Naïve Bayes` 模型的区别。`ID3`\
  \ 模型显示 87% 的病例为癌症，而 13% 为非。这确立了过敏是癌症的主要原因。在非过敏性癌症病例中，患者可能出现吞咽困难，而同压力仍然是主要的驱动因素。然而，在肺癌与年龄相关的案例中，模型认为\
