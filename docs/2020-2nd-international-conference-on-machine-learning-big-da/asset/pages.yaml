    # IV. SUMMARY AND PROSPECT


    The fast pace of development and natural industrial control system brings a variety
    of challenges. In this paper, we presented an intelligent cyber security strategy
    for electric dispatching and control system. Through the introduction of asset
    assessment security and attack analysis models, an intelligent analysis and processing
    of multiple sources have been achieved. The monitoring platform could realize
    detection of security events promptly. The security protection of the whole electric
    power dispatching and control system could be improved.


    Data sources include the firewall event we know to find “who is knocking on the
    door”, the intrusion detection and attack prevention WAF logs to discover “who
    is transmitting attack and is planting malware code”, the security management
    program which provide logs and operation to find “who is operating the equipment”,
    and the traffic is seen by traffic to realize “Real attack traffic


    We use data processing, firstly utilizing topology to identify the stages of emergency
    attacks, namely plenty attacking the main station, province dispatching substation,
    attacking the main station, zone I and II, III attacking cross-zone, cross-dimensional
    codes and internal network on external networks. Secondly, using alike analysis
    to identify the process of the attack as seen in scanning report, escalation backdoor,
    etc. Thirdly using dimension analysis to identify the correlation of attacks and
    recognize apt. By introducing analysis strategy to identify the attack source,
    attack traffic analysis for sensing attacks, and finally using attack status,
    as status of CPU, memory, or offline, to identify whether security events are
    occurring normally.


    In the next step, we need to study identity decision-making and emergency response.
    Through analysis of operation monitoring, multi-scale, and fine-grained detail
    analysis, and tracking of security events, and further apply knowledge engineering
    to form an intelligent event model with reasoning mechanism and knowledge base,
    to provide relevant professional knowledge and intelligent decision-making for
    operation by synthesis and impact analysis, based on agent trust mechanism and
    remote control strategy of network, security equipment and other technologies,
    designing realistic hierarchical network emergency isolation measures to remove
    multi-hierarchical blocking of stations: hosts and power plants & substations.


