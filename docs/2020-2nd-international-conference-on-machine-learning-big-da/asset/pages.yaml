    # II. CURRENT MAIN PROBLEMS


    +   1. Alarm effectiveness is worrying, and platform functions are

    The various functions of the existing network management platform are in a fragmented
    state, especially the alarm platform that provides real-time monitors for security
    alerts. The network management logic lacks information effective and/or intentional-influenced
    being. It is difficult to quickly locate values, and security managers are required
    to view and consider various functional index data separately from form an effective
    management analysis, and lack judgment on the overall operation and security situation.


    +   1) Self-awareness: the realization of perception and the network monitoring
    of security data, servers, switches, encryption and forefront horizontal isolation
    as and other monitoring, and objective of specific security effects.


    +   2) Distributed collection: the use of monitoring devices to realize the network
    data collection of related equipments such as dispatching stations, power plants
    & substations, power distribution, and negative control, as well as communication
    and interaction devices; the management platform realizes the integration of functions
    such as real-time monitoring, warning, auditing, and verification of network security.


    The security monitoring function can monitor running status, user login, operation
    and management, and so on, hosts and other equipments in real time. The security
    alarm, light and other methods, notify to monitor network security threats and
    security alert events, such as login behaviors that do not follow the implementation
    of security operation; The security is based on various statistical data collected
    during operation, using methods such as comparison, correlation, and historical
    and trend of network operation, and mainly analyze the index for evaluating security
    indicators such as alarm status, encryption rate and date rate; Security alerts
    from historical data collected behaviors and occurrences are correlated, tracked
    and retrospectively, and corresponding security evaluations are made, to discover
    security vulnerabilities and are not missed in time. The security verification,
    based on the vulnerability database and configuration baselines, carry out scanning
    and verification of security vulnerabilities, weak passwords, and security


    +   B. Need for comprehensive data analysis and processing capabilities

    The amount of security monitoring data is increasing. It is difficult for the
    platform to store and effectively integrate heterogeneous information generated
    by each equipment, resulting in single source of analysis data and low efficiency
    correlation of large-scale data. It is difficult to quickly discover global and
    local information. Thus, unable to meet the requirement for cybersecurity situation
    awareness, and the degree of intelligent alarm analysis and filtering-decision
    assistance is not high.


    +   C. Do not have intelligent learning and decision-making assistance functions

    In view network anomaly, the platform lacks feature recognition and autonomous
    learning capabilities, and is unable to effectively and intuitively display the
    current situation; it is impossible to detect and prevent the threats of 0day
    vulnerabilities and APT attacks in a large scale, to maintain access and security


    When a major security event occurs, it is difficult for staff to rely on technical
    management and control methods, to promote, multi-level and process blocking of
    sessions, hosts, and even the entire network in the center node. It is necessary
    to organize the equipment manually for performing related operations. Emergency
    requirements for rapid isolation of threats and containment of spread cannot be
    met.'
