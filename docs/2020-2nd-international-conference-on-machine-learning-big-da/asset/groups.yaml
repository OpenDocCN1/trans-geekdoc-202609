    ## III. 智能化分析管理控制策略


    ## A. 资产评估评分


    利用现有网络安全平台获取和收集的数据资源，通过对资产的运行状态、漏洞扫描、弱密码检查、当前威胁和异常行为进行全面分析并进行评估评分。为网络安全和运维人员提供关键信息，以实现威胁评估和安全有效控制的目标。


    通过综合静态评估和动态评估两条路径，对全网空间的所有资产进行评分，结合资产分配和控制系统，可以对整个网络空间进行整体评估。


    评分关系是指通过不同的因素和静态信息（如资产漏洞、基线配置和密码扫描）进行考虑和权重。为了建立完整的库，定期进行审计和配置实施，实施扣分制度，根据资产的权重和漏洞、人工评估、实际情况，解决问题规模难以区分的问题，并灵活地进行安全加固。在漏洞收集方面，通过互联网上的各种开源组织和商业机构（天翼用城、Webhh
    Online、FutureHub 等）以及国外权威（CVE、CND、CNNVD）收集外部情报。内部情报则是国家防御系统发布的各种预警指令。基于知识库，可以预测漏洞的危害，并提出通用的管理解决方案。


