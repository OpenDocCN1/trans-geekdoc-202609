    # 12.4 Sleuthing and Classification of Brain Tumors


    This section describes the sleuthing of tumor and some of the best available methodologies
    based on different grounds. It also explicates some challenges that may hinder
    the classification of tumor.


    # 12.4.1 Sleuthing of Brain Tumors


    Brain tumor segmentation and detection''s method contrasts and is dependent on
    numerous aspects, some of these aspects are a type of tumor, the intensity of
    tumor, location and size of tumor, time and cost, sequences of images used in
    dataset as well as several types of method preferred as generative or discriminative
    method, instance, or semantic methods, automatic, semi-automatic, or manual methods
    differ so does the best method for segmentation and detection might differ for
    individual''s dependent on the above stated aspects.


    In general, the discriminative method works better in comparison to the generative
    method because the former depends on the features mined from brain tumor images
    and the latter depends on the preceding knowledge of the patient''s health and
    oncology issue.


    Among methods for instance or semantic segmentation, semantic segmentation seems
    to be better than instance segmentation because the semantic method can provide
    similar colors to the tumor region which belong to a precise class the instance
    method provides separate colors to the tumor region belonging to a precise class
    which makes the work difficult for researchers. Some of the best semantic segmentation
    includes an encoder (or contracting path) and decoder (or an expansive path) [7,
    8].


    Among automatic, semi-automatic, or manual segmentation methods, the performance
    of each method vary case to case basis and on some of the aspects stated above.
    For the convenience of individuals, the fully'
