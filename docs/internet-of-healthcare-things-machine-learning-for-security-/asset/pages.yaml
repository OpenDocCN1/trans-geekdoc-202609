  md: '# 236 INTERNET OF HEALTHCARE THINGS


    # 10.7 Conclusion


    The principle target of this work is to assess the utilization of ANN with Multilayer
    perceptron neural network for analysis of heart diseases. The performance of the
    back propagation neural network with the prediction accuracy is satisfactory but
    to increase the level of accuracy and to know the type of heart disease the CBR
    technique is integrated with ANN. Those patients who developed heart failure are
    matched against a set of control patients on age, gender, and clinics, and ended
    up with 45,000 control patients. Notice that in this study there are fewer cases
    with heart failures than the controls without heart failures. This is pretty typical
    because, in a real-world scenario, patients with specific disease conditions are
    often harder to obtain while there are a lot patients without that disease available
    to serve as controls. To summarize, in a case-control study, the first cases are
    identified, then try to match them to a set of control patients. In the cohort
    study, all patients exposed to risk are identified, and the matching criteria
    are not involved. Evaluation of trained models is one of the most crucial steps
    in the pipeline. Using some training samples, the idea is to devote the model,
    but test this training model on some other unseen samples, ideally from future
    data. It may be noted that the training error may not be very useful because it
    can easily overfit the data by using a complex model which does not generalize
    to future samples. For a better approximation of the performance of the model
    on future samples, the testing error is the key metric. It would be interesting
    for further work, if any old record is not matched with the present expert doctor
    advice can be taken by certain computing methods like mobile, cloud, and so forth.


