    # 2.3 IoHT Process Flow


    In a typical use case of diagnostics in the healthcare system, data from the patient
    is collected through devices incorporating sensors, and processed by special and
    specific applications in a range of equipment like a normal computer or custom-built
    terminals. User terminals are connected to a gateway through short coverage communication
    protocols, usually conforming to industry adopted IEEE 802.15.4 standard [3].
    This gateway connects to a medical server or cloud services for processing and
    storage—critical functions in the system operation. There is a choice of segregating
    the storage of data—either centrally or in a distributed manner depending upon
    the system architecture and configuration. Segregation and decentralization enhance
    the level of security for the data; however, could bring down the efficiency of
    operation and response time to data handling. Simulated testing of scenarios of
    data storage and handling is recommended step in system design and integration
    as well.


    IoHT can support use cases in the healthcare environment—patient registration,
    scheduling appointments, clinical records in the form of noting, images, and reports,
    recommended and administered medicines, tracking the prognosis of health conditions
    and follow up procedures. For each of these use cases, custom-built devices and
    applications are available and it is the task and responsibility of the system
    integrator to put the pieces together following standards and specifications for
    optimal functioning of the system. It is at this stage that the consideration
    of security and privacy issues need special mention in that they seamless absorption
    at the design phase.


    Unlike other internet of thing’s domains, healthcare represents a unique opportunity
    as well a challenge since the data in IoHT requires the highest standard of protection
    in storage and handling. It is not the patients'' data alone that is critical,
    but the entire value of data relating to the medical community, financial support
    providers and that of vendors. IoHT is perhaps the only sector where real time
