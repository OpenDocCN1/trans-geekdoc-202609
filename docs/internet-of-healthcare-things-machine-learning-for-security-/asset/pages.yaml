    Figure 8.1 Classification of healthcare services.


    +   **1) Primary Care:** This is the first healthcare-related service received
    by a patient. These services usually consist of a general practitioner/family
    physician who acts as the first contact for the patient in the treatment process.
    The Primary Care doctor should be able to accurately diagnose the patient based
    on his broad sense of knowledge.

    **2) Secondary Care:** This primarily involves acute care, usually given in hospital
    emergency departments. Here only essential treatment is given and if necessary,
    the patient is referred to a tertiary health department. Therefore, the care given
    by a secondary physician is usually for a brief window of time.

    **3) Tertiary Care:** This is a specialized healthcare-related service given to
    patients on referral from primary or secondary health departments. This sector
    requires more care and time to heal the illness, usually for complex medical and
    surgical processes.


