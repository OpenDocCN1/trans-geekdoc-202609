    diagnose patients’ actual problems and suggest a befitting treatment. The compilation
    step itself takes a lot of time because data from various tests are produced in
    a fragmented and decentralized way. And the transfer of this data from one authorized
    party to another might even result in incorrect data updating if no proper system
    is used. This calls for efficient interoper-ability and a secure network among
    all the decentralized systems so that no tampering is done with the patients’
    reports.


    # 8.2.3.4 The Government


    The government plays an important role in the whole healthcare industry due to
    its influence. It includes financial and material resources for Medical institutions,
    funding the development of human resources and research opportunities in public
    health services. Other role of government include implementation of health-related
    policies, enforcing hygiene and safety standards on various institutions and industries,
    promoting health via different initiatives, and creating awareness. Its functioning
    and policies are prone to faults and loopholes owing to the scale of its policies
    introduced and the number of people involved [3].


    # 8.2.3.5 Insurance Company


    Health insurance covers the whole or a part of the cost for the services and prescription
    a person took for his/her treatment. It is a binding contract between health insurance
    providers and their policyholders. This contract usually involves monthly/annual
    payments of premiums. The Health Insurance provider cites in writing the type
    and amount of healthcare costs that will be covered under the policy. All these
    are provided by an Insurance company [4].


    Such insurance systems have problems such as poor access to the patient data assignment
    of wrong policies, manipulation of details of the patient’s record leading to
    the incurrence of inaccurate insurance claims. These call for a consistent database
    of records, which is immutable, ensuring the Insurance Company in the insurance
    they provide accurate and adequate for the treatment. This would develop trust
    among the Insurance Company, the Healthcare Service provider and the Patient.


    Blockchain integrated into the Healthcare system seems to provide solutions to
    the above-mentioned issues faced by the stakeholders. Now focus on blockchain
    technology and its working before and explore the health-care aspect of it.'
