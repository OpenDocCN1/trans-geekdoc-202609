    # 8.1 Introduction


    Blockchain is one of the latest and emerging technology advances that facilitate
    verifiable activities between parties reliably and rapidly. It is suggested by
    Forecast that global revenue generated by blockchain technology is projected to
    have massive growth, with the market surpassing 39 billion USD by 2025. Blockchain
    builds on the idea of a P2P (Peer-To-Peer) network. Its architecture eliminates
    the need for a central supervising authority. Isn''t it amazing to explore a future
    where there is no need to depend on a third party for their services? Many apps
    adopting decentralized P2P platforms (DApps or Decentralized Apps) where users
    and suppliers will get connected without getting controlled by any third party.
    Startup DApps are giving Uber and Amazon a run for their money. Blockchain is
    widely used in cryptocurrencies such as Bitcoin, Ethereum, etc. The most common
    hurdle in Healthcare is having access to all medical records in one place. They
    are generally spread among healthcare providers and stakeholders. Integration
    of Blockchain with healthcare can address these issues along with other challenges
    that are being discussed in this chapter. Blockchain proposes a mechanism that
    is transparent and responsible. It can revolutionize healthcare by ensuring patients''
    privacy, allowing them to retain ownership of their records, simultaneously giving
    easy access to hospitals.'
