    * The feature selection using bio-inspired optimization technique removes the
    drawback of a local minimum and they converge faster.

    * By applying feature reduction along with a deep learning approach, training
    time is reduced.

    * Highly related features are needed for improvement in performance level. Unnecessary
    features will cause calculation complexity.


