    # 4.2 Overview of Internet of Things


    From the technical point of view, the Internet of Things (IoT) is simply termed
    as the conversion of physical devices, objects or things into a digital product.
    This brings a new vision or meaning to real-world things by making them more intelligent.
    This means adding computing capabilities to all things or devices ever connected
    to cloud end servers or not well as integrating backend support for utilizing
    and analyzing and controlling those devices. IoT is a term that anticipates the
    communication between objects in everyday life by utilizing various kinds of sensors
    as Radio-Frequency Identification (RFID), actuators that function to detect, capture
    and transfer essential data to the Internet from their setting. IoT is a concept
    that, through using high technology, environs communication between the physical
    and digital worlds. Owinging to the wide size of the digital context, the number
    of users and the number of smartphones, energy consumption rates have reached
    distressing levels over the past decade. The growth of linked devices in 2030
    would be up to 100 billion [7]. Scientists who expect a massive information rate
    and an immense information size at the expense of the extraordinary release of
    carbon into the atmosphere. In later years, it is anticipated to grow. Clean or
    green energy is becoming an attractive study field in the advancement of technology
    because of these immense (CO₂) pollution, environmental and health issues. One
    of the fascinating innovations is the Internet of Things (IoT) [8]. It makes it
    possible to connect people and staff everywhere, with anything and everything,
    utilizing any connection and any service. It provides a forum for seamlessly connecting
    devices and sensors inside a smart world to people with highly sophisticated services.
    All types of data about the target are sensed and collected by sensors and then
    the data could be further processed and analysed to retrieve relevant detail to
    make smart utilities [9].


    In basic, there are four key components in IoT technology as described in Table
    4.1:


    Hardware: Integrated hardware including some sensors, tags, actuators and transceivers
    for information exchange. The devices in these units share common data irrespective
    of their heterogeneous behaviour or environment. The data surrounding them are
    sensed, collected and transmitted to the next layer i.e., the network layer for
    further communication through gateways or routers. The devices such as sensors
    or actuators can communicate with each other locally through coordinating devices
    [10].'
