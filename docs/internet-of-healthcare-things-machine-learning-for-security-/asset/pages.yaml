    Before studying the Healthcare sector and its stakeholders, it is essential to
    know about HIT or Health IT and its components related to this chapter for better
    understanding later on. Health Information Technology (HIT) involves the processing
    and management of healthcare data that leads to efficient and effective communication
    and decision making [2].

    Various components of HIT are:


