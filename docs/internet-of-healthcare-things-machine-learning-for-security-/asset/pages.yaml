    # 3.3.3 Current Technologies in Use


    Numerous technologies are in use to make sure the security & integrity of big
    data health. Commonly used techniques are:


    +   1) **Certification:** Certification is the setting or confirmation that a
    statement about a company is valid and truthful and offers a fundamental opportunity
    in all societies. It provides access to your business, protects your customers''
    identities, and sees who your customers are.

    Data collection can lead to rare problems, especially Man in the Middle Attacks
    (MITMs). Most cryptographic methods comprise point authentication specifically
    to prevent MITM attacks. Transport Layer Security (TLS) [8] & Secure Socket Layer
    (SSL) are cryptographic methods that ensure communication over networks such as
    the Internet. SSL & TLS encrypt network connection segments at the end of the
    transport layer. Various versions of the protocol are widely used in applications
    such as Web Browsing, Voice over IP (VoIP), Internet Fax & Messaging. Additional
    updates to hash methods such as SHA-256 [9] & Kerberos methods are available.
    In addition, sensitive 360° data can be verified using the Bull algorithm. This
    calculation was used to ensure data security and to track the relationship between
    the original and the replicated data. Anyone with permission can also read or
    write basic information. The researchers also proposed a new and simple validator
    model that uses a temporary pad algorithm. It eliminates the transmission of passwords
    to servers. As part of the healthcare system, health information provided by your
    service provider and user identity must be verified in each exam [10].


    +   2) **Encryption:** Data encryption is an effective way to prevent unauthorized
    access to confidential information. This solution enables and maintains data logging
    throughout its lifecycle, from data centers to endpoints (including phones used
    by doctors, physicians and management). Encryption helps prevent prevent packet
    sniffing and storage device theft.


    Medical institutions or providers must ensure that cryptographic systems are appropriate
    and convenient for patients and health workers. The number of keys stored for
