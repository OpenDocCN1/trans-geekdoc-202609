    system. A digital health monitoring platform for all is one of the popular agenda
    among governments to provide healthcare solutions at low cost with access to everyone.
    Technology has facilitated digital solutions and low-cost storage of health records
    of peoples. This information can be utilized for monitoring, education and decision
    making [2, 10].


    Topic modeling algorithms are adopted to find thematic structure from given documents
    by word analysis. Annotation and labeling of texts are not required for performing
    topic modeling. In topic modeling, derived from Dirichlet texts are the representation
    of words distribution. Latent Dirichlet Allocation (LDA), a probabilistic topic
    modeling algorithm is applied in this research to find relevant topics to the
    Internet of Healthcare Things. An LDA model is used to find words similar observation
    and groups into topics proposed from IoHTs datasets [4]. News data from various
    sources is selected as the source of information to perform topic modeling to
    categorize text into latent topics. The dataset is pre-processed for removing
    unwanted information such as hyperlinks. Removing stop words and transform inflected
    words into their lemma using lemmatization. Pre-processed texts are passed to
    the LDA model applied a bag of words approaches on given texts to derive word
    vectors. The latent topic probabilistic distribution representation over given
    texts [12, 16].


