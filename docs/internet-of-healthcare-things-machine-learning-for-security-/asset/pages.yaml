  md: '# 88 INTERNET OF HEALTHCARE THINGS


    by the doctors or specialists which are further stored at the cloud server from
    where patients can access the report by authenticating themselves. So, this framework
    is bidirectional which is secure, robust, and flexible.

    The algorithm for the proposed model is illustrated below:


    ```

    Algorithm:

    1. Begin

    2. Input: Intrusion Feature set={F₁, F₂, ...F_n}

    3. Output: Intrusion Report → Data(status)

    4. Node initialization and deployment

    5. Packet capturing fog→Sensor nodes

    6. Feature Extraction

    7. Data Analyst fog→co-relation and reduction

    8. Ensemble DNN training

    9. Decision fog→Data(status)

    10. Generate alert

    11. Update learning model

    12. End

    ```


    The proposed model consists of four distributed fog nodes that communicate with
    each other so that they can better identify network attacks (Figure 4.9).

    Co-ordinating node: This node handles the training process from the existing intrusion
    database and trains the ensemble DNN network for creating decision rules. The
    training is performed based on protocol type TCP, UDP, and ICMP.

    Packet capturing fog node: This node collects network traffic and passes it to
    the next node.

    Data analysis fog node: This node extracts features and find co-relation among
    features. The co-related features are further considered to be processed and thus
    results in feature reduction.


    ![](img/81d4baf48f6d3ce2c324d659b1914fad_102_0.png)


