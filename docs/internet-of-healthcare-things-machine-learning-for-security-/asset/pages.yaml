    # 8.3.3 Workings of a Blockchain System


    Blockchains are roughly categorized into three different types:


    +   * Public blockchain;

    * Private blockchain; and

    * Consortium blockchain.


    In a public blockchain, every participant can become a node and participate in
    the consensus process and all the transactions/records are visible publicly. On
    the other hand, in a Consortium blockchain, only a group of pre-selected nodes
    can participate in the consensus process. In a private blockchain, only nodes
    that are associated with specific organizations can participate in the consensus
    process [8].'
