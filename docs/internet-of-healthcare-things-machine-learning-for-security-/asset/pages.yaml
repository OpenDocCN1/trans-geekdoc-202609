    # 11.11 Conclusions


    The purpose of this research is to discover new IoT-driven healthcare technologies,
    sensors, or systems to provide healthcare practitioners with improved knowledge,
    helping them to take action to prevent and diagnose diseases. In addition, our
    research opens a forum for data protection experts to further mitigate IoT healthcare
    sensor and system vulnerabilities. Healthcare is a major industry in the country,
    and since the IoT revolution, healthcare systems have become more effective and
    secure. Health experts and scientists have improved the diagnosis and prevention
    of diseases with the exponential development of IoT products. Therefore, multiple
    sensors and systems powered by IoT have been launched and are now being used successfully
    in hospitals and for personal healthcare. In a relatively short period, these
    instruments generate a vast volume of data. Therefore, during the use of such
    instruments, data breaches may occur.


    We found the most important advantage of using smart healthcare technologies and
    systems was performance. Around the same time, we have that the protection and
    privacy of personal data were the most critical problem when using IoT healthcare
    devices. Researchers interested in medical science may focus their studies and
    experiments on advanced IoT sensors to detect health problems and diseases measuring
    various body parameters. To ensure the secrecy and credibility of the information,
    IoT-driven healthcare manufacturers are advised to concentrate on establishing
    users'' protection and privacy. Future researchers may pay further attention to
