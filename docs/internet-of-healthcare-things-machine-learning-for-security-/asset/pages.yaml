    #  7.6.1 Architecture of the Smart Healthcare System


    The amount of IoT healthcare-connected medical users and devices are on the rise.
    There is a significant development in the relation of the room of patients, including
    medical equipment, room lighting, air conditioners, beds of patients, etc. The
    healthcare IoT system’s physical and cyber world interconnections are in four
    distinct layers as shown in Figure 7.4.


    +   (i) Data Perception layer

    (ii) Data Communication layer

    (iii) Data Storage layer and

    (iv) Data Application layer.


    # 7.6.1.1 Data Perception Layer


    The main task of this layer is to deal with personal clinical information that
    is collect from the user in real time. Medical information are collected through
    various short-range communication technologies such as Radio Frequency (RF) Waves,
    Z-wave, Near Field Communication (NFC), ZigBee, Bluetooth etc., and transfer to
    the upper layer for processing these data. Sensors such as RFID tags are incorporated
    into the Medical IoT devices and contain all the information that can be scanned
    to receive all the related data. Once the scanned data is transferred to the upper
    layer in the hierarchy, i.e., the networking layer, the data is processed accordingly.


    ![](img/81d4baf48f6d3ce2c324d659b1914fad_153_0.png)


