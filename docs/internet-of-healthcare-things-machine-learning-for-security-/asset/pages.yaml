    over the internet increases, it increases security threats. So, to detect malicious
    activities over the internet, intrusion detection is considered to be an effective
    security tool. According to the study, it is seen that machine learning techniques
    are considered to be a more widely used application to design more efficient intrusion
    detection tool for achieving high accuracy rate as well as low false alarm rate.
    A more accurate predictive model can be built for such a large network dataset
    by applying a machine learning approach which is quite impossible with traditional
    security tools. The machine learning-based IDS learns the pattern of data captured
    in the network to determine its behavior to be an anomaly or normal. Traditional
    IDS will only identify such attacks that are known to the machine. It cannot determine
    the unknown attack and its behaviour. There is the possibility of architecture
    interference by the botnets program that specifically targets the memory of the
    IoT architecture by bringing the malware into its specific attack coder. The result
    of such attacks is the system''s complete breakdown or the malfunctioning of the
    program. Certain situations may lead to improper activity by the architecture.
    There is the possibility of more extreme and outrageous situations in instance
    the shock provided to the patient who has a pacemaker implanted inside him that
    can consequently lead to his/her demise. The conclusion being drawn, points towards
    ensuring proper protection in the IoT framework during communication from unnecessary
    intrusion [33–38].


    #  4.6 Application of Machine Learning for Intrusion Detection in IoHT


    Today Internet of Things (IoT) stands as a milestone in the era of technological
    advancement especially for the millennials given that this generation has only
    experienced the post-globalization period of the human timeline. When it comes
    to the healthcare monitoring department, manual inspection in the physical presence
    of a doctor or other qualified medical assistants was an inarguable necessity
    to monitor a patient''s recovery. Medical test results were waited on for days
    then had to be interpreted based on the diagnosis. The studies depict the more
    crucial and difficult security related issues with the privacy factor in the system
    of healthcare being driven by the IoHT in the systems which are dependent on the
    IoT platform for monitoring. The system prerequisites of the IoT platform requires
    the additional device localization services in opposition to the IoT based working
    architecture for improvement in'
