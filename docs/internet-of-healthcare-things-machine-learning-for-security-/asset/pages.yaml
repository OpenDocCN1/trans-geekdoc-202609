    #  8.3.2 Features of Blockchain


    Blockchain is gaining a lot of popularity because of the following mentioned features.


    #  8.3.2.1 Decentralization


    Decentralization is one of the core concepts of blockchain which implies that
    no organization can own a chain. Traditionally, data is stored on a database of
    an organization that is accessed by the user by sending a request to a server
    called client-server. The client-server gives back relevant information [23].
    Centralized systems are vulnerable


    +   - They are targets for potential data hacks since all the data of the organization
    is stored at one spot.

    - During maintenance or in case of system failure, the data becomes inaccessible.

    - In the worst-case scenario, the centralized system could get corrupted or infected
    with malware. In that case, all of the data residing in the centralized system
    will be compromised [5].


    Blockchain is a P2P network where everyone has copies of the chain. This eliminates
    the need for a third party to enable a transaction and provide users with a copy
    of their information. It also avoids a single point of failure situation [8].


    #  8.3.2.2 Immutability


    Data/Block once added to the blockchain, cannot be tampered with. This is attained
    via the use of cryptographic hash functions, which take the data from the block
    as an input. Hashing consists of taking an input string of variable length to
    give out an output of fixed length. Input data can also be tracked using the hash
    of the block.


    The "Avalanche Effect" property [5] of cryptographic hash functions plays a huge
    role in ensuring immutability. This property of cryptographic hash functions reflects
    huge changes in output even for small changes in input. If someone tries to change
    the block''s data, even the slightest changes will change the hash drastically.
    The nonce and hash are 32 and 256 bits respectively. Thus, there are roughly four
    billion nonce-hash combinations that must be mined before the right one is found.
    When our miner finds the right combination, the mined nonce is called'
