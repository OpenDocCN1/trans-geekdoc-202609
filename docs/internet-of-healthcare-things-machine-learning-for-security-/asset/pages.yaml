    DenseNet (Dense Convolutional Network) [7, 13], Xception [7, 12], MobileNet [7,
    13], and MobileNetV2 [7, 14].


    # 12.4.2 Challenges During Classification of Brain Tumors


    Identification of brain tumor accompanied by its type and grade of tumor is the
    decisive and most challenging period. Some of those challenges which might affect
    the classification of brain tumor are as follows:


    +   Recognition of correct symptoms of brain tumor as well as its grade in a patient
    is the most challenging task as a recommendation of treatment or further medical
    exam to verify tumor from non-tumor depends on this recognition.

    After recognition, another crucial task that needs accuracy is analysis of tumor
    using small portion of tumor as a sample which is further treated as a block to
    classify tumor. The selection of sample is vital as the entire study on brain
    tumor depends on the sample provided to it. If the selection of sample is not
    balanced, then analysis of brain tumor becomes impractical.


    +   For an analysis to be done during de novo neurosurgeons on a tumor''s sample
    is challenging as the gathering of samples is problematic. As it is known, the
    doctor can''t disclose a patient''s medical details and so it affects the number
    of samples collected as there might be some legal complications.


    +   Making classification of tumor fully automatic based on features selected
    is a challenging task.


    # 12.5 Survival Rate of Brain Tumors


    The survival of a patient is reliant on the nature of treatment provided to them
    and the treatments can be surgery, chemotherapy, radiation, therapy,'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# TRUST IN IOHT & Machine Learning-Brain Cancer 275


    drugs, or a combination of some of these treatments. The survival rate for 5 years
    means the percent of people who remain alive for 5 years after treatment of tumor
    is completed. This percent of people survived is calculated out of 100 persons
    while for relative 5-year survival rate, the comparison is conducted between the
    number of people with similar kinds of tumor and the entire population.


    For both types of brain tumors, the percentage for the overall tumor cases in
    adolescents and young adults (AYAs) has its range i.,e., 48% in the case of adolescents
    and young adults 63% in the case of young adults of 30–39 years [3].


    Benign and borderline brain tumor has approximately 97% relative survival of 5-years
    [3, 5]. This survival rate is higher altogether in all groups of adolescents and
    young young adults (AYAs) [3, 5].


    The survival rate depends on numerous aspects other than just treatments provided
    to the patient, some of these aspects upon which survival rate are given below:


    +   - The survival rate depends mainly on the kind of tumor a patient has. The
    severeness of the patient''s condition directly depends on tumor type as benign
    tumor''s level of severeness is diverse from a malignant tumor.


    +   - The survival rate for brain tumor varies depending upon the grade of tumor.
    It can be stated that low-grade tumor has higher chance of survival compared to
    higher-grade tumor.


    +   - The survival rate depends on where the tumor''s position is situated in
    brain early detection of tumor is hindered by a protective layer termed a skull.
    Tumor''s location is vital, but the size of tumor also has a crucial part that
    may hamper the detection or appropriate treatment to be provided to the patient.
    For example, if the tumor is situated at a place where the skull hinders in the
    detection of this tumor but if the size of tumor is bulky it becomes easy to detect
    tumor even at that part of brain and vice versa.


    +   - The physique of a patient also plays an imperative part in the survival
    rate. Patients having genetic health issues may not show its effect on the early
    detection of tumor but also on the survival rate. Patients with genetic health
    issue will show some symptoms which might be related to their respective genetic
    disease and this symptom can result in neglect of the brain tumor symptoms consequently
    primary detection of tumor can be easily affected.'
