    # 8.3 Blockchain Technology


    The Blockchain is in its most trivial is a linked list that contains time-timestamped
    series of immutable data connected by a hash of the previous block. Blockchain
    is managed by a cluster of computers called nodes, which maintain a copy of the
    chain. Each block in a blockchain is secure, immutable and connected to the previous
    block via its hash [5]. It builds on the idea of a P2P network where P2P stands
    for "Peer to Peer":


    A P2P network consists of computers called ''peers'' that are connected via the
    internet as shown in Figure 8.3. Files can be directly shared between peers without
    a central server [6]. Hence, each peer acts as a file server as well as a client
    [6]. In this, the P2P network provides a decentralized, distributed, shared, and
    immutable database ledger where data contains a list of all transactions by eliminating
    the need for a legitimate central supervisory authority.


    # 8.3.1 Important Terms


