    of power in the Blockchain is needed for keeping a real-time track of the transactions
    [13]. Whenever a new node is created, the miners find a valid nonce once the transactions
    are validated by the network, then spending a lot of energy. It has been estimated
    by the Researchers at the University of Cambridge that Bitcoin consumes more energy
    than Switzerland [12, 14]. Now need to find ways to reduce this high energy consumption
    or else this consumption will only increase with the growth of blockchain platforms.


    # Data Immutability:


    The data once written in the nodes cannot be altered or removed. Immutability
    should only be ensured if the network nodes are distributed uniformly among different
    organizations. A blockchain network (peer-to-peer) can be manipulated by a person/organization
    or possesses 50% or more nodes participating in the network, making the chain
    vulnerable.


    # Not Completely Secure:


    Although Blockchain technology is safer than alternative platforms yet it is not
    100% poolproof. There are ways in which Blockchain security could be compromised.
    Some of them are:


    +   1. **51% attack**: In a 51% attack, if an organization can manage 51% or more
    of the network nodes, then it will take the management of the network. By doing
    so, they can alter the information within the transactions and additionally do
    double-spending.

    2. **Double-spending**: Double spending can only be possible on the networks with
    an exposure to the 51% attack. Different consensus algorithms like Proof of Work
    (POW), Proof of Stake (POS), etc. can be used to prevent it.

    3. **DDoSs attack**: During a DDoS attack, nodes of Blockchain are bombarded with
    similar kinds of requests which lead to congestion of the network, thereby crashing
    the entire network.


    # Cost and Implementation Struggle:


    The cost for implementation, execution and maintenance of blockchain technology
    is quite high. Some prices include the hiring of developers, licensing cost if
    one opts for a paid blockchain solution, expenses of the management of a team
    that is an expert in various aspects of blockchain technology, and so. The cost
    of the maintenance associated with the solution also needs to be taken care of.


    Lastly, it can be concluded that blockchain is not quite ready for practical applications
    and there is the scope of improvement to make it more reliable for daily needs.'
