  md: '# 5.1 Introduction


    The digital platform is widely used to disseminate information among users from
    news publishers, government organization, non-government organization and individuals.
    Digital infrastructure is witnessing more interest and investment in this decade.
    Smart devices are associated with offering services to everyone without their
    awareness. Most of the services which are offered online are using IoT devices
    as backend [1]. IoHTs use properties of the Internet of Things (IoT) to provide
    healthcare services and touch human lives in regions that are unattended by basic
    healthcare services. Healthcare systems are playing an important role in making
    government policy, the financial health of an individual and the demands of a
    medical specialist. Individual and government are very concerned about existing
    health infrastructure. Every country is facing challenges in terms of unavailability
    of sufficient health infrastructure and the relative gap in comparison to demand
    and supply. Internet of Health Things can play an important role in providing
    support to existing health infrastructure by incorporating more technology. It
    requires capital investment and time to establish health infrastructure which
