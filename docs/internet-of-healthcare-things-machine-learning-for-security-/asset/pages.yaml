    # Abstract


    Internet of Things is part of modern human life as smart devices are accepted
    and accessible to everyone. Smartphones are a common example that shows IoT devices''
    reachability. Digitization is the focus of businesses and governments to offer
    better services to individuals. The digital medium has been adopted as a platform
    for sharing information about topics ranging over various domains. Internet of
    Healthcare Things (IoHTs) plays significant importance in offering medical services
    to a broader population using digital infrastructures. The proposed work objective
    is to present a sentiment analysis and topic modeling approach for early warning
    of a health crisis which can be integrated with the IoHTs framework and can be
    fruitful in assisting medical specialists. In this research, information related
    to IoHTs is collected followed by generation. Topic modeling is performed on the
    proposed IoHTs dataset for predicting trends in IoHTs domains. Sentiment analysis
    towards IoHTs applicability is evaluated to find the overall sentiment orientation
    of peoples. In the current pandemic situation, variation in sentiment orientation
    of users towards IoHTs system is evaluated and analysis is carried out to find
    the effectiveness of IoHTs systems.


