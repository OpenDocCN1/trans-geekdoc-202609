    One size fits all paradigm is anathema in attempting to have a universal recommendation
    for establishing and regaining security and privacy of data in IoHT. The following
    is a set of recommendations for enabling a reasonably high level of security in
    the provision of services:


    +   1. Healthcare institutions should develop and publish their approved policy
