    # Abstract


    Blockchain is one of the latest and emerging technology advances that facilitate
    verifiable activities between parties reliably and rapidly. It builds on the idea
    of a P2P (Peer-To-Peer) network and provides a decentralized, distributed, shared,
    and immutable database ledger where block data contain a list of all transactions
    linked by cryptographic hashes. Blockchain eliminates the need for a legitimate
    central supervisory authority. It uses the state of consensus and cryptographic
    algorithms. When new transactions are added to Blockchain, these algorithms are
    used to verify data''s authenticity in each node. Blockchain technology also makes
    it difficult to directly alter a part of the blockchain as the hashes of subsequent
    nodes of the altered node be recomputed. This requires infeasible computational
    power, making the security fool-proof and increasing exponentially with the chain
    size. The application of Blockchain in such a manner makes it easier to verify
    the legitimacy of transactions and at the same time provide transparency, reliability,
    and integrity. Blockchain is implemented in a wide range of domains as Supply
    chain management (SCM), financial sector, Internet of Things (IoT), Energy Sector,
    and Healthcare. The rapid growth of digitization in healthcare has passed the
    generation of massive records of patients. This calls for protecting such highly
    confidential data and ensuring data integrity during transactions between authorized
    parties. Blockchain proposes a mechanism that is transparent and responsible.
    It can revolutionize healthcare by providing patients'' privacy, allowing them
    to retain ownership


