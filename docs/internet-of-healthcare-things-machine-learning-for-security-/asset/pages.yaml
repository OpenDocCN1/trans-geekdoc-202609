    # # 11.6 Conclusion


    Over the few years, Internet of Things (IoT) has witnessed the transition in a
    lifetime which offers the possibility to examine mutually both the real-time data
    and historical data by the changing role of data mining and artificial intelligence
    practices. In the early phase through the IoT the medical environment, the precise
    and efficient method for breast cancer diagnosis is particularly required for
    the treatment and recovery. In this research study, a couple of diagnostic system
    for accurate diagnosis of breast cancer are discussed in detail. In constructing
    the scheme for the machine learning acting like the forecasting model, many methods
    of machine learning were used for its discovery.


    The existing state-of-the-art method does not successfully identify breast cancer
    in the initial stages, and most of the females have suffering from this potentially
    hazardous disease. Consequently, the early discovery of breast cancer substantially
    poses a major challenge for healthcare professionals and scientists. To address
    the problem of early on-stage exposure of breast cancer, proposed a machine learning-centered
    diagnostic system that essentially organizes the benign and malignant individuals
    into the environment of IoT. In the foreseeable future, other features selection
    procedures, increasing the efficiency (optimization), and deep neural network
    categorization methods will be exploited to further boost the performance of the
    diagnostic procedure for BC diagnosis.'
