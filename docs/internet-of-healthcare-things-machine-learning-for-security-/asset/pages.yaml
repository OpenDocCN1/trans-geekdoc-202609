    better decision making and prioritize resources.


    Kumar et al. have presented an framework of public opinion of IoT on social media.
    A comparative study is carried out to find the relevance between research on IoT
    and social media. A social media analytical framework is proposed to analyze data
    from the microblogging platform Twitter. Social media and IoT data are analyzed
    using bibliometric analysis and social media analytics framework. The research
    article finds that the public''s interest is about the application of IoT while
    researchers are interested in the IoT technical aspect [1]. Zhou et al. have performed
    sentiment analysis of text at local government areas (LGAs) data fetched from
    Twitter, a social microblogging platform. The study has been carried out in a
    pandemic period to evaluate the effect of COVID-19 on LGAs. The analysis shows
    that there is general sentiment positive polarity shifting to negative polarity
    with increased cases of COVID-19, political decision and social events [2].


