    making for detection and segmentation of brain tumor. The result was better than
    that of this algorithm without IoT [16]. This paper had used IoT and cloud-based
    approach for the detection and classification of brain tumor. Magnetic resonance
    images as input were captured by the IoT devices which later sent through the
    cloud for the diagnosis of tumor. The optimal Dense Convolutional Network model
    was used to work on collected MRI images which were received through the cloud
    and this model performed with 99.37% accuracy.


