    # 12.1 Introduction


    Internet of Things (IoT) aids in real time data communication to the desinated
    place through some of its devices. Internet of Healthcare Things (IoHT) and the
    use of machine learning has been considered further advanced technology for patients
    because of reasons such as effortless disease detection, reduction in demise rates,
    reduction in medical cost, etc. Some of the IoT devices are displays, movement
    tracker, camera, detectors, etc. Machine Learning uses some of its appropriate
    algorithms to reduce the errors made by the experts during decision making. These
    devices are being ingested/wearable into the patient''s body as per the guidelines
    of the doctors. Figure 12.1 illustrates the process flow of IoHT and the use of
    machine learning in it.


    Trust in IoHT and machine learning for brain cancer can be understood through
    these four steps:


    +   - Data Acquisition: Clinical data acquisition from hospitals using IoT devices
    that are recommended by doctors as per patients'' tumor conditions.

    - Data Cleaning: Data tuning by removal of unwanted data that does not have any
    relation to the patient''s tumor treatments.


