    # 12.3.3 Grades of Brain Tumors


    Brain tumor is classified into two types i.e., primary brain tumor which can also
    be known as low-grade tumor (Benign) and secondary brain tumor (Malignant) known
    as a high-grade tumor. The low-grade tumor is known to be less lethality in contrast
    to a high grade tumor. These types of brain tumor are further alienated into grades
    of tumor which ranges from grade I to grade IV. This grading of tumor was done
    by World Health Organization to further comprehend the risk level and provide
    appropriate type of treatment to the patients. These different grades of tumor
    are characterized according to the structure of tumor perceptible through the
    microscope. Grades I and II are considered primary brain tumor while grades III
    and IV are considered secondary brain tumor. As previously it was distinguished
    that the benign tumor was less deadly compared to the Malignant tumor accordingly
    grades I and II become less deadly compared to grades III and IV. Figure 12.2
    exhibits the different grades of tumor.


    Discussion of each grade of tumor along with some names of the tumor are stated
    below:


    +   Grade I tumor: A grade I tumor can be effortlessly removed as it seldom invades
    the brain to other parts of the human body and it has an advantage over other
    types of tumor that it grows at a slow rate. Gangliocytoma, Pilocytic astrocytoma,
    Ganglioglioma, and Craniopharyngioma are some of the tumors that fall under the
    category of this grade tumor.


