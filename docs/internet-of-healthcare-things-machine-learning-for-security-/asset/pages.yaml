    # 8.3.5 Challenges and Drawbacks of Blockchain


    Although the technology seems very promising yet it faces some challenges. These
    challenges may be resolved in the future with innovative solutions and emerging
    technologies. Now we discuss some of the challenges based on our current technological
    infrastructure (as shown in Figure 8.6).


    # Scalability:


    Scalability is a major drawback of Blockchain Technology. When one uses the Bitcoin
    Network, the transactions completed depend on the network congestion i.e. the
    more the number of individuals or nodes the more is the possibility of the system
    slowing down. For instance, Visa and Bitcoin can process 65K and seven transactions
    per second respectively.


    # High Energy Consumption:


    High energy consumption is a very concerning drawback especially when the world
    is moving towards a green and clean future. The consumption


    ![](img/81d4baf48f6d3ce2c324d659b1914fad_187_0.png)


