    +   - If the central administrator is compromised then the decision may also alter.

    - Irrelevant features identification increases computation time and reduces accuracy
    rate.


    The proposed framework for intrusion detection in IoHT is illustrated in Figure
    4.8. This framework gives a general overview of the framework that is composed
    of basically three layers: data layer, communication or network layer, storage,
    and analysis layer. The data layer is composed of smart sensor data or any information
    related to patients, hospitals, or insurance companies, etc. The collected data,
    either from sensors or any data, is communicated to the next layer i.e., communication
    or network layer. This layer is composed of gateway or switching devices that
    are responsible for analyzing the collected network data. The abnormal packets
    are analyzed using machine learning and reported to the administrator. The normal
    data packets are then transmitted to the next layer for their storage and analysis
    purposes. The collected data is analyzed


