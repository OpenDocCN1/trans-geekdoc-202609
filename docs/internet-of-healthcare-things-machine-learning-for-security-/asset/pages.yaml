    # 8.2 Healthcare Industry


    The Healthcare Industry is vast and has various sectors for providing healthcare
    facilities and products for patients. The interaction between different Healthcare
    stakeholders involve parties like the patient, the Doctor, the Hospital staff
    and Management, the Pharmaceutical company, the Insurance company, or the Government.
    Such parties and all intermediates need to have effective and error-free data
    conveyance for reliability and to avoiding fraudulent.


    Healthcare mainly concentrates on maintenance and health improvement by prevention,
    management, diagnosis, treating diseases, illness, injuries, and other physical
    and mental ailments. Healthcare availability to the public varies across different
    countries and communities and is largely driven by the social and economic environment
    and government policies. However, healthcare organizations are established to
    meet the needs of the general public [1].


    # 8.2.1 Classification of Healthcare Services


    The provision of healthcare services to the public is classified into the following
    three types as shown in Figure 8.1.'
