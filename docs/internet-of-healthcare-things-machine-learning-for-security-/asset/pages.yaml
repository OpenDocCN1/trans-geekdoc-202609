    of Wilconsin Hospitals. It consists of 699 samples with benign (65.5%) and malignant
    (34.5%).


    # 11.4.2 Data Pre-Processing


    Pre-processing includes two steps: one is discretization and the second is SMOTE.
    Discretization is defined as the method by which values are converted into discrete.
    SMOTE is used to balance the class. Liu et al. discussed a stat method known as
    discretization as Chi2 [60]. For class-balancing when the count of samples in
    the various category is not evenly distributed. With the help of SMOTE, the imbalance
    dataset dilemma is addressed using oversampling. In SMOTE [61], to balance the
    different classes, samples are produced with the support of a k-nearest neighbor.
    The overall combination of discretizing and SMOTE helps in enhancing the performance
    of the results. After the pre-processing, the feature selection [62–64] technique
    is applied to enhance the performance of classifiers and reduced the time of computation.
    BFS-CFS [65] is used for feature selection in which searching BFS (best first
    search) is used and for evaluator CFS (correlation-based feature selection) is
    used. A wrapper selection of feature in accordance with supervised feature selection.


    # 11.4.3 Classification Algorithms


    The algorithm used for classification in the experiment serves various categories
    like Bayesian, trees and miscellaneous classifiers implemented in WEKA 3.9.4 [66].


    Naï Bayes [67] classifiers use probabilistic relationship among class and predicted
    variables. This classifier classifies the conditional class probability depending
    on the Bayes theorem and shows the simple distribution. Naive Bayes, that works
    well once classes in training datasets are imbalanced and it evaluates likelihoods
    for each class x depending on the complement of x, it means the rest of the datasets
    ignoring the training examples of class x itself. Deep Learning [68] perform classification
    and regression with the support of a multi-layer perceptron. RBF classifier [69]
    construct a network with the help of k-means clustering to root the basis function
    and learn or logistic regression. Sequential minimal optimization (SMO) [70] is
    a quadratic programming algorithm proposed by C. Platt. It was designed for sparse
    data and linear SVM. It breaks quadratic problems into a set of smaller quadratic
    problems, to minimize computation time. A decision table constructs a decision
    table by choosing'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# USING ML IN BREAST CANCER AND IOT 253


    the correct subset of features [71]. Part construct decision trees (C4.5) and
    extract identify directions from the constructed tree. As C4.5 uses an approach
    top-down, recursive divide and conquer is considered as a standard classifier.
    AdaBoost ML algorithm adjusts weights of training to ensure misclassified instances
    and it selects only those features which help in increasing the predictive power
    of the model [72]. Random Forest is a supervised classification algorithm, numerous
    of decision trees are combined to form the random forest. Each tree includes a
    rule-based system. If a decision tree, there is no need to calculate information
    gain in the case of random forest to find the root. The rule used to create the
    tree is used to predict the result [73]. Kernel logistic regression [74] is a
    method that extends the ordinary logistic regression to cope with information
    that is not linearly distinguishable. It requires kernel constraints and kernel
    function. Using RBF (radial basis function) as the kernel function. MLP [75] is
    a class of ANN (feed-forward artificial neural network). It precisely refers to
    a network composed of various layers with an activation function. MLP described
    as vanilla when it has only a single hidden layer. LibSVM [76] operates faster
    than SMO because it uses LibSVM to develop the SVM classifier. The instance-based
    classifier is K*, in which the class of a test instance is based upon the class
    of the ones that are instances like it, decided by some resemblance function.
    It is different from other instance-in in accordance with the learners in the
    sense that it uses an entropy-centered distance function [77]. The classifier
    JCBA works in conjunction with class association rules, which make up the association
    rules where solely one characteristic-value-pair is permitted in the outcome [78].
    In the optimized forest, the merging of the genetic algorithm along with the random
    forest is done to enhance the results that have been accomplished only by the
    random forest classifier [67, 79–80].


