    # 2.4 Sources of Vulnerability


    The primary source of vulnerability, whom via the entire system, or parts of it
    (if careful isolation methodologies are designed and implemented), is the beneficiary
    (patient). The plethora of devices found in the market, with associated applications
    for measurement of physical and biological features of the functioning of a human
    body, poses the real challenge to administer security while transferring data
    from devices to the next layer.


    Patients tend to share their medical data with friends and third-party medical
    professionals to seek their opinion (to cross-check on their primary advice provided
    by the physician). Such actions expand the scope of vulnerability when login details
    are shared or access is made possible by proxy methods to medical records.


    The most common source of vulnerability is the internet itself, being a ubiquitous
    platform. Hackers and attackers thrive on


    +   1. the open access policy of the internet,

    2. on the unbridled aspirations of the development community,


    whom try and experiment with new products, algorithms, and protocols. All connectors
    and gateways in the network are potential sources of vulnerability, and system
    integrations, done piecemeal, are a sure recipe to invite cyber-attacks.


    Allowing access to remote users is another source of vulnerability. It is observed
    when the operations and maintenance of IoHT as a service is outsourced, the vendor
    would have remote access to the system, to diagnose and rectify any alarms or
    malfunctioning. Granting remote access (usually through the internet) increases
    the risk of compromise unless the devices are encrypted and dedicated to IoHT
    servicing.


    Another method to assess and locate vulnerabilities is to deploy specialized techniques
    like forensic investigations and risk management in wire-communications [4]. Such
    tools help the system integrator, responsible for network security, to identify
    the potential points of vulnerabilities in terms of points of intrusions, which
    would enable the designer to activate denial of service upon recognition of attempted
    intrusions.'
