    # 4.3.1 Authentication


    The authentication feature validates the identity (identification of communicators)
    or the communications exchange (message authentication). The identity will be
    verified simultaneously by both the sender and recipient. It needs a variety of
    entities, such as IoT computers, diverse servers (e.g. cloud/fog servers), separate
    users (i.e. mobile/static), cloud service providers, and gateways, which require
    authentication of each other, depending on IoT deployment.


    # 4.3.2 Integrity


    Integrity means maintaining the fairness and authenticity of the proof. This guarantees
    that the message received during communication is not wrongly inserted, unnecessary
    deletion, and modification. We must defend the data from any form of malicious
    handling.


    # 4.3.3 Confidentiality


    Privacy guarantees privacy security from unauthorized individuals being accessed.
    Often known as anonymity, messages exchanged on the channel will be secured from
    any kind of attack on the sharing of information.


    # 4.3.4 Non-Repudiation


    Non-repudiation is a security feature in which the sender doesn''t deny that he
    is sending data. No one can challenge the authenticity of the sender. In'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# 76 INTERNET OF HEALTHCARE THINGS


    information security, this feature is considered to be the most important which
    ensures the originality and confidentiality of the original message. For this
    digital signature, algorithms are used to ensure the authenticity of the user.
    This is being categorized into two types: non-repudiation of the sender (origin)
    and non-repudiation of the receiver (destination).


    # 4.3.5 Authorization


    This security feature is used to provide authority to users or customers to access
    data, resources, or files. For accessing, file authorization levels are decided
    either read authority or write authority. It is normally accompanied by a device
    or device identity verification authentication protocol. Access policies are typically
    provided by a system and customer services authority (i.e., system administrator).


    # 4.3.6 Availability


    The availability of the content assures that it is only available to accepted
    parties.


    # 4.3.7 Forward Secrecy


    In forward secrecy, no IoT devices can access the data that are not available
    yet.


    # 4.3.8 Backward Secrecy


    In backward secrecy, no IoT devices can access the data that has been shared previously.


