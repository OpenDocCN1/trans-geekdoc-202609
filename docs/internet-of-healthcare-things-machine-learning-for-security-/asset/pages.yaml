    # 12.6 Conclusion


    The healthcare sector is the most prominent industry which needed many innovations
    as well as smart in its technology, but innovation should be accompanied by responsibility.
    In the healthcare sector, automation of brain tumor detection and segmentation
    in a limited timeframe, cost, resources, and accuracy are always hailed by medical
    professionals. This chapter has provided some basic concept and case study about
    the internet of things (IoT) and the use of machine learning in the field of brain
    cancer. These case studies are just parts of the research on the Internet of Healthcare
    Things (IoHT) field. Trust in IoHT enables diagnosis and provide the treatment
    without the actual interaction of the patient with the doctor which otherwise
    might not have been possible for every patient. To reduce mortality rates, this
    chapter has also focused on a brief explanation of brain cancer along with its
    categories, symptoms, and challenges. IoT can provide real remote monitoring which
    can save many lives through early diagnosis of diseases. Therefore, in future,
    many novel and advanced IoT enabled devices as well various'
