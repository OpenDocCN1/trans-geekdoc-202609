    # 10.3 Materials and Method


    The idea of the proposed method is to develop a predictive model for heart failure
    that is helpful in the early detection in humans. This is shown in Figure 10.1.


    The focus on predicting the onset of heart failure is an interesting and potentially
    possible target. In the prospective study, the first step is to identify the cohort
    of patients, then deciding on what and how information can be collected, then
    start the data collection. In contrast, in a retrospective study, firstly to identify
    the patient''s cohorts from existing data, likewise to consider the past sensor
    records of patients, then retrieve all the data about the cohort. Consequently,
    in a retrospective study, the data set already exists and hence just need to identify
    the right subset and retrieve them. In a cohort study, the goal is to select a
    group of patients who are exposed to a particular risk. For example, to predict
    predicting heart failure readmission (i.e., heart failure patient after discharged
    from the hospital comes back again to the hospital due to heart failure) [11–15].


