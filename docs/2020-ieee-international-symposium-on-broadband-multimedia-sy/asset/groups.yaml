    **Pixel-wise attention**—we utilize the knowledge distillation method to transfer
    the knowledge of a large teacher super-resolution network T to a compact network
    S for better training compact super-resolution. We directly use loss function
    to measure the difference between the teacher model and the student model.


    The loss function is:


    ```

    $L_{ps} = ||F_t - F_s||_2^2, \quad (1)$

    ```


    where $F_t$ denotes the average feature of the teacher network and $F_s$ represents
    the average feature of the student model.


    ### A. Multi-level knowledge distillation

    In addition to above straightforward pixel-wise distillation, we present a structured
    knowledge distillation scheme: pixel-wise distillation. The pipeline is illustrated
    in figure 1.

    We split the feature map into multiple domains, which are denoted by the spatial-wise
    pairs. Each domain represents different spatial locations and the connection between
    two domains represents the similarity. We denote the common range as $R$ and the
    size of each domain as $S$. We only consider similarities with top-$\alpha$ near
    domain restricted to spatial distance and $\beta$ pixels in a spatial location
    to represent the feature of this domain.


    Let $\alpha_i^j$ and $\beta_i^j$ denote the similarity between the $j$-th domain
    from the teacher network T and the compact network S. The loss follows:


    ```

    $L_{po} = \frac{1}{N} \sum_{i=1}^N \sum_{j=1}^M (\alpha_i^j - \beta_i^j)^2, \quad
    (2)$

    ```


    where $R = [1, 2, ..., N]$ denotes all the domains. In our implementation, we
    use region pooling to aggregate $\alpha$ and $\beta$ features in one domain to
    $1 \times S$, and the similarity between two domains is computed from the aggregated
    features.


    ### B. Network structure


    We design a multi-level supervised compact network (MSCN) for training with lightweight
    parameters and computational complexity. In the proposed MSCN, we employ a compact
    model which is not only limited by its HR header,


    **Pixel-wise attention**: In the teacher, we utilize the teacher model. We devise
    SR network architecture into two parts: the feature extraction and the reconstruction.

    1) **The teacher network**: In teacher model, we utilize each block for feature
    extraction. The PixelShuffle module is used in the reconstruction of each model.

    2) **The student network**: In MSCN, we employ two blocks which are modified from
    MSR by making full use of MobileNet. We use deep separable convolution to reduce
    parameters and complexity.

    3) **Knowledge distillation**: While reported in [17] MAE loss could reach a better
    local minimum with fast convergence, it is to be more robust than MSE loss. So
    we use MAE loss in first part, it is formulated as:


    ```

    $L_{MAE} = \frac{1}{N} \sum_{i=1}^N ||I_i - \hat{I}_i||_1, \quad (4)$

    ```


    where $I_i$ denotes the ground truth image and $\hat{I}_i$ is the predicted HR.
    It refers to the patch size.

