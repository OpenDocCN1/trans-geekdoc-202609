    第三作者 孟爱东

    北京邮电大学

    中国，北京

    manad@bpt.edu


    摘要——由于移动设备的需求，具有小模型、低计算成本和高性能的神经网络设计受到了广泛关注。受知识蒸馏启发，我们设计了一种具有轻量级参数和计算复杂度的多级监督网络（MSCN）。在基准数据集上与两种广泛使用的方法：FSRN
    和 EDSR 对我们的方法进行了全面评估。在 PSNR 和 SSIM 方面，我们的方法优于没有多级监督的上下文网络，且提升幅度相当。


    索引—超分辨率、知识蒸馏、深度、轻量化


    自从 Dong 等人 [1] 首次将卷积网络引入超分辨率（SR）以来，深度神经网络成为主流解决方案，其性能显著优于传统方法。Kim 等 [2] 提出了一种名为
    VDRN 的极深 CNN 模型，该模型采用了残差学习和深度递归卷积网络（DRCN）。EDSR [4] 通过 ResNet [5] 移除了归一化层并采用了更深、更宽的网络结构。这些方法在信噪比（PSNR）和结构相似性（SSIM）方面表现良好，但仍存在缺点。首先，性能的提升是以大量参数和计算时间为代价的，这使其在移动和嵌入式视觉等实践中的应用性较低。其次，网络越深，性能对结构变化越敏感。此外，由于缺乏网络配置，很难复现论文中的水平。为了解决这些问题，设计参数更少、复杂度更低的网络是可能的。


    ## I. 引言


    高清（UHD）视频已被人们广泛接受，现在是广播行业的主流。然而，由于 UHD 视频采集和制作的限制以及低分辨率（LR）存档的不足，4K 内容仍然短缺。超分辨率（SR）的需求非常迫切。


    图像是基于视频的，因此论文中的图像 SR 是我们的初始任务。SR 是计算机视觉中的一个基础问题，学习从 LR 图像到 HR（高分辨率）图像的映射。然而，这个反向问题是一个病态问题，因为
    LR 和 HR 之间的映射存在多个解。此外，它需要为每个 LR 图像预测特定值以形成相应的图像。


    最近，由于移动设备的需求，具有模型尺寸、轻计算成本和高性能的神经网络设计受到了广泛关注。目前的大多数工作都是为了设计轻量级网络，例如 MobileNet [4]。先进策略（如剪枝和知识蒸馏
    [6]）可以在不丢失环境复杂性的情况下压缩神经网络。知识蒸馏策略在分类任务中已验证，例如通过从较大的教师网络迁移知识来训练较小的学生网络。然而，原始的蒸馏仅适用于教师模型的分类决策，而我们通过迁移特征的中间表示来解决这一问题。


    受蒸馏的启发，我们为 SR 设计了一种具有轻量级参数和计算复杂度的多级监督网络（MSCN）。在所提出的


    本工作受到 Mo-CMCC “人工智能”项目（No. MCM201902071）以及中央高校基础基金 2019PTB-011 支持。


    ![](img/060e02dbf42b9cd7f6610eef7f204cff_1_0.png)


    图 1：所提出的 RMUN（用于 x2 SR）架构。


    MSCN，我们采用了一个紧凑模型，它不仅受 HR 标签监督，还受教师模型的中间表示监督。我们将 SR 网络分为特征提取和重建两部分。在 MSCN 中，我们采用了两个从
    MSR [7] 修改的特征块，充分利用了 MobileNet。我们利用 8 个 MSR 块进行特征提取。PixelShuffle 模块用于 MSCN 和教师模型的重建中。考虑到
    SR 问题的特性，我们将浅层 LR 特征、LR 重建特征的信息从紧凑模型进行转移，以对齐紧凑模型与教师模型之间的特征，因此我们提出了一种由弱监督成对随机场启发的成对监督。为此，我们优化了一种结合了一致性损失任务与任务级特征成对损失的方法。值得注意的是，与真值（ground
    truth）结合的任务级回调是可选的。我们可以将我们的方法应用于未标记数据，并在标记数据有限的情况下，通过调优良好的教师模型进一步提高性能。


    在 PSNR 和 SSIM 方面的提升幅度相当。例如，我们的 MSCN 在 Urban100 数据集上 2x SR 上通过应用多级监督在 PSNR 上表现更好。另一方面，MSCN
    相比 VSR 少了近 64%，相比 LapSRN 少了 10%。与 SRCNN 和 FSRCNN [9] 相比，我们的 MSCN 在 Urban100 数据集上
    4x SR 有约 0.6 到 0.9 dB 的提升。本文的主要贡献如下：


    - 我们提出了受知识蒸馏启发的多级监督策略。

    - 我们设计了一种特征损失函数，强制紧凑模型和教师模型输出的一致性。

    - 我们在基准数据集上进行了多次实验，证明了我们方法的有效性。


    ## II. 方法


    我们在基准数据集上使用质量指标 PSNR 和 SSIM 全面评估了我们的 MSCN。我们在 2x、3x 和 4x SR 上进行了比较。模型是预训练的。然后，在
    HR 标签和教师模型的中间表示监督下训练了 MSCN。另一方面，结果表明我们的方法优于没有多级监督的紧凑网络。在本节中，我们首先引入了知识蒸馏方法。输入一个大小为
    $W \times H$ 的通道图像。然后我们提取大小为 $W \times H$ 的特征图 $F$，其中 $N$ 是通道数。提取多个特征模块。特征提取后，我们采用
    PixelShuffle 生成大小为 $W \times H$ 的重建结果。多级特征和超分辨率结果被用于知识。


    表 I：Set5、Set130 和 Urban100 上 x2、x4 的基准结果。PSNR/SSIM。


