    Fig. 1: Architecture of the proposed RMUN(for x2 SR).


    MSCN, we employ a compact model which is not only supervised by the HR label,
    but also by the intermediate representation of a cumbersmodel. We divide SR network
    into two parts feature extraction and the reconstruction. In MSCN, we employ two
    feature blocks which were modified from MSR [7] by making full use of the MobileNet.
    We utilize eight blocks for MSR for feature extraction. The PixelShuffle module
    is used in the reconstruction of both MSCN and the cumbersmodel. Considering the
    characteristic of SR problem, we transfer the information of shallow LR features,
    LR reconstruction features from the compact model to align the features between
    the compact and the cumbersmodel, so we present a pairwise supervision motivated
    by weakly supervised pairwise random field. To this end, we optimize a method
    that combines a consistency loss task with the task-level feature pair-wise losses.
    It is worth noting that the task-level callback with ground truth is optional.
    We can apply our method to unlabeled data and further improve the performance
    by a well-tuned cumbersmodel on which the labelled data is limited.


    margin in terms of PSNR and SSIM. For instance, our MSCN is better in PSNR on
    the Urban100 datasets for 2x SR by applying multi-supervisions. On the other hand,
