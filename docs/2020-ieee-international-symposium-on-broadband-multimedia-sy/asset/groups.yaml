    We propose the multi-level supervised strategy which is inspired by the knowledge
    distillation for compact SR networks.


    We devise a pairwise feature-wise loss function, enforcing consistency between
    the outputs of the compact and cumbersmodel networks.


    We demonstrate the effectiveness of our proposed method by conduct several comprehensive
    experiments on benchmark datasets.


