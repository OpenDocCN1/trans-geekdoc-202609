  md: '![](img/060e02dbf42b9cd7f6610eef7f204cff_1_0.png)


    Fig. 1: Architecture of the proposed RMUN(for x2 SR).


    MSCN, we employ a compact model which is not only supervised by the HR label,
    but also by the intermediate representation of a cumbersmodel. We divide SR network
    into two parts feature extraction and the reconstruction. In MSCN, we employ two
    feature blocks which were modified from MSR [7] by making full use of the MobileNet.
    We utilize eight blocks for MSR for feature extraction. The PixelShuffle module
    is used in the reconstruction of both MSCN and the cumbersmodel. Considering the
    characteristic of SR problem, we transfer the information of shallow LR features,
    LR reconstruction features from the compact model to align the features between
    the compact and the cumbersmodel, so we present a pairwise supervision motivated
    by weakly supervised pairwise random field. To this end, we optimize a method
    that combines a consistency loss task with the task-level feature pair-wise losses.
    It is worth noting that the task-level callback with ground truth is optional.
    We can apply our method to unlabeled data and further improve the performance
    by a well-tuned cumbersmodel on which the labelled data is limited.


    margin in terms of PSNR and SSIM. For instance, our MSCN is better in PSNR on
    the Urban100 datasets for 2x SR by applying multi-supervisions. On the other hand,
    MSCN is nearly 64% less than the VSR and 10% less than LapSRN. Comparing to SRCNN
    and FSRCNN [9], our MSCN has about 0.6 to 0.9 dB improvement on the Urban100 dataset
    for 4x SR. The main contributions of this paper are summarized as follows:


    We propose the multi-level supervised strategy which is inspired by the knowledge
    distillation for compact SR networks.


    We devise a pairwise feature-wise loss function, enforcing consistency between
    the outputs of the compact and cumbersmodel networks.


    We demonstrate the effectiveness of our proposed method by conduct several comprehensive
    experiments on benchmark datasets.


    # II. METHOD


    We comprehensively evaluate our MSCN on benchmark datasets with using image quality
    metrics: PSNR and SSIM. We compare performance on 2x, 3x, and 4x SR. The model
    is pre-trained by the DIVK2 training datasets. Then the MSCN is trained under
    the supervision of HR label and intermediate representation of a cumbersmodel.
    On one hand, the results show that our proposed method outperforms the compact
    network which is without multi-level supervision by a comparable


    In this section, we first the introduced knowledge distillation method for super-resolution.
    An image takes the Y-channel of size W x H as input. Then we extract a feature
    map F of size W x H, where N is the number of channels. Multiple feature modules
    are extracted for feature extraction. After the feature extraction, we adopt PixelShuffle
    module generating the super-resolution result of size SW x SH x N for image reconstruction.
    Both the multi-level feature and the super-resolution result are applied for the
    knowledge distillation.'
