    Abstract—Design of neural networks with model size, light computation cost and
    high performance, attracted much due to the needs of mobile devices. In inspired
    by knowledge distillation, we design a multi-level supervised network (MSCN) with
    lightweight parameters and computational complexity. Comprehensively evaluate
    our method on benchmark datasets with two widely used methods: FSRN and EDSR.
    Our method outperforms the context network without multi-level supervisions by
    a comparable margin in terms of PSNR and SSIM.


    Index—Super-Resolution, Knowledge Distillation, Deep, Light-Weight


    Deep neural networks are the dominant solutions since Dong et al. [1] first introduce
    convolutional networks into SR which significantly outperforms traditional methods.
    Kim et al. [2] propose a very deep CNN model named VDRN, which adopts residual
    learning and depth recursive convolutional network (DRCN). EDSR [4] removes the
    normalization layers by ResNet [5] and employs deeper and wider network structures.
    These methods perform well in signal-noise performance (PSNR) and structural similarity
    (SSIM), they still have drawbacks. Firstly, the performance comes at the cost
    of large parameters and computation time, which makes it less applicable in practice,
    such as mobile and embedded vision. Secondly, the more the network is, the more
    sensitive the performance is to structural changes. Then, it is difficult to reproduce
    the level of the original paper due to the lack of network configuration. To tackle
    these issues, it is possible to design networks with fewer parameters and complexity.


    # I. INTRODUCTION


    Ultra-High-Definition (UHD) video has been extensively accepted by the populations,
    now it is the mainstream in the broadcasting industry. However, the 4K content
    is still short due to the limited adoption of UHD video capture and production,
    as well as large-resolution (LR) archives. There is an urgent need for Super-Resolution
    (SR).


    Image is based of video, so SR on images in paper is our initial task. SR is a
    fundamental problem in computer vision, which learns a mapping from LR to HR (high-resolution)
    image. However, this inverse problem is ill-posed since the mapping between LR
    and HR has multiple solutions. Besides, it needs to predict specific values for
    each LR image to form the corresponding image.


    Recently, design of neural networks with model size, light computation cost and
    high performance, attracted much due to the needs of mobile devices. Most current
    efforts have been to designing light weight networks, such as MobileNet [4]. Advanced
    strategies, like pruning and knowledge distillation [6], can compress neural networks
    without losing complexity of the circumstances. The knowledge distillation strategy
    has been verified in classification tasks, such as training a smaller student
    network by transferring knowledge from a larger teacher network. However the original
    distillation only applies the classification decision of the teacher model works
    to tackle this issue by transferring intermediate representations of features.


    Inspired by distillation, we design a multi-level supervised network (MSCN) for
    SR with lightweight parameters and computational complexity. In the proposed


