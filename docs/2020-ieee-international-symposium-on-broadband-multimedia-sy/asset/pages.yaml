    # III. EXPERIMENT


    In this section, we first perform the training and testing used in method. The
    details of our training strategy are presented. We evaluate the manifestation
    of our method on standard benchmark datasets. We discuss the effect of multiple
    components of our network.


    # A. Datasets


    For a fair comparison we use the datasets from Li et al. [8] for reference testing.
    Note that the testing datasets include 291 images, where 91 images are from Meng
    et al. (T91) and (T12), and the other 200 images are from Berkeley University
    datasets [10], [13]. Testing is executed on four widely applied benchmark datasets:
    Set5, Set14, BSD100, and Urban100, which involve 5, 4, 100, and 100 images, respectively.
    The Set5, Set14, and BSD100 consist of natural surfaces, and the Urban100 consists
    of challenging images with different frequencies in.


