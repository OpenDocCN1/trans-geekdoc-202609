    \ utilize the knowledge distillation strategy method to transfer the knowledge\
    \ of a large teacher super-resolution network T to a compact network S for better\
    \ training compact super-resolution. We directly use loss function to measure\
    \ the difference between the teacher model and the student model.\n\nThe loss\
    \ function is:\n\n```\n$L_{ps} = ||F_t - F_s||_2^2, \\quad (1)$\n```\n\nwhere\
    \ $F_t$ denotes the average feature of the teacher network and $F_s$ represents\
    \ the average feature of the student model.\n\n### A. Multi-level knowledge distillation\n\
    In addition to above straightforward pixel-wise distillation, we present a structured\
    \ knowledge distillation scheme: pixel-wise distillation. The pipeline is illustrated\
    \ in figure 1.\nWe split the feature map into multiple domains, which are denoted\
    \ by the dense spatial-wise pairs. Each domain represents different spatial locations\
    \ and the connection between two domains represents the similarity. We denote\
    \ the common range as $R$ and the size of each domain as $S$. We only consider\
    \ similarities with top-$\\alpha$ near domain restricted to spatial distance and\
    \ $\beta$ pixels in a spatial location to represent the feature of this domain.\n\
    \nLet $\\alpha_i^j$ and $\beta_i^j$ denote the similarity between the $j$-th domain\
    \ from the teacher network T and the compact network S. The loss follows:\n\n\
    ```\n$L_{po} = \\frac{1}{N} \\sum_{i=1}^N \\sum_{j=1}^M (\\alpha_i^j - \\beta_i^j)^2,\
    \ \\quad (2)$\n```\n\nwhere $R = [1, 2, ..., N]$ denotes all the domains. In our\
    \ implementation, we use region pooling to aggregate $\\alpha$ and $\beta$ features\
    \ in one domain to $1 \\times S$, and the similarity between two domains is computed\
    \ from the aggregated features.\n\n# ### B. Network structure\n\nWe design a multi-level\
    \ supervised compact network (MSCN) for training with lightweight parameters and\
    \ computational complexity. In the proposed MSCN, we employ a compact model which\
    \ is not only limited by its HR header,\n\n**Pixel-wise attention**: In the teacher,\
    \ we utilize the cumbersmodel. We devise SR network architecture into two parts:\
    \ the feature extraction and the reconstruction.\n1) **The teacher network**:\
    \ In cumbersmodel, we utilize each block for feature extraction. The PixelShuffle\
    \ module is used in the reconstruction of each model.\n2) **The student network**:\
    \ In MSCN, we employ two blocks which are modified from MSR by making full use\
    \ of MobileNet. We use deep separable convolution to reduce parameters and complexity.\n\
    3) **Knowledge distillation**: Considering the characteristic of SR problem, we\
    \ transfer the knowledge of LR features, LR features and reconstructions from\
    \ the teacher to the student. The goal is to align the feature of the compact\
    \ model and the cumbersmodel, so we devise a pairwise supervision loss function\
    \ which is motivated by the dense-wise pairwise random field. We then define an\
    \ objective that combines a conventional loss with the multi-level pixel-wise\
    \ loss features. It is worth noting that the MAE pixel-wise loss features is not\
    \ optimal. However, using the MAE loss calculated with ground truth is optimal.\
    \ We can apply our method to supervise by a well-trained cumbersmodel when the\
    \ labeled data is limited.\n\nWhile reported in [17] MAE loss could reach a better\
    \ local minimum with fast convergence, it is to be more robust than MSE loss.\
    \ So we use MAE loss in first part, it is formulated as:\n\n```\n$L_{MAE} = \\\
    frac{1}{N} \\sum_{i=1}^N ||I_i - \\hat{I}_i||_1, \\quad (4)$\n```\n\nwhere $I_i$\
    \ denotes the ground truth image and $\\hat{I}_i$ is the predicted HR. It refers\
    \ to the patch size."
