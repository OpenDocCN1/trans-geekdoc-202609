  \ Radio Free Asia, 2012 年 6 月 20 日访问，http://web.archive.org/web/20120620231727/http://f2c.rfa.org:80/index.html）。国务院还在华盛顿特区设立了一个“风险投资式”的部门，将资深外交政策业务人员与年轻、时髦的科技人员配对，让他们研发各种利用社交网络力量的设备。其中一项被《纽约时报》描述为“像间谍小说中的行动”的倡议（由“看起来像是车库乐队的年轻企业家”组成），涉及创建一种被称为“手箱里的互联网”的设备——这种设备可以走私进入某个国家并拆封，提供即时的无线互联网网络，任何带有\
  \ WiFi 连接的设备都可以共享，然后连接到世界的其他部分。其目的在于削弱外国政府通过关闭互联网来阻止反对运动的能力。随后——国务卿希拉里·克林顿将此类项目作为其互联网自由政策的核心。对她来说，这关乎政权更迭，而是关于帮助全球的人相互交流。“我们看到全球范围内越来越多的人使用互联网、手机手机和其他技术来发出他们的声音，抗议不公并实现他们的愿望，”她告诉《纽约时报>。“所以我们专注于帮助他们做到这一点，帮助他们相互交流，与他们的社区、他们的政府以及世界进行交流。”Glanz\
  \ and Markoff，“U.S. Underwrites Internet Detour.”\n\n# 117. 自由亚洲电台的第一版本于 1955 年关闭，因为该机构意识到中国人太穷了买不起收音机，而且没有人听他们的广播（“全球宣传网络建立在……”\
  \ **New Times*, 1977 年 12 月 26 日）。第二代自由亚洲电台十年后出现，这次通过更模糊的组织获得资助，这些组织与韩国政府、韩鲜明统一教和中央情报局有关（SAC,\
  \ 旧金山，“致 FBI 局长备录，主题：Moon-Myung，”1975 年 10 月 6 日，https://surveillancevalley.com/content/citations/moon-sun-myung-fbi-october-1975.pdf）。在\
  \ 20 世纪 60 年代，自由亚洲电台作为越南战争心理战的一部分。根据 FBI 的说法，它“在华盛顿制作反共节目并将其发射到中国、朝鲜”（Scott Armstrong\
  \ and Charles R. Babcock，“前局长透露 KCIA 行动，”*华盛顿邮报》，5 月 6 日）。它获得了尼克松总统政府内部的高层支持，甚至让议员杰拉尔德·福特担任其董事成员（Robert\
  \ Parry，“明教父的阴暗面：真相与谎言，”Consortium, 1997，https://www.consortiumnews.com/archive/moon4.html）。但这个版本的自由亚洲电台在接受司法部调查后也关闭了，该调查是对韩国政府试图影响美国舆论的大规模调查的一部分（韩美关系调查：国际关系委员会国际组织小组报告，H.R.\
  \ Rep. [1978 年 10 月 31 日]，https://archive.org/stream/InvestigationOfKorean%20AmericanRelations#page/0/2）。\n\
  \n# 118. 自由亚洲电台由美国国会创建，由广播理事会理事会管理和资助，但它也被组织为一个私人非营利机构。这种奇特的结构使自由亚洲电台免受公众问责，使其能够声称豁免《信息自由法》。这种私人、不透明的结构提醒我，在冷战期间，CIA\
  \ 通过私人基金会向其全球宣传站网络输送资金，这些基金会是为了掩盖该机构的参与而设计的。自由亚洲电台似乎参与了类似的传统。当我尝试向自由亚洲电台请求记录并告知它免于这项联邦法律时，我付出了惨痛代价得知了这一点。\n\
  \n# 119. “正如极其成功的自由欧洲和自由电台从冷战业务中退役一样，自由亚洲电台在地球另一端接过了战斗，”连载专栏作家 Georgie Anne Geyer\
  \ 宣布道，并将该电台称为“暴政的敌人”。Georgie Anne Geyer，“Enemy of Tyranny，”Universal Press Syndicate，1997\
