  \n2014 年 2 月 18 日，市议会厅内座无虚席。这项监控计划已经让整座城市动荡了数月，愤怒情绪现在已显露出来。居民们、宗教领袖、工会活动人士、戴面具的活动人士以及美国自由联盟的代表聚一堂，为了阻止领域感知中心（DAC）而并肩作战。一位穿着棕色西装、戴着眼镜的市政府官员走上台，试图安抚焦虑的群众，称领域感知中心的设计是为了保护他们，而不是监视他们。“这不是一个融合中心。我们没有与国家安全局、中央情报局或联邦局共享数据库的协议，”他说。\n\
  \n大厅陷入一片混乱。观众并不买账。人们嘘着、、唏嘘声。“这都是为了监控抗议者，”有人在阳台上尖叫道。一个戴着面具的年轻人冲向房间前方，威胁性地将智能手机顶在官员脸上，快门拍照。“这种感觉如何？你们喜欢吗——被全天候地监视！”他大喊道。一个中年男子——光头、戴着眼镜、穿着皱巴巴的卡其裤——走上台，对市领导进行了严厉指责。“你们这些议员竟然认为，奥克兰警察局——一个在侵害奥克兰居民权利方面有着无比拟的历史、甚至连自己的政策都无法遵守（无论是人群控制还是执法记录政策）的部门——竟然可以被信任使用\
  \ DAC？”他离开时留下一句响亮的口号：“只有死掉的 DAC 才是好 DAC！”现场掌声如雷。\n\n奥克兰是美国多元化程度最高的城市之一。它还坐落着暴力且往往不负责任的警察局，该部门在联邦监管下已运行十多年。执法滥用正发生在日益加剧的士绅化背景下，这种现象是由当地互联网热潮以及随而来的房价上涨推动的。在旧金山，像米金区（Mission\
  \ District）这样曾是充满活力的拉丁裔社区的地区，现在已变成了公寓、阁楼和高档美食酒馆。老师、艺术家、老年人以及任何没有六位数高薪的人都生活得异常艰难。奥克兰曾一度逃离了这种命运，但现在也感受到了这种冲击。\n\
  \n\n\n\n那天晚聚集在市政厅的人们将奥克兰的 DAC（数据分析中心）视为由技术驱动的士绅化的延伸，这种士绅化正将贫困的长期居民赶出城市。“我们并不傻。我们知道其目的是监控穆斯林人、黑人和有色人社区以及抗议者，”一位戴着头巾的年轻女性说道。“这个中心的建立，你们正试图将奥克兰开发为旧金山专业人士的乐场和卧室社区。这些努力要求你们让奥克兰变得更安静、更白、不那么可怕且更富有——这意味着要赶走穆斯林人、黑人和有色人以及抗议者。你们知道这一点，开发商也知道。我们在会议上听过他们。他们很害怕。他们口头上承认了这一点。”\n\
  \n她说很有道理。几个月前，两名奥克兰的调查记者获得了一批涉及 `DAC` 的城市规划内部文件，发现市政府官员似乎更感兴趣于利用拟议的监控中心来监控奥克兰码头的政治抗议活动和工会活动，而不是为了打击犯罪。²\n\
  \n还有另一个问题。奥克兰最初将 `DAC` 的开发外包给了 `Science Applications International Corporation`，这是一家总部位于加利福尼亚的大型军事承包商，它为\
  \ `National Security Agency` 执行的工作之多，以至于在情报业界被称为“西岸 NSA”。该公司也是 `CIA` 的主要承包商，参与了从监控作为该机构“内部威胁”计划一部分的机构员工，到运行\
  \ `CIA` 的无人机暗杀机队等一切业务。多位奥克兰居民走来指责市政府与一家在美国军事和情报机构中如此不可或缺的公司合作的决定。“SAIC 为阿富汗无人机计划提供电信支持，那项计划已经杀杀了一千多名无辜平民，其中包括儿童，”一个穿着黑色毛衣的男人说。“而你们选择了这家公司？”\n\
  \n我惊讶地环顾四周。这里本应是所谓进步派旧金山湾区的核心，然而该市却计划与一家强大的情报承包商合作，建立一个警察监控中心，如果媒体报道属，官员想用它来监视和监控当地人。当晚某些事情让这一场景变得更加诡异。多亏一位当地活动人士提供的线索，我得知奥克兰一直在与\
  \ `Google` 接洽，要求演示产品，这似乎是该公司试图获得 `DAC` 合同部分的尝试。\n\n`Google` 可能正在帮助奥克兰监视其居民？如果属实，这将极具杀伤力。许多奥克兰人将\
  \ `Google` 等硅谷公司视为房价飙升、士绅化和激进执法的主要驱动力，这些因素让贫困和低收入居民的生活痛苦不堪。事实上，就在几周前，抗议者在一位富有 `Google`\
  \ 经理的当地家外示威，该经理亲自参与了附近的一项豪华房地产开发。\n\n在当晚混乱的市议会期间，`Google` 的名字从未出现过，但我设法获得了一份 `Google`\
  \ “战略合作伙伴经理”与一位领导 `DAC` 项目的奥克兰官员之间的简短邮件往来，其中暗示了某些正在进行中的。³\n\n在市议会后的几周里，我试图弄清这种关系。`Google`\
  \ 为奥克兰警察监控中心提供了什么样的服务？会话进展到什么程度？是否有成果？我对奥克兰的要求被忽视了，`Google` 也没有于交流——试图从这家公司获得答案就像是在对着空气说话。\n\
  \n（注：输入文本包含重复段落；我已根据叙述流对对提供的核心内容进行了处理。）\n\n当时，我是 `Pando` 的记者，那是一本虽小但无畏的旧金山杂志，负责政治和商业报道。我知道\
  \ `Google` 的大部分收入是通过一套追踪用户及其兴趣的定向广告系统获取的。`Google` 是世界上最富有、最有力的公司之一，但它却把自己塑造成一个好人的形象：一家致力于让世界变得更好的公司。\n\
  \n尽管奥克兰的监控中心被搁置了，但问题仍然存在：一家痴迷于“不作恶”形象的 `Google` 能提供什么？\n\n\n\n\n\n随便拿起一本关于互联网的流行通史，你通常会发现两种叙述的结合，它们描述了这种计算机网络技术的来源。第一种叙述是：它源于军对一个能够在核爆炸中生存的通信网络的需求。这导致了早期互联网的发展，最初被称为\
  \ `ARPANET`，由五角大部的高级研究计划署（现称为国防高级研究计划署，简称 `DARPA`）建造。该网络于 20 世纪 60 年代后期上线，其特点是去中心化的设计，即使网络部分地区被核爆炸摧毁，它也能路由信息。第二种叙述是占据主导地位的，认为早期互联网根本没有任何军事应用。在这一版本中，`ARPANET`\
  \ 是由激进的年轻计算机工程师和爱玩的黑客建立的，他们深受旧金山湾区那种沉浸在迷幻药物中的反主流文化的影响。他们根本不在乎战争、监视或任何类似的事情，而是梦想着通过计算机媒介的乌托邦来让军队变得过时。他们建立了一个民用网络来将这一未来变为现实，而正是这一版本的\
  \ `ARPANET` 演变成了我们今天使用的互联网。多年来，这些历史解释之间一直在发生激烈冲突。如今，大多数历史书都提供了这二者的结合——承认第一种，但更多地倾倾向于第二种。\n\
  \n我的研究揭示了早期互联网创建中的第三条历史线索——这一线索几乎从历史书中消失了。在这里，动力与其说是源于生存核攻击的需求，不如说是源于反叛的黑暗军事艺术以及美国对抗全球共产主义全球扩张的斗争。20\
  \ 世纪 60 年代，美国是一个全球大国，监管着一个日益动荡的世界：从南美到东南亚以及中东，针对美国盟友政府的冲突和地区叛乱不断发生。这些并非涉及大军的传统战争，而是游击战和局部叛乱，经常发生在美国人此前几乎没有经验的地区。这些人到底是谁？他们为什么要叛乱？可以做些什么来阻止他们？在军事圈内，人们认为这些问题对于美国的平定工作至关重要，有些人认为，回答这些问题的唯一有效方法是开发和利用计算机辅助信息技术。\n\
  \n互联网就诞生于这种努力：它试图建立一种能够收集和共享情报、实时监控世界、并研究和分析个人及政治运动的计算机系统，最终目标是预测和防止社会动荡。甚至有人梦想创造一种针对人类社会的早期预警雷达：一个网络化的计算机系统，监控社会和政治威胁并对其进行拦截，方式与传统雷达拦截敌方飞机非常相似。换句话说，互联网从一开始就被硬性设定为一种监视工具。无论我们今天用网络做什么——约会、导航、加密聊天、电子邮件，或仅仅是看新闻——它始终具有根植于情报收集和战争的双重属性。\n\
  \n当我追溯这段被遗忘的历史时，我发现自己与其说是在发现新事物，倒不如是在揭示一些在不久前对许多人来说显而易见的事物。从 20 世纪 60 年代初的美国开始，对计算机数据库和网络技术的扩散产生了一种巨大的恐惧。人们担心这些系统将用于公司和政府用于监视和控制。事实上，当时的主流文化观点是，计算机和计算技术——包括\
  \ `ARPANET`（即将发展成我们今天使用的互联网的军事研究网络）——是压迫的工具，而非解放的工具。\n\n在调查过程中，我由衷震惊地发现，早在 1969\
  \ 年，即 `ARPANET` 上线的第一年，麻省理工学院和哈佛大学的一些学生就试图关闭他们大学在 `ARPANET` 伞下进行的的研究。他们将这种计算机网络视为一种混合的公私监视与控制系统的开始——他们称之为“计算机化的人类操控”——并警告说它将被用于监视美国人并对进步运动发动战争。\n\
  \n\n\n第一批结果出现在 1961 年 8 月 10 日，当时一架形似巨型鱼的西科斯 H-34 直升机懒洋洋地升入西贡上方，向着边界老挝和柬埔寨的深不可测的丛林走去。一旦飞行员锁定目标，他发出了信号，机组人员便开启了安装在飞机底部的特殊农用喷雾器。在缓慢的扫描运动中，他们向下方的丛林喷洒了高毒性落叶剂实验混合物。其中就臭名昭昭的`Agent\
  \ Orange`。闻过它的人说，那味道像香水。\n\n美国当时尚未正式对越南宣战。然而，多年来，美国一直在该地区输送资金和武器，帮助法国对抗北越。北越是由胡志明领导的共产主义革命国家，正为了重新统一国家并驱逐殖民统治者而战斗。现在，当戈德尔的团队向下方的丛林喷洒时，美国正在增加资金和武器上的支持。成千上万的军事“顾问”被派往南越，以扶持吴文哲的傀儡政府，希望阻止美国人眼中席卷而来的全球共产主义浪潮。\n\
  \n在印度支那酷热的丛林中，战斗并非易事。茂密的植被覆盖是一个持续的问题。这是反抗者最大的战术优势之一，让他们能够在不被察觉的情况下通过邻国老挝和柬埔寨移动人员和物资，并在南越领土深处发动致命的袭击。通过`Project\
  \ Agile`，戈德尔决心夺走这一优势。\n\n大英帝国曾先驱将落叶剂作为化学战争的一种形式，将其用于对反对殖民统治的当地运动。在与马来亚的共产主义反抗者的战斗中，英国无情地部署了这些物质来破坏食物供应和丛林掩护。英国军事规划者将落叶剂描述为“对一个顽固国家的一种制裁形式，比封锁更快，且比原子弹不那么反感”。\n\
  \n戈德尔遵循了英国的脚步。在`Project Agile`下，马里兰州德特里克堡的一处美国陆军秘密实验室的化学家测试并分离了可以腐蚀茂密丛林覆盖的潜在落叶剂化学品。这些化学品被飞往西贡进行实地测试。它们的效率是残忍的。叶子在被喷洒几周后掉落，使树冠变得光秃。第二次喷洒增加了效果并永久地杀死了许多树。轰炸该地区或用凝固汽照明也让这种落叶变得某种程度上永久。随着测试成功，戈德尔制定了雄心勃勃的计划，要用化学落叶剂覆盖南越的一半。想法不仅是破坏树木覆盖，还要破坏农作物，以使北越屈服。\n\
  \n南越总统吴文哲支持这一计划。1961 年 11 月 30 日，肯尼迪总统签署了该计划。多亏戈德尔和`Project Agile`，“牧场主行动”（Operation\
  \ Ranch Hand）启动了。\n\n`Ranch Hand`于 1962 年开始，一直持续到十年后战争结束。在此期间，`C123`飞机向一个区域倾了二十加仑的`Agent\
  \ Orange`。`Agent Orange`强化了`Agent White`、`Agent Pink`和`Agent Blue`。这些化学品由`Dow`和孟山托等公司生产，将大片茂盛的丛林变成了荒芜的景观。\n\
  \n“牧场主行动”是无情的，并且违反了《日内瓦公约》。它仍然是越南战争中最耻的章节之一。国防部创建了高级研究计划署（`ARPA`——今天广为人知的`DARPA`），诞生于\
  \ 1958 年，旨在保护美国免受苏联威胁。其计划包括`Project Agile`和“指挥与控制”，侧重于开发先进技术。\n\n\n1957 年底，美国人眼睁睁看着苏联发射了第一颗人造卫星`Sputnik`（卫星一）。卫星很小，大约排排球大小，但它被安置在一枚洲际弹道导弹之上。`Sputnik\
  \ 1`是苏联的胜利，这种感觉是对公众特殊优越感的一种冒犯。\n\n总统德怀特·艾森豪被指责玩忽职守而受到攻击。将军们和政治家编造了苏联即将征服的故事，并敦促增加国防支出。甚至副总统理查德·尼克松也批评了艾森豪，告诉商业领袖，美国与苏联之间的技术差距大到无法期待减税。\n\
  \n随着公众对这一重大失败感到愤恨，艾森豪知道他必须做一些重大的、公开的事来挽回面子。新任命的国防部长尼尔·麦克罗伊有一个计划。\n\n麦克罗伊衣着得一丝不苟，头发梳得整齐并从中间分开，他有着一个高层广告执行官的外表和举止。事实上，在艾森豪任命他主管国防部之前，他正是如此。在担任宝洁（`Procter\
  \ and Gamble`）总裁期间，麦克罗伊的标志性创新是资助“肥皂剧”——一种为家庭主妇定制的廉价白天剧——将其作为公司精选肥皂和家用清洁剂的纯营销工具。\n\
  \n\n\nARPA 的理念非常简单。它将是一个位于五角大楼内部的民事领导机构。它将非常精简，人员极少但预算巨大。尽管它不会建造或运行自己的实验室和研究设施，但它的运作像一个执行管理枢纽，确定需要做什么，然后将实际工作外包给大学、私人研究机构和军事承包商。\n\
  \n这个计划得到了艾森豪威尔总统的青睐，他不信任军队各个部门之间为了资金和权力而进行的世俗斗争——他认为这导致了预算膨胀，并在无用的项目上浪费了金钱。将研发外包给私营部门的想法也吸引了商界。然而，军方高层对此并不太高兴。空军、海军、陆军和参谋长部都对平民人士坐在他们头上并指挥他们行事的想法感到反感。他们担心失去对技术采购的控制，而那是一个利润丰厚的厚的权力中心。\n\
  \n军方对麦克罗伊的计划了抵制。与军队的冲突如此巨大，以至于在艾森豪威尔 1958 年的国咨演讲中被提到：“我今天并不试图对有害的部门竞争指控做出判断。但有一点是肯定的。无论它们如何，美国都希望它们停止。”他如愿了。1958\
  \ 年 2 月 11 日，在国咨演讲一个月后、`Sputnik` 发射五个月后，国会会将 ARPA 写入美国空军的拨款案，给予了它 5.2 亿美元的初始资金，并制定了一个高达\
  \ 20 亿美元的巨大预算计划。\n\n麦克罗伊选择了通用电气的高管罗伊·约翰逊来领导这个新机构。五角大楼的一份内部报告将他描述为“极其自信、冷静、帅得惊人的人，看起来完全像《财富》杂志封面上的大亨亨。”报告还提到，他对自己接这份工作的唯一担心是可能会失去一个利润丰厚的税收漏洞：“约翰逊也是非常富有的人，放弃了一份薪\
  \ 15.8 万美元的工作来接受 ARPA 一份 1.8 万美元的职位。出于税务考虑，他接受 ARPA 的工作条件是，允许他在康涅狄格州待最少几天。这意味着他通常在周五离开华盛顿，周一或周二返回。他经常使用私人飞机。”保护美国免受苏联入侵很重要。但人必须顾及自己的税单。\n\
  \n在存在的最初几年里，ARPA 承担了一系列重要项目。它有一个太空部门负责开发弹道导弹。它从事间谍卫星、气象卫星以及卫星跟踪系统的研究，并为人类进入太空做了早期准备工作。它还协助执行了核试验，例如“阿尔戈斯行动”（Operation\
  \ Argus），该行动涉及在南大海上空大气层高层爆炸几枚小型核弹，激进地试图创建一个不可见的带电粒子屏障，以摧毁任何穿过该区域核弹头的电子设备。\n\n有了所有这些项目，ARPA\
  \ 似乎有一个辉煌的开端，但这种兴奋并没有持续多久。五角大楼内部的内斗以及一个去军事化的 NASA（美国国家航空和空间管理局）的建立，吸走了该机构的资金和声望。在成立不到一年的时候，ARPA\
  \ 的预算被削减到仅剩 1.5 亿美元——与其承诺的 20 亿美元预算相比，简直是杯水车。在接下来的几年里，它经历了三任主任的更替，并为了生存而战。每个人都确信\
  \ ARPA 正在通往坟墓。\n\n然而，有一个人拥有拯救它的计划：威廉·戈德尔。\n\n# 未来战争\n\n威廉·戈德尔身高 5 英 10 寸，杏仁眼，留着平头，举止优雅且富有知性，看起来像一个衣着考究的学者或可能是一个初级外交官。他于\
  \ 1921 年出生于科罗拉多州博尔德，毕业于乔治敦大学，在战争部从事军事情报工作。在日本袭击珍珠港后，他被征入美国海军陆战队成为军官，并在太平洋南部战斗，在那里他的腿部中了一子弹，那次伤让他终身残疾。战后，他在军事情报部门一路晋升，在\
  \ 30 岁之前就升到了 `GS-18` 级——这是政府员工的最高薪资职级。\n\n多年来，戈德尔的秘密生涯经历了一系列剧烈且往往是离奇的转折。他在国防部办公室工作，在\
  \ `CIA`、`NSA` 和陆军之间进行联系，并成为心理战专家。他与朝鲜谈判以带回在朝鲜战争期间被俘的美国士兵，他协助管理位于西德国的前纳粹 `CIA` 资产，并参加了一项绘制南极洲地图的机密任务。（为此，有两个冰川以他的名字命名：`戈德尔湾`和`戈德尔冰港`。）他那传奇的军事情报生涯的一部分是担任埃尔斯基将军的助理，埃尔斯基是一位脾气古怪的海军陆战队老将，拥有丰富的反叛乱历史。埃尔斯基领导五角大楼的特别行动办公室，该办公室负责心理战、情报收集和黑色行动。\n\
  \n1950 年，戈德尔随埃尔斯基将军前往越南执行一项秘密任务。目标是评估法国人用于平息日益增长的反殖民主义起义的军事战术的有效性，并确定美国应该提供何种支持。这次旅程的开端很糟糕，他的小组险些逃过了一次暗杀：：三枚炸弹炸破了他们西贡酒店的大堂。。这是一场体面的欢迎仪式——没有人知道炸弹是北越南人还是他们的法国主东放置的，以此作为警告他们应该管好自己的事。无论是哪种情况，小组都继续前进。他们潜伏在法国殖民军队中，并参观了他们的基地。在一次外活动中，埃尔斯基小组随一支受过法国训练的越南部队进行夜间伏击。他们的目标是抓捕几名反叛分子进行审讯和情报收集，但这次情报任务很快演变成了一场充满愤怒的恐怖袭击。受法国支持的越南士兵在反叛分子被审问情报之前就砍了他们的俘虏。\n\
  \n在那里，在闷热潮湿的丛林中，戈德尔和他的团队意识到法国人一直做错了。法国军事努力的大部分似乎集中在保护他们的补给线线上，而这些线路不断受到大规模游击部队的攻击，这些部队似乎从丛林中出现，在三英公路上部署了多达六千名士兵。法国人基本上被困在他们的防御工事中。他们“失去了大部分进攻精神”，被“困在他们的占领地区”，戈德尔的一位同事描述道。\n\
  \n“在戈德尔看来，法国殖民者正试图根据殖民战争规则与越盟游击队战斗。但那些从法国军队获得武器和训练的南越南人实际上在根据不同的规则进行一种不同的战争，”安妮·雅各布森写道，她在关于\
  \ ARPA 的历史著作《五角大楼大脑》中挖掘了威廉·戈德尔被遗忘的故事。\n\n这种“不同的战争”有一个名字：反叛乱。\n\n\n\n戈德尔意识到，美国正与全球各地的起义力量处于蓄意的碰撞之中：东南亚、中东和拉丁美洲。他支持这种碰撞。他也开始理解，这些新战争所需的战术和策略并非第二次世界大战时的那套。他意识到，美国必须从法国的错误中学习。它必须面对一种不同的战争，一种规模较小的战争，一场秘密战、一场心理战和一场高科技战争——“一场没有核武器、没有北德国平原，且不一定有美国人参与的战争，”戈德尔后来解释道。\n\
  \n回到美国后，他勾勒出了这种新战争的模样。\n\n反叛乱理论并非特别新颖。在 20 世纪早期，美国曾在菲律宾和南美洲进行过残酷的反叛乱行动。当时，美国中央情报局（CIA）正在北越南和老挝进行着一场残酷的秘密反叛乱运动——该运动由戈德尔未来的老板、空军上校埃德华·兰斯代尔领导——其中包括针对性的袭击、死刑处决队、宣传和酷刑。戈德尔反叛乱愿景与众不同之处在于，它像激光束一样聚焦于利用技术来增强效力。诚然，反叛乱涉及恐怖和恐吓，涉及胁迫和宣传。但同样重要的是培训并装备战斗员——无论他们是美国特种部队还是当地力量——让他们拥有可用的最尖端军事技术：更好的武器、更好的制服、更好的交通工具、更的情报，以及对当地人心理的更深层理解。雅各布森写道：“在戈德尔看来，五角大楼需要开发先进武器，其技术基础不能仅仅是核技术，而是能够应对这种即将到来的威胁。”\n\
  \n戈德尔在美国推扬这一新愿景，在全国各地的军事机构讲座并演讲他的反叛乱理论。与此同时，新成立的美国国防计划署（ARPA）邀请他负责管理一个名称模糊的“海外发展办公室”，他从那里管理该机构的秘密行动。这份工作扑朔不清、高度保密且极具流动性。戈德尔可能刻还在监督该机构高度机密的导弹和卫星项目，下一刻可能就在代表国家安全局（NSA）策划对某地区进行核打击的计划。其中一项计划涉及\
  \ ARPA 在印度洋的一个小岛上引爆炸核弹。其构想是创建一个完美的抛物线陨石，以安置 NSA 想要建造的巨型天线，用于捕捉散射到太空并从月球反射回来的微弱无线电信号。一位\
  \ NSA 官员表示：“ARPA 保证了残留放射性的最低化以及随后放置天线的陨石形状是标准的。我们从未追求过这种可能性。美苏之间的核禁协议是在稍后签署的，这个计划随之消失了。”\n\
  \n当戈德尔没有制定炸毁小型热带岛屿的计划时，他追求他的主要激情：高科技反叛乱。正如雅各布森在《五角大楼的大脑》（*Pentagon’s Brain*）中所述：“戈德尔现在处于可以创建并实施他一直向全国战争学院听众要求的那些计划的地位。通过先进科学技术将美国军事力量植入受共产主义威胁的外国土地——民主将获胜，共产主义将失败。这一追求很快变成了戈德尔的执念。”\n\
  \n同时，在为 ARPA 工作期间，他前往东南亚评估日益增长的越明起义，并预订了前往澳大利亚的行程，以讨论反叛乱问题并考察潜在的极轨道发射场。在此期间，他一直推行他的主线：美国需要建立一个反叛乱机构来应对共产主义威胁。在给国防部助理的一系列备忘录中，戈德尔认为：“经过常规训练、常规组织和常规装备的军事组织无法胜任反游击作战。”他指出，尽管南越军在规模上具有压倒性优势，但他们未能平定一场规模小得多的武装起义。他推动让\
  \ ARPA 在前线建立反叛乱研究中心——首先科学地研究和理解当地反叛乱力量的需求，然后利用研究结果建立当地准军事力量。他写道：“不应为这些力量提供需要三级和四级维护的常规武器装备，而应让他们具备白天当农民或出租车司机、晚上当反游击队的能力。”\n\
  \n戈德尔的愿景与当时美国陆军的主流思维相冲突，他的提议在艾森豪总统的人中也没有引起多少热情。但无论如何，他们走下坡路了，他在即将上台的政府中找到了热诚的听众。\n\
  \n# 监听战场\n\n约翰·F·肯尼迪于 1961 年 1 月 20 日就任美国第 35 任总统。这位年轻且帅气的前马萨诸塞州参议员在内政上持进步派立场，在外交政策上是坚定的冷战鹰派。他的当选带来了一批年轻的精英技术官僚，他们深信科技的力量解决世界问题。而且有很多问题需要解决。不仅仅是苏联。肯尼迪面临全球范围内反对美国盟政府的地区性起义：古巴、阿尔及尔、越南和老挝、尼拉瓜和黎巴嫩。这些冲突许多源于当地运动，招募当地战士，并得到当地民众的支持。应对这些并不是传统的大规模军事行动或战术核打击能够解决的。\n\
  \n就职两个月后，肯尼迪总统向国会发表一份信息，认为必要扩大和现代化美国的军事姿态以应对这一新威胁。“自由世界的安全不仅可能受到核攻击的威胁，还可能在我们的战略实力如何的情况下，受到颠覆、渗透、恐吓、间接或非公开侵略、内部革命、外交勒索、游击战或一系列局部战争的影响，从边缘被缓慢蚕食，”他有力地主张用新方法来处理起义和地方叛乱，“我们需要更强的处理游击队、起义和颠覆的能力。我们过去在创建游击和反游击能力方面的努力很大程度上都是针对全面战争的。我们现在必须准备好应对任何规模的力量，包括外部支持的小规模武装；我们必须帮助培训当地力量使其具有同样的效力。”\n\
  \n总统想要一种更好的方法对抗共产主义——而 ARPA 似乎是执行他愿景的完美载体。\n\n\n\n演讲后不久，来自`CIA`、五角大楼和外交部的顾问制定了一项行动计划，旨在通过一项巨大的秘密军事、经济和心理战争倡议，来应对肯尼迪视为最大的问题：越南和老挝日益加剧的起义。该计划包含了威廉·戈德尔（William\
  \ Godel）的个人执念：`Project Agile`，这是一项高科技反叛乱研发计划。在 1961 年 4 月 29 日的国家安全委员会会议上，肯尼迪总统签了名：“协助\
  \ G.V.N.（越南政府）在南越南建立一个战斗开发与测试中心，借助现代技术开发用于对抗越共军队的新型技术。”\n\n随着这短短几行字，`ARPA`的 `Project\
  \ Agile` 诞生了。`Agile` 被植入肯尼迪总统发起的一项规模更大的军事和外交计划中，旨在加强南越政府抵御日益增长的叛军攻势。该计划很快演变成一场全面的、最终导致灾难性的军事行动。但对于\
  \ `ARPA` 来说，这是一次新生。它让该机构再次具有影响力，并将其置于行动的中心。\n\n戈德尔自由地运营`Agile`，并向爱德华·兰斯代尔（Edward\
  \ Lansdale）报告，后者是一位退休空军军，负责`CIA`在越南的秘密反叛乱行动。由于需要秘密——美国在官方上并未军事介入越南——该项目笼罩在浓厚的迷雾中。莎伦·温伯格（Sharon\
  \ Weinberger）在其关于`ARPA`的历史著作*The Imagineers of War*中写道：“他直接向兰斯代尔报告，进行的工作极其秘密，以至于即使是`ARPA`的负责人，更说普通员工，完全不知道细节。”\n\
  \n活动的最初重点是`ARPA`机密的战斗开发与测试中心，这是戈德尔在 1961 年夏天帮助在西贡河岸建立的一群建筑。该计划始于一个地点和一个相对简单的任务：开发武器并改装反叛乱战场装备，以适应东南亚茂密且闷热的丛林。但随着美国军力在越南的存在增加，并最终演变成一场全面的、艰苦的战争，该项目的规模和野心也随之扩大。它在泰国开了几个其他大型研发综合体，并在黎巴嫩和巴拿建立了较小的哨所。该机构不仅开发和测试武器技术，还制定战略、训练当地部队，并参与了反叛乱袭击和心理战行动任务。越来越多地，它承担了一个在`CIA`中也再不过常的角色。它还走向了全球，目标是平定任何地方可能出现的起义以及左翼或社会主义政治运动——包括美国本土。\n\
  \n该机构为南越军队测试了轻型战斗武器，这导致了`AR-15`和`M-16`被采用为标准配步枪。它帮助开发了一种在丛林树冠上方静静滑行的轻型侦察机。它制定了适合炎热潮湿气候的野外口粮食品。它资助了复杂的电子监控系统的创建，并投入资金收集各种冲突情报的精密努力。它致力于改进军事通信技术，使其能够在密林中运行。它开发了可以随气球浮起的便携式雷达装置，这种技术很快在美国本土商业化，用于监控边境非法越境。它还设计了能够更好地穿越沼泽地形的车辆，一种原型“机械大象”，类似于半世纪后`DARPA`和`Google`开发的四足机器人。\n\
  \n`ARPA`经常推向技术上认为可能的边界，开创了领先时代数十年的电子监控系统。它在一些最雄心勃勃的倡议中发挥了巨大作用。这包括`Project Igloo\
  \ White`，这是一项耗资数十亿美元的计算机监控屏障。`Igloo White`从泰国的一个秘密空军基地运行，涉及在丛林中投放数千个无线遥控地震传感器、麦克风以及热量和尿液探测器。这些窃听设备形状像树枝或植物，通常从飞机投下，将信号传输到中央计算机控制中心，提醒技术人员丛林中的任何动静。只要有东西移动，就会请求空袭，该地区会被洒满炸弹和凝胶胶。`Igloo\
  \ White`就像一个跨越数百英里丛林的巨大无线报警系统。正如美国空军解释道：“我们实际上在对战场进行监听。”\n\n退休空军飞行员约翰·T·哈利戴（John\
  \ T. Halliday）在他的回忆录中描述了泰国的`Igloo White`行动中心。“还记得电影*博士博士*中那些显示俄罗斯轰炸机飞向美国、我们的轰炸机飞向他们的巨大电子显示板吗？”他写道，“`Task\
  \ Force Alpha`非常像那样，只不过是全彩色的实时显示，有三楼高——那是整条胡志明小道的完整、生动的彩色呈现。”\n\n哈利戴是一个团队的成员，他们在胡志明小线上空执行夜间轰炸任务，根据这道电子围墙提供的情报攻击补给队。他和他的部队对这一切的未来感感到惊叹：\n\
  \n走出丛林进入建筑，你就像回到了美国——但是十五年后的美国……也许是 1984 年。这里太美了……闪闪发光的地砖地板……到处都是玻璃墙。他们有一个全食堂，你可以在那里得到任何想要的东西。他们甚至有真正的牛奶，而不是我们在食堂吃到的那种奶粉垃圾。还有空调？整个该死地方都有空调。那里甚至有一个保龄球场和一个电影院。我和一群看起来像\
  \ IBM 员工、穿着三件套西装、都戴着眼镜的文人士……那里是‘极客中心’。我们在基地的这一侧从未见过他们，所以我猜他们在那里拥有他们的一切。\n\n然后是一个主控制室，看起来就像我们在阿波罗登月计划期间在电视上看到的那个，或者是詹姆斯·邦德电影里的东西。到处都是计算机终端。但主要的特征是这个巨大的、三楼高的亚克力……或者可能是塑料，我不知道……对整个胡志明小道的彩色描绘，并实时显示卡车沿着小路行驶的情况。这太疯狂了，哥们儿。\n\
  \n`Igloo White`运行了五年，总成本接近 50 亿美元——相当于现在的 300 亿美国。。尽管在当时广受赞誉，但该项目最终被判定为行动上的失败。根据历史学家保罗·N·爱德华的话，“游击者学会了用录制的车声、尿袋和其他诱饵来干扰美国的传感器，诱发大量炸弹落在空空的丛林通道上，而他们则悠闲地穿过。”尽管失败了，`Igloo\
  \ White`的“电子围墙”技术在几年后被部署在美墨边境。\n\n\n\n\n“敏捷项目”（Project Agile）在南越政府内部取得了巨大成功。迪严总统多次访问了位于西贡市的\
  \ `ARPA` 研究中心，并亲自会见了 `Godel` 以及那里 `ARPA` 团队的其他成员。总统提出了一个主要条件：美国的参与必须保持秘密。`Godel`\
  \ 也持相同意见。回国后，为了证明建立新反叛手段的必要性，他频繁引用迪严总统告诉他的话：“我们唯一失败的可能是就是美国人的介入。”\n\n# 了解你的敌人\n\n\
  对于威廉·戈德尔（William Godel）来说，高科技反叛不仅仅是开发现代杀戮手段。它还涉及对发生叛乱地区的人和文化进行监控、研究和理解。这都是他对未来战争愿景的一部分：利用美国的先进科学来击败当地叛乱分子优越的纪律、动力和支持。其理念是理解是什么促使他们反抗和战斗，以及做什么才能改变他们的想法。最终目标是找到一种预测当地叛乱的方法，并在它们成熟之前阻止它们。东南亚面临的问题在于，美国人运行在他们并不了解的环境和文化之中。那么，如何确保军队做出了正确的决策呢？\n\
  \n20 世纪 60 年代初，国防和外交政策领域充斥着各种研讨会、会议、报告和课程，试图建立适当的反叛政策和学说。在由美国陆军组织、`Godel` 的 `ARPA`\
  \ 同事参加的一场极具影响力的多部门研讨会上，一名军事研究人员非常直接地描述了对抗叛乱战斗的困难性：“问题在于……我们必须在一个陌生的文化环境中运作，并影响具有不同文化价值观、习俗、道德、信仰和态度的人。”他用一句严厉的话作为结语：“同样的子弹，无论是针对美国、非洲还是亚洲的目标，其杀伤力几乎是相同的。然而，反叛武器的效力取决于具体的目标。”\n\
  \n五角大楼开始向社会科学和行为科学家倾掷巨资，雇佣他们以确保美国的“反叛武器”始终击中目标，无论是在何种文化背景下发射的。在威廉·戈德尔的领导下，`ARPA`\
  \ 成为这些计划的主要渠道之一，帮助将人类学、心理学和社会学武器化，并使其服务于美国的反叛工作。`ARPA` 为对越南农民、被俘的北越战士以及泰国北部的叛乱山族进行的研究投入了数百万美元。大量的\
  \ `ARPA` 承包商——人类学家、政治科学家、语言学家和社会学家——穿过贫穷的村庄，将人们置于显微镜下，进行测量、收集数据、访谈、研究、评估和报告。其理念是了解敌人，了解他们的希望、恐惧、梦想、社交网络以及他们与权力的关系。\n\
  \n`RAND` 公司在 `ARPA` 合同的支持下承担了大部分工作。`RAND` 位于一栋俯瞰圣塔尼卡宽阔金色沙滩的建筑内，是一家强大的军事和情报承包商，由美国空军几十年前作为一家私私合作的研究机构而创建。20\
  \ 世纪 50 年代，`RAND` 是制定美国核战争政策的核心。20 世纪 60 年代，它增加了一个大的反叛部门，成为 `ARPA` “敏捷项目”事实上的私有延伸。`ARPA`\
  \ 下达订单；`RAND` 招聘人员并完成任务。\n\n在一次重大行动中，`RAND` 的科学家研究了“战略村”（Strategic Hamlet）计划的成效。这是一项由\
  \ `Godel` 和“敏捷项目”开发并推动的和平努力，涉及将南越农民从他们的传统村庄强迁到新区域，这些区域设有围墙并并防止叛军渗透而变得“安全”。在另一项由\
  \ `ARPA` 委托的研究中，`RAND` 承包商被要求回答困扰着美国人的问题：为什么北越战士没有投降我们这一方？是什么导致了他们的事业？共产主义者不是对自己的人很残酷吗？他们不想像我们在美国一样生活吗？为什么他们的士气那么高？做什么可以破坏他们的信心？他们对北越战俘和叛逃者进行了两千四百访谈，为了这一目标产生了数万页的情报。\n\
  \n\n\n事实恰恰如此。战后，包括年轻的 `Charles Murray`（《种族曲线》作者）在内的研究人员——他们曾为东南亚的 `ARPA` 从过反叛乱计划——他们回到美国，并开始将他们在丛林中开发的平化理念应用于阶级、种族和经济不平等等棘手的国内问题上。⁶⁹\
  \ 这种影响在在国内和海外同样灾难，它为强化种族主义和结构性贫困的公共政策披上了现代科学的外衣。⁷⁰\n\n正如 `AIR` 提议毫不含蓄地暗示的那样，`ARPA`\
  \ 在东南亚的行为科学计划与一种更血腥、更传统的反叛乱政策并行：即暗杀、恐怖和酷刑的秘密计划，这些统被称为“凤凰计划”（`Phoenix Program`）。\n\
  \n这种反叛乱黑暗侧面的指导人物之一是 `Edward Lansdale`，他曾是 `Levi Strauss and Company`的高管，二战后在菲律宾反对共产主义叛乱中学到了这门手艺。⁷¹\
  \ Lansdale 标志性的心理战策略是利用当地的神话和信仰引发目标产生原始的恐怖和恐惧。一个著名的技巧是利用菲律宾对吸血鬼存在的信仰来恐吓共产主义游击队。“`Lansdale`\
  \ 的反恐心理战战术之一是将被俘获的共产主义游击队员倒挂在树上，用匕首刀刺入他的脖子并放干他的血，”揭露“凤凰计划”的记者 `Douglas Valentine`\
  \ 解释道，“被恐吓的共匪逃离了该地区，而相信吸血鬼的、恐的村民则向政府寻求保护。”⁷² 成为 `Godel` 上司的 Lansdale 在越南复制了菲律宾的策略：暗杀、死亡小组、酷刑以及摧毁整个村庄。⁷³\
  \ 这都是为了“震慑”农民帮助越南北叛军。在“凤凰计划”的定点暗杀中，有四万到八万越南人被杀；`CIA` 估计这一数字接近两万。\n\n到 20 世纪 60 年代后期，越南战争已变成了一台绞肉机。1967\
  \ 年，有 11,363 名美国士兵失去生命。一年后，这个数字升到近 17,000 人。到 1970 年，美国士兵不再想战斗了。战场一片混乱，基地内部也出现抗命。发生了数百起“兵杀官”（fragging）事件，士兵杀死了自己的上级。毒品泛滥。士兵们彻底废了——醉酒、吸食大麻和鸦片。`ARPA`\
  \ 的 `Project Agile` 并未免受这种转变，反而与之紧密相。事实上，根据一位 `ARPA` 前负责人 `William Godel` 亲自参与了“美属航空”任务，为\
  \ `CIA` 在老挝的秘密战争提供物资，据可靠报告，这项行动涉及走私海洛以资助反共民兵。⁷⁴\n\n当西贡贡变成一个充满酒精、海洛、卖淫和廉价刺激的军营时，`ARPA`\
  \ 的研究中心变成了一个怪异的现象。\n\n\n\n\n美国军事情报机构与其极权国家对应机构的区别不在于其能力，而在于其意图。这是一个显著的区别，但可能无法完全让许多美国人放心。\n\
  \n—克里斯托弗·派尔（Christopher Pyle），《军队对平民的监控：文献分析》，1973 年\n\n1962 年 10 月 1 日周一清晨，一位名为\
  \ `J. C. R. Licklider` 的男人在波波托马克河畔、白宫对面的一间公寓里醒来。他吃完早餐，向妻子和女儿告别，然后沿着最短的路开车往五角大楼，开始他担任\
  \ ARPA 行为科学与指挥控制研究部门主管的新工作。\n\n在简陋的办公室里坐下，他环顾四周。在过去的几年里，国防领域的人一直在推动升级美国的军事和情报通信系统。肯尼迪总统一就职，就对有效指挥美国军部队的困难表示不满。他发现自己在最关键的时刻往往盲目耳聋，无法获得实时的情报更新，也无法及时向现场指挥官传达指令。他认为军事指挥官正在利用过时的技术作为掩护来反抗他的权威并忽视指令，因此敦促国防部长罗伯特·麦克纳马研究解决方案。他还向国会严辞，认为需要开发“一个真正统一、全国性、不可摧的系统，以确保高层指挥、通信和控制”。¹\n\
  \n利克莱德表示同意。美国的国防通信系统确实老旧得可怜。它们无法有效应对当下的挑战：在无人一所不知的遥远地区发生的数十场小规模战争和叛乱。再加上无处不在的核打击威胁，这种威胁可能会切断大部分军事指挥系统。但这样一个新系统到底会是什么样？它将包含哪些组件？为了让它运行，需要发明什么新技术？五角大楼里很少有人知道答案。`Licklider`\
  \ 是少数人之一。\n\n约瑟夫·卡尔·罗布内特·利克莱德（Joseph Carl Robnett Licklider）——一个长得离谱的名字——直接被称为“利克”（Lick）。他戴着瓶形眼镜，穿着三件套西，因对可乐上瘾而闻名。在高级军事圈子里，`Lick`\
  \ 被誉为天才心理学家和计算机未来主义者，对即将到来的人机时代有一些前卫的见解。\n\n他于 1915 年出生于密苏里州圣路易斯。他的父亲是一位浸信教牧师，也是圣路易斯商会主席，是一个敬畏上帝、精于经营的人。`Lick`\
  \ 让他的父亲感到自豪。1937 年，他毕业于圣路易斯华盛顿大学，获得心理学、数学和物理学三学学位，随后开始研究动物如何处理声音，这主要涉及切开猫的头骨并用电击它们的大脑。²\
  \ 第二世界大战期间，`Lick` 被招募到哈佛大学的心理声实验室，该实验室由美国空军提供巨额资金，旨在研究人类语言、听力和通信。³ 在实验室，他结了未来的妻子——路易斯·托马斯（Louise\
  \ Thomas），她在一家军事研究中心担任秘书。她认为自己是一个社会主义者，甚至把她的《社会主义工人》杂志带到办公室。她会将杂志放在办公桌边缘，让实验室的男人们在上厕所的路上顺手拿去，在方便时有书读。\n\
  \n战后，`Lick` 离开哈佛进入马萨诸塞理工学院（MIT）。在那里，他接触到了世界上第一个网络化的数字计算机监控系统。这改变了他人生的轨迹。\n\n# 苏联核武器\n\
  \n1949 年 8 月 29 日上午 7:00 整，坐在位于哈萨克斯苏联社会主义埃维特共和国孤立草原上的一座加固堡垒里的工程师们按下了开关，引爆了第一枚苏联原子弹：\
  \ “第一号闪电”，代号为 `RDS-1`。 ⁴ 炸弹被安置在一个木塔上，周围环绕着模型建筑以及运到那里的工业和军事机械，以测试爆炸效果：一辆 `T-34` 坦克、砖房建筑、一座金属桥、一段带有火车车的小段铁路线、汽车、卡车、野战炮、一架飞机，以及超过一千种不同的活体——狗、老鼠、猪、羊、豚鼠和兔子——它们被拴在战壕里、墙后和车辆内。\n\
  \n这是一个相当小的炸弹，大小与投在长崎上的那枚差不多。事实上，它几乎是被称为“胖子”（Fat Man）的那枚炸弹的一比复制品。现场前后的照片显示了严重的破坏。许多动物瞬间死亡。没死死的遭受了严重烧伤，并死于辐射暴露。拉夫连捷捷·贝贝利亚亚（Lavrentiy\
  \ Beria），这位臭名昭著的 NKVD（苏联内务人民委员委员会）首脑在场观察。他向斯大林发了电报：测试成功。 ⁵�\n\n爆炸的消息让美国军事阶层陷入了恐慌的疯狂中。美国的核霸权已不复存在。苏联现在具备了对美国发动核打击的能力；他们只需要一架远程轰炸机。这构成了一个严重的问题。\n\
  \n美国的预警雷达系统稀疏且漏洞百出。追踪飞机的过程是手工完成的：穿着制服的军人坐在满烟雾的黑暗房间里，盯着原始的绿色雷达屏幕，大声喊出坐标并记录在玻璃板上，然后通过无线电向飞行员下达指令。面对大规模、针对性的空中核攻击，该系统将无用用处。\n\
  \n美国空军成立的一个特别机构提交的报告建议将预警雷达系统自动化：雷达信息应该数字化，通过电线传输，并由计算机进行实时处理。 ⁶ 1950 年，这项建议不仅是野心勃勃——它像是一个疯狂的想法。负责空军研究的\
  \ MIT 教授乔治·瓦里（George Valley）询问了几家计算机公司，是否能够构建出这样的实时计算机系统。他被笑出了房间。实时数据处理技术，特别是来自距离中央计算机数百英里的多个雷达设施的数据，当时根本不存在。没有任何东西能比。\n\
  \n如果空军想要一个自动化雷达系统，他们就必须发明足够强大以处理这项工作的计算机。幸运的是，五角大楼已经是这一领域的首席推动者。\n\n第二次世界大战期间，美国军队在推动原始数字计算机技术进步方面发挥了领先作用。原因有很多，而且都与战争努力密切相关。其中之一是密码学。海军情报部门以及其他几个国家安全局的前身机构长期以来一直使用专门的\
  \ IBM 打孔卡制表机进行密码分析和破译。战争期间，他们面临先进的纳德国加密技术，需要运行速度更快、处理代码更复杂的机器。数字计算机是能够完成这项任务的唯一选择。\n\
  \n\n\n\n其他部门也极度渴望能够进行高速数学计算的机器，但原因略有不同。在战争期间，强大的新型大炮和野战火炮从生产线下线，并运往欧洲和太平洋战场。如果不能进行准确瞄准，所有的火力都将无用武之地。火炮，这种可以击中十几英之外目标的大型武器，并不是直线射，而是以倾斜的角度抛射炮弹，使其在划出抛物线后降落在远处的目标上。每门炮都有一张射击表，规定了射击角度以确保弹命中目标。射击表并非简单的单页纸，而是带有数百个方程变量的厚实册子。155\
  \ 毫米“长汤姆”野战炮是二战期间最流行的大炮之一，其射击表包含了五百个变量。⁷ 空气、火药温度、仰角、湿度、风速和风向，甚至是土壤类型——都是复杂计算所需的关键环境因素。\n\
  \n意乎意料，这些图表的计算极其危险。数百种排列组合中的所有变量都必须手动输入并计算。错误经常出现，计算不得不从头开始。仅仅是一种火炮的一张射击表可能就需要超过一个月才能完成。而且还有意外：军队发现，为欧洲计算的图表在非洲行不通，因为土壤变量不同；尽管大炮已经运达，但在从头重新计算射击数据之前，它们无异于一堆摆设。⁸\
  \ 职员小组（通常是女性）日夜不停地工作，使用钢笔、纸和机械加法辅助工具来处理这些数字。在数字计算机出现之前，这些女性被称为“计算机”（computers），她们对战争努力至关重要。⁹\
  \ 射击表的意义如此重大，以海军和陆军都分别资助建立自动计算器——这一切都是为了瞄准巨大的杀戮机器——并在此过程中帮助了第一台数字计算机的发展。其中最著名的是`ENIAC`，它是由宾夕法尼亚大学摩尔电气学院的数学家和工程师团队为军队建造的。这台计算机一出现引起了轰动。\n\
  \n1948 年，一份报纸在报道`ENIAC`亮相的文章中宣布道：“机器人计算器如链闪电般击出数字”：\n\n宾夕法尼亚州，费城——陆军部今晚展示了“世界上最快的计算机器”，并表示这台机器人可能为每个人开启了通往更好生活的数学之路。\n\
  \n军表示，通过“第一台全电子通用计算机”的发展，改进的工业产品、更好的通信和交通、卓越的天气预报以及科学工程领域的其他进步成为可能。\n\n军将这台机器描述比之前建造的最先进计算机器快\
  \ 1000 倍，并宣布该设备使得“在任何其他机器上可以在几小时内解决原本需要几年才能完成的问题”。\n\n## 无所不能\n\n这台机器可以进行加、减、乘、除和平方根计算，还能基于这些操作执行大多数复杂计算，它被称为“ENIAC”——“电子数值积分器和计算机”的缩写。它也被戏称为“机械爱因斯坦”。¹⁰\n\
  \n`ENIAC`出现得不够快，未能帮助战争，但它运行了近十年，一直在计算射击表、运行原子弹计算并建立苏联气候的气象模型，包括绘制核战争放射性尘埃可能扩散的地图。11)\
  \ 尽管`ENIAC`如此强大，但它还不够。\n\n为了开发驱动现代雷达防御系统所需的计算机和网络技术，建立了一个名为`Lincoln Laboratory`（林肯实验室）的特殊研究部门。隶属于麻省理工学院，位于剑桥以东十英里的研究校区。`林肯实验室`是海军、空军和陆军的联合项目，其唯一目标是建立一套现代防空系统。投入的资源数量惊人。软件本身就花费了大约一年的编写时间。12)\
  \ 整个项目的费用超过了曼哈顿计划（即开发第一件原子武器的计划）。\n\n林肯实验室组装了一个怪物：半自动地面环境，即`SAGE`。它是历史上最大的计算机系统，也是第一个真正的计算机网络。`SAGE`由分布在全国战略位置的二十指挥中心控制。这些巨大的核防护混凝土堡内安置了两台`IBM`计算机，13)\
  \ 它们总价值 40 亿美元，重达六百吨，占据一英里的空间；其中一台始终处于备用状态。每个指挥中心雇用了数百人，并与陆基海岸雷达阵列、导弹发射井和战斗机基地相连。系统可以实时跟踪四百架飞机、派遣战斗机、发射导弹并瞄准防空炮。14)\
  \ `SAGE`是巨大武器的眼睛、耳朵和大脑。它还是第一个全国性的监控机器——广义上的监控：一个从远程传感器收集信息、进行分析并允许军队根据产生的情报采取行动的系统。\n\
  \n`SAGE`是一台极其复杂的机器，但实际上，它在开启之前就已经过时了。它在 20 世纪 60 年代初上线，此时苏联发射“卫星号”并借此证明其洲际导弹能力已经多年了。苏联可以将核弹射入太空并让其落在美国的任何地方，而没有任何先进的雷达防御系统对此无能为力。\n\
  \n从表面上看，`SAGE`是一项劳民工程。但从更广泛的历史角度来看，它是一个巨大的成功。`麻省理工林肯实验室——拥有顶尖的工程人才和针对特定问题近乎无限的资源——不仅仅是一个单一军事项目的研发中心。它变成了一批新一代工程精英的训练场：一个由科学家、学者、政府官员、商人和数学家组成的跨学科群体，他们后来创造了现代计算机工业并构建了互联网。\n\
  \n而`J. C. R. Licklider`正处于这一切的中心。在林肯实验室，他致力于这个巨大雷达计算机系统的人机界面工作，并帮助开发了系统的图形显示，该显示需要整合多个雷达的数据，并显示实时航向和速度信息，这些信息可引导战斗机。它是`SAGE`虽小但至关重要的部分，这项工作开启了他的眼界，让他看到了将人类与计算机集成到一个连续系统的可能性：一种突破人类身体限制并创造强大新型混合体的人机系统。\n\
  \n\n\n\n马萨诸理工学院（MIT）是控制科学（cybernetics）这一新科学的发源地。控制科学由 MIT 教授诺伯·维纳（Norbert Wiener）开发，他将世界定义为一个巨大的计算机器。它为思考和设计复杂信息系统提供了一个概念和数学框架。\n\
  \n维纳是一个古怪而才华横溢的人。他矮矮的、胖乎乎，脑袋圆滚滚，戴着厚眼镜。晚年时，他看起来有点像《辛普森一家》中的汉斯·莫尔曼（Hans Moleman）。他也是真正的天才。作为一位严厉且野心勃勃的学者和斯拉夫学者的之子，维纳被迫背诵整本书并凭记忆背诵，并在脑中进行复杂的代数和三角函数运算。他在自传中回忆道：“我父亲在做哈佛的作业时，我必须站在他旁边背诵课程，即使在六岁时也要用希腊语，直到我犯下最简单的错误，他才会忽略我，然后他会在语言上把我贬得粉骨。”\n\
  \n在这样的训练下，维纳在十一岁时就上了大学——一家报纸称他为“波士顿的奇童”——十八岁时获得数学博士学位，在被哈佛大学拒绝后，开始在 MIT 教书。他那疯狂学习和遭受父亲无情批评的生活，并没有为应对生活的社交维度做好准备：他很笨拙，不会与女性交谈，没有几个真正的朋友，忧于抑郁，而且几乎无法照顾好自己。\n\
  \n他的父母安排他结婚了玛格丽特·恩格曼（Margaret Engemann），这是一个来自德国的移民，她在寻找丈夫方面一直很困难。他们有两个正常的女儿，这段婚姻看起来很好，唯独一个小细节：玛格丽特是阿多夫·希特林的坚定支持者，并强迫女儿们阅读《我的奋斗》。她的女儿回忆道：“有一天，她告诉我们，她在德国的家人已被认定为‘犹太洁’（*Judenrein*）——‘没有犹太人污染’。她认为我们知道后会很高兴。她说我不应该同德国的犹太人同情，因为他们不是什么好人。”在一次圣诞派对上，她试图说服客们雅利人的血统可以追溯到上帝儿子。“耶稣是一个驻守耶路撒冷的德国雇佣兵的儿子，这已经过科学证明。”考虑到她的丈夫是德国裔犹太人，而她的女儿因此也是半犹太人，这种处境非常尴尬。但这并不是一个普通的家庭。\n\
  \n维纳的心脑永远处于饥渴状态，吞路径上的一切。他跨越了几乎所有的学科边界，贯穿了哲学、数学、工程、语言学、物理、心理学、进化生物学、神经生物学和计算机科学。第二次世界大战期间，维纳遇到了一个测试他那才华横跨学科大脑极限的问题。他被招募参加一项空幻的机密计划，建立一种自动瞄准和目标机制，以提高地空防炮的效性。在整个战争期间，他一直在研究一种特殊的计算机设备，该设备利用微波雷达观察、定位，然后根据飞行员的操作预测飞机的未来位置，以便更有效地将其击落。这是一台研究人类行为并对其做出动态响应的机器。在建造它的过程中，他对信息的本质产生了深刻的见解。他开始意识到，信息的传递不仅仅是一种抽象或转瞬逝逝的行为，而是具有强大的物理属性。它像一种无形的力量，可以被赖以引发反应。他还实现了另一个简单但深刻的飞跃：他意识到信息的通信和信息的传输不仅限于人类，而是渗透到所有生物中，并且也可以被设计到机械世界中。\n\
  \n维纳在 1948 年的一本晦涩著作中发表这些思想，《控制论：动物与机器的控制与通信》（*Cybernetics: Control and Communication\
  \ in the Animal and the Machine*）。控制科学是什么？这个概念难以捉摸，定义起来令人疯狂。简单来说，他将控制科学描述为：生物神经系统与计算机或自动机器本质上是同一个东西。他解释说，它们是“根据过去做出的决定来做出决定的设备”。对维纳来说，人类和整个生命世界可以被视为一个巨大的互联信息机器，一切都在复杂的因果和反馈系统中相互作用。他预测，我们的生活将越来越多地被计算机中介和增强，以至于我们与所处的巨大控制论机器之间不再有区别。\n\
  \n尽管充满了不可理解的数学证明和术语，这本书激发了公众的想象力，并成为畅销。军事界也将其视为具有革命性的著作。正如马克思的《资本论》对于十九世纪社会主义者的意义一样，维纳的《控制论》对于美国的反共冷战战士来说也是如此。在非常基础的层，控制论假设人类与所有生物一样都是信息处理机器。我们都是计算机——尽管非常复杂，但终归如此。这意味着军事可以制造像人类一样思考和行动的机器：扫描敌方飞机、翻译敌方通信、监视叛分子、分析外国新闻中的隐藏含义和秘密信息——这一切不需要睡眠、食物或休息。有了这种计算机技术，美国的领先地位得到了保障。《控制论》引发了军事界几十年对实现这一特定控制论愿景的追求，即创造我们现在所说的人工智能的努力。\n\
  \n\n\n\n从大意义上说，控制科学与大权的交织使得诺伯特·维纳（Norbert Wiener）在他向世界介绍控制科学后不久几乎就背叛了它。他看到科学家和军事人员对控制科学进行最狭隘的解释，以此制造出更好的杀人机器，以及更高效的监控、控制和剥削系统。他看到巨型企业利用他的思想来实现生产自动化并削减人工，以追求更大的财富和经济权力。他开始意识到，在一个由计算机和信息系统中介的社会里，控制基础设施的人掌握着终极权力。\n\
  \n维纳见到了一个阴暗的未来，并意识到自己也负有其责，他将自己在控制科学方面的工作与释放原子武器破坏性力量的世界最伟大科学家的工作相提。事实上，他认为控制科学的后果甚至比核武器还要严峻。“思维机器的影响将无疑是一场与原子弹不相当规模的冲击，”他在\
  \ 1949 年的一次采访中说道。用机器取代人类劳动力——以及这种变化将导致的社会动荡、大规模失业和经济权力的集中——是维纳最担心的事情。²³ “让我们记住，自动机器，无论我们认为它可能或可能具有任何情感，都是奴隶劳动的精确经济等价物。任何与奴隶劳动竞争的劳动必须接受奴隶劳动的经济条件。显而易见，这将导致一种失业局面，与之相比，目前的衰退甚至\
  \ 30 年代的大萧条将看起来像一个轻松的笑话，”维纳在他部黑暗且具有预见性的续作著作《人类对人的使用：控制科学与社会》中这样写道。²⁴\n\n这种破坏将不仅是政治上的，也将将是经济上的。\n\
  \n在普及控制科学后，维纳成为了一种劳工运动和反战活动人士。他联系工会，警告他们自动化的危险以及认真对待这一威胁的必要性。他拒绝了巨型企业希望帮助其根据他的控制原理实现装配线自动化的邀请，并拒绝参与军事研究项目。他反对二战后发生的大规模和平军备，并公开指责那些致力于帮助军方制造更大、更高效的破坏工具的同事。他越来越多地暗示，根据他的内部消息，“一个巨大的国家机器”正在由政府机构“为了战斗和统治的目的”而构建，这是一个计算机化的信息系统，他在《人类对人的使用》中描述其其范围“广泛到足以涵盖战争期间、战前甚至可能战争之间的所有平民活动”。\n\
  \n维纳对劳工的公开声支持以及对企业和军事工作的公开反对，使他在军事承包商工程师同事中成为一个异类。²⁵ 这也让他进入了 J·埃德加·胡佛（J. Edgar Hoover）领导的\
  \ FBI 颠覆监控名单。多年来，他被怀疑有共产倾向，他的生活被记录在一份厚厚的 FBI 卷宗中，该卷宗在他 1964 年去世后关闭。²⁶\n\n\nJ. C.\
  \ R. 里克莱德（J. C. R. Licklider）在麻省理工学院（MIT）与诺伯特·维纳互动，并参与了许多构思、辩论和讨论控制科学思想的会议和晚宴。他被维纳的控制科学愿景激化了。维纳看到危险的地方，里克莱德看到了机会。对于将这项技术服务于美国企业和军事权力，毫无顾虑。\n\
  \n尽管大多数计算机工程师认为计算机只不过是超大计算器，但里克莱德将其视为人类思维的延伸，并痴迷于设计能够与人类无缝耦合的机器。1960 年，他发表了一篇论文，概述了他对未来“人机共生”的愿景，并用简单的语言描述了为了实现这一目标需要发明的计算机组件。这篇论文本质上描述了一种现代多功能计算机，配备显示器、键盘、语音识别软件、网络功能以及可以实时使用的应用程序。²⁷\
  \ 这种描述在当时本质上描述了一台现代多功能计算机。²⁸ 这在现在看来是显而易见的，但在当时，里克莱德的思想极具远见。他的论文在国防领域广泛流传，并让他获得了五角部的邀请，就该主题进行一系列演讲。²⁹\
  \ “我第一次接触计算机是 1948 年听了数学家冯·诺依曼（John Neumann）的演讲。在当时听起来像科幻小说：一台自动执行算法的机器，”查尔斯·赫兹尔德（Charles\
  \ Herzfeld）回忆道，他后来在 1960 年代担任了 ARPA 主任。³⁰ “但下一个震惊是里克莱德：我们不仅可以使用这些机器进行大规模计算，还可以让它们在日常生活中变得有用。我非常兴奋。从那时起我成了追随者。”\n\
  \n事实上，里克莱德的论文和采访显示，他认为几乎任何问题都可以通过计算机的应用来解决。他甚至制定了一个通过让黑人贫民窟接触计算机来消除贫困的计划。他将这一过程称为“动态化”（dynamations），这是五年后今天在硅谷非常流行的观点：认为教贫穷孩子编程会某种神奇地让他们摆离贫困并提高识字率和教育水平。³¹\
  \ “很难用几句话传达的是里克莱德对计算机潜力的近乎救世的观点，即计算机的使用、人与计算机的关系以及对人们如何决策的影响，”一份内部解密的 ARPA 报告解释道。³²\
  \ 里克莱德将他对计算机革命的热情传染给了所有人，包括 ARPA 的高层，这些人也在寻求利用计算机来提高军事效率。\n\n1962 年，在五角大楼进行简短的面试后，里克莱德带着家人从波士顿搬到华盛顿，并从零开始建立\
  \ ARPA 的指挥与控制研究计划。³³\n\n网络呢？网络是存在的。但像连接 SAGE 的网络一样，它们通常是高度专业化的，为了特定的目的和功能而建立。网络需要为每种新情况进行设计和定制构建。\n\
  \n\n\n\n\nLick 认为，这是处理指挥控制技术问题的错误方法。ARPA 需要的是开发一种通用且标准化的计算机和网络平台，该平台可以通过极少的精力修改，以处理几乎任何任务：导弹跟踪、行为研究、数据库、语音通信、情报分析或简单的文本处理和邮件功能。这个计算机框架将具有几个基础的底层组件。它将是易于使用的，具有直观的图形用户界面，配备通用的操作系统和可以加载其上的程序，最重要的是，它将摆脱计算器模式的计算机操作方式，允许用户以人们相互互动的方式进行实时工作。尽管这听起来很基础且显而易见，但这类计算机工具在\
  \ 20 世纪 60 年代并不存在。\n\n“少数人（人数很少）心里有一种信念，如果人们拥有计算机系统、良好的显示器等的支持，拥有良好的数据库和听从指令计算，他们的思考和决策效率将会变得非常高。这正是我们努力实现的愿景，”Lick\
  \ 在一份 ARPA 报告中解释道。“这真的不是一个指挥与控制研究计划。它是一个交互式计算计划。我的观点是，现在仍然是，你无法在这样的框架之外真正进行指挥与控制。”\n\
  \n计算机技术的原始状态意味着 Lick 的目标还有几年之遥，而且有一点是可以肯定的：它不会凭空发明。必须有人来做这些工作。在 Lick 看来，ARPA 的首要任务是将资金投入给工程师，让他们构建现代指挥控制系统所需的底层计算机组件。起码，ARPA\
  \ 至少能让人们从事指向正确方向的计算机项目。Lick 从历史的角度来看待自己的工作。他将利用 ARPA 的预算和影响力将计算机行业推向一个新领域，一个与他的愿景以及国防机构需求一致的领域。\n\
  \n但首先，他想确保美国情报机构没有秘密开发出这种交互式计算技术。“我甚至去中央情报局（CIA）向他们做了一次推演，”Lick 说。“我不得不告诉他们：‘听着，我不知道你们在在这方面做了什么。我希望你们正在做以下事情。但让我告诉你们我正在做什么，也许我们就能找到方法谈谈我们之间的关系。’他还安排了与国家安全局（NSA）代表的会议，并就通用、易用计算机平台的优美进行了同样的推演。这两个机构都没有在从事交互式计算，但他们确实想亲手得到——‘NSA，他在多年后的采访中回忆道，他们真的需要我想要的东西。’确实，情报机构是几年后\
  \ ARPA 指挥控制计划所产出工具的首批用户之一。\n\nARPA 最初的指挥控制研究预算为 1000 万美元。Lick 通过他在军方-学术-承包商世界的个人和专业网络传播了这笔资金。他资助了麻省理工学院（MIT）、加州大学伯克利分校（UC\
  \ Berkeley）、加州大学洛杉矶分校（UCLA）、哈佛大学、卡基梅隆大学、斯坦福大学和兰德公司关于交互式计算、分时、图形界面设计、网络和人工智能的项目。在麻省理工，Lick\
  \ 设立了他最大且最重要的计划之一：`Project MAC`，`Machine-Aided Cognition`（机器辅助认知）的缩写，它演变成了一个复杂的交互式计算机环境，配备电子邮件、公告板和多人视频游戏。MIT\
  \ 的 `Project MAC` 催生了第一批“黑客”——那些在空闲时间摆弄这些巨型计算机的 ARPA 承包商。\n\n在斯坦福研究所（SRI），该机构也在从事关于越南化学战的\
  \ ARPA 合约工作，Lick 资助了道拉斯 C·Engelbart 的 `Augmentation Research Center`（增强研究中心）。这个团队在计算机界成为了传奇。他们开发了超文本链接、多用户实时文字处理、视频会议，以及最著名的计算机鼠标。Lick\
  \ 还启动了一系列网络项目，这些努力直接导致了互联网的诞生。其中之一是 UCLA 与加州大学伯克利分校开展的 150 万美元联合计划，用于开发一种连接多台计算机到多个用户的网络软件和硬件。正如一份资金建议书解释的那样，这项研究将直接用于改进军事网络，包括当时的\
  \ `National Military Command System`，那是一套连接军队与总统的新通信系统。\n\nLick 工作勤奋且高效，他在 ARPA\
  \ 的努力是极其瞩目的。通用电气（General Electric）和 IBM 等公司最初并没有接受他关于交互式计算的观点。但凭借他的坚韧和 ARPA 的资助，他的愿景获得了关注和普及，并最终改变了计算机行业的方向。他在\
  \ ARPA 的任期还取得了另一个成就：计算机科学不再仅仅是电气工程的一个分支；它发展成为了一门真正的独立学科。ARPA 指挥控制研究部门发放给研究小组的长期研究合同，为全美大学独立计算机科学系的建立播下了种子，并通过资金和人员将其与美国军事机构紧密地联系在一起。\n\
  \n# 网络：阴暗面\n\n计算机历史爱好者认为 Lick 是计算机科学和互联网发展过程中最重要的灵魂人物之一。由 M. Mitchell Waldrop 编写的一本名为\
  \ *The Dream Machine*（梦幻机器）的五百页传记，记录了 Lick 的生活和工作。几乎从没有被报道的，但从涵盖 Lick 在 ARPA 任期的大量公开和解密政府文件中渗透出来的，是他的计算机研究努力多大程度上融入了该机构更大的反叛乱任务。\n\
  \nLick 于 1990 年去世，离世时仅差七十五虚岁。在采访中，他确保将自己在 ARPA 的努力与该机构不那么健康的、对抗叛乱的工作隔离开来。“其中有一种像间谍行动的色彩，”他在\
  \ 1988 年的一次采访中回忆道，“有一个叫 Bill Godel 的家伙，在我看来，他总是试图控制我正在做的事。我永远无法得知他在做什么，所以那部分让我很不安。我有一个项目，我的权限还不够深入到知道里面在做什么，这让我很不安。”他坦然承认\
  \ ARPA 正在酝酿一些事情，并暗示他参与了其中一部分，但声称他拒绝将他的指挥控制计划卷入令人遗憾的越南反叛乱努力中。“我尽所能地避开了那些，”他解释道。\n\
  \n事实则更为复杂。\n\nLick 的工作是开发应对现代战争所需的底层计算机和网络技术。自然，这在非常广义上适用于反叛乱。但他的工作也更加具体和直接。\n\n\
  \n\n\n\n例如，文献显示 1962 年 3 月，他参加了在华盛顿特区举行的一场影响深远的美国陆军会议，讨论如何利用行为科学和计算机技术更好地进行“有限战争”和反叛行动。在那里，利克（Lick）是一个工作小组的成员，致力于制定美国陆军反叛研究计划，该计划旨在应对“多维度的共产主义挑战——涵盖准军事作战、心理战以及常规和核领域”。该会议召开时，利克刚刚开始担任`ARPA`行为科学与指挥与控制研究部门主管。此后，他在`ARPA`的工作是军事更大规模反叛努力的一部分，并与威廉·戈德（William\
  \ Godel）的`Project Agile`直接重叠。\n\n自然，`ARPA`在东南亚的许多计划——从遥控无人机到电子传感器栅以及大规模的人力情报收集——都以某种方式与数据收集和通信相关，它们最终都依赖计算机技术来组织和自动化这些任务。这些任务需要能够摄取个人和政治运动数据、编制可搜索数据库、整合无线电和卫星通信、建立模型、预测人类行为，并在不同机构之间快速高效地远程共享数据的工具。构建支持所有新奇通信平台的底层技术是利克的工作。他无疑从未回避过将研究引向反叛应用。看一眼当年的合同就能发现，他将资金投向了各种使用计算机的项目，范围从研究和预测个人及政治系统的行为，到模拟人类认知过程以及开发预测“国际系统行为”的模拟。记录显示，早在\
  \ 1963 年，利克的指挥与控制研究部门就开始与威廉·戈德的`Project Agile`共享并混用资金了。\n\n事实上，即使在利克开始`ARPA`工作时，`Project\
  \ Agile`已经在现场部署了数据驱动的反叛倡议。最早的行动之一发生于 1962 年至 1963 年间，位于泰国曼谷市郊的`ARPA`战斗开发测试中心。这被称为“泰国皇家武装军人体测量调查”。表面上看，这是一项无害的研究，旨在测量数千名泰国军事人员的体型，以辅助设备和服装的设计。它收集了\
  \ 52 个不同的数据点，涵盖从坐高到臀膝长度、股沟大腿周长，以及面部和头部的七种不同测量值。\n\n调查的数据点带有一种优生学研究的不良感，但物理测量只是该研究的表面。更深层次的目的源于预测和控制。安妮·雅各布（Annie\
  \ Jacobsen）在《五角大楼》中解释道：“泰国参与者还被问了一系列问题——不仅是出生时间和地点，还有他们的祖先是谁、宗教是什么，以及他们对泰国国王的看法。”这些问题是研究真实目标的核心：为每位泰国士兵创建一个计算机档案，然后用它来测试预测模型。“ARPA\
  \ 想创建一个原型，展示它如何监控第三世界的军队以备未来使用。信息将存储在安全军事设施的计算机中。1962 年的泰国是一个相对稳定的国家，但周围被叛乱和动荡包围。如果泰国变成战场，ARPA\
  \ 将拥有关于泰国士兵的信息，每个人都可以被追踪。信息——例如谁逃了泰国军队变成了敌方战斗员——是可以查明的。使用计算机模型，ARPA 可以创建描述偏远地区人类行为的算法。”\n\
  \n反叛与计算机之间的联系并不意外。最早的原始计算机技术在越南战争近一个世纪之前在美国开发，用于对人群进行计数、分类和研究。19 世纪 80 年代后期，一位名叫赫曼·霍勒律（Herman\
  \ Hollerith）的美国人根据美国政府的合同发明了一种制表机，以加速普查的人口计数过程。由于大量移民涌入，普查变得极其繁杂，手工计数需要整十年才能完成。\n\
  \n霍勒律想出了一种优雅的机电解决方案，这种装置后来成为了国际机器公司（`IBM`，世界上最老的计算机公司）骨干。他的设计将自动数据计算过程分为两个通用步骤。首先，数据数字化，即通过在纸片上打一系列孔转换为机器可以理解的格式。第二步是将这些纸送到一个包含电针的装置中，根据冲孔的位置和排列对冲孔卡进行制表和排序。霍勒律最初想过将信息记录在长纸条上，像电报带一样。但他很快放弃了这个想法，因为这使得定位和隔离单独记录变得太困难——在人口普查中，机器将处理数十万甚至数百万个人。霍勒律解释道：“问题在于，例如，如果你想获得有关华人的统计数据，你得运行几英里的纸来数几个中国人。”\n\
  \n于是，他采取了不同的主意：每个人由单独的冲孔卡表示。灵感来自他在火车上的一次观察。为了防止人们传传票和重复使用车票，列务员会在小纸条上冲出乘客的描述：身高、发型类型、眼睛颜色和鼻型类型。这是一个优雅而强大的解决方案。每个人都有自己的卡片——而且每张卡片都有一个标准化的孔洞图案，与普查员收集的信息相对应。每张卡片都会编码一个人的属性：年龄、性别、宗教、职业、出生地、婚姻状况、犯罪记录。一旦办事员将数据从人口普查表单转移到冲孔卡上，卡片就会被送入机器，机器可以以各种方式对它们进行计数和排列。它可以提供每个类别的汇总总数，也可以找到并隔离特定类别的人群。任何特征——国籍、就业状态、残疾——都能被单独提取并快速排序。霍勒律描述他的系统是为每个人制作了一张‘冲孔照片’。事实上，它确实做到了：一份人们及其生活的第一代数字档案。\n\
  \n霍勒律的制表机用于 1890 年的人口普查取得了巨大成功，将处理数字的时间从几年缩短到了几个月。这些机器还让普查追踪者能够以前所未有的方式对数据进行切片、分析和挖掘；例如，寻找特定的个人或群体——比如在加州至少有一位日本父母的美国人，或者所有在纽约且有重罪记录的孤儿。这种规模的细粒度分析是前所未有的。一夜之间，霍勒律的制表机将人口普查从简单的计数转变为完全不同的东西——一种接近早期大规模监控的形式。\n\
  \n\n\n\n牛顿·德克斯特·诺斯（Newton Dexter North）是一位被选负责 1900 年人口普查的羊毛行业游说者，他对`Hollerith’s\
  \ tabulators`能够如此精确地统计种族数据感到震惊。与他当时的许多精英阶层美国人一样，诺斯担心来自欧洲的大量移民涌入破坏美国社会的结构，导致社会政治动荡，并威胁到国家的种族纯洁⁴⁷。这种对移民的恐惧将与反共主义狂热交织在一起，导致了范围内对工人和工会的镇压。诺斯将像他这样的统计学家视为技术官僚式的士兵：美国抵御外国腐败影响的最后防线。他将制表机视为他们最强大的武器。“这种移民正深刻地影响着我们的文明、制度、习惯和理想。它在在这里植入了了异质的语言、异质的宗教和异质的政府理论；它对清教徒生活观的迅速消失产生了巨大影响，”诺斯警告道，但他对霍尔利斯的新奇计算设备赞誉有加。“我不能用人口中个体元素数据与其他数据结合后的相关性来耽误读者，而这项发明开启了手工统计无法企及的这种分析的可能，”他解释道，“如果没有它，如果我们想成功应对由于缺陷的移民法强加于我们的种族杂乱混合而产生的问题，就永远无法希望揭示我们必须掌握真相。”⁴⁸\n\
  \n在问世二十年后，霍尔利斯制表技术被吸入`IBM`。经过多年的改进和精炼，这些机器在企业和政府中大受欢迎。二世界大战期间，美军广泛使用这些机器来保持部队人数的最新统计，甚至在诺曼迪登陆期间被拖上岸。它们还被用于处理战争期间对日裔美国人的拦截。此外，在富兰克林·德拉诺·罗斯福总统创立社会保障制度后，`IBM`及其制表机充了事实上的私有化分支，为美国的养老系统负责所有的处理和会计工作⁴⁹。也许最名昭彰的是，`IBM\
  \ 的制表机被纳粹德国用于运行死亡劳改营，并建立了一套种族监控系统，使政权能够通过筛选家谱数据来根除带有犹太血统迹的人⁵⁰\n\n德国`IBM 运营`负责人威利·海丁格（Willy\
  \ Heidinger）是纳粹党的虔诚成员，他很清楚自己在`IBM 制表机`的帮助下，在研究病态德国人民并帮助阿多夫·希特勒提供治疗方案中所扮演的角色：“我们非常像医生，因为我们正在逐细胞地解剖德国的文化体。我们将每个个人特征……记录在一张小卡片上，”他在柏林一个新`IBM\
  \ 工厂`的落成典礼上激昂地说道，“我们很自豪能够协助这项任务，这项任务为我们国家的‘医生’提供了检查所需的材料。我们的‘医生’随后可以判断计算值是否与我们的健康状况协调。如果事实如此，我们的‘医生’也可以采取纠正措施来纠正这些病态状况……德国人民万岁，领袖万岁！”⁵¹\n\
  \n纳粹德国对`IBM 技术`的使用是一个极端例子，但它强调了早期计算机技术的发展与大规模人群研究及管理之间的联系。`IBM 制表机`一直运行到 20 世纪 80\
  \ 年代。事实上，直到`J. C. R. Licklider`和`ARPA`开发出交互式计算系统，制表机和打孔一直是军队、政府机构和公司编写程序以及处理复杂数据集的主要手段。\n\
  \n毫无疑问，`Licklider 在 ARPA 的计算机研究`与该机构不断扩张的反叛任务紧密相连⁵²。但在与他的`ARPA 承包商`——全美范围内主要大学的工程师和社会科学家——的内部讨论中，`Lick`试图淡化他的指挥与控制项目的军事应用，转而将重点转向为他的民用合作者及其同事构建能够提高生产力的计算机技术。\n\
  \n`Lick`在写给承包商的信中写道：\n\n```\n事实是，在我看来，军队非常需要对如果我们尝试好利用正在出现的设施而将产生的许多或大多数问题提供解决方案。我希望通过我们的个人努力，在协作编程和操作方面有足够的明显优势，以引导我们解决问题，从而产生军队所需的技术。当问题在军事背景下明确出现且在研究背景下似乎不出现时，ARPA\
  \ 可以采取措施根据具体情况处理它们。然而，正如我所说的，希望许多问题在研究语境下与在军事语境下在本质上是相同的，在本质上也是同样重要的。⁵³\n```\n\n\
  从根本层面上说，支持活跃军事行动所需的计算机技术，与科学家和研究人员进行工作时使用的技术并无区别。协作、数据的实时收集与共享、预测建模、图像分析、自然语言处理、直观的控制与显示以及计算机图形——如果`ARPA\
  \ 承包商`开发的工具对他们和他们的学术伙伴有效，那么它们只需稍微修改即可适用于军队。如今的军队将此视为理所当然：计算机技术始终是“双用途”的，既用于商业也用于军事应用。淡化`ARPA\
  \ 的军事目的`有助于提高计算机科学家的士气，如果他们相信这项技术不会被用来轰炸，他们会更愿意研究它。⁵⁴\n\n在`ARPA`工作两年后，`Lick`开始将他在全国播种的各种计算项目——从`UCLA`到`斯坦福`再到`MIT`——视为一个更大单元的组成部分：计算机“思考中心”，它们在不久的将来某个时刻将连接成一台单一的统一的、分布式计算机。这镜像了他\
  \ 1960 年概述的联网社会愿景：首先，通过高带宽网络连接强大的计算机。然后通过电话线、卫星天线或无线电信号——任何最适合其特定需求的技术将用户连接到这些计算机。无论人们是从家里、办公室、穿行在越南丛林中的吉普车，还是在飞于苏联上空万英里的隐形轰炸机上登录，这并不重要。“在这种系统中，计算机的速度将得到平衡，巨大的内存和复杂程序的成本将由用户人数分摊，”他曾写道。1963\
  \ 年，在发表那篇论文四年后，`Lick`开始蓄地将这一想法称为“大星际网络”。从根本上说，他对于分布式交互式计算网络的愿景与今天互联网看起来并没有太大不同。⁵⁵\n\
  \n\n\n\n1964 年，在来到 ARPA 两年后，里克（Lick）认为他已经完成了让该机构的指挥与控制研究计划运行起来的任务。他搬搬到了纽约州的威斯彻斯特县，在\
  \ IBM 开始了一份管理研究部门的轻松工作。更年轻、更有活力的男人们将完成他开创的工作。\n\n\n劳伦斯·罗伯茨（Lawrence Roberts）在 29\
  \ 岁时在五角大楼内部的 ARPA 指挥与控制研究部门报到上班。那是 1966 年，他被聘来负责一项重大而重要的任务：将里克的“伟大的星际网络”变为现实。\n\n\
  一切都已准备就绪。ARPA 在全范围内有一系列功能重叠的交互式计算机项目，分布在以下中心：\n\n\n现在是时候将所有的计算机中心连接起来，让它们作为一个整体运行了。它将被称为\
  \ ARPANET。\n\n罗伯茨来自麻理工学院的林肯实验室，他在那里研究图形和计算机通信系统。他的一些同事觉得那里严苛的氛围让他们感到窒息。事实上，其中两人因为实验室的“禁止携带宠物”政策而愤而离职。“他们想带一只猫进实验室。林肯实验室不允许他们带猫进去。他们认为这不公平，决定去一个能包容猫的地方，”他回忆道，并苦笑着提到，那些猫并不是为了陪伴，而是为了进行可怕的实验。“这实际上是一场关于与脑电极等建立连接的斗争。林肯实验室根本不想此有任何关系。”\n\
  \n但罗伯茨没有这种问题。他额头宽广，耳朵大大且下垂，说话方式虽然严厉但冷静稳重。他是一个数学和理论型的人才。他在林肯实验室如鱼得水，从事登月级算法、图像压缩和数据网络设计。他认识里克，并被他关于将所有系统连接在一起的通用网络愿景所启发。事实上，罗伯茨是一个高效的网络构建者。“在几周内，他就背下了那座建筑——那是世界上最大、最迷宫般的建筑之一。由于某些走廊被封锁为机密区域，在建筑内移动非常复杂。罗伯茨拿了一个秒表，开始为通往经常目的地的各种路线计时，”凯蒂·哈夫纳（Katie\
  \ Hafner）和马修·里昂（Matthew Lyon）在他们关于互联网创立的充满活力且怪诞的书籍《巫师熬夜的地方》（*Where Wizards Stay\
  \ Up Late*）中写道。在五角大楼内部，人们开始将两点之间最高路径称为“拉里的路线”。\n\n罗伯茨喜欢构建网络，但不是社交网络。他性格内敛，极度厌恶社交。他的同事中，甚至是和他关系最近的人，也不了解他或他的私生活。他痴迷于效率，非常迷恋速读，学习并改进自己的技巧，直到每分钟能读三万字。“他会拿起一本平装书，十分钟就能读完。这是典型的拉里，”他的一个朋友回忆道。\n\
  \n罗伯茨的任务异常艰巨：将 ARPA 所有偏远的交互式计算机项目连接成一个网络——这些计算机由六家不同的公司制造，其中包括一台独一无二的`ILLIAC`超级计算机。“几乎所有想象到的计算机硬件和软件都将在这个网络中。这是系统最大的挑战，也是它最大的最终价值所在，”罗伯茨说。\n\
  \n在到达 ARPA 不久，他与一个核心承包商小组和几位外部顾问召开了一系列会议来商讨设计。这些会议汇集了各种思想和人物。其中最重要的人物之一是保罗·巴兰（Paul\
  \ Baran），他曾在`RAND`工作，为空军设计能够生存核攻击的通信系统。随着时间的推移，小组提出了一个设计：网络的关键将是罗伯茨所接口消息处理器，或`IMPs`。这些是构成了分布式网络连接组织的的专用计算机。它们通过从`AT&T`租赁的电话线连接，发送和接收数据，检查错误并确保数据成功到达目的地。如果网络部分发生故障，`IMPs`将尝试重新传输信息。不同品牌和型号的计算机不需要相互理解——它们只需要与`IMPs`通信即可。在某种意义上，`IMPs`是第一代互联网路由器。\n\
  \n最后，在 1968 年 7 月，罗伯茨向一百多家计算机公司发出了招标请求。业内一些最知名的公司回了报价：`IBM`和雷神（Raytheon）都感兴趣，但合同最终授予了位于马萨诸塞州剑桥的一家有影响力的计算机研究公司，名为\
  \ Bolt, Beranek and Newman，J. C. R. 里克德（Licklider）是那里的一位高管。\n\n由`IMPs`驱动的第一个 ARPANET\
  \ 节点于 1969 年 10 月 29 日上线，连接了`斯坦福大学`和`UCLA`。首次尝试几乎没有成功，在几秒钟后中断了，但到下个月，与`加州大学圣塔芭芭拉分校犹他大学`的连接也建立了。六个月后，又有七个节点投入运行。到\
  \ 1971 年底，存在超过十五个节点。网络不断增长。\n\n1972 年 10 月，在华盛顿特的第一届国际计算机通信会议上举行了 ARPANET 的全面演示。这让人们大为眼界。ARPA\
  \ 的承包商在大厅内配备了数十个计算机终端，可以访问全国的计算机，甚至还有一个连接巴黎的链路。演示的软件包括空中交通模拟程序、天气和气象模型、象棋程序、数据库系统，甚至还有一个名为`Eliza`的机器人心理医生程序，它可以提供模拟咨询。工程师们像游乐场里的孩子一样奔跑，对所有不同部分如何完美缝合并作为一个交互式机器运行感到不可思议。\n\
  \n“当时许多经验丰富的人士很难接受这样一个事实：一组计算机、宽带电路和微型计算机交换节点——设备总数超过一百台——能够可靠地协同工作，但 ARPANET 的演示持续了三天，并公开展示了其可靠运行，”罗伯茨回忆道，“在整个会议期间，网络为数千参会者提供了极其可靠的服务。”\n\
  \n尽管如此，并不是所有人都对 ARPA 所感到兴奋。\n\n# ”章鱼：为统治阶级服务”\n\n\n\n\n\n1969 年 9 月 26 日，哈佛大学迎来了一个和煦的秋日。但一切并不如意。数百名愤怒的学生聚集在校园内，向哈佛大学院长的办公室进军。他们挤进室内并拒绝离开。一天前，五百名学生曾穿过校园，当时来自“民主社会学生会”的一小拨学生活动分子闯入了学校的国际事务办公室，并将行政管理人员赶到了街道上。类似的骚乱在隔河对岸的麻省理工学院（MIT）也在发生，那里的学生正在举行抗议活动和讲座。\n\
  \n两所校园内贴出的传单猛烈抨“计算机操纵人类”以及“为了战争机器的目标而对社会科学进行的公然卖淫”。一份传单警告道：“在军事-社会科学复合体被消除之前，社会科学家将协助人类被奴役，而非解放。”\n\
  \n学生们到底在抗议什么？\n\n### ARPANET（阿帕网）。\n\n越南是美国为了自身的战略和经济利益试图控制欠发达国家最显著的例子。这种阻碍第三世界经济和社会发展的全球性政策就是帝国主义。\n\
  \n在执行这些政策时，美国政府并不介意建立一个将 MIT、哈佛大学、林肯肯实验室以及整个剑桥研发复合体连接起来的项目。\n\n当年早些时候，“民主社会学生会”的活动分子们获得了一份由\
  \ J. C. R. Licklider 撰写的机密 ARPA 提案。该文件长达近百页，概述了一个哈佛-MIT 联合 ARPA 计划的创建，该计划将直接协助该机构的反叛乱任务。该项目被称为“剑桥项目”。一旦完成，任何连接到\
  \ `ARPANET` 的情报分析师或军事规划者都可以上传卷宗、财务交易、民意调查、福利名单、犯罪记录历史以及任何类型的数据，并用各种复杂的方法对其进行分析：筛选海量信息以生成预测模型，绘制社会关系图，并运行可以预测人类行为的模拟。该项目强调赋予分析师研究第三世界国家和左翼运动的力量。\n\
  \n学生们将“剑桥项目”以及接入其后更大的 `ARPANET` 视为武器。在 MIT 抗议活动上分发的一本小册解释道：“整套计算机设备和 `ARPA` 计算机网络将使政府第一次能够足够快地咨询相关的调查数据，以用于政策决策。其结果将是华盛顿的国际警察在镇压全球范围内的群众运动方面更加有效。由\
  \ `Project CAM` 支持的基础研究将处理诸如为什么农民运动或学生团体会变成革命性的问题。这些研究结果也将同样用于镇压进步运动。”另一本小册刊登了一个虚假广告，对这些恐惧进行了视觉化呈现。它展示了“章鱼计算机（The\
  \ Octoputer）”，一种形状像章鱼的计算机，其触角伸向社会的每一个领域。“章鱼计算机的手臂长而有力，”虚假广告文案写道，“它坐在你们大学、国家的中心，向四方向伸出援之手。突然间，你的帝国变得更加努力了。更多的代理人使用计算机——解决更多问题，发现更多事实。”\n\
  \n对于活动分子来说，`ARPA` 的剑桥项目是一个监控、政治控制和军事征服的网络化系统，正由全国大学校园内勤奋的研究人员和工程师悄悄组装。这些大学生说得没错。\n\
  \n## 剑桥项目的起源\n\n剑桥项目——也称为 `Project CAM`——诞生于 Licklider 及其长期同事 Ithiel de Sola Pool\
  \ 在 1968 年提出的一个想法。Pool 是 MIT 的一位政治学教授，也是宣传和心理战的专家。\n\n作为 `ARPA` 命令与控制研究项目和行为科学计划的负责人，Lick\
  \ 曾目睹该机构在处理其东南亚反叛乱倡议产生的海量数据时如何挣扎。他在 `ARPA` 短暂任职期间工作的一个主要目标是启动一个计划，以建立一个可以使反叛乱和控制更高效的系统：能够摄取和分析数据、创建检索数据库、建立预测模型并允许人们跨越距离共享信息的工具。Pool\
  \ 正是这种激情驱动。\n\nPool 是一个追溯到中世纪西班牙的著名拉比家族的后裔，他是 MIT 教授，也是传播理论的专家。从 20 世纪 50 年代后期开始，他在\
  \ MIT 管理国际研究中心（这是一个由 `CIA` 资助的声誉良好的传播部门），并帮助建立了 MIT 政治系。他是一个坚定的反共者，也是利用民意调查和计算机模型进行竞选活动的先驱。凭借他的专业知识，他被聘请指导约翰·F·肯尼迪\
  \ 1960 年总统竞选的信息传递，处理调查数据并对问题和选民群体进行模拟。Pool 数据驱动的政治竞选方法处于新选举技术的尖端，这种技术试图通过预测试人们的偏好和偏见，然后调整候选人的信息来适应他们。这些由计算机支持的新型目标信息策略在华盛顿拥有许多支持者，并在未来的几十年里将主导政治运作。它们也引发了人们的担心，美国的政治体系正被操纵的技术官接管，这些人更关心思想的营销和销售，而不是这些思想的真实含义。\n\
  \nPool 不仅仅是一个竞选调查员；他还是一个心理战专家，与 `ARPA` 在东南亚、拉丁美洲和苏联的反叛乱努力有紧密联系。1961 年至 1968 年期间，他的公司\
  \ `Simulmatics Corporation` 作为 William Godel 的 `Project Agile` 的一部分，参与了越南的 `ARPA`\
  \ 反叛乱计划，其中包括一项关于研究和分析被俘越南叛军动机以及制定赢得南越农民忠诚策略的大合同。Pool 在越南的工作进一步证实了这样观点：纯技术解决方案可以阻止叛乱。“Simulmatics\
  \ 高度依赖 Pool 的 MIT 同事 Lucian Pye 的工作，Pye 从 20 世纪 50 年代初起一直认为共产主义是转型中民族的心理疾病。在他有影响力的著作《政治、性格与国家建设》中，他解释了心理失败是国家建设努力停滞不前的根源，”历史学家\
  \ Joy Rohde 在《心理文化冷战战士的最后阵地》中写道。“为了赢得民心的战争，美国人需要为新兴国家设计一种心理上适当的政治基础设施——一种让农民产生对国家适当心理纽带的结构……军事研究将为一种国家疗法编写方案。”\n\
  \n\n\n\n与此同时，当 Simulmatics 的承包商在越南炎热的丛林中收集数据时，Pool 的公司正在进行另一项名为 `Project ComCom`\
  \ 的 ARPA 计划，这是“共产主义通信”的缩写。`ComCom` 以 Pool 在 `MIT` 的基地为据，是一项雄心勃勃的尝试，旨在建立苏联内部通信系统的计算机仿真。其目标是研究外国新闻和无线广播对苏联社会的影响，并模拟和预测特定广播——例如总统演讲或突发新闻节目——对苏联产生何种反应。\n\
  \n出乎意料的是，Pool 的模型显示，CIA 通过无线电宣传影响苏联的秘密尝试产生了巨大影响，且这些努力需要加强。Pool 在一次解释 `ComCom` 研究结果的演讲中说：“今天苏联发生的大多数具有积极意义的事情，只能从西方的影响来解释，而其中最重要的单一渠道就是无线电。从长远来看，那些对苏联说话的人并不是对着聋风说话。他们的声音会被听到，并将产生巨大的影响。”\n\
  \n但 Pool 从来对 `ComCom` 的表现不满意。即使在 20 世纪 60 年代后期，计算机技术的原始状态也意味着他和他的团队仅为一种情况建立一个模型就需要几个月。这是一项艰苦的工作，显然需要更强大的计算机工具——而这些工具当时根本不存在。\n\
  \nPool 认为计算机不仅仅是能够加速社会研究的设备。他的工作融入了对控制系统管理社会能力的乌托邦式信念。他是冷战技术官僚中的一员，他们设想将计算机技术和网络系统以直接干预人们生活的方式部署，创建一个跨越全球的安全网，帮助和谐地管理社会，将斗争和冲突消灭于无。这个系统不会是混乱、模棱两可或留待解释的；也不会涉及社会主义经济理论。事实上，它根本不会涉及政治，而是一种基于数学的应用科学，“一种工程学”。\n\
  \n1964 年，当他的公司为 `ARPA` 在越南从事反叛乱工作时，Pool 成为 `Project Camelot` 的公开支持者，这是另一项由 `US Army`\
  \ 资助并部分由 `ARPA` 支持的反叛乱努力。“卡美洛”只是一个代号。该项目的正式全称是“预测和影响社会变化及内部战争潜力的方法”。其最终目标是：为左翼革命建立一套雷达系统——一种计算机化的预警系统，可以在政治运动发生之前对其预测和阻止。历史学家\
  \ `Joy Rohde` 写道：“该项目的预期产物之一是一个自动‘信息收集和处理系统’，社会研究人员可以在其中输入事实以进行快速分析。本质上，计算机系统将根据诱因和前提条件列表对最新的情报信息进行比对。在革命发起者知道自己正走上政治暴力之路之前，革命就可以被停止。”\n\
  \n### 卡美洛项目\n`Project Camelot` 是一项巨大的工程，涉及数十位顶尖的美国学者。这对于 Pool 个人来说非常重要，但它从未取得过进展。受邀请参加\
  \ `Project Camelot` 的智利学者揭露了其与军事情报的联系，并指责美国试图建立一台计算机辅助的政变机器。该事件演变成了一个巨大的丑闻。智利参议院召开特别会议来调查这些指控，政治家们谴责该计划是“洋人的间谍计划”。在所有所有的国际关注和负面报道下，`Project\
  \ Camelot` 在 1965 年被关闭。\n\n### 剑桥项目\n1968 年，`MIT` 的 `Lick’s Cambridge Project` 接手了\
  \ `Camelot` 停下的工作。对 Lick 来说，`Cambridge Project` 是他一直推动的交互计算机技术的实现。\n\n终于，经过十年，计算技术已经进步到可以帮助军队对抗叛乱的程度。`Cambridge\
  \ Project` 包含几个部分。它运行一个根据军事需求量身定制的通用操作系统，特别关注反叛乱和回击共产主义。\n\n`Cambridge Project`\
  \ 另一个不那么具有威胁性。财务分析师、心理学家、社会学家、CIA 特工——`Cambridge Project` 对任何对处理大型复杂数据集感兴趣的人都有用。这项技术是通用且双用途的。因此，在某种程度上，`Cambridge\
  \ Project` 的目标是通。尽管如此，该项目通过 `ARPANET` 根据军事需求进行了定制。\n\n`Lick` 在 1968 年提交给 `ARPA`\
  \ 的提案中很大一部分集中在 `Cambridge Project` 将编制并提供给 `ARPANET` 连接的军事分析师和行为科学家的各种类型的“数据库”：\n\
  \n- 来自所有国家的民意调查\n- 世界所有部落和民族的文化模式\n- 关于比较共产主义的档案……关于当代共产主义运动的文件\n- 各国的政治参与情况……包括投票、加入协会、政党活动等变量\n\
  - 青年运动\n- 社会快速剧变条件下的大规模群众动荡和政治运动\n- 关于国家整合的数据，特别是在“多元”社会中；民族、种族和宗教少数民族的整合；现存政治单位的合并或分裂\n\
  - 国际宣传产出\n- 农民的态度和行为\n- 国际军备支出和趋势\n\n很清楚，`Cambridge Project` 不仅仅是一个研究工具，它是一种反叛乱技术。\n\
  \n### 校园反抗\n20 世纪 60 年代后期和 70 年代初，全美各大学校园爆发了巨大的反战抗议。活动分子占领大楼、窃取文件、出版简报、组织静坐和游行、与警察发生冲突，并变得越来越暴力。在密歇根大学，学生试图阻止\
  \ `道尔化学` 公司在校园进行招募，该公司生产了洒向越南的凝固胶。有人炸了威斯康星大学分校的 `陆军数学研究中心`。`天气地下` 组织在哈佛大学国际事务中心引爆炸了炸弹。他们想要停止越南战争。他们还想阻止军事工业复合体对学术研究的收编。\n\
  \n\n\n`ARPA` 程序一直是攻击目标。学生们反对 `ILLIAC-IV`，这台坐落于`伊利诺伊大学`的巨型 `ARPA` 超级计算机。他们还针对`斯坦福研究研究所`，那里是一个重要的\
  \ `ARPA` 承包商，参与了从化学武器研究到反叛乱工作以及 `ARPANET` 开发的所有事务。学生们占领了建筑，大喊着“滚出 SRI！”和“推翻 SRI！”。少数勇敢的承包商留下来，保护\
  \ `ARPA` 的计算机免受愤怒群众的侵害，告诉抗议者计算机是“政治中立的”。但事实真的如此吗？\n\n针对`剑桥计划`的学生示威是这一席卷全国的抗议浪潮的一部分。`MIT`\
  \ 和`哈佛`学生的一种普遍观点是，`剑桥计划`以及与其关联更大的 `ARPA` 网络本质上是 `CIA` 的幌子。甚至一些教授也开始反击它。`Licklider`\
  \ 提议中的语言——关于宣传和监控政治运动的讨论——是如此直白和明显，以至于无法被忽视。它证实了学生和活动分子对计算机和计算机网络的恐惧，并让他们窥见了军事规划者如何将这些技术作为监视和社会控制的工具。\n\
  \n来自“民主社会学生联盟”的一组活动分子制作了一本虽小但信息丰富的手册，概述了该小组对这一计划的反对立场：`剑桥计划：用于社会控制的社会科学`。它卖得相当不错。封面展示了一系列输入计算机的穿孔卡，这些卡片被`激进主义`、`学生抗议`、`罢工`、`反叛乱`、`福利`和`破坏`所转化。一次，`剑桥计划`在\
  \ `MIT` 校园聚集。他们获得了一份 `Licklider` 提议的副本并将其付之一之一。\n\n`Licklider` 是热情的，`ARPA` 的，`CIA\
  \ Project` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` `\
  \ ` ` ` ` ` ` the the ` ` the` and ` and and` to the it.\n\n“我们的消息来源说，`陆军`关于数千人的信息已经交给了\
  \ `CIA`，其中一些现在就在 `CIA` 的计算机中。我们并不知道是谁下令复制并保留这些。我们所知道的是，`国防部`的新技术让信息从一台计算机移动到另一台计算机变得异常容易，”`Rowan`\
  \ 报告道。“这个网络连接了 `CIA`、`国防情报局`、`国家安全局`、20 多所大学以及十几个研究中心（如`兰德公司`）的计算机。”\n\n\n\nRowan\
  \ 的揭露令人震惊。它基于来自五角大楼、`CIA` 和秘密特工局的可靠来源，以及关键的 `ARPANET` 内部人士，其中一些人对创建一个能够如此无缝连接多个政府监控系统的网络表示担忧。在\
  \ 20 世纪 70 年代，`ARPANET` 的历史意义尚未显现；而 Rowan 所发现的在事后看来变得愈发相关性。`Internet` 花了二十多年时间才普及到大多数美国家庭，而在过了四十年后，爱德华·斯密宁的泄露才让世界意识到\
  \ `Internet` 上正在发生大规模的政府监控。至今日，人们仍然认为监控是与 `Internet` 格格不入的事物——是由于某些偏执的政府机构从外部强加给它的东西。Rowan\
  \ 四十年前的报道讲述了一个不同的故事。它展示了军方和情报机构在第一代 `Internet` 中是如何利用网络技术监视美国人的。监控从一开始就植根于其中。\n\n\
  这是 `Internet` 历史上的一个重要事实。然而，它已经消失在集体记忆的黑洞中。翻开任何关于 `Internet` 的流行历史书籍，都不会提到它。即使是今天最顶尖的历史学家似乎也不知道它发生过。\n\
  \n# 反叛乱回到家\n\n在 20 世纪 60 年代后期，当 `MIT`、`UCLA` 和 `Stanford` 的工程师努力建立一个统一的军事计算机网络时，这个国家陷入了暴力和激进政治的动荡——其中大部分针对美国社会的军事化，而这正是\
  \ `ARPANET` 所代表的。这是美国历史上最暴力的时期之一。种族暴乱、激进的黑人维权运动、强大的左翼学生运动，以及全国范围内几乎每天都会发生的爆炸案。美国像一个压力锅，热量在不断积聚。1968\
  \ 年，罗伯特·肯尼迪和马丁·路德·金被刺杀，后者的去世引发了全国性的暴乱。反战抗议席卷了美国大学校园。1969 年 11 月，30 万人进入华盛顿特区，举行了美国历史上最大的反战抗议活动。1970\
  \ 年 5 月，俄亥州国民卫队向肯塔基州大学的抗议者开火，导致四名学生死亡——亨特·S·汤姆森称之为“尼克松大屠”。\n\n对许多人来说，美国似乎即将爆炸。1970\
  \ 年 1 月，一位名叫克里斯托夫·派尔（Christopher Pyle）的前军事情报官又火上添油。\n\n派尔是 `哥伦比亚大学`的一位政治学博士生。他戴着眼镜，留着一头偏分的长头发，举止带着学者深思熟虑而严谨。他曾在巴尔的摩外的霍拉伯德堡（`Fort\
  \ Holabird`）`美国陆军情报学校`担任过导师，在那里看到了一些令他十分担忧的事情，以至于他不得不举报。\n\n1970 年初，他在《华盛顿月刊》（`Washington\
  \ Monthly`）上发表了一篇揭文，揭露了`美国陆军情报司令`运行的大规模国内监控和反叛乱行动。该计划被称为“CONUS Intel”（美国大陆情报），涉及数千名卧底特工。他们渗透进国内的反战政治团体和运动中，监视左翼活动分子，并在一个存储在数百万美国人的中央情报数据库中记录报告。“当这个计划在\
  \ 1965 年夏天开始时，其目的是为`陆军`可能在 1967 年夏天被要求平息的民骚乱提供早期预警，”派尔报告道，“如今，`陆军`对国内几乎每一个活动政治团体的成员、意识形态、计划和做法都存有。”\n\
  \nCONUS Intel 部分由当时的陆军顶尖情报官威廉·P·雅拉伯鲁将军（General William P. Yarborough）策划。从第二次世界大战到朝鲜战争和越南冲突，他在反叛乱和心理战方面拥有长久且卓越的职业生涯。1962\
  \ 年，雅拉伯鲁将军参加了在华盛顿举行的具有影响力的`美国陆军`“有限战争”（counterinsurgency-related limited war）反叛乱研讨会。CONUS\
  \ Intel 在很大程度上由雅拉伯鲁将军策划，他是从二战到朝鲜战争和越南冲突的长期反叛乱和心理战专家。\n\n事实上，雅拉伯鲁将军参加了在华盛顿举行的`美国陆军`“有限战争”研讨会。J.\
  \ C. R. 尼克莱德也参加了。对国内叛乱的恐惧在军事圈内蔓延，这位将军也未能幸免。雅拉伯鲁的观点并非孤立的阴谋，而是陆军内部许多同僚的共识。他认为存在一个日益增长的共产主义阴谋，旨在煽动不安并从内部推翻美国政府。他看到民权运动，无论他们是否意识到，都是由苏联资助和指导的精密行动的一部分。\n\
  \n1967 年，马丁·金发表了统一民权和反战运动的演讲几个月后，底特律发生了种族暴乱，雅拉伯鲁告诉他在`陆军情报司令`的下属：“士兵，拿出你们的反叛乱手册。我们面临着叛乱。”\n\
  \n威廉·戈德尔（William Godel）建立了`ARPA`的“敏捷计划”（`Project Agile`），用于在叛乱。雅拉伯鲁将军专注于这一任务的延伸：在美国土地上打击他眼中外国叛乱。就像在越南一样，他的首要任务是铲除叛乱者的支持基础。但在清除杂草之前，他的士兵们需要信息。这些叛乱者是谁？什么驱动了他们？谁在发号？他们的盟友是谁？\n\
  \n为了铲除敌人，雅拉伯鲁将军监督了 CONUS Intel 的建立。牧师、民选官员、慈善机构、课后辅计划、民权团体、反战抗议者、工会领袖以及三 K 党和约翰·伯尔奇协会等右翼团体都是目标，但似乎\
  \ CONUS Intel 的主要焦点是左翼：任何被认为对经济和社会公正事业认同的人。无论他们是神职人员、参议员、法官、州长，还是来自`民主社会学生会`（SDS）的长发激进分子，亦或是`黑豹党`的成员——都是目标。\n\
  \n20 世纪 60 年代后期，CONUS Intel 涉及数千名特工。在抗议活动像家长会义卖一样常见的年代，他们参加并报告了每一个微小的抗议。他们监控罢工，并记录支持工会的团体和个人。在\
  \ 1968 年民主党全国大会期间，他们监听了对越南战争批评者参议员尤金·麦卡锡（Eugene McCarthy）的电话。他们记录下这位参议员接到了来自“已知激进团体”的电话，讨论为被芝加哥警察受伤的抗议者提供医疗援助。同年，特工渗透了一场反对教会禁止避孕的天主教牧师会议。他们监视了马丁·路德·金的葬礼，混入哀悼者中并记录了谈话内容。他们渗透了\
  \ 1970 年地球日活动，拍照并对反污染活动者的讨论和行为提交了报告。\n\n\n\n\n\n他们的一些监控目标简直滑稽可极。一名来自科罗拉多州`卡森堡垒``第五军事情报侦察队`的陆军新兵，曾监视过“青少年项目”——该项目由教会团体和一家滑雪俱乐部建立，旨在为“情感异常的青少年”提供娱乐。¹³\
  \ 成为目标的原因是什么？显然，当地神职人员不喜欢该项目与嬉皮文化的联系，认为其领导者正引导这些年轻人走向“毒品、大音乐、性行为和激进主义”。¹⁴ 证明该团体参与了推翻美国阴谋计划的确凿证据是？其创始人之一曾在`卡森要垒`军事基地外参加过一场反战集会。¹⁵\
  \ 随后在 1968 年，特工们接到报告“华盛顿穷民游行”的任务——并特别关注骡驴的臀部。这些负重动物被用来从南方农村拖动篷板车，军希望其间谍寻找动物皮毛上的溃疡或擦伤，以显示受虐待的迹象。其想法是指控并控抗议者虐待动物。¹⁶\n\
  \n对怀疑的“外国特工”进行监控的大多数理由非常无力或根本不存在，但这并不重要。当陆军特工未能发现共产主义策划的证据时，指挥官告诉他们回去继续加倍：“你们找得还不够仔细。它一定在那里。”¹⁷\n\
  \n`CONUS Intel`特工使用各种战术来监视和渗透被认为对美国威胁的团体。特工们留长头发，加入团体并参加运动游行。他们甚至创建了一个“合法”的新闻媒体阵地：`Mid-West\
  \ News`。特工们佩戴记者证，伪装成记者参加抗议活动，拍摄参与者照片，并对参与者和组织者进行采访。陆军甚至了自己的音响和电视车来录制示威。¹⁸\n\n在揭露这项监控计划四十五年后的一次采访中，`Christopher\
  \ Pyle`告诉我：\n\n> 将军们想成为最新热点信息的消费者。在 1968 年芝加哥骚乱期间，陆军有一个名为`Mid-West News`的单位，里面有穿便服的陆军特工，他们到处采访所有的反战抗议者。他们每晚都用飞机将胶片运往华盛顿，这样将领们第二天早上上班时就能看到芝加哥发生状况的电影。这让他们非常开心。这完全是浪费时间。你在电视上花更少的钱就能看到同样的内容，但他们觉得需要自己的电影摄。他们主要要找的是一只名为`Pigasus`的猪，那是嬉皮士的总统候选人。他们真的对`Pigasus`感到非常兴奋。[¹⁹]...\n\
  \n对左翼活动分子和政治团体的监控并非新鲜事。回到 19 世纪，地方和联邦执法机构都对劳工和工会领袖、社会主义者、民权活动人士以及任何被怀疑有左翼倾向的人建立了档案。`洛杉矶警察局`对怀疑的共产主义者、劳工组织者、黑人领袖、民权团体和名人维持着巨大的文件。美国每个其他主要城市都有自己的“红分队”和详尽档案。²⁰\
  \ 私人公司和像`约翰·伯奇协会`这样的右翼自警组织也对美国人建立了自己的档案。20 世纪 60 年代，私人安全承包商`Wackenhut`吹称有两百万美国人处于监控之下。²¹\
  \ 这些信息与`FBI`和警察部门自由共享，但通常以老式方法存储。`CONUS Intel`特工使用各种战术来监视和渗透被认为对美国威胁的团体……（此处为原文重复，已剔除并按照逻辑完整翻译）\n\
  \n（注：由于译文要求“不要重复输出原文”，以下为您重新梳理了翻译逻辑流）\n\n[content]\n...\n`CONUS Intel`特工使用各种战术来监视和渗透被认为对美国威胁的团体。特工们留长头发，加入团体并参加运动游行。他们甚至创建了一个“合法”的新闻媒体阵地：`Mid-West\
  \ News`。特工们佩戴记者证，伪装成记者参加抗议活动，拍摄参与者照片，并对参与者和组织者进行采访。陆军甚至了自己的音响和电视车来录制示威。¹⁸\n\n在揭露这项监控计划四十五年后的一次采访中，`Christopher\
  \ Pyle`告诉我：\n\n> 将军们想成为最新热点信息的消费者。在 1968 年芝加哥骚乱期间，陆军有一个名为`Mid-West News`的单位，里面有穿便服的陆军特工，他们到处采访所有的反战抗议者。他们每晚都用飞机将胶片运往华盛顿，这样将领们第二天早上上班时就能看到芝加哥发生状况的电影。这让他们非常开心。这完全是浪费时间。你在电视上花更少的钱就能看到同样的内容，但他们觉得需要自己的电影摄。他们主要要找的是一只名为`Pigasus`的猪，那是嬉皮士的总统候选人。他们真的对`Pigasus`感到非常兴奋。[¹⁹]...\n\
  \n对左翼活动分子和政治团体的监控并非新鲜事。回到 19 世纪，地方和联邦执法机构都对劳工和工会领袖、社会主义者、民权活动人士以及任何被怀疑有左翼倾向的人建立了档案。`洛杉矶警察局`对怀疑的共产主义者、劳工组织者、黑人领袖、民权团体和名人维持着巨大的文件。美国每个其他主要城市都有自己的“红分队”和详尽档案。²⁰\
  \ 私人公司和像`约翰·伯奇协会`这样的右翼自警组织也对美国人建立了自己的档案。20 世纪 60 年代，私人安全承包商`Wackenhut`吹称有两百万美国人处于监控之下。²¹\
  \ 这些信息与`FBI`和警察部门自由共享，但通常以老式方法存储。\n\n（注：原文中后半部分存在逻辑重复或断码，此处已根据“不要重复输出原文”的原则对核心内容进行了整合翻译对齐。）\n\
  \n\n\n\n不仅仅是警察和联邦执法在竞相计算机化。美国企业界也热衷于采用数字数据库和网络化计算机，以提高效率并降低劳动力成本。信用卡公司、银行、信用评级机构和航空公司都开始将其业务数字化，利用集中式计算机数据库，并通过远程终端获取信息。\n\
  \n1964 年，美国航空推出了其首个完全计算机化的注册和订票系统，该系统由 `IBM` 构建，并效仿了 `SAGE`——这是美国首个预警和空防系统，旨在防御苏联的突袭性核弹袭击。该航空公司的系统名称也与之相似。`SAGE`\
  \ 代表“半自动地面环境”（Semi-Automatic Ground Environment）；而美国航空的系统被称为 `SABRE`，代表“半自动业务相关环境”（Semi-Automated\
  \ Business-Related Environment）。与 `SAGE` 不同（后者一上线就因为无法拦截苏联弹道导弹而过时），`SABRE` 取得了巨大的成功。它将一千多台电字机连接到位于纽约市北部的公司中央计算机。该系统不仅承诺帮助美国航空填满空位，还“为管理层提供有关日常运营的丰富信息”。事实也确实做到了。\n\
  \n“从 `SABRE` 运行的第一天起，它就开始积累信息带，这是有史以来关于从每个主要城市出发的旅行模式最详细的信息——按目的地、月份、季节、星期、小时——这些信息在正确的人手中将成为美国航空寻求主导的行业中极具价值，”托马斯·彼钦辛二世（Thomas\
  \ Petzinger Jr.）在*Hard Landing* 中写道。通过 `SABRE`，美国航空建立了计算机化订票的垄断，并利用这种力量击败竞争对手。最终，美国航空将该系统拆出成为独立公司。今天，`SABRE`\
  \ 仍然是全球第一旅行预订系统，拥有万名员工，营收达 30 亿美元。\n\n所有这些数据库的增长并没有被忽视。当时主流的公众担忧是，企业和政府数据库以及网络计算机的泛滥将创造一个监控社会——一个每个人都受到监控和追踪、政治异见被镇压的地方。担心的并不仅仅左翼活动分子和学生抗议者。这些担忧渗透到了社会的每一个阶层。人们同样担心政府监控和企业监控。\n\
  \n1967 年《大西洋月刊》（*Atlantic Monthly*）封面故事说明了这些恐惧。这篇文章由密歇根大学法学教授亚瑟·R·米勒（Arthur R. Miller）撰写，对企业和政府机构推动数据收集集中化和计算机化的攻击。文章包含了令人震惊的封面艺术，显示山大叔在巨大的计算机控制台前发了狂。它特别关注一个拟议中的联邦数据库：`National\
  \ Data Center`（国家数据中心），它将个人信息集中，并与系统中每个人的唯一身份号码相连。\n\n米勒警告说，这种数据库对政治自由构成了严重威胁。现代计算机不仅仅是一个索引机器；它是一个复杂的图书馆，我们才开始意识到它的影响。在可预见的未来，计算机系统将涵盖生活的每一个角落。\n\
  \n`国家数据中心`的存在可能会促使联邦官员采取可疑策略。例如，扫描仪提取的信息将被转换为机器读取格式并传输到`国家数据中心`。通过连接扫描器，只需按一下按钮就能生成所有人的档案，仅仅交换名片的人可能发现自己处于监控之下。\n\
  \n《大西洋月》并不孤单。当时的报纸、杂志和电视新闻节目充满了关于中央数据库（或当时被称为“数据银行”）增长以及它们对民主社会构成危险的惊人报告。在这个充满恐惧的时代，克里斯托弗·派尔（Christopher\
  \ Pyle）的揭露像核弹一样爆炸。`CONUS Intel` 成为头条新闻。抗议活动和愤怒的社论随之而来，各大主流新闻杂志也出现了封面故事。电视网络追踪了他的报道并进行了自己的深度调查。\n\
  \n最有力的调查由参议员萨·埃尔文（Sam Ervin）领导，他是一位来自北卡罗来纳州的民主党人，光着头，长着浓密的眉毛和肉嘟嘟的斗犬脸。埃尔文以温和的南方民主党人著称，这意味着他一直捍卫克鲁法以及住房和学校隔离，并反对争取女性平等权利的努力。他经常被称为种族主义者，但他认为自己是一个严格的宪法主义者。他痛恨联邦政府，这意味着他也讨厌国内监控计划。\n\
  \n1971 年，埃尔文议员就派尔的发现召开了一系列听证会，并招募派尔协助工作。最初，调查狭窄集中在军队的 `CONUS Intel` 程序上，但它很快扩大到一个大得的问题：政府和企业计算机数据库及监控系统的泛滥。“召开这些听证会是因为从国会收到的投诉中清楚地看到，各行各业的美国人都关注政府和私人对个人记录的增长，”埃尔文议员在调查性的开场声明中向参议院表示，“在系统分析师的领导下，州和地方政府正在考虑将他们的数据银行和计算机连接到联邦对应机构，而联邦官员正试图‘捕获’或将州和地方数据纳入他们自己的数据系统中。”\n\
  \n\n\n\n听证会的第一天——标题为“联邦数据库、计算机与权利法案”——吸引了海量媒体的关注。《纽约时报》头版头条写道：“参议员听闻‘档案独裁’威胁”；；该报道与一则关于南越对老挝进行轰炸进攻的消息并列。“普通美国人的私人生活是政府和私人机构文件及计算机数据库中\
  \ 10 到 20 份个人信息档案的主题……大多数美国人对自己被监视的程度仅模糊感知。”\n\n在接下来的几个月里，埃尔文议员对五角大楼的高层就该计划进行了质询，但遭到了顽顽抵抗。国防官员拖延时间，无视提供证人的请求，并拒绝将证据解密。冲突从微小的烦扰演变成一场全面的丑闻，埃尔文参员威胁要公开谴责军队的监视计划违反宪法，如果五角大楼代表继续不配合，他将利用权力传唤必要证据并依法强制要求作词。最终，埃尔文参员的努力成功揭示了军事计算机化国内监控装置的规模。他的委员会证实，美国陆军已经聚集了强大的国内情报力量，并“开发了一套监控美国几乎所有政治抗议的庞大系统”。全国范围内有\
  \ 300 多个区域“记录中心”，其中许多中心包含超过 10 万张关于“受关注人物”的卡片。到 1970 年底，一个国家国防情报中心拥有 2500 万份个人文件和\
  \ 76 万份关于“组织和事件”的文件。这些文件充满了令人作呕的细节——性偏好、婚外情，以及对涉嫌同性恋的特别关注——这些内容与当下的任务（收集有关人员与外国政府的关系及其参与犯罪阴谋的证据）毫无关系。而且，正如委员会所定的，陆军司令部拥有几个可以交叉引用这些信息并绘制人与组织之间关系的数据库。\n\
  \n萨姆·埃尔文议员的委员会还证实了另外一点：军队监视计划是美国更大反叛战略的直接延伸，该策略本是为海外冲突开发的，但被立即带回并用于国内前。一份关于埃尔文议员调查的最终报告指出：“运行国内作战室的人员所保留的记录，与他们在西贡计算机作战室的对应人员所维护的记录并无区别。”\n\
  \n事实上，军队将活动人士和抗议者视作是嵌入当地人口的有组织的敌方战斗员。他们“驻扎”、计划对“目标和目的”发动进攻，甚至还拥有“有组织的狙击手小组”。军队使用了标准的战争游戏颜色：蓝色代表“友军”，红色代表“黑人社区”。然而，正如报告中非常清楚的那样，被监视的人并不是战斗员，而是普通人：“陆军情报不仅是在为城市寻找营地地点、接近路线和黑豹党的军械库。它还在收集、传播和存储了关于守法公民私人和个人事务的大量数据。与武装部队无关的人员的财务状况、性生活和精神病史的评论出现在各种记录系统中。”也就是说，军队在毫无理由的情况下监视了美国社会的一个大范围。\n\
  \n“关于革命团体可能在民权运动和反战运动背后的假设，变成了一个感染了整个行动的预设假设，”埃尔文议员在其工作人员根据其调查产生的一份最终报告中解释道，“示威者和暴乱者未被视为可能有合法诉求的美国公民，而是被视为部署反对既定秩序的‘异见力量’。鉴于这种对异见的观念，陆军情报收集异见者的政治和私人生活信息并不意外。管理反情报、反叛和民政行动的军事准则要求了这一点。”\n\
  \n埃尔文议员的听证会引起了极大关注，并揭露了背后不受检查地组装的联邦监视数据库的泛滥。军队承诺销毁监视文件，但参院无法获得确切证明这些文件已被完全删除。相反，证据表明军队蓄意隐藏并继续使用这些数据。事实上，即使在将军们正在做出承诺时，ARPA\
  \ 的承包商也将这些数据输入了一种全新的检索系统。\n\n# ARPANET 监视\n\n1975 年，NBC 播出了罗恩的报道，声称 `ARPANET` 正被用于监视美国人。自从埃尔文议员调查以来已经过去了三年，这场丑闻早已成为旧闻，被推倒尼克松总统的水水门事件调查所掩盖。但罗恩的报道将美国本土（CONUS）情报事件带回了风灯中心。\n\
  \n“在 20 世纪 60 年代后期抗议活动的高峰时期，约翰逊总统命令 CIA、FBI 和陆军查明抗议背后是谁。随之而来的是对反战团体进行的大规模渗透和监视活动，”罗恩在\
  \ 1975 年 6 月 2 日对 NBC 观众说道。“1970 年，埃尔文议员暴露了陆军监视的程度。他让五角大楼承诺停止监视计划并销毁文件。但在向萨姆·埃尔文做出承诺四年后，陆军的国内监视文件仍然存在。NBC\
  \ 获悉，国防部开发的一种新型计算机技术使五角大楼能够复制、分发并秘密更新陆军的数据。”\n\n两天后，罗恩提供了后续片段：\n\n这个秘密计算机网络的实现，得益于在连接不同品牌和型号的计算机技术方面的巨大突破以便它们能够相互通信并共享信息。这是一项许多人并不知的新技术。如果你交税或使用信用卡、如果你开车或曾服过兵、如果你曾被捕过、甚至被警方机构调查过、如果你有过过额医疗开支或为国家政党捐过款，那么在某个计算机里就有关于你的信息。国会一直担心，如果所有计算机都连接在一起，可能会让政府变成“老大哥”，让计算机监控每一个人变得危险地简单。\n\
  \n随后，他详细说明了那些军队本应销毁的监视文件发生了什么：“根据知情人士透露，大部分计算机化的材料已被复制和传输，且其中很大一部分已与其他机构共享，并在那里处被整合到其他情报文件中……在\
  \ 1972 年 1 月，至少部分计算机化的陆军国内监视文件存储在位于马里兰州福特米德堡的 的 Harvest 计算机中。通过国防部的计算机网络，这些材料在马萨诸塞州的麻省理工学院进行了传输和复制，并存储在陆军的纳蒂克研究中心。”\n\
  \n\n\n\n\n位于加州大学洛杉矶分校（UCLA）和斯坦福大学之间的第一个 ARPANET 节点于 1969 年上线，网络在同年扩展到了全国。年后，随着 Rowan\
  \ 的披露，这一突破性的军事网络在公众关注下迎来了它的首次高光时刻。\n\n当我终于找到 Rowan 时，他听到我提到那段陈旧的 NBC 广播感到非常惊讶。已经几十年没有人跟他讨论过这件事了。“我很久没听过有人谈论这件事了。我很荣幸你能把这些都挖掘出来，”他说。\n\
  \n随后他告诉我是如何揭露这一新闻的。⁴⁹。20 世纪 70 年代初，他负责华盛顿事务报道。他报道了水门事件以及参议员弗兰克·丘奇主持的教会委员会听证会，这些听证会仍然是对美国情报机构（包括\
  \ `CIA`、`NSA` 和 `FBI`）非法活动最彻底、最具有指控意义的政府调查。正是在教会委员会听证会期间，他偶然发现了 ARPANET 的故事并开始将其碎片凑在一起。“这是在水门事件之后、越战之后。。当时他们正在调查肯尼迪暗杀案、马丁·路德·金暗杀案以及后的罗伯特·肯尼迪暗杀案。随后关于\
  \ `FBI` 和国防部对反战抗者进行大规模国内监控的消息传出。这些调查正是我报道的内容，因此我会与生活那个世界的人交谈——`FBI`、`CIA` 和国防部，”Rowan\
  \ 解释道。ARPANET 监视行动与当时美国发生的政治动荡密切相关，他在追踪其他报道时零星地得知其存在。“这并不是那种很容易找到的东西。没有所谓的‘深喉’。没有人通晓一切。你必须真正去挖掘。”\n\
  \n他对 ARPANET 的调查花费了几个月才完成。大多数来源不愿具名，但其中一个选择具名了。⁵⁰。他是一位名叫 Richard Ferguson 的 MIT\
  \ 技员，1972 年五角大楼将监视数据传输到他的实验室时他在场。他决定提供这些信息并亲自出现在 `NBC` 指控。他解释说，这些文件实际上是包含个人信息以及政治信仰的档案。“我见过他们使用的数据结构，它涉及一个人的职业、政治立场和姓名，”他告诉\
  \ `NBC`。他解释说，他因为反对该计划而被解雇了。\n\n多位情报来源和参与过间谍文件传输的人员证实了 Ferguson 的说法，但并非以具名形式。随着时间的推移，其他记者也证实了\
  \ Rowan 的报道。⁵¹。毫无疑问：ARPANET 正被用于监控国内政治活动。“他们强调，该系统并没有执行任何实际的监视，而是设计用于使用从‘现实世界’中收集的数据，帮助建立预测模型，以便在民事动荡即将来临时发出警报，”他后来在\
  \ *Technospies* 一书中写道，这是一部鲜为人知的书，在书中他详述了对 `ARPA` 建立的网络监视技术的调查。⁵²。至少为军队非法监视文件编写数据库“维护程序”的工作部分，似乎是在\
  \ MIT 通过“剑桥计划”完成的。\n\n### MIT 和 ARPA 的角色\n\n为军队非法监视文件编写数据库“维护程序”的工作，似乎是在 MIT 通过“剑桥计划”完成的。ARPANET\
  \ 监视行动与当时美国发生的政治动荡密切相关，他在追踪其他报道时零星地得知其存在。\n\n多位情报来源和参与过间谍文件传输的人员证实了 Ferguson 的说法，但并非以具名形式。随着时间的推移，其他记者也证实了\
  \ Rowan 的报道。毫无疑问：ARPANET 正被用于监控国内政治活动。\n\n### 国会听证会与证词\n\nRowan 的报道以及关于军队拥有监视文件的披露，引发了另一轮国会调查。来自加利福尼亚州的民主党参议员\
  \ Tunney 领导了规模最大的调查。1975 年 6 月 23 日，他召开了司法委员会的特别会议调查 `ARPA`。\n\nTunney 参议员在听证会开始时就谴道：“我们刚刚经历了一个历史时期，看到某些个人为了自己的政治目的利用任何信息（无论是否机密），这对美国和公民都是害，”他说。“我们知道国防部违反了他们的法定权力。我们知道\
  \ `CIA` 通过收集信息违反了其法定权力。”\n\n他发誓要彻底调查这一丑闻，以防止这种滥用再次发生。在三天里，Tunney 参议员质问了高层官员。但像 Ervin\
  \ 参议员一样，他也遇到了阻力。⁵⁴。国防部助理部长 David Cooke 光头、言辞圆滑，他是代表五角大楼的主要官员之一。他曾任于创立 `ARPA` 的国防部长尼尔·麦克罗伊，因此受到尊重和权威。在证词中，Cooke\
  \ 否认陆军国内监视数据库仍然存在，并双重否认 ARPANET 与传输或利用这些不存在的文件有任何关系。“MIT 和 `ARPA` 的官员表示，从未授权过在 ARPANET\
  \ 上传输民事动荡数据，他们没有证据表明这曾发生过，”他作证。他还尽力说服 Tunney 参议员，五角大楼对 ARPANET 没有业务需求，将其描述为一个纯的研究和学术网络。“ARPANET\
  \ 本身是一个完全不公开的系统，是由全美国科学技术界开发并广泛使用的，”他告诉委员会。“白宫或任何情报机构都没有连接到 ARPANET 的计算机。”\n\n正如\
  \ Cooke 所解释的那样，军方不需要 ARPANET，因为他们已经拥有一套用于通信和情报文件的安全数据库和网络：社区在线情报系统，简称为 `COINS`。“这是一个安全系统，连接了三个情报机构——国防情报局、国家安全局和国家摄影解释中心的选定数据库。它的设计是在这些情报机构之间以及国防部内部交换机密和高度敏感的外国情报。中央情报局和国务院可以访问该系统，”他解释道，并强调地说，“`COINS`\
  \ 与 ARPANET 没有关联，未来也不会关联。”\n\n他要么不知情，要么是在歪曲事实。\n\n\n\n\n四年前，即 1971 年，ARPA 主任史蒂芬·卢卡西克（Stephen\
  \ Lukasik）在 ARPANET 建设期间领导该机构，他在参院证书中清晰地解释道，ARPANET 的核心意义是将政府网络——包括机密的（如`COINS`）和非机密的——整合到一个统一的电信系统中。“我们的目标是设计、建造、测试和评估一个高性能、低成本、可靠的计算机网络，以满足国防部对计算机间通信日益增长的需求，”他说。他补充说，军方刚刚开始测试\
  \ ARPANET，作为连接运行计算机系统的一种。\n\n根据卢卡西克的说法，ARPANET 的妙之处在于，尽管它在技术上是一个非机密网络，但它可以用于机密目的，因为数据可以进行数字加密并通过线缆传输，而无需物理上保护实际线路和设备。它是一种通用的计算机网络，可以连接到公共网络并用于机密和非机密任务。\n\
  \n卢卡西克是对的。在 1972 年至 1975 年间，多个军事和情报机构不仅直接连接到 ARPANET，还开始构建基于 ARPANET 设计并能与之互连的自己的运行子网络。海军有多个空基地连接到该网络。陆军利用\
  \ ARPANET 连接超级计算机中心。1972 年，美国安全局（NSA）委托 Bolt, Beranek and Newman 公司——J. C. R. 利克莱德（Licklider）的公司以及\
  \ ARPANET 的主要承包商——构建其`COINS`情报系统的升级版 ARPANET 版本，而库克（Cooke）在三年后曾承诺该系统永远不会接入 ARPANET。结果该系统最终连接到了\
  \ ARPANET，在随后的多年里为 NSA 和五角大楼提供运行数据通信服务。\n\n尽管库克向图尼议员（Senator Tunney）否认 ARPANET 被用于军事通信，该网络包含了陆军、海军、NSA\
  \ 和空军的多个连接——而且很可能包含 CIA 等情报机构维护的未列出节点。但这个问题很快变得无关紧要。在库克作言几周后，ARPANET 正式被国防通信局（DCA）吸收，该机构负责整个五角大楼的通信系统。换句话说，即使\
  \ ARPANET 仍具有某种实验性，但它就是运行中的军事网络的定义。\n\n## 军事互联网\n\n1973 年夏天，罗伯特·凯恩（Robert Kahn）和温特·策夫（Vint\
  \ Cerf）锁在斯坦福大学南方一英里高档 Hyatt Cabana El Camino Real 酒店的会议室里。Cabana 是帕洛奥图最奢华的酒店，曾于\
  \ 1965 年接待过披头士等名人。凯恩身材粗壮，留着浓密的黑发和络腮胡。策夫高个瘦长，留着不修修整的胡须。两人看起来像是一对巡演的民谣组合。但凯恩和策夫去那里不是为了表演、社交或派对。他们没有酒精或药物，带的东西不过几支铅笔和笔记本。在过去的几个月里，他们一直试图创建一种可以连接三种不同类型实验军事网络的协议。在\
  \ Cabana，他们的任务是最终将想法记录在纸上，并敲定“网际”（inter-net）最终的技术设计。\n\n“你想开始，还是我来？”凯恩问。\n\n“不，我很乐意开始，”策夫回答，然后坐在那里盯着一张白纸。大约五分钟后，他放弃了：“我不知道从哪里开始。”\n\
  \n凯恩接手过来并胡涂乱画，记录了三十页图表和理论网络设计。策夫和凯恩都参与了 ARPANET 的构建：策夫曾是 UCLA 团队的一员，负责为构成 ARPANET\
  \ 骨干的路由器编写操作系统；而凯恩曾在 Bolt, Beranek and Newman 工作协助设计网络路由协议。现在，他们正将其推向一个新的高度：ARPANET\
  \ 2.0，一个网络的网络的网络，即我们现在称为“互联网”的架构。\n\n1972 年，在凯恩被聘为 ARPA 指挥与控制部门主管后，他说服策夫离开他刚刚入职的斯坦福大学教师，再次为\
  \ ARPA 工作。凯恩的一个主要目标是扩大 ARPANET 在现实军事情况中的实用性。这意味着，首先要将基于分组的网络设计扩展到无线数据网络、无线电和卫星。无线数据网络对于未来的军事指挥和控制至关重要，因为它们允许跨越巨大的距离传输流量：海军、飞机和移动野战部队都可以通过便携式无线单元连接到大陆的计算机资源。这是\
  \ ARPA 受命开发的全球指挥控制系统的强制性组成部分。\n\n凯恩指导了构建几个无线网络的工作。其中一个被称为`PRNET`，是“分组无线电网络”的缩写。它通过位于圣布鲁诺、伯克利、圣何塞和帕洛奥图附近的移动单元天线传输数据。这项工作在斯坦福研究所进行。同时，凯恩推进分组网络，建立了一个名为`SATNET`的实验网络，连接了马兰州、西弗吉尼亚州、英国和挪威；该系统最初设计用于从远程设施传输地震数据以探测核试验。ARPANET\
  \ 的数据包技术在无线环境中运行得非常好。但有一个问题：尽管它们基于相同的底层数据包交换设计，但`PRNET`、`SATNET`和 ARPANET 使用的运行协议略有不同，因此无法相互连接。从所有实际角度来看，它们都是独立的网络，这违背了整个网络概念并限制了它们对军事的实用性。\n\
  \nARPA 需要这三个网络作为一个整体运行。问题是：如何以简单的方式将它们整合在一起？这就是凯恩和策夫在 Cabana 会议室里试图解决的问题。最终，他们确定了一个灵活的网络语言的基本计划，可以连接多种类型的网络。它被称为`TCP/IP`——传输控制协议/网际协议，即今天驱动互联网的基础网络语言。\n\
  \n在 1990 年的口述史采访中，现任谷歌首席布道师的策夫描述了他和凯恩设计网际协议的努力如何完全植根于军事需求：\n\n这对军事产生了巨大的影响。例如，我们绝对想将数据通信带到前线，这正是分组无线电项目和分组卫星项目的初衷；如何覆盖广阔地区，如何覆盖海洋上的人。无法通过铺设光纤来实现，使用地面存储转发无线电的效果也不佳，因为视距在广阔的海面上并不理想。因此你需要卫星。所以整个努力很大地源于将计算机带入军事前线，并使它们能够在前线与后方资产进行通信。因此，我们所做的所有演示都有对应的军事应用方案。\n\
  \n\n\n即使是第一次互联网级 TCP/IP 成功测试（发生在 1977 年 11 月 22 日），模拟的军事场景：利用无线电、卫星和有线网络与正在抵御苏联入侵欧洲的活跃移动单元进行通信。一辆由\
  \ SRI 装备大量无线电设备的旧 GMC 货车扮演了机化北约师师的角色，在斯坦福附近的高速公路上来回行驶，并通过 ARPA 的无线电网络传输数据。这些数据随后通过\
  \ ARPA 的卫星网络转发到欧洲——经过瑞典和伦敦——然后通过卫星和 ARPA 有线连接传回美国加州的 UCLA。\n\n“所以，我们模拟的是一种情况：有人在野外的移动单元中（比在欧洲），正处于某种行动中，试图通过卫星网络与美国通信，然后跨越美国到达位于境内的某个战略计算资产，”瑟夫（Cerf）回忆道。“有很多这样的模拟或演示，其中一些极具野心。它们曾涉及战略空军司令部，我们在现场部署了空中数据包无线电台进行相互通信，并使用机载系统与地面通信，将被模拟核攻击所分割的互联网碎片缝合在一起。”\n\
  \n瑟夫描述了在每一步中都与军方紧密合作，并在许多情况下帮助寻找特定需求的解决方案。“我们将大量的数据包无线电设备、计算机终端和小型处理器部署到福特·布拉格的第\
  \ 18 空降军，并进行了多年的实地演习。我们还将他们部署到内布拉斯加州奥马哈的战略空军司令部，并与他们进行了一系列演习。在某些情况下，我们使用的应用程序结果非常好，以至于它们成为了了日常运营的一部分。”\n\
  \n当然，温特·瑟夫（Vint Cerf）并不是唯一为 ARPANET 开发实际军事应用的人。20 世纪 70 年代的国会报告和 ARPA 内部文件中充满了武装力量以各种方式使用该**的例子：从无线传输潜艇定位器传感器数据，到提供野外便携式通信、视频会议、计算机设备的远程维护，以及军事供应链和物流管理。而且，这一切都与\
  \ ARPA 在“智能系统”方面的工作交织在一起——即由哥德尔（Godel）和利克莱德（Licklider）十年前发起的的数据分析和预测技术。\n\n这就是 ARPANET\
  \ 技术的伟大之处：它是一个可以承载各种流量的通用网络。它对所有参与者都有用处。\n\n“事实证明我是的，”福德·罗万（Ford Rowan）在 NBC 爆出\
  \ ARPANET 军方监控新闻 41 年后告诉我。“许多人的担忧在很大程度上是联邦政府正在制造一台包含所有功能的大型计算机。出现的新事物之一是，你不需要一台大计算机。你可以将许多计算机连接在一起。那是\
  \ 20 世纪 70 年代他们进行这项研究时发生的飞跃。我们可以找到一种跨网络共享信息的方法，而不需要真正拥有一台无所不知的大计算机。”\n\n# 第二部分\n\
  \n## 虚假的承诺\n\n## 第 4 章\n\n### 乌托邦与私有化\n\n无论准备好没有，计算机正在走向大众。这是一个好消息，也许是自幻药以来最好的。\n\
  \n——斯图特·布兰德（Stewart Brand），《太空大战》，1972\n\n如果你在 1975 年被车撞并昏迷，二十年后又醒来，你会认为美国人疯了，或者集体加入了一个千年教派。可能两者兼有。\n\
  \n在 20 世纪 90 年代，这个国家充满了关于互联网的扫除式宗教宣言。人们谈论一种伟大的平权——一场不可阻挡的野火将席卷世界，吞噬官僚机构、腐败的政府、受宠的商业精英和陈旧的思想形态，为一个更加繁荣的……新的全球社会扫清道路。\n\
  \n乌托邦近在咫尺。路易·罗塞托（Louis Rossetto），新杂志《连线》（Wired）的创始人将计算机工程师比作普罗米修斯：“带来的变化如此巨大，以至于唯一的类比就是发现，”他在创刊中写道。凯文·凯利（Kevin\
  \ Kelly），《连线》留胡子的基督徒编辑，同意他老板的观点：“没有人能逃脱技术的转型火焰。技术曾随文化进步，现在也侵蚀了我们的思想和生活。……敏捷的人获得了机会。”\n\
  \n推动这些愿景的不仅仅是技术少年。无论你是共和党人还是民主党人、自由派还是自由意志主义者，似乎都持有同一个信念：世界正处于革命的边缘。\n\n没有人能比这一早期时期的人物更像乔治·吉尔德（George\
  \ Gilder），他曾是一个老派的里根经济评论员，在 90 年代初重塑为技术预言家和投资大师。在他的著作《数字乌邦》（Telecosm）中，他解释了计算机网络如何与美国资本的力量相结合，并将创造地球天堂。他甚至为这起了一个名字：数字乌邦。“工业社会的所有垄断、层级制度、金字塔和电网将在向网络边缘分配智能持续压力下溶解，”他写道，预测互联网的力量将破坏社会的物理结构。“数字乌邦可以摧毁城市，因为你可以在自己的客厅里获得在城市才能找到的所有多样性、惊喜感和勃勃活力。”副总统阿尔·戈尔（Al\
  \ Gore）。\n\n确实，事情正在发生。人们正在购买个人电脑，并通过发出刺耳声的解调器连接到一个奇异的新领域：万维网。一个由聊天室、论坛、公司和政府网络以及无限网页集组成的迷宫。1994\
  \ 年，一家名为网景（Netscape）的初创公司推出了一款令人兴奋的新产品——网页浏览器。一年后，该公司上市，在交易日结束时市值飙升至 22 亿美元。这是旧金山湾新一轮淘金的开始。当无名科技公司在股市上市时，人们欢呼，其股价在第一天翻了一倍，甚至三倍。从\
  \ 1995 年到 2000 年，纳斯达克指数（NASDAQ）从 1000 点飙升至 5000 点，在五倍增长后崩盘。\n\n\n\n\n当时我还是个孩子，但我对那些日子记忆犹新。我的家庭刚从苏联移民到美国。1989\
  \ 年，我们离开了列宁格勒，在奥地利和意大利的一系列难民营中辗转了六个月，才终于抵达纽约，随后并迅速搬到了旧金山。在那里，我的父亲波里斯（Boris）凭借他惊人的语言天赋获得了一份日语翻译工作。我的母亲内莉（Nellie）重新调整了方向，利用她的苏联教育学博士学位背景，开始在伽利略高中教物理课，而我哥哥埃利（Eli）和我则尽可能地适应并融入那里。当我们终于站稳脚跟时，湾区正处于互联网泡沫狂热的巅峰。我认识的每个人都在投身科技行业，而且似乎都赚得盆满钵满。城市里到处都是开敞篷车、买房子、举办豪华科技派对的满脸痘的少年。我的朋友里奥（Leo）将他的业余黑客技能转化成了五位数的高薪——这对于一个青少年来说是实打实的巨款。我认识的另一个移民孩子通过投机域名赚了一笔小财。我的哥哥在一家神秘的初创公司获得了一份薪水极高的工作，那家公司在几年内转型了六次，最后在没有产出任何可行产品的情况下倒闭了。“我们有一些来自中部的投资者，他们根本不知道互联网是什么，他们只是听说你需要投资它，”他回忆道。电脑游戏、互联网、网页、永无止的色情内容、远程办公、远程学习、流媒体电影和点播音乐：未来已来。我进入了社区学院并转学到加州大学伯克利分校，打算追求计算机科学学位。\n\
  \n二十年前，美国人还恐惧电脑。人们，尤其是年轻人，将其视为一种监控和社会控制的技术官统治工具。但一切在 20 世纪 90 年代改变了。曾经反对电脑和早期互联网的嬉皮士现在说，这种压迫工具将把我们从压迫中解放出来！电脑是伟大的平等者！它们将让世界变得更加自由、公正、民主和平公平。\n\
  \n不相信这些炒作是不可能的。现在回首过去，在充分了解互联网历史的情况下，我不禁对这种转变感到惊。这种感觉就像是醒来发现嬉皮士正在为征兵兵游行一样奇异。\n\n\
  那么，发生了什么？一种与战争和反叛乱深度相关的的技术，如何突然变成了一张通往全球乌托邦的单程票？这是一个重要的问题。没有它，我们就无法开始理解塑造我们今天对互联网看法的文化力量。\n\
  \n在某种程度上，这一切始于一个心灰意灭的企业家斯图特·布兰（Stewart Brand）。\n\n\n1972 年 10 月。傍晚，斯图特·布兰，一位年轻、瘦高的自由职业记者兼摄影师，正闲荡在斯坦福人工智能实验室，那是位于校园上方圣塔克鲁斯山脉的一家\
  \ ARPA 承包商。他玩得很开心。\n\n他正在为《滚石杂志》（Rolling Stone）执行任务，这是一本美国反主流文化的潮流风内杂志，他正和一群拿 ARPA\
  \ 工资的电脑程序员和数学极客一起派对。布兰去那里不是为了检查计算机档案，也不是为了向工程师催问监控数据子程序。他去那里是为了娱乐和消遣：玩玩《太空大战》（SpaceWar），一种被称为“电脑视频游戏”的东西。\n\
  \n我们二十个人挤在一个离主厅不远的半昏暗控制室里，那里有 AI 实验室巨大的 `PDP-10` 计算机。AI 的首席系统程序员兼最狂热的《太空大战》粉丝拉尔夫·戈林（Ralph\
  \ Gorin）面对显示屏。玩家们抓起五组控制按钮，在屏幕上找到自己的飞船形象，并同时：转身向任何附近尚无还手之力的飞船开火，按下推进按钮进入轨道以防被杀手般的太阳吞噬，并避开或击落任何飞来的敌方导弹或轨道地雷。发射两枚鱼弹后，每艘飞船都有三秒钟的无武器装载时间。\n\
  \n与他人实时玩视频游戏？在当时，这简直是疯狂的事，大多数人只在科幻电影中见过。布兰被被迷住了。他以前从未听过或经历过那样的。这是一次扩张心灵的体验。令人兴奋，就像服用了一大剂致幻药一样。\n\
  \n他看着挤在那个狭小、暗淡办公室里的同伴们，产生了一个愿景。他周围的人——他们的身体被困在地球上，但他们的心灵被传送到另一个维度，“有效地离开了身体，投影到阴极射线管显示屏上，在生死攸死的太空战斗中持续数小时，毁了他们的眼睛，在疯狂按压控制按钮时让手指麻木，并欢快地杀掉他们的朋友，浪费他们雇主宝贵的电脑时间。”\n\
  \n斯坦福人工智能实验室的其他部分也完全是出自科幻小说。当布兰和他的新朋友们痴迷地玩那个视频游戏时，单眼机器人在背景中在轮子上自主行走。电脑生成的音乐充斥着空气，怪异的光投射在墙上。这是一个军方资助的斯坦福电脑实验室，还是一场迷幻的杰斐斯飞机演唱会？对布兰来说，两者都是，而且远不止于此。对他周围正在发生的“在十个不同方向进行的十五环马戏表演”感到惊叹。“这是自‘恶作剧剧者酸剂测试’以来，我见过的最忙碌的场景。”\n\
  \n当时，斯坦福周围的氛围充满了反 ARPA 的情绪。该大学刚刚经历了一波反对校园军事研究和招兵的暴力反战抗议浪潮。“民主社会学生协会”的活动人士专门针对斯坦福研究院——一个深度参与从\
  \ ARPANET 到化学武器和反叛乱一切活动的 ARPAPA 商——迫使大学切断了正式关系。\n\n对校园的许多人来说，ARPA 是敌人。布兰不同意。\n\n\
  在他为《滚石杂志》写的一篇长文中，他试图说服该杂志年轻且引领潮流的读者，ARPA 并不是某种与美国战争机器相连的大官僚主义闷罐，而是一个“令人惊叹的开明研究计划”的一部分，只是恰好由五角大楼运营。他在斯坦福\
  \ AI 实验室聚在一起的人并不是为军事承包商工作的没有灵魂的电脑工程师。他们是嬉皮士和反叛者，留着长发和胡须的反主流文化人士。他们用迷幻艺术海报和反对越南战争的传单装饰自己的隔间。他们读托尔尔金，吸食大麻。他们是“黑客”和“电脑\
  \ b……充满了自由和怪异……这些人，大多数都是内行，”布兰写道。\n\n他们很酷，他们充满激情，他们有想法，他们正在做事情，并且想要改变世界。他们可能被困在拿五角大楼工资的电脑实验室里，但他们那里不是为了服务军队。他们那里是为了给世界带来和平，不是通过抗议或政治行动，而是通过技术。他欣喜若狂。“无论准备好没有，电脑正在来到人们身边。这是一个好消息，也许是自致幻剂以来最好的，”他告诉《滚石杂志》的读者们。\n\
  \n\n\n而视频游戏尽管酷得没法，但也仅仅触及了这些酷炫科学家们正在酿造成果的一角。在 `ARPA` 的帮助下，他们正在彻底改变计算机，将其从技术人员操作的巨型主机，转变为任何人都能负担得起并在家里使用的工具。接着是某种被称为\
  \ `ARPANET` 的东西，这是一种新颖的计算机网络，承诺连接世界各地的人和机构，让跨越远距离实时通信与协作变得轻而易举，即时传递新闻，甚至点需播放音乐。点需播放感恩死乐队？想象一下吧。“唱片店到此为止了，”斯图尔·布兰德预测道。\n\
  \n按照他的描述方式，你会认为为 `ARPA` 工作是一个人能做的最具颠覆性的事情。\n\n# 邪教与控制论\n\n布兰德访问斯坦福人工智能实验室时只有三十四岁，已经是一个反主流文化的名人。他曾是《全地球目录》（*Whole\
  \ Earth Catalog*）的出版者，这是一本针对公社运动的极受欢迎的生活杂志。他曾与肯·凯西（Ken Kesey）以及那些发放 LSD 的“快乐恶作剧者”（Merry\
  \ Pranksters）混在一起，并在建立和推广那场迷幻演唱会上发挥了核心作用，感恩死乐队在那场演唱会上首秀，开启了旧金山之夏的序幕。布兰德深陷于加州的反主流文化中，并作为汤姆·沃尔夫著作《电汽水酸测试》（*The\
  \ Electric Kool-Aid Acid Test.*）中的主要人物出现过。然而，他竟然在那里充当 `ARPA` 的推销员，这是一个在短短存在时间内就已经积累了血腥名声的军事机构——从化学战到反叛乱和监视。这似乎完全没有逻辑。\n\
  \n斯图尔·布兰德出生于伊利诺伊州的罗克福。他的母亲是一位家庭主妇；父亲是一位成功的广告商人。从一所精英寄宿制学校毕业后，布兰德就读了斯坦福大学。他那时的日记显示，他是一个深陷个人主义并恐惧苏联的年轻人。他的噩梦场景是美国将遭到红军入侵，共产主义将夺走他思考和随心所欲行动的自由。“我的思想不再属于我自己，而是由帕尔洛夫的后代精心塑造的工具，”他在一次日记记录中写道，“如果发生战斗，我会战斗。而且带着目标去战斗。我不会为美国、不为家、不为艾森豪威尔总统、不为资本主义，甚至不为民主战斗。我将为了个人主义和个人自由战斗。如果我必须成为一个傻瓜，我想成为我那种独特的傻瓜——与他人完全不同。我将为了避免变成一个数字——对他人也对自己而战斗。”\n\
  \n大学毕业后，布兰德加入了美国陆军，接受了伞兵和摄影师训练。1962 年服役结束后，他搬到了湾区，向日益增长的反主流文化发展。他与凯西和“快乐恶作剧者”接头，服用大量迷幻药物，参加派对，创作艺术，并参加了一项测试\
  \ LSD 影响的实验计划，他并不知道，这项计划是由中央情报局作为 `MK-ULTRA` 项目的一部分秘密进行的。\n\n当新左翼抗议战争时，新公社主义者走了另一条道路。《飞越疯笼》（*One\
  \ Flew Over the Cuckoo’s Nest*）的作者肯·凯西对政治持怀疑态度。乔布作为该杂志的年轻粉丝，后来描述道：“它有点就像是 Google\
  \ 出现 35 年前的纸质版 Google。它是理想主义的，充满了整洁的工具和伟大的理念。”\n\n邮购形式的 L.L. Bean 目录启发了布兰德创建《全地球目录》。但这并不仅仅关乎商业。像其他新公社主义者一样，布兰德痴迷于控制论思想——地球上所有生命都是一个巨大的、和谐的信息机器的想法吸引了他的感性。他将同类的新公社主义者视为一个新社会的开始，融入更大的全球生态系统。他希望《全地球目录》成为将所有这些孤立公社连接在一起的结缔组织，一种基于杂志的信息网络，每个人阅读并贡献，并将他们结合成一个集体有机体。\n\
  \n\n\n\n\n“我们试图创建一个基于理解生态系统的社会，一个基于相互关系和平衡的社会——一个人机、生物协同工作的系统，”新墨西哥 `Synergia` 公社的成员兰德·吉布森（Randall\
  \ Gibson）回忆道，该公社运行在他他称为`生态技术`（eco-technics）的控制理念之上。社区对集体行动或组织有严格的规定。成员必须通过“连接会议”解决问题和冲突，两个人在公社的注视下进行一对讨论，但不能寻求任何人的支持或帮助。“`生态技术`的想法简单来说就是你是系统的一部分，在这个系统中等级更少，甚至完全没有，”吉布森说。最终，这些连接会议演变成了更阴暗的东西：羞辱、欺凌和控制的练习，占主地位的成员利用较弱和顺从的成员。“在实践中，这些是持续\
  \ 20 到 30 分钟的霸凌环节，通常得到的是同伴们的沉默。”\n\n其他公社也经历了类似的转变，从乐观的青年实验蜕变为压抑的环境，而且往往变成了纯粹的人格崇拜。“实际上存在恐惧，因为那些处于主导地位的人——充满了愤怒。房子里一直有一种恐惧的背景——就像运行在后台的病毒。就像间谍软件。你知道它在那儿，但你不知道如何除掉它，”莫莉·霍伦贝克（Molly\
  \ Hollenback）说，她是新墨西哥州陶斯一个名为`家庭`（The Family）公社的成员。`家庭`由 1967 年来自`UC Berkeley`（伯克利分校）的学生组成，迅速转变为一个僵化的等级制度，男性被赋予“先生”和“主”等头衔，女性则被迫穿裙子并被分配保守的性别化工作：烹饪、育儿和洗涤。一位自称为`拜伦勋主`（Lord\
  \ Byron）的创始成员主持该小组，并保留了与公社内任何女性发生性的权利。\n\n大多数公社只持续了几年，有些甚至更短。“把它们全部撕碎正是它们本该驱逐的东西：权力，”亚当·柯蒂解释道，“强势个性主导了小组中较弱的成员，但自组织系统的规则拒绝允许任何对这种压迫的组织化反对。”最终，这些本应是自由和新乌托邦社会的实验，仅仅是复制并放大了人们带入的外部世界的结构性不平等。\n\
  \n但斯图特·布兰（Stewart Brand）并没有承认失败，也没有试图理解为什么支撑该实验的控制自由主义思想会失败得如此惨烈。他只是将那个神话般的公社的乌托邦思想转化为了长期以来着迷的事物：快速发展的计算机行业。\n\
  \n# 重新定义斯图特·布兰\n\n从表面上看，`ARPA`（高级研究计划）和军事计算机研究的世界与 20 世纪 60 年代吸毒嬉士公社场景完全不同。事实上，它们似乎占据着不同的太阳系。一方有制服、沉闷的西装、笔袋保护、战争思想、孔片和僵化的等级制度；另一方有长发、自由恋爱、药物、前卫音乐、对权威的敌意以及一种杂乱破败的存在。\n\
  \n但这些差异是表面的。在更深层次上，这两个场景运行在相同的控制波长上，并在多个方面相互重叠。`J. C. R L Licklider`、`Ithiel de\
  \ Sola Pool` 以及其他 `ARPA` 和军事工程师正在部署控制思想来建立计算机网络，同时梦想着建立预测技术来运行世界，并将政治斗争消于无形。嬉士们在他们的控制公社中做同样的事情。不同在于，`ARPA`\
  \ 和军队是工业化且全球化的，而公社是小规模、精品的。\n\n它们也存在直接的联系。以`斯坦福研究所 (SRI)` 为例，这是一个主要的 `ARPA` 承包商，从事从反叛乱、化学战到运行重要的\
  \ `ARPANET`（阿帕恩网）节点和研究中心的所有事务。几位 `SRI` 员工是斯图特·布兰的好友，也是《地球目录》（Whole Earth Catalog）的活跃贡献者。布兰经常在\
  \ `SRI` 逗留，甚至为该研究所在 1968 年演示根据 `ARPA` 合同开发的交互计算机技术道格拉斯·恩格尔巴特增强中心（Douglas Englebart’s\
  \ Augmentation Research Center）提供咨询。该活动展示了通过 `ARPANET` 进行的实时视频会议和协作文档编辑，而那时该网络才诞生两个月。还有`恩格尔巴特`本人。这位工程师和交互计算大师是\
  \ `Licklider` 的宠儿，获得了数百万美元的 `ARPA` 资金。同时，他实验 `LSD`，并给其他计算机工程师服用药物，看看是否能让他们变得更高效、更有创意。他还巡回了各种公社，对该运动试图创建新形式去中心化社会的尝试表示高度支持。\n\
  \n这种感觉是相互感应的。湾区的嬉士反文化场景呼吸着由美国军工复合体产出的控制思想。理查德·布劳蒂根（Richard Brautigan）是一位住在旧金山的、留着乱发和下垂胡须的作家，他为即将到来的控制乌托邦创作了一首颂歌，展示了这些看似矛盾的世界之间精神上的亲近。这首诗于\
  \ 1967 年发表，名为《爱之机器的监控》，描述了一个计算机与自然融合的世界，创造出一种利他的、神一般的生物，会照顾我们所有人——一个“哺乳动物和计算机 /\
  \ 相互和谐地 生活在一起 / 就像纯净的水 / 触摸清空”的世界。布劳蒂根在反文化运动的中心高地街（Height Street）发放了他的这首诗。自然地，布兰是布劳蒂根的粉丝，并在《地球目录》中发表了他的作品。“理查德不会写代码。我不确定他是否亲自接触过计算机，”布兰后来回忆道。你不需要成为程序员也能相信这一点。\n\
  \n\n\n\n\n在这个新角色中，布兰（Brand）仍然是一个乌托邦式的理想主义者，但他也是一个企业家。“我是一个小企业主，面临着任何小创业者都会遇到的同样问题，”他告诉《周刊》杂志。在接下来的几年里，随着个人电脑的普及，他在身边汇聚了一群由记者、营销人员、行业内部人士以及其他由嬉皮士转变为企业家的人组成的团队。他们共同复制了布兰在《地球百科全书》（*Whole\
  \ Earth Catalog*）时期使用的营销策略和美学，并像他曾经推销公社和迷幻剂一样推销电脑：将其作为解放性技术和个人赋能的工具。这群人在整个 20 世纪\
  \ 80 年代和 90 年代不断传播这种神话，通过用 20 世纪 60 年代迷幻反文化的语言对其包装，帮助掩盖了计算机和网络技术的军事起源。在这个被重新定义的世界里，电脑是新的公社：一个创造更美好世界仍然是可能的数字边疆。\n\
  \n用当今硅谷的术语来说，布兰进行了“转型”（pivoted）。他将《地球百科全书》转变为《地球软件百科全书》（*Whole Earth Software Catalog*）和《地球评论》（*Whole\
  \ Earth Review*——这些杂志被誉为“计算机时代的工具和思想”。他还创立了良好商业网络（Good Business Network），这是一家企业咨询公司，将他的反文化公关策略应用于壳牌石油、摩根士丹利、贝德工程和美国高级研究计划署（DARPA）等客户面临的问题。他还组织了一场具有影响力的计算机会议，汇聚了顶尖计算机工程师和记者。这场会议简单地被称为“黑客会议”（Hackers’\
  \ Conference），于 1984 年在马林县举行。约 150 位美国顶尖计算机天才参加了会议，其中包括苹果公司的史夫·沃兹尼亚克（Steve Wozniak）。布兰巧妙地策划了这次活动，为这个群体提供了最大的文化声望。听他和和其他信徒的说法，这次活动是“计算机精英的伍德斯克！”报纸报道向读者讲述了那些对未来有奇幻愿景的古怪极客的故事。“赋予计算机自我意识。最伟大的黑客是人工意识，”一位参与者告诉《华盛顿邮报》的记者。“我对黑客的看法是一个在每台机器内部生长的模糊的小智能生物，”另一人打趣道。\n\
  \n一支 PBS 电影剧组在现场拍摄纪录片，捕捉了布兰在把这些黑客聚集在一起方面的角色。他不再是二十年前创立《地球百科全书》的那个年轻人了。他的脸显露了年龄的痕迹，留着光光亮的秃顶，但他内心依然燃烧着火花。他在羊皮背心里面穿着一件黑白格纹衫，对聚集在马林县的那些人的反叛特质赞不绝口。“他们害羞、善良、不可思议地聪明，我认为他们在以良好的方式推动文化方面，比我能想到的几乎任何团体都更有效。”在镜头之外，他通过他的《地球评论》版面进一步阐述了计算机程序员的反叛特质。“我认为黑客——那些具有创新精神、不蔑权威的计算机程序员——是自美国宪法起草者以来最有趣、最有效的知识分子群体，”他在\
  \ 1984 年黑客会议照片组辑的介绍序言中写道。“我所知道的没有哪个团体成功实现过解放一项技术……高科技现在是大众消费者正在做的事情，而不仅仅是被施加于他们身上的东西，这是世界上的一个热门话题。”他补充道，“60\
  \ 年代最安静的亚亚文化已浮现为最具创新性、最强大的群体——也是对权力最感怀疑的群体。”\n\n黑客会议是硅谷文化史上的一个大时刻。它帮助以一种完全不同的方式向公众介绍了计算机程序员。他们不再是为大公司和军事承包商工作的工程师，而是“黑客”——反抗体制的天才和反叛者。尽管布兰是推动这种感知认知转变的重要人物，但他并非孤立地运作，而是代表了一场更大的文化巨变。\n\
  \n除了布兰的黑客会议之外，1984 年对计算机行业来说也是意义重大且具有象征意义的一年。那一年，威廉·吉布森（William Gibson）出版了《神经漫游者》（*Neuromancer*），这是一部科幻小说，讲述了一个受药物影响的黑客在一个由恐惧的公司和神一般的超级计算机运行的危险虚拟现实中杀出一条路的故事。《神经漫游者》创造了“赛博空间”（cyberspace）一词。它还引发了赛博朋克运动，以一种截然不同的方式回应吉布森的政治批判：它欢迎这种反乌托邦世界的到来。计算机和黑客是反抗权力的反叛者。他们很酷。\n\
  \n在罗纳德·里根总统贫困和不平等激增的时期，这是一个没有规则、没有法律、只有权的科学实验。同年，苹果公司发布了麦金塔的“1984”广告。该广告由雷德利·斯科特（Ridley\
  \ Scott）执导（他刚刚凭借反乌托邦式的热门电影《银翼杀手》震撼了观众），并在超级碗期间播放，苹果传递的信息再明确不过了：忘记你对 IBM、公司大型机或军事系统的知识。在苹果的领导下，个人电脑与过去截然不同：它们不再关乎统治和控制，而是关乎反叛和赋能。《纽约时报》报道，“有趣的是，‘1984’广告源于公司废弃的另一项活动，而那次活动明确提到了滥用计算机的能力。该活动的一份草稿写道：确实，大企业和政府内部潜伏着怪物计算机，它们了解你住过哪些酒店，了解你银行里有多少钱。但在苹果，我们正试图通过赋予个人曾经属于公司的计算机权力来平衡天平。”\n\
  \n# 将互联网私有化的男人\n\n1986 年某时候，史芬·沃尔夫（Stephen Wolff）走进了位于华盛顿特区威尔逊大道的国家科学基金会办公办公室，那里位于波波托马克河对岸的白宫，距离五角大楼仅一角之遥。\n\
  \n\n\n\n和大多数早期参与互联网的人一样，沃尔夫（Wolff）曾是一名军人。他高高瘦瘦，声音冷静而令人安心。20 世纪 70 年代，他在位于阿伯伯登演兵场（Aberdeen\
  \ Proving Ground）的美国陆军弹道研究实验室致力于 `ARPANET` 的工作。那里是巴尔摩北部约 35 英里切萨皮克湾的一片茂盛沼泽和森林。阿伯伯登现已关闭，但曾拥有悠久而传奇的历史。它建立于世界大战期间，任务是开发和测试野战火炮和重武器：大炮、防空炮、弹药、壕沟迫击炮炸弹。诺伯特·维纳（Norbert\
  \ Wiener）在那里担任计算机时代的人类计算员，为正在开发的巨型武器计算弹道轨迹。第二次世界大战期间，这里是美国第一台全数字电子计算机 `ENIAC` 的诞生地。20\
  \ 世纪 60 年代，阿伯伯登连接到了某种诡异的东西：一系列“有限战争实验室”实验。在这些实验中，美国陆军化学兵种部署了令人疯狂的药物——包括 `LSD` 和被称为\
  \ `BZ` 的噩梦级超级致幻剂（后者能让人陷入持续数日的幻觉昏迷），作为化学武器。\n\n斯蒂芬·沃尔夫在 70 年代于阿伯伯登的工作涉及研究 `ARPANET`，并将其与美国陆军的超级计算机网络连接。1986\
  \ 年，国家科学基金会（NSF）网络办公室聘请他做同样的事情，但有一个巨大的转折：他要建立一个政府资助的网络，将 `ARPANET` 的设计扩展到民用领域，然后将该网络剥离给私营部门。最终，沃尔夫监督了互联网的创建和私有化。\n\
  \n当我与沃尔夫交谈时，我问：“称你为互联网私有化的人合适吗？”\n\n“是的，这是一个公平的评价，”他回答道。\n\n在斯蒂芬·沃尔夫到达国家科学基金会之前，显易看出\
  \ `ARPANET` 的日子已不多了。1975 年，五角大楼正式取消了 `ARPA` 运行该网络的职责，并将其交给国防通信局直接控制。陆军、海军、空军和国家安全局都开始根据\
  \ `ARPANET` 技术建立自己的网络。他们维持着与原始 `ARPANET` 基础设施的连接，但物理网络受限于 `56K` 调制解调器速度，已开始显示出陈旧的迹象。实验是成功的，但随着\
  \ 20 世纪 80 年代的到来，原始的 `ARPANET` 似乎要被扔进垃圾桶了。\n\n网络已经过时，但运行在其上的技术和框架才刚刚开始。许多原始的 `ARPANET`\
  \ 架构师和设计师将他们在 `ARPA` 的经验作为筹码，在快速发展的计算机网络行业中换取了丰厚的私营部门工作；另一些人留在了五角大楼，推动并宣扬 `ARPANET`\
  \ 网络设计更广泛的应用。许多人渴望看到原始的 `ARPANET` 跨越军事圈，成为一个所有人都能使用的商业网络。国家科学基金会（`NSF`）是国会于 1950\
  \ 年创建的联邦机构，其使命是“促进科学进步”和“维护国家安全”，它是最终完成这项任务的平台。\n\n20 世纪 80 年代初，`NSF` 运行一个小型网络，将几个大学计算机系连接到\
  \ `ARPANET`。到 1985 年，管理员希望将该项目扩展为一个更大、更快的网络，以连接更广泛的大学群体，将 `ARPANET` 从纯粹的军事和计算机科学领域扩展出来，并向所有学术和教育用户开放。基于他在阿伯伯登将美国陆军超级计算机连接到\
  \ `ARPANET` 的十年经验，沃尔夫被请来构建和管理这个新的教育网络项目——称为 `NSFNET`。\n\n`NSFNET` 的第一个版本于 1986 年上线。第一版本的\
  \ `NSFNET` 是一个有限的尝试，将几所大学的计算机中心连接到 `ARPANET`。通过 `NSF` 资助，将它们连接在一起以便共享数据。管理员希望将该项目扩展为一个更大、更快的网络，以连接更大范围的大学。这种网络连接到旧的军事\
  \ `ARPANET`。网络范围有限，但用户需求如此之高，导致系统崩溃。显然，`NSFNET` 需要重大升级和更多的带宽。\n\n网络已经过时，但运行在其上的技术和框架才刚刚开始。许多原始的\
  \ `ARPANET` 架构师和设计师将他们在 `ARPA` 的经验作为筹码，在快速发展的计算机网络行业中换取了丰厚的私营部门工作；另一些人留在了五角大楼，推动并宣扬\
  \ `ARPANET` 网络设计更广泛的应用。许多人渴望看到原始的 `ARPANET` 跨越军事圈，成为一个所有人都能使用的商业网络。国家科学基金会（`NSF`）是国会于\
  \ 1950 年创建的联邦机构，其使命是“促进科学进步”和“维护国家安全”，它是最终完成这项任务的平台。\n\n20 世纪 80 年代初，`NSF` 运行一个小型网络，将几个大学计算机系连接到\
  \ `ARPANET`。到 1985 年，管理员希望将该项目扩展为一个更大、更快的网络，以连接更广泛的大学群体，将 `ARPANET` 从纯粹的军事和计算机科学领域扩展出来，并向所有学术和教育用户开放。基于他在阿伯伯登将美国陆军超级计算机连接到\
  \ `ARPANET` 的十年经验，沃尔夫被请来构建和管理这个新的教育网络项目——称为 `NSFNET`。\n\n`NSFNET` 的第一个版本于 1986 年上线。第一版本的\
  \ `NSFNET` 是一个有限的尝试，将几所大学的计算机中心连接到 `ARPANET`。通过 `NSF` 资助，将它们连接在一起以便共享数据。管理员希望将该项目扩展为一个更大、更快的网络，以连接更大范围的大学。这种网络连接到旧的军事\
  \ `ARPANET`。网络范围有限，但用户需求如此之高，导致系统崩溃。显然，`NSFNET` 需要重大升级和更多的带宽。问题是：这个新网络将变成什么样？\n\n\
  答案很快出现。\n\n“从 1985 年 `NSFNET` 项目启动开始，我们就希望它能涵盖国家的每一所学院大学，”沃尔夫在采访中回忆道，“但试图在华盛顿管理一个三千节点的网络——这种想法太自大了。”\n\
  \n自大，然如此。这是里根时代的巅峰，一个私有化和放松管制的时代，关键基础设施的公共所有被认为是现代世界中不存在的野蛮遗迹；如果需要，它需要像脓肿一样被切开。一切都在放松管制和私有化——从银行业到电信行业。沃尔夫和\
  \ `NSF` 的团队像他们听话的公职员一样按规办事。\n\n 1987 年初，他和团队最终制定出了一个改进和升级的 `NSFNET` 设计。这个新网络是用公共资金创建的政府项目，将连接大学，并设计为最终作为私有化的电信系统运行。这是\
  \ `NSF` 内部所有人同意的隐含共识。他们将 `NSFNET` 的公共属性视为一种过渡状态：一个小的政府幼体，将转变为商业化的蟾蜍。根据规格，新的 `NSFNET`\
  \ 将构建一个双层网络。顶层是一个国家网络，一条跨越整个国家的高速“骨干”。第二层由较小的“区域网络”组成，将大学连接到骨干。`NSF` 不再自己构建和管理网络，而是将网络外包给少数私营公司。计划是资助和培养这些网络供应商，直到他们能够自给自足，届时他们将获得自由，并允许他们私有化为\
  \ `NSFNET` 构建的网络设施。\n\n1987 年晚些时候，`NSF` 为其升级的 `NSFNET` 设计授予了合同。系统最重要的部分——骨干，由一家新的非营利公司运行，这是一个包括\
  \ `IBM`、`MCI` 和密歇根州在内的财团。第二层区域网络被包给了十二个新成立的私营财团。这些网络的名字如 `BARRNET`、`MIDNET`、`NYSERNET`、`WESTNET`\
  \ 和 `CERFNET`，由大学、研究机构和军事承包商共同运营。\n\n\n\n\n1988 年 7 月，NSFNET 骨干网上线，连接了全范围内 13 个区域网络和超过\
  \ 170 个不同的校园。⁴⁷。物理网络运行在 MCI 的 T-1 线路上，传输速度可达每秒 1.54 兆比特，并通过 IBM 构建的数据交换机进行路由。该网络从圣地亚哥延伸到普林斯顿——穿过位于盐湖城、休斯顿、波尔德、林肯、坎槟、安娜阿西伯、亚特兰大、匹兹堡和伊萨卡加的区域性网络交换点，并向往位于日内瓦的欧洲核研究组织引出了一条国际跨大西洋专线。⁴⁸。该网络在学术界取得了巨大成功。⁴⁹。\n\
  \n尽管需求激增，国家科学基金的管理层还是启动了私有化进程。“我们告诉他们：‘你们最终得出去寻找其他客户。我们没有足够的资金永远支持这些区域网络。’于是他们确实做到了，”沃尔夫（Wolff）解释道，“我们试图……确保这些区域网络账目清晰，并确保纳税人没有直接补贴商业活动。但迫于无奈，我们迫使这些区域网络变成了通用网络提供商。”⁵⁰。\n\
  \n告诉 NSFNET 提供商通过寻求商业客户来使其客户群多样化——这似乎是一个微小的决定。然而，这是一个产生巨大影响的关键细节，它让该机构在几年后能够悄且快速地将互联网私有化，同时让这种转型看起来就像是不可避免的甚至是自然而。内部人士理解沃尔夫和国家科学基金会（NSF）行为的严重性。他们将其视为一种奇招，一种障法。\n\
  \n文顿·瑟夫（Vinton Cerf）在 1982 年离开了 ARPA 的工作，执掌 MCI 的网络部门，他将沃尔夫的私有合营网络提供者方案描述为“天才的”。他说：“这些区域网络的创建，以及要求它们实现自给自足的要求，是当今互联网演变的关键。”⁵¹。\n\
  \n瑟夫是对的。互联网也许是 20 世纪最有价值的公共发明之一，联邦官僚机构中少数几个未经选举的官员所做的决定将互联网推向了私有化的必然之路。没有真正的公共辩论，没有讨论，没有异议，也没有监督。在在这个官僚泡沫之外的人意识到利害关系之前，它就被白白送出了。\n\
  \n互联网的私有化——它从军事网络转变为我们今天使用的私有化电信系统——是一个复杂的故事。只要深入足够深，你就会发现自己陷入了一个由三字母联邦机构、网络协议缩写、政府倡议以及充斥技术术语和细节的国会听证会组成的沼泽。但从根本上说，这一切非常简单：在五角大楼系统经历了二十年的巨额资助和研发后，互联网变成了一个消费者利润中心。企业想要分一杯羹，而一小部分政府经理乐于配合。为了做到这一点，联邦利用利用资金凭空创造了十几个网络提供商，然后将他们剥离到私营部门，建立的公司在十年内变成了我们所有人熟知并使用的媒体和电信巨头的不可或缺的一部分——Verizon、Time-Warner、AT&T、Comcast。\n\
  \n### 这是如何发生的？\n\n揭开这个故事需要观察第一个私有化的 NSFNET 提供者：一个由 IBM 和 MCI 领导的财团。⁵²。\n\n国家科学基金会根据教育使命运作，只能支持具有教育维度的倡议。法律上，NSFNET\
  \ 承包商不允许通过政府资助的网络路由其商业流量。这些条款被写在这一联邦机构的“可接受使用政策”合同中，而且非常明确。商业流量如何能通过政府资助的网络路由呢？后来，NSFNET\
  \ 提供者声称他们没有违反这些条款，因为他们是在私有网络上路由。但 NSF 与骨干网运营者的私下交易显示，事实要复杂得多。\n\n1990 年，这个 IBM-MCI\
  \ 财团在 NSF 的批准下拆分为两个实体：一个名为 Advanced Services（ANS）的非营利实体，另一个名为 RE Systems 的营利实体。Advanced\
  \ Services（ANS）继续与 NSF 签约以维护骨干网。与此同时，其营利部门 RE Systems 向商业客户销售网络服务，它称之为 ANSNET。⁵³。\n\
  \n当然，这个新的 ANSNET 运行在支撑 NSFNET 的相同的物理网络上。但在法律上，国家科学基金会将这两者视为完全独立的实体。尽管由于可接受使用政策禁止在\
  \ NSFNET 上进行商业流量，IBM-MCI 财团却获得了以此获利的许可绿灯。⁵⁴。这是一个高明的手段。在基础层面上，它允许 IBM-MCI 财团利用同一笔资产，利用政府资金运行\
  \ NSFNET，然后将这一网络卖给商业客户。从根本上说，它允许一个对网络业务有直接利益的实体在没有明确这样做的情况下私有化政府资产。这正是 MCI 新成立部门高管的看法：“我们已经私有化了\
  \ NSFNET，”ANS 总裁在 1990 年哈佛大学的一次网络行业研讨会上吹嘘道。”⁵⁵。\n\n这种公私转让并没有向公众宣布，对其他 NSFNET 提供者也是隐瞒的。当一年后他们发现这一秘密交易的存在时，他们发出了警告，指责该机构将网络私有化给了一个内部人士。一些人要求对他们认为的管理不当和可能的欺诈行为进行国会调查。“这就像把联邦公园送给\
  \ K Mart。这是不对的，”一位大型 NSFNET 提供者的经理告诉《纽约时报》。⁵⁶。\n\n他们有理由愤怒。这项骨干网私有化交易为一家强大的公司提供了一个特权，使其能够迅速主导新兴的商业网络市场，而是以牺牲其他\
  \ NSFNET 提供者为代价的。⁵⁷。优势的关键在于 NSFNET 骨干网本身。该网络由政府资金建设和维持，横跨美国并连接了三十多个国家。相比之下，区域网络较小，通常局限于大纽约地区、中部地区或加州北部。那些扩展到国家商业市场的网络不能通过\
  \ NSFNET 骨干网路由商业流量，而在没有政府资助的情况下建立自己的私人网络。简而言之，NSF 直接资助了 MCI-IBM 财团的国家业务扩张。该公司公司利用其特权地位吸引商业客户，告诉他们他们的服务更好、更快，因为他们可以直接访问国家级高速骨干网。⁵⁸。\n\
  \n\n\n\n斯蒂芬·沃尔夫（Stephen Wolff）明白，支持像 MCI 这样的电信公司可能会导致少数强势集团控制新建立的互联网的局面，但他将这些危险抛诸脑后。正如沃尔夫在当时的采访中解释的那样，他的首要目标是建立可行的商业互联网。监管公平性和竞争行为是别人的工作。从一个非常基础的层面来说，他是正确的。他的目标只是建立一个网络，而不是监管它。问题在于，通过建立私有化网络，他同时也建立了一个行业，并以此推断制定了治理和监管该行业的基本规则。这两者是交织在一起的。\n\
  \n沃尔夫的放任管理风格引发了较小的区域 `NSFNET` 服务商的抗议。他们存在利益冲突、内幕交易和偏袒的指控。纽约地区服务商 `PSINET` 的总裁威廉·施拉德（William\
  \ Schrader）直接指责 `NSF` 将政府资产的垄断权授予了一家拥有特权地位的单体公司。他在 1992 年一次旨在调查政府对 `NSFNET` 可能管理不当的国会听证会上说：“政府将联邦资源的所有权私有化了。这种私有化不必要为承包商\
  \ `IBM-MCI` 提供了使用纳税人资金支付的联邦资源的专属垄断地位。”\n\n施拉德的 `PSINET` 与其他区域 `NSFNET` 服务商联合起来，敦促政府结束\
  \ `MCI-IBM` 的特权，并最终向不受限制的商业流量开放网络。施拉德告诉国会：“只有通过改变目前偏于某一个竞争对手的 `NSF` 政策，才能建立一个公平的竞争环境。”\n\
  \n施拉德并不是反对私有化本身。他为什么要反对呢？他自己的公司 `PSINET` 也是从一家获得过联邦资金支持的区域 `NSFNET` 服务商中拆分出来的，成为一个营利实体。就像\
  \ `IBM-MCI` 的 `ANS` 一样，`PSINET` 代表了少数恰好在正确的时间出现在正确地点的特权内部人士对政府补贴资产进行的事实上的私有化。施拉德没有挑战这一点。他反对的是\
  \ `NSF` 给另一组——可能更强大的特权内部人士赋予了比他公司获得的更多的特权。这是在政府创建的行业中，竞争性的政府补贴网络公司之间的争斗。这不是一场关于私有化的战斗。这是一场关于如何瓜分价值数十亿美元的新兴市场未来利润的抢夺。\n\
  \n### 计算机技术热潮\n\n20 世纪 80 年代，当斯蒂芬·沃尔夫计划升级 `NSFNET` 时候，美国正处于两个紧密相关的计算机技术热潮之中：廉价个人电脑的爆发和计算机网络的便捷访问。首先，`IBM`\
  \ 发布了一台强大的个人电脑并许可了该设计，使得任何计算机制造商都能制造兼容的 `IBM` 计算机组件。几年后，即 1984 年，苹果发布了 Macintosh，配备了完整的图形用户界面和鼠标。微软为\
  \ `IBM` 计算机开发的文本界面 `DOS` 操作系统之后是一个粗糙的 `Windows` 版本。计算机突然变得易于使用且负担得起。这不再仅仅是巨型公司、大大学以及政府和军事机构的专利——小型企业和极客的中产阶级早期采用者都可以拥有自己的系统。事实很快变得明显，个人电脑的真正力量完全不是个性的，而是社会性的。计算机允许人们访问远程服务器并与其他计算机连接，与数百数千英里之外的人通信并共享信息。数十万的人将电脑带回家，插上调制解调器，连接到奇异而早期的互联网形式。\n\
  \n### 早期在线服务\n\n少数精选公司自 20 世纪 70 年代以来一直在大公司提供类似 `ARPANET` 的访问。但在 20 世纪 80 年代后期，各种拨号和网络服务在各地涌现。既有如\
  \ `CompuServe`、`Prodigy` 和 `America Online` 这样的大公司，也有数百家小型机构。其中一些规模不过于拨号上网，这是在地下室和车库里运行的小爱好；另一些提供了一系列功能：论坛、聊天室、电子邮件、原始计算机游戏和新闻。它们都是基于文本的，但后来非常流行。斯蒂尔特·布兰（Stewart\
  \ Brand）也参与了。他共同创立了一个名为 `The Well` 的早期留言板。`The Well` 很快流行起来，成为 90 年代塑造数字文化的科技意见领、作家、黑客和记者的聚集纽。\n\
  \n这不是我们今天所知的全球互联的互联网。像 `The Well` 和 `America Online` 这样的服务彼此并不相通，仅允许同一服务内部的成员通信。实际上，它们是孤立的，至少一段时间内是这样。行业中的每个人都明白这是一个巨大的且极其丰利的行业，并且某种国家网络将连接一切。沃尔夫在采访时告诉我：“没有人怀疑无论网络是什么，它都会取得巨大的成功。”\n\
  \n### 转向私有化\n\n事实上，一旦斯蒂芬·沃尔夫允许他们私有化运营，`NSFNET` 承包商就开始争夺这一尚未开发的市场——这就是 `PSINET` 和\
  \ `ANS` 等服务商之间斗争的核心。他们垂涎欲滴，对政府资助了网络感到高兴，对即将退出业务感到更加高兴。有很多钱可赚。事实上，到 20 世纪 90 年代末，施拉德不起眼的\
  \ `PSINET` 已拥有 28 个国家的客户，在 `NASDAQ` 上价值 30 亿美元。我询问斯蒂芬·沃尔夫关于互联网的秘密私有化问题，想知道如此重大的决定是如何在没有公众参与的情况下完成的。对我来说，一个人、甚至一群人拥有如此权力是令人震惊的。\n\
  \n除了行业内部的争斗，斯蒂芬·沃尔夫私有化互联网的计划并没有真正的反对——不是来自 `NSNET` 内部人士，不是来自国会，绝不是来自私营部门。“我有人在那里工作，我们都同意这是正确的做法，”沃尔夫说，“那里没有任何冲突。”事实上，事实恰恰相反。无论是在\
  \ `NSF` 内部还是外部，似乎每个人支持这个计划。\n\n电缆和电话公司推动私有化，国会的民主党和共和党人也是如此。“正如杰伊·凯森（Jay Kesan）和拉吉夫·沙哈（Rajiv\
  \ Shah）对互联网私有化过程的详细剖析中所述，对 NSFNET 的私有化几乎没有公开辩论或反对，‘被骗一次是你的耻，被骗两次是我们的耻’。在 20 世纪 90\
  \ 年代初，两个政党的电信政策都是基于放松和竞争的概念。在 `NSFNET` 私有化之前的许多关键时刻，政治家和电信高管都明确表示，私营部门将拥有并运营互联网。”\n\
  \n\n\n\n来自夏威夷的民主党参员丹尼尔·伊诺埃（Daniel Inouye）是华盛顿少数反对这种全面私有化的当选官员之一。他希望通过一项提案来缓解私有化的进程，将未来\
  \ 20% 的互联网容量留给非营利组织、当地社区团体和其他公共利益团体用于非商业用途。他的理由是，由于联邦政府资助了这一网络的创建，它应该能够为公众保留一小部分。但他这项谦虚的提议敌不过行业的游说以及国会同事们对私有化的狂热。\n\
  \n1995 年，国家科学基金会（National Science Foundation）正式退出了 `NSFNET`，将互联网的控制权交给了少数私人网络提供商，这些供应商是在它十年前才创建的。国会对此问题没有进行投票。没有进行公投或讨论。这是通过官僚法令实现的，斯蒂芬·沃尔夫（Stephen\
  \ Wolff）政府资助的私有化网络设计使得私有化显得无缝且自然。\n\n一年后，总统比尔·克林顿签署了《1996 年电信法案》，这项法律取消了电信业的管制，自新政以来首次允许企业对媒体进行几乎无限的交叉持股：电缆公司、广播站、电影制厂、报纸、电话公司、电视广播节目以及，当然还有互联网服务提供商。该法律引发了大规模整合，最终导致少数垂直整合的公司拥有了美国媒体市场的大部分。克林顿总统在签署该法案时宣布：“这项法律是真正具有革命性的立法，将把未来带到我们的门前。”\n\
  \n少数强大的电信公司吸收了大多数十年前由国家科学基金会资金建立的私有化 `NSFNET` 提供商。旧金山湾地区的区域提供商成为了 `Verizon` 的一部分。南加州的提供商（曾由军事承包商\
  \ `General Atomics` 部分所有）被 `AT&T` 吸收了。纽约的提供商成为了 `Cogent Communications` 的一部分，它是全球最大的骨干网公司之一。骨干网归了\
  \ `Time-Warner` 所有的。而与 `IBM` 一起运营骨干网的 `MCI` 与 `WorldCom` 合并，结合了全球最大的两个互联网服务提供商。\n\
  \n所有这些合并都代表了一个强大的新电信系统的企业中心化，这个系统是由军队创建并由国家科学基金会引入商业生活的。换句话说，互联网诞生了。\n\n在所有这些整合中，一种新的科技出版物出现了，它将斯华特·布兰（Stewart\
  \ Brand）控制论公社的乌托邦理想与 20 世纪 90 年代的自由市场狂热相结合。它帮助将新兴的私有化互联网推销为真正的反文化政治革命：它自称为 *Wired*。\n\
  \n# 全球地球 2.0\n\n路易·罗塞托（Louis Rossetto）是一个留着帕特里克·斯威泽（Patrick Swayze）发型的瘦长书生形象，他于\
  \ 1993 年创了 *Wired*。罗塞托在长岛的一个保守天主教徒家庭中长大。他的父亲路易·罗塞托老士，就是路易·罗塞托老士。\n\n1995 年，国家科学基金会正式退出了\
  \ `NSFNET`，将互联网的控制权交给了少数私人网络提供商，这些供应商是在它十年前才创建的。\n\n国会对此问题没有进行投票。\n\n罗塞托的谦虚提议敌不过行业的游说以及国会同事们对私有化的狂热。\n\
  \n旧金山湾地区的区域提供商成为了 `Verizon` 的一部分。南加州的提供商（曾由军事承包商 `General Atomics` 部分所有）被 `AT&T`\
  \ 吸收了。纽约的提供商成为了 `Cogent Communications` 的一部分，它是全球最大的骨干网公司之一。骨干网归了 `Time-Warner`\
  \ 所有的。而与 `IBM` 一起运营骨干网的 `MCI` 与 `WorldCom` 合并，结合了全球最大的两个互联网服务提供商。\n\n\n\n\nMAG 为军事部门进行了各种研究。他们致力于视频会议技术，以便在核战争发生时，分散在全国各地地下堡道中的总统及其高级将领能够以自然的方式相互互动。他们开发了`科罗拉多州阿斯彭`的交互式“视频地图”，这是一个实验性的虚拟现实环境，可用于演练袭击。\n\
  \n也许 MAG 最令人毛骨悚然的实验是创建了一个由啮齿动物占据的机器人迷宫。该项目名为 `SEEK`，是一个充满了光亮的巨大笼子，动物在环境中移动时会撞到这些光上。计算机监控着场景，并部署机械臂重新排列方块，将它们放置在它认为动物想要去的地方。这个想法是创建一个由计算机介导的环境——一个“控制论世界”，它会根据啮齿动物的需求和愿望而改变。\n\
  \n1985 年，尼格罗庞特（Negroponte）将建筑小组转变为一个更酷、更符合个人电脑革命的机构：`麻理工学院媒体实验室`（MIT Media Lab），这是一个连接商业、军事承包和大学研究的枢纽。他积极地寻求企业赞助，试图找到将他一直为\
  \ `ARPA` 开发的计算机、网络和图形技术商业化并变现的方法。通过支付高额的年度会员，赞助商可以获得`媒体实验室` 开发的所有技术，而无需支付许可费。这是一次巨大的成功。在开门仅两年后，`媒体实验室`就积累了一份巨大的企业赞助商名单。每个主要的美国报纸和电视网络都是该俱乐部的一员，包括主要的汽车和电脑公司，如`通用汽车`、`IBM`、`索尼`、华纳兄弟和`HBO`。当时已更名为\
  \ `DARPA` 的 `ARPA` 也是一个主要的赞助商。\n\n`麻理工学院媒体实验室`在当时引起了轰动——以至于斯图华·布兰（Stewart Brand）几乎是恳求尼格罗庞特让他去那里呆。1986\
  \ 年，他获得了在媒体实验室作为“访问科学家”待一年的机会。后来，他写了一本关于尼格罗庞特及其实验室向世界引入尖端技术的书。读起来像营销文案，对电脑配件、虚拟现实、人工智能和涵盖计算机网络感到兴奋不已。布兰将尼格罗庞特描述为一个独特驱动力、致力于“发明未来”的“愿景家”，并帮助巩固了尼格罗庞特作为一名反叛大祭司的地位，他跨越了大公司和大政府的世界，并超越了两者。\n\
  \n20 世纪 90 年代初，当罗塞托（Rossetto）和梅卡菲（Metcalfe）为他们的科技生活方式杂志渴望投资者时，尼格罗庞特是世界上最受尊重和最炙求的计算机愿景家之一。因此，1992\
  \ 年，罗塞托和梅卡菲带着一本`Wired`杂志的样和一份商业计划，在加州蒙特利举行的`技术、娱乐与设计会议`（现在被称为 `TED`）上堵他。他们进行了推销，令他们惊讶的是尼格罗庞特留下了深刻印象并同意帮助他们获得资金。他安排了与泰德·特纳（Ted\
  \ Turner）和鲁伯特·默多奇（Rupert Murdoch）的会面，但两人都没有表现出太大的兴趣。最后，尼格罗庞特决定自己资助这个项目。他提供了 `$75,000`\
  \ 的种子资金，换取 10% 的股份。对于业务的一大块来说，这是一个微不足道的金额，但罗塞托和梅卡菲同意了。他们聪明地看到了这个机会：尼古拉斯·尼格罗庞特是一个大人物，与商业、学术界和政府的高层有深厚的联系。他们打赌尼格罗庞特会通过他的资金以及在其他愿意投入巨额资金投资\
  \ `Wired` 的巨头中的参与来帮助启动投资泵。他们是对的。在他加入后，投资资金像水一样涌入。\n\n为了帮助他策划这本新杂志，罗塞托聘请了斯图华·布兰的老学徒担任\
  \ `Wired` 的创始执行编辑：`凯文·凯利`（Kevin Kelly）。凯利胖乎乎的，留着阿米派风格胡须，他在 20 世纪 80 年代后期为斯图华·布兰工作，当时这位年老的反文化推广者正开始将他的出版业务从公社转向蓬勃发展的个人电脑行业。凯利是一个充满活力且渴望的追随者，一个为了正义使命的人。\n\
  \n作为《时代》杂志高管的儿子，凯利在 20 世纪 70 年代的大部分时间都在范围内游。1979 年，当他在以色列旅行时，他产生了一种神圣的视觉。根据自己的描述，他被锁在酒店外，被迫在晚上于耶路撒冷徘荡。他在`圣墓教堂`内部的一个石板上睡着，醒来后看到了一个宗教幻象，意识到耶稣是上帝之子，已作为人类的救主复活。“最后，这取决于一个人所做的决定。你走这样一条路，在那条路里，一切都完全合逻辑，”凯利后来在谈及皈依经历时说，“我想我就是这样做。在复活节早晨去耶路撒冷的空坟墓才真正触发了对这种替代观点的接受。一旦我接受了，我就因为这个观点而拥有逻辑、安慰和杠杆。”\n\
  \n`杠杆`（利用）形容凯利突然的宗教灵感是一个很好的词。他对上帝的信仰与他对技术进步力量的信仰相匹配，他认为这是上帝对世界的完美计划的一部分。多年来，他产生了信念：`互联网`的增长、我们周围一切事物的配件化和计算机化、肉体与计算机的最终融合，以及人类上传到虚拟计算机世界，都是一个过程的一部分，这个过程将人与上帝合并，并允许我们也成为神，像我们的创造者一样创造并统治我们自己的数字和机器人世界。“我曾有一个幻象，无限的上帝将自己束缚在他的造物中。当我们未来制造这些虚拟世界时——这些虚拟生物具有自主权去作恶、杀戮、伤害和毁灭选择的世界——游戏创造者进入并从内部尝试修复世界并非不可想象。对我来说，这就是耶稣救赎的故事，”凯利在接受《今日基督教》杂志的采访时解释道。\n\
  \n在 `Wired`，凯利将这种神学注入到杂志的每个部分，在文中注入了对市场和去中心化计算机技术终极良善和正确的无条件信念，无论它们如何被使用。\n\n\n\n\
  \n\n# `Wired` 杂志第一期于 1993 年 1 月在报摊上市。它采用光纸印刷，使用荧光色墨水，并采用了具有冲击力的布局，刻意模仿了斯斯华特·布兰（Stewart\
  \ Brand）的《地球目录》（`Whole Earth Catalog`）那种混乱的 DIY 杂志美学。就像《地球目录》一样，《Wired》将自己定位为一种新型激进数字亚文化的代表物和创造者，这种文化生活在一个新型网络世界的前沿。它也是那些渴望加入这一兴奋未来的局外者的指南，教读者如何交流和思考技术革命。⁹⁴\
  \ “关于科技的杂志有很多，”罗塞托（Rossetto）在杂志创刊号上解释道，“`Wired`并非其中之一。`Wired`关注的是今天地球上最有影响力的人——数字代人。这些人不仅预到了计算机、电信和媒体的融合如何改变新千年纪元之际的生活，而且他们正在让这一切发生。”⁹⁵\n\
  \n`Wired` 立即在财务和评论界取得了成功。在出版第一年结束时，它已经拥有三万订阅者。在出版第二年，它获得了声誉卓著的国家杂志奖，订阅人数增加到二十万。它还推出了一家电视子公司和一个名为\
  \ `HotBot` 的搜索引擎。到 1996 年，路易斯·罗塞托已准备好利用这波热潮并让公司上市。他聘请了高盛来实现这一目标，这使得 `Wired` 的估值估计达到了\
  \ 4.5 亿美元。这本杂志是点泡沫时代的门面，也是新经济的传教士——新经济是一个历史上的革命性时刻，技术进步本应重写所有规则，并让以前的一切都变得无关紧要且过时。\n\
  \n美国计算机产业的媒体可以追溯到 20 世纪 60 年代。它并不华丽或时尚，但很好地涵盖了新兴的计算机和网络业务——它并不回避批判性报道。像《ComputerWorld》这样的出版物在\
  \ 20 世纪 70 年代处于隐私辩论和中央化计算机数据库危险报道的前沿，并对 20 世纪 90 年代 `NSFNET` 私有化丑闻进行了深度报道。`Wired`\
  \ 则不同。与《地球目录》一样，《Wired` 并不完全是一个新闻企业；它也不是一份行业出版物。⁹⁶ 它看起来更像是该行业的网络枢纽和营销平台，一个旨在围绕技术崇拜以及制造和销售技术的人群创造一个品牌的助推器，然后将其重新包装并推向主流文化。它延续了斯斯华特·布兰开启的传统，将亚文化的意象叠加在日益强大的计算机产业之上，赋予其一种酷炫且草根的革命性锋芒。\n\
  \n这不仅仅是摆态。在最初的几年里，这种能量和传教士精神渗透了 `Wired` 每一页荧光色的纸张。该杂志报道了五角楼的尖端虚拟现实战场技术。⁹⁷ 它描绘了反抗联邦政府的密码学家和边缘创业者的形象。它报道了一类新的计算机资本家如何在苏联的废墟上建立一个新的科技世界。它为点泡沫时代和火热的股市击喝彩，认为这不是投机泡沫，而是文明的新阶段，技术进步意味着股市将永远不会崩溃。⁹⁸\
  \ 它评测书籍和电影，展示了最新的计算机小配件，刊登了布莱恩·伊诺（Brian Eno）等音乐人的采访，并委托像威廉·吉布森（William Gibson）这样的科幻作家进行调查报告。当然，斯斯华特·布兰频繁出现在杂志页面，从创刊号就开始了。在\
  \ `Wired` 的世界里，计算机和互联网正在改变一切。政府、军队、资源公有制、政党传统的左右对立、法定货币——这一切都是过去的遗迹。计算机网络正在扫清一切，并创造一个新世界。\n\
  \n`Wired` 的影响不仅是文化上的，也是政治上的。杂志对私有化世界的拥抱，使其成为那些推动放松管制和私有化美国基础设施利益者的天然盟友。\n\n在 `Wired`\
  \ 页面推崇的科技英雄圣堂中，有右翼政治家和评论家、电信亨，以及在华盛顿周旋以煽动情绪并推动私有化的企业游说客。共和党众员纽特·金里奇（Newt Gingrich）和里根的经济大师乔治·吉尔德（George\
  \ Gilder）曾登上封面，他们对私有化互联网的观点被淡化。⁹⁹ TCI 的垄断富翁、美国最大的土地所有者之一约翰·马龙（John Malone）也入选了`Wired`\
  \ 将他放在封面上，作为一个对抗 FCC 的朋克，穿着皮夹外套拿着猎枪走在空旷公路上。这位富翁之所以如此酷？是因为如果他们不批准他的合并，他就射掉 FCC。¹⁰⁰\n\
  \n`Wired` 提进电信商人和共和党政治家并不意外。毕竟，路易斯·罗塞托是一个从共和党转向自由主义者，相信商业和自由市场。这里没有意识形态上的分歧。\n\n\
  一个经常出现在 `Wired` 页面的团体，也是后来走向主流的团体，是电子边界基金会（`EFF`）。¹⁰¹ 基金会由三位在斯斯华特·布兰的 `The Well`\
  \ 留言板上的富翁于 1990 年在旧金山创立，最初为新兴的互联网服务提供商行业游说。¹⁰² 1993 年，`EFF` 创始人米奇·卡普（Mitch Kapor）为\
  \ `Wired` 写了一篇文章，阐述了他和 `EFF` 对未来互联网的立场：“私有的，而非公有的……网络空间的塑造正符合托马斯·杰斐希望的那样：建立在个人自由优先以及对多元化、社区的承诺的基础上。”¹⁰³\n\
  \n`Wired` 支持 `EFF` 的私有化愿景，在杂志上为该组织提供阐述观点的空间，同时对其活动进行谄媚。它将 `EFF` 为强大的电信捐赠者做的游说工作，与\
  \ 20 世纪 60 年代湾区地区反权威的亚文化场景相提。`Wired` 记者约书亚·奎特纳（Joshua Quittner）在关于 `EFF` 迁往华盛顿的个人简介中写道：“在某些方面，他们是疯狂搞事者（Merry\
  \ Pranksters），那些 LSD 的信徒，曾在一辆名为‘远方’的迷幻巴士上穿梭于 20 世纪 60 年代，由小说家肯·凯西（Ken Kesey）领导，并被汤姆·沃尔夫（Tom\
  \ Wolfe）在《电击狂果酸测试》中记录。”¹⁰⁴ “现在他们更老、更明智了，他们再次上路，虽然没有了巴士和致幻，但散布着许多类似的陈词：调开启、接入、连接。用跨越宇宙的脉冲比特声喂给你的大脑，并了解一些关于你是谁的东西。”\n\
  \n\n\n\n描写代表电信公司工作、致力于放松互联网监管的企业游说客，却把他们写成反叛者和迷幻青年？这似乎显得愤世嫉俗，甚至有些粗俗。但 `Wired` 杂志是严肃且真实的，它如此契合，人们也深信不。因为在\
  \ `Wired` 为读者构建的世界里，任何与互联网相关的东西都是不同且激进的。这很有道理。`Wired` 和 `EFF` 是同一个更大的商业-反文化-新右翼网络及意识形态的延伸，它们源于斯斯华特·品牌（Stewart\
  \ Brand）的《整个地球》。这正是 `Wired` 真正的文化力量所在：利用反文化的控制论理想，将企业政治作为一种革命性行为来销售。\n\n`Wired`\
  \ 杂志只是代表美国社会更大文化和政治趋势的最时髦、最年轻的媒体。在 20 世纪 90 年代，无论你看向哪里——《华尔街日报》、《福布斯》、《纽约时报》——评论员、记者、经济学家和政治家们都在预测一个富足时代的到来，那里几乎一切都将发生变化。旧的规则——稀缺、劳动力、财富与贫困、政治权力——不再适用。计算机和网络技术正在开启信息时代，在这个时代，人类将最终获得解放，从专横的政府和边界中解放出来，甚至从他们自身的身份中解放出来。\n\
  \n9996 年，在《电信法案》通过的同一年，路易斯·罗塞托（Louis Rossetto）做出了一个大胆的预测：互联网将改变一切。它甚至会让军队过时。“我的意思是，一切——如果你对世界运作方式有一堆先成为主的观念，你最好重新考虑一下它们，因为在那里的变化是瞬时万变的，”他说，“而且在全球村庄里，你不需要那些笨笨的军队，你最多可能需要一支警察部队，并且需要居民的善意，除此之外，你不需要这些已经建立起来的结构了。”\n\
  \n回到 1972 年，斯斯华·品牌曾试图说服《滚石杂志》的读者，那些躲在斯坦福实验室里、玩电子游戏并为 `ARPA` 构建强大计算机工具的年轻五角大承包商们，并不是在为战争服务。他们正在破解系统，利用军事计算机技术来终结军事。“太空大战游戏服务于地球和平，”他当时写道，“同样还有任何对计算机的奇特玩法，任何对个人独特目标的计算机追求，特别是任何使用计算机来抵消其他计算机的行为。”品牌将计算机视为通往乌托邦世界秩序的道路，个人掌握着最终权力。之前的一切——军队、政府、大压迫企业——都会融化，一个平等的系统将自发地出现。“当每个人都能使用计算机时，黑客将接管一切：我们都是电脑虫，作为个体和合作者，我们都拥有了更多的力量。”\n\
  \n二十四年年后，罗塞托表达了同样的情绪将个人电脑和互联网推广为从根本上赋能个人并让军队消失于无形的工具。对于他那人来说，这是一种天真且或许是自利的观点，因为他的名声和财富依赖于尼古拉斯·尼格罗庞特（Nicholas\
  \ Negroponte）的支持，尼罗庞特是一个职业军事承包商，在罗塞托说出这些话时，他所在的 `MIT Media Lab` 正在接受来自 `DARPA` 的资助。\n\
  \n意料的是，未来并没有按照罗塞托的梦想发展。村庄确实变成了全球性的。但过去那些笨笨的军队并没有消失；事实上，事实证明，计算机网络和互联网扩大了美国军事和情报机构的权力，使他们变得全球且无处不在。\n\
  \n# 第 5 章\n\n## 监控公司\n\n完美的搜索引擎就像上帝的心智。\n\n—谢尔盖·布林（Sergey Brin），选自《谷歌的未来在何方》\n\n\
  美国每个人都记得 2001 年 9 月 11 日早晨他们在哪里，那天，有两架飞机撞击了世界贸易中心。\n\n当时我正忙着把行李搬到加州大学伯克利分校区南侧的一间房间，那里是我刚从圣马特奥的一所社区学院转过去的地方。我当时没有电视也没有电脑，智能手机还不存在。为了获取新闻，我和一个朋友在电报大道附近的一家肮脏的披萨店里一整天盯着\
  \ `CNN`，啃着冷掉的披萨，喝着啤酒，总觉得感到困惑和无助。\n\n谷歌联合创始人谢尔盖·布林也记得 9/11 事件当天他在哪里。但与我们大多数人不同，他有权力做点什么。做些有重大意义的事。\n\
  \n那天早上，布林冲进了位于山景城 Bayshore 大道的谷歌总部。他静静地召集了一小群最信任的工程师和经理，并指派他们执行一项绝密任务：挖掘谷歌的搜索日志，寻找任何可能揭示当天上午袭击参与者身份的信息。\n\
  \n“谷歌此时的规模已经足够大，完全有可能恐怖分子利用它来帮助策划他们的攻击，”布林告诉聚集在他身边的反恐数据挖掘小组，“我们可以根据在劫持发生前期间进行的一系列交叉搜索查询集来尝试识别他们。”为了让他们开始工作，他罗列了一份可能的搜索词列表，例如“波音”、“燃料容量”、“航空学校”。如果他们发现来自同一台计算机的若干个与恐怖相关的关键词，布林指示他们尝试对搜索进行逆向工程，以暴露用户的身份并可能阻止下一次攻击。\n\
  \n这个计划有很大的成功机会。\n\n自从布林和他的伙伴拉里·Page（Larry Page）使用 2500 万美元风险资金将他们的斯坦福毕业项目转化为一家利润丰丰的搜索公司以来，已经过去了三年。当时的谷歌还没有像今天这样无处不在，它的名字也没有成为“搜索”的代名词。事实上，它几乎没有赚钱。但谷歌正迅速成为全球最受欢迎的搜索引擎，它坐拥着一座行为数据金矿。它每天处理\
  \ 1.5 亿次搜索。每一条记录都包含一个搜索查询、来源地、输入日期和时间、使用的计算机类型，以及用户最终点击的搜索结果链接。所有这些信息都与谷歌在每个使用服务的计算机上放置的追踪\
  \ `cookie` 文件关联。\n\n单独来看，这些搜索查询的价值有限。但集合起来，通过在长时间内对行为模式进行挖掘，它们可以描绘出一幅丰富的传记肖像，包括一个人的兴趣、工作、关系、爱好、秘密、怪癖、性取好、疾病，以及政治和宗教观点。一个人在谷歌搜索框中输入的内容越多，浮现的画像就越精细。考虑到全球有数亿人，他们每天整天使用该网站，你就会意识到谷歌所拥有的数据储备是多么难以想象。\n\
  \n\n\n\n这些数据可能极其具体，就像大脑探针一样，让 Google 能够以前所未有的细节对个人进行画像。人们将搜索框视为一个公正的神谕，它接受问题，吐出答案，然后继续运行。很少有人意识到它记录了输入其中的一切内容，从人际关系困扰的细节到——布林希望的——关于未来恐怖袭击的计划。\n\
  \n布林在那个上午组建的精英恐怖分子猎人小组对搜索日志中包含的信息类型了如指掌；其中许多人在过去的三年里一直在这些数据基础上构建了很快就会价值数十亿美元的定向广告业务。因此，他们开始着寻找嫌疑人。\n\
  \n“在第一次运行中，日志团队每天发现大约十万条符合他某些标准的查询，”谷歌首任营销总监道格拉斯·爱德华兹在他的回忆录《我感觉很好：谷歌 59 号员工的自白》中回忆道。他参与了那次行动，并记得对日志进行更深层次分析的结果令人失望。“我们在日志中搜索\
  \ 9/11 恐怖分子，没有发现任何有趣的内容。我们最接近的发现是一个 cookie，它同时搜索过‘世界贸易中心’和‘埃及航空劫持’。如果恐怖分子*确实*使用\
  \ Google 来策划他们的攻击，他们是以一种我们无法发现的方式完成的。”⁴](#endnotesa.xhtml#en0363en)\n\n目前尚不清楚布林是完全出于个人主动在搜索日志，还是收到了\
  \ FBI 或其他执法机构的非正式请求。但他的数据挖掘工作比乔治·W·布什总统签署《爱国者法案》早了一个多月，该法案将赋予国家安全局广泛的权限，以非常相似的方式提取和挖掘搜索日志数据。\n\
  \n“我今天签署的这项新法将允许监控恐怖分子使用的所有通信，包括电子邮件、互联网和手机。从今天起，我们将能够更好地应对通信技术激增带来的技术挑战，”布什总统在\
  \ 2001 年 10 月 26 日签署该法律时说道。“美国人民需要知道，我们正在收集大量信息，并花费大量时间尝试收集可能的情报，追踪每一个线索，落实每一个暗示，以便保持美国的安全。这正在发生。”⁵](#endnotesa.xhtml#en0364en)\n\
  \n从某个层面上，布林寻找恐怖分子的追求是可以理解的。那是一个恐怖的时代。美国被更多恐怖袭击即将来发生的恐惧所笼罩。但鉴于美国政府对潜在恐怖分子及其同犯的信息——任何信息——的渴望，这种努力具有一个令人不安的维度。9/11\
  \ 之后，CIA 在阿富汗和巴基斯坦抓获了数十名嫌疑基地组织成员，并将他们关押在关塔摩纳湾，在许多情况下是根据他们支付了数百万美元赏金获得的二手情报采取的。最终，780\
  \ 名被留者中有 731 人（超过 90%）在未被指控的情况下被释放。⁶](#endnotesa.xhtml#en0365en) 像“波音”、“燃料容量”、“航空学校”和“美国灭亡”之类的搜索听起来可能是有罪的，但很难证明这些人参与了恐怖活动。如果伊斯兰堡的一个青少年在\
  \ Google 上搜索这些术语，而公司将这些信息交给政府，他可能会在半夜被绑架运往关塔摩纳湾。\n\n但布林的这种私刑式的努力有效吗？净结果如何？\n\n并不真正，而且不多。对于在回忆录中讲述这个故事的道格拉斯·爱德华兹来说，这段经历是一个教训。他几乎从公司成立初就在那里，但直到\
  \ 9 月 11 日，他才开始意识到 Google——并由此推整个硅谷的其他部分——在它的文件中锁定了多大的力量。“无法避免这样一个事实，我们正试图根据搜索记录筛选出特定的用户。如果我们发现了他们，就会尝试根据日志中关于他们的数据来确定他们的个人信息，”爱德华兹写道。“我们在日志文件中拥有着人们最私密的想法，而且很快，人们就会意识到这一点。”⁷](#endnotesa.xhtml#en0366en)\n\
  \n我最早从 2001 年开始使用 Google，当时大约是谢尔盖·布林开始猎捕恐怖分子的时候。对我来说，也对许多在 21 世纪初成长的人的人来说，Google\
  \ 是我第一个真正信任的互联网公司。它不要求金钱。它不用讨厌的广告轰炸你。它有一个整洁洁的设计，在空白背景的中心是一个简单的搜索框。它的运行方式与互联网上任何其他东西都不同，帮助你穿过一个混乱而奇妙的新世界。它让你指尖拥有了整个图书馆，允许你即时翻译外语，让你与地球另一端的人实时协作。而你获得这一切都是免费的。这似乎违背了经济学定律。\n\
  \n即使在扩张为一家跨国数十亿美元公司时，Google 仍然成功地保留了它那极客式的纯真的“不作恶”形象。它说服了用户，它所做的一切都是出于帮助人类的渴望。这就是你在几乎每一本关于\
  \ Google 的畅销书中都能找到的故事：关于两个来自斯坦福的天才极人的传奇故事，他们将一个大学项目变成了一个定义时代的新经济动力引擎，这家公司体现了网络化社会的每一个乌托邦承诺：赋权、知识、民主。很一段时间内，这感觉\
  \ true 是真的。也许这确实是一个全新的、高度网络化的世界秩序的开始，在这个秩序中，旧的结构——军队、公司、政府——在互联网平衡的力量面前是无助的。正如《连线》杂志的路易斯·罗塞托在\
  \ 1995 年写道，“我们所知道的一切都将变得不同。不仅仅是从 L.B.J. 到尼克松的转变，而是是否还会有总统。”⁸](#endnotesa.xhtml#en0367en)\n\
  \n在当时，任何暗示 Google 可能是新一种反乌托邦的先驱，而非技术乌托邦的人，都会被笑出门。这当时几乎是不可想象的。\n\n# 数字图书馆\n\n劳伦斯·佩奇（Lawrence\
  \ Page）是一个社交孤僻的孩子，在计算机周围出生长大。1978 年，当他五岁岁时，他的父亲卡尔（Carl）花了一时间在加利福尼亚州山景城的 NASA 梅斯研究中心担任研究员。该中心是一个\
  \ ARPANET 站点，Google 多年后在扩大其企业园区时租租了那里。⁹](#endnotesa.xhtml#en0368en) 佩奇的母亲格洛娅（Gloria）在密歇根州立大学教授计算机编程。他的哥哥卡尔·佩奇二世（Carl\
  \ Page Jr.）是一位开拓性的互联网企业家，他创立的一家早期留言板公司后来被 Yahoo! 以近五亿美元收购。\n\n佩奇是在编程中长大的。⁰](#endnotesa.xhtml#en0369en)\
  \ 当他十二岁时，他读了一本关于尼古拉·特斯拉（Nikola Tesla）的传记，这位天才的塞尔维亚裔美国发明家开发了从电动机、无线电、荧光灯到交流电的一切发明，但最终在贫困、孤独和疯癫中，在给一只住在窗台上的鸽子写信时去世了。¹¹](#endnotesa.xhtml#en0370en)\
  \ 佩奇读透了那本书，特斯拉一直是一个持久的灵感。让佩奇痴迷不仅是特斯拉的发明，还有他在想法变现方面的反复失败。“他在商业化工作方面遇到了所有这些问题。这是一个非常悲伤的故事。我意识到特斯拉是最伟大的发明家，但他取得的成就没有他应有的，”佩奇曾告诉记者约翰·巴特尔（John\
  \ Battelle）。“我意识到我想发明东西，但我也想改变世界。我想把它们推出去，交到人们手中，让他们他们可以使用它们，因为那才是真正重要的。”¹²](#endnotesa.xhtml#en0371en)\n\
  \n\n\n\n财富、名声、在世界上留下自己的足迹——这些都是年轻的佩奇幻想过的事情。斯坦福大学以及一项由国防高级研究计划局（以前称为 ARPA）资助的研究计划，将让他实现梦想。¹³\n\
  \n斯坦福大学位于旧金湾边缘，距离市南部 35 英里。它由莱兰德·斯坦福创立，他是一位当地铁路大亨，曾当选为州长，后担任参议员。¹⁴。当该大学于 1891 年开校时，纽约的《邮政与快报》对该项目进行了嘲讽，写道：“加利福尼亚再需要一所大学的需求，就像在瑞士为腐朽的海长建立收容所的需求一样大。”¹⁵。但该机构和周边地区共同繁荣。20\
  \ 世纪初，湾区发展了繁荣的无线电和电子产业，成为真空管制造的中心。第二次世界大战期间，受无线电技术和先进真空管设计以支持军雷达技术的需求驱动，该地区再次繁荣。战后，斯坦福大学成为西海岸版的马萨诸顿理工学院，后者是与美国军工工业复合体紧密相连的精英工程大学。¹⁶。校园周边地区是计算机和微处理器开发的中心。\n\
  \n威廉·肖克利是一位麻萨诸顿理工的化学家，也是一位臭名昭彰的优生学者，他作为贝尔实验室发明固体晶体管团队成员而闻名。1956 年，他回到家乡帕洛阿尔托，在大学的斯坦福工业园区内创立了肖克利半导体公司。¹⁷。他的公司催生了其他几家微芯片公司，包括英特尔，并为硅谷命名。惠尔士-帕板、伊士曼柯达、通用电气、施思\
  \ PARC 和洛克希德马丁也于同一时期在斯坦福工业园区内设立机构。硅谷的军事工作如此之多，以至于在整个 1960 年代，洛克希德一直是湾区最大的雇主。\n\n\
  ARPA 在校园内也有巨大的影响力。斯坦福研究所作为威廉·戈德尔“敏捷计划”的一部分，为该机构从事反叛和化学战争工作。它还设有增强研究中心，这是一个由经常掉药的道格拉斯·恩格伯特运营的\
  \ ARPANET 站点。事实上，ARPANET 部分诞生于斯坦福。¹⁸\n\n直到 20 世纪 90 年代，斯坦福大学并没有太大变化。它仍然是尖端计算机和网络的研究基地，仍然沉浸在军方资金和控制论乌托邦主义中。也许最大的变化发生在大学周边的郊区——山景、库珀蒂诺、圣何塞——那里聚集了大量的投资者和互联网初创公司：eBay、雅虎和网景。当年轻的拉里·佩奇直接跳入这一旋涡时，斯坦福正是湾区互联网泡沫的中心。\n\
  \n佩奇于 1995 年秋季在斯坦福大学开始了计算机科学博士课程。他如鱼得水，立即开始四寻。\n\n2990 年代，互联网已成长为一个庞大且混乱的生态系统。这里充满了投资者和互联网初创公司：eBay、雅虎和网景。当年轻的拉里·佩奇直接跳入这一旋涡时，斯坦福正是湾区互联网泡沫的中心。\n\
  \n1994 年，在佩奇到达斯坦福的一年前，DARPA 对卡内基梅隆大学的“数字图书馆计划”的资助取得了显著成功：`Lycos`，一个以 `Lycosidae`（狼蛛科）命名的搜索引擎。²³\n\
  \n拉里·佩奇对搜索的兴趣与数字图书馆计划的目标完美契合，他的研究在该计划的伞下进行。²⁴\n\n拉里·佩奇在斯坦福的第一天，研究生说明会上遇到了谢尔盖·布林。两人既相似又对立。他们很快成为了朋友。\n\
  \n佩奇内向且安静；有些人认为他可能有点自闭症。他说话带有奇怪的口音，被人误认为是东欧口音。²⁵。布林则相反，他社交、健谈并热爱运动。当同学们回忆他在斯坦福的时光时，他们记得布林在走廊里滑滑板，并经常出入教授们的办公室。\n\
  \n\n\n谢尔盖·布林的家族在 20 世纪 70 年代从莫斯科移民美国，并非常成功地融入了工程与学术界。他的母亲尤金尼亚（Eugenia）曾是 NASA 的一名科学家。他的父亲迈克尔（Michael）是马里兰大学的一位终身数学教授。\n\
  \n布林是一个数学天才。九岁那时，他发现了早期互联网，并花时间泡在聊天室里玩多人地下城游戏，即 `MUDs`。他沉浸在这一新通信技术中数小时，当他发现那里有很多和他一样的人——“试图谈论性事的十岁男孩”时，他感到有些索然无味。\n\
  \n布林于 1990 年提前一年高中毕业，就读于马里兰大学，主修数学和计算机科学双学位。他于 1993 年以优异成绩毕业，并获得国家科学基金会研究生研究奖学金前往斯坦福大学继续深造。在斯坦福期间，他对数据挖掘产生了兴趣：构建能够根据人们过去的行为预测其未来行为的计算机算法。他们会买什么？他们喜欢什么电影？他甚至创立了一个名为\
  \ `MIDAS` 的学生组织：“斯坦福数据挖掘”。多年后，行为数据挖掘被证明是 Google 的“点石之笔”。但那是很久之后的事了。当布林对数据挖掘研究的狭领域感到厌倦时，他决定和伙伴拉里·佩奇（Larry\
  \ Page）一起加入一个新项目。“我接触了很多研究小组，这是最令人兴奋的项目，既因为它处理的是代表人类知识的 Web 网，也因为我喜欢拉里，”布林在一次采访中回忆道。\n\
  \n搜索的核心问题是相关性。某些网页比其他网页更重要、更具权威性，但第一代搜索引擎无法区分这种差异。佩奇理解，关键在于找到将排名系统整合到搜索结果中的方法。这是一个简单但强大的想法，源自学术界——在学术界，一篇研究论文的重要性取决于它被其他研究论文引用的次数。一篇被引用千千的论文被认为比仅被引用十次的论文更重要。由于其超链接设计（每个网页都链接到其他页面），互联网本质上是一台巨大的引用机器。这就是佩奇的突破。他将生成的实验项目命名为\
  \ `PageRank`，并在布林的帮助下开始将其整合在一起。\n\n他们首先编写了一个机器人爬取整个互联网，抓取内容并将其全部保存在斯坦福大学的服务器上。然后，他们精炼并优化了\
  \ `PageRank` 算法以产生相关结果。由于不同的链接带有不同的价值——来自《纽约时报》等报纸的链接远比某个人主页的链接更有权威性——他们调整了计算方法，根据链接的数量以及链接本身的分数对页面进行评分。最终，任何给定网页的排名是指向它的所有链接及其价值的总和。一旦几个初始网页的值进入\
  \ `PageRank` 算法，新的排名就会递归地通过整个网络进行传播。布林在推出 Google 不久后解释道：“我们将整个网络转换成一个具有数亿变量的大方程，这些变量就是所有网页的排名。”这是一个互联网的动态数学模型。如果其中一个值发生变化，整个模型就会重新计算。\n\
  \n他们将其整合到一个名为 `BackRub` 的实验性搜索引擎中，并将其放在斯坦福大学的内部网上。`BackRub` 的标志很诡异：它是一张黑白照片，上面是一只长在毛手臂上的手正在搓裸背部。但这并不重要。随着名声传开，学生们开始使用它——并大为惊叹。这个学生项目优于当时的任何商业搜索引擎，如\
  \ `Excite` 或 `AltaVista`。当时主导地位的搜索公司价值数十亿，但并不理解自己的业务。“他们只看文本，而不考虑这种其他信号，”佩奇说。\n\n\
  这对组合迅速重新命名为 `Google` 的搜索引擎变得如此受欢迎，以至于超过了斯坦福大学的带宽。布林和佩奇意识到他们发现了一些特别的东西。Google 的规模远比一个研究项目大得多。即使在早期阶段，他们也明白\
  \ Google 的搜索不仅仅是抽象的数学。\n\n对互联网内容去索引只是第一步。下一步是理解搜索者的*意图*。是一个青少年吗？一个计算机科学家吗？\n\n-\
  \ Google 对某人的了解越多，它的搜索结果就越好。\n\n当佩奇和布林致力于完善 Google 的相关性算法时，他们开始考虑根据个人的兴趣来定制搜索结果。他们最初的一些想法非常原始，包括扫描个人的浏览器书签或摄取其学术主页的内容（这些主页通常列出了个人兴趣以及学术和职业经历）。在描述\
  \ Google 搜索方法的 1998 年原始论文中，两人写道：“这些搜索引擎可以通过高效地猜测用户的大部分兴趣，为他们节省大量麻烦。”\n\n这个简短的句子定义了这家公司的未来。收集数据和用户画像成为他们两人的执念。这使他们富得不可想象，并将\
  \ Google 从一个单纯的搜索引擎转变为一个巨大的全球平台，旨在尽可能获取接触它的人的信息。\n\n# 大脑源泉\n\n1998 年，拉里·佩奇和谢尔盖·布林搬进了苏珊·沃西基（Susan\
  \ Wojcicki）拥有的车库里。他们获得了来自太阳系统创始人安迪·贝托尔斯姆（Andy Bechtolsheim）的首笔资金，这笔钱源自斯坦福大学一项由 ARPA\
  \ 资助的 70 年代计算机研究计划。在最初的小投资之后，两家强大的风险投资公司 `Sequoia Capital` 和 `Kleiner Perkins` 又投入了\
  \ 2500 万美元资金。\n\n布林和佩奇感到无比高兴。资金充裕的这对年轻企业家雇佣了几个来自斯坦福数字图书馆计划的同事，并将精力投入到改进仍处于初级阶段的\
  \ Google 搜索引擎中。\n\n\n\n\n从 `Lycos` 到 `Yahoo!`，从 `AltaVista` 到 `AOL`，所有早期的搜索引擎公司都意识到自己正坐在一个新颖且神奇的宝山上。“人们来到我们的服务器并留下轨迹。我们每天都能确切地看到人们在互联网上认为什么是重要的，”`Yahoo!`\
  \ 的首位 CEO Tim Koogle 说，“网络的核心在于连接……我们坐落在中间，连接着人们。”`Yahoo!` 试图利用数据来洞察消费者需求，但其工程师们仅仅触及了他们积累的宝贵数据的表面。`Google`\
  \ 的搜索日志也大同相同。将该公司从大众脱颖而出的，是 Page 和 Brin 在挖掘和变现数据足迹时所带的精密度和进取精神。\n\n起初，`Google` 团队专注于挖掘用户行为以改进搜索引擎，以便更好地猜测用户意图。“如果人们输入某些内容然后去更改查询词，你就能看出他们不满意。如果他们点击结果的下一页，说明他们不满意。你可以利用这些人们对我们提供的内容感到不满的信号，回去研究这些案例并寻找改进搜索的地方，”一位\
  \ Google 工程师解释道。通过研究日志中的模式，`Google` 工程师将用户行为变成了一个众包免费劳动力系统。它像一个反馈循环，教会搜索引擎变得更“聪明”。自动建议拼写检查功能让\
  \ `Google` 能够识别出人们使用语言时细微但重要的特征，从而猜测人们输入内容的含义，而不仅仅是文本与文本匹配。“今天，如果你输入‘Gandhi bio’，我们知道‘bio’意味着‘传记’。如果你输入‘bio\
  \ warfare’，它就意味着‘生物（武器）,’”另一位 Google 工程师解释道。\n\nSteven Levy 是一位资深科技记者，他的职业生涯早期曾在\
  \ 20 世纪 80 年代 Stewart Brand 的 *Whole Earth Software Catalog* 供职过，他获得了前所未有的内部访问权限来撰写\
  \ `Google` 的历史。结果就是《谷歌帝国》（*In the Plex: How Google Thinks, Works, and Shapes Our\
  \ Lives*），这是一个关于 `Google` 走向统治地位的、崇高但极具信息量的故事。这本书证明，Page 和 Brin 早就意识到，`Google` 的成功取决于获取并维持对通过其服务捕获的行为数据的专有控制。这是该公司最大的资产。“多年来，`Google`\
  \ 将日志中的数据作为其搜索引擎进化的关键，”Levy 写道，“它还将将这些数据应用于公司开发的几乎每一个其他产品中。它不仅会注意已发布产品中的用户行为，还会在无数实验中衡量此类行为，以测试新想法和各种改进。`Google`\
  \ 的系统学得越多，就能在搜索引擎中构建出更多新信号，以更好地确定相关性。”\n\n提高 `Google` 的易用性和相关性有助于它成为互联网上最流行的搜索引擎。到\
  \ 1999 年底，该公司每天平均处理 700 万次搜索，比上一年增长了约 70,000%。现在 `Google` 主导了市场，是时候挣钱了。公司并没有花多久就找到了门路。\n\
  \n2000 年，在搬到山景城（Mountain View）的新校区后不久，Page 和 Brin 推出了 `AdWords`。这是一种定位系统，允许 `Google`\
  \ 根据查询词显示广告。它简单但有效：`AdWords` 在正确的时间显示正确的广告。随着时间的推移，`Google` 的广告收入从 2001 年的 7000\
  \ 万美元飙升到 2004 年的 31 亿美元。`AdWords` 最初非常初级，但 `Google` 对意图越了解，就能越有效地将用户与相关广告配对。滚动的查询词对\
  \ `AdWords` 至关重要。`Google` 从用户行为中学习得越多，用户点击的机会就越大。在接后的几年里，`Google` 对数据产生了饥渴。“日志就是钱，”Edwards\
  \ Explain 道，“Larry 永远不喜欢那个滚动查询屏幕。他不断监控公众的焦虑情绪……而滚动查询词引发了他的警觉。”\n\n确实，钱开始从天而降。2001\
  \ 年，`Google` 聘用了 Sheryl Sandberg，她曾担任总统总统财政部长的幕僚长。她被负责开发和运营广告业务，她的表现超出了人的预期。这就像炼金术：`Google`\
  \ 正在将废料变成黄金。\n\n# 烤肉\n\n当 Google 工程师从不断增长的用户中榨取个人信息时，高管担心运营中的任何微小披露都可能引发致命的公关危机。Page\
  \ 特别意识到，如果人们了解他们使用搜索的方式，`Google` 可能会失去用户。保护这一秘密成了公司的基石政策。\n\nPage 对披露任何信息都极其偏执。由于他的坚持，公司的隐私政策保持得模糊且简短，Douglas\
  \ Edwards 在《我感觉幸运》（*I’m Feeling Lucky*）中回忆道。“Larry 拒绝与公众讨论隐私问题总是让我感到沮丧。我坚信，我们可以从基础信息开始，建立一个信息中心，诚实地说明用户在\
  \ Google 或任何其他搜索引擎上输入查询时所做的权衡，”他写道，“真正关心的人会看到我们是透明的。即使他们不喜欢我们对收集或保留数据的政策，他们也会知道那是什么。如果他们去其他地方搜索，他们面临的风险是我们的竞争对手的做法可能比我们糟糕得多。”\n\
  \n\n\n\n讽刺的是，一个陷入挣扎的互联网巨头为公众提供了一个罕见且无意的机会，让他们窥见了搜索引擎在搜索日志中存储的这类私密数据。2006 年 8 月，史前网络服务供应商巨头\
  \ `AOL` 向公共领域发布了几个 GB 大小的匿名化搜索日志：其中包括其 657,000 名客户在三个月内进行的 2000 万次搜索查询。这些搜索结果由 `Google`\
  \ 提供，`Google` 拥有 `AOL` 5%的股份并运行着该公司的搜索引擎。\n\n公司层将这些日志视为一种丰厚但不稳定的资产，一旦公开，将威胁到公司的核心业务。`AOL`\
  \ 的一个研究小组却有不同意见：他们以促进社会研究的名义，将这批日志作为一项善举发布。对于公众来说，这确实是一件善举。但对于 `AOL` 以及其延伸出的 `Google`\
  \ 来说，这些日志是一场公关灾难，它们揭露了作为搜索经济赖基的大规模化、系统性的隐私侵犯。\n\n面对骚动，`AOL` 声称其工程师通过用随机数字替换个人身份识别的用户账户信息，对日志进行了匿名处理。但记者们很快发现，只需六次搜索就能轻松地反向破解用户身份。其中一个用户——在日志中标记为\
  \ `4417749`——被两个进取十足的*纽约时报*记者轻易揭开了身份，她是佐治亚州农村的一位慈祥的老年女性：\n\n编号 `4417749` 的用户在三个月内进行了数百次搜索，主题范围从“手指麻木”到“60\
  \ 个单身汉”，再到“在处处撒尿的狗”。随着每一次搜索、每一次点击，`AOL` 用户 `4417749` 号的身份变得变得越来越容易辨认。查询内容包括“佐治亚州利尔伯恩的景观园艺师”、几位姓\
  \ Arnold 的人，以及“佐治亚州温尼特县沙影湖小区售出的房屋”。不需要花费多少精力调查，就能顺着这些数据线索追踪到特尔玛·阿诺尔德（Thelma Arnold），这位\
  \ 62 岁的寡妇住在佐治亚州利尔伯恩，她经常研究朋友的病状况，并热爱她的三只狗。\n\n`AOL` 的日志数据还揭示了其他内容。许多搜索查询极其私密、羞耻、令人不安，甚至可能带有犯罪证据。在对餐厅、电视节目和数码相机评论等平庸话题的搜索之间，还穿插着对疾病的搜索，以及关于“被强奸后的早晨”该怎么办的建议；在某些情况下，查询内容显示某些不稳定个体正处于采取暴力和危险行为的边缘。为了充分理解这些已公开搜索的个人性质，这里有一份原始日志样本：\n\
