  \n### 157. Tony Fadell 是一位前苹果高管、连接设备专家，现担任 Larry Page 的私人顾问。他描绘了一个未来的愿景：Google 的技术将仁慈地统治并调解世界上每一个人每个人。“未来的互联网将无处不在，无所不在。它将利用海量数据来增强我们自身的智能。它并将帮助我们做出更好的决定——从避免危险的药物相互作用到诊断疾病，再到决定何时滑水可能不是最好的主意……最后，未来的互联网将从在我们要求*时*做某事，转变为在我们要求*之前*就做好某事。”随后，他讲述了一个自己在滑水时撕裂腿筋绳肌的故事，以此说明无处不在的\
  \ Google 如何被用于预测和防止伤害。“在我滑水事故中，我的智能手机可以结合现有信息……预测出我正在考虑滑水，计算我受伤的概率，并在我下水之前建议我不要这样做。或者，如果我足够固执非要做，一台控制船只油门的电脑可以防止引擎拉得我太用力。”在这个超连接的未来，谁来制定规则和法律？人们如何让自己的声音被听到？谁拥有所有那些传感器和控制器？Fadl\
