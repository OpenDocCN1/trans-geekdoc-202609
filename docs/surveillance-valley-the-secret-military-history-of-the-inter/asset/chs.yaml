  \ Armer）在 1976 年关于监控技术的国会听证会上解释道。“相反，它们的开发初衷是为了其他动机，例如改进业务数据处理、引导导弹或将人类送上月球。但监控是一项信息处理任务，正如薪资发放应用是一项任务一样。如果你提高了薪资发放信息处理技术的效率，你就提高了监控的效率。通常，出于其他原因而建立的系统……也可以为监控服务。”《监控技术》，美国参议院司法委员会宪法权利子小组会议与商业委员会科学、技术和商业特别子小组会议的联合听证会，第\
  \ 94 届议会，第 1 次会期（1975 年 6 月 23 日，9 月 9 日及 10 日）。\n\n### 60. 电子隐私信息中心（EPIC）作为 Google\
  \ 最激进的批评者之一出现，它担心 Google 并未将其电子邮件监控仅限于其注册用户群，而是拦截并分析了任何与 Gmail 用户交换电子邮件的人的私密通信。随着\
  \ Gmail 使用量的激增，这意味着 Google 正在监控全球很大比例互联网人口的电子邮件通信。“Gmail 违反了非订阅者的隐私权。向 Gmail 用户发送电子邮件的非订阅者，其电子邮件被执行了‘内容提取’，尽管他们并未同意对其通信进行监控，他们甚至可能不知道自己的通信正在被分析，”EPIC\
  \ 警告道。该机构指出，这种做法几乎肯定违反了加利福尼亚州的窃听法，该法律明确规定在未经所有参与方同意的情况下拦截电子通信属于犯罪。由于 Google 拦截任何向\
