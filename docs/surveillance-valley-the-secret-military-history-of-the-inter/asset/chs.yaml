  \ 5 人的**笔录》，《连线杂志》（*Wired*），2015 年 2 月 2 日；“乌尔里希特日志”，文档 121–1，`SA-38` 至 `SA-42`。在一名用户告诉“海盗彼特·罗伯茨”（即罗斯·乌尔里希特）他已经破解了丝绸之路并获取了该网站每个用户的联系方式，并威胁说如果不付钱就泄露这些信息后，海盗彼特·罗伯茨与“地狱天使”（Hells\
  \ Angels）——丝绸之路的主要药物供应商——会面，并发布了多次处决令。这些信息是在一次联邦审判中披露的，审判显示海盗彼特·罗伯茨最终支付了地狱天使 73\
  \ 万美元来杀掉总共六个人（勒索者及其同伙），尽管并不清楚这些谋杀是否真的被执行。丝绸之路的创始人确实批准并支付了这些谋杀费用；一些记者推测，这实际上是一个向他勒索钱的骗局。参见：乔·穆林（Joe\
