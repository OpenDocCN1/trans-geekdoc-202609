  \n\n从这个意义上说，Gmail 开启了行为追踪和画像全新维度：它记录了个人和商务通信、私人文件、明信片、度假照片、情书、购物收据、账单、医疗记录、银行对单、学校记录以及人们通过电子邮件发送和接收的任何内容。谷歌声称\
  \ Gmail 将受益，允许公司向他们展示相关的广告，而不是用垃圾邮件淹没他们。\n\n并不是所有人都这样看问题。\n\n### 隐私担忧与早期批评\n\n在\
  \ Gmail 公开发布不到一周，由世界隐私论坛（World Privacy Forum）领导的 31 个隐私和民权组织发表了一封致谢尔盖·布林（Sergey\
  \ Brin）和拉里·普奇（Larry Page）的公开信，要求他们立即停止这项电子邮件服务。“谷歌提议扫描所有传入邮件的文本以投放广告。对机密邮件的扫描违反了电子邮件服务提供者的内含信任，”这些组织写道，“谷歌可以在明天——通过选择或法院命令——将其扫描系统用于执法执法目的。我们注意到，在最近的一个案例中，美国联邦调查局（FBI）获得了一个法院命令，强制一家汽车导航服务将其系统转换为监控车内对话的工具。还要多久，执法部门就会迫使谷歌陷入类似的境地呢？”\n\
  \n在此之前对谷歌几乎没有过任何负面评价的媒体也转变为批评态度。该公司因其“毛骨悚然”的邮件扫描遭到了记者的指责。加拿大麦克林杂志（Maclean’s）的一位记者讲述了她使用\
  \ Gmail 定向广告系统的经历：“我最近发现，当我用 Gmail 账户给朋友写邮件时，广告竟然是多么相关。我的信中提到了一个丈夫出轨的孕妇。谷歌的广告并没有推送婴儿用品和育儿书籍。相反，Gmail\
  \ 读懂了在这种情况下‘怀孕’并不是一件好事，因为它与‘出轨’一词结合在一起了。因此，它提供了私家侦探和婚姻治疗师的服务。”\n\n向被背叛的母亲展示间谍服务的广告？对于一家仍然披着进步的‘勿作恶’（Don’t\
  \ Be Evil）形象的公司来说，这可不怎么体面。\n\n### 画像分析的技术机制\n\n由于拉里·普奇对让隐私‘从牙膏管里挤出来’的偏执，面对批评，谷歌对其邮件扫描程序的内部运作一直守口如瓶。但该公司当年提交的一系列画像和定向广告技术专利，让人一窥了\
  \ Gmail 如何融入谷歌的跨平台追踪和画像系统。这些专利揭示了所有的邮件通信都会受到分析并解析以获取含义；使用第三方数据库以及存储在用户 Gmail 通讯录中的联系信息将姓名与真实身份和地址进行匹配；提取了人口统计和心理学数据，包括社会阶层、性格类型、年龄、性别、个人收入和婚姻状况；抓取了邮件附件中的信息；甚至一个人的美国居留状态也被确定了。所有这些内容随后都会被交叉引用，并与通过谷歌搜索和浏览日志以及第三方数据提供者收集的数据相结合，添加到用户画像中。这些专利明确表示，这种画像并不限于注册的\
  \ Gmail 用户，而是适用于任何向 Gmail 账户发送邮件的人。\n\n综合来看，这些技术文件揭示了该公司正在开发一个平台，试图追踪并刻画每一个接触过谷歌产品的人。从本质上说，这是一套复杂的私人监控系统。\n\
  \n### 根源于反叛叛\n\n它还有另一种特质。专利文件中的语言——对使用‘心理信息’、‘性格特征’和‘教育水平’来刻画和预测人们兴趣的描述——与 20 世纪\
  \ 60 年代和 70 年代由美国国防高级研究计划署（ARPA）资助的早期数据驱动反叛计划有着诡异的相似之处。那时，该机构尝试绘制反叛部落和政治团体的价值体系和社会关系地图，旨在隔离他们造反的因素，并最终利用这些信息建立预测模型，在叛乱发生前将其阻止。被中止的‘驼座计划’（Project\
  \ Camelot）就是一个例子。另一个是 J. C. R. 莱克莱德（J. C. R. Licklider）和伊西尔·德·索拉·池（Ithiel de Sola\
  \ Pool）1969 年的 ARPA 剑桥项目，旨在开发一套计算机工具，允许军事研究人员利用复杂数据建立预测模型，包括‘不同国家的政治参与’‘协会成员’‘青年运动’以及‘农民的态度和行为’等因素。\n\
  \n剑桥项目是底层技术的尝试。三十年后出现的谷歌预测系统比 ARPA 粗糙的第一代数据库工具更先进、复杂。但它也非常相似。公司想要摄取搜索、浏览历史和邮件数据，以构建能够猜测用户未来兴趣和行为的预测画像。唯一的区别在于：谷歌不是为了防止政治叛乱，而是想通过数据通过广告向人们销售产品和服务。一个是军事的，另一个是商业的。但从核心来说，两个系统都致力于画像和预测。\n\
  \n### 军事与商业画像\n\n加州大学伯克利分校法律教授、信息隐私法专家克里斯·霍夫纳格（Chris Hoofnagle）在加州参议院辩证道，军事画像与商业画像之间的区别是幻觉的。他将谷歌的邮件扫描与国防高级研究计划署（DARPA）当时活跃的‘全信息意识’（TIA）项目的监控和预测项目相对比，这是一种预测性执法技术，最初由\
  \ DARPA 资助，在 9·11 恐怖袭击后交给了国家安全局（NSA）。\n\n在 Gmail 发布一年后，霍夫纳格在加州参议院司法委员会举办的关于电子邮件和隐私的听证会上作了证。“计算机可以批量查看交易和内容数据并得出结论的前景，是约翰·波德克斯特（John\
  \ Poindexter）的‘全信息意识’计划的内容，”他提到，这位曾在乔治·W·布什总统任内担任国家安全顾问的人，被负责帮助 DARPA 反击恐怖主义。“TIA\
  \ 提议查看大量的个人信息并为预防恐怖主义或一般犯罪做出推断。国会否决了波德克斯特的计划。谷歌的内容提取与 TIA 的不同在于，它的设计目的是推销广告，而不是抓住罪犯。”对于霍夫纳格来说，谷歌的数据挖掘在技术上与政府的做法非常相似；它是相同行为的私有化版本。他预测\
  \ Gmail 收集的信息最终会被美国政府利用。这是显而易见的。“允许从电子邮件中提取这些内容，可能对隐私产生深远影响。首先，如果公司可以查看私人信息来推销广告，在华盛顿经常能听到政策专家问：‘如果信用卡公司可以分析你的数据来卖你的麦片，为什么\
  \ FBI 就不能挖掘你的数据来打击恐怖主义呢？’”\n\n\n\n\n\n专利中的语言强调了 Hoofnagle 的批评，即商业技术与军事技术之间几乎没有区别。它将话题带回了\
  \ 20 世纪 70 年代的恐惧，当时计算机和网络技术刚刚开始普及。那时，人们普遍认为计算机是为间谍活动制造的机器：收集用户数据进行处理和分析。无论是股市数据、天气、交通状况，还是个人的购买历史，无一例外。\n\
  \n对于电子隐私信息中心（Electronic Privacy Information Center）来说，`Gmail` 带来了伦理和法律的双重挑战。该机构认为\
  \ Google 截获私人数字通信是对加利福尼亚州窃听法的潜在侵犯。该机构呼吁州检察长对该公司进行调查。\n\nGoogle 的第一个政治挑战来自一个出人意料的来源：加州州参议员\
  \ `Liz Figueroa`，她的选区跨越了硅谷的一片巨大区域，包含了位于山景城的 `Google` 总部。对 `Google` 扫描电子邮件感到不安，这位参议员引入了一项法案，禁止电子邮件提供者收集个人身份信息，除非他们获得邮件对话中所有方的明确同意。她的办公室将其描述为互联网时代的开创性隐私法：“全国首项立法将要求\
  \ `Google` 在扫描电子邮件以进行针对性广告之前，获得每个个人的同意。\n\n`Figueroa` 参议员在 2004 年 4 月 21 日宣布该法案时解释道：“告诉人们他们向医生、朋友、爱人和家人表达的最亲密、最私密的邮件想法只是另一种直接营销商品，这并不是促进电子商务的方法。至少在一个人最亲密、最私密的思想转化为\
  \ `Google` 的直接营销机会之前，`Google` 应该获得每个人的知情同意。”\n\n拟议的法律让 `Page` 和 `Brin` 陷入了恐慌。正当两人准备公司上市时，他们面临着威胁到其商业模式的立法。获得人们的同意——提前告知\
  \ `Google` 以这种侵入性的方式追踪他们及其一举一动——这对 `Page` 来说是一个噩梦般的场景，即公开披露公司的数据收集做法；这可能会引发一场公关灾难，甚至更糟。\n\
  \n`Google` 高层建立了一个“战争室室”来应对日益雪崩而来的批评声。`Brin` 指挥了这项工作。他对 `Google` 的批评者非常愤怒：他们是无知的；他们不懂技术；他们对一切一无所知。“混蛋，都是混蛋！”他大喊道。`Page`\
