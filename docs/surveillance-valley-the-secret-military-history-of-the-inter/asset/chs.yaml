  \ 该机构对这种技术的需求有着直接经验。在越南，许多战场项目依赖于远距离数据传输。曾有一个名为“白色冰屋”（Igloo White）的项目，这是一个雄心勃勃，试图通过在胡志明小路上创建一个连接无线地震传感器和麦克风的计算机网络，对战场进行“植入”并探测敌方行动。此外，还有多个\
  \ ARPA 项目通过遥控直升机运行——即我们现在说的无人机。到 1968 年，已有几种型号在战斗中接受测试。其中一种型号是从海军舰上发射的潜艇猎杀者，装备了声纳和鱼雷。另一种型号是为丛林任务设计的，配备了夜视设备和多种武器配置：火神炮、导弹、榴弹发射器和集弹弹发器。无人机的实时视频信号中继到安装在陆军吉普车上的移动控制站，并提供用于呼叫轰炸机打击的侦察信息（F.\
  \ A. Tietzel, M. R. VanderLind, and J. H. Brown）。\n\n\n\n\n\n### 11. 本章深受弗雷德·特纳（Fred\
  \ Turner）开创性工作的影响和启发，他的工作探讨了军事与工业界之间的联系，这种联系催生了 20 世纪 60 年代的互联网和嬉皮士文化。特纳是斯坦福大学传播系的教授。我建议任何想要更好地理解支撑当今许多互联网文化的乌托邦思想的人，去读他那本精彩的著作——`从反文化到网络文化：斯图特·布兰德、全地球网络与数字乌托邦主义的兴起`。它非常清楚地表明，我们认为的新发展实际上是源自\
  \ 20 世纪 60 年代的旧想法观念。事实上，从这个意义上说，互联网文化与美国当代文化的其他部分并没有区别。\n\n### 12. 引用自弗雷德·特纳，《从反文化到网络文化：斯图特·布兰德、全地球网络与数字乌托邦主义的兴起》（芝加哥：芝加哥大学出版社，2006\
