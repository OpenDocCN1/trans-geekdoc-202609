  \ 71\n* 扎克伯格, Mark, 195\n\n![](img/Art_P374.jpg)\n\nPublicAffairs 是一家成立于 1997 年的出版社。它向三位人物的标准、价值观和风采致敬，他们曾是无数记者、作家、编辑以及各类出版人士（包括我在内）的导师。\n\
  \n`I.F. STONE` 是 `I. F. Stone’s Weekly` 的主，他将对第一修正案的承诺与创业热情和报道技巧相结合，成为美国历史上最伟大的独立记者之一。在八十岁时，Izzy\
  \ 出版《苏格拉底审判》，这本书是全国性的畅销书。他在自学了古希腊语后写了这本书。\n\n`BENJAMIN C. BRADLEE` 在近三十年里一直是《华盛顿邮报》充满魅力的编辑领。是\
  \ Ben 赋予了《邮报》追踪水水门事件等历史性问题的深度和勇气。他以一种坚韧支持他的记者，使他们无所畏惧，许多人成为富有影响力的畅销书的作者，这绝非偶然。\n\
  \n`ROBERT L. BERNSTEIN` 担任兰登书屋执行官超过二十五年，指导了这家国家顶尖出版社之一的发展。Bob 亲自负责许多挑战全球暴政的政治异见和论辩书籍。他还是人权观察组织的创始人兼长期主席，该组织是世界上最受推崇的人权组织之一。\n\
  \n![](img/Art_P374a.jpg)\n\n五十年来，Public Affairs Press 的旗帜由其所有 Morris B. Schnapper\
  \ 秉持，他出版了甘地、纳赛尔、汤因贝、杜曼以及约 1500 多位作者的作品。1983 年，《华盛顿邮报》将 Schnapper 描述为“令人敬畏的刺头虫”。他的遗产将在未来的书中一直延续下去。\n\
