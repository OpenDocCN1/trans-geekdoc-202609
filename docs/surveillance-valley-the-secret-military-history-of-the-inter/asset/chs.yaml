  \n123. OTF 项目吸引了来自世界各地的参与者：南北美洲、欧洲、亚洲、非洲。他们自称为各种身份：技术人员、研究人员、密码学家、政治科学家和活动人士。他们中的许多人看起来很酷前卫，戴着耳钉，留着奇特的发型和脏辫，并在网上像水手一样咒骂。受\
  \ OTF 赞助的活动人士谈论社会正义的语言——为自由而战、保护弱势群体——但他们的项目与美国的外交政策目标一致。中国、伊朗、俄罗斯和白俄罗斯会在这些项目中出现，而沙特阿拉伯和阿拉伯酋长国等美国威权盟友则明显缺席。“会士，”开放技术基金，访问于\
