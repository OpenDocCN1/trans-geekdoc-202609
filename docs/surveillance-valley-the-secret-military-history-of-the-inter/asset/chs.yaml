  \ 页。\n\n\n\n\n\n### 46. 埃文参议员的*军队对平民的监视：文献性分析*报告在多处提到，缺乏证据表明军队销毁了其监视文件，也有证据显示数据被刻意保留：“许多记录无疑已被销毁；许多其他记录无疑被藏起来了……在随后的两次机会中得知，情报司令部未能执行销毁其关于非武装部队平民计算机文件的指令……销毁肖照本的命令于\
  \ 1970 年 2 月 18 日发布，但截至 1970 年 8 月 26 日，报告销毁的比例不到一半……在反情报分析分部，该指令被解释为允许在销毁办公室副本之前对《汇编》进行微胶摄影”（v-8）。三年后，埃文参议员引入了一项禁止国内军事监视的法案。这项拟议法律旨在彻底解决这个问题，但遭到了五角大楼的激烈反对。尽管得到了广泛的跨党支持，它从未通过过一读。到那时，公众的注意力已经转移。军队监视丑闻已成为旧闻，被水门事件调查所掩盖。保罗·J·谢普斯，*联邦军事力量在国内动乱中的作用，1945–1992*（华盛顿特区：美国陆军军事历史中心，2012），398。\n\
