  \n\n\n\n\n## 70. 以查尔斯·穆里（Charles Murray）为例，他是一位年轻的研究员，曾为位于泰国的美国研究院（AIR）负责 ARPA 的反叛乱计划（Eric\
  \ Wakin，*人类学走向战争：泰国的职业伦理与反叛乱* [威斯康星州麦迪逊：东南亚研究中心，1998 年]）。他在泰国农民起义经历影响了他一生的思想。他深信“胡萝卜”远没有“大棒”有效：社会计划——如修建道路、建立诊所和提供工作等旨在“收买”人心的措施——根本不起作用。但是，严厉的、惩罚性的措施却有效（Jason\
  \ DeParle，“大胆的研究还是‘社会科学色情’？：查尔斯·穆里”，《纽约时报》，1994 年 10 月 9 日）。他将这种逻辑应用于美国，解决黑人贫民窟社区所面临的艰难社会经济问题。减少贫困和市中心犯罪——这些不是通过福利和社会计划就能解决的问题。事实上，政府为为支持和引导人们向正确方向发展所做的任何努力都是徒劳的；它们反而适得其反：只会助长那些他们想要遏制的行为。因此，穆里建议采取相反的办法：更严厉的监禁刑和惩罚性的零容忍措施来威慑犯罪，并取消所有政府社会计划，包括食品券、福利和社会保障养老金制度（《监狱是对青少年犯者的最佳治疗》，美联社，1979\
  \ 年 11 月 1 日，`https://surveillancevalley.com/content/citations/prison-best-treatment-for-juvenile-offenders-associated-press-1-november-1979.png`；查尔斯·A·穆里和路易斯·A·柯克斯\
  \ Junior，《青少年矫正与慢性犯罪犯》 [华盛顿特区：美国研究院，1979 年 3 月]）。如今，穆里是一位自由意志主义政治政治学家，也是里根时代最具影响力的思想架构师之一。他最广为人知的作品是《种族曲线》（*The\
  \ Bell Curve*），这是一部充满争议的畅销书，它推崇种族优生学理论，并声称白人和亚洲人在智力上遗传优于黑人和拉提人。但他最持久的成就是为比尔·克林顿总统的《个人责任与工作机会法》提供了知识支持。该法案于\
  \ 1996 年签署实施，结束了美国传统的联邦福利，以激励人们就业。该法律特别强调通过削减单身妈妈的福利来减少贫困，其理念是福利激励了他们生育，从而导致贫困的延续。这是一个残酷的举措，而且像在越南测试的许多研究一样，它未能实现既定目标。这些改革不仅没有减少失业和缓解贫困，反而让少数裔社区陷入了更深的痛苦和贫困之中（蒂莫西·凯西和劳里·马尔多纳多，《最贫困的：美国单亲家庭》\
  \ [纽约：Legal Momentum，2012 年 12 月]）。\n\n## 71. 米克尔·麦克林托克（Michael McClintock），*国家治术工具：美国游击战、反叛乱与反恐怖主义，1940–1990*（纽约：Pantheon\
