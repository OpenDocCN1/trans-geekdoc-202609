  \n\n## 102. 电子前沿基金会（EFF）由 Lotus Notes 创始人米奇·卡普尔、牧场主及感恩之死作词人约翰·佩里·巴洛罗，以及 Sun 系统的早期员工约翰·吉尔摩共同创立。它的初衷相当模糊：在互联网上维护人们的公民自由，并在数字时代“找到一种保留\
  \ 1960 年意识形态的方法”。从第一天起，EFF 就拥有雄厚的资金，并拥有一份令人印象的名单：斯华特·布兰和苹果公司的史蒂夫·沃兹尼亚克是董事会成员，而新闻宣传由凯西·库克负责，她曾为史蒂夫·乔布斯做公关。没过多久，EFF\
  \ 就找到了了自己的使命：代表源自 NSFNET 网络的新兴互联网服务提供商向国会游说，并推动私有化互联网系统，让政府基本不干涉——EFF 的巴洛罗将其描述为“设计未来的网络”。\n\
