  \n### 8. Jacob Appelbaum 对 Tor 员工拿五角大楼资金进行了一番奇怪且漫漫的辩护，并断然地表示他绝不会接受 CIA 的钱。这就是他划定底线的地方。有趣的是，本章后面揭示的信息显示，Tor\
  \ 的大部分资金来自由 CIA 创建的机构。“我觉得我们有时接受国防部的资金这很糟糕，”Appelbaum 在 2014 年 12 月说道，“而且有时我觉得，当人们有能力自养其生、拥有家和家庭时，是好的。现在，我真的没有这些东西。我的意思是，我可以养活自己。但我并不像\
  \ Tor 内部的人们那样拥有家或家庭。而他们需要获得报酬。事实确实是如此。这引发了问题。我个人绝不会接受 CIA 的钱，我不认为应该人应该接受。我不认为 CIA\
  \ 应该存在。”Dingledine, Appelbaum, 和 Poitras，“洋葱的现状（State of the Onion）”。\n\n### 9.\
  \ “有人找过我们做这类事情，而这是整个 Tor 社区支持的一项严肃承诺，即我们永远永远不会留下后门，”Jacob Appelbaum 在 2013 年的一次演讲中说道，并讲述了一个关于司法部曾试图但未能成功让\
  \ Tor 为联邦政府接入网络的故事。Roger Dingledine 和 Jacob Appelbaum，“Tor 网络：我们生活在有趣的时代”，30c3，2013\
