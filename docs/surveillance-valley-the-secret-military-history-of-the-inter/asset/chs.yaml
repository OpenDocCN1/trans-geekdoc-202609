  \ 年 8 月 5 日）。事实上，广播节目经常被用于支持针对目标国家的军事行动。猪肉湾事件发生前和期间，曾通过广播宣传号召古巴人起义推翻他们的政府。根据蒂姆·维纳（Tim\
  \ Weiner）的 CIA 历史著作《灰烬岁月》（*Legacy of Ashes*），CIA 支持的危地马拉拉政变也得到了广播的支持。“从 1954 年五一节开始，连续四周，CIA\
  \ 通过一个名为‘解放之声’的私设电台在危地马拉拉开展了心理战，该电台由一名 CIA 合同官员、业余演员兼高练的剧作家大卫·阿特利·菲利普斯（David Atlee\
