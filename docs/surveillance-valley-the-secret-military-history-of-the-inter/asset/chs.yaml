  \ 世纪 70 年代后期建立的平台网络（Platform Network）。根据 BBN 华盛顿办公室管理网络项目的埃里克·埃尔萨（Eric Elsam）的说法，这两个系统多年来一直为情报机构提供定期的数据通信服务”（出自\
