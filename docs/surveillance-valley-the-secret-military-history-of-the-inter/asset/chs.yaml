  \n“当然算，”她回答道。\n\n但 `Sergey` 坚持认为：“不，不算。什么都没有被留存。没人知道这件事。”\n\n“那个机器人读了一切。那个机器人知道我是在难过还是在感到恐惧，或者正在发生什么吗？”她回答道，依然强硬且不愿妥协。\n\
  \n`Brin` 直视着她，隐晦地回答道：“噢，不。那个机器人知道比这多得多。”\n\n当 `Brin` 试图说服参议员失败后，公司请来了一支高水平游说客和公关人员团队来润色信息并恢复\
  \ `Google` 的正直形象。走在前面的是 `Andrew McLaughlin`，这位圆滑且面带微笑的公关策略师后来担任了 `Barack Obama`\
  \ 总统副副技术官。他非常清楚如何化解这位参议员：`Al Gore`。“我动员了大阿尔尔，”他后来吹嘘道。在 2000 年总统大选中中败给 `George Bush`\
  \ 后，副总统 `Gore` 转入了一份丰厚的科技资本家职业。作为其中的一部分，他接受了 `Google` 担任“虚拟董事成员”的邀请。现在，在 `McLaughlin`\
  \ 的请求下，`Gore` 将参议员接到他在旧金山的丽思卡尔酒店套房。在那里，`Gore` 利用他的权力解决了 `Google` 的问题。“他太不可思议了，”`McLaughlin`\
  \ 回忆道，“他站给她上了一堂关于算法的讲座。”（注：由于原文后部分存在大量重复段落，此处已按要求处理翻译逻辑）\n\n\n\n\n这家公司的名称让人们想到菲利普·K·迪克的著作*少数报告*，但这家公司本身却拥有着令人惊叹的成功率：在至少一个部署了它的城市中，它将犯罪率降低了多达\
  \ 25%。它的工作原理是吸收数十年的犯罪数据，并将其与当地环境数据相结合——例如酒类商店的位置、学校、高速公路入口等因素——然后将所有变量通过一种专利算法，生成犯罪分子下一次最可能作案的热点区域。\n\
  \n“它是根据某种预测地震的东西改编和修改的，”布兰廷汉（Brantingham）在我们喝咖啡时边解释道，“如果你考虑到洛杉矶和地震，对于发生的任何地震，你实际上可以很好地从因果关系上界定它的来源。当这些断层之一发生地震后，会产生余震，这些余震发生在主震附近，且时间接近。”\n\
  \n“犯罪也是完全一样，”他继续说道，“我们的环境中有很多建筑特征，它们是犯罪的产生器，而且这些地方不会消失。一个很好的例子是高中。大多数情况下，高中是不会消失的。它是环境中的一种建筑特征。而高中有什么呢？大量\
  \ 15 到 17 岁或 15 到 18 岁的年轻人，无论你去地球的哪里，15 到 17 岁的青少年都会陷入麻烦。他们确实会。这种情况将永远存在，因为由于睾酮、女孩或其他什么原因。这是我们的灵长类遗传基因。”\n\
  \n我挠了挠，点头表示赞同。这对我来说仍然没什么道理。难道人不必考虑到人类具有自由意志这一事实吗？难道他们不应该反抗被对待像巨大的、剧烈摩擦的漂浮熔岩岩块吗？除了简单的基础设施之外，犯罪难道没有更深层次的社会政治原因——比如贫困和药物成瘾之类的问题？关于高中和孩子本性的话题，除了刑事化和集中警务，难道不应该其他处理青少年麻烦制造的方法吗？\n\
  \n布兰廷汉反驳说，`PredPol` 并不试图修复社会，只是帮助警察预防犯罪。“PredPol 并不是为了对抗犯罪的根源，”他说，“PredPol 的核心在于为那些警员提供工具，让犯罪更难发生，而不是在说我们不需要解决冰毒成瘾问题。我们确实需要解决冰毒成瘾。”简而言之：必须由其他人通过处理犯罪的根源社会和经济原因来完成改善社会的艰难工作。`PredPol`\
  \ 仅仅致力于帮助警察更有效地遏制现有的混乱局面。\n\n2014 年，`PredPol` 是许多竞争新兴但快速扩张的预测性警务技术市场的公司之一。像 `IBM`、`LexisNexis`\
  \ 和 `Palantir` 这样大型且老牌的公司都提供了预测犯罪产品。`PredPol` 虽然规模较小，但与全各地的警察部门签了合同：洛杉矶；佛里达州中部的橙县；宾夕法尼亚州的读取；华盛顿州的塔科马。当地报纸和电视节目非常喜欢\
  \ `PredPol` 的故事：这是资金紧张的警察部门一直以求的高科技奇迹药方。它使执法人员能够低成本降低犯罪。以……的价格定价，`PredPol` 是许多竞争新兴但快速扩张的预测性警务技术市场的公司之一。\n\
  \n预测性警务是许多竞争新兴但快速扩张的预测性警务技术市场的公司之一。像 `IBM`、`LexisNexis` 和 `Palantir` 这样大型且老牌的公司都提供了预测犯罪产品。`PredPol`\
  \ 虽然规模较小，但与全各地的警察部门签了合同：洛杉矶；佛里达州中部的橙县；宾夕法尼亚州的读取；华盛顿州的塔科马。当地报纸和电视节目非常喜欢 `PredPol`\
  \ 的故事：这是资金紧张的警察部门一直以求的高科技奇迹药方。它使执法人员能够低成本降低犯罪。以……的价格定价，`PredPol` 是许多竞争新兴但快速扩张的预测性警务技术市场的公司之一。\n\
  \n\n\n\n# 数据版图\n\n互联网就像一个巨大的、看不见的团块，吞噬了现代世界。无处可逃，正如 Page 和 Brin 在推出 `Google` 时所敏锐洞察到的那样，人们在网上做的的一切活动都会留下数据足迹。如果能正确地保存和使用，这些痕迹就构成了一个信息金矿，不仅包含了对个人层面的深刻洞察，还成为研究宏观文化、经济和政治趋势的价值读物。\n\
  \n`Google` 是第一家充分利用这种洞察力并根据人们留下的数据建立业务的互联网公司。但他们并没有孤单多久。技术上的某种进步推动了其他公司朝着同样的方向发展。这种情况几乎发生在每个地方，从最小的\
  \ App 到最庞大的平台。\n\n## 数据驱动的商业模式\n\n`Netflix` 监控人们观看电影以推荐其他电影，同时也用于指导内容许可和新节目的制作。源自芬兰并风靡全球的游戏《愤怒的小鸟》从人们的智能手机中获取数据以建立画像，涵盖了年龄、性别、家庭收入、婚姻状况、性取向、种族甚至政治取向等数据点，并将其传输给第三方定向广告公司。音乐流媒体服务\
  \ `Pandora` 的高管通过对其 7300 万听众进行画像，建立了一个新的收入来源，获取他们的政治信仰、种族、收入甚至育儿状况，然后将信息卖给广告商和政治竞选活动。`Apple`\
  \ 挖掘人们设备上的数据——照片、电子邮件、短信和位置——以帮助组织信息并预测用户需求。在宣传材料中，它将其推崇为一种数字个人助手，可以“对你可能去的地方做出主动建议”。\n\
  \nPierre Omidyar 的 `eBay` 是世界最大的在线拍卖网站，它部署了专门软件监控用户数据并与网络可用信息进行匹配，以揭露欺诈卖家。Jeff Bezos\
  \ 梦想将他的在线零售店 `Amazon` 建成“万能货场”，一个全球销售平台，能够预测用户的每个需求和渴望，并在无需要求的情况下交付产品。为了实现这一点，`Amazon`\
  \ 部署了一个监控和画像系统。它记录了人们的购物习惯、电影偏好、感兴趣的书、在 `Kindles` 上阅读书籍的速度，以及他们做的标记和边注注释。它还监控仓库工人，追踪他们的移动并对其实力进行计时。`Amazon`\
  \ 运行如此庞大的数据业务需要巨大的处理能力，这种需求催生了利润丰厚的副作用业务——向其他公司租用其巨大服务器的空间。如今，这家公司不仅是世界最大的零售商，还是世界最大的互联网托管公司，每年通过存储其他公司的数据赚入\
  \ 100 亿美元。\n\n## Facebook 的崛起\n\n`Facebook` 起家于哈佛大学的一个“美丑判定”评分游戏，后来成长为一个由类似于 `Google`\
  \ 的定向广告模式驱动的全球社交媒体平台。该公司吞噬了用户所做的一切切：帖子、文本、照片、视频、点赞和不喜欢、接受和拒绝的朋友请求、家庭关系、婚姻、离婚、位置、政治观点，甚至包括从未发表过的删除帖子。所有这一切都被喂入\
  \ `Facebook` 的秘密画像算法中，将私人生活的细节变成了私人商品。该公司能够关联人们的观点、兴趣以及群体和社区归属关系，使其成为各类广告和营销公司的青睐。\n\
  \n特别是政治竞选活动，非常喜欢 `Facebook` 提供的直接访问能力。他们不需要在电波中充斥单一的政治广告，而是可以使用详细的行为画像进行微定位信息传递，展示专门针对个人及其所看重的问题的广告。`Facebook`\
  \ 甚至允许竞选活动将潜在选民和支持者的列表直接上传到公司的数据系统，然后利用这些人的社交网络推断出可能支持某位候选人的其他人。这是一个强大且有利的工具。在 Mark\
  \ Zuckerberg 将公司从一个哈佛项目转变为十年，全球每天有 12.8 亿人使用该平台，`Facebook` 为美国的每位用户创造了 62 美元的收入。\n\
  \n## 无处不在的监控\n\n`Facebook`、`Google`、`Apple`、`Uber`、`Tinder`、`Airbnb`、`Spotify`、`Instagram`、`Twitter`\
  \ 非常了解我们，甚至是我们对亲的人隐藏的事情。正如 `Uber` 的 `Greyball` 程序清晰所示的那，没有人能逃脱——即使是警察也不。在我们现代互联网生态系统中，这种私人监控是常态。它像我们呼吸的空气一样不被察觉且平凡。但即使在这个先进的数据渴望环境中，从纯规模和普及程度来看，`Google`\
  \ 仍然处于统治地位。\n\n随着互联网的扩张，`Google` 也随之增长。资金充裕的 `Google` 进行了一场疯狂的购物。它收购了公司和初创企业，将其吸收到自己蓬勃发展的平台中。它超越了搜索和电子邮件，扩展到文字处理、数据库、博客、社交媒体网络、云托管、移动平台、浏览器、导航辅助、云笔记本电脑以及一系列办公和生产力应用。很难追踪所有的：`Gmail`、`Google\
  \ Docs`、`Google Drive`、`Google Maps`、`Android`、`Google Play`、`Google Cloud`、`YouTube`、`Google\
  \ Translate`、`Google Hangouts`、`Google Chrome`、`Google+`、`Google Sites`、`Google\
  \ Developer`、`Google Voice`、`Google Analytics`。它冲出了纯互联网服务，深入光纤电信系统、平板电脑、笔记本电脑、家庭监控摄像头、自动驾驶汽车、购物配送、机器人、发电厂、延寿技术、网络安全和生物技术。该公司甚至还成立了一家强大的内部投资银行，现在与从\
  \ `Uber` 到模糊的农作物监控初创公司、雄心勃勃的人类 DNA 测序公司（如 `23andME`）以及名为 `Calico` 的秘密延寿研究中心等各个领域都在与华尔街公司竞争。\n\
  \n\n\n\n\n无论部署了什么种服务或进入了什么种市场，监控和预测已融入其业务之中。流过 Google 系统的数据量是惊人的。到 2016 年底，Google\
  \ 的安卓系统已安装在全球销售的 82%的新型智能手机上，全球安卓用户超过 15 亿。与此同时，Google 每天处理数十亿次搜索和 YouTube 视频播放，并拥有\
  \ 10 亿活跃 Gmail 用户，这意味着它可以访问世界上大多数的电子邮件。一些分析师估计，北美 25%的互联网流量通过了 Google 的服务器。这家公司不仅连接着互联网，它*本身就是*互联网。\n\
  \nGoogle 开创了一种全新的业务交易模式。人们不再用钱为 Google 的服务付费，而是用数据支付。它向消费者提供的服务只是诱饵——用于获取人们的数据并主导他们的注意力，而这些注意力又被外包给了广告商。Google\
  \ 利用数据来扩张其帝国。到 2017 年，它的收入达到 900 亿美元，利润达 200 亿美元，拥有 7.2 万名全职员工，在 40 多个国家的 70 个办公室工作。它的市值为\
  \ 5930 亿美元，成为全球价值第二上市公司——仅次于另一家硅谷巨头苹果公司。\n\n同时，其他互联网公司依赖 Google 才能生存。Snapchat、Twitter、Facebook、Lyft\
  \ 和 Uber——它们都在 Google 无处不在的移动操作系统之上构建了数十亿美元的业务。作为守门人，Google 也从他们的成功中获益。人们使用移动设备越多，它获取的数据就越多。\n\
  \nGoogle 知道什么？它能猜到什么？嗯，它似乎无所不知。“最终发生的事情之一……是我们根本不需要你打字了，”Google 首席执行官埃里克·施密特在 2010\
  \ 年的一次坦诚时刻表示，“因为我们知道你在哪里。我们知道你去过哪里。我们可以多大程度上猜测你在想什么。”他后来补充道：“有一天我们进行了一次对话，发现我们可以尝试直接预测股市。然后我们决定这是违法的。所以我们停止了这样做。”\n\
  \n这是一个可怕的想法，考虑到 Google 已不再是一家可爱的初创公司，而是一家强大的全球性公司，拥有自己的政治议程和为股东利润最大化的使命。想象一下，如果菲利普·莫里斯、高盛或像洛克希希德·马丁这样的军事承包商拥有这种访问权限会怎样。\n\
  \n# Google 政府\n\n在塞尔格·布林和拉里·普奇成立 Google 后不久，他们开始从更宏大的角度来看自己的使命。他们不仅仅是在构建一个搜索引擎或目标广告业务。他们正在组织世界信息，让每个人都能获取并使用这些信息。这一愿景也涵盖了五角大楼。\n\
  \n尽管 Google 不断成长，它也成了国家至关重要的工具。2003 年，一家名为`Keyhole`的旧金山公司处于边缘。互联网泡沫破灭，该公司发现自己正挣于生存。幸运的是，中央情报局（CIA）及时拯救了它。1999\
  \ 年，在互联网泡沫的巅峰时期，CIA 启动了`In-QTel`，这是一家硅谷风险投资基金，其使命是投资与该机构需求一致的初创公司。\n\n`Keyhole`的灵感来自尼尔·斯蒂芬森的科幻小说《雪崩》（Snow\
  \ Crash），小说中的主角使用虚拟现实构筑来探索世界。该公司利用视频游戏技术将卫星图像缝合为三维模型，让任何人都可以虚拟地飞往任何地方，就像在空中中一样。\n\
  \nCIA 向`Keyhole`投入了数额未知的资金；确切数字仍保密。这项投资于 2003 年初完成，是与空间情报局（NGA）合作完成的，这是一个拥有 14,500\
  \ 名员工和 50 亿美元预算的主要情报机构，其工作是向五角大楼提供卫星情报。该机构以字母缩写`NGA`闻名，其格言是：“知地球……指路……解世界。”\n\n\
  CIA 和`NGA`不仅是投资者，还是客户，他们还参与了定制`Keyhole`的虚拟地图产品以满足自己的需求。在`In-QTel`投资几个月后，`Keyhole`软件已整合到作战服务中，并部署用于在“伊拉克自由行动”期间支持美军。\n\
  \n情报官员对其虚拟地图“像视频游戏一样”的简单性留下了深刻印象。他们也欣赏在其他情报之上叠加视觉信息的能力。这种可能性仅限于可以输入并嫁接到地图上的上下文数据：部队移动、武器库、实时天气和海洋状况、被截获的电子邮件和电话通话位置。`Keyhole`为情报分析师、前线指挥官或高空空飞行员提供了我们现在理所当然的能力：在电脑和手机上使用数字地图服务来查找餐厅、咖啡馆、博物馆、交通状况和地铁路线。“我们可以在几小时内完成这些整合并暴露现有的遗留数据源，而不需要几周、几个月或几年，”一位`NGA`官员在几年后赞叹道。\n\
  \n军事指挥官并不是唯一喜欢`Keyhole`的人。塞尔格·布林也是。他太喜欢它了，以至于坚持亲自为 Google 高管演示该应用程序。在《连线杂志》（Wired）发表的一篇文章中，他闯入公司会议，输入了在场每个人的地址，并使用该程序虚拟地飞过了他们的房屋。\n\
  \n\n\n\n\n2004 年，也就是 Google 上市的同年，布林和佩奇完全收购了这家公司，包括 CIA 的投资者在内。随后，他们将公司吸收进 Google\
  \ 不断增长的互联网应用平台中。Keyhole 重生为`Google Earth`（谷歌地球）。\n\n收购 Keyhole 对谷歌而言是一次重大的里程碑，标志着该公司结束了作为纯面向消费者的互联网公司的身份，开始与美国政府合作。当谷歌购买\
  \ Keyhole 时，他们还获得了一位名为`Rob Painter`的 In-Q-Tel 高管，他在情报和军工承包领域拥有深厚的背景，包括美国特种部队、CIA\
  \ 以及如雷神（`Raytheon`）、诺斯罗普·格鲁曼（`Northrop Grumman`）和洛克希德·马丁（`Lockheed Martin`）等主要的防务公司。在谷歌，Painter\
  \ 被安置在一个新成立的专门销售和游说部门，位于维吉尼亚州的雷斯顿，距离 CIA 位于兰格利的总部仅短路车程。他在谷歌的工作是帮助公司在利润丰厚的军工情报承包市场中分一杯羹。或者正如\
  \ Painter 用承包官僚术语描述的那样，“为情报和国防社区的一系列用户传教并实施`Google Enterprise`解决方案。”\n\n谷歌此前已与情报机构达成过几笔交易。2003\
  \ 年，它与情报机构达成了一笔交易（注：原文此处逻辑可能存在重复或缺失，翻译已按逻辑衔接）。译：他在谷歌的工作是帮助公司在利润丰厚的军工情报承包市场中分一杯羹。或者正如\
  \ Painter 用承包官僚术语描述的那样，“为情报正国防社区的一系列用户传教并实施`Google Enterprise`解决方案。”\n\n（注：由于原文文本存在大量段句重复和逻辑混乱，以下翻译基于原文核心意图进行整合，，以确保中文逻辑顺畅）\n\
