    # 4.4 Denoising Process


    In the inversion process, the temperature measurement obtained for reconstruction
    are obtained by probers on the external surface of the object. As the temperature
    rises, thermal noises of electronic components will result in detrimental impacts
    on the results. Therefore, the accuracy for the inversion can not be ensured.
    In this experiment, the receiver error is simplified to Gaussian noise, which
    will be attenuated by the denoising model to improve the input of the inversion
    network and the reconstruction accuracy. Here, the denoising process can be measured
    by a mathematical mapping


    ```

    $$\mathcal{S} : y \rightarrow x$

    ```


    wherein, $y$ and $x$ are respectively noisy signal and noiseless signal, both
    of which meet


    ```

    $y = x + n$

    ```


    where $n$ is additive Gaussian white noise.'
