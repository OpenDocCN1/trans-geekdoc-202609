    The updating formula of the conjugate gradient method can


    ```

    $J_{ij} = \frac{\partial T_i}{\partial P_j} \quad (4.11)$

    ```


    The searching direction $\mathbf{d}^n$ and step $\lambda_n$ is defined as


    ```

    $\mathbf{p}^{n+1} = \mathbf{p}^n + \lambda_n\mathbf{d}^n \quad (4.12)$

    ```


    ```

    $\mathbf{d}^{n+1} = -\mathbf{g}^{n+1} + \beta^n\mathbf{d}^n \quad (n \geq 1, \mathbf{-g}^1)
    \quad (4.13)$

    ```


    The conjugate coefficient $\beta^n$ can be expressed


    ```

    $\beta^n = \frac{\mathbf{g}_{n+1}^2}{\}{\mathbf{g}_n\|^2} \quad (4.14)$

    ```


    where $\mathbf{g}_a$ is the gradient of $S(P)$


    ```

    $\mathbf{g}_a = \nabla S(\mathbf{P}) = \mathbf{J}^T\mathbf{F} \quad (4.15)$

    ```


    The convergence speed of the CG method is between the steepest descent method
    and the Newton method. In fact, with merely the first derivative information,
    this algorithm avoids storing and calculating Hesse matrix and its inverse matrix
    required in the Newton method. Compared to the steepest descent method, it converges
    faster and more robust.


    # 4.2.2 Global Optimization Algorithm


    The emerging intelligent algorithms overcome the defect that gradient method fall
    into local optimum, and exhibit better global convergence. Nevertheless, these
    approaches have low computing efficiency. In the realm of HPCs, Chen et al. [11]
    proposed a novel approach based on GA for recovering a spatially related thermal
    conductivity and demonstrate high robustness. Wang et al. [12] integrated PSO/ZPSO
    with FEM to form a mixed algorithm to assess the temperature-dependent thermal
    conductivity. However, these methods can only reconstruct few parameters, so that
    they are not applicable to high-dimension problems. Here, several common methods
    will be introduced.'
