    h T_f dS_3 \quad (2.26)$

    ```


    The temperature load P is introduced by heat source, heat flow (Neumann boundary
    condition) and convective heat transfer (Robin boundary condition). Through matrix
    assembly, it can be obtained


    ```

    $[K][T] = \{P\} \quad (2.27)$

