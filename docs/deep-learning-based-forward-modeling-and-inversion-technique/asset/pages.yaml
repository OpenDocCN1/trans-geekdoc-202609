    # 1.3.2.2 Convolutional Based PINN


    Some other network structures for deep learning, as the CNN and RNN, generally
    do not have interfaces that can directly input space or time coordinates z, but
    directly embed space or time information into the structure of the network itself.
    For instance, the image in CNN naturally contains spatial information, while the
    sequence signal in RNN naturally contains time information. Then, according to
    the idea of "embedded physical knowledge", the three operators $\mathcal{F}$,
    $\mathcal{D}$, and $\mathcal{B}$ of the differential equation are embedded into
    the loss function in a discrete (difference) way rather than an automatic differential
    way.


