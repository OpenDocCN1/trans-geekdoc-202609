    in the loss function to enhance the convergence capability with limited training
    datasets. The results have demonstrated that the physics-informed framework is
    able to alleviate the frequently encountered over-fitting problems in supervised
    learning. Moreover, the extrapolation ability of the developed framework is analyzed.


    # 1.3.2.4 Generative Adversarial Based PINN


    Very recently, even generative adversarial networks can be adopted in the PINNs.
    In Yang''s work [58], the automatic differentiation is implemented to encode the
