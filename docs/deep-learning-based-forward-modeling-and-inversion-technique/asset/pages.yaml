    \ is a combination of the linear transformation and the activation function. Considering\
    \ the spatio-temporal information is contained in $z$, the network can be used\
    \ to approximate $\\mathcal{L}$ by implementing automatic differential operation\
    \ on $z$. The loss function of PINN includes three parts, namely the equation\
    \ loss $\\mathcal{E}_L$, the boundary loss $\\mathcal{E}_B$ (including initial\
    \ value loss) and the measurement point loss $\\mathcal{E}_{\\mathcal{D}}$.\n\n\
    ```\n$$\\mathcal{E} = \\mathcal{E}_L + \\mathcal{E}_B + \\mathcal{E}_{\\mathcal{D}}$\n\
