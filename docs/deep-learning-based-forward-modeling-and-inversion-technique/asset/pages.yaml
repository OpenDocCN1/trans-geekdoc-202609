    # 1.2.1 Fully Connected Neural Network


    The fully connected neural network [19], or FCN for short, is the most basic type
    of deep learning (DL) network (shown in Figure 1.4). Generally speaking, the network
    consists of three parts, the input layer, the hidden layers, and the output layer.
    Supposing that the input of the i-th and i+1 layer of the network are represented
    as $X_i$ and $X_{i+1}$, respectively,:


    ```

    $X_{i+1} = (W_{i+1}X_i + b_{i+1})$

    ```


    where $W_{i+1}, b_{i+1}$ are the matrix and bias vector of the i+1 layer and $\sigma$
    denotes the nonlinear activation function. The goal of the FCN is to fit some
    unknown function. In 1991, Leshno [20] proved that an FCN with a hidden layer
    can approximate any continuous function $f(x)$ uniformly on a compact set with
    a non-polynomial activation (such as Tanh, logistic, and ReLU). Mathematically,
    it can be termed as $\forall \epsilon > 0$, there exists an integer $N$ (the total
    number of hidden units), as well as parameters $\phi_i, b_i \in \mathbb{R}$ such
    that the function


    ```

    $F(x) = \sum_{i=1}^N \nu_i(w_i^T x + b_i)$

    ```


    Complies with $|F(x) - f(x)| < \epsilon$ for all $x$. This theorem lays a solid
    foundation for implementing the network to approximate the unsus functions.'
