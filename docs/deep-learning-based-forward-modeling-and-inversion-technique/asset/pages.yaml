    # 3.1  Introduction


    The standard heat conduction problem refers to the process of solving the internal
    temperature distribution and changing process of a given object''s geometric shape,
    thermophysical parameters, initial conditions, and boundary conditions. The inverse
    heat conduction problem (IHCP) is to use experimental means to measure the temperature
    inside the object or at some points on the boundary and its changing history with
    time, and use the heat transfer differential equation to invert the heat flux
    or heat conduction coefficient at the boundary. The inversion of surface heat
    flux is one of the most typical inverse problems, which has a broad application
    in aerospace, nuclear physics, metallurgy, and other industrial research fields
    [1, 2].

    Taking the aerospace [3], when space shuttles and spacecraft re-enter the atmosphere,
    their structures rub against the air, and a large amount of heat energy will be
    generated on the surface, resulting in a strong aerodynamic heating effect. The
    heat flux on the outer surface will be transmitted inward along the aircraft structure,
    which will affect the static and dynamic characteristics of the aircraft structure,
    and even lead to failure of the structure in serious cases. Therefore, it is of
    great significance for the design and evaluation of aircraft structures to accurately
    grasp the heat load faced by the vehicle structure in the actual flight process.
    However, there are a few difficulties in directly measuring the heat load on the
    structure surface of the reentry vehicle under working conditions: on the one
    hand, the vehicle operates in a harsh force/heat/ibration/noise and other complex
    environments, and the heat flux sensed outside the vehicle is vulnerable to multi-field
    load environment. On the other hand, it is difficult to integrate sensors in the
    thermal protection structure of the surface, which is a useful method but has
    little impact on thermal protection structure, although this approach can only
    record the highest temperature during flight, and it is difficult to accurately
    reveal the characteristics of temperature-changing history. The load inversion
    method developed in recent years has become an'
