    of the gradient disappearance of the traditional GAN loss and ensures the stability
    of the training process.


    GANs are fairly active subjects and various novel frameworks are developed. Here,
    a series of emerging GAN-based frameworks are described below:


    +   1. Conditional GAN (CGAN): CGAN [35] is a deep learning framework where some
    conditional parameters are introduced. Here, an additional parameter is introduced
    to the Generator for producing the required data. Besides, labels are also fed
    to the Discriminator for distinguishing ground truth and the generated false data.


    +   2. Deepal GAN (DCGAN): DCGAN [36] is another prevalent application of GAN
    which is consisted of convolutional networks rather than fully connected layers.
    Besides, the convolutional networks substitute the max pooling with the convolutional
    stride to enhance the capability for characteristic extraction.


    +   3. Super Resolution GAN (SRGAN): SRGAN [37] is employed to generate higher
    resolution images, which is especially applicable for low-resolution images to
    enhance the detailed characteristics.


    +   4. Laplacian Pyramid GAN (LAPGAN): The Laplacian GAN [38] employs a couple
    of Generator and Discriminator frameworks for it is to produce high-quality images,
    which is firstly down-sampled and up-scaled in the back pass in which the Conditional
    GAN is implemented to generate some noise.


    Finally, several advanced DL techniques such as the Graph Network, the Fourier
