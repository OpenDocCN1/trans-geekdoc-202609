    T and P are the temperature vector and load vector of each node in the system.
    After introducing boundary conditions and initial conditions, the temperature
    of each point can be solved by matrix equation. The finite element method can
    handle complex geometries and is therefore widely used in commercial software.
    Nevertheless, this algorithm cannot avoid time-consuming iterative calculation,
    making it inappropriate for real-time scenarios. As a result, it is still an arduous
    challenge to propose a method that can deal with the heat conduction problem with
    3D complex geometry instantaneously.


    # 2.2 Literature Review


    With the rapid development of computer hardware, the advent of big data provides
    a superior opportunity for the development of the deep learning technology [20,
    21]. In the last decade, deep learning has flourished in areas such as computer
    vision (CV) [22], natural language processing (NLP) [23] and autonomous vehicles.
    Researchers have introduced the technology into computational physics, such as
    computational electromagnetics [24, 25, 26], computational heat transfer [27,
    28, 29, 30, 31, 32] and computational fluid mechanics. With sufficient data generated
    by simulations or experiments and computing resources, the deep learning networks
    can extract the hidden physical laws in the system through a proper training process.
    In this section, state-of-the- works on deep learning for steady-state thermal
    problems is reviewed.'
