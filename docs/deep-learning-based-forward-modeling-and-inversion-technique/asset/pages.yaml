    To this end, it is imperative to establish a DL network to work independently
    of commercial software.


    In this chapter, a deep learning framework is erected to retrieve the thermal
    conductivity of an industrial product through temperature measurement at the external
    surface. It is noted that the entire process of data collection, training, and
    testing are merely based on neural networks while the validation phase of the
    proposed framework is capable of recovering the space, temperature or time-dependent
    thermal conductivity. First of all, abundant training data is constructed by the
    physics-informed neural network (PINN). To simulate the measurement error, Gaussian
    noise is added to the calculated temperature. To augment the noise, a U-net is
    introduced to improve the signal-to-noise ratio (SNR). The output, which is the
    denoised signal, is ultimately sent to the nonlinear mapping module to retrieve
    the thermal conductivity. The developed framework only requires one round training
    and then can be utilized for online prediction.


