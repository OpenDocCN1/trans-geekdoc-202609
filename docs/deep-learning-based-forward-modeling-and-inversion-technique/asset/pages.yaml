    # 5.2 Graph Neural Networks


    Graph Neural Networks (GNN) are a series of algorithms aiming at utilizing DL
    frameworks to process graph data. As is known to all, the traditional deep networks
    are inappropriate for graph-structured data since it is not based on a regular
    grid. The G was first proposed in 2005 and 2008 by Scarselli et al. [28], which
    are intended for node- and graph-oriented tasks, respectively. Nowadays, with
    the exuberant development of the DL techniques, more efforts are dedicated to
    the GNNs. The classical reals involved in GNNs include recommendation systems
    [29], computer vision [30], natural language processing [31], anomaly detection
    [32], drug discovery [35], and so on.

    Very recently, graph neural networks were introduced to the realm of computational
    physics. For instance, in 2019, Alet et al. [34] developed graph element networks
    (GEN), which are analogs to finite element analysis. The proposed framework allocates
    nodes of the GNN with spatial positions,'
