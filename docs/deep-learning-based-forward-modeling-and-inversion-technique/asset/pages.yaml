    In practical application, only the first few terms of the infinite series expansion
    are usually taken as approximations. For example, when the thickness is small


    ```

    $q_0(t) \approx-\rho\ C_{\rho} \frac{dT_0}{dt} + q_0(t)$ (3.6)

    ```


    O.R. Burggraaf [8] extended Equation 3.6 to cylinders and spheres, and gave examples
    to verify it. It is worth noting that although the analytical method is accurate
    in calculation and low resource consumption, its application scope is not wide.
    It is difficult to find that the method is only applicable to very simple geometric
    conditions, and requires that the known temperature and heat flows are separated
    in time and space infinitely differentiable. When faced with two-dimensional or
    dimensional situations, it will be difficult to obtain explicit solutions, so
    the introduction of numerical methods becomes necessary.


    The traditional numerical methods usually include offline methods and online methods.
    For example, the offline method needs to integrate the data all time to obtain
    the unknown heat flux, while the online method only needs the temperature measurement
    data for a short period of time. The common off-line methods are all functional-based
    optimization processes, which can be further divided into deterministic and stochastic
    optimization. Deterministic optimization depends on the gradient value of the
    function. In each iteration, the forward heat problem is calculated with the current
    parameters, while the error between the calculated temperature value and the measured
    temperature value is obtained. The iterative process is constantly updated to
    finally reach the minimum value of the cost function. Researchers have applied
    a variety of gradient algorithms to the heat flux reconstruction. Figure 3.1 displays
    an example of the gradient-based method.


    For instance, Zhou [9] have introduced the conjugate gradient (CG) algorithm to
    reconstruct the spatially or temporally related boundary conditions of a two-dimensional
    boundary. The results show that the developed method can be adopted to various
    situations with a considerable accuracy.


    In 1992, Taler [10] employed the Newton-Raphson method to retrieve the unknown
    heat flux in boiler furnaces through the transient temperature in tube sections.
    Afterwards in 2009 [11], they integrated the Levenberg-Marquardt (LM) algorithm
    with the ANSYS and attained a precision estimation of the'
