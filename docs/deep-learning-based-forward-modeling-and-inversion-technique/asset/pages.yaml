    where $f_n$ and $a_n$ are the basis function of the $n$-th term and the corresponding
    expansion coefficient, respectively, and $N$ is the number of expansion terms.
    Since the integral operator is linear, the Eq. 1 can be substituted to obtain:


    ```

    $$\sum_{n=1}^{N} a_n L(f_n) \approx g \quad (1.3)$

    ```


    In this way, the operator equation is transformed into a matrix equation. Next,
    sampling inspection is required, where the weight function (or trial function)
    needs to be selected. The frequently selected weight functions include the point
    matching method and Galerkin method [16], in which the unit impulse function or
    the basis function itself is selected as the weight function, respectively. For
    simplicity, the point-matching method is adopted here:


    ```

    $$\omega_m(\mathbf{r}) = \delta(\mathbf{r}) \quad (1.4)$

    ```


    One can define an inner product calculation (also called moment) that acts between
    the basis function and the weight function.


    ```

    $$\langle f_m, f_n\rangle = \int_{f_m} f_m(\mathbf{r}) \cdot \int_{f_n} f_n(\mathbf{r}'')
    d\mathbf{r}''d\mathbf{r} \quad (1.5)$

    ```


    In the method of methods


    ```

    $$\sum_{n=1}^{N} a_n \langle\omega_m, L(f_n)\rangle = \langle\omega_m, g\rangle
    \quad (1.6)$

    ```


    Construct a matrix whose unit element is


    ```

    $$z_{mn} = \langle\omega_m, L(f_n)\rangle \quad (1.7)$

    ```


    The right-hand side of Eq. 1.6 can be denoted as


    ```

    $$b_{mn} = \langle\omega_m, g\rangle \quad (1.8)$

    ```


    Here, the inner product equation has been transformed into a matrix equation:


    ```

    $$Ax = b \quad (1.9)$

