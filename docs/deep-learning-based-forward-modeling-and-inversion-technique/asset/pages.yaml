    Peng et al. [28] successfully resolved the two-dimensional steady-state heat conduction
    problem by combining the convolution neural network and innovatively proposed
    symbolic distance function. The proposed architecture is based on U-net, which
    contains five convolution layers and deconvolution layers, as shown in Figure
    2.1 (a). Figure 2.1 (b) exhibits the heat conduction model, where the object placed
