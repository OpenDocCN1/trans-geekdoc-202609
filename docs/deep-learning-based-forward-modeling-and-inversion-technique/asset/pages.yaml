    # 3.2 Progress in Inversion Research


    # 3.2.1 Conventional Approach


    As a typical ill problem [4], the inverse problem of the heat transfer is extremely
    sensitive to the disturbance of the definite solution data [5]. In recent decades,
    scholars have carried out relevant research through various methods. Among all
    kinds of algorithms, the analytical method is the most accurate and has no theoretical
    error [6, 7]. Taking a one-dimensional flat plate as an example [8], the series
    expansion method can be used to reconstruct the boundary heat flux and temperature.


    Suppose there is a uniform infinite plate, and a heat flux is applied to its outer
    surface. The temperature and heat flow of the outer surface can be obtained from
    the time domain temperature $T_0(t)$ and heat flux values $g_0(t)$ measured on
    the inner surface. Obviously, all points of the plate satisfy the passive heat
    conduction equation:


    ```

    $$\rho C_p \frac{\partial T}{\partial t} = \kappa \nabla^2 T$ (3.1)

    ```


    The heat flux on the outer surface satisfies:


    ```

    $q = -\kappa \frac{\partial T}{\partial x}$ (3.2)

    ```


    The $n$-th derivative of both sides of Equation (3.1) at the same time, it can
    be obtained


    ```

    $$\frac{\partial^n T}{\partial t^n} = \alpha \nabla^{2n} T$ (3.3)

    ```


    If the surface heat flux can be expressed separately in the form of space and
    time, the temperature of any point in the plate can be expressed in infinite series.


    ```

    $T(x,t) = T_0(t) + \sum_{n=1}^{\infty} \left( \frac{x^2}{\alpha} \right)^n \frac{d^n
    T_0}{d t^n}}{(2n)!}$ (3.4)

    ```


    ```

    $$\frac{x}{\kappa} \left[ q_0(t) + \sum_{n=1}^{\infty} \left( \frac{x^2}{\alpha}
    \right)^n \frac{d^n g_0}{d t^n} \right] (2n+1)!$$

    ```'
