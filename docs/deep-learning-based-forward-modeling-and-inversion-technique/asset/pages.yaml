    Computational electromagnetic has applications in extensive realms (i.e., antenna
    design, wireless communication, electromagnetic compatibility, microwave engineering,
    waveguide, and medical imaging). However, the numerical approaches such as the
    finite difference method (FEM), the moment of method (MoM) are computationally
    cumbersome and time-demanding. The conventional DL-based algorithms as CNNs can
    nearly deal with tasks with solving domain [37, 38], which severely confines the
    applications. In this section, a DL network consisting of a graph neural network
