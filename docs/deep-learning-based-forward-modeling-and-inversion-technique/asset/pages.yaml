  md: '# Deep Learning-Based Forward Modeling and Inversion Techniques


    # 4.2.1.1 LM Method


    Levenberg-Marquardt [7, 8] is a prevailing algorithm of obtaining the minimum
    of a function $F(x)$ that is a sum of squares of nonlinear functions and is widely
    used in optimization problems. For inverse heat conduction problems, LM iterative
    procedure is applied between the forward calculations.


    Here, the inversion procedure can be simplified as finding the unknown thermal
    property vector $P$ that minimizes the cost function $S(P)$:


    ```

    $$S(P) = \sum_{i=1}^{N_s,N_i} [T_i(P) - Y_i]^2 \quad (4.4)$

    ```


    where $N_s$ and $N_i$ are the numbers of sensors and time domain temperature sampling
    points while $T_i(P)$ are the calculated and $Y_i$ are the measured temperature,
    respectively. To satisfy the standard form of the LM method, $S(P)$ can be expressed
    as


    ```

    $$S(P) = F^T F \quad (4.5)$

    ```


    where


    ```

    $$F = T - Y \quad (4.6)$

    ```


    Suppose **J** is the Jacobian matrix whose elements satisfy


    ```

    $$J_{ij} = \frac{\partial T_i}{\partial P_j} \quad (4.7)$

    ```


    By expanding $T_i$ into the Taylor series, ignoring infinitesimal quantities above
    second order, and adding the LM parameter $\mu_i$, one can acquire the updating
    formula of the parameters $P$:


    ```

    $$P^{n+1} = P^n - (J^T J + \mu^n I)^{-1} J^T F \quad (4.8)$

    ```


    It should be noted that $\mu^n$ is a variable parameter during the iterations.
    In the initial stage, **P** is far from **Y** so that $\mu$ is relatively large
    and LM method is equivalent to the steepest descent method. When, **P** is close
    to **Y** and $\mu$ is relatively small, LM method is equivalent to Gauss-Newton
    method, which has quadratic convergence rate. By choosing a suitable guess $P_0$,
    the iterations are continuously performed until the arrival of termination conditions.


    # 4.2.1.2 Conjugate Gradient Method


    The conjugate gradient method (CGM) is a common mathematical technique developed
    by Magnus Hestenes [9] and Eduard Stiefel [10] that can be useful for the optimization
    of non-linear systems. Similar to the LM method, the inversion process can be
    simplified as determining the optimal property'
