  md: '# 4.6 Conclusion


    In this chapter, a DL-based thermal conductivity reconstruction model is developed.
    This network adopts pure deep learning frameworks to finish the entire process,
    which is composed of data generation, noise reduction, and thermal conductivity
    reconstruction. For data generation, the two-dimensional data adopts the method
    of external calling commercial software, while the three-dimensional data set
    construction is accomplished by the PINN. In virtue of the preponderance of the
    GPU parallel computing capability, the PINN is able to achieve batch calculation
    accurately without depending on mesh density. To simulate the measurement error,
    the calculation results of the PINN is added with white Gaussian noise and sent
    to the U-net for denoising. It is noted that the denoising U-net is able to elevate
    the input SNR of the last module, which is employed to reconstruct the thermal
    conductivity. The inversion utilized diverse frameworks for 2D and 3D scenarios.
    For 2D cases, the classic fully connected network is introduced, while the nonlinear
    mapping model is applied in 3D scenarios. The inversion result has forcefully
    corroborated the promising future of deep learning in the retrieval of parameters.
    Moreover, as the presented network can attain the inversion procedure in 0.1s,
    it is confident that this architecture can be broadly applied in real-time scenarios.


