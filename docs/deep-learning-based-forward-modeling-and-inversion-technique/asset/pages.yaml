    # 5.3.1.3 Data Generation


    In this part, the training data is acquired by implementing MATLAB with COMSOL.
    This software is on the basis of the finite element method (FEM). Here, the detailed
    procedure of utilizing the FEM to resolve the coupled electrothermal model is
    presented as follows:


    First of all, the solving domain is divided into $E$ cells, each of $p$ nodes.
    The temperature and potential of each cell can be expressed by the interpolation
    of the field quantities at the nodes:


    ```

    $T = \sum_{i=1}^{r} N_i(x, y, z) T_i^{(e)} = [N]{T^{(e)}$

    ```


    ```

    $\phi = \sum_{i=1}^{r} N_i(x, y, z) \phi_i^{(e)} = [N]{\phi^{(e)}$

    ```


    The weak form of the heat conduction and electrical current continuity can be
    expressed as


    ```

    $\int_{\Omega} \rho_c \phi \frac{\partial T}{\partial t} d\Omega + \int_{\Omega}
    k \nabla T \cdot \nabla T d\Omega = \int_{\Omega} \omega_i |\nabla \phi|^2 d\Omega$

    ```


    ```

    $\int_{\Omega} \omega_i |\nabla \phi|^2 d\Omega = 0$

    ```


    Each of the component can be formulated as


    ```

    $K_{Tij}^{(e)} = \int_{\Omega} (k_x \frac{\partial N_j}{\ x} \frac{\partial N_i}{\
    x} + k_y \frac{\partial N_j}{\ y} \frac{\partial N_i}{\ y}) dV$

    ```


    ```

    $K_{Tij}^{(e)} = \int_{\Omega} k \nabla N_j \cdot \nabla N_i dV$

    ```


    ```

    $Q_i^{(e)} = \int_{\Omega} \omega_i |\nabla \phi|^2 d\Omega$

    ```


    ```

    $K_{\phi ij}^{(e)} = \int_{\Omega} (\sigma_x \frac{\partial N_j}{\ x} \frac{\partial
    N_i}{\ x} + \sigma_y \frac{\partial N_j}{\ y} \frac{\partial N_i}{\ y}) dV$

    ```


    Where $K_{Tij}$, $K_{\phi ij}$ are the conduction and time-varying items. The
    heat source is denoted as $Q$. The assembled matrix is as:


    ```

    $[K_T]{T}=\{P\}$$

    ```


    ```

    $[K_{\phi}]{\phi}=\{Q\}$

    ```


    where $T$, $\phi$ and $P$ represent the vector of the temperature, the potential
    and the load. By imposing the boundary condition on the PDE, the physical fields
    can be acquired by resolving the corresponding equation. A total number of 6000
    specimens for each physics model are generated by specifying various boundary
    conditions. Here, 2/3 of the data sets are used for training.'
