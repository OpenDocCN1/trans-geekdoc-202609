    # 5.1.2 Convolutional-Based PINN


    Recently, the convolutional PINN [24, 25] is progressively becoming prevalent
    for the merits of parameter sharing kernels, spatial feature extractions, and
    light network weights. Diverse from the FCNN based PINN, the CNN based framework
    does not fit differential operators, but approximate differential to difference.
    In a sense, it is similar to the finite difference method. Compared with PINN,
    the CNN architecture has smaller volume and better generalization performance.


    The CNN based PINN consists of two parts, and the parameters of the corresponding
    kernel are trainable and fixed, respectively. The trainable convolution kernel
    is the same as the traditional supervised learning, while the fixed convolution
    kernel is used to calculate the PDE solution. Taking the two-dimensional Laplace
    operator as an example, the corresponding convolution kernels of different orders
    are displayed in Table 5.1.'
