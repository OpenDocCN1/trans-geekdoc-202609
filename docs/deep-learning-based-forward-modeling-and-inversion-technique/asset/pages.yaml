    \ parameter inversion, physics discovery and model optimization since being proposed\
    \ by Rassi [48] in 2018. To summarize briefly, the principle of PINN is to minimize\
    \ the loss function by training the neural network to approximate the solution\
    \ of PDE. The so-called term function includes the residual item of initial and\
    \ boundary conditions, and that of the partial differential equation at the selected\
    \ point in the region (traditionally called \"collocation point\"). After training\
    \ is completed, the framework can infer the value on the space-time point. From\
    \ the description, it can be found that the prototype of the PINN is a meshless\
    \ algorithm. In a general sense, the sense is employed to resolve the following\
    \ PDE:\n\n```\n$$\\mathcal{L}(u)(\\gamma)=f(z), z \\in \\Omega$\\n$\\mathcal{B}(u)\
    \ = g(z), z \\in \\partial\\Omega$\\n$\\mathcal{D}(u) = d(z), i \\in \\mathcal{D}$\n\
    ```\n\nHere, $z$ contains the spatial and temporal coordinates of the PDE described\
    \ by $L$ while $\\gamma$ is the parameter and $u$ is the solution. Both the boundary\
    \ and initial condition is described in $B$ while the observed data is denoted\
    \ as $\\mathcal{D}$. Compared with the traditional numerical algorithms for solving\
    \ differential equations, the formula 13 here describes the introduction of data,\
