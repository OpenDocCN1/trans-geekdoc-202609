    # 1.2.4 Generative Adversarial Network


    Generative Adversarial Networks are a mighty category of DL frameworks utilized
    for unsupervised learning, which was invented by Ian Goodfellow in 2014 [3]. The
    GANs (shown in Figure 1.7) are generally composed of two networks competing with
    each other the generator and the discriminator. The Generator is employed to generate
    a series of fake specimens and attempts to deceive the Discriminator. The Discriminator,
    on the other hand, endeavors to distinguish the real and fake specimens. Both
    the Generator and the Discriminator are DL networks that compete with each other
    during the training process.


    The Discriminator in the GAN is targeting the reward $V(D,G)$, while the generator
    is at maximizing the loss $V(D,G)$ which can be mathematically depicted


    ```

    $$\max_{G} \min_{D} V(D, G) = E_{p_{data}(x)}[log D(x)] + E_{p_z(z)}[log (1 -
    D(G(z)))]$\$

    (1.39)

    ```


    The original loss of the GAN is equivalent to the JS divergence (JSD):


    ```

    $$\max_{G} \min_{D} V(D, G) = -2\log 2 + \min [2JSD(p_{data}||p_G)]$\$

    (1.40)

    ```


    There is a serious problem with JS divergence: when the two distributions do not
    overlap, JS divergence is zero. Therefore, at the beginning of training, JS divergence
    is likely to be zero. So if the discriminator is trained too strongly, the loss
    will fail to converge to $-2\log 2$ without gradient. For this'
