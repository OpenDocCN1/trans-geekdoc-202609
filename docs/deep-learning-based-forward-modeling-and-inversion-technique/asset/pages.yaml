    The finite difference methods (including the FDTD and FDBD), the finite element
    method and the finite volume method are among the most common numerical algorithms
    in multiphysics [45]. As early as 1990s, Dechaumpeau [46] have implemented the
    finite element methods on irregular grids to resolve the coupled energy equation,
    Navier-Stokes (N-S) equation and the equilibrium equation to gain the temperature,
    velocity and stress fields. Their results have been affirmed by two practical
    researches. In 2005, Monnier et al. [47] also employed the finite element methods
    to simulate an electrical-mechanical-thermal coupled field, the results of which
    are validated by experiments. In addition, Wang et al. [48] combined the finite
    element time domain (FETD) method with the linear thermacoustic theory to compute
    the coupled pressure, velocity and temperature field in thermocous refrigerators.
    The calculation is authenticated by both simulation software and the experimental
    results. Besides, Xue et al. [49] introduced the Galerkin time-domain (DTGD) method
    using the spectral-electromagnetic-thermal coupling modeling in 3D cases. The
    proposed algorithm is proved to have better performance compared to traditional
    approaches for objects with structure or dynamic changes. Very recently in 2022,
    Li et al. [50] introduced the FEM to compute the heat conduction equations of
    particles and the current continuity equation in the resistive random-access method.
    These approaches can yield an accurate solution in numerical analysis, but they
    are generally resource-demanding and computationally-cumbersome.


    Recent years, the computational physics has vigorous development due to the flourish
    of DL technique, which fully exploits the mighty parallel computing capabilities
    of GPUs and the onerous computation. In fact, the DL networks are firstly utilized
    to solve single physical tasks. In electrostatics, Shan et al. [51] presented
    a DL framework on the basis of convolutional neural network to handle the Poisson
    equation to acquire the electrical potential. The raised network is compatible
    for 2D and 3D scenarios, while the relative error rate is no more than 3%. In
    optics, Li et al. [37, 38, 52, 53, 54] put forward the U-net to calculate the
    near field scattering fields of the nano metal particles, which achieved three
    orders of magnitude of acceleration while maintaining the accuracy. In 2021, Wang
    et al. [55] expanded the previous works to the 3D steady heat conduction problems
    in active and passive cases. They accompanied the heat flux and temperature inversion
    based on convLSTM in 2022, and integrated the physics informed neural network
    (PINN) with the nonlinear feedback network (NMM) to reconstruct the complicated
    thermal conductivity.


    Very recently, the DL approaches have been led into the multiphysics realms. For
    instance, in 2021, Niaki et al. [56] implemented the PINN to simulate the thermochemical
    process of a compound material by solving the reaction equation and the heat transfer
    equation. Bao et al. [57]'
