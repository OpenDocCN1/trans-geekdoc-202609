    # ## 2.4 Conclusion


    In this chapter, a deep learning framework based on U-net is constructed to predict
    the temperature fields of three-dimensional objects with sophisticated geometric
    shapes and thermal properties. Both the passive and the active scenarios are investigated.
    In terms of computing accuracy and efficiency, the proposed framework has exhibited
    apparent merits. In order to analyze the deep learning model in more detail, three
    datasets (the basic dataset, the enhanced dataset and the open-source dataset)
    are introduced. The experimental results have firmly corroborated that the proposed
    model is able to give a precise prediction of the temperature field two orders
    of magnitude faster than traditional algorithms FEM. Furthermore, the model trained
    on the basic dataset exhibits excellent generalization ability which demonstrates
    the robustness of the framework. Hereby, with its superior acceleration performance
    and robust generalization ability, the proposed framework provides a guideline
    to exploit 3D steady heat transfer solvers for application in a wide range of
    engineering fields.


