- pgno: 15
  md: '# 1

    Deep Learning Framework and Paradigm in Computational Physics


    Computational physics is a new subject that uses computers to numerically simulate
    physical processes. The application of computational physics is usually fairly
    extensive and permeates all fields of physics. The research process of computational
    physics mainly includes modeling, simulation, and computing. Among them, modeling
    means the process of abstract physical processes into mathematical models. Simulation
    refers to the expression and exploration of physical laws, also known as computer
    experiments. Computing is the procedure of numerical research and analysis of
    theoretical problems using computers. Traditional computational physics includes
    the finite difference method [1, 2, 3], the finite element method [4, 5, 6], the
    variational method [7, 8], the moment of method [9], the dynamics method [10,
    11], the Monte Carlo simulation method [12], etc. The detailed process of the
    finite element method is covered in later chapters of this book, so the first
    chapter will not be included. Here, the electromagnetic scattering calculation
    method based on MoM and the Monte Carlo simulation method based on steady-state
    heat conduction are briefly introduced.


    # 1.1 Traditional Numerical Algorithms


    # 1.1.1 Moment of Method


    The first approach to be discussed in this chapter is the moment of method (MoM),
    which was first introduced to the realm of computational electromagnetics [13,
    14]. The main methodology of MoM is to convert the continuous integral equation
    into discrete equations, which is able to be solved by computers [15]. The operator
    equation can be expressed by


    ```

    L(f) = g \quad (1.1)

    ```


    where $L$ denotes the integral equation operator of electric fields, $g$ and $f$
    are the known and unknown functions, respectively. The basic process for the MoM
    to solve the operator equation could be included in the following parts:


    DOI: 10.1201/9781003397830-1'
