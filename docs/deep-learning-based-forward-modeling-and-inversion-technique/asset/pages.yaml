    the two filters. By minimizing the filter and unifying the two channels, its output
    can be considered as a combination of spatial information and heat flux. Therefore,
    the input of LSTM layer can be considered as an unbiased 3D heat flux after preprocessing.
    With, the difficulty of capturing time information and establishing the relationship
    between heat flux and temperature is reduced. The first layer of LSTM is set as
    the sequence returned by each time step, because it will help to find the relationship
    between temperature and heat flux accurately. At the last layer, LSTM attends
    to a sensitivity coefficient for each time step to ensure that the temperature
    at different times has an appropriate impact on the heat flux at a given time.
    By avoiding the information contained in the previous layers, the number of neurons
