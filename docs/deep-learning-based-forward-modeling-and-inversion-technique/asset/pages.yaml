    # 1.1.2 Monte Carlo Method


    The second method introduced here is the Monte Carlo method [12, 17, 18], which
    is also called the random sampling method. The algorithm makes use the random
    number generated by the computer for statistical experiments and takes the statistical
    characteristics of the equation as the mean value and probability as the numerical
    solution of the equation. In recent years, the development of computer technology,
    the Monte Carlo algorithm has been widely used in the field of computational physics.
    Although with classical numerical methods such as the finite element method and
    finite difference method other methods cannot replace. For example, this method
    can solve the value of any point in the region independently without solving on
    the basis of other solved points, so it can realize fast parallel computing.


    When applying the Monte Carlo method to solve partial differential equations,
    it is usually necessary to establish a probability model to obtain the probability
    of an event through numerical simulation, so as to obtain the numerical solution
    of the point. This chapter will take the steady-heat conduction equation as an
    example to introduce the process of using Monte Carlo simulation to solve the
    PDE approximate solution.


    Suppose the problem in solution domain D


