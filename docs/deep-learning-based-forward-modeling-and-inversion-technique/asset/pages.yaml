    often suffer from degradation problems. With the increase network depth, the precision
    gets saturated and then degrades rapidly. Surprisingly, this degradation is not
    caused by overfitting, and the introduction of residual structure can alleviate
    this phenomenon.


    Assuming that the final function to be fitted is $\mathcal{H}(x)$, and the network
    first fits $\mathcal{F}(x) = \mathcal{H}(x)-x$. Then, the original $\mathcal{H}(x)$
    can be expressed by $\mathcal{F}(x)+x$. Related research has demonstrated that
    fitting identical mapping is much easier than direct fitting functions. Besides,
    the operator $\mathcal{F}(x)+x$ can be conveniently achieved by the skip connection,
    greatly enhancing the practicality of the residual structure. Consequently, it
    is possible to construct deep networks with more than 100 layers.


