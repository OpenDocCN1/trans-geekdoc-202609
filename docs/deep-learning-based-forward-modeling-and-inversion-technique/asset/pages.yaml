    # 1.3.1 Data Driven


    Data-driven deep learning technology is the most straightforward application of
    deep learning in computational physics. This method is usually based on supervised
    learning, and its application requires a large number of pre-generated data, which
    are often constructed by utilizing numerical algorithms. The data-driven network
    model can be regarded as a black box, that is, researchers do not need to pay
    attention to the connection between the network structure and physical problems,
    but only focus on the input and output. In other words, this kind of learning
    style is basically end-to-end. The advantage of data-driven network is that it
    can realize online prediction after offline training, which can be applied to
    various high-speed scenes.


    As displayed in Figure 1.8, the data-driven techniques have been extensively deployed
    in a plethora of computational physics. For instance, in electrostatics. Shan
    et al. [39] developed a purely data-driven model to handle Poisson''s equation
    based on convolutional network. With sufficient training data generated by the
    finite difference method and a proper training platform, the surrogate framework
    is able to attain a reliable prediction result with satisfied accuracy and considerable
    efficiency. It is noted that a'
