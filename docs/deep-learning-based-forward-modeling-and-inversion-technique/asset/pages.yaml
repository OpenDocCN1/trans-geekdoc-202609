    allowing the learned connection to generalize over different sizes of the space.
    The results are corroborated through Poisson equations of the steady-state heat
    conduction problems. In 2021, Herzberg et al. [35] employed the graph convolutional
    networks for solving the EIT problems on nonuniform meshes. The results have affirmed
    that the presented GCN outperformed the existing DL approaches and conventional
    methods in computational efficiency and accuracy. In 2022, Gao et al. [36] presented
    a novel PINN on the basis of the graph convolutional network, which is able to
    resolve both forward and inverse physical PDEs in irregular areas. Compared to
    traditional PINNs, the developed frameworks are able to reduce the calculation
    complexity and facilitate convergence. This section will mainly focus on the application
