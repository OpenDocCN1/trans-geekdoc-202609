    is marked as $\Gamma$, the two-dimensional finite difference scheme is as follows:


    ```

    $u(i+1, j) - 2u(i, j) + u(i-1, j) + \frac{u(i, j+1) - 2u(i, j) + u(i, j-1)}{\delta^2}
    = 0\n(1.16)

    ```


    Therefore, the value of $S$ at any point in the region can be regarded as the
    average value of several points. Similarly, approximate equations can be established
    for other points. The connection between the internal point $S$ and the boundary
    point can be obtained by simultaneous equations,


    ```

    $u(S) = \sum_{i=1}^{N_s} g(\Gamma_i)f(\Gamma_i)\n(1.17)

    ```


    In the above formula, the value of the boundary $\Gamma_i$ is denoted as $g(\Gamma_i)$,
    and its weight coefficient is $f(\Gamma_i)$. Therefore, a set of probability models
    based on the random walk can be constructed to simulate the aforementioned solving
    process. Here, suppose there are $N_s$ particles starting from point $S$, walk
    along the grid randomly with independent equal probability, and $p_i$ points finally
    arrive at the boundary $\Gamma_i$. Then the formula 17 can be rewritten as


    ```

    $u(S) = \lim_{N_s \to \infty} \sum_{i=1}^{N_s} \frac{N_i}{N_s}g(\Gamma_i)\n(1.18)

    ```


