    # 3.4.1 Training of the ConvLSTM


    A mature machine-learning framework needs to be fully trained before it can be
    used for actual prediction. The training process is implemented with an NVIDIA
    RTX 2080 Ti graphics card on the Dell Precision 7920 Tower. The network incorporates
