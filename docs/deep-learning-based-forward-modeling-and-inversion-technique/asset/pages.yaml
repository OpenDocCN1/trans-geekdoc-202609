    In heat transfer, Tadeparti et al. [42] exploited a data-driven DL architecture
    based on CNN to solve the steady-state heat conduction problems in two-dimensional
    cases. The involved conductors have square geometries and various boundaries.
    The authors introduced the image-based DL approach that do not contain any physics
    laws. In terms of the SSIM, the image-based algorithms performed better than the
    non-image ones. Besides, the efficiency of the deterministic and probabilistic
    models is in in.


    In quantum mechanics, Mills et al. [43] presented a Schrödinger solver to solve
    the ground-state energy. The raised DL architecture is based on a convolutional
    neural network, aiming at constructing a map between the constrained electrostatic
    potential and the unknown ground-state energy. The results have affirmed that
    the model can yield high accuracy with the absolute error of 1.49 MPa. Additionally,
    other physical quantities like the kinetic energy and the first excited state
    can also be solved by the developed framework, serving as promising candidates
    for computational physics in quantum fields.


    In hydrodynamics, Liu et al. [44] raised a universal and flexible model to predict
    the non-uniform unsteady flow at real time. The DL network is based on the convolutional
    network, which accomplishes the anticipated velocity with high fidelity. Compared
    to the existing CPU-based numerical approaches such as the LBM, the CNN enables
    faster predictions thousands of times faster. It is worth noting that the presented
    CNN can be applied in both 2D and 3D scenarios with sophisticated geometries,
    emerging mighty potential in computational fluid mechanics.


    During the data-driven supervised learning, one of the significant restrictions
    is that mature framework requires abundant training data collected by numerical
    methods. Generally speaking, the reported size of training examples usually lies
    in the range of 10^3 to 10^5, consuming a tremendous of time before being implemented
    for use. Collectively, the substantial time delays involved in the data generation
    process undermine the merits of the supervised learning, making the solving process
    intractable. Actually, the precision of the framework and the volume of the dataset
    is an irreducible trade-off.'
