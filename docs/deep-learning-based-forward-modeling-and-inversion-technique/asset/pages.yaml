- pgno: 11
  md: '# # Preface


    Computational physics is the third branch of modern physics beyond experimental
    physics and theoretical physics. It is an emerging discipline that implements
    computers as tools and applies appropriate mathematical methods to calculate physical
    problems. Numerical modeling of either steady or transient processes of computational
    physics finds a plethora of applications in diverse realms, with practical impact
    on electromagnetics, optics, thermology, hydrodynamics, quantum mechanics, and
    so on. Traditional wisdom assisting in the modeling procedure is derived from
    applied mathematics, where a series of numerical algorithms, such as the finite
    difference method (FDM), the finite element method (FEM), and the method of moments
    (MOM), have been proposed to resolve the differential integral equations related
    to multiple systems. Nevertheless, all the aforementioned approaches encounter
    the same dilemma when dealing with computational scenarios. Under these circumstances,
    the physics boundaries along with the constraint equation of the system are discretized
    into a sophisticated matrix with high-dimensional space and millions of unknown
    variables. Although the traditional algorithms may supply feasibility to conquer
    the task, the computational efficiency can be the bottleneck. Generally speaking,
    thousands of hours for calculation might hinder researchers from large-scale simulation
    processes demanding a real-time response.


    The deep learning (DL) has come into the stage of scientific computing in recent
    years. The most evident idea behind the DL technique in scientific computing is
    data-driven modeling, where the conventional solving merely serve to generate
    sufficient data for DL algorithms to learn the underlying physics during the training.
    however, the relation in any forward or inverse function with numerous variables
    is able to be faithfully approximated via training, rather than resource-demanding
    and time-consuming numerical calculation. In terms of computational speed, the
    well-trained DL algorithms surpass conventional approaches by orders of magnitude
    in forward analysis. However, purely data-dependent DL frameworks represent black
    boxes, in which training samples are indispensable to yield a satisfactory output.
    To this end, the physics-informed neural networks (PINN) are proposed which enable
    the physics constraint by automatic differential scheme or difference kernels.
    The method of PINN is analogous to solving by conventional numerical algorithms,
    which encode the boundaries'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'xii


    Preface


    and physics equations to a particular form. Therefore, a significant defect of
    the PINN is that it is applicable to only a specific scene, demonstrating an inferior
    generalization ability. Accordingly, the operator learning architecture is developed,
    which surmounts the imperfection of the PINN and emerges a pervasive application
    prospect.


    The deep learning technique appears as a reformative approach with remarkable
    performance in scientific computing, but it is never an obscure and prohibitive
    method to be employed in various areas. This book is here to furnish comprehensive
    insights and practical guidance for pertinent research to establish a complicated
    numeric solver using deep learning networks. The intended audience contains researchers
    interested in implementing machine learning techniques in the field of computational
    physics, particularly forward and inverse problems. To start with, the first chapter
    provides a detailed introduction to DL frameworks, as the prevails connected network,
    the convolutional network, the recurrent network, the generative adversarial network,
    and the graph network. After that, the paradigm for employing the deep learning
    mechanism to settle computational physics mission is discussed, involving data
    physical constraints, operator learning, and DL-traditional fusion methods. The
    original and concrete experimental results are demonstrated in how the complete
    procedure can be done to set up the DL-based solver. Chapter 2, the steady-state
    forward heat conductivity problem is handled by the classical U-net, including
    the passive and active scenarios. Chapter 3, the emerging conLSTM architecture
    is used to reconstruct the surface heat flux of curved surface. Chapter 4, a physics-informed
    neural network (PINN) and a feedback mechanism are adopted to reconstruct the
    intricate thermal conductivity. Ultimately in Chapter 5, several of the latest
    advanced network structures are investigated, consisting of the application of
    PINN in generalized coordinates, the living example of graph neural networks in
    solving electrostatic fields, and the instance of coupled Fourier networks in
    tackling multiphysics field problems.


    Employing the deep learning technique in the modeling of computational physics
    is stepwise from a spark of practice into a mainstream trend, where physicists,
    mathematicians, and algorithm gather together to tackle multiscale and multiphysics
    problems. Considering this background, the authors anticipate that all the readers
    will benefit a lot from this


    book.


    Yinpeng Wang

    Qiang Ren'
