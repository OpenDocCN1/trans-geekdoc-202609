    \ actually the-two norms of $y - f(x)$:\n\n```\n$L(y, f(x)) = \frac{1}{n} \\sum_{i=1}^{n}\
    \ |y_i - f(x_i)|^2 \\quad (2.41)$\n```\n\n+   - B. Mean absolute loss\nThe mean\
    \ absolute loss calculates the average absolute value between the predicted value\
    \ and the target value, that is, the I-norm of $y - f(x)$.\n\n```\n$L(y, f(x))\
    \ = \frac{1}{n} \\sum_{i=1}^{n} |y_i - f(x_i)| \\quad (2.42)$\n```\n\nThe absolute\
    \ loss has the merits of high robustness, especially for outliers. However, it\
    \ is unstable since it is not derivative at the origin.\n\n+   - C. Mean square\
    \ logarithmic loss\nThe mean square logarithmic loss is defined as\n\n```\n$L(y,\
    \ f(x)) = \\frac{1}{n} \\sum_{i=1}^{n} |log y_i - f(x_i)|^2 \\quad (2.43)$\n```\n\
    \nThe mean square logarithmic loss is applicable to the situation where there\
    \ are large differences among samples.\n\n+   - D. Huber loss\nThe Huber loss\
    \ combines the mean square loss and the mean absolute loss, which is defined as\n\
    \n```\n$L(y, f(x)) = \\begin{cases} \\frac{1}{2} |y - f(x)|^2, & |y - f(x)| \\\
