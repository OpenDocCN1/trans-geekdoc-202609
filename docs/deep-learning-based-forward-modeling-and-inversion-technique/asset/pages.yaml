    framework). For the FEM-based software, it needs to spend 185 minutes, which is
    1500 times slower. Besides, although the Fourier framework needs some time for
    data generation and training before being used, that process is just one-off.
    That is to say, once the offline training is completed, the real-time online prediction
    can be performed.


