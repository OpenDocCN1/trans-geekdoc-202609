    they are arduous to be applied for the inversion of heat flux loads on complex
    structures due to their tremendous amount of calculation and intolerable time
    costs. Besides, since these algorithms can reconstruct merely a small number of
    parameters at one time, they are inappropriate for real-time scenarios.


    Unsteady state conduction exhibits the features of diffusion, which has damping
    property and delay property. The damping property shows that the change of boundary
    heat flux has a greater influence on the temperature near the boundary, and the
    influence will gradually decrease with the increase of distance from the boundary.
    The delay property is that the reaction of internal temperature to boundary heat
    flux is delayed in time. Therefore,'
