    ```

    $W(P_r, P_g) = \inf_{gamma \in \Pi(P_r, P_g)} E_{(x,y)\sim\gamma} |x - y| \quad
    (1.41)$

    ```


    The intuitive meaning of this term is that it is the distance required to move
    distribution $r$ to distribution $g$. Therefore, if the two distributions do not
