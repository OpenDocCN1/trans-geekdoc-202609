- pgno: 1
  md: '# # Deep Learning-Based Forward Modeling and Inversion Techniques for Computational
    Physics Problems


    This book investigates in detail the emerging deep learning (DL) technique in
    computational physics, assessing its promising potential to substitute conventional
    numerical solvers for calculating the fields in real-time. After good training,
    the proposed architecture can resolve both the forward computing and the inverse
    retrieve problems.


    Pursuing a holistic perspective, the book includes the following areas. The first
    chapter discusses the basic DL frameworks, the heat condition problem is solved
    by the classical U-net in Chapter 2, involving both the passive and active solvers.
    Afterwards, the sophisticated heat flux on a curved surface is resolved by the
    presented physics-informed DL structure using Conv-LSTM, exhibiting high accuracy
    and efficiency. Additionally, a physics-informed DL structure with a nonlinear
    mapping module is employed to obtain the space/temperature/time-related conductivity
    via the transient temperature in Chapter 4. Finally, in Chapter 5, a series of
    the latest frameworks and the corresponding applications are introduced to computational
    physics.


    As deep learning are experiencing vigorous development in computational physics,
    more people desire related reading materials. This book is intended for graduate
    students, professional practitioners, and researchers need DL for computational
    physics.


    Yinp Wang received the B.S. degree in Electronic and Information Engineering from
    Beihang University, Beijing, China in 2020, where he is currently pursuing his
    M.S. degree in Electronic Science and Technology. Mr. Wang focuses on the research
    of electromagnetic scattering, inverse scattering, heat transfer, computational
    multi-physics, and deep learning.


    Qiang Rem received the B.S. and M.S. degrees in both electrical engineering from
    Beihang University, Beijing, China and Institute of Acoustics, Beijing, China
    in 2008, respectively, and the PhD degree in Electrical Engineering from Duke
    University, Durham, NC, in 2015. From 2016 to 2017, he was a postdoctoral researcher
    with the Computational Electromagnetics and Antennes Research Laboratory (CEARL)
    of the Pennsylvania State University, University Park, PA. In September 2017,
    he joined the School of Electronics and Information Engineering, Beihang University
    as an “Excellent Hundred” Associate Professor.'
