    ## 1.2 基础神经网络结构


    由于传统算法效率低下，它们不适用于高速场景。近年来，深度学习技术在计算物理领域取得了许多突破性成就。


    ## 基于深度学习的正向建模与反演技术


    ![](img/020125e0e698f9771fbbd32f2ace1e80_20_0.png)


    图 1.2

    蒙卡洛模拟与解析解的对比。

    (a) 通过蒙卡洛模拟计算的温度，(b) 温度的解析解，(c) 误差。


