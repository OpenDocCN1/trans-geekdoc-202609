    # 基于深度学习的正向建模与反演技术


    ![](img/020125e0e698f9771fbbd32f2ace1e80_112_0.png)


    图 3.9

    训练集和测试集随迭代次数变化的损失值。


    ## 3.4 结果与讨论


    在本节中，将首先介绍网络的训练过程。接下来，将从计算准确性和加速两个方面对训练后的网络进行测试。同时，将在两类数据集中随机选择几个不同热通量的样本，以直观地衡量
    ConvLSTM 网络的性能。这里以 MATLAB 生成的真实热通量分布作为参考。此外，为了确保正向程序的正确性以及反演框架的泛化能力，本实验还涵盖了实际测试工程数据的反演结果。


    ### 3.4.1 ConvLSTM 的训练


    一个成熟的机器学习框架在用于实际预测之前需要经过充分训练。训练过程在 Dell Precision 7920 台式机上的 NVIDIA RTX 2080 Ti
    显卡实现。网络集成了 Keras [26] 和 Adam 优化器 [27] 来优化逐点损失 [28, 29, 31]，该损失定义为真实值与预测值之间的均方误差：


    > $LOSS = \sum_{i=1}^{N} (q_{real}(i) - q_{predict}(i))^2$$


    在构建网络时，添加了 dropout 函数，它会在每次训练期间随机丢弃某些参数，以确保不会发生过拟合。损失函数随迭代次数的变化曲线如图 3.9 所示。


    ### 基于 ConvLSTM 的复杂热通量反演


    显而易见的是，实验过程中网络在短时间内收敛了 [32]。在训练过程中，测试集和训练集的误差同步下降，表明网络在整个过程中没有遭受过拟合。实验结果表明，该框架具有强大的学习能力，能够快速完成热通量的反演。事实上，最终收敛误差约为
    $10^{-4}$，这有效证明了网络的准确性。


    ### 3.4.2 规则平面的反演


    由于整个实验过程中的热模型不同，不同阶段的结果将逐步显示。第一个案例是规则平面热模型的反演结果。在该研究中，网络包含了两种信息，即温度分布和模型几何形状。然而，由于模型是平板，其形状在整个过程中可以被认为是冗余信息，因为它在所有训练集中都是一致的。该实验可以简化为单通道输入网络。在整个数据生成过程中，使用固定的热传导模型来简化计算。由于温度和热通量的空间分布特征一致，因此训练难度较低，可以快速实现收敛。图
    3.10 展示了从测试集中选出的不同热通量样本，显示了不同时刻热通量的空间分布。为了定量地显示预测热通量空间分布与真值（ground truth）之间的差异，这里引入了相对误差，其表达式式为：


    ```

    $error(i) = \frac{q_{predicted}(i) - q_{real}(i)}{q_{real}(i)} \quad (3.46)$

    ```


    在图 3.10 中，第 1 列显示不同测试集的预测热通量分布，第 2 列显示真值分布，第 3 列显示预测热通量与对应真值之间的相对误差。所有数据的相对误差都在
    3% 以内。可以清晰地发现，对于随时间剧烈变化的热通量，具有良好的反演能力。例如，尽管图 3.10 最后两列中 $t=37s$ 和 $t=722s$ 的热通量差异显著，但两种情况下的相对误差保持在较低水平。


    ### 3.4.3 复杂表面的反演


    对于复杂表面的热模型反演，可以进一步分为两个子问题。第一个子问题的模型是固定的，虽然外表面是曲的，因此训练难度中等。对于第二个子问题，模型在数据集中不断变化的随机性更大，训练最具挑战性。


    #### 3.4.3.1 固定复杂模型的热反演结果


    第一个问题是在 SolidWorks 中建模并直接调用 MATLAB 中的函数读取建模数据，这为以后生成更复杂的数据集提供了基础。实验涉及的几何形状是一个金字塔。通过设置模型上下面的尺寸和高度，可以确定模型的形状。利用椭球截取金字塔以形成热通量表面。因此，由于金字塔形状的特征，热通量表面和温度表面的面积不再一致。这导致热通量表面与温度表面的高度差不再一致。这平均耗时小于
    20 ms。


    .


