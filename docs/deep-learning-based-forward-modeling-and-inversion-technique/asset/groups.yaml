    in a plethora of computational physics. For instance, in electrostatics. Shan
    et al. [39] developed a purely data-driven model to solve the Poisson''s equation
    based on convolutional network. With sufficient training data and a proper training
    platform, the framework is able to attain a reliable result with satisfied accuracy.
    It is noted that


    In nano photonics, Li et al. [40, 41] proposed a fully trained network to resolve
    the near-field EM scattering of isolated structure. It can be found that a relatively
    small number of specimens are required to train the CNN to achieve high precision.
    Compared to the existing CPU-based numerical approaches such as the LBM, the CNN
    enables faster predictions thousands of times faster. In heat transfer, Tadeparti
    et al. [42] exploited a data-driven architecture to solve steady-state heat conduction
    problems in two-dimensional cases. The involved conductors have square geometries
