    xii


    Preface


    and physics equations to a particular form. Therefore, a significant defect of
    the PINN is that it is applicable to only a specific scene, demonstrating an inferior
    generalization ability. Accordingly, the operator learning architecture is developed,
    which surmounts the imperfection of the PINN and emerges a pervasive application
    prospect.


    The deep learning technique appears as a reformative approach with remarkable
    performance in scientific computing, but it is never an obscure and prohibitive
    method to be employed in various areas. This book is here to furnish comprehensive
    insights and practical guidance for pertinent research to establish a complicated
    numeric solver using deep learning networks. The intended audience contains researchers
    interested in implementing machine learning techniques in the field of computational
    physics, particularly forward and inverse problems. To start with, the first chapter
    provides a detailed introduction to DL frameworks, as the prevails connected network,
    the convolutional network, the recurrent network, the generative adversarial network,
    and the graph network. After that, the paradigm for employing the deep learning
    mechanism to settle computational physics mission is discussed, involving data
    physical constraints, operator learning, and DL-traditional fusion methods. The
    original and concrete experimental results are demonstrated in how the complete
    procedure can be done to set up the DL-based solver. Chapter 2, the steady-state
    forward heat conductivity problem is handled by the classical U-net, including
    the passive and active scenarios. Chapter 3, the emerging conLSTM architecture
    is used to reconstruct the surface heat flux of curved surface. Chapter 4, a physics-informed
    neural network (PINN) and a feedback mechanism are adopted to reconstruct the
    intricate thermal conductivity. Ultimately in Chapter 5, several of the latest
    advanced network structures are investigated, consisting of the application of
    PINN in generalized coordinates, the living example of graph neural networks in
    solving electrostatic fields, and the instance of coupled Fourier networks in
    tackling multiphysics field problems.


    Employing the deep learning technique in the modeling of computational physics
    is stepwise from a spark of practice into a mainstream trend, where physicists,
    mathematicians, and algorithm gather together to tackle multiscale and multiphysics
    problems. Considering this background, the authors anticipate that all the readers
    will benefit a lot from this


    book.


    Yinpeng Wang

    Qiang Ren'
