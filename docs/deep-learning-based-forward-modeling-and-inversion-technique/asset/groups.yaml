    ## 基于深度学习的正向建模与反演技术


    ### 4.2.1.1 LM 方法


    Levenberg-Marquardt算法 [7, 8] 是一种用于获取非线性函数平方和之函数 $F(x)$ 最小值的流行算法，广泛应用于优化问题。对于反演热传导问题，在正向计算之间应用了
    LM 迭代过程。


    在这里，反演过程可以简化为寻找使代价函数 $S(P)$ 最小化的未知热属性向量 $P$：


    $$S(P) = \sum_{i=1}^{N_s,N_i} [T_i(P) - Y_i]^2 \quad (4.4)$$


    其中 $N_s$ 和 $N_i$ 分别为传感器数量和时间域温度采样点，$T_i(P)$ 代表计算温度，$Y_i$ 代表实测温度。为了满足 LM 方法的标准形式，$S(P)$
    可以表示为


    $$S(P) = F^T F \quad (4.5)$$


    其中


    $$F = T - Y \quad (4.6)$$


    假设 **J** 是雅可比矩阵，其元素满足


    $$J_{ij} = \frac{\partial T_i}{\partial P_j} \quad (4.7)$$


    通过将 $T_i$ 展开为泰勒级数，忽略二阶以上的无穷小量，并引入 LM 参数 $\mu_i$，可以获得参数 $P$ 的更新公式：


    $$P^{n+1} = P^n - (J^T J + \mu^n I)^{-1} J^T F \quad (4.8)$$


    需要注意的是，$\mu^n$ 是迭代过程中的变参数。在初始阶段，**P** 远离 **Y**，因此 $\mu$ 较大，LM 方法等同于最速下降法。当 **P**
    接近 **Y** 且 $\mu$ 较较小时，LM 方法等同于高斯-牛顿法，后者具有二次收敛速率。通过选择合适的初始猜测值 $P_0$，持续进行迭代直到满足终止条件。


    ### 4.2.1.2 共轭梯度法


    共轭梯度法（CGM）是一种由 Magnus Hestenes [9] 和 Eduard Stiefel [10] 开发的常用数学技术，对于非线性系统的优化非常有用。与
    LM 方法类似，反演过程可以简化为确定使代价函数 $S(P)$ 最小的最属性向量 $P$：


    $$S(P) = \sum_{i=1}^{N_T, N_i} [T_i(P) - Y_i]^2 = \mathbf{F}^T\mathbf{F} \quad
    (4.9)$$


    其中等式4.9中的物理量与等式4.4相同。对于 CG 方法，获取目标函数最小值的关键步骤是计算灵度矩阵，其元素满足


    $$S(P) = \sum_{i=1}^{N_T, N_i} [T_i(P) - Y_i]^2 = \mathbf{F}^T\mathbf{F} \quad
    (4.10)$$


    共轭梯度法的更新公式可以为


    $$J_{ij} = \frac{\partial T_i}{\partial P_j} \quad (4.11)$$


    搜索方向 $\mathbf{d}^n$ 和步长 $\lambda_n$ 定义为


    $$\mathbf{p}^{n+1} = \mathbf{p}^n + \lambda_n\mathbf{d}^n \quad (4.12)$$


    $$\mathbf{d}^{n+1} = -\mathbf{g}^{n+1} + \beta^n\mathbf{d}^n \quad (n \geq 1,
    \mathbf{-g}^1) \quad (4.13)$$


    共轭系数 $\beta^n$ 可以表示为


    $$\beta^n = \frac{\mathbf{g}_{n+1}^2}{\|\mathbf{g}_n\|^2} \quad (4.14)$$


    其中 $\mathbf{g}_a$ 是 $S(P)$ 的梯度


    $$\mathbf{g}_a = \nabla S(\mathbf{P}) = \mathbf{J}^T\mathbf{F} \quad (4.15)$$


    CG 方法的收敛速度介最速下降法和牛顿法之间。事实上，仅需一阶导数信息，该算法避免了存储和计算牛顿法所需的 Hessian 矩阵及其逆矩阵。与最速下降法相比，它收敛更快且更稳健。


    ### 4.2.2 全局优化算法


    新兴的智能算法克服了梯度法陷入局部最优的缺陷，并表现出更好的全局收敛性。然而，这些方法的计算效率较低。在高性能计算（HPC）领域，Chen 等人 [11]
    提出了一种基于遗传算法（GA）的新方法来恢复空间相关的热导率，并证明了高稳健性。Wang 等人 [12] 集成了 PSO/ZPSO。然而，这些方法高度依赖于参数。


    ### 4.2.2.1 遗传算法


    遗传算法（GA）是一种模拟生物演化的算法，能够自动在搜索空间中搜索。通常情况下，遗传算法通过以下规则产生后代：


    - 选择规则：从当前代中随机选择个体。

    - 交叉规则：随机整合父代以产生后代。

    - 变异规则：随机应用于后代。


    在每一代中，计算种群的适应度以确保进化方向。


    ### 4.2.2.2 粒子群优化


    粒子群优化（PSO）1995年受鸟类觅食行为启发由 James Kennedy 和 Russell Eberhart 建立。该算法具有快速收敛、参数少且易于实现的优点。在粒子群中，速度初始化在
    $V$ 内。在迭代过程中，速度根据以下公式更新：


    $$v^{n+1} = v^n + c_1 r_1 (p^n - x^n) + c_2 r_2 (g^n - x^n) \in V^n \quad (4.16)$$


    $$x^{n+1} = x^n + v^{n+1} \quad (4.17)$$


    ### 4.2.3 深度学习方法


    随着学习技术的发展，计算物理学也经历了巨大的进步。深度学习可以提取特征。在计算电磁学领域，Wei 等人 [13] 开发了一种深度网络来检索未知散射体的介电常数。该模型以
    1 s 的时间解决了求解问题。在地球科学领域，Li 等人 [14] 利用端到端网络从地震数据中立即恢复速度。这些深度神经网络在速度分布上实现了可实现的精度。对于反演热传导问题（HCP），[15,
    16] 首次引入了卷积 LSTM 通过温度反演时间域热通。开发的热传导模型可以应用于具有辐射条件和非线性参数的复杂三维结构。


