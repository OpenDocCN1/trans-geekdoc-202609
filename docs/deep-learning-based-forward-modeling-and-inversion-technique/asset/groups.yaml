    #  4.5.2.4 Generalization Ability


    Generalization ability is a term which describe a DL model''s capability to react
    to new data after being trained on a given training set. In other words, whether
    a model can digest new examples and make reasonable predictions.

    As the samples in the curated dataset have different variation trends with temperature
    or related materials models, this part merely concentrates on the space-related
    cases. Here, 1000 specimens with completely diverse samples from the original
    data set are employed to assess the generalization ability. In order to simulate
    the inversion of practical products, the data contains specimens with discrete
    conductivity.

    Although the proposed network tends to give predictions with smooth thermal conductivity
    at the interface which distinctly expands the error to some extent. Nevertheless,
    the average error is still 8.8%. Although it is larger than the previous results,
