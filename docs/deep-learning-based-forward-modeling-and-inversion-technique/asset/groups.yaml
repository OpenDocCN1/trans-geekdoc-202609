    ### 2.3.2.4 增强数据集


    在增强数据集中，由于热导系数的非均匀分布，热传导方程变为：


    ```

    $$\nabla k \cdot \nabla T + k \nabla^2 T = 0 \quad (2.34)$$

    ```


    # 基于深度学习的前向建模与反演技术


    ![](img/020125e0e698f9771fbbd32f2ace1e80_64_0.png)


    图 2.9

    开源集中随机选取的示例（被动情况）。该数据集包含了许多真实物体（标记为 1-3），如螺钉、瓶子、平锅、人体、火箭、卫星等。


    ![](img/020125e0e698f9771fbbd32f2ace1e80_64_1.png)


    图 2.10

    开源集中随机选取的示例（主动情况）。该数据集包含了许多真实物体（标记为 1-3），如螺钉、瓶子、平锅、人体、火箭、卫星等。热源为一个立方体（标记为 4）。


    很显然，方程 2.34 比方程 2.1 更复杂。因此，增强数据集中的温度求解更具挑战性。鉴于此，增强数据集包含更多的被动和主动情况样本（20000 个）。


    # U-Net 在三维稳态热传导求解器中的应用


    ![](img/020125e0e698f9771fbbd32f2ace1e80_65_0.png)


    # 图 2.11


    增强数据集中随机选取的示例。该数据集包含具有不均匀热物理属性的样本。对于主动情况，热源密度定义为


    ```

    $q (r) = A_x(x-x_1)^2 - a_y(y-y_1)^2 - a_z(z-z_1)^2, \quad (2.35)$

    ```


    其中参数值与方程 2.33 相同。图 2.11 展示了增强数据集中的几个示例。发送到商业软件 COMSOL Multiphysics 中计算相应的温度分布，作为目标。


    ## 2.3.3 网络架构


    构建数据集后，高效神经网络对于训练是必不可少的。所提出的框架主要基于 U-net [33]，它最早由研究人员引入医学图像分割。它被广泛应用于输入和输出之间存在空间连接的问题。图
    2.12 显示了经典 U-net 的结构，它由全卷积网络组成。由于不包含任何全连接结构，U-net 可以在减少 GPU 资源的情况下处理数据。整个架构由对称的收缩路径和扩展路径组成，类似于
    T。


    在本章研究的热问题中，输入和输出都是为 $32 \times 32 \times 32$ 的三维矩阵，其中输入矩阵代表几何和热物理属性，而输出矩阵表示稳态温度场。所提网络的特定结构如图
    2.13 所示。考虑到本研究涉及的 Laplace 方程是三维的，卷积核设置为 $3 \times 3 \times 3$。与图 2.12 类似，该框架也包含了收缩路径和扩展路径。收缩路径包括四个模块，每个由两个
    $3 \times 3$ 的卷积层组成，其中步长为二，每次下采样后输出通道数翻倍，输入尺寸缩小为原来的 1/8。对于扩展路径，同样由四个模块组成，每个由上采样结构和转置卷积结构组成。每次上采样后，输出通道减半，输入尺寸增加
    8 倍。为了增加网络的非线性，在每次卷积或转置卷积后添加了 ReLU 激活函数。在网络的底部，引入步长为一的 $3 \times 3 \times 3$ 卷积层来连接收缩路径和扩展路径。此外，在相应的下采样和上采样层引入跳跃连接以增强训练过程的稳定性。与传统卷积相比，所提工作适当修改以适应三维问题。首先，利用平均值而非最大池化来实现下采样。这是因为平均值更关注整体热物理参数，而最大池化倾向于关注特征（例如界面）。如图
    2.14 所示，平均值在每次操作中提取当前窗口内的平均值。


    ![](img/020125e0e698f9771fbbd32face1e80_67_0.png)


    # 图 13

    所提框架的架构。结构包括收缩路径和扩展路径，每个包含 4 个模块。引入跳跃连接以连接收缩路径和扩展路径。


    ![](img/020125e0e698f9771fbbd32face1e80_67_1.png)


    # 图 14

    池化操作的示意图。假设 $b_j$、$a_j$ 和 $N$ 分别是池化层的输出、池化层的输入以及池化操作涉及的单元数。


    ![](img/020125e0e698f9771fbbd32face1e80_68_0.png)


    **图 15**

    残差模块的结构。它具有：


    $b_j = \frac{1}{N} \sum_{i=1}^{N} a_i \quad (2.36)$


    此外，网络还引入了残差模块（如图 15 所示）以消除饱和。众周知，随着网络深增加，精度会饱和并迅速下降。惊讶的是，这种退化并不是过拟合引起的，引入残差结构可以缓解这一现象。假设要拟合的最终函数为
    $\mathcal{H}(x)$，网络首先拟合 $\mathcal{F}(x) = \mathcal{H}(x)-x$。那么原始的 $\mathcal{H}(x)$
    可以表示为 $\mathcal{F}(x)+x$。相关研究表明，拟等等映射比直接拟合函数容易得多。此外，通过跳跃连接可以方便地实现 $\mathcal{F}(x)+x$，极大增强了残差结构的实用性。因此，构建超过100层的深度网络成为可能的


    ## 2.3.4 损失函数


    对于监督学习，损失函数是从假设空间 $\mathcal{F}$ 中选择的用于测量误差的非负实值 $f$。在网络训练期间，优化方向由损失函数的梯度决定，因此合适的损失函数对于训练至关重要。列出几种常用的损失函数：


    - A. 0-1 损失函数


    0-1 损失函数是最简单的损失函数，可以定义为


    ```

    $L(y, f(x)) = \begin{cases} 1 & y \neq f(x) \\ 0 & y = f(x) \end{cases} \quad
    (2.37)$

    ```


    0-1 损失函数容易计算，因此常用于感知机。然而，由于它不是凸函数，不能直接在机器学习中使用。


    - B. 交叉熵损失函数


    交叉熵损失函数是二分类中最常用的损失函数，其定义为：


    ```

    $L(y, f(x)) = \sum_{i=1}^{n} y_i \log(f(x_i)) + (1 - y_i) \log(1 - f(x_i)) \quad
    (2.38)$

    ```


    该函数通常与 Sigmoid 激活函数结合以解决梯度饱和问题。


    - C. Hinge 损失函数


    Hinge 损失函数的标准形式如下：


    ```

    $L(y, f(x)) = \max(0, 1 - y(x)) \quad (2.39)$

    ```该函数具有良好的鲁棒性，对离群点和噪声不敏感。然而，其缺陷是缺乏概率理论的支持。


    - D. 指数损失函数


    指数损失函数的定义如下：


    ```

    $L(y, f(x)) = \sum_{i=1}^{n} e^{-y_i f(x_i)} \quad (2.40)$

    ```


    该函数被应用于 Adaaboost。从训练的角度来看，该函数倾向于惩罚离群点并赋予它们更大的权重，这以牺牲正常数据点的预测效果为代价的可能会降低模型的整体性能或降低鲁棒性。图
    2.16 显示了上述四个函数的曲线，它们主要用于分类问题。对于回归问题，还列出了几种常用的损失函数：


    - A. 均方损失

