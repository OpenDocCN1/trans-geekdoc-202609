    With the temperature increases, the mean path is restricted by phonons, thus the
    thermal conductivity tends to reduce. In fact, the thermal conductivity $k$ and
    the electrical conductivity $\sigma$ has the following:


    $L = \frac{k^2}{\sigma} = 2.44 \times 10^{-8} W\Omega K^{-1}$ (5)


    Where $e$ is the charge of an electron. For non-metals, the heat transfer is accomplished
    through the vibrations of the lattice (or other words). The thermal conductivity
    of these materials lacks appropriate theory, hence has to be measured. Broadly
    speaking, the experimental approaches to determine the thermal conductivity can
    be divided into two categories, namely the steady-state and transient ones. For
    steady-state methods, the thermal conductivity can be inferred from measurements
    of the steady state, while transient techniques rely on temperature history. It
