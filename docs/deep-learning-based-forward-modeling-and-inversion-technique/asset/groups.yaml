    PDE：


    $$\mathcal{L}(u)(\gamma)=f(z), z \in \Omega$$

    $$\mathcal{B}(u) = g(z), z \in \partial\Omega$$

    $$\mathcal{D}(u) = d(z), i \in \mathcal{D}$$


    在这里，$z$ 包含 PDE 所描述的空间和时间坐标。$L$ 描述了 PDE，$\gamma$ 是参数而 $u$ 是解。边界和初始条件标记为 $\mathcal{D}$。与求解方程的传统数值算法相比，PINN
    的目的是通过近似 $u$ 来满足


    $$u_{\theta}(z) = f_L \circ f_{L-1} \circ \dots \circ f_1(z)$$


    每一层都是线性变换和激活函数的组合。考虑到 $z$ 包含了时空信息，通过自动微分操作来实现。PINN 的损失函数包含三部分，即方程损失 $\mathcal{E}_L$、边界损失
    $\mathcal{E}_B$（包括初始值）和测量点损失 $\mathcal{E}_D$。


    $$\mathcal{E} = \mathcal{E}_L + \mathcal{E}_B + \mathcal{E}_D$$


