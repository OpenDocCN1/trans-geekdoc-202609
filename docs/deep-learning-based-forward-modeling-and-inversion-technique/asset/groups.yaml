    ### 2.3.2.1 热物理参数


    材料的热物理参数包括三项：热导系数 $k$、定热容 $C_p$ 和密度 $\rho$。热导系数定义为单位时间内通过导热面积传递的热量，而定热容定义为恒压下单位质量随温度变化而吸收或释放的热量。这三个参数在某一温度范围内通常可以忽略。表
