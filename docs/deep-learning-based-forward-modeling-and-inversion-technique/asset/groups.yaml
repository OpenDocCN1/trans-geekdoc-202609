  - '[PAGE 49]


    # 2


    # Application of U-Net in 3D Steady Heat Conduction Solver


    Heat conduction is one of the three basic modes of heat transfer persistently
    exists in a wide variety of engineering fields. As this physical process can be
    quantitatively described by the heat conduction equation, how to solve this partial
    differential equation (PDE) has become the core of the research. Since the publication
    of ‘The analytical theory of heat’ in 1922, a series of methods have been proposed
    by researchers. Among them, analytical methods are only applicable to objects
    with highly symmetrical geometry while numerical methods are more practical in
    real-site situations. Unfortunately, numerical methods are resource-demanding
    and computationally cumbersome, which is incompetent when encountering real-time
    scenarios. Recently, emerging deep learning (DL) techniques have shown emerging
    ability in real-computation physics. Therefore, it is a natural question whether
    the DL technique can be implanted into the realm of heat conduction. This chapter
    provides a clear view of using the DL technique to establish a complete path to
    solve 3D passive/active heat conduction problems. In the beginning, traditional
    algorithms together with their advantages and disadvantages will be introduced.
    Then, several works pertaining to using DL techniques to solve heat conduction
    problems are mentioned in the second part. Additionally, detailed information
    about the construction, training, and testing is discussed in the last part.


    # 2.1 Traditional Methods


    Traditional methods [1, 2, 3, 4] for solving the 3D steady heat conduction problem
    mainly include analytical methods and numerical methods. Although the analytical
    methods are accurate and fast in computation, one of the fatal defects is that
    they can only deal with symmetric geometries, which undoubtedly limits the application.
    For general heat conduction problems, numerical methods are more widely used.
    In this section, several analytical and numeric methods are introduced briefly.


    DOI: 10.1201/9781003397830-2


