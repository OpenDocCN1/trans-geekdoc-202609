    ## 2.3.4 Loss Functions


    For supervised learning, the loss function is a nonnegative real value $f$ selected
    from hypothesis space $\mathcal{F}$ to measure predicting error. During network
    training, the direction of optimization is determined by gradient of loss function,
    hence an appropriate loss function is significant in training. Several commonly
    used loss functions are listed below:


    - A. 0-1 loss function


    0-1 loss function is the simplest loss function, which can be defined as


    ```

    $L(y, f(x)) = \begin{cases} 1 & y \neq f(x) \\ 0 & y = f(x) \end{cases} \quad
    (2.37)$

    ```


    0-1 loss function is easy to calculate and hence commonly used in perceptrons.
    However, since it is not a convex function, it cannot be used directly in machine
    learning.


    - B. Cross-entropy loss function


    Cross entropy loss function is the most commonly used loss function in binary
    classification, which is defined


    ```

    $L(y, f(x)) = \sum_{i=1}^{n} y_i \log(f(x_i)) + (1 - y_i) \log(1 - f(x_i)) \quad
    (2.38)$

    ```


