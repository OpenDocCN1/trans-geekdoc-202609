    # 基于深度学习的前向建模与反演技术


    以及相应的 FEM 算法，随后介绍了相关傅里叶网络的详细架构。接下来，讨论了三种不同场景下的多物理过程。利用一系列测试用例展示了深度学习（DL）框架的性能。


    ## 5.3.1 方法


    在此部分，详细介绍了级联傅里叶网络及其每个模块。此外，提到了物理模型以及相应的偏微分方程（PDE）。另外，展示了数据生成过程以及 FEM 算法。最后讨论了训练过程。


    ### 5.3.1.1 框架架构


    此处，所提深度学习框架的架构如图 5.10 (a) 所示，由两部分组成：输入模块和傅里叶模块。在这里，输入模块从边界提取有效特征以获得直接相关的场。输入框架的主要结构基于
    onetnet，它由多个全连接层、转置卷积层卷积层组成。为了归一化输出并增加每层的非线性，添加了批归一化层（batch norm）和激活函数。傅里叶模块是网络的核心，执行从一个物理场到另一个物理场的算子学习。


    该架构由 Liu 等提出，它在傅里叶空间中深度参数化了积分核。与仅仅学习如何求解方程的传统深度学习框架或 PINNs [12] 不同，傅里叶网络学习的是算子本身，展现了高泛泛化能力。如图
    5.10 (b) 所示，傅里叶架构可以进一步分为两部分。一个包含傅里叶变换；一个哈达玛矩阵乘法层后跟逆傅里叶变换层。另一个是哈达玛矩阵乘法层。输入被分为上下部分，两部分的输出首先相加，然后通过非线性函数激活。


    可以验证，每个傅里叶模块的输入和输出完成如下：


    ```

    $u_o(x) = \sigma\left(Bu_u(x) + \mathcal{F}^{-1}\{AF[u_u(x)]}\right)\quad(5.27)$

    ```


    其中 $\mathcal{F}$ 和 $\mathcal{F}^{-1}$ 表示正向和逆傅里叶变换算子，


    ```

    $$\mathbf{X}(u,v) = \sum_{m=0}^{M-1} \sum_{n=0}^{N-1} \chi(m,n) e^{-2\pi i(\frac{mu}{M}
    + \frac{nv}{N})}\quad(5.28)$$

    ```


    ```

    $$\chi(m,n) = \frac{1}{MN} \sum_{u=0}^{M-1} \sum_{v=0}^{N-1} \mathbf{X}(u,v) e^{2\pi
    i(\frac{mu}{M} + \frac{nv}{N})}\quad(5.29)$$

    ```


    ![](img/020125e0e698f9771fbbd32f2ace1e80_177_0.png)


    图 5.10


    傅里叶网络架构：(a) 网络整体组成，包括输入模块和傅里叶模块；(b) 用于近似非线性阶的傅里叶网络；(c) 跳跃连接中的注意力机制，强化了高相关区域的数据。


    其中 $M$ 和 $N$ 分别是对应矩阵的行数和列数。事实上，傅里叶变换算子将卷积转换为乘积，能够通过 FFT 加速。这些技术降低了计算复杂度并实现了大规模计算。


    在所提方法中，采用了某些先进技术来增强性能。受到 Resnet [60], [62] 跳跃连接结构的启示，两个相应的输入/输出傅里叶模块之间存在对比 [60,
    62]。跳跃连接结构接触了低层模块提取的特征。然而，跳跃模块为了维持高分辨率会损害深度网络中的逻辑。实际上，出现了空间物理场。因此，在网络中引入了注意力机制，它在减少某些区域分辨率的同时放大了高度相关区域的信息。跳跃连接的具体架构如图
    5.10 所示，被设计为完成注意力机制的权重选择器。在这里，注意力模块可以表示为：


    ```

    $Attention(Q, K, V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)V \quad
    (30)$

    ```


    其中 $Q, K, V$ 分别是查询、键值矩阵，$d_k$ 是缩放因子。事实上，注意力机制的详细步骤如下：首先，利用查询和键矩阵获取权重。接下来，将场相加以获得最终输出。值得注意的是，这种机制使网络连接关键部分，并忽略冗余部分。在某些极端情况下，注意力机制能够确保框架的性能。


    ### 5.3.1.2 物理模型


    在第一个模型中，温度和电位是需要计算的物理场。注意这两个场之间存在强耦合。此处，采用了电流连续方程和导热方程：


    ```

    $\nabla \cdot (-\sigma\phi) = 0$

    ```


    ```

    $\rho_C \frac{\partial T}{\partial t} - \nabla \cdot (k\nabla T) = Q$

    ```


    其中 $\sigma$ 和 $\phi$ 分别是电导和电位，而 $\rho, C_p, k$ 和 $Q$ 分别是密度、热容、热系数和热密度。在第二个模型中，电位和电子浓度是相关场，相应的方程是电流连续方程和传输方程：


    ```

    $\nabla \cdot (-\sigma\phi) = 0$

    ```


    ```

    $\frac{\partial n}{\partial t} + \nabla \cdot (D\nabla n) = 0$

    ```


    其中 $n, \nu$ 和 $D$ 分别是电子浓度、漂移速度和扩散速度。在第三个模型中，速度场和温度场被分析，符合对流-扩散方程和 Navier-Stokes
    (N-S) 方程：


    ```

    $\rho_C \mathbf{u} \cdot \nabla T - \nabla \cdot k\nabla T = 0$

    ```


    ```

    $\rho \left( \frac{\partial \mathbf{u}}{\partial t} + \mathbf{u} \cdot \nabla\mathbf{u}
    \right) = -\nabla p + \nabla \cdot \left[ \mu(\mathbf{u} + \mathbf{u}^T) \right]
    - \frac{2}{3}\mu\nabla\mathbf{u} \cdot \mathbf{u} + \rho\mathbf{g}$

    ```


    其中 $\mathbf{u}, p, \mu$ 和 $\mathbf{g}$ 分别是速度、压力强度、动力学粘度和重力常数。


    ### 5.3.1.3 数据生成


    在此部分，通过 MATLAB 实现 COMSOL 获取训练数据。该软件基于有限元方法 (FEM)。此处，利用 FEM 求解电热模型的详细步骤如下：


    首先，求解区域被分为 $E$ 个单元，每个单元有 $p$ 个节点。每个单元的温度和电位可以通过节点的场插值表示：


    ```

    $T = \sum_{i=1}^{r} N_i(x, y, z) T_i^{(e)} = [N]^{(e)}$

    ```


    ```

    $\phi = \sum_{i=1}^{r} N_i(x, y, z) \phi_i^{(e)} = [N]^{(e)}$

    ```


    导热和电连续性的弱形式可以表示为：


    ```

    $\int_{\Omega} \rho_c \phi \frac{\partial T}{\partial t} d\Omega + \int_{\Omega}
    k \nabla T \cdot \nabla T d\Omega = \int_{\Omega} \omega_i |\nabla \phi|^2 d\Omega$

    ```


    ```

    $\int_{\Omega} \omega_i |\nabla \phi|^2 d\Omega = 0$

    ```


    每个分量可以表述为：


    ```

    $K_{Tij}^{(e)} = \int_{\Omega} (k_x \frac{\partial N_j}{\ x} \frac{\partial N_i}{\
    x} + k_y \frac{\partial N_j}{\ y} \frac{\partial N_i}{\ y}) dV$

    ```


    ```

    $K_{Tij}^{(e)} = \int_{\Omega} k \nabla N_j \cdot \nabla N_i dV$

    ```


    ```

    $Q_i^{(e)} = \int_{\Omega} \omega_i |\nabla \phi|^2 d\Omega$

    ```


    ```

    $K_{\phi ij}^{(e)} = \int_{\Omega} (\sigma_x \frac{\partial N_j}{\ x} \frac{\partial
    N_i}{\ x} + \sigma_y \frac{\partial N_j}{\ y} \frac{\partial N_i}{\ y}) dV$

    ```


    其中 $K_{Tij}$、$K_{\phi ij}$ 是导热和时变项。热源记为 $Q$。组装矩阵为：


    ```

    $[K_T]{T}=\{P\}$

    ```


    ```

    $[K_{\phi}]{\phi}=\{Q\}$

    ```


    其中 $T, \phi$ 和 $P$ 分别代表温度、电位和负载向量。通过在 PDE 上施加边界条件，可以求解相应的方程获取物理场。每个物理模型通过指定不同的边界条件共计生成了
    6000 个样本。这里，2/3 的数据集用于训练。


    '
