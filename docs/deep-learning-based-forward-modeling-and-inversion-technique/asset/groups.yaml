    # 计算物理中的高级深度学习技术


    ![](img/020125e0e698f9771fbbd32f2ace1e80_185_0.png)


    图 5.16

    封闭空腔的预测结果。(a) 由 COMSOL 计算的 |w|，(b) 框架预测的 |v|，(c) 绝对误差，(d) 由 COMSOL 计算的 $T_{norm}$，(e)
    框架预测的 $T_{norm}$，以及 (f) 绝对误差。

    其中 $N$、$u_*$ 和 $u_h$ 表示采样点总数、真值和预测场。为了检测误差的统计分布，引入了小琴图，其结果如图 5.17 所示。在这里，子图的宽度表示概率密度。显然，对于大多数样本，相对误差不超过
    0.01，有效证明证明了网络的鲁棒性。


    ## 5.3.2. 比较


    在这部分，通过实验来突显所开发的傅里叶网络的优势。将预测精度与不同分辨率下的两种传统网络进行了比较。为了实现这一点，通过全连接网络（FCN）和卷积神经网络（CNN）对第一个实验中的温度计算进行了研究。收集了分辨率从
    $16^2$ 到 $128^2$ 结果的平均均方误差（MSE）。注意的是，这三个网络的基准是足够密网格的计算成本。很清楚的是，级联傅里叶框架的 MSE 比
    FCN 和 CNN 低 10 倍以上。此外，传统的 CNN 或 FNN 关注于数据拟合，而傅里叶网络旨在算子学习，平均 MSE 几乎与网格密度无关。相比之下，传统
    CNN 的平均 MSE 由于框架更加复杂而随分辨率增加而增加。因此，可以在稀疏网格上训练所提出的架构而在密集网格上进行测试，从而节省计算资源。


    在乘法中实现深度学习技术的另一个关键问题是，它通过充分利用 GPU 的并行计算能力实现了比传统方法更预测，使得同时计算大量样本变得可行。为了定量测量计算速度，统计了通过有限元法（FEM）和训练良好的框架处理
    1000 个样本的时间消耗（输入结构和傅里叶结构的总时间）。如图 5.18 所示，框架处理 1000 个样本平均需要 7.48 秒（输入框架需要 1.53
    秒，傅里叶框架需要 5.9 秒）。对于基于 FEM 的软件，需要花费 185 分钟，慢 1500 倍。此外，尽管傅里叶框架在使用之前需要一些时间生成数据和训练，但该过程是一次性的。也就是说，一旦完成离线训练，就可以进行在线预测。


    ## 5.4 结论


    在本章中，研究了高级深度学习技术在计算物理中的若干应用。首先，讨论了物理信息框架，包括基于全连接和基于卷积的架构。此外，讨论了正交曲线坐标系中的 PINNs，包括圆柱、球和抛物线坐标中的瞬态问题。之后介绍了图神经网络及其在静电学中的应用。由于非结构化网格应用于
    GNN，它可以适用于更通用的科学计算问题。在章的最后一部分，介绍了基于算子的傅里叶网络。计算结果充分证明了所开发的框架可以实时获取预期的多物理场。此外，傅里叶架构在不同分辨率下表现出一致的平均误差率，在许多计算场景中具有一定的采用潜力。总之，新开发的先进深度学习技术在灵活性、通用性、效率和经济方面具有优点。因此，认为它们可以在某些计算物理任务中替代传统的数值算法或经典的深度学习架构。


