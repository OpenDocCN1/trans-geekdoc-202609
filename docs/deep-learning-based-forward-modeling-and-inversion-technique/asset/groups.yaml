    The structure of residual module. It has


    $b_j = \frac{1}{N} \sum_{i=1}^{N} a_i \quad (2.36)$


    In addition, the network also introduces a residual module (shown in Figure 2.15)
    to eliminate precision saturation. As well-known, deep neural networks often suffer
    from degradation problems. With the increase network depth, precision gets saturated
    and then degrades rapidly. Surprisingly, this degradation is not caused by overfitting,
    and introduction of residual structure can alleviate this phenomenon. Assuming
    that the final function to be fitted is $\mathcal{H}(x)$, and the network first
    fits $\mathcal{F}(x) = \mathcal{H}(x)-x$. Then the original $\mathcal{H}(x)$ can
    be expressed by $\mathcal{F}(x)+x$. Related research has demonstrated that fitting
    identical mapping is much easier than direct fitting functions. Besides, the operator
    $\mathcal{F}(x)+x$ can be conveniently achieved by skip connection, greatly enhancing
