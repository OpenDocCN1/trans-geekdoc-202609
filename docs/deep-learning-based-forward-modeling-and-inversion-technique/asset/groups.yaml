    现有的深度学习框架显示了卷积算法在计算速度方面的缺陷。它们大多数仍然局限于 1D 或 2D 几何形状，并且始终受限于解决特定的反演任务（即与温度相关或与空间相关的案例）。在实际应用场景中，IHCP
