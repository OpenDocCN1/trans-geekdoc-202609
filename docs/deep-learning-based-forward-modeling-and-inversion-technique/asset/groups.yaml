    # 基于深度学习的正向建模与反演技术


    ![](img/020125e0e698f9771fbbd32f2ace1e80_80_0.png)


    图 2.25


    被动案例的训练曲线。


    ## 2.3.6 结果


    在构建所需数据集并建立网络后，就可以开始训练过程。训练在 Windows Server 2019 上，使用配备 Intel Xeon Silver 4214
    CPU 和 GeForce RTX 2080 Ti（显存:11G）GPU 的 Dell Precision 工作站 7920 通过 TensorFlow 2.0
    [35] 进行。在训练过程中，分别记录训练集和测试集的损失值。一旦这些值下降到较低水平时，认为网络训练成功。随后，利用测试集来衡量网络性能。本节包含两个模块，分别讨论了被动和主动案例的训练曲线、数值结果、泛化能力、统计分析和计算加速。


    ### 2.3.6.1 被动案例


    - A. 训练


    如前所述，被动案例有三个数据集，即基础数据集、增强数据集和开源数据集，其中仅对前两个进行了训练。图 2.25 清晰地展示了训练集和测试集的损失。


    在实验中，分别训练了基础数据集中的70%（共12000个样本）和增强数据集中的20000个样本。经过约 $1.5 \times 10^5$ 次迭代（epochs）和
    6 小时后，两个训练过程均达到收敛。


    - B. 数值结果


    ## U-Net 在三维稳态热传导求解器中的应用


    训练完成后，利用测试样本评估网络性能。为了直观地展示预测能力，图 2.26 和图 2.27 展示了从基础数据集和增强集中随机选取的示例。在图 2.26 中，反映了物体的材料。标签与时间属性之间的对应关系如表2.3
    所示。在图 2.27 中，(a) 直接指示了增强数据集中的热系数。图 (b)、(c) 和 (d) 分别代表了由商业软件 COMSOL 计算的温度分布、框架预测的温度分布以及绝对误差。绝对误差定义为：


    ```

    $T_e = |T_j - T_f|$

    ```


    值得注意的是，图 2.26 中每个像素的大小和颜色可以得出结论：网络的预测值与 COMSOL 的计算结果一致良好，两者之间的误差很小。


    - C. 泛化能力


    尽管深度学习技术具有高精度和计算速度快等许多优点，但它也有缺点。一个致命缺陷是经常遇到过拟合现象。换句话说，当输入数据与训练集相似时，框架只能给出一个结果。因此，必须确认网络实际上学习了数据背后的物理规则，而不仅仅是背诵了训练数据集中的样本。泛化能力的常用标准之一是指模型妥善适应未见数据的能力。在本研究中，引入了一个与基础数据集相比包含更多样本的开源数据集。中的每个样本包含多个属性，因此网络更难处理。


    图 2.28 展示了从开源数据集中随机选取的样本。这里，(a) 表示材料类型（标签 (b) 的热物理属性见表 2.3）。(b) 和 (c) 分别显示了由 COMSOL
    计算和由框架预测的温度场，而 (d) 是 (b) 和 (c) 之间的绝对误差。值得注意的是，测试的网络是在基础数据集上训练的。可以发现，尽管网络从未遇到类似的样本，但它仍然给出了相对准确的预测，这充分证明了网络的鲁棒性。


    - D. 统计分析


    在上节中，通过图表展示了预测能力的数值示例。为了定量地展示网络的预测


    引入了相对误差率。假设 $i$ 是像素的序列号，相对误差定义为：


    ```

    Err(i) = \frac{|T_r(i) - T_p(i)|}{T_r(i)} \quad (2.64)

    ```


    其中 $T_r(i)$ 和 $T_p(i)$ 分别是 COMSOL 计算和网络预测的温度。平均相对误差公式为：


    ```

    $Err_{ave} = \frac{|\sum_{i=1}^{N} Err(i)|}{N} \quad (2.65)

    ```


