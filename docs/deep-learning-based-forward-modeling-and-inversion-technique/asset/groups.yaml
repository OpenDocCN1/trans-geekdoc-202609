    neuron as follows:


    $C_t = f_t \circ C_{t-1} + i_t \circ \hat{C}_t$


    The final output $h_t$ of the network will be to set the output and the next neuron,
    respectively to participate in controlling the forgetting gate. Therefore, $h_t$
    and $o_t$ meet the following expressions:


    $H_t = o_t \circ \tanh(C_t)$


    $o_t = \sigma(W_o \cdot [h_{t-1}, x_t] + b_o)$


