    ## 基于深度学习的正向建模与反演技术


    Peng 等人 [28] 通过结合卷积神经网络并创新性地提出符号距离函数，成功解决了二维稳态热传导问题。所提出的架构基于 U-net，包含五个卷积层和反卷积层，如图
    2.1 (a) 所示。图 2.1 (b) 展示了热传导模型，其中位于区域内的物体是一个高温度热源。内、外表面均满足狄利克特边界条件。值得注意的是，该框架的输入不是几何形状，而是一个符号距离函数
    $D(r)$，其定义为：


    ```

    $D(r) = \min |r - r''| \text{sign} \Phi(r) \quad (2.28)$

    ```


    其中 $r$ 是求解区域内的点，$r''$ 是边界上的点。如图 2.1 (b) 所示，$\Phi(r)$ 是一个指示函数，在热源外部、热源处分别取正数、零和负数；$sign$
    是一个将 $\Phi$ 映射到 -1、0 和 1 的符号函数。这种巧妙的设计通过热源对解的影响，提取了求解区域内点与高温边界之间的最近距离，为网络提供了更有价值的信息。图
    2.1 (c) 显示了与图 2.1 (b) 对应的符号距离函数。


    此外，图 2.1 (d)、(e) 和 (f) 分别展示了商业软件计算的、网络预测的温度分布以及绝对误差。可以发现，网络在一定程度上准确地预测了温度分布，图
    2.1 (e) 中的绝对误差较小。此外，作者还引入了一个开源测试集来衡量网络的泛化性能，误差仍处于可接受范围内。


    Zakeri 等人 [29] 通过多层全连接网络解决了二维稳态热传导问题。热传导模型如图 2.2 (a) 所示，其解是一个开挖了三个小矩形的矩形空间。矩形的大小和位置可以通过随机生成的参数进行控制。因为传导满足每个条边上具有给定温度的狄利克特边界条件。由于求解区域的确定性条件仅由少数参数决定，作者采用了多层全连接网络而非基于像素的卷积神经网络，这双倍了网络的训练难度并加速了其收敛。如图
    2.2 (b) 所示，框架的输出是矩形的几何参数和边界温度，而输入是求解区域内每个点的温度。图 2.2 (c)、(d) 和 (e) 分别显示了商业软件 ANSYS
    计算的温度分布、网络预测的温度分布以及两者之间的差异。可以发现，网络能够准确预测温度场分布。


