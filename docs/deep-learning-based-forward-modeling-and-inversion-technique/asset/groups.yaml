    | 20 | 40.1 | 48.1 | 40.1 | 47.9 | 40.1 | 48.0 |

    | 30 | 45.5 | 50.0 | 45.5 | 50.5 | 50.5 | 50.3 |


    对于 SVD 算法，当噪声为 0, 5, 10, 20 和 30dB 时，使用前 1, 2, 3, 5 和 7 个奇异值来重建温度数据。对于小波变换，使用两次小波分解来过滤高频噪声。可以观察到，当高斯误差较高时，U-net
    在 PSNR 方面的表现优于 SVD 和小波变换。事实上，U-net 最关键的优势是其计算速度。表 4.3 显示了计算 100 个样本的时间消耗。


    可以结论，与传统方法相比，U-net 在确保性能的情况下可以实现一个一个数量级的加速。


