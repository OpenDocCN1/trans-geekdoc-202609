    $T(x, y, z, t)$。在输入层和输出层之间存在隐藏层。对于来自内部求解区域的采样点，边界条件和初始条件是必要的。它们的数量分别为 $N_f, N_s$
    和 $N_t$。此外，对于内部或边界点，在计算损失函数时还需要热导率 $k$、其梯度 $\nabla T$ 以及表面的单位法向量 $n$。


    在本节中，引入了算子以简化表达式。假设 $\mathcal{L}_t$ 是一个一阶微分算子：


    $$\mathcal{L}_tT = n \cdot (k\nabla T) + h(T - T_0).$$


    由于 $n \cdot (k\nabla T) = k\partial T/\partial n$，方程 4.22 和等式 21 保持不变。


    ### 4.3.4 基于深度学习的正向建模与反演技术


    令 $L_a$ 为二阶微分算子：


    $$L_a T = \nabla \cdot (k\nabla T) - \rho C_p \frac{\partial T}{\partial t} +
    P. \quad (23)$$


    热传导方程可以表示为：


    $$L_a T(\mathbf{r}; t) = 0, \quad r \in \Omega, \text{ and } t \geq 0, \quad (24)$$


    Robin 边界条件和初始条件可以重写为：


    $$L_b T(\mathbf{r}; t) = 0, \quad r \in \partial\Omega, \text{ and } t \geq 0,
    \quad (25)$$


    $$T(\mathbf{r}; 0) = T_0(\mathbf{r}), \quad r \in \Omega, \text{ and } t = 0.
    \quad (26)$$


    损失函数对于利用 PINN 求解 PDE 至关重要，一个设计的损失函数不仅能提高训练速度，还能产生更精确的收敛。然而，由于 $L_2$ 损失的鲁棒性差，二阶微分项引起的离群值会对网络训练产生负面影响。因此，必须引入平衡项来抑制离群值的影响。这里使用
    $L_{\infty}$ 范数来保证更稳定的训练过程。因此，最终函数 $F(T)$ 可以描述为：


    $$F(T) = \lambda_1 ||L_a T||_2^2 + \lambda_2 ||L_a T||_{\infty} + \mu ||L_b T||_2^2
    + \eta ||T - T_0||_2^2 \quad (27)$$


    其中 $\lambda_1, \lambda_2, \mu$ 和 $\eta$ 是变量。注意，前两项通过 PDE 强制物理约束，而第三项 $L_b T$ 和第四项
    $||T - T_0||_2$ 实现边界和初始条件。为了控制损失，热传导模型的热导率 $k$ 及其导数 $k_x, k_y$ 和 $k_z$ 直接输入框架参与计算。建立的
    PINN 求解器能够生成大量数据用于训练和测试。在实验中，热传导模型具有相同的几何形状和热分布。数据生成过程使用 PyTorch [25] 完成，训练在配备
    Dell 7920 工作站的 NVIDIA RTX 2080 Ti 显卡上进行。学习率、合适的优化器和激活函数至关重要。需要注意的是，对于平滑的 PDE，L-BFGS
    [26] 可以比 Adam [27] 用更少的迭代寻找优解。然而，对于刚性解，L-BFGS 倾向于陷入局部最优。此外，还观察到通过自适应激活函数可以实现训练加速。


    图 4.8 显示了二维情况下采样点数量与平均误差之间的关系。显而易见，采样点越多，PINN 的精度越高，平均误差越小。左图显示了平均误差随着采样点增加趋于稳定的过程。右图
    (a) 和图 (b) 分别展示了预测结果和误差。


