    # # Preface


    Computational physics is the third branch of modern physics beyond experimental
    physics and theoretical physics. It is an emerging discipline that implements
    computers as tools and applies appropriate mathematical methods to calculate physical
    problems. Numerical modeling of either steady or transient processes of computational
    physics finds a plethora of applications in diverse realms, with practical impact
    on electromagnetics, optics, thermology, hydrodynamics, quantum mechanics, and
    so on. Traditional wisdom assisting in the modeling procedure is derived from
    applied mathematics, where a series of numerical algorithms, such as the finite
    difference method (FDM), the finite element method (FEM), and the method of moments
    (MOM), have been proposed to resolve the differential integral equations related
    to multiple systems. Nevertheless, all the aforementioned approaches encounter
    the same dilemma when dealing with computational scenarios. Under these circumstances,
    the physics boundaries along with the constraint equation of the system are discretized
    into a sophisticated matrix with high-dimensional space and millions of unknown
    variables. Although the traditional algorithms may supply feasibility to conquer
    the task, the computational efficiency can be the bottleneck. Generally speaking,
    thousands of hours for calculation might hinder researchers from large-scale simulation
    processes demanding a real-time response.


    The deep learning (DL) has come into the stage of scientific computing in recent
    years. The most evident idea behind the DL technique in scientific computing is
    data-driven modeling, where the conventional solving merely serve to generate
    sufficient data for DL algorithms to learn the underlying physics during the training.
    however, the relation in any forward or inverse function with numerous variables
    is able to be faithfully approximated via training, rather than resource-demanding
    and time-consuming numerical calculation. In terms of computational speed, the
    well-trained DL algorithms surpass conventional approaches by orders of magnitude
    in forward analysis. However, purely data-dependent DL frameworks represent black
    boxes, in which training samples are indispensable to yield a satisfactory output.
    To this end, the physics-informed neural networks (PINN) are proposed which enable
    the physics constraint by automatic differential scheme or difference kernels.
    The method of PINN is analogous to solving by conventional numerical algorithms,
    which encode the boundaries'
