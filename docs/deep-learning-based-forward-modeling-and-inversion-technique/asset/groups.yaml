    ## 5.3 傅叶神经网络


    多物理场通常指多种物理场同时存在，这在许多领域中无处不在 [43, 44]。多物理涵盖了广泛的领域，包括数学、流体力学、热学、电磁学。为了分析多物理模型，求解耦合偏微分方程至关重要。为了处理这些方程，研究提出了大量的数值算法。


    有限差分法（包括 FDTD 和 FDBD）、有限元法和有限体积法是多物理场中最常见的数值算法 [45]。早在 20 世纪 90 年代，Dechaumpeau
    [46] 已经在不规则网格上实现了有限元法，以求解耦合能量方程、Navier-Stokes (N-S) 方程和平衡方程，获取温度、速度和应力场。他们的结果已通过两项实际研究证实。2005
    年，Monnier 等人 [47] 也采用有限元法模拟电-机-热耦合场，其结果得到了实验验证。此外，Wang 等人 [48] 将有限元时域法 (FETD)
    与线性热声学理论相结合，计算热冷机中的耦合压力、速度和温度场。该计算通过仿真软件和实验结果得到了验证。此外，Xue 等人 [49] 在 3D 案例中引入了使用光谱-电磁-热耦合建模的伽尔金时域法
    (DTGD)。证明该算法对于具有结构或动态变化的物体比传统方法具有更好的性能。最近在 2022 年，Li 等人 [50] 引入了有限元来计算粒子的导热方程和电阻随机存储方法中的电流连续性方程。这些方法可以在数值分析中产生精确解，但通常消耗资源大且计算繁琐。


    近年来，由于深度学习（DL）技术的繁荣，计算物理学蓬勃发展，这充分利用了 GPU 强大的并行计算能力和繁重的计算。事实上，DL 网络首先被用于解决单个物理任务。在静电学中，Shan
    等人 [51] 提出了一个基于卷积神经网络的 DL 框架来处理松方程以获取电位。该网络兼容 2D 和 3D 场景，相对误差率不超过 3%。在光学中，Li 等人
    [37, 38, 52, 53, 54] 提出了 U-net 来计算纳米金属粒子的近场散射场，在保持精度的同时实现了三个数量级的加速。2021 年，Wang
    等人 [55] 将之前的工作扩展到主动和被动情况下的 3D 稳态导热问题。他们在 2022 年配合基于 convLSTM 的热通量和温度反演，并将物理信息神经网络
    (PINN) 与非线性反馈网络 (NMM) 结合以重建复杂的热导率。


    最近，DL 方法已进入多物理场领域。例如，2021 年，Niaki 等人 [56] 实现了 PINN，通过求解反应方程和传热方程模拟复合材料的热化学过程。Bao
    等人 [57] 提出了 DeepM&Net，它首次通过其他场的输入来计算每个单独场。预测涉及速度、温度和密度。2022 年，Ma 等人 [58] 通过 DL
    方法研究了集成电路中的电热耦合效应，结果显示出高准确性。此外，Kasheli [59] 提出了物理信息 PointNet 来解决非结构化几何形状上不可压缩流的速度和温度，其合理性得到了解析解的证明。这些网络能够处理棘手问题，因此在应用中具有实用价值。然而，现有工作存在一些缺陷。例如，上述
    PINN 计算效率低且泛化能力差，一个网络仅适用于特定情况。如果边界或几何形状改变，网络需要重新训练。对于 DeepM&Net（基于 DeepOne），训练该框架非常繁琐，难以应用于现实。


    在实际场景中，如今对精度和实时性有要求。例如，为了监控电子设备的状态，必须基于边界获取电位和温度场以准确调优未来。此外，在昂贵设备的热流分析中，期望通过底座测量推断温度和流速，以实时评估工作状态。然而，传统方法或基于方程的
    DL 框架（即：PINN）对于其学习过程几乎是不可能的。此外，现有的监督学习网络（即：CNN 和 FCN）的计算误差随着网格密度的增加而增加，阻碍了获取精确解。然而，对于算子学习网络，DeepM&Net
    等先进工作具有复杂的训练程序，不利于实践。鉴于，提出了一种基于级联傅叶网络的新型框架来计算多物理场。开发的网络具有以下特征：


    - 1. 实时：成熟模型在完全训练后可以实时获取物理场。

    - 2. 高精度：基于算子的学习策略产生了与分辨率无关的高度独立性，因此适用于稠密网格。

    - 3. 高灵活性：DL 网络适应多种多物理场，而训练过程简洁。


