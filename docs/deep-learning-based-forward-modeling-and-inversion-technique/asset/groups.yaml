    标记为 $\Gamma$ 的二维有限差分格式如下：


    ```

    $u(i+1, j) - 2u(i, j) + u(i-1, j) + \frac{u(i, j+1) - 2u(i, j) + u(i, j-1)}{\delta^2}
    = 0 \quad \text{(1.16)}$

    ```


    因此，区域内任意点 $u(S)$ 的值可以被视为若干点的平均值。类似地，也可以为其他点建立近似方程。内部点 $S$ 与边界点之间的关系可以通过联方程组得到：


    ```

    $u(S) = \sum_{i=1}^{N_s} g(\Gamma_i)f(\Gamma_i) \quad \text{(1.17)}$

    ```


    在上述公式中，边界 $\Gamma_i$ 的值表示为 $g(\Gamma_i)$，其权重系数为 $f(\Gamma_i)$。因此，可以构建一组基于随机游走的概率模型来模拟上述求解过程。这里，假设有
    $N_s$ 个粒子从点 $S$ 开始，以独立的等概率沿网格随机行走，最终有 $N_i$ 个点到达边界 $\Gamma_i$。那么公式 17 可以重写为：


    ```

    $u(S) = \lim_{N_s \to \infty} \sum_{i=1}^{N_s} \frac{N_i}{N_s}g(\Gamma_i) \quad
    \text{(1.18)}$

    ```


    将用一个例子来说明蒙卡洛模拟方法在求解稳态热传导方程中的应用。在方形区域内，给定 Dirichlet 边界条件：


    ```

    $u=0, y=0 \text{ and } 1 \quad \text{(1.19)}$

    $u=\sin \pi y, x=0 \quad \text{(1.20)}$

    $u=e^{-\sin \pi y}, x=1 \quad \text{(1.21)}$

    ```


