    $L(y, f(x)) = \frac{1}{n} \sum_{i=1}^{n} |y_i - f(x_i)| \quad (2.42)$

    ```


    绝对损失具有高鲁棒性的优点，特别是对于离群点。然而，由于它在原点处不可导，因此是不稳定的。


    - C. 均方对数损失

    均方对数损失定义为：


    ```

    $L(y, f(x)) = \frac{1}{n} \sum_{i=1}^{n} |\log y_i - f(x_i)|^2 \quad (2.43)$

    ```


    均方对数损失适用于样本之间存在巨大差异的情况。


    - D. Huber 损失

    Huber 损失结合了均方损失和平均绝对损失，定义为：


    ```

    $L(y, f(x)) = \begin{cases} \frac{1}{2} |y - f(x)|^2, & |y - f(x)| \le \delta
    \\ |y - f(x)| - \frac{1}{2}\delta^2, & |y - f(x)| > \delta \end{cases} \quad (2.44)$

    ```


    ## U-Net 在三维稳态热传导求解器中的应用


    ![](img/020125e0e698f9771fbbd32f2ace1e80_71_0.png)


    ### 图 2.17

    回归问题的四种损失函数曲线。


    $\delta$ 是一个可调参数，决定了模型处理离群点的行为。当 $\delta$ 趋于 0 时，它退化为 MAE；而当 $\delta$ 趋于无穷时，Huber
    损失继承了 MAE 和 MSE 的优点，这不仅保持了损失函数的连续导数，而且对离群点表现出更好的鲁棒性。

    图 2.17 显示了回归问题的损失函数曲线。通过综合比较，后续研究采用了 Huber 函数。


    ### 2.3.5 预实验


    为了避免由于实验设计不当导致计算资源浪费，找到最佳实验条件非常有价值。一种常用方法是在正式实验之前，在带有可调超参数的小型数据集上进行预实验。本节主要关注激活函数、学习率、Dropout
    比例、划分比例、优化器等。


    ### 2.3.5.1 激活函数


    激活函数对于神经网络解释复杂系统至关重要，如果没有它，网络的输出将是输入的线性组合。激活函数为网络引入了非线性，使其能够近似任何函数。在本节中，将讨论与实验相关的几种激活函数。


    - * Sigmoid 函数*


    Sigmoid 函数是逻辑微分方程的解析解，常用于生态学领域。它定义为：


    ```

    $\sigma(x) = \frac{1}{1+e^{-x}} \quad (2.45)$

    ```


    该函数是一个单调增函数，将 $(-\infty, \infty)$ 映射到 $(0,1)$。图 2.18 (a) 显示了 Sigmoid 函数及其导数。可以发现该函数是平滑的且具有连续导数。然而，Sigmoid
    的输出不是中心化的，这会随着网络层的加深改变数据分布。此外，由于导数函数范围从 0 到 0.25，根据链式法则很容易遭受梯度饱和。


    - B. 双曲正切函数


    双曲正切函数定义为：


    ```

    $anh(x) = \frac{e^x - e^{-x}}{e^x + e^{-x}} \quad (2.46)$

    ```


    如图 2.18 (b) 所示，双曲正切函数的曲线与 Sigmoid 函数相似。它也是单调增的，将 $(-\infty, \infty)$ 映射到 $(-1,
    1)$。尽管该函数具有中心化的优点，但仍然无法消除梯度饱和。此外，指数函数导数运算的复杂性也是这两个函数的缺点。


    - C. ReLU 函数


    ReLU 是目前最常用的激活函数，其定义为：


    ```

    $ReLU(x) = \begin{cases} x & x \geq 0 \\ 0 & x < 0 \end{cases} \quad (2.47)$

    ```


    如图 2.18 (c) 所示，该函数将 $(-\infty, \infty)$ 映射到 $(0, \infty)$（修正：$[0, \infty)$）。


    - D. 指数函数


    指数线性单元（ELU）是 ReLU 的改进版本，定义为：


    ```

    $ELU(x) = \begin{cases} x & x \ge 0 \\ \alpha(e^x - 1) & x < 0 \end{cases} \quad
    (2.48)$

    ```


    ELU 的曲线如图 2.18 (d) 所示，它将 $(-\infty, \alpha)$ 映射到 $(\alpha, \infty)$。相比 ReLU，当输入为负时其输出是平滑的。


    ## U-Net 在稳态热传导求解器中的应用


    ![](img/020125e0e698f9771fbbd32f2ace1e80_73_0.png)


    ### 图 2.18

    激活函数及其导数 (a) Sigmoid 函数、(b) 双曲正切函数、(c) ReLU 函数、(d) ELU 函数、(e) Softsign 函数和 (f)
    PReLU 函数。


    这在一定程度上缓解了 ReLU 死亡问题。


    - E. Softsign 函数


    Softsign 是一种常用的替代 tanh 的激活函数，其表达式为：


    ```

    $softsign(x) = \frac{x}{1+|x|} \quad (2.49)$

    ```


    如图 2.18 (e) 所示，像 tanh 一样，该函数也是单调增的，并将 $(-\infty, \infty)$ 映射到 $(-1, 1)$。然而，指数计算问题仍然存在。


    - F. PReLU 函数


    PReLU 函数与 Leaky ReLU 相似，但参数 $\alpha$ 在训练期间是可以学习的。


    ```

    $ReLU(x) = \begin{cases} x & x \geq 0 \\ \alpha x & x < 0 \end{cases} \quad (2.50)$

    ```


    ## 基于深度学习的前向建模与反演技术


    ![](img/020125e0e698f9771fbbd32f2ace1e80_74_0.png)


    图 2.19

    不同激活函数的损失随迭代次数变化的曲线。


    在预实验中，依次向网络加入了六种不同的激活函数，损失随迭代次数变化的曲线如图 2.19 所示。为了确保实验的严谨性，网络的其他部分保持不变。可以发现，由于
    PReLU 函数可以在训练期间自动调整参数，它在所有激活函数中表现最佳，因此被用于正式训练。


    ### 2.3.5.2 学习率


    在深度学习中，学习率 $\alpha$ 是一个重要的超参数，决定了参数 $\theta$ 在向损失函数最小值移动时的更新速率。学习率满足：


    ```

    $$\theta = \theta - \alpha \frac{\partial L(\theta)}{\partial \theta}$$

    ```


    实际上，配置合适的学习率是困难的，因为学习率太大会跳过最小值，而太小则可能花费长时间才能收敛，或者陷入局部最小值。选择合适的学习率通常需要多次预实验。


    '
