    is introduced in the network, which diminishes the resolution of some trifling
    domains while magnifying the information of highly related regions. The specific
    architecture of the skip connection is exhibited in Figure 5.10, which is elaborate
    devised as a weighted selector to accomplish attention mechanism. Here, attention
    module can be expressed as


    ```

    $Attention(Q, K, V) = \text{softmax}\left(\frac{QK^T}{\sqrt{d_k}}\right)V \quad
    (5.30)$

    ```


    where $Q, K$, and $V$ are the query, key and value matrix, while $d_k$ is the
    scaling factor. In fact, the detailed procedures of the attention mechanism are
    as follows. At first, the query and key matrices are utilized to obtain the weight
    coefficient. Next, the field are added together in the light of the weight to
    acquire the final output. It is worth noting that this mechanism enables the network
    to connect on a tiny number of crucial parts with large weight, and abandon the
    majority of the superfluous one. In view of the confined computing resources in
    some extreme scenarios, the attention mechanism is able to ensure the performance
    of the framework.


    ### 5.3.1.2 Physics Model


    In the first model, the temperature and electrical potential are the physical
    fields to be calculated. It is noticed that there is a strong coupling between
    the two fields for the electrical conductivity changes with temperature. Here,
    the current continuity equation with the heat conduction equation is employed:


    ```

    $\nabla \cdot (-\sigma\nabla\phi) = 0$

    ```


    ```

    $\rho_C \frac{\partial T}{\partial t} - \nabla \cdot (k\nabla T) = Q$

    ```


    where $\sigma$ and $\phi$ are the electrical conductivity and electrical potential,
    while $\rho, C_p, k$ and $Q$ are the density, the constant pressure heat capacity,
    the thermal conductivity and the heat power density respectively.


    In the second model, the potential and the electron concentration are the related
    fields while the corresponding equations are the electrical current continuity
    equation and the transport equation:


    ```

    $\nabla \cdot (-\sigma\nabla\phi) = 0$

    ```


    ```

    $\frac{\partial n}{\partial t} + \nabla \cdot (D\nabla n + n\nu) = 0$

    ```


    where $n, \nu$, and $D$ are the electron concentration, drift velocity and diffusion
    velocity.


    In the third model, the velocity field and the temperature field are analyzed,
    complies with the convection-conduction equation and the Navier Stokes (N-S) equation:


