    ### 4.5.1 2D 情况


    #### 4.5.1.1 DL 框架


    如图 4.13 所示，2D 情况的反演网络源自全连接神经网络，包含两个隐藏层。每层后面都有一个 ReLU 激活层和一个 Dropout 层。此外，最终输出层带有
    ELU 激活函数以增加非线性。在该框架中，全连接层提取瞬态数据，Dropout 层缓解了过拟合。


    #### 4.5.1.2 训练与测试


    有了所提出的框架和足够的数据，即可开始训练。二维情况在 Keras 上使用 Adam 优化器进行。为了获得收敛，需要 500 次迭代。

    从测试数据中随机选择良好的样本来直观地测量预测性能。图 4.14 展示了与温度相关的电导率的测试数据示例，其中 (a) 是来自探测器的测量温度，(b) 是地面真值或预测的电导率。


    可以发现，预测的电导率与真实值吻合很好。为了进一步量化预测性能，平均误差率定义为：


    $err_{ave} = \frac{1}{MN} \frac{\sum_{i=1}^{N}\sum_{j=1}^{M} |k_{net}(i,j) - k_{real}(i,j)|}{\sum_{i=1}^{N}
    |k_{real}(i,j)|}. (4.37)$


