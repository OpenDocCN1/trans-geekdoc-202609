    ## 2.3.3 Architecture of the Network


    After building the dataset, an efficient neural network is indispensable for training.
    The proposed framework is mainly based on the U-net [33], which was first introduced
    into medical image segmentation by researchers. It was widely adopted for various
    problems with close spatial connections between the input and output. Figure 2.12
    shows the structure of the classic U-net, which is composed of fully convolutional
    networks. Since it does not contain any fully connected structure, the U-net can
    process data with high resolution without reduced GPU resources. The entire architecture
    is composed of the symmetric contraction and expansion path, which resembles a
    T, and hereby marked for U-net.


    In the heat problem investigated in this chapter, the input and output are a three-dimensional
    matrix with the dimension of $32 \times 32 \times 32$, while the input matrix
    represents the geometry and thermophysical properties of the object while the
    output matrix represents the steady-state temperature field distribution. The
    specific structure of the proposed network is displayed in Figure 2.13. Considering
    that the Laplace equation involved in this study is three-dimensional, the convolution
    kernel is set to be $3 \times 3 \times 3$. Similar to Figure 2.12, the proposed
    framework also includes a contracting path and an expansion path. The contracting
    path includes four sub-modules, and each consists of two $3 \times 3 \times 3$
    convolution layers, in which one has a stride of two while the other has one.
    After each downsampling, the number of output channels is doubled and the input
    size reduces to 1/8 of the original. For the expansion path, it is also composed
    of four sub-modules, and each composed of an up-sampling structure and a transpose
    convolution structure. After each upsampling, the number of output channels halves
    and the input size rises to 8 times. In order to increase the nonlinearity of
    the network, a ReLU activation function is added after each convolution or transpose
    convolution. At the lowest point of the network, an additional block containing
    a $3 \times 3 \times 3$ convolutional layer with a stride of one is introduced
    to link the contraction path and expansion path. In addition, a skip connection
    is in the corresponding downsampling and upsampling layers to enhance the stability
    of the training process.


    Compared with traditional convolution network, the proposed work is appropriately
    modified to adapt to complex three-dimensional problems. First of all, mean pooling
    rather than max pooling is utilized to implement downsampling. This is because
    average pooling concentrates more on overall thermophysical parameters, while
    maximum pooling tends to focus on feature textures (e.g., interfaces of mediums).
    As shown in Figure 2.14, average pooling extracts the average value of all elements
    in the current window during each operation.


    ![](img/020125e0e698f9771fbbd32f2ace1e80_67_0.png)


