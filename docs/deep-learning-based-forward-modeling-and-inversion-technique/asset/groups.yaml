    总而言，深度学习技术在计算物理中的应用包括三个部分：第一部分是场计算，也就是所谓的正向问题。通过给定的边界条件和初始条件获得物理场。第二部分是参数提取，主要涉及各种本构参数的反演。第三部分是反向设计，通常是从给定的目标响应中重构未知结构。本书主要探讨前两类问题，涉及温度场、电场、流场的计算，以及热通量和热导率的反演。应用深度学习技术解决物理问题通常需要构建神经网络。这里将介绍各种基础的神经网络结构。


