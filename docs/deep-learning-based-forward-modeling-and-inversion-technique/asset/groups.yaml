    ## 5 计算物理中的先进深度学习技术


    计算物理是一门利用计算机和计算机科学作为工具和方法，应用适当数学方法对物理问题进行数值分析，并对实际过程进行数值模拟的新学科。传统的物理方法包括有限差分法
    [1, 2, 3]，有限元法 [4, 5, 6]，变分动力学法 [9, 10]，蒙特卡洛模拟法 [11]。近年来，随着深度学习技术的发展，出现了许多将计算物理与神经网络相结合的新方法。在本章中，首先回顾深度学习技术在计算物理中的应用，然后重点介绍特殊方法的实现。


    ## 5.1 告知神经网络


    ### 5.1.1 基于全连接的 PINN


    物理告知神经网络使用全连接神经网络 (FCNN) 作为通用函数近似器 [13]。全连接 PINN 的核心思想是自动微分技术 [14]，它用于对 FCNN 关于输入坐标或参数求导。采用一个精心设计的损失函数来约束场量符合偏微分方程形式的相关物理定律。事实上，基于
    FCNN 的 PINN 能够处理计算科学中的多维物理问题。


    首先，需要建立一个深度学习框架来模拟算子方程 $\mathcal{L}[u] = f$。一个原型结构包括输入层、若干隐藏层和一个输出层，每个层后面都跟着一个激活函数。输入元素是一个
    $N+1$ 维向量，表示 $N$ 个空间坐标和一个时间坐标。接下来，构建一个精心设计的损失函数 [15]，它可以由三部分组成：


    $$\mathcal{L} = \alpha\mathcal{L}_{pde} + \beta\mathcal{L}_b + \gamma\mathcal{L}_i$$


    其中 $L_{pde}$、$L_b$ 和 $L_i$ 分别定义为 PDE 损失、边界损失初始损失。系数 $\alpha$、$\beta$ 和 $\gamma$
    是不同模型中的可调参数。三种损失定义如下：


    $$L_{pde} = \sum_{i=1}^{N_f} |\mathcal{L} [\mathbf{u}(\mathbf{x}, t)] - f|^2$$


    $$L_b = \sum_{i=1}^{N_b} |\mathbf{u}(\mathbf{x}_b, t) - \mathbf{u}_b|^2$$


    $$L_i = \sum_{i=1}^{N_i} |\mathbf{u}(\mathbf{x}_i, t_0) - \mathbf{u}_0|^2$$


    其中 $N_f, N_b$ 和 $N_i$ 分别是方程、边界和初始对应的采样点数量。在公式 5.2 中，导数可以通过通过自动微分对函数实现链式法则来得到。在物理告知的深度学习框架中，FCNN
    是最成熟的一种，已应用于广泛领域。


    ### 5.1.1.1 柱坐标系


    常见的 PINN 是应用于直角坐标系中的。本章将其扩展到任何正交曲线坐标系。


    '
