    Navier-Stokes 方程上进行了数值实验以体现强大的学习能力。


    ## 1.3.4 深度学习与传统算法的融合


    受上述 PINNs 的驱动，第三类方法旨在结合深度学习优化传统的数值方法。例如，在电磁学中，Hu 等人 [64] 利用理论引导的循环神经网络通过 PyTorch
    实现了有限差分时域（FDTD）算法。与基于 MATLAB 的传统算法相比，该求解器表现出较高的计算效率。此外，该平台能够应用于反演问题，为在各种实际领域的应用提供了可能。


    # 基于深度学习的前向建模与反演技术


    ![](img/020125e0e698f9771fbbd32f2ace1e80_38_0.png)


    ## RNN 1.16


    通过 FDTD 模拟波传播过程的 RNN 结构。


    在地质科学中，Sun 等人 [65] 开发了一种理论设计的循环神经网络（如图 1.16 所示）来解决声学前向建模问题。显然，将该框架应用于地震反演问题等同于基于梯度的全波反演方法。此外，还将开发的深度学习（DL）框架与传统的非线性优化方法（如
    L-BFGS）进行了对比。该研究结果在著名的 Marmousi 模型上得到了验证。


    事实上，更多的研究集中在反演问题。例如，Wei 等人 [66] 提出了一种感应电流学习方法（ICLM），将传统迭代方法的优势融入 CNN 框架中，这是首次通过学习对比源来解决全波反演散射问题（ISPs）。该框架中的组合损失函数受到传统迭代算法基函数展开策略的启发，旨在降低计算成本。此外，该框架通过构建一系列跳跃连接（skip
    connections）来关注感应电流的微小部分，同时忽略主要部分以加速训练过程。将所提方法的卓越性能与最先进的纯数据深度学习方案以及一种著名的传统求解器进行了对比。


    此外，Liu 等人 [67] 提出了一种物理深度网络，以弥合传统方法与基于数据的深度学习网络之间的差距。在这项工作中，反演问题的无约束优化过程被分解为四个子任务，每个任务都映射到一个深度网络。在开发的框架中，对比的权重和正则化由相应的子模块更新。注意到，这种架构有效地将神经网络与传统技术以及底层的物理知识整合在一起，即使在高噪声环境下也超过了基于子空间的优化方法（SOM）。


    # 计算物理中的深度学习框架与范式


    ![](img/020125e0e698f9771fbbd32f2ace1e80_39_0.png)


    图 1.17


    结合迭代算法的反演深度学习框架。


    此外，Guo 等人 [68] 设计了一种新的迭代深度网络（如图 1.17 所示）来处理 2D 全波反演散射问题。在该模型中，用于预测散射场的前向计算网络被纳入反演框架中。在迭代过程中，反演框架根据观测数据与计算数据之间的残差获取更新。从合成数据和实验数据都可以观察，开发的模型能够以相当的效率、精度和泛化能力实现超分辨率重建。预计该框架可以实现高可靠性的实时成像。


    强化学习作为深度学习方法的另一个分支，经常用于自动控制、机器人博弈论（如图 1.18 所示），它也经常作为与传统方法结合的优化工具来优化实际系统中的物理参数。这是一种基于反馈的深度学习方法，智能体通过动作和结果学习如何行为。换句话说，良好的动作产生正反馈，而糟糕的动作会导致惩罚。在光子器件设计中，Huang
    等人 [69] 开发了一种基于深度学习的反设计策略，其中器件的几何形状和颜色通过监督学习来确定它们的关系。优化过程通过强化学习（RL）算法实现，以捕捉所需颜色的结构几何形状，显著提高了设计效率。该策略提供了一种全面的算法，能够立即将通用函数编码到不同的结构中，以相当的可靠性和精度实现了功能性光子器件的反设计。


    # 基于深度学习的前向建模与反演技术


    ## 智能体 (Agent)


    ![](img/020125e0e698f9771fbbd32f2ace1e80_40_0.png)


    图 1.18


    强化学习方案。


    ## 1.4 本书结构


    本书将包含以下部分：第一章，我们主要关注两种代表性的传统计算物理数值算法，然后讨论几种常见的机器学习网络框架。此外，第一章还涉及用于解决物理问题的不同机器学习范式，包括数据驱动、物理约束、算子学习以及深度学习与传统算法的融合方法。然后，将重点关注特定的物理问题。第二章介绍了前向热传导问题，使用经典的
    U-net 框架求解稳态热传导问题。第三章采用新兴的 convLSTM 架构重建复杂表面的热通量。第四章实现了物理信息告知神经网络（PINN）和反馈映射模块（NMM），以重建随空间/温度/时间变化的热导率。最后，在第五章中将介绍一些最新的先进结构及其物理场景，包括在广义弯曲坐标下应用
    PINN 求解稳态/瞬态偏微分方程，图神经网络在静电场应用，以及级联傅里叶网络在耦合多物理场中的应用。


