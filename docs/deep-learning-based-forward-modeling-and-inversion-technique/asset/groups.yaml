    # 基于深度学习的正向建模与反演技术


    ### 2.1.1 解析法


    经典的解析方法包括变量分离法 [5, 6, 7]、格林函数 [8]、积分变换 [9, 10, 11] 等。在本章中，为了简单见，将讨论前两种方法。


    变量分离法是求解偏微分方程（PDEs）最常用的解析方法之一。它假设热导方程的解关于空间坐标 $x, y,$ 和 $z$ 是变化的。对于稳态问题，如果热导率场均匀，则温度场满足普拉斯方程。


    ```

    $$\frac{\partial^2 T(x,y,z)}{\partial x^2} + \frac{\partial^2 T(x,y,z)}{\partial
    y^2} + \frac{\partial^2 T(x,y,z)}{\partial z^2} = 0.$$ (2.1)

    ```


    假设温度 $T$ 可以表示为


    ```

    $T(x,y,z) = T_1(x)T_2(y)T_3(z).$ (2.2)

    ```


    显然，$T(x,y,z) = 0$ 是该方程的一个解。可以将方程 2.2 代入方程 2.1，然后除以 $T(x,y,z)$，可以得到：


    ```

    $$\frac{1}{T_1(x)}\frac{d^2T_1(x)}{dx^2} + \frac{1}{T_2(y)}\frac{d^2T_2(y)}{dy^2}
    + \frac{1}{T_3(z)}\frac{d^2T_3(z)}{dz^2} = 0.$$ (2.3)

    ```


    如果这三个项中的每一项都为 0，则平凡解可以为


    ```

    $T_1(x) = a_1x + b_1.$ (2.4)

    ```


    ```

    $T_2(y) = a_2y + b_2.$ (2.5)

    ```


    ```

    $T_3(z) = a_3z + b_3.$ (2.6)

    ```


    对于更一般的情况，$T_1, T_2$ 和 $T_3$ 满足


    ```

    $$\frac{d^2T_1(x)}{dx^2} = \pm k_1^2T_1(x).$$ (2.7)

    ```


    ```

    $$\frac{d^2T_2(y)}{dy^2} = \pm k_2^2T_2(y).$$ (2.8)

    ```


    ```

    $$\frac{d^2T_3(z)}{dz^2} = \pm k_3^2T_3(z).$$ (2.9)

    ```


    其中


    ```

    $$\pm k_1^2 \pm k_2^2 \pm k_3^2 = 0.$$ (2.10)

    ```


    以 $T_1$ 为例，对应正号的解是指数函数的线性组合。


    ```

    $T_1(x) = ae^{k_1x} + be^{-k_1x}.$ (2.11)

    ```


    # U-Net 在 3D 稳态热传导求解器中的应用


    相比之下，负号对应三角函数的线性组合


    ```

    $$T_1(x) = c \sin k_1x + d \cos k_1x. \quad (2.12)$$

    ```


    方程 2.11 和 2.12 被称为通解。值得注意的是，方程 2.1 中的三项不能具有相同的符号。所有的解都可以通过将平凡解与通解结合得到，而系数可以通过边界条件确定。


    ### 2.1.2 数值方法


    对于几何形状不规则物体，广泛使用有限差分法 (FDM) [12, 13]、有限元法 (FEM) [14, 15, 16, 17] 和有限体积法 (FVM)
    [18, 19] 来求解热传导方程。这些方法将区域离散化为不重叠的单元并建立相应的体系代数方程，可以直接或通过迭代求解。在本节中，主要讨论 FDM 和 FVM。


    差分法是最简单且易懂的算法，其基本思想是将微分方程转化为差分方程。在 $(x_0, y_0, z_0)$ 处应用泰勒公式：


    ```

    $$T(x_0+\delta, y_0, z_0) = T(x_0, y_0, z_0) \pm \frac{\delta x}{2} \frac{\partial^2
    T}{\partial x^2} + O(x^2), \quad (2.13)$$

    ```


    ```

    $$T(x_0, y_0+\delta, z_0) = T(x_0, y_0, z_0) \pm \frac{\delta y}{2} \frac{\partial^2
    T}{\partial y^2} + O(y^2), \quad (2.14)$$

    ```


    ```

    $$T(x_0, y_0, z_0+\delta) = T(x_0, y_0, z_0) \pm \frac{\delta z}{2} \frac{\partial^2
    T}{\partial z^2} + O(z^2), \quad (2.15)$$

    ```


    忽略高阶项，可以得到


    ```

    $$ \frac{1}{\delta x^2}[T(x_0+\delta, y_0, z_0) + T(x_0-\delta, y_0, z_0) - 2T(x_0,
    y_0, z_0)] + \frac{1}{\delta y^2}[T(x_0, y_0+\delta, z_0) + T(x_0, y_0-\delta,
    z_0) - 2T(x_0, y_0, z_0)] + \frac{1}{\delta z^2}[T(x_0, y_0, z_0+\delta) + T(x_0,
    y_0, z_0-\delta) - 2T(x_0, y_0, z_0)] = -\frac{\partial^2 T(x,y,z)}{\partial x^2}
    - \frac{\partial^2 T(x,y,z)}{\partial y^2} - \frac{\partial^2 T(x,y,z)}{\partial
    z^2} $$ (2.16)

    ```


    对于均匀介质中的稳态热传导，温度场满足普拉斯方程：


    ```

    $$\frac{\partial^2 T(x,y,z)}{\partial x^2} + \frac{\partial^2 T(x,y,z)}{\partial
    y^2} + \frac{\partial^2 T(x,y,z)}{\partial z^2} = 0.$$ (2.17)

    ```


    其中 $k$ 是热导率，$Q$ 是热密度。


    # 3. 正向建模与反演技术


    令 $x_0 = \delta, y_0 = \delta, z_0 = \delta$，则方程 2.16 可以简化为


    ```

    $$T(i+1, j, k) + T(i-1, j, k) + T(i, j+1, k) + T(i, j-1, k) + T(i, j, k+1) + T(i,
    j, k-1) - 6T(i, j, k) = -\frac{Q(i, j, k)}{k}$$ (2.18)

    ```


    另一种常用的算法是有限元法 (FEM)，首先将整个空间离散化为 $E$ 个单元，考虑变分原理：


    ```

    $$\Pi = \sum_{e=1}^E \int_{V_e} k \left( \left(\frac{\partial T}{\partial x}\right)^2
    + \left(\frac{\partial T}{\partial y}\right)^2 + \left(\frac{\partial T}{\partial
    z}\right)^2 \right) dV + \int_{S_e} h T_f dS$$ (2.19)

    ```


    '
