    全连接神经网络 [19]，简称简称 FCN，是最基础的深度学习（DL）网络类型（如图 1.4 所示）。通常情况下，网络由三部分组成：输入层、隐藏层和输出层。假设网络第
    $i$ 层和第 $i+1$ 层的输入分别表示 $X_i$ 和 $X_{i+1}$：


    ```

    $X_{i+1} = (W_{i+1}X_i + b_{i+1})$

    ```


    其中 $W_{i+1}, b_{i+1}$ 是第 $i+1$ 层的矩阵和偏置向量，sigma$ 表示非线性激活函数。FCN 的目标是拟合某些未知函数。在 1991
    年，Leshno [20] 证明了带有隐藏层的 FCN 可以在紧凑集上通过非多项式激活函数（如 Tanh、logistic 和 ReLU）近似任何连续函数
    $f(x)$。从数学上讲，可以项为对于 $\forall \epsilon > 0$，存在整数 $N$（隐藏单元的总数）以及参数 $\phi_i, b_i
    \in \mathbb{R}$，使得函数


    ```

    $F(x) = \sum_{i=1}^N \nu_i(w_i^T x + b_i)$

    ```


    对于所有 $x$ 均满足 $|F(x) - f(x)| < \epsilon$。该定理为实现网络以近似未知函数奠定了坚实的基础。


    8，几个熟悉的激活函数 [21, 22]，如 Sigmoid 函数、ReLU 函数、Leaky ReLU 函数和 Tanh 函数定义为：


    ```

    $$\sigma(z) = g(z) = \frac{1}{1+e^{-z}}$$

    ```


    ```

    $ReLU(z) = \max(0, z)$

    ```


    ```

    $LeakyReLU(z) = \max(\alpha, z)$

    ```


    ```

    $$\tanh(z) = \frac{e^{-z}}{1+e^{-z}}$$

    ```

    ```


    其导数为：


    ```

    $$\sigma''(z) = \sigma(z)(1-\sigma(z))

    ```


    ```

    $ReLU''(z) = \begin{cases} 1 & z > 0 \\ 0 & z \le 0 \end{cases}$

    ```


    ```

    $LeakyReLU''(z) = \begin{cases} 1 & z > 0 \\ \alpha & z \le 0 \end{cases}$

    ```


    ```

    $$\tanh''(z) = 1-\tanh^2(z)$$

    ```


    ## 1.2.2 卷积神经网络


    卷积神经网络 CNN 是基于卷积算子 [23, 24]，而不是矩阵乘法。卷积是一种作用于向量、矩阵甚至高阶张量的操作。在信号处理中，对输入的任何线性时不变系统的卷积等效于


    ```

    $y(t) = \int_{-\infty}^{\infty} x(\tau)h(t-\tau)d\tau$

    ```


    卷积在信号处理中是手动指定的，而对于神经网络，任务是自动学习并实现参数共享。对于典型的 CNN，假设第 $i$ 层和第 $i+1$ 层的输入分别为 $X_i$
    和 $X_{i+1}$，它具有：


    ```

    $X_{i+1} = \sigma(\mathbb{P}(X_i \otimes K_{i+1}) + b_{i+1}))$

    ```


    其中 $\sigma, \mathbb{P}$ 和 $\otimes$ 分表示激活函数、池化和卷积，$b$ 是偏置向量。二维卷积表示为


    ![](img/020125e0e698f9771fbbd32face1e80_23_0.png)


    ```

    $[X_i \otimes \mathcal{K}_{i+1}]_{ij} = \sum_{m=1}^{M} \sum_{n=1}^{N} X_i(i-m,
    j-n) \mathcal{K}_{i+1}(m, n) \quad \text{(1.34)}$

    ```


    其中 $m, n, N$ 是上述卷积核的序号和大小。在 CNN 中，池化层作为下采样模块，减少特征图的大小以及参数的数量。常见的池化算子包括最大池化、平均池化、随机池化等。基于
    CNN 的经典框架（如图 1.5 所示）包括 LeNet [25], AlexNet [26], VGG [27], GoogleNet [28], ResNet
    [29], DenseNet [30] 等。


    ### 1.2.3 循环神经网络


    循环神经网络 [31] 是为序列设计的，输入和输出都是时间步。RNN 通常引入循环结构，允许信息从框架的一个时间步传递到下一个步，通过在每步应用递归关系。假设
    RNN 的输入和输出表示为 $X$ 和 $Y$，其中：


    ```

    $X=\begin{bmatrix} x_1 \\ x_2 \\ \vdots \\ x_T \end{bmatrix}, Y=\begin{bmatrix}
    y_1 \\ y_2 \\ \vdots \\ y_T \end{bmatrix} \quad \text{(1.35)}$

    ```

