    | SSIM | 0.65 | 0.99 | 0.85 | 1.00 | 0.91 | 1.00 |


    ![](img/020125e0e698f9771fbbd32f2ace1e80_144_0.png)


    # 图 4.12


    两个不同样本的去噪结果。


    显易看出，对于 SNR 为 5dB 的噪声数据，所提出的去噪模块能够将高斯噪声衰减到相当低的水平（PSNR: 45.3dB/SSIM: 0.99），无疑证明了卓越的去噪性能。


    ## 4.4 与其他方法的比较


    这里，从 PSNR 和运行时间的角度对比了 U-net 和传统的去噪方法。结果如表 4.2 所示。


    # 表 4.2


    | 噪声 (dB) | U-net 之前 | U-net 之后 | SVD 之前 | SVD 后 | 小波变换前 | 小波变换后 |

