    # Deep Learning-Based Forward Modeling and Inversion Techniques


    # Agent


    ![](img/020125e0e698f9771fbbd32f2ace1e80_40_0.png)


    FIGURE 1.18


    The reinforced learning scheme.


    # 1.4 Constitutions of the Book


    This book will include the following parts: Chapter 1, we mainly concentrate on
    two representative traditional computational physics numerical algorithms and
    then discuss several commonly encountered network frameworks of machine learning.
    In addition, Chapter 1 also involves the different paradigms of machine learning
    for solving physical problems, including data-driven, physical constraints, operator
    learning, and deep learning-traditional algorithm fusion methods. Then, it will
    focus on specific physical problems. In Chapter 2, the forward heat conduction
    problem is introduced, which uses the classical U-net framework to solve the steady-state
    heat conduction problem. In Chapter 3, the emerging convLSTM architecture is employed
    to reconstruct the surface heat flux of complex surfaces. In Chapter 4, a physics-informed
    neural network (PINN) and a feedback mapping module (NMM) are implemented to reconstruct
    the space/temperature/time-dependent thermal conductivity. Finally, in Chapter
    5, some of the latest advanced structures and their physical scenarios will be
    introduced, including the application of PINN in generalized curvilinear coordinates
    in solving steady-state/transient partial differential equations, the application
    of graph neural networks in solving electrostatic fields, and the application
    of cascaded Fourier networks in solving coupled multiphysics problems.'
