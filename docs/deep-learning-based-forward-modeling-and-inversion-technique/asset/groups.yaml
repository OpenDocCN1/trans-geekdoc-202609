    # 4 Reconstruction of Thermophysical Parameters Based on Deep Learning


    ## 4.1 Introduction


    The inversion of thermophysical parameters is a typical representative of inverse
    heat conduction problems (IHCP), which has a broad application prospect in scientific
    and engineering problems such as nondestructive testing, materials processing,
    geometry optimization, biomedical detection, architectural design, food technology
    and so on. During the inversion procedure, the thermal parameters in the entire
    domain are determined by the measured boundary physical quantities. However, due
    to high nonlinear and ill condition, the reconstruction of the thermal parameters
    is a herculean task. In this chapter, the workflow of utilizing deep learning
    techniques to retrieve thermophysical parameters is exhibited. In the beginning,
    several conventional algorithms together with their characteristics will be introduced.
    Next, the recent research status with regard to applying DL techniques to reconstruct
    the thermal conductivity are discussed in the following part. Finally, the analyses
    of the DL architecture is presented in the last part.


    ## 4.1 Physical Foundation


    The mechanisms behind heat conduction are quite different among various materials,
    hence it is arduous to derive from first principles. thermal conduction generally
    occurs when the molecules collide. For dilute monatomic gas, a basic expression
    can be formulated


    ```

    $k = \beta\rho C_v \frac{2k_B T}{\pi m}$$

    ```


    Where $\beta$, $k_B$, $\lambda$, $C_v$ and $m$ are the coefficient, Boltzmann
    constant, mean free path, specific heat, and molecular mass, respectively. It
    is worth noting that this formula is merely applicable to low-pressure gases since
    the interparticle attractions in real gases are ignored. The heat conduction mechanisms
    in liquids are intricate and lacks accurate theoretical formula. For metals at
    low temperature, the heat conduction process is carried out by free electrons
    where the thermal conductivity can be formulated as


    $k = \frac{\pi^2}{3}Cv\lambda = k_0T$ (4)


