    ## 5.3.2. Comparison


    In this part, experiments are performed to highlight the strength of the developed
    Fourier network. The predicted accuracy is compared to two conventional networks
    at different resolutions. To end this, the calculation of temperature in the first
    experiments are investigated by employing the fully connected network (FCN) and
    the convolutional neural network (CNN). The average mean square errors on the
    results with a resolution ranging from $16^2$ to $128^2$ are collected. It is
    noted that the benchmark of the three network is the computational costs of an
    adequately dense grid. It is lucid that the MSE of the cascaded Fourier framework
    is more than 10 times lower than FCN and CNN. Additionally, as the conventional
    CNN or FNN focuses on the data fitting while the Fourier network aims at operator
    learning, the average MSE is nearly independent of the mesh density. In contrast,
    the average MSE of the traditional CNN increases with the resolution due to the
    more sophisticated framework. Therefore, it is possible to train the proposed
    architecture on a sparse mesh while testing on a dense one, which can save calculation
    resources.


    Another critical issue for implementing the DL technique in multiplications is
    that it enables faster predictions than conventional approaches by fully utilizing
    the parallel computing abilities of the GPU, making it feasible to compute a plethora
    of samples simultaneously. To quantitatively measure the speed of calculation,
    the time consumption of 1000 specimens via the FEM and the well-trained framework
    (the total time of the input structure and the Fourier structure) are counted.
    As displayed in Figure 5.18, it takes nearly 7.48 s on average for the framework
    to process 1000 samples (1.53 s for the input framework and 5.9 s for the Fourier
    framework). For the FEM-based software, it needs to spend 185 minutes, which is
    1500 times slower. Besides, although the Fourier framework needs some time for
    data generation and training before being used, that process is just one-off.
    That is to say, once the offline training is completed, the real-time online prediction
    can be performed.


    ## 5.4 Conclusion


    In this chapter, several applications of advanced deep learning techniques are
    investigated in computational physics. At the very first, the physics-informed
    frameworks are discussed, including the fully connected-based and the convolutional-based
    architecture. Besides, the PINNs in orthogonal curve coordinate systems are discussed,
    including the steady state and transient problems in cylindrical, spherical, and
    parabolic coordinates. After that, the graph neural network is introduced, followed
    by its applications in electrostatics. As the unstructured grid is applied in
    GNN, it can be applicable to more universal scientific computation problems. In
    the last part of chapter, the operator-based Fourier network is introduced. The
    calculation results firmly attest that the developed framework can obtain the
    anticipated multiphysics fields in real time. Additionally, the Fourier architecture
    emerges consistent average error rates for diverse resolutions, which has a certain
    potential to be adopted in numerous computation scenarios. In all, the newly developed
    advanced DL techniques have merits in flexibility, universality, efficiency, and
    economy. Consequently, it is believed to substitute the traditional numerical
    algorithms or classical DL architectures in some certain computational physics
    tasks.


