    # 图 3.7


    采样点的分布。


    以表面温度为输入，以外面的的热通量或温度为输出。假设有 $N_t$ 个时间样本，在外表面需要提取的 $M$ 个热流点，以及在内表面测量的 $N$ 个温度点。反演的目标是从
    $N \times N_t$ 个温度测量数据反演出 $M \times N_t$ 组热流数据。采样点的分布如图 3.7 所示：


    以第 $i$ 个点热流的反演为例（若要反演外表面的任意点，仅需用该点的热通量进行训练）。对于


    $q_i(t) = \sum_{j=1}^{N} a_{ij}T_j(t) \otimes h_{ij}(t) \quad (3.29)$


    $W_{ij}(t) = T_j(t) \otimes h_{ij}(t),$


    $q_i(t) = \sum_{j=1}^{N} a_{ij}w_{ij}(t) \quad (3.30)$


    构建了两个网络，其中一个用于拟合系统函数 $h_{ij}(t$，另一个用于求解权重 $a_{ij}$。网络 1 的输入是第 $j$ 个内表面点的温度值，输出是其与系统函数卷积后的中间函数
    $w_{ij}$。遍历所有内表面点以获得 $N$ 个中间函数，这些函数在网络 2 中进行加权，以获得最终输出，即外表面第 $i$ 个点的热通量。


    # 基于 ConvLSTM 的复杂表面热通量反演


    该网络是一个全连接网络。其输入是一个维度为 $L \times 1 \times N_t$ 的张量，其中 $L$ 是训练样本的数量，$N_t$ 是时间样本的数量。每个时间采样点作为输入的独立独立节点，网络的输出是受外表面所有点热通量或温度影响的点的权重因子
    $w_0$。遍历所有内表面点以获得 $N$ 个中间函数。这些函数在网络 2 中进行加权以获得最终输出，即外表面第 $i$ 个点的热通量，如图 3.7 所示：


