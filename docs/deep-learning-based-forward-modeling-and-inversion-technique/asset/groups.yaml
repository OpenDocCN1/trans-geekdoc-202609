    # 基于 ConvLSTM 的复杂表面热通量反演


    ![](img/020125e0e698f9771fbbd32f2ace1e80_117_0.png)


    图 3.13

    3D 测试集中的样本，用于展示瞬态热通量。(a) 复杂模型的几何形状，(b)、(c) 和 (d) 是施加在 (a) 上的三种不同热通量分布.$R_i(i=1,
    2, 3)$：真值，$P''_i(i=1, 2, 3)$：预测值。


    ![](img/020125e0e698f9771fbbd32face1e80_117_1.png)


    图 3.14

    两种生成器独立产生的测试用例的统计分布。规律代表平坦的热通量表面，另一个代表复杂表面。


    # 基于深度学习的前向建模与反演技术


    此外，为了进一步明确所提 vLSTM 框架在计算速度和精度方面的优势，网络中包含了经典时域反演算法共轭梯度法（CG）与序列函数规格法（SFSM）的对比。为了模拟测量设备的热噪声，在模拟的时域温度信号中加入了标准差为
    $\sigma=0.1$ K 的白高斯噪声。考虑到传统的重建算法难以解决三维表面问题，本节仅讨论热通量表面为平面的情况。


    # 表 3.3


    三种方法的误差和时间耗时。


    | | ConvLSTM | CG | SFSM |

    |---|---|---|---|

    | 平均误差 | 0.0107 | 0.0391 | 0.0435 |

    | 时间耗时 (ms) | 17.89 | 2014 | 198.2 |


    表 3.3 显示了三种算法的误差率和成本。可以发现，训练良好的网络可以在实现更高精度的同时，将时间耗时缩小一个数量级。事实上，它在许多实际实时场景中具有一定的应用潜力。


    ## 3.4.5 工程应用


    利用深度学习架构的一个关键动力是，本研究提出的网络可以应用于工业场景。此处在章末尾介绍了测得的工程数据。图 3.15 显示了实际飞机的形状，它主要由高温金属合金和外部涂层组成。上表面施加了热通量，下表面设计用于温度测量。材料的热性能如表
    3.1 和 3.2 所示。为了简化模型，选择了没有小孔的区域进行反演，即图 (a) 和 (b)。时域采样点数 $N_t$ 等于 201，训练集包含 2790
    个样本，而测试集包含 300 个样本。在使用所提框架训练由模型生成的正向数据后，对真实温度进行反演。此处获得的热通量所示下方的图 3.16。可以发现，网络仍然可以获得可靠的结果。与图
    3.16 所示的热通量测量值相比，整体相对误差约为 0.3%。此外，从统计角度分析了左图中相对误差的分布。


    # 基于 ConvLSTM 的复杂表面热通量反演


    ![](img/020125e0e698f9771fbbd32f2ace1e80_119_0.png)


    **图 3.15**


    实际工程制件的反演模型。


    ![](img/020125e0e698f9771fbbd32f2ace1e80_119_1.png)


    **图 3.16**


    实际工程制件的热通量反演结果。


    事实上，大多数点误差都处于 10% 以内，检索的热通量与测量的热通量非常接近。这无疑证明了通过 COMSOL 生成的数据训练出的网络可以信信地用于检索实际数据。


    值得注意的是，采用的 convLSTM 结构不仅可以用于态热通量数据的重建，还可以用于其他时域数据，例如通过内部表面温度获取外部表面温度（如图 3.17 所示）。因此，该框架在实际应用中具有某种通用性。


    # 基于深度学习的前向建模与反演技术


    ![](img/020125e0e698f9771fbbd32f2ace1e80_120_0.png)


    图 3.17


    实际工程制件的温度反演结果。


    ## 3.5 结论


    本章证实了该框架在重建瞬态热通量数据方面的卓越能力，无论是在简单的平面模型还是复杂的曲面模型中，都能准确地检索热通量。此外，与传统的计算方法相比，训练良好的网络在各种工业场景下可以将计算耗时缩短一个数量级，同时保持更高的精度。这表明该方法在实际工程应用中具有巨大的潜力。


