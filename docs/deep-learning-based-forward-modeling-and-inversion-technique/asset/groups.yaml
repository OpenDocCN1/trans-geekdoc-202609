    ## 5.2 图神经网络


    图神经网络（GNN）是一系列旨在利用深度学习（DL）框架处理图数据的算法。众所周知，传统的深度网络并不适用于图结构化数据，因为它不是基于规则网格的。GNN
    最初由 Scarselli 等人 [28] 分别于 2005 年和 2008 年提出，分别用于面向节点和面向图的任务。如今，随着深度学习技术的蓬勃发展，更多的精力被投入到
    GNN 中。GNN 涉及经典领域包括推荐系统 [29]、计算机视觉 [30]、自然语言处理 [31]、异常检测 [32]、药物发现 [35] 等。


    最近，图神经网络被引入计算物理领域。例如，2019 年，Alet 等人 [34] 开发了图单元网络（GEN），它类似于有限元分析。所提的框架为 GNN 的节点分配了空间位置，使得学习到的连接可以泛化到不同尺寸的空间中。该结果通过稳态热传导问题的泊松方程得到了验证。2021
    年，Herzberg 等人 [35] 采用图卷积网络求解非均匀网格上的 EIT 问题。结果证实，所提出的 GCN 在计算效率和精度上均优于现有深度学习方法和传统方法。2022
    年，Gao 等人 [36] 在图卷积网络的基础上提出了新型 PINN，能够解决不规则区域的正向和反向物理 PDE。与传统的 PINNs 相比，开发的框架能够降低计算复杂度并促进收敛。本节将主要关注在计算电磁学中的应用。


    计算电磁学在广泛领域都有应用（例如天线设计、无线通信、电磁兼容、微波工程、波导和医学成像）。然而，有限差分法（FEM）、矩量法（MoM）等数值方法计算困难且耗时。基于
    CNN 的传统深度学习算法几乎只能处理具有求解域的任务 [37, 38]，这严重限制了其应用。在本节中，开发了一个由具有消息传递（MP）机制 [39] 的图神经网络（GNN）组成的深度学习网络，用于计算具有狄利克边界和几何形状的势场。由于所提出的深度学习框架能够在不规则形状中实现快速计算，预计它将被广泛利用。


    ### 5.2.1 GNN 架构


    深度学习网络如图 5.7 所示，其主要结构是带有 MP 的 GNN（即消息传递神经网络），与编码和解码模块相结合。这里，$x, y$ 表示空间坐标，而 $\psi(x,
    y)$ 是电位。表示函数用于边界条件。此外，在框架末尾级联了全连接网络（FCNN）以匹配 MPNN 的输出 [40]。所提出的深度学习框架能够在不规则形状中实现快速计算。由德洛尼剖分组成的图可以在不规则区域执行计算，因此可以构建不同的图。对于消息处理过程，它![](img/020125e0e698f9771fbbd32f2ace1e80_171_0.png)


    **图 5.7**

    图神经网络的架构。


    通过引入聚合和组合函数来利用图卷积网络。在研究中，观察到合适的消息步 $M$ 对框架的准确性和收敛至关重要。经过一系列尝试，消息步 $M$ 最终设计为 $N/21$，其中
    $N$ 定义为图中的节点总数。


    ### 5.2.2 数据生成与训练


    构建深度学习框架后，生成训练数据集具有重要意义。在本章中，来自商业软件 COMSOL Multiphysics 的计算结果被视为真值。为了保证训练效率，架构中整合了
    32 个样本，引入了三个不同几何形状的数据集。相应地，进行了三个独立实验，以说明该深度学习架构的通用性和性能。


