    represents the selective forgetting of information. Finally, an output gate uses
    the activation function to generate a new candidate vector. The expression of
    these gate structures can be expressed


    $i_t = \sigma(W_i \cdot h_{t-1}, x_t + b_i)$


    $\hat{C}_t = \tanh(W_c \cdot [h_{t-1}, x_t]) + b_c$


