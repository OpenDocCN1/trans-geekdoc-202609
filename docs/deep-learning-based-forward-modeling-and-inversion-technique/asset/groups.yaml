    # 基于深度学习的热物理参数重构 133


    ![](img/020125e0e698f9771fbbd32f2ace1e80_147_0.png)


    # 图 4


    网络对 2D 温度相关热导率的反演性能。


    其中 $M$ 和 $N$ 是时间和空间网格的总数，$k_{real}$ 和 $k_{pred}$ 是对应热导率的真实值和预测值。事实上，温度相关场景的最终相对误差率为1.03%，空间相关案例为
    2.65%。此外，图 4.15 展示了从空间依赖数据中随机选择的一系列样本，其中 (a) 代表探测器测量的温度，而 (c) 和 (d) 是导率的真实值、预测值和误差。结果证明了该框架强大的预测能力。此外，网络的另一个优点是完全训练的网络可以几乎实时地获取推理场。实际上，预测
    1000 个样本，该框架仅需 1.732 秒，在计算速度上超过了传统的迭代算法。


    ## 4.5.2 3D 案例


    ### 4.5.2.1 DL 框架


    受上述迭代算法的启发，开发了一种基于非线性映射模块 (NMM) 的 DL 架构来解决 IHC。如图 4.16 所示，该模块是一个由四层组成的反馈神经网络 [40,
    41]：一个输入全连接层、两个隐藏层和一个输出层。在这里，输入层由 $N_d \times N_t$ 个节点组成，输出层包含 $N_s$ 个节点，表示求解点数。假设
    $T$ 是输入温度向量，第 $j$ 轮迭代的输出热导率 $o_j$ 可以表示为：


    ```

    $o_j = \sigma_j(\mathbf{W}_2 \cdot \sigma_1(cat(\sigma_0, \mathbf{W}_0T + b_0)-1)
    + b_2)$,

    ```


    其中 $\mathbf{W}_1$、$\mathbf{b}_1$ 和 $\sigma_i$ 代表权重、偏置和激活函数。为了加速收敛，在输出层和第一个隐藏层之间构建了反馈圈。在方程
    4.38 中，$cat$ 是 PyTorch 提供的用于连接网络输出 $o$ 和中间隐藏层向量 $\sigma_0(\mathbf{W}_0T + b_0)$
    的内置函数。在获取了足够的 PINN 和 U-Net 生成的数据后，NMM 学习温度与导率之间的物理连接是合理的。几次迭代后，输出 $o_j$ 达到固定点
    $o$。训练在与 PINN/U-Net 相同的环境中进行，最后一个函数是预测导率 $\mathbf{k}$ 与真实导率 $\mathbf{k}_0$ 的均方误差
    (MSE)。


    $Loss = ||\mathbf{k} - \mathbf{k}_0||^2$ (4.39)


    ![](img/020125e0e698f9771fbbd32f2ace1e80_148_0.png)


    **图 4.15** 展示网络性能的数值示例。(a) 传感器测量的温度（横轴：时间，纵轴：传感器编号），(b) 空间依赖热导率的真值，(c) 空间依赖热导率的预测，(d)
    $|k_{net}(i,j)-k_{real}(i,j)|$ 的分布。


    ![](img/020125e0e698f9771fbbd32f2ace1e80_149_0.png)


    # 图 4.16


    非线性映射模块 (NMM) 的架构。采用反馈结构来连接输出层和隐藏层。


    ### 4.5.2.2 重构结果


    经过良好训练后，将去噪信号输入 NMM 以恢复热导率。值得注意的是，与传统的卷积神经网络 (CNN) 和全连接神经网络 (FCNN) 相比，NMM 可以以极快的收敛速度获得很高的精度。由于本章中的热导率可能是空间/温度/时间相关的，因此设计了不同的输入输出方案。对于空间依赖案例，输出是具有
    $N_f = 5000$ 个采样点的热导率空间分布。对于温度相关场景，输出是 293K 到 303K 温度范围内 $N_T = 1000$ 个采样点。此外，对于时间相关场景，输出是
    0 到 10s 计算时间间隔内的 $N_t = 1000$ 个采样点。在反演过程中，针对不同类的热导率构建了三个 NMM，每个包含 4800 个训练样本和
    1200 个测试样本。


    #### A. 空间相关


    在实际工业中，空间依赖热导率的重构是一个常见课题，特别是在热成像中。因此，验证所提出的 NMM 能够解决这一问题迫在眉。图 4.15 显示了所提出的 NMM
    可以解决这个问题。


    ![](img/020125e0e698f9771fbbd32f2ace1e80_150_0.png)


