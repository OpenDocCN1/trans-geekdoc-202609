    better than the non-image ones. In quantum mechanics, Mills et al. [43] presented
    a Schrödinger solver to solve the ground-state energy. The raised DL architecture
    is based on a convolutional network, aiming at constructing a map between the
    constrained electrostatic potential and the unknown ground-state energy. The results
    have affirmed that the model can yield high accuracy with the absolute error of
    3%. Additionally, other physical quantities like the kinetic energy and the first
    excited state can also be solved by the developed framework, serving as promising
    candidates for computational physics in quantum fields. In hydrodynamics, Liu
    et al. [44] raised a universal and flexible model to predict the non-uniform unsteady
    flow at real time. The DL network is based on the convolutional network, which
    accomplishes the anticipated velocity with high fidelity.

