    $W_{ij}(t) = T_j(t) \otimes h_{ij}(t),$


    $q_i(t) = \sum_{j=1}^{N} a_{ij}w_{ij}(t) \quad (3.30)$


    构建了两个网络，其中一个用于拟合系统函数 $h_{ij}(t$，另一个用于求解权重 $a_{ij}$。网络 1 的输入是第 $j$ 个内表面点的温度值，输出是其与系统函数卷积后的中间函数
    $w_{ij}$。遍历所有内表面点以获得 $N$ 个中间函数，这些函数在网络 2 中进行加权，以获得最终输出，即外表面第 $i$ 个点的热通量。


    # 基于 ConvLSTM 的复杂表面热通量反演


    该网络是一个全连接网络。其输入是一个维度为 $L \times 1 \times N_t$ 的张量，其中 $L$ 是训练样本的数量，$N_t$ 是时间样本的数量。每个时间采样点作为输入的独立节点，网络的输出是受外表面所有点热通量或温度影响的点的权重因子
    $w_0$。遍历所有内表面点以获得 $N$ 个中间函数。这些函数在网络 2 中进行加权以获得最终输出，即外表面第 $i$ 个点的热通量，如图 3.7 所示：


    ### 3.3.3.2 循环神经网络


    采样处的温度受到实验整个传热过程中不同时刻和位置热通量的影响。在构建神经网络时，应考虑时间与空间两个特征对温度的影响，因此使用的神经网络应同时包含这两个特征。由于本实验中要解决的反向热问题可以看作是动态问题的演化反演问题，RNN
    是一个潜在的解决方案。


    经典的 RNN [23] 是一种用于处理序列数据的神经网络。时间序列数据是指在不同时间点收集的数据，早期和后期数据之间存在逻辑关系。对于标准的 RNN，前向传播算法非常清晰。公式可以表示如下形式：


    $h(t) = \phi(Uz(t) + Wh(t) + b)$


    $o(t) = Vh(t) + c$


    $y(t) = \sigma(o(t))$


    其中 $\phi$ 和 $\sigma$ 是激活函数，$U, W$ 和 $V$ 是权重，而 $b$ 和 $c$ 是偏置。经典的 RNN 结构容易受到梯度消失问题，因此难以解决长期记忆问题。为了解决这个问题，研究人员构建了长短期记忆网络（LSTM）[24]。LSTM
    的单个神经元中有三个门来保护和控制单元状态：第一个被称为遗忘门，它会从上一步读取两类信息 $h_{t-1}$ 和 $x_t$，并向单元状态 $C_{t-1}$
    输出一个 0-1 之间的值，以影响前一个单元状态对后续状态的影响。该公式可以写为：


    $f_t = \sigma(W_f[h_{t-1}, x_t] + b_f)$


    接下来，更新门决定存储在单元状态中的新记忆，这代表了信息的选择性遗忘。最后，输出门使用激活函数生成一个新的候选向量。这些门结构的表达式可以表示为：


    $i_t = \sigma(W_i \cdot h_{t-1}, x_t + b_i)$


    $\hat{C}_t = \tanh(W_c \cdot [h_{t-1}, x_t]) + b_c$


    通过这两个门的控制，LSTM 神经元中状态 $\hat{C}_t$ 的变化如下：


    $C_t = f_t \circ C_{t-1} + i_t \circ \hat{C_t}$


    网络的最终输出 $h_t$ 将分别设置为输出和下一个神经元，参与控制遗忘门。因此，$h_t$ 和 $o_t$ 满足以下表达式：


    $H_t = o_t \circ \tanh(C_t)$


    $o_t = \sigma(W_o \cdot C_t + b_o)$


    ### 3.3.3.3 卷积 LSTM


    采样处的温度受到实验整个传热过程中不同时刻和位置热通量的影响。在构建神经网络时，应考虑时间与空间两个特征对温度的影响，因此使用的神经网络应同时包含这两个特征。由于本实验中要解决的反向热问题可以看作是动态问题的演化反演问题，RNN
    是一个潜在的解决方案。


    （此处省略后续重复的段落，以符合“不要重复输出原文”的原则）

