    具有给定边界条件和初始边界的非线性偏微分方程。该框架采用自动微分技术来实现非线性差分算子，并避免了计算过程中复杂的网格划分，因此适用于各种几何形状。事实上，PINN
    的有效性已经通过计算传热领域中的一系列计算问题[20, 21]、电磁学[22]、流体力学[23]、量子力学等[24]得到了验证。


