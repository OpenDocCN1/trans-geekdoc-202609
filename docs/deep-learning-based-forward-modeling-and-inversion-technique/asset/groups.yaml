    parameter updating for a randomly chosen training example $x^{(i)}$ and $y^{(i)}$.


    ```

    $$\theta = \theta - \eta \cdot \nabla_{\theta} J(\theta; x^{(i)}, y^{(i)}) \quad
    (2.53)$$

    ```


