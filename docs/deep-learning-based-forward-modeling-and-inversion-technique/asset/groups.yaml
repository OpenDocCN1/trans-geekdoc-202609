    网络是至关重要的。


    在本章中，建立了一个深度学习框架，通过外部表面温度测量获取工业产品的热导率。需要注意的是，整个数据收集、训练和测试过程完全基于神经网络，而所提框架的验证阶段能够恢复空间、温度或随时间变化的热导率。首先，通过物理信息神经网络（PINN）构建了丰富的训练数据。为了模拟测量误差，在计算出的温度中加入了高斯噪声。为了增强噪声，引入了
    U-net 来提高信噪比（SNR）。输出的去噪信号最终被发送到深度模块以检索热导率。该开发框架仅需一轮训练即可用于在线预测。


