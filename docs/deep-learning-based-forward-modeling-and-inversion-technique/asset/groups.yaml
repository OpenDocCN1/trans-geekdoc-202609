    ### 4.3.3.1 The Architecture of the PINN and Its Loss Functions


    Figure 4.7 displayed the detailed structure of the proposed framework, which is
    based on a fully connected neural network (FCNN). The input is a tensor in $\mathbb{R}^4$,
    representing the points $x, y, z$ and $t$. The output denotes the temperature
    $T(x, y, z, t)$ at the corresponding points. Between the input and output layers,
    there are hidden layers. For sampling points from the inner solving domain, the
    boundary conditions and initial conditions are necessary. The numbers of them
    are $N_f, N_s$ and $N_t$, respectively. In addition, for interior or boundary
    points, the thermal conductivity $k$, its gradient $\nabla T$ and the unit normal
    vector $n$ at the surface are also required in computing the loss function.


    In this section, operators are introduced to simplify the expressions. Suppose
    that $\mathcal{L}_t$ is a first-order differential operator


    $$\mathcal{L}_tT = n \cdot (k\nabla T) + h(T - T_0).$$


    As $n \cdot (k\nabla T) = k\partial T/\partial n$, Equation 4.22 and Equation
    21 are invariant.


    ### 4.3.4 Deep Learning-Based Forward Modeling and Inversion Techniques


    Let $L_a$ be a second-order differential operator


    $$L_a T = \nabla \cdot (k\nabla T) - \rho C_p \frac{\partial T}{\partial t} +
    P. \quad (23)$$


    The heat conduction equation can be expressed as


    $$L_a T(\mathbf{r}; t) = 0, \quad r \in \Omega, \text{ and } t \geq 0, \quad (24)$$


    The Robin boundary condition and the initial condition can be rewritten


    $$L_b T(\mathbf{r}; t) = 0, \quad r \in \partial\Omega, \text{ and } t \geq 0,
    \quad (25)$$


    $$T(\mathbf{r}; 0) = T_0(\mathbf{r}), \quad r \in \Omega, \text{ and } t = 0.
    \quad (26)$$


    The loss function is crucial in utilizing the PINN to solve the PDE, an exquisitely
    loss function not only promotes training speed but also yields more precise convergence.
    However, due to the poor robustness of $L_2$ loss, outliers caused by second-order
    differential terms have a negative impact on network training. Therefore it is
    imperative to introduce a balance term to curb the influence of outliers. Here,
    the $L_{\infty}$ norm is used to guarantee a more stable training process. Consequently,
    the final function $F(T)$ can be described as


    $$F(T) = \lambda_1 ||L_a T||_2^2 + \lambda_2 ||L_a T||_{\infty} + \mu ||L_b T||_2^2
    + \eta ||T - T_0||_2^2 \quad (27)$$


    where $\lambda_1, \lambda_2, \mu$ and $\eta$ are variables. It is noted that the
    first two terms enforce the physics with the PDE while the third term $L_b T$
    and the fourth term $||T - T_0||_2$ implement the boundary and initial condition.
    In order to control the loss, heat conduction models have conductivity $k$ and
    its derivatives $k_x, k_y$ and $k_z$ directly fed to the framework participating
    in computation. The established PINN solver is enabled to generate abundant data
    for training and testing. In this experiment, heat conduction models have the
    same geometries and heat distributions. The data generation process is carried
    out with PyTorch [25] and the training is conducted on an NVIDIA RTX 2080 Ti graphic
    card with a Dell 7920 workstation. The learning rate, suitable optimization and
    activation function are critical. It is remarked that L-BFGS [26] can seek a good
    solution with fewer iterations than Adam [27] for smooth PDEs. However, for stiff
    solutions L-BFGS tends to be stuck in local minima. Besides, it is also observed
    that the acceleration of training can be realized by employing a self-adaptive
    activation function.


    Figure 4.8 shows the relationship between the number of sampling points and the
    average error in the two-dimensional case. It is obvious that the more sampling
    points, the higher the precision of PINN and the smaller the average error. The
    left figure shows the process of average error becoming stable as sampling points
    increase. Figure (a) and Figure (b) in the right figure present the prediction
    results and errors, respectively.


