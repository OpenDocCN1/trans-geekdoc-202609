    # 基于深度学习的正向建模与反演技术


    其中 $h(t)$ 是对应系统函数的脉冲响应。通过上述方程的 $z$ 变换，可以得到：


    ```

    $T(z) = Q(z)H(z) \quad (3.12)$

    ```


    其中 $H(z)$ 是系统函数。虽然这种方法可以快速获得外表的热通量，但它通常限于一维情况。对于二维或三维问题，由于每个测量点和预测点之间存在传递函数，热通量的计算会变得非常复杂。此外，线性假设是基于热物理参数随温度变化恒定的前提，这在实际材料中往往并不成立，因此该方法的使用受到局限。与离线方法相比，在线方法需要的内存或处理单元较少，因此能够更快速预测。然而，由于在线方法使用部分温度信息，其精度无法与基于全时域的离线算法相比。


    ### 3.2.2 神经网络


    近年来，高性能科学计算的飞猛发展促进了深度学习技术在计算物理中的应用。与正向问题相比，深度学习在反演问题上的优势更为显著。得助于 GPU 强大的并行加速能力，完全训练的神经网络可以实现数千倍的速度提升，实现实时热通量重建。目前，现有工作主要集中在简单的人工网络。


    例如，Ghadimi 等人 [19] 将序列函数法与人工神经网络（ANN）相结合，求解刹动片的热反演（如图 3.2 所示）。通过简单的双层全连接网络，他实现了分段热通量的预测。网络的输入是一个包含
    $L$ 个元素的向量（$L=nr$），其中 $n$ 和 $r$ 分别是检测器的数量和特征时间步。输出是当前的热通量。这里，采用了商业软件 FLUENT 3D
    和 SIMPLE 算法来生成网络正向建模数据。值得注意的是，这种方法只能分析独立空间位置的热通量，因此具有很强的局限性。


    Cortés 等人在 [20] 中也通过温度预测了基于时间的热通量。作者采用全连接网络结构来提取未知热通量的时间特征。值得注意的是，这个问题中的热通量在空间上也是均匀分布的。考虑到
    ANN 通常只包含少数神经元，很难重建复杂的热通量。一种常见的应用是将其作为工具替代正向建模过程，以提高计算效率。


    # 基于 ConvLSTM 的复杂表面热通量反演


    ![](img/020125e0e698f9771fbbd32face1e80_101_0.png)


    图 3.2

    利用 ANN 重建热通量。


    例如，2019 年，Huang等人 [21] 使用 ANN 替代了传统的有限元素算法。他们结合自适应序列 Tikhonov 正化来实现热通量预测。尽管该问题解决了
    3D 复杂表面的场景，但其热流仅随时间变化（在空间上均匀分布），在实际场景中，将全连接网络完全视为纯黑箱是不现实的，因为需要训练的参数数量太大。


    尽管前人已尝试将机器学习与 IHCP（反向热流测量）相结合，但该领域仍有许多未知待探索。例如，在实际工业中，利用瞬态温度重建表面热通量是非常的。这是因为：


    - 1. 实际工件的几何形状通常是具有曲面结构的三维不规则物体。因此，只能处理一维或二维的常用近似方法往往会引入无法忍的误差。

    - 2. 热导模型通常是非线性的，因为物理参数往往随温度变化。此外，与温度四次方相关的辐射边界条件也会引入非线性。

    - 3. 热流的计算应该是高效且实时的，特别是在长时间工作的情况下。


    事实上，这些现有方法很难涵盖所有方面。它们在某些点上或多难以获得满意的结果，因此在工业领域受到限制。


    # 基于深度学习的正向建模与反演技术


    | 正向数据 | COMSOL | 说明 |

    | :--- | :--- | :--- |

    | 框架构建 | MATLAB | 通过结合 COMSOL 与 MATLAB 的联合仿真生成所需的正向数据。 |

    | 网络训练 | CUDA | 使用 TensorFlow 构建训练平台，并采用 ConvLSTM 作为基础结构。 |

    | 网络测试 | | 在 CUDA 上训练网络以缩短训练时间。（仅需30 分钟即可达到高精度） |

    | 泛化性 | | 利用工程示例测试框架的泛化能力。（测试集的平均误差率为 5-6%） |


    图 3.3

    利用 DL 框架重建热通量的流程。


    因此，值得探索是否可以将深度学习框架迁移到 IHCP 领域。为了这一目标，引入了基于 ConvLSTM 的网络，成功克服了三个问题。与传统的神经网络相比，所提出的
    ConvLSTM 能够处理包含时空信息的热通量重建问题。网络参数更少且层次更深，因此以更低的成本获取足够的信息。事实上，开发的框架可以实现复杂几何形状、非线性边界的三维热通量的实时重建。


    # 基于 ConvLSTM 的复杂表面热通量反演


    ![](img/020125e0e698f9771fbbd32face1e80_103_0.png)


    图 3.4

    利用 DL 框架检索热通量的工作流。


    不同时间数据的空间特征，通过 LSTM 提取不同时间数据的时间特征，最后采用全连接网络将前两步转换的数据与输出连接。


    在网络过程中，采用了 TensorFlow（一种流行的深度学习框架）作为平台在 GPU（Nvidia RTX 2080Ti）上进行训练。TensorFlow
