    中的图像自然包含空间信息，而 RNN 中的序列信号自然包含时间信息。然后，根据“嵌入物理知识”的思想，微分方程的三个算子 $\mathcal{F}$、$\mathcal{D}$
    和 $\mathcal{B}$ 以离散（差分）方式而非自动微分方式嵌入到损失函数中。


    在 CNN 方面已经做了许多价值的工作。例如，Zhang 等人 [54] 构建了一个基于卷积网络的多感受场（MRF）PINN 模型。该开发的架构能够适应不同的方程和网格密度，无需调整超参数（如图所示）。高阶差分的引入显著提高了框架的准确性和鲁棒性，其结果在三个经典线性偏微分方程（PDE）和非线性
    PDE（N-S 方程）上得到了验证。此外，赵 等人 [55] 开发了一种物理信息代理模型来解决没有标记数据的情况下稳态热传导问题。事实上，该框架能够将热源布局映射到温度分布。注意到，该框架能够适用于迪利克和纽曼边界条件，表现出强大的通用性。此外，通过数值实验证明，该框架可以产生与经典方法和数据驱动模型相当的预测。


    ## 1.3.2.3 基于循环的 PINN


    近年来，RNN（如图 1.13 所示也被应用于基于物理信息的神经架构。例如，Wu 等人 [56] 提出了一种新型 PINN 来求解时间依赖型 PDE。他们采用离散余弦变换（DCT）来编码空间频率，并利用循环神经网络（RNN）处理时间演化。注意到，该框架与基准物理信息深度学习架构相比，实现了先进的性能。Zhang
    等人 [57] 将长短期记忆框架引入物理信息深度学习技术。该工作中的物理量之间的关系通过单个网络表示，并配备了基于中心差分滤波器的数值微分器。物理约束被整合到损失函数中，以增强有限训练数据集的收敛能力。结果表明，物理信息框架能够缓解监督学习中经常遇到的过拟合问题。此外，还分析了该框架的外推能力。


    ## 1.3.2.4 基于生成对抗的 PINN


    最近，甚至生成对抗网络也可以应用于 PINNs 中。在 Yang 的工作 [58] 中，通过自动微分实现了带有物理规律控制的 GAN 架构。观察到，即使噪声维度与有效维度之间存在不匹配，生成的随机过程的近似也具有相当的精度。此外，证实了开发的
    GAN 可以处理相当高维的 PDE，且计算成本较低。


    ## 1.3.3 算子学习


    在偏微分方程领域，传统的数值方法（如有限元法、有限差分法、谱方法等）利用离散结构来近似无限维近似问题的映射。近年来，流行的物理信息神经网络（PINN）通过在解空间中的采样点上训练神经网络来近似
    PDE，但对于传统方法或物理信息网络，边界条件或方程参数的微扰动通常会导致重新计算或重新训练。相比之下，算子学习的目标是学习无限维函数空间之间的映射，可以在无需重新训练的情况下解决整个偏微分方程，从而节省计算资源。最近，PDE
    求解中的算子学习是一个发展迅速的新兴研究方向。本介绍了几个代表性示例。


    2021 年，Amkur 等 [69] 通过学习非线性函数一类积分算子近似了无限维映射。注意到，核积分是通过图网络的消息传递机制计算的，该机制可以植入不同水平的解析。在不同
    PDE 上的数值实验证明，先进的深度学习求解器能够产生理想的解。


    2021 年，Lu 等 [60] 设计了一种新的 DeepONet（如图 1.14 所示），由一个旨在编码输入空间的深度网络（称为分支网络 branch net）和另一个编码输出函数域的框架（主网络
    trunk net）组成。证实 DeepONet 能够学习各种显式算子和隐式算子。


    ![](img/020125e0e698f9771fbbd32f2ace1e80_35_0.png)


    **图 1.13**

    (a) 基于 RNN 的 PINN 示例 (b) 基于 GAN 的 PINN 示例。


    ![](img/020125e0e698f9771fbbd32f2ace1e80_36_0.png)


    图 1.14


    DeepONet 的结构。


    与经典的全连接网络、ResNet 和 Seq2Seq 结构相比，DeepONet 表现出更好的泛化能力和更小的测试误差。此外，发现泛化和测试误差呈现出指数级的收敛速度，因此它可以应用于各种场景。


    2021 年，Li 等 [61] 通过将积分算子直接参数化到傅里叶空间中制定了神经算子，实现高效且表达丰富的框架。与仅学习一个特定方程的传统网络结构相比，傅里叶网络学习的是整个方程族。为了验证数值性能，在
    Burgers 方程、界面 Darcy 流问题和 Navier-Stokes 方程上进行了实验。证实开发的傅里叶网络是首个实现湍流零样本超分辨率的深度学习方法，同时其计算速度比传统求解器快几个数量级。此外，该框架在恒定分辨率下的基于学习的网络也取得了显著的精度。


    2021 年，Chaos [62] 首次将先进的 Transformer（如图 1.15 所示）应用于对应 PDE 的驱动算子学习问题。通过在希尔伯特空间中实现算子理论，证明了缩放点积注意力中的
    Softmax 归一化是足够的但并非必须的。在他的工作中，一种模仿经典 Petrov-Galerkin 投影的新型层归一化是


