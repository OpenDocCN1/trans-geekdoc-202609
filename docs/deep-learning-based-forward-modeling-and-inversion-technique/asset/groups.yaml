  mdcn: "\n\n# 计算物理学问题中基于深度学习的正向建模与反演技术\n\n王银平\n任强\n\n![](img/020125e0e698f9771fbbd32f2ace1e80_0_0.png)\n\
    \n本书详细研究了计算物理学中新兴的深度学习（DL）技术，评估了其在实时替代传统数值求解器进行场场计算方面的巨大潜力。在经过良好训练后，所提出的架构可以同时解决正向计算和反演检索问题。\n\
    \n从整体视角出发，本书涵盖了以下领域。第一章讨论了深度深度学习框架；第二章通过经典的 U-net 求解了热边界条件问题，涉及被动和主动求解器。随后，通过所提出的基于\
    \ Conv-LSTM 的物理感知深度学习结构，解决了曲面上的复杂的热通量问题，表现出极高的精度和效率。此外，第四章采用了具有非线性映射模块的物理感知深度学习结构，通过瞬态温度获取与空间/温度/时间相关的导热系数。最后，在第五章中，为计算物理引入了一系列最新的框架及其相应的应用。\n\
    \n随着深度学习在计算物理学中经历蓬勃发展，更多人渴望相关的阅读材料。本书适用于研究生、专业从业人员以及需要将深度学习用于计算物理的研究人员。\n\n王银平于2020年毕业于中国北京航空大学，获得电子信息工程学学士学位，目前在该校攻读电子科学与技术硕士学位。王先生专注于电磁散射、反向散射、热传导、计算多物理场以及深度学习的研究。\n\
    \n任强于2008年分别毕业于中国北京航空大学和中国科学院声学研究所获得电气工程学士和硕士学位，并于2015年获得美国北卡来纳州杜克大学电气工程博士学位。2016年至2017年，他在宾夕尼亚州立大学帕克公园校区的计算电磁与天线研究实验室（CEARL）担任博士后研究员。2017年9月，他加入北京航空大学电子信息工程学院担任“百人计划”副教授。\n\
