    # 基于深度学习的前向建模与反演技术


    ## 5.3.1.4 训练


    在获取丰富数据集并构建好所需的深度学习框架后，开始训练是可行的。训练使得代理模型获得近似多物理系统中涉及的对象算子的能力。由于网络的主要动力是强制输出结果为软件生成的真值（ground
    truth），因此合适的损失函数至关重要。在这里，在极大然假设下，均方误差是确定选择。在训练过程中，两个框架被分别训练。输入模块被训练将显式边界映射到对应的物理量
    A，而傅里叶模块则旨在利用直接相关的场 A 预测间接场 B。训练完成后，这两个网络被组装以进行多物理预测。


    为了提高形式化训练的效率


    ## 5.3.2 结果与讨论


    在本节中，展示了级联傅里叶网络在上述物理问题中的预测结果。首先，采用了一系列测试用例直观地展示了深度学习框架卓越的预测性能。随后，对三个不同的数据集进行了统计分析，以证明该网络的稳健性。此外，将开发的傅里叶网络与两种传统网络（CNN
    和 FCNN）进行比较，以突显其在不同分辨率下一致精度的优势。最后，通过计算每个模块的时间成本，讨论了所提架构高计算效率的优点。


    ### 5.3.2.1 预测精度


    首先，图 5.11 展示了耦合电热模型中的样本，这是一个热敏电阻，由磷化镓基底、中心处的正温度温度系数材料（PTC）以及周围的负温度温度系数材料（NTC）组成。图
    5.11 (a) 展示了模型的几何形状，(b) 显示了负电阻材料和正电阻材料中导电率与温度之间的关系。在这种情况下，PTC 材料是钛酸钡陶瓷，而 NTC 是尖晶过渡金属氧化物。


