  - '[PAGE 38]


    # Deep Learning-Based Forward Modeling and Inversion Techniques


    ![](img/020125e0e698f9771fbbd32f2ace1e80_38_0.png)


    # ## RNN 1.16


    The RNN structure for simulating wave propagation process via FDTD.


    In geoscience, Sun et al. [65] developed a theory designed recurrent neural network
    (shown in Figure 1.16) to solve the acoustic forward modeling problem. It is apparent
    that implementing the framework to the seismic inverse problem is equivalent to
    the gradient based full-wave inversion approach. Additionally, comparisons between
    the developed DL framework and the traditional nonlinear optimization methods
    (i.e., L-BFGS) is made. The result of this research is validated on the well-known
    Marmousi model.


    In fact, more researches are focused on the inverse problems. For example, Wei
    et al. [66] proposed an induced current learning method (ICLM) by em-bodying advantages
    of conventional iterative approaches into the framework of CNN, which is the first
    time for the contrast source to be learned to resolve the full wave ISPs. The
    combined loss function in the framework is enlightened by the basis-expansion
    strategy of the conventional iterative algorithms, aiming at reducing the computational
    cost. Besides, the framework is devised to concentrate on minor section of the
    induced current by constructing a series of skip connections while esche the major
    part to accelerate the training process. The fascinating performance of the presented
    method is compared to the state-of-the-art pure data DL schemes and one renown
    conventional solver.


    Besides, Liu et al. [67] proposed a physics deep network to bridge the gap between
    the conventional approaches and data-based DL networks. In this work, the unconstrained
    optimization process of the inverse problem is decomposed into four sub-tasks,
    each of which is mapped to a deep network. In the developed framework, the weight
    and regularization of contrast are updated by the corresponding sub-modules. It
    is noted that this architecture effectively integrates neural networks with the
    traditional techniques as well as the underlying knowledge of physics, which even
    surpassed the subspace-based optimization method (SOM) in the high noise environment.'
  - '[PAGE 39]


    # Deep Learning Framework and Paradigm in Computational Physics


    ![](img/020125e0e698f9771fbbd32f2ace1e80_39_0.png)


    FIGURE 1.17


    The inverse DL framework combined with the iteration algorithm.


    Additionally, Guo et al. [68] designed a new iterative deep network (shown in
    Figure 1.17) to handle the 2D full-wave inverse scattering problems. In this model,
    the forward calculation networks employed to predict the scattering field are
    embraced in the inverse frameworks. During the iterative procedure, the inverse
    framework obtained the updating from the residual value between the observed data
    and the calculated data. It can be observed from both synthetic and experimental
    data that the developed model is able to realize super-resolution reconstruction
    with considerable efficiency, accuracy as well as the generalization ability.
    It is anticipated that this framework can be implemented to real-time imaging
    with fairly high reliability.


    Reinforcement learning, another branch of DL approaches frequently employed for
    automatic controlling, robotics game theory (shown in Figure 1.18) is also often
    implemented as an optimization tool integrated with the traditional method to
    optimize the physics parameters in a practical system. It is a feedback-based
    DL methods where an agent learns how to behave in a state by the actions and results.
    In other words, a good action results in positive feedback while a bad action
    leads to penalty. In the design of photonic devices, Huang et al. [69] developed
    a DL-based inverse design strategy where, the geometries along with the colors
    of the device are trained by supervised learning to figure out their relationships.
    The optimization procedure is implemented by a reinforcement learning (RL) algorithm
    to capture the structural optical geometries for required colors, which significantly
    escalates the efficiency for designing. This strategy supplies a comprehensive
    algorithm to immediately encode general function to diverse structures, achieving
    the inverse design of functional photonic devices with considerable reliability
    and precision.'
