    ## 4.2 Progress in Inversion Research


    ### 4.2.1 Gradient-Based Methods


    The Gradient-Based Methods have the advantages of high accuracy and fast convergence.
    However, they are computationally cumbersome and the optimization results are
    unstable, which is possible to fall into the local minimum.


    - Yang [1] employed the Newton-Raphson method to solve the 1D thermal property
    HCs and realized fast convergence.

    - Safaw et al. [2] adopted the Levenberg Marquardt method to evaluate the linear
    temperature-related thermal properties and the conductivity and capacity.

    - Telejko [3] employed theroy-Fletcher-Goldfarb-Shanno (BFGS) method with the
    finite element method (FEM) to invert the thermal conductivity whereas the above
    researches are all about temperature-related conductivities.

    - Huang et al. [4] exploited the conjugate gradient method (CGM) in reconstructing
    the thermal conductivity reality was validated by experiments and simulations.

    - Tovaren et al. [5] utilized a Gaussian-Newton method with the Bayesian algorithm
    to achieve the reconstruction of space-related thermal properties via experimental
    data.

    - Yang et al. [6] applied an amended CGM to extract the thermal conductivity in
    time-domain heterogeneous scenarios through boundary element method (BEM).

