    规则 3D 测试数据集中的样本。（第 1 列）预测热通量，（第 2 列）真实热通量，（第 3 列）（第 1 列）与（第 2 列）之间的相对误差。


    # 基于 ConvLSTM 的复杂热通量反演


    ![](img/020125e0e698f9771fbbd32f2ace1e80_115_0.png)


    # 图 3.11


    固定 3D 测试集中的样本。(a)预测热通量,(b)真实热通量,(c)(a)与(b)之间的相对误差。


    ### 3.4.3.2 可变复杂模型的热反演


    第一个问题是在 SolidWorks 中建模并直接调用 MATLAB 中的函数读取建模数据，这为以后生成更复杂的数据集基础。实验涉及的几何形状是一个金字塔。通过设置模型上下面的尺寸和高度，可以确定模型的形状。利用椭球截取金字塔以形成热通量表面。因此，由于金字塔形状的特征，热通量表面和温度表面的面积不再一致。这导致热通量表面与温度表面的高度差不再一致。这平均耗时小于
    20 ms。


    以下是图 3.12。


    ### 图 3.2

    复杂数据集中的样本。(a)复杂模型的几何形状,(b)热通量与测量温度（t=70s）的预测,(c)热通量与测量温度（t=70s）的真值,(d)(b)与(c)之间的相对误差。


    # 基于深度学习的正向建模与反演技术


    ![](img/020125e0e698f9771fbbd32f2ace1e80_116_0.png)


    ### 3.4.4 统计分析与对比


    上述讨论定性地分析了网络的预测准确性。为了定量分析性能，有对误差率进行统计分析。实验结果如图 3.14 所示。如前所述，“规则”指的是两个表面相互平行的模型，而“复杂”指的是热通量表面弯曲的复杂模型。注意到规则模型提供了更多关于热通量的信息，因此反演难度较低，误差也小。实际上，规则数据集的平均误差仅为
    1.07%，复杂数据集为 6.06%，这有力地支持了该框架卓越的预测能力。此外，由于该框架基于具有强大并行能力的 GPU，对一个案例（包含 71 个时间步，代表
    35 秒周期）给出预测的平均时间仅为 1.27 秒。


