    the transition from the input state to output state. By coding multiple ConvLSTM
    layers and adding LSTM and fully connected layers, a network model can be established
    for IHCP in 3D case. The main disadvantage of classical FC-LSTM in processing
    spatial-temporal data is it does not encode spatial information. To overcome this,
    the input $x_1, \dots, x_t$, cell state $C_1, \dots, C_t$, hidden state $H_1,
    \dots, H_t$ and gate structure $i_t, f_t, o_t$ of ConvLSTM are all 3D tensors,
    and the first two dimensions of them are spatial dimensions (row and column).
    Therefore, it can store different spatial information in different channels, which
    can be achieved by using convolution operators in transformation. The core formula
    of ConvLSTM can be written in the following forms, where “$\circ$” represents
