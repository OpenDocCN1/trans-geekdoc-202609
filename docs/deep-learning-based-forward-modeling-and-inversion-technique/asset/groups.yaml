    # Inversion of Complex Surface Heat Flux Based on ConvLSTM


    This network is a fully connected network. Its input is a tensor with the dimension
    of $L \times 1 \times N_t$, where $L$ is the number of training samples and $N_t$
    is the number of time samples. Each time sampling point acts as a separate node
    of the input, and the output of the network is the weight factor $w_0$ of each
    point affected by the heat flux or temperature of all points on the outer surface.
    All points on the inner surface are traversed to obtain $N$ intermediate functions.
    These functions are weighted in the network 2 to obtain the final output, which
