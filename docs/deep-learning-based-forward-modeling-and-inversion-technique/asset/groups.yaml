    ## 3.3 Methods


    ### 3.3.1 Physical Model of Heat Conduction


    The research in this chapter uses some symbols to represent various parameters
    of the model. $\Omega$ represents the solid area of the homogeneous medium in
    the experiment, and $S_i$ is an unknown heat flux surface, which is irregularly
    curved. Under the assumption that the surface of temperature collection is flat,
    the height information corresponding to each sampling point in the experiment
    can be considered as representing the distribution of the surface. $Q(r, t)$ represents
    the heat flux distributed on the outer surface with the change of spatial position
    and time. The $S_2$ is the surface for collecting temperature, which is set as
    the radiation boundary, and the emissivity is 0.92. All surfaces except $S_1$
    and $S_2$ are adiabatic boundary conditions, which are represented as $S_3$. In
    this experiment, the temperature collector is evenly distributed on the inner
    surface, and each temperature value can be measured by $T_j$, $1 \leq j \leq I$,
    where $I$ is the total number of sensors. Therefore, the physical equations and
    initial conditions at each position in the process can be expressed as follows:


    $$\nabla \cdot(k(T)\nabla T)=\rho C_p\frac{\partial T}{\partial t},r \in \Omega,
    t \geq 0 (3.13)$$


    $$-k\frac{\partial T(r,t)}{\partial n}=q(r,t),r \in S_1, t \geq 0 (3.14)$$


    $$-k\frac{\partial T(r,t)}{\partial n}=\sigma(T_w(r)-T_0)^4,r \in S_2, t \geq
    0 (3.15)$$


    $$-k\frac{\partial T(r,t)}{\partial n}=0,r \in S_3, t \geq 0 (3.16)$$


    $$T(r,t_0)=T_0,r \in S_3, t_0=0 (3.17)$$


