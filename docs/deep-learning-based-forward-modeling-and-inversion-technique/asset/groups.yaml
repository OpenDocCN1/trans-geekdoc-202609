    计算物理是一门利用计算机对物理过程进行数值模拟的新兴学科。计算物理的应用通常非常广泛，渗透到物理学的所有领域。计算物理的研究过程主要包括建模、仿真和计算。其中，建模是指将物理过程抽象为数学模型的过程。仿真是指物理规律的表达与探索，也称为计算机实验。计算是指利用计算机对理论问题进行数值研究和分析的程序。传统的计算物理包括有限差分法[1,
    2, 3]、有限元法[4, 5, 6]、变分法[7, 8]、矩量法[9]、动力学法[10, 11]、蒙特卡洛模拟法[12]等。有限元法的详细过程将在本书后面的章节中介绍，因此第一章不包含。这里简要介绍了基于矩量法（MoM）的电磁散射计算方法和基于稳态热传导的蒙特卡洛模拟法。


