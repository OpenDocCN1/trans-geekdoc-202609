    在本章中，构建了一个基于 U-net 的深度学习框架，用于预测具有复杂几何形状和热属性的三物体温度场。研究了被动和激活场景。在计算精度效率方面，该框架表现出了明显的优点。为了更详细地分析深度学习模型，引入了三个数据集（基础数据集、增强数据集和开源数据集）。实验结果证实了该模型能够比传统算法
    FEM 快两个数量级给出温度场的精确预测。此外，在基础数据集上训练的模型具有优异的泛化能力，证明了框架的鲁棒性。因此，凭借其卓越的加速性能和鲁棒的泛化能力，该框架为在广泛工程领域应用
    3D 稳态热传递求解器提供了指南。


