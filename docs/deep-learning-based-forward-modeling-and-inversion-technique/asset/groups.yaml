    ## 前言


    计算物理是除实验物理和理论物理之外的现代物理第三分支。它是一门新兴学科，将计算机作为工具，并应用适当的数学方法来计算物理问题。计算物理中稳态或瞬态过程的数值建模在各个领域有着广泛的应用，对电磁学、光学、热学、流体力学、量子力学等具有实际影响。辅助建模过程的传统智慧源于应用数学，其中提出了一系列数值算法，如有限差分法
    (FDM)、有限元法 (FEM) 和矩量法 (MOM)，用于解决与多个系统相关的微分积分方程。然而，所有上述方法在处理计算场景时都面临相同的困境。在这种情况下，物理边界以及系统的约束方程被离散化为具有高维空间和数百万未知变量的复杂矩阵。虽然传统算法可能为完成任务提供可行性，但计算效率可能是瓶颈。通常情况下，数小时的计算可能会阻碍研究人员进行实时响应的大规模仿真过程。


    深度学习（DL）近年来进入科学计算领域。科学计算中 DL 技术背后最显而易见的思想是数据驱动建模，传统的求解仅为 DL 算法生成足够的数据，以便在训练过程中学习底层物理机制。然而，任何包含大量变量的正向或反向函数都能通过训练进行忠实近似，而不是通过耗费资源和长时间的数值计算。在计算速度方面，训练良好的
    DL 算法在正向分析中比传统方法快几个数量级。然而，纯依赖数据的 DL 框架是黑箱，必须有训练样本才能产生满意的输出。为此，人们提出了物理信息神经网络（PINN），它通过自动微分方案或差分算子来实现物理约束。PINN
    的方法类似于通过传统数值算法求解，它将边界和物理方程编码为特定形式。因此，PINN 的一个显著缺陷是它仅适用于特定场景，泛化能力较差。相应，人们开发了算子学习架构，它克服了
    PINN 的缺陷并展现出广阔的应用前景。


    深度学习技术作为一种变革性方法，在科学计算中表现出卓越的性能，但它绝不是一种在各个领域都显得晦涩且望而不可及的方法。本书旨在为相关研究提供全面的见解和实践指导，以建立使用深度学习构建的复杂数值求解器。目标读者包括感兴趣在计算物理领域（特别是正向和反向问题）中实现机器学习技术的研究人员。首先，第一章详细介绍了
    DL 框架，如主流的连接网络、卷积网络、循环网络、生成对抗网络和图网络。之后讨论了利用深度学习机制解决计算物理任务的范式，涉及数据物理约束、算子学习以及 DL
    与传统的融合方法。书中通过原始且具体的实验结果，展示了如何完成搭建基于 DL 的求解器的完整流程。第二章用经典的 U-net 处理了稳态正向导热问题，包括被动和主动场景。第三章使用了新兴的
    conLSTM 架构来重建曲面表面的热通量。第四章采用了物理信息神经网络（PINN）和反馈机制来重建复杂的导热率。最后在第五章中，研究了若干种最先进的网络结构，包括
    PINN 在广义坐标中的应用、图神经网络在求解电场中的生案例，以及耦合傅里叶网络在解决多物理问题问题实例。


    在计算物理建模中使用深度学习技术正从实践的火星发展为主流趋势，物理学家、数学家和算法专家聚集在一起解决多尺度和多物理场问题。考虑到这一背景，作者希望所有读者都能从中获益。


    王银鹏

    任强


