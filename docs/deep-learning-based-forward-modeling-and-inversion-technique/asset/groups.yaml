    # 3.3.3.3 Convolutional LSTM


    Shi et al. ConvLSTM [25], which has incorporated the convolution structure in
    the transition from the input state to output state. By coding multiple ConvLSTM
    layers and adding LSTM and fully connected layers, a network model can be established
    for IHCP in the 3D case. The main disadvantage of classical FC-LSTM in processing
