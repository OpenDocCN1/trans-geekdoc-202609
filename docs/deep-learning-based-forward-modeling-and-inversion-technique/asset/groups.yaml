    ### 图 1.6

    带有门控结构的典型循环网络。


    在标准 RNN 中，存在一个隐藏状态向量 $h$，其定义为


    ```

    $h = \begin{bmatrix} h_1 \ h_2 \ \vdots \ h_T \end{bmatrix} \quad (1.36)

    ```


    在这里，隐藏状态 $h$ 和输入向量 $x$ 满足以下公式：


    ```

    $h_{t+1} = \sigma(W_x x_t + W_h h_t + b_h) \quad (1.37)

    ```


    其中，$W_x$ 和 $W_h$ 分别代表输入状态和隐藏状态的权重矩阵，而符号 $b_h$ 和 $\sigma$ 代表隐藏状态的偏置和激活函数。随后，可以基于
    $h$ 计算出最终输出 $\mathcal{Y}$：


    ```

    $y_t = W_y h_t + b_y \quad (1.38)

    ```


    类似地，$W_y$ 和 $b_y$ 是输出层中的权重矩阵和偏置。RNN 在训练过程中经常面临梯度消失和梯度爆炸的问题。为了克服这一缺点，研究提出了提出了短期记忆（LSTM）网络
    [32]，它在较长的序列中表现得更好。与仅有一个传输状态的 RNN 相比，LSTM（如图 1.6 所示）有两个传输状态，可以选择性地遗忘从上一个节点传递的信息，从而关注更重要的信息。另一种特殊的
    RNN 结构是 GRU [33]，它也是为了解决长期记忆和反向传播中的梯度问题提出的。GRU 能够获得与 LSTM 相当的结果，但所需的计算量更少


    # 计算物理中的深度学习框架与范式


    ![](img/020125e0e698f9771fbbd32f2ace1e80_25_0.png)


    **图 1.7** 典型的生成对抗网络，由生成器和判别器组成。


    此外，BRNN 用于使数据能够正向和反向传播，而 GRNN 则引入了 Resnet 结构以减少参数数量。


    ## 1.2.4 生成对抗网络


    生成对抗网络（GAN）是一种用于无监督学习的强大深度学习框架，由 Ian Goodfellow 于 2014 年发明 [3]。GAN（如图 1.7 所示）通常由两个相互竞争的网络组成：生成器和判别器。生成器用于生成一系列伪样本，并试图欺骗判别器。另一方面，判别器尽力区分真样本和伪样本。生成器和判别器都是在训练过程中相互竞争的深度学习网络。


    GAN 中的判别器的目标是奖励 $V(D,G)$，而生成器的目标是最大化损失 $V(D,G)$，这在数学上可以描述为：


    ```

    $$\max_{G} \min_{D} V(D, G) = E_{p_{data}(x)}[\log D(x)] + E_{p_z(z)}[\log (1
    - D(G(z)))]$$

    (1.39)

    ```


    GAN 的原始损失等同于 JS 散度（JSD）：


    ```

    $$\max_{G} \min_{D} V(D, G) = -2\log 2 + \min [2JSD(p_{data}||p_G)]$$

    (1.40)

    ```


    JS 散度存在一个严重问题：当两个分布不重叠时，JS 散度为零。因此，在训练开始时，JS 散度可能是零。如果判别器训练得太强，损失将无法在梯度的情况下收敛到
    $-2\log 2$。对于这个问题，WGAN 提出了一种新的损失——Wasser 损失。


    ```

    $W(P_r, P_g) = \inf_{\gamma \in \Pi(P_r, P_g)} E_{(x,y)\sim\gamma} |x - y| \quad
    (1.41)$

    ```


    该项的直观意义是移动分布 $r$ 移动到分布 $g$ 所需距离。因此，如果两个分布不重叠，该损失将具有值。这种损失函数克服了传统 GAN 损失梯度消失的缺点，并确保了训练过程的稳定性。


    GAN 是一个非常活跃的话题，各种新颖框架被开发出来。这里描述了一系列新兴的基于 GAN 的框架：


    - 1. 条件 GAN (CGAN)：CGAN [35] 是一种引入了某些条件参数的深度学习框架。在这里，为生成器引入了额外的参数以产生所需的数据。此外，标签也会输入到判别器。

    - 2. 深度卷积 GAN (DCGAN)：DCGAN 引入了卷积结构来替代全连接层，以减少计算量。

    - 3. 超分辨率 GAN (SRGAN)：SRGAN [37] 被用于生成高分辨率图像，特别是对低分辨率图像进行细节增强。

    - 4. 拉普拉斯金字塔 GAN (LAPGAN)：LAPGAN [38] 能够生成高质量图像。


    最后，一些先进的深度学习技术如图网络、傅里叶网络和 Transformer 将被介绍。之前的部分讨论了基础架构，实际上有许多范式利用机器学习来解决实际问题。


    ![](img/020125e0e698f9771fbbd32f2ace1e80_27_0.png)


    图 1.8 计算物理中的数据驱动示例。(a) 泊松方程求解器 (b) 电磁散射求解器 (c) 稳态导热求解器 (d) 薛定谔方程求解器


    ## 1.3 深度学习的范式


    这部分主要讨论：数据驱动、物理约束、算子学习和深度学习。以下详细述：


    ### 1.3.1 数据驱动


    数据驱动深度学习技术是计算物理中最直接的应用之一。这种方法通常基于监督学习，需要大量的预生成数据。数据驱动模型可以被视为黑箱，即研究人员不需要关注网络结构与物理问题之间的联系，只需关注输入和输出。换句话说，这种学习风格基本上是端到端的。数据驱动的优势在于，训练后可以实现在线预测，适用于各种场景。


    如图 1.8 所示，数据驱动技术已广泛应用于计算物理。例如，在静电领域，Shan 等人 [39] 开发了一种纯数据驱动模型，基于卷积网络求解泊松方程。有了足够的训练数据和合适的训练平台，该框架能够获得可靠的结果。


    在纳米光学中，Li 等人 [40, 41] 提出了一种全训练网络，用于解析孤立结构的近场散射。可以发现，仅需少量样本即可训练 CNN 以达到高精度。在热传导中，Tadeeparti
    等人 [42] 利用数据驱动架构求解了二维情况下的稳态导热问题。涉及的导体具有正方形几何形状各种边界。从 SSIM 来看，基于图像的算法优于非图像算法。


