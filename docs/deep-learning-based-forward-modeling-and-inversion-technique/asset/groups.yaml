    ## 4.5.2.4 泛化能力


    泛化能力是一个描述深度学习（DL）模型在给定训练集上训练后对新数据反应能力的术语。换句话说，即模型是否能够吸收新样本并做出合理的预测。


    由于策划数据集中的样本随温度或相关材料模型表现出不同的变化趋势，这部分仅关注于空间相关的案例。这里，采用了从原始数据集中提取的 1000 个完全不同的样本来评估泛化能力。为了模拟实际产品的反演，数据包含了具有离散热导率的试件。


    尽管所提出的网络倾向于在界面处给出平滑的热导率预测，这在某种程度上明显地扩大了误差。尽管如此，平均误差仍为 8.8%。虽然这比之前的要要，但由于两个数据集之间存在巨大差异，它证明了强强大的泛化能力。


    图 4.22 展示了构建数据的反演结果。


    ## 4.5.2.5 计算速度


    利用所提出的网络恢复热材料的一个显著优势是它充分利用了 GPU 的并行计算能力以避免繁琐的迭代，使得实时获取预测结果成为可能。这里统计了每个子网络处理 100
    个样本的时间成本，如表 4.4 所示。


    ## 基于深度学习的前向建模与反演技术


    ![](img/020125e0e698f9771fbbd32f2ace1e80_154_0.png)


    **图 4.23**

    空间相关热导率测试集上随训练迭代次数变化的归一化损失。


    ## 表 4.4


    | 网络 | 时间 (s) |

    |---|---|

    | PINN | 2803 |

    | U-net | 3.6 |

    | NMM Space | 5.2 |

    | 温度 | 1.0 |

    | 时间 | 1.1 |


    发现 PINN 平均仅需 28s 即可计算温度数据，是传统软件 COMSOL（平均约 80s）的三倍速。对于反演过程，U-net 和 NMM 的单个样本时间成本和小于
    0.1s，这使得解决实时问题成为可能。


    ## 4.5.2.6 与传统网络的比较


    在这一部分，将经典卷积神经网络（CNN）和全连接网络（FCNN）的反演性能与提出的 NMM 进行了比较。对于卷积神经网络，考虑到卷积核的形状无法与口袋边界匹配，伪影被实现在立方体中，而原始边界之外的热导率被固定为零且不参与损失计算。空间依赖案例在测试数据集上随迭代次数变化的损失情况如图
    4.23 所示。


    ## 基于深度学习的热物理参数重建


    ![](img/020125e0e698f9771fbbd32f2ace1e80_155_0.png)


    图 4.24

    温度相关热导率测试集上随训练迭代次数变化的归一化损失。


    ![](img/020125e0e698f9771fbbd32f2ace1e80_155_1.png)


    图 4.25

    时间相关热导率测试集上随训练迭代次数变化的归一化损失。


    很明显，CNN 由于参数最少，具有最快的收敛速度。然而，由于反演问题是高度线性的，卷积神经网络的性能较。此外，将提出的 NMM 与经典的 FCNN 相比，可以在实现相似损失的前提下，开发的
    NMM 可以获得更快的收敛速度。对于温度和时间相关案例，由于拟合数据是曲线且不符合卷积网络的格式，因此仅提供了全连接网络与提出的 NMM 性能的对比。结果如图
    4.24 和图 4.25 所示。


    ## 4.6 结论


    在本章中，开发了一种基于深度学习的热导率重建模型。该网络采用深度学习框架来完成整个过程，由数据生成、降噪和热导率重建组成。对于数据生成，二维数据采用了外部商业软件的方法，而三维数据构建通过
    PINN 完成。得益于 GPU 并行能力的优势，PINN 能够根据网格密度实现精确计算。对于测量误差，PINN 的计算结果加入了白噪声并发送到 U-net
    进行降噪。注意的是，降噪 U-net 能够提升用于重建热导率的最后一个模块的输入质量。反演针对 2D 和 3D 使用了不同的框架。对于 2D 案例，引入了经典的全连接网络，而在
    3D 场景中应用非线性映射模型。反演结果显示了深度学习在参数检索方面的前景。此外，由于网络可以在 0.1s 内完成反演过程，这种这种架构可以广泛应用于实时场景。


