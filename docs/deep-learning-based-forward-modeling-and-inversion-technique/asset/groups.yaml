    # 5.3.1.1 Framework Architecture


    Here, the architecture of the proposed DL framework is shown in Figure 5.10 (a),
    which consists of two parts, the input module and the Fourier modules. Here, the
    input module extracts valuable characteristics from the boundaries to obtain the
    immediately dependent fields. The main structure of the input framework is based
    on the onetnet, which is made up of several of fully connection layers, transpose
    convolutional layers and a convolution layer. In order to normalize the output
    and add nonlinearity of each layer, batch norm layers and activation function
    are attached. The Fourier module is the core of the network, performing the operator
    learning from one physics field to another.


    This architecture is formulated by Liu et al., which parameterizes the integral
    kernel deeply in Fourier space. Unlike traditional DL frameworks or PINNs [12]
    which merely learns how to solve the equation, the Fourier network learns the
    operator itself, demonstrates high generalization capability. As displayed in
    Figure 5.10 (b), the Fourier architecture can be further divided into two parts.
    One contains a Fourier transform; a Hadamard matrix product layer followed by
    an inverse Fourier transform layer. The other is a Hadamard matrix product layer.
    The input is split into the upper and lower part and the output of the two parts
    are added first and then activated by a nonlinear function.


    It can be verified that the input and output of each Fourier module completes
    with:


    ```

    $u_o(x) = \sigma\left(Bu_u(x) + \mathcal{F}^{-1}\{AF[u_u(x)]}\right)\quad(5.27)$

    ```


