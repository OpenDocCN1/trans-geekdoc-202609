    - 3. Super Resolution GAN (SRGAN): SRGAN [37] is employed to generate higher resolution
    images, which is especially applicable for low-resolution images to enhance the
    detailed characteristics.


    - 4. Laplacian Pyramid GAN (LAPGAN): The Laplacian GAN [38] employs a couple of
    Generator and Discriminator frameworks for it is to produce high-quality images,
    which is firstly down-sampled and up-scaled in the back pass in which the Conditional
    GAN is implemented to generate some noise.


    Finally, several advanced DL techniques such as the Graph Network, the Fourier
    Network, and the Transformer will be introduced at the last chapter. For the sake
    of conciseness, they will not be discussed as expendable in this chapter.


    ## 1.3 Paradigms in Deep Learning


    The previous section discussed several basic architectures in depth. In fact,
    there are many paradigms to solve practical problems using machine learning.


    ![](img/020125e0e698f9771fbbd32f2ace1e80_27_0.png)


    FIGURE 1.8 Examples of the data driven examples in computational physics. (a)
    Poisson''s solver, (b) EM scattering solver, (c) steady-state heat conduction
    solver and (d) Schrödinger equation solver.


    This part mainly discusses them of: data-driven, physical problems, physical constraints,
    operator learning and deep learning-traditional algorithm fusion. The following
    four paradigms will be elaborated:


    ### 1.3.1 Data Driven


    Data-driven deep learning technology is the most straightforward application of
    deep learning in computational physics. This method is usually based on supervised
    learning, and its application requires a large number of pre-generated data, which
    are often constructed by utilizing numerical algorithms. The data-driven network
    model can be regarded as a black box, that is, researchers do not need to pay
    attention to the connection between the network structure and physical problems,
    but only focus on the input and output. In other words, this kind of learning
    style is basically end-to-end. The advantage of data-driven network is that it
    can realize online prediction after offline training, which can be applied to
    various high-speed scenes.


