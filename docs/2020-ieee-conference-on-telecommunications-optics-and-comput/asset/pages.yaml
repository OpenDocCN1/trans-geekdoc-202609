    # II. CONCLUSION


    # A. Project Conclusion


    In this practice, based on the data set of situation of customers in a business
    district, the work was completed:


    +   1) Finishing of all stores in the business district

    Original consumption data set only contains customer consumption amount, customer
    consumption date, customer time and other data, so it is necessary to process
    the original data set. Aggregate and group the customers of all stores by the
    store ID, and calculate the per capita consumption amount, person-working days
    and rest of each store as the performance indicators. Since there is no clear
    classification of each store in the data set, this classification problem followed
    by the unsupervised learning model. Cluster model can be used to classify the
    customers in the business district. For the visualization of the results, the
    three-dimensional data set was reduced to two dimensions by principal analysis,
    and then two-dimensional data set was clustered by K-means to classify all sample
    points under different k values. It is found that the clustering effect is best
    when k = 3. Finally, the clustering results are imported into the Power BI software
    and presented in the Sankey diagram.


    According to the Sankey diagram, it branches of stores with IDS of 7, 15, 37 and
    56 are within the business district, this means that these stores have the best
    performance. Therefore, the business district can hold the ability of promotion
    in order to increase the customer flow and performance for the stores business
    district.


