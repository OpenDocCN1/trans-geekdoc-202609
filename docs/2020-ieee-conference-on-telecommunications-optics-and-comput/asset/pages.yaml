    # 2) The clustering process of stores


    # (1) Extraction of key performance indicators


    To obtain the per capita consumption amount of each store in the district, the
    data shall be grouped according to store ID and then the per capita consumption
    of each store shall be calculated according to the consumption date of each store
    and the customer amount per person. By calculating it it is possible to distinguish
    high consumption stores from low consumption stores in the business clustering
    process.


    To calculate the time consumption of each store in the business circle, the original
    data should be processed according to consumption distribution subdivided into
    working days and rest days, as to distinguish the types of stores. With more consumption
    records on working days are daily stores, with more consumption records on weekends
    are weekend stores. Therefore, it is necessary to replace the consumption of customers
    in the data with working days and rest days. The consumption records of all-person
    should be grouped by store ID and then the consumption on working days and rest
    days of each store can be counted successively. Finally, the data containing three
    key performance indicators can be obtained.


