    +   (c) Clustering of data


    After the data is reduced to two dimensions, the two-dimensional data set can
    be directly clustered. Since the set does not contain outliers, K-means clustering
    method can be selected to cluster the data set.


    The process of K-means clustering is as follows:


    +   a) Randomly select $k$ points in the data set as the cluster center.


    +   b) The remaining points are grouped into the nearest cluster based on their
    distance from the cluster center.


    +   c) Calculate the mean of each cluster as the new cluster center


    +   d) Repeat step 2 and 3 until the cluster center no changes


    When determining the number of $k$ clusters, the method can be used to judge and
    calculate the sum of squared errors of all points when $k$ was taken as different
    values:


    ```

    $SSE = \sum_{i=1}^{k} |p_i - m_i|^2$

    ```


    $C_i$ represents the $i$th cluster. $p_i$ is the point in the cluster, and $m_i$
    is the center of $C_i$.


    As the number of $k$ increases, the sum of squared errors decreases gradually.
    When $k$ reaches the true clustering number, the increase of $k$ will decrease
    the degree of error of each cluster, the sum of squares will decrease gradually.
    However, when $k$ exceeds the true clustering number, the degree amplitude will
    decrease sharply, and the sum of squared errors will remain flat. In other words,
    we need to determine the most appropriate $k$ value that follows the downward
    trend of the sum of squared errors. This $k$ value obtained is the optimal clustering
    of K-means clustering.


    After K-means clustering of the data, the results can be visually output.


