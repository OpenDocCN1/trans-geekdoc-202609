    following assumptions are needed to reduce the error of the multicayer artificial
    neural network for the diagnosis of the disease:


    +   - The weight and bias used in the multicayer artificial neural network are
    encoded as a vector or memory of the fruit fly algorithm.


    +   - A number of weight and bias vectors are generated in the form of a population
    random fly optimization algorithms.

    - The average disorder of diagnosis and classifying individuals into sticky and
    healthy groups is considered as goal function and an attempt is made to select
    weight and bias to minimize error.


    +   - The weight and bias of the artificial neural network are updated at each
    stage by the relationships of the fruit fly optimization algorithm, and the role
    of this algorithm is to search the final space with the optimal weight and bias
    to reduce the classification error.


    +   - An optimal multilayer neural network with optimal weight and bias is used
    for the final classification of healthy and sick people.


