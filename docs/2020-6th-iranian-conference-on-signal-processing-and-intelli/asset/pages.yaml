    Abstract

    Mining methods can be used to classify people as sick or healthy to diagnose diseases.
    One of the important challenges in diagnosing the disease using learning methods
    such as multicilayer neural network is the option of parameters to be solved with
    meta-heuristic algorithms, but these are not without problems in these methods
    meta-heuristic To a certain extent, it can only reduce the error, and to reduce
    the machine learning error it is necessary to select the appropriate features.
    The proposed method has two layers and in the first layer the selection of features
    is done using the fruit fly algorithm and in the input layer, the feature selection
    is done using the binary version of the fruit fly algorithm. Results on various
    medical datasets in the UCI database show that the accuracy, sensitivity, and
    specificity of the proposed method are 98.80%, respectively. The proposed method
    is accurate in diagnosing diabetes besides the PSO, FA, SHO, and HMO algorithms.


