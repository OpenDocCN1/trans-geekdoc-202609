    # VI. CONCLUSION


    One of the important applications of data mining

    machine learning is to diagnose diseases such as diabetes. The

    proposed method to enhance feature selection and weight bias of

    multilayer neural network to reduce data classification

    error and pattern samples are presented. Experiments show that

    the proposed method outperforms existing methods The

    basic of machine learning and classification used in the

    disease of diabetes has been reduced by 32% and that the

    accuracy, sensitivity, and detection of the proposed method

    is improved by combining feature selection and optimizing

    the neural network weights. Future research will attempt to

    identify other diseases, such as heart

    disease, liver disease, and data sets related to a variety of

    diseases.


