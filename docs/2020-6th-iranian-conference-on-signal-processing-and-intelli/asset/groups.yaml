    ## 基于果蝇算法的特征选择提高机器学习诊断疾病的准确性


    Mehkdi Salkhhorde Hagighi

    计算机工程与信息学院

    Sadjad大学

    伊朗马什哈德

    haghigh@sadjad.ac.ir


    Mohammad Javad Mashhadi Hoseini

    计算机工程与信息学院

    Sadjad大学

    伊朗马什哈德

    mo.mashhadi_hoseini42@sadjad.ac.ir


    ### 摘要

    挖掘方法可用于将人员分类为患病或健康以诊断疾病。使用多层神经网络等学习方法诊断疾病时，面临的重大挑战之一是需要用元启发式算法求解的参数选择，但这些元启发式方法中并非没有问题。在某种程度上，它们只能减少误差，而为了减少机器学习误差，必须选择合适的特征。所提方法包含两层：第一层使用果蝇算法进行特征选择，在输入层使用果蝇算法的二进制版本进行特征选择。在
    UCI 数据库中各种医疗数据集上的结果表明，所提方法的准确率、敏感性和特异性分别为 98.80%。除了 PSO、FA、SHO 和 HMO 算法外，所提方法在糖尿病诊断方面也是准确的。


    在医疗领域需要训练并创建一个分类模型，将健康与个体分开。在机器学习的帮助下，分类至关重要，因为它降低了使用数据和医疗医生过去信息来发现疾病隐藏模式的成本，另一方面，分类可以帮助医生诊断疾病。基于机器学习的方法有多种，其中一些使用元启发式算法输出误差。有必要进行特征选择以仅关注重要特征。在研究
    [4], 2019 中，在使用灰狼优化算法 (GWO) 诊断疾病之前，利用机器学习减少疾病诊断误差。所提方法显示的准确率超过 76%，但在他们的实验中，准确率也在
    73% 左右。在他们的实验中观察到，所提方法的敏感性约为 88%，特异性约为 90%。


    **关键词** 特征选择、数据挖掘、果蝇算法、机器学习、疾病诊断、群智能


    ## I. 引言


    分类是根据拥有的标签将数据分为不同类别的过程，与聚类不同，这些类别是在时间之前定义的或之后创建的 [1]。分类信息有多种方法，包括支持向量机、决策树和最近邻
    [2]。与患者相关的数据被用于数据挖掘方法分类心脏病、糖尿病和胃肠道疾病。据报道，健康人和患者病史中的信息可以是分析其模式和预测疾病的重要来源。对这些数据进行分析是稀缺的，且需要高水平的知识。


    在其中发现它们并根据这些知识进行评估 [3]。使用模糊方法结合特征提取方法进行数据分类的医疗数据分析诊断技术。实验表明，所提方法在解决疾病诊断的现实问题方面优于其他方法。在研究
    [7], 2020 中，展示了使用支持向量技术分析医疗结构。在研究 [8], 2020 中，群智能方法在数据挖掘特征选择中的优势之一是它回顾了群体智能方法来选择特征。缺点之一是它被用于各个领域的数据问题，医学领域在特征数量或维度方面，这导致当专门使用机器学习算法时，“大维度”会产生时间挑战和分类误差。特征选择是一项选择少量且信息丰富的特征子集以提高性能的重要技术。


    - 在研究 [9], 2020 中，提出并建模了一种基于混沌的用于医疗诊断的支持向量机优化算法。实验结果表明，所提方法在分类性能和特征子集大小方面优于其他竞争对手。


    在研究 [10], 2020 中，介绍并展示了用于癌症诊断的基于混沌的支持向量机优化算法。实验结果表明，所提方法在分类性能上优于其他对手。


    在研究 [13], 2020 中，使用了遗传算法 (GA) 用于肝炎诊断的分类方法。实验结果表明，所提方法在分类性能和特征子集大小方面优于现有方法。


    根据综述，所提方法尝试克服的神经网络局限性如下：


    - 在这些研究中，支持向量机被用于分类和分析疾病，主要的挑战是支持向量机的复杂性，所提方法使用了神经网络。


    - 在研究中，优化算法被用于机器学习中的参数选择，重要的挑战是分类不仅取决于参数选择，还需要特征的最优选择。


    - 在某些方法中，特征选择被用于减少误差。所提方法通过果蝇算法优化神经网络的参数以减少分类误差。


    在研究中，果蝇算法被用于特征选择以提高准确率和发现。因此，所提方法尝试通过神经网络的优选择来增加准确率和发现。


    本文的目标包括通过改进的机器学习和群智能使用果蝇算法进行疾病诊断，并在医学应用于特征选择。为此，使用了果蝇进化算法，它具有很强的空间搜索能力，优于遗传算法等粒子群优化算法。本文由若干部分组成：首先描述神经网络和果蝇算法，然后解释所提方法，接着展示所提方法的实验和分析，最后给出结论。


