- - '##'
  - 再次查阅《牛津英语词典》（*OED*）中“operation”（操作/运作）的定义，我们看到它过去是——现在依然是——一个适用于描述各类工作的通用术语：第
    1.a 条定义为“力量或影响的施展；工作、活动；一种工作方式、事物运作的方式。”“Operation”因此与数学“function”（函数）形成对比。^(41)
    正如安托万·皮孔所强调的，“必须注意到，尽管量化和数学计算可被视为分析的精髓，《百科全书》的分析方法完全可以保持纯定性。”^(42) 换言之，函数的工作语言是定量的；操作的工作语言可以是纯定性的。
