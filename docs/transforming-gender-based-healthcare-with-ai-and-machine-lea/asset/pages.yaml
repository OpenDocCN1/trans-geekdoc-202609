  md: '# # Studies in Intelligent Systems and Cognitive Computing


    Series Editors: Vijender Kumar Solanki, Vinit Kumar Gunjan and Mohammed Usman


    This new book series will contain books on theory, applications, and design methods
    of Intelligent Systems and Intelligent Computing. Virtually all disciplines such
    as engineering, natural sciences, computer and information science, ICT, economics,
    business, e-commerce, environment, healthcare, life sciences will be covered.
