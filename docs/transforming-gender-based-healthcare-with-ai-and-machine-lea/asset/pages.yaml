    # 7.3.3 AI FOR VOICE MODIFICATIONS


    For the modification of voices (as shown in Figure 7.4), AI technology plays an
    important role to change or personalise someone''s voice. The AI software can
    be used for a variety of applications, such as voice synthesis for people with
    speech impairments, transgender voice training, and voice cloning for voiceovers
    or digital assistants for entertainment purposes. Here is an outline of how AI
    is applied to voice modifications:


    +   - Voice Transformation: To accomplish desired results, AI algorithms are able
    to alter a person''s voice''s pitch, tone, and other features. AI can help transgender
    people receiving voice training by either masculinizing or feminising their vocals
    to better reflect their gender identification.

    +   - Speech Synthesis: The creation of human voices is achieved through speech
    synthesis technology. The main feature that also led to its creation is the ability
    to automatically convert typed text into speech.

    +   - Voice Conversion: The process of voice conversion involves conveying the
    essence or personality of a speaker to another speaker without altering their
    speech structure.

    +   - Privacy and Security Considerations: By modifying the vulnerability of AI-based
    health systems during their development, they can be more secure and privacy-protected.
    Secure voice authentication methods, encryption, and segregated privacy are among
    the technologies that safeguard user voice data from misuse or illegal use.'
