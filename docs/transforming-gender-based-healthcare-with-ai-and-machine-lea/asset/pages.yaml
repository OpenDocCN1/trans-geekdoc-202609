  md: '# # 11 AI and ML Fundamentals


    A primer for healthcare professionals


    Somya Srivastava, Gaurav Dubey, Disha Mohini

    Pathak, Kamlesh Sharma, and Kuldeep Kumar


    # ## 11.1 INTRODUCTION


    Many new fields are being introduced by advancements in artificial intelligence
    (AI) and machine learning (ML). Machine intelligence, often known as AI, is the
    ability of a machine to perform tasks that a human brain can. Because AI allows
    robots to think, reason, grasp languages, and learn, it has revolutionized human
    interaction with technology [1]. Conversely, machine learning is a subfield of
    AI that deals with the use of algorithms to acquire new knowledge by analyzing
    existing data, drawing conclusions or predictions based on those conclusions,
    and then applying those conclusions or forecasts in the actual world. They have
    a profound impact on both their industries and their environment.


    As shown in Table 11.1 ([2]), AI has radically boosted healthcare. The potential
    for disruptive innovations in healthcare is discernible from the escalating pace
    of expansion in the sector coupled with extensive financing by many startups.
    Measurable improvements in diagnosis accuracy rates and outcomes among patients
    together with high adoption rates of AI technologies in hospitals are indicators
    of the tangible contributions made by AI towards increasing effectiveness in healthcare
    delivery process. Not only does the value of these two technologies extend beyond
    technological advancement per se, but also represents changes in problem solving
    approaches as well as operational performance enhancement practices. AI and ML
    are seen as potential methods for tapping useful insights from expansive data
    sets today because more information is being produced and consumed second by second
    than ever before [3]. Artificial intelligence systems have led to some of the
    most significant breakthroughs in the healthcare industry, particularly in the
    areas of diagnosis, treatment planning, and patient monitoring. This therefore
    makes it a simple matter to improve customer relations using tailored suggestions.


    The utilization levels of AI tools in the healthcare sector have experienced a
    significant and rapid increase, both in terms of depth and scope, as indicated
    in Table 11.2. This suggests the widespread adoption of technological advancements
    and the expansion of their application in various areas. Hence it is anticipated
    that utilizing such tools will comprise major activities in delivery of healthcare
    to mankind'
