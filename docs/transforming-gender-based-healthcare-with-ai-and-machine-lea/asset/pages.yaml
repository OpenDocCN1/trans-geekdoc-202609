  md: '# # 8 Patient-Centric Technology Empowerment


    Fathimathul Rajeena P.P. and Shakeel Ahmed


    # ## 8.1 INTRODUCTION


    Patient engagement or empowerment has become a key component of patient-centred
    care. The patients can regulate their health and be more active in their treatments
    [1–2]. Patient empowerment improves well-being, health status, self-management,
    and quality of life cost-effectively [3]. Professionals can better treat and educate
    each patient on an individual basis by identifying and measuring patient empowerment.

    Patient empowerment encompasses the following [4]:


    +   - Psychological empowerment

    +   - Community empowerment

    +   - Organisational empowerment


    People develop or are provided opportunities to influence their own lives through
    psychological empowerment, which includes interactional, behavioural, and intrapersonal
    components [5]. Organisational empowerment consists of both internal activities
    that provide people with more authority inside the organisation and external mechanisms
    that allow the organisation to impact choices and policies in the community at
    large [6]. Community empowerment involves people and groups working together to
    improve community living and transform the social system. Patients’ capacity,
    power, and knowledge to manage their conditions and lifestyles are integrated
    into the definitions of patient empowerment. Patients’ empowerment must be done
    by themselves, while healthcare experts can only help [7].


    Empowering patients means letting them handle their care. Patients have more power
    over health decisions and behaviors in a respectful and trusting provider—patient
    relationship. Internet tools, therapy, and funding information help patients comprehend
    prognoses, appropriate treatment alternatives, and treatment costs. Empowered
    patients educate themselves, ask questions, and make decisions about their treatment.
    Patient empowerment is vital to a high-performing, cost-efficient healthcare system.


    # ## 8.2 STRATEGIES FOR ATTAINING PATIENT EMPOWERMENT


    Strategies for patient empowerment include:'
