    overall system. Machines learn from experiences by using mathematical techniques
    that help machines to further improve. ML is already used in the healthcare sector
    and requires more future considerations in this sector [17].


    DL is a subfield of ML that uses models based on deep neural networks need to
    identify patterns with little human effort. Deep learning is applied to large
    amounts of data and extracts useful patterns and information, which can take human
    decades if done manually. DL methods use hierarchical levels of artificial neural
    networks that are motivated by the biological human brain. DL is used to build
    new functionality that not only discovers new features from a big data set but
    also forms new ideas [18]. In the healthcare sector it is not only used to detect
    diseases but also predict models for treating these diseases. DL techniques are
    also beneficial in cancer detection, radiology and pathology where they can provide
    treatment by building models that cannot be done easily by human beings [19].


    The way AI and ML technologies are integrated marks a revolutionary shift in the
    healthcare industry through innovative methods and new advancements. This paradigm
    shift in technology is not only based on theoretical concepts but also in practical
    implementation in medical research, diagnostics and improved therapies. Improvements
    in the latest innovative techniques based on these technologies in the medical
    sector will replace the conventional methods of curing diseases, therapeutics
    and patient care.


