    the use of AI [15].


    # 1.3 RELATIONSHIP AMONG AI, NLP, ML AND DL


    AI came in existence in 1951. When the first AI program was developed its prime
    objective was for research activities. In the beginning, AI research focused on
    rule-based and expert systems, and in later stages it moved to making machines
    smarter. AI is a broad and evolving branch of computer science whose task is to
    create smarter machines that can perform tasks in intelligent ways. In today’s
    scenario, AI is not limited only to research but has impacted other areas like
    transportation, digital finance and the healthcare sector. In the recent past
    a continuous development has been observed in the clinical sector where AI-based
    models are used for patient care.


    AI techniques include ML, deep learning (DL) and natural language processing (NLP),
    and each of these technologies have a well-defined functionality. Figure 1.1 depicts
    the relationship among these technologies. NLP is subfield of AI that deals'
