- pgno: 213
  md: 'designed to solve complex problems among others [5]. The idea is not just to
    imitate but also enhance upon natural cognitive abilities demonstrated by people
    so they can do harder things better than before. In healthcare, AI involves developing
    various applications that mimic mental processes such as learning new information
    and solving problems through which data can be analyzed, patterns identified,
    educated decisions made and useful insights offered. There are two main categories
    of artificial intelligence systems used in medicine, namely, weak (narrow) and
    strong (general) [6].


    **Narrow AI,** often known as weak AI is programmed with specific instructions
    on what task it should perform and how to do it; therefore, they have limited
    scope within which their operations can be executed, but this doesn’t mean that
    such systems lack awareness about themselves or any other form of true intelligence.
    Examples of this kind include virtual personal assistants (e.g., Siri), recommendation
    algorithms used by shopping websites (e.g., Netflix), etc.


    **General AI** not only understands what needs knowing so as to accomplish given
    objectives but also knows why these facts are necessary for achieving them just
    like humans do. Such machines possess ability learn from one domain then apply
    knowledge gained across different domains thereby showing some level artificial
    consciousness which most times remains theoretical due absence actual implementations
    capable reaching such high levels.


    There are many ways that artificial intelligence mimics human thought: rule-based
    systems, for example, which use logic to derive conclusions from data; and machine
    learning, which involves algorithms that can directly gather patterns and insights
    from data.


    Machine learning is a subset of AI that allows computers to gain knowledge from
    information and improve their performance without being explicitly programmed.
    The core of machine learning is the creation of autonomous algorithms that are
    able to access data and learn from it. This has greatly contributed to the advancement
    of AI in activities such as big data analysis.

    There are three main types of ML:


    # 11.2.1 Supervised Learning


    Unsupervised learning requires training an algorithm with a labeled dataset where
    each sample has corresponding labels linking input data with desired output. In
    such cases, the algorithm learns how to make predictions or evaluations using
    input data while receiving feedback whenever these predictions do not match expected
    outcomes. Supervised learning is often used when historical data can be used to
    predict future behavior like detecting fraud [7]. For instance, one can train
    a model on patient pictures labelled either “with disease” or “without disease”
    so as to correctly classify new images. Different models for supervised learning
    are discussed in the following sections.


    # 11.2.1.1 Logistic Regression


    When there is one or more independent variable in the dataset, this can be investigated
    with logistic regression (LR). The binary output variable only has two results'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'to measure the outcome. In medical field, LR models are used for finding relationships
    between a binary dependent variable, such as presence/absence of disease and some
    independent variable like age, weight, blood pressure genetic markers, lifestyle
    choices etc. Medical decision-making is greatly improved by logistic regression,
    which gives probability on classifying a particular input point.


    LR is a statistical model that utilizes the sigmoid function (logistic function)
    given by equation 11.1. The sigmoid function maps any real integer to a value
    within the range zero to one inclusive. This makes it possible for linear regression
    results to be transformed into probabilities.


    ```

    p(x) = \frac{1}{1+e^{-(\beta0+\beta1x1+\beta2x2... \beta nxn)}} (11.1)

    ```


    Where β0, β1 ... βn are the coefficients of the model and x1, x2 . . xn represent
    the independent variables.


    LR has been commonly used in predicting if someone will get some diseases [7].
    For instance, LR models may be employed to determine the risk of heart disease
    among patients based on cholesterol levels, body mass index (BMI), age, and smoking
    status while evaluating diagnostic tests. It also helps in calculating probabilities
    about malignancy from imaging data together with biopsy results and patient information
    using LR yet still able to evaluate therapeutic approaches efficacy where we compare
    treatments outcomes for patients according to their demographic characteristics
    thereby finding out what works best for whom when where and why.


    # 11.2.1.2 Decision Trees (DT)


    A DT is a type of graph in which characteristics are tested using internal nodes,
    test results are shown by branches, and class labels are chosen after all attributes
    have been evaluated using leaf nodes. The paths that run from the base to the
    end of the tree symbolize classification rules. A decision tree typically begins
    with a patient’s symptom or condition as the root. The tree uses the input data
    to branch out to different nodes, each posing a question about the patient’s data,
    until a diagnosis or outcome prediction is made at the leaf nodes. To diagnose
    a patient with or without diabetes, a decision tree algorithm may inquire about
    the patient’s glucose levels, BMI, age, and other factors to accurately categorize
    them as diabetic or non-diabetic.


    # 11.2.1.3 Random Forest (RF)


    In most cases, the “bagging” method is used to train the decision trees that make
    up an RF. Building many decision trees and merging them into one more accurate
    and consistent forecast is the basic idea. The prediction capabilities of an RF
    model are based on an ensemble of decision trees. The final prediction is obtained
    by integrating the predictions of all the trees, typically through majority voting
    in classification tasks, and each tree uses a randomly selected subset of patient
    data attributes to get its judgment. Every individual tree inside the forest has
    the ability to examine several subsets of data, including past admissions, medication
    compliance, diagnostic outcomes, and socioeconomic factors, in order to predict
    the likelihood'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'of patient readmission, as an example. The RF algorithm utilizes the predictions
    of individual decision trees to assess whether a patient has a significant likelihood
    of being readmitted.


    # 11.2.2 UNSUPERVISED LEARNING


    Unsupervised learning is a type of machine learning algorithm that analyzes and
    processes data without any prior information about how the computer should assess
    it. It is intended for computers to comprehend the content, discover patterns,
    and recognize relationships in any given dataset. This method is commonly employed
    in clustering or dimension reduction tasks; it helps one segment customers for
    marketing, simplify complicated situations, among others [8].


    In healthcare this would involve finding clusters of patients exhibiting related
    symptoms or having same illnesses which have not been grouped before. This exposes
    new variations or subtypes of illnesses.


    # 11.2.2.1 K-Means Clustering


    To group patients into separate entities, AI has allowed K-means methods to be
    employed. It is possible to pinpoint populations in need of specific interventions
    with segmentation; these include individualized healthcare as well as related
    strategies. Individuals who are diagnosed with different signs/symptoms could
    have cancer patients among them as well diabetics when analyzed based on clinical
    attributes and genetic data so that—other than these two related conditions-others
    can also be recognized. As such, this is essential for designing cancer personalized
    therapies and understanding etiology. In addition, for instance, service improvement
    and K-means clustering are tools that can be used in resource optimization at
    hospitals; through identifying patterns of patient visits different clusters enable
    healthcare organizations to schedule staff accordingly to facilitate management
    care efficiently in a hospital setting. This may help to identify patients who
    are at risk of contracting various diseases by analyzing their medical records
    in relation to K-Means Coincidentally, these patients should be placed in different
    layers so that measures are taken to avoid any potential illnesses thereby promoting
    healthy living among them.


    # 11.2.2.2 Principal Component Analysis (PCA)


    PCA starts off by identifying the primary component that explains the most variability
    in the set of data points; following that it goes on to compute a 2nd principal
    component that is orthogonal to the initial one but with the highest possible
    value when compared with all available alternatives. Each subsequent step is characterized
    by a repetition of this process until we gather adequate facts concerning the
    data structure by examining separate factors through their dimensions.


    PCA is a statistical technique that uses an orthogonal transformation to identify
    linearly uncorrelated variables from a group of potentially related observations,
    known as the major components, after they have been extracted. It is widely used
    in healthcare for dimension reduction, data visualization, feature extraction
    etc. This approach provides a way of dealing with complex medical datasets.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'PCA implements the following steps:


    +   1. **Standardization**: Data standardization involves normalizing the data
    to ensure equal contribution of each variable in the analysis.

    +   2. **Covariance Matrix Computation**: Calculating the covariance matrix to
    analyze the relationships between variables.

    +   3. **Eigenvalue and Eigenvector Calculation**: Calculating eigenvalues and
    eigenvectors to determine the directions that optimize the variance (principal
    components).

    +   4. **Dimensionality Reduction**: Dimensionality Reduction involves choosing
    a subset of major components that effectively account for the variance in the
    data.


    # 11.2.3 REINFORCEMENT LEARNING


    This type of learning uses a system of rewards and penalties to compel the computer
    to solve a problem by itself. Human intervention is minimal or absent. It is often
    used in robotics, gaming, and navigation applications. It has applications in
    treatment optimization and robotic surgery, where the system learns to perform
    tasks with precision and minimal invasiveness.


    # 11.2.3.1 Q-Learning


    Q-learning is a reinforcement learning algorithm that is model-free that determines
    the value of actions, representing the “Q” in Q-learning, to show the effectiveness
    of a specific action in a certain state. The process involves assigning a Q-value
    to each action in every state, which indicates the anticipated benefit of choosing
    that action and then adhering to the best strategy. The algorithm enhances its
    Q-values by applying the Bellman equation, which progressively refines the Q-values
    by considering the reward obtained from an action and the highest anticipated
    future rewards. The goal is to acquire the optimal policy that maximizes the cumulative
    reward over a period.


    # 11.2.3.2 Deep Q-Networks (DQN)


    The system of Q-learning is enhanced by deep Q-networks using deep neural networks
    in approximating the Q-value function. This method makes it possible to handle
    environments having high-dimensional state space which is common in healthcare
    applications.


    DQN refers to a reinforcement learning algorithm that incorporates Q-learning
    along with a deep neural network. Each available action has its corresponding
    Q-values produced by the neural network taking the state as input. Experience
    replay is utilized by DQN algorithm together with fixed Q-targets for purposes
    of improving stability during learning process. In this case, experience replay
    implies storing past agent’s experiences and selecting small batches randomly
    for updating the network thereby reducing correlations in sequence of observations.
    Fixed Q-targets on other hand employ separate networks to generate Q-value targets
    during updates but are refreshed periodically using weights from training network.'
