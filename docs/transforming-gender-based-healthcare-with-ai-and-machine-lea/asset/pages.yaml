    in eliminating gender health disparities and promoting equal healthcare (Beauchamp
    & Childress, 2013). But applying these ethical rules require the respecting of
    one's private details and fidelity (Feder & Kimport, 2012; McDougall, 2020). In
    addition to this situation, ethical challenges emerge regarding the provision
    of gender-specific treatments, including issues with ensuring informed consent,
    balancing medical interventions with patient autonomy, and addressing disparities
    in access to necessary care for different genders (Bauer et al., 2009; Baldwin
    et al., 2018). To prevent the potential stigmatization of marginalized communities
    or gender-based discrimination during physical health examinations provided by
    health authorities, fostering respectful and culturally sensitive interpersonal
    communication is essential. This includes healthcare providers actively engaging
    in dialogue with patients, showing empathy, and building trust through mutual
    understanding. By creating a safe, non-judgmental environment where patients feel
    heard and respected, healthcare professionals can reduce the risk of stigmatization,
    encourage open discussion of health concerns, and promote equitable treatment
    across all communities, regardless of gender or background. This approach helps
    ensure that care is delivered without bias, leading to better health outcomes
    and patient satisfaction (Goffman, 1963; Kuhlmann et al., 2017). The lack of insurance
    coverage for gender-specific procedures, coupled with restrictive legislation,
    creates significant structural barriers that limit transgender and nonbinary individuals’
    access to essential healthcare services. Many insurance plans fail to cover critical
    medical interventions such as hormone therapy, gender-affirming surgeries, or
    mental health support specifically tailored to the needs of these populations.
    Additionally, restrictive laws in some regions may hinder access to gender-affirming
    care or impose burdensome requirements, such as psychological evaluations or waiting
    periods, before treatment can begin. These structural barriers not only delay
    necessary medical interventions but also contribute to health disparities, increasing
    the vulnerability of transgender and nonbinary individuals to mental health issues,
    discrimination, and poor overall health outcomes. (Lombardi et al., 2001; James
    et al., 2016). Health systems may integrate gender bias and inequality through
    not sufficient training, insensitive practice, and heteronormative assumptions
    (Hoffman et al., 2014; Whitehead et al., 2016). Addressing this complex issue
    requires the development of a gender-sensitive framework within healthcare systems.
    The famous intersectionality theory, proposed by Crenshaw (1989), throws light
    on the interconnection of social identities, including gender, race, class, and
    sexuality, in developing individuals’ experiences and health outcomes. Creating
    an intersectional lens and gender lens to health ethics enables a more intricate
    understanding of how multiple axes of oppression intersect and are linked to health
    disparities (Bowleg, 2012; Hankivsky, 2012). Furthermore, feminist ethics provides
    a critical lens on traditional ethical theories, highlighting the importance of
    relativity, the ethics of care, and the inclusion of marginalized voices in ethical
    decision-making (Gilligan, 1982; Tong, 1993). In the context of sexual health,
    several recommendations have been put forward to address these concerns effectively.
    These include including gender competency education in health curricula, promoting
    inclusive healthcare environments that affirm diverse gender identities, and promoting
    policy changes to ensure equal access to gender-affirming care (American Medical
    Association, 2018; World Health Organization, 2019). In addition, promoting patient-centered
    therapies that prioritize patient autonomy, informed decision-making, and respectful
    communication can improve healthcare for all genders (Institute of Medicine, 2001;
    Joint Commission, 2001).
