    # 4.2 RELATED WORK


    Breast cancer is considered a multifarious disease and the most common cancer
    in women worldwide [20], accounting for roughly 30% of all female cancers [9].
    This disease has grown in prevalence over the last three decades, while death
    rates have decreased. However, mammography screening is estimated to reduce mortality
    by 20% while improving cancer treatment by 60% [10]. Diagnostic mammography can
    detect abnormal breast cancer tissue in patients who have subtle and inconspicuous
    malignancy signs. Because of the large number of images, this method cannot be
    used to assess cancer-suspected areas effectively. According to one study, approximately
    50% of breast cancers were missed in screenings of women with dense breast tissue
    [11]. However, approximately one-quarter of women with breast cancer receive a
    negative diagnosis within two years of screening. As a result, early and accurate
    diagnosis of breast cancer is critical. The majority of mammography-based breast
    cancer screenings are performed on a regular basis for all women, typically once
    a year or every two years. A fix screening program for everyone is ineffective
    in diagnosing cancer at the individual level and may reduce the effectiveness
    of screening programs [12]. Experts, on the other hand, believe that combining
    mammography screening with other risk factors can lead to a more accurate diagnosis
    of at-risk women [13]. Furthermore, effective risk prediction through modelling
    can assist radiologists in setting up a personal screening for patients and encouraging
    them to participate in the early detection program, as well as identifying high
    risk patients [14].


    Machine learning, as a modelling approach, refers to the process of extracting
    knowledge from data and discovering hidden relationships, which has recently been
    widely used in healthcare to predict various diseases [15–]. Some studies only
    used demographic risk factors (lifestyle and laboratory data) to predict breast
    cancer, while others relied on mammographic stereotypes or patient biopsy data
    [19–20]. Others demonstrated the use of genetic data in predicting breast cancer
    [21].'
