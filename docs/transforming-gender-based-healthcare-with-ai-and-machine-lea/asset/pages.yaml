    # 13.2.2 Data Privacy and Security in AI-Powered Healthcare


    Recent developments in AI and ML, such as generative AI, are demonstrating promising
    AI applications in both industry and healthcare [8], [9]. These advancements are
    continuously improving data analysis and model development across various fields
    [10]. The growing adoption of large language models (LLMs) in healthcare raises
    crucial questions about patient data privacy and security. Researchers are actively
    exploring techniques to train LLMs while safeguarding privacy. One promising approach
    is federated learning (FL). FL enables collaborative model development without
    compromising patient data confidentiality, as the training data remains on individual
    devices [11]. However, implementing FL for complex, large-scale models present
    a significant hurdle: the vast differences in computational and communication
    capabilities across devices. Additionally, the size and complexity of healthcare
    data tasks can further complicate the process. To overcome these challenges associated
    with resource heterogeneity, researchers are developing advanced machine learning
    algorithms. These algorithms dynamically shift computationally'
