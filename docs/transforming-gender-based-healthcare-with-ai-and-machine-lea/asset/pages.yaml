- pgno: 66
  md: 'Developing a model that takes into account all known risk factors is a major
    challenge in predicting breast cancer [22]. Current prediction models may only
    analyze mammographic images or demographic risk factors, leaving out other important
    variables. Furthermore, these models, which are accurate enough to identify high-risk
    women, may require multiple screenings and invasive sampling using magnetic resonance
    imaging (MRI) and ultrasound. Patients may experience financial and psychological
    burdens [23]. Breast cancer risk can be effectively predicted using a variety
    of factors, including demographic, laboratory, and mammographic risk factors [24,
    25]. As a result, multifactorial models that include a large number of risk factors
    can be more effective at assessing the risk of breast cancer [26]. The current
    study sought to predict breast cancer using various machine learning approaches
    while accounting for a variety of modelling variables.


    # 4.3 METHODOLOGY


    This study uses the Breast Cancer Dataset from kaggle.com, which is a well-known
    public data repository for machine learning and data science [27]. The dataset
    consisted of 569 entries and 32 columns or features. All the columns were used
    for training the machine learning (ML) model except the diagnosis variable, which
    was considered as output. The diagnosis variables consist of two values, ‘M’ for
    malignant and ‘B’ for benign. These values were mapped as 1 and 0 respectively
    for training the ML model.


    The first step towards any classification model is the data preprocessing steps.
    This involves compensating for missing values, mapping all values with ‘object’
    type into integers and finally standardizing all the entries to avoid any redundancy
    and ambiguity in data. This step ensures that the machine learning model will
    give accurate predictions.


    The breast cancer dataset used in this study consists of no missing values. The
    dataset is split into training and testing sets with 30% data used for training
    the classification model. The entire dataset is standardized using the Standard
    Scaler method. The original dataset consists of 32 columns or features. However,
    all the features (such as id) may not be relevant in the diagnosis. Thus, the
    focus is on selecting the best features or variables that may significantly contribute
    to the cancer diagnosis. This study uses the RFE and RFECV feature selection methods
    to find the most significant features for cancer diagnosis. The recursive feature
    elimination (RFE) and RFE with cross-validation are used for this purpose.


    # 4.3.1 STATISTICAL ANALYSIS


    Statistical tests are important tools for analyzing data because they help to
    measure uncertainty, establish relationships, and use facts to make choices. Researchers
    can figure out the important differences or relationships among different variables
    of the dataset under consideration. Statistical tests help to analyze the differences
    between meaningful results and random variation. They offer a glimpse of how the
    different groups or conditions compare and which factors are related or important,
    and they'
