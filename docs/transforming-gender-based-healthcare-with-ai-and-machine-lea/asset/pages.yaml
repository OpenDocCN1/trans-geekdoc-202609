    # ## 13.7 ARTIFICIAL INTELLIGENCE LIMITATIONS AND CHALLENGES


    AI in healthcare is a powerful tool, but it can also broaden existing gaps in
    care because of biased data, and how physicians use it. Fairness goes beyond race
    and considers social determinants of health. Techniques exist to mitigate bias,
    but challenges include dataset shift and limited data diversity. Ethical use of
    ancestry information is crucial [31].'
