    # 3.5.1 AI-POWERED BREAST CANCER SCREENING


    The diagnosis of breast cancer at an early stage through medical image analysis
    remains a challenge for radiologists and oncologists due to the limitations of
    the manual diagnosis using the medical imaging modalities such as X-ray and mammogram.
    However, AI-based breast cancer diagnosis models are proven to be highly effective
    and precise in early detection and diagnosis of breast cancer. This has motivated
    medical practitioners including oncologists to use such models for screening,
    treatment plan and follow ups. It is apparent that the collaboration between Google
    Health and Imperial College London for the development of AI-based algorithms
    for breast cancer diagnosis have been highly accurate and reliable as endorsed
    by medical experts. Such research outcomes will help in greater ways in taking
    the technology to under-privileged society benefiting rural women and there by
    combating this fatal disease at an early stage [17].


    # 3.5.2 AI-BASED MENTAL HEALTH SCREENING


    The emergence of newer dimensions in cognitive psychology and cognitive science
    has promoted the application of AI in monitoring human mental and behavioural
    activity. Diagnosis of mental health issues through human intervention is deemed
    too cumbersome due to the fact that the cognitive functioning and response systems
    radically vary from one person to another. Hence developing a generic system addressing
    these practical challenges requires sophisticated technology enabled solution
    as addressed by AI models. The demands for such models have promoted the development
    of newer and innovative mobile apps for mental health screening and monitoring.
    Woebot is an illustrative chatbot that is designed for mental health screening
    and monitoring based on the principle of natural language processing [18]. This
    chatbot is capable of drawing inferences from the cognitive behaviour of an individual
    and then recommending suitable therapeutic solutions. Due to the educational,
    social, economic and cultural implications of gender equity, women may be deprived
    of gaining equal access to remedies for mental health–related issues. Availability
    of such chatbots empower women to break this barrier and gain equal access through
    technology driven diagnosis and therapy.


