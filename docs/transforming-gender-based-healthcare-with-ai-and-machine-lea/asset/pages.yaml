    # CASE STUDY 4: ALIVECOR KARDIAMOBILE-ADVANCING HEALTHCARE USING AI AND MACHINE
    LEARNING


    # BACKGROUND


    The AliveCor KardiaMobile, is a smartphone-connected ECG gadget that enables users
    to record their electrocardiogram (ECG) and share it with their doctor for prompt
    analysis. This allows people to assume control of their heart health and promptly
    seek medical care if necessary. KardiaMobile is a handheld device that transforms
    electrical ECG signals from electrodes situated on a metallic plate to ultrasound
    signals following a 30-second finger contact. These signals are then transmitted
    to a smartphone in the form of a single-lead ECG. Critically, the KardiaMobile
    6L includes a third electrode that can be positioned on the left ankle or knee
    in order to simulate the six traditional limb leads of a complete 12-lead ECG.
    The patient and healthcare provider have access to the encrypted cloud where the
    recorded data is stored. Research has shown that using KardiaMobile can help in
    the early diagnosis of atrial fibrillation, a cardiac arrhythmia that can be life-threatening
    [64–67].'
