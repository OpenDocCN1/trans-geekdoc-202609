  md: '# 12.4 RESULTS


    Sixty-one abstracts were obtained from the literature review published in the
    years 1996–2023. Abstracts were systematically analyzed using Braun and Clarke’s
    six-step thematic analysis framework. This process involved reading and coding
    abstracts, developing initial themes, discussing those themes, reaching agreement
    on identified themes, and finally naming final themes. Inspired by Braun and Clarke’s
    methodology, observations were made visually using a mind map (see Figure 12.2).


    During this analysis, several initial themes emerged, which were later refined
    and categorized. These initial themes included reflections on early ethical considerations
    and social implications for sexual health. The topic was addressed with a focus
    on understanding the nuanced ethical issues and social implications that affect
    sexual health in its early stages. In addition, a gender dimension was added,
    recognizing the importance of gender dynamics in articulating ethical aspects
    and health implications. Based on the recommendations of the 2030 Agenda for Sustainable
    Development, the aim was to emphasize equality, needs, distribution of resources,
    decision-making processes and power dynamics in the study of early ethical aspects
    and social impacts on sexual health.


