    # 3.6 AI-POWERED LIFE CYCLE: FROM DATA COLLECTION TO DIAGNOSIS


    The development life cycle of an AI model for any given application domain involves
    a generic sequence of five steps, spanning from data collection to deployment.
    Each step assumes an equal quotient of significance on the quality assurance of
    the AI-models. Figure 3.1 portrays those distinct steps, and the purpose of each
    step is described in this section.


    # 3.6.1 Phase 1: DATA COLLECTION STRATEGIES


    The first step in the life cycle of AI in healthcare deals with the problem-specific
    data collection from personal health records (PHR), electronic health records
    (EHR) and wearable devices, etc. Since data diversity and distribution are crucial,
    preparing healthcare datasets requires significant effort to ensure they accurately
    and proportionately represent the population, considering factors such as age,
    gender, and demographics. Standardizing datasets with gold standards and benchmarks
    is one of the most important steps in this process. Ethical and legal concerns
    levy certain restrictions on dataset preparation, such as anonymization. Data
    protection and privacy are also major concerns when handling sensitive datasets.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 3.6.2 Phase 2: Data Pre-Processing and Cleaning


    The flaws in data collection and collation practices, faulty sensors, and transmission
    errors significantly impact the quality and consistency of the data, which can,
    in turn, hinder the accuracy of training and testing AI models. Hence, data processing
    that covers data cleaning is considered as an important step in the AI model development.
    The variance in data distribution of any given dataset can be easily unveiled
    through EDA. It provides an exhaustive insight into the statistical aspects of
    data in the form of scatter plot, boxplot, heatmap etc. It is mandatory that the
    datasets used for the development of intelligent healthcare systems should be
    subjected to pre-processing steps like normalization, discretization, aggregation,
    handling missing values, de-noising etc. before further processing.


    # 3.6.3 Phase 3: Feature Selection and Engineering


    Every dataset is distinguished by its input and output attributes. Many of the
    datasets contain numerous input attributes which may not contribute equally to
    the training and testing accuracy. Further, certain attributes may not have any
    correlation with the target attribute. Feature selection primarily deals with
    selection of the most relevant features which strongly contribute to the prediction
    of the target value. The benefits of this procedure are many, including feature
    dimensionality reduction leading to the development of computationally simple
    AI models. Feature engineering deals with augmenting the feature sets of a dataset
    by combining rationally one or more related attributes. Researchers are expected
    to apply feature selection and engineering strategies as per the objective of
    the problem domain.


    # 3.6.4 Phase 4: Model Development and Deployment


    Model development consists of model selection, model training and model deployment.
    Model selection involves selection of the right type of model that solves the
    problem at hand. There are a wide variety of algorithms that are available and
    AI practitioners should carefully select the appropriate algorithms that will
    give the highest measures of results. Common models that can be considered are
    neural networks, decision trees, logistic regression, ensemble methods etc. Effort
    needs to be spent on the selection of tools like TensorFlow, PyTorch and Scikit-learn
    which can help the practitioners in efficient development and implementation of
    the AI model. After the selection of the right kind of model, the next step is
    to train the model. This involves adjusting the model’s parameters and evaluating
    its performance until the desired accuracy is achieved. After training the model,
    the next step is deploying it in a production environment. In model deployment,
    the model is integrated into the medical diagnostic process, and it must be ensured
    that the model is handling real-time data efficiently.


    # 3.6.5 Phase 5: Interpretability and Explainability


    AI models are generally considered to be black boxes. There is no visibility into
    the internal details of the exact operations that the model is executing to arrive'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'at the results of prediction or classification. Due to the black box nature
    of the AI models, the medical practitioners may hesitate in using the AI models
    in predictions of diseases. They find it hard to completely believe a model''s
    recommendation that functions like a black box. In the healthcare domain it is
    critical to know the reason behind the decisions taken by the AI model. Explainable
    AI (XAI) is a set of tools and frameworks that helps the stakeholders in understanding
    how the AI models function internally to arrive at a decision. XAI provides insights
    into the functioning of the model, and it brings in transparency on how the decision
    is being made. XAI helps increase the much-needed trust in AI model''s decision-making
    capability.


    The emerging challenges and opportunities in gender-based healthcare should be
    explored and expanded with due consideration in every phase of AI model development
    from data collection to disease diagnosis. These concerns are expected to open
    up new dimensions in the development of AI-based solutions in gender-based disease
    diagnosis.


    # 3.7 THE GENDER GAP IN HEALTH DATASETS: A CASE STUDY


    Gender information is an important variable in healthcare datasets. The information
    pertaining to gender helps in developing AI driven gender-sensitive healthcare.
    Many datasets lack gender information that can significantly affect the decision-making
    process in providing diagnoses and treatments. This section presents an experiment
    highlighting the absence of gender data in the health dataset and how it impacts
    tailored healthcare for gender. The goal of this study is to understand the gap
    in gender information in some of the health datasets. This case study demonstrates
    the challenges faced by AI models in delivering diagnostic results when there
    is a lack of data related to gender.


    Table 3.1 provides an overview of the selected health datasets, including information,
    on the number of cases and how female and male subjects are distributed.


    By examining the collected health datasets, it can be inferred that there is a
    disparity in how the gender-related information is included. Only certain datasets
    like those focusing on lung and breast cancer provide gender-specific data. But
    the majority of healthcare datasets pertaining to heart diseases and brain tumours
    do not contain gender-specific data. These inconsistencies shed light on the challenges
    faced by AI algorithms in delivering results without gender-sensitive healthcare
    outcomes.


    # 3.7.1 Gender Distribution Analysis across Health Datasets


    Table 3.2 provides an analysis of the datasets to show how gender data is distributed.
    It also reveals variations in healthcare results based on gender.


    These graphs highlight the importance of considering gender data in training and
    validation of AI algorithms. For the AI algorithms to perform well in gender-sensitive
    healthcare, the dataset should contain data pertaining to all genders.'
