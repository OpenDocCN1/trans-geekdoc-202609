  md: 'help validate the choice of predictive model. This study used the IBM SPSS
    software to carry out the statistical analysis of breast cancer dataset.


    Bayesian testing is performed on the dataset. In this test, the researchers instead
    of rejecting a null hypothesis, apply Bayes’ theorem on the observed data to update
    the hypothesis. This method enables them to understand the data and the posterior
    probabilities for hypotheses instead of just p-values. When there is a lot of
    information to consider, a small sample size, or past knowledge that can help
    with the analysis, Bayesian testing is very helpful. Figure 4.2 shows the null
    hypothesis necessary to perform statistical tests on the data. Tables 4.1 and
    4.2 show the results for the Bayesian test. Figure 4.3 shows the posterior distribution
    graph for the correlation coefficients.


    The statistical inference regarding the proportion parameter is made by the one-sample
    binomial test by a comparison with a hypothesized value. Figures 4.4 to 4.12 show
    the histogram plots for some of the variables of the dataset. Figure 4.13 shows
    the results of one-sample binomial test performed on breast cancer data. The total
    sample size is 569 with test statistics of 212 and standard error of 11.927.


    # ## 4.3.2 CLASSIFICATION MODELS


