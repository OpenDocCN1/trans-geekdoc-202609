    era of individualised and focused care. As a part of precision medicine, genetic
    testing looks at the unique genetic patterns of both men and women. This can tell
    you a lot about their sexual health, hormonal balance, and overall health. For
    this reason, doctors can make treatments that work better and more precisely for
    each person because they are based on their unique DNA (American Medical Association,
    2018). Figure 9.3 shows how genetic medicine and services linked to it are used.


