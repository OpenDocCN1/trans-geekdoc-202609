    allows doctors to diagnose and treat patients remotely. A patient visits the nearby
    local health centre, where a local healthcare professional performs a primary
    health check-up. The regional healthcare unit collects vital statistics and sends
    the data to a city hospital. The medical practitioner at that remote hospital
    then conducts a live interaction with the patient, using audio or video conferencing
    systems and automated live feeds. The hospitals store the patient data, details,
    and recorded interactions in the shared database, which can be accessed using
    mobile apps or a web-based interface. The leading hospitals and the specialist
    hospitals are also linked for any specialised support needed in case of emergencies.
    The leading hospitals also have the same teleconferencing units to support remote
    patients. This system allows for more convenient and efficient healthcare services
