    # 11.4.2 Ethical Considerations


    +   **1. Patient''s Consent:** Patients must be informed of their entitlements
    concerning the utilization of AI systems in healthcare and mandated to provide
    explicit consent for its utilization. The ethical quandary of upholding patient
    autonomy in an era where computers possess the capability to make or heavily influence
    decisions is intricate. Based on a survey conducted by Ipsos on behalf of the
    World Economic Forum, 73% of individuals globally express concern about the potential
    misuse of their personal data by AI systems [23]. This indicates that it is necessary
    to gain informed permission while also preserving individual liberty in the context
    of medical care driven by artificial intelligence.


    +   **2. Accountability:** Assigning accountability for the consequences of AI-driven
    assessments on patients is challenging due to the complexity of the underlying
    issues. The issue of accountability for decisions made by AI systems in hospitals,
    whether it lies with developers, healthcare providers, or the AI systems themselves,
    needs to be clarified. An Accenture survey found that 81% of health executives
    concur with the notion that “AI will fundamentally revolutionize the way they
    obtain information from and interact with patients” [24], hence raising concerns
    about the responsibility for judgments made by artificial intelligence.


    +   **3. Equity and Access:** The use of artificial intelligence in health has
    potential global impact on health outcomes; however, it could also amplify the
    gap between those who can access advanced medical technology and those who cannot
    do so currently Ensuring fairness regarding access rights vis-a-vis benefits emanating
    from artificial intelligence in healthcare is an ethical imperative. The World
