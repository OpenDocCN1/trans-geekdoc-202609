    Personalized medicine strategies were focused on discovering patient phenotypes
    with distinct responses to treatment. The combination of AI with personalised
    medicine showed promise result in tackling intricate problems in healthcare, especially
    when it comes to personalised diagnosis and prognostication through the integration
    of nongenomic and genomic factors with patient symptoms, medical histories, and
    lifestyle choices.


    In [14], D. R. Kaufman et al. introduced a method for assessing the usability
    of computer-based healthcare systems that were meant to be used at home by patients.
