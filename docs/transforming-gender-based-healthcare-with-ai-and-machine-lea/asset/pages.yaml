    # 10.8.2 IoMT Architecture


    The term “Internet of Medical Things” (IoMT) describes a network of networked
    sensors, medical equipment, and wearable tech that can gather, store, and analyse
    data. There are four distinct levels to the IoMT architecture, and they all cooperate
    to make healthcare data integration possible. There are four levels: perception,
    edge, network, and cloud computing. This section analyses each layer and its role
    in the IoMT structure.


    # 10.8.2.1 Perceptual Layer


    The perceptual layer is the initial layer of IoT architecture, responsible for
    acquiring data from various medical devices and sensors. This layer houses the
    user''s physiological sensors, which include a glucose detector, heart rate monitor,
    and blood pressure monitor.


    # 10.8.2.2 Edge Layer


    The edge layer connects the perception and networking levels in an IoT architecture,
    making it the second layer of the design. This layer analyses data from sensors
    in real-time so that it may be sent via the Internet. Edge layers’ design aims
    include scalability and the capacity to analyze large amounts of data.


