  md: '# # 1 AI and Machine Learning in Modern Healthcare


    Sharad Chauhan, Mrinal Paliwal, Nandita Manchanda, and Meenu Gupta


    # ## 1.1 INTRODUCTION


    In recent decades, the healthcare sector has undergone a huge transformation with
    the integration of artificial intelligence (AI) and machine learning (ML) [1].
    This will not only bring a new era of research and innovation but also significantly
    enhance the performance of delivery of healthcare services in an effective way.
    Far beyond being mere industry buzzwords, AI and ML have the capability to bring
    a revolutionary change in healthcare, starting from diagnosis of diseases, their
    effective treatment, and variety of medicines available to address patients effectively
    [2].


    Due to recent growth in medical data and advancements in big data diagnosis techniques,
    healthcare data requires some innovative techniques to manage large amounts of
    data. AI and ML have brought a significant improvement in modern life and provide
    revolutionary change in medicine and the healthcare sector with the help of its
    latest technologies. These techniques help physicians reduce their workload and
    provide accuracy in tasks, predication of diseases and quality of care to patients.
    Machine learning techniques are used for identifying trends in medical data and
    are helpful in developing predication models which are useful in increasing efficiency
    of the healthcare system and managing electronic data in a better way. Recently
    we have seen the use of machine learning techniques in the COVID-19 pandemic where
    deep learning techniques are used for managing ventilators, tracking patients
    and their beds, rooms and even staff. AI techniques are also helpful in genetic
    sequencing and developing vaccines as well as monitoring patients [3].


    ML techniques are helpful in extracting informative data from unstructured data
    and predicting results from the data which is very helpful in taking decisions
    for the medical supervisors. It is also useful in medical research where practitioners
    can get benefits for their medical trials. In today’s scenario, remote monitoring
    of patients is also providing help to patients by getting online assistance from
    doctors. In the COVID-19 pandemic remote monitoring of patients was very helpful
    when in-person interaction between patients and doctors was not possible. In the
    current scenario, it is also useful for elderly people with mobility issues. Here
    remote monitoring is helpful in providing assistance to patients and improving
    the efficiency of the modern healthcare system [4].


    AI- and ML-based techniques are helpful identifying diseases, drug discovery,
    identification of medical imaging, personalized remedies of medicines, behavioral'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'modification, intelligently maintaining medical records, clinical trials, and
    research. It starts with data collection and management related to patients; this
    data identification its helpful in prediction of diseases; and based upon the
    medical history of patients it can recommend medicines. AI techniques can help
    new researchers in the medical field and discover new patterns and medicines to
    treat new kinds of diseases [5].


    In this chapter, we will discuss the role of AI and ML techniques in the modern
    healthcare sector, as well as how these innovative techniques are helpful in improving
    the lives of medical practitioners and patients in the modern era. We will highlight
    the use of innovative techniques used for managing healthcare records and identifying
    diseases, providing on time medicines to patients and proving the effectiveness
    of the modern healthcare system.


    # 1.2 RELATED WORK


    T. Davenport and R. Kalakota (2019) have discussed the importance of artificial
    intelligence in the field of healthcare. They have shown how complex and large
    amounts of data are handled by companies by using latest technologies. These technologies
    are helpful in diagnosing diseases, their treatment and managing healthcare data.
    They have shown how AI-based techniques can reduce the workload of healthcare
    professionals by their innovative approaches. They have also highlighted how to
    manage patients, various administrative tasks, and research activities in the
    medical field [6].


    S. Datta et al. (2020) have shown how AI is used for different healthcare and
    research purposes, starting from detecting of diseases to management of chronic
    conditions, and providing healthcare services. They also focused on the relationship
    of AI with the alginate which is part of tissue engineering field. Alginate is
    natural polymer which is a cell and used in tissue engineering [7].


    J. Lorkowski et al. (2021) have shown the benefits of AI in medicines, health
    and the economy in the healthcare sector. In their review work, they have AI and
    ML models that are helpful in medical science. They have also talked about blockchain
    technologies, medical science sensitive data, and medical documentation. These
    innovative technologies are helpful in patient''s wellbeing [8].


    A. Bohr and K. Memarzadeh (2021) have shown that due to increasing demand of healthcare
    services many countries are having a shortage of medical physicians. They have
    shown that due to the development of the latest technologies, patient''s expectations
    and level of service requirements are also increasing. So, fulfilling the expectations
    of patients in the modern era requires the latest innovative technologies. AI-based
    tools provide cutting-edge healthcare offerings that are improving and reducing
    the cost of healthcare services [9].


    M. Javaid et al. (2022) have shown the benefits of machine learning in the healthcare
    sector. They have highlighted how machine learning improves the accuracy and speed
    of the work doctors do. As demands on physicians increase in all countries, ML
    techniques can minimize their workload by managing healthcare data and minimizing
    errors. These techniques can be helpful in early detection of pandemics, which
    can lead to the curing of diseases in a timely manner. ML-based tools are minimizing
    cost in the healthcare sector, providing treatment of different kinds of diseases
    and improving efficiency in the healthcare sector [10].'
