    and calibre of biomedical research. Further, the authors also discuss how ML has
    the potential to increase success rates and lessen human suffering. Cooperation
    among stakeholders and open communication were essential to properly incorporate
    ML into clinical research. It was crucial to address issues with data provenance,
    bias, validation, and regulatory monitoring. For the benefit of all stakeholders,
    it was imperative that best practices be shared and discussed in order to guarantee
    the equitable, moral, and open implementation of ML in clinical research.


    In [12], Y. Huang et al. addressed the issue of bias and fairness while highlighting
    the widespread application of ML and AI in healthcare for clinical decision-making.
    Using real-world data (RWD) from the healthcare sector, the review attempted to
    compile the body of research and pinpoint areas that still needed attention in
    order to address algorithmic bias and maximise equality in AI/ML models. Eleven
    publications focused on enhancing model fairness in healthcare applications were
    found through the evaluation, indicating a dearth of research on reducing bias
    concerns in RWD across a range of illnesses and healthcare applications.


    In [13], K. B. Johnson et al. The literature review highlights the revolutionary
    potential of the combination of personalized medicine and AI in transforming healthcare.
    AI supported personalized medicine approach by providing insights, enabling learning
