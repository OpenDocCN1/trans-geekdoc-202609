    # Chapter 11


    Machine Learning-Based Framework for Human Activity Recognition ...................................................
    193


    Allampalli Harini, Pragati Engineering College, India

    Manjula Devarakonda Venkata, Pragati Engineering College, India

    Doodala Kondababu, Pragati Engineering College, India


    This paper proposes a novel Machine Learning-Based Framework for Human Activity
    Recognition tailored to address the complexities and challenges inherent in accurately
    identifying and categorizing human activities from sensor data. ML-HARF integrates
    advanced machine learning algorithms with a comprehensive data preprocessing pipeline
    to extract meaningful features from raw sensor data. Leveraging a diverse array
    of sensors including accelerometers, gyroscopes, and magnetometers-HARF captures
    rich spatiotemporal patterns of human activities. The framework employs a hierarchical
    classification approach, wherein low-level features are initially extracted and
    subsequently aggregated to higher-level activity labels. ML-HARF outperforms other
    methods in extensive experiments on benchmark datasets, attaining state-of-the-art
    accuracy rates in a variety of activity recognition tasks. In real-world applications
    like sports analytics, healthcare monitoring and human-computer interaction systems,
    the framework''s efficiency and scalability are also demonstrated.'
