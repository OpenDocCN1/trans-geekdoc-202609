  md: '# LITERATURE BACKGROUND


    # Data as an Asset


    In the contemporary era, data is a crucial resource for companies (Cappa et al.,
    2021; Urbinati et al., 2019). The capacity of (big) data to provide insights,
    promote informed decision-making, and foster innovation has led to its considerable
    value (Ferrigno et al.; Ghasmaghaei & Calic, 2019a). Indeed, the collection and
    analysis of the immense amount of data created daily, even called "big data",
    has altered the competitive environment (Del Vecchio et al., 2018). In this sense,
    data has evolved for firms as a strategic asset for reaching competitive advantage
    (Johnson et al., 2017).


    With the pervasive digitization of operate environments, customers have emerged
    as significant sources of big data through their mobile interactions (Cappa et
    al., 2021). Therefore, recent developments have led to a shift in granting individuals''
    greater agency over the data they generate, spurred by a convergence of consumer
    anxiety, governmental regulations, and market dynamics (Quach et al., 2022). This
    global trend has seen personal data increasingly recognized as individuals'' assets
    entrusted to businesses for safekeeping, rather than a freely exploitable resource,
    fostering a wave of innovation driven by consumer preferences (Ghasmaghaei & Calic,
    2020).


    In this context, the heightened awareness of data''s value has led to increased
    demands for ownership and control (Scholz, 2016). Concepts like data sovereignty
    and empowerment have emerged as responses to this shifting landscape (Akter et
    al., 2021; European Data Market Study 2021-2023). However, ethical concerns surrounding
    data, usage, and preservation are escalating as data''s importance grows (Chang;
    Herschel & Miori, 2017). Responsible data management needs prioritizing privacy
    protection, obtaining consent, and preventing misuse (Deslee & Cloare, 2024).
    Finding a balance between data usage and respect for a person''s rights is an
    abiding challenge. Regulations like the GDPR seek to ensure accountability and
    transparency.


    In other words, recognizing the value of data as an asset, while increasing protection
    for privacy and transparency, can better deliver benefits while reducing adverse
    impacts. The question emerges that data, when treated as a valuable asset, holds
    immense promise in fostering a more efficient, inclusive, and prosperous society
    as we navigate the data-centric future (Bai et al., 2023). Therefore, in the next
    subsection, we will evaluate the literature devoted to explaining the importance
    of monet data.


    # Data Monetization


    Data monetization is the process for driving measurable value from data (Farouki
    et al., 2020a; 2020b; Johnson et al., 2017; Otufue & Benoyeuce, 2022; Quach et
    al., 2024; Ritala et al., 2024; Wix & Ross, 2017; Woroch & Stachel, 2022). It
    is generally known as an organization''s capability to transform data into both
    tangible and intangible advantages, thereby improving profitability and bottom-line
    margins of the organization (Ritala et al., 2024). Considering the boundaries
    of the organization, internally speaking, data monetization involves leveraging
    data to drive improvements in corporate performance and inform decision-making
    processes (Quach et al., 2022). Externally, it encompasses practices such as data
    brokering, selling data through brokers, and offering information-based products
    and services'
  merge: -1
  img_proc: true
- pgno: 223
  md: '(Quach et al., 2022). Choosing the proper monetization strategy requires a
    strategic decision, considering the organization''s technical infrastructure and
    analytical capabilities (Oofule & Benoycef, 2022).

    The adoption of data monetization is rapidly expanding across various sectors,
    including healthcare (Bram et al., 2015; Firouzi et al., 2020), retail (Najar
    et al., 2013), and automotive industries (Oofule & Benoycef, 2022). By mining
    customer data and leveraging AI for predictive analytics, businesses can make
    informed decisions to stay ahead in competitive landscapes (Ghashemaghi & Calic,
    2019b). Leading companies like Tesla, Amazon, Healthfinch, and Apple have already
    proved the benefits of data monetization, prompting others to follow.

    in a nutshell, as information becomes increasingly valuable, the embedding of
    data monetization ensures business success. In the modern world, data has turned
    into one of the huge commodities with an enormous potential for monetization (Cappa
    et al., 2021). Both businesses and individuals generate substantial data through
    online activities, which holds significant value across industries, necessitating
    monetization efforts. Data monetization is a process that leverages insights,
    patterns, and trends derived from material data to develop new products, sell
    data directly, or to drive strategic decisions. In this respect, data monetization
    provides a number of advantages in the field of businesses, such as revenue generation,
    improvement in decision-making via insights obtained from data analysis, operational
    efficiency enhancement, and innovations in product development (Farouki et al.,
    2020a; Johnson et al., 2017; Ritter et al., 2024). It also enables good consumer
    interaction and personalization, increasing customer satisfaction and loyalty
    (Johnson et al., 2017; Oofule & Benoycef, 2022). However, ethical concerns about
    privacy, consent and fairness must be paramount in data monetization deanders
    (Farouki et al., 2020a; 2020b; Oofule & Benoycef, 2022). Therefore, in the next
    section, we will investigate the issues that affect the data monetization process.


    # Issues Affect Data Monetization


    To be successful, data monetization must first address a number of issues. Organizations
    need consideration and controls of critical variables like the issue of privacy,
    data quality, and governance, complications arising out of legal and ethical concerns,
    and security-related to data (Farouki et al., 2020a; 2020b; Oofule & Benoycef,
    2022). Some other issues that need consideration include fairness, openness, and
    potential for bias or discrimination in decisions based on data (Quach et al.,
    2022). In this sense, building consumer and stakeholder trust requires balancing
    business goals with moral obligations (Oofule & Benoycef, 2022). In addition,
    data security and cybersecurity must also be addressed, since the fact as data
    has become a valuable asset, it has become target for criminal activity and threats
    (Mahmood et al., 2024).


    Alongside privacy and security issues, an essential aspect of data monetization
    is also data quality (Cappa et al., 2021). Poor, incomplete, and outdated data
    will result in erroneous insights and monetization decisions that are wrong. The
    organization, therefore, has to invest in the data governance frameworks that
    ensure integrity, correctness, and consistency of its data (Quach et al., 2022).
    The new data economy laws are straightforward and adhere to the fundamental concept
    that data owners are the ones who own it (GDPR, California Consumer Privacy Act).


    Among data monetization problems, it is impossible not to mention the so-called
    Cambridge Analytica scandal - actually an outstanding event that made privacy
    concerns about data topical in broad masses consciousness. The political consulting
    organization Cambridge Analytica took access to the personal'' information of
    thousands of Facebook users without their knowledge or consent via the Facebook
    app'
