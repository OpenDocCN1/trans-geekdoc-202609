    has significantly transformed our way of life. We have instant access to the Internet,
    social media conversations and information exchange.

    On networking platforms, people may freely express their opinions, sentiments,
    and criticism in the form of sentimental feelings. Through postings and tweets
    on social media sites like Facebook, Twitter, Instagram, Snapchat, and so forth,
    they can express their thoughts. Depending on their level of mental stability,
    they voice their opinions and verbally abuse others in an attempt to cause harm.

    Tweets and messages are often offensive to irritate or offend someone, whether
    on purpose or accidentally. Insensitive material incites people to participate
