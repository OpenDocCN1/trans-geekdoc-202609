    Twitter (X) just unveiled a redesigned home screen with two parts: “Following”
    mode and “FOR YOU” mode. Users who have voluntarily decided to follow accounts
    are shown content in the “Following” section whereas, Personalized recommendations
    are provided in the “For You” section based on the algorithm''s observations.


    Users can easily alternate between various modes, giving them the freedom to customize
