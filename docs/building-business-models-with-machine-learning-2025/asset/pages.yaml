  md: 'stakeholder analysis and engagement, with the purpose of improving the changes
    of initiative success. This is achieved by providing a logical process for stakeholder
    mapping and categorization, discussing the development of understanding about
    stakeholders that is vital in the identification of their differing requirements
    and the subsequent engagement approach. Finally, the discussion is set in a project
    text, and potential impacts of effective stakeholder engagement are described.
    (Ebekozien et al., 2024)


    # 6. Requirements, Elicitation, and Documentation


    The requirements documentation produced should be used as a tool for communication
    between the system builder and the stakeholders to have clear objectives in building
    the system. It can also be used as a legal agreement if the system builder is
    a separate organization or person from the stakeholders. The requirements may
    also serve as the basis for a contract between the developer and the customer.
    The documented requirements are included in a legal agreement, then, any dispute
    regarding whether the completed system does or not meet the customer''s expectations
    can be referred back to the requirements. (Laux et al., 2024)


    Requirements elicitation the process of identifying the requirements for a system.
    The system should deliver facilities that meet the customer''s required function,
    and the goal is to find the best solution for the customer and the system itself.
    It is also defined as a set of activities to discover the requirements of the
    system from stakeholders and other sources. The goal of this activity is to produce
    a stable set of requirements that have been agreed upon by stakeholders and can
    be used as the basis for any further development of the system. This is the first
    step in building a system. Many failures in information systems are caused by
    a too quick jump to system building or by skipping this part, and some team members
    do not understand the concept of the system to be built. In this case, this is
    the most crucial step in system development. If the requirements of the system
    are unclear and partial, the resulting system will not satisfy the customer and
    will not meet their expectations. (Li et al., 2021)


    # 7. Business Process Analysis and Improvement


    The first is a flowchart. This is a diagram defined as a graphical representation
    of a logical sequence, work or manufacturing process, organization chart, or similar
    formalized structure. The second is activity-based costing. This is a method of
    accounting in which all costs incurred in carrying out an activity or group of
    activities are collected, classified, and recorded. These costs are expressed
    in terms of the activity output. The third model is functional analysis. This
    is a structured technique derived from role task analysis for defining a sequence
    of activities and their relationships. The last model is value stream mapping.
    This is a lean-management method for analyzing the system and defining a feature
    for the series of events that take a product or service from serving through the
    customer. Model construction is commonly taught in universities as students usually
    become business analysts who specialize in business process analysis. (Asudani
    et al., 2023)


    Business process analysis is a disciplined approach for identifying and improving
    a business process, in order to achieve better results. This work is motivated
    by the need to support the initiatives of digital transformation. Typically, organizations
    go into digital transformation without proper understanding of how things are
    being done. Improvement should be done to the business process because a later
    stage of the business process is used as the basis to develop information systems
    that support the business. Redesign might lead to extra cost in system development.
    The step of analyzing'
