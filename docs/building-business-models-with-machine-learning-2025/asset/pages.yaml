    # DISCUSSION


    # An Application of DDT Canvas in Big Data Companies: The Case of Hudi


    Big data has become a useful resource and an asset for enterprises, providing
    previously unattainable insights and chances for innovation (Acciarini et al.,
    2023; Cappa et al., 2021; Del Vecchio et al., 2018; Urbinati et al., 2019). Businesses
    require specific capabilities and the adoption of peculiar business models to
    fully realize the promise of big data (Acciarini et al., 2023; Johnon et al.,
    2017). A formal framework is offered by the DWI Canvas for defining, examining,
    and improving a company''s data-driven innovation in big data companies (Zieliller,
    2024; Zililler, 2021).


    This chapter examines the business model used in big data businesses, concentrating
    on the case of Hudi, showing its importance in comprehending and improving businesses''
    operations. What emerges from this analysis is that big data enables new and established
    businesses to provide new value. The scoping of data-driven business prospects
    must consider a variety of viewpoints, from demands, data availability, and technological
    capabilities to ensure the sustainable formation of alliances and ecosystems,
    to capture these new sorts of value. The framework for data-driven innovation
    offers a tried-and-true technique for all participants in the BDI ecosystem to
    provide direction when examining and sizing up data-driven business prospects.


    Starting from the DDI framework previously described, it will now be adapted to
    the case of Hudi populating the Canvas ad hoc, which will be shown in Figure 3.'
