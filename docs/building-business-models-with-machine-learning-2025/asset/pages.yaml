- pgno: 228
  md: '# The Case of Hudi: Human Data Income


    # Theoretical Sampling: Why Hudi?


    Following previous studies based on a single case study (Ferrigno, Zordan, and
    Di Minin, 2022), in this chapter we have selected Hudi as representative case
    study for three reasons. First, Hudi (Human Data Income Ltd.) is a data monetization
    decentralized platform, which enables individuals and businesses to gather, enrich,
    exchange and monetize their personal data.


    Second, Hudi exploits the increasing digital leverage to create a universal basic
    income generated by the economic value of users'' data and by the market itself.
    As such, Hudi collects, aggregates data and redistributes value to the users by
    means of Web3 technologies, such as cryptocurrencies and blockchain.


    Third, Hudi works as a data bank where the individual user decides whether and
    what data to share with the organizations that request it, in exchange for royalty.
    Hudi''s users create value assets by means of cryptocurrencies, while the aim
    of Hudi is building the first universal income based on data by redistributing
    up to 75% of the stakeholders, and 50% to the data owner. Typically, data brokers
    extract data from individuals and companies to resell to others, extracting value
    from the data and making a profit without redistributing to it, users. Hudi''s
    mission is to create a protocol for data management by creating a free and open
    market based on 3 principles: transparency, control, and remuneration. Hudi allows
    users to create a profile with all data of their choice, bringing together in
    a single place all the data they already have on platforms such as Facebook, Google,
    Netflix, etc. In this, unique and complete data profile is created by no other
    company has, and that it must go through Hudi and pay a fee. Hudi will therefore
    profit from this extracting value from the data, which in turn will remunerate
    the users, the owners of these data profiles.


    # History and Development


    Hudi was founded in 2017 as a startup in London, UK by Francesco Ballarani (CEO),
    Gianlui Ballarani (CMO), and Andrea Silvio Vital (CTO). Hudi''s founders and users
    built together a decentralized platform, and this participatory spirit of users
    was a key factor for the success of the company. The launch of Hudi was based
    on the idea of users to let others know about Hudi, using a decentralized marketing
    strategy. In fact, during the launch, anyone who spoke the word about Hudi various
    actions were remunerated with Hudi Tokens. The Hudi Token (HUD) is a utility token
    created on the Binance Smart Chain for on-chain data exchange and monetization.
    It follows the BE-20 standard.


    The company, founded in 2017, launched in 2021 with the Hudi Release on September
    10th and the IDO on Pancake swap on September 15th. In October and November were
    activated the Active Data Monetization Online (BETA) and the Ambassador Program,
    which in 2022 were introduced new data sources in Q1, Q2, Q3, such as Binance,
    Coinbase, Facebook, Google, LinkedIn, Reddit, and TikTok. In Q4 the Hudi Protocol
    (Alpha) was released as well as the first data providers on the protocol. For
    what concerns the 2023 Q1, Hudi AD network and DataSwap were presented.


    Nowadays, the company offers Decentralized Finance (De-Fi) solutions to data owners,
    including staking, liquidity, and lending, which revolve around Hudi dApp.'
