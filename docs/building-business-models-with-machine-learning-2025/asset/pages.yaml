    # III. REVIEW OF CONVENTIONAL TECHNIQUES FOR FRAUD DETECTION


    Although there are several conventional techniques, this section describes only
    some of the techniques with their methods.


    # A. Group Search Firefly Algorithm (GSFA) for Online Fraud Detection


    The FA is swarm intelligence inspired by the behaviour of fireflies has been proposed
    in this technique. This paper outlined introduces a hybrid approach that combines
    swarm metaheuristic to attack the CC fraud detection issues. A novel variation
    of the Firefly Algorithm (FA), called the Generalized Firefly Algorithm (GSFA),
    was developed to optimize both SVM and an extreme machine learning. Datasets typically
    include a multitude of attributes, many of which may be irrelevant or redundant.
    These unnecessary attributes can hinder classification accuracy by expanding the
    search space and complicating the optimization process. GSFA metaheuristic addresses
    this challenge effectively by incorporating three control factors that can be
    customized for each specific NP-hard problem. This tailored approach significantly
    enhances the algorithm''s ability to navigate the search space efficiently, which
    is critical for tackling complex problems. By optimizing these parameters, GSFA
    can better adapt to the unique characteristics of various datasets, leading to
    improved convergence rates and the identification of optimal solutions. Moreover,
    this flexibility allows further exploration of possible solutions, reducing the
    chances of being trapped in local optima. As a result, the overall classification
    performance is markedly improved, enabling accurate predictions. Additionally,
    the algorithm''s adaptability can make it suitable for an extensive range of applications,
    from fraud detection to resource allocation, thereby expanding its utility across
    different fields. Ultimately, this versatility make GSFA a valuable tool in addressing
    complex computational challenges. Additionally, it'
