    # Interviews


    The interviews were conducted on May 26th, 2023, with Francesco Ballarani (CEO
    and co-founder) and Andrea Silvi. The interviews lasted 1 hour. In the following
    we present the questions and the insights of the specific answers.


    +   1. What is Hudi?


    The CEO of the company explains that Hudi is a simple concept rooted in users''
    generation of data on the internet. The Data is for technology and technological
    innovation, hence the idea to bring back to the people the ownership of data and
    empowering them to join the data market being rightful owners of their data. The
    data industry is a market valuing than a trillion-dollar industry each also understanding
    data brokerage, market research, and digital advertising. Indeed, every minute
    one million dollars of people''s data is being sold and bought by companies.


    +   2. How was the idea to create Hudi?


    The CEO and co-founder of Hudi answers that he had always worked with data in
    the private investigation and intelligence sector, and in 2010 studied digital
    marketing. As time passed, he discovered even more importance of data and information
    in relation with digital platforms, such as Google, Amazon, Facebook, etc. He
    states that data allow to target define and advertise specific products and services,
    while the data market is a closed market, and data is being collected and exploited.
    Since 2017, the founders started working on the technological side of data and
    began working on Hudi.'
