    # 7 SUMMARY AND CONCLUSIONS


    In this article, a "grid-tied solar/fuel cell hybrid power system" for The University’s
    Administration Building, a commercial structure, is displayed., along with its
    design and analysis. The energy audit data was used to establish the key loads
    for the building’s air conditioning system. This research examined Sharjah’s renewable
    resources, current technology for renewable energy, technology pricing, system
    expense, and resource constraints. Using a unified style of modelling, simulation,
    optimization, and control approaches, the proposed grid-connected solar PV/fuel
    cell power system’s efficiency and cost were assessed. Researchers looked and
    examined how the solar power capacity of a system relates to its performance (renewable
    percentage, cost of energy, and greenhouse gas emissions). According to the results,
    the grid-connected solar PV/Fuel Cell grid system generates more than enough energy
    to meet the building’s annual electricity needs and has enough left over to be.
    The leveled cost of electricity generated by the grid-connected solar PV/fuel
    cell hybrid power system is just $71 per megawatt hour (MWh), while carbon dioxide
    (CO2) emissions are only 133 kg/MWh (MWh). Integration of renewable power systems
    with the utility grid is one of the best techniques and effective approaches to
    increase the penetration of renewable energy in the energy mix at an acceptable
    cost of energy, reduce reliance on fossil fuels, and mitigate environmental impacts
    (greenhouse gas emissions reductions).'
