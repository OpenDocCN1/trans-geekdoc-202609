    # Overview of Business Models


    A “business” is the actual collection of individuals, choices, assets, structures,
    manufactured goods, ideals, deeds, and any other components required to carry
    out and maintain this specific human activity. What does the term “business model”
    mean if we accept these ideas?


    A business model is a set of assets and processes that produce value that customers
    can utilize and generates revenue for the business through sales. The goal of
    business model analysis is to increase and enhance our quality of the key components
    of a business model. The financial journalist Michael Lewis coined the phrase
    “business model” when he wrote in his pieces that the future would be built on
    Internet-business models. “Business model still has no fixed theoretical foundation
    in economics, according to David T Teece (2010). Discovering the procedures and
    aspects that defines a company’s production of value in a comprehensive and fundamental
    way are critical for its operations is incredibly challenging.


    A business model is defined by a number of authors as a method for generating
    revenue. They see a business model as an economic idea that “produces” expenses
    and revenues. It is a collection of operations that provide revenue as a result
    of processes and technology working together are referred to in (Table.1).


    Table 1. Business models according to authors

    | Author | Definition |

    | --- | --- |

    | Itami a Noshino | “Business model is a profit formula, system of business and
    learning system.” (Baden-Fuller & Morgan, 2010) |

    | Henry Chebrough | “The business model is a useful framework to link ideas and
    technologies to economic outcomes.” (Chebrough, 2006) |

    | Alfonso Guandabella Anita McGGetan | “Business model is a mechanism for transformation
    ideas to revenues through the acceptable costs.” (Baden-Fuller & Morgan, 2010)
    |

    | Allan Afuah | “Business model is a method for making money. It is the set of
    activities which a firm performs, how it performs them and when it performs them
    so as to offer its customers benefits what they want and earn a profit.” (Afuah,
    2003) |

    | Thomas Wheelen, David Hunger | “Business model is a method for making money
