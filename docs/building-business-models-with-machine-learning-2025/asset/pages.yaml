    out in an efficient manner. In a broader sense, the objective of business data
    analytics is to analyze and study the issues or opportunities faced by a firm
    by employing a scientific inquiry approach. This is the goal of the practice.


    There are a variety of objectives that may be accomplished via the use of corporate
    data analytics, and these vary according to the type of data that is under consideration.
    Various approaches to analytics may be classified into the following four categories:


    +   **Descriptive**: Through the process of describing or summarizing the material
    that is accessible, this approach provides a look into the past. A response to
    the question "What has taken place" is the goal of descriptive analytics, which
    is designed to fulfill this.

    **Diagnostic**: involves looking at the factors that led to the occurrence of
    a specific event occurring. Answer to the question "Why did a particular event
    take place" is the objective of diagnostic analytics, which is designed to offer
    an answer to this issue.

    **Predictive**: The evaluation of previous trends in data to gain insights into
    the future is what is meant by the term "predict." The use of predictive analytics
    is employed in order to offer an answer to the question, "What is the likelihood
    that this will take place"

    **Prescriptive**: The prescriptive approach is one that makes use of the data
    from a variety of different forms of analytics in order to quantify the anticipated
    effects and repercussions of prospective actions that are being examined. The
    answer to the question "What would happen if we do...?" is one of the objectives
    of prescriptive analytics, which aims to give a solution to the problem.


