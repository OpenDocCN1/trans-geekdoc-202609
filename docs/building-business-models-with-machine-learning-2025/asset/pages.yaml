  md: 'Initially, basic daily activities like sitting, standing, walking, running,
    etc. were considered for the HAR. Then, different complex activities like making
    coffee, working on the computer, watching TV etc. were also investigated. Motion
    sensors are found to be insufficient for identifying abnormal activity and health
    conditions. It is often a challenging problem, to get an accurate estimation of
    the biological parameters when the users are performing various activities [20].
    The parameter values are varied for different activities, for example, when an
    individual begins running, it is expected that his/her heart rate, temperature
    and breathing amplitude would increase. Thus, the digital environment including
    sensor and connected devices [21] provides a context aware solution for monitoring
    applications. In the early 2000s, smart phones were introduced in the field of
    HAR [22][23]. The ubiquitous nature of smart handhelds provides a better way to
    monitor human movement without any inconvenience. Smart phones are equipped with
    sensing (accelerometers, gyroscope, compass etc.) as well as communication facilities
    (like Wi-Fi and Bluetooth). Raw data are collected from inertial sensors of Smartphone
    during data collection. The collected data contains noise and filtering techniques
    are applied to remove the noise from signals. Essential features are extracted
    from the preprocessed dataset, and fed to learning techniques for training a model,
    in order to identify several activities as described in figure 1.


