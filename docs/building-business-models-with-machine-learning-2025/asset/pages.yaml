  md: '# 3.SportsApplication


    Wearable and smart phone sensors are used in sports applications to improve player
    performance. Combining accelerometer and gyroscope allows monitoring of movement,
    bowling action, and postures in sports like tennis and cricket.


    Figure 2. Overall data flow for activity recognition system using smart phones
    and wearable sensors


    ![](img/2d15ce7e8a63337e725a2581c64b1a6e_212_0.png)


    # Issues and Challenges in HAR


    +   1. Different Device Configuration and Usage Behavior: The classification accuracy
    of HAR is heavily influenced by the training and test environment, hardware configuration,
    calibration problems, and individual subject patterns. The orientation of smart
    phones also affects the system''s classification accuracy. Various data collection
    positions, such as waist or pant pocket positions, can improve results. Several
    sensors are used for activity recognition, but no has been found that enables
    detailed recognition even when training data is collected from one device at one
    position.

    2. Selection of Sensors: Sensor selection and attributes significantly impact
    recognition performance. For healthcare applications, a gyroscope and heart rate
    sensors can be added for fall detection. Including location details and activity
    labels can help gather user information, but privacy concerns arise.'
  merge: -1
