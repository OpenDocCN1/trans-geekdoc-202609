- pgno: 211
  md: '# OVERVIEW OF SENSOR-BASED HAR SYSTEMS


    The human activity recognition systems in literature mostly follow the following
    phases:

    (1) Data collection (2) Data preprocessing, (3) Feature extraction, (4) Feature
    selection and (5) Classification. Data collection and preprocessing can be done
    on the smart phone using customized applications. The android application can
    be used for collecting data from smart phone inertial sensors.


    **Data Collection:** Number Sampling is a crucial aspect of data collection for
    activity recognition, involving the number, type, and position of sensors. The
    optimal position depends on the system''s application. Proper selection of sampling
    rate and transmission interval is essential for reliability and energy consumption.
    Data collection duration is crucial for proper reflection of activities. Most
    studies consider right pocket storage, chest position, and arm movements. Sampling
    rates range from 5Hz to 512Hz[25][26].


    **Data Preprocessing:** Preprocessing raw data from sensors is essential to remove
    noise, segmentation, attributes, and redundancy. Feature reduces abrupt spikes
    and data calculates unique features. Proper segment size reduces classification
    complexity. Sliding window approaches, normalization, and clustering removing
    irrelevant data [27][28][29].


    **Feature Extraction:** Feature extraction is a statistical method to transform
    filtered sensor readings into more informative indications for decision-making.
    It generates or deviates features from statistical models, ranging from time domain
    to frequency domain. Time features like mean, standard deviation, and entropy
    are useful for identifying data from different body positions [30][31].


    **Feature Selection:** Feature selection is crucial for activity classification,
    as it enhances performance and reduces computation time. Orientation of smart
    phones affects feature values. SFS, RelIEF, and FCFB methods wrap around classifiers,
    filtering from high features and selecting dominant ones from redundant neighbors
    [37].


    **Learning and Classification:** Data are analyzed to identify meaningful patterns
    using probabilistic, machine learning, and threshold-based approaches. Datasets
    are divided into training and test sets, and classification models are built with
    training and test sets. Machine learning procedures are categorized into supervised
    [39], semi-supervised, and unsupervised learning.


    # Application of HAR


    +   1. Healthcare Application


    Remote health care applications rely on daily activity monitoring, including full
    detection, for various conditions like dementia, dementia, and surgery. Using
    accelerometer and gyroscope sensors improves quality of life for Parkinson''s
    patients. Smart phone-based HAR frameworks can monitor daily activities for able-bodied
    and stroke patients, while diabetic patients require regular step count, exercise
    intensity, and calories burned.


    +   2. Surveillance


    Sensor technologies offer valuable data for soldiers, including physiological
    status monitoring, which is crucial for surveillance in military applications.
    These sensors can track fitness, mission-related physiological status, and fatigue
    limits, enabling safe communication with squadron leaders.'
  merge: -1
  img_proc: true
