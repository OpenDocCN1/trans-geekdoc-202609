    - At this point, the small collection of samples is classified as spam or non-spam
    for training purposes. Spam filtering services or manual labeling are also used.
    Spam filtering systems identify as spam those instances that are labelled as non-spam
    and enable that those are labelled as spam that are blocked as effective spam.

