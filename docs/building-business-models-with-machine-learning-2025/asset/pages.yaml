    # KEY TERMS AND DEFINITIONS


    **Big Data**: Large amounts of data available in the contemporary digital environment.


    **Business Model**: Description of how an organization functions.


    **Data Monetization**: Process of extracting economic value from data.


    **Data Monetization Issues**: Issues (e.g., privacy, ethical and legal considerations)
    related to the process of data monetization.


    **Value Capture**: techniques and strategies used by companies to translate the
    value they create into revenues.


    **Data-Driven Innovation Framework**: framework that aids entrepreneurs in evaluating
    practical data-driven business opportunities by systematically analyzing the interplay
    between supply and demand dynamics.


    **Data-Driven Innovation Canvas**: main outcome of the Data-driven innovation
    framework that focuses on business modelling.


    Hudi: a data monetization decentralized platform, which enables individuals and
    businesses to gather, enrich, exchange and monetize their personal data.'
