    # KEY TERMS AND DEFINITIONS


    +   **Burst Detection Algorithm (BDA):** A signal that has significant power for
    a known duration is defined as a burst signal. This signal has no power (dead
    time) outside the known duration. To demodulate such signals, the dead time must
    be avoided.


    +   **Business Analytics (BA):** is a set of disciplines and technologies for
    solving business problems using data analysis, statistical models and other quantitative
    methods.


    +   **Extract, Transform, and Load (ETL):** is the process of combining data from
    multiple sources into a large, central repository called a data warehouse.


    +   **Information and Communication Technology (ICT):** is a broader term for
    Information Technology (IT), which refers to all communication technologies, including
    the internet, wireless networks, cell phones, computers, software, middleware,
    video-conferencing, social networking, and other media applications and services.


    +   **Business Analytics Competency Center (BACC):** is a forum that includes
    analytical and business competencies as well as IT competencies.


    +   **Metrics and Key Performance Indicators (KPIs):** stands for key performance
    indicator, a quantifiable measure of performance over time for a specific objective.
    KPIs provide targets for teams to shoot for, milestones to gauge progress, and
    insights that help people across the organization make better decisions.


    +   **The Strengths, Weaknesses, Opportunities, and Threats (SWOT):** is a framework
    used to evaluate a company’s competitive position and to develop strategic planning.
    SWOT analysis assesses internal and external factors, as well as current and future
    potential.'
