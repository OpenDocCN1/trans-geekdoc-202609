    # Elements of Business Analytics


    Business analytics leverages the following elements


    +   1. **Data Aggregation**: To derive summary statistics, such as mean, minimum,
    maximum, sum, and count, the data to be aggregated.

    2. **Data Mining**: For data-driven decision-making, data mining uses a variety
    of statistical approaches, including clustering, regression, and classification.
    To solve issues, find patterns and trends in large data sets.

    3. **Text Mining**: To find patterns and use text mining for evaluating competitor
    performance, examine and evaluate text data from social media posts, blog comments,
    audio or video scripts, company papers, customer communications, and more.

    4. **Data Visualization**: Construct meaningful visualizations to identify patterns
    and links within datasets. Modeling, forecasting, and exploratory analytics are
    supported by data visualization

    5. **Forecasting**: Using past data to forecast future occurrences. For example,
    using historical data to predict retail sales or summer utilization of energy.
    Using forecasting to plan budget or project spending.

    6. **Optimization**: To find the best-case scenario, use simulation techniques
    such as what-if analysis.


