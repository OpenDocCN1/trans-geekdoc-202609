    # ## ABSTRACT


    This chapter explores the shifting contours of big data monetization in the digital
    transformation era, focusing on the Human Data Income (Hudi) model. Based on the
    literature on big data and innovation management, as well as on the so-called
    Data-Driven Innovation framework, this chapter explores the challenges that are
    inherent in the process of turning personal information into an asset. To better
    understand these challenges, it carries a deep case study analysis for Hudi and
    assesses what the business model does to individuals, businesses, and society
    as a whole and gives valued insights into the monetization of data and value creation.
    Drawing on these results, the chapter helps in contributing to a more grounded
    understanding of the opportunities, challenges, and consequences that come innately
    with the evolving landscape of data economy, shaping future discussions and research
    engagements in this field.'
