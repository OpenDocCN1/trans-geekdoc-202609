    The following steps are often included in a pre-processing procedure.


    # Creation of Bag-of-Words and Tokenization


    **The input string from the raw data is broken down into tokens:** comprising
    words and other elements for example URL links. Tokenization is the process of
    breaking up a written document into smaller pieces as tokens. In this context
    can be words, characters, or sub words. Thus, there are three main categories
    of tokenization: word, character, and sub word (n-gram characters)


    **Example:** Consider the input string as All the Best


    The most popular method for creating tokens is based on space. The tokenization
