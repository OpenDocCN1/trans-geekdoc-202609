  md: '# PROPOSED METHODOLOGY


    The primitive classes of activity are Sit, Stand, Walk, etc. In this chapter,
    an activity recognition framework, which enables active common activity recognition
    even when data is collected using one device kept at one position (say, shirt
    pocket) for training and activity is recognized for readings collected from a
    different device kept same or a different position (say, bag).The process utilizes
    only accelerometer sensor of smart phone which is available in almost all phones
    by any manufacturer making the framework ubiquitous. The proposed classification
    model can be employed on a wide range of human daily activity recognition problems.
    A two-phase activity recognition framework based on an ensemble of classifiers
    to identify static activities (Sit on chair, Stand) as well as dynamic activities
    (Walk, Climbing Stairs). The proposed technique work irrespective of device configuration
    and usage behavior.

    This framework segregates static and dynamic physical human activities from smart
    phones raw accelerometer data and successfully classifies labels of several individual
    activities. Two static Sit and Stand, and two dynamic activities Walk and Climbing
    Stairs (CS) are considered in this work. The data are collected for these (Sit,
    Stand, Walk, CS) daily activities.


    3. Raw accelerometer readings of different activities collected for 540s from
    a smart phone kept at right pant pocket


    ![](img/2d15ce7e8a63337e725a2581c64b1a6e_214_0.png)


    Phase 1: Training device and position selection are crucial for activity recognition.
    Datasets from each training position are stored as train-test pairs, and classification
    accuracy is determined using different classifiers. The training dataset with
    maximum cross validation accuracy is used.'
