- pgno: 221
  md: '# INTRODUCTION


    In the current era of digital transformation, businesses increasingly recognize
    the inherent value within their vast data reserves (Mcafee et al., 2012). The
    imperative to transform this data into valuable assets has become a critical undertaking
    for organizations aiming to secure a competitive edge, foster innovation, and
    enhance decision-making processes (Saggi & Jain, 2018; Terauchi & Buzangan, 2019).


    This proposed book chapter delves into the intricacies of data value creation,
    centering the exploration around the noteworthy case of Human Data Innovation
    (hereafter Hudi) following the Data-Driven Innovation (DDI) framework (Zillner,
    2021; Zollner, 2021b). While the digital landscape has witnessed a surge in data
    prominence due to technological advancements, the Internet of Things, and global
    connectivity, the mere accumulation of data does not guarantee value creation
    (Cappa et al., 2021; Ferrigno et al., 2024; Gashahemei & Calic, 2020). Hudi’s
    innovative approach stands out by empowering individuals to take ownership of
    their data and actively part in the data market, enabling earn income through
    data sharing and capturing intrinsic value.


    The chapter meticulously presents Hudi’s guiding principles, strategic initiatives,
    and operational mechanisms that enable the transformation of personal data into
    tangible and valuable assets. Additionally a detailed examination of the technical
    infrastructure and platforms supporting secure and transparent transactions is
    undertaken, with a focus on prioritizing privacy protection and data integrity.
    Legal and ethical considerations surrounding data ownership, consent, and usage
    are also thoroughly explored, addressing concerns regarding privacy and security.


    An in-depth analysis will critically assess the potential implications of the
    Hudi model on individuals, businesses, and society at large. The chapter provides
    valuable insights into the Hudi model’s case on data monetization, drawing upon
    rigorous methods such as literature review, case studies, stakeholder interviews,
    and data analysis. The overarching aim is to contribute meaningful insights into
    the process of turning data into valuable assets (Accinari et al., 2023; Cappa
    et al., 2021), emphasizing the transformative power of the Hudi model in reshaping
    the data economy.


    In conclusion, this book chapter serves as an exploration into the burgeoning
    field of data monetization (Johnson et al., 2017; Wixom & Ross, 2017) and value
    capturing (Cappa et al., 2021; Urbaninati et al., 2019). By concentrating on the
    Hudi business model, the analysis investigates the transformative power inherent
    in personal data ownership and active participation in the data market. The chapter,
    through a comprehensive examination, illuminates the potential effects of transforming
    data into valuable assets for users, organizations, and society, offering a nuanced
    understanding of the opportunities, challenges, and consequences associated with
    this evolving landscape.


    The chapter goes as follows: First, it is provided a literature review at the
    intersection between big data and innovation management research toward the importance
    of data as a strategic asset, (b) data monetization and (c) the related issues,
    (d) the process of extracting value from big data, (e) the exploration of the
    research question and (f) the Data-Driven Innovation (DDI) Canvas approach in
    big data companies. After, we present the case of Hudi, explaining (a) the theoretical
    sampling, (b) its history and development, and (c) the data collection process.
    Moreover, within the data collection process’ description, we present both the
    interviews conducted, and the secondary data used for the analysis. Furthermore,
    we analyze the data, highlighting the confirmatory approach used. Finally, we
    discuss the findings, applying the DDI approach in business research in big data
    companies.'
  merge: -1
