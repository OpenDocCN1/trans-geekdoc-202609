    ![](img/2d15ce7e8a63337e725a2581c64b1a6e_227_0.png)


    Source: Zillner (2021a)


    Specifically, the supply side of the framework consists of the value proposition
    (i.e., the value generated for users), data (i.e., the kind of useful data), technology
    and application technologies), and partner (i.e., partners useful for implementing
    innovation). The demand side includes the type of business (i.e., the envisioned
    market position), the revenue strategy (i.e., the strategy to make money), the
    network strategy (i.e., leveraging process of network effects), and ecosystem
    (i.e., partners need to adopt the innovation.


    Developed as part of the Horizon 2020 Big Data Value (BDV) project, the DDI framework
    is grounded in scientific research and empirical data. It has been refined through
    the examination of over 90 data-driven business opportunities, ensuring its relevance
    and effectiveness in data-driven innovation.


    This framework is now widely used by the BDV Public-Private Partnership, as well
    as by data-driven start-ups, SMEs, and large corporations during project works.
    It consists of the DDI Canvas, DDI Navigator, and DDI Tools, offering users structured
    guidance in systematically evaluating relevant variables across both the supply
    and demand sides of data-driven innovation (https://ddi-canvas.com/how/). Through
    the DDI Canvas, stakeholders can methodically explore all pertinent aspects, facilitating
    a comprehensive understanding of the innovation landscape and informing strategic
    decision-making.


    In sum, in this section we analyzed the literature background concerning the perception
    of data as an asset, its monetization and the issues that could affect it, alongside
    the explication of the research question, we introduced the DDI Canvas which is
    a framework for defining data-driven innovation business model. In the next section,
    we will examine the case study of Hudi.'
