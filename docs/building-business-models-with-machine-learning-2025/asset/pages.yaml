    sub modules as first first module employs two ML algorithms such as SVM and ANN,
    simultaneously trained on same dataset to find bidding fraud. The predictions
    generated by SVM and ANN are fed into a fuzzy-based fused module. Within this
    module, a fuzzy logic mechanism processes these inputs to a final output, leveraging
    the strengths of both algorithms. This novel fused machine learning approach achieves
    an impressive accuracy of 99.63%, demonstrating its effectiveness in accurately
    identifying outcomes. Moreover, simulation results indicate that this fused method
    outperforms existing techniques, underscoring its superior performance. This integration
    of SVM and ANN through fuzzy logic not only enhances predictive capabilities but
    also provides a robust solution for tackling complex decision-making challenges.
    However, there remains area for improvement in accuracy and thus, enhancing accuracy
    will be a key focus for future iterations (Abidi et al, 2021). Figure 6 illustrates
    the flowchart of fused ML online financial fraud detection.'
