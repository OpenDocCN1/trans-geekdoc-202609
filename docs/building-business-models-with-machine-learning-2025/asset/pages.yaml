    # ## Chapter 1


    A Detailed Investigation on Online Financial Fraud Detection Using Machine Learning
    Algorithms . 1


    Siji A. Thomas, Independent Researcher, UAE

    Sini Kurien Thomas, Independent Researcher, USA


    Financial fraud remains a persistent threat to various sectors including the public
    sector, government and finance industry, particularly with the increasing reliance
    on new technologies. This chapter delves into the potential of Machine Learning
    (ML) applications to support fraud detection capabilities within the financial
    sector. With fraudsters continuously adapting their strategies to exploit weaknesses
    in existing preventive measures, a comprehensive review of literature is conductisd
    to investigate the effectiveness of various ML algorithms, including Support Vector
    Machine (SVM), Logistic Regression (LR), Random Forest (RF) and Convolutional
    Neural Networks (CNN), identifying the fraudulent activities. The research categorizes
    existing literature based on several criteria, such as the type of fraud analyzed,
    ML algorithms utilized and efficiency of various detection strategies of financial
    fraud. Additionally, the authors in this chapter identifies the key challenges
    in current methodologies, alongside with potential research directions.


    # ## Chapter 2


    Abusive Language in Twitter''s Tweets by Sentimental Analysis . 31


    Ashwini S. Diwakar, Surana College, Bangalore, India

    B. Shovani, Surana College, Bangalore, India

    H. Asha, Surana College, Bangalore, India


    Communication and information sharing between individuals have changed dramatically
    as a result of the internet and social media platforms with exponential growth.
    Due to the development and expansion of online technology, a vast amount of data
    is generated as well as being available on the web for internet users. Furthermore,
    Twitter is a well-known medium where users are allowed to voice any opinion. The
    proliferation of antisocial activities, including hate speech, cyberbullying,
    and the use of harsh language, is a direct result of overuse of social media.
    The prevalence of hostile comments on social media platforms calls for the development
    of practical and efficient solutions. Consequently, numerous algorithms have been
    developed to identify these kinds of languages. The objective of this chapter
    is to introduce strategies, equations, and techniques that could be used to evaluate
    Tweets to identify instances of abusive language.'
