    # 8. Data Analysis and Management


    Usually, at the beginning, we do not have a clear picture of what an analysis
    will produce, so it needs an iterative process with the business owner. The result
    is a clear understanding of what data or information can support the business
    process. In this case, we sometimes need to purchase additional data or just a
    little bit of the business process because of considerations from the analysis.
    The effect can happen on the business process reengineering, and we should go
    back to the business process analysis. But it is not a problem because iteration
    is common in everything related to this automation and data. The change is the
    positive side, now you have a reason why you must change. Now your data is ‘telling’
    you. (Yang et al., 2022)


    An important step for making data effective is conducting analysis. It can be
    defined as the process of inspecting, cleaning, transforming, and modeling data
    with the objective of discovering useful information, informing conclusions, and
    supporting decision-making. Data analysis has an important role in increasing
    the efficiency and effectiveness of using data. At this stage, we know clearly
    that the information requirements are to support business processes. We already
    have data in the warehouse, but we need to sort and analyze the data to ensure
    we get the useful information to support our business process. (Wang et al., 2022)


    # 9. Technology Evaluation and Selection


    In order to facilitate the evaluation and selection of systems, it can be wise
    to seek advice from someone who has a strong understanding of the available technologies.
    This may involve the hiring of a consultant or the use of a recruitment firm with
    expertise in a given area. In some cases, the recruitment of extra IT staff will
    be necessary to address gaps in IT knowledge identified throughout the course
    of a project. (Mukhy et al., 2022)


    Once an understanding of the potential changes has been developed, the onus is
    on the initiative to evaluate and select technologies. The objective during this
    phase is to identify and evaluate potential solutions that will address the business
    needs and to select the best solution for the business. This requires a clear
    understanding of the technology that is being evaluated. In most cases, the high-level
    characteristics of a system can be ascertained through interaction with system
    vendors and through product literature. However, when assessing whether a given
    product is suitable for the business, it is necessary to understand the inner
    workings of the system and to ascertain its flexibility. (Gyamfi et al., 2022)'
