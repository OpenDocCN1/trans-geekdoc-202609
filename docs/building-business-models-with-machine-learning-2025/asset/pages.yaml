    # ### C. K-NN Under Sampling Technique Along With CatBoost


    An enhanced CC fraud detection model utilizing ML is presented in this paper.
    Given the pressing need to combat fraudulent CC transactions, this study explores
    sixty six ML models through a two-stage evolution process. Leveraging real world
    dataset of European cardholders and employing K-fold validation, each model is
    rigorously assessed. Among these models, All KNN undersampling method combined
    with CatBoost (AIKNN-CatBoost) emerges as top performing. The AllKNN-CatBoost
    approach is meticulously compared with existing approaches, demonstrating superior
    performance with 97.94%, AUC value, 95.21% Recall and 87.40% F1 score. However,
    future efforts to explore alternative datasets and optimization algorithms come
    with their own set of disadvantages. First, the availability and quality of alternative
    datasets can be inconsistent, potentially leading to unreliable insights. Additionally,
    different datasets may not adequately represent the specific patterns of credit
    card fraud, making it difficult to achieving effective model training. Furthermore,
    the complexity of optimization algorithms may introduce increased computational
    demands, which can hinder real-time processing capabilities. Lastly, relying on
    new datasets and algorithms may necessitate extensive training of existing models,
    resulting in time and resource constraints that could delay the deployment of
    improved fraud detection systems (Alfaiz et al, 2022).'
