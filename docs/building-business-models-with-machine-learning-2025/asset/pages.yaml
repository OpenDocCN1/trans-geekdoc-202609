  md: '# B. Fine Grained Co-occurrences for Behaviour Fraud Detection


    The authors in Wang *et al*, 2022 presented an enhancement data for behavioural
    modelling is the primary focus in utilizing fine grained co-occurrences for behaviour-based
    fraud detection in digital payment systems. The system identifies complex correlations
    among transactional attributes utilizing a data map that maps the connections
    between different variables in an organized manner. This graphical representation
    facilitates a deeper analysis of how attributes interact, uncovering intricate
    patterns that may signal fraudulent activity. Additionally, the model employs
    heterogeneous network embedding techniques to enhance the representation of these
    relationships, improving the understanding of how different elements within the
    data are interconnected. Looking forward, an exciting opportunity for future research
    lies in broadening the enhancement methods to encompass a wider array of behavioural
    models. This could include generalized agent-based models and group-level models,
    alongside the current individual and population-level frameworks. By expanding
    in this way, the model would be able to capture nuanced behavioural dynamics,
    providing a richer context for analysing patterns and enhancing detection accuracy
    across diverse scenarios and user interactions.


    # C. Heterogeneous Graph Transformer (HGT)


    Tang et al. 2021 presented a fraud detection in online review systems through
    HGT. This approach tackles issues of camouflage and inconsistency frequently.
    Aware Heterogeneous Graph Transformer (FAHGT) employs type aware feature mapping
    manage HGT data, followed by implementation of several scenarios to mitigate contradiction
    and detect camouflage. A label-aware counting technique has been developed to
    clear out noisy neighbours in order to identify camouflage behaviours. This system
    uses a combined method called the score head mechanism to integrate two neural
    modules, both of which are subsequently combined in the computation of edge weight
    in the final feature aggregation. Heterogeneous features are subsequently combined
    to form a more informative representation, providing deeper insights into the
    underlying data. The FAHGT has demonstrated significant performance enhancements
    compared to several baseline methods across various datasets, highlighting its
    effectiveness in capturing capabilities relationships within the data. Looking
    ahead, there are plans to further develop the model''s capabilities in dynamic
    graph data where relationships evolve over time. Additionally, there is an aim
    to extend the model''s fraud detection capabilities to other domains, allowing
    for its application in diverse fields such as finance, healthcare, and cybersecurity,
    increasing its overall impact and utility.


