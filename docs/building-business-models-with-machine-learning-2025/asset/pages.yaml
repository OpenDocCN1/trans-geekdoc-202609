  md: '# THEORETICAL LITERATURE REVIEW


    Financial goals, services, and investments created specially to assist ecologically
    friendly projects and efforts are referred to as “green financing.” It entails
    allocating funds to initiatives that benefit the environment, like waste management,
    sustainable agriculture, clean technology development, energy-efficient infrastructure,
    and renewable energy projects. The objectives of green funding are to combat climate
    change, enhance resource efficiency, and aid in the shift to a sustainable and
    low-carbon economy (Prabhu & Aith, 2023).


    Models of sustainability finance are financial structures and methods that put
    the long-term health and sustainability of people, communities, and the environment
    first. These models include social, environmental, and governance aspects in financial
    decision-making in addition to just economic ones. The goals of sustainability
    finance models are to guarantee the fair allocation of opportunities and resources,
    encourage social equity, lessen inequality, and promote inclusive economic growth.
    Incorporating sustainable practices, impact investment, responsive lending, engaging
    stakeholders, and coordinating financial operations with sustainable development
    objectives are frequently included (Nino et al., 2022).


    A company’s decision and initiatives to conduct business in an ethical and responsible
    manner, considering the interests of many stakeholders, such as customers, employees,
    communities, and the environment, are referred to as corporate social responsibility,
    CSR. CSR entails choosing to go above and beyond the law and incorporating environmental
    and social concerns into operations (Apeku-Djuna et al., 2023). This can involve
    taking steps like implementing sustainable corporate practices, community development
    initiatives, encouraging diversity and well-being among employees, reducing the
    impact on the environment, and openly disclosing social and environmental performance.
    Ensuring long-term sustainability and financial viability while making meaningful
    contributions to society and the environment is the aim of corporate social responsibility
    (CSR) (Husnah & Fahleevi, 2023).


    # EMPIR LITERATURE REVIEW


    # Green Financing and Sustain Finance Models


    The allocation and utilization of financial resources to support sustainable development
    are shaped by green financing, which has a notable influence on sustain finance
    models. Green funding directs funds towards initiatives and projects that protect
    the environment. It pushes investors and financial institutions to give sustainable
    industries including clean technology, sustainable infrastructure, renewable energy,
    and energy efficiency top priority. Through the process of rerouting financial
    flows, green financing aids in the advancement and growth of sustain finance models
    (Tusun et al., 2022). Green finance is the process of integrating social and environmental
    factors into financial decision-making. It makes possible for companies and organization
    to evaluate and control environmental hazards related to their ventures or activities.
    Sustainability criteria are incorporated into green financing, which improves
    the'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'resilience of sustenance finance models by reducing risks associated with resource
    depletion, climate change, and environmental restrictions (Chaudhary, 2020).


    Green finance encourages the development of sustainable practices and technology,
    which in turn spurs innovation. It opens up markets for companies who provide
    eco-friendly goods and services, green infrastructure, and renewable energy. By
    encouraging the development of new sectors, the production of jobs, and economic
    growth while solving environmental concerns, this promotes the expansion of sustainability
    finance models (Doni & Fameni, 2024). Access to funds for models of sustenance
    is improved by green financing. Financing initiatives that support social and
    environmental objectives are given priority by a large number of development banks,
    impact investors, and international organization. Organization can access a wider
    range of funding sources, such as green bonds, impact investments, and sustainable
    development funds, by enhancing green concepts and integrating sustainability
    into their business models (Ibe-novo et al., 2019). Businesses and financial institutions''
    reputations can benefit from green growth. Organization shows their dedication
    to sustainability and ethical practices by incorporating social and environmental
    factors into their financial plans. This can increase recognition, draw in socially
    conscious investors, and foster stakeholder trust—all of which improve the overall
    sustainability of sustenance finance models (Rauf et al., 2024).


    Policy initiatives and regulatory frameworks that encourage sustenance finance
    models frequently boost green finance. To promote green and establish a supportive
    climate for sustainable finance, governments may offer rewards, subsidies, or
    takes. From policies like these strengthen the effect of green financing on models
    of sustenance finance by bringing financial systems into line with sustainability
    goals and promoting sustainable transformation (Adula et al., 2023). Green financing
    has a complex impact on sustenance finance models that includes risk mitigation,
    capital redirection, innovation, funding availability, reputation enhancement,
    stakeholder engagement, and policy assistance. Green financing facilitates the
    shift towards sustainable development by incorporating environmental and social
    factors into financial decision-making. This approach aligns flows with environmental
    concerns and ensures the sustainability of sustained finance models over the long
    term (Ibrahim et al., 2023).


    # Green Financing and Corporate Social Responsibility


    Organization''s corporate social responsibility (CSR) policies are significantly
    impacted by green financing. Organizations integrate elements into their operations
    and investment decisions to qualify for green funding. An essential component
    of corporate social responsibility is its integration with sustainability and
    environmental goals. Organizations are encouraged to adopt eco-friendly procedures,
    lower their carbon footprint, lessen environmental hazards, and advance sustainable
    resource management by using green financing (Zaid & Sleimi, 2023). Green finance
    makes stakeholders more involved in CSR projects. Communities, workers, consumers,
    investors, and employees all place a higher value on businesses that show a dedication
    to environmental sustainability. Businesses can connect with environmentally conscious
    consumers, draw in socially conscious investors, and strengthen their ties by
    implementing green financing strategies. This involvement advances shared value
    and fosters trust, which enhances the CSR mission (Berwal et al., 2022).


    Green financing helps with risk management, which is a crucial aspect of corporate
    social responsibility. Environmental hazards, the effects of climate change or
    modifications to sustainability-related regulations can have a big influence on
    businesses. Organization can recognise and manage'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'environmental risks and maintain long-term viability and resilience by implementing
    green finance principles. The fundamental ideas of CSR are in line with proactive
    approach to risk management (Panigraghi et al., 2022).


    Organizations are encouraged to invest in cutting-edge and environmentally friendly
    technologies by green finance. Businesses can foster innovation and create environmentally
    friendly solutions by investing financial resources in green projects. This encourages
    scientific progress in fields like clean technologies, renewable energy, and resource-efficient
    processes. By encouraging sustainable growth and tackling environmental issues,
    these investments support CSR goals (Yang et al., 2022). Green finance has an
    impact on transparency and CSR reporting. Businesses that use green finance are
    frequently obliged to publish details about their sustainability, carbon emissions,
    and environmental performance. Stakeholders can evaluate an organization''s CSR
    initiatives and hold them responsible for their environmental impact thanks to
    this improved openness. Thus, green finance encourages open reporting, resolving
    CSR responsibility and disclosure (Sinha et al., 2023).


    An organization''s reputation and brand image can be improved by using green finance.
    Shows that they genuinely adhere to CSR ideals when they incorporate sustainability
    into their financial strategies. Customers, investors, and other stakeholders
    find this dedication meaningful, which enhances their opinion of the company.
    In addition to increasing brand value, a CSR adaption driven by like-minded stakeholders
    are more likely to support an organization''s sustainability objectives (Khan
    et al., 2021). Corporate social responsibility is revolutionised by green finance.
    It motivates businesses to implement eco-friendly practices, including stakeholders,
    control environmental hazards, encourage creativity, advance openness, and improve
    their reputation. Organization can sustain development and ethical business practices
    by tying financial decisions to environmental objectives through the integration
    of green finance principles into their CSR strategy (Riandy et al., 2023).


    # Corporate Social Responsibility and Sustainability Finance Models


    Models of sustainability finance are significantly impacted by corporate social
    responsibility (CSR) activities. Financial institutions are encouraged by CSR
    to use moral lending and investing practices. This entails taking into account
    how investments affect sustainability and the environment and making sure money
    is given to initiatives that support sustainable development objectives. Financial
    institutions support the creation of finance models give priority to long-term
    social and environmental benefits by incorporating CSR into their lending and
    investing criteria (Boson et al., 2023).


    Stakeholder participation in sustainability finance schemes is encouraged by CSR.
