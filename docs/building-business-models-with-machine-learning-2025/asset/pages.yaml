    # ## ABSTRACT


    Communication and information sharing between individuals have changed dramatically
    as a result of the internet and social media platforms combined with explosive
    growth. Due to the development and expansion of online technology, a vast amount
    of data is generated as well as available on the web for internet users. There
    has been a noticeable rise in the usage of foul language in user comments. Furthermore,
    Twitter is a well-known medium where users are allowed to voice any opinion. The
    proliferation of antisocial activities, including hate speech, cyberbullying,
    and the use of harsh language, is a direct result of overuse of social media.
    The prevalence of hostile comments on social media platforms calls for the development
    of practical and efficient solutions. Consequently, numerous intriguing algorithms
    have been developed to identify these kinds of languages. The objective of this
    chapter is to introduce strategies, equations, and techniques that could be used
    to evaluate Twitter tweets to identify instances of abusive language.'
