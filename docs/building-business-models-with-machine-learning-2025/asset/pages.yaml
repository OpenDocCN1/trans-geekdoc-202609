  md: 'Phase 2: Identifying individual activities using a single base classifier is
    challenging, so ensemble methods are recommended. Ensemble methods combine hypotheses
    and use multiple base learners, resulting in a stronger generalization ability.
    Single base classifiers struggle to identify all activities with reasonable accuracy,
    so ensemble models are created based on their overall performance to identify
    multiple activities.


    Figure 4. Block diagram of proposed two phase activity recognition framework


    ![](img/2d15ce7e8a63337e725a2581c64b1a6e_215_0.png)


    This framework provides support to healthcare providers for assessing patients
    daily activity pattern. It can help tracking activity of patients during post
    surgery recovery period as they are not allowed to climb upwards or downwards.
    Activity recognition can also identify exact context of a patient which is important
    for context aware health monitoring.


    # CONCLUSION


    Human activity recognition and monitoring is an emerging field in pervasive computing.
    So, the aim of this chapter is recognizing daily actions with user convenient
    setup and addressing few associated challenges. Smartphone hardware configuration,
    calibration, and usage behavior like how the smart phone is kept for tests and
    training environments are important challenges that are addressed in this thesis.
    Other challenges include non uniform gait and imprecise labeling of detailed activities.
    The proposed frameworks are aimed to utilize a minimal number of sensors. Machine
    learning techniques are applied to combine the data from different types of sensors.
    The machine learning models are developed to build classification model for HAR.'
