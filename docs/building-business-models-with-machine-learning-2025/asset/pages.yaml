    extraction from data. In this sense, the act of gathering data, analysis, and
    transformation into actionable insights has revolutionized business operations
    and decision-making processes. Effectively harnessing and monetizing this data
    to extract valuable insights and foster innovation presents a significant challenge
    (Ritala et al., 2024). Therefore, the research question of this book chapter is
    following: How can value be captured from data?


    Specifically, “value capture” denotes the techniques and strategies used by companies
