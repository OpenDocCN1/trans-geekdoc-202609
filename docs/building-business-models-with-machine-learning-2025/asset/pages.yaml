  md: '# CC Fraud Detection Using FPMA Technique and Apriori Growth


    The Apriori approach was published by the authors in Vipin et al, 2017, and the
    two steps of the FP tree methodology are listed here. The first stage builds the
    FP Split Tree, which is a more effective method of producing candidate sets than
    the FP Tree because it only requires one database scan as opposed to the latter''s.
    The efficiency is twice as high as before Mining the FP Split Tree produced by
    the Apriori growth algorithm the second phase of the process. This approach is
    significantly more time-efficient than the traditional FP-Growth algorithm, primarily
    because it eliminates the need for continuous recursive construction of FP-Split
    trees. In FP-Growth, this recursive generation can create substantial overhead,
    especially with larger datasets. By leveraging the FP Split tree, the algorithm
    effectively reduces the search space, enabling faster access to relevant itemsets.
    This increased efficiency not only speeds up the process but also improves overall
    performance, making it especially beneficial for managing complex data scenarios.
    By eliminating the need for recursive searches, the FP Split Tree significantly
    simplifies the complexity of the FP Tree. Additionally, it only requires a single
    database scan, unlike the FP Tree, which demands two scans, and the Apriori algorithm,
    which typically necessitates multiple scans. However, the effectiveness of this
    method can be impacted by long-pattern formations, complicating the detection
    process. The entire workflow of detecting fraudulent card activity is depicted
    in Figure 7, offering a clear visual representation of the method''s efficiency
    and structure.


    Figure 7. Complete process of fraudulent card usage detection


    ![](img/2d15ce7e8a63337e725a2581c64b1a6e_32_0.png)


    (Vipin et al, 2017)'
