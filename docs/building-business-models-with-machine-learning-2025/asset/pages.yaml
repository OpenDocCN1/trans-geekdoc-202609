  md: '# Data Analytics vs. Business Analytics vs. Business Intelligence


    # 1. Business Analytics vs. Data Analytics


    Using data analytics technologies to find business insights is part of Business
    Analytics (BA). However, due to its broad definition, business analytics and data
    analytics are occasionally used synonymously. Analyzing data sets to make inferences
    about the information they contain is known as Data analytics. It is not necessary
    to utilize analytics to achieve business objectives or gain insights. Business
    analytics is a part of this wider approach according to Shmueli, G., &Koppius,
    O. R. (2011).


    # 2. Business Analytics vs. Business Intelligence


    Predictive analytics is the main focus of business analytics, producing insights
    that decision-makers can employ. BA seeks to forecast trends rather than summarize
    historical data items.


    Businesses typically use business intelligence (BI) first, then business analytics.
    Business Intelligence (BI) examines company operations to identify successful
    practices and areas for development. Descriptive analytics is used in BI.


