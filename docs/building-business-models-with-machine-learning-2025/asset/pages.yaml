    # Business Data Analytics


    In a broad sense, business data analytics is a practice that involves the application
    of a particular set of techniques, competencies, and procedures in order to carry
    out continuous exploration and investigation of both historical and current business
    data. The goal of this is to obtain insights about a company that can lead to
    improved decision-making. A number of different points of view can be utilized
    to provide a more specific definition of business data analytics. The following
    are some of the viewpoints that are included in this category: business data analytics
    as a movement, capability, data-centric activity set, decision-making paradigm,
    and collection of techniques and technology. However, this list is not exhaustive.


    Business data analytics as a movement involves a management philosophy or business
    culture that bases problem identification and problem solving on evidence. From
    this point of view, the evidence that can be cleaned from data is the primary
    factor that drives business decisions and improvement. When this philosophy is
    in place, evidence is not selected to support a preconception or point of view;
    all of the available evidence that is pertinent is used to make informed business
    decisions to fulfill the purpose of the philosophy.


    Business data analytics is a competency that encompasses the competences that
    are possessed by the organization and the personnel. The ability of an organization
    to carry out all organizational tasks is not the only factor that determines whether
    or not it possesses business data analytics capabilities. In addition to that,
    it encompasses competences like invention, the formation of culture, and the design
    of processes. Which the organization is actually accomplishing through the use
    of business data analytics may be defined or constrained by the capability.


    Business data analytics is an activity set that encompasses the actions that are
    necessary for an organization to employ evidence-based problem identification
    and problem solving. Accessing, examining, interpreting, and aggregating, as well
    as presenting the results, are the six fundamental data-centric tasks that are
    included in the definition of business data analytics that have been provided
    by practitioners who are experts in the field.'
