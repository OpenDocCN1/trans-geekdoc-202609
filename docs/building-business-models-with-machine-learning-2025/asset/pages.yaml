  md: '# Extraction on N-Grams


    This method groups corresponding words into what are known as n-grams, which are
    sentences. The N-grams approach can reduce bias, but it may also make statistics
    more sparse. The quality of text classification has been demonstrated to the inclusion
    of n-grams ([24]; [25]; [26]); never-theless, there is no one-size-fits-all method
    for selecting n-gram sizes. Trigrams are groupings of three nearby words, and
    bigrams are collections of two nearby words in a text.


    # Lemmatization and Stemming


    The process of stemming involves substituting words with their stems, or roots.
    When several words, such speak, speaker, and speaking, are mapped into one word,
    speak, and counted collectively, the BOW''s dimensionality is decreased. Applying
    stemming, however, requires caution since it can amplify bias.


    # Removal of Stop Words


    Prepositions, articles and other words with a connecting role in a phrase are
    example of stop words. Although there isn''t a set list of stop words, search
    engines use some of the most often used function words, which "which", "on", "the",
    "is", and "at". Despite their frequent recurrence in the text, they can be eliminated
    because they do not change the sentence''s overall meaning.


