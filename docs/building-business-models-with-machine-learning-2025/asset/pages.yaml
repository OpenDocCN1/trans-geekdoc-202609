  md: '# # Chapter 11

    # Machine Learning-Based Framework for Human Activity Recognition


    Allampalli Harini

    ID https://orcid.org/0009-0008-6726-0364

    Pragati Engineering College, India


    Manjula Devarakonda Venkata

    Pragati Engineering College, India


    Doodala Kondababu

    Pragati Engineering College, India


    # ## ABSTRACT


    This chapter proposes a novel Machine Learning-based Framework for Human Activity
    Recognition tailored to address the complexities and challenges inherent in accurately
    identifying and categorizing human activities from sensor data. ML-HAR integrates
    advanced machine learning algorithms with a comprehensive data preprocessing pipeline
    to extract meaningful features from raw sensor data. Leveraging a diverse array
    of sensor modalities, including accelerometers, gyroscopes, and magnetometers-HAR
    captures spatiotemporal patterns characteristic of human activities. The framework
    employs a hierarchical classification approach, wherein low-level features are
    initially extracted and subsequently aggregated to infer higher-level activity
    labels. ML-HAR outperforms other methods in extensive experiments on benchmark
    datasets, attaining state-of-the-art accuracy rates in a variety of real-world
    applications like sports analytics, healthcare monitoring and human-computer interaction
    systems, the framework’s efficiency and scalability are also demonstrated.


    # ## INTRODUCTION


    Human activity refers to any body movement produced by skeletal muscles or different
    positions of the limbs with respect to time standing against gravity that results
    in an energy expenditure-[1][2][3]. Human Activity Recognition (HAR) systems identify
    and evaluate actions in real


    DOI:10.4018/979-8-3693-3884-1.ch011'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'ditions, providing context-aware feedback for medical applications like elderly
    assistance, post-trauma rehabilitation, and smart environment detection. These
    systems help patients with chronic health conditions and dementia detect abnormal
    behavior. Researchers are exploring applications in fitness tracking, entertainment,
    and surveillance beyond healthcare monitoring.


    Camera systems provide the necessary context for classifying local interactions
    or object interactions. In the Early 80s, human motions and actions were recognized
    using image based techniques. Initially, image sequences [6] were used for identifying
    human activities. After that, tracking process [5] was developed to track human
    motion from the continuous image. Image sequence analysis faced some problems,
    like body motion and responding feature points selection. Hence, in literature,
    a few methods were applied like body parts generalized estimation and window code
    matching for selecting feature points. Temporal sequence was converted into image
    vector using quantization [21] and applied statistical techniques like Hidden
    Markov Model (HMM). Human actions were recognized using low-level features or
    simple heuristics based on prior knowledge. After a few years, the 3D segment
    tracking approach was introduced to monitor the gesture of human in a cluttered
    environment. Proximity space [7][8] was one of the popular methods among them.


    Wireless technology enhances healthcare services, particularly for elderly and
    chronically ill individuals. Sensors provide accurate, adaptive, responsive, and
    intelligent information for smart healthcare and assisted living applications.
    Small, inexpensive, and low-powered sensors can adapt to users’. In the late 90s,
    sensor technology was introduced in the field of human activity recognition and
    monitoring [9][10]. Wearable accelerometers were mostly used as sensors to recognize
    daily activities, detecting falls, and monitoring undesirable conditions [11][12].
    Gyroscopes and magnetometer were also used for the same purpose, but they are
    not able to provide considerable information individually.


    After the introduction of machine learning techniques, vision-based techniques
    are following the progress of machine learning research. Several learning techniques
    are applied for identifying activity from similar images or as video sequences.
    Human motions or actions can be recognized based on local space time temporal
    features and Support Vector Machine (SVM) from the video sequences [13]. A template
    matching-instance-based learning method is adopted to classify objects. SVM, Ridge
    Regression, Relevance Vector Machine (RVM) [13] etc techniques were applied to
    extract 3D human body movement from single and multiple image sequences. Initially,
    a single camera was used to identify human activity, and most of them, it can
    track a single person. Multiple fixed cameras were also used for identifying this
    [15].


    Machine Learning Techniques were applied in different sensor-based HAR systems
    to improve overall performance and classification accuracy. Learning techniques
    like k-Nearest Neighbor, Decision Tree, Naive Bayes etc were applied in different
    works. Threshold-based (inclination angle) and statistical techniques (Hidden
    den Markov Model) were developed properly for HAR systems and applied in many
    HAR systems. The gyroscope and magnetometer alone could not achieve a significant
    place in human activity recognition, and it could only well in combination with
    other sensors. In [16] systems. In [17], PIR sensors and a pressure sensor were
    used for ambient fall detection systems. SafeDoor and Safety [18] are few examples
    of assisted living system. The activity recognition frameworks are based on the
    video camera and environmental sensor for elderly adults at indoor [19]. The system
    takes input video, environmental factors, and previous knowledge of multimodal
    events to identify complex activities.'
