- pgno: 341
  md: '# Functional Programming with purr and base R


    Functional programming is a programming paradigm that emphasizes immutability,
    pure functions, and declarative programming, treating computation as the evaluation
    of mathematical functions and avoiding shared state and side effects. It focuses
    on composing functions and working with immutable data to create robust and predictable
    programs. In terms of our day-to-day work, this means focusing on using functions
    to solve problems and avoiding changing data. We also emphasize writing clear,
    reusable code that is easier to understand and predictable in its behavior. This
    style helps us as programmers, especially when code becomes complex or must be
    maintained over a longer period of time.


    R has several base functions, including the apply family, as well as external
    packages that support functional programming, including purr, and tidyverse. These
    tools provide functions and operators that facilitate working with data using
    a functional programming paradigm, allowing for concise and expressive code that
    focuses on transformations and operations on data. At the center of this way of
    working is the dataframe object, but not all, indeed not most, R returns a handy
    dataframe object. Therefore, we will look at converting objects to dataframes
    and extending them so that they can be a more complex data type, without compromising
    the streamlined functionality we''ve come from packages such as dplyr. We will
    learn how to take advantage of the functional programming available in R by converting
    base objects to tidy formats, and then we will work in reproducible scalable pipelines
    with streamlined code. By the end of the chapter, you''ll have a good handle on
    how to build code that is concise and easier to maintain through functional programming.


    In this chapter, we will cover the following recipes:


    +   - Making base R objects tidy

    - Using nested dataframes for functional programming

    - Using the apply family of functions'
