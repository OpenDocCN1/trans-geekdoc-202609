    Step 5 creates a DGList object called_dge using the DGList function from the edgeR
    package. The counts_of_interest object and the grouping factor are passed as arguments
    to DGList (). A DGList is a special type of object that''s used by the edgeR package
    to store count data for differential expression analysis.


    Step 6 performs differential expression on the eset_dge object using a series
    of functions from the edgeR package. The estimateDisp() function is used to estimate
    the parameter of the count data, the glmQLFit() function is used to fit a generalized
    linear model to the data, and the glmQLTest() function is used to perform a likelihood
    ratio test to identify differentially expressed genes. The resulting object is
    an object called counts. Finally, the topTags() function is used to display the
    top differentially expressed genes. This step is used to identify genes significantly
    differentially expressed between the two experimental groups.


    # Estimating differential expression with DESeq2


    The DESeq2 package is a popular tool for performing differential analysis of count
    data, it is ideal for expression analysis of RNA-Seq data in other count data
    such as ChIP.


    DESeq2 performs normalization using a method called variance stabilizing transformation
    (VST), which is a type of transformation that stabilizes the variance of the data
    across the range of counts. This is in contrast to other normalization methods
    that aim to bring the mean of the data to a specific value, counts. The VST method
    is effective at reducing the variance of the data estimating and improving the
    statistical power of differential expression analyses. This allows us to focus
    on improving gene ranking in results tables.


    DESeq2 uses a negative binomial model to fit the count data and estimate the dispersion
    parameter. This is commonly used for RNA-Seq data because it account the overdispersion
    that''s observed in such data. For differential expression, DESeq2 uses a likelihood
    ratio test to compare the negative binomial models fit to the data using the ratio
    of the maximum likelihoods of the full and reduced models, with the full model
    being the model that constrains some of the parameters to be equal across groups.
    Other packages, such as edgeR and limma, use different tests for differential
    expression. For example, edgeR uses a likelihood ratio test similar to DESeq2,
    while limma uses an empirical Bayes method to estimate fold changes and for differential
    expression.


    The process we''ll look at in this recipe is similar to edgeR in the preceding
    recipe. We will use a count table and ExpressionSet objects as input and then
    use DESeq2''s specific data structures and functions.'
