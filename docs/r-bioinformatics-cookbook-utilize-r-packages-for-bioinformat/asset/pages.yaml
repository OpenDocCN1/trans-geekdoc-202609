    # Finding orthologue candidates using reciprocal BLASTs


    In genomics, orthology refers to the relationship between genes from different
    species that evolved from a common ancestral gene through speciation. Orthologous
    genes typically have the same function and structure and play similar roles in
    different organisms, even if they have diverged over time.'
  merge: -1
  img_proc: true
- pgno: 281
  md: "# Finding orthologue candidates using reciprocal BLASTs\n\nOrthology has many\
    \ important uses in bioinformatics. Orthology can be used to infer the function\
    \ of a gene in a newly sequenced genome based on its similarity to known genes\
    \ in other species. This can be especially useful for identifying genes that are\
    \ involved in specific biological processes or pathways. Orthologous genes can\
    \ be used to compare the genomes of different organisms and study the evolution\
    \ of gene families. By identifying which genes are conserved across different\
    \ species, researchers can gain insights into the evolutionary history of these\
    \ genes and the organisms that carry them.\n\nOrthology can be inferred via various\
    \ computational methods that compare the DNA or protein sequences of genes from\
    \ different organisms. Reciprocal BLAST hit (RBH) is a simple method that involves\
    \ searching for the best hit of a gene in one species against all genes in another,\
    \ and then searching for the best hit of the gene in the other species against\
    \ all genes in the first species. If the two hits are the same genes, then they\
    \ are considered orthologues.\n\nMore complicated and sensitive methods exist,\
    \ including the Inparalog method, tree-based methods, and Markov-clustering methods.\
    \ In this recipe, we will look at the RBH method as implemented in R OrthologR\
    \ package.\n\n# Getting ready\n\nFor this recipe, we'll need the readr and datatable\
    \ packages. We'll also get a small amount of sample data from danmaclean/bioinfocookbook.\
    \ The function we will rely on an internally installed version of blastp, so we\
    \ will need to install that in an environment using conda. I assume that it will\
    \ be called bioinformatics_project in step 1. The reticulate package will be needed,\
    \ too.\n\n# How to do it...\n\nComputing RBH to infer orthology can be done as\
    \ follows:\n\n+   1. Create a function that will find the path to:\n\n```\nenv_path\
    \ <- function (env, program = \"\") {\n  df <- reticulate::conda_list()\n  b <-\
    \ df$python(which(df$name == env))\n  if (length(b) == 0) { stop(\"no environment\
    \ with name found\")\n}\n  file.path(dirname(b), program)\n}\n\nblast_path <-\
    \ env_path(\"bioinformatics_project\")\n```"
  merge: -1
  img_proc: true
