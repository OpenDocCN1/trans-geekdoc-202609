  md: "```\nwhole_genome <- csaw::windowCounts(\n  bam_file,\n  bin = TRUE,\n  filter\
    \ = 0,\n  width = 100,\n  param = csaw::readParam(\n  minq = 20,\n  dedup = TRUE,\n\
    \  pe = \"both\"\n)\ncolnames(whole_genome) <- c(\"h17\")\n```\n\n+   2. Extract\
    \ needed data from SummarizeExperiment:\ncounts <- assay(whole_genome, [1])\n\n\
    +   3. Work out a lower count threshold and set windows with lower counts to NA:\n\
    min_count <- quantile(counts, 0.1) [[1]]\ncounts[counts < min_count] <- NA\n\n\
    +   4. Double the counts of a window in the middle - our high count region:\n\
    n <- length(counts)\ndoubled_windows <- 10\nleft_pad <- floor(n / 2) - doubled_windows\n\
    right_pad <- n - left_pad -doubled_windows\nmultiplier <- c(rep(1, left_pad),\
    \ rep(2,doubled_windows),\nrep(1, right_pad))\ncounts <- counts * multiplier\n\
    \n+   5. Calculate the mean and ratio to in each window, then plot it:\nmean_cov\
    \ <- mean(counts, na.rm=TRUE)\nratio <- matrix(log2(counts / mean_cov), ncol =\
    \ 1)\nplot(ratio)\n\n+   6. Build SummarizedExperiment with the new data and the\
    \ row data of the old:\nse <- SummarizedExperiment(assays=list(ratio), rowRanges=\n\
    rowRanges(whole_genome), colData = c(\"CoverageRatio\")\n\n+   7. Create a region\
    \ of interest and extract coverage data:\nregion_of_interest <- GRanges(\nsegmentames\
    \ = c(\"NC_000017.10\"),"
