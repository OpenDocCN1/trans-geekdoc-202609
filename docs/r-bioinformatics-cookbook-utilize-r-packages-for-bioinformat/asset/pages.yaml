    expressed genes is set to prop_de, the log fold change ratios are set to finite_log2fc,
    and the estimated parameter values are set to params. The result is assigned to
    de_opts.


    num_replicates is then defined as a vector with values of 3, 6, 12, and 18.


    In step 4, the simulateDE() function from powsimR is used to run the simulation
    with the options specified in de_opts. The method for identifying differentially
    expressed genes is edgeR-LRT, the normalization method is specified as TMM, and
    verbosity is turned off. The result is assigned to simDE.


    In step 5, the evaluate() function from powsimR is used to evaluate the results
    of the simulation stored in simDE. The type of adjustment is specified as adjusted,
    the multiple test method is specified as the Benjamini-Hochberg procedure, the
    normal alpha level is set to 0.1, the data is stratified by mean expression level,
    no filtering is applied, the first stratum is used for filtering, the target for
    evaluation is log fold change, and the delta value is set to 0. The result is
