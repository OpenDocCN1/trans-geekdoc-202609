  md: '# Performing Quantitative RNA-seq


    Those two steps show how to create, then use, the function.


    # How it works...


    In step 1, a custom filter function called custom_filter is created in R. The
    function takes four parameters: design is a matrix describing the design of the
    experiment, row is a vector of counts for a given gene, min_reads is the minimum
    number of reads required for gene to be considered, and min_prop is the minimum
    proportion of samples in which a gene must be present. The function applies a
    logical test to the design matrix that tests if, for each column, the maximum
    proportion of samples in which a gene is present is equal to 1 or if the basic
    filter function, which takes the row, min_reads, and min_prop returns true. If
    either of the two conditions is true, the function returns true and the gene will
    be considered.


    The custom filter function is used to filter genes that do not meet the specified
    criteria. The function checks if the maximum proportion of samples in which a
    gene is present is equal to 1 across all columns of the design matrix. If this
    is true, the gene is considered in all samples and is kept. If this is not the
    case, the basic filter function is applied to the gene, which checks if the gene
    is present in at least the minimum proportion of samples and if it has at least
    the minimum number of reads. If these criteria are met, the gene is kept; otherwise,
    it is removed. This allows us to filter the genes in a way that is tailored to
    the specific needs of the experiment, rather than using the default filter function
    in the sleuth package.


    In step 2, the custom filter function is used in the sleuth_prep() function to
    prepare the data. The sleuth_prep() function returns a S4 DataFrame, a formula
    describing the design of the experiment, and a filter_arg argument, which is used
    to specify the custom filter function. The custom filter is passed to the soDesign
    matrix and the x vector of counts for a given gene as input. The default values
    of the function are set to match those in Sleuth, but they can be changed, depending
    on the specific needs of the experiment.


    # Analyzing splice variants with SGSeq


    Alternative splicing is a process by which different variants of a gene are produced
    from a single primary transcript. This process allows you to generate multiple
    proteins from a single gene, increasing the functional diversity of the genome.
    Alternative splicing can be regulated by different mechanisms, including cis-acting
    elements in the primary transcript and trans-acting factors that bind to these
    elements.


    Analyzing alternative splicing in genomics can be beneficial in several ways,
    allowing you to understand the genetic basis of disease. Many diseases are caused
    by mutations in genes that lead to changes in protein function. Alternative splicing
    can create different variants of a protein with different functions, and understanding
    how these variants are regulated can provide insights into disease mechanisms.
    The SGSeq R Bioconductor package can be used to help you analyze alternatively
    spliced transcripts. This package is a flexible tool for analyzing RNA-Seq data
    as it can detect alternative'
