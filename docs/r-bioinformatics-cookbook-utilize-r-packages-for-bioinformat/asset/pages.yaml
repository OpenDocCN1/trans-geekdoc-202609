  md: "# Novel feature detection in proteins\n\nSometimes, we'll have a list of protein\
    \ sequences that have come from some analysis or experiment that are in some way\
    \ biologically related. We wish to determine the parts of those proteins that\
    \ are responsible for the action. Domain and motif finding, as we've done in the\
    \ preceding recipes, can only be helpful if we see the domains before or the sequence\
    \ well conserved or statistically over-represented. A different approach is to\
    \ try machine learning, in which we build a model that can classify our proteins\
    \ accurately and use the properties of that to show which parts of the proteins\
    \ result in the classification. We'll take that approach in this recipe by training\
    \ a support vector machine (SVM).\n\n# Getting ready\n\nFor this recipe, we'll\
    \ need the Kebabs and Biostrings Bioconductor packages, as well as the e1071 and\
    \ readr packages. We'll also need two data files that are provided in the rbioinfocookbook\
    \ package and will be extracted using the fs package. The data files represent\
    \ 170 Escherichia coli proteins, for which the STRING database (https://string-db.org)\
    \ provides evidence that these proteins interact with the protein pfo. These are\
    \ all positive training examples. 170 E. coli proteins have been randomly selected\
    \ but have no evidence of interaction with pfo. The ecoli_protein.fa.file is a\
    \ single-column text file that describes the class of each protein, using a 1\
    \ for a pfo interactor and a -1 for other. Note that the row index of the class\
    \ file matches the protein index in the sequence file.\n\n# How to do it...\n\n\
    We can use machine learning for novel feature detection in proteins by performing\
    \ the following steps:\n\n+   1. Load the necessary libraries and input files:\n\
    \n```\nlibrary (kebabs)\nlibrary (Biostrings)\nsequence_file <- fs::path_package(\n\
    \  \"extdata\",\n  \"ecoli_proteins.fa\",\n  package = \"rbioinfo\"\n)\nseqs <-\
    \ readAAStringSet(sequence_file)\n\nclass_file <- fs::path_package(\n  \"extdata\"\
    ,\n  \"ecoli_protein_classes.txt\",\n  package = \"rbioinfo\"\n)\n```"
  merge: -1
  img_proc: true
