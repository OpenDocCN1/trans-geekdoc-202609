  md: '# Functional Programming with purr and base R


    Having established the pattern of using mutate and map() to tidy the complex object
    to a dataframe. In step 3, we use the broom::tidy() to turn the lm() object into
    a tibble (a type of dataframe). The nested dataframe looks like this:


    ```

    ## A tibble: 3 x 4

    ## model tidy_model

    ## cyl data <list>

    ## <dbl> <list>

    ## #1 6 <tildeble [7 x 10]> <lm> <tibble [2 x 5]>

    ## #2 4 <tildeble [11 x 10]> <lm> <tibble [2 x 5]>

    ## #3 8 <tildeble [14 x 10]> <lm> <tibble [2 x 5]>

    ```


    Step 4 uses the unnest() function to return everything to a simpler dataframe;
    the second argument, tidy_model, is the column we wish to unpack. We end up with
    the following result:


    ```

    ## A tibble: 6 x 8

    ## model term estimate std.error

    ## cyl data p.value

    ## <dbl> <list> <dbl> <dbl>

    ## <chr>

    10> 6 <tildeble [7 x

    <lm> (Intercept) 28.4 4.18 6.79 0.00105

    2 6 <tildeble [7 x

    <lm> wt -2.78 1.33 -2.08 0.0918

    3 4 <tildeble [11 x 10]>

    <lm> (Intercept) 39.6 4.35 9.10 0.0000777

    4 4 <tildeble [11 x 10]>

    <lm> wt -5.65 1.85 -3.05 0.0137

    5 8 <tildeble [14 x 10]>

    <lm> (Intercept) 23.9 3.01 7.94 0.0000405

    6 8 <tildeble [14 x 10]>

    <lm> wt -2.19 0.037 -2.9 0.0118

