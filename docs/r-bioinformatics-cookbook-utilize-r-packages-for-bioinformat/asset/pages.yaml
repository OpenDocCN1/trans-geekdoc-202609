  md: "```\nbeamer:\n  incremental: true\n  theme: AnnArbor\n  colortheme: lily\n\
    ```\n\n+   5. Render from the command line:\n\n```\nquarto render presentation.qmd\n\
    ```\n\nThis should generate a presentation document.\n\n# How it works...\n\n\
    The recipe is quite straightforward, though there are some new syntax members\
    \ here. In step 1, we create a basic slide; each slide is created by a second-level\
    \ heading (recall that in Markdown, this is ##). Our first slide describes our\
    \ method. It is implemented as an incremental list; the three delimiters (:::)\
    \ the beginning and end of the list, and the .incremental tagged block marks this\
    \ as an revealed list that will display one item at a time (.nonincremental is\
    \ also available)\n\nIn step 2, we create a second slide with R. The output is\
    \ a plot, and that is shown, by setting the eval=FALSE R block option, we can\
    \ stop the code from passing through the eventual presentation.\n\nIn step 3,\
    \ we create a more complicated slide with a two-column layout. The four delimiters\
    \ mark the limits of the column layout, and the three colon delimiters the content\
    \ of each column. We use the width option to set the relative widths of each column.\
    \ The columns act as an independent lists; the left column prints the plot, and\
    \ the right column shows some model code and its result (note the eval option\
    \ is not set this time). At the very bottom, we use the three-colon-delimited\
    \ .notes tag to add some notes that only the presenter will see.\n\nNow that all\
    \ slides are defined, we can set the configuration YAML. This is shown in step\
    \ 4, and the text here go at the top of the file. The presentation title and author\
    \ are set here, and the options for each presentation system are set. The incremental\
    \ turns on incremental lists. The theme lets you select one of the built-in themes\
    \ in Reveal.js and Beamer. The reference-doc tag lets you specify a reference\
    \ PowerPoint PPTX file from which to take styles, as we saw with rendering Word\
    \ in an earlier recipe. If you don't want to render formats, simply delete the\
    \ ones you don't want.\n\nFinally, in step 5, we render on the command line. The\
    \ output will go to a .pptx file for PowerPoint, a .html file for Reveal.js, and\
    \ a .pdf file for Beamer."
