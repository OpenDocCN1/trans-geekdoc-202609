    # Finding enriched KEGG pathways


    Kyoto Encyclopedia of Genes and Genomes (KEGG) is a bioinformatics resource that
    integrates genomic, chemical, and system functional information. KEGG contains
    a comprehensive database of molecular networks that represent various biological
    systems, such as metabolic pathways, regulatory pathways, and signaling pathways.


    KEGG is widely used in bioinformatics analysis to understand the relationships
    between genes, proteins, and other biomolecules in biological systems. It provides
    a wealth of information on the molecular mechanisms of various biological processes,
    such as metabolism, signal transduction, and disease pathways. Researchers can
    use KEGG to analyze their datasets, such as gene expression data or protein-protein
    interaction data, and identify the key pathways that are affected by their experiments.


    In this recipe, we''ll look at how to examine a gene list derived from experiments
    in order to identify pathways using the free-to-academics website.


    # Getting ready


    We''ll use the clusterProfiler package and data in the rbioinfcookbook package.
    Some of the code accesses external web resources, so we''ll need an active internet
    connection too.'
