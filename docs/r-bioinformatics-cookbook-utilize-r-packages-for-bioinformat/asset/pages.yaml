- pgno: 4
  md: '# Contributors


    # About the author


    Professor Dan MacLean has a PhD in molecular biology from the University of Cambridge
    and gained postdoctoral experience in genomics and bioinformatics at Stanford
    University in California. Dan is now an honorary professor at the School of Computing
    Sciences at the University of East Anglia. He has worked in bioinformatics and
    plant pathogenomics, specializing in R and Bioconductor, and has developed analytical
    workflows in bioinformatics, genomics, genetics, image analysis, and proteomics
    at the Sainsbury Laboratory since 2006. Dan has developed and published software
    packages in R, Ruby, and Python, with over 100,000 downloads combined.


    I want to thank everyone involved with the Sainsbury Laboratory; working with
    you all has helped me develop the knowledge that has gone into this book.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# About the reviewer


    Dr. Swarna Kanchan has a doctorate in Bioinformatics with over 15 years of experience
    in research and academics. He is currently a Staff Scientist at the Department
    of Biomedical Sciences, Joan C. Edwards School of Medicine, Marshall University,
    Huntington, West Virginia, USA. He was a Postdoctoral Fellow at INRIA Bordeaux,
    France; Nencki Institute of Experimental Biology, Warsaw, Poland and Boise State
    University, Boise, Idaho, USA. He also worked as an Assistant Professor at Presidency
    University, Bengaluru, India. He has several high-impact research articles, book
    chapters and books to his credentials.


    Support in the review process from Dr. Minu Kesheri, and the research associate
    at Marshall University, USA, is highly acknowledged.'
