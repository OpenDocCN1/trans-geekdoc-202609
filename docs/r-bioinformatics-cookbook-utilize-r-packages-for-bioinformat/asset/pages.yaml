    # Retrieving gene and genome annotations from BioMart


    Once a draft of a genome sequence is prepared, a lot of bioinformatics work goes
    into finding the genes and other functional features or important loci that are
    in a genome. These are numerous, difficult to perform and verify, typically take
    lots of expertise and time, and are not something we want to repeat. Genome project
    consortia will typically share their annotations in some way, through public databases
    of sort. BioMart is a common data structure and computational interface through
    which annotation data is made available. In this recipe, we''ll look at how to
    programmatically access such databases so we can get annotations for genes that
    we are interested in.


    # Getting ready


    For this recipe, we''ll need the biocRt Biductor package and a working internet
    connection. We''ll also need to know the BioMart server to connect to – there
    are about 40 worldwide, providing information about all sorts of genomes. The
    most widely accessed are the Ensembl databases, and these are the defaults in
    this package. The code we''ll develop will apply to any of the BioArts with a
    little modification of table names and URLs as appropriate.


    # How to do it...


    Retrieving gene and genome annotations from BioMart can be done using the following
    steps:


    +   1. List marts in the selected database, gramene:


    ```

    library (biomaRt)

    ListMarts (host = "https://ensembl.gramene.org")

    ```


    +   2. Create a connection to the selected mart:


    ```

    gramene_connection <- useMart(biomart = "ENSEMBL_MART_PLANT",

    host = "https://ensembl.gramene")

    ```


    +   3. List datasets in that mart:


    ```

    data_sets <- listDatasets(gramene_connection)

    head (data_sets)

    data_set_connection <- useMart("alyrata_eg_gene",

    biomart = "ENSEMBL_MART_PLANT",

    host = "ensembl.gramene.org")

    ```'
  merge: -1
  img_proc: true
