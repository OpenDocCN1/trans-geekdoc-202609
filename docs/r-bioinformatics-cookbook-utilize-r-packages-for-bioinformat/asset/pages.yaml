- pgno: 33
  md: 'Using the devtools package to work with the latest non-CRAN packages 11


    The devtools R package is a collection of tools that make it easier to develop
    R packages. It includes functions for creating and installing source packages,
    building and reloading documentation, and more. Additionally, it provides functionality
    to check packages, build documentation, manage package dependencies, and test
    package functionality. It allows users to easily share and collaborate on R package
    development, making it a popular choice among R Developers. We will briefly discuss
    its for installing packages from sources that have not been uploaded to CRAN.
    Often, this will be newer versions of packages that are on CRAN but the developer
    has added new features or fixes that have not yet made it into a suitable form
    for the main library.


    # Getting ready


    For this recipe, we''ll need the devtools package and we will use some particular
    branches and pull requests (PRs) of the rbioinfcookbook package. Remember to pull
    the default version back at the end after you run through the recipe for the full
    functionality of package.


    # How to do it...


    Working with devtools to install packages follows a basic pattern; we give a repo/username
    argument to manage this like this:


    +   1. Install a source package that lives on GitHub:

    ```

    devtools::install_github("danmaclean/rbioinfcookbook")

    ```


    +   2. Install the example_devtools_branch:

    ```

    library(rbioinfcookbook)

    # The next line won''t work...

    rbioinfcookbook::function_from_branch()


    # Now it will

    detetach("package:rbioinfcookbook", unload=TRUE)

    devtools::install_github("danmaclean/rbioinfcookbook@example_devtools_branch")


    rbioinfcookbook::function_from_branch()

    ```


    +   3. Install a specific pull request:

    ```

    # The next line won''t work...

    rbioinfcookbook::function_from_PR()


    # Now it will

    detach("package:rbioinfcookbook", unload=TRUE)

    devtools::install_github(")

    ```'
  merge: -1
  img_proc: true
- pgno: 34
  md: "```\ndamnaclean/rbinfoinfbook#1\"\n)\n  rbinfoinfbook::function_from_PR()\n\
    ```\n\n+   4. Clean up using the package from GitHub, R memory and then from disk:\n\
    \n```\ndetach(package:rbinfoinfbook\", unload=TRUE)\n  remove.packages(\"rbinfoinfbook\"\
    )\n```\n\n+   5. Restart and put back the default version of the package:\n\n\
    ```\ninstall.packages(\"damnaclean/rbioinfbook\")\n```\n\nThis process works that\
    \ us installing and replacing the rbioinfbook package to find functions that only\
    \ exist in particular branches of the GitHub repository.\n\n#  How it works...\n\
    \nIn step 1, we simply install a source package that resides on GitHub, with the\
    \ install_github() function. The syntax of the argument function is username/repo.\
    \ By default, the function pulls and installs the latest main branch update. If\
    \ you already initialized renv for working on a project, devtools will install\
    \ it into the renv library, though that isn't mandatory.\n\nIn step 2, we go a\
    \ step further and install from a specific branch – example_devtools_branch –\
    \ which adds a function that is not in the main branch, function_from_branch()\
    \ (note for cleanliness in memory, we use the detach() function to clear out the\
    \ previously loaded version from each time). We test the function before installation\
    \ and after to verify that we have the new code. At some points in installations,\
    \ R databases of packages can lose track. Restarting usually fixes this, so if\
    \ it doesn't appear to work at this stage, first using detach() again, and if\
    \ it doesn't work, try restarting R.\n\nIn step 3, we specify a pull request from\
    \ which to install. This likely represents very experimental code that the package\
    \ maintainers haven't incorporated into their package, but when you need the bleeding\
    \ edge case, this is the way to get it. Here, #1 indicates the number of the specific\
    \ pull request to get, which provides the function_from_PR function. Again, we\
    \ test it before and after installation.\n\nIn step 4, we clean up. The installation\
    \ and uninstallation of packages can confuse R. If you've used library() at any\
    \ point, the code will be in memory and needs to be removed – that's what the\
    \ detach function does. Then, we actually remove the package from the disk.\n\n\
    In step 5, we bring the package back to parity and install the full version, which\
    \ is good for all the other recipes in this book."
