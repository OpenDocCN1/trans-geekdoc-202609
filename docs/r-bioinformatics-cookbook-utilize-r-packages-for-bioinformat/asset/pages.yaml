    ## <dbl> <dbl>

    ## 1 0 4.61

    ## 2 0.693 5.30

    ## 3 1.10 5.70

    ```


    A function called map_dfr ( ) for row binding exists.

    Finally, we use walk ( ), which iterates over the dataframe, but does nothing
    to it. It returns the input completely unchanged. The usefulness, though, is in
    that it allows us to carry out a side-effect action (such as writing to file or
    printing to screen) for each element without messing up the data.'
