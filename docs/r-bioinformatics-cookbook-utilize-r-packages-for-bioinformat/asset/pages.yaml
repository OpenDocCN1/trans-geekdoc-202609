- pgno: 227
  md: '# #8 Searching Gene and Protein Sequences for Domains and Motifs


    The sequences of genes, proteins, and entire genomes hold clues to their function.
    Repeated subsequences or sequences with strong similarities to each other can
    be clues to things such as evolutionary conservation or functional relatedness.
    Sequence analysis for motifs and domains is a core technique in bioinformatics.
    Bioconductor contains many packages for analyzing genes, proteins, and genomes.
    In this chapter, you will learn how to use Bioconductor to analyze sequences for
    features of functional interest, such as de novo DNA motifs and known domains
    from widely used databases. You''ll learn about some packages for kernel-based
    machine learning to find protein sequence features. You will also learn about
    large-scale alignment techniques for many sequences or very long sequences. You
    will use Bioconductor and other statistical learning packages.


    In this chapter, we will cover the following recipes:


    +   * Finding DNA motifs with universalmotif

    * Finding protein domains with PFAM and bio3d

    * Finding InterPro domains

    * Finding transmembrane domains with tmhmmer and pureseqTM

    * Creating features of protein domains using drawProteins

    * Performing multiple alignments of proteins or genes

    * Aligning genomic length sequences with DECIPHER

    * Novel feature detection in proteins

    * 3D structure protein alignment in bio3d'
  merge: -1
  img_proc: true
