    # Aligning genomic length sequences with DECIPHER


    Aligning sequences longer than genes and proteins, such as from assembly projects,
    chromosomes, or whole genomes is a tricky task. For tasks, we need different techniques
    than those for short sequences. The longer the sequences, the harder they are
    to align. Long alignments are especially costly in terms of the computational
    time. The algorithms that are effective on short sequences take up exponentially
    time with increasing sequence length. Performing longer alignments generally starts
    with finding short anchor alignments and working the long alignment out from there.
    We typically end up with blocks of stony regions that match between the different
    sequences.


    In this recipe, we will look at the DECIPHER package for genome length alignments.
    We''ll use chloroplast genomes - small organic genomes of about 150 Kbp that are
    pretty well conserved as our sequences of interest.


    # Getting ready


    For this recipe, we will need the DECIPHER Bioconductor package and the plastid_genomes.fa
    file, which can be found in the rbinfoinfcookbook package.


    # How to do it...


    Aligning genomic length sequences with DECIPHER can be done by performing the
    following steps:


    +   1. Load in the necessary libraries and genome sequences:


    ```

    library(DECIPHER)

    genomes_file <- fs::path_package(

    "extdata",

    "plastid_genomes.fa",

    package = "rbinfoinfcookbook"

    )

    long_seqs <- readDNAString(genome_file)

    long_seqs

    ```'
  merge: -1
  img_proc: true
