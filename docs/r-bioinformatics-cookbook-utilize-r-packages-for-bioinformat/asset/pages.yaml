    # Using logistic regression to classify the relative likelihood

    of two outcomes


    **Logistic regression** is a statistical modeling technique used to predict categorical
    outcomes, particularly

    in binary classification situations where the outcome can take one of two possible
    values. It aims to find

    the relationship between a set of input variables and the probability of a certain
    outcome occurring.

    Logistic regression estimates the relationship between these input variables and
    the probability of

    outoutcome. It tries to find the best-line or curve that represents this relationship.
    Unlike linear

    regression, which predicts continuous values, logistic regression predicts the
    probability of a specific

    outcome. We set a probability threshold (usually 0.5) to decide the class label.
    If the predicted

    probability is above the threshold, the outcome is predicted as one class, and
    if it is below the threshold,

    out outcome is predicted as the other class. Once the model is trained, it can
    be used to predict

    outcome for new instances by calculating the probabilities based on the input
    variables and applying

    the probability threshold.


    The logistic regression model is trained using maximum likelihood estimation,
    which finds the\optimal coefficients for the input variables that maximize the
    likelihood of the observed outcomes

    based on the predicted probabilities. This method takes more parameters than the
    k-NN we find

    previously, so we will also take advantage of mlr3''s tuner objects, let us iterate
    through

    various values to find the best set for our data. That will be the object of this
    lesson: to assess the model

    performance at different parameter values so that we can find the best combinations
    with which to

    build a final model.


    # Getting ready


    For this recipe, we''ll use the mlr3 package, its accessory packages mlr3learners,
    mlr3viz, mlr3

    lr3tuning, and the data package mlbench.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# How to do it...


    Performing a logistic regression and optimizing it using tuner objects can be
    done as follows:


    +   Set up the task, learner, and resampler:


    ```

    library (mlr3)

    library (mlbench)

    library (mlr3learners)

    data ("BreastCancer")


    selected <- BreastCancer[c("Cl.thickness","Cell.size","Cell.

    shape","Marg. adhesion","Epith.c.size","Bl.chromatin","Normal

    nucleoli","Mitoses","Class\)]


    task <- as_task_classify(selected, target="Class")

    learner <- lrn("class.log_reg")

    resamp_kcv <- rsmp("cv")

    resamp_kcv$param_setValues = list(folds = 3)

    measure <- msr("class.acc")

    ```


    +   Inspect the parameters we can optimize:


    ```

    as.data.table(learner$param_set)

    ```


    +   Set dynamic limits on parameters:


    ```

    library(mlr3tuning)

    learner$param_set$set_values(epsilon = to_tune(0, 10),

    maxit = to_tune(1, 10) )

    ```


    +   Decide how the optimization task should terminate:


    ```

    terminate <- trm("run_time", secs = 5)

    ```


    +   Compile the input into a tuning object:


    ```

    tunit <- ti(

    task = task,

    learner = learner,

    resampling = resamp_kcv,

    measures = measure,

    terminator = terminate

    )

    ```'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Machine Learning with mlr3


    6. Run the tuner:


    ```

    tuner <- tnr("random_search")

    tuner$optimize(tunit)

    tunit$result

    ```


    7. Plot the result metric against the values of the parameters chosen:


    ```

    library(mlr3viz)

    apoplot(tunit)

    ```


    This code lets us build and evaluate the logistic regression.


    # How it works...


    This recipe condenses the familiar creation of the task, learner, resampling strategy,
    and evaluation measure into step 1. The data are loaded and the objects are created,
    specifying a logistic regression class.log_reg learner and a three-fold cross-validation
    resampling (cv). The measure on which we assess the models is singular and specified
    by the mlr() function as classification accuracy (class.acc). All will be used
    repeatedly as we go through the different values of parameters for the logistic
    regression.


    With the learner set up, we can examine to see what parameters could be optimized.
    We do that in step 2 by coercing the object to a data.table. The output (truncated
    a little) looks like this:


    ```

    special_vals

    ## 1: dispersion

    ParamUty NA NA Inf FALSE <list [0]>

    ## 2: epsilon

    ParamDbl -Inf Inf Inf FALSE <list [0]>

    ## 3: etastart

    ParamUty NA NA Inf FALSE <list [0]>

    ## 4: maxit ParamDbl -Inf Inf

    ```


    We can see that the epsilon and maxit parameters are double numbers ParamDbl and
    can take values from +/- infinity. We will optimize these in the example.


    In step 3, we use the package mlr3 to access tuning/optimization objects and functions
    set up the selected parameters in the learner using learner$param_sets$$set_values(),
    to which we pass the range of possible values we wish to store using to_tune()
    functions. This means the values here will be changed each run according to our
    chosen optimization scheme, which will be defined later.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Using logistic regression to classify the relative likelihood of two outcomes


    In step 4, we need to define when the optimization will terminate. Optimizations
    can run over thousands of combinations of parameters, so it''s a good idea to
    decide how it should end. In mlr3, terminator objects define the stopping criteria.
    Use the $trm()$ function with the $run\_time$ criteria to set five seconds for
    this brief example. Many other stopping criteria, including n iterations and failure
    to improve after $n$ attempts, can be set up. Check the mlr3 terminator documentation
    for a list.


    By step 5, we have all the information needed to define the task to run at each
    tuning/optimization step. The objects we created by using the $ti()$ into a container
    can create a tuning problem that represents the whole set of things we need to
    build and tune the learner.


    The tuning/optimization strategy is decided next. There are many ways to vary
    the values of the parameters. We can choose to do it completely at random via
    a structured grid search that tries every value in a range, or follow genetic/evolutionary
    strategies that explore the space in a targeted way. For simplicity in step 6,
    we use the tner function to randomly search. We then call the $optimize()$ function
    on the tuner object, which runs the optimization on the tuning problem we set.
    The stopping criterion was to stop after five seconds, so the optimization should
    be quick. When it is done, the best model score metric is stored in the optimized
    tuning problem under $tuner\$result$, giving us an idea of the performance of
    the models.


    In order to see the effect of the parameters on the performance metric, we can
    use the $autoplot()$ function to generate a basic visualization. In step 7, we
    pass the tuner object to the plotter and get something similar to Figure 1.


    ![](img/dd0d7d9aaacf496c4d1d0e31d83783b3_323_0.png)


    Figure 11.3 – A visualization of the effect of varying the of two parameters in
    a learner on classification accuracy'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Machine Learning with mlr3


    We can see the values of the parameters that give the best classification accuracy,
    and we can use the values in subsequent model builds.


    # See also


    We selected a simple optimization strategy here. There are other more involved
    and perhaps more applicable ones. Check the documentation at https://mlr3book.mlr-org.com/optimization.html.


    # Classifying using random forest and interpreting it with iml


    Random forest is a versatile ML algorithm that can be used for both regression
    and classification tasks. It is an ensemble method that combines multiple decision
    trees to make predictions. Decision trees split the data based on the values of
    features to create subsets with similar target variables. Random forest combines
    multiple decision trees to create a more robust and accurate model. The algorithm
    randomly selects a subset of the training data (bootstrapping) and a subset of
    features at each tree''s node to create a diverse set of decision trees. The random
    subsets of training data are used to train individual decision trees in the forest.
    The bootstrapping technique allows each tree to have a slightly different variation
    of the data, reducing the risk of overfitting.


    Random forest assesses feature (variable) importance by evaluating how much each
    feature contributes to reducing error in the model. The feature importance values
    are calculated based on the average error weighted by the probability of that
    node. We can use this to interpret the model and assess which features are most
    informative. Model effectiveness can also be visualized with the receiver operating
    characteristic (ROC) curve. This is a graphical representation to assess the performance
    of a binary classification model. It illustrates the trade-off between the true
    positive rate and the false positive rate at various classification thresholds
    and provides insights into the model''s ability to discriminate between positive
    and negative classes, regardless of the chosen classification threshold. It allows
    you to assess the model''s sensitivity to different levels of specificity.


    In this recipe, we''ll build a RandomForest model in mlr3 that way we''ve done
    before and how to look at to perform a feature importance analysis and develop
    the ROC curve.


    # Getting ready


    We''ll need the mlr3, mlr3learners, mlbench, and ranger packages to build the
    model. We''ll also need the iml and DALExtra packages to run the model through
    feature importance and ROC curves.'
