    to that to happen. We first go and get the code from the repository on GitHub
    (https://github.com/TeamMacLean/beshr/blob/master/R/functions.R) and paste that
    into ChatGPT’s prompt box asking it for an explanation.


    In *step 2*, we can see the explanation provided (note that the one you get if
