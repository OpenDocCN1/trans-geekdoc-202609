    # Finding GO enrichment in an Ontology Conditional way with topGO


    The GO is a hierarchical ontology that describes the biological processes, molecular
    functions, and

    cellular components of gene products in a standardized way. The ontology is structured
    as a directed\acyclic graph (DAG) with three main categories: Biological Process
    (BP), Molecular Function (MF),

    and Cellular Component (CC).'
  merge: -1
  img_proc: true
- pgno: 301
  md: "Higher in the GO hierarchy, there are broader terms; for example, in the BP\
    \ category, terms such as biological regulation and cellular process exist. As\
    \ we move the hierarchy, the terms become more specific and narrower in scope,\
    \ and regulation of gene expression or protein localization to organelle more\
    \ specific terms within the BP category. Each term has parent terms and child\
    \ terms.\n\nThe hierarchical nature of the GO allows researchers to perform analyses\
    \ at different levels of specificity. A common need is to collapse similar terms\
    \ to a higher, more general term that captures them all. In this recipe, we'll\
    \ look at a couple of ways of automating with the topGO package. Specifically,\
    \ topGO implements the hierarchy-aware methods like elim and parent_child, as\
    \ described in Alexa et al. 2006 (Bioinformatics 22:1660) and Grossman et al.\
    \ 2007 (Bioinformatics 23:3024).\n\n# Getting ready\n\nFor this recipe, we'll\
    \ need the topGO Bioconductor package and some data in the rbioinfcookbook package.\n\
    \n# How to do it..\n\nHierarchy-aware GO analysis can be done as follows:\n\n\
    +   1. Prepare the sets of genes and GO annotations:\n\n```\nlibrary(rbioinfcookbook)\n\
    mo_ids <- unique(mo_go$`Gene stable ID`)\nngeneid2_go <- lapply(mo_ids, function(gene_id){\n\
    \  df <- dplyr::filter(mo_go, `Gene stable ID` == gene_id)\n  unique(df$`GO term\
    \ accession`)\n})\n\nnames(geneid2_go) <- mo_ids\n\nmo_exp_path <- fs::path_package(\n\
    \  \"extdata\",\n  \"mo_exp.csv\",\n  package = \"rbioinfcookbook\"\n)\nmo_exp\
    \ <- readr::read_csv(mo_exp_path)\n\ngene_list <- factor(as.integer(mo_ids %in%\
    \ mo_exp$gene_id))\nnames(gene_list) <- mo_ids\n```"
  merge: -1
  img_proc: true
- pgno: 302
  md: '2. Build the topGO object:


    ```

    library(topGO)

    topGO_data <- new("topGOdata",

    ontology = "MF",

    allGenes = gene_list,

    nodeSize = 3,

    annot = annFUN.gene2GO,

    gene2GO = geneid2_go

    ```


    3. Run tests:


    ```

    test_result_elim <- runTest(topGO_data, algorithm = "elim",

    statistic = "fisher")

    test_result_pc <- runTest(topGO_data, algorithm = "parentchild",

    statistic = "fisher")

    ```


    4. Create a combinedresults list:


    ```

    results <- GenTable(topGO_data,

    elim_fisher_pval = test_result_elim,

    pc_fisher_pval = test_result_pc,

    orderBy = "elim_fisher_pval",

    ranksof = "elim_fisher_pval",

    topNodes = 10)

    ```


    5. Plot the GO trees:


    ```

    showSigOfNodes(topGO_data, score(test_result_elim),

    firstSigNodes = 5,

    useInfo = "all")


    showSigOfNodes(topGO_data,

    score(test_result_pc),

    firstSigNodes = 5,

    useInfo = "all")

    ```


    This is all we need to perform the topology-aware GO analysis.


