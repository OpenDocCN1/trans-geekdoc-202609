  md: '# Further information


    Not all the recipes in this section have in R; some are command-line-based setups.
    I generally assume a bash terminal for these bits. Most macOS and Linux machines
    will have these available in a Terminal application. Windows users will likely
    not need these specific steps, though various packages for running a Linux subsystem
    on Windows exist if you need to search them.


    In R, it is normal practice to load a library and use functions directly by name.
    Although this can cause confusion when many packages are loaded at once and share
    names. To clarify which package and function I am using at a given moment, I will
    occasionally use the packageName:$functionName() convention.


    Sometimes, in the middle of a recipe, I will interrupt the code to dive into some
    output or to look at the structure of an object. When that happens, you''ll see
