  md: "# How to do it...\n\nWe can cluster with the following code\n\n+   1. Load\
    \ the data and run a PCA:\n\n```\n```r\nlibrary(factoextra)\nlibrary(Biobase)\n\
    library(rbioinfcookbook)\nexpr_pca <- prcomp(exprs(modencodeely.eset), scale =\
    \ TRUE,\ncenter=TRUE)\nfviz_screeplot(expr_pca)\n```\n```\n\n+   2. Extract the\
    \ principal components and estimate the optimal clusters:\n\n```\n```r\nmain_components\
    \ <- expr_pca$rotation[, 1:3]\nfviz_nbclust(main_components, kmeans, method =\
    \ \"wss\")\n```\n```\n\n+   3. Perform k-means clustering to visualize:\n\n```\n\
    ```r\nkmean_clus <- kmeans(main_components, 5, nstart=25, iter.\nmax=1000)\nfviz_cluster(kmean_clus,\
    \ data = main_components,\n  palette = RColorBrewer::brewer.pal(5, \"Set2\"),\n\
    \  theme = theme_minimal(),\n  main = \"k-Means Sample Clustering\"\n```\n```\n\
    \nThis code gives us the clustering we want.\n\n# How it works...\n\nIn step 1,\
    \ we load libraries, including the rbioinfcookbook library that provides us with\
    \ modencodeely.eset to work on. We use it in the Biobase function expr(), which\
    \ extracts the expression measurements as a rectangular matrix and passes that\
    \ to the prcomp() function, which performs PCA and returns a PCA object, expr_pca.\
    \ We then plot the PCA with the factoextra function fviz_screeplot() and see the\
    \ result in Figure 11:10."
