    We now have a dataframe with the model unpacked. Note that we should wish, we
    use normal tidyverse to remove the list-based column, column. The operations are
    all compatible with the pipe operator and can be combined into a single pipeline,
    without having to save intermediate steps as we have here.


    # See also


    The unnest () function will only work when the nested list-based column members
    are compatible and can be sensibly aligned and recycled, according to the normal
    rules. In many cases, this won''t be true, so you will need to manipulate the
    output with a function of your devising. For help, refer to the map family of
    functions, described in the Using map family of functions in purr recipe in this
    chapter.'
