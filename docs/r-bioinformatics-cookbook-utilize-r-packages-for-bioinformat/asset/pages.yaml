    and function I am using at a given moment, I will occasionally use the packageName::functionName()
    convention.


    Sometimes in the middle of a recipe, I will interrupt the dive into some intermediate
    output or to look at the structure of an object. When that happens, you''ll see
    a code block where each line begins with ## (double hash symbols). Consider the
    following command:


    ```

    letters [1:5]

    ```


    This will give you the following output:


    ```

    ## a b c d e

    ```


    Note that the output lines are prefixed with ##.


    # Using Markdown and Quarto for literate computation


    A common task in bioinformatics is writing out our results to communicate them
    to colleagues or to have a good record in our laboratory books (electronic or
    otherwise). A key skill is to make the work as reproducible as possible so that
    we can rerun it ourselves when we need to revisit it or someone else needs to
    replicate the process. One popular way to solve this problem is to use literate
    programming techniques and executable notebooks that are a mixture of human-readable
    text, analytical code, and computational output rolled into a single document.
    In R, the Markdown extension of the Markdown syntax and the Quarto command-line
    tool (and R package) allow us to combine code and text in what we create output
    documents in a variety of formats. In this recipe, we''ll look at the large-scale
    structure of a typical document that can be rendered into multiple formats with
    Quarto.


    # Getting ready


    We''ll need the Quarto command-line tool mentioned at the start of the chapter
    and a text editor. Optionally, you can install the R quarto package. The Markdown
    we create here should be saved into a file with a .qmd extension—for example,
    example_quarto.qmd.'
