- pgno: 99
  md: '# # 4

    Using Quarto to Make Data-Rich Reports, Presentations, and Websites


    Literate computing is the practice of embedding human-readable explanations and
    annotations within computer code, making it easier for both the author and developers
    to understand and reuse the code. The main goal of literate computing is to create
    readable, reusable code that can be understood not only by machines but by humans
    as well.


    One of the key tools for literate computing is Markdown. Markdown is a simple
    markup language that allows for the creation of easily readable documents that
    can be converted to Hypertext Markup Language (HTML) and other documents, including
    Word, for display on varied platforms. Markdown is easy to write and understand,
    even for non-technical users.


    R Markdown, a variant of Markdown with R in mind, provides a simple way to embed
    R code within a document, allowing narrative text and visualizations, to create
    a complete report. One of the main advantages of using R Markdown is that it makes
    easy to create reproducible reports. This means that others can run the same code
    and obtain the same results, which is essential for scientific and research work.
    R Markdown also allows for the creation of dynamic reports, as the code and results
    can be updated automatically when the underlying data changes.


    Another benefit of R Markdown is that it makes it easy to format and style the
    document, providing a range of customization options and the ability to use Cascading
    Style Sheets (CSS) and HTML to create a polished, professional-looking report.
    This is particularly useful for creating data-led reports and presentations, where
    the focus is on presenting information and insights in a clear and engaging way.


    Quarto is a multi-language open source scientific publishing system built on top
    of the Pandas format conversion that has very strong support for R Markdown and
    other language-literate computing systems, such as Jupyter in Python. In this
    chapter, we''ll take a long look at making full use of the features of Quarto
    for creating a long list of different document types with embedded dynamic code.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Using Quarto to Make Data-Rich Reports, Presentations, and Websites


    In this chapter, we will cover the following recipes:


    +   * Using Markdown and Quarto for literate computation

    * Creating different document formats from the same source

    * Creating data-rich presentations from code

    * Creating websites from collections of Quarto documents

    * Adding interactivity with Shiny


    # Technical requirements


    You will need to install Quarto, which can be done by selecting the relevant package
    for your operating system at this link: https://quarto.org/docs/get-started/


    +   1. Quarto has a dependency on LaTeX, but once Quarto is installed, it can
    install a version of that for you. To install that, use the following command:


    ```

    quarto install tiny tintex

    ```


    From the command line, after you''ve installed Quarto, all should be ready.

    To render, we will use the command-options, and I will make this explicit in each
    recipe. If you want to take advantage of Quarto''s integration into RStudio, you''ll
    need to make sure you have installed RStudio version 2022.07 or later, which has
    support in the integrated development environment (IDE) for Quarto. Install that
    from here: https://rstudio.com/products/rstudio/download/


    +   2. We will need to manage packages in a project-specific way. To use renv,
    you will first need to install the renv package. You can do this by running the
    following command in your R console


    ```

    install.packages("renv")

    ```


    +   3. Next, you will need to create a new renv environment for your project by
    running the following command:


    ```

    renv::init()

    ```


    This will create a new directory called .renv in your current project directory.


    +   4. You can then install packages with the following command:


    ```

    install.packages("<package name>")

    ```'
  merge: -1
  img_proc: true
