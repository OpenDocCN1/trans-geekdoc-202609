    ```


    Note that the answers are the same, but the output is different.


    In step 4, we use apply() over a dataframe - the iris data. By default, it works
    on columns when given a dataframe, applying the mean() function to each in. Note
    that the last two arguments (trim and na.rm) are not options for apply(), although
    it does look like it. In all these functions, the arguments after positions 1
    and 2 are applied to the code being run, so there are options for mean (). In
    the output, the column names are used as element names of the resulting list.
    With a simple list, as we get here, we use the unlist() function to convert the
    results to a vector, where possible. If names are present, the vector is named:


    ```

    unlist(list_from_data_frame)

