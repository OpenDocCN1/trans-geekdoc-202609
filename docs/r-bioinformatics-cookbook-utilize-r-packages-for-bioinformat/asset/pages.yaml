    # How it works...


    The code in this recipe is special in it must be run from an external document;
    it won''t run in the R Console. The compilation step runs the whole document,
    formats the marked-up text, runs the code, and inserts the result into an HTML
    document to create a unified output.


    In step 1, we create the YAML header that describes how the document should be
    rendered, including output format and a dynamic date, by running format on the
    output of Sys.time(). A global level 1 heading is created by the title declaration
    and forms a title.


    In step 2, we actually create some content; the first line is plain text and will
    pass into the rendered document as normal paragraph text. The section within the
    block marked by three backticks (```) is to be interpreted. Options for the block
    inside the curly brackets; { } means this should be an R code block (though other
    languages are supported, including Python and Bash). The code in the block is
    run in an isolated R session dedicated to the rendering of the document that is
    closed when rendering is done. Output is captured and inserted immediately after
    the code block that created it.'
