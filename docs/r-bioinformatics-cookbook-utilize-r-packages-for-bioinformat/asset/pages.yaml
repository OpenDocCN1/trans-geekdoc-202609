  md: "# How to do it...\n\nIn order to make a Quarto website from pre-existing Markdown\
    \ documents, we create a _quarto yaml file, put it in the same project folder\
    \ as our Markdown documents, and fill it with the configuration as follows:\n\n\
    +   1 Set up the Markdown documents:\n\n```\nws_path <- fs::path_package(\"extdata\"\
    , \"sample_website\",npackage=\"rbioinfocbook\")\nfs::dir_copy(ws_path, 'somewhere/on/your/system')\n\
    ```\n\n+   2 Create a _quarto.yml_ header:\n\n```\nproject:\n  type: website\n\
    \  output-dir: docs\n\nwebsite:\n  title: \"Bioinformatics Report\"\n  navbar:\n\
    \    left:\n      - href: index.qmd\n        text: Index\n      - contact.qmd\n\
    \nformat:\n  html:\n    theme: cosmo\n    css: styles.css\n    toc: true\n```\n\
    \n+   3 Render the site:\n\n```\nquarto render\n```\n\n+   4 Add sidebar navigation:\n\
    \n```\nsidebar:\n  search: true\n  contents:\n    section: \"Intro to Bioinformatics\"\
    \n    contents:\n      - 01-intro.qmd\n    section: \"Sequence Data and its uses\"\
    \n    contents:\n```"
