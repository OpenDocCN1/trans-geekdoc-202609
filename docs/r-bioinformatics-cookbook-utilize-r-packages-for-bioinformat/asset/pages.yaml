    # Getting Gene Ontology information for functional analysis from appropriate databases


    The Gene Ontology (GO) is a very requested vocabulary of annotation terms for
    genes and gene products that describe the biological process, molecular function,
    or cellular component of an annotated entity. As, the terms are helpful as data
    in gene-set enrichment analysis and other functional -omic approaches. In this
    recipe, we''ll look at how we prepare a list of gene IDs in a genomic region and
    the GO IDs and descriptions for them.


    # Getting ready


    We will just need the biomaRt package from Bioconductor and an internet connection.'
