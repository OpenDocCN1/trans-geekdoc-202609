  md: '# Estimating batch effects with SVA


    Batch effects occur in scientific experiments when there are systematic differences
    in the measurements that are made between different groups of samples, even though
    the samples themselves are biologically the same. These differences can be caused
    by various factors, such as differences in the lab conditions, the equipment used,
    or the time of the experiment. In RNA-Seq experiments, batch effects can occur
    when samples are run on different sequencing platforms or at different times,
    leading to differences in the read counts between samples. This can affect the
    statistical power of the experiment, as well as introduce bias into the analysis.


    One common approach to address batch effects in RNA-Seq experiments is to use
    the surrogate variable analysis (SVA) Bioconductor package. The SVA package uses
    a statistical method to identify and correct the batch effects by identifying
    sources of variation in the data that are likely to be caused by technical factors.
    The package works by finding a set of surrogate variables that are strongly correlated
    with the technical factors causing the batch effects. Then, it uses these surrogate
    variables as covariates in a linear model to control the batch effects. This allows
    the experimenter to remove any bias introduced by the technical factors and improve
    the statistical power of the experiment.


    The package uses principal component analysis to identify a most of the variability
    in the data. It also has a built-in method to identify which of these principal
    components are correlated with known technical factors, such as batch, plate,
    or chip number. Then, it uses these correlated principal components as covariates
    in the statistical model to adjust for the batch effects.


    It''s important to note that any adjustment made by the package is not based on
    the underlying biology of the samples but rather on the association between the
    technical factors and the data. The package allows you to better control the batch
    effect by removing any systematic error caused by these technical factors and
    improving the power of downstream statistical analysis. In this recipe, we''ll
    learn how to develop a model that can be used to better correct our data to account
    for batch effects.


    # Getting ready


    For this recipe, we''ll need the SVA package from Bioconductor. Once again, the
    data we will use from a set of three Arabidopsis plant samples infected with Pseudomonas
    syringae hrcC mutant (hurt) versus a set of control mock infection samples (mock).
    There are three replicates in each sample type. The data is provided in the rbionfcookbook
    package as a count matrix in the arab_infection object.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# How to do it...


    To estimate batch effects using SVA, follow these steps:


    +   1. Load the necessary libraries and data:


    ```

    library(sva)

    library(rbioinfcookbook)

    ```


    +   2. Filter out the rows with too few counts in some experiments:


    ```

    keep <- apply(arab_infection, 1, function(x) {length(x>3)}) >=2

    arab_filtered <- arab_infection[keep, ]

    ```


    +   3. Create the initial design:


    ```

    groups <- as.factor(rep(c("mock", "hrcc"), each=3))

    ```


    +   4. Set up the test and null models and run SVA:


    ```

    test_model <- model.matrix(-groups)

    null_model <- test_model[,1]

    svar <- svaseq(arab_filtered, test_model, null_model, n.sv=1)

    ```


    +   5. Extract the surrogate variables to a new design for downstream use:


    ```

    design <- cbind(test_model, svar$v)

    ```


    And that''s all we need to do to generate a new model design for statistical analyses.


    # How it works...


    In step 1, the sva and rbioinfcookbook libraries are loaded. These libraries provide
    functions for performing SVA and the data needed for this book, respectively.


    In step 2, the arab_infection is filtered to keep the rows that have at least
    two counts greater than 3 using the apply function. The function is used to apply
    a function to each row of arab_infection. The function that is being applied checks
    the number of counts in the row that are greater than 3 and only keeps the row
    if this number is greater or equal to 2. The filtered data is stored in the arab_filtered
    variable.


    In step 3, the groups variable is set as a factor, which is a categorical variable
    that can take on one of two values, mock or hrcc, which are repeated three times
    each.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'In step 4, the test_model variable is defined as a matrix that is created using
    the model.matrix function. This provides a matrix of predictors that is used as
    a design matrix for a linear model. This test_model variable is defined as a linear
    combination of the groups variable, which is a categorical variable. The null_model
    variable is defined as the first column of the test_model matrix. The svaseq function
    is used to perform surrogate analysis on the filtered data, arab_filtered, with
    the test_model and null_model matrices as input, and the number of surrogate variables
    is set to 1. The output of this function is stored in the svar variable.


    In step 5, the design variable is created by combining the test_model variable
    and the svar variable using the cbind function. The svar variable contains the
    surrogate variables that were generated in step 4, and it is added as additional
    columns to the test_model matrix, creating the final design variable. This can
    be used in downstream analysis, such as a linear model used in packages such as
    edgeR or DESeq2, to incorporate the information from the surrogate variables.


    # Finding allele-specific expression with AllelicImbalance


    Allele-specific expression ASE refers to the differential expression of alleles
    (different in a diploid organism). It occurs when one allele is expressed more
    or less than the other allele, resulting in an imbalance of expression. ASE can
    occur in both coding and non-coding regions of the genome and can have a significant
    impact on the phenotype of an organism. Analyzing ASE can help with identifying
    genetic variations that contribute to the development of diseases such as cancer
    and inherited disorders.


    The R Bioconductor AllelicImbalance package can be used to analyze ASE data. This
    package provides a set of tools for identifying, quantifying, and visualizing
    ASE sequencing data. The package can be used to quantify ASE at both the gene
    and transcript level and identify differentially expressed alleles. Additionally,
    AllelicImbalance can help identify the genomic regions that are likely to be associated
    with ASE. The package can read in sequencing file formats, process the data, and
    generate a set of ASE-related metrics, such as ASE p-value, ASE fold-change, and
    others.


    It can also plot ASE-related visualizations to help in data exploration and interpretation,
    as ASE plots, allele imbalance plots, box plots, and more. These visualizations
    can be very useful for identifying potential ASE events or even potential allele
    imbalance events. These events could be further analyzed to explore the underlying
    biological mechanisms that lead to ASE. This package is widely used in genetics,
    genomics, and functional genomics research and has been applied to study many
    different organisms and biological systems.


    In this recipe, we''ll take a look at a method for determining which of the variants
    of a transcript may have preferential expression in different samples. The reads
    come from different BAM files and the variants must already be known. This implies
    that you already carried out a read alignment and a variant call step and per
    sample BAM and VCF files.'
  merge: -1
  img_proc: true
