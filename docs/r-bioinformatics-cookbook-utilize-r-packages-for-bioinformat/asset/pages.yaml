  md: "# Customizing plots with ggasy\n\nOne of the key aspects of customizing plots\
    \ in ggplot2 is the theme () function, which allows users to customize elements\
    \ of the plot' overall appearance. Customizing plots in ggplot2 can be a littleintuitive.\
    \ Although the theme () is powerful, it does require the user to manually specify\
    \ each element of the plot, such as axis labels, titles, colors, and shapes. The\
    \ ggplot package, built on top of ggplot, aims to make plot customization more\
    \ accessible by providing a simpler, more intuitive syntax for many common customization\
    \ tasks. ggasy provides a set of simple wrapper functions around theme () that\
    \ make important things a lot easier to remember. With this recipe, we'll look\
    \ at customizing labels, legends, and axes in a plot created initially in ggplot2.\n\
    \n# Getting ready\n\nWe'll need the ggplot2, ggasy, and palmerpenguins packages.\n\
    \n# How to do it...\n\nWe can customize a plot as follows.\n\nMake a base plot:\n\
    \n```\nlibrary(ggplot2)\nlibrary(ggasy)\nlibrary(palmerpenguins)\n```\n\n```\n\
    p <- penguins | \ndplyr::filter(!is.na(sex)) | |\nggplot() + \n  aes(x = species,\
    \ y = bill_length_mm) + \n  geom_boxplot(aes(fill = sex),\n               position\
    \ = position_dodge(width = 0.75)) + \n  geom_dotplot(\n    aes(fill = sex),\n\
    \    binaxis = 'y',\n    stackdir = 'center',\n    method = \"histodot\",\n  \
    \  position = position_dodge(width = 0.75),\n    alpha = 0.5,\n    dotsize = .5\n\
    \  ) +\n  theme_minimal()\n```\n\nCustomize its appearance"
  merge: -1
