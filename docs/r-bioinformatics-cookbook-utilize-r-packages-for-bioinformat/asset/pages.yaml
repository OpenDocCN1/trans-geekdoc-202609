  md: '# Analyzing Gene Annotations


    Large-scale model organism sequencing projects, such as the Human Genome Project
    or the 1001 plant genomes sequencing projects, have made a huge amount of genomics
    data publicly available. Likewise, open-access data sharing by individual laboratories
    has made the raw sequencing data of genomes and transcriptomes widely available
    too. Working with this data programmatically can mean having to parse or bind
    locally some seriously large or complicated files. Much effort has gone into making
    these resources accessible as possible through APIs and other queryable interfaces,
    such as BioMart. In this chapter, we will look at some recipes that will allow
    us to search annotations without downloading whole genome files and find relevant
    information across databases. We''ll look at how to analyze those annotations
    for biologically meaningful patterns in gene or protein sets derived from things
    such as differential expression and proteomics analysis.


    In this chapter, we will cover the following recipes:


    +   * Retrieving gene and genome annotations from BioMart

    * Getting Gene Ontology information for functional analysis from appropriate databases

    * Using AnnotDB packages for genome annotation

    * Using ClusterProfiler for determining GO enrichment in clusters

    * Finding GO enrichment in an Ontology Conditional way with topGO

    * Finding enriched KEGG pathways

    * Retrieving and working with SNPs'
  merge: -1
  img_proc: true
