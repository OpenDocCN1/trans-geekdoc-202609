    # How it works...


    *Step 1* is a familiar function, and uses a custom function on the reticulate
    package to get the path to the BLAST executables that were installed under conda.
    *Steps 2 and 3* each show how to build a function that will run a system command
    - makeblastdb and blastp respectively. The functions work by pasting together
    fragments of the relevant commands with the variables - notably, *blast_path*,
    and in *step 3*, some BLAST hit options to limit the number of hits and to format
    the output. The long output string at the end of the run _blast_ () function does
    nothing more than say which output columns we want in the BLAST results, despite
    being verbose. The code is very wide and doesn''t print to the page well, so note
    that it should be entered without any line breaks or carriage returns - press
    *Enter* in the middle of that code if transcribing it.


    *Step 4* and *step 5*, we just run the BLAST, using the functions we have created.
    We extract the sequence files from the data package, and in *step 4*, run *S.
    pombe* as a query against an *S. cerevisiae* database, putting the output into
    a CSV file. In *step 5*, we run the reciprocal search - *S. cerevisiae* against
    *S. pombe* again, putting the output into a CSV file for reading in. These steps
    take a very long time with whole genomes, especially large ones.'
