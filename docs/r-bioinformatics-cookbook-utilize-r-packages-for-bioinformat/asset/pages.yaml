    # How it works...


    Step 1 creates a plot using the data, the allele frequency on the y axis and the
    position of the SNP on the x axis. Note that the aes() function also carries a
    mapping for the label attribute to the info column; plotly only knows automatically
    about stuff that is built into the ggplot object, so it needs to have a mapping
    in this stage. The plot is faced such that each chromosome gets its own face,
    with scales changing to match them. The point color is set to the type column,
    with the most likely mutations being those that are non-synonymous, in a coding
    region, and with a CT/GA transition, those are colored red. Together, this specification
    creates a plot of SNP density across the genome.


