    "extdata",

    "abc.fa",

    package="rbioinfcookbook"

    )

    seqs <- readAAStringSet(seqfile)

    aln <- msa::msa(seqs, method="ClustalOmega")

    ```


    +   2 Convert the alignment:


    ```

    aln <- as.phyDat(aln, type = "AA")

    ```


    +   3 Make UPGMA and neighbor-joining trees from a distance matrix:


    ```

    dist_mat <- dist.ml(aln)

    upgma_tree <- upgma(dist_mat)

    plot(upgma_tree, main="UPGMA")

    nj_tree <- NJ(dist_mat)

    plot(nj_tree, main="unrooted", NJ="NJ")

    ```


    +   4 Calculate the bootstraps and plot:


    ```

    fit <- pml(nj_tree, aln)

    ootstraps <- bootstrap.phyDat(aln, FUN=function(x) { NJ(dist.ml(x)) }, bs=100)

    plotBS(nj_tree, bootstraps, p = 10)

    ```


    And with that, we have our plot of a bootstrap tree.


    # How it works...


    Step 1 carries out loading and makes an amino acid sequence alignment, returning
    an MsaAAAlignment object.


    Step 2 uses the as.phyDat () function to convert the alignment to a phyDat object
    that can be used by the pangorn functions.


    In step 3, we actually make trees. Trees are made from a distance matrix, which
    we can compute with dist.ml() and our alignment (this is a maximum-likelihood
    distance measure; other functions can be used if needed). The dist_mat object
    is passed to the upgma () and NJ () functions to make trees of those types. These
    functions return standard phylo objects that can be worked with in many other
    functions. Here we plot directly, giving output like that of Figure 9.16.'
