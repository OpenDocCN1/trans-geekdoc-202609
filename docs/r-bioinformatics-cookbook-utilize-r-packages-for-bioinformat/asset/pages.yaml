  md: '# Further information


    Not all the recipes in this chapter run in R – some are command-line based setups.
    I generally use a bash terminal for these bits. Most macOS and Linux machines
    will have these a Terminal application. Windows users will likely not need these
    specific steps, though various packages for running a Linux subsystem on Windows
    exist if you wish to search them out.


    In R, it is normal to load a library and use functions directly by name. Although
    this is great in short interactive sessions, it can cause confusion when many
    packages are loaded at once and share function names. To clarify which package
    and function I am using at a given moment, I will occasionally use the packageName
    : : functionName() convention.


    Sometimes, in the middle of a recipe, I''ll interrupt the code to dive into some
    intermediate output or look at the structure of an object. When that happens,
    you''ll see a code block where each line begins with ## (double hash symbols).
    Consider the following command:


    ```

    letters[1:5]

    ```


    This will give us the following output:


    ```

    ## a b c d e

    ```


    Note that the output lines are prefixed with ##.


    Any other information will be given when required.


    # Finding DNA motifs with universalmotif


    A very common task when working with DNA sequences is finding instances of motifs
    – a short sequence – within a longer sequence. These could represent protein-DNA
    binding sites as transcription factor binding sites in a gene promoter or enhancer
    region. There are two starting points for this analysis – you either have a database
    of motifs that you want to scan target DNA sequences and extract wherever the
