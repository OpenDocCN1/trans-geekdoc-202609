    # Finding SNPs and INDELs from sequence data using VariantTools


    A bioinformatics task is to find an alignment of high-throughput sequence reads,
    typically stored in a BAM file, and compute a list of variant positions. This
    is ably handled by many external command-line programs and tools which usually
    results in a VCF file of variants, but some really powerful packages in Bioconductor
    can do the thing, quickly and efficiently, by taking advantage of BiParallel''s
    facilities for parallel evaluation, a set of tools to speed up work with large
    datasets in Bioconductor objects. Using Bioconductor tools allows us to keep all
    of our processing steps within R, and in this recipe, we''ll go through a whole
    pipeline – from reads to lists of genes carrying variants – using purely R code
    and several Bioconductor packages.


    # Getting ready


    In this recipe, we''ll use a set of synthetic reads on the first 83 KB or of the
    human genome chromosome 17. The reads were generated using the wsgim tool in samtools,
    an external command-line program. They have 64 single nucleotide polymorphisms
    (SNPs) introduced by wsgim, which can be seen in the snp_positions DataFrame that
    comes in rbioinfobook. We''ll use BAM and reference genome files that are stored
    in that package, so we''ll need to install that along with the GenomicRanges,
    gmapR, rtracklayer, VariantAnnotation, and VariantTools Bioconductor packages,
    as well as the fs CRAN package.


    # How to do it...


    Finding SNPs and insertions/deletions (INDELs) from sequence data using VariantTools
    can be done by performing the following steps:'
