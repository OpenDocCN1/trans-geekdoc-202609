- pgno: 346
  md: "# 324 Functional Programming with purr and base R\n\nStep 4 moves to Bioconductor,\
    \ and we use the Biobroom version of tidy() on the ExpressionSet object. this\
    \ turns the square matrix of expression values into a tidy dataframe, along with\
    \ columns for sample data and other types. The extra argument, addPhen, is specific\
    \ to this type of object and inserts the phenotype metadata from the object. Note\
    \ that the resulting dataframe is over 2 million lines – biological datasets can\
    \ be large and can generate very large dataframes.\n\n# Using nested dataframes\
    \ for functional programming\n\nFunctional programming is a programming style\
    \ that focuses on using functions to solve problems. It avoids writing clear,\
    \ reusable code that is easier to understand and predictable in its behavior.\n\
    \nThe dataframe is at the core of the tidy way of working, and we intend to think\
    \ of it as a spreadsheet-like rectangular container, with only a single value\
    \ in each cell. In fact, dataframes can be nested – they can hold other dataframes\
    \ in single cells. This is achieved internally by a dataframe’s vector column\
    \ with a list so that each cell becomes a member of a list, and any sort of object\
    \ can be held within the now conceptual single cell of the outer dataframe.\n\n\
    In this recipe, we’ll look at how to make a nested dataframe and ways of working\
    \ with it using a functional style, with the aim that it will simplify working\
    \ with large or multifaceted data.\n\n# Getting ready\n\nWe will use the tidyr,\
    \ dplyr, purrr, and broom libraries. We’ll also use the built-in mtcars data.\n\
    \n# How to do it...\n\nUsing nested dataframes can be done with the following\
    \ steps:\n\n+   1. Create a nested dataframe:\n\n```\nlibrary(tidyr)\nnested_mt\
    \ <- nest(mtcars, -cyl)\n```\n\n+   2. Add a new list column, holding the results\
    \ of a linear model:\n\n```\nlibrary(dplyr)\nlibrary(purrr)\nnested_mt_cols <-\
    \ nested_mt |>\nmutate(\n  model = map(data, ~ lm(mpg ~ wt, data = .x))\n)\n```"
  merge: -1
  img_proc: true
- pgno: 347
  md: '3. Add a new list column, holding the results of tidying the linear model:


    ```

    library (broom)

    nested_mt_list_cols <- nested_mt_list_cols |>

    mutate (tidy_model = map(model, tidy))

    ```


    4. Unnest the dataframe:


    ```

    simple_df <- unnest(nested_mt_list_cols, tidy_model)

    ```


    This is how we work with nested dataframes.


    # How it works...


    First, we create a nested dataframe in step 1. We use the nest () function from
    tidyr to nest the mtcars dataframe. The - option tells the functions which columns
    to exclude from being collapsed into the nested part of the dataframe. This effectively
    makes the cyl column a factor on which subsets are created. It''s conceptually
    similar to the dplyr::group_by () function, which you may be already familiar
    with. Inspecting the object classes what has happened:


    ```

    ## A tibble: 3 x 2

    ## cyl data

    ## <dbl> <list>

    ## 1 6 <tibble [7 x 10]>

    ## 2 4 <tibble [11 x 10]>

    ## 3 8 <tibble [14 x 10]>

    ```


    The nested dataframe contains a new called column, into which the nested data
    has been collapsed. Each nested dataframe contains the rows from the original
    dataframe that had the value of each cyl displayed.


    In step 2, we create a new column on our nested dataframe by mutate (). Within
    the mutate () call, we use the map () function from purrr to iterate over each
    of the sub-dataframes in the named column and apply the named function. The map
    data lm(...), so we iterate each mini-dataframe in the larger one and apply lm
    () to the mini-dataframe. Within the function, the new .x is very idiomatic, indicating
    the thing we''re currently working on - the mini-dataframe. The nested dataframe
    looks like this:


    ```

    ## A tibble: 3 x 3

    ## cyl data

    ## <dbl> <list>

    ## 1 6 <tibble [7 x 10]> <lm>

    ## 2 4 <tibble [11 x 10]> <lm>

    ## 3 8 <tibble [14 x 10]> <lm>

    ```


    A new column called model contains an lm () object at each value of cyl.'
