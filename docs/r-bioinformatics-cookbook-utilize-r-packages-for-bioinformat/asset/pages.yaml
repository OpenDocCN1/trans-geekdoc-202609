  md: '# There''s more...


    Don''t forget to use plot(model_1) to generate diagnostic plots to evaluate the
    fit of the model, as described in the Modeling data with a linear model recipe.
    A good fit indicates that the assumptions of the model and t-test are met and
    the result is reliable.


    # Using a linear model and ANOVA to compare multiple groups in a single variable


    ANOVA is a statistical method used to test whether there is a significant difference
    between two or groups. ANOVA compares the variance within groups to the variance
    between groups to determine if there is a statistically significant difference
    in the means of the groups. ANOVA is commonly used in experiments where a response
    variable is measured across several groups under different experimental conditions.


    ANOVA can be used to compare gene expression levels across multiple samples under
    different experimental conditions, the response variable is the gene expression
    level, and the categorical variable is the experimental condition. ANOVA can also
    be used in clinical trials to compare the effectiveness of different treatments
    or interventions for a disease or medical condition.


    Linear models can be used to perform ANOVA by fitting a linear model to the data
    with a categorical variable that represents the groups. The linear model equation
    can be written as:


    ```

    y_i = β₀ + β₁x_ij + β₂x_ij + ... + βₖxᵢₖ + ε_i

    ```


    where y_i is the response variable for the i-th observation, x_ij is the j-th
    categorical variable for the i-th observation (j = 1, 2, ..., k-1), and ε_i is
    the error term.


    To perform ANOVA, we compare the variability between the groups to the variability
    within the groups. The F-test is used to test whether the differences between
    group means are statistically significant. The F-statistic is calculated as the
    ratio of the variance between groups to the variance within groups.


    In this recipe, we will look at the simplest type of ANOVA, the one-way ANOVA,
    which has multiple groups in a single variable.


    # Getting ready


    We will use built-in base functions and the multcomp package. The recipe needs
    only built-in datasets. We will again use the full PlantGrowth data. Recall that
    it has three groups in weight.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Using a linear model and ANOVA to compare multiple groups in a single variable


    # How to do it...


    The statistical power of R shines again in these few but powerful steps:


    +   1. Build the model:


    ```

    model_1 <- lm(weight ~ group, data = PlantGrowth)

    summary(model_1)

    ```


    +   2. Perform a basic ANOVA and Tukey''s post hoc test:


    ```

    library(multcomp)

    tested <- glht(model_1, linfct = mcp(group = "Tukey")

    summary(tested)

    ```


    Again, just a couple of steps are all we need for a powerful analysis.


    # How it works...


    Step 1 sets up the model in a familiar fashion. The summary () of the model looks
    like:


    ```

    ## Call:

    ## lm(formula = weight - group, data = PlantGrowth)

    ##

    ## Residuals:

    ## Min 1Q Median 3Q Max

    ## -1.0710 -0.4180 -0.0660 0.2627 1.3690

    ##

    ## Coefficients:

    ## (Intercept) Estimate Std. Error t Pr(>t|)

    ## groupprtl1 0.5032 0.1971 25.527 <2e-16 ***

    ## -0.3710 0.2788 -1.331 0.1944

    ## groupprt2 0.4940 0.2788 1.772 0.0877 -

    ##

    ## Signific. codes: 0 **** * 0.001 ** 0.01 * 0.05 . . '' 1

    ##

    ## Residual standard error: 0.6234 on 27 degrees of freedom

    ## Multiple R-squared: 0.2641, Adjusted R-squared: 0.2096

    ## F-statistic: 4.846 on 2 and 27 DF,

    ```


    We can see the overall p-value that there is something going on in the model,
    and its like it might be significant, but the individual coefficients are not
    significant. There are also only two coefficients, which is correct, but there
    are three group contrasts. By default, the linear model takes one group (the first
    in the dataset) as a common reference and won''t automatically cycle through all
    contrasts. For ANOVA, we have to be specific about the contrasts in a post hoc
    test.'
