- pgno: 151
  md: '# Estimating differential expression with edgeR


    The edgeR package in Bioconductor is a tool for identifying differentially expressed
    genes from RNA-Seq data. It offers a range of normalization methods for correcting
    differences in library size and sequencing depth, including the **trimmed mean
    of M (TMM)** method. TMM is a popular normalization method that uses the mean
    of log-transformed expression values to scale the data, taking into account differences
    in library size between samples.


    In addition to normalization, edgeR provides a range of statistical models for
    testing differential expression. One of the main models used in edgeR is the negative
    binomial model, which is a type of **generalized linear model (GLM)** that is
    well-suited for modeling count data as RNA-Seq data. The negative binomial model
    allows for the estimation of the mean and dispersion of the expression counts,
    and can account for overdispersion, which is common in RNA-Seq data. Overall,
    edgeR is a powerful and widely used tool for differential expression analysis
    of RNA-Seq data, offering a range of normalization and statistical modeling options
    to help researchers identify significant changes in gene expression between sample
    groups.


    In this recipe, we''ll look at some options, from having the read counts in an
    object to identifying the differentially expressed features in a genome. We will
    show how to concentrate on the differential expression analysis part of the process,
    we''ll use a prepared dataset. Other chapters in this book will show you how to
    go from raw data to this stage if you''re looking for that step.


    We will use the modencodefly data from the NHG Encyclopedia of DNA elements (ENCODE)
    project for the model organism Drosophila melanogaster. You can read this project
    at www.modencode.org. The dataset contains 147 different samples for D. melanogaster,
    a fruit fly with an approximate genome of 120 Mbp, annotated about 15,000 gene
    features.


    # Getting ready


    The data is provided as a count DataFrame, similar to what we might load in a
    text file, and an ExpressionSet object. A Bioconductor ExpressionSet object is
    a data structure that''s used to store and manage gene expression data in R. It
    is a list-like object that contains the raw expression data and associated metadata,
    such as sample annotations and feature annotations.


    # How to do it...


    We will see two ways of estimating differential expression with edgeR from two
    different starting datasets.


    # Using edgeR from a count table


    Often, we will receive or have prepared transcript count data and have it in something
    such as a DataFrame, perhaps loaded originally from a text file or we have received
    it from another R function.'
