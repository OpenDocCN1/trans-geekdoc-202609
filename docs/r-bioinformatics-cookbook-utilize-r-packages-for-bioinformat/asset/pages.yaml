  md: '# Performing power analysis with powsimR


    In step 8, the DEXSeq package is used for differential analysis. We move through
    the typical workflow using the estimateSizeFactors, estimateDispersions, testForDEU,
    estimateExonFoldChanges functions, which are used together to test for differential
    exon usage. The output is assigned to the dx variable and final results are obtained
    from that object using the DEXSeq result. The padj and log2fc of the counts expressed
    as Fragments Per Kilobase Per Million mapped fragments (FPKM) can be found in
    that table.


    # Performing power analysis with powsimR


    Statistical power analysis is used to determine the sample size to detect an effect
    of a certain size with a level of statistical significance. This is important
    because it allows researchers to ensure that their studies are adequately powered
    (that is, enough replicates have been sampled) to detect the effects they are
    interested in. Without sufficient power, there is a higher risk of failing to
    reject the null hypothesis when it is false — to miss differentially expressed
    genes. In this recipe, we use the powsimR package (which is not in Bioconductor)
    to perform two types of power analysis. Both of them will be performed with a
    small real dataset. First, we will test and control, and then we will estimate
    the replicates that need to spot differences in gene expression of a particular
    magnitude – if they’re present. powsimR takes a simulation-based approach in that
    it generates many datasets and evaluates the detection power in each to create
    a distribution of detection power. The first step is to estimate some parameters
    for these simulations for which we’ll need sample or preliminary data. With that,
    we simulate and assess power.


    # Getting ready


    powsimR has a lot of dependencies, some of which are a bit fiddly to install.
    I recommend manual installation, often, that isn’t necessary. Try installing the
    Python magic-impute dependency first and then installing the R package from GitHub
    before installing the powsimR package itself. The following steps outline the
    procedure:


    +   1. In a terminal, run the following command to install the Python magic-impute
    dependency:


    ```

    pip install --user magic-impute

    ```


    +   2. Then, we can install the R packages as usual:


    ```

    renv::install("cran/Rmagic")

    env::install("bvieth/powsimR")

    ```


    The package should be installed. If it raises any errors, please see the complete
    documentation for this package on its GitHub page: https://github.com/bvieth/powsimR.'
