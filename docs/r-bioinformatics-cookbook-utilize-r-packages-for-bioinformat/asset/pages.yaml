  md: "# Performing multiple alignments of proteins or genes\n\nAligning sequences\
    \ as a task before building phylogenetic trees or as an end in determine conserved\
    \ and divergent sequences is a mainstay in bioinformatics analysis and is amply\
    \ covered in R and Bioconductor with the msa and DECIPHER packages. We'll look\
    \ at the extremely straightforward procedures for going from sequence to alignment\
    \ in this recipe.\n\nThere are different techniques for sequence length categories.\
    \ In the first part of this recipe, we'll look at sequences on the order of a\
    \ couple of thousand residues or smaller, such as those that represent genes and\
    \ proteins.\n\n# Getting ready\n\nFor this recipe, you'll need the msa package.\
    \ This is a pretty package and includes external software: Clustal, Clustal Omega,\
    \ The ape and seqinR packages are also needed. As a test dataset, we use hemoglobin\
    \ protein sequences stored in the rbioinfo own. You'll need a version of LaTeX\
    \ on your system too – if you have already installed quarto or rmarkdown on your\
    \ system, you should be good, though you can get it from https://anaconda.com/org/conda-forge/texlive-core.\n\
    \n# How to do it?\n\nPerforming multiple alignments of genes or proteins can be\
    \ done by performing the following steps:\n\n+   1. Load in the necessary libraries\
