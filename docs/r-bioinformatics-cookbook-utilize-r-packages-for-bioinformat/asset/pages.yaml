  md: '# There''s more...


    This recipe concentrates on installing source packages from GitHub, but there
    are related functions for other version control systems:


    +   - install_gitlab () from GitHub

    - install_bitbucket () from Bitbucket

    - install_url () from an arbitrary URL

    - install_git () and install_svn () from an arbitrary Git or SVN repository

    - install_local () from a local file on disk

    - install_version () from a specific version on CRAN


    # Setting up your machine for the compilation of source packages


    Compilation of source code is the process of converting human-readable code into
    machine-readable code that can be executed by a computer. It varies on different
    chips and operating systems because the machine code that is produced must be
    specific to the architecture of the target platform. A compiler is a program that
    performs the compilation process.


    Some R packages are written in C or Fortran which are low-level programming languages
    that can execute faster than R in certain situations. Additionally, C code can
    be easily integrated into R packages, allowing for faster computations and improved
    performance. To take advantage of the better performance, some R packages from
    the source will need to have their foreign language parts compiled. In this brief
    recipe, we''ll look at tricks and shims for installing code that must be compiled
    on various platforms.


    # Getting ready


    We don''t need anything specific prior to this recipe, as we assume a machine
    that is not already prepped for compilation.


    # How to do it...


    The steps here sometimes refer to different operating systems; not everything
    is applicable to all computers. I''ve marked the operating system that each is
    designed to use:


