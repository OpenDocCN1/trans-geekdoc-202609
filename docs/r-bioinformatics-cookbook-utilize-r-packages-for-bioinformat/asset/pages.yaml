- pgno: 332
  md: '# Creating a tSNE UMAP embedding


    **t-Distributed Stochastic Neighbor Embedding (t-SNE) and Uniform Manifold Approximation
    and Projection (UMAP)** are both dimensionality reduction techniques commonly
    used in ML and data visualization.


    t-SNE is a non-linear technique used to visualize high-dimensional data in a lower-dimensional
    space while preserving the local structure of the data. t-SNE is particularly
    useful for revealing clusters or groups of data points that may not be immediately
    apparent in the original high-dimensional space.


    UMAP is another non-linear dimensionality reduction technique that has gained
    popularity due to its scalability and efficiency. UMAP also focuses on preserving
    local structures and employs a different mathematical method based on graph theory
    and optimization techniques. UMAP is often used for visualizing large datasets
    with millions of data points.


    Both algorithms suffer from being computationally expensive, especially when dealing
    with large datasets. UMAP was developed to address this issue and is generally
    faster than t-SNE, but it can be slower than other linear techniques such as PCA.
    Both algorithms are sensitive to the random initialization of the embedding, which
    means running the same algorithm with different random seeds can produce different
    results. It''s important to be aware of this when interpreting the visualizations.


    Crucially, the lower-dimensional representations may not have a direct correspondence
    to the original features. The focus is on capturing the relationships between
    data points rather than preserving the global structure. Both techniques have
    several parameters that need to be set, such as the perplexity in t-SNE and the
    number of neighbors in UMAP. Choosing appropriate parameter values can significantly
    affect the quality and interpretability of the embeddings, making it important
    to experiment and tune these parameters.


    Nonetheless, t-SNE and UMAP are useful for exploratory data analysis, pattern
    recognition, and visualization tasks, helping researchers and data scientists
    gain insights from complex and high-dimensional data. The visualizations should
    not be considered equivalent to the clusters and we are more familiar with bioinformatics.


    In this recipe, we will look at how to perform a visualization in t-SNE and UMAP
    and how to tune the most important parameters.


    # Getting ready


    For this recipe, we''ll use familiar data from the palmeruins, the tidyr, dplyr,
    and tibble packages to manipulate that data. For analysis and visualization, we
    will use the Rts, umap, purrr, and ggplot2 packages.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# How to do it...


    We start creating these embeddings by preparing the data:


    +   1. Load libraries and data:


    ```

    library(palmerpenguin)

    library(tidyr)

    library(dplyr)

    library(tibble)


    penguins_filtered <- penguins |

    drop_na(-year) |

    select(-year) |

    mutate(ID=row_number())


    penguins_scaled <- penguins_filtered |

    select(where(is.numeric)) |

    column_to_rowenames("ID") |

    scale() )

    ```


    +   2. Define the parameter space and embedding function:


    ```

    library(Rtsne)

    space <- expand.grid(perp = seq(5, 50, by = 10), dim = 1:3)


    tsne <- function(p, d) {

    tsn <- Rtsne(penguins_scaled, perplexity = p, dimensions = p)

    data.frame(

    SNE1 = tsnY[1],

    SNE2 = tsnY[2],

    perplexity = p,

    dimensions = d,

    species = penguins_filtered$species

    }


    res <- purrr::map2(space$perp, space$dim, tsne) |>

    purrr::list_rbind()

    ```'
