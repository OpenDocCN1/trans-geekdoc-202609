    \ can identify peaks of enrichment that are differentially expressed and gain\
    \ insight into how the protein regulates the expression of different genes. Another\
    \ example is RNA-Seq data – comparing RNA-Seq data between different samples or\
    \ conditions, researchers can identify peaks of expression that are differentially\
    \ expressed and gain insight into how different samples or conditions affect the\
    \ expression of different genes.\n\nOther use cases include Histone modification\
