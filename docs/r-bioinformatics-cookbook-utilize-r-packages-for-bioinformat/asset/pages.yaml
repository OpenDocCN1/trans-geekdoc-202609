    # How it works...


    This slightly repetitive recipe serves to highlight the fact that there are really
    only two functions used in the here workflow and the pattern of use is quite straightforward.
    In the first part of the pattern, the user uses the i_am() function to declare
    where the script is - this helps work out the project structure. Then, here()
    function itself is used every time we want to use a path. We simply to think of
    all our paths relative to the project root - the my_project folder. Note that
    all these steps are performed as edits to the recipe files and not typed into
    the console.


    In step 1, we get our script to declare its position in the project tree, allowing
    here to work out the structure.


    In step 2, we create a path for the input file elsewhere in the project file structure,
    independent of the syntax of the operating system, and the value of getwd() using
    the here() function. Each element passed to here() is just a step on the path
    to the file.


    In step 3, we are repeating the initialization we did in step 1 for this different
    file - here, an R Markdown document - so the new code must go in the first chunk.


    And in step 4, we use the here() function to build a path to our functions.R file
    and load its contents for the current document.


    # There’s more…


    You can use the here() function without arguments to tell it where it thinks the
    project root is currently. You can also use the dr_here() to tell you why that
    it is the project root.


    # Using the devtools package to work with the latest-CRAN packages


    A R package contains the plain source code for an R package, which can be installed
    and built on the user''s machine. A binary R package, on the other hand, is a
    pre-built version of an R package that contains pre-compiled code and can be installed
    and used directly without the need to build the package from the source, and without
    needing all the tools and programs needed for the compilation progress. When we
    install packages from CRAN using install.packages(), we are typically getting
    a pre-compiled binary version of the code.'
