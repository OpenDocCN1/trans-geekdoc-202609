    which contains only the GO accession and the GO description. We also set up a
    list of unique genes ID to represent the entry. In step 2, we extract the list
    of genes and expression values to analyze with GO; in real analysis, this would
    likely come from your experiment directly.


    Step 3 is where we get to perform the enrichment analysis; we carry out using
