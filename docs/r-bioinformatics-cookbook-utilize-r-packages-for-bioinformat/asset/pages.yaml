    # How it works...


    In step 1, a loading function is set up to import a GFF file into R using the
    rtracklayer package. Specifically, the function takes a filename and reads it
    into a variable, gff. Then, the function converts the gff object into a Granges
    object and returns it.


    In step 2, the csaw and rbioinformatics are loaded and the paths of two files
    are specified - that is, bam_path and gff_path. The bam_path variable holds the
    path of the windows_bam.file, which is an indexed binary alignment file that contains
    the reads for a dataset, while the gff_path variable holds the path of the genes.gff
    file, which contains the annotated regions for the genome. The windowCounts()
    function from the csaw package is used to count reads in windows of window_variable.
    In the next line, the columns are given the name small_data. Then, the get_annotated_regions_from_gff
