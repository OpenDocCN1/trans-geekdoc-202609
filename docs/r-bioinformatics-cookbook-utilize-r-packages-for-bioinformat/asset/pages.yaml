    and the qnorm() function from the extMem library is used to create a quantile-quantile
    plot of finite_log2fc.


    In step 3, the estimateParam() function from the powsim library is used to estimate
    the parameters needed to run a simulation based on the data in arab_infection.
    The distribution of the data is specified as a negative binomial distribution,
    the type of RNA sequencing is specified as bulk (as ours is - which just means
    all the sampled RNA), and the normalization method is specified as TMM. The method
    is assigned to parameters.


    Then, the Setup() function from powsimR is used to set up the options for the
