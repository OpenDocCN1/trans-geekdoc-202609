- pgno: 317
  md: '# Testing the fit of the model using cross-validation


    # See also...


    Neural networks are another type of learner that we can use in ml3. There are
    two broad types: the artificial shallow neural networks and the deep, multi-layer
    neural networks. The first sort, shallow neural networks, have been around for
    a very long time, have good implementation in ml3, and can be used as another
    type of learner that k-NN was used in this recipe. The deep neural networks are
    very different, need a lot of computational resources, and require the external
    Keras libraries to work. The interface between Keras and ml3 is still in the early
    stages of development and I tried to write a recipe about it, there''s a strong
    chance it would be out of date very quickly. If you really want to try Keras learners
    in ml3, you can find them in the mlkeras package here: https://github.com/ml-org/ml3keras.
    If you give it a go and have opinions on it, why not the developers know what
    you think and assist in the package development?


    # Testing the fit of the model using cross-validation


    Cross-validation provides a reliable estimate of the model''s performance on unseen
    data. Simulating the model''s performance on subsets of the data reduces the effect
    of random variations in the training and testing data splits, providing a more
    realistic assessment of its generalizability.


    K-fold cross-validation involves dividing a dataset into K equally-sized subsets,
    or folds, where K is a predefined number typically chosen between 5 and 10. The
    original dataset is randomly partitioned into K subsets and trained on K-1 folds
    and evaluated on the fold left out. This means that K-separate model training
    and evaluation cycles are performed. The performance values from the K iterations
    are then averaged to obtain a single metric that represents the overall performance.


    Leave-one-out (LOO) cross-validation is a variant of cross-validation where the
    number of folds is equal to the number of samples in the dataset. In this technique,
    for each fold, a single sample is withheld as the test set and the remaining samples
    are used to train the model. This process is repeated for all samples in the dataset,
    and the performance of the model is evaluated based on the aggregated results.
    It is particularly useful when working with small datasets where the number of
    samples is limited.


    In this recipe, we''ll look at how to implement these in ml3.


    # Getting ready


    For this recipe, we''ll use the ml3 package, its accessory package ml3learners,
    and the data package mlrbench. We''ll also need to install the ml3 dependency
    knn3 manually.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# How to do it...


    Cross-validation can be done as follows:


    +   1. Set up the task and learner:


    ```

    library(mlr3)

    library(mlbench)

    library(mlr3learners)

    data("BreastCancer")


    selected <- BreastCancer[c("Cl.thickness", "Cell.size", "Cell.

    shape", "Marg.adhesion", "Epith.c.size", "Bl.

    cromatin",

    n"Normal.nucleoli", "Mitoses", "Class"

    ])


    task <- as_task_classifier(selected, target="Class")

    learner <- lrn("classifier.knn") #install knn package

    learner$paramset$set_values(k = 4)

    ```


    +   2. Set up the resampling object:


    ```

    resamp_kcv <- resmp("cv")

    resamp_kcv$param$values = list(folds = 3)

    ```


    +   3. Perform the resampling experiment:


    ```

    result_kcv <- resample(task, learner, resamp_kcv)

    ```


    +   4. Assess the iterations:


    ```

    measures <- msrs(c("class.precision", "class.specificity",

    "class.sensitivity")

    result_kcv$score(measures)

    ```


    +   5. Examine the aggregated predictions:


    ```

    pred_kcv<- result_kcv$prediction()

    pred_kcv$confusion

    ```


    +   6. Use the same task and learner in a different validation scheme:


    ```

    resamp_loo <- resmp("loo")

    result_loo <- resample(task, learner, resamp_loo)

    result_loo$score(measures)

    ```


    That''s all we need to cross-validate the model.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# How it works...


    Recalling that all in this recipe is to assess the generalizability of a model
    to wider data sets, we begin in step 1 by setting up the same task (i.e. the BreastCancer
    data) as in the Defining a task and learner to k-nearest neighbors (k-NNs) in
    ml3r, and the learner with the same parameters.


    In step 2, we can set up the resampling scheme, defining the type with the rspmp
    () function, passing it to set the value "cv" for ''cross-validation'' and using
    the Sparam_set method to set the number of folds.


    We perform the resampling in step 3 using the resample () function. The returned
    result_kcv object carries the predictions from each of the folds that we drew.
    If we print the object we can also see if any errors or warnings were generated
    during process.


    Now that the resampling is performed, we can assess the differences between all
    the different sets of models produced here as we did previously for a single model.
    In step 4 we create a vector of measures to look at from the msrs () function
    and pass them to the result_kcv$score () method. The right-hand side of the output
    looks something like this (though not randomness in the selection process and
    the algorithm itself may have variations:)


    ```

    ## iteration class.precision class.specificity class.sensitivity

    ## 1        0.9565217      0.9041096      0.9625000

    ## 2        0.9183673      0.8695652      0.9574468

    ## 3        0.9622642      0.9210526      0.9745223

    ```


    In these folds, it looks like the metrics are quite close together. Though specificity
    varies somewhat, the second fold is a distance behind. These give us a view of
    the general usefulness of our model, it seems to be a bit data-dependent from
    this, which is usually a feature of a model we would want to avoid.


    In step 5 we use the $prediction () method to get a combined prediction over all
    models, the resulting confusion matrix, which looks as follows:


    ```

    truth

    ## response    benign malignant

    ## benign        444      30

    ## malignant     14      211

    ```


    The next thing to do is repeat the evaluation using a different resampling technique.
    In step 6 we use LOO easily, recycling the task and learner and measuring objects.
    We just have to specify the resampler using rsp () and rerun it. Everything is
    the same. We get a similar output, though some of the metrics we use for score
    doesn''t make as much sense as we are proportional. This means you get on single
    rows as LOO.'
  merge: -1
  img_proc: true
