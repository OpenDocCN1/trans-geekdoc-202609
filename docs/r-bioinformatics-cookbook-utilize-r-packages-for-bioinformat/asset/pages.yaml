  md: '# Setting Up Your R Bioinformatics Working Environment


    In step 5, we resort to restoring the entire set of packages from the lock file
    to get to the state we had in step 3 painfully.


    # There''s more...


    For maximum use across developers, machines, and even just time, renv.lock, .Rprofile,
    and .gitignore should be committed to version control. Another useful function
    is renv::dependencies(), which will crawl your R packages and files for package
    names, returning a list. Should you need to know what is currently used at the
    top level, there is renv::hydrate(), which will find the R packages used within
    a project and then install them into the active environment, giving preference
    to versions already on the system to avoid downloading new stuff.


    # Installing and managing different versions of Bioconductor packages in environments


    Bioconductor is an open source project that provides a collection of R packages
    for the analysis and comprehension of genomic data. It is focused on the needs
    of the bioinformatics and computational biology communities. The packages in Bioconductor
    cover a wide range of topics, including data representation and management, preprocessing
    and normalization, statistical analysis, and visualization of high-throughput
    genomic data. Bioconductor exists as a project distinct from R because it addresses
    the specific needs of the bioinformatics community, and requires different data
    structures, analysis methods, and visualization techniques to other fields. A
    user might choose Bioconductor because they are specifically designed for the
    analysis of genomic data and are often more specialized than general-purpose R
    packages. Bioconductor usually comes with its own installer, but there are other
    ways to work with specific versions in specific environments, which is what we''ll
    look at in this recipe.


    # Getting ready


    For this quick recipe, we will need the renv package.


    # How to do it...


    The use of renv for Bioconductor goes as follows:


    +   1. Set up the new environment:

    ```

    renv::init(bioconductor = TRUE)

    renv::install("Biostrings")

    ```


    +   2. Set up to specify a particular version of Bioconductor:

    ```

    renv::init(bioconductor = "3.15")

    renv::install("SummarizedExperiment")

    ```'
  merge: -1
