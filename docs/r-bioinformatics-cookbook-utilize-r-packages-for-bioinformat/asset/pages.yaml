  md: "# Finding phenotype and genotype associations with GWAS\n\nA powerful application\
    \ of a variant can many thousands of SNPs with high-throughput sequencing is genome-wide\
    \ association studies (GWAS) of genotype and phenotype. GWAS is a genomic analysis\
    \ of different individuals or genetic lines to see whether any particular variant\
    \ is associated with a trait. There are numerous techniques for doing this, but\
    \ all of them rely on gathering data on variants in particular samples and working\
    \ out each genotype before cross-referencing with the phenotype in some way. In\
    \ this recipe, we'll look at the sophisticated mixed linear model described by\
    \ Yu et al. in 2006 (Nature Genetics, 38:203-208 ). Describing the workings of\
    \ the unified mixed model is beyond the scope of this recipe, but it is a suitable\
    \ model for use in data with large samples and broad allelic diversity and can\
    \ be used on plant and animal data.\n\n# Getting ready\n\nIn this recipe, we'll\
    \ look at constructing the structures we need to run the analysis from input VCF\
    \ files. We'll use the GWAS () function in the rrBLUP package to do so. Our sample\
    \ data contains three SNPs – for didactic purposes, this will aid our programming\
    \ task but for a GWAS study, the number is laughably small. Although the code\
    \ will work, the results will not be biologically meaningful. We'll need the rrBLUP\
    \ and VariantAnnotation Bioconductor packages, as well as a data file called small_sample.vcf,\
    \ which is provided in the rbioinfocookbook packages.\n\n# How to do it...\n\n\
    Finding phenotype and genotype associations with GWAS can be done by performing\
    \ the following steps:\n\n+   Load in the libraries and get the VCF file:\n\n\
    ```\nlibrary(VariantAnnotation)\nlibrary(rrBLUP)\nlibrary(rbioinfocookbook)\n\
    set.seed(1234)\n\nvcf_file <- fs::path_package(\n  \"extextdata\",\n  \"small_sample.vcf\"\
    ,\n  package=\"rbioinfocookbook\"\n)\n\nvcf <- readVcf(vcf_file, \"hg19\")\n```"
  merge: -1
  img_proc: true
