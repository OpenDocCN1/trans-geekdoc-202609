- pgno: 147
  md: '# # 6

    Performing Quantitative RNA-seq


    RNA-Seq has revolutionized the study of gene expression by providing highly accurate
    estimates of transcript abundances through high-sensitivity detection and high-throughput
    analysis. Bioinformatic analysis pipelines that use RNA-Seq data typically start
    with a read quality control step, followed by alignment to a reference or assembling
    sequence reads into longer transcripts. After that, transcript abundances are
    estimated with sequence read counting and statistical models, and differential
    expression between samples is assessed. In this chapter, there are many technologies
    available for all steps of this pipeline. Quality control and read alignment will
    usually take place outside of R, so analysis in R will begin with a file containing
    transcript or gene annotations (such as GFF and BED files) and a file of aligned
    reads (such as BAM files).


    In this chapter, we will cover the following recipes:


    +   - Estimating differential expression with edgeR


    +   - Estimating differential expression with DESeq2


    +   - Estimating differential expression with Kallisto and Sleuth


    +   - Using Sleuth to analyze time course experiments


    +   - Analyzing splice variants with GsSeq


    +   - Performing power analysis with powsimR


    +   - Finding unannotated transcribed regions'
  merge: -1
  img_proc: true
