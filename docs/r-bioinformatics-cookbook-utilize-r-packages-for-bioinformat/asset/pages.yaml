- pgno: 144
  md: '# Making predictions using linear models


    Linear models are commonly used in bioinformatics for prediction tasks due to
    their simplicity, interpretability, and to handle high-dimensional datasets. In
    bioinformatics, researchers often work with large datasets that have a large number
    of features (such as gene expression or sequence data), making it challenging
    to analyze with more complex models. Linear models offer a straightforward and
    computationally efficient way to analyze these datasets. Linear models can help
    researchers identify genes or genetic variants that are associated with a particular
    trait or disease. They can also be used in feature selection to identify the most
    relevant features (genes, proteins, etc.) that are associated with the outcome
    of interest (disease, drug response, etc.). Linear models can be used to rank
    features based on their importance and select the most relevant ones for further
    analysis, the assumption being that the subset of variables that gives the strongest
    prediction of the actual data is the best for analyzing data.


    In this recipe, we''ll take a look at doing tasks such as predicting new data
    on our response variable given some input values.


    # Getting ready


    For this recipe, we''ll use a dataset built into ggplot2 called txhousing.


    # How to do it...


    We''ll begin by creating a model of house prices based on the txhousing:


    +   1. Build a model relating the median house price to city, year, and month
    of sale:

    ```r

    library(ggplot2)

    str(txhousing)

    model <- lm(median ~ city + year + month, data = txhousing)

    ```

    2. Create a frame of possible values from which to predict:

    ```r

    new_values <- data.frame(city = c("Abilene"), year = c(2000),\ month = c(2))

    ```

    3. Predict the house price for that city/year/month combination:

    ```r

    predict(model, newdata=new_values)

    ```

    4. Get a confidence interval for the prediction:

    ```r

    predict(model, newdata=new_values, interval = ''predict'')

    ```


    And that is all we need to predict.'
