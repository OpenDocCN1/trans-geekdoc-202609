    \ We'll also need the R package, reticulate.\n\n# How to do it...\n\nWe'll start\
    \ this recipe in the command line to set up conda and install software into a\
    \ specific environment, move into R to run the installed programs from your selected\
    \ environment:\n\n+   Connect conda to the biconda channel at the command line\
    \ (not the R console):\n\nbash\nconda config --add channels defaults\nconda config\
    \ --add channels biconda\nconda config --add channels conda-forge\nconda config\
    \ --set channel_priority strict\n```\n\n+   Create and activate a new environment\
    \ into which we can install external binaries, again in the command line:\n\n\
    ```bash\nconda create --name bioinformatics_project\nconda activate bioinformatics_project\n\
    ```\n\n+   Install the bioinformatics tools:\n\n```bash\nconda install minimap2\
    \ gatk samtools==1.15.1\n```\n\n+   Get the path to the installed binary program\
    \ in an R script:\n\n```r\nenv_path <- function(env, program = \"\") {\n  df <-\
    \ reticulate::conda_list()\n  b <- df$python[which(df$name == env)]\n\n  if (length(b)\
    \ == 0) {\n    stop(\"no environment with that name found\")\n  }\n\n  file.path(dirname(b),\
    \ program)\n}\n```"
