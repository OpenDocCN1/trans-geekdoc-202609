  md: '# Performing Quantitative RNA-seq


    That is how we do it with a standard count table that could have come from many
    upstream sources. Now, let''s look at the next input type.


    # Using DESeq2 from an ExpressionSet object


    To estimate differential expression with DESeq2 from an ExpressionSet object,
    we must perform the following steps:


    +   Load the eset data and convert it into a DESeqDataSet ():

    ```r

    library(SummarizedExperiment)

    umm_exp <-

    makeSummarizedExperimentFromExpressionSet(modencodefly.eset)

