  md: '# Analyzing Gene Annotations


    In this case, this is the same as the columns wasn''t always be. Now that we know
    the data can get out and the type of data we can query, we need some values for
    the query keys, which may often come from your analysis, but for this example,
    we have the gene_symbols data from the rbioinfcookbook package that contains a
