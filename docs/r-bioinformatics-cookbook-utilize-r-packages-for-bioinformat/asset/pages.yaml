  md: '# How to do it...


    We follow a series of steps that create a local renv package directory and populate
    that with packages from various sources:


    +   Initialize a project-local subdirectory:


    ```

    renv::init()

    ```


    +   We''ll install the common ggplot2 and dplyr packages from the usual CRAN repository:


    ```

    install.packages(c("ggplot2", "dplyr"))

    ```


    +   Take a snapshot to save the environment status:


    ```

    renv::snapshot()

    ```


    +   Install some development packages:


    +   Decide that the development package wasn''t the version you wanted; you want
    to roll the environment to how it looked at the last snapshot:


    ```

    renv::restore()

    ```


    And that is the simple but effective way to manage packages in a renv environment.


    # How it works...


    In step 1, we create a new environment; The renv directory is where the packages
    will be stored. A renv lock file contains a snapshot of the packages – an explicit
    list of what you want to installed. The .RProfile contains commands to activate
    renv on starting the project and a .gitignore is created to keep the packages
    out of your Git repository.


    Step 2 is a typical install.package() step, but if you are working in RStudio
    interactively, you may see from the auto-complete that this function is no longer
    provided by the base package, but rather by the renv package; renv has shifted
    this function to add extra functionality.


    With step 3, we take an explicit snapshot, saving the names and versions of currently
    installed packages at this point into renv. lock such that we can use the list
    in the file to recreate your environment later, which is es useful if some package
    or packages mess up.


    In step 4, we install a development package that is suboptimal and that we eventually
    don''t want.'
  merge: -1
  img_proc: true
