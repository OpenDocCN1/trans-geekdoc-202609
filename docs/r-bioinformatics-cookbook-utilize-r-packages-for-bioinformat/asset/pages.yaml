    # How it works...


    Step 1 follows the pattern established in the Retrieving gene and genome annotations
    from BioMart recipe at the start of this chapter, which we made the initial connections
    with listMarts().


    This looks as follows:


    | | biomart | version |

    | ## 1 | ENSEMBL_MART_PLANT | Plant Genes 66 |

    | ## 2 | ENSEMBL_MART_PLANT_SNP | Plant Variation Mart 66 |


    We use this to list the datasets, listDatasets(). The Arabidopsis "thaliana_eg"
    dataset is used. We use the list() functions to filter the filters and attributes
    we can use and retrieve pass values from those searches as needed for the getBM()
    function to perform the search. The chromosomal_region filter allows us to specify
    a value describing a particular locus on the genome, the value argument gets a
    "Chromosome:Start:Stop:Strand" formatted string - ''1:200:20000:1'', which will
    return all SNPs on chromosome 1, between nucleotides 200 and 20000 on the positive
    strand (note the negative strand is ''-1'').


    # There''s more...


    Finding SNPs from Ensembl follows nearly the same pattern. The only difference
    is, that Ensembl is the default server, we can omit the server information from
    the useMart (). A similar query for human SNPs would look like:


    ```

    data_set_connection <- useMart("hsapiens_snp", biomart="ENSEMBL_MART_SNP")

    snps <- getBM(attributes = c("refsnp_id", "chr_name",

    "chrom_start", "chrom_end"),

    filters = c("chromosomal_region"),

    values = c("1:200:200000:1"),

    mart = data_set_connection

    )

    ```


    The preceding code would return data as described in the main steps.'
