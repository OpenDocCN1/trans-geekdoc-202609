- pgno: 23
  md: '# # Setting Up Your R Bioinformatics Working Environment


    R is a powerful and versatile programming language that is widely used in bioinformatics,
    data science, and statistics. One of the key benefits of R is its rich ecosystem
    of packages and libraries, which allows users to easily perform complex tasks
    and analyze large datasets – in particular, the tidyverse packages, which provide
    a lot of data science functionality, and the Bioconductor packages, which are
    state of the art in biological analysis, have provided great power. To get the
    best out of these make sure that you are working in the most productive ways,
    it is important to use the best tools and employ a clear and organized project
    structure to ensure that your work is readable, maintainable, and reproducible.


    One of the most important aspects of a good project structure is separating the
    parts into different files and directories based on their purpose. For example,
    it is a good practice to keep your data in a separate directory with your code
    and to separate into different files for different tasks, such as data cleaning,
    analysis, and visualization. A well-set machine and clear project structure that
    keeps code readable, maintainable, and reproducible benefit the original developer
    of the code, others who work on the code later, and any future users of the code
    and the scientific results. It is also crucial when we come to writing up results
    for publication and being organized this way can save a lot of headaches and stress
    and even repeating of work.


    Computing environments, such as R and Anaconda, are also an important part of
    a good project structure. These packages allow you to create a virtual environment
    that is separate from your systemwide R installation, which makes it easy to manage
    different versions of programs, packages, and dependencies. This is particularly
    useful when working on multiple projects with other collaborators who may be using
    different versions of packages. It can also help recreate a project easily when
    you haven''t worked on it for a while. Using virtual environments ensures all
    collaborators have the same software environment.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Setting Up Your Bioinformatics Working Environment


    Biconda and Homebrew are package management systems that make it easy to install
    and manage bioinformatics software on your computer. Biconda is focused on bioinformatics
    software and packages, while Homebrew is a general-purpose package management
    system for macOS and Linux. Both are particularly useful for bioinformatics research
    as they allow you to easily install and manage the large number of specialized
    bioinformatics programs and packages needed for various analyses and pipelines.


    In this chapter, you''ll learn some essential tips and tricks for setting up your
    computer so that you can work in the most productive way.


    In this chapter, we will cover the following recipes:


    +   - Setting up an R project in a directory

    - Using the here package to simplify working with paths

    - Using the devtools package to work with the latest non-CRAN packages

    - Setting up your machine for the compilation of source packages

    - Using the renv package to create a project-specific set of packages

    - Installing and managing different versions of Bioconductor packages in environments

    - Using bioconda to install external tools


    # Technical requirements


    We will use renv to manage packages in a project-specific way. To use renv to
    install packages, you will first need to install the renv package. No specific
    R version seems to be needed for renv, though it''s a good idea to use the latest
    version of R. renv will automatically record the version of R that you used when
    starting with it on a project. Note also that you shouldn''t use renv directly
    in the home directory, only in project-directories. You can see more information
    on this working structure in the Setting up an R project directory and Using the
    renv package to create a project-specific set of recipes.


    You can do this by running the following command in your R console:


    +   1. Install renv:


    ```

    install.packages("renv")

    ```


    +   2. Next, you will need to create a new renv environment for your project by
    running the following command:


    ```

    renv::init()

    ```


    This will create a new directory called ".renv" in your current project directory.'
  merge: -1
  img_proc: true
