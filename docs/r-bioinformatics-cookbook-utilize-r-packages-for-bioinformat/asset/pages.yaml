    one of its columns out to make new columns. Initially, this might seem like we''re
    not violating our tidy data frame requirement, but we do come across data frames
    that have more than one variable squeezed into a single column. As in the previous
    recipe, tidyr has a specification-based function to allow us to correct our data
    frame.'
