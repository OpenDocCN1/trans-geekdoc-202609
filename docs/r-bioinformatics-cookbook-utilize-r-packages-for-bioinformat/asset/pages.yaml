  md: 'sleuth, the full model is typically used to test for the effects of specific
    variables of interest, such as the condition variable in this case. The null or
    reduced model is used as a baseline for comparison and whether there is any significant
    difference in expression between the samples. The transformation function is used
    to account for the technical variability in the data and thus the results of the
    analysis are more robust.


    In step 6, the code carries tests on the conditionLevel and creates a new object
    called results that contains the results of the tests. The test that carried out
    is a Wald Test, a statistical test that used to test the null hypothesis that
    the parameters of a linear model are equal to zero – in other words, the test
    checks if there is any significant difference in expression between conditionM
    and the other condition. The Wald Test is based on the ratio of the estimated
    parameter to its standard error. It calculates a test statistic, which is then
    compared to a critical value from a chi-squared distribution to determine the
    p-value. Wald Test is commonly used in the sleuth package and it is useful for
    testing the significance of individual coefficients in a linear model.


    In step 7, the R code uses the dplyr library to arrange the rows of the results
    object in descending order based on the b column. The resulting DataFrame can
    then be examined to see the results of the tests. The columns of most interest
    are the b column, which contains the log2 ratio between the conditions, and the
    qval column which contains the adjusted p-value for each target/transcript.


    # Using Sleuth to analyze time course experiments


    Multiple-condition, multiple-level experiments, such as timecourse experiments,
    are more difficult to analyze than simple comparisons because they involve a greater
    amount of data and complexity. In a timecourse experiment, for example, the goal
    is to understand how a biological system changes over time in response to a particular
    treatment or condition. This requires analyzing data from multiple timepoints
    and conditions, which can make the data more complex and harder to interpret.


    One aspect that makes timecourse experiments more difficult is the filter function
    in the sleuth_prep() filter argument. This function is used to filter out low-quality
    or non-informative data from the analysis. The filter function works by excluding
    targets that are not present in a minimum percentage of samples. In a simple comparison,
    the filter function is relatively straightforward to apply and identify any samples
    or transcripts that do not meet the desired count in most samples. However, in
    a timecourse experiment, there are multiple conditions and multiple timepoints,
    and genes in one sample could easily be absent from others, which means that the
    filter function must be applied separately to each condition and timepoint. This
    can make the filtering process more time-consuming and complicated.


    To overcome this limitation, the filter function in the sleuth_prep() filter argument
    can be overridden with a custom filter function that is tailored to the specific
    needs of the experiment. In this recipe, we’ll look at how to compose a custom
    filter function for per-condition filtering.'
