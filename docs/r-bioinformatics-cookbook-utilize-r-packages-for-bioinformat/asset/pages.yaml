    # # How it works...


    In step 1, the RNAseqData.HNRPC.bam.chr14,TxDb.Hsapiens.UCSC.hg19.knownGene and
    SGSeq libraries are loaded. The RNAseqData.HNRPC.bam.chr14 library contains the
    BAM files of alignments we used, whereas TxDb.Hsapiens.UCSC.hg19.knownGene contains
    the annotations.


    The TxDb.Hsapiens.UCSC.hg19.knownGene library is a Bioconductor annotation library
    that provides transcript annotation for the human genome (hg19). It is used to
    load, extract, and manipulate information about transcriptional features from
    a specific genome build.


    In step 2, a new variable txdb is created, which is a TxDb object that contains
    the transcript annotation for the human genome hg19. The keepLevels() function
    is then used on the txdb to keep only the sequence for chromosome 14; it filters
    out all other chromosomes. The seqLevelsStyle() function is then used to set the
    style of the sequence levels to NCBI.


    In step 3, the txdb variable is passed to the convertToTxFeatures() function to
    coerce the object into a feature representation and save it in a new variable
    called txf_uscsc, which contains the transcript features. The seqLevels() function
    is then used to rename the sequence levels so that they match the convention in
    the input BAM files, which is chr14. The convertToSeqFeatures() function is then
    used to create a new variable called sgf_uscsc that contains the spliced features
    needed by SGSeq. The analysis can take a long time in this step, perhaps an hour.


    In step 4, the analyzeFeatures function is used to analyze the transcript features
    using the sample information DataFrame and the transcript feature data. It processes
    the input data, aligns the reads in the BAM files to the transcript features,
    and calculates expression values for each feature in each sample. The expression
    values are calculated as the total number of reads that align with the feature,
    normalized by the length of the feature and the total number of reads in the sample.
    The resulting expression values are then used as input for downstream analysis,
    such as visualization and variant analysis. The function returns a SGFeatureCollection
    object, which is a data structure that contains the expression values as well
    as additional information about the features, as gene IDs and exon IDs.


    The output of the analyzeFeatures function is assigned to the sgf variable, which
    can be used for further analysis and visualization.'
