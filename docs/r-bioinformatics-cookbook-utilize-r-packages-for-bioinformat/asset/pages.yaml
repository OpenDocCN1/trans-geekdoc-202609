- pgno: 214
  md: "# Getting ready\n\nWe'll need a tabix index VCF file; one is provided in the\
    \ rbioinf package. To extract it, we'll use the fs package. For analysis, we shall\
    \ use the VariantAnnotation Bioconductor package.\n\n# How to do it...\n\nSelecting\
    \ and classifying variants with VariantAnnotation can be done by:\n\n+   1. Create\
    \ a prefilter function:\n\n```\nlibrary(VariantAnnotation)\nis_not_microsat <-\
    \ function(x) { igrepl(\"microsat\", x, fixed = TRUE) }\n```\n\n+   2. Load the\
    \ prefilter function:\n\n```\nprefilters <- FilterRules(list(microsat = is_not_microsat)\
    \ )\n```\n\n+   3. Create a filter to keep variants where the reference allele\
    \ is represented in less half the reads:\n\n```\nmajor_alt <- function(x) {\n\
    af <- info(x) $AF ## also geno(fixed)\nresult <- unlist(lapply(af, function(x)\
    \ (x[1] < 0.5))\nreturn(result)\n}\n```\n\n+   4. Load the filter function into\
    \ a FilterRules object:\n\n```\nfilters <- FilterRules(list(alt_is_major = major_alt)\
    \ )\n```\n\n+   5. Load the input VCF and apply filters:\n\n```\nvcf_file <- fs::path_package(\"\
    extdata\")\n  \"sample.vcf.gz\",\n  package=\"rbioinfcookbook\"\n)\nfilterVcf(vcf_file,\
    \ \"hg17\", \"filtered.vcf\", prefilters =\nprefilters, filters = filters)\n```\n\
    \nThis is all we need to do to filter variants."
