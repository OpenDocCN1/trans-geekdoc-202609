    # Defining a task and learner to implement k-nearest neighbors (k-NNs) in mlr


    The k-nearest neighbors (k-NN) classification is a non-parametric ML algorithm
    for classifying data points based on their proximity to other labeled data points.
    The algorithm determines the class membership of an unlabeled data point by examining
    the classes of its k-NNs in the feature space. The dataset consists of labeled
    data points, where each data point has a set of features (attributes) and belongs
    to a specific class or category. The value of k represents the number of nearest
    neighbors to consider for classification. It is typically chosen by cross-validation
    or other model selection techniques. The algorithm measures the distance between
    the unlabeled data point and all the data points in the space. The most commonly
    used distance metric is Euclidean distance. The k data points with the shortest
    distances to the unlabeled point are identified as its nearest neighbors. The
    algorithm assigns the class label that is most prevalent among the k-NNs to the
    unlabeled data point. It is a good first algorithm when predicting classes in
    a supervised manner.


    The mlr provides a framework for efficiently carrying out many ML tasks, including
    k-NN. The package allows us to define a task object that describes the data we
    wish to train models on and create a learner object that defines parameters such
    as training/test sets and on which sets we can train a model. The package allows
    us to use the trained learner object with test splits and provides performance
    measures to evaluate the model.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# Defining a task and learner to implement k-nearest neighbors (k-NNs) in mlr3
    291


    In this recipe, we''ll use mlr3 to build a classifier for breast cancer tumor
    data. A set of measurements have been taken from tumors identified as either benign
    or malignant.


    # Getting ready


    For this recipe, we will need to install the mlr3, knnn, and mlr3viz packages.
    We will use the BreastCancer object from the ML specific data package mlbench.


    # How to do it..


    Here''s how we begin classifying using kNN with mlr3:


    +   1. Load the data and set up the task:

    ```r

    library(mlr3)

    library(mlr3viz)

    library(mlbench)

    data("BreastCancer")


    selected <- BreastCancer[c("Cl.thickness", "Cell.size", "Cell.shape", "Marg.adhesion",
    "Epith.c.size", "Bl.chromatin", "Normal.nucleoli", "Mitoses", "Class")

    )]


    task <- as_task_classif(selected, target="Class")

    autoplot(task)

    ```


    +   3. Specify the train/test data partition:

    ```r

    split <- partition(task, ratio=0.8)

    ```


    +   4. Train the model:

    ```r

    learner$train(task, split$train)

    learner$model

    ```'
  merge: -1
  img_proc: true
