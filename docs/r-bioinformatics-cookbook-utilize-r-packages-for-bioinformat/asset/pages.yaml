  md: '![](img/dd0d7d9aaacf496c4d1d0e31d83783b3_73_0.png)


    Figure 3.2 – Second iteration with better options and a more reactive layout


    And that gives us a plot with many different types combined.


    # There''s more...


    The next layer of making ggplot2 plots intelligently is to declare mappings between
    a variable and some visual aspect using aesthetic, encapsulated in the function
    called aes (). We can use this to map shapes, line colors, fill colors, and point
    size, among other attributes, to the plot. In our plot, the variable of interest
    is species, we can add aesthetic mappings to that follows; note that the global
    aes() for size applies to all geoms, whereas the geom-specific ones apply only
    within the geom they are declared in.


    The following code shows how to do this:


    ```

    penguins | |

    dplyr::filter(!is.na(sex)) | |

    gggplot() + |

    aes(x = bill_length_mm, y = bill_length_mm, size = island) + |

    geom_point(aes(shape = sex), alpha = 0.5 ) + |

    scale_colour_brewer(palette = "Set2")

    ```'
