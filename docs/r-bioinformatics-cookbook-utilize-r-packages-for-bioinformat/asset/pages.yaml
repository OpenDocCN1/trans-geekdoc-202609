  md: '# Combining tables using join functions


    5. Stack two data frames:


    ```

    mol_func <- filter(mo_go_evidence, `GO domain` == ''molecular

    function'')

    cell_comp <- filter(mo_go_evidence, `GO domain` == ''cellular

    component'')


    bind_rows(mol_func, cell_comp)

    ```


    6. Put two data frames by side:


    ```

    small_mol_func <- head(mol_func, 15)

    small_cell_comp <- head(cell_comp, 15)

    bind_cols(small_mol_func, small_cell_comp)

    ```


    And with that, we have joined data frames into one in most possible ways.


    # How it works..


    The code joins different data frames in various. The mo_gene_exp, mo_terms, mo_go_acc,
    and mo_go_evidence objects are data frames, and they are loaded using the rbioinf
    library. Then, the first operation is to add terms using the left_join() function.
    The left_join() function joins the mo_gene_exp and mo_terms data frames on the
    gene_id column of the mo_gene_exp data frame and the stable ID column of the mo_terms
    data frame. Note the increase in rows as well as columns because of the multiple
    matching rows.


    By step 2, we are adding accession numbers using the right_join() function to
    join the mo_go_acc data frame and the result of the first join (x) on the Gene
    stable ID column of the mo_go_acc data frame and the x data frame. Ordering the
    data frames minimizes the number of rows; see step 5 for how the converse goes.
    Note that the right_join() function returns the full set of rows from the right
    data frame.


    Step 3:inner_join() demonstrates that only the rows shared are returned. The remaining
    steps create subsets of the mo_go_evidence data frame based on to highlight how
    bind_rows() does a name-unaware stacking and bind_cols() does a bind left-right
    paste concatenation of data frames. These last two functions are quick and easy
    but do not do anything clever, be sure that the data can be properly joined this
    way.'
