  md: '# How it works...


    The first step is to make sure that we have cleaned and scaled the data, in step
    1, we a tidyverse style pipeline to remove NA (using drop_na()), remove the uninformative
    year column using select (-year), and add a new row-based ID column. We keep this
    with penguins filtered in order to retain the species data we need. We go on to
    extract the numeric columns to a new dataframe, the ID column to the rownames
    attribute (so, really out of the actual dataframe), and then when we have numeric
    columns that we want to visualize, we can apply the scale () function to bring
    all the data into similar ranges and prevent the algorithm from giving one variable
    more weight than others.


    In step 2, we start t-SNE by loading the library and preparing a data structure
    to hold the values of the parameter search space. The expand.grid() function returns
    a dataframe of all combinations of the vectors passed to, so we get a perp column
    (for perplexity) with values 5 to 50 in increments of 10 and a dim column (for
    dimension) with values 1 to 3. Next, we define a function that can conduct t-sne
    using passed the perplexity and dimension parameters. The object is passed into
    a dataframe to record the parameters and results. After the function is defined,
    we run it on the search space using purr::map2, which will iterate over two equal-sized
    vectors—the two columns in space—and send their values to the named function,
    t-sne. The resulting list of data frames is condensed into a single dataframe.


    Step 3 is a standard ggplot2 plot of the data, showing in each facet the visualization
    for each combination of the two parameters we varied. We get a result like the
