- pgno: 355
  md: "# Working with lists in purr\n\nLists are incredibly useful data structures\
    \ that allow you to store and organize various types of objects, as vectors, matrices,\
    \ dataframes, and even other lists. Unlike vectors, matrices, or dataframes, lists\
    \ can accommodate different data types and structures within a single object.\
    \ This flexibility makes them a powerful tool for data manipulation and analysis\
    \ in R.\n\nAs a result the purr package provides lots of functions for working\
    \ with lists, and in this short recipe, we'll look at a few for summarizing, simplifying,\
    \ and extracting data.\n\n# Getting ready\n\nWe'll just need the purr package.\n\
    \n# How to do it...\n\nWe can manipulate lists in purr using the following functions:\n\
    \n+   1. Filter a list of elements:\n\n```\nset.seed(2345)\n1 <- list(\n  a =\
    \ rnorm(10, mean = 1),\n  b = rnorm(10, mean = 10),\n  c = rnorm(10, mean = 20)\n\
    )\n\nlibrary(purrr)\n\nkeep(1, function(x) mean(x) >= 10)\nkeep(1, ~ mean(.x)\
    \ >= 10)\ndetect_index(1, ~ mean(.x) >= 10)\nevery(1, ~ mean(.x) >= 10)\nsome(1,\
    \ ~ mean(.x) >= 10)\n```\n\n+   2. Rework the list:\n\n```\nnames <- c(\"ones\"\
