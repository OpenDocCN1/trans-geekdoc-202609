  md: '# Technical requirements


    We will use renv to manage packages in a project-specific way. To use renv to
    install packages, you will first need to install the renv package. You can do
    this by running the following commands in your R console:


    +   1. Install renv


    ```

    install.packages("renv")

    ```


    +   2. Create a new renv environment:


    ```

    renv::init()

    ```


    This will create a new directory called .renv in your current project directory.


    +   3. You can then install packages with this:


    ```

    renv::install_packages()

    ```


    +   4. You can also use the renv package manager to install Bioconductor packages
    by running the following command:


    ```

    renv::install("bioc::package name")

    ```


    +   5. For example, to install the BioBase package, you would run the following:


    ```

    renv::install("bioc::BioBase")

    ```


    +   6. You can use renv to install development packages from GitHub like this:


    ```

    renv::install("user name/repo name")

    ```


    +   7. For example, to install the dammaclean user rbioinfocookbook package, you
    would run the following:


    ```

    renv::install("dammacle/rbioinfocookbook")

    ```


    You can also install multiple packages at once by separating the package names
    with a comma. The renv tool will automatically handle installing any required
    dependencies for the packages you install.


    Under renv, all packages will be installed into the local project directory and
    not the main library, meaning you can have multiple versions of the same package,
    one specific for each project.


    All the sample data you need for this package is in the specially created data
    package on GitHub, dammaclean/rbioinfocookbook. The data will become available
    in your project after installing that.'
