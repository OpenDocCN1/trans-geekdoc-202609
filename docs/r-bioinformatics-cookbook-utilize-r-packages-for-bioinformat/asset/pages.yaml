    ```


    Render the plot in drawProteins:


    ```

    library(drawProteins)

    protein_df <- dplyr::bind_rows(chain_df, domain_df)


    draw_canvas(protein_df) |>

    draw_chains(protein_df) |>

    draw_domains(protein_df, label_domains = TRUE)

    ```


    With that, we have a nice plot of the protein and its domains.


    # How it works...


    The key to using drawProteins is to get the DataFrame format right. The structure
    is shallow but hierarchical within a single DataFrame. Each protein is referenced
    as a chain defined in rows; this is what we did in step 1. Consider this to be
    the backbone that defines the extent of the protein. The type column must contain
    the length of the sequence of amino acids. accession should contain an accession
    if one is available, and the entryName should contain the key that identifies
    this protein - so, a unique protein name. The taxid column is a little irrelevant
    most of the time and I usually put the National Center for Biotechnology Information
    (NCBI) taxonomy identifier for Arabidopsis (2712). The order determines the position
    the protein will be drawn on the Axis, so each row should be unique.


    In step 2, we set up the next layer of structure, defining the domains that will
    be plotted onto the backbones. type must be "DOMAIN". description gives us us
    name. This doesn''t need to be unique - the same sort of domain can appear on
    multiple proteins. In this DataFrame, begin, end, and length refer to the values
    for the individual domain on the particular protein. The crucial column, entryName,
    defines which protein domain belongs to. Again, taxid is largely irrelevant. order
    is the position on the Y axis that the domain should render, so it should match
    the order of protein it belongs to.


    By step 3, we can combine the DataFrames into one and then pass that to drawProteins
    functions to draw the things. The output looks like what''s shown in Figure 8.2:'
