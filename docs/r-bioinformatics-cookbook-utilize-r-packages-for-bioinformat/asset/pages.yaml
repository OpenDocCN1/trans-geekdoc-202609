    +   2. Create a new renv environment:


    ```

    renv::init()

    ```


    This will create a new directory called .renv in your current project directory.


    +   3. You can then install packages with the following command:


    ```

    renv::install_packages()

    ```


    +   4. You can also use the renv package manager to install Bioconductor packages
    by running the following command:


    ```

    renv::install("bioc::package_name")

    ```


    +   5. For example, to install the Biobase package, you would run the following:


    ```

    renv::install("bioc::Biobase")

    ```


    +   6. You can use renv to install development packages from GitHub, like so:


    ```

    renv::install("user name/repo name")

    ```


    +   7. For example, to install the danmacaclean user’s rbioinfcookbook package,
    you would run the following:


    ```

    renv::install("danmacaclean/rbioinfcookbook")

    ```


    You can also install multiple packages at once by separating the package names
    with a comma. renv will automatically handle installing any required dependencies
    for the packages you install.'
