    k <- head (e, keytype = "GENEID", n = 3 )

    ```


    +   3. Pull out the relevant:


    ```

    select(e, keys = GeneIdFilter(k),

    columns = c("XBIOTYPE","UNIPROT",

    "PROTEINID","INTERPROACCESSION"))

    ```


    This is all the code we need.


