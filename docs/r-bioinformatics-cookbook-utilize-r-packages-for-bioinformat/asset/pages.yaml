    # Estimating differential expression with Kallisto and Sleuth


    Kallisto is an RNA-Seq read aligner that uses a pseudoalignment algorithm, which
    allows it to map reads to a reference transcriptome without using traditional
    alignment methods such as Smithman or Needleman-Wunsch. It uses a k-mer index
    of the reference transcriptome to quickly and accurately quantify expression levels
    of transcripts. This allows Kallisto to run much faster than traditional algorithms,
    making it a popular choice for large-scale RNA-Seq experiments.


    The companion R package Sleuth is a tool for analyzing the output from Kallisto.
    Kallisto allows users to perform differential expression analysis and identify
    transcripts that are differentially expressed between different samples or conditions.
    Sleuth uses a Bayesian framework to model the expression levels of transcripts
    and take into account technical variability in the data, such as sequencing depth
    and batch effects. The package also provides several visualization tools to help
    users explain the results of their analysis.


    Sleuth uses a statistical model called hierarchical beta-binomial model to quantify
    the expression levels of transcripts. This model takes into account the variability
    of the sequencing data, such as the number of reads mapped to each transcript,
    to estimate the expression levels with greater precision. Additionally, Sleuth
    can consider any known covariates, such as treatment conditions, to help control
    for any potential confounding effects. In this recipe, we''ll learn how to use
    Kallisto and Sleuth to do differential gene expression.


    # Getting ready


    For this recipe, we''ll need to have Kallisto installed, which we can do with
    bioconda. Assuming bioconda is set up, you can run this in your terminal to install
    Kallisto:


    ```

    conda install -c bioconda kallisto

    ```


    You''ll need Sleuth, too.


    We''ll be using human RNA-Seq reads from the https://doi.org/10.5281/zenodo.1294051
    example dataset. We will have three replicates from a male human sample and three
    replicates from a female human sample. The experiment used paired-end Illumina
    reads, so there will be two files per sample and a reference FASTA file of transcripts.'
