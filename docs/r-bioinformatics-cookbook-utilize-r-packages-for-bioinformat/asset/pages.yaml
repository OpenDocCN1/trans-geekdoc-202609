    Basically, a significant coefficient is one that has a non-zero slope and is an
    important determinant of the output value. $Estimate$ is the actual value of the
    coefficient from the model. These are given in the units of the data. $Std$. Error
    is a measure of the variability of the strength of the effect, so if some data
    points give more pronounced values at'
