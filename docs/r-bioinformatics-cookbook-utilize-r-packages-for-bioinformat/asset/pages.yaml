- pgno: 286
  md: '# Phylogenetic Analysis and Visualization


    In step 6, we define our functions for the processing of the BLAST results. The
    `parse_hits()` function is simple in concept - it just wants to read the BLAST
    CSV file and return a dataframe-style object - it goes about in a fashion that
    is robust and efficient computationally, to aid in reading large files. First,
    `col_names` contains a vector of column names for our hit table, then we use readr
    for the data, being very careful to explicitly set the column types we expect
    to load. Things can easily go wrong in big files this seemingly verbose approach
    can pay off when something goes a bit awry. The readr command is wrapped in a
    call to `data.table()`, which converts the object to a robust `data.table` object,
    optimized for work on large datasets. The `col_names` vector is used to name the
    columns in the data table and keys for fast indexing by `query_id` and `subject_id`
    The function returns the prepared data table.


    Step 7 defines a filter function that will find the best hit (by value) for each
    query protein in the data table. The function actually receives a section of the
    data table - all lines with the same query - at each invocation, it works by checking
    for the hits that have the lowest value of the eval variable in the section of
    the table. If there are equal E-values, the one with the longest length is returned,
    and if there is more than one, it returns the first one (essentially, a random
    return).


    In step 8, we use our `parse` and `filter` functions to load in the BLAST results,
    grouped by query, and filter out the best hit for each query. We do this for each
    direction of BLAST, giving us two data tables of hits for each direction.


    Finally, in step 9, we use the `semi_join()` function from `dplyr` to join the
    two data tables on query and subject IDs, keeping only rows that are complements
    in each. The rbh object contains the reciprocal best BLAST hits. Note that this
    is a selected dataset, so all 100 sequences find their best RBH.


    # See also


    All of the functionality here – and more – is included in the GitHub "HajkD/ortholog"
    package. But it requires a central installation of BLAST (specifically for makeblastdb),
    and not just a conda-based one. So, if you''re happy that and messing with system
    PATH variables, give it a go. To get it working, you''ll have to manually install
    these dependencies from Bioconductor: Biostrings, GenomicRanges, GenomicFeatures,
    Rsamtools, and rtracklayer. When it''s ready, look for the `blast_rec()` function.'
  merge: -1
  img_proc: true
