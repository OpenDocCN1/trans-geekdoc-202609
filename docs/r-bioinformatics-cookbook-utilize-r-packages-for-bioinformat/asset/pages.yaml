  md: '# Getting ready


    We''ll need the ensmbdb, EnsDb.Rnorvegicus.v79, and biomaRt packages from Bioconductor.


    # How to do it...


    Finding InterPro domains can be done by performing the following steps:


    +   1. Load the necessary libraries and check for protein data in the database:


    ```

