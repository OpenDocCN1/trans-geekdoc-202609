    # # How it works...


    The first part of any data analysis is to clean the dataset. Even though this
    is a recipe, we still have to do that here. Step 1* loads the packages we will
    need and the BreastCancer dataset. Some of the columns in BreastCancer contain
    NA values and character data that we use, so we select the numeric and factor
    data columns we need. Then, we use mlr3::as_task_class() to set up the task object—this
    is essentially the dataset wrapped so that it can be used by other mlr3 functions.
    The object knows the sort of task (classification) that is to be carried out with
    it, so it can warn you if you try to do something inapplicable later. The autoplot()
    function generates a plot of the target data for us, as seen in Figure 11.1:


    ![](img/dd0d7d9aaacf496c4d1d0e31d83783b3_314_0.png)


    Figure 11.1 – A visualization of the classes in the target of our BreastCancer
    data'
