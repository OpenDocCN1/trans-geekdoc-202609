  md: "# Getting ready\n\nWe need some code to interpret – we'll use a function from\
    \ the beshr Github hosted package at https://github.com/TeamMacLean/beshr/blob/master/R/functions.R\
    \ and an account with ChatGPT from https://chat.openai.com/.\n\n# How to do it...\n\
    \nHere's how to work in a ChatGPT session and get it to explain some code to you:\n\
    \n+   Paste the following code into the ChatGPT prompt box:\n```r\n# Convert named\
    \ columns to factors\n#\n# code{factorise_cols} returns a copy of the passed data\
    \ frame\nin which all\n# explicitly named columns are converted to factors with\
    \ \\ncode{as.factor}\n# All columns with only NA values are omitted.\n#\n# @param\
    \ df data frame\n# @param col_list vector of quoted column names\n# @keywords\
    \ internal\n#\nfactorise_cols <- function(df, col_list) {\n  not_all_na <- function(x)\
    \ any(!is.na(x))\n\n  for ( i in col_list) {\n    df <- dplyr::mutate(!!(i)) :=\
    \ as.factor(!!(i))\n  }\n  df <- dplyr::select_if(not_all_na)\n}\n```\n\n+   Read\
    \ the response:\nThis R code defines a function called `factorise_cols` that converts\
    \ explicitly named columns of a data frame into factors using the `as.factor`\
    \ function. The function takes two parameters:\n\n+   1. `df`: This is the data\
    \ frame that contains the columns to be converted."
