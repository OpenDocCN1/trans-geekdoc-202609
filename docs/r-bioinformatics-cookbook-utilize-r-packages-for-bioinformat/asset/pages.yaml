    \ that can be used with the package. The package will then scan genomic regions\
    \ and output a list of significantly enriched windows, around the mean signal\
    \ level within each window. This recipe will teach you how to use high-throughput\
    \ alignment and a set of thresholds defining a peak region with the bumhunter\
    \ package to discover regions of alignment bumps.\n\n# Getting ready\n\nWe'll\
