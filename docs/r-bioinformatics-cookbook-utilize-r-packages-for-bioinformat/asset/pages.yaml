  md: "# How it works...\n\nIn this simple recipe, we take advantage of ChatGPT's\
    \ ability to predict documentation from defined code. This works well and plays\
    \ to ChatGPT's statistical strengths as the documentation follows an extremely\
    \ structured format that is quite predictable. In step 1, we simply ask for Roxygen2\
    \ format documentation since this is most widely used in R, and pass the function\
    \ to be documented.\n\nStep 2 shows the output from one run; we have a nicely\
    \ formatted and clear description, and ChatGPT has created usage examples for\
    \ the user. A nice time saver for us.\n\n# There's more...\n\nYou can go one step\
    \ further with this and ask ChatGPT to make the code more readable for humans\
    \ with a prompt like this:\n\n```\nTidy up the following R function for ease of\
    \ human readability:\nfactorise_cols <- function(df, col_list) {\nnot_all_na <-\
    \ function(x) any(!is.na(x))\n\nfor ( i in col_list) {\n  df <- df %>% dplyr::mutate(!!(i))\
    \ := as.factor(!!(i)) )\n}\ndf <- df %>%select_if(not_all_na)\n\n```\n\nWe get\
    \ the following response:\n\n```\n# Factorise Selected Columns\n#\n# This function\
    \ factorises the selected columns in a data frame.\n#\n# @param df A data frame.\n\
    # @param col_list A character vector specifying the names of the\ncolumns to be\
