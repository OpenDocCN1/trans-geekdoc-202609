    # Using dplyr to summarize data in large tables


    Split-apply-combine is a technique used in data science to analyze and manipulate
    large datasets by breaking them down into smaller, more manageable pieces, applying
    a function or operation to each piece, and then combining the results. It''s a
    powerful method for working with data that allows you to process and analyze data
    in a way that is both efficient and interpretable. The process can be repeated
    multiple times to gain deeper insights into the data.


    In the tidyverse, the dplyr package provides a set of tools for implementing the
    split-apply-combine technique; we''ll look at this in this recipe.


    # Getting ready


    We will need the dplyr and tidyr packages for this recipe.


    # How to do it...


    The functionality of the dplyr package for split-apply-combine techniques is shown
    in the following steps:


    +   1. Create the initial data frame:

    ```

    chromosome_id <- c(1,1,1,2,2,3,3)

    gene_id <- c("A1","A2","A3","B1","B2","C1","C2","C3")

    strand <- c("forward","reverse","forward","forward","reverse","forward","forward","reverse")

    length <- c(200,1500,2300,2500,2000,1000,2000,3000)

    genes_df <- data.frame(chromosome_id,gene_id,strand,length)

    ```


    +   2. Group on a single column:

    ```

    library(dplyr)

    ngenes_df | |

    group_by(chromosome_id) | |

    summarise(total_length = sum(length))

    ```'
