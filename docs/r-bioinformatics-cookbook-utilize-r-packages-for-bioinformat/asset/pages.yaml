  md: '# Performing Quantitative RNA-seq


    A simple vector like this do, but you can also use the factor object - R''s categorical
    data type. Factors are vectors of integers under the hood but they have associated
    name labels called levels. These are used instead of numbers to give you a prettier
    read out the factor. The factor object retains all levels it knows, even when
    a subset is taken without all levels, which sometimes results in empty levels.


    Step 4 creates a subset of the count_matrix object called counts_of_interest that
    includes only the columns produced by the columns_of_interest object.


    Step 5 loads the edgeR library and then a DEGList object called count_dge using
    the DEGList() function. The counts of _interest object and the grouping factor
    are passed as arguments to DEGList().


    Step 6 performs differential expression analysis on the count_dge object using
    a series of functions from the edgeR package. We first create the experimental
    design descriptor object with the matrix() function using the grouping variable.
    The estimateDisp() function is used to estimate the dispersion parameter of the
    count data, the glmQLFit() function is used to fit a generalized linear model
    to the data, and the glmQLTest() function is used to perform a likelihood ratio
    test to identify differentially expressed genes. The resulting object is stored
    in an object called result. Finally, the topTags() function is used to display
    the top differentially expressed genes. The columns show the name, the F value,
    the P value, and the false detection rate (FDR), which is usually the column from
    which we make statistical conclusions.


    # Using edgeR from an ExpressionSet object


    Step 1 displays the first few rows of data stored in an ExpressionSet object called
    modcodefely. using the head() function. This can be useful for inspecting the
    data to ensure it is correctly loaded and to get a structure of the data.


    Step 2 defines an object called experiments_of_interest that contains the L1Larvae
    and L2Larvae character strings. Another object called counts_of_interest is created
    by using the which() function to identify the indices of the columns in phenData()
    of modcodefely. eset, where the stage column is equal to one of the elements of
    interest. This step is used to specify which experiments to include in the differential
    expression analysis and to identify the columns of the data that corresponds to
    these experiments.


    Step 3 creates a grouping factor called grouping by extracting the stage column
    using the phenData() function, which extracts phenodata from modcodefely. eset
    and then removes unused levels of the factor using the droplevel(). The grouping
    factor is used to specify which samples belong to which experimental group and
    will be used in the differential expression analysis.'
