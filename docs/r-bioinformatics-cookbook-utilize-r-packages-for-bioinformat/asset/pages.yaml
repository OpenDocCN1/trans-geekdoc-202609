    library(bumhunter)\nclusters <- bumhunter::clusterMaker(pileup_df$seganames,\n\
    \  pileup_df$pos,\n  maxGap = 100\n)\n```\n\n+   Find the bumps with a minimum\
    \ cutoff:\n```r\nfinal_bumps <- bumhunter::regionFinder(pileup_df$count,\n  pileup_df$seganames,\n\
