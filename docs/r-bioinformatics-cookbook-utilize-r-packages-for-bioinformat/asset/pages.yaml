    # How it works...


    In step 1, the AllelicImbalance, VariantAnnotation, and rbioinfra libraries are
    loaded. The AllelicImbalance package provides a set of tools for identifying,
    quantifying, and visualizing ASE in high-throughput sequencing data. The VariantAnnotation
    package is used for reading variant data in VCF format and丰富 contains the data
    we need. The region_of_interest variable is defined as a GRanges object containing
    the coordinates of a region on chromosome 17, in this case 79478301 and 79478361.
    The bam_folder variable is defined as the path to the folder containing the allele_expression_data,
    as provided by the rbioinfra package.


    In step 2, the reads are defined as in the region of interest using the impBamGAL
    function from the AllelicImbalance package, by specifying the BAM folder and the
    region of interest, with verbose to false. The vcf_file variable is defined as
    the path to the VCF file containing the variants, and the variant_positions variable
    is defined as the positions of the variants in the form of a GRanges object. The
    allele_counts variable is defined by passing reads and variant_positions to the
    getAlleleCounts function, which counts the number of alleles at each position
    and stores them in the allele_counts variable.


    In step 3, the ase.vcf variable is created by passing variant_positions and allele_counts
    to the ASEsetFromCountList function, creating an ASEset object that contains information
    about the allele-specific expression for each variant. The reference_sequence
    variable is defined as the path to a reference sequence FASTA file that is passed
    to the refAllele function. This function sets the reference allele for each variant
    in the ASEset object. The inferAltAllele function is used to infer the alternate
    alleles for each variant in the ASEset object.'
