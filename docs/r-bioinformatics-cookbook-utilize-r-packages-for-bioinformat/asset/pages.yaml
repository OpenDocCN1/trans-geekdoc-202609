  md: "# Plotting variability and confidence intervals better with ggdist\n\nTogether,\
    \ these steps show us how to make highlighted plots.\n\n# Plotting variability\
    \ and confidence intervals better with ggdist\n\nConfidence intervals are used\
    \ to make inferences about a population based on a sample of data. They capture\
    \ the variability of the data by providing a range of possible values for some\
    \ parameter, rather than a single point estimate. The interval is a measure of\
    \ how sure we are that the interval contains the true population parameter. It\
    \ is common to share distributions and annotate them with range markers or confidence\
    \ intervals. With this recipe, we will look at how to use ggplot::ggdist extension\
    \ to make informative and great-looking plots of distributions.\n\n# Getting ready\n\
    \nFor this recipe, we need the ggdist, ggplot2, and palmerpenguins packages.\n\
    \n# How to do it...\n\nWe can create plots with confidence intervals as follows:\n\
    \n+   1. Create a raincloud plot:\n\n```\nlibrary(ggplot2)\nlibrary(ggdist)\n\
    library(palmerpenguins)\n\ngggplot(penguins) +\naes(x = flipper_length_mm, y =\
    \ island) +\ngeom_dots(side = \"bottomleft\", aes(colour = island)) +\nstat_slabinterval(aes(fill\
    \ = island)) +\ntheme_minimal()\n```\n\n+   2. Delimit arbitrary regions in a\
    \ curve:\n\n```\nggplot(penguins) +\naes(x = flipper_length_mm, y = island) +\n\
    stat_halfeey(aes(fill=(x > 190 & x < 200))) + \ngeom_vline(xintercept = c(190,\
    \ 200), linetype = \"dashed\") +\nscale_fill_manual(values = c(\"gray\", \"steelblue\"\
    )) +\ntheme_minimal()\n```"
  merge: -1
  img_proc: true
