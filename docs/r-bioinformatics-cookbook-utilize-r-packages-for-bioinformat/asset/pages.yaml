  md: "# Creating figures of protein domains using drawProteins\n\nProtein visualization\
    \ is a powerful tool in bioinformatics that allows researchers to explore the\
    \ structure and function of proteins. Visualizing proteins in two domains can\
    \ help researchers understand and compare the structures of different proteins,\
    \ which can reveal similarities and differences that may be important for understanding\
    \ their function. This can be particularly useful in the study of evolutionary\
    \ relationships between proteins.\n\nIn this recipe, we'll look at a package drawProteins\
    \ that can create two-dimensional renders of proteins and their domains. The package\
    \ seems to have been designed to work best with Uniprot data input, but we'll\
    \ look at setting up data so that you can use protein and domain information from\
    \ any source.\n\n# Getting ready\n\nTo complete this recipe, you will need the\
    \ drawProteins Bioconductor package. We'll generate the sample data in the code\
    \ as understanding it is the key part of this recipe.\n\n# How to do it...\n\n\
    Rendering some proteins into a two-dimensional structure begins by defining the\
    \ DataFrames of chain elements to be plotted:\n\n+   1. Define a DataFrame of\
    \ chain information:\n\n```\nchain_df <- tibble(\n  \"type\" = \"CHAIN\",\n  \"\
    description\" = c(\"example protein\", \"different protein\"),\n  \"begin\" =\
    \ c(1,1),\n  \"end\" = c(300, 450),\n  \"length\" = c(300, 450),\n  \"accession\"\
    \ = c(\"AB1\", \"AB2\"),\n  \"entryName\" = c(\"protein_1\", \"protein_2\"),\n\
    \  \"taxid\" = c(2712, 2712),\n  \"order\" = c(1,2)\n)\n```\n\n+   2. Define a\
    \ DataFrame of domain information:\n\n```\ndomain_df <- tibble(\n  \"type\" =\
    \ \"DOMAIN\",\n  \"description\" = c(\"dom1\", \"dom1\", \"dom2\"),\n  \"begin\"\
    \ = c(100, 150, 350),\n  \"end\" = c(200, 250, 420),\n  \"length\" = c(100, 100,\
    \ 70)\n)\n```"
  merge: -1
  img_proc: true
