    # How it works...


    We start with step 1 by examining some functions to tidy the common lm object,
    created by the lm() function. The first task is to create the object, so we perform
    a multiple regression with the mtcars data, and then use the tidy() function to
    return an object summary of the components of the model. It looks like this:


