- pgno: 377
  md: "# How to do it...\n\nTo write unit tests for an R function with ChatGPT, do\
    \ the following:\n\n+   1. Paste the following request into ChatGPT:\n\n```\n\
    write unit tests for the following R code\n\nfactorise_cols <- function(df, col_list)\
    \ {\n  not_all_na <- function(x) any(!!is.na(x))\n\n  for ( i in col_list) {\n\
    \    df <- df %>% dplyr::mutate(!!(i) := as.factor(!!(i)))\n  }\n  df %>% dplyr::select_if(not_all_na)\n\
    }\n```\n\n+   2. Read and check the output:\n\n```\nlibrary(dplyr)\nlibrary(testthat)\n\
    \n# Create a test data frame\ntest_df <- data.frame(\ncol1 = c(\"A\", \"B\", \"\
    C\", NA),\ncol2 = c(1, 2, NA, 4),\ncol3 = c(\"X\", \"Y\", \"Z\", NA)\n)\n\n# Define\
    \ the expected output for the test data frame\nexpected_df <- data.frame(\ncol1\
    \ = factor(\"A\", \"B\", \"C\", NA)),\ncol3 = factor(\"X\", \"Y\", \"Z\", NA)\n\
    )\n\n# Start defining the unit tests\ntest_that(\"factorise_cols correctly factorises\
    \ selected columns\", {\n  # Call the factorise_cols function\n  result_df <-\
    \ factorise_cols(test_df, c(\"col1\", c(\"col3\\))\n\n  # Check if the selected\
    \ columns are factorised\n  expect_equal(result_df$col1, expected_df$col1)\n \
    \ expect_equal(result_df$col3, expected_df$col3)\n})\n```"
  merge: -1
