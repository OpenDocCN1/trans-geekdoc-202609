- pgno: 67
  md: '# # 3 ggplotplot2 and Extensions for Publication Quality Plots


    Clear and informative data visualizations are the most important tool that bioinformaticians
    have to effectively communicate complex data and findings to other scientists
    in the field. They allow for easy and efficient exploration and understanding
    of large and complex datasets. The process of creating a good visualization is
    very iterative, and many drafts of a visualization are discarded before a final
    one is settled on, so it is important that we are plotting tools that allow for
    quick and easy plot creation and customization.


    ggplot2 is a popular data visualization library in R that provides an elegant
    solution for bioinformaticians. It is based on the Grammar of Graphics, a principle
    that allows users to easily create complex and customizable visualizations by
    breaking them down into small, modular components, defined by a consistent interface.
    These make ggplot2 highly flexible and allow for the creation of a wide variety
    of visualizations. ggplot2 has been extended in multiple packages, meaning a small
    ecosystem of ready-to-go visualization types exists that can help us create more
    complex and informative visualizations or make them ready for publication through
    layout and labeling. In this chapter, we will look at many ways to use the palmerpenguins
    package, which provides measurements of types such as the bill and flipper size
    of different species living on different islands off the coast of Antarctica.
    Other times, we will use gene expression data from the devastating rice pathogen
    *Magnaporthe oryza*. All the datasets have the common attribute of being tidy
    data frames—they have one observation per row and one column per variable being
    measured measured Once loaded, they can all be printed to screen for inspection,
    should you wish to look at how the structure relates to the plots.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'In this chapter, we will cover the following recipes:


    +   - Combining many plot types in ggplot2


    +   - Comparing changes in distributions with ggridges


    +   - Customizing plots with ggeasy


    +   - Highlighting selected values in busy plots with gghighlight


    +   - Plotting variability and confidence intervals better with ggdistist


    +   - Making interactive plots with plotly


    +   - Clarifying label placement from selected plot sections with facetzoom


    +   - Zooming and making callouts from selected plot sections with facetzoom


    +   - Composing multiple plots into single plots with cowplot and patchwork


    # # Technical requirements


    We use renv to manage packages in a project-specific way. To use renv to install
    packages, you will first need to install the renv package itself. Here''s how
    to install renv and then use it to install packages:


    +   1. Running the command in your R console:


    ```

    install.packages("renv")

    ```


    +   2. Next, you will need to create a new renv environment for your project by
    running the following command:


    ```

    renv::init()

    ```


    +   3. This will create a new directory called .renv in your current project directory.


    +   4. You can install packages with the following command:


    ```

    install.packages("<package name>")

    ```


    +   5. You can use the renv package manager to install Bioconductor packages by
    running the following command:


    ```

    renv::install("bioc::<package name>")

    ```


    +   6. For example, to install the Biobase, you would run the following command:


    ```

    renv::install("bioc::Biobase")

    ```


    +   7. You can use renv to install development packages from GitHub like this:


    ```

    renv::install("<user name>/<repo name>")

    ```'
  merge: -1
  img_proc: true
