    In R, it is standard practice to load a library and use functions directly by
    name. Although this is great in short interactive sessions, it can cause confusion
    when many packages are loaded at once and share function names. To clarify which
    package and function I am using at a given moment, I will occasionally use the
    packageName:`functionName() ` by convention.


    Sometimes in the middle of a recipe, I will interrupt the code to dive into some
    intermediate output or look at the structure of an object. When that happens,
    you will see a code block where each line begins with ## (double hash symbols).
    Consider the following command:


    This will give us the following output:


