  md: '# How it works...


    The recipe starts in step 1 by creating a YAML header so that Quarto know that
    the code in this page is for running in the server environment that the Shiny
    widgets need. The YAML header sets the title and output format (which must be
    html and the server type).


    In step 2, we set up the layout. The R block in the Quarto document takes the
    special option after hash-pipe symbols (#), telling Quarto that this bit of code
    goes in a sidebar layout. The R code that then follows two vectors that hold the
    names of the variables we will use as options in dynamic plot. Next, we use the
    selectInput() Shiny function to create dynamic input drop-down selectors. The
    first argument for each is the name that will be used to refer to this element
    in the code, the second is the label for the element in the rendered page, and
    the third is a list of values that the element will show in the rendered page—note
    we are using the values in num_vars and cat_vars.


    Step 3 we set up the layout further, adding a panel that will hold a rendered
    figure. We use the plotOutput() function to state that a plot will eventually
    be rendered here; the only argument to this function is the scatter_plot name
    that will be used to refer to the element in the code.


    In step 4, we get into the actual processing and plotting code. The # context:
    server option tells Quarto that this must be run on the server side, not in the
    per se, and that this will need to run every time the elements are updated. Making
    it work simple; after loading the libraries for data and plotting, we use the
    renderPlot() function to create a dynamic plot. The only argument is the plotting
    code—this is multiline code, so must be wrapped in an anonymous code block using
    } to make it a single thing of it. The code block uses ggplot to create a plot.
    Note that the built-in Shiny input object is where the values from the input elements
    go; each member of the input object corresponds to an element we created in our
    sidebar in step 2. We use aes_string to get around ggplot''s non-standard evaluation
    and values stored in variables, rather than variable names. Once the plot is created,
    we assign it to the built-in Shiny output object using the name we selected (scatter_plot)
    in step 3.


    Once our document is created and saved (for example, in a file named shiny.qmd),
    in step 5, we can serve it. This step is done on the command line. The output
    is an address on the local machine, which can sometimes be clicked or cut and
    pasted into the web browser address bar to view the running interactive page.'
