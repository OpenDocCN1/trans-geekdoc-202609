  md: '# Presenting RNA-Seq data using ComplexHeatmap


    In step 2, the code creates color palettes for the different types of data in
    the heatmap. Data_col_func is a function that was created using the colorize::colorRamp
    function, which maps the values to the range of colors provided by the viridis::magma
    function, with a total of 6 colors. data_col_func will be called later to generate
    colors dynamically across a range. The colorRamp () takes two arguments, the first
    being a range of numerical values, and the second being the scale to derive color
    values.


    ecotype_code is an RColorBrewer-derived palette of 12 colors from the Set3 palette
    and five from the Set1 palette (we have 17 ecotypes and RColorBrewer have a maximum
    of 12 colors in its biggest palette, so we must borrow colors from the complementary
    palette). part_colors is an RColorBrewer palette consisting of three colors for
    highlighting the plant information. The RColorBrewer::pal () function provides
    predefined color palettes. It takes two arguments – the first one is the number
    of colors and the second one is the name of the palette.


    The names of the ecotype_codes and part_colors are assigned to the unique elements
    in ecotype and part, respectively, so that the resulting annotation will be color-coded
    based on these unique elements.


    In step 3, the code creates two annotation that will be displayed alongside the
    main heatmap. top_annot is created using the HeatmapAnnotation () function and
    will display the ecotype and plant part information. The annotation_name_side
    argument is set to left so that the columns are shown to the left of the annotation.


    The side_annot is created using the rowAnnotation() function. This function is
    used to add an annotation to the rows of the heatmap – in this case, it is used
    to display the length of the samples. The length argument is used to specify the
    length of the annotation – in this case, the lengths of the samples. The anno
    points () function is used to specify the positions of the points; it takes at_tf_gxsLength
    as input, and the pch argument is used to specify the shape of the points. The
    size argument is used to specify the size of the points and the axis_param argument
    is used to specify the locations of the ticks on the X-axis.


    In step 4, the first heatmap is created using the Heatmap () function. mat is
    used as the input data. The row_km option is used to set the number of clusters
    for the rows – in this case, 6. The col option is set to data_col_func so that
    it can use the color palette that was created in step 2. top_annot and side_annot
    are used as annotations to display the ecotype, plant part, and length information.
    The cluster_columns = TRUE option allows the columns to be clustered based on
    their similarity. The column_split = ecotype option groups the columns by ecotype.
    The show_column_names = FALSE option is used to hide the column names and the
    column_title = " " sets the title of the columns as empty. On its own, this heatmap
    looks as follows:'
