    # There’s more...


    The preceding analysis can be extended to carry out per-strand and ASEtype tests
    if required. The code would need amending to introduce strand information in the
    ASE object construction. Doing usually requires that the RNA-Seq experiment and
    alignment steps were performed with strandedness in mind and the bioinformatics
    pipeline properly. Phenotype information can be added to the construction step
    using the colData parameter and a vector of phenotype or sample types for columns
    in the ASEt object.


    # Presenting RNA-Seq data using ComplexHeatmap


    A heatmap plot is a graphical representation of data where values are represented
    by colors, typically with a color scale. In bioinformatics, heatmap plots are
    often used to visualize large datasets and individuals in genomics data, such
    as variations in gene expression or mutation rates. They can be used to display
    data from a wide range of sources, such as microarray, RNA-Seq, and ChIP-Seq.
    Heatmap plots are particularly useful for visualizing data in large matrices,
    such as gene expression data, where the rows represent the genes and the columns
    represent the samples.


    When creating heatmap plots, it is important to use accessible color schemes that
    can be easily interpreted by a wide range of users. Using a color scale that easily
    distinguishes individuals with color vision deficiencies and a consistent color
    scheme across different plots is crucial. A legend is also needed here. A perceptually
    uniform color scheme is a color map where the difference between two adjacent
    color stops is perceived as being the same across the entire range. It allows
    accurate data interpretation, which is particularly useful in scientific data
    plots, where the goal is to accurately convey information about the data. The
    viridis package in R provides a set of color maps designed to be perceptually
    uniform. These color maps are widely used in bioinformatics and are popular due
    to their simplicity of use and accessibility. Similarly, the ColorBrewer maps
    are useful for distinct categorical or diverging palettes.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'The R Bioconductor ComplexHeatmap package is an advanced tool for creating
    heatmap plots that can handle large datasets. It provides a wide range of functionalities
    for creating, customizing, and annotating heatmaps, the ability to layer multiple
    heatmaps on top of each other and add annotations as gene ontology terms. Additionally,
    the package can also be used to create heatmaps of other types of data, such as
    chromatin accessibility data.


    This package can be used to create a heatmap of gene expression data, for example,
    where each row represents a gene, and each column represents a sample. The package
    can also provide a range of customizations, such as changing the color scale and
    color legend, adding annotations to the heatmap, or even creating a combination
    of heatmaps by combining multiple data sources. This is particularly useful for
    combining different types of data in a single plot, such as combining the expression
    data with the annotation data, and helps in interpreting the data.


    In this recipe, we''ll take some matrices of data representing RNA-Seq expression
    in log-fold format and create multipanel annotated heatmaps using ComplexHeatmap.


    # Getting ready


    This visualization recipe needs a few packages, including ComplexHeatmap for our
    main plot. We''ll use stringr so that we can work with strings and sort labels
    and the data from rbioinfocbook package. The rest - viridisLite, RColorBrewer,
    and circlize - are all for using color schemes.


    # How to do it...


    This fun task can be accomplished as follows:


    +   1. Load the data and divide the columns by data type:


    ```

    library(ComplexHeatmap)

    library(viridisLite)

    library(stringr)

    library(RColorBrewer)

    library(circlize)

    library(rbioinfocbook)


    mat <- log(as.matrix(at_tf_gex{ 5, 55}))

    ecotype <- stringr::str_split(colnames(mat), ", ", simplify=TRUE)

    [,1]

    part <- stringr::str_split(colnames(mat), ", ", simplify=TRUE)

    [,2]

    ```'
  merge: -1
  img_proc: true
