    contents are as follows:


    +   * ''baseMean'': The mean of the normalized counts across all samples.

    * ''log2FoldChange'': The log2-fold change in expression between the levels of
    the factor being compared in the contrast argument.

    * ''lfSE'': The standard error of the ''log2FoldChange'' value.

    * ''stat'': The test statistic for the hypothesis test for differential expression.

    * ''pvalue'': The p-value for the hypothesis test for differential expression.

    * ''padj'': The adjusted p-value, which takes into account the multiple hypothesis
    testing problem. Genes with a small ''padj'' value are considered differentially
    expressed.


