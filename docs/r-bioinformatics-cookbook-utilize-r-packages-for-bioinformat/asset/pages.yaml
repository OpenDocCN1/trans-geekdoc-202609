  md: '118 Easily Performing Statistical Tests Using Linear Models


    And that is how we perform a test for an interaction and plot to check our conclusions
    against the representation of the data.


    # Doing tests for differences in data in two categorical variables


    Categorical output variables, also known as response variables or dependent variables,
    are variables that take on discrete values from a finite set of possible outcomes.
    We can consider that there are two types of categorical variables: nominal and
    ordinal.


    Ordinal variables have a natural ordering among the categories. Examples of ordinal
    variables include education level, income bracket, and satisfaction ratings. In
    linear models, ordinal variables can be represented using their numerical values
    or by assigning each category a numerical rank. For example, in a linear model
    predicting job satisfaction by salary, the ordinal income bracket could be assigned
    a numerical rank from one to five based on the size of the income range. Ranking
    helps us to use the linear model fairly easily.


    Nominal variables are that have no inherent order or ranking among the categories.
    Examples of nominal variables include gender, race, and occupation. In linear
    models, nominal variables are often represented using dummy variables or one-hot
    encoding. Dummy variables are binary variables that indicate whether an observation
    belongs to a particular category or not. For example, in a linear model predicting
    income based on gender, a male might be assigned a value of 1 for the male gender
    dummy variable, while a female is assigned 0. Modeling these gets tricky and requires
    us to build and compare different models. So instead of modeling in the way we''ve
    done previously, we will look at using proportional tests to analyze data of this
    sort. A typical proportional test people in bioinformatics are familiar with the
    chi-squared (χ²) test, which is a special case of a 2x2 category test.


    In this recipe, we shall look at ordinal and nominal cases.


    # Getting ready


    To examine ordinal categorical data, we shall use some data on plant disease scoring.
    The data frame contains information on three strains of a pathogen (control, mild,
    and deadly), some replicate catoric score from a visual disease scoring exercise.
    For the nominal case, we will use tabulated frequencies of side effects reported
    by patients after different test treatment regimes. Both datasets are from the
    rbioinfccookbook package. We will also use some methods from dplyr, multcomp,
    and rcompanion.'
  merge: -1
  img_proc: true
