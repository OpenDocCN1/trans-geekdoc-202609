  md: "# See also\n\nThe data.table package has a similar aim to readr and is especially\
    \ good for very large data frames where speed is important.\n\n# Tidying a wide\
    \ format table into a tidy table with tidyr\n\nThe tidyr package in R is a package\
    \ that provides tools for tidying and reshaping data. It is designed to make it\
    \ easy to work with data in a consistent and structured format, which is known\
    \ as tidy format. Tidy is a standard way of organizing data that makes it easy\
    \ to perform data analysis and visualization.\n\nThe main principles of tidy data\
    \ are as follows:\n\n+   * Each variable forms a column\n* Each observation forms\
    \ a row\n* Each type of observational unit forms a table\n\nData in tidy format\
    \ is easier to work with because the structure of the data is consistent, facilitating\
