    # Finding protein domains with PFAM and bio3d


    Decoding the function of a protein sequence is a key task. We can do this in many
    ways, including conducting whole sequence searches against databases of known
    proteins using tools as BLAST. If we want more informative and granular information,
    we can instead look for individual functional domains within a sequence. Databases
    such as PFAM and tools as hmmmer encode domains from Hidden Markov Models, which
    hmmmer uses to scan sequences and report any likely occurrences of the domains.
    Often, gene annotation projects will carry out the searches for us, which is a
    question of searching a database. Bioconductor does a great job of packing up
    the data in these databases in particular packages, usually with names ending
    in .db. In this recipe, we’ll look at how to work out'
