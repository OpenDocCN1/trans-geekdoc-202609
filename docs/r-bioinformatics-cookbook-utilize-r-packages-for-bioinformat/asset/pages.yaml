    # Testing and accounting for interactions between variables in linear models


    An interaction between variables occurs when the effect of one predictor variable
    on the response variable depends on the level of another predictor variable. In
    other words, the effect of one variable is not constant across different levels
    of the other. The interaction can occur between different drug regimes in medical
    trials or generally multiple experimental conditions being changed.


    Linear models can model interactions by including interaction terms in the model
    formula. An interaction term is the product of two or more predictor variables,
    where each predictor variable is centered to a mean of zero.


    Suppose we have linear regression model with two predictor variables, x1 and x2,
    and we want to examine their interaction. The interaction term can be included
    in the model as follows:


    ```

    $y = \beta_0 + \beta_1x_1 + \beta_2x_2 + \beta_3(x_1 \times x_2) + \epsilon$

    ```


    In this model, $y$ is the response variable; $x_1$ and $x_2$ are predictor variables;
    $\beta_0$ is the intercept; $\beta_1$ and $\beta_2$ are the coefficients for $x_1$
    and $x_2$ respectively; $\beta_3$ is the coefficient for the interaction term
    between $x_1$ and $x_2$; and $\epsilon$ is the error term.


    These models are complicated, and you need to take particular care to interpret
    them and prevent confounding results and making wrong conclusions from the data.
    In this recipe, we will look at how to detect a potential interaction using a
    simple graphical method and how to model it in a'
  merge: -1
  img_proc: true
