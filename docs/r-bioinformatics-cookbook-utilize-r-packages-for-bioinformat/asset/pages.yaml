    Figure 1.3 – The settings dialog box


    And with that, we should have a working, self-contained R project.


    # How it works...


    In *Step 1*, we use the RStudio to create a new project in our new directory.
    The wizard sets up all the bits we need, including a `.Rproj` file for keeping
    track of the project, and `.gitignore`, `.Rprofile`, and the `renv` folder for
    more automated use of Git and renv. The correct selections for the boxes can be
    seen in the preceding figures. Selecting **Use renv with this project** means
    that we package install with `install.packages()` or `renv::install()` will be
    directly installed into that renv folder instead of the central library R has,
    so the versions we use in this project will be specific to this project. Opening
    in a new session means that we get a new instance of R in memory without any previously
    loaded cache or pollution from existing objects.


    When the new session opens, it will have its base in the project folder, so all
    paths can be referenced from this point. Also, every time we want to come back
    to the project after shutting it down, we simply click the `.Rproj` file and an
    RStudio session will burst into life in the correct project folder.


    In *Step 2*, we use R in the console to create some useful directories: R for
    R source files containing things as reused functions; `data` for raw input processed
    by our analysis; `analysis` for Rmarkdown and other analysis style documents;
    `src` for scripts and things in non-R languages that are also used in the project.
    We name each of them a vector and get `supply()` to run the `dir.create` function
    on each one.'
