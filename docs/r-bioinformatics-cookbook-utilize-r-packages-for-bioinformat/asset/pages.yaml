    # Predicting open reading frames in line reference sequences


    A draft genome assembly of a previously unsequenced genome can be a rich source
    of biological knowledge, but when genome annotations are unavailable, it can be
    tricky to proceed. In this recipe, we''ll use a first-stage pipeline for finding
    potential genes and genomic loci of interest de novo and without information beyond.
    We''ll use a simple set of rules to find open reading frames (ORFs) – sequences
    that begin with a start codon and end with a stop codon. The tools for doing this
    are encapsulated within a single function in the systemPipe Bioconductor package.
    We''ll end up with another GRanges object that we can integrate into processes
    downstream that allow us to cross-reference other data, such as RNA-Seq. As a
    final step, we''ll look at how we can use a simulation to see which of the open
    reading frames are likely to be real and not just occurring by chance.


    # Getting ready


    In this recipe, we''ll use the short DNA sequence of the Arabidopsis chloroplast
    genome as input; it is provided with the rbiinfocbook package, so we''ll get the
    file out of that with the fs package and the Biostrings systemPipe Bioconductor
    packages.'
  merge: -1
  img_proc: true
- pgno: 207
  md: "# How to do it...\n\nPredicting open reading frames in long reference sequences\
    \ can be done by performing the following steps:\n\n+   1. Load the libraries\
    \ and input the genome:\n\n```\nlibrary(Biostrings)\nlibrary(systemPipeR)\n\n\
    dna_object <- readDNASet(\nfs::path_package(\"extdata\",\n  \"arabidopsis.chloroplast.fa\"\
    ,\n  package=\"rbioinfobook\"\n)\n)\n```\n\n+   2. Predict the ORFs:\n\n```\n\
    predicted_orfs <- predORF(dna_object, n = 'all', type = 'gr',\nmode='ORF', strand\
    \ = 'both', longest_disjoint = TRUE\npredicted_orfs\n```\n\n+   3. Calculate the\
    \ properties of the reference genome:\n\n```\nbases <- c(\"A\", \"C\", \"T\",\
    \ \"G\")nraw_seq_string <- strsplit(as.character(dna_object), \"\")\n\nseq_length\
    \ <- width(dna_object)\ncounts <- lapply(bases, function(x) {sum(grepl(x, raw_seq-\n\
    string))})\nprobs <- unlist(lapply(counts, function(base_count){signif(base_\n\
    count / seq_length, 2))})\n```\n\n+   4. Create a function that finds the longest\
    \ ORF in the simulated genome:\n\n```\nget_longest_orf_in_random_genome <- function(x)\n\
    \  length = 1000,\n  probs = c(0.25, 0.25, 0.25, 0.25),\n  bases = c(\"A\", \"\
    C\", \"T\", \"G\") {\n\nrandom_genome <- paste0(sample(bases, size = length, replace\
    \ =\nTRUE, prob = probs), collapse = \"\")\nrandom_dna_object <- DNAStringSet(random_genome)\n\
    names(random_dna_object) <- c(\"random_dna_string\")\norfs <- predORF(dna_object,\
    \ n = 1, type = 'gr',\nmode='ORF', strand = 'both', longest_disjoint = TRUE)\n\
    ```"
  merge: -1
  img_proc: true
