  md: "# See also\n\nThe plotly object works well with Shiny user interface (UI) elements.\
    \ Check that package out for a range of checkboxes and sliders that allow you\
    \ to dynamically alter inputs to the plotly object.\n\n# Clarifying label placement\
    \ with ggrepel\n\nBioinformatics datasets often have thousands of data points.\
    \ These can be genomic positions or genes within a genome, and as part of our\
    \ data analysis, we will frequently want to label positions or genes so that the\
    \ reader can identify them. A problem arises in that the labels easily overlap\
    \ or clash in the plots. The ggrepel package provides geoms for ggplot2 that allows\
    \ labels to be positioned more clearly, incorporating label layout algorithms\
    \ and connecting lines intelligently. In this recipe, we'll look at the most important\
    \ options for applying that to a genomics dataset.\n\n# Getting ready\n\nWe will\
    \ need the ggplot2 and ggrepel packages and the fission yeast gene expression\
    \ dataset in the rbioinfcookbook data package. This data frame contains yeast\
    \ gene IDs in one column, the log 2-fold change of gene expression for that, and\
    \ the p-value from a statistical test.\n\n# How to do it...\n\nWe can create a\
    \ noisy plot as follows:\n\n```\nlibrary(rbioinfcookbook)\nlibrary(ggplot2)\n\
    library(ggrepel)\n\nset.seed(44)\nfission_ge |>\ndplyr::mutate(\n  signif = dplyr::if_else(padj\
    \ < 0.05, TRUE, FALSE),\n  scaled_p = -log10(padj)\n) |>\ngplot() +\n  geom_text_repel(aes(x\
    \ = log2FoldChange, y = scaled_p, label = id),\n  max.time = 60,\n  point.padding\
    \ = NA,\n  arrow =\n    length = unit(0.03, \"npc\"),\n    type = \"closed\",\n\
    \    ends = \"last\"),\n```"
