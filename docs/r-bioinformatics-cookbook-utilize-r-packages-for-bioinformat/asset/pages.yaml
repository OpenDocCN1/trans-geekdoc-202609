    # See also


    There''s a lot more you can do with Quarto websites; once you''ve got the basic
    one running, you can add tools like commenting, headers, social metadata, Google
    Analytics, search, and different download modes, by just adding options to the
    configuration. Check the Quarto documentation (https://quarto.org/docs/guide/)
    for details.


    # Adding interactivity with Shiny


    Shiny is an R package that allows users to build interactive web applications
    and dashboards with R code. The package provides a framework for building user
    interfaces (UIs) using R functions and allows users to write server-side logic
    to respond to input and update the UI in real time.


    The basic structure of a Shiny application consists of two main components: the
    UI and the server-side logic. The UI is built using R functions that define the
    layout and structure of the web page, including input controls and output elements.
    The server-side logic is written in R code and runs on the server in response
    to user input. When a user interacts with the web page, the input is sent to the
    server, which processes the input and updates the UI in real time.


    Shiny elements can be incorporated into R Markdown documents alongside other text
    and R code, enabling us to make our analyses interactive if needed. Quarto can
    render and serve these documents. In this recipe, we''ll look at how to incorporate
    some basic interactivity elements into a Quarto document.


    # Getting ready


    As the other recipes here, we''ll need to install the Quarto tool, as described
    at the start of the chapter. We''ll also need the markdown package and the palmerpenguins
    package.


    # How to do it...


    Creating a Quarto document with Shiny widgets begins by creating an appropriate
    YAML header and then creating a document with code that creates the layout of
    widgets and code that runs on the server:


    +   1. Create a header:


    ```

    ---

    title: "Penguin Exploration"

    format: html

    ```'
