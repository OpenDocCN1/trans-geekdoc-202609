- pgno: 81
  md: "# How to do it...\n\nWe can highlight selected values in a plot such as a gene\
    \ expression plot using the following steps:\n\n+   1. Create a volcano plot,\
    \ highlighting significant genes:\n\n```\nlibrary (rbioinfookbook)\nlibrary (ggplot2)\n\
    library (ggighlight)\n\nfission_ge |\ndplyr::mutate(signif = dplyr::if_else(padj\
    \ < 0.05, TRUE, FALSE),\nscaled_p = -log10(padj)\n) |>\ngggplot() +\naes(x, y\
    \ = scaled_p) +\ngeom_point(aes(colour = signif)) +\ngghighlight(scaled_p > 10)\
    \ , \nlabel_key = id\n```\n\n+   2. Create a plot highlighting significant genes\
    \ in at least one time point:\n\n```\nggplot(ath_ts) +\naes(x, y=logFC) +\ngegeom_line(aes(colour\
    \ = target_id) + \nscale x continuous(breaks = c(0,3,6,12), labels = c(\"3h\"\
    , \"6h\", \"12h\")) +\ngghighlight(min(P.Value) < 0.05, \nunhighlighted_params\
    \ = list(linewidth = 0.5, \ncolour = alpha(\"gray\", 0.2))\n)\n```\n\nAnd that\
    \ simple code creates the plot we need.\n\n# How it works...\n\nThe first example\
    \ shows how we create a volcano plot, a common visualization in genomics plots\
    \ the p-value against the expression value, allowing us to see the most highly\
    \ expressed and significant genes. The fission_ge data comes from the package\
    \ we loaded, and we use dplyr::mutate to add a column called signif that marks\
    \ whether the gene is significant and a column called scaled_p that contains a\
    \ log transformation of the p-value that will scale the values more nicely on\
    \ the y-axis. The plot is straightforward, based on the geom_point () representation.\
    \ We can highlight interesting genes with the ggighlight () function. The most\
    \ important aspect of this function is the first argument, which makes up a logical\
    \ predicate; data points that pass this"
  merge: -1
  img_proc: true
