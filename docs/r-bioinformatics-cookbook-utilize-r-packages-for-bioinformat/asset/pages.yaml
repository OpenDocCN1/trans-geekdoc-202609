    # How it works...


    This is efficient code! In just a few lines, we were able to complete a whole
    analysis. In step 1, we created a function that would find the path to the external
    meme program. Then, in step 2, we loaded in a matrix description of a motif and
    some sequences we use to find the motif. In step 3, we scanned the sequences and
    found a universal motif and a DNAStringSet object to work with. The scan_sequences()
    function searches each of the sequences and reports where it finds motifs - check
    out the motif_hits object to see where they are. The object prints like:


    ```

    ## motif motif.i sequence sequence.i start stop score

    ## 1 YTTTTTTTTTTTTTY 1 AT1G5670 47 62 76 9.402

    ## 2 YTTTTTTTTTTTTTY 1 AT1G5670 47 65 79 10.290

    ```


    When it comes to working out whether a motif is enriched, enrich_motifs() does
    this work in step 4 and we use Fisher''s exact test to confirm the frequencies
    of motifs in our set of sequences. It searches the sequences to find instances
    of motifs and uses with their frequencies in an automatically generated background
    set. The final motif_info output contains a report of the p-value. To find novel
    motifs, we run the external software MEME in step 5. The run_meme() function needs
    to know where the MEME package is on your system, so we defined in the meme_path
    variable that we generated from our function in step 1.'
