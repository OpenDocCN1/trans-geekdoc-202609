    # Estimating the copy number at a locus of interest


    We will often want to know how often a sequence occurs in a sample of interest
    – to estimate whether in a given sample, a locus has been duplicated or its copy
    number has increased. The locus could be anything from a gene K at bp scale or
    a large section of DNA at a Mb scale. Our approach in this recipe will be use
    HTS reader coverage to estimate a background level of coverage and then compare
    it to the coverage in a region of interest. The ratio will give us an estimate
    of the copy number of our region of interest. This recipe is very simple – we
    only calculate a global mean, but we will discuss some alternatives later. This
    recipe does not cover polyploidy – the number of genomes in the whole cell. It
    is possible to estimate ploid from similar data but it is a more involved pipeline.
    Take a look at the See also section for recommendations on packages to use for
    analysis.


    # Getting ready


    For this recipe, we need the csaw Bioconductor package and the hg17_snps.bam dataset
    from the rbioinfcookbook package.


    # How to do it...


    Estimating the copy number of a locus of interest can be done by performing the
    following steps:


    +   1. Load the library and get counts across the genome:


    ```

    library(csaw)

    library(rbioinfcookbook)

    bam_file <- fs::path_package(

    "extdata",

    "hg17_snps.bam",

    package="rbioinfcookbook"

    )

    ```'
  merge: -1
  img_proc: true
