    Suffixed versions of map2 ( ) and pmap ( ) also exist.

    Step 3 finishes this recipe by using some other map ( ) functions. The map_dfc
    ( ) applies the log funciones expected, but instead of returning a list, it returns
    a dataframe of bound columns (hence_dfc):


    ```

