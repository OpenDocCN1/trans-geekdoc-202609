- pgno: 257
  md: '# # Phylogenetic Analysis and Visualization


    Phylogenetics is the study of the evolutionary relationships among species or
    other groups of organisms. It involves the use of molecular and computational
    techniques to construct phylogenetic trees, which depict the evolutionary history
    of the organisms under study.


    In bioinformatics, phylogenetics is studied using various computational tools
    and methods, including sequence alignment, distance-based methods, maximum likelihood,
    and Bayesian inference. These methods allow researchers to compare DNA or protein
    sequences from different organisms and infer their evolutionary relationships
    based on similarities and differences in their genetic makeup. Phylogenetics has
    many applications in biology, and is used to help understand the evolutionary
    history of species, to study the origins and spread of diseases (phylogenetic
    analysis can be used to trace the origins and spread of infectious diseases),
    and to inform conservation efforts by identifying species or populations that
    are evolutionarily distinct and particularly important to preserve.


    Phylogenetics has a long history in R and not just in Bioconductor. In the recipes
    in this chapter, we will take a good look at how to work with tree formats from
    a variety of sources. A key focus will be how to manipulate trees to focus on
    particular parts and with visualizations based on ggttree-based packages, and
    the latter''s usefulness in viewing and annotating large trees.


    In this chapter, we will cover the following recipes:


    +   - Reading and writing varied tree formats with `ape` and `treeio`n- Visualizing
    trees of many genes quickly with `ggtree`

    - Quantifying and estimating differences between trees with `treespace`

    - Extracting and working with subtrees using `ape`'
  merge: -1
  img_proc: true
