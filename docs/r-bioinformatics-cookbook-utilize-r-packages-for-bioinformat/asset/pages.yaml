  md: '# Creating data-rich presentations from code


    Presenting data to audiences of other scientists is a key task; it is vital for
    us to be able to understand and discuss our results and methods. Creating slides
    that assist our presentations is usually a manual task that requires the insertion
    of figures and methods into documents and is one that can consume a lot of researcher''s
    time. Microsoft PowerPoint is one of the most commonly used presentation tools.
    It is a user-friendly GUI program and provides a wide variety of templates, animations,
    transitions, and multimedia features. However, it requires a lot of manual effort.
    Beamer is a LaTeX-based presentation system used for academic and scientific presentations.
    It is a powerful tool and especially useful for presentations that mathematical
    equations, formulas, and algorithms. However, Beamer requires some knowledge of
    LaTeX, which can make it less accessible. Reveal.js is an open source, web-based
    presentation system that uses HTML, CSS, and JavaScript, designed to be highly
    customizable and for interactive presentations. Reveal.js requires a good level
    of understanding of its underlying technologies.


    The great advantage of using Quarto with an R Markdown document is that our presentations
    can become self-updating when the data changes. In this recipe, we''ll look at
    how to format a Markdown document containing R code so that we can render it as
    a presentation in the four formats mentioned.


    # Getting ready


    We''ll need the rbioinfocookbook package and the fs package for our template files.
    We''ll also need to have pre-installed Quarto, as described at the start of the
    chapter, and the ggplot2 packages for the pages themselves to run.


    # How to do it...


    Setting up a Markdown document for eventual rendering as a presentation might
    go like this:


    +   1. Set up the first slide as a second-level heading:


    ## Method


    ::: {.incremental}


    - Exploratory plot

    - Statistical modelling


    :::


    +   2. Set up the second slide to render a plot but not code:


    ## Relationship between cylinder count and Miles Per Gallon


    ```{r, point1, echo=FALSE}'
  merge: -1
  img_proc: true
