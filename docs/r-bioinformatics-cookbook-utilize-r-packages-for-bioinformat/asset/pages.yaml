    # How it works...


    The tidyr package has functions that work by allowing the user to specify a particular
    transformation that will be applied to the data to generate a new one. In this
    single step, we specify a row-count increasing operation that will find all the
    columns that contain age information. Next, we split the title of that column
    data into two new columns—one for the lower bound of the age category and for
    the upper bound of the age category. Then, we change the type of those columns
    to integer, and lastly, put the actual counts in a new column.


    The first function in this pipeline is code dplyr, which helps us rename column
    headings. Our age data columns are largely consistent, except for the lower bound
    and the upper one, so we rename those columns to match the pattern of them, simplifying
    the transformation specification.

    pivot_longer() function specifies the transform in the arguments, with the cols
    we choose to operate on any columns containing to. The names_pattern argument
    takes a regular expression (regex) that captures the bits of text before and after
    the string in the column names and uses them as values for the columns defined
    in the names_ argument. The actual counts from the cell are put into a new column
    called counts. The transformation is applied in one step and reduces the data
    frames count to, increasing the row count to 6,935, and in the process making
    the data tidy and easier to use in downstream packages.


    # See also


    The recipe uses a regex to describe a pattern in text. If you haven''t seen these
    before and need a primer, trying "regular expression" to view the R help on the
    topic.


