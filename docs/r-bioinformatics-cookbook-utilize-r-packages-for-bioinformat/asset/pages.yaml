  md: '# Modeling data with a linear model


    similar coefficient values, you get a higher variability of the strength. Generally,
    a lower standard error of the coefficient is good. The t-value is an estimate
    of how extreme the coefficient value is, meaning how many standard deviations
    away the estimated coefficient from the center of a presumed distribution with
    a mean of zero. It is absolutely a t-test-value, and in a t-test, we want it to
    be high. The higher the t value, the more likely the coefficient is not zero.
    Pr(|t|) is a weird shorthand that gives the probability of getting a value larger
    than the p-value. This comes from a t-test within the model and takes into account
    the dataset size and variability. You can think of this as the p-value of a test
    that asks whether the coefficient is equal to zero. If p is less than some value
    (e.g. 0.05), you can say that the value of the coefficient is not likely to be
    0 and is having an effect on the model.


    # There’s more...


    Assessing the model by these statistics is only the first level. The next level
    should always be to generate and analyze diagnostics. This is easily achieved
    with plot(model_1, which=1), which generates up to six diagnostics, specified
    by the next number to which argument. The first, using which=1, looks like the
    plot in Figure 5.1 and is called a residuals fitted plot. This plot is used to
    work out whether the residuals (the distance between the data points and the eventual
    fitted line of the model) have any pattern. There should be no pattern here since
    the distances should essentially be random. Any pattern indicates that the model
    does not fit the data well and may not be good. The flat line indicates that the
    residuals are fine in this model:


    ![](img/dd0d7d9aaacf496c4d1d0e31d83783b3_125_0.png)


    Figure 5.1 – residuals versus fitted plot on the PlantGrowth dataset


    The second plot, using which=2, is a normal Q-Q plot, as seen in Figure 5.2. This
    plot shows how well the data itself fits to an ideal normal distribution. The
    closer the points fit to the line, the better, though some slight deviation at
    the extreme ends is fine. The points at the end in Figure 5.2 look good enough:'
