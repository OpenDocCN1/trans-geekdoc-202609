    # Reading and writing varied tree formats with ape and treeio


    Phylogenetic analysis is a cornerstone of biology and bioinformatics. The programs
    are diverse and complex, the computations are long-running, and the datasets are
    often large. Many programs are standalone and have many proprietary input and
    output formats. This has created a very complex ecosystem that we must navigate
    when dealing with phylogenetic data, meaning that the simplest strategy is to
    use combinations of tools to load, convert, and see the results of analysis in
    order to use them in different packages. In this recipe, we''ll deal with phylogenetic
    tree data in R. To support a few packages have sufficient standardized objects
    such that workflows can focus on a few types and conversion to those types are
    streamlined. We''ll look at using the ape and treeio packages to get tree data
    out of R.


    # Getting ready


    For this section, we will need the tree and phylogenetic information provided
    by rbioinfocookbook package. One is a Newick format, the other is a Nexus format.
    They represent the same mammalian phylogeny. We''ll also need a tree from the
    BEAST program and a RAXML file. Both are taken from the treeio package, so we''ll
    need that from Bioconductor and the ape package.'
