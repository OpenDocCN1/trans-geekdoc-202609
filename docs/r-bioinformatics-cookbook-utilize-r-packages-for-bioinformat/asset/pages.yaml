    # Finding unannotated transcribed regions


    Finding unannotated regions can be useful in several different genomics applications.
    One of the main cases is identifying novel genes. Unannotated transcribed regions
    may represent novel genes that have not been previously identified.


    By identifying these regions, researchers can gain a better understanding of the
    genome and potentially discover new biological pathways or proteins. Another use
    case is identifying alternative splicing, where different exons are used to create
    different protein products. Identifying these events can provide insight into
    how the genome is regulated and how different proteins are produced from the same
    gene. Additionally, unannotated transcribed regions may include **untranslated
    RNAs (UTRs)**, lncRNAs, miRNAs, and other types of non-coding RNAs, which can
    provide a more complete understanding of the functional elements in the genome
    and characterize the non-coding genome. Lastly, unannotated transcribed regions
    may also be specific to certain tissues, which can provide insight into tissue-specific
    functions and pathways. In this recipe, we’ll learn how to find regions in a genome
    that have sequence reads that can be mapped to them but are not currently covered
    by our available annotation.'
