  md: '# Estimating differential expression with DESeq2


    Step 4 creates a subset of the data from modencodefly.eset counts_of_interest
    that includes only the columns specified by the columns_of_interest object. As
    we had for phenodata, we have a dedicated function for ExpressionSets that extract
    the expression values - exprs ( ). This step is used to extract only the data
