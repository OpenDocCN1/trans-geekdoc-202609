- pgno: 199
  md: '# 7 Finding Genetic Variants with HTS Data


    **High-throughput sequencing (HTS)** has made it possible to discover genetic
    variants and carry out genome-wide genotyping and haplotyping in many samples
    in a short space of time. The deluge of data that this technology has released
    created some unique opportunities for bioinformaticians and computer scientists,
    and really innovative new storage and data analysis pipelines have been created.
    The fundamental pipeline in variant calling starts with the quality control of
    HTS reads and aligning those to a reference genome. These steps invariably take
    place before analysis in R and typically result in a BAM file of read alignments
    or a **variant call file (VCF)** of variant positions that we''ll need to process
    in our R code


    As variant calling and analysis is such a fundamental technique in bioinformatics,
    Bioconductor is well-equipped with the tools we need to construct our software
    and perform our analysis. The key researchers will want to ask range from *Where
    are the genetic variants in my genome? To how many are there?* *How can I classify
    them?* In this chapter, we''ll take a look at some recipes that address these
    questions and also look at other important general techniques that allow us to
    visualize variants and markers on a genome and assess associations of variants
    with genotypes. We will also look at other definitions of the term **genetic variant**
    and see how we can assess the copy number of individual loci.


    In this chapter, we will cover the following recipes:


    +   - Finding SNPs and INDELs in sequence data using VariantTools

    - Predicting open reading frames in long reference sequences

    - Plotting features on genetic maps with karyoploteR

    - Selecting and classifying variants with VariantAnnotation

    - Extracting information in genomic regions of interest'
  merge: -1
  img_proc: true
