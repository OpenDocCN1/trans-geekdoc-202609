- pgno: 70
  md: "# Further information\n\nIn R, it is normal practice to load a library and\
    \ use functions directly by name. Although this is great in short interactive\
    \ sessions, it can cause confusion when many packages are loaded at once and share\
    \ function names. To clarify which package and function I am using at a given\
    \ moment, I will occasionally use the packageName : functionName convention.\n\
    \nSometimes, in the middle of a recipe, I will interrupt the code to dive into\
    \ some intermediate output or to look at the structure of an object. When that\
    \ happens, you'll see a code block where each line begins with ## (double hash\
    \ symbols). Consider the following command:\n\n```\nletters[1:5]\n```\n\nThis\
    \ will give you following output:\n\n```\n## a b c d e\n```\n\nNote that the output\
    \ lines are prefixed with ##.\n\n# Combining many plot types in ggplot2\n\nThe\
    \ layer model of ggplot2 is a key feature of the library that allows users to\
    \ create complex visualizations by building layers of data, aesthetics, and geoms.\
    \ Each layer represents a different aspect of the plot, and they are added on\
    \ top of each other to create the final visualization. In this recipe, we'll use\
    \ the layer model to create a complex plot of data in the palpenguins package.\
    \ It may be helpful to inspect the data in R directly by printing it to the screen.\
    \ Also, the package is well documented at https://allisonhorst.github.io/palmerpenguins/,\
    \ you should wish to look more into how it was generated.\n\n# Getting ready\n\
    \nInstall the ggplot2 and palmerpenguins packages.\n\n# How to do it...\n\nWe\
    \ can use the layer system to combine multiple plot types as follows:\n\n+   1.\
    \ Create the base for the plot:\n\n```\nlibrary(ggplot2)\nlibrary(palmerpenguins)\n\
    \np <- ggplot(data = penguins) + \naes(x = bill_length_mm, y = bill_depth_mm)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Layer the geoms:


    ```

    p +

    geom_point() +

    geom_smooth(method = "lm") +

    geom_boxplot()

    ```


    Order the geoms more helpfully:


    ```

    p +

    geom_boxplot() +

    geom_point() +

    geom_smooth(method = "lm")

    ```


    Iterate on axes:


    ```

    penguins |

    dplyr::filter(!is.na(sex)) |

    gpglot() +

    aes(x = species, y = bill_length_mm) +

    geom_boxplot(

    position = position_dodge(width = 0.75)

    )

    geom_dotplot(

    binaxis = ''y'',

    stackdir = ''center'',

    method = "histodotot",nposition = position_dodge(width = 0.75),

    alpha = 0.5,

    dotsize = .5

    )

    ```


    And that is all we need for the plot.


    # How it works...


    Step 1 sets up the basic plot object, giving the data and aesthetic layer that
    form the axes and limits of the eventual plot. The geom layers are not yet added,
    so viewing this plot (by typing p) will show an empty plot with just axes. Step
    2 adds the necessary geoms. Note in Figure 3.1 how the geoms are layered in the
    order declared such that the boxplot completely obscures the rest. We can take
    control of the order of geoms by calling them from the bottom up, so in step 3,
    we add the boxplot first and work through the point and smoothed line that we
    get a much more visible layering, as seen in Figure 3.2:'
  merge: -1
  img_proc: true
