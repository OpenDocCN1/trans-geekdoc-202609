- pgno: 17
  md: '# Preface


    In biology, genetics and genomics data is the driver of discovery. To harness
    the power of data, bioinformaticians rely on computational tools and none is more
    powerful in the statistical and visualization world than R. R Bioinformatics Cookbook,
    Second Edition, is designed to help you take control of all manner of bioinformatics
    analyses and to help you navigate the intricate world of bioinformatics with R.


    The R Bioinformatics Cookbook, Second Edition book is a resource for getting good
    done quickly. It will help researchers to sharpen their skills and broaden their
    knowledge of important packages such as the tidyverse for data management, ggplot
    for visualization, and mlr for machine learning and delves deeply into the comprehensive
    Bioconductor framework of tools tailored specifically towards the most taxing
    and common analyses in bioinformatics.


    # Who this book is for


    This book is for bioinformaticians, data analysts, researchers, and R developers
    who want to address intermediate to advanced biological and bioinformatics problems
    by learning through a recipe-based approach. Working knowledge of the R programming
    language and basic knowledge of bioinformatics are prerequisites.


    # What this book covers


    Chapter 1, Setting Up Your R Bioinformatics Working Environment, shows how to
    set up your computer and toolchain for easy and efficient work.


    Chapter 2, Loading, Tidying, and Cleaning Data in the tidyverse, shows how to
    load and prepare external tabular data for complex pipelines.


    Chapter 3, ggplot2 and Extensions for Publication Quality Plots, explains the
    structure of ggplots and how to create attractive and informative plots of many
    types.


    Chapter 4, Using Quarto to Make Data-Rich Reports, Presentations, and Websites,
    covers how to mix code and text into literate computing documents in a powerful
    and flexible way.


    Chapter 5, Easily Performing Statistical Tests Using Linear Models, explores how
    to do the most common tests in bioinformatics in R''s powerful statistical framework.


    Chapter 6, Performing Quantitative RNA-seq, uses the latest, most widely used
    tools for RNA-seq, including EdgeR, DESeq2, and sleuth.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# xviii Preface


    Chapter 7, Finding Genetic Variants with HTS Data, uses powerful Bioconductor
    packages to work with high-throughput genome sequencing data.


    Chapter 8, Searching Gene and Protein Sequences for Domains and Motifs, explores
    functional sequence features using predictive tools and databases.


    Chapter 9, Phylogenetic Analysis and Visualization, looks at carrying out genome
    and gene alignments and how to create attractive and informative phylogenetic
    trees.


    Chapter 10, Analyzing Gene Annotations, shows how to infer biological properties
    of gene sets from annotations of those genes.


    Chapter 11, Machine Learning with mlr3, explains how to develop and effective
    pipelines for machine learning with the powerful and flexible mlr3 package.


    Chapter 12, Functional Programming with purrr and base R, shows how to apply functional
    programming to streamline and empower your analysis pipelines.


    Chapter 13, Turbo-Charging Development in R with ChatGPT, explains how to make
    R code development and testing easier by making use of the latest ChatGPT models.


    # To get the most out of this book


    The book assumes you have a basic working knowledge of R in the console and that
    you have a background in biology or life sciences. The book won''t try and teach
    you any biology; instead, we concentrate on applications of R within science.
    You will learn lots of new things about R that will enhance your bioinformatics
    research.


    | Software/hardware covered in the book | Operating system requirements |

    |---|---|n| R 4.2 or greater | Windows, macOS, or Linux |

    | Python 3.8 or greater | Windows, macOS, or Linux |


    Many individual R packages and some external tools are needed. All will be discussed
    in the relevant chapters and recipes so make sure to read the Getting ready...
    sections.


    If you are using the digital version of this book, we advise you to type the code
    yourself or access the code from the GitHub repository (a link is available in
    the next section). Doing so will help you avoid any potential errors related to
    the copying and pasting of code.


    The sample data for this book is provided in an R package that you can install
    from within R. Look out for advice on how to do in the relevant chapters and recipes.
    The code won''t work without the sample data, so look out for that.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Download the example code files


    You can download the example code files for this book from GitHub at https://github.com/PacktPublishing/R-Bioinformatics-Cookbook-Second-Edition-.
    If there''s an update to the code, it will be updated in the GitHub repository.


    We also have other code bundles from our rich catalog of books and videos available
    at https://github.com/PacktPublishing/. Check them out!


    # Conventions used


    There are a number of text conventions used throughout this book.


    Code in text: Indicates code words in text, database table names, folder names,
    filenames, extensions, pathnames, dummy URLs, user input, and Twitter handles.
    Here is an example: "Create a README.md file at the root to describe the project"


    A block of code is as follows:


    ```

    /Users/macleand/Desktop/rccookbook/Ch_1/renv/library/R-4.3/aarch64-apple-darwin20/rbioctxt/extdata/my_project

    ```


    Any command-line input or output is written as follows:


    **Bold:** Indicates a new term, an important word, or words that you see onscreen.
    For instance, words in menus or dialog boxes appear **bold**. Here is an example:
    "Lastly, check **Open in new session**."


    > Tips or important notes

    Appear like this.


