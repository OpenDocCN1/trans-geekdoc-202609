    \ ggplot2, and geom_text_repel() is used—note that the aesthetic is declared in\
    \ the geom with aes() rather than ours. We must set the label mapping to render\
    \ the labels. The parameters for this geom are to allow maximum readability and\
    \ space for the labels. The max.time parameter limits the algorithm runtime; setting\
    \ point.padding removes the maximum distance the label can be from the point and\
    \ allows the label to float far from the one it belongs to. The arrow function\
    \ defines the properties of the line joining labels and points. The force parameter\
    \ defines how labels overlap (defaulting to 1, this is strong). The final parameter,\
    \ xlim, defines a boundary on labels on the x axis; setting values to NA means\
    \ the labels can float outside of the plot area, which is useful as some very\
    \ busy plots can still run out of room. A corresponding parameter exists for the\
    \ y axis. The plot is produced as seen in Figure 3.15. A keen-eyed reader will\
    \ notice that most points don't actually have a label. This is because the max.overlaps\
    \ removes labels that overlap too many things; the default value that we have\
    \ used is 10:\n\n![](img/dd0d7d9aaacf496c4d1d0e31d83783b3_89_0.png)\n\nAs we can\
    \ see, the plot we have created makes the best use of the space available for\
