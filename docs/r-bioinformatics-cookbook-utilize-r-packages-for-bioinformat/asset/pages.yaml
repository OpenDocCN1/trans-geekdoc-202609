    The detail is largely correct; certainly, it is sufficient to give us a clear
    idea of what the code attempts to do and how it does it.


    Some parts of the explanation aren’t clear, in *step 3*, we ask for clarification
    of a tricky bit, again by typing into the prompt box. And in *step 4*, we see
    a more in-depth description of that part.


    In this way, we can get a clear and readable, plain English description of the
    job done by a particular piece of code very quickly.


    # There’s...


    Other sites can do this, such as Google’s Bard. ChatGPT Plus – a subscription
    service –also has special plug-ins that help make working with code much easier.'
