  md: 'Loading, Tidying, and Cleaning Data in the tidyverse


    Finally, we look at mutate() in nested data frames. We begin by creating a data
    frame of genes and expression values and use the nest() function to create a nested
    data frame. We can then use the combination of mutate() and map() functions from
    the purrr package, to extract tissue1_value and tissue2_value columns from the
