- pgno: 352
  md: "# Using the map family of functions in purrr\n\nR's base functional programming\
    \ tool kit is the purrr package was created in order to extend it and create a\
    \ complete and consistent set of tools for working with functions and data structures.\
    \ purrr provides a set of functions for functional programming, including the\
    \ widely used map family of functions. The map functions allow you to iterate\
    \ over a collection (such as a list or vector) and apply a function to each element,\
    \ returning the results as a list or vector.\n\nThe functions vary according to\
    \ what they expect as input, what they iterate over, and what types and structures\
    \ they return. Like the apply functions, they can simplify repetitive tasks, such\
    \ as data manipulation or model fitting, by automatically handling the iteration\
    \ process for you but by ensuring they always return the specified types and structures\
    \ they help us to build more streamlined and effective code that is less prone\
    \ to bugs.\n\nIn this recipe, we'll look at some examples of the map family in\
    \ use.\n\n# Getting ready\n\nFor this recipe, we just need the purrr package.\n\
    \n# How to do it...\n\nUsing the map family of functions can be done in the following\
    \ examples:\n\n+   1. Use the basic map () to get back a list iterating over different\
    \ inputs:\n\n```\nlibrary(purrr)\ndf <- data.frame(\n  small_nums = 1:3,\n  big_nums\
    \ = c(100, 200, 300)\n)\n\nmeans <- map(df, mean, na.rm=TRUE)\n\nnorm <- map2(df,\
    \ means, function(o, m){o / m })\n\nresult <- pmap(list(df, means, norm), function(o,\
    \ m, n){\n  data.frame(original_value = o,\n  means = m,\n  normalised = n)\n\
    } )\n```"
  merge: -1
  img_proc: true
- pgno: 353
  md: '2. Use the suffixed forms to force a return type:


    ```

    map_dbl(df, mean)

    map_chr(df, mean)

    map_lgl(df, mean)

    ```


    3. Examine other forms:


    ```

    map_dfc(df, log)

    walk_result <- walk(df, print)

    ```


    That is all we need to know to use map functions.


    # How it works..


    Step uses the most common forms of map(). At the start of this step, we set up
    a data frame as a structure to work on, then first use map() to iterate over that
    dataframe, calling the map() function on each element. In this case, the element
    is each column of the dataframe. We get back a list, which looks like this:


    ```

    ## $small_nums

    ## [1] 2

    ##

    ## $big_nums

    ## [1] 200

    ```


    Each list is named after the original dataframe and contains the result of the
    function.


    We use this list (m) as input to map2(), which iterates over two things, the second
    being the original dataframe (o). We ask text to apply a custom function that
    divides the original values by the mean (o / m), thereby normalizing the data
    to give us norm, which looks like this:


    ```

    ## $small_nums

    ## [1] 0.5 1.0 1.5

    ##

    ## $big_nums

    ## [1] 0.5 1.0 1.5

    ```


    In last line of step 1, we use map() to iterate over an arbitrary number of things
    by wrapping them in a first list. We can then apply any function to them and the
    elements are taken from them in turn and used in the function. Here, we use the
    data.frame() function to make a dataframe of the results:


    ```

    ## $small_nums

    ## original_value means normalised

    ## 1 2 0.5

    ```'
