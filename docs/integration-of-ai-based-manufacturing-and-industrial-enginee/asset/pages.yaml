  md: 'f) *Mean average precision* (mAP):

    This metric evaluates the correctness of the target detections across various
    categories in each data set. It is computed as the average of AP across all the
    categories and is given as Eq. 6.5


    mAP = 1/M Σ_{x=1}^{M} AP_x  (6.5)


    where, x indicated the xth class and M denotes the sum of all the classes being
    assessed.


    g) *Localization recall precision* (LRP):

    The widely used AP metric and PR curve are often unable to distinguish between
    various PR curves and lack the ability to directly measure the accuracy of localization
    associated with each BB. To cope up with the issues, Oksuz et al. (2018) proposed
    a novel metric LRP error which comprise of components associated with object localization,
    FN and FP rates and is computed as Eq. 6.6


    LRP(M,Ns) = 1 / (Z_TP + Z_FP + Z_FN) [ Σ_{x=1}^{Z_TP} (1 - IoU(M_x, N_{M_x}))/(1
    - τ) + Z_FN + Z_FP ]  (6.6)


    Here, M is the set of actual BBs, N is the set of estimated BBs, s denotes score
    threshold having value between 0 and 1, τ denotes IoU cut-off valued between 0
    and 1, and Z_TP, Z_FP Z_FN are the number of true positive, false positives and
    false negatives respectively.


    # 6.3.2 TRACKING PERFORMANCE METRICS


    Performance metrics used to compare various object tracking algorithms must exhibit
    two substantial properties. Firstly, they must address all the false negatives,
    identity switches, false positives, deviations, and fragmentations. Second, they
    must be monotonic and should have differentiable error types. The metrics must
    include data on the performance of tracker for each of the five major error categories.
    Some commonly used tracking performance metrics are discussed below:


    (a) *Track-mAP*:

    Track-mAP compares estimates to the ground truth along a trajectory. It requires
    a track similarity score to be calculated between the trajectories and a threshold,
    with trajectories being paired only if the track similarity score is above the
    threshold. If TP_tr is the true positive trajectory, FP_tr is the false positive
    trajectory, GT_tr is the ground truth trajectory and g is the index, then precision
    and recall are given by (Eq. 6.7) and (Eq. 6.8) as'
