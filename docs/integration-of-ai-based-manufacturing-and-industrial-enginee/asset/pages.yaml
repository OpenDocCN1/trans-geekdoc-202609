    # 8.3 AUTOMATED PROVISIONING ARCHITECTURE


    The main objective of this system is to develop an automated one-click controller
    that will provision all the AI-driven web applications for developers and make
    it easy to carry out resource provisioning and deployment on cloud platforms.
    The deployment service needs to be automated (Wang et al., 2019a). The load balancing
    task to be taken care of during the deployment, considering the type of applications
    that needs to be deployed. In order to automate the deployment, it is necessary
    to benchmark the type and size of the application. Resource provisioning is performed
    by looking into the needs of the application and the available resources. The
    scripts required for the application’s configuration are then created using a
    middleware program (Bhambri et al., 2021).


    The proposed system will be of great use to both technical and non-technical users
    if the entire process is automated. Multiple collaborators can work on multiple
    branches with the use of Phased.js, with a provision of monitoring the applications
    on the deployed servers. Applications are managed with less memory consumption
    and server crash issues can also be handled efficiently (Paoletti et al., 2018).


    The architecture for Automated Provisioning is depicted in Figure 8.1.


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_142_0.png)


    FIGURE 8.1 Automated provisioning architecture.'
