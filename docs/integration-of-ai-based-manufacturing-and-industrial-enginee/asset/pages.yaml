    both AT and AP landmines.


    NN, CNN, and ANN were used by Singh (2019), Silva et al. (2019), and Florez-Lozano
    et al. (2020). The model for the kurtosis Gaussianity test produced a clutter-reduced
    image with high PSNR. Figure 15.8 illustrates the target detection using wavelet-based
    clutter reduction and a neural network classifier (Singh, 2019). Multispectral
    images produced 97% accuracy using the CNN approach. This method detected both
    AP and AT landmines. But the performance increased only for detecting AT landmines.
    Figure 15.9 displays the process of landmine detection using multispectral images
    (Silva et al., 2019).


    The MOGA model produced a high-performance and low-complexity result with CNN,
    SVM, and Viola-Jones (Harkat et al., 2019). Figure 15.10 displays wavelet-based
    clutter reduction and target detection using a neural network classifier. Table
    15.1 presents a comparative analysis of landmine detection methods and techniques
    using ML algorithms.'
