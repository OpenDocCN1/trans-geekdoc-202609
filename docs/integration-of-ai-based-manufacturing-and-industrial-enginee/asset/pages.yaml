  md: "# # 4 An Introduction to Multi-Objective Decision Programming with Fuzzy Parameters\n\
    \n*Zahid Amin Malik*  \nKumaun University, Nainital, India\n\n# ## 4.1 DEFINITIONS\n\
    \n**Decision-maker(s):** The person(s), stakeholder(s), or organization(s) to\
    \ whom the strategic decision issue under investigation relates are referred to\
    \ as the decision-maker(s).\n\n**Decision variable(s):** A decision variable(s)\
    \ represents those variable(s) that can be controlled by the decision-maker. For\
    \ example, consider a bakery production firm that must select how many different\
    \ varieties of baked items to produce in the coming month, and in what quantities.\
    \ All of the factors explain the situation thoroughly and lead to the decision\
    \ to be made.\n\n**Criterion:** A criterion is indeed a single measure which can\
    \ be used to assess the performance of a decision problem’s solution the system\
    \ to a decision problem. Criteria can be of numerous types and come from a variety\
    \ of areas of application. However, many of the most frequently raised concerns,\
    \ at the best level, are related to:\n\n+   - Profit\n+   - Cost\n+   - Time\n\
    +   - Distance\n+   - Production planning\n+   - Personal preferences of the decision-maker\n\
    +   - Commercial or organizational strategy\n+   - System performance\n\nA multi-criteria\
    \ decision aid (MCDA) problem exists when a decision problem comprises one or\
    \ more criteria. This is referred to as a multi-criteria decision-making (MCDM)\
    \ problem.\n\n**Criteria space:** The criterion space is the space generated by\
    \ a set of criteria.\n\n**Objective:** The objective will be used as a criterion\
    \ in the current study, with information on whether to maximize or minimize, and\
    \ the decision-maker(s)"
