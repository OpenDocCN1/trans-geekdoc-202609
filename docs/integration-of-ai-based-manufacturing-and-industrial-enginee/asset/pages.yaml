  md: 'A supervised Machine Learning classifier investigated the problem of keypoint
    utilization and introduced a PatchSelect method for selecting training and testing
    data with a better performance than other strategies. GPR-based Buried Threat
    Detection (BTD) used the raw data with EHD and Histogram of Gradients (HOG) features
    for Random Forest (RF) and SVM (Reichman et al., 2018). The Prony method extracts
    the Complex Natural Resonance (CNR) and normalizes the extracted feature. The
    reflected and reconstructed signals were identical. The Multiclass Support Vector
    Machine (MC-SVM) evaluated the technique with the highest accuracy and sensitivity
    using the Equations (15.7)–(15.9) compared to KNN, ANN, and DT (Khalaf et al.,
    2018).


    Accuracy = (TP + TN) / (TP + TN + FP + FN) (15.7)


    Sensitivity = (TP) / (TP + FN) (15.8)


    Specificity = (TN) / (TN + FP) (15.9)


    The channels were pre-processed in a down-track direction to highlight abnormalities.
    The HOG and SVM methods are applied in the cross-track to identify the locations
    of interest in a 2-D GPR image. Energy feature methods excluded non-mine targets,
    and weight judgment methods confirmed the landmine targets. Equation (15.10) depicted
    α(x, y) based on gradient images (Shi et al., 2018).


    α(x, y) = tan⁻¹ G_y(x, y) / G_x(x, y) (15.10)


    The clutter removal process used recursive algorithms, such as linear predictive
    coding (LPC) and recursive least squares (RLS). Improvised explosive devices (IEDs)
    were classified using an SVM algorithm (Gutierrez et al., 2019). The objective
    was to arrange the window of GPR radiograms into two classes using neural networks
    RBF with a multi-objective genetic algorithm (MOGA). MOGA detected hyperbola structures
    in GPR images (Harkat et al., 2019).


    A wavelet decomposition (WD) with skewness and kurtosis removed the clutter (Rani
    and Gupta, 2016). The kurtosis Gaussianity test resulted in a high-peak signal-to-noise
    ratio (PSNR). The neural networks (NN) approach detect buried objects automatically
    (Singh, 2019). Both learning technologies and data analysis use deep learning
    today. Landmine features extracted through first-order grayscale statistics (FOS)
    and second-order grayscale statistics (SOS) using Narrow Infra-Red (NIR) Thermal
    Sensor (TS) images. The features of the landmine were selected using a filter,
    wrapper, and'
