    C++ implementation contains a wrapper for Python called Open CV-Python.


    # 17.6.5 Haar Cascade Algorithm


    One of the few face-identification-capable object detection techniques is the
    Haar-Cascade classifier. This is used to detect facial landmarks, which are the
    coordinates of the parts present on the face. It is the act of locating prominent
    facial features, such as the eyes, nose, eyebrows, jawline, and mouth, on a face.
    Instead of relying on the individual pixel values of the image, the algorithm
    is based on the number of pixels inside the rectangle feature. The Haar-cascade
    technique provides rapid calculation. For the purpose of object detection, this
    method uses four steps: the Haar feature; cascade classified; a Boost learning;
    and an integral image. The Paul Viola and Michael Jones-proposed concept of features
    serves as the foundation for this approach. In the Haar feature selection stage,
    facial features such as nose, eyes, eyebrows, etc. are selected as edge features,
    line features and four rectangle features. These features are then divided into
    black and white parts, where black parts represent darker features of our face
    and white parts represent the brighter ones. In the second stage, i.e., creating
    integral images, multiple images are developed which contain black and white marks
    that represent the location of the features, the exact coordinates of the facial
    features are not yet identified at this stage. In AdaBoost learning, with the
    help of a decision term, the correctly and wrongly classified parts of the image
    are split and this takes place in multiple iterations. Finally, the strong classifier
    will come out as the result of this stage. In the final cascading classifier'
