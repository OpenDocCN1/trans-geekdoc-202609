  md: '# 7 Heuristics to Secure IoT-based Edge Driven UAV


    *Hemant Kumar Saini*


    Chandigarh University, SAS Nagar, India


    *Kusumlata Jain*


    Manipal University, Jaipur, India


    # 7.1 INTRODUCTION


    The increased desire to connect smart devices to the internet, the Internet of
    Things (IoT) has emerged. These IoT devices sense the outside world and quickly
    disseminate the information over the internet. Each IoT device is granted a unique
    IP address, facilitating the direct sharing of sensitive information that is of
    the utmost significance for security purposes.


    In contemporary times, there has been a notable increase in the growth rates of
    the unmanned aerial vehicle (UAV) population through various sectors pertaining
    to the youth demographic. UAV are incorporated into numerous modern IoT applications.
    This growing number of UAV generates a large amount of Big Data. However, processing
    this large data at several edges is becoming a new critical challenge. According
    to a recent Cisco report more than 70 billion applications, organizations and
    government sectors were predicted to become connected by 2025 (Ara et al., 2017).
    Over the course of the past few years the use of new autonomous vehicles has spread
    to almost every industrial sector. Due to the flexibility and portability of this
    technology, this has attracted various IoT applications with superior functionality,
    which have made it responsive to scalable architecture. One such proven case was
    observed during the COVID-19 pandemic. UAVs have made a significant contribution
    to the continuation of modernization, such as smart homes, smart cultures, the
    so-called smart industries (Industry 4.0) and smart traffic. Since transmission
    protocols are now under development for the identification and motility of the
    UAV in order to allow it to contribute in a critical fashion to the communication
    network which will guarantee improved reliability, primarily these protocols provide
    the more flexible stretchy transmission service in the susceptible locations where
    no connectivity was available. The use of IoT sensors has facilitated the seamless
    integration of UAVs inside the peripheries of ad hoc networks. Although the centralized
    systems are easy to deploy, they are constrained by the high failure risks since
    the data can be easily leaked and there are also delays in accessing the data.
    Due to the latency observed in data processing, IoT devices are experiencing delays.
    Locally oriented approaches have arisen as a means of addressing the aforementioned
    concerns.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'However, it is imperative to exercise caution in the ownership and management
    of IoT devices to increase their efficiency. Accordingly, UAVs have been deployed
    at network edges to store and process the data from IoT ecosystems. Considering
    the energy consumption in fixed architecture, UAVs have proved to be the best
    solution since they have ultra-low latency and flexible support in Big Data processing
    enhancing versatility and concealing large data with better transport. By leveraging
    the integration of UAVs and IoT at the periphery, it is possible to identify optimal
    unexpected settings, such as forested landscapes. Moreover, this combination aids
    the traditional fixed edge system in a cheaper way, but the computation would
    be adapted by the distance travelled by UAVs (Rani et al., 2021).


    But when the IoT hardware devices are fastened to the edges, the device will be
    physically secure. It is not possible solely with software, hardware alone will
    be insufficient to secure the overall network. It is mandatory to use the corrective
    measure for the edge security, but also evolve the approach that requires the
    more and more flexible design and architecture. Blockchain is one approach to
    maintaining safety levels for the edges of IoT-driven UAVs (Fotouhi et al., 2020).
    The UAVs store their data in a chain of blocks so that if any one block is hijacked,
    the others will remain secure. Government agencies now also participate in the
    5G infrastructure to deploy such architecture, meaning that UAVs are increasingly
    under their control. Despite the existence of a potential solution, UAVs located
    at the periphery continue to have challenges related to network performance (Ritu
    and Bhambri, 2022).


    Since the IoT has become increasingly ubiquitous in today’s technology, this has
    led to the development of the new concept of UAV-compatible IoT edges. Furthermore,
    the security concern expressed by the government has served as a catalyst for
    the proposal of heuristics aimed at enhancing security measures. In addition,
    the objective of fostering a sustainable economy has been incorporated into our
    government’s agenda. This chapter explores the architecture of UAV-driven contours
    in the IoT ecosystem making use of different security improvements. However, no
    aspect of security has been measured yet. In this chapter, several surveys reveal
    the critical challenges at the edges and drive the IoT heuristics. This chapter
    primarily examines the practical and contemporary necessity for investigating
    in edged UAVS, with a specific focus on how AI-based paradigms excel in enhancing
    the autonomy of edged networks. (Rachna et al., 2022).


    # 7.2 IMPACT OF THE IoT DRIVEN EDGE


    It has been observed that the edges within the Internet of Things (IoT) ecosystem
    are increasingly functioning as service stations. Consequently, a significant
    challenge arises in terms of resource allocation for data provision from these
    edges. The performance delays associated with this process can have a detrimental
    impact on delay-sensitive applications. He has outlined an A3C (Asynchronous Advantage
    Actor-Critic) method for a delay-sensitive algorithm to alleviate the delays.
    Another study (Rachna et al. 2022) finds the new role for edges to cut the load
    of central cloud computing, in which the deep learning-based edge computing system
    pre-processes the necessary data at the edge of the edge processing layer.'
