  md: 'for a given application or server. The work in Automating App deployment in
    infrastructure clouds (Juve and Deelman, 2011) provides a survey on how to make
    the deployment and management of the cloud services automatic and identify areas
    for research.


    In the present world, cloud computing is becoming an increasingly essential platform
    for distributed systems. The authors in Benson et al. (2016), provide a survey
    of software deployment on cloud platforms. It is noted that there are many challenges
    in the deployment of multi-cloud platforms, such as constraints on configuration
    and managing dependencies. There are also many management tools for application
    automation, each of which have their own strengths.


    Remote Web Event Logging System (RWELS) (Shah et al., 2008): In the present world,
    event logs are an important data source in identifying the problems in websites
    for app deployers and maintainers. This approach presents a web-based application
    for client-server, RWELS for logging user interface events and storing in the
    text files when a user interacts with the website. This logging system automatically
    stores log events without the user''s interaction and attention. RWELS is easily
    configurable and allows users to filter event logs. A user can select some events
    log every page on the website. The event logs are transferred through HTTP to
    the server, where all the event logs are stored as text files. User sessions logs
    on the app can be logged in a unique fashion.


    Kikuchi (2015) proposes the architecture design and benefits of designing scalable
    apps on the cloud server. It also revels the efficient use of load balancer and
    stateless client management. In addition, it considers how microservices are more
    scalable than monolithic types of applications.


    Toffetti et al. (2017) proposes a novel arch of cloud native applications, which
    enables scalable and resilient self-managing apps in the cloud. The current approach
    has intrinsic limits that prevent the apps to be self-sustainable and self-scalable
    as a great deal of human intervention is required, along with manual coding.


    Xu et al. (2017) proposes a log model tool for declaratively-cloud applications
    using Kubernetes logs. It reads the logs generated by Kubernetes and provides
    potential suggestions. There are many real-world Kubernetes problems, which are
    identified as potential bugs.


    CELAR is an Automated application elasticity platform that enables cloud developers
    to build efficient, high-performance services by flexibly managing the use of
    available resources (Giannakopoulos et al., 2014). When a surge in the number
    of users occurs, in order to meet their demands service providers must provide
    an environment that can help them deploy applications quickly. In other contributions,
    the work in Yu et al. (2013) proposed a private cloud tool kit and Yokoyama and
    Yoshioka (2012) introduced a method that manages the cluster as service deployments
    called dodai-deploy.


    Ocone et al. (2019) proposed an analysis which places an emphasis on the policies
    of scaling to be used by auto-scalers. Canali and Lancellotti (2012) has given
    an outline about the virtual machines in cloud data centers and their automated
    classification. Lu et al. (2013) proposed a method that investigates the requirement
    for the service to delineate its connections and display the test cases and apprehend
    the crucial features of the service. Durairajan and Sundararajan (2013) discussed
    a strategy for deploying interoperable service management over cloud.


    The work presented by Deshmukh and Khandagale (2017), provides the study of software
    deployment, in the application development environment. The environment involves
    multiple code changes, and the use of applications, on multiple servers.'
