  md: '# 18 Force/Position Control of Constrained Reconfigurable Manipulators Using
    Hybrid Backstepping Neural Networks Based Control Approach


    *Manju Rani*

    Gurugram University, Gurugram, India


    *Naveen Kumar*

    National Institute of Technology, Kurukshetra, India


    # 18.1 INTRODUCTION


    Reconfigurable manipulators are made up of interchangeable modules when compared
    with conventional robots, which have a fixed mechanism structure (Gierlak & Szuster,
    2017). These manipulators have important qualities such as portability, ease of
    maintenance, large workspaces, affordability, and customization (Holcomb & Morari,
    1991). Due to its standard joints, connection modules, and potential applications
    in areas like space exploration, high-risk operations, smart manufacturing, battlefields,
    etc., the control of reconfigurable manipulators has drawn a lot of interest from
    the control community (Li et al., 2019). Most current research on reconfigurable
    manipulators is carried out by robotic systems that are not constrained by their
    environment (Zhao and Li 2014; Ahmad et al. 2013). The manipulator really interacts
    with the environment in a variety of applications. There are many forms of control
    available to these manipulators that are based on centralized control (Ren et
    al. 2017; Li et al. 2008). But complexity results from robustness (Zhu et al.,
    2019). Additionally, the decentralized control structure offers not only the flexibility
    needed for various configurations but also a shorter computation time, which is
    ideal for real-time applications of reconfigurable manipulators'
  merge: -1
  img_proc: true
- pgno: 277
  md: '(Zhu & Li, 2010a; Wang et al., 2015). The decentralized control method for
    robot manipulators has been the subject of several studies (Zhou et al. 2017;
    Dong et al. 2017a; Du and Zhu 2018; Dong et al. 2017c, 2018, 2017b). A unique
    control strategy for reconfigurable systems was chosen by taking into account
    external disturbances and unidentified Nodal Analysis Framework (NAF) (Zhou et
    al., 2017). A new decentralized control strategy was explored for joint trajectory
    tracking control of the reconfigurable robot in the face of time-varying limitations
    (Dong et al., 2017a). An integral stacked sliding surface successfully reduced
    the chattering impact of the intended controller. The issue of trajectory tracking
    was resolved via a decentralized control strategy using data-based modeling (Du
    and Zhu 2018).


    The aforementioned methods rely heavily on robust adaptive control algorithms
    that are model-based and try to convey an exact understanding of uncertain systems
    (Bali et al., 2023). Practically speaking, the biggest difficulty with the current
    methods is how to compute the regression matrix and collect precise data for the
    dynamic model of uncertain systems (Ritu and Bhambri, 2023). It becomes more challenging
    to govern the system using traditional model-dependent control techniques when
    the dynamics are complex (Sangwan et al., 2021). Furthermore, the limits on external
    disturbances and uncertainties should be established, notably in the case of the
    SMC’s control regulations (Bhambri et al., 2021; Heck et al., 2016). Notably,
    the system’s performance may suffer due to the control law’s heavy dependence
    on the dynamic model, and all of these methods become ineffective when intelligent
    approaches have proven to be a more effective method for approximating the unknown
    smooth nonlinear functions, overcoming the limitations of model-dependent controllers
    (Liu et al., 2014; Liu et al., 2019; Li et al., 2016b; Li et al., 2016a). The
    adjustable features of neural network-based control technologies, such as non-linear
    mapping, parallel distributed structure, and self-learning capability, which are
    successfully used to manage the more complex systems, are their main advantage
    on a broad scale (Bhambri, et al., 2023; Slotine & Li, 1991; Park & Sandberg,
    1991). The combination of robust adaptive, sliding mode control, centralized and
    decentralized control schemes with neural network technology has also resulted
    in a number of outstanding control schemes that have been reported in the literature
    (Liu et al., 2014; Zhang et al., 2015; Sofi et al., 2016; Zhu and Li, 2010a; Zhu
    and Li, 2009; Ghajar et al. 2018; Cao et al., 2018; Naderi and Azab 2021; Dajer
    et al. 2022).


    A back-propagation neural network was used in this study to train the more thorough
    and explicit data-based model. Decentralized neural network control rules for
    the reconfigurable manipulators were proposed by utilizing the Lyapunov stability
    analysis and backstepping techniques. Neural networks were used in this research
    as the most accurate approximation of the unknown dynamics. After that, a fuzzy
    logic-based controller was used to approximate the unknown dynamics of the reconfigurable
    manipulator by expressing the dynamics into a group of comparable structures.
    For limited manipulators, a reliable control strategy based on the neural network
    was developed (Ghajar et al., 2018). A new force/position control strategy was
    described by fusing terminal sliding mode with neural network technology, where'
