    # 10.7 CONCLUSION


    This chapter, shows the development of a low pass filter with a specific pass
    band frequency, a stop band frequency utilizing Booth’s Multiplier, and a carry
    select adder for maximum performance with minimal logic usage. Depending upon
    the specific situation, this 15-tap filter may need to be tweaked further. In
    applications such as signal processing and communications, the filter’s order
    and coefficients can be modified to meet the requirements of the particular application.


    # 10.8 FUTURE SCOPE


    As this field of study is so vast, this work can only serves as an introduction.
    We can continue to work on it in a variety of ways. By utilizing numerous effective
    strategies, we can try to reduce its power usage even further. In future, we can
    look to improve its speed. The potential for significant improvement lies in its
    capacity to reduce surface area, consume less energy, and enhance acceleration.
    As long as science and technology continue to advance, there will always be a
    need to create ever-simpler, easier-to-implement procedures as well as ways to
    carry out tasks more quickly and effectively. As a result, this sector of employment
    will continue to advance and expand in the years to come.


