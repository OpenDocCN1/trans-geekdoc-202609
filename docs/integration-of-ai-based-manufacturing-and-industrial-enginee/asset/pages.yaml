    # 14.3 CONCLUSION


    The simulation findings show that AODV’s packet delivery ratio (PDR) is superior
    to DSDV’s PDR. In AODV, it is superior in 5m/s by 86.5%, in 10m/s by 79.8%, and
    in 15m/s by an average of 65.26%. AODV has a higher throughput than DSDV. AODV
    outperforms DSDV at 5 m/s by 92.4%, while also being 82% better than DSDV on average
    at 10 and 15 m/s AODV. Due to its hop-by-hop routing mechanism, AODV achieves
    significant E2E delay. DSDV, however, experiences high packet losses than AODV
    on average at speeds of 5 m/s, 10 m/s, and 15 m/s. DSDV experiences 86.9% and
    85.5% more packet losses than AODV respectively. Despite having a better throughput
    and PDR with a mobility speed of 5m/s for both sources, AODV uses more energy
    (38.2% more to be exact) and lower packet losses. In both locations with a 5m/s
    speed AODV uses an average of 68.2% more energy than DSDV.


