    # 16.1  INTRODUCTION


    Waiting time in queues is a significant present-day problem faced by peoples,
    particularly in locations such as businesses, colleges, offices, hospitals, canteens,
    book store, libraries, banks, post offices, gas pumps, cinemas, music halls etc.
    They also wait for a telephone operator to answer, for a traffic signal to change,
    for the before noon mail to be delivered, and in numerous other similar situations
    (Hira, 2007).


    The main causes of queuing problems are:


    +   - *Overburden:* Due to large interest in the facilities, there is an occurrence
    of overabundance of waiting time. So we state that there are a deficient number
    of service facilities.

    +   - *Demand:* Due to little demand, there is an excessive amount of idle facility.
    Which we can say about a large number of services.


    In either case, the issue might be either a scheduled arrival or give a legitimate
    number of services, or both, in order to get an optimal stability among the expense
    related to waiting time and idle time.


    In the college cafeteria or canteen students expect a definite level of service;
    however, the owner of the canteen attempts to reduce the costs to the lowest level
    possible while still maintaining the essential service level. This study exhibits
    the optimization between the waiting time and the service rendered. The fundamental
    qualities of a waiting time period phenomena are entities reach, at standard or
    sporadic interval of time, at a particular point called the service center. Such
    might include lorries arriving at a stocking location, students arriving at a
    cafeteria, peoples entering a theatre, ships arriving a port, letters arriving
    on the secretary’s desk etc. all these items are named entries or the arrival
    of the clients (Chawla, 2005).


