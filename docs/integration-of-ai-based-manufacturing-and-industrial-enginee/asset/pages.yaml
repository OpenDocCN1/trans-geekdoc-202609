    # Dr. Sita Rani


    Dr. Sita Rani works in the Department of Computer Science and Engineering at Guru
    Nanak Dev Engineering College, Ludhiana. Earlier, she served as Deputy Dean (Research)
    at the Gulzar Group of Institutions, Khanna (Punjab). She completed her B. Tech.
    and M. Tech. degrees in Computer Science and Engineering from Guru Nanak Dev Engineering
    College, Ludhiana. She earned her Ph. D. in Computer Science and Engineering from
    I.K. Gujral Punjab Technical University, Kapurthala, Punjab in 2018. She completed
    her Post Graduate Certificate Program in Data Science and Machine Learning from
    the Indian Institute of Technology, Roorkee in 2023. She is also a Post Doctoral
    Research Fellow at South Ural State University, Russia since May 2022. She has
    more than two decades of teaching experience. She is an active member of ISTE,
    IEEE and IAEngg and is the recipient of the ISTE Section Best Teacher Award– 2020,
    and the International Young Scientist Award–2021. She has contributed to the various
    research activities while publishing articles in renowned journals and conference
    proceedings. She has also published seven international patents. Dr. Rani has
    delivered many expert talks in AICTE-sponsored Faculty Development Programs and
    organized many international conferences over the course of her 20 years of teaching
    experience. She is a member of editorial boards and also a reviewer for many international
    journals of repute. Her areas of research interest include parallel and distributed
    computing, data science, Machine Learning, Blockchain, the Internet of Things
    (IoT), and healthcare.


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_10_1.png)


