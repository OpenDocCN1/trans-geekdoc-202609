  md: '# 12.1.3 FEATURES AND APPLICATIONS


    The GUI comprises of 19 attributes, which are to be used in the prediction of
    customer churn. It was indicated on a row and column basis in a matrix. The rows
    of a matrix have features such as senior citizen, partner, internet service, tech
    support, monthly charges, payment method, dependence, online security, streaming
    TV, total charges, paperless billing, phone service, online backup, streaming
    movies, tenure, gender, multiple lines, device protection, contract. Similarly,
    the column of the matrix indicate the characteristics of the clients of a fictional
    telecom industry. There is an option to the predict customer churn by clicking
    the backend machine learning algorithms run and based on the confidence value.


    Customer churn is the major challenge in this regard, being used for businesses
    such as global-level telecom industries and was used to improve the level of customer
    retention in businesses. The classification of customer churn is achieved by grouping
    them together into different categories. The phenomenon of churn in the context
    of contractual agreements encompasses both voluntary and non-voluntary instances.
    Voluntary churn occurs when a client willingly terminates their association with
    a firm. By contrast, non-voluntary churn refers to situations where a customer
    is unable to fulfil their financial obligations, resulting in their departure
    from the organization, as exemplified by the inability to pay credit card bills.


    A lack of usage of the product, poor service, and finding a better deal elsewhere
    are among the most frequent reasons for customer churn. To precisely describe
    any of these reasons, domain expertise is required. Regardless of the various
    factors that may apply to various sectors, one thing is constant across all domains,
    as we have stated repeatedly: Retaining existing customers is less expensive than
    acquiring new ones. There could be an impact on budgets for both the company’s
    running and marketing costs.


    # 12.2 RELATED LITERATURE


    This section gives a brief description of related research articles.


    Zengyuan et al. (2022) proposed a Machine Learning approach, which is based on
    the PCA-Ada Boost model related to analyze the churn performance of e-commerce
    customers. To predict e-commerce customer turnover, this system integrates data
    preprocessing and ensemble-learning techniques, and it is partly connected to
    a proposal.


    A POOH (Positioning the Optimal Occlusion Area) approach was implemented by Gucci
    and Mardiansyah (2020). This model enhances the detection precision while also
    identifying the occlusion face. Chen et al. (2015) combined the use of an Ada
    boost and a PCA algorithm for ultrasound image segmentation. Similarly, Zeineb
    and Rania (2019) proposes a method related to the classification of customers’
    contractual and non-contractual in traditional industries. This approach was used
    to identify the corners effectively.


    Hughes (2005) proposes a RFM analysis-based approach for conducting a customer
    value assessment and identifying their status. This method was used to track and
    to discern the customers’ purchasing behaviors during a cycle of online shopping.'
