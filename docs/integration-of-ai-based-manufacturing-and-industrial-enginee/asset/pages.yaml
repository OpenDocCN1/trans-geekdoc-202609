  md: '# Deployment of ML and DL Algorithms


    distinct challenges in the manufacturing process of the industry (Usuga Cadavid
    et al., 2020). Cycle time prediction is a complicated problem for industrial engineers
    in the case of complex manufacturing setups. A simulation model for the discrete
    events on a production line in order to predict the cycle time by utilizing the
    genetic programming and effective process time are used by the authors (Cand and
    Heavey, 2016). This model improves control and planning processes in manufacturing
    systems.


    The authors (Wang et al., 2018) used predictive ML techniques based on SVMs (Support
    Vector Machines) and AMPSO (Adaptive Mutation Particle Swarm Optimization) for
    the prognosis of strip crowns in the hot-strip rolling process. The proposed AMPSO-SVR
    model results in a new technique and optimal shape finding in the hot-strip rolling
    method. The authors (Golkarnarenji et al., 2019) used ML models to predict the
    mechanical properties of carbon fibers. The proposed ML model is based on the
    Support Vector Regression (SVR) and ANN. A limited training data set is considered
    for training the model.


    A critical quality indicator for cement clinkers in rotary cement kilns is the
    amount of free lime (f-CaO). For the majority of time, the cement clinker''s f-CaO
    amount is measured in a lab offline because of the unavailability of hardware
    sensors. The authors (Liu et al., 2020) proposed a soft-sensor technique ESVM
    (SVM Ensemble) based on ML, to predict free lime amount during the production
    process of cement. Another soft sensor developed by the authors (Mulrennan et
    al., 2018) is responsible for properly estimating the yield stress by utilizing
    an instrumented slit die for an extruded Polylactide (PLA) sheet inline at the
    extrusion process. The yield stress is then predicted, utilizing ML techniques,
    for the extruded PLA sheet by using the data gathered from the slit die sensors.
    By decreasing machine downtime and improving the energy efficiency of the process,
    the proposed technique results in lower scrap rates and production costs.


    In the manufacture of vehicle bodies, the fixtures used to fasten the panels together
    during the joining processes are typically hard constructions that demand a laborious
    hand setup process. Different adjustment modules are created at the Fraunhofer
    IWU which satisfy various necessities for the automation of the adjustment process
    and shorten the ramping-up periods (Sharma et al., 2020). Produced components
    are tested against an adjustment database due to strict quality criteria. The
    measured values and the expertise of the template specialists used for the precise
    location for each clamping point is determined by applying the mathematical algorithms
    and contemporary AI techniques developed by the authors (Fritzsche et al., 2017).


    The fundamental requirement of the manufacturing system is to diagnose and forecast
    the fitness value of the distinct machines over the production line for auto-motive
    components (Bhambr i et al., 2020). Great amounts of Big Data from the production
    line can now be captured easily and can be stored in large volumes because of
    the Internet of Things (IoT) technology. The advancement of AI has made it possible
    to effectively mine large amounts of data. The authors (Luo and Wang, 2018) proposed
    an ML model to detect the fitness condition of the machines through utilizing
    the data generated by the different machines in response to the industrial demand
