- pgno: 163
  md: '# 9.4.2.3 Image Filtering Techniques


    Along with a couple of these common image filtering techniques, it is planned
    to incorporate various mathematical approaches to categorize the images. Among
    the approaches available are the following:


    +   - n-Sigma Control limit

    +   - Grouping Technique

    +   - Spatial Classification

    +   - Temporal Classification


    Of the above mathematical approaches, the n-Sigma control limit is the most popularly/significantly
    used method (Jin et al., 2019). In this method, the boundaries are defined based
    on the properties of images which are used to define the clarity and visibility
    (Maddipati et al., 2020). The compressed images are given as inputs to n-Sigma
    controls, which compares the properties of image with the fixed boundary values
    and categorizes them into three classes as shown in Figure 9.5. Zonal representations
    are then given as shown in Figure 9.6.


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_163_0.png)


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_163_1.png)'
