    # ## 5.4 ANALYTIC TOOLS AND USES


    # ### 5.4.1 Analytics Software Applications


    The use of analytics software assists human resource workers to collect and analyze
    data, as well as identifying crucial HR metrics. These technologies blend business
    and people data in order to determine the HR department’s impact on business performance.
    HR analytics software is utilized by businesses to uncover inefficiencies, anticipate
    productivity, and optimize their use of personnel. These solutions provide organizations
    with the required knowledge to manage their human resources and increase their
    return on investment.


    Different types of analytics software include the following:


    +   1. R Studio

    +   2. Python

    +   3. Power BI

    +   4. Tableau

    +   5. Microsoft Excel

    +   6. Visier

    +   7. Qlik

    +   8. SPSS

    +   9. CPLEX optimizer


    # ### 5.4.2 R and RStudio


    R is a computer language that is available for free online use and is typically
    utilized to carry out numerical and statistical analysis. It offers a comprehensive
    collection of libraries for data analysis and visualization. R is by far the most
    popular choice as a HR analytics tool, since it is a programming language that
    excels in conducting analysis on massive data sets. This makes it possible to
    clean and analyse data sets that contain millions of rows. In addition, users
    are able to see the outcomes of the data analysis.


    RStudio is an enhanced version of the R programming language which is capable
    of performing all of R’s features. The user interface of RStudio comes equipped
    with a code editor, the R console, a workspace that is simple to navigate, a history
    log, and storage areas for plots and files.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# ### 5.4.3 Python


    Python is a general-purpose, object-oriented programming language that is available
    under an open-source licence. It offers a variety of libraries that can be used
    for the manipulation, visualization, and modelling of data. It is possible to
    use Python in place of R as the programming language of choice. However, R is
    superior when it comes to statistical analysis, has a community that is more engaged
    in the subject of statistics, and is better suited for the visualization of data.
    Python, on the other hand, is much more easy for new users to handle.


    R and Python: Both R and Python are excellent programming languages for data research
    and visualization. They are frequently employed in advanced statistical analysis,
    machine learning, and data mining.


    # ### 5.4.4 Power BI


    Power BI from Microsoft simplifies data aggregation, analysis, and visualization.
    Connecting to a wide variety of source systems is made incredibly easy by this
    software. Such source systems can include SQL databases that store data on people,
    a live Twitter feed, or Machine Learning APIs. After that, each of these one-of-a-kind
    data sources is included into Power BI (Chhabra and Bhambri, 2021). This straight-forward
    aggregation method permits the combination of various data sources into a single,
    large database suitable for reporting and analysis. Power BI can be used to generate
    interactive dashboards and reports is Power BI.


    # ### 5.4.5 Tableau


    Tableau is analogous to Microsoft Power BI in that it also enables the consolidation
    and visualization of numerous data sources. The software, which was initially
    developed in 2003 as a commercialized outlet for research conducted at Stanford
    University, has caused quite a commotion in the realm of visualization. When it
    comes to the visualization of data, Tableau is the business intelligence (BI)
    solution that is regarded as the most efficient. It has been listed in the Gartner
    Magic Quadrant for each of the seven years in a row, starting in 2012 and continuing
    through 2019. Tableau’s higher cost compared to rival Power BI is a disadvantage,
    however. Tableau: Tableau is a popular data visualization tool for creating interactive
    dashboards and reports. It can be used to investigate and display massive datasets,
    as well as to convey findings to stakeholders.


    # ### 5.4.6 Microsoft Excel


    Microsoft Excel has been the standard software for data analytics for decades.
    Every time we manually extract data from one of the HR systems, the outcome is
    a comma-separated values (CSV) file (Angrave et al., 2016). Excel can effortlessly
    open and edit these files. Excel features a basic interface and functionality
    that are straightforward to comprehend, which is a plus. Excel is therefore the
    most user-friendly HR analytical software. Excel is a popular data analysis, visualization,
    and reporting application. It has a wide range of applications, from simple data
    manipulation to advanced statistical analysis (Wirges & Neyer, 2022).'
  merge: -1
  img_proc: true
