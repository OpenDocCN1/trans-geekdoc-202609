  md: 'Traditional Statistical Prediction methods are used to design classifiers that
    are less accurate and highly interpretable for small-scale data in industries
    such as decision trees (Kisioglu & Topcu, 2011), logistic regression (Hossain
    et al., 2019) and a Bayes classifier (Zacharis et al., 2018).


    Even though deep learning and ensemble learning have recently been developed,
    they still produce less accurate predictions when dealing with massive amounts
    of data (Guo et al. 2017; Li et al., 2020).


    Jayaswal et al. (2016) implemented an algorithm with the integration of decision
    tree, GBDT, and Random Forest to predict customer churn more accurately. These
    features will not be included in the prediction model through simple cleaning,
    which will lead to excessive complexity, a long training duration, and inferior
    predictive performance. By contrasting the PCA-AdaBoost model’s performance with
    that of other algorithms such as SVM, logistic regression, and the AdaBoost method,
    its efficacy may be determined.


    According to Olafsson et al. (2008), an approach to a valued customer is typically
    dynamic. It is possible to understand how the connection between a company and
    a customer varies over time by looking at the customer lifecycle, otherwise known
    as customer lifetime. The goal of customer relationship management is to keep
    customers from leaving a business by keeping them satisfied.


    The strategy taken by Reinartz et al. (2005) assumes that client retention is
    more crucial than customer acquisition. New customers make it challenging to choose
    target customers with ineffective marketing strategies. Using a CRM methodology,
    Rygielski et al. (2002) identify important customers, forecast future behaviours,
    and make proactive, informed decisions. The total accuracy recorded for Bayesian
    networks, neural networks, and support vector machines was 99.10%, 99.55%, and
    99.70%, respectively.


    Recently, customer churn has become a popular issue in this field of research.
    This innovative and sophisticated data mining technique employs a data set of
    call detail records from 3333 customers, each with 21 variables, to predict customer
    churn and a churn-dependant variable with two classes: Yes/No. Information about
    their voicemail and the corresponding inbound/outbound SMS counts are among the
    aspects considered (Kuzhaloli et al., 2020).


    In order to identify churn, artificial neural networks, decision trees, K-means
    clustering, and regression analysis were taken into consideration and prediction
    for mobile and wireless service providers using data mining techniques were discussed
    by Yabas and Cankaya (2013). However, decision trees were able to more precisely
    identify the potential corner.


    According to the unified analytical technique offered by Muhammad Raza Khan and
    Blumenstock (2016), each client was assigned a churn score based on the likelihood
    that they would quit within a certain amount of time. Nonetheless, this approach
    creates an enormous number of covering highlights from client exchange logs and
    measurements that are generally prescient of client beat. These features were
    taken into account by a number of supervised learning algorithms that can successfully
    predict subscriber churn (Bham bri et al., 2020).


    Xiaohang Zhang et al. (2021) looked into how network attributes affected consumer
    engagement and social network topologies based on customer call behaviors. The
    author proposes two approaches based on the phone survey statistics and the billing
    system of current customers using empirical data from the telecommunications industry.'
