    # 12.4 RESULTS AND DISCUSSION


    # 12.4.1 Evaluation Measures


    The important measure is precision, which is calculated by dividing the true positives
    by all that have been predicted to be positive. The precision is the preferable
    one than recall.


    ```

    precision = TP / (TP + FP)

    ```


    The second metric recall is computed by dividing the real positives by everything
    that should have been predicted as positive.'
