    # 18.3 PROBLEM IDENTIFICATION


    The purpose of the current study is to build a workable controller specifically
    with the partial dynamic information of the manipulator so that reconfigurable
    manipulator can track the desired trajectory while retaining the force trajectory
    on the contact surface. More specifically, the design control law’s primary goal
    is to ensure that the system is stable even when there are uncertainties (structured
    and unstructured). In light of this, we present


    $$\tilde{\Theta} = \Theta - \Theta_d \tag{18.13}$$ $$\bar{\Theta}_1 = \Theta_1
    - \Theta_{1d} \tag{18.14}$$ $$\tilde{\eta} = \eta - \eta_d \tag{18.15}$$ may reach
    zero levels.


    # 18.4 DESIGN OF CONTROLLER


    The filtered tracking error and a few additional helpful notations are presented
    prior to the creation of the control law as follows:


    $$r = \dot{\tilde{\Theta}}_1 + \lambda \tilde{\Theta}_1; \; \Theta_n = \dot{\Theta}_{d1}
    - \lambda \tilde{\Theta}_1 \tag{18.16}$$


    Here $\lambda \in R^{p-n}$ is a matrix that is positive and definite.'
