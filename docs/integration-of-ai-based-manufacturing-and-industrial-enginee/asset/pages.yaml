    Architecture is intended to figure out the issue of human–machine interaction
    in manufacturing, which is related to digital-twin modeling on both the Cyber-Physical
    (C-P) and Human-Cyber sides, is the Digital-twin visualization architecture. Although
    there is a lot of research and a range of applications in this area, there is
    not sufficient focus on lightweight architecture and services that are useful
    throughout their entire lifecycle. To have flexible manufacturing systems (FMS),
    architecture of digital-twin visualization is proposed by the authors (Fan et
    al., 2021). Experimental findings demonstrate the effectiveness of the proposed
    GHOST (geometry (G)-history (H)-ontology (O)-snapshot (S)-topology (T)) strategy
    in several facets of the FMS lifecycle.


    Nowadays, majority of the e-commerce warehouses now deploy autonomous mobile robotic
    machines to increase efficiency, save energy and overcome the human errors. The
    robots, the other important resources and activities in a warehouse, are under
    the management of the Robotic-Mobile-Fulfillment System (RMFS). The authors (Bolu
    and Korçak, 2021) proposed a centralized task management method that is dynamically
    responsive to the centralized system. A cutting-edge process conversion method
    that creates process from a batch of orders and offers a significant pile-on value
    is proposed. Then, taking into account the position of robots and pods, the use
    of totes, and the age of the tasks, an adaptive heuristic strategy for the assignment
    of produced tasks to robots is proposed. The outcomes give an idea of creating
    an efficient smart warehousing system.


    # 13.4 APPLICATIONS OF DL TECHNIQUES IN INDUSTRIAL ENGINEERING


    The treads are the most important part of the tire in terms of predicting the
    average lifespan. The authors (Lihao and Yanni, 2018) utilized the data obtained
    from different parameters such as rotating speed, air pressure and main current
    as an input to the Convolution Neural Network (CNN) model of DL to detect fault
    and diagnosis for tire tread lines (Dhanoa and Bhambri, 2020). The proposed model
    outperforms the traditional models based on the Back propagation neural network,
    decision tree and logistic regression.


    Chemical mechanical polishing is a very common process in automobile industries.
    The prediction of material removal rate (MRR) is a critical measure in determining
    the quality of a product. The authors proposed a data-driven approach that is
    based on the Deep Belief Network (DBN) and different polishing parameters are
    utilized to find the relation with MRR (Wang and Yang, 2017).


    The motors are considered to be the most important parts in industrial operations
    because of their stability, low cost, and robust performance. The shutdown of
    a whole production line due to a motor failure may result in significant financial
    loss. The diagnosis of motor faults must be precise, trustworthy, and efficient
    (Potluri et al., 2019). Currently, the area of motor fault diagnostics is receiving
    considerable attention as it is thought to be very promising in terms of ensuring
    safe motor operations. A Long Short-Term Memory (LSTM) neural network, which has
    the ability to acquire meaningful data from raw information without the use of
    feature engineering, and is therefore a unique fault detection approach for three-phase
    asynchronous motors, is proposed by'
