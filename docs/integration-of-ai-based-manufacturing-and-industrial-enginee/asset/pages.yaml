- pgno: 121
  md: 'trajectories present, IDF1 performs a one-to-one mapping between the sets of
    estimated tracks and actual tracks. The ratio of successfully recognized detections
    to the aggregate of actual and estimated detections is defined as IDF1 (Eq. 6.12).
    The Hungarian algorithm chooses which trajectory is to be matched in order to
    minimize the summation of false positive IDs and false negative IDs.


    IDF1 = |ID_tp| / (|ID_tp| + 0.5|ID_fn| + 0.5|ID_fp|) (6.12)


    An improved IDF1 score reflects the overall distinct object number in a scene
    rather than providing information on effective detection and association. Also,
    it does not assess the accuracy of tracker localization.


    # (e) Higher-order tracking accuracy (HOTA):


    A single amalgamated metric which estimates recognition, association along with
    localization is HOTA metric. In this, a one-to-one mapping between the estimated
    detections and true detections using IoU value or Jaccard Index given by (Eq.
    6.13) is performed, along with a spatial similarity evaluation to penalize any
    missed or additional predictions.


    Jaccard Index = TP / (TP + FP + FN) (6.13)


    In order to optimize the matching score obtained from one-to-one mapping, the
    Hungarian algorithm is utilized.


    # (f) Average multi-object tracking accuracy (AMOTA):


    MOTA, MOTP along with IDS and F1 score belonging to CLEAR metrics, assumes that
    all entity paths have the same confidence, i.e. s = 1, which is an invalid hypothesis
    since many FP trajectories have low confidence values. Using a singular confidence
    level for evaluations demands substantial efforts from an individual and inhibits
    users from comprehending the full range of accuracy of an object tracking system.
    To address these issues, Weng et al. (2020) proposed two integral MOT metrics,
    AMOTA and AMOTP, which averages the performance of MOTP and MOTA across multiple
    confidence levels.


    AMOTA is calculated by integrating MOTA scores obtained from all the observed
    recall scores and is given by (Eq. 6.14), where x denotes a specific recall value
    and M denotes various confidence levels.


    AMOTA = 1/M Σ (1 - (FN_x + IDS_x + FP_x)/N_gt) (6.14)'
