  md: '# 11.4.5 PEOPLE PARTICIPATION, AWARENESS, AND EDUCATION


    Finding a way to involve people in the Blockchain-based management of their data
    presents another challenge. Patients, including children and the elderly, may
    lack the interest or capacity to contribute to the management of their data.


    # 11.4.6 REGULATION


    Government regulations and cultural values have been identified as two of the
    biggest obstacles to the introduction of Blockchain technology. The regulatory
    concerns regarding Blockchain that have been expressed need to be addressed by
    government institutions, and the actors in the international healthcare sector
    will need to be very committed to the technology’s cultural acceptability.


    # 11.4.7 Cost


    This includes restrictions on the amount of time, money, and money-related expenses
    needed to adopt Blockchain. The costs associated with implementing the dispersed
    Blockchain app are high. Restrictions include the time required to globally identify
    smart contracts, increased time, the timing of transmissions, the time needed
    for the data receiver to find the right data in shared storage, and longer total
    execution times.


    # 11.5 CONCLUSION


    As shown in this chapter, revolutionary Blockchain technology is being used increasingly
    in the healthcare sector, particularly for patient monitoring systems. Recent
    applications of distributed ledger technology in the medical business demonstrate
    that it is typically utilized for data distribution, electronic health record
    management, supply chain management, and drug prescription administration, among
    other applications.


    This chapter demonstrates that Blockchain technology can help overcome the challenges
    faced by the healthcare industry such as the secure dissemination of data, supply
    chain management, the management of electronic medical records, infodemics, etc.
    Regarding future research, Blockchain technology is still a relatively novel technology
    in the medical industry, and creative, inventive solutions can still be investigated.
    In conclusion, Blockchain technology has tremendous potential to change the healthcare
    domain so that the industry is better prepared for future calamities or pandemics.


