- pgno: 143
  md: '# 8.4 METHODOLOGY


    The proposed system creates a simple and minimal application which assists users
    in deployment procedure and introduces an auto resource allocation to the process.
    The web application will run locally on the host machine (which runs on a PhasedJS
    framework) and allows users to manage and deploy their applications on the production
    server (PaaS such as Heroku, AWS, Azure etc.).


    Many processes work together cooperatively under the hood to achieve this task.
    Since Phased JS is based on NodeJS, every script runs asynchronously, which reduces
    CPU overheads and mean that the deployment becomes smoother. Since different applications
    have different memory requirements, PhasedJS automatically analyzes target applications
    for memory usage and sets a threshold before deployment. This ensures that the
    target application does not exceed the memory limit. Also, before deployment PhasedJS
    attaches a logger and a couple of bash scripts for target application scaling.
    The logger logs useful console statements to the end user for further debugging
    live applications.


    In Figure 8.2 Phased Js Architecture is illustrated. The PhasedJS creates a package
    which includes user app, logger, scaling scripts and other helper bash scripts,
    which then is sent to the cloud platform for deployment.


    Figure 8.3 summarizes in detail the dataflow design of the proposed architecture.
    This is called cloud orchestration, which means using multiple tools, processes,
    and API to combine and automate successful deployment of the target application.
    The coordination takes place in an orchestration layer which governs and controls
    all the deployed apps in one platform. The bash script creates a process called
    Master Process, which itself creates error handles and worker processes. A worker
    process takes care of an http request and a web socket connection. The master
    process automatically carries out the allocation of CPU and memory to the worker
    process. This allows the target application to scale and use memory within the
    target limit (Tanwar et al., 2022).


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_143_0.png)


    FIGURE 8.2 Phased.JS architecture.'
  merge: -1
  img_proc: true
