  md: '![](img/3d190e19625a7567e7b93c8e95b18d9c_264_0.png)


    FIGURE 17.1 System architecture.


    The system can be understood by considering it to be divided into two separate
    parts: hardware and software. The software part of the system consists of an algorithm
    which runs and monitors the driver constantly. This algorithm detects the face
    and eye coordinates or landmarks and triggers a return value when the eyes of
    the driver close for a certain number of seconds. The hardware part consists of
    multiple modules connected to an Arduino Uno chip, which is, in turn, linked to
    the system that runs the algorithm. The camera unit is connected to both the software
    system and the Arduino chipset.


    # 17.5 HARDWARE REQUIREMENTS


    # 17.5.1 LCD SCREEN


    This is a type of flat panel display that primarily operates using liquid crystals.
    The liquid crystal display (LCD) screen is available in different formats, and
    the proposed system uses a 16X2 LCD screen where the screen can print 16 characters
    for one line and two such lines are present. A 16 X 2 LCD screen contains 16 pins,
    each of which are used for different purposes. The main advantage of an LCD screen
    over an LED one is the relatively low cost of the former. In addition, LCD has
    the ability to display more characters than LED. Two connected glasses make up
    the LCD panel, and it also contains a backlight. The liquid crystal molecules
    that make up the glasses are so constructed that will be affected by an electric
    current. They have a 90-degree distortion (e.g., light enters from one side, leaving
    a polarized glass at 90 degrees on the other side). The light originating from
    one side of the screen won’t pass through a polarizing glass if there is no electricity
    transmitted into the molecule; otherwise, it will be rotated 90 degrees within
    the molecule and then pass through the second polarizing glass.


    The LCD module is used to display the status of the driver, identifying whether
    the driver is sleeping or awake. This module is connected to the Arduino chipset
    via the pins mentioned (Table 17.1) and shown in the below sample figure of an
    LCD module (Figure 17.2).


    Below table describes are details of the pins of the LCD module and their usage:'
