    # 4.5 CONCLUSION


    This chapter studies and investigates the applicability of fuzzy goal programming
    for production planning problems. It has been found that the proposed mathematical
    programming formulation would deliver better results than other mathematical models.
    The fuzzy goal programming outlined in this chapter is expected to play an important
    part in the decision-making process of any production sector. The suggested model
    offers a useful method for developing management plans to choose different manufacturing
    processes in a decision support system. Making the best use of certain resources
    is frequently a goal of decision-makers, along with increasing profit and reducing
    labour and production expenses. Thus, an effort was made to enhance operational
    planning strategies in the agricultural and industrial sectors via constructing
    fuzzy goal programming approaches by simultaneously incorporating every one of
    these objectives into the suggested model. The model can be used to address many
    of the problems and issues associated related to the production sectors in their
    decision support system and related production planning problems.


