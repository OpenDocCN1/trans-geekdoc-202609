    Dr. Pankaj Bhambri is affiliated with the Department of Information Technology
    at Guru Nanak Dev Engineering College in Ludhiana. Additionally, he fulfills the
    role of the Institute''s Coordinator for the Skill Enhancement Cell and acts as
    the Convener for his Departmental Board of Studies. He possesses nearly two decades
    of teaching experience. Dr. Bhambri acquired a Master of Technology degree in
    Computer Science and Engineering and a Bachelor of Computer degree in Information
    Technology with Honours from I.K.G. Punjab Technical University in Jalandhar,
    India, and Dr. B.R. Ambedkar University in Agra, India, respectively. Dr. Bhambri
    obtained a Doctorate in Computer Science and Engineering from I.K.G. Punjab Technical
    University, located in Jalandhar, India. Over an extended period, he fulfilled
    many responsibilities including those of an Assistant Registrar (Academics), Member
    (Academic Council/BoS/DAB/RAC), Hostel Warden, APIO, and NSS Coordinator within
    his institution. His research work has been published in esteemed worldwide and
    national journals, as well as conference proceedings. Dr. Bhambri has made significant
    contributions to the academic field through his role as both an editor and author
    of various textbooks. Additionally, he has demonstrated his innovative thinking
    by filing several patents. Dr. Bhambri has received numerous prestigious awards
    from esteemed organizations in recognition of his exceptional achievements in
    both social and academic/research domains. These accolades include the ISTE Best
    Teacher Award in 2022, the I2OR National Award in 2020, the Green ThinkerZ Top
    100 International Distinguished Educators award in 2020, the I2OR Outstanding
