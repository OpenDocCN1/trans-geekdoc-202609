- pgno: 272
  md: '# 17.9 CONCLUSION AND FUTURE SCOPE


    There is a need for an alert to reduce the chances of getting into an accident.
    We proposed a system that will help drivers to return to their state of awakening.
    This system was developed, taking data science and IoT as domains. The methodology
    of this study is divided into two main phases: facial landmark detection and drowsiness
    detection. From facial landmark detection, we found the facial landmarks i.e.,
    the coordinates of the face of the driver and drowsiness is detected based upon
    the value of the EAR. Furthermore, we included a vibration sensor which can detect
    whether or not an accident has occurred. This system is expected to support the
    drivers to come to their normal state of driving.


