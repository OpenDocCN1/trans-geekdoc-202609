    probable applications of Blockchain in the healthcare sector post-COVID. Table
    11.1 records the related works corresponding to each use case of Blockchain in
    a medical setting. The applications of Blockchain in the medical domain are detailed
    below.


    # 11.3.1 ELECTRONIC MEDICAL RECORDS SYSTEM


    One of the key requisites of the medical sector is interoperability (Ekblaw et
    al., 2016; Dagher et al. 2018; Dubovitskaya et al., 2017; Tanwar et al., 2020;
    Tang et al., 2019). Interoperability is the process of disseminating data among
    various institutions. A centralized storage system hampers the interoperability
    of the records in medical institutions. A huge number of medical records are created
    daily and stored at a centralized location at various hospitals. These records,
    which are maintained at various hospitals, can be lost. The accuracy of electronic
    health records will improve with a focus on data management and the compatibility
    of multiple health systems.'
  merge: -1
