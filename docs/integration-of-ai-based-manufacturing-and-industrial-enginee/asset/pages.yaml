  md: '![](img/3d190e19625a7567e7b93c8e95b18d9c_241_0.png)


    FIGURE 15.5 The Prony method of Multi Class-Support Vector Machine-based target
    detection algorithm. (Khalaf et al., 2018.)


    identifying and classifying buried explosive objects from the subsurface and compares
    the best classification techniques commonly applied in Machine Learning through
    GPR images. The confidence value is assigned based on classification algorithms,
    such as SVM, KNN, HMM, and RF methods, when the landmine is present at a particular
    point of the subsurface area. Several classification models are trained and tested
    on GPR images in A-Scan (1D), B-Scan (2D), and C-Scan (3D) data sets of explosive
    objects from the subsurface (Bhambri et al., 2021).


    Different versions of SVM classifiers are used in the articles (Jin and Zhou,
    2010; Andrew Karem, 2011; Camilo et al., 2016; Tbarki et al., 2017; Reichman et
    al., 2018; Khalaf et al., 2018; Shi et al., 2018; Gutierrez et al., 2019; Todkar
    et al., 2021). Among these modified versions of the SVM algorithm, the Prony method
    of MC-SVM has given the best accuracy and sensitivity at 99.94% and 98.97%, respectively.
    This method detected only AP landmines. Figure 15.5 shows a Multi Class-Support
    Vector Machine-based target detection algorithm (Khalaf et al., 2018).


    In addition, the SVM classifier used with the HOG method has given 95% probability
    detection with 0.017 FAR. The test collected data from different sites, including
    gravel, sand, grassland, and clay. The HOG method was tested and detected only
    AT landmines. This method retrieved characteristics from all three directions
    from cross-track, down-track, and depth directions, confirming the target location
    on the time slice using weight judgment. Figure 15.6 shows the process of a three-direction-based
    target detection algorithm (Shi et al., 2018).


    The KNN algorithm was used by Frigui and Gader (2009) and Yuan et al. (2019) to
    classify landmines. A possibility KNN classifier was used with the EHD method
    for feature extraction and LMS for pre-screening. It achieved 90% probability
    detection with a low false alarm rate. It principally detected AT landmines (Frigui
    and Gader, 2009). Furthermore, KNN was used with the TGSS method to identify landmines
    with 63.37% accuracy. The data set included 32 x 32-pixel GPR B-scan images. The
    technique produced a dimension-reduction performance for different imbalance ratios
    (Yuan et al., 2019).


    HMM is used in Missaoui et al. (2011), Oualid Missaoui et al. (2013), Anis Hamdi
    (2015), Manandhar et al. (2015), and Yuksel and Gader (2016) in different combinations.
    eHMM proposed a continuous and discrete version of HMM, and each shared the common
    data attributes. The ensemble method produced 94% probability detection and f1%
    FAR. Figure 15.7 shows the process of the ensemble Hidden Markov Model of landmine
    detection (Anis Hamdi, 2015). The discrete and continuous-based multi-stream HMM
    was implemented in Missaoui et al. (2011) and Oualid Missaoui et al. (2013) with
    Baum Welch and'
