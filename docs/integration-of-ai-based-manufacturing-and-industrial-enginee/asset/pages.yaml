  md: 'two-stage sampling method that integrates stochastically dispersed samples
    and aggregated foreground contour details. A total score combining appearance
    similarity, anticipated location, and model dependability has been used to select
    the best sample. To boost training accuracy even further, the samples are created
    using a sequence of adaptive variations based on the trustworthiness of the tracker
    outputs. Kadim et al. (2020) proposed a single object tracker which utilized deep
    learning to model the appearance of object at night.


    A pre-trained CNN in conjunction with fully connected layers has been utilized
    which is trained in an online fashion during tracking to account for changes in
    appearance as the object travels. To determine the best configuration for tracking
    at night, diverse learning hyper-parameters associated with optimization function,
    learning rate, and training sample ratio have been tested. Zhang et al. (2019)
    discussed the problems faced during CNN-based tracking involving a limited labelled
    data set. To deal with the problem, frame-to-frame translation model has been
    proposed. The model enabled the conversion of readily available labelled RGB data
    to the corresponding thermal IR data. The use of both paired as well as unpaired
    frame translation models has also been investigated. The approach generated a
    huge labelled data set of synthetic thermal IR sequences which could be used for
    end-to-end optimum feature training to further perform tracking.


    Huang et al. (2022) tackled the poor tracking performance caused due to a limited
    annotated data set by proposing an unsupervised deep-correlation thermal object
    tracking approach. Motivated by the front-reverse tracking uniformity of vigorous
    trackers, a novel strategy for unsupervised learning of a lightweight feature
    extraction network for TIR pictures has been investigated. To build the network,
    a Siamese correlation filter framework has been used which has been trained using
    quality-sensitive consistency loss per sample.


    El Ahmar et al. (2022) presented a new data set for tracking multiple objects
    containing ground truth annotations along with images for both RGB and matching
    thermal IR images. The performance of TOOD and VFNET object detector has been
    compared separately on thermal as well as RGB frames associated with the ADAS-FLIR
    thermal data set. The effectiveness of transferring the weights trained on an
    RGB data set on to its thermal counterpart has also been investigated (Kumar,
    2022). A multi-object detection-based approach that functions on thermal frames
    and enhances the association of data by applying active cut-off threshold on predicted
    bounding box has also been proposed. Kim et al. (2017) focused on the significance
    of VOT in the construction of a smart livestock management system. Behavioural
    patterns inferred from animal trajectories have the potential to provide a relevant
    information about the estrus cycle, disease prognosis, and so on, and thus the
    authors proposed a single thermal sensor-based animal tracking mechanism.


    The central idea of the proposed approach is to depict the animals in the foreground
    by simply thresholding a thermal frame as a topographic surface, which has been
    extremely useful for determining the object boundary even in circumstances when
    they overlapped. The results of segmentation produced from morphological processes
    applied on the topographical surface have been further utilized for constantly
    updating the central position of the animal. In thermal IR tracking, the function
    of tracker is to track a specific object of high importance (Kumar et al., 2021).'
