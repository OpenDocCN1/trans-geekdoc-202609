  md: '# 16.1.1.5 The Maximum Number of Clients Permitted in the System


    The maximum number of clients permitted in the system can be either limited or
    boundless. In certain facilities, only a limited number of clients are permitted
    in the system. Any clients who turn up subsequently are not permitted to enter
    the system, unless the numbers queueing turn out to be less than the permitted
    limit.


    # 16.1.1.6 Population/Calling Source


    The arrival of the clients relies on the basis which creates them. On the off-chance
    that only a couple of potential clients are present, the calling source is called
    limited/finite. In the event that there is a substantial quantity of potential
    clients, beyond 41 or 51, it is commonly assumed to be unbounded or infinite.
    There is as yet an alternative standard for arranging the source as limited or
    unlimited. A limited/finite source occurs when an entrance influences the probability
    of entrance of upcoming clients. For example, when considering apparatus repair
    a backup of N operating devices can be considered a finite resource. Before any
    apparatus stops working, it turns into a client and henceforth cannot create any
    additional call until it is restored. An unbounded/infinite source is said to
    exist when the entrance of a client does not influence the entrance rate of probable
    upcoming clients.


    # 16.1.1.7 Client''s Behavior


    The client''s behavior plays a crucial role in the analysis of waiting lines.
    A client is said to have baulked if he decides not to join the queue for the reason
    that it is too long. Similarly, a client is deemed to have reneged if he chooses
    to join the line but eventually becomes impatient and quits it. Customers are
    considered to be jockeying for position when there are at least two parallel lines
    and they switch from one line to the next.


    # 16.1.2 FUNCTIONAL FEATURES OF A QUEUING/WAITING LINE SYSTEM


    Examination of a waiting system contains a study of its various functional features.
    Among these are the following:


    +   1. Length of Queue (Lq) – Avg. number of clients in the line waiting to acquire
    the service. This eliminates the clients being served.

    +   2. Length of System (Ls) – Avg. number of clients in the system containing
    those waiting as well as those being served.

    +   3. In the queue waiting time (Wq) – Avg. time that a client has to spend in
    the waiting line to get service.

    +   4. In the system total time (Ws) – Avg. total time consumed by the clients
    in the system from the instant they reach until they leave the system. This is
    taken to be time to wait + the service time. It is also called traffic intensity.

    +   5. Utilization factors (ρ) – This is the amount of time a service provider
    really devotes to the clients. It is also called traffic intensity.'
