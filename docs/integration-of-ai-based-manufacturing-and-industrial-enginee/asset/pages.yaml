    # (vii) FLIR:


    The data set contains completely marked thermal and perceptible band frames that
    can be used to construct object detection systems with the help of convolutional
    neural networks (CNNs) (Bhambri et al., 2020). Consisting of 26,442 completely
    annotated images, it has 520,000 bounding box annotations belonging to 15 diverse
    object categories. A total of 7,498 video sequences are recorded at a frequency
    of 24Hz and containing pre-AGC frames in 16-bit format (Figure 6.6).


    # (viii) OTCVBS:


    For assessing and testing the novel tracking and detection algorithms, OTCVBS
    is one of the most widely accessible standard data sets. The data set includes
    video sequences and images captured in and beyond the visible band and is open
    to researchers involved in all the international computer vision societies (Chhabra
    and Bhambri, 2021). In order to capture the data set, a camera was positioned
    on the rooftop of an eight-story structure. This consisted of a 300D IR sensor
    core with a 75mm lens. Among the frequently used databases belonging to OTCVBS
    data set are the OSU thermal pedestrian database, the Iris thermal and visible
    face database, the terravic weapon IR database, the terravic motion IR database,
    the OSU colour-thermal database and so on (Figure 6.7).'
