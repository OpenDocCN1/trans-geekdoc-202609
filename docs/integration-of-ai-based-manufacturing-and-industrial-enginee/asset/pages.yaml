    In a similar vein, KalKi, a runtime enforcement IoT security strategy, was developed
    despite the fact that adding new IoT devices to the mix of already existing ones
    would raise the likelihood of further unlatched vulnerabilities. The chance of
    malicious code being embedded in the gadget during production would be a supply
    chain risk, but many commonplace devices, including the UAV, may be dealt with
    in the public sphere for quick replies. The KalKi platform was made available
    as a defence against outside threats.


    A more flexible and secure SDN-based interface between hardware and the network
    is KalKi. The definitions of a policy are updated to take use of its flaws and
    vulnerabilities in order to provide this protection. The KalKi system has the
    ability to be customized to reflect new vulnerabilities and recognizes threats
    (Echeverría et al., 2020).


    To maintain security for various modes in normal, suspicious, and under-attack
    states, it features many µboxes. In addition, it is adaptable enough to use various
