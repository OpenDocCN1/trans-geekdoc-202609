  md: 'employing reference signatures taken from the homogeneous medium. For training
    data samples, these feature selections are considered for the classifier, resulting
    in improved accuracy. The performance of landmine-buried objects depends on their
    type, the soil’s contents, and the soil’s nature. Machine learning has separate
    segmentation, feature extraction, and classification process techniques. Future
    work will incorporate deep learning (DL) to automate segmentation, feature extraction,
    and classification. DL uses neural networks with multiple layers, each extracting
    one or more unique features in an image. The performance of deep learning models
    for image classification has improved significantly in recent years. Deep learning
    architectures for image classification often achieve the highest accuracy rates,
    including AlexNet, CSAERNet, VGGNet, ResNet, GoogLeNet, Squeeze Net, Shuffle Net,
    DenseNet, etc.


