  md: "![](img/3d190e19625a7567e7b93c8e95b18d9c_117_0.png)\n\nFIGURE 6.7 Frames from\
    \ OTCVBS thermal data set.\n\n# 6.3 PERFORMANCE METRICS\n\nNew strategies and\
    \ frameworks are constantly being established, and futuristic tracking and recognition\
    \ systems are emerging. One of the most critical aspects in developing an effective\
    \ framework is assessing the effectiveness of that model. Different metrics are\
    \ often used to estimate the performance of the model, and these measures are\
    \ termed as performance metrics or evaluation metrics. Thus, in this section,\
    \ performance metrics have been roughly characterized into target detection performance\
    \ metrics and target tracking performance metrics.\n\n# 6.3.1 Detection Performance\
    \ Metrics\n\nBecause numerous approaches to MOT make use of the detection-based\
    \ tracking strategy, they frequently test both detection and tracking performance.\
    \ Target detection metrics are thus used in MOT methods and use different parameters\
    \ for evaluation. The most widely used detection performance metrics are:\n\n\
    +   a) Precision:\n+   This refers to the model’s precision in detecting only\
    \ relevant objects and is the ratio of true positives to total detections recorded\
    \ by the model. Mathematically, this is given as Eq. (6.1). Here, TP stands for\
    \ true positive and FP stands for false positives. A good model has both high\
    \ precision and high recall.\n+   \n+   P = TP / (TP + FP) (6.1)"
