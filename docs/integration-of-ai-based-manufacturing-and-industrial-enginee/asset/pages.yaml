    # 17.2 RELATED LITERATURE


    Below are some implementations on the discussed issue.


    Mohsen Babaeian and Mohammad [14] have used biomedical signal analysis, which
    is based on machine learning in order to detect the drowsiness of the driver.
    Two different frequencies were analyzed and found out that EEG signals, since
    they are not stationary, perform better than wavelets. Umit Budak and Varun Baja
    [15] used three feature extraction methods to characterize the drowsiness of the
    driver; these features were then classified individually. Frequency features from
    first and deep features from second feature extraction procedure were extracted.
    In J. Rajevenceltha, V. Anjana and Vilas H. Gaidhane [16], the face is detected
    using linear binary patterns and histogram of oriented gradients (HOG) algorithm
    is later used to extract the features. The performance of the system is tested
    in different lighting conditions [17].


    Chamaporn Chianrabutra, Chamaiporn Sukjamsri, Theekapun Charoenpong and Wisarooot
    Tipprasert [4], performed four stages i.e., face, mouth, eyes and yawn detection
    [18]. An infrared camera was used for analysis and accuracies were obtained for
    each stage. Next, in Hongyi Li, Feng You, Haiwei Wang, Xialong Li, Yunbo Gong
    [19] the SVM classifier is trained and the state of the eyes is decided based
    on the results of the testing phase. Face features of the driver were obtained
    from live video using DCCNN that bypasses the process of artificial feature extraction.
    In Chao Zhang, Shui Yu, Xiaopei Wu and Xi Zheng [20], drowsiness is detected by
    the parallel detection of yawn, blink and blood volume pulse signals.


    Federico Geude-Fernandez, Juan Ramos-Castro, Miguel A. Garcia-Gonzalez and Mireya
    Fernandez-Chimeno [21] found that respiratory rate variability had been analyzed.
    Based on this analysis, a novel method had been proposed to monitor the driver’s
    drowsiness. 15 test cases have been conducted and an algorithm known as TEDD has
    been used for identifying the driver’s fight against drowsiness [22–26].


    In Alexey Kashevnik, Anton Shabaev, Nikolay Shilov and Vladimir Parfenov [27],
