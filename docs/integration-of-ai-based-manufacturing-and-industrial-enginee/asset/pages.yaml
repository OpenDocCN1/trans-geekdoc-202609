    # Assumption 1


    The kinematic constraint is supposed to be a rigid, frictionless surface, and
    it states that the end-effector must follow a predetermined desired position without
    losing contact with it.


    # Assumption 2


    It is assumed that any singularities should be kept at a distance from the reconfigurable
    manipulator so that the Jacobian matrix can continue to exist as a full rank matrix.


    # Assumption 3


    The desirable terms, such as the desired joint position, wanted velocity, and
    intended acceleration, are all bounded, ensuring the closed-loop system''s asymptotic
    stability.'
