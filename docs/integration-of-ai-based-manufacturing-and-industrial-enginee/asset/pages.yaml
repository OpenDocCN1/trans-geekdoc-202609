    which will transform AI and ML applications and affect how we communicate (Hofmann
    et al., 2019; Cioffi et al., 2020).


    Computerized accounting systems are referred to as “Artificial Intelligence” (AI)
    when they mimic human brain processes (Kaur and Bhambri, 2016). Intelligent systems,
    computer vision, the processing of natural language speaker identification and
    machine vision are all among examples of specific AI applications. The following
    might all be regarded as types of AI: Machines That React, Small Memory, Concept
    of Mind, Self-aware, Narrow Artificial Intelligence (ANI), and AGI stands for
    Artificial General Intelligence, or super intelligence (ASI) (Bhambri et al.,
    2019).


    Using computers to perform tasks that usually require human intelligence is known
    as AI. This s capable of processing large amounts of data in ways that humans
    are not capable of. The ultimate goal of AI is to replace human skills such as
    discernment, pattern recognition, and decision-making (Adhikari and Munusamy,
    2021). Figure 2.1 shows how industrial engineering can be innovated through the
    use of IOT and AI.


    Everything and Things A comprehension of the notions of “entities” and “totality”
    is important when engaging in discourse pertaining to the IoT and the IoE. The
    term “thing” in the context of the IoT encompasses any object that is capable
    of establishing a connection. The broad definition allows for a wide range of
    entities to be classified as “things” within the IoT framework, making it a versatile
    and inclusive notion. Contrarily, we define it in an opposing manner. An object
    of a physical nature may possess additional attributes that enable it to meet
    the criteria for being classified as a “thing.” (Jain et al., 2021a).


