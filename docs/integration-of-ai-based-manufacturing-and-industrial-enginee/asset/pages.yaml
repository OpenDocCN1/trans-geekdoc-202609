- pgno: 164
  md: '# 9.4.3 TERTIARY PHASE


    In the Tertiary Phase, the visibility and clarity of the filtered images taken
    from Stage-2 will be improvised by the process of enhancement techniques. Here,
    initially, the original compressed image will be passed through the high pass
    filter, which leads to the extraction of high frequency components, and generates
    the scaled version of the image. Then, this scaled version will be added to the
    original compressed image results in an enhanced version of the image as the final
    outcome. During this enhancement process, the edge detection, the noise removal
    process and the morphological operations will be implemented (Figure 9.7).


    The various edge detection techniques which can be considered are listed below:


    +   - Sobel

    +   - Canny

    +   - Prewitt


    The various noise removal algorithms which can be considered are listed below:


    +   - Linear Filters

    +   - Non-Linear Filters


    The various morphological operations which can be considered are listed below:


    +   - Dilate

    +   - Erosion

    +   - Compliment

    +   - Intersection

    +   - Union


    Along with the listed methods, additional techniques can be adopted for the better
    vision of the image. These techniques include:


    +   - Sharpening

    +   - Labelling

    +   - Clustering


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_164_0.png)


    FIGURE 9.7 Filtering process.'
