    and Applied Software at the Faculty of Engineering, “Aurel Vlaicu” University
    of Arad, Romania. She holds a PhD in Applied Electronics and Telecommunications
    from the Polytechnic University of Timisoara. Dr. Balas is the author of more
    than 300 research papers in refereed journals and international conferences. Her
    research interests include intelligent systems, fuzzy control, soft computing,
    smart sensors, information fusion, modeling and simulation. She is the editor-in
    chief for the International Journal of Advanced Intelligence Paradigms (IJAIP)
