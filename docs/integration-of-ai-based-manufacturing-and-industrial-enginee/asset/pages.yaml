  md: '# 11 Use Cases of Blockchain in Post-Covid Healthcare


    Charu Krishna, Divya Kumar, and Dharmender Singh Kushwaha


    Motilal Nehru National Institute of Technology Allahabad, Prayagraj, India


    # 11.1 INTRODUCTION


    The healthcare sector comprises medical equipment and devices, hospitals, telemedicine,
    health insurance, clinical trials, etc. The current market in India is being driven
    by government initiatives such as tax benefits, e-health and incentives. The industry
    is growing rapidly as a result of rising cases of lifestyle diseases and the increased
    demand for affordable healthcare delivery systems due to increasingly expensive
    healthcare, technical developments, the rise of telemedicine, and the increase
    in health insurance (Dhanalakshmi, et al., 2022). Due to the additional legal
    requirements to protect patients’ medical information, the healthcare industry
    has unparalleled security and privacy standards. Healthcare data management is
    required for the timely and accurate treatment of patients (Rani et al., 2022).
    It has evolved tremendously in line with the advancement of technology, from storing
    medical records on paper to using client-server architecture to storing electronic
    medical records (EMRs) on the cloud (Ekblaw et al., 2016).


    Prior to the spread of COVID-19 (SARS-CoV-2 virus), the healthcare sector was
    already facing a number of difficulties due to the interoperability, privacy,
    and supply chain traceability issues (Singh et al., 2021a). With the ongoing pandemic,
    new difficulties and costs have emerged, including the need to modify supply networks
    to deliver the urgently required personal protective equipment (PPE), to rapidly
    produce and approve treatments, tests, and vaccines fast, to repatriate pharmaceutical
    supply chains, and to deal with rampant counterfeiting and increased false insurance
    claims, etc.


    Issues with data, such as interoperability, transparency, error, privacy and security,
    legislation, and control of access to patients’ medical information records, were
    amplified by the pandemic as it has an effect on all stakeholders in the healthcare
    industry (McGhin et al., 2019). For example, almost 41 million health records
    were compromised in 2019, with one hacking attack involving approximately 21 million
    records. The proprietary electronic health record (EHR) systems developed by over
    700 manufacturers often need to communicate between themselves. In surveys more
    than 70% of top medical researchers stated they had had access to erroneous, deceptive,
    or incomplete information, making it difficult to make decisions. The healthcare
    issues include interoperability, infodemics, privacy and security, continuous
    patient monitoring, inadequate data for research, false insurance claims, drug
    counterfeiting,'
  merge: -1
  img_proc: true
- pgno: 184
  md: '![](img/3d190e19625a7567e7b93c8e95b18d9c_184_0.png)


    FIGURE 11.1 Healthcare sector issues.


    and supply chain management (Tanwar et al., 2022). Figure 11.1 illustrates all
    of the various issues faced by healthcare. The healthcare industry can solve these
    issues with emerging technologies, such as blockchain.


    # 11.2 BLOCKCHAIN


    Blockchain is a type of distributed ledger technology. It involves an ever-increasing
    chain of blocks which are used to store data in the form of transactions that
    are immutable and stored on a distributed ledger. Each block is linked together
    by storing the previous block’s hash to form a unique chain which cannot be corrupted.
    Figure 11.2, shows the basic structure of a Blockchain, which eliminates the need
    for central authority and the risk of single-point failure. Blockchain technology
    came into existence in 2008, when Satoshi Nakamoto first introduced the cryptocurrency
    Bitcoin (Nakamoto, 2008). Since then, many other cryptocurrencies have been introduced,
    such as Litecoin, ether, dogecoin, Solana, etc. Outside of the financial sector,
    the popularity of Blockchain has risen exponentially in various sectors, including
    healthcare, business, banking, land registry, supply chain management, etc. Different
    Blockchain platforms, such as Ethereum, Hyperledger, and IOTA, have also been
    introduced.


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_184_1.png)


    FIGURE 11.2 Blockchain structure.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 11.2.1 TYPES OF BLOCKCHAIN NETWORKS


    A Blockchain network is a peer-to-peer network. They can be found in three different
    types: public, private, or consortium.


    +   1. Public Blockchain networks

    +      A network that allows anyone to join and participate is called a public
    Blockchain — for instance, Bitcoin. The disadvantages of such networks include
    weak security, considerable computational power, and less privacy for transactions.

    +   2. Private Blockchain networks

    +      A network in which one body administrates the Blockchain is known as a
    private Blockchain network, managing who can join and participate in a consensus
    protocol and managing the shared distributed ledger. Based on the use case, this
    can highly increase confidence and trust between stakeholders.

    +   3. Consortium Blockchains

    +      A Blockchain can be maintained by multiple organizations in a consortium
    Blockchain network. The selected organizations govern who can access the data
    or execute transactions (Rani et al. 2023). This Blockchain is suitable for use
    cases where all participants are to be allowed and have a shared responsibility
    in the Blockchain.


    # 11.2.2 FEATURES OF BLOCKCHAIN WHICH ARE USEFUL FOR THE HEALTHCARE INDUSTRY


    Blockchain, a distributed ledger technology (DLT), has the capacity to empower
    the healthcare industry in multiple ways (Zheng et al., 2018) and research scholars
    from all around the world are working to create Blockchain networks for the healthcare
    sector (Kumar et al., 2022). As health data are sensitive personal information,
    the collecting, recording, and analyzing of health data is particularly delicate.
    In order to safeguard patient data, health data is arranged into separate silos.
    This means that there tends not to be uniform information exchange. A failure
    to share information results in incorrect and slower disease diagnoses, insecure
    data flows across silos, and incomplete records. The concept of employing a DLT
    to make the patient the sole and unique owner of their data was introduced in
    order to address these difficulties. The adoption of such a technology makes system
    interoperability possible. The following characteristics of the system make Blockchain
    useful for the healthcare industry:


    +   1. *Immutability.* Immutability achieved by cryptographic hash functions does
    not allow data to change by malicious users, thereby increasing reliability. Once
    a transaction is saved on the Blockchain, it cannot be tampered with or corrupted.
    The current block stores the previous block’s hash to be added in the chain. This
    maintains the chronological order of the Blockchain and makes it tamper-proof.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '+   2. *Decentralization.* The decentralized nature of Blockchain eliminates
    the risk of system failures due to single-point failures or other attacks (e.g.,
    DDoS attacks), further improving system security and reliability. Decentralized
    data management eliminates the need for one central authority over the overall
    data, giving controlled access to all stakeholders.

    +   3. *Enhanced Security and Privacy.* Data may receive some protection from
    Blockchain security schemes, which include asymmetric encryption/decryption schemes
    and digital signatures. Second, adding additional security measures such as access
    control and authentication to Blockchain increases security. Cryptographic functions
    are utilized to provide security to the Blockchain network. These functions are
    used to sign a transaction for authentication. Central point failure problems
    are eliminated as the network is decentralized.

    +   4. *Transparency and Trust.* The data kept on a Blockchain is fully traceable.
    The decentralized consensus algorithms and asymmetric cryptographic methods (i.e.,
    digital signature) of Blockchain implement data traceability and non-repudiation.
    The stakeholders now have more trust in one another. All transactions are visible
    to everyone in a public Blockchain network and each transaction is identified
    by a unique id called a transaction hash. A transaction receipt is generated after
    the processing of each transaction which is available publicly. The unique transaction
    id is used to find a record. The receipt contains details of the transactions.
    All the nodes have access to all the records to achieve transparency. Transparency
    in the system can also instill trust in institutions.

    +   5. *Health Data Ownership.* Blockchain enables healthcare data to be patient-centric.
    The patient owns their data and has full control over who can have access. Letting
    people take control over the managing of their healthcare data. All of a patient’s
    data is available to them anytime, anywhere.

    +   6. *Data Availability and Robustness.* As the data is not stored at a central
    location but is held at all the Blockchain nodes, it is readily available. Hence
    a robust and resilient system is guaranteed. Every node in the Blockchain network
    has a copy of the entire Blockchain. Transactions are not processed on a centralized
    system; rather, they are verified in various locations by the network participants.
    The distributed nature of the Blockchain network enables it to be an egalitarian,
    peer-to-peer, self-reliant network.


    # 11.3 BLOCKCHAIN APPLICATIONS IN POST-COVID-19 HEALTHCARE


    Blockchain technology has the potential to revolutionize the entire healthcare
    sector. It provides a novel, innovative, and disruptive solution to the various
    problems encountered by the sector. Applications of Blockchain in the healthcare
    sector post-COVID include electronic medical records, automatic insurance systems,
    drug supply chains, data collection platforms for research, anti-infodemic systems,
    secure data-sharing platforms, continuous patient monitoring, contact tracing,
    outbreak tracking, and donation tracking (Ritu and Bhambri, 2023). Figure 11.3
    lists the'
  merge: -1
  img_proc: true
