- pgno: 122
  md: '# 6.4 CONCLUSION AND FUTURE SCOPE


    This chapter has considered recent techniques which have utilized various deep
    learning models to perform object tracking during night in thermal IR video sequences.
    Infrared effects on acquisition sensors often cause non-uniformity in thermal
    imaging systems. IR imaging in real time is also hampered by the deficiency of
    texture information, colour patterns, shape information, the high percentage of
    dead pixels, and very unclear pixel values. Diverse treatments for the same have
    come up depending upon the area of application. One key challenge in IR MOT is
    that the performance of an MOT approach is strongly dependent on object detectors.
    The commonly used detection-based tracking paradigm is based on a detector which
    generates detection theories to guide the tracking method. A similar technique
    might provide tracking results with considerable performance changes if various
    sets of detection theories were used while the remaining components were fixed.
    Some methods work well in particular thermal sequences. However, when extended
    to other circumstances, they might not always give satisfactory outcomes. This
    problem can be caused by modifications in camera vision or camera position, i.e.
    whether it is dynamic or static.


    For accurate thermal object tracking, a powerful observation model associated
    with the deep learning model developed to perform object detection can considerably
    enhance the tracking performance. More study is needed to formulate and model
    the object association utilizing deep neural networks. The modules, such as attention
    mechanism and Long Short-Term Memories (LSTMs), can also be employed to achieve
    enhanced tracking results.


