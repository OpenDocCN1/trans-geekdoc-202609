    # 9.4 PROPOSED METHODOLOGY


    This chapter outlines the design and development of a framework using cutting-edge
    techniques in advanced digital image processing. This chapter outlines a process
    of image processing, which enhances the images, leading to greater clarity and
    visibility. In this process, various phases are involved as listed below:


    +   - Preliminary Phase: An effective compression of images for further processing
    results in the optimum utilization of the memory space.

    +   - Secondary Phase: The categorization of the images.

    +   - Tertiary Phase: An efficient enhancement of the images for high-quality
    visibility.


    The architecture of the proposed framework is represented in Figure 9.2.


    # 9.4.1 PRELIMINARY PHASE


    Modern developments in IT-related technology have resulted in the generation of
    enormous quantities of information each second (Singh et al., 2021). Consequently,
    it is almost inevitable that the quantity of information deposited and transmitted
    is probably likely to rise steeply in future. These types of data can be in a
    variety of different forms: video, audio, image, numeric and so on (Rani et al.,
    2023). When the data is of type image, the image enhancement techniques play a
    major role in'
