  md: '![](img/3d190e19625a7567e7b93c8e95b18d9c_191_0.png)


    FIGURE 11.4 Challenges faced by the application of Blockchain in the healthcare
    industry.


    workflow. The need for standardization rose as there was an increase in the adoption
    of Blockchain in various sectors. The inhibition in the adoption of Blockchain
    technology is due to a lack of uniformity. For instance, communication between
    Ethereum and Hyperledger fabric-based healthcare apps is not easy.


    # 11.4.2 PRIVACY AND SECURITY


    The healthcare Blockchain is at risk of being attacked by malicious organizations
    or government agencies. Blockchain networks have witnessed several attacks in
    the past (Zheng et al., 2018). By stealing the private key used to encrypt and
    decrypt healthcare data, unauthorized individuals may gain access to the information
    stored on the Blockchain.


    # 11.4.3 SCALABILITY


    Another obstacle in adopting Blockchain technology in medical settings is the
    scalability of Blockchain. At present, Visa handles 1700 transactions per second,
    for example, whereas Bitcoin and Ethereum handle 7 and 20, respectively.


    # 11.4.4 LATENCY


    The issue of speed is another one that might be problematic because processing
    which is dependent on Blockchains might cause a sizable delay. For instance, to
    complete the validation process, the validation mechanism employed in the current
    configuration of the Blockchain on the Ethereum platform requires the involvement
    of all network nodes. Processing is significantly delayed as a result, especially
    if there is a large quantity of data load.'
