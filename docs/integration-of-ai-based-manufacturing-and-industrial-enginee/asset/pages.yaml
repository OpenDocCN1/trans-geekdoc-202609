    # 14.2 MANET ROUTING PROTOCOLS


    The ad hoc routing protocol’s job is to regulate node choices made when sending
    packets between devices in MANET (Bhambri et al., 2023; Anchugam & Thangadurai,
    2015). A node has no knowledge of the network topology when it joins or attempts
    to join. It learns the topology by proclaiming its presence or receiving signals
    from nearby nodes. The implementation of the routing protocol affects the route
    discovery process in a network. Every time an envelope must be sent to a destination
    reached by several nodes, the Routing Protocol is also required (Bhambri et al.,
    2022; Ibrahim et al., 2022). Because nodes in mobile ad hoc networks might move
    unpredictably, joining or leaving the network, the routing methods for wired networks
    cannot be employed. This implies that a path that is ideal at one point in time
    might not be appropriate at another.


    # 14.2.1 AODV Routing Protocol


    The ad hoc on-demand distance vector (AODV routing protocol routes are only known
    to the station as the next hop and destination pair; they are established as needed
    in the routing database of AODV.


    # 14.2.2 DESTINATION SEQUENCED DISTANCE VECTOR PROTOCOL (DSDV)


    The DSDV routing protocol has been enhanced to overcome the count to infinity
    problem. Every node keeps a routing table with entries for each additional node
    in the network. Each node keeps track of the shortest hops required to send a
    packet to its destination via its neighbours, and it selects that neighbour as
    the subsequent node (Quy et al., 2018). It is a proactive protocol; therefore
    any time the topology changes or at regular intervals, the nodes send their routing
    tables to their close neighbours (Ritu & Bhambri, 2022). The sequence number of
    a node must be increased when sending an update message (Quy et al. 2019a). A
    broadcast'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'message can be received by a node at any time from its locality. It contrasts
    the fields for the sequence number and hop count of the incoming message in its
    routing table with the relevant entry (Mahmoud et al., 2015). The node changes
    its routing database with distances being recalculated using the updated sequence
    number and hop count if there is a discrepancy between the two. In response to
    Route ERRor (RERR) warnings, DSDV invalidates all routes that include broken links
    in their routing database. These routes receive an unlimited metric and an increased
    sequence number right away (Jamal et al., 2022).


    # 14.2.3 COMPARISON BETWEEN AODV AND DSDV PROTOCOLS


    The AODV and DSDV routing protocols differ in a few ways. Firstly, unlike DSDV,
    AODV only updates routing information when it is necessary to do so. It does not
    routinely update the routing data. By contrast, DSDV will upgrade the nodes’ routing
    table on every occasion. Every node frequently shifts positions. There is no recurrent
    updating in AODV. There is no cycle topology in DSDV; instead, routing information
    propagates continuously. DSDV has a significantly lower packet delivery latency
    than on-demand protocols. When compared to table-driven protocols, AODV has a
    higher first-packet delivery time. There is a route to every other neighbour node
    in DSDV that is not present in AODV.


    # 14.2.4 SIMULATION ENVIRONMENT


    NS-2 is free, open source, and supports a variety of networks, including wired
    networks, wireless ad hoc modes, an managed wireless modes. NS-2 is used for simulation.
    Additionally, NS-2 is more realistic than other simulators due to its vast model
    library, effective simulation design, and its ability to produce good results
    (Bhambri et al., 2021). It is an object-oriented tool command language and C++
    discrete event simulator. It is appropriate for evaluating various protocols,
    traffics, and creating new protocols. Both the NS-wireless and Excel applications
    visually represent the performance indicators by monitoring the movements and
    occurrences of the nodes inside the simulated network. The NS-2 software also
    provides a visual depiction of the network, shown in Figure 14.2.


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_223_0.png)


    FIGURE 14.2 Architecture of NS-2.'
