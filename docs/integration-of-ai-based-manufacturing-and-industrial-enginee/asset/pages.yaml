    # 17.5.2  LED


    An electrical component that produces light when an electric current gets passed
    through, this it as a result of electrons reattaching with holes. Additionally,
    it is a light source built on semiconductors. It is a specific form of diode with
    properties similar to those of a p-n junction diode. This implies that an LED
    allows current to flow in one direction – forward – while blocking it in the opposite
    direction. Furthermore, we construct light-emitting diodes by employing a thin
    layer of semiconductor material that has been severely doped.


    The LED module contains two pins, one negative and other one positive. The positive
    pin is connected to pin 9 and the negative pin to the ground pin of Arduino.


    For the purposes of experimental setup, a small LED is used but for the actual
    implementation of the system in a vehicle, a larger light could be used, which
    turns on and flashes light on the driver’s face when the driver closes their eyes
    for some seconds or the driver falls asleep.


    # 17.5.3  Vibration Sensor


    The name piezoelectric sensor is also used to refer to the vibration sensor. These
    flexible sensors are used to measure a variety of operations. This sensor converts
    changes in acceleration, pressure, temperature, force, or strain into an electrical
    charge by using the piezoelectric effects. By instantly determining capacitance
    and quality, this sensor is also utilized to determine airborne smells. There
    are three main categories of vibration sensors: velocity, acceleration and displacement.
    Displacement sensors track changes in the gap between the spinning component'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'and the fixed housing of a machine (frame). Displacement sensors work by measuring
    displacement by inserting a probe into a hole which has been drilled down and
    tapped in the machine’s frame, directly on top of a spinning shaft. On the other
    hand, velocity and acceleration sensors gauge the motion or acceleration of the
    object to which they are fastened, which is frequently a part of the machine frame
    that is visible from the outside. The vibration sensor contains three pins, namely
    D0, Vcc and Ground (GND). The Arduino chip is connected to vibration sensor via
    the following pin configuration:


    +   - D0 is a I/O signal pin to signal pin 13 of Arduino.

    +   - Vcc of sensor to 5 V pin of Arduino, Vcc is also known as the 5 V pin.

    +   - GND or ground pins of both Arduino and Vibration sensor are connected to
    each other.


    # 17.5.4 Buzzer


    A buzzer or beeper is a sound-producing signaling tool. It could be electromechanical,
    piezoelectric, or mechanical in nature. The mount holes on this piezo buzzer are
    30mm apart and have a diameter of 23 mm. It comes with a 100 mm lead and is rated
    for between 3 and 20 volts. At 30 cm, it generates a 3k Hz tone at an 85 dB level.
    The basic working premise is that any time an electric potential is applied across
    a material which is piezoelectric, pressure variation is generated. The buzzer
    contains crystals placed between conductors: one conductor on top and the other
    on the bottom. Due to an inherent property, these crystals pull the opposing conductor
    when a potential difference is applied across them. Continual pulling and pushing
    causes a sharp soundwave to be produced. The buzzer contains two wires, namely
    a red one (which stands for positive) and a blue one (which represents the ground).


    The buzzer is connected to Arduino chipset via the following configuration: Positive
    is connected to 8 pin and ground is connected to the ground pin of Arduino.


    # 17.5.5 Arduino Uno


    Arduino is a tool for controlling electronic items, including input devices such
    as temperature, light, touch, IR and humidity sensors, and output devices such
    as DC and stepper motors, LCD displays and LED lights etc. Arduino can be used
    to read input signals as well as control output signals. There are different types
    of Arduino boards, and Arduino Uno is the most popular. All Arduino boards share
    one common feature, which is the microcontroller at mega 328. One of the reasons
    why Arduino has become popular is that the use of microcontroller was made easier
    by its creators. While in general the documentation of microcontrollers contains
    a lot of technical jargon, Arduino is easier to understand, and anyone can try
    using it. The board is designed to be easy to use as, for example, we don’t need
    any specialized cable such as pod or a blaster cable to connect Arduino to our
    computer. All we need is a simple USB cable, which acts as power supply to Arduino.
    This is generally not preferred in situations where we need large streams of input,
    such as big computations or video recordings.'
