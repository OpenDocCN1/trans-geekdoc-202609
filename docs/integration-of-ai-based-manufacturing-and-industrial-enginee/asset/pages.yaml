  md: "# 13.5 CHALLENGES\n\nAlthough industrial engineers have come up with several\
    \ new ideas and techniques to improve the overall workflow of the industry, there\
    \ are still a number of challenges (Sharma and Bhambri, 2020). The critical challenges\
    \ to Industry 4.0 are discussed below.\n\n+   a) *Inability to implement or embrace\
    \ a new business model*\n+   To compete on the world stage, present-day industries\
    \ demand a highly specialized and flexible environment. In this regard, industries\
    \ must embrace fresh business strategies. Because of the excessive amount of data\
    \ collected throughout the manufacturing process, the collaboration of many systems\
    \ results in the data into the Big Data space. Enterprise productivity is increased\
    \ through the use of industrial Big Data analytics. Big Data’s ability to predict\
    \ future events gives project planners a firm basis on which to build. It is difficult\
    \ for data analysts to build appropriate techniques for implementing/adopting\
    \ new business strategies because not all new aspects will necessarily be implementable\
    \ and only certain events (out of millions) are interesting (Khan et al., 2017).\n\
    +   \n+   b) *Inadequate current data quality*\n+   The other important criterion\
    \ for the implementation of new industrial features of Industry 4.0 is data quality.\
    \ A large volume of data is generated (Big Data) because of the interconnection\
    \ of several machines, sensor devices, industrial equipment, and facilities in\
    \ Industry 4.0. The higher management may use the Big Data at their disposal to\
    \ put Industry 4.0’s technologies into effect for a sustainable future. In the\
    \ absence of high-quality data, this would have been unachievable (Santos et al.,\
    \ 2017).\n+   \n+   c) *Coordination and collaboration issues*\n+   To have a\
    \ good understanding of corporate policy, there must exist collaboration and transparency\
    \ among the members within an industrial unit to adopt the new industrial principles\
    \ (Industry 4.0) (Pfohl et al., 2017). There must be a proper communication mechanism\
    \ between the different industrial units and this can only be possible if there\
    \ exists compatibility of software and hardware, and standard interfaces, and\
    \ there must be good coordination and collaboration with suppliers. Data synchronization\
    \ in order to gain better synchronization with manufacturers is also necessary\
    \ (Duarte and Cruz-Machado, 2017).\n+   \n+   d) *Legal issues*\n+   In the era\
    \ of Industry 4.0, distinct machines, sensor devices, buildings, and people interact\
    \ with one another through a cyber-physical network. The connection may have some\
    \ complex legal ramifications. Legal considerations are made to be available using\
    \ contemporary technological routines and methods for the welfare of the industries.\
    \ In the present day, Industry 4.0 comes up with a data-driven business model\
    \ that takes into consideration data privacy and security issues (Müller et al.,\
    \ 2017).\n+   \n+   e) *Financial concerns*\n+   Enterprises in Industry 4.0 take\
    \ into consideration the financial constraints as a big hindrance to the growth\
    \ in terms of need of heavy machinery, the latest equipment, basic amenities,\
    \ and eco-friendly process innovations (Nicoletti, 2018)."
