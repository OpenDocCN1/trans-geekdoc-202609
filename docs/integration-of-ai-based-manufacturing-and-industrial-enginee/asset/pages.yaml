  md: '# 8 Phased.js: Automated Software Deployment and Resource Provisioning and
    Management for AI


    P. Ushashree

    Geethanjali College of Engineering and Technology,

    Hyderabad, India


    Archana Naik, Anurag Verma, and Anshuman Priyadarshini

    NITTE Meenakshi Institute of Technology, Bangalore, India


    # 8.1 INTRODUCTION


    Artificial Intelligence (AI) is useful in decision-making, since its application
    means that the system can mimic the actions of the human brain through a process
    of automation to carry out the assignment (Shekhar, 2019). In the early phases
    of development, programmers generally have no idea with regard to the process
    of backend server. Even if they know about the development of a local host application
    it is an entirely different prospect for them to convert it to a production build
    application. The main problem for programmers that arises here is that “they know
    what to do” but “they don’t know how to do” (Singh et al., 2021).


    We have a range of technology, such as Amazon EC2 and the Google compute engine
    (Shaik et al., 2018), which have many configurations and dependencies for different
    applications used by programmers. EC2 has its own administration panel which gives
    the status of the application, but this is very hard to understand until you go
    through the associated documentation. Accordingly, it is more usual, when logging
    real-time data from the live application, for developers to use bash script to
    log it to a single file (Karakostas, 2014).


    Due to the high learning curve involved in the deployment of technology faced
    by new learners, they encounter many problems in learning the techniques and fail
    to make an accurate determination of the resources to provision (Huang et al.,
    2017). In this respect the main idea now advanced is to remove that dependency
    on learning'
