  md: '# 6 Recent Advances on Deep Learning Based Thermal Infrared Object Tracking
    in Videos: A Survey


    Aayushi Gautam, Santosh Kumar, and Swaran Singh

    Chandigarh Group of Colleges, Mohali, India


    # 6.1 INTRODUCTION


    With reference to computer vision, visual object tracking is described as a deep
    learning mechanism where the object movement is traced by an algorithm. The algorithm
    is a tracker that predicts the future positions and additional appropriate information
    related to objects in motion inside a video sequence (Ciaparrone et al., 2020).
    One simple method to track is by applying a detection technique to an individual
    video frame; however, tracking is essential as it maintains the object identity
    in case of multiple targets.


    Object tracking or visual object tracking (VOT) has been shown to be vital in
    various civilian and non-civilian applications, including surveillance, medical
    imaging, video analytics, Augmented Reality, traffic monitoring and so on. An
    immense amount of research has been carried out in target tracking during day;
    however, the issues relating to tracking during the night has also gained popularity
    over time (Liu et al., 2021). This has been made possible through the effective
    use of thermal imaging technology which not just allows a vision beyond dark but
    also acts as a power multiplier in several applications. Thermal cameras are exclusively
    used in video-surveillance frameworks as they can be deployed in weather circumstances
    where coloured cameras fail or produce poor results, such as during night and
    in the dark, or even during fog and rain. Thermal imaging has the ability to ensure
    the security of individuals and commodities in cities, at state lines, and within
    other monitored regions.


    # 6.1.1 THERMAL INFRARED IMAGING


    Thermal infrared (IR) imaging, also known as non-visible imaging, generally use
    IR cameras which contain sensors which are highly sensitive to wavelengths associated'
  merge: -1
  img_proc: true
- pgno: 106
  md: '![](img/3d190e19625a7567e7b93c8e95b18d9c_106_0.png)


    FIGURE 6.1 Infrared region in electromagnetic spectrum.


    with the IR region of the electromagnetic spectrum. IR cameras detect heat emitted
    or replicated by the target under observation and transforms the same into heating
    rate, further creating an image even in low-visibility scenarios. Thermal cameras
    functioning in the mid-wave IR region and long-wave IR regions (Figure 6.1) rarely
    require supplementary heat and light sources because the sensors employed in these
    ranges easily record the thermal energy emitted from the object under observation.
    As a result, contrary to visible light cameras, they are not affected by lighting
    conditions, are resistant to extensive brightness fluctuations and climatic situations,
    and work in total darkness.


    Thermal imaging sensors, however, deliver significantly fewer details in comparison
    to visible-light camera systems for the reason that, instead of providing the
    information which colour offers in the visible light band, they simply offer the
    observed temperature range plotted on thermograms, which usually are of significantly
    lesser resolution (Bourlai & Cukic, 2012). Changes in the temperature of the ambience
    also have an impact on the superiority of IR frames because frames are created
    by the heat intensity emission difference among various entities and their surroundings,
    therefore a greater atmospheric degree can minimize the distinction between the
    background and the target object. Thus, despite advances in the field, the tracking
    of objects in thermal video frames remains an open challenge (Dhanalakshmi et
    al., 2022).


    # 6.1.2 THERMAL OBJECT TRACKING


    Given the initial condition of the target in the first frame, thermal infrared
    object tracking predicts the trajectory of the target in successive thermal IR
    sequences. Thermal IR frames are created by infrared radiation energy reflected
    into the scene. There are occasions when the appearance of a moving object in
    the sequence is concealed (Gautam & Singh, 2022). In such cases, when detection
    fails tracking works as it consists of an object’s motion model and an appearance
    model (Bhambri et al., 2022).


    Analysing and modelling the object motion is a vital element of a good tracker.
    Thus, a motion model which imitates the true dynamic behaviour of an entity is
    constructed. It predicts an object’s probable position in future frames, thereby
    reducing the search space. A few conventional approaches have attempted to predict
    the motion pattern of an object; unfortunately, however, such techniques lacked
    the ability to anticipate rapid motion and angular variations. The majority of
    very precise trackers demanded a thorough comprehension of the target’s visual
    features. More importantly, they must be able to discern between the subject and
    its surroundings. Visual'
  merge: -1
  img_proc: true
- pgno: 107
  md: '![](img/3d190e19625a7567e7b93c8e95b18d9c_107_0.png)


    FIGURE 6.2 Major components of IR object tracking frameworks.


    appearance may be adequate in single object trackers (SOT) to perform IR tracking
    between frames, but it is inadequate in the case of multi-object trackers (MOT).
    In general, all IR object trackers are made up of the segments shown in Figure
    6.2.


    +   a) *Target initialization*

    +   The target’s initial state should always be set during this step by drawing
    a bounding box (BB) enclosing it. The idea is to build a BB enclosing the item
    in the initial video sequence, then the tracking system must estimate its location
    in successive frames.

    +   b) *Appearance modelling*

    +   Learning procedures are used to enhance the target’s visual appearance. Throughout
    this phase, understanding and reconstructing the visual elements associated with
    the moving object, such as varied viewpoints, scale disparities, and illuminations,
    is required.

    +   c) *Motion modelling*

    +   The purpose of estimation of a motion model is to learn how to predict a zone
    where the subject might occur in the successive frames.

    +   d) *Target positioning*

    +   The motion estimates deliver a hypothetical area in which the subject could
    be located, which is then inspected with the visual paradigm to determine the
    real target position.


    Because of the scientific and industrial possibilities, infrared object tracking
    is gaining popularity. Although various remedies to common difficulties have been
    presented, it remains difficult due to features such as sudden deformations, strong
    occlusions, poor illumination etc. Motivated by the active research being carried
    on thermal imaging systems and IR MOT and SOT the major contributions of the work
    are as follows:


    +   1. A comprehensive literature review which covers the recent work on thermal
    object tracking carried out using different deep learning models have been presented.
    The review has been divided in three major groups, including a review of detection-based
    and detection-free thermal tracking techniques, a review of single and multiple
    thermal objects tracking techniques and a review of object fusion based thermal
    tracking techniques.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '2. Details of conventional and upcoming video data sets for IR tracking along
    with the evaluation metrics utilized to determine the detection and tracking efficiency
    corresponding to the model has also been investigated.


    # 6.2 LITERATURE REVIEW


    # 6.2.1 DETECTION-BASED AND DETECTION-FREE THERMAL TRACKING TECHNIQUES


    Two principal approaches., i.e., detection-based, and detection-free tracking
    (Figure 6.3) have been used to carry out thermal object tracking. In detection-based
    tracking using deep learning, a pre-trained detector is fed with an uninterrupted
    video sequence which, in turn, gives tracking trajectories based on detection
    proposition. The technique has been widely used as it detects the new objects
    and automatically terminates the disappearing one. Detection-free tracking involves
    the manual establishment of a predetermined number of objects in the first frame,
    which are then localized in subsequent frames. These trackers often fail in the
    cases where new objects occur in the intermediate frames.


    Thermal IR frames often suffer from unwanted attributes which hinder the discriminatory
    features of the object of interest. Liu et al. (2017) has utilized the discriminative
    representation capability of a convolutional neural network (CNN) to perform thermal
    object tracking. An ensemble tracker based on a correlation filter having multiple
    convolutional layer features have been proposed. In the initial stage, a pre-trained
    CNN which extracts the varied features of a thermal IR object from multiple convolutional
    layers has been used. Further, various weak trackers corresponding to the extracted
    features are constructed with the help of a correlation filter. The weak trackers
    constructed additionally contributes to the object location response maps which
    have been merged to achieve better response results. Finally, an effective strategy
    for scale estimation has been exploited to enhance the tracking efficacy (Rani
    et al., 2023).


    Li et al. (2019) implemented HSSNet, which is a thermal IR tracker based on a
    spatially ordered Siamese CNN. A Siamese CNN, which concatenates features from
    multiple convolutional layers, has been designed to gather the spatial and semantic
    information associated with the object. The network has been trained in an end-to-end
    manner on a visible video detection data set to acquire correlation among the
    matching objects. The pre-trained network is then transferred into a thermal domain
    to estimate the likeness between target object and its equivalent template. Eventually,
    the candidate which highly resembles the object being tracked has been located.


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_108_0.png)


    FIGURE 6.3 (a) Detection-based tracking vs (b) Detection-free tracking.'
