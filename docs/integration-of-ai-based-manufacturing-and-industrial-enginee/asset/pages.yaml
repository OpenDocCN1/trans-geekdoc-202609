    CNN-based trackers, which perform well on RGB frames, often fail in the case of
    thermal frames due to a lack of texture information and a similarity in the heating
    maps of two nearby objects. Thus, to eliminate the problems Zulkifley (2019) proposed
    a two-stream CNN tracker which combined Siamese network and full CNN in manner
    that each network contained a set of identical models to deal with varied changes
    in target appearance. To lessen the computational load, the convolutional layers
    are shared among both CNN streams. By superimposing the normalized scores of the
    two streams, a uniform dense score-map has been created. The comparison summary
    of above discussed single object tracking and multi-object tracking techniques
    for thermal objects has been shown in Table 6.2.


    # 6.2.3 FUSION-BASED THERMAL TRACKING TECHNIQUES


    Wang et al. (2021) studied the problems faced during thermal tracking in adverse
    situations by learning the multimodal features. Based on short-term historical
    data and a correlation filter, an RGBT object tracking method has been proposed.
    A multi-layer CNN is used to extract information from a primary object bounding
    box. The target has been traced individually for RGB as well as thermal modalities.
    Reverse tracking is then performed in both modalities. The discrepancy calculated
    between each pair served as an indicator of tracing efficiency for each modality.
    Considering the temporal continuity of frame sequence and to attain the strong
    fusion of dissimilar source data, the previous information has been fused into
    the trained weights. The experimentation has been carried out on three self-acquired
    RGBT data sets.


    Leykin et al. (2007) presented a pedestrian classifier and a fusion tracker for
    coloured thermal cameras. The tracker creates a multi-modal distribution of temperatures
    and colours as a background model, which is a particle filter. The particle filter
    performs a series of reversible transformations which samples the probability
    space to maximize'
