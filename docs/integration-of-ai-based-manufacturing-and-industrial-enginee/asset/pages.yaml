  md: '# # 13 Deployment of Machine Learning and Deep Learning Algorithms in Industrial
    Engineering


    *Hutashan Vishal Bhagat and Manminder Singh*


    Sant Longowal Institute of Engineering and Technology, Sangrur, India


    # ## 13.1 INTRODUCTION


    Industrial engineering is defined as the engineering branch that considers the
    design, analysis and control of production and service operations within a system.
    The advent of the Internet of Things (IoT) and Artificial Intelligence (AI) in
    industries makes the manufacturing processes more optimal. Today, the deployment
    of numerous Machine Learning (ML) and deep learning (DL) techniques in distinct
    industrial processes help to increase productivity and efficiency, improve quality,
    reduce industrial waste and optimize industrial workflows. AI helps industrial
    engineers to increase overall productivity in the automation of distinct industrial
    processes such as designing, manufacturing, defect detection etc. There are several
    sequential operations in a production line and continuous monitoring of the production
    line is required to make sure the product is of high quality. Manual monitoring
    of the production line is a tedious task for industrial engineers, hence ML models
    are deployed that take into consideration the data sets generated by the distinct
    production-line procedures to enhance quality control, risk evaluation and cost-cutting
    (Kang et al., 2020). DL techniques give the benefit of product designing by taking
    into consideration distinct evaluation metrics (manufacturability, cost-effectiveness,
    quality, etc.) that cannot be achieved using traditional techniques. This chapter
    discusses distinct models based on ML and DL techniques that are utilized in industrial
    engineering in the following sections (Arunachalam et al., 2022).


    # ## 13.2 INDUSTRY 4.0


    The 4th industrial revolution is another name for Industry 4.0, which focused
    primarily on cyber-physical transformation in the manufacturing process (Lemstra
    and de Mesquita, 2023). It includes the optimal way to organize the industrial
    resources, processes and societal patterns to sense, predict and interact with
    the physical environment. The production line is the main concern of industrial
    engineers to increase'
