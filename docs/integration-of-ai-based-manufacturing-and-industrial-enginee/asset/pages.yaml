  md: '# 17 IoT-Based Driver Drowsiness Detection and Alerting System Using Haar Cascade
    and Eye Aspect Ratio Algorithms


    *R. Sathya, D. Sai Surya Harsha, G. Pavan Sundar Reddy, and M. Gopala Krishna*

    SRM Institute of Science and Technology, Chennai, India


    # 17.1 INTRODUCTION


    The Driver Drowsiness Detection and Alerting system refers to in-vehicle systems
    that monitor driver and/or vehicle behavior. These systems keep an eye on the
    driver’s performance and alert or stimulate them if they exhibit signs of impairment.
    It alerts drivers when they start to feel sleepy. There are many approaches employed,
    including eye monitoring, physiological movement, and the lane position of the
    car [1]. These tools, which come as standard in all cars, can only alert a motorist
    that he or she is drowsy. It is the driver’s responsibility to take a break and
    to make sure that the break is long enough to allow them to refocus [2]. The technology
    is unable to evaluate the driver’s break quality. After a pause, though, the system
    will continue to track the driver’s behavior and notify them once again if fatigue
    is found [3]. It is anticipated that the warnings will provide drivers the motivation
    they need to take a rest. Road accidents can happen for a number of reasons, and
    one of those reasons is drowsy driving. When the driver didn’t get enough sleep,
    this generally occurs [4]. The body performs less effectively when it is fatigued.
    Drivers may suffer serious injuries or even die. According to the National Highway
    Traffic Safety Administration’s assessment, in 2013 drowsy driving contributed
    to 800 fatalities, 40,000 injuries, and 70,000 collisions [5].


    # 17.1.1 OBJECTIVE


    The main objective of this model is to detect whether or not the driver is in
    a drowsy state. The target of this system is to help the drivers to no to get
    through any accidents [6].'
