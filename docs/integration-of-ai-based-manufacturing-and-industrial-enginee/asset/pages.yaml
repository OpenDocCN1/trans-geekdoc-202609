  md: '# 15 Landmine Detection and Classification Based on Machine Learning Algorithms


    T. Kalaichelvi and S. Ravi


    Pondicherry University, Puducherry, India


    # 15.1 INTRODUCTION


    Landmine detection is a serious issue in many countries around the world, and
    the condition can become a natural disaster. The landmines used are either anti-personnel
    (AP) or anti-tank (AT) in nature. Anti-personnel landmines are buried beneath
    the ground, while anti-tank landmines are always on the surface (Hussein and Waller,
    2000). Approximately 110 million landmines are buried in over 80 countries worldwide
    (“Facts About Landmines – Minesweepers,” Minesweepers, 2019. https://Landminefree.Org/Facts-about-Landmines/,
    n.d.). The impact of landmines extends to deaths and injuries caused by the explosives.
    Landmines also affect the social and economic growth and environmental status
    of the people in affected areas. Thus, the detection and safe removal of landmines
    is necessary. Safe detection involves a non-touch detection method that uses signals
    from explosive materials. Landmine detectors use a variety of sensors to detect
    them, which include biological, metal detectors (MD), ground-penetrating radar
    (GPR), infrared cameras, chemical, acoustic, optical, and nuclear (Kasban et al.,
    2010). Of all these, MD and GPR are the most common method used for detecting
    landmines.


    Metal detectors operated by humans emit the current and measure the reflected
    signal of explosives from the subsurface field (Rani, Bhambri, and Chauhan, 2021).
    This sends an alarm signal in the presence of metallic objects in the subsurface.
    This means that it generates more false alarms in the presence of metallic clutter
    and also that non-metallic objects are undetected (Takahashi et al., 2011). Automated
    wireless metal detectors (Robo-Pi) detect landmines, reducing the risk of humans
    coming into direct contact with landmines and proving less effective in detecting
    non-metallic mines (Ghareeb et al., 2017). By contrast, GPR communicates radar
    waves from a surface antenna and records the reflected wave through a receiving
    antenna. The electromagnetic wave’s velocity changes as it passes through the
    subsurface because of the physical properties of the materials (Banerjee et al.,
    2022). A GPR generates the data from the subsurface material by measuring velocity
    changes and the time radar signal movement (Conyers, 2018). This work'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'uses GPR and other sensor data to detect buried landmines and explosives under
    the ground surface. This technique is widely used in landmine detection systems
    because of their security and humanitarian benefits. It mainly detects landmines
    in smaller targets (under 10 cm in diameter). It penetrates subsurface depths
    from 15 cm to 30 cm using the L-band range in 12 GHz with Ultra-Wideband (UWB)
    transmission (Giovanneschi et al., 2013). Clutters, such as inhomogeneous soil,
    antenna ringing, and surface roughness, can impede the detection of targets. When
    using GPR to locate landmines, it is critical to distinguish between natural and
    manufactured clutter under the subsurface. The most common materials used to make
    landmines are plastics, which do not react with radar and are difficult to identify
    due to the relatively low dielectric contrast (Sato et al., 2004).


    Landmines are detected, classified, and cleared using a variety of techniques
    (Gupta, Rani, and Pant, 2011). Landmine detectors help to locate the buried landmine’s
    actual position and to understand the technology used in the landmines. Landmine
    detection systems also identify the landmine’s size, shape, burial depth, and
    casing material of explosives. The feature extraction strategy transforms the
    unique GPR data features into the grouping of perceptions to classify landmines
    and other objects. Several image segmentations, clutter reduction, and classification
    strategies, such as manual and automated ones, can rapidly increase the capacity
    for handling images based on features retrieved from the subsurface object through
    sensors. Finally, the classification algorithm separates the landmine and non-mine
    objects.


    This chapter presents the Machine Learning algorithms and their applications with
    examples. It also reviews and analyses the different algorithms used to classify
    landmines and the challenges faced during landmine detection caused by the various
    types of landmines, the detection requirements, and the terrain. Furthermore,
    the chapter discusses the suitability of different classifiers used for landmine
    detection with accuracy, probability detection, and false alarm rates. Finally,
    the chapter proposes the classification architecture used for landmine detection.


    # 15.2 MACHINE LEARNING TYPES WITH ALGORITHMS, APPLICATIONS, AND EXAMPLES


    Machine Learning (ML) enables a system to learn from data, automatically improving
    the performance of experiences and predicated things without being explicitly
    programmed (Mohssen Mohammed and Muhammad Badruddin Khan, n.d.). The learning
    system consists of learning from existing data, building a model, and using new
    data to predict the output. The output’s accuracy depends on the amount of data,
    as the larger the volume of data the easier it proves to create a more accurate
    model. Many use cases are available to understand the importance of ML easily
    and quickly. Figure 15.1 shows the different types of machine-learning algorithms
    (Ayon Dey, 2016).


    The supervised Machine Learning technique allows an algorithm to learn and map
    the input to a separate output. Depending on classification or regression strategy,
    it can predict new unseen data (Abraham, 2013). The classification problem uses
    labeled data in two or more classes and indicates the outcome based on training.
