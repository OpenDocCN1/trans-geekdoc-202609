  md: 'the authors (Xiao et al., 2018). Other classification techniques, such as LR,
    SVM, MLP, and basic RNN, are evaluated and their results are compared. The proposed
    technique, according to the results, achieves a high degree of accuracy in fault
    diagnosis.


    An emulsion explosive is an anti-water industrial explosive that was developed
    at the end of the 1960s. Emulsion explosives have a number of benefits, including
    strong explosion and water resistance performance, accessibility to a variety
    of raw materials, low production costs, and minimal environmental contamination.
    Emulsion explosives have emerged as a prominent focus in in the industry in recent
    years, being widely employed in various applications. Since the emulsifier is
    an important element in the creation of emulsion explosives, it is important to
    track and analyze its operational status. The authors (Wang et al., 2017) proposed
    a data-driven design to create a fault diagnosis system. Through the use of sensors,
    the system gathers data on emulsifiers. The fault diagnostic model of the emulsifier
    is built using the signal acquired after transmission to the PLC module, then
    utilizing the host computer software, in order to achieve the function of fault
    updating, online monitoring, and alarm recording.


    Through a variety of sensors, a significant volume of real-time quality data is
    gathered in the manufacturing process. The majority of process data, however,
    are high-dimensional, nonlinear, and highly correlated, making it challenging
    to model the process profiles and limiting the use of traditional statistical
    process control techniques. The authors (Liu et al., 2019) proposed a real-time
    quality monitoring and diagnosis system based on a deep-belief network (DBN) for
    manufacturing process profiles, which is motivated by its potent capacity to extract
    the key aspects of input data. An experiment based on simulation is utilized to
    prove the effectiveness of the proposed recognition model for the manufacturing
    process, and the performance is assessed using an actual example of the injection
    moulding process. The outcomes demonstrate that the proposed DBN model performs
    better than competing approaches (Kaur and Bhambri, 2020).


    In production line testing, electric motor fault detection plays a crucial role
    and it is often carried out by skilled operators. Numerous techniques for automatically
    finding defects are proposed in the literature in recent years. By utilizing a
    novel detection method based on deep auto-encoders, the authors (Principi et al.,
    2019) proposed an unsupervised approach for diagnosing defects in electric motors.
    In the proposed technique, accelerometers are used to collect vibration signals,
    which are then processed to generate LogMel coefficients as features. The outcomes
    demonstrated that the one-class support vector machine (OCSVM) algorithm is outperformed
    by all auto-encoder-based methods.


    The reduction in the maintenance expenses of the production systems is largely
    achieved through the Fault Detection and Diagnosis (FDD) data of rotating machinery.
    The question of how to increase FDD accuracy is one that is still up for debate.
    The authors (Jalayer et al., 2021) come up with a novel feature-engineering technique
    that integrates the Fast Fourier Transform, Continuous Wavelet Transform and statistical
    characteristics of raw signals in order to fully utilize signals and show all
    the defect features. A unique Convolutional Long Short-Term Memory (CLSTM) to
    comprehend and categorize the multi-channel array inputs is proposed. To assess
    the performance of the multi-domain feature set in various DL architectures, the
    authors conduct a sensitivity analysis on the input channels, where CLSTM demonstrates
    its superiority in comprehending the feature set (Kaur et al., 2020).'
