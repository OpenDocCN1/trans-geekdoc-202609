    Analytics, this study examines and analyzes customer turnover prediction using
    mobile data usage volumes related to environmental quality and user perspectives.


    # 12.1.2 OBJECTIVES


    In reviewing a client''s characteristics, develop a model to predict the extent
    to which they are likely to leave information on demographics, accounts and services.
    In this proposed system goal is to find a data-driven solution that will allow
    us to lower churn rates and, as a result, boost revenue and customer satisfaction.


    +   - To examine and analyze the prediction of customer turnover using mobile
    data usage volumes in connection to QoE and users'' viewpoints.

