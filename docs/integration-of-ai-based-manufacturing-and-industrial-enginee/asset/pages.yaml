  md: 'Flannery, 2009). One of the most pressing issues facing businesses is the acquisition
    and retention of new customers. In order to take advantage of cross-selling opportunities,
    mature businesses try to keep the ones they already have instead of focusing on
    acquiring new ones (Chauhan and Rani, 2021).


    One of the best methods to improve the value of consumers is to keep them for
    longer periods of time. The rise of electronic commerce in the modern era has
    increased the amount of information that is available (Kataria et al., 2022).
    As a result of greater competition brought on by the internet and the empowerment
    of customers who are no longer constrained by a single company''s decision, customer
    attrition rates are anticipated to rise. In response to this threat, businesses
    ought to be equipped with the most efficient and effective methods for analyzing
    customer behavior and predicting future failure. The study, whose findings you
    have access to, uses Machine Learning techniques to develop a precise and reliable
    forecasting models for customer attrition in the pre-paid mobile phone industry
    (Rani, Kataria, and Chauhan, 2022).


    Customers’ acquisition and retention are crucial to the telecom industry’s survival
    and profitability because of the industry’s immense size, vitality, and ubiquity
    (Azeem et al., 2017). The newcomers place an emphasis on acquiring new customers,
    while the established firms place greater emphasis on maintaining existing ones.
    Customers may choose from a variety of products and services thanks to globalization,
    which helps them to choose the best services on offer. Customer retention and
    satisfaction are specifically correlated. Operators place a high importance on
    a range of customer-related approaches and analytics to ensure customer retention
    because the cost of gaining new customers is substantially higher than the cost
    of sustaining existing ones. The prediction method that should be used to identify
    churn is not clearly agreed upon by all researchers. Since around a decade ago,
    substantial churn prediction research has made extensive use of statistical and
    data mining techniques.


    Data analytics and Machine Learning have each been proven to be efficient ways
    for anticipating churn. Numerous prior studies addressed the churn prediction
    based on call detail information, which was the basis for several Machine Learning
    algorithms. In order to identify churn, the work concentrated on recording service
    failures and disconnections. The goal of the study is to assign a “Churn Score”
    to a variety of customer transaction logs in order to identify early warning signs
    of churn. To date, customer churn has largely been studied in relation to network
    parameters. It is difficult to find any comprehensive analysis that addresses
    the issue of consumer dissatisfaction from the perspective of their level of engagement.
    The important and most widely used data mining method decision trees is the primary
    focus of this thesis on identifying churn. An excellent categorizer that uses
    a method similar to a flowchart to classify instances is the decision tree. Telecom
    operators frequently needed to analyze the steps in the process of predicting
    customer churn so as to determine the likely cause and justification for churn.
    Due to their simplicity in interpretation, visualization and analysis, decision
    trees can be the only option to reach this goal.


    # 12.1.1 STATEMENT OF THE PROBLEM


    The majority of businesses in the low-cost switching industries focus on customer
    turnover. At an estimated annual turnover rate of 30%, the telecommunications
    industry'
