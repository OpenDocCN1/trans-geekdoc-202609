    To transmit the relative order of the desired goals, the weighted fuzzy goal programming
    process is widely employed in goal programming and multi-objective optimization
    methods. This method imitates the relative value of the aspects by allocating
    differential based on the coefficients of each term in the fuzzy achievement function
    (Kaur et al., 2019).


    # 4.3.5 Pre-Emptive Fuzzy Goal Programming


    Goals in some actual situations will not have the same demonstrable units, but
    they may still be proportionate. Additionally, extra goals shouldn''t be evaluated
    when a subset of them is reached. Weighting fuzzy goal programming is not a good
    technique in these circumstances. The pre-emptive priority method could be expressed
    as $r_l \ge r_{l+1}$, which signifies that the desired goals in the $l^{th}$ priority
    level has greater priority than the goals in the $(l+1)^{th}$ priority level,
    i.e., no matter how large $N$ (a number), $r_l$ cannot be equal to $N r_{l+1}$
    (Ignizio, 1976; Sherali & Soyster, 1983). Using this strategy, the problem may
    be divided into $l$ sub-problems, wherein $l$ is the number of priority levels.
    The primary priority levels of the fuzzy goals are the only ones that have been
    witnessed in the preliminary sub-problem. The membership data initially gathered
    at higher priority levels have been adjusted to add extra limits for other priority
    levels (Chhabra and Bhambri, 2021).'
