    that the driver is sleepy and drowsy. The count begins when the driver’s closed
    eye is discovered. A buzzer linked to the Arduino’s USB ports emits a buzzing
    sound to alert the driver if the count exceeds the limit. If the driver does not
    awaken from sleep following the buzzer, the driver’s image is taken and sent,
    from which the image processing is carried out. Normal images are converted into
    digital ones in a method known as Image Processing. In order to find out whether
    or not the driver is in a state of drowsiness, useful information is obtained
    by applying some operations on the digital images. Drowsiness is detected by the
    captured driver’s image. The image, as well as the location of the driver, are
    sent by the Wi-Fi module. The vibration sensor measures the force that is being
    imparted on the vehicle in the case of accident. The motor of the car, which is
    running continuously, will be stopped, if the drowsiness or alcohol is sensed
    or in the event of an accident.


    # 17.8 RESULT AND DISCUSSION


    In this work, the driver’s drowsiness is detected using the Eye Aspect Ratio Algorithm,
    which is implemented at the backend. If the eye aspect ratio value drops, then
    the system alerts the drivers so that they can get to their normal driving state.
    Other features, such as location, the detection that alcohol has been consumed,
    and the detection of accidents by considering the amount of force that has impacted
    on the vehicle, are implemented to make sure that every measure is taken for the
    safety of the driver.'
