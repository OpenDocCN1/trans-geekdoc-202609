  md: '# 13.6 CONCLUSION


    Industry 4.0 tries to implement cyber-physical transformation in the manufacturing
    and production processes of various industries. The conceptual model of the production
    line in a manufacturing industry is briefly explained and the distinct problems
    concerned with the production line are discussed in this chapter. Depending upon
    the end-product produced by a manufacturing unit, the distinct categories of production
    lines are also explained. The four major characteristics of a production line
    within a manufacturing unit to have maximum throughput are explained in this chapter.


    ML and DL techniques have a wide range of applications in manufacturing industries
    which help industrial engineers to have optimal workflow within the manufacturing
    unit. The AMPSO-SVR machine learning model is considered to be the most accurate
    model for forecasting strip-crowns during the hot strip-rolling process. In addition,
    the SVR model along with ANNs is used to determine the various properties of carbon
    fibre. In the production of cement, the ESVM model of ML is utilized to predict
    free lime content in the cement. In the area of e-commerce, centralized task management
    based on Machine Learning is utilized to deploy autonomous robots in the warehouse.
    In automobile industries, a data-driven approach based on DBN is utilized for
    the process of chemical mechanical polishing.


    In addition to all these applications, there are still some challenging areas
    discussed in this chapter for Industry 4.0 that can be considered by industrial
    engineers as future projects.


