    # 2.1 THE INTRODUCTION OF INDUSTRIAL ENGINEERING WITH IoT AND AI


    The use of Artificial Intelligence (AI) innovations will considerably improve
    the manufacturing industry’s capabilities since they operate across a range of
    business functions and levels, from staffing to product design, to the increasing
    of efficiency, and improvements in both product quality and worker welfare. In
    the case of industrial engineering, developments in AI are essential because they
    enable robots to handle more cognitive tasks and make conscious choices based
    on environmental input in real time (Bhambri et al., 2023).


    The use of IoT and AI involves controlling various factors, including content
    genres, production techniques, financial constraints, and time restraints. Machine
    Learning (ML) can be used to manage and assess the concepts and other crucial
    duties, giving more insight into the most recent designs. In order to forecast
    equipment failure in industrial engineering, AI is employed in factories to provide
    the anticipatory monitoring of critical industrial machinery (Bakshi and Bhambri,
    2021).


    The use of cutting-edge communication and manufacturing systems in industries
    is referred to as Industry 4.0. This is the phrase currently employed in the industry
    when discussing the digital revolution. This is a general term that encompasses
    AI, cyberspace, the IoT, storage, ML, and more. These can all be integrated into
    industrial production processes (Bhambri et al., 2020).


    The use of such systems can permit the rapid analysis of information during the
    course of the manufacturing process. Through this assessment, new processes are'
