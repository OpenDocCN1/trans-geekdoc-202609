    (15.2), and a Relevance Vector Machine (RVM) classifier was calculated in sparse
    mapped space using Equation (15.3), where the probability of alarm is p_ik and
    sparse Bayesian weight is W_k. The Edge histogram Descriptor (EHD) retrieved the
    edge features in cross- and down-track dimensions (Andrew Karem, 2011).


