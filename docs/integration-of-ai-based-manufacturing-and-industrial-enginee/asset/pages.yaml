  md: '# 7.6  PITFALLS IN IoT EDGES


    Most pitfalls occurred due to the high volume of transmissions through the devices
    which are not updated according to emerging technology and some are challenging
    due to manufacturer policies that make devices without any policy at low costs.
    Challenges of this kind included:


    +   - Not every manufacturer follows security policy.

    +   - Software updates are not installed on time.

    +   - The proliferation of the market makes it impossible to patch up all devices,
    with older ones being particularly vulnerable.

    +   - Very few IoT security standards are tailored for IoT devices.


    The newly supported IoT-edged UAVs have encountered several obstacles. One significant
    challenge is the limited availability of Internet connectivity at the edges, resulting
    in a lack of updates for these UAVs. Additionally, the deployment of these UAVs
    has been hindered by civic activities, particularly in terms of adequate planning.
    These limitations have led to security vulnerabilities (Granjal and Silva, 2020).
    Since it is not supervised in any manner so the edge devices as UAV hardware can
    be easily susceptible to attacks (Ali et al., 2018).


    There are numerous ways in which the above challenges can be tackled. One is to
    adapt the standard security protocol at edges; traffic monitoring can also be
    enforced. In the following sections, we will discuss some of the case studies
    for security approaches.


    *AAIoT: Standards-Based IoT Security.* At present, there are no such endorsements
    for the confidential in IoT applications. Recently, an internet engineering task
    force (IETF) designed a protocol, which thus termed Authentication and Authorization
    for Constrained Environments (ACE), but it is also unable to deal with tactical
    scenarios (Bhambri et al., 2022). For such compatibility an “Authentication and
    Authorization for IoT Devices (AAIoT)” moderated, which bridges the two gaps of
    the old ACE protocol: (1) bootstrapping client and device credentials; and (2)
    authentication revocation for compromised devices.


    *Bootstrapping of Credentials* (Lehong, 2019). Due to the heterogeneity of IoT
    devices credentials will be exchanged between the devices which is again a risk
    of impersonation by any device as a human attacker can impersonate the device
    in the network adhere to exchange the credentials. In order to enhance the security
    of a nine-coded QR code created by each device for credit exchange, it is advisable
    to employ a pairing mechanism with a pre-shared key (PSK) as described within
    the QR code. This approach ensures a higher level of security (Roman et al. 2018b).


    *Agreement Revocation.* Another concept of the ACE protocol is agreement revocation,
    which allows devices to be paired in the same way as in bootstrapping through
    a one-time authentication procedure (Bhambri et al., 2023). However, if the IoT
    enables UAV, it does not receive any calls for a long time and eventually disconnects,
    posing a new problem in identifying the edge device in the network (Yuchang et
    al., 2021). When a device is not monitored and becomes compromised, and the edges
    are then activated on demand by extending the timer, it is critical to prevent
    all other'
