- pgno: 165
  md: '# 9.5 PROPOSED ALGORITHM


    The algorithm to enrich the visibility of satellite captured snaps is as follows:


    +   - **Input:** Query Image I.

    +   - **Output:** Enhanced Image Eᵢ.

    +   - **Step 1:** Input all n images Iₙ to compressor C. Where n = 1, 2, 3........
    and I is an Image.

    +   - **Step 2:** Compress all Images Iₙ to Cₙ. Where Cₙ is the Compressed Image
    and n = 1, 2, 3.... Using equation (1) and calculate the percentage of compression
    using equation (2) in Preliminary Phase.

    +   - **Step 3:** Pre-process the image for noise removal and apply filter for
    the assessment of clarity and visibility. Images are then converted to Grayscale
    or Black & White.

    +   - **Step 4:** Impose n-Sigma Control limit on images and categorize the images
    into Zone-A (Red), Zone-B (Yellow) and Zone-C (Green) respectively.

    +   - **Step 5:** Superimpose Scaled Version Sₙ on Cₙ of the images of Zone-B
    and Zone-C respectively leads to the Enhanced Version of the Image Eᵢ as final
    outcome.


    # 9.6 RESULTS AND DISCUSSIONS


    The proposed intelligent system takes satellite captured images as input. These
    images are then trained using AI learning mechanisms to realise the structures,
    objects and geographical orientations. The features are extracted and processed
    and morphological operations are carried out on those features. During processing,
    as an intermediate phase, the scaled version of the image is produced (Chauhan
    and Rani, 2021). Then, this scaled version will be added to the original compressed
    image, which results in the production of an enhanced version of the image as
    the simulated model of final outcome as shown in Figure 9.8.


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_165_0.png)


    FIGURE 9.8 Simulation model.'
