  md: 'This is then sent to the cloud, which will reduce the computational overheads
    as well as meaning that the data are transmitted without delays. In this way,
    it enhances the quality of service by a number of UAVs connected to various locations....


    Sangwan et al. (2021) declares that the cloud computing is not yet up to the mark
    with regard to coping with the new technology of IoT, which has connected the
    complete world over the internet with real-time applications such as gadgets,
    smart devices, UAVs etc. Accordingly, it proposed a virtualization concept which
    will separately decouple the hardware with different paradigms and can run many
    virtual components on the same hardware. This will integrate several virtualization
    techniques, and develop new edge-based architecture.


    In another contribution, Bhambri et al. (2021) proposes a situation where the
    action-dependent heuristic and critical Q-learning is fabricated. This uses the
    reinforcement learning classifier, which includes policy iteration (PI) and value
    iteration (VI) to sustain the performance of the edges. This methodology is suitable
    for benchmarking the performance edge (Sangwan et al., 2021). The IoT survives
    just about anywhere in the world. And this sustain the largest growth in terms
    of sensorized data where the IoT traffic loads this data to the clouds via last
    edge points (Bhambri et al., 2021). But this process produces the latency in data
