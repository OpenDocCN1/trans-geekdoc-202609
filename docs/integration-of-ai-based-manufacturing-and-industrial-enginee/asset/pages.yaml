    # 7.5 SECURITY CHALLENGES TO UAV EDGES


    To combat the attacks it is necessary to first identify the attack surfaces; one
    way for detection to occur is the threat modeling, in which the solution team
    tries to find the vectors in the designing (Fan et al., 2013). When the threat
    detection process is implemented, it can be attenuated by a security model. With
    the IoT baseline architecture, there are four typical threat areas: (1) devices,
    (2) field gateways, (3) cloud gateways, and (4) services. Each zone required a
    different scenario to protect as such; the device zone needs to be safe from physical
    tampering.


    While UAV-based edges in comparison to the typical cloud-based era, UAVs devour
    physical access. Given that the IoT-UAV is not deployed at the centers, these
    locations present an open vulnerability for data centers, as the vehicle can be
    readily compromised, leading to potential negative impact on the data. Furthermore,
    a loophole has been observed as a result of the present use of commodity technology
    in these instances. Since everyone concentrated mainly on the strategies implemented
    by the invaders. But this is limited to skills. To properly get the exploited
    vehicle one must find the nefarious attackers who spoof malicious code and inject
    their own data into edge devices. By means of the implanted code, the process
    of retrieving the identity from the aircraft is facilitated.


    Another approach of compromising the devices at the software level where the invader
    tamper the edge by signing the code against the trusted which will authenticate
    them by siphoning off the attack. Henceforth, the traffic path should be encrypted
    and secured. One final case involves the plain data residing on the edges which
    is to be encrypted. Because it is not safe to totally depend on the hardware for
    security. The world of interconnected IoT is particularly complex in nature and
    intruders try to gain the advantage of the adversary, which might have catastrophic
    consequences. Some such attacks include the Mirai botnet exploit the IoT devices;
