  md: '# 18.5 STABILITY ANALYSIS


    $$\dot{\hat{\Omega}} = -\Gamma_{\Omega}\Psi(\bar{z})r^{T}\tag{18.34}$$


    $$\dot{\hat{\Phi}} = \Gamma_{\Phi}N\|r\|\tag{18.35}$$


    where $\Gamma_{\Omega} \in R^{c_1 \times c_2}$ and $\Gamma_{\Phi} \in R^{l_1 \times
    l_2}$ are the positive definite matrices.


    $$H = \frac{1}{2}r^{T}\bar{M}r + \frac{1}{2}tr\left(\tilde{\Omega}^{T}\Gamma_{\Omega}^{-1}\tilde{\Omega}\right)
    + \frac{1}{2}tr\left(\tilde{\Phi}^{T}\Gamma_{\Phi}^{-1}\tilde{\Phi}\right) + \frac{\delta}{\gamma}$$


    The differentiation of Lyapunov function with respect to time gives


    $$\dot{H} = r^{T}\bar{M}\dot{r} + \frac{1}{2}r^{T}\dot{\bar{M}}r + tr\left(\tilde{\Omega}^{T}\Gamma_{\Omega}^{-1}\dot{\tilde{\Omega}}\right)
    + tr\left(\tilde{W}_{1}^{T}\Gamma_{W_{1}}^{-1}\dot{\tilde{W}}_{1}\right) + tr\left(\tilde{\Phi}^{T}\Gamma_{\Phi}^{-1}\dot{\tilde{\Phi}}\right)
    + \frac{\dot{\delta}}{\gamma}$$


    By making use of adaptive laws, Properties 1–2, and adaptive bound part, finally,
    we get:


    $$\ddot{H} \le -2r^{T}\rho_{r}r\tag{18.36}$$


    From Equation (18.36), we have $\dot{H} \le 0$. With the time $t$, $\dot{H}$ goes
    to zero by Barbalat’s Lemma and this implies that and states of the system is
    bounded as well as all error terms also goes to zero as $t \to \infty$. Overall,
    the dynamic system is asymptotically stable.


