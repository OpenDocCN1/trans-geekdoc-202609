  md: '# 3 Applications of Artificial Intelligence and Internet of Things IoT in Marketing


    H. Lakshmi, M. Dharmananda, and B. S. Harisha

    Nitte Meenakshi Institute of Technology, Bangalore, India


    # 3.1 INTRODUCTION


    # 3.1.1 ARTIFICIAL INTELLIGENCE


    A technology that attempts to imitate human intelligence is referred to as Artificial
    Intelligence (AI), which has the potential to recognize voice, picture recognition,
    machine learning, and semantic search. The industry-wide adoption of AI has helped
    companies better position their offerings, gather consumer data, and develop new
    futuristic products (Jain et al., 2021). Marketers are keen to deploy this technology
    to modify the marketing mix and improve customer satisfaction and to gain a competitive
    edge in the industry AI can be classified into three types, namely AI applications,
    the Machine Learning approach, and applied propensity models (Singh et al., 2021a).
    AI applications are other varieties of AI that perform tasks that often requires
    human intervention, such as responding to consumer inquiries or creating new content
    (Adobe Sensei Team, 2019). Propensity models can be produced using Machine Learning
    approaches, which use algorithms to “learn” from past data sets. When these propensity
    models are used to forecast specific occurrences, such as ranking leads according
    to how likely they are to convert, this is known as applied propensity models
    (Kaur et al., 2020).


    From a marketing perspective, each application of AI plays a unique role in the
    consumer track record, but they can all be significantly useful for marketers
    (Adobe, 2019). Some techniques have more appeal for customers, while others can
    help with conversion or re-engaging previous clients (Kaur and Bhambri, 2019).
    These techniques are grouped into the Reach, Act, Convert, Engage (RACE) framework.
    (Reach, Act, Convert, Engage)


    # 3.1.2 RACE FRAMEWORK


    +   1. Reach - Use various marketing strategies to engage customers


    Search engine optimization, content marketing appeal to website users and they
    initiate purchase process. At this point, AI and applied propen-'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'sity models can be utilized to increase the number of visitors, providing them
    with value content and making their user experience more enjoyable (Agrawal, 2020).


    # i. AI-generated content


    Certain operations require AI content writing tools that may choose components
    from a data set and organize them into a content which resonate with human writing.
    For example, Wordsmith is a self-service platform that offers real-time content
    updates, comprehensive narrative customization, and a robust API for flexible
    publishing (Dooley, 2020).


    AI writers are highly helpful for reporting on recurring, data-centric occurrences,
    namely sports events, market statistics, quarterly reports etc. AI-generated content
    could be beneficial for content marketing plan for vital and dynamic industries,
    such as financial services. A free beta edition of its AI writing tool is introduced
    by software like Wordsmith’s creator, automated insights, allowing users to test
    the technology and determine what might benefit their business (Rachna et al.,
    2022).


    # ii. Programmatic Media Buying


    For media buying, programmatic advertising use automated technologies and algorithmic
    techniques (Maruti Tech, 2019). The process for buying and selling adverts in
    the advertising market is referred to as programmatic media buying. Programmatic
    advertising uses automation and differs more from traditional media buying process.
    User behavior is analyzed thoroughly to ensure the correct promotional strategies
    are adopted for target users at the appropriate time (Sangwan et al., 2021).


    # iii. Voice-based search


    According to Statista 2023, by 2027, the market size for Alexa is expected to
    reach a total value of $34.4 billion, with a record compound annual growth rate
    (CAGR) of 22.2%. Voice assistant shipments will total 8 billion units by 2023.
    Research also suggests that 28% of online users use voice-based searches on their
    smartphones globally. The rise in smartphone usage and the presence of IoT devices
    have led to an increase in the popularity of voice searches rather than typing.


    # iv. Smart Content Curation


    AI-enabled content creation provides better user engagement by displaying relevant
    content based on user choice, preference, and browsing history (Sinha et al.,
    2020). This method can also be used to more broadly personalize website messaging
    and is most frequently seen in ecommerce sites offering recommendation to the
    users such as “customers also bought this”. This strategy works well for a subscription-based
    business model because the better content recommendations get the more users to
    utilize the service and provide more data for the machine learning algorithm to
    work with (Bhambri and Chhabra, 2022). For example, Amazon’s recommendation system
    helps users to make better-informed choices. Many businesses, such as Amazon,
    Netflix, and Spotify, have benefited greatly from the deductions and linkages
    made by AI’s data pairing system with the help of its AI-based clus-'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'tering system. The Over-the-Top (OTT) service provider Sky has also incorporated
    AI into its system, allowing material to be delivered to customers according to
    their current preferences.


    # 3.2 ACT – USE TECHNIQUES THAT APPEALS TO USERS AND PROVIDE THEM PRODUCT AWARENESS


    i. Propensity modelling

    The “propensity model” describes a variety of statistical models created to forecast
    outcomes that can either occur or not. It is a statistical method for estimating
    the probability that an event will occur (Rani et al., 2021). The Machine Learning
    algorithm is given historical data from previous years, and it makes use of this
    data to create a propensity model that can generate accurate predictions about
    the market. The stages of this procedure are shown in Figure 3.1. Propensity modelling
    is a potent tool, which can be used to enhance marketing efforts, more precisely
    target customers, improve business decisions, and even forecast client attrition
    (Bughin et al., 2019).


    ii. Predictive analytics

    Propensity modelling can be used in a variety of situations, such as determining
    which users are most likely to convert, at what price they will probably convert
    for, or if they’re likely to buy the same product. Because it employs analytics
    data to forecast client behaviour, this application is known as predictive analytics
    (IBM, 2019). The propensity model works best when the data is error-free; otherwise,
    it may be unable to generate reliable forecasts (Sweeny, 2020).


    iii. Targeting Advertisements

    A huge volume of historical data can be analysed by the use of Machine Learning
    algorithms to determine which advertising works best for which audiences and at
    what points in the purchase cycle. By using this information, they can provide
    them with the best content at the ideal time (Enterprise Content Team, 2019).
    More effective ad placement and advertisement content can be produced by marketers
    by utilizing machine learning to continuously optimize thousands of variables
    (Vecteezy.com).


    iv. Lead scores

    Propensity models created by Machine Learning can be customized on specific criteria
    such as whether it is worth investing time and effort on a lead. It is crucial
    in business-to-business (B2B) companies with consultative sales procedures where
    the sales team must dedicate a substantial amount of time on each sale (Zambito,
    2014). The sales team can save time and focus their work where it will be most
    beneficial by reaching out to the most pertinent leads. The knowledge of a lead’s
    propensity to purchase can also be used to focus special offers and discounts
    in the right places (Rani et al., 2023).'
