    # 5.1.5 Impact of Analytics on the Changing Role of HR


    In the past, HR analytics were used to keep track of activities and HR performance.
    By connecting these activities to company goals, the emphasis now is on improving
    the effectiveness of HR initiatives.


    | THEN | NOW |

    |---|---|

    | Functioning | Planned |

    | Policies | Partnering |

    | Administrative | Consultative |

    | Function-oriented | Business-oriented |

    | Reactive | Proactive |

    | Activity-focused | Solution-focused |


    # 5.2 Analytics in Industrial Processes


    The practise of gathering and analysing data related to human resources (HR) with
    the goal of enhancing organizational productivity is known as HR analytics. HR
    analytics assists HR managers in taking the appropriate steps to address problems
    within the firm. HR analysis can also be described as talent analytics, people
    analytics, and workforce analytics (Rani et al., 2023a).


    # 5.2.1 Steps Involved in Analytics


    +   1. The initial stage of the analytics process involves the systematic gathering
    of workforce information and the subsequent consolidation of this data into a
    centralized depository.

    +   2. The second step is to create a dashboard to visualize the data to monitor
    various insights of HR metrics.

    +   3. Build Analytical capabilities in the Analytical team through training in
    case of an absence of knowledge of Analytics.

    +   4. Practicing HR Analytics for the data collected to get the final results
    and conclusion.

    +   5. Take necessary actions to resolve issues that are determined in analytics
    for continuous improvement in organizational performance.


    Analytics can also be used to improve industrial operations in a variety of ways,
    including:


    +   1. Predictive maintenance: Organizations can forecast when maintenance is
    required by evaluating sensor data from industrial equipment, which can help to
    reduce downtime and increase equipment reliability (Kaur et al., 2019).'
