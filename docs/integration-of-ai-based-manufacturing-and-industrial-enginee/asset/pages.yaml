- pgno: 244
  md: '# TABLE 15.1

    A Comparative Analysis of Landmine Detection Methods and Classification Techniques
    Using Machine Learning Algorithms


    | Author | Image | Methods | Classifier | Merits | Demerits | Metrics |

    |--------|-------|---------|------------|--------|----------|---------|

    | Frigui and Gader (2009) | GPR | LMS, EHD | KNN | EHD used fuzzy techniques to
    distinguish accurate detections from false alarms | Factors appear to be influenced
    by geography and the environment | Pd - 90% |

    | Jin and Zhou (2010) | UWB SAR | SFFS | FHSSVM | Showed improvement in the performance
    of identifying anti-tank mines | Impossible to achieve a low FAR | Pd - 0.7 |

    | Andrew Karem (2011) | GPR | MIL, EHD, SumMembership | RVM | MIL approach performed
    well in multi-sensor fusion at different resolutions | More suitable only in significant
    intra-class variations | Pd - 90%, FAR - 0.008 |

    | Missaoui et al. (2011) | GPR | BW, MCE | MSDHMM | Stream relevance weights used
    for the various components of each state | Streams must include different feature
    extraction methods and sensors | Probability-based -75% |

    | Oualid Missaoui et al. (2013) | GPR | BW, MCE | MSCHMM | MSCHMM improved the
    discriminative power and the classification accuracy | Sequential training could
    replace batch-mode training | Pd >= 0.5 |

    | Anis Hamdi (2015) | GPR | Decision Level Fusion | eHMM | Identified the coherent
    HMM mixture model to define the multiple properties of the data | eHMM used only
    single-layer ANN | Pd - 94%, FAR - 10% |

    | Manandhar et al. (2015) | GPR | MIL, Variational Bayes | MiHMM | Tractable and
    computationally efficient using variational Bayes | Improved parameter estimation
    requires Markov Chain Monte Carlo inference | Pd - 0.7 FAR-0.5 |

    | Camilo et al. (2016) | GPR | BOV feature learning | Linear SVM | FV showed improved
    performance with BOV in multiple object classification | Filters learned from
    the BOV only in HH polarization | Pd - 0.6 FAR - 0.02 |

    | Yuksel and Gader, 2016 | MD, EMI | ME | MHMME | MHMME showed better performance
    than ME and HMM | Classification becomes a problem in the absence of contextual
    data | Mean - 0.73 SD - 0.02 |'
