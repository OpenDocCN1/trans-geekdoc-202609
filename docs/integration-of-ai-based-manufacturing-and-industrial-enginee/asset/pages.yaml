- pgno: 113
  md: 'the posterior probability corresponding to the scene. A pedestrian classifier
    centred on periodic gait analysis after acquiring the position and measurements
    of moving objects is used. To distinguish people from other objects in motion
    such as cars, a symmetrical double helical structure in human gait has been used,
    which can subsequently be examined using the Frieze Group theory. The tracking
    results demonstrated the robustness of the framework to illumination noise and
    other atmospheric disturbances.


    The thermal frame is often less susceptible to noisy effects; however its degree
    of distinguishability varies depending on the environmental changes. The solution
    to this has been obtained by the cognitive fusion of two different modalities.
    Yan et al. (2018) presented an effective approach to rationally track as well
    as detect saliency targets inside thermal videos. Foreground recognition in visual
    and thermal frames began with the extraction of a contextual information, proceeded
    by dual-phase background removal. While dealing with obstruction or overlaps,
    deductive frontward and inverse tracking have been used to distinguish discrete
    objects when the foreground identification failed. A publicly accessible colour-thermal
    standard database for target tracking and categorization in and beyond the perceptible
    band has been used to assess the suggested approach. T. Yu et al. (2019) proposed
    a vigorous tracker (RCCF-TIR), which is built using adaptive feature fusion and
    continuous correlation filters. An Efficient Convolution Operators framework was
    used initially to construct the new track. Further, the framework is equipped
    with an optimal set of features for TIR tracking. Finally, a novel feature fusion
    technique that utilized the average value of peak-to-correlation energy has been
    used. Experimental results on PTB-TIR and VOT-TIR 2016 indicated the tracking
    robustness and the accuracy of the proposed tracker.


    # 6.2.4 BENCHMARK THERMAL DATA SETS


    Experimental data is mandatory for the development and testing of any computational
    technique. The performance of any method can only be evaluated in reference to
    current knowledge. Benchmark data sets with known and verified outcomes are required
    for this purpose. In recent years, many benchmark data sets have been developed
    for thermal object tracking, which are discussed below.


    +   (i) BIRDSAI:

    +   BIRDSAI, which stands for benchmarking IR dataset for surveillance with aerial
    intelligence, consists of thermal IR video sequence containing animals and humans
