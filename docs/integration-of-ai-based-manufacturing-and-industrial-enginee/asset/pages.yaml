  md: '![](img/3d190e19625a7567e7b93c8e95b18d9c_212_0.png)


    # FIGURE 13.1 Conceptual model of production line.


    workstations have high throughput, but they have complex machinery set-ups (Ling,
    et al., 2022).


    +   - **Buffers:** A buffer in industrial engineering is defined as a pipeline
    or conveyor belt that assists in the easy transportation of products/goods from
    one working station to another. Furthermore, a buffer also provides storage to
    synchronize the cycle time variations among the distinct working stations of an
    industry. The key advantage of the buffer is that the downstream working station
    does not stop, even if there is a failure in the upstream working stations (Chang
    et al., 2019).


    +   - **Process type:** The processes within a production line can be either discrete
    or continuous. The discrete production line has processes of varied cycle times.
    Depending upon the availability of storage in the downstream buffer, a machine
    needs to stop when the downstream buffer is fully occupied and restarts working
    when the downstream buffer is emptied (Alsawafy and Selim, 2022). This concept
    is known as Booking After Services (BAS). In a continuous production line, the
    congestion between the upstream and downstream buffer is removed by adjusting
    the cycle time of the working machines and, hence, there exists a non-stop production
    flow in a continuous production line (Jelsch et al., 2022).


    Figure 13.1 shows the model that conceptualizes the working of the production
    line with multi-server with buffer and single-server without buffer workstations.
    In this section, the key components, characteristics, workflow and conceptual
