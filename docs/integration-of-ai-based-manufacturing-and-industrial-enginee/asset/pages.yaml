- pgno: 68
  md: 'will choose one criterion scale (e.g., minimize unwanted goal deviations).
    A problem with several objectives is called a multi-objective optimization problem.
    However, we observe that such objectives would be competing, implying that they
    can’t achieve their optimal values at the same time, and, if they do, that the
    problem would be resolved as a single-objective problem. The space defined by
    the values of a set of objectives is known as objective space.


    **Achievement function:** The achievement function is the one in which we must
    reduce the unwanted deviations from our desired outcomes in the model.


    **Goal:** A goal is a desired target level set by the decision-maker(s) to accomplish
    under specific conditions.


    There are three possible types of goals:


    +   - **A lower, unilateral goal:** This goal establishes a lower limit, below
    which one does not want to fall (but exceeding the limit is acceptable). As an
    example, aim to manufacture at least 20 products.

    +   - **A higher, unilateral goal:** This goal establishes an upper limit, which
    one does not wish to exceed (but it is acceptable to go below the limit). As an
    example, maintain costs within the 1 lakh Rs (Indian) budget.

    +   - **A two-sided goal:** This goal sets specific targets that we do not want
    to miss on either side. As an example, aim to engage exactly 20 employees.


    **Deviational variable:** A deviational variable is a variable that calculates
    the overall difference between the desired goal and the value attained in a given
    solution.


    **Positive deviational variable:** If the attained value exceeds the desired target
    level, then the difference is determined by the value of the positive deviational
    variable.


    **Negative deviational variable:** If the attained value is less than the desired
    target level then the difference is determined by the value of the negative deviational
    variable.


    **Constraint:** The constraint is a limitation imposed on the decision variables
    that should be satisfied to attain a practical solution. A generic decision variables
    function involving equality or inequality can be used as a constraint.


    **Sign restriction:** A sign constraint restricts a single decision or deviation
    variable from falling inside a specific value range. The most common sign constraint
    is that the variable is quasi and continuous.


    **Feasible region:** The feasible region is generated by a set of solutions in
    goal programming which fulfils all those constraints and sign limitations in decision
    space, and this type of solution is required to be implementable in practice.


    **Ideal point:** In the objective space the ideal point represents that point
    where each goal in a multi-objective optimization problem is optimized individually
    within the feasible area and achieves its optimal value. When the goals are incompatible,
    this ideal point will just be beyond the feasible area in the objective space,
    and it will be referred to as an infeasible point.


    **Fuzzy theory:** Zadeh (1965) proposed a fuzzy set theory to deal directly with
    the vagueness, uncertainty, and ambiguity of human behaviour and judgements. Fuzzy
    set theory is a method of data refinement that uses mathematical formulae or operations
    to overcome particular uncertainties connected with human reasoning and thinking.'
