- pgno: 109
  md: 'Asha & Narasimhadhan (2017) presented an IR object tracking technique which
    combines both generative and discriminative mechanisms. The discriminative approach
    utilizes AdaBoost classifier and a Kernelized Correlation Filter (KCF) to obtain
    the optimized locations. Of all the optimized locations, the best object location
    has been found using linear search technique and scale estimation has been performed
    using a Lucas-Kanadehomography approximation. Liu et al. (2021) achieved robust
    thermal object tracking using a multilayer Siamese network. Various pattern similarities
    have been computed to understand global semantics and local structural similarity
    associated with the object. The similarities act in a complementary fashion to
    one another, thereby enhancing the discriminative ability of the network to handle
    distractors (Singh et al., 2019). To integrate the structural and semantic similarities,
    an effective ensemble network based on relative entropy has been designed. The
    network, while training, adaptively learns the structural likeness and semantic
    weights (Kumar et al., 2022).


    El Ahmar et al. (2022) introduced a new data set to perform multi-object tracking
    (MOT). Object tracking based on detection has been performed using transfer learning.
    The weights trained on ImageNet datasets have been transferred to the thermal
    object dataset and the efficacy of the process has been studied. To perform MOT
    post-detection, the ByTrack technique has been utilized, in which similarity in
    motion is used for feature association. Leira et al. (2021) studied a detection
    and tracking system for unmanned aerial vehicles (UAVs) which could be used in
    maritime tracking frameworks. The framework supported real-time object tracking
    supported by situational responsiveness on the surface of the sea. The onboard
    computer could georeference each target detection in order to estimate the position
    of the detected entities in a local north-east coordinate frame by using Machine
    Learning (Ritu and Bhambri, 2023). A tracking algorithm employed a Kalman filter
    and a uniform velocity motion model to track and estimate the position and velocity
    of the object based on position measurements obtained automatically by the object
    detection algorithm. In addition, a global nearest-neighbor method has been used
    to perform data association.


    Krišto et al. (2020) investigated automatic tracking inside thermal frames using
    CNN models originally trained for RGB sequence. Faster R-CNN, Cascaded R-CNN,
    SSD and YOLOv3 are chosen to train for the person class belonging to a thermal
    data set without any actual changes in the original model. Based upon the experimentations,
    YOLOv3 served the base model and captured enough shape features for accurate IR
    object detection and tracking. X. Yu et al. (2017) presented a detection-based
    tracking framework which exploited online structural learning. The training of
    the classifier has been performed using Fourier techniques and an optimized tracking
    mechanism boosted the overall speed of the tracker. An effective representation
    of feature has been accomplished by combining motion features and histogram of
    gradients (HoG). Xu et al. (2010) proposed a novel forward-looking IR technique
    for thermal object tracking. To validate the reliability and effectiveness of
    the approach, a real Forward Looking Infrared (FLIR) imagery acquired from a steadily
    moving platform has been employed. A stationary object is recognised and tracked
    from a platform in motion in one of the sequences and a moving target is recognised
    and tracked from a manoeuvring platform in another sequences (Singh et al., 2021).
    Spatio-temporal intensity prediction algorithms have been used to detect objects
    in motion in the video frames. This data has'
