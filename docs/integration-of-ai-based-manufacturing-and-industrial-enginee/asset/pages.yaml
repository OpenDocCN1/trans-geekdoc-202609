    # 5.1.2 HISTORY OF DATA ANALYTICS


    +   - **1940s**: The advent of predictive analytics, which involves conducting
    research on potential future outcomes

    +   - **1970s**: Relational databases and non-relational databases; SQL and NoSQL
    are used to analyse the data in both types of databases.

    +   - **1980s**: Due to the declining cost of hard drives, data and information
    are increasingly being stored in hard discs in data warehouses.

    +   - **1989**: Business Intelligence is the act of identifying, gathering, and
    analysing an organization''s previously stored data in order to arrive at decisions
    that are more beneficial to the firm as a whole.

    +   - **1990s**: Data mining is the process of collecting many sets of data and
    analysing them by identifying patterns.

    +   - **2000s**: Rise of HR Analytics


    # 5.1.3 TYPES OF DATA ANALYTICS


    Analytics is classified into four main types:


    +   - Descriptive analytics – Which examines what actually occurred.

    +   - Diagnostic analytics – Which considers the causes of these events.

    +   - Predictive analytics – Which considers what is going to happen in the future.

    +   - Prescriptive analytics – Which considers what steps are to be taken next.


    # 5.1.4 PHASES OF DEVELOPMENT OF ANALYTICS


    The traditional metrics was based on numbers that were indicated through basic
    statistical data. The evolution of metrics has resulted in the introduction of
    analytics.


    The first phase of analytics was descriptive analytics. In descriptive analytics,
    the data of past decisions are analysed, and future decisions are modified in
    light of the findings (Kumar et al., 2022).


    The second phase of analytics is diagnostic analysis. Once an issue with an organization
    has been identified during the descriptive stage, the problem will be diagnosed
    during this analytical step. For instance, if you visited the doctor, he would
    first inform you that you had a temperature then determining whether it was caused
    by a cold or an illness (Dhanalakshmi et al., 2022).


    The third phase of development in analytics is predictive analytics. The predictive
    analytics focus on integration of the past and present data to forecast future
    data. This will help HR to make decisions accordingly.


    Prescriptive analytics is the final stage of analytics. This can be observed in
    the more advanced level of HR analytics where high volumes of complex data sets
    are'
