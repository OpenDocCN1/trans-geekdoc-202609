  md: '# 7.7 VARIOUS IoT EDGE ROLE APPLICATIONS


    UAVs explores the majority of the areas where IoT devices have been used to improve
    performance.


    # 7.7.1 AUTONOMOUS VEHICLES


    UAVs cover almost all tasks in this environment. They rely on the prime edges
    in real time to be safe and reliable. However, the mobility and Internet connectivity
    of IoT-enabled vehicles might pose challenges when transmitting the data they
    generate to the cloud without any significant delays that may compromise safety.
    The volume of data that these vehicles amass is staggering.


    # 7.7.2 SMART CITIES


    At the moment, cutting-edge devices such as UAVs are becoming increasingly common.
    This edge supports the hotspots for transforming the data publicly by adjusting
    real-time ground conditions (Gao et al., 2019). This has become one of the most
    significant methods for detecting network congestion and rerouting traffic. Furthermore,
    these edge devices provide instant responses in civic areas where power grids
    and public infrastructure are required to sustain real human life.


    # 7.7.3 STRONGER SECURITY


    The environment employs these edges to increase security through video surveillance
    and biometric scanning when data is needed in real time with authorizations, since
    the edges in both commercial and consumer aspects can be strengthened (Sun et
    al. 2019). When optical technology is used in any company to secure the entrances
    to rooms or entire buildings, the records of employees’ biometrics are held at
    the edge nodes.


    # 7.7.4 HEALTHCARE


    Medical information from various healthcare systems, from numerous medical devices,
    and from patients themselves has been taken into account. Yet all of this data
    is processed at various edges, which reduces congestion and investigates storage
    possibilities. In this situation an IoT-based UAV device evaluates the data so
    as to decide which should be kept and which should be thrown away. As an illustration,
    consider cardiac equipment, where the edge device could gather the data and compare
    it to the standard data, quickly alerting the user if anything abnormal was noted.
    Real-world success stories show that medical robotic surgery can be employed where
    it will be used most creatively.


    # 7.7.5 MANUFACTURING AND INDUSTRIAL PROCESSES


    The data on each connected device must be transferred to the centralized server
    because the industrial IoT links a significant number of devices in manufacturing'
