    into a single HR BI tool by establishing connections to those systems.


    In contrast to Tableau, Visier offers itself more as an actionable people analytics
    insights platform that displays trends in workforce data. Along with other aspects
    of human resources, it enables us to investigate the factors that contribute to
    people’s high levels of performance and productivity (Shet et al., 2021).


    # 5.4.8 QLIK


    Similar to Visier, Qlik is a piece of software that compiles a large amount of
    data into one place. While Visier is a platform that extracts actionable insights
    from data about a workforce, Qlik is a more generic solution for gathering data
    and it includes several elements for dashboarding. As a result of this feature,
    Qlik is a great alternative for more broad purposes, involving the collection,
    storage, and dashboarding of data. Alongside Power BI and Tableau, Qlik has maintained
    its status as a leader in the Gartner Magic Quadrant for a number of years.


    # 5.4.9 SPSS


    SPSS is utilized in the process of data analysis, whereas Power BI, Tableau, and
    Qlik are utilized, for the most part, in the collection of data.


    One of the most often used tools for HR analytics is SPSS, which is widely used
    in the social sciences. Because it is so simple to use, we are able to do data
    analysis even if we do not have a strong background in statistics (Margherita,
    2022). Because SPSS is so prevalent in the social sciences, there are a lot of
    HR experts that are familiar with its use, particularly those individuals who
    enjoy examining facts. A greater number of people utilize SPSS outside of the
    social science industry than use SPSS itself (Mirski et al., 2017). On the other
    hand, the SPSS programming language is more difficult to master. The fact that
    SPSS is, in many respects, comparable to Excel makes the programme much simpler
    to employ (Rani, Pareek, Kaur, Chauhan, and Bhambri, 2023b).


    # 5.4.10 CPLEX OPTIMIZER


