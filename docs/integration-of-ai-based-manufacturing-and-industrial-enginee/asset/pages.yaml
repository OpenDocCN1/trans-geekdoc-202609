    to emulate human thinking and learning processes (Bandyopadhyay and Sen, 2011).
    AI is used in many industrial processes, such as predictive maintenance, quality
    control, and logistics. One of the primary benefits of AI in industrial processes
    is its ability to improve predictive maintenance. With AI, machines can analyze
    data from sensors and other sources to predict when equipment is likely to fail.
    This allows companies to schedule maintenance in advance, reducing downtime and
    repair costs. AI is also used in quality control, where it can identify defects
    and anomalies in products more quickly and accurately than humans (Vijayalakshmi
    et al., 2021).

    +   - **Internet of Things:** IoT pertains to a system of interconnected devices
    that are capable of sharing data amongst themselves. In industrial processes,
