    FIGURE 3.2 Steps of propensity modelling. (Source: https://www.smartinsights.com/managing-digital-marketing/marketing-innovation/15-applications-artificial-intelligence-marketing/)


    # 3.3 CONVERT – ENCOURAGE POTENTIAL CUSTOMERS TO CONSUMERS


    +   i. Dynamic pricing


    Dynamic pricing comprises solutions that are adaptable and expansible for re-pricing,
    which involves continuously altering the price of products based on important
    variables such as demand and supply, industry and market trends, competition,
    customer expectations, site user behaviour etc. (Puri et al., 2022). It examines
    how much a product is worth in respect of other products on the market (Chaffey,
    2019a). With this pricing method, companies may respond to shifting market conditions
    without disclosing any personal information or breaching the privacy of customers
    (Clifford, 2018). To give an example: For all of its express trains, Indian Railways
    has shifted to dynamic pricing based on demand and season. As a result, the revenue
    has increased by an estimated 20%.


    Algorithmically, self-improving Machine Learning equations are used to calculate
    dynamic prices (Singh et al., 2021b). These algorithms consider a wide range of
    pricing optimization factors, including profit analysis, the forecast of price
    and market trends, price automation, market analysis, competitor price analysis,
    personalized pricing for loyal customers, and the flexibility to adjust and adapt
    to new scenarios (Deakin et al., 2019).'
