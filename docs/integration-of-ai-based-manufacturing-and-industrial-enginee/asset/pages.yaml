  img_proc: true
- pgno: 211
  md: 'productivity. There exist several data-driven techniques to solve the problems
    concerned with production lines. ML models are proven to be efficient in the analysis
    of complex systems and provide solutions to the problems concerned with manufacturing.
    To understand the applications of ML and DL techniques in industrial engineering
    processes, the concept of manufacturing lines and their attributes are covered
    in the next section.


    # 13.2.1 PRODUCTION LINES


    In present-day manufacturing industries, the production lines are considered to
    be the backbone of all units. The key idea of the production line is to automate
    the distinct set of processes in the production phase of the product. The authors
    (Lemstra and de Mesquita, 2023) define production lines as manufacturing or assembly
    processes that undergo several sequential processes (manufacturing or assembly
    processes, fault detection, etc.) to make the desired end product. In the manufacturing
    process, the raw material needs to go through the production line which further
    passes through distinct working stations to produce the end product. The components
    form distinct production lines which are assembled through the assembly production
    line to make a complex end product (Rani, Bhambri, and Chauhan, 2021). The assembly
    production lines tend to be used in both the automobile industries and the large
    equipment industries (Bhagwan and Evans, 2023).


    A production line can be categorized into five major categories, viz., a) Job-Shop
    b) Batch c) Repetitive d) Continuous and e) Mass production. The authors (Bierbooms,
    2012) defined the four major characteristics of the production line for ease of
    categorization and these characteristics are discussed in turn as follows.


    +   - **Production Volume:** Depending upon the type of manufacturing products,
    there can be variations in the size and volume of the production line. It can
    have either a low volume or a high volume according to the type of product manufacturing
    (Banerjee et al., 2022). The cycle time of a low production line is comparatively
    longer because of the continuous interventions of humans and the lower degree
    of automation in the production process. For example, a luxury car manufacturing
    industry has a job-shop production line which has a low volume. In contrast, machinery
    in the high production line is less flexible and requires less intervention from
    humans, resulting in high throughput. For example, a paper-manufacturing or food-processing
    industry requires less customization; as a result, such industries have high-volume
    production lines that run at high speed without human intervention (Bauza et al.,
    2018).

    +   - **Workstation arrangement:** Depending upon the type of complexity within
    an industry, the workstation can be either single-server or multi-server in nature.
    In a single-sever workstation, a single machine is capable enough of handling
    the whole manufacturing process of the industry and, hence, the machine setup
    is simple, but the reliability is highly uncertain (Rani, Arya, and Kataria, 2022).
    In a multi-server workstation, several machines in parallel are utilized to carry
    out the production process. The multi-server'
