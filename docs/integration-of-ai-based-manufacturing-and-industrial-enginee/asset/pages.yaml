    # 12.1  INTRODUCTION


    Customers in today’s competitive telecom market expect high-quality service, value
    for money, and competitive pricing (Todorean and Beleiu, 2016). If they do not
    find what they are looking for, today’s customers will not hesitate to switch
    service providers. The term for this occurrence is called churning (Liu et al.,
    2022). The satisfaction of customers is connected directly to customer churn.
    Since acquiring new customers is much more expensive than retaining existing ones,
    mobile carriers are changing their attention from client acquisition to customer
    retention (Kincaid, 2003). After years of intensive research in the subject of
    churn prediction, data analysis being integrated with Machine Learning was discovered
    to be a successful way to recognize churn. These obtain results faster and get
    insights that raise red flags before any damage can occur, giving businesses a
    chance to take preventative measures (Caigny et al., 2018). Typically, these methods
    are used to build models and learn from past data to predict customer churn. However,
    only a few of these methods tell us why customers churn, while the majority of
    them provide a result that customers may or may not churn (Rani and Gupta, 2016).
    Data normalization, pre-processing, feature selection, reducing class discrepancies
    and incomplete values, and substituting current variables with derived variables
    can all help in increasing the accuracy of churn prediction. Experiments conducted
    from the perspective of end users, as well as gathering their opinions on the
    network, also contribute to this improvement (Mahalekshmi and Chellam, 2022).


    This helps the telecom industry retain customers more effectively. A smaller study,
    on the user’s perspective and the quality of their experience, was conducted in
    contrast. In fact, user data volumes were not the sole focus of any study (Zhang
    et al., 2017). The relationships between Quality of Experience (QoE) and traffic
    characteristics for estimating this measure could assist service providers in
    keeping an eye on user satisfaction and taking prompt and appropriate action to
    address performance issues and reduce churn as well as finding the relationships
    in between (Perez and'
