    environment variables. A convolutional neural network (CNN) model is used for
    the image classification of opened and closed eyes. This classification helps
    in determining the loss of driver’s concentration.


    # 17.3 EXISTING SYSTEMS


    Existing systems have used methods such as the electroencephalogram (EEG), electrocardiogram
    (ECG), respiratory signal analysis, heart rate variability (HRV), mobile video
    processing, and PERCLOS Estimation. Some of these systems contain devices which
    have to be worn by the person, which can create problems when the driver is in
    the car. Sometimes an error might occur due to miswiring between the devices,
    which this might make the processor unable to perform properly, meaning that it
    might fail to alert the driver [34–36]. These kinds of system might be unsuitable
    for the detection of drowsiness. One of these techniques, the electroencephalogram
    (EEG), is a test which monitors brain activity by considering the electrical signal
    of the brain. In this instance, electrodes are placed on the scalp of a person.
    The ionic current present in neurons of the brain results in a voltage fluctuation,
    which is measured by the EEG [37–40].


    # 17.4 SYSTEM ARCHITECTURE


    An attempt is made to develop a system which monitors the driver, mainly focusing
    on the movement of the eyes. Not only an alarming sound but also some other features,
    such communication with the server side, the detection of alcohol content and
    the perception of road traffic incidents can also be included. The aim of this
    research is to design and develop a system which will only alert the driver and
    it is the responsibility of the driver to return to his normal driving condition
    and apply break if necessary. This research has focused on developing a system
    based on data science and IoT as domains and using algorithms, namely the Haar
    Cascade algorithm and the EAR algorithm [41–49].


    The proposed system consists of the following modules:


    +   1. Arduino

    +   2. LCD Screen

    +   3. Buzzer

    +   4. Vibration Sensor

    +   5. LED

    +   6. Camera

    +   7. System Running the Algorithm'
