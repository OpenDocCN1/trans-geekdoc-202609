  md: '# Constrained Reconfigurable Manipulators


    For the purpose of compensating the manipulator''s unknown dynamic component,
    we shall use the radial basis function neural network (RBFNN) (Wang et al., 2015).


    # 18.4.1 RADIAL BASIS FUNCTION NEURAL NETWORK


    The radial basis function neural network has been demonstrated to be a universal
    approximate of the nonlinear functions and is frequently used to approximate unknown
    continuous functions due to its simplicity and amazing properties like a simple
    framework, faster training process, and convergence. Its structure was taken from
    the function approximation theory and is comparable to a feed forward neural network.
    The source node makes up the input layer of an RBF neural network, and each neuron
    in the hidden layer uses a radial basis function of the Gaussian function type
    to calculate its output. The output layer then frames the weighted sum of the
    hidden neuron outputs in linear form, and finally the network is appropriately
    supplied with a response.


    ```

    Y_j(y) = exp(-||y - t_j||^2 / (2 a_j^2)) j=1,2,...l

    ```


    Where l is the number of hidden layers. The neural net j has the centre vector
    t_j = [y_j1, y_j2, ..., y_jl], a_j^2, the variance of the jth radial basis function
    and Y_j denotes the Gaussian activation function for neural net j.


    In light of the RBF neural network''s aforementioned structure, we therefore estimate
    the unknown dynamical portion as


    ```

    κ(z) = Ω^T Ψ(z) + ε(z)

    ```


    where Ψ(.) : R^m → R^T the smooth basis functions are and the neural network weight
    matrix is Ω ∈ R^(T×m). The number of nodes is T and the neural reconstruction
    error is ε(.) : R^m → R^m. For large T, ||ε(z)|| ≤ ε_r.


    By incorporating (18.23) and (18.25) into (18.19), one can get:


    ```

    M̅r = Z^T U - κ(z) - Ω^T Ψ(z) - ε(z) - F̅(θ̅1) - D̅ - V̅(θ̅1, θ̅1)r

    ```


    For the construction of the force/position ideal controller, we choose the input
    in accordance with the restricted dynamical model (18.26).


    ```

    U = Ū + Ū̅

    ```'
