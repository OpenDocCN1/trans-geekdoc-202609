    # 2.2 SURVEY ON INDUSTRIAL ENGINEERING WITH IoT AND AI


    To optimize industrial supply chains, organizations can foresee market movements
    with the use of AI systems. This gives management a huge advantage in terms of
    responding to competitive challenges. AI algorithms look for position trends,
    macroeconomic and socioeconomic characteristics, ecological patterns, status policy,
    consumer behaviour, and more to estimate market wants (Rana, 2018; Rana et al.,
    2019).


    Manufacturers would be able to minimize production downtime and maximize the overall
    operational efficiency of their manufacturing lines thanks to this development
    (Kaur et al., 2019). By generating a predictive study of the equipment’s attributes
    and ultimately optimizing production processes, intelligence and computer training
    also improve quality control and standardization. With the use of AI, businesses
    can now make quick decisions based on data, streamline their manufacturing procedures,
    cut operational expenses, and improve customer service (Dal Mas et al., 2021;
    Gupta et al., 2021).


    Industry will be transformed by a Machine Learning IIoT, which will also save
    money and enhance service quality (Gupta et al., 2011). Organizations may retain
    storage by keeping a close watch on inventory levels, estimate arrival dates,
    and produce the maximum amount of goods by projecting bottlenecks. In order to
    compute an examination of production processes and analyse phenomena such as microscopic
    breakage within industrial facilities, the implementation of a computerized visual
    system could be employed. Machine Learning may flag enterprises to manufacturing
    problems that could contribute to unsatisfactory quality control. The primary
    obstacles can be evaded in the initial phases of Industry 4.0’s broad technological
    level (Javaid and Haleem, 2019; Sanchez et al., 2020).'
