  md: '# ii. Chatbots


    A chatbot is a software program that is used to simulate conversation with humans.
    Chatbot systems often require constant tuning and testing in order to accurately
    mimic how a human would act as a conversation partner. A chatbot answers user
    questions through instant chats which resolve customer queries. Many types of
    chatbots are used by companies, including menu-based chatbots-, language-based
    chatbots, keyword chatbots, voicebots, and Machine Learning chatbots. Presently,
    the Machine Learning chatbot and the voicebot are widely adopted as it uses technology
    that adds value to the company and the customer (Levine, 2018).


    # 3.4 MACHINE LEARNING CHATBOTS


    These chatbots respond according to a user’s previous history, with the aid of
    Machine Learning and Artificial Intelligence techniques. The user queries and
    questioning style is analysed and these chatbots use it to improvise themselves.
    Say, for example, generally in food ordering app, the user preference, frequency
    of food purchase, is stored based on the previous purchase. Over a period of time,
    when the user interacts with these chatbots, they recollect their data, such as
    location, food preference, payment method and assist only in payment confirmation.
    The user can place an order with a single click or swipe. This simplifies the
    valuable user experience (Bali et al., 2023).


    # 3.5 VOICEBOTS


    Companies have increasingly adapted to voice-based bots because of its seamless
    assistance. Owing to the convenience the voice-bots, such as Amazon’s Alexa or
    Apple’s Siri, conversation is more personal, quick and hassle-free; this is the
    prime reason for its growing popularity in recent years. A recent study by Statista
    (2023) states that users find voice search more than typing, as they feel it is
    more personal (Vicioso, 2019).


    # iii. Web & App Personalization


    The propensity model is used for website personalization. It is a process of creating
    a unique browsing experience for a user every time they visit a website. Companies
    providing a personalized web experience is possible with the help of cookies,
    which are unique and exclusive, and cater to the user’s specific requirements.
    Thus, it offers customized tailormade information that appeals to the user rather
    than general and mass information.


    Customized mobile apps can also be developed using a propensity model. This helps
    to cater to a niche segment of the target audience. A tailormade, unique user
    experience is offered such as language, information on the app, recently viewed
    items, payment preferences, offers and promotion schemes are made in mobile apps
    (Derek, 2018).


    # iv. Re-targeting


    Machine Learning helps to identify content that makes users revisit the website.
    Advertisements are optimized accordingly using predictive analysis and websites
    alter the content that is most viewed by the users. This also works based on user
    interest and the choice of preferences.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 3.6 ENGAGE – USE TECHNIQUES TO MAKE USERS REVISIT WEBSITE OR APP


    **i. Predictive customer service**


    Getting repeat sales for existing users is far simpler than gaining new customers.
    Thus, maintaining the current clientele is essential to the success of a business
    (Ritu and Bhambri, 2023). This is especially true for businesses that rely on
    subscriptions, when a high degree of turnovers can be quite expensive. The predictive
    analysis technique helps to identify those factors that make a customer likely
    to discontinue the service. Marketers can get in touch with these clients with
    promotions, reminders, or help to stop them from leaving.


    **ii. Automated Marketing**


    The majority of marketing automation techniques contain a set of rules that, when
    activated, initiate customer interactions. Through the analysis of billions of
    consumer data points, Machine Learning can determine the best times to contact
    customers, the best subject lines, and much more. Your marketing automation activities
    can then be made more effective by using these insights (Suthar, 2020).


    **iii. 1:1 dynamic emails**


    Any email content that alters based on the information, preferences, and behaviours
    of the subscribers is referred to as dynamic content in email marketing. A marketing
    email is sent to the entire database; however, some content modules are dynamic
    and change depending on a determined attribute (Dhanalakshmi et al., 2020).


    # 3.7 IoT AND MARKETING APPLICATION


    The implementation of IoT has transformed business operations in the present era.
    It facilitates the collection of a sizable volume of data from a variety of sources
    (Ritu and Bhambri, 2022). The use of the IoT is changing how businesses operate
    in the modern world. This makes it possible to gather a sizable amount of data
    from multiple sources. IoT is the prime factor for the development of increasingly
    intelligent devices, which creates new potential across all situations and industries,
    not just in the B2B landscape (Kaur et al., 2019).


    The Industrial Internet of Things (IIoT) emerged as a result of the longest-running
    IoT applications in the industrial sector. The emergence of Industry 4.0 has boosted
    the IIoT sector and it is experiencing the fastest growth and popularity due to
    developments in automation and robotics. This has been made possible by the innovation
    in production systems brought on by the adoption of IoT. The concept of the Phygital
    (blending the Physical with the digital) evolved which opened avenues to introduce
    new products and new services that are useful to the market (Chhabra and Bhambri,
    2021). Production facilitated by smart connected devices enables the ability to
    understand customer specifications and, as a result, the ability to suggest brand-new
    practical services to support these products.


    Businesses may get real-time sales information, understand where and how their
    items are bought, and get prompt customer feedback. As a result, real-time strategic
    planning that is constantly being adjusted is produced. The IoT is the foundation
    for'
