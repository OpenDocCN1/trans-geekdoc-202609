    of intelligent machines and the internet of devices, moving intelligence from
    the boundary to the cloud in industrial settings and converting information into
    useful data for great decisions while preparation is undertaken for activity to
    be carried out where it is most necessary. The fundamentals of IIoT are the capability
    to regularly collect'
