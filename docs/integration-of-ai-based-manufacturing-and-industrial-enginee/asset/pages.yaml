    # 5.3 USES OF ANALYTICS IN HR PRACTICES OF INDUSTRIAL PROCESSES


    # Improving the hiring process


    HR analytics helps in analysing the applications of fresh applicants to select
    the right people (Ritu and Bhambri, 2023). This can be done by building a prediction
    model which gives exact data points such as candidate demographics data, previous
    employment history, etc. This model can then be used in combination with the candidates’
    CV response to predict whether or not they are suitable for the organization.


    # Skills development analytics


    The level of expertise and skills of the staff is crucial to the functioning of
    the organization (Berk et al. 2019). Due to the constant evolution of technology
    and work requirements, it is essential to establish and express core competency
    or capability demands. To meet the needs of the organization, employees must be
    capable of maintaining and acquiring new skills (Berk et al. 2010). The difficulties
    with regard to this situation can be overcome by providing a learning component
    that allows for the creation of customized learning programmes based on employee
    capabilities, job matrix identifiers, or the goals of the organization.'
