- pgno: 73
  md: '$y_i, h_l^-, h_l^+, f_i^+, f_i^- \ge 0$


    $(l = 1,2,3,4,...,m), (t = 1,2,3,4,...,n)$


    where $h_i^+$ denotes the positive deviation; $h_i^-$ denotes the negative deviation;
    $f_i^+$ and $f_i^-$ are real numbers denoting the relative weights allotted inside
    a priority level to the unwanted deviational variables and both reflect the decision-maker''s
    choice on the relative position to each target; $p_l$ denotes the desired targets
    or goals for $l = 1, 2, 3, 4, ..., m$; $y_t$ denotes the decision variables; $E_{lt}$
    are the decision variable coefficients.


    These weights define the norms'' determining criteria, and are arbitrary. Jyoti
    and Mannan (2016) and Orumie and Ebong (2014) have used the goal programming formulations
    mentioned above.


    # 4.3.2 LEXICOGRAPHIC GOAL PROGRAMMING (LGP) OR NON-ARCHIMEDEAN GOAL PROGRAMMING
    OR PRE-EMPTIVE GOAL PROGRAMMING


    The lexicographic goal programming variant was used in the great majority of the
    initial goal programming formulations (for example, Lee, 1972). The presence of
    multiple priority levels helps to distinguish lexicographic goal programming from
    those other goal programming strategies (Kaur and Bhambri, 2019). Each prioritized
    level contains several unwanted deviations that must be minimized within constraints.
    The decision-maker in this approach needs to prioritize the problem''s desired
    goals (Ritu and Bhambri, 2023). The model is then optimized by focusing as precisely
    as possible on the most important objective before moving onto the next higher
    goal, and so on until the minimal goal is reached., i.e., the objective functions
    are arranged in such a way that achieving the very first goal is frequently more
    vital than achieving the second goal, which is significantly more important than
    achieving the third goal, and so on. As a result, a lower-priority goal never
    disregards the best value of a higher-priority goal. The lexicographic goal programming
    was mentioned by Iserman (1982), Sherali (1982), and Ignizio (1985) in their research.


    The following is the proposed lexicographic goal programming model:


    Minimize:


    $Z = \sum_{l=1}^{m} r_l (h_l^- + h_l^+)$


    Subject to:


    **Goal constraints:**


    $\sum_{t=1}^{n} E_{lt} y_t + h_l^- - h_l^+ = p_l$ for $l = 1,2,3,...,m$'
