  md: 'as Hyper-Spectral Images and SOR Images are used as an input and can be suitably
    compressed for standard size using various algorithms (Ayoobkhan et al., 2019;
    Dileep and Danti, 2018; Fan et al., 2019).


    Data Compression Ratio(DCR) = Original File Size / compressed file size (9.1)


    Percentage Savings = (1−1/DCR)×100% (9.2)


    The image solidity practises are approximately categorized in dual groups viz.


    # 9.4.1.1 Lossless Compression Techniques


    The novel data is flawlessly restored after the flattened data in lossless compression.
    It uses all of the info in the true images during compression, resulting in an
    image that is similar to the original image when decompressed (Ayoobkhan et al.,
    2019).


    Among the Lossless Compression Techniques are:


    +   - bzip2

    +   - Finite State Entropy

    +   - Huffman coding

    +   - Lempel-Ziv compression

    +   - Prediction by partial matching

    +   - Run-length encoding


    # 9.4.1.2 Lossy Compression Techniques


    The reconstruction of an image using lossy compression is only an approximation
    of the original data. Some data is lost as a result of this technique (Fan et
    al., 2019). The most common application of this technology is in the area of multimedia.


    Among the Lossy Compression Techniques are:


    +   - Predictive coding

    +   - Transform coding


    As the Lossy Compression Technique results in the loss of data (Dileep and Danti,
    2018), Lossless Compression Technique is considered in the proposed project, which
    can be able to retain even the minute features of the image in compressed form
    for further processing (Figure 9.3).


    ![](img/3d190e19625a7567e7b93c8e95b18d9c_161_0.png)


