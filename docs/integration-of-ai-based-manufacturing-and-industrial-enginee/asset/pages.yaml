    # 2.5 FUTURE OF INDUSTRIAL ENGINEERING WITH IoT AND AI


    The industry’s future lies in the fusion of artificial intelligence with the Internet
    of Things; this is something that tech giants such as Google, Amazon, Tesla, and
    Uber are actively researching and developing (Kshirsagar et al., 2022). Table
    2.1 details common features of industrial engineering with IOT and AI.


    The IoT and AI applications are about to experience yet another major uptick in
    the manufacturing sector, with a projected IoT market size of $2.4 trillion annually
    by 2027, according to Business Insider. AI will offer useful data that helps business
    executives create unique and reliable business models. When it comes to seeing
    patterns and occurrences that a normal person cannot notice clearly, this technique
    will prove to be quite helpful (Jabeen et al., 2021). AI will generate the data
    needed to support fact-based, data-driven business decisions. It will in many
    ways give a more thorough assessment and assist in removing personal prejudices
    from the calculation (Rani et al., 2022c). In order to uncover growth, extension,
    and even emerging market prospects, ML and AI technologies can acquire data from
    a variety of sources.'
