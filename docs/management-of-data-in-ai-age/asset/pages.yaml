  md: 'Intelligence, and we present the main contributions offered by our work to
    the growing body of research on how to make use of AI.


    **Keywords:** AI, Artificial Intelligence, Applied Artificial Intelligence, Core
    business


    # The Breakthrough of Artificial Intelligence in Society


    *“Artificial Intelligence is no longer an academic term, but a reality”*. This
    could have been said today, given the current and escalating hype surrounding
    AI. However, it was actually stated by Holloway and Hand (1988) in their Business
    Horizon article published almost 30 years ago. Nevertheless, this statement concerning
    the large-scale and real-world breakthrough of AI could have also been made today,
    in the year 2020. In looking back from a historical viewpoint, the proof-of-concept
    in terms of the wide scale societal breakthrough of Artificial Intelligence (AI)
    has been a continuously repeated promise and message surrounding the development
    of this technology over the last few decades, from the mid 1950s until today (see
    e.g. Turing, 1950; Weizenbaum, 1966 and Makridakis, S. (2017)). As formulated
    by Xu (2019), we are now already in the 3rd wave of AI, and the promise of AI
    has been repeated for each of these three waves of developments of AI technologies.


    Still, this statement about the breakthrough of AI as formulated by Holloway and
    Hand (1988) might now be truer than ever. As pinpointed by Xu (2019) this 3rd
    wave of AI is now characterized by technological enhancements and the deployment
    and use of AI solutions in society, whereas'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'the 1ˢᵗ and 2ⁿᵈ wave was to a large extent academia driven. In short, AI is
    now increasingly applied on a societal level.


    Accordingly, and as AI is now increasingly applied, we suggest that it is now
    time to address issues related to “Applied Artificial Intelligence” (AAI) and
    accordingly expand the focus from technical matters of making AI work (as a technology),
    to making AI work in the context of its use and implementation. With this as our
    central point of departure we propose the term “Applied Artificial Intelligence”
    (AAI) and we define it as *the study, design, development, implementation and
    use of Artificial Intelligence technologies to address real-world problems.* In
    this paper we propose this term in an attempt to look beyond the technological
    developments surrounding the area of AI, and as an effort to redirect our focus
    towards what this technology now enables, for consumers as well and for businesses
    when AI is now increasingly applied in real-life settings.


    The development of AI has been driven by technological advancements on the one
    hand, including the developments in machine learning, pattern recognition and
    neural networks (e.g. Gilio, 1995), and visions and promises about the next steps
    of AI in terms of its applicability on the other hand (Xu, 2019). Through these
    cycles of developments, the breakthrough of AI has been a repeated message, surrounded
    by promises of a nearby future (see e.g. Makridakis, 2017; Kaplan & Haenlein,
    2020), and at the same time it has also been surrounded by doubts and fears (see
    e.g. Clark, 2003,'
  merge: -1
  img_proc: true
