  md: '# Artificial Intelligence, Machine Learning and Data Science as Iterations
    of Business Automation for Small Businesses


    Pooja Sharma

    Managing Partner- Business Automation, SKS Consulting & Advisors,

    India


    # Abstract


    Artificial intelligence and machine learning, the two iterations of automation
    are based on the data, small or large. The larger the data, the more effective
    an AI or machine learning tool will be. The opposite holds the opposite iteration.
    With a larger pool of data, the large businesses and multinational corporations
    have effectively been building, developing and adopting refined AI and machine
    learning based decision systems.


    The contention of this chapter is to explore if the small businesses with small
    data in hands are well-off to use and adopt AI and machine learning based tools
    for their day to day business operations.


    **Keywords:** AI for small business, machine learning for small business, Data
    Science, Big Data


    The modern age automation tools are being developed using artificial intelligence
    and machine learning. The basis of development of an AI or machine learning tool
    is entirely'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'based on the availability and quantity of data. The more data we have, the
    more effective our automation tools will be.


    Now, we come across the issue if the mere availability and quantity of data are
    the only basis of an effective AI or machine learning tool. Not entirely but largely
    yes. To train an AI based tool, we need more and more buckets of data. This data
    needs to be fetched from a gamut of processes and operations taking place across
    a particular industry or business organization. Why we are stressing here on the
    data coming from a particular industry or a business organization. The answer
    lies in the concept of relevance of data that is further based on the effectiveness
    of data science or analytics capabilities of a business unit.


    Here come the small businesses in the discussion of this chapter. Small businesses
    are obviously having fewer market offerings generally operating in niche markets
    and thus have small data in hands especially in the infancy stages of their business.
    Even small businesses with established business presence and market for their
    offerings still have small data with them.


    The small data may not be sufficient to build, develop and train an AI system.
    Furthermore, a small business may not have data for some business processes entirely
    that other small businesses may have. There are a larger number of small businesses
    not having HR departments, legal compliances divisions and other functional divisions
    that large businesses have. The absence of data related to all processes of a'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'business or the availability of small data with the small business requires
    re-working or re-thinking on the fact if a small business still can embrace the
    business automation tools that are basically based on big data driven AI systems.


    # AI vendors and small businesses


    It is evident that insufficient data in the hands of small businesses coupled
    with small investment outlays they may have, makes it infeasible to build and
    develop their own AI systems independently. Lesser data and limited financial
    outlays with small businesses hinder the in-house development of AI based automation
    tools.


    But, the small businesses can still adopt the AI based automation tools procured
    from AI vendors. AI vendors are the full time developers of AI systems for the
    industry segments they have specializations in. AI vendors pool small data from
    the businesses processes from different small businesses they work with and then
    the collected data is aggregated to build and train a standalone AI system for
    all the businesses falling into a particular market segment.


    This way, a small business can benefit from the automated data of the HR department
    of another small business even if the former doesn’t have an HR function division.
    An AI system procured from an AI vendor may further help a small business to adopt
    automation in their business decisions and processes without investing on in-house
    AI development.


    # Does it solve the AI adoption problems?'
