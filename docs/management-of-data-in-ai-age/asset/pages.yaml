    # **B. Role of Artificial Intelligence in empowering Business models**


    We all have witnessed the way global digital transformation, in the past decade,
    has significantly changed the business models around the world. Not only organizations,
    digitalization has also deliberately affected the lives of individuals and their
    work styles [II]. The use of digital technologies and underlying data has entirely
    transformed the way consumers and industries interact. Moreover, the blend of
    Artificial Intelligence (AI) and emerging technologies has revolutionized the
    commercial sector in a way how consumers and industries interact, framing new
    business strategies to enhance revenue generation and many more.


    It is evident from the recent studies that the inclusion of AI technology in framing
    business strategies has been proved to be highly beneficial for different top-notch
    companies like Facebook, Google, Uber, Amazon, Alibaba, Tesla, etc [I]. Using
    AI technology, these companies have gained a competitive edge in the market in
    comparison to those who failed to adopt AI in their business models. However,
    in addition to the inclusion of AI technology in framing innovative business models,
    the top company executives also need to encapsulate an entrepreneurial and ingenious
    mindset to remain competitive and creditable.'
