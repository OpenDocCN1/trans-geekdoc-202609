    Alan Turing in 1950, and it is a test of a computer’s ability to show intelligent
    behavior equivalent to, or indistinguishable from, that of a human. In this strive,
    the notions of human-like AI, or human-level AI has been recurring notions (see
    e.g. Miller (2019) and Kaplan& Haenlein (2019).


    In going back to the roots for this human-like model for the development of Ai
    we should of course mention the Eliza system. This system was designed by Joseph
    Weizenbaum in 1966, and it is said to be the first computer program pass the Turing
    test. The Eliza program worked by examining a user’s typed comments for keywords,
    and responded to the user in a dialogue fashion. By relying on this model, Eliza
    could respond either with a generic phrase or by repeating an earlier comment
    left by the user. The Eliza program was in this was designed to replicate the
    behavior of a psychotherapist. In passing the Turing test, Eliza was able to fool
    some people into believing that they were talking to a real person, instead of
    a computer.


    Eliza, and similar systems developed at this time relied on an idea that humans
    could be modeled as computer programs, and in this way it would be possible to
    create AI that could mimic the human brain, and thus present itself as “intelligent”.
    As formulated by Newell and Simon (1972):'
  merge: -1
  img_proc: true
- pgno: 57
  md: '> “Humans, when engaged in problem solving in the kinds of tasks we have considered,
    are representable as information processing systems” (Newell and Simon, 1972)


    As further described by Miller (2019), these researchers expanded the concept
    of a computer’s functional architecture to reflect the way the brain is put together,
    that is the brains cognitive functional architecture. The analogy with the human
    brain was the dominant model.


    > “Like a computer, the brain has storage for information or facts – memory –
    and ways of retrieving information and working on it, using rules for problem
    solving – algorithms.” (Miller, 2019).


    This first set of human-like developments was the result of close collaborations
    between several scientific disciplines (including collaborations across cognitive
    science, psychology, neuroscience and computer science). It was in this sense
    multidisciplinary, but they all shared the same focus – to inform the design of
    an intelligence computational machine.


    Since then, the multi-disciplinary tradition of research collaborations around
    AI has continued, but the outcome is nowadays more diverse. Today, researchers
    are interested in not only the technical challenges associated with the design
    and implementation of intelligence machinery, but also in understanding its philosophical,
    social, cultural, ethical and moral implications. Here, there are some recent
    calls for “responsible AI” (Dignum, 2019), and the importance of understanding
    AI as “agency” (Ågerfalk, 2020) as well as, and in relation to that, to understand
    “what algorithms'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'want” (Finn, 2017) from the viewpoints of agency, but also power, control,
    collection and processing of data, etc. Here, AI is again approached from a human-centered
    perspective, but with a wider idea about the object of study.


    # 3. System-centered approaches to AI


    If we now turn to the most recent developments surrounding AI, and a set of contemporary
    factors that motivates a turn to “applied AI” as proposed in this article, we
    should acknowledge the increasing interest in system-centered approaches to AI.
    No longer do we need to write line-by-line code to build AI systems, and no longer
    do we need to hand-feed these systems with data. Instead, several platforms and
    development frameworks (including e.g. Microsoft azure) now offers ready-made
    “AI components” to integrate AI-functionality in just about any digital service.
    This development enables compositional design (Stolterman & Wiberg, 2020) of AI-solutions,
    and it lowers the development barrier to build functional AI-systems for real-world
    use contexts.


    With the systems-centered approach to AI developers can now focus on what they
    want the AI system to do (i.e., how it should be applied), rather than just getting
    it to work (from a technical viewpoint). Further, the access to data is handled
    by another set of ready-made components (e.g. components for database access and
    retrieval, or components for data scraping of websites), and again it becomes
    more of an issue to think about what data sources should be used, rather than'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'how to solve any technical problems associated with getting

    the data in the first place.


    # 4. Towards a forth approach? A call for Applied

    Artificial Intelligence


    Although we now have the AI technology in place, and as

    we have it accessible as ready-made AI components that can

    be easily integrated in systems and digital services, there

    might still be a need for an additional approach here. If we

    now have the technology in place, the next question to tackle

    has to do with how to put it to use in different contexts? To

    address this question, I suggest that we need to approach it

    from the viewpoint of “Applied Artificial Intelligence”.

    Although there is nothing new about the fact that AI should

    be used, there is still no explicit approach developed that has

    as its particular aim to focus on the process through which it

    can be put to work. In this article I suggest that on a business

    level, we should not just treat this technology as a tool, but

    we should strive for more full-scale implementation and

    integration projects where whole business models are built

    around this technology as a core business component.


    Here I define “Applied Artificial Intelligence” (AAI) as the

    study, design, development, implementation and use of

    Artificial Intelligence technologies to address real-world

    problems. Further, I rely on the work by Zook (2003;2007)

    when I suggest that as we apply AI to real-world problems,

    we can also do that by understanding AI as a core business

    component (Zook, 2007) and by formulating ideas on how'
  merge: -1
  img_proc: true
