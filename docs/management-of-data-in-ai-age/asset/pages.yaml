    # F. Natural Language Processing- Another Business Perspective of AI


    Natural Language Processing (NLP) is a subfield of AI that deals with the interaction
    between machines and humans using the natural languages. It is a blend of Natural
    Language, Machine Learning and Artificial Intelligence that collectively builds
    a technology to interact with machines in normal human language. The objective
    of NLP is to read, decode, understand, and make sense of the human languages in
    a valuable way. Most of the NLP techniques are highly dependent on machine learning
    algorithms to derive meaning from human languages.


    Natural language processing is a scientific discipline that focuses entirely on
    making natural language accessible to machines. NLP addresses tasks such as identification
    of sentence boundaries in documents, extracting relationships from documents and
    searching and retrieval of documents and many more. NLP is a necessary means to
    facilitate text analytics by establishing structure in unstructured text to enable
    further analysis [1].


    Basic NLP tasks include tokenization and parsing, lemmatization/stemming, part
    of speech (POS) tagging, named entity recognition, word segmentation, morphological'
  merge: -1
  img_proc: true
