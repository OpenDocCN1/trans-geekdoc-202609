  md: 'Here we contribute to this growing need by focusing on a company that applies
    AI on a large scale, by embedding AI in the development of their e-biz platform
    that reaches thousands of consumers. In doing so we follow the growing trend of
    focusing on what AI can do (in this case for consumers and for businesses), and
    we present the challenges they had to face when applying AI technologies in this
    particular context.


    Before moving to this case of 3rd wave AI as applied in a business context we
    first examine the current approaches taken to the development of AI. In the next
    section we outline the existing approach including the machine-centered approach,
    the human-centered approach and the systems centered approach. We conclude that
    these approaches have been successful, but also that there might be room for a
    forth approach – to work with an applied AI approach – when it comes to questions
    concerning how AI should be used in a real-world context.


    # ### Three Approaches to AI – A Call for a Fourth Approach to AI?


    Before presenting our business case, and before discussing applied AI - not only
    in terms of “using”, and in that sense applying AI, but also from the viewpoint
    of “applying” as a specific approach to AI - we should first outline and discuss
    a set of other approaches taken to this technology. For sure, and before proposing
    “applied AI” as a distinct approach (including the study, design, development,
    implementation and use of Artificial Intelligence technologies to address real-'
