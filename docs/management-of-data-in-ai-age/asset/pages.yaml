  md: '# C. Collaboration of Artificial Intelligence and Big Data in Business Innovation


    Until before the evolution of Big Data, organizations were completely unaware
    of the power of data being generated by them on a continuous basis. The traditional
    business methodologies adopted by organizations were overlooking the potential
    of data in formulating business strategies. With the advent of new technologies
    to cater to the potential of data - both unstructured and structured, organizations
    are now adopting in-house data analytics tools to improve their business models.
    [1]


    Big Data is much more than a mere collection of data as articulated by many researchers.
    The notion of three Vs: Volume, Velocity, and Variety defines Big data in a sophisticated
    way to gain insights that result in better decision making and improved business
    strategies.


    In 2001, after investigating the challenges, issues and potential generated from
    tremendous amount of data, Gartner developed the ‘3V model’ that characterizes
    big data in context to three attributes:


    > “Big Data is high-volume, high-velocity, and/or high-variety information assets
    that demand cost-effective, innovative forms of information processing that enable
    enhanced insight, decision making, and process automation.”


    Thus, the term Big data analytics (BDA) was coined to better express the potential
    of Big data in examining large'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'amounts of data to reveal hidden patterns, trends, correlations, opportunities
    and other useful analysis. That, in turn, results in smarter business moves, more
    efficient and effective operations, increased profitability and sustainability
    along with higher customer satisfaction. This awareness of trends in the data
    pool and advantage of hidden information has completely redefined the business
    moves in this digital epoch which can be overwhelming to markets and organizations
    around the globe [21].


    Furthermore, the advances in the field of AI have taken the potential of BDA to
    a next level in businesses. The amalgamation of AI and BDA has resulted in framing
    innovative business models. In order to make effective futuristic decisions and
    predictions in businesses using AI, Big data plays a significant role. The efficient
    use of AI depends highly on the scope and quality of the available data used for
    training and testing algorithms [3]. Due to the momentum generated by AI and BDA,
    data has now become a valued commodity in businesses and organizations are competing
    to gather the most remunerative data pool. Moreover, with the advancements in
    AI and data mining, it’s now possible to collect and store data generated by users
    and customers efficiently [1].


    For instance, in order to predict the customer churn Moz used AI based deep learning
    neural networks for analyzing customer actions and behaviors. Efficient business
    insights were collected based on the history of actions performed by'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'customers to decrease churn among existing customers, which otherwise could
    have impeded the company growth [1].


    The interplay between BDA and AI in view of businesses has also paved the way
    to the collection of data from the physical environment. In contrast to earlier
    online data collection techniques based on search queries, orders placed or purchased,
    clicks made by customers, many retail companies are now looking forward to gathering
    data offline as well for efficient decision making.


    For instance, Amazon has incorporated corporate surveillance strategies in grocery
    stores to collect data related to customer preferences and behaviors. Actuators
    and advanced sensors have been installed in stores to accomplish offline data
    collection tasks. Furthermore, Internet of Things (IoT) based tools, Drones, and
    AI-based personal assistants are being used to transform customer actions into
    valuable data. This collected data acts as a driving force behind the price-setting
    algorithms that incorporates responses as per customer demands and reacts accordingly
    [1].


    The potential showcased by AI and Big Data to generate new insights to facilitate
    product, process, and business innovations have made the adaptation of these technologies,
    a business priority.


