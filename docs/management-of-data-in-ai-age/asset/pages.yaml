  md: 'machines were developed and utilized in every field to reduce the manual work
    of human beings which has made significant changes in science and technology.
    In the twentieth century of information technology revolution, gave rise to the
    development of Artificial intelligence with the concept of creating intelligent
    machines which can perform any task like human being does through learning, reasoning
    and self-correction [11]. With this invention, machines will be taking over and
    decline the human mental work. Thus, the goal of Artificial intelligence is to
    develop systems that can function intelligently and independently [14].


    The concept of Artificial Intelligence is old but has gathered enough popularity
    recently. Fig 1.1 shows some of the milestones in the history of AI. From the
    year 1950 till data, there is a vast improvement and developments in the field
    of AI. In 1950, Alan Turing has proposed a Turing test to check the ability of
    machines to work intelligently as humans [16]. He suggested why can’t machines
    work and think in a similar manner as human being does. The term Artificial Intelligence
    was first coined in the year 1956 by John McCarthy at Dartmouth conference which
    led to the development of first AI program. Then he developed LISP programming
    language for AI. In the year 1961, first industrial robot was developed which
    replaced humans on the assembly line. Then in the year 1964, first Chatbot named
    ELIZA is developed which was an early NLP (Natural language processing) program
    to have a communication between humans and machine. During the years 1974 to 1980,
    there was no research and development done in the field of AI due to shortage
    of funds'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'from the government and that time period was the first AI winter duration when
    no invention was made. After the AI winter duration, the invention came with the
    development of Expert system and then so many inventions in the field of AI continued
