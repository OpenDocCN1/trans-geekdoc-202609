- pgno: 61
  md: '# Applying AI as A Core Business Component – The Ebiz Corp Case


    Artificial intelligence is increasingly a background technology that is integrated
    in digital platforms, products and services – ranging from the integration of
    AI-components in search engines and streaming services, to the use of AI in healthcare
    (Rahwan, et al., 2019).


    In our research project we have worked in close collaboration with an e-Biz company
    where we have followed their development of one such AI-based platform that operates
    in the background to support “intelligent pricing” for online web shops. In adopting
    the methodological perspective proposed by Rahwan, et al. (2019) we have followed
    this development during the last 11 months, and we have followed both the development
    of the technical AI-system, as well as the CEO, the Sales manager and the technical
    development team during this period in order to gain an informed understanding
    of how they develop their core business through the development of this AI system.


    In our research collaboration with the eBiz company we have also been inspired
    by the work by Zook and Allen (2003) on processes that governs the growth of the
    business core, the work by Strassmann(1990) on how to align the development of
    IT with the development of business values, and the work by Zook (2007) on how
    to further develop the core business through the development of digital solutions.
    In doing so we have focused on how AI might be applied as a core'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'component in the development of the AI-platform as well as the eBiz company
    as an AI-driven business. In following the development of eBiz and their AI-platform
    we adopted an engaged scholarship methodology (Van de ven, 2007) where we worked
    closely together with this company instead of just relying on e.g. interviews.


    The eBiz company we have collaborated is a global actor who has offices in 6 counties,
    including an innovation office in London. eBiz develops and provide an AI-powered
    web retail platform for 30 customers (global chains), and they have formulated
    their core business as being about “doing intelligent brand and product matching
    online to provide the best price for the customer”. They are accordingly supporting
    multiple stakeholders here (including other companies as their clients, as well
    as the online shoppers (endusers/customers). In doing so they acknowledge how
    the AI-system is of strategic value if aligned with the organization and its trading
    partners (Melville, et. al., 2004), and ways of integrating the synchronous development
    of IT, algorithms and business models (Gomez-Uribe, 2015).


    eBiz also has a mission statement that is completely aligned with their AI-platform.
    This statement says that they deliver a complete and exact view of how all their
    client’s products are compare in price points with any competition on the online
    market. The comparison is data-driven, automatic, and their algorithms scrape
    and analyze the web on a daily basis.


    This allows online retailers to curate assortment, increase volume, growth and
    target specific strategic and tactical goals'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'in terms of pricing with full control saving vast amounts of hours using AI-technologies.


    # The eBiz AI-platform in action


    The AI-system developed by eBiz is a digital platform that their clients can use
    when building and developing their online webshops. The AI-modules runs in the
    background, and it scraps the web for competing products as to automatically adjust
    prices on the products their clients are selling over the web. At the current
    moment the platform has algorithms for data scraping and processing, and the system
    can act based on this (i.e. implement “intelligent pricing” for their clients).
    At the current moment the platform handles automatic and intelligent pricing of
    600.000 items (web shop products), and these adjustments are made continuously
    in relation to competitors pricing strategies, and in relation to a wide set of
    factors.


    The AI-system operates along a simple cycle of 1) input to the system (the e-retailers
    product feed), 2) scraping (of the web, and downloading of selected competitors
    products and prices, and 3) the processing of this data (to automatically adjust
    the e-retailers prices, and the further processing of this data as input to the
    e-retailers ERP systems).


    In implementing this cycle eBiz says that they enable their clients to 1) follow
    their competitors by tracking and matching comparable products, at the same time
    as their system supports 1) dynamic and intelligent pricing and rule setting (e.g.
    “Adjust my price to be higher or lower price, in'
  merge: -1
  img_proc: true
