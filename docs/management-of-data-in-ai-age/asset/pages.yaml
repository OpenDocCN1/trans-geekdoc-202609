- pgno: 85
  md: 'deep or generic.


    Learning is a key cognitive function of the human brain and the link to managerial
    performance. It is a process of acquiring or modifying knowledge, behaviors, skills,
    values, or preferences. The brain “learns” and the cerebrum is most important
    device for learning as it is here where higher-ordered functions like memory and
    reasoning occur. Each area of the cerebrum specializes in a function – sight,
    hearing, speech, touch, short-term memory, long-term memory, language and reasoning
    abilities are the most important for learning. Through a network of neurons, sensory
    information is transmitted by synapses along the neural pathway and stored temporarily
    in short-term memory, a volatile region of the brain that acts like a receiving
    center for the flood of sensory information we encounter in our daily lives Once
    processed in short-term memory, our brain’s neural pathways carry these memories
    to the structural core, where they are compared with existing memories and stored
    in our long-term memory, the vast repository of our life long experiences and
    the, prime point of reference within managerial behavior (Ford , 2011) (UCERI,
    OECD, 2008).


    Brain learning could be explicit or implicit. Explicit learning connotes conscious
    awareness and articulation of what is being learned. Implicit learning is without
    conscious access. (Roman F. Loonis, et al, October 2017).'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Learning could also be deep i.e. Models patterns in data as complex, mufti-
    layered networks it could also be “generic” building mathematical model based
    on sample data or ”training data”, in order to make predictions or decisions without
    being explicitly programmed to perform the task.


    # III. How does all of that translate into problem solving?


    Analysis provided above could lead to the hypothesis that problem solving is one
    of the core cognitive functions of the human brain. And a deep learning-like brain
    configuration guides the process.


    Problem solving is seen, then, as a higher level brain activity that connotes
    interaction with many other cognitive processes such as abstraction, searching,
    learning, decision making, inference, analysis, and synthesis. (Wang et al 2008).


    The brain performs this cognitive function when it seeks a solution for a given
    problem or a potential route to a goal. Problem solving can be perceived by the
    brain, then, as a learning and analysis process.'
