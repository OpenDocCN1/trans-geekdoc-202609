  md: '# • **AI in Recommendation systems**


    Retail companies are using the latest technologies i.e. artificial intelligence,
    machine learning to keep them ahead in the competitive market. These companies
    are utilizing recommendation systems on buying behavior of customers to increase
    the user interaction by gathering the details of their purchase preferences and
    enhance their shopping potential. Amazon.com makes use of recommendations on its
    website to gather the customer’s information regarding previous purchase, products
    viewed and accordingly it recommends the products to their users. It makes use
    of recommendation algorithm such as Collaborative filtering on item to item which
    gathers the information from the user purchase and compiles the list of recommendation
    from them so that the next time a user is thinking about any latest technology,
    the Amazon web page will suggest the latest device or gadget for its users. Another
    example is of Netflix which senses which movie or show is of your interest and
    you want to watch next.


    # • **AI in Agriculture**


    AI and Machine learning can benefit in the field of Agriculture to monitor the
    soil health to get information about its nutritional value and to understand the
    effects of seeds in different soils. Agriculture is making use of these technologies
    for in-field farming where cognitive computing plays a major role which will help
    the farmers in daily farming. In field of agriculture huge volume of'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'data is generated related to soil, pest infection which can be sensed by these
    cognitive solution and can help to improve yield [15].


    In agriculture, precision farming is the area gaining importance where images
    are captured through drone for in-depth analysis and scanning of field, monitoring
    of crops to generate real-time alerts to farmers to improve efficiency in farming.
    There are various implementation of AI in agriculture such as FarmBot, Blue River
    technology, Prospera. Farmbot was implemented in the year 2011 utilising precision
    farming technology for growing crops at own place. It helps for end to end farming
    from planting seeds to testing soil, detecting weeds, watering plants using open
    source software system. In Agriculture industry, the major concern is herbicides
    resistance which has been responsible for financial loss of worth $43 billion
    of American farmers. In response to this big financial loss, Blue River Technology
    has launched a weed spraying machine – The See and Spray robot as a solution to
    reduce the effect of chemicals on the crops. This robot utilizes AI tools, cameras,
    sensors to manage the field by the farmers in the way they want. This machine
    uses deep learning algorithms and is taught with huge data set of around 10 thousand
    different plant and it sprays in the field after testing the soil and the crops.


