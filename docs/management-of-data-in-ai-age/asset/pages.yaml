- pgno: 48
  md: 'solutions the aim “beyond the human” (Kaplan and Haenlein, 2019) and where
    AI can be used to do beyond human scale work tasks (e.g. collect, search, filter,
    analyze, generate and edit massive amounts of data). We see this in how AI is
    increasingly applied in search engines, in social media platforms, and in streaming
    services. AI is no longer only aimed at “the human-like”, but increasingly applied
    to do these large-scale tasks that no single human, or even a collection of humans
    could do (within a reasonable time). For instance, to filter and analyze millions
    of data points, thousands of times, over and over again, with high precision,
    and at high speed. It is this type of AI that we look at in this article.


    As recently formulated by Kaplan and Haenlein (2019) AI – “Artificial Intelligence”
    can be defined as *“a system’s ability to correctly interpret external data, to
    learn from such data, and to use those learnings to achieve specific goals and
    tasks through flexible adaptation”*. This definition is in line with the current
    large-scale use of AI, and we can also notice that “reason” is no longer an explicit
    term used in the definition of AI. Of course, it would have been a central notion
    if still aiming for “human-like” AI, but as we move beyond human capabilities
    it might be more interesting to focus on what AI can offer, beyond any comparison
    with the human mind. In short, AI might now be its own distinctive form of intelligence
    where analogies with the human brain is no longer fruitful or useful, but rather
    misleading in how to understand both how AI works, but maybe foremost what it
    can offer. AI might no longer be human-like, but might'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'instead offer an artificial intelligence that can be useful for tasks no humans
    can perform – individually or collectively.


    With a point of departure taken in this recent shift in the development of AI
    that we suggest that it is now time to also 1) shift our analytical lens – from
    the individual (and human-like) to the large-scale (and beyond human), to 2) to
    explore the kind of artificial intelligence that AI can offer today, and to 3)
    explore this from the perspective of AAI – Applied Artificial Intelligence.


    In this paper we do this exploration with a particular interest in understanding
    how *applied artificial intelligence* might be designed to support multiple stakeholders
    (in our case consumers and businesses), and how applied AI might work in the creation
    of new digital services for consumers, as well as how AI can be used as a core
    business component. Our turn to applied AI is motivated by the increasing adoption
    of AI to real-world problems, and studies that have most recently shown how AI
    technologies are becoming increasingly practically relevant (see e.g. Gomes et
    al., 2019 and Ågerfalk, 2020).


    In this article we present how AI has developed over the past few decades, and
    across three waves of developments, and we illustrated Applied Artificial Intelligence
    by presenting our e-Biz corp case where a global actor is now applying AI as a
    core component of their online business. We conclude this article with a set of
    recommendations for moving forward with Applied Artificial Intelligence, and we
    present the main'
