  md: 'the same were built using years of experience of these large corporations.
    All this means that using platforms provided by these large corporations, small
    businesses are helping themselves benefitting from the years of experience and
    AI development. Off-course, using these platforms comes with a price but this
    is far lesser than what it takes to build in-house or procuring from an AI vendor.


    # How can data science help small businesses?


    Small businesses have small data. Generally, it isn’t difficult to manually process
    the lesser quantity of data but making this data, how smaller it can be, work
    for one or more objectives at the same time may save time and efforts of the small
    businesses generally having small teams to focus on relatively more critical business
    processes.


    Having data analytics people or just having an understanding of data relevance
    and analysis can help small businesses get an edge in their market segments.


    # Small business functions having prospects for AI, machine learning and data
    science


    The AI based automation tools and data analytics can be used for real-business
    problems in marketing, sales, customer relations, billing & accounting, after
    sales customer experience etc. All these business functions are vital and pervasive
    in every small business and there are a number of large businesses providing AI
    powered support services for all these functions that small businesses may use.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Conclusion


    As the in-house development of AI based automation tools are over dependent on
    the availability of big data, small businesses may not have such large amounts
    of data to go for developing their own AI systems. Those small businesses who
    have established themselves in their niche market segments and have scaled to
    a step further can opt for procuring AI technologies from the AI vendors.


    And those small businesses that are in their infancy stages may use AI powered
    platforms of large service providers helping them adopt and use AI automation
    for their small businesses. It is also concluded here that successful adoption
    of AI automation depends on how effectively small businesses identify and analyze
    the data available with them or within the implemented AI system. AI and machine
    learning has to go more miles to reach the small businesses directly and the AI
    technologies need to be affordable for the small businesses for their adoption.


