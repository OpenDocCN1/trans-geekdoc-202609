- pgno: 66
  md: 'part of the business model it can both “run the business” (Holloway & Hand,
    1988) and at the same time serve the online customer.


    However, to make AI work also comes with some conditions and necessities. In our
    project we have focused on making it work for consumers, and as a core business
    component, by relying on the following simple model for applying AI in this context
    including the cycle of 1) monitoring, 2) acting/reacting, and 3) re-configuring.
    Here we briefly outline these three components:


    # 1) Monitoring


    The AI system we have focused on in this business case is configured to monitor
    changes online from the viewpoint of price changes for similar products. To make
    this work, the AI system is dependent on a set of variables that describe each
    product, and the system can then train its algorithms to constantly monitor these
    similar products online.


    # 2) Acting/reacting


    The AI system we have focused on can also act. Given any changes in the pricing
    of similar products online, the AI system can also take some actions. It can act/react
    on changes in the pricing of similar products, and it can instantly and dynamically
    adjust the prices of the online shops articles based on an analysis of how similar
    products are priced.


    # 3) Reconfiguring'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Not only can the AI system act and react on the data it collects through scraping
    of other websites, but since the AI system is also configured to train its underlying
    algorithms it can also adapt to changes (e.g. adopt to changing pricing strategies
    in the marked (e.g. “black Friday sales” or other campaigns).


    To successfully apply AI in a business context is about designing AI solutions
    that incorporate these three aspects in a continuous cycle. That is, it should
    not only be configured to monitor a particular data set, and be configured to
    act upon this data, but the true power comes from making use of AI’s capability
    of also training its algorithms to achieve higher precision, or its ability to
    constantly, at high speed, and with increased precision, adjust and reconfigure
    itself given changes in the data landscape it is set to monitor.


    Of course, there are also challenges associated with applying AI to real-world
    use contexts. In the research project reported in this article, which is specifically
    oriented towards applying AI in a business context, we have identified two such
    overarching challenges.


    The 1st challenge has to do with “*the risk of getting disconnected*” (Borgmann,
    1984). When we apply automatic technologies, and in this case even self-reconfiguring
    technologies we also introduce these as a mediator between ourselves and the task
    it autonomously executes. In the case of the eBiz business, there is no way to
    either do what the system does by hand, or even follow what the system does. It
    is too many subtasks being done, at too high speed for any'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'human to monitor. The loss of this ability to monitor how the system works
    implies a risk of also losing the understanding of how it does the work – it just
    works, and the process becomes black-boxed. In the eBiz case we have reported
    in this paper they deal with this challenge through in-house development of the
    AI system. This strategy forces them to constantly make sure that they understand
    what the system does, how it operates, and how it develops. Accordingly, it’s
    an active strategy that both continuously aligns the development of the AI-system
    with the development of their core business model, at the same time as it is a
    strategy that constantly makes sure that there is no disconnect between an understanding
    of their core business, and a close-up understanding of how their core business
    AI-system operates on their behalf.


    The 2ⁿᵈ challenge is about *the lack of transparency*. This challenge comes as
    an effect as the AI-solution scale to business level. With small-scale AI-solutions
    (e.g. if machine-learning is applied to a small data set to check for errors)
    it is possible to have an understanding of the data set, the algorithms, and the
    output from the system. When the data set grows, when the algorithms re-configure
    themselves, and when the complexity grows in terms of the sets of multiple variables
    that the system handles there is a good chance that the transparency is lost –
    here it is not about being disconnected as in the 1ˢᵗ challenge, but as a 2ⁿᵈ
    effect, being disconnected might also lead to a situation where it is hard to
    reestablish an understanding for how the AI-system works. In relation to this
    2ⁿᵈ challenge there is a whole strand of research on “explainable AI” (XAI). However,
    most of this'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'work is related to small-scale systems, and in relation to individuals. For
    the business we have studied it offers no solution here! (it is in fact rather
    pointless, and in fact impossible to monitor and make sense of the actions the
    AI system takes as it scrapes the web and adjusts 600.000 articles every day).
    Accordingly, this call for other solutions for how to review how the AI works.
    As formulated by Xu (2019):


    > > “Explainable AI (XAI) enables users to understand the algorithm and parameters
    used, which is intended to address the AI black-box problem. If a medical-diagnosis
    intelligent system predicts the likelihood of cancer based on a patient’s personal
    data, XAI should provide the reasons for the prediction to the patient through
    a UI. Previous research on XAI had mainly been done in two ways: visualization
    of ML [machine-learning] processes and explainable ML algorithms. However, these
    approaches may be biased in explaining how ML algorithms work and rely mainly
    on abstract visualization methods or statistical algorithms, which may further
    increase complexity.” (Wei Xu, 2019)


    As illustrated here, current XAI solutions are only offered at the level of the
    individual (as a “walk-through” XAI model, and there is an implicit assumption
    made here that the AI-system operates at the same pace as the individual so that
    he/she can monitor what the system does in a step-by-step fashion. That is not
    the case when it comes to the business AI-solution we have reported on in this
    article.


    Indeed, and when it comes to large-scale AI-system other examination models are
    needed. In our research collaboration'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'with the eBiz company we are exploring explanation models that offers explanations
    of the inner logic of the system, and descriptions of the decision model so that
    both customers and the eBiz company can examine a particular output from the system
    and see if it makes sense (i.e. if it corresponds to that explanation model).
    By focusing on these alternative solutions, we propose “examinable AI” as a complement
    to explainable AI, and we note that this might serve as a call for research aimed
    at resolving this 2\u207f\u1d48 challenge associated with black-boxed AI-system,
    and how to increase transparency on how these systems work in real use contexts.


    Before moving to the concluding section of this article we should also summarize
    a couple of lessons learnt during this case. In short, we think that we have provided
    a case that illustrates:


    +   1) ***AI as a background technology.*** During the 1\u02e2\u1d57 and 2\u207f\u1d48
    wave of AI developments the focus was very much on AI as a foreground technology.
    The focus was on developing an intelligence machine that we can interact with
    (e.g. the Eliza system, the DeepBlue chess playing system, or a robot). Now, AI
    operates in the background of our attention to provide better services. This is
    a radical change. Further, our case also illustrates:


    +   2) ***AI beyond human-like intelligence.*** During the 1\u02e2\u1d57 and 2\u207f\u1d48
    wave the focus was to a large extent on building a system that worked like the
    human brain. In the case we have reported here there is nothing human-like about
    this AI-system. It performs tasks no human could do, at a pace that'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'no human can compete with. As such, we illustrate a “beyond human-level” case
    of applied AI. Finally, our case also illustrates:


    3) **_AI as a core business component._** Existing approaches to AI views it as
    a technology or a “tool” to be developed. In the case we have reported in this
    article it is not possible to distinguish between the technology being developed
    and the business model. Instead, the AI-system is the core business, and it is
    through the in-house development of this system, and by running the system, that
    also the business develops. In short, this illustrates a 3rd wave AI-case where
    AI is being applied in society to work for its customers, as well as for the business
    developing this AI-system.


    # Moving Forward with Applied Artificial Intelligence!


    As we have now moved from the 1st and 2nd wave of Artificial Intelligence, towards
    the most recent 3rd wave of developments (Xu, 2019) several things have also changed
    over the last few decades. We now have AI technologies that can be applied to
    real-world problems, and there is no longer a single focus on developing AI for
    the purposing of getting a better understanding of the brain and how it works
    (and related high-level questions of what “intelligence” and “reason” is). Instead,
    the contemporary focus is much wider, and it includes questions on how to make
    use of AI in society, and questions concerning how it can be applied to real-world
    problems. With this as our point of departure we have in this article proposed
    the terms “Applied Artificial Intelligence” to speak to these questions of how
    to make use of this'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'technology. In this article we define Applied Artificial Intelligence (AAI)
    as “*the study, design, development, implementation and use of Artificial Intelligence
    technologies to address real-world problems*”.


    In focusing on applied AI, and what it can offer we have in this paper argued
    that it is time to leave the previous “human-like” models of AI behind, and redirect
    our focus on what today’s “beyond human level” AI systems can offer. With this
    as an important point of departure we have in this paper explicitly focused on
    how AI can work, at the level of a global business, as a core platform component,
    and as core business.


    As stated by Zook & Allen (2003) “*the most successful companies were able to
    consistently, profitably outgrow their rivals by developing a formula for pushing
    out the boundaries of their core businesses in predictable, repeatable ways*”.
    In the case we have presented in this article they are doing this expansion with
    and through AI. By aligning the development of their business model and the development
    of an AI system that perfectly reflect this business model they illustrate how
    AI can work as a core business component. Further, by having this business component
    installed, the system can provide them with realtime feedback on how the business
    performs. It can present analysis of the data the system already has, and since
    AI is to a large extend also a probability technology it can offer quite precise
    estimations of what will happen next.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'By focusing on a real-world business and how they have applied AI as a core
    business component we have in this article been able to illustrate “AI in action”.
    This means that we have in this article demonstrated a proof-of-concept of what
    Applied AI can look like at the business level. In doing so we also present this
    case as evidence of 3<sup>rd</sup> wave AI beyond speculations on AI as “the next
    big thing”. In relation to the statement made by Holloway and Hand (1988) we can
    now say for sure that “*AI is no longer an academic term, but a reality*”.


    In this article we have also presented a conceptual frame for businesses to think
    strategically about AI as a core business component. We have done so by presenting
    the implications and challenges that are associated with applying AI on a business
    level. For sure, the strategic business value of IT has been known for a long
    time (see e.g. Strassmann, 1990; Melville, et al., 2004). What we can add to this
    is that IT might not only work as a recourse that can support other structures
    and processes in the company, but it can also be a structure and process in the
    development of the core business model. In short, we have in this paper offered
    a complimentary perspective on the role of technology and in particular how AI
    might work as an applied technology, and as a core business component. This contribution
    is well-aligned with the perspective proposed by Rahwan, et al. (2019) who suggests
    that the machine behavior of AI needs to be studied empirically, i.e. to apply
    an applied perspective on AI.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Finally, and in adding to Xu’s (2019) definition of useful AI as “*an AI solution
    that can provide the functions required to satisfy target users’ needs in the
    valid usage scenarios of their work and life*” we would like to expand on this
    notion of “Useful AI”, and suggest that it needs to work, not only for users/consumers,
    but also for the businesses providing the service. In order to successfully apply
    AI to real-world problems it needs to work, for its users, and for those who provide
    digital services based on applied artificial intelligence.


