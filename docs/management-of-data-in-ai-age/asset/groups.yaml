  mdcn: "\n深入了解受众的口味、偏好、感受、兴趣和看法，进而有助于改善组织的客户服务和支持功能。\n\n语音分离是人工智能辅助自然语言处理的一项应用，有助于从其他来电者的混合声音中识别出目标来电者的声音，从而分别应答每位来电者。此外，组织还会分析客户的通话录音，以了解客户是高兴还是难过、其需求以及未来的要求[22]。\n\
    \n客户服务中相关的自然语言处理任务包括：\n\n- *语音识别* – 将口语转换为文本\n- *问答* – 用自然语言回答人类提出的问题\n- **声誉监测**\
    \ – 早期的商业组织仅限于利用内部数据库生成文本分析，以了解客户需求并改进商业策略。但随着改进型学习算法的发展，企业开始采用工具分析公共数据。虽然其中一些数据是结构化的且可直接分析（例如人口普查数据、股票价格），但大多数数据仍是非结构化的，尤其是以人类生成的文本形式存在，如新闻、博客文章、论坛、评论、报告以及\
    \ Twitter、Facebook 等社交媒体。这些来源包含大量尽管非结构化但关于竞争对手、客户和整个市场如何演变的有用信息。组织现在正利用这些信息来源进行声誉监测，识别其品牌和产品的提及情况，并判断何时应采取行动。\n\
    \n    声誉监测包括以下自然语言处理任务：\n\n    - *情感分析*，用于确定客户的态度、情绪状态、感受、判断或意图。这可以通过为文本赋予极性（正面、中性或负面）或尝试识别潜在的情绪（快乐、悲伤、平静、愤怒等）来实现。\n\
    \    - *共指消解*，将代词连接到正确的对象。例如，如果客户写道：“卖方那边有人打电话来问我是否喜欢我的新公寓。”我回答：“它太棒了。”在这里，重要的是要识别出“它”指的是公寓而不是那个人。简而言之，客户是在对产品给予正面反馈[]。\n\
    \n- **市场情报** – 商业市场深受各行业、利益相关者、政府和监管机构之间的市场知识和信息交流的影响。紧跟最新行业趋势和不断变化的标准至关重要。自然语言处理是一种有用的技术，可用于跟踪和监测市场情报报告，并提取必要信息，帮助组织制定关于其行业的新业务、市场、竞争对手、客户及其他重要细节的策略。\n\
    \n    有数十种工具可帮助企业家监测竞争对手。像 Zirra² 这样的自然语言处理驱动引擎简化了自动构建竞争格局的过程[23]。当 Zirra 分析某事物时，它会收集一份公司列表并按\
    \ 0 到 1 进行排名。该排名通过多模态语义场显示这些公司之间的关联紧密程度。Zirra 等算法解决方案通过扫描互联网上的文章并将数据输入到自然语言处理模块中来创建公司列表，该模块能够揭示公司之间的语义关系。\n\
    \n² www.zirra.com\n\n以上是自然语言处理的一些应用，这些应用将在未来被商业组织所见证。还有其他应用，例如广告投放、神经机器翻译、招聘工具与管理、监管合规、数据可视化、生物识别、机器人技术、流程自动化等。自然语言处理概念背后的系统本质上具有统计性质。要使这一概念从自然语言处理（NLP）发展到自然语言理解（NLU），让消费者能够看到并体验到与机器之间的人性化情感连接，是未来努力的方向。在过去十年中，信息技术行业已迈出信任的一步，深入挖掘了自然语言处理的各个方面。\n\
    \n商业组织已经发现、测试并实施了最有利的自然语言处理应用，以推进商业智能的发展。然而，该技术仍需要大量数据和流程来理解、分析并响应人类思维的需求。\n\n\
    ## G. 关于商业中人工智能的总结性评论\n\n从上述事实和数据可以推断，采用人工智能的企业未来有望看到生产率提高。通过简化以前需要人工数天才能完成的任务，并以新的方式将人和机器结合起来改进工作流程，可以衍生出新的能力。许多企业还相信，人工智能将加速和增强创新，从而创造新的就业机会和商业前景。一些人预计，更加个性化和更高质量的人工智能增强产品和服务将带来消费需求的增长。\n\
    \n与此同时，一个关键的争论问题是人工智能将导致岗位消失。例如，部署虚拟助手来增强客户支持可能会导致许多从事客户服务的人失业。\n\n尽管人工智能在商业中的使用正在增加，但人工智能和机器学习尚不足以有效部署到每一项业务运营中。虽然企业的许多方面可以实现自动化，也必然需要自动化，但需要判断、优先级排序和权衡取舍的任务仍然需要人类智能。\n\
    \n为了利用人工智能技术，企业将需要雇佣具有人工智能经验或具备分析和使用数据技能的人员，以将人类监督的需求与人工智能相结合。企业还需要计算能力和系统基础设施来支持人工智能驱动的产品和服务，并且需要平台来组织和整合其数据。建立这种基础设施可能成本高昂。\n\
    \n此外，人工智能收集的数据带来了另一个巨大挑战。企业如何保证所收集数据在正确性和可靠性方面的有效性？他们需要对其使用设置哪些限制？如何确认机器会按照预期执行人类的指令？\n\
    \n有人担心无意的偏见可能会进入人工智能算法或决策模型。企业需要建立强有力的控制措施以防止这种情况发生，并监测通过人工智能学习的系统。让利益相关者了解企业的监督机制，有助于建立利益相关者对企业可靠使用人工智能的信任。\n\
