    During the 1970s and 1980s there were lots of developments that set the next stage
    in the development of AI, including breakthroughs in technical research that increased
    CPU capacity, advancements in parallel distributed processing, and the development
    of artificial neural networks. Still, the focus was on different ways of creating
    models of the brain and to arrive at better models of human cognition. As noticed
    by Kaplan & Haenlein (2019), “a common way to define artificial intelligence is
    to do so by referencing human intelligence.”


    Along these lines Nicholas Negroponte, the founding father of the Architecture
    Machine Group at MIT, dedicated his 1970 book *The Architecture Machine*, which
    was a book that proposed a theory of interfaces for artificial intelligence, “to
    the first machine that can appreciate the gesture” (Vardouli & Touloumi, 2019).
    Again, the goal was to create the human-like intelligent machine. However, this
    recurring reference to the human, or the brain, was challenged as we moved forward
    from the early days of AI developments.


    In the 1990s, more advanced artificial neural networks were developed that could
    read the numbers on checks, but that was as far as they went. As stated by Miller
    (2019), these early machines had trouble finding patterns, an essential aspect
    of data analysis. The computers were still not powerful enough, and there was
    not enough data available to train the algorithms. Still, the 1990s mark an important
    shift in the development of AI – away from modeling the brain, and towards tasks
    that AI can perform, beyond the human level, and beyond basic research on how
    the brain works, and towards what AI can do (i.e. what we in this paper refer
    to as ‘applied artificial intelligence’).


    If we now map this development to the three waves of AI as proposed by Xu (2019),
    we can see how the 1st wave of AI lasted for approximately 20 years (1950s–1970s),
    and how it was mostly driven by academia with a focus on technological solutions,
    symbolism and connectionism. In moving forward, we can also see how the 2nd wave
    of AI (1980s–1990s) was still academia driven and technology oriented, and as
    indicated above there was a clear focus on speech recognition, machine translations,
    artificial neural networks, and research on pattern recognition. Still, it was
    not until the late 1990s that the focus started to shift towards the use of AI
    for different purposes, and according to Xu (2019), it was not until the beginning
    of the 2000s that we could see the beginning of a 3rd wave of AI (2006).


    With the 3rd wave of AI came an important shift – from being a research lab product,
    it started to become widely applied. As suggested by Xu (2019), it was a breakthrough
    in applications (including functional systems built on deep learning, speech recognition,
    pattern recognition, and big data) and it was enabled by high-performance computers.
    As such, it started to prove itself useful and it is increasingly applied to real-world
    problems.


    So, in a sense, and as I started this paper with the quote from Holloway and Hand
    (1988) about the breakthrough of AI, we can now with the 3rd wave of AI see how
    it is increasingly a concern related to how it should be applied. From being about
    technical questions (e.g. machine learning and algorithms for pattern recognition),
    to the more fundamental and philosophical questions (i.e. what is “intelligence”?
    And to what extent can machines be intelligent?), we can see how the AI field
    is shifting towards questions concerning different forms of AI, and if it should
    be human-like (and manifest itself as robots, avatars, conversation partners in
    different settings), or beyond-human-like forms (e.g. cloud-based AI solutions).


    The most recent developments that have followed from the shift to 3rd wave AI
    include calls for human-centered approaches to AI (Xu, 2019), a focus on ethical
    and responsible AI design and development (Dignum, 2019), and a concern for the
    social and societal impact of AI.


