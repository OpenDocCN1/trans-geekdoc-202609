    -   探索人工智能如今能提供何种人工智能；以及

    -   从应用人工智能（AAI）的视角来探索这一点。


    在本文中，我们进行这一探索时特别关注理解*应用人工智能*可能如何被设计来支持多个利益相关者（在我们的案例中即消费者和企业），应用人工智能如何在为消费者创造新数字服务方面发挥作用，以及人工智能如何被用作核心业务组件。我们转向应用人工智能，是因为人工智能越来越多地被应用于现实世界问题，且最近的研究显示出人工智能技术正变得越来越具有实际相关性（例如参见
    Gomes et al., 2019 和 Ågerfalk, 2020）。


    在本文中，我们介绍了人工智能在过去几十年间如何发展，以及其经历的三波发展浪潮，并通过展示我们的 e-Biz 公司（e-Biz corp）案例来说明应用人工智能——一家全球性企业目前将人工智能作为其在线业务的核心组成部分。我们以一组推进应用人工智能的建议来结束本文，并呈现主要


    基于对话的系统，该系统旨在模仿治疗师。


    在20世纪70年代和80年代，出现了许多为人工智能发展奠定下一阶段基础的发展，包括提高CPU容量的技术研究突破、并行分布式处理的进展，以及人工神经网络的发展。尽管如此，重点仍然是如何以不同方式创建大脑模型，以及如何获得更好的人类认知模型。正如
    Kaplan & Haenlein (2019) 所指出的，“定义人工智能的一种常见方式是参照人类智能。”


    沿着这些思路，麻省理工学院建筑机器小组的创始人尼古拉斯·尼葛洛庞帝（Nicholas Negroponte）将他1970年的著作*《建筑机器》*献给了“第一台能够理解手势的机器”，该书提出了人工智能界面理论（Vardouli
    & Touloumi, 2019）。同样，其目标是创造类人的智能机器。然而，随着我们从人工智能发展的早期阶段向前迈进，这种对人或大脑的反复参照受到了挑战。


    在20世纪90年代，人们开发出了更先进的人工神经网络，可以读取支票上的数字，但也仅此而已。正如 Miller (2019) 所述，这些早期机器在寻找模式方面存在困难，而模式发现是数据分析的一个基本方面。当时的计算机仍不够强大，也没有足够的数据来训练算法。尽管如此，20世纪90年代标志着人工智能发展的一个重要转变——从对大脑进行建模，转向人工智能可以执行的任务，超越人类水平，超越关于大脑运作方式的基础研究，转向人工智能能做什么（即我们在本文中所称的“应用人工智能”）。


    如果我们现在将这一发展与 Xu (2019) 提出的人工智能三波浪潮对应起来，我们可以看到，第一波人工智能持续了大约20年（20世纪50年代至70年代），且主要由学术界推动，重点关注技术解决方案、符号主义和联结主义。进一步看，我们还可以看到，第二波人工智能（20世纪80年代至90年代）仍然由学术界驱动并以技术为导向，如上所述，其明确侧重于语音识别、机器翻译、人工神经网络以及模式识别研究。不过，直到20世纪90年代末，焦点才开始转向将人工智能用于不同目的；根据
    Xu (2019) 的说法，直到21世纪初，我们才看到第三波人工智能（2006年）的开端。


    第三波人工智能带来了一个重要的转变——从研究实验室产品开始变得广泛应用。正如 Xu (2019) 所提出的，这是应用上的突破（包括基于深度学习、语音识别、模式识别和大数据构建的功能系统），并得益于高性能计算机。因此，它开始证明自身的有用性，并越来越多地被应用于现实世界的问题。


    因此，从某种意义上说，正如我在本文开头引用 Holloway 和 Hand (1988) 关于人工智能突破的论述一样，我们现在可以通过第三波人工智能看到，它越来越多地关注应如何应用的问题。从技术性问题（例如机器学习和模式识别算法），到更基础和哲学性的问题（即什么是“智能”？机器在多大程度上可以具有智能？），我们可以看到人工智能领域正在转向关于人工智能不同形式的问题，即它应该是类人的（并以机器人、化身、不同场景中的对话伙伴等形式呈现），还是超人类的形式（例如基于云的人工智能解决方案）。


    从转向第三波人工智能以来，最近的发展包括呼吁采用以人为中心的人工智能方法（Xu, 2019）、关注合乎伦理和负责任的人工智能设计与开发（Dignum, 2019），以及对人工智能社会和社群影响的关切。


    |  | 第一波（1950年代–1970年代） | 第二波（1980年代–1990年代） | 第三波（2006年–） |

    |---|---|---|---|

    | 技术主要进展 | 早期符号主义和联结主义学派、生产系统、知识推理、初步专家系统 | 语音识别和机器翻译中的统计模型、模式识别中的人工神经网络、专家系统
    | 深度学习在语音识别、模式识别、大数据、高性能计算机应用中的突破 |

    | 人类需求 | 未满足 | 未满足 | 开始提供有用且能真正解决问题的AI解决方案 |

    | 关注点 | 技术解决方案 | 技术解决方案 | 集成解决方案；伦理设计、技术增强、人因设计 |

    | 特征 | 学术驱动 | 学术驱动 | 技术增强与应用 + 以人为中心的方法 |


    *图1.* 人工智能的三波浪潮（来自 Xu, 2019）。


    要理解应用人工智能的社会、伦理和社群影响，研究其如何被应用至关重要。在此，我们通过关注一家大规模应用人工智能的公司来回应这一日益增长的需求——该公司将人工智能嵌入其覆盖数千名消费者的
    e-biz 平台开发中。通过这样做，我们顺应了关注人工智能能做什么（在此案例中，对消费者和企业而言）的日益增长的趋势，并呈现了他们在这一特定情境中应用人工智能技术时不得不面对的挑战。


    在进入这个应用于商业情境的第三波人工智能案例之前，我们首先考察当前对人工智能发展所采取的方法。在下一节中，我们概述现有方法，包括以机器为中心的方法、以人为中心的方法和以系统为中心的方法。我们认为这些方法已取得成功，但在关于人工智能应如何在现实情境中使用的问题上，或许还有第四种方法的空间——即采用应用人工智能的方法。


    ### 人工智能的三种方法——呼吁第四种人工智能方法？


    在介绍我们的商业案例之前，在讨论应用人工智能之前——不仅从“使用”的角度，即在这种意义上应用人工智能，而且要从“应用”作为一种特定人工智能方法的视角出发——我们应首先概述并讨论针对这一技术所采取的其他一系列方法。当然，在将“应用人工智能”作为一种独特方法提出之前（包括研究、设计、开发、实施和使用人工智能技术来解决现实-

