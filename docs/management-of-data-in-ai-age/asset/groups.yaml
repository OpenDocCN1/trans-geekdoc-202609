    农业信息学在发达国家得到最大程度的实践，但近年来，许多发展中国家甚至不发达国家也正从其产前和产后活动中获益 [7], [8], [24]。


    一个重要的事实是，世界各地许多农民以适当的方法和功能从事农业，然而仍有数百万人直接或间接地从事与农业相关的工作。在这种情况下，农业信息学可以通过使用 IT/计算相关组件在农业活动中发挥作用。农民必须面对各种挑战，如炎热、寒冷、洪水、天气、干旱、昆虫、害虫侵扰、农作物疾病等，而农业信息学在这里非常有效。农业信息学在营养系统、全球农业企业发展、生态等方面的应用也非常有效
    [30], [31]。因此，在更广泛的背景下，农业信息学可在以下方面发挥作用—


    - 产前和产后环节中包括产出系统在内的投入系统。

    - 天气预报系统相关事务。

    - 农作物收获。

    - 粮食安全和人人有粮。

    - 促进农业系统价值链的发展。

    - 改善农业系统并促进可持续增长。

    - 农产品营销、改善供应链系统、人力资源等。


    然而，农业信息学对于借助现代技术和工具实现健康的农业发展非常重要且必不可少；其中重要的一项是大数据，将在后续章节中介绍。


    ## 大数据概览与特征


    数据在任何地方都很重要且适用，无论是医疗保健部门、政府部门、私营或公共部门、园艺、管理、教育等，还是农业。由于各种活动中数据量不断增长，因此各种技术被用于科学的数据管理。大数据是作为一种对海量数据及相关方面进行管理的手段而发展起来的，它也有助于复杂数据管理；因此，它被称为大数据管理。这里还使用了不同的分析工具，因此也被称为数据分析或分析学
    [11], [16], [22]。分析在其他领域的应用催生了其他学科和领域，即—


    - 商业分析

    - 医疗保健分析

    - 医学分析

    - 营销分析

    - 政府分析

    - 学习分析等。


    就分析在农业中的应用而言，简称为农业分析。大数据一词于1990年出现，但近些年来，由于数据商业化，发生了巨大变化。


    商业、制造业等。有许多公司参与大数据分析，其中主要是大型跨国公司，如微软公司、Teradata 公司、SAP、EMC、HP、戴尔 [15], [20], [27]。


    最初只有私营组织参与大数据分析，但政府机构也逐渐采用了大数据及相关系统和服务。


    ## 问题与挑战：“V”的力量与大数据


    大数据因其出现和需求而在不同领域的应用不断增加。然而，大数据的重要性源于其特性（另见图3）—


    **数据量：** 它实际上是数据的数量，包括相似的内容和形式。


    **数据多样性：** 数据以各种格式出现，包括普通文本、图像、音频、视频内容等，这种多样性被视为复杂数据管理中的一个重要特征。


    ![](img/b7c8c2816c849efde3ab5fa1da0676f7_112_0.png)


    图 3：大数据的核心特征


    **数据可变性：** 在数据管理中，变量是一个重要量，因为数据是可变的。在大数据和数据分析中，必须处理各种不一致性（或一致性）。


    **数据真实性（质量）：** 在大数据中，数据质量对于获得完美的准确性和健康的应用处理非常重要。因此，质量被视为真实性。


    **数据速率：** 在数据分析中，速率也很重要，在这种情况下，数据速率是一个重要标准。


    ## 大数据在农业及相关领域的应用


    大数据与分析对于发展更好、更智能的农业系统非常重要且极具价值。人口不断增长、粮食需求增加、气候变化等，都直接和间接地推动大数据与分析及其他新兴技术在农业中的应用。在此，物联网设备和其他技术可以获取或收集数据，随后基于云计算的系统有助于数据的虚拟化，但所产生的大量数据可以通过大数据与分析系统来处理。这些与田地、土壤、植物和作物等相关的数据是实时获取的。然后，专家或分析师将大量多样的复杂数据整合到不同模型中，使其能够用于农业及相关领域。大数据与分析在农业领域的复合年增长率（CAGR）为16.2%。大数据与分析在农业中的市场规模也在不断增长。2018年为5.85亿美元，预计到2023年底将达到12.36亿美元。大数据与分析有许多应用领域。


    ### 作为应对人口增长的解决方案


    全球人口不断增长，这已成为粮食生产方面的重要挑战。在此背景下，各种组织、农业农场、行业、机构等正在朝着更好、更高产的农业食品、产品和产量方向良好发展。借助大数据，农民和其他利益相关者可以实时获取降雨模式、水循环、土壤状况、作物状况、肥料需求等方面的数据，这有助于生产高产的农业食品。


    这使他们能够做出明智的决策，例如种植什么作物以获得更高利润，以及何时收获。正确的决策最终会提高农场产量。使用数学建模有助于各种活动，因此在不同情境下也有助于农业发展。使用传感器收集数据在数据管理和正确决策方面很有价值。


    ### 农药的伦理使用


    大数据在农业中的应用也有助于农业系统的管理和治理。大数据结合基于人工智能的工具，有助于预测农药的使用。由于农药对土壤和农产品等总是有害的，因此大数据与分析有助于识别农药的实际需求、何时施用、如何施用以及施用多少。因此，这有助于管理农药使用，并在伦理上支持人类和社会
    [14], [22]。


    ### 优化农场设备


    大数据与分析也有助于发现和优化农场及相关设备。对于大型农场，使用大数据进行此类监控在不同情境下都是有益且健康的。这样，大数据与分析也适用于其他多样化的领域，如图4所示。


    ![](img/b7c8c2816c849efde3ab5fa1da0676f7_115_0.png)


    图 4：农业大数据对农业系统的影响


