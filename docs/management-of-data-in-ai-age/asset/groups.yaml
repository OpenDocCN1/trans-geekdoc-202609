    # G. Concluding Remarks on AI in Business


    From above mentioned facts and figures, it can be postulated that businesses that
    are adopting AI can expect to see increased productivity in future. New competences
    can be derived from streamlining tasks that previously took days to complete by
    people and improving work processes by pairing people and machines in new ways.
    Many businesses also believe that AI will accelerate and enhance innovation, thus
    creating new jobs and business perspectives. Some expect to see augmented consumer
    demand from more personalized and higher-quality AI-enhanced products and services.


    At the same time, it’s a critical issue of debate that AI will result in eliminating
    jobs. For instance, virtual assistants being deployed to enhance customer support
    could result in many people working in customer care lose their jobs.


    Even though, the use of AI in business is rising, but AI and machine learning
    are not yet effective enough to be deployed for every business operation. While
    there are many aspects of a business which can be automated, and necessarily be
    automated but tasks that require judgment, prioritization and trade-offs still
    require human intelligence.'
