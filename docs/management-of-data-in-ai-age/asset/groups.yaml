  mdcn: "\n学习也可以是深度的，即将数据中的模式建模为复杂的多层网络；也可以是“通用的”，即基于样本数据或“训练数据”构建数学模型，以便在无需显式编程执行任务的情况下做出预测或决策。\n\
    \n## III. 所有这一切如何转化为问题解决？\n\n上述分析可以得出这样一个假设：问题解决是人脑的核心认知功能之一。而类似深度学习的大脑配置则引导着这一过程。\n\
    \n因此，问题解决被视为一种更高层次的大脑活动，它意味着与许多其他认知过程相互作用，如抽象、搜索、学习、决策、推理、分析和综合（Wang et al., 2008）。\n\
    \n当大脑为一个给定问题寻找解决方案或为达成目标寻找潜在路径时，它就会执行这种认知功能。因此，问题解决可以被大脑视为一个学习和分析的过程。\n\n问题情境在许多情况下可能是结构化的或非结构化的、功能性的或多功能性的、概念性的或应用性的、短期或长期的、高风险或低风险的，等等。\n\
    \n人脑在寻找应对所面临的无数问题情境的答案时，是否会采用自己的深度学习版本？它求助于一种对记忆和学习的“管理”过程。记忆提供了编码、存储、保留以及随后回忆信息和过往经历的能力。大脑因此学习。这种学习取决于几个标准：从时间（长期和短期学习）到透明度（显性或隐性学习），再到分析深度（深度学习或通用学习）。\n\
    \n大脑的这些认知过程有助于问题解决。德鲁克（Drucker）的自我管理问题就是一个例证。\n\n## 参考文献\n\n- [1]. Schacter, D.L.\
