    speech recognition, pattern recognition, big data, high-performance computers
    |

    | Human needs | Not satisfied | Not satisfied | Starting to provide useful and
    real problem-solving AI solutions |

    | Focus | Technological solutions | Technological solutions | Integrated solutions;
    ethical design, technological enhancement, human factors design |

    | Characteristics | Academia driven | Academia driven | Technological enhancement
    and application + a human-centered approach |


