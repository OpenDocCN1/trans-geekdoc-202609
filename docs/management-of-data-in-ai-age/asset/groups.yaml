    ## The eBiz AI-platform in action


    The AI-system developed by eBiz is a digital platform that their clients can use
    when building and developing their online webshops. The AI-modules run in the
    background, and it scrapes the web for competing products as to automatically
    adjust prices on the products their clients are selling over the web. At the current
