    \ Cognitive Systems Research (2008).\n- [3]. LeCun, Y., Bengio, Y., Hinton, G.\
    \ 深度学习. Nature, 2015.\n- [4]. Goldstein, F., Levin, H. (1987). 《推理与问题解决能力障碍》.\
    \ 载于 M. Meier, A. Benton, and L. Diller.\n\n## 人工智能、机器学习和数据科学作为小企业业务自动化的迭代\n\n\
    Pooja Sharma  \n管理合伙人 – 业务自动化，SKS咨询与顾问公司，印度  \n\n## 摘要\n\n人工智能和机器学习作为自动化的两种迭代形式，都基于数据，无论数据是大还是小。数据越多，AI\
    \ 或机器学习工具就越有效；反之，对于另一种迭代，情况则相反。凭借更大的数据池，大型企业和跨国公司已经有效地构建、开发和采用了精炼的基于人工智能和机器学习的决策系统。\n\
    \n本章的核心论点是探讨手中只有少量数据的小企业，是否能够很好地使用和采用基于人工智能和机器学习的工具来进行日常业务运营。\n\n**关键词：** 面向小企业的人工智能、面向小企业的机器学习、数据科学、大数据\n\
    \n现代自动化工具正在利用人工智能和机器学习进行开发。AI 或机器学习工具的开发基础完全取决于数据的可用性和数量。我们拥有的数据越多，自动化工具就越有效。\n\
    \n现在，我们遇到了这样一个问题：仅有数据的可用性和数量是否是有效 AI 或机器学习工具的唯一基础？不完全是，但在很大程度上是。要训练一个基于 AI 的工具，我们需要越来越多的数据。这些数据需要从特定行业或商业组织中发生的各种流程和操作中获取。我们为什么在这里强调来自特定行业或商业组织的数据？答案在于数据相关性的概念，而这一概念又进一步基于业务单位的数据科学或分析能力的有效性。\n\
    \n接下来，本章讨论的主角是小企业。小企业显然拥有较少的产品/市场供给，通常在细分市场运营，因此手中只有少量数据，尤其是在企业初创阶段。即使是那些已经建立了业务存在和市场地位的小企业，它们的数据仍然很少。\n\
    \n少量数据可能不足以构建、开发和训练一个 AI 系统。此外，一家小企业可能完全没有某些业务流程的数据，而这些数据其他小企业可能有。大量小企业没有人力资源部门、法律合规部门以及其他大企业拥有的职能分部。小企业缺乏与所有业务流程相关的数据，或者只拥有少量数据，这一事实要求我们重新审视或重新思考：小企业是否仍然能够采用那些基本上基于大数据驱动\
    \ AI 系统的业务自动化工具。\n\n## AI 供应商与小企业\n\n显而易见，小企业手中的数据不足，加之其可能投入的资金有限，使得它们无法独立构建和开发自己的\
    \ AI 系统。数据较少和财务支出有限，阻碍了小企业内部基于 AI 的自动化工具的开发。\n\n但小企业仍然可以采用从 AI 供应商那里采购的基于 AI 的自动化工具。AI\
    \ 供应商是专注于其擅长行业领域的 AI 系统全职开发者。AI 供应商将从其合作的不同小企业的业务流程中汇聚少量数据，然后将收集到的数据进行聚合，为属于特定市场细分领域的所有企业构建和训练一个独立的\
    \ AI 系统。\n\n这样一来，即使一家小企业没有人力资源职能分部，它也可以从另一家小企业的人力资源部门的自动化数据中获益。从 AI 供应商那里采购的 AI\
    \ 系统，还可以帮助小企业在业务决策和流程中采用自动化，而无需投资于内部 AI 开发。\n\n## 这能解决 AI 采用问题吗？\n\n上述平台是利用这些大型企业多年的经验构建的。这一切意味着，通过使用这些大型企业提供的平台，小企业正在帮助自己，受益于多年的经验和\
    \ AI 开发。当然，使用这些平台是有代价的，但这远比内部构建或从 AI 供应商采购所需的花费要少得多。\n\n## 数据科学如何帮助小企业？\n\n小企业拥有的数据较少。通常，手动处理较少量的数据并不困难，但让这些数据——无论其规模多小——同时为一个或多个目标服务，可能会为那些通常团队较小的小企业节省时间和精力，使其能够专注于相对更关键的业务流程。\n\
    \n拥有数据分析人员，或者仅仅对数据相关性和分析有所了解，就能帮助小企业在各自的细分市场中获得优势。\n\n## 小企业中具有 AI、机器学习和数据科学应用前景的业务职能\n\
    \n基于 AI 的自动化工具和数据分析可以用于营销、销售、客户关系、计费与会计、售后客户体验等实际业务问题。所有这些业务职能在每家小企业中都是至关重要且普遍存在的，并且有许多大型企业为这些职能提供\
    \ AI 驱动的支持服务，小企业可以使用这些服务。\n\n"
