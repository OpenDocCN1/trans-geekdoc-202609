    ## Moving Forward with Applied Artificial Intelligence!


    As we have now moved from the 1st and 2nd wave of Artificial Intelligence, towards
    the most recent 3rd wave of developments (Xu, 2019) several things have also changed
    over the last few decades. We now have AI technologies that can be applied to
    real-world problems, and there is no longer a single focus on developing AI for
    the purpose of getting a better understanding of the brain and how it works (and
    related high-level questions of what “intelligence” and “reason” are). Instead,
    the contemporary focus is much wider, and it includes questions on how to make
    use of AI in society, and questions concerning how it can be applied to real-world
    problems. With this as our point of departure we have in this article proposed
    the term “Applied Artificial Intelligence” to speak to these questions of how
    to make use of this technology.


    In this article we define Applied Artificial Intelligence (AAI) as “the study,
    design, development, implementation and use of Artificial Intelligence technologies
    to address real-world problems”.


    In focusing on applied AI and what it can offer, we have in this paper argued
    that it is time to leave the previous “human-like” models of AI behind, and redirect
    our focus on what today’s “beyond human level” AI systems can offer. With this
    as an important point of departure we have in this paper explicitly focused on
    how AI can work, at the level of a global business, as a core platform component,
    and as core business.


    As stated by Zook & Allen (2003) “the most successful companies were able to consistently,
    profitably outgrow their rivals by developing a formula for pushing out the boundaries
    of their core businesses in predictable, repeatable ways”. In the case we have
    presented in this article they are doing this expansion with and through AI. By
    aligning the development of their business model and the development of an AI
    system that perfectly reflects this business model they illustrate how AI can
    work as a core business component. Further, by having this business component
    installed, the system can provide them with real-time feedback on how the business
    performs. It can present analysis of the data the system already has, and since
    AI is to a large extent also a probability technology it can offer quite precise
    estimations of what will happen next.


    By focusing on a real-world business and how they have applied AI as a core business
    component we have in this article been able to illustrate “AI in action”. This
    means that we have in this article demonstrated a proof-of-concept of what Applied
    AI can look like at the business level. In doing so we also present this case
    as evidence of 3rd wave AI beyond speculations on AI as “the next big thing”.
    In relation to the statement made by Holloway and Hand (1988) we can now say for
    sure that “AI is no longer an academic term, but a reality”.


    In this article we have also presented a conceptual frame for businesses to think
    strategically about AI as a core business component. We have done so by presenting
    the implications and challenges that are associated with applying AI on a business
    level. For sure, the strategic business value of IT has been known for a long
    time (see e.g. Strassmann, 1990; Melville, et al., 2004). What we can add to this
    is that IT might not only work as a resource that can support other structures
    and processes in the company, but it can also be a structure and process in the
    development of the core business model. In short, we have in this paper offered
    a complementary perspective on the role of technology and in particular how AI
    might work as an applied technology, and as a core business component. This contribution
    is well-aligned with the perspective proposed by Rahwan, et al. (2019) who suggests
    that the machine behavior of AI needs to be studied empirically, i.e. to apply
    an applied perspective on AI.


    Finally, and in adding to Xu’s (2019) definition of useful AI as “an AI solution
    that can provide the functions required to satisfy target users’ needs in the
    valid usage scenarios of their work and life”, we would like to expand on this
    notion of “Useful AI”, and suggest that it needs to work, not only for users/consumers,
    but also for the businesses providing the service. In order to successfully apply
    AI to real-world problems it needs to work, for its users, and for those who provide
    digital services based on applied artificial intelligence.


