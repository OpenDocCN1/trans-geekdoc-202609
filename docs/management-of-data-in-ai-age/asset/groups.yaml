    ## Does the Human Brain Resort to AI’s Deep Learning in Order to Solve Problems


    Prof. M S S El Namaki


    Dean, VU School of Management, Switzerland.

    Dean (Retired) Maastricht School of Management, MSM, The Netherlands.

    CEO, Association for Accreditation of International Business Education

    aaime.net, Dr.el.namaki@gmail.com


    ## I. The problem


    Problem solving is a daily occurrence in business and, also, in human brains.
    Businesses resort to a variety of modes in order to find an answer to these problems.
    Human brains adopt, also, a variety of measures to solve their own brand of problems.
    Artificial Intelligence technologies seem to have been extending a helping hand
    to business in the search for problem solving mechanisms. Machine learning and
    deep learning are currently recognized as prime modes for business insight and
    problem solving. Does the human brain possess competencies and instruments that
    could compare to the deep learning technologies adopted by AI?


    This will be the focus of the following article.


    The article is eclectic. It draws on concepts and frameworks from psychology,
    neurology and management. It starts with identifying the contours of problem solving
    seen through psychology and management eyes. It then explores the cognitive functions
    of the brain and the deep learning dimension of this cognition. Possible overlapping
    of the two processes, the managerial and the neurological, in the process of problem
    solving is then explored.


    The article draws on recent research on all three areas: psychology, neurology
    and strategic management.


    The article could contribute to a better understanding of the role of the human
    brain in advancing solutions to managerial problems. It could also produce tools
    supportive to the process of computational cognition.


    ## II. Key variables: problem solving, deep learning and brain cognition


    - **What is problem solving?**


    Problem solving is “a higher-order cognitive process that requires the modulation
    and control of more routine or fundamental skills” (Goldstein & Levin, 1987).
    It occurs if an organization, an individual or a system does not know how to proceed
    from a given state to a desired goal state. It starts with an idea, or a problem,
    and proceeds all the way to an end result.


    The concept is rather eclectic with roots in psychology and tentacles in philosophy,
    artificial intelligence, computer science, engineering, mathematics and medicine.


    A “problem-solving cycle” is a sequence of events that would lead to a solution.
    In this cycle one recognizes a problem, defines the problem, develops a strategy
    to solve the problem, organizes the pertinent knowledge, mobilizes required resources,
    conducts remedial action, monitors progress, and evaluates the solution (Schacter,
    D.L. 2009).


    - **What is deep learning?**


    Deep learning is a subset of machine learning. It is a process that involves neural
    networks that could learn, unsupervised, from unstructured or unlabeled data.


    Machine learning works with algorithms that detect patterns and learn how to make
    predictions. The process can be supervised, semi-supervised or unsupervised. In
    supervised learning an algorithm learns from labeled training data how to predict
    outcomes for unknown variables. In unsupervised learning unlabeled data lead to
    a model that works on its own to discover outcomes.


    Decision making, comprehension and production of language (Wang et al., 2008).


    ### a. Memory


    Memory is our ability to encode, store, retain and subsequently recall information
    and past experiences in the human brain. It can be thought of in general terms
    as the use of past experience to affect or influence current behavior. Memory
    is the sum total of what we remember, and gives us the capability to learn and
    adapt from previous experiences as well as to build relationships. It is the ability
    to remember past experiences, and the power or process of recalling to mind previously
    learned facts, experiences, impressions, skills and habits. It is the store of
    things learned and retained from our activity or experience, as evidenced by modification
    of structure or behavior, or by recall and recognition. In more physiological
    or neurological terms, memory is, at its simplest, a set of encoded neural connections
    in the brain. It is the recreation or reconstruction of past experiences by the
    synchronous firing of neurons that were involved in the original experience.


    Memory is related to but distinct from learning, which is the process by which
    we acquire knowledge of the world and modify our subsequent behavior. During learning,
    neurons that fire together to produce a particular experience are altered so that
    they have a tendency to fire together again. Thus, memory depends on learning
    because it stores and retrieves learned information. But learning also depends
    largely on memory as stored knowledge relates, by inference and association, to
    newly acquired knowledge.


    **Figure (2) Types of human memory**


    ![](img/b7c8c2816c849efde3ab5fa1da0676f7_84_0.png)


    *Source:* Types of Human Memory, July 8, 2020 the Human Memory 2010-2020


    ### b. Learning


    The brain learns.


    Brain learning processes could take different shapes depending on a process and
    the criterion. If the criterion is time then learning is long and short term but
    if the criterion is transparency then it is explicit or implicit and, finally
    if the criterion is depth of analysis learning could become either deep or generic.


    Learning is a key cognitive function of the human brain and the link to managerial
    performance. It is a process of acquiring or modifying knowledge, behaviors, skills,
    values, or preferences. The brain “learns” and the cerebrum is the most important
    device for learning as it is here where higher-ordered functions like memory and
    reasoning occur. Each area of the cerebrum specializes in a function – sight,
    hearing, speech, touch, short-term memory, long-term memory, language and reasoning
    abilities are the most important for learning. Through a network of neurons, sensory
    information is transmitted by synapses along the neural pathway and stored temporarily
    in short-term memory, a volatile region of the brain that acts like a receiving
    center for the flood of sensory information we encounter in our daily lives. Once
    processed in short-term memory, our brain’s neural pathways carry these memories
    to the structural core, where they are compared with existing memories and stored
    in our long-term memory, the vast repository of our lifelong experiences and the
    prime point of reference within managerial behavior (Ford, 2011) (UCERI, OECD,
    2008).


    Brain learning could be explicit or implicit. Explicit learning connotes conscious
    awareness and articulation of what is being learned. Implicit learning is without
    conscious access (Roman F. Loonis, et al., October 2017).

