    tremendous amount of data, Gartner developed the ‘3V model’ that characterizes
    big data in context to three attributes:


    > “Big Data is high-volume, high-velocity, and/or high-variety information assets
    that demand cost-effective, innovative forms of information processing that enable
    enhanced insight, decision making, and process automation.”


    Thus, the term Big data analytics (BDA) was coined to better express the potential
    of Big data in examining large amounts of data to reveal hidden patterns, trends,
    correlations, opportunities and other useful analysis. That, in turn, results
    in smarter business moves, more efficient and effective operations, increased
    profitability and sustainability along with higher customer satisfaction. This
    awareness of trends in the data pool and advantage of hidden information has completely
    redefined the business moves in this digital epoch which can be overwhelming to
    markets and organizations around the globe [21].


    Furthermore, the advances in the field of AI have taken the potential of BDA to
    a next level in businesses. The amalgamation of AI and BDA has resulted in framing
    innovative business models. In order to make effective futuristic decisions and
    predictions in businesses using AI, Big data plays a significant role. The efficient
    use of AI depends highly on the scope and quality of the available data used for
    training and testing algorithms [3]. Due to the momentum generated by AI and BDA,
    data has now become a valued commodity in businesses and organizations are competing
    to gather the most remunerative data pool. Moreover, with the advancements in
    AI and data mining, it’s now possible to collect and store data generated by users
    and customers efficiently [1].


    For instance, in order to predict the customer churn Moz used AI based deep learning
    neural networks for analyzing customer actions and behaviors. Efficient business
    insights were collected based on the history of actions performed by customers
    to decrease churn among existing customers, which otherwise could have impeded
    the company growth [1].


    The interplay between BDA and AI in view of businesses has also paved the way
    to the collection of data from the physical environment. In contrast to earlier
    online data collection techniques based on search queries, orders placed or purchased,
    clicks made by customers, many retail companies are now looking forward to gathering
    data offline as well for efficient decision making.


    For instance, Amazon has incorporated corporate surveillance strategies in grocery
    stores to collect data related to customer preferences and behaviors. Actuators
    and advanced sensors have been installed in stores to accomplish offline data
    collection tasks. Furthermore, Internet of Things (IoT) based tools, Drones, and
    AI-based personal assistants are being used to transform customer actions into
    valuable data. This collected data acts as a driving force behind the price-setting
    algorithms that incorporates responses as per customer demands and reacts accordingly
    [1].


    The potential showcased by AI and Big Data to generate new insights to facilitate
    product, process, and business innovations have made the adaptation of these technologies,
    a business priority.


    ## D. Machine Learning in Business


    Machine Learning is a subset of AI that incorporates the capability of automatic
    identification and detection of patterns, relationships, correlations and trends
    in the given data. Once these relationships and patterns are identified, they
    are further used to make assumptions about the behavior of new patterns. Essentially,
    it’s comparable to the way how humans learn, think and derive conclusions on the
    basis of regular experiences gained by interacting with environment and people.
    Humans then use these derived conclusions to deal with new situations [6].


    The rise of Artificial Intelligence, in this era, has marked an unprecedented
    boom in application of Machine Learning (ML) techniques in numerous fields which
    include healthcare, banking, automobile, financial sector, manufacturing, retail
    etc. Although ML techniques have been known to be operating from quite a long
    time but due to recent technological advancements their use has become widespread
    in the business areas where it was limited previously. Even the enterprises that
    were not using ML at all due to higher implementation costs and lack of relevant
    manpower are also adapting ML based solutions [12].


    Organizations dealing with retail business are using ML techniques to make analysis
    of purchase histories of the customers to understand their interests, demands
    and affordability to generate personalized product recommendations for the next
    purchase [1]. Another application of ML in business is target marketing wherein
    based on the information provided like gender, income, age, browsing history,
    purchase history, locations etc., the system will predict whether the concerned
    person is interested in a particular product or not. Based on these predictions,
    marketing department makes decisions accordingly whether to consider a person
    for promotional offers or not [6].


    Deep Learning, a variant of Machine Learning, has gained enough popularity in
    recent years due to its potential to embody hierarchical processing using different
    layers of architecture. Moreover, deep learning has been identified to be best
    suited for high dimensional and dynamical data handling used in Bioinformatics,
    vision and speech recognition and sensor web.


    Even deep learning has been found to work miraculously in e-commerce business
    for personalized product recommendations. The deep learning algorithm deployed
    in an e-commerce website traces the customer’s journey and activities. Based on
    the specifications of products viewed, duration of time spent on viewing each
    product, the customer activity before and after viewing each product, time of
    the day when the customer logged into the e-commerce website, his location, gender
    and other relevant factors, the e-commerce website then offers the customer personalized
    purchase option that would appeal the customer ultimately. Thus, deep learning
    is considered to create more opportunities for improved business conversion rate
    and eventually helps to improve brand image by targeting customers with personalized
    content.


