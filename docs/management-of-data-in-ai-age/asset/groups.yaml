    ## 农业领域中的大数据与数据分析：迈向可持续和智能农业部门发展


    P. K. Paul¹#, Anil Bhuimali², R.R. Sinha³, K.S. Tiwary⁴, Pappachan Baby⁵, R. Rajesh⁶


    ¹ 印度赖根杰大学计算机与信息科学系MCIS执行主任，信息科学家（代理）.

    ² 印度西孟加拉邦赖根杰大学副校长.

    ³ 汤加王国英联邦职业大学副校长（亚洲区）.

    ⁴ 印度西孟加拉邦赖根杰大学理学院与管理学院院长.

    ⁵ 多米尼克联邦博尔斯布里奇大学亚洲区负责人.

    ⁶ 印度泰米尔纳德邦坎亚库马里罗希尼工程技术学院（RCET）校长.


    #pkpaul.infotech@gmail.com


    ### 摘要


    农业对每个人来说都变得重要，因为它在日常生活中具有重要意义。种植和耕作在我们的生活中最为重要和宝贵，因为这是我们所有人所需要的。此外，必须拥有更健康的农业系统，而在这方面，农业信息学发挥着主导作用。在健康和现代农业系统及发展中，适当的机制非常重要，为此各种举措和方法都是有用且能促进发展的。在支持各种技术方面的快速变化和增长帮助实现了农业生产和系统的现代化，如基因工程和技术、计算


    *农业部门发展*本质上是理论性的，旨在实现以下目标和议程（但不限于）——


    - 了解农业信息学的基础知识，包括其起源、演变和发展。

    - 了解农业信息学及其在先进农业系统运作中的应用。

    - 了解新兴的农业信息学作为学术项目在国内和国际上的发展情况。

    - 了解农业信息学及相关领域中新兴的信息技术。

    - 了解大数据及其相关领域，并简要了解其特点和特征。

    - 挖掘大数据与分析在农业及类似领域中的新兴应用。

    - 探究大数据与分析在农业信息学中的应用，以及其中的问题、挑战和潜力。


    ### 方法


    这项题为“农业领域中的大数据与数据分析：*迈向可持续和智能农业部门发展*”的工作是一篇理论性论文，本质上是跨学科的。本文参考了信息技术、农业科学、环境等领域的各种已发表的二手资料。此外，还收集、分析了各种一手资料，并在本工作中进一步报告。为了解农业信息学的真实状况，本文分析并整合了提供服务的企业和大学的各种网站，包括政府项目报告等。


    ### 引言


    农业信息学涉及农业科学和信息科学。因此，农业信息学是一个跨学科领域。此外，“信息科学”和“农业科学”也是跨学科且非常广泛的领域。农业信息学不仅正在迅速发展以支持农业系统，还支持环境系统。农业信息学致力于提高农业信息学的生产率，包括生态系统[1]、[12]、[26]。在农业生产前活动中，农业信息学被广泛应用；此外，在农业工作的生产后阶段，农业信息学也同样有效和有用。农业信息学在发展农业实践中是必需的，并且已经开发出先进和高产的农业系统。新兴的智慧农业在许多方面依赖于更好和健康的农业信息学实践。由于农业信息学的重要性，国际上许多大学已经启动了农业信息学的教育项目和研究项目。在农业信息学的发展过程中，来自计算/信息相关领域的各个分支发挥着主导作用，其中重要的分支如下——


    - 信息技术

    - 信息科学

    - 信息系统

    - 计算机科学

    - 计算/计算机应用

    - 计算机科学与工程等


    农业信息学正在迅速发展，并且也与工程、技术、科学、管理和经济研究相关联（另见图1）。由于它是一门应用科学，农业信息学使用各种程序、方法、工具和原则来改善农业系统，例如各种类型的作物、植物、动物等。农业实践是定居人类文明的一部分，约在10.5万年前发展起来。大约1.15万年前，雏形农业开始出现，而雏形动物养殖（猪、羊、牛等）大约在1万年前开始。在国际上，各地区都从事农业。今天的种植和农业涉及各种类型的植物、树木、种子、作物、家畜和化学品等[4]、[10]、[129]。


    甚至化肥、皮革、糖、酒精、棉花等也被视为农业信息学的一部分。与农业相关的不同领域和区域，以及农业信息学，如图1所述，可应用于不同领域。


    国际上已经启动了各种与农业信息学及其相关分支相关的学术项目，例如——


    - 农业信息系统

    - 农业信息技术

    - 农业计算

    - 智慧农业

    - 数字农业等[6]、[19]、[28]


    农业信息学正在成为一个研究领域，其实践也是如此，但在所有地区和区域的实际应用中存在局限性，因此非常需要不同利益相关者的支持，即政府支持、非政府组织、社会团体等。此外，与农业信息学相关的利益相关者也在增加，但主要包括——


