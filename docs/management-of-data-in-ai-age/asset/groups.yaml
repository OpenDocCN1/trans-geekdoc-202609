    \n## 应用人工智能——让AI作为核心业务组成部分为消费者服务\n\nMikael Wiberg，博士，教授  \n瑞典于默奥大学信息学系，901 87\
    \ 于默奥，瑞典  \nmikael.wiberg@umu.se  \n+46 (0)70 662 10 70\n\n### 摘要\n\n人工智能（AI）如今正迅速应用于我们的社会。尽管自20世纪50年代中期以来，关于AI在社会层面的使用和适用性的突破实际上已被反复宣告，但如今这一说法比以往任何时候都更真切。正如最近所公认的那样，经过三次发展浪潮，AI如今终于离开了研究实验室，进入了真实世界的应用场景。因此，随着AI现在日益广泛地得到应用，我们认为现在是时候解决与“应用人工智能”（AAI）相关的问题了。在本文中，我们提出这一术语，并将其定义为：研究、设计、开发、实施和应用人工智能技术来解决现实世界问题。在本文中，我们介绍了AI在过去几十年间跨越三次发展浪潮的发展历程，并通过展示我们的e-Biz\
    \ Corp案例来说明应用人工智能——在该案例中，一家全球性企业正在将AI作为其在线业务的核心组成部分。最后，我们为推进应用人工智能提出了一系列建议，并展示了我们的工作对日益增长的关于如何利用AI的研究所做出的主要贡献。\n\
    \n**关键词：** AI，人工智能，应用人工智能，核心业务\n\n### 人工智能在社会中的突破\n\n*“人工智能不再是一个学术术语，而是一个现实”*。这句话在今天也可能说得出来，鉴于当前围绕AI不断升级的热潮。然而，它实际上是由Holloway和Hand（1988）在他们近30年前发表于《Business\
    \ Horizons》的文章中提出的。尽管如此，关于AI大规模、现实世界突破的这一说法，在2020年的今天也同样适用。从历史的角度回顾，关于人工智能（AI）在社会层面广泛突破的概念验证，在过去几十年里——从20世纪50年代中期至今——一直是围绕该技术发展的反复承诺和讯息（参见例如Turing,\
    \ 1950; Weizenbaum, 1966; Makridakis, S., 2017）。正如Xu（2019）所阐述的那样，我们现在已经处于AI的第三次浪潮中，而在AI技术发展的这三次浪潮中，关于AI的承诺每一次都在重复。\n\
    \n尽管如此，Holloway和Hand（1988）所阐述的关于AI突破的这一说法，如今或许比以往任何时候都更真实。正如Xu（2019）指出的，这第三次AI浪潮的特点在于技术增强以及AI解决方案在社会中的部署和使用，而第一次和第二次浪潮在很大程度上是由学术界驱动的。简而言之，AI如今正越来越多地应用于社会层面。\n\
    \n因此，随着AI如今日益广泛地应用，我们认为现在是时候解决与“应用人工智能”（AAI）相关的问题，并将关注的焦点从使AI作为一种技术得以运作的技术问题，扩展到使其在应用和实施背景下发挥作用。以此为出发点，我们提出“应用人工智能”（AAI）这一术语，并将其定义为*研究、设计、开发、实施和应用人工智能技术来解决现实世界问题*。在本文中，我们提出这一术语，是为了超越围绕AI领域的技术发展，并将我们的关注点重新导向：当AI在现实环境中日益广泛地应用时，这项技术如今能为消费者和企业带来什么。\n\
    \nAI的发展一方面由技术进步驱动，包括机器学习、模式识别和神经网络的发展（例如Gilio, 1995）；另一方面则由关于AI下一步应用前景的愿景和承诺所驱动（Xu,\
    \ 2019）。在这些发展周期中，AI的突破是一个反复出现的主题，周围环绕着对不久将来的承诺（参见例如Makridakis, 2017; Kaplan &\
    \ Haenlein, 2020），同时也伴随着怀疑和恐惧（参见例如Clark, 2003）。\n\n以“超越人类”为目标的AI解决方案（Kaplan和Haenlein,\
    \ 2019），以及AI可被用于完成超越人类规模的工作任务（例如收集、搜索、过滤、分析、生成和编辑海量数据）。我们可以在搜索引擎、社交媒体平台和流媒体服务中看到AI的日益广泛应用。AI不再仅仅以“类人”为目标，而是越来越多地用于完成那些单个人类甚至一群人无法在合理时间内完成的大规模任务。例如，以高精度、高速度反复过滤和分析数百万个数据点数千次。正是这类AI是我们本文关注的焦点。\n\
    \n正如Kaplan和Haenlein（2019）最近所阐述的，AI——“人工智能”——可以被定义为*“系统正确解释外部数据、从这些数据中学习，并通过灵活适应运用所学知识来实现特定目标和任务的能力”*。这一定义与当前AI的大规模使用是一致的，我们还可以注意到，“推理”已不再是AI定义中的明确术语。当然，如果仍然以“类人”AI为目标，它或许仍是一个核心概念，但当我们超越人类能力时，更有趣的或许是关注AI能提供什么，超越与人类心智的任何比较。简而言之，AI现在可能已经成为一种独特的智能形式，与人类大脑的类比不再富有成效或有用，反而会误导人们对AI工作原理的理解，但也许最重要的是会误导人们对AI能提供什么的理解。AI也许不再类人，但可能\n"
