    +   - **Feature selection**: Always select a subset of features by employing **recursive
    feature elimination** (**RFE**)/RFE-**cross validation** (**CV**) or **Least Absolute
    Shrinkage and Selection Operator** (**LASSO**) technique for feature selection
    which will reduce the probability of multicollinearity among the features.

