    # Question 16: Can you explain the elbow method for selecting the optimal number
    of clusters in k-means?


    **Answer**: The elbow method is an approach that helps you to decide on the value
    of K in k-means clustering that is the number we want to have our clusters.


    Here is how it works:


    +   - **Compute k-means for different K values**: This requires applying k-means
    clustering for a number of K values, which usually starts from 1 and then adds
    an increment.

    +   - **Calculate within-cluster sum of squares (Inertia)**: For each calculated
    K value, find the within-cluster sum of squares also known as the inertia, this
    is the sum of the squared Euclidean distances from all data points inside a cluster
    to their cluster centroid.

    +   - **Plot the elbow curve**: Graph the inertia values on the X-axis and the
    K values on the Y-axis and obtain a line graph.

    +   - **Identify the elbow point**: Identify when the curve of the inertia starts
    to level off and then divide the number by two: This is the elbow point. They
    peak at the elbow point, and these are the most suitable number of clusters that
    should be used.

    +   - **Select K**: Find out the value of K at the point where the rate of change
    of the coherence index is at the minimum; this is the best value of K. This value
    is a trade-off between inertial or compacting the clusters too much, thus creating
    many of them and the other trying to avoid overfitting by creating too many clusters.'
