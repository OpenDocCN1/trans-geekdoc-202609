    # Question 10: Discuss the trade-offs between parametric and non-parametric time
    series models. When would you choose one over the other?


    Answer: Let us first take a look at the following features of the parametric time
    series models:


    +   - Advantages:

    +     - **Efficiency**: When the conditions of parametric models are complied
    with on the basis of the particularities of the time series data, then parametric
    models are more efficient.

    +     - **Parameter interpretability**: The parameters of a parametric model are
    often more interpretable and give information about the processes behind it.

    +   - Trade-offs:

    +     - **Assumption sensitivity**: Parametric models have certain assumptions
    regarding the parameters of the data distribution. We see that if these assumptions
    are violated, then performance of the model reduces.

    +     - **Limited flexibility**: In situations where one wants to estimate a non-linear
    association or clear deviations from specific distributional assumptions, such
    assumptions used in parametric approaches may provide a relatively poor approximation.

    +   - When to choose:

