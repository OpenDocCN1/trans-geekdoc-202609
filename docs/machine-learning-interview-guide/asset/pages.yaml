    # Question 10: How does k-means deal with high-dimensional data?


    **Answer**: K-means clustering can be used on data of high-dimensionality; however,
    it may face certain difficulties because of the curse of dimensionality.


    Here is how k-means deals with high-dimensional data:


    +   - **Euclidean distance**: K-means uses Euclidean distance as the distance
    metric by default, however, as the dimensionality of space increases, the distances
