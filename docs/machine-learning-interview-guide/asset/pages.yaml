    **Answer**: Heteroscedasticity, on the other hand, occurs when the variance of
    the residuals varies across levels of the predictor variables, meaning that the
    spread of errors is not constant. The rationale behind this cannot be understood
    because the way that variability in residuals alters with the compound predictor
    values is systematic. We see it as, when the model is a normal **quantile-quantile
    (QQ)** plot, and in the residual plot, it has a funnel shape.


    Impact on model predictions:


    +   - **Biased estimates**: Alters the coefficient estimates systematically in
    a direction favored by the correlated predictor to the logarithm of the link function,
    and also increases the standard errors.

    +   - **Inefficient predictions**: Breaks one of the most important assumptions,
    thus making predictions unusably incompetent.

    +   - **Incorrect inference**: This can lead to wrong decisions in hypothesis
    testing as well as in confidence intervals.

    +   - **Suboptimal prediction intervals**: Usually, the prediction intervals could
    be rather wide, with an impact to the evaluation of the prediction uncertainty.


    It is of paramount importance to deal with the condition of heteroscedasticity
    to warrant reliable regression equations and forecasts.


