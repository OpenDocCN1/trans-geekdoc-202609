    # Question 6: What is the significance of the residual plot in assessing the goodness
    of fit for a regression model?


    **Answer**: In statistics there is a graphical tool called **residual plot**;
    its goal is to check the fitness of the regression model. In it, the difference
    between the observed data and the expected data or the mathematical model forecast
    (residuals) are plotted on the vertical axis, while on the horizontal axis, the
    independent variable values or the fitted value is plotted.


    Essentially, the role played by the residual plot is based on the fact that patterns
    or trends present in the residuals are easily discernible. Speaking about the
    perfect model, the residuals should be randomly located around the horizontal
    axis and should not show any systematic behavior. It is also recommended to look
    at the residual plot, and if there is a curve, a funnel shape, or a systematic
    increase or decrease in the values, this may mean that the model used is not sufficient
    in explaining the relationship between the variables.'
