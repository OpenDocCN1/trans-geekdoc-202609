    # **Question 8: What is the concept of a decision boundary in KNN, and how does
    it change with different values of K?**


    **Answer:** The decision function of KNN is the boundary that distinguishes the
    area of one class from another in the feature space. It indicates the area where
    it is possible to observe the switch of classes by the algorithm. The idea of
    decision boundary is very essential when explaining how KNN gives new data points
    a classification.


    How decision boundary changes with different values of k:


    +   - **Small k (For example, K = 1 or 3):**

    +     - The decision boundaries are more staircase-like and are closer to the
    data.

    +     - The model learns from the raw data for every subject, and the decision
    boundary can learn intricate features and anomalies of the dataset.

    +     - Prone to overfitting and could be affected by noise in the dataset.

    +   - **Large k (For example, K = 20 or more):**

    +     - The decision boundaries become less abrupt and less dependent on the properties
    in the local areas of the data space.

    +     - The strength of individual measurements is reduced and, therefore, develop
    a common model.

    +     - Improving the generalization performance since it is less sensitive to
    noise and outliers and is more resistant to overfitting.'
