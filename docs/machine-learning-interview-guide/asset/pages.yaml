    # Question 4: What is the role of the cost parameter (C) in SVR, and how does
    it affect the trade-off between model bias and variance?


    **Answer**: the regularization parameter, also known as the **cost parameter**
    and denoted as C in SVR, determines the level of model bias and variance. Specifically:


    +   - **Role of C**: In SVR, C regulates the penalty for training errors. An increase
    in the C values yields better fitness to the training data, hence trading bias
    for a larger amount of variance. Lower C values are preferred where a wider margin
    is employed, which may increase the level of bias but reduce the degree of variation.

    +   - The trade-off between bias and variance:

    +     - **High C values**: A smaller margin, closer to training data points, low
    bias, high variance, high possibility of over fitting.

    +     - **Low C values**: A wider margin takes a wider region around it rather
    than a very narrow one. A higher bias but lower variance will not be as easily
    overfit.


    C is the decision bias and variance, that in almost all model selection, is arrived
    at based on the over fitting problem like cross-validation.


