    to convert these sums into probabilities.


    +   - **Softmax function**: The softmax function converts the weighted sum into
    probabilities and the probabilities of each class of examples sum to 1. The probability
    of each class is stored in the vector at the specific position as the index of
    the class.

    +   - **Prediction**: The class with the maximum probability is considered as
    the output for the given set of features.

    +   - **Training**: The preceding model is learnt in a manner such as maximum
