    Answer: The advantages of using a moving average for time series analysis are:


    +   • **Smoothing**: This, in turn, eliminates most of the noise and oscillations
    in the data, which might hinder one in identifying the trends.


    +   • **Trend identification**: They are used in making it easier to identify
    long-term trends, since most of the short-term movements are eliminated.


    +   • **Signal generation**: moving averages can act as a kind of signal in trading
    or decision-making processes or events, for example, by crossing over.


    +   • **Forecasting**: They may be utilized for predicting the actual future figures
    by normally establishing the trend of the past data, thus coming up with the expected
    future values.


