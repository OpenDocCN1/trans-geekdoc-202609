    classes.


    +   - **Increased sensitivity to noise**: Signals in high dimensions are worst
    because they hold dark densely with noise and outliers easily. Randomness in the
    data results in noise that poses a greater threat to the accuracy of distance
    calculations and, therefore, can adversely affect neighbor selection and, consequently,
    the quality of forecasts.

    +   - **Loss of locality**: The locality is a prominent feature of kernels in
    which the proximity in the feature space translates into similarity, or vice versa;
    however, it becomes hopeless when the points are in high-dimensional space. Locations
    that are close, in the sense of, that is, Euclidean distance, may have weak relationships,
    which cause ineffectual forecasts.


    Due to high-dimensionality, the practitioners opted to perform the dimensionality
    reduction method or feature selection so as to come up with KNN with minimal or
    sufficient features to improve or optimize the results. Furthermore, the high-dimensional
    space algorithms the approximate nearest neighbor search methods, kd-trees, ball
    trees, or **locality-sensitive hashing (LSH)** might be used to make KNN more
    efficient in those scenarios.


