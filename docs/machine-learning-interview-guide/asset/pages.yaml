    # Question 2: How is the initial centroid position chosen in k-means clustering?


    **Answer**: In k-means clustering, the initial positions of the centroids are
    usually randomly placed anywhere in the feature space. This means that the algorithm
    chooses the initial centroids for the K clusters from the given dataset by either
    choosing random data points from the dataset or using other methods, such as the
    k-means++ initialization, to ensure that the initial centroids chosen to cover
    as many data points in the dataset as possible to increase on the rate of convergence
    and the quality of clustering. This process of choosing initial centroids can
    affect the result in the end, thus, when performing the k-means algorithm, it
    is advisable to perform multiple iterations and then choose the set of initial
    centroids that produced the least inertia.


    # Question 3: What is the objective function of k-means clustering?


    **Answer**: The objective function of k-means clustering is to minimize the within-cluster
    sum of squares, also known as **inertia** or **distortion**. This objective function
    measures the compactness of clusters by summing the squared distances between
    each data point and its assigned centroid within the same cluster. Mathematically,
    it can be expressed as:


    $Inertia = \sum_{i=1}^{K} \sum_{x \in C_i} ||x - \mu_i||^2$


    # Where:


    +   - K is the number of clusters.

    +   - Ci is the set of data points assigned to the iᵗʰ cluster.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '+   - μᵢ is the centroid of the iᵗʰ cluster.

    +   - |x − μᵢ²| represents the squared Euclidean distance between a data point
    x and the centroid.


    The goal of k-means clustering is to find the optimal cluster centroids that minimize
    this inertia, resulting in well-separated and internally coherent clusters.


    # Question 4: How is the quality of clustering evaluated in k-means?


    Answer: In general, several assessment criteria of clustering quality in k-means
    are inertia, silhouette score, Davies-Bouldin index and Dunn index. These measure
    features like the spherical shape of the cluster, the extent to which clusters
    are separated from each other and how close they are within themselves in order
    to evaluate the efficiency of the clustering number. Thus, the aim is to identify
    which clustering method minimizes or maximizes the chosen evaluation criterion
    and means so that its clusters are clearly and internally consistent.


