- pgno: 136
  md: '**Answer:** KNN may experience issues arising from imbalanced data where one
    of the classes has few examples as compared to another class. This situation is
    problematic, especially if the two classes are of different proportions, as the
    program is inclined to predict the majority class. Here are some techniques to
    address class imbalance in KNN:


    +   - **Weighted voting**: Modify the voting mechanism of KNN so as to enhance
    the inclusion of the minority class votes. This way, the effect of the minority
    class is given a boost during the classification step.

    +   - **Synthetic Minority Over-sampling Technique (SMOTE)**: Over-sample the
    minority class by creating synthetic samples in a bid to balance the class distribution.
    SMOTE generates synthetic instances by taking the difference between the existing
    minority class instances, which might be useful for supplementing the limited
    instances of the minority class.

    +   - **Under-sampling the majority class**: Decrease the number of samples in
    the majority class to handle the class imbalance issue. This can be done randomly
    or with the help of using more advanced methods, like the tomek links or edited
    nearest neighbors.

    +   - **Adaptive nearest neighbors**: Adjust the distance measure or the number
    of neighbors dynamically depending on the trained classes. For instance, it may
    be necessary to reduce the number of neighbors for the majority class to avoid
    the dominance of this class in the predictions.

    +   - **Ensemble techniques**: Apply ensembles like bagging or boosting techniques
    and unify the KNN model’s predictions. Hybridization reduces variance;'
  merge: -1
  img_proc: true
