    +   - **Time since last event**: The period of time that has passed as of a certain
    date/point in time, that is, the time taken between a certain occurrence and now.
    Example: For a time series, the number of observations between the last peak or
    trough or other significant event in a time series.

    +   - **Autocorrelation**: Estimation of the time series with its past values,
