    # Question 12: Explain the concept of SHApely Additive exPlanations (SHAP) values
    and their role in model explainability.


    Answer: SHAP is a versatile and well-known technique for providing the explanations
    of the results in an ML model. They offer a means by which it is possible to determine
    the impact of each feature with regard to a model. SHAP values are calculated
    according to the principles of a branch of mathematics called cooperative game
    theory, and the Shapley values, in particular, stem from the discipline of economics.
    Here is an explanation of SHAP values and their role in model explainability:


    +   - The fundamentals used in designing SHAP stem from cooperative game theory,
    especially Shapley values, which are used to ascertain the degree of each player''s
    contribution to a coalition’s worth. When it is applied to ML, each feature (input)
    is regarded as a player, and the model’s predicted value is the payoff of a coalition.
    In addition, there is the permutation-based approach, which is a part of this.
    For a given instance, the SHAP values try to approximate the relative importance
    for each feature averaged over all the permutations of the features obtained from
    the feature value ranges. To arrive at feature importances, these values are then
    averaged over many instances.


    Regarding model explainability, SHAP helps solve it through feature importance,
    local explanation and global'
