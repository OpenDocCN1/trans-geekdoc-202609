  md: '# Question 3: What is the MLE method in logistic regression?


    Answer: In logistic regression, MLE is a technique for estimating the model parameters
    (coefficients).


    In brief:


    +   • Likelihood function: The likelihood function estimates the probability of
    observing the current set of outcomes, namely the binary responses, for a certain
    set of parameters. In the case of logistic regression, it is the product of the
    likelihood of observing the actual outcome values, assuming the underlying distribution
    is logistic.


    +   • Log-likelihood function: To simplify the expression, the log-likelihood
    function is mostly used. It is a natural logarithm of the likelihood function.
    The optimization of the likelihood function is equal to the optimization of the
    log-likelihood as they both describe the same thing.


    +   • Optimization: At first, the idea is to estimate the parameters θ that lead
    to the maximum likelihood of the log-likelihood function. This is sometimes done
    in a computationally efficient way, such as through more elaborate methods such
    as gradient descent.


    +   • Coefficient estimation: The estimated values are called the MLE. They are
    the predictors of the observed outcomes, especially when applying logistic regression
    analysis of the model.


    Briefly, MLE in logistic regression helps estimate the likelihood of the observed
    outcomes simply by utilizing the log-likelihood function and optimizes this function
    by utilizing the optimization approaches.'
