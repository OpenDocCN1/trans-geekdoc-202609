    There are two common types of regularization: L1 regularization, also known as
    Lasso, and L2 regularization, also known as Ridge.


    L1 Regularization adds an extra term to the loss function calculated as the absolute
    value of the parameter estimate.


    *Total Loss = Standard Loss + λ * Σ |w|;* where λ is the term used to define the
    amount of regularization to be incorporated into the model’s coefficients w.


    L1 regularization also makes the model strive for simplicity by forcing many features’
    weights to be null. Thus, it combines the operations of finding the most significant
    features and zeroing out the rest. It is also more useful when working with high
    dimensional data, most of which is noisy or irrelevant features. They enable the
    model to exclude irrelevant features and, therefore, improve its generalization
    capacity.


    L2 Regularization (Ridge) increases the loss function with the second power of
    the weights up to the winter expected value.


    *Total Loss = Standard Loss + λ * Σ w²;* where λ is the regularization strength,
    and w refers to the parameters of the model. L2 regularization makes large weights
    for the features undesirable, but it does not make them zero. Instead, such algorithms
    usually allocate relatively equal weight values to all the features, which makes
    the model less greatly affected by specific values. It helps avoid overfitting
    because the degree of flexibility of the model is slightly reduced. This makes
    the weight values more spread'
