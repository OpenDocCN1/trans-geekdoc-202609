    # **Question 7: Describe the concept of multicollinearity in logistic regression.**


    With logistic regression, like any other statistical model, multicollinearity
    is a problem that arises when two or more independent variables in the model are
    highly related. These problems can be eminent by the existence of unstable parameter
    estimates, high standard errors of estimations and the problem of interpreting
    variables’ individual effects. Some of the measures that need to be taken in order
    to enable the use of a logistic regression model are as follows: Handling multicollinearity
    should be done as it affects the dependability and accuracy of the findings by
    checking for high VIF values, removing or combining correlated variables, or using
    regularization techniques like L1 (Lasso) regularization.


    # **Question 8: What is the purpose of the Hosmer-Lemeshow test in logistic regression?**


    The Hosmer-Lemeshow test in logistic regression is used to test the goodness of
    fit of the model by comparing the actual number of cases to the number of expected
    cases based on the given probability estimates. It aids in knowing the difference
    between the actual and the predicted values, which in turn gives information in
    regards to the model''s ability to calibrate the probabilities of the binary results.


