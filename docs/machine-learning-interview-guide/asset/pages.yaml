  md: '# Question 7: What is the difference between lemmatization and stemming, and
    when would you choose one over the other?


    Answer: Lemmatization is the process of converting each word to its simplest form
    (dictionary form). It is more language-dependent since it depends on the morphology
    of the language in question and the relationship between its different segments.
    For instance, the verb Running is changed to the more specific run, while the
    comparative adjective better is reduced to the basic adjective good.


    Stemming is removing the first and/ or last letter of a stem to create a new stem,
    which is equally less dependent on the specific language and can be used in greater
    extent. For instance, running | run, better | better.


    Lemmatization is more accurate and complex, produces actual words, and is language-sensitive.
    It is optimal for usage in tasks that need to be precise. Stemming is relatively
    more simple, less time-consuming, noisy, and language-dependent in nature. Therefore,
    it is ideal when a quicker result is desirable as some degree of inaccuracy is
    allowable.


