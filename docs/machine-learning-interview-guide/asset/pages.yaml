    are the possible values which that feature A can have, Dν is the subset of D which
    has the feature A having the value of ν, and H(D) is the entropy of this dataset.


    +   - **Gini impurity**: GI is the chance of misclassification of an element which
    uses the dataset’s label distribution:

    +     - Another measure that can be used for splits in the decision trees in case
    of a classification problem is the GI.

    +     - It measures the extent of misclassification error on a randomly picked-up
