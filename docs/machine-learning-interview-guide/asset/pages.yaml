    +   - **Silhouette score**: Determine how the code works by using the silhouette
    score on different cluster numbers and selecting the number that gives the best
    score.

    +   - **Cross-validation**: Use a part of the data sample as a training set and
    the other part as a validation set, estimate GMM with different numbers of clusters
    with the help of training data, and then testing the result with the help of the
    validation data.

    +   - **Information criteria**: To make a compromise between goodness of fit and
    the number of clusters, choose one of the criteria, such as BIC or **Akaike information
    criterion** (**AIC**), and choose the number that minimizes this criterion.

    +   - **Gap statistics**: Select the number of clusters based on the comparison
    of the within-cluster dispersion to a reference distance developed from a null
    hypothesis.'
