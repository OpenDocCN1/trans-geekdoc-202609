    # Question 8: Explain the confusion matrix and its components in classification
    evaluation (or) discuss classification metrics such as accuracy, precision, recall,
    and F1 score.


    Answer: A confusion matrix is a primitive table at the evaluation of classification.
    It offers the probability measure of a model by computing the predictions with
    the point of view of actual class values. The confusion matrix consists of four
    components: The basic terms used in the classification process include, TP, TN,
    FP, and FN. These components are used to make calculations and derivation of the
    other classifications measurements including accuracy, precision, recall and F1
    score. Here is a description of each component:


    +   - The TP represents the number of instances that has been correctly classified
    by the model as positive—in other words, correctly classified as belonging to
    the positive class. These are the cases where the model got it right by providing
    the right result of positive instances.

    +   - TN are all the records which are correctly classified as negative class
    or as not being a part of the positive class. These are the cases where the model
    got it right for the classification of the negative instances.

    +   - The number of patients dismissed as positives refer to the cases when the
    model predicted a positive result when, in actual sense it is negative. In other
    words, these are the instances where the model has a positive outlook, but the
    result was negative.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   - The FN are those cases that the model identified as non-diseased, but
    in fact are diseased. These are outcomes where the model reveres the sign of the
    target variable and gives a negative value when, in fact, it should be positive.


    The confusion matrix is used for various purposes in classification evaluation:


    +   - Accuracy is the measure of TP and TN combined divided by the overall number
    of cases in the test set. It gives a rough estimate of the efficacy of models
    in general.

    +   - Accuracy of a test is computed as TP / (TP + FP) and is the measure of how
    accurate the model under consideration is for positive class. It is useful where
    the costs of false positives are high.

    +   - Recall (Sensitivity) is computed as TP / (TP + FN), and it shows the model’s
    accuracy in identifying all positive cases. This is especially important when
    there is a penalty for missing the positive instances, that is false negative.

    +   - F1 score can be calculated as the ratio of two times the amount of overlap,
    divided by the sum of the size of the resulting set and size of the intersection
    set of the precision set and the recall set. It provides the well-thought-out
    trade-off between the precision and recall parameters in a single value.

    +   - Accuracy is calculated as TN / (TN + FP) and shows the correct refusal of
    all negative cases.

    +   - **ROC analysis**: The confusion matrix is used to plot ROC curves. Changing
    thresholds causes different values of TPR and FPR in order to present the model
    results.'
  merge: -1
