    # Question 8: What are the common challenges or limitations associated with using
    SVR?


    Answer: Here are the common challenges or limitations associated with using SVR:


    +   - **Choice of hyperparameters**: Selecting an appropriate kernel type, the
    value of a differentiating parameter C, and/or epsilon may be relatively difficult
    and usually requires fine-tuning.

    +   - **Computational complexity**: SVR can be slow especially when used on large
    datasets and this will mean that there will be longer training times; hence, more
    resources will be needed.

    +   - **Scalability**: SVR may not work good for large data sets and may need
    special hardware or may need to make use of distributed computing architectures.

    +   - **Interpretability**: SVR models are usually said to be a black-box system
    and it becomes hard to understand the relationships between features and the target
    variable that have been learned by the model.

    +   - **Sensitivity to noise and outliers**: SVR is also quite influenced by noise
    and outliers. This is because for this algorithm performance drops sharply if
    the input data contains noise and outliers, especially when C is small.

    +   - **Limited performance with high-dimensional data**: Apart from this, SVR
    may face problems related to high dimensionality, which reduces the effectiveness
    of the kernel trick.'
