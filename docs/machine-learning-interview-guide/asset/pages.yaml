    # Question 8: What are the limitations of using a moving average?


    **Answer**: The limitations of using a moving average are as follows:


    +   1. **Lagging indicator**: Moving averages react to changes only after they
    occur, leading to delays in identifying trends or significant shifts in the data.

    +   2. **Sensitivity to window size**: This is usually determined by the window
    size chosen, which defines responsiveness to change. Small windows are fast to
    respond, but they have a high probability of producing noise, while the bigger
    windows are slow to respond but are more accurate to changes.

    +   3. **Smoothness versus responsiveness trade-off**: There is a dilemma here
    regarding the speed at which it will be smooth to use. High-order smooth averages
    lack detail and may allow an object’s speed past a certain point to go unnoticed;
    at the same time, low-order smoothers may present irregular fluctuations.

    +   4. **Inability to capture sudden changes**: Relative to the SMA, trends can
    be less identifiable since the'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'averages may not quickly adjust to the changes in the data trends, thereby
    giving less accurate forecasts.


    +   5. **Susceptibility to outliers**: Moving averages, especially the simple
    ones, are affected by outliers in such a manner that these affect the accuracy
    of the moving average in showing the trend of the series.

    +   6. **Data requirements**: While using moving averages, enough history is required.
    Their work may not be as effective if there is a scarcity of data, especially
    with short-term trends.

    +   7. **Assumption of stationarity**: Most moving averages require that the data
    used is stationary. If it is not, they might offer wrong information that is not
    accurate with the facts in the actual measurement.

    +   8. **Difficulty in forecasting turning points**: Trend reversal could be hard
    to predict by using moving averages since this tool is useful to level off the
    oscillations and can swiftly provide signals.


    Despite their usefulness in trends and smoothing of the time series data, moving
    averages present issues, such as lagging, the sensitivity of the window size,
    the hidden dilemma of the trade-off of balance between the smoothness and responsiveness
    values, high sensitivity to outliers, and the need for large amounts of data,
    non-stationary assumptions, and poor fitness in providing due forecasts for volatile
    changes or turning points.


