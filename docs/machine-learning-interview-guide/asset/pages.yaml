    # Question 12: What is class imbalance, and why can it be problematic in supervised
    learning?


    Answer: Class imbalance is a type of problem where the volume of one of the labels
    is very high or very low with respect to the rest of the labels. The class with
    a high label count is generally known as a majority class, and the class with
    a low label count is generally referred to as a minority class.


    Say, we have a binary problem where there are two classes, Class A and Class B.
    Imbalance is a scenario when Class A or Class B has more than 80% or 90% records.
    A ratio like 1:100 is highly imbalanced, and 2:3 is slightly imbalanced. In case
    the ratio is close to 1:1, then call it a balanced dataset. It is extremely hard
    and rare to find a perfectly balanced dataset, but generally, we find something
    near a 1:1 ratio.


    The imbalanced ratio tunes the model in such a way that it expects only high-volume
    labels, and the prediction gets skewed. So, it is always preferred to provide
    the model with the balanced data.


