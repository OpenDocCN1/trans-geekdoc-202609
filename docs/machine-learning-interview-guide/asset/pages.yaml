    # K-means


    K-means is a well-known unsupervised ML algorithm that can be used to identify
    clusters in a fixed number of clusters in a given dataset by minimizing the variance
    within-clusters. It operates by subdividing the data into clusters and repeatedly
    assigning each data point to the closest cluster centroid, as well as adjusting
    the centroid as per the assigned data points. It goes on until there is consensus,
    which is to mean that convergence has taken place. The advantages of k-means are
    as follows: It is easy and fast to perform and can easily be computed even for
    large datasets as well as for large dimensionality. K-means is the central concept
    for partitioning methods for cluster'
