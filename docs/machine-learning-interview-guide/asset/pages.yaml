    # Question 6: How does a random forest handle missing values in the dataset during
    the classification process?


    Answer: A random forest handles missing values during the classification process
    by imputing them in the following various ways:


    +   - **Imputation by averaging:** Impute missing values with the mean of the
    feature with the available data.


    +   - **Proxy variables:** In order to make decisions pertained to missing values,
    they need to be replaced with correlated features as a workaround.


    +   - **Prediction with available information:** The strategy used during prediction
    time is applying the information present in other features to move through the
    tree and come up with a classification. This structure also has the effect of
    reducing the problems wrought by missing values.'
