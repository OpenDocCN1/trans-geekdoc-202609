    \ $$\n+   \n+   - **Chebyshev distance (Infinity norm)**: The maximum absolute\
    \ difference along any dimension. It represents the distance along the coordinate\
    \ axis where the difference is the largest.\n+   \n+     Formula:\n+   \n+   \
    \  $$ d(p,q) = \\max |p_i - q_i| $$\n+   \n+   - **Hamming distance**: Used for\
