  md: '+   - **Calculate the cost function**: Calculate the cost function, abbreviated
    as the MSE in the linear regression model most of the time. The cost function
    compares the values that has predicted by the model with the values of the actual
    data.

    +   - **Compute the gradient**: Derive the first-order partial derivatives of
    the cost function with respect to each of the coefficients. The gradient is a
    vector in the direction of increase of the cost function but at a faster rate.

    +   - **Update coefficients**: (By emphasizing less, the coefficients need to
    be corrected by subtracting a part of the gradient from the current value.) The
    fraction through which the distance is scaled is called the **learning rate**
    or the **step size** and it is represented by the symbol α. This step adjusts
    the coefficients in the desired direction as a result of which the cost function
    is reduced.

    +   - **Repeat**: Perform steps two and four until the predefined number of loops
    or until a convergence of the result is achieved. The convergence criterion could
    be an epsilon constant relative to the cost function or the predefined number
    of iterations.

    +   - **Convergence**: The process then goes on until the cost function reaches
