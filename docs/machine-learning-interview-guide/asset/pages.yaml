    # **T-distributed Stochastic Neighbor Embedding**


    t-SNE is an advanced tool of data visualization that comes under ML and is helpful
    in analyzing datasets of high-dimensions in a 2D or 3D realm. It is designed to
    best incorporate the local structure of the data but at the same time, uncover
    the global structure of the data. Hence, it is very good for clustering and other
    explorations of large datasets. In a way that near points in high-dimensional
    space are placed close to each other, and distant points are placed far apart,
    t-SNE is beneficial in revealing the underlying structure of data to easily identify
    clusters or patterns in the high-dimensional data points. Such distinctive capacity
    to visualize and assess clusters on instinct counts a lot in model explanation,
    selection of features, and assessing the works of data distribution.


    # **Question 1: What is t-SNE, and how is it used in clustering?**


    Answer: t-SNE is an important algorithm that is used to convert high-dimensional
    data into lower-dimensions, usually two or three dimensions, for visualization.
    It retains the neighborhood relationships of the data both locally and globally
    due to the fact that similar data points are located close to each other in the
    low-dimensional representation of the high-dimensional data. t-SNE is less common
    in clustering and is rather used in data exploration where it is'
