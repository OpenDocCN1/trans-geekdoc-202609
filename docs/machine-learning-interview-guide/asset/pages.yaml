  md: 'P(A|B) = \frac{P(B|A) \times P(A)}{P(B)}


    # Where:


    +   - P(A|B) is the probability of event A occurring given that event B has occurred.

    +   - P(B|A) is the probability of event B occurring given that event A has occurred.

    +   - P(A) and P(B) are the probabilities of events A and B occurring independently.


    Application in Naïve Bayes: The posterior probabilities in the case of Naïve Bayes
    are calculated by applying the Bayes theorem in terms of features (words) of the
    document to determine which document belongs to which class. Specifically:


    +   - P(A|B) combines the probability estimate of a document to a particular class
    (say spam or non-spam) when considering its features (words).

    +   - P(B|A) is the mathematical probability of the occurrence of the features
    predisposing to the receipt of specific short messages (for instance, the probability
    of finding certain words in spam messages).

    +   - P(A) is the prior probability of the class (for example, the general probability
    that a given document is spam).

    +   - P(B) is the probability of the features (words) independent of the class.


    Naïve Bayes uses probability analysis according to Bayes theorem, if the probability
    of a document having all its features matching a certain class is calculated and
    compared with the other classes, the class with the highest'
