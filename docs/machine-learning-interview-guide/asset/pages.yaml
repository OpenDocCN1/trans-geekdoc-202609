    +   • Optimization: It continuously shifts the positions of the data points in
    the lower-dimensional space, such that it minimizes the KL divergence, and this
    is often done with the help of the gradients descent.


    Altogether, t-SNE is about searching for the placement of this data into a space
    of a few dimensions, in which the organization and the relations between the objects
    would still be meaningful and easily recognizable.


    # Question 4: Can you describe the steps involved in performing t-SNE?


    Answer: The steps involved in performing t-SNE:


    +   1. Compute pairwise similarities: Forwards the data points of the high-dimensional
    space and the likeness of each data point by a Gaussian kernel function.


    +   2. Initialize embedding: With regard to the positions of data points in the
    lower-dimensional space, they must be initialized randomly.


    +   3. Compute conditional probabilities: Transforms similarities to the conditional
    probabilities via softmax operations.


    +   4. Compute joint probabilities: Estimates the joint probability for two points
    situated in the lower-dimensional area off the distance.


    +   5. Minimize KL divergence: With the help of gradient descent, the value of
    the KL divergence between the conditional and joint probabilities is reduced.'
