- pgno: 282
  md: '**Answer:** Multicollinearity among predictor variables in a regression model
    can have several impacts on model evaluation:


    +   - **Impact of multicollinearity**:

    +     - **Increased uncertainty**: It inflates the standard errors, resulting
    in directionless coefficient estimates.

    +     - **Unreliable coefficient estimates**: Induces variability, which complicates
    the assessment of predictor influence.

    +     - **Decreased predictive accuracy**: Decreases model performance because
    it affects the separation between related predictors.

    +   - **Addressing multicollinearity**:

    +     - **Variable selection**: If there are two predictors that are too correlated
    with each other, it is better to delete one or use both but in a combined form.

    +     - **PCA**: These predictors should be transformed in a way that makes them
    independent random variables.

    +     - **VIF**: Use VIF to identify high multicollinearity and its cause and
    then eliminate it.

