    # **Question 1: How does the BoW model represent text data?**


    BoW model is an approach used in the transformation of documents into numerical
    vectors that depict the text data. Every vector is a document, and the degree
    of the dimension in the vector is the occurrence of the word in the vocabulary.
    The value placed by each dimension represents the relative frequency or the total
    occurrence of the particular word in the document. In contrast with the syntactic
    model, this model does not take into consideration word order or grammar of sentences
    but only the presence of words and their frequencies. Hence, it offers a rather
    efficient method for classifying and clustering building blocks of text documents—the
    words.


