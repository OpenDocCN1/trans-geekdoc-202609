    or WordPiece so that the model can identify them with regards to sub word patterns.

    +   - **Transfer learning**: Transfer learning of pre-trained models by exposing
    them to a set of data relevant to the domain for better OOV entity recognition.

    +   - **Rule-based systems**: This includes the use of predefined rules or heuristics
    together with the'
