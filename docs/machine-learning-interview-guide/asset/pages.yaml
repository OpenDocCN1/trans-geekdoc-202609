- pgno: 333
  md: 'Answer: The working of PCA as a mathematical concept is to identify the directions
    in the feature space, which is also termed as the PCs, where the variability of
    the data is the highest. PCA does it by completing and orthogonal transformation
    to uncorrelated the original features and then counts for the eigenvectors of
    the covariance of the data.


    Here is a brief overview of the mathematical steps involved in PCA:


    +   - **Centering the data**: PCA attempts to bring the data to the mean of zero
    along each dimension by subtracting the mean of features.

    +   - **Covariance matrix calculation**: An analysis by PCA involves calculation
    of the covariance structure of the centered data, as well as the basic and higher
    order structure in the set of paired relationships for the features as well as
    in the variation of the data.

    +   - **Eigenvalue decomposition**: PCA isolates the covariance matrix into its
    specific features called eigenvectors and eigenvalues. Eigenvectors give direction
    of the maximum variance also known as PCs and eigenvalues gives total variance
    that is explained by each eigenvector.

    +   - **Ranking and selection**: PCA sorts the eigenvectors in ascending or descending
    order of eigenvalue. The corresponding eigenvectors with the largest eigenvalues,
    that is able to explain the largest amount of variance, are chosen as the PCs.

    +   - **Projection onto PCs**: Last, PCA transforms the dataset to a smaller selected
    number of PCs that explains the maximum variance in the data.


    Thus, the PCA goal is to find dimensions of the PCs that explain the most variance
    in the data and perform'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'dimensionality reduction, preserving crucial information.


    # Question 4: Can you describe the steps involved in performing PCA?


    Answer: The steps involved in performing PCA are:


    +   • Standardization: If necessary, it may be normalized by making mean = 0 and
    variance = 1 for all features, which is good for an analysis.


    +   • Compute covariance matrix: Determine the covariance matrix of the standardized
    data, which measures the correlation and variance of each pair of the features.


    +   • Eigenvalue decomposition: Factorize the covariance matrix into its eigenvectors
    and eigenvalues. Eigenvectors give directions of maximum variance or the PC, while
    the eigenvalues give the amount of variance captured by each eigenvector.


    +   • Select PCs: Sort the eigenvectors in increasing order of the eigenvalues
    associated with them. Choose the first K eigenvectors that contain the largest
    amount of variance in the data to be our PC matrix.


    +   • Projection: Transform the original data with the selected PCs to get data
    with fewer dimensions. This is done using the formula where the data matrix is
    multiplied by the PC matrix using the dot product.


    Such steps make it possible to decrease the data dimensionality keeping most of
    the variance that will allow to carry out analysis, visualization or additional
    data processing in a lower-dimensional space.


