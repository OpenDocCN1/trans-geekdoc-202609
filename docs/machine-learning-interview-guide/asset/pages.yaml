    clustering results.


    # Question 3: What is the mathematical principle behind t-SNE?


    Answer: The mathematical principles behind t-SNE are:


    +   - **Similarity calculation**: t-SNE measures distances between pairs of the
    data points in the high-dimensional space based on the Gaussian similarity function.

    +   - **Dimensionality reduction**: It transforms these high-dimensional similarities
    into a low dimensional space while preserving relationships within the local and
    global space, and in addition, it uses a t-distribution.'
