    Answer: Document similarity measures the degree of resemblance or closeness between
    two or more text documents. It is a fundamental concept in NLP and has applications
    in various tasks such as information retrieval, document clustering, and recommendation
    systems.


    Measuring document similarity involves the following:


    +   • Cosine Similarity: Computes the cosine of the angle between two vectors
    representing document term frequencies.


    ○ Formula:


    Cosine Similarity(A,B) = \frac{A \cdot B}{|A| \cdot |B|}


    ○ Significance: Ignores the document length and focuses on the angle between the
    vectors, providing a normalized measure.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '+   - **Jaccard Similarity:** Calculates the size of the intersection divided
    by the size of the union of the sets of terms in two documents.

    +     - Formula:

    +       $Jaccard Similarity(A,B) = \frac{Intersection(A,B)}{Union(A,B)}$

    +     - **Significance**: Particularly useful for measuring similarity in terms
    of set overlap.

    +   - **Euclidean Distance:** Computes the straight-line distance between two
    points in a multidimensional space.

    +     - Formula:

    +       $Euclidean Distance (A,B) = \sqrt{\sum_{i=1}^{n} (A_i - B_i)^2}$

    +     - **Significance**: Captures the geometric distance between document vectors.

    +   - **Manhattan Distance:** Calculates the distance between two points as the
    sum of the absolute differences of their coordinates.

    +     - Formula:

    +       $Manhattan Distance(A,B) = \sum_{i=1}^{n} |A_i - B_i|$

    +     - **Significance**: Measures the distance traveled along grid lines.

    +   - **Overlap Coefficient:** Computes the size of the intersection divided by
    the size of the smaller set.

    +     - Formula:

    +       $Overlap Coefficient(A,B) = \frac{Intersection(A,B)}{min(Size(A),Size(B))}$'
