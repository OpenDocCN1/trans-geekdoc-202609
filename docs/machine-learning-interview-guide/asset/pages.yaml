  md: '# Question 9: What is the relationship between word embeddings and semantic
    similarity?


    **Answer:** Semantic similarity, as applied to word embeddings, is the process
    of modeling words as real-value vectors in a high-dimensional space.


    The relationship between word embeddings and semantic similarity is as follows:


    +   - **Proximity in space**: Cohyponyms, that is, the words that refer to the
    same concept, are positioned closer in relation to the embedding space. The more
    vectors, the greater the similarity between the words, hence the more meaning
    similarity.

    +   - **Vector operations**: The similarity measure, like the cosine similarity
    of the words, can also be done based on operations on vectors. High cosine similarity
    indicates the attribute, or word or phrase being compared in both text sequences,
    has high semantic identity with its counterpart.

    +   - **Analogy reasoning**: Relation-embeddings can express the relations through
    the vector arithmetic. For example, the vector difference between *king-queen*
    is as equal as *man-woman* which indicates the model having an understanding of
    these semantic relations.


    Therefore, an analogy of these is how word embeddings map meaning proximity into
    spatial proximity in the vector space.


