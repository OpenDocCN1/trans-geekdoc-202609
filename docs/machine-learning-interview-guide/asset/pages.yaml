  md: "In short:\n\n+   - **Standard logistic regression model**: The simplest model\
    \ in logistic regression is the one that forecasts the logarithm of the odds of\
    \ the binary outcome in terms of the logistic of the predictor variables.\n+ \
    \  - **Interaction terms**: An interaction term is obtained when two or more predictor\
    \ variables are cross-multiplied with each other. These terms are the sum of the\
    \ products of the interdependent and affecting variables on the log-odds of the\
    \ result.\n+   - **Model equation**: The logistic regression equation with interaction\
