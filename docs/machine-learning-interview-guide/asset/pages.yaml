    # Question 12: What is the kernel trick in the context of SVR, and how does it
    enable the model to capture complex patterns in the data?


    Answer: The kernel trick in relation to SVR enables the identification and modeling
    of non-linear structures of the data without explicitly mapping the attributes/variables
    into a higher dimensional space. Here is a brief explanation:


    +   • **Kernel function**: Transforms the pairs of data in the original feature
    space, to perform comparison using functions like linear, polynomial, or RBF kernels.

    +   • **Implicit mapping**: The kernel trick is a different way of mapping the
    features into a space of higher dimension; it computes only the dot product between
    two points of the higher space.

    +   • **Capturing complex patterns**: Kernel functions help in representation
    of non-linear data and when the training data has more complicated decision boundaries,
    then SVR can learn such complex boundaries on the basis of training data to predict
    the output of the corresponding test data.


    To sum up, one of the implementations of SVR is the kernel trick which helps to
    solve the problem of the non-linearity of the array and non-linear relations between
    the features by transforming the input data into a higher dimension without having
    to transform the features of the data set directly.


