    # Question 9: How do you interpret the TF-IDF scores for terms in a document?


    Answer: The TF-IDF score of a term is defined within the constraints of a document
    and ranges from 0 to 1, and it represents the term’s importance or relevance in
    the given document compared with the other documents. Here is an interpretation:


    Starting with, the TF-IDF score is a combination of TF and IDF, the two working
    in a multiplication manner. It is done locally within the specific document as
    well as globally over the whole corpus of documents. A higher score for a specific
    term results from its higher frequency within the given document and at the same
    time resulting from the lower frequency of that term across the whole corpus or
    collection of documents.


    In interpretation:


    +   - Higher the value of TF-IDF, the term is considered to be more important
    or relevantto the given document and may hold significant topics or subject areas.

    +   - On the other hand, a low TF-IDF score means that the term is frequently
    used in the document or, generally, in the corpus, and for that reason, it may
    not effectively help discriminate between documents.


