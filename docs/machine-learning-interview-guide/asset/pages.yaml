    # **Question 9:** Discuss the limitations of accuracy as an evaluation metric
    for imbalanced classification tasks.


    # **Answer:** Accuracy is another popular evaluation measure in classification
    problems but it is not good for imbalanced datasets.


    High accuracy in imbalanced datasets can thus be misleading; a model can attain
    very high accuracy by simply predicting the majority class for most of the samples.
    For instance, where 95% of the cases belong to the negative class, a classifier
    which predicts negative for every case will have an accuracy of 95% whereas the
    information supplied is on absolutely no useful. This results in poor treatment
    of the minority class as the notion of accuracy mainly focuses on the capability
    of predicting the majority class; hence, the minority class may be completely
    overlooked. In anomaly detection tasks anomalies are in the negative class which
    is minority class.


