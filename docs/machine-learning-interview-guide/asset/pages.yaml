    # Density-based spatial clustering of applications with noise


    DBSCAN is yet another clustering technique valuable in a ML setting, in which
    the density levels of the datasets are the key to discovering clusters. Unlike
    techniques in which the user has to decide on the number of clusters, DBSCAN can
    cluster shapes of different densities without having to necessarily pre-define
    the number of clusters and mark points that are significantly isolated as outliers.
    DBSCAN’s strength is that it is robust to noise and outliers and useful for finding
    clusters of any shape. It is one of the most useful clustering methods when applied
    in cases when the data or the task at hand may not conform to the paradigm created
    by traditional clustering algorithms.


