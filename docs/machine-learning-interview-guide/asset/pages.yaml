    +   - **One-vs.-all (OvA)**: For each class, train a binary classifier and then
    decide on the class with the highest confidence value.

    +   - **One-vs.-one (OvO)**: This means that for every two classes in the model,
    get an initial set of binary classifiers and use these in prediction, which class
    is classified most often.

    +   - **Weighted voting**: Select instances that have voted based on the neighborhood
    and give equal weight to the neighbors that are nearer.

    +   - **Probability estimation**: Classify the test data based on the weighted
    majority of the probability of each class from the neighboring data.

    +   - **Ensemble methods**: Stack more than one KNN model, such that the classification
    outcome is enhanced.


    These adaptations help KNN keep up with the performance in scenarios where the
    problem being solved involves multiclass. Thus, the choice depends on the concrete
    features of the problem under consideration.


