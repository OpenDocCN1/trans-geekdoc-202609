    # Question 4: What is the EM algorithm, and how is it used in GMM?


    **Answer:** EM algorithm is applied in maximizing the likelihood of parameters
    of statistical models where some of the data collected is either missing or concealed.
    It alternates between two main steps, popularly known as the **expectation step
    (E-step)** and the **maximization step (M-step)**. In terms of GMM, the likelihood
    of observed data is optimized, updating the parameters mean, covariance, and mixing
    coefficients repeatedly through the EM algorithm.


    Here is a brief explanation of how the EM algorithm works in the context of GMM:


    +   - **E-step:**

    +     - Estimate the likelihood that each data density belongs to each facility
    at the current estimates of the facility parameters.

    +     - Give a responsibility, or in other words, an estimation of how likely
    a certain data point is to be in a cluster.

    +   - **M-step:**

    +     - Revise the mean vector, covariance, and prior probabilities by using the
    value of responsibilities calculated in the E-step.

    +     - Recalculate the mean and covariance of each cluster so as to get a better
    fit for those clusters.

    +     - Modify the mixing coefficients on the basis of the fraction of data items
    that belong to a certain cluster.'
