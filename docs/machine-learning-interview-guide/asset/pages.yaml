    # Question 1: Explain the concept of information gain (IG) and Gini impurity (GI)
    and its role in decision tree splitting.


    Answer: IG and GI are measures employed in decision trees where the data has to
    be split with regard to a particular feature. Both are used in the assessment
    of the efficiency of a split based on the extent to which a given set of data
    can be classified clearly into different classes:


    +   - Information gain: IG calculates the decrease of entropy or uncertainty in
    a dataset after splitting:


    +   - IG is in fact, used when constructing the decision trees with regards to
    classification problems in ML.


    +   - It is founded on a principle such as entropy in information theory, which
    depicts the degree of chaos.


    +   - Entropic’s quantify the degree of randomness or ambiguity of a set of data.
    Gain is the amount of decrease in entropy once a dataset sample is divided depending
    on the features. In other words, entropy measures the level of disorder or impurity
    in a dataset. IG calculates the reduction in entropy after a dataset is split
    on a feature.


    +   - The aim is to acquire the feature for which IG is as high as possible as
    it points out how the data can best be split into classes. Mathematically, IG
    for a split on feature A is calculated as follows:


    ```

    IG(D,A) = H(D) - \sum_{v \in values(A)} \frac{|D_v|}{|D|} \cdot H(D_v)

    ```'
  merge: -1
  img_proc: true
