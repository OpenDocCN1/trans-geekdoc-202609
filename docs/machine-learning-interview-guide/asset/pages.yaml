  md: 'the joint probability density function of the observed data points:


    $log L(θ) = \sum_{i=1}^{N} log\left(\sum_{k=1}^{K} π_k \mathcal{N}(x_i|μ_k, Σ_k)\right)$


    Where:


    +   - In this case, Θ refers to the parameters of the GMM that includes the means
