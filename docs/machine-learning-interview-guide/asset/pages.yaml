    # Question 8: How can we determine the optimal number of clusters (K) in k-means?


    **Answer**: Determining the optimal number of clusters (K) in k-means can be done
    using the following methods:


    +   - **Elbow method**: Draw the within-cluster sum of squares also known as **inertia**
    against different values of *K* and then find out the value of *K* at which inertia
    starts to decrease at a slower rate. More precisely, the curve of the within-cluster
    sum of squares is drawn against different numbers of clusters, and the point in
    the graph where the rate of decrease of the within-cluster sum of squares is slowest
    is known as the **elbow point**.

    +   - **Silhouette score**: Compute the silhouette for various values of *K*,
    and the silhouette score gives the difference between clustering coefficient of
    each object and the smallest clustering coefficient of objects in different clusters.
    In the preceding equations, choose the value of *K* that decides the silhouette
    score to be maximum.

    +   - **Gap statistics**: Coupled with the given within-cluster sum of squares
    of the k-means clustering, compare it'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'with the reference distribution from random data. Select the value of K that
    gives the maximum of the gap statistic.


    +   - **Davies-Bouldin index**: Calculate the Davies-Bouldin index for different
    values of *K* which measures the separation between the clusters. Determine the
    value of *K* that makes the Davies-Bouldin index as small as possible.

    +   - **Cross-validation**: Create the training and validation set, which divides
    the data into segments and proceed with the k-means on the data for different
    values of *K*. Select the *K* that gives the best performing model results on
    the validation set.


    Thus, it is observed that each of the methods can be used in the context of the
