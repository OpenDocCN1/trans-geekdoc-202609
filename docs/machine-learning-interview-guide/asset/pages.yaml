  md: "# Question 14: Describe the use of logistic regression in propensity score\
    \ matching.\n\nAnswer: Logistic regression is widely used in propensity score\
    \ matching to calculate the propensity scores which are the probability of being\
    \ in a specific treatment group based on determined variables. In short, propensity\
    \ score matching is an approach to offset the self-selection bias in the evaluation\
    \ of program performance in the non-experimentation research that matches the\
    \ treated and control units on the propensity score.\n\nHere is a brief explanation\
    \ of the use of logistic regression in propensity score matching:\n\n+   **Model\
    \ estimation**: A prevalent technique used in predicting the likelihood of getting\
    \ the treatment (or belonging to a particular group) is logistic regression. The\
    \ logistic regression equation is formulated is as follows:\n+   \n+   $$\\log\\\
    left(\\frac{P(Treatment)}{1 - P(Treatment)}\\right) = \\beta_0 + \\beta_1 X_1\
    \ + \\beta_2 X_2 + \\cdots + \\beta_k X_k$$\n+   \n+   The observed characteristics\
    \ that could predict an individual’s treatment assignment are known as the covariates\
    \ which include (X_1, x_2, ..., x_k).\n\n+   **Propensity scores**: These are\
    \ derived after the estimation of the logistic regression model, where predicted\
    \ probabilities of treatment are the propensity scores for each observation.\n\
    \n+   **Matching**: Here, it is important to match treated and untreated units\
    \ on a measure of their similarities in terms of their propensities. Some of the\
    \ matching methods which were employed include the nearest neighbor matching or\
    \ kernel matching."
