    model created.

    +   - **No autocorrelation**: The error terms are not correlated with each other
    at different lags (that is, they are white noise).

    +   - **No serial correlation**: The residuals from the model do not exhibit serial
    correlation, meaning they are independent and identically distributed over time.


    These are the assumptions of VAR models and it is useful to discuss them while
    analyzing the results and drawing conclusions out of the model. In this case,
    if the assumptions are violated, then it results in a biased parameter estimate
    and unreliable inference.


