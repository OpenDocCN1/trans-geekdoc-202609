  md: 'the observed data and the predicted values by the model of the linear regression.
    It is defined as follows:


    ```

    MSE = (1/n) × Σi (yi − ŷi)²

    ```


    +   - n is the number of data points, which is the sample size.

    +   - yi is the dependent variable value which is observed at the i-th data point
    of the study or sample.

    +   - ŷi is an estimated value of the dependent variable by the linear regression
    model at i th observation.


    The formula means the sum of the squared differences between the observed values
    yi and the predicted values ŷi for all the data points then divided by the number
    of the data points n.


    The reason MSE is used as the cost function is because it states the difference
    between the model’s predictions with the actual values, and since squaring is
    done to the errors, larger errors receive higher penalties. The objective of linear
    regression is, therefore, to estimate values of the model parameters, namely the
    slope and intercept, which will reduce the expected value of the MSE to the lowest
    level, hence giving the model its best fit. The lowest value of the MSE means
    finding out the line that fits best and the minimum errors involved in prediction.


