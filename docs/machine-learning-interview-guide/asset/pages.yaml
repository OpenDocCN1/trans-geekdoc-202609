    A weakness associated with decision trees is that they are highly influenced by
    the proportions of data in the two classes if one of the classes has far fewer
    instances than the other.


    +   - Balancing the dataset: Some techniques, such as creating a new training
    dataset in which the minority class is oversampled while the majority class is
    undersampled.

    +   - Weighted classes: The use of techniques, like cost-sensitive learning, where
    different weights are given to classes, to the minority class during training.

    +   - Cost-sensitive learning: Modifying misclassification costs to increase the
    model’s sensitivity to the errors in the minority class.

    +   - Ensemble methods: With techniques, such as random forests or gradient boosted
    trees that are often less sensitive to imbalanced data.

    +   - Anomaly detection: Applying the procedure if the minority class represents
    rare events as the problem, then becomes an instance of anomaly detection.


