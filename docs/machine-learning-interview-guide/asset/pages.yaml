    # Question 2: Can you explain the concept of tokenization in the context of n-grams?


    Regarding n-gram usage, tokenization entails the act of dividing extreme text
    into token units, including words of characters, to be used to create the n-grams.


    For example, in word-level tokenization, the text "The cat sat on the mat" would
    be tokenized into individual words:


    ```

    [''The'', ''cat'', ''sat'', ''on'', ''the'', ''mat'']

    ```


    Similarly, in character-level tokenization, the same text would be tokenized into
    individual characters:


    ```

    ["T", "h", "e", " ", "c", "a", "t", " ", "s", "a", "t", " ", "o", "n", " ", "t",
    "h", "e", " ", "m", "a", "t"]

    ```


    Afterward, these individual tokens are employed in the formation of the n-grams,
    which is defined as the sequences of n successive tokens in text. It is very important
    to tokenize while creating n-grams, as tokenization decides the unit level of
    text data representation.


