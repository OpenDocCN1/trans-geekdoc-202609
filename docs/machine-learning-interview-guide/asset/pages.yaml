    # Question 2: How does the gradient-boosting algorithm handle regression tasks?


    Gradient-boosting is a kind of ensemble learning that uses many weak learners
    to reach a greater level of accuracy in its prediction process. In the context
    of regression tasks, the algorithm seeks to find the best fit of features to minimize
    the MSE or another suitable loss function in order to increase the model’s accuracy.


    Here is a brief overview of how gradient-boosting handles regression tasks:


    +   - Initialization: First guess, which is usually the midpoint of the target
    variable or criteria in the case of criterion referencing.

    +   - Building weak learners (decision trees): Train a shallow decision tree on
    the residuals of the current intermediary predictions and the actual values.

    +   - Weighted combination of weak learners: Increase by a learning rate the predictions
    of the weak learner and combine them with the current predictions.

    +   - Updating residuals: Restart the weak learner’s training using the new residual
    obtained from the disparity between the forecasts and actual values.'
