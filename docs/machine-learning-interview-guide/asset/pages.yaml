    # Objectives


    This chapter will delve into fundamental data concepts using interview questions.
    The chapter is structured into four subsections as outlined in the structure.
    Upon completion of all sections, readers will acquire an understanding of data
    fundamentals and proficiency in data wrangling for ML.


    # Supervised learning


    Supervised learning is a class of machine learning that involves the usage of
    training data that is labeled. This means that every training example is associated
    with a correct answer. In this way, the model acquires the capability to find
    the relationship between inputs and outputs by reducing the error margin. The
    advantages of such an approach is primarily the ability to make accurate predictions
    and classifications when it concerns certain tasks, such as identifying objects
    in images, filtering spam messages, or diagnosing diseases. Supervised learning
    is also important in machine learning to acquire a fundamental understanding of
    how to build and improve predictive models to achieve maximum effectiveness in
    many fields.


    # Question 1: Why is data preprocessing important in supervised learning?


    Answer: Data preprocessing is one of the most important steps to perform analysis
    for any kind of ML problem or solve any type of ML use case, as no model can directly
    process the raw data efficiently. Most well-known models cannot handle missing
    data or string values. If these things'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'are present in the data, it will throw an error. However, just solving this
    will not help the model, and in turn, it will produce an unsatisfactory result
    as the data is not properly engineered according to the model. For example, some
    models cannot handle non-scaled data, and some can. As a general practice, we
    all tend to perform the basic data preprocessing and feature engineering for most
    of the models.


    The key components for labeled data include the following:


    +   - Features

    +   - Labels


    The preceding two are the only major key components of the labeled data. There
    can be an n number of features but only one corresponding label for them.


    Along with this, we have some information like the source of the data, how was
    the data collected, whether any data preprocessing happened after the data collection
    took place, why was the data collected, and what were some of the assumptions
    about the data then the quality of the data can be improved further in the next
    steps.


    # Question 2: What is the difference between categorical and numerical data?


    Answer: Numerical data refers to a continuous form of data that can be both positive
    and negative.


    Categorical data generally refers to data categorized/grouped and represented
    in some form of string or number.


    Here are some of the examples of the numerical and categorical data:


    +   - A classic example of numerical data is the price of a stock, house, or other
    item.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   - Gender, race, religion, and education level are some popular examples
    of categorical variables.

    +   - Age range is generally considered as numerical data, and if it is binned
    into *Child*, *Teenager*, *Adult*, and *Elderly*, then this data becomes categorical.


    # Question 3: How do you handle categorical data in supervised learning?


    Answer: This might seem odd, but most of the models cannot handle string categorical
    data in its raw form. It has to be converted to some kind of numerical representation.
    The bare minimum data processing that needs to be performed is to have a mapping
    table and replace the categorical value with a numerical value. This process is
    known as label encoding. There are other techniques, like one-hot encoding, which
    can be leveraged so that the model can process the categorical variable.


    Let us take an example that we have three categories for a feature namely, CAT_1,
    CAT_2, CAT_3. ML models cannot understand the string, so it has to be converted
    to a readable form. For label encoding, there is a map CAT_1 | 0, CAT_2 | 1, CAT_3
    | 2. For one hot encoding, we have to break down the features into individual
    categories like FeatureA_CAT_1, FeatureA_CAT_2, and FeatureA_CAT_3, and each will
    be either true or false.


    # Question 4: What is the significance of handling missing values in a dataset?


    Answer: Like string categorical data, missing data cannot be handled by most of
    the models. We need to analyze why and what kind of values are missing and if
    there is any kind of relation or pattern in their missing values, this can lead
    to some additional interesting information which might help in the modelling process.
    This will help us to understand the data in more depth. There are a variety of'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'techniques, like average filling, forward filling, etc, which can be used to
    fill the missing values.


    # Question 5: Explain the concept of imputation for missing data and some strategies
    to handle it.


    Answer: The concept of imputation is replacing the missing data with a certain
    value and it is very critical as it helps to keep the volume of data the same
    or similar, as missing values sometimes can be extremely high in volume which
    will lead to changes in the characteristics of the entire data.


    There are multiple strategies to handle missing values. Some of the popular ones
    are as follows:


    We can remove the entire row where we encountered missing values. This method
    can be hazardous if the volume of the data removed is very high. This will lead
    to a change in the data characteristics as the rest of the features with data
    will take a hit.


    If we notice that the volume of the missing values is quite high and the feature
    is not that significant, we can drop the feature altogether to increase the data
    quality.


    We can fill the missing values with the average or mean of the entire column or
    the average of some logical subsection which can be found after some data analysis.


    Instead of filling with average, it can be filled with min value, max value, mode
    value, etc.


    Note that handling missing values takes time to analyze and constant back and
    forth with the domain expert.


    # Question 6: What are outliers in a dataset, and how can they affect supervised
    learning?


    Answer: Outliers are defined as some data points that are out of the general data
    distribution or some abnormal points'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'which differ significantly from other data points that were recorded during
    data collection. We need to keep in mind that like missing values outliers values
    also convy important information. Outlier datapoint does not mean the values are
    always wrong it simply means it is different from their neighbouring data.


    An example of an outlier is while recording the age of a person someone by mistake
    recorded a negative value. There can also be a case where a machine is recording
    the daily temperature of a place where the minimum goes to 10 degrees Celsius,
    the maximum goes to 40 degrees Celsius, and the average temperature is around
    25 degrees Celsius. However, some records show the daily recorded temperature
    to be around 60 degrees Celsius, which is not possible, and anything above, say,
    45 degrees Celsius is quite hard to believe. These data points are generally coined
    as outlier data points.


    Unlike missing values and string categorical values, data with outliers will successfully
    run without throwing any error. However, there will be a huge problem with the
    model learning and predictions. This will increase the variance in the model and
    might bring instability and reduce generalization performance, that is nothing,
    but the model will be less robust. Outliers will also affect data visualization
    as the feature scale will change.


    # Question 7: Describe strategies for dealing with outliers in a dataset.


    Answer: Outliers can be addressed in numerous ways but the top three methods which
    are commonly used are the interquartile range (IQR) technique, percentile technique,
    and the z-score technique. They are all very close but function in a slightly
    different way.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'For the z-score method, it is often seen that most of us eliminate the data
    points that have z-scores more/less than +3/-3, which can be considered as an
    outlier.


    In the percentile method, we have a cut-off threshold of taking anything that
    is above the 99 percentile, and anything below the 1 percentile is taken as out
    and considered as outliers.


    IQR is a technique that involves identifying the difference between Q3 (the third
    quartile) and Q1 (first quartile) and eradicating the data sets that are beneath
    (Q1-1.5) * IQR or above the (Q3+1.5) * IQR.


    Other approaches include using robust models, or different combinations of models,
    or even attempting to change outliers instead of discarding them.


    # Question 8: What is the curse of dimensionality in supervised learning?


    **Answer:** The curse of dimensionality is an interesting one. The size of the
    feature set increases the model’s performance and the computational performance
    of the traditional algorithms averages out with no further improvement, and sometimes
    the performance decreases. Along with this, there is a set of issues that arise
    like sparsity of the data, increased data volume, and high dimensional distance
    metrics becoming meaningless. Computational complexity and data visualization
    become a challenge, and high dimensional data interpretability is tough.


    One of the techniques, like one hot encoder, is extremely prone to the explosion
    of dimensions, leading to the curse of dimensionality.


    # Question 9: What is data scaling, and why is it necessary for some ML algorithms?'
  merge: -1
  img_proc: true
- pgno: 30
  md: '**Answer:** Data scaling is closely related to data normalization and it refers
    to the process of putting data in the range of certain values while also ensuring
    that they follow a particular format.


    Let us say, we have a feature column of price, and it ranges from 1 to 10 million
    units. It becomes extremely complex for the model to handle a large range, so
    concepts of data scaling are used to bring down the range from a large heterogeneous
    scale (1 to 10 million) to 1 to 100 or even 0 to 1. This helps the ML model to
    process things faster and more efficiently and helps in avoiding features with
    large values in dominating the model learning process.


    L1 and L2 are other examples of regularizations whereby they reduce or penalize
    large coefficient values. As a result, to adjust the features with equal importance,
    it is pertinent to carry out feature scaling.


    # **Question 10: What is one-hot encoding, and when is it used for categorical
    data?**


    **Answer:** One hot encoding is the technique to convert the categorical variable
    to a model-friendly format where the model can understand it is represented in
    a particular category.


    Let us take an example: there is a feature **gender** with 3 unique categories
    namely Female, Male, and Others. Using one hot encoding, the gender column will
