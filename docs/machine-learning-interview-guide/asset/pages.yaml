    Hence, it is crucial that engineers design good features that will enhance the
    performance of time series models.


    Here are some aspects of feature engineering in time series analysis and examples
    of relevant features:


    +   - **Lagged observations**: The current and/or past values of the target variable
    or other related features at some distant point in time. Example: Historical values
    of the time series in question or other variables that are previous steps in the
    time series. In other words, incorporate past values of the target variable or
    other related variables, like using the values from the previous day, week, or
    month as predictors for forecasting future values.

    +   - **Rolling statistics**: Averaging and moving within a particular time period
    and calculating statistical numbers to bring out the trends or series of events.
    Example: Moving average, moving standard deviation, or any other point statistic
    over a pre-designated time period/window.

    +   - **Time-based features**: Time elements that have been extracted from the
    given data include the day of the week, month season or year. Example: Indicator
    for the day of the week, month, season, or year that can help capture seasonality
    or periodicities.

    +   - **Moving averages**: The method of taking the arithmetic mean of values
    at a particular level of aggregation over a fixed time period with the objective
    of offsetting short-term oscillations. Example: Velocity averages as **simple
    moving**'
