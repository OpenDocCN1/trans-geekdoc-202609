    +   - **Random features**: In building up each tree in the random forest, only
    a random subset of the features is considered in the creation of the tree’s decision
    splits. This is referred to as feature bagging or feature sampling. Essentially,
    a set of features is randomly selected either from the complete set of features
    or from a subset already provided. The method of limiting the number of features
    in a random forest helps prevent one feature from dictating the result of a tree
    in all trees, thus enhancing the model’s stability against overfitting.

    +   - **Data sampling (Bootstrap sampling)**: After the construction of the trees,
    every tree in the random forest is trained on a random sample from the training
    dataset made with replacement. This is called **bootstrap sampling**. Here, the
    sampling units are selected in such a way that they allow for the resampling of
    the same set of units until the sample size is achieved. Some members may be common
    in the subsets, while some may not be included. This randomness in data sampling
    adds variety to the trees, among which there is a difference. Therefore, the final
    decision of the random forest is the sum of the decisions that all trees make,
    usually through voting for classification or averaging for regression.


    The meaning of the word random in the context of random forest is based on these
    two sources of randomness; random selection of features and bootstrap random samples.
    These mechanisms help the model to generalize well on new unseen data and the
    model is less likely to overfit when compared to a single decision tree.'
  merge: -1
  img_proc: true
