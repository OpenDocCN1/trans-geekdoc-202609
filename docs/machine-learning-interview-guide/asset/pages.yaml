    # **Question 8: What is the purpose of using different types of cross-validation
    techniques (for example, k-fold, leave-one-out) in regression model evaluation?**


    **Answer:** Different types of cross-validation techniques, such as k-fold cross-validation
    and leave-one-out cross-validation, serve specific purposes in regression model
    evaluation:


    +   - **K-fold cross-validation:**

    +     - **Purpose:** Splits the data into k groups and then successively uses
    k-1 groups for training while using the left-out group for testing.

    +     - **Benefits:** It is unbiased, gets a good balance between bias and variance,
    is computationally efficient, and is frequently used for initial evaluations and
    tuning.


    +   - **Leave-one-out cross-validation (LOOCV):**

    +     - **Purpose:** To do this cross-validation, each data point is used once
    as the testing set, while the rest is used for training.

    +     - **Benefits:** The least amount of bias but requires a lot of processing
    time, ideal for small sample sizes.'
