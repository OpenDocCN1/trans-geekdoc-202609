    # **Term frequency-inverse document frequency**


    TF-IDF stands for term frequency-inverse document frequency is a quantitative
    measu re used in NLP to determine the relevance of the word to a document compared
    to a set of documents. It combines two factors: **Term frequency (TF)**, which
    refers to the number of times a term appears in a document, and **inverse document**'
  merge: -1
  img_proc: true
