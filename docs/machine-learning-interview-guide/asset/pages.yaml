- pgno: 555
  md: '+   - **Position-independent error rate** (**PER**) is used for speech recognition.
    This metric is similar to WER but allows for position-independent errors. It is
    useful in scenarios where the exact position of an error is less critical.

    +   - F1 score can be used for NER and information retrieval. The F1 score is
    nothing but the harmonic means of precision and recall, balancing false positives
    and false negatives. It emphasizes a balance between precision and recall, particularly
    relevant when a class imbalance exists.

    +   - **Bilingual Evaluation Understudy with Representations from Transformers**
    (**BLEURT**) is used in MT jobs. It utilizes pre-trained transformer models to
    provide a more contextual and semantic evaluation of translations. It leverages
    contextual embeddings for a more nuanced assessment of translation quality.

    +   - **System-level Automatic Evaluation of MT** (**SARI**) is used for MT. SARI
    focuses on the fluency, adequacy, and relevance of generated translations by considering
    n-gram edits. It provides a more fine-grained analysis of translation quality.

    +   - BERTScore can be used for various NLP tasks (for example, MT and text generation).
    It utilizes contextual embeddings from BERT to measure the similarity between
    reference and generated sequences. It captures semantic similarity, offering a
    more context-aware evaluation.


    Some differences across tasks are:


    +   - **MT**: Standard measures such as BLEU, METEOR, and BERTScore are usually
    chosen because of the means of precision, recall, and contextual similarity.'
  merge: -1
  img_proc: true
- pgno: 556
  md: '+   - **Text summarization**: It is important to remember that metrics, like
    ROUGE, use n-grams to measure how many and what kind of n-grams in the reference
    summary match with the generated summary, with recall in mind when it comes to
    important content from the source document.

    +   - **NER**: Regarding the instance of named entities identification, F1 score
    is used to achieve the proper balance between the measures of precision and recall.

    +   - **Automatic Speech Recognition (ASR)**: WER and PER measures are used, and
    the authors introduce the word precision and recall on the word level and shift
    of position errors.

    +   - **Image captioning**: On the other hand, CIDEr measures the similarity of
    reference captions and takes into account the generated image captions in terms
    of both, how diverse as well as how relevant they are.


    Evaluation measures are selected in accordance with the specifics and goals of
    each NLP task, because every task has its peculiarities and difficulties connected
    with its application.


