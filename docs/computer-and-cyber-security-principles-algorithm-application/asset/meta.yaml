- - '###'
  - 8.3.2 后向安全性：任何过去的数据无法被未来加入的传感器识别，即当前的密钥无法解码之前的消息。
- - '###'
  - 8.3.3 传感器网络目标
- - '###'
  - 8.3.4 传感器网络中的攻击
- - '###'
  - 8.3.5 攻击的树结构
- - '###'
  - 8.3.6 基于层的攻击
- - '###'
  - 8.4 路由信息操纵
- - '###'
  - 8.4.1 路由信息操纵：在这种操控方案中，通信道上传输的数据被篡改。该问题的解决可以通过身份验证以及加密技术来制定。加密技术对在整个网络中传输的数据进行加密，只有经过认证的终端用户才能对其解密
    [31]。使用这种技术传输的数据使得网络上的任何窃听者无法读取，从而防止了非法访问。
- - '###'
  - 8.5 选择性转发
- - '###'
  - 8.5.1 选择性转发：这种攻击发生在多跳网络中，恶意节点在源和目的之间形成一个节点；选择性地转发某些数据包，同时丢弃其他数据包。这种攻击的解决方案是读取流量
    [32]。
- - '###'
  - 8.6 女巫攻击
- - '###'
  - 8.6.1 女巫攻击：在这种攻击中，一个节点通过网络中的多个身份来代表自己。为了应对这种攻击，认证方案可以发挥重要作用 [33]。
- - '###'
  - 8.7 空洞攻击
- - '###'
  - 8.7.1 空洞攻击：在这种攻击中，攻击者试图通过让受损节点对周围节点更具吸引力，来吸引其他网络节点的注意。因此，在这种技术中，对手能够通过该受损节点传输网络数据来降低网络性能。认证和监控是防止这种攻击的技术。
- - '###'
  - 8.8 虫洞攻击
- - '###'
  - 8.8.1 虫洞攻击：在虫洞攻击中，攻击者在网络中的特定节点选择数据包，将它们隧道传输到某些其他网络节点，然后重新发送到网络。在变体和灵活路由方案的帮助下，可以缓解这种攻击
    [35]。
- - '###'
  - 8.9 Hello 洪水攻击
- - '###'
  - 8.9.1 Hello 洪水攻击：入侵者为通信网络中的其余节点创建了一个伪造镜像。入侵者向传感网络的其余部分展示出高无线电传输范围和更好的处理能力，以便他们通过入侵者节点传输数据。此外，它发送
    hello 消息并邀请它们通过入侵者节点。
