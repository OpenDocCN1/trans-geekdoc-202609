  md: 'The breast imaging reporting and data system (BI-RADS) scoring system has been
    widely used to make consistent reporting and decrease confusion in the interpretation
    of breast B-mode US images. Yet, substantial intra- and inter-observer variability
    based on BI-RADS have been shown in a handful of studies [35,36]. Therefore, a
    CAD system that has high sensitivity and negative predictive value would not only
    reduce intra- and inter-variability but will also reduce the reading time and
    provide radiologists a second opinion. Most importantly, this will potentially
    help to cut unnecessary biopsies. Several studies have attempted to classify benign
    and malignant breast lesions from B-mode US images in an objective and reproducible
    manner. One of the first studies presented by Byra et al. [37] utilized transfer
    learning to differentiate breast lesions from benign and malignant lesions. They
    utilized the VGG19 [38] CNN model that is previously trained on publicly available
    ImageNet dataset and fine-tuned it on B-mode US images of breast masses. An AUC
    of 93.6% was achieved as the performance of their model on a test dataset of 150
    cases. They inferred that the proposed model could potentially be used to aid
    radiologists in decision-making for classification of breast masses. In another
    study, a GoogleNet [39] model was trained on 7,408 breast US images by Han et
    al. [40]. The model was tested on a dataset of 829 images and 90% accuracy, 86%
    sensitivity, and 96% specificity were obtained. The proposed model is implemented
    as a part of the commercial S-Detect technology of Samsung Ultrasound System RS80A.
    A stacked denoising autoencoder model was utilized by Cheng et al. [10] to classify
    breast lesions. The average performance of the proposed model is an AUC of 89.6%,
    which overtakes traditional ML-based methods. The study presented by Zhang et
    al. [41] showed that a better performance can be obtained in classifying breast
    masses using SWE images and DL methods. DL has been also used to detect/segment
    breast lesions from US images [42,43]. Yet, segmentation of breast lesions is
    challenging due to low contrast and unclear boundaries of breast lesions.


