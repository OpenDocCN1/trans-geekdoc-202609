- pgno: 105
  md: 'FLAIR images, and wavelet-based features were extracted from the two MRI modalities,
    as described below.


    +   1. For the volumetric feature, the whole hippocampus volume in each hemisphere
    was examined. The volume of an ROI, e.g., hippocampus, was calculated by the summation
    of all voxels’ volumes in the ROI, i.e., pixel size$×$slice thickness. The volumetric
    feature was calculated by the ratio of the volume of the right hippocampus to
    the left hippocampus. This was a normalized feature and well-suited for the classification
    of unilateral epilepsy.

    2. Two features were extracted from the FLAIR images—mean ratio and standard deviation
    ratio. Each feature was expressed as a ratio of the two values obtained from the
    two hippocampi, i.e., right and left hippocampi. Using these ratios instead of
    the original values facilitates the lateralization by feature reduction and normalization.

    3. For each hippocampus, two levels of wavelet transform were calculated, and
    so seven subband images were produced for each hippocampus. Daubechies’ wavelet
    bases were used for extracting the subband images. Each subband image characterized
    the frequency content (i.e., texture properties) at a predefined scale. Thus,
    the energy feature (i.e., the sum of the square intensities) for each subband
    was used as a texture feature:


    ```

    $$E_{K}=\frac{1}{MN} \tag{6.1}$$

    ```


    where $I_{k}^{2}(i,j)$ is an $M\u00d7 N$ image in the $k$-th subband. The choice
    of an equivalent rectangular image is indeed an important issue that may impact
    the results of the wavelet analysis since a segmented hippocampus is not rectangular.
    In Ref. [31], this problem was overcome by filling the background areas in the
    segmented image using an inpainting technique, i.e., repetitive dilations [49].
    Through this method, each slice of the hippocampus was assigned seven energy features
    and an average over all hippocampus slices produced seven energy features for
    the whole hippocampus.


    The above features were then represented in a feature vector and used to develop
    a $linear\ classification$ algorithm for categorizing the epilepsy patients into
    the right-sided and left-sided groups. In this study, a'
