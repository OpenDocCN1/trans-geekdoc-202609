- pgno: 178
  md: '$P$ on a certain image being of a particular class (either benign or malignant).


    4. With these two tunable parameters $N$ and $P$, we can define a confidence measure.
    For example, if we have 1,000 sampled networks, then $N=0.6$ and $P=0.7$ would
    mean at least 600 networks out of the 1,000 have to have a probability of at least
    0.7 for an image being either benign or malignant (but not a mix-up of both);
    otherwise, the image will be skipped for classification. In other words, by incorporating
    both $N$ and $P$ in the confidence measure, we account for agreement among a portion
    of the sampled networks and also find out how strongly each network feels about
    the classification.


    Under the above settings, the natural expectation would be that as $N$ and $P$
    go higher (higher confidence and lower uncertainty), we should be getting higher
    accuracy, while as $N$ and $P$ go lower (lower confidence and higher uncertainty),
    the accuracy should decrease. However, raising the value of $N$ and $P$ might
    also result in some images being skipped for classification. For example, consider
    a case where we have 1,000 sampled networks, $N=0.9$ and $P=0.9$, which is demanding
    that at least 900 out of the 1,000 networks have to have a probability of at least
    0.9 for an image being either benign or malignant – this might result in a number
    of images being skipped for classification, since we are demanding too high of
    a confidence. This is the case of lower coverage. At higher values of $N$ and
    $P$ (higher confidence), we will have lower coverage (many images skipped), but
    the accuracy on the covered images will be high. On the other hand, at lower values
    of $N$ and $P$ (lower confidence), we will have higher coverage (not too many
    images skipped) but the accuracy on the covered images would be lower. In short,
    tuning the values of $N$ and $P$ gives us a way to decide where in the accuracy-coverage
    tradeoff we want to settle. Therefore, the $N$ and $P$ values, along with the
    accuracy and coverage, comprise our new evaluation metric, which can be formalized
    as a tuple (accuracy, coverage, $N$, $P$) where $N$ and $P$ comprise the confidence
    measure.


    Although in this chapter we are using classification accuracy as the primary evaluation
    criterion, in general, the framework allows any evaluation criterion to be paired
    with a confidence measure. Other possible candidates include precision, recall,
    F1-score, ROC AUC score, etc., some of which might make more sense for an imbalanced
    classification case. However, in this chapter, the goal is not to discuss or compare
    which evaluation criterion among these is the most appropriate, but to pair a
    confidence measure'
