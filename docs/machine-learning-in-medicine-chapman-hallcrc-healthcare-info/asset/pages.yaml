    Adapting the Expectation–Maximization-based technique (EM-based technique) to
    the LCDG allows to precisely identify the specific model, including its number
    components (positive and negative) [18], and to identify a continuous LCDG model
    that contains the probability distribution.


    To identify the LCDG model, a criterion, consisting of expected log-likelihoods,
    is employed [16]. Consider that a 3D MRA image is represented by $\mathbf{X} =
    (\mathbf{X}_{s}: s = 1, \dots, S)$, which contains $S$ co-registered 2D slices
    $\mathbf{X}_{s} = (X_{s}(i, j); (i, j) \in \mathbf{R}; X_{s}(i, j) \in \mathbf{Q})$.
    On the other hand, a rectangular arithmetic lattice supporting the 3D image is
    represented by $\mathbf{R}$ and a finite set of gray levels and $Q$-ary intensities
    are represented by $\mathbf{Q} = \{0, 1, \dots, Q-1\}$. Consider $\mathbf{F}_{s}
    = (f_{s}(q): q \in \mathbf{Q}; \Sigma_{q \in \mathbf{Q}} f_{s}(q) = 1$; in this
    equation, $q$ is one of the gray levels, considered to be an empirical marginal
    probability distribution for gray levels of the slice $\mathbf{X}_{s}$ within
    the MRA.


    According to Ref. [18], each slice of the MRA image is thought of as a $K$-modal
    one, having a determined number $K$ of the main modes of the regions of interest.
