    Echocardiography is an operator-dependent imaging modality that includes variability
    in data acquisition and evaluation. In addition to operator variability, it includes
    patient-specific variability (e.g. signal-to-noise ratio and limited acoustic
    window due to anatomical or body mass differences), and machine-specific variability
    (e.g. electronic noise and post-processing filters applied to acquired images.
    Image quality plays an important role in automated processing pipelines for accurate
    measurements. Suboptimal image quality could affect all measurements and results
    in misdiagnosis of patients.


