- pgno: 84
  md: 'MeLU coincides with ReLU, a property that is helpful in transfer learning when
    the network is pretrained with ReLU (in which case MeLU can simply be substituted;
    of course, MeLU can also be substituted for networks trained with Leaky ReLU and
    PReLU). Another important property derives from the fact that the Mexican hat
    functions are a Hilbert basis on a compact set with the $L^{2}$ norm; thus, they
    can approximate every function in $L^{2}([0, 1,024])$ as $k$ goes to infinity.


    MeLU is similar to SReLU and APLU in having multiple learnable parameters, but
    this number is larger in APLU. MeLU is also similar to APLU in that it can approximate
    the same set of piecewise linear functions equal to identity when $x$ is large
    enough, but how this is done is different for each function. Given the right choice
    of the parameters, APLU can be equal to any piecewise linear function because
    the points of nondifferentiability are learnable, but MeLU is more efficient because
    it can represent every piecewise linear function by exploiting only the joint
    optimization of the weight matrix and the biases. Moreover, the gradients of the
    two activations with respect to the learnable parameters are different. The optimization
    of a neural network depends in large part on two factors: the output of every
    hidden layer and the gradient of that output with respect to the parameters.


    Unlike APLU, MeLU changes the activation where it is needed, making optimization
    easier. The difference between the basis functions of MeLU and APLU is illustrated
    in Figure 5.2. Moreover, as noted in Section 5.2.7, the coefficients in APLU must
    be regularized with an $L^{2}$ penalty and benefits from a low learning rate;
    MeLU does not need any regularization.


    In this study, the learnable parameters in MeLU are initialized to zero, so the
    activation starts off as ReLU, thereby exploiting all the nice properties of ReLU
    at the beginning.


