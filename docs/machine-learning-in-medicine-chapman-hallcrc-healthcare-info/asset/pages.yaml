    algorithm to get the optimal set of hyperparameters. The average accuracy was
    selected as an optimization metric during the hyper-tuning process. With $s_{1}=25$,
    $s_{2}=5$, $s^{c}=2$, non-negativity constraint$=0.03$, sparsity constraint$=3$,
    and hidden units'' average activation value$=0.5$, the developed SNCAE model provided
    the best classification results and was selected.


