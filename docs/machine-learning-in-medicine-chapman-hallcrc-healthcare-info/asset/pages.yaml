    # ## 9.2 UTILIZING TRANSFER LEARNING WITH NATURAL IMAGES


    In this section, we show that instead of relying on large training datasets in
    the medical domain, we can simply use existing large natural image datasets to
    learn low-level features. Then, through an intelligent data filter- ing technique
    based on entropy, we can reduce the dependence on large medical datasets.1 To
    show the application of transfer learning, we pick the field of Alzheimer''s diagnosis,
    which has shown promising results recently when applying ML [8].


    In the early 2010s, statistical ML approaches have shown promising results with
    Alzheimer''s diagnosis [9]. The recent popularity of deep learning approaches
    such as CNN and autoencoders has shifted the attention toward deep learning. However,
    most existing deep learning methods train the architecture from a clean slate.
    This type of training from scratch has a few issues when applied to a medical
    application [10]: (1) Deep net- works typically have millions of learnable parameters,
    which require a large amount of labeled data to be properly optimized. Such a
    large amount of labeled data is expensive to acquire in the medical domain. (2)
    Having millions of parameters poses another problem, where the model may overfit/underfit
    that results in very good training performance, but poor performance on unseen
    data. (3) Training a deep network with such a large amount of data requires a
    huge number of expensive GPUs, which are not sustainable for underfunded healthcare
    centers.


    Fine-tuning a deep CNN through transfer learning is a recent popu- lar approach
    that can be utilized instead of training from scratch [11].'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Although it is hard to obtain annotated data in the medical domain, plenty
    of benchmark datasets with annotated objects are available in the natural image
    domain to solve computer vision problems. One such example is the ImageNet dataset
    [12]. The basic idea behind transfer learning is to not start training from scratch.
    Instead, we train a CNN where the parameters are already learned from a natural
    image dataset such as ImageNet. The network is simply retrained to obtain new
    knowledge from a different domain (e.g. computer-aided diagnosis of Alzheimer''s).
    It has been shown that CNNs are very good at learning low-level features and can
    generalize image features given a large training set. If we always train a network
    from scratch, the extensive research done on natural images and robust architectures
    created for such problems are not being utilized properly.


    In this section, we investigate how we can transfer knowledge learned from natural
    images to the problem of Alzheimer''s diagnosis. The motivation behind reusing
    knowledge learned from natural images is the reduction of excessive dependency
    on the size of the training set. Due to the popularity of CNN, there are many
    established architectures designed with meticulous attention by researchers over
    the last few years to solve visual classification problems. One of the most popular
    benchmarks in the visual classification domain is the ImageNet Large Scale Visual
    Recognition Challenge (ILSVRC). In this challenge, over a million annotated images
    of 1,000 different objects are provided [12]. Due to the popularity of the challenge,
    the winning network architectures of this challenge are usually carefully designed
    and thoroughly tested. For this research, the winners of the aforementioned challenge
    were carefully explored to pick the architecture most suitable for the problem
    at hand. We decided to utilize VGG [13]. VGG was picked because of the easy-to-reuse
    architecture, which consists of multiple convolutional layers, followed by fully
    connected layers [13]. Typically, the network is trained from a clean slate utilizing
    natural image datasets such as ImageNet. Then, the convolutional layers are frozen.
    Only the fully connected layers are retrained for a new problem domain.


    However, randomly cutting down the size of the training data will not help in
    capturing the best possible variation in data, which is required to avoid overfitting/underfitting.
    To select the best possible training set, we utilize image entropy, which provides
    us with a relative measurement of the amount of information contained in one image
    (a slice of the volume MRI image in our case).


