    # 6.1 INTRODUCTION


    Epilepsy, characterized by spontaneous and recurrent seizures, is one of the major
    neurological disorders affecting 0.5%–2% of the population, and based on the World
    Health organization’s report, more than three million Americans suffer from it
    [1,2]. According to the new classification identified by the International League
    Against Epilepsy (ILAE), seizures can be categorized into generalized and focal
    epileptic seizures [3]. Of those, focal epilepsy is more common than generalized
    [4]. It has been shown that epilepsy with focal seizures in the temporal lobe,
    which is termed temporal lobe epilepsy (TLE), is the most probable one with local
    seizures, and about 60% of all adult and adolescent epileptic patients suffer
    from this type of focal epilepsy. The mesial temporal lobe epilepsy (mTLE) with
    hippocampal sclerosis, identified by ILAE due to its prevalence, is the most common
    and intractable TLE [5,6] and more often refractory to medical treatment in adults.


    A drug-resistant patient who fails more than two optimal trials of anti-epileptics
    and has at least one seizure per month is considered a candidate for epilepsy
    surgery. In this case, a resection surgery can be an efficacious option and will
    be performed if an epileptic focus is localized with confidence [7,8]. Obviously,
    the success of surgical treatment in these cases is thoroughly dependent on the
    localization/lateralization accuracy provided by imaging, electrocortical, and
    neuropsychological testing. Congruent EEG, seizure semiology, and imaging studies
    in determining epileptogenic mesial temporal lobe can sufficiently satisfy the
    requirement of a successful epilepsy resective surgery, while in the presence
    of incongruent lateralization, patients may undergo intracranial electrode implantation,
    which has a major medical risk and financial cost [9].'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Hence, the determination of the primary origin of a patient’s seizure by advanced
    structural imaging techniques is one of the active areas in epilepsy research,
    due to its noninvasive nature. Among abnormality syndromes, mesial temporal sclerosis
    (MTS) is the best predictor of mTLE [10–12]. Several structural imaging modalities
    have been utilized to diagnose MTS and reduce the error and uncertainty in the
    lateralization of mTLE, as the most operated form of epilepsy. In this direction,
    the following neuroimaging modalities have been widely used for determining structural
    features that are well-suited to distinguish patients with right and left mTLE
    as well as patients with unilateral and bilateral abnormality: anatomical magnetic
    resonance imaging (T1-weighted MRI), fluid-attenuated inversion recovery (FLAIR),
    and diffusion tensor imaging (DTI) [13].


    Hippocampal sclerosis (HS) is the most frequent pathology encountered in patients
    with intractable TLE and has been recognized for at least 190 years [14,15]. Hardening
    or sclerosis of the hippocampus refers to severe neuronal cell loss and gliosis
    in the different hippocampal subfields, e.g., CA1 and CA4 [16]. The incidence
    rate of HR in mTLE has been reported to be 56% and has been widely used as the
    first feature in determining the most affected side, i.e., lateralization [17–19].
    Hippocampal sclerosis has been characterized on MRI by the use of volume loss
    on T1-weighted imaging, hyperintensity on T2-weighted imaging, and signal intensity
    change on FLAIR.


    Although the aforementioned structural changes in the hippocampus have been reported
    in up to 70% of cases, in several cases, these changes are undetectable, or the
    laterality of the epileptic focus merely based on them does not provide sufficient
    certainty for a successful surgery [20,21]. Hence, alterations in some adjacent
    structures, e.g., amygdala, have been added to these quantitative analyses to
    strengthen the classification. To document structural changes attributed to mTLE
    beyond alterations in the hippocampus and amygdala, several studies have been
    conducted and a variety of abnormalities associated with mTLE in gray matter and
    white matter were reported [20]. Among them, abnormalities in the entorhinal cortex,
    piriform cortex, thalamus, cingulum, fornix, and corpus callosum are well-known.


    It is widely assumed that neuronal cell loss and gliosis are associated with an
    increase in the free water in the tissue. Therefore, FLAIR, which provides a measure
    of free water in the tissue, has been considered as a standard technique for the
    investigation of neuronal cell gliosis and localization of focal epilepsy, especially
    in mTLS patients. However, many studies have shown that FLAIR lacks sufficient
    sensitivity in the lateralization'
  merge: -1
  img_proc: true
- pgno: 100
  md: "of mTLE patients and should be accompanied by other imaging features to achieve\
    \ satisfactory results.\n\nSince some studies have reported that a recognizable\
    \ portion of mTLE patients with pathologically confirmed hippocampal sclerosis\
    \ did not show clear abnormality symptoms on T1-weighted and FLAIR MRI [21], there\
    \ has been a compelling need to employ other imaging techniques. To this end,\
    \ it has been shown that DTI-based tractography can detect microstructural alterations\
    \ in brain tissues before any abnormalities can be seen on anatomical MRI. DTI\
    \ can play a specific role in investigating alterations in the white matter tracts\
    \ due to neuronal loss in the epileptic focus and in the extralimbic structures\
    \ due to widespread neural firing.\n\nIn the following sections, we describe five\
    \ recent studies, which have used the above MRI modalities to provide a set of\
    \ effective features that can be used in a machine learning approach to diagnose\
    \ epilepsy.\n\n# 6.2 LATERALIZATION INDICES/FEATURES  \nEXTRACTED FROM STRUCTURAL\
    \ MRI\n\nThe hypothesis behind the studies that focus on lateralization using\
    \ structural MRI is that the need for intracranial electroencephalography (iEEG),\
    \ i.e., phase II, can be minimized by optimizing the lateralization of mTLE using\
    \ a set of optimal imaging features and a model for laterality classification.\
    \ To lateralize mTLE, MRI has been widely used to extract several effective features\
    \ to detect MTS *in vivo* [22]. MTS is characterized by neuronal loss, gliosis/sclerosis,\
    \ granule cell dispersion, and mossy fiber sprouting in hippocampal specimens\
    \ [23]. Hippocampal volume reduction based on T1-weighted images and increase\
    \ in signal intensity in T2-weighted and FLAIR MRI have been the dominant features\
    \ used for the quantification of MTS [17,24–29]. It has been shown that these\
    \ features successfully lateralize the origin of epilepsy in up to 70% of the\
    \ cases, although in 15%–30% of the confirmed unilateral mTLE patients, a significant\
    \ hippocampal asymmetry has not been reported, i.e., subtle or even no evidence\
    \ of asymmetry is reported [8,17,30]. In such cases, additional structural features\
    \ may be needed to provide sufficient certainty in laterality declaration.\n\n\
    The second category of MRI features has been assessed by texture analysis. Texture\
    \ features provide information about signal intensity patterns in tissues and\
    \ have also been used in psychological disorders, like Alzheimer’s, multiple sclerosis,\
    \ and schizophrenia [31]. These signal patterns and their alterations relative\
    \ to histological changes in the hippocampus and other regions of interest have\
    \ been used as a complementary set of features for"
  merge: -1
  img_proc: true
- pgno: 101
  md: 'detecting hippocampal sclerosis as well as focal cortical dysplasia [32–34].
    In Ref. [31], several image intensity features of the hippocampal body—mean, standard
    deviation, and wavelet-based texture features—extracted from the FLAIR images
    were used to lateralize the site of epileptogenicity. The authors trained a linear
    classifier based on the right to left ratios of the aforementioned features to
    establish laterality. They showed that, in 75% of the cases, the mean and standard
    deviation of FLAIR intensities successfully lateralized the site of epileptogenicity.
    They also reported 64% and 75% success rates in lateralization based on the wavelet
    texture features and the hippocampal volumetric features, respectively.


    Although hippocampal texture analysis is an image analysis tool for MTS diagnosis,
    variance of the features extracted from the hippocampus has yielded an uncertainty
    in epilepsy lateralization, especially in the condition of incompatible electroencephalographic
    (EEG) lateralization. In cases with a lack of hippocampal imaging asymmetry, features
    extracted from neighboring structures, such as the amygdala, have been suggested
    and investigated as alternatives in many studies. These suggestions were based
    on the studies that showed, in the presence of an intact hippocampus, amygdala
    sclerosis (AS) in a subgroup of patients with mTLE [35]. Determination of amygdala
    atrophy as an indicator of neuronal loss and gliosis of the amygdala (AS) based
    on MRI is a challenging task, due to the small size and lack of structural distinction
    [35,36]. In Ref. [37], the mean signal and standard deviation of the FLAIR signal
    intensity in the amygdala have been proposed as complementary features that improved
    the accuracy of lateralization in mTLE patients.


    Some studies have indicated that the mentioned structural measures—T1-weighted,
    FLAIR—did not determine the side of epileptogenicity in several mTLE patients
    or misclassified them in bilateral epilepsy while the intracranial EEG (icEEG)
    clearly showed unilateral epileptogenicity in these patients. For example, Aghakhani
    et al. [38] reported that icEEG investigations found unilateral epileptogenicity
    in 73% of patients (1,026 out of 1,403) who had been categorized under bilateral
    mTLE. These pieces of evidence have encouraged many research groups to examine
    alternative noninvasive neuroimaging modalities, e.g., DTI, to detect and quantify
    the epilepsy-related alterations in neuronal microstructures to consequently improve
    lateralization of epilepsy patients [20,39].


    It has been hypothesized that hardening or sclerosis at the seizure focus in mTLE
    causes alterations in white matter tracts of the focus, which may be detected
    through white matter tractography [40]. For example,'
