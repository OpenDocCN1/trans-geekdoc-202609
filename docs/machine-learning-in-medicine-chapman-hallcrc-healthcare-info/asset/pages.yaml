  md: 'inhomogeneity correction was applied and then the right/left ratios were used
    as features.


    In Ref. [37], three linear classifiers distinguishing laterality were trained
    separately using hippocampal volumetry and amygdalar and hippocampal FLAIR features.
    Also, a boundary/uncertainty region was established for each linear classifier
    using two parallel lines between which 95% of the control subjects laid. To examine
    whether adding the amygdalar FLAIR features improved the lateralization process,
    the McNemar''s test was applied.


    # Study III: DTI-Based Response-Driven Modeling


    DTI can detect microstructural alterations induced by epilepsy through segmentation
    and fiber tracking. In Ref. [20], microstructural changes in the cingulum, fornix,
    and corpus callosum were exploited using DTI analysis to lateralize mTLE and distinguish
    unilateral and bilateral cases. The preprocessing algorithm included: (1) establishment
    of white matter structures—cingulum, corpus callosum, fornix, and their subregions—using
    DTI and (2) segmentation of the hippocampus and co-registering T1-weighted image
    to FLAIR to calculate the mean and standard deviation of the FLAIR intensity within
    the hippocampus.


    Before the establishment of the white matter structures, the DTI images were interpolated
    to provide a homogenous voxel size. For segmentation, in addition to fractional
    anisotropy (FA) and mean diffusivity (MD), the eigenvector associated with the
    largest eigenvalue of the diffusion tensor was calculated as the principal diffusion
    direction. Next, cingulum, corpus callosum, fornix, and their subregions were
    defined using seed-based segmentation and fiber tracking [52,53]. A typical segmentation
    result for these fibers is shown in Figure 6.2. For all the cohorts (i.e., right
    and left unilateral mTLE, bilateral mTLE, and control groups), FA and MD of 15
    subregions (including left and right of anteroinferior, superior, and posteroerior
    of the cingulum; the genu, astral body, anterior midbody, posterior midbody, isthmus,
    and splenium of the corpus callosum; and the anterior body, and left and right
    crus of the fornix) were estimated. The set of features used to lateralize mTLE
    and detect unilaterality were:


    +   1. hippocampal volumetry,

    2. hippocampal mean and standard deviation of FLAIR intensity, and

    3. FA in corpus callosum, cingulum, and fornix regions.'
