    # 4.1 INTRODUCTION


    Thermal ablative therapy is a type of cancer treatment in which cancer cells are
    killed in situ by inducing temperature alteration to cause cellular coagulation
    necrosis. The commonly deployed thermal ablative methods include hyperthermia
    (e.g., ablation using radiofrequency (RFA), microwave (MWA), laser and high-intensity
    focused ultrasound (HIFU)) and hypothermia (cryoablation), among which RFA is
    currently the most recommended first-line ablation technique [1]. In the treatment
    of hepatic cancers, thermal ablative therapy allows the treatment of primary (mainly
    hepatocellular carcinoma (HCC)) and secondary liver tumours without surgery and
    provides an alternative for patients who are not suitable for surgery or who do
    not wish to have surgery. Thermal ablation of small (<3 cm) liver tumours is very
    effective, achieved complete tumour necrosis in nearly all patients and provided
    similar survival outcomes to those undergoing liver resection [2]. It can achieve
    excellent long-term overall and tumour-specific survivals as a first-line stand-alone
    or bridge therapy to liver transplantation [3]. Moreover, the deployed methods
    in thermal ablative therapy are typically minimally invasive (such as percutaneous
    RFA) or non-invasive (such as HIFU), which are associated with benefits of less
    morbidity and mortality than those undergoing surgery.


    To assist the operator of thermal ablation with better patient safety and greater
    ablation accuracy, computer-assisted treatment planning and analysis are becoming
    increasingly important to provide in silico analysis and estimation of tissue
    temperature and thermal damage [4]. To enable the operator of ablation to visualise
    the simulated results immediately to aid the treatment procedures, the numerical
    computation demands real-time solutions. It was reported that real-time computation
    and analysis of soft tissue temperature and associated thermal doses could help
    to improve the safety and effectiveness of the treatment [5] by precise management
    of the thermal energy to produce desired thermal damage to the tumour while'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'avoiding thermally hot-spots and unintended thermal injuries in the surrounding
    healthy tissues. Not only can it lead to technological advancement in clinical
    procedures but also practical improvement in patient outcomes.


    However, most of the conventional numerical methods [6–8] were developed for accurate
    approximation of the characteristics of bio-heat transfer in soft tissues without
    considering the need for fast computation. For instance, it was reported that
    using conventional methods to simulate a process of thermal ablation consumed
    calculation time ranging from several minutes to a few hours [9], which was primarily
    attributed to solving the non-linear bio-heat transfer at each time step during
    the simulation. Based on the finite difference method (FDM) [10], Schwenke et
    al. [11] and Kalantzis et al. [12] studied graphics processing unit (GPU)-based
    techniques for fast simulation of focused ultrasound treatments. Zhang et al.
    [13,14] and Mariappan et al. [15] presented GPU-accelerated finite element methodologies
    for high-speed solutions of bio-heat transfer for thermal ablation. He and Liu
    [16] devised an alternating direction explicit method, and Carluccio et al. [17]
    developed a methodology based on spatial filters to reduce computation time. Other
    methods such as fast explicit dynamics finite element algorithms [18,19], fast
    Fourier transform-based FDM algorithm [20], model order reduction method [21],
    finite volume-based multi-grid methods [22,23] and meshless point collocation-based
    dynamic mode decomposition method [24] were also studied for fast bio-heat transfer
    analysis.


