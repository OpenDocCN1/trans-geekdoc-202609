    # 9.5 CONCLUSION


    In this chapter, we highlight three practical issues that can arise while deploying
    an ML model for medical image segmentation or computer-aided diagnosis problems.
    We tackle the heavy dependence on large training datasets of deep learning models
    with transfer learning, where we show that utilizing transfer learning from natural
    images can significantly improve the performance of Alzheimer''s diagnosis. To
    address the issue of class imbalance, which is prevalent for medical image segmentation,
    we propose a novel FTL, which, combined with Attention U-Net, results in state-of-the-art
    lesion segmentation performance on a benchmark breast ultrasound dataset. Finally,
    we propose a confidence tuning tool utilizing a Bayesian neural network, where,
    through two simple hyperparameters (sampled number of networks and minimum probability),
    a neural network''s accuracy-coverage tradeoff can be tuned to the need of the
    domain expert.


    Although the three sections showed promising results, more work needs to be done
    to ensure the robustness of the proposed methods before they can be deployed in
    a clinical setting. For transfer learning, we are investigating whether our solution
    can be generalized to solve computer-aided diagnosis problems in domains other
    than Alzheimer''s. For our proposed loss function, our next step is to investigate
    how the solution performs for different types of imbalanced classification problems,
    especially to investigate how the transfer learning approach can be combined with
    the proposed loss function. For confidence tuning, an end-to-end Bayesian learning
    approach on top of transfer learning to keep the computational requirement manageable
    is something we would be exploring in the future.


