    # 7.1.1 Ultrasound Imaging


    US imaging has been commonly used in routine clinical practice for diagnosis and
    visualization of internal organs (e.g. liver, kidney, and heart) and superficial
    structures (e.g. thyroid, breast, carotid artery, and muscles). An US transducer
    uses a piezoelectric material that converts electrical energy to mechanical movement,
    which transmits and receives sound waves with frequencies higher than human hearing.
    It generates US waves and trans-mits into the tissue and listens to receive the
    reflected sound wave (echo). The reflected echo signal is recorded in order to
    construct an image of the'
