- pgno: 64
  md: 'Due to the propagation of ultrasound in the tissue, an acoustic pressure field
    is developed, which is used to obtain the HIFU-induced heat sources owing to the
    attenuation of ultrasound in tissues in the form of heat. Since the simulated
    ultrasound field was non-linear in which higher harmonic frequencies occur, the
    harmonic components were used to determine the non-linear heat source *H*, i.e.,


    $$H = \frac{1}{\rho c} \sum_{k=1}^{K} \alpha_k p_k^2 \qquad (4.25)$$


    where *c* is the sound speed in tissues, $\alpha_k$ is the coefficient of attenuation
    of the *k*th harmonic with a frequency power law of the form $\alpha = \alpha_0
    \omega^y$ [59] (in our case *y* = 1.3), $\omega$ is the angular frequency, *p**k*
    is the acoustic pressure of the *k*th harmonic component and *K* is the number
