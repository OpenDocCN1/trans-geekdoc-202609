    # 7.1.4 AI-Powered US in Cardiology


    Cardiac US, also known as echocardiography (echo), is currently the most widely
    used noninvasive imaging modality for the assessment of structures and functions
    of the heart (e.g. left ventricular ejection fraction, cardiac output, diastolic
    function, and valvular diseases). AI-powered echocardiography could be used for
    low-cost, serial, and automated evaluation of cardiac structures and function
    by experts and nonexperts in cardiology, primary, and emergency clinics. This
    would also allow triaging incoming patients with chest pain in an emergency department
    and longitudinal monitoring of patients with cardiovascular risk factors in a
    personalized manner. With the advancing US technology, the current clinical cart-based
    US systems could be replaced with portable point-of-care ultrasound (POCUS) systems.
    GE Vscan, Butterfly IQ, and Philips Lumify are popular POCUS devices. A single
    Butterfly IQ probe contains 9,000 micro-machined semiconductor sensors and emulates
    linear, phased, and curved array probes. While Butterfly IQ probe using US-on-chip
    technology could be used for imaging the whole body, Philips Lumify provides different
    probes for each organ (e.g. s4-1 phased array probe for cardiac applications).
    GE Vscan comes with two transducers placed in one probe and can be used for scanning
    deep and superficial structures. Using POCUS devices powered with cloud-based
    AI echo interpretation at point of care locations could significantly reduce the
    US cost and increase the utility of AI-powered echocardiography by nonexperts
    in primary and emergency departments (Figure 7.4). A number of promising studies
    using DL approaches have been published for the classification of standard echo
    views (e.g. apical and parasternal views), segmentation of heart structures (e.g.
    ventricle, atrium, septum, myocardium, and pericardium), and prediction of cardiac
    diseases (e.g. heart'
