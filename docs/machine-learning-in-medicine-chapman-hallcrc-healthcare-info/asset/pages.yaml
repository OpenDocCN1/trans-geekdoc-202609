- pgno: 11
  md: '# # Preface


    THIS BOOK COVERS THE STATE-OF-THE-ART TECHNIQUES OF MACHINE learning and their
    applications in the medical field. Computer-aided diagnosis (CAD) systems have
    played an important role in the diagnosis of several diseases in the past decade,
    e.g., cancer detection, resulting in developing several successful systems. However,
    the robustness of these systems does not meet the requirements of real-world diagnostic
    situations and still requires significant improvement. The rapid progress in the
    development of machine learning algorithms makes it promising to have machines
    in the near future that are capable of completely performing tasks that currently
    cannot be completed without human aid, especially in the medical field. For example,
    the application of Convolutional Neural Network (CNN) methods in biomedical image
    analysis has recently resulted in the development of some CAD systems that aim
    towards the automatic early detection of several diseases. This will be covered
    in the book. Among the topics discussed in the book are CNNs with different activation
    functions for small- to medium-size biomedical datasets, detection of abnormal
    activities stemming from cognitive decline, thermal dose modeling for thermal
    ablative cancer treatments, dermatological machine learning clinical decision
    support system, artificial intelligence-powered ultrasound for diagnosis, practical
    challenges with possible solutions for machine learning in medical imaging, epilepsy
    diagnosis from structural MRI, Alzheimer''s disease diagnosis, classification
    of left ventricular hypertrophy, and intelligent medical language understanding.


    In summary, the main aim of this book is to help advance scientific research within
    the broad field of machine learning in the medical field. The book focuses on
    major trends and challenges in this area,'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'and it presents work aimed to identify new techniques and their use in biomedical
    analysis.


    Ayman El-Baz

    Jasjit S. Suri'
  merge: -1
  img_proc: true
