    a strong error signal and mitigate sub-optimal convergence. We hypothesize that
    using a higher *α* in our generalized loss function will improve model convergence
    by shifting the focus to minimize FN predictions. Therefore, we train all models
    with *α* = 0.7 and *β* = 0.3. It is important to note that in the case of *α*
    = *β* = 0.5, the Tversky index simplifies to the DSC. Moreover, when *γ* = 1,
    the FTL simplifies to the TL.


    To obtain an even better precision and recall, we follow the improvements proposed
    to U-Net in Ref. [20] and combine them with the FTL. However, even after utilizing
    the attention-based architecture in Ref. [20], we saw that minor spatial details
    in lesions were getting lost through multiple layers of convolution, since convolution
    operations tend to blur out minute details. To address this issue, we use soft
    attention gates to identify relevant spatial information from low-level feature
    maps and propagate it to the decoding stage. To ease the access of details at
    different scales even further, we directly feed multi-scale versions of the input
    image (through forming an image pyramid) to the encoder layers. Combined with
    deep supervision, this method improves segmentation accuracy for datasets where
    small ROI features can get lost in multiple stages of convolutions and facilitates
    the network learning more locality-aware features, which in turn can improve segmentation
    performance. The proposed network architecture can be seen in Figure 9.2.


    To show the effectiveness of the proposed FTL with attention U-Net, we perform
    experiments on the Breast Ultrasound Lesions 2017 dataset B (BUS) [22],³ where
