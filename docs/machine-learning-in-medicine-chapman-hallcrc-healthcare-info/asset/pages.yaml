  md: 'The gradient of ReLU is


    ```

    $$\frac{dy_i}{dx_i} = f''(x_i) = \begin{cases} 0, & x_i < 0 \\ 1, & x_i \geq 0.
    \end{cases}$$

    ```


    # 5.2.2 Leaky ReLU


    Leaky ReLU [18] (see Figure 5.1) is defined as


    ```

    $$y_i = f(x_i) = \begin{cases} ax_i, & x_i < 0 \\ x_i, & x_i \geq 0 \end{cases}$$

    ```


    where $a$ is a small real number ($a = 0.01$ here). As noted in the Introduction,
    this function, unlike ReLU, has no point with a null gradient:


    ```

    $$\frac{dy_i}{dx_i} = f''(x_i) = \begin{cases} a, & x_i < 0 \\ 1, & x_i \geq 0
    \end{cases}$$

    ```


    # 5.2.3 ELU


    Exponential Linear Unit (ELU) [19] (see Figure 5.1) is defined as


    ```

    $$y_i = f(x_i) = \begin{cases} a(\exp(x_i)-1), & x_i < 0 \\ x_i, & x_i \geq 0
    \end{cases}$$

    ```


    where $a$ is a real number ($a = 1$ here).


    ELU is differentiable and has a gradient that is always positive (as with Leaky
    ReLU) and bounded from below by $-a$. The gradient of ELU is given by


    ```

    $$\frac{dy_i}{dx_i} = f''(x_i) = \begin{cases} a \exp(x_i), & x_i < 0 \\ 1, &
    x_i \geq 0 \end{cases}$$

    ```'
