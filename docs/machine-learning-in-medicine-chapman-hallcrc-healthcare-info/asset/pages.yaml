  md: '# CHAPTER 2


    # Dermatological Machine Learning Clinical Decision Support System


    Pushkar Aggarwal


    *University of Cincinnati College of Medicine*


    *Cincinnati, Ohio*


    # CONTENTS


    +   2.1  Background  9

    2.2  Melanoma  10

    2.3  Non-Melanoma Machine Learning  11

    2.4  Non-Skin Image Recognition Machine Learning  12

    2.5  Data Augmentation  13

    2.6  Limitations  14

    2.7  Future Directions  15

    2.8  Conclusion  16

    References  16


    # 2.1  BACKGROUND


    Dermatology is a subject that relies on morphological features and the majority
    of diagnoses are based on visual pattern recognition. At present, the skin imaging
    technology is represented by dermoscopy, very high-frequency ultrasound, and reflectance
    confocal microscopy. Each method of skin imaging equipment has its own advantages
    and limitations. Dermatologists need to choose different imaging methods according
    to different conditions of skin lesions. The skin imaging technology has become
    a vitally important tool for clinical diagnosis of skin diseases'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'and is widely accepted and applied worldwide [1]. As such, dermatology is exceedingly
    suitable for applying artificial intelligence (AI) image recognition capabilities
    for assisted diagnosis.


    In 2013, one out of every four Americans saw a physician regarding a skin disease
    [2]. The overall prevalence of skin disease in the U.S. is estimated to be around
    27%. In those who are 65 years or older, the prevalence increases to around 49%,
    and the average number of skin diseases per person increases from 1.6 to 2.2.
    Furthermore, of the total number of deaths in 2013, skin disease accounted for
    almost 1 out of every 100. Assuming a potential life expectancy of 75 years, it
    was found that fatal skin disease resulted in almost 11 years of potential life
    loss [2]. Melanoma is the most deadly skin cancer, accounting for 75% of all skin
    cancer-related death, and is responsible for over 10,000 deaths annually in the
    U.S. [3]. Melanoma is the leading cause of cancer death in 25–30 years old women
    and the second most commonly diagnosed cancer in those who are 15-29 years of
    age [4]. The incidence of melanoma doubled from 11.2 per 100,000 people in 1982
    to 22.7 per 100,000 people in 2011. Other skin conditions while not being as deadly
    as melanoma can still have a significant impact on a person. Acne affects about
    50 million Americans annually and is the most common skin condition in the U.S.
    [5]. Rosacea and psoriasis affect about 15 million people and 8 million people
    in the U.S., respectively [6,7]. Non-melanoma skin cancer and melanoma combine
    for about $6 billion in medical costs each year. Other skin conditions such as
    acne, psoriasis, seborrheic dermatitis, and atopic dermatitis account for $846,
    $737, $339, and $314 million each year, respectively [2]. Therefore, AI implementation
    in dermatology has the potential to significantly benefit the health and finances
    of a large part of the population.


    AI applies automated learning and provides output based upon large data. Previously,
    large data were not available or were not assimilated together in a standardized
    form. The advent and extensive use of computers have helped in assimilating large
    data sets in many medical fields, including dermatology. AI tries to mimic the
    human brain in reproducing human cognition and can be an asset in dermatology
    clinical evaluations.


    # 2.2 MELANOMA


    Much of the machine learning implementation in the field of dermatology encompasses
    the binary classification of malignant melanoma versus benign nevi. One criterion
    that is often used in the clinical diagnosis of melanoma is the ABCDE criteria
    – asymmetry, border (irregular), color'
  merge: -1
  img_proc: true
- pgno: 31
  md: '(two or more colors), diameter greater than 6 mm, and enlargement or evolution
    in size [8]. The first four criteria are potential criteria that a machine learning
    algorithm can use during its assessment of the lesion.


    One of the major studies in the field of machine learning in melanoma diagnosis
    involved training a convolutional neural network (CNN) with about 130,000 images
    that encompassed more than 2,000 different diseases [9]. This CNN was then used
    to classify melanocytic lesions as either benign or malignant. The analysis was
    performed separately on photographic images and on dermoscopic images. On photographic
    images, the CNN has an area under the curve (AUC) of 0.96 when tested on 225 images,
    and on dermoscopic images, the CNN has an AUC of 0.94 when tested on 1,010 images.
    In this study, dermatologists were also shown the same test images that were inputted
    into the CNN, and the dermatologists were asked to classify each image as benign
    or malignant. For both the photographic and dermoscopic images, the CNN outperformed
    the average dermatologist in this classification.


    A similar study was performed to assess the performance of machine learning in
    differentiating between malignant melanoma and benign melanocytic as compared
    to the ability of dermatologists to do the same [10]. In this study, dermatologists
    were first given the image and asked whether the lesion was benign or malignant.
    Next, they were provided clinical information and supplemental close-up images
    and asked to perform the same differentiation. At the dermatologists’ mean sensitivity,
    the CNN had a statistically significant higher specificity than the dermatologists’
    specificity. The statistically significant higher specificity of the CNN occurred
    in the stage in which dermatologists were not given clinical information and supplemental
    close-up images and in the stage in which they were given that information. Furthermore,
    the mean AUC of the CNN was higher than the mean receiver operating curve area
    of dermatologists in both stages. This study shows that even with a lack of clinical
    information, the machine learning neural network was able to outperform dermatologists.
    Overall, machine learning has been shown to provide very good results in differentiating
    malignant melanoma from benign nevi.


    # 2.3 NON-MELANOMA MACHINE LEARNING


    Machine learning has been implemented in the dermatological field beyond just
    binary classification of malignant melanoma. Some examples include classification
    of acne, rosacea, impetigo, psoriasis, atopic dermatitis, seborrheic dermatitis,
    lichen planus, and pityriasis rosea, among many'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'more [11,12]. Some of these neural networks were tasked with classifying multiple
    different diseases as compared to a binary classification. This not only presents
    a significant challenge for the neural network, but also simulates real-world
    conditions better.


    One study examined the ability of a CNN as a binary classification for onychomycosis.
    The CNN was trained with over 49,000 images and was found to have a higher diagnostic
    accuracy than dermatologists who were given the same test images [13]. Another
    study used machine learning to classify ten types of lesions – actinic keratosis,
    basal cell carcinoma, melanocytic nevus/mole, squamous cell carcinoma, seborrhoeic
    keratosis, intraepithelial carcinoma, pyogenic granuloma, hemangioma, dermatofibroma,
    and malignant melanoma [14]. As one would expect, the more classifying categories
    that the model is expected to differentiate, the lower the accuracy. Part of this
    is due to the limited number of images that are often available for some of the
    categories. Also, the chances of the model guessing and getting the correct answer
    have decreased fivefold from a binary classifier to a ten-category classifier.
    In the study, the ten-category classifier model had an accuracy of 81.8% while
    another run was performed with the model being only a five-category classifier
    (the first five of the ten types of lesions are listed above) and this model had
    an accuracy of 85.8%. Both of these models still showed good accuracy but also
    demonstrated the effect of increasing the number of categories. In order to keep
    the accuracy high as the number of categories for the model to classify increases,
    it will be imperative to input clinical information such as age, gender, race,
    time of onset, duration, location, irritation, itching, stinging, type of discharge,
    evolution, and family history among others to the neural network. This is likely
    the next step in the field of machine learning in dermatology.


    # 2.4 NON-SKIN IMAGE RECOGNITION MACHINE LEARNING


    The primary thought that comes to mind when thinking of the applicability of machine
    learning in the field of dermatology is the use of skin images to classify diseases.
    However, machine learning encompasses far more as it can use all types of data
    (pixelated or non-pixelated).


    Apart from image recognition, machine learning has to been used to predict the
    severity of epidermolysis bullosa simplex [15]. In this study, the neural network
    was provided the position and type of mutation in the genome and tasked with predicting
    the severity of the disease. The model had a 78% accuracy rate, although the training
    and testing data were'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'limited. However, this provides an example of the non-image recognition application
    of machine learning in dermatology. Another study used near-infrared Fourier transform
    Raman spectra to assess the ability of a neural network in the diagnosis of melanoma
    [16]. As opposed to feeding the neural network skin images of the lesion, punch
    biopsies were performed, and then an interferometer was used for obtaining the
    Raman spectra. The neural network had a sensitivity of 85% and a sensitivity of
    99% for the diagnosis of melanoma. This is another example of how information
    other than skin images can be used by neural networks in aiding the clinician''s
    diagnosis.


    # ## 2.5 DATA AUGMENTATION


    In the last few years, there has been a major push to develop methods to improve
    the accuracy of neural networks. One such method is through the use of data/image
    augmentation. This technique involves the use of various techniques such as cropping,
    altering brightness, and altering shear among others in order to simulate the
    real-world variability of images and to provide the neural network with multiple
    images from just one image. The latter is especially important as there is a paucity
    of high-quality dermatological images with an associated accurate and verified
    diagnosis. In addition, the data augmentation can help to decrease the likelihood
    of overfitting of the model. Data augmentation has been implemented in dermatological
    machine learning with good results.


    For example, a deep learning model that was used to classify acne, atopic dermatitis,
    rosacea, psoriasis, and impetigo was re-run with data augmentation in order to
    assess its impact on the model [11]. Data augmentation techniques used in this
    analysis included rotation, zoom, shear, and horizontal and vertical flipping.
    These techniques helped to provide the model with some of the variability that
    can exist in the location and size of the lesion and also the angle at which the
    image is taken. Addition of these data augmentation techniques resulted in an
    average Matthews correlation coefficient increase of 7.7%. Furthermore, the AUC
    for each of the dermatological conditions being classified increased. The mean
    AUC increase was 13.2% with a standard deviation of 0.033. These results highlight
    the significant improvement that data augmentation can have on the accuracy of
    the deep learning models in classifying dermatological lesions. Furthermore, it
    can be especially useful when the deep learning model is classifying multiple
    conditions/diseases as opposed to being a binary classifier.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'In another example, in the classification of melanoma using a deep learning
    model, eight augmentation techniques and a combination (mix and match) of these
    eight were implemented and assessed for their improvement/decrement in the accuracy
    of the model [17]. The augmentation techniques included saturation, contrast,
    and brightness; saturation, contrast, brightness, and hue; affine (rotate, shear,
    scaling, and adding pixels symmetrically at the edge); flipping; cropping; random
    replacement of image with noise; warping; and mixing two lesions into one image.
    These changes can help to account for the variability in images taken by different
    cameras, by different picture takers and account for the variability in the setting/background
    among others. Another feature of this study was that three different CNNs were
    run in parallel to account for the variability among the CNNs. The study found
    that geometric augmentation (affine, cropping, and warping) had a more consistent
    improvement in all three CNNs than did color augmentation (saturation, contrast,
    brightness, and hue). Some augmentation techniques such as random erasing resulted
    in worse performance or only slight improvements in the model. Cropping was shown
    to significantly improve the accuracy of the model. The highest AUC in this study
    was found with the following combined augmentation techniques: random cropping,
    affine, flipping, and saturation and contrast, brightness, and hue. Overall, data
    augmentation has proven to be a very useful method by which the accuracy of a
    neural network can be improved. More complex data augmentation techniques such
    as Gaussian blur are likely to be implemented in the future to dermatological
    image analysis to assess their impact on the model.


    # 2.6 LIMITATIONS


    Some of the issues/limitations with the adaptation of AI at present are enumerated
    below:


    +   a. Ethical issues and data privacy in sharing of patient data and images


    +   b. Quality of images taken by patients or under sub-optimal lighting conditions


    +   c. Lack of standardization of training images


    +   d. Transportability/sharing of images


    +   e. Quality and capability of image recognition programs'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   f. Reliability – sensitivity and specificity of output

    g. Lack of integration of clinical symptoms, patient characteristics, other disease
    status, etc.

    h. Lack of clinical expertise and clinical experience of health professionals
    in the programs

    i. Lack of integration of genetic characteristics

    j. Software programmers and physicians – experts in their own fields – are less
    likely to integrate their thoughts/expertise

    k. Complex and multitude of dermatology manifestations

    l. Deciphering the root cause of the dermatological manifestation

    m. Legal issues

    n. Regulatory issues and commercialization

    o. Lack of humanity and care of physicians/communication with patients

    p. Integration of cognitive recognition/computing

    q. Differentiating similar dermatological manifestations due to underlying different
    clinical conditions.


    # 2.7 FUTURE DIRECTIONS


    The future of AI in dermatology will be the integration of various AI applications
    in medicine and not just solely dermatological image recognition. The following
    AI applications may be integrated.


    +   a. Lab and diagnostic test results interpretation using AI

    b. Personal characteristics (sex, race, age, etc.) disposition to some diseases
    using AI

    c. Clinical symptoms processing using AI

    d. Cognitive computing

    e. Genetic dispositions and changes in genetic markers

    f. Latest research and guidelines for diagnosis as well as probable treatments'
  merge: -1
  img_proc: true
- pgno: 36
  md: '+   g. Changes in images during the treatment phase


    +   h. Adverse event analysis from various probable treatments


    The output of the AI model would be the probable diagnosis aid as well as the
    probable treatment direction for consideration by the dermatologist. The clinical
    decision support system would aid the dermatologist not only in accurate diagnosis
    and treatment therapies, but also in monitoring the progress/remission of the
    disease.


    # 2.8 CONCLUSION


    Machine learning has been used in various aspects in the field of dermatology.
    A large part of the already conducted research has been on the diagnosis of melanoma
    using machine learning. However, other skin diseases such as psoriasis and atopic
    dermatitis are also being integrated. In addition, non-image machine learning
    for both diagnosing and for prognosis/severity of dermatological conditions has
    also been developed. Future research will likely consist of developing ways to
    improve the accuracy of the model, for example, by addition of new data augmentation
    techniques or improvement/fine-tuning of old data augmentation techniques and
    by the addition of clinical information such as age, gender, race, time of onset,
    location, evolution, and family history to the dermatological image being used
    to train the neural network. In the coming years, AI has the potential to provide
    a second opinion and ultimately expert opinion to the dermatologists and act as
    a clinical decision system with high sensitivity and specificity.


