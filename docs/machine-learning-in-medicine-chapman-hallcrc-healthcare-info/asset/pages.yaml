    tumour material properties at different regions. Compared to the conventional
    area of applications of CNN, which is primarily used for image processing, the
    presented CNNs are formulated to incorporate the mechanism of bio-heat transfer
    for efficient and effective computation of the soft tissue temperature field and
    for computer-assisted thermal ablative cancer treatments.


    The computation for thermal doses (Eq. 4.1) indicates that the quantity of thermal
    doses is affected by the tissue heat exposure history, which is associated with
    the tissue temperature and heating duration. As the variation'
