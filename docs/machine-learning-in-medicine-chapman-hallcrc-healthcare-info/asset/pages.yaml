    intelligence in the detection of diabetic retinopathy [7]. In this study, 900
    people with a history of diabetes but no history of diabetic retinopathy were
    enrolled. The study population consisted of mostly Caucasians and African Americans
    but also included Asians (1.5%), American Indians or Alaskan Natives (0.4%), and
