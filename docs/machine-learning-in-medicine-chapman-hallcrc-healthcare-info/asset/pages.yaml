- pgno: 132
  md: 'B-mode ultrasound: It is also called as brightness mode (B-mode) and is the
    most well-known US image. An US beam is scanned across a tissue to construct a
    2D cross-section image of the tissue.


    M-mode ultrasound: Motion mode (M-mode) is used to examine motion over time. For
    example, it provides a single scan line of the heart and all of the reflectors
    along this line are shown along the time axis to measure the temporal resolution
    of the cardiac structures.


    Doppler ultrasound: A change in the frequency of a wave occurs when the source
    and observer are moving relative to each other, and this is called the Doppler
    effect. An US wave is transmitted with a specific frequency through an US probe
    (the observer). The US waves that are reflected from moving objects (e.g. red
    blood cells in vessels) return to the probe with a frequency shift. This frequency
    shift is used to estimate the velocity of the moving object. In blood flow, the
    velocity of red blood cells moving towards and away from the probe is recorded
    to construct Doppler images. The velocity of information overlaid on top of B-mode
    anatomical images to show color Doppler images of blood flow.


    Ultrasound Shear Wave Elastography (SWE): This technique provides a 2D stiffness
    map of tissue cross-sections. An acoustic radiation force generated with an US
    probe is used to induce a push force inside the tissue of interest and generates
    shear waves. The stiffness of a tissue can be measured from the speed of the resulting
    shear wave that travels through the medium. Therefore, SWE is able to characterize
    the mechanical and elastic properties of various body parts, and it can potentially
    be used in liver, musculoskeletal, thyroid, and breast imaging.


    Contrast Enhanced Ultrasound (CEUS): CEUS is a functional imaging that suppresses
    anatomical details but visualizes blood flow information. It exploits the nonlinear
    response of US contrast agents (lipid-coated gas bubbles). Generally, two consecutive
    US signals are propagated through the same medium and their echo response is subtracted
    to obtain a contrast signal. Since the tissue generates linear echo response,
    the subtraction cancels out the tissue signal and only the difference signal from
    nonlinear responses of bubbles remains. This imaging technique is used to examine
    cardiac chamber cavities, assess carotid artery stenosis, and evaluate prostate
    and liver'
  merge: -1
  img_proc: true
