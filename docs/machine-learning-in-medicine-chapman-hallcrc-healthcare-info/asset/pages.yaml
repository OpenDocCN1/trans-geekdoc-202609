    While repetition-related abnormal behavior is detected better by LSTM, abnormal
    activities stemming from confusion is recognised better by CNN because of its
    ability to detect variances in feature patterns. The activation order and the
    relationship between the sensors form steps of activities. When we think about
    the activity of going to the toilet, it is observed that a person first goes out
    of bed, walks through the bedroom and then goes to the toilet. As CNN exploits
    the spatial neighbourhood of the features, it can model this kind of patterns.


    The combination of RNNs and CNNs performs the best results since they encode both
    temporal and spatial information coming from the sensors. However, they fail to
    understand the intrinsic structure of activities. Thus, we need hierarchical models
    to understand the sub-activities and their relationships in a given activity and
    relate them to cognitive decline related to abnormal behavior.


    # ## 10.6 CONCLUSIONS AND FUTURE WORK


    # ### 10.6.1 Conclusion


    The main goal of this study was to detect abnormal behavior of ageing persons
    with dementia in the daily routines. Elderly people suffering from dementia tend
    to confuse things or repeat and skip certain activities in their daily life patterns.
    Firstly, a method was proposed to synthesise abnormal behavior stemming from dementia.
    For this purpose, two types of abnormal behavior were generated, which are activity-
    and sub-activity-related anomalies. Secondly, deep learning methods such as RNNs
    and CNNs were exploited to detect abnormal behavior. Thirdly, we compared these
    methods with the traditional machine learning methods such as HMMs, CRFs, Support
    Vector Machines and Naive Bayes methods. The results show that the proposed methods
    are competitive with the state-of-the-art machine learning methods.


    First of all, given the scarcity of real-world data available, we proposed a method
    to manually synthesise abnormal activities to mimic the activity routines of ageing
    persons. We modified some instances of datasets already available in the literature.
    The modification was done through'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'injection of abnormal activities in normal daily life activity sequences. We
    specifically aimed to simulate repetition, sleep disorder and confusion types
    of abnormal behavior. Repetition and sleep disorder-related abnormal behavior
    occur at the activity level while confusion-related abnormal behavior occurs at
    the sub-activity level of activities. However, generating abnormal behavior in
    this method may fail to reflect user-specific abnormal behavior since people show
    different habits at different times.


    Secondly, the activity recognition problem was emulated as a sequence labelling
    problem where time-series data of sensor measurements were treated as a sequence.
    Then, daily life patterns were modelled exploiting RNNs and their variants, namely
    Long Short Term Memory, Gated Recurrent Units and Vanilla versions, and CNNs.
    Results with RNNs and CNNs showed that capturing the activity instances and their
    temporal and spatial relationship was helpful to understand the daily life patterns
    and their relationships with other activities. With RNNs, we were able to encode
    the temporal information in daily life in order to model personal environments
    for dementia support. With CNNs, we tried to extract meaningful and fruitful patterns
    in the activities and with the help of these patterns, activities were recognised
    and anomalies were detected. These models were good at detecting anomalies related
    to repetition of activities and sleep disturbances. However, they are not capable
    enough to detect anomalies related to confusion since they cannot model sub-activities
    in an activity. RNNs and CNNs cannot model daily activities at the granular- level,
    so they cannot understand which sub-activities in these activities are forgotten,
    repeated and confused. Modeling these sub-activities would give a better understanding
    of activity recognition.


    # 10.6.2 Future Work


    One possible extension of this research would be to take the OFF status of the
    sensors into account and investigate their impact to detect anomalies. Also, specific
    features or rules can be considered to understand if a sensor (e.g. item sensors
    representing medicine or a fridge door sensor to check if it closed or not) is
    left OFF or not. New features to represent sensor events could be proposed to
    cover more different types of abnormal behavior (such as forgetting the location
    of objects at home and confusing how to use kitchen utilities) of the cognitive
    status of the elderly.


    When the disease is progressing slowly, our proposed method might fail to adapt
    and detect the abnormal behavior. Thus, real-world data can be collected in which
    gradual deterioration is observed. Moreover, different'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'types of abnormal behavior reflecting dementia-specific habits can be considered.
    If no real-world data can be collected, simulation methods to artificially generate
    these kinds of behavior can be proposed.


