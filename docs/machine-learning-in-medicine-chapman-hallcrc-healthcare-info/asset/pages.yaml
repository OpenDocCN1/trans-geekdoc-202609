    # 10.5.5 Results with Convolutional Neural Networks


    Given the $N \times M$ input matrix where $N$ is the time-window and $M$ is the
    number of sensor readings, different network architectures as shown in Figure
    10.2 have been tested on the Aruba dataset.


    **1D Convolution**: Convolution is applied on one only dimension as seen in Figure
    10.2a, where 100 filters (length of 10) are applied to the temporal dimension.
    Then a max-pooling layer (stride = 2) and another convolutional layer of 50 filters
    (length = 5) with a max-pooling layer are added. A flattened layer is added to
    flatten the features, and then three dense layers with hidden neurons of 512,
    128 and 50 are added. Lastly, a soft-max layer is added to produce confidence
    values to class labels.


    ![](img/6554116edbb19a8210b75a29243fd6ec_199_0.png)


    FIGURE 10.2 a) 1D CNN network b) 2D CNN network c) 2D CNN and LSTM network.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '**2D Convolution:** Convolution is applied on both dimensions as seen in Figure
    10.2b, where 100 filters (size of $10 \times 34$) are followed by a max- pooling
    ($2 \times 2$) layer. The second convolution layer is added (with 20 filters of
    the size of $5 \times 34$) and followed by a flattened layer and a soft-max.


    **CNN and LSTM (2D CNN + LSTM):** Because CNNs don''t have the ability to encode
    temporal history, they are combined with LSTM, where the two-layer 2D-CNN mentioned
    above is merged with two LSTM layers (hidden layers of size $30 \times 50$). This
    is followed by two dense layers (128 and 50 hidden units) and a soft-max layer
    for classification.


    Following Ref. [24], the Aruba dataset is divided into train and test sets based
    on a day in order not to lose the temporal information. For training, 150 days
    of the Aruba dataset are used, while 15 days are used for validation and the other
    days are used for testing. The adlnormal set of WSU is used for training while
    the adleror version is used for testing.


    The first experiment was performed on Aruba to choose the best input representation
    that gives the highest recognition results. This experiment is performed with
    the LSTM classifier on 1-minute time slices of sensor readings. Extracted slices
    are mapped into binary, change-point and last- fired representations. As seen
    in Table 10.6, last-fired representation gives the highest precision and recall
    rates as well as a good accuracy rate (accura- cy rates of 87.72%, 49.69% and
    48.79% for last-fired, binary and change- point respectively). A combination of
    the best two features: change-point and last-fired, gives a slightly better accuracy
    rate (87.78%) than last-fired alone but results in lower precision and recall
    values. Thus, we continue our following experiments with a last-fired feature.


