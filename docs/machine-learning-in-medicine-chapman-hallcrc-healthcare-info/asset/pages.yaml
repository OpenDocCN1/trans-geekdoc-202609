    # 7.2 DISCUSSION AND OUTLOOK


    Automated image interpretation that mimics human vision with traditional machine
    learning has been existing for a long time. Recent advances in parallel processing
    with GPUs and DL algorithms, which extract patterns in images with their self-learning
    ability, changed the whole automated image interpretation practice with respect
    to computation speed, generalizability, and transferability of these algorithms.
    US powered with AI has been advancing and moving closer to be used in the routine
    clinical workflow in radiology and cardiology since there is an increased demand
    for standardizing acquisition and interpretation of US images. Even though DL-based
    methods for US provide promising results in'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'diagnosis and quantification of diseases, US powered with AI is still far behind
    the advances in applications of AI in CT and MR imaging. High intra-/inter-variability
    in US make standardization of US image acquisition and interpretation challenging.
    AI could provide solutions to alleviate operator-dependent variability and interpretability
    but patient-dependent factors (e.g. obesity, limited acoustic window, artifacts,
    and signal drops) that affect image quality would still remain unsolved with US.
    Based on the outcome of DL applications presented above, the generalization ability
    of DL methods has been proven to be greater than conventional ML approaches. Therefore,
    DL methods are becoming more popular and replacing traditional ML methods.


    Applications of DL in US are rapidly advancing as evidenced by the growing number
    of studies recently. DL models have enormous representation power and are hungry
    for a large amount of data in order to obtain generalization ability and stability.
    Creating databases with large datasets that are curated and have good quality
    data and labels is the most challenging and time-consuming part of the whole AI
    model development process. Although it has been shown that AI-powered US applications
    have superb performance compared to classical ML methods, small datasets have
    generally used for training and validation of AI models. It is important to train
    AI models on large multi-vendor and multi-center datasets to obtain generalization
    and validate on large multi-vendor datasets to increase the reliability of a proposed
    model. To overcome this limitation, several studies employed transfer learning
    and fine-tuning in their AI models but the knowledge obtained from optical images
    of ImageNet was generally used to initialize the AI models, as proposed in Ref.
    [37,45,55]. This might not be an appropriate way of using transfer learning and
    fine-tuning as US images are significantly different from natural optical images.
    An applicable way could be initializing AI models with the knowledge previously
    obtained from an US dataset and fine-tuning them on a new dataset obtained at
    a different center from multi-vendors. Another alternative way to overcome the
    limitation of having limited dataset would be augmenting the dataset with realistic
    transformations (e.g. scaling, horizontal flipping, translations, adding noise,
    tissue deformation, and enhancing image contrast) that could help improve the
    generalizability of AI models. On the other hand, realistic transformations need
    to be used to genuinely simulate variations in US images and transformations in
    applied images should not create artifacts. For example, flipping US images vertically
    will not be a convincing transformation as shadowing never shows up in the adverse'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'course of the US beam travel through a medium. Alternatively, generative adversarial
    networks, which include a generator and a discriminator model, are trained until
    the model generates images that are not separable by the discriminator. This could
    be used to generate realistic US B-mode images of organs of interest. Introducing
    such transformations during the training process will make AI models more robust
    to small perturbations in input data space.


    Making predictions based on only 2D cross-section images could be considered as
    a limitation of AI-powered US system. Two-dimensional cross-section images include
    limited information and do not constitute lesions entirely. Training AI models
    on 3D US data that include entire lesions or the structure of interest, multiple
    US views, or spatiotemporal data would potentially improve the diagnostic accuracy
    of an AI model. In addition, AI models that are trained on combined multi-mode
    US images (e.g. B-mode, Doppler, CEUS, and SWE), which complement each other,
    could also improve the diagnostic performance of AI models.


    It is important to design AI models that are transparent for the prediction of
    any disease from medical images. The AI models developed for the diagnosis of
    a disease must elucidate the reasons and motivations behind their predictions
    in order to build trust in them. Comprehension of the inner mechanism of an AI
    model necessitates interpreting the activity of feature maps in each layer [73–75].
    However, the extracted features are a combination of sequential layers and become
    complicated and conceptual in those layers. Therefore, the interpretation of these
    features becomes difficult compared to handcrafted imaging features in traditional
    ML methods. Traditional ML methods are designed with separable components that
    are more understandable. Each component of ML methods has an explanation but usually
    is not very accurate or robust. With DL-based AI models, the interpretability
    is given up for the robustness and complex imaging features with greater generalizability.
    Recently, a number of methods have been introduced about what DL models see and
    how to make their predictions. Several CNN architectures [38,65,76–78] employed
    techniques such as deconvolutional networks [79], gradient back-propagation [80],
    class activation maps (CAM) [81], gradient-weighted CAM [82], and saliency maps
    [83,84] to make CNN understandable. With these techniques, gradients of a model
    have been projected back to the input image space, which shows what parts in the
    input image contribute the most to the prediction outcome that maximizes the classification
    accuracy. Although making AI models understandable has been an active research
    topic in DL community, there are still a lot that needs to be done for that.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Developing AI models that standardize image acquisition and interpretation
    with less variability is essential considering that US is an operator- and interpreter-dependent
    imaging modality. The AI guidance during data acquisition for the optimal angle,
    view, and measurements would make US less operator dependent and smarter and standardize
    data acquisition. Cost-effective and easy access to POCUS systems with AI capability
    would help clinicians and nonexperts perform swift initial examinations on patients
    and progress with vital and urgent decisions in emergency and primary care clinics.
    In the near future, POCUS systems with AI capability could replace the stethoscopes
    that doctors use in their daily practice to listen to patients’ hearts. Clinical
    US or POCUS systems powered with AI, which can assess multi-mode data, steer sonographers
    during acquisition, and deliver objective qualifications, measurements, and diagnosis,
    will assist with decision making for diagnosis and treatments, improve US workflow
    in clinics, and cut healthcare cost.


