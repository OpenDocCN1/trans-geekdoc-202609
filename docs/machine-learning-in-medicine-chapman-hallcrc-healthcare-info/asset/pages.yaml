    # ### 8.4 DISCUSSION AND CONCLUSION


    In this chapter, we discussed a few recent researches on ML-aided MCI/AD diagnosis.
    It is noted that with the development of ML techniques in other fields, the integration
    of ML into clinical practice has become increasingly popular. However, it is admitted
    that currently there is no practically available ML-aided diagnosing system officially
    used in the actual clinical'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'cases. This is not just an academic matter, but also an issue of trust: patients
    usually would not risk to solely put their faith on a machine. This is one big
    obstacle that prevents academic achievements from implementing in the real-world
    clinical practices.


    Traditionally, the computer-aided MCI/AD diagnosis was mainly focusing on the
    statistical analysis of data; the current new trend aims to combine the statistical
    analysis with ML algorithms. This completes the pipeline of a typical expert system
    and makes such diagnosis systems truly automated. With the inclusion of ML modules,
    it also establishes a standardized framework from a statistical perspective (as
    opposed to the visual inspection of the plotted performance); within such framework,
    the evaluation of the systems becomes more objective: the well-recognized metrics
    in the ML field, such as sensitivity, specificity and recognition accuracy, provide
    a clearer reflection of the diagnosis performance than the conventional computer-aided
    systems in the clinical community.


    In spite of the promising results for ML-aided MCI/AD diagnosis in recent years,
    a few issues are noticed in designing the detection systems and need to be carefully
    addressed for improvement in the future. These important factors are listed as
    follows:


    +   1. It is noted that with the increasing of the participants involved in the
    data collection, the classification performance has been found to reduce drastically
    [9,10,15,16]. This indicates that the within-class difference (i.e. the individual
    difference between the subjects) is an impacting factor in such clinical scenarios
    and cannot be just ignored. Given the clinical systems are designed for human
    users, the existence of such biometric variabilities is well noticed [17]. Theoretically,
    with the amount of training set increasing, ML systems should be able to provide
    robustly increasing performance until the curve reaches the plateau stage. One
    possible way to alleviate such intra-class variance is to introduce the concept
    of transfer learning: One could purposely extract the useful information from
    different individuals, which should be commonly shared within the class, yet distinguishable
    enough between class, we could be expecting a boost in the recognition performance.


    +   2. Most of the state-of-the-art studies are conducted using data from the
    single session recording for both training and the test of the system. Such design
    may yield good diagnosis performance in experimental'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'scenarios if the data are carefully organized, but it is obviously not quite
    realistic for the clinical scenarios. In real-world practices, such a diagnosis
    system may be facing different new recordings from the same subjects. The performance
    of such a case has not been extensively explored. It is recommended to conduct
    extensive longitudinal studies for E/MEG data, with particular focus on the temple
    aging effects [17], for example.


    +   3. The various evaluation approaches reported in the literature is another
    issue that needs to be addressed. It is no secret in the ML community that when
    using different evaluation approaches, the same system pipeline can demonstrate
    a huge difference in classification performance. For instance, the work reported
    in Ref. [14] provided two drastically different accuracies: using a five-fold
    cross-validation, the system was able to achieve 98% of the accuracy for MCI detection,
    whereas using the leave-one-out cross-validiton, the same system only provided
    an accuracy of about 70%. It is suggested that researchers should try to mimic
    real-life scenarios while doing the experimental design, particularly avoid using
    the data from same-subject same-session for both training and test.


    +   4. Though the clinical brainwave data (in particular EEG) is quite abundant,
    according to the literature, a few minutes of recording is enough to provide reasonable
    accuracy. Additional recording from a single session does not appear to be able
    to further improve the performance and also it has the liability to introduce
    redundant data.


    +   5. Most of the current studies are based on using the resting state data.
    As the early stage baseline study, it is highly recommended. To explore further,
    in particular the ROIs and their functional responses, different experimental
    paradigms should be developed. For example, AD affects multiple cognitive areas
    of the brain, and diverse cognitive stimulation paradigms should be combined to
    better explore the cognitive changes and their relationships.


    Given its minor deployment and relative early developing stage in general, much
    work could be done in excavating the potential of ML-aided MCI/AD diagnosis. From
    the perspective of information gain, MEG modality intuitively should to be much
    more informative than EEG signals, due to its higher sensor density and arguably
    more information'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'per channel. However, approaches to remove the redundant information should
    also be carefully designed for MEG-based auto-diagnosis. EEG on the other hand,
    benefits from its cheap installation and already wide deployment, still playing
    a supportive role in most of the mainstream clinical practice.


    One possible way to boost the prediction performance is to combine the EEG and
    MEG: a multi-modal recognition system equipped with a well-designed fusion algorithm
    could synergistically combine complementary information from both modalities.
    From a broad perspective, using E/MEG-based ML algorithms to classify AD patients
    and patients with other neurodegenerative diseases (such as Parkinson’s disease
    and Lewy body dementia) may also deserve attention in future investigations.


