  md: 'interrogated region. The sound waves travel through a soft tissue medium with
    approximately 1,540 m/s. The time of flight between the transmitted and received
    sound waves is used to locate objects and construct an image of the probed area.
    US has several advantages compared to magnetic resonance (MR), computed tomography
    (CT), and positron emission tomography (PET) imaging modalities. US is unharmful
    as it does not use destructive ionizing radiations like X-ray, CT, and PET. It
    is considerably lower in cost, handy for point-of-care (POCUS) applications, and
    provides actual real-time imaging. Since it is handy, it can be carried to a patient''s
    bedside for examining patients and monitoring changes over time. The disadvantages
    of US include operator dependability and being incapable of examining body areas
    that contain gas and bones.


    Diverse image types are formed by using US (Figure 7.2). The most common types
