    # 5.1 INTRODUCTION


    In artificial intelligence, neural networks have been in and out of popularity
    since the 1940s, but in the last decade, deep learning with artificial neural
    networks has been a game-changer in many engineering application areas [1,2] and
    in basic science [3–5]. Deep learners, such as Convolutional Neural Networks (CNNs),
    have consistently obtained state-of-the-art results in many computer vision tasks
    such as image classification [1,6], object detection [7], face recognition [8],
    and machine translation [9]. CNNs also have been proven to be more accurate than
    humans in many recognition tasks, including recognizing traffic signs [10], faces
    [11,12], handwritten digits [10,13], and the 1,000 classes of the ImageNet dataset
    [14,15].


    Since activation functions play a critical role in the training dynamics and task
    performance of deep neural networks, the development of more efficient and better-performing
    activation functions has been the focus of a large number of researchers. Until
    recently, the sigmoid and hyperbolic tangent were among the most widely used activation
    functions in neural networks. Although the hyperbolic tangent has the advantage
    of having a derivative that is steeper than the sigmoid function, they both suffer
    from the vanishing gradient problem and do a poor job training at deep neural
    networks, in part because gradients rapidly decrease as the modulus of the input
    goes to infinity. There is increasing evidence, however, that other nonlinearities
    improve the performance of neural networks. Glorot et al. [16], for example, demonstrated
    the superiority of Rectified Linear Units (ReLU) to train deep networks. ReLU
    is an activation function that is equal to the identity function when the input
    is positive but zero when it is negative [17]. Even though this function is not
    differentiable, it nonetheless enabled AlexNet to win the ImageNet competition
    in 2012 [1].


    Due to the success of ReLU and the fact that this activation is fast, effective,
    and simple to evaluate, many researchers in deep learning began to'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'explore the properties of other rectifying nonlinearities. For example, Leaky
    ReLU, proposed by Mass [18], is an activation function that, like ReLU, is equivalent
    to the identity function for positive values but has a hyperparameter \(\alpha>0\)
    for negative inputs. This hyperparameter guarantees that the gradient of the activating
    function is never zero, thereby making it less likely that the optimization process
    will get stuck in local minima. Another advantage of Leaky ReLU is that it alleviates
    problems caused by hard zero activations of ReLU, which can produce cases where
    a unit never activates, significantly slowing training when networks have excessive
    constant zero gradients. Another rectifying nonlinearity is Exponential Linear
    Units (ELU), proposed by Clevert et al. [19], which is similar to Leaky ReLU but
    exponentially decreases to the limit point \(\alpha\) as the input goes to minus
    infinity, thereby always producing a positive gradient. However, unlike Leaky
    ReLU, ELU saturates on its left side. The Scaled Exponential Linear Unit (SELU),
    proposed by Klambauer et al. [20], was also developed to mitigate the vanishing
    gradient problem. SELU is the same as ELU but multiplied by the constant \(\lambda>1\)
    to preserve the mean and the variance of the input features.


    In the past, activation functions were handcrafted and only modified the weights
    and biases in neural networks, with no part of the function depending on learnable
    parameters. This situation changed in 2015 with the proposal of Parametric ReLU
    (PReLU) by He et al. [14]. PReLU is a modified Leaky ReLU where the slope of the
    negative part is a learnable parameter. PReLU works best with extremely large
    datasets since the additional learnable parameter increases the likelihood of
    overfitting. Many learnable activations have since been proposed [21,22]. Related
    to this work is the Adaptive Piecewise Linear Unit (APLU), proposed by Agostinelli
    et al. [21]. APLU is a piecewise linear function whose slopes and points of nondifferentiability
    are learned independently for each neuron using gradient descent during the training
    phase.


    A simple way to define learnable activations is to start with multiple fixed activations,
    as in the work of Manessi and Rozza [23], who generated a learnable activation
    function that automatically learned different combinations of the base activation
    functions tanh, ReLU, and the identity function. Jin et al. used an S-shaped Rectified
    Linear Activation Unit (SReLU) to learn both convex and nonconvex functions, imitating,
    as a result, two fundamental laws: the Weber-Fechner law and the Stevens law.
    Ramachandran et al. [24] harnessed reinforcement learning to discover novel scalar
    activation functions. One of the best performing functions they discovered is
    Swish, defined as \(f(x)=x\sigma(\beta x)\), where \(\sigma(\cdot)\) is the sigmoid'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'activation function and $\beta$ is a trainable parameter. As $\beta$ approaches
    infinity, the sigmoid activation approaches the ReLU function. When $\beta$ is
    zero, the Swish becomes the scaled linear function $f(x)=x/2$ According to the
    authors, Swish can be viewed as a smooth function that nonlinearly interpolates
    between the linear function and the ReLU function. In experiments, Swish consistently
    outperformed ReLU and other nonlinearities.


    Another learnable activation function is the Mexican ReLU (MeLU), proposed by
    Maguolo et al. [25], so named because its shape is similar to the famous Mexican
    hat wavelet. MeLU is a piecewise linear activation function that is the sum of
    PReLU and multiple Mexican hat functions. This piecewise function has many parameters
    (collectively considered a hyperparameter) that range from zero to infinity and
    possess many desirable properties: (1) its gradient is rarely flat, (2) saturation
    does not occur in any direction, (3) it can approximate every continuous function
    on a compact set as the number of parameters goes to infinity, and (4) modifying
    a single parameter changes the activation only on a small interval, thereby making
    the optimization process simpler.


    In this chapter, we propose a new activation function based on MeLU, a Gaussian
    type learning unit that we call (GaLU) since it is a piecewise linear activation
    function that is the sum of PReLU and multiple Gaussian wavelets of the first
    order. We compare several state-of-the-art activation functions with GaLU, using
    three different CNN architectures (Vgg16 [26], ResNet50 [27], and DenseNet201
    [28]) on 13 small to medium-sized biomedical datasets, showing that an ensemble
    of activation functions strongly outperforms each individual function.


    The remainder of this chapter is organized as follows. In Section 5.2, we describe
    the eight state-of-the-art activation functions tested in this work as well as
    the novel method proposed here. In Section 5.3, we evaluate all nine activation
    functions on 13 different datasets. Finally, in Section 5.4, we conclude by offering
    some suggestions for future research.


    # ## 5.2 ACTIVATION FUNCTIONS FOR THE THREE CNNs


    To compare our method with some of the best performing activation functions proposed
    in the literature, we substitute them into three well-known CNNs: Vgg16 [26],
    ResNet50 [27], and DenseNet201 [28] pretrained on ImageNet. ResNet50 is a CNN
    with 50 layers and is known for its skip connections [6], which directly connect
    the given layer $n$ to some $n+k$ layer. Unlike the standard CNN that has a convolution
    followed by an activation, in the skip connection, the input of a block is summed
    to its output, a'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'procedure that promotes gradient propagation. DenseNet201 [28] is similar to
    ResNet, but each of the layers is interconnected, an architecture that also results
    in strong gradient flow. VGG16 [26] is a CNN where the input passes through blocks
    composed of stacked convolutional filters, which have the same effect as larger
    convolutional filters but are more efficient since fewer parameters are involved.


    The nine activation functions compared in this study are the eight briefly mentioned
    in the Introduction (ReLU [16], Leaky ReLU [29], ELU [19], SELU [20], PReLU [14],
    APLU [21], SReLU [30], and MeLU [25]) and the method proposed here, GaLU. These
    activation functions are detailed in the remainder of this section.


    # 5.2.1 ReLu


    ReLU [16] (see Figure 5.1) is defined as


    $y_i = f(x_i) = \begin{cases} 0, & x_i < 0 \\ x_i, & x_i \geq 0. \end{cases}$


