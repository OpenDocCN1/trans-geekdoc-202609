  md: '+   - ENS_MeLU outperforms ReLU on all three CNN topologies, but ENS_MG outperforms
    ENS_MeLU on all three CNN topologies;

    - Different behavior occurs in the different topologies; in ResNet50 and DenseNet201,
    there is a clear performance difference between MaxInput =1, 255, while in Vgg16,
    similar performance is obtained with MaxInput =1, 255.

    - Also, by optimizing BS and LR for ReLU, similar conclusions are obtained: ENS
    and ENS_G outperform other activation functions, including ReLU.


    # 5.4 CONCLUSION


    In this chapter, an evaluation of the performance of an ensemble of CNNs generated
    by changing the activation functions in three famous pretrained networks: Vgg16,
    ResNet50, and DenseNet201 is presented. The performance of eight activation functions,
    including a novel activation function, GaLU, on 13 challenging datasets is reported.
    The most interesting result is that in all the three CNN topologies, the proposed
    ensembles strongly outperform each single CNN, as well as those based on the standard
    ReLU.


    Experiments show that an ensemble of multiple CNNs that differ only in their activation
    functions outperforms the results of the single CNNs with the nine different activation
    functions. Experiments also demonstrate that no single activation performs consistently
    better than any other across the 13 datasets. In particular, we see that MeLU
    is competitive with the other activation functions in the literature. MeLU also
    seems to be the best performing activation when k=4, in particular on VGG16. Notice
    that we only tested MeLU with k=4, 8; in other words, we did not cherry-pick the
    best performing parameters of k on the testing set.


    In future work, we plan on generating larger ensembles of CNNs to ascertain the
    degree to which the performances of a single CNN can be boosted by different activation
    functions. The difficulty of studies involving ensembles of CNNs lies in the enormous
    speed and memory resources required to conduct such experiments.


