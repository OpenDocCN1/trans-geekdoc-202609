- pgno: 219
  md: "A DT represents a list of disjunctive rules that lead to a class or value;\
    \ they classify instances by sorting them down the tree from the root to some\
    \ leaf nodes. Once a DT is learned, it can be used to evaluate new instances to\
    \ determine their class. The instance is traversed through the tree from the root\
    \ until it arrives at a leaf. The class assigned to the instance is the class\
    \ for the leaf. The DT is constructed through a recursive partitioning strategy\
    \ based on a given training sample, it expands a leaf node unless the given stopping\
    \ criterion is satisfied, the goal is to split the data into disjoint sets by\
    \ maximizing the “distance” between groups at each split. In the proposed algorithm,\
    \ the information gain ratio is used for splitting criteria as shown in Algorithm\
    \ 11.1. One of the bottlenecks of the DT algorithm is that it suffers from overfitting,\
    \ i.e. each leaf will represent a very specific set of attribute combinations\
    \ available in the training data, but unable to classify attribute value combinations\
    \ that are not seen in the training data. In order to prevent overfitting, it\
    \ is recommended to prune the DT, i.e. the lower ends (the leaves) of the tree\
    \ are “snipped” until the tree is much smaller. The proposed pruning algorithm\
    \ is illustrated in Algorithm 11.2.\n\n```\nAlgorithm 11.2: Pruning Algorithm\n\
    Input: A Decision Tree $f: \\text{X}\\text{\\rightarrow}\\text{Y}$\nOutput: A\
    \ Decision Tree $f_{1} \\subseteq f$\nfunction PRUNING($f$)\n1. Classify all branches\
    \ in the tree.\n2. Count the total number of leaves in the tree.\n3. while the\
    \ number of leaves in the tree exceeds the desired number do\n   a. Find the branch\
    \ with the least Information Gain.\n   b. Remove all child nodes of the branch.\n\
    \   c. Relabel the branch as a leaf.\n   d. Update the leaf count.\nend while\n\
    end function\n```"
  merge: -1
  img_proc: true
