  md: '# 6.2.5  Summary of Machine Learning for mTLE Lateralization


    To establish a machine learning algorithm for mTLE lateralization, a retrospective
    comparative assessment was undertaken. In this manner, the patients who underwent
    resective surgery and without seizures postoperatively were chosen for these types
    of studies to establish and test a single feature or multiple features for laterality
    determination. While various machine learning algorithms were used for automated
    identification of the side of epileptogenicity, those used in the studies presented
    in this chapter are summarized in Table 6.1. For illustration, the methods used
    for feature analysis are summarized along with the methods used for classification.
    We also briefly described the patients’ categories, population types, and imaging
    modalities in Table 6.1.


    # 6.3  RESULTS


    # 6.3.1  Study 1: Hippocampal Study – FLAIR Intensity, Texture Analysis, and Volumetry


    In study 1, three sets of features were extracted from the segmented hippocampus
    in the two hemispheres: mean and standard deviation of FLAIR intensity, wavelet
    energy features, and hippocampal volumetric features. In this study, linear discriminator
    line/plane as a classifier was trained for each set of features and the ratio
    of the number of the correctly classified to the whole number of the subjects
    was considered as the *classification accuracy*. Considering the uncertain boundaries
    on each side of the discriminator line, two different accuracies were calculated
    for each set of features. Uncertain boundaries were placed on the 0.25 standard
    deviation (SD) separation from and in parallel with the discriminator line.


    The accuracy of using seven different combinations of the features was examined
    and reported separately in this study: (1) mean of the hippocampal FLAIR intensity,
    (2) standard deviation of the hippocampal FLAIR intensity, (3) mean and standard
    deviation of the hippocampal FLAIR intensity, (4) two wavelet signatures using
    db4 (*E1*, *E2*), (5) two wavelet signatures using db6 (*E1*, *E2*), (6) two wavelet
    signatures using db8 (*E1*, *E2*), and (7) hippocampal volume (right/left). The
    combination of the mean and the standard deviation (SD) of the hippocampal FLAIR
    signal intensity provided the most accurate classifiers, which yielded 75% accuracy
    when correctly classified subjects placed within the uncertain boundaries are
    considered misclassified and 98% accuracy when considering them as correctly classified.
    Taking into account the uncertain boundaries, the accuracies were 72% (58%) if
    the SD (mean) of the hippocampal FLAIR'
