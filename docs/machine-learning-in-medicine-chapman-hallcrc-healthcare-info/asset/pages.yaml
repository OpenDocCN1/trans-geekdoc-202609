  md: 'Due to the small sample size of the data set (54 cases), the authors used the
    leave-one-out procedure to perform a cross-validation accuracy estimation. To
    this end, 54 training-testing trials were performed. Each training was assessed
    by multinomial logistic function regression through the following formula:


    ```

    $$\ln\left(\frac{\operatorname{Pr}\left(Y_{i}=T|\boldsymbol{M}_{k}\right)}{\operatorname{Pr}\left(Y_{i}=N|\boldsymbol{M}_{k}\right)}\right)=\boldsymbol{\beta}_{i}^{k}\qquad(6.2)$$

    ```


    where $X_{i}$ and $\beta_{i}$ are the observation feature vector and the vector
    of regression coefficients, respectively, and $\operatorname{Pr}\left(Y_{i}=T|\boldsymbol{M}_{k}\right)$
    is the posterior probability of the label $Y_{i}$, which was set to 0 or 1 depending
    on the decision made by the model. Through multinomial logistic regression, the
    regression coefficients were estimated for each of the three regression models.
    Subsequently, the accuracy of the estimated models was assessed by using $\beta_{i}$
    for the testing data.


    # Study IV: Texture Features of the Whole Brain


    Since epilepsy may affect the structural features of the entire brain, this study
    hypothesized that the textural features-first and second-order statistical features-might
    be used to identify epileptic patients. To this end, the second-order statistical
    features were obtained based on a volumetric gray-level occurrence matrix (GLCM).
    These features were extracted from the brain tissue segmentation results. Here,
