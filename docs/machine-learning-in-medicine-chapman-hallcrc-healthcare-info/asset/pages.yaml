- pgno: 122
  md: 'small sample size of the subjects, especially for the bilateral cohort, can
    be considered as a limitation for this study.


    Study IV compared the accuracy of differentiating mTLE subjects from the control
    subjects based on the segmentations obtained by the unified segmentation and the
    Gram\u2013Schmidt method. The results showed that the texture features of the
    regions segmented by the unified method were more discriminative than those of
    the Gram\u2013Schmidt method. They found the three-dimensional texture features
    successfully in detecting mTLE cases. Moreover, whole-brain texture features outperformed
    those of the hippocampus.


    In the last study discussed in this chapter [61], normalized volumes of three
    neuroanatomical regions were found to be optimal for mTLE lateralization. The
    study showed that a combination of the normalized volumetric features of the hippocampus
    and amygdala resulted in 94.1% accuracy in mTLE lateralization. Without integrating
    amygdalar volumetric features, hippocampal volumetric features generated 82.4%
    accuracy. Moreover, integrating thalamic volumetric features increased the accuracy
    of the mTLE lateralization to 98.5%.


    In all of the above studies, the patients used in the training phase were diagnosed
    to have mTLE. Thus, the proposed machine learning models are applicable to the
    mTLE patients. They may not be applicable to patients with other types of epilepsy,
    e.g., extra-temporal epilepsy. Also, the performance of the proposed features
