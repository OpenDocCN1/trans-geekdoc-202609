    \ 186\n\n# 10.1 INTRODUCTION\n\nIn recent years, diseases related to cognitive\
    \ impairment in ageing persons are treated as a major public health concern all\
    \ over the world. Alzheimer’s Disease International estimated the number of people\
    \ suffering from dementia worldwide in 2018 to be 50 million and it will increase\
    \ to 82 million by 2030 [1]. These numbers underline a situation that presents\
    \ a certain level of criticality.\n\nAgeing persons with cognitive impairment\
    \ have problems with activities that require memory and cognition [2]. They also\
    \ have difficulties with speaking, writing, distinguishing objects and executing\
    \ daily life activities such as cleaning, cooking and so on [3]. Elderly people\
    \ need special care and help from their caregivers leading to a social, psychological,\
    \ physical and economic challenge to family members, caregivers and the society\
    \ as a whole.\n\nMost elderly people prefer to lead an independent life. Studies\
    \ show that it is better for the health of these people to stay in a self-determined\
    \ private home environment while ageing [7,8].\n\nChanges in daily life activity\
    \ (preparing food, showering, walking, sleeping, watching television, going to\
    \ the toilet, having dinner/ lunch/ breakfast, cleaning the house and so on) patterns\
    \ and their occurrence time and frequency are key indicators in determining the\
    \ cognitive status of elderly people. Assessing the cognitive status of elderly\
    \ people by tracking their daily life activities in a specially designed smart-home\
    \ would be very useful for caregivers, medical doctors and clinicians so that\
    \ early treatment would be possible.\n\nUnfortunately, there exists no data assessing\
    \ the cognitive abilities of ageing persons. Thus, in this study, we tackle the\
    \ scarcity of the data demonstrating the abnormal behavior of elderly people by\
    \ generating data. Moreover, we aim to recognise daily life activities by taking\
    \ their neighbourhood information into account. The spatio-temporal information\
    \ of activities and their ordering and frequency are important for understanding"
  merge: -1
  img_proc: true
- pgno: 187
  md: 'the cognitive abilities of elderly people. Thus, we emulate activity recognition
    and abnormal behavior detection problems as a sequence labelling problem. In the
    present study, we first model activities as a sequence and then detect the abnormal
    behavior. The rest of the chapter is presented as follows. Section 10.2 provides
    an overview of dementia indicators. Section 10.3 summarises the literature work,
    while Section 10.4 describes the datasets used. Section 10.5 describes the methods
    used and presents the experiments. Lastly, Section 10.6 concludes the chapter.


    # 10.2 INDICATORS OF DEMENTIA


    Although the early detection of cognitive impairment would make early treatment
    possible, studies indicate that 75% of dementia cases are not noticed [9]. Recent
    research [10] suggests anomalies in the patterns of daily life activities can
    be clue to detect such cases at an early stage. Moreover, the best indicators
    could be detected by monitoring the trends and changes of the activities over
    time such as problems with sleeping or difficulties completing tasks [11]. As
    an example, forgetting to have dinner, suffering from insomnia, or going to the
    toilet frequently are signs of cognitive impairment. Moreover, there can be an
    abnormality in eating habits (for example, having snacks in the middle of the
    night), waking up frequently in the middle of the night, or dehydration because
    of not drinking enough water. Sufferers may also have problems that involve risky
    situations such as forgetting to turn off the heater, the oven, or the stove [11].
    Moreover, elderly people with cognitive decline may suffer from the consequences
    of confusion (for example, not being able to run the dishwasher or confusing names
    on a phone book).


    # 10.3 LITERATURE OVERVIEW


    In this section, we are going to summarise literature work in two parts, namely
    cognitive assessment and deep learning studies.


    # 10.3.1 Cognitive Status Assessment


    Many different studies attack the problem of home-based assessment of the cognitive
    status of ageing persons automatically [23–30] and different machine learning
    methods such as Naïve Bayes classifier and Support Vector Machines (SVMs) [31,32,38],
    Restricted Boltzmann Machines (RBMs) [28,33], Markov Logic Networks [26,27,29],
    Hidden Markov Models (HMMs) [12,34], Random Forest methods [19], Hidden Conditional
    Random Fields (CRFs) [35] and Recurrent Neural Networks (RNNs) [36] have been
    exploited for this purpose.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Current cognitive assessment methods rely on experts testing the elderly persons''
    ability to answer questionnaires or recall events from the past. This approach
    requires expert knowledge, which might be biased. In Ref. [23], elderly people
    are asked to perform a sequence of activities while they are being monitored via
    a camera to be given scores. Some other studies such as that of Ref. [37] measure
    the duration of the activities and the number of sensors activated during the
    execution to assess the cognitive abilities. These types of assessment methodologies
    cause a distraction as they are not done in the natural flow of daily life activities.
    On the other hand, rule-based diagnosis methods require the integration of domain
    knowledge via specific rules and these rules need to be updated for every person
    as these rules are specific to individuals. For example, the habits of waking
    up during the night or drinking water in the night might change from person to
    person. The advantage of our method over these studies is that it doesn''t use
    any expert or domain knowledge. The normal behavior is learnt from training data.
    Moreover, the assessment is aimed to be done exploiting the daily life routines
    of elderly people, and thus it provides an unobtrusive way of assessment.


    In Ref. [39], movement segments are defined as activity curves and abnormal activities
    are detected by comparing these curves. In Ref. [40], a probabilistic spatio-temporal
    model based on location is used to calculate the likelihood of a subject’s behavior.
    Abnormal behavior such as staying in bed for an unusual time or not sleeping in
    the bedroom is detected using a cross-entropy measure. In Ref. [12], the HMM and
    fuzzy rules are combined to detect anomalies related to duration, time and frequency.


    In Ref. [35], a Hidden State Conditional Random Field (HCRF) method is used to
    model activities and then abnormal behavior is detected using a threshold-based
    method, while in Ref. [26], the Markov Logic network is combined with a rule-based
    and probabilistic reasoning to detect abnormal behavior. One disadvantage of this
    study is that the steps of activities are defined before the model is constructed.
    However, the rules change from resident to resident. Moreover, defining the rules
    is time consuming. In Ref. [27], these rules are automatically detected using
    a rule induction method and data of normal and abnormal activities. However, our
    proposed method learns normal activity patterns from the training set and without
    applying rules. We define abnormal behavior, not activities alone but in the context
    of sequential information [26,35].'
  merge: -1
  img_proc: true
- pgno: 189
  md: '10.3.2 Deep Learning


    In recent years, deep learning methods have been used to tackle activity recognition
    in smart-homes. These methods include Convolutional Neural Networks (CNNs) [41–50,
    67–69], Deep Belief Networks (DBN) [33], Restricted Boltzman Machines (RBMs) [28,33,51,52]
    and RNNs [43,44,53]. While RBMs are preferred for feature extraction and selection
    [51], they perform better than HMMs and NB on the CASAS dataset [52]. CNNs have
    been popular to recognise activities using wearable sensors [33,41–43,45,48,51].
    However, very few studies [52,67–71] use deep learning methods on sensor-based
    activity recognition, which needs to be further studied.


    Auto-encoders are being used for anomaly detection on time-series data [57,58].
    In Ref. [56], the authors use Recursive Auto-Encoders for predicting sentiment
    distributions. Instead of using a bag-of-words model, this model exploits a hierarchical
    structure and uses compositional semantics to understand the sentiment. In Ref.
    [59], the authors extract patterns in daily life activities as segments of an
    activity. This shows that the extracted movement vector can be used to differentiate
    high-level activities. The idea behind this is residents at a smart-home follow
    the same routine during the performance of the same activities such as moving
    around the kitchen sink while washing the dishes.


    10.4 DATASETS AND DATA GENERATION


    Elderly people suffering from dementia may have difficulties performing activities
    such as managing medication, cooking and housekeeping. In this research, we analyse
    sequential daily life activities (performed in a sequential order without any
    interruption) to detect the abnormal behavior. We also assume that there is only
    one occupant living in a smart house. Cooking, sleeping, going to the toilet,
    working, cleaning, washing dishes and so on are examples of daily life activities.
    We focus on these types of activities since they are promising to reflect on dementia
    cases in a scenario of daily life. Inspired by data simulation techniques to generate
    activity instances [17–19], we generate abnormal behavior.


    We will first describe the datasets used and then the abnormal behavior generation
    method will be presented.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# 10.4.1 Datasets


    In this research, we used three datasets:


    +   - **Van Kastereren [60] dataset**: In this dataset, there are daily life activities
    such as sleeping, cooking, leaving home and so on and the data were collected
    in three different households in durations less than a month.


    +   - **Aruba testbed of CASAS [16] dataset**: In this dataset, sensors such as
    motion, door and temperature are used. However, we use motion and door sensors
    in our study. In total, there are 11 activities in this dataset and the collection
    was done in 224 days.


    +   - **WSU testbeds of CASAS [16] dataset**: In this dataset, there are five
    activities, which are making a phone call, hand washing, meal preparation, eating
    and cleaning. Twenty instances of each activity were performed by 20 students
    in (1) adleror and (2) adlnormal versions. While normal behavior is reflected
    in the adlnormal version, residents were told to include errors in adleror to
    simulate the difficulties of elderly people.


    # 10.4.2 Data Generation


    Abnormal behavior in the daily life activities of elderly people is divided into
    two parts: (1) activity-related anomalies and (2) sub-activity-related anomalies.
    In activity-related anomalies, an activity itself is totally normal while there
    is an anomaly related to its frequency or its timing in a day. On the other hand,
    the sub-activity-related anomaly is related to the context and the quality of
    activity performed such as frequency of sensor activations involved as well as
    their order and correlation. In the first one, activities as a whole are repeated
    or forgotten (e.g. having dinner); while in the second one, some steps (sensor
    activations) of activities are forgotten or repeated (e.g. adding salt to the
    dish).


    # *10.4.2.1 Activity-Related Abnormal Behavior*


    To simulate these types of indicators, we insert a set of actions into the whole
    day actions of activities (see Algorithm 10.1), which will give multiple instances
    of the same type of an activity. Moreover, insertion in some inadequate time of
    the day will generate time-related abnormalities such as waking up and eating.
    We insert the following activities: preparing meal, eating, working, washing dishes,
    leaving home and entering home into the normal activity sequences of the Aruba
    dataset.'
  merge: -1
  img_proc: true
- pgno: 191
