  md: 'Thermal Dose Modeling ■ 39


    # 4.3.4 Initial and Boundary Conditions


    The initial and boundary conditions must be specified in order to fully describe
    the CNN models. The initial condition is achieved by assigning the initial state
    of the cell with the initial temperature of the tissue, i.e.,


    ```

    $$ v_{x}(0)=T(0) $$

    ```


    The boundary condition of the Dirichlet type is enforced by assigning the fixed-state
    cells with a prescribed constant temperature, i.e.,


    ```

    $$ v_{x, b}(t)=T $$

    ```


    where $v_{x, b}(t)$ represents the state of the cell at the specified domain boundary
    at time t.


    The time evolution of CNN directly provides the soft tissue temperature field
    governed by the Pennes bio-heat transfer equation, which is subsequently used
    for thermal dose computation.


    # 4.4 NUMERICAL EXAMPLES


    # 4.4.1 Patient-Specific Thermal Dose Computation


    A set of patient-specific virtual digital models of heterogenous tissues is employed
    to analyse thermal doses in a personalised thermal ablative treatment of hepatic
    tumours. As illustrated in Figure 4.4, the patient-specific anatomical models
    were constructed from a computed tomography (CT) medical image dataset of an anonymised
    patient (the dataset is available at https://www.irCAD.fr/research/3dicadb/),
    which was segmented and reconstructed into the liver and the bone. The thermal
    dose $CEM_{d_3}$ was computed from the tissue heat exposure history (Eq. 4.1)
    where the tissue temperature was calculated by the bio-heat transfer-embedded
    CNN whose performance was previously evaluated in Ref. [41]. The heterogeneity
    of tissues was modelled by setting parameters of cells to different values based
    on the tissue/tumour material properties at different regions.


    As illustrated in Figure 4.5, a volumetric heat source of a Gaussian distribution
    type was used as the externally applied heat source. The simulated heat source
    was employed to demonstrate the applicability of the CNN methodology in estimating
    tissue temperature and thermal doses, and they can be substituted by different
    heat sources of various sizes and shapes such as those induced by the different
    thermal ablative modalities.'
