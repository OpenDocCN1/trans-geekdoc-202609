    # ## 9.4 BAYESIAN NEURAL NETWORKS FOR CONFIDENCE TUNING


    While deep neural networks have achieved high accuracy for computer-aided diagnosis
    problems, for practical consideration, merely an increased accuracy is not enough.
    Alongside accuracy, a confidence measure will be useful for doctors and healthcare
    practitioners, to assess how well the system is performing. Bayesian neural networks
    are a good tool to estimate the confidence of a decision by an ML system [23].
    The target of this work is to not only compute such confidence measures efficiently
    but also provide the doctors with a tool to effectively control the accuracy-coverage
    tradeoff. The tradeoff can be achieved by using some control parameters for controlling
    a Bayesian neural network.


    In the proposed model, we take a two-stage approach to achieve a tunable confidence
    measure. The reason for taking a two-stage approach rather than employing an end-to-end
    Bayesian network is two-fold: (1) employing a traditional CNN for feature extraction,
    followed by a small Bayesian network, results in a more efficient network architecture,
    which can result in much faster training and (2) popular CNN architectures such
    as AlexNet [24], Resnet [25], and VGG [13] are already being deployed at hospitals
    and clinics. A modular Bayesian architecture can be used simply as an “add-on”
    to such systems.


    The proposed architecture is shown in Figure 9.3. As we can see, a modified ResNet-18
    architecture is used as a feature generator, which takes in 224×224 sized images
    and generates 512-element feature vectors, and a separate small fully connected
    network that has just three fully connected layers followed by a softmax. Note
    that this small network only has just over 164 thousand parameters as opposed
    to the over-11 million parameters in the full network, making the subsequent steps
    easily executable on commodity hardware. Bayesian inference is performed via a
    Gaussian process such as stochastic variational inference (SVI) [26], but on the'
