    # 3.4 GLAUCOMA


    Compared to diabetic retinopathy and AMD, there has been significantly less research
    on the use of machine learning in diagnosing glaucoma. In 2013, the global prevalence
    of glaucoma in those aged 40–80 years was estimated to be 64.3 million and predicted
    to increase to 111.8 million in 2040 [14].


    Deep learning for the detection of glaucomatous optic neuropathy has been performed
    by Li et al. [15]. One of the difficulties in assessing for glaucoma is that no
    cup-to-disc ratio has been established that defines pathological cupping because
    of the wide range of cup-to-disc ratio values in the normal population [16]. Li
    et al. defined referable glaucomatous optic neuropathy with a vertical cup-to-disc
    ratio of 0.7 or higher. In this study, a total of 31,745 fundus photographs were
    included in the training of the neural network, and 8,000 were included for the
    validation. The neural network achieved an AUC of 0.986 (95% CI, 0.984–0.988)
    and had a sensitivity and specificity of 95.6% and 92.0%, respectively. In addition,
    the most common reason for a false negative from the model was due to a coexisting
    eye condition such as myopia, diabetic retinopathy, and AMD. Coexisting conditions
    are often present during testing and are one of the areas in which deep learning
    has room to improve. As more diseases are presented to a neural network, it is
    expected that there will be a decrease in the accuracy of the neural network;
    however, if enough high-quality images are shown, the model may be able to return
    to higher accuracy levels. The primary reason for a false positive from the model
