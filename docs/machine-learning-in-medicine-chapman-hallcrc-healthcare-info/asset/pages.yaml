    # 3.6 MACHINE LEARNING FOR PREDICTING SURVIVAL/PROGNOSIS


    Although most of the integration of machine learning in the field of ophthalmology
    has focused on image analysis, there has been some research on other applications
    of machine learning. For example, Damato et al. investigated the use of an artificial
    neural network on estimating the survival probability in patients after treatment
    of choroidal melanoma [19]. Patient characteristics such as age, sex, largest
    basal tumor diameter, ciliary body involvement, extraocular extension, tumor cell
    type, closed loops, mitotic rate, and the presence of monosomy chromosome 3 were
    used by the neural network to generate survival curves. The characteristics and
    risk factors were analyzed both individually and in combination. From the study,
    it was found that the most predictive factor in tumors of high-grade malignancy
    was the basal tumor diameter. In addition, combination analysis showed that the
    addition of cytogenetic and histological data in the model led to a decreased
    importance in certain factors including the ciliary body involvement and extraocular
    extension. Finding such interactions among several risk factors in order to predict
    survival is one of the advantages of the use of machine learning in healthcare.


    # 3.7 CONCLUSION


    Machine learning has made significant progress in diagnosing diabetic retinopathy
    and AMD. In the last few years, it has also been used for other ophthalmological
    conditions, including glaucoma, cataracts, and retinopathy of prematurity among
    others. Based on statistical measures such as AUC, sensitivity, and specificity,
    the neural networks indicate excellent performance in detecting many of these
    disease processes. The next stage of machine learning in ophthalmology will likely
    consist of the addition of fundus and OCT images from several ethnicities/races
    to better account for inter-ethnic variability. In addition, because of the success
    of machine learning in binary classification, further research will likely focus
    on using neural networks to make predictions among several disease processes.'
