  md: "# Early Classification of Renal Rejection Types: A Deep Learning Approach\n\
    \nMohamed Shehata, Fahmi Khalifa, Ahmed Soliman, Shams Shaker, Ahmed Shalaby,\
    \ Maryam El-Baz, Ali Mahmoud, and Amy C. Dwyer  \n*University of Louisville* \
    \ \n*Louisville, Kentucky*\n\nMohamed Abou El-Ghar  \n*University of Mansoura*\
    \  \n*Mansoura, Egypt*\n\nMohammed Ghazal  \n*Abu Dhabi University*  \n*Abu Dhabi,\
    \ United Arab Emirates*\n\nJasjit S. Suri  \n*AtheroPoint LLC*  \n*Roseville,\
    \ California*"
  merge: -1
  img_proc: true
- pgno: 278
  md: "# Ayman El-Baz\n\nUniversity of Louisville\nLouisville, Kentucky\nUniversity\
    \ of Louisville at AlAlamein\nInternational University (UofL-AIU)\nNew Alamein\
    \ City, Egypt\n\n# CONTENTS\n\n+   *   14.1 Introduction 258\n*   14.2 Methods\
    \ 261\n    *   14.2.1 Preprocessing/Segmenting Kidneys 261\n    *   14.2.2 Diffusion\
    \ Features Extraction 262\n    *   14.2.3 Deep Learning Classification 262\n*\
    \   14.3 Experimental Results 263\n*   14.4 Conclusion 264\n*   Acknowledgment\
    \ 265\n*   References 265\n\n# 14.1 INTRODUCTION\n\nIn the United States alone,\
    \ approximately 700,000 of the population suffer from chronic kidney disease (CKD)\
    \ and if not treated promptly in a timely manner, it will lead to end-stage kidney\
    \ disease (ESKD) and might lead to death. The optimal solution is to go through\
    \ a renal transplantation surgery, but given the fact that kidney donors are very\
    \ rare makes this task more complicated. In addition, these renal allografts might\
    \ be diagnosed with renal transplantation failure in the first 5-year post-transplantation.\
    \ One of the most detrimental factors of renal transplantation failure is acute\
    \ renal rejection. In other words, the body rejects the new kidney due to immunological\
    \ response [1]. To avoid such things, precautions should be taken during the early\
    \ stages to prolong the survival rate of the transplanted organ [2,3]. Namely,\
    \ routine clinical follow-ups, estimation, and correct evaluation of the renal\
    \ allograft after transplantation are essential to curtail the loss of allograft.\
    \ This loss of allograft may be due to a few types of kidney rejection such as\
    \ acute tubular necrosis (ATN), antibody-mediated rejection (AMR), or T-cell mediated\
    \ rejection (TMR). Other types include immunosuppressive toxicity (IT) and viral\
    \ infection (VI). Although each"
  merge: -1
  img_proc: true
- pgno: 279
  md: 'type of rejection contains a possible treatment, the possibility of two types
    of rejections occurring at the same time abates the treatment process [4].


    Though biopsy is the gold standard method, it cannot be used for early detection
    because it is extremely invasive, time-consuming, expensive, and frequently causes
    injurious events such as bleeding, infections, and more [1]. Therefore, alternatives
    to biopsy that are safer and noninvasive are important. A precise renal computer-aided
    diagnostic system (CAD) that is non-invasive holds a reassuring analysis on renal
    allograft rejection. This system collects information, one kidney at a time, and
    then combines the information quickly at low cost to increase the patient’s survival
    rate.


    A non-invasive method that has been commonly used to determine the status of the
    renal allograft during the early stage after transplantation is diffusion-weighted
    magnetic resonance imaging (DW-MRI). This method is often advantageous because
    it contains both anatomical and functional information about the soft tissue being
    detected [5]. Also, it averts the use of contrast agents due to the possibility
    of their toxicity. Many studies have tested the function of DW-MRI by obtaining
    the cortical apparent diffusion coefficient (CACD) of the medullary ADC (MADC)
    which provided a variety of results [6]. However, one of the studies by Abou-El-Ghar
    et al. provided a successful differentiation on DW-MRI [7]. Their experiment included
    21 patients with acute graft impairment with ten TMR, seven ATN, and four IT rejection
    types. They also had a region of interest (ROI) medial of a single cross-section
    of the kidney with the entire renal parenchyma, suspending the renal sinus. If
    an area contains a higher signal intensity or abnormal focal area, then a different
    ROI is obtained. Evidently, the ADC values obtained from ATN are heterogeneous
    due to them being calculated from three different groups. In other words, it is
    a mosaic pattern with a tiger stripe appearance. Additionally, the diffusion and
    blood perfusion played a major role in influencing the ADC values under low *b*-values.
    On the other hand, under high *b*-values, blood perfusion does not influence the
    ADC values. Other studies carried out by Eisenberg et al. suggest that a manual
    placement of individual ROIs can be used to cover a large area of the allograft
    [8]. Then, the individual ROIs in the upper, mid, and lower poles of the medulla
    are brought together to provide one ROI for the full cortex and another for the
    medulla. Of the five patients, four showed acute rejection while the remaining
    has ATN. Values such as standard deviation and mean were calculated. The issue
    with this study was the lack of patients who have transplant dysfunction. This
    is an issue because the trends do not provide a big enough differentiation between
    AR and ATN patients. Furthermore,'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'other studies [9,10] showed that a major decrement in renal perfusion in AR
    was due to perfusion MRI. However, studies [7,8] concluded that water diffusion
    and blood perfusion levels are directly correlated with AR allografts, but only
    water diffusion with ATN patients.


    Furthermore, BOLD MRI (blood oxygen level-dependent MRI) has also been used for
    renal rejection studies. With BOLD MRI, oxygen diffused blood is used to study
    the kidney''s function. More specifically, the extent of deoxyhemoglobin is calculated
    from the apparent relation rate (ARR) parameter [6]. Although the medullary values
    vary, multiple studies concluded that ATN kidneys contain increased medullary
    ARR in comparison to AR kidneys [6,10-12]. A study [11] stated that ATN kidneys
    contain higher cortical ARR values rather than AR kidneys. It is safe to say that
    the general trend is higher ARR values. However, all these experiments contained
    limitations: subjective delineation using manual delineation of the kidney via
    2D ROIs, failure to include kidney motion as a whole, failure to gather the fusion
    of ADC at high and low $b$-values, or establishing only statistical analysis to
    differentiate between pairs at certain $b$-values.


    Neither of the studies incorporated MRI modalities with clinical biomarkers for
    an inclusive, computer-aided diagnostic system for early-stage AR identification.
    Therefore, a system is needed to overcome such limitations. Our work consists
    of a fully automated system to assess acute rejection at an early stage shown
    in Figure 14.1. The developed system is able to delineate the entire kidney, which
    also means that it can handle any motion. Additionally, the system can implement
    a stacked autoencoder in order to fuse calculated ADC values from the DW-MRI segmentation
    at low and high $b$-values. In Section 14.3, promising results are indicated from
    the newly developed CAD system. The results conclude that the system is indeed
    a non-invasive diagnostic tool.


    ![](img/6554116edbb19a8210b75a29243fd6ec_280_0.png)


    **FIGURE 14.1** Shows the framework for the developed CAD system using DW-MRI.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 14.2 METHODS


    A precise Renal-CAD algorithm (see Figure 14.1) to assess the renal allograft
    status was developed. This system must contain certain steps to obtain the final
    evaluation. First, the kidney must be segmented from all other surroundings using
    DW-MRIs. Then, extraction or calculation was carried out for cumulative distribution
    functions (CDFs) of the voxel-wise ADC maps section of the kidney (Section 14.2.2).
    Lastly, TMR is allocated from the ATN kidney status to examine whether the proposed
    CAD system is a successful diagnostic measure.


    # 14.2.1 Preprocessing/Segmenting Kidneys


    Starting with a bias correction step on MR images [13], an intensity histogram
    equalization to reduce possible noise effect and image heterogeneities in these
    bias-corrected MR images was applied. As for the kidney motions, non-rigid registration
    of B-splines [14] was applied to decrease the variability of the subjects in the
    data using the sum of square difference (SSD). Next, the level sets approach was
    used to obtain an accurate 3D kidney segmentation [15]. For a precise kidney analysis,
    a guiding force that includes local appearance, shape, and spatial MRI features
    is placed in the regional statistics, which come from the kidney as well as the
    background regions given. Those features are merged using a joint Markov-Gibbs
    random field (MGRF) image model [16], more specifically, regional appearance [17,18],
    shape, and spatial DW-MRI features such as in Figure 14.2. Further details may
    be found in Ref. [15,19].


    ![](img/6554116edbb19a8210b75a29243fd6ec_281_0.png)


    FIGURE 14.2  Represents the joint estimation of the MGRF to guide the level-set
    segmentation technique.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 14.2.2 Diffusion Features Extraction


    Post kidney segmentation, discriminatory physiological features must be calculated
    from images in order to differentiate between ATN and TMR of ARTR types. Using
    Le Biham''s [20] ADC definition, the rejection status is calculated using the
    below equation:


    ```

    ADC _ { p } = ( 1 / b _ { 0 } - b ) \ln ( g _ { b } : p / g _ { 0 } : p ) = ((\ln
    g _ { b } - \ln g _ { 0 } : p) / (b _ { 0 } - b))

    ```


    To better explain this equation, p is (x, y, z) which is a voxel at the position
    with discrete Cartesian coordinates (x, y, z). As for g_{o} and g_{b}, they are
    the segmented DW-MRI pictures that were gathered with the b_{o} and a given different
    b-value.


    To classify the rejection status of the renal transplant, the data dimensionality
    must be reduced. To do this, a characterization of the gross 3D ADC maps was gathered
    for the multiple b-values as illustrated in Figure 14.3.


    # 14.2.3 Deep Learning Classification


    A deep neural network technique based on stacking autoencoders (AE) is embedded
    into the developed CAD system for a more accurate classification of the renal
    rejection types. Each AE mainly consists of an input layer, hidden layers, and
    an output layer and is pre-trained separately in an unsupervised manner to extract
    the most important discriminatory features [21]. Then, these AEs are stacked together
    along with a supervised softmax classifier to get the final output probabilities
    of being ATN or TMR. This softmax is fine-tuned to minimize the total loss. It
    is worth mentioning that a non-negativity constraint (NCAE) [22] is added to the
    AEs training


