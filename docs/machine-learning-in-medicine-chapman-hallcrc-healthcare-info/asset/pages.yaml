    To discretise the Pennes bio-heat transfer equation on the 2D irregular grids,
    the CNN formulation is achieved with the assistance of the concept of control
    area [55]. The problem domain is divided into a finite number of non-overlapping
    control areas with computation (grid) points located at centres, over which the
    conservation of energy is enforced in a discrete manner. An example of a control
    area of the point $i$ is illustrated in Figure 4.3, and it is formed by connecting
    each centroid of the triangles and the mid-points of the edges adjacent to $\mathbf{P}_i$.


    For the point $i$ enclosed by the control area $S_i$, the discrete form of the
    Pennes bio-heat transfer equation can be expressed as


    ```

    $$\int_{S_i} \left( \rho_i C_i \frac{\partial T_i(t)}{\partial t} + w_{b,i} C_{b,i}
    \left( T_i(t) - T_{a,i} \right) - Q_i - H_i \right) dS = \int_{S_i} \nabla \cdot
    \left( k_i \nabla T_i(t) \right) dS \quad (4.13)$$

    ```


    Applying Gauss''s divergence theorem yields


    ```

    $$\begin{aligned} & \int_{S_i} \left( \rho_i C_i \frac{\partial T_i(t)}{\partial
    t} + w_{b,i} C_{b,i} \left( T_i(t) - T_{a,i} \right) - Q_i - H_i \right) dS \\
    & = \int_{\partial S_i} k_i \nabla T_i(t) \cdot \mathbf{n} \, dl = \int_{\partial
    S_i} \left. \left( k_i \frac{\partial T(t)}{\partial \mathbf{n}} \right) \right|_i
    dl \quad (4.14) \end{aligned}$$

    ```'
