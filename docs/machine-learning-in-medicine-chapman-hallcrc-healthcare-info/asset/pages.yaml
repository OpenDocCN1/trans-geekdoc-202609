    An in silico simulation of a patient-specific HIFU treatment of liver tumours
    was conducted using CNN. In addition to the liver and the bone, the CT images
    were further segmented into the skin, fat and muscle; the HIFU transducer was
    positioned outside the patient skin where the medium was segmented as water. The
    ultrasound wave was propagated through water, skin, fat and muscle and focused
    on the liver tumour. The propagation of ultrasound was simulated by the non-linear
    full-wave Westervelt equation [58] on a uniform 208×112×112 mesh-grid occupying
    a computational domain of 121.3×65.3×65.3 mm. A HIFU transducer of diameter $D$
    = 60 mm and radius of curvature $R$ = 75 mm operated at the frequency $f$ = 1
    MHz with a surface pressure of 0.3 MPa was used for simulation. The typical acoustic
    property values of each type of tissues are presented in Table 4.1.


