  img_proc: true
- pgno: 229
  md: 'neurosurgery has addressed a large number of clinical practice domains. These
    domains can be divided into preoperative diagnosis, operative management, and
    postoperative prognosis. The goal of this chapter is to summarize the role of
    ML that has thus far been established in these areas. Specifically, Sections 12.2–12.4
    of this chapter will respectively discuss the current ML literature relevant to
    neurosurgical diagnostics, intraoperative care, and neurosurgical prognosis [1,2,6].
    Section 12.5 will discuss possible future directions that highlight areas for
    improvement and potentially exciting research avenues that may be pursued. Finally,
    Section 12.6 will describe the limitations of ML.


    # ### 12.2 MACHINE LEARNING AND NEUROSURGICAL DIAGNOSTICS


    In imaging applications, ML may serve a promising role in flagging abnormal features
    or suggesting a list of likely diagnoses, which will undoubtedly assist clinicians
    with workflow and provide in-depth diagnostic impressions [7]. In recent years,
    a considerable amount of work has been done around training ML algorithms to read
    common imaging modalities involving the central nervous system (e.g. magnetic
    resonance imaging or MRI and computed tomography or CT scans). This work has spanned
    a host of applications, such as the brain and spinal cord segmentation, stroke
    imaging, and neuro-oncology.


    When a patient presents with a stroke, history is one of the key clinical elements
    that guide management. In the most recent guidelines for ischemic stroke management,
    thrombolytic (i.e. ‘clot-busting’) agents are recommended within 4.5 hours of
    symptom onset or the patient’s last-known baseline state, provided that certain
    conditions are satisfied [8]. There are additional criteria for the administration
    of thrombolytic agents for patients presenting between 3 and 4.5 hours of symptom
    onset (e.g. nonmajor stroke). Thus, it is crucial to identify the onset of symptoms
    when deciding upon management for a patient with acute ischemic stroke. However,
    this is frequently not possible, such as when the stroke is severely disabling,
    when the patient has an additional neurocognitive impairment, or when the neurological
    deficits are present upon awakening [9,10]. In situations with unclear history,
    diffusion-weighted and fluid-attenuated inversion recovery (FLAIR) MRI may be
    done. Patients with diffusion-positive and FLAIR-negative lesions (i.e. DWI-FLAIR
    mismatch) are deemed to be within the 4.5-hour time window and may be eligible
    for thrombolytic drugs [10,11].'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'However, the use of DWI-FLAIR mismatch has low to moderate inter- and intra-rater
    reliability; in addition, it is not a perfect indicator of ischemic strokes occurring
    with a 4.5-hour time period [10,12]. Recognizing these limitations, Lee and colleagues
    developed ML algorithms (logistic regression, support vector machines, and random
    forest) that utilized MRI features to detect strokes occurring within 4.5 hours
    [13]. These algorithms were found to be more sensitive than human readers and
    had no statistically significant difference from human readers with respect to
    specificity. From these findings, it is possible that the improved performance
    of ML was due to its detection of additional imaging features in conjunction with
    the DWI-FLAIR mismatch that may be undetected by human readers. For neurosurgical
    practice, this has potentially important implications, as patients past the pharmacological
    thrombolysis window may be eligible for mechanical thrombectomy, which is recommended
    between 6 and 24 hours of symptom onset or last-known baseline state [8,14]. Thus,
    accurate identification of patients with the 4.5-hour time window by ML may necessarily
    change the pool of patients eligible for mechanical thrombectomy by a neurosurgeon.


    In neuro-oncology, important strides have been made in the classification, grading,
    and segmentation of brain tumors. We will summarize these strides here, but a
    more comprehensive overview can be found in Ref. [15]. Multiple studies have used
    ML to classify brain tumors as benign or malignant, achieving good to excellent
    performance, with one study achieving a classification accuracy of 98% [16] and
    another study achieving an area under the receiver operating characteristic curve
    (AUC) of 0.911 [17]. Other studies have attempted to use ML for a more granular
    classification of brain tumors. Zacharakis and colleagues [18], for instance,
    developed support vector machine (SVM) models to classify different grades of
    gliomas, meningiomas, and brain metastases based on MRI characteristics. The models
    generally fared well in most two-class problems (i.e. in distinguishing two different
    types of tumors) with AUCs between 0.77 and 1. However, their performance was
    limited in two areas: in distinguishing grade II from grade III gliomas and in
    multiclass classification (i.e. in distinguishing more than two types of tumors).
    Later, Wang and colleagues [19] developed ML algorithms to distinguish grade II,
    III, and IV gliomas via a multiclass approach and achieved significant success
    (mean accuracy ~90%).


    Additional studies of ML in neuro-oncology have focused on tumor segmentation,
    the process of separating the tumor from the surrounding'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'brain tissue on imaging, which can be indispensable when deciding the treatment
    approach [20]. Traditionally, manual segmentation of the tumor by physicians is
    used for treatment planning; however, this process can be inefficient and is subject
    to imperfect inter-rater reliability [21]. ML is an ideal candidate to address
    these issues, with current literature comprising multiple articles using either
    deep learning or k-means clustering to distinguish neoplastic tissue from the
    regular brain parenchyma. These articles have been able to successfully segment
    glioblastoma multiforme, low-grade gliomas, meningiomas, and metastatic brain
    tumors [22,23].


    The applications of segmentation algorithms, however, are not solely restricted
    to an oncologic context. In patients with temporal lobe epilepsy (TLE), a frequent
    finding is a hippocampal sclerosis [24]. These patients are particularly amenable
    to surgical treatment (60% seizure-free rate, commonly done via resection of the
    offending brain areas [25]. However, patients without hippocampal sclerosis are
    less likely to experience success with surgery, which makes it clinically useful
    to distinguish between the two subtypes of temporal lobe epilepsy. To this end,
    Keihanimejad and colleagues [26] have used ML to perform both segmentation and
    classification of temporal lobe epilepsies on MRI. After segmentation, the authors
    used SVM algorithms to achieve classification accuracies of 96% and 86% for TLE
    with and without hippocampal sclerosis respectively. Similar efforts for the segmentation
    and classification of TLE have been undertaken under slightly different conditions
    (e.g. detecting TLE based on extrahippocampal findings) [27,28].


    Outside the brain, the pool of publications utilizing ML in a diagnostic context
    for spinal pathology is limited compared to the pool of publications using ML
    in the setting of intracranial pathology. Nonetheless, the literature for the
    diagnosis of spinal cord pathology using ML is rapidly expanding and has taken
    important steps forward thus far. One of these steps was undertaken by Jamaludin
    and colleagues [29], who developed a model to label vertebrae and intervertebral
    discs using images from over 12,000 discs. This was followed by the development
    of a convolutional neural network to predict the extent of disc degeneration according
    to the Pfirrmann grading scale. Ultimately, the inter-rater agreement between
    the algorithm and human predictions of 70.1% was similar to the inter-rater agreement
    of 70.4% between two human radiologists when scoring disc degeneration using the
    Pfirrmann scale. Other research around spinal deformity, particularly idiopathic
    scoliosis, has also been undertaken for scoliosis classification and grading [30].'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'In the realm of spinal cord injury (SCI), Tay and colleagues [31] constructed
    ML algorithms that used spinal cord imaging obtained from diffusion tensor imaging
    (DTI) to classify axial images based on whether or not SCI was present. The key
    feature used to make these predictions was fractional anisotropy, a quantity used
    as a proxy for the tissue’s structural integrity. More specifically, fractional
    anisotropy is used in DTI to describe the diffusion of water and tissue orientation
    in the image [32]. After demarcating the spinal cord, the authors used SVM and
    k-nearest neighbors ML models to classify a spinal cord DTI image as either injured
    or normal, using fractional anisotropy as a predictor. The algorithms achieved
    a specificity of 0.952 and a sensitivity of 0.912.


    # 12.3 MACHINE LEARNING AND INTRAOPERATIVE CARE


    Neurosurgery is a unique surgical specialty in that it employs a host of organ-specific
    intraoperative monitoring modalities to ensure surgical success. These modalities
    include intraoperative imaging, electrophysiological monitoring, and neurophysiological
    monitoring. Given that neurosurgery relies both on manual skill and quick-thinking
    diagnostic ability during each operation, the field is a very suitable candidate
    to additionally employ ML in the intraoperative context.


    Parkinson’s disease is a movement disorder that arises as a consequence of degeneration
    of dopaminergic neurons in the substantia nigra of the basal ganglia [33]. Medical
    management of Parkinson’s disease involves boosting dopaminergic activity, bringing
    about some symptomatic relief [34]. However, in cases that are refractory to medical
    management, surgical intervention via deep brain stimulation (DBS) of basal ganglia
    structures (e.g. subthalamic nucleus, STN) is an option [34,35]. In this procedure,
    a microelectrode recorder is passed through the brain to map out the relevant
    brain structures and ideally identify the STN. Taghva developed hidden Markov
    models to detect whether a microelectrode is within the STN during DBS, using
    simulated brain anatomy involved in the actual procedure [36,37]. The models achieved
    accuracies between 98% and 99% in classifying the location of the simulated microelectrode,
    with specificities and sensitivities above 95% when it came to identifying whether
    the microelectrode was specifically inside the STN. While most seasoned clinicians
    performing DBS surgery should be able to recognize the STN, this algorithm will
    be able to augment their recognition and may be generalizable to novel brain targets
    in Parkinson’s.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'Intracranial pressure (ICP) monitoring, particularly in patients with traumatic
    brain injury, is an important tool in the neurosurgeon''s arsenal [38]. In the
    intraoperative context, ICP monitoring has been said to have important therapeutic
    and prognostic implications [39]. ICP morphology, as a result, can have an important
    diagnostic value, especially when employed intraoperatively. Nucci and colleagues
    [40] developed artificial neural networks to detect and classify CSF pressure
    waveforms. Using the diagnosis of an expert examiner as the ‘ground truth’, the
    neural network achieved 88.3% accuracy when it came to classifying CSF pressure
    waves. Theoretically, these results may be extended to the intraoperative scenario
    to aid neurosurgeons in the rapid interpretation of ICP.


    Spinal surgery frequently carries the risk of cord damage, which means that intraoperative
    electrophysiological monitoring can be useful in allowing surgeons to recognize
    and prevent potential neurological deficits. Somatosensory evoked potentials (SEPs)
    are often used as metrics to gauge the electrophysiological status of the spinal
    cord [41,42]. However, various surgical and anesthetic factors can hamper the
    interpretation of the SEP profile; in addition, the use of human experts to interpret
    SEPs may be subject to inter-rater variations [43]. To rectify these issues, Fan
    and colleagues [44] created least squares support vector regression models to
    construct an SEP baseline; the baseline constructed by these models was superior
    to the nominal baseline as far as allowing successful SEP monitoring and preventing
    false warnings about spinal cord damage.


    # 12.4 MACHINE LEARNING AND NEUROSURGICAL PROGNOSIS


    To date, prognostic ML models have been the most extensively developed in neurosurgery,
    as they are able to leverage numerical epidemiological data, as opposed to imaging
    or intraoperative data, which are necessarily more difficult to build models around.
    Prognostic models can serve a crucial role in clinical practice, by helping to
    manage expectations, by identifying patients who may potentially require additional
    intervention, and by even predicting the discharge course of patients. Although
    these models span a multitude of areas, they generally follow similar principles.
    They utilize patient data (e.g. age, comorbidities, and preoperative neurological
    status) to predict postoperative outcomes, which can include functional outcomes,
    quality-of-life outcomes, and others. ML-based prognostic'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'models have thus far been applied to nearly all areas of neurosurgery, including
    epilepsy, Parkinson''s disease, neurotrauma, neuro-oncology, and spine pathology
    [45].


    A systematic review from 2018 by Senders and colleagues [45] describes in extensive
    detail how ML-based outcome prediction is used in numerous neurosurgical domains.
    In the field of epilepsy, the nine articles examined in the review all predicted
    seizure freedom in patients who underwent surgery for temporal lobe epilepsy using
    ML algorithms (e.g. SVM, random forest, neural networks, naive Bayes, and k-nearest
    neighbor) [46–54]. The nine studies used a multitude of input features, including
    clinical variables, MRI findings, and EEG findings. Overall, the studies obtained
    a classification accuracy ranging from 70% to 98% (median: 92%) and an AUC ranging
    from 0.63 to 0.94. Similarly, four studies used ML to predict survival after either
    surgical resection, biopsy, or stereotactic radiosurgery on primary or metastatic
    brain tumors [55–58]. The studies used algorithms such as SVM and neural networks
    and achieved AUCs between 0.76 and 0.85, indicating good predictive performance.
    Two other studies additionally predicted cancer recurrence in patients who received
    either gamma knife radiosurgery for metastatic brain tumors (accuracy: 95% and
    AUC: 0.88) [59] or gross-total resection for glioblastomas (accuracy: 91%, AUC:
    0.84) [60].


    In traumatic brain injury, Shi and colleagues [61] used artificial neural networks
    to predict in-hospital mortality after intracranial decompression (either via
    craniectomy or hematoma evacuation), achieving an accuracy of 95% and an AUC of
    0.89. More recently, Gravesteijn and colleagues [62] developed ML models to predict
    mortality and unfavorable outcome (defined by a Glasgow Coma Scale <4) after traumatic
    brain injury. However, the authors found no difference between ML models (e.g.
    SVM and random forest) and traditional logistic regression in the discrimination
    and calibration of predictions. For Parkinson''s disease, two studies used ML
    techniques (e.g. SVM, random forest, and naive Bayes) to predict motor improvement
    after DBS of the STN [63,64]. One study achieved an accuracy of 86% when predicting
    motor improvement 9 months after DBS [64] while the other achieved an accuracy
    of 95% when predicting motor improvement 2 years after DBS [63].


    In the realm of spine disease, ML algorithms have recently begun to be used for
    outcome prediction in both traumatic and nontraumatic SCI. In traumatic SCI, DeVries
    and colleagues [65] have developed unsupervised'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'ML algorithms to predict independence in walking either at discharge or at
    1-year follow-up, demonstrating that the ML algorithms were equivalent in performance
    to their logistic regression counterparts for the same task. Along a similar path
    of inquiry, Inoue and colleagues [66] recently created an ‘xgboost’ algorithm
    to predict recovery in neurological status (judged according to the American Spinal
    Injury Association Impairment Scale or AIS) 6 months postinjury. Using patient
    data, MRI findings, and treatment variables among the predictors, the authors
    demonstrated that the ‘xgboost’ algorithm was superior in accuracy to a logistic
    regression model and a decision tree model in making the same predictions (accuracy:
    81.1% and AUC: 0.867), although the AUC fell slightly short of the target set
    by the logistic regression model (0.877).


    Nontraumatic SCI can be divided anatomically into cervical spine disease (often
    termed degenerative cervical myelopathy or DCM) and lumbar spine disease. Hoffman
    and colleagues [67] published one of the early studies which applied support vector
    regression to predict the Oswestry Disability Index (ODI, a functional outcome)
    after surgery for DCM, demonstrating that preoperative ODI and symptom duration
    were among the most important variables in successful outcome prediction by the
    ML model. This work was followed up by the works of Merali et al. [68] and Khan
    et al. [69], who developed multiple ML algorithms to predict functional and health-related
    quality-of-life outcomes 6 months, 1 year, and 2 years after surgery for DCM.
    The typical AUC for these models was around 0.7–0.78.


    In addition to being used to predict functional and quality-of-life outcomes,
    ML algorithms have also been developed to predict opioid use after cervical and
    lumbar spine surgery. In two separate studies, Karhade and colleagues used ML
    models to predict prolonged opioid use after cervical [70] and lumbar spine surgery
    [71], using preoperative factors such as insurance status, tobacco use, and history
    of depression. The authors achieved AUCs of 0.81 for both the cervical spine model
    (stochastic gradient boosting algorithm) and the lumbar spine model (elastic-net
    penalized logistic regression). Finally, work has also been done for the prediction
    of discharge disposition, where Karhade et al. used a large National Surgical
    Quality Improvement Program database containing 26,000 patients to develop ML
    algorithms predicting patients with a nonroutine discharge [72]. The developed
    ML algorithms allowed the authors to achieve good calibration and discrimination
    (AUC: 0.82).'
