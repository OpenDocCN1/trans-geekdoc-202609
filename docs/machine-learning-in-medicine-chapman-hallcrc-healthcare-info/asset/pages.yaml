    # 3.5 MULTI-CLASSIFIER AND IMPROVING PERFORMANCE


    As described above, one of the major challenges in machine learning is going from
    a binary classifier to a multi-classifier of disease processes while at the same
    time maintaining or improving the sensitivity and specificity of the model. De
    Fauw et al. [17] tried to tackle this and also used three-dimensional optical
    coherence tomography scans as opposed to the two-dimensional photographs that
    are often used in assessing the performance of machine learning in healthcare.
    The model first contained a segmentation network that analyzed the OCT image and
    labeled the segments of the image in one of the 15 possible classes. Some of the
    possible labels included neurosensory retina, intraretinal fluid, retinal pigment
    epithelium, and artifact such as from blinking. Next, the model contained a classification
    network that identified the image as urgent, semi-urgent, routine, or observation.
    The classification network also categorized the image among ten different OCT
    pathologies. Overall, the neural network achieved an AUC over 0.99 for most pathologies
    with the lowest being 0.9663. These results were on par with the performance of
    experts in the ophthalmology field when they were provided the OCT images. The
    results of this study show that machine learning can continue to provide high
    accuracy even when it is expected to diagnose among multiple pathologies.


    Data augmentation has been studied extensively in the last few years in order
    to further improve the capabilities of machine learning. Data augmentation includes
    changing aspects of one image so that the neural network is exposed to variability
    that is often present in the real world. In ophthalmology, one study looked specifically
    at the impact of data augmentation in the performance of the neural network [18].
    OCT images were inputted into the neural network and the model was expected to
    differentiate between five different OCT conditions: - acute macular degeneration,
    central serous retinopathy, diabetic retinopathy, macular hole, and normal. The
    specific data augmentation techniques used in this analysis included rotation,
    width and height shear, horizontal flip, and Gaussian noise. In Gaussian noise
    data augmentation, noise is added to the image based on the Gaussian distribution
    resulting in distortion of the high-frequency features of the model. The addition
    of these data augmentation techniques led to a 6% improvement in AUC (from 0.91
    to 0.97) and the'
