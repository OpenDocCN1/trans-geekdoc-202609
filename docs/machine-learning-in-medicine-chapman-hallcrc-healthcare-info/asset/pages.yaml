    # 5.2.5 PReLU


    Parametric ReLU (PReLU) [14] is defined as


    $$y_{i} = f \left(x_{i}\right) = \begin{cases} a_{c}x_{i}, \ x_{i} < 0 \\ x_{i},
    \ x_{i} \geq 0 \end{cases}$$


    where *aᵢ* includes real numbers that are different for every channel of the input.
    PReLU is the same as Leaky ReLU except that the parameters *aᵢ* are learnable.


    The gradients of PReLU are


    $$\frac{dy_{i}}{dx_{i}} = f^{\prime \prime}\left(x_{i}\right) = \begin{cases}
    a_{c}, \ x_{i} < 0 \\ 1, \ x_{i} \geq 0 \end{cases} \quad \text{and} \quad \frac{dy_{i}}{da_{c}}
    = \begin{cases} x_{i}, \ x_{i} < 0 \\ 0, \ x_{i} \geq 0 \end{cases}$$


    Note that the slopes of the left-hand sides are all initialized to 0.


