    # 13.4 DISCUSSION


    The average cumulative segmentation algorithm had a sensitivity of $0.997 \pm
    0.008$ and a specificity of $0.9998 \pm 0.001$. This high level of accuracy demonstrates
    the benefit of using a manual input to initialize automatic segmentation. Using
    manual segmentation alone would be too time intensive to be used in a practical
    healthcare setting, while utilizing only an automatic segmentation approach would
    not provide sufficient segmentation accuracy to delineate and quantify the diameters
    of the smaller arteriolar ($< 10 \mu m$) cerebral blood vessels. The proposed
    segmentation algorithm combines the accuracy of manual segmentation with the benefit'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'of an automated and less time-intensive approach and provides segmentation
    with a high degree of accuracy while also minimizing the required time and effort.


    The high degree of sensitivity and specificity of our approach in accurately delineating
    blood vessels from the surrounding brain tissue enables the quantification of
    cerebrovascular changes. The PDFs indicate the total blood vessel diameter change
    in time from day 0 to day 700. Below the circle of Willis, there is a statistical
    correlation between PDFs and systemic BP ($ P = 0.0007 $), demonstrating that
    increased MAP and consequently CPP are related to decreased average vessel diameter
    and PDF. The BP and MAP measurements correlate well with most patients'' non-invasive
    mean PDF diameter measurements below the circle of Willis. Since cerebral changes
    have been hypothesized to preclude systemic hypertension [9,10,26], our methodology
    may present a tool for potentially initiating early treatment to prevent or optimize
    management of systemic HBP in conjunction with other approaches including cognitive
    testing. This finding is important as it suggests that the remodeling of vessels
    due to increasing BP occurs prior to the onset of diagnosed essential hypertension.
    Individuals in the current study were explicitly selected to have pre-hypertensive
    values of BP of equal importance; the methodology can determine the relationship
    of cerebrovascular remodeling to cortical small vessel disease and lacunar lesions
    are known to occur with advanced hypertensive disease and with implications for
    stroke and dementia [27,28]. The correlation of PDF to MAP was independent of
    patient gender. The difference in PDF of vessels above the circle of Willis was
    statistically significant with age, which indicates that older patients have constricted
    cerebral vessels, which may put them at a higher risk of strokes.


    In some patients (C and D), the change in CDF did not correlate to changes in
    MAP, which may indicate impaired autoregulation of cerebral blood flow potentially
    due to cerebrovascular remodeling [5,26]. The 3D cerebrovascular model reconstruction
    of these patients demonstrated significant vascular changes between day 0 and
    day 700. These results may indicate that drug therapies prescribed using systemic
    BP alone may not provide optimal medical management. Lack of correlation between
    CDF and MAP may indicate cerebrovascular changes and a higher risk of cerebrovascular
    adverse events which necessitates more frequent monitoring and/or optimization
    of medical management, despite having normal systemic BP and MAP. Using a combination
    of BP and CDF changes may help minimize the occurrence of adverse events.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'The proposed approach uses MRA, which directly visualizes the overall cerebrovascular
    anatomy and provides a higher resolution for small blood vessels compared to Doppler
    Ultrasound which primarily assesses blood flow or the characteristics of a single
    or small number of vessels within its field of view. MRA is required for visualization
    of small cerebral blood vessels to obtain an accurate 3D vascular structure. Routine
    screening using the proposed MRA-based method would be expensive. The clinical
    application of importance would be to treatment-resistant hypertension, which
    is now poorly understood [29]. A recent study presents convincing data suggesting
    that such patients may have abnormalities of the vasculature, e.g. of the circle
    of Willis, that could be detected readily with our technique [30]. Other work
    has suggested that such hypertension may be due to impingement of the cerebral
    vasculature on brain stem BP regulatory areas [31]. These abnormalities could
    be detected with our technique. These vascular bases of hypertension, once identified,
    would guide clinical treatment in these cases which have not been remedied by
    currently used pharmacological dosing. Additionally, patients at a higher risk
    of developing hypertension due to familial or clinical history may be screened
    using the proposed approach despite the higher cost to detect vascular changes
    and manage high BP before disease onset.


    The segmentation algorithm and metrics for vascular and BP changes (CDF and PDF)
    are not limited to the cerebral vasculature. These methodologies may also be used
    to quantify vascular changes in other end organs that are sensitive to BP (e.g.
    Kidneys).


    # 13.5 LIMITATIONS


    While our segmentation algorithm significantly improves on automatic segmentation
    methodologies, it is limited by the resolution limit of the MRI machine performing
    the MRA scanning. The CDF diameters (Figure 13.5) start at 0.5 mm because the
    distance map calculations determine the radius from the edge of a blood vessel
    and a pixel in the MRA imaging represented 0.25mm. Any value less than 0.5 mm
    would not be accurately represented due to the resolution limit. Subsequently,
    the accuracy of the statistical analysis decreases with decreasing blood vessel
    size (smaller blood vessels< 10 μm) above the circle of Willis).


    Various over-the-counter medications and supplements were used by the subjects
    over the time period of this study; however, the BP changes'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'caused by these medications should be minimal. Nonetheless, larger sample sizes
    are required to establish a definitive relationship with progression to HBP. While
    elevated CPP is hypothesized to precede systemic hypertension, essential hypertension
    remains likely due to a mosaic of causes that are not completely understood. Despite
    these limitations, our method is relevant to understanding brain pathology relevant
    to hypertension whether such pathology precedes or follows the establishment of
    clinical hypertension.


    # ### 13.6 CONCLUSION


    Changes in cerebral vasculature can be non-invasively obtained through MRA image
    analysis. Cerebrovascular changes are correlated to MAP below the circle of Willis.
    The improved segmentation algorithm coupled with the calculation of CDF and PDF
    can indicate cerebrovascular and cerebral perfusion pressure changes, which may
    be a useful tool for clinicians to optimize the medical management of HBP. In
    addition to the vascular system [32–41], this work could also be applied to various
    other applications in medical imaging, such as the prostate [42–44], the kidney
    [45–72], the heart [73–89], the lung [90–137], the brain [138–158], the retina
    [159–163], the bladder [164], and injury prediction [165] as well as several non-medical
    applications [166–171].


