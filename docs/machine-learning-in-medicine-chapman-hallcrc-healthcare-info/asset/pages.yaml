    # 7.1.3 AI-Powered US in Radiology


    As medical imaging data increase immensely with the advancing multi-modality imaging
    technology (e.g. 2D/3D/4D anatomical and functional imaging US/CT/MR/PET/SPECT),
    there is a need for processing imaging data in an organized fashion to assist
    radiologists. Computer-aided detection and quantification (CAD) is an ongoing
    research subject in diagnostic radiology. CAD systems provide a second opinion
    to assist radiologists for image interpretation, which furthers the precision
    and consistency of diagnosis and decreases the image reading time. The greater
    part of CAD systems is based on traditional ML methods that employ texture features
    and involve several steps: image preprocessing, handcrafted feature extraction,
    selection of major features, and classification. Although CAD systems have shown
    great promise in assisting radiologists, they have several'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'limitations (e.g. using limited datasets, subjective selection of a region
    of interest that includes pathology, and data obtained from a single vendor at
    a single medical center). Therefore, it is hard to adapt traditional ML algorithms
    based on textures difficult in the clinical workflow to assist radiologists. Recently,
    studies in the field of DL have proposed DL-based US CAD systems [10,22]. DL methods
    allow conveying an experience learned from one dataset at a center to a new dataset
    acquired at another center with a different brand of US device by fine-tuning
    the model with the new dataset. This process is called transfer learning. Many
    AI-powered US approaches that are primarily used for detection, quantification,
    and classifications of diseases (e.g. benign or malignant thyroid nodules) have
    been developed in the last 5 years.


    Thyroid nodules, which are solid or fluid-filled lumps, are particularly frequent
    lesions that are found in 40%–50% of the adult population as shown in autopsy
    studies [23–26]. Fine needle aspiration (FNA) biopsy is the current and only nonsurgical
    test that differentiates a benign nodule from a malignant one in clinical practice.
    The overall frequency of cancer in patients with thyroid nodules selected for
    FNA is just about 10% as revealed in several studies [27,28]. Therefore, it is
    important to identify nodules that do not have a need of biopsy or surgery as
    the greater part of thyroid nodules are benign. A noninvasive and reliable diagnostic
    method will significantly cut healthcare costs and patient concerns about biopsy.
    To establish such a CAD system, sensitivity at or near 100% is desired to ensure
    that cancers are not missed with a reasonable specificity so that a good portion
    of benign lesions are not biopsied. Several studies have proposed DL approaches
    to classify and segment thyroid nodules from 2D US images. Assessing 2D cross-section
    images of thyroid nodules only is a limitation of current studies as cancer develops
    heterogeneously and 2D cross-sections might not be cutting through cancer developed
    within nodules. Therefore, 3D volume-based approaches would provide more accurate
    and reliable results than 2D imaging-based approaches. Recently, Ma et al. [29]
    proposed a DL method that employs the fusion of two customized CNN models for
    differentiating benign nodules from malignant nodules. The proposed model was
    trained on a large dataset of multi-US vendors collected from two hospitals (8,148
    patients from hospital 1 + 4,782 patients from hospital 2 and in a total of 15,000
    images) and accomplished an average accuracy of 83.02% ± 0.72% based on ten-fold
    cross-validation. Nevertheless, the receiver operating characteristic (ROC) curve
    shown in this study indicates that the proposed model generally misses some'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'malignant patients and does not hit 100% sensitivity, which makes this model
    unreliable to use as a diagnostic tool. In another study, Ma et al. and his colleagues
    [30] developed two CNN models that are stacked to each other for the detection
    of nodules from B-mode US images. The model was evaluated using *k*-fold cross-validation
    and an average area under curve (AUC) of 98.51% was reported. Segmentation of
    nodules from B-mode US images is a challenging task due to fuzzy and missed nodule
    boundaries, which makes the precise automatic segmentation of nodules very difficult
    and unreliable. Li et al. [31] utilized a Faster R-CNN model for detection of
    benign and malignant regions of nodules in B-mode US images. A sensitivity of
    93.5% and a specificity of 81.5% were achieved for the detection of papillary
    thyroid cancer. Another multi-cohort thyroid study with a large patient population
    that was collected from three hospitals was presented by Li et al. [32]. The study
    included in a total of 332,180 images of 45,644 patients. They assessed the sensitivity
    of their CNN model for cancer detection and compared the performance of the CNN
    model to a team of experienced radiologists. They concluded that their model’s
    sensitivity in the detection of malignant nodules is as good as an experienced
    radiologist with a better specificity. In another study, Akkus et al. [11] trained
    inception and ResNet CNN models with an attention map, which enhances the nodule
    region, to identify malignant nodules B-mode US images. The model was trained
    on both transverse and longitudinal cross-section images of thyroid nodules. The
    model achieved 86% (sensitivity) and 90% (specificity) for detecting malignancy
    on a test set of 100 nodule images. Their ROC curve suggests that biopsies could
    be reduced by 52% without missing patients with malignant thyroid nodules when
    the threshold is set to 100% sensitivity. Choi et al. [22] utilized a commercial
    CAD system to classify 102 nodules obtained from 89 patients into benign or malignant
    (S-Detect for Thyroid from Samsung Medison Co.). The sensitivity of Samsung S-Detect
    CAD system was shown to be similar to the performance of an experienced radiologist.
    Differently from other studies, Pereira et al. [33] utilized DL approaches that
    process SWE images for thyroid nodule characterization. An accuracy of 83% was
    obtained on a test dataset by using their proposed method. Lastly, Chi et al.
    [12] presented a GoogleNet CNN model with a transfer learning approach that accomplished
    an accuracy of 98.29% on a test dataset of 61 patients for differentiating a benign
    nodule from a malignant one.


    Breast cancer is one of the most common cancer types among women. It is also the
