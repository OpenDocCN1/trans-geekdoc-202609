    # ## 11.5 CONCLUSION AND FUTURE WORKS


    We developed a DT-based solution for automating the diagnosis of LVH and NAFLD.
    The proposed DT-based model is capable of discovering rules to assist in disease
    diagnosis and they are consistent with the physician''s findings. Rules generated
    by the DT are comprehensible by physicians and is thus more appropriate for using
    them in clinical settings. The essential characteristics of the DT algorithm have
    been described in this chapter; the usefulness of it was also shown in cases of
    LVH and NAFLD. The entropy of this data without linear relationship between variables
    was handled efficiently by DT algorithms. They improved the established criteria
    for LVH or suggest new relations and ability of classification for NAFLD. DT''s
    easy interpretability increases its popularity in medicine, which can be supported
    by the number of research based on DT recently published in the literature. At
    the time of writing this chapter, the results for search of the keyword “decision
    tree” in pubmed (a search engine by the National Library of Medicine and National
    Institute of Health) show the rise of research that used DT algorithms from only
    one article in 1967 to 1,444 in the year 2020. DT shows state-of-the-art results
    in many complex classification and prediction problems; however, it faces some
    challenges as well. One of them is the instability of the DT, which means that
    subtle changes in the data produce a different tree. Like all branches of science,
    in medicine, accuracy is as important as the uniqueness of the problem solution.
    Hence, every experiment requires a large enough sample size and external validation
    to generalize the utility of the model.


    As it was mentioned before, DT had a competitive performance in big and very complex
    data. Further improvement of the original algorithm was proposed as transfer learning
    [23], semi-supervised learning [24], and anytime learning [25]. In the future,
    we aim to develop a more efficient and generalized cost-sensitive and look ahead
    DT with the help of transfer, semi-supervised, and anytime learning for automating
    the routine diagnostic procedure.'
