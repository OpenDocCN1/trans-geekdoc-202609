    # 9.3 FOCAL TVERSKY LOSS FUNCTION FOR CLASS IMBALANCE


    This section tackles the class imbalance problem, which is common in the biomedical
    imaging field. Class imbalance is especially common'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'in medical segmentation problems. In segmentation problems such as lesion segmentation,
    typically the lesion (foreground) only occupies a small portion of the image.
    Such imbalanced data can result in unstable results in popular segmentation frameworks
    [18]. In recent literature, CNN have been successful in segmenting lesions in
    medical imaging data [18]. Instead of typical CNN, segmentation problems employ
    fully convolutional networks (FCN), where fully connected layers are dropped for
    efficient pixel-wise segmentation. One of the most popular FCN architectures is
    U-Net [19]. On top of FCN, U-Net introduces other improvements such as multiple
    skill connections and up-convolution layers with learnable parameters.


    Some recent works propose new loss functions to deal with the class imbalance
    in medical image segmentation. The focal loss function proposed in Ref. [1], a
    popular cross-entropy loss function obtained by introducing an exponential factor,
    emphasizes learning from the class with a smaller number of samples. The focal
    loss prevents the vast number of easy negative examples from dominating the gradient
    to alleviate class imbalance. In practice, however, it faces difficulty balancing
    precision and recall due to very small regions-of-interest (ROI) found in medical
    images. Research efforts to address small ROI segmentation propose more discriminative
    models such as attention gated networks [20].


    To address the aforementioned issues, we combine attention gated U-Net with a
    novel variant of the focal loss function, better suited for small lesion segmentation.
    We propose a novel focal Tversky loss function (FTL) that provides improvement
    over the focal loss by incorporating the Tversky index [7] that addresses the
    imbalance between precision and recall in the focal loss function. Then, we combine
    this proposed loss function with a deeply supervised attention U-Net [20], improved
    with a multi-scaled input image pyramid for better intermediate feature representations.²


    We extend from the Dice loss (DL) function described in Ref. [18], whose limitation
    is that it equally weighs false positive (FP) and false negative (FN) detections.
    Failing equally weight FP and FN results in segmentation maps with high precision.
    However, the recall is lowered because of this issue. Medical segmentation data
    such as lesion segmentation problems have only a few pixels annotated as ground-truth
    foreground. Therefore, even a few ground truth foreground pixels being mislabeled
    will result in a drastic reduction in the recall rate. Therefore, we need to put
    a higher weight on FN when compared to FP if we want to increase the recall rate.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'The Tversky index can help us in achieving a better weighting between FP and
    FN:


    ```

    $$TI_c = \frac{\sum_{i=1}^N p_{ic}g_{ic} + \epsilon}{\sum_{i=1}^N p_{ic}g_{ic}
    + \alpha\sum_{i=1}^N p_{ic}g_{ic} + \beta\sum_{i=1}^N p_{ic}g_{ic} + \epsilon}
    \tag{9.2}$$

    ```


    where $p_{ic}$ is the probability that pixel $i$ is of the lesion class $c$ and
    $p_{i\bar{c}}$ is the probability that pixel $i$ is of the non-lesion class, $\bar{c}$.
    The same is true for $g_{ic}$ and $g_{i\bar{c}}$, respectively. The total number
    of pixels in an image is denoted by $N$. Hyperparameters $\alpha$ and $\beta$
    can be tuned to shift the emphasis to improve recall in the case of large class
    imbalance. The Tversky index is adapted to a loss function (TL) in Ref. [7] by
    minimizing $\sum_c 1 - TI_c$.


    Another issue with the DL is that it struggles to segment small ROIs as they do
    not contribute to the loss significantly. To address this, we propose the FTL,
    parametrized by $\gamma$, for control between easy background and hard ROI training
    examples. In Ref. [1], the focal parameter exponentiates the cross-entropy loss
    to focus on hard classes detected with lower probability. The focal loss has recently
    been incorporated into the DL function as well [21]. We follow a similar approach
    to define our FTL:


    ```

    $$FTL_c = \sum_c (1 - TI_c)^{1/\gamma} \tag{9.3}$$

    ```


    where $\gamma$ varies in the range [1,3]. In practice, if a pixel is misclassified
    with a high Tversky index, the FTL is unaffected. However, if the Tversky index
    is small and the pixel is misclassified, the FTL will decrease significantly.


    When $\gamma > 1$, the loss function focuses more on less accurate predictions
    that have been misclassified. However, we observe over-suppression of the FTL
    when the class accuracy is high, usually as the model is close to convergence.
    To alleviate this issue, we have experimented with higher values of $\gamma$.
    With trial-and-error, we have found that $\gamma = \frac{4}{3}$ achieves the best
    performance across the board. This is the value we used in all the experiments
    in this work. To further tackle the over-suppression of FTL, instead of using
    it for all layers, we only use FTL with the intermediate layers. The very last
    layer is supervised with the Tversky loss instead to provide'
  merge: -1
  img_proc: true
