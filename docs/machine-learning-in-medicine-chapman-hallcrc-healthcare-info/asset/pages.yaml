    # Study II: Hippocampal and Amygdalar Study:

    FLAIR and Volumetric Features


    It has been shown that in about 10% of the mTLE patients, alterations in amygdalar
    volume and T2 relaxometry do not accompany changes in the hippocampus, cerebral
    cortex, cerebellum, and thalamus [35,36,50,51]. This restricted histopathological
    distribution led the researchers to use changes in amygdalar volume and FLAIR
    intensity as the supplementary features in mTLE lateralization. In Ref. [37],
    the mean and the standard deviation of the FLAIR signal in the amygdala were added
    to the features investigated in Study I to improve the results of classification.
    Accordingly, four features related to the FLAIR images—mean and standard deviation
    ratios for amygdala and hippocampus and two features related to the hippocampal
    volumetry—were used for mTLE lateralization.


    Segmentation of the amygdala and hippocampus, which are used in the downstream
    analysis, was performed manually on the T1-weighted images (Figure 6.1). The hippocampus
    and amygdala segmentations were then mapped to the FLAIR images, after rigidly
    registering the T1-weighted image to the FLAIR image for each subject separately.
    The FLAIR mean and standard deviation were then calculated for each structure,
    i.e., hippocampus and amygdala, in each hemisphere, and then the right to left
    ratios of the mean and the standard deviation for each structure were used as
    features for the lateralization of mTLE.


    Similar to Study I, the means and standard deviations of the FLAIR signal intensity
    in the hippocampus and amygdala were calculated. To reduce the bias imposed by
    the use of a different scanner, an intensity'
  merge: -1
