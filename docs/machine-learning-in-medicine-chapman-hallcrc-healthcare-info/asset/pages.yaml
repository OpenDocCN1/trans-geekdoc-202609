    # 4.3.2 CNN Formulation of Bio-Heat Transfer on 2D Grids


    # 4.3.2.1 2D Regular Grids


    As illustrated in Figure 4.2, the CNN formulation of bio-heat transfer on a 2D
    rectangular grid is achieved by using FDM to discretise the Pennes bio-heat transfer
    equation in the spatial domain, yielding:


    ```

    $$ \begin{aligned} \rho_{i,j} C_{i,j} \frac{\partial T_{i,j}(t)}{\partial t} &=
    - \bigg( \frac{2 k_{i,j}}{\Delta u_{i-1} \Delta u_i} + \frac{2 k_{i,j}}{\Delta
    v_{j-1} \Delta v_j} + w_{b,i,j} C_{b,i,j} \bigg) T_{i,j}(t) \\ &+ \frac{2 k_{i+1,j}
    T_{i+1,j}(t)}{\Delta u_i(\Delta u_{i-1} + \Delta u_i)} + \frac{2 k_{i-1,j} T_{i-1,j}(t)}{\Delta
    u_{i-1}(\Delta u_{i-1} + \Delta u_i)} + \frac{2 k_{i,j+1} T_{i,j+1}(t)}{\Delta
    v_j(\Delta v_{j-1} + \Delta v_j)} \\ &+ \frac{2 k_{i,j-1} T_{i,j-1}(t)}{\Delta
    v_{j-1}(\Delta v_{j-1} + \Delta v_j)} + w_{b,i,j} C_{b,i,j} T_{a,i,j} + Q_{i,j}
    + H_{i,j} \quad (4.9) \end{aligned} $$

    ```'
