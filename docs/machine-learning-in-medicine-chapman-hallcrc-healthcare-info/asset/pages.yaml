- pgno: 254
  md: '![](img/6554116edbb19a8210b75a29243fd6ec_254_0.png)


    FIGURE 13.3 Illustration of segmentation accuracy and errors of the proposed automatic
    segmentation (C) by comparing to the ground truth (G) [5].


    **Generation of Probability Distribution Function and Validation:** The EM-based
    technique is adapted to the LCDG-model. In order to calculate the probability
    distribution of changes in the cerebrovascular structure, the distance map is
    used to extract the distribution of pixel distances. The distribution of white
    pixels is marked by the PDF, as a true value and black pixels being ignored for
    the data set. The diameters of the blood vessels are determined by estimating
    Euclidian center point distances from the edge of a vessel. The data points in
    the generated PDFs are then extracted and compared to the BP data using statistical
    analysis.


    **Calculation of Cumulative Distribution Function:** The integral of the PDF is
    used to generate the CDF. (The CDF $F_X$ of a random variable $X$ is calculated
    from its PDF $f_X$ using $F_X(x) = \int_{-\infty}^{x} f_X(t)dt$.) The CDF shows
    the total summated probability that a blood vessel will take a value less than
    or equal to a diameter value that represents an average blood vessel diameter
    in each slice. It shows the cumulative distribution of the PDF with an upper limit
    of 1. The more quickly the CDF line approaches 1, the more certain that the diameter
    of the blood vessel is smaller compared to a CDF that takes longer to approach
    1. This is illustrated in the Results section.


    # 13.2.3 Statistical Analysis


    Statistical analysis was performed using R software, version 3.3. A mixed effects
    linear model was used to test the relationship of MRA data with clinical BP measurements.
    Brain slices were separated into upper'
  merge: -1
  img_proc: true
- pgno: 255
  md: '(above the circle of Willis) and lower (below the circle of Willis) compartments
    to determine the correlation with clinical BP readings. The circle of Willis,
    near the brain base, is where the intracranial cerebral arteries take off from
    and give rise to progressively smaller vessels [5]. The BP measurements were combined
    into a single value, the estimated MAP = (2×DBP + SBP)/3, which was a covariate
    in the model. Also included in the model were patient age, gender, and a random
    intercept per patient. The dependent variable was the mean of the Euclidean distance
    map over the entire vascular tree within each compartment. (Two separate models
    were fit to the upper and lower compartments.) Statistical significance of fixed
    effects in the fitted models was determined using likelihood ratio chi-squared
    tests.


    # 13.2.4 3D Reconstruction of the Cerebral Vasculature


    A growing tree model that eliminates any unwanted segmented voxels by choosing
    the greatest connected vascular tree system, coupled with a smoothing algorithm,
    was used to generate a 3D model based on segmented slices [23]. An example for
    the resultant vascular system is visualized and illustrated in the Results section.


    # 13.3 RESULTS


    Specificity and sensitivity values were obtained from the segmented images as
    shown below in Table 13.1. The automatically segmented slices for all 15 patients
    were compared to the manually segmented GTs to determine the accuracy of the algorithm
    (Figure 13.4). The segmentation algorithm resulted in a cumulative sensitivity
    of 0.997±0.008 (sensitivity range = 0.969–1) and the cumulative specificity of
    0.9998±0.0001 (specificity range = 0.9994–1). The manually segmented training
    slices (every tenth slice) were excluded in the accuracy calculations of the proposed
    segmentation approach.


