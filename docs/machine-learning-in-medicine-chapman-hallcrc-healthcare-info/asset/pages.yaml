    otherwise known as the cumulative distribution function, to observe the sumamted
    probability of cerebrovascular changes in the same patient from the first day
    of the trial (day 0) to its very last (day 700).


    **Manual Segmentation of Training Slices:** MRA data from a patient consist of
    160 MRA slices. Every tenth slice is manually segmented to extract the blood vessels
    from surrounding tissue using Adobe Photoshop (Adobe Systems, CA). This methodology
    allows for delineation of the in-plane blood vessel from the surrounding tissue
    at a pixel level accuracy where the largest limitation is the resolution of the
    MRI machine itself. The manually segmented training binary (black for the surrounding
    tissue and white for the target vasculature) slices are referred to as a ground
    truth (GT) as the images are correct and free from artifacts or noise (Figure
    13.2). The manual segmentation of select slices is used for the initialization
    and optimization of the segmentation algorithm, which is subsequently used for
    segmenting all obtained slices.


    **Automatic Segmentation:** One of the most challenging issues relating to common
    computer-assisted diagnostics is the segmentation of accurate 3D cerebrovascular
    system information from MRA images. Our approach is to rapidly and accurately
    extract the blood vessel data by defining the probability models for all regions
    of interest within the statistical approach and not predefining the probability
    models [15–17]. For each MRA slice, an'
