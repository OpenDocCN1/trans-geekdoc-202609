    smaller network and with lower-dimensional training data generated from the feature
    generator, to learn the posterior distribution of the parameters (after having
    initialized with random normal priors).


    Once we have the posterior distributions of the network parameters (weights and
    biases), the next step is to come up with a confidence measure. Our proposed confidence
    measure consists of two tunable parameters. The steps to calculate these are described
    below:


    +   1. Sample a reasonable number (1,000 in our experiments) of networks from
    the posterior distributions using Monte Carlo sampling. Each of these sampled
    networks is a deterministic network by itself.


    +   2. Classify each image by each of the sampled networks. Record the probabilities
    for both classes (benign and malignant) for each image.


    +   3. Use two parameters $N$ and $P$, where $N$ denotes the fraction of the sampled
    number of networks that have a minimum probability'
