    # 6.3.2 Study II: Hippocampal and Amygdalar Study – FLAIR Intensity and Volumetry


    Since alterations in amygdalar volume and FLAIR intensity have often been found
    to accompany alterations in the hippocampus in cases of mTLE, the mean and standard
    deviation of the FLAIR intensity in the amygdala were examined for lateralization
    of epileptogenicity along with the ones from the hippocampus. For lateralization
    based on FLAIR, two linear classifiers were derived by linear discriminant analysis
    using the amygdalar and hippocampal FLAIR features for the right and left mTLE.


    In the first step, the use of two different scanners, i.e., 3 T and 1.5 T, was
    found to make no significant difference between amygdalar FLAIR features in control
    subjects. The results also showed that the linear clas-sifier based on the amygdalar
    FLAIR intensity-ratio features, i.e., mean and SD ratios, correctly lateralized
    78% of the cases while only 29% of these cases were outside the uncertain region.
    The linear classifier based on the hippocampal FLAIR intensity features was successful
    to lateralize the epileptogenicity at the rate of 87% while a 70% accuracy was
    obtained when considering the correctly classified subjects placed within the
    uncer-tain region as misclassified subjects (uncertain group). As expected, a
    sig-nificant correlation between hippocampal and amygdalar FLAIR mean intensity
    ratios was detected $( P<10^{-18} )$. In addition, classification using hippocampal
    and amygdalar FLAIR mean intensity ratios resulted in sim-ilar laterality for
    74% of the patients. Interestingly, four patients (6%) who are placed within the
    uncertain region based on the hippocampal mean intensity ratio were correctly
    lateralized using the amygdalar mean inten-sity ratio. This showed that amygdalar
    and hippocampal FLAIR intensity provided complementary information.


    The lateralization based on the hippocampal volumetric feature resulted in 75%
    accuracy, which decreased to 67% when considering the uncertain region. The lateralization
    based on the amygdalar volumetric feature alone was about 29% accurate.


