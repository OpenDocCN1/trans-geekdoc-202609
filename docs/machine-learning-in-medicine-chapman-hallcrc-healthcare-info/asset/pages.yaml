    # 4.3.3.1 3D Regular Grids


    The CNN formulation on 3-D regular grids can be expressed using a generalisation
    of 2D CNN to higher dimension cases, by a 3D rectangular array of cells. Define
    a grid point $i,j,k$ associated with the cell $C(i,j,k)$, and $\Delta w_{k-1}=||\mathbf{P}_{i,j,k-1}\mathbf{P}_{i,j,k}||$
    and $\Delta w_{k}=||\mathbf{P}_{i,j,k}\mathbf{P}_{i,j,k+1}||$ where $\mathbf{P}_{i,j,k}$
    is the position of the grid point $i,j,k$. In analogy to the 2D regular grid case
    using FDM, the discrete form of the Pennes bio-heat transfer equation on a 3D
    regular grid can be expressed as


    ```

    $\rho_{i,j,k}C_{i,j,k}\frac{\partial T_{i,j,k}(t)}{\partial t}=-\left(\frac{2k_{i,j,k}}{\Delta
    u_{i-1}\Delta u_{i}}+\frac{2k_{i,j,k}}{\Delta v_{j-1}\Delta v_{j}}+\frac{2k_{i,j,k}}{\Delta
    w_{k-1}\Delta w_{k}}+w_{b,i,j,k}C_{b,i,j,k}\right)T_{i,j,k}(t)$


    $+\frac{2k_{i+1,j,k}T_{i+1,j,k}(t)}{\Delta u_{i}(\Delta u_{i-1}+\Delta u_{i})}+\frac{2k_{i-1,j,k}T_{i-1,j,k}(t)}{\Delta
    u_{i-1}(\Delta u_{i-1}+\Delta u_{i})}$


    $+\frac{2k_{i,j+1,k}T_{i,j+1,k}(t)}{\Delta v_{j}(\Delta v_{j-1}+\Delta v_{j})}+\frac{2k_{i,j-1,k}T_{i,j-1,k}(t)}{\Delta
    v_{j-1}(\Delta v_{j-1}+\Delta v_{j})}$


    $+\frac{2k_{i,j,k+1}T_{i,j,k+1}(t)}{\Delta w_{k}(\Delta w_{k-1}+\Delta w_{k})}+\frac{2k_{i,j,k-1}T_{i,j,k-1}(t)}{\Delta
    w_{k-1}(\Delta w_{k-1}+\Delta w_{k})}$


    $+w_{b,i,j,k}C_{b,i,j,k}T_{a,i,j,k}+Q_{i,j,k}+H_{i,j,k}$


    (4.19)

    ```


    The parameters of the autonomous CNN are associated with the parameters of the
    discrete Pennes bio-heat transfer equation, leading to:


    ```

    $C_{x}=\rho_{i,j,k}C_{i,j,k}\nu_{x}i_{jk}=T_{i,j,k}(t)\quad I_{jk}=w_{b,i,j,k}C_{b,i,j,k}T_{a,i,j,k}+Q_{i,j,k}+H_{i,j,k}$

    ```


    ```

    $A(i,j,k;i,j,k)=-\left(\frac{2k_{i,j,k}}{\Delta u_{i-1}\Delta u_{i}}+\frac{2k_{i,j,k}}{\Delta
    v_{j-1}\Delta v_{j}}+\frac{2k_{i,j,k}}{\Delta w_{k-1}\Delta w_{k}}+w_{b,i,j,k}C_{b,i,j,k}\right)+\frac{1}{R_{x}}$

    ```


    ```

    $A(i,j,k;i+1,j,k)=\frac{2k_{i+1,j,k}}{\Delta u_{i}(\Delta u_{i-1}+\Delta u_{i})}\quad;\quad
    A(i,j,k;i-1,j,k)=\frac{2k_{i-1,j,k}}{\Delta u_{i-1}(\Delta u_{i-1}+\Delta u_{i})}$

    ```


    ```

    $A(i,j,k;i,j+1,k)=\frac{2k_{i,j+1,k}}{\Delta v_{j}(\Delta v_{j-1}+\Delta v_{j})}\quad;\quad
    A(i,j,k;i,j-1,k)$


    $=\frac{2k_{i,j-1,k}}{\Delta v_{j-1}(\Delta v_{j-1}+\Delta v_{j})}$

