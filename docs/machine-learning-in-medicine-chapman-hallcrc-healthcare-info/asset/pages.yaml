- pgno: 111
  md: 'differences of paired structures were normalized to the total volume of the
    paired structures:


    ```

    $$f_{i}=\frac{v_{L i}-v_{R i}}{v_{L i}+v_{R i}} \tag{6.3}$$

    ```


    where $v_{Li}$ and $v_{Ri}$ denote the segmented volumes of the *i-th* region
    in the left and right hemispheres, respectively. To avoid human variability, the
    structures were segmented automatically using FreeSurfer [48]. The premise behind
    the use of the volume-based features is that the recurrent excitations can result
    in cell death and consequently atrophy in the hippocampus and other related sites
    in the brain. Thus, the side-related volume changes may correlate with the side
    of epileptogenicity and their use may improve the lateralization accuracy.


    In Ref. [61], the feature selection step, which provides an optimal subset of
    the features, was performed by the wrapper subset evaluation proposed by Kohavi
    and John in 1997 [62]. This approach found the most distinctive subset of features
    with the highest mTLE lateralization accuracy. The wrapper subset evaluation method
    used a supervised learning algorithm to find the optimal subset among the possible
    feature subsets. Next, logistic regression (LR) and support vector machine (SVM),
    as two robust and widely used supervised classifiers, were employed and compared
    in terms of accuracy in the identification of the side of epileptogenicity of
    mTLE patients. The ridge estimator was used in the multinomial logistic regression
    implementation to prevent any overfitting. The following multinomial logistic
    regression kernel model computed the *a posteriori* probability of class $j$ given
    feature vectors, i.e., $[f_{1}, f_{2}, \ldots, f_{m}]$.


    ```

    $$Pr[j|[f_{1}, f_{2}, \ldots, f_{m}]] = \frac{e^{\beta_{0}^{j} + \beta_{1}^{j}f_{1}
    + \beta_{2}^{j}f_{2} + \cdots + \beta_{m}^{j}f_{m}}}{1 + \sum_{j=1}^{k-1} e^{\beta_{0}^{j}
    + \beta_{1}^{j}f_{1} + \beta_{2}^{j}f_{2} + \cdots + \beta_{m}^{j}f_{m}}} \tag{6.4}$$

    ```


    where $k$ was the number of classes and $\beta_{0}^{j}, \beta_{1}^{j}, \beta_{2}^{j},
    \ldots, \beta_{m}^{j}$ denote the coefficients that were obtained through the
    training process. Besides, the SVM was used to learn a hyperplane, i.e., an *m-dimensional*
    hyperplane model, with the maximum margins as a linear function of feature vectors.
    To implement the SVM classifier, Pegasos was used as a simple and effective stochastic
    sub-gradient descent algorithm [63].'
