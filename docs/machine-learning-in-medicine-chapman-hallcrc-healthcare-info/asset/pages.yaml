    the visibility of tissue boundaries.


    # 7.1.2 Deep Learning


    Artificial neural networks (ANN) that mimic biological neurons for creating representation
    for an input signal include many consecutive layers that learn a hierarchy of
    features from an input signal. ANN and the advance in graphics processing units
    (GPU) processing power have enabled the development of deep and complex DL models
    with multitasking at the same time. DL models can be trained with thousands or
    millions of samples to gain robustness to variations in data. The representation
    power of DL models is massive that can create representation for any given variation
    of a signal. Recent accomplishments of DL especially in image classification and
    segmentation applications made it very popular in data science community. Traditional
    ML methods use hand-crafted features extracted from data and process them in decomposable
    pipelines. This makes them more comprehensible as each component is explainable.
    On the other hand, they tend to be less generalizable and robust to variations
    in data. With DL models, we give up understandability in exchange for obtaining
    robustness and greater generalization ability, but generate complex and abstract
    features.


    State-of-art DL models have been developed for a variety of tasks such as object
    detection and segmentation in computer vision, voice recognition, and genotype/phenotype
    prediction. There are different types of models that include convolutional neural
    networks (CNNs) [2], deep Boltzmann machines, stacked auto-encoders [3], and deep
    belief neural networks [4]. The most commonly used DL method for processing images
    is CNNs as fully connected ANN would be quite computationally heavy for 2D/3D
    images and require extensive GPU memory. CNNs share weights across each feature
    map or convolutional layers to alleviate this. Since their first introduction
    in 1989 [5], CNNs have been widely utilized for image classification and segmentation
    tasks with great success [2]. CNN approaches have gained enormous awareness when
    CNNs achieved impressive results in the ImageNet [6,7] competition in 2012 [2],
    which includes natural photographic images. They were utilized to classify a dataset
    of around a million images that comprise 1,000 diverse classes, achieving half
    the error rates of the most popular traditional ML approaches [2].


    Training DL methods on a large amount of data resulted in remarkable results and
    robustness in ImageNet competition. DL methods are'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'also gaining recognition in the field of medical image analysis [8] (e.g. lesion
    diagnosis [1,9–13], tissue and lesion segmentation [1,14–18], and histopathological
    analysis [19,20]). The architectures of state-of-art CNN models are increasingly
    dense, with some models having more than 100 layers. This means millions of weights
    and billions of connections between nodes. Typically, a CNN architecture comprises
    consecutive layers of convolution, max-pooling, and activation. Feature maps are
    generated by convolving a convolutional kernel across the output of the previous
    layer. Max-pooling is employed to down-sample feature maps by computing the maximum
    value of a predefined neighborhood. Alternatively, convolutions with stride larger
    steps could be used for down-sampling. In addition, activation functions are applied
    to layers to produce nonlinear output and suppress redundancy. The most widely
    employed activation function is rectified linear unit (ReLU) that nonlinearly
    transforms input signal by clipping any negative input values to zero and passes
    only positive input values to the output [21]. A number of other activation functions
    (e.g. leaky RELU, ELU, sigmoid, maxout, and hyperbolic tangent) have also been
    used in the literature. As the final layer, a softmax nonlinearity function, which
    normalizes output scores into a multinomial distribution over labels, is employed.
    The output scores of the final CNN layer are connected to the softmax layer to
    obtain a prediction probability for each class. Furthermore, an optimizer such
    as stochastic gradient descent (SGD) minimizes the error between prediction and
    ground truth labels through an error or loss function. Later, gradients of the
    loss function with respect to weights with backpropagation using chain rule are
    estimated. Gradients and learning rate are used to update weights in each iteration
    and this continues to train CNN architectures until it converges to a steady state
    (Figure 7.3). Since DL algorithms do better than ML algorithms in general and
    exploit the GPU processing power, it allows real-time processing of US images.
    We will only focus on DL applications of AI-powered US in radiology and cardiology
    in the rest of this chapter.


    To assess the performance of ML models, data are generally split into training,
    validation, and test sets. The training set is used for learning about the data.
    The validation set is employed to establish the reliability of learning results
    and the test set is used to assess the generalizability of a trained model on
    unobserved data. When training samples are limited, *k*-fold cross-validation
    approaches (e.g. leave-one-out, five-fold, or ten-fold cross-validation) are utilized.
    In cross-validation, the data are divided randomly into *k* equal sized pieces.
    One piece is reserved for assessing the'
