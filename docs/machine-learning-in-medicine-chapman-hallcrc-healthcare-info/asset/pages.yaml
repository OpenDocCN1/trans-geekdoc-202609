- pgno: 67
  md: 'of tissue temperature is governed by the bio-heat transfer equation in which
    the exciting input is the heat source that is induced by the various thermal modalities,
    the thermal doses can be controlled by the operator of ablation via the instrument
    power and heating time. The same amount of thermal doses at a material point in
    tissues may be achieved by (1) a high power input with a short heating duration
    or (2) a low power input with a long heating duration; however, the thermal dose
    distributions (such as those in Figures 4.8 and 4.13) may work out differently
    for (1) and (2) as the variation of thermal doses will be more prone to the effects
    of heat dif- fusion and blood perfusion during a long heating period, whereas
    these effects are less pronounced when the heating time is short. In addition,
    it is worth noting that tissue heating is a dynamic process accompanied by a dynamic
    change of tissue material properties and physical tissue geom- etries due to the
    temperature-dependent material properties [62] and tis- sue deformations (such
    as organ movements [63] and the effects of thermal expansion and contraction),
    compensating both may lead to more precise thermal dose computation.


    Whilst minimally invasive thermal modalities such as RFA and MWA are effective
    in treating hepatic tumours and providing a safer option than liver resection,
    they exhibit some limitations. For instance, RFA is asso- ciated with a major
    complication rate of $\approx4\%$ and a low mortality rate of $\leq1\%$ [64].
    Most complications, such as bowel perforation or bile duct injury, are due to
    thermal injuries to organ tissues adjacent to the liver, particularly for subcapsular
    tumours and tumours near the porta hepatis and gallbladder [65]. Intraoperative
    RFA has been employed to avoid these complications, but this approach is more
    invasive, which may lead to fur- ther complications and side effects. Moreover,
    tumours in the neighbour- hood of large blood vessels can be difficult to ablate
    completely because of a heat sink effect due to blood perfusion that limits the
    ability to achieve the high temperature required for thermal ablation. Experimental
    stud- ies [66,67] indicate that this problem is less pronounced if heat sources
    are induced with high energy intensity and a short heating duration ($\leq 2$
    seconds), since the heating would be rapid and less affected by the heat diffusion
    and blood perfusion effects.


    As mentioned in Section 4.4.2, compared to RFA and MWA, the HIFU tumour ablation
    represents the advantage of being a non-invasive means for hepatic cancer treatment;
    however, on the other hand, it demands pre- cise tracking of organ movements in
    order to synchronise the focal region of the HIFU transducer with the target tumours
    to accurately induce the'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'desired level of thermal injury [68]. Due to the physiological motion of the
    liver, which is primarily caused by the respiratory cycle [69] and, to a lesser
    extent, by cardiac motion and bowel movements, the target tumour moves and deforms
    continuously that complicates both precise and effective HIFU energy deposition.
    Consequently, more recent approaches were focused on continuous target-tracking
    techniques, which can lock the ultrasound beam to the target during the motion
    cycle and thus allow continuous energy deposition. Both real-time magnetic resonance
    imaging (MRI) and diagnostic ultrasound have been demonstrated as viable tracking
    modalities [70,71]. In addition, due to organ movements, soft tissue deformations
    [72,73] must be considered when calculating thermal doses, the soft tissue temperature
    field must be computed based on the deformed state of tissues for accurate computation
    of thermal doses under tissue deformations [74].


    # 4.6 CONCLUSION


    This work presents a CNN-based methodology for fast computation and analysis of
    soft tissue temperature and thermal doses for the management of hepatic tumours
    in thermal ablative treatments. To avoid the complex and expensive numerical non-linear
    solution procedures, CNN models are developed by formulating the non-linear bio-heat
    transfer equation as the non-linear collective and simultaneous local and global
    cell activities of CNN, leading to neural network models on 2D and 3D regular
    and irregular grids with the mechanism of bio-heat transfer embedded for fast
    temperature computation for computer-assisted thermal ablative treatments. The
    application of the CNN models is demonstrated using a clinically relevant scenario
    of thermal dose modeling in a patient-specific HIFU treatment of liver cancers
    for tumour management.


