  md: '11.4.3 Decision Tree for NAFLD Classification \hfill 203


    11.5 Conclusion and Future Works \hfill 204


    References \hfill 205


    # ## 11.1 INTRODUCTION


    Nowadays cardiovascular disease is the most common cause of death throughout the
    globe [1], and this term includes heart attack, stroke, peripheral arterial disease,
    and so on. Only during 2016 in the US, 17.6 million deaths were attributed to
    cardiovascular disease, and its treatments cost billions [2]. The background of
    metabolic alterations associated with cardiovascular disease is related to a low
    degree of inflammation caused by low physical activity, non-healthy nutritional
    behaviour, and obesity. Also, the presence of smoke and alcoholism increases the
    risk of cardiovascular events and liver disease as non-alcoholic fatty liver disease
    (NAFLD) by increasing the low-grade inflammation [3].


    One of the main causes of cardiovascular disease is arterial hypertension [4].
    The blood pressure is regulated by a complex mechanism including the kidney, heart,
    and blood vessels [5]. The kidney regulates the blood pressure by allowing sodium
    and water excretion to down-regulate the pressure, and by the renin-angiotensin-aldosterone
    system (shrinking the lumen of vessels) increasing the pressure. The blood vessels
    can respond to local mediators like nitric oxide (NO) releasing the pressure,
    or response to a systemic mediator (i.e. catecholamines) to increase the pressure.
    The heart as a pump can regulate the blood pressure through the beats frequency
    or the contraction of the myocardium. Chronic hypertension induces left ventricular
    hypertrophy (LVH), increasing the metabolism and oxygen requirements; if the process
    is not reversed, it can increase the risk of a heart attack.


    Multiple electrocardiographic criteria are used to diagnose LVH [6]. The accuracy
    of more frequently used criteria is about 52%–63%, but with very low sensitivity
    (lower than 56%), and very high specificity (upper than 90%). Though these criteria
    are used and accepted worldwide, it is desirable to improve the accuracy with
    a balance between sensitivity and specificity. Not less important and difficult
    to do is the detection of NAFLD by the way of non-invasive evaluation. Patients
    with risk factors of NAFLD (i.e. diabetes, obesity, hypertriglyceridemia, and
    so on) in the presence of high levels of alanine transaminase (ALT) can be assessed
    with an expensive test as a magnetic resonance of the liver, or with a liver biopsy
    (with the risks it had).


    Nowadays, machine learning (ML) has been used more frequently in medical research
    to improve the ability to classify (or predict) variables of interest as the presence
    of diabetes [7], cancer [8] or death. Different'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'algorithms were used for different types of data, and more complex algorithms
    are needed to handle non-linear relationships [9] or data with high dimensionality
    [10]. Algorithms such as Adaboost or Support Vector Machine (SVM) can accurately
    classify diabetic retinopathy [11], cancer [12], and so on; but they cannot offer
    readable results to doctors without deep enough knowledge in ML. Moreover, there
    are other ML algorithms with an output that could be more easy to understand by
    doctors, without sacrificing accuracy. Decision tree (DT) algorithms can be used
    to predict or classify [13] and handle non-linear relationships between variables.


    In this research, we developed a DT-based model aiming to improve the accuracy
    and automating the classification task of LVH and NAFLD. Our contributions are
    multifold: (1) DT can automatically generate the hidden complex patterns or rules
    related to LVH and NAFLD from the patients'' data which are clinically relevant
    and justified by medical experts. (2) Some rules excavated by DT are consistent
    with the state-of-the-art clinical findings and some of them are new but clinically
    relevant which are very useful in clinical research. (3) Unlike other ML algorithms,
    rules generated by DT demonstrate high resemblance with the state-of-the-art diagnostic
    procedure for LVH and NAFLD which makes the DT-based model useful as a routine
    diagnostic procedure in clinical settings. (4) Proposed model is very easy to
    implement and very useful especially in urban and rural hospital settings. (5)
    Using the proposed tool, emergency doctors can get benefited from an initial interpretation
    and enhance their own abilities to classify LVH or NAFLD, which is often complicated
    to detect, and it can be thoroughly verified by experts later, and thus could
    dramatically shrink wait times. The proposed tool would enable to process noisy
    and complex information and make it easier to interpret for clinicians in the
    field, who necessarily have to make decisions with imperfect data, sometimes under
    extreme duress. It will definitely give doctors a higher level of confidence when
    choosing a patient''s course of treatment without referring to the experts.


    # 11.2 LITERATURE REVIEW


    Previous ML-based research efforts in left ventricular hypertrophy (LVH) and NAFLD
    are described below.


    # 11.2.1 Left Ventricular Hypertrophy (LVH)


    LVH is a major risk to heart attack; though it is easily detected with an echocardiogram,
    it could be expensive or not available in some places. Electrocardiography is
    used as a gold standard to diagnose arrhythmias, also, there are multiple diagnostic
    electrocardiographic criteria described'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'to detect the presence of LVH (i.e. Sokolow-Lyon and Cornell criteria among
    others); furthermore, these criteria are very specific (>90%), with poor sensitivity
    (<20%) and an accuracy of \( \approx 50 \) % [6].


    Recently some studies have been published aimed to improve the classification
    of patients with LVH. The majority of these studies includes anthropometric variables
    also and not electrocardiographic variables only. Lin and Liu [14] classified
    young adults as having or not having LVH through an SVM algorithm. In this study,
    28 electrocardiographic features and other clinical features (age, height, weight,
    BMI, waist circumference, systolic and diastolic blood pressure and body surface
    area) were evaluated. The SVM model was compared with the traditional ECG voltage
    criteria (Cornell and Sokolow-Lyon). Although the SVM model had a more balanced
    relation between sensitivity and specificity (86.7% and 73.3% each), the Cornel
    voltage criterion had a higher accuracy (93% vs. 74.2%) [14].


    Sparapani and colleagues (2019) describe how the Bayesian Additive Regression
    Trees can classify the presence fo LVH. This effort was nested in MES (Multi-Ethnic
    Study of Atherosclerosis), where 3,214 men and 3,600 women were included. This
    algorithm is defined by a statistical model with a prior and a likelihood and
    is a tree-based Bayesian non-parametric method. In this study, 552 amplitude and
    duration electrocardiographic measurements were included. The MRI were the gold
    standard method to classify LVH. The proposed model had a ROC AUC of 82.9%, a
    specificity of 94.6%, and a sensitivity of 29%. Compared with the model of Gen-Min
    Lin, this model had more specificity (similar to the standard criteria), and in
    relation to the Cornell voltage product and voltage criteria, the Bayesian Additive
    Regression Tree showed better performance [15].


    # 12.2.2 Non-Alcoholic Fatty Liver Disease


    Nowadays, multiple scores are used to predict NAFLD. Poynard et al. [16] published
    the SteatoTest, a tool to predict NAFLD [16] in an attempt to reduce the need
    for liver biopsy. The author used logistic regression to model the probability
    of the presence of NAFLD; variables such as age, gender, body mass index (BMI),
    glucose, alanine transaminase, alpha 2 microglobulin, A-1 apolipoprotein, haptoglobin,
    total bilirubin, total cholesterol and triglycerides were evaluated. This model
    had an accuracy between 0.8 and 0.9 (varying with the sensitivity and specificity
    cut-offs). An updated model was published holding the accuracy with a simpler
    model [17].'
  merge: -1
  img_proc: true
