  md: 'some studies have shown that connectivity of the default mode network (DMN)
    regions diminishes in mTLE patients [41–43]. DTI techniques, which measure molecular
    diffusion—diffusivity and directionality—in the brain, can detect epilepsy-associated
    microstructural alterations in epileptogenic areas earlier than they can be detected
    on structural MRI modalities [44–47].


    # 6.2.1 Study Population


    The following research studies were conducted at Henry Ford Health System (HFHS)
    and approved by the Institutional Review Board (IRB). All imaging data were de-identified
    before processing according to a protocol approved by the IRB. Patients whose
    data were analyzed in these studies had been diagnosed with mTLE including bilateral
    and unilateral cases. To establish the conditions, the patients underwent a standard
    investigation protocol including inpatient scalp video-EEG, MRI, neurophysiological
    testing, and intracarotid amobarbital study.


    Bilateral cases were selected among the patients who entered the phase II study
    and had bilaterality confirmation by icEEG. The unilateral cases were selected
    among the patients who underwent the resection of mesial temporal structure and
    achieved an Engle class I outcome, as defined by the Engel classification [10].


    Patients without all three imaging modalities—T1-weighted and FLAIR, and DTI—were
    excluded from the following comparison studies. Some other patients were also
    excluded due to a high level of artifact contamination or insufficient resolution.
    For instance, an acceptable MRI segmentation result from FreeSurfer [48] was an
    inclusion criterion for the studies reviewed in this chapter.


    The majority of the cases used in the following studies achieved an Engle class
    la outcome (more than 92%) following surgical resection at the Henry Ford Hospital
    between 1996 and 2014 [10]. For all cases analyzed in these studies, amygdalohippocampectomy
    and inferior temporal topectomy formed the resection surgery. Also, about 49%
    of the unilateral cases underwent extraoperative electrocorticography (ECoG),
    due to uncertainty in the non-invasive determination of the side of epileptogenicity.


    It should be noted that the excised tissues, especially the hippocampus, were
    studied to qualitatively examine hippocampal sclerosis and to investigate the
    correlation between MRI characteristics, i.e., hippocampal volume loss on T1-weighted
    images and signal hyperintensity on FLAIR images, and HS identified by neuroradiologists.
    According to many reports'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'regarding pathologically confirmed HS in the absence of any abnormalities on
    T1-weighted and FLAIR imaging (about 30%), both hippocampal sclerosis positive
    (HS-P) and hippocampal sclerosis negative (HS-N) were included in the studies.


    Some alterations in the imaging features (e.g., FLAIR intensity, diffusion anisotropy,
    and volumetric features) may be due to natural physiological variations. Therefore,
    imaging features of a reliable control group, i.e., nonepileptic subjects, may
    be investigated to take into account the natural variability in imaging features
    among healthy individuals. In this direction, in the selected studies, nonepileptic
    subjects were used to form a control group.


    # 6.2.2 MRI Acquisition


    For every patient, MRI scans—coronal T1-weighted using the IRSPGR protocol and
    coronal T2-weighted using the FLAIR protocol—were acquired on a 1.5T or a 3.0T
    MRI system (Signa, GE, Milwaukee, USA) preoperatively. T1-weighted imaging parameters
    for the 1.5 T scanner were TR/TI/TE=7.6/1.7/500 ms, flip angle=20°, voxel size=0.781×0.781×2.0
    mm³, and FLAIR imaging parameters were TR/TI/TE=10,002/2,200/119 ms, flip angle=90°,
    and voxel size=0.781×0.781×3.0 mm³. For the 3.0 T MRI, T1-weighted imaging parameters
    were TR/TI/TE=10.4/4.5/ 300 ms, flip angle=15°, and voxel size=0.39×0.39×2.00
    mm³ and FLAIR imaging parameters were TR/TI/TE=9,002/2,250/124 ms, flip angle=90°,
    and voxel size=0.39×0.39×3.00 mm³. DTI images (b-value of 1,000 s/mm²) in 25 diffusion
    gradient directions along with a set of null images (b-value of 0 s/mm²) were
    acquired using echo planar imaging (EPI) with TR/TI/TE=10,000/0/76 ms, flip angle=90°,
    and voxel size=1.96×1.96×2.6 mm³.


    # 6.2.3 Image Processing


    The first processing step for the studies in the field of structural MRI analysis
    is to segment a region of interest (ROI, e.g., the hippocampus, using T1-weighted
    MRI (Figure 6.1). This step is a key step since all features are extracted based
    on the results of this step, especially when T1-weighted and FLAIR image sets
    are coregistered subsequently (studies II, II, and III). In study I, the segmentation
    was performed manually by the experts, and multiple verifications were performed.
    To avoid human error, automated segmentation tools, such as FreeSurfer [48], were
    used in other studies. The second step is the coregistration of the imaging modalities
    in the feature extraction phase, e.g., coregistration of T1-weighted and FLAIR
    images.'
