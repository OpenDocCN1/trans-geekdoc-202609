    # 4.3.2.2 2D Irregular Grids


    To establish CNN on 2D irregular grids such as a triangular grid, the original
    definition of “$r$-neighbourhood” is generalised from the rectangular grid to
    handle arbitrary grids, in which the grid points are positioned arbitrarily and
    linked to their neighbouring points. The $r$-neighbourhood of the cell $C(i)$
    associated with the grid point $i$ is defined by


    ```

    $$N_{r}(i)=\left\{C(j)|\text{links}\left(C(i),C(j)\right)\le r\right\}\tag{4.11}$$

    ```


    The state of a cell in the autonomous CNN is expressed by the following equation:


    ```

    $$C_{x}\frac{dv_{xi}(t)}{dt}=-\frac{1}{R_{x}}v_{xi}(t)+\sum_{c(j)\in N_{r}(i)}A(i,j)v_{yj}(t)+I_{i}\tag{4.12}$$

    ```'
