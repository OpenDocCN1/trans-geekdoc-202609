  md: '+   2. LCDG Refinement:

    * Fixing $C_p$ and $C_n$, refine the LCDG-model with the modified EM algorithm
    by manipulating other parameters.


    +   3. Initial Segmentation:

    * Divide the final LCDG-model into $K$ submodels by minimizing the expected errors
    of misclassification.

    * Select the LCDG-submodel that has the largest mean value to be the model of
    the wanted vasculature.

    * Use the intensity threshold $t$ to extract the voxels of the blood vessels in
    the MRA slice, separating their LCDG-submodel from the background.


    +   4. Final Segmentation:

    * Remove the artifacts from the extracted voxels whole set with a connection filter,
    which chooses the greatest connected tree system built by a 3D growing algorithm.


    This procedure aims to decipher each MRA slice''s threshold, which will enable
    the complete extraction of the bright blood vessels while removing the darker
    unwanted tissue while also separating surrounding non-vasculature tissue that
    may be of similar brightness and along the same boundaries. When step 1b is initialized,
    the LCDG with the non-negative beginning probabilities $p_{w, \ o}(q)$ is created.
    In step 1c, a refinement takes place, increasing the likelihood, but still, probabilities
    are non-negative. In Ref. [16], experiments showed that the opposite situations
    never took place.


    Automatic segmentation''s accuracy is evaluated by calculating total error compared
    to the ground truths. For evaluation purposes, segmentations are measured, including
    both true positive (TP) and true negative (TN), as well as false positive (FP)
    and false negative (FN).


    In Figure 13.3, if C is the segmented region, G is the ground truth, and R represents
    the entire image frame, then the TP= $|C \cap G|$, TN= $|R - C \cup G|$, FP= $|C
    - C \cap G|$, and FN= $|G - C \cap G|$. The total error $\epsilon$ is given in
    Ref. [24] as $\epsilon=(\mathrm{FN}+\mathrm{FP}) /(\mathrm{TP}+\mathrm{FN})=(\mathrm{FN}+\mathrm{FP})
    / \mathrm{G}$.


    **Matching of Voxels**: Voxels are defined as an array of volume elements, which
    constitute a notional 3D space. A 3D affine registration is used to handle the
    pose, orientation, and the data spacing changes or other scanning parameter changes
    between day 0 and day 700 [25]. In this step, the determined Euclidian radii are
    converted into diameter values. The output is then converted into a distance map.'
