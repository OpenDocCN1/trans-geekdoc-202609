    (3) voxel matching for obtaining temporal subtraction images to enhance the ability
    to see cerebrovascular change via a distance map created to quantify the change
    in patients between day 0 and day 700, (4) generation of a probability distribution
    function (PDF) which describes the distribution of pixel distances from vascular
