    \ 241\nReferences ··············· 241\n\n# 13.1 INTRODUCTION\n\nHigh blood pressure\
    \ (HBP) affects approximately 1 in 3 adults in the United States. HBP has been\
    \ the main reason or has significantly contributed to the mortality rate of 410,000\
    \ adults on a yearly basis, with associated healthcare costs of $46 billion [1].\
    \ The primary causes for HBP and elevated cerebrovascular perfusion pressure (CPP)\
    \ vary, but are mainly chronic stress [2], an increasing intake of sodium [3],\
    \ and problems in kidney functions [4]. CPP is the perfusion pressure in the brain,\
    \ which is dependent on local vascular impedance and cerebral autoregulation.\
    \ Blood vessels in the brain are affected by chronically elevated CPP, leading\
    \ to changes in their structure, as well as disruptions in the mechanisms of cerebrovascular\
    \ regulation. Significantly, high CPP induces hypertrophic"
  merge: -1
  img_proc: true
- pgno: 247
  md: 'and eutrophic remodeling in cerebral blood vessels [5]. In hypertrophic remodeling,
    changes in the structure of cerebral blood vessels, caused by elevated CPP, can
    be seen as the wall of blood vessels becomes thicker and their lumen is reduced.
    For eutrophic remodeling, cells of smooth muscles undergo a rearrangement that
    results in maintaining the mass and wall thickness of the totality of the blood
    vessels, while reducing their lumen. These cerebrovascular changes are hypothesized
    to be a significant contributor to strokes, brain lesions, cerebral ischemic injury,
    dementia, and cognitive impairment [5–7].


    Currently, HBP is diagnosed and medically managed when systemic BP measurements
    using a sphygmomanometer are greater than 140/90mmHg. However, BP measurement
    via a sphygmomanometer cannot quantify cerebrovascular structural changes that
    can increase the risk of cerebral adverse events. Many studies have recently concluded
    that variations in the structure of the cerebrovascular system, as well as those
    in CPP, may arise before systemic BP becomes elevated, rather than cerebrovascular
    damage due to sustained exposure to HBP [8–11]. As such, being able to calculate
    the changes that take place in the cerebrovascular system can lead to the identification
    and the stratification of those at risk of unfortunate cerebral events. This can
    lead to treatment well before systemic hypertension sets in, in conjunction with
    other cognitive tests, and can optimize medical management of HBP patients.


    Magnetic Resonance Imaging (MRI) and Magnetic Resonance Angiography (MRA) scans
    represent imaging techniques, traditionally used to quantify structural changes
    in organs. In the literature, MRI scanning has been used for volumetric measurement
    of the ventricular cavities and myocardium [12] and to determine intravascular
    pressures from magnetic resonance (MR) velocity data in large vessels like the
    aorta or pulmonary artery [13]. MRA scanning has been used to quantify measurements
    of the flow in the collateral arteries of patients that have occlusions in the
    internal carotid artery [14]. To the best of our knowledge, neither MRA nor MRI
    has been utilized for the estimation of vascular pressure changes in the brain.
    Detection of cerebrovascular or CPP changes, by analyzing MRAs, has not been successful
    due to the lack of accurate segmentation algorithms that can mark and separate
    the small blood vessels within the brain (in comparison to the aorta or pulmonary
    arteries) from the surrounding soft tissue. Furthermore, there are no methods
    to measure changes in the cerebrovascular structure and to find the relation between
    such changes and those in mean arterial pressure, MAP, from MRI/MRA'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'imaging. This manuscript presents novel methodologies to delineate cerebral
    blood vessels from the surrounding tissue, measure changes in the cerebrovascular
    structure, and correlate between these changes and MAP.


    # 13.2 METHODS


    The aim of the present paper is to develop a new method to detect cerebrovascular
    structural changes based on the use of MRA and demonstrate the proof-of-concept
    of correlation between cerebrovascular structural changes to MAP. Patient demographics
    and details about the proposed methodology and data analysis are presented next.


    # 13.2.1 Patient Demographics


    The Institutional Review Board (IRB) at the University of Pittsburgh has granted
    its approval for the accomplishment of this work. Patients’ ($n$ = 15, M = 8,
    F = 7, and age = 49.2±7.3) data and measurements have been obtained over a period
    of 700 days. These data and measurements included MRA and systemic BP, respectively.
    They were all analyzed in retrospect. The selection of the 15 study participants
    was made so that the changes in their blood pressure (BP) would represent a wide
    range over the duration of the study. As for MRAs, they were analyzed without
    identifying BP measurements of the patient whose images were being analyzed. The
    3T Trio TIM scanner, employing a 12-channel phased-array head coil, was used to
    obtain MRA images. The average of four measurements, obtained from readings by
    a sphygmomanometer, was used to determine BP and MAP. The readings were taken
    during patient visits right before MRI scanning. Each set of scans consisted of
    3D multi-slab high-resolution images, which included 160 slices, whose thickness
    was 0.5mm. Image resolution was 384×448. Moreover, the voxel’s size was 0.6×0.6×1.0mm³.
    The echo time was 3.8 ms, the flip angle was 15°, and the repetition time was
    21 ms. The scan took 7 minutes 39 seconds and did not require any contrast.


    The subjects had an average day 0 systolic pressure of 122±6.9 mmHg, an average
    day 0 diastolic pressure of 82±3.8 mmHg, an average day 700 systolic pressure
    of 118.9±12.4mmHg, and an average day 700 diastolic pressure of 79.9±11.0 mmHg,
    i.e. the mean systolic pressure remained comparable over time though some individuals
    had increased pressure and some had decreased pressure or stayed the same.


    # 13.2.2 Data Analysis


    The analysis of patient MRA data consists of five key steps (Figure 13.1) consisting
    of: (1) manual segmentation of training slices to identify ground'
