    To highlight the advantages of using such an SNCAE classification model, the obtained
    results were compared to those obtained using multiple well-known conventional
    machine learning classifiers built-in Weka tool [23]: K-nearest neighbor (kNN),
    logistic regression (LR), random trees (RTs), and random forests (RFs). All results
    are compared and summarized in Table 14.1. With an accuracy of 98%, the developed
    classification system using SNCAE outperformed all other machine learning classifiers,
    holding a promise for the development as an outstanding diagnostic tool for renal
    rejection type identification.


    # ### 14.4 CONCLUSION


    To recap, our work offers a Renal-CAD system that estimates whether the renal
    transplant is acute rejection or non-rejection during early stages of post-transplantation
    in a non-invasive way through 4D DW-MRI data. Our CAD system uses not only previous
    techniques but adds new non-rigid image aligning techniques. Additionally, it
    utilizes kidney segmentation that includes deformable boundary, calculating ADC
    values, as well'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'as utilized SNCAs to determine the rejected kidney status through CDFs of the
    ADCs, as integral status descriptions. In terms of accuracy, we used a biopsy-proven
    cohort with 39 patients and obtained a 98% overall accuracy in ATN and TMR rejection
    status. These promising results confirm that the proposed CAD system is a non-invasive
    diagnostic tool to detect the status of the renal transplant. For future testing,
    we plan on expanding the ATN and TMR data sets to further estimate the accuracy
    as well as the robustness of our framework in diagnosis. Furthermore, to take
    other causes of rejection into account—drug toxicity, viral infection, and so
    on—we intend on expanding our rejection groups into four to further analyze the
    robustness of the newly developed CAD system within the four different groups.


    In addition to kidney [24–51], this work could also be applied to various other
    applications in medical imaging, such as the prostate [52–54], the heart [55–71],
    the lung [72–119], the brain [120–141], the vascular system [142–151], the retina
    [152–156], the bladder [157], and injury prediction [158] as well as several non-medical
    applications [159–164].


