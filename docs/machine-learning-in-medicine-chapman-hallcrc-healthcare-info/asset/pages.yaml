    \ as a sequence of sensor readings, $a_j$: $A= <a_1$, $a_2..., a_m>$. Here $A$,\
    \ which will be inserted into $S$, is chosen carefully to reflect a dementia-related\
    \ abnormal behavior (e.g. nutrition problem).\n**Output:** $S = <s_1$, $s_2...,\
    \ s_p$, $a_1p$, $a_2p..., a_mp$, $a_{p+p}..., s_n>$\n  while true do\n  Choose\
    \ a random position $p$ in $S$;\n  Insert $A$ into $S$ at position $p$;\n  end\n\
