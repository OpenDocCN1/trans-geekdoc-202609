- pgno: 154
  md: '# 8.1 INTRODUCTION


    Electroencephalography (EEG) has been one of the most conventional modalities
    for diagnosing brain malfunctions. It has been widely used to diagnose diseases
    such as Alzheimer''s disease (AD) and its prodromal stage, mild cognitive impairment
    (MCI). Due to its portability and relatively low cost, the EEG system receives
    vast coverage in the hospitals and medical centers. However, it is also well known
    that due to the relatively small number of electrodes and its nonintrusive nature,
    using EEG alone has been found difficult to make a definite diagnosis. To alleviate
    this limitation, magnetoencephalography (MEG) has been introduced for the detection/prediction
    of AD and MCI. Compared with EEG, MEG collection systems require a much reduced
    number of contacting electrodes, but effectively increased the quantity of noncontact
    magnetic sensors. Therefore, MEG is arguably a more powerful modality than EEG.
    However, due to the entirely different measuring principle between the modalities
    and much less research devoted, MEG has yet to demonstrate much superior performance
    to EEG [1].


    In this chapter, the recent reports on machine learning (ML)-based MCI/AD diagnosis
    using E/MEG are reviewed and discussed. In particular, for some of the E/MEG systems
    with a large number of sensors (100~300), it is possible to perform the source
    localization to find the accurate spots of the abnormal functions from the cortex/brain.
    The main content of this chapter is therefore structured in two subsequent sections:
    sensor-level and source-level. The current issues and limitations in terms of
    the experimental design for ML-aided MCI/AD detection/prediction, along with a
    few suggestions for the researchers in this field, are also provided in the Discussion
    and Conclusion section of the chapter.


    # 8.2 SENSOR-LEVEL ANALYSIS


    This section reviews and discusses a few recent works for MCI/AD detection based
    on sensor space analysis. One of the most intuitive methodologies for feature
    extraction is to directly explore the signal data in the time domain. In Ref.
    [2], a new type of entropy namely dispersion entropy (DisEn) was proposed to measure
    and compare the irregularity of brain signals between AD and Heath Control (HC).
    A 148-channel MEG system was used to collect the data from 36 AD and 26 HC participants
    in resting state. The performance was evaluated using boxplots for visual inspection,
    and the t-test was adopted for statistical significance analysis. As a relatively
    simple approach, it was able to demonstrate that the MEG data from AD have shown
    more regularity than HC.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'A more complex work in Ref. [3] proposed to use EEG-based Event-Related Potential
    (ERP) as neuromarkers for the classification of AD and MCI, against HC. In total,
    61 participants were involved in data collection, which included 15 with AD, 20
    with MCI, and 26 with AD. A series of binary classifications (AD vs. HC, MCI vs.
    HC, and AD vs. MCI) were conducted to study the sensitivity of the working memory
    task reflected by ERPs. Independent component analysis was used for artifact removal
    and the spatial relationships of the electrodes were leveraged using the k-means
    clustering. Here each participant was considered as one cluster in the reported
    study. The differences in terms of ERP between the classes were compared, and
    the Kruskal–Wallis statistical tests were adopted to measure the statistical significance
    of the results. It was reported in comparison to the controlled group that both
    the AD and MCI groups demonstrated a decreased amplitude in the P450 component.
    The experiments also indicated that the most significant differences were observed
    from fronto-centro-parietal electrodes, for HC vs. abnormal groups. These promising
    results seem to suggest that relatively simple neuromarkers in the time domain
    could already reflect the abnormal brain state; however, the study has also shown
    that such markers are not quite effective for the challenging AD vs. MCI classification
    problem.


    Similarly, also through mere visual inspection of the extracted features, researchers
    have been trying to perform the classification using the frequency domain markers.
    For example in Ref. [4], a series of the power and the relative power of the signals
    were used for MCI detection. A 64-channel EEG acquisition system was used to collect
    data from 22 subjects (11 MCI and 11 HC). The cortex of the brain was divided
    into 17 regions of interest (ROIs); the statistical analysis of these ROIs was
    performed by repeated-measures analysis of variance (ANOVA) and t-test of an independent
    sampler. The work claims that the theta band is the main responsible band for
    MCI detection, and the slowing of EEG rhythms from the left temporal area is significant
    for MCI.


    These recent researches, despite obtaining interesting results and receiving much
    attention in the community, are still not quite facilitated by ML techniques.
    These systems could be considered as semi-automated, as the final decisions still
    need to be made by humans: i.e. visual inspection of the features from different
    classes. Without incorporating into the ML framework, objective comparison among
    these systems is therefore quite difficult to make. The existence of such a difficulty
    is mainly due to that the researchers in the neurological field were traditionally
    not from the ML field.


    With the recent thrive of artificial intelligence applications in various fields,
    ML-supported detection techniques have been found integrating'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'with the conventional semi-automated diagnosis systems. One typical example
    in Ref. [5] introduced a pipeline based on a 19-channel EEG system for AD and
    MCI detections. A series of different features commonly used in the field were
    extensively explored, including relative power in the conventional frequency bands,
    median frequency, individual alpha frequency, spectral entropy, Lempel–Ziv complexity,
    central tendency measure, sample entropy, fuzzy entropy, and auto-mutual information.
    A feature selection scheme namely fast correlation-based filter was employed,
    the individual alpha frequency, relative power at the delta frequency band, and
    sample entropy were eventually kept for classification. Three conventional classifiers,
    linear discriminant analysis (LDA), quadratic discriminant analysis, and multi-layer
    perceptron artificial neural network (MLP) were tested, the MLP proved to provide
    the best recognition performance among the three. With the support of the ML techniques,
    this fully automated system was evaluated by the standard sensitivity and specificity:
    On determining whether a subject is not healthy, a sensitivity of 82.35% and a
    positive predictive value of 84.85% were obtained for HC against AD and MCI; on
    whether a subject does not suffer from AD, it provided a specificity of 79.41%
    and a negative predictive value of 84.38% for AD against HC and MCI. It is worth
    pointing out, despite three classes were involved in the study, effectively the
    system was still performing two-class classifications: this may indicate currently
    that it is still quite a challenging task for three-class recognition scenarios.
    It is well known that MCI is the prodromal phase of AD, and its symptomatic separation
    with AD and HC is often quite vague.


    AD detection using ML techniques has demonstrated much improved performance. Also
    using a 19-channel EEG system, work reported in Ref. [6] provided more than 10%
    improvement than the work in Ref. [5]. The subjects (20 AD and 32 HC) were in
    different states during data collection: hyperventilation, awake, drowsy, and
    alert, with periods of eyes closed and open. Three types of features, Tsalis entropy
    (TsEn), Higuchi fractal dimension (HFD), and Lempel–Ziv complexity (LZC), were
    explored, and the LZC marker showed the best detection performance while an SVM
    classifier was used: a sensitivity of 100%, a specificity of 92.31%, and a recognition
    accuracy of 95% were achieved.


    Instead of measuring the individual amplitude [3], the functional connectivity
    between signals attracts more attention in ML-aided AD diagnosing. The method
    proposed in Ref. [7] demonstrated excellent performance in AD detection using
    a 16-channel EEG device: a high mean recognition rate of 98.9% was achieved using
    a nonlinear support vector machine (SVM) classifier. A new biomarker namely permutation
    disalignment index (PDI)'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'was developed to measure the coupling strength between signals from two electrodes.
    As a functional connectivity-related marker, PDI is inversely cor-relational to
    the coupling strength between the signals. In the experiments, 14 AD and 14 HC
    participated, and one-way ANOVA was employed for the statistical analysis. It
    was found by combining the local PDI features and a global complexity measurement
    namely graph index complexity (GIC), the system performance could receive a considerable
    boost: more than 6% of the mean accuracy increment was obtained. The reported
    recognition perfor-mance for AD was the average rate of 1,000 random tests. It
    is worth pointing out, however, that the obtained recognition rates were based
    on a relatively small pool of 14 participants per class, the robustness of such
    a newly pro-posed marker requires further verification across a larger population.


    A more challenging task is to predict the conversion from MCI to AD. Such conversions
    often first occur in only part(s) of the brain, which make the source localization
    critical. In Ref. [8], researchers proposed an inter-esting approach to locate
    the source of interest without performing the conventional source reconstruction
    algorithms: based on their hypothesis, it is unlikely that a common source generates
    a simultaneous increase and decrease in power of different frequencies at distant
    electrode sites, the trial-by-trial negative correlations between the signals.
    They reported a sensitivity of 95% and a specificity of 80%. It is worth noting
    particularly that this is a longitudinal study on the conversion from MCI to AD,
    15 out of the 25 participants with amnestic MCI developed AD in 3 years. The classification
    was conducted against 11 elderly controls.


    One of the early attempts for ML-aided MCI diagnosis was made in 2015 [9]. The
    project involved combining a number of MEG databases col-lected using the same
    model of 306-channel Vectorview system; in total, the data from 102 MCI and 82
    HC were obtained for the study. A series of band-specific mutual information were
    computed as the markers, which included the theta (4–8 Hz), alpha (8–12 Hz), beta
    (12–30 Hz), gamma (30–45 Hz), and broadband (2–45 Hz). Multiple classifiers were
    evalu-ated and the parameters were optimized for the problem: Random Forest, Bayesian
    Network, C4.5 induction tree, K-nearest Neighbor, Logistic Regression, and Support
    Vector Machine. Bootstrapping was selected to validate the diagnosis performances.
    The optimized results are 100% sensitivity, 69% specificity, and 83% classification
    accuracy. These pioneer results using MEG are quite promising, especially considering
    the rela-tively large number of participants in the study.


    As it was discussed, using EEG for AD detection appears to have achieved reasonably
    good performance [7]; however, EEG for MCI detection is often'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'not effective [8], probably due to the relatively small number of electrodes
    equipped for EEG systems. MEG, on the other hand, may ease this issue with its
    larger number of sensors. For example, researchers were able to distinguish the
    MCI and HC with a success rate of 98.4% using a 148-channel MEG system [10]. Participants
    (18 MCI and 19 HC) were performing the letter memorizing task during the data
    collection. The complete ensemble empirical mode decomposition (CEEMD) was used
    for feature extraction, and the resulting coefficients were used to compute a
    nonlinear dynamics measure based on permutation entropy analysis. The enhanced
