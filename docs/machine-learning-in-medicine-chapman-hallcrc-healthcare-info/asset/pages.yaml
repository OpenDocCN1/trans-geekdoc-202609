    in analogy to the heat transfer equation with a given input of heat source that
    governs the non-linear bio-heat transfer behaviour in biological soft tissues,
    the presented CNN is formulated as the global propagation of a given current source
    (analogy to the heat source) through the locally interconnected activity of non-linear
    cell dynamics.


