  md: 'it is important to estimate the probability distributions of the signals individually.
    Said signals associate each mode from *F*. *Fs* is closely approximated with LCDG
    oppsing the conventional mixture of Gaussians, one per region, or slightly more
    flexible mixtures involving other simple distributions, one per region. Sub-models,
    each representing a dominant mode, are the result of the division of the LCDG
    image [19–21].


    A discrete Gaussian distribution is defined on the set of integers (gray levels)
    *Q* = {0, 1, ..., *Q* − 1} by the probability mass function


    ```

    $$\psi(q|\theta) = \begin{cases} \Phi(0.5), & q = 0 \\ \Phi(q + 0.5) - \Phi(q
    - 0.5) & 1 \leq q < Q - 1 \\ 1 - \Phi(q - 0.5), & q = Q - 1, \end{cases}$$

    ```


    where the parameter $\theta = (\mu, \sigma)$, and $\Phi$ is the CDF of a normal
    distribution with mean $\mu$ and variance $\sigma^2$. Then the LCDG with $C_p$
    positive components and $C_n$ negative components, such that $C_p \geq K$, has
    the probability mass function


    ```

    $$p_{\mathbf{w},\Theta}(q) = \sum_{r=1}^{C_p} w_{p,r} \psi(q | \theta_{p,r}) -
    \sum_{l=1}^{C_n} w_{n,l} \psi(q | \theta_{n,l}) \tag{13.1}$$

    ```


    The weights $\mathbf{w} = (w_{p,1}, \dots, w_{p,\ C_p},\ w_{n,1}, \dots, w_{n,\
    C_n})$ are restricted to be all non-negative and to satisfy


    ```

    $$\sum_{r=1}^{C_p} w_{p,r} - \sum_{l=1}^{C_n} w_{n,l} = 1 \tag{13.2}$$

    ```


    In general, for a probability to be valid, it has to be non-negative: $p_{\mathbf{w}}
    \oplus(q) \geq 0$ for all $q \in \mathbf{Q}$. This implies that a valid subset
    of all the LCDGs in (13.1) only uses the probability distributions. This subset
    can however have negative components, $p_{\mathbf{w}} \oplus < 0$ for some $q
    \in \mathbf{Q}$.


    It is the aim of this study to find a *K*-modal probability model, which closely
    approximates the marginal distribution of gray level, which is not known. If *F*
    is the Bayesian estimate of *F*$_s$, the former can be described as follows [22]:
    $f(q) = (\mathbb{R}[f_s(q) + 1])/(|\mathbb{R}| + Q)$. The model to be devised
    should work on increasing the expected log-likelihood of the statistically independent
    empirical data to its maximum limits, along with its other parameters:


    ```

    $$L(\mathbf{w}, \Theta) = \sum_{q \in \mathbf{Q}} f(q) \log p_{\mathbf{w},\Theta}(q)
    \tag{13.3}$$

    ```'
