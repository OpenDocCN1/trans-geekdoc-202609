    # 4.5 DISCUSSIONS


    Compared to conventional numerical methods, CNN provides a fast means for solving
    the bio-heat transfer equation for thermal dose modeling owing to the collective
    and simultaneous computing activity of cells. The non-linear bio-heat transfer
    dynamics is modelled by the non-linear cell dynamics to evolve in time in the
    manner of local interaction and global propagation of cells. Soft tissue thermal
    heterogeneity is accommodated by setting parameters of cells to different values
    based on tissue/'
