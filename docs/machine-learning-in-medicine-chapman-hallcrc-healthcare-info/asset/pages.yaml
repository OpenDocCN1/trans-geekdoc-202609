  md: '# 11.4 EXPERIMENTAL RESULTS AND DISCUSSIONS


    # 11.4.1 Data Acquisition


    To show the effectiveness of DTs to classify patients with LVH and NAFLD, we used
    data published in Ref. [21,22]. LVH data included 432 patients, out of them 202
    patients had LVH and 230 did not have LVH. Among them, 240 were men, and all patients
    were evaluated with a 12 lead electrocardiogram as shown in Figure 11.1, where
    the most frequently used measures related to LVH (31 variables). In addition,
    the Romihl-Estes multilevel score was calculated to have a point of comparison.
    The presence of LVH was evaluated with an echocardiogram (the gold standard to
    diagnose LVH).


    Left ventricular morphology patterns for the patients were as follows: normal
    morphology ($n$ = 100, 23.1%), cardiac remodeling ($n$ = 130, 30.1%), concentric
    LVH ($n$ = 165, 38.2%) and eccentric LVH ($n$ = 37, 8.6%). LVH severity stage
    was classified as: mild ($n$ = 77, 38.1%), moderate ($n$ = 50, 24.7%) and severe
    ($n$ = 75, 37.1%). There was no difference in the severity stage of LVH between
    males and females ($P$ = 0.420). The distributions of LVMI, RWT and different
    left ventricle morphologies are shown in Figure 11.2.


    Conversely, NAFLD was classified with DT algorithms. Previous studies used structural
    equation models to find a relationship between the presence of NAFLD and several
    variables including clinical, family history and even multiple inflammatory variables
    (IL-2, IL-4, IL-6, tumor necrosis factor-alpha, and such others). In these data,
    137 subjects were evaluated with an ultrasound to detect the hyperechogenicity
    in the liver, related to NAFLD. The ultrasound is not the best non-invasive method
    to classify NAFLD; however, it is the most inexpensive procedure available to
    date.


