    # 6.4 DISCUSSION


    In this chapter, we reviewed studies that aimed to develop structural biomarkers
    for the lateralization of mTLE. Their goal was to either diagnose epilepsy or
    lateralize mTLE patients through extraction, selection, and modification of structural
    and textural features.


    In Study I, linear discriminators were employed to separate right-sided mTLE from
    left-sided mTLE using FLAIR and volumetric features. The FLAIR mean signal intensity
    and its standard deviation in the hippocampus provided an effective combination
    of features for distinguishing the laterality of mTLE patients (with an accuracy
    of 98%) while hippocampal volumetric features could only achieve 83% accuracy
    in the same situation. These accuracies were achieved in the absence of bilateral
    patients and without considering control subjects. When using control subjects
    for obtaining uncertain boundaries, these accuracies dropped to 75% (see Table
    6.1 for details). Using the evidence provided by this study, we conclude that
    asymmetry in the FLAIR intensity measures (mean and standard deviation) of the
    hippocampus may provide additional biomarkers, besides hippocampal volume asymmetry,
    for hippocampal sclerosis (HS) and side of epileptogenicity.


    In addition to the mean and standard deviation of the hippocampus, four conventional
    texture features—co-occurrence matrix, run-length matrix, absolute gradient, and
    histogram—of the FLAIR intensity were extracted to be investigated in this study.
    The wavelet transform energy features defined by Eq. (6.1) correctly classified
    unilateral hippocampal'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'sclerosis into right- and left-sided mTLE with an accuracy of 94%. This indicates
    that wavelet-based feature extraction has the capability to be used for mTLE lateralization.
    Three issues may be raised about this study: (1) the small sample size of 36 patients
    (20 left-sided and 16 right-sided), (2) not using bilateral cases as an additional
    category, and (3) dependency on the segmentation accuracy.


    In Study II [37], amygdalar FLAIR intensity features were used for epileptic lateralization
    in the absence of hippocampal atrophy through volumetric and FLAIR features. By
    using solely the amygdalar features, the side of epileptogenicity could achieve
    only 29% accuracy while 70% accuracy was achieved by similar features from the
    hippocampus, but it would be of interest to know that 22% of the cases that could
    not be lateralized with confidence using hippocampal FLAIR features were classified
    with confidence using amygdalar FLAIR features. This could be good evidence for
    a previous report [64]. Moreover, the results indicated that the automated segmentation
    of the amygdala was sufficient for this study and all wrongly lateralized patients
    fell within the uncertain boundaries. Since the data used in this study were acquired
    by different scanners (1.5T and 3T), the scanner variability could have affected
    the results if the intensity inhomogeneity of the FLAIR images had not been corrected.


    Similar to Study I, the bilateral cases were not investigated in this study, since
    the study focused on the patients with the Engel Ia outcomes. This means that
    one of the limitations of the previous study (lack of bilateral category) remained
    unaddressed while the other two were addressed adequately. Another limitation
    of this study was that it did not investigate the amygdalar volumetric changes
    associated with mTLE.


    The comprehensive study reported in Ref. [20] showed that the FA in the white
    matter structures affected by mTLE (cingulum, fornix, and corpus callosum) expressed
    distinctive patterns in unilateral and bilateral mTL relative to nonepileptic
    subjects. The results showed that FA in the subregions of the fornix, cingulum,
    and corpus callosum could determine the side of the epileptogenicity in all unilateral
    mTLE cases. In addition, the volumetric and FLAIR intensity changes in the hippocampus
    indicated that although these features were useful for lateralization, they did
    not distinguish unilateral from bilateral mTLE cases.


    The data used in this study were collected using a single scanner. This clearly
    reduced the undesirable variability and provided stable classification results.
    However, the capability of the proposed model in the case of multi-scanner/multi-center
    studies should be verified. In addition, the'
