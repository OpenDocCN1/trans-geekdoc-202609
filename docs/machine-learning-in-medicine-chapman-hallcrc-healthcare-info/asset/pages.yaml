- pgno: 193
  md: 'as sequences where sensor activations form time-series data. Thus, modeling
    activity recognition as a sequence labelling problem makes RNNs an appealing approach.
    In the present study, we exploit RNNs to model activities using their temporal
    information and then detect abnormal behavior deviating from normal patterns.
    Also, CNNs are good at encoding spatial information into account and extracting
    their own features. Thus, in this research, CNNs are used to encode the neighbourhood
    information of the sensors to recognise daily life activities and then detect
    abnormal behavior.


    The following steps are applied (1) A sliding-window approach inspired by Ref.
    [20] is applied to segment daily life sequences into time-slice chunks. (2) Time-slices
    are mapped onto features as described in Ref. [20]. (3) Then, three variations
    of RNNs, namely Vanilla, GRU and LSTM and CNNs are used to model and classify
    activities. (4) Lastly, these classifiers are used to flag abnormal behavior based
    on the classification confusion probability.


    The order of sensor readings is important to take the spatial information into
    account. We use a sliding window approach to segment data into activity instances.
    We applied the same sliding window approach as in Ref. [20] to extract the sensor
    reading chunks, which are used as input to RNNs and CNNs. The window size is based
    on time rather than the number of sensor events (one sensor reading tuple is named
    as the sensor event). Different time windows can be used such as 1-minute slices,
    60-second slices and so on. If 1-minute windows are used, all sensor readings
    which are in that minute are extracted in a window. These windows are mapped into
    specific representations as described in the following.


    # 10.5.1 Sensor Data Representation


    Raw sensor readings are mapped to the following three representations using a
    sliding window.


    +   * **Binary**: In this feature, sensors activated in a time-window are assigned
    to 1, while the ones not activated are assigned to 0.


    +   * **Change-point**: In this feature, in a time-window, if a sensor changes
    from ON to OFF, or from OFF to On, it is assigned to 1, while it is assigned to
    0 if its state remains the same.


    +   * **Last-fired**: In this feature, only one sensor is assigned to 1, indicating
    the last sensor which is fired last in a time-window.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 10.5.2 Abnormal Behavior Detection


    Abnormal behavior is detected as follows: The RNNs and CNNs are trained using
    the train set and then test instances are fed into these models to be classified.
    The classification confidence scores are used to decide if the test instances
    are normal or abnormal activities. For this purpose, a threshold, which is the
    mean of the confidence scores of training instances for each class, is used to
    decide the abnormality.


    In the next section, the Kasteren dataset will be used to evaluate RNNs and Aruba
    dataset will be used to test the ability of CNNs as well as their combination
    with LSTM RNNs.


    # 10.5.3 Experiments


    In this study, RNN and CNN implementations from Theano [66] and Keras libraries
    [65] are used. The train and test instances with a batch size of 20 are used and
    an Adam optimiser is chosen. RNNs and CNNs are compared with the traditional machine
    learning methods such as SVM (WEKA implementation with default parameters), NB,
    HMM, HSMM and CRF (implementations of Ref. [20]).


    The evaluation metrics, precision, recall, F-measure and accuracy (see Eqs. 10.1–10.4)
    are chosen to test the success of the proposed methods on activity recognition.
    Here, the following abbreviations are used: TP: True Positive, TT: Total True
    labels, TI: Inferred Labels, N: the number classes in the dataset and Total: total
    number of instances in the dataset.


    ```

    Precision = 1/N(∑_{i=1}^{N} Tpi/ Tti) (10.1)

    ```


    ```

    Recall = 1/N(∑_{i=1}^{N} Tpi/ Tti) (10.2)

    ```


    ```

    F-measure = 2 × Precision × Recall/ (Precision + Recall) (10.3)

    ```


    ```

    Accuracy = ∑_{i=1}^{N} Tpi/ Total (10.4)

    ```'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Sensitivity (True Positive Rate) and Specificity (True Negative Rate) metrics
    (Eqs. 10.5 and 10.6) are used to evaluate the proposed method''s success in abnormal
    behavior detection. A True Positive Rate (TPR) reflects the ability to detect
    true abnormal behavior, while a True Negative Rate (TNR) measures the ability
    to identify normal behavior.


    ```

    Sensitivity = TP/(TP + FN) (10.5)

    ```


    ```

    Specificity = TN/(TN + FP) (10.6)

    ```


    # 10.5.4 Results with Recurrent Neural Networks


    For the RNN experiments, Kasteren datasets are divided into train and test sets
    following a cross-validation approach on a daily basis so that one day data are
    used for testing while the remaining days are used for training and validation
    (10% of them are used for validation). The success rate is reported by averaging
    over the days. Train data are fed into the classifier using batches of 10 in 500
    epochs. The RNN network has two layers of 30 and 50 hidden neurons and each time,
    25 time-slices are given as an instance. These parameters are set empirically.
    The results are compared with HMM, HSMM, CRF and NB results of Ref. [20] as depicted
    in Tables 10.2–10.4.


