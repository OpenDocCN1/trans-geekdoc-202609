  md: 'software to deploy state-of-the-art models. Although research results have
    shown that deep learning models utilizing convolutional neural networks (CNN)
    have outperformed even human experts in terms of accuracy, there are some practical
    issues that prevent the widespread deployment of such ML systems in practice.
    We focus on three such issues in this chapter:


    +   1. **Significant dependence on the size of training data**: Modern ML methods,
    especially deep learning, is dependent on the amount of training data available.
    For medical applications, this poses a problem, since acquiring a large amount
    of labeled training data is expensive in healthcare. Also, dependence on a large
    amount of training data results in dependence on expensive computational resources,
    making the technology less accessible for underfunded healthcare centers.


    +   2. **Class imbalance**: Having a significantly reduced number of samples for
    one of the labeled classes results in class imbalance for supervised learning.
    Class imbalance happens very frequently for computer-aided diagnosis or segmentation
    applications. For example, in segmentation, only a few pixels are usually labeled
    as a foreground (e.g. tumor or lesion), and the rest of the pixels are background.
    This results in severe class imbalance, which is difficult to deal with by traditional
    ML algorithms [1].


    +   3. **Confidence tuning**: Most ML methods and their applications in computer-aided
    diagnosis only report accuracy/F1-score as a performance measure. However, for
    medical applications, a confidence measure would make the domain expert more comfortable
    with the system, and a simple tool to tune the confidence-accuracy tradeoff will
    be useful [2].


    In this chapter, we highlight three state-of-the-art research works that we have
    undertaken at the Ryerson Multimedia Research Laboratory in the past 3 years.
    These three projects tackle the three aforementioned issues by applying novel
    methodologies, architectures, and algorithms.


    In Section 9.1, we highlight how dependence on a large training set can be reduced
    by utilizing transfer learning [3,4]. We show that instead of using a large medical
    training dataset, we can simply utilize natural images from benchmark datasets
    to learn low-level features, and only train higher layers of deep networks with
    medical data, selected through an intelligent'
