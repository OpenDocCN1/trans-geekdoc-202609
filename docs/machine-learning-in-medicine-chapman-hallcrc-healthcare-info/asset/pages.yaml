- pgno: 228
  md: 'ML’s ability to handle large, complex datasets in a manner that circumvents
    many of the limitations of traditional statistical techniques [1]. Indeed, neurosurgery
    is certainly not immune to this influence. Recent years have demonstrated a significant
    rise in the number of articles highlighting the applications of ML to neurosurgical
    practice [2]. At the same time, diagnostic and epidemiological datasets have burgeoned
    in size and complexity, making the increase in ML articles one that is born out
    of both novelty and necessity.


    ML is not a monolith; it is more accurate to describe ML as a category of tools
    that can be subdivided based on the computational tasks that are solved by the
    algorithm [1,3]. This subdivision breaks down ML into three major categories:
    supervised learning, unsupervised learning, and reinforcement learning [4,5] (Table
    12.1). Of these, reinforcement learning is the most limited with respect to applications
    within neurosurgery. This is primarily due to its nature as a policy-determining
    technique that optimizes reward in a specified environment (e.g. a robot playing
    on a chessboard [environment] that attempts to determine a policy [moves] that
    maximizes reward and minimizes penalty) [5], which makes it less amenable to being
    used on epidemiological datasets than the other two categories.


    The potential impact of ML on neurosurgical practice is significant. Over the
    last few years, the literature that has focused on applying ML to


    **TABLE 12.1** Description of the Three Major Categories of Machine Learning


    | Attribute | Supervised Learning | Unsupervised Learning | Reinforcement Learning
    |

    | :--- | :--- | :--- | :--- |

    | Labeling | Outcomes are labeled a priori | No labeling of outcomes | No labeling
    of outcomes |

    | Description | Algorithm uses input variables to predict outcomes with labeled
    data as a reference | Algorithms separate data into clusters | Algorithms build
    a policy that maximizes reward and minimizes penalty within an environment |

    | Evaluation metrics | AUC and accuracy relative to actual outcome values | Not
    applicable, as data are unlabeled | Cumulative reward |

    | Examples | Classification algorithms (e.g. random forest) and regression algorithms
    (e.g. support vector regression) | k-means clustering, principal component analysis
    | Q-learning |


    AUC: area under the receiver operating characteristic curve.'
