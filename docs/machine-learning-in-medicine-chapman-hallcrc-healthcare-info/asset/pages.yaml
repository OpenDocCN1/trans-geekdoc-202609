    # 5.2.8 MeLU


    To understand the Mexican ReLU (MeLU) [25], let \(\phi^{a,\lambda}(x) = \max(\lambda
    - |x-a|, 0)\) be a “Mexican hat type” function, where \(a\) and \(\lambda\) are
    real numbers. When \(|x-a| > \lambda\), the function \(\phi^{a,\lambda}(x)\) is
    null but constantly increases with a derivative of 1 and between \(a\) and \(a-\lambda\)
    and decreases with a derivative of \(-1\) between \(a\) and \(a+\lambda\).


    The aforementioned functions serve as the building blocks of MeLU, which is defined
    as


    ```

    \( y_{i} = \text{MeLU}(x_{i}) = \text{PReLU}^{c_{0}}(x_{i}) + \sum_{j=1}^{k-1}
    c_{j} \phi^{a_{j},\lambda_{j}}(x_{i}) \)

    ```


    where \(k\) is the number of learnable parameters for each channel (one parameter
    for PReLU and \(k-1\) parameters for the coefficients in the sum of the Mexican
    hat functions; \(k=4\), 8 here), \(c_{j}\) are the learnable parameters, \(c_{0}\)
    is the vector of parameters in PReLU, and \(a_{j}\) and \(\lambda_{j}\) are both
    fixed and chosen recursively.


    Initially, the parameter \(maxInput\) is set. The first Mexican hat function has
    its maximum in \(2 \cdot maxInput\) and is equal to zero in 0 and \(4 \cdot maxInput\).
    The next two functions are chosen to be zero outside the interval \([0, 2 \cdot
    maxInput]\) and \([2 \cdot maxInput, 4 \cdot maxInput]\), with the requirement
    being that they have their maximum in \(maxInput\) and \(3 \cdot maxInput\) (Table
    5.1).


    Since Mexican hat functions are continuous and piecewise differentiable, so is
    MeLU. If all the \(c_{i}\) learnable parameters are initialized to zero,'
