    # 3.2 DIABETIC RETINOPATHY


    In 2010, it was estimated that 126.6 million people have diabetic retinopathy,
    of which 37.3 million have vision-threatening diabetic retinopathy. It was also
    predicted that by 2030, these numbers would increase to 191.0 million and 56.3
    million, respectively [3]. Globally, diabetic retinopathy is the leading cause
    of vision loss in those between 20 and 74 years of age. However, only 33% of those
    with diabetes mellitus have characteristic symptoms [4]. Machine learning presents
    an opportunity by which early detection and correct diagnosis of diabetic retinopathy
    can be performed.


    Gulshan et al. at Google trained a convolutional neural network (CNN) on over
    120,000 retinal images [5]. These retinal images were first graded by ophthalmologists
    for image quality and for the presence of diabetic retinopathy or diabetic macular
    edema. In addition to labeling the images, ophthalmologists assessed the severity
    of the images identified as diabetic retinopathy on the scale of none, mild, moderate,
    severe, or proliferative. Next, the images were presented to the CNN for training.
    Two sets of testing were performed and the CNN achieved an area under the curve
    (AUC) of 0.991 (95% confidence interval (CI), 0.988–0.993) on the first testing
    data set and 0.990 (95% CI, 0.986–0.995) on the second testing data set. Given
    that the highest AUC possible is 1.0, the above model performed exceptionally
    well.


    One of the limitations of machine learning in healthcare is that most often the
    images that the CNN is trained and validated on are images of one or only a few
    ethnicities. The model is never exposed to the inter-ethnicity differences and
    as such its performance would be expected to drop significantly if it was to be
    used for a different population. Ting et al. tried to account for this variability
    [6]. Their CNN was trained primarily on retinal images from people of Chinese,
    Malay, and Indian ethnicity. However, during validation, the CNN was provided
    images from people of the following races/ethnicities: Chinese, Malay, Indian,
    African American, White, and Hispanic. For detection of diabetic retinopathy,
    76,370 images were used during training, and 112,648 images were used during testing.
    The model had an AUC of 0.936 (95% CI, 0.925–0.943), a sensitivity of 90.5% (95%
    CI, 87.3%–93.0%), and a specificity of 91.6% (95% CI, 91.0%– 92.2%). The inclusion
    of multiple ethnicities is expected to lower the accuracy of the model but achieving
    an AUC higher than 0.93 indicates that'
