  md: "The algorithm used in segmentation in its entirety is as follows [16].\n\n\
    +   1.  For each slice \\( \\mathbf{X_s} \\), \\( s = 1,\\dots, S \\),\n    a.\
    \ The first is to gather the marginal empirical probability distribution \\( F_s\
    \ \\), which represents gray levels.\n    b. Pinpoint a starting LCDG model, which\
    \ is close to \\( F_s \\). This is done with the use of the initialization algorithm,\
    \ which can approximate the values of \\( C_p - K, C_n \\), and the parameters\
    \ \\( \\mathbf{w}, \\boldsymbol{\\Theta} \\) (marking weights, means, and variances)\
    \ of both negative and positive discrete Gaussians (DG).\n    c. Fix \\( C_p \\\
    ) and \\( C_n \\), use the modified EM algorithm to refine the LCDG-model by manipulating\
    \ other parameters.\n    d. Make \\( K \\) submodels by separating the final LCDG\
    \ model. There would be a submodel for each dominant mode. This is done by minimizing\
    \ the misclassification predicted errors and selecting the LCDG-submodel that\
    \ has the greatest average value (corresponding to the pixels with the highest\
    \ brightness) to be the model of the wanted vasculature.\n    e. Use intensity\
    \ threshold \\( t \\) to extract the voxels of the blood vessels in the MRA slice,\
    \ which separates their LCDG-submodel from the background.\n\n+   2.  Remove the\
    \ artifacts from the extracted voxels whole set with the help of a connection\
    \ filter, which chooses a system to construct by a 3D growing algorithm, which\
