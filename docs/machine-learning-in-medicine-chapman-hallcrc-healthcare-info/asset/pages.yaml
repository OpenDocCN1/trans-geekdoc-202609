    [9]. As such, this became the first autonomous diagnostic artificial intelligence
    system to be authorized by the FDA in medicine.


    # 3.3 AGE-RELATED MACULAR DEGENERATION


    Aside from diabetic retinopathy, machine learning in ophthalmology has been studied
    extensively on the diagnosis of age-related macular degeneration (AMD). AMD is
    the leading cause of severe central visual acuity loss in those over 50 years
    of age. It has been estimated that 15 million people in North America suffer from
    AMD [10]. Direct healthcare cost of visual impairment due to AMD is estimated
    to be $255 billion globally [11].


    In the implementation of machine learning in diagnosing AMD, one study examined
    the use of a binary classifier of normal versus AMD in optical coherence tomography
    (OCT) images, the most common imaging modality in ophthalmology [12]. About 50,000
    normal macular OCT images and about 50,000 AMD images were used for training and
    validation of the deep neural network. Three analyses of the performance of the
    neural network were completed. On each image, the CNN had an AUC of 0.9277. When
    the images from the same OCT scan were grouped together and the probabilities
    from each image were averaged, the AUC improved to 0.9382. Finally, the probabilities
    from all the images from one patient were averaged together, and the AUC improved
    to 0.9746. Similar to the use of machine learning in diagnosing diabetic retinopathy,
    its use in diagnosing AMD looks promising.'
