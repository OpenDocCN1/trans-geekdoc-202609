    for the three main brain tissues. Therefore, there was a clear need for a comprehensive
    feature reduction.


    To reduce the dimensionality of the feature vectors, three main steps were applied.
    The first step (feature selection) discarded the irrelevant features based on
    a Relief algorithm [60]. The second step reduced the number of features in two
    steps: (1) clustering the features according to their similarity in the voxel
    space using k-means clustering and (2) selecting the highest Relief score in each
    cluster and discarding the remaining features in the cluster. In the final step,
    sequential floating forward selection was used to combinatorically select the
    prominent features according to the least classification error. In each condition,
    the authors extracted the features, selected the best features based on the above
    explanations, and then trained and tested an SVM classifier, using the leave-one-out
    procedure. The results of feature selection and classifier training are presented
    in the Results section (Section 3.4).


    # Study V: Multi-Structural Volume Features


    In the above studies, as well as most of the studies conducted in this field,
    several structural features have been proposed to quantitatively provide evidence
    for lateralization. However, it is still a matter of debate whether such incorporation
    is associated with improvement of the lateralization and indeed beneficial. The
    aim of the study presented in Ref. [61] was to identify the contribution of the
    neuroanatomical sites/regions in lateralization and establish a robust classifier
    with the optimal number of features. The feature space included 53 volumetric
    features extracted from 53 hemispherically paired neuroanatomical regions using
    Eq. (6.3). A list of these regions segmented by FreeSurfer is available in Ref.
    [61]. The volume'
