    # 6.2.4  Feature Analysis and Classification


    In the following, we focus on the methods used for feature analysis—feature extraction,
    selection, and reduction—as well as the methods used for classification in the
    five selected studies.


    Study 1: T1-Weighted and FLAIR Features: A Hippocampus Study  It has been shown
    in several studies that hippocampal volume reduction correlates with the side
    of mTLE in a significant portion of the patients. Thus, this volume reduction
    has been widely used for mTLE lateralization. In addition to the hippocampal volume
    reduction, the presence of an increased FLAIR signal has been used as a feature
    for lateralization. An increase in hippocampal FLAIR signal intensity has been
    assumed to represent hippocampal gliosis and consequently probable focal epileptogenicity.
    The third set of image features were extracted using wavelet transform. Wavelet
    transform is a well-known tool for revealing the local frequency contents of an
    image and expressing the texture properties of an image. In Ref. [31], volumetric
    feature, mean and standard deviation of the'
