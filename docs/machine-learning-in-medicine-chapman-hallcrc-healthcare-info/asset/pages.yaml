    # 6.5 CONCLUSION


    The features used in the presented studies can be clustered in four groups: (1)
    volumetric features including single and multi-structural volumes used in Studies
    I\u2013V; (2) first- and second-order texture features used in Study IV; (3) DTI
    features used in Study III; and (4) FLAIR intensity features including single
    and multi-structural features used in Studies I\u2013III. We described the roles
    of these features in the lateralization of drug-resistant mTLE patients.


