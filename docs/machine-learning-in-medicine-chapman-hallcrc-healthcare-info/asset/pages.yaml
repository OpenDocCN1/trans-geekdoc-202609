    # 4.2 SOFT TISSUE THERMAL DOSE MODELING


    The irreversible cellular protein denaturation and coagulation necrosis occur
    when soft biological tissues are attainted with a certain temperature for a duration
    of time. Although some studies \[42,43\] assumed a regular shape such as a sphere
    or an ellipsoid for the approximation of the coagulation necrosis zone (lesion),
    it was shown that the extent of a lesion was related to the thermal dose attained
    in the tissue, which was a measure of tissue heat exposure history. An empirical
    measure of thermal dose, CEM$_{43}$, which relates the extent of a lesion to the
    cumulative equivalent minutes (CEM) of heat exposure at a tissue temperature of
    $43^{\circ}$C \[44\] is used in the present work, and it is considered that tumour
    necrosis occurs for 240 CEM$_{43}$ \[45\]. Mathematically, CEM$_{43}$ is computed
    by \[44\]


    ```

    $$\mathrm{CEM}_{43}=\int_{0}^{t} R^{(43-T(t))} d t \tag{4.1}$$

    ```


    where $t$ is the duration of heat exposure, $T(t)$ is the local tissue temperature,
    and $R$ is the constant, which is given by


    ```

    $$R = \begin{cases} 0.25, & (T(t)<43^{\circ}\mathrm{C}) \\ 0.5, & (T(t)\geq43^{\circ}\mathrm{C})
    \end{cases} \tag{4.2}$$

    ```


    To determine the amount of $\mathrm{CEM}_{43}$, the time evolution of the soft
    tissue temperature field (temperature-history) must be computed and recorded.
    The behaviour of heat transfer in biological soft tissues is modelled by the'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Pennnes bio-heat transfer equation [46], which accounts for the effects of
    heating and cooling of heat conduction, blood perfusion, metabolic heat generation,
    and external heat sources. It was validated against experiments [47,48] that the
    Pennes bio-heat model can offer reliable tissue temperature predictions, and it
    was widely used to model tumour management by hyperthermia and thermal ablative
    treatments [49–52]. For soft tissues of mass density \(\rho\), specific heat capacity
    \(C\), thermal conductivity \(k\), blood perfusion rate \(w_b\), blood specific
    heat capacity \(C_b\), arterial blood temperature \(T_a\), metabolic heat generation
    rate \(Q\), and subject to an external heat source \(H\), the Pennes bio-heat
    transfer equation is given by [46]


    ```

    $$\rho C \frac{\partial T(t)}{\partial t} = \nabla \cdot (k \nabla T(t)) - w_b
    C_b (T(t) - T_a) + Q + H \tag{4.3}$$

    ```


    where $\nabla \cdot$ represents the divergence operator, and $\nabla$ represents
    the gradient operator.


    # 4.3 CELLULAR NEURAL NETWORKS


    # 4.3.1 Architecture


    A CNN is a dynamic information-processing system that processes signals in real-time
    in a large-scale non-linear analogue circuit; the fundamental unit of a circuit
    in CNN is called a cell, and every cell is a time-continuous non-linear dynamic
    signal processing unit made of capacitors, resistors, and voltage-controlled current
    sources of linear and non-linear types [30]. Cells are interconnected and communicate
    with their adjacent cell neighbours [53]; as a result, it leads to a global propagation
    that cells not directly connected influence each other implicitly [54]. An example
    of a 2D CNN is shown in Figure 4.1. Owing to the behaviours of non-linear cell
    dynamics, local cell interaction, global cell propagation and simultaneous cell
    activity, CNNs are well suited for high-speed parallel signal processing such
    as


    ![](img/6554116edbb19a8210b75a29243fd6ec_51_0.png)


    FIGURE 4.1 A 2D CNN of grid size 3×3: the rectangles are the cells, and the connections
    between cells denote local cell interactions.'
