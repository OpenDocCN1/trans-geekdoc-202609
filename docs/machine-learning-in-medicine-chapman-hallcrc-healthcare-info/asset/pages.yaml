  md: "+   2. a Partition all data instances at the node by the value of the attribute.\n\
    b Compute the **information gain ratio** from the partitioning.\n\n$$\\mathrm{Gain\\\
    \ ratio}(S, A) = \\frac{\\mathrm{Gain}(S, A)}{\\mathrm{Split\\ information}(S,\
    \ A)}$$\n\n$\\mathrm{Gain}(S, A)$ = expected reduction in entropy due to sorting\
    \ on $A$, $S = \\{X\\}$ is a collection of training examples.\n\n$$\\mathrm{Gain}(S,\
    \ A) \\equiv \\mathrm{Entropy}(S) - \\sum_{v \\in \\mathrm{Values}(A)} \\frac{|S_{v}|}{|S|}\
    \ \\mathrm{Entropy}(S_{v})$$\n\nwhere $\\mathrm{Values}(A)$ is the set of all\
    \ possible values for attribute $A$, and $S_{v}$ is the subset of $S$ for which\
    \ attribute $A$ has value $v$ (i.e., $S_{v} = \\{s \\in S | A(s) = v\\}$).\n\n\
    $$\\mathrm{Split\\ information}(S, A) \\equiv -\\sum_{i=1}^{c} \\frac{|S_{i}|}{|S|}\
    \ \\log_{2} \\frac{|S_{i}|}{|S|}$$\n\nwhere $S_{i}$ is a subset of $S$ for which\
    \ $A$ has value $v_{i}$, and $c$ is the number of class.\n\n```\n**end for**\n\
    ```\n\n+   3. Identify a feature that generates the highest information gain ratio.\n\
    Exploit this feature to be the splitting criterion at the current node.\n   **if**\
    \ the best information gain ratio is 0 **then**\n   label the current node as\
    \ a leaf and return.\n\n```\n**end if**\n```\n\n+   4. Partition all instances\
    \ according to the attribute value of the best feature.\n\n+   5. Denote each\
    \ partition as a child node of the current node.\n\n+   6. a. If the child node\
    \ is “pure” (has instances from only one class), label it as a leaf and return.\n\
    b. If not set the child node as the current node and repeat Step 2.\n\n```\n**end\
    \ for**\n**end function**\n```"
