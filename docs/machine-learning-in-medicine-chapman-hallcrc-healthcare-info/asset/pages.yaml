- pgno: 236
  md: '# 12.5 FUTURE DIRECTIONS


    Table 12.2 summarizes the potential applications of ML to neurosurgery, which
    span several areas and affect those areas in several ways. Nevertheless, when
    it comes to being applied to the neurosurgical context, ML is still in a relative
    state of infancy. While ML in neurosurgery has become a hot-button subject and
    heavily pursued area of research, there are still numerous gaps that exist that
    make the present state of the literature far from complete. Therefore, a present-day
    discussion of ML cannot be complete without discussing the future, which does
    hold considerable promise. For the diagnosis, treatment, and prognosis of neurological
    pathology, we will discuss the future role of ML for neurosurgical practice, including
    both intracranial and extracranial (e.g. spinal cord) processes.


    The core advantages of ML stem from its ability to analyze large and complex datasets
    with many predictors, its ability to determine important predictors computationally
    without a priori specification, and its ability to capture nonlinear relationships
    [73–75]. As described earlier, many studies have been conducted that leverage
    these ML features to develop powerful diagnostic and prognostic tools. As ML continues
    to grow in popularity [2], the applications of ML to the areas described in the
    previous sections will


    TABLE 12.2 Summary of the Potential Applications of Machine Learning to Neurosurgical
    Practice, Sorted by Diagnostic and Intraoperative Applications (Section 12.2)
    and Prognostication (Section 12.3)


    | Area of Neurosurgery | Diagnosis and Intraoperative Management | Prognosis |

    | :--- | :--- | :--- |

    | Epilepsy | Segmentation and classification of temporal lobe epilepsy | Prediction
    of seizure freedom in temporal lobe epilepsy |

    | Neurovascular | Identification of patients within the 4.5-hour time window for
    acute ischemic stroke | Prediction of outcomes after mechanical thrombectomy [80]
    |

    | Neuro-oncology | Classification, grading, and segmentation of intracranial neoplasms
    | Prediction of survival after surgical treatment, prediction of cancer recurrence
    after gamma knife radiosurgery for metastases |

    | Traumatic brain injury | Intracranial pressure monitoring | Prediction of mortality
    and unfavorable outcome after surgery |

    | Spinal cord injury | Spinal cord segmentation, diagnosis of spinal cord injury,
    intraoperative monitoring of somatosensory evoked potentials | Prediction of functional
    outcomes, health-related quality-of-life outcomes, prolonged opioid use, and discharge
    disposition after surgery |'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'become more robust and take a bigger place in clinical practice. Moreover,
    with the advent of tools such as natural language processing (NLP) and computer
    vision [6], artificial intelligence tools beyond ML could begin to impact neurosurgical
    practice in a variety of other ways (e.g. NLP for extracting information from
    imaging reports [76] and computer vision for analysis of hand function after SCI
    [77]).


    However, in addition to a more broadened scope of ML and artificial intelligence,
    the path forward requires future studies in ML to achieve greater methodological
    robustness and reproducibility before ML can be confidently introduced to neurosurgery.
    To achieve robustness, future literature on ML would benefit from following the
    2016 guidelines created by Luo and colleagues [75], which describe a systematic
    approach to developing ML models. Strategies proposed by the guidelines to ensure
    robust analysis include using separate training and testing sets to minimize overfitting,
    using calibration and discrimination metrics, and, when possible, using external
    datasets for further validation of the model. For reproducibility, ML algorithms
    by their nature are difficult to express on paper, as they are frequently far
    too complex to describe via an equation. For this reason, many of the aforementioned
    ML articles do not include a copy of the model with the paper; however, future
    studies would benefit from using web-based applications to make their ML models
    more easily applied. This will inevitably aid the reproducibility and external
    validation of those studies, allowing those algorithms to eventually become an
    integral part of future neurosurgical practice.


    # ### 12.6 LIMITATIONS


    Despite its promise, ML carries important limitations that ought to be considered
    when implementing it into practice. First, compared to logistic regression models,
    which can be written neatly in equation form, many ML models are more difficult
    to express in closed form due to their inherent complexity. This makes their interpretation
    difficult and less intuitive, which is why the development of web-based applications
    for ML programs developed in future neurosurgical research is crucial to overcome
    this inherent disadvantage. Second, as a data-driven tool, ML is inherently limited
    by the quality and quantity of the underlying data [78]. Small, poor-quality datasets
    will result in worse ML models than larger, high-quality datasets. Additionally,
    biases within data can make ML algorithms less generalizable. For example, an
    algorithm making diagnostic predictions based on data from a single hospital site
    may be more likely to suggest a'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'diagnosis primarily seen at that center, making it less applicable to data
    from other centers. Third, there are significant medico-legal challenges that
    can potentially arise from the widespread and unregulated implementation of ML
    [79]. These challenges can arise from the ‘black-box’ interpretation of some ML
    algorithms, which makes it difficult to decipher the parts of the underlying data
    that the algorithm used to generate an output. For instance, if a user did not
    have a priori knowledge of the fact that an ML algorithm used the name of the
    hospital (an otherwise irrelevant variable) as an important predictive variable
    for a surgical outcome, then that user could be led into utilizing the algorithm
    inappropriately in multiple contexts. Careful consideration of these issues will
    also be vital toward properly implementing ML in the future as an adjunct to clinical
    decision-making in neurosurgery.


