  raw: 'The analytical life cycle should involve model operationalization. As highlighted
    before, it is the most important phase for the company when the model selected
    as the champion model supports a specific business action. It is important to
    have challenger models as well. The challenger model can be one of the models
    evaluated during the assessment that was not selected as the champion model, perhaps
    because the overall accuracy, time to score, or lack of interpretability. Regardless
    of the reason they were not selected, challenger models are good models that can
    replace the champion model in case something happens. For example, let us say
    that customer behavior changes over time and the model performance decays. The
    champion model is not generalizing as expected, and before another model is trained,
    one of the challenger models can be deployed to replace the current champion.
    This model replacement would save a significant amount of time for the company
    while supporting the business action. Champion and challenger models should be
    registered and published for future deployment.


    Registering models means putting the models in a central repository. Publishing
    the model means putting the score code where the model is going to run in production.
    The champion and challenger models should be ready to be deployed and executed
    in multiple platforms.


    Monitoring


    An essential phase in the analytical life cycle is monitoring the model performance
    over time. All models are trained based on a particular data set, considering
    a specific time frame. Customers’ behavior changes over time, and the data used
    to create the models are no longer the same. Because of that, the model in production
    was trained on a data set different from the one used to score. For this reason,
    the model’s decisions can drift over time and the performance can decay significantly.
    When this happens, it is time to change the model. The champion model currently
    in production can be retrained. In some situations, a retrain suffices. In others,
    just a model retraining is not enough, and a brand-new and different model should
    be trained. The only way to make the company aware of this need – retrain or rebuild
    – is by monitoring the current models in production and evaluate when the model’s
    performance decays.


    The analytical life cycle considers multiple phases, from data preparation to
    retraining or rebuilding the models, passing through data exploration, modeling,
    deployment, and monitoring. Data scientists are involved in the initial phases
    of the analytical life cycle: data preparation, data exploration, and of course,
    modeling. They will be involved during the model assessment and deployment tasks
    associated with registering and publishing the champion and challenger models
    in different platforms or exposing them in different formats.


    Model Operationalization


    Many organizations in all industries struggle to operationalize their analytical
    models. Some research shows that only half of the analytical models developed
    are put in production. The other half simply does not bring any value to the organization.
    Other research shows that for the models that are put in production, they take
    at least three months to be ready for deployment. This time and effort equals
    a real operational cost and means a slower time to get value from the model. In
    some cases, no value at all is brought to the company when the business event
    is time-sensitive like churn, fraud, risk, and some sales campaigns.


    Figure 9.11: DevOps


    ![image](Images/f0149-01.jpg)


    To overcome this challenge, many organizations are seeking a better approach to
    not just deploy their analytical models in an effective manner but mostly to manage
    and monitor them efficiently. One approach is to operationalize and integrate
    the tasks assigned to register, publish, deploy, monitor, and retrain the models.


    All models degrade, and if they are not given regular attention, performance suffers.
    Models are like cars: to ensure quality performance, you need to perform regular
    maintenance. Model performance depends not just on model construction, but also
    on data quality, fine-tuning the model, regular updates to the model, and retraining
    the model.


    Operationalizing this cycle means integrating all the steps assigned to extract
    value from the analytical models. This integration process is often referred to
    as ModelOps. ModelOps, or model operationalization, allows companies to move analytical
    models from the development environment, including training, validation, and testing,
    to production as quickly as possible while ensuring quality results. It enables
    companies to manage and scale models to meet demand and continuously monitor the
    analytical models to spot and eventually fix early signs of degradation. Speed
    and quality in moving models from development to production are essential to allow
    companies to get the most out of analytics. Monitoring and retraining are crucial
    to identify the right moment the models start decaying and then trying to fix
    them by just retraining the model. Another fix is just trying out the challenger
    models registered and published in the production environment. Registering models
    means putting the models in a central repository. Publishing the model means putting
    the score code where the model is run in production.


    Monitor Performance


    The first step in ModelOps is to monitor the performance of the models put in
    production. ModelOps represents a cycle involving development, testing, deployment,
    and monitoring. However, ModelOps is effective if it moves toward the company’s
    main goals, which in terms of analytics are to provide a scalable approach to
    constantly deliver accurate analytical models in supporting business actions.


    At the strategic level, organizations need to evaluate if ModelOps best practices
    are properly implemented, helping these companies to achieve scale and accuracy
    when running analytical models in production to support business actions. At the
    operational level, companies need to monitor the performance of all models deployed.


    Very often, a dashboard is available to evaluate some fit statistics assigned
    to the analytical models in production. Overall misclassification or average square
    error for supervised models with categorical and continuous targets is an example.
    Some more specific metrics, such as sensitivity or positive predictive value,
    can also be monitored. This dashboard can also monitor some business metrics affected
    by the models deployed. An example is the rate of the loans approved or denied,
    or the rate of the customer churn.


    Finally, in terms of metrics, there are some more operationalized measures to
    be monitored. The concepts of verification and validation are both important here.
    Verification confirms if a model was correctly deployed in production and performs
    as designed. Validation confirms if a model provides the results as expected,
    for example, based on the target defined to the analytical model. Both verification
    and validation are relevant best practices in the development and deployment of
    high-quality models in production.


    A key component in ModelOps is indeed to monitor analytical models in production.
    This is to avoid the operational cost of having a useless model in production
    supporting a business action. All analytical models degrade, as stated before.
    It is just a matter of time. Some models can degrade as soon as they are deployed.
    For example, a fraud detection model is trained based on a particular type of
    fraud. As said before, many models take at least three months to reach the deployment
    phase. When the fraud model is deployed, the fraudster might have changed their
    behavior or even have changed the type of the fraud that was committed. Then,
    the type of the fraud the model was trained to detect no longer exists, and this
    model is useless.


    Data Quality'
