  raw: 'In the machine learning community, self-organizing maps are getting more popular,
    especially considering the continuously increasing amount of data available for
    analytical model development. Self-organizing maps are fully capable of clustering
    exceptionally large and complex data sets. On the other hand, with the current
    computing capacity, self-organizing maps can be trained in a short amount of time.


    One of the weaknesses of self-organizing maps is that the neurons require a substantial
    amount of data to create meaningful clusters. If the neurons are provided too
    little information or too much extraneous information, the clusters might not
    be accurate or informative.


    Another weakness assigned to self-organizing maps is the assumption that nearby
    data points behave similarly. If this assumption is violated, the self-organizing
    maps will not converge to useful and meaningful clusters. As a result, at the
    end of the clustering process we might find a few groups with most of the observations
    from the input data set and several groups with few cases.


    Use Case Study: Insolvent Behavior


    Insolvent behavior among customers can generate millions of dollars in losses
    to companies. However, not all insolvent customers have the same characteristics.
    To save the company money, self-organizing maps could be used to highlight good
    insolvent customers among all the insolvent. As mentioned before, customer behavior
    can consist of several dimensions, considering multiple types of attributes. Most
    of the clustering techniques find it difficult to handle a great amount of input
    variables. Self-organizing maps are capable of handling not just substantial amounts
    of data, but also high dimensionality in the input space and complex data. Considering
    customer behavior, particularly assigned to unmanageable debt, here are some of
    the possible attributes:


    *   Payment behaviors in terms of percentage of the invoice amount


    *   Frequency and recency of payment delays


    *   Customer demographics


    *   Amount and period in debt


    *   Products and services assigned to the debt


    *   Customer aging, segmentation, status


    *   Credit score


    Self-organizing maps can be used to generate clusters of customers according to
    their insolvent behavior. The clusters can be used to understand the risk and
    harm of each group of customers to the company operation cash flow. From the insolvent
    customers’ group, it is possible to identify the ones that are less harmful to
    the company. Some groups reveal very harmful customers. Other clusters point out
    customers in between those behaviors.


    Good insolvent customers might present a payment behavior that causes low damage
    to the company while they still consume its products and services. A proper relationship
    with these customers can bring lots of benefits to the company. For example, there
    are some customers that recurrently delay their payment for a brief period and
    then make their payment, even the minimum amount. Once the customer becomes insolvent,
    the company immediately sends out a collection letter. This subset of customers
    pays their bills whether they receive the letter or not. The company then is just
    wasting money in preparing and sending out those letters. A simple classification
    model upon the insolvent clusters can identify the customers that will likely
    pay their bill regardless of the collection letter. The company can then avoid
    issuing the letter for those customers and save a substantial amount of money.


    Figure 6.12: Self-organizing Maps for Insolvency Segmentation


    ![image](Images/f0094-01.jpg)


    Cluster Evaluation


    Data scientists need creativity and collaboration when evaluating clusters. They
    need creativity to understand the business aspects behind the differences in each
    cluster and associate these main characteristics to the company’s goals. They
    need collaboration because this process involves a lot of business knowledge,
    sometimes specific to a department or business action like a campaign, promotion,
    or relationship. Quite often data scientists need to work with business analysts
    from distinct departments to better understand the meaning of each cluster and
    then how to correlate them to business approaches.


    Cluster interpretation usually involves manual inspection of the average attributes
    associated to each cluster and the difference to the entire population. It also
    might require a comparison to existing analysis previously performed. Technically,
    data scientists can evaluate clusters based on quality measures, or distance measures,
    evaluating the similarity within each cluster.


    At the beginning of the chapter, we stated some pre-requirements for a good clustering
    processing, including meaningful attributes, numeric variables, and not too many
    inputs. However, when analyzing clusters, data scientists can add more variables
    to the analyses, variables eventually not used during the clustering, and attributes
    not added to the input space. These new input variables can be relevant to the
    business and can help in discriminating the clusters. At this point, even categorical
    variables that were not used during the clustering process can be used here to
    help identifying the main characteristics of each cluster and how they are correlated
    to the business.


    Cluster Profiling


    Cluster profiling can be defined as the derivation of a class label from a proposed
    cluster solution. In cluster profiling, the emphasis switches from cluster formation
    to cluster interpretation. The objective is to identify features or combinations
    of features that serve to uniquely describe each cluster of interest.


    Cluster profiling attempts to assign a distinguishing class label to each of the
    derived clusters such that it uniquely identifies the cluster. Here is one straightforward
    profiling methodology:


    1.  Cluster the sample using a hierarchical or partitive clustering technique
    and save each cluster’s identifying number.


    2.  Fit a decision tree or a regression with the cluster number as the target
    to identify which of the predictor variables are different from cluster to cluster.
    These variables, either individually or in combination, are the basis for meaningful
    cluster descriptions (class labels).


    One strength is that cluster profiling can aid in a marketing process. Data scientists
    can build customer segments to understand how to best market a product or set
    of products to each customer group.


    The cluster profiles might not be very robust. For example, if the data scientists
    use a different subset of the data, use different clustering methods, or use a
    different number of clusters, the cluster profiles could be different.


    Cluster profiling can lead to marketing segmentation. These are some of the predictor
    variables used in the cluster analysis:


    *   Demographic – age, gender, income, education, and ethnicity


    *   Geographic – ZIP code, city, climate, urban, suburban, and rural


    *   Lifestyle – interests, opinions, and social class


    *   Behavioral – purchasing habits, brand loyalties, and price sensitivity


    When the clusters have been profiled, data scientists can customize the marketing
    message to be more unique to a specific audience. For example, instead of sending
    out a generic, mass marketing message, data scientists can target the advertisement
    to consumers who are more likely going to buy the product. This can boost customer
    acquisition through advertising and keep costs lower.


    Additional Topics


    With customer segmentation, predictive models that are constructed on the segments
    often produce more accurate predictions than are achieved when a single model
    is constructed using the entire sample.


    Cluster segments can also be used as predictor variables in a predictive model
    such as logistic regression. Using the cluster segments might improve the predictive
    accuracy of the model.'
