    Use Case: Anti-attrition


    A good business example for two-stage models is problems related to customer attrition.
    When a customer calls the company call center with a complaint, a predictive model
    can be fit to predict what the customer will do if the company does not rectify
    the complaint. For example, if the customer feels they have been charged an excess
    amount, will the customer go to a consumer protection agency, or to a regulatory
    agency, or go straight to court if their complaint is not rectified? Each one
    of these jurisdictions has its own cost for the company as shown in [Figure 5.9](#Chapter05.xhtml#ch05fig9).
    If the problem can be rectified at the call center level, it is cheaper for the
    company. If the problem reaches the consumer protection agency, the cost for the
    company is higher. If the problem reaches the regulatory agency, the cost can
    be even higher as some penalties can be added. However, if the problem goes to
    court, the cost to the company can be enormous because in addition to penalties,
    there might be some civil reparations involved.


    To accommodate complaints and optimize the way the company handles reducing the
    costs associated to higher complaint escalation, a first model will classify what
    action each customer is likely to take if their complaint is not remedied by the
    call center representative. A second model estimates the loss associated to the
    case if the customer complaint is not rectified and reaches a higher level for
    resolution.


    A decision tree is used to classify the probability of each customer complaining
    to a higher authority. For example, what is the probability the customer escalates
    the problem to the consumer protection agency, the probability the customer escalates
    the problem to the regulator agency, and the probability the customer escalates
    the problem to the court? For example, assume that the highest probability of
    action for customer A is to escalate the problem to court. This probability was
    produced by a decision tree. A neural network is then used to estimate the loss
    for the company if customer A wins the case in court. Notice in [Figure 5.10](#Chapter05.xhtml#ch05fig10)
    that the first model, the decision tree, is interpretable and helps the business
    department understand the reasons associated with the customer complaint and escalation
    approach. The second model, the neural network, is not interpretable, but at this
    point the company is much more interested in understanding the amount of loss
    associated with the customer action.


    By having all this information, the call center representative knows the probability
    of the customer escalating the problem to a higher authority and the estimated
    company cost of this action. The call center representative can have multiple
    messages and approaches depending on the combination of authority and loss associated
    to each customer. Suppose that for customer A, the representative realizes how
    likely the customer is to escalate the problem to court, and the high loss associated
    to it, and then can decide to suspend the invoice until the case is fully analyzed.
    If the customer is correct about the overcharge, the company can easily remove
    that specific invoice and provide to the customer a pleasant experience. If the
    customer is wrong about the overcharge, the company can reissue the invoice and
    charge the customer for that usage.


