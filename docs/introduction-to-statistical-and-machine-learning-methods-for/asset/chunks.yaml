    A decision tree is read from the top down starting at the root node. In this example,
    `previous delay` is the root node where cases with a value of `0` go to the left
    in the tree and cases with values of `1` or more go to the right in the tree.
    (See [Figure 3.2](#Chapter03.xhtml#ch03fig2).) `previous delay` was chosen for
    the root node based on a split-search algorithm that finds the predictor variable
    that gives the most significant split between the values of the target variable.


    Each internal node represents a split based on the values of one of the predictor
    variables. The predictor variables can appear in any number of splits throughout
    the tree. Cases move down the branch that contains its predictor value.


    The leaves represent the predicted target. All cases reaching a leaf are given
    the same predicted value. This value is based on the target value of cases in
    the training data that reach this leaf. In this example, customers with previous
    delays in payments, with a billing difference of 10 percent and greater and who
    have been customers less than 5 years, are predicted as a default.


    The strengths of decision trees are that they are easy to implement, and they
    are very intuitive. In fact, the results of the model are quite easy to explain
    to non-technical personnel. Decision trees can be fit very quickly and can score
    new customers very easily.


    Unlike linear models such as `linear regression` and `logistic regression`, decision
    trees can handle non-linear relationships between the target and the predictor
    variables without specifying the relationship in the model.


    Missing values are handled because they are part of the prediction rules. For
    example, if `income` is missing, the customers can be put into their own input
    space rather than eliminated from the analysis.


    Figure 3.2: Decision Tree Modeling Approach


    ![image](Images/f0046-01.jpg)


    Decision trees are also robust to outliers in the predictor variable values and
    can discover interactions. An interaction occurs when the relationship between
    the target and the predictor variable changes by the level of another predictor
    variable. For example, if the relationship between the `target` and `income` is
    different for males compared to females, decision trees would be able to discover
    it.


    Decision trees confront the curse of dimensionality by ignoring irrelevant predictor
    variables. However, decision trees have no built-in method for ignoring redundant
    predictors. Since decision trees can be fitted quickly and have a simple structure,
    this is usually not an issue for model creation. It can be an issue for model
    deployment though, in that decision trees might arbitrarily select from a set
    of correlated predictor variables. To avoid this problem, it is recommended that
    the data scientists reduce redundancy before fitting the decision tree.


    As a drawback, decision trees are very unstable models, which means that any minor
    changes in the training data set can cause substantial changes in the structure
    of the tree. The overall performance, or accuracy, can remain the same, but the
    structure can be quite different. If the structure is different, the set of rules
    based on thresholds are also different. The common method to mitigate the problem
    of instability is to create an ensemble of trees. We will see this approach in
    the next chapter.


