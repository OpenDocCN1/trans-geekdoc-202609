    For example, if one group of customers shows high usage of products and services,
    high revenue, and no delays in payments, then it is in the interest of the company
    to keep these customers happy. A loyalty promotion campaign could be targeted
    at those customers to guarantee they keep consuming company products and services.
    Some other customers might match to a different behavior, with average usage and
    revenue generated, but no payment delay at all. These customers can represent
    most of the customer base. Even though they are not high revenue generators, as
    they do not delay their payments and consistently use the products and services,
    they can be considered as great contributors to the company cash flow. They should
    be effectively monitored and retained as much as possible.


    Figure 6.8: K-means Clustering for Customer Segmentation


    ![image](Images/f0089-01.jpg)


    However, if another group of customers shows a frequent delay in payments, eventually
    with high average bills, then it is in the interest of the company to closely
    monitor those customers because they are at risk of defaulting on their payments
    and affect the company operations. Each cluster, or group of customers, holds
    a set of characteristics that put them together in the same group. This information
    can be effectively used to better target the customer base in more specific campaigns.


    ## Self-organizing Maps


    The self-organizing map (`SOM`) algorithm is a method that combines the main objectives
    of a clustering technique and projection algorithm to reduce dimensionality. Not
    only can this be used to organize or assign observations into clusters, but it
    can also be used to project multidimensional data onto a two-dimensional feature
    map, where geometric relationships between the input variables indicate the observations
    similarity.


    Self-organizing maps are also a useful data mining and visualization tool for
    large and complex data sets. Because they represent a multidimensional input space
    (multiple input variables) into a two-dimensional matrix (the lattice matrix representing
    the clusters), they can be used to plot the observations into a two-dimensional
    chart. This makes it easier to assess input variables distributions across all
    observations in the data set.


    `SOM` are a type of artificial neural network that is trained using unsupervised
    learning. They are different from the neural network model that we described in
    [Chapter 4](#Chapter04.xhtml#ch04) that was trained based on the target. The `SOM`
    algorithm is a neural network that trains upon competitive learning. The idea
    was first introduced by C. von der Malsburg in 1973 and then developed and refined
    by T. Kohonen in 1982. Think of it as a neural network with a single computational
    layer of neurons arranged in rows and columns. Each neuron contains a weight vector
    with the input variable values and the geometric location in the grid. Furthermore,
    each neuron is fully connected to the input layer. The model creates a map, or
    a low dimensional matrix, containing a discretized representation of the input
    space. The traditional supervised neural network is trained based on an error
    function. The unsupervised neural network in this clustering perspective is trained
    based on a neighborhood function to preserve the properties of the input variables.
    This is the competitive learning assigned to the self-organizing maps.


    The low dimensional matrix needs to be set in advance like the `k` in the `k-means
    clustering`. That creates the map for the competitive learning. For example, a
    two-dimensional matrix is defined to represent all the observations from the input
    data set and all the input variables. Think about this process as a dimension
    reduction, as you might have thousands of rows (observations) and hundreds of
    columns (inputs) being mapped to a smaller matrix, perhaps with three lines and
    three columns (nine cells or nine groups or clusters). The map is initialized
    with random weights that represent the input space. In other words, each cell
    in the map has initial weights to represent the observations inputs.


    The neurons’ responses are compared. The winning neuron is then selected from
    the matrix.


    Figure 6.9: Kohonen Self-organizing Maps


    ![image](Images/f0091-01.jpg)


    The next step in the self-organizing algorithm is to randomly select an input
    vector from the set of training data. Every neuron is examined to determine which
    weights are most like the input vector. The algorithm used to determine the most
    similar neuron is a Euclidean distance calculation. The winning node is commonly
    known as the Best Matching Unit (`BMU`). The neurons closest to the `BMU` are
    called neighbors. Every time an observation is taken for the model training, it
    is then compared to all cells in the map. In the example in [Figure 6.9](#Chapter06.xhtml#ch06fig9),
    we have nine cells to compare. A comparison is made between the input vector and
    the weights in all cells. The observation is then assigned to the closest cell
    in the map. The recursive process guarantees that every observation is taken by
    the model during the training process to compare the input vectors to the cells’
    weights.


    Figure 6.10: Weights Adjustment Based on Observations Similarity


    ![image](Images/f0091-02.jpg)


    Figure 6.11: Map Reconfiguration Based on Weights Adjustment


    ![image](Images/f0092-01.jpg)


    The selected neuron is activated together with its neighborhood.


    The weights of the `BMU` and neurons close to it in the `SOM` grid are adjusted
    toward the input vector. The effect of this weight update is to move the `BMU`
    and the neighbors closer to the input vector.


    In summary, once an observation is assigned to a particular cell, all neighboring
    cells are adjusted to account for the neighbor’s weights. This makes similar observations
    fall into the same clusters and makes similar clusters get close to each other.
    This process occurs continuously until all observations in the training samples
    are taken for the model training and all cells in the map are weight adjusted
    according to the observations’ assignments.


    The adaptive process changes all the weights to resemble the inputs'' signals
    more closely.


    This process is repeated for all the observations in the training data set, distorting
    the initial arrangement of neurons. The result is a neuron arrangement that conforms
    to the input data. It should be noted that the geometry of the grid is not changing,
    just that the grid is getting deformed. That interactive comparison and adjustment
    on the weights represents the competitive learning and creates the self-organizing
    map, creating a good representation of the clusters based on the input observations.


    The self-organizing map algorithm has the following steps:


    1. Randomly initialize all weights.

    2. Select input vector `x = [x1, x2, x3, …, xi]`, where `xi` are the input variables.

    3. Compare `x` with `wj` for each neuron `j` to determine the winner neuron.

    4. Update the winner neuron so that it becomes more like x, together with the
    winner’s neighbors.

    5. Adjust the parameters: learning rate and neighborhood function.

    6. Repeat from step 2 until the map has converged, which means no noticeable changes
    in the weights occurs or a pre-defined number of training cycles have passed.


    One of the advantages of self-organizing maps is that the algorithm attempts to
    map weights to conform to the input data with the main objective of representing
    multidimensional data in an easier and more understandable form. That makes it
    easier to visualize and understand the distribution of the input data.


    Another benefit is that a self-organizing map can be used as a technique to reduce
    the dimensionality of the input data. The final grid of clusters makes it easier
    to observe similarities in the data.

