    # 数学与统计学


    数据科学家在优化领域需要数学和统计学。这指的是在存在约束和资源的情况下，旨在为问题寻找最优解决方案的模型。目标函数描述了可能的解决方案，这涉及到根据某些约束使用有限资源。数学和统计学在预测领域也是必需的，该领域由用于估计时间序列数据未来值的模型组成。根据过去一段时间的数值、销售额或消费量，可以根据过去的行为估计未来值。最后，数学和统计学在计量经济学领域也是需要的，该领域将统计模型应用于经济数据（通常是面板数据或纵向数据），以突出经济关系的实证结果。这些模型被用于评估和开发计量经济学方法。


    数学和统计学在文本挖掘领域也必不可少。这是一个非常重要的分析领域，尤其是在现在，因为大多数可用数据都是非结构化的。想象一下所有的社交媒体应用、媒体内容、书籍、文章和新闻。在非结构化的格式化数据中存在着海量信息。分析此类数据允许数据科学家推断主题之间的相关性、识别可能的内容聚类、搜索特定术语等。通过社交媒体上的文本数据识别客户的情绪是一个被称为情感分析的热门话题。


    # 计算机科学


    今天可用的数据量是前所未有的。最重要的是，关于一个问题或场景的信息越多，产生良好模型的概率就越大。由于数据量巨大，数据科学家并不是手动开发模型。他们需要具备计算机科学技能来开发代码、提取、准备、转换、合并和存储数据、评估模型结果，并在生产环境中部署模型。所有这些步骤都在数字环境中执行。例如，随着云计算普及度的急剧增加，它经常被用于采集数据、创建模型并将其部署到生产环境中。


    在某些时刻，数据科学家需要知道如何创建并部署模型到云端，并使用容器或其他技术允许他们将模型迁移到需要的地方。考虑使用交通摄像头的图像识别模型。捕获数据并从摄像头流式传输到中央仓库、训练模型，然后传回摄像头进行评分是不可能的。每秒都有数千张图像被捕捉，这种数据传输将使解决方案变得不可行。解决方案是根据数据样本训练模型，并将模型导出到设备本身（即摄像头）。当摄像头捕捉图像时，模型会实时对图像进行评分和识别。所有技术对于解决问题都至关重要。这不仅仅是分析模型的问题，它涉及一系列捕获和处理数据、训练模型、泛化解决方案并将结果部署到所需之处的过程。图像识别模型了容器的用处，容器将软件代码及其所有依赖项打包，以便应用程序能够从一个计算环境快速可靠地运行到另一个环境。


    面对今天的挑战，数据科学家需要具备强大的计算机科学技能，通过不同的框架、语言和存储方式将模型部署在不同的环境中。有时，必须创建程序来采集数据甚至输出结果。编程和脚本语言对于完成这些步骤非常重要。有许多包允许数据科学家训练监督和无监督模型、创建预测和优化模型，或执行文本分析。用于开发非常复杂模型的新机器学习解决方案频繁创建和发布，为了保持技术更新，数据科学家需要理解并使用所有这些新解决方案。


    用于收集、准备和清洗数据的软件也非常重要。任何模型都只是输入数据与要分析、分类、预测或估计的事件之间的映射。如果数据质量差或存在大量不一致之处，模型将映射出这些问题，导致结果将是不准确的。海量数据应该存储在高效的仓库中。实现这一点需要数据库，并且要求数据科学家理解数据库的工作原理。为了处理海量数据，需要分布式环境。数据科学家通常需要理解这些大规模并行处理引擎是如何工作的。除了数据库，还有许多用于分析的新型仓库结构。


    总结来说，要学习和精通的技能太多了，远超一个人的处理能力。因此，在大多数情况下，数据科学家需要与其他合作完成创建分析模型所需的所有活动，例如数据工程师、应用开发人员、数据库管理员、基础设施工程师和领域专家。


    # 领域知识


    数据科学家需要的关键技能之一是领域知识。是的，人类仍然很重要。理解问题并评估解决问题所需的条件是非常重要的。理解如何将模型结果与实际行动联系起来是非常重要的。分析模型提供了一个方向。根据一系列信息、政策、法规、影响等如何利用结果真正解决问题，是成功的关键因素。创建分析模型的另一个关键因素是对业务问题的意识，以及它如何影响公司、社区、个人和政府。了解业务场景有助于数据科学家创建新的输入变量、转换或组合原始变量，并选择和丢弃重要或无用的信息。


    领域知识的一个良好例子是电信领域。数据科学家需要知道可用什么类型的数据、交易系统是如何实现的、使用了哪种计费系统，以及如何从呼中心收集数据。


    除了允许数据科学家通过结合业务概念来改进模型开发的领域知识外，数据科学家必须保持好奇心，并尝试多种方法来解决业务问题。他们需要主动预测业务问题并提出分析解决方案。在某些情况下，业务问题并不明确，但可以进行改进。数据科学家需要创新来设计和实施不同的方法来解决问题。创造力和创新包括将不同的分析模型结合起来以提高见解并丰富数据分析。


    '
- fmt: "\n## Collaboration\n\nCollaboration is another key factor in data science.\
    \ There are many fields of expertise, and it is almost impossible for a single\
    \ person to master all of them. Collaboration allows data scientists to work alongside\
    \ different professionals when seeking the best solution for a business problem.\n\
    \nFor example, if data scientists are developing models to predict loan defaults,\
    \ then they probably need to partner with someone from the finance department\
    \ to help them understand how the company charges the customers, what time frame\
    \ is used to define a default, and how the company deals with defaults. All these\
    \ policies should be considered when developing data analyses and training analytical\
    \ models. \n\nThe data associated with this problem most likely sit in different\
    \ transactional systems with distinct infrastructures. Data scientists need to\
    \ work with data engineers, software developers, and informational technology\
    \ operation personnel to gather all the data sources in an effective way. Once\
    \ the model is done and deployment is required, data scientists need to work with\
    \ application developers to make the model’s outcomes available to the organization\
    \ in the way it is expected. The combination of all these skills creates an effective\
    \ analytical framework to approach business problems in terms of data analysis,\
    \ model development, and model deployment.\n\n## Communication and Visualization\n\
    \nOne more key skill is essential to analyze and disseminate the results achieved\
    \ by data science. At the end of the process, data scientists need to communicate\
    \ the results. This communication can involve visualizations to explain and interpret\
    \ the models. A picture is worth a thousand words. Results can be used to create\
    \ marketing campaigns, offer insights into customer behavior, lead to business\
    \ decisions and actions, improve processes, avoid fraud, and reduce risk, among\
    \ many others.\n\nOnce the model’s results are created, data scientists communicate\
    \ how the results can be used to improve the operational process with the business\
    \ side of the company. It is important to provide insights to the decision makers\
    \ so that they can better address the business problems for which the model was\
    \ developed. Every piece of the model’s results needs to be assigned to a possible\
    \ business action. Business departments must understand possible solutions in\
    \ terms of the model’s outcomes and data scientists can fill that gap.\n\nData\
    \ scientists use visual presentation expertise and story-telling capabilities\
    \ to create an exciting and appealing story about how the model’s results can\
    \ be applied to business problems. Data analysis and data visualization sometime\
    \ suffice. Analyzing the data can help data scientists to understand the problem\
    \ and the possible solutions but also help to drive straightforward solutions\
    \ with dashboards and advanced reports. In telecommunications, for example, a\
    \ drop in services consumption can be associated with an engineering problem rather\
    \ than a churn behavior. In this case, a deep data analysis can drive the solution\
    \ rather than a model development to predict churn. This could be a very isolated\
    \ problem that does not demand a model but instead a very specific business action.\n\
    \n## Hard and Soft Skills\n\nHard skills include mathematics, statistics, computer\
    \ science, data analysis, programming, etc. On the other side, there are a lot\
    \ of soft skills essential to performing data science tasks such as problem-solving,\
    \ communication, curiosity, innovation, storytelling, and so on. It is very hard\
    \ to find people with both skill sets. Many job search sites point out that there\
    \ is a reasonable increase in demand for data scientists every year. With substantial\
    \ inexpensive data storage and increasingly stronger computational power, data\
    \ scientists have more capacity to fit models that influence business decisions\
    \ and change the course of tactical and strategical actions. As companies become\
    \ more data driven, data scientists become more valuable. There is a clear trend\
    \ that every piece of the business is becoming driven by data analysis and analytical\
    \ models.\n\nTo be effective and valuable in this new evolving scenario, data\
    \ scientists must have both hard and soft skills. Again, it is quite difficult\
    \ to find professionals with both hard and soft skills, so collaboration as a\
    \ team is a very tangible solution. It is critical that data scientists partner\
    \ with business departments to combine hard and soft skills in seeking the best\
    \ analytical solution possible.\n\nFor example, in fraud detection, it is almost\
    \ mandatory that data scientists collaborate with the fraud analysts and investigators\
    \ to get their perspective and knowledge in business scenarios where fraud is\
    \ most prevalent. In this way, they can derive analytical solutions that address\
    \ feasible solutions in production, usually in a transactional and near real-time\
    \ perspective.\n\n## Data Science Applications\n\nIt is difficult to imagine a\
    \ company or even a segment of industry that cannot benefit from data science\
    \ and advanced analytics. Today’s market demands that all companies, private or\
    \ public, be more efficient and accurate in their tactical and operational actions.\
    \ Analytics can help organizations drive business actions based on data facts,\
    \ instead of guesses, as shown in [Figure 1.2.](#Chapter01.xhtml#ch01fig2).\n\n\
    Another key factor in data science is that all the techniques data scientists\
    \ use in one industry can be easily applied to another. Business problems, even\
    \ in different industries, can be remarkably similar. Insolvency is a problem\
    \ in many industries: telecommunications, banking, and retail, for example. The\
    \ way banks handle insolvency can help retail and telecom companies improve their\
    \ process and be more effective in their business. How telecommunications companies\
    \ handle transactional fraud can help banks improve their process to detect and\
    \ react to fraudulent transactions in credit card accounts. Data analysis and\
    \ analytical insights need to replace guessing and assumptions about market, customers,\
    \ and business scenarios.\n\nFigure 1.2: Industries That Can Benefit from Data\
    \ Science Projects\n\n![image](Images/f0007-01.jpg)\n\nCollaboration among data\
    \ scientists working in different industries is valuable and increases the spectrum\
    \ of viable solutions. Industries can learn from each other and improve their\
    \ process to identify possible analytical solutions and deploy practical business\
    \ actions. This knowledge transferring from different domain areas, even between\
    \ distinct industries, is beneficial for all sides involved. Several current business\
    \ issues include fraud detection, churn analysis, bad debt, loss estimation, cross-sell/up-sell,\
    \ risk analysis, segmentation, collecting, optimization, forecasting, supply chain,\
    \ and anomaly detection, among many others.\n\n## Data Science Lifecycle and the\
    \ Maturity Framework\n\nThe analytical lifecycle, or the data science process\
    \ flow, comprises a few steps. However, it is important to spend some time on\
    \ them and make sure all of them are performed properly.\n\n### Understand the\
    \ Question\n\nThe first step in the modeling process as shown in [Figure 1.3.](#Chapter01.xhtml#ch01fig3)\
    \ is to understand the question. Data scientists need to understand what they\
    \ are trying to solve with the model that they are about to develop. To perform\
    \ this step, work closely with the business department to verify if a model is\
    \ appropriate, if it is feasible, if there is enough data to use, and what practical\
    \ actions are planned to be deployed based on the model’s outcomes.\n\nFigure\
    \ 1.3: Data Science Projects Lifecycle\n\n![image](Images/f0008-01.jpg)\n\nSome\
    \ of the questions to ask during this phase are:\n\n* What is the goal of the\
    \ project? Do we want to predict some future event or classify, estimate, or forecast?\
    \ Do we want to optimize a specific process or generate insights about customer\
    \ behavior? Do we want to create groups or segments or produce a path analysis,\
    \ sequence analysis, network analysis, and so on?\n"
