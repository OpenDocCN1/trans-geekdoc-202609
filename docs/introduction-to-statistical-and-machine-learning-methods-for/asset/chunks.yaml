  raw: '*   What is the specific objective of the model? Is it a supervised or unsupervised
    model? Is the data structured or unstructured?


    *   Is there enough data to address this problem?


    *   What actions are planned based on the model’s outcomes?


    For example, in a churn model, you need to produce an actionable definition of
    churn. Is the model a classification (yes or no), and can a campaign be triggered
    based on the likelihood of churn? Multiple approaches or customer offerings can
    be assigned to the probability of customer churn. The response can be captured
    to produce feedback to the model and to improve the performance in subsequent
    actions.


    Collect the Data


    The second step in the data science process flow is to collect the data. Most
    likely, this phase requires multiple people and different skills. Database management,
    repositories, programming, data quality packages, data integration, and many other
    technologies might be required to accomplish this step properly.


    Some of the pertinent questions during this phase are:


    *   What data is relevant?


    *   How many data sources are involved?


    *   Where do the data sources reside?


    *   Is the access to the data readily available?


    *   Are there any privacy issues?


    *   Are the data available when the model is deployed in production?


    For example, some variables, such as gender and income, might not be available
    to use even though those predictors might be associated with the outcome. Furthermore,
    even if the data are available when you develop the model, are the data available
    when the model is in production, such as scoring a business transaction for fraud?
    Is it possible to access all the data used during the model training when the
    model is used for scoring? Are there any data privacy regulations? This is a problem
    because scored observations with missing values for the predictor variables in
    the scoring model have missing predicted outcomes.


    Explore the Data


    The third step is to explore the data and evaluate the quality and appropriateness
    of the information available. This step involves a lot of work with the data.
    Data analysis, cardinality analysis, data distribution, multivariate analysis,
    and some data quality analyses–all these tasks are important to verify if all
    the data needed to develop the model are available, and if they are available
    in the correct format. For example, in data warehouses, data marts, or data lakes,
    customer data is stored in multiple occurrences over time, which means that there
    are multiple records of the same customers in the data set. For analytical models,
    each customer must be a unique observation in the data set. Therefore, all historical
    information should be transposed from rows to columns in the analytical table.


    Some of the questions for this phase are:


    *   What anomalies or patterns are noticeable in the data sets?


    *   Are there too many variables to create the model?


    *   Are there too few variables to create the model?


    *   Are data transformations required to adjust the input data for the model training,
    like imputation, replacement, transformation, and so on?


    *   Are tasks assigned to create new inputs?


    *   Are tasks assigned to reduce the number of inputs?


    In some projects, data scientists might have thousands of input variables, which
    is far too many to model in an appropriate way. A variable selection approach
    should be used to select the relevant features. When there are too few variables
    to create the model, the data scientist needs to create model predictors from
    the original input set. Data scientists might also have several input variables
    with missing values that need to be replaced with reasonable values. Some models
    require this step, some do not. But even the models that do not require this step
    might benefit from an imputation process. Sometimes an important input is skewed,
    and the distribution needs to be adjusted. All these steps can affect the model’s
    performance and accuracy at the end of the process.


    Model the Data


    The fourth step is the analytical model development itself. Some say that this
    is the most important part, or at least, where data scientists have more fun.
    Here they will use their creativity and innovation skills to try out multiple
    analytical approaches to solve the business problem. As stated before, data science
    is a mix of science and art. This step is the time when data scientists apply
    both the science behind all algorithms and the art behind all analytical approaches.


    Some questions to consider at this phase are:


    *   Which model had the highest predictive accuracy?


    *   Which model best generalizes to new data?


    *   Is it possible to validate the model? Is it possible to test the model? Is
    it possible to honestly test the models on new data?


    *   Which model is the most interpretable?


    *   Which model best explains the correlation between the input variables and
    the target? Which one best describes the effects of the predictors to the estimation?


    *   Which model best addresses the business goal?


    This is the data scientists’ playground, where they use different algorithms,
    techniques, and distinct analytical approaches! Yes, a lot of the modeling process
    involves simply trying new algorithms and evaluating the results. Data science
    differs from some exact sciences, like math and physics, where based on a robust
    equation and inputs, it is possible to predict the output. In data science, the
    set of inputs might be known, but the exact subset of predictors is still unknown
    until the end of the model training. The equation is created during the model
    training according to the input data. Then the results are revealed. Any change
    in the input data set implies a change in the output. Therefore, data science
    is very much tied to the statistical and mathematical algorithms. However, all
    the rest is art. Furthermore, many models are not robust as they should be. Some
    models or algorithms are very unstable, which means every training data set might
    represent a different result.


    Maybe this is the fun part. In this phase, data scientists try to fit the model
    on a portion of the data and evaluate the model’s performance on another part
    of the data. The first portion is the training set. The second one is the validation
    set. Sometimes there is a third portion called the test set. It should be noted
    that sometimes the best model, depending on the business goal, is the most interpretable
    and simplest model, rather than the one with the highest predictive accuracy.
    It depends on the business goal, the practical action, and if there is any regulation
    in the industry.


    In summary, this fourth step includes the following tasks:


    *   Train different models (algorithms/techniques/analytical approaches).


    *   Validate all trained models based on a different data set.


    *   If possible, test all models trained on a different data set (different from
    the one used during the validation).


    *   Assess all models’ outcomes and evaluate the results based on the business
    goals.


    *   Select the best model based on the business requirements.


    *   Deploy and score the best model to support the business action required.


    Perhaps one of the most difficult phases of the analytical process is to analyze
    the results and evaluate how the model’s outcomes can support the business action
    required. This step is somehow related to the previous one, when data scientists
    train multiple models and assess the results. At this phase, domain knowledge
    and communication skills play a key role.


    Provide an Answer


    The fifth and last step is to provide answers to the original questions, the ones
    raised and validated during the first step. Some pertinent questions are:


    *   What lessons were learned from the trained models?


    *   How do the trained models answer the original questions?


    *   How do the trained models tell a story and support business decisions?'
