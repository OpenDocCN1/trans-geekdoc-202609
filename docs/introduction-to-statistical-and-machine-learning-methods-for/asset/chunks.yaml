    Although it is usually assumed that clustering produces interpretable results,
    this is not always the case. The clustering algorithms might produce uninterpretable
    results. The interpretation is user defined.


    The decision about which variables to use for clustering is a crucial decision
    that will have a significant impact on the clustering solution. A poor choice
    of variables leads to an uninterpretable cluster profile.


    ## Summary


    This chapter covered a common analytical approach in data science – clustering.
    The most popular methods, hierarchical, `k-means`, and `self-organizing maps`,
    were introduced along with business cases as examples. Unsupervised models consist
    of a very particular approach in data science, especially because they are a type
    of model where a target is not present. It makes it hard to evaluate the model
    results in terms of accuracy and in terms of applicability. However, unsupervised
    models are quite common in data science as an analytical solution to business
    problems. They are easy to understand and easily translated into business rules.


    The main goal of unsupervised models is to search for insights and to highlight
    the main characteristics in a data set, grouping similar observations into the
    same clusters. Clustering models are frequently one of the first analytical approaches
    developed by data scientists when looking at customer behavior, product and services
    consumption, and any type of data set segmentation. It might be used as a method
    to homogenize a data set before training a supervised model. For example, cluster
    diverse types of churn and then train one supervised model for each cluster. This
    approach ends up with better overall accuracy than a single model fit on the entire
    data set.


    The next chapters will continue to explore unsupervised models, focusing on association
    rules, link analysis, path analysis, network analysis, and text mining.


    ## Additional Reading


    1. Collica R.S. 2017. Customer Segmentation and Clustering Using SAS Enterprise
    Miner, Third Edition. Cary, NC: SAS Institute Inc.

    2. SAS Institute Inc. 2017. SAS Enterprise Miner 14.3. Cary, NC: SAS Institute
    Inc.


    ## Chapter 7: Unsupervised Models—Semi Structured Data


    ### Chapter Overview


    In this chapter, we continue to learn about unsupervised models, which are models
    without a target. This type of model aims to better understand patterns in data
    and to raise insights about it. It is used to highlight customer behavior, patterns
    of transactions or relationships, and associations between items. It is quite
    often applied to structured data, like transactions, and unstructured data, like
    text data.


    In this chapter, we will learn specifically about association rules analysis,
    a method assigned to market basket analysis applications. We will also learn about
    path analysis, a method to understand events that take place along steps or sequence
    of steps in a timeline, and link analysis, a method to understand how events are
    correlated to each other regardless of a timeline. Finally, we will learn about
    text analytics, a technique to analyze texts and to extract insights and knowledge
    from it.


    The main goals of this chapter are the following:


    * Explain and apply association rules analysis to create market basket analysis.

    * Explain and apply path analysis to solve business problems from a timeline perspective.

    * Explain and apply link analysis to solve business problems where events might
    be associated to each other.

    * Explain and apply text mining models to solve business problems where unstructured
    text data is available.

    * Describe an unsupervised model like an association rules model.

    * Interpret the results of various unsupervised models.


    ### Association Rules Analysis


    Association rules analysis is a method to discover events, elements, or items
    that occur together in a data set. If timestamp information is available, the
    association rules analysis turns into a sequence association analysis, where the
    sequence of the events taking place is relevant. Association rules analysis or
    sequence association rules analysis aims to find interesting relationships between
    items in a database. These relationships are described as implication rules or
    items that imply other items. For example, in a point-of-sale system for a supermarket,
    association rules analysis might discover an implication rule like `{wine, cheese
    => bread}`. This rule implies that a customer purchases wine, cheese, and bread
    together, or more specifically, if a customer purchases wine and cheese, they
    also purchase bread. Because the association rules analysis method does not consider
    the time, the rules discovered are symmetric, which means that wine and cheese
    implies bread and bread implies wine and cheese. The data scientist needs to analyze
    all these rules to identify the ones that make the most sense to be used to boost
    sales. There are some statistical metrics that can be used to evaluate the importance
    of the rules, and the data scientist should use them in conjunction with business
    knowledge.


    #### Market Basket Analysis


    Association rules analysis is often applied in projects assigned to market basket
    analysis. Market basket analysis is used to analyze streams of transactional data
    for the combinations of items that occur more commonly than expected. Data scientists
    can use this as a technique to identify interesting combinations of items purchased
    and use these rules to boost sales. Items in the same rule are more likely to
    be purchased together and might be offered in conjunction during a campaign or
    be placed together in a supermarket.


    Market basket analysis is applied in many industries for multiple business problems.
    Some combinations of items might be very intuitive. For example, customers who
    purchase bread also purchase butter. Some rules might be less intuitive and be
    used to boost sales. For example, customers who purchase data packages in mobile
    devices also consume streaming content on demand.


    Sequence analysis is an extension of the association rules analysis where a time
    dimension is available in the transactional data. In this way, transactional data
    is examined for sequences of items that occur more commonly than expected. In
    the sequence analysis, the order of the events is quite important. The sequence
    of items purchased by customers in a specific time frame is an example. Data scientists
    can use sequence analysis to identify patterns of purchase in a timeline. Items
    within a sequence rule are purchased in an order and can be offered together or
    in a specific sequence during a sales campaign. Sequence analysis can also reveal
    problems in transactions occurring in a timeline. Steps performed by fraudsters
    in cyber-attacks or problems experienced by users when browsing a website is an
    example. Sequence analysis is discussed in more detail in the next section.


    #### Confidence and Support Measures


    In the simplest association rules analysis situation, the data consists of two
    variables: a transaction and an item. For each transaction, there is a list of
    items. Typically, a transaction is a single customer purchase, and the items are
    the things that were bought. An association rule is a statement of the form `(item
    set A) => (item set B)`. In other words, an association rule is a pattern that
    states when A occurs, B occurs with a specific probability.


    The aim of the association analysis is to determine the strength of all association
    rules among a set of items. The strength of the association is measured by the
    support and confidence of the rule. The support for the rule `A =>B` is the probability
    that the two items occur together. The support of the rule `A => B` is estimated
    by the following equation:


    $\frac{transactions\ containing\ A\ and\ B}{all\ transactions}$

