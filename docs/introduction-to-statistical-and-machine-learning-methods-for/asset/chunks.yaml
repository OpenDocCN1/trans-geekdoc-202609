    # Chapter 5: Advanced Topics in Supervised Models


    ## Overview


    In this chapter, you will learn about advanced topics in machine learning. This
    chapter focuses on machine learning models like support vector machines and factorization
    machines, as well as ensemble models and two-stage models.


    The main goals of this chapter are:


    * Describe how machine learning and artificial intelligence relate to the field
    of data science.

    * Identify situations that could benefit from using machine learning supervised
    models such as support vector machines and factorization machines.

    * Describe different types of supervised models that rely on machine learning
    and artificial intelligence and the circumstances under which they might be used.

    * Describe different types of advanced methods to develop supervised models based
    on ensembles and two-stage models.

    * Understand when to use advanced methods of machine learning models like ensemble
    models and two-stage models to solve business problems.

    * Interpret the results of advanced supervised models that rely on machine learning
    and artificial intelligence like support vector machines and factorization machines.

    * Interpret the results of advanced methods of supervised models like ensemble
    models and two-stage models in solving real-world problems.


    ## Advanced Machine Learning Models and Methods


    [Chapter5](#Chapter05.xhtml#ch05) covers two advanced machine learning models
    and two advanced methods to train supervised models. The machine learning models
    that we will discuss are:


    * Support Vector Machines: this model implemented in SAS can currently handle
    binary and continuous targets.

    * Factorization Machines: this model is an extension of the linear model and it
    can handle continuous targets.


    The advanced methods that we will discuss are:


    * Ensemble Models: this model combines several models to predict the target value.
    The target can be continuous or discrete.

    * Two-Stage Models: this model allows the modeling of a discrete and a continuous
    target. The model first predicts the binary response and if the prediction is
    1, then the model predicts the continuous response.


    ### Support Vector Machines


    Support vector machines are one of the newest machine learning models presented
    to solve real-world problems. `SVM` was created in the 90s, and it is a robust
    model to classify categorical or continuous targets. Like neural networks, these
    models tend to be black boxes, but they are very flexible. Support vector machines
    automatically discover any relationship between the input variables and the target.
    Data scientists do not need to specify the functional form, or the relationship
    between the inputs and the target before fitting the model.

