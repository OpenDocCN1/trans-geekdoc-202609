    ## 两阶段模型


    两阶段模型允许数据科学家对一个分类目标进行建模，然后使用预测概率或决策来划分观测值，并将其输入到另一个模型中，通常用于训练一个具有连续目标的模型。这两个模型可以使用不同的算法和不同的预测变量。因此，第一个模型对二分类目标进行分类。根据第一个模型的决策（`0`
    或 `1`），训练另一个模型来估计一个连续值（仅针对 `1` 的决策）。一个很好的例子是对不可管理债务的概率进行建模，如果预测类别为 `1`，则对不可管理债务的金额进行建模。


    两阶段模型为数据科学家提供了事件概率和预测金额。例如，如果数据科学家正在对欺诈事件建模，他们可以在第一个模型中获取交易欺诈的概率，然后对于所有被分类为欺诈的交易，他们可以在第二个模型中估计交易涉及的欺诈金额。这两条信息可以确定欺诈金额，而不仅仅是欺诈事件的概率。


    如果模型的第一阶段准确估计了预测概率，那么第二阶段预测金额的准确性可能会提高。例如，在两阶段违约模型中，违约概率预测的准确性能提高违约金额预测的准确性。


    数据科学家需要注意两阶段模型使用的模型，因为任何一个阶段的模型定义不良都会影响预测的准确性，从而影响估计结果。这两个目标还需要具有相关性，否则两个独立模型就足够了。


    ## 用例：防流失


    两阶段模型的一个良好业务案例是与客户流失相关的问题。当客户拨打公司呼叫中心进行投诉时，可以建立一个预测模型来预测如果公司不纠投诉，客户将做什么。例如，如果客户觉得他们被收了过费用，如果投诉未得到解决，客户会去消费者保护机构、监管机构，还是直接起诉？这些每一个管辖区对公司来说都有其自身的成本，如图
    5.9。如果问题可以在呼叫中心层面解决，对公司来说成本更低。如果问题到达消费者保护机构，公司的成本更高。如果问题到达监管机构，成本可能会更高，因为可能会增加一些罚款。然而，如果问题进入法庭，公司的成本将是巨大的，因为除了罚款外，可能涉及一些民事赔偿。


