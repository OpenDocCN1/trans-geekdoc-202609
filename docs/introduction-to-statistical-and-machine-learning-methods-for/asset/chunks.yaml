    当数据科学家将模型性能与随机事件进行比较时，他们可以观察模型的表现如何。例如，在图 9.8 中，根据事件的预测概率对人群进行排序（或者在本例中，针对购买销售活动期间提供的产品），我们可以观察到，在人群的前
    5% 中，响应率达到了 21%。从模型性能角度进行简单比较如下：如果没有模型，销售活动将随机选择 5% 的人群来提供特定产品。这 5% 的人群可能是基于有限的预算来开展活动。根据该活动的平均响应率，公司可以预期响应率为
    5%。换句话说，所联系的客户中仅有 5% 会购买所提供的产品。通过使用监督分类模型并仅联系总人口的 5%，同样的活动将针对预测概率最高的前 5% 的客户，或更有可能购买该产品的客户进行目标定位。通过使用模型，公司将观察到
    21% 的响应率，即收到优惠的受访客户中有 21% 会购买该产品。


    数据科学家可以证明该模型比随机事件好四倍。换句话说，监督分类模型可以将该销售活动的响应率提高四倍。


    图 9.7：百分比累计命中率 – 随机事件


    ![image](img/f0144-01.jpg)


    图 9.8：百分比累计命中率 - 模型与随机事件


    ![image](img/f0145-01.jpg)


    ### 提升图 (Lift Chart)


    提升（Lift）的计算方法是正预测值与整体响应率的比率。因此，对于给定的深度，模型目标的响应人数比随机机会多。图显示，在第五百分位处，提升值为 4.2（使用模型的
    21% 响应者除以不使用模型的 5% 响应者）（随机事件）。


    图 9.9：提升图


    ![image](img/f0145-02.jpg)


    提升图广泛应用于数据库营销，以决定公司在活动中应覆盖人群的深度。构建提升曲线最简单的方法是对预测的后验概率进行排序和分箱。提升图还可以增加收入和成本信息。


    提升图还可以用于评估和选择用于支持特定活动的模型。例如，如果一家公司对销售活动的预算有限，只能联系总人口的 20%，那么数据科学家可以根据目标（购买产品）的预测概率，选择在人群前
    20% 表现最好的模型，而不是选择考虑整个人群时表现最好的模型。


    ### 模型评估


    建议数据科学家尝试多个模型，并考虑不同的方法和独特的算法。所有技术都取决于数据，因此尝试不同的技术、多种建模方法和数据准备方法总是有帮助的。根据数据的变异性和输入变量与目标之间的关系，回归可能比神经网络更拟合。通常，如果输入与目标之间的关系简单，回归模型、决策树和支持向量机就可以很好地拟合，并最终成为最佳模型。在这种情况下，如果可以使用像回归模型和决策树这样简单且可解释的模型，就没有理由使用像神经网络或像森林、梯度提升等集成模型这样的复杂模型。然而，当输入与目标之间的关系复杂时，神经网络和树集成等更复杂的模型通常拟合更好。缺点是缺乏可解释性。


    ### 性能


    数据科学家总是根据多个维度对模型进行评估，以选择并将其投入生产。第一个维度是性能。性能可以使用不同的拟合统计量来衡量，它取决于目标的类型。目标可能是一个类别，这意味着决策、排序或估计。这些类型的每个目标都可以通过不同的拟合统计量进行评估。


    数据科学家可以与业务部门合作，了解哪些拟合统计量对业务最相关。例如，最重要的拟合统计量可能是总体准确率。在这种情况下，数据科学家可以选择误分类误差最少的模型。业务事件可能极其敏感，例如欺诈，假阳性（false-positive）可能会给业务带来巨大风险。数据科学家随后可以根据最小假阳性率评估最佳模型。其他一些业务事件（如流失）可能会受到假阴性率的影响，后者会漏掉可能发生流失的客户。最后，可以通过查看模型在人群特定百分位上的准确率来评估模型。营销活动可能只针对人群的一小部分。数据科学家可以根据模型仅在与活动相关的顶部百分位上的表现来评估冠军模型（champion
    model）。


    ### 模型训练时间


    数据科学家可用于评估模型的第二个维度是模型训练时间。例如，在欺诈检测中，模型可能会早期漂移，应该频繁地训练或重新训练。基于此，模型训练时间至关重要。在信贷风险中，模型需要在客户申请贷款时进行实时评分。在某些项目中，评分应嵌入到事务系统中。模型应转换为一组规则或一个方程。决策树和回归模型是此类转换的良好候选者。有时，模型评分作为应用程序编程接口
    (`API`) 被另一个应用程序调用。被选为冠军的模型应该提供这种访问方式。所有这些类型的评估远超模型的准确率。


    ### 可解释性


    可解释性对于某些业务事件也是一个至关重要的指标。特别是在信贷评分中，公司可能被要求对模型结果提供解释，例如拒绝贷款的原因。对于这些情况，可解释性是评估将投入生产的冠军模型的关键指标。


    ### 泛化性


    泛化性对于评估将部署的模型也非常重要。基于此，可以根据诚实测试（honest test）、跨时间数据集对候选模型进行评估。有时数据科学家需要根据上述特征的组合来评估最佳模型。


    ### 模型部署


    分析生命周期包括模型开发（包括训练多个不同的模型）、模型比较（考虑根据业务需求评估不同的模型）、模型选择（考虑业务需求——速度、解释性等）以及模型部署（考虑如何将模型投入生产——批处理、实时、`API`
    等）。


    图 9.10：分析模型生命周期


    ![image](img/f0147-01.jpg)


    ### 挑战模型

