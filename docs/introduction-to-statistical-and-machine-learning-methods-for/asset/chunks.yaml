    链接分析的好处之一是可以产生可视化的输出结果。这些可视化输出通常非常直观，且极于理解。数据科学家可以轻松识别与业务事件相关的客户行为，并在大型交易数据集中发现欺诈活动。


    图 7.4 显示了一个由节点（圆圈）和链接（圆之间的连接）表示的网络。节点可以代表手机，链接可以代表通话。节点的大小变化可以代表 ARPU（每用户平均收入）。节点的不同颜色深浅可以代表网络中不同的社区（即根据手机相互通话的频率和时长将手机分组在一起的方式）。


    尽管链接分析可以用于大型数据集，但当网络不是太大时，其结果的可视化效果更好。通常会从输出中过滤掉不感兴趣的交易和关系，以便数据科学家能够关注与特定业务目的相关的关联。通过这种方式，链接分析的结果在交易或关系有限的情况下效果最好。当交易非常多时，其可视化效果开始恶化，因为图变得过于拥挤，导致视觉分析变得更难以解释。


    ### 图 7.4：链接分析


    ![image](img/f0109-01.jpg)


    ### 用例：产品关系


    链接分析广泛应用于零售和通信行业。核心变量是客户识别码和购买的物品。与关联规则分析不同，链接分析中的交易不需要在同一个数据集中，也不需要在同一个交易标识下。交易甚至不需要在同一时间范围内。客户与所购物品之间的任何关系都可以用于创建网络，以描述客户与产品之间的关系。


    数据科学家可以选择查看哪些客户购买了特定的产品和服务，或者某个特定客户购买了哪些产品和服务。例如，考虑流媒体电视服务的内容。根据哪些客户看了哪些电影的交易记录，可以很容易创建一个电影和客户组成的网络。另一个重要的网络是基于共同客户的电影关系。例如，客户
    A、B 和 C 看了电影 1 和 2。那么电影 1 和 2 之间存在一个强度为 3 的关系（有 3 个客户看了）。客户 D 和 E 看了电影 3 和 4。那么电影
    3 和 4 之间存在一个强度为 2 的关系。考虑到电影和客户的大数据集，可以创建一个巨大的网络。然而，即使在大型网络中，突出共同客户观看的电影之间的强关系也会更容易，然后利用这些强关系向客户推荐新电影。


    ### 路径分析


    路径分析评估了给定用户或实体在特定时间范围内执行的一系列连续事件。这与 Sewall Wright 在 1921 年开发的统计“路径分析”不同，后者是结构方程模型的前身。它是理解用户行为的一种方式，以获得考虑时间事件的数据获得可操作的洞察。例如，在在线零售行业，路径分析可以是一项关键的数据科学技术，用于理解消费者随时间推移的购买行为。如果零售商在线销售产品，该公司希望尽可能地将访问者转化为完成购买。数据科学家可以使用路径分析来确定网站的哪些特征鼓励客户导航到结账。他们还可以寻找导航过程中与网站路径或特征相关的流量的大幅跌落。


    ### 图 7.5：路径分析


    ![image](img/f0111-01.jpg)


    路径分析描述了客户随时间消费的内容。例如，在图 7.5 中，大多数客户首先购买设备，然后获取互联网连接，接着是多个网络设备（例如在家里创建一个网状网络），然后是在线内容、流媒体服务包等等。这种分析允许公司预测客户需求并提高销量。


    然而，正如链接分析一样，路径分析结果的问题之一是图表无法处理大量的活动。例如，如果数据科学家使用网络日志数据，由于网站的海量流量以及每条记录中存储的信息量，数据集可能是巨大的。缺失
    `Internet Protocol` 地址的记录以及网站内容的更改会导致数据混乱。最后，路径分析并没有解释客户为什么他们所做。在某些分析中，数据科学家可能不感兴趣某些事件为什么发生，而是关心它们何时发生。然而，在其他分析中，事件发生的原因可能很重要，而不仅仅是发生的时间或发生了什么事件。例如，数据科学家可能会看到从产品页面到购买产品页面之间有大量流失，但需要进行更多工作来找出客户为什么不购买产品。


    对于链接分析和路径分析，当涉及大量交易时，可能需要详尽的数据准备过程。例如，当数据科学家调查洗钱活动时，实体数量可能是巨大的，交易数量也是如此。时间范围通常也很长，这意味着需要分析更多的数据。

