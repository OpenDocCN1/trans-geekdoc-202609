    Use Case: Subscription Fraud


    A business problem where decision tree models can be useful is subscription fraud.
    In telecommunications, subscription fraud is when a fraudster uses a stolen or
    a synthetic identity to acquire mobile devices and services with no intention
    to pay. In many countries, telecommunications regulations allow customers to remain
    insolvent for a period without getting their services blocked. This causes major
    financial damages to the companies. Subscription fraud in telecommunications can
    be even worse as the proceeds and services are sometimes used by organized crime
    and terrorist networks. The main goal of the model is to detect subscription fraud
    and to prevent intentional bad debts. Fraud analysts need to be careful when assessing
    the cases to avoid adversely impacting the customer journey for the genuine customers.
    Blocking genuine communication services by mistake is a genuine problem.


    As shown in [Figure 3.3](#Chapter03.xhtml#ch03fig3), a usual framework involving
    fraud – either subscription fraud or usage fraud – consists of a customer relationship
    management (CRM) system to receive customers’ orders. These orders are evaluated
    by a credit system (it can be accomplished using a credit bureau). In parallel,
    these orders can also be analyzed by a subscription fraud system, which normally
    receives information about past customers’ transactions. For example, in telecommunications,
    all raw transactions (calls or even calls attempted) are fetched by the collection
    systems. This system sends all transactions to a mediation system to aggregate
    all information and filter the billable transactions. These billable transactions
    are sent to the billing systems, which process the bills and charge the customers.
    All this information, in different levels, are used to evaluate and detect subscription
    and usage fraud. Historical customer information and transaction information are
    gathered in the data warehouse, which provides the data needed by the data mining
    tool, environment, or system to train, evaluate, and deploy the predictive models.


    Figure 3.3: Systems Framework Involved in Fraudulent Events


    ![image](Images/f0048-01.jpg)


    When a service order is placed in the call center (CRM), the service representative
    must decide in a matter of seconds whether the request is a fraudulent event or
    a genuine request. This can be accomplished using decision tree models that recognize
    patterns associated with subscription fraud. Some of the information used could
    include stolen identities, fake addresses, specific payment methods, and known
    blocked lists. The models are used to compute the probability of subscription
    fraud, and these scores are relayed to the service representative. With this information,
    the service representative can decide whether this is subscription fraud or a
    genuine customer. As the decision tree models are fit because of a set of rules
    based on thresholds, some of the rules that are the most correlated to the subscription
    fraud can be communicated to the representative when evaluating the case. The
    list of rules generated by the decision tree is especially useful to the service
    representative during the customer call but also to the team of fraud analysts
    when analyzing the cases afterward. Some of the high probability subscription
    fraud cases might go through during the customer service call, but fraud analysts
    can evaluate cases afterward to decide what actions to take on some of the orders.


    Figure 3.4: Information Flow in Fraudulent Events


    ![image](Images/f0048-02.jpg)


    Summary


    This chapter introduced the fundamental concepts of supervised modeling. Supervised
    learning models consider observations where the target is known. Based on the
    known events, a model is trained to capture the relationship between the inputs
    and the known target. The statistical models described in this chapter were linear
    and logistic regression models and decision trees.


    Chapter 4: Supervised Models – Machine Learning Approach


    Chapter Overview


    In this chapter you will learn about supervised machine learning models. [Chapter
    3](#Chapter03.xhtml#ch03) covered supervised statistical models such as linear
    regression, logistic regression, and decision trees. [Chapter 4](#Chapter04.xhtml#ch04)
    covers machine learning models including random forests, gradient boosting models,
    and artificial neural networks.


    The main goals of this chapter are:'
