    # 图 2.3：分分


    ![image](img/f0025-01.jpg)


    ## 填补


    大多数建模方法中处理缺失值的标准方法是完全案例分析（complete-case analysis），即只有那些没有任何缺失值的观测值才会被用于训练过程。这意味着用于训练模型的任何输入变量中具有缺失值的观测值都会从训练过程中排除。问题在于，在高维数据中，即使是少量的缺失值也会导致巨大的数据损失。想象一个包含
    300 个变量的输入数据集。如果某个客户在这些 300 个变量中的任何一个上有缺失值，他或她就会从训练数据集中剔除。由于缺失值导致训练数据减少是一个问题，另一个问题是在未来数据中某些值缺失时如何对模型进行评分。想象生产环境中的预测模型正在对可能流失的客户进行评分。输入变量之一是`age`。在未来数据中，如果被评分的客户没有年龄值，模型无法对该客户进行评分。例如，在`logistic
    regression` 中，模型无法将系数乘以缺失值。当数据科学家对新客户进行评分时，具有缺失值的客户将获得缺失的预测分（例如发生事件的概率）。换句话说，数据科学家无法对预测变量中具有缺失值的客户生成预测。因此，某种类型的缺失值填补是必要的。


    填补是避免在训练、验证、测试和部署过程中使用的观测值中出现缺失值的常用过程。填补意味着用合理的值填充缺失值。目前已经开发了许多填补缺失值的方法，例如`mean`、`median`、`mode`
    和`midrange` 填补。这些值基于预测变量的分布。


    ## 图 2.4：缺失值与填补


    ![image](img/f0026-01.jpg)


    例如，回想之前提到的训练数据集中`age`缺失的客户案例。使用考虑训练数据集中所有客户的`age`平均值来填充该客户的值。数据科学家还可以创建缺失指示变量（missing
    indicator variables），即二元变量，用于指示该观测值的预测变量值是缺失还是已知的。这些变量可以捕捉响应变量与预测变量缺失性之间的关系。例如，收入缺失的客户可能与欺诈交易有很强的关联。如果缺失值的百分比非常高，则可能通过从分析中剔除该变量并仅使用缺失指示变量来更好地处理该预测变量。


    ## 图 2.5：填补与缺失值指示


    ![image](img/f0026-02.jpg)


    还有其他方法可以处理缺失值，例如将变量分箱（`binning`）为组，并让一组代表所有缺失值。此时预测变量在分析中被视为分类变量。另一种非常高效的方法（可能是处理缺失值最准确的方法）是根据其他输入值来估计缺失值。数据科学家将在估计目标之前，使用另一个预测模型来估计缺失值。例如，想象数据集中两个客户的`salary`缺失。通过`mean`
    填补会为这两个客户添加相同的工资。然而，假设第一个客户 50 岁，公司经理，拥有一栋价值约 100 万美元的房屋。第二个客户 20 岁，还在上，不是房主。这两个客户的工资应该非常不同。然而，通过`mean`
    填补会为他们填充完全相同的值。填补模型（如`decision tree`）可能会为他们中的每一个人填充非常不同的值，因为对缺失工资的估计将基于其余输入变量。


    ## 替换


    在某些情况下，数据具有需要替换的错误值。例如，假设金融机构数据集中的客户必须至少 18 岁。如果数据显示客户小于 18 岁，一种补救方法是将这些值替换为 18。另一种补救方法是将这些值视为缺失，并如填补部分所述，根据数据中其他预测变量的值来填补值。如果一个变量的错误百分比过高，数据科学家可以决定从分析中放弃该变量。


    ## 转换


    输入变量的转换是一项常见的数据准备任务。这些转换可以是提高模型拟合度的合理方法。数据科学家可以进行数学转换来创建一个更对称的分布，从而减少原始变量分布中离群值或重尾的影响。数据科学家还可以标准化变量，使其处于相同的尺度和范围。例如，`age`和`salary`可以处于相同的范围（例如
    0 到 1 的比例），确保它们对模型拟合都有同等的贡献。变量转换还可以帮助模型捕捉输入与目标之间的非线性关系。


    ## 图 2.6：均值填补技术


    ![image](img/f0027-01.jpg)


    ## 图 2.7：替换方法


    ![image](img/f0028-01.jpg)


    另一种转换是对输入变量值进行`bin`处理并将其视为分类变量。这也可以减少离群值的影响，并考虑到目标与输入变量之间的非线性关系。想象一个数据集，大多数客户的工资非常相似，例如都是低工资，有些人是中等工资，极少数是高工资。工资分布在直方图开始有一个巨大的观测值区块，然后是少数向下减少的区块，以及高工资情况的长尾。这样的分布使得模型难以捕捉工资与感兴趣的事件（如坏账）之间的任何相关性。


    `log transformation` 转换或分位数分箱（`quantile binning`）可以更好地将观测值分布到不同的工资范围内，并更容易捕捉转换后的输入变量与目标之间可能的关联，如图
    2.8 所示。


    ## 图 2.8：对数转换方法


    ![image](img/f0028-02.jpg)


    ## 特征提取


    特征提取（也称为特征创建）通过组合原始变量，从初始变量集中创建新变量或特征。这些特征封装了多个原始变量的重要信息。换句话说，特征提取可能会减少输入的维度空间，并为模型创建更具信息的输入。这种新特征比任何其他原始变量都与目标相关。


    在许多情况下，特征提取基于领域知识。例如，如果数据科学家怀疑打呼叫中心的电话次数与流失有关，他们可能会创建此类特征，例如客户在过去六个月内的电话次数，或者电话次数除以所有客户的电话总数。这些派生变量在最终模型中可能是有用的预测因子。


    特征创建可以基于文本分析，将非结构化文本转换为预测变量。主成分分析（PCA）和自动编码器（autoencoder）数据转换也可用于创建新特征。


    ## 主成分分析


