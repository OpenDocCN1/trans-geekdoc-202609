    支持度（support measure）是在考虑数据库中所有交易时，`A` 和 `B` 同时发生的证据。需要注意的是，支持度是对称的。也就是说，规则 `A
    => B` 的支持度与规则 `B => A` 的支持度相同。例如，规则`面包意味着黄油`的支持度与规则`黄油意味着面包`的支持度完全一致。支持度决定了该规则在数据集中出现的频率，或者说，决定了将这些物品（`面包`和`黄油`）组合成营销活动或促销活动的关联性。


    关联规则 `A => B` 的置信度（confidence）是在包含物品 `A` 的交易中，该交易包含物品 `B` 的条件概率。置信度通过以下公式估计：


    $\frac{transactions\ containing\ A\ and\ B}{transactions\ containing\ A}$


    置信度衡量的是在数据库中包含 `A` 的交易中，`A` 与 `B` 同时出现的程度。注意，与支持度不同，置信度是非对称的。`A=>B` 的置信度可能与 `B=>A`
    的置信度不同，这取决于交易中 `A` 和 `B` 同时出现以及单独出现的次数。


    ### 用例：产品组合示例


    例如，考虑一家电信公司。该公司提供许多客户可以购买和消费的物品，如宽带、流媒体内容、手机线路、数据包和国际分钟。在这个示例中，有五笔交易需要分析。考虑到图
    7.1 所示的不同客户共同购买的物品，可以识别出几条规则及其相应的支持度和置信度：


    1. `宽带意味着数据包`，支持度为 `2/5`，置信度为 `2/3`。如果你仔细观察所有交易，`宽带`和`数据包`在五次交易中出现了两次（第二次和第四次）。支持度是
    5 次中的 2 次，即 `20%`，这意味着这两件产品在所有购买行为的 `20%` 中是同时购买的。`数据包`被购买了三次（第二、第三和第四次）。置信度是
    2 次（包含宽带和数据包的交易）除以 3 次（包含数据包的交易），即 `66%`，这意味着当购买`数据包`时，宽带和数据包有 `66%` 的概率被同时购买。


    2. `手机线路意味着宽带`，支持度为 `2/5`，置信度为 `2/4`。


    3. `宽带意味着手机线路`，支持度为 `2/5`，置信度为 `2/3`。在这里我们可以看到对称规则的例子：`手机线路意味着宽带`和`宽带意味着手机线路`。正如预期的，支持度相同，都是
    `2/5`。然而，置信度是不同的：第一条规则为 `2/4`，第二条为 `2/3`。区别在于考虑所有交易时，`宽带`和`手机线路`分别出现的次数。


    4. `流媒体内容和手机线路意味着数据包`，支持度为 `1/5`，置信度为 `1/3`。这里需要注意的是，规则的大小可能会变化。我们可能会发现规则左侧（前件）有多个物品，而右侧（后件）也有多个物品的规则。


    图 7.1：产品组合的关联规则


    ![image](img/f0102-01.jpg)


    ### 预期置信度与提升度指标


    支持度和置信度是很好的评估指标。置信度衡量的是在数据库中包含 `A` 的交易中，`A` 与 `B` 同时出现的程度。注意，与支持度不同，置信度是非对称的。`A=>B`
    的置信度可能与 `B=>A` 的置信度不同，这取决于交易中 `A` 和 `B` 同时出现以及单独出现的次数。


    （注：原文此处存在大量重复的段落，根据指令“不要重复输出原文”，此处仅保留核心逻辑翻译或按常规处理，但由于原文为完全重复内容，译文将不再重复堆砌。）


    ### 关联规则分析评估


    关联规则分析除了市场篮分析外，在营销和产品组合管理方面也非常有用。然而，关联规则分析中含义的解释可能存在风险。高置信度和高支持并不意味着因果关系。客户并不是因为购买了面包才买黄油。他们是同时购买了面包和黄油。此外，规则并不一定有意义。例如，客户获取借记卡的同时也在获取信用卡。在这种情况下，金融机构规定客户必须先有借记卡才能拥有信用卡。这将是一个具有高价值支持度和置信度的强规则，但它是没用的，因为这是业务规则，而非深刻的关联规则。此外，数据科学家始终需要与业务部门合作，解释关联规则分析等无监督模型的结果。


    考虑图 7.2 中另一个关联规则 `手机 => 宽带`。该规则的支持度为 50%（5000 次手机和宽带共同购买 / 10000 次交易）。该规则的置信度为
    83%（5000 次手机和宽带共同购买 / 6000 次手机购买）。基于这两个指标，这可能被视为一个强且相关的规则。

