    如果这两个账户是独立的，预期的置信度为 85%（8,500 次宽带购买 / 10,000 次交易）。提升度（lift）为 `0.83/0.85` 或 `0.98`。由于提升度小于
    1，该关联规则没有用处。这意味着无论客户是否购买了手机线路，他们都会购买宽带。此外，没有手机线的客户更有可能拥有宽带（3,500 次无手机的宽带购买 / 4,000
    次手机购买），其置信度为 87.5%。基于此，手机和宽带之间呈负相关关系，如图图 7.2


    任何数据分析中一个特别为关键的点是，数据的生成并不是为了满足分析目标而产生的。数据的生成是为了满足业务目标的需求。数据科学家必须确定现有的数据是否有能力满足分析目标并实现业务目标。如果极少数交易涉及多个项目，那么量化共同出现项目之间的关系将毫无意义。如果数据库中没有足够的关于项目之间关系的数据（例如，没有足够的篮，或者篮内的物品数量不足），数据科学家将无法发现任何有意义的规则来观察项目何时共同购买，或者观察购买某些项目何时意味着会购买其他项目。因此，数据科学家在尝试进行购物篮分析之前，对数据进行初步检查是非常重要的。通常，在尝试任何分析模型（无论是监督的还是无监督的）之前都需要进行这种初步检查。了解创建模型所需的数据是否可用、符合业务目标以及是否足以对问题进行建模至关重要。


    #### 关联规则分析概述


    关联规则分析的一个优点是易于实施和解释结果。关联规则还可以搜索海量的随机数据数据集，以识别不同类型的模式。这是一种适用于分类数据的理想技术。


    缺点是，许多项目可能会导致极其巨大的规则集，难以理解和管理。可能需要进行一些过滤来生成数量合理的规则。根据指标对规则进行排序也是有用的，例如，根据 `lift`（提升度）和
    `support`（支持度）选择顶层规则。


    问题在于当使用最小支持度来过滤关联规则时。其假设是所有项目的频率相似或性质相同，或者两者兼有。在许多情况下，某些项目在数据中频繁出现，而其他项目很少出现。如果项目的频率差异很大，那么如果最小支持度设置得太高，稀有项目可能会排除在关联规则之外。有时稀有项目是数据库中最价值的项目。另一方面，如果最小支持度设置得太低，发现的关联规则数量可能会变得无法管理。


    最后，如果项目很多，很难确定合适的项目数量。超市和杂货店可能有成千上万种物品。关联规则的数量可能巨大，规则也可能极其复杂。规则指标中的过滤器和数据分类可能有助于搜索项目之间的亲密性模式。


    ### 用例：产品获取


    购物篮分析可用于识别哪些产品和服务是被一起购买的。在建立这些关联规则后，数据科学家可以根据通常一起购买的产品向客户推荐产品和服务。


    例如，电信供应商可以提供一系列产品和服务，如流媒体内容、数据包、固定电话和移动线路、宽带、光纤，以及安全和技术支持等按需服务。该供应商可以通过客户购买历史信息来搜索产品和服务之间的关联：例如他们购买了什么手机和互联网服务，使用了哪些流媒体和数字内容，拥有什么合同，使用了什么支付方式，以及消费了哪些按需服务等。


    生成的关联规则可以识别交叉销售的机会。很多时候，公司通过推荐已购买的相关产品来鼓励客户花费更多，从而实现交叉销售和向上销售。这些推荐可以基于关联规则。例如，购买流媒体内容的客户，基于此关联规则，供应商可以向所有拥有流媒体、月租合同和多线路的客户提供光纤。他们比那些尚未购买这些产品的客户更有可能购买光纤。另一个关联规则可能是购买了宽带、两年合同、技术支持和在线安全的客户。最后，第三条关联规则可能是购买了在线备份的客户也购买了技术支持和流媒体内容。


    正如你注意到的，关联规则的大小可以在两侧变化：左侧（前件）和右侧（后）。规则的左右侧用于识别客户购买和消费产品服务的模式。规则的左侧用于识别哪些客户加入交叉销售和向上销售活动。


    ### 序列分析


    序列分析或序列关联规则分析是关联规则分析或购物篮分析的扩展。这种技术的扩展为分析引入了时间维度。时间的加入限制了可能的关联，因为现在是基于时间顺序的。通过这种方式，对历史交易数据进行检查，找出更常见的项目序列。数据科学家可以使用序列分析来识别购买或消费的模式，甚至可以根据时间检测问题。


    这两种技术（关联分析和序列分析）以及执行这些分析所需数据的一个简单对比是超市。想象你正在一家杂货店购物。你穿过过道，拿起你想要的产品并放入购物篮中。完成后，你来到收银台。你需要从购物篮中取出产品并整理，然后开始扫描。也许在整理时，你会根据类别、重量或冷藏需求等进行分类。你结账离开。杂货店现在知道你购买了什么，并将其与其他客户购买的内容进行匹配。

    '
- fmt: '

    Now suppose that this grocery store also has a website for online shopping. It
    is able to know the exact order the products were selected and put in the virtual
    shopping cart. The timestamp of selecting the products on the website distinguishes
    the order of selection. That makes an enormous difference in some rules. For example,
    based on the data on the physical store, one association rule can be `{wine and
    cheese} implies {bread and crackers}`. However, in association rules, these rules
    are symmetric, so `{bread and crackers} implies {wine and cheese}`. The sequence
    association rule or sequence analysis based on the data from the virtual store
    can define exactly the implication on the rule. If customers often select first
    wine and cheese and then they select bread and crackers, the sequence analysis
    raises the rule `{wine and cheese} implies {bread and crackers}` and not the other
    way around.


    The most important thing in sequence analysis is that the data consists of customer
    transactions over time. Each transaction is an item purchased at a certain time
    associated with a customer. The goal is to extract rules in a proper sequence.
    For example, sequence analysis might show that 60% of customers who first buy
    item `A` also purchase item `B` within three weeks. This information can be used
    in cross-sell and up-sell campaigns. Not just the information about the association,
    `item A` implies `item B`, but also the information about the time frame, `item
    B` is purchased on average three weeks after `item A` is purchased. That information
    can show not just the customers to be targeted and the products to be offered,
    but when the campaign should be launched.


    Sequence analysis has been used extensively in web usage mining for finding navigational
    patterns of users on the website. It has also been applied to finding linguistic
    patterns for opinion mining.


    As observed for the market basket analysis, sequence analysis is easy to implement
    and interpret, and it is ideal for categorical data.


    One of the weaknesses of sequence analysis is also the same as market basket analysis.
    If there are many items to be analyzed, the number of rules can be huge and lead
    to useless rules. Similarly, rare items might be left out if the minimum level
    of support is set too high. It is also difficult to determine the right number
    of items if the number of available items is exceptionally large.


    ## Use Case: Next Best Offer


    Sequence analysis can be used by data scientists to identify what products and
    services are purchased together and in what specific sequence in time. After these
    sequence association rules are established, data scientists can use the results
    to decide what is the next best offer for each customer considering the previous
    purchases.


    For example, a telecommunications provider can offer a set of products and services,
    such as streaming content, data packages, fixed and mobile lines, broadband, fiber,
    and on-demand services like security and tech support. This provider can also
    have a sequence variable in the transaction data that identifies when the product
    or service was purchased. This data can then be used to search for associations
    among products and services through customer purchase history information in a
    timeline.


    The results of the sequence analysis can identify opportunities for the next best
    offer campaigns. The recommendations on the next best offer are based on the sequence
    rules. For example, customers who purchased fiber optic service also purchased
    a streaming movies package on average four weeks later. Based on this sequence
    rule, this provider can offer streaming movies to all customers who have purchased
    fiber optic service in a range of four weeks. These customers are more likely
    to purchase a streaming movie package than the other customers who have not purchased
    fiber optic service. Another sequence rule could be that customers who purchased
    multiple lines also purchased streaming television on average six weeks later.
    Finally, a third sequence rule could be that customers who have purchased device
    protection also purchased online backup on average two weeks later.


    Analogous to the market basket analysis, the size of the sequence rule can vary
    on both sides – on the left side (antecedent) and on the right side (consequent).
    The left and right sides of the rules are used to identify the patterns when customers
    purchase and consume products and services in a timeline perspective. The left
    side of the rule is used to identify the customers who will be added to the next
    best offer campaign. The right side of the rule is used to identify what products
    to offer to each customer.


    ## Link Analysis


    Link analysis is the process of discovering and examining the connections between
    items in a database. It considers both tabular and graphical representations of
    the associations, sequences, and networks that exist within a database. Link analysis
    aims to discover patterns of activities that can be used to derive useful conclusions
    about different applications in many industries such as fraud detection, computer
    networks, traffic patterns, and web usage.


    Link analysis uses different techniques and algorithms to identify, explore, and
    visualize connections between entities. These entities might be people, cell phones,
    vehicles, organizations, countries, transactions, or machines. The main goal of
    link analysis is to reveal patterns of relationships among these entities. For
    example, many retailers now capture every bit of a transaction and interaction
    that customers have with them. Discovering and understanding these relationships
    and connections within this big data can provide valuable insights to help businesses
    make better decisions.


    Link analysis can reveal associations between items that are frequently purchased
    together. In some situations, we want to know what items have infrequent or no
    associations. The lack of relationship is the association that we are looking
    for. Imagine a strong association between products `A` and `B` and between products
    `C` and `B`. These strong relationships between these products reveal that product
    `A` is frequently purchased together with product `B`, and products `C` and `B`
    are also frequently purchased together. However, there is no association between
    the products `A` and `C`. Suppose that product `A` is `Coke®`, product `C` is
    `Pepsi®`, and product `B` is `potato chips`. Customers who purchase a cola product
    also buy potato chips. However, they do not purchase distinct brands of cola products
    at the same time. These products `A` (Coke) and `C` (Pepsi) are surrogate products.
    A vendor can use this information to bargain for a better sales price for either
    product from the provider. This example is very intuitive by knowing cola products
    and potato chips. However, think about supermarket chains having thousands of
    items in their databases. Finding surrogate products is not a trivial task, and
    link analysis can help them with this challenge.


    The results of a link analysis are a graph network that visualizes connections
    between distinct types of information. Besides retail, the following are many
    other applications of link analysis in different industries:


    *   Police departments can use link analysis for criminal investigations and crime
    detection.

    *   Financial institutions can use link analysis to investigate hidden connections
    between fraudulent customers to build a fraudsters profile.

    *   Federal government agencies can use link analysis to track connections of
    terrorists and other suspicious people in social media.

    *   Telecommunications companies can use link analysis to understand how customers
    relate to each other and how they influence other customers in some business events
    like churn and product adoption.

    *   Insurance companies can use link analysis to establish relationships between
    claims and to identify suspicious connections between entities on these claims.


    Figure 7.3: Links Connecting Entities


    ![image](Images/f0108-01.jpg)

