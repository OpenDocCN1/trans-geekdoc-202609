    Summary


    This chapter introduced more advanced techniques for supervised models, including
    support vector machines and factorization machines. The first model is a highly
    effective classifier, and the second one is used in recommender systems. The recommendations
    are based on ratings customers give to specific products or services. If the ratings
    are high, those products or services are recommended to the customers. If the
    ratings are low, the company should not recommend these products or services to
    those customers. Both techniques are less common in the data science field and
    therefore less often found in business applications. However, support vector machines
    and factorization machines are very promising techniques to solve real-world business
    problems.


    Other topics covered in this chapter are ensemble models and two-stage models.
    Both analytical approaches are very effective in solving business problems. Ensemble
    models usually provide a more generalized model, avoiding misclassified predictions
    in sensitive events such as fraud, diagnosis, and insolvency. Two-stage models
    are good approaches when the need is to classify an event and then to estimate
    a value. For example, classifying the likelihood that an event is fraudulent and
    then, if the probability is high, how much the fraud would cost.


