    # Use Case: Product Segmentation


    Hierarchical clustering methods can be used in product segmentation. The main
    goal is to group products and services into similar groups. These diverse groups
    of products and services can then be used to create distinct packages and bundles
    to boost cross-sell and up-sell opportunities. Bundles are usually priced attractively
    to customers and at the same time offer a better option in terms of products and
    services. In the long term, it retains customers and improves the relationship
    with them. Bundles and packages more often deliver price discounts but increase
    time contracts, guaranteeing a solid cash flow for the company.


    For example, data scientists in a telecommunications company can use hierarchical
    clustering to identify groups based on the different products and services the
    customers use and based on distinct customer behaviors. They can use these clusters
    to create distinct packages and use them in multiple campaigns to reach out to
    the customers. These bundles are expected to improve customer satisfaction, contract
    time, and most important, average revenue per user (`ARPU`).


    ### Figure 6.6: Cluster Descriptions from Hierarchical Clustering for Product
    Segmentation


    ![image](Images/f0086-01.jpg)


    ## Centroid-based Clustering (k-means Clustering)


    The second type of clustering method covered in this chapter is centroid-based
    clustering. The centroid-based technique is a partitive clustering, which divides
    the data set into clusters by trying to minimize some specified error or objective
    function. K-means clustering is one of the most popular partitive clustering algorithms.
    K-means attempts to divide the observations from a data set by minimizing the
    Euclidian distance between the observations and the centroids for each cluster.
    The algorithm consists of four major steps:


    1. Choose `k` initial means as starting “seed” values for the cluster centers.

    2. Assign each observation to the cluster center with the shortest distance.

    3. Based on the observations assigned, compute a new mean for each cluster.

    4. Iterate until the `k` means stabilize.


    The first step in the k-means algorithm is to choose a value for `k`, or the number
    of clusters. `K` represents the objective number of clusters. The term objective
    is used here because during the clustering process the number of centroids can
    be excessive to divide all the observations into `k` clusters. Imagine you have
    a data set with 100 observations and set `k` as `102`. There are more centroids
    than observations so that at least two centroids are void. Based on the variance
    of the inputs for all observations, in some instances some of the centroids defined
    are void. For example, suppose that all observations have the same values. All
    the observations will then fall into the same centroid. Of course, both cases
    are the extreme cases, but it illustrates that `k` is the goal, the desired number
    of clusters. We can think of `k` as the maximum number of clusters.


    These centroids, known as seeds, are randomly selected as a first guess of the
    means of the final clusters. These seeds are typically selected from the sample
    data, although they can be user specified.


    The Euclidean distance from each case in the training data to each seed, centroid,
    or cluster center is then calculated in this first step. The Euclidean distance
    gives the linear distance between any two points in n-dimensional space. Cases
    are assigned to the closest centroid. Because the distance metric is Euclidean,
    it is important for the inputs to have compatible measurement scales. As in the
    hierarchical clustering method, all inputs should be numeric, independent, relevant,
    and standardized (same scale).


    Once all observations are assigned to the centroids, the centroids are then updated
    to equal the average of the cases assigned to the cluster in the previous step.
    In other words, the centroid should represent the center of all observations.
    Then, the centroid positions are updated to satisfy this rule.


    Now, as the centroids update their positions, eventually some of the observations
    might be closer to a centroid other than the one to which it was originally assigned.
    Based on that, the algorithm reassigns all the points to the cluster with the
    closest centroid.


    As observations are reassigned, the centroids need to be repositioned. As the
    centroids are repositioned, the observations need to be reassigned and the process
    keeps going until there is no more reassignments for observations.


    In [Figure 6.7](#Chapter06.xhtml#ch06fig7), we observe that three centroids are
    randomly set. All observations are then assigned to the closest centroid. The
    centroids are repositioned. Then there are three observations that changed clusters.
    The mean calculation for the clusters is repeated and the centroids are repositioned.
    The cluster centers are now the cluster means. The process is continuous until
    there are no more observations reassigned. To avoid the indefinite running of
    the algorithm, the member assignment and mean calculation process is repeated
    until either no significant change occurs in the position on the cluster means,
    or until the specified maximum number of iterations has been reached. When the
    process stops, final cluster assignments are made. Each case is assigned to a
    unique cluster. The cluster definitions can be applied to new cases outside of
    the training data so that new observations can be assigned to the final clusters.


    One of the most important characteristics of k-means clustering is that the algorithm
    is very simple to implement, can handle large data sets, is quite easy to interpret,
    and probably the most important, can be used to score new cases or observations.


    Even though k-means clustering is probably one of the most popular clustering
    algorithms in data science, there are some shortcomings. The algorithm requires
    a guess for the number of clusters present in the data set. Most of the time it
    is very hard to guess the best number of clusters. Normally, several attempts
    are made considering multiple numbers of final clusters to decide about the optimal
    number of groups. It also depends on the business requirements and the practical
    actions that will be taken based on the final clustering process. The k-means
    algorithm is strongly influenced by the initial location of the seeds, by outliers,
    and even by the order in which the observations are read during the training.
    Finally, it is very hard to make assumptions about the shape of the clusters.
    The assumption of the shape of the clusters is that they are spherical. If the
    true underlying clusters in your data are not spherical, then the k-means algorithm
    might produce poor clusters.


    ### Figure 6.7: K-means Clustering


    ![image](Images/f0088-01.jpg)


    ## Use Case: Customer Segmentation


    K-means clustering can be used to group customers based on their main characteristics.
    K-means clustering is very useful when there are many different characteristics
    about the observations. Some of the attributes include how customers consume products
    and services, others include their payment history, how they pay, how they delay
    in payments, and so on. Some customers’ attributes are about the revenue that
    they generate along the way, the profit, or the cost. Some are just about demographic
    information. All this information together can discriminate groups of customers
    with similar characteristics and behaviors, and this can be very helpful in marketing
    campaigns, sales approaches, and bundle and packages experimentation.

