    the right decision in 92% of the cases would avoid USD 5.5 million in taxes. Making
    a wrong decision in 8% of the cases would cost to the company USD 1 million. The
    savings would still reach over USD 4.5 million at the end. In a real scenario
    of fraud, all these customers identified as fraudsters would not have their bills
    issued and would have their services cutoff. The good customers, the 8% included
    in the model’s mistake, would be in touch with the company to determine what happened.
    The services would be resumed, and the bill would be reissued, reducing the loss
    caused by the predictive model.


