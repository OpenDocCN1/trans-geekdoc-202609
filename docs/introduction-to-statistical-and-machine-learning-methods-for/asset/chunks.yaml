- fmt: '

    The support measure is the evidence that `A` and `B` occur together when considering
    all transactions within the database. It is important to notice that the support
    measure is symmetric. That is, the support of the rule `A => B` is the same as
    the support of the rule `B => A`. For example, the support of the rule `bread
    implies butter` has exactly the support of the rule `butter implies bread`. The
    support determines how frequent this rule occurs in the data set or, in other
    words, how relevant it is to combine these items (`bread` and `butter`) into a
    campaign or promotion.


    The confidence of an association rule `A => B` is the conditional probability
    of a transaction containing the item `B` given that it contains the item `A`.
    The confidence is estimated by the following equation:


    $\frac{transactions\ containing\ A\ and\ B}{transactions\ containing\ A}$


    The confidence measure is the extent to which that `A` occurs with `B` in transactions
    that include `A` within the database. Notice that unlike support, confidence is
    asymmetric. The confidence of `A=>B` might be different from the confidence that
    `B=>A`, depending on the number of occurrences of `A` and `B` together and alone
    in the transactions.


    ### Use Case: Product Bundle Example


    For example, consider a telecommunications company. This company provides many
    items that customers can purchase and consume such as broadband, streaming content,
    mobile lines, data packages, and international minutes. In this example, there
    are five transactions to analyze. Considering the items purchased together by
    the different customers as seen in [Figure 7.1](#Chapter07.xhtml#ch07fig1), a
    few rules can be identified with their respective support and confidence:


    1. `Broadband implies data package`, with a support of `2/5` and a confidence
    of `2/3`. If you observe all the transactions carefully, `broadband` and `data
    package` occurs twice within the five transactions (second and fourth transactions).
    The support is `2` out of `5`, or `20%`, meaning that these two products are purchased
    together in `20%` of all purchases. The `data package` is purchased three times
    (second, third, and fourth transactions). The confidence is `2` (transactions
    with `broadband` and `data package`) out of `3` (transactions with `data package`),
    `66%`, meaning that `broadband` and `data packages` are purchased together `66%`
    of the time when a `data package` is purchased.


    2. `Mobile line implies broadband`, with a support of `2/5` and a confidence of
    `2/4`.


    3. `Broadband implies mobile line`, with a support of `2/5` and a confidence of
    `2/3`. Here we can see an example of a symmetric rule: `mobile line implies broadband`,
    and `broadband implies mobile line`. The support as expected is the same, `2/5`
    for both. However, the confidence is different: `2/4` for the first rule and `2/3`
    for the second one. The difference is how many times `broadband` and `mobile lines`
    occur individually considering all the transactions.


    4. `Streaming content and mobile line imply data package`, with a support of `1/5`
    and a confidence of `1/3`. Here it is important to notice that the size of the
    rules can vary. We might find rules with multiple items on the left side of the
    rule (antecedent) and multiple items on the right side of the rule (consequent).


