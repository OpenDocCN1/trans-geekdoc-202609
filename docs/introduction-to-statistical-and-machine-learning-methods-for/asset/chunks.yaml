    \ 作者的信息\n* 对书籍提供反馈\n\n## 关于这些作者\n\n![Author 1]\nCarlos Pinheiro 博士是 SAS 的首席数据科学家，同时任法国数据科学学院的访问教授。自\
    \ 1996 年以来，他一直在巴西一些最大的电信运营商处从事分析工作，担任过从技术到执行人员的多种职位。他曾担任巴西 EMC 的高级数据科学家，负责网络分析、优化和文本分析项目；并曾担任\
    \ Teradata 的首席数据科学家，负责机器学习项目。Pinheiro 博士拥有里约热内卢联邦大学的应用数学与计算机科学学士学位、计算科学硕士学位以及工程学博士学位。Carlos\
    \ 在不同领域完成了一系列博士后研究，包括巴西 IMPA 的动态系统、爱尔兰都柏林大学的社交网络分析、法国萨瓦瓦大学的交通系统、比利时鲁汶根大学的社交网络与人类移动性，以及巴西格图利奥·瓦加斯基金会的城市移动与多模态交通。他在国际期刊和会议上发表了多篇论文，还是\
    \ `Social Network Analysis in Telecommunications` 和 `Heuristics in Analytics:\
    \ A Practical Perspective of What Influence Our Analytical World` 的作者，这两本书均由 John\
    \ Wiley Sons, Inc. 出版。\n\n![Author 2]\n\n"
