    a sales campaign, a retention offering, or fraud detection, among others. The
    model in production needs to provide satisfactory performance, a reasonable accuracy
    when estimating or classifying a target, or a reasonable fit when scoring a new
    case. The model was trained and validated based on past data, but the main goal
    here is to use it on new data where the new observations have no target if the
    model is supervised or the observation was not in the data used to create the
    insights if the model is unsupervised. For example, a supervised model such as
    a churn model can be deployed to score and classify customers based on the probability
    of churn, and therefore to receive an incentive to stay if the probability is
    above a certain threshold. An example of an unsupervised model in deployment is
    a customer segmentation model that scores and classifies new customers into one
    of the segments previously created.


    Figure 9.1: Aspects to Evaluate the Best Model


    ![image](Images/f0136-01.jpg)


    There are many ways to evaluate the model’s performance. In addition to different
    fit statistics, there is a vital component: the business need. Depending on the
    business scenario, the model can be evaluated based on its accuracy such as how
    good it is in predicting the new observation, but that model can also be assessed
    based on the time it takes to be trained, the time it takes to score new cases,
    the ability to handle noise within the data, and finally, the capacity to be interpreted.


    Speed of Training


    The speed of training is important in some fraud detection models. The fraud behavior
    might change so quickly that the model eventually drifts too early. When that
    happens, the model in production might need to be retrained. In the worst-case
    scenario, the model might need to be re-created. In both cases, the time to train
    or retrain is completely relevant.


    Speed of Scoring


    The speed of scoring is especially important in real-time applications. For example,
    in credit risk scoring, customers call the call center or go straight to the company’s
    web page to apply for a personal loan. The business application, either the CRM
    (Customer Relationship Management) on the call center or the web page application,
    needs to collect the customer information and in a matter of seconds reply to
    the response. The input data is collected by the business application, and the
    model previously trained is applied to the new data to score the credit risk for
    that loan application.


    Some models are fast to train, like regressions and decision trees. Some other
    models can take longer to train on big data, like neural networks and gradient
    boosting. On the other side, some models can be extremely fast to score, like
    regressions and neural networks, as the scoring is just a matter of applying the
    coefficients or weights to the new data. The speed of the training in cases where
    the behavior changes quickly, or the speed of the scoring in cases where the time
    response is required to be low, can be the most important dimension to evaluate
    and select the best model to put in production.


    Business Knowledge


    Depending on the type of unsupervised model, there are some statistical measures
    that data scientists can use to evaluate the results. For example, in clustering,
    you can use the cubic clustering criterion to evaluate the possible number of
    clusters based on the minimum variance in each set of groups. In network analysis,
    data scientists can use modularity to evaluate the best distribution of communities
    detected. In some other clustering techniques, data scientists can use statistical
    measures to evaluate the proportion of the variability in distinct groups. However,
    in most of the cases of unsupervised models, the business knowledge and the experience
    of the data scientist can be the key. As unsupervised methods are more open in
    terms of results, the assessment of the model results needs to rely on the business
    knowledge, on how the results are applied as business actions, and on what the
    company expects as outcomes.


    Fit Statistics


    For supervised models, on the other hand, data scientists have a baseline that
    is a benchmark to evaluate how good the models are that they developed. The baseline
    is the known target used to train the models. All supervised models are trained
    on past data where the outcome is known. Once the model is trained, data scientists
    can validate the models based on the results of these models on different data
    sets. The main goal on this approach is to select the model that can best generalize
    the predictions in different observations.'
