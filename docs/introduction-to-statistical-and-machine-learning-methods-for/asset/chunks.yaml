    \ I had the opportunity to create an Analytics Lab at Oi. The Lab focused on developing\
    \ innovative analytics for marketing, fraud, finance, collecting and engineering.\
    \ SAS was a big sponsor/partner of it.\n\nAt the beginning of 2012, I worked for\
    \ few months with SAS Turkey creating some network analysis projects for communications\
    \ companies, and thereafter I moved to Annecy, France, to perform a postdoc at\
    \ Université de Savoie, France. The research was focused on transportation systems,\
    \ and I used SAS to develop network models. In 2013, I moved to Leuven, Belgium,\
