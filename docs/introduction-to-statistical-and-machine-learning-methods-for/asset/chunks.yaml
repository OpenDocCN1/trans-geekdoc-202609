    Outliers can also be detected during this phase, and data scientists must decide
    whether these data points are erroneous, or if they depict unusual circumstances.
    Sometimes finding outliers might represent a solution to a business problem. Outliers
    can describe a problem in the transactional system, which leads the company to
    improve the data quality efforts, or it can represent an anomaly, a correct value
    that is very unusual and very unexpected. This outlier can highlight a potential
    fraud event, a failure in machinery, or a default in financial operations. There
    are techniques to reduce the effect of the outliers in predictive models and other
    techniques to eliminate the outliers from the training and validation processes.


    ### Mis-scaled Input Variables


    Finally, data scientists should examine the scale of the predictor variables.
    In some modeling situations, re-scaling the variables to the same scale might
    be beneficial. For some models, different scales might not represent a big problem,
    like in regression or tree-based models. But for complex models like neural networks,
    different scales might represent a bias for the way the model considers and accounts
    for the distinct inputs. Salary might be more important than age just because
    its scale is bigger. Therefore, getting all input variables in the same scale
    (`-1` to `1` or `0` to `1`) can be very beneficial to neural networks.


    An important goal in data exploration is to understand all the possible data sources
    and predictor variables that are used to solve the business problem based on analytical
    reports. Unsupervised models like clustering or segmentation, or supervised models
    like regression and neural networks, or even based on semi-supervised, like text
    analytics, optimization and network analysis can be used. It is important to understand
    that the process of exploring the data and analyzing the variables might not just
    solve business problems along the way, but also it can raise valuable business
    insights about several topics.


    # Introduction to Data Preparation


    In the data preparation phase, data scientists need to access all the data sources
    available in the company to solve the business problem. Some data sources reside
    externally or are provided by third-party companies that can add and enrich the
    company’s information about business problems. The data sources can be customer
    information, billing information, and transaction information. A common problem
    is that the data usually consists of multiple rows per customer, like in a data
    warehouse or data mart. Because of that, all the data must be merged to end up
    with one single customer version.


    Tasks associated with data preparation include the following:


    * Representative sampling

    * Event-based sampling

    * Partitioning the data

    * Imputing missing values

    * Replacing erroneous variable values

    * Transforming variables

    * Feature selection


    ## Representative Sampling


    If the data source comprises many customers, data scientists might want to take
    a sample of the customers. This might seem of minimal importance in the age of
    extremely fast computers. However, the model-fitting process occurs only after
    the completion of a long, tedious, and error-prone data preparation process. Sampling
    is done for data efficiency purposes because smaller sample sizes for data preparation
    are usually preferred. Splitting the data into multiple samples enables data scientists
    to assess how well the models generalize the predictions for future data as we
    are going to see in data partitioning.


    Figure 2.1: Sampling Data


    ![image](Images/f0023-01.jpg)


    ### Event-based Sampling


    In many business situations, the target that we are trying to model is rare. For
    example, the churn rate for a telecommunications company might range from `2%`
    to `5%`. One common strategy for predicting rare events is to build a model on
    a sample consisting of all the events and then merge to a sample of the nonevents.
    The values of some business targets might not relate to the event of interest
    or to the business goal. For example, the rare event could be a churn event, when
    the customer decides to quit the company or the product or service. The nonevent
    is when the customer does not make churn, and when the customer is still in the
    company, consuming and using some of the products and services. The new sample
    might have a `50%` event rate instead of the original `2%` to `5%` event rate.


    The advantage of event-based sampling is that data scientists can obtain, on average,
    a model of similar predictive power with a smaller overall case count. This sampling
    strategy works because the amount of information in a data set with a categorical
    outcome is determined not by the total number of observations in the data set,
    but by the number of observations in the rarest outcome category, which is usually
    the number of events. This sampling approach allows the model to capture both
    relationships between the inputs and the event of interest and the inputs and
    the nonevent. If you have in the training data set just nonevents, or at least
    a vast majority of them, the model tends to easily capture just the relationship
    of the inputs and the nonevent. Even if the model predicts there is no churn,
    the model will be correct `99%` of the time. This `99%` classification rate for
    this model is a very good classification rate, but the company will miss all the
    events.


    Figure 2.2: Event-based Sampling


    ![image](Images/f0024-01.jpg)


    ## Partitioning


    Analytical models tend to learn very fast and efficiently capture the relationship
    between the input variables and target. The problem is they can learn too much.
    The models can capture almost perfectly the correlation between the inputs and
    the target, but just for the time frame that it has been trained. As the data
    changes over time, the model should generalize as much as possible to account
    for the variability of the data in different time frames. When the model has high
    predictive accuracy for the trained period but not for future data, it is said
    that the model overfits the data.


    The simplest strategy for correcting overfitting is to isolate a portion of the
    data for assessment or validation. The model is fit to one part of the data, called
    the `training data set`, and the performance is evaluated on another part of the
    data, called the `validation data set`. When the validation data are used for
    comparing, selecting, and modifying models, and the chosen model is assessed on
    the same data that was used for comparison, then the overfitting principle still
    applies. In this situation, a `test data set` should be used for a final assessment.


    In situations where there is a time component, the `test data set` could be gathered
    from a different time. This would generalize the model even more, as the model
    should be deployed in production in a different time frame anyway. That means
    a model is trained based on past events where the target is known. Then once the
    best model is selected, it will be deployed in production to predict the events
    in future data, where the target is unknown. The model needs to generalize well
    to new data to account for variability in the data over time. When a test is made
    by using data varying in time, it helps the data scientist select the most accurate
    model but also the one that generalizes best. For example, a model that is fit
    on data that is gathered from `January` to `June` might not generalize well to
    data that was gathered from `July` to `December`.

