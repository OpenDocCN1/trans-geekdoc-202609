    Gradient boosting is based on a slightly different approach than random forests,
    particularly assigned to the perturb and combine method. Boosting is a machine
    learning ensemble meta-algorithm for primarily reducing variance. The term boosting
    refers to a family of algorithms that can convert weak learners (in this case,
    decision trees with large residuals) into strong learners.


    Adaptive resampling and combining methods are examples of boosting. They sequentially
    perturb the training data based on the results of the previous models. Cases that
    are incorrectly classified are given more weight in subsequent models. For continuous
    targets, from the second decision tree in the sequence onwards, the target is
    the residual of the previous tree. The objective is to minimize the objective
    function which in this model minimizes the residuals.


    The gradient boosting model is shown below.


    `F[M] (*x*) = F[0] + β[1]T[1] (*x*) + β[2]T[1] (*x*) + … + β[M]T[M] (*x*)`


    where `M` is the number of iterations, or decision trees in the gradient boosting
    model, `F0` is the initial guess, `β` is the weight for each decision tree in
    the linear combination, and `T` is the decision tree model in each iteration.


    The strengths of the forest and gradient boosting models are that the models have
    most of the advantages of decision trees without the model instability and overfitting.
    The ensemble of tree models have low bias and low variance, can handle non-linear
    relationships with the target, can handle missing values, and are robust to outliers.


    Figure 4.2: Tree-based Models: Gradient Boosting


    ![image](Images/f0055-01.jpg)


    The weaknesses of the ensemble of tree models are that the simple interpretation
    of a single decision tree is lost. Forest and gradient boosting models are not
    simple and interpretable. They also require far more computer resources compared
    to the single decision tree. Gradient boosting models can train slower than forests
    as the trees are built in series, where one tree depends on the results of the
    prior trees.


    ## Use Case: Usage Fraud


    A business problem where forest or gradient boosting models can be extremely helpful
    is usage fraud. Telecommunications usage fraud is when a fraudster uses products
    and services provided by the telecommunications company with no intention to pay,
    or even worse, when fraudsters sell or resell telecommunications products and
    services in the black market. This is a critical concern as sometimes this type
    of fraud is associated with organized crime and terrorist networks. Although the
    main goal of the model is to detect usage fraud and to prevent intentional bad
    debts, the fraud detection team needs to be careful that it does not adversely
    impact the customer journey for good customers.


    Usage fraud might have specific characteristics in terms of calling behavior such
    as calling specific cities and countries, the duration of the calls, the frequency
    of the calls, and the recency of the calls. A transactional system processing
    all calls, called mediation systems, can feed another transactional system to
    handle fraud detection such as a fraud management system (`FMS`). This application
    usually requires a model to learn and identify suspicious behavior and trigger
    alerts so that the fraud analysts can further investigate the cases. This usage
    behavior is very often a cumulative behavior over time.


    Different machine learning models such as forest and gradient boosting can address
    this business issue properly. These models are used to compute the probability
    of usage fraud. If the probability is above a threshold, an alert can be raised.
    The fraud management system continuously uses these models to score the data to
    generate alerts. The data scientist can also select only the outcomes with high
    probabilities to be transferred to the `FMS`. This approach aims to avoid false-positive
    identification alerts to the fraud analysts that will unnecessarily block products
    and services associated to good customers.


    Figure 4.3: Information Flow in Fraudulent Events


    ![image](Images/f0056-01.jpg)


    In [Figure 4.3](#Chapter04.xhtml#ch04fig3), real-time transactions (for example,
    calls and text messages in telecommunications) feed the `FMS`. These transactions
    are used in rules that accumulate customers’ behaviors in a recency and frequency
    perspective. Historical transactions are used in data mining initiatives (classification
    and estimation supervised models, and clustering and segmentation unsupervised
    models) to identify all possible rules to detect suspicious transactions. These
    rules are evaluated and deployed into the `FMS`. Once an alert is raised, there
    are basically two options, mostly depending on the type of the rule and its accuracy.
    If a high accurate alert is raised, an automated system can automatically drop
    the call by using probes in the network system. If a medium accurate alert is
    raised, the case can be sent to a fraud analyst for further investigation.


    ## Neural Network


    If the relationship between the input variables and the target is nonlinear but
    it is possible to specify the relationship, a parametric regression model can
    be built. When it is not practical to specify the relationship, a nonparametric
    regression model is required.


    Nonlinear regression models are more difficult to estimate than linear models.
    Data scientists must specify the full nonlinear expression to be modeled and an
    optimization method to efficiently search for the parameters. Initial parameter
    estimates also need to be provided and are critical to the optimization process.
    Another option is a nonparametric regression model that has no functional form.


    Traditional nonlinear modeling techniques are more difficult to define as the
    number of inputs increase. It is uncommon to see parametric regression models
    with more than a few inputs, because deriving a suitable functional form becomes
    increasingly difficult as the number of inputs increases. Higher-dimensional input
    spaces are also a challenge for nonparametric regression models.


    Neural networks were developed to overcome these challenges. Although neural networks
    are parametric nonlinear models, they are like nonparametric models in one way:
    neural networks do not require the functional form to be specified. This enables
    data scientists to construct models when the relationships between the inputs
    and the target are unknown.


    However, like other parametric nonlinear models, neural networks do require the
    use of an optimization process with initial parameter estimates. Furthermore,
    unlike nonlinear parametric regression models and nonparametric regression models,
    neural networks perform well in sparse, high-dimensional spaces.


    Both regressions and neural networks have similar components but with different
    names. Instead of an intercept estimate, a neural network has a bias estimate.
    Instead of parameter estimates, a neural network has weight estimates.


    Even though it has a fancy name, the most common type of a neural network model,
    the multilayer perceptron, can be perceived as an extension of a regression model.


    The neural network model is arranged in layers. The first layer is called the
    input layer, consisting of the input variables. The second layer is called the
    hidden layer, consisting of the hidden units or neurons. It is possible to have
    multiple hidden layers with multiple hidden units in each hidden layer. The final
    layer is the target layer, consisting of the response or target.


    Figure 4.4: Neural Network Diagram

