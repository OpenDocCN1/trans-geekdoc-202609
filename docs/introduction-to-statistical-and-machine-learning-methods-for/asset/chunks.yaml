    in 20% of all purchases. The data package is purchased three times (second, third,
    and fourth transactions). The confidence is 2 (transactions with broadband and
    data package) out of 3 (transactions with data package), 66%, meaning that broadband
    and data packages are purchased together 66% of the time when a data package is
