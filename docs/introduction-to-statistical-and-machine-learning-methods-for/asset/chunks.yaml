    The fit statistics used to evaluate supervised models really depend on the type
    of model. If the supervised model is a classification model and the target is
    a categorical variable, the outcome is a decision. Then, the fit statistics used
    to assess different models’ results can be `accuracy`, `misclassification`, `profit`,
    or `loss`. The model with the lowest misclassification on new data is the champion
    model. If the supervised model is a ranking model where the output value is less
    important than the order of these values, the outcome is a ranking. Then, the
    fit statistics used to assess different models’ results can be the `ROC index`
    or `Gini coefficient`. The champion model is the one that can best generalize
    the ranking on new data or the model that presents the highest ROC index. Finally,
    if the supervised model is an estimation model, where the target is a continuous
    variable, the outcome is an estimate. Then, the fit statistics used to assess
    different models’ results can be `average square error`, `root mean square error`,
    `Schwartz`, `Bayesian`, or `Akaike information criterion`, or any statistics based
    on a likelihood function. The model with the lowest error function on the new
    data is the champion model.


    Figure 9.2: Types of Predictions and Fit Statistics


    ![image](Images/f0138-01.jpg)


    ## Data Splitting


    The model trained on a specific set of data in a specific time frame is trained
    to identify the correlation between the input variables to the target variable.
    This model will be applied to new data or future data to support a business action
    initiated by the company. For example, a company is experiencing a rise in the
    churn rate. The data science team can collect past data about the churn event
    and train supervised models to understand and identify what is correlated to the
    churn. What type of customers are more likely to make churn? What customers’ characteristics
    are more relevant when analyzing the churn?


    Once a set of models is trained, data scientists need to evaluate the models to
    select the best one—the one that they deploy in production to support a retention
    campaign. However, this retention campaign will run on a future time frame. The
    variables used to train the models are the same, but not their values. A period
    has passed, and these values might have changed. The data the model scores is
    different from the training data. To assess whether the model might fail on this
    new data, data scientists evaluate the model based on a different data set than
    the one on which the model was trained. This is to “simulate” the real-world scenario,
    when the champion model scores different data than it was trained on. This different
    data used to evaluate the best model during the training can be two different
    data sets called `validation data` and `test data`. The best model will be the
    one that performs best on the validation and test data sets, not on the training
    data set. Data scientists can use the results of the models on the validation
    data set, the test data set, or the average results on both validation and test
    data sets to select the champion model. When this champion model is deployed in
    production to support the campaign, the data scientists can expect that the model
    will perform well because they selected the model that generalized the best, using
    different data sets to train and select the champion model. In some cases, the
    test data can be an out-of-time sample to consider a future time frame of events
    to simulate what will happen when the model scores new or future observations.


    Figure 9.3: Model Generalization: Train, Validate, and Test


    ![image](Images/f0139-01.jpg)


    ## K-fold Cross-validation


    Splitting the data into training, validation, and test (The test data set is not
    really required but depends on business needs and regulations.) is a highly effective
    method to train and generalize a supervised model before getting it into production.
    Data splitting is a simple but costly technique. When the data set is too small,
    the performance measures might be unreliable because of high variability between
    the train and validation data sets. A good approach to mitigate this problem of
    small data sets is cross-validation.


    Figure 9.4: Cross-validation


    ![image](Images/f0140-01.jpg)


    K-fold cross-validation shuffles the original data set into training and validation.
    Multiple runs can be defined for this shuffle, or multiple folds can be determined
    to split the original data set into training and validation. For example, in a
    four-fold cross-validation, the data is split into four equal sets. The first
    run of the training is based on three quarters of the original data set (folds
    `A`, `B`, and `C`), and the validation is based on the last quarter (fold `D`).
    A new run uses folds `A`, `B`, and `D` to train and validate based on `C`. The
    process continues until all folds have been used for the training and the validation
    steps. The four assessments are then averaged. In this way, all the data are used
    for both training and validation.


    There are two options for the best model in cross-validation. The first one considers
    a single model for each step. For example, a model is trained on the first step
    based on the folds `A`, `B` and `C`, and validate based on the fold `D`. This
    model is then applied to all other steps, the other three shuffles. The model
    that performs best in all folds or steps is the champion. Some data scientists
    use the entire data set to fit the champion model but use the cross-validation
    results as the assessment statistics.


    The second approach is the ensemble model. For every step, a model is trained
    like in the first approach described before, for example, training on `A`, `B`,
    and `C` and validating on `D`. Another model is trained on the second step, training
    on `A`, `B`, and `D` and validating on `C`, and so on. In this case, there are
    four models trained: one for each run of the cross-validation. Because the results
    are averaged, the models are an ensemble. The final model is the ensemble model
    of all four models trained during the cross-validation.


    ## Goodness-of-fit Statistics


    The method to assess the models’ performance depends on the scale of the target
    variable. If the target variable is categorical, then some of the common methods
    are classification tables, ROC curves, gains, and lift charts. Several of the
    goodness-of-fit statistics can be used to evaluate the models’ performance. Some
    of the most common goodness-of-fit statistics are the misclassification error
    rate and information criteria, such as the `AIC` (Akaike information criterion)
    and `SBC` (Schwarz Bayesian information criterion).


    If the target variable is continuous, a plot of the observed versus predicted
    averages by decile would be useful. Goodness-of-fit statistics are commonly based
    on some error functions, like `average squared error`, `root mean square error`,
    `log error`, and the `adjusted R-square`.


    Figure 9.5: Confusion Matrix


    ![image](Images/f0141-01.jpg)


    ## Confusion Matrix


    One of the most widely used assessment tools for supervised classification models
    when the target is a binary variable is the `confusion matrix`. The `confusion
    matrix` is a crosstabulation of the actual (observed event) and predicted classes
    (classified event). It quantifies when the supervised model correctly classifies
    or misclassifies the event. For the `confusion matrix`, the event of interest
    is often called positive whether the event is unfavorable like fraud, churn, or
    default, or the event is favorable like purchase, acquisition, cross-sell, or
    up-sell. A nonevent is called negative.

