    supervised learning modeling. This chapter focuses on nontraditional machine learning
    models like support vector machines and factorization machines, as well as advanced
    methods for supervised modeling, such as ensemble models and two-stage models.


    Support vector machines are a very efficient classifier, allowing data scientists
    to fit a model regardless of the functional form, or the relationship between
