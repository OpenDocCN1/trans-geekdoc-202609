    诈骗者立即在这种场景中识别出了机会。欺骗发生在犯罪分子获取固定线路连接到一台使用软交换机的计算机，该软交换机是电信网络中的一个呼叫交换节点。通过软交换机，犯罪分子向数百部手机拨打自动语音电话，以获取预付费分钟数。当然，犯罪分子并没有打算为固定线路付费。在这种情况下，这是对电信公司的双重欺诈。犯罪分子还可以使用经过改过的公用电话来生成这些电话，或者通过对交换机的非法扩展来实现同样的操作，即向预付费手机拨打电话并为它们产生额度。一旦这些预付费手机充满了额度，犯罪分子就会在黑市出售这些预付费手机。在许多市场，购买预付费用户识别模块（SIM
    卡）时不需要向运营商提供任何信息。


    欺诈检测模型的主要目标是检测接听电话的异常行为并拦截预付费分钟数。一些实用的变量包括没有拨打活跃行为、接听行为极高且持续、源号码列表非常窄，以及来自同一地点（有时是同一地址）的源号码。`SVM`
    模型根据二分类目标 `0` 或 `1`（在本例中为欺诈或非欺诈）对案例进行分类。这种分类基于事件的后验概率，或预付费欺诈的可能性。根据后验概率，将后验概率最高的预付费手机号码发送到拒绝列表中，取消它们的预付费额度。欺诈检测模型每月为电信公司节省数百万美元。它们应该嵌入到事务系统中以及时监控事件。必须密切监控它们以评估其预测欺诈案件的性能。由于欺诈事件经常变化，它们通常会频繁更新。由于这些原因，欺诈检测模型的主要目标是性能而非模型的可解释性。这是神经网络、随机森林、梯度提升和支持向量机的完美案例。


    ## 因子分解机 (Factorization Machines)


    有一类业务应用涉及估计用户会对某些物品评分。在这种业务场景下，公司通常对用户或物品的信息并不多。这类模型的主要目标是评估用户与物品之间的关系。例如，考虑一家向用户出售点播电影的流媒体公司。这家公司对其客户（用户）的信息很少，除了他们过的电影（物品）之外。用户最终可以对他们过的电影进行评分。如果我们创建一个考虑用户和电影的矩阵，考虑用户对电影给出的评分组合，这个最终矩阵将是非常稀疏的。我们可以预期，例如有数百万用户和数十万部电影。并不是所有客户都会为所有电影评分。事实上，很少有客户会对电影评分，这导致了一个包含大量缺失评分的巨大矩阵。换句话说，该矩阵中的大多数单元格都是缺失的。这里的挑战是估计用户对特定电影的评分是多少。


    因子分解机是用于高维稀疏数据建模的一种新型强大工具。稀疏矩阵就是我们提到的电影公司的用户和物品的矩阵。因子分解机的主要目标是预测矩阵中的缺失项。通过估计缺失项，公司将知道考虑到所有用户的所有电影的评分。这些信息将允许公司找到用户会给出高分的物品，然后将这些物品推荐给每个用户（已对这些物品评分的用户除外）。


    因子分解机模型用于推荐系统，其目标是预测用户对物品的评分。推荐系统主要有两种类型。一种类型依赖于内容过滤方法。内容过滤假设为模型估计可以获得一组关于物品的信息。这组信息通常被称为侧面信息（side
    information），它描述了将要推荐的物品。通过获取侧面信息，内容过滤在估计新物品评分方面没有问题。


    第二类型基于协同过滤。这种方法不需要关于物品的额外信息。所需的信息是包含用户集、物品集以及用户对物品评分的矩阵。所有用户和物品的组合创建了一个包含大量缺失评分的大稀疏矩阵。协同过滤方法在估计所有用户和物品组合的评分方面运行良好。协同过滤方法的问题是无法估计没有评分的新增物品。


    图 5.4 显示了协同过滤的一个示例。在这种情况下，公司拥有的所有信息都是现有评分，可以用矩阵表示。并不是所有用户都会为所有物品评分，因此某些评分将缺失。


    因子分解机通过求加所有用户和物品的平均评分、一个用户给出的平均评分、给一个物品的平均评分，以及一个考虑到用户与物品之间亲性的成对交互项来估计评分。用户与物品之间的亲性被建模为两个特征向量之间的内积：一个用于用户，另一个用于物品。这些特征统称为因子（factors）。


    矩阵分解技术通常是有效的，因为它们使数据科学家能够发现用户和物品之间交互背后的潜在特征。基本思想是发现两个或多个矩阵，当它们相乘时会返回原始矩阵。


    图 5.4：带有缺失用户评分的用户与评分表


    ![image](img/f0069-01.jpg)


    想象如图 5.5 所示的场景。有一组用户 `U` 和一组物品 `I`。大小为 `|U| X |I|` 的矩阵 `R` 包含了用户分配给物品的所有评分。因子
    `K` 的数量可以任意定义。这些 `K` 因子代表用户集 `U` 和物品集 `I` 之间的潜在特征。主要目标是找到两个矩阵 `P(a|U|×K)` 和 `Q(a|I|×K)`，使得这两个矩阵的积近似
    `R`：`R ~ P×Q`。


    `P` 的每行代表用户与特征 `k` 之间的关联强度。同样，`Q` 的每行代表物品与特征 `k` 之间的关联强度。为了获得 `ui` 对物品 `ij` 的评分预测，我们需要计算对应
    `ui` 和 `ij` 的两个向量的点积：`${r\hat{}_{ij} = p_{i}^{T}q_{j} = \sum_{k = 1}^{k}p_{ik}q_{kj}`


    获取矩阵 `P` 和 `Q` 的一种方法是先为这两个矩阵初始化某些值。这些值正是现有的评分（用户评价物品）。我们计算它们的积与 `R` 之间的差异，并尝试迭代地最小这种差异。这种方法被称为
    `梯度下降`，其目的是寻找局部最小值。


    ```

    e_{ij}^{2} = {(r_{ij} - \widehat{r_{ij}})}^{2}

    ```


    考虑平方误差是因为估计评分可能高于或低于观测评分。


    用例：基于零售客户评分的推荐系统


