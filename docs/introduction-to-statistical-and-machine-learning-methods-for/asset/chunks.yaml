    of expertise, and it is almost impossible for a single person to master all of
    them. Collaboration allows data scientists to work alongside different professionals
    when seeking the best solution for a business problem. For example, if data scientists
    are developing models to predict loan defaults, then they probably need to partner
    with someone from the finance department to help them understand how the company
    charges the customers, what time frame is used to define a default, and how the
    company deals with defaults. All these policies should be considered when developing
    data analyses and training analytical models. The data associated with this problem
    most likely sit in different transactional systems with distinct infrastructures.
    Data scientists need to work with data engineers, software developers, and informational
    technology operation personnel to gather all the data sources in an effective
    way. Once the model is done and deployment is required, data scientists need to
    work with application developers to make the model’s outcomes available to the
    organization in the way it is expected. The combination of all these skills creates
    an effective analytical framework to approach business problems in terms of data
    analysis, model development, and model deployment.


    Communication and Visualization


    One more key skill is essential to analyze and disseminate the results achieved
    by data science. At the end of the process, data scientists need to communicate
    the results. This communication can involve visualizations to explain and interpret
    the models. A picture is worth a thousand words. Results can be used to create
    marketing campaigns, offer insights into customer behavior, lead to business decisions
    and actions, improve processes, avoid fraud, and reduce risk, among many others.


    Once the model’s results are created, data scientists communicate how the results
    can be used to improve the operational process with the business side of the company.
    It is important to provide insights to the decision makers so that they can better
    address the business problems for which the model was developed. Every piece of
    the model’s results needs to be assigned to a possible business action. Business
    departments must understand possible solutions in terms of the model’s outcomes
    and data scientists can fill that gap.


    Data scientists use visual presentation expertise and story-telling capabilities
    to create an exciting and appealing story about how the model’s results can be
    applied to business problems. Data analysis and data visualization sometime suffice.
    Analyzing the data can help data scientists to understand the problem and the
    possible solutions but also help to drive straightforward solutions with dashboards
    and advanced reports. In telecommunications, for example, a drop in services consumption
    can be associated with an engineering problem rather than a churn behavior. In
    this case, a deep data analysis can drive the solution rather than a model development
    to predict churn. This could be a very isolated problem that does not demand a
    model but instead a very specific business action.


    Hard and Soft Skills


    Hard skills include mathematics, statistics, computer science, data analysis,
    programming, etc. On the other side, there are a lot of soft skills essential
    to performing data science tasks such as problem-solving, communication, curiosity,
    innovation, storytelling, and so on. It is very hard to find people with both
    skill sets. Many job search sites point out that there is a reasonable increase
    in demand for data scientists every year. With substantial inexpensive data storage
    and increasingly stronger computational power, data scientists have more capacity
    to fit models that influence business decisions and change the course of tactical
    and strategical actions. As companies become more data driven, data scientists
    become more valuable. There is a clear trend that every piece of the business
    is becoming driven by data analysis and analytical models.


    To be effective and valuable in this new evolving scenario, data scientists must
    have both hard and soft skills. Again, it is quite difficult to find professionals
    with both hard and soft skills, so collaboration as a team is a very tangible
    solution. It is critical that data scientists partner with business departments
    to combine hard and soft skills in seeking the best analytical solution possible.


    For example, in fraud detection, it is almost mandatory that data scientists collaborate
    with the fraud analysts and investigators to get their perspective and knowledge
    in business scenarios where fraud is most prevalent. In this way, they can derive
    analytical solutions that address feasible solutions in production, usually in
    a transactional and near real-time perspective.


    Data Science Applications


    It is difficult to imagine a company or even a segment of industry that cannot
    benefit from data science and advanced analytics. Today’s market demands that
    all companies, private or public, be more efficient and accurate in their tactical
    and operational actions. Analytics can help organizations drive business actions
    based on data facts, instead of guesses, as shown in [Figure 1.2.](#Chapter01.xhtml#ch01fig2)


    Another key factor in data science is that all the techniques data scientists
    use in one industry can be easily applied to another. Business problems, even
    in different industries, can be remarkably similar. Insolvency is a problem in
    many industries: telecommunications, banking, and retail, for example. The way
    banks handle insolvency can help retail and telecom companies improve their process
    and be more effective in their business. How telecommunications companies handle
    transactional fraud can help banks improve their process to detect and react to
    fraudulent transactions in credit card accounts. Data analysis and analytical
    insights need to replace guessing and assumptions about market, customers, and
    business scenarios.


    Figure 1.2: Industries That Can Benefit from Data Science Projects


    ![image](Images/f0007-01.jpg)


    Collaboration among data scientists working in different industries is valuable
    and increases the spectrum of viable solutions. Industries can learn from each
    other and improve their process to identify possible analytical solutions and
    deploy practical business actions. This knowledge transferring from different
    domain areas, even between distinct industries, is beneficial for all sides involved.
    Several current business issues include fraud detection, churn analysis, bad debt,
    loss estimation, cross-sell/up-sell, risk analysis, segmentation, collecting,
    optimization, forecasting, supply chain, and anomaly detection, among many others.


    Data Science Lifecycle and the Maturity Framework


    The analytical lifecycle, or the data science process flow, comprises a few steps.
    However, it is important to spend some time on them and make sure all of them
    are performed properly.


    Understand the Question


    The first step in the modeling process as shown in [Figure 1.3](#Chapter01.xhtml#ch01fig3)
    is to understand the question. Data scientists need to understand what they are
    trying to solve with the model that they are about to develop. To perform this
    step, work closely with the business department to verify if a model is appropriate,
    if it is feasible, if there is enough data to use, and what practical actions
    are planned to be deployed based on the model’s outcomes.


    Figure 1.3: Data Science Projects Lifecycle


    ![image](Images/f0008-01.jpg)


    Some of the questions to ask during this phase are:


    *   What is the goal of the project? Do we want to predict some future event or
    classify, estimate, or forecast? Do we want to optimize a specific process or
    generate insights about customer behavior? Do we want to create groups or segments
    or produce a path analysis, sequence analysis, network analysis, and so on?'
