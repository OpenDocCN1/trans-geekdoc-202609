    ## Two-stage Models


    Two-stage models enable data scientists to model a class target and then use the
    predicted probability, or the decision, to split the observations and feed them
    into another model, normally to train a model with a continuous target. The two
    models can use different algorithms and different predictor variables. Therefore,
    the first model classifies a binary target. Based on the decision of the first
    model (`0` or `1`), another model is trained to estimate a continuous value (just
    for the decisions of `1`). A good example is to model the probability of unmanageable
    debt, and if the predicted class is `1`, then model the amount of unmanageable
    debt.


    Two-stage models provide data scientists the probability of the event and the
    predicted amount. For example, if the data scientists are modeling a fraud event,
    they can obtain the probability of the transaction being fraudulent in the first
    model, and then, for all those transactions classified as fraudulent, they can
    estimate the amount of fraud involved in the transaction in the second model.
    These two pieces of information can be used to determine the amount of fraud,
    rather than just the probability of the fraudulent event.


    If the predicted probability is accurately estimated in the first stage of the
    model, then there might be an increase in the accuracy of the predicted amounts
    in the second stage. For example, in two-stage default models, the accuracy of
    the predicted probability of default could increase the accuracy of the predicted
    amount of default.


    Data scientists need to be careful about which models are used in the two-stage
    model because a poorly specified model in either stage impacts the accuracy of
    the predictions, and therefore, the estimations. The two targets also need to
    be correlated, or else two independent models would be sufficient.


    ## Use Case: Anti-attrition


    A good business example for two-stage models is problems related to customer attrition.
    When a customer calls the company call center with a complaint, a predictive model
    can be fit to predict what the customer will do if the company does not rectify
    the complaint. For example, if the customer feels they have been charged an excess
    amount, will the customer go to a consumer protection agency, or to a regulatory
    agency, or go straight to court if their complaint is not rectified? Each one
    of these jurisdictions has its own cost for the company as shown in [Figure 5.9](#Chapter05.xhtml#ch05fig9).
    If the problem can be rectified at the call center level, it is cheaper for the
    company. If the problem reaches the consumer protection agency, the cost for the
    company is higher. If the problem reaches the regulatory agency, the cost can
    be even higher as some penalties can be added. However, if the problem goes to
    court, the cost to the company can be enormous because in addition to penalties,
    there might be some civil reparations involved.


