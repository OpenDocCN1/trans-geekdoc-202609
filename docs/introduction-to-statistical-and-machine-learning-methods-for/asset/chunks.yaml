  trans: "\n一旦选择了合理数量的变量，数据科学家通常可以根据复杂性对多种模型进行选择。一个常见的陷阱是对数据进行过拟合，即模型过于复杂。过度复杂的模型可能对数据中的噪声过于敏感，无法良好地泛化到新数据。一个例子是包含许多许多不必要的高阶项的模型，如\
    \ `age*age` 和 `income*income`。然而，使用过于简单的模型会导致欠拟合，使得真实的特征被忽略。\n\n# 模型泛化\n\n通常情况下，模型性能遵循一个直观的趋势。随着模型复杂性的增加、模型中添加更多项，或者在训练过程中引入更多交互，模型在训练数据集上的拟合程度通常也会随之提高。这种增长部分归功于模型捕捉了数据中的相关趋势，有时是输入与目标之间非常特定的相关性。然而，部分增长可能是由于对训练数据的过拟合，因为模型可能对随机噪声做出了反应。这在训练数据集上效果良好，但在验证集甚至测试集上效果可能并不理想。对于未来的数据也可能同样如此。因此，还会检查不同复杂程度模型在验证数据上的拟合情况。\n\
    \n模型在验证数据上的典型拟合行为是：随着复杂性的增加，拟合程度不断提高，随后进入平台期，然后性能下降。这种下降是由过拟合导致的。因此，一个常见的建议是选择与具有最高验证拟合统计量的复杂度相关的模型。一种推荐的做法是选择性能最好的简单模型。这意味着选择在验证数据下表现最好的模型，但要尽可能保持简单。如果评估误差图显示验证数据集的误差出现平台期，则选择平台期开始处最简单的模型。较简单的模型往往具有更好的泛化能力。复杂模型往往受到输入数据变化的影响，因为它们的结构更复杂。\n\
    \n## 图 2.15: 拟合度与复杂性\n\n![image](img/f0034-01.jpg)\n\n# 偏差-方差权衡\n\n数据科学家的目标是拟合一个低偏差低方差的模型。偏差（Bias）是模型的平均预测值与试图预测的正确值之间的差异，而方差（Variance）是模型对给定数据点预测的可变性。高偏差模型会忽略预测变量与目标之间的重要关系，这是欠拟合的一个例子。然而，高方差模型会对比数据中的随机噪声进行建模，这是过拟合的一个例子。偏差-方差权衡是指数据科学家选择一个既能准确描述数据中关系，又能良好地泛化到新数据的模型的过程。\n\
    \n在模型拟合过的数据上评估模型通常会导致乐观的偏颇评估。例如，一个模型可能在一组数据（训练数据集）上进行拟合，模型的准确率估计为 70%。然而，当该模型应用于一组新数据（验证数据集）时，准确率估计为\
    \ 47%。为什么准确率百分比差异如此大？这是一个过拟合的例子，模型对训练数据集中的特殊之处过度敏感，且未能良好地泛化到验证数据集。\n\n# 总结\n\n\
    本章介绍了数据探索的核心概念、数据探索为何成为任何数据科学项目的关键阶段的原因，以及如何通过审查和探索解决业务问题所需的分析模型信息来解决许多业务问题。数据科学家需要理解在审查创建分析模型以解决业务问题所需的信息时，数据探索是有多重要。数据探索任务有助于公司修复数据质量问题，并将原始数据转换为相关的业务信息。\n\
    \n本章介绍了关于数据准备的特定概念。涵盖了如何合并来自不同来源的数据以创建关于客户和业务问题的更全面视图的概念。涵盖了不同的采样方法、数据划分技术、将原始输入数据转换为相关信息以增强监督和无监督模型的不同方法，以及从原始数据创建新特征以改进模型结果的技术。本章最后讨论了用于选择模型中输入的某些统计衡量标准，以及如何选择良好泛化到新数据的模型。\n\
    \n# 第 3 章：监督模型 – 统计方法\n\n## 本章概述\n\n在本章中，你将学习监督建模。“监督”一词指的是目标已知的观测或案例。根据已知事件，训练一个模型来捕捉输入与目标之间的关系。监督建模中使用了多种技术和算法，包括统计模型和机器学习模型。[第\
    \ 3 章](#Chapter03.xhtml#ch03）涵盖了统计模型，包括线性回归、逻辑回归模型和决策树。[第 4 章](#Chapter04.xhtml#ch04）涵盖了机器学习模型。\n\
    \n本章主要目标包括：\n\n*   解释使用统计监督模型的目的，重点线性回归、逻辑回归和决策树。\n*   描述几种类型的监督模型、将要使用的不同技术或算法，以及在什么种情况下可以使用其中一种来解决业务问题。\n\
    *   解释监督模型的结果。线性回归、逻辑回归和决策树模型都是可解释的。这种可解释性可以根据模型结果驱动业务决策。\n\n## 分类与估计\n\n分类和估计是常见的预测模型类型。分类假设是一个类别变量。目标可以是二分类（0\
    \ 或 1，是或否），也可以是多分类（如 1, 2, 3, 4 和 5，或低、中、高）。例如，此业务事件是否为欺诈交易（是或否）？估计则假设目标是一个连续数字。目标可以取从负无穷到正无穷范围内的任何值。\n\
    \n两种预测模型（分类和估计）都需要以下内容：\n\n*   观测值/案例/实例：\n    *   一个包含描述观测属性的真实案例。\n*   输入/属性/变量：\n\
    \    *   观测值的衡量标准或其属性。可以是关于客户的人口统计信息，如年龄、薪水和婚姻状况。\n*   目标/类别/标签：\n    *   每个观测值的标记或标签。违约或未违约就是一个例子。\n\
    \n用于训练监督机器学习模型的数据由过去的案例或观测值组成，这意味着目标值是已知的。核心思想是寻找预测变量与目标之间的关系。例如，查看过去六个月发生的所有流失案例，哪些输入变量可以解释流失和未流失事件的发生？如果可以根据过去的案例训练模型，并找到哪些输入变量可以解释流失和未流失，那么这个模型就可以预测未来的流失案例。\n"
