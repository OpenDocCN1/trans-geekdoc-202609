    Fraudsters immediately identified an opportunity in this scenario. The fraud occurs
    when the criminals acquire fixed lines to connect to a computer that uses a soft
    switch that is a call switching node in a telecommunications network. From the
    soft switch, the criminals generate robocalls to hundreds of cell phones to obtain
    the prepaid minutes. Of course, the criminals had no intention to also pay for
    the fixed lines. In this case, it is a double fraud against the telecommunications
    company. Criminals can also use altered pay phones to generate these calls, and
    then the prepaid credits, or illegal extensions to switches to do the same, to
    make calls to prepaid cell phones and generate credits to them. Once these prepaid
    cell phones are full of credits, the criminals sell these prepaid phones on the
    black market. In many markets, there is no need to provide any information to
    the carrier when purchasing prepaid subscriber identification module (SIM cards).


    The main goal of the fraud detection model is to detect unusual behavior in receiving
    calls and block the prepaid minutes credit. Some useful variables include no active
    behavior in making calls, exceedingly high and consistent behavior in receiving
    calls, very narrow list of originating numbers, and originating numbers at the
    same place, sometimes at the same address. The `SVM` model classifies the cases
    based on a binary target, `0` or `1`, or in this case, fraud or non-fraud. This
    classification is based on the posterior probability of the event, or the likelihood
    of a prepaid fraud. Based on the posterior probability, the prepaid phone numbers
    with the highest posterior probability are sent to a deny list that cancels their
    prepaid credits. Fraud detection models can save telecommunications companies
    millions of dollars each month. They should be embedded in transactional systems
    to timely monitor the events. They must be closely monitored to assess their performance
    to predict fraud cases. They are often updated frequently, as fraud events change
    often. For all these reasons, the main goal for fraud detection models is the
    performance, rather than the interpretability, of the model. This is a perfect
    case for neural networks, random forests, gradient boosting, and support vector
    machines.


    ## Factorization Machines


    There is a class of business applications that involves estimating how users would
    rate some items. In this business scenario, very often companies do not have much
    information about the users nor about the items. The main goal in this type of
    model is to evaluate relationships between users and items. For example, consider
    a streaming based company selling on-demand movies to users. This company has
    little information about its customers (users) except the movies (items) they
    watch. Users can eventually rate the movies that they watch. If we create a matrix
    considering users and movies, considering the combination of a rating given by
    a user to a movie, this final matrix will be very sparse. We can expect, for example,
    millions of users and hundreds of thousands of movies. Not all customers rate
    all movies. In fact, few customers rate movies, which leads to a huge matrix comprising
    a substantial number of missing ratings. In other words, most of the cells in
    that matrix would be missing. The challenge here is to estimate what would be
    a user’s rating to a particular movie.


    Factorization machines are a new and powerful tool for modeling high-dimensional
    and sparse data. A sparse matrix is the matrix of users and items of the movie
    company we just mentioned. The main goal of factorization machines is to predict
    the missing entries in the matrix. By estimating the missing entries, the company
    would know all ratings for all movies, considering all users. That information
    would allow the company to find items that users would give high ratings and then
    recommend those items to each user (except the ones who have rated those items).


    Factorization machine models are used in recommender systems where the aim is
    to predict user ratings on items. There are two major types of recommender systems.
    One type relies on the content filtering method. Content filtering assumes that
    a set of information about the items is available for the model estimation. This
    set of information is often referred to as side information, and it describes
    the items that will be recommended. By having the side information available,
    the content filtering has no problem in estimating the rating for a new item.


    The second type is based on collaborative filtering. This method does not require
    additional information about the items. The information needed is the matrix containing
    the set of users, the set of items, and the ratings of users to items. The combination
    of all users and items creates a large, sparse matrix containing lots of missing
    ratings. The collaborative filtering method works well in estimating ratings for
    all combinations of users and items. The problem with the collaborative filtering
    method is the inability to estimate added items that have no ratings.


    [Figure 5.4](#Chapter05.xhtml#ch05fig4) shows an example of collaborative filtering.
    In this case, all the information the company has is the existing ratings, that
    can be represented in a matrix. Not all the users rate all the items, so some
    of the ratings will be missing.


    Factorization machines estimate the ratings by summing the average rating over
    all users and items, the average ratings given by a user, the average ratings
    given to an item, and a pairwise interaction term that accounts for the affinity
    between a user and an item. The affinity between users and items is modeled as
    the inner product between two vectors of features: one for the user and another
    for the item. These features are collectively known as factors.


    Matrix factorization techniques are usually effective because they enable data
    scientists to discover the latent features underlying the interactions between
    users and items. The basic idea is to discover two or more matrices that when
    they are multiplied together returns the original matrix.


    Figure 5.4: Table of Users and Ratings with Missing User Ratings


    ![image](Images/f0069-01.jpg)


    Imagine the following scenario as shown in [Figure 5.5](#Chapter05.xhtml#ch05fig5).
    There is a set `U` users and a set `I` items. The matrix `R` of size `|U| X |I|`
    contains all ratings that users have assigned to the items. The number of `K`
    factors can be arbitrarily defined. These `K` factors represent the latent features
    about the relationship between the set `U` of users and the set `I` of items.
    The main goal is to find the two matrices `P(a|U|×K)` and `Q(a|I|×K)` where the
    product of these two matrices approximates `R`: `R ~ P×Q*T*\=R`.


    Each row of `P` represents the strength of the associations between a user `u`
    and the features `k`. Similarly, each row of `Q` represents the strength of the
    associations between an item `i` and the features `k`. To get the prediction of
    a rating of an item `ij` by a user `ui`, we need to calculate the dot product
    of the two vectors corresponding to `ui` and `ij`: `${r\hat{}_{ij} = p_{i}^{T}q_{j}
    = \sum_{k = 1}^{k}p_{ik}q_{kj}`


    One method to obtain the matrices `P` and `Q` is by first initializing these two
    matrices with some values. These values are exactly the existing ratings (users
    rating items). We calculate how different their product is to `R`, and try to
    minimize this difference iteratively. This method is known as `gradient descent`,
    and it aims to find a local minimum of the difference.


    ```

    e_{ij}^{2} = {(r_{ij} - \widehat{r_{ij}})}^{2}

    ```


    The squared error is considered because the estimated rating can be either higher
    or lower than the observed rating.


    Use Case: Recommender Systems Based on Customer Ratings in Retail

