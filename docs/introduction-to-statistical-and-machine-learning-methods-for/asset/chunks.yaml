    # Michael Patetta


    Michael Patetta 自 1994 年以来一直是 `SAS` 的统计学导师。他教授多种课程，包括在 `SAS^® Studio` 中`使用 SAS^®
    Viya® 进行监督机器学习过程`、`使用逻辑回归进行预测建模`、`数据科学统计方法简介`以及`使用 SAS Viya 进行回归方法`。在加入 `SAS`
    之前，Michael 曾在卡罗来纳州州卫生部门工作了 10 年，担任健康统计学家和项目经理。自 1983 年以来，他撰写或合著了 10 篇发表的论文。Michael
    拥有圣母大学的学士学位和北卡罗来纳大学教堂希山分校的硕士学位。在空闲时间，他喜欢在国家公园徒足。


    访问他们的作者页面了解更多关于这些作者的信息，您可以在那里下载免费的书籍摘、访问示例代码和数据、阅读最新的评论、获取更新等：


    - [`support.sas.com/pinheiro`](http://support.sas.com/pinheiro)

    - [`support.sas.com/patetta`](http://support.sas.com/patetta)


    献给 Daniele、Lucas 和 Maitê。


    ## 致谢


    我于 2015 年 12 月 7 日加入 `SAS`，但许多人认为我以前曾在 `SAS` 工作过。并不是正式的。但确实，我与 `SAS` 有着很长的故事。


    我从 2002 年在 `Brasil Telecom` 工作开始使用 `SAS`，当时我创建了一个非常活跃的数据挖掘小组，在整个公司开发监督和无监督模型。2008
    年，我搬到了爱尔兰都柏林，在柏林市大学进行博士后研究。两年期间，我使用 `SAS` 进行社交网络分析。作为研究结果，我在 `Eircom` 部署了 `SNA`
    模型。之后，我在 `SAS Ireland` 工作了六个月，使用了全新的 `OPTGRAPH` 过程。我开发了一些模型来检测汽车保险和纳税人的欺诈行为。


    2010 年，我回到了巴西，有机会在 `Oi` 创建了一个分析实验室。该实验室专注于开发用于营销、欺诈、金融、收集和工程的创新分析。`SAS` 是它的大赞助者/合作伙伴。


    2012 年初，我为 `SAS Turkey` 工作了几个月，为电信公司创建了一些网络分析项目，之后我搬到了法国安纳西，在法国萨伏亚大学进行博士后研究。研究侧重于交通系统，我使用
    `SAS` 开发网络模型。2013 年，我搬到了比利时鲁文，在鲁文根大学（KU Leuven）进行博士后研究。研究侧重于动态网络分析，我也使用 `SAS`
    进行模型开发。2014 年回到巴西后，我在 `EMC2` 和 `Teradata` 担任数据科学家，但大多数时间里仍然在使用 `SAS`，有时会配合开源软件包使用。2014/2015
    年，我在 `Fundação Getúlio Vargas` 完成了博士后研究。研究侧重于人类移动性，你猜怎么着，我使用了 `SAS`。


    最后，多亏 `Cat Truxillo` 的帮助，我在 `SAS` 找到了自己的位置。我加入了教育部门的高级分析小组。在这个小组工作让我学到了很多。要跟上这些才华横溢的头脑的节奏是一项巨大的挑战。我想感谢教育小组多年来教过我的每一个人，但我想特别点出其中的几位：`Chris
    Daman`、`Robert Blanchard`、`Jeff Thompson`、`Terry Woodfield`。


    ## 前言


    Mike Patetta 是我 20 多年的朋友和同事。事实上，1999 年当我申请在 `SAS` 工作时，他是第一个面试我的人。Mike 在教育他人方面极具天赋。他是一个能够深入研究一个陌生的统计学领域，并将满一架的书籍和期刊文章提炼为几节易于学习者的一小时讲座的人。这两位作者之间的合作产生了一门课程——现在是一本书书——它包含了丰富的详细信息，写作风格通易舒适，并充分利用了作者自身经验中的用例。


    Michael Patetta


    （注：源文件中剩余的文本段似乎是上述传记信息的重复片段，已整合到主叙述结构中。）


