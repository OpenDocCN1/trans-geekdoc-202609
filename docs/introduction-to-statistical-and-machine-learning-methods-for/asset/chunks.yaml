    \ a postdoc at Fundação Getúlio Vargas. The research was focused on human mobility\
    \ and guess what, I used SAS.\n\nFinally, thanks to Cat Truxillo, I found my place\
    \ at SAS. I joined the Advanced Analytics group in Education. I have learned so\
    \ much working at this group. It was a big challenge to keep up with such brilliant\
    \ minds. I would like to thank each and every person in the Education group who\
    \ has taught me over those years, but I would like to name a few of them specifically:\
    \ Chris Daman, Robert Blanchard, Jeff Thompson, Terry Woodfield, and Chip Wells.\
    \ To all of you, many thanks!\n\nA special thanks to Jeff Thompson and Tarek Elnaccash\
    \ for a relentless review. Both were instrumental in getting this book done.\n\
    \nThanks to Suzanne Morgen for being an amazing editor and walking us through\
    \ this process so smoothly.\n\nCarlos Andre Reis Pinheiro\n\nThe idea for this\
    \ book originated with Carlos Pinheiro. His experience as a data scientist has\
    \ always impressed me, and this book highlights many of Carlos’s success stories.\
    \ Therefore, I would like to give thanks to Carlos for the inspiration for this\
    \ book. I would like to thanks to the reviewers, Jeff Thompson, Tarek Elnaccash,\
    \ and Cat Truxillo, for their diligent work to make the book technically accurate.\
    \ Finally, I would like to give thanks to Suzanne Morgen, whose edits made the\
    \ book flow as smoothly as possible.\n\nMichael James Patetta\n\nForeword\n\n\
    The book you have open in front of you provides a taste of many data science techniques,\
    \ interspersed with tales of real-world implementations and discoveries. The idea\
    \ for this book originated when my team and I were designing the SAS Academy for\
    \ Data Science. We designed a fairly ambitious training and certification program,\
    \ assuming that people who enroll in the academy would have several years’ experience\
    \ working with data and analytics before they get started.\n\nIn 2015, the SAS\
    \ Academy for Data Science was launched as a self-paced e-learning program. Designing\
    \ the academy’s curriculum required research into the state of data science, discussions\
    \ with faculty training the next generation of data scientists, and shadowing\
    \ consultants who bring the data to life for their clients. Those topics shift\
    \ and evolve over time, and today, it is one of the top data science training\
    \ programs in the world. The curriculum has been adopted by university graduate\
    \ programs on every continent except Antarctica.\n\nWhat we have found in practice,\
    \ however, is that there is a considerably broader audience who want to enroll\
    \ in the academy, including smart people who have experience in a different area,\
    \ but do not have the benefit of several years’ data analysis to guide their thinking\
    \ of how they can apply analytics in their own fields.\n\nFor learners like these,\
    \ where to begin? Carlos Pinheiro and Mike Patetta had the idea to create a short\
    \ course that provides an overview of data science methods and lots of first-hand\
    \ experiences as working data scientists.\n\nCarlos Andre Reis de Pinheiro has\
    \ written extensively in data science, including a Business Knowledge Series course\
    \ (and later, his book) on Social Network Analysis. It was through this course\
    \ that Carlos and I started working together. The first thing you notice about\
    \ Carlos is that he is a born storyteller. The second thing you notice is that\
    \ he loves soccer—I mean he really, really loves soccer. Over time I got to know\
    \ more about this soccer-crazy professor who can keep everyone’s attention with\
    \ amazing stories from his data science research. Carlos has lived and worked\
    \ in (at least) six different countries, and he is fluent in (at least) four languages.\
    \ Here is a person with unstoppable curiosity and drive for growth. In 2016, he\
    \ joined my colleagues and me in the Advanced Analytics Education department at\
    \ SAS, where he has contributed his relentless hard work and ingenuity to solve\
    \ business problems with data and analytics. Today he takes a direct, hands-on\
    \ approach to showing companies what is possible with some data management elbow-grease,\
    \ some well-trained models, and curiosity.\n\nMike Patetta has been a friend and\
    \ colleague for over 20 years. In fact, he was the first person who interviewed\
    \ me, in 1999, when I applied to work at SAS. Mike has a natural gift for educating\
    \ others. He is someone who can dive into an unfamiliar topic in statistics and\
    \ distill a shelf-full of books and journal articles down to a few learner-friendly\
    \ hour-long lectures. The partnership between these two authors resulted in a\
    \ course—and now, a book—that is rich with detailed information, written in an\
    \ easy, comfortable style, with ample use cases from the authors’ own experiences.\n\
    \nData science is fun, or that’s what recruiters would have you believe. Data\
    \ science entails coaxing patterns, meanings, and insights from large and diverse\
    \ volumes of messy data. In practice, that means spending more time than you might\
    \ like on getting access to data, determining what is in a record, how records\
    \ are represented in files, how the file is structured, and how to combine the\
    \ information in a meaningful way with other files. That is, for many of us, most\
    \ of the work a data scientist does. So where is the fun?"
