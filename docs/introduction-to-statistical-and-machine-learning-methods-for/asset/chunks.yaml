    the sequence analysis, the order of the events is quite important. The sequence
    of items purchased by customers in a specific time frame is an example. Data scientists
    can use sequence analysis to identify patterns of purchase in a timeline. Items
    within a sequence rule are purchased in an order and can be offered together or
    in a specific sequence during a sales campaign. Sequence analysis can also reveal
    problems in transactions occurring in a timeline. Steps performed by fraudsters
    in cyber-attacks or problems experienced by users when browsing a website is an
    example. Sequence analysis is discussed in more detail in the next section.


    Confidence and Support Measures


    In the simplest association rules analysis situation, the data consists of two
    variables: a transaction and an item. For each transaction, there is a list of
    items. Typically, a transaction is a single customer purchase, and the items are
    the things that were bought. An association rule is a statement of the form (item
    set A) => (item set B). In other words, an association rule is a pattern that
    states when A occurs, B occurs with a specific probability.


    The aim of the association analysis is to determine the strength of all association
    rules among a set of items. The strength of the association is measured by the
    support and confidence of the rule. The support for the rule A =>B is the probability
    that the two items occur together. The support of the rule A => B is estimated
    by the following equation:


    $\\frac{transactions\\ containing\\ A\\ and\\ B}{all\\ transactions}$'
