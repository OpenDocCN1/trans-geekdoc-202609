    As stated previously, text analytics can solve a problem, or it can add insights
    and more variables to better describe a business problem that will be solved by
    a traditional model. A common business problem that can be addressed by text analytics
    in conjunction with another analytical method is call center optimization.


    A call center needs to optimize the number of agents based on the types of calls
    they receive. Some of the calls might be extremely specific, and the agents need
    to be trained accordingly. This is a very traditional problem in optimization.
    Based on the number of calls by type received, an optimal number of agents can
    be found to address all those calls to reduce the waiting time for the customers.


    However, the call center does not know how many calls are received by type. The
    call center company knows the number of calls, but the agents categorize the call
    at the end of the service using whatever the first option is on the form that
    they complete after each call. This happens because agents want to be available
    as quickly as possible.


    `text analytics` techniques can be used in the solution to call centers. Customers
    contact the call center for a variety of reasons dealing with different topics.
    The call center requires subject matter knowledge to address these different topics.
    Data scientists can use `text analytics` to cluster topic areas and estimate the
    optimal number of call center representatives for each topic. Some of the calls
    are recorded for quality purposes. Specific software can transcribe these recorded
    calls into text. Based on the frequency of terms happening together, some topics
    or clusters can be identified. For example, clusters can be associated with billing,
    cancellation, information request, or upgrades and downgrades, among others. Once
    this classification is done, the call center company has much better estimate
    about the number of calls it receives.


    ### Figure 7.7: Text Analytics to Find Topics


    ![image](Images/f015-01.jpg)


    Before optimizing the number of call center representatives based on the subject
    of calls, the company needs to understand the reason through text analysis on
    the transcripts between customers and representatives.


    ## Summary


    This chapter introduced important methods in unsupervised modeling. Association
    rules analysis, sequence analysis, text analytics, link analysis, and path analysis
    have tremendous value for business applications, helping companies in any type
    of industry to better understand customers, processes, and relationships.


    * What products are purchased together?

    * What products are purchased in a specific sequence in time?

    * What are the main complaints of the company’s customers on social media?

    * What products and services are associated together?

    * When do they drop off a web page?


    All these questions can be answered using unsupervised techniques. Considering
    that we have much more unstructured data than structured data, these specific
    analytical approaches to handle information can be extremely valuable to most
    companies. In the next chapter, we will cover two techniques in a field called
    network science. Network analysis and network optimization can be applied to almost
    any business problem, particularly considering that everything is connected somehow.


