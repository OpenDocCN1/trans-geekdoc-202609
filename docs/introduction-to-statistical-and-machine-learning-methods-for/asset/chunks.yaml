- fmt: '

    This problem is useful in real-life applications such as the design of networks
    like telecommunications, computers, transportation systems, water supply, and
    electrical grids, among others. A spanning tree of a connected undirected graph
    is a subgraph, which is a tree that connects all the nodes together. Given weights
    on the links, a minimum spanning tree is a spanning tree with weights less than
    or equal to the weight of every other spanning tree. Any undirected graph has
    a minimum spanning forest, which is a union of a minimum spanning tree and its
    connected components.


    ## Path Enumeration


    A path in a graph is a sequence of nodes such that from each of the nodes within
    the graph there is a link to the next node in the sequence. An elementary path
    is a path in which no node is visited more than once. A path between two nodes
    in a graph is a path that starts at the origin node and ends at the destination
    node. The origin node is called the source node, and the destination node is called
    the sink node. A network optimization algorithm for path enumeration usually searches
    for all pairs of nodes in the network. That is, it finds all paths for each combination
    of source nodes and sink nodes. This information is useful to understand the level
    of reachability of the network and all routes between nodes considering the available
    links within the network.


    ## Shortest Path


    The shortest path problem aims to find the path between two nodes in a network
    where the sum of the weights of its links is minimized. In other words, the algorithm
    searches the paths that satisfy the objective function. The objective function
    can be defined as minimizing the time, minimizing the distance, minimizing the
    cost, maximizing the strength of the relationship, and so on. Real-life problems
    that can be addressed by the shortest path are public roads networks, public transportation
    systems, traffic planning, sequence of choices in decision making, and minimum
    delay in telecommunications operations, among others.


    A shortest path between two nodes in a network is the path that starts at the
    origin node and ends at the destination node with the lowest total link weight.
    The link weight here can be the time to go from one node to another, the distance,
    the cost, or the strength of the relationship between persons, among other types.
    The origin node is referred to as the source node and the destination node is
    referred to as the sink node.


    ## Transitive Closure


    Transitive closure of a network is a graph such that for all nodes in the network
    there is a link between them. The transitive closure of a network can help efficiently
    answer questions about reachability. Suppose you want to find out whether you
    can get from one node (the origin location) to another specific node (the destination
    location), considering the available links within the network. Data scientists
    can use the transitive closure network optimization algorithm to calculate all
    connections within the network (the existing reachability of the network) and
    simply check for the existence of links between a particular pair of nodes (or
    a route between a specific pair of locations – origin and destination). Transitive
    closure has many applications in real-life problems, including speeding up the
    processing of structured query languages, which are often used in databases.


    ## Traveling Salesman Problem


    The traveling salesman problem (TSP) aims to find the minimum-cost tour in a network.
    A path in a network is a sequence of nodes linked to each other. An elementary
    cycle is a path where the start node and the end node are the same, and no node
    is visited more than once in that sequence. A tour is an elementary cycle where
    every node is visited. The traveling salesman problem aims to find the tour with
    minimum total cost. Again, the minimum cost here can be the actual cost, the distance,
    or the time. The traveling salesman problem can answer questions about optimal
    tours. For example, given a list of locations and the distances between each pair
    of locations, what is the shortest possible route that visits every location in
    my tour exactly once, starting from one location and returning to it? The traveling
    salesman problem has applications in many areas like planning logistics routing,
    manufacturing, and supply chain, among others.


    ## Pattern Match


    Imagine two different networks: `G`, the main network, and `Q`, the query network.
    Subgraph isomorphism is the problem of finding all subgraphs of `G` that are isomorphic
    to `Q`, which means that all subgraphs that have the same topology as graph `Q`.
    Pattern matching addresses the analogous problem in the presence of node and link
    attributes. It is the problem of finding all subgraphs of the network `G` isomorphic
    to the subnetwork `Q` such that all node and link attributes defined in `Q` are
    preserved in subnetworks of `Q` under the isomorphism map. Subgraph isomorphism
    and pattern matching have applications in many areas, including social network
    analysis, fraud detection, pattern recognition, data mining, chemistry, and biology.


    ## Use Case: Smart Cities – Improving Commuting Routes


    A splendid example of network optimization is smart cities. Data scientists can
    use network optimization algorithms to understand human mobility behavior and
    then plan the commuting routes in metropolitan areas. A key data source for this
    type of project is the mobile data provided by telecommunications companies. Subscribers’
    mobile data can be anonymized and aggregated for network optimization. Spatiotemporal
    information – geolocation and time – can be used to create a network of subscribers’
    mobility. A set of network algorithms can be used to describe the network topology
    and its main characteristics and then to improve some specific aspects of the
    network.


    This project investigates the daily commuting routes that workers in Rio de Janeiro
    take. The mobile data – geolocation and time – was provided by a mobile carrier,
    and it was anonymized and aggregated to protect customers’ privacy.


    Based on the most frequent cell tower each subscriber uses overnight and during
    business hours, data scientists can infer their presumed domiciles and their presumed
    workplaces.


    Figure 8.6: Cell Towers Based on Frequency of Visitors


    ![image](Images/f0131-01.jpg)


    Figure 8.7: Cell Tower Based on Frequency of Visitors During Work Time and Nighttime


    ![image](Images/f0132-01.jpg)


    Every time a subscriber moves from one cell tower to another in a specific time
    frame (every hour for example), a movement vector is created. All movement vectors
    from one cell tower to another in a time frame can be summarized to define the
    overall displacements between cell towers. The cell tower is the lower granularity
    in terms of geolocation. Vectors of movements can be summarized to determine displacements
    between pairs of locations, such as neighborhoods, administrative sectors, counties,
    cities, and so on. The major vectors of movements can be selected to estimate
    the overall commuting routes. The number of people traveling throughout these
    major commuting routes can be extrapolated by the number of subscribers, the mobile
    penetration in the area, and the population of the area. Based on that, local
    government agencies can better plan for transportation systems and traffic routes
    by knowing the number of people traveling between all pairs of locations and the
    trajectories that they need to perform to arrive at their destinations.


    Figure 8.8: Most Frequent Commuting Paths


    ![image](Images/f0132-02.jpg)


    ## Summary

