    最后，无论对于链接分析还是路径分析，当稀有事件是目标时，这些技术可能不是最佳选择。这些技术通常根据频率和新颖性来突出案例和交易，在分析过程中可能会遗漏稀有事件。


    ### 案例研究：在线体验


    路径分析可以用于调查和理解零售网站上的客户行为。数据科学家可以检查在网站上冲浪的客户、访问序列、在网页上花费的时间、点击的链接等。然后，数据科学家可以评估客户何时在搜索特定的产品和服务，何时在检查产品可用性，以及何时在比较方案、报价和价格。分析的目标是检测客户到达结账页面并购买产品时的瓶颈、流失和有效转化。如果数据科学家发现从产品信息页面到结账购买页面的访问量显著减少，这可能表明产品信息页面、价格、可用性、质量，甚至是可能的支付方式存在某些问题。数据科学家随后可以与业务部门分析这些结果，并想出解决方案解决客户从产品信息页面导航到结账流失的问题。


    ### 文本分析


    文本是非结构化数据的一种，在数据科学应用中极其有用。数据科学家使用文本分析来分析文本数据、提取相关信息，并将原始数据转换为业务洞察，甚至转换为用于监督或无监督模型的新变量。文本分析可用于创建一组预测变量，这些变量包含关于文本内容的信息。它还可以用于对文档中提到的主题进行聚类。


    文本分析的主要优势之一是能够理解非结构化信息。随着非结构化数据（特别是数字数据）的增长，文本分析的重要性不断增加。通过对一组文档应用文本分析，数据科学家搜索并评估这些文档中包含的术语，并创建可用于其他分析模型（如聚类或分类）的新特征。文本分析是数据科学中的关键领域，拥有许多技术和工具，所有工具旨在从原始文本数据中提取信息。


    #### 图 7.6：词云


    ![image](img/f0113-01.jpg)


    组织内部的非结构化半结构化文本内容正以前所未有的速度增长，从应用程序、记录和业务流程到外部文档、网页、博客、论坛等。非结构化文本指纯文本文档。半结构化文本指的是经过标签增强文本，例如格式化为
    `HTML` 文件的网页文本。这些文件具有特殊标签，以单一方式格式化内容。如果文档在预处理时带有标记以包含特定信息，可能有助于高效的信息检索。`XML`（可扩展标记语言）和
    `JSON`（JavaScript 对象表示法）代表支持文档内属性编码的两种常用语言。许多组织根据数据类型手动对内容进行源标记来存储和管理这些信息。


    非结构化文本数据量是巨大的，特别是在数字世界。为了处理所有这些信息，应该建立一系列具有特定目标的任务。每一步都处理特定的技术，以准备待分析的数据、选择要分析的文本部分以及分析文本本身。例如，文本解析将文本数据处理为词-文档频率矩阵。这一步的计算量非常大。文本过滤器移除所有对识别文档中任何语义内容没有贡献的词性。例如，在分析之前，可以使用过滤器从文档中删除所有作为
    `a`、`an` 和 `the` 的文章。文本主题和文本聚类旨在根据相似性将文档分组成组。主题和聚类之间的主要区别在于文档与组之间的关系。一个文档可以属于多个主题，例如体育和新闻。一个主题包含多个文档。然而，一个文档只能属于一个聚类（要么是体育，要么是新闻）。一个聚类也包含多个文档。在主题和聚类识别过程中创建的系数可对新文档进行分类。这些新文档根据与现有主题和聚类的相似性进行分类。


    文本分析是一个充满活力的研究领域，应用许多。文本分析结果可以添加到传统的建模中以更好地解决业务问题。文本分析结果通常包括相关的文本数据，帮助数据科学家寻找业务问题的解决方案，无论是通过发现问题还是生成新变量来解释问题。


    ### 自然语言处理 (NLP)


    `NLP` 是与文本分析内在相关的概念。`NLP` 可以作为 Siri 或 Alexa 等应用程序的解决方案，也可以作为文本分析软件中的技术。在文本分析软件中，大多数生成解决方案的任务都依赖于
    `NLP`。`NLP` 的主要作用是高效解析文档集。解析创建了用于提取主题或聚类的词表。它还用于情感分析，以理解积极、消性和中性的互动。`NLP` 用于识别文档集中的多个类别。词表中的每行都包含词本身、词的作用（与词关联的词性或概念）、与词相关的统计数据以及词干信息（例如
    `run=running=runs=ran`）。


    `NLP` 面临的最大挑战之一是词义消歧。教科书经常使用“train”一词来说明 `NLP` 的挑战。“train”及其变体可以是名词、动词或形容词。当“train”在火车的语境下时，它是名词（从圣地亚哥出发的
    Amtrak 火车准时到达）。当“train”相对于教育时，它可以是名词（数据科学培训）、动词（培训学生），也可以是形容词（训练练习）。当 `NLP` 算法遇到“train”一词时，它必须根据正确的词性解决任何歧义。“train”在文本分析中的相关性可以通过
    `NLP` 工具（如词图）进行评估。词表告诉你 `train` 在文档集中是以名词形式出现的。词图显示了相关术语，有助于判断如何使用 `train`。


