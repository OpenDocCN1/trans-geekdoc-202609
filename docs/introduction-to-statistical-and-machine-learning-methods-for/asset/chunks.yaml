    A statistical model maps the set of input variables to the target. The model tries
    to create a concise representation of the inputs and the target. It tries to capture
    the relationship between the inputs and the target. For example, when the target
    is a binary target such as churn versus no churn, the model tries to explain,
    based on the input variables, whether the customer is willing to make churn or
    not. What input variables are associated to the yes (churn) and what values? What
    variables are associated to the no (no churn) and what values? The target is the
    outcome to be predicted. The cases are the units on which the prediction is made.


    For example, imagine a company selling various products to its customers over
    time. A sample of customers can be identified with some important characteristics,
    including:


    *   Age

    *   Gender

    *   Average revenue generated over the years

    *   How long the customer has been in the database

    *   Number of products purchased

    *   Marital status

    *   If the customer is a homeowner

    *   How many children the customer has


    A data scientist can analyze this sample containing past transactions and search
    for some correlations between the customer’s characteristics and the event of
    purchasing a new product. For example, what are the customer’s characteristics
    when they purchased a new product in the past? What are these characteristics
    when the customer did not purchase the new product in the past? Imagine also that
    the data scientist can find a clear correlation between these explanatory variables
    and the event of purchasing a new product or not. Let us say, looking at the past
    events, the customers who purchased the new product present some unique characteristics,
    such as they are on average 46 years to 48 years old. It does not matter what
    the gender is as both male and female equally purchased the new product. They
    spend on average USD 270 per month, varying from USD 234 to USD 310. They are
    customers for seven years on average, varying from six to eight. They have two
    products on average, varying from two to three products. They are married or divorced.
    They are all homeowners. They all have kids, on average two children, varying
    from two to three. A data scientist can think of these relationships as a mathematical
    equation to classify new cases.


    For example, if a new event takes place, let us say, a sales campaign for old
    customers who have not purchased this new product. One customer is 49 years old,
    generating on average a monthly revenue of USD 297, has been a customer for 5
    years, has already purchased one product, is married, is a homeowner, and has
    three children. Following that mathematical equation, a data scientist can easily
    compare the characteristics of this customer with all the customers who purchased
    the new product in the past and infer that this customer has a high likelihood
    to purchase the new product. The sales campaign can then target this customer.


    Another customer presents a different set of characteristics, such as 39 years
    old, USD 110 average revenue, eight years as a customer, purchased one product,
    is single, is a homeowner, and has no kids. Based on that mathematical equation,
    a data scientist can infer that this customer has a low probability to purchase
    the new product and then does not target them in the sales campaign.


    By doing this, the company will target just the customers with a high propensity
    to purchase the new product. This will save a substantial amount of money for
    the company in operationalizing the campaign, and it will dramatically increase
    the response rate of the business event. Of course, some customers targeted in
    the campaign will eventually not purchase the new product, and some customers
    not targeted in the campaign would purchase the new product. This is the intrinsic
    error associated with the model. Customers with similar characteristics behave
    very differently. Errors are associated with all models.


    The term supervised is used when the target variable value is known for each case.
    The known target variable value is used to train the model in finding the relationships
    between the inputs and the target. Remember the case that we were looking at before.
    We were trying to understand the relationship between the customer’s characteristics
    and the event of purchase. How we could use all the customer’s characteristics
    to explain the past events of purchase and then use these relationships to predict
    future events, or what customers would be more inclined to purchase a new product?


    ### Figure 3.1: Supervised Model Training Method


    ![image](Images/f0039-01.jpg)


    All the models we are going to see in [Chapters 3](#Chapter03.xhtml#ch03), [4](#Chapter04.xhtml#ch04),
    and [5](#Chapter05.xhtml#ch05) use the exact same approach. Linear regression,
    logistic regression, decision tree, neural network, forest, gradient boosting,
    and support vector machines all use past data to create a concise map to estimate
    the relationships between the input variables to the target values. In other words,
    the models estimate the relationships between the customer’s characteristics to
    the event of purchase and no purchase. Once the relationships are identified,
    and the map is built, the model can be used to predict future events, or to select
    which customers who do not have the product would be more inclined to purchase
    it. Based on that map, which can be a formula, an equation, or a set of rules
    based on thresholds, the company can identify all customers who are more likely
    to purchase the product and approach them in a specific sales campaign. All supervised
    models behave very similarly, using the past known events to estimate the relationships
    between the predictor variables and the target. If a good model is found, that
    model can be used to predict future events.


    Because the purpose of the supervised model is to predict the unknown values of
    the target, the main goal of the supervised model is to generalize to new data
    or future cases. Generalization means the ability to predict the outcome on new
    cases when the target is unknown. That is the reason we use different data sets
    to train the model (capture the relationship between the inputs and the target)
    and validate the model (generalize the model to make good predictions).


    Generalization is also involved in model assessment. The model is fit to the training
    data set, and the performance is evaluated on the validation data set by comparing
    the predicted values to the observed values. Since the target value is known,
    the assessment is straightforward, comparing the values the model predicts for
    the target and the values observed for the target.


    In this chapter, we are going to discuss three distinct types of models:


    *   **Linear Regression**: used to predict continuous targets. One assumption
    of the linear regression model is that there is a linear relationship between
    the inputs and the target.

    *   **Logistic Regression**: used to predict discrete targets such as binary,
    ordinal, and nominal outcomes. One assumption of logistic regression is that there
    is a linear relationship between the inputs and the logits.

    *   **Decision Trees**: used to predict both continuous and categorical targets.
    There is no assumption for the relationships between the inputs and the target.
    Decision trees are universal approximators because theoretically they can capture
    any type of relationship between inputs and target.


    ### Linear Regression


    The relationship between the target and the input variables can be characterized
    by the equation:


    ```

    y[i] = β[0] + β[1]x[i] + ε[i], i = 1 …, n

    ```


    | yi | is the target variable. |

    | --- | --- |

    | xi | is the input variable. |

    | β0 | is the intercept parameter, which corresponds to the value of the target
    variable when the predictor is 0. |

