- fmt: '

    An especially useful subgraph is the reach or ego subnetwork. The reach subnetwork
    is the network considering all nodes connected from and to a subset of nodes.
    For example, starting from a small subset of nodes – let us say the most influential
    nodes, which we can call `leaders` – the reach network algorithm searches for
    all nodes connected to the `leaders` in a single and directed connection and creates
    that ego subnetwork. The primary business interpretation for the reach subnetwork
    is a method to find all customers that can be reached by an initial lead. Starting
    from 1,000 `leaders`, how many customers can they reach out to and spread the
    message for the company?


    ## Connected Components


    Connected components are also extremely useful to find groups of nodes that are
    all connected to each other, even if a multi-step connection is required to reach
    someone else in the group. In a connected component, all nodes can reach out to
    each other in a directed step or connection or throughout several steps going
    through other nodes.


    ## Biconnected Components


    The biconnected component has a quite simple concept. It is a connected component
    that can be split into two or more connected components if a node is removed.
    For example, imagine a group of people that are connected to each other no matter
    the number of steps they need to go through to reach someone else. In other words,
    the importance of my friends and the strength of my connections to my friends
    to their friends. This node is called an `articulation point` or `bridge`. Its
    role in the network is particularly important.


    ## Network Metrics


    The second group of tasks is assigned to compute network metrics. Network metrics
    are used to describe the network topology and its characteristics. It is used
    to understand the role of each node in the network and their importance. It is
    also used to understand the links and how they flow information throughout the
    network. There are many network metrics to be computed.


    Centrality measures quantify the importance of the nodes and the links in a network.
    Each centrality measure has a different interpretation. Some of them can be more
    relevant to certain industries and targeted applications. These metrics are used
    to rank individual nodes and links within the network.


    ### Degree


    `Degree centrality` counts the number of connections a node has. It does not consider
    the strength of the connection or the importance of other nodes. In directed networks,
    this centrality measure also considers the direction of the connections, counting
    the number of incoming connections as `degree-in` and the number of outgoing connections
    as `degree-out`. The `degree` is the sum of `degree-in` and `degree-out`.


    ### Influence


    `First-order influence centrality` describes how many other nodes are directly
    connected to a specific node. This is commonly understood as how many friends
    or connections a node has, and indicates the potential for that node to exert
    influence over the other nodes within the network. However, if the nodes in the
    network are weighted, the first-order influence centrality considers the weight
    of each node and the weight of each link adjacent to the node. It is not just
    how many connections you have but also the strength of the connections and the
    importance of who you relate to. Sometimes the total number of connections is
    less relevant than the importance of the connections. For example, in a communications
    network, a taxi driver might have lots of connections, but all of them are very
    weak. An `account executive` might have fewer connections, but they are strong
    ones and most likely especially important people. The taxi driver would have `degree
    centrality` higher than the `account executive`, and the `account executive` would
    have `influence centrality` higher than the taxi driver. `First-order influence
    centrality` can be used to understand the impact of a business event that requires
    strong relationships between members, such as churn or product adoption.


    `Second-order influence centrality` represents the indirect influence of the node.
    It measures how many friends a node’s friends have—the friends of the friends.
    It helps to illustrate how many nodes can be indirectly influenced by that node.
    Second-order influence centrality considers the weights of the nodes and the weights
    of the links adjacent to a node, as well as the weight of the links to the adjacent
    nodes. For example, in a cell phone network, a subscriber might not have important
    friends and connections, but their friends might have important friends with good
    connections. Their `first-order influence centrality` might be low, but certainly
    `second-order influence centrality` will be high. The second-order influence centrality
    captures this dynamic. In terms of business applications, a node with a high value
    of second-order influence might indicate that the individual is a suitable candidate
    to spread an important message for the company.


    ### Betweenness


    `Betweenness centrality` accounts for how many times a node takes the shortest
    path within the network. The shortest path is the shortest way to get to one point
    in the network from another. “Shortest” might have different connotations such
    as distance, importance, cost, and so on. In optimization, we usually try to minimize
    the cost, the time, or the distance. In this way, the shortest path from node
    A to node E would be the one costing less, or taking less time, or traveling the
    shortest distance.


    Suppose that to reach E from node A, a message needs to pass through other nodes.
    Let’s assume the possible paths are `A→B→E` and `A→C→D→E`. This concept is especially
    important in optimization. For the first path, suppose that the distance between
    `A` and `B` is 10 units, and the cost to take this path is 25 units. The distance
    between `B` and `E` is 5, and the cost is 10. The total distance is 15, and the
    total cost is 35. For the second path, the distance between `A` and `C` is 5 units,
    and the cost is 5 units. The distance between `C` and `D` is 5 units, and the
    cost is 5 units. Finally, the distance between `D` and `E` is 10 units, and the
    cost is 10 units.

