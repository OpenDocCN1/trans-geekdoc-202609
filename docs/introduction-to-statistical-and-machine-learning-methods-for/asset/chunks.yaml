    # Chapter 8: Advanced Topics in Unsupervised Models


    ## Chapter Overview


    In this chapter, you will learn about network analysis and network optimization.
    Unsupervised modeling started in Chapter 6 when we covered different clustering
    techniques. We saw the importance of clustering to segment customers into separate
    groups according to some similarity measure, for example, their consumption behavior.


    In Chapter 7, we covered a few techniques to search for patterns in transactions
    using association rules and sequence association rules to identify items purchased
    together or items purchased in a specific sequence. Also, in Chapter 7, we covered
    an extremely popular data science technique, text analytics. We saw how text analytics
    turns unstructured data into insights to solve business problems or new features
    to feed machine learning models. We also showed how text analytics is important
    considering the digital world, where increased text data is available.


    Now in Chapter 8, we finalize the topics about unsupervised models with some very
    key techniques to understanding relationships between entities. Relationships
    here mean any type of relationship between entities, transactions, calls, emails,
    text messages, referrals, and payments, among many others. Entities can be any
    subject of action, a person, a cell phone, a policy owner, a bank account, a computer,
    and so on. The algorithms assigned to network analysis and network optimization
    help us find the patterns of these relationships.


    The main goals of this chapter are the following:


    * Understand the concepts associated to network analysis and when to apply network
    analysis to solve business problems.

    * Understand the concepts associated with network optimization and when to apply
    network optimization to solve business problems.

    * Describe a statistical unsupervised model using one of the network analysis
    or network optimization techniques described.

    * Interpret the results of a network analysis or network optimization model in
    terms of business goals.


    ## Network Analysis


    Network analysis is the mapping and measuring of relationships and flows between
    nodes. The nodes in the network can be people, groups of people, companies or
    businesses, documents, transactions, computers, and so on. The links can be any
    type of relationship or flow between the nodes. Network analysis enables us to
    identify and understand the importance of certain nodes within a network, or the
    importance of certain links within the network, as well as to identify sub-networks
    or clusters within the entire network.


    Companies use network analysis to address relevant business events such as churn,
    fraud, and facility location in addition to strategies related to increasing sales,
    product adoption, and service consumption.


    Governments use network analysis to tackle terrorism, money laundering, and fraud
    in tax payment or in health care, among many other applications.

