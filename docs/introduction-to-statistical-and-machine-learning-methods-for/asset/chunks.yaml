    # Michael Patetta


    Michael Patetta has been a statistical instructor for `SAS` since 1994. He teaches
    a variety of courses including `Supervised Machine Learning Procedures Using SAS^®
    Viya®` in `SAS^® Studio`, `Predictive Modeling Using Logistic Regression`, `Introduction
    to Data Science Statistical Methods`, and `Regression Methods Using SAS Viya`.
    Before coming to `SAS`, Michael worked in the North Carolina State Health Department
    for 10 years as a health statistician and program manager. He has authored or
    co-authored 10 published papers since 1983. Michael has a BA from the University
    of Notre Dame and a MA from the University of North Carolina at Chapel Hill. In
    his spare time, he loves to hike in National Parks.


    Learn more about these authors by visiting their author pages, where you can download
    free book excerpts, access example code and data, read the latest reviews, get
    updates, and more:


    - [http://support.sas.com/pinheiro](http://support.sas.com/pinheiro)

    - [http://support.sas.com/patetta](http://support.sas.com/patetta)


    To Daniele, Lucas and Maitê.


    ## Acknowledgments


    I joined `SAS` on December 7th, 2015, but many people believed I had worked for
    `SAS` before. Not officially. But indeed, I have a long story with `SAS`.


    I started using `SAS` in 2002 when I was working for `Brasil Telecom`, where I
    created a very active data mining group, developing supervised and unsupervised
    models across the entire corporation. In 2008, I moved to Dublin, Ireland, to
    perform a postdoc at Dublin City University. For two years I used `SAS` for social
    network analysis. I deployed `SNA` models at `Eircom` as a result of my research.
    After that, I spent six months at `SAS Ireland` using the brand new `OPTGRAPH`
    procedure. I developed some models to detect fraud in auto insurance and taxpayers.


    In 2010, I returned to Brazil, and I had the opportunity to create an Analytics
    Lab at `Oi`. The Lab focused on developing innovative analytics for marketing,
    fraud, finance, collecting and engineering. `SAS` was a big sponsor/partner of
    it.


    At the beginning of 2012, I worked for few months with `SAS Turkey` creating some
    network analysis projects for communications companies, and thereafter I moved
    to Annecy, France, to perform a postdoc at `Université de Savoie`, France. The
    research was focused on transportation systems, and I used `SAS` to develop network
    models. In 2013, I moved to Leuven, Belgium, to perform a postdoc at `KU Leuven`.
    The research was focused on dynamic network analysis, and I also used `SAS` for
    the model development. Back to Brazil in 2014, I worked as a data scientist for
    `EMC2` and `Teradata`, but most of the time I was still using `SAS`, sometimes
    with open-source packages. In 2014/2015, I performed a postdoc at `Fundação Getúlio
    Vargas`. The research was focused on human mobility and guess what, I used `SAS`.


    Finally, thanks to `Cat Truxillo`, I found my place at `SAS`. I joined the Advanced
    Analytics group in Education. I have learned so much working at this group. It
    was a big challenge to keep up with such brilliant minds. I would like to thank
    each and every person in the Education group who has taught me over those years,
    but I would like to name a few of them specifically: `Chris Daman`, `Robert Blanchard`,
    `Jeff Thompson`, `Terry Woodfield`.


    ## Foreword


    Mike Patetta has been a friend and colleague for over 20 years. In fact, he was
    the first person who interviewed me, in 1999, when I applied to work at `SAS`.
    Mike has a natural gift for educating others. He is someone who can dive into
    an unfamiliar topic in statistics and distill a shelf-full of books and journal
    articles down to a few learner-friendly hour-long lectures. The partnership between
    these two authors resulted in a course—and now, a book—that is rich with detailed
    information, written in an easy, comfortable style, with ample use cases from
    the authors’ own experiences.


    Michael Patetta


    (Note: The remaining text segments in the source appear to be repetitive fragments
    of the biographical information above and have been integrated into the primary
    narrative structure.)

