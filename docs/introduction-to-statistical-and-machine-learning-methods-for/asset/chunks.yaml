    \  \n\n[http://support.sas.com/patetta](http://support.sas.com/patetta)\n\nTo\
    \ Daniele, Lucas and Maitê.\n\nAcknowledgments\n\nI joined SAS on December 7th,\
    \ 2015, but many people believed I had worked for SAS before. Not officially.\
    \ But indeed, I have a long story with SAS.\n\nI started using SAS in 2002 when\
