    About This Book


    What Does This Book Cover?


    This book gives an overview of the statistical and machine learning methods used
    in data science projects, with an emphasis on the applicability to business problem
    solving. No software is shown, and the mathematical details are kept to a minimum.
    The book describes the tasks associated with all stages of the analytical life
    cycle, including data preparation and data exploration, feature engineering and
    selection, analytical modeling considering supervised and unsupervised techniques,
    and model assessment and deployment. It describes the techniques and provides
    real-world case studies to exemplify the techniques. Readers will learn the most
    important techniques and methods related to data science and when to apply them
    for different business problems. The book provides a comprehensive overview about
    the statistical and machine learning techniques associated with data science initiatives
    and guides readers through the necessary steps to successfully deploy data science
    projects.


    This book covers the most important data science skills, the types of different
    data science applications, the phases in the data science lifecycle, the techniques
    assigned to the data preparation steps for data science, some of the most common
    techniques associated to supervised machine learning models (linear and logistic
    regression, decision tree, forest, gradient boosting, neural networks, support
    vector machines, and factorization machines), advanced supervised modeling methods
    like ensemble models and two-stage models, the most important techniques associated
    to unsupervised machine learning models (clustering, association rules, sequence
    analysis, link analysis, path analysis, network analysis, and network optimization),
    the method and fits statistics to assess model results, different approaches to
    deploy analytical models in production, and the main topics related to the model
    operationalization process.


    This book does not cover the techniques for data engineering in depth. It also
    does not provide any programming code for the supervised and unsupervised models,
    nor does it show in practice how to deploy models in production.


    Is This Book for You?


    The audience of this book is data scientists, data analysts, data engineers, business
    analysts, market analysts, or computer scientists. However, anyone who wants to
    learn more about data science skills could benefit from reading this book.


    What Are the Prerequisites for This Book?


    There are no prerequisites for this book.


    We Want to Hear from You


    SAS Press books are written by SAS Users for SAS Users. We welcome your participation
    in their development and your feedback on SAS Press books that you are using.
    Please visit [sas.com/books](http://www.sas.com/books) to do the following:


    *   Sign up to review a book


    *   Recommend a topic


    *   Request information about how to become a SAS Press author


    *   Provide feedback on a book


    About These Authors


    ![image](Images/f00ix-01.jpg)


    Dr. Carlos Pinheiro is a Principal Data Scientist at SAS and a Visiting Professor
    at Data ScienceTech Institute in France. He has been working in analytics since
    1996 for some of the largest telecommunications providers in Brazil in multiple
    roles from technical to executive. He worked as a Senior Data Scientist for EMC
    in Brazil on network analytics, optimization, and text analytics projects, and
    as a Lead Data Scientist for Teradata on machine learning projects. Dr. Pinheiro
    has a BSc in Applied Mathematics and Computer Science, an MSc in Computing, and
    a DSc in Engineering from the Federal University of Rio de Janeiro. Carlos has
    completed a series of postdoctoral research terms in different fields, including
    Dynamic Systems at IMPA, Brazil; Social Network Analysis at Dublin City University,
    Ireland; Transportation Systems at Université de Savoie, France; Dynamic Social
    Networks and Human Mobility at Katholieke Universiteit Leuven, Belgium; and Urban
    Mobility and Multi-modal Traffic at Fundação Getúlio Vargas, Brazil. He has published
    several papers in international journals and conferences, and he is author of
    Social Network Analysis in Telecommunications and Heuristics in Analytics: A Practical
    Perspective of What Influence Our Analytical World, both published by John Wiley
    Sons, Inc.


